- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - type
  - public evidence
  - what would change the view
  rows:
  - - Elite founder density and investor quality create real frontier-lab option value.
    - thesis
    - Founders from major labs; marquee investors; market still rewards talent-led frontier startups in 2026.
    - A weaker founding bench or loss of strategic investors would materially reduce scarcity value.
  - - The $480M all-cash seed meaningfully improves humans&' ability to buy compute and time.
    - thesis
    - Crunchbase says most proceeds go to compute; 2026 market reports show power, chips, and capacity remain scarce.
    - If compute scarcity eases quickly or humans& lacks privileged procurement terms, this premium shrinks.
  - - humans& is priced inside a real mega-seed frontier cohort rather than in isolation.
    - thesis
    - Thinking Machines and SSI show investors paying $10B-$32B for pre-traction frontier labs.
    - If those comps materially de-rate, the humans& reference set weakens.
  - - There is still no public revenue, customer, pricing, or board disclosure.
    - anti-thesis
    - Official site and adverse coverage show mission and fundraising, not operating proof.
    - Named customers, pilots, pricing, and governance materials would improve supportability.
  - - The quoted $4.48B figure is not clearly resolved as pre-money or post-money in retained public evidence.
    - anti-thesis
    - Retained sources repeat the headline valuation but not the signed terms.
    - The seed term sheet and cap table would resolve dilution and ownership math.
  - - Public AI application comps already offer disclosed revenue at lower market caps.
    - anti-thesis
    - C3.ai generated $250.3M of FY2026 revenue yet carried a ~$1.49B public market cap.
    - If humans& shows real usage and a differentiated product, the public-comp discount becomes less relevant.
  notes: Rows separate scarcity-driven reasons to pay up from the public-proof gaps that still make the current price difficult to bless.
