  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: valuation-basis
    missingEvidence: Signed seed term sheet, exact valuation basis, option-pool treatment, and investor rights.
    whyItMatters: Without the actual paper, the chapter cannot determine whether the quoted $4.48B should be treated as pre-money, post-money, or economically adjusted by special terms.
    diligencePath: Request executed financing documents from management or lead investors and reconcile them to the cap table.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: preference-overhang
    missingEvidence: Cap table, charter, board rights, liquidation preferences, and any side letters.
    whyItMatters: These documents determine dilution, control, and downside protection, which can materially change common-equity supportability even if the headline round price is accurate.
    diligencePath: Request the post-closing cap table, charter, investor-rights agreement, and board deck.
    relatedQuestionRefs:
    - QV029
    - QV030
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: customer-proof
    missingEvidence: Named pilots, design partners, customer references, or usage data.
    whyItMatters: Without product or customer proof, valuation cannot be tied to adoption rather than to pure frontier-lab narrative.
    diligencePath: Request pilot contracts, product analytics, and at least two reference calls.
    relatedQuestionRefs:
    - QV006
    - QV035
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: compute-economics
    missingEvidence: GPU/cloud contracts, credits, reserved capacity, and utilization targets.
    whyItMatters: The replacement-cost and capital-intensity lens depends on whether humans& actually secured advantaged compute access or simply raised money into a scarce market.
    diligencePath: Request vendor contracts, cloud-credit letters, and the infrastructure budget with milestone assumptions.
    relatedQuestionRefs:
    - QV016
    - QV017
    - QV030
    relatedTableRefs:
    - TV005
    - TV006
  - type: missing-source
    severity: material
    topic: operating-metrics
    missingEvidence: Audited headcount, burn, runway, and milestone-based hiring plan.
    whyItMatters: A $480M seed can look abundant or thin depending on burn and hiring velocity; public estimates are not enough.
    diligencePath: Request a monthly burn bridge, hiring plan, and 12-18 month milestone map.
    relatedQuestionRefs:
    - QV005
    - QV035
    relatedTableRefs:
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set-TV004
    missingEvidence: A fuller long-tail list of smaller 2025-2026 AI financings and any undisclosed private rounds omitted from the comparable table.
    whyItMatters: TV004 is intentionally partial because frontier-lab pricing is concentrated in a few visible deals, but omitted private rounds could slightly change the framing of what counts as normal in 2026.
    diligencePath: Expand the comparable set with additional disclosed rounds only after direct source retrieval and keep undisclosed-term deals in notes rather than as false precision rows.
    relatedQuestionRefs:
    - QV008
    - QV011
    - QV020
    relatedTableRefs:
    - TV004
