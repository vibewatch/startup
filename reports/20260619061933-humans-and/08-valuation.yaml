- id: exit-readiness-and-diligence-asks
  title: Exit readiness, kill triggers, and the evidence still missing
  body: >-
    The chapter should not pretend that public evidence has narrowed humans& to a precise intrinsic value. The most important missing items are all document-level: the seed term sheet and cap table, board composition and protective provisions, compute procurement contracts or credits, product-usage evidence, and any pilot or customer references. Without those, investors cannot determine whether the quoted round was simply expensive common-equity paper, a structured security with meaningful downside protection, or a momentum mark that assumed future commercial milestones.


    That also shapes exit logic. At the quoted price, the cleanest path to upside is not financial engineering; it is milestone creation. humans& likely needs a visible product, proof that collaborative AI is more than a philosophical wedge, and evidence that the seed bought more than time. The kill triggers are correspondingly clear: a prolonged no-product state, a follow-on round below the quoted mark, inability to secure or efficiently use compute, or evidence that enterprise buyers prefer automation economics over the company's human-centric framing. Until those questions clear, the right investment posture is to watch the company closely, require much fuller diligence, and avoid calling the current price fair on public evidence alone.
