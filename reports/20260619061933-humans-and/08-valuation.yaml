  - - CoreWeave (Jun 2026)
    - Public AI infrastructure company
    - ~$64.35B market cap with active SEC filing disclosure
    - Shows scarcity value can be enormous when AI infrastructure demand is real and disclosed.
    - Infrastructure exposure, not collaboration-model software; far more operating proof.
  - - 2026 frontier funding climate
    - Sector benchmark
    - Q1 2026 funding to foundational AI doubled all of 2025 and concentrated in a few giants
    - Explains why investors were willing to price options aggressively in 2026.
    - Macro backdrop is not a substitute for company-specific traction.
