- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - Bull
    - humans& ships a differentiated collaboration product in 2026, earns credible pilot or customer proof, and keeps frontier-lab scarcity support intact.
    - $4.5B-$6.5B; current round price can look fair or modestly conservative if humans& begins to resemble a smaller TML-style platform bet.
    - Requires product-market signal, recruiting success, and continued compute access.
    - Low-probability without near-term public proof.
  - - Base
    - humans& remains technically impressive but commercially under-disclosed through the next 12-18 months.
    - $2.0B-$3.5B; public evidence supports a material discount to the quoted round for missing traction and missing documents.
    - No revenue/customer proof; valuation basis unresolved; governance still opaque.
    - Most consistent with public evidence today.
  - - Bear
    - humans& remains pre-product into 2027 or is forced to raise again without clear traction.
    - $1.0B-$2.0B; market re-rates the company closer to public AI-application comps plus cash and team value.
    - Follow-on round below the headline mark, slower hiring, or weak compute economics.
    - Material risk if milestone creation slips.
  notes: Scenario ranges are author estimates derived from public evidence only. They are supportability ranges, not claims about the company's actual internal 409A or next-round pricing.
