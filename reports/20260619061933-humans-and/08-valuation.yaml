- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Round mechanics
    - Signed seed term sheet, exact pre/post-money basis, option pool treatment, and investor rights.
    - Determines ownership sold, dilution math, and whether the headline price overstates common-equity value.
    - Request financing docs directly from management and lead investor.
  - - Cap table and governance
    - Board composition, observer rights, protective provisions, and preference stack.
    - Needed to understand control, liquidation waterfalls, and ability to raise follow-on capital cleanly.
    - Request cap-table export, charter, investor-rights agreement, and board deck.
  - - Compute economics
    - Cloud or chip contracts, credits, reserved capacity, and target utilization.
    - Supports or weakens the replacement-cost and scarcity-premium lens.
    - Request vendor agreements, compute budget, and infrastructure roadmap.
  - - Product and customer proof
    - Prototype access, product roadmap, pilot pipeline, and any named design partners or paying users.
    - Without this, the valuation cannot be tied to commercial evidence.
    - Request demo, usage dashboard, pilot contracts, and reference calls.
  - - Operating model
    - Headcount plan, burn, runway, and milestone-based hiring plan.
    - Tests whether $480M buys enough time to reach real proof before another round.
    - Request monthly burn bridge, hiring plan, and 12-18 month milestone map.
  notes: Every row is a document-driven ask intended to convert today's narrative valuation into a diligenceable underwriting case.
