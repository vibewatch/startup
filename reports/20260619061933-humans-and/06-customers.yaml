- id: TU006
  title: Comparable enterprise AI procurement benchmarks table
  columns:
  - benchmark signal
  - source
  - 2026 observation
  - why buyers care
  - humans& implication
  rows:
  - - Production threshold moving higher
    - Deloitte State of AI
    - Companies with at least 40% of projects in production are set to double in six months
    - Buyers want proof that AI is escaping pilot purgatory
    - humans& will likely need production references faster than a normal stealth lab would.
  - - Returns are concentrated
    - PwC AI fitness study
    - Only 20% of surveyed companies capture 74% of AI-driven returns
    - Novel AI alone is not enough; measurable value is scarce
    - humans& must show workflow-specific ROI rather than philosophy.
  - - Human approval still dominates
    - Bain agentic AI survey
    - Only 7% of companies run fully autonomous agents in production today
    - Enterprise buyers still expect guardrails and human escalation
    - A human-centered positioning can help, but only if it is translated into concrete controls.
  - - Customer trust can erode
    - CNBC and AnswerConnect
    - Consumers report AI service deflection, lower trust, and strong preference for real people in support settings
    - Bad automation can destroy referenceability and renewals
    - humans& needs proof that collaboration improves outcomes without removing the human escalation path.
  - - Usage concentrates in front-door workflows
    - Druid production benchmark
    - Production AI workloads cluster around FAQs, account servicing, help desk, and workplace operations
    - Buyers often begin with narrow, high-volume workflows rather than general-purpose transformation
    - humans& likely needs a similarly sharp initial wedge before claiming broad coordination leadership.
