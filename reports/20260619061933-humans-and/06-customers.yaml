figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: standard
  summary: Likely enterprise adoption path from coordination pain to governed rollout, based on humans& positioning and enterprise AI benchmarks.
  data:
    items:
    - label: Coordination pain recognized
      detail: A team concludes that existing single-user AI tools do not preserve shared context, decisions, or multi-person workflows.
    - label: Design-partner evaluation
      detail: Buyer tests whether humans& can improve communication, shared memory, and decision support in a concrete workflow.
    - label: Workflow and governance design
      detail: Pilot scope, escalation rules, access control, and human override thresholds are defined before wider deployment.
    - label: Pilot in a narrow workflow
      detail: Initial rollout likely starts in one team or one recurring coordination problem rather than a company-wide transformation.
    - label: Production proof and referenceability
      detail: Named users, measurable outcomes, and support evidence determine whether the product is seen as production-ready.
    - label: Renewal and expansion
      detail: The product expands only if it becomes embedded in team routines and improves outcomes without creating trust backlash.
  approximationNotes: This is a synthesized likely buyer journey, not a disclosed humans& customer funnel.
