  evidenceGaps:
  - type: missing-source
    severity: material
    topic: named-customer-proof
    missingEvidence: Named design partners or production customers who can be cited and reference-called, plus the workflow each one uses.
    whyItMatters: Without a named account list, the company’s commercial readiness and customer-reference quality cannot be independently checked.
    diligencePath: Request a customer list with stage, contract type, workflow, spend, and at least three live reference calls.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal timing, and cohort retention by first deployment month or quarter.
    whyItMatters: Durability cannot be underwritten from philosophy or launch buzz; retention is the core evidence for whether the product becomes embedded.
    diligencePath: Request cohort files, renewal schedules, and raw account history for every live pilot or paid deployment.
    relatedQuestionRefs:
    - QU022
    - QU023
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-and-channel-dependence
    missingEvidence: Top-customer revenue share, channel mix, partner dependence, and any minimum-spend or exclusivity terms.
    whyItMatters: A few lighthouse accounts or dependencies can create fragile revenue that looks larger and safer than it is.
    diligencePath: Request top-ten account concentration, pipeline mix, partner contracts, and board reporting on customer concentration.
    relatedQuestionRefs:
    - QU013
    - QU025
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: deployment-outcomes
    missingEvidence: Quantified production outcomes such as time saved, resolution lift, coordination speed, or reduced workflow handoffs.
    whyItMatters: Without workflow-specific outcomes, public sources show only an ambitious thesis rather than evidence that buyers are already receiving measurable value.
    diligencePath: Request before/after KPI readouts for any pilot or production account and tie them to the exact workflow deployed.
    relatedQuestionRefs:
    - QU011
    - QU025
    relatedTableRefs:
    - TU002
    - TU003
  - type: private-evidence-only
    severity: minor
    topic: go-to-market-maturity
    missingEvidence: Current commercial org chart, sales motion, onboarding playbook, and support/escalation staffing.
    whyItMatters: Hiring signals suggest product-first buildout, but they do not prove the actual state of selling, onboarding, and support operations.
    diligencePath: Request org chart, hiring plan, onboarding docs, and any sales-cycle benchmarks for design partners or pilots.
    relatedQuestionRefs:
    - QU020
    - QU025
