chapter:
  number: 6
  title: Customers
  summary: Reviewed public sources support a clear buyer hypothesis for collaboration-centric AI, but they do not support a claim of public customer traction. The main diligence issue is not zero customers proven, but no named production deployment, no retention data, and no externally checkable reference set as of 2026-06-19.
sections:
- id: public-proof-status
  title: Public Customer Proof Status
  body: 'The reviewed public corpus does not support a normal venture shorthand such as ‘strong early customer traction.’ humans&’s official site is still an announcement-style surface rather than a selling surface: the homepage is labeled ‘Announcing humans&,’ the text emphasizes philosophy and human-centered AI, and the page as reviewed does not expose product pricing, customer stories, case studies, reference logos tied to outcomes, or deployment documentation. Independent launch coverage is directionally consistent. TechCrunch described the company as still not having a public product and not yet being clear about the exact commercial form, while Crunchbase said not much was publicly known beyond the team, funding, and mission. Taken together, the strongest evidence-based statement is not that humans& has no customers, but that outsiders cannot verify any named production deployment, pilot-to-production conversion, or measurable customer outcome from public materials reviewed as of 2026-06-19.
    That distinction matters because a stealth company can have private design partners, yet the absence of public proof materially weakens diligence on reference quality, adoption durability, and revenue concentration.'
