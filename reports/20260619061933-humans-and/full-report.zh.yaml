      - number: '8.3'
        title: 牵引力调整情景与公开可比交叉检查
        blocks:
          - type: paragraph
            body: >-
              没有留存来源能让本章把 humans& 与收入挂钩。这很关键，因为公开市场 AI 参照已经展示了收入披露后投资人可以买到什么。C3.ai 报告 2026 财年收入 $250.3 million，6
              月中旬公开市值仍只有约 $1.49 billion。相比之下，CoreWeave 在有公开申报和公开市场流动性的情况下，市值约 $64 billion，显示一旦披露和规模存在，投资人会多么强烈地奖励稀缺 AI
              基础设施。humans& 尴尬地夹在两端之间：明显贵过一家披露收入的上市应用 AI 厂商，明显便宜过一家公开基础设施赢家，同时也比两者都早得多。


              这一缺口解释了为什么牵引力调整后的基准情景应低于所称轮次价格。合理的公开证据区间今天约为 $2.0 billion 至 $3.5
              billion：高到足以尊重创始人质量、投资人质量和算力稀缺，低到足以折价缺失的产品、客户和治理证明。多头情景假设 humans&
              交付一款差异化协作产品，把早期用户转化为真实设计伙伴或客户，并继续像稀缺前沿实验室一样被估值；只有到那时，当前报价才开始显得公平。空头情景更简单：如果公司到 2027 年仍处于产品前阶段，市场可能把它重估到公开
              AI 应用可比公司加现金，而不是前沿神秘感。
