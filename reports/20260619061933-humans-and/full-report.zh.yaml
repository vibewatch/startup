        blocks:
          - type: paragraph
            body: >-
              审阅公开语料不支持「早期客户 traction 很强」这类常见 venture shorthand。humans& 官网仍是 announcement-style surface，而非 selling
              surface：首页标注「Announcing humans&」，文本强调哲学和以人为中心的 AI；按本次审阅，页面没有展示产品定价、客户故事、案例研究、绑定成果的 reference logos
              或部署文档。独立发布报道方向一致。TechCrunch 描述公司仍没有公开产品，确切商业形态也尚不清楚；Crunchbase 称除了团队、融资和使命之外，公开可知内容不多。合在一起，最强的证据型表述不是
              humans& 没有客户，而是截至 2026-06-19 审阅的公开材料，外部人士无法核验任何具名生产部署、pilot-to-production 转化或可衡量客户成果。这个区分很重要，因为隐身公司可以有私下
              design partners，但缺少公开证明会实质性削弱对 reference 质量、采用耐久度和收入集中度的尽调。
