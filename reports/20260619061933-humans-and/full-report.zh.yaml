      - number: '7.4'
        title: 前沿 AI 监管、安全预期和版权不确定性，可能超出公司公开控制面的承载范围
        blocks:
          - type: paragraph
            body: >-
              这里的监管风险并非基于任何已知针对 humans&
              的执法行动，而是来自前沿模型雄心与当前可见合规证据之间的错配。公司的法律页面已经提到出口管制义务、知识产权限制、供应商处理以及公司交易中的转让权；这构成基础法律界面，但还不是前沿模型治理包。与此同时，外部门槛已经抬高。European
              Commission 称，GPAI 义务已于 2025 年 8 月 2 日开始适用，执法权将在 2026 年 8 月 2 日进一步强化，包括系统性风险模型通知和严重事故报告。NIST 的生成式 AI
              profile 聚焦治理、内容溯源、部署前测试和事故披露；2026 International AI Safety Report 则称，可靠的部署前测试正在变难，因为高级模型可以利用评估漏洞。U.S.
              Copyright Office 也仍在处理训练数据、合理使用和许可问题。如果 humans& 正在训练或实质性修改前沿模型，相对于 GPAI 提供方周围正在形成的安全、透明度和版权预期，其现有公开文档仍显单薄。
