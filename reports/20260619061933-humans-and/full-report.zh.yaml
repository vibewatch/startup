companyProfile:
  summary: >-
    humans& 是一家 San Francisco Bay Area 私营公司，2025 年 9 月由 Eric Zelikman 和一小群来自 xAI、OpenAI、Anthropic、Google 及 Stanford
    相关研究社群的 frontier-AI 研究员创立。公开材料把公司定位在人类协作、沟通和集体决策，而不是泛化的单用户自动化；保留报道称，团队正围绕这一论点同步演进模型和产品。公司已在 2026 年 1 月拿到一笔异常庞大的 $480
    million 种子轮融资，报道估值为 $4.48 billion；对一家约 20-28 人的公司而言，这给了它罕见的算力采购和招募能力。核心尽调限制在于：融资可见度仍显著高于经营可见度。保留下来的公开证据尚未显示 live
    customer 部署、实质性产品指标、详细治理条款或公开收入披露。
