        title: 定价和单位经济代理指标：市场锚点存在，但 humans& 的经济性仍属私域
        blocks:
          - type: paragraph
            body: >-
              由于 humans& 没有发布自己的定价，公开层面推演变现的最好办法，是借相邻 frontier 和协作市场。OpenAI 证明 model-serving 业务可通过 token pricing
              直接按用量变现。Slack、Google Workspace、Anthropic 和 Microsoft 证明 AI 增强的协作或生产力产品也可通过 per-seat plans、企业 upsells
              和功能打包变现。Notion 则补充了混合模式：AI agents 和 credits 可以同更广的 workspace subscriptions 并列。这些外部基准不能证明 humans&
              会如何收费，但它们确实说明更广市场已经接受 seat-based 和 usage-based 两种模型。


              更重要的承保点是，市场定价代理指标解决不了 humans& 的单位经济问题。审阅公开记录仍缺少收入、gross margin、CAC、payback、NRR 和 sales-cycle
              数据。因此，即便可比产品证明了商业先例，外部人士仍无法判断 humans& 能否把协作价值转化为足够强的定价，以抵消 frontier-model
              成本。对这家公司而言，今天的公开单位经济故事主要是一组缺失字段，加上少数外部参考点，而不是可审计的 operating model。
