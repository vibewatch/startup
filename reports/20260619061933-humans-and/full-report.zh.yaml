            body: >-
              公开成熟度信号呈现出隐身 startup 可预期的混合状态。积极一面是，公司拥有一批研究员和工程师，他们在开源、论文和个人网站上留下了密集足迹。Zelikman 维护着包含 Quiet-STaR codebase
              的公开 GitHub；Taylor Sorensen、Saurabh Shah、Alexis Ross 和 Niloofar Mireshghallah 的员工页面都明确把他们同 humans&
              相连；至少一个外部 hackathon repo 自称是在 Humans& Product Hackathon 上围绕 collaborative AI agents 构建。这些都是正当的
              developer-signal proxies，说明公司已经能引起技术从业者共鸣，而不只是融资壳。


              弱项在产品完成度。TechCrunch 1 月 25 日画像仍称 humans& 尚无产品，仍在共同演进模型和界面。此后，审阅语料没有浮现公开 app、SDK、API
              reference、客户案例、benchmark dashboard 或 release log。因此，最有证据支撑的路线图结论很窄：到 2026 年 1 月，humans&
