      - number: '1.3'
        title: 资本结构、阶段与覆盖缺口
        blocks:
          - type: paragraph
            body: >-
              humans& 最明确的外部事实，是 2026 年 1 月融资规模。多家主流来源一致称，公司以 $4.48 billion 估值完成 $480 million 种子轮融资；SV Angel 和联合创始人
              Georges Harik 反复被点名为领投方，Nvidia、Jeff Bezos、GV 和 Emerson Collective 反复被列为投资方。公司官网还列出一长串其他支持者，包括
              Forerunner、S32、DCVC、Human Capital、Liquid 2、Felicis 和 CRV。Crunchbase News 还报道称，联合创始人 Andi Peng
              表示大部分新资金将用于算力，这符合公司训练新模型而非只是包装现有模型的计划。


              公开记录尚未给投资人提供一轮如此大融资通常需要的披露层级。可访问来源没有一致说明 $4.48 billion 应视为 pre-money 还是
              post-money；保留来源集合也未独立确认非正式投资人名单中流传的所有名字，包括 Abstract Ventures。同样，公开资料没有 cap table、没有披露董事会构成、没有收入或 ARR
              披露、没有具名客户群，也没有经审计员工数。TechCrunch 的发布报道提到约 20 名员工，Tracxn 随后在 2026 年 5 月给出 28 人估计。这些是有用的规模信号，但不能替代直接尽调数据。
