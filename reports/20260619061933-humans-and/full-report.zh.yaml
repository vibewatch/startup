      - number: '2.4'
        title: 增长驱动与约束：信任、工作流重构和算力纪律同需求一样重要
        blocks:
          - type: paragraph
            body: >-
              市场顺风真实存在：更多企业可用 AI，更多预算流向 agent
              和模型工具，更多行业在测试可由推理模型增强人类专家的工作流。但公开证据同样清楚：增长不会自动转化为可规模化价值。治理成熟度仍低，监管和标准预期却在反向上升，推动买方走向可审计、有人监督的部署。数据访问和集成仍是持续阻碍；任何承诺跨系统研究或编排的产品都尤其受此影响。技能缺口和工作流重构也居于核心；瓶颈往往不是模型，而是包在模型外面的
              operating model。Bain、BCG 和 RAND
              从不同角度反复给出同一条信息：组织在自动化破碎流程、过度假设自主性，或低估上下文、数据和人工运营设计投入时，会错失目标。算力和能源约束又加上一道刹车：推理密集型工作负载成本上升，使效率、路由和评估纪律具备经济重要性。对
              humans& 来说，这意味着可触达市场可以快速增长，但前提是产品帮助买方跨过信任、集成和 operating-model 门槛，而不是再增加一个投机性试点。
