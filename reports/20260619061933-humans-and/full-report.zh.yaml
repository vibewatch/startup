chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与地域足迹
        blocks:
          - type: paragraph
            body: >-
              humans& 于 2026 年 1 月 20 日公开亮相，自称是一家「以人为中心的 frontier AI lab」，核心判断是进步来自信任、连接和协作，而不是用孤立的自主系统取代人。公司自己的材料强调 AI
              的连接组织作用：产品方向被表述为帮助组织和社区更好地一起工作，而不只是自动化单个任务。官方表述把这一论点同长周期和多智能体强化学习、记忆、用户理解，以及研究与产品紧密耦合的开发模式连在一起。这足以证明公司有真实研究议程，但不足以证明商业化准备就绪。


              地点证据方向清楚，但并不完全干净。二级公司目录和 California registry mirror 指向 601 Marshall Street 的 Redwood City
              邮寄和主要地址，而多家媒体和数据库资料使用更宽泛的「San Francisco」简称。后续章节最安全可复用的事实底座是：humans& 是一家 Bay Area 公司，公开备案地址在 Redwood
              City，运营叙事则落在 San Francisco/Palo Alto。确切总部标签因此是一个小但真实的尽调清理项，本章不应夸大。
