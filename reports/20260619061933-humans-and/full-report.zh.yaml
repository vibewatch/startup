      - number: '2.2'
        title: 规模测算视角：相邻大预算存在，但只有一部分可争夺
        blocks:
          - type: paragraph
            body: >-
              公开来源给出几种可用的市场视角，但它们描述的是不同支出层，不应混成一个 TAM 数字。Gartner 的万亿美元级 AI
              预测可作为天花板参考，因为它显示资本流向哪里；但其中大部分是基础设施和供应商产能，并非可直接触达的推理工具支出。更接近 humans& 的是 Gartner
              的模型层和平台层，两者合计意味着模型消费和开发者工具有数百亿美元预算池。IDC 补充了行业化企业视角，显示软件、银行和零售已在 AI 上大量支出，生成式 AI 已成为该预算的实质性部分。再窄一层，AI-agent
              报告显示工作流层快速扩张；HITL 市场报告则为人工复核和模型质量类别给出最低的直接公开边界。这种矛盾有用而非麻烦：类别显然真实存在，但相关市场取决于买方把解决方案归为模型工具、agent
              软件，还是可信人工监督基础设施。
