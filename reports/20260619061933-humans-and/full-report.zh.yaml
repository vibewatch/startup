  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型：变现路径看得懂，当前收入看不见
        blocks:
          - type: paragraph
            body: >-
              humans& 对哲学化产品方向异常明确，对商业机制却异常沉默。官方首页把公司定位为一家以人为中心的 frontier AI lab，专注强化协作；Reuters 称首款产品预计在 2026
              年初推出。TechCrunch 又给出更具体的产品草图，称其是一个用于协作的即时通讯 app 的 AI 版本。公开记录仍没有呈现故事下方最关键的财务层：没有公开定价页，没有企业价目表，没有 API rate
              sheet，没有收入披露，没有客户数量，也没有已实现合同结构的证据。


              这意味着正确的财务框架是可选项，而非 traction。可行收入路径包括 seat subscriptions、按用量计价的 agents 或 APIs、定制企业部署，甚至未来的附属变现；但没有一条能被视为
              humans& 当前事实。本章因此把可见的预期产品界面，同实际变现仍未披露的部分分开。实践中，最强的公开结论是：humans&
              未来可能有几种可信计费模型，但今天没有公开证据显示其中任何一种已经上线或产生可持续收入。
