  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 基于公开证据可支撑的 humans& 区间，与当前报价轮对照。
    data:
      items:
        - label: 熊市情景
          low: 1000
          mid: 1500
          high: 2000
          displayValue: $1.0B-$2.0B
          detail: 公开应用可比公司区间，加上现金、团队和部分前沿溢价。
          tone: risk
        - label: 基准情景
          low: 2000
          mid: 2750
          high: 3500
          displayValue: $2.0B-$3.5B
          detail: 人才与算力期权很重要，但缺少牵引力仍会迫使折价。
          tone: neutral
        - label: 报价轮
          low: 4300
          mid: 4480
          high: 4660
          displayValue: ~$4.48B
          detail: 公开报价反映市场出清价格，尚不能作为公开证据下的公允价值结论。
          tone: warning
        - label: 牛市情景
          low: 4500
          mid: 5500
          high: 6500
          displayValue: $4.5B-$6.5B
          detail: 需要产品证明、早期客户验证，并且前沿实验室稀缺性继续支撑。
          tone: positive
    approximationNotes: 区间是作者基于留存公开证据得出的估算；公开记录没有披露融资条款经济性或牵引力指标，因此刻意保持较宽。
    claimRefs:
      - CV033
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 用投委会风格记分卡评估 humans& 的人才、资本强度、产品证明、治理可见度、估值可支撑性和证据质量。
    data:
      items:
        - label: 创始人 / 人才稀缺性
          value: 5 / 5
          detail: 来自主要实验室和 Stanford 的前沿 AI 团队厚度异常密集。
          claimRefs:
            - CV003
            - CV020
            - CV031
        - label: 资本 / 算力位置
          value: 4 / 5
          detail: 在算力和电力受限的市场里，$480M 全现金种子轮很关键。
          claimRefs:
            - CV004
            - CV021
            - CV022
            - CV023
            - CV024
        - label: 产品证明
          value: 1 / 5
          detail: 截至 2026-06-19，没有留存的公开发布、定价或客户证明。
          claimRefs:
            - CV006
            - CV007
            - CV037
        - label: 治理可见度
          value: 1 / 5
          detail: 没有留存的公开融资条款清单、董事会材料或优先权披露。
          claimRefs:
            - CV033
            - CV034
            - CV044
        - label: 可比支撑
          value: 3 / 5
          detail: TML 和 SSI 解释了投资者为何愿意支付高价，但公开 AI 可比公司仍指向对缺少牵引力的折价。
          claimRefs:
            - CV010
            - CV011
            - CV014
            - CV029
            - CV030
        - label: 证据质量
          value: 2 / 5
          detail: 故事自洽，但太多对估值关键的输入仍未公开。
          claimRefs:
            - CV006
            - CV033
            - CV043
            - CV044
    approximationNotes: 分数是基于留存公开证据的 1-5 启发式判断，不是外部评级。
    claimRefs:
      - CV006
      - CV020
      - CV024
      - CV029
      - CV030
      - CV031
      - CV033
      - CV034
      - CV043
      - CV044
