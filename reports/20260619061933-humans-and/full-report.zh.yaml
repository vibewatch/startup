              能力和可用性应一起设计」的主张上重叠。SSI 在用例上重叠较少，但重要性在于：它争夺的是任何雄心勃勃的 frontier lab 都需要的稀缺研究员、投资人和算力关系。相比之下，Anthropic、OpenAI
              和 xAI 从不同起点竞争：它们已经有公开产品、企业分发和有记录的工具链。因此，买方决定是否同 humans& 合作时，并不只是从 frontier
