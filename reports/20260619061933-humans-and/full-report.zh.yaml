              runway、没有合同细节，也没有在本次审阅公开材料中定位到 issuer-level 融资备案 URL。负面评论还凸显真实商业化风险：买方可能更偏好自动化经济性，而不是 humans&
              正在倡导的增强哲学。从尽调角度，本章因此不能认可收入质量或 runway；它只能说，作为早期 frontier-AI lab，humans& 看起来资金显著充足，但对严肃财务承保而言披露显著不足。
