      - number: '5.2'
        title: 架构与研究 DNA：已验证要素是训练方法、记忆和社交智能目标
        blocks:
          - type: paragraph
            body: >-
              公开技术记录在研究 DNA 上异常丰富，在实现细节上异常稀薄。humans& 明确称该范式需要在长周期强化学习、多智能体强化学习、记忆和用户理解上创新；TechCrunch
              也引用联合创始人的说法，描述一种让更多人类和 AI
              一起互动的训练制度。这是在方法层面有意义的架构证据：公司在传递信号，核心系统应优化重复互动、群体协调和持久上下文，而不只是优化单轮回答质量。但这并不是模型架构、存储设计、retrieval
              stack、fine-tuning recipe、eval harness 或部署拓扑披露。


              创始人和团队背景增强了这套方法 stack 的可信度，但不能证明商业化。Eric Zelikman 的公开履历把他同 Grok reasoning RL 以及 STaR 和 Quiet-STaR
              相连；公司自己的隐藏团队简介显示，团队在 RL、inference、privacy、backend systems 和 data-center engineering
              上都有深度。研究论文本身很重要，因为它们显示公司在自生成推理和 token-level internal thought 上有真实脉络；但在 humans& 披露架构、evals 和使用证据前，投资人仍应把从
              frontier reasoning research 跨到可靠协作产品的跃迁视为未验证。
