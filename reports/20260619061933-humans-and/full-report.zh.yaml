      - number: '4.3'
        title: 资本充足性：种子轮巨大，但算力和招聘仍可能跑在它前面
        blocks:
          - type: paragraph
            body: >-
              这轮种子融资足够大，把财务问题从「公司能否启动」改写为「它能否在资本强度复合前，把异常充足的预发布资本转化为产品和可重复经济性」。Reuters 和 TechCrunch 均印证了 $480 million
              规模和 $4.48 billion 估值；Crunchbase 称该轮全部为现金且无结构化条款，大部分资金将投入模型训练算力。这一组合很关键：它意味着 humans&
              融资主要是为了购买时间、人才和基础设施，而不是扩张一个已经验证的业务。TechCrunch 和 Tracxn 的公开员工数信号也表明，团队很可能在融资后开始扩张，这会在收入可见前增加薪酬和协调成本。


              因此，现金充足性不能从标题数字直接推出。一支不到 30 人的团队手握 $480 million 看起来资金极其充裕，但 frontier-model 预算会通过 GPU
              access、研究薪酬、数据基础设施和发布延迟快速吸收资本。公开记录没有披露现金余额、burn、runway、cloud commitments、partner credits、leases
              或类债务义务。因此，财务上诚实的结论是：humans& 近期大概率有相当大的试验空间，但外部人士仍无法核验，在扣除算力和规模化承诺后，标题资本还剩多少真实 runway。
