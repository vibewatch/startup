      - number: '8.2'
        title: 融资背景：先例融资、人才溢价与重置成本逻辑
        blocks:
          - type: paragraph
            body: >-
              核心估值问题不是 humans& 是否融到了真金白银；它已经融到。更难的问题是，这轮钱代表什么。最佳公开证据显示，投资人买的是人才、时间和算力获取的组合，而不是收入或客户证明。Crunchbase
              报道称种子轮为全现金，大部分资金将用于算力。J.P. Morgan 和 Colliers 都描述了一个 2026 年环境：推理需求、GPU
              内存、电力和数据中心容量都稀缺，而且越来越多被提前锁定。这让一张大额前置资产负债表具备战略意义：在供给受限的前沿 AI 市场，资本不只是燃料，也是插队能力。


              不过，重置成本逻辑本身无法一路推到 $4.48 billion。公开记录显示团队仍小——发布时约 20 人，5 月下旬估计 28 人——因此所称轮次隐含每名员工约 $160 million 至 $224
              million 的异常价值区间。只有当投资人相信团队能把稀缺研究人才和算力采购能力足够快地转化为差异化前沿平台，这个数字才说得通。公开可比公司支持这种下注的存在，但不支持其确定性。Thinking
              Machines 和 SSI 说明，市场确实会为创始人密度和前沿实验室期权付高价；但缺少公开条款书、董事会结构和优先权栈，外部投资人仍无法准确判断，为支撑这个价格究竟买到了哪些经济权利。
