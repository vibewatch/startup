      - number: '7.5'
        title: 公开缓释因素存在，但决定性证据仍藏在尽调要求和否决标准之后
        blocks:
          - type: paragraph
            body: >-
              文件里确实有实质缓释因素：humans& 融到异常大额资本，组建了高水准创始团队，提出差异化协作论点，维护法律 /
              隐私界面，并保留外部招聘渠道。这些并不轻。但它们不同于硬证据，不能证明公司能够安全商业化、穿越人才战招聘、锁定耐久算力，并在规模化时满足正在成形的 GPAI
              义务。因此，正确的尽调姿态应是有条件判断，而不是二元判断。投资人应坚持索取最新产品与部署备忘录、模型所有权和提供方栈地图、具名责任人与评估流程的安全合规包、覆盖 Eric Zelikman
              之外继任安排的组织架构图，以及解释公司如何避免毛利或时间表冲击的算力采购视图。如果管理层无法拿出这些材料，审慎解读不是上行空间消失，而是估值已经要求一层公开记录尚未支撑的执行证明。
