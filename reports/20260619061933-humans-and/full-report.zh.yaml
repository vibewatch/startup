      - number: '2.3'
        title: 买方、用户与付款方：预算在 AI 从试点进入核心工作流时出现
        blocks:
          - type: paragraph
            body: >-
              采用广度已不再是核心问题，规模化企业价值才是。McKinsey 和 Deloitte 都显示 AI 使用已经广泛，但只有少数组织从实验推进到更深的企业转型。这一模式意味着 humans&
              不太可能先卖进泛化创新预算。更可能的买方，是已经拥有重复、重判断工作流的负责人：中央 AI 平台团队、CIO 或 CTO 组织、CDAO 牵头的治理团队、R&D 负责人、知识管理负责人，以及
              professional-services
              运营方。用户是最接近模型失败模式和工作流瓶颈的人：研究员、开发者、分析师、复核员、合规团队，以及同时需要自动化和人工覆盖的运营人员。付款方会随用例变化。有些公司预算在中央 AI
              或数据平台条线；另一些公司则由能把采购同更快研究、更低复核成本或更可靠决策挂钩的职能负责人出钱。最可能的早期采用路径，是从有边界的工作流试点，走向更深的工具集成，最后才进入多团队规模化部署。
