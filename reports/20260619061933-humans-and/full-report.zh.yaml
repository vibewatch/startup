      - number: '5.4'
        title: 信任、隐私与控制姿态：网站隐私披露明确，产品控制仍大多未披露
        blocks:
          - type: paragraph
            body: >-
              今天最好的公开信任证据在 marketing site，而不在产品文档里。humans& 称网站主要用于信息展示，不使用 analytics 或 ad-tracking pixels，不使用 tracking
              cookies 做画像，并把自动数据收集限制在用于可靠性和安全性的基本 server logs。同一通知解释说，求职申请经 Ashby 路由，Google Fonts
              会带来有限第三方请求暴露。这些表述有用，因为它们显示公司至少在发布隐私底线并承认第三方处理方。团队构成也通过 Niloofar Mireshghallah 关于 contextual
              integrity、persistent memory 和 information-flow norms 的论文，包含明确隐私专长。


