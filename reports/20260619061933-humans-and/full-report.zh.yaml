      - number: '1.2'
        title: 创始人、领导层与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              当前对 humans& 最强的承保论点是 founder-market fit。Eric Zelikman 是 CEO 兼联合创始人，保留来源支撑一个一致画像：早期 xAI 贡献者、Stanford
              博士候选人，以及参与 STaR 和 Quiet-STaR 推理工作的研究员。其余已披露创始阵容对种子期公司而言也异常强。Andi Peng 被呈现为 Anthropic 后训练和强化学习操盘手；Georges
              Harik 带来 Google 早期时代的深厚产品和商业化经验；Yuchen He 的官方简介把他同 xAI 及此前 OpenAI 工作相连；Noah Goodman 则补上 Stanford
              学术和认知科学视角。纸面上，这套组合很贴合公司所说的尝试：把 frontier-model 研究同协作产品论点融合。


              同一组证据也指向集中的执行风险。公开治理披露稀少；目前最好的 corporate-registry mirror 不仅把 Eric Zelikman 列为 CEO，也列为 CFO 和
              Secretary。这对一家刚成立的 startup 并不罕见，但意味着关键人物依赖在公司刚完成 mega-seed
              轮的时点异常高。尽调问题因此不是团队是否有才华，而是这种高度集中的创始结构能否承接多十亿美元估值随之而来的运营、治理和招聘要求。
