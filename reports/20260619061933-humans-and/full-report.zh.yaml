      - number: '6.3'
        title: 耐久度、扩张与集中度
        blocks:
          - type: paragraph
            body: >-
              行业基准说明了 buyers 在 humans& 声称拥有 durable adoption 前很可能要求什么。G2 和 Capterra 等 review-platform 来源显示，协作和 AI
              软件采购围绕具体工作流覆盖、用户评价、部署适配、访问控制和可衡量生产力提升。Deloitte、PwC、Bain、Druid、Microsoft、RAND 和 BCG 的生产基准都指向同一方向：许多组织在试验
              AI，但相对少数能把 pilots 转成规模化、产生价值的生产系统；在高后果工作流中，人工监督仍居核心。CNBC 和 AnswerConnect 的负面客服证据进一步说明，若 AI
              产品把用户挡回去、移除升级路径或无法交付可信结果，买方会惩罚。对 humans& 而言，这意味着商业瓶颈不太可能只是哲学差异化。闸门证明项更窄、更运营化：具名 design partners、生产
              references、工作流特定成果、续约行为、升级设计，以及产品改善协调却不触发其他 AI
              部署遭遇过的信任和采用反弹的证据。换句话说，下一步证明不是再写一篇关于团队协作未来的思想文章，而是一张能经受审查的客户事实短清单：账户名称、部署阶段、工作流前后对比、合同结构、续约时点，以及人类必须留在 loop
              中的条件。
