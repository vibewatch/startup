            body: >-
              即便存在客户证明缺口，可能买方假设仍然可读。TechCrunch 反复把 humans& 定位为协作和沟通层，而不是泛化单用户聊天机器人，并明确类比 Slack、Google Docs 和 Notion
              式多人上下文。官网也用强化组织和社区、重新思考人们如何同 AI
              互动，以及围绕长周期和多智能体强化学习、记忆、用户理解构建来呼应这一定位。这些信号首先指向企业知识工作团队：协调、共享上下文和决策记忆都是昂贵痛点；TechCrunch
              还称创始人暗示企业和消费者应用并存，这扩大了长期 TAM，却让近期 go-to-market
              故事更浑浊。公开招聘信号仍集中在研究、产品和财务，而不是明确投放的销售、客户成功或支持岗位，说明公司商业运营可能仍处于规模化前。实践中，本章因此把细分市场行视为由定位推导出的假设，而非已验证付费客户
              cohorts。这对尽调重要，因为细分市场假设能解释产品可能适配哪里，却回答不了核心商业问题：谁签约、谁部署、谁续约、谁愿意做
              reference。在这些答案公开或私下提供前，买方地图应被视为尽调的方向性脚手架，而不是可重复 go-to-market engine 的证明。
