      - number: '8.4'
        title: 退出准备度、否决触发器与仍缺失的证据
        blocks:
          - type: paragraph
            body: >-
              本章不应假装公开证据已把 humans&
              收窄到一个精确内在价值。最重要的缺失项都在文件层面：种子轮条款书和股权表、董事会构成和保护性条款、算力采购合同或额度、产品使用证据，以及任何试点或客户推荐。没有这些，投资人无法判断所称轮次究竟只是昂贵的普通股文件，还是带有实质下行保护的结构化证券，抑或是一个假设未来商业里程碑的动量标记。


              这也塑造退出逻辑。在所称价格下，最清晰的上行路径不是金融工程，而是创造里程碑。humans& 可能需要一个可见产品、协作式 AI
              不只是哲学切口的证明，以及种子轮买到的不止时间的证据。否决触发器也相应清晰：长期无产品、后续轮次低于所称估值、无法锁定或高效使用算力，或有证据显示企业买家更偏好自动化经济性，而不是公司以人为中心的叙事。在这些问题厘清前，正确投资姿态是密切观察公司、要求更完整尽调，并避免仅凭公开证据就称当前价格公平。
