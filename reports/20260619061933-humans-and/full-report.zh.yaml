        title: 里程碑、隐身状态与负面背景
        blocks:
          - type: paragraph
            body: >-
              时间线很短，但事件密集。保留公开来源支撑一条序列：2025 年 9 月成立，2025 年 10 月完成注册并出现融资传闻，2026 年 1
              月出现条款和隐私通知，随后公开脱离隐身状态并正式宣布种子轮。媒体报道又补充了几个重要的发布后节点：2026 年初计划推出首款产品，2026 年 3 月确认法律实体仍处于 active 状态，2026 年 6
              月第三方估计显示团队按已募集资本隐含标准看仍然很小。由于公开产品界面仍然很薄，除非出现更新的一手证据，本章应作为后续章节引用的标准时间线。


              这条时间线也带有主要负面信号。Reworked 的怀疑性报道认为，humans& 在没有已发布产品的情况下以独角兽身份亮相，其估值即便放在 2026 年 AI
              融资市场也不寻常，而且企业激励仍可能把「以人为中心」的系统拉向自动化和裁员。这并不能推翻公司的论点，但它是一个可信警示：资本和创始人履历到得比 product-market fit
              证明更快。后续尽调因此不应重点问 humans& 能否融资，而应问它能否把协作式 AI 哲学变成客户真正部署并持续使用的产品。
