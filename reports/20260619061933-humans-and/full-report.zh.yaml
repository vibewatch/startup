  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、反论点与建议
        blocks:
          - type: paragraph
            body: >-
              humans& 作为故事很容易理解，作为业务却很难承保。多头论点对这么年轻的公司而言异常强：来自 Anthropic、xAI、Google、OpenAI 和 Stanford 的精英校友；$480 million
              的全现金种子轮弹药；Nvidia 和其他明星投资人；以及一个显然奖励前沿 AI 期权价值的 2026 年市场。公开可比公司显示，在商业证明到来前，投资人曾愿意为稀缺创始人密度支付巨大价格。Thinking
              Machines Lab 在仍基本处于产品前阶段时，种子轮报价从报道的 $10 billion 移至 $12 billion；SSI 在没有商业发布的情况下达到 $32
              billion。在这种背景下，humans& 的 $4.48 billion 估值不是类别错误；它是同一笔前沿实验室交易的较小版本。


              反论点是，公开证据仍停在履历、理念和资本。humans& 没有留存公开收入、没有具名客户、没有公开董事会材料、没有定价、没有经审计员工数，也没有清晰公开条款书来解决所称 $4.48 billion
              究竟是投前还是投后。负面报道直言，公司在证明产品前就以独角兽以上价格出现；公开 AI
              公司可比案例也显示，支撑这个头条的运营证明很少。仅基于公开证据，建议是继续研究，中等信心，高风险，估值立场为偏高。这个价格或许可以用稀缺驱动的期权价值解释，但尚不能由牵引力支撑。
