  - id: TV005
    title: 投资逻辑破裂与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 看不到产品或试点证明
        - 下一融资窗口前，仍没有公开产品、设计伙伴或试点证据。
        - 这一轮会变成纯粹的时间和人才押注，期权性收缩。
        - 向下重估，避免按报价一级市场标记付费。
      - - 下轮降价或持平
        - 下一次外部定价处在或低于报价 $4.48B 水平。
        - 表明稀缺性溢价没有复利成证明。
        - 视为全面估值重置，并从公开基本面重新承销。
      - - 算力获取不及预期
        - 尽管计划重算力，却没有特权额度、供应获取或高效利用的证据。
        - 削弱巨额种子轮最清晰的战略理由之一。
        - 削减期权价值溢价，并突出现金消耗风险。
      - - 自动化经济性压过协作逻辑
        - 买方反馈或早期用例显示，客户更偏好劳动力替代，而不是 humans& 的增强叙事。
        - 削弱核心产品切入点，并压窄定价权。
        - 除非客户证明反驳，否则把立场转向昂贵。
      - - 治理和纸面条款仍不透明
        - 即便公司寻求更多资本，仍没有董事会、股权结构或条款清单可见度。
        - 无法准确建模持股、稀释和下行保护。
        - 无论技术多令人兴奋，建议都维持继续研究。
    notes: 这些触发项是公开证据代理指标，用来判断稀缺性驱动的估值故事何时开始破裂。
    claimRefs:
      - CV024
      - CV033
      - CV034
      - CV037
      - CV041
      - CV043
      - CV044
  - id: TV006
    title: 最终尽调请求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 轮次机制
        - 已签署种子轮条款清单、精确投前 / 投后基础、期权池处理和投资人权利。
        - 决定出让持股、稀释计算，以及报道价格是否高估普通股价值。
        - 直接向管理层和领投方索取融资文件。
      - - 股权结构和治理
        - 董事会构成、观察员权利、保护性条款和优先权结构。
        - 需要用来理解控制权、清算瀑布，以及能否顺利募集后续资本。
        - 索取股权结构表导出、章程、投资人权利协议和董事会材料。
      - - 算力经济性
        - 云或芯片合同、额度、预留容量和目标利用率。
        - 支撑或削弱重置成本与稀缺性溢价视角。
        - 索取供应商协议、算力预算和基础设施路线图。
      - - 产品和客户证明
        - 原型访问、产品路线图、试点管线，以及任何具名设计伙伴或付费用户。
        - 没有这些，估值无法绑定商业证据。
        - 索取演示、使用量仪表盘、试点合同和客户访谈。
      - - 运营模型
        - 员工数计划、现金消耗、续航期和基于里程碑的招聘计划。
        - 检验 $480M 是否买来足够时间，让公司在下一轮前跑出真实证明。
        - 索取月度现金消耗桥、招聘计划和 12-18 个月里程碑地图。
    notes: 每一行都是文件驱动的请求，目标是把今天的叙事估值转成可尽调的承销案例。
    claimRefs:
      - CV006
      - CV024
      - CV033
      - CV034
      - CV035
      - CV044
