        title: 格局分层
        blocks:
          - type: paragraph
            body: >-
              humans& 不应只同某一家具名 startup 比较。真实格局至少分成四类方案。第一类是 Thinking Machines Lab 和 Safe Superintelligence 这样的 frontier
              neo-labs，它们同 humans& 在精英团队履历、巨额融资轮，以及先定义新模型架构再交付广泛部署企业产品的意愿上重叠。第二类是 Anthropic、OpenAI 和 xAI 等 incumbent
              model vendors，它们已经开放产品、定价、透明度和开发者界面。第三类是 Scale AI、Labelbox、Braintrust 和 Arize 等 enabling vendors；它们不需要赢得
              frontier-model 竞赛也能拿到预算，因为它们今天就销售评估、RLHF、可观测性和人工反馈工作流。第四类是现状：围绕公开 API 和工具内部自建。最后一类重要，因为 humans&
              公开材料强调新的协作中心模型，但买方已经可以把现有模型、eval stack 和工作流软件组合成可接受替代品。
