  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：一个狭窄的监督与研究切口，而非泛化 AI TAM
        blocks:
          - type: paragraph
            body: >-
              对 humans& 而言，市场边界应围绕这样一类系统：把 frontier-model 推理同人工复核、评估、编排和领域判断结合起来。公开记录对这一框架的支撑，远强于对公司可覆盖整个 AI
              经济的任何说法。HITL 来源把最接近、可观察的类别定义为把人工反馈嵌入模型训练、验证和决策的软件、硬件与服务，尤其适用于错误成本、可解释性或问责性重要的场景。较新的批评把边界收得更紧：许多所谓 HITL
              部署本质上是 AI-in-the-loop
              系统，人类仍是最终决策者，模型只是加速器。这一区分对尽调很重要，因为它表明买方通常为可信决策支持、可审计性和工作流可靠性付费，而不是为原始自主模型输出付费。结果是，市场边界落在协作研究、评估和质量保障工作流上；更广的基础设施和
              consumer-AI 支出只能作为背景。
