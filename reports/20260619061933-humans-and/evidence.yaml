evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: valuation-basis-gap
    missingEvidence: >-
      Primary company or lead-investor confirmation stating whether the reported $4.48 billion figure is pre-money or
      post-money.
    whyItMatters: >-
      Valuation basis changes dilution math and how later chapters should benchmark the round against comparable
      financings.
    diligencePath: Request the signed financing summary, term sheet, or explicit company or investor clarification on round math.
    relatedQuestionRefs:
      - QO015
  - type: conflicting-data
    severity: minor
    topic: location-precision
    missingEvidence: Primary confirmation of the operating headquarters label versus the Redwood City mailing and principal address.
    whyItMatters: >-
      Later chapters should not oscillate between Redwood City, Palo Alto, and San Francisco without a canonical
      explanation.
    diligencePath: >-
      Ask management for the primary office location, office count, and whether the Redwood City filing address is
      operational or administrative.
    relatedQuestionRefs:
      - QO022
  - type: private-evidence-only
    severity: material
    topic: traction-metrics
    missingEvidence: Current headcount, revenue, ARR, named customers, and pilot or deployment metrics.
    whyItMatters: >-
      The public story is dominated by financing size; without operating metrics, capital efficiency and traction cannot
      be underwritten.
    diligencePath: >-
      Request a KPI pack with current employee count, burn, customer pipeline, pilots, and any early usage or retention
      data.
    relatedQuestionRefs:
      - QO020
      - QO021
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance-and-cap-table
    missingEvidence: Board roster, protective provisions, cap table, and any investor governance rights from the seed round.
    whyItMatters: >-
      Founder concentration and mega-seed financing make control rights, board composition, and downside protections
      central diligence items.
    diligencePath: Request the cap table, charter, investor-rights agreement, board minutes, and current officer delegation matrix.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: investor-list-completeness
    missingEvidence: >-
      A full primary investor list or signed company financing summary confirming all named and rumored participants,
      including Abstract Ventures.
    whyItMatters: Syndicate composition affects signaling, follow-on capacity, and the reliability of later stakeholder mapping.
    diligencePath: Request the company financing announcement deck, cap table, or a lead-investor-confirmed participant list.
    relatedQuestionRefs:
      - QO016
      - QO027
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: reasoning-tooling-sizing
    missingEvidence: >-
      Public revenue splits or procurement datasets that separate reasoning-model evaluation, observability,
      prompt-management, and human-review tooling from broader AI-agent or HITL categories.
    whyItMatters: >-
      Current public market pages mix infrastructure, agent software, and human-oversight services, so any
      company-specific market model built from them alone will overstate precision.
    diligencePath: >-
      Obtain paid analyst tables, enterprise procurement line items, or comparable private-vendor revenue splits that
      isolate evaluation/observability and human-review tooling.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: blocking
    topic: humans-and-sam
    missingEvidence: >-
      Management disclosure on initial target buyer, workflow, deployment architecture, pricing motion, and whether
      humans& sells models, tooling, services, or a bundled platform.
    whyItMatters: >-
      Without a disclosed wedge, the chapter can bound adjacent budget pools but cannot isolate a defensible
      company-specific SAM or SOM.
    diligencePath: >-
      Request a product demo, ICP definition, pipeline segmentation, and budget-owner map during management diligence
      before attempting a bottom-up SAM/SOM.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-benchmark
    missingEvidence: >-
      Comparable contract values, seat pricing, usage pricing, or services attach rates for enterprise
      human-collaborative AI research systems.
    whyItMatters: >-
      Humans& could monetize as software, managed evaluation, expert services, or a hybrid model, and each path implies
      very different revenue capture from the same adjacent budget pool.
    diligencePath: >-
      Request design-partner contracts, pilot statements of work, or third-party procurement references to anchor
      willingness-to-pay and conversion assumptions.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM003
  - type: stale
    severity: material
    topic: humans-product-proof
    missingEvidence: A post-January 2026 official product page, launch note, or pricing surface from humans&.
    whyItMatters: >-
      The reviewed public evidence about product readiness stops in late January 2026, so current commercial maturity
      cannot be verified as of runDate.
    diligencePath: Request the latest product deck, launch memo, and any public or customer-facing docs published after January 2026.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: humans-customers
    missingEvidence: Named customers, pilots, deployments, or partner announcements tied to humans&.
    whyItMatters: >-
      Without customer proof, humans& differentiation, switching costs, and GTM quality remain mostly narrative rather
      than observed execution.
    diligencePath: >-
      Ask management for customer references, signed design-partner agreements, and any launch or procurement
      announcements.
    relatedQuestionRefs:
      - QP024
      - QP025
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: humans-switching-costs
    missingEvidence: Usage data showing whether humans& owns workflow memory, user graphs, or other sticky collaboration context.
    whyItMatters: >-
      That evidence is what would distinguish a durable coordination platform from another model wrapper or
