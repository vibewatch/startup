      - number: '7.2'
        title: Key-person dependence on Eric Zelikman and a tiny elite team keeps execution risk high
        blocks:
          - type: paragraph
            body: >-
              The founding roster is strong enough to explain investor excitement, but it also makes the company
              fragile. Public headcount signals still point to a sub-30-person company as of late May 2026, despite
              ambitions that span frontier-model research, product design, safety, and commercialization. Bizprofile’s
              California-registry mirror goes further by listing Eric Zelikman as CEO, CFO, and Secretary at the same
              entity, which signals formal concentration even if those titles eventually broaden in practice. OpenReview
              identifies Zelikman as a Stanford PhD student, and Reuters ties him to xAI and reasoning-focused
              reinforcement-learning work, so the key-person risk is not about founder quality; it is about founder
              load. The public record still does not surface a named compliance lead, commercial operator, safety owner,
              or deep management bench beyond the founding group. For a frontier-AI company attempting long-horizon
              collaboration products, that means a small number of people may be carrying product vision, model
              strategy, governance, fundraising, and hiring simultaneously.
