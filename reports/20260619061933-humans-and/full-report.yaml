      - number: '8.2'
        title: 'Financing context: precedent financings, talent premium, and replacement-cost logic'
        blocks:
          - type: paragraph
            body: >-
              The core valuation question is not whether humans& has raised real money; it has. The harder question is
              what kind of money the round represents. The best public evidence says investors were buying a mix of
              talent, time, and compute access rather than revenue or customer proof. Crunchbase reported the seed was
              all-cash and that most proceeds would fund compute. J.P. Morgan and Colliers both describe a 2026
              environment in which inference demand, GPU memory, power, and data-center capacity are all scarce and
              increasingly pre-committed. That makes a large up-front balance sheet strategically meaningful: in a
              supply-constrained frontier-AI market, capital is not just fuel, it is queue-jumping capacity.


              That said, replacement-cost logic does not get all the way to $4.48 billion by itself. The public record
              shows a still-small team — roughly 20 people at launch and an estimated 28 by late May — so the quoted
              round implies an extraordinary value-per-employee range of roughly $160 million to $224 million. That only
              makes sense if investors believed the team could convert scarce research talent and compute purchasing
              power into a differentiated frontier platform fast enough to matter. Public comps support the existence of
              that bet, but not its certainty. Thinking Machines and SSI show the market does pay up for founder density
              and frontier-lab optionality; the absence of a public term sheet, board structure, and preference stack
              means outside investors still cannot tell exactly what economic rights were purchased to justify the
              price.
