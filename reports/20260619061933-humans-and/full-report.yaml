      - number: '2.4'
        title: 'Growth drivers and constraints: trust, workflow redesign, and compute discipline matter as much as demand'
        blocks:
          - type: paragraph
            body: >-
              The market tailwind is real: more enterprises have access to AI, more budget is moving toward agents and
              model tooling, and more sectors are testing workflows where reasoning models could augment human experts.
              But the public evidence is equally clear that growth does not convert automatically into scalable value.
              Governance maturity remains low, while regulatory and standards expectations are moving in the opposite
              direction, pushing buyers toward auditable and human-supervised deployments. Data access and integration
              remain persistent blockers, which is especially relevant for any product that promises cross-system
              research or orchestration. Skills gaps and workflow redesign are also central; the bottleneck is often not
              the model but the operating model wrapped around it. Bain, BCG, and RAND all reinforce the same message
              from different angles: organizations miss targets when they automate broken processes, over-assume
              autonomy, or underinvest in context, data, and human operating design. Compute and energy constraints add
              a final brake by raising the cost of reasoning-heavy workloads and making efficiency, routing, and
              evaluation discipline economically important. For humans&, this means the addressable market can grow
              quickly, but only if the product helps buyers clear trust, integration, and operating-model hurdles rather
              than adding another speculative pilot.
