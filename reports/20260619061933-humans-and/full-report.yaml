      - number: '1.3'
        title: Capital structure, stage, and coverage gaps
        blocks:
          - type: paragraph
            body: >-
              The defining external fact about humans& is the scale of its January 2026 financing. Multiple mainstream
              sources agree that the company raised $480 million in seed funding at a $4.48 billion valuation, with SV
              Angel and co-founder Georges Harik repeatedly named as leads and Nvidia, Jeff Bezos, GV, and Emerson
              Collective repeatedly named among the investors. The company’s own site adds a long tail of additional
              backers, including Forerunner, S32, DCVC, Human Capital, Liquid 2, Felicis, and CRV. Crunchbase News also
              reports that co-founder Andi Peng said most of the new capital would be spent on compute, which fits the
              stated plan to train new models rather than merely wrap existing ones.


              What the public record does not yet give investors is the level of disclosure normally expected for a
              round this large. Accessible sources do not consistently clarify whether the $4.48 billion figure should
              be treated as pre-money or post-money, and the retained source set does not independently confirm every
              name circulating in informal investor lists, including Abstract Ventures. Likewise, there is no public cap
              table, no disclosed board composition, no revenue or ARR disclosure, no named customer base, and no
              audited headcount figure. TechCrunch’s launch coverage referenced roughly 20 employees, while Tracxn later
              showed a 28-employee estimate in May 2026. Those are useful scale signals, but not substitutes for direct
              diligence data.
