      - number: '1.4'
        title: Milestones, stealth status, and adverse context
        blocks:
          - type: paragraph
            body: >-
              The chronology is short but eventful. Retained public sources support a sequence from September 2025
              founding, to October 2025 incorporation and fundraising rumors, to January 2026 terms and privacy notices,
              public emergence from stealth, and the formal seed announcement. Media coverage then adds a few important
              post-launch markers: the early-2026 intent to ship a first product, the March 2026 confirmation that the
              legal entity remains active, and the June 2026 third-party estimate that the team is still small by the
              standards implied by the capital raised. Because the public product surface remains thin, this chapter
              should be treated as the canonical chronology of record for later chapters unless fresher primary evidence
              emerges.


              This timeline also carries the main adverse signal. Reworked’s skeptical coverage argues that humans&
              debuted at unicorn status with no launched product, that its valuation is unusual even in the 2026 AI
              funding market, and that enterprise incentives could pull “human-centric” systems toward automation and
              headcount reduction anyway. That does not disprove the company’s thesis, but it is a credible warning that
              capital and founder pedigree have arrived faster than proof of product-market fit. Later diligence should
              therefore focus less on whether humans& can raise money and more on whether it can turn its
              collaborative-AI philosophy into a product customers actually deploy and keep.
