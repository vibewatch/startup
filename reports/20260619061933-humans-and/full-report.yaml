      - number: '7.5'
        title: Public mitigations exist, but the decisive ones still sit behind diligence asks and kill criteria
        blocks:
          - type: paragraph
            body: >-
              There are real mitigants in the file: humans& raised an extraordinary amount of capital, assembled a
              high-caliber founding team, states a differentiated collaboration thesis, maintains legal/privacy
              surfaces, and preserves an external recruiting channel. Those are not trivial. But they are not the same
              as hard proof that the company can commercialize safely, recruit through the talent war, secure durable
              compute access, and satisfy emerging GPAI obligations at scale. The right diligence posture is therefore
              conditional rather than binary. Investors should insist on a current product and deployment memo, a
              model-ownership and provider-stack map, a safety-and-compliance package naming owners and evaluation
              routines, an org chart with succession coverage beyond Eric Zelikman, and a compute procurement view that
              explains how the company will avoid margin or timetable shocks. If management cannot produce those
              artifacts, the prudent interpretation is not that the upside disappears, but that the valuation already
              demands a level of execution proof the public record does not yet support.
