  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: a narrow oversight-and-research wedge, not generic AI TAM'
        blocks:
          - type: paragraph
            body: >-
              For humans&, the market should be bounded around systems that combine frontier-model reasoning with human
              review, evaluation, orchestration, and domain judgment. The public record supports that framing much more
              clearly than it supports any claim that the company can address the whole AI economy. HITL sources define
              the closest observable category as software, hardware, and services that integrate human feedback into
              model training, validation, and decision-making, especially where error costs, explainability, or
              accountability matter. A newer critique pushes the boundary even tighter by arguing that many so-called
              HITL deployments are really AI-in-the-loop systems in which the human remains the final decision-maker and
              the model functions as an accelerator. That distinction matters for diligence because it suggests the
              buyer is often paying for trusted decision support, auditability, and workflow reliability rather than for
              raw autonomous model output. The result is a market boundary centered on collaborative research,
              evaluation, and quality-assurance workflows, with broad infrastructure and consumer-AI spending treated
              only as background context.
