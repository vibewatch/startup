      - number: '2.2'
        title: 'Sizing lenses: large adjacent budgets exist, but only some are contestable'
        blocks:
          - type: paragraph
            body: >-
              Public sources give several usable market lenses, but they describe different layers of spend and should
              not be blended into one TAM number. Gartner’s trillion-dollar AI forecasts are informative as a ceiling
              because they show where capital is flowing, yet most of that total is infrastructure and vendor capacity,
              not directly addressable reasoning-tooling spend. Closer to humans& are Gartner’s model and platform
              layers, which together imply a tens-of-billions budget pool for model consumption and developer tooling.
              IDC adds a sector-specific enterprise lens by showing that software, banking, and retail are already
              spending heavily on AI and that generative AI has become a material share of that budget. Narrower still,
              AI-agent reports show a rapidly expanding workflow layer, while HITL market reports provide the lowest
              direct public bound for human-review and model-quality categories. The contradiction is useful rather than
              problematic: the category is clearly real, but the relevant market depends on whether buyers classify the
              solution as model tooling, agent software, or trusted human-oversight infrastructure.
