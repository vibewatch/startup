            body: >-
              The central underwriting problem is not that humans& lacks pedigree or capital; it is that the public
              record still proves financing much more clearly than product adoption. Reuters said in January 2026 that
              the company expected to launch a product early that year, and multiple outlets confirmed the $480 million
              seed at a $4.48 billion valuation. Yet the official surface reviewed for this chapter still resolves
              mainly to legal, privacy, and recruiting information rather than a public pricing page, customer list,
              product manual, or usage dashboard. Reworked’s skeptical read is therefore important: it argued that
              humans& reached unicorn status with no product and that the valuation reflects pedigree and strategic
              positioning more than proven market fit. That gap matters because at this price, delay is not neutral. If
              the first visible commercialization evidence arrives late, or arrives without customer proof, the downside
              is not merely slower execution; it is multiple compression against a story that has already been priced as
              unusually ambitious for a three-month-old frontier lab.
