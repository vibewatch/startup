  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - No visible product or pilot proof
        - No public product, design-partner, or pilot evidence by the next financing window.
        - Turns the round into a pure time-and-talent bet with shrinking optionality.
        - Re-rate downward and avoid paying the quoted primary mark.
      - - Down-round or flat follow-on
        - Next external price comes in at or below the quoted $4.48B level.
        - Signals that the scarcity premium did not compound into proof.
        - Treat as a full valuation reset and re-underwrite from public fundamentals.
      - - Compute access disappoints
        - No evidence of privileged credits, supply access, or efficient utilization despite compute-heavy plan.
        - Undermines one of the clearest strategic justifications for the huge seed.
        - Cut option-value premium and emphasize cash-burn risk.
      - - Automation economics dominate collaboration thesis
        - Buyer feedback or early use cases show preference for labor substitution over humans&' augmentation narrative.
        - Weakens the core product wedge and narrows pricing power.
        - Move stance toward expensive unless customer proof contradicts it.
      - - Governance and paper terms remain opaque
        - No board, cap-table, or term-sheet visibility even as the company seeks additional capital.
        - Prevents accurate modeling of ownership, dilution, and downside protection.
        - Keep recommendation at research-more regardless of technical excitement.
    notes: These triggers are public-evidence proxies for when a scarcity-driven valuation story would start to break.
