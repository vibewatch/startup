      - number: '3.4'
        title: Switching Barriers and Adverse View
        blocks:
          - type: paragraph
            body: >-
              The adverse case should be stated plainly. humans& may be directionally right that collaboration,
              communication, and long-horizon coordination are under-served by today’s single-user chat products. But
              the reviewed evidence does not yet show that humans& owns the only path to that outcome. Incumbent model
              vendors already provide public reasoning and enterprise surfaces, while eval and observability vendors
              provide the surrounding workflow infrastructure. That makes internal build and multi-homing credible. If
              humans& eventually creates sticky switching costs, they are most likely to come from workflow memory,
