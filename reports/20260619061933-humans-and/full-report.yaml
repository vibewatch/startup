      - number: '7.3'
        title: Compute, Nvidia, and frontier labor markets create concentrated dependency risk
        blocks:
          - type: paragraph
            body: >-
              humans& is not presenting as a lightweight workflow app; public funding coverage repeatedly frames it as a
              compute-intensive frontier effort. Crunchbase News reported that the company plans to spend the majority
              of the seed capital on compute for training models, while Reuters and other outlets highlighted Nvidia as
              a backer. TechStartups went a step further by saying humans& would work closely with Nvidia on both
              hardware and software, though that detail was not corroborated on the company’s own site and should
              therefore be treated cautiously. External market context raises the severity. CNBC’s 2025 talent-war
              reporting says the small pool of frontier-model specialists is now receiving multimillion-dollar packages
              because only a handful of firms can afford to build models that cost billions. Reuters and Forbes add that
              employers are prioritizing niche AI skills and that there is a shortage of people who understand
              frontier-lab data pipelines. For humans&, the implication is straightforward: even with ample seed
              capital, timelines can slip if compute access, training-data operations, or top technical hires tighten at
              the same time.
