      - number: '8.3'
        title: Traction-adjusted scenarios and public comp cross-check
        blocks:
          - type: paragraph
            body: >-
              No retained source lets this chapter tie humans& to revenue. That matters because public-market AI
              references already show what investors can buy when revenue is disclosed. C3.ai reported $250.3 million of
              fiscal 2026 revenue and still carried only about $1.49 billion of public market capitalization in
              mid-June. CoreWeave, by contrast, sat around $64 billion with public filings and public-market liquidity,
              showing how strongly investors reward scarce AI infrastructure once disclosure and scale exist. humans&
              sits awkwardly between those poles: materially richer than a listed application-AI vendor with disclosed
              revenue, materially cheaper than a public infrastructure winner, and still much earlier than both.


              That gap is why a traction-adjusted base case should sit below the quoted round price. A reasonable
              public-evidence range is roughly $2.0 billion to $3.5 billion today: high enough to respect founder
              quality, investor quality, and compute scarcity, but low enough to discount the missing product, customer,
              and governance proof. The bull case assumes humans& ships a differentiated collaboration product, converts
              early users into real design partners or customers, and continues to be valued like a scarce frontier lab;
              only then does the current quote begin to look fair. The bear case is simpler: if the company remains
              pre-product into 2027, the market can re-rate it toward public AI application comps plus cash rather than
              frontier mystique.
