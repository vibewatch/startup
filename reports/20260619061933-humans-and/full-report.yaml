      - number: '1.2'
        title: Founders, leadership, and key-person risk
        blocks:
          - type: paragraph
            body: >-
              The strongest underwriting argument for humans& today is founder-market fit. Eric Zelikman is the CEO and
              co-founder, and the retained sources support a consistent profile: early xAI contributor, Stanford PhD
              candidate, and researcher associated with STaR and Quiet-STaR reasoning work. The rest of the disclosed
              founding bench is also unusually strong for a seed-stage company. Andi Peng is presented as an Anthropic
              post-training and reinforcement-learning operator; Georges Harik brings deep product and commercialization
              history from Google’s early era; Yuchen He’s official bio ties him to both xAI and prior OpenAI work; and
              Noah Goodman adds a Stanford academic and cognitive-science angle. On paper, that combination maps well to
              the company’s stated attempt to blend frontier-model research with a collaboration product thesis.


              The same evidence also points to concentrated execution risk. Public governance disclosure is sparse, and
              the best available corporate-registry mirror lists Eric Zelikman not only as CEO but also as CFO and
              Secretary. That is not unusual for a brand-new startup, but it does mean key-person dependency is
              unusually high at the exact moment when the company has already raised a mega-seed round. The diligence
              question is therefore not whether the team is talented; it is whether such a concentrated founding
              structure can absorb the operational, governance, and recruiting demands that now come with a
              multi-billion-dollar valuation.
