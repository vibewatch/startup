      - number: '3.2'
        title: Frontier Labs vs. Public Platforms
        blocks:
          - type: paragraph
            body: >-
              The closest conceptual peers to humans& are Thinking Machines Lab and, to a lesser degree, SSI. Thinking
              Machines overlaps on its explicit human-AI collaboration rhetoric and on its claim that frontier
              capability and usability should be designed together. SSI overlaps less on use case but matters because it
              is competing for the same scarce researchers, investors, and compute relationships that any ambitious
              frontier lab needs. By contrast, Anthropic, OpenAI, and xAI compete from a different starting point: they
              already have public products, enterprise distribution, and documented tooling. That means a buyer deciding
              whether to work with humans& is not choosing only among frontier research narratives. It is also deciding
              whether to wait for a stealth lab to ship something unique or to buy an existing API or enterprise
              platform now. This split is strategically important because humans& public wedge is narrower and more
              specific than the generic reasoning or coding market, but its commercial readiness is still behind the
              incumbents that already sell into enterprises.
