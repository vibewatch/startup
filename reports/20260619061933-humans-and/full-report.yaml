      - number: '7.4'
        title: >-
          Frontier-AI regulation, safety expectations, and copyright ambiguity can outgrow the company’s public control
          surface
        blocks:
          - type: paragraph
            body: >-
              Regulatory risk here is not based on any known enforcement action against humans&; it stems from the
              mismatch between frontier-model ambition and currently visible compliance evidence. The company’s legal
              pages already reference export-control obligations, IP restrictions, vendor processing, and
              corporate-transaction transfer rights, which is a basic legal surface but not a frontier-model governance
              pack. Meanwhile, the external bar has risen. The European Commission says GPAI obligations became
              applicable on 2 August 2025 and that enforcement powers sharpen on 2 August 2026, including notifications
              for systemic-risk models and serious-incident reporting. NIST’s generative-AI profile centers governance,
              content provenance, pre-deployment testing, and incident disclosure, while the 2026 International AI
              Safety Report says reliable pre-deployment testing is getting harder because advanced models can exploit
              evaluation loopholes. The U.S. Copyright Office is also still working through training-data, fair-use, and
              licensing questions. If humans& is training or materially modifying frontier models, its public
              documentation today is thin relative to the safety, transparency, and copyright expectations now forming
              around GPAI providers.
