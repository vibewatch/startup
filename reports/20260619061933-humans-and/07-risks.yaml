  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: management-bench
    missingEvidence: Current org chart with direct reports, named functional owners, and succession coverage beyond the founding team.
    whyItMatters: Public pedigree does not show whether product, safety, GTM, and compliance bandwidth are actually covered.
    diligencePath: Request org chart, board materials naming owners, and headcount by function.
    relatedQuestionRefs:
    - QR010
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: model-ownership-and-stack
    missingEvidence: A clear description of whether humans& is training a frontier model, materially modifying one, or primarily building on third-party models plus the related provider stack.
    whyItMatters: This determines the true size of compute, safety, and GPAI compliance exposure.
    diligencePath: Request architecture memo, provider contracts summary, and model taxonomy by product component.
    relatedQuestionRefs:
    - QR014
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: blocking
    topic: safety-governance
    missingEvidence: Feature- or model-level evaluation procedures, incident disclosure path, and named compliance owners.
    whyItMatters: Frontier-AI risk cannot be responsibly underwritten from mission language alone once GPAI, copyright, and safety expectations are rising.
    diligencePath: Request safety framework, eval summaries, incident runbook, and legal/compliance ownership memo.
    relatedQuestionRefs:
    - QR023
    relatedTableRefs:
    - TR001
    - TR002
  - type: missing-source
    severity: blocking
    topic: customer-proof
    missingEvidence: Named customers, pilots, design partners, launch metrics, or deployment evidence that shows actual commercial traction and any concentration risk.
    whyItMatters: Without customer proof, the commercialization thesis and valuation support remain mostly narrative.
    diligencePath: Request customer list, reference calls, launch KPI dashboard, and any booked or contracted revenue evidence.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR002
    - TR005
