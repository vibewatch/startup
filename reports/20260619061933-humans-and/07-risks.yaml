- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Commercialization opacity
    - Public launch and customer proof
    - Management cannot show live product, named deployments, or usage KPIs despite the January 2026 launch expectation
    - Treat valuation support as broken and downgrade from execution risk to thesis-break risk
  - - Key-person concentration
    - Bench expansion and delegated ownership
    - No credible org chart, succession plan, or non-founder operating owners for safety, GTM, and infrastructure
    - Do not underwrite scale assumptions off founder pedigree alone
  - - Compute dependency
    - Procurement and provider diversity
    - No concrete compute plan, no disclosed contingencies, or evidence of a single choke-point supplier relationship
    - Assume timeline and margin sensitivity are materially worse than the headline cash balance implies
  - - Safety / regulatory readiness
    - Governance pack
    - No model taxonomy, evaluation process, incident-response path, or AI Act ownership memo
    - Treat frontier-AI compliance as a blocking diligence item before price discussion
  - - Valuation expectations
    - Roadmap-to-proof bridge
    - Management cannot reconcile current valuation expectations with milestones for launch, customers, and commercialization
    - Model downside as multiple compression, not just slower revenue timing
  - - Partner / vendor surface
    - Critical workflow resilience
    - Key recruiting, hosting, or model-provider processes sit with third parties without documented backup plans
    - Increase dependency discount and require vendor-risk review
  notes: 'These kill criteria are intentionally monitorable: each asks for a document, metric, or owner rather than a generic reassurance.'
