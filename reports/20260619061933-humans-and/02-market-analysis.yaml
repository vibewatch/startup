chapter:
  number: 2
  title: Market Analysis
  summary: 'Public evidence supports a real but layered market around human-collaborative AI research, evaluation, and oversight: the narrowest directly observed spend is single-digit billions today, adjacent agent-workflow budgets are ramping quickly, and larger model-platform pools exist but are only partially contestable. Adoption breadth is no longer the main question; workflow redesign, governance, data integration, and compute economics are.'
sections:
- id: market-boundary
  title: 'Market boundary: a narrow oversight-and-research wedge, not generic AI TAM'
  body: For humans&, the market should be bounded around systems that combine frontier-model reasoning with human review, evaluation, orchestration, and domain judgment. The public record supports that framing much more clearly than it supports any claim that the company can address the whole AI economy. HITL sources define the closest observable category as software, hardware, and services that integrate human feedback into model training, validation, and decision-making, especially where error costs, explainability, or accountability matter. A newer critique pushes the boundary even tighter by arguing that many so-called HITL deployments are really AI-in-the-loop systems in which the human remains the final decision-maker and the model functions as an accelerator. That distinction matters for diligence because it suggests the buyer is often paying for trusted decision support, auditability, and workflow reliability rather than for raw autonomous model output. The result is a market boundary
    centered on collaborative research, evaluation, and quality-assurance workflows, with broad infrastructure and consumer-AI spending treated only as background context.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM007
  - CM040
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: sizing-lenses
  title: 'Sizing lenses: large adjacent budgets exist, but only some are contestable'
  body: 'Public sources give several usable market lenses, but they describe different layers of spend and should not be blended into one TAM number. Gartner’s trillion-dollar AI forecasts are informative as a ceiling because they show where capital is flowing, yet most of that total is infrastructure and vendor capacity, not directly addressable reasoning-tooling spend. Closer to humans& are Gartner’s model and platform layers, which together imply a tens-of-billions budget pool for model consumption and developer tooling. IDC adds a sector-specific enterprise lens by showing that software, banking, and retail are already spending heavily on AI and that generative AI has become a material share of that budget. Narrower still, AI-agent reports show a rapidly expanding workflow layer, while HITL market reports provide the lowest direct public bound for human-review and model-quality categories. The contradiction is useful rather than problematic: the category is clearly real, but the relevant
    market depends on whether buyers classify the solution as model tooling, agent software, or trusted human-oversight infrastructure.'
