  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to humans&
  rows:
  - - Human-collaborative AI research, evaluation, and oversight
    - Model evaluation, prompt / workflow management, human review, QA, observability, governance, and expert-in-the-loop research workflows
    - Generic chatbot seats, pure infrastructure, generic cloud GPU resale, consumer AI
    - CTO / CIO / CDAO, research leaders, risk owners
    - Closest directly evidenced wedge
  - - Enterprise AI agent platforms
    - Domain agents, orchestration, workflow automation, copilots tied to CRM / ERP / IT / knowledge workflows
    - Simple FAQ bots or consumer assistants with no enterprise workflow integration
    - Business-function leaders plus central IT / AI platform teams
    - Important adjacent distribution layer
  - - Model and AI platform budgets
    - AI models, DS / ML platforms, application-development tooling, model-serving support
    - Semiconductors, generic devices, unrelated SaaS modules
    - Central AI platform, engineering, developer-platform owners
    - Upper budget pool that can fund a humans&-like product
  - - Broad AI infrastructure and devices
    - AI-optimized IaaS, servers, network fabric, semiconductors, AI devices
    - None within this broad lens
    - Hyperscalers, OEMs, infrastructure buyers
    - Useful context ceiling but mostly non-addressable
  - - Status-quo substitutes
    - Internal analyst or research teams, consultants, RPA, legacy knowledge tools, manual review queues
    - N/A
    - The same operating budget already paying for today’s workflow
    - Real competitor set for early pilots
  notes: Rows are boundary lenses rather than additive submarkets. The chapter intentionally separates directly observable oversight/research spend from broader AI categories that are only partially contestable.
