- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Broad AI adoption but shallow scaled value
    - mixed
    - Current
    - Creates many pilot opportunities but slower conversion into durable platforms
    - Ask what share of pipeline is pilot tooling versus production-critical spend
  - - Agentic workflow expansion
    - driver
    - 2025-2027
    - Expands adjacent demand for orchestration, review, and evaluation layers
    - Test whether humans& is positioned as agent infrastructure, research copilot, or managed service
  - - Human-oversight and compliance requirements
    - driver
    - Current and tightening
    - Makes auditable review, logging, and escalation features more valuable
    - Map which target workflows are high-risk under customer policies or regulation
  - - Skills gap and weak workflow redesign
    - constraint
    - Current
    - Can delay deployment even when budgets exist
    - Request evidence that early users can absorb the product without large change-management burden
  - - Data access and integration friction
    - constraint
    - Current
    - Blocks cross-system reasoning and raises implementation cost
    - Inspect connectors, security model, and time-to-first-use on customer data
  - - Autonomy expectations outrunning reality
    - constraint
    - Current
    - Buyers may resist products sold on full-autonomy economics
    - Validate how much human review the product assumes in steady state
  - - Vendor lock-in, IP, and trust concerns
    - constraint
    - Current to medium term
    - Large buyers may delay commitment or demand portability and strong governance
    - Probe model portability, audit trails, retention, and rights to outputs
  - - Compute and energy intensity of advanced workloads
    - constraint
    - Medium term
    - Raises the importance of efficient model routing and economic ROI discipline
    - Request unit economics and how reasoning-heavy tasks are cost-controlled in production
  notes: Drivers and constraints are intentionally mixed because both determine whether adjacent AI budgets become monetizable for a humans&-like offering.
