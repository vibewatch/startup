companyProfile:
  summary: >-
    humans& is a San Francisco Bay Area private company founded in September
    2025 by Eric Zelikman and a small group of frontier-AI researchers from
    xAI, OpenAI, Anthropic, Google, and Stanford-linked research communities.
    Public materials position the company around human collaboration,
    communication, and collective decision-making rather than generic
    single-user automation, and retained reporting says the team is co-evolving
    both a model and a product around that thesis. The company has already
    secured an extraordinary $480 million January 2026 seed financing at a
    quoted $4.48 billion valuation, which gives it unusual compute-buying and
    recruiting capacity for a company of roughly 20-28 employees. The central
    diligence limitation is that funding visibility still far exceeds operating
    visibility: there is no retained public evidence of live customer
    deployments, meaningful product metrics, detailed governance terms, or
    public revenue disclosure.
