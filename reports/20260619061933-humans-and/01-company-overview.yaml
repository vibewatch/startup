company:
  name: humans&
chapter:
  number: 1
  title: Company Overview
  summary: humans& is a September 2025 Bay Area frontier-AI startup that emerged from stealth in January
    2026 with a $480 million seed round and a collaboration-first AI thesis. The founder bench and investor
    base are elite, but product, customer, governance, and exact scale disclosures remain thin, so founder
    concentration and execution risk are core diligence themes.
sections:
- id: identity-mission-and-footprint
  title: Identity, mission, and footprint
  body: >-
    humans& publicly introduced itself on January 20, 2026 as a “human-centric frontier AI lab” built
    around the idea that progress comes from trust, connection, and collaboration rather than from replacing
    people with isolated autonomous systems. The company’s own materials emphasize a connective-tissue
    role for AI: the product direction is framed as helping organizations and communities work together
    better, not merely automating single tasks. Official language ties that thesis to long-horizon and
    multi-agent reinforcement learning, memory, and user understanding, and to a development model that
    tightly couples research with product work. That is enough to establish a real research agenda, but
    not enough to establish commercial readiness.


    Location evidence is directionally clear but not perfectly clean. Secondary company directories and
    a California-registry mirror point to a Redwood City mailing and principal address at 601 Marshall
    Street, while several media and database profiles use broader “San Francisco” shorthand. The safest
    reusable ground truth for later chapters is that humans& is a Bay Area company with a public Redwood
    City filing address and a San Francisco/Palo Alto operating narrative. The exact headquarters label
    is therefore a minor but real diligence cleanup item rather than something this chapter should overstate.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
