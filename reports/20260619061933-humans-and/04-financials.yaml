- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metrics
  - impact
  - exact diligence path
  rows:
  - - Revenue, ARR, customer count, and revenue mix
    - Cannot test revenue quality, concentration, or whether pilots have converted into durable demand
    - Request monthly revenue bridge, top-customer list, pipeline by stage, and customer references tied to signed contracts.
  - - Gross margin by product and inference cost stack
    - Cannot judge whether collaboration pricing can ever absorb frontier-model cost
    - Request product P&L with GPU, storage, bandwidth, and support allocation methodology.
  - - Cash balance, burn, and runway
    - Cannot verify capital adequacy despite the very large seed headline
    - Request closing cash, monthly burn bridge, committed capex/opex, and 18-month operating plan.
  - - Compute commitments and partner economics
    - Cannot know whether strategic partners lower or increase effective cash burn through minimum commits
    - Request cloud/GPU contracts, credits, prepayments, leasing, and service-level commitments.
  - - Pricing architecture and contract terms
    - Cannot estimate ARPU or payback without list pricing, discounts, and consumption rules
    - Request pricing docs, quote templates, redlined MSAs, and discount approval matrix.
  - - Commercial proof of launch readiness
    - Launch timing is public but customer readiness is not, leaving next-round dependency opaque
    - Request product roadmap, pilot design partners, go-live calendar, and post-launch KPI dashboard.
  notes: This is the most important diligence artifact in the chapter because public disclosure is materially thinner than the valuation headline.
