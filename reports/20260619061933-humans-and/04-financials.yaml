  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: issuer-level-form-d
    missingEvidence: Public issuer-level SEC or state financing filing URL for the round
    whyItMatters: Without a filing URL, the financing must rely more heavily on press and secondary records than on primary issuance documents.
    diligencePath: Request counsel's filing package, Form D identifier if any, and any state notice filings.
    relatedQuestionRefs:
    - QI015
  - type: private-evidence-only
    severity: material
    topic: nvidia-partnership-terms
    missingEvidence: Primary documentation for any Nvidia hardware or software partnership terms
    whyItMatters: Strategic-compute support can materially change effective cash burn, capital efficiency, and supplier dependence.
    diligencePath: Request signed Nvidia agreements, credits, volume commitments, and any exclusivity clauses.
    relatedQuestionRefs:
    - QI019
  - type: private-evidence-only
    severity: material
    topic: pre-revenue-proof
    missingEvidence: Evidence confirming first commercial receipts or proving the absence of revenue
    whyItMatters: Pre-revenue versus early-revenue status materially affects both valuation framing and runway assumptions.
    diligencePath: Request bank statement-backed revenue schedule, first invoice dates, and deferred-revenue rollforward.
    relatedQuestionRefs:
    - QI024
  - type: private-evidence-only
    severity: material
    topic: unit-economics-private-metrics
    missingEvidence: Gross margin, CAC, payback, NRR, and sales-cycle metrics
    whyItMatters: These determine whether the company is building a commercially efficient product or merely an expensive research program.
    diligencePath: Request cohort dashboards, funnel metrics, contribution margin analysis, and board KPI packs.
    relatedQuestionRefs:
    - QI025
  - type: private-evidence-only
    severity: material
    topic: cash-burn-runway
    missingEvidence: Closing cash, monthly burn, runway, and committed compute obligations
    whyItMatters: Seed size alone cannot answer whether humans& has 12 months or several years of operating room.
    diligencePath: Request treasury statements, monthly burn bridge, cloud commitments, and 18-24 month scenario model.
    relatedQuestionRefs:
    - QI026
  - type: private-evidence-only
    severity: material
    topic: revenue-quality-proof
    missingEvidence: Top-customer revenue mix, pilot conversion, and contract quality
    whyItMatters: Revenue quality is central to underwriting yet absent from the public record.
    diligencePath: Request signed contracts, pilot-to-paid conversion data, concentration analysis, and renewal terms.
    relatedQuestionRefs:
    - QI033
  - type: private-evidence-only
    severity: material
    topic: margin-path-proof
    missingEvidence: Product-level gross margin and inference-cost trend by workload
    whyItMatters: Margin path determines whether scale will improve or worsen financing dependency.
    diligencePath: Request product P&Ls, GPU utilization reports, and target margin thresholds.
    relatedQuestionRefs:
    - QI034
  - type: private-evidence-only
    severity: material
    topic: runway-proof
    missingEvidence: Board-approved base and downside runway cases
    whyItMatters: Without runway cases, it is impossible to judge next-round dependency against the launch plan.
    diligencePath: Request budget, downside scenario model, and financing contingency triggers.
    relatedQuestionRefs:
    - QI035
  - type: enumeration-incomplete
    severity: material
    topic: capital-adequacy-table
    missingEvidence: Public sources do not disclose the full cash, burn, runway, and commitment set needed for a complete capital adequacy schedule.
    whyItMatters: The capital adequacy table can map known headline facts but cannot complete the operating financing picture from public evidence alone.
    diligencePath: Request closing cash, vendor commitments, debt schedule, and board budget to convert the table from public proxy to underwriting tool.
    relatedTableRefs:
    - TI004
  - type: enumeration-incomplete
    severity: material
    topic: public-financial-gaps-table
    missingEvidence: Several rows in the public financial gaps table remain open precisely because the missing internal operating package has not been released publicly.
    whyItMatters: The chapter's financial verdict is driven more by disclosure gaps than by quantified performance.
    diligencePath: Obtain the management data room and reconcile each missing metric to a source document owner and refresh cadence.
    relatedTableRefs:
    - TI005
