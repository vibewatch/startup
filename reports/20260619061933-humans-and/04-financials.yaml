- id: section-2
  title: 'Pricing and unit economics proxies: market anchors exist, but humans&''s economics remain private'
  body: 'Because humans& has not published its own pricing, the best public way to reason about monetization is through adjacent frontier and collaboration markets. OpenAI shows that model-serving businesses can monetize usage directly through token pricing. Slack, Google Workspace, Anthropic, and Microsoft show that AI-enhanced collaboration or productivity products can also monetize through per-seat plans, enterprise upsells, and feature packaging. Notion adds a hybrid pattern in which AI agents and credits can sit beside broader workspace subscriptions. These external benchmarks do not prove what humans& will charge, but they do demonstrate that the broader market already tolerates both seat-based and usage-based models.


    The more important underwriting point is that market pricing proxies do not solve humans&''s unit-economics problem. The reviewed public record still lacks revenue, gross margin, CAC, payback, NRR, and sales-cycle data. So even though comparable products show commercial precedent, outsiders cannot yet determine whether humans& can convert collaboration value into pricing strong enough to offset frontier-model cost. For this company, today’s public unit-economics story is mostly a set of missing fields plus a few external reference points—not an auditable operating model.'
  claimRefs:
  - CI010
