- id: TI003
  title: Unit economics table
  columns:
  - metric
  - value/null
  - confidence
  - why it matters
  - diligence ask
  rows:
  - - Revenue / ARR
    - 'null'
    - High
    - Without any revenue base, underwriting must focus on cash burn and launch readiness rather than growth efficiency
    - Request monthly revenue bridge, booked ARR, and signed pilot value.
  - - Gross margin
    - 'null'
    - High
    - Compute-heavy products can look attractive on usage growth while still carrying weak contribution margins
    - Request gross margin by product, including inference, storage, and support costs.
  - - Customer acquisition cost
    - 'null'
    - High
    - If adoption relies on enterprise education or heavy founder selling, CAC could be large before repeatable demand appears
    - Request CAC by channel and founder-led versus scaled sales motion.
  - - Payback period
    - 'null'
    - High
    - Payback determines whether seed capital is being converted into durable go-to-market capacity
    - Request payback by cohort and pilot-to-paid conversion timing.
  - - Token / compute economics proxy
    - OpenAI public output rates span roughly $15 to $30 per 1M output tokens for flagship models
    - Medium
    - Shows that model serving can support pricing, but only if humans& can control inference cost and utilization
    - Request internal COGS per model call, cache hit rates, and GPU utilization.
  - - Seat pricing proxy
    - Collaboration suites publicly cluster from high single digits to low tens of dollars per user per month
    - Medium
    - Implies that even a strong collaboration product may need high retention or hybrid usage fees to absorb frontier-model cost
    - Request target ARPU, seat packaging, and attach rates for premium AI features.
  notes: Nulls are intentional because the company has not published the private operating metrics needed for real unit-economics underwriting.
