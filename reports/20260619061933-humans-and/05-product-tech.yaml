callouts:
- calloutType: strength
  title: Research-to-product bench is unusually strong for a stealth startup
  body: Official team bios, founder publication history, and employee pages consistently show expertise in reasoning RL, post-training, privacy, GPU systems, and backend engineering. That does not prove product-market fit, but it does reduce the risk that humans& is merely a branding layer over generic model access.
  claimRefs:
  - CE015
  - CE016
  - CE017
  - CE023
  - CE025
  - CE027
- calloutType: risk
  title: Public product completion still trails the scale of the financing
  body: By the clearest third-party account, humans& was still shaping product and interface together after launch week, and the current public corpus still lacks docs, customers, benchmarks, and security artifacts. The main product risk is therefore execution opacity, not lack of ambition.
  claimRefs:
  - CE013
  - CE032
  - CE033
  - CE035
  - CE038
- calloutType: recommendation
  title: 'Core diligence ask: request a real product walkthrough plus memory-governance materials'
  body: The single highest-value next step would be a demo that shows the live collaboration workflow, the memory and permission model, example evals, and what enterprise controls exist today versus on roadmap. That would collapse multiple public unknowns at once.
