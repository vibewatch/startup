- id: trust-privacy-and-open-gaps
  title: 'Trust, privacy, and control posture: website privacy is explicit, product controls are still mostly undisclosed'
  body: >-
    The best public trust evidence today lives on the marketing site, not in product documentation. humans& says the site is primarily informational, does not use analytics or ad-tracking pixels, does not use tracking cookies for profiling, and limits automatic data collection to basic server logs used for reliability and security. The same notice explains that job applications are routed through Ashby and that Google Fonts creates limited third-party request exposure. Those statements are useful because they show the company is at least publishing a privacy baseline and acknowledging third-party processors. The team mix also includes explicit privacy expertise through Niloofar Mireshghallah’s published work on contextual integrity, persistent memory, and information-flow norms.


    What is missing is the product-control layer an enterprise buyer would actually underwrite. No reviewed public source disclosed SOC 2, ISO 27001, a model-security whitepaper, data-processing agreement, customer retention policy for memory, abuse monitoring design, public uptime page, or quantified safety and reliability benchmarks. For diligence, that means the website privacy posture should be treated as a positive signal about mindset—not as proof that the collaboration product itself is procurement-ready for security-sensitive deployments.
