- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - humans& solution
  - Measurable benefit
  - Limitation
  rows:
  - - Keep a group aligned over time
    - Manual meetings, chat threads, and repeated context sharing
    - Model-plus-product intended to coordinate people and preserve context
    - Lower context re-entry and better continuity are the stated goal
    - No public evidence of live deployment or measured lift
  - - Reach a large-group decision
    - Someone gathers opinions and mediates camps manually
    - Zelikman describes AI asking questions and balancing motivations for the good of the whole
    - Potentially faster consensus formation
    - No public evaluation showing better decisions or lower meeting time
  - - Help humans collaborate with AI tools
    - Users juggle separate assistants and documents
    - humans& wants a collaboration layer rather than a standalone assistant plug-in
    - Could unify team and AI interaction in one surface
    - Product boundaries versus Slack/Docs/Notion remain undefined
  - - Retain useful knowledge about people and projects
    - Important context is repeatedly re-entered into prompts or lost between sessions
    - Memory and user understanding are explicit public priorities
    - Could reduce repeated onboarding of the model
    - No public memory policy, permission model, or deletion workflow
  - - Support both organizational and non-work coordination
    - Separate tools for enterprise collaboration, consumer messaging, and planning
    - TechCrunch says the team hinted at both enterprise and consumer applications
    - Broad surface area could enlarge addressable use cases
    - Public segmentation, go-to-market focus, and buyer proof are still absent
  notes: Benefits are directional only. The reviewed corpus explains intended workflow problems more clearly than it documents shipped customer outcomes.
