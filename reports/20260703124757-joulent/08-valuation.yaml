  figureRefs:
  - FV004
- id: financing-context
  title: Financing and valuation context
  body: 'The July 2026 National Grid Ventures investment—$1.75 billion for about 35%—implies an approximate $5 billion post-money valuation. It is a strategic minority investment rather than a control transaction, which shapes preference and governance dynamics and could leave dilution or preference overhang that weighs on future common returns. Entry discipline is challenged because the valuation rests on contracted pipeline rather than current earnings: public evidence supports the existence and size of the deal but offers no independent valuation cross-check, and the mark is a private, primary-round figure rather than a market-tested or liquidity-backed one. In diligence terms this means the price should be read as an option premium on execution, not a multiple on cash flow. An investor paying at or above this level is underwriting flawless delivery of a first-of-scale megaproject, so the burden falls on verifying the contracted economics and the financing plan behind the $7-9 billion
    build before treating the ~$5 billion as a floor rather than a hopeful mark.'
  claimRefs:
  - CV012
  - CV013
  - CV014
  - CV015
  - CV016
  - CV017
  - CV037
  - CV038
  - CV046
  - CV047
  - CV053
  tableRefs:
  - TV006
- id: scenarios
  title: Bull, base and bear scenarios
  body: The outcomes are unusually binary because value concentrates in a single megaproject. In the bull case, Kilby executes on time, Joulent replicates the co-located model with additional campuses, and it becomes a multi-gigawatt power platform worth well above $5 billion. In the base case—assigned the highest probability given contracted demand—Kilby is built with some delay or cost overrun and Joulent remains a valuable but single-asset developer near its current mark. In the bear case, the final investment decision slips or Microsoft demand softens, cost overruns bite, and the equity is impaired below the entry price. Downside triggers include FID slippage, PPA renegotiation, capex blowout above $9 billion, and AI-capex retrenchment. Probability signals favor the base case, but the tail risk on execution is material, and the resulting valuation range is wide—from roughly impaired equity in the bear case to several times the current mark under successful scaling. That spread, more
    than any single point estimate, is the honest summary of Joulent's valuation.
  claimRefs:
  - CV018
  - CV019
  - CV020
  - CV021
  - CV022
  - CV023
  - CV040
  - CV049
  tableRefs:
  - TV003
  - TV005
  figureRefs:
  - FV002
  - FV003
- id: comparables-exit
  title: Comparables, exit readiness and diligence
  body: 'Comparables bracket the mark. Crusoe Energy, a comparable AI-data-center power and compute developer, was valued around $10 billion in its late-2025 round; data-center infrastructure assets have traded at roughly 15-19x EBITDA; and listed independent power producers exposed to data-center demand—Vistra, Constellation, Talen—provide public-market reference points, while private strategic rounds in AI-power infrastructure have clustered at multibillion-dollar valuations through 2025-2026. Together these suggest Joulent''s ~$5 billion mark is within range for the theme but rich for a pre-revenue single-asset developer, and every comparable has limits: Crusoe has compute revenue, IPPs are operating utilities, and infrastructure multiples assume cash-flowing assets. A DCF on Kilby would hinge on PPA pricing, gas cost, utilization and discount rate, all largely undisclosed. Exit readiness is early—pre-revenue status and single-asset concentration limit near-term liquidity—though an IPO,
    strategic sale, or a National Grid buyout are plausible paths. Final diligence asks center on financials, the cap table, PPA economics and the project-finance plan, and skeptics rightly caution that theme-driven valuations can overshoot fundamentals.'
