      - number: '5.2'
        title: Asset and product-line map
        blocks:
          - type: paragraph
            body: >-
              The generation fleet centers on GE Vernova 7HA-class heavy-duty gas turbines configured in combined-cycle
              blocks, supplemented by Caterpillar Solar Turbines units for firming and flexibility. The campus occupies
              more than 2,000 acres near Pecos in Reeves County, Texas, in the heart of the Permian Basin, which places
              the plant atop abundant, low-cost natural gas and gives it local fuel access without long pipelines. The
              asset is held through a joint venture in which Chevron carries the 20-year Microsoft power purchase
              agreement while Joulent holds a 50% equity option—the structure that converts the physical plant into
              Joulent's economic product. Beyond Kilby, the product line is best understood as a pipeline of additional
              co-located campuses that the $1.75 billion National Grid Ventures capital is meant to seed, though no
              second project has yet been named. The asset map is therefore concrete for Kilby's turbine fleet and site
              but still thin on exact equipment counts and future-project specifics.
