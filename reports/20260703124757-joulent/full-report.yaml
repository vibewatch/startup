      - number: '3.4'
        title: Moat durability and competitive risk
        blocks:
          - type: paragraph
            body: >-
              Joulent's most durable moat is contractual: long-dated PPAs create high switching costs once signed, and
              site control, interconnection rights and turbine delivery slots are hard-to-replicate assets. But
              durability is conditional. Distribution power and capitalization favor incumbents like Vistra and
              Constellation that already own fleets and grid relationships, and hyperscalers multi-home across nuclear,
              gas and grid to avoid dependency. The co-located gas model is being commoditized as many developers copy
              it, and carbon-free rivals—nuclear and renewables-plus-storage—could displace gas on emissions and
              long-run cost, a threat amplified by rising sustainability scrutiny. Turbine scarcity shared with rivals
              could delay Joulent relative to nuclear peers with operating plants, and better-capitalized incumbents can
              outbid a single-project entrant. The moat is genuine but rests heavily on reaching Kilby's final
              investment decision and retaining its partner bundle. Until first power in 2028, every element of that
              moat is prospective rather than proven, which is the central competitive vulnerability an investor must
              weigh against the strength of the assembled partners.
            claimRefs:
              - CP025
              - CP026
              - CP027
              - CP028
              - CP029
              - CP030
              - CP031
              - CP033
