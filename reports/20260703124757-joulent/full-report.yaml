      - number: '4.2'
        title: Go-to-market, cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              Joulent's go-to-market inverts the usual sequence: it secures an anchor hyperscaler offtake before
              committing capital, as the Microsoft agreement preceding Kilby's final investment decision illustrates,
              and leans on partner channels—Chevron, GE Vernova, National Grid—rather than a conventional sales force.
              Customer acquisition is therefore highly concentrated, with a single anchor underpinning the first
              project, and the sales cycle for gigawatt-scale deals stretches across months to years of siting,
              interconnection and contracting. On costs, the model is intensely capital-intensive: Kilby is projected at
              roughly $7-9 billion, and co-located gas generation runs into the millions of dollars per megawatt, with
              GE Vernova turbines and Caterpillar units as major line items. Margins hinge on the spread between
              contracted PPA revenue and natural-gas fuel plus operating costs, amortized over high utilization and a
              long contract to recover heavy front-loaded capex. Importantly, an off-grid, behind-the-meter design lets
              Kilby avoid socializing grid-upgrade costs and sidestep multi-year interconnection queues, which both
              supports standalone project economics and improves time-to-revenue relative to a grid-dependent build.
