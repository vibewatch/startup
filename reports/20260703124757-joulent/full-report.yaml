            body: >-
              The deployment path runs from a targeted end-2026 final investment decision to a 2028 first-power goal,
              implying a compressed multi-year engineering-procurement-construction cycle with more than 6,000 workers
              at peak. A critical gating dependency is turbine availability: GE Vernova's heavy-duty gas-turbine backlog
              is effectively sold out into the late 2020s, so securing delivery slots matters as much as capital or
              permits to hitting 2028. Reliability for an AI training campus depends on very high availability, so
              redundant turbine blocks and on-site backup are integral to the design, and a phased buildout lets
              capacity come online in blocks—allowing partial revenue before the full 2.67 GW is complete. Long-term
              support and maintenance are expected to lean on OEM service agreements from GE Vernova and Caterpillar
              rather than an in-house field organization. Taken together the roadmap is milestone-clear but every
              post-FID date remains a target rather than a committed, financed schedule, so slippage risk is real.
