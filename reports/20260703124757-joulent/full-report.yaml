              - CV002
              - CV004
              - CV005
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV010
      - number: '8.2'
        title: Recommendation, confidence and stance
        blocks:
          - type: paragraph
            body: >-
              On balance the recommendation is to monitor: Joulent is a high-quality option rather than an underwritable
              business today. Confidence is medium, constrained above all by the near-total absence of public
              financials, which prevents any independent underwriting of revenue quality, margins or returns. The risk
              rating is high, driven by execution, customer concentration and capital-intensity risk, and the valuation
              stance is premium because the roughly $5 billion mark prices in successful execution that has not yet been
              demonstrated. The supportable posture is to track the end-2026 final investment decision and the 2028
              first-power milestone before committing capital, re-rating as each de-risks. Framed against the
              alternatives, an outright invest call is premature given the opacity, while a pass would be too dismissive
              of a genuinely strong, well-partnered option on a scarce resource. Monitor threads that needle: it
              preserves access to the upside while declining to pay the full execution premium up front, and it defines
              concrete milestones that would justify moving to a firmer stance.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV039
              - CV041
              - CV042
              - CV052
