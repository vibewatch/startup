      - number: '7.2'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              The Texas regulatory backdrop shifted with Senate Bill 6 (2025), which tightens rules for large electric
              loads interconnecting to the grid, and ERCOT's large-load process (Project 58481) imposes study fees,
              disclosure and security requirements on loads at and above roughly 75 MW. SB6 also gives ERCOT and
              utilities expanded authority to curtail or disconnect large loads under grid-stress conditions, and legal
              analysts flag heightened disclosure and demand-transparency obligations for data-center loads. Joulent's
              off-grid, behind-the-meter design reduces—but does not fully remove—exposure to these interconnection
              rules, since the campus islands its load. Separately, air-quality permitting for large gas turbines (NOx
              and CO2) is a required, time-consuming step; environmental litigation or permit challenges are a plausible
              legal risk for large fossil projects; and water-use permitting in arid West Texas adds a further
              dependency for combined-cycle cooling. Federal energy oversight can also bear on co-location and
              wholesale-power arrangements. The register is ordered by severity, but Kilby-specific filings are not yet
              public, so residual exposure is only partially sized.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR042
          - type: table
            tableRef: TR001
            claimRefs:
              - CR007
              - CR008
              - CR012
              - CR014
              - CR039
      - number: '7.3'
        title: Operational and supply-chain risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk concentrates in turbine supply. GE Vernova's heavy-duty gas-turbine backlog is
              effectively sold out into the late 2020s, and strong global demand creates delivery-slot risk that could
              slip Kilby's timeline. Construction-phase risks include labor availability at a 6,000-plus-worker peak,
              EPC coordination and West Texas weather. Once built, operating an islanded 2.67 GW microgrid introduces
              reliability risk in self-supplying the frequency regulation, reserve and black-start services the grid
              would normally provide, and a single-site plant means an outage or equipment failure would directly
              threaten the anchor customer's power. Natural-gas supply disruptions or price spikes are an operational
              and margin risk despite Permian proximity. Compounding all of this, no public reliability, safety or
              quality-audit record yet exists for Kilby's specific design, so operational risk remains largely
              unquantified until commissioning. Rows in the operational register are ordered by severity, with turbine
              delivery, construction overrun and islanded reliability at the top.
            claimRefs:
              - CR016
              - CR017
