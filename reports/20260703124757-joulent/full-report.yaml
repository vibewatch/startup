    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Joulent is a Houston, Texas-based, technology-driven energy company that builds large-scale, co-located
              power infrastructure for AI data centers and industrial users, publicly launching in June 2026 after a
              multi-year incubation by investment firm Engine No. 1 in collaboration with GE Vernova. Its productized
              'Across-the-Meter' power stack co-locates gas generation, battery storage and renewables with customer
              demand and manages grid interconnection to deliver reliable electricity at industrial scale. The company
              positions itself around delivering energy at the 'speed and scale of American innovation,' targeting the
              acute power bottleneck facing hyperscale computing. Joulent is privately held; its stage is best described
              as growth-phase development, with its first flagship project still pre-Final-Investment-Decision as of
              July 2026.
