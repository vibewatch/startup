  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape
        blocks:
          - type: paragraph
            body: >-
              Joulent competes in a crowded, fast-moving field to supply reliable power to AI data centers. The
              landscape spans four archetypes: vertically integrated AI-power developers such as Crusoe;
              behind-the-meter and on-site specialists like VoltaGrid and Bloom Energy; gas and nuclear independent
              power producers including Vistra, Constellation and Talen; and comparable co-located gas developers such
              as Homer City with Kiewit. Underpinning all of them is the status-quo alternative—a standard grid
              interconnection through a regulated utility—which remains the default but is increasingly constrained by
              multi-year queues. Traditional IPPs now face direct competition from distributed and co-located power, and
              hyperscalers can also 'build internally' by contracting their own generation, an implicit competitor to
              every third-party developer. This breadth means Joulent must win not on a single axis but across speed,
              siting, fuel and capital simultaneously. The field is also fluid: nuclear restarts, gas co-location and
              behind-the-meter fuel cells are all being underwritten by the same handful of hyperscalers, so competitors
              frequently overlap on customers even when their technologies differ. For a pre-FID entrant, the practical
              question is less who the competitors are than which of them can actually deliver energized megawatts on a
              hyperscaler's timeline, and on that test the incumbents with operating fleets start ahead.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP012
              - CP013
