      - number: '2.4'
        title: Growth drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              The dominant driver is the AI-compute surge, which is far more power-hungry than prior workloads and is
              colliding with grid interconnection queues that often stretch for years—together the core reason
              hyperscalers turn to co-located generation, where speed-to-power and long-dated offtake de-risk new
              plants. Against these drivers sit real constraints. Texas's Senate Bill 6 and ERCOT's new large-load
              interconnection standards impose study fees, per-megawatt financial security and disclosure obligations on
              loads of 75 megawatts and above, while regulators grapple with the systemic strain of concentrated demand.
              Capital intensity—power plants costing millions of dollars per megawatt—limits how quickly supply can
              scale, tight gas-turbine availability adds a physical bottleneck, and mounting emissions scrutiny
              pressures new gas-fired capacity. Finally, the demand forecasts themselves carry wide error bars:
              sustained AI adoption, efficiency gains or a financing pullback could each move the trajectory materially,
              and the divergence of published estimates underscores that uncertainty. For diligence, the constraint set
              is as important as the demand curve, since it determines which developers can actually convert demand into
              energized, contracted megawatts.
            claimRefs:
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
