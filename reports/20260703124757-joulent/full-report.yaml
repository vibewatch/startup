  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              Joulent's risk profile is dominated by two forces: execution and concentration. The single largest risk is
              delivering a $7-9 billion, gigawatt-scale gas plant on a compressed 2026-2028 schedule, with first power
              not expected until 2028—meaning years of pre-revenue construction exposure before any offsetting income.
              Capital intensity magnifies the downside, because cost overruns on a multi-billion-dollar build erode
              equity returns directly. Alongside execution, customer concentration is a top-tier risk: essentially one
              customer, Microsoft, underpins the flagship. Residual exposure remains high across most categories because
              the project is pre-construction and largely undisclosed, and mitigation maturity is uneven—strong
              contractual and partner mitigants coexist with weak public transparency and unproven operations. Ranked by
              residual severity, the priority risks are execution/construction, customer concentration, turbine supply,
              financing gap, evolving Texas large-load regulation, and carbon/stranded-asset exposure. Each is examined
              in turn, with monitorable triggers that would break the thesis.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: figure
            figureRef: FR001
            claimRefs:
