  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis is that Joulent is an early leader in the scarce, fast-growing market for co-located
              power for AI data centers, with a signed 20-year Microsoft power purchase agreement and a $1.75 billion
              strategic investment that validate demand and de-risk the anchor project. Privileged partner
              access—Chevron for fuel and offtake, GE Vernova for turbines, and National Grid for capital—forms a
              defensible ecosystem advantage that a new entrant would struggle to assemble. The anti-thesis is equally
              clear: Joulent is a pre-revenue, single-project, single-customer developer valued at roughly $5 billion on
              execution optionality, where capital intensity, carbon exposure and construction risk could impair returns
              if execution slips. Both cases hinge on the same variables: the thesis holds if Kilby reaches final
              investment decision and first power on schedule with the customer intact, and the anti-thesis holds if any
              of those fail. The valuation debate is therefore really an execution debate wearing a price tag.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV043
              - CV044
              - CV045
              - CV054
          - type: table
            tableRef: TV002
            claimRefs:
