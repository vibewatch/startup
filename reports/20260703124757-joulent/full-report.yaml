      - number: '8.5'
        title: Comparables, exit readiness and diligence
        blocks:
          - type: paragraph
            body: >-
              Comparables bracket the mark. Crusoe Energy, a comparable AI-data-center power and compute developer, was
              valued around $10 billion in its late-2025 round; data-center infrastructure assets have traded at roughly
              15-19x EBITDA; and listed independent power producers exposed to data-center demand—Vistra, Constellation,
              Talen—provide public-market reference points, while private strategic rounds in AI-power infrastructure
              have clustered at multibillion-dollar valuations through 2025-2026. Together these suggest Joulent's ~$5
              billion mark is within range for the theme but rich for a pre-revenue single-asset developer, and every
              comparable has limits: Crusoe has compute revenue, IPPs are operating utilities, and infrastructure
              multiples assume cash-flowing assets. A DCF on Kilby would hinge on PPA pricing, gas cost, utilization and
              discount rate, all largely undisclosed. Exit readiness is early—pre-revenue status and single-asset
              concentration limit near-term liquidity—though an IPO, strategic sale, or a National Grid buyout are
              plausible paths. Final diligence asks center on financials, the cap table, PPA economics and the
              project-finance plan, and skeptics rightly caution that theme-driven valuations can overshoot
              fundamentals.
            claimRefs:
              - CV024
