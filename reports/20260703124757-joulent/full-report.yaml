  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The market Joulent addresses is the supply of large-scale, contracted electricity and the physical power
              infrastructure that serves 'large load' data centers, above all AI compute campuses. In-scope spend covers
              new generation capacity, grid interconnection, co-located and behind-the-meter plants, and long-dated
              power purchase agreements; it explicitly excludes IT hardware such as GPUs, servers and cooling. The
              status-quo substitute is a conventional grid interconnection through a regulated utility, an option
              increasingly constrained by multi-year queues that have become a central pain point for hyperscalers.
              Adjacent supply paths—grid-scale independent power producers, nuclear restarts and small modular reactors,
              and fuel-cell or hybrid on-site systems—compete at the margin. Behind-the-meter and co-located gas
              generation has emerged as the fastest route to reliable power, which is exactly the segment Joulent
              productizes. The boundary matters for diligence because headline 'data-center' spending figures blend IT
              hardware, real estate and power; isolating the power-and-interconnection layer is what makes Joulent's
              opportunity legible, and it is that narrower slice—new dispatchable capacity delivered on a hyperscaler's
              timeline—where the company competes rather than the far larger compute-hardware budget.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM030
              - CM031
