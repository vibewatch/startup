          - type: callout
            title: Clear, monitorable thesis-break triggers exist
            body: >-
              FID slipping past end-2026, any loss or renegotiation of the Microsoft PPA, or a capex blowout above $9B
              would each break the investment thesis and are trackable in diligence.
            calloutType: assumption
