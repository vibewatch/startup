            claimRefs:
              - CV041
              - CV009
              - CV010
              - CV038
      - number: '8.3'
        title: Financing and valuation context
        blocks:
          - type: paragraph
            body: >-
              The July 2026 National Grid Ventures investment—$1.75 billion for about 35%—implies an approximate $5
              billion post-money valuation. It is a strategic minority investment rather than a control transaction,
              which shapes preference and governance dynamics and could leave dilution or preference overhang that
              weighs on future common returns. Entry discipline is challenged because the valuation rests on contracted
              pipeline rather than current earnings: public evidence supports the existence and size of the deal but
              offers no independent valuation cross-check, and the mark is a private, primary-round figure rather than a
              market-tested or liquidity-backed one. In diligence terms this means the price should be read as an option
              premium on execution, not a multiple on cash flow. An investor paying at or above this level is
              underwriting flawless delivery of a first-of-scale megaproject, so the burden falls on verifying the
              contracted economics and the financing plan behind the $7-9 billion build before treating the ~$5 billion
              as a floor rather than a hopeful mark.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV037
              - CV038
              - CV046
              - CV047
              - CV053
          - type: table
            tableRef: TV006
            claimRefs:
              - CV034
              - CV030
              - CV038
              - CV037
      - number: '8.4'
        title: Bull, base and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              The outcomes are unusually binary because value concentrates in a single megaproject. In the bull case,
              Kilby executes on time, Joulent replicates the co-located model with additional campuses, and it becomes a
              multi-gigawatt power platform worth well above $5 billion. In the base case—assigned the highest
              probability given contracted demand—Kilby is built with some delay or cost overrun and Joulent remains a
              valuable but single-asset developer near its current mark. In the bear case, the final investment decision
              slips or Microsoft demand softens, cost overruns bite, and the equity is impaired below the entry price.
              Downside triggers include FID slippage, PPA renegotiation, capex blowout above $9 billion, and AI-capex
              retrenchment. Probability signals favor the base case, but the tail risk on execution is material, and the
              resulting valuation range is wide—from roughly impaired equity in the bear case to several times the
              current mark under successful scaling. That spread, more than any single point estimate, is the honest
              summary of Joulent's valuation.
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV040
              - CV049
