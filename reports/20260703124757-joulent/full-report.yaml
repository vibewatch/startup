            body: >-
              As large combustion sources, Kilby's turbines require federal and state air-quality permitting for
              pollutants such as NOx and CO2, and islanding off ERCOT reduces interconnection-approval exposure but does
              not exempt the plant from environmental and safety regulation. The design draws pointed criticism:
              analysts and environmental groups argue that a large gas-fired plant for data centers carries meaningful
              carbon and stranded-asset risk if AI demand or climate policy shifts, and no public lifecycle-emissions
