        title: Funding, valuation and ownership
        blocks:
          - type: paragraph
            body: >-
              On July 1, 2026, National Grid Ventures—the commercial, non-regulated arm of UK utility National Grid
              plc—agreed to invest $1.75 billion in Joulent for an approximately 35% stake, a transaction Kirkland &
              Ellis advised on. That price implies a headline valuation of roughly $5 billion, vaulting the young
              company to unicorn scale, though the figure is derived from the deal rather than an audited mark. National
              Grid characterizes the investment as balance-sheet funded and incremental to its record capital program,
              having earmarked about $1 billion of near-term capital for Ventures projects. The capital is intended to
              fund Project Kilby and additional large-scale projects, giving National Grid direct exposure to
              fast-growing US 'large load' contracted-power demand while leaving Joulent's residual ownership and full
              cap table undisclosed.
