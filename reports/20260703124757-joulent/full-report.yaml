      - number: '7.5'
        title: Financial, carbon and mitigation triggers
        blocks:
          - type: paragraph
            body: >-
              Financially, the $1.75 billion equity raised is small versus a $7-9 billion build, implying substantial
              additional financing risk, and the long pre-revenue period means sustained cash outflow before any income.
              Margin-compression risk arises if gas prices rise or PPA pricing is fixed without adequate pass-through,
              and leverage against the 20-year PPA—though plausible—exposes the model to interest-rate and credit
              conditions. The near-total absence of public financials is itself a diligence risk that limits independent
              verification, and a downturn in AI data-center capex would undermine both demand and the valuation basis.
              The most poorly mitigated tail risk is carbon: critics warn that large new gas plants for data centers
              carry stranded-asset risk if AI demand or climate policy shifts, environmental groups highlight the
              climate tension, and hyperscaler climate commitments could pressure the customer to limit gas power over
              time. Key mitigants—the 20-year PPA, an investment-grade offtaker, strong partners and hydrogen-capable
              turbines—reduce but do not eliminate these risks. The clearest thesis-break triggers are FID slippage past
              end-2026, loss of the Microsoft contract, or a major cost blowout.
            claimRefs:
              - CR030
