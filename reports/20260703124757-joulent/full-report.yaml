      - number: '7.4'
        title: Partner and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Joulent sits at the center of a web of high-concentration dependencies. Chevron dependence is high—it
              holds the Microsoft PPA and supplies fuel, so its commitment is load-bearing—and GE Vernova dependence is
              high for both turbines and grid-orchestration technology. National Grid Ventures is the key capital
              provider, so any change in its commitment would strain financing, while Microsoft is simultaneously the
              key customer and the demand rationale, compounding concentration. Regulators—ERCOT, the Texas PUC and
              environmental agencies—are external dependencies that can gate the project. The joint-venture structure
              means Joulent's economics depend on partner performance it does not fully control, and failure of any
              single critical partner in fuel, turbines, capital or offtake could stall the flagship. On the people
              side, execution hinges on a young organization delivering a first-of-scale megaproject, with key-person
              dependence on founder-CEO Chris James and a need for deep project-development and EPC-management bench
              strength. Rows are ordered by the severity of a partner or execution failure.
            claimRefs:
              - CR023
              - CR024
              - CR025
              - CR026
              - CR027
              - CR028
