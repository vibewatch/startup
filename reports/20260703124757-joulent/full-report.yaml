      - number: '1.4'
        title: Flagship project and partnerships
        blocks:
          - type: paragraph
            body: >-
              Joulent's flagship is Project Kilby, a 2.67-gigawatt co-located power campus on a 2,000-plus acre site
              near Pecos in Reeves County, Texas, in the Permian Basin—capacity roughly equivalent to two million homes.
              Chevron, through subsidiary Energy Forge One LLC, holds a 20-year power purchase agreement with Microsoft,
              whose adjacent Pecos data-center campus is planned to add about 2 GW of compute load over five to seven
              years; Joulent holds a 50% equity option in the joint venture. GE Vernova supplies the core turbine
              technology and Caterpillar's Solar Turbines division adds supplemental generation. The project, projected
              to cost $7-9 billion, targets a Final Investment Decision by end-2026 and first power in 2028, and is
              claimed to generate over $10 billion in state and local tax revenue and roughly 2,000 jobs.
