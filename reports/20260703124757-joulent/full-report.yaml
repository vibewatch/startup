      - number: '5.3'
        title: Operating architecture and technical mechanism
        blocks:
          - type: paragraph
            body: >-
              Kilby's architecture stacks proven components into an islanded system. Gas turbines burn Permian fuel to
              spin generators, and a heat-recovery steam cycle captures exhaust heat to drive a steam turbine, lifting
              fuel-to-power efficiency well above simple-cycle operation; GE Vernova's 7HA platform reaches
              combined-cycle efficiencies in the 63-64% range, among the highest in commercial gas generation, and is
              engineered to co-fire hydrogen blends for a partial decarbonization pathway. Because the campus runs
              off-grid, grid-orchestration software in the GridOS class must continuously balance generation, storage
              and load, and the plant must self-supply frequency regulation, spinning reserve and black-start capability
              that the public grid would normally provide. Behind-the-meter delivery shortens the electrical path from
              turbine to server, cutting transmission losses and congestion-pricing exposure. The operating model
              front-loads capital into turbines, heat recovery and controls, then earns over decades of high-utilization
              dispatch. Every layer is individually proven, but integrating them at 2.67 GW for a single AI customer is
              the central technical unknown.
