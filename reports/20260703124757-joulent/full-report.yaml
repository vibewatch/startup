            title: Power, not chips, is the binding constraint
            body: >-
              Across Gartner, IEA, Goldman and McKinsey, the consistent message is that electricity supply and
              interconnection—not GPU availability—are becoming the gating factor for AI growth, which is precisely the
              bottleneck Joulent targets.
