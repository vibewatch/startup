      - number: '2.3'
        title: Buyer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              Demand concentrates among hyperscale cloud and AI operators—Microsoft foremost—alongside colocation
              providers, REITs and large industrial users. The economic payer is typically the hyperscaler, which
              contracts power under 10-to-20-year purchase agreements, with budget ownership sitting in infrastructure
              and energy-procurement teams steering multi-billion-dollar capex programs. The adoption path is long and
              capital-intensive: site selection and land control, then generation and interconnection, followed by a
              long-term power agreement, financing and a final investment decision, and finally construction and
              energization over several years. Project Kilby—where Chevron holds a 20-year PPA with Microsoft and
              Joulent an equity option—illustrates this motion end to end. Increasingly, AI operators co-locate compute
              directly with dedicated generation to compress time-to-power, turning speed into a procurement
              differentiator and making contracted, long-duration offtake the linchpin of the investment case.
            claimRefs:
              - CM016
              - CM017
              - CM018
              - CM019
              - CM020
