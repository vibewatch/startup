              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
              - CV048
              - CV050
              - CV051
          - type: table
            tableRef: TV004
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The ~$5B mark is an option premium
            body: >-
              The valuation prices successful execution of a single megaproject rather than current cash flow. It is
              defensible within the AI-power theme and versus comparables like Crusoe, but stretched for a pre-revenue,
              single-customer developer.
            calloutType: assumption
            claimRefs:
              - CV010
              - CV024
              - CV037
          - type: callout
            title: Binary outcomes, wide range
            body: >-
              Because value concentrates in one project, the bull-bear spread is unusually wide—from impaired equity to
              a multiple of the current mark—so timing and milestone verification matter more than usual.
            calloutType: risk
            claimRefs:
              - CV020
              - CV040
              - CV023
          - type: callout
            title: Monitor lets you re-rate on de-risking
            body: >-
              A monitor stance captures upside optionality while avoiding paying the full execution premium today; FID
              and first-power progress are the natural re-rating points.
            calloutType: strength
            claimRefs:
              - CV011
              - CV039
              - CV042
