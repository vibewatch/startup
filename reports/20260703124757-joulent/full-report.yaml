      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Joulent's public face is founder and chief executive Chris James, who simultaneously leads Engine No. 1,
              the activist-investment firm he founded in 2020 and that famously won three ExxonMobil board seats in
              2021. That dual role gives Joulent an experienced, credible energy-transition leader but also concentrates
              key-person risk, because no other named executives have been disclosed publicly. James frames leadership
              in the AI era as a race to deliver energy and compute the fastest, most reliably and at the lowest
              cost—the thesis underpinning Joulent's strategy. Governance detail beyond the founder is thin: the senior
              operating team, board composition and the balance of control between Engine No. 1 and new investor
              National Grid Ventures are not yet public, leaving a material diligence gap around management depth.
