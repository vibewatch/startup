      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Execution and concentration dominate
            body: >-
              A $7-9B, first-of-scale gas megaproject on a 2028 timeline, underwritten by one customer and several
              load-bearing partners, defines Joulent's risk. The 20-year PPA and strong partners mitigate downside but
              cannot remove construction, supply-chain and concentration exposure.
            calloutType: risk
            claimRefs:
              - CR001
              - CR004
              - CR040
          - type: callout
            title: Carbon is the poorly-mitigated tail risk
            body: >-
              Unlike execution risk, carbon and stranded-asset exposure has weak mitigation: if AI demand softens or
              climate policy tightens, a large gas plant could become an underused liability.
            calloutType: risk
            claimRefs:
              - CR036
              - CR039
