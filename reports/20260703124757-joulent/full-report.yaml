  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams and pricing
        blocks:
          - type: paragraph
            body: >-
              Joulent's revenue model is built on long-term power purchase agreements for electricity supplied to data
              centers and industrial users. For Project Kilby, Chevron—through its Energy Forge One subsidiary—holds a
              20-year PPA with Microsoft, and Joulent participates via a 50% equity option in the joint venture, its
              primary route to project economics. Such agreements typically run 10-to-20 years with take-or-pay-style
              commitments, and pricing is negotiated bilaterally rather than published, commonly cited in the tens of
              dollars per megawatt-hour for the segment. Revenue would be recognized as energy is delivered and capacity
              is made available once the plant operates; today Joulent is pre-revenue on Kilby, with first power
              targeted for 2028. The result is a structurally clear but quantitatively opaque top line: the contract
              exists, but price, escalation and Joulent's exact economic share are undisclosed.
