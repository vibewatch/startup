- id: asset-map
  title: Asset and product-line map
  body: The generation fleet centers on GE Vernova 7HA-class heavy-duty gas turbines configured in combined-cycle blocks, supplemented by Caterpillar Solar Turbines units for firming and flexibility. The campus occupies more than 2,000 acres near Pecos in Reeves County, Texas, in the heart of the Permian Basin, which places the plant atop abundant, low-cost natural gas and gives it local fuel access without long pipelines. The asset is held through a joint venture in which Chevron carries the 20-year Microsoft power purchase agreement while Joulent holds a 50% equity option—the structure that converts the physical plant into Joulent's economic product. Beyond Kilby, the product line is best understood as a pipeline of additional co-located campuses that the $1.75 billion National Grid Ventures capital is meant to seed, though no second project has yet been named. The asset map is therefore concrete for Kilby's turbine fleet and site but still thin on exact equipment counts and future-project
    specifics.
  claimRefs:
  - CE007
  - CE008
  - CE009
  - CE010
  - CE011
  - CE012
  tableRefs:
  - TE001
- id: architecture
  title: Operating architecture and technical mechanism
  body: Kilby's architecture stacks proven components into an islanded system. Gas turbines burn Permian fuel to spin generators, and a heat-recovery steam cycle captures exhaust heat to drive a steam turbine, lifting fuel-to-power efficiency well above simple-cycle operation; GE Vernova's 7HA platform reaches combined-cycle efficiencies in the 63-64% range, among the highest in commercial gas generation, and is engineered to co-fire hydrogen blends for a partial decarbonization pathway. Because the campus runs off-grid, grid-orchestration software in the GridOS class must continuously balance generation, storage and load, and the plant must self-supply frequency regulation, spinning reserve and black-start capability that the public grid would normally provide. Behind-the-meter delivery shortens the electrical path from turbine to server, cutting transmission losses and congestion-pricing exposure. The operating model front-loads capital into turbines, heat recovery and controls, then earns
    over decades of high-utilization dispatch. Every layer is individually proven, but integrating them at 2.67 GW for a single AI customer is the central technical unknown.
  claimRefs:
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
  - CE019
  - CE040
