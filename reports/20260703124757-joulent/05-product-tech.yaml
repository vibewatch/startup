chapter:
  number: 5
  title: Product & Technology
  summary: Joulent's product is dedicated, large-scale electrical power delivered as a service to hyperscale data centers via co-located, behind-the-meter generation. Its flagship asset, Project Kilby, pairs GE Vernova 7HA gas turbines in combined-cycle blocks with Caterpillar Solar Turbines and grid-orchestration software to island a ~2.67 GW campus off the ERCOT grid, trading emissions and fuel exposure for speed-to-power and reliability control.
sections:
- id: product-definition
  title: Product definition in customer workflow terms
  body: 'Joulent''s product is not a device or a piece of software but firm electrical power delivered as a service to hyperscale data centers and industrial users. The company finances, builds, owns and operates the generation and sells electricity under long-term agreements, so from the customer''s perspective it is buying guaranteed capacity rather than equipment. The flagship, Project Kilby, is engineered to deliver roughly 2.67 GW to serve Microsoft''s AI compute. The job it solves is acute: hyperscalers need multi-hundred-megawatt firm power on a timeline the congested public grid cannot meet, and interconnection queues stretch for years. By co-locating generation with compute in an off-grid, behind-the-meter campus that islands its load from ERCOT, Joulent removes the transmission bottleneck entirely and shortens the electrical path from turbine to server. In workflow terms, the customer swaps a multi-year wait for grid capacity for a purpose-built plant delivered on a private schedule.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  tableRefs:
  - TE002
  figureRefs:
