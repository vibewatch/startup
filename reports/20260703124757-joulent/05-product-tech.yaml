callouts:
- calloutType: strength
  title: Proven components, differentiated integration
  body: Joulent assembles field-proven GE Vernova 7HA turbines and combined-cycle heat recovery into an islanded, behind-the-meter campus—its edge is integration and speed-to-power, not novel hardware, which lowers technology risk while keeping execution risk high.
  claimRefs:
  - CE014
  - CE027
  - CE040
- calloutType: risk
  title: Islanded 2.67 GW integration is unproven
  body: No operator has run a fully off-grid gas microgrid at Kilby's scale for a single AI customer; self-supplying grid services and orchestrating 2.67 GW of load is the central technical unknown.
  claimRefs:
  - CE017
  - CE040
  - CE024
- calloutType: assumption
  title: Turbine slot access gates the timeline
  body: GE Vernova's sold-out heavy-duty backlog means Kilby's 2028 first-power target hinges on secured turbine delivery slots as much as on capital or permits.
  claimRefs:
  - CE023
  - CE021
