- id: deployment-roadmap
  title: Deployment, reliability, support and roadmap
  body: 'The deployment path runs from a targeted end-2026 final investment decision to a 2028 first-power goal, implying a compressed multi-year engineering-procurement-construction cycle with more than 6,000 workers at peak. A critical gating dependency is turbine availability: GE Vernova''s heavy-duty gas-turbine backlog is effectively sold out into the late 2020s, so securing delivery slots matters as much as capital or permits to hitting 2028. Reliability for an AI training campus depends on very high availability, so redundant turbine blocks and on-site backup are integral to the design, and a phased buildout lets capacity come online in blocks—allowing partial revenue before the full 2.67 GW is complete. Long-term support and maintenance are expected to lean on OEM service agreements from GE Vernova and Caterpillar rather than an in-house field organization. Taken together the roadmap is milestone-clear but every post-FID date remains a target rather than a committed, financed schedule,
    so slippage risk is real.'
  claimRefs:
  - CE020
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
  - CE026
  tableRefs:
  - TE005
- id: differentiation
  title: Differentiation and competitive moat
  body: 'Joulent''s primary differentiation is speed-to-power: delivering firm gigawatt-scale capacity years faster than a grid-interconnected alternative by bringing generation to the site rather than waiting on transmission. Around that sits a partner-access moat—privileged supply of GE Vernova turbines, Chevron fuel and balance sheet, and a Microsoft anchor offtake—that is hard for a new entrant to assemble. Physical site control over 2,000-plus acres with co-located gas is itself a scarce, hard-to-replicate asset, and Engine No. 1 incubation plus Chris James''s energy-transition network give Joulent capital-markets and dealmaking reach uncommon for a young developer. The important caveat is that the behind-the-meter concept is not proprietary: competitors from Crusoe to traditional IPPs are pursuing the same co-location thesis, so the durable edge is first-mover execution and integration quality, not the idea. On a maturity map, the components are proven while the differentiated, still-unproven
    layer is islanded integration at full scale.'
  claimRefs:
  - CE027
  - CE028
  - CE029
  - CE030
  - CE031
  figureRefs:
  - FE003
  - FE004
- id: trust-compliance
  title: Trust, safety, compliance and quality controls
  body: 'As large combustion sources, Kilby''s turbines require federal and state air-quality permitting for pollutants such as NOx and CO2, and islanding off ERCOT reduces interconnection-approval exposure but does not exempt the plant from environmental and safety regulation. The design draws pointed criticism: analysts and environmental groups argue that a large gas-fired plant for data centers carries meaningful carbon and stranded-asset risk if AI demand or climate policy shifts, and no public lifecycle-emissions model has been released. Hydrogen co-firing offers a compliance hedge, but current blends only modestly reduce lifecycle emissions. Reliability and safety quality are governed largely by OEM engineering standards and long-term service agreements rather than independent audit, and no third-party review of Kilby''s design, emissions modeling or reliability engineering is yet public. Water sourcing for combined-cycle steam and cooling in arid West Texas is a further unresolved
    operational and compliance question. In short, compliance obligations are identifiable but publicly under-documented.'
  claimRefs:
  - CE032
  - CE033
  - CE034
  - CE035
  - CE036
  - CE037
  - CE038
  - CE039
