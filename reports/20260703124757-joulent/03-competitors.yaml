- calloutType: insight
  title: Joulent's edge is a bundle, not a single feature
  body: No individual rival matches Joulent's combination of Chevron fuel and capital, GE Vernova turbines, National Grid's balance sheet and a Microsoft anchor; the moat is the assembly, which is also its fragility if any partner exits.
  claimRefs:
  - CP020
  - CP036
  - CP037
- calloutType: risk
  title: The gas co-location model is being copied
  body: Homer City, VoltaGrid and others pursue the same playbook, and Joulent's own turbine supplier equips rivals, raising commoditization and delay risk against better-capitalized incumbents.
  claimRefs:
  - CP017
  - CP019
  - CP029
  - CP031
