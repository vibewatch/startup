- id: peer-profiles
  title: Peer profiles and funding
  body: The most direct scaled peer is Crusoe, a vertically integrated AI-infrastructure company that reached roughly a $10 billion valuation after a $1.375 billion Series E in late 2025 and has been reported raising a pre-IPO round in 2026; its blend of data-center development, power sourcing and AI cloud gives it a revenue base Joulent lacks. Behind-the-meter specialists VoltaGrid and Bloom Energy compete on distributed gas and fuel-cell generation, while colocation developers like Vantage and Equinix arrange dedicated on-site power. Among IPPs, Vistra runs a large gas-and-nuclear fleet, Constellation is restarting Three Mile Island for Microsoft, and Talen has struck nuclear deals with Amazon—carbon-free, round-the-clock offerings that contrast with gas. Homer City's roughly 4.5-GW GE-Vernova-powered Pennsylvania campus shows the co-located gas model being replicated at gigawatt scale by others.
