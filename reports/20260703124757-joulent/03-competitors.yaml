- id: differentiation-pricing
  title: Differentiation and pricing
  body: 'Joulent differentiates less on any single feature than on a bundled package: Chevron''s fuel supply and balance sheet, GE Vernova''s scarce turbine slots, National Grid''s strategic capital and a Microsoft anchor—an assembly no single rival replicates. At a roughly $5 billion implied valuation it sits below Crusoe''s ~$10 billion, a gap that reflects Crusoe''s broader operating platform as much as stage. Competition across the field turns on speed-to-power, siting and access to firm fuel or turbines rather than published price, since pricing is set through bilateral 10-to-20-year PPAs; in Kilby''s case Chevron holds the Microsoft agreement. Access to scarce gas turbines is a shared gating factor, and notably Joulent''s own supplier, GE Vernova, equips competing projects, so the equipment advantage is real but not exclusive.'
  claimRefs:
  - CP019
  - CP020
  - CP021
  - CP022
