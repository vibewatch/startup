- id: segmentation-adoption
  title: Buyer segmentation and adoption path
  body: 'Demand concentrates among hyperscale cloud and AI operators—Microsoft foremost—alongside colocation providers, REITs and large industrial users. The economic payer is typically the hyperscaler, which contracts power under 10-to-20-year purchase agreements, with budget ownership sitting in infrastructure and energy-procurement teams steering multi-billion-dollar capex programs. The adoption path is long and capital-intensive: site selection and land control, then generation and interconnection, followed by a long-term power agreement, financing and a final investment decision, and finally construction and energization over several years. Project Kilby—where Chevron holds a 20-year PPA with Microsoft and Joulent an equity option—illustrates this motion end to end. Increasingly, AI operators co-locate compute directly with dedicated generation to compress time-to-power, turning speed into a procurement differentiator and making contracted, long-duration offtake the linchpin of the
    investment case.'
  claimRefs:
  - CM016
  - CM017
  - CM018
  - CM019
  - CM020
  - CM035
  - CM036
  - CM037
  tableRefs:
  - TM003
  figureRefs:
  - FM003
- id: drivers-constraints
  title: Growth drivers and constraints
  body: 'The dominant driver is the AI-compute surge, which is far more power-hungry than prior workloads and is colliding with grid interconnection queues that often stretch for years—together the core reason hyperscalers turn to co-located generation, where speed-to-power and long-dated offtake de-risk new plants. Against these drivers sit real constraints. Texas''s Senate Bill 6 and ERCOT''s new large-load interconnection standards impose study fees, per-megawatt financial security and disclosure obligations on loads of 75 megawatts and above, while regulators grapple with the systemic strain of concentrated demand. Capital intensity—power plants costing millions of dollars per megawatt—limits how quickly supply can scale, tight gas-turbine availability adds a physical bottleneck, and mounting emissions scrutiny pressures new gas-fired capacity. Finally, the demand forecasts themselves carry wide error bars: sustained AI adoption, efficiency gains or a financing pullback could each move
    the trajectory materially, and the divergence of published estimates underscores that uncertainty. For diligence, the constraint set is as important as the demand curve, since it determines which developers can actually convert demand into energized, contracted megawatts.'
