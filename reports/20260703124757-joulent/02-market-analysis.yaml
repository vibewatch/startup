- id: market-sizing
  title: Market sizing across multiple lenses
  body: No single number captures this market, so it must be triangulated across lenses. On a consumption basis, the IEA projects global data-center electricity use roughly doubling to about 945 terawatt-hours by 2030. On a capacity basis, blended estimates put data-center power demand near 132 gigawatts in 2026, rising toward roughly 290 gigawatts by 2030, with Gartner alone expecting about 26% consumption growth in 2026. On a capital basis, McKinsey and JP Morgan frame $5-7 trillion of global data-center investment this decade, with McKinsey's headline near $6.7 trillion, while Goldman Sachs models a 165% jump in power demand by 2030. Hyperscaler capex of roughly $690 billion in 2026—Microsoft alone near $190 billion—underscores the spend behind these curves. Crucially, only a fraction of this is addressable by any one co-located developer, so Joulent's serviceable and obtainable market is far smaller than the headline totals and is not publicly quantified.
  claimRefs:
