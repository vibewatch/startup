callouts:
- calloutType: insight
  title: Power, not chips, is the binding constraint
  body: Across Gartner, IEA, Goldman and McKinsey, the consistent message is that electricity supply and interconnection—not GPU availability—are becoming the gating factor for AI growth, which is precisely the bottleneck Joulent targets.
  claimRefs:
  - CM008
  - CM021
  - CM022
- calloutType: risk
  title: Sizing estimates are not directly comparable
  body: Headline figures mix gigawatts, terawatt-hours and dollars, so a single 'market size' is misleading; Joulent's obtainable share is not publicly quantified and should not be inferred from TAM figures.
  claimRefs:
  - CM032
  - CM033
  - CM015
- calloutType: assumption
  title: Demand forecasts carry wide error bars
  body: Projections assume sustained AI adoption and financing; efficiency gains or a capex pullback could materially lower realized demand growth.
  claimRefs:
  - CM034
  - CM024
