  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与细分
        blocks:
          - type: paragraph
            body: >-
              Joulent 瞄准两个客户群：超大规模数据中心运营商和大型工业用电方。现实中，当前客户基础是一个决定性账户——Microsoft； 它同时是买方、用户和付款方，签约约 2 GW 的 Project Kilby
              容量以支撑 AI 算力。地理布局集中在德克萨斯州 Reeves County 的 Kilby 园区，核心用例是为无法及时获得电网容量的 AI 训练和推理供电。工业用户被列为目标细分，
              但没有披露具体工业客户，也没有公布第二家超大规模客户。因此，除一个账户外，细分故事更多是愿景：市场机会横跨多个垂直领域， 但具体客户现实是一家超大规模云厂商，并且商业上通过 Chevron 合资 PPA
              连接。这决定了后续所有关于采用、留存和集中的问题。
