  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用客户工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Joulent 的产品不是设备，也不是软件，而是向超大规模数据中心和工业用户交付的稳定电力服务。公司融资、建设、持有并运营发电资产， 再通过长期协议售电；站在客户角度，买到的是有保障的容量，而不是设备。旗舰
              Project Kilby 设计供给约 2.67 GW， 用于支撑 Microsoft 的 AI 算力。它解决的问题很急：超大规模客户需要数百兆瓦级稳定电力，但拥堵的公共电网无法按其时间表交付，
              并网排队长达数年。Joulent 把发电与算力同址部署在离网、表后园区，并将负荷从 ERCOT 孤岛隔离，等于完全移除输电瓶颈，
              缩短从涡轮到服务器的电气路径。放在工作流里看，客户用一座按私人时间表交付的定制电厂，替换了等待多年公共电网容量的过程。
