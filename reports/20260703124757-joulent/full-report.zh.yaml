      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              德克萨斯州监管背景因 Senate Bill 6 (2025) 而改变，该法收紧了大型电力负荷接入电网的规则；ERCOT 的大负荷流程（Project 58481）则对约 75 MW
              及以上负荷施加研究费、披露和担保要求。SB6 还赋予 ERCOT 和公用事业公司在电网承压时削减或断开大型负荷的扩大权限； 法律分析师也提示，数据中心负荷面临更高披露和需求透明义务。Joulent
              的离网、表后设计因园区负荷孤岛运行， 降低但没有完全消除这些并网规则暴露。另一个维度是，大型燃气轮机的空气质量许可（NOx 和 CO2）是必须完成且耗时的步骤；
              大型化石能源项目存在环境诉讼或许可挑战这一现实法律风险；德克萨斯州西部干旱地区的用水许可，也给联合循环冷却增加依赖。 联邦能源监管还可能影响同址和批发电力安排。风险登记按严重度排序，但 Kilby
              具体申报文件尚未公开，因此剩余暴露只能部分量化。
