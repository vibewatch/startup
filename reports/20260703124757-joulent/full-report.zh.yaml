        title: 旗舰项目与伙伴关系
        blocks:
          - type: paragraph
            body: >-
              Joulent 的旗舰是 Project Kilby：位于德克萨斯州 Permian Basin、Reeves County 近 Pecos 的 2,000 多英亩同址电力园区， 容量 2.67 吉瓦，约等于
              200 万户家庭用电。Chevron 通过子公司 Energy Forge One LLC 持有与 Microsoft 签订的 20 年购电协议；Microsoft 邻近的 Pecos
              数据中心园区计划在五至七年内新增约 2 GW 算力负荷；Joulent 持有该合资公司的 50% 股权期权。GE Vernova 提供核心涡轮技术，Caterpillar 的 Solar Turbines
              部门补充发电能力。该项目预计耗资 $7-9B，目标是在 2026 年底前完成最终投资决策、2028 年首次送电，并声称可创造超过 $10B 州和地方税收以及约 2,000 个就业岗位。
