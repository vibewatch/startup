        blocks:
          - type: paragraph
            body: >-
              Kilby 的架构把已验证组件叠成一个孤岛系统。燃气轮机燃烧 Permian 燃料带动发电机，余热回收蒸汽循环捕捉排气热量驱动蒸汽轮机， 把燃料转电效率显著推高到简单循环之上；GE Vernova 7HA
              平台的联合循环效率达到 63-64% 区间，处于商用燃气发电最高水平之一， 并设计为可掺烧氢气，为部分脱碳留出路径。由于园区离网运行，GridOS 类电网编排软件必须持续平衡发电、储能和负荷；
              电厂还必须自供频率调节、旋转备用和黑启动能力，而这些通常由公共电网提供。表后交付缩短从涡轮到服务器的电气路径，
              降低输电损耗和拥塞电价暴露。运营模型先把资本投进涡轮、余热回收和控制系统，再靠数十年高利用率调度赚钱。 每一层单独看都已验证，但为单一 AI 客户整合到 2.67 GW 规模，是核心技术未知数。
