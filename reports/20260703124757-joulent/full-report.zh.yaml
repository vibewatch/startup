              Grid 等伙伴渠道，而不是传统销售团队。客户获取因此高度集中，首个项目由单一锚定客户支撑； 吉瓦级交易的销售周期横跨数月到数年，涉及选址、并网和签约。成本端，模型极度重资本：Kilby 预计耗资约 $7-9B，
              同址燃气发电每兆瓦成本达到数百万美元，GE Vernova 涡轮和 Caterpillar 机组是主要支出项。利润率取决于合同 PPA
              收入与天然气燃料、运营成本之间的价差，再用高利用率和长合同摊销前置重资本开支。重要的是，离网、表后设计让 Kilby
