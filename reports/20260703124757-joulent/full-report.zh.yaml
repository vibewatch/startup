      - number: '7.4'
        title: 伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Joulent 处在一张高度集中的依赖网络中心。Chevron 依赖度高——它持有 Microsoft PPA 并供应燃料，承诺本身就是承重梁；GE Vernova
              在燃机和电网编排技术两端同样是高依赖。National Grid Ventures 是关键资本提供方，任何承诺变化都会拉紧融资；Microsoft
              又同时是关键客户和需求理由，进一步放大集中度。ERCOT、Texas PUC 和环保机构等监管方是外部依赖，能直接卡住项目。JV 结构意味着 Joulent
              的经济性取决于其无法完全控制的伙伴履约；燃料、燃机、资本或包销任一关键伙伴失手，都可能让旗舰项目停摆。人员侧，执行要靠一个年轻组织交付首个同等规模超级项目；公司依赖创始人兼 CEO Chris
              James，也需要足够深的项目开发和 EPC 管理梯队。各行按伙伴或执行失败的严重程度排序。
