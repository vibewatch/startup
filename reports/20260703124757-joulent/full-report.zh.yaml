            body: >-
              客户集中度极高：实质上一个客户支撑整个旗舰项目，单一客户依赖是最主要商业风险。土地扩张路径是用 National Grid Ventures
              资本复制更多超大规模园区的同址模式，但扩张高度依赖伙伴——Chevron 负责燃料和 PPA，GE Vernova 负责涡轮——也受制于吉瓦级交易漫长、
              高摩擦的采购周期。怀疑者还给出两个反向视角：他们质疑在气候承诺下，超大规模客户依赖新建燃气电厂能否持久； 也指出 Microsoft 有多种替代电力来源——核电重启、可再生能源和竞争开发商——这限制了
              Joulent 的议价能力。 围绕大型“燃气供数据中心”项目的社区和环保反弹，可能进一步压迫客户形象。Microsoft AI 资本开支下行或策略转向， 会直接威胁 Kilby 经济性；因此，走出
              Microsoft、实现客户多元化，是降低客户基础风险的关键里程碑。截至 2026 年中， 这一里程碑仍未达成。
