            title: 组件成熟，集成差异化
            body: Joulent 把现场验证过的 GE Vernova 7HA 涡轮和联合循环余热回收，组装成孤岛、表后园区。优势在集成和通电速度， 不在新硬件；技术风险降低，但执行风险仍高。
