            body: >-
              Joulent 的主要差异化是通电速度：把发电带到场址，而不是等待输电，把稳定吉瓦级容量交付时间比并网替代方案提前数年。 外围是一道伙伴准入护城河——GE Vernova 涡轮的优先供给、Chevron
              的燃料和资产负债表、Microsoft 锚定承购——新进入者很难拼出。 超过 2,000 英亩、具备同址燃气条件的实体场址控制，本身就是稀缺且难复制的资产；Engine No. 1 孵化和 Chris James
              的能源转型网络，也给 Joulent 带来年轻开发商少见的资本市场和交易触达能力。关键但书是，表后概念并非专有： 从 Crusoe 到传统
              IPP，竞争者都在推进同址命题。因此，能长期保持的优势不是想法，而是先发执行和集成质量。 放在成熟度地图上，组件已经验证；差异化但仍未验证的一层，是全规模孤岛集成。
