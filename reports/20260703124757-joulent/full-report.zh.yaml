  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局
        blocks:
          - type: paragraph
            body: >-
              Joulent 在一个拥挤且快速变化的赛道中竞争：为 AI 数据中心提供可靠电力。格局横跨四类玩家：Crusoe 等垂直整合的 AI 电力开发商；VoltaGrid、Bloom Energy
              等表后和现场供电专家；Vistra、Constellation、Talen 等燃气和核电独立发电商； 以及 Homer City 与 Kiewit
              等可比的同址燃气开发商。所有玩家背后都有一个现状替代项：通过受监管公用事业公司做标准并网接入。 这仍是默认选择，但多年排队越来越受限。传统 IPP
              现在直接面对分布式和同址电力竞争；超大规模云厂商也可以“内部自建”， 自行签约发电，这对每个第三方开发商都是隐性竞争者。这种广度意味着 Joulent 不能只在单一维度取胜，而要同时拼速度、选址、
              燃料和资本。赛道也很流动：核电重启、燃气同址和表后燃料电池，资金都来自同一小群超大规模客户，因此即便技术不同， 竞争者也常在客户上重叠。对尚未完成 FID
              的新进入者而言，实际问题不是竞争者是谁，而是谁真能按超大规模客户的时间表交付已送电兆瓦； 在这项测试上，已有运营电厂的既有玩家起跑领先。
