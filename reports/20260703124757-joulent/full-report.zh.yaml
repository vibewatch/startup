      - number: '2.4'
        title: 增长驱动与约束
        blocks:
          - type: paragraph
            body: >-
              主导驱动因素是 AI 算力激增。相比以往工作负载，AI 耗电高得多，又撞上动辄数年的并网排队；两者合在一起， 正是超大规模客户转向同址发电的核心原因。通电速度和长期承购为新电厂降风险。驱动因素之外，约束也很硬。
              Texas Senate Bill 6 和 ERCOT 新的大负荷并网标准，对 75 兆瓦及以上负荷施加研究费、按兆瓦计的财务担保和披露义务；
              监管方也在处理集中需求带来的系统压力。资本强度——电厂每兆瓦成本以数百万美元计——限制供给扩张速度，燃气轮机紧缺又增加实体瓶颈， 排放审查升温则压迫新增燃气容量。最后，需求预测本身误差带很宽：AI
              采用能否持续、效率提升或融资回撤，都可能显著改变轨迹； 公开估算分歧也凸显了这种不确定性。对尽调而言，约束集合和需求曲线同样重要，因为它决定哪些开发商真能把需求转成已送电、已签约的兆瓦。
