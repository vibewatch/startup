      - number: '2.3'
        title: 买方细分与采用路径
        blocks:
          - type: paragraph
            body: >-
              需求集中在超大规模云和 AI 运营商——Microsoft 最突出——以及托管服务商、REIT 和大型工业用户。经济买方通常是超大规模云厂商， 通过 10-20
              年购电协议锁定电力；预算归属基础设施和能源采购团队，它们推动数十亿美元级资本项目。采用路径漫长且重资本：
              先选址和控制土地，再落实发电和并网，随后签长期购电协议、完成融资和最终投资决策，最后历经数年建设并送电。Project Kilby 完整展示了这一动作：Chevron 持有与 Microsoft 的 20 年
              PPA，Joulent 持有股权期权。AI 运营商越来越多地把算力直接同专用发电同址部署， 以压缩通电时间；速度变成采购差异点，长期合同承购则成为投资案的支点。
