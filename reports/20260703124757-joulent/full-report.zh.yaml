      - number: '1.3'
        title: 融资、估值与所有权
        blocks:
          - type: paragraph
            body: >-
              2026 年 7 月 1 日，英国公用事业公司 National Grid plc 的商业化非监管部门 National Grid Ventures 同意向 Joulent 投资 $1.75B，取得约 35%
              股权；Kirkland & Ellis 为该交易提供法律顾问。该价格隐含约 $5B 的标题估值， 将这家年轻公司推至独角兽规模；但该数字来自交易推算，并非审计标记。National Grid
              称这笔投资由资产负债表出资， 且是在其创纪录资本计划之外的增量投入；公司已为 Ventures 项目预留约 $1B 近期资本。这笔资金拟用于 Project Kilby 和其他大型项目，让 National
              Grid 直接押注美国快速增长的“大负荷”合同电力需求；但 Joulent 的剩余所有权和完整股权结构仍未披露。
