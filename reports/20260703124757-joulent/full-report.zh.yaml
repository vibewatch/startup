      - number: '7.3'
        title: 运营与供应链风险
        blocks:
          - type: paragraph
            body: >-
              运营风险集中在燃机供应。GE Vernova 重型燃气轮机积压订单实际上已经排到 2020 年代末，全球需求强劲带来交付档期风险，可能拖慢 Kilby 时间表。建设期风险包括高峰超过 6,000
              名工人时劳动力能否到位、EPC 协调以及西得州天气。建成之后，2.67 GW
              微电网要孤网运行，必须自己提供电网通常承担的调频、备用和黑启动服务，可靠性风险随之上升；单站电厂也意味着停机或设备故障会直接威胁锚定客户供电。即使靠近
              Permian，天然气供应中断或价格飙升仍会压住运营和利润率。更麻烦的是，Kilby
              这套具体设计还没有公开的可靠性、安全或质量审计记录，投运前运营风险大多无法量化。运营风险登记表按严重程度排序，燃机交付、建设超支和孤网可靠性排在最前。
