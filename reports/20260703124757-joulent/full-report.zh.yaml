      - number: '5.6'
        title: 信任、安全、合规与质量控制
        blocks:
          - type: paragraph
            body: >-
              作为大型燃烧源，Kilby 的涡轮需要获得联邦和州层面的空气质量许可，覆盖 NOx、CO2 等污染物；脱离 ERCOT 孤岛运行降低了并网审批暴露，
              但不让电厂免于环境和安全监管。该设计遭到明确批评：分析师和环保组织认为，如果 AI 需求或气候政策转向，
              为数据中心建设大型燃气电厂会带来实质碳排和搁浅资产风险；公司尚未发布公开生命周期排放模型。氢气掺烧提供合规对冲， 但当前掺混比例只能有限降低生命周期排放。可靠性和安全质量主要由 OEM
              工程标准和长期服务协议约束，而非独立审计； Kilby 设计、排放建模或可靠性工程尚无第三方评审公开。West Texas 干旱地区的联合循环蒸汽与冷却用水来源，
              也是一个未解决的运营和合规问题。简言之，合规义务能识别，但公开材料记录不足。
            claimRefs:
              - CE032
