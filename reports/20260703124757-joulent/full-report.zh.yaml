            body: >-
              可比公司给当前标记框定区间。Crusoe Energy 是可比的 AI 数据中心电力和算力开发商，2025 年末轮次估值约 $10 billion；数据中心基础设施资产交易大约在 15-19x
              EBITDA；Vistra、Constellation、Talen 等受数据中心需求影响的上市独立发电商提供公开市场参照，而 2025-2026 年 AI
              电力基础设施的私募战略轮集中在数十亿美元估值。合在一起看，Joulent 的 ~$5 billion 标记在主题区间内，但对一个无收入、单资产开发商而言偏贵；每个可比对象也都有局限：Crusoe
              已有算力收入，IPP 是运营中的公用事业，基础设施倍数假设资产已经产生现金流。对 Kilby 做 DCF 会取决于 PPA
              定价、天然气成本、利用率和折现率，这些大多未披露。退出准备度还早——无收入和单资产集中限制近期流动性——但 IPO、战略出售或 National Grid 买断都可行。最终尽调问题集中在财务、股权结构、PPA
              经济性和项目融资计划；怀疑者也有道理，主题驱动估值可能跑在基本面前面。
