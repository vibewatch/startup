  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Joulent 面向的市场，是服务“大负荷”数据中心——尤其是 AI 算力园区——的大规模合同电力供应和实体电力基础设施。 纳入范围的支出包括新增发电容量、并网接入、同址和表后电厂，以及长期购电协议；明确排除
              GPU、服务器、制冷等 IT 硬件。 现状替代方案是通过受监管公用事业公司做常规并网接入，但多年排队正越来越卡住超大规模云厂商。相邻供给路径包括电网侧独立发电商、
              核电重启和小型模块化反应堆、燃料电池或混合现场系统，它们在边际上竞争。表后和同址燃气发电已成为获得可靠电力最快的路径， Joulent 产品化的正是这一段。尽调必须划清边界，因为标题性的“数据中心”支出把 IT
              硬件、地产和电力混在一起；只有把电力与并网层单独剥离， Joulent 的机会才看得清。公司竞争的不是更庞大的算力硬件预算，而是更窄的一片：按超大规模客户时间表交付的新可调度容量。
