      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Joulent 的公开门面是创始人兼 CEO Chris James；他同时领导自己 2020 年创办的激进投资机构 Engine No. 1， 该机构因 2021 年赢得 ExxonMobil
              三个董事席位而出名。这一双重身份给 Joulent 带来经验丰富、可信度高的能源转型领军人物， 也让关键人风险集中，因为公司尚未公开其他具名高管。James 将 AI 时代的领导力定义为一场竞赛：谁能以最快、
              最可靠、最低成本交付能源和算力，谁就占优；这正是 Joulent 策略背后的命题。创始人之外的治理细节很薄：高管团队、 董事会构成，以及 Engine No. 1 与新投资方 National Grid
              Ventures 之间的控制权平衡尚未公开，管理层厚度由此成为重要尽调缺口。
