            body: >-
              Joulent 的收入模型建立在向数据中心和工业用户供电的长期购电协议上。Project Kilby 方面，Chevron 通过 Energy Forge One 子公司持有与 Microsoft 的 20 年
              PPA，Joulent 则通过合资公司 50% 股权期权参与，这是其获取项目经济收益的主要路径。 这类协议通常期限 10-20
              年，带有照付不议式承诺；价格由双方谈判而非公开，在该细分市场常被引述为每兆瓦时数十美元。 电厂投运后，电力交付、容量可用时才会确认收入；今天 Joulent 在 Kilby 上尚未产生收入，目标 2028
              年首次送电。 因此，收入线条结构清晰但数字不透明：合同存在，但价格、调价机制和 Joulent 精确经济份额都未披露。
