      - number: '3.4'
        title: 护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Joulent 最耐久的护城河是合同：长期 PPA 一旦签下，就形成高转换成本；站址控制、并网权和涡轮交付槽也都是难复制资产。 但耐久性有条件。配电能力和资本化程度有利于 Vistra、Constellation
              等既有玩家，它们已经拥有机组和电网关系； 超大规模客户也会在核电、燃气和电网之间多点下注，避免依赖。许多开发商都在复制同址燃气模式，模型正被商品化；
              核电和可再生能源加储能等无碳竞争者可能凭排放和长期成本取代燃气，随着可持续审查升温，这一威胁更强。 与竞争者共享的涡轮稀缺，可能让 Joulent
              落后于已有运营电厂的核电同业；资本更雄厚的既有玩家也能出价压过单项目新进入者。 护城河确实存在，但很大程度压在 Kilby 完成最终投资决策、并留住伙伴组合上。2028
              年首次送电前，护城河的每一层都只是前瞻而非已证明； 投资人必须把这个核心竞争脆弱性同伙伴阵容的强度放在一起权衡。
