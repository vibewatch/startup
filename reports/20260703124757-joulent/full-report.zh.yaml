  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点是：AI 数据中心共址电力稀缺且快速增长，Joulent 已是早期领先者；已签署的 Microsoft 20 年购电协议和 $1.75 billion
              战略投资验证了需求，也降低了锚定项目风险。特权伙伴通道——Chevron 提供燃料和包销，GE Vernova 提供燃机，National Grid
              提供资本——拼成了一个新进入者很难复制的生态优势。反论点同样清楚：Joulent 仍无收入、单项目、单客户，约 $5 billion
              估值押的是执行期权；一旦执行滑坡，资本强度、碳暴露和建设风险都可能侵蚀回报。两种判断押的是同一组变量：如果 Kilby
              按期完成最终投资决策和首批供电，且客户不变，正论点成立；任一项失败，反论点成立。因此，估值争论本质上是贴了价格标签的执行争论。
