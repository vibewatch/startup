      - number: '2.2'
        title: 多视角测算市场规模
        blocks:
          - type: paragraph
            body: >-
              没有一个数字能概括这个市场，只能从多个视角交叉测算。按用电量看，IEA 预计全球数据中心用电到 2030 年大致翻倍， 达到约 945 太瓦时。按容量看，综合估算显示数据中心电力需求 2026 年接近 132
              吉瓦，到 2030 年升至约 290 吉瓦； 仅 Gartner 就预计 2026 年用电增长约 26%。按资本看，McKinsey 和 JP Morgan 将本十年全球数据中心投资框定在
              $5-7T，McKinsey 的标题数字接近 $6.7T；Goldman Sachs 则测算到 2030 年电力需求跃升 165%。2026 年超大规模云厂商资本开支约 $690B——仅 Microsoft
              就接近 $190B——凸显这些曲线背后的支出。关键在于，任一同址开发商可触达的只是一小部分， 因此 Joulent 的可服务市场和可获得市场远小于标题总量，且没有公开量化。
