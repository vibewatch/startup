      - number: '8.3'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              2026 年 7 月 National Grid Ventures 投资——以 $1.75 billion 换约 35%——对应约 $5 billion
              投后估值。这是战略少数股权投资，不是控股交易，因此会影响优先权和治理动态，也可能留下稀释或优先权悬挂，压住未来普通股回报。入场纪律面临挑战，因为估值立在已签约管线而非当前盈利上：公开证据支持交易存在和规模，却没有独立估值交叉验证；这个标记是私募一级发行价格，不是经过市场检验或流动性背书的价格。尽调用语里，这个价格应理解为执行期权的溢价，而不是现金流倍数。若投资人按这个水平或更高价格买入，就是在承销首个同等规模超级项目完美交付；因此，必须先核实
              $7-9 billion 建设背后的合同经济性和融资计划，才能把 ~$5 billion 视为底价，而不是乐观标记。
            claimRefs:
