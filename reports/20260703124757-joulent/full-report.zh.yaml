      - number: '8.2'
        title: 建议、置信度和立场
        blocks:
          - type: paragraph
            body: >-
              综合看，建议是持续跟踪：今天的 Joulent
              更像一个高质量期权，而不是已经可以承销的业务。置信度为中，最大约束是几乎没有公开财务数据，无法独立承销收入质量、利润率或回报。风险评级为高，由执行、客户集中和资本强度驱动；估值立场为溢价，因为约 $5
              billion 标记已经计入尚未证明的成功执行。可支持的姿态，是在投入资本前跟踪 2026 年底最终投资决策和 2028
              年首批供电里程碑，并随着每一步降险重新定价。与其他选择相比，信息不透明让直接投资为时过早；但若直接放弃，又低估了一个真正强伙伴、押注稀缺资源的优质期权。跟踪是穿针引线的选择：保留上行参与权，不预先支付完整执行溢价，同时定义足以支持更坚定立场的具体里程碑。
