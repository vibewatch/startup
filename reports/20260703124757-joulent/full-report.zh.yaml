        title: 财务结论与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              财务图景更像一个高信心期权，而不是已验证业务。积极面是，一旦投运，Kilby 现金流将由与投资级交易对手签订的 20 年协议锚定，
              支撑高收入质量和项目融资杠杆。反面是，资本强度和长建设周期把回报压到后端，也让模型暴露于成本超支和延期； 怀疑者警告，如果 AI
              需求或气候政策转向，为数据中心新建大型燃气电厂可能面临搁浅资产和回报风险。最大的尽调阻塞点， 是公开财务几乎完全缺位——收入、利润率、烧钱速度、完整股权结构和项目融资条款都未披露——因此约 $5B
              隐含估值是一个尚未产生收入、 由交易推导的标记，押注的是合同管线而非当前现金流。结论：结构有吸引力，经济性未验证；披露缺口必须在承销前补上。 2026
              年底最终投资决策是第一个硬检查点，投资逻辑要么明显降风险，要么直接停滞。
