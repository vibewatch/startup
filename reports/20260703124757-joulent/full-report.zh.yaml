            title: 执行与集中度主导风险
            body: $7-9B、首个同等规模燃气超级项目，要在 2028 年交付，由单一客户和数个承重伙伴支撑，这就是 Joulent 的风险画像。20 年 PPA 和强伙伴能缓冲下行，但无法拿掉建设、供应链和集中度暴露。
