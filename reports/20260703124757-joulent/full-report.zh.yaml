      - number: '7.5'
        title: 财务、碳和缓释触发点
        blocks:
          - type: paragraph
            body: >-
              从财务看，已募得的 $1.75 billion 股权资金相对 $7-9 billion 建设规模偏小，意味着还要承担大量追加融资风险；长期收入前阶段也会在首笔收入前持续烧钱。天然气价格上涨，或 PPA
              定价固定且缺少充分传导，都会挤压利润率；以 20 年 PPA 加杠杆虽可行，却让模型暴露于利率和信用环境。几乎没有公开财务数据，本身就是尽调风险，限制独立验证；AI
              数据中心资本开支下行会同时削弱需求和估值依据。缓释最弱的尾部风险是碳：批评者警告，如果 AI
              需求或气候政策转向，为数据中心新建大型燃气电厂会有搁浅资产风险；环保组织强调气候张力；超大规模云厂商的气候承诺也可能长期压迫客户限制燃气电力。20 年
              PPA、投资级包销方、强伙伴和可用氢燃机等关键缓释因素能降低风险，但不能消除风险。最清晰的论点破裂触发点，是 FID 滑过 2026 年底、Microsoft 合同丢失，或重大成本爆表。
