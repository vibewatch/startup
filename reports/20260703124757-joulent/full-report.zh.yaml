    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Joulent 是一家总部位于德克萨斯州休斯敦、技术驱动的能源公司，为 AI 数据中心和工业用户建设大规模同址电力基础设施。 经过投资机构 Engine No. 1 与 GE Vernova
              多年合作孵化后，公司于 2026 年 6 月公开亮相。其产品化的 “Across-the-Meter” 电力栈把燃气发电、电池储能和可再生能源同客户负荷同址部署，并管理并网接入，以工业级规模交付可靠电力。
              公司主打以“美国创新的速度和规模”供能，瞄准超大规模算力面临的尖锐电力瓶颈。Joulent 是私营公司；截至 2026 年 7 月，最合适的阶段判断是成长型开发期，首个旗舰项目仍处于最终投资决策前。
