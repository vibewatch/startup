      - number: '6.2'
        title: 采用轨迹与需求
        blocks:
          - type: paragraph
            body: >-
              采用是合同层面的，还不是运营层面的。Kilby 已签约但尚未供电，因此没有活跃使用、复购或利用率数据；标题指标是已签容量——总计约 2.67 GW，其中 Microsoft 实际预留约 2
              GW——而非已部署或已利用兆瓦。首次送电目标为 2028 年，意味着今天不存在任何部署、 账户增长或利用率数据，当前运营容量为零。让预留有分量的是背后需求：Microsoft 更广泛的 AI 建设，包括大型
