  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Joulent 的风险画像由两股力量主导：执行和集中。最大单一风险，是在压缩的 2026-2028 年时间表上交付一座 $7-9B、 吉瓦级燃气电厂，且首次送电预计要到 2028
              年——这意味着任何抵消性收入出现前，会有数年的建设期无收入暴露。 资本强度放大下行，因为数十亿美元建设一旦超支，会直接侵蚀股权回报。执行之外，客户集中也是顶级风险：实质上一个客户 Microsoft
              支撑旗舰项目。多数类别的剩余风险仍高，因为项目处于施工前且披露有限；缓释成熟度也不均衡——强合同和强伙伴缓释， 同弱公开透明度和未验证运营并存。按剩余严重度排序，优先风险是执行 /
              施工、客户集中、涡轮供给、融资缺口、德克萨斯大负荷监管演变， 以及碳排 / 搁浅资产暴露。下文逐一审视，并给出可监控、会打破投资逻辑的触发因素。
