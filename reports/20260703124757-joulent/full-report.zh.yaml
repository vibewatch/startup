      - number: '6.4'
        title: 留存、耐久性与转换成本
        blocks:
          - type: paragraph
            body: >-
              耐久性是客户故事最强的一部分。20 年 PPA 在电力送出后提供极长合同寿命和收入可见度；这类协议常见的照付不议结构进一步锁定承诺。
              客户转换成本很高，因为电厂与园区同址且专门建设，交易对手很难把负荷转到别处；Microsoft 的投资级信用也降低违约风险。
              常规留存指标——净收入留存、总留存、流失和续约队列——全都为空，因为客户尚未上线；没有队列数据时， 合同期限就是主要耐久性信号。必须坦率指出，即使 20 年合同很强，也无法消除建设和交付阶段对关系的风险：
              延期或超预算建设可能在项目产生收入前就拉紧协议。耐久性因此在合同上优秀，但在运营上未经验证。
