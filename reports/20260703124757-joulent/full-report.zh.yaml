      - number: '8.4'
        title: 牛市、基准和熊市情形
        blocks:
          - type: paragraph
            body: >-
              结果异常二元，因为价值集中在单一超级项目。牛市情形下，Kilby 按时执行，Joulent 用更多园区复制共址模式，成为价值远高于 $5 billion 的多 GW
              电力平台。基准情形概率最高，因为需求已经签约：Kilby 建成，但有一定延误或成本超支，Joulent 仍是有价值但单资产的开发商，估值接近当前标记。熊市情形下，最终投资决策滑坡或 Microsoft
              需求转弱，成本超支咬住回报，股权价值跌破入场价。下行触发点包括 FID 滑坡、PPA 重谈、资本开支冲破 $9 billion，以及 AI
              资本开支收缩。概率信号偏向基准情形，但执行尾部风险实质存在，估值区间因此很宽——从熊市情形下股权受损，到成功扩张后达到当前标记数倍。比起任何单一点估计，这个跨度才是 Joulent 估值最诚实的总结。
