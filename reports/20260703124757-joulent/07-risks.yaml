callouts:
- calloutType: risk
  title: Execution and concentration dominate
  body: A $7-9B, first-of-scale gas megaproject on a 2028 timeline, underwritten by one customer and several load-bearing partners, defines Joulent's risk. The 20-year PPA and strong partners mitigate downside but cannot remove construction, supply-chain and concentration exposure.
  claimRefs:
  - CR001
  - CR004
  - CR040
- calloutType: risk
  title: Carbon is the poorly-mitigated tail risk
  body: 'Unlike execution risk, carbon and stranded-asset exposure has weak mitigation: if AI demand softens or climate policy tightens, a large gas plant could become an underused liability.'
  claimRefs:
  - CR036
  - CR039
  - CR035
- calloutType: assumption
  title: Clear, monitorable thesis-break triggers exist
  body: FID slipping past end-2026, any loss or renegotiation of the Microsoft PPA, or a capex blowout above $9B would each break the investment thesis and are trackable in diligence.
  claimRefs:
  - CR041
  - CR030
