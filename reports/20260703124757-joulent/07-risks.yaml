slug: joulent
runDate: '2026-07-03'
company:
  name: Joulent
chapter:
  number: 7
  title: Risks
  summary: 'Joulent''s risk profile is dominated by execution and concentration: a $7-9B, multi-year gas megaproject with first power not until 2028, a single anchor customer (Microsoft), heavy partner dependence (Chevron, GE Vernova, National Grid), an evolving Texas large-load regulatory regime (SB6, ERCOT), turbine-supply scarcity, and carbon/stranded-asset exposure. The 20-year PPA and strong partners mitigate but do not remove these risks.'
sections:
- id: overview
  title: Severity-ranked risk overview
  body: 'Joulent''s risk profile is dominated by two forces: execution and concentration. The single largest risk is delivering a $7-9 billion, gigawatt-scale gas plant on a compressed 2026-2028 schedule, with first power not expected until 2028—meaning years of pre-revenue construction exposure before any offsetting income. Capital intensity magnifies the downside, because cost overruns on a multi-billion-dollar build erode equity returns directly. Alongside execution, customer concentration is a top-tier risk: essentially one customer, Microsoft, underpins the flagship. Residual exposure remains high across most categories because the project is pre-construction and largely undisclosed, and mitigation maturity is uneven—strong contractual and partner mitigants coexist with weak public transparency and unproven operations. Ranked by residual severity, the priority risks are execution/construction, customer concentration, turbine supply, financing gap, evolving Texas large-load regulation,
    and carbon/stranded-asset exposure. Each is examined in turn, with monitorable triggers that would break the thesis.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  figureRefs:
  - FR001
- id: regulatory
  title: Regulatory and legal risk
  body: The Texas regulatory backdrop shifted with Senate Bill 6 (2025), which tightens rules for large electric loads interconnecting to the grid, and ERCOT's large-load process (Project 58481) imposes study fees, disclosure and security requirements on loads at and above roughly 75 MW. SB6 also gives ERCOT and utilities expanded authority to curtail or disconnect large loads under grid-stress conditions, and legal analysts flag heightened disclosure and demand-transparency obligations for data-center loads. Joulent's off-grid, behind-the-meter design reduces—but does not fully remove—exposure to these interconnection rules, since the campus islands its load. Separately, air-quality permitting for large gas turbines (NOx and CO2) is a required, time-consuming step; environmental litigation or permit challenges are a plausible legal risk for large fossil projects; and water-use permitting in arid West Texas adds a further dependency for combined-cycle cooling. Federal energy oversight can
    also bear on co-location and wholesale-power arrangements. The register is ordered by severity, but Kilby-specific filings are not yet public, so residual exposure is only partially sized.
  claimRefs:
  - CR007
  - CR008
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR042
  tableRefs:
  - TR001
- id: operational
  title: Operational and supply-chain risk
  body: Operational risk concentrates in turbine supply. GE Vernova's heavy-duty gas-turbine backlog is effectively sold out into the late 2020s, and strong global demand creates delivery-slot risk that could slip Kilby's timeline. Construction-phase risks include labor availability at a 6,000-plus-worker peak, EPC coordination and West Texas weather. Once built, operating an islanded 2.67 GW microgrid introduces reliability risk in self-supplying the frequency regulation, reserve and black-start services the grid would normally provide, and a single-site plant means an outage or equipment failure would directly threaten the anchor customer's power. Natural-gas supply disruptions or price spikes are an operational and margin risk despite Permian proximity. Compounding all of this, no public reliability, safety or quality-audit record yet exists for Kilby's specific design, so operational risk remains largely unquantified until commissioning. Rows in the operational register are ordered by
    severity, with turbine delivery, construction overrun and islanded reliability at the top.
  claimRefs:
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
  - CR021
  - CR022
  tableRefs:
  - TR002
  figureRefs:
  - FR002
- id: dependency
  title: Partner and dependency risk
  body: Joulent sits at the center of a web of high-concentration dependencies. Chevron dependence is high—it holds the Microsoft PPA and supplies fuel, so its commitment is load-bearing—and GE Vernova dependence is high for both turbines and grid-orchestration technology. National Grid Ventures is the key capital provider, so any change in its commitment would strain financing, while Microsoft is simultaneously the key customer and the demand rationale, compounding concentration. Regulators—ERCOT, the Texas PUC and environmental agencies—are external dependencies that can gate the project. The joint-venture structure means Joulent's economics depend on partner performance it does not fully control, and failure of any single critical partner in fuel, turbines, capital or offtake could stall the flagship. On the people side, execution hinges on a young organization delivering a first-of-scale megaproject, with key-person dependence on founder-CEO Chris James and a need for deep project-development
    and EPC-management bench strength. Rows are ordered by the severity of a partner or execution failure.
  claimRefs:
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  - CR028
  - CR029
  tableRefs:
  - TR003
  - TR004
  figureRefs:
  - FR003
- id: financial-carbon
  title: Financial, carbon and mitigation triggers
  body: 'Financially, the $1.75 billion equity raised is small versus a $7-9 billion build, implying substantial additional financing risk, and the long pre-revenue period means sustained cash outflow before any income. Margin-compression risk arises if gas prices rise or PPA pricing is fixed without adequate pass-through, and leverage against the 20-year PPA—though plausible—exposes the model to interest-rate and credit conditions. The near-total absence of public financials is itself a diligence risk that limits independent verification, and a downturn in AI data-center capex would undermine both demand and the valuation basis. The most poorly mitigated tail risk is carbon: critics warn that large new gas plants for data centers carry stranded-asset risk if AI demand or climate policy shifts, environmental groups highlight the climate tension, and hyperscaler climate commitments could pressure the customer to limit gas power over time. Key mitigants—the 20-year PPA, an investment-grade
    offtaker, strong partners and hydrogen-capable turbines—reduce but do not eliminate these risks. The clearest thesis-break triggers are FID slippage past end-2026, loss of the Microsoft contract, or a major cost blowout.'
  claimRefs:
