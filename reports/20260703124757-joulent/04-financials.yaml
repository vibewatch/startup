- id: traction-capital
  title: Public traction and capital adequacy
  body: As a privately held company, Joulent discloses no audited revenue, ARR or profit; its public traction signals are the signed Microsoft PPA and the $1.75 billion strategic investment, with Kilby's 2.67 GW of contracted capacity serving as the headline forward metric in lieu of revenue. On capital, National Grid Ventures agreed on July 1, 2026 to invest $1.75 billion for roughly a 35% stake—implying about a $5 billion valuation—describing the deal as balance-sheet funded and incremental to its record capital plan, having earmarked around $1 billion of near-term capital for Ventures. That equity, however, is small against a $7-9 billion Kilby build, which implies substantial additional project finance or partner capital, plausibly debt secured against the 20-year Microsoft PPA. The next major financing trigger is Kilby's targeted end-2026 final investment decision, and Chevron's fuel supply and balance-sheet depth materially reduce Joulent's standalone financing burden.
  claimRefs:
