- id: financial-verdict
  title: Financial verdict and diligence blockers
  body: 'The financial picture is a high-conviction option rather than a proven business. On the positive side, once operational, Kilby''s cash flows would be anchored by a 20-year agreement with an investment-grade counterparty, supporting high revenue quality and project-finance leverage. Against that, the capital intensity and long build cycle back-end returns and expose the model to cost overruns and delays, and skeptics warn that large new gas plants for data centers carry stranded-asset and return risks if AI demand or climate policy shifts. The single largest diligence blocker is the near-total absence of public financials—revenue, margins, burn, the full cap table and project-finance terms are all undisclosed—so the implied ~$5 billion valuation is a pre-revenue, derived mark resting on contracted pipeline rather than current cash flows. The verdict: promising structure, unproven economics, and disclosure gaps that must close before underwriting, with the end-2026 final investment
    decision the first hard checkpoint at which the investment thesis either de-risks materially or stalls outright.'
  claimRefs:
  - CI032
  - CI033
  - CI034
  - CI035
  - CI036
