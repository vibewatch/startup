company:
  name: Joulent
chapter:
  number: 6
  title: Customers
  summary: 'Joulent is pre-revenue with a single, dominant anchor customer: Microsoft, which has contracted roughly 2 GW of Project Kilby''s ~2.67 GW capacity through a 20-year Chevron-held power purchase agreement to feed its AI data-center compute. The customer picture is therefore one of extreme concentration and enormous contracted durability but no operating usage, no churn history, and no second named account yet.'
sections:
- id: segmentation
  title: Customer base and segmentation
  body: 'Joulent aims at two customer segments: hyperscale data-center operators and large industrial power users. In practice the base today is a single, decisive account—Microsoft—which is simultaneously the buyer, user and payer for the roughly 2 GW of Project Kilby capacity it has contracted to feed its AI compute. Geographically the footprint is concentrated in Texas at the Kilby campus in Reeves County, and the core use case is powering AI training and inference that cannot obtain timely grid capacity. Industrial users are named as a target segment, but no specific industrial customer has been disclosed, and no second hyperscaler has been announced. The result is a segmentation story that is aspirational beyond one account: the market opportunity spans multiple verticals, yet the concrete customer reality is one hyperscaler, mediated commercially through Chevron''s joint-venture PPA. This shapes every downstream question about adoption, retention and concentration.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption
  title: Adoption trajectory and demand
  body: 'Adoption is contractual rather than operational. Kilby is contracted but not yet delivering power, so there is no active usage, no repeat purchase and no utilization data; the headline metric is contracted capacity—about 2.67 GW in total, of which Microsoft has effectively reserved roughly 2 GW—rather than deployed or utilized megawatts. First power is targeted for 2028, meaning any deployment, account-growth or utilization figures simply do not exist yet, and operating capacity today is zero. What gives the reservation weight is the demand behind it: Microsoft''s broader AI buildout, including its large Fairwater-class campuses, creates the compute-power appetite that the Kilby contract is meant to satisfy. In diligence terms, the adoption trajectory must be read as a forward book underwritten by a single hyperscaler''s capital-expenditure plans, with all of the realization risk concentrated in the construction period between the end-2026 investment decision and 2028 commissioning.'
  claimRefs:
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: proof
  title: Named customer proof and reference quality
  body: The Microsoft relationship is the single named customer proof point, evidenced by a 20-year power purchase agreement held through Chevron's Energy Forge One entity rather than a pilot or letter of intent—a production-grade commercial commitment. Microsoft has publicly discussed securing dedicated power for AI infrastructure, corroborating the strategic intent, and the proof is fresh, tied to Joulent's June-July 2026 launch and investment announcements. Reference quality is high on contract certainty but necessarily low on operational outcomes, which cannot exist before first power in 2028. Beyond Microsoft, no second named customer proof point has been made public, and pricing, volume-ramp and service-level terms of the agreement remain undisclosed. The proof therefore establishes that a marquee hyperscaler has committed for two decades, which is a strong signal, while leaving open every question about realized performance, unit economics and whether the model can attract additional
    named accounts.
  claimRefs:
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
  - CU037
  - CU038
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: retention
  title: Retention, durability and switching costs
  body: 'Durability is the strongest part of the customer story. The 20-year PPA gives exceptional contractual longevity and revenue visibility once power flows, and take-or-pay-style structures common to such agreements further lock in commitment. Switching costs for the customer are very high because the plant is co-located and purpose-built for the campus, so the counterparty cannot easily shift load elsewhere, and Microsoft''s investment-grade credit reduces default risk. Conventional retention metrics—net revenue retention, gross retention, churn and renewal cohorts—are all null because the customer is not yet live; contract length is the primary durability signal in lieu of cohort data. The honest caveat is that even a strong 20-year contract does not eliminate construction- and delivery-phase risk to the relationship: a delayed or over-budget build could strain the agreement before it ever generates revenue. Durability is thus contractually excellent but operationally untested.'
  claimRefs:
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU036
  - CU039
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: concentration
  title: Expansion, concentration and skeptical views
  body: 'Customer concentration is extreme: essentially one customer underpins the entire flagship, making single-customer dependence the dominant commercial risk. The land-and-expand path is to replicate the co-located model with additional hyperscaler campuses funded by National Grid Ventures capital, but expansion depends heavily on partners—Chevron for fuel and PPAs, GE Vernova for turbines—and on long, high-friction procurement cycles for gigawatt-scale deals. Skeptics add two adverse lenses: they question whether hyperscalers'' reliance on new gas plants is durable given climate commitments, and they note that Microsoft has multiple alternative power-sourcing options—nuclear restarts, renewables and rival developers—which limits Joulent''s leverage. Community and environmental pushback around large gas-for-data-center projects could further pressure customer optics. A downturn in Microsoft''s AI capital expenditure or a strategy shift would directly threaten Kilby''s economics, so
    diversifying beyond Microsoft is the key milestone to de-risk the customer base, and as of mid-2026 that remains unmet.'
