callouts:
- calloutType: risk
  title: One customer, one project
  body: Joulent's customer base is effectively a single account—Microsoft—underpinning its single flagship. That delivers a strong 20-year contract but leaves the company acutely exposed to any shift in Microsoft's AI-capex plans or power-sourcing strategy.
  claimRefs:
  - CU025
  - CU026
  - CU030
- calloutType: strength
  title: A 20-year investment-grade anchor
  body: The Microsoft PPA is a production-grade, long-dated commitment from an investment-grade counterparty with very high switching costs—rare durability for a pre-revenue developer, if the plant is built on time.
  claimRefs:
  - CU013
  - CU019
  - CU024
- calloutType: assumption
  title: Proof is contractual, not operational
  body: All customer proof is forward-looking; with first power in 2028 there are no usage, retention or satisfaction outcomes yet, so diligence must weight execution risk heavily.
  claimRefs:
  - CU014
  - CU017
  - CU021
