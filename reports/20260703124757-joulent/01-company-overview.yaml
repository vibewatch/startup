- id: milestones-and-trajectory
  title: Milestones and trajectory
  body: 'Joulent''s short history traces to Engine No. 1''s 2020 founding and its 2021 ExxonMobil campaign, followed by a roughly three-year incubation of the power platform with GE Vernova beginning around 2023. Momentum accelerated sharply in 2026: a January announcement that Chevron, GE Vernova and Engine No. 1 would co-locate up to about 4 GW of gas plants for US data centers; the June 22 signing of the Chevron-Microsoft 20-year Kilby agreement alongside Joulent''s public launch; and the July 1 National Grid Ventures investment. Ahead lie the targeted end-2026 Final Investment Decision and 2028 first power. Independent observers, however, caution that large new gas plants built for data centers carry execution, emissions and stranded-asset risks, tempering the otherwise steep upward trajectory.'
