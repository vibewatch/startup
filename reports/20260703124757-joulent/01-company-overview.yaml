- id: leadership-and-governance
  title: Leadership and governance
  body: 'Joulent''s public face is founder and chief executive Chris James, who simultaneously leads Engine No. 1, the activist-investment firm he founded in 2020 and that famously won three ExxonMobil board seats in 2021. That dual role gives Joulent an experienced, credible energy-transition leader but also concentrates key-person risk, because no other named executives have been disclosed publicly. James frames leadership in the AI era as a race to deliver energy and compute the fastest, most reliably and at the lowest cost—the thesis underpinning Joulent''s strategy. Governance detail beyond the founder is thin: the senior operating team, board composition and the balance of control between Engine No. 1 and new investor National Grid Ventures are not yet public, leaving a material diligence gap around management depth.'
  claimRefs:
  - CO004
  - CO005
  - CO026
  - CO036
  - CO032
  tableRefs:
  - TO002
- id: funding-and-ownership
  title: Funding, valuation and ownership
  body: On July 1, 2026, National Grid Ventures—the commercial, non-regulated arm of UK utility National Grid plc—agreed to invest $1.75 billion in Joulent for an approximately 35% stake, a transaction Kirkland & Ellis advised on. That price implies a headline valuation of roughly $5 billion, vaulting the young company to unicorn scale, though the figure is derived from the deal rather than an audited mark. National Grid characterizes the investment as balance-sheet funded and incremental to its record capital program, having earmarked about $1 billion of near-term capital for Ventures projects. The capital is intended to fund Project Kilby and additional large-scale projects, giving National Grid direct exposure to fast-growing US 'large load' contracted-power demand while leaving Joulent's residual ownership and full cap table undisclosed.
  claimRefs:
