companyProfile:
  summary: "Joulent is a Houston-based, Engine No. 1-incubated energy-infrastructure company that builds large-scale, co-located power generation for AI data centers and industrial users. Its flagship, Project Kilby, is a 2.67-GW behind-the-meter gas campus in Reeves County, Texas, anchored by a 20-year Chevron-held power purchase agreement with Microsoft. In July 2026 the company raised a $1.75B strategic investment from National Grid Ventures for roughly a 35% stake, implying an approximate $5B valuation."
