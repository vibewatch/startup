- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Regulatory-economics mismatch
    - Flexible-load tariffs proliferate but compensation remains weak
    - Target markets require curtailment/collateral without clear customer value
    - Pause valuation upside tied to rapid commercialization
  - - Portability risk
    - Non-NVIDIA or non-utility-led proof remains absent
    - No credible portability evidence by next financing cycle
    - Treat ecosystem dependency as structural, not transitional
  - - Security / reliability risk
    - Public incident, SLA failure, or material outage tied to control layer
    - Any significant customer-visible event
    - Escalate to red diligence and require incident review
  - - Customer concentration risk
    - Too much expected ARR linked to one or two flagship sites
    - Top two sites or partners dominate expected revenue
    - Haircut commercial scale assumptions
  - - Execution risk
    - Implementation backlog rises faster than live recurring deployments
    - Services burden or support needs outgrow org capacity
    - Reduce margin expectations and extend time-to-scale
  - - Financial opacity risk
    - Burn, runway, and contract economics remain undisclosed after Series A
    - No disclosure or diligence access on core economics
    - Treat as thesis blocker for new money
  notes: Kill criteria are written to be measurable so they can change the investment decision, not just the tone of the memo.
