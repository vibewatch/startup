  title: Regulatory / legal risk register
  columns:
  - Rule / license / case
  - Jurisdiction
  - Status
  - Likelihood
  - Severity
  - Mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - FERC large-load tariff reform / show-cause orders
    - US RTO/ISO markets
    - Active 2026 reform cycle
    - High
    - High
    - Emerald aligns its product to flexible-load pathways rather than fighting them
    - Rules may still shift value, timing, and customer obligations materially
    - Track each relevant RTO filing and ask management which tariff pathways are revenue-critical
  - - PJM IRAS / BYONC / registry framework
    - PJM / state utility interfaces
    - Filed Aug. 2026; proposed for 2027+ loads
    - Medium-high
    - High
    - Sell into customers who can benefit from flexibility and capacity-backed interconnection
    - Customers may connect faster but accept first-curtailment exposure or higher compliance burden
    - Review customer exposure to BYONC, curtailment rights, telemetry, and compensation rules
  - - Large-load tariff protections such as collateral, minimum terms, exit fees, direct cost assignment
    - State utility tariffs / special contracts
    - Rapidly proliferating
    - High
    - High
    - Position Emerald as a tool to improve tariff economics and compliance
    - Protections may shrink or delay addressable demand
    - Map target utility tariff terms by market before underwriting pipeline
  - - Order 2222 / DER coordination immaturity
    - State + distribution utility layer
    - Implementation incomplete as of early 2026
    - Medium
    - Medium-high
    - Use simpler bilateral utility programs first
    - Coordination gaps can delay or complicate market participation designs
    - Ask which deployments depend on unresolved distribution/wholesale coordination
  - - Privacy, security, and public compliance evidence gap
    - Enterprise procurement / privacy law
    - Policies public; certifications not public
    - Medium
    - High
    - Legal/privacy policies exist and baseline safeguards are stated
    - Lack of public assurance artifacts can slow enterprise deals or raise diligence friction
    - Request trust-center materials, DPA templates, certifications, and incident-response process
  notes: This register ranks the combination of market-rule volatility and compliance-proof thinness as more material than any visible litigation risk.
