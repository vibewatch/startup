- id: operational-and-dependency-risk
  title: Operational, Security, and Dependency Risk
  body: >-
    Operationally, Emerald carries the risk profile of a control layer that touches both mission-critical compute and grid-facing response. Public proof is impressive for a company this young, but it is still concentrated in a handful of named demonstrations and flagship deployments. The company’s own terms emphasize that these proofs are illustrative and tied to specific conditions, which means investors should not over-extrapolate from Phoenix, the UK trial, or SVP into universal production readiness. If the control layer underperforms during a real grid event, Emerald would not merely miss a software KPI; it could impair customer workloads, damage utility trust, and weaken the commercial argument for flexible interconnection.


    Dependency risk is equally visible. The public deployment narrative is tied closely to NVIDIA’s stack, utility program design, and a small number of flagship counterparties. Those relationships are strategic strengths today, but they also mean Emerald has not yet shown broad portability across ecosystems, tariff frameworks, or customer types. Substitute risk remains real as well: some customers may decide that onsite generation, capacity procurement, or bespoke contracts are simpler than adopting an orchestration layer whose economics depend on shared value creation among multiple parties.
  claimRefs:
