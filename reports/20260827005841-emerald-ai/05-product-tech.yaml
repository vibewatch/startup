- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Grid signal ingestion
    - Receives event timing, power target, and curtailment conditions
    - Utility or grid-operator interfaces
    - No value if counterparties do not provide actionable signals
  - - Power-target shaping
    - Converts event definition into time-segmented power budgets
    - Emerald control logic
    - Poor target construction can over-constrain workloads
  - - Workload profiling
    - Tags jobs by flexibility, priority, and throughput tolerance
    - Access to workload telemetry and historical profiling
    - Bad profiling degrades QoS or reduces achievable flexibility
  - - Optimization policy engine
    - Selects control scenario across jobs and power knobs
    - Conductor logic, model assumptions, site policy
    - Optimization mistakes could miss targets or harm performance
  - - Actuation controls
    - Applies DVFS, pausing, checkpointing, GPU allocation, or routing
    - Compute stack permissions and NVIDIA-linked integration
    - Hardware/software dependence narrows portability
  - - Telemetry and verification
    - Measures achieved power and workload results against thresholds
    - Meters, cluster telemetry, observability pipeline
    - Insufficient auditability could weaken utility trust
  notes: This architecture abstracts public materials into functional components. Emerald has not published a complete internal technical design document.
  claimRefs:
