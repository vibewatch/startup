company:
  name: Emerald AI
chapter:
  number: 5
  title: Product & Technology
  summary: "Emerald AI\u2019s product is a real control-loop software stack centered on Emerald Conductor, with GridLink and NVIDIA-linked integrations connecting grid signals to AI workload management. Public evidence is strongest on live demonstration capability, optimization logic, and partner-backed deployment milestones; it is weaker on hardware portability, formal security/compliance disclosure, and long-duration production reliability. The technical story is credible, but the enterprise-grade assurance story remains early."
sections:
- id: product-definition
  title: Product Definition and Public Module Map
  body: "Emerald AI\u2019s public product story is unusually specific for a company at this stage. The company does not describe itself as generic energy software or general-purpose data center management. Instead it repeatedly frames the product as software that makes AI data centers power-flexible grid assets. In customer terms, the product is for operators and utilities who want more power access or grid responsiveness without degrading priority workloads. That is a much narrower workflow than classical DER management or utility demand-response tooling.\n\nThe public module map is still sparse but real. Emerald Conductor is the central platform name across partner, utility, and media sources. GridLink appears as a supporting product that links grid requirements to data center operations, especially in the Aurora architecture narrative. Beyond those names, most capabilities are described functionally rather than as separate SKUs. That is consistent with a company still commercializing\
    \ a control layer around one flagship operating product instead of marketing a mature multi-module software suite."
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE005
  - CE006
  tableRefs:
  - TE001
- id: architecture-workflow
  title: Architecture and Operating Workflow
  body: "The strongest architecture evidence comes from the GitHub demo materials, the Phoenix paper, the Latitude interview, and Emerald\u2019s NVIDIA-linked launch posts. Together they imply a workflow that starts with external power constraints and then descends into workload-level control. A utility or system event defines a target. Emerald profiles the active jobs, classifies their flexibility, evaluates intervention options, and applies a control policy that can include power caps, pausing, checkpointing, or geographic routing. Telemetry then checks whether the resulting power trajectory and performance thresholds remain acceptable.\n\nThat architecture is important because it shows Emerald is not merely forecasting or advising. The product sits in the operating loop. Public materials also make clear that the company\u2019s current architecture is deeply interwoven with NVIDIA systems, especially DSX Flex, NIM microservices, and Mission Control. The benefit is faster credibility and\
    \ tighter technical integration; the trade-off is clear partner dependence and reduced evidence that the product is hardware-agnostic today."
  claimRefs:
  - CE007
  - CE008
  - CE009
  - CE010
  - CE011
  - CE018
  - CE019
  - CE020
  - CE021
  tableRefs:
