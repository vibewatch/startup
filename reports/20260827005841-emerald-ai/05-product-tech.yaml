  - FE002
- id: deployment-maturity
  title: Deployment, Dependencies, and Maturity
  body: "Emerald\u2019s maturity claim rests on live proof more than on breadth of public customer deployment. Phoenix demonstrated sustained 25% power reduction for three hours on a 256-GPU cluster. The UK trial broadened the evidence base with more than 200 simulated grid events and faster response dynamics, while the Silicon Valley Power deployment is framed as the first commercial multi-megawatt DSX Flex implementation. The roadmap then points toward a 96 MW Aurora reference deployment and broader utility frameworks such as ERCOT\u2019s flexible-load pathways.\n\nThe dependencies are significant. Emerald depends on utilities or grid operators to send meaningful signals, on data center operators to permit operational control, and on NVIDIA-aligned infrastructure to support the current technical stack described publicly. Those dependencies do not negate the product, but they do mean Emerald should be underwritten as a multi-party deployment business rather than a simple self-serve software\
    \ tool. The product is technically differentiated, but commercialization remains coordination-heavy."
  claimRefs:
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
  - CE023
  - CE024
  - CE025
  - CE026
