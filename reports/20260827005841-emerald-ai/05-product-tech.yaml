- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / metric
  - Status
  - Scope
  - Gap
  rows:
  - - Privacy statement on AI training
    - Publicly states website-collected personal data is not used to train AI models
    - Website privacy handling
    - Says nothing directly about customer operational data use
  - - Security safeguards disclosure
    - Publicly states technical, administrative, and organizational safeguards exist
    - Website and personal information controls
    - No public certification, control mapping, or audit report
  - - Forward-looking statement disclaimer
    - Explicit in terms and conditions
    - All public website claims and projected deployments
    - Signals management caution, not operational assurance
  - - No-scrape / no model-training terms
    - Explicit in website terms
    - Website IP and data-mining restrictions
    - Legal notice, not evidence of product security posture
  - - Formal certifications (SOC 2 / ISO 27001 etc.)
    - Not visible in fetched public sources
    - Would matter for enterprise procurement
    - Requires security diligence pack or trust center
  - - Reliability / performance assurance reporting
    - Partner case studies and demos only
    - Selected pilots and tests
    - No broad production uptime or incident statistics public
  notes: This table distinguishes website legal/privacy controls from product-assurance controls. The former exist; the latter remain thin in the public record.
