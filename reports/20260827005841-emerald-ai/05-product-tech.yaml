  - TE004
  - TE005
  figureRefs:
  - FE003
  - FE004
- id: differentiation-trust
  title: Differentiation, Trust, and Public Control Gaps
  body: "The best public evidence for differentiation is that Emerald repeatedly proves the same narrow thing: AI workloads can respond to grid needs while preserving priority service quality. That is more specific than the value claims made by broad utility-flexibility vendors, forecasting providers, or generic data center software. The strongest moat candidate is therefore not brand alone, but the combination of live performance data, utility integration playbooks, and NVIDIA-linked operating knowledge.\n\nAt the same time, the public control surface is thin. The legal pages are unusually explicit that website content includes forward-looking statements, is not professional advice, and may not predict future outcomes. The privacy policy is useful\u2014it says website-collected personal information is not used to train AI models and that safeguards are maintained\u2014but the fetched public record does not expose formal security certifications, model-governance audits, or reliability certifications.\
    \ For diligence, Emerald\u2019s product looks more technically grounded than a pure concept, yet still early in enterprise-grade trust and assurance disclosure."
  claimRefs:
  - CE022
  - CE027
  - CE028
  - CE029
  - CE030
  - CE031
  - CE033
  - CE036
  - CE043
