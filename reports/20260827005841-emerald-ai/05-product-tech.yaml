figures:
- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: "Emerald\u2019s public stack runs from grid signals down through workload control and back up through telemetry."
  data:
    layers:
    - label: "Layer 1 \u2014 External grid context"
      detail: Utility or grid-operator signals define event timing, power targets, and interconnection or reliability needs.
    - label: "Layer 2 \u2014 Target shaping"
      detail: Conductor converts grid events into power schedules and control objectives over time.
    - label: "Layer 3 \u2014 Workload intelligence"
      detail: Jobs are profiled by flexibility, priority, throughput tolerance, and resource requirements.
    - label: "Layer 4 \u2014 Optimization policy"
      detail: Policies choose among DVFS, job pausing, checkpointing, or workload redistribution to meet targets.
    - label: "Layer 5 \u2014 Actuation interface"
      detail: Controls reach the cluster through NVIDIA-linked infrastructure, operating-stack integrations, and site permissions.
    - label: "Layer 6 \u2014 Telemetry and verification"
      detail: Power and performance are checked against requested targets and service thresholds for utilities and operators.
  approximationNotes: The stack is synthesized from GitHub pseudocode, research papers, and partner announcements rather than from an official Emerald architecture diagram.
  claimRefs:
  - CE018
  - CE019
  - CE020
  - CE021
  - CE011
