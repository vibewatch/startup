- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Respond to utility grid event
    - Manual or coarse load shedding, backup generation, or no response
    - Conductor profiles workloads and applies fine-grained controls
    - 25% for 3 hours in Phoenix; up to 40% in UK trial
    - Proof base still limited to a handful of public deployments
  - - Unlock faster interconnection
    - Wait for firm power or add costly onsite generation
    - Flexible-load operating layer tied to utility frameworks
    - Potentially faster access to existing grid headroom
    - Depends on utilities offering real flexible-load pathways
  - - Protect priority AI jobs during curtailment
    - Overprovision or avoid flex altogether
    - Priority-aware scheduling, pausing, DVFS, and recovery logic
    - Public sources say critical workloads continued during tests
    - No public SLA or long-duration reliability dataset
  - - Operate commercial AI campus with utility signals
    - Bespoke human coordination among operator, utility, and vendors
    - Integrated workflow with DSX Flex and dispatch interface
    - Moves from demo to commercial multi-MW pilot at SVP
    - Current story remains NVIDIA-centered
  - - Support geographically aware flexibility
    - Shift load manually or not at all
    - ArXiv and WEF materials describe routing or shifting workloads across sites
    - Can align compute with lower stress or cleaner grids
    - Public proof of multi-site production operations remains limited
  notes: Benefits are drawn from demonstrations and partner statements; they are not yet equivalent to a broad production benchmark set.
