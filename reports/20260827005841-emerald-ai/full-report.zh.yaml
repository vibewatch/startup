      - number: '4.4'
        title: 财务判断与承销缺口
        blocks:
          - type: paragraph
            body: >-
              公开记录足以支撑可信的财务叙事，但不足以完成干净承销。Emerald
              显然有一个可以变现的问题要解决：电力约束正在恶化，数据中心开发商非常在意拿电速度，公司现在也有可信的商业化证据。上述条件让有意义的企业合同存在变得可信。但确认收入质量所需的财务证据仍然缺失。没有披露年经常性收入（ARR），没有合同价值分布，没有续约证据，没有利润率堆栈，也没有从烧钱速度到现金跑道的桥。


              因此，正确判断不是 Emerald 缺少商业模式，而是公开证据只证明了商业模式的形状，还没有证明其经济性。投资人应把 Emerald
              视为财务上有前景、但证据仍偏薄的公司。最有价值的尽调请求，是那些能最快压缩不确定性的问题：客户合同价值、实施负担、部署后的毛利率画像、销售效率、按 logo
              和站点划分的集中度，以及与商业里程碑绑定的具体现金跑道计划。相邻的上市电力和数据中心平台也提醒了披露缺口：它们公开报告数十亿美元级收入基础，而 Emerald
              仍未披露任何可比规模指标。在这些披露出现之前，公司的财务质量方向上有吸引力，但尚未被充分承销。
