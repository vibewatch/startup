              公开记录在客户持久性上明显变薄。Emerald 有可信的重复生态参与证据——NVIDIA、电力公用事业公司和电力市场参与者在多个证据点反复出现——但没有发布经典 SaaS
              持久性指标，例如净留存率（NRR）、总留存率（GRR）、流失率、logo 留存或合同期限。已抓取证据也没有提供终端客户证言，明确讨论续约、长期实际 ROI 或试点后大规模生产推出。


              最乐观的解读是，Emerald 正沿着从一次性证明到嵌入式商业角色的路径前进，尤其是在 SVP
