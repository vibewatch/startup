        - label: NVIDIA / 生态依赖
          values:
            - 中高
            - 高
            - 中
            - 高
        - label: 客户集中度
          values:
            - 高
            - 高
            - 中低
            - 高
        - label: 网络安全 / 遥测故障
          values:
            - 中低
            - 极高
            - 中低
            - 高
        - label: 规模化执行
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 财务不透明
          values:
            - 高
            - 高
            - 低
            - 高
    approximationNotes: 序数单元格概括有证据支撑的风险排序，而不是公司提供的评分模型。
    claimRefs:
      - CR035
      - CR036
      - CR038
      - CR037
      - CR028
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 多数头部风险先传导到客户经济性，再传导到采用、收入质量和估值。
    data:
      nodes:
        - id: rules
          label: 电价 / 市场规则变化
          detail: RTO、公用事业公司和州规则决定灵活性会得到奖励，还是只受到约束。
        - id: customer
          label: 客户经济性
          detail: 并网速度、限电权利和补偿机制决定购买意愿。
        - id: deploy
          label: 部署转化
          detail: 项目进入试点，试点变成重复运营，或者就此卡住。
        - id: revenue
          label: 收入质量
          detail: 转化决定 ACV、复现性和集中度。
        - id: valuation
          label: 估值支撑
          detail: 转化差或集中度高，会削弱支撑入场价格的能力。
        - id: incident
          label: 安全 / 可靠性事件
          detail: 控制层事件可能直接冲击客户信任，并伤到估值。
      edges:
        - from: rules
          to: customer
          label: 改变价值分配
        - from: customer
          to: deploy
          label: 拉动采用
        - from: deploy
          to: revenue
          label: 形成或削弱复现
        - from: revenue
          to: valuation
          label: 支撑价格
        - from: incident
          to: customer
          label: 损害信任
        - from: incident
          to: valuation
          label: 压缩
    claimRefs:
      - CR002
      - CR029
      - CR022
      - CR028
      - CR037
  - id: FR003
    title: 依赖图谱
    type: dag
    layout: wide
    summary: Emerald 的商业化路径依赖一条关系链：计算栈、公用事业公司、业主、监管方和客户。
    data:
      nodes:
        - id: emerald
          label: Emerald 控制层
          detail: 核心编排软件和运行策略层。
        - id: nvidia
          label: NVIDIA 生态
          detail: 当前公开验证和参考设计栈与 NVIDIA 绑定很深。
        - id: utility
          label: 公用事业公司 / 电网运营商
          detail: 创造调度权、项目经济性和真实电网用例。
        - id: customer
          label: 运营商 / 业主 / AI 公司
          detail: 掌握工作负载、场地和预算决策。
        - id: rules
          label: 电价 / 市场规则
          detail: 界定限电权利、补偿、担保品和容量义务。
        - id: capital
          label: 战略资本
          detail: 为扩张供血，也常兼作渠道或设计伙伴入口。
      edges:
        - from: nvidia
          to: emerald
          label: 技术栈集成
        - from: utility
          to: emerald
          label: 调度价值
        - from: customer
          to: emerald
          label: 站点采用
        - from: rules
          to: utility
          label: 约束 / 赋能
        - from: capital
          to: emerald
          label: 融资 / 渠道
        - from: rules
          to: customer
          label: 成本 / 限电敞口
    claimRefs:
      - CR019
      - CR020
      - CR023
      - CR021
      - CR045
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: Emerald 在公司质量上得分不错，但公开经济性还不足以支撑买入建议。
    data:
      nodes:
        - id: market
          label: 巨大的市场痛点
          description: AI 电力约束让快速接电和灵活性变成真实需求。
        - id: proof
          label: 扎实的早期验证
          description: 具名演示和商业试点让产品可信度高于多数早期创业公司。
        - id: economics
          label: 经济性仍不透明
          description: 没有公开收入、利润率或现金跑道数据能支撑当前价格。
        - id: price
          label: 当前轮估值已偏高
          description: $1.05B 估值已经假设未来会做出可观规模。
        - id: call
          label: 建议：观察
          description: 继续跟踪，但别用高价替尚未消化的不确定性买单。
      edges:
        - from: market
          to: proof
          label: 支撑
        - from: proof
          to: economics
          label: 仍需补足
        - from: economics
          to: price
          label: 削弱支撑
        - from: price
          to: call
          label: 决定立场
    claimRefs:
      - CV004
      - CV006
      - CV008
      - CV013
      - CV010
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 只有 Emerald 做到远高于当前公开证据的收入规模，当前轮估值才更容易站住脚。
    data:
      items:
        - label: 收入 60M @ 8x
          value: 480
          unit: USD millions
        - label: 收入 80M @ 8x
          value: 640
          unit: USD millions
        - label: 收入 100M @ 8x
          value: 800
          unit: USD millions
        - label: 收入 100M @ 10x
          value: 1000
          unit: USD millions
        - label: 收入 120M @ 10x
          value: 1200
          unit: USD millions
        - label: 收入 120M @ 12x
          value: 1440
          unit: USD millions
    approximationNotes: 柱状图展示的是基于公开可比公司倍数的启发式估值结果，不是管理层指引。
    claimRefs:
      - CV014
      - CV023
      - CV013
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据支撑一个很宽的区间，概率加权中心仍低于当前轮。
    data:
      items:
        - label: 乐观情景
          low: 1600
          high: 2880
          unit: USD millions
          note: 需要可重复、可迁移，且收入规模足够大
        - label: 基准情景
          low: 420
          high: 880
          unit: USD millions
          note: 商业化继续推进，但速度更慢
        - label: 悲观情景
          low: 60
          high: 225
          unit: USD millions
          note: 价值捕获仍弱，集中度仍高
        - label: 当前轮估值
          low: 1050
          high: 1050
          unit: USD millions
          note: Aug. 2026 公布的 Series A 估值
    approximationNotes: 情景区间是基于证据的启发式判断，用于组织 IC 讨论；不是 DCF，也不是正式公平性意见。
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV031
      - CV001
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 市场和验证得分较好；经济性和估值支撑落后。
    data:
      items:
        - label: 市场顺风
          value: high
          detail: AI 电力瓶颈真实存在，而且还在加剧
        - label: 验证质量
          value: medium-high
          detail: 已有具名部署和可测结果
        - label: 护城河持续性
          value: medium
          detail: 已有协调经验，可迁移性证明不足
        - label: 经济性可见度
          value: low-medium
          detail: 缺少公开收入或利润率支撑
        - label: 风险负担
          value: high
          detail: 监管经济性和集中度很关键
        - label: 估值支撑
          value: low-medium
          detail: 当前轮需要大量前瞻证明
    claimRefs:
      - CV043
      - CV044
      - CV045
      - CV046
      - CV012
      - CV047
