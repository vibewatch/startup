  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现逻辑
        blocks:
          - type: paragraph
            body: >-
              Emerald AI 的公开财务叙事，先从它不是什么说起。它不融资建设大型电厂，不拥有数据中心，也不销售大宗电力。公司把自己呈现为控制层，让 AI
              数据中心变成用电可调的电网资产。核心变现逻辑因此几乎肯定由软件主导：Conductor
              平台、针对具体部署的配置，以及让电力公用事业公司和运营商把电网状态转化为可接受算力响应的运营工作流。收入切入口来自经济价值，不是界面好看。如果 Emerald
              帮客户更快接入、避开并网延迟，或从灵活性中捕获可靠性价值，即便还没有形成广泛机群规模，软件也能支撑有意义的合同价值。


              挑战在于，公开来源尚未发布任何标价、平均合同价值、使用量定价或节省分成公式。因此，阅读 Emerald
              当前收入模式的正确方式，是把它视为一个谈判型企业基础设施产品；其价值取决于当地电网瓶颈、客户工作负载关键性，以及哪一方捕获经济上行。方向上有吸引力，因为严重电力约束能支撑定价权；但也难以承销，因为投资人还无法把具名部署映射成披露过的收入密度。
