        title: 扩张循环与集中度风险
        blocks:
          - type: paragraph
            body: >-
              扩张逻辑很直观：如果一个站点的用电可调部署跑通，就可以复制到新园区、公用事业辖区或多站点机群。可见路径是从 Phoenix 式可测量证明，推进到 SVP 等公用事业标准化项目，再到 Aurora 这样更大的 AI
              工厂园区。战略投资人和伙伴生态可能放大这一动作，因为同一批参与者可以在资本、技术集成和客户介绍上帮忙。


              但集中度风险同样清晰。大量公开证据依赖一个狭窄的具名伙伴圈：NVIDIA、National Grid 和 SVP 等电力公用事业公司、Digital
              Realty，以及少数演示站点。采购摩擦也很高，因为交易往往要求监管机构、电力公用事业公司、基础设施提供商和运营商对齐。Heatmap
              的反向观点仍然重要：如果公用事业公司不能创造有意义的并网或经济价值，即便客户有兴趣，也可能无法规模化转化。因此，客户章节更多讨论协同成功下的扩张潜力，而不是已经证明的账户持久性。
