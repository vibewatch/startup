              公开记录最强的地方是具名证据项，而不是客户数量。Phoenix 围绕 Oracle、NVIDIA、Databricks 和 Salt River Project 建立了第一个持久运营叙事：一个 256-GPU
              集群在 3 小时内降低 25% 功率。英国试验加入第二个地理区域和更强的快速响应证据，披露超过 200 次模拟电网事件，以及不到 1 分钟内超过三分之一的降幅。Silicon Valley Power
