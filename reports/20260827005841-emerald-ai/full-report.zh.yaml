        title: 部署、依赖与成熟度
        blocks:
          - type: paragraph
            body: >-
              Emerald 的成熟度主张更多依靠现场证据，而不是公开客户部署的广度。Phoenix 在 256-GPU 集群上演示了持续 3 小时 25% 功率降低。英国试验用超过 200
              次模拟电网事件和更快响应动态扩展了证据基础，而 Silicon Valley Power 部署被描述为首个商业化、多兆瓦 DSX Flex 实施。路线图随后指向 96 MW Aurora 参考部署，以及
              ERCOT 灵活负荷路径等更广泛的公用事业框架。


              依赖关系很重。Emerald 依赖电力公用事业公司或电网运营商发送有意义的信号，依赖数据中心运营商允许运营控制，也依赖 NVIDIA 阵营基础设施来支撑公开描述的当前技术栈。上述依赖并不否定产品，但确实意味着
              Emerald 应被视为多方部署业务，而不是简单的自助式软件工具。产品在技术上有差异化，但商业化仍高度依赖协同。
