      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Emerald AI
              的早期市场是多边市场。直接运营用户通常是数据中心的能源、运营或基础设施团队，他们必须守住可用性，同时暴露一部分可调度灵活性。直接商业买方往往也是同一批团队，尤其在超大规模云厂商、新云厂商或大型托管开发商那里，拿电速度已变成生死问题。但当灵活性被嵌入电价、试点或并网协议时，经济赞助方也可能是电力公用事业公司、公共电力供应商或系统运营商。


              换言之，Emerald 卖的不是普通业务线 SaaS 工具。它卖的是一个位于公用事业规划、并网、数据中心运营和 AI
              工作负载调度交叉点的工作流。采用触发因素包括电网接入延迟、惩罚性成本分摊、非确定性服务机会，以及愿意配合的电力公用事业合作方。下面的分层图对估值很重要，因为买方预算负责人更接近能源战略和基础设施规划，而不是普通
              IT 采购；采购周期会被拉长，但路径一旦跑通，战略价值也会提高。
