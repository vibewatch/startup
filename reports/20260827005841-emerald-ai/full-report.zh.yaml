        title: 定价、包装与切换动态
        blocks:
          - type: paragraph
            body: >-
              这一竞争版图的公开定价透明度很差。Voltus 在需求响应侧异常透明，因为它发布了示意性的 MW-year
              收益机会，但即便如此，那也不是软件标价。大多数其他供应商只描述结果、合作关系或解决方案族，并不披露合同基准、最低承诺、实施费或实际经济性。因此，本章的定价比较其实是包装方式比较：一些厂商像收入分成型聚合商，一些像公用事业
              SaaS 或项目管理栈，另一些则把灵活性打包进更广泛的能源或基础设施解决方案。


              切换动态同样不是二元。一旦数据中心、公用事业公司和遥测栈完成集成，流程、风险管理和利益相关方信任都会形成真实切换成本。但多栖部署也可行，因为 Emerald 可以与预测工具、公用事业 DR
              软件或现场电力系统并行。因此，分发杠杆——尤其是既有公用事业和能源买方关系——与产品精巧度同样重要。Emerald 的风险在于，既有厂商可以先接触买方，再逐步缩小感知差距。
