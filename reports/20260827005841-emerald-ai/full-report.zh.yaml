chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与产品逻辑
        blocks:
          - type: paragraph
            body: >-
              Emerald AI 是一家总部位于华盛顿特区的气候与能源软件公司，成立于 2024 年末，瞄准 AI 基础设施里越来越具体的瓶颈：电力。公司不假设每个 AI 数据中心都必须像僵硬的 24/7
              峰值负荷那样运行，而是主张现代 GPU 工作负载可以被编排，在不违反最关键服务级别要求的前提下，短暂降速、暂停或转移。Emerald 将这一逻辑封装进 Emerald
              Conductor：一个位于电力公用事业公司或电网运营商与数据中心运营团队之间的控制层。


              公司材料始终把产品界定为软件，而不是发电设备。Conductor 摄取电网信号、工作负载优先级和本地能源状态，再调节设施用电需求或现场资源，让数据中心从被动负担变成可控资产。这一定位很关键，因为 Emerald
              同时对超大规模云厂商、托管运营商和电力公用事业公司有意义。产品价值主张也因此直接绑定拿电时间：如果 Conductor
              能让运营商更早接入、拿到更大的并网额度，或避开昂贵的电网升级，即便直接能源市场收入尚未验证，产品也能贴近关键任务预算。
