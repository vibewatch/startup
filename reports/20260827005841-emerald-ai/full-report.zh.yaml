              为活跃任务画像，分类其灵活性，评估干预选项，并下发控制策略；策略可以包括功率上限、暂停、检查点或地理路由。随后，遥测检查结果中的电力轨迹和性能阈值是否仍可接受。


              该架构很重要，因为它显示 Emerald 不只是预测或建议。产品坐进了运营闭环。公开材料也清楚表明，公司当前架构与 NVIDIA 系统深度交织，尤其是 DSX Flex、NIM 微服务和 Mission
              Control。好处是可信度提升更快、技术集成更紧；代价是明确的伙伴依赖，以及今天硬件无关部署的公开证据更少。
