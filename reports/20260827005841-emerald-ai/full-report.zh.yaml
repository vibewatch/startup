      - number: '2.2'
        title: 规模测算视角与受边界约束的机会
        blocks:
          - type: paragraph
            body: >-
              公开来源有力证明宏观问题巨大且正在加速，但不能直接推出干净的软件总可用市场（TAM）。IEA 预计美国电力需求到 2030 年将年增近 2%，其中约一半增量来自数据中心；Berkeley Lab
              则认为美国数据中心用电需求到 2028 年可能达到 325-580 TWh。JLL 又补上一条供给侧视角：2026 至 2030 年全球新增容量接近 97 GW，并由 14% 行业 CAGR
              支撑。Bloom、CBRE 和 JLL 都把电力获取，而不是低价租金或连接性，描述为真正卡点。


              因此，用 GW 测算比用软件金额测算更站得住。公开证据中置信度最高的空间逻辑来自 Duke/CFR 的表述：如果设施接受有限削减，约 100 GW
              的美国数据中心需求可以更早接入。实际可服务市场（SAM）更小，因为商业化取决于电价机制、公用事业公司意愿，以及关键工作负载能扛住灵活性事件的证据。本章因此保留三条口径：宏观电力需求、数据中心供给增长，以及受约束的
              25/50/100 GW 灵活并网区间，而不是假装公开证据已经披露 Emerald AI 实际可定价的软件收入池。
