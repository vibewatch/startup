      - number: '7.2'
        title: 运营、安全与依赖风险
        blocks:
          - type: paragraph
            body: >-
              运营层面，Emerald 的风险画像像一层控制层：它同时触及关键任务计算和面向电网的响应。以公司年龄看，公开验证 已经很亮眼，但仍集中在少数点名演示和标杆部署上。Emerald
              自己的条款也强调，这些验证只是示例， 且绑定特定条件；因此，投资者不能把 Phoenix、英国试验或 SVP 的结果外推成普遍生产就绪。真实电网事件中， 一旦控制层表现不佳，Emerald 失去的不只是软件
              KPI；客户工作负载可能受损，电力公司信任会受伤，灵活并网的 商业论证也会被削弱。


              依赖风险同样明显。公开部署叙事与 NVIDIA 技术栈、电力公司项目设计，以及少数标杆对手方绑得很紧。今天， 这些关系是战略强项；反过来，也说明 Emerald
              还没有证明自己能广泛迁移到不同生态、费率框架或客户类型。 替代风险也真实存在：部分客户可能认为，现场发电、容量采购或定制合同，比采用一层编排系统更简单；后者的 经济性取决于多方共同创造价值。
