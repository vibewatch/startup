  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与买方地图
        blocks:
          - type: paragraph
            body: >-
              Emerald AI
              的客户地图是多边的，因为只有电力系统参与者和算力参与者对齐时，产品才创造价值。电力公用事业公司和公共电力供应商可以是直接客户，因为它们可能部署软件、调度灵活负荷，并用它支持并网或可靠性目标。数据中心运营商、AI
              工厂开发商、新云厂商和超大规模云厂商相邻运营商也是直接经济受益方，因为更快拿电或减少电网约束会实质性改善部署时点。PJM 和 EPRI
              等电网机构更像生态促成方，而非直接经常性客户；战略投资人则可能充当渠道加速器和未来设计伙伴。


              因此，不能用普通单一买方企业 SaaS 品类来建模 Emerald
              的客户基础。同一账户中，用户、买方和付款方可能不同。市政电力公用事业公司可能赞助灵活负荷框架，运营商可能集成软件，云厂商或数据中心租户可能拿到运营收益。这种复杂性增加摩擦，但也意味着成功部署可以创造多个希望关系随时间加深的利益相关方。
