  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Emerald 的产品正处在监管转型的正中央。需求因此受益，可预测性却受损。FERC 正迫使电网运营商说明或改革大负荷规则，PJM
              也在明确考虑框架，要求新增大负荷带来容量或接受更早削减；全美电力公用事业公司则争相设计特殊电价，以保护现有缴费用户免受数据中心风险影响。上述进展验证了 Emerald
              关于灵活性重要性的判断。监管变化也让商业化面对移动靶，因为奖励灵活性的同一套政策制度，也可能把抵押义务、削减权、最低期限或直接分摊成本转移给客户。


              Emerald 自身法律披露进一步强化了谨慎必要性。网站条款称，试点和演示具有示意性且依赖具体条件，前瞻性陈述天然不确定，公司也不承诺更新公开声明。隐私政策体现了基础法律 /
              隐私卫生，但不能替代公开信任中心、认证或企业保障材料。与此同时，2026 年中 FERC 到 NERC
              围绕强制性计算负荷标准的转向显示，这一段监管边界正在快速硬化。因此，法律风险与其说来自可见诉讼，不如说来自对演进中电价制度的依赖，以及有限的公开合规证明。
