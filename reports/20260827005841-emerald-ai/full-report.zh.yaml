      - number: '2.4'
        title: 增长驱动、约束与矛盾
        blocks:
          - type: paragraph
            body: >-
              三股力量让这个市场在 2026 年踩中时点。第一，电力稀缺已经成为 AI 基础设施增长的一阶约束；JLL、CBRE、Bloom 和 IEA
              在这一点上高度一致。第二，监管机构和电力公用事业公司正通过大负荷电价、灵活服务类别和明确考虑灵活需求的说明理由程序，主动搭建商业路径。第三，来自 Phoenix、英国以及更广泛 DCFlex
              生态的现场证据表明，至少一部分 AI 工作负载可以大幅灵活调节，同时不关闭关键服务义务。


              矛盾同样重要。Heatmap
              捕捉到反向商业逻辑：只有电力公用事业公司把灵活性转化为更快并网或有意义的经济收益时，灵活性才有价值。运营商仍然保守，因为数据中心过去承诺近乎完美的可用性，而公开变现证据仍未揭示经常性合同结构或实际定价。结果是，一个市场战略重要性显而易见、技术可行性也可信，但软件收入捕获仍受当地监管、公用事业激励和少数旗舰证据调节，而不是由成熟品类预算直接支撑。
