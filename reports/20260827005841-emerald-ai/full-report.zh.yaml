  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Emerald AI 并不争夺所有 AI
              基础设施相关支出。相关市场是一个狭窄的控制层：它帮助电力受限的数据中心更快拿到并网接入，参与公用事业或电网灵活性项目，并验证被削减或转移的工作负载仍满足服务约束。市场边界很重要，因为 AI
              基础设施的大部分资金落在土地、建筑壳体、变电站、发电、网络和 GPU 上；只有当 Emerald 的软件让容量更早可用，或帮助避免额外电力系统成本时，公司才间接触达这些预算。


              因此，纳入边界的支出包括编排软件、遥测、合规或验证工具、与公用事业公司或系统运营商的集成工作，以及与可用性、削减或调度挂钩的经常性软件费或绩效费。排除在外的支出包括通用托管租金、电力硬件、商用发电资产，以及一次性建设资本开支，除非
              Emerald 能通过灵活性工作流捕获经济收益。现状替代路径仍是等待确定性并网、建设现场电力、使用没有专业软件的定制双边安排，或把部署转移到电力条件更好的地区。
