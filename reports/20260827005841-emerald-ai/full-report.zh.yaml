  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与公开模块地图
        blocks:
          - type: paragraph
            body: >-
              以当前阶段的公司而言，Emerald AI 的公开产品叙事异常具体。公司没有把自己描述成通用能源软件或通用数据中心管理工具，而是反复将产品定位为让 AI
              数据中心成为用电可调电网资产的软件。换成客户语言，产品服务于希望获得更多电力接入或电网响应能力、同时不降低优先工作负载质量的运营商和电力公用事业公司。这条工作流比经典 DER 管理或公用事业需求响应工具窄得多。


              公开模块地图仍稀疏，但真实存在。Emerald Conductor 是合作伙伴、公用事业和媒体来源中共同出现的核心平台名称。GridLink 则作为支持产品出现，尤其在 Aurora
              架构叙事中，用于把电网要求连接到数据中心运营。除这些名称外，大多数能力按功能描述，而不是作为单独 SKU
              呈现。这种呈现符合一家仍围绕单一旗舰运营产品商业化控制层的公司，而不是一家已经营销成熟多模块软件套件的公司。
