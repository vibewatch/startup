        - 缺少这些，估值仍过度依赖假设
    notes: 这张表刻意保持价格敏感，而不是给公司质量打泛化分数。
    claimRefs:
      - CV010
      - CV011
      - CV012
      - CV013
      - CV036
      - CV034
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 支撑
      - 什么会改变判断
    rows:
      - - 电力瓶颈真实存在，且在恶化
        - Berkeley Lab、CFR 和 PJM 相关来源都指向同一件事：电力正在卡住 AI 扩张
        - 如果电力稀缺比预期更快缓解，紧迫性和定价权都会下降
      - - Emerald 的早期证明强于常规水平
        - 有具名电力公司和旗舰部署证据
        - 需要证明试点会转成经常性付费项目
      - - 快速接电可以支撑软件溢价
        - 避免延误可能比普通软件 ROI 更重要
        - 需要披露合同来确认价值捕获
      - - 灵活负载经济性可能持续偏薄
        - 电力公司和客户可能分不到足够价值
        - 如果披露与电价挂钩的客户经济性，判断会改善
      - - 当前估值跑在公开经济性前面
        - 没有公开收入、利润率或现金跑道支撑
        - 如果披露真实财务数据，或入场价格降低，判断会改善
      - - 生态集中度尚未解决
        - 与 NVIDIA 和电力公司相关的集中度仍然可见
        - 如果可移植性更广、独立需求更强，判断会改善
    notes: 这些论点的写法，是为了说明哪些证据真的会推动建议变化。
    claimRefs:
      - CV004
      - CV006
      - CV005
      - CV007
      - CV008
      - CV009
      - CV034
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 重复付费部署、可移植性扩大、电价经济性强，2028 年收入 ~160-240M
        - 10-12x 销售额 => ~1.6-2.9B；支撑相对本轮的上行
        - 仍取决于集中度和执行
        - 有可能，但需要多件事同时跑顺
      - - 基准
        - 商业化继续推进，但收入扩张更慢，2028 年收入 ~70-110M
        - 6-8x 销售额 => ~420-880M；本轮估值显得充分到偏贵
        - 价值捕获和披露仍不完整
        - 公开证据下最合理
      - - 悲观
        - 价值捕获弱、集中度高，2028 年收入 ~20-45M
        - 3-5x 销售额 => ~60-225M；相对本轮有较大下行
        - 电价经济性或可移植性失败
        - 如果早期证明不能持续叠加，这一情景就成立
      - - 入场纪律叠加层
        - 本轮需要接近基准上沿或乐观情景的结果
        - 没有更好披露，上行更像期权，难以真正承销
        - 优先股堆叠可能进一步压低回报
        - 当前价格要求更多证据
      - - 加权观点
        - 如果没有重大去风险事件，公开证据指向的价值低于本轮
        - 概率加权价值低于 1.05B
        - 披露和集中度是主要摇摆因素
        - 支撑观察，而不是买入
    notes: 情景区间是基于公开证据的启发式范围，不是管理层预测。
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Equinix
        - 2025 年收入 ~9.22B；市值 ~106.5B
        - ~10.8x P/S（市销率）
        - 高溢价数字基础设施 / 数据中心平台
        - 成熟度和多元化高得多
      - - Digital Realty
        - 2025 年收入 ~6.11B；市值 ~73.1B
        - ~10.8x P/S（市销率）
        - 数据中心业主 / 互联与电力接入可比公司
        - REIT 经济模型不同于软件控制层
      - - Vertiv
        - 2025 年收入 ~10.23B；市值 ~101.6B
        - ~8.8x P/S（市销率）
        - AI 电力 / 散热 / 基础设施受益可比公司
        - 硬件和服务敞口不同于 Emerald
      - - Bloom Energy
        - 2025 年收入 ~2.02B；市值 ~64.3B
        - ~20.6x P/S（市销率）
        - 电力瓶颈受益标的，带战略叙事溢价
        - 硬件 / 项目属性和诉讼噪音不同
      - - Eaton
        - 2025 年收入 ~27.45B；市值 ~162.9B
        - ~5.4x P/S（市销率）
        - 相邻电气化和电力基础设施可比公司
        - 大型多元化在位企业，不是风险投资阶段的专业公司
    notes: 这些可比公司用于框定未来可支撑区间，并不是说今天可以直接类比。
    enumerationScope:
      coverage: partial
      basis: >-
        Selected public comps span data-center infrastructure, AI-power bottleneck beneficiaries, and adjacent
        electrification platforms that help bracket Emerald’s future valuation support, but they are not an exhaustive
        set of every potential comparable.
    claimRefs:
      - CV018
      - CV019
      - CV022
      - CV020
      - CV021
      - CV023
      - CV024
  - id: TV005
    title: 投资逻辑破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 电价经济性失败
        - 灵活负载项目给客户的价值弱，或限电 / 抵押品要求过重
        - 削弱付费意愿，并拖慢转化
        - 除非价格重置，否则转向回避
      - - 重复部署证明停滞
        - 没有出现可信的多站点重复付费项目
        - 削弱乐观和基准商业化假设
        - 下调远期倍数支撑
      - - 集中度过高
        - 一两个站点 / 伙伴主导预期 ARR
        - 压缩收入质量和退出吸引力
        - 投资前要求披露集中度
      - - 财务访问仍受阻
        - 尽调拿不到收入 / 利润率 / 现金跑道
        - 即便投资逻辑仍吸引人，信心也应下降
        - 不要承销本轮
      - - 安全或可靠性事故
        - 与控制层相关的重大客户可见故障
        - 损害信任和溢价倍数支撑
        - 在复核完成前升级为回避
      - - 可移植性仍然狭窄
        - 没有非核心生态证明
        - 护城河看起来更弱，渠道依赖更强
        - 降低估值容忍度
    notes: 这张表用于支撑投 / 不投决策，而不是做叙事描述。
    claimRefs:
      - CV035
      - CV032
      - CV033
      - CV034
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 合同
        - 按主要账户拆分的 ACV、期限、定价基础、续约权
        - 检验收入质量最快
        - 要求提供头部客户合同包
      - - 利润率
        - 毛利率、服务组合、实施负担
        - 区分软件经济性和服务拖累
        - 要求提供按合同类型拆分的 P&L 视图
      - - 股权结构表
        - 优先股堆叠、优先级、清算条款、老股交易
        - 真实回报计算需要这些信息
        - 要求提供完整资本结构表
      - - 集中度
        - 按站点、电力公司和伙伴渠道拆分的 ARR 与管线
        - 检验叙事是否比少数旗舰项目更宽
        - 要求提供集中度明细
      - - 现金跑道
        - 现金、烧钱速度、招聘计划、情景现金跑道
        - 检验去风险前是否存在时间压力
        - 要求提供董事会或财务计划
      - - 可移植性
        - 非 NVIDIA、非核心电力公司的商业证明
        - 检验生态依赖是否只是过渡
        - 要求提供部署路线图和已签署证明
    notes: 这些尽调要求按改变建议或估值立场的速度排序。
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
      - CV034
