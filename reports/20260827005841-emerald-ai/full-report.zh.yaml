  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Emerald AI 的投资逻辑成立。公司瞄准的是真瓶颈——AI 数据中心取电——并用控制层产品解决，成本和速度都可能
              优于等待新电网基础设施。市场顺风不是猜想；多家独立来源都把电力描述为数据中心扩张的闸门。以公司年龄看， Emerald 的早期验证也异常具体，包括点名演示、电力公司背书的部署和标杆生态合作。这让它远比典型的收入前
              气候软件概念更值得投资人认真看。


              反向逻辑在于，公司质量好不等于价格好。灵活负载价值可能很难截留，客户经济性可能取决于费率和电力公司配合； Emerald
              也还没有披露投资者需要的财务证据，无法把战略前景和持久商业质量分开。围绕小生态的集中度同样重要， 因为当前轮次价格已经假设 Emerald 能把早期验证转成可复制规模。因此，这个投资逻辑实质上有吸引力，但决策上
              仍高度看价格。
