        blocks:
          - type: paragraph
            body: >-
              Emerald 最好的护城河论据，是一套整合证据：现场事件中的工作负载性能数据、公用事业特定运营手册，以及与 NVIDIA、National Grid、Silicon Valley Power 和更广泛
              DCFlex 生态的伙伴可信度。上述都是真实资产，但仍处早期。公开记录显示，Emerald
              的具名试点证据强于许多同业，却没有显示长期续约、大规模装机基础或定价权。换句话说，今天的护城河更像叙事加证据，而不是规模加锁定。


              反向情景很直接。电力公用事业公司可能无法为灵活性创造足够经济价值，从而压缩整个品类。既有 DR
              或公用事业平台厂商可能把软件适配到大负荷和数据中心用例。大型运营商或超大规模云厂商可能把这种能力内化。现场发电等替代路径也会缩小愿意接受基于削减权衡的买方池。在 Emerald
              证明可重复的生产级采用之前，竞争风险与其说来自某一个对手，不如说来自更大平台和相邻替代方案对这个品类的吸收。
