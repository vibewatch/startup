      - number: '1.2'
        title: 创始人-市场匹配、管理梯队与治理
        blocks:
          - type: paragraph
            body: >-
              Emerald 的创始人-市场匹配，在基础设施控制创业公司里异常强。Varun Sivaram 有来自 Orsted 和 ReNew
              的电力行业运营经验、美国外交工作的政策公信力，以及围绕能源系统约束的公共思想影响力。这些背景让 Emerald 面对监管机构和电力公用事业公司时具备可信度，而纯 AI
              应用背景创始人很可能缺少这一点。早期管理梯队进一步加深了这种匹配：Ayse Coskun 是电网响应柔性计算领域最知名的学者之一，Shayan Sengupta 带来 AWS 和 Intel
              的超大规模工程落地经验，Aroon Vijaykar 和 Mansi Shah 则补上根植于能源和企业基础设施的商业与产品领导力。


              治理结构同样值得注意，因为它直接映射了 Emerald 的 GTM 策略。董事会和观察员名单包括 Energize、Radical、DCVC、NVentures、Lowercarbon 以及 Energy
              Impact Partners/Frontier Fund。顾问横跨公用事业、政策、AI 和能源市场圈层，从 Salt River Project 的 David Rousseau 到 Jason Bordoff
              和 Gina Raimondo。上述网络是战略优势，因为 Emerald 必须跨行业销售。但它也是集中度风险，因为公开材料仍未披露投票控制权、保护性条款，或这一异常战略化股权结构的具体经济权利。
