      - number: '8.2'
        title: 估值背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              当前融资背景既亮眼，也让人不舒服。Emerald 在 August 2026 以 $1.05 billion 估值完成 $150 million Series A 轮，随附 Form D 显示截至 early
              August 该轮仍在配售。这是投资人需求的强信号。但公开市场投资者不应把需求 误当成估值证明。Emerald 尚未披露收入、ARR、毛利率或现金跑道，也没有公布股权结构表或优先股堆叠细节。因此，
              当前估值还无法作为「现有销售额」故事来辩护。它是一份前瞻期权，押注市场领导地位、生态控制权和商业化快于预期。


              有纪律的读法，是把价格倒过来算。即便按 8x 到 12x 销售收入倍数——高质量基础设施或电力转型平台在公开市场 能拿到这个区间，已经很慷慨——Emerald 也需要大约 $88 million 到 $131
              million 年收入，才能支撑当前估值。 长期看并非不可能，但公开证据今天还没有证明。因此，以 $1.05 billion 入场，需要相信强劲的未来转化，而不只是 欣赏团队或赛道。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV016
              - CV014
              - CV015
              - CV017
