  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与品类地图
        blocks:
          - type: paragraph
            body: >-
              Emerald AI 竞争的市场仍在从相邻品类中拼出来，还不是同业边界清晰的稳定软件赛道。直接要完成的任务不是通用需求响应，而是让 AI
              数据中心负荷足够灵活，从而释放更快电力接入、响应电网状态，并守住关键工作负载。因此，在本资料集中，Emerald 是最清晰的直接专业厂商。大多数其他供应商则从三类相邻位置切入：Voltus 和 CPower
              等工商业需求响应聚合商；Virtual Peaker、EnergyHub、Uplight 和 Itron 等面向公用事业公司的灵活性平台；以及现场电力、迁往电力更有优势的地区、业主或公用事业嵌入式方案等替代路径。


              原因在于，买方可能解决同一个电力受限问题，却从不发起 Emerald 与 Emerald
              克隆厂商的直接采购对比。很多时候，真正的选择是在专业编排、既有能源平台能力、定制公用事业合同和资本密集型替代策略之间取舍。因此，竞争对手表把直接、相邻、既有厂商和替代类别分开，而不是假装每家供应商都是正面相撞的软件同业。
