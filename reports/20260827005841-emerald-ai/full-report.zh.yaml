      - number: '8.3'
        title: 可比公司分析与情景框架
        blocks:
          - type: paragraph
            body: >-
              公开可比公司组合同时给出两点有用信号。第一，AI 电力和数字基础设施生态可以支撑健康估值倍数：Bloom、Equinix、 Digital Realty、Vertiv 和 Eaton
              都能以可观的销售收入倍数交易，因为投资者奖励稀缺基础设施、电气化敞口和 AI 带动的增长。第二，这些公司披露的是数十亿美元收入，经营历史也比 Emerald 丰富得多。真正的启示不是 Emerald
              今天就该按它们的平均倍数交易；而是如果 Emerald 执行到位，这些倍数提供了未来支撑的天花板和讨论语言。


              由此自然进入情景法。乐观情景假设 Emerald 成为能跨多个站点和客户类型复制的控制层，拿到溢价倍数，并把隐含价值
              推向数亿美元高位甚至更高。基准情景假设公司成功商业化，但节奏更慢，使当前轮次大致处于满估到偏高之间。悲观 情景假设战略重要性没有转化为广泛价值截留，最终证明当前价格过高。仅看公开证据，概率加权结果低于当前轮次，
              这也是建议停在观察、而不是买入的原因。
