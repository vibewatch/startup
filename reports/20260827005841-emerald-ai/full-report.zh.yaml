      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本充足性是 Emerald 公开财务档案中最强的一部分，但仍留下重要盲点。融资序列异常快：以 $24.5 million 种子轮公开亮相，随后用 $18 million 延展把规模推至 $42.5
              million，再用 $25 million 战略扩张轮把融资推至约 $68 million，最后以 $1.05 billion 估值完成 $150 million Series A。SEC Form D
              文件佐证了发行规模越来越大、投资人参与越来越广的模式。截至 2026 年 8 月，公司已披露累计融资约 $217.5 million。


              资本基础很重要，因为 Emerald 正从演示走向商业部署，需要工程支持、伙伴管理、产品硬化和全球商业扩张。但已披露融资额不等于手上现金，所审阅来源也没有发布烧钱速度或现金跑道。结果是一幅单边图景：投资人能看到
              Emerald 相比多数气候软件创业公司资金充足，却看不到公司消耗这一优势的速度，也无法判断哪个里程碑会触发下一轮融资。实践中，下一轮触发因素很可能取决于当前旗舰部署能否在 Series A
              现金优势被扩张成本吃掉之前，转化为可重复、收入密度高的商业项目。
