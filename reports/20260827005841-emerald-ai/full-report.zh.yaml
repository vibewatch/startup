      - number: '1.3'
        title: 融资历程、投资人基础与里程碑
        blocks:
          - type: paragraph
            body: >-
              Emerald 的融资节奏异常快。公司 2025 年 7 月凭 $24.5 million 种子轮公开亮相，随后通过 SEC Form D 文件和公司帖文披露了若干过渡融资，又在 2026 年 8 月
              Series A 前完成 $25 million 战略扩张轮和 $18 million 种子轮延展。截至本报告日，公开披露指向累计宣布融资约 $218
              million。融资路径体现一套有意设计的策略：先用早期试点证明技术可信度，再用战略投资人包围公司，等电力公用事业公司和数据中心买方开始把灵活性视为并网解决方案，而不是科研项目时，再募集更大一轮资金。


              里程碑路径与这套资本策略相匹配。Emerald 的公开记录从 2024 年 11 月创立，推进到 2025 年 5 月 Phoenix 演示，再到 2025 年末英国和 Virginia 旗舰项目公告，最后到
              2026 年 California 电力公用事业试点和独角兽 Series A。投资人组合本身也是商业信号。除财务 VC
              外，本轮还包括芯片、公用事业、工业和能源公司，它们可能成为设计伙伴、客户或渠道关系。公司仍很年轻且尚未披露收入，生态强度因此成为公开可见的最清晰去风险证据之一。
