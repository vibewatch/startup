        title: GTM 动作、成本结构与单位经济可见度
        blocks:
          - type: paragraph
            body: >-
              Emerald 的 GTM 动作更像战略型企业基础设施销售，而不是自助式 SaaS。为公司出资的同一组联盟，也解释了它可能怎样赢单：电力公用事业公司、数据中心运营商、NVIDIA
              相关基础设施伙伴和战略投资人都贴近采购中心。这可以降低漏斗顶部的获客摩擦。但它也意味着销售周期长、部署范围需要定制、伙伴协同很重。换句话说，渠道杠杆真实存在，销售效率仍不透明。


              可见成本结构也遵循同一模式。Emerald
              的软件优先姿态，应让它远比拥有资产的能源基础设施模式轻资本，但公司很可能仍承担昂贵的工程、集成、基准测试和商业开发成本。公开证据没有披露获客成本（CAC）、回本周期、毛利率或贡献利润率，所以单位经济大多仍停留在定性层面。如果实施后软件毛利率占主导，业务最终可能极具吸引力；但今天的公开记录只支持较弱的说法：相比发电重资产替代方案，Emerald
              可能更轻资本；相比普通横向 SaaS，它仍更重部署。
