      - number: '8.4'
        title: 决策、触发因素与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              投委会信息应很直接：Emerald 应该进观察名单，而不是回避名单；但当前估值需要纪律。公司已有足够外部验证，
              投资者应继续推进这个案子。它没有足够公开财务披露来支撑在本轮高置信度买入。这个区别很重要。许多优秀私人公司 在估值跑赢证据后，会变成糟糕投资；Emerald 今天已接近这条线。


              什么会改变判断？正向重估触发因素包括披露合同金额、重复付费部署证据、超出当前生态的更广泛可移植性，以及更清晰 的利润率或现金跑道支撑。负向触发因素包括费率经济性弱、集中度高、无法取得财务资料，或发生安全 /
              可靠性事件。 下一步最好不是围绕 AI 和电力做哲学辩论，而是围绕合同、股权结构表、利润率、集中度和现金跑道做定向尽调。如果 尽调通过，Emerald 可以支撑更积极的立场；如果不能，正确答案仍是耐心。
