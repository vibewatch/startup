      - number: '1.4'
        title: 牵引信号与仍然关键的缺口
        blocks:
          - type: paragraph
            body: >-
              最强的外部证据在于，Emerald 已经越过 PPT 阶段，进入与一线对手方的现场演示。公开来源描述了 Phoenix 工作负载削减测试、London 电网响应试验、Santa Clara 电力公用事业试点，以及
              Virginia 的 Aurora 参考设施。上述项目既显示技术认真度，也显示生态买账。它们还表明，产品正由真正影响市场形成的参与者塑形：NVIDIA、Digital
              Realty、EPRI、PJM、National Grid 和 Silicon Valley Power。


              不过，公司概况尽调不能停在 logo。Heatmap 和 S&P Global 都点出核心商业化风险：电力公用事业公司和超大规模云厂商必须接受一种新的运营模型，让部分 AI
              工作负载变成灵活性资源。这需要激励结构、运营手册和信任，而这些尚未在广泛生产规模上经受检验。公开材料也在收入、利润率、客户集中度、续约行为和控制权方面留下重大承销缺口。Emerald
              已在叙事上迈入独角兽门槛，但公司仍未披露足以让外部投资人高置信度论证这一估值的运营证据。
