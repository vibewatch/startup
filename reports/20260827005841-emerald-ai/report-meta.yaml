companyProfile:
  summary: >-
    Emerald AI is a Washington, DC-based software company building Emerald Conductor, a control layer that
    helps AI data centers respond to grid and power constraints without compromising critical workloads. The
    company sells into the overlap between hyperscalers, data-center operators, utilities, and grid
    institutions, positioning flexibility as a speed-to-power and capacity-unlock solution rather than a pure
    energy-efficiency tool. Public evidence supports unusually strong early technical validation and ecosystem
    backing for a company founded in 2024, but not yet the financial disclosure needed to cleanly underwrite
    the current $1.05 billion valuation.
  foundedDate: '2024-11-01'
  founders:
    - name: Varun Sivaram
      role: Founder and CEO
      background: Former Orsted chief strategy and innovation officer and former ReNew Power CTO with deep power-policy credibility.
      claimRefs: [CO005, CO006]
  foundingLocation: Washington, DC
  headquarters: Washington, DC
  productSummary: Software that orchestrates AI workloads and onsite energy resources so data centers can act as flexible grid assets.
  customerFocus: Hyperscalers, AI infrastructure operators, data-center landlords/operators, utilities, and grid institutions.
  businessModel: Emerald sells a software control layer and related deployment workflows that monetize faster interconnection, load flexibility, and grid-aware power scheduling.
  stage: Series A
  fundingStatus: $150M Series A announced in August 2026 at a $1.05B valuation, following roughly $68M of previously disclosed seed, extension, and strategic expansion financing.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO005, CO007, CO009, CO018, CO034]
summary:
  headline: Emerald AI has a real product and market wedge in AI-power flexibility, but the August 2026 $1.05B Series A already prices in substantial forward revenue conversion that public evidence does not yet prove.
