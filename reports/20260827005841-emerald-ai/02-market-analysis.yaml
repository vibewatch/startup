- id: buyer-map
  title: Buyer, User, and Payer Segmentation
  body: "Emerald AI\u2019s early market is multi-sided. The direct operational user is typically the data center energy, operations, or infrastructure team that must preserve uptime while exposing some dispatchable flexibility. The direct commercial buyer is often the same team for hyperscalers, neoclouds, or large colocation developers when speed-to-power becomes existential. But the economic sponsor can also be a utility, public-power provider, or system operator when flexibility is embedded in a tariff, pilot, or interconnection agreement.\n\nThis means Emerald is not selling a generic line-of-business SaaS tool. It is selling a workflow that sits at the intersection of utility planning, interconnection, data center operations, and AI workload scheduling. Adoption triggers include delayed grid access, punitive cost allocation, non-firm service opportunities, and the presence of a willing utility partner. The segment map below matters for valuation because the buyer\u2019s budget owner\
    \ is closer to energy strategy and infrastructure planning than to ordinary IT procurement, which can slow cycles but also increase strategic value once a pathway is proven."
  claimRefs:
  - CM032
  - CM033
  - CM034
  - CM035
  - CM046
  - CM047
