chapter:
  number: 2
  title: Market Analysis
  summary: "Emerald AI\u2019s real market is the power-flexibility control layer for AI data centers, not all data center capex. Public evidence strongly supports acute macro demand growth, power-constrained siting, and a meaningful multi-GW flexible-interconnection opportunity, but still does not disclose a clean software-dollar TAM. The market is strategically important in 2026 because utilities, regulators, and operators are actively testing pathways for flexible large loads, yet commercialization remains gated by local tariffs, uptime conservatism, and unresolved pricing structures."
sections:
- id: market-boundary
  title: Market Boundary and Definition
  body: >-
    Emerald AI does not compete for all spending tied to AI infrastructure. The relevant market is the narrow control layer that helps power-constrained data centers win faster interconnection, participate in utility or grid flexibility programs, and verify that curtailed or shifted workloads still meet service constraints. That boundary matters because most of the dollars in AI infrastructure sit in land, shells, substations, generation, networking, and GPUs; Emerald only touches those budgets indirectly when its software makes capacity usable sooner or helps avoid additional power-system cost.


    Included spend therefore covers orchestration software, telemetry, compliance or verification tooling, integration work with utilities or system operators, and recurring software or performance fees tied to availability, curtailment, or scheduling. Excluded spend includes generic colocation rent, power hardware, merchant generation assets, and one-off construction capex unless Emerald captures economics through the flexibility workflow. The status quo remains waiting for firm interconnection, building onsite power, using bespoke bilateral arrangements without specialist software, or shifting deployments to more power-advantaged geographies.
  claimRefs:
  - CM028
  - CM029
  - CM030
  - CM031
  tableRefs:
  - TM001
- id: market-sizing
  title: Sizing Lenses and Boundary-Constrained Opportunity
  body: "Public sources strongly support that the macro problem is large and accelerating, but they do not directly yield a clean software TAM. IEA expects U.S. electricity demand to rise nearly 2% annually through 2030, with around half of that increase driven by data centers, while Berkeley Lab says U.S. data center demand could reach 325-580 TWh by 2028. JLL then adds a supply-side lens: nearly 97 GW of new global capacity between 2026 and 2030, supported by a 14% sector CAGR. Bloom, CBRE, and JLL all describe power access\u2014not cheap rent or connectivity\u2014as the gating factor.\n\nThat makes GW-based sizing more defensible than software-dollar sizing. The highest-confidence public headroom thesis comes from the Duke/CFR framing that roughly 100 GW of U.S. data center demand could connect sooner if facilities accept limited curtailment. A practical SAM is smaller because commercialization depends on tariffs, utility willingness, and proof that critical workloads survive flex events.\
    \ This chapter therefore preserves three lenses: macro electricity demand, data center supply growth, and a constrained 25/50/100 GW flexible-interconnection range rather than pretending public evidence discloses Emerald AI\u2019s actual priceable software revenue pool."
