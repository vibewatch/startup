callouts:
- calloutType: insight
  title: Power scarcity is the market, not just the backdrop
  body: "Emerald AI\u2019s category only exists because time-to-power has become a binding constraint on AI infrastructure growth. That makes the company more exposed to utility process and regulation than most enterprise software startups."
  claimRefs:
  - CM008
  - CM036
  - CM035
- calloutType: risk
  title: Public TAM evidence is stronger in GW than in dollars
  body: The best public evidence supports large TWh and GW opportunity, but not a clean software-dollar TAM. Any valuation case that jumps straight from 100 GW of headroom to software revenue needs management pricing proof.
  claimRefs:
  - CM021
  - CM041
  - CM051
- calloutType: strength
  title: Commercial credibility rises as field proof accumulates
  body: "Phoenix, the UK trial, and the broader DCFlex ecosystem matter because they convert flexibility from theory into operating evidence. Emerald does not need every data center to flex\u2014only enough strategic campuses to prove the model."
  claimRefs:
  - CM024
  - CM025
  - CM027
