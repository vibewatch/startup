  topStrengths:
    - 'Emerald is tackling a genuine AI-infrastructure bottleneck: power availability and flexible load management.'
    - >-
      Public proof is unusually concrete for the stage, with Phoenix, UK, Santa Clara, and Aurora evidence tied to named
      counterparties and measured outcomes.
    - >-
      The investor and partner syndicate is strategically valuable because it includes utilities, AI ecosystem actors,
      and industrial incumbents that can help create market access.
  topRisks:
    - The $1.05B valuation assumes much more revenue scale and durability than public sources disclose today.
    - >-
      Customer and ecosystem concentration around a small number of flagship partners, utilities, and sites could
      compress future revenue quality.
    - >-
      Flexible-load economics may remain thin if utilities and customers do not share enough value or if tariff
      structures are unattractive.
    - >-
      Public disclosures still omit contract value, margins, runway, retention, and preference-stack detail, limiting
      underwriting confidence.
  unresolvedGaps:
    - Revenue, ARR, ACV, gross margin, and customer-renewal data are not publicly disclosed.
    - >-
      Cap-table dilution, liquidation preferences, and secondary-market context are not transparent enough to underwrite
      entry returns.
    - Concentration by site, partner, and utility territory remains unclear despite strong flagship proof.
    - >-
      Public evidence does not yet prove that early pilots and flagship deployments compound into repeat multi-site
      commercial programs.
