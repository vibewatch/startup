company:
  name: Emerald AI
chapter:
  number: 1
  title: Company Overview
  summary: Emerald AI is a Washington, DC-based startup founded in late 2024 that sells Emerald Conductor, software designed to make AI data centers flexible grid assets. Public evidence shows unusually fast progress from seed launch in July 2025 to five live demonstrations, an Aurora reference-facility partnership in Virginia, a Santa Clara utility pilot, and a $150 million Series A at a $1.05 billion valuation in August 2026. The cap table and advisory network are unusually strategic, but public disclosures still omit the revenue, customer-count, and governance detail required to fully underwrite the new unicorn price.
sections:
- id: identity-and-product
  title: Identity, Headquarters, and Product Thesis
  body: >-
    Emerald AI is a Washington, DC-based climate-and-energy software company founded in late 2024 to solve an increasingly specific bottleneck in AI infrastructure: power. Rather than assuming every AI data center must behave like an inflexible 24/7 peak load, the company argues that modern GPU workloads can be orchestrated to temporarily slow, pause, or shift without violating the service-level requirements that matter most. Emerald packages that thesis into Emerald Conductor, a control layer that sits between utilities or grid operators and data-center operations teams.


    The company’s materials consistently frame the product as software, not generation equipment. Conductor ingests grid signals, workload priorities, and local energy conditions, then modulates facility demand or onsite resources so the data center can act like a controllable asset instead of a passive liability. That positioning matters because it makes Emerald relevant to hyperscalers, colocation operators, and utilities at the same time. It also means the company’s value proposition is tied directly to time-to-power: if Conductor lets operators connect sooner, secure larger interconnection envelopes, or avoid expensive grid upgrades, the product can sit close to a mission-critical budget even before direct energy-market revenues are proven.
  claimRefs:
  - CO001
  - CO002
  - CO007
  - CO008
  - CO031
  - CO034
  tableRefs:
  - TO001
  figureRefs:
  - FO002
  - FO003
- id: founder-leadership-and-governance
  title: Founder-Market Fit, Leadership Bench, and Governance
  body: >-
    Emerald’s founder-market fit is unusually strong for an infrastructure-control startup. Varun Sivaram combines power-sector operating experience from Orsted and ReNew, policy credibility from U.S. diplomatic work, and public thought leadership on energy-system constraints. That background gives Emerald legitimacy with regulators and utilities that a pure AI-application founder would likely lack. The early leadership bench deepens that fit: Ayse Coskun is one of the best-known academics in flexible computing for grid response, Shayan Sengupta brings hyperscale engineering execution from AWS and Intel, and Aroon Vijaykar and Mansi Shah add commercial and product leadership rooted in energy and enterprise infrastructure.


    Governance is also notable for how directly it mirrors Emerald’s go-to-market strategy. The board and observer list includes Energize, Radical, DCVC, NVentures, Lowercarbon, and Energy Impact Partners/Frontier Fund. Advisors span utility, policy, AI, and energy-market circles, from David Rousseau at Salt River Project to Jason Bordoff and Gina Raimondo. That network is a strategic advantage because Emerald must sell across industry boundaries. It is also a concentration risk, since public materials still do not disclose voting control, protective provisions, or the exact economic rights of this unusually strategic cap table.
  claimRefs:
