callouts:
- calloutType: strength
  title: Strategic investors are also potential go-to-market infrastructure
  body: Emerald's cap table is unusually valuable because it does more than finance the company. Investors and close partners span utilities, chip vendors, data-center operators, enterprise software, and industrial infrastructure, which can accelerate both product design and market access in a category that depends on ecosystem coordination.
  claimRefs:
  - CO010
  - CO011
  - CO012
  - CO020
  - CO021
  - CO031
  - CO032
- calloutType: risk
  title: The unicorn valuation arrived before public operating disclosure
  body: The jump to a $1.05B valuation came before Emerald disclosed revenue, customer count, headcount, or detailed gross-margin and governance information. That does not invalidate the company thesis, but it means the valuation is being supported primarily by strategic positioning and technical proof points rather than by the conventional late-stage software metrics outside investors usually want.
  claimRefs:
  - CO009
  - CO018
  - CO034
  - CO036
- calloutType: insight
  title: Emerald's core asset is translation across two hard-to-coordinate industries
  body: The company's strongest early differentiation may be organizational rather than purely algorithmic. Emerald combines utility-language credibility, hyperscale-compute expertise, and policy fluency in one team and one cap table. That matters because the product only works when utilities, grid operators, chip vendors, and data-center operators all accept the same operating model.
  claimRefs:
  - CO005
  - CO020
  - CO021
  - CO022
  - CO023
  - CO024
  - CO031
  - CO032
