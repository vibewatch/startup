- id: traction-signals-and-open-underwriting-gaps
  title: Traction Signals and the Gaps That Still Matter
  body: >-
    The strongest external proof is that Emerald has moved beyond slideware into live demonstrations with blue-chip counterparties. Public sources describe a Phoenix workload-curtailment test, a London grid-response trial, a Santa Clara utility pilot, and the Aurora reference facility in Virginia. Those references show both technical seriousness and ecosystem buy-in. They also suggest the product is being shaped by the exact actors who matter for market creation: NVIDIA, Digital Realty, EPRI, PJM, National Grid, and Silicon Valley Power.


    Still, company-overview diligence cannot stop at logos. Heatmap and S&P Global both surface the central commercialization risk: utilities and hyperscalers must accept a new operational model in which some AI workloads become flex resources. That requires incentive structures, operating playbooks, and trust that have not yet been tested at broad production scale. Public materials also leave major underwriting gaps on revenue, margins, customer concentration, renewal behavior, and control rights. Emerald has crossed the narrative threshold into unicorn status, but the business has not yet disclosed the operating evidence that would let an outside investor underwrite that valuation with high confidence.
