  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: ARR, recognized revenue, ACV, contract duration, renewal, and pricing basis by customer segment.
    whyItMatters: Without these, the financial chapter can describe monetization logic but not actual revenue quality.
    diligencePath: Request booked ARR and top-customer contract schedules with pricing terms and renewal dates.
    relatedQuestionRefs:
    - QI002
    - QI003
    - QI009
    - QI020
    - QI023
    - QI025
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, services mix, implementation cost, CAC, sales cycle, and payback data.
    whyItMatters: These metrics determine whether Emerald compounds like software or behaves like a services-heavy infrastructure integrator.
    diligencePath: Request cohort-level unit economics and deployment-level P&Ls.
    relatedQuestionRefs:
    - QI005
    - QI006
    - QI007
    - QI021
    - QI023
    - QI025
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Cash on hand, monthly burn, budgeted hiring, and runway by operating scenario.
    whyItMatters: Large fundraising alone does not prove capital adequacy if spending is scaling just as fast.
    diligencePath: Request current cash balance, 24-month operating plan, and downside runway case.
