- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - ARR / revenue by segment
    - Without this, valuation and capital efficiency cannot be anchored
    - Request booked ARR, recognized revenue, and pipeline by utilities / operators / strategic accounts
  - - Average contract value and term
    - Without ACV and term, revenue quality and pricing power are unknowable
    - Request top 20 contracts with ACV, term, renewal, and pricing basis
  - - Gross margin and services mix
    - Without margin decomposition, software scalability is speculative
    - Request gross margin by contract type and services share
  - - CAC, sales cycle, and payback
    - Without efficiency metrics, GTM scalability is unproven
    - Request CAC by channel, pipeline conversion, and payback
  - - Burn and runway bridge
    - Without cash-consumption visibility, capital adequacy is one-sided
    - Request current cash, monthly burn, hiring plan, and runway by scenario
  - - Customer concentration by logo and site
    - Without concentration data, revenue durability is overstated
    - Request top-customer share of ARR and pipeline
  - - Deployment-to-revenue conversion
    - Without stage conversion data, flagship proofs may overstate monetization
    - Request pilot-to-production conversion rates and implementation timelines
  notes: These are the fastest ways to turn Emerald from a compelling narrative into a financeable underwrite.
