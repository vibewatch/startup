    - QI024
  - type: partial-coverage
    severity: important
    topic: pricing-structure
    missingEvidence: Public materials explain value creation but do not reveal who pays, how much, or on what settlement basis in utility-backed deployments.
    whyItMatters: Pricing opacity is the main barrier between a compelling story and a financeable underwriting model.
    diligencePath: Obtain exemplar contracts from one operator-led and one utility-led deployment.
