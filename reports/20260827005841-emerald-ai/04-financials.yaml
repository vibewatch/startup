  rows:
  - - Conductor software platform
    - Customer pays for workload orchestration and grid-response control
    - Subscription / license (undisclosed)
    - Core monetization surface is explicit; economics undisclosed
    - Potentially high if recurring
    - Request contract structure, ACV, and renewal basis
  - - Implementation / integration services
    - Deployment engineering, site configuration, and workflow integration
    - Project fee or bundled services (undisclosed)
    - Likely present in early deployments
    - Medium; may be non-recurring
    - Request services share of revenue and attach rate
  - - Utility program participation support
    - Software used inside flexibility or interconnection programs
    - Program or service fee (undisclosed)
    - Visible in SVP-style deployments
    - Medium; depends on program design
    - Request who pays and whether revenue is recurring
  - - Commercial pilot / flagship deployment fees
    - Paid proof-of-value or first-site commercial rollout
    - Pilot contract or milestone fee (undisclosed)
    - Strongest near-term public candidate
    - Low-medium until repeatability is shown
    - Request contract duration and success criteria
  - - Potential shared-savings / value-based pricing
    - Pricing linked to faster interconnection, avoided grid upgrades, or flexibility value
    - Shared value formula (not disclosed)
    - Conceptually plausible but not public
    - Unknown
    - Request pricing logic and settlement examples
  - - Strategic design-partner programs
    - Paid collaboration with strategic investors or ecosystem partners
    - Mixed commercial / strategic terms
    - Possible but not publicly broken out
    - Unknown
    - Separate strategic funding from customer revenue
  notes: Every row except the existence of a software-led core model relies on inference because Emerald discloses use cases and customers, not contract templates or price cards.
