  - FP003
- id: pricing-distribution
  title: Pricing, Packaging, and Switching Dynamics
  body: "Public pricing transparency is poor across this landscape. Voltus is unusually transparent on the demand-response side because it publishes illustrative MW-year earnings opportunities, but even that is not a software list price. Most other vendors describe outcomes, partnerships, or solution families without revealing contract basis, minimum commitments, implementation fees, or realized economics. As a result, the pricing comparison in this chapter is really a packaging comparison: some vendors look like revenue-share aggregators, some resemble utility SaaS or program-management stacks, and others bundle flexibility into broader energy or infrastructure solutions.\n\nSwitching dynamics are similarly non-binary. Once a data center, utility, and telemetry stack are integrated, there are real switching costs in process, risk management, and stakeholder trust. But multi-homing is also plausible because Emerald can sit alongside forecasting, utility DR software, or onsite-power systems.\
    \ That makes distribution leverage\u2014especially pre-existing utility and energy-buyer relationships\u2014as important as product elegance. Emerald\u2019s risk is that incumbents can meet the buyer first, then narrow the perceived gap later."
  claimRefs:
  - CP020
  - CP021
  - CP026
  - CP027
  - CP047
  - CP018
  tableRefs:
  - TP003
- id: moat-risks
  title: Moat Durability and Displacement Risks
  body: "Emerald\u2019s best moat argument is an integrated proof set: workload-performance data from live events, utility-specific operating playbooks, and partner credibility with NVIDIA, National Grid, Silicon Valley Power, and the broader DCFlex ecosystem. That is real, but still early. The public record shows stronger named pilot proof for Emerald than for many peers, yet it does not show long-term renewals, large installed base, or pricing power. In other words, the moat today is more narrative-plus-proof than scale-plus-lock-in.\n\nThe adverse cases are straightforward. Utilities may fail to create enough economic value for flexibility, compressing the whole category. Incumbent DR or utility-platform vendors may adapt their software toward large-load and data-center use cases. Large operators or hyperscalers may internalize the capability. And substitute paths such as onsite generation can shrink the pool of buyers willing to accept curtailment-based tradeoffs. Until Emerald proves\
    \ repeatable production adoption, competitive risk is less about a single rival and more about category absorption by larger platforms and adjacent substitutes."
  claimRefs:
  - CP033
  - CP034
  - CP029
  - CP030
  - CP031
  - CP032
  - CP049
  - CP035
