artifact: customers
slug: emerald-ai
runDate: '2026-08-27'
company:
  name: Emerald AI
chapter:
  number: 6
  title: Customers
  summary: "Emerald AI has unusually specific early customer proof for a company at this stage, with named utility, operator, and ecosystem deployments in Phoenix, the UK, Santa Clara, and Aurora. The strongest evidence supports technical feasibility and ecosystem relevance rather than broad customer-count or retention strength. The key underwriting question is not whether notable counterparties will test Emerald\u2014it is whether those relationships become durable, expanding revenue accounts instead of concentrated flagship proofs."
sections:
- id: customer-segments
  title: Customer Segmentation and Buyer Map
  body: "Emerald AI\u2019s customer map is multi-sided because the product creates value only when power-system actors and compute actors align. Utilities and public-power providers can be direct customers because they may deploy the software, dispatch flexible loads, and use it to support interconnection or reliability goals. Data center operators, AI factory developers, neoclouds, and hyperscaler-adjacent operators are also direct economic beneficiaries because faster power access or reduced grid constraints translate into materially better deployment timing. Grid institutions such as PJM and EPRI appear more as ecosystem enablers than direct recurring customers, while strategic investors may function as channel accelerants and future design partners.\n\nThis structure means Emerald\u2019s customer base should not be modeled like a normal single-buyer enterprise SaaS category. The user, buyer, and payer can differ across the same account. A municipal utility may sponsor the flexible-load\
    \ framework, an operator may integrate the software, and a cloud or data center tenant may receive the operating benefit. That complexity raises friction, but it also means a successful deployment can create multiple stakeholders who want the relationship to deepen over time."
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU031
  - CU032
  - CU033
  tableRefs:
  - TU001
- id: adoption-proof
  title: Named Customer Proof and Adoption Trajectory
  body: >-
    The public record is strongest on named proof items rather than on customer counts. Phoenix established the first durable operating narrative with Oracle, NVIDIA, Databricks, and Salt River Project around a 256-GPU cluster that reduced power by 25% for three hours. The UK trial added a second geography and stronger rapid-response evidence, disclosing more than 200 simulated grid events and reductions of more than one-third in under a minute. Silicon Valley Power then moved the story closer to commercialization by framing its deployment as the first commercial, multi-megawatt DSX Flex implementation. Aurora adds a flagship data center landlord and grid-market operator context through Digital Realty and PJM, but it remains more roadmap than proof of broad recurring revenue today.


    Taken together, the adoption path looks like demonstration to commercial pilot to flagship reference deployment. That is encouraging, but it is still not equivalent to a large disclosed customer base or broad production fleet.
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU011
  - CU013
  - CU017
  - CU039
  - CU041
  tableRefs:
  - TU002
  - TU003
  figureRefs:
  - FU002
  - FU003
- id: durability-retention
  title: Durability, Repeat Usage, and Satisfaction
  body: "Customer durability is where the public record thins out. Emerald has credible evidence of repeat ecosystem engagement\u2014NVIDIA, utilities, and power-market actors recur across multiple proof points\u2014but it does not publish classic SaaS durability metrics such as NRR, GRR, churn, logo retention, or contract duration. Nor does the fetched evidence provide end-customer testimonials that explicitly discuss renewal, achieved ROI over time, or post-pilot production rollout at scale.\n\nThe most optimistic interpretation is that Emerald is moving along a path from one-off proofs toward an embedded commercial role, especially where utility frameworks such as SVP\u2019s flexible-load program create recurring operational need. The cautious interpretation is that the same small partner set may be carrying the entire visible demand story. For underwriting, the real unknown is not whether the technology can work\u2014it is whether accounts become durable, expanding relationships instead\
    \ of remaining showcase deployments."
  claimRefs:
  - CU018
  - CU019
  - CU020
  - CU034
  - CU037
  - CU035
  tableRefs:
  - TU004
  figureRefs:
  - FU001
  - FU004
- id: expansion-concentration
  title: Expansion Loops and Concentration Risks
  body: "The expansion logic is intuitive: if a power-flexible deployment works at one site, it can be copied to new campuses, utility territories, or multi-site fleets. The visible path is from Phoenix-style measured proof to utility-standardized programs such as SVP, and then to larger AI factory campuses like Aurora. Strategic investors and partner ecosystems may amplify this motion because the same actors can help with capital, technical integration, and customer introductions.\n\nBut concentration risk is equally visible. Much of the public proof depends on a narrow ring of named partners: NVIDIA, utilities such as National Grid and SVP, Digital Realty, and a few demonstration sites. Procurement friction is also high because the deal often requires alignment among regulators, utilities, infrastructure providers, and operators. Heatmap\u2019s adverse point remains important: if utilities do not create meaningful interconnection or economic value, even interested customers may not convert\
    \ at scale. That makes the customer chapter more about expansion potential under coordination success than about already-proven account durability."
  claimRefs:
  - CU026
  - CU027
  - CU022
  - CU023
  - CU024
  - CU028
  - CU036
  - CU040
  tableRefs:
  - TU005
