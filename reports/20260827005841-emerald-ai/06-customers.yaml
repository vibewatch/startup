    - 'Buyer: utility; user: grid planners / operators; payer: utility or tariff mechanism'
    - Flexible-load dispatch, interconnection management, reliability
    - 'Named: SVP, National Grid'
    - Creates regulatory and commercial path for Emerald
    - No public contract value or renewal data
  - - AI data center operator / cloud operator
    - 'Buyer: operator or infra team; user: site ops / workload schedulers; payer: operator'
    - Faster power access and power-event response
    - Named in Phoenix, UK, and Aurora ecosystems
    - Direct operating beneficiary and likely future ACV anchor
    - Public customer count undisclosed
  - - Data center landlord / developer
    - 'Buyer: campus or infra lead; user: operations / leasing support'
    - Power-flexible reference campus and tenant support
    - 'Named: Digital Realty Aurora'
    - Potential fleet-level expansion path
    - Commercial status still mostly roadmap
  - - Grid institutions / ecosystem programs
    - 'Buyer: not clearly direct; user: market / program staff; payer: program-specific'
    - Benchmarking, testing, validation, and market design
    - 'Named: PJM, EPRI DCFlex, DOE Genesis'
    - Channel and trust amplifier
    - Not equivalent to recurring subscription customer
  - - Strategic investor / design partner cohort
    - 'Buyer: mixed; user: innovation or strategy leads; payer: mixed'
    - Design partnership, channel support, or future customer path
    - 12 Fortune 500 co-investors disclosed
    - Could accelerate enterprise access
    - Overlap obscures independent market breadth
  notes: "Customer roles are intentionally split across buyer, user, and payer because Emerald\u2019s deployments are multi-stakeholder by design."
