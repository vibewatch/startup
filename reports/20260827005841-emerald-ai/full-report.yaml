      - number: '5.2'
        title: Architecture and Operating Workflow
        blocks:
          - type: paragraph
            body: >-
              The strongest architecture evidence comes from the GitHub demo materials, the Phoenix paper, the Latitude
              interview, and Emerald’s NVIDIA-linked launch posts. Together they imply a workflow that starts with
              external power constraints and then descends into workload-level control. A utility or system event
              defines a target. Emerald profiles the active jobs, classifies their flexibility, evaluates intervention
              options, and applies a control policy that can include power caps, pausing, checkpointing, or geographic
              routing. Telemetry then checks whether the resulting power trajectory and performance thresholds remain
              acceptable.


              That architecture is important because it shows Emerald is not merely forecasting or advising. The product
              sits in the operating loop. Public materials also make clear that the company’s current architecture is
              deeply interwoven with NVIDIA systems, especially DSX Flex, NIM microservices, and Mission Control. The
              benefit is faster credibility and tighter technical integration; the trade-off is clear partner dependence
              and reduced evidence that the product is hardware-agnostic today.
