  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Product Thesis
        blocks:
          - type: paragraph
            body: >-
              Emerald AI is a Washington, DC-based climate-and-energy software company founded in late 2024 to solve an
              increasingly specific bottleneck in AI infrastructure: power. Rather than assuming every AI data center
              must behave like an inflexible 24/7 peak load, the company argues that modern GPU workloads can be
              orchestrated to temporarily slow, pause, or shift without violating the service-level requirements that
              matter most. Emerald packages that thesis into Emerald Conductor, a control layer that sits between
              utilities or grid operators and data-center operations teams.


              The company’s materials consistently frame the product as software, not generation equipment. Conductor
              ingests grid signals, workload priorities, and local energy conditions, then modulates facility demand or
              onsite resources so the data center can act like a controllable asset instead of a passive liability. That
              positioning matters because it makes Emerald relevant to hyperscalers, colocation operators, and utilities
              at the same time. It also means the company’s value proposition is tied directly to time-to-power: if
              Conductor lets operators connect sooner, secure larger interconnection envelopes, or avoid expensive grid
              upgrades, the product can sit close to a mission-critical budget even before direct energy-market revenues
              are proven.
