  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Logic
        blocks:
          - type: paragraph
            body: >-
              Emerald AI’s public financial story starts with what it is not. It is not financing large power plants,
              owning data centers, or selling commodity electricity. The company presents itself as the control layer
              that lets AI data centers become power-flexible grid assets. That means the core monetization logic is
              almost certainly software-led: the Conductor platform, deployment-specific configuration, and the
              operating workflow that lets utilities and operators translate grid conditions into acceptable compute
              responses. The revenue wedge is economic rather than aesthetic. If Emerald helps a customer connect
              faster, avoid interconnection delay, or capture reliability value from flexibility, the software can
              justify meaningful contract value even before broad fleet scale exists.


              The challenge is that public sources stop short of publishing any list price, average contract value,
              usage pricing, or shared-savings formula. As a result, the right way to read Emerald’s current revenue
              model is as a negotiated enterprise infrastructure product whose value depends on local grid bottlenecks,
              customer workload criticality, and which party captures the economic upside. That is directionally
              attractive, because severe power constraints can support pricing power; it is also difficult to
              underwrite, because investors cannot yet map named deployments into disclosed revenue density.
