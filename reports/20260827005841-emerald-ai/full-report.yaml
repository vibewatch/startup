      - number: '8.2'
        title: Valuation Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The current financing context is both impressive and uncomfortable. Emerald closed a $150 million Series A
              at a $1.05 billion valuation in August 2026, and the associated Form D showed the round still being placed
              as of early August. That is a powerful signal of investor appetite. But public investors should be careful
              not to confuse appetite with valuation proof. Emerald has not disclosed revenue, ARR, gross margin, or
              runway, and it has not published cap-table or preference-stack detail. So the valuation is not presently
              defendable as a current-sales story. It is a forward-looking option on market leadership, ecosystem
              control, and faster-than-expected commercialization.


              A disciplined way to read the round is to invert the price. At something like 8x to 12x sales—already a
              generous public-market range for high-quality infrastructure or power-transition platforms—Emerald would
              need roughly $88 million to $131 million of annual revenue to support the current valuation. That is
              plausible over time, but public evidence does not show it today. Entry at $1.05 billion therefore requires
              belief in strong forward conversion, not just admiration for the team or the category.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV016
              - CV014
              - CV015
              - CV017
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV014
              - CV023
              - CV013
      - number: '8.3'
        title: Comparable Analysis and Scenario Framework
        blocks:
          - type: paragraph
            body: >-
              The public comp set says two useful things at once. First, the AI-power and digital-infrastructure
              ecosystem can support healthy valuation multiples: Bloom, Equinix, Digital Realty, Vertiv, and Eaton all
              trade at meaningful sales multiples because investors reward scarce infrastructure, electrification
              exposure, and AI-adjacent growth. Second, those businesses disclose billions in revenue and much richer
              operating history than Emerald does. The relevant lesson is not that Emerald should trade at their average
              multiple today; it is that these multiples provide a ceiling and a language for thinking about future
              support if Emerald executes.


              That leads naturally to a scenario approach. The bull case assumes Emerald becomes a repeatable control
              layer across multiple sites and customer types, earning a premium multiple and scaling toward the high
              hundreds of millions in implied value or more. The base case assumes the company commercializes
              successfully but more slowly, leaving the current round roughly full to stretched. The bear case assumes
              strategic importance does not translate into broad value capture, causing the current price to prove too
              rich. On public evidence alone, the weighted outcome sits below the current round, which is why the
              recommendation stops at track rather than buy.
            claimRefs:
              - CV018
