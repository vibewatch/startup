      - number: '3.2'
        title: Capability, Product Scope, and Distribution Comparison
        blocks:
          - type: paragraph
            body: >-
              The clearest way to compare Emerald with peers is by capability origin. Voltus, CPower, and Leap are
              strongest where the customer already has flexible assets and wants market enrollment, dispatch, and
              settlement. Virtual Peaker, EnergyHub, Uplight, and Itron are stronger where utilities want to run broad
              customer programs across many device types. GridPoint and Enel sit even farther away from Emerald’s core
              promise, addressing building energy or broad clean-energy portfolios rather than GPU-cluster
              orchestration. Amperon is mostly complementary because better forecasting does not itself create
              curtailment control.


              Emerald’s claim to differentiation is not broad category scale; it is narrow relevance to the newest buyer
              pain point. JLL, CBRE, and Bloom describe a world where power access and delivery timing dominate data
              center decisions. Emerald is built exactly around that problem, while most incumbents were built earlier
              for generalized demand response, DER aggregation, or utility engagement. The strength of that position
              depends on whether buyers truly see AI-workload flexibility as a distinct capability worth paying for.
