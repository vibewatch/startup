  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Emerald AI has a real investment thesis. The company is attacking a genuine bottleneck—power access for AI
              data centers—with a control-layer product that can be cheaper and faster than waiting for new grid
              infrastructure. The market tailwind is not speculative; multiple independent sources describe power as the
              gating factor for data-center expansion. Emerald also has unusually concrete early proof for its age,
              including named demonstrations, utility-backed deployments, and flagship ecosystem partnerships. That
              makes the company far more investable than a typical pre-revenue climate-software concept.


              The anti-thesis is that good company quality does not automatically equal good price. Flexible-load value
              can be hard to capture, customer economics may depend on tariffs and utility cooperation, and Emerald
              still has not disclosed the financial evidence investors need to separate strategic promise from durable
              business quality. Concentration around a small ecosystem further matters because the current round price
              already assumes Emerald converts early proof into repeatable scale. The result is a thesis that is
              attractive in substance but still price-sensitive in decision terms.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
