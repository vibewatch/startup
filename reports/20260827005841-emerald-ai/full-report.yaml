            body: >-
              Emerald AI’s customer map is multi-sided because the product creates value only when power-system actors
              and compute actors align. Utilities and public-power providers can be direct customers because they may
              deploy the software, dispatch flexible loads, and use it to support interconnection or reliability goals.
              Data center operators, AI factory developers, neoclouds, and hyperscaler-adjacent operators are also
              direct economic beneficiaries because faster power access or reduced grid constraints translate into
              materially better deployment timing. Grid institutions such as PJM and EPRI appear more as ecosystem
              enablers than direct recurring customers, while strategic investors may function as channel accelerants
              and future design partners.


              This structure means Emerald’s customer base should not be modeled like a normal single-buyer enterprise
              SaaS category. The user, buyer, and payer can differ across the same account. A municipal utility may
              sponsor the flexible-load framework, an operator may integrate the software, and a cloud or data center
              tenant may receive the operating benefit. That complexity raises friction, but it also means a successful
              deployment can create multiple stakeholders who want the relationship to deepen over time.
