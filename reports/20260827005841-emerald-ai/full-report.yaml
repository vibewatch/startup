  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              Emerald AI does not compete for all spending tied to AI infrastructure. The relevant market is the narrow
              control layer that helps power-constrained data centers win faster interconnection, participate in utility
              or grid flexibility programs, and verify that curtailed or shifted workloads still meet service
              constraints. That boundary matters because most of the dollars in AI infrastructure sit in land, shells,
              substations, generation, networking, and GPUs; Emerald only touches those budgets indirectly when its
              software makes capacity usable sooner or helps avoid additional power-system cost.


              Included spend therefore covers orchestration software, telemetry, compliance or verification tooling,
              integration work with utilities or system operators, and recurring software or performance fees tied to
              availability, curtailment, or scheduling. Excluded spend includes generic colocation rent, power hardware,
              merchant generation assets, and one-off construction capex unless Emerald captures economics through the
              flexibility workflow. The status quo remains waiting for firm interconnection, building onsite power,
              using bespoke bilateral arrangements without specialist software, or shifting deployments to more
              power-advantaged geographies.
            claimRefs:
              - CM028
              - CM029
              - CM030
              - CM031
