    type: bar
    layout: wide
    summary: >-
      The current round becomes easier to defend only if Emerald reaches a much larger revenue base than public evidence
      shows today.
    data:
      items:
        - label: 60M revenue @ 8x
          value: 480
          unit: USD millions
        - label: 80M revenue @ 8x
          value: 640
          unit: USD millions
        - label: 100M revenue @ 8x
          value: 800
          unit: USD millions
        - label: 100M revenue @ 10x
          value: 1000
          unit: USD millions
        - label: 120M revenue @ 10x
          value: 1200
          unit: USD millions
        - label: 120M revenue @ 12x
          value: 1440
          unit: USD millions
    approximationNotes: Bars show heuristic valuation outcomes from public comp-style multiples, not management guidance.
    claimRefs:
      - CV014
      - CV023
      - CV013
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: Public evidence supports a wide range, with the probability-weighted center still below the current round.
    data:
      items:
        - label: Bull case
          low: 1600
          high: 2880
          unit: USD millions
          note: Requires repeatability, portability, and strong revenue scale
        - label: Base case
          low: 420
          high: 880
          unit: USD millions
          note: Commercialization continues, but more slowly
        - label: Bear case
          low: 60
          high: 225
          unit: USD millions
          note: Value capture remains thin and concentration high
        - label: Current round mark
          low: 1050
          high: 1050
          unit: USD millions
          note: Series A valuation announced Aug. 2026
    approximationNotes: Scenario brackets are evidence-informed heuristics to frame IC discussion, not a DCF or formal fairness opinion.
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV031
      - CV001
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: Market and proof score well; economics and valuation support lag.
    data:
      items:
        - label: Market tailwind
          value: high
          detail: AI power bottleneck is real and worsening
        - label: Proof quality
          value: medium-high
          detail: Named deployments and measured outcomes exist
        - label: Moat durability
          value: medium
          detail: Coordination know-how exists, portability less proven
        - label: Economics visibility
          value: low-medium
          detail: No public revenue or margin support
        - label: Risk load
          value: high
          detail: Regulatory economics and concentration matter
        - label: Valuation support
          value: low-medium
          detail: Current round requires significant forward proof
    claimRefs:
      - CV043
      - CV044
      - CV045
      - CV046
      - CV012
      - CV047
