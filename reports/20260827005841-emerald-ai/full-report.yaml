      - number: '1.2'
        title: Founder-Market Fit, Leadership Bench, and Governance
        blocks:
          - type: paragraph
            body: >-
              Emerald’s founder-market fit is unusually strong for an infrastructure-control startup. Varun Sivaram
              combines power-sector operating experience from Orsted and ReNew, policy credibility from U.S. diplomatic
              work, and public thought leadership on energy-system constraints. That background gives Emerald legitimacy
              with regulators and utilities that a pure AI-application founder would likely lack. The early leadership
              bench deepens that fit: Ayse Coskun is one of the best-known academics in flexible computing for grid
              response, Shayan Sengupta brings hyperscale engineering execution from AWS and Intel, and Aroon Vijaykar
              and Mansi Shah add commercial and product leadership rooted in energy and enterprise infrastructure.


              Governance is also notable for how directly it mirrors Emerald’s go-to-market strategy. The board and
              observer list includes Energize, Radical, DCVC, NVentures, Lowercarbon, and Energy Impact
              Partners/Frontier Fund. Advisors span utility, policy, AI, and energy-market circles, from David Rousseau
              at Salt River Project to Jason Bordoff and Gina Raimondo. That network is a strategic advantage because
              Emerald must sell across industry boundaries. It is also a concentration risk, since public materials
              still do not disclose voting control, protective provisions, or the exact economic rights of this
              unusually strategic cap table.
