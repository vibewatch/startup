  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Emerald’s product sits directly in the middle of a regulatory transition. That is good for demand and bad
              for predictability. FERC is forcing grid operators to justify or reform large-load rules, PJM is
              explicitly considering frameworks that make new large loads responsible for bringing capacity or accepting
              earlier curtailment, and utilities across the country are racing to design special tariffs that protect
              existing ratepayers from data-center risk. Those developments validate Emerald’s thesis that flexibility
              matters. They also create a moving target for commercialization because the same policy regime that
              rewards flexibility can also shift collateral obligations, curtailment rights, minimum terms, or
              direct-assignment costs onto customers.


              Emerald’s own legal disclosures reinforce the need for caution. The website terms state that pilots and
              demonstrations are illustrative and condition-specific, that forward-looking statements are inherently
              uncertain, and that the company does not undertake to update public claims. The privacy policy shows
              baseline legal/privacy hygiene, but it is not a substitute for a public trust center, certifications, or
              enterprise assurance artifacts. Meanwhile, the mid-2026 FERC-to-NERC shift toward mandatory
              computational-load standards shows that this part of the regulatory perimeter is hardening quickly. The
              legal risk is therefore less about visible litigation and more about reliance on an evolving tariff regime
              plus limited public compliance proof.
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR008
              - CR009
