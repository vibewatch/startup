      - number: '2.4'
        title: Growth Drivers, Constraints, and Contradictions
        blocks:
          - type: paragraph
            body: >-
              Three forces make the market timely in 2026. First, power scarcity is now a first-order constraint on AI
              infrastructure growth; JLL, CBRE, Bloom, and IEA all converge on that point. Second, regulators and
              utilities are actively building commercial pathways through large-load tariffs, flexible service classes,
              and show-cause proceedings that explicitly contemplate flexible demand. Third, field evidence from
              Phoenix, the UK, and the broader DCFlex ecosystem suggests at least some AI workloads can flex materially
              without shutting down critical service obligations.


              The contradictions matter just as much. Heatmap captures the adverse commercial thesis that flexibility
              only matters if utilities turn it into faster interconnection or meaningful economics. Operator
              conservatism remains high because data centers historically promise near-perfect uptime, and public
              monetization evidence still stops short of revealing recurring contract structures or realized pricing.
              The result is a market with obvious strategic importance and credible technical feasibility, but with
              software revenue capture still mediated by local regulation, utility incentives, and a small number of
              flagship proofs rather than mature category budgets.
