      - number: '2.2'
        title: Sizing Lenses and Boundary-Constrained Opportunity
        blocks:
          - type: paragraph
            body: >-
              Public sources strongly support that the macro problem is large and accelerating, but they do not directly
              yield a clean software TAM. IEA expects U.S. electricity demand to rise nearly 2% annually through 2030,
              with around half of that increase driven by data centers, while Berkeley Lab says U.S. data center demand
              could reach 325-580 TWh by 2028. JLL then adds a supply-side lens: nearly 97 GW of new global capacity
              between 2026 and 2030, supported by a 14% sector CAGR. Bloom, CBRE, and JLL all describe power access—not
              cheap rent or connectivity—as the gating factor.


              That makes GW-based sizing more defensible than software-dollar sizing. The highest-confidence public
              headroom thesis comes from the Duke/CFR framing that roughly 100 GW of U.S. data center demand could
              connect sooner if facilities accept limited curtailment. A practical SAM is smaller because
              commercialization depends on tariffs, utility willingness, and proof that critical workloads survive flex
              events. This chapter therefore preserves three lenses: macro electricity demand, data center supply
              growth, and a constrained 25/50/100 GW flexible-interconnection range rather than pretending public
              evidence discloses Emerald AI’s actual priceable software revenue pool.
            claimRefs:
              - CM001
              - CM003
