      - number: '3.4'
        title: Moat Durability and Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              Emerald’s best moat argument is an integrated proof set: workload-performance data from live events,
              utility-specific operating playbooks, and partner credibility with NVIDIA, National Grid, Silicon Valley
              Power, and the broader DCFlex ecosystem. That is real, but still early. The public record shows stronger
              named pilot proof for Emerald than for many peers, yet it does not show long-term renewals, large
              installed base, or pricing power. In other words, the moat today is more narrative-plus-proof than
              scale-plus-lock-in.


              The adverse cases are straightforward. Utilities may fail to create enough economic value for flexibility,
              compressing the whole category. Incumbent DR or utility-platform vendors may adapt their software toward
              large-load and data-center use cases. Large operators or hyperscalers may internalize the capability. And
              substitute paths such as onsite generation can shrink the pool of buyers willing to accept
              curtailment-based tradeoffs. Until Emerald proves repeatable production adoption, competitive risk is less
              about a single rival and more about category absorption by larger platforms and adjacent substitutes.
            claimRefs:
