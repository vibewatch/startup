  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Category Map
        blocks:
          - type: paragraph
            body: >-
              Emerald AI competes in a market that is still being assembled from adjacent categories rather than a
              stable software segment with clear peer boundaries. The direct job to be done is not generic demand
              response; it is making AI data center load flexible enough to unlock faster power access, respond to grid
              conditions, and preserve critical workloads. That makes Emerald the clearest direct specialist in this
              source set. Most other vendors instead start from one of three adjacent positions: C&I demand-response
              aggregators such as Voltus and CPower; utility-focused flexibility platforms such as Virtual Peaker,
              EnergyHub, Uplight, and Itron; or substitutes such as onsite power, relocation to power-advantaged
              geographies, and embedded landlord or utility solutions.


              This matters because a buyer may solve the same power-constrained problem without ever running a direct
              Emerald vs. Emerald-clone procurement. In many cases the real choice is between specialist orchestration,
              incumbent energy-platform capabilities, bespoke utility contracting, or capital-intensive substitute
              strategies. The competitor table therefore separates direct, adjacent, incumbent, and substitute classes
              rather than pretending every vendor is a head-to-head software peer.
            claimRefs:
