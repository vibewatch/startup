          detail: >-
            Controls reach the cluster through NVIDIA-linked infrastructure, operating-stack integrations, and site
            permissions.
        - label: Layer 6 — Telemetry and verification
          detail: >-
            Power and performance are checked against requested targets and service thresholds for utilities and
            operators.
