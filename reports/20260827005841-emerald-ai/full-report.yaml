      - number: '3.3'
        title: Pricing, Packaging, and Switching Dynamics
        blocks:
          - type: paragraph
            body: >-
              Public pricing transparency is poor across this landscape. Voltus is unusually transparent on the
              demand-response side because it publishes illustrative MW-year earnings opportunities, but even that is
              not a software list price. Most other vendors describe outcomes, partnerships, or solution families
              without revealing contract basis, minimum commitments, implementation fees, or realized economics. As a
              result, the pricing comparison in this chapter is really a packaging comparison: some vendors look like
              revenue-share aggregators, some resemble utility SaaS or program-management stacks, and others bundle
              flexibility into broader energy or infrastructure solutions.


              Switching dynamics are similarly non-binary. Once a data center, utility, and telemetry stack are
              integrated, there are real switching costs in process, risk management, and stakeholder trust. But
              multi-homing is also plausible because Emerald can sit alongside forecasting, utility DR software, or
              onsite-power systems. That makes distribution leverage—especially pre-existing utility and energy-buyer
              relationships—as important as product elegance. Emerald’s risk is that incumbents can meet the buyer
              first, then narrow the perceived gap later.
