evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Revenue, gross margin, burn, and customer-concentration reporting from management or audited statements.
    whyItMatters: >-
      Without operating metrics, investors cannot judge whether Emerald's unicorn valuation is supported by software
      economics or only by strategic narrative.
    diligencePath: >-
      Request a board-approved KPI pack covering ARR/revenue, active customers, gross margin, burn, and booked pipeline
      by cohort.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: material
    topic: governance-rights
    missingEvidence: >-
      A current cap table, board-voting structure, liquidation preferences, and any investor information-rights side
      letters.
    whyItMatters: >-
      Emerald's investor base is unusually strategic, so governance terms could materially affect later financing
      flexibility and customer neutrality.
    diligencePath: Request charter, investor-rights agreement, board-consent schedule, and most recent cap-table waterfall.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: leadership-roster-gaps
    missingEvidence: >-
      A complete executive roster, board committee structure, and named succession plans beyond the five profiled
      leaders.
    whyItMatters: >-
      The leadership table is intentionally partial, so diligence still needs fuller coverage of governance and
      operating continuity.
    diligencePath: Request a current org chart, board deck, and executive biographies packet.
    relatedQuestionRefs:
      - QO013
      - QO014
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: milestone-chronology-gaps
    missingEvidence: >-
      Exact publication dates and commercial status changes for the seed extension, UK trial, and intermediate
      deployments.
    whyItMatters: >-
      The milestone table is a partial chronology, and precision matters for linking financing to technical and
      commercial progress.
    diligencePath: Request a management chronology with dated pilot starts, customer go-lives, and financing close dates.
    relatedQuestionRefs:
      - QO011
      - QO017
      - QO019
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: software-pricing
    missingEvidence: >-
      Contract pricing basis, recurring fee structure, utility cost-sharing, and performance-payment mechanics for
      Emerald AI deployments.
    whyItMatters: >-
      Without contract structure, a credible software-dollar TAM/SAM/SOM cannot be derived from public GW or TWh
      evidence.
    diligencePath: Request executed pilot contracts, pricing sheets, and any utility or customer settlement examples.
    relatedQuestionRefs:
      - QM010
      - QM024
  - type: missing-source
    severity: material
    topic: buyer-denominators
    missingEvidence: >-
      A disclosed count of active utility pathways, paying customers, and commercial deployments beyond named demos or
      pilots.
    whyItMatters: >-
      The chapter can identify the buyer map, but public evidence does not reveal how many buyers have progressed from
      pilot to paying rollout.
    diligencePath: Request pipeline segmentation by buyer type, stage, and contract status.
    relatedQuestionRefs:
      - QM011
      - QM015
      - QM025
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: market-sizing-methodology
    missingEvidence: >-
      Comparable third-party estimates that convert the flexibility opportunity into a standardized software revenue
      pool.
    whyItMatters: >-
