- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Repeat paid deployments, broader portability, strong tariff economics, 2028 revenue ~160-240M
    - 10-12x sales => ~1.6-2.9B; supports upside from current round
    - Still depends on concentration and execution
    - Possible but needs multiple things to go right
  - - Base
    - Commercialization continues but revenue scales more slowly, 2028 revenue ~70-110M
    - 6-8x sales => ~420-880M; current round looks full to rich
    - Value capture and disclosure remain incomplete
    - Most plausible on public evidence
  - - Bear
    - Value capture weak, concentration high, revenue ~20-45M by 2028
    - 3-5x sales => ~60-225M; large downside from current round
    - Tariff economics or portability fail
    - Real if early proof does not compound
  - - Entry-discipline overlay
    - Current round needs upper-base or bull-style outcome
    - Without better disclosure, upside is option-like not underwritten
    - Preference stack could worsen returns further
    - Current price demands more evidence
  - - Weighted view
    - Public evidence skews below round without a major de-risking event
    - Probability-weighted value is below 1.05B
    - Disclosure and concentration are the main swing factors
    - Supports track rather than buy
  notes: Scenario ranges are heuristic public-evidence brackets, not management forecasts.
