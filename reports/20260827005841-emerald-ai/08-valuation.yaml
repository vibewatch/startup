- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Equinix
    - 2025 revenue ~9.22B; market cap ~106.5B
    - ~10.8x P/S
    - Premium digital infrastructure / data-center platform
    - Much more mature and diversified
  - - Digital Realty
    - 2025 revenue ~6.11B; market cap ~73.1B
    - ~10.8x P/S
    - Data-center landlord / interconnection and power-access comp
    - REIT economics differ from software control layer
  - - Vertiv
    - 2025 revenue ~10.23B; market cap ~101.6B
    - ~8.8x P/S
    - AI power / thermal / infrastructure beneficiary comp
    - Hardware and services exposure differ from Emerald
  - - Bloom Energy
    - 2025 revenue ~2.02B; market cap ~64.3B
    - ~20.6x P/S
    - Power-bottleneck beneficiary with strategic narrative premium
    - Hardware / project profile and lawsuit noise differ
  - - Eaton
    - 2025 revenue ~27.45B; market cap ~162.9B
    - ~5.4x P/S
    - Adjacent electrification and power-infrastructure comp
    - Large diversified incumbent, not a venture-stage specialist
  notes: These comps are used to frame future supportable ranges, not to claim direct comparability today.
  enumerationScope:
