  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Revenue, ARR, ACV, renewal, gross margin, services mix, burn, and runway are not public.
    whyItMatters: Without these inputs, the valuation case is necessarily option-like and probability-weighted rather than fully underwritten.
    diligencePath: Request full finance pack covering revenue quality, margin structure, and runway.
