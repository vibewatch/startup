- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Support
  - What would change the view
  rows:
  - - Power bottleneck is real and worsening
    - Berkeley Lab, CFR, and PJM-related sources all point to power as a gating factor for AI expansion
    - If power scarcity eases faster than expected, urgency and pricing power fall
  - - Emerald has better-than-usual early proof
    - Named utility and flagship deployment evidence exists
    - Need proof that pilots become recurring paid programs
  - - Speed-to-power can justify premium software value
    - Avoiding delay can matter more than ordinary software ROI
    - Need disclosed contracts to confirm value capture
  - - Flexible-load economics may stay thin
    - Utilities and customers may not share enough value
    - Would improve if tariff-linked customer economics are disclosed
  - - Current valuation outruns public economics
    - No public revenue, margin, or runway support is available
    - Would improve with real financial disclosure or lower entry price
  - - Ecosystem concentration is unresolved
    - NVIDIA-linked and utility-linked concentration remains visible
    - Would improve with broader portability and independent demand
  notes: Arguments are framed to show which evidence would actually move the recommendation.
