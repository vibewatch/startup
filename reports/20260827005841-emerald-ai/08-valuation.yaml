- id: comps-and-scenarios
  title: Comparable Analysis and Scenario Framework
  body: >-
    The public comp set says two useful things at once. First, the AI-power and digital-infrastructure ecosystem can support healthy valuation multiples: Bloom, Equinix, Digital Realty, Vertiv, and Eaton all trade at meaningful sales multiples because investors reward scarce infrastructure, electrification exposure, and AI-adjacent growth. Second, those businesses disclose billions in revenue and much richer operating history than Emerald does. The relevant lesson is not that Emerald should trade at their average multiple today; it is that these multiples provide a ceiling and a language for thinking about future support if Emerald executes.


    That leads naturally to a scenario approach. The bull case assumes Emerald becomes a repeatable control layer across multiple sites and customer types, earning a premium multiple and scaling toward the high hundreds of millions in implied value or more. The base case assumes the company commercializes successfully but more slowly, leaving the current round roughly full to stretched. The bear case assumes strategic importance does not translate into broad value capture, causing the current price to prove too rich. On public evidence alone, the weighted outcome sits below the current round, which is why the recommendation stops at track rather than buy.
