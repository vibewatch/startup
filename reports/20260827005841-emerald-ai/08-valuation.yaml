- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Tariff economics fail
    - Flexible-load programs offer weak customer value or onerous curtailment / collateral
    - Undercuts willingness to pay and slows conversion
    - Move toward avoid unless pricing resets
  - - Repeat deployment proof stalls
    - No credible repeat paid multi-site programs emerge
    - Weakens bull and base commercialization assumptions
    - Cut forward multiple support
  - - Concentration too high
    - One or two sites / partners dominate expected ARR
    - Compresses quality of revenue and exit attractiveness
    - Demand concentration disclosure before investing
  - - Financial access remains blocked
    - No revenue / margin / runway access in diligence
    - Confidence should fall even if thesis remains exciting
    - Do not underwrite current round
  - - Security or reliability incident
    - Material customer-visible failure tied to control layer
    - Damages trust and premium multiple support
    - Escalate to avoid pending review
  - - Portability remains narrow
    - No non-core ecosystem proof
    - Moat looks weaker and channel dependence stronger
    - Lower valuation tolerance
  notes: The table is built to support go/no-go decisions rather than descriptive storytelling.
  claimRefs:
  - CV035
  - CV032
  - CV033
  - CV034
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Contracts
    - ACV, term, pricing basis, renewal rights by major account
    - Fastest way to test revenue quality
    - Request top-customer contract set
  - - Margins
    - Gross margin, services mix, implementation burden
    - Separates software economics from services drag
    - Request contract-type P&L view
  - - Cap table
    - Preference stack, seniority, liquidation terms, secondaries
    - Needed for real return math
    - Request full capitalization table
  - - Concentration
    - ARR and pipeline by site, utility, and partner channel
    - Tests whether narrative is broader than a few flagships
    - Request concentration schedule
  - - Runway
    - Cash, burn, hiring plan, scenario runway
    - Tests whether timing pressure exists before de-risking
    - Request board or finance plan
  - - Portability
    - Non-NVIDIA, non-core-utility commercial proofs
    - Tests whether ecosystem dependence is transitional
    - Request deployment roadmap and signed proofs
  notes: These asks are prioritized by how quickly they can change the recommendation or valuation stance.
