- id: decision-and-diligence
  title: Decision, Triggers, and Final Diligence Asks
  body: >-
    The investment committee message should be straightforward: Emerald belongs on the track list, not in the avoid pile, but the current valuation deserves discipline. The company has enough external validation that investors should keep working the file. It does not have enough public financial disclosure to justify a high-conviction buy at the present round. That distinction matters. Many good private companies become bad investments when valuation outruns proof, and Emerald is close to that line today.


    What would change the view? Positive re-rating triggers include disclosed contract values, evidence of repeat paid deployments, broader portability beyond the current ecosystem, and clearer margin or runway support. Negative triggers include weak tariff economics, high concentration, missing financial access, or a security / reliability event. The best next step is not a philosophical debate about AI and power; it is targeted diligence on contracts, cap table, margins, concentration, and cash runway. If that diligence clears, Emerald could justify a richer stance. If it does not, the right answer remains patience.
