              satellite connectivity, IoT, drones, and emergency communications use cases. Public sources mention R&D
              centers in Shanghai, Nanjing, and Chengdu, indicating a multi-site Chinese engineering footprint.
              CygnuSemi was described as a national high-tech enterprise and a specialized “little giant” style
              advanced-manufacturing player in multiple 2026 profiles.
