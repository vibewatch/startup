      - number: '3.3'
        title: Pricing, packaging and moat durability
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence is thin across the entire category, which itself is revealing. Satellite
              capability is often embedded inside broader modem or connectivity platforms, making price comparison hard
              and favoring incumbents that can bundle features. That suggests CygnuSemi is unlikely to win purely on
              transparent list pricing. Its current moat is better understood as specialization, local ecosystem fit and
              policy alignment rather than a visible global distribution or patent moat. This can matter in
              China-specific procurement settings, but it also means the moat could erode if larger vendors close the
              localization gap or if device OEMs prioritize breadth and proven global deployment over specialization. A
              disciplined diligence view should therefore separate technical credibility from durable pricing power. The
              open underwriting question is whether localization becomes lasting margin defense rather than just an
              entry wedge. If it cannot, larger portfolios are likely to dominate procurement. That risk is central to
              valuation over time for investors today.
            claimRefs:
