        title: Severity-ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The highest-severity public risks are not random operational glitches; they cluster around structural
              dependencies. CygnuSemi sits inside a politically sensitive Chinese semiconductor and
              satellite-connectivity category, which exposes it to export-control, geopolitical and dual-use scrutiny.
              At the same time, the commercialization path depends on carriers, device partners, network readiness and
              software-platform support outside the company’s direct control. Financial opacity amplifies all of this
              because investors cannot easily quantify how much time or capital the company has to absorb delays. The
              result is a risk picture in which upside can be large but where a few external shocks could
              disproportionately affect execution and fundraising. The chapter therefore emphasizes structural exposure
              rather than day-to-day operating noise, because those structural risks are the ones most likely to change
              valuation and financing outcomes. Investors should watch this area closely as new evidence emerges. That
              asymmetry is why risk discipline must stay central. Especially for valuation discipline. At this stage.
