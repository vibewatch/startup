        title: Exhibits
        blocks:
          - type: callout
            title: CygnuSemi’s edge is focus, not breadth
            body: >-
              The company’s best public competitive argument is China-specific NTN focus backed by certification and
              partnerships. The main counterargument is that larger modem incumbents can bundle similar capabilities
              faster and at greater scale.
