  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitor set and category logic
        blocks:
          - type: paragraph
            body: >-
              CygnuSemi competes first against connectivity-silicon vendors, not against satellite-network operators
              directly. Qualcomm and MediaTek matter because they can integrate NTN features into broad modem roadmaps
              for global handset OEMs. UNISOC and HiSilicon matter because they represent China-aligned connectivity
              alternatives with deeper existing relationships. Samsung matters as a vertically integrated feature owner
              that can shape device expectations. By contrast, AST, Starlink and Skylo are best viewed as ecosystem
              powers or substitutes that expand and structure service availability while also influencing how much value
              remains at the chip layer. This framing is important because it separates merchant-silicon competition
              from downstream service leverage and helps keep the competitor table focused on who can displace CygnuSemi
              in a design win. It also avoids mistaking ecosystem excitement for company-specific competitive
              insulation. In other words, some players create demand for NTN-capable chips while others directly fight
              for the silicon socket.
            claimRefs:
              - CP001
