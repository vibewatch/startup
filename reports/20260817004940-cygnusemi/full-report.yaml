      - number: '1.3'
        title: Funding history, valuation, and capitalization
        blocks:
          - type: paragraph
            body: >-
              The February 2026 financing package was described as multiple strategic rounds totaling roughly RMB1.5
              billion. Named February 2026 investors included policy and market funds such as Ceyuan Capital, Hengqin
              Deep Cooperation Investment, Chengdu Sci-Tech Investment, Fujian Industrial Investment, Lucion Venture
              Capital, and CICC Capital-affiliated funds. The July 2026 financing announcement introduced additional
              investors including Xinhuan Investment, Zizhifang Venture Capital, Full Truck Alliance, Xinhuanet Venture
              Capital, Tongding Group, Boqing Capital, and Shengrong Capital. Crunchbase News characterized CygnuSemi as
              having raised an undisclosed amount in July 2026 after a $216 million Series C earlier in the year. The
              July 2026 evidence set supports a unicorn-level valuation around $1.5 billion, which is directionally
              consistent with Chinese reporting that the company crossed RMB10 billion valuation. Public sources
              describe 2026 as the company’s third disclosed financing within the year, implying unusually rapid capital
              formation for a six-year-old chip startup. The public record does not support a clean cumulative funding
              total because database-style estimates and Chinese round-by-round reporting are not fully reconcilable.
              Third-party databases such as CB Insights present CygnuSemi as a venture-backed chip company with a
              material but not fully transparent cumulative funding history. Another cautionary signal is that
              cumulative funding figures and post-money history are not fully standardized across databases and Chinese
              media, which raises diligence burden before underwriting. By July 2026 CygnuSemi had enough strategic
              visibility to be cited internationally as a new semiconductor unicorn, but still not enough disclosure to
              underwrite it like a public-chip issuer.
