companyProfile:
  summary: >-
    CygnuSemi is a private Shanghai-based fabless communications-chip company focused on satellite-terrestrial
    integrated connectivity. Public evidence places its founding in October 2020 and ties the company to a product
    strategy spanning NTN, 5G RedCap, automotive, and industrial IoT connectivity. The company has real strategic
    relevance: Chinese and international sources describe it as a domestic specialist in 5G NR NTN baseband, while 2026
    public financing and customer-proof milestones show meaningful ecosystem support. The central underwriting gap is
    not whether the company is real; it is whether private revenue quality, shipment scale, customer breadth, and margin
    profile justify the reported unicorn valuation.
