  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction gaps
        blocks:
          - type: paragraph
            body: >-
              CygnuSemi’s most plausible revenue model is B2B semiconductor commercialization rather than recurring
              software subscriptions. Public product and partnership materials point toward revenue streams from
              baseband chip sales, reference designs, qualification support and partner-linked device programs across
              NTN phone, automotive, IoT and RedCap-adjacent categories. That makes revenue recognition more likely to
              follow design wins, module deliveries and shipment events than any SaaS-style monthly meter. The problem
              for diligence is that public evidence still does not disclose revenue, ARR, bookings, customer count or
              shipment volume. As a result, the chapter can sketch the revenue bridge logically but cannot attach a
              validated top-line scale. Public traction evidence is strongest in certification, standards and partner
              milestones, not in monetization data. The available evidence therefore supports process logic and segment
              framing, but not a revenue base that can be reconciled to valuation or burn with confidence.
            claimRefs:
