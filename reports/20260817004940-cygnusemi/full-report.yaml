  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis, anti-thesis and price discipline
        blocks:
          - type: paragraph
            body: >-
              CygnuSemi has a real thesis: it is operating in a strategic domestic niche at the intersection of NTN, 6G
              and connectivity silicon, and it has public proof that goes beyond a concept slide. The company is one of
              few Chinese fabless semiconductor firms with documented progress on baseband chips specifically designed
              for 6G satellite communications — a segment that is strategically important to Chinese state telecoms and
              defense-adjacent operators alike. Completed deployments reported in connection with Tiantong satellite
              network integration provide corroborating evidence that the product is real. The anti-thesis is equally
              real: commercialization evidence remains far thinner than the valuation headline, and the company still
              faces policy, partner and competitive risks that are difficult to price with confidence. The July 2026
              financing context places the company at approximately $1.5 billion, which implies material confidence from
              sophisticated capital — but that should not be confused with independent evidence of unit economics or
              customer breadth. That means the valuation discussion cannot be separated from evidence quality. A strong
              company in a strategic category can still be a weak investment if the entry price assumes proof that the
              public record does not yet provide. The right starting point is therefore price discipline rather than
              narrative enthusiasm. Investors should demand that story and price converge before moving to conviction.
              Evidence that would close the gap includes: named revenue-generating customers beyond a handful of Chinese
              state operators, gross-margin data sufficient to benchmark against fabless peers, and a cap table that
              clarifies the preference structure introduced by the most recent round. The central valuation mistake
              would be to assume that strategic importance automatically equals acceptable entry price.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
