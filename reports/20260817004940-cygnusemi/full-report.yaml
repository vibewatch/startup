        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              CygnuSemi should be understood as a device-side connectivity and baseband enabler, not as a satellite
              service operator. Public materials position it around satellite-terrestrial integrated communications,
              with visible emphasis on NTN, RedCap and multiple terminal scenarios such as phones, automotive and IoT.
              That suggests a module map centered on baseband capability, protocol support, terminal integration and
              commercialization support across several product lines rather than one narrow demo program. The product
              story is therefore strongest when framed in customer workflow terms: a downstream device maker or
              ecosystem partner needs a chip and integration path that makes non-terrestrial connectivity commercially
              usable. That framing matters because customer value is realized only when a device or module partner can
              actually ship an integrated solution, not when a lab milestone is announced. The public module map is
