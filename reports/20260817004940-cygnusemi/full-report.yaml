  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what counts
        blocks:
          - type: paragraph
            body: >-
              CygnuSemi should not be analyzed as a generic satellite company or as a proxy for the whole 6G ecosystem.
              Its relevant market is the semiconductor and connectivity layer that enables non-terrestrial network
              access across smartphones, automotive systems, IoT modules and specialized terminals. That definition
              deliberately excludes launch, spacecraft manufacturing, and most service revenue earned by operators or
              satellite-network owners. The distinction matters because broad satellite and AI market estimates make the
              category look enormous while saying very little about what a Chinese baseband supplier can actually win.
              For diligence, the right boundary is the subset of device and module programs where NTN capability becomes
              a purchased chip feature and where local supplier substitution matters. In practice, that means following
              design cycles, certification paths, reference platforms and procurement flows rather than treating all
              satellite-industry growth as relevant revenue.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM019
              - CM020
