      - number: '3.2'
        title: Breadth, scale and readiness
        blocks:
          - type: paragraph
            body: >-
              Qualcomm appears to hold the strongest overall public position because it combines NTN roadmap breadth,
              major OEM relationships and public scale proxies that dwarf CygnuSemi. MediaTek is the closest global
              merchant challenger in practical smartphone relevance and has shown live NR-NTN proof. UNISOC and
              HiSilicon deepen domestic pressure because they already sit inside broader connectivity procurement
              conversations. CygnuSemi does have meaningful public proof: certification with China Unicom, a ZTE
              strategic partnership, and repeated product positioning around direct-to-phone, automotive and IoT use
              cases. Still, those signals demonstrate readiness more than commercial share. The core competitive
              trade-off is focus and localization versus breadth and incumbency. Capability evidence should therefore be
              read as a readiness map, not as proof of won share. The strongest argument for CygnuSemi is not absolute
              breadth but fit with specific domestic priorities and partner programs.
