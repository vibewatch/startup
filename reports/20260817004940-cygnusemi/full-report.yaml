      - number: '2.4'
        title: Constraints and evidence gaps
        blocks:
          - type: paragraph
            body: >-
              The biggest market risk is not whether NTN matters strategically, but whether ecosystem excitement
              converts into supplier economics fast enough. Spectrum-sharing rules, hybrid-network regulation,
              constellation-capacity timelines and segment-specific procurement cycles can all slow rollout even when
              radio technology works. Public sources also do not provide robust attach rates, chip ASPs or contracted
              volumes for CygnuSemi’s target categories, which blocks a disciplined bottoms-up market model. That means
              the public record supports a positive market-direction view but not a fully underwritten revenue
              opportunity. Investors should treat top-down market excitement as necessary but insufficient evidence
              until management can show design-win counts, target bill-of-material position, qualification status,
              expected shipment ramps and the segments most likely to convert from pilots into recurring demand. Until
              then, the chapter supports directionally positive demand but only medium confidence in the pace of
              chip-market conversion. A useful diligence test is whether management can connect each priority segment to
              a concrete qualification path, expected launch partner, initial volume expectation and fallback plan if
              constellation capacity or regulation slips.
