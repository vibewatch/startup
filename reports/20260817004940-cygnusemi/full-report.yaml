      - number: '2.2'
        title: Demand drivers and timing
        blocks:
          - type: paragraph
            body: >-
              The market backdrop is increasingly favorable. Chinese policy sources show continued backing for 6G
              experimentation, terrestrial-satellite integration and formal working structures around satellite
              internet. That domestic policy direction aligns with global ecosystem evidence: GSMA reports dozens of
              operators publicly engaged in satellite partnerships, and GSMA/ESA are funding NTN-related projects. At
              the technical layer, the most important signal is that standards-based handset NTN is no longer
              theoretical. Ericsson, Qualcomm and Thales demonstrated a live 5G NTN smartphone call; Qualcomm and
              MediaTek both publicized Release 19 or NR-NTN modem progress; Samsung is exposing satellite features in
              user-facing products; and operators such as Starlink and AST are building the network side. Together these
              signals suggest the market is early but moving from ecosystem proof toward constrained commercialization.
              For CygnuSemi, the implication is that demand timing is increasingly gated by execution and capacity
              rather than by the absence of standards work.
