            body: >-
              上海星思半导体股份有限公司 is the full Chinese legal name associated with the CygnuSemi brand. Public company and
              encyclopedia sources place CygnuSemi’s founding in October 2020. Public sources place the company
              headquarters in Shanghai, with the primary hub in Pudong / Zhangjiang. CygnuSemi positions itself as a
              fabless communications-chip company focused on 5G/6G baseband and satellite-terrestrial integrated
              connectivity. The product scope publicly spans 5G eMBB, 5G RedCap, and NTN / satellite baseband platforms
              rather than a single modem SKU. Public product disclosures include the CS6810 5G eMBB baseband platform,
