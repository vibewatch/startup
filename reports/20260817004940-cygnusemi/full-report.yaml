      - number: '1.4'
        title: Milestones, scale signals, and public gaps
        blocks:
          - type: paragraph
            body: >-
              Public milestone reporting says the company supported a 2025 in-orbit test that enabled a
              phone-to-satellite HD video call based on 3GPP 5G NTN. The company publicly positions itself as a
              participant in 6G star-ground integration standards activity rather than only a product supplier. Baidu
              Baike reports a 2024 net loss of roughly RMB337 million and a 2025 first-half net loss of roughly RMB141
              million. Those loss figures imply that CygnuSemi remained in an investment-heavy commercialization phase
              through 2025. The reviewed public record does not disclose revenue or ARR. The reviewed public record does
              not disclose a reliable companywide headcount, despite some third-party pages showing implausible numbers.
              The reviewed public record does not disclose a customer count. 5G RedCap certification milestones with
              China Unicom and national certifications create harder commercial proof than the company’s
              still-undisclosed revenue base. The chapter’s bottom line is that CygnuSemi’s public profile is strong on
              technical proof and strategic financing, but still weak on hard commercial metrics. MERICS also frames
              China’s satellite internet push as a dual-use geopolitical program, which means CygnuSemi operates in a
              sector where procurement support and external policy backlash can rise at the same time.
