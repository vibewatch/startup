      - number: '2.3'
        title: Buyers, segments and capture logic
        blocks:
          - type: paragraph
            body: >-
              CygnuSemi’s SAM is heterogeneous by segment, and that heterogeneity should shape underwriting. Smartphones
              probably represent the largest eventual unit volumes, but automotive, industrial IoT, public-safety and
              operator-linked connectivity programs may provide earlier or more defensible revenue because they solve
              resilience and coverage problems with clearer institutional buyers. End users are rarely the direct
              payers. Budgets sit with handset OEMs, operators, module vendors, auto suppliers and public-sector
              integrators, so market conversion should be modeled as B2B design wins rather than consumer adoption
              alone. The most defensible sizing logic therefore moves from broad ecosystem activity to technology-ready
              segments, then to China-priority programs, and only then to CygnuSemi-specific capture based on
              qualification progress and customer wins. This is why segment ranking matters more than a single blended
              penetration assumption. It also means diligence should ask which segments can qualify fastest under
              domestic procurement rules and which ones demand multi-year ecosystem coordination before silicon volumes
              appear.
