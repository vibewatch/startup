companyProfile:
  summary: >-
    CygnuSemi is a private Shanghai-based fabless communications-chip company focused on satellite-terrestrial
    integrated connectivity. Public evidence places its founding in October 2020 and ties the company to a product
    strategy spanning NTN, 5G RedCap, automotive, and industrial IoT connectivity. The company has real strategic
    relevance: Chinese and international sources describe it as a domestic specialist in 5G NR NTN baseband, while
    2026 public financing and customer-proof milestones show meaningful ecosystem support. The central underwriting
    gap is not whether the company is real; it is whether private revenue quality, shipment scale, customer breadth,
    and margin profile justify the reported unicorn valuation.
  foundedDate: '2020-10-01'
  founders:
    - name: Xia Lusheng
      role: Chairman / CEO
      claimRefs: [CO006]
    - name: Lin Qing
      role: CTO / founding technical leader
      claimRefs: [CO007]
  foundingLocation: Shanghai, China
  headquarters: Shanghai, China
  productSummary: >-
    CygnuSemi sells device-side connectivity and baseband technology for satellite-mobile integration, with public
    product signals across NTN phone connectivity, 5G RedCap, automotive, and industrial IoT scenarios.
  customerFocus: >-
    Telecom operators, telecom-equipment partners, device OEMs, module vendors, and industrial or public-sector
    integrators seeking satellite-mobile connectivity capabilities.
  businessModel: >-
    Fabless semiconductor model centered on design wins, qualification, chip or reference-design commercialization,
    and partner-driven deployments rather than direct end-user services.
  stage: growth-stage private / strategic-financing stage
  fundingStatus: >-
