  topStrengths:
    - Public financing momentum and unicorn-status reporting signal strong strategic investor interest in the category.
    - 'Product proof is better than concept-stage: China Unicom certification, ZTE partnership, and NTN milestone coverage support technical credibility.'
    - The company sits in a strategically important domestic niche where local ecosystem alignment may matter.
  topRisks:
