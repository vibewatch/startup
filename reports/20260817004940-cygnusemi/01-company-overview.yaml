- id: founders-and-governance
  title: Founders, leadership, and governance depth
  body: Xia Lusheng is publicly identified as legal representative, chairman, and CEO. Lin Qing is publicly identified as CTO and publicly presented by the company as a founding leader. The core team is repeatedly described as drawn from large communications-chip backgrounds such as Huawei, Qualcomm, and Intel. Public leadership disclosure is thinner beyond the chairman/CEO, CTO, and a small number of named directors, which increases key-person dependence. The public record indicates the company had already progressed from lab tests in 2023 to field tests in 2024 and in-orbit validation in 2025. A cautionary signal in the public record is that much of the commercialization story relies on certification, pilot validation, and investor-backed narratives rather than disclosed shipment, revenue, or customer metrics. The public record is therefore good enough to identify operating leaders, but still thin on board structure, committees, and formal control rights.
  claimRefs:
