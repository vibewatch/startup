company:
  name: CygnuSemi
chapter:
  number: 1
  title: Company Overview
  summary: 'CygnuSemi entered 2026 with unusually strong technical and financing momentum for a Chinese communications-chip startup: public reporting ties the company to in-orbit 5G NTN validation, a strategic ZTE partnership, and unicorn-threshold financing. The same evidence set is also materially incomplete on revenue, customer count, governance depth, and fully reconciled cumulative funding, so the company can be established as strategically important without yet being treated as fundamentally transparent.'
sections:
- id: identity-and-business-model
  title: Identity, positioning, and business model
  body: 上海星思半导体股份有限公司 is the full Chinese legal name associated with the CygnuSemi brand. Public company and encyclopedia sources place CygnuSemi’s founding in October 2020. Public sources place the company headquarters in Shanghai, with the primary hub in Pudong / Zhangjiang. CygnuSemi positions itself as a fabless communications-chip company focused on 5G/6G baseband and satellite-terrestrial integrated connectivity. The product scope publicly spans 5G eMBB, 5G RedCap, and NTN / satellite baseband platforms rather than a single modem SKU. Public product disclosures include the CS6810 5G eMBB baseband platform, the CS6610 RedCap platform, and the CS7620 / CS7610 satellite-oriented platforms. CygnuSemi’s public materials and coverage portray the company as working across direct-to-phone satellite, automotive satellite connectivity, IoT, drones, and emergency communications use cases. Public sources mention R&D centers in Shanghai, Nanjing, and Chengdu, indicating a multi-site Chinese engineering
    footprint. CygnuSemi was described as a national high-tech enterprise and a specialized “little giant” style advanced-manufacturing player in multiple 2026 profiles.
