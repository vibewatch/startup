callouts:
- calloutType: strength
  title: Technical proof moved beyond lab-only narrative
  body: CygnuSemi’s public story is more than a concept pitch because it includes chip tape-out, certification, and in-orbit phone-to-satellite validation milestones. That does not prove revenue scale, but it does prove the company has crossed several technical credibility thresholds that many early deep-tech stories never reach.
  claimRefs:
  - CO018
  - CO021
  - CO031
  - CO032
- calloutType: risk
  title: Capital visibility is better than commercial visibility
  body: The financing narrative is strong, but revenue, ARR, customer count, and headcount remain undisclosed or inconsistent in public sources. That asymmetry pushes diligence toward customer proof, gross-margin structure, and cap-table reconciliation before any valuation view should be treated as durable.
  claimRefs:
