evidenceGaps:
  - type: missing-source
    severity: material
    topic: customer-count
    missingEvidence: A disclosed active-customer or shipped-device metric from management or an investor deck.
    whyItMatters: Customer concentration and commercial adoption cannot be underwritten without a real denominator.
    diligencePath: Request a board deck or financing memo with customer-count, shipment, and cohort metrics.
    relatedQuestionRefs:
      - QO019
      - QO018
  - type: missing-source
    severity: material
    topic: revenue
    missingEvidence: A disclosed revenue or ARR range plus gross-margin disclosure.
    whyItMatters: The company is already being priced on strategic scarcity, so revenue opacity materially limits valuation work.
    diligencePath: Obtain financing materials or audited management accounts covering 2024-2026 performance.
    relatedQuestionRefs:
      - QO017
  - type: conflicting-data
    severity: material
    topic: cumulative-funding
    missingEvidence: A board-approved cap-table or official financing chronology that reconciles USD and RMB reporting.
    whyItMatters: Public databases and Chinese coverage do not reconcile cumulative capital with enough precision for underwriting.
    diligencePath: Ask management to provide a round-by-round cap table with currency normalization.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
      - TO004
  - type: private-evidence-only
    severity: minor
    topic: governance-depth
    missingEvidence: A current board list and committee structure.
    whyItMatters: Key-person and control risk remain partially inferred until governance depth is verified.
    diligencePath: Collect current board materials or updated registration extracts.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: buyer-level-market-model
    missingEvidence: >-
      Segment-level design-win counts, program timing and customer budgets across handset, auto and industrial
      categories.
    whyItMatters: >-
      A market can be strategically attractive yet still monetize slowly if buyers do not convert pilots into
      procurement programs.
    diligencePath: Request management pipeline by buyer segment, design-win stage and expected commercialization quarter.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: material
    topic: chip-asp-and-attach-rate
    missingEvidence: Reliable public attach-rate, chipset ASP or signed-volume data for NTN-capable baseband programs.
    whyItMatters: >-
      Without ASP and attach-rate evidence, public sources cannot convert ecosystem demand into a defensible
      company-specific revenue model.
    diligencePath: Obtain internal pricing sheets, target BOM positions and shipment assumptions from management or investors.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Customer-specific ASP, discounting and contract structure across CygnuSemi and competitor design wins.
    whyItMatters: Competitive intensity cannot be translated into margin risk without actual pricing and packaging evidence.
    diligencePath: Request deal-level pricing and gross-margin assumptions by segment and compare against incumbent alternatives.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: production-share
    missingEvidence: Verified production volumes, repeat wins and deployment share for CygnuSemi relative to larger incumbents.
    whyItMatters: Readiness proof can look strong even when commercial share remains minimal.
    diligencePath: Request shipment, renewal, repeat-design and active-program metrics by customer segment.
    relatedQuestionRefs:
      - QP024
  - type: missing-source
    severity: material
    topic: revenue-and-margin
    missingEvidence: Revenue run-rate, gross margin, realized ASP and shipment scale by product family.
    whyItMatters: >-
      Without revenue and margin visibility, investors cannot judge quality of growth or convert valuation headlines
      into fundamentals.
    diligencePath: Request monthly revenue bridge, shipment history, realized ASP and gross margin by product line.
    relatedQuestionRefs:
      - QI004
      - QI011
      - QI005
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: Cash balance, monthly burn, debt obligations and board-approved runway plan.
    whyItMatters: Fresh financing improves confidence but does not prove capital adequacy without a runway model.
    diligencePath: Obtain latest management accounts, cash-flow statement and financing plan.
