chapter:
  number: 6
  title: Customers
summary: CygnuSemi’s public customer evidence is real but narrow. China Unicom certification and ZTE partnership proof show ecosystem access and qualification progress, yet the record still lacks customer-count, retention, concentration and production-volume disclosure, so the customer case supports further diligence rather than a fully de-risked commercialization conclusion.
sections:
- id: segmentation-and-buyer-logic
  title: Customer segmentation and buyer logic
  body: 'CygnuSemi’s customer base should be modeled around operators, telecom-equipment partners, device OEMs, module vendors and industrial or public-sector integrators rather than around end consumers. The user may be a phone subscriber, a fleet operator or an industrial asset manager, but the payer is more likely an operator, OEM, partner or project budget owner. Public product and market materials also suggest that telecom-linked scenarios remain the clearest early wedge, while automotive and industrial opportunities are more a medium-term expansion narrative. This segmentation matters because customer quality in this category depends heavily on which institutions are actually qualifying and procuring the technology. The segmentation lens also highlights why public customer analysis for a chip company is harder than for an application startup: the commercial buyer, technical evaluator and end user can all be different entities. Investors should keep separating access proof from revenue
    proof because the two are not yet the same thing here.'
  claimRefs:
  - CU001
  - CU002
  - CU008
  - CU009
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-proof-and-adoption-trajectory
  title: Named proof and adoption trajectory
  body: 'The strongest public customer-style proof is concentrated in China Unicom certification and ZTE partnership evidence. Those are meaningful because they show the company is interacting with real ecosystem gatekeepers rather than only publishing self-referential product claims. At the same time, they are better interpreted as qualification and channel proof than as confirmed recurring production revenue. Public milestones do show a progression from standards positioning to partnership, certification and live validation, which creates a visible adoption trajectory. But the trajectory still stops short of broad public deployment metrics. Outcome specificity remains low: the sources rarely quantify shipment counts, user counts or contract values, so maturity must be judged conservatively. That mismatch between proof quality and revenue visibility is the central reason the chapter remains only medium confidence despite credible named references. Investors should keep separating access
    proof from revenue proof because the two are not yet the same thing here.'
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU010
  - CU018
  - CU019
  - CU033
  tableRefs:
  - TU002
  - TU003
  figureRefs:
  - FU002
  - FU003
- id: retention-expansion-and-concentration
  title: Retention, expansion and concentration
  body: The biggest customer diligence gap is durability. The reviewed public sources do not disclose renewal, repeat usage, NRR, GRR, churn, customer count or concentration. That absence matters because a sparse but prestigious proof set can coexist with high dependence on a small number of relationships. Public evidence also suggests that expansion into automotive, industrial and other sectors remains more aspirational than customer-specific. In other words, CygnuSemi may have ecosystem access and technical credibility, but investors still cannot tell whether that access is broad, sticky or economically diversified. The right current stance is to view expansion as plausible and concentration risk as unresolved. The absence of concentration data is especially important because a company at this stage can look commercially promising while still depending on only a handful of active programs. Investors should keep separating access proof from revenue proof because the two are not yet the
    same thing here.
  claimRefs:
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU030
  tableRefs:
  - TU004
  - TU005
  figureRefs:
  - FU004
- id: customers-verdict
  title: Customers verdict
  body: The customer verdict is cautiously positive on access and cautiously negative on disclosure. CygnuSemi clearly has more public ecosystem proof than a purely conceptual startup, and the recency of the 2026 proof set makes the chapter relevant. But the visible proof still says much more about qualification-stage access than about breadth, retention or concentration resilience. Investors should therefore ask for customer-by-customer deployment status, active design wins, top-customer exposure and renewal evidence before treating the customer base as durable. Until then, the customer chapter supports strategic interest but not full commercialization confidence. In that sense, the chapter is good enough to justify diligence continuation, but not good enough to clear customer-risk concerns. Investors should keep separating access proof from revenue proof because the two are not yet the same thing here. The next diligence pass should focus on customer-level evidence, not category narrative.
    That evidence is still missing publicly. As of today.
  claimRefs:
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
  - CU031
  - CU032
  - CU034
  - CU035
