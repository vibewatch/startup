  title: Competitors
summary: CygnuSemi’s competitive set is dominated by large modem and connectivity incumbents, especially Qualcomm and MediaTek globally and UNISOC/HiSilicon domestically. The company’s visible edge is focus and China-specific ecosystem fit, but public evidence still supports only a medium-confidence moat because scale, portfolio breadth and commercial-share transparency remain weak versus incumbents.
sections:
- id: competitor-set
  title: Competitor set and category logic
  body: CygnuSemi competes first against connectivity-silicon vendors, not against satellite-network operators directly. Qualcomm and MediaTek matter because they can integrate NTN features into broad modem roadmaps for global handset OEMs. UNISOC and HiSilicon matter because they represent China-aligned connectivity alternatives with deeper existing relationships. Samsung matters as a vertically integrated feature owner that can shape device expectations. By contrast, AST, Starlink and Skylo are best viewed as ecosystem powers or substitutes that expand and structure service availability while also influencing how much value remains at the chip layer. This framing is important because it separates merchant-silicon competition from downstream service leverage and helps keep the competitor table focused on who can displace CygnuSemi in a design win. It also avoids mistaking ecosystem excitement for company-specific competitive insulation. In other words, some players create demand for NTN-capable chips while others directly fight for the silicon socket.
  claimRefs:
  - CP001
  - CP002
  - CP007
  - CP008
  - CP009
  - CP010
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: breadth-scale-and-readiness
  title: Breadth, scale and readiness
  body: 'Qualcomm appears to hold the strongest overall public position because it combines NTN roadmap breadth, major OEM relationships and public scale proxies that dwarf CygnuSemi. MediaTek is the closest global merchant challenger in practical smartphone relevance and has shown live NR-NTN proof. UNISOC and HiSilicon deepen domestic pressure because they already sit inside broader connectivity procurement conversations. CygnuSemi does have meaningful public proof: certification with China Unicom, a ZTE strategic partnership, and repeated product positioning around direct-to-phone, automotive and IoT use cases. Still, those signals demonstrate readiness more than commercial share. The core competitive trade-off is focus and localization versus breadth and incumbency. Capability evidence should therefore be read as a readiness map, not as proof of won share. The strongest argument for CygnuSemi is not absolute breadth but fit with specific domestic priorities and partner programs.'
