  - TP004
- id: competitive-verdict
  title: Competitive verdict
  body: 'The public record supports a nuanced verdict. CygnuSemi is not just another speculative satellite startup: it has visible product direction, ecosystem proof and a focused category narrative. However, the competitors that matter most are substantially larger, broader and closer to production-scale global deployment. CygnuSemi therefore looks most compelling where local alignment, supply-chain diversification and specialized NTN focus matter more than global breadth. The biggest open question is whether that edge converts into repeatable customer capture before Qualcomm, MediaTek or domestic incumbents make similar offerings harder to displace. In practical investment terms, the competitive debate is less about whether CygnuSemi has any edge and more about whether that edge is durable enough to support pricing power and sustained share gain. That is a materially higher bar than simply proving the technology works. The next diligence step should be to test whether named proof expands into multiple repeat programs, not just one-off ecosystem endorsements or headline partnerships. Without that conversion evidence, the moat case remains provisional.'
