- id: financial-verdict
  title: Financial verdict
  body: 'The financial verdict is cautiously constructive but incomplete. CygnuSemi appears better capitalized than before and has public commercialization proof that exceeds pure concept-stage startups. However, the most important underwriting metrics remain missing: revenue run-rate, shipment scale, realized pricing, gross margin, cash burn, runway and customer concentration. That means the company may deserve attention as a strategically financed fabless challenger, but not yet the level of certainty investors would need for a price-insensitive bullish view. In practical terms, public evidence supports continued diligence and scenario work, while the final investment call still depends on private financial data and on whether commercialization milestones convert into recurring, margin-bearing revenue. The fastest way to change that verdict would be audited or investor-grade disclosure on revenue, margin, cash burn and shipment-backed customer concentration. Until then, downside is harder
    to quantify than upside. That keeps confidence only moderate today.'
