- id: cost-structure-and-unit-economics
  title: Cost structure and unit economics
  body: The most defensible financial interpretation is that CygnuSemi behaves like a venture-stage fabless chip company. It likely avoids owned-fab depreciation, but that does not make the model asset-light in a software sense. R&D, tape-out, validation, certification, ecosystem support and early working-capital needs are still meaningful, especially if design wins start converting into physical shipments. Public filings from adjacent public companies are useful as analogs for capital-intensity logic, not as direct gross-margin comparables. Public sources do not disclose realized ASP, gross margin or per-unit contribution, so the unit-economics bridge remains qualitative. Any serious underwriting exercise will need internal pricing, foundry and packaging assumptions, support burden and receivables timing before investors can judge earnings quality. The hidden variable is whether future production can absorb engineering and validation spend quickly enough to create attractive gross profit
    instead of prolonged pre-scale cost drag. Comparable public-company filings also matter because they remind investors that supplier economics can look healthy at scale while still being cash-hungry during qualification-heavy ramps.
  claimRefs:
  - CI018
  - CI019
  - CI020
  - CI021
  - CI022
  - CI025
  - CI026
  - CI033
