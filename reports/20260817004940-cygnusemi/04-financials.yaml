  - FI004
- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy and financing dependency
  body: Capital support improved meaningfully in 2026. Chinese media reported roughly RMB1.5 billion of strategic financing in February, and July reporting described an additional strategic round alongside a unicorn-style valuation. Those events suggest the company succeeded in reinforcing the balance sheet before full public revenue visibility emerged. That is encouraging, but it is not the same thing as proving self-funded scale. Public evidence still does not disclose cash on hand, monthly burn, debt obligations or runway. The reported historical losses also imply the company remained investment-heavy through 2025. For investors, the right interpretation is that capital adequacy improved, while financing dependency remains unresolved until management discloses burn, cash and commercialization pace. Investors should therefore treat the rounds as balance-sheet support, not as a substitute for a cash-flow model tied to commercialization milestones and delay risk. That distinction matters
    because strategic financing can postpone stress without proving that the business has reached self-sustaining operating leverage.
  claimRefs:
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  - CI016
  - CI017
  - CI028
  - CI029
