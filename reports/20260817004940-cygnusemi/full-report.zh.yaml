  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争者集合和品类逻辑
        blocks:
          - type: paragraph
            body: >-
              CygnuSemi 首先面对的是连接芯片厂商，而不是直接面对卫星网络运营商。Qualcomm 和 MediaTek 很重要，因为它们可以把 NTN 功能整合进面向全球手机 OEM
              的广泛调制解调器路线图。UNISOC 和 HiSilicon 也重要，因为它们代表了中国阵营的连接替代方案，且已有更深的存量关系。Samsung
              作为垂直整合的功能定义者，能够塑造设备预期。相比之下，AST、Starlink 和 Skylo
              更像生态力量或替代者：它们扩展并组织服务可用性，同时也影响芯片层能留下多少价值。这个框架很重要，因为它把商用芯片竞争和下游服务杠杆分开，也让竞争表聚焦于谁能在设计定点中替代
              CygnuSemi。它还避免把生态热度误判为公司专属的竞争隔离。换句话说，有些玩家创造对 NTN 芯片的需求，另一些玩家才直接争夺硅片插槽。
