  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和纳入范围
        blocks:
          - type: paragraph
            body: >-
              不能把 CygnuSemi 当作泛卫星公司分析，也不能把它当作整个 6G 生态的代理。它真正所处的市场，是让智能手机、汽车系统、IoT
              模组和专用终端接入非地面网络的半导体与连接层。这个定义有意排除了发射、航天器制造，以及运营商或卫星网络所有者赚取的大部分服务收入。边界很关键，因为宽口径卫星和 AI
              市场估算会让品类显得巨大，却很少说明一家中国基带供应商实际能拿到什么。尽调时，正确边界应是终端和模组项目中的一部分：客户采购 NTN
              能力作为芯片功能，本土供应商替代也有价值。落到执行，就是跟踪设计周期、认证路径、参考平台和采购流，而不是把所有卫星产业增长都当作可获取收入。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM019
              - CM020
