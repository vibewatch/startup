  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层和买方逻辑
        blocks:
          - type: paragraph
            body: >-
              CygnuSemi 的客户基础应围绕运营商、电信设备伙伴、设备
              OEM、模组厂商和工业或公共部门集成商建模，而不是围绕终端消费者。用户可能是手机订户、车队运营者或工业资产管理者，但付款方更可能是运营商、OEM、伙伴或项目预算负责人。公开产品和市场材料还显示，电信绑定场景仍是最清晰的早期切入口，汽车和工业机会更像中期扩张叙事。这种分层很重要，因为该品类的客户质量高度取决于哪些机构真正认证和采购该技术。分层视角也凸显，芯片公司的公开客户分析比应用初创公司更难：商业买方、技术评估方和终端用户可能是不同实体。投资人应持续区分准入验证和收入验证，因为在这里二者还不是一回事。
