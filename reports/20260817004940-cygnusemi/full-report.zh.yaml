        title: 收入模型和公开牵引缺口
        blocks:
          - type: paragraph
            body: >-
              CygnuSemi 最可能的收入模型是 B2B 半导体商业化，而不是经常性软件订阅。公开产品和伙伴材料指向几类收入流：NTN 手机、汽车、IoT 和 RedCap
              邻近品类中的基带芯片销售、参考设计、认证支持和伙伴绑定设备项目。因此，收入确认更可能跟随设计定点、模组交付和出货事件，而不是任何 SaaS
              式月度计量。尽调难点在于，公开证据仍未披露收入、ARR、订单、客户数或出货量。因此，本章可以从逻辑上勾勒收入桥梁，却无法附上经验证的收入规模。公开牵引证据最强的地方是认证、标准和伙伴里程碑，而不是变现数据。现有证据支持流程逻辑和细分市场框架，但还不能支撑一个可与估值或烧钱速度有信心核对的收入基础。
