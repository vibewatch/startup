      - number: '2.4'
        title: 约束和证据缺口
        blocks:
          - type: paragraph
            body: >-
              最大的市场风险不在于 NTN 是否具备战略意义，而在于生态热度能否足够快地转化为供应商经济性。频谱共享规则、混合网络监管、星座容量时间表和各细分市场采购周期，都可能在无线技术可用后继续拖慢落地。公开来源也没有给出
              CygnuSemi 目标品类的可靠搭载率、芯片 ASP
              或合同量，无法支撑严格的自下而上市场模型。因此，公开记录支持正向的市场方向判断，但不足以承销完整收入机会。管理层拿出设计定点数量、目标物料清单位置、认证状态、预计出货爬坡和最可能从试点转化为经常性需求的细分市场之前，投资人应把自上而下的市场热度视为必要但不足的证据。在此之前，本章支持方向正面的需求判断，但对芯片市场转化速度只能给中等信心。一个有用的尽调测试是，管理层能否把每个优先细分市场连接到具体认证路径、预期发布伙伴、初始出货预期，以及星座容量或监管推迟时的备用方案。
