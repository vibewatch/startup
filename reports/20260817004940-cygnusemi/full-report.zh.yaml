  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险图景
        blocks:
          - type: paragraph
            body: >-
              公开层面最严重的风险不是随机运营小故障，而是集中在结构性依赖上。CygnuSemi
              位于政治敏感的中国半导体和卫星连接品类中，暴露于出口管制、地缘政治和军民两用审查。同时，商业化路径依赖运营商、设备伙伴、网络准备度和公司无法直接控制的软件平台支持。财务不透明会放大这些风险，因为投资人很难量化公司有多少时间或资本吸收延迟。结果是一幅上行空间可能很大、但少数外部冲击也可能不成比例影响执行和融资的风险图景。因此，本章强调结构性暴露，而不是日常运营噪音，因为这些结构性风险最可能改变估值和融资结果。新证据出现时，投资人应密切关注这一领域。正因这种不对称，风险纪律必须始终居中，尤其是今天投资人做估值判断的这个阶段。
