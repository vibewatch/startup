              仍具战略价值、业务落地上仍有意义，但信息不透明还在，无法在价格不敏感的前提下给出正面结论。悲观情景则假设里程碑证明仍然很窄、竞争持续激烈，政策或伙伴摩擦拖慢收入放量，久到削弱下一轮融资条件。上述情景的重点不在精确倍数，而在什么证据足以推动立场切换。以公开资料看，基准情景仍最站得住。公开证据越好，情景区间就越窄，也越能支持决策。在那之前，概率纪律比电子表格里的精度更重要。
