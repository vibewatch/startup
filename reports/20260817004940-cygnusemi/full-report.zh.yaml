companyProfile:
  summary: >-
    CygnuSemi 是一家位于上海的民营无晶圆厂通信芯片公司，聚焦卫星与地面一体化连接。公开证据显示，公司成立于 2020 年 10 月，产品策略覆盖 NTN、5G RedCap、汽车和工业 IoT
    连接。它具备真实战略意义：中国和国际来源都把它描述为国内 5G NR NTN 基带专业厂商，2026
    年的公开融资和客户验证里程碑也显示其获得了有意义的生态支持。核心投资缺口不在于公司是否真实，而在于私有收入质量、出货规模、客户广度和利润率结构，能否支撑据报的独角兽估值。
