      - number: '1.4'
        title: 里程碑、规模信号和公开缺口
        blocks:
          - type: paragraph
            body: >-
              公开里程碑报道称，公司支持了一次 2025 年在轨测试，基于 3GPP 5G NTN 实现手机到卫星的高清视频通话。公司公开定位不只是产品供应商，也参与 6G 星地融合标准活动。Baidu Baike
              报道，2024 年净亏损约 RMB337 million，2025 年上半年净亏损约 RMB141 million。这些亏损数字说明，CygnuSemi 到 2025
              年仍处于投入较重的商业化阶段。已审阅的公开记录没有披露收入或 ARR。已审阅的公开记录没有披露可靠的公司整体员工数，尽管一些第三方页面显示了明显不可信的数字。已审阅的公开记录没有披露客户数量。与 China
              Unicom 的 5G RedCap 认证里程碑和国家级认证，构成比公司未披露收入基础更硬的商业验证。本章结论是，CygnuSemi 的公开画像在技术验证和战略融资上较强，但在硬商业指标上仍然偏弱。MERICS
              还将中国卫星互联网推进描述为军民两用的地缘政治项目，这意味着 CygnuSemi 所处行业里，采购支持和外部政策反弹可能同时上升。
