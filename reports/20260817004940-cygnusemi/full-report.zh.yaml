      - number: '2.3'
        title: 买方、细分市场和获取逻辑
        blocks:
          - type: paragraph
            body: >-
              CygnuSemi 的可服务市场（SAM）按细分市场高度异质，投资判断也应围绕这种异质性展开。智能手机最终可能带来最大的出货量，但汽车、工业
              IoT、公共安全和运营商绑定的连接项目可能更早产生收入，或更具防守性，因为这些场景解决韧性和覆盖问题，机构买方也更清晰。终端用户很少直接付款。预算掌握在手机
              OEM、运营商、模组厂商、汽车供应商和公共部门集成商手里，因此市场转化应建模为 B2B
              设计定点，而不只是消费者采用。最可辩护的测算逻辑应从广义生态活动收窄到技术已准备好的细分市场，再收窄到中国优先项目，最后再基于认证进展和客户赢单测算 CygnuSemi
              的获取份额。这也是为什么细分市场排序比单一混合渗透率假设更重要。它还意味着，尽调要问哪些细分市场能在国内采购规则下最快通过认证，哪些细分市场在硅片放量前还需要多年生态协同。
