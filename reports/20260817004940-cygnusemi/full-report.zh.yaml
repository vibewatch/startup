  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑和价格纪律
        blocks:
          - type: paragraph
            body: >-
              CygnuSemi 有真实的投资逻辑：它处在 NTN、6G 和连接硅片交叉处的战略性国内利基市场，公开验证也已超出概念幻灯片。公司是少数几家具备公开记录的中国无晶圆厂半导体企业之一，已在专为 6G
              卫星通信设计的基带芯片上取得进展；中国国有电信和防务邻近运营商都把这个细分市场视为战略要地。与 Tiantong
              卫星网络集成有关的已完成部署报道，为产品真实提供了佐证。反向逻辑同样真实：商业化证据仍远薄于估值头条，公司还面临难以准确定价的政策、伙伴和竞争风险。2026 年 7 月融资背景把公司估值放在约 $1.5
              billion，说明成熟资本有实质信心；但这不应误认为单位经济或客户广度的独立证据。因此，估值讨论不能与证据质量分开。战略品类中的强公司，如果入场价格假设了公开记录尚未提供的证据，仍可能是一笔弱投资。正确起点应是价格纪律，而不是叙事热情。投资人应要求故事和价格收敛，再进入高确信度。能补上缺口的证据包括：少数中国国有运营商之外的具名创收客户；足以与无晶圆厂同行对标的毛利率数据；以及厘清最近一轮引入的优先权结构的股权结构表。核心估值错误，是假设战略重要性自动等于可接受入场价格。
