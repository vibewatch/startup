              有助于框定规模、生态宽度和资本强度；AST 有助于框定卫星市场时点敏感性；Samsung 和 ZTE 有助于框定生态权力。它们都不是 CygnuSemi
              的直接初创公司估值锚。含义是，公开可比只能提供护栏。它们无法替代公司仍然缺失的私有输入：收入运行率、利润率路径、客户广度、集中度和优先权结构。因此，可比公司应被用作护栏和背景，而不是直接估值公式。最终判断仍更多锚定在缺失证据上，而不是任何单一头条倍数。
