            body: >-
              最大的客户尽调缺口是耐久性。已审阅公开来源没有披露续约、重复使用、净留存率（NRR）、总留存率（GRR）、流失率、客户数量或集中度。这一缺失很重要，因为稀疏但知名的验证集可以与对少数关系的高依赖并存。公开证据还显示，向汽车、工业和其他行业扩张仍更像愿景，而不是客户特定事实。换句话说，CygnuSemi
              可能已有生态准入和技术可信度，但投资人仍无法判断这种准入是否广泛、黏性强或经济上多元。当前正确立场是，把扩张视为可行，把集中度风险视为未解。集中度数据缺席尤其重要，因为这个阶段的公司可能看起来商业前景不错，却仍只依赖少数活跃项目。投资人应持续区分准入验证和收入验证，因为在这里二者还不是一回事。
