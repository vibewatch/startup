              等多类终端场景。这说明其模块图谱围绕基带能力、协议支持、终端集成和多条产品线的商业化支持展开，而不是一个狭窄演示项目。产品故事在客户工作流语境中最强：下游设备厂商或生态伙伴需要芯片和集成路径，让非地面连接真正可商业使用。这个框架很关键，因为只有设备或模组伙伴真正发出集成方案时，客户价值才被兑现；实验室里程碑发布本身不兑现价值。公开模块图谱仍不完整，但已足够区分产品线索、可能买方，以及每条线索对应的证据负担。
