      - number: '1.3'
        title: 融资历史、估值和资本结构
        blocks:
          - type: paragraph
            body: >-
              公开材料将 2026 年 2 月融资包描述为多轮战略融资，合计约 RMB1.5 billion。2026 年 2 月的具名投资方包括 Ceyuan Capital、Hengqin Deep Cooperation
              Investment、Chengdu Sci-Tech Investment、Fujian Industrial Investment、Lucion Venture Capital 和 CICC Capital
              关联基金等政策与市场化基金。2026 年 7 月融资公告引入了更多投资方，包括 Xinhuan Investment、Zizhifang Venture Capital、Full Truck
              Alliance、Xinhuanet Venture Capital、Tongding Group、Boqing Capital 和 Shengrong Capital。Crunchbase News 将
              CygnuSemi 描述为在 2026 年 7 月完成一笔未披露金额融资，而此前同年已完成 $216 million 的 Series C 轮。2026 年 7 月证据集支持约 $1.5 billion
              的独角兽级估值，这与中国媒体称公司估值突破 RMB10 billion 的方向一致。公开来源把 2026
              年描述为公司年内第三次披露融资，意味着一家成立六年的芯片初创公司资本形成速度异常快。公开记录无法支撑干净的累计融资总额，因为数据库式估算和中国媒体逐轮报道无法完全对齐。CB Insights 等第三方数据库将
              CygnuSemi 呈现为一家有风投资本支持的芯片公司，累计融资历史可观但不完全透明。另一个谨慎信号是，各数据库和中国媒体对累计融资金额、投后估值历史并未完全标准化，这提高了投资判断前的尽调负担。到 2026 年
              7 月，CygnuSemi 已有足够战略能见度，国际媒体也将其列为新的半导体独角兽，但披露深度仍不足以像上市芯片公司一样承销。
