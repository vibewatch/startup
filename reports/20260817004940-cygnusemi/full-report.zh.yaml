              ASP、毛利率或单件贡献，因此单位经济桥梁仍停留在定性层面。任何严肃的投资判断都需要内部定价、晶圆代工和封装假设、支持负担和应收款节奏，投资人才能判断盈利质量。隐藏变量在于，未来产量能否足够快地吸收工程和验证支出，创造有吸引力的毛利润，而不是长期拖着规模化前的成本负担。可比上市公司文件也很重要，因为它们提醒投资人：供应商经济性在规模化后可以看起来健康，但在认证密集的爬坡期仍然很耗现金。
