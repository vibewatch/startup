    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、定位和商业模式
        blocks:
          - type: paragraph
            body: >-
              上海星思半导体股份有限公司 是 CygnuSemi 品牌对应的完整中文法律名称。公开公司资料和百科来源显示，CygnuSemi 成立于 2020 年 10 月。公开来源显示，公司总部在上海，主要枢纽位于浦东 /
              张江。CygnuSemi 将自己定位为无晶圆厂通信芯片公司，聚焦 5G/6G 基带和卫星地面一体化连接。公开产品范围横跨 5G eMBB、5G RedCap 和 NTN / 卫星基带平台，而不是单一调制解调器
              SKU。公开产品披露包括 CS6810 5G eMBB 基带平台、CS6610 RedCap 平台，以及 CS7620 / CS7610 卫星方向平台。CygnuSemi
              的公开材料和报道显示，公司覆盖手机直连卫星、汽车卫星连接、IoT、无人机和应急通信等用例。公开来源提到上海、南京和成都的研发中心，说明其在中国有多地工程布局。多篇 2026 年画像还把 CygnuSemi
              描述为国家高新技术企业和专精特新“小巨人”式先进制造企业。
