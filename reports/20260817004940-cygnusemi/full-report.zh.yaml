              年验证集很新，让本章值得关注。但可见验证仍更多说明认证阶段准入，而不是广度、留存或集中度韧性。投资人应要求逐客户部署状态、活跃设计定点、最大客户敞口和续约证据，再把客户基础视为耐久。在此之前，客户章节支持战略兴趣，但不支持完整商业化信心。也就是说，本章足以支持继续尽调，但不足以解除客户风险担忧。投资人应持续区分准入验证和收入验证，因为在这里二者还不是一回事。下一轮尽调应聚焦客户级证据，而不是品类叙事。公开层面，这类证据截至今天仍然缺失。
