              CygnuSemi，也可能改变中国半导体公司的经营环境。国内政策支持有帮助，但也把公司集中在战略关注度过高的品类中。运营上，公开来源仍未披露晶圆代工、良率、安全或合规细节，使供应质量和采购准备度很难承销。执行风险也不低，因为相对于该品类的技术和商业复杂度，可见管理层梯队显得偏窄。这些风险之所以部分可见，恰恰因为公开文档不完整；因此，审慎打分应偏保守，而不是假设缺失细节都是良性的。新证据出现时，投资人应密切关注这一领域。
