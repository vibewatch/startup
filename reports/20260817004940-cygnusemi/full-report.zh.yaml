      - number: '2.2'
        title: 需求驱动和时间点
        blocks:
          - type: paragraph
            body: >-
              市场背景越来越有利。中国政策来源显示，6G 试验、天地卫星融合和围绕卫星互联网的正式工作机制继续获得支持。这一国内政策方向与全球生态证据一致：GSMA 报告称，数十家运营商公开参与卫星合作，GSMA/ESA
              也在资助 NTN 项目。技术层面最重要的信号是，基于标准的手机 NTN 已不再停留在理论阶段。Ericsson、Qualcomm 和 Thales 演示了实时 5G NTN 智能手机通话；Qualcomm 和
              MediaTek 均公开 Release 19 或 NR-NTN 调制解调器进展；Samsung 正在面向用户的产品中开放卫星功能；Starlink、AST
              等运营商则在搭建网络侧。合在一起，这些信号表明市场仍早期，但正在从生态验证走向受约束的商业化。CygnuSemi 的需求时点越来越取决于执行和产能，而不是标准工作缺位。
