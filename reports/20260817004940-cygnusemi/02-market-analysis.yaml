- id: buyers-segments-and-capture
  title: Buyers, segments and capture logic
  body: CygnuSemi’s SAM is heterogeneous by segment, and that heterogeneity should shape underwriting. Smartphones probably represent the largest eventual unit volumes, but automotive, industrial IoT, public-safety and operator-linked connectivity programs may provide earlier or more defensible revenue because they solve resilience and coverage problems with clearer institutional buyers. End users are rarely the direct payers. Budgets sit with handset OEMs, operators, module vendors, auto suppliers and public-sector integrators, so market conversion should be modeled as B2B design wins rather than consumer adoption alone. The most defensible sizing logic therefore moves from broad ecosystem activity to technology-ready segments, then to China-priority programs, and only then to CygnuSemi-specific capture based on qualification progress and customer wins. This is why segment ranking matters more than a single blended penetration assumption. It also means diligence should ask which segments can qualify fastest under domestic procurement rules and which ones demand multi-year ecosystem coordination before silicon volumes appear.
  claimRefs:
  - CM021
  - CM022
  - CM023
  - CM024
  - CM025
  - CM026
  - CM030
  - CM031
  - CM034
  tableRefs:
  - TM002
  - TM003
  figureRefs:
  - FM003
- id: constraints-and-evidence-gaps
  title: Constraints and evidence gaps
  body: The biggest market risk is not whether NTN matters strategically, but whether ecosystem excitement converts into supplier economics fast enough. Spectrum-sharing rules, hybrid-network regulation, constellation-capacity timelines and segment-specific procurement cycles can all slow rollout even when radio technology works. Public sources also do not provide robust attach rates, chip ASPs or contracted volumes for CygnuSemi’s target categories, which blocks a disciplined bottoms-up market model. That means the public record supports a positive market-direction view but not a fully underwritten revenue opportunity. Investors should treat top-down market excitement as necessary but insufficient evidence until management can show design-win counts, target bill-of-material position, qualification status, expected shipment ramps and the segments most likely to convert from pilots into recurring demand. Until then, the chapter supports directionally positive demand but only medium confidence in the pace of chip-market conversion. A useful diligence test is whether management can connect each priority segment to a concrete qualification path, expected launch partner, initial volume expectation and fallback plan if constellation capacity or regulation slips.
  claimRefs:
  - CM027
  - CM028
  - CM029
  - CM032
  - CM035
  - CM036
