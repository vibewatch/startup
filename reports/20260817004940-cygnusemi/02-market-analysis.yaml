  title: Market momentum is evident; monetization evidence is not
  body: Public sources strongly support the existence and strategic relevance of satellite-mobile demand, but they do not support a clean chip-level TAM or CygnuSemi-specific revenue build. The decisive diligence asks are design wins, qualification status, segment mix and likely ASPs.
