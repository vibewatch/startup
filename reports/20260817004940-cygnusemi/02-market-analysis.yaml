  title: Market Analysis
summary: CygnuSemi’s addressable market is the satellite-mobile baseband and connectivity silicon layer inside the broader 6G NTN ecosystem. Policy, operator partnerships, standards milestones and constellation build-outs all support a real market, but public chip-level pricing and volume data remain too thin for a clean bottoms-up TAM.
sections:
- id: market-boundary
  title: Market boundary and what counts
  body: CygnuSemi should not be analyzed as a generic satellite company or as a proxy for the whole 6G ecosystem. Its relevant market is the semiconductor and connectivity layer that enables non-terrestrial network access across smartphones, automotive systems, IoT modules and specialized terminals. That definition deliberately excludes launch, spacecraft manufacturing, and most service revenue earned by operators or satellite-network owners. The distinction matters because broad satellite and AI market estimates make the category look enormous while saying very little about what a Chinese baseband supplier can actually win. For diligence, the right boundary is the subset of device and module programs where NTN capability becomes a purchased chip feature and where local supplier substitution matters. In practice, that means following design cycles, certification paths, reference platforms and procurement flows rather than treating all satellite-industry growth as relevant revenue.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM019
  - CM020
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: demand-drivers-and-timing
  title: Demand drivers and timing
  body: 'The market backdrop is increasingly favorable. Chinese policy sources show continued backing for 6G experimentation, terrestrial-satellite integration and formal working structures around satellite internet. That domestic policy direction aligns with global ecosystem evidence: GSMA reports dozens of operators publicly engaged in satellite partnerships, and GSMA/ESA are funding NTN-related projects. At the technical layer, the most important signal is that standards-based handset NTN is no longer theoretical. Ericsson, Qualcomm and Thales demonstrated a live 5G NTN smartphone call; Qualcomm and MediaTek both publicized Release 19 or NR-NTN modem progress; Samsung is exposing satellite features in user-facing products; and operators such as Starlink and AST are building the network side. Together these signals suggest the market is early but moving from ecosystem proof toward constrained commercialization. For CygnuSemi, the implication is that demand timing is increasingly gated by execution and capacity rather than by the absence of standards work.'
  claimRefs:
  - CM004
  - CM005
  - CM006
  - CM007
