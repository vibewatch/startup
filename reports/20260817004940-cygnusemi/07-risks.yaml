- id: dependency-and-financial-risks
  title: Dependency and financial risks
  body: 'Dependency risk sits at the center of the story. China Unicom certification and ZTE partnership are strengths, but they also reveal how much commercialization relies on a small number of gatekeepers and partners. Broader market-side capacity from operators such as AST and Starlink, OS-level support from Android and AOSP, and regulatory harmony across hybrid networks all condition whether device-side silicon demand can scale. Financially, the company has improved its capital position with fresh 2026 funding, yet public revenue, margin, burn and runway data remain absent. That means investors can see momentum, but they cannot quantify how much delay the company can survive before the next financing or major commercial inflection. This is why dependency and opacity interact: the less investors know about customer breadth and cash durability, the more dangerous external timing shocks become. Investors should watch this area closely as new evidence emerges.'
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR020
  - CR021
  - CR022
