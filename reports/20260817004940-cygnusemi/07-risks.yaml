- id: mitigations-and-kill-criteria
  title: Mitigations, monitoring and kill criteria
  body: 'Mitigation evidence exists, but it is still early. Fresh financing, operator-linked certification and partner proof all reduce immediate credibility risk. They do not, however, eliminate dependency, policy or disclosure risk. The most useful kill criteria are monitorable: export-control escalation that narrows supply or customer access; failure to turn certifications into named deployments; continued absence of customer, shipment and margin metrics after major funding; and a financing need that arrives before commercial breadth is demonstrated. The right risk conclusion is therefore neither panic nor complacency. CygnuSemi deserves serious attention, but the investment case should stay conditional on milestones that directly reduce the current structural risks. A strong next diligence cycle would therefore focus less on general storytelling and more on evidence that directly shrinks residual exposure. Investors should watch this area closely as new evidence emerges. The clearest
    proof of progress would be broader named deployments, better disclosure and a financing plan that no longer relies mainly on strategic optimism.'
  claimRefs:
  - CR026
  - CR027
  - CR028
  - CR031
