  title: Risks
summary: CygnuSemi’s risk profile is medium-high. The main concerns are export-control and geopolitical sensitivity, partner and ecosystem dependence, hidden manufacturability and security details, and financial opacity despite fresh capital. Domestic policy support is real, but it does not erase these structural risks.
sections:
- id: severity-ranked-risks
  title: Severity-ranked risk picture
  body: The highest-severity public risks are not random operational glitches; they cluster around structural dependencies. CygnuSemi sits inside a politically sensitive Chinese semiconductor and satellite-connectivity category, which exposes it to export-control, geopolitical and dual-use scrutiny. At the same time, the commercialization path depends on carriers, device partners, network readiness and software-platform support outside the company’s direct control. Financial opacity amplifies all of this because investors cannot easily quantify how much time or capital the company has to absorb delays. The result is a risk picture in which upside can be large but where a few external shocks could disproportionately affect execution and fundraising. The chapter therefore emphasizes structural exposure rather than day-to-day operating noise, because those structural risks are the ones most likely to change valuation and financing outcomes. Investors should watch this area closely as new evidence
    emerges. That asymmetry is why risk discipline must stay central. Especially for valuation discipline. At this stage. For investors. Right now.
  claimRefs:
  - CR001
  - CR019
  - CR024
  - CR035
  - CR040
  tableRefs: []
  figureRefs:
  - FR001
- id: regulatory-operational-and-people-risks
  title: Regulatory, operational and people risks
  body: Regulatory and legal risk are the most visible external threats. U.S. export-control tightening and geopolitical scrutiny over dual-use space internet can change the operating environment for Chinese semiconductor companies even when CygnuSemi itself is not directly named in every rule. Domestic policy support helps, but it also concentrates the company in a category with outsized strategic attention. Operationally, public sources still do not disclose foundry, yield, security or compliance detail, which makes it hard to underwrite supply quality and procurement readiness. Execution risk is also non-trivial because the visible leadership bench appears narrow relative to the technical and commercial complexity of the category. These risks are partly visible precisely because public documentation is incomplete, which means prudent scoring should skew conservative rather than assume the missing details are benign. Investors should watch this area closely as new evidence emerges.
  claimRefs:
  - CR002
  - CR003
  - CR004
  - CR005
