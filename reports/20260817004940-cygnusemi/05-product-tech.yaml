  title: Product architecture map
  type: stack
  layout: wide
  summary: CygnuSemi’s product can be viewed as a layered stack from baseband logic through integration and ecosystem qualification.
  data:
    layers:
    - label: Commercial deployment layer
      detail: Partner programs, device rollout and downstream commercialization expose whether the chip can move beyond proof into shipping programs.
    - label: Qualification layer
      detail: Carrier certification and field validation create the bridge between a technically working chip and one accepted by ecosystem gatekeepers.
    - label: Integration layer
      detail: Terminal, firmware and OS coordination make satellite capability usable in real device workflows rather than just in bench tests.
    - label: Protocol layer
      detail: NTN and RedCap support sit in the communications stack that translates standards progress into a usable product surface.
    - label: Core silicon layer
      detail: Baseband and connectivity processing are the hardware foundation that CygnuSemi is trying to differentiate.
