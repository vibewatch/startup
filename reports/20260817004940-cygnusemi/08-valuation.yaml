    freshness: recent
    answersQuestionRefs:
    - QV011
    - QV012
  - id: CV015
    statement: AST SpaceMobile is relevant as an ecosystem and milestone comp because market-cap sensitivity to satellite rollout helps frame timing risk.
    type: inferred
    topic: comparables
