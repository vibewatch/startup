    - SV015
    - SV016
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV025
    - QV023
  - id: CV030
    statement: The most important investment KPIs to monitor are named deployments, shipment scale, revenue disclosure, gross margin and concentration.
    type: inferred
    topic: kpis
    sourceRefs:
    - SV002
    - SV015
    - SV016
    confidence: medium
    freshness: recent
    answersQuestionRefs:
