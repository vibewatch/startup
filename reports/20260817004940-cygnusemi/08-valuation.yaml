  claims:
  - id: CV001
    statement: The strongest thesis is that CygnuSemi occupies a strategically important domestic niche in satellite-mobile baseband and connectivity.
    type: inferred
    topic: thesis
    sourceRefs:
    - SV013
    - SV014
    - SV020
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV002
    - QV007
  - id: CV002
    statement: Fresh 2026 financing and unicorn-status reporting are evidence that investors view the company as strategically scarce.
    type: inferred
    topic: thesis
    sourceRefs:
    - SV001
    - SV003
    - SV004
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV002
    - QV004
    - QV027
  - id: CV003
    statement: China Unicom certification and ZTE partnership provide real commercialization proof beyond a conceptual market story.
    type: inferred
    topic: thesis
    sourceRefs:
    - SV015
    - SV016
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV007
  - id: CV004
    statement: The strongest anti-thesis is that public revenue, margin, shipment and retention disclosure remain too weak for traditional underwriting.
    type: inferred
    topic: anti-thesis
    sourceRefs:
    - SV002
    - SV005
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV003
    - QV008
    - QV028
  - id: CV005
    statement: A second anti-thesis is that incumbents such as Qualcomm and MediaTek can bundle similar capabilities at much larger scale.
    type: inferred
    topic: anti-thesis
    sourceRefs:
    - SV017
    - SV018
    - SV019
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV003
    - QV008
  - id: CV006
    statement: A third anti-thesis is geopolitical and regulatory risk tied to dual-use and export-control sensitivity.
    type: third-party-reported
    topic: anti-thesis
    sourceRefs:
    - SV012
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV003
    - QV026
  - id: CV007
    statement: Public reporting supports a valuation context around roughly $1.5 billion in July 2026.
    type: third-party-reported
    topic: valuation-context
    sourceRefs:
    - SV001
    - SV003
    confidence: high
    freshness: recent
    answersQuestionRefs:
    - QV004
    - QV005
  - id: CV008
    statement: That headline valuation is credible as a financing marker but not as proof of fundamental fair value.
    type: inferred
    topic: valuation-context
    sourceRefs:
    - SV001
    - SV002
    - SV003
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV005
    - QV006
  - id: CV009
    statement: Public evidence does not support a confident buy recommendation at a ~$1.5 billion price point.
    type: inferred
    topic: recommendation
    sourceRefs:
    - SV002
    - SV005
    - SV012
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV001
    - QV006
    - QV024
  - id: CV010
    statement: The most defensible recommendation is track or research-more rather than buy or pass.
    type: inferred
    topic: recommendation
    sourceRefs:
    - SV002
    - SV013
    - SV015
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV001
    - QV024
    - QV030
  - id: CV011
    statement: Confidence should be medium because the company has real proof and real capital, but still material evidence gaps.
    type: inferred
    topic: recommendation
    sourceRefs:
    - SV002
    - SV015
    - SV016
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV010
    - QV030
  - id: CV012
    statement: 'The relevant comparable set is mixed: large public modem/connectivity companies for scale logic and selected satellite or milestone comps for ecosystem context.'
    type: inferred
    topic: comparables
    sourceRefs:
    - SV006
