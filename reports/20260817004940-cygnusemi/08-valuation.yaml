- id: scenario-logic
  title: Bull, base and bear scenario logic
  body: The bull case requires rapid conversion from today’s proof set into broader named deployments, better financial disclosure and evidence that local specialization can create durable share. The base case assumes CygnuSemi remains strategically important and operationally relevant, but with continuing opacity that prevents a price-insensitive positive call. The bear case assumes milestone proof stays narrow, competition remains intense and policy or partner frictions slow revenue scaling long enough to weaken the next financing setup. These scenarios are less about precise multiples and more about what evidence would justify moving from one posture to another. Publicly, the base case remains the most defensible. The more public evidence improves, the narrower and more decision-useful that scenario range becomes. Until then, probability discipline matters more than spreadsheet precision.
  claimRefs:
  - CV017
  - CV018
  - CV019
  - CV020
  - CV025
  - CV026
  - CV039
  tableRefs:
  - TV003
  figureRefs:
  - FV003
- id: recommendation-and-next-asks
  title: Recommendation, triggers and final diligence asks
  body: 'The most defensible current recommendation is track or research-more, not buy. Confidence should be medium: the company is clearly worth serious attention, but the evidence set is still too incomplete for conviction at the current public valuation context. Before upgrading the call, investors should demand named customer breadth, shipment or deployment scale, revenue and gross-margin disclosure, cash-burn visibility and preference-term clarity. They should also watch clear thesis-break triggers such as policy escalation, failure to broaden customer proof, or a financing need that arrives before commercialization de-risks. In short, CygnuSemi deserves monitoring, but the price of conviction should be more evidence than is publicly available today. The discipline here is to let evidence pull the recommendation upward, not let narrative pull it prematurely. A better evidence package could still move the call materially in either direction.'
