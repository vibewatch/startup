    sourceRefs:
    - SV002
    - SV012
    - SV017
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV008
    - QV017
  - id: CV027
    statement: A multiple-based approach should therefore use broad strategic-comparable sanity checks rather than treat public semiconductor market caps as direct valuation anchors.
    type: inferred
    topic: valuation-method
    sourceRefs:
    - SV006
    - SV007
    - SV025
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV029
  - id: CV028
    statement: The thesis is price-sensitive because even a good company can be a weak investment at a valuation unsupported by disclosed fundamentals.
    type: inferred
    topic: price-sensitivity
    sourceRefs:
    - SV001
    - SV002
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV025
    - QV030
  - id: CV029
    statement: The thesis is also evidence-sensitive because a few private data points could materially upgrade or downgrade confidence.
    type: inferred
    topic: price-sensitivity
    sourceRefs:
