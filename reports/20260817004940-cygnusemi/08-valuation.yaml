    - SV012
    - SV015
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV020
    - QV026
  - id: CV021
    statement: Fresh financing should be interpreted partly as validation and partly as an admission that capital is still needed before full revenue visibility.
    type: inferred
    topic: financing-interpretation
    sourceRefs:
    - SV003
    - SV004
    - SV005
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV027
  - id: CV022
    statement: Key missing private inputs are revenue run-rate, gross margin, cash burn, top-customer share, shipment ramp and preference terms.
    type: inferred
    topic: missing-inputs
    sourceRefs:
    - SV002
    - SV005
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV014
    - QV028
    - QV023
  - id: CV023
    statement: Because those inputs are missing, any public return range must be scenario-based rather than precision-priced.
    type: inferred
    topic: valuation-method
    sourceRefs:
    - SV002
    - SV005
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV019
    - QV029
  - id: CV024
    statement: Geopolitical and regulatory risk should compress the acceptable entry price relative to a comparable company with the same technical proof but lower policy sensitivity.
    type: inferred
    topic: price-sensitivity
    sourceRefs:
    - SV012
    - SV001
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV025
    - QV026
  - id: CV025
    statement: The public-record upside case is real because the addressable market and ecosystem momentum appear large and strategic.
    type: inferred
    topic: upside
    sourceRefs:
    - SV020
    - SV021
    - SV024
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV007
    - QV018
  - id: CV026
    statement: The public-record downside case is equally real because the company could be strategically relevant yet still fail to monetize at scale.
    type: inferred
