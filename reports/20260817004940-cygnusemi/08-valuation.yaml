- id: valuation-context-and-comparables
  title: Valuation context and comparable discipline
  body: 'Public reporting supports a July 2026 valuation context around $1.5 billion, but that should be interpreted as a financing marker rather than as proof of fair value. The comparable set is inherently imperfect. Qualcomm and MediaTek help frame scale, ecosystem breadth and capital intensity; AST helps frame satellite-market timing sensitivity; Samsung and ZTE help frame ecosystem power. None of these are direct startup valuation anchors for CygnuSemi. The implication is that public comps can only provide guardrails. They cannot replace the private inputs still missing from the company: revenue run-rate, margin path, customer breadth, concentration and preference structure. That is why comparables should be used as guardrails and context rather than as direct valuation formulas. That leaves the final judgment anchored more to missing proof than to any single headline multiple.'
  claimRefs:
  - CV007
  - CV008
  - CV012
  - CV013
