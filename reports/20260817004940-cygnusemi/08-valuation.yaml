    sourceRefs:
    - SV019
    - SV026
    - SV027
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV011
    - QV013
  - id: CV017
    statement: The base case should assume strategic relevance and continuing proof, but delayed visibility on revenue quality and customer breadth.
    type: inferred
    topic: scenario-base
    sourceRefs:
    - SV002
    - SV015
    - SV016
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV015
    - QV016
  - id: CV018
    statement: The bull case requires rapid conversion from certification and partnerships into broader named deployments and private revenue evidence.
    type: inferred
    topic: scenario-bull
    sourceRefs:
    - SV015
    - SV016
    - SV020
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV015
    - QV018
  - id: CV019
    statement: The bear case requires persistent opacity, partner concentration and competition-driven compression before commercialization scales.
    type: inferred
    topic: scenario-bear
    sourceRefs:
