    - SV012
    - SV017
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV015
    - QV017
  - id: CV020
    statement: Sensitivity is highest to customer conversion, shipment scale, margin path, concentration and policy shock.
    type: inferred
    topic: sensitivity
