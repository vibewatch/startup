- id: conflicts-and-diligence-gaps
  title: Conflicting Estimates and Remaining Diligence Gaps
  body: 'A disciplined market chapter should preserve what remains unknown. The first gap is definitional dispersion: published edge-AI market values agree on a ~USD25-36 billion 2025 base but diverge by hundreds of billions on their end-year forecasts because they variously include or exclude software, services, data-center-adjacent spend, and different geographies and horizons. Treating any single forecast as canonical would misstate the opportunity. The second and more important gap is company-specific: no retained public source discloses SiMa.ai''s revenue, unit shipments, design-win count, or served-market share, so the sizing lenses bound the opportunity but cannot be bridged to a SiMa.ai SAM or SOM.


    The third gap is competitive share data: while NVIDIA is widely described as dominant at the edge, retained sources do not give a precise, current share split among Jetson, Hailo, Ambarella, Qualcomm, and SiMa.ai for the specific physical-AI sockets SiMa.ai targets. The practical conclusion is that market evidence is strongest on demand direction and weakest on SiMa.ai''s captured share and on the profit pool available to an independent edge-silicon vendor competing against a dominant incumbent. Investors should treat the market as supportive context and reserve conviction for the design-win, product, and financial evidence in later chapters.'
