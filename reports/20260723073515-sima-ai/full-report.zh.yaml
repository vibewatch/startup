          - type: callout
            title: 估值与证据的缺口是首要风险
            body: >
              在报道估值下，投资人支付的私人市场溢价远高于公开边缘 AI 可比公司，而标的公司不披露财务。倍数缺口（隐含约 28–39x，对比 Ambarella
              5–8x）只有靠快速、耐久的收入增长和健康毛利率证明才能跨过——两者都没有公开。同行困境（Hailo 据报重定价到 USD500M 以下；Blaize 持续经营警告）显示，边缘 AI
              公司一旦落空，会多快被市场否定；在温和收入基数上叠加庞大且未披露的清算优先权堆栈，也可能在下行退出中吸收大部分退出收益。
            calloutType: risk
            claimRefs:
              - CV007
              - CV017
              - CV031
              - CV032
          - type: callout
            title: 活跃的边缘 AI M&A 和战略背书支撑退出论点
            body: >
              边缘 AI 收购市场活跃，并愿为差异化 IP 支付溢价：NXP 以 USD307 million 收购 Kinara（2025 年 2 月），onsemi 同意以约 USD7 billion 收购
              Synaptics（2026 年），以扩展边缘 AI。Micron 2026 年 4 月的战略投资增加了一个具备内存和边缘系统暴露的独立战略验证方。这些信号使战略 M&A
              成为最可能退出路径，并提供了可信但未量化的稀缺性溢价案例，支撑多头情景。
            calloutType: strength
            claimRefs:
              - CV030
              - CV032
              - CV033
              - CV019
