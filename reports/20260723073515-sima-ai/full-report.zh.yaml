  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: >
      三种收入情景（USD40M、USD80M、USD150M）与三档倍数（上市可比 8x、增长溢价 15x、战略 25x）下的退出估值。只有高收入、高倍数组合才撑得起报道的 USD1.4B
      入场估值；按上市可比倍数，整个合理收入区间都无法支撑这一报道估值。
    data:
      items:
        - label: 收入 USD40M @ 8x（上市可比）
          value: 320
        - label: 收入 USD40M @ 15x（增长溢价）
          value: 600
        - label: 收入 USD40M @ 25x（战略）
          value: 1000
        - label: 收入 USD80M @ 8x（上市可比）
          value: 640
        - label: 收入 USD80M @ 15x（增长溢价）
          value: 1200
        - label: 收入 USD80M @ 25x（战略）
          value: 2000
        - label: 收入 USD150M @ 8x（上市可比）
          value: 1200
        - label: 收入 USD150M @ 15x（增长溢价）
          value: 2250
        - label: 收入 USD150M @ 25x（战略）
          value: 3750
    approximationNotes: |
      收入数值是分析师情景，锚定第三方估算（约 USD35.5M）和行业基准；SiMa 不披露收入。倍数档位锚定 Ambarella（约 5-8x P/S）、增长溢价和边缘 AI 并购先例。所有数值单位为百万美元。
    claimRefs:
      - CV002
      - CV023
      - CV024
      - CV025
      - CV029
      - CV034
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: |
      各情景退出估值区间，加上概率加权价值和报道入场价。牛市情景区间高于入场价；基准情景持平或更低；熊市情景意味着显著亏损。概率加权价值（约 USD965M）低于报道的 USD1.4B 入场价，说明按报道价格进入的预期回报为负。
    data:
      items:
        - label: 牛市：量产设计导入 + 战略溢价
          low: 1500
          mid: 2000
          high: 2500
        - label: 基准：稳步转化，混合边缘 AI 倍数
          low: 600
          mid: 800
          high: 1000
        - label: 熊市：困在小众市场，降价融资 / 困境
          low: 200
          mid: 350
          high: 500
        - label: 概率加权价值（25/45/30）
          low: 800
          mid: 965
          high: 1150
        - label: 报道入场价（参考）
          low: 1400
          mid: 1400
          high: 1400
    approximationNotes: |
      情景区间为分析师估算；收入与倍数假设来自可比公司和行业并购推断。概率权重（25/45/30）是在取得经审计财务前的定性判断。数值单位为百万美元。
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV026
      - CV028
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: |
      九项头部指标框定入场决策。报道估值和隐含倍数显著高于上市可比倍数，而收入、烧钱和现金续航均未披露——这正是建议为 research-more 而非 buy 的核心原因。
    data:
      items:
        - label: 报道投后估值
          value: ~USD1.4B
          detail: The Information 经追踪器收录；公司未确认
          tone: warning
        - label: 累计融资额
          value: ~USD355M
          detail: 2018 年以来约 9 轮
          tone: positive
        - label: Series C（2025 年 8 月）
          value: USD85M
          detail: Maverick Capital 领投；StepStone、Micron Ventures
          tone: positive
        - label: 估算收入
          value: ~USD35.5M
          detail: 第三方估算；公司未披露
          tone: warning
        - label: 隐含远期收入倍数
          value: ~28-39x
          detail: 基于报道估值和估算收入
          tone: negative
        - label: 上市可比倍数（Ambarella）
          value: ~5-8x P/S
          detail: FY2026 收入 USD390.7M；市值约 USD2-3B
          tone: warning
        - label: 概率加权价值
          value: ~USD965M
          detail: 低于报道的 USD1.4B 入场价
          tone: negative
        - label: 资本效率（估值 / 融资额）
          value: ~2.7x
          detail: 按私募市场追踪器
          tone: neutral
        - label: 烧钱与现金续航
          value: Undisclosed
          detail: 未公开烧钱、现金余额或现金续航
          tone: warning
    approximationNotes: KPI 数值综合报道数据、第三方估算和上市同业数据；未披露项需要数据室访问权限。
    claimRefs:
      - CV001
      - CV002
      - CV017
      - CV023
      - CV029
      - CV042
