      - number: '3.4'
        title: 转换成本、锁定与分销力量
        blocks:
          - type: paragraph
            body: >-
              边缘 AI 芯片一旦被设计进产品，转换成本很高：硬件布局、散热设计、软件移植和安全认证都绑定特定芯片，因此一个芯片位胜出往往能延续整个产品世代。这种动态对 SiMa.ai
              是双刃剑。公司赢下设计时会被奖励，但更多时候它利好 NVIDIA，因为多数工程团队已经投入多年 CUDA/JetPack 技能和可复用软件，使 Jetson
              成为感知风险最低的默认选择。设备层面多归属有限——一台具体产品只出货一颗推理芯片——但评估阶段常见，买家会在承诺前对多个部件跑基准测试。


              分销力量差距最明显。NVIDIA 和 Qualcomm 通过庞大成熟的渠道和参考设计触达客户；Ambarella 借力数十年的摄像头 OEM 关系；Blaize 触达公共部门和国防系统集成商。SiMa.ai
              依赖较年轻的直销动作，并由伙伴和分销商（Macnica、Enclustra）及战略关系补充（Synopsys 做汽车工具，L&T Technology Services 做 Physical AI 方案交付，另有
              Micron 存储投资）。供应获取是共同依赖：SiMa.ai 像多数无晶圆厂同行一样依赖 TSMC（Modalix 用
              N6），因此代工产能分配和存储（LPDDR5）供应是共同约束，而非差异化来源。净图景是：SiMa.ai 的伙伴生态可信，但尚未形成可与在位者相比的分销护城河。
            claimRefs:
              - CP027
              - CP028
              - CP029
              - CP030
              - CP031
              - CP032
      - number: '3.5'
        title: 护城河耐久性、替代风险与负面证据
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai 的护城河论点建立在三项主张上：真实的每瓦性能领先，能降低集成成本的差异化软件优先体验，以及在机器人、工业、汽车和国防等 Physical AI
              场景中的早期设计导入。每一项都可争议。效率领先很窄且容易过期——Hailo 已声称拥有相当或更好的 TOPS/W，NVIDIA 迭代激进（Jetson Thor），今天的规格优势未必能保住。软件优先叙事直接面对
              CUDA；CUDA 是 AI 计算里最深、最根深蒂固的护城河，尚无挑战者在边缘把它撬开。设计导入主张也只是陈述，未量化：保留公开来源没有披露 SiMa.ai 的出货量、收入或芯片位数量。


              负面证据有分量。CNBC 报道称 NVIDIA 主导 AI 芯片市场，竞争者即便获得投资人资金，也面临陡峭爬坡。Hailo 从 USD1.2 billion 独角兽跌到低于 USD500 million 的困境
              SPAC，并伴随裁员，是一个直接且新近的证明：资金充足、技术可信的边缘 AI 同行，也可能无法把资本和产品转化为持久价值。Blaize 已上市但仍很小（2025 年收入 USD38.6
