      - number: '1.2'
        title: 领导层、治理与董事会
        blocks:
          - type: paragraph
            body: >-
              领导层由创始人兼 CEO Krishna Rangasayee 锚定。他的公开履历对一家硬件初创公司来说很厚：在 Xilinx 工作近 18 年，先后升任整体业务高级副总裁兼总经理、全球销售执行副总裁；随后担任
              AI 芯片公司 Groq 的 COO，此前还在 Altera 和 Cypress Semiconductor 任职，并拥有 25 项以上国际专利。这种创始人-市场匹配——来自 FPGA
              世界、曾经放大一家数十亿美元半导体业务的销售与运营负责人——是投资论点核心，也把实质性的关键人风险集中到单一高管身上。


              董事会和管理梯队进一步强化半导体背景。董事会主席 Moshe Gavrielov 是退休 Xilinx CEO，也在 TSMC、Cadence、NXP 董事会任职；成员包括 Intel CEO、前 Cadence
              掌门 Lip-Bu Tan，Scott Darling（Dell Technologies Capital）、Andrew Homan（Maverick Capital）、Jake Flomenberg（Wing
              Ventures）和 Mike Dauber（Amplify Partners）。运营层包括汽车业务总裁 Harry Kroeger，他来自 Bosch-Daimler 圈层，曾有管理董事会经历，并曾在
              Tesla 和 Rivian 董事会任职。一个值得尽调的缺口是联合创始人名单：公司材料称 SiMa.ai 由创始团队启动，本报告任务也列出 Manish Garg（CTO）、Yann
              Lepenant（首席架构师）和 Manu Prasad（工程执行副总裁）为联合创始人；但独立公开记录始终只把 Rangasayee 列为创始人，因此其他联合创始人仍是公司提供的信息，尚未得到独立佐证。
