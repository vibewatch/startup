  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai
              是一家尚未盈利、硬件驱动的半导体公司，面对根深蒂固的既有龙头，因此风险更多压在市场、资本和执行暴露上，而不是短期法律责任。按剩余暴露排序（可能性乘以影响，扣除缓释）：最高严重度风险是竞争替代——NVIDIA
              Jetson 平台和 CUDA/JetPack 软件护城河，再加上资本充足的挑战者，可能把 SiMa 限制在小众市场。第二是融资和资本强度风险：无晶圆厂边缘 AI 玩家烧钱很重（Blaize 经营亏损接近
              USD103.8 million，并发出持续经营警告；Ambarella 即便收入接近 USD391 million，仍有 GAAP 净亏损），而 SiMa
              不披露财务，因此资金续航和盈利路径无法验证，并依赖反复融资。第三是供应链集中：Modalix 依赖 TSMC N6 工艺，把产能集中在台湾。第四是监管暴露：BIS
              出口管制限制中国市场准入，汽车、国防和医疗健康认证关卡拖慢收入。第五是创始人主导团队的执行和关键人风险，公开材料对更广泛创始团队的佐证有限。第六是技术验证风险：没有公开的 Modalix 代际 MLPerf
              基准来独立确认单位功耗性能主张。下方表格和热力图按可能性、影响、缓释成熟度和剩余暴露对每项风险排序。
