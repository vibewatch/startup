      - number: '1.3'
        title: 融资历史、投资者与估值
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai 自 2020 年以来完成约九轮披露融资，公司公告与第三方追踪数据拼出的历史基本一致。Dell Technologies Capital 于 2020 年 5 月领投 $30 million
              Series A；Fidelity Management & Research 于 2021 年 5 月领投 $80 million Series B，并于 2022 年 5 月领投 $30 million
              延展轮；MSD Partners 于 2022 年 10 月领投 $37 million Series B1 延展轮；2023 年中又获得 ~$13 million；随后 Maverick Capital 在
              2024 年 4 月领投 $70 million 轮，并在 2025 年 8 月 1 日领投超额认购的 $85 million Series C，使累计披露融资达到 $355 million。StepStone
              Group 作为新投资者加入 Series C，Micron Technology 又在约 2026 年 4 月进行一笔金额未披露的单独战略投资，加深存储与计算伙伴关系。


              估值是公开披露刻意留白之处。SiMa.ai 明确拒绝披露 Series C 后估值，Business Standard 也确认这一点。独立报道填补了空白，但并不干净：The Information 报道称
              SiMa.ai 正在以约 $1.4 billion 估值融资超过 $100 million——较 PitchBook 所称前一年 8 月约 $960 million 估值溢价超过
              45%——这也是独角兽追踪机构和后续报道广泛把 SiMa.ai 称为 ~$1.4 billion 独角兽的原因。由两名知情人士给出的 $100M+ 数字高于公司官方 $85 million
              口径，因此确切轮次规模和估值都仍是“报道但未确认”的事实，需要用原始融资文件核验。
