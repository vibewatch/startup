      - number: '2.3'
        title: 买方分层、预算所有者与采用路径
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai 的市场横跨多个买方类型，并非单一同质客户；公司围绕垂直行业组织商业化：机器人、工业自动化与机器视觉、汽车 / ADAS、航空航天与国防、智能视觉 / 零售，以及医疗设备。使用者通常是嵌入式或 ML
              工程团队，需要把感知模型或生成式 AI 模型塞进受散热和功耗约束的产品；买方是掌握 BOM 和路线图的产品、平台或工程负责人；付款 / 预算所有者通常是硬件产品 P&L
              或项目预算，而不是云预算项。采用触发点因细分不同而变化——机器人看电池续航和散热上限，汽车看功能安全和延迟，国防看加固和供应链保障，医疗看隐私 / 监管约束——但共同点都是要把推理搬到端侧。


              采用路径通常从开发套件和 Palette 软件评估开始，经过系统级模组设计导入（SiMa.ai 公布 SoM 的 1K 件定价为 8GB USD349、32GB USD599，开发套件为
              USD1,499），在某个平台赢得设计导入后进入量产。由于这是硬件设计导入，销售周期长，导入后的转换成本高；参考客户和生态伙伴（Arm、TSMC、Synopsys、L&T Technology
              Services、Enclustra）能实质性缩短评估期。这种动态两面：SiMa.ai 赢下一个芯片位时会受益，但也偏向在位者（NVIDIA Jetson）；大多数工程团队已经熟悉默认选择，感知集成风险最低。
