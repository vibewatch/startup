  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义和产品族图谱
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai 的产品是 Modalix，一款第二代 MLSoC，可在单颗芯片上运行完整 Physical AI 流程——计算机视觉、传统 CNN、Transformer、大语言模型和多模态生成式
              AI——而不是把工作负载分散到 CPU 加加速器板卡上。放到客户工作流里，它用一个高能效设备替代离散 GPU
              或加速器加主处理器：设备摄取摄像头和传感器数据，本地推理，并在机器人、车辆、无人机和工业机器中驱动实时决策。商业产品族覆盖出售给 OEM 和模组厂的裸 MLSoC 芯片、8GB 和 32GB 版本封装
              Modalix 系统级模组、用于评估和原型开发的 Modalix DevKit 3.0，以及软件层：Palette Neat SDK（Model Compiler、Neat Library 和 sima-cli
              工具）、Edgematic 基于浏览器的低代码流程构建器、LLiMa GenAI 运行时，以及公开 GitHub 模型库，内含预优化 PyTorch 和 ONNX 模型。模组在引脚和软件上兼容 SiMa.ai
              第一代 MLSoC，也兼容流行 NVIDIA SoM，让买家能在现有载板设计中评估 Modalix。最终产品是一套硬件加软件方案，卖点是单芯片多模态集成，以及从模型到部署式边缘应用的低摩擦开发路径。
