      - number: '6.4'
        title: 留存、耐久性与满意度信号
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai 不披露正式留存指标——没有净收入留存（NRR）、总收入留存（GRR）、流失、续约率、合同期限或客户分组数据——因此耐久性只能从业务结构和间接信号推断。两个结构性因素说明，一旦拿下
              设计赢单，粘性会较强：边缘硅片设计导入周期长、成本高；客户把 Modalix 认证进机器人、摄像头或车辆平台后，切换会面临高昂再工程成本，这在嵌入式半导体中通常带来多年平台生命周期。SiMa
              又通过全栈软件层（Palette、Edgematic、LLiMa 端侧 LLM 运行时）和模型库扩大集成面，使切换更具破坏性。正面外部信号包括 2026 Product of the Year 奖，以及 2023
              到 2024 年客户数翻倍的报道，暗示至少存在一定复购和扩张需求。反向信号同样重要：没有公开续约，没有带量化满意度的参考客户群，没有披露客户留存； 第二代产品仍很年轻（Modalix 仅自 2025 年 8
              月量产），尚未证明完整的多年续约客户分组。因此，耐久性在结构上可信，但经验数据尚未证明。
