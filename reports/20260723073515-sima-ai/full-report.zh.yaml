      - number: '7.6'
        title: 缓释、监测指标与终止标准
        blocks:
          - type: paragraph
            body: >-
              每项重大风险都有可用缓释和可观察监测指标，但多数缓释仍处早期，并依赖 SiMa 尚未做出的披露。竞争风险的缓释，是加深 Palette 软件护城河并锁定多年设计赢单；
              监测指标是设计赢单到量产的转化，以及任何已发布的独立基准；终止标准是旗舰设计导入输给 NVIDIA，或到下一轮融资时仍无法显示规模化收入。融资风险的缓释，是近期 Series C 和 Micron
              背书；指标是资金续航和现金消耗倍数；终止标准是降估值融资，或资金续航到期前无法融资。供应链风险的缓释，是认证备选晶圆厂 / OSAT 产能并建立库存缓冲；指标是单一来源暴露和交期；终止标准是 TSMC
              配额丢失或台海中断。监管风险的缓释，是出口管制合规计划，以及推进 ISO 26262 / ASIL 和 FDA 认证；指标是认证里程碑和任何 BIS
              执法行动；终止标准是因缺少认证被目标垂直领域排除。执行风险的缓释，是在 CEO
              之外扩展领导层梯队；指标是关键高管留任，以及对创始团队的独立佐证。核心尽调问题包括管理层资料室（财务、现金消耗、资金续航、在手订单）、独立 Modalix 基准、晶圆厂 / OSAT
              合同、出口管制合规审查，以及功能安全认证证据。
