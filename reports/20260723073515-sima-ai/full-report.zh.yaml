  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai 卖的不是通用 “AI” 产品；它位于边缘 AI 推理芯片层——单颗 MLSoC（“Modalix”）把 Arm 应用核心、专用 ML 加速器和视觉 / DSP
              模块融合在一起，使计算机视觉、Transformer 和生成式 AI 模型能在本地以约 10 瓦以内运行，并配套 Palette 软件工具链。这把纳入支出的边界收得很窄：专用边缘 AI
              处理器、系统级模组、开发套件，以及把训练好的模型变成可部署边缘应用的配套软件。它明确排除云端 / 数据中心训练芯片、通用 CPU、独立传感器和终端用户 AI SaaS 席位；这些属于相邻市场。


              SiMa.ai 瞄准的买家——机器人、工业自动化、汽车 /
              ADAS、航空航天与国防、智能视觉和医疗设备制造商——越来越需要实时推理；在这些场景里，云端往返太慢、太耗电，或让敏感数据暴露过多。因此他们拿来比较的现状替代品不只是其他边缘 AI
              初创公司（Hailo、Ambarella、Blaize），更重要的是 NVIDIA Jetson 平台；Jetson 主导边缘机器人计算。此外还有 Qualcomm 的通用 SoC、嵌入式
              GPU、FPGA，某些情况下也包括继续依赖云端推理。SiMa.ai 的位置由它相对这些选择所声称的更高每瓦性能和单芯片、软件优先体验来定义，因此相关市场最好从边缘 AI 硬件 / 芯片层出发，并叠加
              Physical AI、机器人和汽车推理视角。
