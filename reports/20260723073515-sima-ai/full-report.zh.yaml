      - number: '8.7'
        title: 图表
        blocks:
          - type: callout
            title: 建议：在报道的 USD1.4B 下继续研究
            body: >
              SiMa.ai 的投资论点在结构上有吸引力：一个差异化、节能的边缘 / 物理 AI 硅平台，由半导体原生团队带领，并得到标志性合作和 Micron 战略投资验证。但报道的约 USD1.4 billion
              估值没有公开财务锚：SiMa 不披露收入、利润率、现金消耗或资金续航，第三方收入估算意味着前瞻倍数被拉到约 28x–39x，而公开纯可比公司约 5x–8x。三情景模型给出的概率加权价值约 USD965
              million，低于报道入场价。只有满足以下条件才上调为买入：（1）经审计收入、利润率、现金消耗 和资金续航；（2）Series C 条款清单和股权结构表；（3）按金额加权的设计赢单管线，以及独立 Modalix
              基准。
            calloutType: recommendation
