      - number: '2.5'
        title: 冲突估计与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              严谨的市场章节应保留未知项。第一项缺口是定义分散：公开边缘 AI 市场值在 2025 年约 USD25-36 billion
              的基数上大致一致，但终年预测相差数千亿美元，因为各家口径对软件、服务、数据中心相邻支出、地理范围和时间跨度的纳入 /
              排除不同。把任一预测当成标准答案都会扭曲机会。第二且更重要的缺口是公司特定数据：保留的公开来源没有披露 SiMa.ai 的收入、出货量、设计导入数量或已服务市场份额，因此这些规模视角只能划定机会边界，无法桥接到
              SiMa.ai 的 SAM 或 SOM。


              第三项缺口是竞争份额数据：虽然 NVIDIA 被广泛描述为边缘主导者，但保留来源没有给出 SiMa.ai 所瞄准特定 Physical AI 芯片位中
              Jetson、Hailo、Ambarella、Qualcomm 和 SiMa.ai 的精确、当前份额拆分。务实结论是，市场证据对需求方向最强，对 SiMa.ai
              已捕获份额以及独立边缘芯片供应商在强势在位者面前可拿到的利润池最弱。投资者应把市场视为支撑性背景，把信心留给后文的设计导入、产品和财务证据。
