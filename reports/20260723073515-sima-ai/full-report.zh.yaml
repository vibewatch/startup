      - number: '2.2'
        title: 通过边缘 AI、Physical AI 和汽车视角测算市场
        blocks:
          - type: paragraph
            body: >-
              没有一个公开数字能干净覆盖 SiMa.ai 的机会，因此更稳妥的做法是保留多个视角，而不是硬凑一个 TAM。最窄的硬件口径下，MarketsandMarkets 估算边缘 AI 硬件市场 2025 年为
              USD26.14 billion，到 2030 年增至 USD58.90 billion，CAGR 为 17.6%；这一层最直接对应 SiMa.ai 的芯片和模组。更宽的边缘 AI
              定义把软件和服务纳入后，规模更大、增速更快：Fortune Business Insights 认为边缘 AI 将从 2025 年 USD35.60 billion 增至 2034 年 USD445.75
              billion（32.5% CAGR），Global Market Insights 估算为 2025 年 USD25.2 billion 到 2035 年 USD225.5 billion（24.7%
              CAGR），Grand View Research（经 Axis Intelligence）估算为 2025 年 USD24.9 billion 到 2033 年 USD118.7 billion（21.7%
              CAGR）。这些估计在 2025 年约 USD25-36 billion 的基数上相当集中，但终值因口径和时间窗不同而明显分化；应交叉校验，而不是简单平均。


              第二个视角是 SiMa.ai 自己推向市场的 Physical AI。MarketsandMarkets 估算狭义 Physical AI 计算 / 软件层到 2032 年达到 USD15.24
              billion，并从 2026 年起以 47.2% CAGR 增长；更宽的 Physical AI 生态估计（所有机器人、自主机器与基础设施）在 2026 年约 USD383 billion，2040
              年进入数万亿美元；AI 机器人市场则预计从 2025 年 USD6.11 billion 增至 2030 年 USD33.39 billion。第三个汽车视角也直接相关，因为 SiMa.ai
              设有汽车业务单元，并与 Synopsys 合作：MarketsandMarkets 估算汽车 AI 市场从 2025 年 USD18.83 billion 增至 2030 年 USD38.45
              billion（15.3% CAGR），汽车 AI SoC 细分到 2034 年约 USD13.0 billion（15.6% CAGR），ADAS 市场从 2021 年 USD20.73 billion 增至
              2030 年 USD74.57 billion。诚实结论是分层的：直接 SAM 看边缘 AI 硬件，需求方向看 Physical AI 与机器人，汽车 / ADAS
              则是体量大、既有玩家重的相邻市场。保留的公开来源没有隔离 SiMa.ai 自身可服务份额，因此这些数字界定机会边界，而不是公司收入。
