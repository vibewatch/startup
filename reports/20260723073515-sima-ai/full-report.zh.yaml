      - number: '3.2'
        title: 竞争对手画像、规模与融资
        blocks:
          - type: paragraph
            body: >-
              同行在规模和财务健康上差异很大，这一点重要，因为边缘 AI 芯片资本开支重、设计导入周期长。NVIDIA 几乎不受约束：Jetson 由一个万亿美元业务版图供血，并拥有主导开发者生态。Ambarella
              是最健康的独立可比公司，披露 2026 财年收入创纪录达 USD390.7 million，其中约 80% 来自边缘 AI，累计出货超过 42 million 颗边缘 AI SoC，并与 Hanwha
              签有多年协议，收入机会为 USD800 million。Blaize 于 2025 年 1 月通过与 BurTech 的 SPAC 合并上市，披露 2025 年收入 USD38.6 million（高于 2024
              年的 USD1.6 million），这是其首个完整商业收入年度，收入集中在智慧城市、公共安全和主权 AI 部署。


              私人同行中，Hailo 是警示案例：它 2021 年成为独角兽，2024 年 4 月通过 USD120 million Series C 延展轮达到 USD1.2 billion 估值；到 2026
              年初，其估值腰斩至低于 USD500 million，裁员约 10%，并寻求困境 SPAC 合并以获得生存资本。EdgeCortix 已融资超过 USD110 million（Series B
              加补助和债务），正在放大 SAKURA-II 加速器，并规划下一代 SAKURA-X 小芯片路线图。面对这一阵容，SiMa.ai 累计融资约 USD355 million，据报在 2025 年 8 月
              Series C 后估值约 USD1.4 billion；但与 Ambarella 和 Blaize 不同，它不披露收入，因此规模只能由融资额和产品里程碑衡量，而非出货或销售。
