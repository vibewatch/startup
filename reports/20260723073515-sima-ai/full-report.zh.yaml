  summary: >-
    SiMa.ai 是一家无晶圆厂边缘 AI 半导体公司，2018 年成立，总部位于加州 San Jose。公司销售全栈 “Physical AI” 平台，把专用芯片（MLSoC，第二代品牌为 Modalix，采用 TSMC N6
    工艺）与 Palette 软件套件（SDK、无代码 Edgematic 工具、端侧 LLM 框架 LLiMa，以及 2026 年推出的智能体式 Palette Neat 环境）打包。Modalix 于 2025 年 8
    月量产，可在约 10 瓦以内运行 LLM、Transformer、CNN 和生成式 AI。自 2018 年以来，公司大约经历九到十轮融资，累计融资约 USD355 million，最新一轮是 2025 年 8 月由 Maverick
    Capital 领投、超额认购的 USD85 million Series C，并在约 2026 年 4 月获得 Micron 战略投资。公司瞄准机器人、汽车、工业自动化、航空航天与国防、智能视觉和医疗，代表性合作包括
    STIGA、TRUMPF、LTTS、VVDN 和 Synopsys。
