  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai 站在两条长期顺风的交汇处：AI 推理从云端迁移到边缘，以及机器人、汽车、工业自动化、航空航天与国防、智能视觉和医疗健康中的「物理
              AI」兴起。多头论点有四根支柱。第一，节能边缘推理的可服务市场大且在增长，而 NVIDIA 的数据中心经济性无法干净套进嵌入式功耗和热预算。第二，Modalix MLSoC（基于 TSMC N6）与
              Palette 软件套件形成差异化产品；SiMa 将其定位为单芯片、低功耗平台，覆盖传统计算机视觉、端侧生成式和推理模型。第三，真实的商业和战略验证：标志性合作（STIGA 机器人割草机、TRUMPF AI
              激光器、LTTS、VVDN、Synopsys 汽车）、Modalix SOM 获得 2026 Edge AI and Vision Alliance Product of the Year 奖，以及 2026 年
              4 月 Micron 战略投资叠加超额认购的 Series C。第四，由 CEO Krishna Rangasayee（前 Xilinx SVP、前 Groq
              COO）带领、具备半导体原生能力的可信创始团队，并获得顶级投资方支持（Maverick Capital、Fidelity、Point72、Dell Technologies
              Capital、StepStone）。反论点同样具体。SiMa 不披露收入、毛利率、现金消耗或资金续航，因此报道中约 USD1.4 billion 的估值没有公开财务锚；第三方收入估算约 USD35.5
              million，意味着相对公开纯可比公司 Ambarella 约 5x–8x 市销率，SiMa 前瞻倍数约 28x–39x。NVIDIA 的 Jetson 和 CUDA / JetPack
              生态根深蒂固；Hailo 近乎崩塌（估值据报低于 USD500 million）和 Blaize 的持续经营警告，展示了边缘 AI 硅片经济性会多快破裂。没有公开的 Modalix 代际 MLPerf
              结果独立验证单位功耗性能主张，汽车垂直又被 SiMa 尚未公开证明的 ISO 26262 认证卡住。因此，当前估值定价的是尚未独立可见的执行。
