      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai 所处的是硬件中监管最重的角落之一。美国商务部工业与安全局（BIS）自 2022 年以来不断升级先进计算半导体和制造设备出口管制，并在 2026 年成文化许可证审查流程，使中国 /
              澳门准入保持严格受限，增加客户尽调、出货比例和报告义务，并且（据法律分析）对受管制芯片叠加新关税和认证要求。对于面向全球机器人、工业和汽车客户的边缘 AI
              设计商，这些管制既缩小中国可服务市场，也抬高合规成本和转移责任风险。在汽车领域，ISO 26262 功能安全认证（ASIL 等级，其中 ASIL C/D 要求锁步 CPU、ECC、FMEDA
              和可追溯安全架构）是设计导入的事实门槛；AI 特定指南（ISO/PAS 8800、SOTIF/ISO 21448）仍在成熟中——SiMa 尚未公开证明自己跨过该门槛。医疗健康（FDA）和航空航天 /
              国防（ITAR、采购安全）又施加进一步认证。法律层面，SiMa 发布了隐私政策（最后更新于 2025 年 11 月）管理数据处理；作为无晶圆厂设计商，它也面对半导体行业标准的专利侵权和 IP
              诉讼暴露，尽管目前未公开发现针对 SiMa 的重大诉讼。因此，主导监管风险是市场准入和认证摩擦，而不是当下的主动执法。
