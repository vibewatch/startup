  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础细分、垂直领域与渠道
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai 面向「嵌入式边缘」——介于云数据中心和低功耗个人设备之间的计算层——目标工作负载功耗大致在
              5W–25W。公司公开声明的目标垂直领域包括机器人、汽车和出行、工业自动化、航空航天与国防、智能视觉和医疗健康；早期公司表述还把医疗健康、智能零售、自动驾驶汽车、政府和机器人列为优先应用。买方通常是把
              Modalix MLSoC 或系统级模组嵌入机器人、摄像头、车辆或工业机器的 OEM 或系统集成商，最终用户则是运营这些机器的企业，因此付款方和使用方通常不同。商业化路径
              混合了直接企业销售和分销渠道——Macnica（日本 / APAC）、Enclustra、ThinkRobotics 转售模组和开发套件——以及工程 / 解决方案伙伴，如 L&T Technology
              Services（出行、医疗健康、工业自动化、机器人）、VVDN（设计和制造）、Synopsys（汽车工具链）和 AWS（Edgematic 云集成）。地域上，公司总部在 San Jose，但明确将 2025 年
