              模组引脚和软件兼容），也是生态重力井——同样的兼容性降低采用难度，也让客户在 SiMa 失手时回到 NVIDIA。供给侧，SiMa 依赖 TSMC（晶圆厂）、Arm 和 Synopsys（IP
