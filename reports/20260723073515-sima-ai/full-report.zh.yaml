      - number: '8.2'
        title: 建议、信心与评级
        blocks:
          - type: paragraph
            body: >-
              建议是在报道的约 USD1.4 billion 入场价下继续研究，且带条件；对定性论点的信心为中等，对价格的信心为低。SiMa.ai 的战略故事在结构上有吸引力，但没有任何披露的收入、利润率、现金消耗
              或资金续航，用公开证据无法支撑出手决定：入场倍数无法计算，可用锚点只有第三方收入估算（约 USD35.5 million）和远低于隐含私人倍数的公开同行倍数。估值立场偏贵，且很大程度缺少已披露基本面支撑：按估算
              USD35.5 million 收入，报道估值隐含约 28x–39x 前瞻收入；而最接近的公开纯可比公司 Ambarella 交易在约 5x–8x
              市销率，困境同行（Hailo、Blaize）则展示了增长或经济性不及预期时的下行。风险评级为高，主因包括 NVIDIA 带来的竞争替代风险、资本密集型无晶圆厂 模式中的融资和现金消耗风险、对 TSMC
              的单一晶圆厂依赖，以及监管 / 认证摩擦（BIS 出口管制、ISO 26262）。最可能退出路径是战略 M&A，而不是近期 IPO；边缘 AI 收购市场活跃（NXP / Kinara、onsemi /
              Synaptics），Micron 也有战略持股。不过由于没有公开进程，退出路径信心较低。三情景模型给出的概率加权价值约 USD965 million，低于报道的 USD1.4
              billion；因此在报道价格下，除非多头情景兑现，否则预期回报为负。只有满足最后一节的尽调条件，建议才会上调为买入。
