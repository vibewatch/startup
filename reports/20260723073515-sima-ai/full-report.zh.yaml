      - number: '8.5'
        title: 可比估值组
        blocks:
          - type: paragraph
            body: >-
              最有信息量的公开可比公司是 Ambarella（NASDAQ AMBA），这是一家无晶圆厂边缘 AI 视觉处理器公司，报告 FY2026 收入 USD390.7 million（增长 37.2%）、毛利率约
              60%、GAAP 净亏损 USD75.9 million、非 GAAP 盈利、现金 USD312.6 million；在约 USD2 billion–USD3 billion 市值区间，它的市销率约
              5x–8x，比 SiMa 隐含的约 28x–39x 低一个数量级。Blaize（NASDAQ BZAI）是警示性公开可比：FY2025 收入接近 USD38.6 million，经营亏损接近 USD103.8
              million，并发出持续经营警告，说明市场会如何否定亏损扩张快于收入的边缘 AI 公司。私营同行中，Hailo 融资超过 USD340 million，但据报估值跌到 USD500 million
              以下，并走向困境 SPAC 路径、伴随裁员；EdgeCortix 完成超额认购的 Series B，总融资超过 USD110 million。M&A 可比交易框定了退出：NXP 以全现金 USD307
              million 收购边缘 AI NPU 初创 Kinara（2025 年 2 月），onsemi 同意以约 USD7 billion 全股票交易收购 Synaptics，以扩展边缘
              AI，证明战略买方意愿强，并愿为差异化边缘 AI IP 支付溢价。行业数据表明，具吸引力增长标的的 AI M&A 收入倍数大致聚集在 25x–30x 区间，部分异常值更高；不过无晶圆厂
              硬件通常低于软件定价。总体看，可比组在已披露基本面上支持远低于报道 USD1.4 billion 的估值，同时承认战略收购方可能为物理 AI 硅片支付稀缺性溢价。
