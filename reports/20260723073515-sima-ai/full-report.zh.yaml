      - number: '7.3'
        title: 运营、供应链与质量风险
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai 的 Modalix MLSoC 采用 TSMC N6（6nm 级）工艺制造，把最关键依赖集中在台湾——全球领先制程、汽车级制造的枢纽。TSMC
              若出现任何中断（自然灾害、台海地缘政治升级、产能分配转向大客户，或贸易限制），都会直接威胁 SiMa 造出产品的能力；在约 2027 年前，Samsung、Intel 或美国 /
              欧洲晶圆厂很难为先进汽车级节点提供有意义的多元化。作为无晶圆厂公司，SiMa 还依赖 OSAT 伙伴做封装 / 测试，依赖 IP 供应商（Arm 核心、Synopsys ARC /
              工具链）支撑架构，依赖分销商和合同制造商（Macnica、Enclustra、VVDN）向客户供货，因此任一层失效都会传导到出货。质量和可靠性风险更高，因为 SiMa
              的目标垂直领域——汽车、工业、国防、医疗健康——要求严格可靠性；安全关键部署中一旦现场失效或召回，声誉后果会很重。一个具体验证缺口又放大了风险：没有公开的 Modalix 代际 MLPerf Inference
              结果（SiMa 第一代 MLSoC 曾出现在 2024 年 MLPerf Inference 4.0 上，但当前产品线没有可比的独立基准），因此醒目的单位功耗性能优势主要依赖公司自报数字，而不是第三方审计结果。
