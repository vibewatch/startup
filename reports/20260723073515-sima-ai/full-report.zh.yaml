            - 8x Arm Cortex-A65 应用处理器，1.4GHz
            - Synopsys ARC EV74 CVU 与 Arm Mali-C71AE ISP
            - 安全片上网络与硬件安全启动
        - id: platform
          label: 内存、I/O 与模块
          modules:
            - 最高 32GB LPDDR5 与 8MB 片上 SRAM
            - PCIe Gen5 x8、4x 10GbE、4x MIPI CSI-2 接口
            - Modalix SoM（8GB / 32GB）与 DevKit 3.0
            - 与 NVIDIA SoM 引脚 / 软件兼容
        - id: sdk
          label: Palette Neat 软件工具链
          modules:
            - Model Compiler 与 Neat Library
            - sima-cli 安装 / 认证 / 部署工具
            - 支持 ONNX 和 PyTorch 模型
            - GitHub 模型库（SiMa-ai/models）
        - id: apps
          label: 开发者与应用工具
