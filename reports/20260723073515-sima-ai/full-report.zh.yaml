      - number: '2.4'
        title: 增长驱动、采用约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai
              所在市场的顺风因素在独立分析机构页面中有充分记录。最主要驱动是延迟：本地推理消除云端往返，对机器人、机器视觉和安全关键控制是决定性因素。数据隐私和主权要求敏感视频、工业和医疗数据留在设备上，以满足监管。能效——SiMa.ai
              每瓦性能叙事的核心——让 AI 能在电池供电和受散热约束的产品上运行。IoT 和 5G 连接扩散（全球 5G 连接数 2023 年升至 1.76 billion，预计 2028 年达到 7.9
              billion）扩大了可承载分布式智能的设备基数；端侧生成式与智能体 AI 兴起，也提高了每台边缘设备必须处理的计算强度。


              约束同样实质，也是可触达市场低于表面 TAM 的原因。安全是双向的：边缘部署扩大攻击面，并增加安全启动和监控成本。异构硬件 / 软件之间的生态碎片化和互操作问题拖慢部署，也抬高切换风险。边缘 AI
              集成技能短缺、工业 / 汽车严格监管与功能安全要求、先进边缘芯片高成本和长设计导入周期，都会拉长采用。最上层是竞争结构：NVIDIA 在边缘机器人计算中占主导，多数边缘 AI
              芯片挑战者难以放大。因此，市场增长比持久拿份额更容易证明。对估值而言，这意味着市场确实大且在扩张，但 SiMa.ai 据报 ~USD1.4 billion 的估值最终必须由设计导入和收入支撑，而不是只靠 TAM。
