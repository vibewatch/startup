      - number: '5.2'
        title: Modalix 架构和运行模式
        blocks:
          - type: paragraph
            body: >-
              Modalix 是一颗异构系统级芯片，采用 TSMC N6 工艺，封装尺寸为 25mm x 25mm。计算部分围绕专用机器学习加速器展开，提供 25、50、100、200 INT8 TOPS 档位，支持
              INT8、INT16、BFLOAT16 精度，覆盖 CNN、Transformer、LLM 和生成式推理；应用处理器复合体则由 8 个 Arm Cortex-A65 核心组成，运行频率
              1.4GHz。视觉和信号处理由四核 Synopsys ARC EV74 计算机视觉单元和 Arm Mali-C71AE 图像信号处理器承担，安全片上网络 以高带宽连接各模块。内存包括模组上最高 32GB
              LPDDR5 加 8MB 片上 SRAM，连接能力包括 PCIe Gen5 x8、4 个 10GbE 端口、4 路 MIPI CSI-2 摄像头接口，以及 H.264、H.265、AV1 最高 4Kp60
              的硬件视频编解码。安全由带信任根和 OTP 密钥支持的硬件安全启动兜底。SiMa.ai 称，50-TOPS 配置在低于 10W 的功耗包络内，单位功耗性能超过替代方案 10 倍以上——Modalix
              追求效率优先，而不是峰值吞吐，这正是它相对高功耗主流模组的定位核心。
