      - number: '1.5'
        title: 里程碑与负面信号
        blocks:
          - type: paragraph
            body: >-
              公司时间线连贯，且由产品推进。SiMa.ai 2018 年以硬件-软件协同设计假设创立；约 2022 年推出其称为行业首个带完整软件栈的专用 MLSoC；2023 年把第一代 MLSoC 推入生产部署；2024
              年发布 Modalix MLSoC 和 Palette Edgematic 无代码工具；2025 年则用 Modalix SoM 与 LLiMa 框架把生成式 AI 带到端侧，并完成 Series
              C。融资时间线从 2020 年 Series A 延伸到 2025 年 8 月 Series C 和 2026 年 4 月 Micron 战略投资；2026 年公司又推出 Palette Neat
              作为智能体式开发环境。


              负面框架对尽调同样重要。第一是估值不透明：公司拒绝披露 Series C 估值，广泛引用的 ~$1.4 billion 数字基于匿名信源而非公司声明，同时报道的 “>$100M” 轮次规模与官方 “$85M”
              冲突。第二是竞争强度：SiMa.ai 所处市场由 NVIDIA 占据主导份额，即便 Hailo 这类融资充足的边缘 AI 对手，也被描述为难以在 NVIDIA
              生态面前把试点转成规模；这对任何挑战者都是结构性逆风。第三是披露缺口：联合创始人记录不完整、当前财务与员工指标缺失、股权结构经济条款未披露，都意味着股权故事依赖尚未进入公开来源的私人数据。
