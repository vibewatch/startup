      - number: '5.4'
        title: 差异化、IP 与供应依赖
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai 的差异化有三层：单芯片多模态集成（视觉与生成式模型在同一颗芯片上运行）、效率优先的设计点（10W 以下实现 50+ TOPS，并宣称单位功耗性能优势达 10x），以及通过 Palette 和
              Edgematic 打造的软件优先开发体验，用来降低拼装离散流水线的集成摩擦。关键在于，这种差异化锚定在授权和外包模块上，而不是完全自有硅资产：CPU 复合体使用 Arm Cortex-A65
              核心，计算机视觉单元使用 Synopsys ARC EV74 IP，芯片由 TSMC 以 N6 工艺制造，内存依赖 LPDDR5 供应商。SiMa.ai 还在 2024 年 12 月与 Synopsys
              达成汽车边缘 AI 开发战略合作，与 L&T Technology Services 合作交付物理 AI 解决方案，并借助 AWS 做云托管开发。因此，护城河不太来自专有制程或 CPU
              IP，而更多来自集成、编译器和运行时软件，以及开发者生态——这些资产真实存在，但可复制，也依赖第三方。SiMa.ai 公开维护 GitHub 组织（模型库和 Palette
              Neat），可作为开发者采用信号，只是外部社区贡献深度尚未建立。
