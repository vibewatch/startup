      - number: '1.4'
        title: 规模、布局与牵引力
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai 把自己呈现为全球分布式运营。公司称以 San Jose 总部为核心，在八个国家设有办公室；公布的办公室清单包括美国（San
              Jose）、德国（Stuttgart）、印度（Bengaluru）、以色列（Modiin）、日本（Tokyo）和韩国（Seoul）等。商业进展以垂直行业而非硬收入描述：公司反复点名机器人、汽车、工业自动化、航空航天与国防、智能视觉和医疗作为目标及活跃市场，并列举早期部署，如机器人领域的自主移动机器人和机器人割草机制造商
              STIGA，以及与 Synopsys（汽车边缘 AI）和 L&T Technology Services（LTTS）的战略工程与商业化联盟。


              公开记录没有给出截至本报告日期仍准确的一组核心运营指标。2026
              年收入或收入年化运行率、累计出货量、毛利率和可核验当前员工数都未披露；投资者材料与数据库只提供“客户采用增长”等定性表述。由于员工数、收入和客户数都是波动事实，并会锚定烧钱速度和牵引力分析，本概览把它们列为明确缺口，并给出具体尽调路径，而不是导入未经验证的数字。简言之，SiMa.ai
              看起来是一家真实的跨国边缘 AI 供应商，有实际设计导入动能和标杆伙伴，但其规模目前由地域、垂直行业和合作关系支撑，而不是由审计财务或出货指标证明。
