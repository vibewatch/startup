            body: >-
              在信任和安全上，Modalix 实现带信任根和 OTP 密钥配置的硬件安全启动，其片上网络也被描述为安全互连——这些控制适合汽车和国防部署。Edgematic 的云托管评估定位为企业级，强调数据隐私和控制，运行在
              AWS 上；平台支持端侧推理，使敏感数据在运行时留在本地。ONNX 和主流框架支持降低了模型层锁定，2024 年 12 月与 Synopsys
              的汽车合作也释放了满足汽车级工具链预期的意图。实质性的质量和验证缺口在基准测试：SiMa.ai 第一代 MLSoC 列入 MLPerf Inference 4.0，但截至 2026 年中，尚无 Modalix
              代际的公开 MLPerf 结果，也没有独立的现场可靠性或功能安全认证数据。GenAI（LLiMa）和 Edgematic 是技术栈中最新、最少被验证的层。对承销方而言，安全架构纸面上可信，但量产 Modalix
              代际的独立性能、可靠性和安全验证仍是未完成的尽调项。
