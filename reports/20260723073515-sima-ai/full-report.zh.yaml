        title: 成本结构、毛利率与资本强度
        blocks:
          - type: paragraph
            body: >-
              作为无晶圆厂设计公司，SiMa.ai 的成本结构主要由研发、TSMC 先进制程流片和掩膜成本（Modalix 采用 N6 工艺）以及库存驱动，而不是自有制造。每一代 MLSoC
              都需要新的先进制程流片，并在产生收入前持续投入软件，因此该结构资本强度高。SiMa.ai 不披露财务，其可能的利润率路径只能用上市同行代理。Ambarella——最健康的无晶圆厂边缘 AI 可比公司——报告
              2026 财年收入创纪录达 USD390.7 million（同比增长 37.2%），GAAP 毛利率 59.2%、non-GAAP 毛利率 60.7%，但仍录得 GAAP 净亏损 USD75.9
              million，non-GAAP 运营费用因人力和 SoC 开发成本上升约 12.9%。另一家上市纯玩家 Blaize 披露 2025 财年收入约 USD38.6 million，经营亏损约 USD103.8
              million。读数是：边缘 AI 无晶圆厂专门公司毛利率大致在 50% 中段到 60% 中段，明显低于 NVIDIA 70% 以上、由规模驱动的毛利率；达到 Ambarella 规模收入也不足以实现 GAAP
              盈利。因此，即便需求环境有利，SiMa.ai 仍要走一条漫长且耗资的利润率成熟路径。
