      - number: '3.3'
        title: 能力、定价与商业化对比
        blocks:
          - type: paragraph
            body: >-
              原始能力上，NVIDIA Jetson AGX Orin 以最高 275 TOPS 的峰值吞吐领先，但功耗为 15-60 瓦，更适合性能关键型机器人，而不是严格功耗预算。SiMa.ai 的 Modalix 和
              Hailo 芯片在相反轴线上竞争：效率。Hailo-10H 以约 2.5 瓦实现约 40 INT4 TOPS（~16 TOPS/W），主打生成式 AI；SiMa.ai 则宣传 50+ TOPS、低于 10
              瓦，并强调在单颗芯片上跑完整流程（视觉加生成式模型）。Ambarella 赢在超低功耗 AI 摄像头细分（高分辨率视频下低于 2W），Blaize 以可编程图流架构和易编程性区分自己，EdgeCortix
              则靠软件优先的 Dynamic Neural Accelerator 加 MERA 编译器。Qualcomm 的 Robotics RB5 约 15 TOPS、功耗 5-15 瓦，并有强连接集成。


              价格上，SiMa.ai 在多数同行不透明的地方给出清晰口径：1K 件量级下系统级模组为 USD349（8GB）和 USD599（32GB），开发套件为 USD1,499。NVIDIA Jetson
              开发套件定价相近，但背后有更深、更免费、教学广泛的软件生态，这正是商业化竞争的核心。SiMa.ai 的回应是 Palette——一套软件优先、低代码工具链（包括 Edgematic 和端侧 LLM 框架
              LLiMa），旨在降低集成摩擦——以及一个能缩短评估周期的伙伴生态（Arm、TSMC、Synopsys、L&T Technology Services、Enclustra、分销商
              Macnica）。比较显示，SiMa.ai 在效率和单芯片集成上有竞争力，但必须顶住在位者的生态重力，也要面对多个同行已经批量出货的事实。
