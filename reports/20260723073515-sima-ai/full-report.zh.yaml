      - number: '8.6'
        title: 退出准备度、论点失效触发点与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              退出准备度仍早。SiMa 是一家私营、披露前公司，没有公开收入、没有经审计财务，也没有宣布 IPO 流程；现实退出是战略 M&A，买方群体（NXP、onsemi、Qualcomm、Renesas 等大型模拟 /
              嵌入式厂商，以及作为战略伙伴的 Micron）活跃，并愿为边缘 AI IP 支付溢价，Kinara 和 Synaptics 交易已经说明这一点。鉴于缺少披露规模，且 Blaize 在公开市场反响不佳，近期 IPO
              不太可能。主要论点失效触发点包括：降估值融资或平价融资否定报道估值（Hailo 先例）；设计丢单输给 NVIDIA Jetson，使 SiMa 被限制在小众市场；收入持续低于约 USD40
              million，使任何溢价倍数都站不住；到约 2027 年仍未取得 ISO 26262 汽车认证，关闭既定增长垂直；TSMC N6
              配额丢失或台湾中断导致停产；以及现金耗尽、被迫困境融资。每一项都是离散、可监测的终止标准。最终尽调要求按优先级排序为：（1）经审计收入、毛利率、经营 现金消耗和资金续航；（2）Series C
              条款清单，包括清算优先权、参与权和优先级，加完整股权结构表和稀释历史；（3）按金额加权的设计赢单管线、 量产时间表和客户集中度；（4）晶圆厂和 OSAT 第二来源认证路线图；（5）独立 Modalix
              代际基准。满足要求（1）和（2）是门槛条件；没有它们，报道估值无法验证，建议仍是继续研究而不是买入。
