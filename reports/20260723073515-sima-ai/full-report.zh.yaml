      - number: '8.3'
        title: 融资、估值背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai 自 2018 年以来约九轮合计融资约 USD355 million，最高到 2025 年 8 月由 Maverick Capital 领投的 USD85 million Series
              C，StepStone Group 加入，Micron Ventures 参与；该轮被描述为超额认购。公司没有确认融资后估值数字；约 USD1.4 billion 的估值来自归因于 The Information
              的报道，并被二级市场追踪平台重复引用，而其他私募市场追踪平台给出显著不同的锚（例如 2025 年中时间戳的 USD960 million 估值，以及约 2.7x 的估值 /
              融资资本效率比），说明该数字既非官方，也没有被一致报道。Micron 2026 年 4 月战略投资（金额未披露）是定性验证，但不能形成可验证标记。披露缺口约束了入场纪律。由于 SiMa
              是私营且未审计，投资人看不到约 USD355 million
              优先股资本所附的清算优先权堆栈、参与权或优先级；在下行情景退出中，优先权悬置可能在普通股和后期投资人回本前吸收大部分甚至全部收益，在温和收入基数上叠加庞大累计优先权，是典型的后期风险。稀释很可能继续：一家不披露盈利能力、资本密集的
              无晶圆厂半导体公司仍需后续融资，每一轮都会稀释现有持有人，并可能把新优先权堆栈置于早期资金之上。因此，有纪律的入场姿态应把报道的 USD1.4 billion 视为未经验证的上限，要求 Series C
              条款清单和股权结构表，并在获得经审计财务和优先权条款前，按概率加权价值（约 USD965 million）而非报道头条数字定价。
            claimRefs:
