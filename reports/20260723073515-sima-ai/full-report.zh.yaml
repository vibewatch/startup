            body: >-
              SiMa.ai 的扩张动作是典型的先落地再扩张，横跨垂直领域和地域：先拿下初始设计导入（如 STIGA 机器人割草机、TRUMPF
              工业激光器），再把同一套硅片加软件平台扩展到相邻用例（AMR、人形机器人、ADAS、智能视觉、医疗健康）和新地区（韩国、日本、欧洲、美国），资金来自 2025 年 8 月 Series
              C。集中度风险无法直接衡量，因为 SiMa 不披露单客户收入；但定性图景显示，公司高度依赖早期旗舰合作和伙伴 / 分销渠道：L&T Technology Services 和 VVDN
              承担解决方案交付与制造，Macnica、Enclustra、ThinkRobotics 承担分销，因此相当一部分商业化路径经过中介，增加利润分成，也削弱直接客户控制。SiMa
              保守的目标市场采购摩擦显著——汽车、国防和工业买方认证周期长，在承诺放量前要求功能安全和可靠性证据。公司通过让 Modalix
