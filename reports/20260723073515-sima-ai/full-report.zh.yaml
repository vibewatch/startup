  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与品类地图
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai 的竞争集横跨五层。存量巨头层由 NVIDIA 主导，其 Jetson 模组（AGX Orin 最高 275 TOPS，以及更新的 Jetson Thor
              一代）是默认边缘机器人计算平台，CUDA-X 和 JetPack 软件栈进一步加固了这一地位，大多数工程团队已熟悉这套工具；Qualcomm 是另一存量巨头，拥有巨大移动 / IoT 规模和 Robotics
              RB 系列平台。直接同类层是一批与 SiMa.ai 最相似、由风险资本支持的边缘 AI 芯片初创公司：Hailo（以色列，2017 年成立）、Blaize（现已在 Nasdaq 以 BZAI
              上市）、EdgeCortix（日本）和 Axelera AI（欧洲）。Ambarella 位置不同，它是上市纯玩家，已把成熟的摄像头 SoC 业务转向边缘 AI，并正在放大真实收入。


              除具体厂商外，SiMa.ai 也与替代方案和现状竞争：改造通用 SoC 和应用处理器、嵌入式 GPU、FPGA；对于尚未被迫迁移到边缘的团队，则还有继续依赖云端推理。对大型 OEM
              和超大云厂商来说，内部自研是真实替代，因为它们能设计定制芯片（Tesla、Google、Amazon 和 Apple 在相邻领域已经这样做）。未来可能进入者包括超大云厂商的边缘推理芯片，以及 Mobileye
              等汽车专用玩家向同一芯片位下探。实际含义是，SiMa.ai 不只是和几家初创公司打；它要在拥挤同类对手争抢相同设计导入的同时，替换一个软件加芯片都深度扎根的在位者。
