      - number: '7.5'
        title: 财务与商业模式风险
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai 的财务风险被不透明放大。公司不披露收入、毛利率、月度现金消耗、现金余额或资金续航，因此承销方无法验证资本充足性、单位经济性或盈利路径，只能完全借用公开同行做代理。同行读数并不轻松：Blaize
              报告 FY2025 收入约 USD38.6 million，经营亏损接近 USD103.8 million，并发出持续经营警告；Ambarella——最健康的无晶圆厂边缘 AI 可比公司——收入创纪录、接近
              USD390.7 million，毛利率约 60%，但 GAAP 净亏损仍约 USD75.9 million。由此可读出，边缘 AI 无晶圆厂公司毛利率明显低于 NVIDIA 的 70%+，即便达到
              Ambarella 规模的收入，也不足以实现 GAAP 盈利；这意味着 SiMa 面对的是漫长、吃资本、反复稀释的路径。资本强度是结构性的：每一代 MLSoC 都需要在 TSMC
              先进节点重新流片，并在产生收入前持续投入软件。估值风险很尖锐：SiMa 有一个据报道但未经公司确认的 Series C 后估值，接近 USD1.4
              billion，却没有披露收入锚定倍数，因此隐含收入倍数无法计算，独角兽标签更多建立在私人市场情绪上，而不是基本面。整合后的财务论点失效触发点，是资金续航 到期前无法以非惩罚性条款完成下一轮融资。
            claimRefs:
              - CR028
              - CR029
              - CR030
              - CR031
