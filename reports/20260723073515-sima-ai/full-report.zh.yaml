chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai 是一家无晶圆厂边缘 AI 半导体公司，总部位于加州 San Jose 的 333 W. San Carlos St., Suite 1100。公司成立于 2018 年，出发点是下一轮 AI
              将在边缘而非云端取胜。公司把自身品类称为 “Physical
              AI”：机器智能嵌入看得见、会移动、能行动的设备，例如机器人、无人机、车辆、摄像头和工厂设备；这些场景无法接受云端延迟。它把自己定位为完整系统供应商，而不是单点芯片卖家。


              商业产品是两层全栈平台，公司称为 “SiMa.ai ONE”。硬件层是 MLSoC（Machine Learning System-on-Chip），第二代品牌 Modalix 于 2025 年 8
              月量产；该芯片采用基于 Arm 的架构和 TSMC N6 工艺，支持 CNN、Transformer、LLM 和生成式 AI 工作负载，功耗低于 10 瓦。软件层是 Palette 套件，包括 SDK、无代码 /
              低代码 Edgematic 可视化工具、端侧 LLM 框架 LLiMa，以及 2026 年推出的智能体式 “Palette Neat” 环境。商业模式是芯片加软件产品销售：SiMa.ai
              销售芯片、系统级模组（商业 1K 件定价从 8GB SoM USD349、32GB SoM USD599 起）和开发套件（USD1,499），并配套 Palette
              软件栈。这使它成为一家以硬件牵引的公司，靠机器人、汽车、工业自动化、航空航天与国防、智能视觉和医疗等领域的出货与设计导入变现。
