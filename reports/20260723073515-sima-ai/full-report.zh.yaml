      - number: '5.3'
        title: 部署、集成与路线图
        blocks:
          - type: paragraph
            body: >-
              部署围绕 Palette Neat SDK 和 Edgematic 平台展开。开发者带来 PyTorch 或 ONNX 模型（也可以从 GitHub 模型库选择），用 Palette Model Compiler
              编译，再通过 Edgematic 组装流水线；Edgematic 是基于浏览器的低代码构建器，后端采用 GStreamer，可在云托管的 MLSoC 板卡上测量真实吞吐、延迟和功耗，并部署到 Modalix
              设备。Edgematic 托管在 AWS 上，集成 Amazon SageMaker；开发者门户（developer.sima.ai）发布了由 sima-cli 驱动的、从安装到 GenAI
              的自包含上手路径。上一代模组和 NVIDIA 模组的引脚、软件兼容性，以及解决方案和交付伙伴生态，降低了集成难度。路线图已经从第一代 MLSoC（2024 年 3 月列入 MLCommons MLPerf
              Inference 4.0）推进到 2024 年 9 月发布 Modalix 家族，再到 2025 年 8 月生产硅片和模组落地；LLiMa GenAI 运行时和 Edgematic
              云工具是最新加入的层。尚未公开的是 Modalix 代际的 MLPerf 结果或独立可靠性数据，因此买方仍需直接在硬件上验证集成风险和真实吞吐。
