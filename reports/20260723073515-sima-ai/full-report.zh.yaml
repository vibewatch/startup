      - number: '8.4'
        title: 情景分析——多头、基准与空头
        blocks:
          - type: paragraph
            body: >-
              由于 SiMa 不披露收入，下方情景基于第三方收入估算（约 USD35.5 million）和边缘 AI 行业基准构建，前瞻退出估值则从公开同行和 M&A 倍数推断；任何情景都无法用 SiMa
              财务独立验证。多头情景（赋予约 25%）：Modalix 设计导入在机器人、工业和汽车中转化为量产，收入到 2028 年逼近约 USD150 million，物理 AI 定位吸引战略收购方，退出以约
              10x–17x 的溢价倍数打印，产生约 USD1.5 billion–USD2.5 billion。基准情景（约 45%）：设计导入稳定但转化较慢，收入增长到约 USD80
              million，市场给予高个位数到低双位数的混合边缘 AI 倍数（以 Ambarella 的 5x–8x 为锚，叠加适度增长溢价），产生约 USD0.6 billion–USD1.0
              billion，等于或低于报道入场价。空头情景（约 30%）：NVIDIA 生态把 SiMa 限制在小众市场，汽车认证滑坡，关键客户或晶圆厂中断咬伤业务，收入停滞在约 USD40 million 以下，SiMa
              被迫进入稀释性降估值融资或类似 Hailo 的困境流程，产生约 USD0.2 billion–USD0.5 billion。概率加权价值约 USD965 million，低于报道的 USD1.4 billion
              入场价。敏感性分析显示，只有高收入和持续溢价倍数同时成立，才能支撑报道价格；按公开同行倍数，报道估值在合理收入区间内都缺少支撑。会把 SiMa 推向空头情景的下行触发点，列在论点失效表中。
