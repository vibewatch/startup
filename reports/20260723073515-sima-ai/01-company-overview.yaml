- id: scale-footprint-and-traction
  title: Scale, Footprint, and Traction
  body: 'SiMa.ai presents itself as a globally distributed operation. The company says it runs from its San Jose headquarters with offices across eight countries, and its published office list names the United States (San Jose), Germany (Stuttgart), India (Bengaluru), Israel (Modiin), Japan (Tokyo), and Korea (Seoul) among them. Commercial traction is described in vertical terms rather than hard revenue: the company repeatedly names robotics, automotive, industrial automation, aerospace & defense, smart vision, and healthcare as its target and active markets, and it points to named early deployments such as autonomous mobile robots and robotic lawn-mower maker STIGA in robotics, plus strategic engineering and go-to-market alliances with Synopsys (automotive edge AI) and L&T Technology Services (LTTS).


    What the public record does not provide is a run-date-accurate set of core operating metrics. There is no disclosed 2026 revenue or run-rate, no unit-shipment total, no gross-margin figure, and no verifiable current headcount; investor materials and databases give only qualitative "growing customer adoption" language. Because headcount, revenue, and customer counts are volatile facts that anchor burn and traction analysis, the overview treats them as explicit gaps with a concrete diligence path rather than importing an unverified number. In short, SiMa.ai looks like a genuine multinational edge-AI vendor with real design-win momentum and marquee partners, but its scale is currently evidenced through geography, verticals, and partnerships rather than through audited financial or shipment metrics.'
