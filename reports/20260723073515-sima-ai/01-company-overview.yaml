  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: A company-confirmed Series C post-money valuation and the exact round size (official $85M vs reported >$100M).
    whyItMatters: The unicorn thesis and every valuation-chapter multiple depend on a figure the company declined to disclose and that third parties report inconsistently.
    diligencePath: Request the Series C term sheet, share-issuance records, and a 409A or board-approved valuation memo.
    relatedQuestionRefs:
    - QO012
    - QO025
    relatedTableRefs:
    - TO001
    - TO003
  - type: stale
    severity: material
    topic: headcount
    missingEvidence: A run-date-accurate employee count by function and geography.
    whyItMatters: Headcount is a volatile fact and a core proxy for burn and execution capacity, yet no retained source pins it as of 2026-07-23.
    diligencePath: Request a month-end org snapshot or HR-certified headcount as of 2026-06-30 or later.
    relatedQuestionRefs:
    - QO020
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: revenue
    missingEvidence: Any disclosed 2026 revenue, run-rate, gross margin, or unit-shipment volume.
    whyItMatters: Without operating metrics, scale can only be inferred from geography and partnerships, weakening the traction case.
    diligencePath: Request audited or management financials and a shipment/bookings report.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: minor
    topic: leadership
    missingEvidence: Independent corroboration of the co-founder slate (Manish Garg, Yann Lepenant, Manu Prasad) and full current management roster.
    whyItMatters: The founding-team narrative and technical bench depth cannot be verified from retained public records.
    diligencePath: Confirm founders and officers against incorporation documents, equity records, and LinkedIn/press bios.
    relatedQuestionRefs:
    - QO007
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: Milestone table
    missingEvidence: Exact day-level dates for several product launches and the undisclosed Micron investment amount in the milestone chronology.
    whyItMatters: The overall chronology is strong, but some product entries are anchored at year/month granularity rather than announcement dates.
    diligencePath: Request the company's internal milestone tracker and original announcement dates.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO004
