- id: leadership-governance-and-board
  title: Leadership, Governance, and Board
  body: 'Leadership is anchored by founder and CEO Krishna Rangasayee. His public biography is unusually deep for a hardware startup: nearly 18 years at Xilinx, where he rose to Senior Vice President and GM of the overall business and then Executive Vice President of Global Sales, followed by a stint as COO of AI-chip company Groq, plus prior roles at Altera and Cypress Semiconductor and 25-plus international patents. That founder-market fit — a sales-and-operations leader from the FPGA world who has scaled a multibillion-dollar semiconductor business — is central to the investment thesis and also concentrates meaningful key-person dependence on a single executive.


    The board and management bench reinforce the semiconductor pedigree. The board is chaired by Moshe Gavrielov, the retired Xilinx CEO who also sits on the TSMC, Cadence, and NXP boards, and includes Intel CEO and former Cadence chief Lip-Bu Tan, Scott Darling (Dell Technologies Capital), Andrew Homan (Maverick Capital), Jake Flomenberg (Wing Ventures), and Mike Dauber (Amplify Partners). Operating leadership includes Harry Kroeger as President of Automotive, who brings management-board experience from the Bosch-Daimler orbit and prior board roles at Tesla and Rivian. A notable diligence gap is the co-founder slate: company materials describe SiMa.ai being started by a founding team, and the mandate for this report names Manish Garg (CTO), Yann Lepenant (Chief Architect), and Manu Prasad (EVP Engineering) as co-founders, but independent public records consistently name only Rangasayee as founder, so the additional co-founders remain company-provided rather than independently corroborated.'
