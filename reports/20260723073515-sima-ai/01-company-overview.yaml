company:
  name: SiMa.ai
chapter:
  number: 1
  title: Company Overview
  summary: 'SiMa.ai is a San Jose-based edge-AI semiconductor company founded in 2018 that sells a full-stack "Physical AI" platform combining its MLSoC (branded Modalix, now in production) with its Palette software suite. Public evidence supports a clear capital story: an $85 million oversubscribed Series C on August 1, 2025 led by Maverick Capital with StepStone Group, lifting disclosed total funding to $355 million, plus a separate April 2026 Micron Technology strategic investment of undisclosed size. The company is widely tracked as a unicorn, with The Information reporting a targeted ~$1.4 billion valuation (a 45% premium over a prior ~$960 million mark), even though SiMa.ai itself declined to disclose the Series C valuation. Leadership centers on founder-CEO Krishna Rangasayee, an ex-Xilinx and ex-Groq executive, backed by an experienced board, while the wider co-founder slate and current run-rate metrics remain only partially disclosed.'
sections:
- id: identity-and-business-model
  title: Identity, Headquarters, and Business Model
  body: 'SiMa.ai is a fabless edge-AI semiconductor company headquartered at 333 W. San Carlos St., Suite 1100, San Jose, California, and founded in 2018 on the thesis that the next era of artificial intelligence would be won at the edge rather than in the cloud. The company brands its category "Physical AI" — machine intelligence embedded in devices that see, move, and act in the physical world, such as robots, drones, vehicles, cameras, and factory equipment where cloud latency is not acceptable. It positions itself as a full-system supplier rather than a point silicon vendor.


    The commercial offering is a two-layer, full-stack platform the company markets as "SiMa.ai ONE." The hardware layer is the MLSoC (Machine Learning System-on-Chip), whose second generation is branded Modalix and entered production in August 2025; it supports CNNs, transformers, LLMs, and generative-AI workloads under 10 watts on an Arm-based architecture built on TSMC''s N6 process. The software layer is Palette, a suite that includes an SDK, the no-code/low-code Edgematic visual tool, the LLiMa on-device LLM framework, and the 2026 agentic "Palette Neat" environment. The business model is silicon-and-software product sales: SiMa.ai sells chips, System-on-Modules (with commercial 1K-unit pricing starting at $349 for an 8GB SoM and $599 for a 32GB SoM) and developer kits ($1,499), pairing them with the Palette software stack. This makes it a hardware-led company monetizing through unit shipments and design wins across robotics, automotive, industrial automation, aerospace & defense, smart vision, and healthcare.'
