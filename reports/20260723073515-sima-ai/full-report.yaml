  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >
      Nine headline metrics framing the entry decision. The reported valuation and implied multiple sit far above the
      public-comp multiple, while revenue, burn, and runway are undisclosed - the core reason the recommendation is
      research-more rather than buy.
    data:
      items:
        - label: Reported post-money valuation
          value: ~USD1.4B
          detail: The Information via trackers; company unconfirmed
          tone: warning
        - label: Total funding raised
          value: ~USD355M
          detail: ~9 rounds since 2018
          tone: positive
        - label: Series C (Aug 2025)
          value: USD85M
          detail: Maverick Capital lead; StepStone, Micron Ventures
          tone: positive
        - label: Estimated revenue
          value: ~USD35.5M
          detail: Third-party estimate; company undisclosed
          tone: warning
        - label: Implied forward revenue multiple
          value: ~28-39x
          detail: On reported valuation and estimated revenue
          tone: negative
        - label: Public comp multiple (Ambarella)
          value: ~5-8x P/S
          detail: USD390.7M FY2026 revenue; ~USD2-3B market cap
          tone: warning
        - label: Probability-weighted value
          value: ~USD965M
          detail: Below reported USD1.4B entry price
          tone: negative
        - label: Capital efficiency (val/funding)
          value: ~2.7x
          detail: Per private-market tracker
          tone: neutral
        - label: Burn and runway
          value: Undisclosed
          detail: No public burn, cash balance, or runway
          tone: warning
    approximationNotes: >-
      KPI values combine reported figures, third-party estimates, and public-peer data; undisclosed values require
      data-room access.
