  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >
      Exit valuation across three revenue scenarios (USD40M, USD80M, USD150M) and three multiple tiers (public-comp 8x,
      growth-premium 15x, strategic 25x). The reported USD1.4B entry is justified only under high-revenue, high-multiple
      combinations; at public-comp multiples the reported valuation is unsupported across the plausible revenue range.
    data:
      items:
        - label: Rev USD40M @ 8x (public comp)
          value: 320
        - label: Rev USD40M @ 15x (growth premium)
          value: 600
        - label: Rev USD40M @ 25x (strategic)
          value: 1000
        - label: Rev USD80M @ 8x (public comp)
          value: 640
        - label: Rev USD80M @ 15x (growth premium)
          value: 1200
        - label: Rev USD80M @ 25x (strategic)
          value: 2000
        - label: Rev USD150M @ 8x (public comp)
          value: 1200
        - label: Rev USD150M @ 15x (growth premium)
          value: 2250
        - label: Rev USD150M @ 25x (strategic)
          value: 3750
    approximationNotes: >
      Revenue figures are analyst scenarios anchored to a third-party estimate (~USD35.5M) and sector benchmarks; SiMa
      discloses no revenue. Multiple tiers anchored to Ambarella (~5-8x P/S), a growth premium, and edge-AI M&A
      precedents. All values in USD millions.
