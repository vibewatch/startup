  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >
      Exit valuation ranges for each scenario plus the probability-weighted value and the reported entry price. The bull
      range exceeds the entry price; base sits at or below it; bear implies significant loss. The probability-weighted
      value (~USD965M) is below the reported USD1.4B entry, indicating negative expected return at the reported price.
    data:
      items:
        - label: 'Bull: volume design-in plus strategic premium'
          low: 1500
          mid: 2000
          high: 2500
        - label: 'Base: steady conversion, blended edge-AI multiple'
          low: 600
          mid: 800
          high: 1000
        - label: 'Bear: niche confinement, down-round/distressed'
          low: 200
          mid: 350
          high: 500
        - label: Probability-weighted value (25/45/30)
          low: 800
          mid: 965
          high: 1150
        - label: Reported entry price (reference)
          low: 1400
          mid: 1400
          high: 1400
    approximationNotes: >
      Scenario ranges are analyst estimates; revenue and multiple assumptions are inferred from comparable companies and
      sector M&A. Probability weights (25/45/30) are qualitative judgments pending audited financials. Values in USD
      millions.
