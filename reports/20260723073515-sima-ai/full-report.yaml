  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai sits at the intersection of two secular tailwinds: the shift of AI inference from the cloud to the
              edge, and the emergence of "Physical AI" for robotics, automotive, industrial automation, aerospace and
              defense, smart vision, and healthcare. The bull thesis rests on four pillars. First, a large and growing
              addressable market for power-efficient edge inference where NVIDIA's data-center economics do not
              translate cleanly to embedded power and thermal budgets. Second, a differentiated product in the Modalix
              MLSoC (built on TSMC N6) paired with the Palette software suite, which SiMa positions as a single-chip,
              low-power platform spanning classical computer vision through on-device generative and reasoning models.
              Third, genuine commercial and strategic validation: marquee engagements (STIGA robotic mowers, TRUMPF AI
              lasers, LTTS, VVDN, Synopsys automotive), a 2026 Edge AI and Vision Alliance Product of the Year award for
              the Modalix SOM, and an April 2026 strategic investment from Micron on top of an oversubscribed Series C.
              Fourth, a credible, semiconductor-native founding team led by CEO Krishna Rangasayee (ex-Xilinx SVP,
              ex-Groq COO), backed by top-tier investors (Maverick Capital, Fidelity, Point72, Dell Technologies
              Capital, StepStone). The anti-thesis is equally concrete. SiMa discloses no revenue, gross margin, burn,
              or runway, so the reported roughly USD1.4 billion valuation has no public financial anchor; third-party
              revenue estimates near USD35.5 million imply a roughly 28x to 39x forward multiple against a public
              pure-play comp (Ambarella) at roughly 5x to 8x price-to-sales. NVIDIA's Jetson and CUDA/JetPack ecosystem
              is entrenched, and the near-collapse of Hailo (valuation reportedly below USD500 million) and Blaize's
              going-concern warning demonstrate how quickly edge-AI silicon economics can break. There is no public
              Modalix-generation MLPerf result to validate the performance-per-watt claim independently, and the
              automotive vertical is gated by ISO 26262 certification SiMa has not publicly demonstrated. The valuation
              therefore prices execution that is not yet independently visible.
