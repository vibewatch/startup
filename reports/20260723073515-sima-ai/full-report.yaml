      - number: '8.5'
        title: Comparable Valuation Set
        blocks:
          - type: paragraph
            body: >-
              The most informative public comparable is Ambarella (NASDAQ AMBA), a fabless edge-AI vision-processor
              company that reported FY2026 revenue of USD390.7 million (up 37.2 percent) with gross margins near 60
              percent, a GAAP net loss of USD75.9 million, non-GAAP profitability, and cash of USD312.6 million; at a
              market capitalization in the roughly USD2 billion to USD3 billion range it trades at roughly 5x to 8x
              price-to-sales, an order of magnitude below SiMa's implied roughly 28x to 39x. Blaize (NASDAQ BZAI) is the
              cautionary public comp: FY2025 revenue near USD38.6 million, an operating loss near USD103.8 million, and
              a going-concern warning, illustrating how the market repudiates edge-AI names that scale losses faster
              than revenue. Among private peers, Hailo raised more than USD340 million but saw its valuation reportedly
              fall below USD500 million into a distressed SPAC route with layoffs, while EdgeCortix closed an
              oversubscribed Series B taking total funding over USD110 million. The M&A comparables frame the exit: NXP
              acquired edge-AI NPU startup Kinara for USD307 million in an all-cash deal (February 2025), and onsemi
              agreed to acquire Synaptics in a roughly USD7 billion all-stock transaction to expand in edge AI,
              evidencing strong strategic-buyer appetite and premiums for differentiated edge-AI IP. Sector data
              indicate AI M&A revenue multiples clustering in a roughly 25x to 30x range for attractive growth targets,
              with outliers higher, though fabless hardware typically prices below software. On balance, the comparable
              set supports a valuation well below the reported USD1.4 billion on disclosed fundamentals, while
              acknowledging that a strategic acquirer could pay a scarcity premium for physical-AI silicon.
            claimRefs:
              - CV002
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
