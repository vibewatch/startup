      - number: '7.3'
        title: Operational, Supply-Chain, and Quality Risk
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai's Modalix MLSoC is manufactured on TSMC's N6 (6nm-class) process, which concentrates its most
              critical dependency in Taiwan — the global hub for leading-edge, automotive-grade fabrication. Any
              disruption at TSMC (natural disaster, cross-strait geopolitical escalation, capacity allocation away from
              smaller customers, or trade restriction) would directly threaten SiMa's ability to build product, and
              meaningful diversification to Samsung, Intel, or US/Europe fabs for advanced automotive-grade nodes is not
              expected to materialize before roughly 2027. As a fabless company, SiMa also depends on OSAT partners for
              packaging/test, on IP vendors (Arm cores, Synopsys ARC/tooling) for its architecture, and on distributors
              and contract manufacturers (Macnica, Enclustra, VVDN) for supply to customers, so a failure at any layer
              propagates to shipments. Quality and reliability risk is elevated because SiMa's target verticals —
              automotive, industrial, defense, healthcare — demand stringent reliability, and a field failure or recall
              in a safety-critical deployment would be reputationally severe. A specific validation gap compounds this:
              there is no public Modalix-generation MLPerf Inference result (SiMa's first-generation MLSoC appeared on
              MLPerf Inference 4.0 in 2024, but the current product line has no comparable independent benchmark), so
              the headline performance-per-watt advantage rests largely on company-reported figures rather than
              third-party-audited results.
