        title: Revenue Model, Pricing, and Go-to-Market
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai monetizes primarily through hardware: it sells the Modalix MLSoC silicon, packaged
              system-on-modules, and developer kits, and layers its Palette software toolchain (including the Edgematic
              low-code environment and the LLiMa on-device LLM framework) on top rather than selling software as a
              standalone recurring license. Public pricing is unusually transparent for the category — production
              Modalix system-on-modules list at USD349 for the 8GB variant and USD599 for the 32GB variant in 1,000-unit
              quantities, and the developer kit is USD1,499 — but list-versus-realized pricing, volume discounts, and
              OEM contract terms are not disclosed. The go-to-market motion blends a direct sales effort with a
              distributor and partner channel (Macnica, Enclustra, ThinkRobotics) and ecosystem relationships (Synopsys
              for automotive tooling, L&T Technology Services for solution delivery) that shorten customer evaluation.
              SiMa.ai targets robotics, industrial automation, automotive, aerospace and defense, smart vision, and
              healthcare as revenue verticals. What remains opaque is the revenue mix across chips, modules, kits, and
              software, and whether Palette will ever be monetized as a separate line — both of which materially affect
              the durability and margin of the revenue base.
