      - number: '7.5'
        title: Financial and Business-Model Risk
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai's financial risk is amplified by opacity. The company discloses no revenue, gross margin, monthly
              burn, cash balance, or runway, so an underwriter cannot verify capital adequacy, unit economics, or the
              path to profitability, and must proxy entirely from public peers. Those peers are sobering: Blaize
              reported roughly USD38.6 million of fiscal-2025 revenue against an operating loss near USD103.8 million
              and issued a going-concern warning, while Ambarella — the healthiest fabless edge-AI comparator — still
              posted a GAAP net loss of about USD75.9 million on record revenue near USD390.7 million at roughly 60%
              gross margin. The read-through is that edge-AI fabless margins sit well below NVIDIA's 70%-plus and that
              even Ambarella-scale revenue is insufficient for GAAP profitability, implying SiMa faces a long,
              capital-hungry path and recurring dilution. Capital intensity is structural: each MLSoC generation
              requires a fresh advanced-node tape-out at TSMC plus sustained software investment before it generates
              revenue. Valuation risk is acute: SiMa carries a reported but company-unconfirmed post-Series-C valuation
              near USD1.4 billion with no disclosed revenue to anchor a multiple, so the implied revenue multiple is
              uncomputable and the unicorn label rests on private-market sentiment rather than fundamentals. The
              consolidated financial thesis-break trigger is a failure to raise the next round on non-punitive terms
              before runway expires.
            claimRefs:
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
              - CR034
              - CR045
      - number: '7.6'
        title: Mitigations, Monitoring Indicators, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Each major risk has an available mitigation and an observable monitoring indicator, but most mitigations
              are early-stage and depend on disclosures SiMa has not yet made. For competitive risk, the mitigation is
              deepening the Palette software moat and locking in multi-year design wins; the monitoring indicator is
              design-win-to-production conversion and any published independent benchmark, and the kill criterion is
              loss of a flagship design-in to NVIDIA or a failure to show volume revenue by the next raise. For
              financing risk, the mitigation is the recent Series C and Micron backing; the indicator is cash runway and
              burn multiple, and the kill criterion is a down-round or inability to raise before runway expires. For
              supply-chain risk, the mitigation is qualifying alternate foundry/OSAT capacity and building inventory
              buffers; the indicator is single-source exposure and lead times, and the kill criterion is a TSMC
              allocation loss or a cross-strait disruption. For regulatory risk, the mitigation is export-control
              compliance programs and pursuing ISO 26262/ASIL and FDA qualification; the indicator is certification
              milestones and any BIS enforcement action, and the kill criterion is exclusion from a target vertical for
              lack of certification. For execution risk, the mitigation is broadening the leadership bench beyond the
              CEO; the indicator is key-executive retention and independent corroboration of the founding team. The core
              diligence asks are a management data room (financials, burn, runway, backlog), an independent Modalix
              benchmark, foundry/OSAT contracts, an export-control compliance review, and functional-safety
              certification evidence.
