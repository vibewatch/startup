      - number: '1.3'
        title: Funding History, Investors, and Valuation
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai has raised capital across roughly nine disclosed rounds since 2020, and the compiled history is
              consistent across the company's own announcements and third-party trackers. Dell Technologies Capital led
              a $30 million Series A in May 2020; Fidelity Management & Research led an $80 million Series B in May 2021
              and a $30 million extension in May 2022; MSD Partners led a $37 million Series B1 extension in October
              2022; a further ~$13 million came in mid-2023; Maverick Capital then led a $70 million round in April 2024
              and the $85 million oversubscribed Series C on August 1, 2025, which brought cumulative disclosed funding
              to $355 million. StepStone Group joined as a new investor in the Series C, and Micron Technology made a
              separate strategic investment of undisclosed size dated to around April 2026, deepening a
              memory-and-compute partner relationship.


              Valuation is where public disclosure is deliberately thin. SiMa.ai explicitly declined to disclose its
              post-Series C valuation, and Business Standard confirmed that non-disclosure. Independent reporting fills
              the gap but not cleanly: The Information reported that SiMa.ai was raising more than $100 million at a
              valuation of around $1.4 billion — a premium of more than 45% over a roughly $960 million valuation from
              the prior August per PitchBook — which is why unicorn trackers and downstream coverage widely describe
              SiMa.ai as a ~$1.4 billion unicorn. The two-people-familiar $100M+ figure sits above the company's
              official $85 million headline, so the exact round size and the valuation both remain
              reported-not-confirmed facts that should be verified against primary financing documents.
