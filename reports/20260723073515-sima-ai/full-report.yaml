      - number: '1.5'
        title: Milestones and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              The company chronology is coherent and product-led. SiMa.ai was founded in 2018 with a hardware-software
              co-design thesis, shipped what it calls the industry's first purpose-built MLSoC with a full software
              stack around 2022, moved its first-generation MLSoC into production deployments in 2023, released the
              Modalix MLSoC and the Palette Edgematic no-code tool in 2024, and in 2025 both brought generative AI
              on-device (Modalix SoM plus the LLiMa framework) and closed its Series C. The financing chronology runs in
              parallel from the 2020 Series A through the August 2025 Series C and the April 2026 Micron strategic
              investment, and in 2026 the company launched Palette Neat as an agentic development environment.


              The adverse frame is equally important for diligence. First, valuation opacity: the company declined to
              disclose its Series C valuation, and the widely cited ~$1.4 billion figure rests on unnamed sources rather
              than a company statement, while the reported ">$100M" round size conflicts with the official "$85M."
              Second, competitive intensity: SiMa.ai operates in a market where NVIDIA holds a dominant share and where
              even well-funded edge-AI rivals such as Hailo are described as struggling to convert pilots into scale
              against NVIDIA's ecosystem — a structural headwind for any challenger. Third, disclosure gaps: the
              incomplete co-founder record, the absence of current financial and headcount metrics, and undisclosed
              cap-table economics mean the equity story depends on private data not yet visible in public sources.
