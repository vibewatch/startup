      - number: '2.2'
        title: Market Sizing Through Edge-AI, Physical-AI, and Automotive Lenses
        blocks:
          - type: paragraph
            body: >-
              No single published number cleanly captures SiMa.ai's opportunity, so the defensible approach is to
              preserve several lenses rather than force one TAM. On the tightest hardware lens, MarketsandMarkets sizes
              the edge-AI hardware market at USD26.14 billion in 2025 growing to USD58.90 billion by 2030 at a 17.6%
              CAGR — the layer that most directly maps to SiMa.ai's chips and modules. Broader edge-AI market
              definitions that fold in software and services run larger and faster: Fortune Business Insights puts edge
              AI at USD35.60 billion in 2025 rising to USD445.75 billion by 2034 (32.5% CAGR), Global Market Insights at
              USD25.2 billion in 2025 to USD225.5 billion by 2035 (24.7% CAGR), and Grand View Research (via Axis
              Intelligence) at USD24.9 billion in 2025 to USD118.7 billion by 2033 (21.7% CAGR). These cluster tightly
              on a ~USD25-36 billion 2025 base but diverge sharply on end-year because they use different scopes and
              windows, so they should be triangulated, not averaged.


              A second lens is the physical-AI framing SiMa.ai itself markets to. MarketsandMarkets sizes a narrow
              physical-AI compute/software layer reaching USD15.24 billion by 2032 at a 47.2% CAGR from 2026, while
              broader physical-AI ecosystem estimates (all robots, autonomous machines, and infrastructure) reach
              roughly USD383 billion in 2026 and into the trillions by 2040; AI-robotics specifically is projected to
              grow from USD6.11 billion in 2025 to USD33.39 billion by 2030. A third, automotive lens is directly
              relevant because SiMa.ai has an automotive business unit and a Synopsys collaboration: MarketsandMarkets
              sizes automotive AI at USD18.83 billion in 2025 to USD38.45 billion by 2030 (15.3% CAGR), the automotive
              AI SoC segment reaches ~USD13.0 billion by 2034 (15.6% CAGR), and the ADAS market runs from USD20.73
              billion in 2021 to USD74.57 billion by 2030. The honest conclusion is stacked: edge-AI hardware for the
              direct SAM, physical AI and robotics for demand direction, and automotive/ADAS as a large but
              incumbent-heavy adjacency. No retained public source isolates SiMa.ai's own served share, so these figures
              bound the opportunity rather than the company's revenue.
