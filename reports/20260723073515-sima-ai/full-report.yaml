      - number: '2.3'
        title: Buyer Segmentation, Budget Owners, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai's market spans several buyer archetypes rather than one homogenous customer, and the company
              organizes its go-to-market around verticals: robotics, industrial automation and machine vision,
              automotive/ADAS, aerospace and defense, smart vision/retail, and healthcare devices. The user is typically
              an embedded or ML engineering team that must fit a perception or generative-AI model into a thermally and
              power-constrained product; the buyer is a product, platform, or engineering leader who owns the
              bill-of-materials and roadmap; and the payer/budget owner is usually a hardware product P&L or program
              budget rather than a cloud line item. The adoption trigger differs by segment — battery-powered mobility
              and thermal limits in robotics, functional-safety and latency in automotive, ruggedization and
              supply-chain assurance in defense, and privacy/regulatory constraints in healthcare — but the common
              thread is a need to move inference on-device.


              The adoption path generally runs from evaluation on a developer kit and Palette software, through
              design-in on a system-on-module (SiMa.ai offers SoMs at published 1K-unit pricing of USD349 for 8GB and
              USD599 for 32GB, with a USD1,499 devkit), to volume production once a design wins into a platform. Because
              these are hardware design-ins, sales cycles are long, switching costs after design-in are high, and
              reference customers plus ecosystem partners (Arm, TSMC, Synopsys, L&T Technology Services, Enclustra)
              materially shorten evaluation. That dynamic cuts both ways: it rewards SiMa.ai when it wins a socket, but
              it also favors the incumbent (NVIDIA Jetson) that most engineering teams already know, because the default
              option carries the least perceived integration risk.
            claimRefs:
