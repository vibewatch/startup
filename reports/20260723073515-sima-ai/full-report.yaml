      - number: '3.3'
        title: Capability, Pricing, and Go-to-Market Comparison
        blocks:
          - type: paragraph
            body: >-
              On raw capability, NVIDIA's Jetson AGX Orin leads on peak throughput (up to 275 TOPS) but at 15-60 watts,
              positioning it for performance-critical robotics rather than tight power budgets. SiMa.ai's Modalix and
              Hailo's parts compete on the opposite axis: efficiency. Hailo-10H delivers about 40 INT4 TOPS at roughly
              2.5 watts (~16 TOPS/W) with a generative-AI focus, while SiMa.ai markets 50+ TOPS at under ten watts with
              an emphasis on running the full pipeline (vision plus generative models) on one chip. Ambarella wins the
              ultra-low-power AI-camera niche (sub-2W at high-resolution video), Blaize differentiates on a programmable
              graph-streaming architecture and ease of programming, and EdgeCortix on a software-first Dynamic Neural
              Accelerator plus MERA compiler. Qualcomm's Robotics RB5 offers about 15 TOPS at 5-15 watts with strong
              connectivity integration.


              On pricing, SiMa.ai is transparent where most peers are not: system-on-modules at USD349 (8GB) and USD599
              (32GB) in 1K-unit quantities and a USD1,499 developer kit. NVIDIA's Jetson dev kits are comparably priced
              but backed by a far deeper, free, and widely-taught software ecosystem, which is the crux of the
              go-to-market contest. SiMa.ai's answer is Palette — a software-first, low-code toolchain (including
              Edgematic and its LLiMa on-device LLM framework) intended to reduce integration friction — and an
              ecosystem of partners (Arm, TSMC, Synopsys, L&T Technology Services, Enclustra, distributor Macnica) that
              shorten evaluation. The comparison shows SiMa.ai is competitive on efficiency and single-chip integration,
              but it must overcome the incumbent's ecosystem gravity and the fact that several peers are already
              shipping in volume.
