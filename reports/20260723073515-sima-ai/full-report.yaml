  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai does not sell a generic "AI" product; it sits in the edge-AI inference silicon layer — a single
              MLSoC ("Modalix") that fuses Arm application cores, a dedicated ML accelerator, and vision/DSP blocks so
              that computer-vision, transformer, and generative-AI models run locally under roughly ten watts, paired
              with the Palette software toolchain. That defines the included spend narrowly: purpose-built edge-AI
              processors, system-on-modules, developer kits, and the accompanying software that turns trained models
              into deployable edge applications. It explicitly excludes cloud/data-center training silicon,
              general-purpose CPUs, discrete sensors, and end-user AI SaaS seats, which belong to adjacent markets.


              The market matters because the buyers SiMa.ai targets — robotics, industrial automation, automotive/ADAS,
              aerospace and defense, smart vision, and healthcare device makers — increasingly need real-time inference
              where cloud round-trips are too slow, too power-hungry, or too exposed for sensitive data. The status-quo
              substitutes they compare against are therefore not only other edge-AI startups (Hailo, Ambarella, Blaize)
              but, most importantly, NVIDIA's Jetson platform, which dominates edge robotics compute, plus repurposed
              general-purpose SoCs from Qualcomm, embedded GPUs, FPGAs, and in some cases continued reliance on cloud
              inference. SiMa.ai's position is defined by claiming a better performance-per-watt and a single-chip
              software-first experience versus those alternatives, so the relevant market is best framed as the edge-AI
              hardware/silicon layer viewed through overlapping physical-AI, robotics, and automotive-inference lenses.
