      - - Audited revenue, gross margin, operating burn, runway
        - Only way to anchor the entry multiple and time the financing risk
        - Critical (gating)
      - - Series C term sheet - liquidation preferences, participation, seniority
        - Quantifies preference overhang senior to common in a downside exit
        - Critical (gating)
      - - Full cap table and dilution history
        - Reveals ownership, option pool, and future dilution path
        - High
      - - Dollar-weighted design-win pipeline with production timelines
        - Tests revenue durability and conversion of early engagements
        - High
      - - Customer concentration (top-five revenue share)
        - Exposes single-customer dependence risk
        - High
      - - Foundry and OSAT second-source qualification roadmap
        - Assesses TSMC single-foundry supply resilience
        - Medium
      - - Independent Modalix-generation benchmark (MLPerf-class)
        - Validates the performance-per-watt claim third-party
        - Medium
    notes: >-
      Satisfaction of the two gating asks is required to upgrade from research-more to buy; the remainder refine the
      price and risk rating.
    claimRefs:
      - CV012
      - CV018
      - CV039
      - CV040
      - CV041
