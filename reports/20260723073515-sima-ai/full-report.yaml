  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Family Map
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai's product is Modalix, a second-generation MLSoC that runs the full physical-AI pipeline — computer
              vision, classical CNNs, Transformers, large language models, and multimodal generative AI — on a single
              chip rather than across a CPU-plus-accelerator board. In customer-workflow terms it replaces a discrete
              GPU-or-accelerator plus host processor with one power-efficient device that ingests camera and sensor
              data, runs inference locally, and drives real-time decisions in robots, vehicles, drones, and industrial
              machines. The commercial family spans the raw MLSoC silicon sold to OEMs and module makers, packaged
              Modalix system-on-modules in 8GB and 32GB variants, the Modalix DevKit 3.0 for evaluation and prototyping,
              and the software layer: the Palette Neat SDK (Model Compiler, Neat Library, and the sima-cli tool), the
              Edgematic browser-based low-code pipeline builder, the LLiMa GenAI runtime, and a public GitHub model zoo
              of pre-optimized PyTorch and ONNX models. The modules are pin- and software-compatible with SiMa.ai's
              first-generation MLSoC and with popular NVIDIA SoMs, which lets buyers evaluate Modalix in existing
              carrier designs. The result is a hardware-plus-software product whose selling proposition is single-chip
              multi-modal integration and a low-friction developer path from model to deployed edge application.
            claimRefs:
