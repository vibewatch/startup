              qualitative picture is one of heavy dependence on early flagship partnerships and on a partner/distributor
              channel: L&T Technology Services and VVDN carry solution delivery and manufacturing, while Macnica,
              Enclustra, and ThinkRobotics carry distribution, so a meaningful share of go-to-market runs through
