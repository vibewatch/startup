      - number: '8.3'
        title: Financing, Valuation Context, and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai has raised approximately USD355 million across roughly nine rounds since 2018, culminating in an
              August 2025 Series C of USD85 million led by Maverick Capital, with StepStone Group joining and Micron
              Ventures participating; the round was described as oversubscribed. The company has not confirmed a
              headline post-money figure; the roughly USD1.4 billion valuation traces to reporting attributed to The
              Information and repeated by secondary trackers, while other private-market trackers show materially
              different anchors (for example a USD960 million valuation timestamped mid-2025 and a roughly 2.7x
              valuation-to-funding capital-efficiency ratio), underscoring that the number is neither official nor
              consistently reported. Micron's April 2026 strategic investment (amount undisclosed) is a qualitative
              validation but does not establish a verifiable mark. Entry discipline is constrained by the disclosure
              gap. Because SiMa is private and unaudited, an investor cannot see the liquidation-preference stack,
              participation rights, or seniority attached to roughly USD355 million of preferred capital; in a down-side
              exit, preference overhang can absorb most or all of the proceeds before common and late-stage investors
              are made whole, and a large cumulative preference stack over a modest revenue base is a classic late-stage
              risk. Dilution is likely to continue: a capital-intensive fabless semiconductor company with no disclosed
              profitability will need further financing, and each subsequent round dilutes existing holders and can
              reset the preference stack senior to earlier money. The disciplined entry posture is therefore to treat
              the reported USD1.4 billion as an unverified ceiling, require the Series C term sheet and cap table, and
              price to the probability-weighted value (near USD965 million) rather than the reported headline until
              audited financials and preference terms are in hand.
            claimRefs:
              - CV001
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
      - number: '8.4'
        title: Scenario Analysis - Bull, Base, and Bear
        blocks:
          - type: paragraph
            body: >-
              Because SiMa discloses no revenue, the scenarios below are built from a third-party revenue estimate
              (roughly USD35.5 million) and edge-AI sector benchmarks, and forward exit valuations are inferred from
              public-peer and M&A multiples; none can be independently verified against SiMa financials. In the bull
              case (assigned roughly 25 percent), Modalix design-ins convert into volume production across robotics,
              industrial, and automotive, revenue scales toward roughly USD150 million by 2028, physical-AI positioning
              attracts a strategic acquirer, and an exit prints at a premium roughly 10x to 17x multiple, yielding
              roughly USD1.5 billion to USD2.5 billion. In the base case (roughly 45 percent), revenue grows to roughly
              USD80 million on steady but slower design-in conversion, and the market applies a blended edge-AI multiple
              in the high-single to low-double digits (anchored to Ambarella's 5x to 8x with a modest growth premium),
              yielding roughly USD0.6 billion to USD1.0 billion, at or below the reported entry price. In the bear case
              (roughly 30 percent), NVIDIA's ecosystem confines SiMa to a niche, automotive certification slips, a key
              customer or foundry disruption bites, revenue stalls below roughly USD40 million, and SiMa is forced into
              a dilutive down-round or distressed process akin to Hailo's, yielding roughly USD0.2 billion to USD0.5
              billion. The probability-weighted value is approximately USD965 million, below the reported USD1.4 billion
              entry. The sensitivity analysis shows that only the combination of high revenue and a sustained premium
              multiple justifies the reported price; at public-peer multiples the reported valuation is unsupported
              across the plausible revenue range. The downside triggers that move SiMa toward the bear case are
              enumerated in the thesis-break table.
            claimRefs:
