      - number: '3.2'
        title: Competitor Profiles, Scale, and Funding
        blocks:
          - type: paragraph
            body: >-
              The peers differ sharply in scale and financial health, which matters because edge-AI silicon is
              capital-intensive and design-in cycles are long. NVIDIA is effectively unconstrained: it funds Jetson from
              a trillion-dollar franchise and owns the dominant developer ecosystem. Ambarella is the healthiest
              independent comparator, reporting record fiscal-2026 revenue of USD390.7 million with roughly 80% now from
              edge AI, more than 42 million edge-AI SoCs shipped, and a multi-year agreement with Hanwha carrying an
              USD800 million revenue opportunity. Blaize went public via a SPAC merger with BurTech in January 2025 and
              reported 2025 revenue of USD38.6 million (up from USD1.6 million in 2024), its first full year of
              commercial revenue, concentrated in smart-city, public-safety, and sovereign-AI deployments.


              Among the private peers, Hailo is the cautionary tale: after becoming a unicorn in 2021 and reaching a
              USD1.2 billion valuation on a USD120 million Series C extension in April 2024, its valuation fell by more
              than half to under USD500 million by early 2026, it cut roughly 10% of staff, and it pursued a distressed
              SPAC merger for survival capital. EdgeCortix has raised over USD110 million (Series B plus grants and
              debt) and is scaling its SAKURA-II accelerator with a next-generation SAKURA-X chiplet roadmap. Against
              this field, SiMa.ai has raised roughly USD355 million in total, is reportedly valued at about USD1.4
              billion after its August 2025 Series C, and — unlike Ambarella and Blaize — discloses no revenue, so its
              scale is measured in capital raised and product milestones rather than shipments or sales.
