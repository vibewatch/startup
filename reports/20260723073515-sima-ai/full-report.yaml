  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Category Map
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai's competitive set spans five layers. The incumbent layer is dominated by NVIDIA, whose Jetson
              modules (AGX Orin at up to 275 TOPS, and the newer Jetson Thor generation) are the default edge-robotics
              compute platform, reinforced by the CUDA-X and JetPack software stack that most engineering teams already
              know; Qualcomm is the other incumbent, bringing enormous mobile/IoT scale and its Robotics RB-series
              platforms. The direct-peer layer is the cohort of venture-backed edge-AI silicon startups most similar to
              SiMa.ai: Hailo (Israel, founded 2017), Blaize (now public on Nasdaq as BZAI), EdgeCortix (Japan), and
              Axelera AI (Europe). Ambarella occupies a distinct spot as a public pure-play that has pivoted its
              established camera-SoC franchise into edge AI and is now scaling real revenue.


              Beyond named vendors, SiMa.ai also competes against substitutes and the status quo: repurposed
              general-purpose SoCs and application processors, embedded GPUs, FPGAs, and — for teams not yet forced to
              the edge — continued reliance on cloud inference. Internal build is a real alternative for the largest
              OEMs and hyperscalers, who can design custom silicon (as Tesla, Google, Amazon, and Apple have done in
              adjacent domains). Likely future entrants include hyperscaler edge-inference parts and automotive-specific
              players such as Mobileye pushing down into the same sockets. The practical implication is that SiMa.ai is
              not merely fighting a few startups; it is trying to displace an entrenched software-plus-silicon incumbent
              while a crowded peer field competes for the same design wins.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
