  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation, Verticals, and Channel
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai addresses the "embedded edge" — the compute layer between cloud data centers and low-power
              personal devices — targeting workloads in the roughly 5W-to-25W envelope. Its publicly stated target
              verticals are robotics, automotive and mobility, industrial automation, aerospace and defense, smart
              vision, and healthcare, and earlier company commentary named healthcare, smart retail, autonomous
              vehicles, government, and robotics as priority applications. The buyer is typically an OEM or system
              integrator embedding the Modalix MLSoC or system-on-module into a robot, camera, vehicle, or industrial
              machine, while the ultimate user is the enterprise operating that machine, so payer and user are usually
              distinct. Go-to-market blends direct enterprise sales with a distributor channel — Macnica (Japan/APAC),
              Enclustra, and ThinkRobotics resell modules and developer kits — and engineering/solution partners such as
              L&T Technology Services (mobility, healthcare, industrial automation, robotics), VVDN (design and
              manufacturing), Synopsys (automotive tooling), and AWS (Edgematic cloud integration). Geographically the
              company is San Jose-headquartered but is explicitly investing its 2025 Series C proceeds to expand in
              Korea, Japan, Europe, and the United States. Because SiMa publishes no revenue-band, account-size, or
              per-vertical revenue split, segmentation can only be described qualitatively from partnership and product
              evidence, not weighted by dollars.
