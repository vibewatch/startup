      - number: '4.2'
        title: Cost Structure, Gross Margin, and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              As a fabless designer, SiMa.ai's cost structure is dominated by research and development, advanced-node
              chip tape-out and mask costs at TSMC (Modalix is built on the N6 process), and inventory, rather than by
              owned fabrication. That structure is capital-intensive because each MLSoC generation requires a fresh
              advanced-node tape-out and sustained software investment before it can generate revenue. Because SiMa.ai
              discloses no financials, its likely margin path can only be proxied from public peers. Ambarella — the
              healthiest fabless edge-AI comparator — reported record fiscal-2026 revenue of USD390.7 million (up 37.2%
              year over year) at a GAAP gross margin of 59.2% and a non-GAAP gross margin of 60.7%, yet still posted a
              GAAP net loss of USD75.9 million, with non-GAAP operating expense up about 12.9% on higher labor and
              SoC-development costs. Blaize, the other public pure-play, reported fiscal-2025 revenue of roughly USD38.6
              million against an operating loss of about USD103.8 million. The read-through is that edge-AI fabless
              specialists run gross margins in the mid-50% to mid-60% range — well below NVIDIA's 70%-plus scale-driven
              margins — and that reaching Ambarella-scale revenue is not sufficient for GAAP profitability. SiMa.ai
              therefore faces a long, capital-hungry path to margin maturity even in a favorable demand environment.
