  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Overview
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai is a pre-profitability, hardware-led semiconductor company competing against an entrenched
              incumbent, so its risks are weighted toward market, capital, and execution exposure rather than near-term
              legal liability. Ranking by residual exposure (likelihood times impact, net of mitigation): the
              highest-severity risk is competitive displacement — NVIDIA's Jetson platform and CUDA/JetPack software
              moat, reinforced by well-capitalized challengers, could confine SiMa to a niche. Second is financing and
              capital-intensity risk: fabless edge-AI players burn heavily (Blaize posted an operating loss near
              USD103.8 million and a going-concern warning; Ambarella still runs GAAP net losses at nearly USD391
              million revenue), and SiMa discloses no financials, so its runway and path to profitability are
              unverifiable and it depends on repeat fundraising. Third is supply-chain concentration: Modalix depends on
              TSMC's N6 process, concentrating production in Taiwan. Fourth is regulatory exposure: BIS export controls
              limit China market access and automotive/defense/healthcare qualification gates slow revenue. Fifth is
              execution and key-person risk around a founder-led team with limited public corroboration of the wider
              founding group. Sixth is technical-validation risk: no public Modalix-generation MLPerf benchmark exists
              to confirm the performance-per-watt claims independently. The table and heatmap below rank each with
              likelihood, impact, mitigation maturity, and residual exposure.
