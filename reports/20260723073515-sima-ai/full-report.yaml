      - number: '3.4'
        title: Switching Costs, Lock-in, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              Edge-AI silicon has high switching costs once a chip is designed into a product: hardware layout, thermal
              design, software porting, and safety qualification are all chip-specific, so a socket win tends to persist
              across a product generation. That dynamic is double-edged for SiMa.ai. It rewards the company when it wins
              a design, but it far more often benefits NVIDIA, because most engineering teams have already invested
              years of CUDA/JetPack skills and reusable software, making Jetson the lowest-perceived-risk default.
              Multi-homing is limited at the device level — a given product ships one inference chip — but common at the
              evaluation stage, where buyers benchmark several parts before committing.


              Distribution power is where the gap is starkest. NVIDIA and Qualcomm reach customers through vast,
              established channels and reference designs; Ambarella leverages decades of camera-OEM relationships;
              Blaize reaches system integrators in public-sector and defense. SiMa.ai relies on a younger direct sales
              motion supplemented by partners and distributors (Macnica, Enclustra) and by strategic relationships
              (Synopsys for automotive tooling, L&T Technology Services for physical-AI solution delivery, and a
              separate Micron memory investment). Supply access is a shared dependency: SiMa.ai, like most fabless
              peers, depends on TSMC (Modalix on N6), so foundry allocation and memory (LPDDR5) supply are common
              constraints rather than differentiators. The net picture is that SiMa.ai's partner ecosystem is credible
              but not yet a distribution moat comparable to the incumbents'.
            claimRefs:
              - CP027
              - CP028
              - CP029
              - CP030
              - CP031
              - CP032
      - number: '3.5'
        title: Moat Durability, Displacement Risk, and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              SiMa.ai's moat thesis rests on three claims: a genuine performance-per-watt lead, a differentiated
              software-first experience that lowers integration cost, and early physical-AI design wins across robotics,
              industrial, automotive, and defense. Each is contestable. Efficiency leadership is narrow and perishable —
              Hailo already claims comparable or better TOPS/W, and NVIDIA iterates aggressively (Jetson Thor), so a
              spec advantage today may not persist. The software-first pitch competes directly against CUDA, the deepest
              and most entrenched moat in AI compute, which no challenger has yet dislodged at the edge. And the
              design-win claim is asserted rather than quantified: no retained public source discloses SiMa.ai's
              shipment volumes, revenue, or socket count.


              The adverse evidence is material. CNBC reports that NVIDIA dominates the AI-chip market and that rivals
              face a steep climb even as investors fund them. Hailo's collapse from a USD1.2 billion unicorn to a
              sub-USD500 million distressed SPAC — with layoffs — is a direct, recent demonstration that a well-funded,
              technically credible edge-AI peer can fail to convert capital and product into durable value. Blaize is
              public but still small (USD38.6 million 2025 revenue), and even Ambarella, the healthiest independent,
              warns that rising R&D and operating costs could outpace revenue if design wins disappoint. For SiMa.ai,
              the balanced read is that its product and partnerships are credible, but its ~USD1.4 billion valuation
              implies share capture that public evidence cannot yet confirm, in a market where the incumbent's moat is
              the single largest risk to every challenger.
            claimRefs:
              - CP014
              - CP021
              - CP033
              - CP034
              - CP035
              - CP036
              - CP037
              - CP038
