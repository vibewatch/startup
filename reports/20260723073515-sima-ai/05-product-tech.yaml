- id: deployment-integration-roadmap
  title: Deployment, Integration, and Roadmap
  body: 'Deployment centers on the Palette Neat SDK and the Edgematic platform. A developer brings a PyTorch or ONNX model (or picks one from the GitHub model zoo), compiles it with the Palette Model Compiler, and uses Edgematic — a browser-based, low-code builder with a GStreamer backend — to assemble a pipeline, measure real throughput, latency, and power on cloud-hosted MLSoC boards, and deploy to a Modalix device. Edgematic is cloud-hosted on AWS and integrates with Amazon SageMaker, and the developer portal (developer.sima.ai) publishes a self-contained install-to-GenAI onboarding path driven by the sima-cli tool. Integration is eased by pin- and software-compatibility with prior-generation and NVIDIA modules, and by an ecosystem of solution and delivery partners. The roadmap has moved from the first-generation MLSoC (listed on MLCommons MLPerf Inference 4.0 in March 2024), to the September 2024 announcement of the Modalix family, to production silicon and modules in August 2025, with the LLiMa GenAI runtime and Edgematic cloud tooling as the newest additions. What is not yet public is a Modalix-generation MLPerf result or independent reliability data, so integration risk and real-world throughput must be validated by buyers directly on hardware.'
  claimRefs:
