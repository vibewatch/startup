- id: architecture-and-operating-model
  title: Modalix Architecture and Operating Model
  body: 'Modalix is a heterogeneous system-on-chip built on TSMC''s N6 process in a 25mm-by-25mm package. Its compute is organized around a dedicated machine-learning accelerator that scales across 25, 50, 100, and 200 INT8 TOPS options and supports INT8, INT16, and BFLOAT16 precisions for CNN, Transformer, LLM, and generative inference, paired with an application-processor complex of eight Arm Cortex-A65 cores running at 1.4GHz. Vision and signal processing run on a quad-core Synopsys ARC EV74 computer-vision unit and an Arm Mali-C71AE image-signal processor, while a secure network-on-chip links the blocks at high bandwidth. Memory comprises up to 32GB of LPDDR5 on the module plus 8MB of on-chip SRAM, and connectivity includes PCIe Gen5 by eight lanes, four 10-gigabit Ethernet ports, four MIPI CSI-2 camera interfaces, and hardware video encode/decode for H.264, H.265, and AV1 up to 4Kp60. Security is anchored by a hardware secure boot with a root of trust and OTP key support. SiMa.ai claims Modalix delivers more than ten times the performance-per-watt of alternatives at a sub-ten-watt envelope for the 50-TOPS configuration — an efficiency-first design point rather than a peak-throughput one, which is the crux of how it positions against higher-power incumbent modules.'
