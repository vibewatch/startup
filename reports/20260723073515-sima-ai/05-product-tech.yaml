- id: trust-security-quality
  title: Trust, Security, Quality, and Validation Gaps
  body: 'On trust and security, Modalix implements a hardware secure boot with a root of trust and OTP key provisioning, and its network-on-chip is described as a secure interconnect — controls appropriate for automotive and defense deployments. Edgematic''s cloud-hosted evaluation is positioned as enterprise-grade with data privacy and control, running on AWS, and the platform supports on-device inference that keeps sensitive data local at run time. Standards support (ONNX and mainstream frameworks) reduces lock-in at the model layer, and the December 2024 Synopsys automotive collaboration signals intent to meet automotive-grade tooling expectations. The material quality and validation gap is benchmarking: SiMa.ai''s first-generation MLSoC was listed on MLPerf Inference 4.0, but there are no public MLPerf results specific to the Modalix generation as of mid-2026, and no independent field-reliability or functional-safety certification data is public. GenAI (LLiMa) and Edgematic are the newest, least-proven layers of the stack. For an underwriter, the security architecture is credible on paper, but independent performance, reliability, and safety validation of the production Modalix generation remains an open diligence item.'
  claimRefs:
