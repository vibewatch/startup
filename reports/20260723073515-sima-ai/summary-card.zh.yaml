summary:
  headline: >-
    SiMa.ai 是一家可信、背书充足的 Physical AI 芯片公司；但据报道约 USD1.4 billion 的估值已经计入尚未独立可见的执行成果， 也明显高于上市边缘 AI
    可比公司，因此在看到经审计财务数据前，纪律性结论应是继续研究。
