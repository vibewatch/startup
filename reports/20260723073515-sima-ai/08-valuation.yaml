- id: scenario-analysis-bull-base-bear
  title: Scenario Analysis - Bull, Base, and Bear
  body: 'Because SiMa discloses no revenue, the scenarios below are built from a third-party revenue estimate (roughly USD35.5 million) and edge-AI sector benchmarks, and forward exit valuations are inferred from public-peer and M&A multiples; none can be independently verified against SiMa financials. In the bull case (assigned roughly 25 percent), Modalix design-ins convert into volume production across robotics, industrial, and automotive, revenue scales toward roughly USD150 million by 2028, physical-AI positioning attracts a strategic acquirer, and an exit prints at a premium roughly 10x to 17x multiple, yielding roughly USD1.5 billion to USD2.5 billion. In the base case (roughly 45 percent), revenue grows to roughly USD80 million on steady but slower design-in conversion, and the market applies a blended edge-AI multiple in the high-single to low-double digits (anchored to Ambarella''s 5x to 8x with a modest growth premium), yielding roughly USD0.6 billion to USD1.0 billion, at or below the reported entry price. In the bear case (roughly 30 percent), NVIDIA''s ecosystem confines SiMa to a niche, automotive certification slips, a key customer or foundry disruption bites, revenue stalls below roughly USD40 million, and SiMa is forced into a dilutive down-round or distressed process akin to Hailo''s, yielding roughly USD0.2 billion to USD0.5 billion. The probability-weighted value is approximately USD965 million, below the reported USD1.4 billion entry. The sensitivity analysis shows that only the combination of high revenue and a sustained premium multiple justifies the reported price; at public-peer multiples the reported valuation is unsupported across the plausible revenue range. The downside triggers that move SiMa toward the bear case are enumerated in the thesis-break table.'
