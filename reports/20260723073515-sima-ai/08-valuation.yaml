- id: financing-valuation-context-and-entry-discipline
  title: Financing, Valuation Context, and Entry Discipline
  body: 'SiMa.ai has raised approximately USD355 million across roughly nine rounds since 2018, culminating in an August 2025 Series C of USD85 million led by Maverick Capital, with StepStone Group joining and Micron Ventures participating; the round was described as oversubscribed. The company has not confirmed a headline post-money figure; the roughly USD1.4 billion valuation traces to reporting attributed to The Information and repeated by secondary trackers, while other private-market trackers show materially different anchors (for example a USD960 million valuation timestamped mid-2025 and a roughly 2.7x valuation-to-funding capital-efficiency ratio), underscoring that the number is neither official nor consistently reported. Micron''s April 2026 strategic investment (amount undisclosed) is a qualitative validation but does not establish a verifiable mark. Entry discipline is constrained by the disclosure gap. Because SiMa is private and unaudited, an investor cannot see the liquidation-preference stack, participation rights, or seniority attached to roughly USD355 million of preferred capital; in a down-side exit, preference overhang can absorb most or all of the proceeds before common and late-stage investors are made whole, and a large cumulative preference stack over a modest revenue base is a classic late-stage risk. Dilution is likely to continue: a capital-intensive fabless semiconductor company with no disclosed profitability will need further financing, and each subsequent round dilutes existing holders and can reset the preference stack senior to earlier money. The disciplined entry posture is therefore to treat the reported USD1.4 billion as an unverified ceiling, require the Series C term sheet and cap table, and price to the probability-weighted value (near USD965 million) rather than the reported headline until audited financials and preference terms are in hand.'
