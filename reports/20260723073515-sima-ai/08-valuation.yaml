- id: exit-readiness-and-final-diligence
  title: Exit Readiness, Thesis-Break Triggers, and Final Diligence Asks
  body: 'Exit readiness is early. SiMa is a private, pre-disclosure company with no public revenue, no audited financials, and no announced IPO process; the realistic exit is strategic M&A, for which the buyer universe (large analog/embedded and memory incumbents such as NXP, onsemi, Qualcomm, Renesas, and Micron as a strategic partner) is active and paying premiums for edge-AI IP, as the Kinara and Synaptics deals show. A near-term IPO is unlikely given the absence of disclosed scale and the poor public reception of Blaize. The primary thesis-break triggers are: a down-round or flat financing that repudiates the reported valuation (the Hailo precedent); design losses to NVIDIA Jetson that confine SiMa to a niche; a sustained revenue shortfall below roughly USD40 million that makes any premium multiple unsupportable; failure to achieve ISO 26262 automotive certification by roughly 2027, foreclosing a stated growth vertical; a TSMC N6 allocation loss or Taiwan disruption halting production; and cash exhaustion forcing a distressed raise. Each is a discrete, monitorable kill criterion. The final diligence asks, in priority order, are: (1) audited revenue, gross margin, operating burn, and runway; (2) the Series C term sheet including liquidation preferences, participation, and seniority, plus the full cap table and dilution history; (3) a dollar-weighted design-win pipeline with production timelines and customer concentration; (4) foundry and OSAT second-source qualification roadmap; and (5) an independent Modalix-generation benchmark. Satisfaction of asks (1) and (2) is a gating condition; without them the reported valuation cannot be validated and the recommendation remains research-more rather than buy.'
