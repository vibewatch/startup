callouts:
- calloutType: recommendation
  title: 'Recommendation: research-more at the reported USD1.4B'
  body: >
    The investment thesis for SiMa.ai is structurally compelling - a differentiated, power-efficient edge/physical-AI
    silicon platform led by a semiconductor-native team, validated by marquee engagements and a Micron strategic
    investment. But the reported roughly USD1.4 billion valuation has no public financial anchor: SiMa discloses no
    revenue, margin, burn, or runway, and third-party revenue estimates imply a stretched roughly 28x to 39x forward
    multiple against a public pure-play comp near 5x to 8x. A three-scenario model yields a probability-weighted value
    near USD965 million, below the reported entry. Upgrade to buy is conditional on: (1) audited revenue, margin, burn,
    and runway; (2) the Series C term sheet and cap table; and (3) a dollar-weighted design-win pipeline plus an
    independent Modalix benchmark.
  claimRefs:
  - CV010
  - CV012
  - CV023
  - CV030
  - CV042
- calloutType: risk
  title: The valuation-to-evidence gap is the primary risk
  body: >
    At the reported valuation, investors are paying a private-market premium far above public edge-AI comps for a
    company that discloses no financials. The multiple gap (roughly 28-39x implied vs 5-8x for Ambarella) is bridgeable
    only with proof of rapid, durable revenue growth and healthy gross margin - neither of which is public. Peer
    distress (Hailo's reported sub-USD500M repricing; Blaize's going-concern warning) shows how quickly the market
    repudiates edge-AI names that miss, and a large undisclosed liquidation-preference stack over a modest revenue base
    could absorb most proceeds in a downside exit.
  claimRefs:
  - CV007
  - CV017
  - CV031
  - CV032
- calloutType: strength
  title: Active edge-AI M&A and strategic backing support the exit thesis
  body: >
    The edge-AI acquisition market is active and paying premiums for differentiated IP: NXP acquired Kinara for USD307
    million (February 2025) and onsemi agreed to acquire Synaptics for roughly USD7 billion (2026) to expand in edge AI.
    Micron's April 2026 strategic investment adds an independent strategic validator with memory and edge-systems
    exposure. These signals make strategic M&A the most probable exit and provide a credible, if unquantified,
    scarcity-premium case that anchors the bull scenario.
  claimRefs:
  - CV030
  - CV032
  - CV033
  - CV019
