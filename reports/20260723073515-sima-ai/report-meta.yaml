companyProfile:
  summary: >-
    SiMa.ai is a fabless edge-AI semiconductor company founded in 2018 and headquartered in San Jose,
    California. It markets a full-stack "Physical AI" platform combining purpose-built silicon (the
    MLSoC, whose second generation is branded Modalix and is built on TSMC's N6 process) with the
    Palette software suite (SDK, the no-code Edgematic tool, the LLiMa on-device LLM framework, and
    the 2026 agentic Palette Neat environment). Modalix entered production in August 2025 and runs
    LLMs, transformers, CNNs, and generative AI under roughly 10 watts. The company has raised about
    USD355 million across roughly nine to ten rounds since 2018, culminating in an oversubscribed
    August 2025 Series C of USD85 million led by Maverick Capital, and received a strategic Micron
    investment around April 2026. It targets robotics, automotive, industrial automation, aerospace
    and defense, smart vision, and healthcare, with marquee engagements including STIGA, TRUMPF, LTTS,
    VVDN, and Synopsys.
  foundedDate: '2018-01-01'
  founders:
    - name: Krishna Rangasayee
      role: Founder and CEO
      background: >-
        Spent about 18 years at Xilinx rising to SVP/GM and EVP Global Sales, served as COO of Groq,
        held roles at Altera and Cypress, and holds more than 25 patents.
      claimRefs: [CO011, CO012]
  foundingLocation: San Jose, California, USA
  headquarters: San Jose, California, USA
  productSummary: >-
    SiMa.ai sells the Modalix MLSoC as chips, system-on-modules (USD349 for the 8GB and USD599 for the
    32GB variant in 1,000-unit quantities), and a developer kit (USD1,499), with the Palette software
    toolchain bundled on top rather than sold as a standalone recurring license.
  customerFocus: >-
    OEMs and system integrators in robotics, automotive, industrial automation, aerospace and defense,
    smart vision, and healthcare that need power-efficient on-device AI inference at the edge.
  businessModel: >-
    Hardware-led sales of Modalix silicon, system-on-modules, and developer kits through direct sales
    and distributors (Macnica, Enclustra, ThinkRobotics), with Palette software bundled to drive
    design-in stickiness rather than sold as standalone recurring revenue.
  stage: Late-stage private; August 2025 Series C and April 2026 Micron strategic investment
  fundingStatus: >-
    About USD355 million raised across roughly nine to ten rounds from a 2020 Series A (Dell
    Technologies Capital) through a 2021 Series B led by Fidelity and the August 2025 Series C led by
    Maverick Capital with StepStone Group joining. The reported roughly USD1.4 billion post-money
    valuation is attributed to The Information and is not confirmed by the company.
