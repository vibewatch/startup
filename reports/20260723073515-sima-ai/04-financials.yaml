- id: traction-and-disclosure-gaps
  title: Public Traction Versus Private-Metric Gaps
  body: 'SiMa.ai''s public traction is expressed almost entirely in product milestones, funding, and partnerships rather than financial results. The company discloses no revenue, ARR, units shipped, gross margin, burn rate, or runway; third-party trackers report only that it has raised across roughly nine to ten rounds backed by about fifteen investors. This is a sharp contrast with its public comparators: Ambarella reports quarterly revenue, gross margin, cash position, and that roughly 80% of its revenue and over USD1 billion cumulative comes from edge AI, while Blaize files a full 10-K with revenue, losses, and risk factors. For SiMa.ai the missing private metrics — revenue and its growth rate, gross margin, monthly burn and runway, backlog and bookings, and customer concentration — are exactly the inputs an underwriter needs, and each has a concrete diligence path (management data room, audited statements, design-win pipeline under NDA). Until those are provided, SiMa.ai''s implied revenue can only be inferred as a proxy, and its competitive traction cannot be compared like-for-like against public peers. The disclosure gap is the single largest source of underwriting uncertainty in this report.'
