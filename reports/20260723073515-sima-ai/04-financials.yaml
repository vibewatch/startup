- id: capital-adequacy-and-runway
  title: Capital Adequacy, Financing Dependency, and Use of Funds
  body: 'SiMa.ai has raised approximately USD355 million in total across seed through its August 2025 Series C. The chronology runs from a 2020 Series A of roughly USD30 million, a 2021 Series B of about USD80 million with multiple extensions, a roughly USD70 million round in April 2024, the USD85 million Series C in August 2025 (led by Maverick Capital with StepStone Group joining and described as oversubscribed), and a strategic Micron investment reported around April 2026 that is separate from the headline Series C. The company states its Series C proceeds will scale Modalix production, expand globally, and deepen automotive and physical-AI go-to-market. Because SiMa.ai discloses neither cash on hand, monthly burn, nor runway, its capital adequacy cannot be measured directly; the pattern of a strategic round following the Series C within roughly eight months suggests financing is event-driven — tied to production scale-up and partnerships — rather than to a disclosed cash-out date. The financing-dependency risk is real and is illustrated by public peer Blaize, whose fiscal-2025 10-K carried a going-concern warning. An underwriter should treat undisclosed burn and reliance on periodic new capital as the central capital-structure question.'
