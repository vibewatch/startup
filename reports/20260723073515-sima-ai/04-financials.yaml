company:
  name: SiMa.ai
chapter:
  number: 4
  title: Financials
  summary: SiMa.ai runs a hardware-led model — selling its Modalix MLSoC silicon, system-on-modules (USD349 for 8GB and USD599 for 32GB in 1,000-unit quantities), and a USD1,499 developer kit, wrapped in its Palette software toolchain — distributed through partners such as Macnica, Enclustra, and ThinkRobotics. It has raised roughly USD355 million across seed through an August 2025 Series C (USD85 million, led by Maverick Capital with StepStone Group joining), followed by a strategic Micron investment reported around April 2026, and carries a reported but company-unconfirmed valuation of about USD1.4 billion. The company discloses no revenue, gross margin, burn, or runway, so its financial profile can only be underwritten by proxy against public fabless peers — Ambarella (fiscal-2026 revenue USD390.7 million, ~60% gross margin, still GAAP net-loss making) and Blaize (fiscal-2025 revenue ~USD38.6 million, ~USD103.8 million operating loss, going-concern warning). The absence of any disclosed private financials is the primary diligence blocker.
sections:
- id: revenue-model-and-monetization
  title: Revenue Model, Pricing, and Go-to-Market
  body: 'SiMa.ai monetizes primarily through hardware: it sells the Modalix MLSoC silicon, packaged system-on-modules, and developer kits, and layers its Palette software toolchain (including the Edgematic low-code environment and the LLiMa on-device LLM framework) on top rather than selling software as a standalone recurring license. Public pricing is unusually transparent for the category — production Modalix system-on-modules list at USD349 for the 8GB variant and USD599 for the 32GB variant in 1,000-unit quantities, and the developer kit is USD1,499 — but list-versus-realized pricing, volume discounts, and OEM contract terms are not disclosed. The go-to-market motion blends a direct sales effort with a distributor and partner channel (Macnica, Enclustra, ThinkRobotics) and ecosystem relationships (Synopsys for automotive tooling, L&T Technology Services for solution delivery) that shorten customer evaluation. SiMa.ai targets robotics, industrial automation, automotive, aerospace and defense, smart vision, and healthcare as revenue verticals. What remains opaque is the revenue mix across chips, modules, kits, and software, and whether Palette will ever be monetized as a separate line — both of which materially affect the durability and margin of the revenue base.'
