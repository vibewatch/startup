- id: named-customer-proof
  title: Named Customer Proof and Reference Quality
  body: 'The strongest named proof point is STIGA S.p.A., the leading European manufacturer of garden and outdoor equipment, which announced a strategic partnership (dated March 2026, first reported February 2026) to embed SiMa.ai''s Modalix MLSoC platform into its next-generation domestic and commercial robotic lawn mowers, with STIGA''s leadership publicly endorsing the collaboration. In industrial automation, SiMa disclosed an October 2024 partnership with TRUMPF to build AI-powered lasers using its chips. In aerospace and defense, SiMa is positioned (via founder interviews such as the Defense Disruptors series) around disconnected, battlefield, and autonomous-drone environments, though specific defense program names and volumes are not public. L&T Technology Services (September 2025) is a solution/engineering partner spanning in-vehicle infotainment, AD/ADAS, industrial automation, robotics, and healthcare on the MLSoC ONE platform, and VVDN serves as a design/manufacturing partner. Reference quality is mixed: the STIGA and TRUMPF relationships are named and dated with corroborating third-party coverage, but most are partnership or design-in announcements rather than production case studies with quantified outcomes (units, ROI, deployment scale). SiMa itself notes that not all of its customers have been made public, which limits the depth of independent verification.'
