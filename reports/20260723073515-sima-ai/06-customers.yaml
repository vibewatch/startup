figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Five-stage customer journey for SiMa.ai across embedded-edge OEM buyers, from vertical awareness through advocacy, reflecting the design-in-driven relationship pattern observed in the STIGA, TRUMPF, and LTTS engagements.
  data:
    items:
    - label: Awareness
      channel: Trade press, awards, founder interviews, conferences
      description: OEMs encounter SiMa via edge-AI coverage, the 2026 Edge AI + Vision Product of the Year award, Defense Disruptors and CEO interviews, and vertical marketing (robotics, industrial, defense).
    - label: Evaluation
      channel: Developer kits, Modalix SoMs, Palette/Edgematic, distributors
      description: Buyers evaluate Modalix using the USD1,499 developer kit and system-on-modules bought via Macnica, Enclustra, or ThinkRobotics, prototyping with the Palette SDK and no-code Edgematic environment.
    - label: Design-in
      channel: Direct sales + engineering partners (LTTS, VVDN)
      description: Customer qualifies Modalix into a specific platform (robot, laser, vehicle, camera). Solution partners LTTS and VVDN accelerate integration and manufacturing readiness.
    - label: Production
      channel: OEM production programs; distributor supply
      description: Design win moves to production availability (Modalix in production since Aug 2025). Pin/software compatibility with incumbent modules is used to shorten the pilot-to-production gap.
    - label: Advocacy / expansion
      channel: Co-announced partnerships, executive endorsements, case studies
      description: Customers endorse publicly (STIGA leadership) and expand the platform into adjacent use cases and regions, feeding land-and-expand across verticals.
  claimRefs:
  - CU002
  - CU005
  - CU013
  - CU024
  - CU027
