- id: adoption-and-deployment-trajectory
  title: Adoption and Deployment Trajectory
  body: 'SiMa.ai''s adoption story is expressed almost entirely through product milestones, partnerships, and design-in momentum rather than disclosed shipment or account numbers. Independent coverage (DatacenterDynamics) reported that the company roughly doubled its customer count between 2023 and 2024, and by mid-2024 it had first-generation MLSoC silicon in customers'' hands with second-generation Modalix samples following in Q4 2024. Modalix moved to production availability in August 2025, and the Modalix system-on-module launched publicly in 2025 before winning the Edge AI + Vision Alliance''s 2026 Product of the Year award for "Best Edge AI Board" in April 2026 — an external validation of maturity, though not a measure of unit volume. The deployment funnel is weighted toward early stages: many relationships are announced strategic partnerships (STIGA, TRUMPF, L&T Technology Services, VVDN) or evaluation seeding via developer kits and system-on-modules, with fewer independently verifiable high-volume production programs. The company frames Modalix as pin- and software-compatible with incumbent GPU-based modules to shorten evaluation and lower switching friction, which is designed to accelerate the move from pilot to production. What is missing is any disclosed count of active deployments, units shipped, locations, or utilization — so the trajectory reads as improving but unquantified.'
