company:
  name: SiMa.ai
chapter:
  number: 6
  title: Customers
  summary: SiMa.ai sells its Modalix MLSoC, system-on-modules, and Palette software into six target verticals — robotics, automotive/mobility, industrial automation, aerospace and defense, smart vision, and healthcare — reaching customers through direct sales, a distributor channel (Macnica, Enclustra, ThinkRobotics), and engineering/solution partners (L&T Technology Services, VVDN, Synopsys, AWS). The most concrete customer proof is a March 2026 strategic partnership with European garden-machinery leader STIGA to embed Modalix in next-generation robotic lawn mowers, plus an October 2024 TRUMPF collaboration for AI-powered industrial lasers and a positioning in aerospace/defense autonomy. Independent coverage reports SiMa roughly doubled its customer count from 2023 to 2024, and its Modalix system-on-module won the Edge AI + Vision Alliance 2026 Product of the Year for "Best Edge AI Board." The dominant diligence problem is that SiMa discloses no customer counts, no revenue by account, no retention or renewal metrics, and most named relationships are strategic partnerships and design-in announcements rather than verifiable volume-production deployments — so adoption durability and concentration cannot be independently measured.
sections:
- id: customer-segmentation-and-verticals
  title: Customer Base Segmentation, Verticals, and Channel
  body: 'SiMa.ai addresses the "embedded edge" — the compute layer between cloud data centers and low-power personal devices — targeting workloads in the roughly 5W-to-25W envelope. Its publicly stated target verticals are robotics, automotive and mobility, industrial automation, aerospace and defense, smart vision, and healthcare, and earlier company commentary named healthcare, smart retail, autonomous vehicles, government, and robotics as priority applications. The buyer is typically an OEM or system integrator embedding the Modalix MLSoC or system-on-module into a robot, camera, vehicle, or industrial machine, while the ultimate user is the enterprise operating that machine, so payer and user are usually distinct. Go-to-market blends direct enterprise sales with a distributor channel — Macnica (Japan/APAC), Enclustra, and ThinkRobotics resell modules and developer kits — and engineering/solution partners such as L&T Technology Services (mobility, healthcare, industrial automation, robotics), VVDN (design and manufacturing), Synopsys (automotive tooling), and AWS (Edgematic cloud integration). Geographically the company is San Jose-headquartered but is explicitly investing its 2025 Series C proceeds to expand in Korea, Japan, Europe, and the United States. Because SiMa publishes no revenue-band, account-size, or per-vertical revenue split, segmentation can only be described qualitatively from partnership and product evidence, not weighted by dollars.'
