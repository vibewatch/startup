- id: retention-and-durability
  title: Retention, Durability, and Satisfaction Signals
  body: 'SiMa.ai discloses no formal retention metrics — no net revenue retention (NRR), gross revenue retention (GRR), churn, renewal rate, contract length, or cohort data — so durability must be inferred from the structure of the business and indirect signals. Two structural factors argue for stickiness once a design win is secured: edge-silicon design-in cycles are long and costly, and a customer that qualifies Modalix into a robot, camera, or vehicle platform faces high re-engineering costs to switch, which historically produces multi-year platform lifetimes in embedded semiconductors. SiMa reinforces this with a full-stack software layer (Palette, Edgematic, the LLiMa on-device LLM runtime) and a model zoo that raise the integration surface and make switching more disruptive. Positive external signals include the 2026 Product of the Year award and the reported doubling of customers from 2023 to 2024, which implies at least some repeat and expanding demand. Against that, the counter-signals are material: no public renewals, no reference base with quantified satisfaction, no disclosed logo-retention, and a still-young second-generation product (Modalix in production only since August 2025) that has not yet demonstrated a full multi-year renewal cohort. Durability is therefore structurally plausible but empirically unproven.'
