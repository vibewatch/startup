- id: expansion-and-concentration-risk
  title: Expansion, Concentration, and Channel Dependence
  body: 'SiMa.ai''s expansion motion is a classic land-and-expand across verticals and geographies: it wins an initial design-in (e.g., robotic lawn mowers with STIGA, industrial lasers with TRUMPF), then aims to expand the same silicon-plus-software platform into adjacent use cases (AMRs, humanoids, ADAS, smart vision, healthcare) and new regions (Korea, Japan, Europe, US) funded by the August 2025 Series C. Concentration risk cannot be measured directly because SiMa discloses no per-customer revenue, but the qualitative picture is one of heavy dependence on early flagship partnerships and on a partner/distributor channel: L&T Technology Services and VVDN carry solution delivery and manufacturing, while Macnica, Enclustra, and ThinkRobotics carry distribution, so a meaningful share of go-to-market runs through intermediaries that add margin and reduce direct customer control. Procurement friction is significant in SiMa''s conservative target markets — automotive, defense, and industrial buyers run long qualification cycles and demand functional-safety and reliability evidence before volume commitment. The company mitigates switching and adoption friction by making Modalix pin- and software-compatible with incumbent modules, but the flip side is that the same compatibility lets customers dual-source or revert to entrenched suppliers such as NVIDIA. Net: expansion optionality is broad, but concentration and channel dependence remain unquantified diligence gaps.'
