- id: mitigations-monitoring-and-kill-criteria
  title: Mitigations, Monitoring Indicators, and Kill Criteria
  body: 'Each major risk has an available mitigation and an observable monitoring indicator, but most mitigations are early-stage and depend on disclosures SiMa has not yet made. For competitive risk, the mitigation is deepening the Palette software moat and locking in multi-year design wins; the monitoring indicator is design-win-to-production conversion and any published independent benchmark, and the kill criterion is loss of a flagship design-in to NVIDIA or a failure to show volume revenue by the next raise. For financing risk, the mitigation is the recent Series C and Micron backing; the indicator is cash runway and burn multiple, and the kill criterion is a down-round or inability to raise before runway expires. For supply-chain risk, the mitigation is qualifying alternate foundry/OSAT capacity and building inventory buffers; the indicator is single-source exposure and lead times, and the kill criterion is a TSMC allocation loss or a cross-strait disruption. For regulatory risk, the mitigation is export-control compliance programs and pursuing ISO 26262/ASIL and FDA qualification; the indicator is certification milestones and any BIS enforcement action, and the kill criterion is exclusion from a target vertical for lack of certification. For execution risk, the mitigation is broadening the leadership bench beyond the CEO; the indicator is key-executive retention and independent corroboration of the founding team. The core diligence asks are a management data room (financials, burn, runway, backlog), an independent Modalix benchmark, foundry/OSAT contracts, an export-control compliance review, and functional-safety certification evidence.'
