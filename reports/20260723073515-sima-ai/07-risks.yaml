- id: regulatory-and-legal-risk
  title: Regulatory and Legal Risk
  body: 'SiMa.ai operates in one of the most heavily regulated corners of hardware. The US Department of Commerce''s Bureau of Industry and Security (BIS) has since 2022 issued escalating export controls on advanced computing semiconductors and manufacturing equipment, and codified a 2026 license-review process that keeps China/Macau access tightly restricted, adds know-your-customer, shipment-ratio, and reporting obligations, and (per legal analyses) layers new tariffs and certification requirements on covered chips. For an edge-AI designer targeting global robotics, industrial, and automotive customers, these controls both shrink the addressable China market and raise compliance cost and diversion-liability risk. In automotive, ISO 26262 functional-safety certification (ASIL levels, with ASIL C/D demanding lock-step CPUs, ECC, FMEDA, and traceable safety architecture) is a de facto gate for design-in, and AI-specific guidance (ISO/PAS 8800, SOTIF/ISO 21448) is still maturing — a hurdle SiMa has not publicly demonstrated it clears. Healthcare (FDA) and aerospace/defense (ITAR, procurement security) impose further qualification. On the legal side, SiMa publishes a privacy policy (last updated November 2025) governing data handling, and as a fabless designer faces the semiconductor sector''s standard patent-infringement and IP-litigation exposure, though no material litigation against SiMa is publicly identified. The dominant regulatory risk is therefore market-access and qualification friction rather than active enforcement today.'
  claimRefs:
  - CR007
