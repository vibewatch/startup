callouts:
  - calloutType: strength
    title: OEM penetration is the central credibility anchor
    body: >-
      Even allowing for company-controlled framing, the combination of official deployment claims,
      AutoSens customer coverage, and May 2026 shipment reporting suggests SemiDrive has moved beyond
      pilot-stage automotive-semiconductor status into real OEM-scale adoption.
    claimRefs: [CO005, CO006, CO007, CO008]
  - calloutType: risk
    title: Current valuation and governance remain the largest overview gaps
    body: >-
      Public evidence supports fresh financing and broad commercialization, but not a confirmed
      post-Series-C price, audited revenue, formal board structure, or succession plan, so the
      investment case still depends on private diligence rather than public-market style disclosure.
    claimRefs: [CO004, CO014]
