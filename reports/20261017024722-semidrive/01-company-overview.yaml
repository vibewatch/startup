company:
  name: SemiDrive
chapter:
  number: 1
  title: Company Overview
  summary: >-
    SemiDrive has built a credible domestic automotive-chip position around automotive-grade SoCs and
    MCUs, with company and third-party sources agreeing on broad OEM penetration and multi-city R&D
    capability. The chapter's main constraints are governance opacity, current valuation ambiguity, and
    the lack of public revenue and headcount disclosure despite fresh 2026 financing.
sections:
  - id: identity-and-footprint
    title: Identity and operating footprint
    body: >-
      The assigned sources consistently describe SemiDrive as a 2018-founded Chinese automotive-chip
      designer serving OEM and Tier 1 vehicle programs, with product scope spanning cockpit, gateway,
      central-computing, and control workloads rather than a single point solution. The strongest
      primary evidence is the company's about page, which explicitly positions the business around
      automotive-grade SoCs and high-performance MCUs while also saying the product stack is expanding
      into embodied intelligence and industrial control. Geographic footprint is clearer than legal-HQ
      disclosure: company and event-profile sources show R&D centers across Beijing, Shanghai, Nanjing,
      and Shenzhen, with some third-party material adding Dalian plus field offices in Changchun and
      Wuhan. Exact headquarters treatment should remain cautious because the assigned pool contains
      inconsistent labeling between "Beijing" branding and Nanjing-based operating descriptions.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership visibility and governance gaps
    body: >-
      Leadership evidence in the assigned pool is founder-centric. Sina's May 2026 reporting says
      SemiDrive was co-founded by chair Qiu Yujing and former NXP Greater China automotive-business
      leader Zhang Qiang, tying the company's founding story to executives with prior automotive-chip
      commercialization experience. Official September 2026 coverage also names vice president Zhang
      Xitong as the public executive discussing the company's embodied-intelligence roadmap, which helps
      show there is operating depth beyond the founder. Even so, the usable sources do not disclose
      board composition, voting control, succession planning, or liquidation terms, so governance
      resilience and key-person concentration cannot be fully underwritten from public materials alone.
      That makes management diligence and cap-table review mandatory follow-up work rather than
      analytical niceties.
    claimRefs: [CO009, CO010]
    tableRefs: [TO002]
  - id: funding-scale-and-milestones
    title: Funding, scale, and milestone arc
    body: >-
      SemiDrive's public narrative combines rapid commercial scale with increasingly state-linked
      financing. Company and third-party sources support meaningful shipment and customer penetration:
      the company said its product portfolio had passed 10 million mass-produced units by end-2025,
      while two May 2026 Chinese reports pushed the cumulative shipment figure above 12 million and
      described more than 260 customers and over 200 designated programs. Financing evidence is usable
      but uneven. Two May 2026 articles support a near-$100 million Series C round led by Suchan
      Investment, with Shaanxi Automobile Hongde joining as a strategic shareholder; Multiples adds a
      broader database view that the company has raised $655 million across six rounds and completed
      further Series C extensions in September 2026. The valuation picture is weaker: Multiples lists
      $1.9 billion as of July 2024, but the assigned pool does not provide a primary current-round
      price, audited revenue, or headcount, so investment readiness still depends on private diligence.
    claimRefs: [CO005, CO006, CO007, CO008, CO011, CO012, CO013, CO014, CO015, CO016]
    tableRefs: [TO003]
    figureRefs: [FO001]
