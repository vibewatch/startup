    - type: missing-source
      severity: material
      topic: 2026-round-pricing
      missingEvidence: Post-money valuation ownership dilution and liquidation-preference terms for the May and September 2026 Series C financings.
      whyItMatters: Entry-price discipline depends on knowing whether the latest capital came in above or below the last visible valuation band and on what downside-protection terms.
      diligencePath: Request the signed term sheet cap-table bridge and board-approved financing memo from management or the lead investor syndicate.
      relatedQuestionRefs: [QV003]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Revenue run-rate gross margin shipment-to-revenue conversion and burn/runway data for the current operating plan.
      whyItMatters: Shipment and customer counts can support strategic relevance while still failing to support venture returns if monetization or gross margin quality is weak.
      diligencePath: Review current management accounts revenue cohorting ASP trends and gross-margin bridges by product family.
      relatedQuestionRefs: [QV004, QV008]
    - type: missing-source
      severity: material
      topic: governance-and-exit
      missingEvidence: Board control preference stack secondary liquidity terms and a credible IPO or strategic-exit timeline.
      whyItMatters: Even a strong company can be a weak investment if governance downside protection and exit path are misaligned with the proposed entry price.
      diligencePath: Obtain shareholder-rights summaries governance documents and management's financing/liquidity roadmap before IC.
      relatedQuestionRefs: [QV008]
