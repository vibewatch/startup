schemaVersion: report-v2
artifact: customers
slug: semidrive
runDate: 2026-10-17
company:
  name: SemiDrive
chapter:
  number: 6
  title: Customers
  summary: >-
    Public customer evidence shows SemiDrive has reached broad design-win scale in
    China's auto market, with independent summaries repeatedly citing more than
    260 customers, more than 200 designated projects, over 90% OEM coverage, and
    cumulative chip shipments above 14 million by September 2026. The strongest
    named proof is a LeadDrive production migration case and public references to
    Great Wall, BYD, and other OEMs, but retention, renewal, and customer
    concentration metrics remain undisclosed.
sections:
  - id: customer-footprint
    title: Customer base is broad, China-heavy, and primarily automotive B2B
    body: >-
      The retained evidence describes SemiDrive as a B2B automotive chip vendor
      selling into OEM vehicle programs, domain-controller platforms, and Tier-1
      integration projects rather than direct consumer channels. Independent
      summaries converge on a similar headline footprint: more than 260 customers,
      more than 200 designated projects, and reach across more than 90% of
      Chinese automakers, with some international OEM references layered on top.
      That is meaningful breadth for a fabless automotive semiconductor company,
      but the public evidence still describes the footprint in customer-count and
      project-count terms instead of disclosed revenue mix, active production
      accounts, or booked lifetime-value cohorts. The result is a customer base
      that looks wide and strategically embedded, while still being hard to rank
      by economic importance.
    claimRefs:
      - CU001
      - CU002
      - CU007
      - CU010
    tableRefs:
      - TU001
  - id: adoption-proof
    title: Named proof is strongest at the design-win and production-migration layer
    body: >-
      SemiDrive's best public adoption proof is not a logo wall but a concrete
      engineering migration story. IAR's LeadDrive case study says LeadDrive
      selected SemiDrive's E3 MCU line after evaluation, integrated MCAL drivers
      and platform code, and used the toolchain-plus-MCU stack to support mass
      production in NEV powertrain programs. Broader market-data and investor
      summaries extend the picture by naming Great Wall Motor, BYD, Changan, FAW,
      SAIC, Dongfeng, BMW, and Volkswagen as customer references while EVShift and
      a third-party investor tear sheet both repeat the September 2026 milestone
      that cumulative shipments topped 14 million units. Together, these signals
      support real adoption and expansion, but they still mix direct deployment
      proof with summary-level customer references, so named customer quality is
      uneven across the portfolio.
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU012
      - CU014
    tableRefs:
      - TU002
      - TU003
    figureRefs:
      - FU001
  - id: durability-and-concentration
    title: Durability and concentration remain the main customer diligence gaps
    body: >-
      SemiDrive's public materials and third-party summaries are much better at
      proving customer breadth than customer durability. None of the retained
      sources disclose renewal rates, churn, GRR, NRR, contract duration, or
      customer cohort behavior, so retention is still inferential rather than
      measured. Export diversification also remains limited in the public record:
      EVShift said less than 10% of chips had previously gone into export-bound
      vehicles, and the refresh recovered prior Zeekr and CarNewsChina domains
      without recreating a direct, current SemiDrive deployment citation from
      them. That leaves the investment question centered on whether broad domestic
      design-win penetration converts into durable, concentrated economic value at
      the account level, or whether the company still depends on a diffuse pipeline
      of projects whose revenue weighting is not externally visible.
    claimRefs:
      - CU008
      - CU009
      - CU010
      - CU011
      - CU013
      - CU014
callouts:
  - calloutType: risk
    title: Breadth is public; retention economics are not
    body: >-
      Public sources support customer count, project count, and shipment scale,
      but they do not disclose renewal, churn, top-customer revenue mix, or
      contract duration. That makes concentration and durability the key customer
      diligence swing factors.
    claimRefs:
      - CU002
      - CU009
      - CU010
      - CU014
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Public scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Chinese OEM programs
        - OEM engineering and vehicle-platform teams; automaker budgets fund programs
        - Smart cockpit, autonomous-driving, gateway, and MCU domain-controller chips
        - '>90% of Chinese car manufacturers; >260 customers overall'
        - Strategic design-win breadth across the domestic auto market
        - No public split by active production account, ASP, or top-customer revenue
      - - International OEM references
        - International automakers and China-for-global programs
        - Unspecified automotive chip programs named in funding and market summaries
        - BMW and Volkswagen cited; export-bound chips previously <10% of mix
        - Shows some global relevance beyond local OEMs
        - Current refresh lacks direct program-level production proof for named export models
      - - Tier-1 / powertrain integrators
        - Engineering teams at suppliers such as LeadDrive; OEM programs ultimately pay
        - E3 MCU migration for NEV dual-motor controllers and power systems
        - LeadDrive case study with chief engineer quote and mass-production framing
        - Demonstrates embedded use in safety-critical subsystems
        - No disclosed contract value, shipment volume, or renewal cadence
      - - Ecosystem / toolchain expansion
        - Toolchain, MCAL, and development ecosystem partners
        - Developer workflow, safety certification, and faster migration onto domestic MCUs
        - IAR plus >200-company partner network around SemiDrive platforms
        - Helps expansion by lowering integration friction for future customer programs
        - Partner-network size is not the same as paying-customer count
    notes: >-
      Public evidence mixes customers, projects, partner-network breadth, and OEM
      coverage; no retained source discloses customer revenue concentration or
      active-production account mix.
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU007
      - CU008
      - CU010
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Cumulative chip shipments
        - '>14 million units'
        - 2026-09
        - EVShift; Silicon Valley Invest Club tear sheet
        - medium
        - Confirms meaningful installed-base scale in auto programs
        - No split by product line, active vehicles, or annualized shipment run rate
      - - Customer count
        - '>260 customers'
        - 2026 public summaries
        - AutoSens; EVShift; Multiples
        - medium
        - Indicates broad design-win reach
        - No definition of active versus historical customers
      - - Designated / mass-production projects
        - '>200 designated projects'
        - 2026 public summaries
        - AutoSens; EVShift
        - medium
        - Suggests large funnel of OEM and Tier-1 programs
        - No conversion rate from projects to scaled recurring revenue
      - - Domestic OEM coverage
        - '>90% of Chinese car manufacturers'
        - 2026 public summaries
        - AutoSens; EVShift; Multiples
        - medium
        - Points to unusually broad domestic OEM penetration
        - No list of active production accounts by OEM or vehicle platform
      - - Export-bound chip mix
        - '<10% previously used in export-bound vehicles'
        - 2026-09
        - EVShift
        - medium
        - Shows international exposure exists but remains secondary
        - No named export customer revenue or shipment mix
    notes: >-
      The retained public metrics are not directly comparable: shipments,
      customers, projects, and OEM coverage measure different denominators and do
      not disclose account-level economics.
    claimRefs:
      - CU002
      - CU003
      - CU008
      - CU010
      - CU012
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome / proof
      - Limitation
    rows:
      - - LeadDrive
        - NEV powertrain supplier / Tier-1 integrator
        - E3 MCU migration for dual-motor controllers and power systems
        - Production-oriented / mass-production support
        - Public case study names the customer, migration tasks, and chief engineer quote
        - Page does not disclose unit volume, contract size, or renewal history
      - - Great Wall Motor
        - Chinese OEM
        - Domain-controller chip supply
        - Public supply reference
        - Named in third-party market-data summary as an OEM supplied by SemiDrive
        - Specific vehicle program and timing not independently refreshed
      - - BYD
        - Chinese OEM
        - Domain-controller chip supply
        - Public supply reference
        - Named in third-party market-data summary as an OEM supplied by SemiDrive
        - Specific vehicle program and timing not independently refreshed
      - - BMW / Volkswagen
        - International OEM references
        - Unspecified customer relationships in funding-disclosure summaries
        - Public reference only
        - Helps corroborate non-domestic OEM reach beyond China-only brands
        - No refreshed program-level deployment evidence recovered in this run
    notes: >-
      This is a partial enumeration of named public customer proof, not an
      exhaustive customer list; row quality is strongest where a source describes
      an actual migration or deployed use case instead of a summary mention.
    enumerationScope:
      coverage: partial
      basis: >-
        Named customer and deployment references recovered from the chapter's
        assigned prefetched evidence pack during the October 2026 refresh run.
    claimRefs:
      - CU004
      - CU006
      - CU007
      - CU013
      - CU014
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      SemiDrive's public customer journey runs from OEM or Tier-1 design-in to
      ecosystem-assisted migration, designated projects, and cumulative shipment
      scale, with durability data still missing.
    data:
      items:
        - label: Domestic OEM targeting
          title: Domestic OEM targeting
          detail: >-
            SemiDrive positions into central computing, smart cockpit, gateway,
            and MCU programs across the Chinese passenger-vehicle market.
          touchpoints:
            - '>90% of Chinese automakers cited in public summaries'
            - Product families X9, V9, G9, and E3 recur across customer-facing materials
        - label: Tier-1 design-in
          title: Tier-1 design-in
          detail: >-
            Named suppliers such as LeadDrive evaluate SemiDrive parts for
            subsystem programs where local MCU substitution matters.
          touchpoints:
            - LeadDrive selected E3 after evaluation
            - NEV powertrain and dual-motor controller context is explicit
        - label: Toolchain migration
          title: Toolchain migration
          detail: >-
            IAR plus SemiDrive support porting, MCAL integration, and functional
            safety readiness, lowering adoption friction.
          touchpoints:
            - MCAL drivers and platform code were ported
            - TÜV-focused toolchain support is part of the sales motion
        - label: Designated program funnel
          title: Designated program funnel
          detail: >-
            Public summaries cite more than 200 designated mass-production
            projects as the bridge from design wins to revenue.
          touchpoints:
            - '>200 designated projects'
            - Conversion from project count to scaled revenue is undisclosed
        - label: Fleet-scale shipment proof
          title: Fleet-scale shipment proof
          detail: >-
            Independent 2026 summaries report cumulative shipments above
            14 million units, indicating vehicles are on the road.
          touchpoints:
            - '>14 million cumulative shipments by September 2026'
            - '>260 customers across the public footprint'
        - label: Expansion and concentration gap
          title: Expansion and concentration gap
          detail: >-
            Export mix appears to be growing, but public retention and
            concentration metrics remain missing.
          touchpoints:
            - '<10% prior export-bound chip mix'
            - No public NRR, GRR, churn, or top-customer revenue disclosure
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU005
      - CU008
      - CU009
      - CU010
      - CU014
