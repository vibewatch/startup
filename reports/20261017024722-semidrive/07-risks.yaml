  evidenceGaps:
    - type: missing-source
      severity: material
      topic: supply-chain-continuity
      missingEvidence: Foundry, packaging, wafer-allocation, and export-control contingency details for X9/X10/V9 and overseas OEM programs.
      whyItMatters: Without supplier and node visibility, the report cannot distinguish ordinary scaling risk from a deeper supply-continuity or geopolitics risk.
      diligencePath: Request supplier concentration, process-node roadmap, second-source plans, and export-control memos from management.
      relatedQuestionRefs: [QR008]
    - type: missing-source
      severity: material
      topic: legal-and-incident-history
      missingEvidence: Litigation schedule, product-liability claims, recall history, cyber incident log, and regulator correspondence for China and export markets.
      whyItMatters: Public silence does not prove legal cleanliness, yet unresolved incident history can change the severity ranking of every other operating risk.
      diligencePath: Review counsel letters, insurance schedules, recall logs, and customer-quality escalation records.
      relatedQuestionRefs: [QR008]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: blocking
      topic: valuation-runway-and-governance
      missingEvidence: Post-Series-C cap table, liquidation preferences, revenue, gross margin, burn, runway, and covenant package.
      whyItMatters: Financing dependence is visible, but price-sensitive underwriting remains weak without the terms and operating data that show how much room SemiDrive actually has.
      diligencePath: Obtain management accounts, signed financing documents, board observer materials, and investor-rights schedules.
      relatedQuestionRefs: [QR008]
      relatedTableRefs: [TR003]
