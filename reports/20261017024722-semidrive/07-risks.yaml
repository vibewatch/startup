chapter:
  number: 7
  title: Risks
  summary: >-
    SemiDrive's risk profile is driven less by a disclosed legal event than by execution stretch: the company is taking its first named overseas OEM step while broadening into embodied-intelligence products and still relying on repeated outside financing. The strongest mitigants are real domestic shipment scale, a broad OEM footprint, and a reported certification base, but the assigned public record still leaves foundry continuity, round terms, and incident history under-documented.
sections:
  - id: ranked-risk-landscape
    title: Ranked residual risk landscape
    body: >-
      The highest residual risk in the assigned public record is the gap between SemiDrive's domestic scale and its still-early overseas operating proof. South China Morning Post and Tech in Asia both describe the late-2026 European OEM program as the company's first foreign OEM mass-production deployment, while also noting that fewer than 10% of prior shipments had gone into export-bound vehicles. That makes the launch strategically important, but it also means SemiDrive's global support, qualification, and escalation processes are not yet proven at the same scale as its China programs. The second major risk is governance and disclosure opacity: third-party trackers and press reports confirm substantial capital raised, but they do not close the gap on cap-table terms, litigation history, or a verifiable runway model. Publicly visible mitigants exist, especially reported certification breadth and prior mass production, but the residual view stays elevated until management produces customer-specific launch milestones, legal schedules, and financing documents.
    claimRefs: [CR001, CR002, CR003, CR005, CR010, CR012, CR013]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: operational-and-product-stress
    title: Operational and product stress
    body: >-
      SemiDrive is trying to scale along several vectors at once: more international supply, more advanced cockpit and control products, and a newly explicit embodied-intelligence roadmap. The evidence does not show a present operational failure, but it does show why the burden is rising. Sina's May 2026 coverage says the C round was near US$100 million and explicitly warns that splitting those proceeds across cockpit SoCs, MCUs, and robotics is not especially roomy, while also describing a faster 2-3 year automotive chip cycle that raises the density of R&D spending and recovery risk. SemiDrive's own 2026 corporate-news page shows repeated launches, awards, and conference appearances tied to AI cockpit and robot-compute themes, reinforcing that this expansion is active rather than hypothetical. The operating implication is that certification upkeep, field-support capacity, and product-prioritization discipline matter as much as raw chip demand.
    claimRefs: [CR005, CR006, CR009, CR011]
    tableRefs: [TR002]
  - id: dependencies-mitigations-and-kill-criteria
    title: Dependencies, mitigations, and kill criteria
    body: >-
      SemiDrive's strongest external dependencies sit with OEM programs, strategic capital, and the undocumented supply chain underneath its chip roadmap. AutoSens and Leiphone both describe broad customer and project penetration, which reduces single-logo concentration risk, yet Sina also describes co-development with carmakers and Tier 1s, meaning platform losses or delayed SOP decisions can still strand engineering spend. Multiples records six funding rounds and additional 2026 Series C tranches, supporting the view that SemiDrive has continued access to capital, but not that it has become self-funding. The practical kill criteria are therefore measurable: a slipped or unnamed European SOP, signs that embodied-intelligence work is crowding out core automotive execution, or financing that arrives with punitive terms because revenue, margin, and burn remain undisclosed. Because the assigned sources do not confirm foundry allocation, export-control contingency, or a full legal incident register, those items remain diligence blockers rather than cleanly resolved risks.
    claimRefs: [CR004, CR007, CR008, CR010, CR012, CR013]
    tableRefs: [TR003]
