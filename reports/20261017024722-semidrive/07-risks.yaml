callouts:
  - calloutType: risk
    title: Overseas proof is still thinner than the headline suggests
    body: >-
      The European OEM win matters, but it is still SemiDrive's first disclosed foreign OEM mass-production program and starts from an export base that SCMP says was below 10% of historic shipments.
    claimRefs: [CR001, CR002, CR010]
  - calloutType: insight
    title: Domestic scale is a mitigation, not a full de-risking event
    body: >-
      Reported certifications, >260 customers, and millions of shipped chips show real traction, yet the assigned pool still leaves customer concentration, legal history, and runway visibility materially incomplete.
    claimRefs: [CR003, CR004, CR007, CR012, CR013]
