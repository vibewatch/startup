  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - AI cockpit / infotainment compute
        - OEM cockpit platform owner or cockpit Tier 1
        - HMI, IVI, OS, and in-car AI teams
        - OEM vehicle-program budget
        - Chip selection, middleware adaptation, vehicle validation, and launch SOP
        - Cockpit-domain or vehicle-platform owner
        - Need for local AI compute, bandwidth, and multi-screen concurrency
      - - Zonal / vehicle-control MCUs
        - OEM E/E architecture owner or domain-controller Tier 1
        - Control-software and vehicle-electronics engineers
        - OEM program budget with Tier 1 integration spend
        - Safety validation, AUTOSAR/MCAL integration, design win, and mass-production ramp
        - E/E architecture or controller-platform owner
        - Shift toward central computing and zonal architectures
      - - Powertrain / advanced smart control
        - OEM powertrain domain owner or ECU supplier
        - Real-time control and functional-safety teams
        - Powertrain-controller BOM owner
        - Control tuning, certification, vehicle-program nomination, and launch
        - Powertrain-domain owner
        - Need for higher performance than legacy MCUs at viable system cost
      - - Embodied-AI adjacency
        - Robot OEM or embodied-AI partner
        - Robotics control and perception teams
        - Pilot or strategic-innovation budget
        - Prototype integration, control-stack adaptation, and commercialization pilots
        - CTO or advanced-program sponsor
        - Reuse of auto-grade reliability and control silicon in new hardware categories
    notes: >-
      Buyer/payer mapping is inferred from who co-defines requirements, owns validation, and funds program
      launches in the cited OEM/Tier 1 workflows; it is not a disclosed account-level org chart.
    claimRefs: [CM009, CM010, CM011, CM012]
