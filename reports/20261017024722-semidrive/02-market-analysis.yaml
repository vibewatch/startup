      Ordered from broader category demand to company-specific adoption depth. Layers intentionally mix a
      market fitment rate, coverage ratios, customer/program counts, model counts, and unit shipments, so
      the chart should be read as stacked sizing lenses rather than as a conversion funnel or a revenue
      bridge.
    claimRefs: [CM003, CM004, CM005, CM007, CM008, CM010]
callouts:
  - calloutType: strength
    title: Penetration data gives SemiDrive a real SAM lens even without a public TAM
    body: >-
      The combination of 76.62% intelligent-cockpit fitment in 2025 China, 3.77% cockpit share, more than
      90% Chinese-OEM reach, more than 260 customers, and more than 14 million shipped chips shows that
      SemiDrive already participates in scaled vehicle programs rather than only in pilot spending.
    claimRefs: [CM003, CM004, CM005, CM007, CM008]
  - calloutType: risk
    title: Embodied-AI adjacency expands the story faster than it proves monetization
    body: >-
      The adjacency is strategically plausible because SemiDrive is porting auto-grade compute and control
      capabilities into robotics, but public reporting still describes commercialization as uncertain and
      notes that one financing round now has to support cockpit SoCs, MCUs, and embodied-AI initiatives at
      the same time.
    claimRefs: [CM012, CM013, CM014]
