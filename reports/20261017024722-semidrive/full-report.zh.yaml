    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 看多
        - 管理层披露强劲的收入转化、毛利率和治理条款，同时入场价格仍处于或低于最近可见的约 $1.9B-$2.0B 参考区间。
