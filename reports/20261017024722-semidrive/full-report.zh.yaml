  - id: FE001
    title: SemiDrive 产品架构与交付栈
    type: stack
    summary: 已保留来源显示，SemiDrive 围绕国产汽车芯片定位，逐层叠加车辆工作负载、芯片系列、软件集成、合规控制和邻近机器人业务拓展。
    data:
      layers:
        - label: 车辆工作负载
          detail: 将 SemiDrive 的公开产品叙事对应到其声称覆盖的主要车载计算和控制工作负载。
          note: Public profiles center SemiDrive on intelligent cockpit, smart driving, gateways, and MCUs.
          items:
            - label: 智能座舱
              note: 2026 official-news titles and third-party profiles keep cockpit compute at the front of the story.
            - label: 智能驾驶 / ADAS
              note: Public family references extend into higher-value vehicle compute.
            - label: 网关 / 分区控制
              note: Central-computing and zonal-control positioning implies consolidation below the top compute layer.
            - label: MCU 控制
              note: MCU coverage supports lower-level safety and control workloads.
        - label: 芯片系列与资产
          detail: 公开的第三方和渠道材料提到少数芯片系列，但没有完整的 SKU 目录。
          note: Public third-party and channel material name four series and the X9/V9/G9 family set.
          items:
            - label: X9 / X9H
              value: L2+ / cockpit-adjacent compute
              note: Multiples cites 8-core Arm plus 4 TOPS on SMIC 16nm for X9H.
            - label: V9
              value: Autonomous-driving family
              note: Third-party summaries place V9 in the autonomous-driving roadmap.
            - label: G9
              value: Automotive chip family
              note: Publicly named but thinly specified in assigned sources.
            - label: UniDrive
              value: Platform wrapper
              note: Presented as an autonomous-driving platform built on V9 chips.
        - label: 软件与集成
          note: Independent proof is strongest where SemiDrive is paired with middleware and security tooling.
          modules:
            - label: AUTOSAR 基础工程
            - label: 安全固件驱动
            - label: RTA-SEC 模块
            - label: 客户交付支持
        - label: 安全与网络安全控制
          detail: 即使完整的产品安全文档尚未公开，认证和安全更新要求仍可从公开信息中看到。
          note: >-
            Public evidence highlights qualification and secure-update requirements rather than raw benchmark
            leadership.
          items:
            - label: ISO 26262 流程与产品声明
            - label: AEC-Q100 可靠性声明
            - label: ISO/SAE 21434 网络安全声明
            - label: 安全启动 / 安全更新要求
        - label: 工业化与采用背景
          note: >-
            Market sources say vehicle architectures and local-sourcing pressure are raising the value of domain and MCU
            suppliers.
          outputs:
            - label: Domain-controller consolidation
            - label: Zonal E/E migration
            - label: Domestic-chip preference
            - label: Compliance-driven controller selection
        - label: 邻近领域与路线图延展
          detail: 2026 年的信号显示，SemiDrive 正将同一套计算与控制叙事延伸至邻近的机器人和工业主题。
          note: 2026 company and financing signals push the stack beyond current auto programs.
          items:
            - label: X10 AI 座舱营销
            - label: 具身智能 / 机器人
            - label: 工业应用
            - label: 动力总成展会亮相
    approximationNotes: 由于指定来源池不包含官方最新框图或按系列划分的数据表，各层边界合并了多种公开描述。
    claimRefs:
      - CE001
      - CE003
      - CE007
      - CE009
      - CE010
      - CE013
      - CE014
      - CE016
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: SemiDrive 的公开客户旅程从 OEM 或 Tier-1 定点开始，经过生态协助迁移和定点项目，走向累计出货规模；耐久性数据仍然缺失。
    data:
      items:
        - label: 国内 OEM 目标客户
          title: Domestic OEM targeting
          detail: SemiDrive 面向中国乘用车市场的中央计算、智能座舱、网关和 MCU 项目进行定位。
          touchpoints:
            - 公开摘要引用的中国车企超过 90%
            - 面向客户的材料反复提及 X9、V9、G9 和 E3 产品系列
        - label: Tier-1 定点
          title: Tier-1 design-in
          detail: LeadDrive 等具名供应商会在本地 MCU 替代重要的子系统项目中评估 SemiDrive 零部件。
          touchpoints:
            - LeadDrive 评估后选择 E3
            - 语境明确涉及 NEV 动力总成和双电机控制器
        - label: 工具链迁移
          title: Toolchain migration
          detail: IAR 加上 SemiDrive 支持移植、MCAL 集成和功能安全准备，降低了采用门槛。
          touchpoints:
            - MCAL 驱动和平台代码已完成移植
            - 面向 TÜV 的工具链支持属于销售动作的一部分
        - label: 定点项目漏斗
          title: Designated program funnel
          detail: 公开摘要引用超过 200 个量产定点项目，认为它们是从产品定点走向收入的桥梁。
          touchpoints:
            - '>200 个定点项目'
            - 从项目数量到规模化收入的转化尚未披露
        - label: 车队规模出货验证
          title: Fleet-scale shipment proof
          detail: 2026 年独立摘要报告累计出货量超过 1400 万台，说明搭载产品的车辆已经上路。
          touchpoints:
            - 截至 2026 年 9 月累计出货量超过 1400 万台
            - 公开覆盖范围内客户超过 260 家
        - label: 拓展与集中度缺口
          title: Expansion and concentration gap
          detail: 出口占比似乎正在上升，但公开的留存和集中度指标仍然缺失。
          touchpoints:
            - 先前出口芯片占比 <10%
            - 未公开披露 NRR、GRR、流失率或头部客户收入
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU005
      - CU008
      - CU009
      - CU010
      - CU014
