  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: SemiDrive 在战略上重要，但估值不透明打断了从经营验证走向立即投资建议的路径。
    data:
      nodes:
        - id: proof
          label: 商业验证
          summary: Broad customer and OEM penetration plus 12M+ cumulative shipments show real market traction.
          note: 规模验证存在，但收入转化尚未披露。
          claimRefs:
            - CV007
            - CV008
        - id: capital
          label: 战略资本
          summary: The May 2026 Series C and cumulative financing signal investor support and policy relevance.
          note: 新融资验证了战略相关性，但不代表价格有吸引力。
          claimRefs:
            - CV003
            - CV004
        - id: roadmap
          label: 2026 年路线图期权
          summary: Public messaging ties cockpit and vehicle-control chips to embodied-intelligence expansion.
          note: 期权性支撑上行空间，但也扩大了执行要求。
          claimRefs:
            - CV001
            - CV002
        - id: disclosure
          label: 披露缺口
          summary: Public 2026 round pages omit valuation and provide no public revenue margin or preference detail.
          note: 缺少价格和经济数据，无法形成买入信心。
          claimRefs:
            - CV005
        - id: comps
          label: 可比公司不确定性
          summary: Public comp pages mix unlike businesses and only loosely bound a usable valuation range.
          note: 可比公司只能提供方向，不足以支持定价判断。
          claimRefs:
            - CV006
            - CV011
        - id: verdict
          label: 跟踪，不买入
          summary: Advance only if entry resets to the visible band or primary diligence proves stronger economics.
          note: 在缺少披露的情况下，隐含的上调定价使该投资组合更接近放弃。
          claimRefs:
            - CV012
            - CV013
            - CV014
      edges:
        - from: proof
          to: capital
          label: 验证相关性
          claimRefs:
            - CV003
            - CV007
            - CV008
        - from: capital
          to: roadmap
          label: 为扩张提供资金
          claimRefs:
            - CV001
            - CV003
            - CV004
        - from: roadmap
          to: disclosure
          label: 增加尽调负担
          claimRefs:
            - CV001
            - CV002
            - CV005
        - from: disclosure
          to: comps
          label: 削弱价格三角验证
          claimRefs:
            - CV005
            - CV011
        - from: comps
          to: verdict
          label: 强化入场纪律
          claimRefs:
            - CV012
            - CV013
            - CV014
    approximationNotes: 未计算隐含转化率或加权评分；该流程仅展示原作者设定的逻辑链。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV007
      - CV008
      - CV011
      - CV012
      - CV013
      - CV014
