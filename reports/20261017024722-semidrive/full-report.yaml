              - CR011
      - number: '7.3'
        title: Dependencies, mitigations, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              SemiDrive's strongest external dependencies sit with OEM programs, strategic capital, and the undocumented
              supply chain underneath its chip roadmap. AutoSens and Leiphone both describe broad customer and project
              penetration, which reduces single-logo concentration risk, yet Sina also describes co-development with
              carmakers and Tier 1s, meaning platform losses or delayed SOP decisions can still strand engineering
              spend. Multiples records six funding rounds and additional 2026 Series C tranches, supporting the view
              that SemiDrive has continued access to capital, but not that it has become self-funding. The practical
              kill criteria are therefore measurable: a slipped or unnamed European SOP, signs that
              embodied-intelligence work is crowding out core automotive execution, or financing that arrives with
              punitive terms because revenue, margin, and burn remain undisclosed. Because the assigned sources do not
              confirm foundry allocation, export-control contingency, or a full legal incident register, those items
              remain diligence blockers rather than cleanly resolved risks.
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR010
