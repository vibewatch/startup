      - number: '6.3'
        title: Durability and concentration remain the main customer diligence gaps
        blocks:
          - type: paragraph
            body: >-
              SemiDrive's public materials and third-party summaries are much better at proving customer breadth than
              customer durability. None of the retained sources disclose renewal rates, churn, GRR, NRR, contract
              duration, or customer cohort behavior, so retention is still inferential rather than measured. Export
              diversification also remains limited in the public record: EVShift said less than 10% of chips had
              previously gone into export-bound vehicles, and the refresh recovered prior Zeekr and CarNewsChina domains
              without recreating a direct, current SemiDrive deployment citation from them. That leaves the investment
              question centered on whether broad domestic design-win penetration converts into durable, concentrated
              economic value at the account level, or whether the company still depends on a diffuse pipeline of
              projects whose revenue weighting is not externally visible.
            claimRefs:
              - CU008
