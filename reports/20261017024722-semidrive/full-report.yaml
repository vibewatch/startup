      - number: '2.2'
        title: Evidence-constrained sizing and penetration lenses
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not support a defensible TAM/SAM/SOM in dollars, so the chapter uses penetration
              lenses rather than a single inflated market estimate. The strongest public indicators are installed-base
              and design-win proxies: more than 14 million cumulative chips shipped, more than 90% Chinese-automaker
              reach, more than 260 customers, and more than 200 designated projects. Sina's cited GaoGong data adds a
              category-level anchor, with 76.62% intelligent-cockpit fitment in China's 2025 passenger-car market and
              SemiDrive at 3.77% share of that segment, fifth overall and first among domestic vendors. These metrics
              show real procurement penetration, but they still stop short of translating into revenue-linked SAM or SOM
              because the public record does not disclose chip-family ASPs, annual unit mix, or program win rates.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM007
              - CM008
