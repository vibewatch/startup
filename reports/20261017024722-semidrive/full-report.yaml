            body: >-
              The adjacency is strategically plausible because SemiDrive is porting auto-grade compute and control
              capabilities into robotics, but public reporting still describes commercialization as uncertain and notes
              that one financing round now has to support cockpit SoCs, MCUs, and embodied-AI initiatives at the same
              time.
