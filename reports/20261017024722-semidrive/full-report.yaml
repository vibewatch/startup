  - id: FE001
    title: SemiDrive product architecture and delivery stack
    type: stack
    summary: >-
      The retained sources show SemiDrive layering vehicle workloads, chip families, software integration, compliance
      controls, and adjacent robotics expansion around a domestic automotive-chip positioning.
    data:
      layers:
        - label: Vehicle workloads
          detail: >-
            Maps SemiDrive's public product story to the main in-vehicle compute and control workloads it claims to
            cover.
          note: Public profiles center SemiDrive on intelligent cockpit, smart driving, gateways, and MCUs.
          items:
            - label: Intelligent cockpit
              note: 2026 official-news titles and third-party profiles keep cockpit compute at the front of the story.
            - label: Smart driving / ADAS
              note: Public family references extend into higher-value vehicle compute.
            - label: Gateway / zonal control
              note: Central-computing and zonal-control positioning implies consolidation below the top compute layer.
            - label: MCU control
              note: MCU coverage supports lower-level safety and control workloads.
        - label: Chip families and assets
          detail: Public third-party and channel material name a small set of chip families, but not a complete SKU catalog.
          note: Public third-party and channel material name four series and the X9/V9/G9 family set.
          items:
            - label: X9 / X9H
              value: L2+ / cockpit-adjacent compute
              note: Multiples cites 8-core Arm plus 4 TOPS on SMIC 16nm for X9H.
            - label: V9
              value: Autonomous-driving family
              note: Third-party summaries place V9 in the autonomous-driving roadmap.
            - label: G9
              value: Automotive chip family
              note: Publicly named but thinly specified in assigned sources.
            - label: UniDrive
              value: Platform wrapper
              note: Presented as an autonomous-driving platform built on V9 chips.
        - label: Software and integration
          note: Independent proof is strongest where SemiDrive is paired with middleware and security tooling.
          modules:
            - label: AUTOSAR basic engineering
            - label: Security firmware drivers
            - label: RTA-SEC modules
            - label: Customer delivery support
        - label: Safety and cybersecurity controls
          detail: >-
            Qualification and secure-update requirements are visible publicly even where full product security
            documentation is not.
          note: >-
            Public evidence highlights qualification and secure-update requirements rather than raw benchmark
            leadership.
          items:
            - label: ISO 26262 process and product claims
            - label: AEC-Q100 reliability claims
            - label: ISO/SAE 21434 cybersecurity claims
            - label: Secure boot / secure update expectations
        - label: Industrialization and adoption context
          note: >-
            Market sources say vehicle architectures and local-sourcing pressure are raising the value of domain and MCU
            suppliers.
          outputs:
            - label: Domain-controller consolidation
            - label: Zonal E/E migration
            - label: Domestic-chip preference
            - label: Compliance-driven controller selection
        - label: Adjacency and roadmap stretch
          detail: >-
            2026 signals show SemiDrive extending the same compute-and-control narrative into adjacent robotics and
            industrial themes.
          note: 2026 company and financing signals push the stack beyond current auto programs.
          items:
            - label: X10 AI cockpit marketing
            - label: Embodied-intelligence / robotics
            - label: Industrial applications
            - label: Powertrain exhibition presence
