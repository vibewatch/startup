chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating footprint
        blocks:
          - type: paragraph
            body: >-
              The assigned sources consistently describe SemiDrive as a 2018-founded Chinese automotive-chip designer
              serving OEM and Tier 1 vehicle programs, with product scope spanning cockpit, gateway, central-computing,
              and control workloads rather than a single point solution. The strongest primary evidence is the company's
              about page, which explicitly positions the business around automotive-grade SoCs and high-performance MCUs
              while also saying the product stack is expanding into embodied intelligence and industrial control.
              Geographic footprint is clearer than legal-HQ disclosure: company and event-profile sources show R&D
              centers across Beijing, Shanghai, Nanjing, and Shenzhen, with some third-party material adding Dalian plus
              field offices in Changchun and Wuhan. Exact headquarters treatment should remain cautious because the
              assigned pool contains inconsistent labeling between "Beijing" branding and Nanjing-based operating
              descriptions.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
