  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Verdict and price discipline
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports treating SemiDrive as a serious strategic asset, but not as a price-insensitive
              buy. The visible record shows a fresh May 2026 C round, state-linked and strategic backers, broad OEM
              penetration, and continued 2026 product marketing around AI cockpit and embodied-intelligence chips. What
              it does not show is the post-money valuation for the 2026 financings, the liquidation-preference stack, or
              any public revenue, gross-margin, or burn disclosure. That combination makes TRACK the disciplined call:
              keep the company active in diligence, but do not underwrite the round until price and economics are
              disclosed or the entry level resets.
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV008
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The constructive case is real. SemiDrive appears to have meaningful domestic scale, strong strategic
              alignment with Chinese industrial policy, and a product roadmap that can extend from cockpit and control
              chips into newer robot and embodied-intelligence workloads. That helps explain continued investor
              interest. The anti-thesis is equally important: the same roadmap expansion raises capital demands, and
              independent reporting explicitly flags commercialization uncertainty and the risk that a roughly $100
              million round is thin relative to the number of product fronts the company is trying to fund. Without
              operating metrics, the market cannot yet tell whether scale proof is translating into venture-grade
              returns.
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenario bracketing and comparable context
        blocks:
          - type: paragraph
            body: >-
              The available comparable evidence is helpful mainly as a boundary condition, not as a clean pricing model.
              Public private-market pages cluster the last visible SemiDrive valuation marks around about $1.9 billion
              to $2.0 billion before any disclosed 2026 repricing, but the latest public round pages omit the valuation
              field. The comp set exposed on public data services mixes unlike businesses, including automotive
              software, robotaxi, test equipment, and photonics names, so precise multiple triangulation would be false
              precision. The right use of the comp set is therefore directional: it confirms investor appetite for
              mobility/industrial-intelligence platforms, while reinforcing that SemiDrive still needs primary diligence
              before a firm price can be justified.
            claimRefs:
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The next diligence step is not more storytelling; it is price and economics discovery. Management or lead
              investors need to show the May and September 2026 round pricing, preference terms, customer concentration,
              shipment-to-revenue conversion, and gross-margin profile. If those materials show that SemiDrive can
              monetize its shipment and OEM footprint efficiently while still entering at or below the last visible
              private-market band, the recommendation can move up. If the hidden 2026 valuation stepped up materially
              without matching proof on revenue quality, governance, or liquidity path, the risk/reward shifts the other
              way and the file should move toward avoid despite the company's strategic appeal.
            claimRefs:
              - CV005
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Current stance
            body: >-
              Track a differentiated domestic auto-chip platform, but require 2026 pricing and economics before
              committing capital.
            calloutType: recommendation
            claimRefs:
              - CV012
          - type: callout
            title: What breaks the case
            body: >-
              A hidden 2026 step-up round without matching proof on revenue quality or governance would make the
              downside asymmetric.
            calloutType: risk
            claimRefs:
              - CV014
