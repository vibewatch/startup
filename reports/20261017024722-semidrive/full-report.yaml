      - number: '3.4'
        title: Competitive position looks credible, but public comparison economics remain incomplete
        blocks:
          - type: paragraph
            body: >-
              The chapter-level conclusion is that SemiDrive has a defensible domestic automotive position, but not a
              fully transparent one. Official and third-party sources support a real installed base, broad product
              coverage and current expansion into adjacent AI-centric workloads. What they do not support is a clean
              price or performance matrix against incumbents, nor documented win-loss data against internal build or
              legacy imported stacks. Even Multiples only labels the business model generically as product sales and
              subscription, which is too coarse for underwriting commercial durability. That means the most credible
              reader takeaway is narrower: SemiDrive looks competitively relevant and increasingly broad, but moat
              durability still depends on evidence that is private or not yet disclosed in the retained source set.
            claimRefs:
              - CP011
              - CP013
              - CP014
