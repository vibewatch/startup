  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base is broad, China-heavy, and primarily automotive B2B
        blocks:
          - type: paragraph
            body: >-
              The retained evidence describes SemiDrive as a B2B automotive chip vendor selling into OEM vehicle
              programs, domain-controller platforms, and Tier-1 integration projects rather than direct consumer
              channels. Independent summaries converge on a similar headline footprint: more than 260 customers, more
              than 200 designated projects, and reach across more than 90% of Chinese automakers, with some
              international OEM references layered on top. That is meaningful breadth for a fabless automotive
              semiconductor company, but the public evidence still describes the footprint in customer-count and
              project-count terms instead of disclosed revenue mix, active production accounts, or booked lifetime-value
              cohorts. The result is a customer base that looks wide and strategically embedded, while still being hard
              to rank by economic importance.
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU010
          - type: table
