            title: Penetration data gives SemiDrive a real SAM lens even without a public TAM
            body: >-
              The combination of 76.62% intelligent-cockpit fitment in 2025 China, 3.77% cockpit share, more than 90%
              Chinese-OEM reach, more than 260 customers, and more than 14 million shipped chips shows that SemiDrive
              already participates in scaled vehicle programs rather than only in pilot spending.
