  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual risk landscape
        blocks:
          - type: paragraph
            body: >-
              The highest residual risk in the assigned public record is the gap between SemiDrive's domestic scale and
              its still-early overseas operating proof. South China Morning Post and Tech in Asia both describe the
              late-2026 European OEM program as the company's first foreign OEM mass-production deployment, while also
              noting that fewer than 10% of prior shipments had gone into export-bound vehicles. That makes the launch
              strategically important, but it also means SemiDrive's global support, qualification, and escalation
              processes are not yet proven at the same scale as its China programs. The second major risk is governance
              and disclosure opacity: third-party trackers and press reports confirm substantial capital raised, but
              they do not close the gap on cap-table terms, litigation history, or a verifiable runway model. Publicly
              visible mitigants exist, especially reported certification breadth and prior mass production, but the
              residual view stays elevated until management produces customer-specific launch milestones, legal
              schedules, and financing documents.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR010
              - CR012
