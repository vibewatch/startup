      - number: '5.3'
        title: Maturity, differentiation, and adjacency
        blocks:
          - type: paragraph
            body: >-
              The maturity signals in this pool are solid but still uneven. Channel and conference profiles say
              SemiDrive has completed tape-out across four chip series, achieved mass production, and built up multiple
              automotive-grade certifications; Multiples adds named family references such as X9, V9, G9, and UniDrive,
              including a public X9H specification that anchors the product story in real silicon rather than generic
              marketing. The differentiation case is helped by macro tailwinds: S&P says Chinese automakers are
              increasingly adopting local silicon suppliers as chip self-reliance becomes strategic. At the same time,
              SemiDrive's 2026 official-news index and financing summaries show the roadmap stretching beyond core
              vehicle chips into AI cockpit marketing, robotics, and industrial applications, which broadens upside but
              also expands execution scope.
            claimRefs:
              - CE004
              - CE005
              - CE009
              - CE010
              - CE011
              - CE015
              - CE016
      - number: '5.4'
        title: Technical dependencies and unresolved risks
        blocks:
          - type: paragraph
            body: >-
              The biggest technology risk in the public record is not whether SemiDrive has a product map, but whether
              it can keep scaling that map under external dependency constraints. S&P notes that Chinese automakers
              still rely heavily on U.S. suppliers for advanced chips, while Mordor highlights export-control frictions
              on sub-28-nanometer design tools and the 2026 need for secure-update and cybersecurity controls. Those
              macro pressures matter because SemiDrive's public third-party specification for X9H already points to a
              more advanced-node design. What remains missing is the operational detail an investor would want before
              underwriting platform durability: current foundry and packaging redundancy, family-by-family production
              status, field-failure data, and product-level security documentation.
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
