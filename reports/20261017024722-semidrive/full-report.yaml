        title: Exhibits
        blocks:
          - type: callout
            title: 'Best-supported edge: domestic breadth plus trust'
            body: >-
              SemiDrive's public moat evidence is strongest where breadth, certifications and OEM penetration overlap;
              it is not strongest where buyers usually want hard commercial proof, such as pricing, discounting or
              documented head-to-head displacement.
            calloutType: insight
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP011
          - type: callout
            title: Key comparison blocker is commercial opacity
            body: >-
              The assigned pool shows that SemiDrive is competitively relevant, but it does not show which price points,
              contract structures or replacement wins actually convert that product breadth into durable share against
              incumbents or internal build.
            calloutType: risk
            claimRefs:
