      - number: '7.2'
        title: Operational and product stress
        blocks:
          - type: paragraph
            body: >-
              SemiDrive is trying to scale along several vectors at once: more international supply, more advanced
              cockpit and control products, and a newly explicit embodied-intelligence roadmap. The evidence does not
              show a present operational failure, but it does show why the burden is rising. Sina's May 2026 coverage
              says the C round was near US$100 million and explicitly warns that splitting those proceeds across cockpit
              SoCs, MCUs, and robotics is not especially roomy, while also describing a faster 2-3 year automotive chip
              cycle that raises the density of R&D spending and recovery risk. SemiDrive's own 2026 corporate-news page
              shows repeated launches, awards, and conference appearances tied to AI cockpit and robot-compute themes,
              reinforcing that this expansion is active rather than hypothetical. The operating implication is that
              certification upkeep, field-support capacity, and product-prioritization discipline matter as much as raw
              chip demand.
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
