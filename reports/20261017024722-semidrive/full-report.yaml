  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape breadth is real, but the visible peer set is messy
        blocks:
          - type: paragraph
            body: >-
              The retained evidence says SemiDrive is competing for more than a single ECU socket. AutoSens describes
              central computing, zonal control, intelligent cockpit and smart vehicle-control coverage, while
              independent funding coverage says SemiDrive is one of the few chip designers offering both
              automotive-grade SoCs and high-performance MCUs. That breadth means buyers can compare it against domestic
              auto-chip specialists, larger public semiconductor incumbents, and adjacent autonomy or
              software-defined-vehicle vendors that touch the same architecture budgets. Multiples reinforces that
              ambiguity: its comparator page mixes semiconductor and adjacent autonomy/software names rather than
              showing a clean pure-play chip cohort. The public record is therefore strongest on SemiDrive's own
              footprint and weakest on one-for-one named rival benchmarking.
            claimRefs:
