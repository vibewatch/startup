  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and workload fit
        blocks:
          - type: paragraph
            body: >-
              SemiDrive's public product story is organized around the vehicle's future electrical/electronic
              architecture rather than one narrow ECU socket. A distributor line card and an industry-event profile both
              place the company across intelligent cockpit, smart-driving, gateway, and MCU categories, while also
              framing the offer around central computing and zonal control. That matters because it suggests the company
              is trying to win a platform position inside Chinese OEM programs: higher-level cockpit and ADAS compute at
              the top, then gateway and controller coverage lower in the stack. The company-claimed differentiation is
              breadth rather than a single standout benchmark, and the assigned pool does not include current official
              datasheets that would let an investor verify feature parity family by family.
            claimRefs:
              - CE001
