        title: Architecture, software, and compliance path
        blocks:
          - type: paragraph
            body: >-
              The clearest independent integration proof in the assigned pool is not a chip benchmark but the ETAS
              partnership around AUTOSAR. Gasgoo says the two companies provide a functional- and
              information-security-compliant AUTOSAR solution based on SemiDrive processors and microcontrollers, and
              that ETAS basic engineering, security firmware drivers, and RTA-SEC modules have already been equipped on
              SemiDrive chips. That integration story fits broader Chinese regulatory tightening: Mordor says 2026 OTA
              and cybersecurity rules link MCU selection to secure boot, secure update, and in-vehicle network
              protection. In practice, SemiDrive's architecture case is strongest where silicon, middleware, and
              compliance can be sold as a bundle rather than as a standalone chip.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE013
