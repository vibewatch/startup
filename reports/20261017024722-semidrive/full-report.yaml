      - number: '3.3'
        title: SemiDrive's best evidenced moat is trust plus installed-base reach
        blocks:
          - type: paragraph
            body: >-
              SemiDrive's strongest supported defenses are distribution and trust, not transparent price leadership.
              AutoSens says the company completed five major automotive-grade safety or security certifications and
              already serves more than 260 customers, more than 200 designated projects and over 90% of Chinese car
              manufacturers. Independent 2026 coverage adds that SemiDrive combines automotive SoCs and high-performance
              MCUs and is using fresh capital to keep deepening cockpit and vehicle-control products. Those facts imply
              switching friction for buyers already qualified on SemiDrive's stack: replacing a validated automotive
              chip line is harder than swapping commodity software. The same evidence also shows the moat is not static,
              because the roadmap now extends into embodied-intelligence, robotics and industrial applications.
            claimRefs:
