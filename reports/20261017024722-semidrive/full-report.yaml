            title: Breadth is the core product thesis
            body: >-
              SemiDrive's product story is strongest when read as a domestic multi-domain vehicle-compute stack:
              cockpit, smart-driving, gateway, and MCU coverage line up with China's push toward local sourcing and
              domain/zonal architectures.
            calloutType: strength
            claimRefs:
