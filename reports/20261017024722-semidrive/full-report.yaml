      - number: '2.3'
        title: Buyer, user, and payer map
        blocks:
          - type: paragraph
            body: >-
              The economic buyer is not a retail consumer but the vehicle program owner: OEM platform teams and their
              Tier 1 integration partners decide whether SemiDrive enters the bill of materials. Sources describe a
              joint-definition motion in which automakers and Tier 1s co-develop requirements around cockpit AI, E/E
              architecture migration, and real-time control, which means SemiDrive's adoption path runs through safety
              validation, software ecosystem readiness, and mass-production support rather than through simple price-led
              component substitution. That procurement logic also explains why customer count, designated-project count,
              and OEM coverage are more informative than generic semiconductor TAMs for this business.
            claimRefs:
              - CM005
              - CM006
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Adoption drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              The main growth driver is the increasing compute intensity of China's smart-vehicle transition. Sina's
              reported 76.62% intelligent-cockpit fitment rate, combined with AIWedo's description of higher bandwidth
              and NPU requirements for on-device large-model deployment, supports continued demand for higher-value
              cockpit and control silicon. The counterweights are executional: automotive chip design cycles remain long
              even after compressing to roughly two to three years, qualification and ecosystem requirements stay heavy,
              and embodied AI is explicitly described as commercially uncertain. That makes the embodied-AI adjacency
              credible as narrative upside but not yet proven as near-term revenue. The missing public inputs are
              exactly the ones needed to convert the adoption story into a price-sensitive revenue model.
            claimRefs:
              - CM007
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
