      - number: '4.2'
        title: Capital needs and cost-structure signals
        blocks:
          - type: paragraph
            body: >-
              On financing, the strongest current signal is fund-raising rather than cash generation. Gasgoo and S&P
              AutoTechInsight both reported that SemiDrive's 2026 Series C, C+, and C++ financings totaled about RMB 1
              billion, and Gasgoo separately said the May 2026 C round was nearly $100 million. Sina reported cumulative
              financing above RMB 4.4 billion after that May round, which broadly aligns with Multiples' $655 million
              lifetime-funding total once currency translation and round timing are considered. The more important
              underwriting point is use of funds: Gasgoo, Sina, and SemiDrive's own 2026 news feed all connect current
              spend to intelligent-cockpit, vehicle-control, and embodied-intelligence programs. Sina's adverse
              commentary is financially important because it argues that spreading roughly $100 million across cockpit
              SoCs, MCUs, and embodied-intelligence expansion is "并不宽裕," reinforcing that future execution still depends
              on disciplined capital deployment.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI010
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI006
              - CI007
              - CI008
              - CI009
              - CI011
              - CI016
      - number: '4.3'
        title: Underwriting blockers and verdict
        blocks:
          - type: paragraph
            body: >-
              The chapter's positive read is that SemiDrive has visible commercial momentum and continued access to
              growth capital; the negative read is that nearly every underwriting-quality metric remains private. None
              of the retained sources discloses reported revenue, realized product pricing, gross margin, burn, cash on
              hand, debt, or runway, so the financing headline cannot yet be translated into self-sustaining unit
              economics. Valuation visibility is also soft: Multiples ties the business to a $1.9 billion July 2024
              valuation, while a separate Silicon Valley Invest Club tear sheet still shows $2 billion as of 2023, and
              neither source substitutes for a current cap table. CompaniesMarketCap's $57.82 billion October 2026
              market capitalization for NXP is only a scale benchmark, but it underscores how much larger the
              balance-sheet resources of mature auto-chip incumbents are than SemiDrive's disclosed private funding
              base. Net: the business appears commercially real, but revenue quality, margin path, and capital adequacy
              still require management accounts before underwriting.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Revenue quality is still the main diligence blocker
            body: >-
              SemiDrive's 2026 financing momentum and shipment/customer proxies demonstrate commercial relevance, but
              the public record still does not convert those proxies into revenue, gross margin, or runway. That leaves
              management accounts, not public traction headlines, as the gating input for underwriting.
            calloutType: risk
            claimRefs:
              - CI004
              - CI007
              - CI008
              - CI011
