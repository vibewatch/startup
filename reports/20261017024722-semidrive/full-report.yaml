              - CU007
              - CU008
              - CU010
      - number: '6.2'
        title: Named proof is strongest at the design-win and production-migration layer
        blocks:
          - type: paragraph
            body: >-
              SemiDrive's best public adoption proof is not a logo wall but a concrete engineering migration story.
              IAR's LeadDrive case study says LeadDrive selected SemiDrive's E3 MCU line after evaluation, integrated
              MCAL drivers and platform code, and used the toolchain-plus-MCU stack to support mass production in NEV
              powertrain programs. Broader market-data and investor summaries extend the picture by naming Great Wall
              Motor, BYD, Changan, FAW, SAIC, Dongfeng, BMW, and Volkswagen as customer references while EVShift and a
              third-party investor tear sheet both repeat the September 2026 milestone that cumulative shipments topped
              14 million units. Together, these signals support real adoption and expansion, but they still mix direct
              deployment proof with summary-level customer references, so named customer quality is uneven across the
              portfolio.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
