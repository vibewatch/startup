      - number: '1.2'
        title: Leadership visibility and governance gaps
        blocks:
          - type: paragraph
            body: >-
              Leadership evidence in the assigned pool is founder-centric. Sina's May 2026 reporting says SemiDrive was
              co-founded by chair Qiu Yujing and former NXP Greater China automotive-business leader Zhang Qiang, tying
              the company's founding story to executives with prior automotive-chip commercialization experience.
              Official September 2026 coverage also names vice president Zhang Xitong as the public executive discussing
              the company's embodied-intelligence roadmap, which helps show there is operating depth beyond the founder.
              Even so, the usable sources do not disclose board composition, voting control, succession planning, or
              liquidation terms, so governance resilience and key-person concentration cannot be fully underwritten from
              public materials alone. That makes management diligence and cap-table review mandatory follow-up work
              rather than analytical niceties.
            claimRefs:
              - CO009
              - CO010
