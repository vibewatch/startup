          - type: callout
            title: Public integration proof is ahead of public silicon disclosure
            body: >-
              Independent evidence shows AUTOSAR ecosystem integration and policy fit, but current public evidence is
              still thin on SKU-level specs, foundry redundancy, and product-level reliability or security detail.
            calloutType: risk
