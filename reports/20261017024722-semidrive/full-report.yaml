  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction proxies
        blocks:
          - type: paragraph
            body: >-
              The public record supports a semiconductor product-sales model first and a fully underwritten
              recurring-software model second. Multiples explicitly labels SemiDrive's revenue model as "Product sales,
              Subscription," while AutoSens describes the company as an automotive-grade chip supplier spanning central
              computing, zonal control, intelligent cockpits, and vehicle control. That mix is directionally useful, but
              it does not expose how much revenue comes from chip ASPs, software, engineering support, or any one
              product family. Commercial traction looks real: Gasgoo reported cumulative shipments above 14 million
              chips by August 2026, and AutoSens reported more than 260 customers, over 200 designated projects, and
              coverage of more than 90% of Chinese car manufacturers. Sina added a market-share datapoint, placing
              SemiDrive fifth in China's 2025 passenger-car smart-cockpit preinstall market at 3.77%. Those are credible
              activity signals, but they are still proxies rather than revenue disclosure.
            claimRefs:
