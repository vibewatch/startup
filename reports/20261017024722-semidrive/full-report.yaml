  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Served market boundary
        blocks:
          - type: paragraph
            body: >-
              SemiDrive should be analyzed as a supplier to the intelligent-vehicle compute stack, not as a proxy for
              the whole automotive semiconductor market. The consistent product boundary across the assigned sources is
              automotive-grade intelligent-cockpit processors and smart-control silicon spanning zonal control, domain
              controllers, powertrain control, and adjacent embodied-AI control workloads. That boundary matters because
              it ties SemiDrive to OEM and Tier 1 design-in budgets where functional safety, software adaptation, and
              long qualification cycles govern adoption, instead of to broad undifferentiated semiconductor TAM figures.
              The embodied-AI narrative expands the adjacency set, but the evidence still points to vehicle programs as
              the core monetized demand center today.
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
