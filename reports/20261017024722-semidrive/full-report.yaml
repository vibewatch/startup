      - number: '1.3'
        title: Funding, scale, and milestone arc
        blocks:
          - type: paragraph
            body: >-
              SemiDrive's public narrative combines rapid commercial scale with increasingly state-linked financing.
              Company and third-party sources support meaningful shipment and customer penetration: the company said its
              product portfolio had passed 10 million mass-produced units by end-2025, while two May 2026 Chinese
              reports pushed the cumulative shipment figure above 12 million and described more than 260 customers and
              over 200 designated programs. Financing evidence is usable but uneven. Two May 2026 articles support a
              near-$100 million Series C round led by Suchan Investment, with Shaanxi Automobile Hongde joining as a
              strategic shareholder; Multiples adds a broader database view that the company has raised $655 million
              across six rounds and completed further Series C extensions in September 2026. The valuation picture is
              weaker: Multiples lists $1.9 billion as of July 2024, but the assigned pool does not provide a primary
              current-round price, audited revenue, or headcount, so investment readiness still depends on private
              diligence.
