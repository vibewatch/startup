      - number: '3.2'
        title: Public incumbents still dominate on disclosed operating scale
        blocks:
          - type: paragraph
            body: >-
              The cleanest incumbent benchmark in the assigned pool is NXP. CompaniesMarketCap reports NXP at $57.82B
              market cap as of October 2026, and the retained Stock Analysis snapshot reports $13.19B in
              trailing-twelve-month revenue with 34,500 employees. That does not prove product superiority against
              SemiDrive on any specific cockpit or vehicle-control program, but it does show the scale asymmetry buyers
              can choose when they prefer disclosed financial strength, long operating history and public-company
              procurement comfort. The public-incumbent alternative also appears broader than any single private China
              auto-chip rival, because NXP's comparator surface lists much larger diversified chip names such as NVIDIA,
              Texas Instruments and Analog Devices.
