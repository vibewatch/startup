      - ["Vehicle-control / MCU chips", "Product sales to vehicle-control programs", "Per chip and per platform", "Funding narrative repeatedly names vehicle-control chips but no segment revenue split", "Relevant product line with no public mix disclosure", "Request revenue mix and gross margin by control-chip family"]
      - ["Embodied-intelligence / robotics chips", "Expansion-stage product sales", "Per chip or module", "New 2026 expansion area with no disclosed booked revenue", "Strategically important but commercially early", "Request signed orders, pilot count, and revenue timing for robotics programs"]
      - ["Software / subscription element", "Possible recurring software or support component", "Contract or subscription fee", "Multiples labels \"Product sales, Subscription\" but no corroborated pricing or contract detail", "Low-confidence descriptor until management documents it", "Request contract templates and recognized software revenue history"]
    notes: >-
      Public sources identify revenue mechanisms and strategic focus, but they do not disclose
      realized pricing, revenue mix, or recognized software revenue.
