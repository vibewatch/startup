  - id: TI002
    title: Pricing / monetization table
    columns:
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - ["Cockpit SoC ASPs", "Not publicly disclosed", "Unknown customer-specific rebates and warranty terms", "Gasgoo plus AutoSens disclose scale but not price"]
      - ["Vehicle-control / MCU ASPs", "Not publicly disclosed", "Unknown volume discounts and design-win economics", "Gasgoo and Sina describe product investment rather than price realization"]
      - ["Design-win / engineering support fees", "Not publicly disclosed", "Unknown NRE structure and support obligations", "No retained source publishes program-commercial terms"]
      - ["Software / subscription monetization", "Multiples lists a subscription element but gives no price", "Unknown whether this is support, tooling, or recurring software", "Multiples"]
    notes: >-
      This table intentionally separates public mechanism disclosure from unavailable commercial
      terms; every row still needs management-side pricing evidence.
    claimRefs:
      - CI001
      - CI003
      - CI010
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Cumulative chip shipments", ">14 million by end-August 2026", "Medium", "Scale proxy for manufacturing and demand", "Request shipped units by product family and shipped-revenue conversion"]
      - ["Customers served", ">260", "Medium", "Diversification proxy for customer breadth", "Request active revenue customers and top-10 concentration"]
      - ["Designated projects", ">200", "Medium", "Pipeline proxy for future SOP volume", "Request conversion rate from designation to production revenue"]
      - ["2025 China smart-cockpit share", "3.77% / fifth place", "Medium", "External traction datapoint for one product line", "Request market-share bridge to revenue and gross profit"]
      - ["Capital raised", ">RMB 4.4 billion cumulative / $655 million lifetime databases", "Medium", "Indicates access to financing for long design cycles", "Request cash on hand, debt schedule, and net cash after Series C extensions"]
      - ["Burn / runway", null, "Low", "Core capital-adequacy metric is undisclosed publicly", "Request monthly burn, capex commitments, and runway scenario"]
      - ["Gross margin / cost stack", null, "Low", "Needed to distinguish shipment scale from economic quality", "Request foundry, packaging, test, warranty, and support gross-margin bridge"]
    notes: >-
      Public unit-economics coverage is mostly activity-based; null means the metric was not
      publicly disclosed in the retained source set and needs direct diligence.
    claimRefs:
      - CI004
      - CI006
      - CI007
      - CI008
      - CI009
      - CI011
      - CI016
figures:
  - id: FI001
    title: Public revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a chip-sales bridge from design wins and shipments into revenue
      and reinvestment, but it does not disclose the monetization or margin values inside the bridge.
    data:
      nodes:
        - label: Designated projects
          displayValue: ">200 projects"
          note: AutoSens reports more than 200 designated projects.
        - label: Customer base
          displayValue: ">260 customers"
          note: AutoSens reports more than 260 customers.
        - label: Volume shipments
          displayValue: ">14M cumulative chips"
          note: Gasgoo reported cumulative chip shipments exceeded 14 million units by end-August 2026.
        - label: Product revenue
          displayValue: "Not publicly disclosed"
          note: Public sources identify chip-sales mechanisms but not reported revenue.
        - label: Gross profit pool
          displayValue: "Not publicly disclosed"
          note: Foundry, packaging, test, warranty, and support economics are not public.
        - label: R&D / expansion spend
          displayValue: "~RMB 1B 2026 Series C"
          note: 2026 financing was earmarked for cockpit, control, and embodied-intelligence programs.
      edges:
        - from: Designated projects
          to: Customer base
          label: Programs broaden account coverage
        - from: Customer base
          to: Volume shipments
          label: Design wins convert into production volume
        - from: Volume shipments
          to: Product revenue
          label: Shipments create billable semiconductor sales
        - from: Product revenue
          to: Gross profit pool
          label: Revenue less foundry and service costs
        - from: Gross profit pool
          to: R&D / expansion spend
          label: Internal cash generation plus external funding
    approximationNotes: >-
      Node values mix public activity metrics with undisclosed commercial stages; the bridge is
      directional and does not imply published conversion rates or margins.
    claimRefs:
      - CI003
      - CI007
      - CI010
      - CI016
callouts:
  - calloutType: risk
    title: Revenue quality is still the main diligence blocker
    body: >-
      SemiDrive's 2026 financing momentum and shipment/customer proxies demonstrate commercial
      relevance, but the public record still does not convert those proxies into revenue, gross
      margin, or runway. That leaves management accounts, not public traction headlines, as the
      gating input for underwriting.
    claimRefs:
      - CI004
      - CI007
      - CI008
      - CI011
      - CI014
