evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board composition, voting rights, succession planning, and reserved-matters documentation.
    whyItMatters: >-
      Founder-centric public evidence is not enough to assess governance resilience or downside control in a late-stage
      private company.
    diligencePath: Request the current board roster, shareholder agreement, and management succession plan during diligence.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Confirmed post-Series-C valuation, current revenue run-rate, gross margin, headcount, and cash runway.
    whyItMatters: >-
      These metrics determine whether public shipment and customer traction support the implied private-market price and
      financing durability.
    diligencePath: Obtain the latest financing documents, management accounts, and HR headcount summary.
    relatedQuestionRefs:
      - QO005
      - QO006
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: headquarters
    missingEvidence: >-
      An official legal-entity disclosure or registry extract that reconciles Beijing branding with Nanjing-based
      operating descriptions.
    whyItMatters: >-
      Headquarters ambiguity is not investment-thesis breaking, but it affects jurisdiction, incentive, and governance
      mapping.
    diligencePath: Check PRC corporate registration, registered address history, and the latest official company profile.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      A third-party market model that isolates SemiDrive's served TAM/SAM/SOM by cockpit SoCs, control MCUs/domain
      controllers, geography, and buyer segment.
    whyItMatters: >-
      Without a scoped market model, the public record supports adoption proxies but not a price-sensitive view of how
      much revenue pool remains.
    diligencePath: >-
      Obtain third-party market research or management's bottoms-up program model with segment definitions that match
      SemiDrive's disclosed product scope.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: monetization-gap
    missingEvidence: >-
      Chip-family ASPs, annual shipment mix, program win rates, and any disclosed revenue split across cockpit, control,
      and embodied-AI products.
    whyItMatters: >-
      These are the inputs required to convert strong penetration data into SAM/SOM and valuation-relevant revenue
      forecasts.
    diligencePath: >-
      Request management operating data by product family and reconcile it to customer/program cohorts and annualized
      shipment volumes.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Customer-facing chip ASPs, contract lengths, NRE terms, volume commitments and realized discounting versus
      incumbent alternatives.
    whyItMatters: >-
      Without commercial terms, the chapter cannot prove whether product breadth translates into durable share or only
      into technical qualification.
    diligencePath: >-
      Request customer contracts, distributor price books or procurement examples that show SemiDrive's commercial
      position against incumbent automotive chip vendors.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Program-level win-loss data showing when OEMs chose SemiDrive over NXP-class incumbents or internal platform
      reuse.
    whyItMatters: >-
      The current chapter can show installed-base and certification signals, but not the observed economics or timing of
      actual displacement.
    diligencePath: >-
      Ask management for named design-win case studies, replacement examples or procurement references that document the
      decision path against incumbents or internal build.
    relatedQuestionRefs:
      - QP007
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: Recognized revenue, revenue mix by product line, and any actual software or subscription revenue.
    whyItMatters: >-
      Shipment and customer counts cannot be converted into revenue quality or valuation support without booked and
      recognized revenue.
    diligencePath: Request audited 2024-2026 income statements and a product-line revenue bridge.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin-and-cost-stack
    missingEvidence: Gross margin, foundry and packaging costs, test costs, warranty reserves, and SKU-level realized ASPs.
    whyItMatters: >-
      Margin path determines whether growing shipments translate into durable economics or just scale without
      profitability.
    diligencePath: Request a gross-margin bridge by major chip family plus supplier-cost schedules.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Cash on hand, monthly burn, debt obligations, capex commitments, and runway after the 2026 Series C extensions.
    whyItMatters: Financing headlines alone do not establish capital adequacy for long automotive semiconductor design cycles.
    diligencePath: Request the latest balance sheet, cash-flow statement, debt schedule, and management runway model.
    relatedQuestionRefs:
      - QI006
  - type: conflicting-data
    severity: material
    topic: valuation-reference
    missingEvidence: >-
      An authoritative cap-table or term-sheet reference reconciling the $2.0 billion 2023 tear-sheet mark and the $1.9
      billion July 2024 database mark.
    whyItMatters: >-
      Entry price and dilution analysis depend on a confirmed post-money reference, not third-party database
      disagreement.
    diligencePath: Request the July 2024 round term sheet and the current fully diluted cap table.
    relatedQuestionRefs:
      - QI007
  - type: missing-source
    severity: material
    topic: sku-level-performance
    missingEvidence: >-
      Current official datasheets or benchmark sheets for each named family, including X9, V9, G9, gateway, and MCU
      variants.
    whyItMatters: >-
      Public product breadth is visible, but underwriting technical defensibility needs feature, node, performance, and
      safety scope at the SKU level.
    diligencePath: Request current product briefs, safety manuals, and design-win-ready datasheets by family from management.
    relatedQuestionRefs:
      - QE002
      - QE009
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: field-reliability
    missingEvidence: >-
      Field-failure rates, RMA data, SOP conversion by design win, and shipment mix by product family or named OEM
      program.
    whyItMatters: >-
      Mass-production and shipment-scale claims do not show whether maturity is broad across the portfolio or
      concentrated in a small set of programs.
    diligencePath: >-
      Obtain customer deployment lists, lifetime quality dashboards, and returns data split by chip family and vehicle
      platform.
    relatedQuestionRefs:
      - QE004
      - QE009
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: material
    topic: supply-chain-contingency
    missingEvidence: Current foundry, packaging, EDA-tool, and backup-sourcing disclosure for the advanced-node roadmap.
    whyItMatters: >-
      External-tool and supply dependencies could interrupt roadmap execution even if current demand for domestic
      automotive chips remains strong.
    diligencePath: >-
      Ask management for node-by-node manufacturing maps, second-source plans, and export-control contingency
      assumptions.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: product-security-documentation
    missingEvidence: >-
      Public product-level documentation for secure boot, secure update, in-vehicle network protection, and scope of
      cybersecurity certification by family.
    whyItMatters: >-
      The company and market sources point to compliance readiness, but investors still cannot verify how deeply those
      controls are implemented across the portfolio.
    diligencePath: >-
      Request product security architecture notes, penetration-test summaries, and certification matrices by chip
      family.
    relatedQuestionRefs:
      - QE005
      - QE007
    relatedTableRefs:
      - TE002
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-proof
    missingEvidence: Customer-level renewal, churn, GRR, NRR, contract duration, and cohort data for SemiDrive's production accounts.
    whyItMatters: >-
      Breadth without durability data prevents a clean view of customer quality, stickiness, and whether design wins
      convert into recurring economic value.
    diligencePath: >-
      Request account-level cohort tables, renewal schedules, customer concentration by revenue, and any board or
      financing materials that track active-production accounts over time.
    relatedQuestionRefs:
      - QU005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue concentration by top customers, channel mix, and exposure to any single OEM platform or Tier-1 program.
    whyItMatters: A broad project footprint can still mask dependence on a small number of high-value production programs.
    diligencePath: >-
      Request top-10 customer revenue contribution, design-win-to-revenue conversion rates, pipeline aging, and
      program-level lifetime-value data.
    relatedQuestionRefs:
      - QU007
      - QU008
  - type: missing-source
    severity: minor
    topic: international-proof-gap
    missingEvidence: A refreshed, direct public citation tying SemiDrive to a named international production vehicle or export program.
    whyItMatters: >-
      International proof would tighten the case that customer breadth extends beyond domestic China design wins into
      globally monetizable programs.
    diligencePath: >-
      Re-run future refreshes against named OEM press rooms, model launch materials, procurement records, and customer
      conference talks that explicitly mention SemiDrive silicon.
    relatedQuestionRefs:
      - QU003
      - QU007
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: supply-chain-continuity
    missingEvidence: >-
      Foundry, packaging, wafer-allocation, and export-control contingency details for X9/X10/V9 and overseas OEM
      programs.
    whyItMatters: >-
      Without supplier and node visibility, the report cannot distinguish ordinary scaling risk from a deeper
      supply-continuity or geopolitics risk.
    diligencePath: >-
      Request supplier concentration, process-node roadmap, second-source plans, and export-control memos from
      management.
    relatedQuestionRefs:
      - QR008
  - type: missing-source
    severity: material
    topic: legal-and-incident-history
    missingEvidence: >-
      Litigation schedule, product-liability claims, recall history, cyber incident log, and regulator correspondence
      for China and export markets.
    whyItMatters: >-
      Public silence does not prove legal cleanliness, yet unresolved incident history can change the severity ranking
      of every other operating risk.
    diligencePath: Review counsel letters, insurance schedules, recall logs, and customer-quality escalation records.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: blocking
    topic: valuation-runway-and-governance
    missingEvidence: Post-Series-C cap table, liquidation preferences, revenue, gross margin, burn, runway, and covenant package.
    whyItMatters: >-
      Financing dependence is visible, but price-sensitive underwriting remains weak without the terms and operating
      data that show how much room SemiDrive actually has.
    diligencePath: Obtain management accounts, signed financing documents, board observer materials, and investor-rights schedules.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: 2026-round-pricing
    missingEvidence: >-
      Post-money valuation ownership dilution and liquidation-preference terms for the May and September 2026 Series C
      financings.
    whyItMatters: >-
      Entry-price discipline depends on knowing whether the latest capital came in above or below the last visible
      valuation band and on what downside-protection terms.
    diligencePath: >-
      Request the signed term sheet cap-table bridge and board-approved financing memo from management or the lead
      investor syndicate.
    relatedQuestionRefs:
      - QV003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Revenue run-rate gross margin shipment-to-revenue conversion and burn/runway data for the current operating plan.
    whyItMatters: >-
      Shipment and customer counts can support strategic relevance while still failing to support venture returns if
      monetization or gross margin quality is weak.
    diligencePath: Review current management accounts revenue cohorting ASP trends and gross-margin bridges by product family.
    relatedQuestionRefs:
      - QV004
      - QV008
  - type: missing-source
    severity: material
    topic: governance-and-exit
    missingEvidence: Board control preference stack secondary liquidity terms and a credible IPO or strategic-exit timeline.
    whyItMatters: >-
      Even a strong company can be a weak investment if governance downside protection and exit path are misaligned with
      the proposed entry price.
    diligencePath: Obtain shareholder-rights summaries governance documents and management's financing/liquidity roadmap before IC.
    relatedQuestionRefs:
      - QV008
