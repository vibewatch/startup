- id: bull-base-bear-after-acquisition
  title: Bull / base / bear after acquisition
  body: |-
    A normal bull/base/bear framework needs to be adapted because the company has already been sold. The most honest base case is that public investors have already seen the standalone value event and can no longer directly own the upside. A residual bull case exists only indirectly: if one were evaluating the historical attractiveness of the transaction or any remaining CVR-linked optionality, the question becomes whether Metsera’s assets ultimately justify even more value inside Pfizer than the disclosed cash terms imply.

    The residual bear case is also unusual. It is not a trading collapse in Metsera stock—there is no Metsera stock to trade. It is the possibility that outside investors can no longer access future upside while the internal asset story still carries significant scientific, reimbursement, and prioritization risk. That makes the current chapter less about price targets and more about disciplined historical appraisal and remaining diligence asks.

    Stated differently, the bull/base/bear exercise has shifted from "what should I pay today?" to "how should I interpret a completed strategic outcome?" That is the right framing for a delisted asset platform.
  claimRefs:
