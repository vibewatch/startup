chapter:
  number: 8
  title: Valuation
  summary: 'Metsera is not a current standalone investment because Pfizer acquired and delisted it in 2025. The right valuation exercise is therefore historical and strategic: the IPO priced at $18 per share, Pfizer first offered $47.50 per share in cash plus CVR, and amended merger terms raised the cash amount to $65.60 per share, with completion framed at roughly $7.0 billion of enterprise value plus CVR. The takeaway is not a fresh target price but a clean stance: historically impressive value realization, currently non-investable as a standalone company.'
sections:
- id: thesis-antithesis-and-current-recommendation
  title: Thesis, anti-thesis, and current recommendation
  body: |-
    Before the Pfizer acquisition, Metsera’s thesis was clear: differentiated next-generation obesity assets, unusually strong financing momentum, and a market big enough to reward real convenience or efficacy improvements. The anti-thesis was equally clear: no product revenue, high burn, reimbursement friction, intense competition, and a great deal of development risk still ahead. Those two narratives were never resolved through independent commercialization. Instead, they were effectively short-circuited by strategic acquisition.

    That makes the run-date recommendation unusually simple. There is no standalone Metsera security to underwrite, so the correct current stance is not a buy, hold, or sell call. It is a recognition that standalone investability ended in November 2025. The report can still assess whether the historical outcome was attractive and whether the strategic logic looked sound, but it should not pretend there is a live public entry point when there is none.
