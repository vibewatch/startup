      - number: '2.4'
        title: Growth drivers and gating constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest growth drivers are clinical efficacy, broader cardiometabolic relevance, easier dosing
              formats, and the willingness of incumbents to buy differentiated platforms early. FDA’s
              cardiovascular-risk reduction label for Wegovy helped broaden the payer narrative beyond weight loss
              alone, while the oral GLP-1 wave from Lilly and Novo suggests that easier-use formats can move the
              category closer to primary-care scale. Metsera’s own readouts—monthly amylin and ultra-long-acting
              GLP-1—fit the same convenience-and-differentiation race.


              But demand is not the same as adoption. Reimbursement rules remain incomplete, Medicaid coverage is still
              limited, Medicare Bridge eligibility is narrower than the headline obesity population, and affordability
              pressure remains severe even for therapies that look cost-effective on paper. Add supply, tolerability,
              and persistence challenges, and the market is best described as a policy-gated expansion story rather than
              a frictionless megatrend. For Metsera, the practical implication is that asset differentiation matters at
              least as much as raw category size.
