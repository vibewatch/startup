      - number: '4.3'
        title: Capital adequacy and use of proceeds
        blocks:
          - type: paragraph
            body: >-
              Metsera’s financing stack was unusually large for such a young biotech. The company raised roughly $321.5
              million of net proceeds before the IPO, added a $215 million Series B in late 2024, then completed an IPO
              that generated about $316.2 million of gross proceeds and roughly $288.4 million of net proceeds. Cash and
              marketable securities ended 2024 at $352.4 million, rose to $588.3 million at March 31 2025 after the IPO,
              and stood at $530.9 million at June 30 2025 after another heavy quarter of operating use.


              The intended use of proceeds was also explicit. The prospectus said the IPO would primarily fund the Phase
              3 program for MET-097i through topline results and milestone payments, with the remainder supporting
              working capital and general corporate purposes. In other words, the capital stack was not financing a
              mature selling machine; it was financing clinical proof and option value. Management’s runway guidance
              into 2027 was credible on its own terms, but it still described a business that would have remained
              financing-dependent without either clinical success, partnership receipts, or strategic exit.
