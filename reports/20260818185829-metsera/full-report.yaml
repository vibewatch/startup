companyProfile:
  summary: >-
    Metsera was founded in June 2022 by Population Health Partners and ARCH Venture Partners as a next-generation
    obesity and cardiometabolic peptide platform rather than as a Johnson & Johnson spinout. The company built a
    portfolio around ultra-long-acting GLP-1, monthly amylin, and oral-platform extensions, raised unusually large
    private rounds plus a January 2025 IPO, and then sold itself to Pfizer in November 2025 before launching an
    independent commercial business. The public case was strongest on capital formation, platform breadth, and strategic
    buyer validation; the main unresolved questions concern post-close prioritization, payer-access translation, and how
    much ultimate value will be realized inside Pfizer versus what was already crystallized at sale.
