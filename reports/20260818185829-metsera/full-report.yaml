      - number: '6.4'
        title: Concentration risks and final verdict
        blocks:
          - type: paragraph
            body: >-
              The concentration story before commercialization was about counterparties, not customers. Metsera’s most
              visible dependencies sat with Amneal for manufacturing and with Pfizer after the acquisition for continued
              strategic sponsorship. That is a different risk pattern from top-account concentration, but it is still
              highly material. It means the company’s customer chapter is best understood as a map of channel readiness
              and external validation rather than of installed-base durability.


              The final verdict is therefore straightforward. Metsera clearly addressed a very large future customer
              problem and accumulated enough strategic credibility to attract a major buyer, but it never built a public
              standalone customer base of its own. For diligence purposes, that means the category opportunity is real,
              the strategic signal is real, and the customer proof gap is also real.


              That gap should not be hand-waved away just because the exit was successful. A strategic sale can validate
              future demand potential without proving independent go-to-market strength, refill durability, or channel
              conversion quality. It validates strategic attractiveness, not independent customer execution.
