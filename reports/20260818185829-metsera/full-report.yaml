      - number: '4.4'
        title: Financial verdict and model gaps
        blocks:
          - type: paragraph
            body: >-
              The cleanest financial verdict is that Metsera was a high-burn, well-financed, precommercial biotech whose
              value was realized through strategic monetization before product revenue ever emerged. That is not a
              criticism. It is simply the correct classification for a company whose strongest financial proof points
              were cash raised, cash on hand, burn rate, and the market’s willingness to pay for future clinical upside.
              The acquisition by Pfizer effectively crystallized the value of that financing strategy and removed the
              need for public investors to keep underwriting the runway.


              What remains missing are the metrics that would support a deeper operating model: product-level gross
              margin, post-launch pricing assumptions, customer acquisition cost, field-force economics, post-close
              budget allocation, and any evidence of real-world demand conversion. Because those datapoints are absent,
              a rigorous diligence model should stop at capital adequacy, burn discipline, and strategic value
              realization rather than pretend this was a normal operating-company forecasting exercise.
