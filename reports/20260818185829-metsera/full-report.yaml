  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked overview
        blocks:
          - type: paragraph
            body: >-
              Metsera’s risk profile is best understood as the risk profile of a promising but still unproven obesity
              platform whose ownership changed before commercial proof arrived. The company reduced some classic biotech
              risks by raising large amounts of capital and then selling itself to Pfizer, but the core scientific,
              regulatory, and reimbursement risks did not disappear. They simply migrated into a different ownership
              context. As a result, the highest-severity residual risks cluster around development execution, regulatory
              conversion, payer acceptance, and post-close internal prioritization rather than around simple liquidity
              survival.


              That framing matters because a superficial reading of the exit could imply de-risking across the board. In
              reality, the acquisition solves fundraising pressure far more than it solves product uncertainty. The
              right question is therefore not whether Metsera was risky—it was—but which risks remained after the most
              visible one, standalone financing, was partly removed.


              The residual-risk view is therefore closer to late-stage portfolio underwriting than to a binary solvency
              test. That nuance is essential to judging what the Pfizer transaction did and did not solve.
