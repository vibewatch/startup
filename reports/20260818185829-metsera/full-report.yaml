      - number: '2.2'
        title: 'Sizing lenses: huge disease burden, much narrower near-term access pool'
        blocks:
          - type: paragraph
            body: >-
              The outer-bound demand pool is unquestionably large. WHO reported more than one billion people living with
              obesity and 890 million adults with obesity globally, while CDC prevalence maps show a large U.S. adult
              population living with obesity across most states. Those data establish why obesity has become one of the
              most attractive therapeutic categories in biopharma. But they do not, by themselves, define an investable
              SAM for a pipeline-stage company. Disease burden is a prevalence lens, not a reimbursement or launch lens.


              The tighter lenses come from payer and policy evidence. KFF’s 2026 Medicare Bridge analysis estimated
              about 3.8 million potentially eligible Part D enrollees based on 2023 data, while its Medicare and
              Medicaid spending analyses show already-massive utilization and budget impact even before broad statutory
              obesity coverage exists. The result is a market that is simultaneously gigantic and tightly gated. The
              right analytical move is to present those layers side by side rather than collapse them into one synthetic
              TAM headline.
