        title: Regulatory, operational, and quality risks
        blocks:
          - type: paragraph
            body: >-
              The first risk cluster is regulatory and operational. Metsera still needed to translate encouraging
              clinical data into approved products, and obesity therapeutics remain safety-sensitive chronic-use
              medicines. FDA communications and benchmark labels show why: the category demands a mature safety,
              labeling, and long-run tolerability framework. That category-level burden becomes a company-level burden
              as assets move closer to approval.


              Operationally, the company also depended on strong trial execution, supply readiness, and program
              management. Positive readouts for MET-097i and MET-233i reduce technical doubt, but they do not eliminate
              Phase 3, scale-up, or manufacturing risk. For a precommercial biotech, these are not secondary issues;
              they are the heart of the underwriting problem.


              Regulatory delay and operational slippage also compound each other. A weaker trial package can narrow
              labels, and narrower labels can weaken reimbursement support, which is why these risks should be assessed
              as a bundle rather than as isolated line items.
