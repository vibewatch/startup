  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and asset map
        blocks:
          - type: paragraph
            body: >-
              Metsera’s product was not a single commercial therapy. It was a portfolio of obesity and cardiometabolic
              peptide assets organized around differentiated format and mechanism claims. In customer-workflow terms,
              the company was building future chronic-use therapies that would sit in the familiar obesity-treatment
              pathway of diagnosis, prescribing, reimbursement, and adherence—but the actual monetizable unit at the
              time of diligence was the asset package itself. That is why public sources repeatedly discussed the
              portfolio, not just one candidate, as the object of value.


              The visible asset map centered on MET-097i as the most advanced GLP-1 program, MET-233i as the monthly
              amylin branch, oral follow-ons, and the enabling platforms behind them. This gave the company more
              optionality than a single-asset obesity biotech, but it also meant the technical story had to hold
              together across multiple development threads at once.


              That framing also explains why the acquisition itself is part of the product story. Strategic buyers were
              evaluating a system of assets and capabilities, not a finished retail product line, which is exactly how a
              development-stage platform should be read.
