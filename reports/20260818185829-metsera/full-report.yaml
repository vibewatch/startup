    summary: Metsera-specific repeat-use metrics are absent, so the retention view is a list of what would matter after launch.
    data:
      items:
        - label: Named repeat-use cohort
          value: None public
          detail: No refill, persistence, or cohort disclosure
          tone: warning
        - label: Category retention driver
          value: Persistence
          detail: Chronic-use obesity therapy depends on staying on treatment
          tone: neutral
        - label: Coverage stability importance
          value: High
          detail: Insurance friction can break continuity
          tone: warning
        - label: Patient-support relevance
          value: High
          detail: Education and savings support appear central in commercial benchmarks
          tone: neutral
        - label: Standalone customer proof
          value: Absent
          detail: Metsera sold before launching independently
          tone: warning
        - label: Strategic validation
          value: Strong
          detail: Pfizer acquisition confirms buyer belief in future demand
          tone: positive
    claimRefs:
      - CU013
      - CU014
      - CU020
      - CU029
      - CU031
      - CU034
