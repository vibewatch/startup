  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and what was not yet monetized
        blocks:
          - type: paragraph
            body: >-
              Metsera had no commercial revenue engine during its standalone life. The company had no approved products,
              no disclosed price to patients or payers, and no observable sales or retention funnel. That makes the
              right financial starting point unusually simple: this was a capital-funded clinical platform, not an
              operating obesity franchise. Any monetization thesis before the Pfizer acquisition depended on future
              approvals, future reimbursement, or strategic transactions rather than on current product cash flow.


              That distinction matters because it rules out many common growth-company shortcuts. There is no
              supportable ARR bridge, CAC ratio, revenue mix, or customer expansion math in the public record. The
              financially relevant questions are instead how quickly capital was being consumed, how long the runway
              lasted, what the money was intended to fund, and whether strategic value could be realized before another
              financing event became necessary. On those dimensions, Metsera looks like a classic high-potential,
              high-burn biotech that solved financing risk through sale rather than through early commercialization.
