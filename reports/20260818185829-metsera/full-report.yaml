      - number: '1.3'
        title: Capital formation and the brief public-market arc
        blocks:
          - type: paragraph
            body: >-
              Metsera’s financing cadence was unusually compressed even by obesity-biotech standards. The launch
              financing announced in April 2024 totaled $290 million, the November 2024 Series B added $215 million, and
              the January 2025 IPO was priced at $18 per share before closing with roughly $316 million of gross
              proceeds. SEC filings later showed aggregate net proceeds of roughly $824 million through June 2025 once
              preferred financings, a convertible note, and the IPO were all included. That funding profile matters
              because it explains how Metsera could move from stealth to multiple clinical readouts to a strategic
              takeout in less than two years.


              The acquisition arc matters just as much as the financing arc. Pfizer’s initial September 2025 offer
              valued the company at $47.50 per share in cash plus contingent value rights, but the amended merger
              materials later raised the cash amount to $65.60 per share, and Pfizer’s completion notice put initial
              enterprise value near $7.0 billion. For an external investor, the important implication is not just that
              value was realized, but that the realizable value already left the public market in 2025.
