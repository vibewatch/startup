            body: >-
              Metsera’s valuation history moved quickly. Launch financing in 2024 established private-market enthusiasm,
              the January 2025 IPO priced at $18 per share, and the September 2025 Pfizer bid initially offered $47.50
              per share in cash plus CVR. The amended merger materials later raised the cash amount to $65.60 per share,
              while Pfizer’s completion release framed the deal at roughly $7.0 billion of enterprise value plus CVR.
              Those are far stronger valuation anchors than any synthetic multiple based on current operations, because
              there were no current operating earnings or revenue to underwrite.


              The key interpretive point is that strategic buyers ultimately paid for future option value, not present
              commercial cash flow. Positive 2025 readouts and category expansion signals helped close that gap between
              early public-market price and later strategic value. In effect, Metsera’s most important comparable was
              the actual buyer sitting across the table.


              That is also why historical market surfaces like Nasdaq pages or archived filings are useful mainly as
              context. They illuminate the path to value realization, but they do not outrank the final negotiated
              outcome.
