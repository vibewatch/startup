            body: >-
              The second cluster is dependency and model risk. Amneal concentration made manufacturing dependence
              visible, while the Pfizer transaction made parent-company prioritization newly important. The company no
              longer needs to tap capital markets on its own, but it does need to remain important enough within Pfizer
              to justify continued investment. That means strategic ownership cuts both ways: it lowers financing risk
              and raises portfolio-priority risk.


              At the same time, the core financial model still carries uncertainty because no standalone commercial
              launch ever occurred. Public investors never got to observe payer conversion, prescriber uptake, refill
              behavior, or gross-to-net dynamics. Those unknowns do not mean the assets are weak; they mean the model
              risk stayed unresolved at the moment of exit.


              Governance opacity after delisting adds another layer. Less disclosure means slower detection of execution
              drift, which raises the importance of external milestone monitoring.
