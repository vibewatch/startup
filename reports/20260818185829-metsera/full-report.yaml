  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Defining the customer in obesity therapeutics
        blocks:
          - type: paragraph
            body: >-
              The first challenge in a Metsera customer chapter is definitional. In a prescription obesity market, the
              end user is the patient, the demand creator is the prescribing clinician, the budget gatekeeper is often a
              payer or PBM, and the near-term economic buyer for a precommercial platform can be a strategic acquirer or
              partner. That means "customer" cannot be treated as a single account list the way it might be for
              enterprise software. The right frame is a chain of users, buyers, and gatekeepers that only becomes fully
              visible after launch.


              For Metsera specifically, that chain never converted into a public installed base. The company disclosed
              no named commercial customers, no patient-count metrics, no prescriber adoption statistics, and no
              payer-mix data. As a result, the most supportable customer segmentation today is channel-based and
              forward-looking rather than account-based and historical.
