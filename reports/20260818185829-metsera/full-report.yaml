            body: >-
              Public proof for Metsera is strongest at the counterparty level, not the end-customer level. Amneal is a
              visible manufacturing partner and Pfizer is the strategic buyer and current owner. Those relationships
              matter because they show serious external validation. But they are not the same thing as a production
              customer base, and they do not answer the questions a normal customer diligence chapter would ask about
              repeat use, account expansion, or satisfaction.


              The clinical readouts for MET-097i and MET-233i are similarly important but limited. They demonstrate
              product promise, not customer adoption. The company effectively monetized strategic belief in future
              customer value before it ever had to disclose standalone commercial proof. That is a financially
              attractive outcome, but it leaves a thinner public customer record than investors might expect.


              In practice, the chapter has to treat strategic proof and customer proof as separate categories. Metsera
              had a lot of the former and almost none of the latter in public view. That distinction is the single most
              important framing choice for this chapter.
