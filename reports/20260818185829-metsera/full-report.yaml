        title: Mitigations, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The public mitigation set is real. Metsera had large pre-close cash balances, visible manufacturing
              preparation, positive clinical data, and ultimately the backing of a major acquirer. Those facts reduce
              the probability of immediate failure. But they do not warrant complacency. Strong mitigants help only if
              later evidence keeps moving in the right direction on safety, efficacy, access, and internal strategic
              support.


              The best monitoring framework therefore focuses on a few thesis-break triggers: signs of internal
              deprioritization inside Pfizer, evidence that differentiation versus rivals narrows, or proof that payer
              budgets keep obesity-drug access structurally constrained despite clinical value. Those are the failure
              modes most likely to compress the strategic worth of the platform even without a dramatic single-event
              blowup.


              A final subtle risk is slow information decay: if disclosure falls and milestones become harder to read,
              underwriting quality can deteriorate even before the business does. That is why monitorability deserves to
              be treated as a mitigation criterion in its own right.
