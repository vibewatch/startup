  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what Metsera was actually selling into
        blocks:
          - type: paragraph
            body: >-
              Metsera should not be analyzed against the entire obesity-care economy, which includes diet services,
              surgery, diagnostics, and chronic-disease management. The relevant public market is narrower: branded
              prescription anti-obesity therapeutics, especially next-generation incretin and amylin programs that
              promise better efficacy, easier adherence, or more scalable access formats than first-wave weekly
              injectables. That distinction matters because broad disease prevalence figures make the TAM look almost
              limitless, while the real adoption boundary is set by who can get a prescription reimbursed, who will stay
              on therapy, and which assets strategic pharma buyers believe can win share in a rapidly fragmenting
              mechanism race.


              Metsera’s own positioning fits that narrower boundary. The company was not trying to build a weight-loss
              clinic or telehealth distribution shell. Its value proposition was a differentiated asset
              portfolio—ultra-long-acting GLP-1, monthly amylin, and oral platform extensions—that could matter to large
              pharma, prescribers, payers, and patients once efficacy, manufacturing, and reimbursement lines converged.
              That makes the strategic-buyer channel part of the market definition itself rather than an afterthought.
            claimRefs:
              - CM001
              - CM014
              - CM015
              - CM020
              - CM033
