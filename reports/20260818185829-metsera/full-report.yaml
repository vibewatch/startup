      - number: '5.2'
        title: Platform architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The architecture story rested on three layers: licensed peptide science, enabling design platforms, and
              outsourced operating execution. Public filings tied the company’s MINT peptide library to long-running
              nutrient-stimulated hormone work associated with Stephen Bloom. HALO and MOMENTUM then served as the
              company’s core enabling technologies for half-life extension and oral-delivery ambitions. Those platform
              claims mattered because Metsera wanted to be judged as a technology system, not as a one-shot clinical
              bet.


              But the operating model was never purely internal. Amneal supplied a visible manufacturing and supply
              pathway, while clinical execution, regulatory progression, and later commercialization depended on third
              parties and external infrastructure. In practice, Metsera’s product-tech stack was as much an
              orchestration challenge as a molecular-design challenge.


              That orchestration burden is also why product-tech diligence cannot stop at molecular novelty. It has to
              test whether the surrounding operating system—CMC, vendors, regulatory planning, and now parent-company
              sponsorship—can carry the science forward.
