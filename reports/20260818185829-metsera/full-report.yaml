chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, origin, and current status
        blocks:
          - type: paragraph
            body: >-
              Metsera is not the Janssen or Johnson & Johnson spinout suggested in earlier scuttlebutt. The public
              record instead shows an independent obesity biotech formed in June 2022 by Population Health Partners and
              ARCH Venture Partners, then built around peptide assets sourced through Zihipp, Imperial-linked science,
              and subsequent licensing and manufacturing deals. By the time Metsera reached public markets in early
              2025, it had positioned itself as a next-generation obesity platform spanning long-acting injectable GLP-1
              and amylin candidates plus oral peptide follow-ons. Its principal executive offices were listed at 3 World
              Trade Center in New York, and its filings consistently framed the company as precommercial and clinical
              stage rather than as a revenue-producing operating pharma business.


              That identity changed decisively in late 2025. Pfizer announced a merger agreement in September 2025 and
              completed the acquisition in November 2025, after which Metsera became a wholly owned subsidiary and its
              Nasdaq listing ended. For current diligence, that means the company remains strategically relevant as a
              platform and pipeline, but no longer exists as a standalone public investment. The redirect of metsera.com
              to Pfizer reinforces the same practical point: the object of diligence is now an acquired obesity asset
              package inside Pfizer rather than an independently financeable unicorn.
