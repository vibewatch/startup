  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and direct peers
        blocks:
          - type: paragraph
            body: >-
              Metsera’s real comparator set was not obesity care in general but the cluster of companies trying to
              reshape pharmacologic obesity treatment through better convenience, better efficacy, new mechanisms, or
              stronger strategic positioning. That set included commercial incumbents such as Lilly and Novo,
              investigational oral challengers like Structure and Viking, amylin-focused programs such as Roche/Zealand
              petrelintide, and Metsera’s own combination of ultra-long-acting GLP-1 and monthly amylin. The common
              competitive question was not whether obesity demand existed, but which asset packages could convert that
              demand into reimbursed, persistent use.


              On that framing, Lilly and Novo remain the reference competitors because they pair clinical data with
              actual product distribution. Metsera, by contrast, was competing on what its assets might become. That
              makes direct comparison possible, but it also means the company’s strongest competitive proof came from
              strategic validation and clinical readouts rather than from commercial share or prescribing data.
            claimRefs:
