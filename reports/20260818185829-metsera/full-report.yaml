            body: >-
              Commercial obesity leaders make clear what a future customer journey would have looked like for Metsera.
              Patient-facing and coverage pages segment users by commercial coverage status, Medicare, government
              coverage, and no-insurance paths, which shows how central affordability navigation is to adoption.
              Public-channel initiatives such as Bridge and BALANCE further reinforce that customer growth in obesity is
              inseparable from policy and coverage design.


              Retention would also be unusual compared with many other sectors. Obesity treatment is a chronic-use
              category where repeat behavior is more about persistence, refills, and tolerability than about annual seat
              renewal. That matters because even a clinically impressive product can disappoint commercially if patients
              discontinue early or if payer rules make continuity hard. None of those Metsera-specific metrics is
              public, so the category benchmark has to stand in for company proof.
