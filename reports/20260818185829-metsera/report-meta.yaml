  productSummary: Development-stage obesity and cardiometabolic peptide portfolio led by MET-097i (ultra-long-acting GLP-1), MET-233i (once-monthly amylin), and oral-platform extensions built on HALO, MOMENTUM, and the MINT peptide library.
  customerFocus: Future obesity patients, prescribers, payers, and—before launch—strategic pharmaceutical buyers and partners.
  businessModel: Pre-revenue biotech model funded by equity capital and strategic optionality, with value realized historically through acquisition rather than independent product sales.
  stage: Acquired clinical-stage obesity biotech / wholly owned Pfizer subsidiary
