company:
  name: Metsera
chapter:
  number: 4
  title: Financials
  summary: Metsera’s financial profile was that of a heavily financed, heavily loss-making, precommercial biotech rather than an operating obesity franchise. R&D ramped from $15.6 million in 2023 to $107.5 million in 2024 and to $117.7 million in the first half of 2025, while the company still reported no product revenue. Cash remained substantial after the IPO—$588.3 million at March 31 2025 and $530.9 million at June 30 2025—but the model stayed dependent on capital markets until Pfizer acquired the company and ended the standalone financing story.
sections:
- id: revenue-model-and-what-was-not-yet-monetized
  title: Revenue model and what was not yet monetized
  body: |-
    Metsera had no commercial revenue engine during its standalone life. The company had no approved products, no disclosed price to patients or payers, and no observable sales or retention funnel. That makes the right financial starting point unusually simple: this was a capital-funded clinical platform, not an operating obesity franchise. Any monetization thesis before the Pfizer acquisition depended on future approvals, future reimbursement, or strategic transactions rather than on current product cash flow.

    That distinction matters because it rules out many common growth-company shortcuts. There is no supportable ARR bridge, CAC ratio, revenue mix, or customer expansion math in the public record. The financially relevant questions are instead how quickly capital was being consumed, how long the runway lasted, what the money was intended to fund, and whether strategic value could be realized before another financing event became necessary. On those dimensions, Metsera looks like a classic high-potential, high-burn biotech that solved financing risk through sale rather than through early commercialization.
