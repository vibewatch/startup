- id: cost-structure-burn-and-public-company-overhead
  title: Cost structure, burn, and public-company overhead
  body: |-
    The P&L was dominated by research and development. R&D expense rose from $15.6 million in 2023 to $107.5 million in 2024, while G&A rose from $15.0 million to $26.8 million over the same period. By the first half of 2025, the company was spending even faster, with $117.7 million of R&D and $20.1 million of G&A in six months. The filings tie that acceleration to preclinical, clinical, and contract-manufacturing activity across both injectable and oral programs, exactly the pattern one would expect from a platform moving from stealth into a readout-heavy public-company phase.

    Public-company status added another layer of cost. Management explicitly linked higher G&A to personnel, professional fees, insurance, and other expenses associated with being public. That overhead does not invalidate the platform thesis, but it does mean that headline net losses partially reflect the cost of scaling an investor-facing entity as well as of advancing science. Investors should therefore look at both reported loss and operating cash use, not just one of the two.
