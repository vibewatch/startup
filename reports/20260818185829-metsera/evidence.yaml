evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: post-acquisition-operating-metrics
    missingEvidence: Standalone post-close headcount, budget, and product-program staffing within Pfizer.
    whyItMatters: >-
      These metrics determine whether the platform remained intact after the sale or was reorganized into Pfizer
      functions.
    diligencePath: Request Pfizer integration commentary, former Metsera team maps, or post-close org disclosures.
    relatedQuestionRefs:
      - QO023
  - type: missing-source
    severity: minor
    topic: customer-count
    missingEvidence: Any disclosed customer count or commercial account base for Metsera before sale.
    whyItMatters: >-
      Readers may expect customer metrics on the cover card, but the company appears to have been precommercial
      throughout its standalone life.
    diligencePath: >-
      Confirm with management or investor relations that no commercial product revenue or customer base existed before
      acquisition.
    relatedQuestionRefs:
      - QO023
  - type: conflicting-data
    severity: minor
    topic: capital-raised-reconciliation
    missingEvidence: A full bridge reconciling headline gross rounds with net proceeds disclosed in filings.
    whyItMatters: >-
      Headline fundraising totals and SEC net-proceeds totals answer slightly different questions and can be misquoted
      if not reconciled.
    diligencePath: Construct a financing bridge from the cap table and each preferred-stock closing schedule in the prospectus.
    relatedQuestionRefs:
      - QO024
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table partial coverage
    missingEvidence: >-
      A fully verified roster of all vice presidents, committee memberships, and scientific advisory roles active at the
      time of sale.
    whyItMatters: >-
      The current table covers the most decision-critical public leaders but not every management-layer or advisory role
      that may have mattered operationally.
    diligencePath: >-
      Expand the management map from archived investor pages, proxy materials, and post-close Pfizer integration
      records.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map partial coverage
    missingEvidence: >-
      A complete investor-rights and economics map covering all undisclosed investors, side letters, and beneficial
      owners across every financing.
    whyItMatters: The public map captures the visible control nodes but not the full ownership and governance stack beneath them.
    diligencePath: Review the full capitalization table, stockholder agreements, and all beneficial-ownership filings.
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table partial coverage
    missingEvidence: >-
      A fully exhaustive chronology including every trial-ops event, hiring event, and nonmaterial board action between
      formation and acquisition.
    whyItMatters: >-
      The timeline is intended to capture materially important milestones, not every internal event, so some operational
      detail remains absent.
    diligencePath: Build a filing-by-filing chronology from archived investor pages, all 8-Ks, and conference presentations.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: metsera-specific-launch-model
    missingEvidence: No public Metsera-specific launch forecast, covered-lives plan, or commercialization budget.
    whyItMatters: >-
      A real SOM model requires channel mix, persistence assumptions, gross-to-net assumptions, and pricing that public
      sources do not provide.
    diligencePath: Request management launch scenarios, payer-access strategy, and gross-to-net assumptions.
    relatedQuestionRefs:
      - QM025
  - type: conflicting-data
    severity: minor
    topic: market-lens-unit-mismatch
    missingEvidence: A single market estimate that uses one unit consistently across prevalence, spending, and coverage subsets.
    whyItMatters: Readers may incorrectly average incompatible patient and spending lenses into one TAM.
    diligencePath: Build separate patient, spending, and strategic-BD market frames rather than one blended number.
    relatedQuestionRefs:
      - QM016
  - type: private-evidence-only
    severity: minor
    topic: real-world-persistence-for-metsera-class-assets
    missingEvidence: Persistence, discontinuation, and adherence data for Metsera-specific candidates relative to peers.
    whyItMatters: Realized market value depends on durability of use, not just initial prescriptions or trial efficacy.
    diligencePath: Request longitudinal trial extension or real-world adherence modelling once assets progress further.
    relatedQuestionRefs:
      - QM013
      - QM025
  - type: private-evidence-only
    severity: material
    topic: head-to-head-persistence-and-tolerability
    missingEvidence: >-
      No public head-to-head persistence, discontinuation, or tolerability comparison across Metsera and the named peer
      set.
    whyItMatters: Convenience and efficacy are not enough if real-world persistence differs materially across brands and mechanisms.
    diligencePath: Request comparative persistence modelling and discontinuation assumptions from management or post-launch datasets.
    relatedQuestionRefs:
      - QP025
  - type: missing-source
    severity: minor
    topic: investigational-peer-pricing
    missingEvidence: Reliable future pricing, rebate, and coverage assumptions for investigational peers.
    whyItMatters: Without launch economics, pricing comparison remains directional rather than decisive.
    diligencePath: Model commercial peers separately from pipeline peers and keep pipeline pricing as a diligence gap.
    relatedQuestionRefs:
      - QP013
      - QP024
  - type: missing-source
    severity: minor
    topic: internal-pfizer-prioritization
    missingEvidence: How Pfizer ranks Metsera assets internally versus its other obesity bets.
    whyItMatters: Parent-company backing helps only if assets remain strategically prioritized post-close.
    diligencePath: Seek Pfizer R&D portfolio commentary, post-close staffing signals, and trial-acceleration evidence.
    relatedQuestionRefs:
