      - number: '4.4'
        title: 财务结论与模型缺口
        blocks:
          - type: paragraph
            body: >-
              最干净的财务结论是：Metsera
              是一家高烧钱、资金充足、尚未商业化的生物科技公司，在产品收入出现前就靠战略变现兑现了价值。这不是批评，只是对一家公司的正确归类：其最强财务证明点是募得现金、手上现金、烧钱速度，以及市场愿意为未来临床上行空间付钱。Pfizer
              收购实际上把这套融资策略的价值结晶，也让公开投资者不必继续承销现金跑道。


              仍然缺失的是支撑更深入运营模型的指标：产品层面毛利率、上市后定价假设、获客成本、销售队伍经济性、交割后预算分配，以及真实世界需求转化的任何证据。由于上述数据点缺席，严谨的尽调模型应停在资本充足性、烧钱纪律和战略价值兑现上，而不是假装这是一道正常运营公司预测题。
