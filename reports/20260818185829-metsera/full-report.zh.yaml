companyProfile:
  summary: >-
    Metsera 由 Population Health Partners 和 ARCH Venture Partners 于 2022 年 6 月创立，定位是下一代肥胖和心血管代谢肽平台，而不是 Johnson & Johnson
    剥离出来的公司。公司围绕超长效 GLP-1、月度胰淀素和口服平台延展搭建组合，完成了规模异常大的私募轮和 2025 年 1 月 IPO，随后在 2025 年 11 月把自己出售给
    Pfizer，尚未独立启动商业化业务。公开案例最强的部分在于资本形成、平台宽度和战略买家验证；主要未解问题则是交割后优先级、支付方准入能否转化，以及最终有多少价值会在 Pfizer 体系内继续兑现，而不是已经在出售时结晶。
