      - number: '3.3'
        title: 定价、分发与切换权力
        blocks:
          - type: paragraph
            body: >-
              肥胖赛道的竞争力不只看分子，也看准入。获批品牌拥有支付方合约、标签熟悉度、线下推广分发，以及越来越强的公共渠道先例。在研公司缺少这套准入资产。因此，只要产品更容易开方、更容易覆盖、更容易持续使用，商业化在位者即使差异化并不完美，也常常能赢。


              Pfizer 所有权就在这里改变了 Metsera 的位置。作为独立公司，Metsera 缺少商业基础设施，也没有获批价格点。进入 Pfizer
              体系后，其中一些分发和资本劣势会缩小。但公司也失去了上市公司本来拥有的灵活性和独立可比性。实际结论是，Metsera 的竞争地位在战略上改善了，同时它作为独立市场参与者的身份消失了。
