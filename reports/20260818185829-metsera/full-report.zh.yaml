  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与尚未变现的部分
        blocks:
          - type: paragraph
            body: >-
              Metsera
              独立存在期间没有商业收入引擎。公司没有获批产品，没有向患者或支付方披露的价格，也没有可观察的销售或留存漏斗。因此，正确的财务起点异常简单：这是一家由资本供血的临床平台，不是一个运营中的肥胖特许经营业务。Pfizer
              收购前，任何变现逻辑都依赖未来获批、未来报销或战略交易，而不是当前产品现金流。


              这个区分很重要，因为它排除了许多成长型公司常用的捷径。公开记录中没有可支撑的 ARR 桥、CAC
              比率、收入结构或客户扩张模型。财务上真正要问的是，资本消耗有多快、现金跑道有多长、资金打算投向哪里，以及在下一次融资变得必要前，战略价值能否先兑现。按上述维度看，Metsera
              更像一家典型的高潜力、高烧钱生物科技公司；它靠出售而不是早期商业化解决了融资风险。
