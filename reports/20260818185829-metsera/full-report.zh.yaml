        title: 成本结构、烧钱速度与上市公司开销
        blocks:
          - type: paragraph
            body: >-
              损益表主要由研发主导。研发费用从 2023 年的 $15.6 million 升至 2024 年的 $107.5 million，同期一般及行政费用从 $15.0 million 升至 $26.8
              million。到 2025 年上半年，公司花钱更快，六个月内研发费用为 $117.7 million，一般及行政费用为 $20.1
              million。文件把这轮加速与注射和口服项目中的临床前、临床及合同制造活动联系起来；这正是一家平台从隐身状态进入读出密集的上市公司阶段时应有的模式。


              上市公司身份又叠加了一层成本。管理层明确把更高 G&A
              归因于人员、专业费用、保险，以及上市公司身份带来的其他支出。成本开销并不推翻平台逻辑，但意味着标题净亏损不仅反映推进科学的成本，也部分反映扩张一个面向投资人的实体所需的成本。因此，投资人应同时看报告亏损和经营性现金使用，而不能只看二者之一。
