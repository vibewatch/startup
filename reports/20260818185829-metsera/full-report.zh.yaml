      - number: '8.4'
        title: 最后尽调问题与最终立场
        blocks:
          - type: paragraph
            body: >-
              剩余估值工作因此主要是尽调导向。核心问题是：Metsera 的资产在 Pfizer
              内部是否仍被优先推进；临床差异化在快速改善的肥胖赛道中能否站住；到最重要资产上市时，报销扩张是否会显著扩大价值池。问题本身不决定今天是否买入 Metsera 股票；它们决定的是事后看 Pfizer
              的收购价格是否聪明。


              因此，最终立场应保持简洁诚实。Metsera 在短暂独立窗口内交出了一次令人印象深刻的历史结果，但它当前并不是独立投资机会。读者正确要点，是把它当作战略价值兑现案例来研究，而不是当作可执行的公开股票代码。


              这一立场偏保守，但也是报告运行日证据能完全支撑的唯一立场。任何更强的说法都会把回顾性估值分析和实时市场建议混在一起。
