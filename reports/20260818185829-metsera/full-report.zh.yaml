  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑与当前建议
        blocks:
          - type: paragraph
            body: >-
              Pfizer 收购前，Metsera
              的投资逻辑很清楚：差异化的下一代肥胖资产、异常强的融资动能，以及一个大到足以奖励真实便利性或疗效提升的市场。反向逻辑也同样清楚：没有产品收入、烧钱高、报销摩擦、竞争激烈，且前方仍有大量开发风险。这两条叙事从未靠独立商业化得到解决，而是被战略收购有效短路。


              因此，报告运行日建议异常简单。已经没有可承销的独立 Metsera 证券，所以正确的当前立场不是买入、持有或卖出，而是承认独立可投资性已在 2025 年 11
              月结束。本报告仍可评估历史结果是否有吸引力、战略逻辑是否说得通，但不应在没有公开进入点的情况下假装存在实时投资机会。
