  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与 Metsera 实际切入的赛道
        blocks:
          - type: paragraph
            body: >-
              不应把 Metsera 放进整个肥胖照护经济来分析；那个范围包括饮食服务、手术、诊断和慢病管理。真正要看的公开市场更窄：品牌化处方抗肥胖疗法，尤其是下一代肠促胰素和
              胰淀素项目，它们承诺比第一波每周注射剂有更好疗效、更容易坚持，或更可扩展的准入形态。这个区分很重要，因为宽泛的疾病流行率数字会让 TAM
              看起来几乎没有上限；真正的采用边界则取决于谁能获得可报销处方、谁能持续用药，以及战略制药买家相信哪些资产能在快速碎片化的机制竞赛中赢得份额。


              Metsera 自身定位符合这一更窄边界。公司不是在搭建减重诊所或远程医疗分发外壳。它的价值主张是一组差异化资产组合——超长效 GLP-1、月度胰淀素
              和口服平台延展；一旦疗效、制造和报销线条汇合，这组资产可能对大型药企、处方医生、支付方和患者都有意义。因此，战略买家渠道本身就是市场定义的一部分，而不是事后补充。
