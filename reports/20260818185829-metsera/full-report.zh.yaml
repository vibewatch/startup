  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 在肥胖治疗中定义客户
        blocks:
          - type: paragraph
            body: >-
              写 Metsera 客户章节，第一道难题是定义。在处方肥胖市场里，终端用户是患者，需求创造者是开方医生，预算守门人通常是支付方或
              PBM；平台尚未商业化，近期经济买方还可能是战略收购方或合作伙伴。因此，“客户”不能像企业软件那样被处理成一张单一账户清单。正确框架是一条由用户、买方和守门人组成的链条，只有上市后才会完全显形。


              具体到 Metsera，这条链从未转化成公开装机基础。公司没有披露具名商业客户、患者数量指标、处方医生采用统计或支付方结构数据。因此，今天最可支撑的客户分层是基于渠道且面向未来，而不是基于账户和历史。
