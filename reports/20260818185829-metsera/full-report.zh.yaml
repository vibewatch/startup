      - number: '1.2'
        title: 创始人、领导梯队与治理信号
        blocks:
          - type: paragraph
            body: >-
              Metsera 的创始人与领导故事高度集中在既往公司搭建经验上，而不只是学术创始人。Clive Meanwell 创办 Metsera，并担任 CEO 至 2024 年 9 月，之后转任执行主席。他在 The
              Medicines Company 和 Population Health Partners 的经历，给公司带来早期融资可信度和连续创业者叙事。另一位 Population Health Partners
              联合创始人 Whit Bernard 则在 2024 年 9 月从 COO 升任 CEO。这一组合更像是从孵化转向运营执行的有意交接，而不是一次救火式招聘。


              公开文件还显示，董事会规模紧凑，投资人影响力很强。来自 ARCH 和 Population Health Partners 的董事占据显著位置，同时也有具备财务和商业化背景的领导者。这样的履历帮助 Metsera
              快速融资并出售自己，但也意味着关键人依赖真实存在：少数高管同时承担资本市场、科学转化和战略叙事职责。记录足以支撑对团队背景资历的信心，但也提示尽调不能仅因退出结果亮眼，就夸大公司的机构厚度。
