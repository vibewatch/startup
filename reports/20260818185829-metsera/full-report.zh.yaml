  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与资产地图
        blocks:
          - type: paragraph
            body: >-
              Metsera
              的产品不是单一商业化疗法，而是一组围绕差异化形态和机制主张组织起来的肥胖及心血管代谢肽资产。从客户工作流看，公司在搭建未来长期使用的疗法，它们会落在熟悉的肥胖治疗路径里：诊断、处方、报销和依从性。但在尽调时点，真正可变现的单元是资产包本身。因此，公开来源反复把组合而非单一候选物作为价值对象来讨论。


              可见的资产地图以 MET-097i 这个最先进的 GLP-1 项目为中心，旁边是 MET-233i
              这条月度胰淀素分支、口服后续项目，以及背后的赋能平台。这让公司比单一资产肥胖生物科技拥有更多可选性；但也意味着技术故事必须同时在多条开发线索上成立。


              这个框架也解释了为什么收购本身属于产品故事的一部分。战略买家评估的是一套资产和能力系统，而不是一条完成的零售产品线；这正是解读开发阶段平台时应采用的方式。
