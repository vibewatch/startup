  - id: FU001
    title: 客户旅程图
    type: flow
    layout: wide
    summary: 在肥胖治疗里，用户、处方医生、支付方和战略买方分处旅程的不同环节。
    data:
      nodes:
        - id: n1
          label: 有肥胖治疗需求的患者
          detail: 寻求治疗的终端用户
          claimRefs:
