      - number: '1.4'
        title: 规模标记、里程碑与仍不公开的指标
        blocks:
          - type: paragraph
            body: >-
              Metsera 最强的规模标记是技术和资本市场里程碑，而不是客户或收入。公司披露 2024 年末有 81 名员工、没有产品收入，2024 年末现金和证券为 $352.4 million，2025 年 3 月现金为
              $588.3 million，2025 年 6 月现金为 $530.9 million。独立运营期内，公司始终亏损且尚未商业化；但这符合一家临床阶段肥胖平台，而不是一家运营失败的企业。


              里程碑记录比封面指标更亮眼。仅在 2025 年，Metsera 就报告了 MET-233i 1 期正面数据、MET-097i 2b 期正面数据，公开进展足以让公司截至 7 月仍保持上市状态，并在 11
              月被战略出售给
              Pfizer。更难知道的是许多投资人本能希望在封面卡片上看到的指标：收购后员工数、客户数、任何收入运行率都没有公开披露。公司在商业化前被出售，这种缺口并不罕见，但它仍是有意义的尽调缺口，应直接写明，而不是靠推断抹掉。
