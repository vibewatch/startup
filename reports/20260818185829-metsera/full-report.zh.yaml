      - number: '3.4'
        title: 护城河耐久度与被替代风险
        blocks:
          - type: paragraph
            body: >-
              Metsera
              的护城河主张注定比已有获批产品和全球销售队伍的公司更窄。它可能的防御力来自差异化科学、资产宽度，以及一个或多个项目可能展示出比知名替代方案更有吸引力的疗效—便利性—耐受性权衡。这是一个真实的护城河候选项，但前提是数据持续改善。


              主要替代风险在于便利性被商品化。口服项目持续扩散，胰淀素竞争真实存在，分发能力强的在位者只要守住准入优势，就能吸收较窄的科学差距。因此，最稳妥的竞争结论不是 Metsera
              已经赢下某个类别楔子，而是它已经拿到一张有分量的战略入场券，并在商业战线完全固化前靠出售给 Pfizer 变现。


              因此，有用的尽调姿态是把平台质量和上市必然性拆开。Metsera
              证明了自己能变得有战略价值；但公开记录没有证明，作为独立公司，它能在上市节奏、支付方准入或长期持续用药上跑赢在位者。拿一个已被收购的平台同仍保持独立、市场测试还在前方的同行相比时，这个区别非常关键。
