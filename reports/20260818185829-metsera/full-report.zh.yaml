      - number: '7.3'
        title: 依赖、人员与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              第二组是依赖和模型风险。Amneal 集中度让制造依赖变得可见；Pfizer 交易则让母公司优先级变得新的重要变量。公司不再需要独自进入资本市场融资，但必须在 Pfizer
              内部保持足够重要，才能支撑持续投入。战略所有权因此有两面：它降低融资风险，也提高组合优先级风险。


              同时，核心财务模型仍有不确定性，因为从未发生过独立商业上市。公开投资者没有观察到支付方转化、处方医生采用、续方行为或总额到净额扣减动态。未知项不意味着资产弱；它们意味着模型风险在退出时点仍未解决。


              退市后的治理不透明又叠加一层风险。披露减少会放慢执行漂移的发现速度，因此外部里程碑监测变得更重要。
