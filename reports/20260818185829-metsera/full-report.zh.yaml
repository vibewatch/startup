      - number: '6.4'
        title: 集中风险与最终结论
        blocks:
          - type: paragraph
            body: >-
              商业化前的集中度故事讲的是交易对手，而不是客户。Metsera 最可见的依赖，一是制造端的 Amneal，二是收购后持续战略支持所依赖的
              Pfizer。这不同于大客户集中风险，但同样高度重要。它意味着公司的客户章节更应被理解为一张渠道准备度和外部验证地图，而不是装机基础耐久度分析。


              因此，最终结论很直接。Metsera 明确瞄准了一个非常大的未来客户问题，也积累了足够战略可信度来吸引大型买家，但它从未建立自己的公开独立客户基础。就尽调而言，类别机会真实，战略信号真实，客户证明缺口也真实。


              不能因为退出成功，就把这个缺口一笔带过。战略出售可以验证未来需求潜力，却不能证明独立上市能力、续方耐久度或渠道转化质量。它验证的是战略吸引力，不是独立客户执行。
