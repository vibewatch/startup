      - number: '8.2'
        title: 估值背景与历史锚点
        blocks:
          - type: paragraph
            body: >-
              Metsera 的估值历史推进很快。2024 年启动融资确立了私募市场热情，2025 年 1 月 IPO 定价为每股 $18；2025 年 9 月的 Pfizer 报价最初给出每股 $47.50 现金加
              CVR。修订后的合并材料随后把现金金额提高到每股 $65.60，而 Pfizer 完成公告把交易描述为约 $7.0 billion 企业价值加
              CVR。上述锚点远强于基于当前运营的任何合成倍数，因为没有当前运营利润或收入可供承销。


              关键解读是，战略买家最终为未来期权价值买单，而不是为当前商业现金流买单。2025 年正面读出和类别扩张信号，帮助弥合了早期公开市场价格与后续战略价值之间的差距。实际上，Metsera
              最重要的可比对象就是坐在谈判桌对面的真实买家。


              这也解释了为什么 Nasdaq 页面或历史文件这样的历史市场表面，主要价值是提供背景。它们照亮了价值兑现路径，但不应压过最终谈成的结果。
