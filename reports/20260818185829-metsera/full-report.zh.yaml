      - number: '6.3'
        title: 渠道摩擦、留存与扩张
        blocks:
          - type: paragraph
            body: >-
              商业化肥胖龙头已经说明，Metsera 未来客户旅程会是什么样。面向患者的页面和覆盖页面按商业保险状态、Medicare、政府覆盖和无保险路径拆分用户，显示可负担性导航对采用有多核心。Bridge 和
              BALANCE 等公共渠道项目也进一步说明，肥胖领域的客户增长离不开政策和覆盖设计。


              与许多其他行业相比，留存也会不同。肥胖治疗属于长期使用类别，重复行为更多取决于持续用药、续方和耐受性，而不是年度席位续约。这一点重要，因为即便产品临床表现亮眼，只要患者早停或支付方规则让连续性变难，商业表现也可能令人失望。Metsera
              自身没有公开此类指标，因此只能用类别基准替代公司证明。
