      - number: '3.2'
        title: 能力与模态对比
        blocks:
          - type: paragraph
            body: >-
              这个领域已经分裂成多条模态竞赛。Lilly 和 Novo 在口服便利性上大力推进，为更适合初级保健的肥胖治疗设定了新标尺。Structure 和 Viking
              之所以重要，是因为它们代表独立公司也在用自己的口服项目解决同一个便利性问题。Roche 和 Zealand 让胰淀素与组合式差异化继续保持热度；Metsera 则试图把超长效 GLP-1
              和月度胰淀素桥接成一套组合逻辑。


              因此，Metsera 的差异化不能只是说自己是一家 GLP-1
              公司。它必须证明，自己的具体给药特征、资产组合和平台可选性，足以在多个可信机制和形态同时汇合的领域里获得关注。这个论点有可信度，但也脆弱，因为许多竞争者同时在追逐相邻的便利性主张。
