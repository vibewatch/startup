            body: >-
              由于 Metsera 仍未商业化，最佳公开信任和质量基准来自相邻获批产品，而不是 Metsera 自己的标签或现场质量体系。FDA 材料和已获批 Wegovy
              标签展示了肥胖产品最终需要满足的安全框架：明确警示、监测要求和长期耐受性管理。没有 Metsera 标签并不是缺陷；它只是提醒我们，在收购时点，公司大部分质量论证仍在前方。


              因此，依赖风险成为核心。平台仍依赖制造成功放大、临床执行干净、监管机构接受，以及 Pfizer
              交易后母公司持续把它放在优先位置。上述依赖都是普通生物科技依赖，但在这里更重要，因为公司的技术护城河仍在证明自己，而不是已经被获批商业特许经营业务保护起来。


              换句话说，信任和质量既是当前事实，也是面向未来的承诺。类别基准很清楚，但 Metsera 仍需要靠开发执行长进到那个基准。
