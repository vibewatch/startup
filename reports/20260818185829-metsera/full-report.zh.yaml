      - number: '7.2'
        title: 监管、运营与质量风险
        blocks:
          - type: paragraph
            body: >-
              第一组风险是监管和运营。Metsera 仍需要把令人鼓舞的临床数据转化为获批产品，而肥胖治疗药物是对安全性敏感的长期用药。FDA
              沟通和基准标签说明了原因：该类别要求成熟的安全性、标签和长期耐受性框架。资产越接近获批，类别层面的负担越会变成公司层面的负担。


              运营上，公司也依赖强有力的试验执行、供应准备和项目管理。MET-097i 和 MET-233i 的正面读出降低了技术疑虑，但没有消除 3
              期、放大生产或制造风险。尚未商业化的生物科技公司面对上述问题时，承销核心就在这里，而不是其他次要项。


              监管延迟和运营滑坡还会相互叠加。较弱的试验包可能压窄标签，而更窄标签会削弱报销支持。因此，应把这组风险合并评估，而不是当作孤立条目。
