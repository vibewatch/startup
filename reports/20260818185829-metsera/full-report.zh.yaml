      - number: '6.2'
        title: 公开证据真正证明了什么
        blocks:
          - type: paragraph
            body: >-
              Metsera 的公开证明最强在交易对手层面，而不是终端客户层面。Amneal 是可见制造伙伴，Pfizer
              是战略买家和当前所有者。两段关系都重要，因为它们显示出严肃的外部验证。但它们不等于生产性客户基础，也回答不了正常客户尽调章节会问的重复使用、账户扩张或满意度问题。


              MET-097i 和 MET-233i
              的临床读出同样重要，但边界有限。它们证明产品有希望，不证明客户采用。公司实际上是在还没披露独立商业证据前，就把市场对未来客户价值的战略信念变现了。这是财务上有吸引力的结果，但也留下了比投资人可能预期更薄的公开客户记录。


              实际写法上，本章必须把战略证明和客户证明分成两类。Metsera 在公开视野里前者很多，后者几乎没有。这个区分是本章最重要的框架选择。
