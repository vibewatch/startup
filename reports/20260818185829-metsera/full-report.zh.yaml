chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、起源与当前状态
        blocks:
          - type: paragraph
            body: >-
              Metsera 并不是早期调研传闻所称的 Janssen 或 Johnson & Johnson 剥离公司。公开记录显示，它是一家由 Population Health Partners 和 ARCH
              Venture Partners 于 2022 年 6 月组建的独立肥胖生物科技公司，随后围绕来自 Zihipp、Imperial 关联科学，以及后续授权和制造交易的肽资产搭建起来。到 Metsera 在
              2025 年初登陆公开市场时，公司已把自己定位成覆盖长效注射 GLP-1、胰淀素候选物，以及后续口服肽产品的下一代肥胖平台。其主要执行办公室列在纽约 3 World Trade
              Center；文件也始终把公司定义为尚未商业化的临床阶段公司，而不是已经产生收入的制药运营企业。


              这一身份在 2025 年底彻底改变。Pfizer 于 2025 年 9 月宣布合并协议，并在 2025 年 11 月完成收购；此后 Metsera 成为全资子公司，Nasdaq
              上市也终止。对当前尽调而言，公司作为平台和管线仍有战略意义，但已不再是独立上市投资标的。metsera.com 跳转至 Pfizer 也强化了同一个现实判断：尽调对象如今是 Pfizer
              体系内一组已被收购的肥胖资产，而不是一个可独立融资的独角兽。
