      - number: '8.3'
        title: 收购后的乐观 / 基准 / 悲观情景
        blocks:
          - type: paragraph
            body: >-
              普通的乐观 / 基准 / 悲观框架需要改写，因为公司已经出售。最诚实的基准情景是，公开投资者已经看到独立价值事件，且不能再直接持有上行空间。剩余乐观情景只以间接方式存在：如果评估这笔交易的历史吸引力，或任何与
              CVR 挂钩的剩余可选性，问题就变成 Metsera 的资产最终能否在 Pfizer 内部支撑高于已披露现金条款所暗示的价值。


              剩余悲观情景也不寻常。它不是 Metsera 股票交易崩盘——已经没有 Metsera
              股票可交易。它是这样一种可能：外部投资者已经无法接触未来上行，而内部资产故事仍带有显著科学、报销和优先级风险。因此，本章现在少谈价格目标，多谈有纪律的历史评估和剩余尽调问题。


              换句话说，乐观 / 基准 / 悲观练习已经从“我今天该付多少钱？”转成“我该如何解读一个已经完成的战略结果？”这才是一个已退市资产平台的正确框架。
