      - number: '7.4'
        title: 缓释、监测与终止标准
        blocks:
          - type: paragraph
            body: >-
              公开可见的缓释因素是真实的。Metsera
              交割前现金余额大，制造准备可见，临床数据正面，最终还获得大型收购方支持。上述事实降低了立即失败的概率。但它们不支持自满。强缓释只有在后续证据继续朝安全性、疗效、准入和内部战略支持的正确方向推进时才有用。


              因此，最好的监测框架应聚焦少数会打破投资逻辑的触发器：Pfizer
              内部出现去优先级迹象，与竞争对手相比的差异化证据收窄，或支付方预算即便面对临床价值仍把肥胖药准入结构性卡住。即便没有戏剧性单一事件爆雷，它们也是最可能压缩平台战略价值的失败模式。


              最后一个更细微的风险是信息慢性衰减：如果披露减少、里程碑越来越难读，承销质量可能先于业务本身恶化。因此，可监测性本身也应被当作一条缓释标准。
