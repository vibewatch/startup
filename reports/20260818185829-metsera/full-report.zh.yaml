      - number: '1.3'
        title: 资本形成与短暂的公开市场轨迹
        blocks:
          - type: paragraph
            body: >-
              即便按肥胖生物科技标准看，Metsera 的融资节奏也异常压缩。2024 年 4 月宣布的启动融资达到 $290 million，2024 年 11 月 Series B 轮又加入 $215
              million，2025 年 1 月 IPO 定价为每股 $18，最终获得约 $316 million 总收益。SEC 文件之后显示，计入优先股融资、可转换票据和 IPO 后，截至 2025 年 6
              月的累计净收益约为 $824 million。这一融资画像很重要，因为它解释了 Metsera 如何在不到两年里从隐身状态走到多项临床读出，再到战略收购。


              收购轨迹和融资轨迹同样关键。Pfizer 2025 年 9 月的初始报价为每股 $47.50 现金加或有价值权利；后续修订后的合并材料把现金金额提高到每股 $65.60，Pfizer
              的完成公告则把初始企业价值放在约 $7.0 billion。外部投资者要看到，重要含义不只是价值得到兑现，而是可兑现价值已经在 2025 年离开公开市场。
