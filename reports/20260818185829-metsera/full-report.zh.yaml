      - number: '5.2'
        title: 平台架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              架构故事建立在三层之上：授权肽科学、赋能设计平台，以及外包化运营执行。公开文件把公司的 MINT 肽库与 Stephen Bloom 关联的长期营养刺激激素研究联系起来。HALO 和 MOMENTUM
              随后成为公司用于半衰期延长和口服递送野心的核心赋能技术。上述平台主张很重要，因为 Metsera 希望外界把它当作技术系统来评价，而不是一场一次性临床押注。


              但运营模式从来不是纯内部化。Amneal 提供了可见的制造与供应路径，而临床执行、监管推进和后续商业化，都依赖第三方和外部基础设施。实际看，Metsera 的产品技术栈既是分子设计挑战，也是编排挑战。


              这份编排负担也解释了为什么产品技术尽调不能止步于分子新颖性。尽调还必须测试周边运营系统——CMC、供应商、监管规划，以及如今的母公司支持——能否把科学继续往前推。
