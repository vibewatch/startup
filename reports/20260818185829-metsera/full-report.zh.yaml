            body: >-
              路线图显然是临床路线图：资助 MET-097i 进入关键阶段工作，增强对 MET-233i 的信心，并让口服延展保持战略期权价值。证据集支持对这条路线图有真实信心，尤其是在 2b 期和 1
              期数据发布之后。但它并不支持“技术执行风险已经消失”的结论。不同资产的公开细节并不均衡，尤其是口服后续项目和 Pfizer 体系内的交割后计划。


              因此，正确的产品技术结论应保持平衡。Metsera 有一个可信且具战略差异化的平台故事，建立在肽专有知识、多资产宽度和具临床意义的便利性野心之上。这个故事强到足以支撑 Pfizer
              收购。但它仍是一个开发阶段系统，最终商业证明仍取决于交易完成后的执行。


              对尽调而言，产品案例应按一个有真实战略验证的高上行平台来承销，而不是按一个已经去风险的上市引擎来承销。科学足够有说服力，能吸引买家；执行路径仍然极其重要。
