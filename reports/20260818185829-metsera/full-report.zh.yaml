  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的概览
        blocks:
          - type: paragraph
            body: >-
              Metsera 的风险画像，应被理解为一个有前景但仍未被商业证明的肥胖平台的风险画像；它在商业证据到来前已经换了所有权。公司靠大额融资并出售给
              Pfizer，降低了一些典型生物科技风险；但核心科学、监管和报销风险并没有消失，只是迁移到了新的所有权语境中。因此，最严重的剩余风险集中在开发执行、监管转化、支付方接受度和交割后内部优先级，而不是简单的流动性存续。


              这个框架很重要，因为对退出的表层解读可能暗示风险已经全面下降。现实中，收购解决融资压力的程度，远大于解决产品不确定性的程度。因此，正确问题不是 Metsera
              是否有风险——它当然有——而是在最显眼的独立融资风险被部分移除后，哪些风险仍然存在。


              因此，剩余风险视角更接近后期组合承销，而不是二元偿付能力测试。判断 Pfizer 交易解决了什么、没有解决什么时，这个细微差别很关键。
            claimRefs:
              - CR001
              - CR013
              - CR014
              - CR015
              - CR016
              - CR020
