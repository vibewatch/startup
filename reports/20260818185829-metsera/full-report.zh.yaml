      - number: '4.3'
        title: 资本充足性与募资用途
        blocks:
          - type: paragraph
            body: >-
              Metsera 年纪很轻，融资栈却异常庞大。公司在 IPO 前募集约 $321.5 million 净额，2024 年底又完成 $215 million Series B 轮，随后完成 IPO，获得约
              $316.2 million 总收益和约 $288.4 million 净收益。现金和有价证券在 2024 年末为 $352.4 million；IPO 后的 2025 年 3 月 31 日升至 $588.3
              million；又经历一个高额运营支出季度后，2025 年 6 月 30 日为 $530.9 million。


              募资用途也写得很明确。招股说明书称，IPO 资金将主要支持 MET-097i 3
              期项目直到顶线结果和里程碑付款，其余用于营运资金和一般公司用途。换句话说，这个资本栈不是在资助一个成熟销售机器，而是在资助临床证明和期权价值。管理层给出的现金跑道延伸至 2027
              年，从自身假设看可信；但它描述的仍是一家公司：若没有临床成功、合作收入或战略退出，仍会依赖融资。
