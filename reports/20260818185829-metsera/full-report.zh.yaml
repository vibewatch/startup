      - number: '2.3'
        title: 买方、用户、支付方与战略买方分层
        blocks:
          - type: paragraph
            body: >-
              在最终商业市场里，患者是用户，处方医生创造需求，支付方和 PBM 是守门人，药房渠道塑造实际准入。但 Metsera 尚未商业化，另一个买方类别立刻重要：愿意在上市前授权或收购肥胖平台的大型制药公司。Pfizer
              收购 Metsera、Roche 与 Zealand 合作，都说明业务拓展需求是差异化资产的真实变现渠道。


              拆分后的买方地图会改变尽调看待市场进入的方式。自费和商业渠道可能推动部分品牌肥胖疗法早期采用，但借助 Medicare Bridge、BALANCE
              及覆盖试验扩展公共渠道，可能决定整个类别的规模。与此同时，只要战略买家相信资产能在未来准入格局中占有位置，尚未商业化的平台仍能创造价值。因此，Metsera 的市场分析不能被压缩成单一支付方细分或单一患者人数。
