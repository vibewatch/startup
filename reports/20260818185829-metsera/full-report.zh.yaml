      - number: '2.2'
        title: 规模口径：庞大的疾病负担，更窄的近期准入池
        blocks:
          - type: paragraph
            body: >-
              外沿需求池无疑很大。WHO 报告全球超过 1 billion 人患有肥胖，成年肥胖人群为 890 million；CDC
              流行率地图也显示，美国大多数州都有大量成年人患有肥胖。上述数据解释了为什么肥胖已成为生物制药最有吸引力的治疗类别之一。但流行率数字本身并不能为一家管线阶段公司定义可投资的
              SAM。疾病负担是流行率视角，不是报销或上市视角。


              更紧的口径来自支付方和政策证据。KFF 的 2026 Medicare Bridge 分析基于 2023 数据估计，潜在符合条件的 Part D 参保人约为 3.8 million；其 Medicare 和
              Medicaid 支出分析则显示，即便广泛法定肥胖覆盖尚未存在，使用量和预算影响已经很大。结果是，一个市场同时巨大且被严格闸门控制。正确的分析动作，是把不同层次并排呈现，而不是压成一个合成 TAM 标题。
