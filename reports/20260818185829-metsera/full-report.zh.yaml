      - number: '2.4'
        title: 增长驱动与闸门约束
        blocks:
          - type: paragraph
            body: >-
              最强的增长驱动来自临床疗效、覆盖更广的心血管代谢获益、给药更容易，以及在位药企早期收购差异化平台的意愿。FDA 给 Wegovy 的心血管风险降低标签，帮助支付方叙事从单纯减重拓宽；Lilly 和 Novo
              掀起的口服 GLP-1 浪潮也说明，更易使用的形态可以把该类别推向更接近初级保健的规模。Metsera 自身的读出——月度胰淀素和超长效 GLP-1——也落在同一场便利性与差异化竞赛中。


              但需求并不等于采用。报销规则仍不完整，Medicaid 覆盖仍有限，Medicare Bridge
              符合条件的人群比标题上的肥胖人口窄；即便疗法在纸面上看起来具成本效益，可负担性压力依然严峻。再叠加供应、耐受性和持续用药挑战，这个市场更像是政策闸门控制下的扩张故事，而不是无摩擦的大趋势。落到 Metsera
              身上，资产差异化至少和原始类别规模同等重要。
