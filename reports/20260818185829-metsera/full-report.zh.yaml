  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与直接可比公司
        blocks:
          - type: paragraph
            body: >-
              Metsera 真正的可比集合不是泛泛的肥胖照护，而是一批试图用更好便利性、更好疗效、新机制或更强战略定位重塑药物减重治疗的公司。这个集合包括 Lilly 和 Novo 等商业化在位者，Structure 和
              Viking 这样的在研口服挑战者，Roche/Zealand petrelintide 等聚焦胰淀素的项目，以及 Metsera 自身的超长效 GLP-1
              与月度胰淀素组合。共同的竞争问题不是肥胖需求是否存在，而是哪类资产组合能把需求转化为可报销、可持续的使用。


              在这个框架下，Lilly 和 Novo 仍是参照竞争者，因为它们把临床数据和实际产品分发结合在一起。相比之下，Metsera
              竞争的是其资产未来可能成为的样子。直接比较因此可行，但也意味着公司最强的竞争证明来自战略验证和临床读出，而不是商业份额或处方数据。
