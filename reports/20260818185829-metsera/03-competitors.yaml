  figureRefs:
  - FP001
- id: capability-and-modality-comparison
  title: Capability and modality comparison
  body: |-
    The field has fragmented into several modality races. Lilly and Novo have pushed hard on oral convenience, setting a new bar for primary-care-friendly obesity treatment. Structure and Viking are important because they represent independent attempts to attack the same convenience problem with their own oral programs. Roche and Zealand keep amylin and combination-style differentiation alive, while Metsera tried to bridge both ultra-long-acting GLP-1 and monthly amylin into one portfolio logic.

    This means Metsera’s differentiation could not rest on saying it was merely a GLP-1 company. It had to argue that its specific dosing profile, asset mix, and platform optionality justified attention in a field where multiple credible mechanisms and formats were converging. That thesis was plausible, but it was also fragile because many competitors were pursuing adjacent convenience claims at the same time.
