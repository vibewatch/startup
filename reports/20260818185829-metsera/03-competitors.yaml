- id: pricing-distribution-and-switching-power
  title: Pricing, distribution, and switching power
  body: |-
    Competitive power in obesity is not just about molecules. It is also about access. Approved brands enjoy payer contracting, label familiarity, field distribution, and increasingly strong public-channel precedent. Investigational companies do not. As a result, commercial incumbents can often win with less than perfect differentiation if their products are easier to prescribe, easier to cover, and easier to stay on.

    This is where Pfizer ownership changes Metsera’s position. As a standalone company, Metsera lacked commercial infrastructure and any approved price point. Inside Pfizer, some of those distribution and capital disadvantages narrow. But the company also loses the flexibility and standalone comparability that a public company would otherwise have. The practical takeaway is that Metsera’s competitive standing improved strategically even as its identity as an independent market participant disappeared.
