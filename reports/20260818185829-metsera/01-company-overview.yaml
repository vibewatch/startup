- id: scale-markers-milestones-and-open-metrics
  title: Scale markers, milestones, and still-private metrics
  body: |-
    Metsera’s strongest scale markers were technical and capital-market milestones rather than customers or revenue. It reported 81 employees at year-end 2024, no product revenue, year-end 2024 cash and securities of $352.4 million, March 2025 cash of $588.3 million, and June 2025 cash of $530.9 million. The operating profile remained loss-making and precommercial throughout the standalone period, but that was consistent with a clinical-stage obesity platform rather than a failed operating business.

    The milestone record is more impressive than the cover-metric record. In 2025 alone, Metsera reported positive MET-233i Phase 1 data, positive MET-097i Phase 2b data, enough public progress to remain active as a listed company through July, and a strategic sale to Pfizer by November. What remains less knowable are the metrics many investors instinctively want on a cover card: post-acquisition headcount, customer count, and any revenue run-rate do not appear to be publicly disclosed. That absence is not unusual for a company sold before commercialization, but it is a meaningful diligence gap and should be stated plainly rather than inferred away.
