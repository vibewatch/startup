company:
  name: Metsera
chapter:
  number: 1
  title: Company Overview
  summary: Metsera was an independent obesity-biotech platform founded in June 2022 by Population Health Partners and ARCH Venture Partners, not a Johnson & Johnson spinout. It moved unusually quickly from a $290 million launch financing to a $215 million Series B, a January 2025 IPO, multiple mid-stage peptide readouts, and a November 2025 sale to Pfizer that ultimately delivered $65.60 per share in cash plus contingent value rights. The public record shows a well-financed but precommercial company with 81 employees at year-end 2024, no product revenue, and a science platform rooted in Zihipp and Imperial-linked peptide work.
sections:
- id: identity-and-current-status
  title: Identity, origin, and current status
  body: |-
    Metsera is not the Janssen or Johnson & Johnson spinout suggested in earlier scuttlebutt. The public record instead shows an independent obesity biotech formed in June 2022 by Population Health Partners and ARCH Venture Partners, then built around peptide assets sourced through Zihipp, Imperial-linked science, and subsequent licensing and manufacturing deals. By the time Metsera reached public markets in early 2025, it had positioned itself as a next-generation obesity platform spanning long-acting injectable GLP-1 and amylin candidates plus oral peptide follow-ons. Its principal executive offices were listed at 3 World Trade Center in New York, and its filings consistently framed the company as precommercial and clinical stage rather than as a revenue-producing operating pharma business.

    That identity changed decisively in late 2025. Pfizer announced a merger agreement in September 2025 and completed the acquisition in November 2025, after which Metsera became a wholly owned subsidiary and its Nasdaq listing ended. For current diligence, that means the company remains strategically relevant as a platform and pipeline, but no longer exists as a standalone public investment. The redirect of metsera.com to Pfizer reinforces the same practical point: the object of diligence is now an acquired obesity asset package inside Pfizer rather than an independently financeable unicorn.
