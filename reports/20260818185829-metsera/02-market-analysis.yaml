- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Cardiometabolic label expansion
    - Positive
    - Current to medium-term
    - Supports payer reframing beyond cosmetic weight loss
    - Track whether future Metsera assets gain broader-outcomes narratives.
  - - Oral GLP-1 and easier-use formats
    - Positive
    - Current to medium-term
    - Could expand primary-care adoption and reduce injection friction
    - Assess whether Metsera’s oral platform is competitive on efficacy and manufacturing.
  - - Less-frequent dosing / amylin differentiation
    - Positive
    - Medium-term
    - Convenience and adherence may become key wedge factors
    - Test whether monthly amylin or ultra-long-acting assets hold up in larger trials.
  - - Reimbursement limits and prior authorization
    - Negative
    - Current
    - Caps realized access despite strong clinical demand
    - Model access under commercial, Medicare, and Medicaid separately.
  - - Public-budget affordability pressure
    - Negative
    - Current to medium-term
    - Can slow coverage expansion even when drugs look cost-effective
    - Track gross-to-net dynamics and bridge-program take-up.
  - - Supply / CMC readiness
    - Negative
    - Current to medium-term
    - Category demand can exceed available product supply
    - Assess manufacturing scalability and partner dependence.
  - - GI tolerability / persistence
    - Negative
    - Current
    - Real-world discontinuation can reduce lifetime value
    - Look for persistence data and formulation differentiation.
  notes: The same factors that expand category demand can also intensify competition and payer scrutiny.
