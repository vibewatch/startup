  rows:
  - - Broad obesity care
    - Lifestyle, diagnostics, surgery, chronic-care services
    - Non-prescription wellness and unrelated metabolic care
    - 'Mixed: consumers, providers, payers'
    - Useful only as outer context; too broad for company valuation.
  - - Branded anti-obesity drugs
    - Prescription GLP-1, GIP/GLP-1, amylin, oral and injectable obesity medicines
    - Surgery, coaching, OTC supplements
    - Payers, PBMs, providers, patients
    - Core eventual commercialization market.
  - - Next-generation incretins / amylin
    - Differentiated oral, ultra-long-acting, combination-like or adjunct obesity assets
    - Mature first-wave products with no differentiation thesis
    - Strategic pharma buyers plus future payers/prescribers
    - Closest fit for Metsera’s product strategy.
  - - Strategic BD / M&A channel
    - Licensing, option, acquisition, or collaboration economics for obesity assets
    - Retail prescription volumes
    - Large pharma business-development teams
    - Immediate monetization channel for a pipeline-stage platform.
  notes: The table separates disease prevalence context from the narrower therapeutic and strategic-buyer categories that actually mattered to Metsera.
