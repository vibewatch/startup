- id: buyer-user-payer-map
  title: Buyer, user, payer, and strategic-buyer segmentation
  body: |-
    In the eventual commercial market, patients are the users, prescribers are the demand creators, payers and PBMs are the gatekeepers, and pharmacy channels shape realized access. But for Metsera as a precommercial company, there is another buyer category that matters immediately: large pharmaceutical companies willing to license or acquire obesity platforms before launch. Pfizer’s purchase of Metsera and Roche’s collaboration with Zealand show that business-development demand is a real monetization channel for differentiated assets.

    This split buyer map changes how diligence should think about market entry. Self-pay and commercial channels may drive early uptake for some branded obesity therapies, but public-channel expansion through Medicare Bridge, BALANCE, and related coverage experiments could determine category scale. Meanwhile, precommercial platforms can still create value if strategic buyers believe the assets can matter in that future access landscape. That is why Metsera’s market analysis cannot be reduced to one payer segment or one patient count.
  claimRefs:
  - CM008
  - CM009
  - CM014
  - CM015
  - CM016
  - CM024
  - CM028
  - CM033
  - CM034
