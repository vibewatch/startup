- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Risk
  - Current status
  - Why it matters
  - Diligence ask
  rows:
  - - Top-customer concentration
    - Not applicable publicly
    - No public customer base exists yet
    - Do not invent concentration where none is disclosed.
  - - Partner concentration
    - High
    - Amneal and Pfizer are disproportionately important counterparties
    - Assess supply alternatives and internal Pfizer priority.
  - - Channel concentration
    - Potentially high
    - Coverage pathways may concentrate access into a few payer decisions
    - Model channel-by-channel uptake, not one blended path.
  - - Geographic concentration
    - Unknown
    - No public launch footprint exists
    - Request future launch sequencing by market.
  - - Expansion path uncertainty
    - High
    - No standalone land-and-expand evidence exists
    - Focus on reimbursement and post-launch persistence assumptions.
  notes: The key risk is concentration of dependencies before concentration of customers.
