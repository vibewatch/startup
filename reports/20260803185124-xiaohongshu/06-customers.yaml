- id: TU004
  title: Retention / repeat usage / satisfaction table
  columns:
  - Proxy metric
  - Public value / signal
  - Why it matters
  - Gap
  rows:
  - - Monthly search penetration
    - 36Kr cited ~70%
    - Search-led usage suggests repeat intent rather than passive feed-only consumption
    - No cohort retention by user age or region.
  - - App-store review volume
    - Google Play shows 194K reviews
    - Large review base indicates broad usage and engagement over time
    - Review counts are not MAU or churn.
  - - Core return actions
    - Search, saves, comments, messages, profile optimization
    - Product supports repeat behaviors beyond one-time browsing
    - No disclosed DAU / WAU / session metrics.
  - - Merchant-side repeat signal
    - Rapid merchant cohort growth suggests business value is recurring enough to scale
    - Brands appear willing to reinvest in presence
    - No public merchant churn or renewal data.
  - - International repeat risk
    - English content scarcity and saturation constrain repeat overseas usage
    - Explains why virality may not become durable adoption
    - No public country-level retention dashboards.
  notes: These are repeat-usage proxies, not formal retention or cohort metrics published by management.
