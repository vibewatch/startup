- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Risk
  - Why it matters
  - Current public signal
  - Diligence path
  rows:
  - - International content-density risk
    - Without enough English or local content, new users may not stay
    - Rest of World and reviews show translation helps but content scarcity remains
    - Request retention and content-upload cohorts by language / region.
  - - Same-app governance complexity
    - One app for domestic and global audiences raises moderation and privacy load
    - WSD and app-store evidence support same-app structure
    - Request regional moderation queue metrics and privacy controls by geography.
  - - Merchant concentration opacity
    - A few large categories or advertisers could drive outsized value
    - Brand breadth is public, concentration is not
    - Request top-20 merchant / advertiser spend concentration.
  - - Policy / access risk
    - Cross-border policy shifts can change reach quickly
    - Taiwan and broader scrutiny show customer access can move with policy
    - Request country-by-country access and compliance risk map.
  - - Retention disclosure gap
    - No MAU / DAU / churn cohorts by segment
    - Hard to value durable customer economics cleanly
    - Request cohort tables for users, creators, and merchants.
  notes: This table isolates the highest-value customer diligence blockers rather than every possible geographic or category risk.
