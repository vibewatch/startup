  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cohort-retention
    missingEvidence: Segmented MAU / DAU, churn, time spent, and repeat-purchase or repeat-search cohorts for consumers, creators, and merchants.
    whyItMatters: Public adoption signals are strong, but durability cannot be directly underwritten without cohort data.
    diligencePath: Request consumer, creator, and merchant cohort dashboards by geography and category.
  - type: private-evidence-only
    severity: material
    topic: merchant-concentration
    relatedTableRefs:
    - TU003
    missingEvidence: Top-merchant, top-category, and top-advertiser concentration plus renewal behavior.
    whyItMatters: A broad ecosystem can still hide concentration risk.
    diligencePath: Request top-20 merchant and advertiser concentration with retention by cohort.
  - type: restricted-access
    severity: minor
    topic: third-party-traffic-verification
    missingEvidence: Consistent third-party traffic / engagement measurement that is openly accessible for international audience analysis.
    whyItMatters: Independent verification of geography mix is weaker than the headline customer narrative.
    diligencePath: Refresh with app-intelligence subscriptions or management dashboards.
  acknowledgedWarnings: []
