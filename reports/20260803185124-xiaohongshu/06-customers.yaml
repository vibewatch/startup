- id: proof-quality-and-ecosystem-depth
  title: Customer proof quality, merchant depth, and repeat-usage proxies
  body: |-
    Because Xiaohongshu is a consumer network, customer proof is more ecosystem-based than contract-based. The most defensible named proof comes from the platform's official business ecosystem materials, which cite 130,000 brands from more than 200 countries and regions and include merchant and brand voices such as Nestle Coffee China and Li Ning in endorsement of the business-guideline framework. TechNode and 36Kr then add evidence that merchant depth is not cosmetic: high-value merchants and SMEs have been scaling quickly on the platform, and commerce tooling is increasingly designed to make business outcomes more measurable. That is meaningful because it suggests the merchant customer is not just testing Xiaohongshu for awareness—it is trying to operate there more systematically.

    Repeat-usage proxies are also unusually intent-driven. A 36Kr report cited 70% monthly search penetration, while app-store reviews and onboarding guides highlight saves, comments, search, and profile optimization as part of how users return. Even so, the customer chapter cannot claim formal retention excellence. We do not have cohort retention, GRR / NRR analogs, or clean geography-by-usage segmentation. The best public conclusion is that Xiaohongshu has high-quality repeat-use mechanics, but not enough disclosed data to convert that into a precise retention model.
