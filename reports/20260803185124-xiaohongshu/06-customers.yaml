chapter:
  number: 6
  title: Customers
  summary: |-
    Xiaohongshu's customer story is strongest on intent-rich consumer behavior and a broadening two-sided ecosystem rather than on formal enterprise-style retention disclosure. Public sources support a 300M+ user base, rapid U.S. and non-Western download spikes during the January 2025 TikTok disruption, 130,000 brands from 200+ countries and regions, and a customer workflow built around search, saves, comments, and shopping research. The weakness is durability disclosure: Xiaohongshu still does not publish management-grade MAU / DAU cohorts, churn, geographic mix, or merchant concentration, so customer quality must be inferred from adoption bursts, merchant growth, and intent signals rather than directly underwritten.
sections:
- id: segments-and-customer-jobs
  title: Customer segments and the job Xiaohongshu solves
  body: |-
    Xiaohongshu serves more than one “customer” at once. The core consumer job is not just entertainment; it is decision support. Multiple sources describe users treating the app as a place to search, compare, save, and discuss products, travel plans, restaurants, and lifestyle choices before they buy or book. That makes the consumer base more valuable than a generic social audience because purchase intent is explicit. The merchant side is the second customer layer: brands and sellers come because those consumers arrive ready to ask “is it worth buying?” rather than merely scroll. Official business materials reinforce that point by emphasizing authentic product and service information, while merchant-growth reports show the ecosystem is becoming meaningful for commerce operators too.

    The most important segmentation fact is that Xiaohongshu is not only a China-domestic app anymore, but it is still China-centered. Global onboarding guides and app-store evidence show the same app is used by overseas users, yet Rest of World reporting suggests the strongest non-China cohort is still overseas Chinese and Chinese-speaking communities rather than a fully mainstream Western audience. In practice, Xiaohongshu's customer stack today looks like: Chinese lifestyle and shopping researchers, creators who shape taste and trust, brands that want intent-rich discovery, and a growing but still early overseas cohort drawn in by TikTok instability, translation features, and RedShop experiments.
