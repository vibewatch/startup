    - Move risk rating higher and require management remediation evidence
  - - AI-fraud recurrence
    - Quarterly cleanup data
    - Account or fake-post penalties continue rising despite new rules
    - Assume moderation costs are structurally under-modeled
  - - Foreign-retention failure
    - Country-level cohort, review, and app-store trend data
    - U.S./overseas usage falls sharply after awareness bursts
    - Treat overseas option value as low and reduce growth assumptions
