  - TM001
  figureRefs:
  - FM001
- id: sizing-lenses
  title: 'Sizing lenses: huge top-down numbers, smaller monetizable wedges'
  body: |-
    Top-down market numbers are directionally attractive but methodologically messy. Research and Markets publishes a very
    broad China social-commerce forecast of roughly US$4.22 trillion in 2026, which is useful as a category ceiling but
    far too broad to equate with Xiaohongshu’s direct opportunity. Grand View and Fortune Business Insights likewise show
    a massive global and Asia-Pacific social-commerce expansion curve, with APAC dominating global revenue and 2026-2033
    CAGR estimates around the high 30s. Those numbers tell us the format is large and still compounding; they do not tell
    us how much of that value a discovery-led platform can actually capture.

    A narrower lens comes from live commerce and from Xiaohongshu-specific merchant evidence. Grand View’s China live-
    commerce outlook pegs that market at about US$41 billion in 2024, again growing at roughly 37% CAGR to 2033. That is
    already much closer to a monetizable activity set than all-category social-commerce GMV. Still, Xiaohongshu is not a
    full live-commerce clone of Douyin or Taobao Live. The company’s best-fit SAM is probably the subset of high-consideration,
    creator-mediated beauty, fashion, and lifestyle spending where brand education happens before checkout. In that narrower
    wedge, Xiaohongshu can be highly important without needing to own a dominant share of all Chinese online retail.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
