- id: TM002
  title: TAM/SAM/SOM or sizing lens table
  columns:
  - Lens
  - Scope
  - Value
  - Date / source
  - What it means
  - Limitation
  rows:
  - - China social-commerce ceiling
    - All China social-commerce GMV across categories and models
    - US$4.22T
    - 2026 / Research and Markets
    - Upper-bound category size for discovery + commerce behavior
    - Too broad for app-level capture or revenue assumptions
  - - Global social-commerce expansion
    - Global social-commerce revenue
    - US$1.93T in 2026; 37.4% CAGR to 2033
    - Fortune Business Insights
    - Shows macro format momentum and investor appetite for the category
    - Global, not Xiaohongshu-specific
  - - APAC share lens
    - APAC share of global social-commerce revenue
    - 72.3% in 2025
    - Grand View Research
    - Supports the idea that Asia remains the center of gravity for the format
    - Regional share, not China-specific demand
  - - China live-commerce activity
    - China live-commerce market revenue
    - US$41.0B in 2024
    - Grand View China live commerce outlook
    - Closer to a monetizable commerce-activity lens than all-category social GMV
    - Still broader than Xiaohongshu's best-fit categories
  - - China digital user base
    - Internet and social-media identities in China
    - 1.30B internet users; 1.28B social identities
    - DataReportal / late 2025
    - Large addressable attention pool for content-commerce
    - Top-of-funnel audience size is not equal to commerce TAM
  - - Xiaohongshu SOM proxy
    - Reported 2024 Xiaohongshu ecommerce GMV
    - '>RMB400B'
    - JadeMond citing company-disclosed data
    - Useful directional SOM proxy inside Chinese social commerce
    - Source quality is low and should be treated as directional only
  notes: The rows intentionally mix incompatible lenses to preserve methodological spread; they should not be added together.
