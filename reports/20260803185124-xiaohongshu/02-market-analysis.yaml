tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / spend bucket
  - What is included
  - What is excluded
  - Buyer / payer
  - Relevance to Xiaohongshu
  rows:
  - - Discovery-led social commerce
    - Search, notes, creator content, soft-sell product education in beauty, fashion, food, travel, and lifestyle
    - Pure utilitarian replenishment and bulk commodity buying
    - Users research; brands and merchants pay for influence
    - Core market where Xiaohongshu is strongest
  - - Live commerce
    - Livestream selling, creator demos, host-led conversion events
    - Static catalogue ecommerce without social interaction
    - Users buy; merchants and brands pay platform fees / ads
    - Important adjacent format, but Xiaohongshu is not the dominant scale player
  - - Mass marketplace ecommerce
    - Broad catalogue shopping on Taobao, JD, PDD, Tmall
    - Upstream social discovery before product consideration
    - End buyers pay merchants; merchants pay marketplace commissions and ads
    - Acts as transaction substitute and beneficiary of Xiaohongshu referrals
  - - Content advertising
    - Brand spend on awareness, search capture, and recommendation seeding
    - Offline brand marketing and non-commerce media buying
    - Brands / merchants
    - Major monetization path for Xiaohongshu even when checkout happens elsewhere
  - - Cross-border diaspora commerce
    - Overseas and diaspora demand reached through RedNote or Hong Kong-led expansion
    - Localized Western mass-market ecommerce at scale
    - Overseas users, agencies, and Chinese merchants
    - Emerging option, but still operationally immature
  notes: The table distinguishes influence markets from captured transaction markets so TAM does not overstate Xiaohongshu's monetizable wedge.
