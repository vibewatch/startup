  - - Overseas / diaspora users
    - Chinese diaspora and curious foreign users
    - Users, merchants, agencies
    - Cross-border cultural content and 2025 RedNote attention
    - Opportunity exists, but product and payout friction remain high
  notes: Buyer and payer are intentionally separated because Xiaohongshu often monetizes brands while influencing end-user purchases.
