  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: mau-estimate
    missingEvidence: A management-certified monthly active user definition and the latest official MAU figure for mainland and overseas users.
    whyItMatters: Late-stage private reports cite materially different MAU numbers, which affects SAM penetration and engagement quality analysis.
    diligencePath: Ask management for the latest MAU / DAU deck and reconcile definitions used by KrASIA, Rest of World, and any investor memo.
  - type: private-evidence-only
    severity: material
    topic: sizing-methodology
    missingEvidence: A clean split between Xiaohongshu on-platform GMV, off-platform attributable commerce, and advertising monetization by category.
    whyItMatters: Without that split, SAM and SOM estimates blur discovery influence with captured transaction volume.
    diligencePath: Request internal merchant analytics showing attributable GMV, ad spend, and category mix for 2024-2025.
  - type: private-evidence-only
    severity: minor
    topic: overseas-expansion
    missingEvidence: Current overseas user cohorts, retention, and monetization conversion rates by country.
    whyItMatters: The market chapter can describe the opportunity, but not yet underwrite the international adoption path.
    diligencePath: Request cohort dashboards for overseas DAU, creator verification, merchant onboarding, and payout activation.
