evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: A current board roster, committee structure, and independent-director disclosure for Xiaohongshu.
    whyItMatters: >-
      IPO readiness and governance risk cannot be fully underwritten without knowing who actually exercises board
      oversight.
    diligencePath: Request the latest board deck or pre-IPO governance materials directly from management or lead investors.
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: A current official headcount disclosure rather than third-party database estimates or stale office-page numbers.
    whyItMatters: Hiring scale affects operating leverage, international readiness, and diligence on burn-rate assumptions.
    diligencePath: >-
      Ask management for current full-time employee count by location and cross-check with payroll or social-insurance
      filings.
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: >-
      Audited or management-certified revenue mix splitting advertising, transaction services, and other monetization
      streams.
    whyItMatters: >-
      Valuation quality depends on whether high-margin ad revenue or lower-margin commerce revenues dominate the income
      statement.
    diligencePath: Request audited financial statements or investor materials showing revenue composition for 2023-2025.
  - type: conflicting-data
    severity: material
    topic: mau-estimate
    missingEvidence: >-
      A management-certified monthly active user definition and the latest official MAU figure for mainland and overseas
      users.
    whyItMatters: >-
      Late-stage private reports cite materially different MAU numbers, which affects SAM penetration and engagement
      quality analysis.
    diligencePath: >-
      Ask management for the latest MAU / DAU deck and reconcile definitions used by KrASIA, Rest of World, and any
      investor memo.
  - type: private-evidence-only
    severity: material
    topic: sizing-methodology
    missingEvidence: >-
      A clean split between Xiaohongshu on-platform GMV, off-platform attributable commerce, and advertising
      monetization by category.
    whyItMatters: Without that split, SAM and SOM estimates blur discovery influence with captured transaction volume.
    diligencePath: Request internal merchant analytics showing attributable GMV, ad spend, and category mix for 2024-2025.
  - type: private-evidence-only
    severity: minor
    topic: overseas-expansion
    missingEvidence: Current overseas user cohorts, retention, and monetization conversion rates by country.
    whyItMatters: The market chapter can describe the opportunity, but not yet underwrite the international adoption path.
    diligencePath: Request cohort dashboards for overseas DAU, creator verification, merchant onboarding, and payout activation.
  - type: private-evidence-only
    severity: material
    topic: creator-multi-homing
    missingEvidence: Creator retention, cross-posting rates, and payout concentration by platform for top Xiaohongshu creators.
    whyItMatters: >-
      Without retention and cross-post data, moat durability versus Douyin, Taobao Live, and off-platform channels
      remains partially inferential.
    diligencePath: >-
      Request creator cohort data, creator payouts, and cross-platform posting overlap from management or major MCN
      partners.
  - type: private-evidence-only
    severity: material
    topic: merchant-economics
    missingEvidence: >-
      A clean comparison of merchant CAC, conversion, take rates, and attributable sales across Xiaohongshu, Douyin,
      Taobao, and Kuaishou.
    whyItMatters: Competitive advantage is easier to assert than to underwrite without hard merchant economics.
    diligencePath: Ask for anonymized merchant case studies comparing media spend and attributed sales across the main platforms.
  - type: missing-source
    severity: minor
    topic: JD-and-Bilibili-scale
    missingEvidence: >-
      Cleaner, directly comparable public operating metrics for JD and Bilibili as social-commerce substitutes rather
      than general internet companies.
    whyItMatters: The competitive map is strongest for Kuaishou and Tmall but thinner for some adjacent substitutes.
    diligencePath: Pull the latest JD and Bilibili investor decks with commerce or engagement breakdowns before the next refresh.
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited FY2024-FY2025 statements, stream-level revenue recognition, and gross-profit disclosure.
    whyItMatters: >-
      Without audited statements, the profit and margin narrative remains directionally useful but not fully
      underwritable.
    diligencePath: Request audited annual accounts, board budget packs, and monthly management reporting.
    relatedQuestionRefs:
      - QI002
      - QI021
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: cash-and-runway
    missingEvidence: Current cash balance, burn or cash-generation profile, and any debt / committed cloud or incentive obligations.
    whyItMatters: Capital adequacy cannot be directly underwritten even if profitability appears strong.
    diligencePath: Request latest balance sheet, treasury schedule, and 12-month cash forecast.
    relatedQuestionRefs:
      - QI021
      - QI022
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: attribution-and-take-rate
    missingEvidence: >-
      A clean bridge from note engagement to on-platform GMV, off-platform attributable sales, realized take rate, and
      contribution margin.
    whyItMatters: This is the key distinction between a premium-intent platform and a merely influential ad surface.
    diligencePath: Request internal funnel dashboards and category-level unit economics for on- and off-platform commerce.
    relatedQuestionRefs:
      - QI008
      - QI017
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: ranking-and-search-quality
    missingEvidence: >-
      Independent or management-provided metrics on search quality, recommendation relevance, and false-positive
      moderation rates.
    whyItMatters: The product thesis depends on discovery quality, but public evidence is mostly descriptive rather than measured.
    diligencePath: Request internal relevance KPIs, moderation appeals data, and offline evaluation reports.
  - type: private-evidence-only
    severity: material
    topic: merchant-tooling-depth
    missingEvidence: >-
      Full API catalog, production uptime, error rates, partner adoption counts, and commercial attach rates for Ark and
      related tooling.
    whyItMatters: Platform-like optionality is valuable only if integrations are widely used and operationally reliable.
    diligencePath: Request partner integration stats, API docs, and production incident history.
  - type: private-evidence-only
    severity: minor
    topic: security-certification-detail
    missingEvidence: Independent security certifications, audited privacy controls, and broader infrastructure reliability disclosures.
    whyItMatters: App-store disclosures and rule documents are useful, but not equivalent to third-party assurance.
    diligencePath: Request security-certification inventory, privacy-audit results, and incident postmortems.
  - type: private-evidence-only
    severity: material
    topic: cohort-retention
    missingEvidence: >-
      Segmented MAU / DAU, churn, time spent, and repeat-purchase or repeat-search cohorts for consumers, creators, and
      merchants.
    whyItMatters: Public adoption signals are strong, but durability cannot be directly underwritten without cohort data.
    diligencePath: Request consumer, creator, and merchant cohort dashboards by geography and category.
  - type: private-evidence-only
    severity: material
    topic: merchant-concentration
    relatedTableRefs:
      - TU003
    missingEvidence: Top-merchant, top-category, and top-advertiser concentration plus renewal behavior.
    whyItMatters: A broad ecosystem can still hide concentration risk.
    diligencePath: Request top-20 merchant and advertiser concentration with retention by cohort.
  - type: restricted-access
    severity: minor
    topic: third-party-traffic-verification
    missingEvidence: >-
      Consistent third-party traffic / engagement measurement that is openly accessible for international audience
      analysis.
    whyItMatters: Independent verification of geography mix is weaker than the headline customer narrative.
    diligencePath: Refresh with app-intelligence subscriptions or management dashboards.
  - type: restricted-access
    severity: material
    topic: regulatory-terms-transparency
    relatedTableRefs:
      - TR001
    missingEvidence: >-
      Clean public access to Xiaohongshu's complete current privacy, community-rule, and safety documentation plus any
      algorithm filing identifiers.
    whyItMatters: >-
      Investors cannot independently assess whether platform policies, disclosures, and filing obligations are
      sufficiently mature.
    diligencePath: Request the current rulebook bundle, filing numbers, privacy change log, and external counsel memo.
  - type: private-evidence-only
    severity: material
    topic: moderation-and-compliance-unit-economics
    missingEvidence: >-
      Moderation headcount, compliance spend, false-positive / false-negative rates, and appeals volumes by category and
      language.
    whyItMatters: The public record proves the risk exists but not whether Xiaohongshu is solving it efficiently.
    diligencePath: Request trust-and-safety dashboards, staffing trends, SLA metrics, and quarterly enforcement recurrence rates.
  - type: private-evidence-only
    severity: material
    topic: merchant-concentration-and-category-risk
    relatedTableRefs:
      - TR003
    missingEvidence: Top merchant/category exposure, strike rates by vertical, counterfeit losses, and qualification failure rates.
    whyItMatters: Merchant breadth does not tell investors whether monetization is diversified or high-quality.
    diligencePath: Request top-20 merchant concentration, category policy exceptions, and enforcement outcomes by vertical.
  - type: private-evidence-only
    severity: material
    topic: international-durability
    missingEvidence: >-
      Country-level cohort retention, moderation staffing by language, and overseas monetization data after the 2025
      virality spike.
    whyItMatters: International growth could be either valuable option value or expensive noise.
    diligencePath: Request regional cohort tables, content-density metrics, RedShop performance, and overseas CAC/LTV evidence.
  - type: private-evidence-only
    severity: material
    topic: ipo-grade-financial-disclosure
    missingEvidence: Audited revenue, margin, cash flow, and earnings-quality disclosures for Xiaohongshu itself.
    whyItMatters: The gap between $17B and $31B-plus is impossible to resolve confidently without filing-grade financials.
    diligencePath: Wait for prospectus or request audited pre-IPO package.
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preference-overhang
    missingEvidence: Preference stack, secondary-holder overhang, employee option pool, and liquidation terms.
    whyItMatters: Headline company valuation can diverge sharply from economic value to a new or common-equity investor.
    diligencePath: Request full capitalization table and waterfall analysis.
  - type: private-evidence-only
