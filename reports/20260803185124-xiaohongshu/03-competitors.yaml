- id: switching-lockin
  title: Switching costs, multi-homing, and where the moat actually lives
  body: |-
    The uncomfortable truth for any Xiaohongshu bull case is that creators and merchants can multi-home very easily.
    Content that works on Xiaohongshu can seed interest and then redirect users to Taobao, JD, Douyin, or private-domain
    channels. Rest of World's RedShop and overseas-expansion reporting reinforces the same point: Xiaohongshu is trying to
    close more of the loop, but it still often operates as the most trusted touchpoint in a broader multi-platform purchase
    journey. That weakens transaction lock-in even when the company owns disproportionate influence on the consideration
    phase.

    The moat therefore lives earlier in the funnel. Xiaohongshu is unusually effective when shoppers want a trusted voice,
    aesthetic coherence, or a high-signal review rather than a pure price comparison. The brand guidelines and business
    community rules reinforce this: the company is trying to preserve the authenticity that makes its recommendation graph
    useful. That is a real moat—but only if the platform can keep fake engagement, ghostwritten marketing, and AI-managed
    spam from flattening the trust signal into just another commodity distribution feed. In other words, the moat is
    community quality plus search-like utility, not logistics or payments depth.
  claimRefs:
  - CP007
  - CP020
  - CP021
  - CP027
  - CP028
  - CP029
  - CP030
  - CP032
  - CP033
