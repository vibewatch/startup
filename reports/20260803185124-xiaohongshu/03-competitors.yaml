  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: creator-multi-homing
    missingEvidence: Creator retention, cross-posting rates, and payout concentration by platform for top Xiaohongshu creators.
    whyItMatters: Without retention and cross-post data, moat durability versus Douyin, Taobao Live, and off-platform channels remains partially inferential.
    diligencePath: Request creator cohort data, creator payouts, and cross-platform posting overlap from management or major MCN partners.
  - type: private-evidence-only
    severity: material
    topic: merchant-economics
    missingEvidence: A clean comparison of merchant CAC, conversion, take rates, and attributable sales across Xiaohongshu, Douyin, Taobao, and Kuaishou.
    whyItMatters: Competitive advantage is easier to assert than to underwrite without hard merchant economics.
    diligencePath: Ask for anonymized merchant case studies comparing media spend and attributed sales across the main platforms.
  - type: missing-source
    severity: minor
    topic: JD-and-Bilibili-scale
    missingEvidence: Cleaner, directly comparable public operating metrics for JD and Bilibili as social-commerce substitutes rather than general internet companies.
    whyItMatters: The competitive map is strongest for Kuaishou and Tmall but thinner for some adjacent substitutes.
    diligencePath: Pull the latest JD and Bilibili investor decks with commerce or engagement breakdowns before the next refresh.
