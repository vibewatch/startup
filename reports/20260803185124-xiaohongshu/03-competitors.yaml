- id: scale-and-capabilities
  title: Competitor scale and capability comparison
  body: |-
    The scale gap is real. Kuaishou disclosed 724.6 million MAUs and RMB1.598 trillion of e-commerce GMV in 2025, while
    Alibaba said Tmall had one billion annual active consumers and more than 4,100 brands above RMB100 million of annual
    sales in 2024. Taobao Live is not sitting still either: 36Kr reported a planned RMB11 billion 2025 investment push to
    accelerate growth, and SCMP showed that celebrity-led commerce on Taobao and Douyin was already producing billion-yuan
    moments years ago. Those platforms are not just peers; they are enormous distribution and checkout machines.

    Xiaohongshu answers that scale disadvantage with a narrower but more differentiated capability set. Its best commerce
    content is soft-sell, search-led, and integrated into lifestyle notes rather than pure conversion theatre. Merchant
    signals are meaningful—the official merchant update said 2023 saw 500% growth in merchants above RMB100 million of
    transaction volume—but the company is still building merchant depth from a smaller base than the incumbent giants. That
    suggests a critical distinction for investors: Xiaohongshu is not the biggest platform in the set, but it may still be
    the most valuable discovery surface for certain categories, especially beauty, fashion, and lifestyle brands that need
    trust before checkout.
  claimRefs:
