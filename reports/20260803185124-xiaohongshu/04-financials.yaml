- id: traction-and-unit-economics
  title: Public traction, conversion evidence, and unit-economics proxies
  body: |-
    Public traction is strong enough to support a bullish top line but not precise enough to lock down unit economics. TechNode and 36Kr show merchant growth accelerating in 2023 and 2024, while Sacra and Rest of World point to a platform large enough to support multi-billion-dollar revenue and profit. The most revealing operating detail is not a disclosed take rate; it is the company's obsession with attribution. TechNode reported that Xiaohongshu cared more about daily purchasing users than GMV, and 36Kr described the 2025 commercialization push as a campaign to prove post-note business results rather than just impressions, clicks, and CPM. That is a sign the company knows its bottleneck is not reach but merchant confidence in measurable conversion.

    The unit-economics problem is that too many bridges remain private. We have evidence for merchant growth, campaign measurement products, off-platform conversion partnerships, and specific Double 11 sales outcomes, but not a public bridge from traffic to GMV to realized take rate to gross profit. The result is a chapter where revenue quality looks better than before, yet still resists a clean SaaS-style or marketplace-style model. The best public interpretation is that Xiaohongshu has high-value intent, improving merchant ROI proof, and lower direct transaction capture than the largest incumbents.
