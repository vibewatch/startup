    - Request funnel data from note view to cart to checkout across internal and partner destinations.
  - - Take rate / gross margin
    - Not publicly disclosed
    - Low
    - Core driver of valuation quality
    - Request gross profit by stream and take-rate bridge for internal / external commerce.
