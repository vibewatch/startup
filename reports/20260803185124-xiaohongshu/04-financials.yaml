- id: TI002
  title: Pricing / monetization table
  columns:
  - Price / monetization element
  - Public evidence
  - List vs realized
  - Unknowns
  - Implication
  rows:
  - - Brand ad spend / commercialization budgets
    - 36Kr and Sacra both frame advertising as the core monetization engine
    - Realized economics unknown
    - No public CPM, CPC, or effective-take disclosure
    - Revenue quality depends on whether intent lets XHS defend premium pricing.
  - - Merchant tool usage (Lingxi / Chengfeng)
    - Publicly described as key measurement and conversion tools
    - Appears closer to realized operating tooling than published list pricing
    - No seat, usage, or success-fee schedule disclosed
    - Could support software-like margins if merchants retain.
  - - On-platform commissions
    - Commerce clearly monetizes transactions, but commission schedules are not public
    - Realized only; no public list card found
    - Take rate and category variance unknown
    - Hard to separate media margins from marketplace margins.
  - - External-link attribution / alliance plans
    - Partnerships with Taobao, JD, and Vipshop suggest performance-linked monetization
    - Likely negotiated, not list-priced
    - Revenue share or cost-per-outcome mechanics are undisclosed
    - Could materially improve merchant ROI proof without forcing full in-app checkout.
  notes: Public pricing evidence is descriptive rather than contractual; no formal Xiaohongshu rate card was found in the reviewed materials.
