- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public status
  - Interpretation
  - Risk
  - Diligence ask
  rows:
  - - Cash on hand
    - Not publicly disclosed
    - Cannot directly underwrite runway
    - High visibility gap
    - Request latest cash, restricted cash, and short-term investments.
  - - Burn / runway
    - Not publicly disclosed
    - Profit narrative implies lower survival risk, but not enough to quantify runway
    - High visibility gap
    - Request monthly burn / cash generation by major business line.
  - - Historical capital raised
    - ~$900M to $917.5M across public trackers
    - Late-stage business is well funded historically
    - Medium
    - Request full round chronology and primary/secondary split since 2024.
  - - Next-round trigger
    - Potential Hong Kong IPO rather than obvious private rescue
    - Suggests capital is optionality / liquidity driven, not emergency driven
    - Medium
    - Request IPO use-of-proceeds plan and contingency if listing is delayed.
  - - Debt / project finance obligations
    - No meaningful public debt or project-finance burden found in reviewed sources
    - Model appears lighter than asset-heavy commerce or lending balance-sheet businesses
    - Medium-low
    - Request debt schedule, guarantees, and lease / cloud commitments.
  notes: The company overview funding chronology exists elsewhere; this table focuses on forward adequacy and what cannot be seen publicly.
