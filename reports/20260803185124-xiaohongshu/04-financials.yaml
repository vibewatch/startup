tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current public status
  - Quality
  - Diligence ask
  rows:
  - - Advertising / commercialization
    - Brands buy intent-rich placement, brand collaborations, and campaign products
    - Budget / campaign spend
    - Still appears to be the dominant revenue stream; one 2025 report puts ads at 76% of revenue
    - High-quality but vulnerable to trust erosion
    - Request cohort pricing, top-category mix, and renewal behavior by advertiser type.
  - - On-platform e-commerce
    - Merchants sell inside Xiaohongshu through stores, live commerce, and internal checkout surfaces
    - GMV / commissions
    - Material but still smaller than top incumbents; exact take rate undisclosed
    - Medium
    - Request on-platform GMV, take rate, and contribution margin by category.
  - - Off-platform attribution / external-link commerce
    - Xiaohongshu proves or routes conversion to Taobao, JD, and other partners
    - Attributed sales / performance budget
    - Growing strategic importance in 2025 through external-link partnerships
    - Medium-high
    - Request attribution methodology, partner economics, and merchant retention by tool.
  - - Merchant tooling / measurement
    - Lingxi, Chengfeng, and related products help brands measure, optimize, and coordinate campaigns
    - Software-like product or bundled service
    - Publicly visible and expanding, but pricing not disclosed
    - Potentially high quality
    - Request list pricing, attach rate, and margins for merchant tools.
  - - Strategic partnerships / brand programs
    - Partner campaigns, creator programs, and ecosystem services tied to brand growth
    - Project / platform fee
    - Mentioned in third-party breakdowns, but not separately disclosed
    - Low visibility
    - Request revenue split and concentration for partnership-led income.
  notes: Current public status reflects accessible public reporting, not audited stream-level company disclosure.
