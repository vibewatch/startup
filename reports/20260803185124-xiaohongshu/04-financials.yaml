- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Audited FY2024-FY2025 financial statements
    - Cannot verify revenue recognition, margin, or profit quality
    - Request audited statements plus management discussion pack.
  - - On-platform vs off-platform commerce split
    - Blurs whether Xiaohongshu captures checkout value or only influence value
    - Request attributable GMV and revenue by destination and campaign type.
  - - Cash balance and treasury policy
    - Prevents direct runway or downside-capital analysis
    - Request latest balance sheet and treasury concentration.
  - - Take-rate and contribution-margin bridge
    - Blocks clean marketplace-style valuation work
    - Request stream-level gross profit and fee mechanics.
  - - Advertiser retention, concentration, and category mix
    - Unclear whether ad growth is broad-based or category concentrated
    - Request top-20 advertiser concentration and cohort renewal tables.
  notes: These are the missing public metrics that most directly block a clean underwriting model, not an exhaustive diligence list.
