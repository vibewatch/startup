company:
  name: Xiaohongshu
chapter:
  number: 1
  title: Company Overview
  summary: |-
    Xiaohongshu is a Shanghai-founded social-commerce platform that turned lifestyle discovery into a scaled
    consumer-internet business: official materials frame it as a content-plus-commerce destination, while third-party
    reporting points to 300M+ monthly active users, first full-year profitability in 2023, and a valuation climb from
    about $17B in 2024 funding to about $31B in 2025 secondary trading. The company remains founder-led and
    strategically important inside China’s beauty, fashion, travel, and search-led consumer decision stack, but public
    governance disclosure is still thin and regulators have already forced rectification on content-management issues.
sections:
- id: identity-model
  title: Identity, product scope, and operating footprint
  body: |-
    Xiaohongshu began in Shanghai in 2013 as a shopping-guide product and matured into an app-centric lifestyle
    platform where users publish short “notes” that blend photos, text, video, and livestreams. Official copy does
    not describe the company as a pure e-commerce marketplace; instead it emphasizes discovery, authenticity, and
    community. That framing matters because Xiaohongshu’s economic role in the Chinese consumer internet sits a
    step upstream from purchase: users search for recommendations, compare products, and absorb creator-led social
    proof before converting either on Xiaohongshu itself or on external commerce platforms. The platform’s topic
    coverage spans beauty, fashion, food, travel, entertainment, fitness, and childcare, which makes it unusually
    close to the consumer decision moment across a wide set of everyday spending categories.

    The company page and app-store surfaces also clarify the legal and geographic footprint better than many private
    Chinese internet companies. Official materials identify Xingyin Information Technology (Shanghai) Co., Ltd. as the
    operator/developer, list Shanghai as the headquarters, and reference additional presences in Wuhan and Beijing.
    The product has become more outward-facing since the 2025 “RedNote” moment: Google Play and the iOS listing now
    present an international brand, multiple language options, and community-language about a “global village.” That
    branding shift is directionally important, but the core operating truth remains domestic concentration: third-party
    usage reporting still shows the user base heavily centered in mainland China even after overseas attention spiked.
  claimRefs:
