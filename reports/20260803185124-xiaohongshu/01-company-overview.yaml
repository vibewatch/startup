- id: scale-milestones-adverse
  title: Scale milestones, monetization improvements, and adverse signals
  body: |-
    The strongest operating milestone is not just user scale but the shape of monetization around that scale. Third-party
    sources reviewed here describe over 300M monthly active users, first full-year profitability in 2023, a revenue step
    from roughly $3.7B in 2023 to an estimated $4.8B in 2024, and shareholder guidance for about $3B of 2025 profit.
    Just as important, several 2025 writeups say Xiaohongshu became more pragmatic about conversion: rather than force all
    commerce on-platform, it added tools and external-link partnerships that made off-platform conversion more measurable
    for merchants. That makes the company more relevant to ad budgets even when checkout happens elsewhere.

    The adverse record is meaningful and should stay attached to the core narrative. TechNode’s earlier critique argued
    that Xiaohongshu historically educated demand that was later captured by Taobao, JD, or other platforms. Regulators
    have also shown willingness to intervene. In September 2025, the CAC-directed Shanghai regulator warned the platform,
    ordered rectification, and cited failures in content-management responsibility. In 2026, Xiaohongshu also intensified
    its own cleanup of AI-managed and covertly promotional accounts. The January 2025 RedNote surge in the United States
    proved the product could travel culturally, but Rest of World’s reporting suggests the overseas wave was noisy and not
    fully localized. Net: the company has crossed the threshold from influential app to profitable platform, but it still
    carries monetization, governance, and content-trust tensions that matter for any IPO-quality diligence.
