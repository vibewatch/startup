  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: A current board roster, committee structure, and independent-director disclosure for Xiaohongshu.
    whyItMatters: IPO readiness and governance risk cannot be fully underwritten without knowing who actually exercises board oversight.
    diligencePath: Request the latest board deck or pre-IPO governance materials directly from management or lead investors.
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: A current official headcount disclosure rather than third-party database estimates or stale office-page numbers.
    whyItMatters: Hiring scale affects operating leverage, international readiness, and diligence on burn-rate assumptions.
    diligencePath: Ask management for current full-time employee count by location and cross-check with payroll or social-insurance filings.
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Audited or management-certified revenue mix splitting advertising, transaction services, and other monetization streams.
    whyItMatters: Valuation quality depends on whether high-margin ad revenue or lower-margin commerce revenues dominate the income statement.
