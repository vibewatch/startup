      - number: '2.3'
        title: 买家、商家和创作者分层决定采用路径
        blocks:
          - type: paragraph
            body: >-
              核心消费者仍然年轻、城市化，且女性占比偏高。KrASIA 描述的平台月活超过 300M，约 70% 用户为女性，并高度集中在 1995
              年后出生人群。这个画像很关键，因为它正好对应社交电商研究里最强的品类：美妆、个护、时尚和视觉表达强的生活方式商品。因此，Xiaohongshu
              更像一个品味与信任引擎，而不是大众目录。用户浏览笔记、搜索品类建议、比较品牌，然后在生态内购买，或跳转到更强的交易场所。商家端也呈现同样形态：精选品牌、挑战者品牌、有审美或专业表达的主播，比低差异化标品卖家更适配。

              创作者是造市层。TechNode 和 Rest of World 都显示，Xiaohongshu 的变现依赖软性种草、直播演示和创作者—品牌匹配，而不是硬折扣闪卖。Dandelion program
              和不断提高的商家门槛说明生态在更商业化，但方式仍奖励信任和品味形成。这对需要教育市场的品牌是真实的采用优势；但也制造了瓶颈：如果平台广告味过重，它会削弱最初让发现层有价值的真实感信号。
