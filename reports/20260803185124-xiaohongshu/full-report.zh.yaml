  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、结构迁移和变现机制
        blocks:
          - type: paragraph
            body: >-
              比起两年前，Xiaohongshu 的收入模型现在更容易描述。公司仍主要靠向品牌售卖注意力和意图变现，但公开记录显示，它已经从泛化的「种草」营销，明显转向可归因电商和商家经营工具。Sacra 的 2024
              年估算意味着，这门生意大到足以进入公开市场尺度；36Kr 的 2025 年报道则认为，即便交易相关产品变得更重要，广告仍是核心收入底座。关键分析点在于，Xiaohongshu
              不必拥有每一笔结账，也能变现购买旅程。它从广告预算、站内电商流以及越来越多帮助商家衡量笔记或活动是否带动 Taobao、JD 或其他平台销售的工具中赚钱。

              因此，结构问题比收入总数更重要。2025 年初的资料仍把业务描绘成约 60% 广告、30% 电商；但 2025
              年稍后的报道又说，随着公司开放更多行业和测量工具，广告收入变得更加主导。这些观点未必矛盾；它们指向的是一个广告引擎成熟快于闭环结账的平台。对投资者来说，Xiaohongshu 不能按经典市场，也不能按纯媒体
              App 来建模。它是一个推荐与归因界面，在漏斗多个位置变现意图。
