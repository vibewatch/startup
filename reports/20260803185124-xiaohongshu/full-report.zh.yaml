      - number: '1.2'
        title: 创始人、领导连续性和治理透明度
        blocks:
          - type: paragraph
            body: >-
              公开记录显示，对一家已经讨论 IPO 准备度的公司来说，Xiaohongshu 的创始人连续性异常强。Miranda Qu Fang 和 Charlwin Mao Wenchao
              仍是外界最稳定地与公司起源、产品身份和战略方向联系在一起的名字。这种连续性降低了后续尽调章节里「谁真正做出了这家公司？」的不确定性：从成立至今，公司在文化或战略上没有明显换手。但它也抬高了关键人物集中度。外界仍通过创始人判断来理解
              Xiaohongshu 如何平衡社区质量和变现强度，而这个取舍定义了业务的上行空间，也定义了反复出现的批评。

              治理披露明显薄于平台规模。为本次研究审阅的公司公开材料、PitchBook 预览和 Tracxn
              材料，没有给出清晰的现任董事会名单、独立董事名单或委员会结构。这个缺口不等于治理质量差，但意味着后期投资者需要在缺乏公开公司级董事会实际制衡权可见度的情况下，为 IPO
              路径下注。因此，同一段尽调会得出两种相反读法：创始人连续性是真实资产，因为产品和社区判断长期一致；但董事会披露不清，也正好在公司试图把自己包装成更成熟、更可治理的盈利机器时，抬高了尽调摩擦。
