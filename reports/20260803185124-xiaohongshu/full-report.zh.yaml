      - number: '3.3'
        title: 切换成本、多平台经营和护城河真正所在
        blocks:
          - type: paragraph
            body: >-
              对任何看多 Xiaohongshu 的论点来说，最不舒服的事实是创作者和商家都很容易多平台经营。在 Xiaohongshu 上有效的内容可以先种下兴趣，再把用户导向 Taobao、JD、Douyin
              或私域渠道。Rest of World 关于 RedShop 和海外扩张的报道也强化了同一点：Xiaohongshu
              正试图闭合更多交易环节，但它仍常常只是更广泛多平台购买旅程中最受信任的触点。即使公司在考虑阶段拥有不成比例的影响力，这也会削弱交易锁定。

              因此，护城河在漏斗更早的位置。购物者想要可信声音、审美一致性或高信号评论，而不是单纯比价时，Xiaohongshu
              异常有效。品牌指南和商业社区规则也在强化这一点：公司试图守住让推荐图谱有用的真实感。这是真实护城河——但前提是平台能防止虚假互动、代写营销和 AI
              托管垃圾内容，把信任信号压扁成又一个商品化分发流。换句话说，护城河是社区质量叠加类搜索效用，而不是物流或支付深度。
