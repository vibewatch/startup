      - number: '2.2'
        title: 规模测算视角：自上而下数字很大，可变现楔子更小
        blocks:
          - type: paragraph
            body: >-
              自上而下的市场数字方向上诱人，但方法上混杂。Research and Markets 给出一个非常宽的中国社交电商预测：2026 年约 US$4.22T。这个数字可作为品类天花板，却远不能等同于
              Xiaohongshu 的直接机会。Grand View 和 Fortune Business Insights 同样展示了庞大的全球和亚太社交电商扩张曲线，APAC 主导全球收入，2026-2033 年
              CAGR 估算在 30% 高段左右。这些数字告诉我们，形式足够大，仍在复合增长；但没有告诉我们，一个发现驱动平台到底能捕获多少价值。

              更窄的视角来自直播电商和 Xiaohongshu 自身的商家证据。Grand View 的中国直播电商展望把 2024 年市场规模定在约 US$41B，同样以约 37% CAGR 增长到 2033
              年。相比全品类社交电商 GMV，这已经更接近一组可变现活动。不过，Xiaohongshu 并不是 Douyin 或 Taobao Live 的完整直播电商克隆。公司的最佳匹配
              SAM，可能是高决策强度、创作者介导的美妆、时尚和生活方式支出子集；在这些场景里，品牌教育发生在结账之前。在这个更窄的楔子里，Xiaohongshu 可以非常重要，不必拥有中国线上零售的主导份额。
