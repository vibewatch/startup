      - number: '6.2'
        title: 增长、采用爆发和公开规模信号真正说明什么
        blocks:
          - type: paragraph
            body: >-
              公开规模信号说明 Xiaohongshu 已经有触达，真正的问题是触达会在哪里加深。营销和统计页面引用约 300M 用户基础；Sacra 的数据集则显示，平台到 2024 年末 MAU 已超过
              350M。最显眼的增长时刻出现在 2025 年 1 月，美国 TikTok 不确定性在数天内把数十万新用户推向这个 App，并把 Xiaohongshu 推到美国应用商店榜首。Rest of World
              显示，这个现象不只发生在美国：同一窗口期，App 在多个非西方国家进入榜单前三。采用爆发很重要，因为它揭示了 Xiaohongshu 产品形态在原有基盘之外的潜在需求。

              但采用爆发不等于持久互动。公开来源给出了榜单排名、下载激增、评论和商家增长数据，却没有干净的管理层队列数据。因此，客户广度可见，客户深度仍部分隐藏。稳妥读法是，Xiaohongshu
              已经解决了知名度和应用商店可发现性；下一阶段增长更取决于重复使用、国际内容密度、商家信任和更好的生态健康证明，而不是证明这个 App 能被看见。
