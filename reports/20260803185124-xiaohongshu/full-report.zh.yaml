      - - CAC 或其他监管动作再次升级
        - 2025 年处罚事件之外又出现新的公开执法
        - 长期风险折价上升
        - 无论私募价还是 IPO 价，都要求更大折价
      - - 香港上市因实质原因而非例行流程推迟
        - 时间表反复滑坡或监管审核卡住
        - 稀缺性溢价和动量逻辑走弱
        - 把火热的二级市场标价视为不可靠
      - - 披露未明显改善，IPO 或二级市场定价却接近 $50B
        - 发行文件和簿记建档无法支撑溢价
        - 入场账变成叙事驱动
        - 不要追价；等上市后价格发现或更好条款
      - - 商家和客户变现证据比叙事暗示更薄
        - 分群、GMV 归因或商家支出数据不及预期
        - 相对 Pinterest/Bilibili 的溢价、以及对 Kuaishou 平价的论据走弱
        - 把估值移向低端锚点
    notes: 这些触发条件重要，是因为 Xiaohongshu 最大的估值风险在于：用上市公司价格，为非上市公司的披露质量买单。
    claimRefs:
      - CV012
      - CV014
      - CV015
      - CV025
      - CV029
      - CV030
      - CV032
      - CV038
      - CV039
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 经审计财务报表
        - 收入、利润率、现金流和利润按上市公司标准审计
        - 盈利质量一旦明确，大部分估值分歧都会收敛
        - 索取招股书或 IPO 前审计材料包
      - - 股权结构和优先权栈
        - 清算优先权、员工期权池，以及二级市场持有人带来的悬压
        - 私募估值标价不等于所有投资者手中普通股的价值
        - 索取完整股权结构表和优先权瀑布
      - - 商家集中度和变现质量
        - 头部商家、抽佣率和复投支出分群
        - 溢价估值取决于变现能否持久且分散
        - 索取商家分群看板
      - - 监管整改状态
        - 2025 年 CAC 处罚后发生了什么改变
        - 没有整改证据，风险折价很难算清
        - 索取监管跟进材料和合规备忘录
      - - IPO 条款
        - 发行规模、募资用途、基石需求和估值区间
        - 只有价格和条款对得上，叙事才可投资
        - 等待招股书 / 条款清单
    notes: 这些尽调问题按其改变估值区间或建议的直接程度排序。
    claimRefs:
      - CV024
      - CV025
      - CV032
      - CV036
      - CV039
      - CV040
