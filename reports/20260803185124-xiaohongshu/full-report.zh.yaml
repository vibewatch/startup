  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同行、既有巨头、相邻产品和替代品
        blocks:
          - type: paragraph
            body: >-
              Xiaohongshu 不是在和一个对手竞争，而是在和多层结构竞争。最接近的直接平台同行是 Douyin、Taobao/Tmall 和
              Kuaishou，因为它们都把注意力、创作者或商家工具、嵌入式电商结合在一起。JD 更像交易和信任替代品，而不是内容孪生体；Lemon8 和类似 Instagram 的产品则是形式相邻项，即便它们还没有
              Xiaohongshu 在中国的电商密度，也能吸收注意力。搜索、评论、私域渠道和线下口碑，才是真正的既有替代方案，因为用户常常在还不知道买什么之前就来到 Xiaohongshu。

              这种分层格局解释了为什么「中国 Instagram」的简单类比并不完整。当品味、真实感和研究很重要时，Xiaohongshu 赢；当物流、大规模分发或激进直播转化更重要时，既有巨头赢。Caplight
              和投资者评论已经把公司拿来与 ByteDance 和 Alibaba 系谱对标，这说明市场现在把 Xiaohongshu
              视为平台级竞争者。但平台级竞争者不等于在每项功能上都是平台领导者。直接竞争者在结账和规模上最强；Xiaohongshu 在推荐质量和高意图发现上最强。
