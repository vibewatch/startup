      - number: '6.3'
        title: 客户证明质量、商家深度和重复使用代理指标
        blocks:
          - type: paragraph
            body: >-
              因为 Xiaohongshu 是消费网络，客户证明更多来自生态，而不是合同。最能站住脚的具名证明来自平台官方商业生态材料：它引用来自 200 多个国家和地区的 130,000 个品牌，并纳入 Nestle
              Coffee China、Li Ning 等商家和品牌对商业指南框架的背书。TechNode 和 36Kr 随后补充证据，说明商家深度不是装饰性的：高价值商家和 SMEs
              正在平台上快速扩张，电商工具也越来越围绕可衡量经营结果设计。这很有意义，因为它说明商家客户不只是把 Xiaohongshu 当作曝光测试场，而是在尝试更系统地运营。

              重复使用代理指标也异常受意图驱动。36Kr 报道引用了 70%
              月度搜索渗透率；应用商店评论和入门指南则突出收藏、评论、搜索和个人资料优化，都是用户回访方式的一部分。即便如此，客户章节不能声称正式留存表现卓越。我们没有队列留存、GRR / NRR
              类比指标，也没有按地域拆分的干净使用分层。最好的公开结论是：Xiaohongshu 具备高质量重复使用机制，但披露数据还不足以把它转换成精确留存模型。
