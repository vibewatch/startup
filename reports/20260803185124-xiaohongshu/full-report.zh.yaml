  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：发现驱动的社交电商，而不是整个中国电商
        blocks:
          - type: paragraph
            body: >-
              第一步分析，是不要把 Xiaohongshu 说成「整个电商」的参与者。平台属于社交电商，但更准确地说，处在发现驱动、内容驱动、生活方式购买意图层。官方材料强调真实社区内容叠加电商；TechNode
              早年的平台画像说得更进一步，认为 Xiaohongshu 更像产品搜索引擎和口碑孵化器，而不是经典交易市场。这个框定会改变它的功能替代品。按功能看，Xiaohongshu
              竞争的是搜索、评论、创作者推荐和品类教育。按规模看，它面对的是 Douyin、Taobao/Tmall、JD 和 Kuaishou，这些平台拥有更深的结账基础设施和更广的商家深度。

              因此，纳入范围的支出，是消费者商业里由社交背书、审美、真实感和购前研究影响决策的部分。美妆、个护、服饰、家居、美食发现和旅行规划尤其相关，因为这些品类受益于教程、前后对比图、主观评价和创作者带动的品味形成。不在范围内或只部分在范围内的支出，包括大宗标品补货、工业采购、低决策强度批量购买，以及价格和物流压过品牌叙事的品类。这些品类仍是替代项，因为
              Xiaohongshu 常把流量送给在别处完成交易的商家；但不应把它们当作公司的主要自有市场。
