      - number: '6.4'
        title: 扩张约束、集中度风险和客户结论
        blocks:
          - type: paragraph
            body: >-
              客户结论是正面的，但集中度和披露限制很明显。Xiaohongshu
              已证明自己能吸引大规模受众、品牌和跨境好奇心，但几类风险可能限制客户价值捕获。国际扩张仍不均衡，因为英语内容密度相对低，主流美国采用仍不确定，同一 App
              架构又增加了跨地区审核和隐私复杂度。台湾相关政策摩擦和一般性跨境审查也提醒我们，分发可及性可能因为与产品质量无关的原因改变。商家端集中度同样难以评估，因为公开记录没有披露头部广告主或头部商家依赖度。

              做投资判断时，关键是区分客户兴趣和持久客户经济性。Xiaohongshu
              显然拥有前者，后者则没那么透明。平台最强的位置，是高意图消费研究和品牌教育重要的地方——美妆、时尚、生活方式、旅行，以及其他高决策强度品类。这足以支持一个正面的客户质量判断，但不足以消除对队列、集中度、已变现活动和海外互动持久性的私有尽调需求。
