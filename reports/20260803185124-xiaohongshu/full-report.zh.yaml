      - number: '8.3'
        title: 情景区间显示，中高 $10B 至低 $20B 区间最容易自洽；$30B 以上需要证据
        blocks:
          - type: paragraph
            body: |2-
                              今天看 Xiaohongshu，正确框架不是单点估值，而是情景区间。基准情景落在中高 $10B 至低 $20B 区间：足以反映意图浓度高的流量、广泛商家参与和一定稀缺价值，但相对 Kuaishou 的公开市值和缺失的披露栈，仍保持纪律。牛市情景从低 $30B 区间起；若审计披露确认利润故事、香港上市需求强劲，且投资人认为 Xiaohongshu 因融合发现、广告和商业入口而值得溢价，可到中 $30B 区间。若公开市场施加更强的监管和不透明折价，熊市情景就在低 $10B 区间。

                              这个框架直接导向入场纪律。新投资人不必否认 Xiaohongshu 的质地，也可以拒绝噪音很大的 $31B-$50B 标记。投资人可以要求更好的价格，或者更扎实的文件包。这一点尤其重要，因为二级市场估值可能跑得比业务透明度更快。在招股书出现前追高，可能把一家好公司变成一个差入场。
                              
