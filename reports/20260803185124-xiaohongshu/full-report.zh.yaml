      - number: '3.2'
        title: 竞争者规模和能力对比
        blocks:
          - type: paragraph
            body: >-
              规模差距真实存在。Kuaishou 披露 2025 年 MAU 为 724.6M，电商 GMV 为 RMB1.598T；Alibaba 称 Tmall 2024 年有 1B 年活跃消费者，年销售额超过
              RMB100M 的品牌超过 4,100 个。Taobao Live 也没有停步：36Kr 报道其计划在 2025 年投入 RMB11B 加速增长，SCMP 则显示，几年前 Taobao 和 Douyin
              上的明星带货已经能造出十亿元级时刻。这些平台不只是同行，而是巨大的分发和结账机器。

              Xiaohongshu 用更窄但更差异化的能力组合回应规模劣势。它最好的电商内容是软性种草、搜索驱动，并融入生活方式笔记，而不是纯转化剧场。商家信号有意义——官方商家更新称，2023 年交易额超过 RMB100
              million 的商家数量增长 500%——但公司仍在从小于既有巨头的基数上补商家深度。这给投资者一个关键区分：Xiaohongshu
              不是这一组里最大的平台，但对某些品类来说，它仍可能是最有价值的发现界面，尤其是需要结账前信任的美妆、时尚和生活方式品牌。
