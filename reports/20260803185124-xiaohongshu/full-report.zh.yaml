      - number: '2.4'
        title: 约束、矛盾数据和价值捕获上限
        blocks:
          - type: paragraph
            body: >-
              市场看起来很大，但公司并不拥有它所影响的全部价值。多方资料仍描述一种结构性模式：Xiaohongshu 塑造购买意图，Taobao、JD、Douyin 或其他商家捕获最终结账。因此，只用万亿美元级社交电商 GMV
              搭出的市场章节会误导投资判断。真正重要的不是中国消费者是否会继续社交化购物——他们几乎肯定会——而是 Xiaohongshu 能否从这种行为里捕获足够的广告、商家服务或交易经济性，以支撑后期估值预期。

              用户和扩张数据也存在相互矛盾的点。英文报道把 2024 年末 MAU 放在约 225M，而 KrASIA 引述 300M+ MAU；这些数字可能衡量的是不同界面或日期，但并不相同。RedNote
              爆发后，海外势头也很快降温：到 2025 年 3 月，美国 DAU 和非中国 DAU 都从 1 月高点回落。最后，整个品类的合规成本在上升。36Kr 对 2025 年直播电商的复盘和 CAC
              执法都意味着，平台规则、虚假流量、内容标注和售后治理会受到更严审查。结果是一个规模和动能都非同寻常的市场，但 Xiaohongshu 最有价值的位置——高意图发现——不会自动转化为占主导的已捕获 GMV。
