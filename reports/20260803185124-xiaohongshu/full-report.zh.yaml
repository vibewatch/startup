      - number: '7.2'
        title: 跨境增长让风险面扩张快于透明度改善
        blocks:
          - type: paragraph
            body: >-
              Xiaohongshu 的国际爆红创造了上行空间，也把一家曾可推迟处理部分风险的中国中心消费 App，推到了更广风险暴露之下。Google Play 和 Apple App Store
              显示，同一个产品正在全球分发，承载消息、用户生成内容、搜索历史和多语言界面。Rest of World 随后显示，管理层通过美国办公室和
              RedShop，把这种分发变成真实运营野心。战略上这很有进取性，但它在多个司法辖区扩大了审核、隐私、政策和雇佣合规足迹，却没有给投资者更多关于区域使用质量或法律准备度的公开报告。

              国际需求故事本身也混合。Rest of World 的报道暗示，最强海外用户群仍是海外华人和中文社区；最初 TikTok
              难民式流量高峰，并没有自动转化成持久的美国主流使用。这一点重要，因为管理层若把短期认知误判为已验证的海外市场匹配，跨境风险就最危险。再加上应用商店依赖、各国政策摩擦，以及在一个 App
              里审核多语言社区的需要，海外扩张就不再是免费的看涨期权，而是真正的风险清单项目。
