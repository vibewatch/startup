  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景：Xiaohongshu 有吸引力，但当前标记分歧很大
        blocks:
          - type: paragraph
            body: |2-
                              公开证据无法给出一个干净的 Xiaohongshu 估值，只能给出一组彼此竞争的参照点。最保守的可见锚点约 $17B，来自 Caplight、Premier Alts，以及 36Kr 所描述的 2024 年最后一轮正式融资等来源。之后是 TMTPost、36Kr 和其他二级市场报道给出的更强后期私募标记，约 $31B。最后还有二级出售叙事和 IPO 传闻报道中的更热参照，约 $50B。这个区间太宽，不能当作正常噪音。关键估值问题不仅是 Xiaohongshu 值多少钱，更是哪一种价格发现机制最值得信任。

                              部分分歧可以理解。Xiaohongshu 仍是私营公司，市场只能使用不完整输入：二级交易、组合估值、合格投资者市场，以及叙事很重的 IPO 报道。但如此宽的分歧应直接压低任何单一标记的可信度。公司也许应享受溢价，因为它把社交发现、商业意图和大型品牌生态结合在一起。即便如此，在招股书或公开市场订单簿这种更广、更重披露的场景验证前，不能把平台视为已经充分重定价。
                              
            claimRefs:
