      - number: '3.4'
        title: 最终判断：持久利基，还是阶段性形式优势？
        blocks:
          - type: paragraph
            body: >-
              最强的空头逻辑很简单：更大的既有巨头已经有更多用户、更多商家、更深结账能力，也有更多预算补贴增长。如果 Douyin、Taobao Live、Kuaishou，甚至国际相邻产品，能在保住分发优势的同时模仿
              Xiaohongshu 的笔记形式和创作者工具，Xiaohongshu 就可能变成一个有影响力但只能部分变现的发现层。海外地缘政治审查会放大这个风险；如果 RedNote 真正在西方形成规模，单一 App
              架构可能招来 TikTok 式问题。

              最强的多头逻辑是，不是所有注意力都一样。Xiaohongshu
              建立了一种质地不同的电商需求：用户来到这里是为了研究、比较和决定。纯硬卖直播间或通用目录搜索很难复制这种需求。官方品牌数据、商家增长信号和平台对真实感的坚持，都支持 Xiaohongshu
              拿住了消费者旅程中溢价最高的一段。最现实的竞争结论因此是混合的：Xiaohongshu 在购前发现和品味形成上有持久利基，但在结账捕获、国际规模和创作者锁定上，仍比头部既有平台更脆弱。
