  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与真实感风险已经发生，不是假设
        blocks:
          - type: paragraph
            body: >-
              对投资者来说，最重要的更新是 Xiaohongshu 已经处在活跃执法周期内。中国 CAC 在 2025 年 9
              月公开宣布对平台采取处罚措施；公告措辞很关键，因为它没有把问题说成温和提醒，而是提到约谈、责令整改、警告，以及严肃处理责任人。另一方面，中国的算法推荐和深度合成规则，为国家评判 Xiaohongshu
              这类平台上的搜索、排序、推荐、AI 标注和虚假互动行为，提供了现成框架。这些规则尤其相关，因为 Xiaohongshu 的互动和电商都依赖搜索、推荐、热榜和用户生成发现。

              Xiaohongshu 自己在 2026 年的行动，让监管风险更具体。TechNode、BigGo 和 AIbase 都描述了平台对 AI 托管账号和合成欺诈内容的强力清理；Xiaohongshu
              自身商业指南文章也把真实感和有序商业行为放在平台价值中心。这个组合意味着，管理层把真实感侵蚀视为战略风险，而不只是公关风险。对投资判断来说，含义很直接：Xiaohongshu
              也许能缓释这类风险，但不能忽视它。一个把自己定位成可信生活分享的平台，在 AI 垃圾、虚假评论、虚假人设或排名操纵扩张快过治理时，会在结构上变得更脆弱。
