      - number: '4.3'
        title: 成本结构、资本充足性和披露缺口
        blocks:
          - type: paragraph
            body: >-
              资本充足性的故事方向上不错，但仍不透明。分析师数据库和二级市场追踪指向约 $900M-$917.5M 的历史融资，以及潜在香港上市前已经很高的私募估值。如果 2025-2026
              年利润叙事方向正确，Xiaohongshu 已不再是一家明显需要外部资金才能活下去的公司。这一点重要：一家盈利且仍在增长的消费平台，可以把资本用于流动性、员工留存、生态下注或 IPO
              准备，而不是紧急跑道。问题是，公开投资者仍不知道实际现金余额、按业务线拆分的烧钱情况，也不知道海外扩张和电商基础设施是否比市场假设消耗更多资本。

              因此，成本结构更容易推断，难以证明。广告相对重库存电商应当具备结构性高利润率；内容审核、推荐基础设施、商家成功团队和信任安全运营，可能吸收很大一块运营成本。美国扩张还会叠加一层成本，因为 Rest of
              World 描述的市场需要大幅提高分发和广告投入，才可能真正形成影响。简言之，Xiaohongshu 今天大概率资本充足，但这一位置到底有多强，仍是整份报告里最大的未解尽调问题之一。
