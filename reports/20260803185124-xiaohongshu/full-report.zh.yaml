      - number: '1.4'
        title: 规模里程碑、变现改善和负面信号
        blocks:
          - type: paragraph
            body: >-
              最强的经营里程碑不只是用户规模，而是围绕这批用户的变现形态。本文审阅的第三方资料显示，公司月活超过 300M，2023 年首次实现全年盈利，收入从 2023 年约 $3.7B 跳升至 2024 年估算
              $4.8B，并向股东给出 2025 年约 $3B 利润指引。同样重要的是，多篇 2025 年文章称 Xiaohongshu
              在转化上变得更务实：它没有强迫所有交易都留在站内，而是增加工具和外链合作，让商家更能衡量站外转化。即便结账发生在别处，公司对广告预算也因此更有意义。

              负面记录同样重要，必须和核心叙事绑在一起。TechNode 早期批评指出，Xiaohongshu 历史上教育了需求，但后来由 Taobao、JD 或其他平台完成收割。监管者也已表现出干预意愿。2025 年 9
              月，在 CAC 指导下，上海监管部门约谈平台、责令整改并警告，理由是内容管理责任落实不到位。2026 年，Xiaohongshu 自身也加大清理 AI 托管账号和隐蔽推广账号的力度。2025 年 1 月
              RedNote 在美国的爆发证明产品可以跨文化传播，但 Rest of World 的报道显示，海外浪潮嘈杂且本地化并不充分。一句话：公司已经跨过从有影响力 App
              到盈利平台的门槛，但变现、治理和内容信任之间的张力仍会影响任何 IPO 级尽调。
