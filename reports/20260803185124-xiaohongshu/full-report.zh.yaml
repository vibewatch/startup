      - number: '8.2'
        title: 公开可比公司要求估值纪律，尤其是相对 Kuaishou
        blocks:
          - type: paragraph
            body: |2-
                              最有用的估值锚是 Kuaishou，不是因为两家公司一模一样，而是因为它是一家已有公开披露、规模化的中国内容与商业平台。Kuaishou 2026 年 8 月市值约 $24.84B，官方 2025 年业绩显示收入 RMB142.8B、利润 RMB18.6B。重要之处在于，它告诉投资人，在一个已经理解中国互联网风险的公开市场里，经审计的规模和盈利能力值多少钱。相比之下，Bilibili 和 Pinterest 的交易估值低得多，反映出更弱的商业转化杠杆或不同的平台经济性。Alibaba 太宽、太成熟，不能直接当可比公司，但它能提供一个有用上限：公开市场会给一家已披露的中国巨型平台资产多少价值。

                              这些比较本身不能证明 Xiaohongshu 便宜或昂贵。它们能证明，任何高于 Kuaishou 的标记都需要相当苛刻的叙事支撑：要么变现质量好过当前公开证据，要么 IPO 稀缺性溢价能在披露后继续存在。它们也凸显了披露缺口。Bilibili、Pinterest 和 Alibaba 都为公开投资者维护申报文件页面。Xiaohongshu 尚未提供同等公开可见度，投资人看不到审计财务、股权结构或募集资金用途。价格应反映这一点。
                              
