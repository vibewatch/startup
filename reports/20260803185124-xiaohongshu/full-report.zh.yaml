      - number: '4.4'
        title: 财务结论：质量改善，但投资判断仍不完整
        blocks:
          - type: paragraph
            body: >-
              财务结论是正面的，但带条件。Xiaohongshu 现在看起来像一个规模化、正在变现的消费平台，而不是文化上重要但商业上别扭的发现
              App。多方资料支持数十亿美元收入、盈利能力和更好的商家归因机制。这个组合足以引发严肃的公开市场式关注。它也意味着，公司可以拿到高于商品化内容平台的估值倍数，因为商家似乎是在为靠近购买决策的影响力付费，而不只是为流量付费。

              但这不是一次干净的投资判断。公开档案缺少审计财务报表、按收入流拆分的利润率、当前现金、烧钱情况、抽佣率桥梁，以及管理层认证的站内 /
              站外电商捕获拆分。正确结论不是「回避」，而是「不要假装模型比实际更干净」。Xiaohongshu 的财务画像越来越可投，但投资逻辑仍取决于私有尽调材料能否证明广告定价、交易归因和资本效率的持久性。
