      - number: '5.4'
        title: 信任、安全、隐私和合规控制
        blocks:
          - type: paragraph
            body: >-
              信任控制处在产品核心，因为 Xiaohongshu 变现的是真实感。官方商业指南、应用商店隐私披露、监管行动和 2026 年规则梳理，都指向同一个结论：公司把虚假人设、未声明 AI
              内容、敌意互动和误导性营销视为产品本身的威胁。Google Play
              的数据安全披露提供了一些用户可见的隐私信号，比如传输加密和删除请求路径；官方及第三方规则文件则显示，平台在标注、身份和高风险行业控制上更严格。取舍很明显：更丰富的真实感机制可以提升用户信任，但也会增加入驻摩擦、审核成本，以及误伤真实用户的风险。

              负面证据在这里很重要。公开用户评论提到原因不明的限制和侵入式补救；CAC 2025 年整改行动说明，当平台生态质量下滑时，监管者愿意直接介入。因此，2026 年打击 AI
              托管账号并不是支线故事，而是运营要求。Xiaohongshu 的产品强度取决于能否把推荐质量和社区信任维持在足够高的水平，让品牌仍相信内容有说服力，而不是合成垃圾。
