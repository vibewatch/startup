chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品边界和运营足迹
        blocks:
          - type: paragraph
            body: >-
              Xiaohongshu 2013 年在上海起步，最初是购物指南产品，后来成长为以 App
              为中心的生活方式平台。用户发布短篇「笔记」，把图片、文字、视频和直播放在一起。官方文案没有把公司定义为纯电商市场，而是强调发现、真实感和社区。这一点很关键：在中国消费互联网里，Xiaohongshu
              的经济位置比购买早一步。用户先搜索推荐、比较产品、吸收创作者带来的社交背书，再在 Xiaohongshu
              自身或外部电商平台转化。平台覆盖美妆、时尚、美食、旅行、娱乐、健身、育儿等主题，因此在一系列日常消费品类里离消费者决策时点异常近。

              公司页面和应用商店信息，也比很多中国私营互联网公司更清楚地交代了法律和地理足迹。官方材料列明 Xingyin Information Technology (Shanghai) Co., Ltd. 为运营方 /
              开发者，以上海为总部，并提到武汉、北京等布局。2025 年「RedNote」时刻之后，产品更面向海外：Google Play 和 iOS
              列表开始展示国际品牌、多语言选项，以及围绕「全球村」的社区表达。品牌转向有方向性意义，但核心经营事实仍是国内集中：即便海外关注度飙升，第三方使用数据仍显示用户基础高度集中在中国内地。
