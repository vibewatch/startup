      - number: '7.4'
        title: 披露、监测与执行仍是投资人最难定价的风险
        blocks:
          - type: paragraph
            body: |2-
                              最后一类风险是不透明。Xiaohongshu 的体量已经让合规、审核和增长质量问题具备实质财务后果，但公开记录仍像一块私营公司拼图，由官方帖子、新闻报道和市场数据档案拼成。Caplight、Tracxn 和 Sacra 可以帮助框定规模或估值，却不能替代头部商家集中度、区域客群、合规支出、欺诈损失，以及在这种规模上维持内容真实性成本的审计披露。即使是基础的外部监测，也弱于投资人期待：部分官方法律页面难以访问，公开第三方流量验证也零散。

                              因此，最有用的公开风险结论不是 Xiaohongshu 不可投，而是投资人应把硬性监测条件绑进投资假设。若出现新的 CAC 执法，若海外增长继续缺乏区域透明度，若商家增长跑过控制系统，或者即便新规出台、假内容清理仍继续上升，基准情景就会明显削弱。Xiaohongshu 最终也许能证明自己管得住这些取舍。当前公开记录还没有证明它已经做到了。
                              
