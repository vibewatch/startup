      - number: '8.4'
        title: 最终建议：继续观察，等待招股书级证据，并严守价格
        blocks:
          - type: paragraph
            body: |2-
                              最终建议是继续观察。Xiaohongshu 战略质地足够，应放进主动跟踪的投资观察名单：用户意图看起来异常商业化，商家证据真实存在；如果香港申报落地，公司也有可信路径吸引公开市场兴趣。但估值和证据目前不同步。公开故事里有一个真实的 $15B 左右锚点、一个可信的低 $30B 叙事，以及 2025 年底更泡沫化、已经计入大量未来执行的标记。没有正式招股书时，投资人仍在评判由组合估值、二级交易参照和叙事报道拼出的马赛克。

                              因此，投资判断必须盯证据、盯价格。新资金应偏向接近保守私募市场锚点的入场，或者等待能验证更高锚点的披露。现有持有人可以把更强的二级标记视作流动性或账面调升机会，但不应把它们误认为必然能在公开市场出清的价格。公司原则上可投。当前公开证据还不足以支撑在传闻区间上沿干净买入。
                              
