      - number: '1.3'
        title: 融资历史、投资者版图和估值重估
        blocks:
          - type: paragraph
            body: >-
              Xiaohongshu 的资本故事变得更有吸引力，不是因为它融资特别频繁，而是因为盈利先于最终上市到来。分析师数据库和媒体梳理大体指向约 $900M 的历史外部融资，战略和财务投资者包括
              Tencent、Alibaba、Temasek、DST Global、Hillhouse，以及 HongShan/Sequoia China 系谱。可访问的预览材料对逐轮金额并不完美，但在方向上相互一致：2024
              年前后有一轮后期融资，2025 年二级市场估值重估上行。

              这次重估是后续估值工作的核心事实。多份 2025-2026 年资料，常常追溯到 GSR 文件或 Bloomberg 引述报道，把 Xiaohongshu 的 2024 年估值放在约 $17B，把 2025 年 9
              月二级交易估值放在约 $31B。到 2026 年中，报道又称公司已在保密筹备香港 IPO，并已有顾问介入。换句话说，市场不再把 Xiaohongshu 估成一个大而尴尬的推荐
              App；它开始把公司估成一家已盈利、接近上市的消费平台，且可能吃到购买旅程中明显更大的份额。这个叙事转向很强，但依赖未经审计的私募市场报道，因此应给中等置信度，而不是盲目接受。
