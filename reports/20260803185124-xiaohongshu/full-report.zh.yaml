companyProfile:
  summary: >-
    Xiaohongshu
    是总部位于上海的消费互联网平台，把用户生成的生活方式内容、搜索驱动发现和电商放在一起。用户围绕美妆、时尚、美食、旅行、健身、本地生活等品类浏览和发布笔记；品牌和商家使用平台，是因为用户的发现行为往往离购买意图很近。公司已从社区驱动的发现应用，演进为后期私有社交电商平台，变现可选项强、盈利能力改善，也有可信的
    IPO 兴趣；但它披露的信息仍远少于公开市场同行。
