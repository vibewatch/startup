  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 客户工作流、产品模块和界面范围
        blocks:
          - type: paragraph
            body: >-
              与其把 Xiaohongshu 理解成单一信息流
              App，不如把它看成一个多界面的工作流产品。面向消费者的公开证据显示，用户在同一个移动应用里浏览笔记、搜索、购物、发消息、收藏和发布内容；第三方入门指南也显示，全球用户使用的是同一个
              App，而不是拆出的独立国际产品。这很重要，因为增长、审核、隐私和推荐逻辑都集中在一个跨境软件界面上。产品不只是内容消费：用户可以注册、建立个人资料、搜索、发现创作者、发布图片或视频笔记、管理隐私设置、购物和接收私信。商家与创作者工作流就在这个消费者循环旁边，并不遥远。

              产品图谱也比随口一句「中国 Instagram」更宽。官方和半官方材料展示了面向创作者、商家和集成伙伴的不同界面。这支持更平台化的理解：Xiaohongshu 同时是发现
              App、发布工具、购物界面、商家漏斗和生态管理者。最强的产品洞察是，这些模块共享同一个真实感叙事和同一套推荐引擎；因此，信任失效或虚假内容问题是产品失败，不只是政策问题。
