  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层和 Xiaohongshu 解决的任务
        blocks:
          - type: paragraph
            body: >-
              Xiaohongshu 同时服务不止一种「客户」。核心消费者的任务不只是娱乐，而是决策支持。多方资料描述，用户在购买或预订前，把这个 App
              当作搜索、比较、收藏和讨论产品、旅行计划、餐厅与生活方式选择的地方。这让消费者基础比普通社交受众更有价值，因为购买意图是显性的。商家端是第二层客户：品牌和卖家来到这里，是因为这些消费者准备问的是「值不值得买？」，而不只是滑动浏览。官方商业材料通过强调真实的产品和服务信息强化了这一点；商家增长报道也显示，生态对电商运营者越来越有意义。

              最重要的分层事实是，Xiaohongshu 已不再只是中国国内 App，但仍以中国为中心。全球入门指南和应用商店证据显示，海外用户使用的是同一个 App；但 Rest of World
              的报道暗示，最强的非中国用户群仍是海外华人和中文社区，而不是完全主流的西方受众。实践中，Xiaohongshu
              今天的客户栈是：中国生活方式和购物研究者，塑造品味与信任的创作者，想要高意图发现的品牌，以及一个仍处早期、由 TikTok 不稳定、翻译功能和 RedShop 实验吸引来的海外群体。
