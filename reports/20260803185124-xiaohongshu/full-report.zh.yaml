      - number: '4.2'
        title: 公开牵引、转化证据和单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              公开牵引足以支撑乐观收入线，但还不够精确，无法锁定单位经济。TechNode 和 36Kr 显示，2023 年和 2024 年商家增长加速；Sacra 与 Rest of World
              则指向一个足以支撑数十亿美元收入和利润的平台。最有信息量的经营细节不是披露的抽佣率，而是公司对归因的执着。TechNode 报道称，Xiaohongshu 比 GMV 更在乎日购买用户；36Kr 把 2025
              年商业化推进描述为一场证明「笔记之后」经营结果的行动，而不只是展示曝光、点击和 CPM。这说明公司知道自己的瓶颈不是触达，而是商家对可衡量转化的信心。

              单位经济的问题在于，太多桥梁仍是私有信息。我们有商家增长、活动测量产品、站外转化合作和特定 Double 11 销售结果的证据，却没有一条公开链路，把流量连接到
              GMV、实际抽佣率和毛利。于是，本章看到的收入质量优于过去，却仍难以套入干净的 SaaS 式或市场式模型。最稳妥的公开解读是：Xiaohongshu 拥有高价值意图、不断改善的商家 ROI
              证明，以及低于最大既有平台的直接交易捕获。
