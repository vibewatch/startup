- id: scenarios-and-entry-discipline
  title: Scenario ranges suggest mid-teens to low-20s are easiest to defend; $30B-plus needs proof
  body: "                The right way to frame Xiaohongshu today is not as a single-point valuation, but as a scenario band. The base case sits in the high teens to low twenties: enough to reflect intent-rich traffic, broad merchant participation, and some scarcity value, but still disciplined relative to Kuaishou's public market cap and the missing disclosure stack. The bull case begins around the low thirties and reaches the mid-thirties if audited disclosure confirms the profit story, Hong Kong listing demand is strong, and investors decide Xiaohongshu deserves a premium for combining discovery, advertising, and commerce entry points. The bear case lives around the low teens if public markets apply a stronger regulatory and opacity discount.\n\n                This framework leads directly to entry discipline. A new investor does not need to deny Xiaohongshu's quality to refuse a noisy $31B-$50B mark. Instead, the investor can insist on either a better price or a better document set.\
    \ That is especially important because secondary-market valuations can move faster than actual business transparency. Paying up before the prospectus exists can turn a strong company into a weak entry.\n                "
