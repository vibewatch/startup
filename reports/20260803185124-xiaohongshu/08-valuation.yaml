- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Investment thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - User intent quality
    - Xiaohongshu sits unusually close to consumer decision-making and purchase intent
    - High intent does not automatically guarantee high captured monetization
    - Prospectus-level evidence on revenue mix, take rate, and repeat merchant spend
  - - Merchant ecosystem
    - Brand breadth and merchant-growth signals suggest real commercial depth
    - Merchant growth could still hide concentration, gray-market spend, or weak monetization quality
    - Top-merchant concentration and cohort spend disclosure
  - - Private-market scarcity
    - A scarce Chinese social-commerce IPO could command a premium
    - Scarcity often fades quickly if disclosure disappoints or pricing is too aggressive
    - Offering size, book quality, and post-listing demand
  - - Profit narrative
    - Reported profitability could justify a premium multiple
    - Profit expectations remain narrative-heavy without audited context
    - Audited margin bridge and earnings quality disclosure
  - - Regulatory risk
    - Management may be learning to govern faster and cleanly enough for IPO readiness
    - CAC enforcement and AI-governance pressure may deserve a permanent discount
    - Regulator follow-up outcomes and compliance cost transparency
  notes: The anti-thesis is mostly about price and disclosure, not about denying Xiaohongshu's strategic relevance.
