- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited financial statements
    - Revenue, margin, cash flow, and profit audited to public-company standard
    - Most valuation disagreement collapses once earnings quality is known
    - Request prospectus or pre-IPO audited package
  - - Cap table and preference stack
    - Liquidation preferences, employee pool, and overhang from secondary holders
    - Private valuation marks do not equal common-equity value for all investors
    - Request full cap table and preference waterfall
  - - Merchant concentration and monetization quality
    - Top merchants, take rates, and repeat-spend cohorts
    - Premium valuation depends on monetization being durable and diversified
    - Request merchant cohort dashboard
  - - Regulatory remediation status
    - What changed after the 2025 CAC punishment
    - Risk discount cannot be sized cleanly without remediation evidence
    - Request regulatory follow-up materials and compliance memos
  - - IPO terms
    - Offering size, use of proceeds, cornerstone demand, and valuation range
    - Narrative becomes investable only when price meets terms
    - Wait for prospectus / term sheet
  notes: These asks are ordered by how directly they would change the valuation range or the recommendation.
