  name: Xiaohongshu
chapter:
  number: 8
  title: Valuation
  summary: "            Xiaohongshu looks like a high-quality social-commerce asset with unusual intent-rich traffic, but the public valuation record is extremely noisy. Current evidence supports a low-end anchor near $17B, a stronger but still secondary-market-based mark near $31B, and hotter late-2025 marks around $50B that look much less underwritten by public disclosure. Public comparables sharpen the discipline problem: Kuaishou, with audited scale and profits, traded around $24.84B in August 2026, while Pinterest and Bilibili traded far lower. The safest conclusion is not that Xiaohongshu is overvalued at any price; it is that new capital should wait for either a materially better entry point or filing-grade disclosure that validates the higher marks.\n            "
sections:
- id: valuation-context-and-dispersion
  title: 'Valuation context: Xiaohongshu is attractive, but the current marks disagree sharply'
  body: "                Public evidence does not produce one clean Xiaohongshu valuation; it produces a range of competing reference points. The most conservative visible anchors are around $17B from sources such as Caplight, Premier Alts, and the last formal 2024 financing described by 36Kr. Then come stronger late-stage private marks around $31B from TMTPost, 36Kr, and other secondary-market reporting. Finally, there are hotter references around $50B from secondary-sale narratives and IPO rumor coverage. That is too wide a spread to treat as normal noise. It means the key valuation question is not only what Xiaohongshu is worth, but which price-discovery mechanism deserves the most trust.\n\n                Some of that dispersion is understandable. Xiaohongshu is still private, and the market is using partial inputs: secondary trades, portfolio marks, accredited-investor marketplaces, and narrative-heavy IPO reporting. But dispersion this wide should directly lower confidence in any\
    \ single mark. The company may deserve a premium because it combines social discovery, commercial intent, and a large brand ecosystem. Even so, a platform cannot be treated as fully repriced until those claims are tested in the broader, more disclosure-heavy context of a filing or a public market book.\n                "
