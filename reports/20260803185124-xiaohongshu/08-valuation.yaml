    - $28B-$35B fair-value band; public investors pay for scarcity plus monetization quality
    - Possible, but needs filing-grade proof and a supportive market window
  - - Base
    - Company quality is real but public comps keep discipline and disclosure remains only partly validated
    - $18B-$24B fair-value band; premium to Pinterest/Bilibili, modest discount or parity tension versus Kuaishou
    - Most defensible from current public evidence
  - - Bear
    - Regulatory drag, disclosure gaps, or public-market skepticism compress the premium narrative
    - $10B-$14B fair-value band; market re-rates toward conservative secondary anchors and lower-trust social comps
    - Credible if IPO timing slips or disclosure disappoints
  notes: These are valuation bands, not DCF outputs. They are grounded in observed private marks, public comp market caps, and the disclosure discount implied by Xiaohongshu remaining private.
