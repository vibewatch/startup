- id: final-recommendation
  title: 'Final recommendation: monitor, wait for filing-grade proof, and be price-sensitive'
  body: "                The final recommendation is MONITOR. Xiaohongshu has enough strategic quality that it belongs on an active investment watchlist: user intent looks unusually commercial, merchant evidence is real, and the company has a credible path to public-market interest if a Hong Kong filing materializes. But valuation and evidence are currently out of sync. The public story includes a real mid-teens anchor, a plausible low-thirties narrative, and frothier late-2025 marks that already price in a lot of future execution. Without a formal prospectus, investors are still judging a mosaic of portfolio marks, secondary-trade references, and narrative reporting.\n\n                That is why the investment call should be evidence-sensitive and price-sensitive. New money should prefer entry closer to the conservative private-market anchors or wait for disclosure that validates the higher ones. Existing holders may welcome stronger secondary marks as liquidity or mark-up opportunities,\
    \ but they should not confuse those with guaranteed public-market clearing prices. The company is investable in principle. The current public evidence does not yet make it a clean buy at the upper end of the rumor range.\n                "
