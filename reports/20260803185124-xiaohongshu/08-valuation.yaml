- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / signal
  - Transmission to thesis
  - Action implication
  rows:
  - - IPO filing shows materially weaker revenue or profitability than rumor surfaces imply
    - Prospectus contradicts the current profit / revenue narrative
    - Higher-end private marks lose credibility
    - Reset valuation toward base or bear range immediately
  - - CAC or other regulatory action escalates again
    - Fresh public enforcement beyond the 2025 punishment episode
    - Permanent risk discount rises
    - Require larger discount to any private or IPO price
  - - Hong Kong listing is delayed for substantive rather than routine reasons
    - Repeated timing slippage or regulatory review bottlenecks
    - Scarcity premium and momentum case weaken
    - Treat hot secondary marks as unreliable
  - - IPO or secondary pricing leans near $50B without much better disclosure
    - Offer documents and book-building do not justify premium
    - Entry math becomes narrative-driven
    - Do not chase; wait for post-listing price discovery or better terms
  - - Merchant and customer monetization proof is thinner than implied
    - Cohort, GMV attribution, or merchant-spend data disappoint
    - Premium to Pinterest/Bilibili and parity argument versus Kuaishou weaken
    - Move valuation toward low-end anchors
  notes: These triggers matter because Xiaohongshu's biggest valuation risk is paying public-company prices for private-company disclosure quality.
