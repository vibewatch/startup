      - number: '3.4'
        title: 'Final read: durable niche or temporary format advantage?'
        blocks:
          - type: paragraph
            body: >-
              The strongest bear case is simple: larger incumbents already have more users, more merchants, more
              checkout depth, and

              more budget to fund growth. If Douyin, Taobao Live, Kuaishou, or even international adjacencies can
              imitate

              Xiaohongshu's note format and creator tools while keeping their distribution advantages, Xiaohongshu risks
              becoming an

              influential but only partially monetized discovery layer. That risk is intensified by geopolitical
              scrutiny abroad,

              where a single-app architecture could attract TikTok-style questions if RedNote ever gained real Western
              scale.


              The strongest bull case is that not all attention is equal. Xiaohongshu has built a qualitatively
              different kind of

