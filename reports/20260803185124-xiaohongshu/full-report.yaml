            body: >-
              The capital-adequacy story is directionally good but still opaque. Analyst databases and secondary-market
              trackers point to roughly $900M-$917.5M of historic capital raised and a large private valuation even
              before a potential Hong Kong listing. If the 2025-2026 profit narrative is directionally correct,
              Xiaohongshu is no longer a business that obviously needs outside money for survival. That matters: a
              profitable, still-growing consumer platform can use capital for liquidity, employee retention, ecosystem
              bets, or IPO preparation rather than emergency runway. The problem is that public investors still do not
              know the actual cash balance, the burn profile by business line, or whether overseas expansion and
              commerce infrastructure are consuming meaningfully more capital than the market assumes.


              Cost structure is therefore easier to infer than to prove. Ads should be structurally high margin relative
              to inventory-heavy commerce, while content moderation, recommendation infrastructure, merchant success
