      - number: '8.2'
        title: Public comps argue for discipline, especially versus Kuaishou
        blocks:
          - type: paragraph
            body: |2-
                              The most useful valuation anchor is Kuaishou, not because the businesses are identical, but because it is a scaled Chinese content-and-commerce platform with public reporting. Kuaishou's August 2026 market cap was about $24.84B, and its official 2025 results showed RMB142.8B of revenue and RMB18.6B of profit. That matters because it tells investors what audited scale and profitability were worth in a public market that already understands Chinese internet risk. By contrast, Bilibili and Pinterest traded far lower, reflecting weaker commerce leverage or different platform economics. Alibaba is too broad and mature to be a direct comp, but it is a useful upper-bound context for what public markets assign to a giant, disclosed China platform franchise.

                              These comparisons do not prove Xiaohongshu is cheap or expensive by themselves. They do prove that marks above Kuaishou require a fairly demanding narrative: either better monetization quality than the public evidence presently shows, or an IPO scarcity premium that persists after disclosure. They also highlight the disclosure gap. Bilibili, Pinterest, and Alibaba all maintain filing pages for public investors. Xiaohongshu does not yet offer equivalent public visibility into audited financials, cap table, or use of proceeds. That should matter to price.
                              
