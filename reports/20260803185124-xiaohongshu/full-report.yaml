        title: Trust, safety, privacy, and compliance controls
        blocks:
          - type: paragraph
            body: >-
              Trust controls are central to the product because Xiaohongshu monetizes authenticity. Official business
              guidelines, app-store privacy disclosures, regulatory actions, and 2026 rule summaries all point to the
              same conclusion: the company treats fake personas, undeclared AI content, hostile interactions, and
              misleading marketing as threats to the product itself. Google Play's data-safety disclosure offers some
              user-visible privacy signals such as encryption in transit and a deletion request path, while official and
              third-party rule documents show stricter labeling, identity, and high-risk-industry controls. The
              trade-off is obvious: a richer authenticity regime can improve user trust, but it also increases
              onboarding friction, moderation cost, and the risk of false positives that anger legitimate users.


              Adverse evidence matters here. Public user reviews mention unexplained restrictions and intrusive
              remediation, and CAC's 2025 rectification action shows regulators are willing to intervene directly when
              the platform's ecosystem quality slips. The 2026 crackdown on AI-managed accounts is therefore not a side
              story—it is an operating requirement. Xiaohongshu's product strength depends on keeping recommendation
              quality and community trust high enough that brands still believe content is persuasive rather than
              synthetic sludge.
