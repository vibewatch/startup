            body: >-
              Xiaohongshu is best understood as a multi-surface workflow product rather than a single feed app. Public
              consumer-facing evidence shows one mobile application where users browse notes, search, shop, message,
              save, and post, while third-party onboarding guides show the same app is used globally rather than split
              into a separate international product. That matters because it means growth, moderation, privacy, and
              recommendation logic are concentrated in one cross-border software surface. The product is not just
              content consumption: users can register, build a profile, search, discover creators, post photo or video
              notes, manage privacy settings, shop, and receive direct messages. Merchant and creator workflows sit
              adjacent to that consumer loop, not far away from it.


              The product map is also broader than a casual “Chinese Instagram” label implies. Official and
              semi-official materials show distinct surfaces for creators, merchants, and integration partners. That
              supports a more platform-like interpretation: Xiaohongshu is simultaneously a discovery app, a publishing
              tool, a shopping surface, a merchant funnel, and an ecosystem manager. The strongest product insight is
              that these modules share the same authenticity narrative and the same recommendation engine, which is why
              trust failures or fake-content problems are product failures, not only policy issues.
