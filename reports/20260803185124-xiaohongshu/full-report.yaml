  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Valuation context: Xiaohongshu is attractive, but the current marks disagree sharply'
        blocks:
          - type: paragraph
            body: |2-
                              Public evidence does not produce one clean Xiaohongshu valuation; it produces a range of competing reference points. The most conservative visible anchors are around $17B from sources such as Caplight, Premier Alts, and the last formal 2024 financing described by 36Kr. Then come stronger late-stage private marks around $31B from TMTPost, 36Kr, and other secondary-market reporting. Finally, there are hotter references around $50B from secondary-sale narratives and IPO rumor coverage. That is too wide a spread to treat as normal noise. It means the key valuation question is not only what Xiaohongshu is worth, but which price-discovery mechanism deserves the most trust.

                              Some of that dispersion is understandable. Xiaohongshu is still private, and the market is using partial inputs: secondary trades, portfolio marks, accredited-investor marketplaces, and narrative-heavy IPO reporting. But dispersion this wide should directly lower confidence in any single mark. The company may deserve a premium because it combines social discovery, commercial intent, and a large brand ecosystem. Even so, a platform cannot be treated as fully repriced until those claims are tested in the broader, more disclosure-heavy context of a filing or a public market book.
                              
