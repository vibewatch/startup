companyProfile:
  summary: >-
    Xiaohongshu is a Shanghai-based consumer internet platform that blends user-generated lifestyle content, search-led
    discovery, and commerce. Users browse and publish notes across beauty, fashion, food, travel, fitness, and
    local-life categories; brands and merchants use the platform because discovery behavior often sits close to purchase
    intent. The company has evolved from a community-led discovery app into a late-stage private social-commerce
    platform with strong monetization optionality, improving profitability, and credible IPO interest, but it still
    discloses far less than a public-market peer.
  foundedDate: '2013-06-01'
  founders:
    - name: Charlwin Mao Wenchao
      role: Co-founder and CEO
      background: >-
        Co-founded Xiaohongshu in Shanghai and remains the leader most commonly associated with its commerce and
        platform strategy.
      claimRefs:
        - CO001
    - name: Miranda Qu Fang
      role: Co-founder and President
      background: Co-founded Xiaohongshu and remains consistently associated with the company's origin and leadership.
      claimRefs:
        - CO001
  foundingLocation: Shanghai, China
  headquarters: Shanghai, China
  productSummary: >-
