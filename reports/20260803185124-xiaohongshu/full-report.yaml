      - number: '1.3'
        title: Funding history, investor map, and valuation reset
        blocks:
          - type: paragraph
            body: >-
              Xiaohongshu’s capital story has become more attractive because profitability arrived before an eventual
              listing, not

              because the company raised capital especially frequently. Analyst databases and press syntheses converge
              on roughly

              $900M of historic outside funding, with strategic and financial backers that include Tencent, Alibaba,
              Temasek, DST

              Global, Hillhouse, and HongShan/Sequoia China lineages. Accessible previews are imperfect on exact
              round-by-round

              amounts, but they are directionally consistent on a late-stage funding round around 2024 and on a
              secondary-market

              valuation reset higher in 2025.


              That reset is the central underwriting fact for later valuation work. Several 2025-2026 sources, often
              tracing back

              to GSR documentation or Bloomberg-cited reporting, place Xiaohongshu around a $17B valuation in 2024 and
              around a

              $31B valuation in September 2025 secondary activity. Reports in mid-2026 then describe confidential Hong
              Kong IPO

              preparation with advisers already in place. In other words, the market is no longer valuing Xiaohongshu as
              a large

              but awkward recommendation app; it is valuing it as a profitable, listing-ready consumer platform that may
              capture a

              meaningfully larger share of the purchase journey. That is a powerful narrative shift, but it leans on
              non-audited

              private-market reporting and therefore deserves medium confidence rather than blind acceptance.
