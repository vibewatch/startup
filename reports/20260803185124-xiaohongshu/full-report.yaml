      - number: '1.2'
        title: Founders, leadership continuity, and governance transparency
        blocks:
          - type: paragraph
            body: >-
              The public record shows unusually strong founder continuity for a company that is now discussing IPO
              readiness.

              Miranda Qu Fang and Charlwin Mao Wenchao are still the names most consistently attached to the company’s
              origin,

              product identity, and strategic direction. That continuity reduces “who built this?” uncertainty for later
              diligence

              chapters: the company has not obviously changed hands culturally or strategically since formation. It also
              increases

              key-person concentration. Xiaohongshu is still interpreted externally through founder judgment on the
              tension between

              community quality and monetization intensity, and that tradeoff has defined both the upside and the
              recurring

              criticisms of the business.


              Governance disclosure is materially thinner than the platform’s scale would suggest. Publicly accessible
              company,

              PitchBook-preview, and Tracxn materials reviewed for this run do not provide a clear current board roster,
              an

              independent-director list, or a committee structure. That gap does not mean governance is poor, but it
              does mean a

              late-stage investor is being asked to underwrite an IPO path without public-company-grade visibility into
              actual board

              override power. The same section of the diligence therefore has two opposing readings: founder continuity
              is a real

              asset because product and community judgment have been coherent over time, but the absence of crisp board
              disclosure

              raises diligence friction precisely when the company is trying to market itself as a more mature, more
              governable

              profit machine.
