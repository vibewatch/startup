  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: discovery-led social commerce, not all of Chinese e-commerce'
        blocks:
          - type: paragraph
            body: >-
              The first analytic step is to avoid calling Xiaohongshu a participant in “all of e-commerce.” The platform
              sits inside

              social commerce, but more specifically inside a discovery-led, content-led, lifestyle purchase-intent
              layer. Official

              materials emphasize authentic community content plus commerce; TechNode’s older platform profile went
              further and

              argued that Xiaohongshu behaves more like a product search engine and word-of-mouth incubator than a
              classic

              transaction marketplace. That framing makes its closest functional substitutes different from its closest
              scale

              competitors. In function, Xiaohongshu competes with search, reviews, creator recommendations, and category
              education.

              In scale, it faces Douyin, Taobao/Tmall, JD, and Kuaishou, all of which own deeper checkout infrastructure
              and broader

              merchant depth.


              The in-scope spend is therefore the part of consumer commerce where social proof, aesthetics,
              authenticity, and

              pre-purchase research influence buying decisions. Beauty, personal care, apparel, home, food discovery,
              and travel

              planning are especially relevant because they benefit from tutorials, before-and-after imagery, subjective
              reviews,

              and creator-led taste formation. Out-of-scope or only partially in-scope spend includes commodity
              replenishment,

              industrial procurement, low-consideration bulk purchases, and categories where price and logistics
              dominate brand

              storytelling. Those still matter as substitutes, because Xiaohongshu often sends traffic toward merchants
              that finish

              the transaction elsewhere, but they should not be treated as the company’s primary owned market.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
