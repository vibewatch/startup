      - number: '2.3'
        title: Buyer, merchant, and creator segments shape the adoption path
        blocks:
          - type: paragraph
            body: >-
              The core consumer remains young, urban, and female-skewed, with KrASIA describing a 300M+ MAU platform
              whose users are

              about 70% women and heavily born after 1995. That profile matters because it aligns with the exact
              categories that

              social-commerce research says are strongest—beauty, personal care, fashion, and visually expressive
              lifestyle goods.

              Xiaohongshu therefore works less like a mass catalogue and more like a taste-and-trust engine. Users
              browse notes,

              search for category advice, compare brands, and then either purchase within the ecosystem or jump to a
              stronger

              transaction venue. The merchant side mirrors that shape: curated brands, challenger labels, and aesthetic
              or expert

              hosts are a better fit than low-differentiation commodity sellers.


              Creators are the market-making layer. TechNode and Rest of World both show that Xiaohongshu’s monetization
              depends on

              soft-sell content, livestream demonstrations, and creator-brand matching rather than hard-discount flash
              selling. The

              Dandelion program and rising merchant thresholds show that the ecosystem is getting more commercial, but
              still in a way

              that rewards trust and taste formation. That is a real adoption advantage with brands that need education,
              yet it also

              creates a bottleneck: if the platform becomes too ad-heavy, it weakens the authenticity signal that made
              its discovery

              layer valuable in the first place.
