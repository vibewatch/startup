      - number: '7.4'
        title: Disclosure, monitoring, and execution remain the hardest investor risks to underwrite
        blocks:
          - type: paragraph
            body: |2-
                              The final risk bucket is opacity. Xiaohongshu is large enough that compliance, moderation, and growth-quality questions now have material financial consequences, but the public record still looks like a private-company patchwork of official posts, news reporting, and market-data profiles. Caplight, Tracxn, and Sacra can help frame scale or valuation, yet they do not replace audited disclosures on top-merchant concentration, regional cohorts, compliance spend, fraud loss, or the cost of maintaining content authenticity at this scale. Even basic outside monitoring is weaker than investors would like, because some official legal pages are hard to access and open third-party traffic verification is spotty.

                              This means the most useful public risk conclusion is not that Xiaohongshu is uninvestable; it is that investors should attach hard monitoring criteria to the thesis. If new CAC enforcement appears, if foreign growth continues without regional transparency, if merchant growth outruns control systems, or if fake-content cleanups keep rising despite new rules, then the base case weakens materially. Xiaohongshu may ultimately prove it can manage these trade-offs. The current public record does not yet prove that it has.
                              
