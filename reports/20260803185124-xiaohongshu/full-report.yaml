      - number: '2.4'
        title: Constraints, contradictory data, and the limits of value capture
        blocks:
          - type: paragraph
            body: >-
              The market looks large, but the company does not own all of the value it influences. Multiple sources
              still describe a

              structural pattern in which Xiaohongshu shapes purchase intent while Taobao, JD, Douyin, or other
              merchants capture the

              final checkout. That is why market chapters built only on trillion-dollar social-commerce GMV figures can
              become

              misleading. What matters for underwriting is not whether Chinese consumers will keep shopping
              socially—they almost

              certainly will—but whether Xiaohongshu can capture enough advertising, merchant-service, or transaction
              economics from

              that behavior to justify late-stage valuation expectations.


              There are also contradictory user and expansion data points. English-language reporting put late-2024 MAU
              around 225

              million, while KrASIA cited 300M+ MAU; those figures may be measuring different surfaces or dates, but
              they are not the

              same. Overseas traction also cooled quickly after the RedNote spike: US daily active users and non-China
              daily active

              users both fell from January highs by March 2025. Finally, compliance costs are rising across the
              category. 36Kr’s 2025

              live-commerce recap and CAC enforcement both imply tighter scrutiny on platform rules, fake traffic,
              content labeling,

              and after-sales governance. The result is a market with extraordinary size and momentum, but one where
              Xiaohongshu’s

              most valuable position—high-intent discovery—does not automatically convert into dominant captured GMV.
