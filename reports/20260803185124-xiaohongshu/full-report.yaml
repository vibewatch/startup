              sources appears to have at least five layers: consumer clients, creator and merchant surfaces,
              open-platform and partner interfaces, shared data / recommendation / AI systems, and governance
              infrastructure.


              Developer-signal sources add a second important layer of evidence. There is clearly demand to build around
              Xiaohongshu, but much of that demand is unofficial. GitHub topic pages show hundreds of public
              repositories associated with Xiaohongshu workflows, while practitioner posts explain how scraping or
              reverse-engineering is difficult because of anti-bot controls and client-side request signing. That
              combination implies a closed but economically interesting stack: it is integrated enough to attract tool
              builders, yet restricted enough that outside developers still treat access as a technical challenge rather
