        title: Revenue model, mix shift, and monetization mechanics
        blocks:
          - type: paragraph
            body: >-
              Xiaohongshu's revenue model is now easier to describe than it was two years ago. The company still
              monetizes mainly by selling attention and intent to brands, but the public record shows a meaningful shift
              from generic “planting grass” marketing toward attributable commerce and merchant operating tools. Sacra's
              2024 estimate implies a business large enough to matter at public-market scale, while 36Kr's 2025
              reporting argues that advertising remains the core revenue base even as transaction-linked products become
              more important. The key analytical nuance is that Xiaohongshu does not need to own every checkout to
              monetize the purchase journey. It earns from ad budgets, internal commerce flows, and increasingly from
              tools that help merchants measure whether a note or campaign drove sales on Taobao, JD, or other
              platforms.


              That is why the mix question matters more than the headline revenue number. Early-2025 sources still
              framed the business as roughly 60% advertising and 30% e-commerce, but later 2025 reporting suggested ad
              revenue had become even more dominant as the company opened more industries and measurement tools. Those
              views are not necessarily contradictory; they imply a platform whose ad engine matured faster than its
              closed-loop checkout. For investors, that means Xiaohongshu is not best modeled as a classic marketplace
              or a pure media app. It is a recommendation and attribution surface monetizing intent at multiple points
              in the funnel.
