            body: >-
              Public scale signals show that Xiaohongshu already has reach, and the more relevant question is where that
              reach deepens. Marketing and stats pages cite a user base around 300 million, while Sacra's dataset
              suggests the platform exceeded 350 million MAU by the end of 2024. The most visible growth moment came in
              January 2025, when U.S. TikTok uncertainty pushed hundreds of thousands of new users onto the app in days
              and drove Xiaohongshu to the top of U.S. app-store charts. Rest of World showed that the phenomenon was
              not only American: the app reached top-three ranking positions across many non-Western countries during
              the same window. Those adoption bursts matter because they reveal latent demand for Xiaohongshu's product
              shape outside its original base.


              Still, adoption bursts are not the same thing as durable engagement. Public sources give chart rank,
              download surges, reviews, and merchant-growth figures, but not clean management cohorts. That means
              customer breadth is visible while customer depth remains partly hidden. The safe reading is that
              Xiaohongshu has already solved awareness and app-store discoverability, but the next phase of growth
              depends more on repeat usage, international content density, merchant trust, and better proof of ecosystem
              health than on proving the app can get noticed.
