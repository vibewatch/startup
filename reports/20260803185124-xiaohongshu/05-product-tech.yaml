  - - Trust / governance systems
    - Enforce declarations, rules, and user restrictions
    - Business guidelines, 2026 rule guides, TechNode and CAC actions
    - Moderation ops, policy clarity, regulatory relationship
    - High false positives or regulatory failures can damage product trust.
