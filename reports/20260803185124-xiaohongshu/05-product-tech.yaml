    - No public evidence on exact conversion lift by category.
  - - Post content or build a persona
    - Register, set profile, publish photos or videos, manage visibility
    - In-app creator workflow with hashtags, captions, and privacy controls
    - Low friction content loop in same app as discovery and commerce
    - Moderation or account restriction risk is visible in reviews.
  - - Shop after discovery
    - Move from note or discovery page into Shop or merchant flow
    - Integrated shop plus partner-linked commerce paths
    - Shortens distance between inspiration and purchase
    - Internal vs external checkout mix is still opaque.
  - - Launch or optimize a merchant campaign
    - Use merchant or business tooling plus platform guidance
    - Business surfaces, measurement tools, and verification paths
    - Closer attribution between content seeding and business outcomes
    - Public pricing and workflow depth remain partially opaque.
  - - Integrate catalog or order operations
    - Apply for sandbox, test APIs, then coordinate production launch
    - Ark APIs for product info, inventory, price, and packages
    - Enables structured partner integration instead of manual-only operations
    - Looks controlled rather than open self-serve for everyone.
  - - Maintain community trust
    - Detect AI content, fake engagement, or deceptive marketing
    - Rule updates, declarations, and enforcement actions
    - Protects authenticity moat that underpins product value
    - Can create user friction or false-positive enforcement risk.
