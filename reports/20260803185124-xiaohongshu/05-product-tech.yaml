  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Current public maturity
  - What it does
  - Differentiation angle
  - Diligence gap
  rows:
  - - Consumer note feed and search
    - Consumers
    - Mature
    - Browse, search, save, and evaluate lifestyle content
    - High-intent discovery tied to product decisions
    - No independent disclosure of ranking or search quality metrics.
  - - Creator publishing surface
    - Creators
    - Mature
    - Publish photo/video notes, profile, privacy, and engagement settings
    - Authenticity plus community-native content format
    - No public creator-retention or payout detail.
  - - Shop and commerce layer
    - Consumers + merchants
    - Growth
    - Support product discovery and shopping inside the app
    - Brings commerce closer to content without requiring pure hard-sell live commerce
    - No public split between internal checkout and partner checkout.
  - - Merchant tooling / business surfaces
    - Brands + merchants
    - Growth
    - Support campaign, profile, verification, and operations workflows
    - Moves Xiaohongshu from media buy to merchant operating tool
    - Commercial pricing and attach rates are undisclosed.
  - - Open platform / Ark integrations
    - Partners + merchants
    - Growth
    - Expose APIs and sandbox / production integration flow
    - Makes catalog, inventory, and package operations programmable
    - Breadth of partner access and API coverage is not fully public.
  - - Trust / moderation / compliance layer
    - Users + platform ops
    - Mature
    - Govern authenticity, AI labels, identity, and restricted content
    - Trust is core to conversion, not a cosmetic policy layer
    - False-positive rate and enforcement consistency are not public.
  - - AI platform / Relax infrastructure
    - Internal AI team
    - Emerging but real
    - Support multimodal RL and model-training efficiency
    - Suggests deeper AI engineering capabilities than a typical social app
    - Direct link from Relax to ranking or ad ROI is not public.
  notes: Public maturity reflects how concretely the module is evidenced in reviewed sources, not its exact revenue contribution.
