evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding-and-ownership
    missingEvidence: >-
      Current capitalization table, fully diluted ownership, preferred-share terms, debt and credit facilities,
      secondary transactions, total capital raised, and a current valuation.
    whyItMatters: >-
      Historical stake sales cannot establish present ownership, liquidation rights, leverage, or the price investors
      would pay today.
    diligencePath: >-
      Request the board-approved cap table, shareholder register, financing documents, debt schedule, and the most
      recent independent valuation or arm's-length transaction materials.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: governance-and-leadership
    missingEvidence: >-
      Complete executive roster, board and observer seats, director independence, committee mandates, succession
      planning, and a dated log of material leadership changes.
    whyItMatters: >-
      Founder control and an incomplete governance map prevent assessment of oversight, succession resilience, and
      investor protections.
    diligencePath: >-
      Obtain organization charts, board minutes and charters, director biographies, employment agreements, delegation
      matrices, and the last three years of executive changes.
    relatedQuestionRefs:
      - QO002
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: financial-and-customer-metrics
    missingEvidence: >-
      Audited 2025-2026 revenue, ARR, growth, gross margin, cash flow, cash, debt, customer count, segment mix,
      concentration, renewal rates, and net revenue retention.
    whyItMatters: >-
      Company scale claims and a 2024 revenue datapoint are insufficient to assess recurring economics, financial
      durability, or valuation.
    diligencePath: >-
      Request audited consolidated statements, monthly recurring-revenue bridges, customer cohorts,
      channel-versus-direct mix, and concentration schedules reconciled to the ledger.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: enterprise-arr-segmentation
    missingEvidence: >-
      Audited segment reporting breaking down Bitdefender's €330M reported revenue between consumer software, enterprise
      GravityZone EDR/XDR ARR, and OEM threat intelligence licensing.
    whyItMatters: >-
      Without segmented ARR and customer retention data, investors cannot separate mature, lower-multiple consumer
      antivirus turnover from high-growth enterprise SaaS recurring revenue.
    diligencePath: >-
      Request an audited management disclosure or pre-IPO investor presentation providing ARR, Net Revenue Retention
      (NRR), and customer count by commercial segment.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: enterprise-contract-pricing
    missingEvidence: >-
      Negotiated enterprise volume discounting schedules and realized multi-year contract values for Bitdefender
      GravityZone Enterprise and MDR deployments above 1,000 endpoints.
    whyItMatters: >-
      Public list prices only reflect SMB and entry packages, leaving enterprise total cost of ownership and margin
      headroom unverified.
    diligencePath: >-
      Request customer contract samples and channel discount schedules under non-disclosure agreement during formal
      diligence.
    relatedQuestionRefs:
      - QP004
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: third-party-edr-telemetry
    missingEvidence: >-
      Quantitative benchmarks detailing ingestion latency and detection parity when Bitdefender MDR operates over
      non-native third-party endpoint telemetry via Security Data Lake.
    whyItMatters: >-
      IDC notes GravityZone MDR is optimized for its native platform agent, leaving open how effectively it defends
      heterogeneous estates unwilling to displace existing EDR agents.
    diligencePath: >-
      Review vendor integration roadmaps and conduct comparative proof-of-concept testing in mixed-agent enterprise
      environments.
    relatedQuestionRefs:
      - QP008
      - QP009
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited gross margin percentage, net revenue retention (NRR), and direct customer acquisition cost (CAC) payback
      data.
    whyItMatters: >-
      Without segmented gross margins and NRR, underwriters cannot quantify the recurring software economics versus
      human-delivered MDR service delivery costs.
    diligencePath: Request confidential management financial pack and audited segment reporting under NDA prior to underwriting.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: capital-adequacy
    missingEvidence: Audited consolidated cash balance, debt covenants, and free cash flow generation figures.
    whyItMatters: >-
      Determines whether Bitdefender requires pre-IPO bridge capital or is entirely self-funding from operating cash
      flow.
    diligencePath: Review audited statutory accounts filed in Romania and parent holding company jurisdictions.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI001
  - type: conflicting-data
    severity: minor
    topic: revenue-estimates
    missingEvidence: >-
      Reconciliation between reported European statutory revenue of 330 million euros, run-rate claims of 435 million
      dollars, and third-party ARR estimates of 254.9 million dollars.
    whyItMatters: Conflicting top-line indicators obscure the exact recurring ARR baseline and year-over-year organic growth rate.
    diligencePath: Obtain GAAP/IFRS audited revenue schedule with constant-currency ARR and billings bridges.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: developer-signal-telemetry
    missingEvidence: >-
      Public developer adoption metrics, independent enterprise API documentation access, and programmatic integration
      benchmark telemetry.
    whyItMatters: >-
      Without public API telemetry or developer community metrics, technical due diligence cannot independently audit
      enterprise integration friction or programmatic SOAR throughput.
    diligencePath: >-
      Request GravityZone REST API integration guides, SDK benchmarking telemetry, and enterprise client incident
      orchestration performance logs directly from Bitdefender engineering.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: minor
    topic: cloud-infrastructure-resilience
    missingEvidence: >-
      Third-party audited SOC 2 Type II reports, uptime SLAs, and cloud multi-region disaster recovery audit records for
      GravityZone Control Center.
    whyItMatters: >-
      Centralized cloud console availability and global telemetry routing resilience directly impact enterprise response
      SLAs during widespread cyber incidents.
    diligencePath: >-
      Request Bitdefender's latest SOC 2 compliance package, disaster recovery testing reports, and Control Center
      regional availability metrics during technical due diligence.
  - type: private-evidence-only
    severity: material
    topic: retention-and-expansion
    missingEvidence: >-
      Audited NRR, GRR, logo churn, renewal rates, contract duration, and cohort expansion by customer segment and route
      to market.
    whyItMatters: >-
      Review scores and partner growth cannot establish recurring-revenue durability or distinguish expansion from
      replacement of churned accounts.
    diligencePath: >-
      Request monthly customer cohorts for at least 36 months, reconcile them to invoiced revenue, and sample renewal
      and upsell contracts under NDA.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: customer-and-channel-concentration
    missingEvidence: >-
      Revenue and receivables concentration by end customer, distributor, MSP, bundle partner, geography, and product
      line.
    whyItMatters: >-
      A large partner count does not rule out dependence on a small set of distributors or customers, and channel
      intermediation can obscure end-customer churn.
    diligencePath: >-
      Obtain top-20 customer and partner schedules, channel billings, receivable aging, and end-customer mapping for
      distributor-led revenue.
    relatedQuestionRefs:
      - QU006
    relatedTableRefs:
      - TU001
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: >-
      A complete named-customer roster with production status, deployment date, endpoint count, contract value, renewal
      status, and independently measured outcomes.
    whyItMatters: >-
      The public sample is selected marketing evidence and cannot establish the distribution or quality of the full
      customer base.
    diligencePath: >-
      Request an anonymized customer master and validate a stratified sample through contracts, deployment telemetry,
      invoices, and direct reference calls.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-compliance
    missingEvidence: >-
      Comprehensive registry of all pending cross-border regulatory examinations, national security reviews, and EU
      member-state supervisory audits under DORA and NIS2 frameworks.
    whyItMatters: >-
      While Bitdefender documents its GravityZone DORA compliance architecture, private company status precludes
      independent audit of formal regulatory inquiry letters or binding remediation agreements.
    diligencePath: >-
      Request formal representation letter from Bitdefender legal counsel detailing all active supervisory inquiries,
      audit findings, and regulatory notifications across EU and US jurisdictions.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited consolidated cash flows, EBITDA margins, debt covenants, and capitalization waterfall details for
      Bitdefender S.R.L. and international subsidiaries.
    whyItMatters: >-
      Third-party estimates from GetLatka and media reports diverge widely regarding revenue run rate and growth, while
      preference terms from prior funding rounds remain private.
    diligencePath: >-
      Review confidential pre-IPO data room financial statements, audited balance sheets, and cap table preference
      rights ahead of underwriting.
    relatedQuestionRefs:
      - QR008
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Audited common-and-preferred share capitalization table specifying liquidation preference multiples, senior
      conversion rights, and dividend overhang.
    whyItMatters: >-
      Without senior preference documentation, common equity valuation is vulnerable to disproportionate dilution or
      complete subordination in a low-multiple exit.
    diligencePath: >-
      Obtain confidential capitalization waterfall model and investor rights agreement from primary sponsors prior to
      equity subscription.
    relatedQuestionRefs:
      - QV003
      - QV006
  - type: missing-source
    severity: material
    topic: financial-reporting
    missingEvidence: >-
      Audited consolidated annual GAAP or IFRS financial statements with segment breakdowns for enterprise ARR, consumer
      subscriptions, and net revenue retention.
    whyItMatters: >-
      Public revenue figures conflate consumer renewals with high-margin enterprise recurring contracts, preventing
      precise enterprise multiple underwriting.
    diligencePath: Review independent auditor report and segment revenue data room schedules during formal IPO due diligence.
    relatedQuestionRefs:
      - QV001
      - QV005
      - QV007
