companyProfile:
  summary: >-
    Bitdefender is a founder-led, privately held Romanian cybersecurity company that sells consumer security suites,
    GravityZone enterprise protection, managed detection and response, and OEM/embedded partner offerings across more
    than 170 countries. Public evidence supports global operating scale, a large partner ecosystem, and a profitable
    2024 revenue base, but not current ARR, gross margin, customer concentration, or a full capitalization waterfall.
