  topStrengths:
    - Strong global distribution across consumer, enterprise, MSP, and embedded channels.
    - Recognized product traction and partner ecosystem breadth in cybersecurity.
    - Meaningful operating scale with profitable revenue and an established Romanian cost base.
  topRisks:
    - Private-company disclosure gaps prevent verification of ARR, gross margin, cash flow, and customer retention.
    - Founder concentration and incomplete capital-structure visibility leave governance and liquidity risk unresolved.
    - Renewal friction, pricing pressure, and channel dependence may cap expansion quality.
  unresolvedGaps:
    - Audited consolidated cash, debt, covenant, and cash-flow disclosure is still absent.
    - >-
      Preferred-share legal terms and the full common-equity waterfall are not public despite the reported 2017 minority
      stake sale.
    - Public sources do not disclose ARR, NRR, gross margin, segment margin, or direct-versus-channel revenue mix.
    - >-
      Exact enterprise customer count, concentration, and renewal quality remain undisclosed even though partner scale
      and case studies are visible.
    - >-
      The IPO process remains reported planning until a filed prospectus confirms timing, share count, and marketed
      pricing.
