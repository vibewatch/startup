        blocks:
          - type: paragraph
            body: >-
              Bitdefender 提供覆盖消费者端点、企业网络和 OEM 合作伙伴集成的网络安全软件与情报服务，覆盖 150 多个国家。消费者产品线从独立的 Antivirus Plus 延伸到 Total
              Security 和 Premium Security 套件，在 Windows、macOS、Android 和 iOS 上提供多平台防护，并通过 Bitdefender Central
              仪表盘管理身份盗窃防护和隐私工具。企业端产品以 GravityZone 为品牌，按组织成熟度设计套餐：Small Business 方案提供基础多层防护和自动勒索软件回滚，最多支持 100
              个端点；Enterprise 版本则提供带 SOAR 集成的完整扩展检测与响应（XDR）。与此同时，公司把基础反恶意软件引擎作为可嵌入 SDK
              授权给全球安全与网络厂商，形成高毛利技术授权收入，并反过来扩大核心研究规模。
