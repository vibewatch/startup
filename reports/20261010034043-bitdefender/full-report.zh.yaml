      - number: '1.3'
        title: 商业模式与运营版图
        blocks:
          - type: paragraph
            body: >-
              这项业务明显采取混合模式。消费者订阅与企业安全平台及托管服务并存；OEM 授权和捆绑合作又通过金融服务、保险、身份、通信、MSP 及科技品牌延伸分销。公司材料称其拥有超过 20,000 个合作伙伴，并向超过
              180 个品牌授权技术；这些数字由公司发布，不应解读为独立验证的客户数。二手来源报告 2024 年收入为 EUR330 million，但现有证据无法确认 2025 或 2026
              年收入、ARR、增长、毛利率、净留存、客户集中度或分部结构。因此，估值分析应把会计收入与经常性收入分开，并将当前财务规模视为未决事项。
            claimRefs:
              - CO003
              - CO005
              - CO008
              - CO011
              - CO012
      - number: '1.4'
        title: 里程碑、战略扩张与不利历史
        blocks:
          - type: paragraph
            body: >-
              其运营历史经历了从 SOFTWIN 杀毒产品到独立公司、国际办公室、收购、托管安全基础设施和企业创投部门的演变。Voyager Ventures 增加了一个聚焦网络安全、数据分析、自动化和 AI
              的早期投资工具；2026 年评估活动及奖项名单也显示产品营销和研究仍在持续。但记录并非全是正面内容：2010 年一次错误更新在全球范围内扰乱 Windows 系统；后来研究人员批评 Bitdefender
              公开披露 DarkSide 勒索软件弱点，因为这可能缩短解密器的有效寿命。这些是历史事件，并非当前事件的证据，但足以让产品发布控制和漏洞披露治理成为合理的尽调主题。
            claimRefs:
