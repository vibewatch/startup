chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、规模与当前状态
        blocks:
          - type: paragraph
            body: >-
              Bitdefender 是一家成立于 2001
              年、总部位于罗马尼亚布加勒斯特的私有网络安全公司。其产品覆盖消费者防护、端点安全、EDR/XDR、威胁情报、托管检测与响应、隐私、身份和诈骗防护。分销渠道包括线上直销订阅、企业产品、渠道合作伙伴、OEM
              授权，以及嵌入第三方捆绑包的技术。公开来源一贯将其业务范围置于 170 多个国家，并称其保护着数百万消费者、企业和政府环境。Wikipedia 报告称其 2026 年员工超过 2,000
              人，但现有证据没有公司申报文件或有日期的员工安排，因此该数字只是二手来源指标，并非经审计的员工数。
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO006
              - CO007
              - CO008
      - number: '1.2'
        title: 领导层、所有权与治理透明度
        blocks:
          - type: paragraph
            body: >-
              创始人 Florin Talpeș 仍担任
              CEO，并被描述为主要股东；这既带来持久的创始人与市场契合，也带来明显的关键人物依赖。现有来源确认了业务解决方案、产品和网络安全服务领域的运营负责人，但没有完整的执行委员会、董事会成员、独立董事代表性、继任计划或近期领导层变动记录。历史融资透明度同样不足：据报道，2017
              年一笔交易让 Vitruvian Partners 以超过 $600 million 的估值取得 30% 股权，此前 Axxess Capital
              已入股，但当前股权结构表和优先股堆叠均不可得。因此，治理和所有权仍是管理层尽调的核心工作流，而非已确定事实。
            claimRefs:
              - CO002
              - CO007
