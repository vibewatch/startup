            title: 私有公司披露是关键门槛
            body: 历史估值和收入指标无法证明当前企业价值、ARR、现金、债务、所有权偏好或流动性。在把公开规模主张用于投资模型前，应取得经审计财务报表和当前股权结构表。
            calloutType: risk
