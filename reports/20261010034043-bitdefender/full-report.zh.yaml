    claimRefs:
      - CR001
      - CR005
      - CR009
      - CR013
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 这条结构化决策链综合商业规模、技术验证、私有治理局限和估值倍数，最终建议继续研究。
    data:
      nodes:
        - id: N1
          label: 商业规模与全球基础
          description: 营收 €330M、员工 2,000+ 人，覆盖 170+ 个国家
          tone: positive
        - id: N2
          label: 渠道与 MSP 生态势头
          description: 在 2026 年 Omdia MSP Ecosystems Matrix 中获评 Champion
          tone: positive
        - id: N3
          label: 专有 IP 与威胁遥测
          description: 技术获 180+ 个全球品牌采用并用于 AI 研究
          tone: neutral
        - id: N4
          label: 私有治理与财务不透明
          description: ARR 未公开、现金流未披露、采用私有 S.R.L. 架构
          tone: warning
        - id: N5
          label: 估值立场与资本过剩压力
          description: 合理估值为 $2.0B-$2.4B，但优先股堆叠仍不确定
          tone: warning
        - id: N6
          label: 建议：继续研究
          description: 维持价格纪律，投资前要求提供经审计的 S-1 披露
          tone: neutral
      edges:
        - from: N1
          to: N2
          label: 分销扩张
        - from: N2
          to: N3
          label: GravityZone 平台验证
        - from: N3
          to: N4
          label: 私有披露上限
        - from: N4
          to: N5
          label: 资本结构稀释风险
        - from: N5
          to: N6
          label: 纪律化立场综合
    approximationNotes: 在经审计披露公布前，估值倍数和情景阈值反映市场估算及同行可比数据。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV010
