      - number: '4.4'
        title: 资本充足性、融资依赖与投资判断
        blocks:
          - type: paragraph
            body: >
              从资本充足性看，Bitdefender 依靠持续运营盈利，展现出稳定的自我融资能力。创投追踪记录显示，Bitdefender 历史外部创投资金仅七百万美元，另有机构资助轮。2017 年末，Vitruvian
              Partners 收购 30% 股权，推动了一笔估值超过 $600 million 的重大私募交易。虽然 2021 年末出现首次公开募股（IPO）申报的报道，公司推迟了上市，至 2026 年仍保持私有。

              UpMarket 等二级经纪平台上的 IPO 前股权交易让合格投资者能够有限接触私有股份，但这些交易受转让限制、流动性折价和信息不对称约束。从投资判断角度看，Bitdefender
              是一家成熟、能够产生现金的网络安全资产，拥有强品牌和端点遥测。不过，在取得经审计的合并资产负债表、债务义务和经验证的净留存指标前，无法形成明确的投资建议。
