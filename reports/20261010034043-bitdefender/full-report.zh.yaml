  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与核心竞争者画像
        blocks:
          - type: paragraph
            body: >-
              Bitdefender 横跨消费者端点防护、MSP 设备群和中端市场企业检测与响应，参与一个两极分化的网络安全市场。在企业领域，Bitdefender GravityZone 面对 Trend Micro
              等成熟平台，也面对 Xcitium 等专业端点遏制厂商和 Malwarebytes 等轻量级修复专家。平台巨头依靠庞大的企业现场销售和云市场协议；Bitdefender
              则以集成式单代理架构建立防御力，把端点防护、检测和扩展响应统一起来，避免多代理带来的性能损耗。此外，Bitdefender 还通过 OEM 合作伙伴获得重要市场杠杆，将底层扫描引擎和全球威胁情报授权给全球 200
              多个科技品牌。这种双重定位让它在直销商业层和嵌入式合作伙伴生态中都拥有结构性分销触达。
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP010
              - CP012
      - number: '3.2'
        title: 平台架构与效果差异化
        blocks:
          - type: paragraph
            body: >-
              独立测试机构的技术评测显示，Bitdefender 的执行前防护效果持续位居前列。在 AV-Comparatives Advanced Threat Protection 评测中，GravityZone
              在载荷执行前阻止了大多数威胁；2026 年 6 月 AV-TEST 评测则给 Bitdefender Total Security 27.0 在防护、性能和易用性三项各满分 18
              分。与会造成明显端点延迟或严重游戏帧率损失的竞争产品不同，Bitdefender 的云端扫描和 Game Profile 架构把帧率下降限制在 0% 至 2%，而 Norton 360 for Gamers 为
              2% 至 3%。在企业环境中，GravityZone 内置 Proactive Hardening 和 Attack Surface Reduction，无需辅助代理即可拦截利用现成工具的攻击。IDC
              MarketScape 于 2026 年 7 月将 Bitdefender 归为中端市场 MDR 的 Major Player，认可其 Cyber Intelligence Fusion Cell
              和原生事件关联能力。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP011
              - CP014
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
