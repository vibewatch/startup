  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管合规与法律架构
        blocks:
          - type: paragraph
            body: >-
              Bitdefender 处于日益复杂的国际监管环境中，需要在跨境欧盟指令与全球商业合规要求之间取得平衡。根据欧盟《数字运营韧性法案》（DORA），该法案于 2023 年 1 月实施、2025 年 1
              月起强制适用，金融机构及其关键 ICT 服务提供商必须建立统一风险管理架构、强制事件分类和威胁导向的渗透测试。Bitdefender 将 GravityZone
              定位为集中式合规框架，帮助金融行业客户履行法定韧性义务。同时，公司在信息安全政策范围内维持 ISO 27001 和 SOC2 Type2
              正式认证，为企业和消费者云遥测提供基础性的第三方验证。就消费者数据隐私而言，Bitdefender
              执行严格的数据留存政策：许可及合同相关记录保留合同期限再加五年，以应对潜在的法律主张与合同索赔请求；同时在欧盟和美国使用相互隔离的数据处理商。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
