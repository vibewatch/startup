  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 该层级金字塔展示网络安全支出从广义全球 IT 安全，到 Bitdefender 可服务的端点与 MDR 利基市场。
    data:
      items:
        - label: 全球信息安全与风险管理
          level: 1
          value: $215B+ (2024-2026 est.)
          description: 覆盖全部软件、基础设施和服务的广义全球网络安全支出
        - label: 端点安全与网络韧性市场
          level: 2
          value: $15B - $20B
          description: 企业和消费者端点保护、反恶意软件与设备防护
        - label: EDR 与扩展检测和响应（XDR）
          level: 3
          value: $5B - $8B
          description: 高级端点检测、行为启发式分析和跨遥测关联
        - label: 托管检测和响应（MDR）
          level: 4
          value: $3B - $6B
          description: 全天候外包安全运营中心服务和人工主导的威胁搜寻
        - label: 可服务的中端市场与 MSP 安全
          level: 5
          value: $1.5B - $2.5B
          description: Bitdefender 积极竞争的精简型企业和 MSP 交付网络安全套件
        - label: Bitdefender 已实现收入基数
          level: 6
          value: €330M (2024 reported) / ~$255M ARR est.
          description: 公司报告的消费者订阅、企业 GravityZone 和 OEM 授权收入
    approximationNotes: 广义市场层级反映行业共识规模估算；Bitdefender 的已实现层级反映公司报告的营业额和独立 ARR 估算，而非经审计的分部 ARR。
    claimRefs:
      - CM007
      - CM008
      - CM009
      - CM013
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 展示中端市场端点保护和 MDR 在防护效果与企业分销覆盖范围上的竞争定位。
    data:
      xAxis:
        label: 端点防护效果与架构（1-5）
        min: 1
        max: 5
      yAxis:
        label: 企业 GTM 与托管服务覆盖范围（1-5）
        min: 1
        max: 5
      points:
        - label: Bitdefender
          x: 4.8
          'y': 3.6
          description: 行业领先的威胁防护和统一单一代理；不断扩大的中端市场 MDR 覆盖范围
        - label: Trend Micro
          x: 4.2
          'y': 4.6
          description: 广泛的企业分销、云市场规模和销售驱动的企业关系
        - label: Norton (Gen Digital)
          x: 4.4
          'y': 2.2
          description: 凭借身份安全捆绑占据主导的消费者和专业消费者市场；企业 MDR 存在感极小
        - label: Xcitium
          x: 3.7
          'y': 2.8
          description: 面向 SMB 和 MSP 的模块化 ZeroDwell 隔离；高端企业渗透有限
        - label: Malwarebytes
          x: 3.9
          'y': 2.4
          description: 快速轻量的修复引擎；主要覆盖专业消费者和入门级企业
        - label: Microsoft Defender
          x: 4.1
          'y': 4.8
          description: 无处不在的操作系统捆绑和企业 E5 许可采用；默认的现状竞争者
    approximationNotes: 定位分数综合独立实验室测试（AV-TEST、AV-Comparatives）、IDC MarketScape 中端市场评估和市场分销指标后按序数衡量。
    claimRefs:
      - CP014
      - CP015
  - id: FI001
    title: 收入模型桥接
    type: waterfall
    summary: 说明性商业转换瀑布图展示总开票额如何转化为净确认收入和估算毛利。
    approximationNotes: 瀑布图数值依据报告的 $435M 收入规模和行业运营成本基准，反映标准化软件经济模型。
    claimRefs:
      - CI001
      - CI005
      - CI006
      - CI009
      - CI010
    data:
      items:
        - label: 总开票额
          value: 480
          unit: USD M
          detail: 渠道合作伙伴折扣前，消费者、企业和 MSP 渠道的总开票额
        - label: 合作伙伴与渠道利润
          value: -45
          unit: USD M
          detail: 间接渠道中批发分销商折扣和 MSP 合作伙伴利润分成
        - label: 净确认收入
          value: 435
          unit: USD M
          detail: 2024 财年全球市场的年度报告收入运行率
        - label: 云与遥测托管
          value: -35
          unit: USD M
          detail: 威胁遥测处理和 GravityZone 云传感器的基础设施支出
        - label: SOC 与安全运营
          value: -42
          unit: USD M
          detail: 罗马尼亚、美国和新加坡全天候 MDR SOC 中心的人员及运营成本
        - label: 净毛利
          value: 358
          unit: USD M
          detail: 扣除运营管理费用前、以软件为主的估算毛利基准
  - id: FE001
    title: Bitdefender 多层安全与架构栈
    type: stack
    summary: 结构层覆盖客户端端点引擎、云端威胁情报和全球托管安全运营。
    data:
      layers:
        - label: 托管运营与人工专业能力层
          detail: 全球全天候安全运营中心提供托管威胁搜寻和主动修复。
          modules:
            - San Antonio SOC
            - Bucharest SOC
            - Singapore SOC
            - 事件响应团队
        - label: 企业扩展检测与响应（XDR）平台
          detail: 集中的 GravityZone Control Center 提供多租户编排、分析和 SOAR 集成。
          modules:
            - GravityZone Control Center
            - 跨端点关联
            - SOAR 编排
            - 策略管理
        - label: 全球威胁情报与遥测网络
          detail: 分布式遥测网格从数亿个受保护端点采集威胁指标。
          modules:
            - 全球遥测采集
            - 威胁情报源
            - 解密研究
            - AI/ML 样本训练
        - label: 行为分析与漏洞利用防护引擎
          detail: 动态运行时分析识别零日漏洞利用、脚本异常和勒索软件行为。
          modules:
            - 进程行为监控
            - 漏洞利用防御
            - 勒索软件缓解与回滚
            - 网络攻击防御
        - label: 核心反恶意软件检测引擎（SDK Core）
          detail: 高性能多线程检测结合静态特征码、启发式分析和机器学习模型。
          modules:
            - 特征码扫描器
            - 启发式分析器
            - 机器学习分类器
            - SDK 授权封装
        - label: 跨平台客户端代理与系统抽象层
          detail: 轻量端点代理运行于客户端端点、服务器、虚拟机和移动设备。
          modules:
            - Windows 内核驱动
            - macOS 系统扩展
            - Linux 代理
            - 移动防护（iOS/Android）
    approximationNotes: 架构层根据技术文档抽象呈现 Bitdefender 的专有客户端和云服务拓扑。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE007
      - CE009
      - CE015
  - id: FU001
    title: 客户采用触点与扩张循环
    type: journey-map
    summary: 六个不同的采用触点连接直接获客、渠道交付、嵌入式分销和反馈驱动的扩张。
    approximationNotes: 该概念旅程由公司和合作伙伴材料整理而成；并非实测转换漏斗，也不暗示阶段间转化率。
    data:
      items:
        - label: 1. 直接发现
          detail: 小企业或中端市场买家评估商业安全产品。
          touchpoints:
            - 商业产品页面
        - label: 2. 渠道评估
          detail: MSP 或转售商测试平台，并评估服务交付。
          touchpoints:
            - 合作伙伴赋能
            - NFR 访问权限
        - label: 3. 嵌入式分销
          detail: 银行、保险机构、身份服务商、金融科技公司、ISP 或电信运营商将防护加入捆绑产品。
          touchpoints:
            - 嵌入式 Bitdefender
            - SDK / API 集成
        - label: 4. 运营部署
          detail: 客户或 MSP 将防护、检测和响应工作流集中管理。
          touchpoints:
            - GravityZone
            - MDR
        - label: 5. 扩张
          detail: 合作伙伴增加端点、托管服务或捆绑层级。
          touchpoints:
            - 一级合作伙伴增长
            - 高级捆绑产品
        - label: 6. 反馈与续约决策
          detail: 评价和 NPS 提供满意度信号，但留存经济仍属私有信息。
          touchpoints:
            - 同业评价
            - NPS
            - cohort 尽调
    claimRefs:
      - CU003
      - CU004
      - CU012
      - CU013
      - CU014
      - CU015
