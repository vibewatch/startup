      - number: '4.3'
        title: 成本结构、利润率透明度与单位经济
        blocks:
          - type: paragraph
            body: >
              Bitdefender 的运营成本结构以位于罗马尼亚布加勒斯特的工程、威胁情报和企业研究基地为特色。公司全球员工超过 2,000
              人，在东欧维持核心工程和安全运营中心（SOC）人才，使其相较北美网络安全同行拥有结构性运营费用优势。位于得州圣安东尼奥、罗马尼亚布加勒斯特和新加坡的分布式 SOC 设施支持全天候威胁搜寻和 MDR
              交付，同时把人员开支分散到成本较低的运营中心。

              尽管运营规模清晰可见，私有公司披露边界仍遮蔽了单位经济。毛利率、美元口径净收入留存（NRR）、客户获取成本（CAC）回收期和企业队列流失等关键机构指标都未公开披露。以软件为主的端点防护授权通常拥有较高毛利率，但人工密集型
              24/7 MDR 服务占比上升会带来交付成本，必须在确认性尽调中按分部核验。
