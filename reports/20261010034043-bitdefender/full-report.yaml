      - number: '1.3'
        title: Business model and operating footprint
        blocks:
          - type: paragraph
            body: >-
              The business appears deliberately hybrid. Consumer subscriptions sit alongside enterprise security
              platforms and managed services, while OEM licensing and bundle partnerships extend distribution through
              financial-services, insurance, identity, telecom, MSP, and technology brands. Company materials describe
              more than 20,000 partners and technology licensing by more than 180 brands; those figures are
              company-issued and should not be read as independently verified customer counts. A secondary source
              reports EUR330 million of 2024 revenue, but the allocated evidence does not establish 2025 or 2026
              revenue, ARR, growth, gross margin, net retention, customer concentration, or segment mix. Any valuation
              analysis should therefore keep accounting revenue separate from recurring revenue and treat current
              financial scale as unresolved.
            claimRefs:
