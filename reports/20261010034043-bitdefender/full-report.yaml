              - CU013
              - CU014
              - CU015
      - number: '6.2'
        title: Adoption signals and reference quality
        blocks:
          - type: paragraph
            body: >-
              The clearest current adoption signal is a company-published summary of the 2026 Gartner Peer Insights
              Voice of the Customer report. Bitdefender reports a 4.8-out-of-5 rating based on 223 reviews as of
              November 2025 and says 96% of those reviewers would recommend GravityZone (CU005, CU006). Those are
              review-platform metrics with a disclosed sample, not renewal or usage cohorts. Distributor Climb presents
              the San Antonio Spurs, Ferrari, Technology By Design, and Greenman-Pedersen as named references (CU007).
              The page includes customer-attributed operational statements about consolidated alert handling,
              threat-intelligence use, earlier prevention, and attack-surface reduction (CU008, CU009, CU010, CU011).
              However, it does not disclose contract values, deployment dates, endpoint counts, renewal history, or
              independently measured before-and-after outcomes. Accordingly, these references establish named use cases
              but not the durability or economic quality of the customer base.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
