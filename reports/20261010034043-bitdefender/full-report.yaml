              - CO005
              - CO008
              - CO011
              - CO012
      - number: '1.4'
        title: Milestones, strategic expansion, and adverse history
        blocks:
          - type: paragraph
            body: >-
              The operating history shows a progression from SOFTWIN's antivirus product to an independent company,
              international offices, acquisitions, managed-security infrastructure, and a corporate venture arm. Voyager
              Ventures adds an early-stage investment vehicle focused on cybersecurity, data analytics, automation, and
              AI, while the 2026 assessment campaign and award listing show continued product marketing and research
              activity. The record is not uniformly positive: a faulty 2010 update disrupted Windows systems globally,
              and researchers later criticized Bitdefender's public disclosure of a DarkSide ransomware weakness because
              it could shorten the useful life of decryptors. These are historical events, not evidence of a current
              incident, but they make product-release controls and vulnerability-disclosure governance appropriate
              diligence topics.
