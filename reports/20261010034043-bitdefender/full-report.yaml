  - id: FU001
    title: Customer adoption surfaces and expansion loops
    type: journey-map
    summary: >-
      Six distinct adoption surfaces connect direct acquisition, channel delivery, embedded distribution, and
      feedback-led expansion.
    approximationNotes: >-
      Conceptual journey assembled from company and partner materials; it is not a measured conversion funnel and
      implies no stage-to-stage rates.
    data:
      items:
        - label: 1. Direct discovery
          detail: Small-business or mid-market buyer evaluates a business security offer.
          touchpoints:
            - Business product page
        - label: 2. Channel evaluation
          detail: An MSP or reseller tests the platform and evaluates service delivery.
          touchpoints:
            - Partner enablement
            - NFR access
        - label: 3. Embedded distribution
          detail: A bank, insurer, identity provider, fintech, ISP, or telco adds protection to a bundle.
          touchpoints:
            - Embedded Bitdefender
            - SDK/API integration
        - label: 4. Operational deployment
          detail: The customer or MSP centralizes protection, detection, and response workflows.
          touchpoints:
            - GravityZone
            - MDR
        - label: 5. Expansion
          detail: Partners add endpoints, managed services, or bundle tiers.
          touchpoints:
            - Tier-one partner growth
            - Premium bundle
        - label: 6. Feedback and renewal decision
          detail: Reviews and NPS provide satisfaction signals, while retention economics remain private.
          touchpoints:
            - Peer reviews
            - NPS
            - Cohort diligence
    claimRefs:
      - CU003
      - CU004
      - CU012
      - CU013
      - CU014
      - CU015
