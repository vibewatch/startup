chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, scale, and current posture
        blocks:
          - type: paragraph
            body: >-
              Bitdefender is a private cybersecurity company founded in 2001 and headquartered in Bucharest, Romania.
              Its product surface spans consumer protection, endpoint security, EDR/XDR, threat intelligence, managed
              detection and response, privacy, identity, and scam protection. Distribution combines direct online
              subscriptions, enterprise offerings, channel partners, OEM licensing, and technology embedded in
              third-party bundles. Public sources consistently place the company in more than 170 countries and describe
              millions of protected consumer, business, and government environments. Wikipedia reports more than 2,000
              employees in 2026, but the allocated evidence does not provide a company filing or dated workforce
              schedule, so that figure remains a secondary-source indicator rather than an audited headcount.
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO006
