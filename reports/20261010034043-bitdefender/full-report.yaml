  - id: TV002
    title: Thesis / Anti-Thesis Table
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counterargument
      - What Would Change View
    rows:
      - - Commercial Traction
        - Profitable €330M scale in 2024 with over 2,000 employees and sustained cash generation
        - Revenue opacity with independent estimates like GetLatka estimating only $254.9M ARR
        - Audited consolidated revenue growth breaking out enterprise versus consumer recurring revenue
      - - Product & Channel
        - Champion status in Omdia 2026 MSP Matrix and GravityZone adoption across 170+ countries
        - Consumer digital protection represents large exposure facing commoditization and platform bundling
        - Demonstrated sustained net retention rate exceeding 115% in mid-market and enterprise accounts
      - - Technology Moat
        - Proprietary antimalware IP licensed by 180+ global technology brands and extensive AI threat telemetry
        - High-profile past incidents including DarkSide decryptor controversy and 2010 false-positive crash
        - Third-party attestation of zero-day enterprise detection superiority over crowd-scale peers
      - - Capital Allocation
        - Internal venture arm Voyager Ventures active in European AI/cybersecurity seed co-investments
        - Capital allocation to external seed ventures while private preference waterfall remains undisclosed
        - Full cap-table transparency revealing common equity share and liquidation preference seniorities
    notes: >-
      Core thesis pillars contrast audited/reported milestones with structural private disclosures and operational
      counter-weights.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV012
  - id: TV003
    title: Bull / Base / Bear Scenario Table
    columns:
      - Scenario
      - Core Assumptions
      - Implied Valuation Logic
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - Enterprise XDR and MSP ARR expands >20% YoY; successful US IPO filing at 7.0x EV/Revenue
        - $2.8B - $3.2B valuation ($400M+ revenue baseline)
        - Failure to maintain gross margins above 75% or US enterprise go-to-market stall
        - 25%
      - - Base Case
        - High single-digit to low double-digit revenue growth (8-12%); consumer stable; 5.5x EV/Sales multiple
        - $2.0B - $2.4B valuation (anchored near €330M-€360M revenue)
        - Prolonged pre-IPO holding period and lack of liquidity for minority equity holders
        - 55%
      - - Bear Case
        - Multiple compression to 3.5x legacy peer levels; consumer churn accelerates against platform suites
        - $1.2B - $1.5B valuation (down-round risk vs 2017 entry & private marks)
        - Aggressive price discounting by platform giants and senior liquidation preference dilution
        - 20%
    notes: >-
      Scenarios model revenue ranges against cybersecurity sector public multiples; probability signals reflect current
      pre-IPO private stance.
    claimRefs:
      - CV004
      - CV013
      - CV014
