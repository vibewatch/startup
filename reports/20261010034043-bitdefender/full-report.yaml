            integration.
          modules:
            - GravityZone Control Center
            - Cross-Endpoint Correlation
            - SOAR Orchestration
            - Policy Management
        - label: Global Threat Intelligence & Telemetry Network
          detail: Distributed telemetry grid ingesting threat indicators from hundreds of millions of protected endpoints.
          modules:
            - Global Telemetry Ingestion
            - Threat Intelligence Feeds
            - Decryption Research
            - AI/ML Sample Training
        - label: Behavioral Analytics & Exploit Prevention Engine
          detail: Dynamic runtime analysis identifying zero-day exploits, script anomalies, and ransomware behaviors.
          modules:
