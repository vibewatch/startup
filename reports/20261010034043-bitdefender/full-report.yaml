  - id: FE001
    title: Bitdefender multilayered security and architecture stack
    type: stack
    summary: >-
      Structural layers spanning client endpoint engines, cloud threat intelligence, and global managed security
      operations.
    data:
      layers:
        - label: Managed Operations & Human Expertise Layer
          detail: Global 24/7 Security Operations Centers delivering managed threat hunting and active remediation.
          modules:
