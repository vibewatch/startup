      - number: '1.2'
        title: Leadership, ownership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Founder Florin Talpeș remains chief executive and is described as the main shareholder, creating durable
              founder-market fit but also material key-person dependence. The current source set identifies operating
              leaders in business solutions, product, and cybersecurity services, yet it does not establish a complete
              executive committee, board membership, independent-director representation, succession plan, or recent
              leadership-change log. Historical financing visibility is similarly incomplete: a 2017 transaction
              reportedly gave Vitruvian Partners a 30% stake at a valuation above $600 million, following Axxess
              Capital's earlier entry, but no current cap table or preference stack is available. Governance and
              ownership therefore remain central management-diligence workstreams rather than settled facts.
