  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: funding-and-ownership
      missingEvidence: >-
        Current capitalization table, fully diluted ownership, preferred-share terms, debt and
        credit facilities, secondary transactions, total capital raised, and a current valuation.
      whyItMatters: >-
        Historical stake sales cannot establish present ownership, liquidation rights, leverage,
        or the price investors would pay today.
      diligencePath: >-
        Request the board-approved cap table, shareholder register, financing documents, debt
        schedule, and the most recent independent valuation or arm's-length transaction materials.
      relatedQuestionRefs: [QO004]
      relatedTableRefs: [TO001, TO003]
    - type: enumeration-incomplete
      severity: material
      topic: governance-and-leadership
      missingEvidence: >-
        Complete executive roster, board and observer seats, director independence, committee
        mandates, succession planning, and a dated log of material leadership changes.
      whyItMatters: >-
        Founder control and an incomplete governance map prevent assessment of oversight,
        succession resilience, and investor protections.
      diligencePath: >-
        Obtain organization charts, board minutes and charters, director biographies, employment
        agreements, delegation matrices, and the last three years of executive changes.
      relatedQuestionRefs: [QO002, QO003]
      relatedTableRefs: [TO002, TO003]
    - type: missing-source
      severity: material
      topic: financial-and-customer-metrics
      missingEvidence: >-
        Audited 2025-2026 revenue, ARR, growth, gross margin, cash flow, cash, debt, customer count,
        segment mix, concentration, renewal rates, and net revenue retention.
      whyItMatters: >-
        Company scale claims and a 2024 revenue datapoint are insufficient to assess recurring
        economics, financial durability, or valuation.
      diligencePath: >-
        Request audited consolidated statements, monthly recurring-revenue bridges, customer
        cohorts, channel-versus-direct mix, and concentration schedules reconciled to the ledger.
      relatedQuestionRefs: [QO005]
      relatedTableRefs: [TO001]
