      - ["Vitruvian Partners", "Investor since reported 2017 transaction", "Reported 30% stake at entry", "Historical secondary-source report", "Confirm current stake, preferences, and exit rights"]
      - ["Axxess Capital", "Earlier external investor", "Historical capital provider at 2007 separation", "Historical secondary-source report", "Confirm whether any economic or governance rights remain"]
      - ["Channel and OEM partners", "Distribution and technology-licensing ecosystem", "Company reports 20,000+ partners and 180+ licensed brands", "Company-issued figures", "Obtain partner concentration, economics, churn, and contract terms"]
      - ["Consumer, business, and government users", "End customers and protected environments", "Millions of environments claimed across 170+ countries", "Company-issued scale claim", "Obtain exact paying-customer count, segment mix, retention, and concentration"]
    notes: >-
      Partial map combining historical ownership reporting with company-issued ecosystem scale;
      reported partner and user counts are not substitutes for a current cap table or customer ledger.
