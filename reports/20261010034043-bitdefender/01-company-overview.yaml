callouts:
  - calloutType: risk
    title: Private-company disclosure is the gating issue
    body: >-
      Historical valuation and revenue indicators do not establish current enterprise value, ARR,
      cash, debt, ownership preferences, or liquidity. Obtain audited statements and the current
      capitalization table before using public scale claims in an investment model.
    claimRefs: [CO007, CO008]
