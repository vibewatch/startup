chapter:
  number: 6
  title: "Customers"
  summary: "Bitdefender serves small businesses, mid-market organizations, MSPs, and consumer-bundle partners through direct, channel, and embedded routes. Recent review and partner metrics indicate customer approval and channel momentum, but the public evidence does not disclose retention, churn, customer concentration, or segment revenue."
sections:
  - id: "segments-and-routes-to-market"
    title: "Segments and routes to market"
    body: >-
      Bitdefender addresses several distinct buying motions rather than a single enterprise
      profile. Its business site directs separate offers to small businesses, mid-market
      organizations with 500 to 5,000 users, and managed service providers, while its 2026
      bundle brochure targets credit bureaus, identity providers, insurers, banks, fintechs,
      MSPs, ISPs, and family-protection brands (CU001, CU002). The bundle route can use a
      Bitdefender-branded embedded offer with a stated four-to-eight-week time to market or a
      more customized SDK/API model (CU003). A company-spokesperson interview also reports
      support for more than 41,000 channel and MSP partners globally (CU004). These routes
      widen distribution, but the evidence does not quantify revenue mix by direct, channel,
      MSP, or embedded sales. HubSpot separately reports that Bitdefender increased leads by
      more than 50% after adopting its platform; this is a demand-generation result, not proof
      of paid-product retention (CU012).
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU012"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-and-reference-quality"
    title: "Adoption signals and reference quality"
    body: >-
      The clearest current adoption signal is a company-published summary of the 2026 Gartner
      Peer Insights Voice of the Customer report. Bitdefender reports a 4.8-out-of-5 rating
      based on 223 reviews as of November 2025 and says 96% of those reviewers would recommend
      GravityZone (CU005, CU006). Those are review-platform metrics with a disclosed sample,
      not renewal or usage cohorts. Distributor Climb presents the San Antonio Spurs, Ferrari,
      Technology By Design, and Greenman-Pedersen as named references (CU007). The page
      includes customer-attributed operational statements about consolidated alert handling,
      threat-intelligence use, earlier prevention, and attack-surface reduction (CU008,
      CU009, CU010, CU011). However, it does not disclose contract values, deployment dates,
      endpoint counts, renewal history, or independently measured before-and-after outcomes.
      Accordingly, these references establish named use cases but not the durability or
      economic quality of the customer base.
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "durability-expansion-and-risk"
    title: "Durability, expansion, and concentration risk"
    body: >-
      Bitdefender's bundle brochure supplies two useful but company-issued expansion signals:
      it reports 53% endpoint-revenue growth from tier-one partners in 2025 and NPS above 60
      across deployments (CU013, CU014). Neither metric identifies the starting revenue base,
      number of partners or deployments, geographic mix, collection period, or relationship
      to consolidated revenue. The reviewed public materials also do not disclose NRR, GRR,
      logo churn, contract length, cohort expansion, top-customer exposure, or distributor
      concentration (CU016). This prevents a direct test of whether channel breadth converts
      into durable recurring economics. Customer trust also carries an explicit limitation:
      Bitdefender's home-user privacy policy says internet transmission cannot be guaranteed
      secure until information reaches its servers and is undertaken at the user's risk
      (CU015). The diligence priority is therefore a customer and partner cohort export,
      reconciled to revenue, rather than additional logo or award evidence.
    claimRefs:
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
