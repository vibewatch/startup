callouts:
  - calloutType: insight
    title: "TAM Estimates Vary 4x Depending on Market Boundary"
    body: "The difference between $1.9B (narrow audit management software) and $8B+ (GRC/compliance) reflects definitional choices, not factual disagreement. DataSnipper's addressable market depends heavily on whether it expands beyond Excel-native audit workflows into broader financial compliance use cases."
    claimRefs: [CM027, CM028, CM029]

  - calloutType: strength
    title: "Early Penetration in a Structurally Growing Market"
    body: "At ~1–3% SAM penetration with all Big Four as customers, DataSnipper sits at an early-stage compounding trajectory in a market growing 10–16% annually. Even a modest increase in per-seat pricing through AI tier upsell (58% of new customers choose AI packages) would materially shift SAM economics."
    claimRefs: [CM010, CM011, CM031]

  - calloutType: risk
    title: "Excel Dependency Creates Concentration Risk"
    body: "DataSnipper's Excel-native positioning is its primary differentiator and its primary constraint. If Microsoft shifts Excel toward a different paradigm (Fabric, Copilot-native workflows) or if audit firms migrate to cloud-native engagement platforms that bypass Excel, DataSnipper's SAM could contract faster than general market growth compensates."
    claimRefs: [CM024, CM025, CM030]

  - calloutType: assumption
    title: "ARR Estimate Is Third-Party Aggregator Data"
    body: "The $44.5M ARR figure used throughout this chapter is from Latka/Sacra (2025), not confirmed by DataSnipper. Actual ARR could be materially higher (consistent with $1B valuation at standard SaaS multiples of 20–30x) or lower. This uncertainty propagates through all penetration and SAM estimates."
    claimRefs: [CM032, CM033]

