  topStrengths:
    - Excel 原生 AI 交付具备独特防御性——它是唯一嵌入审计师日常工具的审计 AI 平台
    - Big Four 会计师事务所均已确认是客户，且有文档化部署
    - Microsoft 联合开发合作（2025 年 7 月）把首要竞争威胁拉成商业协作者
    - 2026 年新增客户中 58% 选择 AI 套餐，显示客户愿意为更高毛利的 AI 层级付费
    - AI 平台演进（AI Extractions、Excel Agents）推动 DataSnipper 从工具变成智能工作流平台
  topRisks:
    - Microsoft Copilot for Finance 正扩展到 Excel 文档抽取，可能从 DataSnipper 自身技术栈内部侵蚀核心差异化
    - 客户集中——估计 40-50% ARR 来自 Big Four（4 家），单一客户流失情景具备生存级风险
    - NRR 或总流失数据未公开——收入质量和留存画像无法验证
    - 四家 Big Four 同时在自建内部 AI 审计工具，未来 3-5 年可能替代 DataSnipper
    - PCAOB 关于 agentic AI 的指引演进可能限制 Excel Agents，即 DataSnipper 毛利最高的产品层级
  unresolvedGaps:
    - 需要经审计 ARR 和 NRR 来验证增长质量与留存——第三方 $44.5M 估计未获验证
    - Big Four 合同条款（AI 责任条款、最低承诺）未知，挡住客户集中风险评估
    - AI Extractions 准确率 benchmark 未公开——专业级质量声明无法验证
    - Microsoft Copilot 竞争应急方案未公开——核心悲观情景的缓释手段未知
    - 毛利率拆分不可得——单位经济和 AI 层级盈利能力无法验证
