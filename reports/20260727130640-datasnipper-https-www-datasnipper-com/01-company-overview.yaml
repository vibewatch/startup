company:
  name: "DataSnipper"
chapter:
  number: 1
  title: "Company Overview"
  summary: "DataSnipper is an Amsterdam-based AI-powered intelligent automation platform embedded natively in Microsoft Excel, enabling auditors and finance professionals to automate document extraction, validation, and reconciliation workflows. Founded in 2017 by Kai Bakker, Jonas Ruyter, and Maarten Alblas, the company reached unicorn status in February 2024 with a $100 million Series B led by Index Ventures at a $1 billion valuation, serving over 500,000 users across 125+ countries including all Big Four accounting firms."

sections:
  - id: identity-and-business-model
    title: "Identity and Business Model"
    body: "DataSnipper is an intelligent automation platform operating natively within Microsoft Excel, purpose-built for audit and finance professionals. The company was incorporated in Amsterdam, Netherlands in 2017 and has grown from a bootstrapped startup into a globally recognized audit technology unicorn. Its core value proposition is enabling auditors to 'snip' data from any type of document—invoices, bank statements, PDFs, scanned receipts—and automatically link, match, and reconcile those values with cells in Excel spreadsheets. This eliminates the majority of manual, repetitive checking work that constitutes a large portion of an auditor's day. By embedding directly into Excel rather than requiring users to adopt a separate tool, DataSnipper removes the adoption barrier inherent in competing solutions that demand workflow changes. The company operates a SaaS subscription model, pricing per user and offering tiered plans that range from core document automation to full AI-powered suites including DocuMine and Excel Agents. As of 2026, the company offers an agentic AI platform branded as the platform for audit and finance teams, with AI agents capable of executing multi-step audit workflows end-to-end. DataSnipper's product is used across external audit, internal audit, tax advisory, forensic accounting, and financial control functions, positioning it at the intersection of B2B SaaS and professional services automation."
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO008]
    tableRefs: [TO001]
    figureRefs: [FO002]

  - id: founding-and-leadership
    title: "Founding and Leadership"
    body: "DataSnipper was co-founded in 2017 by Kai Bakker, Jonas Ruyter, and Maarten Alblas, each of whom brought backgrounds in accounting technology and entrepreneurship. The founders recognized that auditors spent enormous amounts of time on manual document checking and reconciliation—work that was repetitive, error-prone, and deeply unsatisfying—and built an initial product that lived inside Excel, the auditor's native environment. The company operated on its own cash flow for approximately five years before accepting external capital, a rarity in venture-backed SaaS and a signal of strong product-market fit. In 2023, Vidya Peters was appointed as CEO to lead DataSnipper's global scaling phase. Peters brings C-suite experience from high-growth technology companies: she was Chief Operating Officer at Marqeta (where she managed a 350+ person go-to-market organization and helped the company go public in 2021), Chief Marketing Officer at MuleSoft (which went public in 2017 and was later acquired by Salesforce), and a product and marketing leader at Intuit, where she developed deep familiarity with the accounting and financial software industry. Founders Maarten Alblas and Jonas Ruyter transitioned to board and advisory roles upon Peters' appointment, continuing to contribute on product innovation and strategy. Thilo Richter serves as VP of Product and Engineering. As of early 2026, the company has approximately 14 main executives and roughly 289 employees globally. The combination of domain-expert founders and a seasoned commercial CEO provides DataSnipper with both product credibility and go-to-market execution capability."
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    tableRefs: [TO002]

  - id: funding-and-capital-structure
    title: "Funding and Capital Structure"
    body: "DataSnipper's capital formation reflects a conservative, milestone-driven approach. The company did not seek external venture capital until September 2022, when Insight Partners led the first disclosed funding round of approximately $16 million, validating its rapid commercial traction. By early 2024, the company's revenue growth trajectory—more than doubling annually for multiple years—attracted Tier 1 growth investors. In February 2024, DataSnipper closed a $100 million Series B led by Index Ventures at a $1 billion post-money valuation, officially achieving unicorn status. Insight Partners and ICONIQ Growth also participated in the Series B round. As of July 2026, the total capital raised by DataSnipper is approximately $116 million across both rounds. The company has no public debt or credit facilities disclosed. The $1 billion valuation represents a revenue multiple of approximately 22x against its reported $44.5 million ARR as of 2025, consistent with growth-stage SaaS multiples for companies doubling revenue annually. Index Ventures partner Hannah Seal is reported as a board member following the Series B. The company's bootstrapped origins and self-reported profitability before external funding suggest a capital-efficient operating model, though post-funding hiring and global expansion will have increased cash burn. No Series C or additional funding has been publicly announced as of July 2026."
    claimRefs: [CO017, CO018, CO019, CO020, CO021, CO022, CO023, CO024]
    tableRefs: [TO003]

  - id: scale-and-market-position
    title: "Scale and Market Position"
    body: "DataSnipper has achieved significant commercial scale for a company founded just nine years ago. At the time of its February 2024 Series B announcement, the platform served over 400,000 auditors in 125 countries, including all four Big Four accounting firms: Deloitte, Ernst & Young, KPMG, and PricewaterhouseCoopers. By mid-2026, user counts have grown to approximately 600,000 across 175+ countries, with corporate customers estimated at over 2,200. This user base extends beyond external audit: DataSnipper has made significant inroads into internal audit at banking, insurance, and manufacturing companies, as well as tax advisory and forensic accounting teams. Non-audit enterprise clients include Hilton Hotels, Siemens, Frontier Airlines, and the Government of Queensland, Australia. The company's 2024 Annual Recurring Revenue was reported at $44.5 million by data service Latka, with a self-reported growth rate of doubling annually for multiple years. DataSnipper has been recognized as the fastest-growing technology company in the Netherlands for two consecutive years, citing 6,715% cumulative turnover growth. The company is consistently listed on the Forbes Fintech 50 and has received industry recognition including TIME Best Inventions 2025. The Net Promoter Score and word-of-mouth adoption through accounting firm networks have been cited as key growth drivers: once adopted by a Big Four firm, DataSnipper's tools frequently spread to the firm's corporate clients as well."
    claimRefs: [CO025, CO026, CO027, CO028, CO029, CO030, CO031, CO032]

  - id: milestones-and-strategic-events
    title: "Milestones and Strategic Events"
    body: "DataSnipper's journey from founding to unicorn status involved several inflection points. The company was founded in Amsterdam in 2017 and grew organically for five years, achieving profitability without external funding. The first external investment from Insight Partners in September 2022 catalyzed a hiring and product expansion phase. In 2023, the appointment of Vidya Peters as CEO and the ongoing doubling of revenue set the stage for the Series B. The February 2024 Series B at $1 billion valuation with $100 million in fresh capital marked the highest-profile milestone to date. In 2024, DataSnipper made its first strategic acquisition—purchasing UpLink, a cloud-based document request portal—and launched DocuMine, an AI product for mining information from documents using natural language prompts, alongside the Advanced Extraction Suite. The company also expanded its geographic footprint with new offices in Tokyo, Sydney, Kuala Lumpur, and Mexico City. A landmark partnership with Microsoft was announced on July 29, 2025, with joint development of AI agents embedded in Excel using Microsoft Azure infrastructure. The company launched AI Extractions in collaboration with Microsoft in 2025, and listed on the Microsoft Azure Marketplace. In 2026, Excel Agents—a fully agentic AI capability allowing audit workflow execution via natural language—became generally available. DataSnipper has maintained an adverse-free legal and regulatory record, with no known material litigation, regulatory sanctions, or data breaches as of July 2026."
    claimRefs: [CO033, CO034, CO035, CO036, CO037, CO038, CO039, CO040, CO041, CO042]
    tableRefs: [TO004]
    figureRefs: [FO001, FO003]

