callouts:
  - calloutType: strength
    title: "Excel-Native AI Delivery Is Unique and Defensible"
    body: "No competitor matches DataSnipper's depth of Excel integration with AI-powered audit automation. The Excel add-in model eliminates the adoption barrier of workflow migration while enabling AI capabilities. This creates a product experience that is both immediately familiar and incrementally more powerful—an ideal combination for conservative enterprise buyers."
    claimRefs: [CE015, CE016]

  - calloutType: risk
    title: "Microsoft Ecosystem Dependency Is Both Moat and Threat"
    body: "DataSnipper's product is architecturally dependent on three Microsoft platforms simultaneously: Excel (delivery), Azure AI (intelligence), and Azure Cloud (infrastructure). While the July 2025 partnership mitigates this risk, any Microsoft strategic pivot—including building native Excel audit features into Copilot—could undermine DataSnipper's differentiation from within its own technology stack."
    claimRefs: [CE010, CE016, CE017]

  - calloutType: insight
    title: "Excel Agents Signals a Platform Shift"
    body: "The 2026 GA release of Excel Agents—autonomous audit procedure execution—is the product development that could change DataSnipper from a document tool to an intelligent audit platform. If auditors delegate entire procedures to Excel Agents and review exceptions rather than performing steps, DataSnipper becomes embedded in audit thinking, not just audit documentation."
    claimRefs: [CE007, CE008, CE019]

  - calloutType: recommendation
    title: "Conduct Technical Deep Dive on AI Extraction Accuracy"
    body: "The core product claim—AI-grade accuracy for audit document extraction from unstructured documents—requires independent technical validation. Auditors face legal and professional liability for errors in workpapers; any systematic AI extraction error at scale could trigger client complaints, regulatory scrutiny, and firm-level risk. Request a benchmark test with representative audit document samples."
    claimRefs: [CE020, CE022, CE023]

