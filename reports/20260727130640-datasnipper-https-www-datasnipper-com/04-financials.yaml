callouts:
  - calloutType: risk
    title: "Private Company Financial Opacity Is a Blocking Diligence Gap"
    body: "DataSnipper has disclosed no audited financials, no NRR figure, no gross margin, no burn rate, and no signed customer ARR breakdown. All financial metrics in this chapter are third-party estimates or industry benchmarks. This opacity is standard for private SaaS companies but creates significant underwriting risk for any investment decision."
    claimRefs: [CI019, CI020, CI025]

  - calloutType: assumption
    title: "ARR Estimate of $44.5M May Be Significantly Understated"
    body: "A $1B valuation at 22–30x ARR would imply $33–50M ARR at time of funding (Feb 2024). With 'year of record growth' in 2024 and 58% AI package adoption in 2026, mid-2026 ARR could be $90–145M. The conservative $44.5M Latka figure may reflect a stale estimate that hasn't been updated for the AI upsell growth trajectory."
    claimRefs: [CI006, CI007, CI009]

  - calloutType: strength
    title: "Bootstrapped Profitability Demonstrates Unit Economic Viability"
    body: "DataSnipper operated profitably from its own revenues for 5 years before taking external capital. This is exceptionally rare for a B2B SaaS company that reached 500K users and all Big Four clients. It validates that the product can generate positive contribution margins and that management is capable of capital-efficient operation."
    claimRefs: [CI011, CI021]

  - calloutType: insight
    title: "Series C Timing Is a Near-Term Catalyst"
    body: "At typical growth-stage SaaS burn rates, DataSnipper's $100M Series B (Feb 2024) may approach depletion by late 2026 or early 2027. A Series C raise—or confirmation of profitability—is a near-term binary event that will reset the company's valuation and negotiating leverage. Investors should calibrate entry timing around this catalyst."
    claimRefs: [CI023, CI024, CI025]

