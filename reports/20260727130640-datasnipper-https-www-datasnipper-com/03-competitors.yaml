callouts:
  - calloutType: strength
    title: "Excel Integration Moat Is Durable in the 3–5 Year Horizon"
    body: "No current competitor has successfully replicated DataSnipper's depth of Excel integration for audit document workflows. Caseware's Verity AI and Fieldguide's full-platform approach are genuine alternatives but require workflow disruption that existing Big Four deployments resist. The July 2025 Microsoft partnership deepens this moat."
    claimRefs: [CP021, CP022]

  - calloutType: risk
    title: "Fieldguide Threatens New-Customer Acquisition at Mid-Market Firms"
    body: "Fieldguide's AI-first full-platform approach is better positioned for new-entrant audit firms that have not yet committed to a workflow stack. DataSnipper's add-on model is attractive for existing firms; for firms starting fresh, Fieldguide offers a more complete out-of-the-box solution."
    claimRefs: [CP012, CP013]

  - calloutType: risk
    title: "Caseware Verity AI Is the Incumbent Counterthreat"
    body: "Caseware's October 2024 launch of Verity, a GenAI platform embedded directly into Working Papers, is the most credible near-term competitive threat. With 500K+ existing users already on Working Papers, Caseware can upsell Verity AI to a captive base that DataSnipper must also reach through separate sales motions."
    claimRefs: [CP007, CP008]

  - calloutType: insight
    title: "Coexistence Model Reduces Competitive Intensity but Caps Wallet Share"
    body: "DataSnipper and Caseware/TeamMate coexist in the same Big Four deployments, which reduces competitive churn but means DataSnipper captures only a subset of total audit software spend. Expanding from add-on tool to platform is the critical strategic test over the next 3–5 years."
    claimRefs: [CP002, CP003, CP023]

