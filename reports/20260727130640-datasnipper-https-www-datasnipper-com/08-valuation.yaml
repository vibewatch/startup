callouts:
  - calloutType: recommendation
    title: "Track – Resolve Critical Diligence Gaps Before Committing"
    body: "DataSnipper's product quality and customer validation support a strong investment case, but the absence of NRR data, audited financials, and AI accuracy benchmarks prevents a confident Buy recommendation at the current $1B entry point. Resolve these gaps before investing. If NRR is >120%, AI accuracy is verified, and Microsoft partnership is confirmed protective, the recommendation upgrades to Buy at current or moderately higher valuation."
    claimRefs: [CV015, CV016, CV019]

  - calloutType: insight
    title: "22x ARR Is Defensible If AI ARPU Expansion Materializes"
    body: "DataSnipper's 22x ARR multiple appears elevated versus public comps but is consistent with private SaaS peers at similar growth stages. The critical question is whether AI tier adoption (58% of new customers) translates to ARR acceleration. If AI packages drive ARPU from $20K to $40K per client, ARR could reach $80-100M by 2027 without any new customer acquisition—justifying the current multiple and supporting a flat-to-premium Series C."
    claimRefs: [CV003, CV010, CV011]

  - calloutType: risk
    title: "Microsoft Copilot Is the Valuation Swing Factor"
    body: "The difference between bear case ($550-700M) and bull case ($1.5-2.5B) is dominated by the Microsoft Copilot competitive scenario. Investors should monitor Microsoft's Copilot for Finance and Dynamics 365 roadmap quarterly; any announcement of native Excel audit document inspection would immediately erode DataSnipper's differentiation and justify bear-case repricing."
    claimRefs: [CV020, CV021]

  - calloutType: assumption
    title: "Key Assumptions Underlying the Track Recommendation"
    body: "This recommendation rests on: (1) DataSnipper's self-reported metrics are directionally accurate; (2) all Big Four remain customers through 2026-2027; (3) Microsoft's partnership continues to prioritize co-development over competition; and (4) the private SaaS market will continue to value high-growth vertical AI at 12-20x ARR. Each assumption should be stress-tested in a management session before capital commitment."
    claimRefs: [CV010, CV012, CV017]

