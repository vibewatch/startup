callouts:
  - calloutType: risk
    title: "Microsoft Copilot Is the Existential Competitive Risk"
    body: "If Microsoft builds native Excel audit document extraction into Copilot for Excel—or into Microsoft 365 Copilot for Finance—DataSnipper's core differentiation (Excel-native AI audit automation) disappears from within its own technology stack. The July 2025 partnership reduces this probability but cannot eliminate it, as Microsoft's commercial incentive to monetize Copilot within Excel is independent of partnership agreements with third-party vendors."
    claimRefs: [CR011, CR015, CR025]

  - calloutType: risk
    title: "Customer Concentration Makes Big Four Relationships Existential"
    body: "DataSnipper's estimated 40-50% ARR concentration in 4 Big Four firms means a single departure—driven by insourcing, Microsoft Copilot adoption, or contract termination—could trigger a material revenue decline. This concentration is inherent to the audit market structure, not a DataSnipper-specific failure, but it constrains the company's risk profile relative to enterprise SaaS peers."
    claimRefs: [CR017, CR019, CR027]

  - calloutType: risk
    title: "PCAOB AI Guidance Evolution Could Restrict Excel Agents"
    body: "Excel Agents' agentic AI capability—autonomous multi-step audit procedure execution—operates near the boundary of permissible AI assistance in audit. If the PCAOB tightens its guidance to explicitly restrict autonomous AI procedure execution, DataSnipper's highest-margin AI tier could face adoption restrictions, undermining the 58% AI package adoption trend."
    claimRefs: [CR001, CR002, CR026]

  - calloutType: assumption
    title: "Key Assumption: Microsoft Does Not Compete in External Audit AI"
    body: "This risk analysis assumes Microsoft's commercial focus remains on productivity tools (Copilot for Microsoft 365) rather than professional services workflow AI (audit-specific document inspection). If this assumption is wrong—if Microsoft builds and acquires audit AI natively—the investment case changes materially. This assumption requires quarterly monitoring of Microsoft's Copilot for Finance and Dynamics product roadmaps."
    claimRefs: [CR011, CR025]

