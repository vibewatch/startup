      - number: '3.3'
        title: AI 原生挑战者：AuditBoard 与 Fieldguide
        blocks:
          - type: paragraph
            body: >-
              AuditBoard（Los Angeles, CA）是内部审计、风险管理和合规领域领先的 AI 原生平台。 AuditBoard 创立于 2014 年，融资超过 $200M，并在 2023 年被 Hg
              Capital 以约 $3B 收购。 其平台在统一云系统中连接内部审计、SOX 合规、风险和 ESG 工作流。 虽然 AuditBoard 的主要市场是上市公司的内部审计——不同于 DataSnipper
              的外部审计重心——但它的 AI 文档处理和证据收集能力，与 DataSnipper 在跨职能审计团队中的用例重叠。

              Fieldguide（San Francisco, CA）是 DataSnipper 在外部审计工作流中最直接的 AI 原生挑战者。 Fieldguide 创立于 2020 年，背后有 Bessemer
              Venture Partners 和 Andreessen Horowitz，2023 年完成 $30M Series B，并把自己定位为面向公众会计事务所的完整 AI 驱动项目平台。 Fieldguide
              的路径是用 AI 优先平台替代传统项目管理系统，平台包括文档抽取、请求管理和工作流自动化——覆盖范围比 DataSnipper 的 Excel 插件模式更广。

              Fieldguide 带来的风险不是当前收入被抢——其客户基础更小，且集中在 US 中端事务所——而是未来新进入事务所在选择第一套技术平台时，可能选 Fieldguide 而不是
              DataSnipper+Caseware 组合。 这种新客户流失风险比既有客户留存更难衡量，并可能在 3–5 年周期内压缩 DataSnipper 在中端市场的增长率。
