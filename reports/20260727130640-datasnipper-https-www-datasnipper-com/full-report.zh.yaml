      - number: '2.2'
        title: TAM、SAM 与市场规模测算
        blocks:
          - type: paragraph
            body: >-
              多家独立市场情报机构给出了全球审计管理软件市场估算，口径重叠但结果分歧明显。 The Business Research Company 估计审计管理软件市场 2025 年为 $1.9B，到 2030 年增至
              $3.89B，CAGR 为 15.5%。 GM Insights 估计更宽的审计软件市场 2025 年为 $3.4B，到 2032 年达到 $6.8B，CAGR 为 12.8%。 Technavio
              估计审计软件市场为 $2.8B，到 2028 年 CAGR 为 9.7%。 Emergen Research 预计 2024 年审计软件市场为 $3.1B，CAGR 为 10.5%。

              自下而上的验证可交叉校验这些数字：ICAEW 估计全球约有 3 million 名专业会计师，其中约 900,000 人在 Big Four，另有 600,000– 900,000 名专职审计专业人士分布在非
              Big-Four 事务所（基于 IFAC 数据）。 若专业级 AI 审计工具可实现每用户每年 $1,500–$3,000 的席位定价，约 1–1.5 million 名可触达审计专业人士意味着
              $1.5B–$4.5B 的可服务市场（SAM）。 DataSnipper 当前估计 ARR 为 $44.5M（Latka/Sacra 2025），约占该 SAM 的 1–3%。

              DataSnipper 的 SAM 还受 Excel 原生定位约束。 如果事务所迁移到抛弃 Excel 底稿的云原生项目系统，DataSnipper 可触达用户基数会下降，除非公司扩展平台。
              基于当前轨迹和已宣布扩展到 175+ 个国家，近中期可获取市场（SOM）估计为 5 年内 $150–300M ARR，较当前基线增长 3–10x。 这个估算假设 Big Four
              全球推广继续渗透、扩展到二线审计网络，并在企业内部审计细分取得成功。
