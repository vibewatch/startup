      - number: '3.5'
        title: 护城河耐久性与竞争风险评估
        blocks:
          - type: paragraph
            body: >-
              DataSnipper 的主要竞争护城河包括：(1) Excel 嵌入——深度进入 600K+ 名每天使用 Excel 的审计师的工作流和肌肉记忆；(2)
              专用领域知识——平台理解银行流水、发票、合同、函证等审计专用文档类型，而通用文档 AI 工具开箱即用时并不支持；(3) Big Four 验证——四家 Big Four
              全部成为客户带来声誉可信度，降低新潜在客户的销售摩擦；(4) 数据网络效应——真实审计文档的数亿次文档交互训练数据，随时间积累自有模型质量。

              关键耐久性问题在于 Excel 锚点。 Microsoft 自己在 Excel 中推进的 Copilot 计划，既可能 (a) 补强 DataSnipper 的 AI 能力并扩大护城河，也可能 (b) 如果
              Microsoft 自建原生审计文档抽取能力，削弱 DataSnipper，让第三方插件不再必要。 July 2025 与 Microsoft 的合作公告——包括基于 Azure 的 AI 智能体和联合
              go-to-market——说明 (a) 更可能发生，但前提是 Microsoft 持续把 DataSnipper 视为合作伙伴，而不是一个可内置的功能候选。

              商品化风险真实存在，而且随着通用 AI 模型在文档抽取上变强而上升。 DataSnipper
              若要领先于商品化，必须构建更深的工作流集成、来自审计专用训练的数据网络效应，并扩展到相邻工作流（客户门户、财务关账、内部审计），让 DataSnipper 成为必要平台，而不是可替换的点状工具。 2024 年收购
              UpLink，以及 2025 年 AI Extractions/Excel Agents 路线图，都是朝这个方向的动作。
