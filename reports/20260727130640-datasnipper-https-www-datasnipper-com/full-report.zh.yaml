        title: 客户采用、留存与扩张指标
        blocks:
          - type: paragraph
            body: >-
              DataSnipper 不公开披露净收入留存率（NRR）、流失率或单客户 ARR 数据；以其阶段而言，私有公司这样做并不罕见。现有采用信号包括：（1）用户数从 2022–2023 年的 300,000 增至
              2026 年中的 600,000+（3 年约 100% 增长）；（2）2026 年新客户中有 58% 采用 AI 套餐（AI Extractions 和/或 Excel
              Agents），说明更新、更高价层级的增购渗透强；（3）四大仍全部是客户（一线客户没有披露流失）；（4）175+ 国家部署，表明产品通过全球事务所网络自然扩散。

              新客户中 58% 的 AI 套餐采用率，是 ARPU 扩张的强领先指标：如果 AI 层级价格是基础订阅的 2–3x，这种组合迁移会显著提高每个新用户收入。不过，既有客户基础迁移到 AI
              层级的情况还不够清楚——成熟账户的迁移速度通常慢于新采购客户。

              EY Netherlands 的客户案例、Deloitte
              引用，以及多家中端市场会计师事务所案例，显示使用场景一致：银行对账单核对、发票凭证核验、函证处理，每个审计周期都会重复产生价值。审计按固定周期进行，这种年度复现天然带来续约动机，也降低技术过时导致的内生流失。

              DataSnipper 估计 ARR 约为 $44.5M（Latka/Sacra 第三方估算，2025 年），若除以 2,200+ 企业客户，则平均每家企业客户年收入约 $20,000。这与中端 SaaS
              企业定价一致：四大可能每年支付 $500K–$2M+，小型事务所则支付 $10–50K。
