      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              审计软件市场有几股强劲结构性顺风。 最重要的是长期人才短缺：AICPA 报告 2019–2023 年 CPA 考试候选人净减少约 300,000 人，而监管复杂度上升使审计工作量继续增加。
              这形成了偏向自动化的生产力刚需。 AI 能力进步——尤其是大语言模型和可从非结构化 PDF 中抽取表格数据的文档智能工具——已经跨过审计级准确性要求下的商业可用门槛。

              监管顺风进一步强化需求。 PCAOB 的 2023–2024 检查周期发现主要事务所存在审计质量缺陷，部分原因是抽样和文档记录不足；全球监管机构正提高质量标准，抬高手工审计路径的成本。
              审计对象也更复杂——数字资产、复杂金融工具、供应链依赖——使文档负担进一步放大。 Deloitte 和 EY 都公开承诺大额技术投入，其中 Deloitte 每年在各业务线技术支出超过 $2B。

              采用约束包括：Excel 路径依赖（事务所若完全迁离 Excel 底稿，DataSnipper 可触达基数会下降）、GDPR 和数据隐私监管为处理敏感客户财务数据的供应商增加合规开销、PCAOB 和 IAASB
              关于审计中使用 AI 的指引仍在演进（使风险厌恶型审计合伙人采取谨慎采用姿态），以及存有历史底稿的既有项目管理系统带来高切换成本。 当前宏观环境也压缩审计事务所利润率，减缓非必要技术采购。
            claimRefs:
