      - number: '7.3'
        title: 合作伙伴与技术依赖风险
        blocks:
          - type: paragraph
            body: >-
              DataSnipper 最重要的外部依赖是 Microsoft。产品构建在 Microsoft Excel（Office.js API）之上，托管在 Microsoft Azure 上，通过 Azure
              AI（Form Recognizer 和 Azure OpenAI）处理 AI，并经 Microsoft Azure Marketplace 和 AppSource 分发。这形成三重 Microsoft
              依赖：交付、计算和分发，三者都由同一个交易对手关系调节。

              2025 年 7 月的 Microsoft 合作关系提供共同开发入口和联合营销支持，但也加深了这种依赖。如果 Microsoft 选择构建原生 Excel 审计自动化功能——通过 Microsoft
              Copilot for Excel 或专门的审计 AI 功能——DataSnipper 的差异化会从自身技术栈内部被侵蚀。Microsoft 已经展示过绕开第三方加载项的意愿，例如 Cortana
              取代第三方个人助理、Teams 在许多 Microsoft 企业账户中取代 Slack。

              Azure AI 定价构成可变成本风险。随着 DataSnipper 的 AI 处理量增加（AI Extractions、Excel Agents），Azure AI API 成本会成为毛利率的重要组成部分。若
              Azure 涨价，而固定价企业合同又无法向客户等额传导成本，利润率可能被压缩。

              UpLink 收购引入了次级技术依赖：Suralink（UpLink 竞争者）和其他文档请求平台，是客户端审计团队可能偏好的替代方案。如果 UpLink 技术落后于竞争者，DataSnipper
              可能需要追加收购或开发投入，才能守住这条产品线。
