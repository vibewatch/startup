      - number: '8.2'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              牛市情景（$1.5–2.5B 企业价值）需要满足：（1）靠 AI 层级采用和企业分层扩张，到 2027 年 ARR 增至 $120–150M；（2）AI 套餐（AI Extractions + Excel
              Agents）把企业客户 ARPU 从约 $20K 推至 $35–50K；（3）国际扩张和中端市场渗透成功；（4）Microsoft Copilot 没有造成重大竞争扰动。若这些条件成立，且市场继续给予审计 AI
              平台溢价倍数，DataSnipper 在 Series C 时可能按新 ARR 基础获得 15–20x 估值。

              基准情景（$900M–$1.1B 企业价值）假设：到 2027 年 ARR 增至 $75–90M，CAGR 约 25–30%；AI 套餐采用率维持在约 50%；四大留存稳定；Microsoft 合作关系为抵御
              Copilot 竞争提供部分保护；下一轮融资相对当前 $1B 估值持平或小幅溢价。这与当前披露指标大体一致，也是最可能情景。

              熊市情景（$550–750M 企业价值）反映：Microsoft Copilot 在 Excel 内免费提供等价基础功能，导致 ARR 增速降至 15% 以下；Microsoft
              竞争加剧，四大合同重谈并压低平均合同价值；AI 准确率质量问题造成声誉损害；公司以降低后的 ARR 基础、12–15x 倍数进行下行轮。这个情景有可能发生，但不是中位结果。

              情景之间的关键摆动因素，是 Microsoft 针对审计专用文档处理的 Copilot 路线图。如果 Microsoft 在 18 个月内为 Excel Copilot
              增加审计原生文档抽取，熊市概率会显著上升。如果 Microsoft 按 2025 年合作共同开发协议，继续把 DataSnipper 定位为首选审计 AI 伙伴，牛市概率会提高。
