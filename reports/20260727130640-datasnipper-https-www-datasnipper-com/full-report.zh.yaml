      - number: '2.3'
        title: 买方、用户与付费方分层
        blocks:
          - type: paragraph
            body: >-
              审计自动化软件的购买涉及多个角色。 付费方通常是审计事务所的技术或运营委员会；用户是单个审计师或项目经理；内部推动者往往是专门的「Audit Innovation」或「Digital
              Transformation」团队。 在 Big Four，软件采购通过全球或区域技术职能集中推进，因此全所授权决策较慢但更持久。 在中型和本地事务所，购买决策下放到业务合伙人，交易周期更短，但单个合同金额更小。

              审计自动化软件的主要买方分层包括：(1) Big Four 全球业务（Deloitte、PwC、EY、KPMG）及其各国成员所——DataSnipper 当前主要客户基础；(2)
              第二梯队全球网络（BDO、Grant Thornton、RSM、Forvis Mazars）；(3) 区域和本地审计事务所；(4) 大型企业内部审计部门；(5) 执行年度审计支持或财务关账流程的财务团队。
              DataSnipper 当前服务全部 Big Four，并正积极扩展到 (2)–(5) 细分。

              预算归属因细分而异。 Big Four 通常从专门创新预算或审计收入抽成中集中资助审计技术。 企业内部审计团队从技术或合规预算中购买软件，中型部署每年通常为 $50K–$500K。
              采用触发因素包括：监管机构检查审计质量（PCAOB/FRC inspections）、合伙人层面看到节省时间的演示（DataSnipper 声称手工程序减少 70%）、同业部署 AI
              工具带来的竞争压力，以及人才短缺迫使团队在不加人的情况下提升效率。
            claimRefs:
