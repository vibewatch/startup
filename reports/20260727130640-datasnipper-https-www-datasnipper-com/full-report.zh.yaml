      - number: '6.4'
        title: 客户使用场景与价值兑现
        blocks:
          - type: paragraph
            body: >-
              DataSnipper 的价值主张，核心是把审计工作流中的手工文档检查劳动去掉。推动客户采用的主要使用场景包括：

              银行对账单核对：审计师收到客户以 PDF 形式提供的银行对账单，必须验证余额是否与总账匹配。DataSnipper 的截取功能让审计师点击 PDF 上的余额，并在数秒内把它链接到 Excel
              单元格，取代手工复制粘贴流程。这是量最大的场景，也很可能驱动初次采用决策。

              发票和采购订单凭证核验：审计师必须把费用交易追溯到底层发票和 PO。DataSnipper 可以批量处理发票，把金额匹配到总账交易，并标记差异——这是展示 AI 层级价值的 AI Extractions 场景。

              函证处理：审计准则要求第三方确认余额（银行函证、应收账款函证）。DataSnipper 处理返回的函证文档，并把它们链接到底稿。

              合同检查：AI Extractions 让审计师可以从非结构化合同 PDF 中查询合同条款（付款日期、义务金额、续约条款）；这个场景在最初的 snipping 产品下无法自动化。

              EY Netherlands 案例研究特别验证了银行对账单和发票场景，并提到 DataSnipper「大幅减少了常规文档检查耗时」。DataSnipper
              网站上的其他客户证言也提到类似效率成果，但并非全部都能归因于可独立验证的具名客户。
