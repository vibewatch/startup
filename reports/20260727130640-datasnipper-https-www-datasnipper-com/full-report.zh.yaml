      - number: '7.4'
        title: 竞争与市场风险
        blocks:
          - type: paragraph
            body: >-
              DataSnipper 同时面对多个方向的竞争威胁。在平台层面，Microsoft Copilot for Excel 和 Microsoft 365 Copilot 可能在 Microsoft 生态内吸收
              DataSnipper 的核心使用场景——文档抽取和 AI 辅助分析。2025 年 7 月的合作关系降低了对抗概率，但 Microsoft 在 Excel 内变现 Copilot
              的商业动机，是任何合作协议都无法完全中和的结构性威胁。

              在专业审计工具层面，FieldGuide、AuditBoard、Caseware IDEA、Workiva 和 TeamMate（Wolters
              Kluwer）都在争夺审计工作流软件预算。这些竞争者提供更广的工作流管理、项目管理和报告能力，覆盖 DataSnipper 的 Excel
              加载项尚未覆盖的部分，因此它们更像平台替代方案，而不是点解决方案竞争者。随着 DataSnipper 进入企业内部审计，它会更直接面对 AuditBoard 和 Diligent。

              AI 原生竞争者正在出现：Botkeeper、Fieldguide，以及把大语言模型用于审计文档处理的新进入者，代表下一波竞争者。由于核心技术（Azure OpenAI）任何竞争者都能获得，DataSnipper
              的竞争保护主要靠 Excel 集成深度和四大客户关系，而不是专有 AI 算法。

              市场集中度风险：面向外部审计师的全球审计软件市场，由四大 IT 采购决策主导。如果两家或更多四大事务所统一采用竞争者，或自建内部工具，市场可能明显倒向 DataSnipper
              的反面。历史上，审计软件市场往往因事务所网络内部的网络效应，走向赢者通吃大半的格局。
            claimRefs:
              - CR015
              - CR016
              - CR017
              - CR018
