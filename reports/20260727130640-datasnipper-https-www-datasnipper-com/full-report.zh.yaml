      - number: '8.5'
        title: 论点失效触发条件与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              五个触发事件足以击穿本轮投资假设：（1）Microsoft 发布原生 Excel 审计文档检查产品；（2）某家 Big Four 客户将能力内建后流失；（3）PCAOB 因 DataSnipper AI
              导致审计质量失败而采取行动；（4）CEO Vidya Peters 离任；（5）NRR 被确认低于 100%。这些事件按预计对企业价值的冲击排序，其中 Microsoft 竞争最严重。

              出资前必须补齐的最后几项尽调要求是：（1）2023-2025 经审计或鉴证审阅的财务报表，包含 ARR、NRR 和毛利率拆分；（2）Big Four 真实合同条款，包含最低承诺、AI
              责任条款和续约条款；（3）基于代表性审计文档样本的 AI Extractions 准确率基准；（4）Microsoft 合作协议关键条款（排他性、共同开发承诺、竞争限制）；（5）与管理层开一场专项会议，讨论
              Microsoft Copilot 竞争情景和 DataSnipper 的应对预案。

              按当前 $1B 水平看，若投资者持有期为 5-7 年，并高度确信 AI 审计市场增长和 DataSnipper 的位置，估值算公平。需要安全边际的投资者，$750-850M
              区间的更低入场价更有吸引力；未解决的尽调问题和 Microsoft Copilot 阴影仍会压低风险调整后回报。
