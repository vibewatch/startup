  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              DataSnipper 服务高度受监管的审计行业；AI 治理框架不断演进，构成重大监管风险。PCAOB 2024 年关于生成式 AI 的 Spotlight 明确，审计师个人要对 AI
              生成的底稿错误负责，且不能把专业判断委托给 AI 系统。随着 DataSnipper 的智能体式 AI（Excel Agents）变得更自主，可允许的 AI 辅助与被禁止的 AI
              决策之间的监管边界，会越来越关键。若 PCAOB 因某事务所过度依赖 DataSnipper AI 而采取执法行动，DataSnipper 将立即遭受声誉和商业打击。

              IAASB 的 International Standard on Auditing（ISA）框架也在演进，以纳入 AI 工具；草案提出要加强对 AI 辅助审计程序的文档要求。欧洲监管机构（英国 FRC、荷兰
              AFM）也在分别监测审计中的 AI 采用。DataSnipper 总部位于荷兰，自身运营受荷兰监管监督，包括在 Dutch DPA（Autoriteit Persoonsgegevens）权限下遵守 GDPR。

              知识产权风险包括 DataSnipper 文档抽取算法的专利保护有限。公司没有公开披露专利；竞争者可以在不承担 IP 侵权责任的情况下合法复制 DataSnipper 核心功能。DataSnipper
              依赖商业秘密和先发优势保护 IP，这弱于大型软件公司持有的专利组合。

              与审计事务所的合同风险，涉及 DataSnipper AI 抽取失败导致底稿错误时可能触发的责任条款。四大使用 DataSnipper 的合同条款——包括保证和赔偿范围——并未公开披露，因此责任画像仍然未知。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              DataSnipper 的 AI 抽取准确率是产品质量上的生死风险。审计师把 DataSnipper 抽取的数据用于底稿；这些底稿会接受 PCAOB/IAASB 检查审计师复核，并支撑财务报表审计意见。如果 AI
              抽取错误具有系统性或重大性，可能导致审计失败、事务所层面制裁，或客户财务报表重述。DataSnipper 没有公开披露 AI Extractions 的准确率基准，让产品最关键维度的质量主张无法验证。

              DataSnipper 的 Excel 加载项架构依赖 Microsoft Office.js API。Excel API 任何破坏性变更、Excel 加载项政策修改，或 Microsoft
              转向原生审计能力的战略变化，都可能在不给客户提前通知的情况下扰动 DataSnipper 产品。Microsoft 2025 年 7 月的合作关系降低了敌意 API
              变化的概率，但没有完全消除风险——Microsoft 历史上曾弃用或改变 Office 加载项 API，影响第三方开发者。

              安全风险来自 DataSnipper 托管在 Azure 上的基础设施会处理客户保密财务数据（银行对账单、发票、合同、董事会会议纪要）。一旦发生安全泄露，客户会暴露在 GDPR
              责任、审计职业保密违规，以及受影响审计事务所潜在监管制裁之下。DataSnipper 的 ISO 27001 和 SOC 2 Type II 认证降低了风险，但不能消除风险。

              运营扩张风险包括：随着文档类型宇宙扩大，AI 抽取质量更难维持。AI Extractions 的设计本来就是处理此前未见过的文档类型，其方式不同于基础 Intelligent Automation
              模块（该模块用结构化财务文档训练）。相较结构化格式匹配，任意非结构化文档抽取的质量控制天然更难保证。
            claimRefs:
