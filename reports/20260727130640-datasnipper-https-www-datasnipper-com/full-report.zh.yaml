      - number: '4.2'
        title: 收入估算与增长轨迹
        blocks:
          - type: paragraph
            body: >-
              DataSnipper 的准确收入为私有信息，未披露。 两家第三方聚合商提供估算：Latka（March 2025）基于自有数据聚合方法引用 $44.5M ARR；Sacra（2025）独立报告了类似数字。
              这些不是审计数字，可能来自渠道核查、基于员工数倍数推断，或从估值反推。 February 2024 的 $1B Series B 估值若按典型 SaaS 20–30x ARR 倍数推算，融资时 ARR 隐含为
              $33M–$50M；这与 2025 年初 $44.5M 的估算在温和增长假设下大体一致。

              PR Newswire 在 January 2025 发布的新闻稿称 2024 年是「record growth」之年，但未披露具体数字。 假设公司同比增长 50–100%（符合 Series B 后高增长
              SaaS 独角兽特征），2025 年末隐含 ARR 可能为 $65M–$90M。 若 2026 年增长率为 40–60%，2026 年中 ARR 可能处在 $90M–$145M 区间。
              这些都是纯估计，存在较宽不确定区间。

              公司明确表示自己是 Netherlands 增长最快的科技公司，测量期内营业额增长 6,715%——但这是历史累计数字，不是近期年度增长率。 投资人不应把 6,715%
              理解为当前增长率；它反映的是从小基数出发、跨多年复合增长的结果。
