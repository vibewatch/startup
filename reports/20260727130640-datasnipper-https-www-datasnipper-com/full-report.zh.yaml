        title: 客户分层与用户基础概览
        blocks:
          - type: paragraph
            body: >-
              DataSnipper
              的主要客户分层是专业服务机构，尤其是审计和会计师事务所；这些机构雇用的审计师需要定期处理大量财务文档。客户基础从四大全球会计网络（Deloitte、PwC、EY、KPMG）延伸到中端市场会计师事务所、区域性事务所，并越来越多进入企业内部审计和财务团队。

              截至 2026 年 7 月，DataSnipper 报告拥有 600,000+ 用户、2,200+ 企业客户组织，并在 175+ 个国家部署。这些数字是公司自报指标，尚未独立审计。增长轨迹明显：2022–2023
              年，DataSnipper 约有 300,000 用户；到 2025 年增长至约 500,000；到 2026 年中，公司报告超过 600,000。

              用户基础主要由会计师事务所的外部审计师构成。考虑到 Deloitte 一家在全球就雇用约 50,000 名审计师，四大本身在 600,000+ 报告用户中可能贡献 300,000+。随着 DataSnipper
              从最初聚焦外部审计向外扩张，企业财务和内部审计团队正在成为增长分层。

              DataSnipper 覆盖 175+ 个国家，更多反映审计网络的全球属性（四大各自在 150+ 国家运营），而不是逐国独立扩张。不过，考虑到 Excel 生态以及 AI Extractions
              的语言支持成熟度，用户很可能集中在英语市场和欧洲市场。
