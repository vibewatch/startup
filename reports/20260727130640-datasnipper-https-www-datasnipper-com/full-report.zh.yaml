      - number: '5.3'
        title: 技术架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              DataSnipper 架构上是一个使用 Excel JavaScript API（Office.js 框架）构建的 Microsoft Excel 加载项。加载项与 DataSnipper
              云后端通信，用于文档存储、AI 处理和用户管理。截至 2025 年，AI 处理工作负载运行在 Microsoft Azure 上，具体使用 Azure AI（Form Recognizer
              做结构化文档抽取，Azure OpenAI 做非结构化文本抽取）。

              云基础设施托管在 Azure 上，这与 Microsoft 合作关系和企业安全要求一致。DataSnipper 已取得 ISO 27001 和 SOC 2 Type II
              等安全认证；服务审计事务所这类处理敏感客户财务数据的供应商，通常必须满足这些要求。平台也按 GDPR 运营，以满足欧洲数据驻留要求。

              对 Microsoft Excel 生态的技术依赖同时带来强项和风险：一方面是深度集成和企业信任，另一方面会受 Microsoft API 变化、Excel 功能演进，以及 Microsoft 自身
              Copilot for Excel 路线图影响。DataSnipper 通过 2025 年 7 月的合作关系管理这一风险——双方在 Azure 上共同开发 AI 智能体并联合营销——这表明 Microsoft
              目前把 DataSnipper 视作生态伙伴，而不是功能收购目标，但这种动态可能变化。

              DataSnipper 工程团队由 Thilo Richter（VP Product & Engineering）领导，在估计 289 人的员工规模中占相当比例。公司一直在扩充工程能力，以支持 AI 路线图；AI
              Extractions 和 Excel Agents 体现了公司在 Microsoft Azure AI 技术栈上 2–3 年的产品投入。三位原始创始人 Kai Bakker、Jonas
              Ruyter、Maarten Alblas 在 Vidya Peters 于 2023 年加入担任 CEO 后，转为董事会/顾问角色。
