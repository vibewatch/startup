  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与核心工作流
        blocks:
          - type: paragraph
            body: >-
              DataSnipper 是一款 Microsoft Excel 加载项，让审计师能直接在 Excel
              底稿里，从源文件中抽取、交叉引用并核对数据，从而改造审计文档工作流。核心功能称为「snipping」（截取）：审计师从 PDF、银行对账单、发票或合同中选中一个数值或文本，系统会自动把它链接到对应的 Excel
              单元格，形成匹配证据的审计轨迹。审计师不再需要在文件之间来回切换、手动复制数值；DataSnipper 称，这最多可减少 70% 的手工审计程序。

              产品工作流直接嵌入既有审计项目流程：审计师继续把 Excel 当作主底稿工具；DataSnipper 在 Excel 里增加侧边栏和功能区，提供文档管理、截取、批注和 AI 抽取能力。文档上传到
              DataSnipper 平台后，Excel 加载项会拉取并内嵌展示。由于这种嵌入式路径，审计师采用 DataSnipper 时不用改变根本工作流——产品进入的是他们已经工作的地方。

              DataSnipper 的产品已经从最初的文档匹配工具，演进为一个能用 AI 抽取非结构化数据的智能文档处理平台。截至 2026 年，平台包含三大主要产品模块：（1）Intelligent
              Automation（最初的截取与交叉引用核心）；（2）AI Extractions（由 Microsoft Azure AI 驱动，从非结构化文档中抽取数据）；（3）Excel Agents（可在 Excel
              内自主执行多步骤审计程序的智能体式 AI）。2024 年收购 UpLink 后，平台又增加了面向客户的文档请求门户。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
