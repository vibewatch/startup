      - number: '4.3'
        title: 成本结构与利润率
        blocks:
          - type: paragraph
            body: >-
              DataSnipper 的成本结构未公开披露。 作为一家采用 Excel 插件架构的软件公司，其主要成本类别可能包括：(1) 研发与工程（最大项；按同阶段 SaaS 基准估计为收入的 35–45%）；(2)
              销售与营销（金额较大；公司在 3 大洲 6 个城市设办公室进行全球扩张，估计为收入的 30–40%）；(3) G&A（成长期 SaaS 通常为 10–15%）；(4) 客户成功与支持。 鉴于 AI
              文档处理工作负载，基础设施成本（Azure 计算、文档处理存储）可能高于纯软件同行。

              公司在 2022 年 Series A 前自举并盈利，说明即使没有外部资本，它也能以符合盈利要求的毛利率运转。 Series A 和 Series B 后，公司把员工数扩至约 289 人（2026
              年聚合商估计），意味着以近期盈利能力为代价，显著投入增长。 软件类 SaaS 毛利率通常为 70–80%；Azure AI 带来的 AI 推理计算负载可能把毛利率压至 60–75%。

              在没有财务报表的情况下，无法直接计算烧钱速度。 February 2024 融资 $100M，按成长期 SaaS 典型每月 $3–6M 烧钱速度（与 289
              名员工、全球办公室和激进销售投入一致），公司可能自融资日起有 18–36 个月现金跑道，意味着下一次融资事件（Series C 或盈利里程碑）可能发生在 2025–2027 年。 截至 July 2026
              仍未公开宣布 Series C，说明 (a) 公司正朝盈利推进，(b) 支出计划偏保守，或 (c) 融资已临近但尚未宣布。
