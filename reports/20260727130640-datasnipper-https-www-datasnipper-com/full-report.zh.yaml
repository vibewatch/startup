        title: 图表与补充材料
        blocks:
          - type: callout
            title: TAM 估算随市场边界不同相差 4x
            body: >-
              $1.9B（窄口径审计管理软件）与 $8B+（GRC/合规）之间的差异来自定义选择，而非事实分歧。 DataSnipper 的可触达市场很大程度取决于它能否越过 Excel
              原生审计工作流，扩展到更宽的财务合规用例。
            calloutType: insight
            claimRefs:
              - CM027
              - CM028
              - CM029
          - type: callout
            title: 在结构性增长市场中处于早期渗透
            body: >-
              DataSnipper 的 SAM 渗透率约 ~1–3%，且已拿下全部 Big Four 客户；在一个年增长 10–16% 的市场里，公司处于早期复合增长轨道。 即便只是靠 AI 档位增购（58% 的新客户选择
              AI 套餐）适度提高每席位价格，也会显著改变 SAM 经济性。
            calloutType: strength
            claimRefs:
              - CM010
              - CM011
              - CM031
          - type: callout
            title: Excel 依赖带来集中风险
            body: >-
              DataSnipper 的 Excel 原生定位既是最主要差异点，也是最大约束。 如果 Microsoft 将 Excel 推向另一种范式（Fabric、Copilot 原生工作流），或审计事务所迁移到绕开
              Excel 的云原生项目平台，DataSnipper 的 SAM 可能收缩，且速度快于整体市场增长所能补偿。
            calloutType: risk
            claimRefs:
              - CM024
              - CM025
              - CM030
          - type: callout
            title: ARR 估算来自第三方聚合数据
            body: >-
              本章使用的 $44.5M ARR 数字来自 Latka/Sacra（2025），未获 DataSnipper 确认。 实际 ARR 可能显著更高（与标准 SaaS 20–30x 倍数下 $1B
              估值一致），也可能更低。 这种不确定性会传导到所有渗透率和 SAM 估算中。
