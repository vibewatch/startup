      - number: '4.4'
        title: 单位经济与销售效率
        blocks:
          - type: paragraph
            body: >-
              DataSnipper 的单位经济未公开披露。 替代指标显示其单位经济画像较好：公司外部融资前已盈利（说明贡献利润率为正），签下全部 Big Four（说明能赢下大型企业账户），并报告新客户中 58% 采用 AI
              套餐（说明增购执行成功）。 但如果没有公开 CAC、LTV、回本周期或 NRR，任何单位经济评估都只是推测。

              定价信号：基于 600K 用户和 $44.5M ARR 估计，隐含平均 ARPU 约 $74/user/year——对企业 SaaS 工具来说非常低。 这说明可能存在几种情况：(a)
              大多数用户来自全所大批量折扣授权，使每用户成本远低于零售价；(b) 许多「600K users」位于价格较低的市场；或 (c) ARR 估算显著低估实际收入。 另一种解读是：如果 Big Four 每家有
              50K+ 用户，单席位 $500+，四份全所合同在全面铺开时仅自身就可代表 $100M+ TCV，而当前 ARR 反映的是部分部署。 这意味着既有客户内部仍有显著收入扩张潜力。

              GTM 动作看起来结合了产品驱动增长（一名合伙人部署后，在审计团队内部病毒式扩散）和面向全所授权的直接企业销售。 Vidya Peters 的任命——她在 MuleSoft 和 Marketo 拥有丰富 B2B
              SaaS GTM 经验——说明公司正在扩展专业企业销售动作。 DataSnipper 扩展到 175+ 个国家、设立 6 个办公室，说明区域销售团队投入已经相当可观。
