      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 跟踪——出资前先补齐关键尽调缺口
            body: >-
              DataSnipper 的产品质量和客户验证支撑了很强的投资逻辑，但 NRR 数据、经审计财务和 AI 准确率基准缺位，在当前 $1B 入场价下还不足以给出明确买入建议。先补齐这些缺口再投。如果 NRR
              >120%、AI 准确率得到验证，且 Microsoft 合作条款确认能提供保护，当前估值甚至小幅更高估值下，建议可上调为买入。
            calloutType: recommendation
            claimRefs:
              - CV015
              - CV016
              - CV019
          - type: callout
            title: 只要 AI ARPU 扩张兑现，22x ARR 站得住
            body: >-
              相较上市可比公司，DataSnipper 22x ARR 倍数偏高，但与同阶段私有 SaaS 同行一致。关键是 AI 套餐采用率（新客户 58%）能否带来 ARR 加速。若 AI 套餐把单客户 ARPU 从
              $20K 推到 $40K，即便不新增客户，ARR 到 2027 也可能达到 $80-100M；这足以支撑当前倍数，并支持一轮持平到溢价的 Series C。
            calloutType: insight
            claimRefs:
              - CV003
              - CV010
              - CV011
          - type: callout
            title: Microsoft Copilot 是估值摆动因子
            body: >-
              熊市情景（$550-700M）和牛市情景（$1.5-2.5B）之间的差距，主要由 Microsoft Copilot 竞争情景决定。投资者应按季度跟踪 Microsoft Copilot for Finance
              和 Dynamics 365 路线图；一旦 Microsoft 发布原生 Excel 审计文档检查能力，DataSnipper 的差异化会立刻被削弱，熊市重定价也就站得住。
            calloutType: risk
            claimRefs:
              - CV020
              - CV021
          - type: callout
            title: 跟踪建议背后的关键假设
            body: >-
              这项建议押在四个前提上：（1）DataSnipper 自报指标方向上准确；（2）全部 Big Four 在 2026-2027 期间仍是客户；（3）Microsoft 合作继续把共同开发放在竞争之前；（4）私有
              SaaS 市场仍会按 12-20x ARR 给高增长垂直 AI 定价。出资前，每个假设都需要在管理层访谈中压力测试。
            calloutType: assumption
            claimRefs:
              - CV010
              - CV012
              - CV017
