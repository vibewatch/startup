      - number: '8.3'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              以 $1B 投资 DataSnipper 的论点建立在四根支柱上：（1）可防守位置：DataSnipper 是唯一获得四大客户验证的 Excel 原生 AI
              审计自动化平台；鉴于审计工作流模板中嵌入的切换成本，以及每年重复审计程序已围绕 DataSnipper 工具训练，这一位置在实践中很难被替代。（2）AI 变现：新客户 58% 的 AI 套餐采用率确认了客户愿意为
              AI 层级付费；如果这一点转化为既有客户基础中的 ARPU 扩张，收入增长将显著快于用户增长。（3）平台演进：AI Extractions 和 Excel Agents 表明产品路线图正在把
              DataSnipper 从工具推向智能工作流平台，提高切换成本并支撑溢价估值。（4）Microsoft 对齐：2025 年 7 月的共同开发合作关系，把最大的竞争威胁对齐为商业合作方，降低短期内
              Microsoft 直接竞争的概率。

              反论点认为：（1）Microsoft 拥有 DataSnipper 运行其上的平台，并正通过 Copilot 进入同一批使用场景；（2）$1B 估值假设四大忠诚度持久，但四家事务所同时都在建设内部 AI
              审计能力；（3）审计 AI 市场是赢者通吃大半的市场，而 DataSnipper 的 Excel 依赖限制了它在更广工作流维度上的竞争；（4）公司没有经审计财务，所有增长指标均为自报。
