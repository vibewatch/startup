  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值框架与可比分析
        blocks:
          - type: paragraph
            body: >-
              DataSnipper 的估值需要同时对照公开市场可比公司，以及审计和合规软件在类似成长阶段的私有市场先例。主要估值锚点是 2024 年 2 月 $1B 估值的 Series B；按 Latka/Sacra
              第三方估算 $44.5M ARR 计算，隐含约 22x ARR 倍数。

              公开市场可比公司提供底部参照：Workiva（WK）是最接近的上市可比，作为面向审计、合规和风险报告的云平台，其交易倍数约为 5–7x ARR。这个公开市场倍数反映了 2021 年高点后宏观 SaaS
              倍数压缩，也反映 Workiva 处于更后期成长阶段（ARR 更大、增长更慢）。处在 DataSnipper 这种成长阶段的私有 SaaS 公司，通常较公开市场同业享有 2–4x 溢价，隐含合理私有估值区间为
              10–28x ARR。

              以 22x ARR 计，DataSnipper 位于私有市场可比估值倍数的上半区间，但并未明显溢价。该估值隐含：（1）ARR 年增长在未来 3+ 年持续高于 25–30%；（2）AI 层级增购成功，把 ARPU
              从基础订阅水平向上推；（3）四大客户留存没有重大恶化。三项假设都有执行风险，但现有证据方向上支持它们。

              AuditBoard 在 2022 年 Series D 中按约 $100M ARR 获得约 $3B 估值（30x ARR），倍数高于 DataSnipper，反映当时增长更快。FloQast 2023 年按约
              $50M ARR 融资，估值约 $1.2B（24x ARR），略高于 DataSnipper 倍数。这些可比说明，DataSnipper 22x ARR 倍数与合规/审计领域高增长垂直 SaaS
              公司的私有市场定价一致。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
