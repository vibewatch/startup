      - number: '8.4'
        title: 推荐逻辑与风险调整评估
        blocks:
          - type: paragraph
            body: >-
              建议为跟踪（Track），而非买入（Buy）或放弃（Pass），逻辑如下：DataSnipper 确实具备产品市场匹配、可信 AI 路线图，以及目前最好的客户验证组合（四大 + Microsoft
              合作）。但当前入场点（$1B）已经计入相当一部分上行空间，关键尽调缺口——NRR 数据、四大合同条款、AI 准确率基准、Microsoft Copilot 竞争路线图——仍未解决。

              若满足以下条件，买入（Buy）建议才合适：NRR 确认高于 120%；AI 套餐 ARR 增长超过总 ARR 的 40%；Microsoft 合作关系包含有意义的竞争保护；AI
              准确率基准确认达到专业级质量，重大抽取错误率低于 0.5%。

              若出现以下情况，应给出放弃（Pass）建议：任何四大客户流失或重谈；Microsoft 发布原生 Excel 审计抽取产品；PCAOB 限制审计底稿中使用智能体式 AI；或 NRR 低于 100%。

              overallScore 为
