  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              DataSnipper 面对 3 条不同竞争弧线：(1) 产品已深度嵌入审计事务所工作流的既有项目管理系统供应商；(2) 试图构建全栈替代方案的新一代 AI 原生审计平台；(3)
              可配置到审计场景中的横向自动化工具（RPA、AI 文档处理）。 既有厂商弧线由 Caseware（私营、总部在 Canada、全球约 2,500+ 家事务所客户）和 Wolters Kluwer
              TeamMate+（隶属 Wolters Kluwer 治理解决方案集团）主导。 AI 原生弧线包括 AuditBoard（US，融资 $200M+，主要面向内部审计）、Fieldguide（US，Series
              B，面向外部审计），以及越来越多瞄准审计相邻工作流的 AI 初创公司。

              一个关键竞争细节是：DataSnipper 不是完整的审计项目管理系统。 它不替代 Caseware 或 TeamMate，而是与它们以及 Excel 集成。
              这让它更像附加层，而非对既有厂商的直接替代威胁；这种定位降低销售周期摩擦，但可能限制长期平台防御力。 Big Four 经常在既有 Caseware 或 TeamMate 部署旁边使用
              DataSnipper，意味着 DataSnipper 主要竞争的是审计师时间和预算，而不是平台主导权。

              新一代 AI 原生竞争者——尤其是瞄准公众会计的 AI 优先项目平台 Fieldguide——更具颠覆性威胁，因为它把项目管理和 AI 文档抽取合到一个系统里，可能让 DataSnipper
              的附加层模式在新进入者面前过时。 不过，Fieldguide 缺乏 DataSnipper 的装机基础和已验证的 Excel 工作流集成；对现有 Big Four 用户群体而言，DataSnipper
              仍是阻力最小的路径。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: 既有竞争者：Caseware 与 Wolters Kluwer
        blocks:
          - type: paragraph
            body: >-
              Caseware International（总部 Toronto，2018 年被 Hg Capital 收购）是全球外部审计项目管理平台的主导者，覆盖 130+ 个国家的 500,000+ 用户。
              Caseware Working Papers 是全球许多中型和区域事务所审计底稿管理的事实标准。 Caseware 近期产品演进包括云原生 EMS Caseware Engage，以及数据分析平台
              Caseware IDEA。 2024–2025 年，Caseware 推出 Caseware Verity，这是一个把生成式 AI 直接整合进 working papers 和项目工作流的 AI
              平台——代表了对 DataSnipper AI 定位的直接竞争回应。

              Wolters Kluwer TeamMate+ 是大型企业和 Big Four 各国业务中主要的外部与内部审计平台，在 US 和 UK 尤其强。 TeamMate+ 主要在内部审计和企业合规用例上与
              DataSnipper 竞争。 Wolters Kluwer 拥有深度监管内容集成（CCH 合规数据库），使 TeamMate+ 面对合规密集型企业客户时具备可防守的交叉销售位置。

              Caseware 和 TeamMate 都通过惯性反而给 DataSnipper 提供结构性竞争优势：深度嵌入这些平台的事务所，已投入多年沉淀底稿模板和项目历史。 DataSnipper 的 Excel
              插件设计避免破坏这些投资。 但同一批既有厂商如今也在内部加入 AI 能力；如果其更大工程团队和既有客户基础能以有竞争力的质量复制 DataSnipper 的 AI 功能，DataSnipper
              的差异化会随时间收窄。
