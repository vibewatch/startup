      - number: '2.5'
        title: 规模测算缺口与矛盾估计
        blocks:
          - type: paragraph
            body: >-
              审计软件市场规模估算会随口径相差 2–10x，反映研究机构之间存在根本定义分歧。 保守窄口径估算为 $1.9B（Business Research Company：仅审计管理软件），宽口径估算为
              $15–20B+（全部 GRC/合规支出）；只要边界划法不同，两者在技术上都能成立。 投资人和管理团队通常展示更宽口径；保守分析师采用更窄口径。

              现有数据的关键矛盾包括：(1) 名义上同一市场的 CAGR 从 9.7%（Technavio）到 15.5%（Business Research Company）不等，可能源于地域覆盖和时间范围不同；(2)
              DataSnipper 的 500K–600K 用户基数若按典型 $200–600/ user/year 定价计算，在现有用户 100% 钱包份额下，当前 ARR 上限为 $100M–360M——这意味着 AI
              档位增购存在显著价格上行空间，或者当前每席位价格低于长期可持续水平；(3) 若干报告把财务关账软件（FloQast、BlackLine）计入审计总量，高估了纯审计工具市场。

              最可信的自下而上测算框架使用 ~1.5M 名全球审计 / 鉴证专业人士作为可触达用户池（IFAC 2024 估计），AI 赋能档位可实现 ARPU 为 $1,500–$3,500/year，得到长期 SAM 为
              $2.25B–$5.25B。 在当前 $44.5M ARR 下，DataSnipper 渗透率约 ~1–2%，处在早期拐点，捕获潜力很大，但执行风险也实质存在。
              一个关键尽调缺口是，公司未披露留存、流失和净留存率（NRR）指标；这些指标可以验证乐观市场份额预测中隐含的复合增长假设。
            claimRefs:
              - CM027
              - CM028
              - CM029
              - CM030
              - CM031
              - CM032
