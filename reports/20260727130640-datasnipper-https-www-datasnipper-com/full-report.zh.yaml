      - number: '7.6'
        title: 否决条件与缓释摘要
        blocks:
          - type: paragraph
            body: >-
              基于完整风险评估，以下否决条件将构成重大不利事件，需要立即重新评估 DataSnipper 投资判断：（1）Microsoft 发布原生 Excel 审计 AI 功能，直接竞争 DataSnipper 核心截取和
              AI 抽取场景；（2）某四大客户因自建等价功能而流失；（3）PCAOB 对 DataSnipper 客户事务所采取执法行动，并把 AI 底稿错误归因于 DataSnipper；（4）AI
              抽取准确率在规模化场景下失效，影响多个客户审计质量；（5）CEO Vidya Peters 离任。

              已有缓释措施包括：Microsoft 合作关系（加深生态锁定，并让商业利益更一致）；ISO 27001 + SOC 2 Type II（安全基线）；人在回路（human-in-the-loop）AI
              设计（PCAOB 合规）；四大分散（四家全覆盖降低单客户依赖）；以及 UpLink 收购（加深客户生命周期覆盖，提高切换成本）。这些缓释能降低上述风险，但不能消除风险。

              以 $1B 估值投资 DataSnipper，剩余风险画像为中高。最可能的严重情景是，Microsoft Copilot 在 3–5 年内把文档抽取场景商品化。基准情形仍是 DataSnipper
              的审计领域深度和四大关系，可在 2030 年前后提供持久竞争位置；但该假设需要按季度监测 Microsoft Copilot 产品路线图。
            claimRefs:
              - CR025
              - CR026
              - CR027
              - CR028
