      - number: '1.6'
        title: 图表与补充材料
        blocks:
          - type: callout
            title: Excel 原生护城河带来高粘性和口碑采用
            body: >-
              DataSnipper 选择原生嵌入 Microsoft Excel，而不是做独立产品，直接消除了审计团队最大的采用摩擦。 审计师大部分工作时间都在 Excel 中；DataSnipper
              不要求改变工作流，因此显著降低采购异议和培训成本。 这个架构选择本身也是竞争护城河：一旦审计事务所把 DataSnipper 工作流标准化，切换到替代方案就要重新培训、重做模板。 Big Four
              采用（四家均已确认）形成强大的同业影响力——事务所会向企业客户推荐该工具，用户基数随之在直销之外继续复合增长。
            calloutType: strength
            claimRefs:
              - CO002
              - CO004
              - CO026
          - type: callout
            title: CEO 任期短，关键人集中度偏高
            body: >-
              Vidya Peters 直到 2023 年才被任命为 CEO，以公司当前规模看，她的任期仍相对较短。 她的商业化履历很强，但创始人已转向顾问角色，意味着相当一部分机构化产品知识如今掌握在新近加入的高管团队手中。
              如果 Peters 离任，或从创始人主导的产品直觉转向职业经理人治理时出现执行缺口，DataSnipper 可能面临产品战略和文化连续性风险。
            calloutType: risk
            claimRefs:
              - CO009
              - CO010
              - CO013
              - CO016
          - type: callout
            title: 独角兽估值前的自举盈利说明资本效率高
            body: >-
              DataSnipper 有 5 年自举期（2017–2022），且据称在外部融资前已盈利；这在风投支持的 AI 软件领域很少见。 这段历史说明，核心产品击中了高痛点、ROI
              近乎即时的工作流，客户无需大量销售补贴也愿意付费。 早期资本强度低，也可能指向较高毛利率。 但 Series B 后的全球扩张投入（4 个新城市办公室、收购 UpLink、新产品发布）会显著推高烧钱速度，2022
              年后的盈利状态并未公开。
