chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              DataSnipper 是一套原生运行在 Microsoft Excel 内的智能自动化平台，专为审计和财务专业人士打造。 公司 2017 年在 Netherlands 的 Amsterdam
              注册成立，从一家自举创业公司成长为全球知名的审计科技独角兽。 核心价值主张很直接：让审计师从任何类型的文档——发票、银行流水、PDF、扫描收据——中「截取」数据，并自动把这些数值链接、匹配、核对到 Excel
              表格单元格。 审计师一天里大量时间耗在手工、重复的检查上，这套流程吃掉了其中大部分工作。 DataSnipper 直接嵌入 Excel，不要求用户改用另一套工具，因此去掉了竞品常见的采用门槛：工作流改变。
              公司采用 SaaS 订阅模式，按用户定价，并提供分层方案，从核心文档自动化到包含 DocuMine 和 Excel Agents 的完整 AI 驱动套件。 截至 2026
              年，公司提供以审计和财务团队为核心定位的智能体 AI 平台，AI 智能体可端到端执行多步骤审计工作流。 DataSnipper 产品覆盖外部审计、内部审计、税务咨询、法务会计和财务控制等场景，站在 B2B
              SaaS 与专业服务自动化的交叉点。
