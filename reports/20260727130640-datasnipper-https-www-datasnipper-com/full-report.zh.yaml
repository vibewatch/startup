            claimRefs:
              - CP007
              - CP008
          - type: callout
            title: 共存模式降低竞争强度，但限制钱包份额
            body: >-
              DataSnipper 与 Caseware/TeamMate 在同一 Big Four 部署中共存，这降低了竞争性流失，但也意味着 DataSnipper 只能捕获总审计软件支出的一部分。
              从附加工具扩展为平台，是未来 3–5 年最关键的战略考验。
            calloutType: insight
            claimRefs:
              - CP002
              - CP003
              - CP023
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与收入流
        blocks:
          - type: paragraph
            body: >-
              DataSnipper 的主要收入模式是按席位 SaaS 订阅，直接销售给审计事务所和企业客户。 平台至少提供两个档位：标准自动化档（传统 DataSnipper 截取和交叉引用工具）与 AI 档（AI
              Extractions 和 Excel Agents，分别在 2025 年和 2026 年推出）。 公司报告称，2026 年 58% 的新客户选择 AI 套餐，说明收入组合正快速转向更高 ARPU 档位。

              次要收入流包括：(1) UpLink 订阅费（2024 年收购的文档请求门户）；(2) 大型企业部署中的专业服务和实施费用（未作为收入类别公开披露，但在审计软件中常见）；(3) 可能来自 Azure
              Marketplace 上架的 Microsoft 联合销售收入（商业条款未披露）。 DataSnipper 核心工具不提供按交易或按使用量计费模式；订阅是唯一公开确认的变现结构。

              向 AI 档位迁移对收入质量有战略意义：AI 套餐的 ARPU 可能比标准席位高 2–5x；如果 58% 新客户采用，按 cohort 加权的平均 ARPU 会继续上升，即便新客户数量增长放缓。
              这会形成由增购驱动的净留存率（NRR）动态，使高收入增长不必依赖同等幅度的用户增长加速。 但实际 ARPU、NRR 和总收入留存率并未公开披露。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
