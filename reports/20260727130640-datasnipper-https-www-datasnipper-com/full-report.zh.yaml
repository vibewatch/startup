      - number: '1.3'
        title: 融资与资本结构
        blocks:
          - type: paragraph
            body: >-
              DataSnipper 的资本形成路径偏保守，也由里程碑驱动。 公司直到 September 2022 才寻求外部风险资本；当时 Insight Partners 领投了首个披露融资轮，规模约 $16
              million，验证了其快速商业牵引。 到 2024 年初，公司收入连续多年每年翻倍以上，吸引了 Tier 1 成长型投资人。 February 2024，DataSnipper 完成由 Index
              Ventures 领投的 $100 million Series B，投后估值 $1 billion，正式成为独角兽。 Insight Partners 和 ICONIQ Growth 也参与了 Series
              B。 截至 July 2026，DataSnipper 两轮融资累计募资约 $116 million。 公司未披露任何公开债务或信贷额度。 $1 billion 估值相当于其 2025 年报告的 $44.5
              million ARR 的约 22x 收入倍数，符合收入每年翻倍的成长期 SaaS 公司倍数。 据报道，Index Ventures 合伙人 Hannah Seal 在 Series B 后成为董事会成员。
              公司自举起家，且据称在外部融资前已盈利，说明其运营模式资本效率较高；但融资后的招聘和全球扩张会推高现金消耗。 截至 July 2026，尚未公开宣布 Series C 或额外融资。
