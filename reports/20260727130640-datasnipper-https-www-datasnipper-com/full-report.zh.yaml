              - CE005
              - CE006
              - CE007
              - CE008
      - number: '5.2'
        title: 产品模块与资产矩阵
        blocks:
          - type: paragraph
            body: >-
              DataSnipper 的产品架构围绕四个主要模块组织：

              Intelligent Automation Platform
              是基础层，覆盖文档截取、交叉引用和核对。它支持银行对账单、发票、采购订单、汇款通知等结构化文档，并以高准确率做模式匹配。平台会捕捉并展示证据勾稽和批注，这些内容会进入底稿文档，形成从文档到 Excel
              链接的可审计轨迹。

              AI Extractions 于 2025 年与 Microsoft 合作推出，使用 Azure AI 处理合同、贷款协议、董事会会议纪要、往来函件等非结构化文档，并按自然语言查询抽取指定数据字段。这显著拓宽了
              DataSnipper 可自动化处理的文档类型，不再局限于结构化财务文档。该功能基于 Microsoft Azure Form Recognizer 和 Azure OpenAI，借助 Microsoft
              的企业级 AI 基础设施落地。

              Excel Agents 是智能体式 AI 层，计划在 2026 年达到正式可用状态，可在 Excel 内自主执行多步骤审计程序。用户可以指令智能体执行复杂核对流程，例如把所有发票与 PO
              记录交叉核对并标记差异，而不需要人类逐步指导每个动作。

              UpLink（2024 年收购）是云端客户门户，让审计事务所通过安全的请求管理系统向客户发送和接收文档，替代基于邮件的文档交换。它与 DataSnipper 核心平台集成，客户传入的文档可以立即用于截取和 AI
              抽取。
