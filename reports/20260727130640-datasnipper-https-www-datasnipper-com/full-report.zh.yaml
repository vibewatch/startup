      - number: '1.2'
        title: 创立与领导团队
        blocks:
          - type: paragraph
            body: >-
              DataSnipper 由 Kai Bakker、Jonas Ruyter 和 Maarten Alblas 于 2017 年共同创立，三位创始人都具备会计技术和创业背景。
              他们看到，审计师把大量时间花在手工文档检查和核对上——这类工作重复、容易出错，也很消耗人——于是做出了一款活在 Excel 里的初始产品，Excel 正是审计师的原生工作环境。 公司大约 5
              年靠自身现金流运转后才接受外部资本，在风投支持的 SaaS 公司中并不常见，也说明产品市场匹配度强。 2023 年，Vidya Peters 被任命为 CEO，负责带领 DataSnipper 进入全球扩张阶段。
              Peters 拥有高增长科技公司的 C 级管理经验：她曾任 Marqeta 首席运营官（管理 350+ 人的 go-to-market 组织，并推动公司在 2021 年上市）、MuleSoft
              首席营销官（MuleSoft 于 2017 年上市，后被 Salesforce 收购），也曾在 Intuit 负责产品和营销，深度熟悉会计与财务软件行业。 Peters 上任后，创始人 Maarten
              Alblas 和 Jonas Ruyter 转任董事会和顾问角色，继续参与产品创新与战略。 Thilo Richter 担任产品与工程副总裁。 截至 2026 年初，公司约有 14 名主要高管、全球约 289
              名员工。 具备领域经验的创始人叠加成熟的商业化 CEO，让 DataSnipper 既有产品可信度，也有 go-to-market 执行力。
