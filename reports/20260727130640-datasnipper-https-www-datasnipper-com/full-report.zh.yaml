      - number: '1.5'
        title: 里程碑与战略事件
        blocks:
          - type: paragraph
            body: >-
              DataSnipper 从创立走到独角兽，经历了几个关键拐点。 公司 2017 年创立于 Amsterdam，并在 5 年内有机增长，在没有外部融资的情况下实现盈利。 September 2022，Insight
              Partners 的首笔外部投资催化了招聘和产品扩张阶段。 2023 年，Vidya Peters 出任 CEO，叠加收入继续翻倍，为 Series B 铺路。 February 2024，DataSnipper
              以 $1 billion 估值完成 Series B，获得 $100 million 新资金，这是迄今最受瞩目的里程碑。 2024 年，DataSnipper 完成首笔战略收购——收购基于云的文档请求门户
              UpLink——并推出 DocuMine：一款借助自然语言提示从文档中挖掘信息的 AI 产品，同时发布 Advanced Extraction Suite。 公司还在 Tokyo、Sydney、Kuala
              Lumpur 和 Mexico City 新设办公室，扩大地理覆盖。 July 29, 2025，公司宣布与 Microsoft 达成标志性合作，基于 Microsoft Azure 基础设施共同开发嵌入
              Excel 的 AI 智能体。 2025 年，公司与 Microsoft 合作推出 AI Extractions，并上架 Microsoft Azure Marketplace。 2026 年，Excel
              Agents——允许通过自然语言执行审计工作流的完整智能体 AI 能力——全面开放。 DataSnipper 保持了无反向记录的法律与监管历史；截至 July 2026，未见已知重大诉讼、监管制裁或数据泄露。
