      - number: '4.5'
        title: 资本充足性与融资
        blocks:
          - type: paragraph
            body: >-
              DataSnipper 于 February 2024 完成由 Index Ventures 领投的 $100M Series B，Insight Partners 和 ICONIQ Growth 参投。 包括
              2022 年 Insight Partners 约 ~$16M 的 Series A 在内，披露累计融资约 $116M。 在外部融资前，公司约 5 年依靠自举增长。

              资本充足性评估：按成长期 SaaS 典型烧钱速度，$100M 从 February 2024 起提供 18–36 个月现金跑道（即 August 2025 到 February 2027）。 截至 July
              2026，公司距融资日已过去 17 个月。 如果烧钱处于低端（$3M/month），公司约保留 $49M 现金；如果处于高端（$6M/month），约剩 $2M——意味着迫切需要额外资本。 截至 July
              2026 尚未宣布 Series C。

              一个关键尽调问题是，Microsoft 合作是否包含递延收入、最低商业承诺或优惠定价条款，从而改善近中期现金流。 Azure Marketplace 上架让企业可用 Azure credit 部署，可能在不要求
              DataSnipper 持有应收账款的情况下，显著加速企业销售。 先前自举盈利的历史也为管理层提供了回归盈利的模板，一旦增长投资收缩，公司可据此调节；这对资本效率管理是正面信号。
