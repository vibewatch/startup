      - number: '1.4'
        title: 规模与市场位置
        blocks:
          - type: paragraph
            body: >-
              对一家成立仅 9 年的公司而言，DataSnipper 已达到可观的商业规模。 在 February 2024 Series B 公告时，平台服务 125 个国家的 400,000+ 名审计师，客户包括全部
              Big Four 会计师事务所：Deloitte、Ernst & Young、KPMG 和 PricewaterhouseCoopers。 到 2026 年中，用户数已增至 175+ 个国家的约 600,000
              名，企业客户估计超过 2,200 家。 这批用户已越过外部审计边界：DataSnipper 在银行、保险和制造企业的内部审计团队，以及税务咨询和法务会计团队中也取得明显渗透。 非审计企业客户包括 Hilton
              Hotels、Siemens、Frontier Airlines 和 Australia 的 Government of Queensland。 数据服务商 Latka 报告，公司 2024
              年年度经常性收入（ARR）为 $44.5 million；公司自报收入连续多年每年翻倍。 DataSnipper 连续两年被评为 Netherlands 增长最快的科技公司，引用的累计营业额增长为 6,715%。
              公司持续入选 Forbes Fintech 50，并获得 TIME Best Inventions 2025 等行业认可。 净推荐值和会计师事务所网络中的口碑采用被认为是关键增长驱动：一旦某家 Big Four
              采用 DataSnipper，工具往往也会扩散到该事务所的企业客户。
