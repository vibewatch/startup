  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与范围
        blocks:
          - type: paragraph
            body: >-
              审计软件市场包含多层嵌套，从狭义的文档自动化工具，到宽泛的治理、风险与合规（GRC）平台。 最宽口径——全球审计和鉴证专业人士的全部技术支出，包括项目管理、文档自动化、数据分析和财务关账系统——在 2024–25
              年约为 $3.1B 至 $5.2B，取决于定义边界。 DataSnipper 位于审计项目管理软件与智能文档处理的交叉点，自动完成 Excel 审计底稿中支持性文档的数据抽取与核对。

              DataSnipper 核心产品的相邻替代方案包括：初级员工执行的手工审计程序；审计团队自建的 Excel VBA 宏和 Power Query 扩展；技术领先事务所部署的机器人流程自动化（RPA）工具；以及
              ACL/Galvanize（现为 Diligent Analytics）等独立数据分析平台，这类平台更偏数据抽样，而非文档级核对。 现状替代方案仍是 Excel
              加手工复制粘贴；它不产生直接软件支出，却代表了巨大的机会成本。

              相关市场有 3 个清晰层次：(1) 审计专用项目管理软件（EMS），估计 $1.5–2B；(2) 应用于审计工作流的智能文档处理（IDP），这是一个更新、增长更快的 $500M–$1B 细分；(3)
              更宽的财务审计相邻 GRC 市场，估计 $8–20B。 DataSnipper 主要在第 (1) 层竞争，并正扩展到第 (2) 层。 第 (3) 层代表长期平台可选性，但不是当前主要市场。
            claimRefs:
