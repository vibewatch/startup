      - number: '5.5'
        title: 信任、安全、合规与路线图
        blocks:
          - type: paragraph
            body: >-
              DataSnipper 能接触客户财务数据（审计证据、银行对账单、发票、合同），信任和安全因此是生死线。平台已取得 ISO 27001 认证和 SOC 2 Type II
              审计，达到四大企业采购的最低安全要求。欧洲市场占 DataSnipper 用户基础的重要部分（总部在荷兰，四大欧洲部署是主要客户），GDPR 合规在运营上至关重要。

              平台的 AI 模型按人在回路（human-in-the-loop）模式设计：AI 抽取的数据进入底稿前，审计师会先复核。这个设计符合 PCAOB 和 IAASB 指引；这些指引禁止审计师把专业判断委托给 AI
              系统。因此，DataSnipper 把自己定位为 AI 辅助工具而非 AI 自主工具，这是合规功能，不是产品限制。

              2025–2026 年的产品路线图信号包括：继续扩展 AI Extractions 能力（新文档类型、新语言）、扩展 Excel Agents（更多自主程序模板）、加深与 Microsoft 365
              Copilot 的企业用户集成，以及可能进入财务关账和内部审计工作流。收购 UpLink 表明公司想把文档抽取之外的项目生命周期拿得更深——走向同时管理文档收集和分析的平台模式。
