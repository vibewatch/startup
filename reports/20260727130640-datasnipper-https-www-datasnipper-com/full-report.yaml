            body: >-
              AuditBoard (Los Angeles, CA) is the leading AI-native platform for internal audit, risk management, and
              compliance. Founded in 2014, AuditBoard raised over $200M and was acquired by Hg Capital in 2023 for
              approximately $3B. Its platform connects internal audit, SOX compliance, risk, and ESG workflows in a
              unified cloud system. While AuditBoard's primary market is internal audit at public companies—distinct
              from DataSnipper's external audit focus—its AI document processing and evidence collection capabilities
              overlap with DataSnipper's use cases in cross-functional audit teams.

              Fieldguide (San Francisco, CA) is the most direct AI-native challenger to DataSnipper in the external
              audit workflow. Founded in 2020 and backed by Bessemer Venture Partners and Andreessen Horowitz,
              Fieldguide raised $30M Series B in 2023 and positions itself as a full AI-powered engagement platform for
              public accounting firms. Fieldguide's approach replaces the traditional engagement management system with
              an AI-first platform that includes document extraction, request management, and workflow
              automation—covering more of the engagement scope than DataSnipper's Excel add-in model.

              The risk from Fieldguide is not current revenue displacement—its customer base is smaller and focused on
              US mid-market firms—but a future scenario where new-entrant firms choosing their first technology platform
              select Fieldguide over a DataSnipper+Caseware bundle. This new-customer churn risk is harder to measure
              than existing-customer retention and could compress DataSnipper's growth rate in the mid-market segment
