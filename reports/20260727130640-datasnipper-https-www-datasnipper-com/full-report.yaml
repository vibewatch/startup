      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Excel-Native Moat Creates Sticky, Word-of-Mouth Adoption
            body: >-
              DataSnipper's decision to embed natively in Microsoft Excel rather than build a standalone product
              eliminates the principal adoption friction for audit teams. Auditors spend the majority of their working
              time in Excel; DataSnipper requires no workflow change, dramatically reducing procurement objections and
              training cost. This architectural choice is also a competitive moat: once audit firms standardize on
              DataSnipper workflows, switching to an alternative requires retraining and re-templating. The Big Four
              adoption (all four firms confirmed) creates powerful peer-influence dynamics—firms recommend the tool to
              their corporate clients, compounding the user base beyond direct sales.
            calloutType: strength
            claimRefs:
              - CO002
              - CO004
              - CO026
          - type: callout
            title: CEO Tenure and Key-Person Concentration
            body: >-
              Vidya Peters was appointed CEO as recently as 2023, making her tenure relatively short for a company at
              scale. While her commercial pedigree is strong, the founders having transitioned to advisory roles means a
              significant portion of institutional product knowledge now resides with a recently joined executive team.
              If Peters were to depart or if the transition from founder-led product intuition to professional
              management created execution gaps, DataSnipper could face product strategy and culture continuity risks.
            calloutType: risk
            claimRefs:
              - CO009
              - CO010
              - CO013
              - CO016
          - type: callout
            title: Bootstrapped Profitability Signals Capital Efficiency Before Unicorn Valuation
            body: >-
