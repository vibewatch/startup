chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              DataSnipper is an intelligent automation platform operating natively within Microsoft Excel, purpose-built
              for audit and finance professionals. The company was incorporated in Amsterdam, Netherlands in 2017 and
              has grown from a bootstrapped startup into a globally recognized audit technology unicorn. Its core value
              proposition is enabling auditors to 'snip' data from any type of document—invoices, bank statements, PDFs,
              scanned receipts—and automatically link, match, and reconcile those values with cells in Excel
              spreadsheets. This eliminates the majority of manual, repetitive checking work that constitutes a large
              portion of an auditor's day. By embedding directly into Excel rather than requiring users to adopt a
              separate tool, DataSnipper removes the adoption barrier inherent in competing solutions that demand
              workflow changes. The company operates a SaaS subscription model, pricing per user and offering tiered
              plans that range from core document automation to full AI-powered suites including DocuMine and Excel
              Agents. As of 2026, the company offers an agentic AI platform branded as the platform for audit and
              finance teams, with AI agents capable of executing multi-step audit workflows end-to-end. DataSnipper's
              product is used across external audit, internal audit, tax advisory, forensic accounting, and financial
              control functions, positioning it at the intersection of B2B SaaS and professional services automation.
