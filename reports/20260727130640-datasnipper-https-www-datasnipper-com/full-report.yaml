      - number: '1.4'
        title: Scale and Market Position
        blocks:
          - type: paragraph
            body: >-
              DataSnipper has achieved significant commercial scale for a company founded just nine years ago. At the
              time of its February 2024 Series B announcement, the platform served over 400,000 auditors in 125
              countries, including all four Big Four accounting firms: Deloitte, Ernst & Young, KPMG, and
              PricewaterhouseCoopers. By mid-2026, user counts have grown to approximately 600,000 across 175+
              countries, with corporate customers estimated at over 2,200. This user base extends beyond external audit:
              DataSnipper has made significant inroads into internal audit at banking, insurance, and manufacturing
              companies, as well as tax advisory and forensic accounting teams. Non-audit enterprise clients include
              Hilton Hotels, Siemens, Frontier Airlines, and the Government of Queensland, Australia. The company's 2024
              Annual Recurring Revenue was reported at $44.5 million by data service Latka, with a self-reported growth
              rate of doubling annually for multiple years. DataSnipper has been recognized as the fastest-growing
              technology company in the Netherlands for two consecutive years, citing 6,715% cumulative turnover growth.
              The company is consistently listed on the Forbes Fintech 50 and has received industry recognition
              including TIME Best Inventions 2025. The Net Promoter Score and word-of-mouth adoption through accounting
              firm networks have been cited as key growth drivers: once adopted by a Big Four firm, DataSnipper's tools
              frequently spread to the firm's corporate clients as well.
