      - number: '1.3'
        title: Funding and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              DataSnipper's capital formation reflects a conservative, milestone-driven approach. The company did not
              seek external venture capital until September 2022, when Insight Partners led the first disclosed funding
              round of approximately $16 million, validating its rapid commercial traction. By early 2024, the company's
              revenue growth trajectory—more than doubling annually for multiple years—attracted Tier 1 growth
              investors. In February 2024, DataSnipper closed a $100 million Series B led by Index Ventures at a $1
              billion post-money valuation, officially achieving unicorn status. Insight Partners and ICONIQ Growth also
              participated in the Series B round. As of July 2026, the total capital raised by DataSnipper is
              approximately $116 million across both rounds. The company has no public debt or credit facilities
              disclosed. The $1 billion valuation represents a revenue multiple of approximately 22x against its
              reported $44.5 million ARR as of 2025, consistent with growth-stage SaaS multiples for companies doubling
              revenue annually. Index Ventures partner Hannah Seal is reported as a board member following the Series B.
              The company's bootstrapped origins and self-reported profitability before external funding suggest a
              capital-efficient operating model, though post-funding hiring and global expansion will have increased
              cash burn. No Series C or additional funding has been publicly announced as of July 2026.
