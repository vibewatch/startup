        title: Revenue Model and Streams
        blocks:
          - type: paragraph
            body: >-
              DataSnipper's primary revenue model is per-seat SaaS subscription, sold directly to audit firms and
              enterprise clients. The platform offers at least two tiers: a standard automation tier (legacy DataSnipper
              snipping and cross-referencing tools) and an AI tier (AI Extractions and Excel Agents, launched in 2025
              and 2026 respectively). The company reports that 58% of new customers in 2026 choose the AI packages,
              indicating rapid revenue mix shift toward higher-ARPU tiers.

              Secondary revenue streams include: (1) UpLink subscription fees (document request portal acquired 2024),
              (2) professional services and implementation fees at large enterprise deployments (not publicly disclosed
              as a revenue category but typical in audit software), and (3) potentially Microsoft co-sell revenue from
              the Azure Marketplace listing (commercial terms not disclosed). DataSnipper does not offer a
              transaction-based or usage-based pricing model for its core tool; subscription is the sole publicly
              confirmed monetization structure.

              The shift toward AI tiers is strategically significant for revenue quality: AI packages likely command
              2–5x higher ARPU than standard seats, and if 58% of new customers adopt them, the cohort-weighted average
              ARPU is rising even if new customer volume grows slower. This creates an upsell-driven net revenue
              retention (NRR) dynamic that could sustain high revenue growth without equivalent user growth
              acceleration. However, the actual ARPU figures, NRR, and gross revenue retention are not publicly
              disclosed.
