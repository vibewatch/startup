      - number: '5.3'
        title: Technology Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              DataSnipper is architected as a Microsoft Excel add-in built using the Excel JavaScript API (Office.js
              framework). The add-in communicates with DataSnipper's cloud backend for document storage, AI processing,
              and user management. As of 2025, the AI processing workload is executed on Microsoft Azure, specifically
              using Azure AI (Form Recognizer for structured document extraction and Azure OpenAI for unstructured text
              extraction).

              The cloud infrastructure is hosted on Azure, consistent with the Microsoft partnership and enterprise
              security requirements. DataSnipper's security certifications include ISO 27001 and SOC 2 Type II, which
              are standard requirements for software vendors serving audit firms handling sensitive client financial
              data. The platform operates in compliance with GDPR for European data residency requirements.

              The technical dependency on Microsoft's Excel ecosystem creates both strength (deep integration,
              enterprise trust) and risk (subject to Microsoft API changes, Excel feature evolution, and Microsoft's own
              Copilot for Excel roadmap). DataSnipper's management of this risk through the July 2025 partnership—which
              involves joint AI agent development on Azure and co-marketing—suggests Microsoft views DataSnipper as an
              ecosystem partner rather than a feature acquisition target, but this dynamic could change.

              DataSnipper's engineering team is led by Thilo Richter (VP Product & Engineering) and represents a
