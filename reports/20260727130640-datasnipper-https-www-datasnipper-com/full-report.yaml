      - number: '1.2'
        title: Founding and Leadership
        blocks:
          - type: paragraph
            body: >-
              DataSnipper was co-founded in 2017 by Kai Bakker, Jonas Ruyter, and Maarten Alblas, each of whom brought
              backgrounds in accounting technology and entrepreneurship. The founders recognized that auditors spent
              enormous amounts of time on manual document checking and reconciliation—work that was repetitive,
              error-prone, and deeply unsatisfying—and built an initial product that lived inside Excel, the auditor's
              native environment. The company operated on its own cash flow for approximately five years before
              accepting external capital, a rarity in venture-backed SaaS and a signal of strong product-market fit. In
              2023, Vidya Peters was appointed as CEO to lead DataSnipper's global scaling phase. Peters brings C-suite
              experience from high-growth technology companies: she was Chief Operating Officer at Marqeta (where she
              managed a 350+ person go-to-market organization and helped the company go public in 2021), Chief Marketing
              Officer at MuleSoft (which went public in 2017 and was later acquired by Salesforce), and a product and
              marketing leader at Intuit, where she developed deep familiarity with the accounting and financial
              software industry. Founders Maarten Alblas and Jonas Ruyter transitioned to board and advisory roles upon
              Peters' appointment, continuing to contribute on product innovation and strategy. Thilo Richter serves as
              VP of Product and Engineering. As of early 2026, the company has approximately 14 main executives and
              roughly 289 employees globally. The combination of domain-expert founders and a seasoned commercial CEO
              provides DataSnipper with both product credibility and go-to-market execution capability.
