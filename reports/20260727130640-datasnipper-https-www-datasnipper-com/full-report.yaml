      - number: '7.3'
        title: Partner and Technology Dependency Risks
        blocks:
          - type: paragraph
            body: >-
              DataSnipper's most significant external dependency is Microsoft. The product is built on Microsoft Excel
              (Office.js API), hosted on Microsoft Azure, processes AI via Azure AI (Form Recognizer and Azure OpenAI),
              and is distributed through Microsoft Azure Marketplace and AppSource. This creates a triple Microsoft
              dependency: delivery, computation, and distribution. A single counterparty relationship mediates all
              three.

              The Microsoft partnership of July 2025 provides co-development access and co-marketing support but also
              deepens this dependency. If Microsoft chooses to build native Excel audit automation functionality—through
              Microsoft Copilot for Excel or a dedicated audit AI feature—DataSnipper's differentiation would erode from
              within its own technology stack. Microsoft has demonstrated willingness to disintermediate third-party
              add-ins in other categories (e.g., Cortana superseding third-party personal assistants, Teams superseding
              Slack at many Microsoft enterprise accounts).

              Azure AI pricing represents a variable cost risk. As DataSnipper's AI processing volumes increase (AI
              Extractions, Excel Agents), Azure AI API costs become a meaningful component of gross margin. Any Azure
              pricing increases could compress margins without equivalent ability to pass through costs to customers
              under fixed-price enterprise contracts.

              The UpLink acquisition introduced a secondary technology dependency: Suralink (a UpLink competitor) and
              other document request platforms represent alternatives that client-side audit teams could prefer. If
              UpLink's technology falls behind competitors, DataSnipper may need additional acquisition or development
              investment to defend this product line.
