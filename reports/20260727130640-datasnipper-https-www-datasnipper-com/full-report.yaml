      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The audit software market has several powerful structural tailwinds. The most significant is chronic
              talent shortage: the AICPA reported a net decline of approximately 300,000 CPA exam candidates over
              2019–2023, while audit work volumes continue to increase with regulatory complexity. This creates a
              productivity imperative that favors automation. AI capability advances—particularly large language models
              and document intelligence tools capable of extracting tabular data from unstructured PDFs—have crossed the
              commercial viability threshold for audit-grade accuracy requirements.

              Regulatory tailwinds reinforce demand. The PCAOB's 2023–2024 inspection cycle identified audit quality
              deficiencies at major firms partly attributable to insufficient sampling and documentation; regulators
              globally are raising quality standards that increase the cost of manual-audit approaches. Growing
              complexity of audit subjects—digital assets, complex financial instruments, supply chain
              dependencies—amplifies the documentation burden. Deloitte and EY have both publicly committed to
              significant technology investment, with Deloitte spending over $2B annually on technology across its
              business lines.

              Adoption constraints include: Excel pathway dependency (firms fully migrating away from Excel workpapers
              could reduce DataSnipper's addressable base), GDPR and data privacy regulations creating compliance
              overhead for vendors handling sensitive client financial data, evolving PCAOB and IAASB guidance on AI use
              in audit (creating cautious adoption posture among risk-averse audit partners), and substantial switching
              costs from incumbent engagement management systems where historical workpapers are stored. The current
              macroeconomic environment also creates cost-compression pressure on audit firm profit margins, slowing
              non-essential technology purchases.
            claimRefs:
              - CM019
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
