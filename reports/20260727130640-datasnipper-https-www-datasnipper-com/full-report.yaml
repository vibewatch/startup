  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Scope
        blocks:
          - type: paragraph
            body: >-
              The audit software market spans multiple nested layers ranging from narrow document automation tools to
              broad governance, risk, and compliance (GRC) platforms. The broadest scope—all technology spend by audit
              and assurance professionals globally, including engagement management, document automation, data
              analytics, and financial close systems—ranges from approximately $3.1B to $5.2B in 2024–25 depending on
              definitional scope. DataSnipper operates at the intersection of audit engagement management software and
              intelligent document processing, automating the extraction and reconciliation of supporting documents
              within Excel-based audit workpapers.

              Adjacent substitutes for DataSnipper's core offering include: manual audit procedures performed by junior
              staff, Excel VBA macros and Power Query extensions built in-house by audit teams, robotic process
              automation (RPA) tools deployed by technology-forward firms, and standalone data analytics platforms such
              as ACL/Galvanize (now Diligent Analytics) designed for data sampling rather than document-level
              reconciliation. The status-quo substitute remains Excel with manual copy-paste, which represents no direct
              software spend but a significant opportunity cost.

              The relevant market has three distinct layers: (1) audit-specific engagement management software (EMS),
              estimated at $1.5–2B; (2) intelligent document processing (IDP) applied to audit workflows, a newer and
              faster-growing $500M–$1B segment; and (3) the wider financial-audit-adjacent GRC market, estimated at
              $8–20B. DataSnipper primarily competes in layer (1) and is expanding into layer (2). Layer (3) represents
              long-term platform optionality but is not a current primary market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
