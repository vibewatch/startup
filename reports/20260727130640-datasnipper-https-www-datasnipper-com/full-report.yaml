  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risks
        blocks:
          - type: paragraph
            body: >-
              DataSnipper operates in the highly regulated audit profession, where evolving AI governance frameworks
              create material regulatory risk. The PCAOB's 2024 Spotlight on Generative AI established that auditors are
              personally liable for AI-generated workpaper errors and cannot delegate professional judgment to AI
              systems. As DataSnipper's agentic AI (Excel Agents) becomes more autonomous, the regulatory boundary
              between permissible AI assistance and prohibited AI decision-making is increasingly relevant. Any PCAOB
              enforcement action against a firm for over-reliance on DataSnipper's AI would create immediate
              reputational and commercial damage.

              The IAASB's International Standard on Auditing (ISA) framework is also evolving to address AI tools, with
              drafts proposing enhanced documentation requirements for AI-assisted audit procedures. European regulators
              (FRC in the UK, AFM in the Netherlands) are separately monitoring AI adoption in audit. DataSnipper is
              headquartered in the Netherlands and subject to Dutch regulatory oversight for its own operations,
              including GDPR compliance under the authority of the Dutch DPA (Autoriteit Persoonsgegevens).

              Intellectual property risks include limited patent protection for DataSnipper's document extraction
              algorithms. No patents are publicly disclosed; competitors could legally replicate DataSnipper's core
              functionality without IP infringement liability. DataSnipper's reliance on trade secrets and first-mover
              advantages for IP protection is a weaker form of protection than patent portfolios held by larger software
              companies.

              Contract risk with audit firms involves potential liability clauses for workpaper errors attributable to
              DataSnipper AI extraction failures. The contractual terms under which Big Four firms use
              DataSnipper—including warranty and indemnification scope—are not publicly disclosed and represent an
              unknown liability profile.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operational, Quality, and Security Risks
        blocks:
          - type: paragraph
            body: >-
              DataSnipper's AI extraction accuracy is an existential product quality risk. Auditors use
              DataSnipper-extracted data in workpapers that are reviewed by PCAOB/IAASB-inspected auditors and that
              support audit opinions on financial statements. If AI extraction errors are systematic or materially
              significant, they could cause audit failures, firm-level sanctions, or client financial statement
              restatements. DataSnipper has no publicly disclosed accuracy benchmarks for its AI Extractions, creating
              an unverifiable quality claim for the product's most important dimension.

              DataSnipper's Excel add-in architecture creates a dependency on Microsoft's Office.js API. Any breaking
              change in Excel's API, modification of Excel add-in policies, or shift in Microsoft's strategy toward
              native audit capabilities could disrupt DataSnipper's product without advance notice to customers. While
              Microsoft's July 2025 partnership reduces the probability of hostile API changes, it does not eliminate
              the risk entirely—Microsoft has historically deprecated or changed Office add-in APIs affecting
              third-party developers.

              Security risks include the handling of confidential client financial data (bank statements, invoices,
              contracts, board minutes) that passes through DataSnipper's Azure-hosted infrastructure. A security breach
              would expose clients to GDPR liability, audit professional confidentiality violations, and potential
              regulatory sanctions against the affected audit firms. DataSnipper's ISO 27001 and SOC 2 Type II
              certifications reduce but do not eliminate this risk.

              Operational scaling risk includes the challenge of maintaining AI extraction quality as the document type
              universe expands—AI Extractions, by design, processes previously unseen document types in ways that the
              base Intelligent Automation module (trained on structured financial documents) does not. Quality control
              for arbitrary unstructured document extraction is inherently harder to guarantee than structured format
              matching.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
