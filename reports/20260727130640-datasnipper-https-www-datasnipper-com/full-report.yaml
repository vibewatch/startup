              The difference between $1.9B (narrow audit management software) and $8B+ (GRC/compliance) reflects
              definitional choices, not factual disagreement. DataSnipper's addressable market depends heavily on
              whether it expands beyond Excel-native audit workflows into broader financial compliance use cases.
            calloutType: insight
            claimRefs:
