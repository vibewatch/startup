      - number: '2.2'
        title: TAM, SAM, and Market Sizing
        blocks:
          - type: paragraph
            body: >-
              Multiple independent market intelligence sources provide overlapping but divergent estimates of the global
              audit management software market. The Business Research Company estimates the audit management software
              market at $1.9B in 2025, growing to $3.89B by 2030 at a 15.5% CAGR. GM Insights values the broader audit
              software market at $3.4B in 2025, reaching $6.8B by 2032 at 12.8% CAGR. Technavio estimates the audit
              software market at $2.8B with a 9.7% CAGR through 2028. Emergen Research projects the audit software
              market at $3.1B in 2024 at 10.5% CAGR.

              A bottom-up validation cross-checks these figures: the ICAEW estimates approximately 3 million
              professional accountants globally, of whom roughly 900,000 are at the Big Four firms and 600,000– 900,000
              are dedicated audit professionals at non-Big-Four practices (per IFAC data). At achievable per-seat
              pricing of $1,500–$3,000 per user per year for professional-grade AI audit tools, approximately 1–1.5
              million addressable audit professionals imply a SAM of $1.5B–$4.5B. DataSnipper's current estimated ARR of
              $44.5M (Latka/Sacra 2025) represents approximately 1–3% penetration of this SAM.

              DataSnipper's SAM is further constrained by its Excel-native positioning. Firms migrating to cloud-native
              engagement systems that abandon Excel workpapers reduce DataSnipper's addressable user base unless the
              company extends its platform. The near-term SOM, based on current trajectory and announced geographic
              expansion to 175+ countries, is estimated at $150–300M ARR within 5 years, representing 3–10x growth from
              the current baseline. This assumes continued penetration of Big Four global rollouts, expansion to tier-2
              audit networks, and success with the enterprise internal audit segment.
