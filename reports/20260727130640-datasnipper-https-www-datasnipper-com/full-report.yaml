      - number: '6.4'
        title: Customer Use Cases and Value Realization
        blocks:
          - type: paragraph
            body: >-
              DataSnipper's value proposition centers on eliminating manual document inspection labor from audit
              workflows. The primary use cases generating customer adoption are:

              Bank statement reconciliation: auditors receive client bank statements as PDFs and must verify that
              balances match the general ledger. DataSnipper's snipping function allows the auditor to click on the PDF
              balance and link it to the Excel cell in seconds, replacing a manual copy-paste process. This is the
              highest-volume use case and likely drives initial adoption decisions.

              Invoice and purchase order vouching: auditors must trace expense transactions to underlying invoices and
              POs. DataSnipper can process batches of invoices, match amounts to GL transactions, and flag
              discrepancies—an AI Extractions use case that demonstrates the AI tier's value.

              Confirmation processing: audit standards require third-party confirmations of balances (bank
              confirmations, accounts receivable confirmations). DataSnipper processes returned confirmation documents
              and links them to the workpaper.

              Contract inspection: AI Extractions enables auditors to query contract terms (payment dates, obligation
              amounts, renewal clauses) from unstructured contract PDFs—a use case that was not automatable with the
              original snipping product.

              The EY Netherlands case study specifically validates bank statement and invoice use cases, noting that
              DataSnipper "dramatically reduced time spent on routine document inspection." Other customer testimonials
              on DataSnipper's website reference similar efficiency outcomes, though not all are attributable to
              independently verifiable named clients.
