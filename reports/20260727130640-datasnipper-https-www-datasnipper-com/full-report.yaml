  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Core Workflow
        blocks:
          - type: paragraph
            body: >-
              DataSnipper is a Microsoft Excel add-in that transforms audit document workflows by enabling auditors to
              extract, cross-reference, and reconcile data from source documents directly within their Excel workpapers.
              The core product functionality—called "snipping"—allows an auditor to select a value or text from a PDF,
              bank statement, invoice, or contract and automatically link it to the corresponding Excel cell, creating
              an audit trail of matched evidence. This eliminates the manual process of switching between documents and
              manually copying values, which DataSnipper claims reduces manual audit procedures by up to 70%.

              The product workflow integrates directly into existing audit engagement processes: auditors continue using
              Excel as their primary workpaper tool; DataSnipper adds a sidebar and ribbon within Excel that provides
              document management, snipping, annotation, and AI extraction capabilities. Documents are uploaded to the
              DataSnipper platform; the Excel add-in retrieves and displays them inline. This embedded approach means
              auditors adopt DataSnipper without changing their fundamental workflow—the product meets them where they
              already work.

              DataSnipper's product has evolved from a document matching tool (original functionality) to an intelligent
              document processing platform with AI-powered extraction of unstructured data. As of 2026, the platform
              includes three major product modules: (1) Intelligent Automation (the original snipping and
              cross-referencing core), (2) AI Extractions (Microsoft Azure AI-powered extraction of data from
              unstructured documents), and (3) Excel Agents (agentic AI that can autonomously execute multi-step audit
              procedures within Excel). The UpLink acquisition in 2024 added a client-facing document request portal to
              the platform.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
              - CE008
      - number: '5.2'
        title: Product Modules and Asset Matrix
        blocks:
          - type: paragraph
            body: >-
              DataSnipper's product architecture is organized around four primary modules:

              The Intelligent Automation Platform is the foundational layer encompassing document snipping,
              cross-referencing, and reconciliation. It supports structured documents (bank statements, invoices,
              purchase orders, remittance advices) with high accuracy pattern matching. The platform captures and
              displays evidence ticks and annotations that become part of the workpaper documentation, creating an
              auditable trail of document-to-Excel linkages.

              AI Extractions, launched in 2025 in collaboration with Microsoft, uses Azure AI to process unstructured
              documents—contracts, loan agreements, board minutes, correspondence—extracting specific data fields based
              on natural language queries. This significantly expands the types of documents DataSnipper can automate
              beyond structured financial documents. The feature is built on Microsoft Azure Form Recognizer and Azure
              OpenAI, leveraging Microsoft's enterprise AI infrastructure.

              Excel Agents, the agentic AI layer reaching general availability in 2026, enables autonomous multi-step
              audit procedures to be executed within Excel. An agent can be instructed to perform complex reconciliation
              workflows—e.g., cross-reference all invoices against PO records and flag discrepancies—without
              step-by-step human guidance per action.

              UpLink (acquired 2024) is a cloud-based client portal enabling audit firms to send and receive documents
              from clients through a secure request management system, eliminating email-based document exchange. It
              integrates with the core DataSnipper platform so incoming client documents are immediately available for
              snipping and AI extraction.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
