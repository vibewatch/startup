      - number: '2.5'
        title: Sizing Gaps and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >-
              Market size estimates for audit software vary by a factor of 2–10x depending on scope, reflecting
              fundamental definitional disagreement among research firms. Conservative narrow-scope estimates of $1.9B
              (Business Research Company: audit management software only) versus broad estimates of $15–20B+ (all
              GRC/compliance spend) are both technically defensible depending on how boundaries are drawn. Investors and
              management teams typically present broader figures; conservative analysts use narrower ones.

              Key contradictions in available data include: (1) CAGRs ranging from 9.7% (Technavio) to 15.5% (Business
              Research Company) for ostensibly the same market, likely reflecting different geographic coverage and time
              horizons; (2) DataSnipper's 500K–600K user base at typical pricing of $200–600/ user/year implies a
              current ARR ceiling of $100M–360M at 100% wallet share from existing users— suggesting either significant
              price upside from AI tier upsell or that current per-seat pricing is below long-run sustainable levels;
              (3) several reports include financial close software (FloQast, BlackLine) in audit totals, overstating the
              market for pure-play audit tools.

              The most credible bottom-up sizing framework uses ~1.5M global audit/assurance professionals as the
              addressable user pool (IFAC 2024 estimate), an achievable ARPU of $1,500–$3,500/year for AI-enabled tiers,
              yielding a long-run SAM of $2.25B–$5.25B. At current $44.5M ARR, DataSnipper holds ~1–2% penetration,
              placing it at an early inflection point with substantial capture potential but also material execution
              risk. A key diligence gap is the absence of disclosed retention, churn, and NRR metrics, which would
              validate the compounding assumption embedded in bull-case market share projections.
            claimRefs:
              - CM027
              - CM028
              - CM029
              - CM030
              - CM031
              - CM032
