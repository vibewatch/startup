callouts:
  - calloutType: strength
    title: "All Big Four Validated – Highest Quality Enterprise Reference Set"
    body: "All four Big Four accounting firms are DataSnipper customers, which is the highest possible customer reference set for an audit software company. This creates a self-reinforcing proof point for new firm sales and provides pricing leverage in renewal negotiations."
    claimRefs: [CU005, CU006, CU007, CU008]

  - calloutType: risk
    title: "Customer Concentration in Top-10 Firms Is Material Risk"
    body: "An estimated 40-60% of DataSnipper's ARR likely derives from fewer than 10 customers. A single Big Four firm building its own internal AI audit tool—as Deloitte's internal AI initiatives suggest is being considered—could trigger a material revenue event. The diversification into corporate internal audit is necessary but not yet proven."
    claimRefs: [CU018, CU019, CU020]

  - calloutType: risk
    title: "NRR and Churn Data Absent – Core Retention Quality Unknown"
    body: "The absence of publicly disclosed net revenue retention and gross churn metrics is a critical diligence gap. Without NRR data, it is impossible to assess whether DataSnipper's user growth reflects healthy expansion or masking churn. Latka/Sacra third-party ARR estimates are unaudited and should not substitute for audited financials."
    claimRefs: [CU012, CU022]

  - calloutType: insight
    title: "58% AI Package Adoption Among New Customers Is a Strong Upsell Signal"
    body: "The disclosure that 58% of new customers in 2026 choose AI packages (AI Extractions and/or Excel Agents) suggests effective tiered upselling and genuine willingness to pay for AI capabilities. If this mix rate translates into 2-3x ARPU versus base subscriptions, DataSnipper's revenue per new logo is significantly higher than the user growth number implies."
    claimRefs: [CU010, CU011]

