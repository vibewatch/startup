company:
  name: EigenQ
chapter:
  number: 7
  title: Risks
  summary: EigenQ's principal risks are transaction completion and liquidity dependency, execution across a partner-led commercialization model, and compliance exposure in security products that may process regulated data. Public evidence confirms conditions and dependencies but does not yet establish audited operating resilience, incident history, or mitigation maturity.
sections:
  - id: transaction-and-liquidity
    title: Transaction and liquidity exposure
    body: "The proposed SVAQ combination remains conditional rather than completed. Public sources describe SEC effectiveness, shareholder approvals, listing requirements, and other customary conditions, while the financing disclosures indicate that only about half of the committed convertible financing had been funded at the September filing milestone. This creates a sequencing risk: EigenQ's ability to scale manufacturing, integrations, and commercialization depends on a transaction and capital plan that remain exposed to approval, redemption, timing, and market conditions. The announced enterprise or equity value is a transaction reference, not proof of cash available or operating solvency. The practical kill criterion is a missed closing timetable, an unfunded financing tranche, or a materially reduced cash balance after redemptions and expenses."
    claimRefs: [CR001, CR002, CR003, CR004]
  - id: regulatory-and-data
    title: Regulatory, legal, and data-security exposure
    body: EigenQ markets hardware-rooted post-quantum security to government, defense, critical-infrastructure, and enterprise environments, so failures of compliance or assurance could block procurement even without a public breach. The proposed transaction itself remains subject to SEC and shareholder processes, while privacy obligations can attach wherever the company or its customers target or collect personal data. GDPR requires appropriate technical and organizational measures, accountability, and potentially severe penalties; Canadian PIPEDA materials emphasize accountability, safeguards, openness, and breach reporting. The public pool does not verify EigenQ's certifications, data-processing agreements, incident controls, or regulator interactions. Until those artifacts are produced, compliance maturity should be treated as unverified rather than assumed from product positioning.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR001]
  - id: execution-and-dependencies
    title: Operational, partner, and execution dependencies
    body: EigenQ's stated route to market relies on OEM, manufacturing, and channel relationships with HPE, AMD, WNC, and TD SYNNEX, while its public materials describe expansion across security, communications, networking, sensing, and computing. That breadth increases integration, qualification, supply-chain, and roadmap coordination requirements. The sources identify intended collaboration roles and target markets but do not disclose partner revenue concentration, service levels, manufacturing yields, warranty economics, deployment counts, or independent customer outcomes. A partner-led model can accelerate distribution, but it also creates counterparty and execution risk if a key integration slips, a supplier cannot scale, or channel economics do not convert announced relationships into repeatable deployments.
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR002, TR003]
  - id: monitoring-and-diligence
    title: Residual exposure and thesis-break monitoring
    body: "The evidence supports a high-risk, research-more posture rather than a conclusion that a specific failure has occurred. The most decision-relevant monitoring is measurable: SEC effectiveness and vote outcomes; the proportion and timing of committed financing actually funded; post-close cash and redemption sensitivity; independent evidence of production deployments and renewals; partner-specific delivery milestones; and security, privacy, or regulatory events. A diligence package should obtain the final S-4 and audited financial statements, sources-and-uses and warrant terms, partner contracts, security architecture and test reports, privacy and breach procedures, insurance, litigation searches, and customer references. These requests convert public uncertainty into observable gates without treating no recorded incident as proof of no incident."
    claimRefs: [CR013, CR014, CR015, CR016]
    figureRefs: [FR001]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Rule or case, Jurisdiction, Status, Likelihood, Severity, Mitigation maturity, Residual exposure, Diligence path]
    rows:
      - ["S-4 effectiveness and shareholder approval", "United States", "Proposed transaction; not yet effective or closed", "Medium", "High", "Partial", "Closing and timing remain conditional", "Obtain latest SEC correspondence, proxy status, vote results, and closing conditions"]
      - ["Nasdaq listing and warrant eligibility", "United States", "Application/proposed symbols; no assurance for warrants", "Medium", "High", "Partial", "Listing and liquidity may diverge from plan", "Confirm exchange approval, warrant treatment, and post-close trading conditions"]
      - ["GDPR privacy and security obligations", "European Union", "General obligations apply when scope is met; EigenQ posture not verified", "Medium", "High", "Unknown", "Penalties and remediation costs are unquantified", "Obtain data map, DPA templates, lawful-basis records, DPIAs, and incident procedure"]
      - ["PIPEDA safeguards and breach reporting", "Canada", "Framework requires accountability and safeguards; EigenQ applicability not verified", "Low", "Medium", "Unknown", "Customer procurement or reporting exposure is unquantified", "Confirm Canadian data flows, contracts, safeguards, and breach-notification playbook"]
    notes: Public sources describe proposed transaction conditions and general privacy obligations; they do not establish EigenQ's actual compliance status, licenses, certifications, or litigation record. Likelihood and severity are analytical risk ratings, not reported company metrics.
    enumerationScope:
      coverage: sample
      basis: Publicly disclosed transaction and privacy regimes identified in the assigned 2026 refresh evidence pool
    claimRefs: [CR001, CR005, CR006, CR007, CR008]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Security or privacy control failure in deployed infrastructure", "Medium", "Critical", "Unknown", "High", "No public independent control report or incident-response evidence"]
      - ["Product integration or cryptographic-agility deployment failure", "Medium", "High", "Partial", "High", "No independently verified performance, test, or deployment record"]
      - ["Manufacturing or delivery scale-up shortfall", "Medium", "High", "Partial", "High", "Capacity, yield, warranty, and service-level evidence unavailable"]
      - ["Roadmap dispersion across security, communications, sensing, AI, and computing", "Medium", "High", "Partial", "Medium", "Segment-level milestones and resource allocation not disclosed"]
    notes: Risk ratings synthesize disclosed product scope, partner dependencies, and missing assurance evidence; no row asserts that the failure has occurred.
    claimRefs: [CR009, CR010, CR011, CR012, CR013]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Concentration signal, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Hardware and platform integration", "HPE and AMD ecosystem", "Named strategic collaborations; economics undisclosed", "Integration delays reduce deployability or qualification", "High", "Obtain integration milestones, test results, and termination terms", "High"]
      - ["Volume manufacturing and go-to-market", "WNC Corporation", "Described as manufacturing and execution partner; share undisclosed", "Supplier capacity or quality shortfall delays delivery", "High", "Review manufacturing agreement, capacity plan, quality controls, and second-source plan", "High"]
      - ["Channel enablement and distribution", "TD SYNNEX", "Named channel participant; pipeline and take rate undisclosed", "Channel does not convert to recurring customer deployments", "Medium", "Obtain pipeline, conversion, margin, and renewal data", "Medium"]
      - ["SPAC trust and financing", "SVAQ and institutional financing", "About $215M trust cited before redemptions/expenses and $45M commitment partly funded", "Redemptions, tranche failure, or closing delay constrains runway", "Critical", "Reconcile sources-and-uses, redemption sensitivity, covenants, and cash runway", "High"]
    notes: Counterparties and roles are described by company or media sources; concentration, economics, service levels, and mitigation effectiveness are not publicly quantified in the assigned pool.
    claimRefs: [CR002, CR003, CR009, CR010, CR011, CR014]
figures:
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: Residual exposure is highest where transaction liquidity and security assurance depend on unverified conditions.
    data:
      columns: ["High likelihood", "Low likelihood"]
      rows:
        - label: Critical impact
          values: ["Transaction funding and closing dependency", "Security or privacy control failure"]
        - label: High impact
          values: ["Manufacturing or integration shortfall", "Roadmap and partner execution"]
        - label: Medium impact
          values: ["PIPEDA applicability and reporting exposure", "Channel conversion and renewal uncertainty"]
        - label: Low impact
          values: ["Disclosure gap on certifications", "Unverified complaint history"]
        - label: Control gap
          values: ["Unfunded financing tranche", "Unquantified warranty burden"]
        - label: Monitoring gap
          values: ["Missing customer deployment denominator", "No independent incident baseline"]
    approximationNotes: Likelihood and impact are qualitative analytical ratings grounded in disclosed conditions and evidence gaps; the matrix is not a probability model.
    claimRefs: [CR003, CR007, CR009, CR012, CR014, CR016]
callouts:
  - calloutType: risk
    title: Highest-conviction risk
    body: Transaction completion and liquidity are the clearest near-term risk because public sources explicitly condition the proposed listing on approvals and SEC effectiveness, while only part of the committed financing was funded at the latest filing milestone.
    claimRefs: [CR001, CR003]
  - calloutType: recommendation
    title: Diligence before conviction
    body: Maintain a research-more posture until the S-4, audited financials, sources-and-uses, partner contracts, and independent security and customer evidence close the largest exposure gaps.
    claimRefs: [CR013, CR014, CR015, CR016]
