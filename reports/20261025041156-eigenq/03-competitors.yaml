company:
  name: EigenQ
chapter:
  number: 3
  title: Competitors
  summary: EigenQ is entering a fragmented quantum-safe market where PQC software, hardware-rooted security, QKD, cloud controls, and systems integration address overlapping but not identical jobs. Its proposed differentiation is an integrated trust layer distributed through OEM and channel partners, but public evidence still shows a commercialization-stage platform rather than a proven scale advantage.
sections:
  - id: landscape
    title: Competitive landscape and buyer alternatives
    body: >-
      The relevant landscape is broader than firms that use the word quantum in their branding. CISA separates widely available PQC-capable cloud, collaboration, web, and endpoint categories from networking, identity, enterprise-security, and other categories that are still transitioning. That creates several buyer alternatives: software migration and crypto-agility specialists; incumbent security, certificate, HSM, and cloud vendors; QKD and quantum-randomness providers for specialized links; system integrators; and internal security engineering using standards and open-source components. The independent landscape review also describes PQC as deployable on classical infrastructure while QKD requires specialized optical hardware. EigenQ's proposed hardware-rooted trust, PQC, entropy, communications, and sensing scope therefore spans multiple competitive arenas rather than one clean peer set.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: profiles
    title: Profiles, scale signals, and strategic direction
    body: Public competitor profiles show materially different maturity and scope. The market report names IBM, Thales, AWS, Palo Alto Networks, Entrust, DigiCert, PQShield, Qrypt, and other vendors across solutions and services, while the independent ecosystem mapping places IBM, Palo Alto Networks, PQShield, QuSecure, SandboxAQ, cloud platforms, HSM vendors, and QKD providers in distinct categories. Those incumbents bring installed distribution, certification, or enterprise relationships that a new platform must convert into channel access. EigenQ's own announcements identify OEM and channel expansion, but they do not disclose customer counts, recurring revenue, win rates, or realized pricing. The proposed SPAC and convertible financing establish capital-market intent, not evidence of competitive scale.
    claimRefs: [CP005, CP006, CP007, CP008]
    tableRefs: [TP002]
  - id: differentiation
    title: Capability, packaging, and distribution comparison
    body: >-
      EigenQ's stated product architecture combines hardware-generated entropy, trusted identity, trusted execution, and post-quantum cryptography, with integration into existing infrastructure rather than wholesale replacement. That is a potentially useful packaging proposition for buyers that want one migration partner, but the public record does not establish comparative performance, certification breadth, implementation cost, or contract pricing. Competitors specialize differently: PQShield supplies embedded PQC IP, QuSecure supplies orchestration, cloud and certificate vendors embed controls in existing platforms, and QKD suppliers target high-security point-to-point links. The matrix below marks unverified cells as unknown rather than treating a vendor's marketing comparison as independent proof.
    claimRefs: [CP009, CP010, CP011, CP012]
    tableRefs: [TP003]
  - id: durability
    title: Switching costs, moat durability, and displacement risk
    body: The strongest near-term moat signal is distribution and implementation access, not a demonstrated proprietary performance lead. EigenQ says it is using OEM and channel ecosystems and has announced work involving WNC, TD SYNNEX, AMD, HPE, and Intel environments; those relationships could reduce deployment friction but also create partner dependency and limit control of economics. CISA's procurement framing and the Cloudflare migration account show that standards-based PQC is becoming available through incumbent infrastructure, which can compress differentiation as baseline features become embedded. The proposed transaction remains conditional on SEC effectiveness, shareholder approval, listing requirements, and other closing conditions, while only half of the announced convertible financing was initially funded. These are execution and liquidity risks to a moat thesis, not proof of failure.
    claimRefs: [CP013, CP014, CP015]
callouts:
  - calloutType: strength
    title: Ecosystem-led wedge
    body: EigenQ's stated OEM and channel model could make infrastructure retrofit more scalable than a direct, stand-alone security appliance motion, if partners produce measurable deployments and economics.
    claimRefs: [CP009, CP013]
  - calloutType: risk
    title: Incumbent feature absorption
    body: CISA identifies PQC-capable products across mainstream categories, while major cloud, security, certificate, and HSM vendors are already listed in the competitive ecosystem; standards adoption may make baseline functionality harder to defend.
    claimRefs: [CP002, CP006, CP014]
  - calloutType: recommendation
    title: Require comparative proof
    body: Before treating EigenQ as a differentiated platform, diligence should obtain third-party performance, certification, customer deployment, pricing, renewal, and partner-margin evidence against named incumbent and specialist alternatives.
    claimRefs: [CP011, CP012, CP015]
