    claimRefs: [CP001, CP003, CP004, CP005, CP006]
  - id: TP002
    title: Competitor profile and scale signals
    columns: [Competitor, Category, Public scale or maturity signal, Target buyer, Strategic direction, Limitation for comparison]
    rows:
      - [IBM, Incumbent platform and services, "Named among major PQC market companies; offers PQC integration through broader quantum-safe services", Enterprise and government, Embed quantum-safe migration in existing services, No comparable EigenQ win-rate or revenue data]
      - [Palo Alto Networks, Incumbent security platform, "Named as a major PQC market company and described as integrating PQC into security platforms", Enterprise security teams, Add PQC to an installed security platform, Public source does not isolate PQC revenue or pricing]
      - [PQShield, PQC specialist, "The Quantum Insider reports more than $63 million raised", Semiconductor vendors and government agencies, Embedded hardware and software PQC IP, Funding is not operating revenue or deployment scale]
      - [QuSecure, Integrated PQC platform, "Independent landscape maps an orchestration platform for rapid enterprise-network deployment", Enterprise and government, Orchestrate quantum-safe migration, No public apples-to-apples performance or contract terms]
      - [AWS / Microsoft Azure / Google Cloud, Cloud incumbents, "Independent landscape says major cloud vendors are integrating PQC into TLS and key-management services", Cloud customers, Make quantum-safe controls part of cloud infrastructure, Cloud feature availability is not evidence of EigenQ displacement or parity]
      - [EigenQ, Integrated trust infrastructure, "Company describes hardware-anchored trust, PQC, entropy, identity, and trusted execution; financing announcement cites OEM and channel expansion", "Government, enterprise, industrial, and national-security buyers", Commercialize through OEM and channel ecosystems, "Customer count, recurring revenue, realized pricing, and comparative benchmarks are undisclosed"]
    notes: "Scale signals retain their original metric type: funding is not revenue, a named capability is not adoption, and company descriptions are company claims. The public pool does not support a uniform market-share or customer-count comparison."
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
  - id: TP003
    title: Feature and capability matrix
    columns: [Buying criterion, EigenQ, PQC specialists, Cloud / security incumbents, QKD providers, Evidence status]
    rows:
      - [Post-quantum cryptography, "Stated platform component", "Core focus for PQShield, CryptoNext, Post-Quantum, and others", "Integrated by major cloud and security vendors", "May be combined with QKD", "Supported at category level; comparative implementation depth unknown"]
      - [Hardware-rooted trust, "Stated integrated architecture", "PQShield and Crypto4A provide hardware or embedded components", "HSM and infrastructure vendors provide adjacent controls", "Specialized hardware is intrinsic to QKD", "EigenQ comparative certification and performance unknown"]
      - [Trusted identity and execution, "Stated platform components", Unknown, "Certificate, HSM, cloud, and security platforms provide adjacent functions", "Not the primary QKD value proposition", "No comparable EigenQ product documentation in assigned sources"]
      - [Cryptographic inventory and migration orchestration, "Not separately evidenced in assigned sources", "Keyfactor, evolutionQ, QuSecure, and others are mapped to migration workflows", "Cloud and security vendors cover pieces of the workflow", "Usually outside QKD scope", "Unknown for EigenQ"]
      - [OEM and channel distribution, "Company says it is expanding delivery with OEM and channel partners", "Partner routes vary by vendor", "Incumbents have installed distribution", "Often specialist or infrastructure-led", "Relationship existence is evidenced; economics and deployment volume unknown"]
      - [Pricing and packaging, Unknown, Unknown, Often bundled or usage-based, Specialized project or hardware economics, "No retained source provides comparable realized pricing"]
    notes: "Unknown means the assigned evidence did not establish the cell; it is not a negative product claim. Vendor-authored descriptions are not treated as independent benchmark evidence."
    claimRefs: [CP009, CP010, CP011, CP012, CP013]
