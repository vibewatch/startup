callouts:
  - calloutType: strength
    title: Integration-led wedge
    body: The strongest product thesis is migration into installed server and infrastructure environments rather than requiring an entirely new quantum-computing stack.
    claimRefs: [CE007, CE008, CE009]
  - calloutType: risk
    title: Maturity is not yet independently demonstrated
    body: Public materials describe capabilities, partners, and intended pathways, but do not establish production scale, measurable performance, certification, or repeatable deployment economics.
    claimRefs: [CE003, CE010, CE015, CE016]
  - calloutType: recommendation
    title: Underwrite through technical proof
    body: Request product specifications, test evidence, certification records, deployment references, and support obligations before treating the platform narrative as verified technical maturity.
    claimRefs: [CE012, CE014, CE015, CE016]

