      - [Identity, Establish and prove trusted device identity, Identity platform and key lifecycle controls, "Request attestation, provisioning, revocation, and recovery design"]
      - [Execution, Run critical workloads in trusted environments, Hardware-rooted trust and compatible compute platforms, "Request isolation model, threat model, and performance impact"]
      - [Integration, Connect trust controls to existing systems, "OEM, channel, server, and customer environments", "Request APIs, supported versions, and repeatable deployment playbooks"]
    notes: "Architecture layers are company-described; dependencies and diligence questions are explicit because public sources do not independently validate the implementation."
    claimRefs: [CE005, CE006, CE011, CE014]

