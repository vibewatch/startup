company:
  name: EigenQ
chapter:
  number: 5
  title: Product & Technology
  summary: EigenQ presents a layered quantum-ready security platform that combines post-quantum cryptographic software, cryptographic-agility tooling, quantum entropy hardware, and hardware-anchored trust. Public evidence supports a credible integration and channel thesis, but does not yet verify product-level performance, certifications, production deployments, or a complete technical architecture.
sections:
  - id: product-scope
    title: Product scope and maturity
    body: EigenQ describes itself as an applied quantum technology company building trusted infrastructure for the Quantum Era. Its current commercial emphasis is quantum-ready security and trusted infrastructure, while the stated future roadmap extends toward quantum communications, networking, and broader computing capabilities. The public product surface is therefore a portfolio and platform narrative rather than a catalog with independently verified SKUs, pricing, throughput, or deployment counts. The strongest current evidence is that EigenQ combines post-quantum cryptographic software, cryptographic-agility tooling, quantum entropy hardware, and integration capabilities for high-assurance environments. That combination is coherent for buyers modernizing existing infrastructure, but the evidence does not establish which components are generally available, production-hardened, or delivered as software, hardware, services, or a bundled appliance.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001]
  - id: architecture-workflow
    title: Architecture and operating workflow
    body: >-
      The disclosed architecture starts with entropy, establishes device identity, runs critical workloads in trusted execution environments, and integrates those controls into existing systems. EigenQ also describes a deployment model that moves from deep technology development through ecosystem validation and integration into servers, systems, and infrastructure used by government, defense, and enterprise organizations. A June 2026 collaboration announcement adds practical workflow detail: customers can assess post-quantum readiness, identify deployment models, and add quantum-safe capabilities to new or already-deployed AMD EPYC infrastructure where technically appropriate. This is an integration-led migration proposition, not proof that every stated use case is operational. The key diligence question is whether the platform interoperates through documented interfaces and repeatable implementation playbooks or depends on bespoke engineering for each environment.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE002]
    figureRefs: [FE001]
  - id: commercialization-and-ecosystem
    title: Commercialization, integrations, and roadmap
    body: >-
      EigenQ's commercialization model is ecosystem-driven. Its own description places technology providers between EigenQ science and real-world deployment, while the TD SYNNEX collaboration identifies AMD EPYC server environments and public-sector, defense, critical-infrastructure, and enterprise buyers as target contexts. The announcement says TD SYNNEX is expected to support partner enablement, distribution readiness, and public-sector channel pathways, subject to approvals and customer requirements. That is evidence of a route to market and integration thesis, not evidence of customer conversion, recurring revenue, service-level performance, or channel economics. The roadmap is explicitly staged: protect now with quantum-ready security, accelerate next with quantum-enabled acceleration, and pursue communications/networking and broader capabilities later. Such breadth can expand the opportunity, but it also creates execution and product-focus risk.
    claimRefs: [CE009, CE010, CE011, CE012]
    tableRefs: [TE003]
  - id: trust-controls-and-gaps
    title: Trust, standards, and technical diligence gaps
    body: NIST's IR 8547 describes a transition from quantum-vulnerable cryptographic algorithms to post-quantum digital-signature and key-establishment schemes, giving EigenQ's migration focus a relevant standards context. NSA's CSfC materials show that high-assurance deployments require configured architectures, approved component choices, capability packages, and trusted integrators; the page does not certify EigenQ. EigenQ's own collaboration release expressly says that references to post-quantum, quantum-safe, CNSA 2.0 readiness, or standards alignment do not imply certification, accreditation, government approval, customer approval, or suitability for a regulated environment unless separately documented. Public developer-signal evidence shows a large and active post-quantum ecosystem, but no EigenQ repository or product telemetry. Before underwriting maturity, request test results, interoperability matrices, secure-development evidence, certification status, incident history, support commitments, manufacturing controls, and named production references.
    claimRefs: [CE013, CE014, CE015, CE016]

