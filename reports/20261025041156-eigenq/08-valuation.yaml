      - [Risk rating, High, "Closing, redemption, dilution, commercialization, and sector-multiple risks remain", "Require downside protection and term clarity"]
      - [Valuation stance, Stretched, "Approximately $3B pro forma EV versus no disclosed audited EigenQ revenue base", "Demand a material evidence or price reset"]
      - [Price discipline, Conditional, "Final sources-and-uses and fully diluted ownership are unavailable", "Reassess after effective filing and audited disclosure"]
    notes: "Judgments are analytical conclusions from the retained public evidence; no target price or return range is estimated because audited operating and fully diluted capitalization inputs are missing."
    claimRefs: [CV001, CV002, CV003, CV013, CV014, CV015]
  - id: TV002
    title: Thesis and anti-thesis tests
    columns: [Side, Argument, Current evidence, What would change the view]
    rows:
      - [Thesis, "Post-quantum security can monetize before fault-tolerant quantum computing", "Independent sector sources identify immediate cybersecurity demand", "Audited recurring revenue and renewals from deployable security products"]
      - [Thesis, "Channel and OEM relationships may reduce commercialization friction", "Transaction materials identify HPE, AMD, WNC, and TD SYNNEX relationships", "Contract economics, qualified pipeline conversion, and partner-attributed revenue"]
      - [Anti-thesis, "Capital-markets momentum may outrun operating proof", "The proposed value and financing are visible while audited EigenQ economics are not", "Audited margins, cash conversion, concentration, and backlog quality support the price"]
      - [Anti-thesis, "Redemptions and security terms may erode cash and ownership", "Trust is stated before redemptions and expenses; warrant listing is not assured", "Final sources-and-uses, conversion terms, warrant count, and pro forma ownership"]
    notes: "Company-issued partnership and transaction statements are treated as claims, not independent validation; requested diligence evidence is not assumed to exist."
    claimRefs: [CV002, CV005, CV006, CV009, CV010, CV013, CV016]
  - id: TV003
    title: Bull, base, and bear decision scenarios
    columns: [Scenario, Assumptions, Valuation and return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Transaction closes with limited redemptions; audited recurring security revenue and margins validate commercialization", "No public range is supportable; upside requires evidence that can justify the announced EV against relevant revenue and cash-flow benchmarks", "Execution across a broad portfolio and sector multiple compression", "Low until audited evidence is available"]
      - [Base, "Transaction progresses but disclosures remain incomplete and commercialization evidence is mixed", "Keep valuation stance stretched and recommendation at research-more; do not assign a target return", "Dilution, conditional financing, customer concentration, and delayed self-funding", "Most consistent with current evidence"]
      - [Bear, "Closing is delayed or net proceeds fall materially after redemptions and expenses; customer conversion disappoints", "No defensible valuation floor can be derived from the retained evidence", "Liquidity pressure, down-round financing, adverse security terms, and failed commercialization", "Material downside path that requires explicit protection"]
    notes: "Scenarios are qualitative decision states, not forecasts; probability percentages, valuation ranges, and returns are intentionally omitted because the required audited inputs are unavailable."
    claimRefs: [CV008, CV011, CV012, CV013, CV015, CV016]
