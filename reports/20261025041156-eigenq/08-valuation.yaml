callouts:
  - calloutType: recommendation
    title: Decision rule
    body: >-
      Re-rate only after final transaction terms and audited operating evidence
      permit a fully diluted entry valuation and downside case; until then, the
      public evidence supports research-more rather than a price target.
    claimRefs: [CV013, CV014, CV015, CV016]
