company:
  name: EigenQ
chapter:
  number: 8
  title: Valuation
  summary: >-
    EigenQ's proposed combination is anchored to an approximately $3 billion pro
    forma enterprise value, but the retained public evidence does not disclose
    audited revenue, margins, cash burn, or a fully diluted capitalization table.
    The appropriate stance is therefore research-more with medium confidence,
    high risk, and a stretched valuation assessment.
sections:
  - id: investment-decision
    title: Investment decision and price discipline
    body: >-
      The public evidence supports a research-more recommendation rather than an
      investable entry point. The approximately $3 billion pro forma enterprise
      value is a transaction headline, not a demonstrated operating valuation:
      the retained materials do not provide audited EigenQ revenue, bookings,
      gross margin, cash burn, or customer concentration against which to test
      that price. The financing package improves near-term transaction momentum,
      but committed financing is not the same as cash available at closing, and
      SVAQ's trust balance is explicitly stated before redemptions and expenses.
      With target-return, hold-period, and exit-value math unsupported by the
      available inputs, price discipline should be expressed as conditions rather
      than a fabricated range. A positive call requires audited economics, a
      closing sources-and-uses schedule, and a fully diluted ownership bridge.
    claimRefs: [CV001, CV002, CV003, CV013, CV014, CV015]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-overhang
    title: Financing context, dilution, and closing risk
    body: >-
      The transaction combines three different numbers that should not be
      conflated. The announced enterprise value is approximately $3 billion;
      SVAQ reported approximately $215 million in its trust before shareholder
      redemptions and transaction expenses; and a separate $45 million
      convertible financing was described as half funded up front and half
      contingent on closing. Existing EigenQ holders are expected to roll
      substantially all equity, which aligns them with the post-close outcome but
      does not quantify public-holder dilution. The preliminary registration
      process, shareholder approvals, listing requirements, warrant treatment,
      conversion price, seniority, and redemption sensitivity remain material.
      Until those terms are reconciled in a final capitalization table, the
      headline valuation cannot be converted into a reliable per-share entry
      value or expected ownership percentage.
    claimRefs: [CV002, CV003, CV004, CV005, CV006, CV008, CV010, CV013]
  - id: comparable-context
    title: Comparable context and scenario framing
    body: >-
      Public quantum comparables establish investor appetite but not a clean
      pricing multiple for EigenQ. Independent market sources describe public
      quantum companies with valuations in the billions despite modest revenue
      and continuing losses; The Quantum Insider cited Quantum Computing Inc. at
      above $4 billion with roughly $0.26 million of trailing revenue, while S&P
      reported materially different revenue scales across IonQ, D-Wave, and
      Rigetti. EigenQ also spans post-quantum security, sensing, communications,
      and computing, so a single hardware or software peer multiple would create
      false comparability. The scenarios below are therefore decision states,
      not valuation forecasts. No probability percentage or dollar range is
      supportable until audited financials and final de-SPAC capitalization are
      public.
    claimRefs: [CV007, CV009, CV011, CV012, CV013, CV015]
    tableRefs: [TV003]
  - id: thesis-and-diligence
    title: Thesis, anti-thesis, and thesis-break tests
    body: >-
      The thesis is that regulatory urgency around post-quantum migration,
      channel relationships, and additional financing could accelerate a
      commercially relevant security platform. The anti-thesis is that the
      breadth of the portfolio and a capital-markets-led narrative may precede
      auditable product-market fit, leaving investors exposed to redemptions,
      conversion terms, dilution, and a sector-wide valuation reset. The view
      improves only when audited revenue quality, gross margin, renewals,
      concentration, and cash conversion support the announced price and when
      closing proceeds are sufficient after redemptions and expenses. Thesis
      breaks include a failed or materially delayed closing, sharply reduced net
      proceeds, unfavorable convertible or warrant terms, weak customer
      conversion, or audited economics that cannot support a credible path to
      self-funding operations.
    claimRefs: [CV003, CV004, CV006, CV008, CV009, CV010, CV013, CV016]
    tableRefs: [TV002]
