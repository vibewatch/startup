chapter:
  number: 6
  title: Customers
  summary: EigenQ's public customer evidence is strongest around a government, defense, and critical-infrastructure go-to-market thesis, channel/OEM pathways, and an announced BlackVe use case. The pool does not establish active-customer counts, production deployment breadth, contract values, retention, or expansion, so adoption remains promising but unquantified.
sections:
  - id: buyer-segments
    title: Buyer, user, and payer segments
    body: >-
      EigenQ positions its initial commercial motion around government, defense, and
      critical-infrastructure buyers, where security mandates and legacy infrastructure
      create a reason to retrofit rather than replace installed systems. Company materials
      also name enterprise infrastructure, AI platforms, financial services,
      telecommunications, healthcare, industrial systems, and international markets as
      later expansion areas. The likely economic buyer is a security, infrastructure, or
      mission-owner organization; the user is a security or IT operator; and the payer
      may be a program, procurement, or channel partner. These roles are an analytical
      segmentation of the stated target markets, not disclosed customer counts or
      contract data. The company reports pathways through HPE, AMD, WNC, and TD SYNNEX,
      which could reduce procurement friction but also leaves channel economics,
      qualification costs, and end-customer ownership unreported.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption evidence and trajectory
    body: >-
      Public evidence shows a commercialization pathway rather than a measured adoption
      curve. EigenQ describes market-ready products, technology-integration and
      deployment pathways, and strategic relationships with major technology vendors.
      Independent coverage describes the Intel-compatible platform as a way to add
      post-quantum protections to deployed Xeon systems, while the named BlackVe
      announcement says BlackVe committed to use those layers for encrypted
      videoconferencing. Those are meaningful deployment signals, but they do not state
      active accounts, paid production sites, utilization, annual contract value,
      renewal, or the denominator of the addressable installed base. The September
      financing coverage also frames capital as supporting commercial deployment and
      delivery capacity, which is evidence of planned scaling rather than proof of
      realized revenue or retention.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: proof-retention-concentration
    title: Named proof, durability, and concentration
    body: >-
      The named proof set is narrow. BlackVe is described as committed to using
      Intel-compatible post-quantum technology in a secure video platform, while Intel
      is presented as an integration ecosystem and HPE, AMD, WNC, and TD SYNNEX as
      strategic technology or channel relationships. The available texts do not
      establish whether these relationships are paid production contracts, pilots,
      evaluations, or non-exclusive collaborations, and no customer has a disclosed
      share of revenue. EigenQ and transaction materials explicitly identify customer
      adoption, maintaining customer relationships, strategic-partner execution, and
      pricing pressure as risks. Accordingly, retention, churn, contract length,
      expansion, concentration, and customer-level economics remain diligence items
      rather than supported KPIs.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
  - id: customer-diligence-implications
    title: Customer-quality judgment
    body: >-
      The customer thesis is strategically coherent but evidentially early. Retrofitting
      deployed infrastructure can make the product relevant to buyers that cannot
      tolerate a hardware replacement cycle, and channel relationships may create
      distribution leverage. Conversely, the independent comparison notes that
      Broadcom already reports more than 120,000 shipped SecureHBA units and places
      EigenQ earlier than shipped hardware or IBM's standardized algorithms and
      consulting scale. That comparison is not a customer benchmark for EigenQ, but it
      is a warning that announced partnerships should not be treated as durable adoption.
      The next decision gate is a customer schedule showing paid status, production
      locations, deployment dates, contract value, renewal terms, implementation
      burden, and the portion attributable to direct versus channel sales.
    claimRefs: [CU013, CU014, CU015]
    tableRefs: []
