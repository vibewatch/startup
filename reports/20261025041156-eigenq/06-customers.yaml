      - ["HPE, AMD, WNC, and TD SYNNEX", "OEM and channel ecosystem", "Platform integration, manufacturing scale, distribution, and deployment enablement", "Strategic collaborations stated; commercial terms and production status not disclosed", "Could broaden reach and reduce implementation friction", "Relationship scope, exclusivity, take rate, and end-customer attribution are unknown"]
