figures:
  - id: FU001
    title: Customer journey from mandate to expansion
    type: journey-map
    summary: The public evidence supports a staged retrofit journey, with the largest uncertainty between announced ecosystem access and durable paid adoption.
    data:
      items:
        - stage: "1"
          label: "Mandate and exposure"
          title: "Mandate and exposure"
          description: "Government requirements and the harvest-now-decrypt-later problem create urgency for quantum-safe migration."
          touchpoints: ["CNSA 2.0 and NIST-aligned requirements", "Legacy encrypted workloads"]
          claimRefs: [CU001, CU002]
        - stage: "2"
          label: "Infrastructure assessment"
          title: "Infrastructure assessment"
          description: "Security and infrastructure owners evaluate whether deployed systems can be upgraded without hardware replacement."
          touchpoints: ["Installed Intel Xeon environments", "Cryptographic agility and workload protection"]
          claimRefs: [CU005, CU013]
        - stage: "3"
          label: "Partner-enabled integration"
          title: "Partner-enabled integration"
          description: "OEM and channel relationships are presented as routes to integration, manufacturing, distribution, and deployment."
          touchpoints: ["HPE, AMD, WNC, TD SYNNEX", "Intel ecosystem"]
          claimRefs: [CU003, CU010]
        - stage: "4"
          label: "Named deployment"
          title: "Named deployment"
          description: "BlackVe is described as committed to using Intel-compatible PQC technologies in secure video teleconferencing."
          touchpoints: ["National-security and space use case", "Mission-oriented encrypted communications"]
          claimRefs: [CU006, CU009]
        - stage: "5"
          label: "Production validation"
          title: "Production validation"
          description: "The public pool does not establish production dates, paid status, utilization, outcome metrics, or site counts."
          touchpoints: ["Unresolved production evidence", "Unresolved customer economics"]
          claimRefs: [CU007, CU012]
        - stage: "6"
          label: "Renewal and expansion"
          title: "Renewal and expansion"
          description: "Retention, expansion, concentration, and channel economics remain unreported and are required to test durability."
          touchpoints: ["Renewal and churn", "Contract value and revenue concentration"]
          claimRefs: [CU011, CU015]
    claimRefs: [CU005, CU006, CU013, CU015]
callouts:
  - calloutType: strength
    title: "Clear retrofit-oriented customer problem"
    body: "EigenQ's stated target markets share a practical migration problem: adding quantum-safe protections to existing infrastructure without a full hardware replacement. The Intel-compatible use case and named BlackVe commitment make that proposition more concrete than a purely conceptual quantum narrative."
    claimRefs: [CU002, CU005, CU006]
  - calloutType: risk
    title: "Adoption is not yet measurable"
    body: "The evidence does not disclose active customers, paid production deployments, recurring revenue, contract length, renewal, churn, utilization, or concentration. Announced partner and customer relationships should therefore be treated as pipeline and deployment signals until a customer schedule or filing provides denominators."
    claimRefs: [CU007, CU011, CU012, CU015]
