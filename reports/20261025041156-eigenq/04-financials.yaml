      - [Quantum sensing, Sensing technologies and related infrastructure, Per system or program, "Portfolio area disclosed; pricing and utilization unavailable", "Company positioning", "Obtain unit economics, utilization, warranty, and service-cost data"]
      - ["Quantum AI and computing", "AI security, optimization, and computing technologies", "Per software, hardware, or program contract", "Broader portfolio disclosed; mix unknown", "Company positioning", "Separate recurring software, hardware, and services revenue"]
    notes: Revenue mechanisms are inferred from disclosed product and channel descriptions; no row is a reported revenue amount, ARR, or realized price.
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization table
    columns: [Metric, Public value or status, Evidence basis, Interpretation, Diligence ask]
    rows:
      - [List price, null, "No public price found in assigned sources", "Unavailable", "Obtain current price books and standard discount bands"]
      - [Realized price, null, "No contract or customer invoice disclosed", "Unavailable", "Reconcile bookings, billings, and recognized revenue by SKU"]
      - [Revenue mix, null, "No audited segment or product mix disclosed", "Unavailable", "Provide product, geography, and customer concentration schedules"]
      - [ARR or recurring revenue, null, "No ARR or recurring-revenue metric disclosed", "Unavailable", "Define recurring metric and provide beginning/end-period bridge"]
    notes: Nulls mean the assigned public sources did not disclose the metric; they are not zeroes and should not be converted into estimates without source-backed assumptions.
    claimRefs: [CI002, CI003, CI014, CI015]
  - id: TI003
    title: Unit economics table
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Gross margin, null, Low, "Determines whether hardware and channel deployment can scale economically", "Provide audited gross margin by product and include manufacturing and partner costs"]
      - [CAC, null, Low, "Tests enterprise sales efficiency and channel dependence", "Provide CAC by direct and partner-sourced cohort"]
      - [Payback period, null, Low, "Tests capital efficiency against long public-sector cycles", "Provide bookings-to-cash conversion and payback calculation"]
      - [Burn and runway, null, Low, "Tests whether the financing bridge reaches positive cash flow", "Provide monthly cash flow, minimum cash, debt service, and runway scenario"]
      - [Customer concentration, null, Low, "Tests renewal and procurement dependency", "Provide top-customer revenue, backlog, renewal, and concentration schedules"]
      - [Partner economics, null, Low, "Tests margin leakage and qualification costs", "Provide OEM/channel take rates, rebates, implementation costs, and warranty burden"]
    notes: All unavailable values are intentionally null; the table distinguishes missing private evidence from measured zero or a forecast.
    claimRefs: [CI005, CI007, CI008, CI011, CI012, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: EigenQ's disclosed commercialization path runs from quantum-resilient products through OEM and channel deployment to enterprise and public-sector contracts, with gross-profit conversion still unquantified.
    data:
      nodes:
        - id: product
          label: Quantum-resilient products
          detail: "Security, communications, sensing, computing, and AI-security portfolio"
        - id: partners
          label: OEM and channel enablement
          detail: "HPE, AMD, WNC, and TD SYNNEX are named in company materials"
        - id: deployment
          label: Retrofit and deployment
          detail: "Enterprise, government, defense, and critical-infrastructure environments"
        - id: contract
          label: Customer contract
          detail: "Contract value, term, renewal, and payment terms are not disclosed"
        - id: revenue
          label: Recognized revenue
          detail: "Pricing, mix, and recognized revenue are not disclosed"
        - id: grossprofit
          label: Gross profit
          detail: "Gross margin and delivery costs are not disclosed"
      edges:
        - [product, partners]
        - [partners, deployment]
        - [deployment, contract]
        - [contract, revenue]
        - [revenue, grossprofit]
    approximationNotes: The bridge is a qualitative operating model based on disclosed commercialization descriptions; it does not calculate revenue, conversion rates, or gross profit.
    claimRefs: [CI001, CI005, CI006, CI007]
callouts:
  - calloutType: strength
    title: Capital bridge is identified
    body: Approximately $45 million of committed convertible financing is disclosed, with a stated use for commercialization and development; this gives the financing story a specific near-term instrument to diligence.
    claimRefs: [CI009, CI010]
  - calloutType: risk
    title: Revenue denominator is missing
    body: The proposed enterprise value cannot be tested against public revenue, ARR, gross margin, burn, or customer concentration because those financial inputs remain undisclosed in the assigned evidence.
    claimRefs: [CI014, CI015, CI016]
  - calloutType: recommendation
    title: Require S-4 financial schedules
    body: Underwriting should wait for audited or filing-backed revenue, sources-and-uses, liquidity, partner economics, and customer concentration evidence before treating the financing as adequate.
    claimRefs: [CI011, CI012, CI016]
