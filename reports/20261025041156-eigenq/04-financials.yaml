company:
  name: EigenQ
chapter:
  number: 4
  title: Financials
  summary: EigenQ has disclosed a $45 million committed convertible financing and a proposed $3 billion enterprise value, but public materials do not disclose audited revenue, margins, burn, or customer-level economics. The financing provides a near-term commercialization bridge, while the S-4 process and dependence on transaction proceeds leave capital adequacy and revenue quality unresolved.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      The public evidence describes a multi-product quantum technology platform rather than a
      disclosed revenue schedule. EigenQ's initial commercial emphasis is quantum-resilient
      security and trusted infrastructure, with adjacent offerings in communications, sensing,
      computing, and AI security. The company says its products are intended to retrofit existing
      enterprise infrastructure and to reach customers through OEM and channel relationships.
      That supports a plausible mix of hardware, software, integration, and partner-enabled
      deployment revenue, but the sources do not provide list prices, contract values, bookings,
      recognized revenue, ARR, renewal rates, or revenue mix. Accordingly, the monetization
      assessment remains a mechanism hypothesis rather than an underwriting forecast.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: sales-efficiency
    title: GTM motion and sales efficiency proxies
    body: >-
      The disclosed go-to-market motion is enterprise and public-sector oriented, with initial
      demand framed around government requirements and critical-infrastructure modernization.
      Named relationships with HPE, AMD, WNC, and TD SYNNEX are described as supporting
      integration, manufacturing scale, and channel enablement, but the public record does not
      quantify partner take rates, qualification costs, sales-cycle duration, pipeline conversion,
      CAC, payback, or customer concentration. A channel-assisted model could lower direct
      acquisition cost while adding margin-sharing and implementation dependencies; that is an
      analytical implication, not a reported company metric. The absence of commercial KPIs is
      material because the proposed valuation depends on scaling from technology positioning to
      repeatable enterprise revenue.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: cost-and-capital
    title: Cost structure and capital adequacy
    body: >-
      EigenQ announced approximately $45 million of committed convertible note financing, with
      $22.5 million described as upfront and the remaining $22.5 million tied to closing. A
      separate transaction announcement describes approximately $215 million in SVAQ's trust
      account before redemptions and transaction expenses; that is not cash available to EigenQ
      and is conditional on the SPAC transaction. Management says the committed financing fully
      funds the company to positive cash flow, but the public evidence does not disclose cash
      burn, runway months, debt service, gross margin, working capital, capex, or service-delivery
      costs. Manufacturing scale-up, hardware-rooted products, channel enablement, and ongoing
      R&D imply execution and working-capital needs, but their magnitude is unknown.
    claimRefs: [CI009, CI010, CI011, CI012]
  - id: underwriting-verdict
    title: Financial underwriting verdict and blockers
    body: >-
      The financial case is better characterized as a financing-dependent commercialization
      story than as a demonstrated earnings compounder. NIST confirms that organizations should
      begin migrating to post-quantum cryptography and that vulnerable algorithms are expected to
      be deprecated by 2035, supporting a durable demand backdrop; it does not validate EigenQ's
      adoption, pricing, margins, or market share. Forge reports that EigenQ's price, total
      funding, last round, and valuation details are not available on its platform. The proposed
      $3 billion enterprise value therefore cannot be tested against public revenue or margin
      denominators. Underwriting should remain research-more until the S-4 or audited materials
      disclose revenue quality, gross-margin path, sources and uses, redemption sensitivity,
      partner economics, and liquidity through the next financing trigger.
    claimRefs: [CI013, CI014, CI015, CI016]
