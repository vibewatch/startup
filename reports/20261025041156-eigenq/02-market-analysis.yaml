    notes: "Values use the publisher's units and periods. Global vendor revenue, federal transition cost and company opportunity framing are separate lenses and must not be summed."
    claimRefs: [CM003, CM004, CM007, CM009, CM010, CM016]
  - id: TM003
    title: Segment and buyer map
    columns: [Segment, Buyer, User, Payer, Workflow, Budget owner, Adoption trigger]
    rows:
      - [Federal agencies, CIO or PQC migration lead, Security and infrastructure teams, Agency program and procurement office, Inventory HVAs and high-impact systems then sequence migration, CIO/OMB-aligned program owner, Executive Order deadlines and NIST/FIPS requirements]
      - [Defense and intelligence, Mission or security program office, Operators and platform engineers, Department or prime-contractor budget, "Retrofit compute, edge and communications infrastructure", Mission-system and acquisition leadership, National-security exposure and contract requirements]
      - [Critical infrastructure, CISO and OT/IT modernization lead, Infrastructure and security operations, Operator capital and risk budget, Map cryptographic assets and upgrade high-value systems, Enterprise risk and infrastructure leadership, "Sector guidance, customer risk and long-lived data"]
      - [Financial services and healthcare, CISO/CIO and compliance, "Application, network and identity teams", Enterprise security and compliance budget, Assess and migrate regulated data and services, "Risk, compliance and technology leadership", Duty of care and insurance/regulatory exposure]
      - [OEM and channel partners, Product and platform executives, "Hardware, firmware and distribution teams", Partner product-development budget, "Embed, manufacture and distribute quantum-resilient modules", OEM/channel product owner, Need to offer compliant products without redesigning platforms]
    notes: "This is a buyer/workflow hypothesis grounded in stated government deadlines, public procurement signals and EigenQ's described channel model; public sources do not disclose segment-level budgets or conversion rates."
    claimRefs: [CM002, CM005, CM006, CM008, CM011, CM012, CM013]
