callouts:
  - calloutType: insight
    title: Mandate creates urgency, not guaranteed revenue
    body: "Federal deadlines and procurement activity make PQC migration a credible demand catalyst, but public evidence does not yet establish EigenQ's share, contracted revenue, or delivery economics."
    claimRefs: [CM002, CM009, CM014]
  - calloutType: risk
    title: Retrofit wedge is partner- and execution-dependent
    body: "Embedding into existing infrastructure can reduce customer switching friction, while simultaneously making OEM qualification, channel access, manufacturing scale and customer adoption central constraints."
    claimRefs: [CM011, CM012, CM015]
