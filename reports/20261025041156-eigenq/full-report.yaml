      - number: '1.2'
        title: Leadership, governance, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Public materials name Dr. José R. Rosas-Bustos as CEO and Dr. Jesse Van Griensven Thé as chairman. The
              proposed combination was reported as unanimously approved by both boards, but the assigned evidence does
              not enumerate the full EigenQ board, executive bench, committee structure, or post-closing governance
              rights. That limits any conclusion about key-person dependence beyond the visible concentration of public
              messaging around the CEO and chairman. The stakeholder picture is more developed: SVAQ is the SPAC
              counterparty; HPE, AMD, WNC, TD SYNNEX, Intel, and BlackVe are described as technology, manufacturing,
              channel, or mission ecosystem relationships. These are strategic pathways, not proof of customer revenue
              or binding commercial volume. Existing EigenQ shareholders are expected to roll substantially all of their
              equity, while the definitive release says no material holders are expected to sell or receive cash
              consideration, creating an alignment signal but not a substitute for capitalization-table and lock-up
