      - number: '3.2'
        title: Profiles, scale signals, and strategic direction
        blocks:
          - type: paragraph
            body: >-
              Public competitor profiles show materially different maturity and scope. The market report names IBM,
              Thales, AWS, Palo Alto Networks, Entrust, DigiCert, PQShield, Qrypt, and other vendors across solutions
              and services, while the independent ecosystem mapping places IBM, Palo Alto Networks, PQShield, QuSecure,
              SandboxAQ, cloud platforms, HSM vendors, and QKD providers in distinct categories. Those incumbents bring
              installed distribution, certification, or enterprise relationships that a new platform must convert into
              channel access. EigenQ's own announcements identify OEM and channel expansion, but they do not disclose
              customer counts, recurring revenue, win rates, or realized pricing. The proposed SPAC and convertible
              financing establish capital-market intent, not evidence of competitive scale.
            claimRefs:
