      - number: '1.3'
        title: Financing, transaction mechanics, and milestone record
        blocks:
          - type: paragraph
            body: >-
              EigenQ's proposed public-market path is the central current milestone. The June announcement described an
              approximately $3 billion pro forma enterprise value and approximately $215 million in SVAQ trust before
              redemptions and expenses, while September materials described approximately $45 million of committed
              convertible financing with about half funded. Those figures are transaction or financing disclosures, not
              revenue, ARR, cash available after expenses, or evidence of positive cash flow. The September 28
              registration-statement release explicitly says the S-4 was not yet effective and that closing remained
              subject to SEC effectiveness, shareholder approvals, listing requirements, and customary conditions. The
              resulting diligence priority is to obtain the final S-4, audited financial statements, sources and uses,
              dilution and warrant terms, and evidence that partner pathways convert into paid deployments. No retained
              source supplies audited revenue, bookings, gross margin, customer count, headcount, or valuation
              sensitivity.
