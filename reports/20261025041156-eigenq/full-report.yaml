      - number: '3.3'
        title: Capability, packaging, and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              EigenQ's stated product architecture combines hardware-generated entropy, trusted identity, trusted
              execution, and post-quantum cryptography, with integration into existing infrastructure rather than
              wholesale replacement. That is a potentially useful packaging proposition for buyers that want one
              migration partner, but the public record does not establish comparative performance, certification
              breadth, implementation cost, or contract pricing. Competitors specialize differently: PQShield supplies
              embedded PQC IP, QuSecure supplies orchestration, cloud and certificate vendors embed controls in existing
              platforms, and QKD suppliers target high-security point-to-point links. The matrix below marks unverified
              cells as unknown rather than treating a vendor's marketing comparison as independent proof.
            claimRefs:
