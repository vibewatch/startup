  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and maturity
        blocks:
          - type: paragraph
            body: >-
              EigenQ describes itself as an applied quantum technology company building trusted infrastructure for the
              Quantum Era. Its current commercial emphasis is quantum-ready security and trusted infrastructure, while
              the stated future roadmap extends toward quantum communications, networking, and broader computing
              capabilities. The public product surface is therefore a portfolio and platform narrative rather than a
              catalog with independently verified SKUs, pricing, throughput, or deployment counts. The strongest current
              evidence is that EigenQ combines post-quantum cryptographic software, cryptographic-agility tooling,
              quantum entropy hardware, and integration capabilities for high-assurance environments. That combination
              is coherent for buyers modernizing existing infrastructure, but the evidence does not establish which
              components are generally available, production-hardened, or delivered as software, hardware, services, or
              a bundled appliance.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
      - number: '5.2'
        title: Architecture and operating workflow
        blocks:
          - type: paragraph
            body: >-
              The disclosed architecture starts with entropy, establishes device identity, runs critical workloads in
              trusted execution environments, and integrates those controls into existing systems. EigenQ also describes
              a deployment model that moves from deep technology development through ecosystem validation and
              integration into servers, systems, and infrastructure used by government, defense, and enterprise
              organizations. A June 2026 collaboration announcement adds practical workflow detail: customers can assess
              post-quantum readiness, identify deployment models, and add quantum-safe capabilities to new or
              already-deployed AMD EPYC infrastructure where technically appropriate. This is an integration-led
              migration proposition, not proof that every stated use case is operational. The key diligence question is
              whether the platform interoperates through documented interfaces and repeatable implementation playbooks
              or depends on bespoke engineering for each environment.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
              - CE007
      - number: '5.3'
        title: Commercialization, integrations, and roadmap
        blocks:
          - type: paragraph
            body: >-
              EigenQ's commercialization model is ecosystem-driven. Its own description places technology providers
              between EigenQ science and real-world deployment, while the TD SYNNEX collaboration identifies AMD EPYC
              server environments and public-sector, defense, critical-infrastructure, and enterprise buyers as target
              contexts. The announcement says TD SYNNEX is expected to support partner enablement, distribution
              readiness, and public-sector channel pathways, subject to approvals and customer requirements. That is
              evidence of a route to market and integration thesis, not evidence of customer conversion, recurring
              revenue, service-level performance, or channel economics. The roadmap is explicitly staged: protect now
              with quantum-ready security, accelerate next with quantum-enabled acceleration, and pursue
              communications/networking and broader capabilities later. Such breadth can expand the opportunity, but it
              also creates execution and product-focus risk.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE011
              - CE014
      - number: '5.4'
        title: Trust, standards, and technical diligence gaps
        blocks:
          - type: paragraph
            body: >-
              NIST's IR 8547 describes a transition from quantum-vulnerable cryptographic algorithms to post-quantum
              digital-signature and key-establishment schemes, giving EigenQ's migration focus a relevant standards
              context. NSA's CSfC materials show that high-assurance deployments require configured architectures,
              approved component choices, capability packages, and trusted integrators; the page does not certify
              EigenQ. EigenQ's own collaboration release expressly says that references to post-quantum, quantum-safe,
              CNSA 2.0 readiness, or standards alignment do not imply certification, accreditation, government approval,
              customer approval, or suitability for a regulated environment unless separately documented. Public
              developer-signal evidence shows a large and active post-quantum ecosystem, but no EigenQ repository or
              product telemetry. Before underwriting maturity, request test results, interoperability matrices,
              secure-development evidence, certification status, incident history, support commitments, manufacturing
              controls, and named production references.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integration-led wedge
            body: >-
              The strongest product thesis is migration into installed server and infrastructure environments rather
              than requiring an entirely new quantum-computing stack.
            calloutType: strength
            claimRefs:
              - CE007
              - CE008
              - CE009
          - type: callout
            title: Maturity is not yet independently demonstrated
            body: >-
              Public materials describe capabilities, partners, and intended pathways, but do not establish production
              scale, measurable performance, certification, or repeatable deployment economics.
            calloutType: risk
            claimRefs:
              - CE003
              - CE010
              - CE015
              - CE016
          - type: callout
            title: Underwrite through technical proof
            body: >-
              Request product specifications, test evidence, certification records, deployment references, and support
              obligations before treating the platform narrative as verified technical maturity.
            calloutType: recommendation
            claimRefs:
              - CE012
              - CE014
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and payer segments
        blocks:
          - type: paragraph
            body: >-
              EigenQ positions its initial commercial motion around government, defense, and critical-infrastructure
              buyers, where security mandates and legacy infrastructure create a reason to retrofit rather than replace
              installed systems. Company materials also name enterprise infrastructure, AI platforms, financial
              services, telecommunications, healthcare, industrial systems, and international markets as later expansion
              areas. The likely economic buyer is a security, infrastructure, or mission-owner organization; the user is
              a security or IT operator; and the payer may be a program, procurement, or channel partner. These roles
              are an analytical segmentation of the stated target markets, not disclosed customer counts or contract
              data. The company reports pathways through HPE, AMD, WNC, and TD SYNNEX, which could reduce procurement
              friction but also leaves channel economics, qualification costs, and end-customer ownership unreported.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption evidence and trajectory
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows a commercialization pathway rather than a measured adoption curve. EigenQ describes
              market-ready products, technology-integration and deployment pathways, and strategic relationships with
              major technology vendors. Independent coverage describes the Intel-compatible platform as a way to add
              post-quantum protections to deployed Xeon systems, while the named BlackVe announcement says BlackVe
              committed to use those layers for encrypted videoconferencing. Those are meaningful deployment signals,
              but they do not state active accounts, paid production sites, utilization, annual contract value, renewal,
              or the denominator of the addressable installed base. The September financing coverage also frames capital
              as supporting commercial deployment and delivery capacity, which is evidence of planned scaling rather
              than proof of realized revenue or retention.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU006
              - CU013
              - CU015
      - number: '6.3'
        title: Named proof, durability, and concentration
        blocks:
          - type: paragraph
            body: >-
              The named proof set is narrow. BlackVe is described as committed to using Intel-compatible post-quantum
              technology in a secure video platform, while Intel is presented as an integration ecosystem and HPE, AMD,
              WNC, and TD SYNNEX as strategic technology or channel relationships. The available texts do not establish
              whether these relationships are paid production contracts, pilots, evaluations, or non-exclusive
              collaborations, and no customer has a disclosed share of revenue. EigenQ and transaction materials
              explicitly identify customer adoption, maintaining customer relationships, strategic-partner execution,
              and pricing pressure as risks. Accordingly, retention, churn, contract length, expansion, concentration,
              and customer-level economics remain diligence items rather than supported KPIs.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Customer-quality judgment
        blocks:
          - type: paragraph
            body: >-
              The customer thesis is strategically coherent but evidentially early. Retrofitting deployed infrastructure
              can make the product relevant to buyers that cannot tolerate a hardware replacement cycle, and channel
              relationships may create distribution leverage. Conversely, the independent comparison notes that Broadcom
              already reports more than 120,000 shipped SecureHBA units and places EigenQ earlier than shipped hardware
              or IBM's standardized algorithms and consulting scale. That comparison is not a customer benchmark for
              EigenQ, but it is a warning that announced partnerships should not be treated as durable adoption. The
              next decision gate is a customer schedule showing paid status, production locations, deployment dates,
              contract value, renewal terms, implementation burden, and the portion attributable to direct versus
              channel sales.
            claimRefs:
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Clear retrofit-oriented customer problem
            body: >-
              EigenQ's stated target markets share a practical migration problem: adding quantum-safe protections to
              existing infrastructure without a full hardware replacement. The Intel-compatible use case and named
              BlackVe commitment make that proposition more concrete than a purely conceptual quantum narrative.
            calloutType: strength
            claimRefs:
              - CU002
              - CU005
              - CU006
          - type: callout
            title: Adoption is not yet measurable
            body: >-
              The evidence does not disclose active customers, paid production deployments, recurring revenue, contract
              length, renewal, churn, utilization, or concentration. Announced partner and customer relationships should
              therefore be treated as pipeline and deployment signals until a customer schedule or filing provides
              denominators.
            calloutType: risk
            claimRefs:
              - CU007
              - CU011
              - CU012
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Transaction and liquidity exposure
        blocks:
          - type: paragraph
            body: >-
              The proposed SVAQ combination remains conditional rather than completed. Public sources describe SEC
              effectiveness, shareholder approvals, listing requirements, and other customary conditions, while the
              financing disclosures indicate that only about half of the committed convertible financing had been funded
              at the September filing milestone. This creates a sequencing risk: EigenQ's ability to scale
              manufacturing, integrations, and commercialization depends on a transaction and capital plan that remain
              exposed to approval, redemption, timing, and market conditions. The announced enterprise or equity value
              is a transaction reference, not proof of cash available or operating solvency. The practical kill
              criterion is a missed closing timetable, an unfunded financing tranche, or a materially reduced cash
              balance after redemptions and expenses.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Regulatory, legal, and data-security exposure
        blocks:
          - type: paragraph
            body: >-
              EigenQ markets hardware-rooted post-quantum security to government, defense, critical-infrastructure, and
              enterprise environments, so failures of compliance or assurance could block procurement even without a
              public breach. The proposed transaction itself remains subject to SEC and shareholder processes, while
              privacy obligations can attach wherever the company or its customers target or collect personal data. GDPR
              requires appropriate technical and organizational measures, accountability, and potentially severe
              penalties; Canadian PIPEDA materials emphasize accountability, safeguards, openness, and breach reporting.
              The public pool does not verify EigenQ's certifications, data-processing agreements, incident controls, or
              regulator interactions. Until those artifacts are produced, compliance maturity should be treated as
              unverified rather than assumed from product positioning.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Operational, partner, and execution dependencies
        blocks:
          - type: paragraph
            body: >-
              EigenQ's stated route to market relies on OEM, manufacturing, and channel relationships with HPE, AMD,
              WNC, and TD SYNNEX, while its public materials describe expansion across security, communications,
              networking, sensing, and computing. That breadth increases integration, qualification, supply-chain, and
              roadmap coordination requirements. The sources identify intended collaboration roles and target markets
              but do not disclose partner revenue concentration, service levels, manufacturing yields, warranty
              economics, deployment counts, or independent customer outcomes. A partner-led model can accelerate
              distribution, but it also creates counterparty and execution risk if a key integration slips, a supplier
              cannot scale, or channel economics do not convert announced relationships into repeatable deployments.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR009
              - CR010
              - CR011
              - CR014
      - number: '7.4'
        title: Residual exposure and thesis-break monitoring
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a high-risk, research-more posture rather than a conclusion that a specific failure
              has occurred. The most decision-relevant monitoring is measurable: SEC effectiveness and vote outcomes;
              the proportion and timing of committed financing actually funded; post-close cash and redemption
              sensitivity; independent evidence of production deployments and renewals; partner-specific delivery
              milestones; and security, privacy, or regulatory events. A diligence package should obtain the final S-4
              and audited financial statements, sources-and-uses and warrant terms, partner contracts, security
              architecture and test reports, privacy and breach procedures, insurance, litigation searches, and customer
              references. These requests convert public uncertainty into observable gates without treating no recorded
              incident as proof of no incident.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR007
              - CR009
              - CR012
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-conviction risk
            body: >-
              Transaction completion and liquidity are the clearest near-term risk because public sources explicitly
              condition the proposed listing on approvals and SEC effectiveness, while only part of the committed
              financing was funded at the latest filing milestone.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
          - type: callout
            title: Diligence before conviction
            body: >-
              Maintain a research-more posture until the S-4, audited financials, sources-and-uses, partner contracts,
              and independent security and customer evidence close the largest exposure gaps.
            calloutType: recommendation
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment decision and price discipline
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a research-more recommendation rather than an investable entry point. The
              approximately $3 billion pro forma enterprise value is a transaction headline, not a demonstrated
              operating valuation: the retained materials do not provide audited EigenQ revenue, bookings, gross margin,
              cash burn, or customer concentration against which to test that price. The financing package improves
              near-term transaction momentum, but committed financing is not the same as cash available at closing, and
              SVAQ's trust balance is explicitly stated before redemptions and expenses. With target-return,
              hold-period, and exit-value math unsupported by the available inputs, price discipline should be expressed
              as conditions rather than a fabricated range. A positive call requires audited economics, a closing
              sources-and-uses schedule, and a fully diluted ownership bridge.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV013
              - CV014
      - number: '8.2'
        title: Financing context, dilution, and closing risk
        blocks:
          - type: paragraph
            body: >-
              The transaction combines three different numbers that should not be conflated. The announced enterprise
              value is approximately $3 billion; SVAQ reported approximately $215 million in its trust before
              shareholder redemptions and transaction expenses; and a separate $45 million convertible financing was
              described as half funded up front and half contingent on closing. Existing EigenQ holders are expected to
              roll substantially all equity, which aligns them with the post-close outcome but does not quantify
              public-holder dilution. The preliminary registration process, shareholder approvals, listing requirements,
              warrant treatment, conversion price, seniority, and redemption sensitivity remain material. Until those
              terms are reconciled in a final capitalization table, the headline valuation cannot be converted into a
              reliable per-share entry value or expected ownership percentage.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV010
              - CV013
      - number: '8.3'
        title: Comparable context and scenario framing
        blocks:
          - type: paragraph
            body: >-
              Public quantum comparables establish investor appetite but not a clean pricing multiple for EigenQ.
              Independent market sources describe public quantum companies with valuations in the billions despite
              modest revenue and continuing losses; The Quantum Insider cited Quantum Computing Inc. at above $4 billion
              with roughly $0.26 million of trailing revenue, while S&P reported materially different revenue scales
              across IonQ, D-Wave, and Rigetti. EigenQ also spans post-quantum security, sensing, communications, and
              computing, so a single hardware or software peer multiple would create false comparability. The scenarios
              below are therefore decision states, not valuation forecasts. No probability percentage or dollar range is
              supportable until audited financials and final de-SPAC capitalization are public.
            claimRefs:
              - CV007
              - CV009
              - CV011
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: Thesis, anti-thesis, and thesis-break tests
        blocks:
          - type: paragraph
            body: >-
              The thesis is that regulatory urgency around post-quantum migration, channel relationships, and additional
              financing could accelerate a commercially relevant security platform. The anti-thesis is that the breadth
              of the portfolio and a capital-markets-led narrative may precede auditable product-market fit, leaving
              investors exposed to redemptions, conversion terms, dilution, and a sector-wide valuation reset. The view
              improves only when audited revenue quality, gross margin, renewals, concentration, and cash conversion
              support the announced price and when closing proceeds are sufficient after redemptions and expenses.
              Thesis breaks include a failed or materially delayed closing, sharply reduced net proceeds, unfavorable
              convertible or warrant terms, weak customer conversion, or audited economics that cannot support a
              credible path to self-funding operations.
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV008
              - CV009
              - CV010
              - CV013
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV009
              - CV010
              - CV013
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Decision rule
            body: >-
              Re-rate only after final transaction terms and audited operating evidence permit a fully diluted entry
              valuation and downside case; until then, the public evidence supports research-more rather than a price
              target.
            calloutType: recommendation
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
