              - CP013
      - number: '3.4'
        title: Switching costs, moat durability, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The strongest near-term moat signal is distribution and implementation access, not a demonstrated
              proprietary performance lead. EigenQ says it is using OEM and channel ecosystems and has announced work
              involving WNC, TD SYNNEX, AMD, HPE, and Intel environments; those relationships could reduce deployment
              friction but also create partner dependency and limit control of economics. CISA's procurement framing and
              the Cloudflare migration account show that standards-based PQC is becoming available through incumbent
              infrastructure, which can compress differentiation as baseline features become embedded. The proposed
              transaction remains conditional on SEC effectiveness, shareholder approval, listing requirements, and
              other closing conditions, while only half of the announced convertible financing was initially funded.
              These are execution and liquidity risks to a moat thesis, not proof of failure.
            claimRefs:
              - CP013
              - CP014
              - CP015
