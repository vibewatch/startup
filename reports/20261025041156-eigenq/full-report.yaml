      - number: '4.3'
        title: Cost structure and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              EigenQ announced approximately $45 million of committed convertible note financing, with $22.5 million
              described as upfront and the remaining $22.5 million tied to closing. A separate transaction announcement
              describes approximately $215 million in SVAQ's trust account before redemptions and transaction expenses;
              that is not cash available to EigenQ and is conditional on the SPAC transaction. Management says the
              committed financing fully funds the company to positive cash flow, but the public evidence does not
              disclose cash burn, runway months, debt service, gross margin, working capital, capex, or service-delivery
              costs. Manufacturing scale-up, hardware-rooted products, channel enablement, and ongoing R&D imply
              execution and working-capital needs, but their magnitude is unknown.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Financial underwriting verdict and blockers
        blocks:
          - type: paragraph
            body: >-
              The financial case is better characterized as a financing-dependent commercialization story than as a
              demonstrated earnings compounder. NIST confirms that organizations should begin migrating to post-quantum
              cryptography and that vulnerable algorithms are expected to be deprecated by 2035, supporting a durable
              demand backdrop; it does not validate EigenQ's adoption, pricing, margins, or market share. Forge reports
              that EigenQ's price, total funding, last round, and valuation details are not available on its platform.
              The proposed $3 billion enterprise value therefore cannot be tested against public revenue or margin
              denominators. Underwriting should remain research-more until the S-4 or audited materials disclose revenue
              quality, gross-margin path, sources and uses, redemption sensitivity, partner economics, and liquidity
              through the next financing trigger.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
