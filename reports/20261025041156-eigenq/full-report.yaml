  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform, and commercial wedge
        blocks:
          - type: paragraph
            body: >-
              The retained evidence consistently describes EigenQ as a Texas-headquartered or Austin-based quantum
              technology company whose initial commercialization focus is quantum-resilient security and trusted
              infrastructure. The product description spans post-quantum cryptography, cryptographic-agility tooling,
              quantum-derived entropy, hardware-rooted trust, secure communications, networking, sensing, and AI or
              computing adjacencies. The strongest business model signal is an infrastructure-retrofit motion: the
              company says its integrations are intended to add quantum-safe capability to deployed enterprise and
              public-sector systems rather than require wholesale replacement. That positioning is still primarily
              company- or partner-described; the pool contains no independent customer contract, deployment count, or
              product performance dataset. Government, defense, critical-infrastructure, and enterprise IT are the
              stated initial customer focus, with broader vertical expansion presented as a future opportunity rather
              than a verified revenue mix.
