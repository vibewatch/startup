  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and demand wedge
        blocks:
          - type: paragraph
            body: >-
              EigenQ's public materials span quantum security, communications, networking, sensing, AI infrastructure,
              and computing, but the evidence supports a narrower near-term market boundary for diligence - products and
              services that retrofit existing compute, server, network, device-identity, and cryptographic
              infrastructure with post-quantum or quantum-resilient capabilities. The broader quantum economy is an
              adjacency, not a single spend pool. The company describes the market as broad because valuable data across
              compute and storage will eventually require quantum resistance, while its first products address OEMs that
              need compliant offerings before they can modify platforms natively. This boundary includes hardware-rooted
              security, PQC modules, cryptographic agility, secure identity, integration, and related deployment
              services; it excludes speculative quantum-computing revenue, general AI spending, and unpriced future
              sensing or communications opportunities. The practical substitute is status-quo infrastructure with manual
              migration or delayed compliance, which can preserve incumbent budgets but leaves buyers carrying
              transition and data-protection risk.
            claimRefs:
              - CM001
              - CM005
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM011
      - number: '2.2'
        title: Sizing lenses and what they do not prove
        blocks:
          - type: paragraph
            body: >-
              The available sizing evidence is useful for directional context but does not isolate EigenQ's serviceable
              market. The Business Research Company defines a global PQC market spanning solutions and services,
              organization sizes, security applications, and end users, and reports a forecast from $0.78 billion in
              2026 to $2.23 billion in 2030 at a 30.1% CAGR. That estimate is a broad industry revenue construct with a
              stated factory-gate and consumption-value methodology, not an audited EigenQ forecast. Axis Intelligence
              separately reports a 2025 estimate range from $0.42 billion to $1.68 billion across research providers and
              attributes much of the spread to category scope. A federal transition estimate cited by Federal News
              Network is roughly $7.1 billion over ten years for the U.S. government's PQC transition; it measures
              public-sector migration cost, not PQC vendor revenue. Public company evidence does not provide a
              defensible SAM, SOM, customer count, booked revenue, or conversion rate. Accordingly, the sizing table
              keeps global vendor revenue, federal transition spend, and company-defined opportunity as separate lenses
              rather than adding them. The key valuation question is whether retrofit hardware, software licenses, and
              unit royalties can capture a measurable portion of mandated migration budgets before standards,
              procurement, and integration timelines move.
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM009
              - CM010
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM009
              - CM010
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM016
      - number: '2.3'
        title: Buyers, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption starts where compliance deadlines and asset criticality make delay expensive. The White House
              order directs federal agencies to identify migration leads, move high-value and high-impact systems to PQC
              key establishment by December 31, 2030 and digital signatures by December 31, 2031, and creates
              procurement and pilot work; GSA's event description similarly emphasizes migration strategy, acquisition
              pathways, and implementation case studies. These signals support government and critical-infrastructure
              buyers as the initial wedge, with defense contractors and regulated financial, healthcare, and
              pharmaceutical organizations as adjacent buyers that may act under duty of care even without an immediate
              mandate. The user and payer are often different - security, infrastructure, or platform teams operate the
              technology, while a CIO, CISO, procurement office, agency program owner, or systems integrator controls
              budget and sequencing. EigenQ's stated OEM and channel model can reduce switching friction by embedding
              capabilities in existing platforms, but it also creates dependence on partner qualification, manufacturing
              scale, procurement cycles, and customer proof. Public materials explicitly identify product-development
              timing, OEM integration, customer adoption, pricing pressure, supply chain, and changing mandates as
              risks, so the market should be treated as urgent but execution-constrained.
            claimRefs:
              - CM002
              - CM006
              - CM008
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM008
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Mandate creates urgency, not guaranteed revenue
            body: >-
              Federal deadlines and procurement activity make PQC migration a credible demand catalyst, but public
              evidence does not yet establish EigenQ's share, contracted revenue, or delivery economics.
            calloutType: insight
            claimRefs:
              - CM002
              - CM009
              - CM014
          - type: callout
            title: Retrofit wedge is partner- and execution-dependent
            body: >-
              Embedding into existing infrastructure can reduce customer switching friction, while simultaneously making
              OEM qualification, channel access, manufacturing scale and customer adoption central constraints.
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant landscape is broader than firms that use the word quantum in their branding. CISA separates
              widely available PQC-capable cloud, collaboration, web, and endpoint categories from networking, identity,
              enterprise-security, and other categories that are still transitioning. That creates several buyer
              alternatives: software migration and crypto-agility specialists; incumbent security, certificate, HSM, and
              cloud vendors; QKD and quantum-randomness providers for specialized links; system integrators; and
              internal security engineering using standards and open-source components. The independent landscape review
              also describes PQC as deployable on classical infrastructure while QKD requires specialized optical
              hardware. EigenQ's proposed hardware-rooted trust, PQC, entropy, communications, and sensing scope
              therefore spans multiple competitive arenas rather than one clean peer set.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
