  - id: FE001
    title: EigenQ product architecture map
    type: stack
    summary: >-
      EigenQ describes a four-layer trust architecture that connects entropy and identity to trusted execution and
      integration.
    data:
      layers:
        - label: Integration
          modules:
            - label: Existing systems
              detail: Trust capabilities are intended to become part of existing infrastructure.
            - label: Platform alignment
              detail: The AMD EPYC collaboration is described as a practical integration pathway.
        - label: Execution
          modules:
            - label: Trusted environments
              detail: Critical workloads are described as running in trusted environments.
            - label: Workload protection
              detail: The partner announcement lists secure workload protection as an intended use case.
        - label: Identity
          modules:
            - label: Device identity
              detail: Devices establish and prove trusted identity.
            - label: Attestation
              detail: Attestation is listed among intended high-assurance use cases.
        - label: Entropy
          modules:
            - label: High-quality randomness
              detail: The company places entropy at the foundation of its architecture.
            - label: Quantum entropy hardware
              detail: The platform is described as combining quantum entropy hardware with cryptographic software.
        - label: Ecosystem validation
          modules:
            - label: Technology providers
              detail: EigenQ describes validation and integration with established technology providers.
            - label: Channel enablement
              detail: TD SYNNEX is described as supporting partner and distribution readiness.
        - label: Real-world deployment
          modules:
            - label: Installed infrastructure
              detail: The stated model targets government, defense, and enterprise infrastructure.
            - label: Phased migration
              detail: The collaboration is intended to support deployment pathways that preserve operational continuity.
    approximationNotes: >-
      This is a structured rendering of company-described layers and partner-stated use cases, not an independently
      verified reference architecture.
    claimRefs:
      - CE005
      - CE006
      - CE007
  - id: FU001
    title: Customer journey from mandate to expansion
    type: journey-map
    summary: >-
      The public evidence supports a staged retrofit journey, with the largest uncertainty between announced ecosystem
      access and durable paid adoption.
    data:
      items:
        - stage: '1'
          label: Mandate and exposure
          title: Mandate and exposure
          description: Government requirements and the harvest-now-decrypt-later problem create urgency for quantum-safe migration.
          touchpoints:
            - CNSA 2.0 and NIST-aligned requirements
            - Legacy encrypted workloads
          claimRefs:
            - CU001
            - CU002
        - stage: '2'
          label: Infrastructure assessment
          title: Infrastructure assessment
          description: >-
            Security and infrastructure owners evaluate whether deployed systems can be upgraded without hardware
            replacement.
          touchpoints:
            - Installed Intel Xeon environments
            - Cryptographic agility and workload protection
          claimRefs:
            - CU005
            - CU013
        - stage: '3'
          label: Partner-enabled integration
          title: Partner-enabled integration
          description: >-
            OEM and channel relationships are presented as routes to integration, manufacturing, distribution, and
            deployment.
          touchpoints:
            - HPE, AMD, WNC, TD SYNNEX
            - Intel ecosystem
          claimRefs:
            - CU003
            - CU010
        - stage: '4'
          label: Named deployment
          title: Named deployment
          description: >-
            BlackVe is described as committed to using Intel-compatible PQC technologies in secure video
            teleconferencing.
          touchpoints:
            - National-security and space use case
            - Mission-oriented encrypted communications
          claimRefs:
            - CU006
            - CU009
        - stage: '5'
          label: Production validation
          title: Production validation
          description: >-
            The public pool does not establish production dates, paid status, utilization, outcome metrics, or site
            counts.
          touchpoints:
            - Unresolved production evidence
            - Unresolved customer economics
          claimRefs:
            - CU007
            - CU012
        - stage: '6'
          label: Renewal and expansion
          title: Renewal and expansion
          description: >-
            Retention, expansion, concentration, and channel economics remain unreported and are required to test
