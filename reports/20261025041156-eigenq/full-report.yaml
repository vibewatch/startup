        title: Exhibits
        blocks:
          - type: callout
            title: Ecosystem-led wedge
            body: >-
              EigenQ's stated OEM and channel model could make infrastructure retrofit more scalable than a direct,
              stand-alone security appliance motion, if partners produce measurable deployments and economics.
            calloutType: strength
            claimRefs:
              - CP009
              - CP013
          - type: callout
            title: Incumbent feature absorption
            body: >-
              CISA identifies PQC-capable products across mainstream categories, while major cloud, security,
              certificate, and HSM vendors are already listed in the competitive ecosystem; standards adoption may make
              baseline functionality harder to defend.
            calloutType: risk
            claimRefs:
              - CP002
              - CP006
              - CP014
          - type: callout
            title: Require comparative proof
            body: >-
              Before treating EigenQ as a differentiated platform, diligence should obtain third-party performance,
              certification, customer deployment, pricing, renewal, and partner-margin evidence against named incumbent
              and specialist alternatives.
            calloutType: recommendation
            claimRefs:
