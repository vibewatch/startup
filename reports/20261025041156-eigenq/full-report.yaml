            body: >-
              The disclosed go-to-market motion is enterprise and public-sector oriented, with initial demand framed
              around government requirements and critical-infrastructure modernization. Named relationships with HPE,
              AMD, WNC, and TD SYNNEX are described as supporting integration, manufacturing scale, and channel
              enablement, but the public record does not quantify partner take rates, qualification costs, sales-cycle
