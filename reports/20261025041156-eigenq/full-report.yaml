      - CU006
      - CU013
      - CU015
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: Residual exposure is highest where transaction liquidity and security assurance depend on unverified conditions.
    data:
      columns:
        - High likelihood
        - Low likelihood
      rows:
        - label: Critical impact
          values:
            - Transaction funding and closing dependency
            - Security or privacy control failure
        - label: High impact
          values:
            - Manufacturing or integration shortfall
            - Roadmap and partner execution
        - label: Medium impact
          values:
            - PIPEDA applicability and reporting exposure
            - Channel conversion and renewal uncertainty
        - label: Low impact
          values:
            - Disclosure gap on certifications
            - Unverified complaint history
        - label: Control gap
          values:
            - Unfunded financing tranche
            - Unquantified warranty burden
        - label: Monitoring gap
          values:
            - Missing customer deployment denominator
            - No independent incident baseline
    approximationNotes: >-
      Likelihood and impact are qualitative analytical ratings grounded in disclosed conditions and evidence gaps; the
      matrix is not a probability model.
    claimRefs:
      - CR003
      - CR007
      - CR009
      - CR012
      - CR014
      - CR016
  - id: FV001
    title: Recommendation logic from transaction headline to decision
    type: flow
    summary: >-
      The announced value and financing narrow to a research-more decision after closing mechanics and
      operating-evidence gaps are applied.
    data:
      nodes:
        - id: announced-value
          label: Announced value
          detail: Approximately $3B pro forma enterprise value
        - id: trust
          label: Potential trust capital
          detail: Approximately $215M before redemptions and expenses
        - id: convertible
          label: Convertible financing
          detail: $45M committed; approximately half described as funded
        - id: closing
          label: Closing conditions
          detail: Effectiveness, approvals, listing requirements, and customary conditions
        - id: evidence-gap
          label: Operating evidence gap
          detail: No audited EigenQ revenue, margin, burn, or fully diluted ownership in the retained evidence
        - id: recommendation
          label: Decision
          detail: Research more; high risk; stretched valuation stance
      edges:
        - from: announced-value
          to: trust
        - from: trust
          to: convertible
        - from: convertible
          to: closing
        - from: closing
          to: evidence-gap
        - from: evidence-gap
          to: recommendation
    approximationNotes: >-
      Amounts reproduce disclosed transaction headlines; the diagram does not treat trust or committed financing as cash
      available to EigenQ.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV013
      - CV014
