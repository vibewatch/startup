callouts:
  - calloutType: strength
    title: Regulatory-aligned wedge
    body: "The initial product wedge is framed around quantum-safe security and infrastructure retrofit for government, defense, and critical-infrastructure buyers, where the company and partners describe explicit standards and compliance drivers."
    claimRefs: [CO002, CO003, CO005]
  - calloutType: risk
    title: Public-market execution remains conditional
    body: "The proposed transaction is not yet a completed listing: the September release says the S-4 remained subject to change and effectiveness, shareholder approvals, listing requirements, and other closing conditions."
    claimRefs: [CO013, CO016]
  - calloutType: recommendation
    title: Evidence priority
    body: "Treat the announced valuation and financing as provisional transaction context until the final S-4 supplies audited operating data, capitalization, dilution, sources and uses, and customer economics."
    claimRefs: [CO011, CO012, CO013, CO014, CO015]
