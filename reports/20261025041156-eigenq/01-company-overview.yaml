company:
  name: EigenQ
chapter:
  number: 1
  title: Company Overview
  summary: EigenQ is an Austin-based applied quantum technology company using post-quantum security and trusted-infrastructure products as its initial commercial wedge. Its proposed Q4 2026 SPAC transaction would value the business at approximately $3 billion, but the retained evidence still leaves audited operating scale, customer economics, and final transaction terms unresolved.
sections:
  - id: identity-and-platform
    title: Identity, platform, and commercial wedge
    body: >-
      The retained evidence consistently describes EigenQ as a Texas-headquartered or Austin-based
      quantum technology company whose initial commercialization focus is quantum-resilient security
      and trusted infrastructure. The product description spans post-quantum cryptography,
      cryptographic-agility tooling, quantum-derived entropy, hardware-rooted trust, secure
      communications, networking, sensing, and AI or computing adjacencies. The strongest business
      model signal is an infrastructure-retrofit motion: the company says its integrations are
      intended to add quantum-safe capability to deployed enterprise and public-sector systems
      rather than require wholesale replacement. That positioning is still primarily company- or
      partner-described; the pool contains no independent customer contract, deployment count, or
      product performance dataset. Government, defense, critical-infrastructure, and enterprise
      IT are the stated initial customer focus, with broader vertical expansion presented as a
      future opportunity rather than a verified revenue mix.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO015]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-and-stakeholders
    title: Leadership, governance, and stakeholder map
    body: >-
      Public materials name Dr. José R. Rosas-Bustos as CEO and Dr. Jesse Van Griensven Thé as
      chairman. The proposed combination was reported as unanimously approved by both boards, but
      the assigned evidence does not enumerate the full EigenQ board, executive bench, committee
      structure, or post-closing governance rights. That limits any conclusion about key-person
      dependence beyond the visible concentration of public messaging around the CEO and chairman.
      The stakeholder picture is more developed: SVAQ is the SPAC counterparty; HPE, AMD, WNC, TD
      SYNNEX, Intel, and BlackVe are described as technology, manufacturing, channel, or mission
      ecosystem relationships. These are strategic pathways, not proof of customer revenue or
      binding commercial volume. Existing EigenQ shareholders are expected to roll substantially
      all of their equity, while the definitive release says no material holders are expected to
      sell or receive cash consideration, creating an alignment signal but not a substitute for
      capitalization-table and lock-up diligence.
    claimRefs: [CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO002, TO003]
  - id: financing-and-milestones
    title: Financing, transaction mechanics, and milestone record
    body: >-
      EigenQ's proposed public-market path is the central current milestone. The June announcement
      described an approximately $3 billion pro forma enterprise value and approximately $215
      million in SVAQ trust before redemptions and expenses, while September materials described
      approximately $45 million of committed convertible financing with about half funded. Those
      figures are transaction or financing disclosures, not revenue, ARR, cash available after
      expenses, or evidence of positive cash flow. The September 28 registration-statement release
      explicitly says the S-4 was not yet effective and that closing remained subject to SEC
      effectiveness, shareholder approvals, listing requirements, and customary conditions. The
      resulting diligence priority is to obtain the final S-4, audited financial statements,
      sources and uses, dilution and warrant terms, and evidence that partner pathways convert into
      paid deployments. No retained source supplies audited revenue, bookings, gross margin,
      customer count, headcount, or valuation sensitivity.
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016]
    tableRefs: []
    figureRefs: []
