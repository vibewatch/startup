evidenceGaps:
  - type: missing-source
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Final effective S-4 with audited historical financials, revenue, bookings, gross margin, customer concentration,
      and cash-flow disclosures.
    whyItMatters: >-
      The announced valuation and financing cannot be assessed against operating scale or liquidity without audited
      company-level numbers.
    diligencePath: >-
      Obtain the final SEC-filed S-4 and reconcile audited statements, pro forma capitalization, sources and uses, and
      dilution schedules.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: commercial-scale
    missingEvidence: Named customer contracts, deployment counts, contract values, renewals, and partner channel economics.
    whyItMatters: >-
      Partner announcements demonstrate intended pathways but do not establish paid adoption, recurring revenue, or unit
      economics.
    diligencePath: >-
      Request a customer and pipeline schedule with signed contract status, ARR or bookings attribution, renewal data,
      and OEM/channel terms.
    relatedQuestionRefs:
      - QO004
      - QO006
      - QO008
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Complete executive, board, committee, ownership, and succession disclosures.
    whyItMatters: The visible CEO and chairman coverage is insufficient to quantify key-person dependence or post-merger governance.
    diligencePath: >-
      Review the definitive proxy and S-4 governance sections for the full roster, committees, voting rights, and
      succession plan.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: minor
    topic: transaction
    missingEvidence: >-
      Final transaction documents reconciling the $3 billion enterprise-value statement with trust, financing, dilution,
      and redemption outcomes.
    whyItMatters: >-
      Different articles repeat headline transaction values while the realized equity value and post-close liquidity
      remain conditional.
    diligencePath: >-
      Reconcile the final merger agreement, S-4 pro forma capitalization, redemption sensitivity, warrants, and
      financing conversion terms.
    relatedQuestionRefs:
      - QO003
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Final S-4 or audited company materials showing segment revenue, customer pipeline, contract values, market share,
      SAM/SOM assumptions and conversion denominators.
    whyItMatters: >-
      Without company-specific denominators, global PQC estimates and federal transition costs cannot support a
      valuation-linked serviceable market.
    diligencePath: >-
      Request the final S-4, investor model and management bridge from global PQC categories to qualified pipeline,
      booked revenue and obtainable share.
    relatedQuestionRefs:
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: channel
    missingEvidence: >-
      OEM qualification status, channel take rates, warranty obligations, deployment counts and partner-attributed
      pipeline.
    whyItMatters: The retrofit and channel model may reduce customer friction but can also shift economics and timing to partners.
    diligencePath: >-
      Obtain executed partner agreements, qualification milestones, unit economics, channel margins and deployment
      references under NDA.
    relatedQuestionRefs:
      - QM005
      - QM006
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: market-sizing
    missingEvidence: >-
      A reconciled methodology note for public PQC market estimates that use different market boundaries, periods and
      revenue definitions.
    whyItMatters: >-
      Large market estimates are not comparable when one measures vendor revenue and another measures public-sector
      transition cost.
    diligencePath: >-
      Normalize each estimate to geography, period, included categories, revenue basis and buyer spend before using it
      in a model.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable EigenQ and competitor list prices, realized discounts, contract values, renewal rates, and partner take
      rates.
    whyItMatters: Packaging and switching-cost conclusions cannot be underwritten from capability descriptions alone.
    diligencePath: >-
      Obtain current price books, representative contracts, discount schedules, renewal cohorts, and OEM/channel
      economics.
    relatedQuestionRefs:
      - QP004
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: comparative-proof
    missingEvidence: >-
      Independent benchmarks, certifications, named deployments, customer references, and performance data comparing
      EigenQ with PQC specialists and incumbents.
    whyItMatters: >-
      The proposed integrated platform could be differentiated, bundled, or commoditized; public descriptions do not
      resolve which.
    diligencePath: >-
      Request third-party test reports, certification records, customer references, deployment counts, implementation
      timelines, and win/loss data.
    relatedQuestionRefs:
      - QP003
      - QP007
      - QP008
    relatedTableRefs:
      - TP002
      - TP003
  - type: stale
    severity: minor
    topic: competitor-scale
    missingEvidence: Current 2026 operating metrics for named competitors and any post-announcement EigenQ customer or revenue updates.
    whyItMatters: Funding and product announcements are not substitutes for current operating scale.
    diligencePath: >-
      Refresh competitor filings, product documentation, pricing pages, and EigenQ's final S-4 and subsequent investor
      disclosures.
    relatedQuestionRefs:
      - QP002
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: Audited revenue, bookings, ARR, revenue mix, contract values, and customer concentration schedules.
    whyItMatters: >-
      The proposed enterprise value cannot be compared with a revenue denominator or tested for quality and
      concentration.
    diligencePath: >-
      Obtain the final S-4 and audited financial statements, including product, customer, geography, and backlog
      disclosures.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin by product, CAC, payback, sales-cycle duration, partner take rates, warranty burden, and
      implementation costs.
    whyItMatters: Hardware and channel deployment can have materially different economics from recurring software revenue.
    diligencePath: Request cohort economics and a bridge from bookings to cash gross profit by direct and partner channel.
    relatedQuestionRefs:
      - QI004
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: liquidity
    missingEvidence: >-
      Monthly cash flow, minimum cash, burn, runway, debt obligations, sources and uses, redemptions, and next-round
      trigger.
    whyItMatters: >-
      The $45 million commitment and conditional SPAC trust account do not establish cash available or duration of
      funding.
    diligencePath: Obtain financing documents, a 24-month cash forecast, redemption sensitivity, and board-approved financing plan.
    relatedQuestionRefs:
      - QI006
      - QI007
  - type: missing-source
    severity: material
    topic: transaction-risk
    missingEvidence: Definitive SEC filing terms and evidence of closing, customer adoption, renewals, and commercial conversion.
    whyItMatters: A delayed or resized transaction could reduce available capital while commercialization remains unproven.
    diligencePath: >-
      Reconcile the final S-4, closing conditions, redemption results, and signed customer contracts after
      effectiveness.
    relatedQuestionRefs:
      - QI007
      - QI008
  - type: private-evidence-only
    severity: material
    topic: product-maturity
    missingEvidence: >-
      Independent product test results, throughput and latency benchmarks, supported algorithms, deployment counts, and
      production customer references.
    whyItMatters: >-
      Without measurable product and deployment evidence, the public platform description cannot establish technical
      maturity or repeatable customer value.
    diligencePath: >-
      Obtain a product diligence package with test reports, versioned documentation, reference architectures, customer
      references, and acceptance criteria.
    relatedQuestionRefs:
      - QE005
  - type: missing-source
    severity: material
    topic: assurance
    missingEvidence: >-
      Certification, accreditation, secure-development, incident-response, and regulated-environment approval records
      for each marketed module.
    whyItMatters: High-assurance buyers require evidence beyond standards alignment or intended CNSA 2.0 readiness.
    diligencePath: >-
      Request certification scopes, audit reports, SBOM or vulnerability-process evidence, incident history, and
      regulator or customer approvals.
    relatedQuestionRefs:
      - QE007
      - QE008
  - type: enumeration-incomplete
    severity: material
    topic: ecosystem
    missingEvidence: >-
      A complete, current inventory of OEM, channel, integration, and manufacturing dependencies with commercial
      responsibilities.
    whyItMatters: >-
      The ecosystem model may accelerate distribution but can also add qualification, support, supply, and margin
      dependencies.
    diligencePath: >-
      Request executed partner agreements, supported-platform matrices, channel economics, manufacturing controls, and
      responsibility assignments.
    relatedQuestionRefs:
      - QE004
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: >-
      A customer-level schedule showing active accounts, paid production status, renewal, churn, contract length, and
      cohort behavior.
    whyItMatters: >-
      Without retention and cohort denominators, announced relationships cannot be translated into durable recurring
      adoption.
    diligencePath: >-
      Request a dated customer cohort and revenue-retention schedule, with definitions and reconciliation to audited
      revenue.
    relatedQuestionRefs:
      - QU004
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
