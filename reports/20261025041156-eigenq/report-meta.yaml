companyProfile:
  summary: >-
    EigenQ is an Austin-based applied quantum technology company focused on hardware-rooted trust infrastructure,
    post-quantum cryptography, quantum-derived entropy, secure communications, networking, and sensing. Its stated
    initial markets include government, defense, critical infrastructure, and enterprise systems, with commercialization
    described through OEM, manufacturing, and channel relationships.
