              For a hyperscaler silicon team, the alternative to licensing Titan Core is pursuing similar
              power-efficiency gains in-house using commercial EDA tools such as Cadence's Cerebrus AI Studio or
              Synopsys's DSO.ai, both of which provide AI-driven low-power design automation as of 2026 - meaning
              Velaura's value proposition rests on its pre-built libraries and engineering expertise outperforming what
              a well-resourced in-house team could achieve with commodity tooling. Once a customer engages, Velaura's
              delivery depends on several external dependencies outside its direct control: the customer must be willing
              to share proprietary RTL under NDA, advanced-node foundry capacity (at partners such as TSMC or Samsung
              Foundry) must be available to physically implement the ultra-low-voltage design, and Velaura's own
              specialized low-voltage circuit engineering team - a comparatively small, hard-to-replicate group - must
              execute the physical-design toolflow. Notably, Samsung Catalyst Fund's position as both a Velaura investor
              and Samsung's foundry-linked venture arm creates a plausible (though undisclosed) strategic foundry
              relationship worth separate diligence. On the customer side, Velaura's own materials estimate up to $100
              million per year in power savings for a typical data center, explicitly built on stated assumptions (10
              cents/kWh electricity pricing and roughly $433.30 per chip per year across 100,000 to 250,000 units)
