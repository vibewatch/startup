      - number: '8.4'
        title: Recommendation, Exit Readiness, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              This chapter's recommendation is 'track' (research-more) with medium confidence, a high risk rating, and
              an unresolved valuation stance - not a generic company-quality score, but a direct consequence of the
              near-total absence of revenue, royalty-rate, and named-customer evidence needed to underwrite a confident
              price-sensitive call. This is consistent with preferring research-more over false precision when core
              valuation inputs are missing. Exit readiness is entirely unproven: no secondary-market transaction, tender
              offer, or IPO/M&A timeline has been disclosed, though Velaura's board composition (Intel's Lip-Bu Tan,
              MARA's Fred Thiel, and multiple experienced venture partners) provides governance credibility comparable
              to what facilitated Cerebras's IPO and Groq's acquisition-adjacent outcome. Five diligence asks would most
              efficiently resolve this chapter's uncertainty, in priority order: (1) actual revenue and royalty rate,
              (2) at least one named hyperscaler customer reference, (3) cap-table and preference terms, (4) current
              cash position and runway, and (5) an independent technical benchmark of the claimed 2-4x efficiency
              improvement. Resolving even two or three of these would likely move this chapter's recommendation
              decisively toward either a buy or an avoid call.
