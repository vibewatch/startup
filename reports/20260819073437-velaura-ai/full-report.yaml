      - number: '8.3'
        title: Comparable Set and Bull/Base/Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              No comparable in this chapter's set is a precise stage-and-business-model match for Velaura. Arm Holdings,
              the closest royalty-model public comparable, trades at a $270.57 billion market cap against $4.92 billion
              in FY2026 revenue - a roughly 52-55x price-to-sales ratio reflecting its mature, diversified scale rather
              than a transferable benchmark for an early-stage licensor. The direct AI-silicon sector comparables show
              extraordinary volatility within a single year: Cerebras validated the segment's upside with a ~$56 billion
              IPO in May 2026, while Groq's valuation was reset from $6.9 billion to $3.5 billion following a reported
              $20 billion NVIDIA deal that absorbed its founding team, and Untether AI - a directly comparable low-power
              AI chip startup - went bankrupt within roughly sixteen months of still operating. Applying even the
              conservative end of typical semiconductor IP licensing multiples (8x revenue) to Velaura's $1B+ valuation
              would imply roughly $125 million in annual revenue is needed to justify the price - a figure with no
              public evidence of support. Against this backdrop, the bull case requires at least one hyperscaler
              engagement to convert to a named design win within 18 months; the base case assumes gradual, partial
              conversion consistent with typical 12-24 month qualification cycles; and the bear case - a real tail risk
              given the comparable set's demonstrated volatility - assumes no conversion and continued legacy-business
              decline, potentially forcing a down round or worse.
