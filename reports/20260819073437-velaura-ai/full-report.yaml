      - number: '2.2'
        title: TAM/SAM/SOM and Contradictory Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              No single, evidence-constrained TAM/SAM/SOM figure exists for Velaura's specific niche of ultra-low-power
              AI silicon IP licensing; every available public figure describes an adjacent, broader category. On the
              data-center side, three independent 2026 methodologies diverge by nearly 2x even before scope differences
              are considered: IDC's segment-level $281 billion 'intelligent datacenter' figure, an implied ~$390 billion
              AI share of Gartner's $1.3 trillion total semiconductor forecast, and Deloitte's revised ~$500 billion
              full-year estimate. On the Physical AI side - relevant to Velaura's robotics/embodied-AI ambitions - three
              publishers' 2026 estimates span more than a 7x range ($0.89 billion per MarketsandMarkets' narrower 2025
              base, $6.93 billion per SNS Insider, and $7.11 billion per Mordor Intelligence), reflecting materially
              different definitions of what counts as 'physical AI' hardware and software rather than a converging
              consensus. Because Velaura's revenue model is royalty-based (a license fee plus a share of measured power
              savings) rather than direct chip sales, even a well-defined SAM for the underlying accelerator market
              would overstate Velaura's own obtainable revenue; the analytically correct SOM would be measured in
              royalty dollars per XPU shipped, and no public source provides a bottom-up estimate of that figure. This
              chapter therefore preserves the sizing contradiction explicitly rather than collapsing it into one
              headline number, and records the missing SOM estimate as a named evidence gap.
