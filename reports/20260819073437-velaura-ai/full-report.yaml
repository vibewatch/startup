      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The dominant growth driver for Velaura's thesis is that AI data-center electricity demand is on track to
              nearly double, from approximately 485 TWh in 2025 to 950 TWh by 2030, while the US alone faces an
              estimated 9.3 GW structural power shortfall in 2026 - a physical constraint that increases the value of
              any technology that extracts more useful compute per watt. Hyperscaler capex growth (projected at $600-725
              billion in 2026, up roughly 75% year over year) expands the pool of budget that could eventually fund
              IP-licensing fees, and the faster growth of custom-ASIC shipments (44.6% CAGR) versus merchant GPUs (16.1%
              CAGR) expands the set of in-house silicon programs that are natural licensing prospects. Working against
              these drivers are several real adoption constraints: US-China export controls and Chinese rare-earth
              retaliation add compliance cost and supply-chain uncertainty; the high capital intensity of advanced-node
              chip design and manufacturing raises barriers to entry for competitors but does not eliminate Velaura's
              own execution risk; and typical 12-24 month SoC integration and foundry-qualification cycles mean that
              even a signed design win delays royalty cash flow by one to two years. A further constraint worth flagging
              for valuation purposes is that the broader industry is attacking the same power problem from multiple
              angles simultaneously - liquid-cooling adoption in AI servers rose from 15% in 2024 to a projected 76% in
              2026 - meaning system-level cooling improvements could partially substitute for chip-level efficiency
              gains over time and are not solely dependent on vendors like Velaura.
            claimRefs:
              - CM015
              - CM016
              - CM012
              - CM017
              - CM022
              - CM034
              - CM032
              - CM024
          - type: table
            tableRef: TM004
            claimRefs:
