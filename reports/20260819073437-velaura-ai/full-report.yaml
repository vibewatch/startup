      - number: '3.2'
        title: Capability, Pricing, and Business-Model Comparison
        blocks:
          - type: paragraph
            body: >-
              On performance-per-watt claims alone, Velaura's 2-4x improvement is not the largest headline figure in the
              segment - Mythic claims up to 100x efficiency gains from its analog compute-in-memory architecture - but
              Velaura is unusual in pairing its efficiency claim with 30 million-plus already-shipped production ASICs,
              a scale proof neither Mythic nor the now-defunct Untether AI could match at a comparable stage. Business
              models diverge sharply across the set: Velaura and its closest structural analog, Arm's historical
              processor-licensing business, both charge an upfront fee plus a usage-based royalty, whereas NVIDIA, AMD,
              Hailo, and Mythic all sell finished silicon directly and capture full unit economics (and full
              inventory/manufacturing risk) rather than a royalty stream. Notably, Arm itself broke from three decades
              of pure IP licensing in 2026 to begin selling finished AI chips directly, illustrating that even an
              established, successful royalty-model incumbent can face pressure to compete directly with its own
              licensees - a precedent risk worth tracking for Velaura's own model. On disclosure and independent
              verification, Velaura compares unfavorably to some peers: Hailo publicly named roughly 100 customers
              before its acquisition, while Velaura has not named any of the three hyperscalers it claims to be engaged
              with, and no independent, head-to-head benchmark of Titan Core against Mythic's or Hailo's architectures
              exists in the sources reviewed for this chapter.
