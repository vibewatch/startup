        - >-
          Execution risk on foundry qualification timelines; commoditization from EDA tools; customer concentration if
          only one design win materializes.
        - >-
          Plausible given production-proven technology and strong macro tailwinds, but currently unsupported by any
          named customer evidence.
      - - Base
        - >-
          Gradual, partial conversion (e.g., one design win with a multi-year production ramp) alongside continued
          legacy-business decline; Velaura raises at least one more round before reaching self-sustaining royalty
          revenue.
        - >-
          Valuation likely holds roughly flat to modestly up at the next round, contingent on visible pipeline progress
          rather than confirmed revenue.
        - >-
          Financing dependency risk if the next round is needed before revenue visibility improves; continued disclosure
          opacity keeps the valuation evidence-thin.
        - >-
          Consistent with typical 12-24 month semiconductor IP qualification cycles and the current lack of disclosed
          financial metrics.
      - - Bear
        - >-
          None of the three hyperscaler engagements converts within 18 months; legacy Teraflux business continues to
          shrink as Bitcoin miners pivot to AI/HPC colocation; EDA-tool commoditization erodes urgency for third-party
          IP.
        - >-
