  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Architecture
        blocks:
          - type: paragraph
            body: >-
              Velaura AI does not sell a finished chip; it delivers a physical-design IP and toolflow product through a
              three-stage engagement model described on its own site: the customer submits its RTL design plus
              priorities for area, power, and other factors; Velaura applies proprietary low-voltage IP libraries and a
              proprietary toolflow built for yield and reliability; the customer receives an optimized, node-specific
              GDS layout or chiplet as output. Architecturally, Titan Core targets the matrix-multiplication (MATMUL)
              operations that dominate AI training and inference energy use, claiming a 2-4x reduction in the energy
              those operations require through proprietary circuit and library technology validated at advanced 3nm and
              2nm process nodes. Integration is designed to preserve full functional equivalence at a lower operating
              voltage without requiring software changes, positioning Titan Core as a drop-in physical-design
              optimization rather than a new architecture the customer must adopt wholesale. Velaura maintains two
              distinct product/solution lines reflecting its corporate history: Ultra Low Power AI Compute (the Titan
              Core IP platform for AI accelerators) and Blockchain (its legacy air, immersion, and hydro-cooled
              Bitcoin-mining hardware), with the underlying low-voltage engineering discipline shared across both.
            claimRefs:
