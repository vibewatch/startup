    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Velaura AI, Inc. is a Silicon Valley-based semiconductor company developing ultra-low-power silicon and
              software technologies for AI compute infrastructure. The company was previously known as Auradine, a
              U.S.-based bitcoin-mining ASIC maker, before rebranding to Velaura AI in March 2026 as part of a strategic
              pivot toward AI compute. Velaura's flagship offering, Titan Core, is not a standalone chip but a silicon
              design and IP platform: customers provide their own RTL processor design, and Velaura applies proprietary
              ultra-energy-efficient circuit and physical-design libraries to deliver an optimized, drop-in physical
              layout at advanced process nodes such as 3nm and 2nm. The company claims Titan Core delivers a 2-4x
              improvement in performance per watt for the matrix-multiplication operations that dominate AI training and
              inference energy use, translating into up to 500W of savings on a typical 1000W-class GPU or XPU. Velaura
              monetizes this IP through an upfront licensing fee plus royalties tied to the power savings a customer
              actually achieves, a structure CEO Rajiv Khemani has explicitly compared to Arm's processor-licensing
              model. The underlying low-power design methodology has already been validated at commercial scale, with
              more than 30 million ASICs in production across leading semiconductor nodes, giving Velaura a real-world
              reliability and yield track record that most first-time AI-silicon entrants lack. The company targets
              three adjacent markets: hyperscale AI data centers seeking to cut electricity and cooling costs, Physical
              and Embodied AI systems (robots, drones, autonomous machines) operating under strict power and thermal
              budgets, and Edge AI deployments requiring energy-efficient local processing.
