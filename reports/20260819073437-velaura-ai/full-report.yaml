  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Overview
        blocks:
          - type: paragraph
            body: >-
              This chapter identifies five risk categories with material investment implications for Velaura AI. Ranked
              by combined likelihood and severity, the highest-priority risk is customer/revenue concentration: the $1B+
              Series A valuation depends almost entirely on an AI-silicon licensing business with zero named customers,
              while the only independently corroborated customer relationship (MARA) is simultaneously a related-party
              investor. Close behind is commoditization risk from commercial EDA tooling (Cadence, Synopsys) that could
              let hyperscaler customers replicate Velaura's power-efficiency gains in-house. Regulatory risk from
              evolving US-China semiconductor export controls is material but indirect, transmitted through Velaura's
              undisclosed foundry and hyperscaler relationships rather than a direct, confirmed exposure. Operational
              risk centers on the structural contraction of Velaura's legacy Bitcoin-mining hardware customer base as
              the industry pivots to AI/HPC colocation, removing the company's only currently revenue-evidenced business
              just as its new business remains unproven. Financial/model risk stems from total non-disclosure of
              cash-on-hand, burn, runway, and royalty-measurement methodology. Each of these risks carries a distinct
              investment implication: diligence should not treat Velaura's unicorn valuation as proof of de-risked
              commercial execution, given how much of the underlying evidence traces back to company claims rather than
              independent confirmation.
            claimRefs:
              - CR030
              - CR016
              - CR002
              - CR013
              - CR019
              - CR009
              - CR010
      - number: '7.2'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              As of January 15, 2026, US export control policy for advanced computing chips shifted from a presumption
              of denial to case-by-case license review for exports to China and Macau, adding certification and
              third-party testing requirements for covered products. Velaura's own disclosures do not address its
              exposure to this regime, but the transmission channel is real: if any of its three undisclosed hyperscaler
              engagements involve China-serving infrastructure or China-linked foundry capacity, these rules would
              directly affect deal economics and timelines. Separately, AI-related patent litigation has surged
              industry-wide, with legal-industry analysis counting over a thousand AI patent lawsuits globally in the
              past five years; no lawsuit or patent dispute specifically names Auradine or Velaura AI as of the run
              date, but the company's own unverified claim of 'patented' technology - without a specific patent number
              confirmed via USPTO or Google Patents - is itself a diligence gap that leaves IP-strength unverifiable.
              Independent confirmation of Velaura AI, Inc.'s Delaware legal-entity status was not completed in this
              chapter (the state registry requires a fee-gated direct query), and no sanctions-list or denied-party
              exposure was identified for the company or its named leadership.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
