  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              Velaura AI does not sell a market-ready chip; it licenses ultra-low-power silicon design IP that other
              companies integrate into their own AI accelerators. That structural fact means the relevant market
              boundary is not simply 'the AI chip market' but the subset of AI-silicon design decisions where a
              third-party power-efficiency IP vendor can plausibly be licensed in: hyperscale data-center accelerators,
              Physical and Embodied AI systems (robots, drones, autonomous machines), and Edge AI devices, per Velaura's
              own market framing. The data center AI chip market itself is tracked narrowly by some publishers
              (SemiconductorInsight sizes it at $13.8 billion in 2026, reaching $45.2 billion by 2034) and far more
              broadly by others once merchant GPUs, custom ASICs, memory, and networking silicon are included (Deloitte
              and Gartner both place the overall AI semiconductor market at $300-500 billion in 2026, while IDC's
              narrower 'intelligent datacenter' segment sits at $281 billion within a $477.1 billion
              data-center-semiconductor total). NVIDIA alone captured roughly 87.4% of Q1 2026 merchant data-center AI
              chip revenue among NVIDIA, AMD, and Intel, underscoring that most of this headline market value is
              currently captured by GPU vendors rather than IP licensors like Velaura. Explicitly excluded from
              Velaura's addressable market are general-purpose CPU/server silicon, non-AI networking chips, and the
              finished-chip revenue hyperscalers capture internally when they design their own custom ASICs (Google TPU,
              AWS Trainium, Microsoft Maia, Meta MTIA) - though those same internal programs are potential IP-licensing
              customers for Velaura's underlying power-efficiency technology rather than direct substitutes for it.
            claimRefs:
              - CM025
              - CM001
              - CM002
              - CM004
              - CM019
          - type: table
            tableRef: TM001
