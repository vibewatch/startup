            body: >-
              No public source discloses Velaura's cash-on-hand, monthly burn, or runway following its August 2026
              Series A, nor the measurement methodology underlying its royalty revenue model - a financial/model risk
              compounded by the fact that Groq, a well-funded independent AI-silicon competitor, needed a second large
