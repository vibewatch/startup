  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Velaura AI's investment thesis rests on three pillars: production-proven ultra-low-power silicon IP (30
              million-plus ASICs shipped), a credible leadership and board bench (including Intel CEO Lip-Bu Tan and
              MARA CEO Fred Thiel), and favorable macro tailwinds - a 9.3 GW US power shortfall and $600-725 billion in
              2026 hyperscaler AI infrastructure capex - that increase the theoretical value of performance-per-watt
              technology. The anti-thesis is equally concrete: zero named customers exist for the Titan Core AI-silicon
              business the valuation is actually built on, no royalty rate or revenue figure of any kind is disclosed,
              and Heise Online's independent reporting confirms Velaura's CEO declined to name any of the three claimed
              hyperscaler engagements even under direct questioning. Compounding this, Arm - Velaura's own explicit
              business-model comparable - broke from three decades of pure IP licensing in 2026 to begin selling chips
              directly, a precedent that raises long-term doubts about the durability of royalty-based economics as a
              standalone model. This chapter's overall judgment is that both the thesis and anti-thesis are
              evidence-supported, which is precisely why a confident buy or avoid recommendation is not warranted with
              current information.
            claimRefs:
              - CV001
              - CV016
              - CV023
              - CV020
              - CV018
          - type: table
            tableRef: TV002
            claimRefs:
              - CV018
              - CV016
              - CV017
              - CV023
              - CV031
      - number: '8.2'
        title: Current Financing and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Velaura AI closed a $110 million Series A on August 18, 2026, at a valuation exceeding $1 billion, led by
              Seligman Ventures with participation from Capricorn Investment Group, Prosperity7 Ventures, Mayfield,
              Maverick Silicon, MARA, Premji Invest, Samsung Catalyst Fund, and StepStone Group. No source discloses the
              exact post-money valuation figure, share price, or preference structure beyond the 'more than $1 billion'
              headline, nor any liquidation-preference, anti-dilution, or option-pool detail that would let diligence
              distinguish common-equity value from preferred-stock-inflated structuring. The single independently filed
              corroboration of a rising valuation mark comes from MARA Holdings' SEC 10-Q, which recorded $11.9 million
              and $2.7 million in ASC 321 fair-value gains on its existing Velaura holdings when a later financing round
              established a higher observable price - real, audited evidence that Velaura's valuation has risen across
              rounds, even though it does not independently confirm the specific $1B+ figure. Velaura's cap table mixes
              financial VCs with strategic and related-party investors (Samsung Catalyst Fund, MARA), a structure that
              adds interpretive complexity: MARA's rising fair-value marks are simultaneously the best evidence of
              Velaura's increasing valuation and a related-party data point that should not be treated as fully
              independent.
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV033
              - CV039
