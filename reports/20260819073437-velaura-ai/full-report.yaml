            body: >-
              No source reviewed discloses Velaura's actual gross margin, cost-of-goods structure, R&D spend, or
              customer acquisition cost. Industry benchmarks provide only a rough comparable frame: fabless
              semiconductor companies typically report gross margins of 50-65% (with leaders like NVIDIA exceeding 70%),
              and early-stage fabless startups typically spend 20-40% of revenue on R&D (spiking above 50% pre-revenue)
              while burning $500,000 to $2,000,000 per month, with 12-18 months of runway considered prudent. None of
              these figures is Velaura-specific, and applying them directly risks understating the unique economics of a
              royalty-based IP licensor versus a unit-sale fabless chip vendor: Velaura's model requires far less
              manufacturing capex and inventory risk than a typical fabless comparable, since it is not the party paying
              for wafer starts, but it also means its revenue per design win is a small fraction of the underlying
              chip's total value, similar to Arm's historically estimated 1-2%-of-ASP royalty rate. The only
              independently corroborated cash-flow-adjacent data point available for any part of Velaura's business is
              MARA's SEC-filed disclosure of its product-purchase advances and investment carrying value, which relates
              to the legacy Teraflux hardware business rather than the new Titan Core IP licensing model this valuation
