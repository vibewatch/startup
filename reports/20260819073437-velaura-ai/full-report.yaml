      - number: '3.3'
        title: Switching Costs, Lock-In, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              Once a hyperscaler commits to integrating Velaura's Titan Core IP into a chip design, switching costs are
              likely meaningful: SoC integration and foundry-qualification cycles for a new silicon IP block at advanced
              process nodes typically span 12 to 24 months, creating real lock-in once a design win is secured but also
              meaning Velaura's own revenue recognition lags any announced engagement by a year or more. Distribution
              power in the broader AI-chip value chain is concentrated: Broadcom and Marvell together provide ASIC
              design services behind more than 80% of hyperscaler custom silicon, giving them significant influence over
              whether third-party IP like Velaura's gets incorporated into a given design - they could act as a channel
              partner that embeds Velaura's libraries into their design-service offerings, or as a direct competitor if
              they build equivalent power-optimization capability internally. NVIDIA is responding to the broader
              custom-silicon shift not by competing purely on standalone chip performance but by selling more fully
              integrated racks and systems and opening its NVLink interconnect to third-party ASICs, a strategy that
              could either create new integration opportunities for Velaura's IP or further entrench NVIDIA's ecosystem
              lock-in depending on how it plays out.
            claimRefs:
