              - CP027
              - CP028
      - number: '3.4'
        title: Moat Durability and Adverse Competitor Evidence
        blocks:
          - type: paragraph
            body: >-
              Velaura's clearest moat is production-proven manufacturing history: 30 million-plus shipped ASICs give
              hyperscaler partners a real yield and reliability track record that a from-scratch competitor cannot
              replicate quickly. That moat is qualified, however, by the fact that this volume was built primarily on
              Auradine's bitcoin-mining chips rather than on AI-specific Titan Core silicon, so it derisks manufacturing
              execution more than it validates the AI-specific performance claim. The clearest threat to durability is
              commoditization risk: Cadence's Cerebrus and Synopsys's DSO.ai already offer AI-driven low-power design
              automation that any competitor or customer could use to pursue similar power gains in-house, and if a
              foundry partner (Samsung, TSMC) chose to embed equivalent libraries directly into its standard process
              design kits, much of Velaura's differentiation could erode. The competitive-density trend in the sector
              cuts both ways for this assessment: Untether AI's shutdown and Hailo's acquisition reduce the number of
              independent low-power AI chip vendors Velaura must compete against directly, but they could equally be
              read as evidence that the segment cannot yet support many independent vendors at all - a risk that applies
              to Velaura as much as to any peer that has already exited.
