              Every public market-sizing figure describes an adjacent broader category (data-center AI chips, physical
              AI hardware, overall AI semiconductors); none directly measures the royalty-licensing revenue pool Velaura
              could realistically capture, which should discount confidence in any valuation built on top-down TAM
              percentages.
            calloutType: risk
            claimRefs:
              - CM028
