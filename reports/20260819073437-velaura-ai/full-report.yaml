              intensity across the sector. This chapter finds no evidence of fraud, restatement, or accounting
              irregularity at Velaura or in MARA's disclosure of its Velaura investment; the ASC 321 fair-value
              treatment MARA applies follows standard equity-investment accounting practice, a mitigating signal on
              financial-integrity risk specifically. On people/execution risk, Velaura's public narrative concentrates
              heavily on CEO Rajiv Khemani and CDO Manu Gulati, with minimal independent biographical detail on the rest
              of the executive bench, creating meaningful key-person dependence; no executive departure or resignation
              was identified in 2025-2026, a mitigating continuity signal, and board oversight (including Intel CEO
