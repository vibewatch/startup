              (Mayfield), Umesh Padval (Seligman Ventures, which holds the lead Series A board seat), Dipender Saluja
              (Capricorn Investment Group), Fred Thiel (CEO, MARA - both an investor and a former Teraflux hardware
              customer), Sriram Viswanathan (Celesta Capital), and Intel CEO Lip-Bu Tan, who sits on the board via
              Walden International and lends significant semiconductor-industry credibility. Two academic/technical
              advisors, Aditya Grover (CTO, Inception AI; UCLA professor) and Magnus Egerstedt (Provost, UNC Chapel
