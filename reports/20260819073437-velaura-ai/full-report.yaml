      - number: '4.1'
        title: Revenue Model, Pricing, and Recognition
        blocks:
          - type: paragraph
            body: >-
              Velaura AI's core AI-silicon revenue mechanism is a two-part structure: an upfront IP license fee plus a
              royalty tied to the power savings a customer measurably achieves using Titan Core, a model the company
              explicitly likens to Arm's historical processor-licensing business. The company's own materials illustrate
              the customer-side savings basis at approximately $1,300 per XPU over three years, but neither the royalty
              percentage, the measurement methodology for 'power savings achieved,' nor any minimum license fee is
              disclosed in any source reviewed for this chapter - a material gap given that the entire royalty mechanic
              depends on a savings measurement neither party has described in public. Because royalty revenue is tied to
              realized customer savings rather than unit shipment alone, revenue recognition likely lags physical chip
              production by however long a customer's own qualification and deployment cycle takes, plausibly the same
              12-24 month window identified in the Competitors chapter for SoC integration generally. Velaura's legacy
              Teraflux bitcoin-mining hardware business, by contrast, used a conventional direct hardware-sale model;
              MARA's own SEC filing shows this legacy business operated on a prepayment basis, with MARA advancing $22.3
              million for product purchases in the quarter ended March 31, 2025 against a $57.2 million outstanding
              balance, fully settled by the most recent filing period with no new advances. No source discloses whether
              or how much of Velaura's current revenue mix still derives from this legacy hardware business versus the
              newer Titan Core licensing model.
