companyProfile:
  summary: Velaura AI, Inc. is a Silicon Valley semiconductor company (formerly Auradine, a U.S. bitcoin-mining ASIC maker) that pivoted in March 2026 to license ultra-low-power silicon design IP, branded
    Titan Core, for AI accelerators used in hyperscale data centers and Physical AI (robotics, drones, autonomous machines). On August 18, 2026 the company closed a $110 million Series A led by Seligman
    Ventures at a valuation exceeding $1 billion, achieving unicorn status, with its underlying low-power design technology already validated across more than 30 million production ASICs from its legacy
    bitcoin-mining hardware business.
  founders:
  - name: Rajiv Khemani
    role: Co-founder & CEO
    background: Prior semiconductor and systems executive experience; led Auradine through its Teraflux bitcoin-mining business and the pivot to Velaura AI.
    claimRefs:
    - CO012
  - name: Manu Gulati
    role: Co-founder & Chief Development Officer
    background: Prior custom-silicon architecture experience including as a NUVIA co-founder (acquired by Qualcomm); leads Velaura's silicon architecture.
    claimRefs:
    - CE029
  foundingLocation: Santa Clara, California, USA
  headquarters: Santa Clara, California, USA
  productSummary: Titan Core, a silicon design and IP platform licensed into customers' own AI accelerator RTL designs to deliver a claimed 2-4x performance-per-watt improvement, plus legacy Teraflux air/immersion/hydro-cooled
    Bitcoin-mining ASIC hardware.
  customerFocus: Hyperscale cloud data center operators, Physical/Embodied AI (robotics, drones, autonomous machines) OEMs, and Edge AI device makers; legacy customer base is industrial Bitcoin-mining operators.
  businessModel: Upfront IP license fee plus a royalty tied to the customer's measured power savings (an Arm-like licensing model), alongside legacy direct hardware sales of Teraflux mining systems.
  stage: Series A (post-AI-pivot); unicorn valuation
  fundingStatus: $110M Series A closed August 18, 2026 at a valuation exceeding $1 billion; cumulative disclosed capital raised across four rounds (2023-2026) is approximately $424 million.
