  - CV016
  - CV017
  - CV023
  - CV031
- id: TV003
  title: Bull / Base / Bear Scenario Table
  columns:
  - Scenario
  - Assumptions
  - Valuation / Return Logic
  - Key Risks
  - Probability Signal
  rows:
  - - Bull
    - At least one of three hyperscaler engagements converts to a named, signed design win within 18 months; legacy hardware decline stabilizes; macro power-constraint tailwinds continue to favor efficiency-focused
      IP.
    - Revenue inflection could support markup at next round or a strategic acquisition/IPO path similar to Cerebras's ~$56B outcome, though at a much smaller scale given Velaura's earlier stage.
    - Execution risk on foundry qualification timelines; commoditization from EDA tools; customer concentration if only one design win materializes.
    - Plausible given production-proven technology and strong macro tailwinds, but currently unsupported by any named customer evidence.
  - - Base
    - Gradual, partial conversion (e.g., one design win with a multi-year production ramp) alongside continued legacy-business decline; Velaura raises at least one more round before reaching self-sustaining
      royalty revenue.
    - Valuation likely holds roughly flat to modestly up at the next round, contingent on visible pipeline progress rather than confirmed revenue.
    - Financing dependency risk if the next round is needed before revenue visibility improves; continued disclosure opacity keeps the valuation evidence-thin.
    - Consistent with typical 12-24 month semiconductor IP qualification cycles and the current lack of disclosed financial metrics.
  - - Bear
    - None of the three hyperscaler engagements converts within 18 months; legacy Teraflux business continues to shrink as Bitcoin miners pivot to AI/HPC colocation; EDA-tool commoditization erodes urgency
      for third-party IP.
    - Valuation could face a down round or write-down, similar to Groq's ~50% reset following its NVIDIA deal, or a more severe outcome similar to Untether AI's bankruptcy in the most adverse case.
    - Capital exhaustion without a revenue inflection; key-person departure; failure to differentiate from in-house EDA-based alternatives.
    - A real tail risk given the sector's demonstrated volatility (Untether AI, Groq) even though no adverse signal has materialized for Velaura specifically as of the run date.
  notes: Probability signals are qualitative author assessments grounded in the cited evidence, not statistically modeled probabilities.
