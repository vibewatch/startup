  rows:
  - - Arm Holdings (public)
    - Market cap / FY2026 revenue
    - $270.57B market cap; $4.92B FY2026 revenue; ~52-55x P/S
    - Closest public royalty-plus-license business-model comparable
    - Arm is a mature, diversified, decades-old public company; not comparable in stage or scale to Velaura's Series A
  - - Cerebras Systems (public, IPO'd May 2026)
    - IPO-day valuation
    - ~$56 billion fully diluted
    - Direct AI-silicon sector comparable; largest recent US tech IPO
    - Cerebras sells finished wafer-scale chips (hardware sale model), not a royalty-licensing business like Velaura
  - - Groq (private, NVIDIA deal + reset raise)
    - Valuation history
    - $6.9B (Sep 2025) -> ~$20B NVIDIA IP/talent deal (Dec 2025) -> $3.5B reset raise (Aug 2026)
    - Direct AI-silicon sector comparable illustrating valuation volatility
    - Groq's business model pivoted entirely (to 'AI inference neocloud'), reducing direct comparability to Velaura's licensing model
  - - Tenstorrent (private)
    - Valuation status
    - No disclosed unicorn-level valuation reset as of mid-2026
    - Direct AI-silicon accelerator/IP sector comparable
    - Limited public valuation transparency; may understate Tenstorrent's actual private valuation
  - - Untether AI (defunct)
    - Outcome
    - Bankruptcy (Oct 2025); $128M+ liabilities
    - Downside-tail comparable for a technically credible low-power AI chip startup
    - Untether AI sold finished chips rather than licensing IP, a business-model difference from Velaura
  - - Semiconductor IP licensing sector (aggregate)
    - Typical EV/Revenue multiple
    - 8-12x for high-quality, growing firms; 4-8x for slower-growth/commoditized portfolios (2026)
    - General valuation-methodology benchmark for royalty-based IP businesses
    - Aggregate sector figures obscure company-specific quality/growth differences; not Velaura-specific
  notes: No comparable listed is a precise stage-and-model match for Velaura; each is included to bound the plausible valuation range from different angles (public royalty-model peer, IPO peer, private
    AI-silicon peers, sector-multiple benchmark, and a downside-failure case).
