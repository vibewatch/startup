company:
  name: Velaura AI
chapter:
  number: 8
  title: Valuation
  summary: Velaura AI's $1B+ August 2026 Series A valuation is corroborated by an independent SEC filing (MARA's fair-value gains) but cannot be benchmarked against any comparable multiple absent disclosed
    revenue or named customers; given the AI-silicon comparable set's extreme volatility (Groq's ~50% reset, Cerebras's ~$56B IPO, Untether AI's bankruptcy), this chapter recommends 'track' with high risk
    rating and an unresolved valuation stance pending revenue, royalty-rate, and named-customer disclosure.
sections:
- id: investment-thesis-anti-thesis
  title: Investment Thesis and Anti-Thesis
  body: 'Velaura AI''s investment thesis rests on three pillars: production-proven ultra-low-power silicon IP (30 million-plus ASICs shipped), a credible leadership and board bench (including Intel CEO
    Lip-Bu Tan and MARA CEO Fred Thiel), and favorable macro tailwinds - a 9.3 GW US power shortfall and $600-725 billion in 2026 hyperscaler AI infrastructure capex - that increase the theoretical value
    of performance-per-watt technology. The anti-thesis is equally concrete: zero named customers exist for the Titan Core AI-silicon business the valuation is actually built on, no royalty rate or revenue
    figure of any kind is disclosed, and Heise Online''s independent reporting confirms Velaura''s CEO declined to name any of the three claimed hyperscaler engagements even under direct questioning. Compounding
    this, Arm - Velaura''s own explicit business-model comparable - broke from three decades of pure IP licensing in 2026 to begin selling chips directly, a precedent that raises long-term doubts about
    the durability of royalty-based economics as a standalone model. This chapter''s overall judgment is that both the thesis and anti-thesis are evidence-supported, which is precisely why a confident buy
    or avoid recommendation is not warranted with current information.'
  claimRefs:
  - CV001
  - CV016
  - CV023
  - CV020
  - CV018
  tableRefs:
  - TV002
- id: current-financing-valuation-context
  title: Current Financing and Valuation Context
  body: 'Velaura AI closed a $110 million Series A on August 18, 2026, at a valuation exceeding $1 billion, led by Seligman Ventures with participation from Capricorn Investment Group, Prosperity7 Ventures,
    Mayfield, Maverick Silicon, MARA, Premji Invest, Samsung Catalyst Fund, and StepStone Group. No source discloses the exact post-money valuation figure, share price, or preference structure beyond the
    ''more than $1 billion'' headline, nor any liquidation-preference, anti-dilution, or option-pool detail that would let diligence distinguish common-equity value from preferred-stock-inflated structuring.
    The single independently filed corroboration of a rising valuation mark comes from MARA Holdings'' SEC 10-Q, which recorded $11.9 million and $2.7 million in ASC 321 fair-value gains on its existing
    Velaura holdings when a later financing round established a higher observable price - real, audited evidence that Velaura''s valuation has risen across rounds, even though it does not independently
    confirm the specific $1B+ figure. Velaura''s cap table mixes financial VCs with strategic and related-party investors (Samsung Catalyst Fund, MARA), a structure that adds interpretive complexity: MARA''s
    rising fair-value marks are simultaneously the best evidence of Velaura''s increasing valuation and a related-party data point that should not be treated as fully independent.'
  claimRefs:
  - CV001
  - CV002
  - CV007
  - CV014
  - CV015
  tableRefs:
  - TV001
- id: comparable-set-scenarios
  title: Comparable Set and Bull/Base/Bear Scenarios
  body: 'No comparable in this chapter''s set is a precise stage-and-business-model match for Velaura. Arm Holdings, the closest royalty-model public comparable, trades at a $270.57 billion market cap against
    $4.92 billion in FY2026 revenue - a roughly 52-55x price-to-sales ratio reflecting its mature, diversified scale rather than a transferable benchmark for an early-stage licensor. The direct AI-silicon
    sector comparables show extraordinary volatility within a single year: Cerebras validated the segment''s upside with a ~$56 billion IPO in May 2026, while Groq''s valuation was reset from $6.9 billion
    to $3.5 billion following a reported $20 billion NVIDIA deal that absorbed its founding team, and Untether AI - a directly comparable low-power AI chip startup - went bankrupt within roughly sixteen
    months of still operating. Applying even the conservative end of typical semiconductor IP licensing multiples (8x revenue) to Velaura''s $1B+ valuation would imply roughly $125 million in annual revenue
    is needed to justify the price - a figure with no public evidence of support. Against this backdrop, the bull case requires at least one hyperscaler engagement to convert to a named design win within
    18 months; the base case assumes gradual, partial conversion consistent with typical 12-24 month qualification cycles; and the bear case - a real tail risk given the comparable set''s demonstrated volatility
    - assumes no conversion and continued legacy-business decline, potentially forcing a down round or worse.'
