- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Argument
  - What Would Change the View
  rows:
  - - 'Thesis: Velaura''s production-proven low-power IP (30M+ ASICs) and favorable macro power-constraint tailwinds justify continued tracking toward a unicorn-scale AI-silicon licensing business.'
    - A named hyperscaler design win or disclosed AI-specific revenue would convert this from a plausible narrative into evidence-supported traction.
  - - 'Thesis: The royalty-plus-license business model, while economically thinner per unit than a hardware sale, offers asset-light, high-margin scaling potential similar to Arm''s historical model.'
    - Disclosure of an actual royalty rate and at least one signed license agreement would allow this to be modeled quantitatively rather than assumed by analogy.
  - - 'Anti-thesis: Zero named customers exist for the AI-silicon business the valuation is built on; all traction claims trace back to company statements repeated by press.'
    - Independent confirmation of a hyperscaler relationship (customer reference, hyperscaler-side disclosure, or a benchmark) would materially reduce this concern.
  - - 'Anti-thesis: The comparable set is extremely volatile (Groq''s ~50% reset, Untether AI''s bankruptcy, Cerebras''s IPO windfall), meaning today''s $1B+ mark could look very different within 12 months.'
    - A second financing round at a stable or higher valuation, without a down-round adjustment, would reduce (though not eliminate) this concern.
  - - 'Anti-thesis: Commercial EDA tools (Cadence, Synopsys) could let hyperscalers replicate Velaura''s efficiency gains in-house, commoditizing the core IP.'
    - Evidence that Velaura's libraries meaningfully outperform best-achievable in-house EDA-tool results (e.g., an independent benchmark) would address this.
  notes: Each anti-thesis argument is paired with a specific, monitorable event that would resolve or reduce it, consistent with this chapter's evidence-sensitive approach.
