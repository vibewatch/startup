- id: TV005
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Threshold
  - Transmission to Thesis
  - Action Implication
  rows:
  - - No named hyperscaler design win
    - 18 months post-Series A (i.e., by roughly February 2028) with no named or independently confirmed customer
    - Directly undermines the core AI-silicon revenue thesis the valuation is built on
    - Downgrade valuation stance from 'unresolved' to 'expensive/avoid' absent other new evidence
  - - Disclosed down round or valuation impairment
    - Any future financing round or MARA SEC filing showing a lower Velaura valuation mark than August 2026's $1B+
    - Directly signals the market itself has repriced the company downward
    - Treat as confirmation of overvaluation risk flagged in this chapter
  - - EDA-vendor or foundry commoditization event
    - Public release of a directly competing low-power IP library by Cadence, Synopsys, TSMC, or Samsung Foundry
    - Undermines Velaura's core differentiation and royalty-rate defensibility
    - Reassess moat durability and probability-weight the bear case higher
  - - Continued legacy-business decline without AI-silicon offset
    - Two or more consecutive quarters of disclosed (or inferred) legacy hardware decline with no AI-silicon revenue disclosure
    - Confirms the base/bear case transition scenario is playing out without the offsetting bull-case revenue
    - Increase weighting toward bear-case capital-exhaustion risk
  - - Key-person departure
    - Departure of CEO Rajiv Khemani or CDO Manu Gulati
    - Removes the primary execution capability the market has underwritten
    - Treat as a high-severity negative valuation trigger requiring immediate reassessment
  notes: Thresholds are author-synthesized, source-grounded monitorable events; none is a company-disclosed formal covenant or milestone.
  claimRefs:
  - CV034
  - CV035
  - CV023
  - CV025
- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing Evidence
  - Why It Matters
  - Owner / Diligence Path
  rows:
  - - Revenue and royalty rate
    - Any disclosed AI-silicon revenue figure or royalty percentage
    - Without this, no valuation multiple can be computed against any comparable, public or private
    - Request directly from Velaura AI management/IR under NDA
  - - Named hyperscaler customer
    - At least one confirmed, named hyperscaler design win or customer reference
    - This is the single most consequential piece of evidence missing across this entire report
    - Request customer references from Velaura or seek independent hyperscaler-side confirmation
  - - Cap table and preference terms
    - Liquidation preference stack, anti-dilution terms, option pool sizing
    - Needed to determine whether the $1B+ headline reflects common-equity value or preferred-stock structuring
    - Request a capitalization table under NDA
  - - Cash position and runway
    - Current cash-on-hand, monthly burn, and runway post-Series A
    - Determines financing dependency and probability of a near-term additional raise
    - Request a recent cash-flow statement or bank-balance attestation
  - - Independent technical benchmark
    - Any third-party validation of the claimed 2-4x MATMUL efficiency improvement
    - Underpins whether the core technical differentiation is durable versus EDA-tool commoditization risk
    - Commission or track an independent semiconductor benchmark publication
  notes: These five items are the highest-leverage diligence asks because each one, if resolved, would materially change this chapter's recommendation confidence.
  claimRefs:
  - CV038
