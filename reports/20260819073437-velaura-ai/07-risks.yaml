  claims:
  - id: CR001
    statement: As of January 15, 2026, US export control policy for advanced computing chips shifted from a presumption of denial to case-by-case license review for exports to China and Macau, adding compliance
      conditions (US supply certification, foundry-diversion certification, third-party testing) relevant to any semiconductor IP company with foundry exposure.
    type: third-party-reported
    topic: regulatory-risk
    sourceRefs:
    - SR001
    - SR002
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR001
  - id: CR002
    statement: Velaura AI's exposure to US-China semiconductor export control rules is not directly addressed in any company disclosure reviewed; the company's foundry partners (e.g., TSMC, Samsung Foundry)
      and any China-linked customers or supply chain would be the transmission channel for this regulatory risk.
    type: inferred
    topic: regulatory-risk
    sourceRefs:
    - SR001
    - SR002
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR002
  - id: CR003
    statement: AI-related patent litigation has surged industry-wide, with over a thousand AI-related patent lawsuits filed globally in the past five years per legal-industry analysis, indicating elevated
      IP litigation risk for any AI-silicon IP licensor including Velaura.
    type: third-party-reported
    topic: legal-risk
    sourceRefs:
    - SR004
    - SR003
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR003
  - id: CR004
    statement: No public record identifies any lawsuit, litigation, or patent infringement claim specifically naming Auradine or Velaura AI as of the run date.
    type: open-question
    topic: legal-risk
    sourceRefs:
    - SR003
    - SR004
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR004
  - id: CR005
    statement: Velaura's own materials describe its low-power compute technology as 'patented' without disclosing a specific patent number, creating both an IP-strength verification gap and a converse risk
      that an unverified patent claim could itself invite scrutiny or a future dispute.
    type: inferred
    topic: legal-risk
    sourceRefs:
    - SR028
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR005
  - id: CR006
    statement: MARA Holdings' SEC 10-K risk-factors disclosure practice (Item 1A) provides a template for the kind of related-party and investment risk language that would be expected in any Velaura-linked
      public filing, though Velaura itself is private and not subject to equivalent disclosure requirements.
    type: inferred
    topic: regulatory-risk
    sourceRefs:
    - SR005
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR006
  - id: CR007
    statement: MARA's SEC 10-Q filing independently confirms a related-party relationship with Velaura (investment, board seat, and historical product-purchase advances), which is itself a disclosed governance
      and concentration risk factor for MARA and, by extension, a data point on Velaura's customer/investor concentration.
    type: third-party-reported
    topic: concentration-risk
    sourceRefs:
    - SR006
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR007
  - id: CR008
    statement: No independent registry confirmation (e.g., Delaware Division of Corporations entity search) of Velaura AI, Inc.'s current legal entity status was completed in this chapter's research beyond
      the company's own privacy notice; the Delaware search tool requires a direct, fee-gated query to confirm entity status definitively.
    type: open-question
    topic: regulatory-risk
    sourceRefs:
    - SR007
    - SR026
    confidence: low
    freshness: current
    answersQuestionRefs:
    - QR008
  - id: CR009
    statement: Heise Online's independent reporting confirms Velaura's CEO declined to name any of the three hyperscaler cloud providers the company claims to be engaged with, even when directly asked by
      Reuters, an adverse disclosure-transparency signal relevant to diligence confidence in the company's traction claims.
    type: third-party-reported
    topic: disclosure-risk
    sourceRefs:
    - SR009
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR009
  - id: CR010
    statement: TechBooky's independent coverage explicitly cautions that a unicorn valuation does not guarantee commercial adoption, and that chip startups require deep engineering, manufacturing partnerships,
      and customer validation to convert design wins into revenue.
    type: third-party-reported
    topic: execution-risk
    sourceRefs:
    - SR010
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR010
  - id: CR011
    statement: Untether AI, a directly comparable low-power AI inference chip startup, shut down in June 2025 and filed for bankruptcy in October 2025 with liabilities exceeding $128 million, an adverse
      sector precedent illustrating that even technically credible low-power AI chip startups can fail commercially.
    type: third-party-reported
    topic: sector-precedent-risk
    sourceRefs:
    - SR011
    - SR012
    confidence: high
    freshness: historical
    answersQuestionRefs:
    - QR011
  - id: CR012
    statement: Untether AI's failure was attributed in part to fundraising difficulty amid NVIDIA's market dominance and broader economic headwinds including US tech tariffs, risk factors that could similarly
      affect Velaura given its comparable market position.
    type: third-party-reported
