- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold / Event
  - Action Implication
  rows:
  - - Zero named AI-silicon customers
    - Announcement (or confirmed absence) of a named hyperscaler design win
    - No named design win within 12-18 months of the August 2026 Series A close
    - Reassess valuation thesis; treat continued opacity as a negative signal on commercial conversion
  - - Commoditization by EDA vendors/foundries
    - Cadence, Synopsys, or a foundry partner releases a directly competing low-power IP library or design kit
    - Any public announcement of an equivalent, freely licensable low-power library
    - Reassess Velaura's differentiation and royalty-rate defensibility
  - - Legacy hardware business decline
    - Quarterly Teraflux/legacy hardware bookings trend
    - Continued year-over-year decline in disclosed bookings with no offsetting AI-silicon revenue disclosed
    - Treat as confirmation of a difficult, unfunded transition period
  - - MARA relationship deterioration
    - MARA's future 10-Q/10-K disclosures regarding its Velaura investment and purchase activity
    - MARA reduces its stake, exits its board seat, or discloses an impairment on its Velaura investment
    - Treat as a material adverse signal given MARA's outsized role in current customer/investor evidence
  - - Capital adequacy
    - Future funding announcement or disclosed cash position
    - Velaura raises another round within 12-18 months without a disclosed revenue inflection
    - Signal that royalty revenue is not yet materializing as expected; reassess capital efficiency
  - - Key-person continuity
    - Any executive departure announcement (Khemani or Gulati specifically)
    - Departure of either co-founder
    - Treat as a high-severity negative trigger given concentrated key-person dependence
  notes: Thresholds and events are the author's synthesis of monitorable, source-grounded triggers; none is a company-disclosed formal milestone.
