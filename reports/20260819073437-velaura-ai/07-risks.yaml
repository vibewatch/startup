- id: financial-people-execution-risk
  title: Financial/Model Risk and People/Execution Risk
  body: No public source discloses Velaura's cash-on-hand, monthly burn, or runway following its August 2026 Series A, nor the measurement methodology underlying its royalty revenue model - a financial/model
    risk compounded by the fact that Groq, a well-funded independent AI-silicon competitor, needed a second large capital raise in the same month despite a prior $750 million round, illustrating persistent
    capital intensity across the sector. This chapter finds no evidence of fraud, restatement, or accounting irregularity at Velaura or in MARA's disclosure of its Velaura investment; the ASC 321 fair-value
    treatment MARA applies follows standard equity-investment accounting practice, a mitigating signal on financial-integrity risk specifically. On people/execution risk, Velaura's public narrative concentrates
    heavily on CEO Rajiv Khemani and CDO Manu Gulati, with minimal independent biographical detail on the rest of the executive bench, creating meaningful key-person dependence; no executive departure or
    resignation was identified in 2025-2026, a mitigating continuity signal, and board oversight (including Intel CEO Lip-Bu Tan and MARA CEO Fred Thiel) provides governance credibility that partially offsets
    operating-level key-person concentration.
  claimRefs:
  - CR019
  - CR027
  - CR035
  - CR038
  - CR024
  - CR025
  - CR037
  - CR018
  tableRefs:
  - TR004
- id: mitigations-kill-criteria
  title: Mitigations, Monitoring Indicators, and Thesis-Break Triggers
  body: 'Velaura''s strongest available mitigant against pure execution-risk skepticism is its 30 million-plus ASIC production history, which addresses manufacturing-yield concerns but does not resolve
    the customer-concentration, disclosure, or commoditization risks identified separately in this chapter. This chapter defines six monitorable thesis-break triggers diligence teams should track: the absence
    of a named hyperscaler design win within 12-18 months of the Series A close; any competing low-power IP library release from a major EDA vendor or foundry partner; continued year-over-year decline in
    legacy hardware bookings without offsetting AI-silicon revenue; any deterioration in MARA''s disclosed investment or purchasing relationship; another capital raise within 12-18 months without a disclosed
    revenue inflection; and departure of either founding co-founder. None of these triggers has fired as of the run date, but each represents a specific, source-grounded event diligence should monitor rather
    than treating the current valuation as a settled outcome.'
