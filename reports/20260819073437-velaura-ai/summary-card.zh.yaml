  topStrengths:
    - 超低功耗硅设计方法已在 30M+ 出货 ASIC 上通过量产验证；在早期 AI 硅竞争者中，这种规模证据很少见。
    - 管理层和董事会履历可信且经验充足：团队有 Apple、NVIDIA、Google、Qualcomm、Marvell 背景，Intel CEO Lip-Bu Tan 与 MARA CEO Fred Thiel 也在董事会。
    - 宏观顺风明确：AI 数据中心电力需求到 2030 年几乎翻倍，美国存在 9.3 GW 电力缺口，直接抬高 performance-per-watt 技术的价值。
    - MARA Holdings 在 SEC 10-Q 中确认公允价值收益，为估值上调提供独立且经审计的佐证，不只是依赖公司新闻稿。
  topRisks:
    - 支撑 $1B+ 估值的 Titan Core AI 硅业务没有任何具名客户；所有牵引力说法都可追溯到公司表述，再由媒体转述。
    - 公司任何业务线都未披露收入、royalty rate、毛利率、现金余额、烧钱速度或现金跑道，估值无法与可比公司校准。
    - 商业 EDA 工具带来商品化风险：Cadence Cerebrus、Synopsys DSO.ai 可能让超大规模云厂商在内部复刻 Velaura 的效率提升。
    - Velaura 证据最充分的客户关系 MARA 同时也是关联方投资人；其可触达的传统硬件市场（Bitcoin 矿机）又在行业转向 AI/HPC colocation 时结构性收缩。
    - AI 硅可比公司在一年内波动极大：Groq 估值约下调 50%，Untether AI 破产，Cerebras 计划约 $56B IPO；今天的估值标记未必能守住。
  unresolvedGaps:
    - Velaura AI 硅业务的实际收入、royalty rate 与 royalty 计量方法。
    - 至少一个具名且经独立确认的 Titan Core 超大规模云厂商、机器人或边缘设备客户。
    - 2026 年 8 月 Series A 后的当前现金余额、月度烧钱速度与现金跑道。
    - 可调和的员工数（公开估计从 62 人到 100-150 人不等）。
    - 对所称 2-4x MATMUL performance-per-watt 提升的独立同行评议基准。
    - 股权结构表细节：清算优先权堆叠、反稀释条款与期权池规模。
