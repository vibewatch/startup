company:
  name: Velaura AI
chapter:
  number: 2
  title: Market Analysis
  summary: Velaura AI's addressable market spans hyperscale data centers, Physical/Embodied AI, and Edge AI, but no independently sized SAM/SOM exists for its specific royalty-licensing niche; published
    market-sizing estimates for adjacent categories diverge by 2-7x across publishers, even as power/electricity constraints (950 TWh by 2030, a 9.3 GW US shortfall) and $600-725B in 2026 hyperscaler capex
    strongly favor the underlying power-efficiency thesis.
sections:
- id: market-boundary-definition
  title: Market Boundary and Definition
  body: 'Velaura AI does not sell a market-ready chip; it licenses ultra-low-power silicon design IP that other companies integrate into their own AI accelerators. That structural fact means the relevant
    market boundary is not simply ''the AI chip market'' but the subset of AI-silicon design decisions where a third-party power-efficiency IP vendor can plausibly be licensed in: hyperscale data-center
    accelerators, Physical and Embodied AI systems (robots, drones, autonomous machines), and Edge AI devices, per Velaura''s own market framing. The data center AI chip market itself is tracked narrowly
    by some publishers (SemiconductorInsight sizes it at $13.8 billion in 2026, reaching $45.2 billion by 2034) and far more broadly by others once merchant GPUs, custom ASICs, memory, and networking silicon
    are included (Deloitte and Gartner both place the overall AI semiconductor market at $300-500 billion in 2026, while IDC''s narrower ''intelligent datacenter'' segment sits at $281 billion within a
    $477.1 billion data-center-semiconductor total). NVIDIA alone captured roughly 87.4% of Q1 2026 merchant data-center AI chip revenue among NVIDIA, AMD, and Intel, underscoring that most of this headline
    market value is currently captured by GPU vendors rather than IP licensors like Velaura. Explicitly excluded from Velaura''s addressable market are general-purpose CPU/server silicon, non-AI networking
    chips, and the finished-chip revenue hyperscalers capture internally when they design their own custom ASICs (Google TPU, AWS Trainium, Microsoft Maia, Meta MTIA) - though those same internal programs
    are potential IP-licensing customers for Velaura''s underlying power-efficiency technology rather than direct substitutes for it.'
  claimRefs:
  - CM025
  - CM001
  - CM002
  - CM004
  - CM019
  tableRefs:
  - TM001
- id: market-sizing-lenses
  title: TAM/SAM/SOM and Contradictory Sizing Lenses
  body: 'No single, evidence-constrained TAM/SAM/SOM figure exists for Velaura''s specific niche of ultra-low-power AI silicon IP licensing; every available public figure describes an adjacent, broader
    category. On the data-center side, three independent 2026 methodologies diverge by nearly 2x even before scope differences are considered: IDC''s segment-level $281 billion ''intelligent datacenter''
    figure, an implied ~$390 billion AI share of Gartner''s $1.3 trillion total semiconductor forecast, and Deloitte''s revised ~$500 billion full-year estimate. On the Physical AI side - relevant to Velaura''s
    robotics/embodied-AI ambitions - three publishers'' 2026 estimates span more than a 7x range ($0.89 billion per MarketsandMarkets'' narrower 2025 base, $6.93 billion per SNS Insider, and $7.11 billion
    per Mordor Intelligence), reflecting materially different definitions of what counts as ''physical AI'' hardware and software rather than a converging consensus. Because Velaura''s revenue model is
    royalty-based (a license fee plus a share of measured power savings) rather than direct chip sales, even a well-defined SAM for the underlying accelerator market would overstate Velaura''s own obtainable
    revenue; the analytically correct SOM would be measured in royalty dollars per XPU shipped, and no public source provides a bottom-up estimate of that figure. This chapter therefore preserves the sizing
    contradiction explicitly rather than collapsing it into one headline number, and records the missing SOM estimate as a named evidence gap.'
  claimRefs:
  - CM002
  - CM008
  - CM005
  - CM006
  - CM007
  - CM027
  - CM028
