- id: buyer-segmentation-adoption-path
  title: Buyer Segmentation and Adoption Path
  body: 'Velaura''s three target buyer segments have structurally different budget owners and adoption triggers. In hyperscale data centers, the buyer is the cloud infrastructure/silicon team, the payer
    is the hyperscaler capex budget - which is projected at $600-725 billion in 2026 for the Big Five hyperscalers, with roughly 75% directed at AI infrastructure - and the adoption trigger is power/cooling
    constraints on data-center expansion. In Physical and Embodied AI, the buyer is robotics/drone hardware engineering, the payer is OEM R&D and bill-of-materials budget, and the adoption trigger is battery-life
    and thermal-envelope requirements for always-on autonomous systems; on-device compute already accounts for 71.43% of physical-AI deployments, directly aligned with Velaura''s on-chip efficiency pitch.
    In Edge AI, device OEM procurement teams buy chips to extend battery life and enable local inference. A fourth, cross-cutting sub-segment - internal hyperscaler custom-ASIC programs such as Google TPU,
    AWS Trainium, Microsoft Maia, and Meta MTIA - draws on the same capex budget as the broader data-center segment but represents a distinct adoption path: these teams already design their own silicon
    and would license Velaura''s IP specifically to close a performance-per-watt gap versus merchant GPU competitors, not to replace an existing chip-purchase decision. Broadcom and Marvell, which together
    provide ASIC design services behind more than 80% of hyperscaler custom silicon, are a further complication: they could be channel partners that embed Velaura''s IP into their design-service offerings,
    or competitors offering their own power-optimization capabilities.'
  claimRefs:
  - CM012
  - CM011
