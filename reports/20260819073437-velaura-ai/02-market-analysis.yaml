- id: sizing-gaps-contradictions
  title: Diligence Gaps and Preserved Contradictions
  body: This chapter deliberately preserves two categories of open item rather than resolving them with a single confident number. First, no public source sizes Velaura's specific royalty-licensing SOM;
    every available figure describes a broader adjacent market (data-center AI chips, physical AI hardware, or overall AI semiconductors), and blending them (as in the illustrative SAM figure in this chapter's
    market-sizing pyramid) is explicitly flagged as an approximation rather than a verified estimate. Second, published physical-AI market-size estimates for materially the same time window diverge by more
    than 7x across three independent, reputable-tier publishers, which should be read as a signal that 'physical AI' is not yet a standardized market category rather than as evidence that any one estimate
    is wrong. Diligence should treat any single-number TAM claim from Velaura's own materials or from any one third-party report with corresponding skepticism until a bottom-up, source-triangulated estimate
    is available.
  claimRefs:
  - CM028
  - CM008
  - CM027
