  title: Key-person dependence on the Khemani-Gulati technical duo
  body: Nearly all public narrative and investor commentary concentrates on CEO Rajiv Khemani and CDO Manu Gulati; diligence should assess succession planning and retention terms given how much of the equity
    story rests on this pairing's continuity from Auradine into Velaura AI.
