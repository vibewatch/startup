  evidenceGaps:
  - type: missing-source
    severity: material
    topic: customers
    missingEvidence: Named identities of the hyperscaler customers Velaura AI claims to be engaged with.
    whyItMatters: Customer concentration and named commercial validation materially affect revenue durability and royalty-model credibility assessments in later chapters.
    diligencePath: Request customer references directly from Velaura AI management or seek hyperscaler-side confirmation via procurement/supply-chain disclosures.
    relatedQuestionRefs:
    - QO017
    - QO019
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: Current employee headcount for Velaura AI.
    whyItMatters: Headcount is a standard scale indicator needed to assess capital efficiency and organizational readiness for the Series A-funded expansion plan.
    diligencePath: Triangulate via LinkedIn employee-count search or request the figure directly in a management interview.
    relatedQuestionRefs:
    - QO032
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Revenue or run-rate specific to Velaura AI's AI-compute licensing business, separate from legacy Teraflux bitcoin-mining bookings.
    whyItMatters: Without this figure, later financial-modeling and valuation work cannot distinguish new AI-era commercial traction from residual bitcoin-mining hardware revenue.
    diligencePath: Request disclosure of AI-segment bookings or licensing revenue under NDA, or monitor for future funding-round disclosures.
    relatedQuestionRefs:
    - QO034
  - type: conflicting-data
    severity: minor
    topic: verification-gap
    missingEvidence: Independent, peer-reviewed or third-party lab benchmark of Titan Core's claimed 2-4x performance-per-watt improvement.
    whyItMatters: All performance figures currently trace back to company-authored press releases; without independent validation, the magnitude of the claimed efficiency gain cannot be fully corroborated.
    diligencePath: Track independent semiconductor-benchmark publications (e.g., MLPerf-style efficiency benchmarks) or commission a third-party technical audit.
    relatedQuestionRefs:
    - QO035
  - type: conflicting-data
    severity: minor
    topic: business-model-comparison
    missingEvidence: A structured, sourced comparison of Velaura AI's royalty-plus-license model against Arm's historical IP-licensing business (rate structure, measurement methodology, audit rights).
    whyItMatters: Understanding structural similarities and differences versus the Arm precedent affects how durable and comparable Velaura's projected royalty economics are for valuation purposes.
    diligencePath: Commission a side-by-side deal-terms comparison once Velaura discloses specific royalty-rate or measurement-methodology details, or request them under NDA.
    relatedQuestionRefs:
    - QO033
