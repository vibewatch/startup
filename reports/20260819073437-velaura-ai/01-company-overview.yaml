- id: cover-metrics-gaps
  title: Cover Metrics and Diligence Gaps
  body: 'Several cover metrics that later chapters will rely on remain undisclosed by the company and unavailable in public sources as of the run date: current headcount, revenue or run-rate specific to
    the AI compute business (as distinct from legacy Teraflux bookings), and a named customer list. This chapter records those as explicit nulls rather than guesses, with concrete diligence paths - for
    example, triangulating headcount from professional-network employee counts or requesting disclosure directly in a management interview, and requesting audited or third-party-verified power-savings benchmarks
    before relying on the 2-4x claim in valuation work. The unresolved and partial-status research questions in this chapter''s evidence ledger (customer names, headcount, AI-specific revenue, and independent
    benchmark validation) should be treated as open items that later chapters (financials, customers, risks, valuation) must either close with new evidence or carry forward as named gaps.'
