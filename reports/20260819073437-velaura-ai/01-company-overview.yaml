- id: funding-investors
  title: Funding History, Valuation, and Investors
  body: Velaura AI's capitalization history spans four disclosed institutional rounds under two corporate identities. As Auradine, the company raised an $81 million Series A in May 2023 (led by Celesta
    Capital and Mayfield) to launch its Teraflux bitcoin-mining ASIC line, an $80 million oversubscribed Series B in April 2024 that also produced $80 million in customer bookings, and a $153 million Series
    C in April 2025 led by StepStone Group with Maverick Silicon, Premji Invest, Samsung Catalyst Fund, Qualcomm Ventures, Mayfield, and MARA participating, explicitly to expand beyond bitcoin mining into
    blockchain and AI infrastructure. On August 18, 2026, newly rebranded Velaura AI announced a $110 million Series A round led by Seligman Ventures, with new investors Capricorn Investment Group and Prosperity7
    Ventures joining repeat backers Mayfield, Maverick Silicon, MARA, Premji Invest, Samsung Catalyst Fund, and StepStone Group; the round pushed Velaura's valuation above $1 billion, achieving unicorn
    status. Cumulative disclosed capital raised across all four rounds exceeds $424 million, though no public source has audited or reconciled this total. MARA's dual role as both a repeat financial investor
    and a historical customer for Teraflux mining hardware is a governance and independence consideration worth separate diligence. Seligman Ventures itself is a newly launched $500 million venture vehicle
    of Seligman Investments (founded November 2025), and this Series A marks the firm's first disclosed investment in Physical AI per Managing Partner Umesh Padval.
