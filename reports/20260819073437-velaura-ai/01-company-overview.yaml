- id: traction-deployment-adverse
  title: Traction, Deployment Scale, and Adverse Signals
  body: 'Velaura AI''s central traction claim is that its ultra-low-power design methodology is already proven at scale: more than 30 million ASICs manufactured on leading-edge process nodes are cited across
    the company''s own Titan Core launch release and its Series A announcement alike, and this volume is used to substantiate manufacturing-yield and reliability claims for the newer AI-focused product.
    On the customer side, the company says it has ongoing engagements with three of the four largest cloud providers; CEO Rajiv Khemani reportedly confirmed this to Reuters per Heise Online''s coverage,
    but he declined to name any of the hyperscalers involved, and no customer has independently confirmed a Velaura or Titan Core relationship. This lack of named-customer verification, combined with the
    absence of any independent, peer-reviewed benchmark of the claimed 2-4x performance-per-watt improvement, is the most consequential evidence gap identified in this chapter. Trade press coverage is broadly
    positive on the underlying power-constraint thesis but flags real execution risk: TechBooky explicitly cautions that ''a valuation above $1 billion does not guarantee commercial adoption,'' and notes
    that chip startups require deep engineering, manufacturing partnerships, and customer validation to convert design wins into recurring royalty revenue. Independent analyst Patrick Moorhead of Moor Insights
    & Strategy has offered a more constructive read, saying Velaura''s approach ''has the potential'' to reduce total cost of ownership and ease thermal limits for customers, a hedged endorsement rather
    than independent verification.'
