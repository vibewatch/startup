- id: leadership-governance
  title: Leadership, Founders, and Governance
  body: 'Rajiv Khemani, co-founder and CEO, is the public face of Velaura AI across every funding and product announcement reviewed for this chapter, and Mayfield''s Navin Chaddha describes the 2026 round
    as his firm''s fourth partnership with Khemani specifically. Manu Gulati serves as Chief Development Officer and is named alongside Khemani as the technical core of the leadership team; Mayfield notes
    this is its second partnership with Gulati. Beyond the founding duo, Velaura''s Team page lists Sanjay Gupta (President, Strategy & GTM), YJ Kim (President, Products), Tim Vehling (VP, Product), Brian
    Campbell (VP of Engineering Operations), and Atul Dhablania (Chief Systems Operations Officer), rounding out a leadership bench the company and press coverage describe as combining alumni of Apple,
    NVIDIA, Google, Qualcomm, and Marvell. Governance is anchored by a board that mixes venture and strategic interests: Navin Chaddha (Mayfield), Umesh Padval (Seligman Ventures, which holds the lead Series
    A board seat), Dipender Saluja (Capricorn Investment Group), Fred Thiel (CEO, MARA - both an investor and a former Teraflux hardware customer), Sriram Viswanathan (Celesta Capital), and Intel CEO Lip-Bu
    Tan, who sits on the board via Walden International and lends significant semiconductor-industry credibility. Two academic/technical advisors, Aditya Grover (CTO, Inception AI; UCLA professor) and Magnus
    Egerstedt (Provost, UNC Chapel Hill; roboticist), extend the company''s Physical AI and machine-learning expertise. The concentration of public commentary on Khemani and Gulati, and the near-total absence
    of independent biographical detail on the rest of the executive bench, signals meaningful key-person dependence on the founding duo.'
