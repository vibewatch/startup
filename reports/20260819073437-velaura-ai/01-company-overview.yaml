- calloutType: strength
  title: Production-proven technology reduces first-chip execution risk
  body: Unlike most first-time AI-silicon entrants, Velaura's underlying ultra-low-power design methodology already ships in 30M+ production ASICs, giving hyperscaler partners a real manufacturing-yield
    and reliability track record to evaluate rather than a paper design.
  claimRefs:
  - CO006
  - CO018
- calloutType: risk
  title: Undisclosed customers and unverified benchmarks are the key diligence gap
  body: Velaura has not named any of the three hyperscalers it claims to be engaged with, and no independent, peer-reviewed benchmark of its 2-4x performance-per-watt claim exists in public sources; both
    facts should be verified directly before underwriting valuation or royalty-revenue assumptions.
  claimRefs:
  - CO017
  - CO019
  - CO034
