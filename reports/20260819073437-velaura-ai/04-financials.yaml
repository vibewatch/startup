- id: cost-structure-unit-economics
  title: Cost Structure and Unit Economics
  body: 'No source reviewed discloses Velaura''s actual gross margin, cost-of-goods structure, R&D spend, or customer acquisition cost. Industry benchmarks provide only a rough comparable frame: fabless
    semiconductor companies typically report gross margins of 50-65% (with leaders like NVIDIA exceeding 70%), and early-stage fabless startups typically spend 20-40% of revenue on R&D (spiking above 50%
    pre-revenue) while burning $500,000 to $2,000,000 per month, with 12-18 months of runway considered prudent. None of these figures is Velaura-specific, and applying them directly risks understating
    the unique economics of a royalty-based IP licensor versus a unit-sale fabless chip vendor: Velaura''s model requires far less manufacturing capex and inventory risk than a typical fabless comparable,
    since it is not the party paying for wafer starts, but it also means its revenue per design win is a small fraction of the underlying chip''s total value, similar to Arm''s historically estimated 1-2%-of-ASP
    royalty rate. The only independently corroborated cash-flow-adjacent data point available for any part of Velaura''s business is MARA''s SEC-filed disclosure of its product-purchase advances and investment
    carrying value, which relates to the legacy Teraflux hardware business rather than the new Titan Core IP licensing model this valuation thesis primarily rests on.'
  claimRefs:
  - CI011
  - CI012
  - CI013
  - CI025
  - CI027
  - CI029
  - CI035
  tableRefs:
  - TI003
  figureRefs:
  - FI002
- id: public-traction-headcount
  title: Public Traction and Headcount
  body: 'Velaura AI''s only publicly disclosed traction figure with a specific dollar amount is the $80 million in customer bookings Auradine reported alongside its April 2024 Series B raise, a figure that
    predates the AI pivot by roughly two years and says nothing about Titan Core-specific traction. Headcount estimates diverge meaningfully across sources: Tracxn''s tracked employee-count trend shows
    62 employees as of March 26, 2026, while other analyst databases (PitchBook, AI Market Watch) suggest a broader 100-150 employee range, and LinkedIn-style company-size bands show 101-500 employees.
    None of these figures is company-confirmed, and the spread itself (roughly 2-3x between the low and high estimates) is a useful signal that headcount tracking for a recently rebranded private company
    is unreliable without a direct company disclosure. No source discloses current ARR, run-rate revenue, active customer count with names, or any AI-specific bookings figure post-pivot.'
  claimRefs:
  - CI014
  - CI015
  - CI016
  - CI017
  - CI018
  tableRefs: []
  figureRefs:
  - FI003
- id: capital-adequacy-financing
  title: Capital Adequacy and Financing Dependency
  body: 'Velaura AI/Auradine''s cumulative disclosed equity capital raised across four rounds - the $81 million Series A (2023), $80 million Series B (2024), $153 million Series C (2025), and $110 million
    2026 Series A - totals approximately $424 million, though this is a simple sum of separately announced figures rather than an audited or company-confirmed total. The August 2026 round''s stated use
    of funds is to expand engineering and customer-facing teams and deepen strategic partnerships, per both the company''s own release and lead investor commentary from Mayfield, but no source discloses
    current cash-on-hand, monthly burn, or resulting runway. No source discloses any debt facility or project-finance arrangement separate from the disclosed equity rounds. The single independently filed
    (SEC-sourced) financial data point available for any part of Velaura''s business is MARA Holdings'' related-party disclosure: an $85.4 million investment carrying value as of March 31, 2026, one board
    seat, and $11.9 million plus $2.7 million in ASC 321 fair-value gains recorded when Velaura''s later financing rounds established a higher observable price for MARA''s existing preferred and common
    stock holdings - itself indirect evidence that Velaura''s valuation has risen across financing rounds, corroborating the company''s own unicorn-valuation claim from an independent, audited source rather
    than press coverage alone.'
  claimRefs:
  - CI033
  - CI010
  - CI024
  - CI034
  - CI001
  - CI002
  - CI003
  - CI004
  - CI019
