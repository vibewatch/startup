callouts:
- calloutType: risk
  title: Royalty measurement methodology is completely undisclosed
  body: Velaura's entire AI-silicon revenue model depends on measuring a customer's 'power savings achieved,' but no source discloses how that measurement is defined, verified, or audited, creating both
    a revenue-recognition risk and a customer-trust risk.
  claimRefs:
  - CI009
  - CI030
- calloutType: strength
  title: MARA's SEC filing is independent, audited corroboration of Velaura's rising valuation
  body: MARA's 10-Q discloses an $85.4 million investment carrying value and $14.6 million combined fair-value gains recorded under ASC 321 when later Velaura financing rounds established a higher observable
    price - real, audited evidence supporting the company's unicorn-valuation narrative from a source independent of Velaura's own press releases.
  claimRefs:
  - CI001
  - CI004
- calloutType: risk
  title: No public metric supports assessing burn, runway, or margin
  body: Cash-on-hand, monthly burn, runway, gross margin, and R&D intensity are all undisclosed; only industry-comparable benchmarks (50-65% fabless gross margin, $500K-$2M/month typical burn) are available
    as a rough frame, not Velaura-specific figures.
  claimRefs:
  - CI011
  - CI012
  - CI013
