  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：直接、在位、相邻与替代
        blocks:
          - type: paragraph
            body: >-
              Velaura AI 面对的不是一个边界清晰的同业集合，而是四类不同竞争者。在直接低功耗 AI 芯片同业中，过去一年行业急剧整合：近存算竞争者 Untether AI 于 June 2025 关闭，并在
              October 2025 申请破产，负债超过 $128 million，其工程团队被 AMD 收购式招揽；拥有约 100 家客户的边缘 AI 芯片厂商 Hailo 于 July 2026 被 Microchip
              Technology 收购；Mythic 则在 December 2025 完成 $125 million Series D 前，经历了一次完整的架构和领导层重组。Groq
              展示了可比公司重估速度有多快：December 2025，一笔据称 $20 billion 的 NVIDIA 交易吸收了其创始技术团队和 IP 后，Groq 完全转向新的商业模式，并以 $3.5 billion
              估值融入新资本，低于一年前的 $6.9 billion。相比之下，Cerebras 于 May 2026 以约 $56 billion 完全稀释估值上市，验证了该板块的上行空间。NVIDIA 和 AMD
              仍是主导在位者，并与 Intel 一起拿走商用数据中心 AI 芯片收入的绝大多数（仅 NVIDIA 约 87.4%）。但结构上最重要的替代品，是超大规模云厂商内部自建：Google TPU、AWS
              Trainium、Microsoft Maia、Meta MTIA 等自有定制硅项目出货增速接近商用 GPU 的三倍；这些团队原则上可以用 Cadence 或 Synopsys 的商业 EDA
              工具在内部实现类似能效提升，而不是授权 Velaura IP。
