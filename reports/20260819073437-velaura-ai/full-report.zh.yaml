      - number: '5.3'
        title: 成熟度、证据强度与跨板块差异化
        blocks:
          - type: paragraph
            body: >-
              Velaura 三个目标板块的证据强度差异很大。数据中心产品线证据最充分：底层低电压 IP 和工具流已在 30 million 多颗量产 ASIC 中验证（主要来自历史 Teraflux 比特币挖矿业务），给
              Titan Core 提供了真实制造良率和可靠性基础；Moor Insights & Strategy 的独立分析师 Patrick Moorhead
              对此给出正面评价，称该路径有潜力降低客户总拥有成本并缓解热约束。相比之下，Physical AI 和边缘 AI 板块仍停留在营销阶段：Velaura 的 Physical AI 页面和 Solutions
              页面都没有点名具体机器人或边缘设备客户，没有披露已部署设备数量，也没有提供区别于数据中心叙事的技术规格。历史 Teraflux 硬件线则在三类业务中拥有最强的具名客户证据（MARA），并披露了技术规格（9.8
              J/TH 效率、最高 600 TH/s、4nm 工艺、多冷却方式版本）；不过，它比 Titan Core 当前目标的 3nm/2nm 节点落后一代工艺，2026 AI
              转型后这条线的战略优先级也不清楚。本章审阅的任何来源中，都不存在对具体 2-4x MATMUL 效率主张或 $100 million/year 节省估计的独立、同行评审基准。
