            body: >-
              本章审阅来源没有披露 Velaura 的实际毛利率、销货成本结构、R&D 支出或获客成本。行业基准只能提供粗略可比框架：无晶圆厂半导体公司通常报告 50-65% 毛利率（NVIDIA 等领先者超过
              70%），早期无晶圆厂初创公司通常把收入的 20-40% 花在 R&D（收入前阶段可能冲到 50% 以上），同时每月烧掉 $500,000 到 $2,000,000；12-18
              个月现金跑道被视为审慎水平。这些数字都不是 Velaura 专属，直接套用可能低估基于版税的 IP 授权方与按颗销售的无晶圆厂芯片公司之间独特经济性：Velaura 模式所需制造 capex
              和库存风险远低于典型无晶圆厂可比公司，因为它不是为晶圆开工付费的一方；但这也意味着，每个设计定点带来的收入只是底层芯片总价值的一小部分，类似 Arm 历史估计 1-2% of ASP 的版税率。对于
              Velaura 任一业务部分，唯一可独立交叉验证且接近现金流的数据点，是 MARA 在 SEC 文件中披露的产品采购预付款和投资账面价值；这些数据对应历史 Teraflux 硬件业务，而不是本估值逻辑主要依赖的新
