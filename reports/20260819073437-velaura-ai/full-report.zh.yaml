    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              Velaura AI, Inc. 是一家总部位于硅谷的半导体公司，为 AI 计算基础设施开发超低功耗硅和软件技术。公司此前名为 Auradine，是美国比特币挖矿 ASIC 厂商；March 2026 更名为
              Velaura AI，作为转向 AI 计算的战略转型的一部分。Velaura 的旗舰产品 Titan Core 不是独立芯片，而是一套硅设计和 IP 平台：客户提供自有 RTL 处理器设计，Velaura
              则套用自研超高能效电路和物理设计库，在 3nm、2nm 等先进工艺节点交付优化后的、可直接接入的物理版图。公司称，Titan Core 可让 AI 训练和推理中最耗能的矩阵乘法运算每瓦性能提升
              2-4x，折算到典型 1000W 级 GPU 或 XPU 上，最多可节省 500W。Velaura 通过前置授权费加按实际节电量计提的版税变现这套 IP；CEO Rajiv Khemani 明确把这种结构类比为
              Arm 的处理器授权模式。底层低功耗设计方法已经在领先半导体节点的 30 million 多颗量产 ASIC 中得到商业规模验证，给 Velaura 提供了大多数首次进入 AI
              芯片领域的公司没有的真实可靠性和良率记录。公司瞄准三个相邻市场：希望降低电力和冷却成本的超大规模 AI 数据中心、受严格功耗和热预算约束的 Physical 与具身 AI
              系统（机器人、无人机、自主机器），以及需要高能效本地处理的边缘 AI 部署。
