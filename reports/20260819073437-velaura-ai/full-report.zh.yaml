              Velaura AI 唯一公开披露且带具体金额的牵引力数据，是 Auradine 在 April 2024 Series B 融资时同步披露的 $80 million 客户订单；这个数字比 AI
              转型早约两年，无法说明 Titan Core 专属牵引力。员工数估计在来源之间差异明显：Tracxn 跟踪的员工趋势显示，截至 March 26, 2026 为 62
              名员工；其他分析师数据库（PitchBook、AI Market Watch）给出更宽的 100-150 名区间，LinkedIn 式公司规模区间则显示 101-500
              名员工。这些数字没有一个得到公司确认，区间本身（低高估计约差 2-3x）已经是有用信号：一家刚更名的私营公司，如果没有直接披露，员工数跟踪并不可靠。没有来源披露当前
