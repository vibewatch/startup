        title: 财务结论：收入质量、利润率路径与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              截至运行日期，Velaura AI 的财务画像最准确的描述是证据稀薄、但方向上有交叉印证：唯一独立申报数据点（MARA 的 SEC
              披露投资及相关公允价值收益）支持公司估值上行叙事；但所有能让尽调团队评估收入质量、利润率路径或资本效率的经营指标——版税率、毛利率、烧钱速度、现金跑道、ARR、具名客户集中度——都没有披露。行业媒体也独立提示了与该结论直接相关的两项保留：TechBooky
              警告，独角兽估值并不保证商业采用；Heise Online 指出，Velaura 拒绝披露芯片或客户名称，使未来任何版税流需要参照的收入基础本身变得模糊。考虑到同一板块 Groq
              需要第二笔大额融资所释放的资本密集信号，也考虑到 Velaura 的版税经济性更可能类似 Arm 历史上较薄的单颗抽成（约 1-2% of ASP），而不是完整硬件销售利润率，核心财务尽调阻塞点不是
              Velaura 技术是否可行，而是其授权收入能否足够快、也足够透明地规模化，在下一轮融资到来前支撑 $1 billion+ 估值。
