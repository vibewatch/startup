      - number: '3.3'
        title: 切换成本、锁定效应与分发权力
        blocks:
          - type: paragraph
            body: >-
              一旦超大规模云厂商决定把 Velaura 的 Titan Core IP 集成进芯片设计，切换成本可能相当高：先进工艺节点上新硅 IP 模块的 SoC 集成和晶圆厂认证通常需要 12 到 24
              个月，设计定点一旦落地就会形成真实锁定，但也意味着 Velaura 自己的收入确认会比任何已宣布合作晚一年或更久。更广泛 AI 芯片价值链中的分发权力高度集中：Broadcom 与 Marvell 合计支撑
              80% 以上超大规模云厂商定制硅背后的 ASIC 设计服务，因此它们对 Velaura 这类第三方 IP 能否进入某个设计拥有重要影响力——它们可以作为渠道伙伴，把 Velaura
              的库嵌入设计服务，也可以在内部搭建等价功耗优化能力，成为直接竞争者。NVIDIA 应对更广泛定制硅迁移的方式，不是单纯比拼独立芯片性能，而是销售更完整的一体化机柜和系统，并向第三方 ASIC 开放 NVLink
              互连；这条策略如何演化，将决定它是为 Velaura IP 创造新集成机会，还是进一步加深 NVIDIA 生态锁定。
            claimRefs:
              - CP026
              - CP027
              - CP028
