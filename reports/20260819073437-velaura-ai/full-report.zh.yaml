      - number: '3.2'
        title: 能力、定价与商业模式对比
        blocks:
          - type: paragraph
            body: >-
              仅看每瓦性能主张，Velaura 的 2-4x 提升不是该板块最大的标题数字——Mythic 声称其模拟存内计算架构最高可带来 100x 效率提升——但 Velaura 的特殊之处在于，它把效率主张与 30
              million+ 已出货量产 ASIC 绑定在一起；同阶段的 Mythic 或已倒闭的 Untether AI 都拿不出这种规模证明。商业模式在同业之间差异很大：Velaura 及其最接近的结构类比 Arm
              历史处理器授权业务，都是收前置费用再加按使用计提的版税；NVIDIA、AMD、Hailo 和 Mythic 则都直接销售成品硅，捕获完整单颗经济性（也承担完整库存 /
              制造风险），而不是收取版税流。值得注意的是，Arm 自身在 2026 打破 30 年纯 IP 授权路径，开始直接销售成品 AI
              芯片；这说明，即便成熟且成功的版税模式在位者，也可能面临与自己授权客户直接竞争的压力——这对 Velaura 模式是一个值得跟踪的先例风险。披露和独立验证方面，Velaura 相比部分同业处于劣势：Hailo
              在被收购前公开点名约 100 家客户，而 Velaura 没有点名其声称正在合作的三家超大规模云厂商；本章审阅来源中，也不存在 Titan Core 与 Mythic 或 Hailo 架构的独立正面对比基准。
