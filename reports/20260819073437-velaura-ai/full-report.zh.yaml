      - number: '5.2'
        title: 部署、工作流与关键依赖
        blocks:
          - type: paragraph
            body: >-
              超大规模云厂商硅团队若不授权 Titan Core，也可以用 Cadence 的 Cerebrus AI Studio 或 Synopsys 的 DSO.ai 等商业 EDA 工具在内部追求类似能效提升；截至
              2026，这两者都提供 AI 驱动的低功耗设计自动化。因此，Velaura 的价值主张取决于其预构建库和工程专业能力，能否胜过资源充足的内部团队用通用工具能做到的水平。客户一旦启动合作，Velaura
              交付还依赖几项不在其直接控制内的外部条件：客户愿意在 NDA 下分享自有 RTL；先进节点晶圆厂产能（如 TSMC 或 Samsung Foundry 等伙伴）可用于实体实现超低电压设计；Velaura
              自己专门的低电压电路工程团队——规模相对小、难以复制——能够跑通物理设计工具流。值得注意的是，Samsung Catalyst Fund 既是 Velaura 投资人，又是 Samsung
              的晶圆厂关联风险投资臂，这创造了一个合理但未披露的战略晶圆厂关系，值得单独尽调。客户侧，Velaura 自有材料估计典型数据中心每年最多可节省 $100 million 电费；这个数字明确建立在若干假设之上（10
              cents/kWh 电价，以及 100,000 到 250,000 颗芯片下每颗每年约 $433.30），而不是客户特定的实测结果。相比财务章节中完全未披露的版税率方法，公司对这些假设的透明度明显更高。
