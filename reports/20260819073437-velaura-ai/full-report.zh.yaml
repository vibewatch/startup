      - number: '1.3'
        title: 融资历史、估值与投资人
        blocks:
          - type: paragraph
            body: >-
              Velaura AI 的资本化历史横跨两个公司身份下的四轮已披露机构融资。作为 Auradine，公司在 May 2023 完成 $81 million Series A（Celesta Capital 与
              Mayfield 领投），用于推出 Teraflux 比特币挖矿 ASIC 产品线；April 2024 完成超额认购的 $80 million Series B，同时产生 $80 million
              客户订单；April 2025 完成由 StepStone Group 领投的 $153 million Series C，Maverick Silicon、Premji Invest、Samsung
              Catalyst Fund、Qualcomm Ventures、Mayfield 和 MARA 参与，明确用于从比特币挖矿扩展到区块链和 AI 基础设施。August 18, 2026，刚更名的 Velaura
              AI 宣布完成由 Seligman Ventures 领投的 $110 million Series A，新投资人 Capricorn Investment Group 和 Prosperity7
              Ventures 加入，Mayfield、Maverick Silicon、MARA、Premji Invest、Samsung Catalyst Fund 和 StepStone Group
              等老股东继续跟投；该轮把 Velaura 估值推至 $1 billion 以上，使其成为独角兽。四轮累计披露融资超过 $424 million，但没有公开来源审计或调和过这个总额。MARA
              既是重复财务投资人，又曾是 Teraflux 挖矿硬件客户，这种双重身份是治理和独立性上需要单独尽调的事项。Seligman Ventures 本身是 Seligman Investments 的新设 $500
              million 风险投资载体（成立于 November 2025），Managing Partner Umesh Padval 称，本次 Series A 是该机构首笔披露的 Physical AI 投资。
