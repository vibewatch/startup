      - number: '8.4'
        title: 建议、退出就绪度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              本章建议为「观察」（继续研究），置信度为中，风险评级为高，估值立场仍未解决——这不是泛泛的公司质量打分，而是因为支撑有把握、对价格敏感判断所需的收入、版税率和具名客户证据几乎完全缺失。核心估值输入缺失时，选择继续研究而不是虚假精确，符合本章逻辑。退出就绪度完全未经证明：没有披露任何老股交易、要约收购或
              IPO/M&A 时间表；不过，Velaura 的董事会构成（Intel 的 Lip-Bu Tan、MARA 的 Fred Thiel，以及多位经验丰富的风险投资合伙人）提供了治理可信度，水平可比于曾帮助
              Cerebras IPO 和 Groq 走向类似被收购结果的治理基础。按优先级排列，五个尽调问题最能高效化解本章不确定性：(1) 实际收入和版税率；(2) 至少一个具名超大规模云厂商客户引用；(3)
              股权结构表和优先权条款；(4) 当前现金状况和现金跑道；(5) 对所称 2-4x 效率提升的独立技术基准测试。只要解决其中两三项，本章建议很可能就会明确转向买入或回避。
