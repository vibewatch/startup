            body: >-
              Velaura AI/Auradine 四轮已披露股权融资累计为约 $424 million：$81 million Series A（2023）、$80 million Series B（2024）、$153
              million Series C（2025）和 $110 million 2026 Series A；不过这只是把分别公告的数字简单相加，并非经审计或公司确认的总额。公司自有公告和 Mayfield
              领投方评论均称，August 2026
              融资用途是扩充工程团队和面向客户的团队，并深化战略伙伴关系；但没有来源披露当前账上现金、月度烧钱速度或由此得到的现金跑道。没有来源披露任何独立于已披露股权融资的债务额度或项目融资安排。对于 Velaura
              任一业务部分，唯一独立申报（SEC 来源）的财务数据点，是 MARA Holdings 的关联方披露：截至 March 31, 2026，投资账面价值为 $85.4 million，一个董事席位，以及后续
              Velaura 融资轮确定更高可观察价格后，MARA 对现有优先股和普通股持仓按 ASC 321 记录的 $11.9 million 加 $2.7 million 公允价值收益。这本身是间接证据，说明
