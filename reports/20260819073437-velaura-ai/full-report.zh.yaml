      - number: '8.3'
        title: 可比公司集合与乐观 / 基准 / 悲观情景
        blocks:
          - type: paragraph
            body: >-
              本章可比集合里没有任何公司在阶段和商业模式上与 Velaura 精准匹配。最接近版税模式的上市可比公司 Arm Holdings，FY2026 收入 $4.92 billion、市值 $270.57
              billion，对应约 52-55x 市销率；这反映的是 Arm 成熟、多元的规模，而不是可直接迁移到早期授权公司的基准。直接 AI 芯片赛道可比公司在一年内波动极大：Cerebras 2026 年 5 月以约
              $56 billion IPO 验证了该分部的上行空间；Groq 则在一笔据报道 $20 billion NVIDIA 交易吸收其创始团队后，估值从 $6.9 billion 重置到 $3.5
              billion；Untether AI 这家可直接对比的低功耗 AI 芯片创业公司，在仍在运营后约十六个月内破产。即使用典型半导体 IP 授权倍数的保守端（8x revenue）套到 Velaura 的 $1B+
              估值，也意味着需要约 $125 million 年收入才能支撑这个价格——这一数字没有任何公开证据支持。在这个背景下，乐观情景要求至少一家超大规模云厂商接触在 18 个月内转为具名设计定点；基准情景假设按典型
              12-24 个月认证周期逐步、部分转化；悲观情景——考虑到可比集合已展示的波动，这是真实尾部风险——假设没有转化且传统业务继续下滑，可能迫使公司折价融资，甚至更糟。
