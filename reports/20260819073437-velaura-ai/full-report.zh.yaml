  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Velaura AI 的投资逻辑建立在三根支柱上：经量产验证的超低功耗硅 IP（已出货 30 million+ ASIC）、可信的领导层与董事会阵容（包括 Intel CEO Lip-Bu Tan 和 MARA
              CEO Fred Thiel），以及有利的宏观顺风——美国 9.3 GW 电力缺口和 2026 年超大规模云厂商 $600-725 billion AI
              基础设施资本开支——这些因素提高了单位功耗性能技术的理论价值。反向逻辑同样具体：真正支撑估值的 Titan Core AI 芯片业务没有任何具名客户，没有披露任何版税率或收入数字；Heise Online
              的独立报道确认，即使被直接追问，Velaura CEO 也拒绝透露三家声称接触的超大规模云厂商名称。更复杂的是，Arm——Velaura 自己明确拿来对标的商业模式可比公司——在 2026 年打破三十年纯 IP
              授权模式，开始直接销售芯片；这个先例让基于版税的经济模型作为独立模式的长期耐久性受到质疑。本章总体判断是，投资逻辑和反向逻辑都有证据支撑；也正因如此，在现有信息下，不应给出笃定的买入或回避建议。
