        title: 尽调缺口与保留的矛盾
        blocks:
          - type: paragraph
            body: >-
              本章刻意保留两类开放问题，而不是用一个自信数字把它们抹平。第一，没有公开来源测算 Velaura 特定版税授权 SOM；所有可用数字都指向更宽的相邻市场（数据中心 AI 芯片、physical AI 硬件或整体
              AI 半导体），把它们混合使用（如本章市场规模金字塔中的示意 SAM）已明确标记为近似值，而非经验证估计。第二，三家独立且声誉较高的发布方，对实质上同一时间窗口的 physical-AI 市场规模估计相差超过
              7x；这更应被解读为「physical AI」尚未成为标准化市场类别的信号，而不是某一个估计必然错误的证据。在获得自下而上、跨来源三角验证的估计前，尽调应对 Velaura 自有材料或任何单一第三方报告中的单点
              TAM 主张保持相应怀疑。
