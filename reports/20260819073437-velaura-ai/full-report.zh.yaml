  - id: TV006
    title: 最终尽调追问表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入与版税率
        - 任何已披露 AI 芯片收入数字或版税百分比
        - 没有它，就无法用任何上市或私营可比对象计算估值倍数
        - 在 NDA 下直接向 Velaura AI 管理层 / IR 索取
      - - 具名超大规模云厂商客户
        - 至少一个已确认、具名的超大规模云厂商设计定点或客户推荐
        - 这是整份报告中最关键的缺失证据
        - 向 Velaura 索取客户推荐，或寻求超大规模云厂商侧独立确认
      - - 股权结构表与优先权条款
        - 清算优先权层级、反稀释条款、期权池规模
        - 用来判断 $1B+ 标题估值反映的是普通股价值，还是优先股结构安排
        - 在 NDA 下索取资本结构表
      - - 现金头寸与资金跑道
        - 当前账面现金、月度烧钱额，以及 Series A 后资金跑道
        - 决定融资依赖度和近期追加融资概率
        - 索取近期现金流量表或银行余额证明
      - - 独立技术基准测试
        - 任何第三方对 2-4x MATMUL 效率提升主张的验证
        - 决定核心技术差异化能否顶住 EDA 工具商品化风险
        - 委托或跟踪独立半导体基准测试发布
    notes: 这五项是杠杆最高的尽调追问；任何一项得到解决，都会实质改变本章建议的置信度。
    claimRefs:
