        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >-
              Velaura AI 已披露的客户基础可以清晰分成两个时代，证据质量差异很大。传统 Teraflux 比特币挖矿硬件业务声称累计服务 30 家或更多工业挖矿运营商、40
              家或更多数据中心运营商；其中只有两家——MARA Holdings 和 Genesis Digital Assets Limited（GDA）——被单独点名，并能在公开资料中得到独立印证。相比之下，新的
              Titan Core AI 芯片业务声称正在接触四大云服务商中的三家，但没有披露任何名称；另两个目标分部——物理 AI / 机器人 OEM 和边缘 AI
              设备厂商——没有披露任何客户、已部署单元或案例研究。各分部的买方、用户和付款方角色差异明显：比特币挖矿客户由挖矿运营财务团队同时承担买方和付款方；而超大规模云厂商的 Titan Core 接触则会涉及基础设施 /
              资本开支预算所有者与云硅设计团队用户分离。这个分层模式——传统且战略上被弱化的业务有强具名证据，新业务才是真正支撑估值逻辑却没有任何具名证据——是本章客户尽调的核心发现。
