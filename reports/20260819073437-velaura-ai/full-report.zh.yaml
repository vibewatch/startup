  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价与确认
        blocks:
          - type: paragraph
            body: >-
              Velaura AI 核心 AI 芯片收入机制是两段式结构：前置 IP 授权费，加上与客户使用 Titan Core 后可衡量节电量挂钩的版税；公司明确把这一模式类比为 Arm
              历史处理器授权业务。公司材料把客户侧节省基础示意为三年每颗 XPU 约
              $1,300，但本章审阅的任何来源都没有披露版税比例、「已实现节电量」的测量方法，或最低授权费。鉴于整套版税机制都依赖双方从未公开说明的节省测量，这是一个实质性缺口。由于版税收入绑定的是客户实际节省，而不只是单颗出货，收入确认很可能落后于实体芯片生产；滞后时间取决于客户自身认证和部署周期，合理上可能与竞争格局章节中识别的
              12-24 个月 SoC 集成窗口相同。相比之下，Velaura 历史 Teraflux 比特币挖矿硬件业务采用传统直接硬件销售模式；MARA 自己的 SEC 文件显示，历史业务按预付款运行，在截至 March
              31, 2025 的季度内，MARA 针对产品采购预付 $22.3 million，对应 $57.2 million 未结余额；到最近一个申报期已全额结清，且没有新增预付款。没有来源披露 Velaura
              当前收入组合中，有多少仍来自历史硬件业务，又有多少来自新的 Titan Core 授权模式。
