  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Velaura AI 不销售可直接上市的芯片；它授权的是超低功耗硅设计 IP，由其他公司集成进自有 AI 加速器。因此，相关市场边界不只是笼统的「AI 芯片市场」，而是那些可能引入第三方能效 IP 厂商的 AI
              芯片设计决策子集：按照 Velaura 自己的市场口径，包括超大规模数据中心加速器、Physical 与具身 AI 系统（机器人、无人机、自主机器）以及边缘 AI 设备。数据中心 AI
              芯片市场本身，一些发布方用窄口径跟踪（SemiconductorInsight 估计 2026 为 $13.8 billion，到 2034 达到 $45.2 billion）；另一些把商用 GPU、定制
              ASIC、存储和网络芯片纳入后，口径要宽得多（Deloitte 与 Gartner 均把 2026 整体 AI 半导体市场放在 $300-500 billion，而 IDC 较窄的「intelligent
              datacenter」分部为 $281 billion，包含在 $477.1 billion 数据中心半导体总量内）。仅 NVIDIA 一家就在 NVIDIA、AMD、Intel 之间拿下 Q1 2026
              商用数据中心 AI 芯片收入约 87.4%，说明这个标题市场的大部分价值目前由 GPU 厂商捕获，而不是 Velaura 这样的 IP 授权方。明确不属于 Velaura 可服务市场的，是通用 CPU /
              服务器芯片、非 AI 网络芯片，以及超大规模云厂商设计自有定制 ASIC（Google TPU、AWS Trainium、Microsoft Maia、Meta
              MTIA）时内部捕获的成品芯片收入——不过这些内部项目本身又可能成为 Velaura 底层能效技术的 IP 授权客户，而不是它的直接替代品。
