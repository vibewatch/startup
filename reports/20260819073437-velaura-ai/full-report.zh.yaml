      - number: '2.2'
        title: TAM/SAM/SOM 与互相矛盾的测算口径
        blocks:
          - type: paragraph
            body: >-
              对 Velaura 特定的超低功耗 AI 芯片 IP 授权细分市场，没有一个受证据约束的单一 TAM/SAM/SOM 数字；所有公开数字都描述相邻且更宽的类别。数据中心侧，即使不考虑口径差异，三套独立的 2026
              方法论也已经相差近 2x：IDC 分部层面的 $281 billion「intelligent datacenter」数字、由 Gartner $1.3 trillion 半导体总预测隐含出的约 $390
              billion AI 份额，以及 Deloitte 修订后的约 $500 billion 全年估计。Physical AI 侧——这关系到 Velaura 的机器人 / 具身 AI 野心——三家发布方的 2026
              估计跨度超过 7x（MarketsandMarkets 较窄 2025 基数对应 $0.89 billion、SNS Insider 为 $6.93 billion、Mordor Intelligence 为
              $7.11 billion），反映的不是共识趋同，而是各方对「physical AI」硬件和软件边界的定义差异很大。由于 Velaura
              的收入模式是版税制（授权费加实测节电量分成），而不是直接卖芯片，即便底层加速器市场的 SAM 定义清楚，也会高估 Velaura 自己能拿到的收入；分析上正确的 SOM 应按每颗出货 XPU
              对应的版税美元计量，但没有公开来源给出这个数字的自下而上估计。因此，本章明确保留规模测算矛盾，而不是压成一个标题数字，并把缺失的 SOM 估计记录为具名证据缺口。
