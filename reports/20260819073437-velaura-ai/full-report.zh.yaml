      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              支撑 Velaura 投资逻辑的主导增长驱动，是 AI 数据中心用电需求正走在近乎翻倍的轨道上：从 2025 约 485 TWh 增至 2030 的 950 TWh，而仅美国在 2026 就面临估计 9.3 GW
              结构性电力缺口。这个物理约束抬高了任何能从每瓦电力中榨出更多有效算力的技术价值。超大规模云厂商 capex 增长（2026 预计 $600-725 billion，同比约增 75%）扩大了未来可支付 IP
              授权费的预算池；定制 ASIC 出货增速（44.6% CAGR）快于商用 GPU（16.1%
              CAGR），也扩大了天然适合授权的自研硅项目集合。反过来，几项真实采用约束也在压制这些驱动：美国对华出口管制和中国稀土反制增加合规成本和供应链不确定性；先进节点芯片设计和制造的高资本强度提高了竞争者进入门槛，但并不消除
              Velaura 自身执行风险；典型 12-24 个月 SoC
              集成和晶圆厂认证周期意味着，即便签下设计定点，版税现金流也会延后一到两年。估值时还应提示另一项约束：更广泛行业正在同时从多个角度解决同一个电力问题——AI 服务器中液冷采用率从 2024 的 15% 升至
              2026 预计 76%——这意味着系统级冷却改善可能随时间部分替代芯片级效率提升，而不完全依赖 Velaura 这类厂商。
