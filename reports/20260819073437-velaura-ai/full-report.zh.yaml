  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Arm Holdings（上市）
        - 市值 / FY2026 收入
        - $270.57B 市值；$4.92B FY2026 收入；~52-55x P/S
        - 最接近的上市版税 + 授权商业模式可比对象
        - Arm 是成熟、多元、已有数十年历史的上市公司；与 Velaura 的 Series A 阶段和规模不可比
      - - Cerebras Systems（上市，2026 年 5 月 IPO）
        - IPO 首日估值
        - 完全稀释后约 $56B
        - 直接 AI 芯片板块可比对象；近期美国最大科技 IPO
        - Cerebras 销售成品晶圆级芯片（硬件销售模式），不是 Velaura 这种版税授权业务
      - - Groq（私营，NVIDIA 交易 + 重置融资）
        - 估值历史
        - $6.9B（2025 年 9 月）-> ~$20B NVIDIA IP / 人才交易（2025 年 12 月）-> $3.5B 重置融资（2026 年 8 月）
        - 直接 AI 芯片板块可比对象，显示估值波动性
        - Groq 商业模式已完全转向（“AI 推理新云”），与 Velaura 授权模式的直接可比性下降
      - - Tenstorrent（私营）
        - 估值状态
        - 截至 2026 年中，未披露独角兽级估值重置
        - 直接 AI 芯片加速器 / IP 板块可比对象
        - 公开估值透明度有限；可能低估 Tenstorrent 的实际私募估值
      - - Untether AI（已停业）
        - 结果
        - 破产（2025 年 10 月）；负债 $128M+
        - 对技术可信的低功耗 AI 芯片创业公司来说，是下行尾部可比案例
        - Untether AI 销售成品芯片，而非授权 IP；商业模式不同于 Velaura
      - - 半导体 IP 授权板块（汇总）
        - 典型 EV / Revenue 倍数
        - 高质量、成长型公司 8-12x；增长较慢 / 商品化产品组合 4-8x（2026）
        - 基于版税的 IP 业务通用估值方法基准
        - 板块汇总数据会掩盖公司层面的质量 / 增长差异；并非 Velaura 专属
    notes: 列出的可比对象都不是 Velaura 在阶段和模式上的精确匹配；纳入它们是为了从不同角度框定合理估值区间（上市版税模式同业、IPO 同业、私营 AI 芯片同业、板块倍数基准，以及下行失败案例）。
