          values:
            - 强（公司 + 独立媒体）
            - 否（未具名超大规模云厂商）
            - 否
        - label: 物理 AI
          values:
            - 仅营销阶段
            - 否
            - 否
        - label: 边缘 AI
          values:
            - 极少
            - 否
            - 否
        - label: 传统 Teraflux 硬件
          values:
            - 强（已出货，具名客户 MARA）
            - 是（MARA）
            - 部分（已发布效率规格）
    claimRefs:
      - CE004
      - CE005
      - CE018
      - CE035
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Velaura 四类客户的采用触点和扩张路径。
    data:
      nodes:
        - id: discovery
          label: 发现：媒体报道、投资人网络或直接触达
        - id: evaluation
          label: 技术评估：RTL/设计基准测试（Titan Core）或硬件演示（Teraflux）
        - id: purchase
          label: 采购：授权协议（Titan Core）或设备采购订单（Teraflux）
        - id: deployment
          label: 部署：晶圆厂流片 / 认证（Titan Core）或设施安装（Teraflux）
        - id: expansion
          label: 扩张：MARA 路径（投资人 -> 硬件买方 -> 持续投资人）；GDA 路径（单笔大额采购，尚未披露复购）；超大规模云厂商路径（仅技术评估，尚未披露采购）
    claimRefs:
      - CU030
      - CU001
      - CU023
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 从发现到扩张的漏斗，展示每个已披露客户关系目前所处阶段。
    data:
      items:
        - label: 发现 / 初始接洽
          value: 100
        - label: 技术评估 / 基准测试
          value: 70
        - label: 采购协议 / 授权已签署
          value: 40
        - label: 生产部署已确认
          value: 25
        - label: 复购 / 扩张
          value: 10
    approximationNotes: 百分比是示意性漏斗阶段估计，反映 MARA、GDA 及未具名超大规模云厂商接洽中披露的大致模式；不是公司披露的转化率。
    claimRefs:
      - CU018
      - CU023
      - CU017
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: Velaura 三个最具体客户关系的证据质量、独立性与生产成熟度。
    data:
      columns:
        - 独立性（公平交易 vs. 关联方）
        - 证据质量
        - 生产成熟度
      rows:
        - label: MARA
          values:
            - 关联方（投资人 + 董事席位）
            - 高（SEC 文件 + 媒体 + 具名引述）
            - 生产阶段（订单已全部交付）
        - label: GDA
          values:
            - 独立（无投资人关系）
            - 中（具名新闻稿 + 高管引述）
            - 已公告；设施层面完工未确认
        - label: 未具名超大规模云厂商（Titan Core）
          values:
            - 未知（未披露关系）
            - 低（公司说法，媒体转述但未验证）
            - 据采访报道处于评估 / 试点阶段
    claimRefs:
      - CU006
      - CU011
      - CU023
      - CU036
  - id: FU004
    title: 留存 / 复购队列
    type: cohort
    layout: standard
    summary: 无法制作示意性时间序列留存视图；这张队列图用唯一有多期交易数据的 MARA 关系记录披露缺口。
    data:
      columns:
        - 第 1 年（2023-24，仅投资人）
        - 第 2 年（2024-25，+ 硬件采购）
        - 第 3 年（2025-26，+ 持续投资）
      rows:
        - label: MARA 关系（示意连续性，不是正式留存率）
          values:
            - 100
            - 100
            - 100
    approximationNotes: 这不是真正的留存队列（百分比只是占位，用来表示关系跨年延续，不是测得的收入留存）；没有公司披露实际留存指标，也没有其他客户有多期公开数据可填充更多行。
    claimRefs:
      - CU030
      - CU006
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 本章识别的最高优先级风险在发生可能性、严重度和缓释成熟度上的分布。
    data:
      columns:
        - 发生可能性
        - 严重度
        - 缓释成熟度
      rows:
        - label: 具名 AI 芯片客户为零
          values:
            - 高
            - 高
            - 低
        - label: MARA 投资人 / 客户双重集中
          values:
            - 中
            - 高
            - 低
        - label: EDA 工具对核心 IP 的商品化挤压
          values:
            - 中
            - 高
            - 低
        - label: 传统硬件市场收缩
          values:
            - 高
            - 中
            - 中
        - label: 美中出口管制风险敞口（间接）
          values:
            - 中
            - 高
            - 低
        - label: 关键人物依赖（Khemani/Gulati）
          values:
            - 低
            - 高
            - 中
        - label: 现金、烧钱速度、现金跑道未披露
          values:
            - 中
            - 中
            - 低
    claimRefs:
      - CR030
      - CR007
      - CR016
      - CR013
      - CR002
      - CR024
      - CR019
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 关键风险如何传导到收入、客户转化、融资和估值。
    data:
      nodes:
        - id: customer_opacity
          label: 超大规模云厂商客户未披露
        - id: commoditization
          label: EDA 工具商品化风险
        - id: legacy_decline
          label: 传统硬件市场收缩
        - id: revenue
          label: AI 芯片版税收入（未确认）
        - id: financing
          label: 融资依赖（烧钱速度 / 现金跑道未披露）
        - id: valuation
          label: $1B+ Series A 轮估值
      edges:
        - from: customer_opacity
          to: revenue
          label: 延迟 / 模糊收入转化
        - from: commoditization
          to: revenue
          label: 威胁版税率可持续性
        - from: legacy_decline
          to: revenue
          label: 削掉传统业务的现金流缓冲
        - from: revenue
          to: financing
          label: 收入不足会加大融资依赖
        - from: financing
          to: valuation
          label: 收入拐点前再融资会压迫估值
    claimRefs:
      - CR009
      - CR016
      - CR013
      - CR019
      - CR028
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: 支撑 Velaura 风险画像的关键伙伴、供应商和融资依赖。
    data:
      nodes:
        - id: foundry
          label: 先进节点晶圆厂伙伴（3nm/2nm）
        - id: samsung
          label: Samsung Catalyst Fund（投资人 + 晶圆厂关联母公司）
        - id: mara
          label: MARA（投资人 + 最大具名客户）
        - id: eda_vendors
          label: Cadence / Synopsys（替代技术风险）
        - id: export_control
          label: 美国 BIS 出口管制体系
        - id: titan_core
          label: Titan Core 交付与收入
      edges:
        - from: foundry
          to: titan_core
          label: 物理实现依赖
        - from: samsung
          to: foundry
          label: 潜在战略 / 晶圆厂连接
        - from: mara
          to: titan_core
          label: 最大已披露收入 / 客户数据点
        - from: eda_vendors
          to: titan_core
          label: 替代技术威胁差异化
        - from: export_control
          to: foundry
          label: 监管晶圆厂 / 客户资格
    claimRefs:
      - CR033
      - CR026
      - CR007
      - CR016
      - CR001
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 从量产规模与宏观顺风，到未解决的客户 / 收入证明，再到最终「观察」建议的逻辑链。
    data:
      nodes:
        - id: scale_proof
          label: 量产已验证的技术：30M+ ASIC 已出货，董事会可信
        - id: macro_tailwind
          label: 宏观顺风有利：电力 / 电网约束、2026 年超大规模云厂商资本开支 $600-725B
        - id: customer_gap
          label: 具名 AI 芯片客户为零；收入和版税率未披露
        - id: comparable_volatility
          label: AI 芯片可比公司组高度波动（Groq 估值重置、Cerebras IPO、Untether AI 破产）
        - id: recommendation
          label: 建议：观察（继续研究），风险评级高，估值立场未定
      edges:
        - from: scale_proof
          to: recommendation
          label: 支撑继续跟踪
        - from: macro_tailwind
          to: recommendation
          label: 支撑继续跟踪
        - from: customer_gap
          to: recommendation
          label: 无法给出有把握的买入判断
        - from: comparable_volatility
          to: recommendation
          label: 无法给出有把握的估值立场判断
    claimRefs:
      - CV041
      - CV033
      - CV020
      - CV012
      - CV031
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在一组可比收入倍数下，为支撑 Velaura $1B+ 估值所需的示意收入。
    data:
      items:
        - label: 按 4x 收入倍数（低增长 IP 可比公司）
          value: 250
        - label: 按 8x 收入倍数（保守半导体 IP 可比公司）
          value: 125
        - label: 按 12x 收入倍数（高质量增长型 IP 可比公司）
          value: 83
        - label: 按约 53x 收入倍数（Arm 当前公开 P/S）
          value: 19
    approximationNotes: 数值是示意性隐含收入（USD millions），用 $1 billion 估值除以各倍数得出；这些收入数字均未由 Velaura 披露或确认，Arm 的极端倍数反映其独特规模 / 增长画像，而不是典型可比公司。
    claimRefs:
      - CV013
      - CV004
      - CV005
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 围绕 AI 芯片可比公司组已经展现的波动，框定 Velaura 下一轮融资或退出事件的乐观 / 基准 / 悲观估值区间。
    data:
      items:
        - label: 悲观情景（降价轮或减值，类似 Groq 约 50% 估值重置）
          low: 500
          high: 700
          unit: USD millions
        - label: 基准情景（持平到小幅上调，取决于销售管线进展）
          low: 1000
          high: 1500
          unit: USD millions
        - label: 乐观情景（已确认设计定点推动估值上调，但远低于 Cerebras 约 $56B IPO 规模）
          low: 2000
          high: 4000
          unit: USD millions
    approximationNotes: 这些区间是作者基于所引用可比公司组的历史估值摆动（Groq 下调、相对 Cerebras 的假设上调尺度）构建的示意情景边界，不是 Velaura 已披露的特定预测或模型。
    claimRefs:
      - CV008
      - CV009
      - CV024
      - CV025
      - CV026
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: IC 可直接使用的评分快照，覆盖市场、证明、护城河、经济性、风险、估值和证据质量。
    data:
      items:
        - label: 市场机会（宏观顺风）
          value: Strong
          trend: up
        - label: 客户证明（具名 AI 芯片客户）
          value: None
          trend: flat
        - label: 护城河耐久性（对比 EDA 工具商品化）
          value: Uncertain
          trend: flat
        - label: 单位经济模型披露
          value: Undisclosed
          trend: flat
        - label: 风险评级
          value: High
          trend: flat
        - label: 估值立场
          value: Unresolved
          trend: flat
        - label: 证据质量（整体）
          value: Thin / company-dependent
          trend: flat
    claimRefs:
      - CV020
      - CV016
      - CV033
