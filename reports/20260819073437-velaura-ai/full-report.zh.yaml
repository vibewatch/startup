      - number: '1.2'
        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >-
              联合创始人兼 CEO Rajiv Khemani，是本章审阅的所有融资和产品公告中 Velaura AI 的公开面孔；Mayfield 的 Navin Chaddha 称，2026 轮融资是其公司与
              Khemani 的第四次合作。Manu Gulati 担任首席开发官，并与 Khemani 一起被点名为领导团队的技术核心；Mayfield 表示这是其第二次与 Gulati 合作。除创始二人外，Velaura
              的团队页面列出 Sanjay Gupta（战略与 GTM 总裁）、YJ Kim（产品总裁）、Tim Vehling（产品副总裁）、Brian Campbell（工程运营副总裁）和 Atul
              Dhablania（首席系统运营官），组成一支公司和媒体都称由 Apple、NVIDIA、Google、Qualcomm、Marvell 校友构成的管理梯队。治理上，董事会混合了风险资本和战略利益：Navin
              Chaddha（Mayfield）、Umesh Padval（Seligman Ventures，持有 Series A 领投方董事席位）、Dipender Saluja（Capricorn Investment
              Group）、Fred Thiel（MARA CEO，既是投资人，也是前 Teraflux 硬件客户）、Sriram Viswanathan（Celesta Capital），以及 Intel CEO
              Lip-Bu Tan；后者通过 Walden International 进入董事会，为公司背书了重要的半导体行业信誉。两位学术 / 技术顾问 Aditya Grover（Inception AI
              CTO；UCLA 教授）和 Magnus Egerstedt（UNC Chapel Hill 教务长；机器人学者）补强了公司的 Physical AI 与机器学习能力。公开评论高度集中在 Khemani 和
              Gulati 身上，而其余高管几乎没有独立传记细节，这显示公司对创始二人存在实质性的关键人依赖。
