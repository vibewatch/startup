      - number: '8.2'
        title: 当前融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              Velaura AI 于 2026 年 8 月 18 日完成 $110 million Series A，估值超过 $1 billion；本轮由 Seligman Ventures 领投，Capricorn
              Investment Group、Prosperity7 Ventures、Mayfield、Maverick Silicon、MARA、Premji Invest、Samsung Catalyst Fund 和
              StepStone Group 参投。除「超过 $1
              billion」这一标题外，没有资料披露准确投后估值、股价或优先权结构，也没有披露任何清算优先权、反稀释或期权池细节，足以让尽调区分普通股价值和优先股结构推高后的价值。估值标记上升的唯一独立申报印证来自 MARA
              Holdings 的 SEC 10-Q：当后续融资轮确立更高可观察价格时，MARA 对既有 Velaura 持股分别记录 $11.9 million 和 $2.7 million ASC 321
              公允价值收益——这是真实、经审计的证据，说明 Velaura 估值在各轮之间上升；但它不能独立确认具体 $1B+ 数字。Velaura 的股权结构表混合了财务型风险投资方、战略投资方和关联方投资人（Samsung
              Catalyst Fund、MARA），增加了解读复杂度：MARA 上升的公允价值标记同时是 Velaura 估值提升的最佳证据，也是一项不应被视为完全独立的关联方数据点。
