              million 的投资账面价值，因此这条证据最强的关系并不是独立的、保持距离的客户背书。相比之下，Genesis Digital Assets（GDA）是真正独立的客户，未披露与 Velaura
              存在投资方关系：2025 年 6 月，GDA 同意为其 Texas Glasscock County 的 40 MW 设施采购 1,000 台 Teraflux AT2880-277 风冷矿机，并有执行总裁
              Abdumalik Mirakhmedov 具名、公开背书，且确认参与 ERCOT 的需求响应项目；但截至运行日期，该具体部署是否已在该设施进入全面生产，仍没有独立确认。专门看 AI
              芯片业务，则完全没有具名客户：Velaura 自有材料和 GamesBeat 访谈报道都把三家未具名超大规模云厂商接触描述为处于技术评估和 RTL 基准测试阶段，而非已确认量产部署；Heise Online
