      - number: '5.4'
        title: 信任、合规与开发者信号缺口
        blocks:
          - type: paragraph
            body: >-
              Velaura 的公开信任面很薄：公司发布了一份通用隐私声明（版本日期为 2024 年 8 月，审阅版本仍使用此前 Auradine, Inc. 的法定名称），但审阅过的资料里没有披露专门的安全认证（如 ISO
              27001 或 SOC 2），也没有披露安全 / 质量认证（如 AEC-Q100 或 ISO 26262；考虑到其物理 AI / 机器人布局，这类认证尤其相关）。作为一家硬件 IP 公司，Velaura
              也没有软件公司常见的公开开发者表面：未找到 GitHub 仓库、Hacker News 讨论、Stack Overflow 标签，或专门围绕 Titan Core 的公开开发者论坛讨论。公司确实在 Lever
              上保持活跃招聘，说明工程岗位仍在招人，但抓取到的内容没有披露具体岗位层面的技术栈细节。按照本技能对缺少公开开发者表面公司的处理指引，最接近的从业者社区代理信号来自更广泛的半导体行业场域：SEMI 2026 年 8
              月的「AI Techniques in Semiconductor Manufacturing」研讨会，以及 2026 年更广的半导体会议日程（DAC、SEMICON WEST），显示 Velaura 所处的
              AI 与硅结合这一通用主题有活跃从业者参与；但两个场域都没有提供 Velaura 专属的技术讨论。公司只在营销语言里把 IP 保护描述为「已获专利」技术；本章研究未能通过 USPTO Patent Public
              Search 或 Google Patents 确认任何具体专利号。
