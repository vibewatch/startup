      - number: '1.4'
        title: 牵引力、部署规模与反向信号
        blocks:
          - type: paragraph
            body: >-
              Velaura AI 最核心的牵引力主张，是其超低功耗设计方法已经过规模验证：公司在 Titan Core 发布稿和 Series A 公告中都引用了领先工艺节点上 30 million 多颗 ASIC
              的制造量，并用这项规模来支撑新 AI 产品的制造良率和可靠性主张。客户侧，公司称正在与四大云厂商中的三家推进合作；据 Heise Online 报道，CEO Rajiv Khemani 向 Reuters
              确认了这一点，但他拒绝披露涉及哪些超大规模云厂商，也没有任何客户独立确认与 Velaura 或 Titan Core 存在关系。没有具名客户验证，再叠加 2-4x
              每瓦性能提升缺乏任何独立、同行评审基准，这就是本章识别出的最关键证据缺口。行业媒体对底层电力约束逻辑总体正面，但也提示真实执行风险：TechBooky 明确提醒，「估值超过 $1 billion
              并不保证商业采用」，并指出芯片初创公司需要深厚工程能力、制造伙伴和客户验证，才能把设计定点转成经常性版税收入。Moor Insights & Strategy 的独立分析师 Patrick Moorhead
              给出了更建设性的判断，称 Velaura 的路径「有潜力」降低客户总拥有成本并缓解热约束；这是带保留的背书，不是独立验证。
