  - id: TV002
    title: 正反论点表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - 正方论点：Velaura 已量产验证的低功耗 IP（30M+ 颗 ASIC）叠加电力约束宏观顺风，足以支持继续跟踪其走向独角兽级 AI 芯片授权业务。
        - 具名超大规模云厂商设计定点或已披露 AI 专项收入，会把这个论点从合理叙事推进为有证据支撑的牵引力。
      - - 正方论点：版税 + 授权模式虽然单台经济性弱于硬件销售，但资产更轻、毛利更高，具备类似 Arm 历史路径的扩张潜力。
        - 披露实际版税率和至少一份已签授权协议后，才能做量化建模，而不是靠类比假设。
      - - 反方论点：估值所依托的 AI 芯片业务没有任何具名客户；所有牵引力说法都来自媒体转述的公司表述。
        - 独立确认超大规模云厂商关系（客户推荐、云厂商侧披露或基准测试）会显著缓解这个担忧。
      - - 反方论点：可比公司波动极大（Groq ~50% 重置、Untether AI 破产、Cerebras IPO 带来估值暴涨），今天 $1B+ 的估值标记 12 个月后可能完全变样。
        - 若下一轮融资估值稳定或更高，且没有降价轮调整，可缓解（但不能消除）这个担忧。
      - - 反方论点：Cadence、Synopsys 等商业 EDA 工具可能让超大规模云厂商在内部复制 Velaura 的效率提升，从而把核心 IP 商品化。
        - 如果有证据显示 Velaura 的库显著优于内部 EDA 工具可达到的最佳结果（例如独立基准测试），可回应这个问题。
    notes: 每条反方论点都配有一个具体、可监测事件，用于解决或缓解该问题，符合本章以证据变化为核心的判断方式。
    claimRefs:
      - CV018
      - CV016
      - CV017
      - CV023
      - CV031
  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 三个超大规模云厂商合作中至少一个在 18 个月内转为具名、已签约设计定点；传统硬件下滑企稳；电力约束宏观顺风持续利好效率型 IP。
        - 收入拐点可能支撑下一轮加价，或走向类似 Cerebras ~$56B 结果的战略收购 / IPO 路径；但鉴于 Velaura 阶段更早，规模会小得多。
        - 晶圆厂认证时间表执行风险；EDA 工具商品化；若只有一个设计定点落地，客户集中度会偏高。
        - 已量产验证技术和强宏观顺风让该情景具备合理性，但目前没有任何具名客户证据支撑。
      - - 基准
        - 逐步、部分转化（例如一个设计定点并伴随多年量产爬坡），同时传统业务继续下滑；Velaura 至少再融一轮，才能达到可自我维持的版税收入。
        - 下一轮估值大概率大致持平到小幅上行，取决于可见管线进展，而非已确认收入。
        - 如果收入可见度改善前就需要下一轮融资，会有融资依赖风险；持续披露不透明让估值证据仍然薄弱。
        - 符合半导体 IP 通常 12-24 个月认证周期，也符合当前缺少已披露财务指标的状态。
      - - 悲观
        - 三个超大规模云厂商合作在 18 个月内均未转化；随着比特币矿工转向 AI/HPC 托管，传统 Teraflux 业务继续萎缩；EDA 工具商品化削弱第三方 IP 紧迫性。
        - 估值可能遭遇降价轮或减记，类似 Groq 在 NVIDIA 交易后约 50% 重置；最不利情况下，也可能走向 Untether AI 破产式更严重结果。
        - 收入拐点前资本耗尽；关键人物离职；无法与内部 EDA 方案拉开差距。
        - 鉴于 Untether AI、Groq 已显示板块波动，这是真实尾部风险；不过截至运行日，Velaura 本身尚未出现反向信号。
    notes: 概率信号是作者基于引用证据作出的定性判断，不是统计模型概率。
