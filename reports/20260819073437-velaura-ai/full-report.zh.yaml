  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与架构
        blocks:
          - type: paragraph
            body: >-
              Velaura AI 不卖成品芯片；它通过自有网站描述的三阶段合作模式交付物理设计 IP 和工具流产品：客户提交 RTL 设计，以及对面积、功耗和其他因素的优先级；Velaura 套用自研低电压 IP
              库和为良率、可靠性构建的自研工具流；客户最终收到优化后的、特定节点 GDS 版图或 chiplet。架构上，Titan Core 瞄准 AI 训练和推理能耗占主导的矩阵乘法（MATMUL）运算，声称通过已在先进
              3nm、2nm 工艺节点验证的自研电路和库技术，将这些运算所需能量降低 2-4x。集成设计目标是在较低工作电压下保持完整功能等价，不要求软件修改，因此 Titan Core
              更像是可直接接入的物理设计优化，而不是客户必须全盘采用的新架构。Velaura 保留两条反映公司历史的产品 / 解决方案线：Ultra Low Power AI Compute（面向 AI 加速器的 Titan
              Core IP 平台）和 Blockchain（历史风冷、浸没式、水冷比特币挖矿硬件），底层低电压工程能力在两者之间共用。
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
              - CE008
              - CE030
