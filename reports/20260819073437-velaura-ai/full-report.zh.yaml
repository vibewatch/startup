  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              本章识别出五类会实质影响 Velaura AI 投资判断的风险。按发生可能性和严重度综合排序，最高优先级风险是客户 / 收入集中：$1B+ Series A 估值几乎完全依赖一个没有任何具名客户的 AI
              芯片授权业务，而唯一获得独立印证的客户关系（MARA）同时又是关联方投资人。紧随其后的是来自商业 EDA 工具（Cadence、Synopsys）的商品化风险，这些工具可能让超大规模云厂商客户在内部复现
              Velaura 的能效收益。美国—中国半导体出口管制持续演变，监管风险重要但间接；风险通过 Velaura 未披露的代工厂和超大规模云厂商关系传导，而不是来自直接、已确认的敞口。运营风险集中在 Velaura
              传统比特币挖矿硬件客户基础的结构性收缩：行业转向 AI/HPC 托管，正在拿走公司唯一目前有收入证据的业务，而新业务仍未被证明。财务 /
              模型风险来自现金余额、烧钱速度、现金跑道和版税计量方法完全未披露。每一类风险都对应不同投资含义：考虑到底层证据大量回溯到公司说法而非独立确认，尽调不应把 Velaura 的独角兽估值当成商业执行已降险的证明。
