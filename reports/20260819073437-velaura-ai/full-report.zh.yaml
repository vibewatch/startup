      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              Velaura 的三类目标买方在预算负责人和采用触发点上结构不同。超大规模数据中心里，买方是云基础设施 / 硅团队，付款方是超大规模云厂商 capex 预算——Big Five 超大规模云厂商 2026
              capex 预计为 $600-725 billion，约 75% 投向 AI 基础设施——采用触发点则是数据中心扩张遇到电力 / 冷却约束。Physical 与具身 AI 里，买方是机器人 /
              无人机硬件工程团队，付款方是 OEM R&D 和物料清单预算，采用触发点是常开自主系统对电池续航和热包络的要求；端侧计算已经占 physical-AI 部署的 71.43%，与 Velaura
              的片上效率叙事直接对齐。边缘 AI 里，设备 OEM 采购团队购买芯片，是为了延长电池寿命并启用本地推理。第四个横向子板块，是 Google TPU、AWS Trainium、Microsoft
              Maia、Meta MTIA 等超大规模云厂商内部定制 ASIC 项目；它们动用的是更广义数据中心板块的同一 capex 预算，但采用路径不同：这些团队已经自研硅，只会为了补上相对商用 GPU
              竞争者的每瓦性能差距而授权 Velaura IP，而不是替代既有芯片采购决定。Broadcom 与 Marvell 合计支撑了 80% 以上超大规模云厂商定制硅背后的 ASIC
              设计服务，这又带来一层复杂性：它们可以作为渠道伙伴，把 Velaura IP 嵌入设计服务，也可以成为直接竞争者，提供自己的功耗优化能力。
