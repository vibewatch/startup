      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 1 月 15 日，美国针对先进计算芯片的出口管制政策，从对出口至中国和澳门预设拒绝，转向逐案牌照审查，并为受覆盖产品增加认证和第三方测试要求。Velaura
              自身披露没有说明其对该制度的敞口，但传导渠道真实存在：如果三家未披露的超大规模云厂商接触中有任何一家涉及服务中国的基础设施，或涉及与中国相关的代工产能，这些规则会直接影响交易经济性和时间表。另一个维度是，AI
              相关专利诉讼已在全行业激增；法律行业分析统计，过去五年全球 AI 专利诉讼超过一千起。截至运行日期，没有诉讼或专利纠纷专门点名 Auradine 或 Velaura
              AI；但公司自己未经验证地声称拥有「已获专利」技术，却没有通过 USPTO 或 Google Patents 确认具体专利号，这本身就是一个尽调缺口，使 IP 强度无法验证。本章未完成对 Velaura AI,
              Inc. 的 Delaware 法律实体状态的独立确认（州注册系统需要付费直接查询），也未发现公司或其具名管理层存在制裁名单或被拒方敞口。
