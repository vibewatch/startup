  - id: TV005
    title: 论点失效与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 无具名超大规模云厂商设计定点
        - Series A 后 18 个月（即大约到 2028 年 2 月）仍无具名或独立确认客户
        - 直接削弱估值所依托的核心 AI 芯片收入论点
        - 若无其他新证据，将估值立场从“未解决”下调为“昂贵 / 回避”
      - - 披露降价轮或估值减值
        - 任何后续融资轮或 MARA SEC 文件显示 Velaura 估值标记低于 2026 年 8 月的 $1B+
        - 直接表明市场已下调公司定价
        - 视为本章提示的高估风险被证实
      - - EDA 厂商或晶圆厂商品化事件
        - Cadence、Synopsys、TSMC 或 Samsung Foundry 公开发布直接竞争的低功耗 IP 库
        - 削弱 Velaura 核心差异化和版税率防御力
        - 重新评估护城河耐久性，并提高熊情景概率权重
      - - 传统业务继续下滑且无 AI 芯片抵消
        - 已披露（或推断）传统硬件连续两个或以上季度下滑，且未披露 AI 芯片收入
        - 证实基准 / 熊情景中的转型路径正在发生，且没有牛情景收入抵消
        - 提高对熊情景资本耗尽风险的权重
      - - 关键人物离职
        - CEO Rajiv Khemani 或 CDO Manu Gulati 离职
        - 移除市场所押注的核心执行能力
        - 视为高严重性负面估值触发项，需要立即重新评估
    notes: 阈值是作者基于来源支撑、可监测事件综合设定；均非公司披露的正式契约或里程碑。
