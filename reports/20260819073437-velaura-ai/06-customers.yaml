company:
  name: Velaura AI
chapter:
  number: 6
  title: Customers
  summary: Velaura's only independently corroborated named customers (MARA, GDA) both belong to its legacy, strategically de-prioritized Bitcoin-mining hardware business - and MARA is also a related-party
    investor - while the Titan Core AI-silicon business underpinning the $1B+ Series A valuation has zero named customers, no confirmed production deployment, and no retention or concentration data of any
    kind.
sections:
- id: customer-base-segmentation
  title: Customer Base Segmentation
  body: 'Velaura AI''s disclosed customer base splits cleanly into two eras with very different evidence quality. The legacy Teraflux bitcoin-mining hardware business claims 30 or more industrial mining
    operators and 40 or more data center operators cumulatively, of which exactly two - MARA Holdings and Genesis Digital Assets Limited (GDA) - are individually named and independently corroborated in
    public sources. The new Titan Core AI-silicon business, by contrast, claims engagement with three of the four largest cloud providers but names none of them, and two additional target segments - Physical
    AI/robotics OEMs and Edge AI device makers - have no disclosed customer, deployed unit, or case study of any kind. Buyer, user, and payer roles differ meaningfully across segments: Bitcoin-mining customers
    combine buyer and payer in mining-operations finance teams, while hyperscaler Titan Core engagements would involve separate infrastructure/capex budget owners and cloud silicon design-team users. This
    segmentation pattern - strong named evidence for a legacy, strategically de-prioritized business and zero named evidence for the new business the valuation thesis actually depends on - is the central
    customer-diligence finding of this chapter.'
  claimRefs:
  - CU007
  - CU008
  - CU009
  - CU019
  - CU028
  - CU034
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-customer-proof
  title: 'Named Customer Proof: Production vs. Pilot'
  body: 'MARA Holdings provides Velaura''s strongest customer evidence: an SEC 10-Q filing independently confirms MARA advanced $22.3 million to Velaura (then Auradine) for product purchases in the quarter
    ended March 31, 2025, against a $57.2 million outstanding balance, and independent press reporting separately confirms MARA''s total H1 2025 Teraflux purchase reached $73.3 million and was fully delivered
    by June 30, 2025 - genuine production deployment corroborated by a regulatory filing rather than only a press release. However, MARA is simultaneously a Velaura investor holding a board seat and $85.4
    million in investment carrying value, which means this best-evidenced relationship is not an independent, arms-length reference. Genesis Digital Assets (GDA), by contrast, is a genuinely independent
    customer with no disclosed investor relationship to Velaura: in June 2025 it agreed to purchase 1,000 Teraflux AT2880-277 air-cooled miners for its 40 MW Glasscock County, Texas facility, with a named,
    on-the-record testimonial from Executive President Abdumalik Mirakhmedov and confirmed participation in ERCOT''s demand-response program - though whether that specific deployment has reached full production
    at the facility is not independently confirmed as of the run date. For the AI-silicon business specifically, no named customer exists at all: Velaura''s own materials and GamesBeat''s interview coverage
    describe the three unnamed hyperscaler engagements as being in technical evaluation and RTL-benchmark stages, not confirmed production deployment, and Heise Online''s independent reporting explicitly
    flags that Velaura''s CEO declined to name any of them even when asked directly by Reuters.'
