- id: retention-durability
  title: Retention, Durability, and Repeat Usage
  body: 'No public source discloses a net revenue retention, gross revenue retention, churn, renewal rate, or customer satisfaction metric for any Velaura customer relationship, legacy or new. The only
    available repeat-engagement signal is qualitative: MARA''s relationship with Velaura progressed from a Series B/C financial investor to a 2026 Series A investor to a disclosed $73.3 million hardware
    purchaser, illustrating a form of land-and-expand behavior across relationship types even though it is not a formal retention metric and is confounded by the investor relationship itself. Following
    the March 2026 rebrand, Velaura''s own statements indicate existing Teraflux customers retain warranty support even as the company shifted unsold inventory to in-house mining rather than continuing
    external sales - a signal of continuity of obligation to existing customers, but also of declining new-customer acquisition in that product line specifically. No source provides a durability signal
    (cohort, renewal, or retention data) for the hyperscaler Titan Core engagements, which remain at an evaluation stage without any customer relationship old enough to measure retention against.'
  claimRefs:
  - CU016
  - CU030
  - CU033
  - CU013
  - CU029
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-concentration-adverse
  title: Expansion, Concentration, and Adverse Market Signals
  body: 'The single largest concentration risk this chapter identifies is that Velaura''s most valuable and best-evidenced customer transaction (MARA''s $73.3 million H1 2025 purchase, corroborated by SEC
    filing) comes from a related party rather than an independent buyer, while its one genuinely independent named customer (GDA) represents a single transaction with no confirmed repeat business. Compounding
    this, the addressable market for Velaura''s only currently-revenue-evidenced business - legacy Teraflux hardware - is structurally shrinking: major public Bitcoin miners including Cipher Mining, Core
    Scientific, TeraWulf, and Bitdeer are redirecting capital and power capacity toward AI/HPC colocation deals rather than expanding Bitcoin-mining hardware fleets, and public miners collectively shed
    21% of Bitcoin hashrate in 2026 as AI revenue accelerated industry-wide. This creates a difficult transition window for Velaura: its legacy customer base is contracting just as its new AI-silicon customer
    base (the three unnamed hyperscalers) remains entirely unconfirmed. No evidence of a failed deployment, customer complaint, or negative review was found for either business line in the sources reviewed,
    which is a mild positive signal but should be read against the broader absence of any independent customer review platform (G2, Gartner Peer Insights) coverage of Velaura at all.'
