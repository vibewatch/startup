- id: TU005
  title: Expansion and Concentration Risk Table
  columns:
  - Expansion Driver
  - Concentration Risk
  - Impact
  - Diligence Path
  rows:
  - - MARA's relationship expanded from investor to large hardware purchaser to continued 2026 Series A investor
    - MARA is both Velaura's most valuable disclosed customer transaction and a related-party investor/board member
    - Reference quality is diminished by the lack of independence; true arms-length demand signal is unclear
    - Seek an arms-length customer reference without an investor relationship to Velaura
  - - GDA represents a genuinely independent (non-investor) named customer
    - Single-transaction relationship (1,000 units); no evidence of repeat orders
    - Positive but thin evidence; cannot yet demonstrate durable repeat demand
    - Track whether GDA places additional orders or provides a follow-up case study
  - - Hyperscaler Titan Core engagements could expand into Velaura's largest revenue segment if converted
    - All three engagements are unnamed and unconfirmed as production deployments
    - Highest-impact expansion opportunity is also the least-evidenced one
    - Request named customer confirmation or independent hyperscaler-side disclosure
  - - Broader Bitcoin-mining industry pivot to AI/HPC colocation
    - Shrinks the addressable market for any residual Teraflux hardware sales, Velaura's only currently-revenue-generating customer segment with named proof
    - Reduces the durability of legacy-business revenue just as the AI-silicon business remains unproven
    - Monitor whether Velaura discloses any AI-specific bookings to offset legacy-business decline
  notes: The central concentration risk this table surfaces is that Velaura's best-evidenced customer relationship (MARA) is not independent, while its most independent named customer (GDA) is a single
