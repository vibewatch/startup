  - - Physical AI / robotics OEMs
    - 'Buyer/payer: robotics R&D and BOM budget; user: autonomous-machine operators'
    - Battery-life and thermal-constrained embodied AI compute
    - No disclosed customers or deployed units
    - Aspirational segment; no revenue evidence
    - No named customer, deployed unit count, or case study identified
  - - Edge AI device makers
    - 'Buyer/payer: device OEM component budget; user: end device users'
    - Local, energy-efficient AI inference on consumer/IoT devices
    - No disclosed customers or deployed units
    - Aspirational segment; least detailed of all four
    - Least evidenced segment; no product specifics or customer identified
  notes: Segments are drawn from Velaura's own product-line disclosures (legacy Teraflux vs. Titan Core across data center, Physical AI, and Edge AI); scale and named-customer evidence quality vary sharply,
    with the legacy hardware business the only segment carrying independently corroborated named customers.
