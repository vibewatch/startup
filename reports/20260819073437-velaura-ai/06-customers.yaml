  title: Best-evidenced customer relationship (MARA) is not independent
  body: MARA's $73.3M H1 2025 purchase is the only SEC-filing-corroborated customer transaction available, but MARA is also a Velaura investor holding a board seat, meaning this strongest evidence point
    cannot be treated as an arms-length demand signal.
  claimRefs:
