  body: Every independently corroborated named customer (MARA, GDA) relates to Velaura's legacy, strategically de-prioritized Bitcoin-mining hardware business; the Titan Core AI-silicon business underpinning
    the $1B+ Series A valuation has no named customer, deployed unit, or independent confirmation of production status.
