    - Historical hardware-sale revenue; $80M bookings disclosed at Series B (2024)
    - Only 2 of 30+ claimed customers (MARA, GDA) are individually named and independently corroborated
  - - Hyperscale cloud providers (Titan Core)
    - 'Buyer/payer: hyperscaler infrastructure/capex leadership; user: cloud silicon design teams'
    - Licensing power-efficiency IP into AI accelerator designs
    - 3 of 4 largest cloud providers reportedly engaged (unnamed)
