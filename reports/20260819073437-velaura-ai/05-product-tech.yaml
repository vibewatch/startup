  - - Titan Core IP (Edge AI)
    - Consumer electronics / IoT device OEMs
    - Marketed as a target segment on company site; least detailed of the three
    - Positioned for longer battery life and local inference
    - Least evidenced of the three segments; no product specifics disclosed
  - - Teraflux bitcoin-mining hardware (legacy)
    - Bitcoin mining operators (e.g., MARA)
    - Mature, shipped at volume (30M+ ASICs cumulative); being wound down / shifted to in-house mining per 2026 rebrand
    - 9.8 J/TH efficiency, up to 600 TH/s, air/immersion/hydro-cooled variants, 4nm process
