- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User Job
  - Current Workflow (Status Quo)
  - Company Solution
  - Measurable Benefit
  - Limitation
  rows:
  - - Hyperscaler silicon team wants to cut AI accelerator power draw
    - In-house low-power design using commercial EDA tools (Cadence Cerebrus, Synopsys DSO.ai) or accept incumbent GPU efficiency roadmap
    - License Titan Core IP; submit RTL design and priorities; receive optimized GDS/chiplet
    - Up to 2-4x MATMUL efficiency improvement; ~$1,300/XPU savings over 3 years (company estimate)
    - Requires 12-24 month integration/qualification cycle; royalty measurement methodology undisclosed
  - - Data center operator wants to reduce total electricity/cooling spend at fleet scale
    - Absorb rising power costs or invest in facility-level cooling/power upgrades
    - Deploy accelerators embedding Titan Core IP for fleet-wide performance-per-watt gains
    - Up to $100M/year claimed savings for a typical data center (company estimate, assumption-dependent)
    - Savings estimate depends on stated assumptions (10c/kWh, unit volume) not independently validated
  - - Robotics/drone OEM wants longer battery life for autonomous machines
    - Select from existing edge AI chips optimized primarily for cost or raw performance
    - Integrate Titan Core-based Physical AI silicon for improved performance-per-watt
    - Company-claimed efficiency parity with data-center product; no disclosed customer-specific benefit figure
    - No named Physical AI customer or measured benefit disclosed yet
  - - Bitcoin mining operator wants efficient, US-manufactured mining hardware
    - Import Bitmain/MicroBT ASIC miners from Asia-based suppliers
    - Purchase Teraflux air/immersion/hydro-cooled miners from Velaura's legacy hardware line
    - 9.8 J/TH efficiency, up to 600 TH/s, US-based support and customs/tariff advantages
    - This product line's ongoing strategic priority is unclear post-AI pivot
  notes: Measurable benefits are drawn from company-disclosed estimates except where an independent source is cited; none of the specific dollar or efficiency figures has third-party benchmark confirmation.
