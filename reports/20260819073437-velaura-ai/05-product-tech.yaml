  - - Titan Core IP (Physical/Embodied AI)
    - Robotics, drone, and autonomous-machine OEMs
    - Marketed as a target segment; no named customer or deployed unit count disclosed
    - Battery-life/thermal-envelope efficiency framing distinct from data-center pitch
