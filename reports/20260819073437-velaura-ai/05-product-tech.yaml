- id: deployment-workflow-dependencies
  title: Deployment, Workflow, and Critical Dependencies
  body: 'For a hyperscaler silicon team, the alternative to licensing Titan Core is pursuing similar power-efficiency gains in-house using commercial EDA tools such as Cadence''s Cerebrus AI Studio or Synopsys''s
    DSO.ai, both of which provide AI-driven low-power design automation as of 2026 - meaning Velaura''s value proposition rests on its pre-built libraries and engineering expertise outperforming what a
    well-resourced in-house team could achieve with commodity tooling. Once a customer engages, Velaura''s delivery depends on several external dependencies outside its direct control: the customer must
    be willing to share proprietary RTL under NDA, advanced-node foundry capacity (at partners such as TSMC or Samsung Foundry) must be available to physically implement the ultra-low-voltage design, and
    Velaura''s own specialized low-voltage circuit engineering team - a comparatively small, hard-to-replicate group - must execute the physical-design toolflow. Notably, Samsung Catalyst Fund''s position
    as both a Velaura investor and Samsung''s foundry-linked venture arm creates a plausible (though undisclosed) strategic foundry relationship worth separate diligence. On the customer side, Velaura''s
    own materials estimate up to $100 million per year in power savings for a typical data center, explicitly built on stated assumptions (10 cents/kWh electricity pricing and roughly $433.30 per chip per
    year across 100,000 to 250,000 units) rather than a customer-specific measured result, and this transparency about assumptions is notably greater than the company''s undisclosed royalty-rate methodology
    covered in the Financials chapter.'
  claimRefs:
  - CE003
  - CE023
  - CE026
  - CE022
  tableRefs:
  - TE002
  - TE003
  figureRefs:
  - FE002
  - FE003
- id: maturity-evidence-differentiation
  title: Maturity, Evidence Strength, and Differentiation Across Segments
  body: 'Evidence strength varies sharply across Velaura''s three target segments. The data-center product line is best evidenced: the underlying low-voltage IP and toolflow has been validated across more
    than 30 million production ASICs (primarily from the legacy Teraflux bitcoin-mining business), giving Titan Core a real manufacturing-yield and reliability foundation that independent analyst Patrick
    Moorhead of Moor Insights & Strategy has reviewed favorably, saying the approach has the potential to reduce total cost of ownership and ease thermal limits for customers. By contrast, the Physical
    AI and Edge AI segments remain marketing-stage: neither Velaura''s Physical AI page nor its Solutions page names a specific robotics or edge-device customer, discloses a deployed unit count, or provides
    technical specifications distinct from the data-center pitch. The legacy Teraflux hardware line, meanwhile, has the strongest named-customer evidence of all three areas (MARA), with disclosed technical
    specifications (9.8 J/TH efficiency, up to 600 TH/s, 4nm process, multi-cooling-method variants) - though it is one process generation behind the 3nm/2nm nodes Titan Core now targets, and its strategic
    priority following the 2026 AI pivot is unclear. Independent, peer-reviewed benchmarking of the specific 2-4x MATMUL efficiency claim or the $100 million/year savings estimate does not exist in any
    source reviewed for this chapter.'
