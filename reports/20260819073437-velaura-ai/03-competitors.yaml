- id: switching-costs-distribution
  title: Switching Costs, Lock-In, and Distribution Power
  body: 'Once a hyperscaler commits to integrating Velaura''s Titan Core IP into a chip design, switching costs are likely meaningful: SoC integration and foundry-qualification cycles for a new silicon
    IP block at advanced process nodes typically span 12 to 24 months, creating real lock-in once a design win is secured but also meaning Velaura''s own revenue recognition lags any announced engagement
    by a year or more. Distribution power in the broader AI-chip value chain is concentrated: Broadcom and Marvell together provide ASIC design services behind more than 80% of hyperscaler custom silicon,
    giving them significant influence over whether third-party IP like Velaura''s gets incorporated into a given design - they could act as a channel partner that embeds Velaura''s libraries into their
    design-service offerings, or as a direct competitor if they build equivalent power-optimization capability internally. NVIDIA is responding to the broader custom-silicon shift not by competing purely
    on standalone chip performance but by selling more fully integrated racks and systems and opening its NVLink interconnect to third-party ASICs, a strategy that could either create new integration opportunities
    for Velaura''s IP or further entrench NVIDIA''s ecosystem lock-in depending on how it plays out.'
  claimRefs:
  - CP026
  - CP027
  - CP028
- id: moat-durability-adverse
  title: Moat Durability and Adverse Competitor Evidence
  body: 'Velaura''s clearest moat is production-proven manufacturing history: 30 million-plus shipped ASICs give hyperscaler partners a real yield and reliability track record that a from-scratch competitor
    cannot replicate quickly. That moat is qualified, however, by the fact that this volume was built primarily on Auradine''s bitcoin-mining chips rather than on AI-specific Titan Core silicon, so it derisks
    manufacturing execution more than it validates the AI-specific performance claim. The clearest threat to durability is commoditization risk: Cadence''s Cerebrus and Synopsys''s DSO.ai already offer
    AI-driven low-power design automation that any competitor or customer could use to pursue similar power gains in-house, and if a foundry partner (Samsung, TSMC) chose to embed equivalent libraries directly
    into its standard process design kits, much of Velaura''s differentiation could erode. The competitive-density trend in the sector cuts both ways for this assessment: Untether AI''s shutdown and Hailo''s
    acquisition reduce the number of independent low-power AI chip vendors Velaura must compete against directly, but they could equally be read as evidence that the segment cannot yet support many independent
    vendors at all - a risk that applies to Velaura as much as to any peer that has already exited.'
