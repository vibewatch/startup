callouts:
- calloutType: risk
  title: Commoditization risk from commercial EDA tools is the most credible moat threat
  body: Cadence's Cerebrus and Synopsys's DSO.ai already provide AI-driven low-power design automation that any hyperscaler or competitor could use in-house, meaning Velaura's differentiation depends on
    its libraries staying meaningfully ahead of what commodity EDA tooling can achieve.
  claimRefs:
  - CP013
  - CP034
- calloutType: strength
  title: 30M+ shipped ASICs is a rare scale proof among direct competitors
  body: Untether AI shut down and Hailo was acquired before reaching comparable independent production scale; Velaura's inherited manufacturing volume from its Auradine bitcoin-mining business is a genuine
    differentiator, even though it does not fully validate the newer AI-specific Titan Core product.
  claimRefs:
  - CP018
  - CP001
  - CP005
  - CP035
- calloutType: risk
  title: Arm's own pivot away from pure licensing is a precedent risk for Velaura's model
  body: Arm broke with three decades of pure IP licensing in 2026 to sell its own chips directly; if Velaura's hyperscaler customers gain enough internal know-how from the licensing relationship, a similar
    disintermediation risk could eventually apply to Velaura.
