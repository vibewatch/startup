company:
  name: Velaura AI
chapter:
  number: 3
  title: Competitors
  summary: Velaura AI competes against a rapidly consolidating field of direct low-power AI chip peers (Untether AI shut down, Hailo acquired, Groq reset by an NVIDIA deal, Cerebras IPO'd at ~$56B), dominant
    incumbents NVIDIA/AMD, and the more structurally important substitute of hyperscalers building equivalent power efficiency in-house via commercial EDA tools - leaving commoditization and undisclosed-customer
    risk as the two most consequential threats to Velaura's moat.
sections:
- id: competitive-landscape-overview
  title: 'Competitive Landscape: Direct, Incumbent, Adjacent, and Substitute'
  body: 'Velaura AI competes across four distinct competitive categories rather than a single well-defined peer set. Among direct low-power AI chip peers, the field has consolidated sharply in the last
    year: Untether AI, a near-memory-compute competitor, shut down in June 2025 and filed for bankruptcy in October 2025 with over $128 million in liabilities, its engineering team acqui-hired by AMD; Hailo,
    an edge-AI chip maker with roughly 100 customers, was acquired by Microchip Technology in July 2026; and Mythic required a full architecture and leadership overhaul before raising a $125 million Series
    D in December 2025. Groq illustrates how quickly comparables can re-rate: after a reported $20 billion NVIDIA deal absorbed its founding technical team and IP in December 2025, Groq pivoted business
    models entirely and raised new capital at a $3.5 billion valuation, down from $6.9 billion a year earlier. Cerebras, by contrast, validated the segment''s upside by going public in May 2026 at roughly
    a $56 billion fully diluted valuation. NVIDIA and AMD remain the dominant incumbents, together with Intel capturing the overwhelming majority of merchant data-center AI chip revenue (NVIDIA alone at
    approximately 87.4%). The most structurally important substitute, however, is internal build: hyperscalers'' own custom-silicon programs (Google TPU, AWS Trainium, Microsoft Maia, Meta MTIA) are growing
    shipments nearly three times faster than merchant GPUs, and any of these teams could in principle achieve comparable power-efficiency gains in-house using commercial EDA tools from Cadence or Synopsys
    rather than licensing Velaura''s IP.'
