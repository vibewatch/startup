  topStrengths:
    - >-
      Production-proven ultra-low-power silicon design methodology validated across 30M+ shipped ASICs, a rare scale
      proof among early-stage AI-silicon competitors.
    - >-
      Credible, experienced leadership and board (Apple/NVIDIA/Google/Qualcomm/Marvell alumni; Intel CEO Lip-Bu Tan and
      MARA CEO Fred Thiel on the board).
    - >-
      Favorable macro tailwinds: AI data-center electricity demand nearly doubling by 2030 and a 9.3 GW US power
      shortfall directly increase the value of performance-per-watt technology.
    - >-
      Independent, audited corroboration of a rising valuation mark via MARA Holdings' SEC 10-Q fair-value gains, rather
      than relying solely on company press releases.
  topRisks:
    - >-
      Zero named customers exist for the Titan Core AI-silicon business the $1B+ valuation is actually built on; all
      traction claims trace back to company statements repeated by press.
    - >-
      No disclosed revenue, royalty rate, gross margin, cash position, burn, or runway for any part of the business,
      making the valuation impossible to benchmark against comparables.
    - >-
      Commoditization risk from commercial EDA tools (Cadence Cerebrus, Synopsys DSO.ai) that could let hyperscalers
      replicate Velaura's efficiency gains in-house.
    - >-
      Velaura's best-evidenced customer relationship (MARA) is also a related-party investor, while its addressable
      legacy hardware market (Bitcoin miners) is structurally shrinking as the industry pivots to AI/HPC colocation.
    - >-
      The AI-silicon comparable set is extremely volatile within a single year (Groq's ~50% valuation reset, Untether
      AI's bankruptcy, Cerebras's ~$56B IPO), so today's valuation mark may not be durable.
  unresolvedGaps:
    - Velaura's actual AI-silicon revenue, royalty rate, and royalty-measurement methodology.
    - At least one named, independently confirmed hyperscaler, robotics, or edge-device customer for Titan Core.
    - Current cash-on-hand, monthly burn, and runway following the August 2026 Series A.
    - A reconciled headcount figure (public estimates range from 62 to 100-150 employees).
    - An independent, peer-reviewed benchmark of the claimed 2-4x MATMUL performance-per-watt improvement.
    - 'Cap-table detail: liquidation preference stack, anti-dilution terms, and option pool sizing.'
