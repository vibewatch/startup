        - {label: "Bolt", x: 8, y: 4, note: "Multi-category mobility and delivery are supported; Thai-local depth is not established."}
        - {label: "Deliveroo", x: 4, y: 3, note: "Food marketplace capability is supported; the profile records acquired status."}
        - {label: "StoreHub", x: 4, y: 6, note: "Merchant software breadth is supported; consumer-demand aggregation is not its core proposition."}
        - {label: "Robinhood", x: 3, y: 8, note: "Thai food and grocery delivery are supported; scale and economics are not disclosed."}
        - {label: "WhyQ", x: 3, y: 4, note: "Food-court aggregation is supported; Thailand-specific scale is not established."}
      xAxis: "Ecosystem breadth (ordinal, 1-10)"
      yAxis: "Thai-local distribution and merchant relevance (ordinal, 1-10)"
    approximationNotes: Coordinates are ordinal analyst synthesis from the retained source descriptions, not independently measured market shares, revenues, or scores.
    claimRefs: [CP002, CP003, CP005, CP006, CP014]
callouts:
  - calloutType: risk
    title: The moat is unproven
    body: Ecosystem breadth is visible, but public evidence does not yet show that cross-service usage, merchant retention, or unit economics are better than the alternatives after incentives and integration costs.
    claimRefs: [CP015, CP016]
