      - [StoreHub, "Sales consultation and package discussion; public price not retained", "All-in-one POS, integrations, security, support", "Package and discount unknown", "Competes for merchant software budget"]
      - [Bolt, "Public price or commission not retained", "Ride-hailing, food and grocery delivery", "Thailand pricing and incentives unknown", "Can pressure mobility and delivery pricing"]
      - [Robinhood, "Public price or commission not retained", "Food and grocery delivery", "Funding amount, pricing, and incentives unknown", "Local alternative may pressure merchant and consumer pricing"]
      - [Direct ordering / internal build, "No public comparable cost model retained", "Merchant-owned customer relationship and workflow", "Demand generation, delivery, and internal operating cost unknown", "Status quo may win where platform ROI is weak"]
    notes: No source in the assigned pool provides a comparable current list-price schedule or realised take rate across providers; blanks are deliberate diligence gaps, not zero prices.
    claimRefs: [CP003, CP006, CP008, CP009, CP010, CP011, CP016]
