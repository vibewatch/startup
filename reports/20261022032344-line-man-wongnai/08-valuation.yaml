company:
  name: "LINE MAN Wongnai"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    LINE MAN Wongnai has credible scale and improving 2025 gross-profit growth, but its
    last disclosed valuation is the 2022 Series B mark and 2025 net loss widened sharply.
    The appropriate public-evidence conclusion is research-more with high risk and strict
    price discipline until current capital structure, cash flow, and transaction terms
    can be verified.
sections:
  - id: "recommendation-and-price-discipline"
    title: "Recommendation and price discipline"
    body: >-
      The recommendation is research-more, with medium confidence, high risk, and an
      unpriced rather than bullish valuation stance. LINE MAN Wongnai's official July
      2026 factsheet still anchors valuation to the September 2022 Series B, when the
      company raised US$265 million at more than US$1 billion. That mark is useful
      historical context, not a current clearing price. Applying its lower bound to
      Tech in Asia's reported US$544 million of 2025 revenue produces a rough floor of
      1.8x revenue, but this comparison mixes a 2022 post-money equity value with later
      accounting revenue and ignores cash, debt, preferences, and dilution. It therefore
      cannot support a point valuation or expected return. A disciplined investor should
      require current fully diluted ownership and audited cash-flow evidence before
      treating the old unicorn mark as investable.
    claimRefs: ["CV001", "CV002", "CV004", "CV006", "CV014", "CV015"]
    tableRefs: ["TV001"]
    figureRefs: ["FV001"]
  - id: "thesis-and-anti-thesis"
    title: "Thesis and anti-thesis"
    body: >-
      The positive case is operational rather than valuation-specific. The company
      reports more than 10 million monthly active users, more than 500,000 partner
      restaurants, and nationwide coverage, while independent reporting says 2025
      revenue rose 21% and gross profit rose 39%. On-demand services nevertheless
      represented 88% of revenue, leaving the model concentrated in a competitive,
      promotion-sensitive category. The anti-thesis is reinforced by the reported
      US$43 million net loss, up nearly 91%, and by company data showing restaurant
      sales per store fell 14% in Q2 2025 before a stimulus-supported rebound. The
      CEO attributed the wider loss to unspecified one-off non-cash items, so accounting
      loss must not be treated as cash burn, but the adjustment also remains
      insufficiently documented for underwriting.
    claimRefs: ["CV004", "CV005", "CV006", "CV007", "CV009", "CV010", "CV011"]
    tableRefs: ["TV002"]
  - id: "scenarios-and-comparable-context"
    title: "Scenarios and comparable context"
    body: >-
      Public comparable evidence supplies a wide reference band, not a defensible
      company multiple. Multiples lists selected platform companies from 0.7x to 10.6x
      LTM revenue, a spread that reflects materially different business models,
      geographies, margins, and public-market liquidity. Toast is directionally relevant
      to the merchant-software and payments portfolio, but its official overview provides
      no valuation metric in the retained evidence. The bull case requires sustained
      revenue and gross-profit growth plus a verified loss reversal; the base case treats
      the 2022 mark as a ceiling for diligence rather than an entitlement; and the bear
      case assumes multiple compression and continued losses. No scenario receives a
      numeric probability or point-value range because current net cash, preference
      terms, segment margins, and fully diluted shares are unavailable.
    claimRefs: ["CV004", "CV005", "CV006", "CV012", "CV013", "CV014", "CV015"]
    tableRefs: ["TV003"]
  - id: "exit-readiness-and-final-diligence"
    title: "Exit readiness and final diligence"
    body: >-
      Exit intent is visible but readiness is not proven. Thai Times reports that the
      company paused a planned 2025 Thai IPO amid weak domestic market conditions and
      is considering Hong Kong or the United States for deeper liquidity and a premium
      valuation. A venue search may improve optionality, but it does not establish that
      investors will accept the requested price or that governance and reporting meet
      public-market standards. The final diligence package should include audited
      FY2025-FY2026 consolidated and segment statements, operating-to-cash-flow
      reconciliation, the nature of 2025 non-cash charges, net debt and liquidity,
      fully diluted ownership, preference and minority-rights terms, cohort economics,
      and IPO governance materials. Thesis-break triggers are a failure to convert gross
      profit growth into sustainable cash generation, a down round below the 2022 mark,
      or continued exit delays without stronger disclosure.
    claimRefs: ["CV006", "CV008", "CV015", "CV016"]
tables:
  - id: "TV001"
    title: "Recommendation summary"
    columns: ["Decision field", "Assessment", "Evidence basis", "Decision implication"]
    rows:
      - ["Recommendation", "Research more", "Scale and growth are credible, but valuation and capital-structure evidence are stale or missing.", "Do not issue a buy decision from public evidence alone."]
      - ["Confidence", "Medium", "Revenue and gross-profit data are reported from audited statements, while loss adjustments and financing terms remain incomplete.", "Confirm the adjustment bridge and cash flow before increasing confidence."]
      - ["Risk rating", "High", "Net loss widened nearly 91% to US$43M and 88% of revenue remained in on-demand services.", "Require downside protection and explicit operating milestones."]
      - ["Valuation stance", "Unpriced / price-sensitive", "The last disclosed mark is over US$1B from September 2022; no current transaction price is verified.", "Treat the old mark as context, not a floor."]
      - ["Return and exit", "Not supportable publicly", "The IPO venue remains under consideration and fully diluted ownership is unavailable.", "Underwrite return only after entry price, dilution, preferences, and exit structure are disclosed."]
    notes: "Assessments combine disclosed historical financing, reported 2025 operating results, and explicit evidence gaps; no current price or target return is estimated."
    claimRefs: ["CV002", "CV006", "CV007", "CV008", "CV014", "CV015", "CV016"]
  - id: "TV002"
    title: "Thesis and anti-thesis"
    columns: ["Side", "Argument", "Current evidence", "What would change the view"]
    rows:
      - ["Thesis", "Scaled local ecosystem", "Company reports 10M+ monthly active users, 500K+ partner restaurants, and nationwide reach.", "Independent usage, order-frequency, and cohort-retention evidence would strengthen the moat case."]
      - ["Thesis", "Improving gross-profit trajectory", "2025 revenue rose 21% to US$544M and gross profit rose 39% to US$141M.", "Sustained growth with positive operating cash flow would support a higher-quality multiple."]
      - ["Anti-thesis", "Loss quality remains unresolved", "2025 net loss widened nearly 91% to US$43M; one-off non-cash items were not specified.", "An audited adjustment bridge and cash-flow reconciliation could reduce this risk."]
      - ["Anti-thesis", "Demand and subsidy sensitivity", "Restaurant sales per store fell 14% in Q2 2025 before improving during Half-Half Plus.", "Growth sustained after stimulus expiry would weaken the downside case."]
    notes: "Scale metrics are company-issued; financial metrics are reported by Tech in Asia from audited statements; restaurant trends are company platform data."
    claimRefs: ["CV004", "CV005", "CV006", "CV009", "CV010"]
  - id: "TV003"
    title: "Bull / base / bear scenarios"
    columns: ["Scenario", "Probability signal", "Operating assumptions", "Valuation / return logic", "Downside or confirmation trigger"]
    rows:
      - ["Bull", "Unquantified; requires new evidence", "Revenue and gross profit sustain at least the reported 2025 direction, adjusted EBITDA improves, and losses convert toward cash generation.", "A premium to the historical mark is considered only after current net cash, preferences, and segment economics are verified.", "Positive audited operating cash flow and a priced IPO with transparent governance."]
      - ["Base", "Current working case", "Growth moderates, on-demand remains dominant, and merchant/payments diversification develops without a demonstrated cash inflection.", "Use the historical mark and rough 1.8x cross-vintage revenue floor only as negotiation context; no point value is supportable.", "Current cap table plus audited segment margins and cash-flow bridge become available."]
      - ["Bear", "Material and observable", "Losses persist, stimulus-supported demand fades, or public-market timing slips again.", "Require a material discount to the 2022 mark; no numeric floor is supportable without balance-sheet and preference data.", "Down round, sustained negative cash generation, or another IPO delay without stronger disclosure."]
    notes: "Scenarios are underwriting frames, not forecasts; probabilities and numeric valuation ranges are intentionally omitted because current capital structure, cash, debt, and transaction price are unavailable."
    claimRefs: ["CV004", "CV005", "CV006", "CV007", "CV008", "CV010", "CV013", "CV014", "CV015"]
