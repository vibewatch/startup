callouts:
  - calloutType: insight
    title: Ecosystem breadth is the opportunity, not a single TAM
    body: "The investment case depends on converting shared consumer, merchant and payment relationships into repeatable multi-service monetization; category size alone does not prove that conversion."
    claimRefs: [CM001, CM003, CM013, CM018]
  - calloutType: risk
    title: Public market denominators remain inconsistent
    body: "Food-delivery market value, LMWN revenue, PromptPay transaction value and third-party revenue bands use different populations, units and periods, so valuation work should not combine them without a reconciled bridge."
    claimRefs: [CM006, CM007, CM008, CM009, CM010]
