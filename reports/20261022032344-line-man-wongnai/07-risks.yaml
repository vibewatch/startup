company:
  name: LINE MAN Wongnai
chapter:
  number: 7
  title: Risks
  summary: LINE MAN Wongnai's principal exposures are regulatory complexity across delivery, payments, ride-hailing and telepharmacy; concentration in on-demand revenue; and execution risk around a potential overseas IPO while audited 2025 losses widened. The public record shows concrete compliance requirements and operating concentration, but remains incomplete on incidents, cash runway, control terms and customer-level loss experience.
sections:
  - id: regulatory-and-legal
    title: Regulatory and legal exposure
    body: LINE MAN Wongnai operates across categories with distinct regulatory obligations rather than one uniform software regime. ETDA's 2026 roadmap covers online marketplaces, ride sharing, fee transparency and online-fraud prevention, including verification, notice-and-takedown, driver registration and possible risk-based identity checks. The Thai FDA separately lists LINE MAN as one of seven applications approved for telepharmacy, but pharmacies must be licensed, use pharmacists, operate during store hours, use approved applications and provide traceable delivery. These rules create ongoing implementation, monitoring and data-governance costs. The public sources reviewed do not establish a current enforcement action, litigation docket, privacy incident or completed control test; those are diligence gaps, not evidence of absence.
    claimRefs: [CR001, CR002, CR003, CR004, CR005]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: operating-and-financial
    title: Operating, quality and financial-model risks
    body: Operating risk is amplified by the breadth of the platform and by revenue concentration. Tech in Asia reports that on-demand services represented 88% of 2025 revenue and grew 19% year on year, while total revenue reached US$544 million and net loss widened nearly 91% to US$43 million. Management attributed the broader loss primarily to one-off non-cash accounting items, but the article does not specify those items, so the explanation cannot be treated as a cash-flow reconciliation. The same article reports gross profit of US$141 million and an expectation of materially better adjusted EBITDA in 2026; that forecast is not audited evidence. The combination of concentration, delivery execution, subsidy sensitivity and non-cash accounting complexity warrants downside monitoring.
    claimRefs: [CR006, CR007, CR008, CR009, CR010]
    tableRefs: [TR002]
  - id: partner-capital-and-thesis-breaks
    title: Partner, capital and thesis-break risks
    body: The company depends on strategic relationships and external capital while pursuing a listing venue that remains unsettled in the available record. TechCrunch reports backing from GIC, Z Holdings and BRV Asia, more than US$372 million raised and a valuation above US$1 billion, while the CEO described continued execution, restructuring and assessment of capital-structure and financing options as priorities. Thai Times reports that domestic IPO plans were paused amid weak market sentiment and that the company was considering Hong Kong or the United States to access deeper liquidity. These reports establish financing and venue uncertainty, not a committed transaction. A failed listing, delayed capital raise, loss of a strategic distribution or payments partner, or deterioration in adjusted profitability would materially weaken the thesis.
    claimRefs: [CR011, CR012, CR013, CR014]
    tableRefs: [TR003]
