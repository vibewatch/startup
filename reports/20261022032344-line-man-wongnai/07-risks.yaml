      - [Ride-sharing platform obligations, Thailand, "ETDA roadmap; driver-registration work noted", high, high, "Driver Verify registration and coordination with transport and insurance authorities", "Insurance, vehicle and contract-transfer rules remain evolving", "Verify driver-registration coverage, insurance allocation and remediation backlog"]
      - [Online-fraud prevention, Thailand, Draft notification described by ETDA, medium, high, "Risk-based seller/advertiser identity checks and data retention planning", "Draft may impose new systems and retention costs", "Review applicability, implementation plan and retention/deletion controls"]
      - [Marketplace verification and takedown, Thailand, 21 platforms designated under Section 18(2) measures, high, high, "Verification, screening and removal or suspension of substandard offerings", "Effectiveness and exception handling are not disclosed", "Test takedown logs, appeal outcomes and merchant-risk segmentation"]
      - [Telepharmacy licensing and pharmacist controls, Thailand, LINE MAN listed among seven approved applications, medium, high, "Licensed pharmacies, pharmacists, approved app and traceable delivery", "Approval does not prove operating compliance at scale", "Obtain approvals, pharmacist coverage, audit logs and service-area controls"]
      - [Personal-data and security obligations in telepharmacy, Thailand, FDA approval criteria include information security and privacy, medium, high, "Use approved application and governed delivery workflow", "No independent security or privacy assurance was found", "Request DPA, penetration tests, breach register and access-control evidence"]
      - [Fee transparency and competition scrutiny, Thailand, ETDA studying e-commerce fees; logistics regulator designated, medium, medium, "Monitor fee structures and regulator engagement", "Changes could affect take rates or merchant economics", "Model fee-rule scenarios and obtain legal advice on logistics classification"]
