callouts:
  - calloutType: risk
    title: The largest disclosed risk is concentration plus accounting opacity
    body: On-demand services represented 88% of 2025 revenue while reported net loss widened to US$43 million; management's non-cash explanation is not accompanied by a disclosed itemization or cash-flow bridge in the assigned evidence.
    claimRefs: [CR006, CR007, CR008]
  - calloutType: risk
    title: Regulatory permission is not the same as operating assurance
    body: LINE MAN is listed as an approved telepharmacy application, but the FDA announcement places licensing, pharmacist, approved-app, traceable-delivery and geographic obligations on participating pharmacies; implementation evidence remains a diligence requirement.
    claimRefs: [CR003, CR004, CR005]
  - calloutType: recommendation
    title: Thesis-break monitoring
    body: Escalate the risk view if adjusted EBITDA improvement is not reconciled to audited cash flow, if on-demand share remains near the reported 88% without margin resilience, if a material regulatory or security incident emerges, or if a proposed IPO requires unfavorable control or preference terms.
    claimRefs: [CR006, CR007, CR011, CR012, CR014]
