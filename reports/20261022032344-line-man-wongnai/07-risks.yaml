      - [Merchant/product quality exposure, medium, high, "ETDA notice-and-takedown and verification framework exists", "Control effectiveness and merchant exceptions are not public", "Review incident taxonomy, takedown rates and customer remediation"]
      - [Data-security or privacy incident, medium, high, "FDA approval process considers information security and privacy", "No independent assurance or incident history was found", "Request breach register, SOC evidence, DPA map and tabletop results"]
      - [Fintech execution and loss exposure, medium, high, "Payments and financial services are a reported core business", "Credit-loss, fraud-loss and regulatory-capital metrics are unavailable", "Obtain product-level loss, fraud, float and licensing data"]
