    notes: "Scale signals come from differently dated sources and are not comparable customer counts; the user, payer and buyer roles can overlap."
    claimRefs: [CU001, CU003, CU005, CU006, CU007]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Date/period, Source, Confidence, Implication, Missing denominator]
    rows:
      - ["Monthly active users", "10 million", "Reported in 2022 interview", "Korea Herald", "Medium", "Indicates material consumer reach", "Definition, geography and current level"]
      - ["Food delivery coverage", "77 provinces", "November 2021", "LMWN About Us", "Medium", "Shows geographic rollout", "Active locations, orders and service quality"]
      - ["App-store ratings", "904,000 ratings; 4.9/5", "App listing accessed 2026-10-22", "Apple App Store", "Medium", "Shows substantial user feedback volume", "Unique users, review bias and repeat use"]
      - ["On-demand revenue share", "88% of total revenue", "2025", "Tech in Asia", "Medium", "Shows commercial dependence on on-demand services", "Customer-level revenue concentration and margin"]
      - ["Wongnai POS operators", "More than 50,000", "2023 acquisition announcement", "LMWN", "Medium", "Shows merchant software adoption signal", "Active, paying and retained operator counts"]
    notes: "Values are not a single funnel: users, geographic coverage, ratings, revenue mix and merchant operators have different units, populations and dates."
    claimRefs: [CU004, CU005, CU007, CU008, CU009]
  - id: TU003
    title: Named customer proof table
    columns: [Customer/proof surface, Segment, Deployment/use case, Production vs pilot, Outcome, Limitation, Source support]
    rows:
      - ["Wongnai POS operators", "Restaurants/local merchants", "Restaurant management and POS", "Operational service claimed; individual deployments not named", "More than 50,000 trusted restaurant operators claimed", "No audited outcome or retention data", "LMWN FoodStory release plus About Us"]
      - ["FoodStory restaurant operators", "Premium and chain restaurants", "POS and merchant management", "Existing operating business acquired", "FoodStory technology and staff integrated into merchant solutions", "No customer-level case studies or quantified outcomes", "LMWN FoodStory release"]
      - ["LINE MAN consumer app", "Consumers", "Food delivery and related on-demand services", "Live public app", "4.9/5 from 904,000 ratings on App Store", "Ratings do not prove active use, retention or economics", "Apple App Store"]
    enumerationScope:
      coverage: partial
      basis: "Named customer proof is limited to public product, merchant and app evidence available in the assigned 2026 refresh pool."
    notes: "The public pool contains few named end-customer organizations; logos and aggregate counts are not treated as proof of production outcomes or retention."
    claimRefs: [CU006, CU008, CU009]
figures:
  - id: FU001
    title: Customer journey from discovery to expansion
    type: journey-map
    summary: "The platform can connect consumer demand, merchant operations and adjacent services, but the expansion loop is an analytical model rather than a disclosed retention funnel."
    data:
      items:
        - label: Restaurant discovery
          description: Wongnai discovery and review surface introduces consumers to local merchants.
          touchpoints: [Reviews, menus, delivery]
        - label: On-demand transaction
          description: LINE MAN provides food, grocery, ride or messenger fulfilment.
          touchpoints: [Ordering, delivery, ride]
        - label: Merchant enablement
          description: Wongnai POS and FoodStory provide restaurant management tools.
          touchpoints: [POS, merchant app, reporting]
        - label: Adjacent services
          description: Payments, grocery, mobility and other services create potential cross-service use.
          touchpoints: [Payments, grocery, mobility]
        - label: Consumer feedback
          description: App ratings provide a visible but imperfect adoption signal.
          touchpoints: [Ratings, reviews]
        - label: Merchant expansion
          description: FoodStory extends the merchant proposition toward premium and chain restaurant workflows.
          touchpoints: [POS, chains]
        - label: Retention proof gap
          description: Cohort retention and repeat-frequency data remain undisclosed in the assigned sources.
          touchpoints: [Cohorts, renewals]
    approximationNotes: "The sequence presents disclosed product surfaces in customer-facing order; it does not imply conversion, retention or causal cross-sell rates."
    claimRefs: [CU001, CU002, CU006, CU009, CU012]
