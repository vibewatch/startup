company:
  name: LINE MAN Wongnai
chapter:
  number: 6
  title: Customers
  summary: LINE MAN Wongnai has broad Thai consumer and merchant reach, but public evidence distinguishes platform scale and named merchant deployments more clearly than it proves retention, active usage, or customer economics. The strongest adoption signals are a large app rating base, nationwide service coverage, and merchant/POS integration; cohort durability and concentration remain material gaps.
sections:
  - id: customer-segments
    title: Customer segments and value exchange
    body: >-
      LINE MAN Wongnai serves several linked customer groups rather than one homogeneous
      buyer. Consumers use LINE MAN for food, grocery, transport and messaging services;
      restaurants and other local businesses use discovery, ordering and POS tools; riders
      supply the delivery and mobility network. The company describes its platform as
      connecting consumers, riders and local businesses, while its public history records
      a 2020 merger that combined delivery with restaurant discovery. This creates a
      plausible multi-sided local-commerce proposition, but the available record does not
      disclose how transaction volume, revenue or contribution margin is split by segment.
      The 2025 reporting that on-demand services represented 88% of revenue provides a
      directional mix, not a customer-count or retention measure.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-proof
    title: Adoption trajectory and named proof
    body: >-
      Adoption evidence is strongest where it is tied to an observable product surface or
      named merchant workflow. The iOS listing reports 904,000 ratings and a 4.9/5 score,
      which signals substantial user interaction but does not equal active users or repeat
      orders. The company says FoodStory had more than 11 years working with restaurant
      operators, and its CEO described Wongnai POS as serving more than 50,000 trusted
      restaurant operators at the 2023 acquisition. The company also reports food delivery
      reaching all 77 Thai provinces by November 2021 and says LINE MAN was the most
      downloaded Thai food-and-drink app in 2022. These are useful adoption markers, but
      several are company claims or historical snapshots; public evidence does not provide
      current active-user denominators, cohort retention, order frequency or verified
      production outcomes for each named merchant.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-and-concentration
    title: Durability, expansion and concentration risk
    body: >-
      The platform has an expansion path from food discovery and delivery into grocery,
      ride-hailing, merchant software and payments. FoodStory extends the merchant side
      into premium and chain restaurants, while the app listing shows a mature consumer
      surface with delivery, location-linked data and user-generated content. However,
      public disclosures do not establish net or gross retention, churn, contract duration,
      subsidy-normalised repeat behaviour, or top-customer concentration. Independent
      market reporting also shows that Thai food delivery is capital-intensive and
      consolidating: in 2023 LINE MAN Wongnai reported THB18 billion revenue and a
      THB563 million loss, while the sector observer described heavy promotional
      requirements and the exit of Robinhood. This supports a durability risk, not a
      conclusion that customers are leaving. The next diligence step is a customer cohort
      pack with active-user definitions, repeat frequency, retention by segment, merchant
      tenure and concentration.
    claimRefs: [CU010, CU011, CU012, CU013]
    callouts:
      - calloutType: risk
        title: Retention is not publicly demonstrated
        body: Public scale signals do not substitute for cohort retention, renewal, churn or subsidy-normalised order economics.
        claimRefs: [CU005, CU010, CU011]
      - calloutType: insight
        title: Merchant software is an expansion surface
        body: FoodStory and Wongnai POS provide named merchant workflows that can deepen the platform relationship beyond a single delivery transaction.
        claimRefs: [CU006, CU009]
