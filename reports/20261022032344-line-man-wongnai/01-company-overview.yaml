company:
  name: LINE MAN Wongnai
chapter:
  number: 1
  title: Company Overview
  summary: LINE MAN Wongnai is a Bangkok-headquartered Thai local-commerce platform formed by the 2020 merger of Wongnai and LINE MAN. Current evidence supports meaningful ecosystem breadth, a 2022 unicorn financing, and 2025 revenue growth, but private-company governance, control terms, and the quality of reported loss adjustments remain incompletely disclosed.
sections:
  - id: identity-and-model
    title: Identity and operating model
    body: >-
      LINE MAN Wongnai describes its mission as digitalizing everyday life services and
      connecting consumers, riders, and local businesses through its platforms. The
      company website identifies LINE MAN, Wongnai, LINE MAN Rider, and Wongnai Merchant
      & POS as core surfaces. Wongnai began as a restaurant-discovery and review business
      in 2010, while LINE MAN launched in Thailand in 2016; the two businesses merged in
      2020 after a $110 million investment. The combined platform now spans food and
      grocery delivery, ride-hailing, messenger services, restaurant discovery, merchant
      POS, and payments. This is a Thailand-focused local-commerce model rather than a
      geographically diversified regional network, so local execution, merchant density,
      and the LINE ecosystem are central operating dependencies.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: funding-and-scale
    title: Funding, scale, and current financial signals
    body: >-
      The financing record is comparatively clear through September 2022: a $110 million
      2020 Series A was followed by a $265 million Series B led by GIC and LINE Plus,
      producing a reported valuation above $1 billion. Independent databases repeat a
      $375 million cumulative total, but the company remains private and the pool does
      not provide a current fully diluted cap table or preference stack. Recent reporting
      gives a more current operating signal: audited 2025 revenue was reported at $544
      million, up 21% year on year, while net loss widened nearly 91% to $43 million.
      Management attributed the wider loss primarily to
      one-off non-cash accounting items, but the article says those items were not
      specified; therefore accounting loss should not be treated as cash burn or as proof
      of operating profitability.
    claimRefs: [CO006, CO007, CO008, CO013, CO014, CO015]
    tableRefs: [TO003]
  - id: leadership-and-governance
    title: Leadership, ownership, and governance
    body: >-
      Yod Chinsupakul is identified as CEO and Wongnai co-founder, while In Young Chung
      is identified in earlier reporting as CFO. The founders' origin story is unusually
      specific: the official history names four Chulalongkorn University engineering
      classmates, with Yod later drawing inspiration from Yelp while studying at UCLA.
      The public record also shows strategic investors and parent-ecosystem relationships
      involving GIC, LINE or its successor entities, BRV Capital Management, PTT Oil and
      Retail, Taiwan Mobile, and Bualuang Ventures. However, no assigned source provides
      a complete board roster, voting agreement, preference stack, or key-person
      succession plan. Those omissions matter because an eventual IPO venue decision and
      the integration of payments and merchant software could materially affect control
      and minority-holder rights.
    claimRefs: [CO002, CO008, CO012]
    tableRefs: [TO002]
  - id: milestones-and-open-issues
    title: Milestones and diligence implications
    body: >-
      The milestone record shows a progression from restaurant discovery to an integrated
      local-commerce ecosystem: provincial expansion, the LINE MAN partnership, the 2020
      merger, the 2022 unicorn round, FoodStory and Rabbit LINE Pay transactions, and
      recent expansion into merchant, financial, and other everyday services. Reuters
      reported in 2023 that management was preparing advisers for a listing as soon as
      2025; 2026 reporting instead describes a paused domestic plan and consideration of
      Hong Kong or US venues amid weak Thai IPO conditions. The strategic direction is
      therefore credible, but the investment case still needs prospectus-grade financial
      statements, transaction terms, segment economics, and governance disclosure. The
      2025 revenue article is also partly paywalled, so its reported accounting metrics
      should be refreshed against underlying statements.
    claimRefs: [CO003, CO007, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Ecosystem breadth with local distribution
    body: The merger combined a restaurant-discovery data asset with delivery and adjacent merchant, payments, and mobility services, while LINE distribution and Thailand-only execution remain important differentiators.
    claimRefs: [CO003, CO004, CO005]
  - calloutType: risk
    title: Public-company readiness remains unproven
    body: Listing plans have shifted by venue and timing, and the assigned evidence does not disclose a full cap table, board record, preference stack, or cash-flow reconciliation for the reported 2025 loss.
    claimRefs: [CO014, CO015, CO016]
