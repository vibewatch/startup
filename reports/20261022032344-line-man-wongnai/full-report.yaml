  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and economic system
        blocks:
          - type: paragraph
            body: >
              The relevant market is a connected local-commerce system: consumers buy food, groceries, rides, messenger
              services and other everyday services; merchants acquire demand and operate through POS or digital tools;
              riders provide fulfillment; and payment rails settle online and offline transactions. This boundary
              includes transaction value and monetization attached to those workflows, including commissions, merchant
              software, advertising and payment services. It excludes unrelated national e-commerce, enterprise software
              outside local services, and the full value of financial products that are not enabled by the platform.
              LINE MAN Wongnai's own description identifies on-demand services, merchant digital solutions, and payment
              and financial services as three pillars, while its historical account shows that the business began with
              restaurant discovery and food delivery before adding grocery, ride-hailing, POS and payment capabilities.
              The market is therefore best analyzed as several overlapping spend pools with shared users, merchants and
              data, not as one interchangeable delivery revenue number.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and market momentum
        blocks:
          - type: paragraph
            body: >
              Three sizing lenses are more decision-useful than a single top-down TAM. First, Thailand's food-delivery
              pool has been reported at 86 billion baht, with LINE MAN at 44% share and GrabFood at 39.4% before
              Foodpanda's exit; this is a category estimate and should not be treated as LMWN revenue. Second, LMWN's
              2025 audited revenue was reported at US$544 million, up 21% year over year, with on-demand services
              contributing 88% of company revenue; this is a company monetization lens, not total market spend. Third,
              the Bank of Thailand reported 4,606.72 billion baht of PromptPay transaction value in July 2026,
              illustrating the scale of the surrounding digital-payment rail but not LMWN's addressable volume. The
              lenses point to a meaningful and expanding ecosystem, yet they use different units, populations and
              denominators. A defensible SAM would need LMWN's take-rate, segment gross transaction value, active-user
              definitions and overlap between delivery, POS and payment customers. Those data are not public in the
              assigned evidence.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM012
              - CM013
      - number: '2.3'
        title: Buyers, adoption path and constraints
        blocks:
          - type: paragraph
            body: >
              The buyer map is multi-sided. Consumers are the users and usually pay the checkout price; restaurants and
              local businesses are both supply partners and budget owners for commissions, POS subscriptions, promotion
              and payment acceptance; riders are labor-side participants whose economics affect service availability;
              and payment partners or regulators shape settlement and compliance. Adoption triggers differ by segment:
              consumers value selection, convenience and reliable fulfillment; merchants value incremental demand,
              operating software and cashless settlement; riders value order density and earning opportunities. The
              ecosystem can lower acquisition friction when the same account, merchant data and payment rail support
              multiple jobs, but it also creates constraints. The company describes a mature competitive market,
              macroeconomic pressure and lower average order values, while the Foodpanda exit demonstrates that scale
              does not guarantee category profitability. Capital intensity, rider support, promotion dependence,
              switching and multi-homing, data governance, and fintech regulation remain material limits on conversion
              from market activity into durable profit. Public evidence supports the adoption logic but not a clean
              customer-level retention or subsidy-normalized margin curve.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Sizing gaps and valuation implications
        blocks:
          - type: paragraph
            body: >
              The strongest conclusion is not that every adjacent category is automatically additive. The company has
              demonstrated breadth across food, rides, groceries, merchant software and payments, and the market appears
              to be concentrating after Foodpanda's exit. However, the available estimates are not directly comparable:
              a food-delivery GMV estimate, company revenue, payment-system transaction value, and third-party
              company-revenue bands answer different questions. The 2025 reported net loss also cautions against
              translating ecosystem scale into profitability without reconciling accounting items and cash economics.
              For valuation, the opportunity is attractive if cross-service frequency and merchant software/payment
              monetization create durable contribution margins; it is more fragile if growth depends on subsidies, a
              single dominant on-demand category, or regulatory-sensitive fintech expansion. The next diligence pass
              should obtain segment GTV and revenue, take rates, cohort retention, promotion funding, merchant churn,
              rider economics, and a reconciled market-share denominator.
            claimRefs:
              - CM007
              - CM010
              - CM014
              - CM018
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Ecosystem breadth is the opportunity, not a single TAM
            body: >-
              The investment case depends on converting shared consumer, merchant and payment relationships into
              repeatable multi-service monetization; category size alone does not prove that conversion.
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM013
              - CM018
          - type: callout
            title: Public market denominators remain inconsistent
            body: >-
              Food-delivery market value, LMWN revenue, PromptPay transaction value and third-party revenue bands use
              different populations, units and periods, so valuation work should not combine them without a reconciled
              bridge.
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and strategic position
        blocks:
          - type: paragraph
            body: >-
              The competitive set is broader than restaurant delivery. LINE MAN Wongnai's official history describes a
              platform connecting consumers, riders, and local businesses through LINE MAN, Wongnai, LINE MAN Rider, and
              Wongnai Merchant & POS. It also identifies three operating groupings in the 2024-2025 period: on-demand
              services, merchant digital solutions, and financial services. This creates direct overlap with food and
              grocery delivery and ride-hailing platforms, adjacent overlap with restaurant-discovery and POS software,
              and substitute pressure from direct ordering, manual merchant operations, and other payment rails. Tracxn
              lists 36 active competitors and names Deliveroo, Bolt, and Wongnai among its top competitors, but that
              ranking is a vendor taxonomy rather than an independent market-share benchmark. The strategic question is
              therefore whether cross-service usage and merchant data improve retention and distribution enough to
              offset the complexity and disclosure burden of a multi-vertical model.
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP006
              - CP009
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP006
              - CP014
      - number: '3.2'
        title: Capabilities, distribution, and switching
        blocks:
          - type: paragraph
            body: >-
              Buyer choice is likely determined by four capability bundles: demand aggregation and delivery density;
              merchant workflow and POS functionality; payment and financial-service integration; and trust, local
              coverage, and operational reliability. LINE MAN Wongnai's official account says its food delivery reached
              all 77 Thai provinces by November 2021 and that LINE MAN MART later reached all 77 provinces, indicating
              distribution breadth but not profitability or service quality. A company-issued health initiative account
              syndicated by Thai Times also says more than 60,000 restaurants participated, a reach signal rather than
              an independent benchmark. StoreHub illustrates an adjacent merchant-software proposition: it markets an
              all-in-one POS, integrations, security, and ease of use to more than 20,000 businesses across Southeast
              Asia. That is a credible alternative for merchants whose primary problem is store operations rather than
              consumer demand. The public evidence does not disclose LINE MAN Wongnai's realised commission rates,
              merchant churn, customer switching costs, or multi-homing rates, so capability leadership should not be
              treated as a measured moat.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP008
              - CP014
      - number: '3.3'
        title: Pricing, scale, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Public pricing comparability is weak. LINE MAN Wongnai's retained sources describe commission as a revenue
              model and report scale, funding, and services, but do not provide a current merchant commission card,
              consumer delivery-fee schedule, or realised POS contract price. StoreHub likewise offers a sales-led
              consultation rather than a public price list in the retained Thailand page. Tech in Asia reports that LINE
              MAN Wongnai's 2025 revenue reached US$544 million and that on-demand services represented 88% of total
              revenue, while also reporting a US$43 million net loss. That combination supports scale but not a
              conclusion that scale has translated into durable economic advantage. Grab provides a useful listed
              regional reference point, with a reported market capitalisation of US$11.53 billion in October 2026.
              However, the assigned pool does not establish Grab's Thailand-specific product or economic comparability,
              so that market capitalisation is not a direct valuation benchmark for a private Thai company. Foodpanda's
              exit from Thailand, as reported by Tech in Asia, shows that competitive intensity can change through exit
              as well as through product improvement. The key displacement risk is that delivery, payments, and merchant
              software each become commoditised while larger regional platforms retain better capital access.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP006
              - CP008
              - CP009
              - CP010
              - CP011
              - CP016
      - number: '3.4'
        title: Moat durability and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The evidence supports an ecosystem hypothesis, not a proven moat. LINE MAN Wongnai combines a restaurant
              and local-business discovery layer, delivery and ride services, merchant systems, and payments; the
              official history also records the FoodStory, Rabbit LINE Pay, and JERA Cloud transactions. These moves may
              increase cross-sell and data density, but the cited material does not establish incremental contribution
              margin, retention lift, or integration success. A competitor profile should therefore distinguish issuer
              claims from independent corroboration and avoid treating Tracxn scores as buyer preference. The most
              decision-relevant tests are cohort retention by service, order-level contribution after incentives,
              merchant overlap across POS and delivery, effective take rates, and churn when a merchant multi-homes. An
              adverse scenario is a regional competitor or incumbent using subsidies, wallet distribution, or superior
              capital access to compress prices while LINE MAN Wongnai carries the cost of a broad service footprint.
              Until those tests are disclosed, the company appears strategically differentiated in Thailand but not
              demonstrably insulated from substitution.
            claimRefs:
              - CP014
              - CP015
              - CP016
              - CP017
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The moat is unproven
            body: >-
              Ecosystem breadth is visible, but public evidence does not yet show that cross-service usage, merchant
              retention, or unit economics are better than the alternatives after incentives and integration costs.
            calloutType: risk
            claimRefs:
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              The business monetizes a connected local-commerce ecosystem rather than a single subscription product. The
              official app listing describes food delivery, ride, mart, and messenger, with delivery fees starting at
              zero baht and promotions of up to 60%; this is a consumer-facing list-price and subsidy signal, not
              realized revenue or margin. The company’s official history describes three core businesses: on-demand
              services, merchant digital solutions, and financial services. Tech in Asia reports that all three grew in
              2025, with on-demand services still 88% of total revenue and growing 19% year on year. The revenue mix is
              therefore concentrated in transaction-led services, while merchant and payments products provide potential
              cross-sell but have no public standalone take-rate, gross-margin, or retention schedule. A useful
              underwriting bridge is activity to transaction value, company revenue, direct service cost, and gross
              profit; the public record does not disclose each bridge component.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI004
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI004
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI003
              - CI005
              - CI006
      - number: '4.2'
        title: Cost structure and margin path
        blocks:
          - type: paragraph
            body: >-
              The strongest current financial disclosure is Tech in Asia’s report on audited 2025 statements: revenue
              rose 21% to US$544 million, net loss widened nearly 91% to US$43 million, and gross profit rose 39% to
              US$141 million. Management attributed the wider loss primarily to one-off, non-cash accounting items, but
              the cited report says the specific items were not disclosed. That distinction matters: an accounting loss
              is not cash burn, and management’s statement that cash position and core operations were unaffected is not
              a substitute for a cash-flow statement. The same report says adjusted EBITDA is expected to improve
              significantly in 2026, but this is a forward company expectation rather than a verified result. Levels.fyi
              provides an external compensation proxy, with reported annual total compensation ranging from US$14,680
              for Product Designer to US$35,865 for Data Scientist; the sample is anonymous and does not establish total
              payroll, headcount, or unit cost.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI011
              - CI015
              - CI016
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              LINE MAN Wongnai remains privately held. Multiples reports US$375 million raised across two rounds and a
              US$1 billion post-money valuation for the September 2022 Series B; ThaiPR’s contemporaneous company
              release reports the same US$265 million Series B and says proceeds were for food-delivery position, new
              service categories, technical hiring, and infrastructure. Those are historical financing facts, not
              current cash available. The latest public evidence instead points to a possible financing dependency: Thai
              Times reports that the company postponed a planned Thai listing, is considering Hong Kong or the United
              States, and is prioritizing capital raising for LINE MAN Pay. No assigned source provides cash on hand,
              debt, credit facilities, maturity schedule, monthly burn, runway, fully diluted cap table, or preference
              stack. The investment conclusion should therefore treat liquidity and dilution as unresolved rather than
              infer runway from funding raised or IPO discussion.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial profile is promising but not yet underwriting-grade. Scale is credible: the app listing says
              LINE MAN operates across four service categories and the official company release says food delivery
              reached all 77 Thai provinces and 700,000 restaurants by September 2022. Current revenue growth and
              gross-profit growth are encouraging, but the 2025 loss expansion, undisclosed non-cash adjustments, and
              concentration of revenue in on-demand services leave margin durability unproven. DoorDash’s current filing
              illustrates the level of metric discipline needed for a marketplace comparison: it separately defines
              orders, marketplace GOV, net revenue margin, and adjusted EBITDA, and warns that non-GAAP measures are not
              substitutes for GAAP. LINE MAN Wongnai does not provide an equivalent public bridge in the assigned
              evidence. Before a premium IPO or private entry, request audited FY2025-FY2026 standalone statements,
              segment revenue and contribution margins, cash-flow reconciliation, order-level subsidy and courier
              economics, cohort retention, payment credit-loss data, debt terms, and a current cap table.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale with measurable current growth
            body: >-
              2025 revenue grew 21% and gross profit grew 39%, while the platform spans on-demand, merchant and
              financial services.
            calloutType: strength
            claimRefs:
