        title: Funding, scale, and current financial signals
        blocks:
          - type: paragraph
            body: >-
              The financing record is comparatively clear through September 2022: a $110 million 2020 Series A was
              followed by a $265 million Series B led by GIC and LINE Plus, producing a reported valuation above $1
              billion. Independent databases repeat a $375 million cumulative total, but the company remains private and
              the pool does not provide a current fully diluted cap table or preference stack. Recent reporting gives a
              more current operating signal: audited 2025 revenue was reported at $544 million, up 21% year on year,
              while net loss widened nearly 91% to $43 million. Management attributed the wider loss primarily to
              one-off non-cash accounting items, but the article says those items were not specified; therefore
              accounting loss should not be treated as cash burn or as proof of operating profitability.
