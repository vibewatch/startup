  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: An integrated local-commerce workflow
        blocks:
          - type: paragraph
            body: >-
              The customer proposition is broader than food delivery. Consumers can discover restaurants and other local
              businesses through Wongnai, transact through LINE MAN across food, grocery, ride-hailing, messenger, and
              newer life-service categories, and use payment capabilities linked to the wider ecosystem. Merchants can
              receive demand from those consumer surfaces while running front-of-house and back-office workflows through
              Wongnai POS or FoodStory-derived tooling. Independent reporting described the service breadth as extending
              from messaging and taxi-hailing to financial services, delivery, reviews, and restaurant solutions; the
              company now organizes that breadth into on-demand services, merchant digital solutions, and financial
              services. The model therefore depends less on a single app feature than on coordinated consumer, rider,
              merchant, and payment surfaces. Public materials establish the product map, but not the proportion of
              users or merchants that adopt multiple modules.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
              - CE015
          - type: table
            tableRef: TE001
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE006
              - CE007
              - CE009
              - CE010
              - CE011
              - CE016
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE005
              - CE007
              - CE008
              - CE011
      - number: '5.2'
        title: Merchant software is becoming the system of action
        blocks:
          - type: paragraph
            body: >-
              Wongnai POS is the clearest product with disclosed packaging and workflow detail. The current official
              page lists Quick Service software from THB 1,090 per month and Full Service from THB 1,790 per month,
              while Enterprise is sold through consultation. The products cover order capture, kitchen routing, sales
              monitoring, multi-branch oversight, stock planning, and direct LINE MAN order intake without re-keying.
              Wongnai Genie extends that operating surface into conversational analytics and recommendations: the
              company says selected POS merchants can query sales, cost, profit, inventory, staffing, menu, and
              promotion information through POS web and manager-app interfaces. This is a potentially differentiated
              data-to-action layer, but rollout remains gradual and the most specific performance evidence is a
              company-published customer quotation rather than an independent benchmark.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
