        - Underwrite return only after entry price, dilution, preferences, and exit structure are disclosed.
    notes: >-
      Assessments combine disclosed historical financing, reported 2025 operating results, and explicit evidence gaps;
      no current price or target return is estimated.
    claimRefs:
      - CV002
      - CV006
      - CV007
      - CV008
      - CV014
      - CV015
      - CV016
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - Current evidence
      - What would change the view
    rows:
      - - Thesis
        - Scaled local ecosystem
        - Company reports 10M+ monthly active users, 500K+ partner restaurants, and nationwide reach.
        - Independent usage, order-frequency, and cohort-retention evidence would strengthen the moat case.
      - - Thesis
        - Improving gross-profit trajectory
        - 2025 revenue rose 21% to US$544M and gross profit rose 39% to US$141M.
        - Sustained growth with positive operating cash flow would support a higher-quality multiple.
      - - Anti-thesis
        - Loss quality remains unresolved
        - 2025 net loss widened nearly 91% to US$43M; one-off non-cash items were not specified.
        - An audited adjustment bridge and cash-flow reconciliation could reduce this risk.
      - - Anti-thesis
        - Demand and subsidy sensitivity
        - Restaurant sales per store fell 14% in Q2 2025 before improving during Half-Half Plus.
        - Growth sustained after stimulus expiry would weaken the downside case.
    notes: >-
      Scale metrics are company-issued; financial metrics are reported by Tech in Asia from audited statements;
      restaurant trends are company platform data.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV009
      - CV010
  - id: TV003
    title: Bull / base / bear scenarios
    columns:
      - Scenario
      - Probability signal
      - Operating assumptions
      - Valuation / return logic
      - Downside or confirmation trigger
    rows:
      - - Bull
        - Unquantified; requires new evidence
        - >-
          Revenue and gross profit sustain at least the reported 2025 direction, adjusted EBITDA improves, and losses
          convert toward cash generation.
        - >-
          A premium to the historical mark is considered only after current net cash, preferences, and segment economics
          are verified.
        - Positive audited operating cash flow and a priced IPO with transparent governance.
      - - Base
        - Current working case
        - >-
          Growth moderates, on-demand remains dominant, and merchant/payments diversification develops without a
          demonstrated cash inflection.
        - >-
          Use the historical mark and rough 1.8x cross-vintage revenue floor only as negotiation context; no point value
          is supportable.
        - Current cap table plus audited segment margins and cash-flow bridge become available.
      - - Bear
        - Material and observable
        - Losses persist, stimulus-supported demand fades, or public-market timing slips again.
        - >-
          Require a material discount to the 2022 mark; no numeric floor is supportable without balance-sheet and
          preference data.
        - Down round, sustained negative cash generation, or another IPO delay without stronger disclosure.
    notes: >-
      Scenarios are underwriting frames, not forecasts; probabilities and numeric valuation ranges are intentionally
      omitted because current capital structure, cash, debt, and transaction price are unavailable.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
      - CV013
      - CV014
      - CV015
