              - CI005
              - CI006
          - type: callout
            title: Liquidity and cash conversion are not disclosed
            body: >-
              The public record does not establish cash on hand, burn, runway, debt obligations, or whether reported
              2025 loss adjustments were fully non-cash.
            calloutType: risk
            claimRefs:
