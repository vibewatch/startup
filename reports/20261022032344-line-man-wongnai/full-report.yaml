      - number: '5.3'
        title: Product architecture is visible; technical architecture is not
        blocks:
          - type: paragraph
            body: >-
              The evidence supports an operating architecture with four observable layers: consumer discovery and
              ordering, fulfillment and rider operations, merchant systems, and payments plus shared data services.
              Product expansion has proceeded through both internal launches and acquisitions, including FoodStory for
              restaurant POS, JERA Cloud for beauty and wellness merchant software, LINE Pay integration, and a June
              2026 telepharmacy launch. On-demand remained the largest business at 88% of 2025 revenue, while LINE MAN
              Mart reportedly grew 70% year on year, showing that non-food services can scale within the same demand and
              logistics surface. A recruiting profile identifies engineering scope across delivery, ride-hailing, POS,
              payments, search, reviews, and merchant solutions, but it gives no repository, release, contribution,
              package-download, API, or reliability data. The architecture figure is therefore a product dependency map,
              not a claim about undisclosed infrastructure.
            claimRefs:
              - CE004
              - CE010
              - CE012
              - CE013
              - CE015
              - CE016
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE007
              - CE010
              - CE013
              - CE015
              - CE016
      - number: '5.4'
        title: Trust, reliability, and roadmap require primary diligence
        blocks:
          - type: paragraph
            body: >-
              The retained public evidence is unusually detailed on product categories and commercial workflows but thin
              on technical assurance. The reviewed official pages do not publish a status history, uptime objective,
              disaster-recovery design, penetration-test summary, security certification, privacy-control map,
              payment-control boundary, incident record, or model-governance documentation for Wongnai Genie. That
              absence is not evidence that controls are missing; it means they cannot be verified from this pool.
              Roadmap statements are also company-issued: Wongnai Genie is intended to add peer comparison, CRM
              analysis, and automated menu, pricing, and promotion management, while the broader platform is expanding
              into health, beauty, and wellness. Technical diligence should therefore prioritize architecture diagrams,
              service-level evidence, security and privacy attestations, AI evaluation and override controls, and
              deployment metrics by module before assigning a durable technology moat.
            claimRefs:
              - CE007
              - CE009
              - CE010
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public product proof exceeds public technical proof
            body: >-
              The product suite and merchant workflows are observable, but internal architecture, reliability, security,
              privacy, and AI-governance evidence remain unavailable in the assigned public source set.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and value exchange
        blocks:
          - type: paragraph
            body: >-
              LINE MAN Wongnai serves several linked customer groups rather than one homogeneous buyer. Consumers use
              LINE MAN for food, grocery, transport and messaging services; restaurants and other local businesses use
              discovery, ordering and POS tools; riders supply the delivery and mobility network. The company describes
              its platform as connecting consumers, riders and local businesses, while its public history records a 2020
              merger that combined delivery with restaurant discovery. This creates a plausible multi-sided
              local-commerce proposition, but the available record does not disclose how transaction volume, revenue or
              contribution margin is split by segment. The 2025 reporting that on-demand services represented 88% of
              revenue provides a directional mix, not a customer-count or retention measure.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU006
              - CU007
      - number: '6.2'
        title: Adoption trajectory and named proof
        blocks:
          - type: paragraph
            body: >-
              Adoption evidence is strongest where it is tied to an observable product surface or named merchant
              workflow. The iOS listing reports 904,000 ratings and a 4.9/5 score, which signals substantial user
              interaction but does not equal active users or repeat orders. The company says FoodStory had more than 11
              years working with restaurant operators, and its CEO described Wongnai POS as serving more than 50,000
              trusted restaurant operators at the 2023 acquisition. The company also reports food delivery reaching all
              77 Thai provinces by November 2021 and says LINE MAN was the most downloaded Thai food-and-drink app in
              2022. These are useful adoption markers, but several are company claims or historical snapshots; public
              evidence does not provide current active-user denominators, cohort retention, order frequency or verified
              production outcomes for each named merchant.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
