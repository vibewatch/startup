        title: Leadership, ownership, and governance
        blocks:
          - type: paragraph
            body: >-
              Yod Chinsupakul is identified as CEO and Wongnai co-founder, while In Young Chung is identified in earlier
              reporting as CFO. The founders' origin story is unusually specific: the official history names four
              Chulalongkorn University engineering classmates, with Yod later drawing inspiration from Yelp while
              studying at UCLA. The public record also shows strategic investors and parent-ecosystem relationships
