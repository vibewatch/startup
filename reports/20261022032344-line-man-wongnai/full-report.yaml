        - date: '2010'
          label: Wongnai founded
          details: >-
            Four Chulalongkorn University engineering classmates founded Wongnai as a Thai restaurant-discovery
            platform.
          tone: positive
          claimRefs:
            - CO002
        - date: '2016'
          label: LINE MAN launched
          details: LINE MAN launched as LINE Thailand's Thai-market on-demand service.
          tone: positive
          claimRefs:
            - CO003
        - date: '2018'
          label: POS partnership
          details: Wongnai invested in FoodStory to develop Wongnai POS.
          tone: positive
          claimRefs:
            - CO009
        - date: '2020'
          label: Merger and US$110M investment
          details: LINE MAN spun off from LINE Thailand and merged with Wongnai after a BRV Capital Management investment.
          tone: positive
          claimRefs:
            - CO003
            - CO006
        - date: 2022-09
          label: Unicorn financing
