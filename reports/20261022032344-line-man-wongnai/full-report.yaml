              - CR003
              - CR006
              - CR007
              - CR010
      - number: '7.2'
        title: Operating, quality and financial-model risks
        blocks:
          - type: paragraph
            body: >-
              Operating risk is amplified by the breadth of the platform and by revenue concentration. Tech in Asia
              reports that on-demand services represented 88% of 2025 revenue and grew 19% year on year, while total
              revenue reached US$544 million and net loss widened nearly 91% to US$43 million. Management attributed the
              broader loss primarily to one-off non-cash accounting items, but the article does not specify those items,
              so the explanation cannot be treated as a cash-flow reconciliation. The same article reports gross profit
              of US$141 million and an expectation of materially better adjusted EBITDA in 2026; that forecast is not
              audited evidence. The combination of concentration, delivery execution, subsidy sensitivity and non-cash
              accounting complexity warrants downside monitoring.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.3'
        title: Partner, capital and thesis-break risks
        blocks:
          - type: paragraph
            body: >-
              The company depends on strategic relationships and external capital while pursuing a listing venue that
              remains unsettled in the available record. TechCrunch reports backing from GIC, Z Holdings and BRV Asia,
              more than US$372 million raised and a valuation above US$1 billion, while the CEO described continued
              execution, restructuring and assessment of capital-structure and financing options as priorities. Thai
              Times reports that domestic IPO plans were paused amid weak market sentiment and that the company was
              considering Hong Kong or the United States to access deeper liquidity. These reports establish financing
              and venue uncertainty, not a committed transaction. A failed listing, delayed capital raise, loss of a
              strategic distribution or payments partner, or deterioration in adjusted profitability would materially
              weaken the thesis.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The largest disclosed risk is concentration plus accounting opacity
            body: >-
              On-demand services represented 88% of 2025 revenue while reported net loss widened to US$43 million;
              management's non-cash explanation is not accompanied by a disclosed itemization or cash-flow bridge in the
              assigned evidence.
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR008
          - type: callout
            title: Regulatory permission is not the same as operating assurance
            body: >-
              LINE MAN is listed as an approved telepharmacy application, but the FDA announcement places licensing,
              pharmacist, approved-app, traceable-delivery and geographic obligations on participating pharmacies;
              implementation evidence remains a diligence requirement.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR005
          - type: callout
            title: Thesis-break monitoring
            body: >-
              Escalate the risk view if adjusted EBITDA improvement is not reconciled to audited cash flow, if on-demand
              share remains near the reported 88% without margin resilience, if a material regulatory or security
              incident emerges, or if a proposed IPO requires unfavorable control or preference terms.
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR007
              - CR011
              - CR012
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, with medium confidence, high risk, and an unpriced rather than
              bullish valuation stance. LINE MAN Wongnai's official July 2026 factsheet still anchors valuation to the
              September 2022 Series B, when the company raised US$265 million at more than US$1 billion. That mark is
              useful historical context, not a current clearing price. Applying its lower bound to Tech in Asia's
              reported US$544 million of 2025 revenue produces a rough floor of 1.8x revenue, but this comparison mixes
              a 2022 post-money equity value with later accounting revenue and ignores cash, debt, preferences, and
              dilution. It therefore cannot support a point valuation or expected return. A disciplined investor should
              require current fully diluted ownership and audited cash-flow evidence before treating the old unicorn
              mark as investable.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV008
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV007
              - CV009
              - CV015
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is operational rather than valuation-specific. The company reports more than 10 million
              monthly active users, more than 500,000 partner restaurants, and nationwide coverage, while independent
              reporting says 2025 revenue rose 21% and gross profit rose 39%. On-demand services nevertheless
              represented 88% of revenue, leaving the model concentrated in a competitive, promotion-sensitive category.
              The anti-thesis is reinforced by the reported US$43 million net loss, up nearly 91%, and by company data
              showing restaurant sales per store fell 14% in Q2 2025 before a stimulus-supported rebound. The CEO
              attributed the wider loss to unspecified one-off non-cash items, so accounting loss must not be treated as
              cash burn, but the adjustment also remains insufficiently documented for underwriting.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
      - number: '8.3'
        title: Scenarios and comparable context
        blocks:
          - type: paragraph
            body: >-
              Public comparable evidence supplies a wide reference band, not a defensible company multiple. Multiples
              lists selected platform companies from 0.7x to 10.6x LTM revenue, a spread that reflects materially
              different business models, geographies, margins, and public-market liquidity. Toast is directionally
              relevant to the merchant-software and payments portfolio, but its official overview provides no valuation
              metric in the retained evidence. The bull case requires sustained revenue and gross-profit growth plus a
              verified loss reversal; the base case treats the 2022 mark as a ceiling for diligence rather than an
              entitlement; and the bear case assumes multiple compression and continued losses. No scenario receives a
              numeric probability or point-value range because current net cash, preference terms, segment margins, and
              fully diluted shares are unavailable.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exit readiness and final diligence
        blocks:
          - type: paragraph
            body: >-
              Exit intent is visible but readiness is not proven. Thai Times reports that the company paused a planned
              2025 Thai IPO amid weak domestic market conditions and is considering Hong Kong or the United States for
              deeper liquidity and a premium valuation. A venue search may improve optionality, but it does not
              establish that investors will accept the requested price or that governance and reporting meet
              public-market standards. The final diligence package should include audited FY2025-FY2026 consolidated and
              segment statements, operating-to-cash-flow reconciliation, the nature of 2025 non-cash charges, net debt
              and liquidity, fully diluted ownership, preference and minority-rights terms, cohort economics, and IPO
              governance materials. Thesis-break triggers are a failure to convert gross profit growth into sustainable
              cash generation, a down round below the 2022 mark, or continued exit delays without stronger disclosure.
            claimRefs:
              - CV006
              - CV008
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Investment decision
            body: Research more; do not treat the September 2022 unicorn mark as a current investable valuation.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV014
              - CV015
          - type: callout
            title: Primary valuation blocker
            body: >-
              Current fully diluted ownership, preference terms, net cash, and a reconciled cash-flow profile are not
              established by the retained public evidence.
            calloutType: risk
            claimRefs:
              - CV006
              - CV016
