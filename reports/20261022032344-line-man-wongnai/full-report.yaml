              - CU002
              - CU006
              - CU009
              - CU012
      - number: '6.3'
        title: Durability, expansion and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The platform has an expansion path from food discovery and delivery into grocery, ride-hailing, merchant
              software and payments. FoodStory extends the merchant side into premium and chain restaurants, while the
              app listing shows a mature consumer surface with delivery, location-linked data and user-generated
              content. However, public disclosures do not establish net or gross retention, churn, contract duration,
              subsidy-normalised repeat behaviour, or top-customer concentration. Independent market reporting also
              shows that Thai food delivery is capital-intensive and consolidating: in 2023 LINE MAN Wongnai reported
              THB18 billion revenue and a THB563 million loss, while the sector observer described heavy promotional
              requirements and the exit of Robinhood. This supports a durability risk, not a conclusion that customers
              are leaving. The next diligence step is a customer cohort pack with active-user definitions, repeat
              frequency, retention by segment, merchant tenure and concentration.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              LINE MAN Wongnai operates across categories with distinct regulatory obligations rather than one uniform
              software regime. ETDA's 2026 roadmap covers online marketplaces, ride sharing, fee transparency and
              online-fraud prevention, including verification, notice-and-takedown, driver registration and possible
              risk-based identity checks. The Thai FDA separately lists LINE MAN as one of seven applications approved
              for telepharmacy, but pharmacies must be licensed, use pharmacists, operate during store hours, use
              approved applications and provide traceable delivery. These rules create ongoing implementation,
              monitoring and data-governance costs. The public sources reviewed do not establish a current enforcement
              action, litigation docket, privacy incident or completed control test; those are diligence gaps, not
              evidence of absence.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
