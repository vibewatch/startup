chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              LINE MAN Wongnai describes its mission as digitalizing everyday life services and connecting consumers,
              riders, and local businesses through its platforms. The company website identifies LINE MAN, Wongnai, LINE
              MAN Rider, and Wongnai Merchant & POS as core surfaces. Wongnai began as a restaurant-discovery and review
              business in 2010, while LINE MAN launched in Thailand in 2016; the two businesses merged in 2020 after a
              $110 million investment. The combined platform now spans food and grocery delivery, ride-hailing,
              messenger services, restaurant discovery, merchant POS, and payments. This is a Thailand-focused
              local-commerce model rather than a geographically diversified regional network, so local execution,
              merchant density, and the LINE ecosystem are central operating dependencies.
