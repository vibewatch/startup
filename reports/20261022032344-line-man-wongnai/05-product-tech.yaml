  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: technical-assurance
      missingEvidence: Architecture diagrams, service-level history, incident logs, disaster-recovery tests, security certifications, penetration-test summaries, privacy data-flow maps, payment control boundaries, and AI evaluation and override documentation.
      whyItMatters: Product breadth increases shared-platform and data risks, but the available evidence cannot establish reliability, security, privacy, regulated-payment controls, or safe AI operation.
      diligencePath: Request a technical diligence room and management sessions with engineering, security, privacy, payments, site-reliability, and AI product owners; sample controls and incidents by module.
      relatedQuestionRefs: [QE006]
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: A public repository, package registry, API documentation, engineering release history, practitioner forum, or another quantitative developer-adoption signal.
      whyItMatters: The recruiting profile is only a proxy for engineering scope and cannot demonstrate development velocity, software quality, ecosystem adoption, or maintainability.
      diligencePath: Request repository and deployment metrics, code ownership maps, change-failure and recovery data, and third-party integration usage; interview senior engineers and integration partners.
    - type: private-evidence-only
      severity: material
      topic: ai-outcomes
      missingEvidence: Independently measured Wongnai Genie adoption, retention, recommendation accuracy, error rates, controlled outcome studies, data-permission controls, and automated-action safeguards.
      whyItMatters: A company-published customer quotation and rollout target do not establish repeatable merchant value or safe model behavior across the target population.
      diligencePath: Review merchant cohorts, experiment design, model evaluations, audit logs, human-override flows, and customer references outside company-published materials.
