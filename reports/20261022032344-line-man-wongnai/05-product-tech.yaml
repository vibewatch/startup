    columns: [Module or product line, Primary user, Public maturity signal, Differentiation indicated by evidence, Diligence gap]
    rows:
      - [LINE MAN on-demand services, Consumers and riders, "Food, grocery, ride-hailing, messenger, and Mart are operating services; on-demand was 88% of 2025 revenue.", "Shared demand, rider, and merchant network across multiple local-service categories.", "Module-level orders, active users, fulfillment quality, and contribution margin are undisclosed."]
      - [Wongnai discovery and reviews, Consumers and local businesses, "Long-running discovery surface; the Android page claims more than 8 million monthly users without a visible measurement date.", "Local restaurant and business content can feed discovery into transaction surfaces.", "Current active-user definition, review integrity controls, and conversion to orders are undisclosed."]
      - [Wongnai POS and FoodStory, Restaurant operators, "Commercial packages and workflows are publicly listed; FoodStory and Wongnai POS have been merged.", "Direct LINE MAN order intake, kitchen routing, remote sales monitoring, and multi-branch workflows.", "Installed active base, churn, uptime, integration coverage, and realized pricing are undisclosed."]
      - [LINE Pay and financial services, Consumers and merchants, "Integrated as one of three core businesses; overseas listing coverage says fintech investment is a priority.", "Payment adjacency to consumer demand and merchant POS workflows.", "Licensing perimeter, payment volumes, take rate, fraud loss, and service availability are undisclosed."]
      - [Wongnai Genie, Restaurant operators, "Gradual free rollout to selected Wongnai POS merchants began in September 2026.", "Conversational access to ecosystem sales, cost, profit, inventory, staffing, and promotion data.", "Independent accuracy, adoption, retention, model controls, and causal outcome evidence are unavailable."]
      - [Telepharmacy and expanded life services, Consumers, "The company says telepharmacy launched in June 2026.", "Reuses the consumer access surface for an adjacent regulated service category.", "Partner model, geographic coverage, service quality, privacy boundary, and regulatory responsibilities are undisclosed."]
    notes: "Status and differentiation summarize retained public evidence as of 2026-10-22; company claims are not treated as independently verified, and null operating metrics are expressed as diligence gaps."
    claimRefs: [CE002, CE003, CE005, CE006, CE007, CE009, CE010, CE011, CE016]
  - id: TE002
    title: Workflow and use-case assessment
    columns: [User job, Current workflow or friction, LINE MAN Wongnai surface, Measurable public benefit, Limitation]
    rows:
      - [Find a local restaurant, "Search fragmented restaurant information and reviews.", "Wongnai discovery and review application.", "Company page claims more than 8 million monthly users, but provides no visible measurement period.", "No current independent usage or review-quality benchmark."]
      - [Order food or groceries, "Select a merchant, place an order, pay, and coordinate delivery.", "LINE MAN Food and Mart with rider fulfillment.", "Tech in Asia reported Mart growth of 70% year on year in 2025.", "No public order-level reliability, delivery-time, or subsidy-normalised economics."]
      - [Run counter and kitchen operations, "Capture orders, transmit tickets, reconcile sales, and monitor the store.", "Quick Service or Full Service Wongnai POS.", "Official list prices begin at THB 1,090 and THB 1,790 per month, respectively.", "List price is not realized price; hardware and add-ons are excluded."]
      - [Operate multiple restaurant branches, "Aggregate sales, inventory, staffing, and branch controls.", "Enterprise POS plus POS Manager and Wongnai Genie.", "BEARHOUSE attributed about 15% operational-efficiency improvement, about 20% lower raw-material waste cost, and one hour of daily front-of-house time savings to its Genie trial.", "Outcome is a company-published customer quotation without an independent control group."]
      - [Use business data for decisions, "Small operators may lack analytical tools and specialist skills.", "Wongnai Genie conversational analytics and recommendations.", "The product is being rolled out free to selected POS merchants.", "No public model evaluation, hallucination rate, access-control design, or adoption cohort."]
    notes: "Benefits retain the source's metric names and qualifications; the BEARHOUSE figures are customer-attributed claims published by LINE MAN Wongnai, not an independent benchmark."
    claimRefs: [CE004, CE005, CE007, CE008, CE011]
  - id: TE003
    title: Technology and operating architecture assessment
    columns: [Layer or process, Observable role, Key dependency, Principal technical or operating risk]
    rows:
      - [Consumer access, "Discovery, ordering, ride, messenger, Mart, and telepharmacy interfaces.", "Current catalog, identity, location, pricing, and payment availability.", "Inconsistent availability or data quality can break conversion across categories."]
      - [Fulfillment network, "Coordinates consumers, riders, merchants, and delivery or mobility tasks.", "Dispatch, maps, capacity, merchant readiness, and real-time communications.", "No public SLA, incident history, dispatch-quality metric, or recovery design."]
      - [Merchant systems, "Captures orders, routes work to kitchens, reports sales, and supports stock and branch management.", "POS hardware, store connectivity, integration adapters, and accurate master data.", "Operational lock-in increases the impact of outages, failed integrations, or migration friction."]
      - [Payments and financial services, "Supports digital payment within the ecosystem and planned fintech growth.", "Regulated payment rails, fraud controls, reconciliation, and merchant settlement.", "Public evidence does not define the control, licensing, loss, or data-sharing boundaries."]
      - [Shared data and AI, "Turns POS and ecosystem data into analysis and recommendations through Wongnai Genie.", "Permissioned, accurate, timely data plus model evaluation and human override.", "No public evidence on model architecture, evaluation, privacy, explainability, or automated-action safeguards."]
    notes: "This is an evidence-bounded operating model inferred from observable products; it is not a representation of the company's undisclosed infrastructure or control architecture."
    claimRefs: [CE001, CE002, CE006, CE007, CE013, CE014, CE015, CE016]
figures:
  - id: FE001
    title: Observable product dependency stack
    type: stack
    summary: Consumer services sit above fulfillment, merchant operations, and payment/data capabilities; the diagram maps public product dependencies rather than internal software components.
    data:
      layers:
        - label: Discovery and local content
          detail: Demand entry points across local commerce and everyday services.
          modules:
            - label: Wongnai discovery and reviews
              detail: Restaurant and local-business information, reviews, and demand discovery.
        - label: Consumer transaction surfaces
          detail: Applications through which consumers request everyday services.
          modules:
            - label: LINE MAN Food and Mart
              detail: Food ordering and grocery or local-commerce delivery.
            - label: LINE MAN Ride, Messenger, and Telepharmacy
              detail: Mobility, parcel, and newer digital-health access surfaces.
        - label: Fulfillment and ecosystem coordination
          detail: Connects consumers, riders, merchants, service partners, and orders.
          modules:
            - label: Order and service orchestration
              detail: Coordinates demand, merchant readiness, riders, and service completion.
        - label: Merchant digital operations
          detail: Restaurant and local-business workflow systems.
          modules:
            - label: Wongnai POS and FoodStory
              detail: Restaurant order, kitchen, sales, stock, and branch workflows.
            - label: JERA Cloud
              detail: Merchant software expansion into beauty and wellness.
        - label: Payments
          detail: Transaction capabilities connected to consumer and merchant workflows.
          modules:
            - label: LINE Pay
              detail: Digital payment services across the ecosystem.
        - label: Shared data and intelligence
          detail: Decision-support capabilities using merchant and ecosystem information.
          modules:
            - label: Wongnai Genie
              detail: Conversational analysis and recommendations using POS and ecosystem data.
    approximationNotes: "Layer order is an analytical dependency view based on public product descriptions; no internal infrastructure topology, data flow, or control boundary is asserted."
    claimRefs: [CE003, CE007, CE010, CE013, CE015, CE016]
callouts:
  - calloutType: risk
    title: Public product proof exceeds public technical proof
    body: The product suite and merchant workflows are observable, but internal architecture, reliability, security, privacy, and AI-governance evidence remain unavailable in the assigned public source set.
    claimRefs: [CE013, CE014]
