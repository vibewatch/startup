company:
  name: LINE MAN Wongnai
chapter:
  number: 5
  title: Product & Technology
  summary: LINE MAN Wongnai has assembled a broad Thailand-focused product system spanning consumer discovery and on-demand services, merchant POS and management software, payments, and a newly launched AI assistant. Public evidence demonstrates breadth and active product expansion, but it does not expose the internal technical architecture, service-level performance, security controls, or independently validated AI outcomes needed for full technical underwriting.
sections:
  - id: integrated-product-workflow
    title: An integrated local-commerce workflow
    body: >-
      The customer proposition is broader than food delivery. Consumers can discover restaurants and other local businesses through Wongnai, transact through LINE MAN across food, grocery, ride-hailing, messenger, and newer life-service categories, and use payment capabilities linked to the wider ecosystem. Merchants can receive demand from those consumer surfaces while running front-of-house and back-office workflows through Wongnai POS or FoodStory-derived tooling. Independent reporting described the service breadth as extending from messaging and taxi-hailing to financial services, delivery, reviews, and restaurant solutions; the company now organizes that breadth into on-demand services, merchant digital solutions, and financial services. The model therefore depends less on a single app feature than on coordinated consumer, rider, merchant, and payment surfaces. Public materials establish the product map, but not the proportion of users or merchants that adopt multiple modules.
    claimRefs: [CE001, CE002, CE003, CE006, CE015]
    tableRefs: [TE001, TE002]
  - id: merchant-operating-system
    title: Merchant software is becoming the system of action
    body: >-
      Wongnai POS is the clearest product with disclosed packaging and workflow detail. The current official page lists Quick Service software from THB 1,090 per month and Full Service from THB 1,790 per month, while Enterprise is sold through consultation. The products cover order capture, kitchen routing, sales monitoring, multi-branch oversight, stock planning, and direct LINE MAN order intake without re-keying. Wongnai Genie extends that operating surface into conversational analytics and recommendations: the company says selected POS merchants can query sales, cost, profit, inventory, staffing, menu, and promotion information through POS web and manager-app interfaces. This is a potentially differentiated data-to-action layer, but rollout remains gradual and the most specific performance evidence is a company-published customer quotation rather than an independent benchmark.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
  - id: architecture-and-maturity
    title: Product architecture is visible; technical architecture is not
    body: >-
      The evidence supports an operating architecture with four observable layers: consumer discovery and ordering, fulfillment and rider operations, merchant systems, and payments plus shared data services. Product expansion has proceeded through both internal launches and acquisitions, including FoodStory for restaurant POS, JERA Cloud for beauty and wellness merchant software, LINE Pay integration, and a June 2026 telepharmacy launch. On-demand remained the largest business at 88% of 2025 revenue, while LINE MAN Mart reportedly grew 70% year on year, showing that non-food services can scale within the same demand and logistics surface. A recruiting profile identifies engineering scope across delivery, ride-hailing, POS, payments, search, reviews, and merchant solutions, but it gives no repository, release, contribution, package-download, API, or reliability data. The architecture figure is therefore a product dependency map, not a claim about undisclosed infrastructure.
    claimRefs: [CE004, CE010, CE012, CE013, CE015, CE016]
    figureRefs: [FE001]
  - id: trust-reliability-and-roadmap
    title: Trust, reliability, and roadmap require primary diligence
    body: >-
      The retained public evidence is unusually detailed on product categories and commercial workflows but thin on technical assurance. The reviewed official pages do not publish a status history, uptime objective, disaster-recovery design, penetration-test summary, security certification, privacy-control map, payment-control boundary, incident record, or model-governance documentation for Wongnai Genie. That absence is not evidence that controls are missing; it means they cannot be verified from this pool. Roadmap statements are also company-issued: Wongnai Genie is intended to add peer comparison, CRM analysis, and automated menu, pricing, and promotion management, while the broader platform is expanding into health, beauty, and wellness. Technical diligence should therefore prioritize architecture diagrams, service-level evidence, security and privacy attestations, AI evaluation and override controls, and deployment metrics by module before assigning a durable technology moat.
    claimRefs: [CE007, CE009, CE010, CE014]
