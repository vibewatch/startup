evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      A complete board roster, voting agreement, fully diluted cap table, preference stack, and minority-rights
      schedule.
    whyItMatters: >-
      Control and economic rights determine IPO readiness, related-party exposure, and the downside protection available
      to minority investors.
    diligencePath: >-
      Request the latest capitalization table, shareholder agreement, board minutes, and transaction documents under
      NDA.
    relatedQuestionRefs:
      - QO003
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: financials
    missingEvidence: >-
      Audited FY2025 standalone statements, cash-flow statement, segment revenue, and a schedule of non-cash accounting
      items.
    whyItMatters: >-
      The reported net loss is not equivalent to cash burn, and the adjustment explanation is not sufficiently specific
      to assess operating profitability.
    diligencePath: Obtain audited statements and reconcile revenue, gross profit, EBITDA, net income, and cash flow by segment.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: milestones
    missingEvidence: A complete dated chronology of governance changes, payment licensing, acquisitions, and financing terms.
    whyItMatters: >-
      The public timeline is sufficient for major milestones but cannot establish all control, regulatory, and
      integration dependencies.
    diligencePath: Build a source-backed transaction and governance chronology from filings, licenses, and executed agreements.
    relatedQuestionRefs:
      - QO010
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: A current employee count, leadership roster, and organizational breakdown by business segment.
    whyItMatters: >-
      Without a current headcount and operating-leadership map, organizational scale and key-person concentration cannot
      be assessed.
    diligencePath: Request an HR roster and organization chart reconciled to payroll and contractor counts as of the run date.
    relatedQuestionRefs:
      - QO003
      - QO005
    relatedTableRefs:
      - TO001
      - TO002
  - type: stale
    severity: material
    topic: IPO
    missingEvidence: A dated update confirming the IPO venue decision after management's stated end-of-June decision window.
    whyItMatters: The assigned 2026 reporting describes options and a deadline, not a completed venue decision or filed transaction.
    diligencePath: >-
      Request board-approved listing plans and check current exchange filings, adviser mandates, and shareholder
      communications.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: Segment-level GTV, revenue, take rates, active-user definitions, and overlap across delivery, POS and payments.
    whyItMatters: >-
      Without a consistent denominator, TAM/SAM/SOM cannot be converted into a valuation-grade company-specific
      opportunity.
    diligencePath: >-
      Obtain audited segment schedules, operating KPI definitions and a bridge from gross transaction value to net
      revenue from management.
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
    severity: material
    topic: company-revenue
    missingEvidence: A reconciled explanation for the FY2023 Tracxn revenue band versus the later 2025 audited-revenue report.
    whyItMatters: Conflicting revenue series can distort growth, take-rate and comparable-company analysis.
    diligencePath: Request entity scope, currency, accounting basis and audited statements underlying each reported series.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: adoption-constraints
    missingEvidence: Cohort retention, repeat frequency, subsidy-normalized order contribution, merchant churn and rider economics.
    whyItMatters: >-
      These metrics determine whether category concentration translates into durable contribution margin rather than
      subsidized share.
    diligencePath: Request cohort tables and unit-economics cuts by service, geography and promotion status.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: enumeration-incomplete
    severity: minor
    topic: landscape
    missingEvidence: >-
      A complete, current census of Thai delivery, mobility, merchant-software, payment, direct-ordering, and
      internal-build alternatives.
    whyItMatters: >-
      The retained pool supports a representative landscape but cannot establish that every active substitute or likely
      entrant is included.
    diligencePath: >-
      Compile current Thai regulator, app-store, merchant-procurement, and competitor product records before treating
      the landscape as exhaustive.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable current merchant commission, delivery-fee, POS subscription, and payment pricing schedules across LINE
      MAN Wongnai and its principal alternatives.
    whyItMatters: >-
      Without realised pricing and incentives, capability comparisons cannot establish customer ROI, switching cost, or
