schemaVersion: "report-v2"
artifact: financials
slug: line-man-wongnai
runDate: 2026-10-22
company:
  name: LINE MAN Wongnai
chapter:
  number: 4
  title: Financials
  summary: "Public evidence shows a large, multi-stream Thai local-commerce platform with 2025 revenue growth but a materially wider accounting loss. Revenue quality, cash conversion, segment economics, and capital adequacy remain underwritten only partially because the company is private and public disclosure is selective."
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: "The business monetizes a connected local-commerce ecosystem rather than a single subscription product. The official app listing describes food delivery, ride, mart, and messenger, with delivery fees starting at zero baht and promotions of up to 60%; this is a consumer-facing list-price and subsidy signal, not realized revenue or margin. The company’s official history describes three core businesses: on-demand services, merchant digital solutions, and financial services. Tech in Asia reports that all three grew in 2025, with on-demand services still 88% of total revenue and growing 19% year on year. The revenue mix is therefore concentrated in transaction-led services, while merchant and payments products provide potential cross-sell but have no public standalone take-rate, gross-margin, or retention schedule. A useful underwriting bridge is activity to transaction value, company revenue, direct service cost, and gross profit; the public record does not disclose each bridge component."
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: operating-costs
    title: Cost structure and margin path
    body: "The strongest current financial disclosure is Tech in Asia’s report on audited 2025 statements: revenue rose 21% to US$544 million, net loss widened nearly 91% to US$43 million, and gross profit rose 39% to US$141 million. Management attributed the wider loss primarily to one-off, non-cash accounting items, but the cited report says the specific items were not disclosed. That distinction matters: an accounting loss is not cash burn, and management’s statement that cash position and core operations were unaffected is not a substitute for a cash-flow statement. The same report says adjusted EBITDA is expected to improve significantly in 2026, but this is a forward company expectation rather than a verified result. Levels.fyi provides an external compensation proxy, with reported annual total compensation ranging from US$14,680 for Product Designer to US$35,865 for Data Scientist; the sample is anonymous and does not establish total payroll, headcount, or unit cost."
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and financing dependency
    body: "LINE MAN Wongnai remains privately held. Multiples reports US$375 million raised across two rounds and a US$1 billion post-money valuation for the September 2022 Series B; ThaiPR’s contemporaneous company release reports the same US$265 million Series B and says proceeds were for food-delivery position, new service categories, technical hiring, and infrastructure. Those are historical financing facts, not current cash available. The latest public evidence instead points to a possible financing dependency: Thai Times reports that the company postponed a planned Thai listing, is considering Hong Kong or the United States, and is prioritizing capital raising for LINE MAN Pay. No assigned source provides cash on hand, debt, credit facilities, maturity schedule, monthly burn, runway, fully diluted cap table, or preference stack. The investment conclusion should therefore treat liquidity and dilution as unresolved rather than infer runway from funding raised or IPO discussion."
    claimRefs: [CI009, CI010, CI011, CI012]
  - id: underwriting-verdict
    title: Financial verdict and diligence blockers
    body: "The financial profile is promising but not yet underwriting-grade. Scale is credible: the app listing says LINE MAN operates across four service categories and the official company release says food delivery reached all 77 Thai provinces and 700,000 restaurants by September 2022. Current revenue growth and gross-profit growth are encouraging, but the 2025 loss expansion, undisclosed non-cash adjustments, and concentration of revenue in on-demand services leave margin durability unproven. DoorDash’s current filing illustrates the level of metric discipline needed for a marketplace comparison: it separately defines orders, marketplace GOV, net revenue margin, and adjusted EBITDA, and warns that non-GAAP measures are not substitutes for GAAP. LINE MAN Wongnai does not provide an equivalent public bridge in the assigned evidence. Before a premium IPO or private entry, request audited FY2025-FY2026 standalone statements, segment revenue and contribution margins, cash-flow reconciliation, order-level subsidy and courier economics, cohort retention, payment credit-loss data, debt terms, and a current cap table."
    claimRefs: [CI013, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Current public status, Quality / diligence ask]
    rows:
      - [On-demand services, "Food and grocery delivery, ride-hailing, messenger", "88% of 2025 revenue; 19% growth in 2025", "Third-party reported; request order value, take rate, subsidy and contribution margin"]
      - [Merchant digital solutions, "Wongnai merchant discovery, POS and related tools", "Reported as a growth segment; standalone revenue not disclosed", "Need merchant revenue, recurring versus transaction mix, churn and gross margin"]
      - [Financial services, "Payments and LINE MAN Pay / digital wallet services", "Reported as a growth segment; standalone economics not disclosed", "Need payment volume, net take rate, credit losses, regulatory capital and licensing detail"]
      - [Advertising / value-added services, "Monetization of users, riders and restaurants", "Company release describes advertising and financial services as value-added", "Company-issued description; request revenue recognition and incremental margin"]
    notes: "2025 mix and growth are reported by Tech in Asia from audited statements; other rows describe disclosed mechanisms, not independently verified revenue."
    claimRefs: [CI001, CI003, CI004]
  - id: TI002
    title: Pricing and monetization signals
    columns: [Surface, Published price or term, Interpretation, Unknown]
    rows:
      - [Food delivery, "Delivery fee starts at 0 baht", "Consumer list-price signal on Google Play", "Realized fee, subsidy burden and merchant take rate"]
      - [Promotions, "Up to 60% discount code", "Promotion intensity may support acquisition or demand stimulation", "Who funds discount, frequency, cohort payback and margin impact"]
      - [Merchant POS, "No public list price in assigned sources", "Potential software and merchant-services monetization", "Contract price, attach rate, churn and implementation cost"]
      - [Payments, "No public list price in assigned sources", "Potential transaction or service-fee monetization", "Net revenue margin, fraud and credit-loss economics"]
    notes: "Google Play language is an app-store marketing statement, not realized revenue, contractual pricing or margin evidence."
    claimRefs: [CI001, CI002, CI004]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value / status, Confidence, Why it matters / diligence ask]
    rows:
      - [Revenue, "US$544m in 2025; +21% year on year", "Medium", "Scale is material; reconcile to audited statements and segment totals"]
      - [Gross profit, "US$141m in 2025; +39% year on year", "Medium", "Suggests operating leverage, but request gross-margin bridge by segment"]
      - [Net loss, "US$43m in 2025; loss widened nearly 91%", "Medium", "Adverse accounting signal; identify one-off non-cash items and cash impact"]
      - [Cash / burn / runway, null, "Low", "Request audited cash flow, monthly burn, debt, facilities and runway"]
      - [CAC / payback / retention, null, "Low", "Request cohort, subsidy-normalized order contribution and repeat-frequency data"]
      - [Payment credit losses, null, "Low", "Request LINE Pay unit economics, loss metrics and regulatory-capital detail"]
    notes: "Nulls are unavailable in the assigned public evidence and are deliberate diligence gaps; none should be treated as zero."
    claimRefs: [CI005, CI006, CI011, CI015, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: "LINE MAN Wongnai converts consumer and merchant activity across on-demand, merchant and financial services into revenue, but the public record does not disclose the intermediate unit economics."
    data:
      nodes:
        - {id: consumer-activity, label: "Consumer orders and rides", detail: "Food, grocery, ride and messenger activity"}
        - {id: merchant-activity, label: "Merchant transactions and POS", detail: "Restaurants and local-business services"}
        - {id: payment-activity, label: "Payment activity", detail: "Financial-services and LINE Pay activity"}
        - {id: gross-transaction-value, label: "Transaction value", detail: "Public value and take-rate bridge unavailable"}
        - {id: company-revenue, label: "Company revenue", detail: "US$544m in 2025 reported by Tech in Asia"}
        - {id: gross-profit, label: "Gross profit", detail: "US$141m in 2025 reported by Tech in Asia"}
      edges:
        - {from: consumer-activity, to: gross-transaction-value}
        - {from: merchant-activity, to: gross-transaction-value}
        - {from: payment-activity, to: gross-transaction-value}
        - {from: gross-transaction-value, to: company-revenue}
        - {from: company-revenue, to: gross-profit}
    approximationNotes: "The ordering is an evidence-backed operating model, not a calculated bridge; transaction value, take rate and direct costs are not published in the assigned evidence."
    claimRefs: [CI003, CI005, CI006]
callouts:
  - calloutType: strength
    title: Scale with measurable current growth
    body: "2025 revenue grew 21% and gross profit grew 39%, while the platform spans on-demand, merchant and financial services."
    claimRefs: [CI003, CI005, CI006]
  - calloutType: risk
    title: Liquidity and cash conversion are not disclosed
    body: "The public record does not establish cash on hand, burn, runway, debt obligations, or whether reported 2025 loss adjustments were fully non-cash."
    claimRefs: [CI007, CI011, CI015]
  - calloutType: recommendation
    title: Underwrite only after segment and cash-flow diligence
    body: "Request audited statements, segment contribution margins, subsidy-normalized cohorts, payment losses and a current cap table before assigning a premium valuation."
    claimRefs: [CI012, CI014, CI016]
