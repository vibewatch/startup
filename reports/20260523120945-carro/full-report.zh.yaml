  - id: TV005
    title: 投资逻辑破裂与叫停触发表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - EBITDA 卡在 FY2025 基准附近
        - 下一披露期内没有明显高于 S$43M 的进展
        - 打破投资人被要求提前买单的盈利升级故事。
        - 除非价格大幅重置，否则从观察转向回避。
      - - 新融资暴露苛刻优先权
        - 优先权堆叠或反稀释条款实质压缩普通股上行空间
        - 名义估值不再代表后期投资人的真实经济价值。
        - 若不能按调整后瀑布分配承销，不要投资。
      - - 赴美 IPO 路径仍被堵住
        - 2026 年美国 IPO 逆风持续时，仍看不到申报进度
        - 退出路径变得更长、更冒险，也可能改去倍数更低的市场。
        - 按延期退出或非美国退出重新承销。
      - - Carsome 给出更弱或更快的市场参照
        - 最接近的同业先上市，或释放出比预期更艰难的经济性信号
        - 区域叙事溢价从 Carro 身上转走，或压缩品类估值。
        - 降低确信度，并把任何 Carro 定价直接拿来和 Carsome 结果对比。
      - - 债务或信用压力浮现
        - Genie 杠杆、不良贷款或融资额度弱于预期
        - 附加业务利润率逻辑走弱，资产负债表风险上升。
        - 把它视为可能打破投资逻辑的信号，而不是小的尽调脚注。
    notes: 这些触发项刻意做得很实操。它们用于提醒投资人：什么时候该停止给自己讲更好的故事，转而改写承销假设。
