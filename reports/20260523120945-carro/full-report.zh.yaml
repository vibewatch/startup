      - number: '8.2'
        title: 建议、置信度与入场纪律
        blocks:
          - type: paragraph
            body: >-
              仅凭公开证据，正确判断是跟踪，而不是买入。Carro 已有足够规模、流动性和盈利改善，值得留在主动观察名单上，但估值透明度不足，无法支撑按传闻定价投入高确信资本。留存资料集中最有用的锚点，是 Tracxn 记录的
              2025 年 9 月轮次，投后估值 US$3 billion。这个锚点比围绕超过 US$3.8 billion 的媒体传闻更硬，因为后者仍处在匿名来源报道和明确市场条件限制之内。


              因此，入场纪律应绑定价格或证据。价格上，投资者应更偏好明显接近上一轮确定融资，而不是高端传闻区间的准入机会。证据上，投资者应要求更强证明：EBITDA 正在从 FY2025 的 S$43 million
              基数实质性迈向 S$130 million 这一公开前置条件。置信度为中，因为运营趋势可见，但股权结构表、清算优先权、债务条款和最终 IPO 结构仍未公开。风险评级为高，因为即便名义 IPO
              估值看起来可接受，这些缺失条款也可能改变实际回报。
