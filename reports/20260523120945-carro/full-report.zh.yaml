      - number: '4.2'
        title: 定价证据薄弱，因此 GTM 必须靠代理指标判断
        blocks:
          - type: paragraph
            body: >-
              定价是本章最弱的公开财务表面。留存来源确认 Carro 通过多条通道变现——车辆交易、融资、保险、售后、订阅和面向经销商的金融服务——但没有披露当前价目表、抽佣率安排、 融资 APR
              网格、保险佣金表或实际折扣阶梯。这个缺口应被明确保留。即使有公开消费者车辆列表或融资计算器，也无法解决尽调问题，因为标价不等于扣除经销商激励、结构、补贴和附加行为后的实际变现。


              因此，最好的 GTM 代理指标是战略性的，而不是比率型。2025 年 Cool Japan Fund 融资的叙事，是加速亚太地区对日本车的需求；The Business Times 又补充说，
              与日本汽车品牌的更多合作即将到来。更早的 Woori 交易也被描述为支持扩张、包括印度尼西亚扩张的更紧密合作。合在一起，这些来源暗示 Carro 的 GTM 动作仍依赖供给侧伙伴、
              经销商流动性和运营分发，而不是一个披露清楚的自助 SaaS 漏斗。CAC、回本周期和销售周期指标没有出现在留存公开资料包中，因此任何效率结论都必须停留在代理指标层面。
