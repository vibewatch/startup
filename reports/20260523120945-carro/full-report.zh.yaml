      - number: '3.3'
        title: 能力广度有差异化，但公开定价和合规细节薄弱
        blocks:
          - type: paragraph
            body: >-
              从能力看，Carro 的公开优势仍是它声称掌握的流程广度。TechCrunch 和 Carro 自有网站都指向批发、零售、金融科技或相邻服务层，这比纯流量网络更宽。即便如此，
              公开记录也显示，可见信任栈中的很多部分已经不再独特。马来西亚、泰国、印度尼西亚和新加坡的竞品页面现在都在宣传检测、保修、融资计算器、即时出售处理或认证伙伴信号。
              这意味着，投资人不应把发现层便利性或泛化信任话术当成持久差异化。更持久的问题是，Carro 能否比同行更有效地变现这些服务，并取得更好的单位经济。


              定价是公开比较中最弱的一维。留存表面材料显示了消费者车辆价格、融资报价、经销商套餐和即时出售承诺，但没有给出统一的区域抽佣率表或合同时间表。监管姿态也大多是间接的。 竞争者披露检测、保修、认证伙伴和新兴 EV
              电池认证叙事等信任代理，但没有给出跨市场牌照、投诉指标或承保控制的干净地图。正确分析动作是明确保留这些缺口，而不是从营销页面编造精确价格或合规领先排名。
