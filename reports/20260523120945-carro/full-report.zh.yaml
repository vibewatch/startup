      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 法律 / 监管
        - 具名监管行动、禁令，或与消费者做法或欺诈控制相关的重大法律通知
        - 核心市场出现任何正式行动，或投诉反复升级且没有补救
        - 暂停投资审查，推进投资逻辑前要求法律补救计划
      - - 运营信任
        - 退款、保修索赔或投诉率显著上升
        - 客户补救或缺陷解决指标持续恶化的证据
        - 重估利润率质量，并假设返工、品牌和营运资本拖累更高
      - - 欺诈 / 滥用
        - 市场层面的欺诈损失或冒名事件持续出现
        - 反复出现诈骗损失、拒付或数字平台违规发现
        - 在运营控制通过独立验证前，把欺诈控制视为投资逻辑破裂点
      - - 资本可得性
        - 因市场关闭，最后一轮融资延后或 IPO 时间显著变化
        - 错过融资窗口、估值大幅降低或融资成本显著上升
        - 假设稀释更高、扩张更慢、退出路径更弱
      - - 合作伙伴依赖
        - 来自 HSBC、Woori 或 SY 的支持未转化为可靠资金或执行收益
        - 授信或合作不及预期、终止或引入控制问题
        - 下调增长假设，并要求不含伙伴提振的独立经济性
      - - EV 信任 / 质量
        - EV 占比上升时，仍没有可信的电池健康、残值或检查证据
        - EV 库存实质增长，但没有匹配的信任和损失控制指标
        - 在模型中限制 EV 上行情景，并扩大融资和残值损失假设
    notes: 这些否决标准把本章的剩余风险排序转成可监控事件，让投资逻辑能在完整下行进入汇总财务前被更新。
