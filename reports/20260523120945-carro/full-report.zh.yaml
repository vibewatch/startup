  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              分析 Carro 时，应把它放在东南亚二手车零售和车主服务市场里，而不是整个汽车商业市场里。官方和独立公司来源一致认为，这项业务已经不再是纯列表网站：它围绕二手车交易绑定了零售、
              批发、融资、保险、售后和相关服务层。因此，最相关的支出池是有组织、由数字化媒介承载的二手车商业活动；在那里，检测、定价、信任和融资可以被变现。它不包括所有新车 OEM 收入、制造收入，
              也不包括从不接触平台、保修或融资通道的每一笔非正式点对点或现金车场交易。


              Carro 面对的现状替代方案很分散：非正式经销商、买卖双方直接谈判、既有经销商集团、银行主导融资，以及与购车分开销售的保险公司。新加坡也不应被当作默认的区域模板， 因为其 COE
              制度创造了独特的拥车和置换周期。实际结论是，Carro 的市场边界是二手车支出中更窄、更结构化的一层，而不是最大头部 TAM 暗示的全部空间； 变现集中在信任和融资能解决真实摩擦的地方。
