      - number: '3.4'
        title: 切换成本中等；分发能力和既有玩家反击让护城河脆弱
        blocks:
          - type: paragraph
            body: >-
              留存证据指向中等而非极高的切换成本。买方多平台使用看起来容易，因为大型库存池仍可在各国本地网站和广义再商业平台上搜索。卖方和经销商多平台使用也合理，因为竞品页面强调的是经销商会员、
              付费账户、伙伴网络和销售套餐，而不是排他性。Carro 最强的切换成本逻辑，只有在它把评估、批发流动性、融资、保险和售后绑定成一个流程时才出现。换句话说，护城河更偏运营，而不是数字本身。


              这种区分很重要，因为反向证据真实存在。KR Asia 把该品类描述为艰难生意，Bloomberg 报道 Carsome 为实现盈利进行了裁员，OLX 的战略再定位也显示既有玩家可以用 AI 投资和收购强势回应。
              与此同时，亚太风险研究强调数字颠覆和 AI 相关运营风险，这削弱了任何简单的软件护城河叙事。如果服务附加和承保引擎能够复利，Carro 仍可能最有机会建立持久优势。
              但当前公开证据只支持一条中等、依赖执行的护城河，而不是一个不受多平台使用、商品化或既有玩家反击影响的赢者通吃地位。
