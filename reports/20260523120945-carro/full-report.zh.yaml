  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与地理覆盖
        blocks:
          - type: paragraph
            body: >-
              Carro 的公开客户表面明显比简单二手车列表网站更宽。官方关于页面称，公司在七个市场经营零售、保险、售后和融资；独立资料报道则补充说，消费者和经销商可以在平台上买卖车辆，
              用户也可以租车或租赁车辆。换句话说，公开证据至少支持七条实际客户通道：零售买家、私人卖家、经销商或批发交易对手、金融用户、保险和售后用户、租赁或订阅用户，
              以及新加坡、马来西亚、印度尼西亚、日本和其他运营市场的国家特定用户。


              地理很重要，因为 Carro 的客户证明在不同市场之间并不均衡。新加坡通过评论、推荐语和租赁页面拥有最丰富的直接用户证据。马来西亚拥有新加坡以外最强的运营证明，
              因为留存更名报道详细说明了实体中心、检测基础设施、车间、翻新产能，以及第三方市场上的实时认证库存。印度尼西亚和日本的表面较薄，但 Automall FAQ 和日本关于页面仍提供了真实本地化证据。


              公开记录仍未揭示的是这些细分内部的组合。经销商参与被提到，但经销商数量和 GMV 份额没有披露。金融、保险和售后明确属于客户主张的一部分，但公开材料没有量化多少客户附加了这些服务，
              也没有说明这些用户是新客户，还是零售买家的附加购买。这让客户分层可信，但仍不能完全形成尽调判断。
