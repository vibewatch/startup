        - 新 EV OEM 激励和制造补贴
        - 二手 EV 买方、贷款机构、保险公司
        - EV 占比上升时的新兴信任楔子
      - - 新车 OEM 销售与制造（相邻，排除）
        - 仅作为供应背景；影响库存和消费者预期
        - 直接纳入二手车 TAM 或 Carro SAM
        - OEM、分销商、经销商网络
        - 重要背景，但不是 Carro 的核心市场
    notes: 边界逻辑刻意把所有二手车周转，与 Carro 能靠信任、金融和标准化交付变现的更窄切片分开。
