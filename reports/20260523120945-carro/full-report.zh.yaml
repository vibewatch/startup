  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 即便没有公开执法档案，剩余风险栈仍然偏高
        blocks:
          - type: paragraph
            body: >-
              Carro 的留存风险材料指向一家公司：核心下行风险如今更像是传导问题，而不是单一的生死缺陷。公开材料没有呈现针对 Carro
              的执法行动或诉讼档案，但不能把这种缺席解读成低风险。相反，这组材料显示，公司横跨多个消费者保护制度，仍在讨论 IPO
              前再融资一步，并依赖退款、保修、认证、公平报价流程等信任承诺。客户重视这些功能，但运营错误也会沿着这些路径演变成投诉、法律或融资事件。


              因此，严重性排序首先是资本通道，其次是消费者保护与反欺诈合规，再次是运营信任兑现。资本通道排第一，因为 Business Times 和 Reuters 来源报道都把又一轮融资和受市场影响的 IPO
              时点描述为现实依赖，而不是可选上行。消费者保护与反欺诈合规排第二，因为新加坡已经存在从投诉到禁令的路径，泰国也在收紧平台义务，同时报告了大额线上欺诈损失。运营执行排第三，因为 Carro
              的公开承诺面很宽，但材料包仍缺少分市场投诉、欺诈损失和保修率披露。本节两张图概括了这套层级，并展示本地化失败如何传导到收入、利润率和估值。
