  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合不只是独角兽对独角兽
        blocks:
          - type: paragraph
            body: >-
              留存来源包不支持“Carro 只与 Carsome 竞争”的狭窄看法。第三方市场图谱和官方竞品页面显示，至少存在五类实质不同的方案。第一类是全栈二手车运营商，
              把交易流与检测、融资和售后结合起来。第二类是有规模的分类信息和经销商广告网络，例如 OLXmobbi、iCarAsia 或 Carlist、One2car、Mobil123、sgCarMart 和 Mudah。
              第三类是 Motorist 这类车主服务相邻业务，可以通过估值、融资、保养和伙伴分发截获卖方与买方。第四类是 Mordor 列出的 OEM 认证二手车项目，通过品牌背书销售信任。
              第五类是现状替代方案，例如线下经销商、买卖双方直接谈判，以及经销商集团内部采购部门。


              这种广度很重要，因为每一类都攻击 Carro 价值链的不同部分。列表主导玩家掌握流量和经销商关系。全栈同行追逐与 Carro 相同的信任和变现切口。相邻车主服务 app 可以在不承担库存风险的情况下获客。 OEM
              认证项目最强竞争点是保障，而不是便利性。线下渠道仍然相关，因为即使数字平台也依赖检测、实体交付和融资审批。因此，正确框架是分层竞争格局；流量、信任、融资和运营执行都可以被争夺。
