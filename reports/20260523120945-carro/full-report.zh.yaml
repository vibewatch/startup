  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - EBITDA 实质性向 S$130M 靠近，附加业务组合保持强劲，美国 IPO 窗口也配合。
        - US$3.8B-$4.5B；上行空间取决于前瞻盈利能力证据，而不是历史可比倍数。
        - 需要比公开记录目前证明的更强 EBITDA 转化，也需要更少市场逆风。
        - 在现有证据下有可能，但不是核心情景。
      - - 基准
        - Carro 继续改善，但定价更接近上一轮确定融资，而不是传闻高位。
        - US$2.8B-$3.3B；折价后期入场有温和上行，若按传闻定价入场，上行有限。
        - 披露仍不完整，公开可比公司也压住热度。
        - 现有证据最支持这一情景。
      - - 悲观
        - IPO 时点后移、盈利进展不及预期，或美国 IPO 窗口仍然困难。
        - US$1.5B-$2.2B；下行类似向更严苛的公开可比公司或私募市场参照重定价。
        - 同业压力、资本市场疲弱和融资结构不透明都会影响判断。
        - 如果投资人按接近传闻区间的价格买入，下行风险真实存在。
    notes: 情景区间是判断值，锚定留存财务证据、公开可比公司倍数和上一轮确定私募融资；不是完整 DCF 或承销商模型。
