      - number: '6.3'
        title: 具名客户证明存在，但大多是轶事
        blocks:
          - type: paragraph
            body: >-
              Carro 留存客户证明更像消费者案例，而不是企业客户背书。最强的具名买家引用来自两条独立 Trustindex 评论和一条公司撰写的推荐语。Reuben Phang 把购买流程描述为透明、顺畅且没有硬推销。
              Jonathan Lim 说交易无缝，并且在时间安排上异常配合。Carro 自有博客中出现的外籍买家 Kris 说，列表细节比其他网站更一致，整体体验很好。这些是具体、具名的证明，说明真实买家完成了交易；
              但它们仍是轶事，而不是统计上有代表性的样本。


              也存在反向的直接用户证据，这很重要，因为只有正面推荐语并不够。HardwareZone 上一个卖方讨论串描述了检测和试驾步骤、两周交车预期、交车后同日付款、一笔 S$218 的贷款结清文件费， 以及 Carro
              可能向卖方压低报价的警告。该讨论串置信度低，因为发帖者实际上匿名；但它仍有用，因为它显示即使估值从线上开始，卖方摩擦仍可能持续存在。


              支持性的第三方表面是流程证明，而不是个人证明。oto.my 展示带明确保修和退款措辞的实时认证库存，Carro Indonesia 的 FAQ 则列出预订、试驾、付款和保修流程。 合在一起，它们让“Carro
              客户主张纯属理论”这个说法站不住脚，但仍没有揭示留存、复购行为或按队列划分的满意度。
