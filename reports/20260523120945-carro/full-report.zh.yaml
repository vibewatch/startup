      - number: '7.2'
        title: 即便没有点名 Carro 的案件，法律与监管敞口仍由制度驱动
        blocks:
          - type: paragraph
            body: >-
              法律故事的强项在制度清晰度，不在公司专项披露。新加坡 CPFTA 明确覆盖不公平做法和不合格商品，CCS 也说明，惯犯可从 CASE 或 STB
              的投诉处理进入调查和法院禁令。泰国增加了第二层相关性：其消费者保护框架覆盖欺骗性广告、不公平合同和不安全服务，较新的反欺诈措施也扩大了数字平台、银行和电信公司的合规负担。ASEAN 和 UNCTAD
              材料补上区域层面的判断：数字市场消费者保护正变得更协调、更重要，而不是相反。


              这对 Carro
              很关键，因为公司公开称其在新加坡、马来西亚、印度尼西亚和泰国等亚洲市场运营。一个二手车市场平台如果同时营销认证、金融、退款和保修，就不能把消费者保护当成狭窄的法律脚注。同时，留存材料包没有呈现针对 Carro
              的诉讼、禁令或监管行动。正确解读是谨慎，而不是洗清风险。投资者应把没有公开执法档案视为披露缺口，直到尽调拿到按市场拆分的法律或有事项清单、投诉日志和监管通信。下面的法律登记表因此按严重性排序制度敞口，同时把
              Carro 专项执法定义为留存材料中的缺席，而不是杜撰事实。
