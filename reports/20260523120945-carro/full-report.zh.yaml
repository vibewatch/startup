      - number: '7.4'
        title: 融资、伙伴和资本市场依赖仍是一阶风险
        blocks:
          - type: paragraph
            body: >-
              Carro 眼下的动能没有消除外部依赖，只是改变了依赖形态。HSBC 表示其 ASEAN Growth Fund 正在支持 Carro 的国际扩张。Woori
              的投资不只是资本，还被包装成支持东南亚扩张、包括印度尼西亚在内的更紧密伙伴关系。SY Holdings 预计带来跨境金融解决方案、预测分析和基于 API 的集成。这些关系能帮助 Carro
              扩张，但也意味着融资速度、信贷产品触达和部分运营效率提升，取决于公司并不完全拥有的交易对手和集成。


              资本市场一侧更明确。Reuters 来源和 Business Times 报道称，Carro 在 IPO 前仍希望再融资一步，先把年化 EBITDA
              推到更高水平，并可能寻求美国上市；上市时点和规模仍取决于市场条件。这组条件让资本通道成为剩余风险，而不是已经解决的结果。实际含义是，投资者不只是在承销二手车需求或运营利润率；他们也在承销伙伴连续性、融资市场开放度，以及公司能否按计划把私人市场动能故事转成公开市场就绪状态。下面的依赖表和图谱按剩余严重性排序这些敞口。
