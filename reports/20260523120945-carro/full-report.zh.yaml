      - number: '2.2'
        title: TAM、SAM 和 SOM 代理指标——保留矛盾
        blocks:
          - type: paragraph
            body: >-
              留存来源无法支持一个单一、权威的东南亚二手车市场数字。相反，它们支持的是一个区间，而且这个区间因为结构性原因很宽。Credence 给出的 2024 年市场价值约为 USD 36.4 billion，并预计到
              2032 年增长至约 USD 58.0 billion；Mordor 则把市场规模放在 2025 年 USD 69.73 billion、2026 年 USD 74.33 billion。Verified
              Market Research 的数字高得多，为 2024 年 USD 205.8 billion。Ken Research 也把该品类描述为后期增长阶段、线上平台渗透率上升， 但其公开预告没有给出现值数字。


              正确读法不是把这些数字取平均。较低的两组更接近有组织渠道或更窄的市场价值口径，高端数字很可能包含更宽的交易价值或服务纳入口径。对 Carro 而言，这使得公开来源无法支撑精确的 SAM 和 SOM
              计算。最有证据支持的做法是使用代理：用宽口径东南亚二手车价值池作为 TAM 背景，把 SAM 收窄到 Carro 运营市场中有组织、数字化、经过检测、带融资的二手车零售，
              并在缺少国家交易量、抽佣率和附加率披露时，拒绝给 Carro 分配精确份额。印度尼西亚和越南在方向上重要，但公开国家数据仍太碎片化，无法做出干净的自下而上模型。
