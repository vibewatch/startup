  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面与客户流程
        blocks:
          - type: paragraph
            body: >-
              Carro 的产品最好被描述为一体化二手车商业和车主平台，而不是简单列表网站。官方和独立来源支持多个面向客户的通道：买卖二手车、绑定融资和保险、通过 LEAP 订阅，并留在生态内做保养维护。 面向日本的页面增加了
              Carro Certified 和租赁导航；TechCrunch 及公司关于页面支持更宽的零售、批发和金融科技框架。这种组合很重要，因为公开证据指向的产品，是通过流程控制和服务附加变现， 而不只是分类信息流量。


              流程证据也异常偏运营。McKinsey 和 The Straits Times 描述了无接触或低销售人员介入的购车体验；Carro 的 AI 流程新闻稿则把卖方承诺变成具体时间框： 15 分钟响应、30
              分钟检测、24 小时内付款。LEAP 展示了订阅在实践中如何交付：选择车辆、取车或收车、在 app 内管理支持，然后更换或归还。因此，产品定义从客户便利性开始， 但背后靠检测、物流、融资和售后执行兑现。
