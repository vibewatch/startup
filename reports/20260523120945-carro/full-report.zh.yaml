  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 局部合规、质量或合作伙伴失误，可能一路传导为投诉、利润率流失、融资压力和估值受损。
    approximationNotes: 连线只展示保留来源支持的方向性传导路径，不量化发生概率或失败后的损失。
    data:
      nodes:
        - id: legal
          label: 消费者 / 法律制度
          detail: 新加坡和泰国显示，正式投诉、禁令或平台义务都可能成为路径。
        - id: fraud
          label: 欺诈压力
          detail: 线上销售欺诈和冒名风险会外溢为投诉和合规问题。
        - id: quality
          label: 检测 / 认证
          detail: 车况、质保和电池可信度左右客户信心。
        - id: partners
          label: 融资伙伴
          detail: HSBC、Woori 和 SY 影响资金周转速度和执行杠杆。
        - id: ops
          label: 国家运营
          detail: 马来西亚和印度尼西亚流程显示，执行高度依赖线下资产和流程。
        - id: complaints
          label: 投诉 / 救济
          detail: 退款、索赔和卖家纠纷最先在这里显性化。
        - id: margin
          label: 利润率 / 营运资本
          detail: 返工、退款和周转变慢会很快打到经济性。
        - id: funding
          label: 融资渠道
          detail: 伙伴和市场信心决定融资灵活性。
        - id: valuation
          label: IPO 准备度 / 估值
          detail: 公开市场故事要靠可信控制和干净的下行风险撑住。
      edges:
        - from: legal
          to: complaints
