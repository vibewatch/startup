      - number: '2.4'
        title: 增长驱动、采用约束、监管与信任
        blocks:
          - type: paragraph
            body: >-
              该品类的增长逻辑真实存在。市场报告持续把相对新车的可负担性、城市化、数字可及性和更好的融资方案，列为二手车需求持续扩张的原因。区域宏观数据足以支撑品类继续前进：AMRO 仍预计到 2026 年约 4%
              增长，ADB 也强调有韧性的整合和数字增长。汽车市场追踪数据还显示，只要融资条件允许，需求可以快速反弹。


              但约束同样重要。PwC 的 ASEAN-6 快照明确把 2024 年泰国和印度尼西亚的疲弱与汽车贷款收紧联系起来，说明信贷不只是助推器，也是卡点。信任仍是另一个卡点：
              线上二手车平台仍需要经验证的车史、检测、保修，以及越来越重要的二手 EV 电池健康认证。消费者保护规则也仍在演进，UNCTAD 的 2025 年泰国协议就说明了这一点。
              最后，公开数据栈分散在各国门户和行业协会之间，限制了干净的自下而上测算。合并看，Carro 所处市场有可见的长期需求，但融资、监管和数据质量带来显著摩擦——这正是信任主导平台能够胜出的条件，
              也是不应接受无证据份额主张的环境。
