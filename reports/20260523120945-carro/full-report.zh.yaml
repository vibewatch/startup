      - number: '5.5'
        title: 产品技术判断与风险
        blocks:
          - type: paragraph
            body: >-
              留存证据足以说明 Carro 有真实产品和运营栈，而不只是营销叙事。它清楚覆盖数字化买卖、订阅、融资和保险附加、检测和翻新、本地化国家页面，以及管理分支和供应商流程的内部 app。
              这比多数消费者市场公开披露的产品图景更扎实，也解释了为什么管理层持续把 Carro 描述为汽车平台。


              问题在于，公开资料包证明执行表面，比证明技术防御性更有力。最大风险是架构不透明、依赖设施和伙伴集成、公开可靠性证据薄弱、缺少安全或隐私项目材料，以及路线图主张偏战略而非发布级。 EV
              电池信任是另一个前瞻风险，因为它很可能成为二手车平台的产品要求；但留存资料包没有显示已披露的电池健康能力。因此，投资人可以把 Carro 承销为一家运营较重、技术赋能且有真实流程控制的市场平台，
              但还不能把它承销为拥有透明软件护城河、并有公开级安全和可靠性披露的平台。
