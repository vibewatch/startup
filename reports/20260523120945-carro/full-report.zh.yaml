      - number: '8.3'
        title: 融资背景、稀释注意事项与可比公司组
        blocks:
          - type: paragraph
            body: >-
              Carro 的融资背景有建设性，但仍不完整。Tracxn、CB Insights 和公司材料都指向一家资本充足的公司，但它们对历史累计融资总额并不一致：公开统计从超过 US$600 million 到略高于
              US$800 million 不等。Tracxn 的轮次历史，加上 TechCrunch 和 The Asset 对 2021 年 Series C 的报道，确认公司存在一套重要的优先权栈，由 SoftBank
              Vision Fund 2 领衔，后续战略资本跟进。Cool Japan Fund 和 Woori 在 2024-2025 年增加了新资金，但条款未公开。这意味着，仅凭公开来源无法精确建模稀释和优先权压力。


              可比公司组因此要完成两件事。第一，公开交易可比公司展示市场已经接受的汽车平台倍数边界：CarMax 位于低端，AUTO1 是结构上最接近的公开类比，Carvana 则是更高倍数的数字零售基准。第二，Carsome
              和 OLX 勾勒区域和战略背景。Carsome 是最接近的私人同行，但其裁员凸显盈利有多难。OLX 展示了高利润率分类信息经济学可能长什么样，而 La Centrale 交易说明，盈利的汽车资产仍能吸引战略买家。
