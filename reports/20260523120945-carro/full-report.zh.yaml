  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              Carro 的正向案例是真实的，但并非价格不敏感。留存资料集中最强的证据，是公司 FY2024-FY2025 的财务推进：收入达到 S$1.2 billion，毛利达到 S$149 million，流动性为
              S$385 million，EBITDA 仍为正，达到 S$43 million。附加服务是这套案例的核心。Carro 称附加服务接近 FY2024 毛利的 60%，并超过 FY2025 毛利的
              55%，这意味着公司扩大利润率并不只靠二手车交易量。Cool Japan Fund 和 Woori 等战略投资者也表明，Carro 在拟议上市前仍能吸引伙伴资本。


              反向论点同样扎根于公开记录。Reuters 框架下的报道支持超过 US$3 billion 的估值，其他媒体还传出超过 US$3.8 billion 的传闻区间，但这些标题都不能替代已披露 IPO
              条款。Business Times 称 Aaron Tan 希望 IPO 前 EBITDA 达到 S$130 million，相比 FY2025 基数还差 S$87 million。CarMax、AUTO1 和
              Carvana 等公开可比公司的已披露收入倍数，远低于高端传闻区间套在 Carro 公开销售基数上所隐含的水平。因此，投资问题不是 Carro
              是否是一家严肃公司；而是投资者是否应该在公开记录尚未充分证明之前，预先为利润率和披露改善买单。
