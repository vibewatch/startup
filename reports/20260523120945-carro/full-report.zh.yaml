      - number: '8.5'
        title: 退出就绪度与投资假设破裂触发器
        blocks:
          - type: paragraph
            body: >-
              退出就绪度在提高，但还没有完全公开化。留存证据显示，公司具备上市候选人的真实要素：收入规模、正 EBITDA、流动性和 2025
              年新资本。缺失的是已提交招股书、已披露承销商、确认上市地和最终治理结构。这个缺口很关键，因为后期投资者不只是在承销公司质量；他们还在承销退出工具本身是否可见、是否可投资。


              因此，投资假设破裂触发器应聚焦那些直接损害从私人估值到公开流动性路径的事件。第一，如果 EBITDA 无法从 FY2025
              基数继续上行，就会削弱整套利润率扩张叙事。第二，任何融资条款或债务结构严于预期的证据，即使名义价格不变，也会改变实际股权价值。第三，比预期更艰难的同行或市场背景——包括 Carsome 树立更弱的公开参照，或美国
              IPO 窗口持续不友好——无需单季收入失手，也能打破投资论点。投资者应把这些触发器当作否决标准，而不是寄望下一次披露来修复问题的理由。
