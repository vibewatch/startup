  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Carro 的可见旅程从搜索或估值开始，经过检测和交易选择，再延伸到保养、订阅和潜在重复使用。
    data:
      items:
        - label: 发现 / 请求报价
          value: 1
          note: 买家搜索挂牌车源，或卖家在 Carro 数字界面请求估值。按地区看，新加坡和马来西亚的入口最强。
        - label: 评估 / 预约检测
          value: 2
          note: 检测、试驾和估值步骤，把数字兴趣转成买卖双方都能感知的线下信任事件。
        - label: 交易选择
          value: 3
          note: 客户根据需求和首付预算，选择购买、出售、挂载融资或月度订阅。
        - label: 交付 / 保修 / 退款窗口
          value: 4
          note: 认证、保修，以及五天退还或退款表述，把信任承诺变成可触摸的权益。
        - label: 用车服务
          value: 5
          note: 保险、售后、维护和应用支持，让客户在第一笔交易后继续留在生态里。
        - label: 复购 / 换车 / 回售
          value: 6
          note: 回售、订阅换车或退还路径，以及未来的金融或售后挂载，都可能带来重复行为，但公开续订指标缺失。
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
      - CU015
      - CU038
      - CU040
      - CU041
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 可见采用漏斗是定性的：广泛的市场入口把用户导向检测和信任控制，核心交易之后再挂载到服务车道。
    approximationNotes: 这条流程刻意按流程而非数字呈现，因为留存公开资料没有披露管道阶段数量、活跃客户总数或转化率。
    data:
      nodes:
        - id: awareness
          label: 搜索 / 市场认知
          detail: 用户经由新加坡、马来西亚、印度尼西亚和日本的挂牌搜索、报价请求或国家页面进入。
        - id: proof
          label: 建立信任的证据
          detail: 检测主张、退款、保修和评价降低用户感知中的二手车风险。
        - id: buysell
          label: 购买或出售交易
          detail: 定价和检测之后，客户完成零售购买或卖家交车。
        - id: finance
          label: 融资 / 保险挂载
          detail: 部分客户在车辆交易周围挂载贷款、保险或其他附加产品。
        - id: service
          label: 售后 / 认证支持
          detail: 工坊、整备中心、保养和保修支持在交付后维持信任。
        - id: repeat
          label: 订阅 / 重复路径
          detail: 月租、换车或退还，以及未来回售，在未披露续订数据的情况下，仍可能创造重复关系。
      edges:
        - from: awareness
          to: proof
          label: 列入候选并验证
        - from: proof
          to: buysell
          label: 承诺交易
        - from: buysell
          to: finance
          label: 挂载融资或保险
        - from: buysell
          to: service
          label: 进入认证用车支持
        - from: finance
          to: service
          label: 留在生态
        - from: service
          to: repeat
          label: 续订、换车或重新进入漏斗
        - from: repeat
          to: buysell
          label: 重复交易或回售
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU018
      - CU019
      - CU038
      - CU040
      - CU045
