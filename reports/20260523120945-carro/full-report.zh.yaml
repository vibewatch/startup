      - number: '5.4'
        title: 差异化、信任与控制表面
        blocks:
          - type: paragraph
            body: >-
              Carro 证据最充分的差异化是运营层面的，而不是纯技术层面的。公司反复把卖点锚定在定价算法、AI 支持能力、快速卖方响应、无接触购车，以及从交易延伸到维护、保险、融资和翻新的生命周期栈。
              BusinessToday 的检测故事、Carro 印度尼西亚博客上的认证车辆承诺，以及分支和供应商运营 app 表面，都强化了一个判断：公司正试图控制典型分类信息运营商留给交易对手的信任关键步骤。
              只要执行能持续，这就是一个真实差异化点。


              但相对于产品技术尽调想要看到的材料，信任和合规表面仍然薄弱。最强的明确隐私信号，是 Google Play 声明某个检测管理 app 不共享数据也不收集数据。供应商工具提到许可、保险和到期提醒， SY
              合作则在融资集成周围使用治理和合规语言。即便如此，留存资料包没有展示安全认证、隐私中心、状态页或专利细节。正确结论是，Carro 有可见的质量控制和信任叙事，
              但还没有一套公开记录的控制框架，能让投资人有信心承销安全、隐私或知识产权防御性。
