  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参照意义
      - 局限
    rows:
      - - Carro
        - 最新确定私募锚点
        - 2025 年 9 月一轮投后估值 US$3B（Tracxn）；传闻区间为 >US$3B 至 >US$3.8B
        - 这是投资人今天必须承销的价格锚。
        - 股权结构表、优先权堆叠和准确 IPO 条款仍未公开。
      - - Carvana
        - 公开市场交易倍数
        - 2.29x EV/Revenue；26.17x EV/EBITDA；~US$48.91B 市值
        - 留存样本中，最好的高倍数数字二手车基准。
        - 美国市场龙头，但规模、资产负债表和重组历史都不同。
      - - CarMax
        - 公开市场交易倍数
        - 0.23x 市销率；0.93x EV/Revenue；~US$5.72B 市值
        - 展示成熟混合零售经济性在公开市场可能是什么样。
        - 成熟美国既有巨头，与 Carro 的增长和资产画像差异很大。
      - - AUTO1
        - 公开市场交易倍数 + 申报文件支撑的可比对象
        - 0.70x EV/Revenue；30.58x EV/EBITDA；IR 页面提供年报
        - 留存样本中结构上最接近的上市汽车平台。
        - 欧洲市场组合和收入规模与 Carro 差异显著。
      - - Carsome
        - 最接近的区域私募同业
        - '>US$600M 已融资；区域报道中的估值标记 >US$1B；通过裁员实现盈利'
        - 东盟全栈二手车执行和 IPO 野心的最佳区域参照。
        - 留存样本中没有新的公开估值或经审计公开 P&L。
      - - OLX / La Centrale
        - 盈利汽车 / 分类信息锚点
        - OLX FY2025 收入 US$777M，aEBIT 利润率 35%；La Centrale 以 EUR1.1B 被收购
        - 说明盈利汽车资产的战略价值，以及轻资产经济性可以获得的定价。
        - 分类信息模式比 Carro 的全栈模式结构上更轻、利润率更高。
    notes: 覆盖留存来源集中最影响决策的公开和私募参照：直接汽车平台、最接近的东盟私募同业，以及一笔战略汽车交易。
    enumerationScope:
      coverage: partial
      basis: >-
        The set includes the subject company, three public trading benchmarks, the closest private ASEAN peer, and one
        strategic motors transaction. Coverage is partial because no complete public universe of Southeast Asian
        full-stack used-car platforms with current valuation disclosure exists in the retained source set.
