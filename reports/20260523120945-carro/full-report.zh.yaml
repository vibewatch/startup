              Carro 的融资历史显示，公司持续把资金来源从纯风险资本拓宽出去。2021 年 Series C 融资 US$360 million，并确立独角兽地位；SoftBank Vision Fund 2
              是报道中的核心领投方，MSIG、EV Growth 等投资人也被点名。完成那次估值跃升后，Carro 增加的是战略资本和运营伙伴，而不只是依赖另一轮传统 VC 融资。 Jardine Cycle &
              Carriage 于 2023 年进入一项与 Republic Auto 相关的交叉持股合作；Woori Venture Partners 于 2024 年底投资 Carro， 当时管理层强调东南亚扩张；Cool
              Japan Fund 于 2025 年领投 US$60 million 战略投资；SY Holdings 则签署了一项面向融资的合作，关联跨境资金和新车主张。 市场数据提供商对累计融资额并不一致，公司文案仍称超过
              US$600 million，而 Tracxn 和 CB Insights 指向更接近 US$686 million 至 US$800 million 的后续统计。
              这个区间足以作为公司概览快照，但不够精确，不能替代当前股权结构表。
