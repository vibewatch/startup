      - number: '5.3'
        title: 部署、集成、支持与路线图
        blocks:
          - type: paragraph
            body: >-
              Carro 的部署模式是多市场且运营本地化的，但留存资料包展示它的方式，是国家页面和伙伴公告，而不是正式产品状态页。公司官方声称覆盖七个市场；日本有自己的买车、卖车、认证和租赁入口； 马来西亚承接 myTukar
              的业务版图，仍包含检测和翻新资产；印度尼西亚官方博客则营销带保修和经销商网络覆盖的认证库存。支持同样通过流程表面而不是企业级文档可见： LEAP 通过 app 路由协助和保养，Carro Branch
              处理投诉和报告，供应商 app 管理文件、许可和保险提醒。


              公开成熟度较低的是路线图和可靠性表面。2025 年后期来源显示了方向性议程——日本 PHEV 扩张、安全的 API 型融资集成、探索性全新车主张，以及 AI 驱动的购车体验——
              但这些来源都不像有日期的工程发布日历。同样，运营 app 列表和速度承诺没有附带正常运行时间、SLA 或事故数据。因此，部署广度可见，支持触点可见，但服务可靠性和实施深度仍大多是私人信息。
