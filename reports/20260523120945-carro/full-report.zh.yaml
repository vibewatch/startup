      - number: '8.6'
        title: 最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              剩余工作不是泛泛尽调，而是估值关键尽调。第一个阻断项是当前股权结构表，包括股份类别、清算优先权、反稀释条款，以及任何参与型优先权安排。没有这些，投资者无法把名义估值转换成普通股经济性。第二个阻断项是 Genie
              Financial Services 的杠杆披露，包括债务、库存融资或仓储信贷额度以及围绕它们的契约。这些条款决定 Carro 的 EBITDA 有多少真正可持续，多少依赖资产负债表。


              下一优先级是 IPO 流程证据。投资者需要知道 Carro 是否已经选定投行、预期流通盘多大、哪个上市地仍是主选，以及公司是在推进保密路径，还是根本尚未走到那一步。最后，管理层应提供从 FY2025 S$43
              million 基数到 S$130 million 公开目标的 EBITDA 桥。没有这座桥，投资者本质上买的是未来盈利故事，而不是通向盈利的已记录路径。今天任何买入判断都应被这些尽调问题卡住。
