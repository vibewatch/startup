      - number: '4.5'
        title: 财务判断：收入质量改善，但尽调输入仍不完整
        blocks:
          - type: paragraph
            body: >-
              财务判断好于泛泛的东南亚创业公司增长故事，但弱于面向公开股票市场的披露包。收入质量方向上有所改善，因为毛利增长快于收入，且附加业务在 FY2024 和 FY2025 都贡献了大部分毛利。
              这支持一个判断：Carro 最好的经济性来自融资、保险、售后和其他附加服务，而不是低利润率车辆周转本身。公司进入任何融资讨论时，也比许多同行处在更强位置，因为它 EBITDA 为正， 且报告了较大的流动性缓冲。


              阻碍点很明确。公开来源没有披露实际定价、按收入流或地理拆分的收入结构、各通道毛利率、CAC、回本周期、库存周转、烧钱速度、现金跑道、债务余额或项目融资义务。 即便累计融资总额，也无法在公司文案、Tracxn 和
              CB Insights 之间干净对账。留存资料包中接近监管文件风格的证据，只是注册资料衍生的公司简介，不是招股说明书或经审计分部文件。 对尽调而言，这意味着 Carro
              可以获得规模和可信利润率路径的信用，但不能被视为已有经承销的分部经济性或完全透明的资本结构。
