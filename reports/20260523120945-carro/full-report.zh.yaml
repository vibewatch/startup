      - number: '8.7'
        title: 附录
        blocks:
          - type: callout
            title: 投资论点
            body: Carro 有一个可以承销的真实运营基底：已披露的 FY2025 收入、正 EBITDA、流动性，以及越来越来自附加服务而不只是交易价差的利润率引擎。相比许多后期区域科技故事，这已经是更多公开可见的东西。
            calloutType: strength
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV010
              - CV044
          - type: callout
            title: 反向论点
            body: 当前问题不是 Carro 是否是一家严肃公司；而是在看到股权结构表、债务条款，以及通向管理层公开 IPO 前置条件的更清晰 EBITDA 桥之前，投资者是否应接受传闻区间定价。
            calloutType: risk
