      - number: '7.3'
        title: 运营信任控制至关重要，因为它们托住品牌承诺
        blocks:
          - type: paragraph
            body: >-
              Carro 的运营风险和信任风险分不开。HSBC 把二手车市场描述成柠檬市场问题，并称 Carro 的解法是技术、检测、定价算法、金融和退款。第三方市场界面让这一点具体化：oto.my 在马来西亚的车源强调
              160 点检测、五天退款保证和 12 个月传动系统保修，Carro Indonesia 的 FAQ
              则突出认证证明、保修申请、预约、试驾和付款流程。这些都是可信的可见缓释，但也抬高了失败成本。一旦认证或结算纪律松动，下行不只是一个不满买家；它可能变成退款流失、投诉升级和跨司法辖区的品牌损害。


              轶事投诉和评论来源也强调了这一点。Trustindex 显示交易可以快速且正面地完成，但 HardwareZone 报告仍描述了卖方围绕低价预期、交车时间和贷款结清费用的摩擦。马来西亚的 11 个零售中心、27
              个检测中心、5 个维修厂和 2 个翻新中心说明，Carro 的公开运营模型有复杂的实体网络，而不是轻量软件层。往前看，二手 EV 增长又增加了一道信任前沿，因为电池健康认证越来越影响估值和金融。再叠加网络安全和
              AI 风险，运营信任就成了投资论点的核心剩余敞口之一。
