  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入流、收入质量与确认边界
        blocks:
          - type: paragraph
            body: >-
              Carro 的公开财务叙事在收入和毛利增长上可信，但无法支持经审计的分部结构。最强证据来自公司分发的 FY2024 和 FY2025 新闻稿，显示 FY2025 收入为 S$1.2 billion、 毛利为
              S$149 million、毛利率为 12.4%、流动性为 S$385 million，经审计 EBITDA 为 S$43 million。这些新闻稿还称，附加业务在 FY2025 贡献了超过 55% 的毛利，
              FY2024 接近 60%。这个结构点比绝对收入数字更重要，因为它说明公开利润率故事由服务附加驱动，而不只是车辆周转。


              留存资料包也支持一套比简单二手车市场更宽的收入架构。TechCrunch 把 Carro 的运营栈描述为批发、零售和金融科技，其中金融科技包括 B2C 贷款、汽车保险和 B2B 营运资本贷款。 Carro
              关于页面增加了零售、保险、售后和融资；The Asset 则强调订阅和按使用计费的保险产品。仍然缺失的是这些通道之间真实的经审计拆分。因此，投资人可以把多条变现路径的存在纳入判断，
              但不能精确承销逐条收入流的经济性或收入确认画像。
