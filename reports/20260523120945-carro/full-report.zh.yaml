      - number: '5.2'
        title: 模块地图与运营架构
        blocks:
          - type: paragraph
            body: >-
              公开证据没有把 Carro 的软件架构暴露到代码层级细节，因此本章应构建运营架构，而不是系统图。可见层足够清晰：客户和经销商入口、定价和 AI 决策支持、检测与翻新、
              融资和保险附加，以及一组管理审批、定价、结算和供应商合规的运营 app。Google Play 列表特别有用，因为它们显示了普通营销网站不会展示的内部控制表面：分支经理可以配置定价和处理投诉，
              供应商运营人员可以追踪行程、许可、保险、付款和车辆利用率。


              这套架构也非常物理化。BusinessToday 和 AutoBuzz 把产品质量与检测中心、车间和翻新场地联系起来；TechCrunch 与 Carro
              自有表面则把价值获取与融资、保险、经销商流动性和生命周期服务联系起来。 因此，依赖图从设计上就是混合型：一部分是市场软件，一部分是运营控制平面，一部分是各国特定设施网络。缺失的是这套栈背后的技术细节。除 SY
              Holdings 公告外，留存来源没有给出 API 参考、软件图或集成目录， 因此暂时不能把护城河承销为已披露的软件平台。
