      - number: '6.5'
        title: 扩张逻辑清晰，但集中度和采购风险披露不足
        blocks:
          - type: paragraph
            body: >-
              Carro 的扩张逻辑在公开资料里看得清。客户可以从买车或卖车切入，再叠加金融、保险、售后、认证翻新或月度订阅。马来西亚的品牌整合显示，Carro
              更像是把收购来的本地业务标准化进同一套全栈客户界面，而不是在每个市场另起一套主张。日本和香港扩张则把同一思路推向更多地域。变现结构也支持这一判断：附加服务已经贡献超过一半毛利。


              公开资料看不清的是集中度。留存来源没有披露头部客户、头部车队、头部经销商或国家层面的收入集中度。因此，客户故事的触达面看起来很宽，但经济依赖并不透明。经销商敞口尤其重要，因为资料提到经销商，却没有计数；金融用户同样重要，因为单一公开
              NPL 比率无法说明哪些客群承载风险。


              采购摩擦也没有消失。论坛证据显示，卖方交车、检测和贷款结清仍会制造运营步骤和潜在不满。买方这边，Carro 的信任栈相对可见——检测、保修、退款、认证界面、预约逻辑——但公司进入更多市场、最终深入二手 EV
              流程后，这些控制必须持续稳定运转。
