        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              留存资料包让 Aaron Tan 作为 Carro 的主要公开门面变得清晰，但对更完整的控制图谱支持明显不足。公司披露和资料来源持续把 Tan 识别为联合创始人兼首席执行官， FY2025 公司材料也披露
              Ernest Chew 为 CFO。CNA 和 Vulcan Post 的独立人物稿给了 Tan 更多背景，包括 Carnegie Mellon、BLOCK71、风险投资经历和早期创业记录；
              对其他联合创始人的信息则少得多。这种不对称对尽调很重要：Aaron Tan 很容易被纳入关键人依赖评估，但留存公开资料包没有披露完整的当前董事会名单、投票控制权或投资人权利结构。 PitchBook 和 CB
              Insights 确认了许多投资人和多轮后期融资，但仍无法替代真实董事会名单或股东权利文件。正确结论不是编造隐藏治理图，而是保留治理可见度仍明显不足这一事实， 即便公司具备强创始人品牌和可见的财务领导层。
