      - number: '6.4'
        title: 留存和耐久性仍是证据缺口
        blocks:
          - type: paragraph
            body: >-
              核心耐久性问题很简单：Carro 的留存公开来源没有披露 NRR、GRR、流失、复购、重复出售或订阅续约。公司明确宣传退款、保修、检测标准、基于 app 的保养支持和保守贷款指标等信任机制，
              但这些是留存输入，不是留存证据本身。五天退款承诺或 12 个月保修可以让买家安心，却不必然转化为高频复用或持久队列经济性。


              公开金融证据进一步强化了这种区分。FY2024 披露称 Genie Financial Services 将不良贷款率控制在 0.5% 以下，说明金融侧可能存在一定承保纪律。但留存来源没有披露金融抽佣率、
              审批率、重复借款或分部级逾期。同样的缺口也出现在订阅业务：Carro 披露了最低期限和换车或退车逻辑，但没有披露续约或转化行为。


              独立声誉交叉验证也很薄。直接评论证据规模小且大多正面，而一次更广泛的声誉抓取只返回了机器人防护。这不能证明不满客户藏在那里，但确实意味着公开评论表面太窄，无法通过尽调。 下一个信任前沿可能也与 EV
              相关：一篇独立区域文章认为，电池健康认证正成为二手车买家和贷款方的必需品；但 Carro 的留存客户页面没有明显展示匹配的 EV 电池证明表面。
            claimRefs:
              - CU007
              - CU014
