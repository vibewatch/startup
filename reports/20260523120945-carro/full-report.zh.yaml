      - number: '7.6'
        title: 缓释措施存在，但打破投资假设的触发条件清晰且可监控
        blocks:
          - type: paragraph
            body: >-
              Carro 确实有可见缓释。退款、保修、认证流程和公平定价表述说明，公司理解二手车的信任问题。Woori 新闻稿提供了一个具体的金融质量数据点：FY2024 NPL 低于 0.5%；与 HSBC、Woori 和
              SY Holdings 的战略关系也显示，公司不是独自推进增长。这些都是有意义的正面因素，也解释了为什么风险评级是高，而不是危急。


              但缓释不会自动兑现。关键的投资假设破裂很直接：出现与不公平做法或欺诈控制相关的监管或法律行动证据；退款、投诉或保修申请明显恶化；融资、伙伴集成或 IPO 时点通道受阻；以及产品组合变宽时，EV
