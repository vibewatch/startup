      - number: '7.5'
        title: 模型风险和执行拉伸藏在盈利叙事后面
        blocks:
          - type: paragraph
            body: >-
              模型风险问题不是 Carro 有没有改善；公司显然改善了。真正的问题是，在叠加收购、伙伴集成和 IPO 准备时，业务能否继续以足够快的速度改善。FY2024
              公开报道显示运营亏损大幅收窄，但同时收入增长放慢，提醒投资者盈利推进可能需要取舍。早期创业报道也把 Carro 的金融科技垂直业务与 FY2022
              的运营亏损压力联系起来，因此金融栈既应被视为利润率增强器，也可能因承保质量、资金成本和业务组合而放大波动。


              执行拉伸随后加重财务问题。Carro 称其在亚太拥有 4,500 多名员工，而仅马来西亚就运营着规模不小的检测和翻新网络。Business Times 还把一次澳大利亚收购描述为通向 IPO
              路径的一部分，又增加了一层整合工作。外围还有 2026 年仍在变化的宏观背景：AMRO、ADB 和 IMF 都更新了区域展望，同时强调不确定性、更高能源成本，或需要保持增长和通胀假设的及时性。公开叙事仍高度围绕
              Aaron Tan 的目标和评论，因此在更完整的治理和运营控制包出现前，投资者应把关键人和披露就绪风险视为真实存在。
