      - number: '8.4'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              情景框架把本章从证据收集推进到承销纪律。牛市情景下，Carro 借助附加服务组合、规模和战略资本，把 S$43 million 的 EBITDA 基数转成强得多的 IPO
              前盈利数字，同时资本市场继续向外国发行人开放。投资者正是靠这一点来证明高于上一轮确定融资的估值。基准情景下，公司继续改善，但定价仍更接近 US$3 billion 锚点，而不是传闻高位，因为 EBITDA
              证明和文件透明度仍不完整。


              熊市情景不需要运营崩塌。只要利润目标落空、美国 IPO 窗口变得更难，或同行带来的倍数压力上升，某种组合就足够。Carsome 的裁员历史和 Bloomberg 2026 年 4
              月关于诉讼与繁文缛节的报道提醒投资者，通往海外 IPO
              的路径可能在业务本身出问题前就恶化。因此，纪律化投资者应承销估值区间，而不是单一点估值；还应要求足够的入场折扣，让基准情景无需完整牛市按期兑现，也能提供可接受上行。
