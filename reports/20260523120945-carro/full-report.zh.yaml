      - number: '6.2'
        title: 采用广度通过覆盖地区和服务表面可见，而不是客户数
        blocks:
          - type: paragraph
            body: >-
              Carro 没有在留存客户资料包中公开披露活跃客户数，因此最好的采用信号是广度代理。公司声称在七个市场上线，并在亚太拥有超过 4,500 名员工。FY2025 新闻稿称香港和日本业务进一步扩张；
              马来西亚落地则显示 11 个零售体验中心、27 个检测中心、5 个车间和 2 个翻新中心。第三方库存页面进一步显示，这些中心不只是营销口径：买家可以在实时市场表面看到多辆带保修和明确退货承诺的认证车辆。


              因此，采用故事真实但间接。公开证据显示，全栈客户主张分布在多个市场和渠道，马来西亚有有意义的实体覆盖，产品表面包括零售、融资、保险、售后和订阅。财务披露又增加了一个间接广度指标：
              附加服务现在贡献大部分毛利；除非客户附加行为超出一次性车辆销售，否则很难做到这一点。


              缺失的分母仍然重要。这些公开代理都无法告诉投资人 Carro 今天服务多少活跃买家、卖家、经销商或订阅者，这些队列增长多快，或各地理区域贡献多少活动量。因此，本章把市场覆盖、实时库存、
              服务中心和附加业务结构披露视为广度指标，而不是凭空推导的客户数证明。
