      - number: '4.3'
        title: 利润率驱动已公开；成本结构和资本强度大多未公开
        blocks:
          - type: paragraph
            body: >-
              公开利润率图景方向积极，但仍然很浅。Carro 的 FY2025 毛利率从 FY2024 的 11.8% 提高到 12.4%，而 FY2024 毛利率已从 FY2023 的 8% 提高到 12%。
              在这两年中，管理层都把扩张归因于市场利润率改善、附加收入增长和生产率优化。留存资料包中最重要的成本或质量数据点，是 Carro 金融科技部门 Genie Financial Services 据称在 FY2024
              将不良贷款率维持在 0.5% 以下。这说明当融资属于业务栈的一部分时，承保纪律直接关系到毛利耐久性。


              即便如此，核心成本结构和资本强度仍披露不足。由于 Carro 覆盖零售库存、经销商或批发流动性、B2C 车贷、保险和售后，营运资本和信用敞口在结构上都相关。
              但留存公开来源没有披露库存周转、翻新资本开支、仓储或库存融资安排、应收账款账龄或现金转换周期数据。正确读法不是这些成本不存在，而是它们被聚合收入、毛利和流动性数字遮住了。
              公开证据支持利润率改善的方向，但不支持完整单位经济模型所需的机制。
