      - number: '3.2'
        title: 直接同行、既有玩家和相邻业务攻击流程的不同部分
        blocks:
          - type: paragraph
            body: >-
              Carro 自己的公开材料和以往融资报道都说明，公司不只是撮合买卖双方。它覆盖批发、零售、金融科技、保险和售后。这样的运营范围让 Carsome 成为留存资料包中最接近的直接同行， 因为
              DealStreetAsia 和 KR Asia 都把 Carsome 描述为建设带线下扩张的一体化生态，而不是停留在比价或列表网站。但这并不意味着列表主导的竞争者无关紧要。 OLXmobbi
              的即时出售流程、Carlist 的检测加保修定位、One2car 的经销商套餐和金融工具、sgCarMart 的融资入口、Mudah 的大库存池，以及 Motorist
              的伙伴网络，都显示流程的重要切片已经被其他玩家覆盖。


              最强的既有玩家反应来自 OLX，不是因为其印度尼西亚业务披露了最好的本地定价，而是因为母公司盈利、启用 AI，并仍通过收购扩张。iCarAsia 代表另一种既有玩家优势： 在主要 ASEAN
              市场中的经销商流量、线索和付费账户。净结果是，Carro 面对的不是一个单体巨头。它面对的是一个接近的全栈同行、一个资本充足的分类信息既有玩家、多个国家特定发现平台，
              以及一组能够抽走高利润供给或需求细分的相邻业务。
