    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、覆盖地区与运营模式
        blocks:
          - type: paragraph
            body: >-
              Carro 后续报告可复用的事实底座，在身份和产品范围上比治理更清晰。官方和独立来源一致显示，公司由 Aaron Tan、Aditya Lesmana 和 Kelvin Chng 于 2015
              年在新加坡创立。公司不只是分类信息网站：官方材料描述的是一个全栈汽车生态，覆盖零售、保险、售后和融资； TechCrunch 的 2021 年融资报道则把模式拆成批发、零售和金融科技。LEAP
              产品页还给出具体订阅例子，显示 Carro 管理租赁、保养、保险和基于 app 的支持，而不只是撮合交易。Carro 关于页面目前声称业务覆盖新加坡、马来西亚、印度尼西亚、泰国、日本、台湾和香港；Forbes
              也独立把这一七市场覆盖与香港 Beyond Cars 收购联系起来。因此，后续章节应把 Carro 视为拥有多层变现能力的区域汽车平台，而不是狭义的新加坡二手车市场。
