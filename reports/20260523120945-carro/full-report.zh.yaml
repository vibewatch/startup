  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 责任方或尽调路径
    rows:
      - - 股权结构表和清算优先权
        - 当前持股、股份类别、清算瀑布、反稀释和参与权
        - 决定名义估值能否转化为普通股价值。
        - 管理层数据室加律师审阅。
      - - Genie 债务和库存融资条款
        - 额度规模、贷款方、契约、到期日和不良贷款修复规则
        - 隐性杠杆可能同时改变利润率质量和退出准备度。
        - 财务团队数据室加贷款方尽调。
      - - IPO 流程与结构
        - 承销商、上市地点、预计流通盘、治理结构和申报状态
        - 没有交易结构，就无法承销退出路径。
        - 银团和法律顾问材料。
      - - EBITDA 桥
        - 从 S$43M FY2025 EBITDA 到 S$130M 目标的分部桥
        - 核心估值争议在未来盈利能力，不只是当前收入。
        - 管理层模型和期中经营数据。
      - - 过往轮次优先权悬顶
        - 2021、2024 和 2025 年投资人在瀑布分配中的顺位
        - SoftBank 和后续战略批次可能吸收比名义价格显示的更多价值。
        - 审阅股东协议。
      - - Carsome 与品类更新
        - 最新同业估值 / 盈利数据和品类情绪
        - 即使 Carro 自身表现不错，区域同业动作也可能重定价 Carro。
        - 跟踪同业披露和后续刷新工作。
    notes: 第一到第四项会卡住高确信买入判断。其余也重要，因为它们可能改变实际回报或相对估值框架。
