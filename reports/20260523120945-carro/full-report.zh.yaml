      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Carro 的市场不是单一路径的零售消费者市场。可见客户图谱覆盖零售家庭、经销商或批发库存买家、使用置换或出售渠道的卖方，以及为交易提供资金或保险的金融交易对手。对现金买家而言，
              用户和付款方大体重合。对贷款购车的零售买家而言，用户是驾驶者，但经济关口是月供可负担性和贷款方审批。经销商或批发客户又是另一套行为逻辑，他们优化的是库存周转和营运资本， 而不是家庭出行。


              采用路径也越来越全渠道。Bain 更广泛的购车研究和 McKinsey 的 Carro 访谈都指向研究、选择、定价甚至结账向线上迁移，而检测、试驾、登记、融资审批和交付仍是关键转化环节。 这对 Carro
              很重要，因为可变现的信任栈会随细分人群变化。二手 EV 买家比内燃机买家更在意电池健康披露和认证，而贷款方和保险方接受度可能与最初购物者意向一样重要。 因此，按买方、用户和付款方拆分，可以同时说明 Carro
              如何取胜，以及为什么泛化的消费者市场视角不够用。
