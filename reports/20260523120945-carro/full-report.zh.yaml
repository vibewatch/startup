        - from: fraud
          to: complaints
          label: 消费者损害和升级
        - from: quality
          to: complaints
          label: 退款和质保索赔
        - from: ops
          to: quality
          label: 检测和结算纪律
        - from: ops
          to: margin
          label: 吞吐和返工拖累
        - from: complaints
          to: margin
          label: 退款和补救成本
        - from: partners
          to: funding
          label: 交易对手依赖
        - from: funding
          to: valuation
          label: IPO 时点和稀释敏感度
        - from: complaints
          to: valuation
          label: 品牌和合规阴影
