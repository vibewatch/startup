        title: 规模、里程碑、IPO 准备度与证据缺口
        blocks:
          - type: paragraph
            body: >-
              Carro 当前公开画像在动能上最强，在 IPO 准备尽调最终需要的材料上最弱。官方 FY2024 披露称 EBITDA 为 S$43 million、EBITDA 利润率为 4%，连续第四年 EBITDA
              为正， 毛利为 S$124 million，非车辆附加业务拉动利润率扩张，金融科技的不良贷款率低于 0.5%。FY2025 披露又把头部指标推高到收入 S$1.2 billion、毛利 S$149
              million、 流动性 S$385 million，并继续在香港和日本扩张。这些都是有意义的信号，说明 Carro 不再只是一个不计成本追增长的故事。但 IPO 叙事仍是有条件的，尚未定局。 围绕
              myTukar 更名的营销型报道使用了“IPO-ready”措辞，Reuters 来源报道则把可能的 2026 年美国 IPO 描述为取决于市场条件；管理层仍提到约 S$130 million 的更高
              EBITDA 目标，且可能还要先完成一轮融资。因此，本章应同时保留两点：Carro 已有可见盈利能力和区域规模，但当前估值、董事会权利和经独立验证的客户广度仍不完整。
