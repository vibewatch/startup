      - number: '4.4'
        title: 牵引指标显示规模；资本充足性仍取决于外部融资
        blocks:
          - type: paragraph
            body: >-
              Carro 当前公开牵引指标足以显示规模，但不足以完成尽调。FY2025 收入达到 S$1.2 billion，毛利达到 S$149 million；关于页面仍宣传在七个市场有超过 4,500 名员工。
              历史里程碑也显示 2021 年 GMV 运行率达到 S$1 billion，但留存 FY2025 公开资料包没有披露当前 GMV、售出车辆数、活跃用户数或利用率。这意味着最新公开牵引是以金额计量，
              而不是按运营指标拆解。


              资本充足性方面，图景混合但可读。Carro 在 FY2025 报告 S$385 million 流动性且 EBITDA 为正，说明近期偿付压力不大。但公司也在 2025 年 9 月融资 US$60
              million， 公开数据提供商对累计融资额意见不一，管理层称 IPO 前希望再完成最后一轮融资，并把 EBITDA 推向约 S$130 million。Reuters 来源报道还补充说，2026 年美国 IPO
              可能在超过 US$3 billion 的估值下寻求最高 US$500 million 募资。结论是，Carro 看起来能支撑当前运营，但仍依赖外部资本来支持扩张、战略灵活性，以及上市前可能需要的营运资本。
