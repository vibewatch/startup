- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for Carro
  - Diligence ask
  rows:
  - - Affordability gap versus new cars
    - Driver
    - Current and structural
    - Keeps price-sensitive households in the used-car funnel and supports inventory turnover
    - Quantify mix of buyers choosing used over new by market and income tier
  - - Digital accessibility and omnichannel shopping
    - Driver
    - Current and structural
    - Supports Carro's platform-led discovery, pricing, and conversion workflow
    - Request funnel data from digital lead to financed purchase by market
  - - Embedded financing and warranties
    - Driver
    - Current but cyclical
    - Improves conversion and monetization when approvals remain healthy
    - Request attach rates, approval rates, and delinquency cohorts by lender and market
  - - Regional macro growth around 4% into 2026
    - Driver
    - Near term 2026
    - Supports underlying mobility demand and cross-market expansion confidence
    - Stress-test category demand against slower trade and income scenarios
  - - Tighter auto loans in Thailand and Indonesia
    - Constraint
    - Current and cyclical
    - Can reduce conversion even when browsing demand is high
    - Request current used-car loan acceptance, down-payment, and pricing rules
  - - Trust deficit in used-car quality and history
    - Constraint
    - Structural
    - Makes inspection, refurbishment, warranty, and transparent pricing central to differentiation
    - Audit claim-rejection, return, and defect data across markets
  - - Used-EV battery-health uncertainty
    - Constraint and future driver
    - Emerging 2026+
    - Could widen Carro's trust moat if certification is credible, but slows adoption if not
    - Map lender and insurer treatment of certified versus uncertified used EVs
  - - Consumer-protection and digital-market regulation
    - Constraint
    - Current and evolving
    - Raises compliance requirements but also favors scaled, auditable platforms over informal dealers
    - Review complaint handling, disclosure, and warranty obligations by jurisdiction
  notes: Direction and timing are qualitative. The table mixes secular drivers with cyclical financing and policy frictions because both govern adoption timing and valuation relevance.
