    whyItMatters: Used-EV trust is likely to matter more over time, but current evidence is too anecdotal to size the opportunity or risk precisely.
    diligencePath: Collect lender policy documents, insurer underwriting rules, and resale-price studies for certified versus uncertified used EVs.
