  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: Three public market-value lenses show why Carro should be valued off a range rather than a single generic Southeast Asia used-car TAM number.
  data:
    items:
    - label: Broad outlier estimate
      value: 205800
      detail: 'Verified Market Research: USD 205.8B in 2024; likely broader transaction-value boundary including adjacent services.'
    - label: Mid-case external estimate
      value: 69730
      detail: 'Mordor Intelligence: USD 69.73B in 2025 with 6.61% CAGR from 2026 to 2031.'
    - label: Conservative formal-channel lens
      value: 36387.5
      detail: 'Credence Research: USD 36.3875B in 2024; narrower organized-channel style framing.'
  approximationNotes: The three layers are not a mathematically nested TAM-SAM-SOM stack; they are the broad, mid, and conservative public sizing lenses that bracket Carro's relevant opportunity.
