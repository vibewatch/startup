- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer / budget owner
  - Workflow
  - Adoption trigger
  rows:
  - - Retail cash buyer
    - Household shopper
    - Primary driver or household
    - Household savings / cash budget
    - Online search -> inspection -> test drive -> payment -> registration
    - Affordability versus buying a new car
  - - Retail financed buyer
    - Household shopper
    - Primary driver or household
    - Borrower plus lender; insurer often attached
    - Online search -> pre-qualification -> inspection -> loan approval -> purchase
    - Monthly payment affordability and financing availability
  - - Dealer / wholesale buyer
    - Dealer principal or inventory manager
    - Dealer sales operation
    - Dealer working-capital budget or lender
    - Inventory sourcing -> appraisal -> wholesale settlement
    - Inventory turn and sourcing efficiency
  - - Seller / trade-in customer
    - Existing vehicle owner
    - Same as seller
    - Seller accepts offer; dealer or platform funds purchase
    - Online valuation -> inspection -> offer acceptance -> offset against next vehicle
    - Convenience and confidence in price discovery
  - - Used-EV buyer
    - Consumer considering pre-owned EV
    - Primary driver
    - Household plus lender / insurer
    - Research -> battery-health review -> inspection -> finance / warranty decision
    - Battery-health trust and warranty comfort
  - - Finance / insurance partner
    - Lender or insurer distributing through platform
    - End customer uses financed or insured vehicle
    - Partner balance sheet / underwriting budget
    - Embedded quote -> approval -> attach at checkout
    - Low-friction digital acquisition with manageable risk
  notes: Segments are defined by who decides, who uses the vehicle, and who actually carries the budget. For Carro, the payer is often not identical to the shopper.
