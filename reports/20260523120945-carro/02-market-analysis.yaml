- id: sizing-lenses-and-contradictions
  title: TAM, SAM, and SOM Proxies — Preserve the Contradictions
  body: 'The retained sources do not support a single canonical Southeast Asia used-car market number. Instead they support a range, and the range is wide for structural reasons. Credence publishes a 2024 market value of about USD 36.4 billion growing to roughly USD 58.0 billion by 2032, while Mordor places the market at USD 69.73 billion in 2025 and USD 74.33 billion in 2026. Verified Market Research is far higher at USD 205.8 billion in 2024. Ken Research also frames the category as late-growth with rising online-platform penetration, but its public teaser withholds a current value figure.


    The right reading is not to average these numbers. The lower pair appear closer to organized-channel or narrower market-value lenses, while the high-end figure likely captures a broader transaction-value or service-included definition. For Carro, that makes precise SAM and SOM math impossible from public sources. The best-supported approach is proxy based: use the broad Southeast Asia used-car value pool as TAM context, narrow SAM to organized, digital, inspected, and financed used-car retail in Carro''s operating markets, and refuse to assign a precise Carro share absent country transaction, take-rate, and attach-rate disclosures. Indonesia and Vietnam matter directionally, but public country data remain too fragmented for a clean bottom-up build.'
