      tone: neutral
    - id: battery
      label: Battery-health certification
      detail: Emerging gate for used EVs; affects valuation and lender comfort
      tone: neutral
    - id: finance
      label: Financing / warranty approval
      detail: Monthly affordability, underwriting, and add-on protection
      tone: neutral
    - id: contract
      label: Checkout and registration
      detail: Digital paperwork meets local compliance and consumer-protection rules
      tone: neutral
    - id: delivery
      label: Delivery and handover
      detail: Physical handover, trade-in settlement, onboarding
      tone: positive
    - id: aftersales
      label: Insurance / servicing / subscription
      detail: Post-sale monetization and retention layer
      tone: positive
    edges:
    - from: discover
      to: inspect
      label: shortlist and validate
    - from: inspect
      to: battery
      label: extra EV trust gate
    - from: inspect
      to: finance
      label: ICE path or post-verification path
    - from: battery
      to: finance
      label: battery report supports underwriting
    - from: finance
      to: contract
      label: approval unlocks conversion
    - from: contract
      to: delivery
      label: complete purchase
    - from: delivery
      to: aftersales
      label: retain and monetize
  approximationNotes: The flow is conceptual rather than time-scaled. It highlights where demand can stall when trust, battery-health, or financing approval fails.
