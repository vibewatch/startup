tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Primary buyer / payer
  - Carro relevance
  rows:
  - - Broad SEA used-car market
    - Consumer used-car transactions across Southeast Asia as sized by analyst reports
    - New-car OEM sales, vehicle manufacturing, ride-hailing, and unrelated fleet services
    - Retail households, dealers, lenders
    - Useful only as outer TAM envelope
  - - Organized digital or certified used-car retail
    - Platform-mediated retail, inspection, refurbishment, warranties, digital lead generation, and attached financing
    - Purely informal cash-lot trades with no standardized trust or financing layer
    - Consumer buyer plus lender or insurer
    - Closest public SAM proxy for Carro
  - - Dealer / wholesale inventory marketplace
    - Dealer-to-dealer sourcing, inventory turnover, and associated working-capital activity
    - Consumer aftersales and retail-only services
    - Dealer principal, wholesale desk, working-capital lender
    - Matches Carro wholesale lane
  - - Financing, insurance, and aftersales attach
    - Auto loans, insurance, servicing, subscriptions, and related services sold with the vehicle
    - Standalone financial products unrelated to vehicle purchase
    - Household borrower, lender, insurer
    - Core monetization layer beyond the listing
  - - Used-EV trust services
    - Battery-health checks, certification, warranties, and used-EV inspection support
    - New-EV OEM incentives and manufacturing subsidies
    - Used-EV buyer, lender, insurer
    - Emerging trust wedge as EV mix rises
  - - New-car OEM sales and manufacturing (adjacent, excluded)
    - Supply context only; shapes inventory and consumer expectations
    - Direct inclusion in used-car TAM or Carro SAM
    - OEM, distributor, dealer network
    - Important context but not Carro's core market
  notes: Boundary logic intentionally separates all used-car turnover from the narrower slice where Carro can monetize trust, financing, and standardized fulfillment.
