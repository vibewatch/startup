company:
  name: Carro
chapter:
  number: 2
  title: Market Analysis
  summary: 'Carro participates in Southeast Asia''s used-car opportunity, but the public record supports a narrower thesis than a generic ''auto commerce'' TAM: the investable market is organized, digital, financed, and trust-mediated used-car retail plus adjacent services. Current market estimates span roughly USD 36.4 billion to USD 69.7 billion for conservative to mid-case lenses, while a USD 205.8 billion outlier appears to use a much broader boundary; that contradiction should be preserved rather than averaged away. Demand drivers are real—affordability, financing, digital discovery, and regional growth—but trust, country-by-country regulation, tighter auto loans, and missing Carro segment data keep SAM and SOM proxy-based rather than precise.'
sections:
- id: market-boundary-and-status-quo
  title: Market Boundary, Included Spend, and Status-Quo Substitutes
  body: 'Carro should be analyzed inside the Southeast Asia used-car retail and ownership-services market, not inside all automotive commerce. Official and independent company sources agree that the business is no longer a pure listing site: it bundles retail, wholesale, financing, insurance, aftersales, and related service layers around used-car transactions. That means the most relevant spend pool is organized and digitally mediated used-car commerce where inspection, pricing, trust, and financing can be monetized. It does not include all new-car OEM revenue, manufacturing, or every informal peer-to-peer or cash-lot transaction that never touches a platform, warranty, or financing rail.


    The status quo Carro competes against is fragmented: informal dealers, direct buyer-seller negotiations, incumbent dealer groups, bank-led financing, and insurers selling separately from the car purchase. Singapore also should not be treated as the default regional template because its COE regime creates a distinct ownership and replacement cycle. The practical conclusion is that Carro''s market boundary is a narrower, more structured slice of used-car spending than the biggest headline TAMs imply, with monetization concentrated where trust and financing solve real frictions.'
