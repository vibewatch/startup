  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market sizing methodology mismatch
    missingEvidence: Full vendor methodology notes that separate transaction value, dealer revenue, financing attach, and other included services in each Southeast Asia used-car market estimate.
    whyItMatters: Without comparable definitions, published TAM estimates can be misused as if they measured the same economic pool.
    diligencePath: Obtain the full paid methodologies for Mordor, Credence, Verified, and Ken Research before using any estimate in valuation work.
    relatedQuestionRefs:
    - QM004
    - QM007
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: carro sam and som disclosure gap
    missingEvidence: Country-level Carro transaction volume, GMV, take rate, financed-share, insurance attach-rate, and gross-margin split between retail, wholesale, and fintech.
    whyItMatters: A precise SAM or SOM for Carro cannot be underwritten without knowing which revenue and transaction layers are material in each market.
    diligencePath: Request management KPI dashboards or audited board materials with country and segment splits for volume, GMV, and monetization.
    relatedQuestionRefs:
    - QM005
    - QM026
    relatedTableRefs:
    - TM002
  - type: access-blocked
    severity: material
    topic: harmonized country used-car data
    missingEvidence: Comparable country-by-country used-car transaction counts and value series for Singapore, Malaysia, Indonesia, and Thailand rather than separate portal fragments or headline teasers.
    whyItMatters: Bottom-up sizing remains fragile when official sources expose different units, years, and download surfaces across markets.
    diligencePath: Build a country data pack from local transport ministries, dealer associations, and finance regulators, then normalize units and time windows before revisiting the SAM.
    relatedQuestionRefs:
    - QM023
    - QM025
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: auto-loan approval and financing conversion
    missingEvidence: Public country-level auto-loan approval, delinquency, and denial-rate data for used vehicles in Carro's core markets.
    whyItMatters: Financing is a major growth driver and constraint, but current public evidence is better on narrative direction than on conversion math.
    diligencePath: Request lender partner scorecards and delinquency cohorts or compile central-bank and finance-association data by market.
    relatedQuestionRefs:
    - QM017
    - QM018
    relatedTableRefs:
    - TM004
