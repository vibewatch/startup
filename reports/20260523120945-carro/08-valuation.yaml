- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - EBITDA stalls near FY2025 base
    - No clear movement above S$43M over the next disclosed period
    - Breaks the profitability-upgrade story investors are being asked to pre-pay for.
    - Move from Track toward Avoid unless price resets hard.
  - - New financing reveals harsh preferences
    - Preference stack or anti-dilution terms materially compress common-equity upside
    - Headline valuation ceases to represent real economic value to late-stage investors.
    - Do not invest without adjusted waterfall underwriting.
  - - US IPO path remains blocked
    - No visible filing progress while 2026 US IPO headwinds persist
    - Exit path becomes longer, riskier, or potentially venue-switched at lower multiples.
    - Re-underwrite to a delayed or non-US exit.
  - - Carsome sets a weaker or faster market reference
    - Closest peer either lists first or signals tougher economics than hoped
    - Regional narrative premium shifts away from Carro or compresses category valuation.
    - Reduce conviction and compare any Carro pricing directly to Carsome outcomes.
  - - Debt or credit stress emerges
    - Genie leverage, NPLs, or funding lines look weaker than expected
    - Ancillary-margin thesis weakens and balance-sheet risk rises.
    - Treat as a potential thesis break, not a minor diligence footnote.
  notes: Triggers are intentionally practical. They are meant to tell an investor when to stop telling themselves a better story and instead change the underwriting.
