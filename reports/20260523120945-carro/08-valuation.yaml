- id: recommendation-confidence-and-entry-discipline
  title: Recommendation, confidence, and entry discipline
  body: >-
    The right call from public evidence is TRACK, not BUY. Carro has enough scale, liquidity, and profitability progress to stay on an active watch list, but not enough valuation transparency to justify conviction capital at rumor pricing. The most useful anchor in the retained set is the September 2025 round that Tracxn records at US$3 billion post-money. That anchor is firmer than the press chatter around >US$3.8 billion, because the latter still sits inside unnamed-source reporting and explicit market-condition caveats.


    Entry discipline should therefore be tied to either price or proof. On price, investors should prefer access materially closer to the last firm round than to the high-end rumor range. On proof, investors should require stronger evidence that EBITDA is moving meaningfully above the FY2025 S$43 million base toward the S$130 million public precondition. Confidence is medium because the operating trend is visible, but cap table, liquidation preferences, debt terms, and final IPO structure remain private. Risk rating is high because those missing terms can change realized returns even if the headline IPO valuation looks acceptable.
