- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Key assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - EBITDA moves materially toward S$130M, ancillary mix stays strong, and the US IPO window is supportive.
    - US$3.8B-$4.5B; upside depends on forward-profitability proof, not trailing comps.
    - Requires much stronger EBITDA conversion and fewer market headwinds than the public record currently proves.
    - Possible but not the central case on current evidence.
  - - Base
    - Carro continues improving, but pricing stays closer to the last firm round than to rumor highs.
    - US$2.8B-$3.3B; modest upside from discounted late-stage entry, limited upside at rumor pricing.
    - Disclosure remains partial and public comps cap enthusiasm.
    - Most supportable on today's evidence.
  - - Bear
    - IPO timing slips, profitability progress disappoints, or the US IPO window remains difficult.
    - US$1.5B-$2.2B; downside resembles a reset toward harder public-comp or private-market reference points.
    - Peer pressure, capital-market weakness, and financing structure opacity all matter.
    - Real downside if investors pay too close to the rumor range.
  notes: Scenario ranges are judgment calls anchored on the retained financial evidence, public-comp multiples, and the last firm private round rather than on a full DCF or underwriter model.
