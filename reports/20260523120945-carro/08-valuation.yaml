- id: financing-context-and-comparable-set
  title: Financing context, dilution caveats, and comparable set
  body: >-
    Carro's financing context is constructive but still incomplete. Tracxn, CB Insights, and company materials all point to a heavily capitalized business, but they do not agree on the lifetime total: public tallies range from more than US$600 million to just over US$800 million. Tracxn's round history, together with TechCrunch and The Asset on the 2021 Series C, confirms a meaningful preference stack led by SoftBank Vision Fund 2 and followed by later strategic capital. Cool Japan Fund and Woori add fresh tranches in 2024-2025, but their terms are not public. That means dilution and preference overhang cannot be modeled precisely from public sources alone.


    The comparable set should therefore do two jobs. First, public trading comps show the multiple envelope that markets already accept for disclosed automotive platforms: CarMax at the low end, AUTO1 as the structurally closest public analog, and Carvana as the higher-multiple digital retail benchmark. Second, Carsome and OLX frame the regional and strategic context. Carsome is the closest private peer, but its layoffs underline how hard profitability has been. OLX shows what high-margin classifieds economics can look like, while the La Centrale deal shows that profitable motors assets still attract strategic buyers.
