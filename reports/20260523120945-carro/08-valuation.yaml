  rows:
  - - Carro
    - Latest firm private anchor
    - Sep 2025 round at US$3B post-money (Tracxn); rumor range >US$3B to >US$3.8B
    - Defines the price investors must underwrite today.
    - Cap table, preference stack, and exact IPO terms remain private.
  - - Carvana
    - Public trading multiple
    - 2.29x EV/Revenue; 26.17x EV/EBITDA; ~US$48.91B market cap
    - Best higher-multiple digital used-car benchmark in the retained set.
    - US market leader with different scale, balance sheet, and restructuring history.
  - - CarMax
    - Public trading multiple
    - 0.23x price/sales; 0.93x EV/Revenue; ~US$5.72B market cap
    - Shows what mature hybrid retail economics can look like in public markets.
    - Mature US incumbent with very different growth and asset profile.
  - - AUTO1
    - Public trading multiple + filing-backed comp
    - 0.70x EV/Revenue; 30.58x EV/EBITDA; IR page provides annual reports
    - Closest structurally relevant listed automotive platform in the retained set.
    - European mix and revenue scale differ materially from Carro.
  - - Carsome
    - Closest regional private peer
    - '>US$600M raised; >US$1B valuation mark in regional coverage; layoffs used to reach profit'
    - Best regional read-across for full-stack ASEAN used-car execution and IPO ambition.
    - No fresh public valuation or audited public P&L in the retained set.
  - - OLX / La Centrale
    - Profitable motors/classifieds anchor
    - OLX FY2025 revenue US$777M with 35% aEBIT margin; La Centrale acquired for EUR1.1B
    - Shows strategic value of profitable motors assets and what lighter-asset economics can command.
    - Classifieds model is structurally lighter and higher margin than Carro's full-stack model.
