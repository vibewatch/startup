- id: exit-readiness-and-thesis-break-triggers
  title: Exit readiness and thesis-break triggers
  body: >-
    Exit readiness is improving, but it is not yet fully public. The retained evidence shows real ingredients of a listing candidate: revenue scale, positive EBITDA, liquidity, and fresh capital in 2025. What it does not show is a filed prospectus, disclosed underwriters, confirmed venue, or final governance structure. That gap matters because late-stage investors are not underwriting only company quality; they are underwriting whether the exit instrument itself is visible and investable.


    Thesis-break triggers should therefore focus on events that directly damage the path from private mark to public liquidity. First, failure to keep EBITDA moving upward from the FY2025 base would undercut the entire margin-expansion narrative. Second, any evidence that financing terms or debt structures are harsher than expected would change realized equity value even if the headline price holds. Third, a harder-than-expected peer or market backdrop — including Carsome setting a weaker public reference or the US IPO window staying hostile — can break the thesis without any single-quarter revenue miss. Investors should treat those triggers as kill criteria, not as reasons to hope the next disclosure will fix the problem.
  claimRefs:
