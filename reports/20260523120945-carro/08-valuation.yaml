company:
  name: Carro
chapter:
  number: 8
  title: Valuation
  summary: >-
    Carro's valuation case is real but still incomplete. The retained evidence confirms FY2025 revenue of S$1.2 billion, positive EBITDA of S$43 million, strong ancillary mix, and a September 2025 financing anchor at US$3 billion post-money. Those facts justify continued investor attention. They do not, by themselves, justify paying the high end of rumor pricing. Public trading comps such as CarMax, AUTO1, and Carvana show a disclosed multiple envelope that sits below what a >US$3.8 billion IPO rumor would imply against Carro's public sales base, while Business Times shows management still targeting S$130 million EBITDA before listing. Recommendation is TRACK with medium confidence, high risk, and a valuation stance of fair-to-stretched around the last firm round and stretched at the rumor high until cap table, debt terms, and IPO structure are disclosed.
sections:
- id: investment-thesis-and-anti-thesis
  title: Investment thesis and anti-thesis
  body: >-
    Carro's positive case is real, but it is not price-insensitive. The strongest evidence in the retained set is the company's FY2024-FY2025 financial progression: revenue reached S$1.2 billion, gross profit reached S$149 million, liquidity stood at S$385 million, and EBITDA remained positive at S$43 million. Ancillaries are central to that case. Carro said ancillaries were nearly 60% of FY2024 gross profit and more than 55% of FY2025 gross profit, which means the company is not relying only on used-car transaction volume to expand margins. Strategic investors such as Cool Japan Fund and Woori also show Carro can still attract partner capital ahead of a proposed listing.


    The anti-thesis is equally grounded in the public record. Reuters-framed reporting supports a valuation above US$3 billion, while other outlets floated a >US$3.8 billion rumor range, yet none of those headlines is a substitute for disclosed IPO terms. Business Times said Aaron Tan wants S$130 million EBITDA before IPO, leaving an S$87 million gap from the FY2025 base. Public comps such as CarMax, AUTO1, and Carvana trade on much lower disclosed revenue multiples than the high-end rumor range would imply against Carro's public sales base. The investment question is therefore not whether Carro is a serious company; it is whether investors should pre-pay for margin and disclosure improvements that the public record has not yet fully proved.
