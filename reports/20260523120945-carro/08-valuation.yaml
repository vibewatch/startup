  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cap table
    missingEvidence: Current cap table, share classes, liquidation preferences, anti-dilution provisions, and participation rights for each major investor tranche.
    whyItMatters: Without the waterfall, investors cannot convert a headline valuation into common-equity economics or test whether late-stage upside survives the preference stack.
    diligencePath: Request the shareholder register and governing agreements in the pre-IPO data room and have counsel model the distribution waterfall.
    relatedQuestionRefs:
    - QV009
    - QV025
    - QV026
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: floorplan debt
    missingEvidence: Genie Financial Services facility sizes, lenders, maturities, covenants, drawn balances, and cure mechanics.
    whyItMatters: Hidden leverage can make EBITDA less durable than it appears and can materially change IPO balance-sheet quality.
    diligencePath: Request debt schedules and lender agreements in diligence; reconcile them against audited balance-sheet notes.
    relatedQuestionRefs:
    - QV010
    - QV025
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: IPO process
    missingEvidence: Confirmed underwriters, venue, expected float, governance structure, filing milestone, and current timetable for any US listing.
    whyItMatters: The valuation case depends on an exit path. Without transaction-structure evidence, investors are underwriting only a headline aspiration.
    diligencePath: Request banker materials or legal process updates in the data room; watch for future filing signals in a refresh run.
    relatedQuestionRefs:
    - QV026
    - QV023
    relatedTableRefs:
    - TV005
    - TV006
  - type: stale
    severity: material
    topic: EBITDA bridge
    missingEvidence: An updated bridge from FY2025 EBITDA to management's S$130 million pre-IPO target, with segment-level drivers.
    whyItMatters: The main underwriting gap is future profitability. Without a bridge, rumor pricing is asking investors to pay for an outcome rather than a documented path.
    diligencePath: Request interim management accounts or a board-approved operating plan in the pre-IPO data room.
    relatedQuestionRefs:
    - QV003
    - QV018
    - QV019
    - QV027
    relatedTableRefs:
    - TV003
    - TV006
