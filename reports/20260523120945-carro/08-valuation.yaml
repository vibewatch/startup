- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Pillar
  - Support
  - Anti-thesis
  - What would change the view
  rows:
  - - Scale and proof
    - FY2025 revenue reached S$1.2B with positive EBITDA and liquidity.
    - Scale alone does not justify IPO pricing if disclosure stays thin.
    - Publish stronger interim EBITDA proof and final IPO terms.
  - - Margin engine
    - Ancillaries were the majority of gross profit in FY2024 and FY2025.
    - Ancillary mix can still prove cyclical or leverage-dependent rather than durable.
    - Show segment EBITDA and credit-quality disclosure for Genie and aftersales.
  - - Capital access
    - Carro still attracted 2024-2025 strategic capital from Woori and Cool Japan Fund.
    - Preference overhang and another round can dilute late-stage upside.
    - Open the cap table, waterfall, and new-money terms in the data room.
  - - Comparable support
    - Carvana, AUTO1, Carsome, and OLX show investors still value automotive platforms and motors assets.
    - Public trading comps sit well below high-end rumor pricing on disclosed revenue metrics.
    - Deliver EBITDA growth that narrows the gap to public comp economics.
  - - Exit path
    - US IPO talk is persistent across multiple sources.
    - No public filing, no underwriters, and a harder 2026 US IPO window keep execution risk high.
    - Confirm bankers, venue, draft filing progress, and expected float.
  notes: The thesis and anti-thesis are built directly from retained evidence, not from generic startup optimism or broad market storytelling.
