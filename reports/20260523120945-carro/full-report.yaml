chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and operating model
        blocks:
          - type: paragraph
            body: >-
              Carro's reusable ground truth for the rest of the report is clearer on identity and product scope than on
              governance. Official and independent sources align that the company was founded in 2015 in Singapore by
              Aaron Tan, Aditya Lesmana, and Kelvin Chng. The company is not just a classifieds site: official materials
              describe a full-stack automotive ecosystem spanning retail, insurance, aftersales, and financing, while
              TechCrunch's 2021 funding coverage split the model into wholesale, retail, and fintech. The LEAP product
              page adds a concrete subscription example, showing that Carro manages leasing, servicing, insurance, and
              app-based support rather than only transaction matching. Carro's about page now claims presence in
              Singapore, Malaysia, Indonesia, Thailand, Japan, Taiwan, and Hong Kong, and Forbes independently tied that
              seven-market footprint to the Beyond Cars acquisition in Hong Kong. Later chapters should therefore treat
              Carro as a regional automotive platform with multiple monetization layers, not as a narrow Singapore
              used-car marketplace.
