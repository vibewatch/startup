      - number: '7.3'
        title: Operational Trust Controls Are Mission-Critical Because They Sit Behind The Brand Promise
        blocks:
          - type: paragraph
            body: >-
              Operational risk in Carro is inseparable from trust risk. HSBC frames the used-car market as a lemon
              problem and describes Carro's answer as technology, inspection, pricing algorithms, financing, and
              refunds. Third-party marketplace surfaces make that tangible: oto.my listings market 160-point
              inspections, a five-day money-back guarantee, and 12-month drivetrain warranties in Malaysia, while Carro
              Indonesia's FAQ emphasizes certification proof, warranty claims, reservations, test drives, and payment
              flows. Those are credible visible mitigations, but they also raise the cost of failure. If certification
              or settlement discipline slips, the downside is not just one unhappy buyer; it can become refund leakage,
              complaint escalation, and brand damage across multiple jurisdictions.


              The anecdotal complaint and review sources underline that point. Trustindex shows that transactions can
              close quickly and positively, but HardwareZone reports still describe seller friction around lowball
              expectations, handover timing, and loan-settlement fees. Malaysia's 11 retail centres, 27 inspection
              centres, five workshops, and two refurbishment centres show that Carro's public operating model is
              physically complex, not a light software layer. Looking ahead, used-EV growth adds another trust frontier
              because battery-health certification increasingly affects valuation and financing. Add cyber and AI risk
              on top, and operational trust becomes one of the central residual exposures for the thesis.
