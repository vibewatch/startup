              The adoption story is therefore real but indirect. Public evidence shows a full-stack customer proposition
              spread across markets and channels, a meaningful physical footprint in Malaysia, and a product surface
              that includes retail, financing, insurance, aftersales, and subscription. Financial disclosures add one
