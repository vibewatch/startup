      - number: '8.6'
        title: Final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The remaining work is not generic diligence; it is valuation-critical diligence. The first blocking item
              is the current cap table with share classes, liquidation preferences, anti-dilution terms, and any
              participating preference features. Without that, investors cannot convert headline valuation into
              common-equity economics. The second blocking item is Genie Financial Services leverage disclosure,
              including debt, floorplan, or warehouse lines and the covenants around them. Those terms determine how
              much of Carro's EBITDA is truly durable versus balance-sheet dependent.


              The next priority is IPO-process evidence. Investors need to know whether Carro has chosen banks, how
              large the expected float is, what venue remains primary, and whether the company is pursuing a
              confidential path or simply has not progressed that far. Finally, management should provide an EBITDA
              bridge from the S$43 million FY2025 base to the S$130 million public aspiration. Without that bridge, an
              investor is essentially buying a story about future profitability rather than a documented path to it.
              Those are exactly the diligence asks that should block any buy call today.
