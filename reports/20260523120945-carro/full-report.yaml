  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Mix Quality, and Recognition Boundaries
        blocks:
          - type: paragraph
            body: >-
              Carro's public financial story is credible on topline and gross-profit growth, but not on audited segment
              mix. The strongest evidence comes from company-distributed FY2024 and FY2025 releases, which show FY2025
              revenue of S$1.2 billion, gross profit of S$149 million, gross margin of 12.4%, liquidity of S$385
              million, and audited EBITDA of S$43 million. Those releases also say ancillaries contributed more than 55%
              of gross profit in FY2025 and nearly 60% in FY2024. That mix point matters more than the absolute revenue
              figure because it shows the public margin story is being driven by service attachment rather than vehicle
              turnover alone.


              The retained pack also supports a broader revenue architecture than a simple used-car marketplace.
              TechCrunch described Carro's operating stack as wholesale, retail, and fintech, with fintech including B2C
              loans, auto insurance, and B2B working-capital loans. Carro's about page adds retail, insurance,
              aftersales, and financing, while The Asset highlighted subscription and usage-based insurance products.
              What remains missing is the actual audited split among those lanes. Investors therefore can underwrite the
              existence of multiple monetization paths, but not the precise stream-by-stream economics or recognition
              profile.
