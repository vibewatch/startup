      - number: '3.3'
        title: Capability Breadth Is Differentiated, But Public Pricing And Compliance Detail Are Thin
        blocks:
          - type: paragraph
            body: >-
              On capability, Carro's public edge is still the breadth of the workflow it claims to own. TechCrunch and
              Carro's own site both point to wholesale, retail, and fintech or adjacent service layers, which is broader
              than a pure traffic network. Even so, the public record also shows that much of the visible trust stack is
              no longer unique. Competitor pages across Malaysia, Thailand, Indonesia, and Singapore now advertise
              inspection, warranties, financing calculators, instant-sale handling, or certified-partner cues. That
              means investors should be cautious about treating discovery-layer convenience or generic trust language as
              durable differentiation. The more durable question is whether Carro monetizes those services more
              effectively and with better unit economics than peers.


              Pricing is the weakest public comparison dimension. The retained surfaces show consumer vehicle prices,
              financing offers, dealer packages, and instant-sale promises, but they do not expose a harmonized regional
              take-rate card or contract schedule. Regulatory posture is also mostly indirect. Competitors disclose
              trust proxies such as inspections, warranties, certified partners, and emerging EV battery-certification
              narratives, but not a clean cross-market map of licenses, complaint metrics, or underwriting controls. The
              right analytical move is to preserve those gaps explicitly rather than fabricate exact prices or
              compliance leadership rankings from marketing pages.
            claimRefs:
              - CP021
              - CP022
              - CP023
              - CP024
              - CP025
              - CP036
