  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Set Is Broader Than A Unicorn-Versus-Unicorn Frame
        blocks:
          - type: paragraph
            body: >-
              The retained source pack does not support a narrow view that Carro only competes with Carsome. Third-party
              market mapping and official competitor pages show at least five materially different solution classes.
              First are full-stack used-car operators that combine transaction flow with inspection, financing, and
              aftersales. Second are scaled classifieds and dealer-advertising networks such as OLXmobbi, iCarAsia or
              Carlist, One2car, Mobil123, sgCarMart, and Mudah. Third are ownership-service adjacencies such as Motorist
              that can intercept sellers and buyers through valuation, financing, servicing, and partner routing. Fourth
              are OEM-certified pre-owned programs listed by Mordor that sell trust through brand assurance. Fifth are
              status-quo alternatives such as offline dealers, direct buyer-seller negotiation, and internal sourcing
              desks run by dealer groups.


              That breadth matters because each class attacks a different part of Carro's value chain. The listing-led
              players own traffic and dealer relationships. Full-stack peers chase the same trust and monetization wedge
              as Carro. Adjacent ownership apps can acquire users without taking inventory risk. OEM-certified programs
              compete hardest on assurance, not convenience. And offline channels remain relevant because even digital
              platforms still rely on inspections, physical handoff, and finance approval. The correct frame is
              therefore a layered competitive landscape in which traffic, trust, financing, and operational execution
              are all contestable.
            claimRefs:
              - CP001
              - CP003
              - CP011
              - CP014
              - CP016
              - CP028
              - CP034
              - CP035
