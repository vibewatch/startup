            body: >-
              Carro's current public traction markers are strong enough to show scale but not enough to complete
              underwriting. FY2025 revenue reached S$1.2 billion and gross profit S$149 million, while the about page
              still advertises more than 4,500 staff across seven markets. Historical milestones also show an S$1
              billion GMV run-rate in 2021, but the retained FY2025 public pack does not disclose current GMV, units
              sold, active-user counts, or utilization. That means the latest public traction is dollar-denominated
              rather than operationally decomposed.


              On capital adequacy, the picture is mixed but readable. Carro reported S$385 million of liquidity in
              FY2025 and positive EBITDA, which argues against near-term solvency stress. But the company also raised
              US$60 million in September 2025, public data providers disagree on lifetime capital raised, and management
              said it wants one final funding round before IPO while pushing EBITDA toward about S$130 million.
              Reuters-sourced coverage added that a 2026 U.S. IPO could target up to US$500 million of proceeds at a
              valuation above US$3 billion. The conclusion is that Carro appears financed for current operations, but
              still dependent on external capital for expansion, strategic flexibility, and possibly working-capital
