            body: >-
              Carro's current momentum does not eliminate external dependency; it changes its shape. HSBC says its ASEAN
              Growth Fund is supporting Carro's international expansion. Woori's investment was presented not merely as
              capital but as a closer partnership supporting Southeast Asian expansion, including Indonesia. SY Holdings
              is supposed to bring cross-border financing solutions, predictive analytics, and API-based integration.
              Those relationships can help Carro scale, but they also mean funding velocity, credit product reach, and
              some operating efficiency gains depend on counterparties and integrations the company does not fully own.


              The capital-markets side is even more explicit. Reuters-sourced and Business Times reporting says Carro
              still wants one more fundraising step before IPO, is targeting a much higher EBITDA run-rate first, and
              could seek a U.S. listing whose timing and size remain subject to market conditions. That combination
              makes capital access a residual risk rather than a solved outcome. In practical terms, investors are not
              only underwriting used-car demand or operating margin; they are underwriting partner continuity,
