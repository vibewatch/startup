  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Residual Risk Stack Is High Even Without A Public Enforcement File
        blocks:
          - type: paragraph
            body: >-
              Carro's retained risk pack points to a business whose core downside is now more about transmission than
              about a single existential flaw. The public materials do not surface a Carro-specific enforcement action
              or litigation file, but that absence should not be read as proof of low risk. Instead, the pack shows a
              company operating across several consumer-protection regimes, still discussing one more fundraising step
              before IPO, and relying on trust promises such as refunds, warranties, certification, and fair quotation
              workflows. Those are features customers value, but they also become pathways through which operational
              errors can become complaint, legal, or financing events.


              The severity ranking is therefore led by capital access, then consumer and fraud compliance, then
              operational trust execution. Capital access ranks first because both Business Times and Reuters-sourced
              reporting describe another funding step and market-sensitive IPO timing as live dependencies rather than
              optional upside. Consumer and fraud compliance ranks next because Singapore already has
              complaint-to-injunction pathways and Thailand is tightening platform obligations while reporting large
              online-fraud losses. Operational execution ranks third because Carro's public promise set is broad, but
              the pack still lacks by-market complaint, fraud-loss, and warranty-rate disclosure. The two figures in
              this section summarize that hierarchy and show how localized failures can spread into revenue, margin, and
              valuation.
            claimRefs:
              - CR003
