      - number: '7.2'
        title: Legal And Regulatory Exposure Is Regime-Driven Even Without Named Carro Cases
        blocks:
          - type: paragraph
            body: >-
              The legal story is stronger on regime clarity than on company-specific disclosure. Singapore's CPFTA
              explicitly covers unfair practices and non-conforming goods, while CCS explains that persistent offenders
              can move from complaint handling through CASE or STB into investigation and court injunctions. Thailand
              adds a second layer of relevance because its consumer-protection framework covers deceptive advertising,
              unfair contracts, and unsafe services, and newer anti-fraud measures broaden the compliance burden on
              digital platforms, banks, and telecom firms. ASEAN and UNCTAD materials add the regional point:
              digital-market consumer protection is becoming more coordinated and more salient, not less.


              That matters for Carro because the company publicly says it operates in Singapore, Malaysia, Indonesia,
              and Thailand alongside other Asian markets. A used-car marketplace that also markets certification,
              financing, refunds, and warranties cannot treat consumer protection as a narrow legal footnote. At the
              same time, the retained pack does not surface a Carro-specific lawsuit, injunction, or regulator action.
              The right interpretation is caution, not exoneration. Investors should treat the absence of a public
              enforcement file as a disclosure gap until diligence produces legal-contingency schedules, complaint logs,
              and regulator correspondence by market. The legal register below therefore ranks regime exposure by
              severity while keeping Carro-specific enforcement framed as an absence in the retained pack rather than an
              invented fact.
