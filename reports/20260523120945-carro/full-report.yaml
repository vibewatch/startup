  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Carro should be analyzed inside the Southeast Asia used-car retail and ownership-services market, not
              inside all automotive commerce. Official and independent company sources agree that the business is no
              longer a pure listing site: it bundles retail, wholesale, financing, insurance, aftersales, and related
              service layers around used-car transactions. That means the most relevant spend pool is organized and
              digitally mediated used-car commerce where inspection, pricing, trust, and financing can be monetized. It
              does not include all new-car OEM revenue, manufacturing, or every informal peer-to-peer or cash-lot
              transaction that never touches a platform, warranty, or financing rail.


              The status quo Carro competes against is fragmented: informal dealers, direct buyer-seller negotiations,
              incumbent dealer groups, bank-led financing, and insurers selling separately from the car purchase.
              Singapore also should not be treated as the default regional template because its COE regime creates a
              distinct ownership and replacement cycle. The practical conclusion is that Carro's market boundary is a
              narrower, more structured slice of used-car spending than the biggest headline TAMs imply, with
              monetization concentrated where trust and financing solve real frictions.
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM009
              - CM017
              - CM020
              - CM026
