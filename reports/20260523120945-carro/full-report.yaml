      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Carro's market is not a single retail-consumer lane. The visible customer map spans retail households,
              dealer or wholesale inventory buyers, sellers using trade-in or sale channels, and the financial
              counterparties that fund or insure transactions. For a cash buyer, the user and payer largely align. For a
              financed retail buyer, the user is the driver but the economic gate is monthly affordability and lender
              approval. Dealer or wholesale customers behave differently again, optimizing inventory turn and working
              capital rather than household mobility.


              The adoption path is also increasingly omnichannel. Bain's broader car-buying work and McKinsey's Carro
              interview both point toward research, selection, pricing, and even checkout moving online, while
              inspection, test drive, registration, financing approval, and delivery remain critical conversion stages.
              This matters for Carro because the monetizable trust stack changes by segment. A used-EV buyer cares more
              about battery-health disclosure and certification than an internal-combustion buyer does, while lender and
              insurer acceptance can be as important as the initial shopper's intent. Segmenting by buyer, user, and
              payer therefore clarifies both how Carro wins and why a generic consumer-market lens is insufficient.
            claimRefs:
