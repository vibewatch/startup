              The comparable set should therefore do two jobs. First, public trading comps show the multiple envelope
              that markets already accept for disclosed automotive platforms: CarMax at the low end, AUTO1 as the
              structurally closest public analog, and Carvana as the higher-multiple digital retail benchmark. Second,
              Carsome and OLX frame the regional and strategic context. Carsome is the closest private peer, but its
              layoffs underline how hard profitability has been. OLX shows what high-margin classifieds economics can
