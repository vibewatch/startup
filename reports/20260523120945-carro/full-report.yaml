      - number: '4.3'
        title: Margin Drivers Are Public; Cost Structure and Capital Intensity Are Mostly Not
        blocks:
          - type: paragraph
            body: >-
              The public margin picture is directionally positive but still shallow. Carro's FY2025 gross margin
              improved to 12.4% from 11.8% in FY2024, while FY2024 gross margin had already improved to 12% from 8% in
              FY2023. In both years, management attributed expansion to marketplace-margin improvement, ancillary-income
              growth, and productivity optimisation. The most important cost or quality datapoint in the retained pack
              is that Carro's fintech arm, Genie Financial Services, reportedly kept non-performing loans below 0.5% in
              FY2024. That suggests underwriting discipline matters directly to gross-profit durability when financing
              is part of the stack.


              Even so, core cost structure and capital intensity remain under-disclosed. Because Carro spans retail
              inventory, dealer or wholesale liquidity, B2C auto loans, insurance, and aftersales, working-capital and
              credit exposure are structurally relevant. Yet the retained public sources do not disclose inventory
              turns, refurbishment capex, warehouse or floorplan facilities, receivables aging, or cash-conversion-cycle
              data. The right reading is not that these costs are absent; it is that they are hidden behind aggregate
              revenue, gross-profit, and liquidity figures. Public evidence supports the direction of margin
              improvement, but not the mechanics needed for a full unit-economics model.
