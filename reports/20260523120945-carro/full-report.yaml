      - number: '4.2'
        title: Pricing Evidence Is Thin, So GTM Must Be Underwritten Through Proxies
        blocks:
          - type: paragraph
            body: >-
              Pricing is the weakest public financial surface in this chapter. The retained sources confirm that Carro
              monetizes multiple lanes — vehicle transactions, financing, insurance, aftersales, subscription, and
              dealer-oriented financial services — but they do not disclose a current price card, take-rate schedule,
              financing APR grid, insurance commission schedule, or realized discount ladder. That absence should be
              preserved explicitly. A public consumer vehicle listing or financing calculator would not solve the
              underwriting question anyway, because list pricing is not the same thing as realized monetization after
              dealer incentives, mix, subsidies, and attachment behavior.


              The best GTM proxies are therefore strategic rather than ratio-based. The 2025 Cool Japan Fund raise was
              framed around accelerating demand for Japanese cars across Asia Pacific, and The Business Times added that
              more partnerships with Japanese automobile brands are coming. The earlier Woori transaction was also
              described as a closer partnership supporting expansion, including Indonesia. Together those sources imply
              that Carro's GTM motion still depends on supply-side partnerships, dealer liquidity, and operational
              distribution, not on a disclosed self-serve SaaS funnel. CAC, payback, and sales-cycle metrics are absent
              from the retained public pack, so any efficiency conclusion has to stay proxy-based.
