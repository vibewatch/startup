            body: >-
              Carro's financing context is constructive but still incomplete. Tracxn, CB Insights, and company materials
              all point to a heavily capitalized business, but they do not agree on the lifetime total: public tallies
              range from more than US$600 million to just over US$800 million. Tracxn's round history, together with
