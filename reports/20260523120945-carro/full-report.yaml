      - number: '6.5'
        title: Expansion Logic Is Clear, but Concentration and Procurement Risk Remain Under-Disclosed
        blocks:
          - type: paragraph
            body: >-
              Carro’s expansion logic is publicly understandable. Customers can begin with buying or selling a car and
              then attach financing, insurance, aftersales support, certified refurbishment, or monthly subscription.
              Malaysia’s brand integration suggests Carro expands by standardizing acquired local businesses into the
              same full-stack customer surface rather than by launching entirely separate propositions market by market.
              Japan and Hong Kong expansion push the same idea across geography. The monetization mix supports that
              reading because ancillary services already account for more than half of gross profit.


              What is not public is concentration. No retained source discloses top customers, top fleets, top dealers,
              or country-level revenue concentration. The customer story therefore looks broad in surface area but
              opaque in economic dependence. That matters particularly for dealer exposure, because dealers are
              mentioned yet not counted, and for finance users, because a single headline NPL ratio does not describe
              which cohorts carry the risk.


              Procurement friction also has not disappeared. Forum evidence shows seller-side handover, inspection, and
              loan-settlement work still create operational steps and potential dissatisfaction. For buyers, Carro’s
              trust stack is reasonably visible — inspection, warranty, refund, certified surfaces, reservation logic —
              but those controls must keep working consistently as the company expands into more markets and eventually
              deeper used-EV workflows.
