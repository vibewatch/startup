        title: Scale, milestones, IPO readiness, and evidence gaps
        blocks:
          - type: paragraph
            body: >-
              Carro's current public profile is strongest on momentum and weakest on what an IPO-ready diligence package
              would need for final underwriting. Official FY2024 disclosure reported S$43 million of EBITDA, a 4% EBITDA
              margin, a fourth consecutive year of positive EBITDA, S$124 million of gross profit, and ancillary-heavy
              margin expansion with non-performing loans below 0.5% in fintech. FY2025 disclosure then pushed the
              headline further to S$1.2 billion of revenue, S$149 million of gross profit, S$385 million of liquidity,
              and continued expansion in Hong Kong and Japan. Those are meaningful signals that Carro is no longer a
              pure growth-at-all-costs story. But the IPO narrative remains conditional, not settled. Marketing-focused
              coverage used "IPO-ready" language around the myTukar rebrand, whereas Reuters-sourced reporting framed a
              possible 2026 U.S. IPO as dependent on market conditions and management still described a much higher
              EBITDA target of about S$130 million, potentially after another fundraising step. The chapter should
              therefore carry both ideas at once: Carro has visible profitability and regional scale, yet current
              valuation, board rights, and independently verified customer breadth remain incomplete.
