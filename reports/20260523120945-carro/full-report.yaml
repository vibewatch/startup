      - number: '6.4'
        title: Retention and Durability Are Still Evidence Gaps
        blocks:
          - type: paragraph
            body: >-
              The core durability problem is simple: Carro’s retained public sources do not disclose NRR, GRR, churn,
              repeat purchase, repeat selling, or subscription renewal. The company clearly advertises trust mechanisms
              such as refunds, warranties, inspection standards, app-based servicing support, and conservative lending
              metrics, but those are inputs to retention rather than retention evidence itself. A buyer can be comforted
              by a five-day refund promise or a 12-month warranty without that translating into high repeat usage or
              durable cohort economics.


              Public finance evidence sharpens that distinction. FY2024 disclosures say Genie Financial Services kept
              non-performing loans below 0.5%, which suggests some underwriting discipline on the finance side. Yet the
              retained sources do not disclose finance take rates, approval rates, repeat borrowing, or segment-level
              delinquencies. The same gap appears in subscription: Carro discloses minimum terms and swap-or-return
              logic, but not renewal or conversion behavior.


              Independent reputation triangulation is also thin. The direct review evidence is small and mostly
              favorable, while one broader reputation fetch returned only bot protection. That does not prove
              dissatisfied customers are hiding there, but it does mean the public review surface is too narrow to clear
              diligence. The next trust frontier may also be EV-specific: an independent regional article argues
              battery-health certification is becoming essential for used-car buyers and lenders, yet Carro’s retained
              customer pages do not visibly expose a matching EV battery-proof surface.
