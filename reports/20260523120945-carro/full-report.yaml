      - number: '1.2'
        title: Founders, leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The retained pack makes Aaron Tan legible as the controlling public face of Carro, but it is materially
              weaker on the broader control map. Company disclosures and profile sources consistently identify Tan as
              co-founder and chief executive, while FY2025 company materials also surface Ernest Chew as CFO.
              Independent profiles from CNA and Vulcan Post give Tan more background than they do the other co-founders,
              describing Carnegie Mellon, BLOCK71, venture-investing experience, and an early entrepreneurial track
              record. That asymmetry matters for diligence: Aaron Tan is easy to underwrite as a key-person dependency,
              but the retained public pack does not expose a full current board roster, voting control, or
              investor-rights structure. PitchBook and CB Insights confirm many investors and multiple later-stage
              financings, yet they still do not substitute for an actual board list or shareholder-rights package. The
              right conclusion is not to invent a hidden governance picture, but to preserve that governance visibility
              remains materially incomplete despite strong founder-led branding and visible finance leadership.
