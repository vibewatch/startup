        title: Capital history and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Carro's capital history shows a business that has steadily broadened its funding base beyond pure venture
              capital. The 2021 Series C raised US$360 million and established unicorn status, with SoftBank Vision Fund
              2 the headline lead and investors such as MSIG and EV Growth also named in coverage. After that step-up,
              Carro added strategic capital and operating partners rather than relying only on another conventional VC
              round. Jardine Cycle & Carriage entered a cross-holding partnership tied to Republic Auto in 2023; Woori
              Venture Partners backed Carro in late 2024 while management highlighted Southeast Asian expansion; Cool
              Japan Fund led a US$60 million strategic investment in 2025; and SY Holdings signed a financing-oriented
              partnership tied to cross-border funding and new-car propositions. Market-data providers disagree on the
              exact cumulative capital raised, with company copy still saying over US$600 million while Tracxn and CB
              Insights point toward a later tally closer to US$686 million to US$800 million. That range is good enough
              for a company-overview snapshot, but not precise enough to substitute for the current cap table.
