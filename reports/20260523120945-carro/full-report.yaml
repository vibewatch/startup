        - Finance team data room plus lender diligence.
      - - IPO process and structure
        - Underwriters, venue, expected float, governance structure, and filing status
        - Exit path cannot be underwritten without transaction structure.
        - Banking syndicate and legal counsel materials.
      - - EBITDA bridge
        - Segment-by-segment bridge from S$43M FY2025 EBITDA toward S$130M target
        - The main valuation debate is about future profitability, not current revenue alone.
        - Management model and interim operating data.
      - - Preference overhang from past rounds
        - How 2021, 2024, and 2025 investors rank in the waterfall
        - SoftBank and later strategic tranches may absorb more value than the headline price suggests.
        - Shareholder agreement review.
      - - Carsome and category updates
        - Fresh peer valuation/profitability data and category sentiment
        - Regional peer moves can re-price Carro even if Carro itself performs.
        - Monitor peer reporting and future refresh work.
    notes: >-
      Items one through four are blocking for a conviction buy call. The rest are material because they can change
      either realized return or the relative valuation frame.
    claimRefs:
      - CV024
      - CV038
      - CV039
      - CV040
      - CV045
      - CV055
      - CV057
      - CV058
      - CV059
      - CV060
