            body: >-
              Carro’s public customer surface is visibly broader than a simple used-car listing site. The official about
              page says the company operates retail, insurance, aftersales, and financing across seven markets, while
              independent profile coverage adds that consumers and dealers can buy and sell vehicles on the platform and
              that users can also rent or lease cars. In other words, the public evidence supports at least seven
              practical customer lanes: retail buyers, private sellers, dealers or wholesale counterparties, finance
              users, insurance and aftersales users, leasing or subscription users, and country-specific users across
              Singapore, Malaysia, Indonesia, Japan, and other operating markets.


              Geography matters because Carro’s customer proof is uneven across markets. Singapore has the richest
              direct-user evidence via reviews, testimonials, and leasing pages. Malaysia has the strongest operational
              proof outside Singapore because the retained rebrand coverage details physical centres, inspection
              infrastructure, workshops, refurbishment capacity, and live certified inventory on third-party
              marketplaces. Indonesia and Japan have thinner but still real localized surfaces via the Automall FAQ and
              Japan about page.


              What the public record still does not reveal is the mix within those segments. Dealer participation is
              referenced, but dealer counts and GMV share are not. Finance, insurance, and aftersales are definitely
              part of the customer proposition, but public materials do not quantify how many customers attach those
              services or whether those users are new customers versus add-ons to retail buyers. That keeps segmentation
              credible but not fully underwritable.
