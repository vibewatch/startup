      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, Regulation, and Trust
        blocks:
          - type: paragraph
            body: >-
              The growth case for the category is real. Market reports consistently point to affordability versus new
              cars, urbanization, digital accessibility, and better financing schemes as reasons used-car demand keeps
              expanding. Regional macro data are supportive enough to keep the category moving: AMRO still sees roughly
              4% growth into 2026, and ADB highlights resilient integration and digital growth. Vehicle-market trackers
              also show that demand can rebound quickly when financing conditions allow.


              But the constraints matter just as much. PwC's ASEAN-6 snapshot explicitly tied 2024 weakness in Thailand
              and Indonesia to tighter auto loans, showing that credit is not just an enabler but a choke point. Trust
              remains another choke point: online used-car platforms still need verified histories, inspection,
              warranties, and increasingly battery-health certification for used EVs. Consumer-protection rules are also
              still evolving, as UNCTAD's 2025 Thailand agreement makes clear. Finally, the public data stack is
              fragmented across country portals and industry associations, which limits clean bottom-up sizing. The
              combined implication is that Carro operates in a market with visible secular demand but significant
              friction from financing, regulation, and data quality—exactly the conditions where trust-led platforms can
              win, but also where unsupported share claims should be avoided.
