      - number: '8.4'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              The scenario framework turns the chapter from evidence collection into underwriting discipline. In the
              bull case, Carro uses its ancillary mix, scale, and strategic capital to convert the S$43 million EBITDA
              base into a much stronger pre-IPO earnings number, while capital markets remain open to foreign issuers.
              That is how investors can justify a valuation above the last firm round. In the base case, the company
              continues to improve but still prices much closer to the US$3 billion anchor than to the rumor high,
              because EBITDA proof and document transparency remain incomplete.


              The bear case does not require operational collapse. It only requires some combination of missed
              profitability targets, a harder US IPO window, or peer-driven multiple pressure. Carsome's layoff history
              and Bloomberg's April 2026 report on litigation and red tape are reminders that the path to a foreign IPO
              can deteriorate before the business itself breaks. A disciplined investor should therefore underwrite
              valuation ranges, not a single point estimate, and should demand enough entry discount that the base case
              offers acceptable upside without needing the full bull case to arrive on schedule.
