- id: adoption-breadth-and-service-surface
  title: Adoption Breadth Is Visible Through Footprint and Service Surfaces, Not Customer Counts
  body: |-
    Carro does not publicly disclose active customer counts in the retained customer pack, so the best adoption signals are breadth proxies. The company claims seven live markets and more than 4,500 staff across Asia-Pacific. Its FY2025 release says operations scaled further in Hong Kong and Japan, while Malaysia’s rollout shows 11 retail experience centres, 27 inspection centres, 5 workshops, and 2 refurbishment centres. Third-party inventory pages then show that those centres are not purely marketing claims: buyers can see multiple certified vehicles with warranties and explicit return promises on a live marketplace surface.

    The adoption story is therefore real but indirect. Public evidence shows a full-stack customer proposition spread across markets and channels, a meaningful physical footprint in Malaysia, and a product surface that includes retail, financing, insurance, aftersales, and subscription. Financial disclosures add one more indirect breadth marker: ancillary services now contribute the majority of gross profit, which is hard to achieve unless customer attachment extends beyond one-off vehicle sales.

    The missing denominator is still important. None of these public proxies tells investors how many active buyers, sellers, dealers, or subscribers Carro serves today, how quickly those cohorts are growing, or how much activity each geography contributes. The chapter therefore treats market coverage, live inventory, service centres, and ancillary-mix disclosures as breadth indicators rather than invented customer-count proof.
  claimRefs:
