- id: TU005
  title: Expansion and Concentration Risk Table
  notes: Expansion drivers are visible in public surfaces, but concentration data is not. Impact statements are analyst judgments based on retained evidence rather than disclosed customer economics.
  columns:
  - dimension
  - expansion driver / concentration risk
  - impact
  - diligence path
  rows:
  - - Cross-sell from transaction to services
    - Buy or sell flow can attach financing, insurance, aftersales, or subscription
    - 'Positive: broadens monetization and can improve durability if attach rates are real'
    - Request attach rates and gross profit by service line
  - - Geographic integration
    - Malaysia brand integration and Japan/Hong Kong expansion widen customer surface
    - 'Positive with execution risk: consistent process standards matter more as markets multiply'
    - Request country-level service quality and NPS
  - - Dealer concentration
    - Dealers are mentioned but not counted
    - 'Risk unknown: dealer liquidity could be material or immaterial'
    - Request dealer count, GMV share, and top-dealer exposure
  - - Top-customer concentration
    - No public top-account disclosure
    - 'Risk unknown: large fleets or counterparties cannot be sized from retained evidence'
    - Request top-10 customer and fleet concentration
  - - Finance-user concentration
    - NPL headline exists but cohort mix does not
    - Moderate risk if a narrow borrower profile drives finance volume
    - Request origination and loss mix by segment and geography
  - - Used-EV trust gap
    - Battery-health proof is becoming more important, but Carro’s retained public proof remains ICE-centric
    - 'Medium risk: can slow EV conversion and financing trust'
    - Request EV certification and warranty policy
