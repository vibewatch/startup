    - Accepted quote, booked inspection, prepared handover and loan-settlement steps
    - Production-like seller flow reported by user, but identity unverified
    - Reveals timing, payment, and fee mechanics plus lowball concern
    - Anonymous forum evidence is low-confidence and may not be representative
