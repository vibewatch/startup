  title: Customer Journey Map
  type: journey-map
  layout: wide
  summary: Carro’s visible journey starts with search or valuation, moves through inspection and transaction choice, and then expands into servicing, subscription, and potential repeat use.
  data:
    items:
    - label: Discovery / Quote Request
      value: 1
      note: Buyer searches listings or seller requests valuation through Carro’s digital surface. Geography-specific entry points are strongest in Singapore and Malaysia.
    - label: Evaluation / Inspection Booking
      value: 2
      note: Inspection, test-drive, and valuation steps convert digital interest into an offline trust event for both buyers and sellers.
    - label: Transaction Choice
      value: 3
      note: Customer chooses buy, sell, finance attachment, or monthly subscription depending on need and upfront budget.
    - label: Delivery / Warranty / Refund Window
      value: 4
      note: Trust promises become tangible through certification, warranties, and five-day return or money-back language.
    - label: Ownership Services
      value: 5
      note: Insurance, aftersales, maintenance, and app support keep customers inside the ecosystem after the first transaction.
    - label: Repeat / Swap / Sell-Back
      value: 6
      note: Potential repeat behavior exists through sell-back, swap-or-return subscription paths, and future finance or aftersales attachment, but public renewal metrics are absent.
