- id: named-customer-proof-and-user-reviews
  title: Named Customer Proof Exists, but It Is Mostly Anecdotal
  body: |-
    Carro’s retained customer-proof set is consumer-style rather than enterprise-logo-heavy. The strongest named buyer references are two independent Trustindex reviews and one company-authored testimonial. Reuben Phang described the purchase process as transparent and smooth without hard-selling. Jonathan Lim described the transaction as seamless and unusually accommodating on timing. Kris, an expat buyer featured on Carro’s own blog, said the listing detail was more consistent than other websites and that the overall experience was very good. These are concrete, named proofs that real buyers completed transactions, but they remain anecdotal rather than statistically representative.

    There is also adverse direct-user evidence, which matters because positive testimonials alone are not enough. A HardwareZone seller thread describes inspection and test-drive steps, a two-week handover expectation, same-day payment after handover, a S$218 loan-settlement paperwork fee, and warnings that Carro may lowball sellers. That thread is low-confidence because the posters are effectively anonymous, but it is still useful because it shows where seller friction can persist even when valuation starts online.

    The supporting third-party surfaces are process proof rather than person proof. oto.my shows live certified inventory with explicit warranty and money-back language, and Carro Indonesia’s FAQ lays out reservation, test-drive, payment, and warranty flows. Together they make it hard to argue Carro’s customer proposition is purely theoretical, but they still do not reveal retention, repeat behavior, or satisfaction rates by cohort.
  claimRefs:
