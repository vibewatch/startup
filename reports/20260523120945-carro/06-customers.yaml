  evidenceGaps:
  - type: missing-source
    severity: material
    topic: dealer-gap
    missingEvidence: Dealer count, dealer GMV share, and dealer-vs-consumer transaction split by market.
    whyItMatters: Dealer participation is visible only indirectly, so customer-mix underwriting cannot separate retail demand from dealer liquidity.
    diligencePath: Request dealer count, active dealer definitions, and dealer GMV share for FY2024-FY2025 by country.
    relatedQuestionRefs:
    - QU003
    relatedTableRefs:
    - TU001
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, churn, repeat-purchase rates, seller repeat rates, lease renewal rates, and swap frequency.
    whyItMatters: Public trust promises and anecdotes do not show whether Carro retains customers or earns repeat behavior across ownership cycles.
    diligencePath: Ask management for cohort retention by buyer, seller, finance, and subscription segment plus renewal terms and cancellation data.
    relatedQuestionRefs:
    - QU017
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: Top-customer, top-fleet, dealer, and country-level revenue concentration disclosures.
    whyItMatters: Without concentration data, the durability of Carro’s geography and customer diversification claims cannot be verified.
    diligencePath: Request top-10 customer concentration, top dealer counterparties, and revenue mix by market for the last two fiscal years.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU005
  - type: access-blocked
    severity: minor
    topic: review-coverage-gap
    missingEvidence: A broader independent review set beyond curated testimonials, limited review snippets, and one forum thread.
    whyItMatters: Current direct-customer proof may overstate satisfaction because the observable set is small, curated, or anonymous.
    diligencePath: Pull exportable app-store, marketplace, or survey data and run reference calls with recent buyers, sellers, and subscribers.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU003
    - TU004
  - type: missing-source
    severity: material
    topic: ev-trust-gap
    missingEvidence: Explicit Carro EV battery-health certification, warranty, and financing policy disclosures.
    whyItMatters: As used-EV volumes rise, battery-health proof becomes a core trust and financing control rather than a nice-to-have.
    diligencePath: Request EV resale policy, battery-health testing workflow, financing acceptance criteria, and any customer-facing certification template.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU006
  - type: private-evidence-only
    severity: material
    topic: finance-gap
    missingEvidence: Finance take rates, approval rates, repeat borrowing, and delinquency by customer segment or geography.
    whyItMatters: A sub-0.5% NPL headline does not show how finance attachment, acceptance, or underwriting quality varies by user cohort.
    diligencePath: Request loan origination funnel, take rate by channel, and vintage loss performance for consumer and dealer borrowers.
    relatedQuestionRefs:
    - QU018
    relatedTableRefs:
    - TU004
    - TU005
