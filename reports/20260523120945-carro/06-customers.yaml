- id: TU003
  title: Named Customer Proof Table
  enumerationScope:
    coverage: partial
    basis: 'This table covers only publicly confirmable direct-user evidence retained for the chapter: named review snippets, one company-authored testimonial, one anonymous seller forum thread, and process proof from third-party marketplace surfaces. It is necessarily partial because Carro does not publish a complete customer list or representative satisfaction sample.'
