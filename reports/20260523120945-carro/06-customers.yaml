- id: TU006
  title: Procurement Friction / Trust Signals Table
  notes: This table intentionally separates trust controls from friction points so diligence does not mistake warranties and inspection for proven retention.
  columns:
  - signal
  - evidence
  - customer segment
  - implication
  - limitation
  rows:
  - - Fair quotation / pricing algorithms
    - HSBC says Carro uses proprietary pricing to ensure fair quotations and prices
    - Buyers and sellers
    - Addresses lemon-risk narrative at the quote stage
    - No public quote-accuracy or conversion data
  - - 5-day refund / money-back promise
    - HSBC and oto.my both surface five-day return or money-back language
    - Retail buyers
    - Reduces purchase hesitation and supports trust
    - No disclosure on actual return rates
  - - 160-point inspection and certification
    - BusinessToday, BigWheels, and oto.my surface 160-point inspection and certification standards
    - Retail buyers / certified buyers
    - Supports transparency and perceived quality control
    - No disclosed failure rate or reconditioning cost
  - - Warranty coverage
    - oto.my shows 12-month engine-and-gearbox warranty and a 3-month Lite version
    - Malaysia certified buyers
    - Makes certified inventory more financeable and easier to compare
    - Warranty claim rates are not disclosed
  - - Seller handover and paperwork
    - HardwareZone thread says inspection, loan paperwork, and handover remain operational steps
    - Private sellers
    - Explains where digital front end still meets offline friction
    - Anecdotal forum evidence only
  - - App-managed subscription support
    - Carro leasing page says users manage assistance, servicing, and maintenance in app
    - Subscribers
    - Improves operational convenience and keeps customer inside ecosystem
    - No app engagement or resolution-time data
  - - Reservation / test-drive process
    - Carro Indonesia FAQ requires reservation and scheduled test drive
    - Indonesia buyers
    - Shows standardized process control before physical delivery
    - No conversion data from reservation to sale
  - - Emerging EV battery-proof expectation
    - Motorist argues battery certification is becoming a trust requirement for buyers and lenders
    - Future used-EV buyers and financiers
    - Raises the bar for customer trust as EV mix grows
    - Carro’s retained pages do not yet expose equivalent EV proof
