tables:
- id: TU001
  title: Customer Segmentation Table
  notes: Rows reflect publicly visible customer lanes only. Scale and strategic value are inferred from retained public surfaces; Carro does not disclose segment-level active-customer counts or revenue mix.
  columns:
  - segment
  - buyer/user/payer
  - use case
  - scale / proof
  - revenue / strategic value
  - gap
  rows:
  - - Retail buyers
    - Individual buyer / family user / buyer pays or finances
    - Purchase used cars with inspection, warranty, refund, and delivery support
    - Trustindex reviews, Kris testimonial, oto.my inventory, Carro.id FAQ
    - Core transaction surface and strongest direct user-proof lane
    - No active buyer count or repeat-purchase rate
  - - Private sellers / trade-in sellers
    - Vehicle owner / same user / seller receives proceeds
    - Online quote, inspection, test drive, handover, loan settlement
    - HardwareZone seller thread plus HSBC valuation language
    - Critical supply lane for inventory acquisition
    - No seller volume, repeat-seller rate, or satisfaction score
  - - Dealers / wholesale counterparties
    - Dealer principal / inventory manager / dealership pays
    - Buy and sell vehicles through platform liquidity tools
    - SME Business Review plus Tracxn / CB Insights classification
    - Important for liquidity and supply depth if material
    - Dealer count and GMV share not disclosed
  - - Finance users
    - Borrower / vehicle owner / borrower repays
    - Used-car loan attachment and related financing products
    - HSBC financing reference and FY2024 Genie Financial Services disclosure
    - Supports ancillary gross profit and lowers upfront friction
    - No finance take rate, approval rate, or repeat borrowing data
  - - Leasing / subscription users
    - Subscriber / driver / subscriber pays monthly
    - Short-term subscription for new, pre-owned, and EV cars with swap-or-return option
    - Carro leasing page in Singapore and leasing navigation in Japan
    - Recurring relationship path with cross-sell potential
    - No renewal, swap frequency, or conversion metrics
  - - Aftersales / certified buyers
    - Vehicle owner / service user / buyer or bundled package pays
    - Inspection, refurbishment, warranty, servicing, maintenance, and Carro Certified support
    - Malaysia refurbishment-centre coverage plus oto.my warranty language
    - Trust-building lane that can raise margin and repeat usage
    - No aftersales attach rate or service-margin disclosure
  - - Geographic users
    - Country-specific buyer, seller, subscriber, or finance user
    - Localized customer surfaces across SG, MY, ID, JP and broader group markets
    - Official 7-market claim, Malaysia physical network, Indonesia FAQ, Japan local page
    - Diversifies addressable demand and brand reach
    - No customer or revenue split by market
