summary:
  headline: >-
    Carro is a scaled Southeast Asian automotive platform with visible profitability
    progress and credible IPO optionality, but opaque capital structure, missing
    customer / unit-economics disclosure, and rumor-heavy valuation talk keep the
    risk-reward in TRACK territory around the US$3.0 billion anchor.
