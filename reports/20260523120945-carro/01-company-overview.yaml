company:
  name: Carro
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Carro is a 2015-founded Singapore automotive platform that has expanded from used-car
    marketplace roots into a fuller retail, financing, insurance, leasing, and aftersales
    stack across seven Asian markets. Official FY2024-FY2025 disclosures show audited EBITDA
    profitability and FY2025 revenue of S$1.2 billion, but the public record still leaves
    key diligence gaps around current board composition, shareholder rights, and independently
    verified customer-count and valuation data as Carro explores a possible 2026 U.S. IPO.
sections:
  - id: identity-and-operating-model
    title: Identity, footprint, and operating model
    body: >-
      Carro's reusable ground truth for the rest of the report is clearer on identity and
      product scope than on governance. Official and independent sources align that the company
      was founded in 2015 in Singapore by Aaron Tan, Aditya Lesmana, and Kelvin Chng. The
      company is not just a classifieds site: official materials describe a full-stack
      automotive ecosystem spanning retail, insurance, aftersales, and financing, while
      TechCrunch's 2021 funding coverage split the model into wholesale, retail, and fintech.
      The LEAP product page adds a concrete subscription example, showing that Carro manages
      leasing, servicing, insurance, and app-based support rather than only transaction
      matching. Carro's about page now claims presence in Singapore, Malaysia, Indonesia,
      Thailand, Japan, Taiwan, and Hong Kong, and Forbes independently tied that seven-market
      footprint to the Beyond Cars acquisition in Hong Kong. Later chapters should therefore
      treat Carro as a regional automotive platform with multiple monetization layers, not as
      a narrow Singapore used-car marketplace.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
      - CO037
    tableRefs:
      - TO001
    figureRefs:
      - FO002
  - id: founders-leadership-and-governance
    title: Founders, leadership, and governance visibility
    body: >-
      The retained pack makes Aaron Tan legible as the controlling public face of Carro, but
      it is materially weaker on the broader control map. Company disclosures and profile
      sources consistently identify Tan as co-founder and chief executive, while FY2025 company
      materials also surface Ernest Chew as CFO. Independent profiles from CNA and Vulcan Post
      give Tan more background than they do the other co-founders, describing Carnegie Mellon,
      BLOCK71, venture-investing experience, and an early entrepreneurial track record.
      That asymmetry matters for diligence: Aaron Tan is easy to underwrite as a key-person
      dependency, but the retained public pack does not expose a full current board roster,
      voting control, or investor-rights structure. PitchBook and CB Insights confirm many
      investors and multiple later-stage financings, yet they still do not substitute for an
      actual board list or shareholder-rights package. The right conclusion is not to invent a
      hidden governance picture, but to preserve that governance visibility remains materially
      incomplete despite strong founder-led branding and visible finance leadership.
    claimRefs:
      - CO011
      - CO012
      - CO013
      - CO020
      - CO035
      - CO040
    tableRefs:
      - TO002
  - id: capital-history-and-stakeholders
    title: Capital history and stakeholder map
    body: >-
      Carro's capital history shows a business that has steadily broadened its funding base
      beyond pure venture capital. The 2021 Series C raised US$360 million and established
      unicorn status, with SoftBank Vision Fund 2 the headline lead and investors such as MSIG
      and EV Growth also named in coverage. After that step-up, Carro added strategic capital
      and operating partners rather than relying only on another conventional VC round. Jardine
      Cycle & Carriage entered a cross-holding partnership tied to Republic Auto in 2023; Woori
      Venture Partners backed Carro in late 2024 while management highlighted Southeast Asian
      expansion; Cool Japan Fund led a US$60 million strategic investment in 2025; and SY
      Holdings signed a financing-oriented partnership tied to cross-border funding and new-car
      propositions. Market-data providers disagree on the exact cumulative capital raised, with
      company copy still saying over US$600 million while Tracxn and CB Insights point toward a
      later tally closer to US$686 million to US$800 million. That range is good enough for a
      company-overview snapshot, but not precise enough to substitute for the current cap table.
    claimRefs:
      - CO014
      - CO015
      - CO016
      - CO017
      - CO018
      - CO019
      - CO020
      - CO021
      - CO034
      - CO038
      - CO040
    tableRefs:
      - TO003
  - id: scale-milestones-and-ipo-readiness
    title: Scale, milestones, IPO readiness, and evidence gaps
    body: >-
      Carro's current public profile is strongest on momentum and weakest on what an IPO-ready
      diligence package would need for final underwriting. Official FY2024 disclosure reported
      S$43 million of EBITDA, a 4% EBITDA margin, a fourth consecutive year of positive EBITDA,
      S$124 million of gross profit, and ancillary-heavy margin expansion with non-performing
      loans below 0.5% in fintech. FY2025 disclosure then pushed the headline further to
      S$1.2 billion of revenue, S$149 million of gross profit, S$385 million of liquidity, and
      continued expansion in Hong Kong and Japan. Those are meaningful signals that Carro is no
      longer a pure growth-at-all-costs story. But the IPO narrative remains conditional, not
      settled. Marketing-focused coverage used "IPO-ready" language around the myTukar rebrand,
      whereas Reuters-sourced reporting framed a possible 2026 U.S. IPO as dependent on market
      conditions and management still described a much higher EBITDA target of about S$130
      million, potentially after another fundraising step. The chapter should therefore carry
      both ideas at once: Carro has visible profitability and regional scale, yet current
      valuation, board rights, and independently verified customer breadth remain incomplete.
    claimRefs:
      - CO009
      - CO010
      - CO022
      - CO023
      - CO024
      - CO025
      - CO026
      - CO027
      - CO028
      - CO029
