chapter:
  number: 7
  title: Risks
  summary: 'Carro''s residual risk profile is high rather than critical: the retained pack does not surface public Carro-specific enforcement, but it does show tightening multi-jurisdiction consumer and fraud regimes, capital-market dependence ahead of IPO, and operational trust promises that could turn into legal, margin, and financing stress if execution slips. Visible mitigations such as refunds, warranties, certification flows, reported low NPLs, and strategic backers lower immediate downside, yet the highest residual exposures remain capital access, cross-border compliance, and quality-control execution as the model expands.'
sections:
- id: risk-stack-overview
  title: Residual Risk Stack Is High Even Without A Public Enforcement File
  body: |-
    Carro's retained risk pack points to a business whose core downside is now more about transmission than about a single existential flaw. The public materials do not surface a Carro-specific enforcement action or litigation file, but that absence should not be read as proof of low risk. Instead, the pack shows a company operating across several consumer-protection regimes, still discussing one more fundraising step before IPO, and relying on trust promises such as refunds, warranties, certification, and fair quotation workflows. Those are features customers value, but they also become pathways through which operational errors can become complaint, legal, or financing events.

    The severity ranking is therefore led by capital access, then consumer and fraud compliance, then operational trust execution. Capital access ranks first because both Business Times and Reuters-sourced reporting describe another funding step and market-sensitive IPO timing as live dependencies rather than optional upside. Consumer and fraud compliance ranks next because Singapore already has complaint-to-injunction pathways and Thailand is tightening platform obligations while reporting large online-fraud losses. Operational execution ranks third because Carro's public promise set is broad, but the pack still lacks by-market complaint, fraud-loss, and warranty-rate disclosure. The two figures in this section summarize that hierarchy and show how localized failures can spread into revenue, margin, and valuation.
  claimRefs:
  - CR003
  - CR007
  - CR009
  - CR026
  - CR041
  - CR045
  figureRefs:
  - FR001
  - FR002
- id: legal-regulatory-risk
  title: Legal And Regulatory Exposure Is Regime-Driven Even Without Named Carro Cases
  body: |-
    The legal story is stronger on regime clarity than on company-specific disclosure. Singapore's CPFTA explicitly covers unfair practices and non-conforming goods, while CCS explains that persistent offenders can move from complaint handling through CASE or STB into investigation and court injunctions. Thailand adds a second layer of relevance because its consumer-protection framework covers deceptive advertising, unfair contracts, and unsafe services, and newer anti-fraud measures broaden the compliance burden on digital platforms, banks, and telecom firms. ASEAN and UNCTAD materials add the regional point: digital-market consumer protection is becoming more coordinated and more salient, not less.

    That matters for Carro because the company publicly says it operates in Singapore, Malaysia, Indonesia, and Thailand alongside other Asian markets. A used-car marketplace that also markets certification, financing, refunds, and warranties cannot treat consumer protection as a narrow legal footnote. At the same time, the retained pack does not surface a Carro-specific lawsuit, injunction, or regulator action. The right interpretation is caution, not exoneration. Investors should treat the absence of a public enforcement file as a disclosure gap until diligence produces legal-contingency schedules, complaint logs, and regulator correspondence by market. The legal register below therefore ranks regime exposure by severity while keeping Carro-specific enforcement framed as an absence in the retained pack rather than an invented fact.
  claimRefs:
