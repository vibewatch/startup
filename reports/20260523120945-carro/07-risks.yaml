- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk theme
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Legal / regulatory
    - Named regulator action, injunction, or material legal notice tied to consumer practices or fraud controls
    - Any formal action in a core market or repeated complaint escalation without remediation
    - Pause underwriting and require legal remediation plan before advancing the thesis
  - - Operational trust
    - Refunds, warranty claims, or complaint rates rise materially
    - Evidence of sustained deterioration in customer redress or defect-resolution metrics
    - Re-rate margin quality and assume higher rework, brand, and working-capital drag
  - - Fraud / abuse
    - Market-level fraud losses or impersonation events become persistent
    - Pattern of repeated scam losses, chargebacks, or digital-platform non-compliance findings
    - Treat fraud control as a thesis-break until operating controls are independently validated
  - - Capital access
    - Final funding round slips or IPO timing moves materially because markets shut
    - Missed fundraising window, much lower valuation, or materially higher financing cost
    - Assume higher dilution, slower expansion, and a weaker exit path
  - - Partner dependency
    - HSBC, Woori, or SY-linked support does not convert into reliable funding or execution gains
    - Facility or partnership under-delivers, terminates, or introduces control issues
    - Discount growth assumptions and require stand-alone economics without partner uplift
  - - EV trust / quality
    - No credible battery-health, residual-value, or inspection evidence as EV mix rises
    - Meaningful EV inventory growth without matching trust and loss-control metrics
    - Cap EV upside in the model and widen loss assumptions for financing and residual value
  notes: These kill criteria convert the chapter's residual-risk ranking into monitorable events so the investment thesis can be updated before a full downside becomes visible in aggregate financials.
