- id: mitigations-and-thesis-breaks
  title: Mitigations Exist, But Thesis-Break Triggers Are Clear And Monitorable
  body: |-
    Carro does have visible mitigations. Refunds, warranties, certification flows, and fair-pricing language show the company understands the trust problem in used cars. The Woori release adds one tangible financing-quality datapoint with sub-0.5% NPLs in FY2024, and strategic relationships with HSBC, Woori, and SY Holdings show that the company is not approaching growth alone. Those are meaningful positives and they explain why the risk rating is high rather than critical.

    But the mitigations are not self-executing. The key thesis-breaks are straightforward: evidence of regulatory or legal action tied to unfair practices or fraud controls; a visible deterioration in refunds, complaints, or warranty claims; loss of access to funding, partner integration, or IPO timing; and proof that EV trust or inspection discipline is deteriorating as the product mix broadens. The kill-criteria table below translates those risks into monitorable triggers and decision implications. The remaining evidence gaps are also explicit: Carro still has not publicly disclosed complaint rates, fraud losses, legal contingencies, or facility covenants in a way that lets investors underwrite downside with prospectus-level confidence.
