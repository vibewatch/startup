  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: legal contingencies
    missingEvidence: Country-by-country litigation dockets, regulator inquiries, open complaints with authorities, legal reserves, and insurance coverage for consumer claims.
    whyItMatters: The retained public pack shows the governing regimes but not whether Carro has latent legal exposure inside them, which keeps downside underwritten only at the regime level.
    diligencePath: Request outside-counsel letters, a schedule of threatened or filed claims, regulator correspondence, and legal-reserve support by market.
    relatedQuestionRefs:
    - QR006
    - QR030
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: complaints and fraud losses
    missingEvidence: By-market complaint counts, fraud losses, chargebacks, refund rates, warranty-claim rates, and time-to-resolution metrics.
    whyItMatters: Operational trust is central to the Carro thesis, yet the public pack does not show whether trust controls are holding at scale or merely marketed well.
    diligencePath: Request customer-support dashboards, fraud-loss reports, refund cohorts, warranty-claims data, and site-level remediation metrics for core markets.
    relatedQuestionRefs:
    - QR008
    - QR029
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: blocking
    topic: facilities and partner economics
    missingEvidence: Current warehouse lines, covenants, partner economics, debt maturities, advance rates, and the practical dependency Carro has on each financing counterparty.
    whyItMatters: Capital access is the top residual risk in the chapter, and it cannot be fully underwritten from media reports about funding ambition or partner announcements alone.
    diligencePath: Obtain treasury materials, facility agreements, partner term sheets, downside liquidity scenarios, and board-approved fundraising contingency plans.
    relatedQuestionRefs:
    - QR018
    - QR028
    - QR030
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: EV quality control
    missingEvidence: Battery-health workflow, residual-value assumptions, EV warranty-claim rates, and credit-policy adjustments for used EV inventory.
    whyItMatters: If Carro expands used-EV exposure without a strong trust and loss-control stack, operational risk can spread directly into margin and financing quality.
    diligencePath: Request EV-specific inspection SOPs, battery-health certification partners, financing overlays, and warranty-loss data by cohort.
    relatedQuestionRefs:
    - QR012
    - QR027
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: material
    topic: succession and operating control
    missingEvidence: Succession plans, delegated owners below Aaron Tan, site-level SOP audit results, and control metrics for newly integrated markets or acquisitions.
    whyItMatters: Execution stretch is manageable only if operating control is distributed; otherwise founder concentration and cross-market standardization become hidden fragilities.
    diligencePath: Request org charts, key-person backup plans, internal audit outputs, acquisition integration dashboards, and site-level compliance scorecards.
    relatedQuestionRefs:
    - QR021
    - QR023
    - QR024
    relatedTableRefs:
    - TR004
