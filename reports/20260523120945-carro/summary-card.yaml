  topStrengths:
    - >-
      FY2025 disclosures show real operating scale: S$1.2 billion of revenue, S$149 million of gross profit, S$385
      million of liquidity, and S$43 million of EBITDA.
    - >-
      Margin quality is improving because ancillary services generated more than 55% of FY2025 gross profit after
      contributing nearly 60% in FY2024.
    - >-
      Carro is more than a classifieds front end: retained sources support a full-stack model spanning retail,
      wholesale, financing, insurance, aftersales, and leasing / subscription across seven markets.
    - >-
      Strategic capital and regional expansion are still live, with Woori and Cool Japan Fund support arriving as the
      company expanded in Hong Kong and Japan.
  topRisks:
    - >-
      Capital-structure opacity is still a gating risk because the cap table, liquidation preferences, debt facilities,
      and IPO structure remain private.
    - >-
      Management is still targeting roughly S$130 million of EBITDA and one more funding round before IPO, so
      capital-market dependence is not yet solved.
    - >-
      Public sources do not disclose current customer count, dealer count, retention, concentration, or segment-level
      unit economics, limiting underwriting quality.
    - >-
      Multi-jurisdiction consumer, fraud, and operational-compliance exposure remains meaningful in a financing- and
      EV-heavy model that depends on trust execution.
  unresolvedGaps:
    - >-
      Current cap table, share classes, liquidation preferences, anti-dilution terms, and any preference overhang from
      2021, 2024, and 2025 investors are not public.
    - >-
      Genie and wider financing/floorplan facility sizes, lenders, covenants, maturities, and cure mechanics remain
      undisclosed.
    - >-
      Current customer, dealer, and account counts; retention and renewal behavior; and by-market concentration metrics
      are not disclosed.
    - >-
      Public sources do not provide a full current board roster, shareholder-rights package, or prospectus-level
      governance disclosure.
    - >-
      Investors still need a credible bridge from the S$43 million FY2025 EBITDA base toward management's roughly S$130
      million pre-IPO target.
