- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Retail vehicle transactions
    - Sale of used vehicles to consumers through Carro-operated retail workflow
    - Per vehicle transaction
    - Active but not separately disclosed in FY2025 public materials
    - Medium — likely high-volume but lower margin than ancillary attach
    - Break out retail revenue, gross profit, inventory days, and refurbishment cost by market
  - - Dealer / wholesale transactions
    - Wholesale inventory flow and dealer liquidity services
    - Per dealer transaction / inventory lot
    - Confirmed by TechCrunch business-model split; no current revenue disclosure
    - Medium — can support turnover but may require working capital
    - Disclose dealer GMV, take rate, and any warehouse or floorplan financing exposure
  - - Financing
    - B2C car loans plus B2B working-capital loans
    - Per originated loan / financing attachment
    - Confirmed as active lane; revenue and balances undisclosed
    - Potentially high if credit quality holds; underwriting risk matters
    - Provide originated volume, take rate, yields, and loss metrics by product
  - - Insurance
    - Auto insurance and usage-based insurance products attached to transactions
    - Per policy / commission
    - Confirmed as active lane; no public FY2025 revenue split
    - Potentially high-margin ancillary lane
    - Disclose penetration, commission economics, and renewal behavior
  - - Aftersales and ownership services
    - Service and ownership monetization after vehicle sale
    - Per service event / subscription
    - Confirmed by about page; economics undisclosed
    - Medium to high if repeatable and low-capital
    - Provide attachment, repeat rate, and gross margin by service category
  - - Subscription
    - Car subscription offering cited in independent coverage
    - Per subscription contract
    - Product existence confirmed; current pricing and scale undisclosed
    - Unknown — could smooth revenue but may add fleet and residual-risk exposure
    - Provide active contracts, utilization, residual-value policy, and gross margin
  notes: Official releases prove company-level revenue, gross profit, and ancillary contribution, but not audited revenue mix by lane. Status cells preserve what is evidenced and leave the rest as diligence asks rather than invented segment economics.
