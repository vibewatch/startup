company:
  name: Carro
chapter:
  number: 4
  title: Financials
  summary: 'Carro''s public financial evidence is strong enough to confirm scale, improving gross-margin quality, and near-term capital adequacy, but too thin for full underwriting. Official FY2025 disclosures show S$1.2 billion of revenue, S$149 million of gross profit, 12.4% gross margin, S$385 million of liquidity, and S$43 million of EBITDA, while ancillary services contributed more than half of gross profit in both FY2024 and FY2025. The blockers are the missing pieces investors actually need for conviction: stream-level revenue mix, realized pricing, CAC and payback, working-capital mechanics, debt and facility disclosure, and current operating-volume metrics.'
sections:
- id: revenue-model-and-mix
  title: Revenue Streams, Mix Quality, and Recognition Boundaries
  body: |-
    Carro's public financial story is credible on topline and gross-profit growth, but not on audited segment mix. The strongest evidence comes from company-distributed FY2024 and FY2025 releases, which show FY2025 revenue of S$1.2 billion, gross profit of S$149 million, gross margin of 12.4%, liquidity of S$385 million, and audited EBITDA of S$43 million. Those releases also say ancillaries contributed more than 55% of gross profit in FY2025 and nearly 60% in FY2024. That mix point matters more than the absolute revenue figure because it shows the public margin story is being driven by service attachment rather than vehicle turnover alone.

    The retained pack also supports a broader revenue architecture than a simple used-car marketplace. TechCrunch described Carro's operating stack as wholesale, retail, and fintech, with fintech including B2C loans, auto insurance, and B2B working-capital loans. Carro's about page adds retail, insurance, aftersales, and financing, while The Asset highlighted subscription and usage-based insurance products. What remains missing is the actual audited split among those lanes. Investors therefore can underwrite the existence of multiple monetization paths, but not the precise stream-by-stream economics or recognition profile.
