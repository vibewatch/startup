- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Revenue mix by stream and geography
    - Cannot tell whether retail, wholesale, financing, insurance, or aftersales drives current revenue and gross profit
    - Request audited FY2024-FY2025 segment bridge by lane and market
  - - Realized pricing and take rates
    - Cannot connect product presence to monetization quality or discounting pressure
    - Collect dealer contracts, rate cards, financing terms, and realized pricing waterfalls
  - - Gross margin by lane
    - Cannot test whether ancillary-led mix truly offsets lower-margin vehicle turnover
    - Request contribution-margin and gross-margin bridge by revenue stream
  - - CAC, payback, and sales cycle
    - Cannot judge whether GTM is efficient or subsidy-heavy
    - Request acquisition and conversion data by buyer, dealer, and partner channel
  - - Inventory turns and cash-conversion cycle
    - Cannot assess working-capital drag or balance-sheet stress under growth
    - Request inventory aging, refurbishment cycle, receivables, and payables data
  - - Debt and warehouse or floorplan facilities
    - Cannot assess leverage, covenant pressure, or hidden liquidity risk
    - Request full debt schedule and facility documentation
  - - Burn and runway scenario math
    - Cannot determine whether IPO timing is discretionary or financing-critical
    - Request 24-month cash bridge with downside scenario
  - - Current GMV, units sold, active users, and attachment rates
    - Cannot connect reported dollars to operational volume or service penetration
    - Request KPI dashboards for GMV, units, active buyers, active dealers, financing attach, and insurance attach
  notes: These are not generic wishlist items; they are the specific blockers that prevent the public financial story from becoming an investable model. Each gap maps directly to a diligence request needed before underwriting.
