  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: segment economics
    missingEvidence: Audited revenue mix by retail, wholesale, financing, insurance, aftersales, and geography.
    whyItMatters: Without segment mix, investors cannot determine which lanes produce the majority of revenue or gross profit, or whether headline margin expansion is durable.
    diligencePath: Request management financials that bridge FY2024-FY2025 revenue, gross profit, and EBITDA by operating lane and by market.
    relatedQuestionRefs:
    - QI004
    - QI006
    - QI028
    relatedTableRefs:
    - TI001
  - type: private-evidence-only
    severity: material
    topic: realized pricing and take rates
    missingEvidence: List pricing, realized pricing, take-rate schedules, financing APRs, insurance commissions, and discount ladders by lane.
    whyItMatters: Revenue quality cannot be underwritten from product presence alone; pricing determines whether ancillary attach actually earns superior unit margin.
    diligencePath: Collect current rate cards, dealer contracts, financing terms, and realized pricing waterfalls by cohort and market.
    relatedQuestionRefs:
    - QI007
    - QI009
    - QI028
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: material
    topic: sales efficiency
    missingEvidence: CAC, payback period, conversion funnel, sales cycle, and channel-level acquisition economics.
    whyItMatters: Public GTM evidence is partnership-led and operational, but the absence of CAC and payback prevents judging whether growth is efficient or subsidy-driven.
    diligencePath: Request cohort-level acquisition and conversion data for retail buyers, dealers, financing attachments, and partner-sourced supply.
    relatedQuestionRefs:
    - QI010
    - QI011
    - QI012
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: working capital and obligations
    missingEvidence: Inventory turns, floorplan or warehouse lines, receivables aging, debt balances, covenants, and project-finance obligations.
    whyItMatters: Carro operates an inventory-and-credit-bearing model; missing working-capital detail obscures the true capital intensity and downside risk of the business.
    diligencePath: Obtain debt schedules, financing-facility agreements, inventory aging, and cash-conversion metrics from finance and treasury teams.
    relatedQuestionRefs:
    - QI015
    - QI016
    - QI022
    - QI029
    relatedTableRefs:
    - TI003
    - TI004
  - type: private-evidence-only
    severity: material
    topic: burn and runway
    missingEvidence: Monthly burn, cash runway, planned use of funds beyond public strategic statements, and downside liquidity scenarios.
    whyItMatters: Reported liquidity alone does not show how long Carro can self-fund growth or how much external capital is still needed before IPO.
    diligencePath: Request a 24-month cash bridge showing baseline burn, working-capital assumptions, capex, funding triggers, and minimum liquidity thresholds.
    relatedQuestionRefs:
    - QI020
    - QI021
    - QI023
    - QI027
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: operational traction metrics
    missingEvidence: Current GMV, units sold, active buyers, active dealers, financing attachment rates, insurance penetration, and utilization metrics.
    whyItMatters: The public FY2025 pack proves scale in dollars but not the operational drivers behind revenue or the sustainability of ancillary attach.
    diligencePath: Request operating KPI dashboards that connect transaction volume, attachment rates, and utilization to revenue and gross profit by market.
    relatedQuestionRefs:
    - QI017
