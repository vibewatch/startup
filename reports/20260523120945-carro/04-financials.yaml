- id: financial-verdict-and-blockers
  title: 'Financial Verdict: Better Revenue Quality, But Incomplete Underwriting Inputs'
  body: |-
    The financial verdict is better than a generic Southeast Asia startup growth story but weaker than a public-equity-ready disclosure package. Revenue quality looks directionally improved because gross profit grew faster than revenue and ancillaries contributed the majority of gross profit in both FY2024 and FY2025. That supports a thesis that Carro's best economics come from financing, insurance, aftersales, and other attached services rather than from low-margin vehicle turnover alone. The company also enters any financing discussion from a stronger position than many peers because it has positive EBITDA and a large reported liquidity buffer.

    The blockers are explicit. Public sources do not disclose realized pricing, revenue mix by stream or geography, gross margin by lane, CAC, payback, inventory turns, burn, runway, debt balances, or project-finance obligations. Even the total capital-raised number is not cleanly reconcilable across company copy, Tracxn, and CB Insights. The filing-style evidence in the retained pack is only a registry-derived company profile, not a prospectus or audited segment filing. For diligence, that means Carro can be credited with scale and a plausible margin path, but not with underwritten segment economics or a fully transparent capital structure.
