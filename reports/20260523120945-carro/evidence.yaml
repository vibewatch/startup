evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership and founder table coverage
    missingEvidence: >-
      Current executive roster, board composition, committee structure, and reporting lines beyond Aaron Tan and Ernest
      Chew.
    whyItMatters: Governance and key-person concentration cannot be assessed cleanly without a current leadership and board map.
    diligencePath: Request the latest board deck, org chart, and executive roster during management diligence.
    relatedQuestionRefs:
      - QO009
      - QO025
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder or investor map coverage
    missingEvidence: >-
      Current cap table, board-seat allocation, liquidation preferences, debt facilities, and any strategic side letters
      tied to JC&C, Woori, Cool Japan Fund, or SoftBank.
    whyItMatters: Economic control and IPO-readiness cannot be underwritten from public investor names alone.
    diligencePath: Obtain the latest cap table, financing documents, and shareholder-rights summary from counsel or finance.
    relatedQuestionRefs:
      - QO012
      - QO025
      - QO026
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: current customer-count disclosure
    missingEvidence: Audited current customer, dealer, and active-account counts with country split and definition.
    whyItMatters: Carro's scale is visible through revenue and staffing, but customer breadth still cannot be benchmarked reliably.
    diligencePath: Request KPI dashboards or audited management reporting that defines customer and dealer counts consistently.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: market sizing methodology mismatch
    missingEvidence: >-
      Full vendor methodology notes that separate transaction value, dealer revenue, financing attach, and other
      included services in each Southeast Asia used-car market estimate.
    whyItMatters: Without comparable definitions, published TAM estimates can be misused as if they measured the same economic pool.
    diligencePath: >-
      Obtain the full paid methodologies for Mordor, Credence, Verified, and Ken Research before using any estimate in
      valuation work.
    relatedQuestionRefs:
      - QM004
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: carro sam and som disclosure gap
    missingEvidence: >-
      Country-level Carro transaction volume, GMV, take rate, financed-share, insurance attach-rate, and gross-margin
      split between retail, wholesale, and fintech.
    whyItMatters: >-
      A precise SAM or SOM for Carro cannot be underwritten without knowing which revenue and transaction layers are
      material in each market.
    diligencePath: >-
      Request management KPI dashboards or audited board materials with country and segment splits for volume, GMV, and
      monetization.
    relatedQuestionRefs:
      - QM005
      - QM026
    relatedTableRefs:
      - TM002
  - type: access-blocked
    severity: material
    topic: harmonized country used-car data
    missingEvidence: >-
      Comparable country-by-country used-car transaction counts and value series for Singapore, Malaysia, Indonesia, and
      Thailand rather than separate portal fragments or headline teasers.
    whyItMatters: >-
      Bottom-up sizing remains fragile when official sources expose different units, years, and download surfaces across
      markets.
    diligencePath: >-
      Build a country data pack from local transport ministries, dealer associations, and finance regulators, then
      normalize units and time windows before revisiting the SAM.
    relatedQuestionRefs:
      - QM023
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: auto-loan approval and financing conversion
    missingEvidence: >-
      Public country-level auto-loan approval, delinquency, and denial-rate data for used vehicles in Carro's core
      markets.
    whyItMatters: >-
      Financing is a major growth driver and constraint, but current public evidence is better on narrative direction
      than on conversion math.
    diligencePath: >-
      Request lender partner scorecards and delinquency cohorts or compile central-bank and finance-association data by
      market.
    relatedQuestionRefs:
      - QM017
      - QM018
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: minor
    topic: used ev certification adoption by market
    missingEvidence: >-
      Country-by-country penetration of battery-health certification, lender acceptance rules, and pricing impact for
      used EVs in Southeast Asia.
    whyItMatters: >-
      Used-EV trust is likely to matter more over time, but current evidence is too anecdotal to size the opportunity or
      risk precisely.
    diligencePath: >-
      Collect lender policy documents, insurer underwriting rules, and resale-price studies for certified versus
      uncertified used EVs.
    relatedQuestionRefs:
      - QM013
      - QM020
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: competitor pricing transparency
    missingEvidence: >-
      Standardized public contract pricing, dealer subscription cards, or disclosed take rates for Carro, Carsome,
      OLXmobbi, iCarAsia, and country marketplaces.
    whyItMatters: >-
      Without fee-card transparency, pricing comparison can only be done at the packaging-model level and not at the
      contribution-margin level investors would want.
    diligencePath: >-
      Collect current dealer-rate cards, buyer fee schedules, and finance-attach economics directly from sales teams or
      management data rooms in each priority market.
    relatedQuestionRefs:
      - QP013
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: regulatory and compliance posture by market
    missingEvidence: >-
      Cross-market disclosure of licenses, complaint rates, underwriting controls, warranty reserve practices, and
      consumer-protection processes for each major platform.
    whyItMatters: >-
      Trust is a core competitive axis, but public marketing pages are not enough to determine which platform is
      structurally stronger on compliance and governance.
    diligencePath: >-
      Request compliance packs, regulator correspondence summaries, warranty-claims data, and consumer-complaint
      dashboards for Carro and its closest peers.
    relatedQuestionRefs:
      - QP015
    relatedTableRefs:
      - TP003
  - type: access-blocked
    severity: material
    topic: carsome recent profitability progression
    missingEvidence: >-
      Full text of the retained Tech in Asia pages on Carsome's 2024 and 2025 EBITDA/profit milestones rather than
      JS-only shells.
    whyItMatters: >-
      The layoff evidence is clear, but the strongest public counter-evidence on Carsome's later profitability remains
      partially inaccessible in the retained pack, making trend interpretation incomplete.
    diligencePath: >-
      Re-fetch the Tech in Asia articles through a render-capable path or replace them with accessible audited,
      official, or Reuters-level evidence on Carsome's current profitability.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: material
    topic: online penetration of used-car transactions
    missingEvidence: >-
      A source-backed cross-country series showing what percentage of Southeast Asia used-car transactions actually
      complete online or through digital-first platforms.
    whyItMatters: >-
      Moat and market-share claims are easy to overstate when public pages show large listing counts but do not reveal
      how much of the category has truly shifted online.
    diligencePath: >-
      Obtain country-level channel-mix studies, platform transaction disclosures, or regulator or association data that
      separate online-originated used-car sales from overall vehicle turnover.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP001
      - TP004
