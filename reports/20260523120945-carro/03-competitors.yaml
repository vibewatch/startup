  evidenceGaps:
  - type: missing-source
    severity: material
    topic: competitor pricing transparency
    missingEvidence: Standardized public contract pricing, dealer subscription cards, or disclosed take rates for Carro, Carsome, OLXmobbi, iCarAsia, and country marketplaces.
    whyItMatters: Without fee-card transparency, pricing comparison can only be done at the packaging-model level and not at the contribution-margin level investors would want.
    diligencePath: Collect current dealer-rate cards, buyer fee schedules, and finance-attach economics directly from sales teams or management data rooms in each priority market.
    relatedQuestionRefs:
    - QP013
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: regulatory and compliance posture by market
    missingEvidence: Cross-market disclosure of licenses, complaint rates, underwriting controls, warranty reserve practices, and consumer-protection processes for each major platform.
    whyItMatters: Trust is a core competitive axis, but public marketing pages are not enough to determine which platform is structurally stronger on compliance and governance.
    diligencePath: Request compliance packs, regulator correspondence summaries, warranty-claims data, and consumer-complaint dashboards for Carro and its closest peers.
    relatedQuestionRefs:
    - QP015
    relatedTableRefs:
    - TP003
  - type: access-blocked
    severity: material
    topic: carsome recent profitability progression
    missingEvidence: Full text of the retained Tech in Asia pages on Carsome's 2024 and 2025 EBITDA/profit milestones rather than JS-only shells.
    whyItMatters: The layoff evidence is clear, but the strongest public counter-evidence on Carsome's later profitability remains partially inaccessible in the retained pack, making trend interpretation incomplete.
    diligencePath: Re-fetch the Tech in Asia articles through a render-capable path or replace them with accessible audited, official, or Reuters-level evidence on Carsome's current profitability.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: online penetration of used-car transactions
    missingEvidence: A source-backed cross-country series showing what percentage of Southeast Asia used-car transactions actually complete online or through digital-first platforms.
    whyItMatters: Moat and market-share claims are easy to overstate when public pages show large listing counts but do not reveal how much of the category has truly shifted online.
    diligencePath: Obtain country-level channel-mix studies, platform transaction disclosures, or regulator or association data that separate online-originated used-car sales from overall vehicle turnover.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP001
