  - - Carsome
    - Access-blocked retained profit pages; no clean public platform fee card in retained pack
    - Integrated platform with offline expansion
    - Retail, inspection, ecosystem services
    - Current customer pricing, dealer subscription structure, and profitability by segment
    - Closest peer, but exact pricing remains a diligence ask
  - - OLXmobbi
    - Instant-sale and payment-speed promise; no published standardized fee table
    - Sell-car workflow centered on valuation, inspection, and payout
