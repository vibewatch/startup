  - - Mobil123
    - Indonesia listing incumbent
    - No public scale metric on retained page
    - Indonesian used and new car shoppers
    - Broad discovery marketplace and dealer content
    - Public page does not show full-stack retail, insurance, or aftersales ownership
  - - sgCarMart
    - Singapore listing incumbent
    - 'Self-described as Singapore''s #1 car platform'
    - Singapore buyers and dealers
    - Inventory, reviews, and financing hooks
    - Trust advantage may be local and discovery-led rather than vertically integrated
  - - Mudah
    - Malaysia status-quo marketplace
    - 87,042 car listings across 128 brands
    - Malaysia buyers and sellers
    - Large recommerce inventory pool and price discovery
    - High listings volume does not equal certification, finance, or warranty ownership
  - - Motorist
    - Adjacent ownership-services platform
    - 1.73M motorists served; $3B vehicle transactions; 3.3k certified partners
    - Drivers, sellers, and partner network
    - Ownership services, partner routing, and transaction facilitation
    - Adjacent model can intercept demand without replicating Carro end to end
  - - OEM-certified programs
    - Incumbent substitute
    - Multiple branded programs listed by Mordor; no single public regional metric
    - Brand-conscious used-car buyers
    - Certification, brand assurance, dealer service infrastructure
    - Less marketplace breadth and weaker cross-brand inventory choice
