- id: switching-costs-distribution-power-and-moat
  title: Switching Costs Are Moderate; Distribution Power And Incumbent Response Keep The Moat Fragile
  body: 'The retained evidence points to moderate, not extreme, switching costs. Buyer multi-homing looks easy because large inventory pools remain searchable across country-specific sites and broad recommerce marketplaces. Seller and dealer multi-homing also looks plausible because competitor pages emphasize dealer memberships, paying accounts, partner networks, and sales packages rather than exclusivity. Carro''s strongest switching-cost case only emerges when it bundles appraisal, wholesale liquidity, financing, insurance, and aftersales into one workflow. In other words, the moat is more operational than digital.


    That distinction matters because the adverse evidence is real. KR Asia describes the category as a tough business, Bloomberg reported Carsome layoffs undertaken to reach profit, and OLX''s strategic repositioning shows incumbents can respond aggressively with AI investment and acquisitions. Meanwhile, Asia-Pacific risk research highlights digital disruption and AI-related operating risk, which undercuts any simple software-moat story. Carro may still have the best chance of building a durable edge if its service attachment and underwriting engine compound. But the current public evidence supports only a moderate, execution-dependent moat, not a winner-take-most position insulated from multi-homing, commoditization, or incumbent retaliation.'
