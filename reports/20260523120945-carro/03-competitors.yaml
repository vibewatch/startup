    - Competes on convenience and certainty more than disclosed price transparency
  - - iCarAsia / Carlist
    - Lead-gen and dealer-network packaging implied; no single public rate card
    - Advertising, leads, and qualified inventory presentation
    - Traffic, dealer leads, inspected/warranty inventory
    - Dealer package pricing and conversion economics
    - Traffic moat can be strong even when unit economics are opaque
  - - One2car / sgCarMart / Mobil123 / Mudah
    - Vehicle prices, finance calculators, and dealer listings are public; platform contracts are not
    - Listings and dealer advertising with some financing hooks
    - Discovery, dealer packages, loan calculators, reviews
    - Dealer subscription terms, consumer fee policy, and bundle discounts
    - Listing alternatives compress consumer-acquisition pricing power
  - - Motorist
    - No public fee card on retained page
    - Partner-routed transaction and ownership services
    - Valuation, partner routing, financing, servicing, selling help
    - Take rate by service line
    - Adjacent platforms can monetize orchestration even without inventory ownership
  - - OEM-certified programs
    - Vehicle-level pricing visible at dealerships, not a standard marketplace fee card
    - Dealer retail with brand certification
    - Certification, brand assurance, dealer service
    - Regional margin structure and finance-attach economics
    - Strong substitute for trust-sensitive buyers despite limited transparency
