- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Potential moat claim
  - Threat or substitute
  - Severity
  - Why it could break
  - Evidence in retained pack
  - Mitigation or diligence ask
  rows:
  - - Traffic and discovery scale
    - Listing incumbents and recommerce marketplaces
    - high
    - Large search surfaces are visible across multiple sites and support buyer multi-homing
    - iCarAsia scale, Mudah listings, sgCarMart and country marketplaces
    - Underwrite exclusive supply and repeat attach rates, not traffic alone
  - - Instant-sale convenience
    - OLXmobbi and other appraisal-led flows
    - medium
    - Instant appraisal and payout are no longer unique workflow elements
    - OLXmobbi three-step instant-sale flow
    - Test conversion quality and resale margin, not just UX claims
  - - Integrated ecosystem breadth
    - Carsome copying the same full-stack playbook
    - high
    - Carsome is also moving offline and ecosystem-wide
    - KR Asia and DealStreetAsia on Carsome integration
    - Compare underwriting, refurbishment, and attach economics directly
  - - Capital and AI investment moat
    - OLX incumbent response
    - high
    - A profitable incumbent can spend on AI, product, and M&A
    - OLX profitability plus La Centrale acquisition
    - Track local dealer-tool adoption and any country-level OLX expansion
  - - Trust and certification wedge
    - OEM-certified programs and EV battery assurance
    - medium
    - Brand assurance and battery certification can pull high-intent buyers elsewhere
    - Mordor OEM-certified list and Motorist Thailand battery-certification thesis
    - Assess whether Carro can own trusted certification categories faster
  - - Software-driven moat narrative
    - Digital disruption and operating-risk shocks
    - medium
    - AI and software features can diffuse quickly while operations remain costly
    - IIA risk report plus Carsome layoffs and tough-market coverage
    - Value operational resilience and margin discipline over feature novelty
  notes: Severity reflects competitive risk to durability, not a forecast of market-share loss. The table emphasizes where the moat depends on execution rather than on static traffic leadership.
