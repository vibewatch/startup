- id: deployment-integrations-support-and-roadmap
  title: Deployment, Integrations, Support, and Roadmap
  body: |-
    Carro's deployment model is multi-market and operationally localized, but the retained pack shows it through country surfaces and partner announcements rather than a formal product-status page. The company officially claims seven markets, Japan has its own buy, sell, certified, and leasing presence, Malaysia's inherited myTukar footprint still includes inspection and refurbishment assets, and Indonesia's official blog markets certified inventory with warranty and dealer-network reach. Support is similarly visible through workflow surfaces instead of enterprise documentation: LEAP routes assistance and maintenance through the app, Carro Branch handles complaints and reports, and the vendor app manages documents, permits, and insurance reminders.

    What is less mature publicly is the roadmap and reliability surface. Late-2025 sources show a directional agenda — Japanese PHEV expansion, secure API-based financing integration, exploratory brand-new-car propositions, and an AI-driven buying experience — but none of those sources read like a dated engineering release calendar. Likewise, the operator-app listings and speed claims do not come with uptime, SLA, or incident data. That means deployment breadth is visible, and support touchpoints are visible, but service reliability and implementation depth remain largely private.
