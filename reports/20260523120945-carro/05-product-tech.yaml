  title: Product & Technology
  summary: Carro's retained public product evidence supports an operations-heavy automotive platform with real workflow control across buying, selling, subscription, inspection, refurbishment, financing, and operator tooling. The strongest proof is not a disclosed software stack but the combination of customer workflow promises, country surfaces, internal app listings, and facility-backed trust controls. The gap is that Carro discloses execution surfaces far better than technical architecture, security posture, reliability instrumentation, or patent scope, so product maturity is easier to verify than durable tech moat.
sections:
- id: product-surface-and-customer-workflow
  title: Product Surface and Customer Workflow
  body: |-
    Carro's product is best described as an integrated used-car commerce and ownership platform rather than a simple listing site. Official and independent sources support multiple customer-facing lanes: buy and sell used cars, attach financing and insurance, subscribe through LEAP, and stay inside the ecosystem for servicing and maintenance. Japan-facing pages add Carro Certified and leasing navigation, while TechCrunch and the company about page support the broader retail, wholesale, and fintech framing. That combination matters because the public evidence points to a product that monetizes through workflow control and service attachment, not just classifieds traffic.

    The workflow evidence is also unusually operational. McKinsey and The Straits Times describe contactless or salesperson-light buying, while Carro's AI-process release turns the sell-side promise into concrete time boxes: 15-minute response, 30-minute inspection, and payment in 24 hours. LEAP shows how subscription is delivered in practice: choose a car, collect or receive it, manage support in app, then swap or return. The product definition therefore starts with customer convenience, but it is fulfilled through inspection, logistics, financing, and after-sales execution behind the scenes.
