  evidenceGaps:
  - type: missing-source
    severity: material
    topic: architecture-gap
    missingEvidence: A public system diagram, API reference, or engineering documentation that explains the marketplace, inspection, and operator-app architecture.
    whyItMatters: Without architecture-level evidence, investors cannot judge whether Carro's software layer is differentiated, partner-dependent, or mostly operational glue around offline processes.
    diligencePath: Request architecture diagrams, integration docs, and engineering or product design reviews for marketplace, inspection, and operator-control systems.
    relatedQuestionRefs:
    - QE008
    - QE020
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: reliability-gap
    missingEvidence: Public uptime metrics, SLAs, status-page history, or incident disclosures for Carro's consumer and operator surfaces.
    whyItMatters: Workflow-speed claims are only trustworthy if the digital and operational surfaces are consistently available; retained sources do not show reliability instrumentation or service history.
    diligencePath: Request uptime dashboards, incident postmortems, support SLAs, and country-by-country service-operability metrics.
    relatedQuestionRefs:
    - QE011
    - QE027
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: ip-gap
    missingEvidence: Patent numbers, jurisdictions, claim scope, or internal technical documentation for the inspection technology described as patented.
    whyItMatters: Carro markets technology and inspection quality as differentiators, but the retained pack cannot separate true defensible IP from broad marketing language.
    diligencePath: Ask management for patent schedules, filing numbers, and a technical explanation of which inspection steps are proprietary and enforceable.
    relatedQuestionRefs:
    - QE018
    - QE019
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: security-gap
    missingEvidence: Any public security center, privacy center, audit report, or certification page covering the marketplace and operator apps.
    whyItMatters: Product trust and enterprise readiness are hard to underwrite when the only explicit privacy signal is one Google Play data-safety disclosure for an inspection-admin app.
    diligencePath: Request SOC 2 or ISO materials, privacy-program artifacts, app data-flow documentation, and internal control ownership for Carro's digital surfaces.
    relatedQuestionRefs:
    - QE016
    - QE017
    - QE024
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: ev-trust-gap
    missingEvidence: Evidence that Carro has a disclosed EV battery-health diagnostic or certification workflow for used EV inventory.
    whyItMatters: As Southeast Asian buyers shift toward EVs, battery-health transparency becomes a core trust, financing, and resale input rather than a niche add-on.
    diligencePath: Ask for any EV-inspection SOPs, battery-health scoring, lab or partner tooling, and country rollout plans for EV certification.
    relatedQuestionRefs:
    - QE023
    - QE027
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: roadmap-gap
    missingEvidence: A dated release or rollout calendar that distinguishes live capabilities from pilot, planned, or exploratory initiatives.
    whyItMatters: Roadmap claims about AI-driven buying, Japanese PHEVs, and brand-new-car propositions are directionally useful but too vague for execution underwriting.
    diligencePath: Request a product roadmap by country with launch dates, owner teams, dependencies, and adoption or readiness metrics.
    relatedQuestionRefs:
    - QE012
    - QE025
    relatedTableRefs:
    - TE005
