- id: module-map-and-operating-architecture
  title: Module Map and Operating Architecture
  body: |-
    Public evidence does not expose Carro's software architecture in code-level detail, so the right chapter construct is an operating architecture rather than a system diagram. The visible layers are clear enough: customer and dealer entry surfaces, pricing and AI decision support, inspections and refurbishment, financing and insurance attachment, and a set of operator apps that govern approvals, pricing, settlements, and vendor compliance. The Google Play listings are especially helpful because they show internal-control surfaces that a normal marketing site would not: branch managers can configure pricing and handle complaints, while vendor operators can track trips, permits, insurance, payouts, and vehicle utilization.

    This architecture is also deeply physical. BusinessToday and AutoBuzz tie product quality to inspection centres, workshops, and refurbishment sites, while TechCrunch and Carro's own surfaces tie value capture to financing, insurance, dealer liquidity, and lifecycle services. The dependency map is therefore hybrid by design: part marketplace software, part operational control plane, and part country-specific facility network. The missing piece is the technical detail behind that stack. No retained source gives an API reference, software diagram, or integration catalog beyond the SY Holdings announcement, so the moat cannot yet be underwritten as a disclosed software platform.
