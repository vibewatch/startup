- id: product-tech-verdict-and-risks
  title: Product-Tech Verdict and Risks
  body: |-
    The retained evidence is strong enough to say Carro has a real product and operating stack, not just a marketing narrative. It clearly spans digital buying and selling, subscription, financing and insurance attach, inspection and refurbishment, localized country surfaces, and internal apps that govern branch and vendor workflows. That is a more robust product picture than most consumer marketplaces disclose publicly, and it explains why management keeps describing Carro as an automotive platform.

    The problem is that the public pack proves execution surfaces better than it proves technology defensibility. The biggest risks are architecture opacity, dependency on facilities and partner integrations, thin public reliability evidence, missing security or privacy-program artifacts, and roadmap claims that are strategic rather than release-grade. EV battery trust is another forward-looking risk because it will likely become a product requirement for used-car platforms, yet the retained pack does not show a disclosed battery-health capability. Investors can therefore underwrite Carro as an operations-heavy tech-enabled marketplace with real workflow control, but not yet as a transparently documented software moat with public-grade security and reliability disclosures.
