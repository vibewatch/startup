  - - LEAP subscription / leasing
    - Consumers
    - Live in Singapore; referenced in Japan surface
    - App-managed subscription flow offers flexible ownership and support
    - No public utilization, residual-value, or country-level penetration data
  - - Branch administration app
    - Administrators and branch managers
    - Live public app listing
    - Pricing, approvals, settlements, complaints, and analytics imply an internal control plane
    - The exact link between this app and core marketplace transactions is not disclosed
  - - Vendor / fleet operator app
    - Fleet owners, taxi operators, vendors
    - Live public app listing
    - Trip, payout, permit, and insurance controls indicate operational tooling beyond a brochure site
    - Public sources do not explain whether this surface is core Carro, adjacent mobility, or both
  - - Physical centre network
    - Inspection, refurbishment, and aftersales teams
    - Live in Malaysia and referenced across four markets
    - Inspection centres, workshops, and refurbishment sites create a physical quality moat
    - No public throughput, utilization, or economics by site
  - - Localized country surfaces
    - Japan, Indonesia, and Malaysia users
    - Live but unevenly documented
    - Japan shows certified and leasing navigation; Indonesia shows warranty copy; Malaysia shows facility scale
    - Localization depth in the rest of Carro's markets is not publicly described
