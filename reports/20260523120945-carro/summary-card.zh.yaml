summary:
  headline: Carro 是有规模的东南亚汽车平台，盈利改善清晰且 IPO 可选项可信；但资本结构不透明、客户 / 单位经济披露缺失、估值讨论传闻偏多，使围绕 US$3.0 billion 锚点的风险收益仍只能落在观察区间。
