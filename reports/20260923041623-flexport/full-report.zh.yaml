      - number: '5.3'
        title: CSRD 碳模块与差异化竞争壁垒
        blocks:
          - type: paragraph
            body: >
              Flexport 打造的 CSRD 碳排放核算模块代表了极具技术含金量的护城河，成功将日常物流底层流水与标准化 Scope 3 排放精准测算高度融合。


              核心测算方法学：Flexport 针对 Scope 3 第 4 类（上游运输与分销）碳排放的计量，巧妙揉合了多源数据输入：(a) 承运商端第一手直连碳排实测数据（最优数据源，来自签约加入 Clean Cargo
              碳排放披露项目的 50 多家承运巨头）；(b) 在承运商原始数据缺失的情形下，采用船舶能效硬性评级（海运船舶 EEDI/AER 认证）叠加航速油耗推演模型；(c) 针对公路车队与铁路运输采用 IPCC
              权威交通碳排放因子折算。


              CSRD 监管合规就绪：Flexport 碳审计组件遵循欧盟《企业可持续发展报告指令》（CSRD）的合规门槛开发。CSRD 要求涉规欧盟企业自 FY2024（涵盖大型头部企业）及
              FY2025（涵盖中型企业）起，强制完整核算并申报供应链 Scope 3 物流碳排。该模块可直接导出一键交付的 CSRD 专属合规审计报表，并内嵌欧盟监管核验所需的完整数据审计轨迹与方法学合规凭证。


              防御壁垒护城河：依托在 2 年多商业运转中持续汇聚的 500
              多家托运人全量实操数据库，系统演化出了自驱的数据飞轮——托运人间横向基准对标、细分航线碳排放强度基准线以及各承运商绿色能效比对矩阵随数据规模几何级提质。竞对若从零入局极难在短时间内复刻出同等量级的数据资产，且伴随
              CSRD 欧盟监管执法力度的收紧，该资产的商用溢价还将持续扩大。


              产品演进规划：Flexport 公开披露的产研演进计划（2025-2026 年）涵盖：(a) 将 CSRD 测算边界延伸覆盖至 Scope 3 第 9 类（下游运输与分销）；(b) 与
              Watershed、Persefoni 等主流第三方 ESG 报告管理系统打通数据接口；(c) 交付满足 CSRD 审计穿透标准的专用 API，将 Flexport
              碳排数据底座无缝连通客户内部的可持续发展申报管理中枢。
