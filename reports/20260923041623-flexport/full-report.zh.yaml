      - number: '2.3'
        title: 增长驱动因素与采用阻力
        blocks:
          - type: paragraph
            body: >
              核心增长驱动因素：

              (1) 跨境电商贸易增长：全球跨境电商年增速达 20-25%，推动了小包裹及拼箱（LCL）货代需求爆发，这正是 Flexport 的核心战略靶心。

              (2) 供应链韧性建设投资：疫情后，托运人加大针对物流可视化与备选路线的投入，以减轻断链风险暴露。

              (3) CSRD / ESG Scope 3 披露要求：欧盟 CSRD 规则强制要求披露 Scope 3 供应链碳排放，催生了对具备碳足迹数据能力的货运平台需求。

              (4) 近岸外包与友岸外包演进：美墨贸易繁荣及近岸化布局，持续刺激对美国跨境物流平台的服务需求。


              核心采用阻力：

              (1) 传统巨头客户黏性：DSV、Kuehne+Nagel、Maersk 拥有数十年积累的货主关系、规模化运力折扣与全球服务网络深度，数字平台短期内难以完全复制。

              (2) 供应商切换成本：已搭建定制化货运方案、EDI 系统直连及专属承运商合约的成熟托运人，面临显著的系统迁移摩擦。

              (3) 信任背书门槛：大型企业托运人普遍风险厌恶；Flexport 规模化调度复杂、高货值货运的能力仍在积累实证。

              Flexport 面临的盈利挑战进一步加剧了获客阻力：掌控上亿美元年货运预算的大型货主，在将核心主力航线托付给一家尚未盈利的货代前，通常需要多年的服务持续性保障。传统巨头在竞标中频繁抓住这一点，将
              Flexport 对外部融资的依赖渲染为服务中断风险。


              2025 年美国关税环境带来了双向效应：对中国及全球进口商品加征更高关税提升了报关合规的复杂度（利好 Flexport
              的报关代理营收），但也压低了受波及航线的货运物理吞吐量（利空以货运周转量计费的业务收入）。整体净效应大致呈中性，具体走势取决于 Flexport 的航线货源构成与客户贸易路线变迁。
