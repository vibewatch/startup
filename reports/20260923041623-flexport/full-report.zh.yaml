        - 若无分部损益披露，无法评估盈利路径或细分业务单体经济模型
        - 公司——正式数据室
      - - 完整股权结构表（Cap Table）及可转债条款
        - 缺少完整股权结构表则无法明确稀释比例与清算优先权负担；可转债转股机制未予披露
        - 公司——正式数据室
      - - 大客户集中度（前 10 大客户营收占比）
        - 客户集中度风险未知；前 10 大客户可能占货代营收的 40-60%
        - 公司——正式数据室
      - - 分业务板块的客户净金额留存率（NRR）与客户数流失率
        - 留存率是关键的单体经济指标；目前未见公开数据
        - 公司——正式数据室
      - - Shopify 合作协议（期限、独家性、终止权）
        - 若不了解商业条款，无法评估该分销渠道的可持续性
        - 公司——正式数据室
      - - Flexport Capital 应收账款逾期率及授信额度条款
        - 缺少应收账款资产质量数据，信用风险与资本充足度无从得知
        - 公司——正式数据室
      - - 2023-2024 年平台稳定性事故记录
        - 缺少运行时间与故障数据，无法验证重组后的改善效果
        - 公司——工程团队
      - - 客户访谈（3 家以上大型企业客户、3 家以上 Shopify 商家）
        - 缺少一线客户反馈，无法评估 NPS 与客户流失风险
        - 公司——客户背调访谈
    coverage: partial
    notes: null
    claimRefs:
      - CV011
      - CV012
