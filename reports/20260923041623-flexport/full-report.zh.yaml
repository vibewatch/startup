      - number: '6.2'
        title: 客户采纳与续约留存证据
        blocks:
          - type: paragraph
            body: >
              受制于非上市私营企业的披露限制，Flexport 展现的采纳证据主要停留在定性与分销渠道宏观层面，欠缺可量化的精细分群留存指标。


              最显著的业务验证信号：

              (1) 斩获 Shopify 首选全球物流合作伙伴认证（2023 年 11 月）：Shopify 钦定 Flexport 为其跨境物流首选服务商，把 Flexport 的跨境货代网络深度嵌入 Shopify
              商家操作链路。这是在平台生态层面，对 Flexport 匹配中小微电商客群能力的最强验证。


              (2) 2024 年营收强劲反弹至 $2.1B：相较 2023 年水平回升 31%，表明要么是客户数增长，要么是单客平均货运吞吐量提升，亦或二者兼有；但在缺乏单客披露数据的口径下，尚难拆解具体拉动贡献。


              (3) 报关代理服务高黏性附着：Flexport 跻身全美最大报关量服务商阵营（报关代理年创收估计达 $200-300M），印证其背后维系着数以千计定期报关纳税的高频活跃进口商客户盘子。


              客户留存维度的信息真空：

              Flexport 从未公开披露 NRR（净金额留存率）、GRR（毛金额留存率）、Logo
              流失率或按年份划分的队列留存曲线。评估留存的主要替代观测标的，在于整体货代业务营收的平稳度，但该指标受物理货运周转量波动制约，而非稳定的 SaaS 订阅现金流。企业级大客户的稳定性，主要依靠多年期运价服务协议及
              ERP 系统打通带来的高切换成本反向推断。


              客户集中度潜在隐患：

              公司无公开披露单一大客户对营收的贡献浓度；对照标准 B2B 企业风险模型，排名前 20 位的大型企业货主大概率贡献了整体货代营收的 40-60%。Shopify 渠道虽然导入了大量小微商家分散了客户结构，但与
              Shopify 平台本身的单一捆绑关系，在渠道源头构成了极高的单一集中度风险。
