          - type: callout
            title: 估值从 $8B 回落至 $3.8B，反映领导层动荡与盈利未达预期
            body: >-
              估值从 2022 年的 $8B 跌至 2024 年的约 $3.8B，跌幅达 53%，体现了 Dave Clark 任内激进扩招和未能达成盈利目标的后果。领导权切回 Ryan Petersen
              后业务重归平稳，但估值下调印证了数字货代比投资人在 2021-2022 年预期的更具周期性，也更消耗资本。
