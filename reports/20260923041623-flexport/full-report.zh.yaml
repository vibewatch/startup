        - id: n2
          label: 货代业务收入萎缩
          detail: Flexport 约 78% 的收入与运价直接挂钩
          type: process
        - id: n3
          label: 盈利节点推迟
          detail: EBITDA 盈亏平衡目标推迟 12-24 个月
          type: process
        - id: n4
          label: Flexport Capital 贷款违约
          detail: 进口商现金流恶化；应收账款违约攀升
          type: process
        - id: n5
          label: 估值下调融资（Down-round）
          detail: 需要在低于当前预估 38 亿美元估值下募集资金
          type: process
        - id: n6
          label: 投资者信心动摇
          detail: 估值下调坐实估值缩水；陷入信任与信誉下滑螺旋
          type: process
        - id: n7
          label: 核心人才流失风险
          detail: 股权稀释；士气受挫；核心工程人员离职
          type: output
        - id: n8
          label: 大型客户流失风险
          detail: 对服务连续性的疑虑加速大客户倒向传统货代
          type: output
      edges:
        - from: n1
          to: n2
          label: 营收直接挂钩
        - from: n2
          to: n3
          label: 营收低于盈亏平衡线
        - from: n2
          to: n4
          label: 资本业务顺周期风险
        - from: n3
          to: n5
          label: 资金跑道耗尽
        - from: n4
          to: n5
          label: 资金损失与现金消耗
        - from: n5
          to: n6
          label: 估值下调融资公告
        - from: n6
          to: n7
          label: 股权价值缩水
        - from: n6
          to: n8
          label: 持续经营引发担忧
    approximationNotes: 示意性风险传导链；实际传导效果取决于货运市场恶化的严峻程度与出现时点。
    claimRefs:
      - CR005
      - CR013
      - CR015
  - id: FR003
    title: 外部依赖图谱
    type: kpi
    summary: |
      Flexport 的核心外部依赖及其风险评估。
    data:
      items:
        - label: Shopify（中小企业分发）
          value: Critical / Low probability of loss
          note: 首选合作伙伴；深度集成；商业合作活跃；但构成中小企业拓展渠道的单点脆弱性
        - label: a16z / 投资人财团（资本）
          value: Critical / Low probability of default
          note: 2025 年 8 月内部轮融资表明支持持续；但未盈利阶段的资本依赖属于结构性问题
        - label: AWS（基础设施）
          value: High / Very low probability
          note: 多区域部署降低了风险；以 Flexport 当前体量缺乏现实可行的替代品
        - label: CBP 牌照（监管合规）
          value: Critical / Very low probability
          note: 拥有主动合规体系；维护良好；牌照吊销将造成灭顶之灾
        - label: 海运承运人（运力费率获取）
          value: Medium / Structural disadvantage
          note: Flexport 无法掌控承运人运价；相较于传统巨头的批量折扣差距是长期的运价风险
        - label: Clean Cargo 数据（CSRD 报告质量）
          value: Medium / Low probability
          note: 拥有工作组会员资格；非独家专有；可调取 50+ 家承运人数据；具备承运人直接数据备选方案
    approximationNotes: null
    claimRefs:
      - CR007
      - CR008
      - CR016
  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: |
      决策树展现 Flexport 在 38 亿美元估值下维持“跟踪观察”（TRACK）评级的内在逻辑——需要出现何种变化才会上调至“买入”（BUY）。
    data:
      nodes:
        - id: n1
          label: Flexport 当前：预估约 38 亿美元
          detail: 2025 年 8 月内部股权轮；对应 2024 年预测营收的 1.8 倍
          type: input
        - id: n2
          label: 是否尚未实现盈利？
          detail: 是——EBITDA 目标为 2025 年末至 2026 年初
          type: process
        - id: n3
          label: 运价周期风险是否偏高？
          detail: 是——悲观情景发生概率为 35%；运价波动剧烈
          type: process
        - id: n4
          label: Shopify 渠道是否稳固持久？
          detail: 未知——商业条款未公开披露；Shopify 曾有关闭 SFN 的先例
          type: process
        - id: n5
          label: 38 亿美元估值下维持 TRACK
          detail: 商业模式良好但估值偏紧；静待盈利确证或更佳进场时机
          type: process
        - id: n6
          label: 25 亿-30 亿美元时 BUY
          detail: 若入场估值回调则风险收益比更具吸引力；可通过二级市场或估值下调轮参与
          type: output
        - id: n7
          label: 38 亿美元及以上 BUY 的条件：
          detail: EBITDA 盈亏平衡获证实 + 货运市场企稳 + Shopify 转化规模化起量
          type: output
      edges:
        - from: n1
          to: n2
          label: 检验盈利能力
        - from: n2
          to: n3
          label: 是 → 评估周期风险
        - from: n3
          to: n4
          label: 是 → 评估渠道稳定性
        - from: n4
          to: n5
          label: 尚不明确 → 维持 TRACK
        - from: n5
          to: n6
          label: 若估值回调
        - from: n5
          to: n7
          label: 若投资逻辑验证
    approximationNotes: null
    claimRefs:
      - CV001
      - CV013
  - id: FV002
    title: 估值敏感性分析
    type: bar
    summary: |
      Flexport 在不同市销率情景与营收水平下的估值敏感性分析。
    data:
      items:
        - label: 1.0 倍 2024E 营收（21 亿美元）
          value: 2100
          note: 估值下限倍数——低于传统对标企业估值乘数；属于困境资产定价
        - label: 1.4 倍市销率（目标买点）
          value: 2940
          note: 风险收益比更优的目标进场估值；较当前低 1 个倍数；二级市场买入点
        - label: 1.8 倍市销率（当前预估 38 亿美元）
          value: 3780
          note: 当前估算估值——偏高（STRETCHED）；包含高于传统巨头倍数的未盈利溢价
        - label: 2.5 倍市销率（实现盈利后目标）
          value: 5250
          note: 若证实 EBITDA 利润率达到 8%+ 则具备合理性；符合盈利数字化货代的估值溢价
        - label: 3.5 倍市销率（乐观预期：软件占比提升）
          value: 7350
          note: 乐观情景：FMP SaaS 收入占比超过 15%；EBITDA 达 12%+；包含战略收购溢价
        - label: Expeditors 对标（1.8 倍，已盈利）
          value: 3780
          note: 与 Expeditors 估值乘数相同但后者已实现盈利——凸显当前估值偏高状态
    approximationNotes: 估值倍数基于约 21 亿美元 2024E 营收预测推算。Expeditors 作为公开市场对标参照。
    claimRefs:
      - CV007
      - CV014
  - id: FV003
    title: 估值 / 回报区间
    type: range
    summary: |
      基于 $3.8B 入场估值，在乐观、基准与悲观情景下的预期退出估值区间。
    data:
      items:
        - label: 乐观情景退出（2027）
          low: 7000
          base: 7500
          high: 8000
          note: 自 $3.8B 入场点获得 1.8-2.1 倍回报；行情顶峰期战略收购或 IPO 退出
        - label: 基准情景退出（2027-2028）
          low: 5000
          base: 5500
          high: 6000
          note: 自 $3.8B 入场点获得 1.3-1.6 倍回报；达成盈利；IPO 或战略收购退出
        - label: 悲观情景退出（2026-2027）
          low: 2000
          base: 2500
          high: 3000
          note: 自 $3.8B 入场点获得 0.5-0.8 倍回报；遭遇降价轮；盈利推迟；被迫出售
        - label: 降价轮入场机会
          low: 2000
          base: 2750
          high: 3000
          note: 更佳入场估值区间；对应 1.0-1.4 倍收入；该入场点对应的基准情景回报为 1.8-2.0 倍
    approximationNotes: 情景区间为定性估算。所有数值单位均为百万美元。
    claimRefs:
      - CV005
      - CV015
  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: |
      跟踪 Flexport 投资逻辑需重点监测的核心指标。
    data:
      items:
        - label: 当前估值
          value: ~$3.8B (Aug 2025 est.)
          note: 对应 2024E 收入的 1.8 倍；较 2022 年 $8B 峰值回落 52%
        - label: 收入（2024E）
          value: ~$2.1B
          note: 较 2023 年约 $1.6B 同比增长约 30%；受益于货运市场复苏顺风
        - label: 收入增长率
          value: ~30% YoY (2024E)
          note: 目标保持 20%+ 持续增长，以支撑相对传统巨头的估值溢价
        - label: EBITDA 目标
          value: Breakeven end-2025 to early-2026
          note: 截至报告运行基准日尚未确认；此为投资逻辑的关键里程碑
        - label: 累计融资总额
          value: ~$2.3B+
          note: $260M 可转债（2024 年 1 月）+ $250M 股权融资（2025 年 8 月）+ 早期轮次
        - label: 现金跑道测算
          value: 18-24 months from Q4 2025
          note: 必须在下轮融资前达成盈利，否则将面临稀释性降价轮
        - label: 可比公司倍数区间
          value: 0.6-1.8x revenue
          note: KN 1.1x（盈利）、DSV 1.6x（整合 Schenker）、Expeditors 1.8x（盈利）
        - label: 投资建议
          value: TRACK — not buy at $3.8B
          note: 更佳入场区间为 $2.5-3.0B；触发条件：EBITDA 确认 + 货运市场企稳
    approximationNotes: null
    claimRefs:
      - CV001
      - CV016
