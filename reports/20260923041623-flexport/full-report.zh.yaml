      - number: '2.2'
        title: 市场空间测算：TAM、SAM、SOM
        blocks:
          - type: paragraph
            body: >
              TAM——潜在市场总额：全球货运代理市场以货代营收计约为 $200-250B（2024 年估计，来源 Gartner / Transport
              Intelligence）。覆盖全球各区域的海运、空运、卡车、铁路和报关业务。若 Flexport 能在全球货代市场夺得可观份额，其营收拓展潜力极其广阔。


              SAM——可服务市场规模：Flexport 的 SAM 受到一定约束——界定为以美国为起运地或目的地的国际货代业务，外加全球范围内的数字原生托运人群体。估计 SAM 规模为 $30-50B（约占全球 TAM 的
              15-20%），重心偏向美国进出口航线（如美中航线、跨大西洋航线），Flexport 在这些航线具备深厚运营底蕴并持有完备的报关牌照。


              SOM——可获取市场规模：凭借 2024 年约 $2.1B 的营收，Flexport 已经获取其 SAM 中约 4-7% 的份额。近中期 SOM（3-5 年）：若营收增至 $4-6B，相当于实现 8-12% 的
              SAM 渗透率——目标切实可行，但必须持续从传统巨头手中争夺市场份额。Shopify 分销渠道是拓展 SOM 的首要抓手。


              多种测算模型结果趋于一致：（a）Gartner 测算：数字货运规模将由 $4.5B 扩张至 2028 年的 $12B；（b）Transport Intelligence 测算：货代大盘规模将由 $200B 以
              3-4% 的复合年均增长率增至 2028 年的 $260B；（c）McKinsey 测算：至 2030 年，数字化颠覆可能推动整个货代行业 25-35% 的营收流向数字运营商；（d）FreightWaves
              测算：Flexport 当前占据全球货代市场 1-2%，5 年期目标为夺得 3-5%。
