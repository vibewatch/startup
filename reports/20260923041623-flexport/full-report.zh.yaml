      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 观察而非在 $3.8B 买入：该估值面对悲观情景没有安全边际
            body: >-
              在 $3.8B（2024E 收入 1.8x）估值下，Flexport 的下行情景——即运价下行迫使其以 $2-3B 降轮退出——仅产生 0.5-0.8x 回报，相当于亏损
              20-50%。对于一家尚未实现盈利、渠道高度集中且对货运周期高度敏感的公司，这一风险回报比不可接受。更佳的切入点（$2.5-3.0B，对应收入 1.2-1.4x）将在悲观情景下至少保本，并在基准情景下提供
              1.8-2.0x 回报。讲求投资纪律的投资人应当观察 Flexport 跨越盈利里程碑的进展，待其首个 EBITDA 转正季度得到证实后再行重估。
            calloutType: insight
            claimRefs:
              - CV001
              - CV005
          - type: callout
            title: 可转债悬顶是现有股权持有人的隐性风险
            body: >-
              2024 年 1 月发行的 $260M 可转债，其转股机制（估值上限、折扣率、利息）未见公开披露。若 Flexport
              在下行情景中需要额外资本，该可转债将按更低估值折价转股——进一步加剧现有优先股股东的稀释。可转债稀释叠加清算优先权与优先股堆叠（$2.3B+），意味着普通股持有人（员工、早期天使投资人）在退出金额低于 $6-7B
              时几乎无法参与收益分配。任何计划在 $3.8B 估值进入的投资人，在签署出资承诺前均应要求完整披露股权结构表。
            calloutType: insight
            claimRefs:
              - CV009
              - CV017
