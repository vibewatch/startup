  - number: 6
    title: 客户群体
    sections:
      - number: '6.1'
        title: 客户基础与客群分层
        blocks:
          - type: paragraph
            body: >
              Flexport 的客户结构划分为三个客群，各客群在获客触点、产品契合度与留存行为特征上各不相同。


              客群 1——大型企业与中端市场进口商：

              这是构筑 Flexport 业务基石的客群——将工业制成品从亚洲（以中国、越南、印度为主）进口至美国和欧盟的企业。涵盖年进口物流支出在 $5M-$100M 的中型货主，乃至年运费开支超过 $100M
              的巨型跨国客户。企业级货主通常在多条主力航线上托付 Flexport，并同步捆绑报关代理、FMP 软件，乃至选用 Flexport Capital 金融服务。


              标杆企业画像：Flexport 披露过的客户群体囊括消费电子、鞋服时尚、运动户外及工业机械装备领域的数十亿美元级跨国进口商——但由于行业竞争敏感，Flexport 极少主动公开具体的客户名单。2023 年 11
              月与 Shopify 达成的战略合作公告，明确确立了 Shopify 本身亦是 Flexport 的重要客群。


              客群 2——中小电商卖家（依托 Shopify 获客）：

              Shopify 旗下 175 万商家代表了极具爆发力的获客增长池。Shopify 的深度集成让小微卖家能够直接在 Shopify
              店铺后台一键预订国际跨境物流（主要是中美干线货运）。虽然转化率未公开披露，但据行业分析师测算，截至 2024 年，约有 1-3% 的 Shopify 商家已成为 Flexport 货代服务的活跃货主。


              客群 3——B2B 物流运营商与开放 API 伙伴：

              第三方物流集成商（3PL）、履约仓配服务商及平台型企业通过接入 Flexport Logistics
              API，将跨国货代底层能力无缝包装进自研产品中。该客群目前尚处培育阶段，但蕴含着释放平台级营收扩张潜能的战略价值。
