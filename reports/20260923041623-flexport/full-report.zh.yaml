  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >
              Flexport 处于两个市场的交汇点：（1）全球货运代理——托运人与承运商之间规模达 $200-250B 的中介服务层；（2）供应链软件与可视化——用于追踪、分析与规划的 $15-25B 软件市场。


              全球货运代理涵盖完整物流价值链：海运货代（约占营收 60%）、空运（约 25%）、卡车运输与短驳（约 10%）、报关代理（约
              5%）以及增值辅助服务。货代企业通过承运商费率与向托运人收费之间的差价（价差）加收服务费获取收益。全球货运代理行业每年承载约 $10-12T 的进出口贸易货值，货代企业抽取 1-3% 作为服务费用。


              Flexport 的核心目标市场剔除了以下领域：（a）自建物流团队并直接签约承运商的超大型企业（即绕开货代企业的 $5B+ 进口巨头）；（b）纯美国本土国内卡车运输（Flexport
              聚焦跨国业务）；（c）快递与小包裹网络（DHL、FedEx、UPS 等，属不同产品形态）；（d）合同物流（仓储与履约——尽管收购 Shopify Logistics 后业务产生部分重合）。


              数字货代细分赛道是最直接相关的增长市场：2024 年估计规模为 $4.5-6B，预计到 2028-2030 年将以 18-24% 的复合年均增长率增至
              $12-18B。该细分赛道由技术驱动型运营商主导，以集成实时可视化、自动化报关及数据分析的数字平台，替代传统传真与电话驱动的经纪业务模式，这正是 Flexport 的核心价值主张。
