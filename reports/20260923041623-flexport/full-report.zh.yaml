      - number: '6.4'
        title: 资料卡
        blocks:
          - type: callout
            title: 与 Shopify 的战略绑定是客户认可的最强底牌，亦是首屈一指的单一渠道集中度风险
            body: >-
              荣获 Shopify 首选物流合作伙伴背书，既是 Flexport 商业验证中最具含金量的标杆背书，亦暴露出最大的单一渠道依赖风险。175
              万商户的生态大盘极大地重构了中小企业获客逻辑，但整个小微业务板块的命脉均系于这一单点合作之上。Shopify 在自建物流战略上的任何风吹草动，都可能在瞬息之间摧毁小微电商这一核心增长动力源。
            calloutType: insight
            claimRefs:
              - CU007
              - CU012
          - type: callout
            title: Flexport 在大型企业客户层面的实证严重匮乏，公开客户名录透明度明显落后于行业平均水准
            body: >-
              作为一家年营收跨越 $2.1B 门槛的准独角兽，Flexport 极度匮乏公开可查的标杆企业客户名单，信息披露水准显著滞后于行业标杆。反观 project44
              等对标厂商频繁公示标杆客户案例与实名背书；Flexport 的回避或许源于商业竞争保密、保密协议（NDA）限制或客户意愿，但这无疑给审视其客群质地与集中度风险的投资人留下了巨大的尽职调查盲区。
            calloutType: insight
            claimRefs:
