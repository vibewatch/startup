      - number: '7.2'
        title: 运营与技术风险
        blocks:
          - type: paragraph
            body: >
              Flexport 运营风险状况在 2023 年重组后有所好转，但仍存数项残留脆弱点。


              平台可靠性：2022
              年第四季度节假日货运旺季出现的平台可靠性危机，仍属最重大的运营风险先例。重组后工程研发投入虽将可靠性置于新功能之上，但关于可靠性指标改善情况尚无独立验证。若未来旺季重现同类事件，可能加速企业级客户流失。


              技术债务：2022 年超高速扩张期的工程研发在平台内部留下了技术债务。公司虽在系统性清理，但可能尚未完全解决。随着新功能（如 CSRD Category 9、Shopify
              Capital）上线，残留技术债务加大了系统集成故障的发生概率。


              网络与贸易数据安全：Flexport 负责处理高度敏感的贸易数据（包括报关单据、纳税义务、财务发票）。SecurityScorecard 评出的 B
              级外部安全评级显示仍有改进空间。一旦发生涉及报关单或贸易融资数据的重大数据泄露，可能使 Flexport 面临 GDPR 处罚、CBP 合规审查及企业级客户流失。


              报关合规风险：作为持有 CBP 牌照的报关行，Flexport 须接受 CBP 合规审计。基于机器学习的 HTS 归类引擎天然具有误归类风险——HTS 错误可能导致 Flexport
              托运客户承担少缴关税的法律责任，并危及 Flexport 报关牌照声誉。301 条款关税归类的复杂性在 2025 年显著推高了这一风险。
