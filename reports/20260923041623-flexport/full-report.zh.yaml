      - number: '1.4'
        title: 资料卡
        blocks:
          - type: callout
            title: Flexport 是获得风险资本押注最多的数字货代：累计融资 $2.3B
            body: >-
              Flexport 累计融资约 $2.3B，是全球资金储备最充裕的数字物流创业公司之一。2022 年 $8B 的峰值估值反映了市场对供应链数字化的极度乐观；回落至约 $3.8B 则体现了盈利挑战，但投资人通过
              2024 年 $260M 可转债及 2025 年 $250M 股权轮持续加注，表明信心仍在。
            calloutType: insight
