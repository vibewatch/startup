              - CE010
              - CE012
          - type: callout
            title: 平台历史上出现的可用性波动，是阻碍大型企业客户规模化采买的核心技术隐患
            body: >-
              Flexport 平台在 2022 年 Q4 年终出货高峰期出现的严重可靠性事故，直接加剧了企业级核心货主的不满情绪，进而诱发了随后的组织重组。大型跨国托运人对承运系统的稳定性容忍阈值极高；若 2022
              年式的瘫痪事故卷土重来，将重创品牌商誉，并加速大型客户集体倒流回履约记录经受过时间考验的传统货代巨头阵营。
