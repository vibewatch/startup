  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与客户业务流整合
        blocks:
          - type: paragraph
            body: >
              Flexport 的产品矩阵专为赋能跨境全链路物流工作流打造：无缝串联下单发运、海空运舱位预订、源头提货、口岸清关、末端派送及发货后数据复盘。


              核心功能模块：

              (1) 海运货代：具备承运商智能筛选、运价横向比对及集装箱实时动态追踪的数字订舱系统。通过 API 和 EDI 与 30 多家主流海运船司无缝打通。Flexport
              系统为单票货物提供全节点颗粒度的在途可视化（离港开航、抵港靠泊、海关放行、交接签收）。


              (2) 空运货代：集成航空运单（AWB）电子化流转、航司比价及基于航空公司 API 的动态实时跟踪。Flexport 为常规主流干线提供具备运价竞争力的空运报价，并支持当日即时订舱锁定。


              (3) 报关代理服务（持有美国 CBP 执照）：基于机器学习规则引擎实现 HTS 编码自动归类；一键自动生成并申报 CBP 3461、3461 Alt 和 7512 等报关单证；追踪关税退税；深度推演
              Section 301/232/201 特殊关税税率。


              (4) 陆运卡车与铁路中转（短驳与内陆集运）：Flexport 构建了整合港口集疏运短驳、区域分拨越库及铁路多式联运的运力协作网络。车队调度采用轻资产协作形态（运力网络化聚合模式）；铁路运力则依托战略合作接入。


              (5) Flexport Management Platform（FMP）：供应链全局可视化 SaaS。核心组件涵盖：

              - 货物跟踪仪：依托承运商 API 专线实时刷新运输节点

              - 碳排审计报表：测算 Scope 3 物流碳排（遵循 EN 16258 与 GHG Protocol 国际准则）

              - 商业智能分析：深度解析定制化货运支出分布与各供应商发运履约交付周期

              - 单据智能管理：自动生成电子提单（BOL）、报关表格及商业发票


              (6) Flexport Capital：深度嵌入 FMP 与货代交易链条的原生贸易融资产品。托运人可在 Flexport
              系统内直接发起信贷授信申请；后台算法直接调用货主历史货运流水作为核心风控风评指标，实现自动化审批放款。
