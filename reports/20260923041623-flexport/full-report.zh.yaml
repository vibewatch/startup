      - number: '1.2'
        title: 商业模式与营收来源
        blocks:
          - type: paragraph
            body: >
              Flexport
              的核心业务是货运代理：在托运人与承运商（船运公司、航空公司、卡车公司）之间充当中介，管理从工厂到目的地的整条物流链。营收来自货运价差（承运商费率与向客户收取费率之间的差额）、报关代理费、仓储及附加服务。


              核心营收来源：

              1. 海运货代——货量最大；覆盖全球海运航线

              2. 空运货代——高时效溢价服务；随电商空运扩张而增长

              3. 卡车运输与短驳——美国国内与跨境

              4. 报关代理——持牌进口申报方；覆盖美国及国际

              5. Flexport Capital（贸易融资）——面向进口商的短期融资

              6. Flexport Platform 软件——用于供应链可视化的订阅制 SaaS


              Flexport 2024 年营收约 $2.1B（估计，较 2023 年 $1.6B 增长约
              30%）。营收增长受海运市场复苏与市场份额提升拉动。然而，公司仍未实现盈利，随着对技术平台和国际扩张的持续投入，运营亏损仍在延续。
