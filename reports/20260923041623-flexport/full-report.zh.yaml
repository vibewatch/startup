      - number: '5.4'
        title: 资料卡
        blocks:
          - type: callout
            title: CSRD 碳核算模块是 Flexport 技术壁垒中成色最足的防御护城河
            body: >-
              CSRD 碳核算组件架构精密，深度贴合 CSRD 规范，并获得快速膨胀的货主实操数据飞轮强力驱动。随着欧盟 CSRD 监管强制落地的逐级外溢（大型实体对应 FY2024，中端企业对应
              FY2025），Flexport 的 Scope 3 物流合规报告组件已蜕变为绑定采购门槛的核心推手——企业货主可能必须选用满足 CSRD
              规范的承运货代，这让该功能直接演化为巩固核心大客户续约留存的强力防御抓手。
            calloutType: insight
