chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与使命
        blocks:
          - type: paragraph
            body: >
              Flexport 由 Ryan Petersen 于 2013
              年创立，使命是让全球贸易对所有人都更简单。公司持有报关代理和货运代理牌照，以数字优先的物流中介形态运营，为从小微企业到大型企业的各类托运人管理海运、空运、铁路、卡车运输和最后一公里交付。


              Flexport 总部位于旧金山，在 Amsterdam、Chicago、Frankfurt、Hong Kong、Los Angeles、New York、Portland、Seattle 和 Shenzhen
              设有办公室，覆盖完整的全球贸易走廊。公司平台提供实时货运可视化、数据分析、金融服务（贸易融资）和海关管理，定位为「供应链操作系统」，而非传统货运经纪商。


              Ryan Petersen 创办 Flexport，源于他意识到货运代理是少数仍依赖传真机、电话和电子表格运转的大行业之一。他的洞察在于：把货代工作流数字化，能释放显著效率，并较 DSV、Maersk 和
              Kuehne+Nagel 等传统巨头创造更优质的客户体验。Flexport
              自研平台把报关申报、承运商选择、路线优化和供应链分析整合进单一数字界面，托运人可通过手机或桌面端访问。公司持有美国报关经纪牌照（CBP），也是持牌
              NVOCC（无船承运人）。这些监管资质赋予其代表进口商向美国海关提交申报文件、直接与海运承运商签约锁定舱位的法定权利，为非传统物流平台建立了坚实的准入门槛。
