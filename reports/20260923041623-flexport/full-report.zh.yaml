  - number: 7
    title: 风险剖析
    sections:
      - number: '7.1'
        title: 宏观与大盘风险
        blocks:
          - type: paragraph
            body: >
              Flexport 的营收高度绑定两大很大程度超出管理层把控的宏观外生变量：海运与空运即期运价中枢，以及美国对外贸易政策（关税壁垒）。


              运力费率周期剧烈波动是居于首位的宏观风险。以反映即期集装箱运价的上海出口集装箱运价指数（SCFI）衡量，海运市场价格从 2022 年历史高点跌至 2023 年底部的跌幅达 65-70%，直接导致了
              Flexport 2023
              年营收大幅萎缩且未能达成既定盈利目标。这一下行周期的重演——无论是由全球宏观经济降温、新造集装箱巨轮集中下水释放海量运力，抑或苏伊士运河与红海通航常态化所引发——都将剧烈冲击其货运代理主营业务创收，并将既定的盈亏平衡窗口期大幅拖后
              12-24 个月。


              美国关税壁垒升级属于利弊交织的双刃剑。2025 年针对中国进口商品加征的新一轮关税（导致多个品类的累计综合有效税率突破
              100%），不可避免地压低了受牵连跨太平洋航线上的贸易实体货量（利空货代周转营收），但同时也极大地拉高了货物通关申报的合规壁垒（利好报关代理服务营收）。两者相较的最终净效应虽存变数，但分析师主流研判认为，鉴于
              Flexport 营收基本盘仍重度依赖海空运物理货代，关税升级对整体业绩将带来轻度至中度的净负面冲击。


              地缘政治敏感性风险：Flexport 在跨太平洋航线上存在高度的业务集中（50-70%
              的货运业务重仓在美亚主干航线），导致其全面暴露于美中经贸关系摩擦、台海地缘局势以及亚太区域地缘政治动荡之中，随时可能面临核心贸易动脉阻断的经营冲击。
