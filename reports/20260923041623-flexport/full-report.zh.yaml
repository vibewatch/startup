      - number: '8.2'
        title: 融资背景与可比公司组
        blocks:
          - type: paragraph
            body: >
              当前融资背景：

              - 估计估值：约 $3.8B（2025 年 8 月股权轮，未经证实）

              - 2025 年 8 月股权融资：$250M（老股东内部轮，由 a16z 领投）

              - 2024 年 1 月可转债：$260M（转股条款未见公开）

              - 累计融资：约 $2.3B+（所有轮次合计）

              - 2022 年 Series E 估值峰值：$8B（SoftBank VF2 领投，募资 $900M）

              - 当前较峰值折价：约 52%（从 $8B 降至 $3.8B）


              2024 年 1 月发行的可转债具有潜在稀释性：若按未来融资轮次折价转股，现有普通股及优先股股东将在标准股权序列之外承担额外稀释。具体转股机制（估值上限、折扣率、利息）未见公开披露，构成了实质性的稀释不确定性。


              稀释与清算优先权压顶：

              Flexport 累计融资超 $2.3B，形成了庞大的清算优先权堆叠。在 $3.8B 估值及 $2.3B 优先股资本结构下，普通股（员工、早期投资人）在退出估值达到 $2.3B+
              之后方可参与分配——这限制了在退出估值低于约 $5-6B 时的上行收益分享。按 $8B 估值投资的 Series E 意味着 SoftBank VF2 的 1 倍优先清算权在 $3.8B
              以上具有反稀释效力，但普通股持有人仍排在优先股堆叠之后。


              可比一级市场轮次（2024-2025）：

              - project44：估值 $2.3B，ARR $260M，已证明盈利——纯物流 SaaS

              - Samsara（已上市）：市值约 $25B，ARR $1.2B，物流车载信息系统 SaaS

              - Transfix：估值 $1.1B（2022 年，2024 年市场环境中承压），数字整车经纪

              - Forto：估值 €1.5B（2022 年轮次，德国数字货代），收入出现下滑


              可比公开市场公司（货运代理）：

              - DSV：市值 DKK 280B，收入 DKK 175B → 1.6x 收入（含收购 Schenker 整合溢价）

              - Kuehne+Nagel：市值 CHF 25B，收入 CHF 22B → 1.1x 收入

              - Maersk（货代部门）：归并于 Maersk Group 财报；货代业务倍数约为 0.4x 收入

              - Expeditors International：市值约 $16B，收入约 $9B → 1.8x 收入（数字化领先的传统货代）
            claimRefs: []
