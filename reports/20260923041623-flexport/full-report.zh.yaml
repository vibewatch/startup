              - CM007
              - CM012
      - number: '2.4'
        title: 资料卡
        blocks:
          - type: callout
            title: Flexport 角逐 $200-250B 大盘，但当下数字货运渗透仅为 $4.5-6B
            body: >-
              货运代理整体大盘空间巨大，但 95% 以上的份额仍牢牢掌握在传统巨头手中。Flexport 的近中期战局集中于 $4.5-6B 的数字货代细分赛道，公司在此占据约 35-47%
              的主导份额——在高增长细分阵地建立绝对优势。核心胜负手在于数字货运从传统货代手中抢夺份额的演进节奏。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
          - type: callout
            title: 传统货代加速数字技术投入，正快速收窄能力代差
            body: >-
              DSV、Kuehne+Nagel 和 Maersk 均在 2022-2024 年间上线了自研数字货运平台，并保持每年数亿美元的数字化资本开支。若传统巨头弥合了物流跟踪与数据分析领域的差距，Flexport
              的核心差异化壁垒将退化为单纯的价格透明度，其护城河深度将大打折扣。
            calloutType: insight
