company:
  name: "Stoke Space"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Stoke Space Technologies is an aerospace launch provider developing Nova, an integrated medium-lift rocket architecture engineered for 100% rapid reusability across both its first-stage booster and orbital upper stage. Co-founded in October 2019 by former Blue Origin propulsion leads Andy Lapsa and Tom Feldman, the company has secured $2.3 billion in cumulative lifetime equity funding—accelerated by a $1.0 billion Series E round in September 2026—alongside a $100 million credit facility and an anchor position on the U.S. Space Force NSSL Phase 3 Lane 1 contract. However, Stoke Space operates with substantial capital burn across its Kent manufacturing hub and 550-acre Moses Lake test complex, facing structural debt obligations, stringent FAA Part 450 licensing hurdles, and intense competition from established incumbents ahead of its targeted early 2027 orbital debut."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity, Mission, and Core Architecture"
    body: "Stoke Space Technologies, Inc. is an aerospace manufacturing and launch services company founded in October 2019 and headquartered in Kent, Washington. Co-founded by former Blue Origin propulsion engineers Andy Lapsa and Tom Feldman, the venture was established to address persistent launch shortages and high orbital delivery costs by developing a two-stage launch vehicle capable of 100% full and rapid reusability. Unlike traditional expendable rockets or partially reusable systems that discard their second stages after booster separation, Stoke Space is designing both stages of its flagship Nova rocket family for routine atmospheric reentry, vertical recovery, and rapid turnaround with aircraft-like operational cadence. The company operates a vertically integrated 168,000-square-foot design and manufacturing facility in Kent that houses vehicle engineering, component fabrication, and planned mission control operations. Ground test operations are anchored at an expanding 550-acre test site near the airport in Moses Lake, Washington, where extensive component, turbomachinery, and full-scale propulsion static fires are conducted. For orbital flight operations, Stoke Space was allocated Space Launch Complex 14 (SLC-14) at Cape Canaveral Space Force Station in Florida in March 2023, where launch infrastructure refurbishment and offshore booster recovery systems are currently progressing toward initial flight operations."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO014"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Founding Team, Technical Leadership, and Board Governance"
    body: "Stoke Space's technical trajectory and corporate governance are heavily anchored by its founding leadership and specialized propulsion backgrounds. Co-founder and Chief Executive Officer Andy Lapsa earned a Ph.D. in aerospace engineering from the University of Michigan and previously spent over a decade leading rocket engine development at Blue Origin, where he oversaw the BE-3 and BE-3U cryogenic upper-stage engine programs and contributed to the high-thrust BE-4 engine. Co-founder and Chief Technology Officer Tom Feldman, also a veteran Blue Origin propulsion architect, spearheads the core propulsion and thermal protection engineering teams. Together, the founders represent deep founder-market fit in staged combustion turbomachinery, cryogenic fluid handling, and advanced heat shield mechanics, though their dual concentration creates significant key-person technical dependency. To strengthen institutional governance, Stoke Space expanded its board of directors in July 2026 by appointing Kevin Weil, an early angel investor, former OpenAI VP of Science, and former executive at Twitter and Planet Labs. The board also includes independent director Stephen F. Angel, former Chairman and CEO of industrial gas giant Linde plc, providing extensive global supply chain, cryogenic operations, and capital manufacturing discipline as the company expands its production footprint."
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO015"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholders"
    title: "Financing Trajectory, Capitalization, and Stakeholder Profile"
    body: "Stoke Space has established one of the largest private capitalization bases in the commercial launch industry, raising $2.3 billion in cumulative equity financing across multiple institutional rounds. Following an initial $225,000 National Science Foundation SBIR Phase I grant in 2020 and a $9.1 million seed financing round led by NFX Guild and MaC Venture Capital in February 2021, the company secured a $65 million Series A round in December 2021 led by Breakthrough Energy Ventures. In October 2023, Industrious Ventures led a $100 million Series B round to support full-scale upper-stage flight testing. Financing scaled rapidly with a $260 million Series C in January 2025, followed in October 2025 by a $510 million Series D led by Thomas Tull's US Innovative Technology Fund (USIT) with participation from Washington Harbour Partners, General Innovation, and existing sponsors. The Series D was subsequently upsized to $860 million in February 2026. In September 2026, Stoke Space completed an initial $1.0 billion closing of its Series E round co-led by Point72 Ventures and Spark Capital, bringing total equity capital to $2.3 billion. Alongside equity, the company secured a $100 million term debt facility in late 2025 led by Silicon Valley Bank. Private secondary valuation benchmarks range between $2.0 billion and $10.0 billion, though primary post-money valuations remain undisclosed."
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO016"
    tableRefs:
      - "TO003"
  - id: "operational-roadmap-and-risks"
    title: "Milestone Evolution, Capital Burn, and Structural Execution Risks"
    body: "Stoke Space's operational roadmap is defined by a phased demonstration strategy transitioning from subscale flight articles to integrated orbital launch vehicles. In September 2023, the company achieved a critical technical proof point with its Hopper2 technology demonstrator, executing a 10-meter vertical takeoff and vertical landing hop that validated differential throttle-thrust vector control and actively cooled metallic base heat shield survivability without gimbaling. In June 2024, Stoke hotfired its Zenith first-stage full-flow staged combustion engine at Moses Lake, followed by extensive 46-objective structural qualification campaigns in June 2026. The initial orbital variant, Nova Pathfinder, is designed to deliver 3 metric tons to low Earth orbit in fully reusable mode (or up to 7 metric tons expendable) and is targeted for its maiden orbital demonstration from Cape Canaveral in early 2027. Concurrently, the company is advancing Nova Block 2, a larger 15-metric-ton reusable vehicle featuring a 5-meter payload fairing and twelve dual-chamber Andromeda engines, targeting a debut flight in 2029. Despite these achievements, Stoke faces severe execution risks: the company carries substantial fixed capital expenditure obligations and a $100 million debt facility prior to generating commercial launch revenue. Furthermore, operations must navigate FAA Part 450 safety certification backlogs and congested Florida launch range corridors."
