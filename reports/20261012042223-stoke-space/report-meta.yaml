  topStrengths:
    - Full two-stage reusability differentiates Nova from partially reusable launch systems.
    - >-
      Capitalization is unusually strong for a private launch developer, with $2.3B raised and a large institutional
      syndicate.
    - >-
      Government contract access and early commercial manifests provide some demand validation before first orbital
      flights.
  topRisks:
    - Orbital upper-stage reentry and turnaround remain unproven.
    - Heavy fixed capital expenditure and debt obligations could outpace progress if flight milestones slip.
