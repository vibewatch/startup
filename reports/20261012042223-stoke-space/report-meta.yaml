companyProfile:
  summary: >-
    Stoke Space is a private aerospace launch company developing the Nova family of medium-lift vehicles around a full
    two-stage reusability thesis. The company combines a Kent, Washington headquarters, a Moses Lake test complex, and
    Cape Canaveral launch infrastructure with deep technical leadership from former Blue Origin propulsion engineers and
    a sizable institutional financing base.
  founders:
    - name: Andy Lapsa
      role: Co-Founder & Chief Executive Officer
      background: Former Blue Origin propulsion leader who worked on the BE-3, BE-3U, and BE-4 programs.
      claimRefs:
        - CO003
    - name: Tom Feldman
      role: Co-Founder & Chief Technology Officer
      background: Former Blue Origin propulsion designer focused on advanced rocket engine and reentry systems.
      claimRefs:
        - CO004
  foundingLocation: Washington state
  headquarters: Kent, WA
  productSummary: >-
    Stoke develops the Nova launch system, a medium-lift orbital rocket family intended to recover and rapidly reuse
