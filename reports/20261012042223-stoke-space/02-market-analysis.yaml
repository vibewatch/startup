callouts:
  - calloutType: "insight"
    title: "Launch Supply Crunch Drives Demand for Secondary Medium-Lift Vehicles"
    body: "Satellite constellation operators are experiencing severe launch capacity bottlenecks as SpaceX's internal Starlink manifest dominates orbital launch frequency. Stoke Space's selection on the U.S. Space Force's $5.6B NSSL Phase 3 Lane 1 contract confirms that institutional buyers actively seek resilient, commercial-derivative alternatives to prevent single-provider dependence."
    claimRefs:
      - "CM004"
      - "CM008"
      - "CM013"
  - calloutType: "risk"
    title: "Cape Canaveral Launch Manifest Congestion and FAA Part 450 Licensing Bottlenecks"
    body: "Transitioning Nova from test firings to operational launch at Cape Canaveral's Launch Complex 14 faces tightening regulatory and operational headwinds. Mandatory FAA Part 450 regulations and unprecedented launch density in the Florida corridor create persistent risk of airspace ground stops, schedule slippage, and extended burn before commercial revenue stabilizes."
    claimRefs:
      - "CM009"
      - "CM010"
