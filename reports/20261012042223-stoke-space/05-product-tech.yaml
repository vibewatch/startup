callouts:
  - calloutType: "insight"
    title: "The Reusable Upper-Stage Engineering Paradigm"
    body: "While partially reusable rockets like Falcon 9 discard the upper stage on every flight, Stoke Space's engineering bet rests on full reusability using an actively cooled metallic heat shield. By circulating liquid hydrogen through the metallic baseplate rather than relying on brittle ceramic tiles, Stoke aims to eliminate labor-intensive tile inspection and replacement. If flight-proven, this architecture unlocks aircraft-like launch cadence; however, mastering expander-cycle differential steering and orbital reentry dynamics represents one of the steepest technical hurdles in modern rocketry."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE010"
      - "CE013"
  - calloutType: "risk"
    title: "Schedule Slip to 2027 and Scaling Pressure for Block 2"
    body: "Stoke's maiden orbital flight target has slipped from original 2025 projections to late 2026 and now early 2027, highlighting the immense complexity of dual-stage full reusability. Concurrently, the September 2026 unveiling of Nova Block 2—a significantly larger 15-ton-to-LEO vehicle with a 14-engine first stage slated for 2029—introduces substantial scaling and manufacturing demands before the Pathfinder architecture has flown a single orbital mission."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE013"
      - "CE016"
