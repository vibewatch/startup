chapter:
  number: 5
  title: "Product & Technology"
  summary: "Stoke Space is developing Nova, a fully reusable two-stage medium-lift launch vehicle pairing a methane full-flow staged combustion booster with a hydrogen-fueled upper stage featuring an actively cooled metallic heat shield. Ground qualifications and engine firings demonstrate subscale maturity across propulsion and structures, but full orbital turnaround, thermal reusability, and scaling to the 15-ton Nova Block 2 architecture remain unproven in flight."
sections:
  - id: "vehicle-architecture-and-propulsion"
    title: "Launch Vehicle Architecture and Propulsion Systems"
    body: "Stoke Space's flagship product is Nova, a medium-lift orbital launch vehicle designed for complete and rapid reusability across both its first and second stages. The initial flight configuration, designated Nova Pathfinder, stands 40.2 meters tall with a 4.2-meter diameter and is designed to deliver up to 3,000 kg to low-Earth orbit (LEO) in a fully reusable profile and 7,000 kg when expended, alongside 2,500 kg to geostationary transfer orbit (GTO) and 1,250 kg to translunar injection (TLI). First-stage boost propulsion relies on seven Stoke-developed Zenith engines burning liquefied natural gas (LNG) and liquid oxygen (LOX) in a full-flow staged combustion (FFSC) cycle, producing 3,110 kN of sea-level liftoff thrust. The FFSC cycle minimizes soot accumulation and turbine stress, lowering refurbishment burdens between flights. In September 2026, Stoke announced Nova Block 2, a scaled 15-metric-ton LEO configuration utilizing a 5-meter payload fairing and 14 first-stage Zenith engines generating over 1,700,000 lbf of thrust, establishing an upgrade path from Pathfinder's initial flight demonstration."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
