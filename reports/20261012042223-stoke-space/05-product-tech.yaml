  - id: "upper-stage-reusability-and-thermal-protection"
    title: "Reusable Upper Stage, Regenerative Cooling, and Thermal Protection"
    body: "The core technical differentiator of the Nova architecture is its second stage, which eliminates single-use thermal protection systems and fragile ceramic tiles in favor of a liquid-hydrogen-cooled metallic heat shield. Powered by the Andromeda propulsion system fueled by liquid hydrogen and liquid oxygen (LH2/LOX), the upper stage utilizes a distributed perimeter ring of 3D-printed thrust chambers integrated directly around the outer boundary of the metallic blunt-body shield. During atmospheric reentry, cryogenic hydrogen coolant circulates through internal microchannels within the metallic structure, absorbing peak convective aero-thermal flux before being routed through the closed expander cycle engine. Pitch, yaw, and roll attitude control during descent are achieved via differential thrust throttling across the distributed thrust chambers rather than mechanical gimbal actuators, simplifying stage mechanics. While subscale static firings and a 30-foot low-altitude hopper flight demonstrated the basic fluidics and differential steering mechanism in 2023, full orbital entry survival and thermal cycling integrity remain unvalidated prior to Pathfinder's orbital debut."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
    tableRefs:
      - "TE002"
  - id: "manufacturing-testing-and-deployment-infrastructure"
    title: "Vertically Integrated Manufacturing, Ground Qualification, and Launch Infrastructure"
    body: "Stoke executes an operating model centered on rapid design iteration and co-located fabrication across Washington state, paired with orbital launch infrastructure at Cape Canaveral, Florida. Primary vehicle design, additive manufacturing, avionics assembly, and internal tooling development occur at its 168,000-square-foot facility in Kent, Washington, supported by proprietary manufacturing software including the Boltline tracking product. Propulsion testing and structural qualifications take place at a dedicated 75-acre test site in Moses Lake, Washington, where first-stage structural proto-qualification was completed over a three-week campaign in June 2026 spanning 46 individual test runs across fluid, avionics, and pressure limit envelopes. For orbital operations, Stoke acquired and refurbished historic Space Launch Complex 14 (SLC-14) at Cape Canaveral Space Force Station, incorporating a 32-meter deep-piling launch mount rated for 5.3 MN liftoff thrust and a 37-meter umbilical tower. Following capital expansion via its $1 billion Series E financing in September 2026, Stoke scheduled the debut orbital launch of Nova Pathfinder from SLC-14 for early 2027, with the larger Nova Block 2 system targeting first flight in 2029."
