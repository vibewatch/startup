chapter:
  number: 3
  title: Competitors
  summary: >-
    Stoke Space positions its fully reusable Nova vehicle directly against SpaceX Falcon 9 and Rocket Lab Neutron in the
    medium-lift market, pursuing a 100% reusability architecture that eliminates upper-stage expendability while
    confronting formidable incumbent scale, flight heritage gaps, and Cape Canaveral regulatory bottlenecks.
sections:
  - id: landscape-and-competitor-classes
    title: Orbital Launch Landscape and Competitor Categorization
    body: >-
      The commercial orbital launch ecosystem is defined by an intensifying transition toward reusability as satellite
      constellation operators seek frequent, lower-cost access to low Earth orbit. Within this landscape, Stoke Space
      occupies a distinct competitive wedge as an ambitious entrant challenging entrenched incumbents and
      near-operational peers. While SpaceX dominates the launch sector with its flight-proven Falcon 9 and developing
      Starship, Rocket Lab is advancing its medium-lift Neutron vehicle, and Blue Origin is expanding into medium and
      heavy payloads with New Glenn. Legacy providers like United Launch Alliance maintain high-reliability defense
      market positions with Vulcan Centaur but remain burdened by expendable vehicle architectures. Stoke Space
      differentiates itself by pursuing full reusability across both first and second stages, positioning Nova Block 2
      as a dedicated medium-lift solution.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
    figureRefs:
      - FP001
  - id: competitor-capabilities-and-profiles
    title: Competitor Scale, Backlog, and Propulsion Architecture
    body: >-
      Evaluating competitor scale reveals substantial disparities in operational maturity, capitalization, and customer
      backlog. SpaceX operates at an unprecedented flight cadence and massive valuation, using Falcon 9 cash flow to
      fund Starship development. Rocket Lab represents the clearest medium-lift challenger, having posted $600 million
      in 2025 revenue and an $1.85 billion order backlog while maturing its Archimedes-powered Neutron rocket. In
      contrast to Rocket Lab and Blue Origin, which rely on expendable upper stages, Stoke Space is engineering a staged
      combustion cycle with a regeneratively cooled, novel upper stage heat shield. Stoke was founded by propulsion
      veterans from Blue Origin and SpaceX and has scaled vehicle testing at its Moses Lake facility, validating
      critical first-stage structures ahead of orbital flight attempts.
    claimRefs:
      - CP003
      - CP004
      - CP005
      - CP006
      - CP007
    tableRefs:
      - TP001
  - id: switching-costs-and-defense-posture
    title: Institutional Access, Defense Manifests, and Switching Costs
    body: >-
      Customer switching costs in orbital launch are governed by mission assurance, flight heritage, payload integration
      timelines, and institutional contracting access. To de-risk its path to revenue, Stoke Space has aggressively
      pursued national security validation, securing positions on federal defense launch programs alongside established
      players. Stoke and Blue Origin were selected by the U.S. Space Force to compete for small satellite missions under
      dedicated defense acquisition pathways. Capitalization from a $510 million Series D led by USIT and subsequent
      Series E funding supports manufacturing scale and infrastructure development at Cape Canaveral Launch Complex 14.
      Stoke plans to fly its Nova Pathfinder vehicle in 2027 to establish initial operational proof before scaling to
      Nova Block 2 by 2029.
    claimRefs:
      - CP008
      - CP009
      - CP010
      - CP011
    tableRefs:
      - TP002
  - id: differentiation-durability-and-incumbent-moats
    title: Moat Durability, SpaceX Squeezing, and Operational Headwinds
    body: >-
      Despite Stoke Space's compelling architectural differentiation, the company faces severe structural headwinds from
      incumbent scale and regulatory friction. SpaceX continues to capture the vast majority of anchor commercial and
      government launch awards, squeezing emerging vehicle providers before they achieve flight heritage. Furthermore,
      transition from static testing to active Cape Canaveral launches exposes Stoke to stringent FAA Part 450 licensing
      requirements and frequent airspace congestion along the Florida launch corridor. These administrative and range
      constraints risk causing manifest slips and accelerating capital burn while hardware remains grounded. While
      Stoke's completed 46 first-stage structural tests demonstrate technical progress, its long-term economic moat
      depends on achieving rapid second-stage turnaround without costly refurbishment cycles.
    claimRefs:
      - CP011
      - CP012
      - CP013
      - CP014
    tableRefs:
      - TP003
