callouts:
  - calloutType: insight
    title: The Reusability Bifurcation in Medium-Lift Launch
    body: >-
      While competing next-generation launchers such as Rocket Lab's Neutron and Blue Origin's New Glenn pursue partial
      first-stage reuse with expendable upper stages, Stoke Space is attempting complete 100% vehicle reusability. If
      technically validated, full upper-stage recovery eliminates the second-stage production cost floor, fundamentally
      altering marginal launch economics against partial-reuse incumbents.
    claimRefs:
      - CP003
      - CP004
      - CP007
  - calloutType: risk
    title: Incumbent Preemption and Cape Canaveral Airspace Friction
    body: >-
      Stoke Space faces severe incumbent preemption as SpaceX commands dominant federal and commercial launch backlogs.
      Furthermore, mandatory FAA Part 450 compliance and congested Cape Canaveral range scheduling threaten to impose
      administrative delays, elevating cash burn while flight hardware remains grounded at Launch Complex 14.
    claimRefs:
      - CP010
      - CP012
      - CP013
