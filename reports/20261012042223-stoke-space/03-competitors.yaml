  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Vehicle / Provider
      - Price / Unit / Contract Model
      - Included Capabilities
      - Discounts or Unknowns
      - Competitive Implication
    rows:
      - - SpaceX Falcon 9
        - ~$67M list price per dedicated launch
        - Dedicated booster, standard payload fairing, payload integration
        - Volume constellation discounts unknown; rideshare options available
        - Established price floor against which medium-lift competitors are benchmarked
      - - SpaceX Starship
        - Target <$10M operational cost (projected)
        - Full vehicle payload bay (100+ t), on-orbit refueling capability
        - Realized commercial price model and amortization timeline undisclosed
        - Potential to commoditize $/kg access if high-cadence reuse is demonstrated
      - - Rocket Lab Neutron
        - Target ~$50M-$55M per launch (estimated)
        - Archimedes-powered reusable booster, captive fairing design
        - Exact LSA contract pricing and multi-launch discounts undisclosed
        - Competes directly in the 13-ton LEO commercial constellation replenishment segment
      - - Stoke Space Nova
        - Undisclosed / private contract model
        - 100% reusable two-stage system, Cape Canaveral LC-14 launch
        - Commercial list pricing and refurbishment cost per flight undisclosed
        - True unit economics depend on amortizing both stages across high-frequency reflights
    notes: >-
