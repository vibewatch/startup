callouts:
  - calloutType: "risk"
    title: "Orbital Reentry Survival Is the Thesis-Defining Risk"
    body: "While full reusability offers transformative unit economics, atmospheric entry heating and deceleration dynamics on an orbital second stage represent an extraordinarily steep technical barrier. Unlike first-stage boosters that separate at suborbital velocities, the upper stage must survive orbital speeds using an actively cooled metallic heat shield. Any failure during initial orbital test flights would ground the fleet and require costly redesigns."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
  - calloutType: "risk"
    title: "Heavy Fixed Capital Commitments Magnify Launch Delay Penalties"
    body: "Stoke Space's capital structure combines massive equity investment with a $100 million debt facility. Hardware manufacturing at the 168,000-square-foot Kent facility, Moses Lake testing infrastructure, and Launch Complex 14 pad construction generate substantial fixed overhead. If FAA Part 450 certifications or launch window congestion delay maiden orbital launches, fixed cash burn and debt servicing could rapidly erode financial runway."
    claimRefs:
      - "CR008"
      - "CR010"
      - "CR011"
      - "CR012"
