chapter:
  number: 7
  title: "Risks"
  summary: "Stoke Space faces severe structural risks centered on orbital atmospheric reentry survival for its metallic second stage, escalating launch manifest congestion under FAA Part 450 regulations at Cape Canaveral LC-14, long-term debt debt-service friction from a $100M facility, and intense competitive crowding from established incumbents."
sections:
  - id: "technical-operational-risks"
    title: "Technical and Operational Reentry Risk"
    body: "Stoke Space's central architectural differentiation is 100% full reusability across both booster and upper stage, but returning an orbital upper stage through atmospheric reentry introduces unprecedented thermal, aerothermal, and mechanical stresses. The company has conducted suborbital low-altitude hop tests with Hopper2 demonstrating differential engine steering and active heat shield cooling, alongside hotfire tests of its first-stage Zenith engine. However, surviving orbital entry velocities remains an unproven technical challenge that represents Stoke's primary operational hurdle. Reentry failures would compromise flight cadence, inflate turnaround times, and destroy capital-intensive flight hardware before commercial stabilization. In addition, scaling production across the Moses Lake testing grounds and Kent facility requires stringent quality controls to prevent propulsion degradation under sustained high-cadence flight conditions."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "regulatory-manifest-risks"
    title: "Regulatory and Airspace Manifest Congestion"
    body: "Operating orbital launch systems from Cape Canaveral Space Force Station Launch Complex 14 subjects Stoke Space to rigorous multi-agency regulatory frameworks, including mandatory FAA Part 450 launch licensing rules that took effect in March 2026. Transitioning from Moses Lake ground test stands to Florida flight operations requires extensive safety cases, environmental clearances, and orbital trajectory coordination. Concurrently, record flight cadence from Cape Canaveral creates recurring airspace ground stops and range scheduling bottlenecks across the Eastern Range. Any regulatory delays in securing orbital licenses or launch window clearances will keep vehicles grounded, delaying pathfinder milestones and exacerbating cash burn during critical flight qualification campaigns."
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
    tableRefs:
      - "TR001"
  - id: "financial-market-risks"
    title: "Financial Model, Debt Structure, and Market Squeeze"
    body: "Hardware rocketry demands immense capital intensity before operational profitability can be demonstrated. Although Stoke Space extended its Series D financing and subsequent rounds, the company carries structural obligations under a $100 million debt facility that imposes continuous servicing overhead ahead of commercial revenue stabilization. Unlike software companies, aerospace manufacturing cannot dynamically curtail capital expenditure without halting vehicle production and pad activation. Furthermore, Stoke must compete for commercial payloads and NSSL defense task orders against entrenched incumbents with established flight heritage, risking severe market squeeze if orbital demonstrations face delays or cost overruns."
    claimRefs:
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
    tableRefs:
      - "TR003"
