      - number: '7.3'
        title: 财务模型、债务结构与市场挤压
        blocks:
          - type: paragraph
            body: >-
              硬件火箭业务在证明运营盈利能力前需要极高资本强度。尽管 Stoke Space 延长了 Series D 融资并完成后续轮次，公司仍承担 $100M 债务额度带来的
              结构性义务，在商业收入稳定前持续产生偿付开支。不同于软件公司，航天制造若不停止运载器生产和发射台启用，就无法动态削减资本开支。 此外，Stoke 还必须与拥有成熟飞行履历的现有企业竞争商业载荷和 NSSL
              国防任务订单；如果轨道演示延迟或成本超支，公司可能遭遇严重市场挤压。
            claimRefs:
              - CR010
