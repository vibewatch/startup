      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 轨道再入生存能力是定义论点的风险
            body: >-
              完全可复用能带来颠覆性的单位经济性，但轨道第二级的大气进入加热和减速动力学构成极高的技术壁垒。不同于以亚轨道速度分离的一级助推器，
              上级必须依靠主动冷却金属隔热罩承受轨道速度。初始轨道测试飞行期间任何失败都可能让整个机队停飞，并要求进行高昂的重新设计。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: 高额固定资本承诺放大发射延迟惩罚
            body: >-
              Stoke Space 的资本结构将巨额股权投资与 $100M 债务额度结合起来。168,000 平方英尺 Kent 工厂的硬件制造、Moses Lake 测试基础设施以及 Launch Complex 14
              发射台建设都会产生大量固定开支。如果 FAA Part 450 认证或发射窗口拥堵推迟首次轨道发射，固定现金消耗和债务偿付可能迅速侵蚀资金跑道。
            calloutType: risk
            claimRefs:
