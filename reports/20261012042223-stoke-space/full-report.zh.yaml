  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 运载器架构与推进系统
        blocks:
          - type: paragraph
            body: >-
              Stoke Space 的旗舰产品 Nova 是一款中型轨道运载器，设计为让一级和二级都实现完全、快速复用。初始飞行构型名为 Nova Pathfinder， 高 40.2 米、直径 4.2
              米；在完全可复用构型下可将最高 3,000 kg 送入低地球轨道（LEO），一次性使用时可运送 7,000 kg， 同时可将 2,500 kg 送入地球同步转移轨道（GTO），将 1,250 kg
              送入月球转移注入轨道（TLI）。一级助推推进依靠 7 台 Stoke 自研 Zenith 发动机，以液化天然气（LNG）和液氧（LOX）采用全流量分级燃烧（FFSC）循环，产生 3,110 kN
              海平面起飞推力。FFSC 循环可减少积炭和涡轮应力， 降低飞行间翻修负担。2026 年 9 月，Stoke 宣布 Nova Block 2，这是一款 15 公吨 LEO 构型，采用 5 米有效载荷整流罩和 14
              台一级 Zenith 发动机， 产生超过 1,700,000 lbf 推力，为 Pathfinder 的首次飞行演示建立升级路径。
            claimRefs:
