              Stoke Space 累计融资 $2.3B，是目前唯一积极推进中型轨道发射两级完全可复用方案的美国发射开发商；公司背后有不断扩建的 550 英亩 Moses Lake 测试设施，以及 Cape
              Canaveral SLC-14 的已分配轨道发射台。
