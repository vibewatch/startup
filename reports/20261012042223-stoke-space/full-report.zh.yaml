              Stoke Space 面临严重的现有企业抢先占位：SpaceX 掌握联邦和商业发射订单簿的主导地位。此外，强制性的 FAA Part 450 合规和拥堵的 Cape Canaveral
              靶场排程可能带来行政延误，在飞行硬件停留在地面时推高现金消耗。
