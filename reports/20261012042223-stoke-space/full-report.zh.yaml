            title: 飞行前客户承诺与 SpaceX 国防主导地位
            body: >-
              Stoke Space 已获得进入 $5.6B Space Force NSSL Phase 3 Lane 1 项目的资格，但要把资格转化为高利润轨道任务，必须在 SpaceX 和成熟的
              中型竞争者锁定长期星座发射清单前证明飞行就绪。
