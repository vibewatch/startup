  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术与运营再入风险
        blocks:
          - type: paragraph
            body: >-
              Stoke Space 的核心架构差异化是一级和上级 100% 完全可复用，但让轨道上级穿越大气再入会带来前所未有的热、气动热和机械应力。 公司已用 Hopper2
              进行了亚轨道低空跳跃测试，展示差分发动机转向和主动隔热罩冷却，也对一级 Zenith 发动机进行了热试车。 但承受轨道再入速度仍是未经验证的技术挑战，也是 Stoke
              的首要运营难题。再入失败会破坏飞行频次、拉长周转时间，并在商业稳定前摧毁资本密集型飞行硬件。 此外，在 Moses Lake 测试场和 Kent
              工厂扩大生产，需要严格质量控制，以防高频次持续飞行条件下推进系统性能下降。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
