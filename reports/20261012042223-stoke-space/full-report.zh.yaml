  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与近期商业化
        blocks:
          - type: paragraph
            body: >-
              Stoke Space 的商业策略建立在一个架构判断上：只有两级完全可复用，才能达到终极发射成本底线并实现类似飞机的飞行可用性。 商业卫星星座运营商和新兴太空机动企业构成长期主要可触达市场，但 Stoke
              的近期收入主要依赖结构化政府开发合同和军用发射运载器。 入选 U.S. Space Force National Security Space Launch（NSSL）Phase 3 Lane 1
              采购框架后，公司获得竞争一个截至 2029 年最高价值 $5.6B 的无限交付合同池的机会。此外，Defense Innovation Unit、NASA 和 National Science
              Foundation 的研发奖励提供非稀释性里程碑资金， 在抵消前期高额资本开支的同时验证 Stoke 的推进和主动冷却技术。然而，商业轨道发射要到 2027 年 Pathfinder 和 2029 年
              Block 2 才安排， 因此商业发射服务收入仍处于运营前，已签客户的定金条款也仍是高度保密的私有数据。
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI005
