              航天制造商承担沉重固定开支、专业人员承诺和多年期供应合同，难以快速削减成本。迄今没有航天企业证明常规轨道二级回收的运营可行性或经济性； 如果 Stoke
              的再生冷却金属隔热罩需要意外的飞后翻修或漫长检查周期，两级可复用承诺的边际成本优势将大幅收窄。在缺乏 Zenith 一级物料清单成本、 Andromeda 上级翻修费用或 Launch Complex 14
