      - number: '1.4'
        title: 里程碑演进、资本消耗与结构性执行风险
        blocks:
          - type: paragraph
            body: >-
              Stoke Space 的运营路线图采用分阶段演示策略，从缩比飞行器逐步过渡到一体化轨道运载器。2023 年 9 月，公司以 Hopper2 技术演示器取得关键技术验证：完成 10
              米垂直起飞和垂直着陆跳跃，在无需万向节的情况下验证了差分节流推力矢量控制以及主动冷却金属底部 隔热罩的耐久性。2024 年 6 月，Stoke 在 Moses Lake 对 Zenith
              一级全流量分级燃烧发动机完成热试车；2026 年 6 月又开展了 覆盖 46 项目标的大规模结构鉴定测试。初始轨道型号 Nova Pathfinder 设计为在完全可复用模式下向低地球轨道运送 3 公吨，
              一次性使用时最高可运送 7 公吨，目标是在 2027 年初从 Cape Canaveral 进行首次轨道演示。与此同时，公司推进更大的 Nova Block 2： 这是一款 15 公吨可复用运载器，配备 5
              米有效载荷整流罩和 12 台双燃烧室 Andromeda 发动机，目标于 2029 年首飞。尽管取得这些进展， Stoke 仍面临严重执行风险：在产生商业发射收入前，公司要承担大量固定资本开支和 $100M
              债务额度。此外，运营还必须应对 FAA Part 450 安全认证积压以及 Florida 发射走廊拥堵。
