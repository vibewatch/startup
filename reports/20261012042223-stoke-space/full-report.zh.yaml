      - number: '5.2'
        title: 可复用上级、再生冷却与热防护
        blocks:
          - type: paragraph
            body: >-
              Nova 架构的核心技术差异化在于第二级：它用液氢冷却的金属隔热罩取代一次性热防护系统和脆弱陶瓷瓦。上级由 Andromeda 推进系统驱动， 使用液氢和液氧（LH2/LOX），采用分布式周向环，将 3D
              打印推力室直接集成在金属钝头体隔热罩的外缘。大气再入期间，低温氢冷却剂在金属结构内部
              的微通道中循环，吸收峰值对流气动热流，然后导入闭式膨胀循环发动机。下降时的俯仰、偏航和滚转姿态控制，通过分布式推力室差分节流实现， 而非机械万向节执行器，从而简化级间机械结构。2023 年，缩比静态点火和一次
              30 英尺低空跳跃验证了基本流体和差分转向机制， 但在 Pathfinder 首次入轨前，完整轨道再入生存能力和热循环完整性仍未经验证。
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE005
              - CE007
