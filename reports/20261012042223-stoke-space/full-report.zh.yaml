      - number: '1.3'
        title: 融资轨迹、资本结构与利益相关方画像
        blocks:
          - type: paragraph
            body: >-
              Stoke Space 已建立商业发射行业最大的私募资本基础之一，分多轮机构融资累计获得 $2.3B 股权融资。公司先于 2020 年获得 $225,000 的 National Science
              Foundation SBIR Phase I 资助，随后于 2021 年 2 月完成由 NFX Guild 和 MaC Venture Capital 领投的 $9.1M 种子轮；2021 年 12 月又获得由
              Breakthrough Energy Ventures 领投的 $65M Series A。2023 年 10 月， Industrious Ventures 领投 $100M Series
              B，用于支持全尺寸上级飞行测试。融资随后快速放大：2025 年 1 月完成 $260M Series C， 2025 年 10 月由 Thomas Tull 的 US Innovative Technology
              Fund（USIT）领投 $510M Series D，Washington Harbour Partners、 General Innovation 及现有投资方参与；Series D 于 2026 年 2
              月增至 $860M。2026 年 9 月，Stoke Space 完成由 Point72 Ventures 和 Spark Capital 联合领投的 Series E 首笔 $1.0B 交割，使股权资本总额达到
              $2.3B。除股权外，公司还在 2025 年底获得由 Silicon Valley Bank 领头安排的 $100M 定期债务额度。私募二级市场估值基准介于 $2.0B 至
              $10.0B，但一级市场投后估值仍未披露。
