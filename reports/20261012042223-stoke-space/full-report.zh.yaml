      - number: '5.3'
        title: 垂直整合制造、地面鉴定与发射基础设施
        blocks:
          - type: paragraph
            body: >-
              Stoke 的运营模式围绕快速设计迭代和 Washington 州内协同制造展开，并在 Florida 州 Cape Canaveral 配套轨道发射基础设施。
              主要运载器设计、增材制造、航电组装和内部工装开发均在 Washington 州 Kent 的 168,000 平方英尺工厂进行，并使用包括 Boltline 跟踪产品在内的 专有制造软件。推进测试和结构鉴定在
              Washington 州 Moses Lake 的专用 75 英亩测试场完成；2026 年 6 月，公司经过为期三周的测试活动完成一级结构 原型鉴定，覆盖流体、航电和压力极限范围内的 46
              次独立测试。轨道运营方面，Stoke 收购并翻修 Cape Canaveral Space Force Station 的历史性 Space Launch Complex 14（SLC-14），配备额定 5.3
              MN 起飞推力的 32 米深桩发射座和 37 米脐带塔。借助 2026 年 9 月 $1B Series E 融资扩张，Stoke 将 Nova Pathfinder 从 SLC-14 的首次轨道发射安排在
              2027 年初，更大的 Nova Block 2 目标于 2029 年首飞。
            claimRefs:
              - CE011
              - CE012
              - CE014
              - CE015
              - CE016
