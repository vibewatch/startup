chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、使命与核心架构
        blocks:
          - type: paragraph
            body: >-
              Stoke Space Technologies, Inc. 是一家航天制造与发射服务公司，成立于 2019 年 10 月，总部位于 Washington 州 Kent。 公司由前 Blue Origin
              推进工程师 Andy Lapsa 和 Tom Feldman 共同创办，旨在通过开发具备 100% 完全快速复用能力的两级运载火箭，
              解决长期存在的发射供给短缺和高昂的入轨成本。传统一次性火箭或部分可复用系统会在助推器分离后丢弃第二级， 而 Stoke Space 正在为旗舰 Nova
              系列两级设计常规大气再入、垂直回收和类似飞机的快速周转节奏。公司在 Kent 运营一座 168,000 平方英尺的垂直整合设计制造工厂，容纳运载器工程、部件制造和规划中的任务控制业务。地面测试以
              Washington 州 Moses Lake 机场附近不断扩建的 550 英亩测试场为中心，开展大量部件、涡轮机械和全尺寸推进静态点火测试。轨道飞行方面， Stoke Space 于 2023 年 3 月获分配
              Florida 州 Cape Canaveral Space Force Station 的 Space Launch Complex 14（SLC-14），
              发射基础设施翻新和海上助推器回收系统正朝首次飞行运营推进。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO014
