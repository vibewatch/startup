              已公开确认的客户合作验证了政府和商业领域的机构兴趣。在联邦国防领域，U.S. Space Force 授予 Stoke Space $5.6B National Security Space
              Launch（NSSL）Phase 3 Lane 1 无限交付/无限数量（IDIQ）合同载体的主承包商席位。Lane 1 资格允许 Stoke 竞标国防卫星部署任务订单，
