      - number: '7.2'
        title: 监管与空域发射清单拥堵
        blocks:
          - type: paragraph
            body: >-
              在 Cape Canaveral Space Force Station Launch Complex 14 运营轨道发射系统，使 Stoke Space 受严格的多机构监管框架约束，包括 2026 年 3
              月生效的 强制性 FAA Part 450 发射许可规则。从 Moses Lake 地面测试台转向 Florida 飞行运营，需要大量安全论证和环境方面的准备。 与此同时，Cape Canaveral
              的飞行频次会在 Eastern Range 持续造成空域停飞和靶场排程瓶颈。获取轨道许可证或发射窗口许可的任何监管延误， 都会让运载器停在地面，推迟 Pathfinder
              里程碑，并在关键飞行鉴定活动期间进一步加剧现金消耗。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
