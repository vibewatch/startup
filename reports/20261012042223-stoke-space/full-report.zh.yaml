      - number: '5.4'
        title: 展示项
        blocks:
          - type: callout
            title: 可复用上级工程范式
            body: >-
              Falcon 9 等部分可复用火箭每次飞行都会丢弃上级，而 Stoke Space 的工程押注是用主动冷却金属隔热罩实现完全可复用。 Stoke
              让液氢流过金属底板，而不是依赖脆弱陶瓷瓦，目标是消除劳动密集型瓦片检查和更换。如果经飞行验证，这一架构将打开类似飞机的发射频次； 但掌握膨胀循环差分转向和轨道再入动力学，是现代火箭技术中最陡峭的技术难题之一。
            calloutType: insight
            claimRefs:
              - CE007
              - CE008
              - CE010
              - CE013
          - type: callout
            title: 进度滑至 2027 年与 Block 2 的扩张压力
            body: >-
              Stoke 的首次轨道飞行目标已从最初预计的 2025 年滑至 2026 年底，再滑至 2027 年初，凸显两级完全可复用的巨大复杂性。 与此同时，2026 年 9 月公布的 Nova Block
              2——一款明显更大的 15 吨入 LEO 运载器，配备 14 台发动机的一级，计划于 2029 年发射—— 在 Pathfinder 尚未执行一次轨道任务前，就带来了显著的规模化和制造要求。
            calloutType: risk
