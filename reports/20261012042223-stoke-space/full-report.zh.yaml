      - number: '1.2'
        title: 创始团队、技术领导与董事会治理
        blocks:
          - type: paragraph
            body: >-
              Stoke Space 的技术路线和公司治理高度依托创始团队及其专业推进背景。联合创始人兼首席执行官 Andy Lapsa 获得 University of Michigan 航空航天工程博士学位，此前在
              Blue Origin 负责火箭发动机开发超过十年，主管 BE-3 和 BE-3U 低温上级发动机项目， 并参与高推力 BE-4 发动机。联合创始人兼首席技术官 Tom Feldman 同样是 Blue
              Origin 资深推进架构师，负责核心推进和热防护工程团队。 两位创始人在分级燃烧涡轮机械、低温流体处理和先进隔热罩力学方面具备深厚的创始人与市场匹配度，但两人的职责高度集中也带来显著的
              关键人物技术依赖。为加强机构治理，Stoke Space 于 2026 年 7 月扩充董事会，任命早期天使投资人、前 OpenAI 科学副总裁、 前 Twitter 和 Planet Labs 高管 Kevin
              Weil。董事会还包括独立董事 Stephen F. Angel，他曾任工业气体巨头 Linde plc 董事长兼首席执行官， 将丰富的全球供应链、低温运营和资本制造纪律带入公司的产能扩张。
