      - number: '4.2'
        title: 定价结构与竞争基准
        blocks:
          - type: paragraph
            body: >-
              Stoke Space 尚未公开发布 Nova Pathfinder 或 Nova Block 2 专属轨道飞行的固定标价，遵循航天行业按具体任务剖面、轨道参数和集成复杂度
              私下协商发射协议的惯例。在中型商业发射领域，Rocket Lab Neutron 等成熟替代方案已给出目标标价：将 13 公吨送入低地球轨道的价格约为 $50M 至 $55M。若 Stoke Space 要对
              SpaceX Falcon 9 等根深蒂固的现有企业以及即将出现的部分可复用进入者建立商业份额，Nova 必须达到 足以抵消潜在星座客户运营转换成本的平准化成本底线。早期飞行合同，例如搭载 AstroForge
              和 Celestis 载荷的初始演示任务，很可能包含 大幅开发折扣和促销性商业条款，而非稳态商业定价。在 Stoke 证明可重复的轨道回收并公布正式排期费率前，商业定价能力仍是未经验证的尽调假设。
