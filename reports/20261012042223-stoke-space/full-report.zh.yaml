              轨道运载器开发需要极高的前期资本开支、长交付周期部件采购和大量专用测试基础设施。Stoke Space 已获得可观的私募支持， 通过 $510M Series D 股权融资以及 Silicon Valley
              Bank 提供的 $100M 信贷额度为资本计划提供资金，随后股权规模扩大到 $860M。 融资轨迹于 2026 年 9 月达到阶段性高点：$1B Series E 首笔交割使累计融资达到
