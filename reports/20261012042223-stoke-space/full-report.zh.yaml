        - 轨道条件下的主动冷却金属再入仍未在航天飞行中得到验证；热疲劳或重量惩罚可能压低有效载荷系数。
        - Nova Pathfinder 二级成功完成轨道再入和回收，并验证检查周转时间。
      - - 市场需求与运力
        - 美国发射运力严重短缺且依赖 SpaceX，催生了对主权中型运力冗余的紧迫商业和国防部需求。
        - SpaceX Falcon 9 等主导厂商，以及 Rocket Lab Neutron 和 Blue Origin New Glenn 等新兴竞争者，正在拿下锚定发射计划。
        - 公开披露明确的多次商业发射星座合同，且包含不可退还的里程碑押金。
      - - 资本与现金跑道
        - 累计 $2.3B 股权融资及顶级机构投资者参与，为完成轨道演示提供了充足跑道。
        - 火箭制造和固定发射综合体基础设施资本强度极高，固定债务义务下现金消耗速度快。
        - 在不依赖稀释性下轮融资或紧急过桥融资的情况下，证明可持续的发射节奏。
      - - 监管与发射台就绪度
        - 卡纳维拉尔角翻修后的 14 号发射综合体，为东海岸高频轨道发射提供专用基础设施。
        - FAA Part 450 强制许可和拥挤的佛罗里达空域走廊，可能造成严重发射计划延误和成本超支。
        - 获得无条件 FAA Part 450 飞行器运营商许可证，并取得 LC-14 靶场安全批准。
    notes: 论点评估全系统可复用性与现金消耗、现有竞争者压力及监管时间表风险之间的权衡。
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV007
      - CV009
      - CV011
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心运营假设
      - 估值 / 回报逻辑
      - 主要下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - Nova Pathfinder 于 2027 年成功；Nova Block 2 到 2029 年提升至 15 t LEO；拿下大量 NSSL Phase 3 Lane 1 任务订单和星座发射计划。
        - 作为除 SpaceX Starship 外唯一投入运营的全复用中型运力供应商，企业估值升至 $15B-$20B 以上；回报 2.0x-3.0x。
        - SpaceX Starship 和 Rocket Lab Neutron 快速执行；金属隔热罩出现技术良率问题。
        - 25%（要求轨道演示无瑕疵，并快速将客户订单积压转化为收入）
      - - 基准情景
        - Pathfinder 于 2027-2028 年完成初始试飞但出现飞行延误；商业发射计划部分转化；Block 2 向 2030 年滑移。
        - 估值持平或调整至 $6B-$8B 区间；商业现金盈亏平衡前需追加融资并承受中等稀释。
        - FAA Part 450 发射许可瓶颈和东海岸靶场拥堵持续；飞行器再次飞行周转时间超过预期。
        - 55%（符合历史航空航天硬件成熟及发射许可节奏）
      - - 悲观情景
        - Pathfinder 发射或再入失败；上面级回收被证明不可行；债务融资契约挤压流动性；发射计划延至 2028 年之后。
        - 下轮融资重组或低于 $3B 的困境资本重组；现有股权遭受严重稀释，或被强行压缩清算优先权。
        - $100M SVB 债务到期压力、高固定设施消耗导致资本耗尽，以及客户转向 Falcon 9 或 Neutron。
        - 20%（反映投入运营的轨道飞行履历形成前的航空航天技术失败风险）
    notes: 概率加权情景基于据报道的 $9B-$10B 私人估值基准、技术里程碑和发射行业可比折现率。
    claimRefs:
      - CV001
      - CV004
      - CV008
      - CV010
      - CV012
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间展示 Stoke Space 从 2019 年 10 月成立，到 2026 年 9 月 Series E 及 Nova Block 2 发布的公司、资本和推进系统关键里程碑。
    data:
      items:
        - date: 2019-10
          label: 公司成立
          detail: Andy Lapsa 和 Tom Feldman 在华盛顿州注册成立 Stoke Space，开发完全可复用的轨道运载火箭。
          tone: neutral
        - date: 2020-05
          label: NSF SBIR 第一阶段资助
          detail: 获得 $225,000 NSF SBIR 资助，用于演示可复用上面级的集成推进系统。
          tone: positive
        - date: 2021-02
          label: 种子轮融资
          detail: 完成由 NFX Guild 和 MaC Venture Capital 领投的 $9.1M 种子轮，用于扩大初始推进测试。
          tone: positive
        - date: 2021-12
          label: Series A 融资
          detail: 获得由 Breakthrough Energy Ventures 领投的 $65M Series A，用于建设 Kent 设施和 Moses Lake 试验场。
          tone: positive
        - date: 2023-03
          label: 14 号发射综合体分配
          detail: U.S. Space Force 将历史悠久的卡纳维拉尔角 SLC-14 分配给 Stoke Space，用于 Nova 轨道运营。
          tone: positive
        - date: 2023-09
          label: Hopper2 垂直跳跃测试
          detail: Hopper2 完成 10 米飞行，演示差分节流和主动底部隔热罩冷却。
          tone: positive
        - date: 2024-06
          label: Zenith 发动机热试车
          detail: 一级全流量分级燃烧发动机 Zenith 在 Moses Lake 完成首次成功热试车。
          tone: positive
        - date: 2025-03
          label: NSSL Phase 3 Lane 1 入选
          detail: U.S. Space Force 选定 Stoke Space 承担 $5.6B Phase 3 Lane 1 发射合同，并授予 $5M 首笔任务订单。
          tone: positive
        - date: 2025-10
          label: Series D 与 $100M 债务融资
          detail: 完成由 USIT 领投的 $510M Series D，并配套 $100M 债务融资；后者于 2026 年 2 月增至 $860M。
          tone: neutral
        - date: 2026-09
          label: Series E 融资与 Nova Block 2
          detail: 宣布由 Point72 和 Spark Capital 联合领投的首笔 $1.0B Series E 交割，使累计资本达到 $2.3B，并发布 15 吨 Nova Block 2。
          tone: positive
    claimRefs:
      - CO001
      - CO002
      - CO006
      - CO007
      - CO008
      - CO010
      - CO011
      - CO013
  - id: FM001
    title: 市场规模与可触达需求金字塔
    type: pyramid
    summary: 从更广泛的全球太空经济，逐层缩小到 Stoke Space 可服务的目标市场及初始获取目标。
    data:
      items:
        - label: 全球太空经济（TAM）
          value: $1,100B
          detail: 预计到 2040 年，更广泛的太空经济将涵盖地面基础设施、卫星服务和深空探索。
        - label: 全球发射服务（细分 TAM）
          value: $30B+
          detail: 预计到 2030 年，全球商业、民用及国防轨道发射服务支出总额。
        - label: 中型运力与星座发射（SAM）
          value: $12.5B
          detail: 面向商业星座和国防补充发射的中型运载火箭可服务市场。
        - label: 美国国家安全太空发射池
          value: $5.6B
          detail: U.S. Space Force NSSL Phase 3 Lane 1 为期 5 年的无限量交付 / 无限量采购（IDIQ）合同池。
        - label: 商业拼车与专用 LEO
          value: $1.5B
          detail: 寻求快速部署的专用商业小型 / 中型卫星年度可触达需求。
        - label: Stoke Space 初始可服务目标（SOM）
          value: $350M
          detail: 预计 2028-2029 年，Nova Pathfinder 和 Nova Block 2 初期运营可带来初始可达年度收入运行率。
    approximationNotes: 数值综合了披露的 U.S. Space Force NSSL Phase 3 Lane 1 合同上限和第三方发射市场研究；Stoke Space 内部收入目标及客户订单积压未披露。
    claimRefs:
      - CM011
      - CM012
      - CM013
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 对美国轨道发射供应商的发射系统可复用完整度与运营飞行成熟度进行序数比较。
    xAxisLabel: 运营成熟度（1=飞行前测试，10=已验证的高频运营）
    yAxisLabel: 可复用完整度（1=完全一次性，10=两级 100% 可复用）
    data:
      points:
        - label: SpaceX (Falcon 9)
          x: 9.5
          'y': 6
        - label: SpaceX (Starship)
          x: 4.5
          'y': 9.5
        - label: Rocket Lab (Neutron)
          x: 3.5
          'y': 5.5
        - label: Blue Origin (New Glenn)
          x: 4
          'y': 5.5
        - label: ULA (Vulcan Centaur)
          x: 7
          'y': 1.5
        - label: Relativity Space (Terran R)
          x: 2
          'y': 5
        - label: Stoke Space (Nova)
          x: 2.5
          'y': 9
    approximationNotes: 运营成熟度和可复用完整度依据经验证的飞行历史及级间复用架构，按 1–10 序数尺度评分。
    claimRefs:
      - CP003
      - CP004
      - CP007
  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 展示 Stoke Space 如何将客户需求转化为已实现的发射收入和全复用毛利。
    data:
      nodes:
        - label: 客户需求与任务清单
          detail: 商业卫星星座和 Space Force NSSL Phase 3 Lane 1 任务订单确定发射计划要求。
        - label: 签约与前期里程碑押金
          detail: 客户在发射日前签署发射服务协议并按里程碑支付进度款。
        - label: 飞行器生产与发射台集成
          detail: Zenith 一级和 Andromeda 上面级在卡纳维拉尔角 14 号发射综合体完成制造集成。
        - label: 发射执行与有效载荷交付
          detail: 从 LC-14 起飞，将 Pathfinder 的 3t 至 Block 2 的 15t 有效载荷送入低地球轨道，并完成级间分离。
        - label: 两级回收与着陆
          detail: 助推器垂直着陆，上面级采用主动冷却金属隔热罩进行再入，二者结合实现两级回收。
        - label: 快速检查与翻修
          detail: 设计周转运营和飞行后发动机检查，以尽量减少边际人工接触。
        - label: 再次飞行运营与毛利率扩张
          detail: 机队复用将初始飞行器资本支出摊薄至多次飞行，从而实现目标发射运营利润率。
    approximationNotes: 运营流程基于已公布的技术架构建模；实际周转成本和工时仍属私人信息。
    claimRefs:
      - CI001
      - CI010
      - CI011
  - id: FE001
    title: Nova 两级运载火箭系统架构
    type: stack
    summary: Stoke Space 的 Nova 发射架构一体化技术栈，覆盖有效载荷容纳、可复用上面级、助推器推进系统和发射场运营。
    data:
      layers:
        - label: 有效载荷容纳与整流罩
          detail: 气动整流罩（Pathfinder 为 4.2m，Block 2 为 5.0m）保护商业及国防有效载荷，支持最高 15,000 kg LEO 和在轨部署机构
        - label: 轨道下行载荷与有效载荷舱
          detail: 加压 / 非加压内部货舱空间，支持卫星部署、在轨服务载荷及下行载荷返回地球
        - label: 可复用上面级（二级）
          detail: LH2/LOX Andromeda 膨胀循环发动机、3D 打印的 24 腔分布式推力器环、差分节流转向，以及再生冷却金属隔热罩
        - label: 级间段与级间分离
          detail: 结构分离系统和自动化航电接口，支持级间分离及上面级自主点火
        - label: 可复用一级助推器（一级）
          detail: >-
            27.1m 助推器由 7x Zenith FFSC 发动机（Pathfinder，3,110 kN）或 14x Zenith 发动机（Block 2，1,700,000+ lbf）提供动力；还配有自主 RTLS /
            无人船制导系统和栅格翼
        - label: 地面支持与发射基础设施
          detail: 卡纳维拉尔角太空军站 SLC-14 设施，配备 5.3 MN 推力反作用发射架、37m 脐带塔结构及自动低温加注系统
    approximationNotes: null
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE007
      - CE011
      - CE012
  - id: FU001
    title: 客户旅程图：从政府联合开发到高频轨道服务
    type: journey-map
    summary: 六阶段采用旅程，追踪客户从早期联邦研发资助到经常性商业星座发射服务的资格验证。
    data:
      items:
        - label: 阶段 1：基础研发与技术成熟
          touchpoints:
            - NSF SBIR 第一阶段推进资助（2020 年 5 月 $225,000）
            - NASA Ames 与金属隔热罩相关的协同气动测试
          stakeholders: Civil space agencies, government research labs
          friction: Strict technical review gates and zero commercial flight volume
        - label: 阶段 2：地面基础设施与发射台分配
          touchpoints:
            - 2023 年在卡纳维拉尔角分配 Space Launch Complex 14 发射台
            - Moses Lake 550 英亩火箭试验台扩建
          stakeholders: Cape Canaveral Space Force Station, local airport authority
          friction: Heavy fixed capital expenditure and environmental / pad construction approvals
        - label: 阶段 3：国防采购接入
          touchpoints:
            - 入选 $5.6B NSSL Phase 3 Lane 1 IDIQ 合同载体
            - 国防部安全许可及技术集成审计
          stakeholders: U.S. Space Force, Defense Innovation Unit
          friction: High compliance overhead and task-order competition against established incumbents
        - label: 阶段 4：首次商业发射计划
          touchpoints:
            - AstroForge 深空勘探航天器纳入 Pathfinder 发射计划
            - 目标为 2027 年初的日心轨道注入飞行剖面
          stakeholders: Commercial exploration startups, payload aggregators
          friction: Flight qualification risk and potential schedule slip on debut vehicle launch
        - label: 阶段 5：飞行演示与回收验证
          touchpoints:
            - Nova Pathfinder 在 2027 年和 2028 年进行轨道试飞
            - 助推器着陆及主动上面级再入生存试验
          stakeholders: Commercial satellite operators, space insurers, FAA licensing authorities
          friction: FAA Part 450 commercial launch licenses and unproven orbital heat shield survival
        - label: 阶段 6：工业规模星座发射节奏
          touchpoints:
            - Nova Block 2 于 2029 年首次亮相，具备 15 公吨 LEO 运力
            - 经常性多次发射星座补充合同
          stakeholders: LEO broadband constellation operators, defense constellation primes
          friction: Competition from SpaceX Starship/Falcon 9, Blue Origin New Glenn, and Rocket Lab Neutron
    approximationNotes: null
    claimRefs:
      - CU001
      - CU002
      - CU008
      - CU009
      - CU010
      - CU011
      - CU013
