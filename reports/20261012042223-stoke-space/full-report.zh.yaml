      - number: '3.4'
        title: 护城河持久性、SpaceX 挤压与运营阻力
        blocks:
          - type: paragraph
            body: >-
              尽管 Stoke Space 的架构差异化颇具吸引力，公司仍面临来自现有企业规模和监管摩擦的严重结构性阻力。SpaceX 继续拿下绝大多数商业和政府
              锚定发射订单，在新运载器取得飞行履历前挤压新兴供应商。此外，从静态测试转向 Cape Canaveral 主动发射，使 Stoke 暴露于严格的 FAA Part 450 许可要求和 Florida
              发射走廊频繁的空域拥堵。这些行政和靶场约束可能造成发射清单延误，并在硬件停飞时加速资本消耗。 虽然 Stoke 已完成 46
              项一级结构测试，显示出技术进展，但其长期经济护城河取决于能否实现无需高昂翻修周期的快速二级周转。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
