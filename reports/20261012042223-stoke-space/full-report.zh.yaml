  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、资本化历史与当前估值判断
        blocks:
          - type: paragraph
            body: >-
              Stoke Space Technologies 通过为中型 Nova 运载器追求两级完全可复用，将自己定位为轨道发射市场中雄心勃勃的挑战者。传统可复用架构只回收一级助推器， 将上级丢入轨道或海洋；Stoke
              则设计再生冷却金属隔热罩，让上级承受大气再入并实现类似飞机的快速飞行周转。这一架构野心吸引了大量风险投资和国防支持， 最终在 2026 年 9 月完成由 Point72 Ventures 和 Spark
              Capital 领投的 $1B Series E 首笔交割。该交易使 Stoke 累计融资达到 $2.3B； 此前 Series D 已扩至 $860M 股权融资，并配套由 Silicon Valley Bank
              安排的 $100M 风险债务。然而，Series E 前的媒体报道称 Stoke 估值已升至 约 $9B 至
              $10B。在这一价格水平上，市场已经计入近乎无瑕疵的执行和可观的商业收入，而公司尚未证明轨道飞行或二级回收。尽管完全可复用的长期
              单位经济性相较一次性上级具有明显优势，但缺乏公开飞行履历、客户合同定价披露和运营利润率，要求投资保持纪律。因此，我们的估值判断仍为“偏高”， 并给出“跟踪”建议，等待经验性轨道飞行证明和可核验的商业订单簿经济性。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV010
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV008
              - CV010
      - number: '8.2'
        title: 比较基准、战略定位与论点压力测试
        blocks:
          - type: paragraph
            body: >-
              Stoke Space 所处的发射生态正在快速演变，现有企业和新进入者的能力共同形成严峻竞争格局。SpaceX 凭借经过飞行验证的 Falcon 9 助推器复用和高发射频次 保持全球主导地位，同时推动超重型
              Starship 系统走向两级完全可复用。在专用中型发射领域，Rocket Lab 已成为领先的商业替代方案，2025 年收入 $600M、合同订单簿 $1.85B，并积极准备部分可复用 Neutron
              运载器。与此同时，Blue Origin 已用 New Glenn 开始运营飞行，打破历史发射垄断， 直接争夺重型和中型国家安全及商业星座载荷。面对这些资本雄厚的替代者，Stoke
              的投资反论点集中在上级大气返回固有的巨大技术和运营难题上。 二级轨道再入施加极端热和气动载荷，历史上迫使航天项目接受一次性级段或脆弱的热瓦维护体系。尽管 Stoke 已展示低空垂直跳跃测试并获得 U.S.
              Space Force $5.6B National Security Space Launch Phase 3 Lane 1 合同席位，但拥有运营飞行履历的竞争者可能在 Nova 获得飞行可靠性前吸收
              商业星座发射清单。除非 Stoke 能将技术新颖性转化为具成本效益的飞行频次，否则可能被低成本重型拼车和经过验证的中型替代方案夹在中间。
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV009
              - CV011
      - number: '8.3'
        title: 情景投资判断：乐观、基准与悲观回报逻辑
        blocks:
          - type: paragraph
            body: >-
              对一家尚无收入、尚未完成入轨的航天硬件公司做投资判断，必须把技术里程碑、资金消耗和监管阻力纳入明确的情景分析。乐观情景（概率 25%）下，Stoke 在 2027 年从 14 号发射复合体成功将 Nova
              Pathfinder 送入轨道，在实际再入过程中证明金属隔热罩的结构耐久性，并把最初的商业发射清单转化为持续、高毛利的发射服务协议。这样，公司就能沿着 2029 年目标为 15 公吨的 Nova Block 2
              前进，作为 SpaceX 之外首选的中型运力方案，将企业价值从 $15 billion 推至 $20 billion。基准情景（概率 55%）则假设技术迭代和飞行测试延迟把首次商业运营推迟至 2028
              年，估值稳定在 $6 billion 至 $8 billion，并需要额外股权融资、稀释股东权益，才能维持稳定发射节奏。悲观情景（概率 20%）下，二级再入测试出现技术异常，或 FAA Part 450
              监管下的发射清单严重堵塞，都会拉长研发周期。公司背负 $100 million 债务、且 Cape Canaveral 和 Moses Lake
              的固定基础设施开销庞大，若延误持续，现金消耗会加速，并可能被迫以低于 $3 billion 的价格进行惩罚性下轮重组融资。投资者必须盯住监管许可证审批、偿债流动性和上级回收指标，把它们作为关键下行信号。
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV010
              - CV012
      - number: '8.4'
        title: 建议总结、里程碑闸门与尽调路径
        blocks:
          - type: paragraph
            body: >-
              把完全复用的技术潜力与已披露的私募资本化估值放在一起看，结论很清楚：Stoke Space 是一项可能定义品类的技术押注，但当前定价已经超出其经验证的运营证明。二级市场信号（包括 Forge Price 截至
              2026 年 10 月约 $119.38 的每股估值）反映出私募市场的热情，但交易流动性极低，也缺乏独立监管披露。此外，Boltline
              制造平台等辅助软件项目虽能产生商业软件收入，却无法抵消飞行器研发所需的数亿美元资本投入。我们建议机构投资者先采取“跟踪”立场，待关键运营闸门达成后再直接配置股权。要上调评级，至少要完成以下尽调里程碑：(1)
              成功展示 Nova Pathfinder 入轨并回收二级；(2) 无条件取得 FAA Part 450 车辆运营商许可证，覆盖 Cape Canaveral 14 号发射复合体；(3)
              独立验证商业发射积压订单的转化情况，包括客户取消条款和里程碑付款结构；(4) 审计与 $100 million 信贷额度相关的债务契约。在这些里程碑提供实证性的下行保护之前，资金留在场外更稳妥。
            claimRefs:
              - CV001
              - CV004
              - CV010
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV009
              - CV013
              - CV014
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 严格的投资判断要求等待入轨验证
            body: >-
              Stoke Space 已筹集 $2.3B 以推进两级完全复用，但首次入轨前传出 $9B 至 $10B 的估值，带来了明显不对称的风险收益结构。在 Nova Pathfinder 从 14
              号发射复合体成功发射、入轨并回收二级之前，投资者应继续保持“跟踪”立场。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV010
          - type: callout
            title: 固定开销与债务敞口排除提前买入
            body: >-
              航天发射服务商不同于软件企业，背负着庞大的固定基础设施和测试开销。公司有 $100M 风险债务义务，且 Cape Canaveral 面临 FAA Part 450 监管许可障碍；任何发射延误到 2027
              年之后，都可能触发大幅下轮融资风险或稀释性资本重组。
            calloutType: risk
            claimRefs:
              - CV008
              - CV012
