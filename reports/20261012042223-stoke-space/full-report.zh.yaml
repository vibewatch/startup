  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与可触达发射细分
        blocks:
          - type: paragraph
            body: >-
              Stoke Space 的可触达市场集中在中型轨道发射运输，服务商业卫星星座、国家安全载荷和拼车部署。Stoke 有意将运营范围限定在低地球轨道的
              高频进入，排除资本成本过高的载人航天和深空科学探索。现有替代方案是占据商业发射供给主导地位的 SpaceX Falcon 9， 以及 Rocket Lab Neutron、Blue Origin New
              Glenn 等新兴可复用竞争者。巨型星座部署和轨道补给需求上升，使现有发射商的发射清单普遍出现 严重供给短缺，为能够降低轨道运输成本底线的完全可复用替代方案打开了明确的市场空间。
            claimRefs:
              - CM001
              - CM002
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
      - number: '2.2'
        title: 市场规模与需求捕获层次
        blocks:
          - type: paragraph
            body: >-
              轨道发射需求位于更广泛的太空经济之中，后者预计到 2040 年达到 $1.1T，其中全球发射服务可触达市场到 2030 年将超过 $30B。 在这一范围内，服务商业 LEO
              星座和国家安全载荷的中型运载器可服务可触达市场每年约为 $10B 至 $15B。Stoke 的近期需求锚点因入选 U.S. Space Force $5.6B NSSL Phase 3 Lane 1
              合同池而得到强化。在 $2.3B 累计股权和债务融资支持下，Stoke 正开发 3 吨可复用 Nova Pathfinder 和 15 吨 Nova Block
              2，以在卫星运营商面临严重运载器短缺之际捕获商业和政府发射需求。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM011
              - CM012
              - CM013
      - number: '2.3'
        title: 买方细分与采购流程
        blocks:
          - type: paragraph
            body: >-
              Stoke Space 目标细分市场的采购分为机构国防买方和商业电信运营商。机构需求由 U.S. Space Force 和 Space Development Agency 主导，通过 NSSL Phase 3
              Lane 1 下的任务订单授予，预算权掌握在寻求韧性和本土发射冗余的项目执行官手中。商业需求集中于卫星星座运营商
              和商业拼车聚合商，他们通过多任务发射协议采购发射，以确保部署进度及时。两类客户都重视进度确定性、发射频次和成本效率， 但政府客户在将作战国防载荷转移到新运载器之前，还要求严格的任务保证和飞行认证。
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM008
      - number: '2.4'
        title: 增长驱动、结构性约束与采用风险
        blocks:
          - type: paragraph
            body: >-
              中型发射需求增长由大规模 LEO 星座快速扩张以及国家安全对快速响应太空接入的要求推动。然而，Stoke Space 面临结构性约束和采用阻力。 SpaceX
              保持主导市场份额并拿下大量政府任务订单，挤压新兴供应商。同时，强制性的 FAA Part 450 许可监管摩擦，加上 Cape Canaveral
              长期存在的发射拥堵，带来发射审批延迟和空域停飞。此外，关键商业发射定价、签约订单簿经济性和上级翻修成本假设仍是未披露的私有指标， 这些尽调缺口需要在 Nova 轨道飞行测试期间持续跟踪。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 发射供给紧张推动二级中型运载器需求
            body: >-
              随着 SpaceX 内部 Starlink 发射清单占据轨道发射频次主导地位，卫星星座运营商正遭遇严重的发射能力瓶颈。Stoke Space 入选 U.S. Space Force $5.6B NSSL
              Phase 3 Lane 1 合同，说明机构买方正在主动寻找有韧性的商业衍生替代方案，以避免依赖单一供应商。
            calloutType: insight
            claimRefs:
              - CM004
              - CM008
              - CM013
          - type: callout
            title: Cape Canaveral 发射清单拥堵与 FAA Part 450 许可瓶颈
            body: >-
              Nova 从测试点火转向 Cape Canaveral Launch Complex 14 的运营发射时，监管和运营阻力都在收紧。强制性的 FAA Part 450 规定以及 Florida
              走廊前所未有的发射密度，持续带来空域停飞、进度滑移和商业收入稳定前的长期消耗风险。
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 轨道发射格局与竞争者分类
        blocks:
          - type: paragraph
            body: >-
              商业轨道发射生态正加速转向可复用，卫星星座运营商希望更频繁、更低成本地进入低地球轨道。在这一格局中，Stoke Space 作为雄心勃勃的
              新进入者，挑战根深蒂固的现有企业和即将运营的同业，形成了独特的竞争切口。SpaceX 凭借经过飞行验证的 Falcon 9 和正在开发的 Starship 主导发射行业；Rocket Lab 正推进中型
              Neutron；Blue Origin 则以 New Glenn 进入中型和重型载荷市场。United Launch Alliance 等传统供应商凭借 Vulcan Centaur
              保持高可靠性的国防市场地位，但仍受一次性运载器架构拖累。Stoke Space 通过追求一级和二级完全可复用， 将 Nova Block 2 定位为专用中型发射方案。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP004
              - CP007
      - number: '3.2'
        title: 竞争者规模、订单簿与推进架构
        blocks:
          - type: paragraph
            body: >-
              对竞争者规模的评估显示，其运营成熟度、资本化程度和客户订单簿存在明显差异。SpaceX 以空前的飞行频次和巨大估值运营，并用 Falcon 9 现金流为 Starship 开发提供资金。Rocket Lab
              是最明确的中型挑战者，2025 年收入达到 $600M，订单簿达到 $1.85B，同时推进由 Archimedes 驱动的 Neutron 火箭成熟。Rocket Lab 和 Blue Origin
              依赖一次性上级，而 Stoke Space 正在设计采用分级燃烧循环、再生冷却新型上级隔热罩的方案。 Stoke 由来自 Blue Origin 和 SpaceX 的推进资深人士创办，并在 Moses Lake
              测试场扩大运载器测试，在尝试入轨前验证关键一级结构。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP008
      - number: '3.3'
        title: 机构准入、国防发射清单与转换成本
        blocks:
          - type: paragraph
            body: >-
              轨道发射的客户转换成本取决于任务保证、飞行履历、载荷集成周期和机构合同准入。为降低收入路径风险，Stoke Space 积极寻求国家安全验证， 与成熟企业一道进入联邦国防发射项目。Stoke 和 Blue
              Origin 被 U.S. Space Force 选中，通过专门的国防采购路径竞争小型卫星任务。 USIT 领投的 $510M Series D 及后续 Series E 融资，为 Cape Canaveral
              Launch Complex 14 的制造规模化和基础设施建设提供支持。 Stoke 计划于 2027 年发射 Nova Pathfinder，建立初步运营证明，然后在 2029 年扩展到 Nova Block
              2。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP002
