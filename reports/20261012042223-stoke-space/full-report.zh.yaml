            body: >-
              Stoke Space 面向轨道运输市场的四个主要需求细分：国家安全太空发射、商业低地球轨道（LEO）卫星巨型星座、深空和行星探索，
              以及包括轨道机动和返回载荷下行运输在内的在轨物流。国防细分是中型发射能力的主要锚定市场，动力来自 U.S. Space Force 希望在现有 SpaceX
              垄断之外维持有韧性、冗余的入轨渠道。商业领域中，高频次部署替换卫星和补给批次的卫星星座运营商，需要具备灵活轨道注入能力和高飞行频次的运载器。
              深空科学和私人探索是新兴次级垂直领域，商业小行星带勘探任务就是例子。在所有客户细分中，Stoke 都将完全可复用的 Nova 架构定位为相较
              一次性或部分可复用替代方案提供更低每公斤成本和更高飞行可用性，但商业支付意愿仍取决于飞行验证。
            claimRefs:
              - CU001
