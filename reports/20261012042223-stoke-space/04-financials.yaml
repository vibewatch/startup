callouts:
  - calloutType: "risk"
    title: "Hardware Capital Intensity and Execution Risk"
    body: "Unlike software companies capable of flexing operating expenses, Stoke Space's capital-intensive aerospace model commits massive upfront capital to launch pad construction, engine tooling, and cryogenic testing. In the absence of orbital revenue, prolonged flight test delays or unexpected development setbacks risk rapid cash burn before reaching commercial flight cadence."
    claimRefs:
      - "CI012"
      - "CI013"
  - calloutType: "insight"
    title: "Dual-Stage Reusability Cost Floor Thesis"
    body: "Stoke Space's long-term margin thesis depends fundamentally on successfully recovering and rapidly reusing the second stage. While partial reuse achieves launch cost reductions, upper-stage expendability leaves an irreducible hardware replacement cost per flight that Stoke seeks to eliminate."
    claimRefs:
      - "CI001"
      - "CI014"
