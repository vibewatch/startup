figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Chronological progression of Stoke Space key corporate, capital, and propulsion milestones from October 2019
      founding through the September 2026 Series E and Nova Block 2 unveiling.
    data:
      items:
        - date: 2019-10
          label: Company Founding
          detail: >-
            Andy Lapsa and Tom Feldman incorporate Stoke Space in Washington state to develop fully reusable orbital
            launch vehicles.
          tone: neutral
        - date: 2020-05
          label: NSF SBIR Phase I Grant
          detail: Awarded $225,000 NSF SBIR grant to demonstrate integrated propulsion for reusable upper stages.
          tone: positive
        - date: 2021-02
          label: Seed Financing
          detail: Closed $9.1M seed round led by NFX Guild and MaC Venture Capital to expand initial propulsion testing.
          tone: positive
        - date: 2021-12
          label: Series A Financing
          detail: Secured $65M Series A led by Breakthrough Energy Ventures to build Kent facility and Moses Lake test site.
          tone: positive
        - date: 2023-03
          label: Launch Complex 14 Allocation
          detail: U.S. Space Force allocates historic Cape Canaveral SLC-14 to Stoke Space for Nova orbital operations.
          tone: positive
        - date: 2023-09
          label: Hopper2 Vertical Hop Test
          detail: Hopper2 completes 10-meter flight demonstrating differential throttling and active base heat shield cooling.
          tone: positive
        - date: 2024-06
          label: Zenith Engine Hotfire
          detail: First stage full-flow staged combustion engine Zenith completes first successful hotfire test at Moses Lake.
          tone: positive
        - date: 2025-03
          label: NSSL Phase 3 Lane 1 Selection
          detail: U.S. Space Force selects Stoke Space for $5.6B Phase 3 Lane 1 launch contract with $5M initial task order.
          tone: positive
        - date: 2025-10
          label: Series D & $100M Debt Facility
          detail: Closed $510M Series D led by USIT alongside $100M debt facility; later extended to $860M in February 2026.
          tone: neutral
        - date: 2026-09
          label: Series E Financing & Nova Block 2
          detail: >-
            Announced initial $1.0B Series E close co-led by Point72 and Spark Capital, bringing total capital to $2.3B,
            and unveiled 15-ton Nova Block 2.
          tone: positive
    claimRefs:
