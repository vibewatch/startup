  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Addressable Launch Segments
        blocks:
          - type: paragraph
            body: >-
              The addressable market for Stoke Space centers on medium-lift orbital launch transportation, servicing
              commercial satellite constellations, national security payloads, and rideshare deployments. Stoke
              deliberately bounds its operational scope to exclude capital-prohibitive human spaceflight and deep-space
              science exploration, focusing instead on high-frequency access to low Earth orbit. The status-quo
              substitute is SpaceX's Falcon 9, which dominates commercial launch availability, alongside emerging
              reusable competitors such as Rocket Lab's Neutron and Blue Origin's New Glenn. Rising demand for
              megaconstellation deployment and orbital replenishment has created acute supply shortages across incumbent
              launch manifests, creating a clear market opening for fully reusable alternatives capable of lowering
              orbital transportation cost floors.
            claimRefs:
              - CM001
              - CM002
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
      - number: '2.2'
        title: Market Sizing and Demand Capture Layers
        blocks:
          - type: paragraph
            body: >-
              Orbital launch demand is situated within a broader space economy projected to reach $1.1 trillion by 2040,
              of which global launch services comprise an addressable market expanding beyond $30 billion by 2030.
              Within this envelope, the serviceable addressable market for medium-lift vehicles servicing commercial LEO
              constellations and national security payloads spans $10 billion to $15 billion annually. Stoke's near-term
              demand anchor is fortified by its selection for the U.S. Space Force's $5.6 billion NSSL Phase 3 Lane 1
              contract pool. Supported by $2.3 billion in cumulative equity and debt financing, Stoke is developing the
              3-ton reusable Nova Pathfinder and 15-ton Nova Block 2 to capture commercial and government launch demand
              as satellite operators face severe launch vehicle shortages.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM011
              - CM012
              - CM013
