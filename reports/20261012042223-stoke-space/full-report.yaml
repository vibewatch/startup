      - number: '2.4'
        title: Growth Drivers, Structural Constraints, and Adoption Risks
        blocks:
          - type: paragraph
            body: >-
              Growth in medium-lift launch demand is driven by the rapid expansion of proliferated LEO constellations
              and national security mandates for responsive space access. However, Stoke Space faces structural
              constraints and adoption headwinds. SpaceX maintains dominant market share and captures massive government
              task orders, squeezing emerging providers. Concurrently, regulatory friction under mandatory FAA Part 450
              licensing combined with historic launch congestion at Cape Canaveral introduces launch approval delays and
              airspace ground stops. Furthermore, critical commercial launch pricing, contracted backlog economics, and
              upper-stage refurbishment cost assumptions remain undisclosed private metrics, creating diligence gaps
              that must be monitored across Nova's orbital flight test campaign.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Launch Supply Crunch Drives Demand for Secondary Medium-Lift Vehicles
            body: >-
              Satellite constellation operators are experiencing severe launch capacity bottlenecks as SpaceX's internal
              Starlink manifest dominates orbital launch frequency. Stoke Space's selection on the U.S. Space Force's
              $5.6B NSSL Phase 3 Lane 1 contract confirms that institutional buyers actively seek resilient,
              commercial-derivative alternatives to prevent single-provider dependence.
            calloutType: insight
            claimRefs:
              - CM004
              - CM008
              - CM013
          - type: callout
            title: Cape Canaveral Launch Manifest Congestion and FAA Part 450 Licensing Bottlenecks
            body: >-
              Transitioning Nova from test firings to operational launch at Cape Canaveral's Launch Complex 14 faces
              tightening regulatory and operational headwinds. Mandatory FAA Part 450 regulations and unprecedented
              launch density in the Florida corridor create persistent risk of airspace ground stops, schedule slippage,
              and extended burn before commercial revenue stabilizes.
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Orbital Launch Landscape and Competitor Categorization
        blocks:
          - type: paragraph
            body: >-
              The commercial orbital launch ecosystem is defined by an intensifying transition toward reusability as
              satellite constellation operators seek frequent, lower-cost access to low Earth orbit. Within this
              landscape, Stoke Space occupies a distinct competitive wedge as an ambitious entrant challenging
              entrenched incumbents and near-operational peers. While SpaceX dominates the launch sector with its
              flight-proven Falcon 9 and developing Starship, Rocket Lab is advancing its medium-lift Neutron vehicle,
              and Blue Origin is expanding into medium and heavy payloads with New Glenn. Legacy providers like United
              Launch Alliance maintain high-reliability defense market positions with Vulcan Centaur but remain burdened
              by expendable vehicle architectures. Stoke Space differentiates itself by pursuing full reusability across
              both first and second stages, positioning Nova Block 2 as a dedicated medium-lift solution.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP004
              - CP007
      - number: '3.2'
        title: Competitor Scale, Backlog, and Propulsion Architecture
        blocks:
          - type: paragraph
            body: >-
              Evaluating competitor scale reveals substantial disparities in operational maturity, capitalization, and
              customer backlog. SpaceX operates at an unprecedented flight cadence and massive valuation, using Falcon 9
              cash flow to fund Starship development. Rocket Lab represents the clearest medium-lift challenger, having
              posted $600 million in 2025 revenue and an $1.85 billion order backlog while maturing its
              Archimedes-powered Neutron rocket. In contrast to Rocket Lab and Blue Origin, which rely on expendable
              upper stages, Stoke Space is engineering a staged combustion cycle with a regeneratively cooled, novel
              upper stage heat shield. Stoke was founded by propulsion veterans from Blue Origin and SpaceX and has
              scaled vehicle testing at its Moses Lake facility, validating critical first-stage structures ahead of
              orbital flight attempts.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP008
      - number: '3.3'
        title: Institutional Access, Defense Manifests, and Switching Costs
        blocks:
          - type: paragraph
            body: >-
              Customer switching costs in orbital launch are governed by mission assurance, flight heritage, payload
              integration timelines, and institutional contracting access. To de-risk its path to revenue, Stoke Space
              has aggressively pursued national security validation, securing positions on federal defense launch
              programs alongside established players. Stoke and Blue Origin were selected by the U.S. Space Force to
              compete for small satellite missions under dedicated defense acquisition pathways. Capitalization from a
              $510 million Series D led by USIT and subsequent Series E funding supports manufacturing scale and
              infrastructure development at Cape Canaveral Launch Complex 14. Stoke plans to fly its Nova Pathfinder
              vehicle in 2027 to establish initial operational proof before scaling to Nova Block 2 by 2029.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP009
      - number: '3.4'
        title: Moat Durability, SpaceX Squeezing, and Operational Headwinds
        blocks:
          - type: paragraph
            body: >-
              Despite Stoke Space's compelling architectural differentiation, the company faces severe structural
              headwinds from incumbent scale and regulatory friction. SpaceX continues to capture the vast majority of
              anchor commercial and government launch awards, squeezing emerging vehicle providers before they achieve
              flight heritage. Furthermore, transition from static testing to active Cape Canaveral launches exposes
              Stoke to stringent FAA Part 450 licensing requirements and frequent airspace congestion along the Florida
              launch corridor. These administrative and range constraints risk causing manifest slips and accelerating
              capital burn while hardware remains grounded. While Stoke's completed 46 first-stage structural tests
              demonstrate technical progress, its long-term economic moat depends on achieving rapid second-stage
              turnaround without costly refurbishment cycles.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
