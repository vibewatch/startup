      - number: '7.2'
        title: Regulatory and Airspace Manifest Congestion
        blocks:
          - type: paragraph
            body: >-
              Operating orbital launch systems from Cape Canaveral Space Force Station Launch Complex 14 subjects Stoke
              Space to rigorous multi-agency regulatory frameworks, including mandatory FAA Part 450 launch licensing
              rules that took effect in March 2026. Transitioning from Moses Lake ground test stands to Florida flight
              operations requires extensive safety cases, environmental clearances, and orbital trajectory coordination.
              Concurrently, record flight cadence from Cape Canaveral creates recurring airspace ground stops and range
              scheduling bottlenecks across the Eastern Range. Any regulatory delays in securing orbital licenses or
              launch window clearances will keep vehicles grounded, delaying pathfinder milestones and exacerbating cash
              burn during critical flight qualification campaigns.
            claimRefs:
