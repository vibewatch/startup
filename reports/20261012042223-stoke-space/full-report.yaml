  - id: FE001
    title: Nova Two-Stage Launch Vehicle System Architecture
    type: stack
    summary: >-
      Integrated technical stack of Stoke Space's Nova launch architecture spanning payload accommodation, reusable
      upper stage, booster propulsion, and launch site operations.
    data:
      layers:
        - label: Payload Accommodation & Fairing
          detail: >-
            Aerodynamic fairing (4.2m on Pathfinder, 5.0m on Block 2) protecting commercial and defense payloads up to
            15,000 kg LEO with in-space deployment mechanisms
        - label: Orbital Downmass & Payload Bay
          detail: >-
            Pressurized/unpressurized internal cargo volume supporting satellite deployment, orbital servicing payloads,
            and downmass return to Earth
        - label: Reusable Upper Stage (Stage 2)
          detail: >-
            LH2/LOX Andromeda expander cycle engine, 3D-printed 24-chamber distributed thruster ring, differential
            throttling steering, and regeneratively cooled metallic heat shield
        - label: Interstage & Stage Separation
          detail: >-
            Structural separation system and automated avionics interfaces facilitating stage staging and autonomous
            upper-stage ignition
        - label: Reusable First Stage Booster (Stage 1)
          detail: >-
            27.1m booster powered by 7x Zenith FFSC engines (Pathfinder, 3,110 kN) or 14x Zenith engines (Block 2,
            1,700,000+ lbf), autonomous RTLS/droneship guidance, and grid fins
        - label: Ground Support & Launch Infrastructure
          detail: >-
            Cape Canaveral Space Force Station SLC-14 facility featuring 5.3 MN thrust-reaction launch mount, 37m
            umbilical structure, and automated cryogenic fueling
