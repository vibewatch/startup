      - number: '5.3'
        title: Vertically Integrated Manufacturing, Ground Qualification, and Launch Infrastructure
        blocks:
          - type: paragraph
            body: >-
              Stoke executes an operating model centered on rapid design iteration and co-located fabrication across
              Washington state, paired with orbital launch infrastructure at Cape Canaveral, Florida. Primary vehicle
              design, additive manufacturing, avionics assembly, and internal tooling development occur at its
              168,000-square-foot facility in Kent, Washington, supported by proprietary manufacturing software
              including the Boltline tracking product. Propulsion testing and structural qualifications take place at a
              dedicated 75-acre test site in Moses Lake, Washington, where first-stage structural proto-qualification
              was completed over a three-week campaign in June 2026 spanning 46 individual test runs across fluid,
              avionics, and pressure limit envelopes. For orbital operations, Stoke acquired and refurbished historic
              Space Launch Complex 14 (SLC-14) at Cape Canaveral Space Force Station, incorporating a 32-meter
              deep-piling launch mount rated for 5.3 MN liftoff thrust and a 37-meter umbilical tower. Following capital
              expansion via its $1 billion Series E financing in September 2026, Stoke scheduled the debut orbital
              launch of Nova Pathfinder from SLC-14 for early 2027, with the larger Nova Block 2 system targeting first
              flight in 2029.
            claimRefs:
              - CE011
              - CE012
              - CE014
              - CE015
              - CE016
