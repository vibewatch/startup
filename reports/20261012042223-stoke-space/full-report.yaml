  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Core Thesis Argument
      - Anti-Thesis Counter-Argument
      - View Change Trigger
    rows:
      - - Upper-Stage Reusability
        - >-
          Nova's regeneratively cooled metallic heat shield eliminates thermal tile maintenance and enables full
          stage-two reuse for high-cadence orbital return.
        - >-
          Actively cooled metallic reentry in orbital conditions remains unproven in spaceflight; thermal fatigue or
          weight penalties could impair payload fraction.
        - Successful orbital reentry and recovery of Nova Pathfinder second stage with verified inspection turnaround.
      - - Market Demand & Capacity
        - >-
          Severe U.S. launch capacity shortage and reliance on SpaceX create urgent commercial and DoD demand for
          sovereign medium-lift redundancy.
        - >-
          Dominant incumbents like SpaceX Falcon 9 and emerging rivals like Rocket Lab Neutron and Blue Origin New Glenn
          capture anchor manifests.
        - >-
          Public disclosure of firm, multi-launch commercial constellation contracts with non-refundable milestone
          deposits.
      - - Capital & Runway
        - >-
          $2.3B in cumulative equity funding and participation from top-tier institutional sponsors provide adequate
          runway to orbital demonstration.
        - >-
          Extreme capital intensity of rocket manufacturing and fixed launch complex infrastructure creates rapid burn
          rate against fixed debt obligations.
        - Demonstrated recurring launch cadence without requiring dilutive down-rounds or emergency bridge financing.
      - - Regulatory & Pad Readiness
        - >-
          Refurbished Launch Complex 14 at Cape Canaveral provides dedicated infrastructure for high-frequency East
          Coast orbital launches.
        - >-
          Mandatory FAA Part 450 licensing and congested Florida airspace corridors threaten severe launch manifest
          delays and cost overruns.
        - Receipt of unconditional FAA Part 450 vehicle operator license and cleared range safety approvals for LC-14.
    notes: >-
      Arguments evaluate full-system reusability versus capital burn, competitive incumbent pressure, and regulatory
      timeline risks.
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV007
      - CV009
      - CV011
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core Operating Assumptions
      - Valuation / Return Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Nova Pathfinder succeeds in 2027; Nova Block 2 ramps to 15 t LEO by 2029; captures significant NSSL Phase 3
          Lane 1 task orders and constellation manifests.
        - >-
          Enterprise valuation expands past $15B-$20B as the sole operational fully reusable medium-lift provider
          besides SpaceX Starship; 2.0x-3.0x return.
        - Rapid execution by SpaceX Starship and Rocket Lab Neutron; technical yield issues on metallic heat shield.
        - 25% (requires flawless orbital demonstration and rapid customer backlog conversion)
      - - Base Case
        - >-
          Pathfinder completes initial test flights in 2027-2028 with flight delays; partial commercial manifest
          conversion; Block 2 slips toward 2030.
        - >-
          Valuation holds flat or adjusts to $6B-$8B range; requires additional capital raise with moderate dilution
          before commercial cash breakeven.
        - >-
          Prolonged FAA Part 450 launch licensing bottlenecks and East Coast range congestion; vehicle reflight
          turnaround exceeds projections.
        - 55% (consistent with historical aerospace hardware maturation and launch licensing cadence)
      - - Bear Case
        - >-
          Pathfinder suffers launch or reentry failure; upper-stage recovery proves unviable; debt facility covenants
          pressure liquidity; launch schedule slips past 2028.
        - >-
          Down-round restructuring or distressed recapitalization below $3B; existing equity suffers severe dilution or
          liquidation preference cram-down.
        - >-
          $100M SVB debt maturity pressure, capital exhaustion amid high fixed facility burn, and customer migration to
          Falcon 9 or Neutron.
        - 20% (reflects aerospace technical failure risk prior to operational orbital flight heritage)
    notes: >-
      Probability-weighted scenarios based on reported $9B-$10B private valuation baseline, technical milestones, and
      comparative launch sector discount rates.
