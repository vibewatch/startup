  - id: FU001
    title: 'Customer Journey Map: From Government Co-Development to High-Cadence Orbital Service'
    type: journey-map
    summary: >-
      Six-stage adoption journey tracing customer qualification from early federal R&D grants to recurring commercial
      constellation launch services.
    data:
      items:
        - label: 'Stage 1: Foundational R&D & Tech Maturation'
          touchpoints:
            - NSF SBIR Phase I propulsion grant ($225,000 in May 2020)
            - NASA Ames collaborative aerodynamic testing for metallic heat shield
          stakeholders: Civil space agencies, government research labs
          friction: Strict technical review gates and zero commercial flight volume
        - label: 'Stage 2: Ground Infrastructure & Pad Allocation'
          touchpoints:
            - Space Launch Complex 14 pad allocation at Cape Canaveral in 2023
            - Moses Lake 550-acre rocket test stand expansion
          stakeholders: Cape Canaveral Space Force Station, local airport authority
          friction: Heavy fixed capital expenditure and environmental / pad construction approvals
        - label: 'Stage 3: Defense Procurement Onboarding'
          touchpoints:
            - Selection onto $5.6B NSSL Phase 3 Lane 1 IDIQ contract vehicle
            - DoD security clearance and technical integration audits
          stakeholders: U.S. Space Force, Defense Innovation Unit
          friction: High compliance overhead and task-order competition against established incumbents
        - label: 'Stage 4: Maiden Commercial Manifesting'
          touchpoints:
            - AstroForge deep-space prospecting spacecraft manifested on Pathfinder
            - Heliocentric orbital injection flight profile targeting early 2027
          stakeholders: Commercial exploration startups, payload aggregators
          friction: Flight qualification risk and potential schedule slip on debut vehicle launch
        - label: 'Stage 5: Flight Demonstration & Recovery Proving'
          touchpoints:
            - Nova Pathfinder orbital test flights across 2027 and 2028
            - Booster landing and active upper-stage reentry survival trials
          stakeholders: Commercial satellite operators, space insurers, FAA licensing authorities
          friction: FAA Part 450 commercial launch licenses and unproven orbital heat shield survival
        - label: 'Stage 6: Industrial-Scale Constellation Cadence'
          touchpoints:
            - Nova Block 2 debut with 15-metric-ton LEO capacity in 2029
            - Recurring multi-launch constellation replenishment contracts
          stakeholders: LEO broadband constellation operators, defense constellation primes
          friction: Competition from SpaceX Starship/Falcon 9, Blue Origin New Glenn, and Rocket Lab Neutron
