      - number: '5.2'
        title: Reusable Upper Stage, Regenerative Cooling, and Thermal Protection
        blocks:
          - type: paragraph
            body: >-
              The core technical differentiator of the Nova architecture is its second stage, which eliminates
              single-use thermal protection systems and fragile ceramic tiles in favor of a liquid-hydrogen-cooled
              metallic heat shield. Powered by the Andromeda propulsion system fueled by liquid hydrogen and liquid
              oxygen (LH2/LOX), the upper stage utilizes a distributed perimeter ring of 3D-printed thrust chambers
              integrated directly around the outer boundary of the metallic blunt-body shield. During atmospheric
              reentry, cryogenic hydrogen coolant circulates through internal microchannels within the metallic
              structure, absorbing peak convective aero-thermal flux before being routed through the closed expander
              cycle engine. Pitch, yaw, and roll attitude control during descent are achieved via differential thrust
              throttling across the distributed thrust chambers rather than mechanical gimbal actuators, simplifying
              stage mechanics. While subscale static firings and a 30-foot low-altitude hopper flight demonstrated the
              basic fluidics and differential steering mechanism in 2023, full orbital entry survival and thermal
              cycling integrity remain unvalidated prior to Pathfinder's orbital debut.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE002
