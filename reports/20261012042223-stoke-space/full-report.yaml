  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Technical and Operational Reentry Risk
        blocks:
          - type: paragraph
            body: >-
              Stoke Space's central architectural differentiation is 100% full reusability across both booster and upper
              stage, but returning an orbital upper stage through atmospheric reentry introduces unprecedented thermal,
              aerothermal, and mechanical stresses. The company has conducted suborbital low-altitude hop tests with
              Hopper2 demonstrating differential engine steering and active heat shield cooling, alongside hotfire tests
              of its first-stage Zenith engine. However, surviving orbital entry velocities remains an unproven
              technical challenge that represents Stoke's primary operational hurdle. Reentry failures would compromise
              flight cadence, inflate turnaround times, and destroy capital-intensive flight hardware before commercial
              stabilization. In addition, scaling production across the Moses Lake testing grounds and Kent facility
              requires stringent quality controls to prevent propulsion degradation under sustained high-cadence flight
              conditions.
            claimRefs:
              - CR001
              - CR002
