    title: Technology and Operating Architecture Decomposition
    columns:
      - System Layer / Process
      - Core Functional Role
      - Key Technology & Subsystem Dependencies
      - Critical Technical & Execution Risks
    rows:
      - - Booster Propulsion (Zenith Engine)
        - Primary ascent liftoff thrust and boostback maneuvers
        - Full-flow staged combustion cycle; methane/LOX turbomachinery; regenerative cooling
        - Turbine seal durability, high-pressure oxidizer-rich gas metallurgy, multi-engine cluster dynamics
      - - Upper Stage Propulsion (Andromeda)
        - Orbital insertion, attitude vectoring, and deorbit burns
        - Closed expander cycle; cryogenic LH2/LOX; 3D-printed thruster ring with 24 chambers
        - Differential throttling response transients; hydrogen embrittlement; expander heat-transfer limits
      - - Thermal Protection (Active Reentry Shield)
        - Protects second stage and payload bay during hypersonic atmospheric reentry
        - Active liquid regenerative cooling channels; metallic alloy faceplate; passive failure modes
        - Coolant channel clogging, micro-meteoroid impact damage, thermal shock cycles across repeated flights
      - - Structures & Airframe Fabrication
        - Lightweight propellant storage and atmospheric dynamic load reaction
        - Stainless steel/metallic alloy tanks; automated pressure control; in-house manufacturing in Kent, WA
        - Mass fraction margins between structural robustness and payload capacity to orbit
      - - Launch & Pad Infrastructure (SLC-14)
        - Vehicle erection, cryogenic propellant loading, launch release, and umbilical management
        - 5.3 MN launch mount; 37m umbilical tower; LH2/LNG storage farms; automated pad sequencing
        - Simultaneous cryogenic handling hazards (LH2 + LNG); coastal corrosion; range scheduling conflicts
    notes: >-
      Decomposition reflects engineering milestones achieved at Kent, WA, Moses Lake, WA, and Cape Canaveral, FL through
      late 2026.
