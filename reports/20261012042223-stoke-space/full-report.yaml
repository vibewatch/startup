      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Reusable Upper-Stage Engineering Paradigm
            body: >-
              While partially reusable rockets like Falcon 9 discard the upper stage on every flight, Stoke Space's
              engineering bet rests on full reusability using an actively cooled metallic heat shield. By circulating
              liquid hydrogen through the metallic baseplate rather than relying on brittle ceramic tiles, Stoke aims to
              eliminate labor-intensive tile inspection and replacement. If flight-proven, this architecture unlocks
              aircraft-like launch cadence; however, mastering expander-cycle differential steering and orbital reentry
              dynamics represents one of the steepest technical hurdles in modern rocketry.
            calloutType: insight
            claimRefs:
              - CE007
              - CE008
              - CE010
              - CE013
          - type: callout
            title: Schedule Slip to 2027 and Scaling Pressure for Block 2
            body: >-
              Stoke's maiden orbital flight target has slipped from original 2025 projections to late 2026 and now early
              2027, highlighting the immense complexity of dual-stage full reusability. Concurrently, the September 2026
              unveiling of Nova Block 2—a significantly larger 15-ton-to-LEO vehicle with a 14-engine first stage slated
              for 2029—introduces substantial scaling and manufacturing demands before the Pathfinder architecture has
              flown a single orbital mission.
            calloutType: risk
            claimRefs:
              - CE004
              - CE005
              - CE013
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Mission Profiles
        blocks:
          - type: paragraph
            body: >-
              Stoke Space targets four primary demand segments across the orbital transportation market: national
              security space launch, commercial low Earth orbit (LEO) satellite mega-constellations, deep space and
              planetary exploration, and in-space logistics including orbital mobility and return payload downmass. The
              defense segment represents the primary anchor market for medium-lift launch capacity, driven by the U.S.
              Space Force's requirement to maintain resilient, redundant access to orbit outside the incumbent SpaceX
              monopoly. In the commercial domain, high-cadence satellite constellation operators deploying replacement
              satellites and replenishment batches demand launch vehicles with flexible orbital insertion capabilities
              and high flight frequencies. Deep space science and private exploration represent an emerging secondary
              vertical, exemplified by commercial prospecting missions to the asteroid belt. Across all customer
              segments, Stoke positions its fully reusable Nova vehicle architecture to deliver lower cost per kilogram
              and higher flight availability than expendable or partially reusable alternatives, though commercial
              willingness to pay remains tied to flight verification.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
