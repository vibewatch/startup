chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Mission, and Core Architecture
        blocks:
          - type: paragraph
            body: >-
              Stoke Space Technologies, Inc. is an aerospace manufacturing and launch services company founded in
              October 2019 and headquartered in Kent, Washington. Co-founded by former Blue Origin propulsion engineers
              Andy Lapsa and Tom Feldman, the venture was established to address persistent launch shortages and high
              orbital delivery costs by developing a two-stage launch vehicle capable of 100% full and rapid
              reusability. Unlike traditional expendable rockets or partially reusable systems that discard their second
              stages after booster separation, Stoke Space is designing both stages of its flagship Nova rocket family
              for routine atmospheric reentry, vertical recovery, and rapid turnaround with aircraft-like operational
              cadence. The company operates a vertically integrated 168,000-square-foot design and manufacturing
              facility in Kent that houses vehicle engineering, component fabrication, and planned mission control
              operations. Ground test operations are anchored at an expanding 550-acre test site near the airport in
              Moses Lake, Washington, where extensive component, turbomachinery, and full-scale propulsion static fires
              are conducted. For orbital flight operations, Stoke Space was allocated Space Launch Complex 14 (SLC-14)
              at Cape Canaveral Space Force Station in Florida in March 2023, where launch infrastructure refurbishment
              and offshore booster recovery systems are currently progressing toward initial flight operations.
            claimRefs:
