      - number: '6.3'
        title: Named Customer Proof, Defense Contracts, and Research Deployments
        blocks:
          - type: paragraph
            body: >-
              Publicly confirmed customer engagements validate institutional interest across both government and
              commercial sectors. At the federal defense level, the U.S. Space Force awarded Stoke Space a prime
              contractor position on its $5.6 billion National Security Space Launch (NSSL) Phase 3 Lane 1
              indefinite-delivery/indefinite-quantity (IDIQ) contract vehicle. While Lane 1 eligibility allows Stoke to
              bid on task orders for defense satellite deployments, it does not guarantee funded mission awards prior to
              operational vehicle certification. In the civil research domain, NASA's Space Technology Mission
              Directorate selected Stoke for collaborative entry, descent, and landing testing at NASA Ames Research
              Center to mature the Nova upper stage's regeneratively cooled metallic heat shield, building upon earlier
              Small Business Innovation Research grant support from the National Science Foundation. Commercially, Stoke
              has manifested an asteroid prospecting spacecraft for California-based AstroForge on the maiden flight of
              Nova Pathfinder, proving early commercial demand for deep space exploration trajectories despite the
              unproven nature of commercial asteroid mining.
            claimRefs:
              - CU001
