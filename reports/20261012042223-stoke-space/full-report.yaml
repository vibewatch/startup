      - number: '6.4'
        title: Customer Adoption Barriers, Market Squeezing, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Stoke Space faces substantial customer procurement friction and market concentration risks as it
              transitions toward commercial operations. Market incumbent SpaceX holds a near-monopoly on commercial and
              government launch manifests, capturing anchor military awards including $739 million in exclusive Space
              Force task orders and leveraging its reusable Falcon 9 flight volume to lock in multi-year constellation
              contracts. Additionally, competing medium-lift reusable vehicles such as Rocket Lab's Neutron and Blue
              Origin's New Glenn are significantly closer to flight history, creating risk that commercial satellite
              operators commit backlog volume to rival platforms before Nova flies. Regulatory certification under FAA
              Part 450 safety rules and frequent airspace congestion at Cape Canaveral introduce potential manifest
              delays that could constrain flight frequency. Furthermore, carrying a $100 million debt facility alongside
              fixed manufacturing overhead amplifies burn pressure if customer revenue conversion is delayed beyond 2027
              orbital test milestones.
            claimRefs:
