              - CP012
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Reusability Bifurcation in Medium-Lift Launch
            body: >-
              While competing next-generation launchers such as Rocket Lab's Neutron and Blue Origin's New Glenn pursue
              partial first-stage reuse with expendable upper stages, Stoke Space is attempting complete 100% vehicle
              reusability. If technically validated, full upper-stage recovery eliminates the second-stage production
              cost floor, fundamentally altering marginal launch economics against partial-reuse incumbents.
            calloutType: insight
            claimRefs:
              - CP003
              - CP004
              - CP007
          - type: callout
            title: Incumbent Preemption and Cape Canaveral Airspace Friction
            body: >-
              Stoke Space faces severe incumbent preemption as SpaceX commands dominant federal and commercial launch
              backlogs. Furthermore, mandatory FAA Part 450 compliance and congested Cape Canaveral range scheduling
              threaten to impose administrative delays, elevating cash burn while flight hardware remains grounded at
              Launch Complex 14.
            calloutType: risk
            claimRefs:
              - CP010
              - CP012
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Near-Term Commercialization
        blocks:
          - type: paragraph
            body: >-
              Stoke Space’s commercial strategy is built upon the architectural thesis that complete reusability across
              both rocket stages is required to achieve the ultimate launch cost floor and enable aircraft-like flight
              availability. While commercial satellite constellation operators and emerging space mobility ventures form
              the primary long-term addressable market, Stoke’s near-term revenue generation relies predominantly on
              structured government development contracts and military launch vehicles. Selection by the U.S. Space
              Force for the National Security Space Launch (NSSL) Phase 3 Lane 1 procurement framework opens competitive
              access to an indefinite-delivery pool valued at up to $5.6 billion through 2029. In addition, research and
              development awards from the Defense Innovation Unit, NASA, and the National Science Foundation provide
              non-dilutive milestone funding that validates Stoke's propulsion and active cooling technologies while
              offsetting heavy early capital expenditures. However, because commercial orbital launches remain scheduled
              for 2027 with Pathfinder and 2029 with Block 2, commercial launch service revenue remains pre-operational,
              and signed customer deposit terms remain closely held private data.
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI005
      - number: '4.2'
        title: Pricing Structure and Competitive Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Stoke Space has not publicly published a fixed list price for dedicated Nova Pathfinder or Nova Block 2
              orbital flights, adhering to the aerospace industry practice of privately negotiated launch agreements
              tailored to specific mission profiles, orbital parameters, and integration complexities. In the
              medium-lift commercial launch segment, established alternatives such as Rocket Lab's Neutron vehicle have
              signaled target list pricing in the $50 million to $55 million range for 13 metric tons to low Earth
              orbit. For Stoke Space to establish commercial market share against entrenched incumbents like SpaceX's
              Falcon 9 and upcoming partially reusable entrants, Nova must achieve a levelized cost floor that offsets
              the operational switching costs of prospective constellation customers. Early flight contracts, such as
              the initial demonstration missions carrying AstroForge and Celestis payloads, likely incorporate
              significant developmental discounts and promotional commercial terms rather than steady-state commercial
              pricing. Until Stoke demonstrates repeatable orbital recovery and publishes formal schedule tariffs,
              commercial pricing power remains an unverified diligence assumption.
            claimRefs:
              - CI003
              - CI014
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI014
      - number: '4.3'
        title: Capital Requirements and Financing Trajectory
        blocks:
          - type: paragraph
            body: >-
              Orbital launch vehicle development demands extraordinary upfront capital expenditure, long lead-time
              component procurement, and extensive dedicated test infrastructure. Stoke Space has secured substantial
              private backing to fund its capital program, raising $510 million in Series D equity alongside a $100
              million credit facility from Silicon Valley Bank, followed by an expansion to $860 million in equity. The
              financing trajectory culminated in September 2026 with an initial closing of a $1 billion Series E round
              that lifted cumulative capital raised to $2.3 billion at a reported pre-money valuation of roughly $9
              billion. While Company Overview outlines the historical round-by-round chronology of these financings,
              from a forward capital adequacy perspective this substantial cash cushion must absorb extensive
              infrastructure commitments. Capital allocations have been concentrated on completing the full renovation
              and pad activation of Launch Complex 14 at Cape Canaveral Space Force Station, expanding propulsion
              manufacturing facilities in Kent, Washington, and funding development of the higher-capacity Nova Block 2
              vehicle targeting 2029.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI010
              - CI011
      - number: '4.4'
        title: Unit Economics and Diligence Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              From an underwriting perspective, evaluating Stoke Space requires navigating significant opacity
              surrounding vehicle unit economics and stage turnaround expenses. Unlike software enterprises that can
              readily moderate burn rates in response to adverse capital markets, aerospace manufacturers carry heavy
              fixed overhead, specialized workforce commitments, and multi-year supply contracts that resist rapid cost
              cutting. No aerospace enterprise has yet demonstrated the operational viability or economics of routine
              orbital second-stage recovery; if Stoke’s regeneratively cooled metallic heatshield requires unexpected
              post-flight refurbishment or lengthy inspection cycles, the promised marginal cost advantages of
              dual-stage reusability will compress substantially. Without independent verification of bill-of-materials
              costs for the Zenith first stage, refurbishment expenses for the Andromeda upper stage, or realized
              cadence at Launch Complex 14, underwriting Stoke’s financial returns requires treating unit margin
              projections as highly speculative pending orbital flight demonstration data.
            claimRefs:
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI012
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Hardware Capital Intensity and Execution Risk
            body: >-
              Unlike software companies capable of flexing operating expenses, Stoke Space's capital-intensive aerospace
              model commits massive upfront capital to launch pad construction, engine tooling, and cryogenic testing.
              In the absence of orbital revenue, prolonged flight test delays or unexpected development setbacks risk
              rapid cash burn before reaching commercial flight cadence.
            calloutType: risk
            claimRefs:
              - CI012
              - CI013
          - type: callout
            title: Dual-Stage Reusability Cost Floor Thesis
            body: >-
              Stoke Space's long-term margin thesis depends fundamentally on successfully recovering and rapidly reusing
              the second stage. While partial reuse achieves launch cost reductions, upper-stage expendability leaves an
              irreducible hardware replacement cost per flight that Stoke seeks to eliminate.
            calloutType: insight
            claimRefs:
              - CI001
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Launch Vehicle Architecture and Propulsion Systems
        blocks:
          - type: paragraph
            body: >-
              Stoke Space's flagship product is Nova, a medium-lift orbital launch vehicle designed for complete and
              rapid reusability across both its first and second stages. The initial flight configuration, designated
              Nova Pathfinder, stands 40.2 meters tall with a 4.2-meter diameter and is designed to deliver up to 3,000
              kg to low-Earth orbit (LEO) in a fully reusable profile and 7,000 kg when expended, alongside 2,500 kg to
              geostationary transfer orbit (GTO) and 1,250 kg to translunar injection (TLI). First-stage boost
              propulsion relies on seven Stoke-developed Zenith engines burning liquefied natural gas (LNG) and liquid
              oxygen (LOX) in a full-flow staged combustion (FFSC) cycle, producing 3,110 kN of sea-level liftoff
              thrust. The FFSC cycle minimizes soot accumulation and turbine stress, lowering refurbishment burdens
              between flights. In September 2026, Stoke announced Nova Block 2, a scaled 15-metric-ton LEO configuration
              utilizing a 5-meter payload fairing and 14 first-stage Zenith engines generating over 1,700,000 lbf of
              thrust, establishing an upgrade path from Pathfinder's initial flight demonstration.
