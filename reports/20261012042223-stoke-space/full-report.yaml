      - number: '6.2'
        title: Adoption Trajectory, Manifest Timelines, and Capital Scale
        blocks:
          - type: paragraph
            body: >-
              Because Stoke Space is in the pre-launch development phase, conventional software customer metrics such as
              net revenue retention, active subscriber accounts, and recurring customer churn are not applicable.
              Instead, customer adoption is measured through ground qualification milestones, launch site infrastructure
              readiness, and progress along its flight test manifest. Supported by an initial $1 billion Series E
              financing round closed in September 2026, which elevated total lifetime equity and debt capital raised to
              $2.3 billion, Stoke has secured the financial runway required to complete vehicle testing and activate
              Launch Complex 14 at Cape Canaveral. The company's initial flight manifest targets the orbital debut of
              Nova Pathfinder in early 2027, followed by multi-flight demonstration campaigns across 2027 and 2028.
              Long-term customer capacity scaling hinges on Nova Block 2, a larger 15-metric-ton medium-lift rocket
              slated for debut in 2029 designed to support high-throughput constellation deployment and contested
              national security payloads at industrial volume.
            claimRefs:
