            body: >-
              While Stoke Space has secured access to the $5.6B Space Force NSSL Phase 3 Lane 1 program, converting
              eligibility into high-margin orbital missions requires demonstrating flight readiness before SpaceX and
              established medium-lift peers lock in long-term constellation manifests.
