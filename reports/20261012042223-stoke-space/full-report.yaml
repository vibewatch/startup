      - number: '2.3'
        title: Buyer Segmentation and Procurement Workflows
        blocks:
          - type: paragraph
            body: >-
              Procurement across Stoke Space's target segments splits between institutional defense buyers and
              commercial telecommunications operators. Institutional demand is led by the U.S. Space Force and Space
              Development Agency through task-order awards under NSSL Phase 3 Lane 1, where budget authority sits with
              Program Executive Officers seeking resilient, domestic launch redundancy. Commercial demand is
              concentrated among satellite constellation operators and commercial rideshare aggregators, who procure
              launches via multi-mission launch agreements to ensure timely deployment schedules. Both customer classes
              prioritize schedule certainty, launch cadence, and cost efficiency, though government customers require
              rigorous mission assurance and flight certification before transitioning operational defense payloads onto
              new vehicles.
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
