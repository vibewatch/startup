      - number: '7.3'
        title: Financial Model, Debt Structure, and Market Squeeze
        blocks:
          - type: paragraph
            body: >-
              Hardware rocketry demands immense capital intensity before operational profitability can be demonstrated.
              Although Stoke Space extended its Series D financing and subsequent rounds, the company carries structural
              obligations under a $100 million debt facility that imposes continuous servicing overhead ahead of
              commercial revenue stabilization. Unlike software companies, aerospace manufacturing cannot dynamically
              curtail capital expenditure without halting vehicle production and pad activation. Furthermore, Stoke must
              compete for commercial payloads and NSSL defense task orders against entrenched incumbents with
              established flight heritage, risking severe market squeeze if orbital demonstrations face delays or cost
              overruns.
            claimRefs:
