company:
  name: "Stoke Space"
chapter:
  number: 6
  title: "Customers"
  summary: "Stoke Space's commercial and defense customer strategy pairs anchor eligibility on the U.S. Space Force's $5.6B NSSL Phase 3 Lane 1 contract with pre-launch commercial flight commitments like AstroForge's deep-space prospecting mission. However, with no orbital flight heritage, undisclosed commercial contract values, and intense launch competition from SpaceX, Blue Origin, and Rocket Lab, customer adoption remains concentrated in pre-operational partnerships and unmonetized pipeline manifests."
sections:
  - id: "customer-segments-and-target-missions"
    title: "Customer Base Segmentation and Mission Profiles"
    body: "Stoke Space targets four primary demand segments across the orbital transportation market: national security space launch, commercial low Earth orbit (LEO) satellite mega-constellations, deep space and planetary exploration, and in-space logistics including orbital mobility and return payload downmass. The defense segment represents the primary anchor market for medium-lift launch capacity, driven by the U.S. Space Force's requirement to maintain resilient, redundant access to orbit outside the incumbent SpaceX monopoly. In the commercial domain, high-cadence satellite constellation operators deploying replacement satellites and replenishment batches demand launch vehicles with flexible orbital insertion capabilities and high flight frequencies. Deep space science and private exploration represent an emerging secondary vertical, exemplified by commercial prospecting missions to the asteroid belt. Across all customer segments, Stoke positions its fully reusable Nova vehicle architecture to deliver lower cost per kilogram and higher flight availability than expendable or partially reusable alternatives, though commercial willingness to pay remains tied to flight verification."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-capital-runway"
    title: "Adoption Trajectory, Manifest Timelines, and Capital Scale"
    body: "Because Stoke Space is in the pre-launch development phase, conventional software customer metrics such as net revenue retention, active subscriber accounts, and recurring customer churn are not applicable. Instead, customer adoption is measured through ground qualification milestones, launch site infrastructure readiness, and progress along its flight test manifest. Supported by an initial $1 billion Series E financing round closed in September 2026, which elevated total lifetime equity and debt capital raised to $2.3 billion, Stoke has secured the financial runway required to complete vehicle testing and activate Launch Complex 14 at Cape Canaveral. The company's initial flight manifest targets the orbital debut of Nova Pathfinder in early 2027, followed by multi-flight demonstration campaigns across 2027 and 2028. Long-term customer capacity scaling hinges on Nova Block 2, a larger 15-metric-ton medium-lift rocket slated for debut in 2029 designed to support high-throughput constellation deployment and contested national security payloads at industrial volume."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU006"
      - "CU007"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU002"
  - id: "named-customer-commitments-and-procurement"
    title: "Named Customer Proof, Defense Contracts, and Research Deployments"
    body: "Publicly confirmed customer engagements validate institutional interest across both government and commercial sectors. At the federal defense level, the U.S. Space Force awarded Stoke Space a prime contractor position on its $5.6 billion National Security Space Launch (NSSL) Phase 3 Lane 1 indefinite-delivery/indefinite-quantity (IDIQ) contract vehicle. While Lane 1 eligibility allows Stoke to bid on task orders for defense satellite deployments, it does not guarantee funded mission awards prior to operational vehicle certification. In the civil research domain, NASA's Space Technology Mission Directorate selected Stoke for collaborative entry, descent, and landing testing at NASA Ames Research Center to mature the Nova upper stage's regeneratively cooled metallic heat shield, building upon earlier Small Business Innovation Research grant support from the National Science Foundation. Commercially, Stoke has manifested an asteroid prospecting spacecraft for California-based AstroForge on the maiden flight of Nova Pathfinder, proving early commercial demand for deep space exploration trajectories despite the unproven nature of commercial asteroid mining."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU003"
  - id: "adoption-friction-and-concentration-risks"
    title: "Customer Adoption Barriers, Market Squeezing, and Concentration Risks"
    body: "Stoke Space faces substantial customer procurement friction and market concentration risks as it transitions toward commercial operations. Market incumbent SpaceX holds a near-monopoly on commercial and government launch manifests, capturing anchor military awards including $739 million in exclusive Space Force task orders and leveraging its reusable Falcon 9 flight volume to lock in multi-year constellation contracts. Additionally, competing medium-lift reusable vehicles such as Rocket Lab's Neutron and Blue Origin's New Glenn are significantly closer to flight history, creating risk that commercial satellite operators commit backlog volume to rival platforms before Nova flies. Regulatory certification under FAA Part 450 safety rules and frequent airspace congestion at Cape Canaveral introduce potential manifest delays that could constrain flight frequency. Furthermore, carrying a $100 million debt facility alongside fixed manufacturing overhead amplifies burn pressure if customer revenue conversion is delayed beyond 2027 orbital test milestones."
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
    figureRefs:
      - "FU001"
