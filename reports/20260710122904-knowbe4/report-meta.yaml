companyProfile:
  summary: KnowBe4 is a Clearwater-based cybersecurity company founded by Stu Sjouwerman in 2010 that built a category-leading security-awareness and phishing-simulation platform and later expanded into human-risk management, email response, and cloud email security. Public evidence supports real scale, broad customer adoption, and durable recurring revenue, but the company now sits inside a leveraged sponsor-owned structure with much less disclosure than it offered as a public company.
  foundedDate: '2010-01-01'
  founders:
  - name: Stu Sjouwerman
    role: Founder
    background: Serial security-software entrepreneur and former Sunbelt Software co-founder.
    claimRefs:
    - CO001
  foundingLocation: Clearwater, Florida, USA
  headquarters: Clearwater, Florida, USA
  productSummary: Security-awareness training, phishing simulation, risk scoring, response tooling, and cloud email-security products aimed at reducing human-driven cyber risk.
  customerFocus: SMB, mid-market, enterprise, public sector, and education organizations that need scalable human-risk and phishing-defense workflows.
  businessModel: Recurring subscription software with expansion into adjacent modules such as PhishER, SecurityCoach, and Egress-derived email security.
  stage: PE-backed private / unicorn
  fundingStatus: Taken private by Vista Equity Partners in February 2023 at a roughly $4.6 billion headline valuation; refinanced approximately $1.46 billion of debt in July 2025.
