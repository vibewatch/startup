- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - current workflow
  - company solution
  - measurable benefit
  - limitation
  rows:
  - - Provision and maintain users
    - Sync workforce identities into console
    - ADI / GUP / SCIM provisioning and SAML SSO
    - Reduces manual user management and keeps campaigns current
    - SCIM is one-way and alias-email support is limited
  - - Establish baseline phishing risk
    - Run initial tests and create starting benchmark
    - Baseline phishing plus initial Phish-prone Percentage measurement
    - Creates program benchmark and segmentation starting point
    - Depends on whitelisting and mail-delivery setup
  - - Run ongoing education
    - Assign and refresh training over time
    - AIDA Orchestration plus ModStore content
    - Cuts admin effort and keeps content personalized
    - AI logic and targeting transparency are not fully public
  - - Coach risky behavior in real time
    - Turn live events into micro-interventions
    - SecurityCoach with vendor detection rules
    - Moves training from annual events to in-the-flow nudges
    - Requires supported external security-tool telemetry
  - - Triage reported suspicious email
    - Prioritize, quarantine, and learn from user-reported phish
    - PhishER Plus, PhishML, PhishRIP, PhishFlip
    - Potentially faster response and closed-loop training
    - Best functionality appears strongest on Microsoft 365
  notes: The platform is best analyzed through how it fits the customer workflow, not by content-count alone.
