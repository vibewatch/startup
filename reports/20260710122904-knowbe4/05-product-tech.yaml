chapter:
  number: 5
  title: Product & Technology
  summary: KnowBe4 has evolved from a phishing-simulation and awareness product into a broader human-risk-management stack with AI orchestration, real-time coaching, and post-delivery phishing response. The platform is functionally broad and operationally mature, but its value increasingly depends on integrations, telemetry quality, and the speed with which KnowBe4 can unify adjacent products such as Egress and PhishER Plus.
sections:
- id: workflow-definition
  title: KnowBe4 sells a workflow, not just a course catalog
  body: 'KnowBe4’s product is best understood as a continuous employee-risk workflow rather than a one-time training library. The onboarding materials, SAT feature pages, and AIDA materials all describe a sequence that starts with user provisioning, establishes a phishing baseline, runs ongoing tests, assigns training, and then adds automated remediation or real-time coaching. That workflow is reinforced by the learner app, the ModStore content library, and SmartRisk-linked orchestration. The result is a platform designed to move from baseline awareness to repeated measurement and intervention.


    The company’s breadth is visible in how many adjacent modules feed the same workflow. SecurityCoach turns third-party security events into just-in-time user coaching. PhishER Plus turns reported phishing emails into prioritized response queues, quarantine actions, and even re-usable training. AIDA attempts to automate much of the admin burden across campaign creation, refreshers, and phishing personalization. Egress extends the workflow farther into cloud email security and adaptive policy. This breadth is a real product advantage, but it also means the customer experience depends on how well identity systems, email platforms, and external security tools are connected.'
