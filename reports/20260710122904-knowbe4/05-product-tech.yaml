- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer / component
  - role
  - dependency
  - risk
  rows:
  - - Identity sync
    - Provision users and groups
    - SCIM / ADI / GUP / IdP configuration
    - Directory errors or alias constraints can impair user-state accuracy
  - - Mail-flow setup
    - Enable phishing delivery and tracking
    - Whitelisting and email-environment compatibility
    - Misconfiguration can distort baseline and ongoing simulation accuracy
  - - SecurityCoach integrations
    - Ingest security events for coaching
    - CrowdStrike, Zscaler, Splunk and other external vendors
    - Outside API or telemetry changes can degrade functionality
  - - PhishER Plus remediation
    - Remove or prioritize malicious messages
    - Microsoft 365 / Google Workspace integrations and syslog/API connections
    - Cross-platform parity may be uneven
  - - Analytics and reporting
    - Show user and program outcomes
    - Internal dashboards plus reporting API surface
    - Public developer surface appears stronger for reporting than full write automation
  - - Cloud infrastructure and release pipeline
    - Operate SaaS product safely at scale
    - AWS / Azure, CI/CD, monitoring, QA, logging
    - Architecture is described operationally, but no deep public design spec exists
  notes: The major architecture insight is dependence on identity, mail, and telemetry integrations rather than customer-side code customization.
