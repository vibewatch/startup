  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: aida-architecture
    missingEvidence: Detailed public documentation of AIDA model providers, data-processing boundaries, and AI governance architecture.
    whyItMatters: AIDA is central to product differentiation, but public evidence remains much stronger on use cases than on technical implementation or risk controls.
    diligencePath: Request architecture review, model-vendor disclosures, AI governance docs, and regional data-processing diagrams.
    relatedQuestionRefs:
    - QE019
    - QE020
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: api-surface
    missingEvidence: Clear public documentation of write-capable user-management or automation APIs beyond the visible reporting surface.
    whyItMatters: Programmatic extensibility affects enterprise integration depth and the platform's ability to act as a broader HRM operating layer.
    diligencePath: Obtain full API documentation, endpoint inventory, and rate-limit / auth controls from the developer team.
    relatedQuestionRefs:
    - QE014
    relatedTableRefs:
    - TE003
  - type: conflicting-data
    severity: material
    topic: cross-platform-parity
    missingEvidence: Normalized parity evidence across Microsoft 365, Google Workspace, and other ecosystems for remediation and coaching features.
    whyItMatters: Customers on different platforms may receive different product depth, which directly affects competitive positioning and realized ROI.
    diligencePath: Run feature-by-feature demos and customer references by email environment.
    relatedQuestionRefs:
    - QE018
    - QE021
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: egress-unification
    missingEvidence: Roadmap milestones and commercial packaging for full Egress-plus-KnowBe4 console unification.
    whyItMatters: The acquisition expands the product story, but current public evidence suggests unification is still partial.
    diligencePath: Request roadmap, product packaging plan, and integration KPI tracking.
    relatedQuestionRefs:
    - QE016
    - QE025
    relatedTableRefs:
    - TE005
