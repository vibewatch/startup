      - number: '7.2'
        title: The North Korea incident was contained, but it remains a serious operating-warning signal
        blocks:
          - type: paragraph
            body: >-
              KnowBe4 deserves credit for catching the fake-hire incident quickly, but the event is still material. The
              company said it hired a worker using a stolen identity after multiple interviews, reference checks, and
              background checks, then saw malware activity begin as soon as the laptop was received. EDR and SOC
              controls worked, yet the fact pattern is still uncomfortable because it shows how even a security vendor
              can be penetrated through HR and identity-control weaknesses. The broader U.S. enforcement record makes
              the risk harder to dismiss. DOJ, FBI, Treasury, State, and IC3 materials all describe DPRK-linked
              remote-worker schemes as active, adaptive, and tied not only to wage diversion but also to data theft and
              extortion. That means the reputational lesson is wider than one anecdote: workforce integrity, hiring
              verification, device-shipping controls, and privileged-access segmentation are now board-level security
              issues. For a company selling human-risk management, a repeat episode would be disproportionately damaging
              even if the technical blast radius were contained again.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
