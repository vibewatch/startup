      - number: '1.3'
        title: Ownership, credit structure, and milestone chronology
        blocks:
          - type: paragraph
            body: >-
              The capital story is unusually important because KnowBe4’s public-equity chapter ended with a sponsor
              acquisition and later refinancing. SEC merger materials and closing releases show Vista agreed to pay
              $24.90 per share in cash, a 44% premium to the unaffected September 16, 2022 close, and completed the
              acquisition on February 1, 2023, taking KnowBe4 off Nasdaq. Since then, the company has continued to
              reshape its platform and capital stack. The about-us history highlights a 2019 KKR-led $300 million round
              and the April 2021 IPO, while official product history shows launches such as PhishER, SecurityCoach,
              AIDA, and Agent Risk Manager. Strategic scope widened again when KnowBe4 completed its acquisition of
              Egress in July 2024 to add adaptive cloud email security. By July 2025 the business had also moved through
              a major refinancing: Fitch initiated coverage at B/Stable, later affirmed the issuer at B while noting an
              upsized $1.46 billion first-lien term loan and a $200 million revolver, and Private Equity Wire reported a
              materially lower spread than the prior private-credit debt. That combination points to a scaled,
              recurring-revenue software asset owned and governed with private-equity leverage rather than public-market
              transparency.
