            body: >-
              The publicly visible trust posture is stronger than the average awareness vendor. KnowBe4’s security
              statement describes CI/CD, peer review, staging separation, centralized encrypted logging, monthly
              vulnerability scanning, formal remediation timelines, and a private bug bounty program. The same materials
              also reference third-party audits and compliance programs including FedRAMP, ISO 27001, and SOC 2. The
              product-side signal matters because KnowBe4 increasingly touches production workflows such as real-time
              coaching, user provisioning, suspicious-message handling, and integrated email response.


              At the same time, some of the most strategically important technical details remain vague. AIDA is clearly
              central to KnowBe4’s roadmap, but the public pages do not explain model providers, inference boundaries,
