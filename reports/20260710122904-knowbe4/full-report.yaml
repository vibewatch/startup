      - number: '5.2'
        title: The operating model is cloud-first, identity-led, and integration-dependent
        blocks:
          - type: paragraph
            body: >-
              KnowBe4’s architecture is operationally pragmatic rather than exotic. The support documentation shows that
              user identity is synchronized from external systems via ADI, Google provisioning, or SCIM, with SCIM
              acting as a one-way identity feed into the KSAT console. SAML SSO is supported, and the onboarding guide
              makes clear that implementation begins with domain verification, user provisioning, whitelisting, and
              phishing deliverability checks. In other words, deployment depends on identity hygiene and mail-flow
              configuration more than on customer-side code changes.


              The more advanced layers depend heavily on third-party security telemetry. CrowdStrike, Zscaler, and
              similar integrations feed SecurityCoach detection rules and real-time coaching. PhishER Plus depends on
              Microsoft 365 or Google Workspace for quarantine and remediation workflows, and its community intelligence
              claims depend on network effects from a large user base. This architecture is powerful because it lets
              KnowBe4 connect learning to live security behavior, but it also creates clear dependency risk: customers
              with thin security stacks get less value, customers on different email ecosystems may see uneven
              functionality, and roadmap success depends on maintaining many outside integrations.
