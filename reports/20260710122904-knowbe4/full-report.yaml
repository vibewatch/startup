      - number: '1.2'
        title: Leadership transition, global footprint, and governance signals
        blocks:
          - type: paragraph
            body: >-
              Leadership is one of the biggest changes since the company went private. KnowBe4’s April 2025 release
              appointed Bryan Palma as president and chief executive officer effective May 5, 2025, while founder Stu
              Sjouwerman moved into the executive-chairman role. Palma’s background matters because the company is no
              longer run day to day by the founder who built its original awareness-training category position; the new
              CEO is a scaled-enterprise operator whose most recent prior role was leading Trellix. Sjouwerman
              nonetheless remains strategically important, both because he founded KnowBe4 in 2010 and because he was
              explicitly tasked with helping guide artificial-intelligence innovation after the transition. The
              company’s visible footprint is global but only partly quantified. A workplace-awards release shows Great
              Place to Work certifications across 11 countries and explicitly names offices or operating presence across
              the United States, United Kingdom, South Africa, Australia, UAE, Singapore, Netherlands, Japan, India,
              Germany, and Brazil. What the public package still does not provide is a clean 2026 board roster,
              investor-control map, or exact headcount. Third-party directories place the workforce somewhere in the
              low-thousands, but the company does not publish a definitive count on its official pages.
            claimRefs:
