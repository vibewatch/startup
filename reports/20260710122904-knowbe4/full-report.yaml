      - number: '7.3'
        title: Legacy merger litigation and elevated leverage keep the downside profile high
        blocks:
          - type: paragraph
            body: >-
              KnowBe4's legal and capital-structure risks are both meaningful. The amended Florida securities complaint
              and the continuing Delaware merger-litigation trail show that the take-private process remains under
              scrutiny long after closing. Even if these matters do not impair operations directly, they consume
              management attention and can force settlement, disclosure, or governance concessions. More immediately,
              Fitch's credit work makes clear that leverage is still high. KnowBe4 was rated B at the issuer level, its
              first-lien debt package was eventually marked down to B+ recovery terms after upsizing, and Fitch still
              expects leverage below 7.5x only gradually. The most important line in the rating commentary is not the
              rating itself but Fitch's view that private-equity ownership may prioritize return maximization over debt
              prepayment. That creates a classic sponsor-backed software risk: even with strong recurring revenue, the
              equity story can be pressured by leverage, refinancing cycles, and optionality around acquisitions rather
              than deleveraging.
