  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: The biggest strategic risk is not training demand collapse but workflow displacement
        blocks:
          - type: paragraph
            body: >-
              KnowBe4 still benefits from a large installed base and a real market need, yet the strategic threat has
              shifted. The most relevant competitive evidence is Abnormal's replacement case study, where a global
              manufacturer explicitly chose not to renew KnowBe4 after deciding that separate phishing training,
              reporting, and support loops created too much operational noise. That matters because it reframes the
              debate: the threat is not whether awareness matters, but whether awareness remains a standalone budget
              line or gets absorbed into broader email-security and response workflows. SMB survey data sharpens the
              point. Buyers are spending more on cybersecurity, but they are also under AI pressure, rely heavily on
              MSPs, and increasingly want robust, consolidated protection. Mordor's market work suggests that awareness
              budgets can be squeezed as organizations move dollars toward automated detection and XDR-style stacks. For
              KnowBe4, that means the bull case depends on continuing to expand beyond SAT into coaching, response, and
              email security quickly enough to prevent point-solution compression.
