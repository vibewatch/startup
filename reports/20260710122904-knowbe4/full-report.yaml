  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The 2023 take-private remains the main hard anchor, but 2025 debt matters too
        blocks:
          - type: paragraph
            body: >-
              Valuation starts with the facts that are actually observable. Vista agreed to acquire KnowBe4 for about
              $4.6 billion at $24.90 per share, a premium transaction that set the last truly hard external value
              marker. The 2022 disclosure set also showed a business that had reached roughly $90 million of quarterly
              revenue and $367.7 million of ARR by late 2022. That is enough to establish that KnowBe4 was a scaled
              recurring-revenue software company going into the take-private. The more recent 2025 refinancing matters
              because it confirms lender willingness to support a large sponsor-backed credit, and it meaningfully cut
              borrowing cost. But it is not a new equity valuation. In other words, the refi supports business viability
              and some enterprise-value resilience, yet it also reminds investors that capital structure is now central
              to the story. The clean read is that $4.6 billion is a real anchor, but it is a dated anchor and should
              not be mistaken for a self-updating mark.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV010
              - CV011
              - CV012
              - CV037
          - type: table
