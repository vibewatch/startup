      - number: '3.2'
        title: Capability differences increasingly center on workflow and telemetry, not baseline training content
        blocks:
          - type: paragraph
            body: >-
              There is clear feature overlap across the field: all material vendors promise phishing simulation,
              awareness content, reporting, and some form of personalization. That convergence matters because it
              weakens any argument that KnowBe4 has an uncontested feature monopoly in the core SAT workflow. The more
              durable distinctions now come from where each vendor connects awareness to adjacent systems. Proofpoint
              uses live threat intelligence, suspicious-message reporting, and email-security context to make training
              threat-informed. Mimecast similarly argues that awareness should sit inside a broader human-risk and
              email-defense stack. Cofense differentiates by connecting reporting behavior and post-delivery
              remediation, which is appealing to organizations where the SOC owns the awareness program.


              KnowBe4’s competitive answer is breadth and configuration. Its official pricing and features pages show
              support for unlimited phishing tests, AI-selected templates, user-event APIs, smart groups, executive
              reporting, SCIM and SSO, optional real-time coaching through SecurityCoach, and add-on anti-phishing
              through PhishER Plus. That is a wide control surface. But challengers are attacking specific weaknesses in
              the classic KnowBe4 playbook. Hoxhunt markets gamification and adaptive simulations as more effective for
              sustained engagement, SoSafe emphasizes behavioral science and European privacy or works-council fit, and
              CybSafe frames most legacy tools as overly focused on click rates rather than real behavior data. The
              result is a market where capability breadth favors KnowBe4, but narrative momentum in behavior-led HRM
              favors several challengers.
