        title: Exhibits
        blocks:
          - type: callout
            title: Why the stance is research-more, not buy
            body: >-
              The business looks real and resilient enough to deserve further work, but the decisive inputs for a
              conviction call—a current revenue base, EBITDA, net debt, and equity waterfall—are not public.
            calloutType: recommendation
