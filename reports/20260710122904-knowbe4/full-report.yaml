  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, scale, and operating model
        blocks:
          - type: paragraph
            body: >-
              KnowBe4’s current public identity is much broader than the security-awareness vendor label that defined
              the company during its IPO era. The homepage, platform page, and review surfaces all position the company
              around human risk management and increasingly around securing AI agents as well as human employees.
              Official pages describe a platform that combines awareness and compliance training, phishing simulation,
              crowdsourced anti-phishing, real-time coaching, cloud email security, and newer AI-defense agents. The
              headline scale signal is consistent across several recent sources: the homepage says the company has 15+
              years of behavior data and 70,000 global customers, the 2025 CEO-transition release says the company had
              grown to serve over 70,000 customers, and Fitch also describes a base of more than 70,000 customers
              globally. That scale is materially higher than the 56,000-organization figure disclosed in the February
              2023 take-private closing release, which indicates continued post-buyout expansion. Public location
              evidence is also consistent: KnowBe4 is based in Clearwater, Florida, and its headquarters address is
              listed as 33 N Garden Ave, Suite 1200.
