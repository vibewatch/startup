      - number: '7.4'
        title: The business can manage through these risks, but the stack is crowded
        blocks:
          - type: paragraph
            body: >-
              Bryan Palma did not inherit an unproven company; he inherited a scaled, sponsor-owned platform with over
              70,000 customers, a founder who remains executive chairman, and a business already extending beyond
              classic SAT. That gives the company mitigation capacity. Egress broadens the product set, the company
              responded transparently to the fake-hire incident, and recurring revenue still provides some resilience.
              The problem is simultaneity. Competitive workflow pressure, debt, litigation, leadership transition, and
              AI-era threat acceleration are all active at once. In isolation, each issue is manageable. In combination,
              they raise execution risk materially, because management cannot solve them with a single lever. The board
              and sponsor need to manage capital structure, product integration, hiring controls, and go-to-market
              evolution together. That is why the right conclusion is not panic but prioritization: KnowBe4 looks like a
              viable company with high operating risk, not a broken one. The difference matters for underwriting because
              it argues for close monitoring rather than an outright dismissal of the business.
            claimRefs:
