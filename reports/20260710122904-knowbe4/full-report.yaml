companyProfile:
  summary: >-
    KnowBe4 is a Clearwater-based cybersecurity company founded by Stu Sjouwerman in 2010 that built a category-leading
    security-awareness and phishing-simulation platform and later expanded into human-risk management, email response,
    and cloud email security. Public evidence supports real scale, broad customer adoption, and durable recurring
    revenue, but the company now sits inside a leveraged sponsor-owned structure with much less disclosure than it
    offered as a public company.
  foundedDate: '2010-01-01'
