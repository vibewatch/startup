        title: Exhibits
        blocks:
          - type: callout
            title: The most dangerous risk is convergence risk
            body: >-
              If buyers conclude they can get awareness, reporting, and email protection in one workflow elsewhere,
              KnowBe4's retention and cross-sell economics could compress quickly.
            calloutType: risk
            claimRefs:
