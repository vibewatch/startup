      - number: '8.3'
        title: Comparable companies prove the category is real, but none solves the pricing question alone
        blocks:
          - type: paragraph
            body: >-
              The comp set is useful mainly for framing, not for precision. Proofpoint and Mimecast are the closest
              people-and-email security references, while SailPoint offers a private-equity cybersecurity software
              benchmark, Rubrik offers a recent public cyber appetite marker, and Abnormal plus Hoxhunt show where
              adjacent AI-native or people-risk platforms have been financed. Together they demonstrate that KnowBe4
              belongs in a legitimate cyber-software valuation neighborhood rather than in a compliance niche. But the
              comparables also resist oversimplification. Proofpoint is larger and broader; SailPoint is
              identity-centric; Rubrik is data security with public market liquidity; Abnormal is AI-native email
              security; Hoxhunt is a smaller people-layer specialist. The takeaway is not that one peer determines
              KnowBe4's price, but that the company deserves to be triangulated against both premium cyber platforms and
              more mature sponsor-backed assets. That triangulation supports a multi-billion-dollar enterprise value,
              yet it does not prove that the old $4.6 billion mark is obviously cheap today.
            claimRefs:
              - CV017
