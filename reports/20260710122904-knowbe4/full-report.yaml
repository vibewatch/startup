  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what is actually being bought
        blocks:
          - type: paragraph
            body: >-
              The first analytical task is defining the market correctly, because “security awareness training” is not
              identical to “phishing simulation,” “human risk management,” or “email security.” The broadest market
              lens, used by Mordor Intelligence and syndicated by Research and Markets, covers security awareness
              training as a mix of software platforms and managed services that educate employees, run simulations,
              track behavior, and support compliance. Narrower lenses focus on awareness-plus-phishing-simulation suites
              or even more tightly on phishing attack training programs. Official and semi-official guidance from CISA
              and NIST supports this boundary logic: the core spend category is not just classroom content, but an
              operating layer that teaches users to recognize phishing across email, text, voice, social media, and
              other channels, then measures whether behaviors improve over time. That means pure email gateways, generic
              learning-management systems, or static compliance libraries are only adjacent unless they include active
              simulation, measurement, and response loops. For KnowBe4, the relevant market is therefore a human-risk
              and phishing-simulation stack sitting between compliance training and technical email-security controls.
            claimRefs:
              - CM001
              - CM004
