  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The category is no longer just phishing simulation software
        blocks:
          - type: paragraph
            body: >-
              KnowBe4 still sits at the center of the classic security-awareness-training market, but the competitive
              landscape in 2026 is broader than the company’s own comparison framing suggests. Official KnowBe4
              materials emphasize unlimited phishing testing, a large content catalog, AI-assisted campaign management,
              and add-on expansion into PhishER, SecurityCoach, and Compliance Plus. That bundle makes KnowBe4 the
              clearest incumbent for organizations that want one cloud console to run training, phishing, reporting, and
              baseline human-risk scoring at scale. Independent review sources reinforce that positioning by
              highlighting KnowBe4’s strength in large-enterprise usage, broad content, and generally easy deployment.


              The more important competitive shift is that many rivals are no longer selling just “training.” Proofpoint
              and Mimecast package awareness inside wider email-security and human-risk platforms. Hoxhunt, SoSafe, and
              CybSafe market themselves around behavior change, adaptive interventions, and real-time risk analytics
              rather than course completion. Cofense extends farther into post-delivery detection and remediation,
              treating user reporting as a SOC input rather than only a training metric. SANS remains a credible
              substitute for organizations that want expert-led program design or educational content without committing
              to a full human-risk platform. In practice, buyers are now comparing KnowBe4 not only against direct SAT
              peers but against broader human-risk, secure-email, and internal-program alternatives.
            claimRefs:
