      - number: '1.4'
        title: Adverse signals, evidence quality, and what remains opaque
        blocks:
          - type: paragraph
            body: >-
              The cleanest adverse signal in the current evidence set is not product failure or regulatory sanction but
              merger-process litigation. Stanford’s securities-class-action clearinghouse shows an ongoing case centered
              on alleged omissions in KnowBe4’s 2022 proxy materials for the Vista sale, and the amended complaint
              summarized by Entwistle & Cappucci claims investors were misled about share value, KKR’s rollover
              behavior, and advantages allegedly given to Vista during the process. That does not prove wrongdoing, but
              it means the take-private is still being contested in court. Product-adoption evidence is also
              directionally positive rather than decisive. TrustRadius and PeerSpot reviews praise the training library
              and phishing simulations, yet they also flag recurring limitations around ROI quantification, reporting
              friction, and how realistic or “tricky” some simulations feel. The largest diligence gaps are still
              financial and governance disclosures. Fitch offers helpful credit commentary, but neither official company
              pages nor the current fetched set provide exact 2026 revenue, ARR, EBITDA, board composition, or a
              reconciled employee count. Later chapters can safely treat KnowBe4 as a scaled and sticky category leader,
              but not as a fully transparent private software issuer.
