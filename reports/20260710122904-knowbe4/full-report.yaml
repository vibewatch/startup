            title: The North Korea incident matters because it changed the diligence checklist
            body: >-
              A security vendor can catch an infiltration attempt and still reveal a category-wide weakness. Hiring
              controls, device-shipping controls, and access segmentation now deserve the same diligence weight as
              product security.
