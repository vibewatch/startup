      - number: '2.4'
        title: Growth drivers, constraints, and strategic implications for KnowBe4
        blocks:
          - type: paragraph
            body: >-
              The structural demand case is strong. Mordor ties market growth to ransomware and BEC losses,
              cyber-insurance training proof, SaaS adoption by SMEs, zero-trust programs, ISO 27001 people-centric
              controls, and generative-AI phishing kits. IBM, Verizon, Microsoft, and CISA all reinforce the same
              qualitative point from different angles: human error and social engineering remain persistent breach
              pathways, while AI makes lures faster, cheaper, and more realistic. However, the market is not
              frictionless. Mordor highlights user fatigue, budget reallocation toward XDR and SASE, privacy constraints
              on analytics, and localization bottlenecks. Intel and PMarket add lower participation rates,
              ROI-measurement difficulty, and training disruption risk. Competitive buyer guides also suggest that the
              category is being judged less on “who has content” and more on who can show measurable reporting-rate
              improvement, lower click rates, better personalization, and integration into broader security workflows.
              For KnowBe4 this is strategically favorable in one sense, because the company already offers scale and
              product breadth, but challenging in another, because market leadership must increasingly be proven through
              effectiveness and operating leverage, not just customer count or module-library size.
