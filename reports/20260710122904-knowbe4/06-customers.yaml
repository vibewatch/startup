chapter:
  number: 6
  title: Customers
  summary: KnowBe4 appears to have unusually broad customer proof for a private security vendor, with strong mid-market and enterprise adoption signals, visible public-sector references, and durable review-site strength. Revenue quality still looks North-America-led and SMB-exposed, however, and the public record remains thin on numeric churn, CAC, and post-private cohort retention.
sections:
- id: segment-mix-and-revenue-quality
  title: The customer base is broad, diversified, and still anchored in North America
  body: 'KnowBe4''s customer evidence is strongest on breadth. Fitch said the company serves a diversified base of industries and geographies with no customer concentration, while KnowBe4''s own 2025-2026 materials put the installed base above 70,000 customers. That scale matters because the public-company era already showed more than 44,000 customers in 2021 and 56,867 in late 2022, implying continued expansion under Vista. At the same time, the revenue profile is not globally balanced. Fitch says most ARR still comes from North America, and BankInfoSecurity reported that nearly 83% of first-half 2022 sales were North American. The mix also still includes meaningful SMB exposure: Fitch says about one-third of ARR comes from SMB customers. That creates some macro sensitivity, but it also means KnowBe4 is not dependent on a handful of giant accounts. The best synthesis is that KnowBe4 now has real enterprise and public-sector reach, but its monetization base still skews US-heavy and partly
    SMB-driven.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU036
  tableRefs:
  - TU001
  - TU005
  figureRefs: []
- id: channel-partners-and-cac-proxies
  title: 'Acquisition appears hybrid: direct core, partner-assisted expansion, MSP access at the edge'
  body: KnowBe4 does not publish CAC, payback, or segment-level sales-efficiency data, so channel structure is the best public proxy. The company's partner page explicitly courts resellers, consultants, and MSPs, while the ConnectWise marketplace listing shows KnowBe4 can be distributed through an MSP-centric procurement surface. Regional award releases in the Americas and EMEA suggest that partner coverage is not decorative; it is organized, renewed, and important enough to merit annual recognition. That matters because the product is often purchased by IT, security, managed-service, or compliance teams that already buy through channel relationships. Public evidence still suggests direct sales dominate the larger-account story, especially for enterprise or multi-product deployments, but the partner ecosystem likely reduces acquisition friction in SMB, cross-border, and specialist-vertical motions. The partner footprint also improves reach without forcing KnowBe4 to build a fully local direct
    team in every region, which is consistent with its customer-scale claims and the visible spread of case studies outside the US.
  claimRefs:
  - CU007
  - CU008
  - CU009
  - CU035
  - CU036
  tableRefs:
  - TU002
  figureRefs:
  - FU001
- id: named-customer-proof-and-expansion
  title: Named customer proof is unusually concrete and often tied to measurable behavior change
  body: The quality of public customer proof is a genuine strength. KnowBe4's case studies are not just logo pages; many include before-and-after metrics, user counts, and deployment details. Cebu Pacific said phish-prone percentage dropped from 81% to 6% while rolling out training across more than 6,000 employees and later 2,000 more subsidiary users. The City of Daytona Beach reported 100% policy acceptance, a 12% to 2% phish-prone improvement, and 90% faster email recalls with PhishER Plus. Bridgewater State University cut its phish-prone rate from 15% to 4% across more than 8,000 users and embedded training into onboarding. RWK Goodman, South Ayrshire Council, Ideagen, Shields Health Solutions, and Crawford show that KnowBe4 can expand from SAT into email encryption, misdirected-email prevention, response, or Microsoft-365-centric cloud email security. This pattern matters because it suggests the product is not only landing as annual compliance content; it is often becoming part of daily
    security operations and cross-sell motion.
  claimRefs:
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
