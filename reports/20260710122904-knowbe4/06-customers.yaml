- id: retention-satisfaction-and-open-questions
  title: Independent satisfaction evidence is strong overall, but not uniformly positive
  body: 'Review data makes the customer-quality story more believable, but it is not perfectly clean. G2 is the strongest proof point: more than 2,300 reviews, a 4.6-star average, and a heavily positive rating distribution. TrustRadius and PeerSpot also support the picture of broad adoption and generally favorable product sentiment. Gartner adds enterprise-specific texture, with both favorable commentary and usable criticism around dashboard complexity, training workflows, and risk-score interpretation. The main adverse counter-signal comes from Trustpilot, where the small but visible review set skews negative and focuses on false positives, confusing tests, and poor end-user experience. That split is not fatal, but it is important. It suggests buyers and administrators often like the platform more than end users do. Combined with Fitch''s comment that retention metrics remain stable, the most defensible customer verdict is positive but incomplete: the company looks diversified and sticky,
    yet outside observers still lack numeric churn, NRR by segment, and CAC efficiency after privatization.'
