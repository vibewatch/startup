callouts:
- calloutType: insight
  title: Public customer proof is one of KnowBe4's clearest strengths
  body: Few private cybersecurity companies publish this many named references with actual before-and-after metrics. That makes the demand story easier to trust than the private financial story.
  claimRefs:
  - CU016
  - CU020
  - CU023
  - CU025
  - CU035
- calloutType: risk
  title: Customer breadth does not eliminate quality blind spots
  body: Outside investors still do not have numeric churn, cohort NRR by segment, or CAC efficiency after the take-private. The public review stack is good, but it is not a substitute for raw renewal data.
  claimRefs:
  - CU017
  - CU019
  - CU038
