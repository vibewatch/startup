  rows:
  - - KnowBe4
    - Direct incumbent / HRM platform
    - 70,000+ customers per official company sources; PE-owned
    - SMB through large enterprise
    - Broad content library, unlimited phishing tests, mature admin tooling, add-on expansion
    - Behavior-change narrative is less differentiated than newer HRM challengers
  - - Proofpoint ZenGuide
    - Bundle competitor / email-security incumbent
    - 2.7M customers protected; 80+ of Fortune 100 use Proofpoint
    - Large enterprise, especially existing Proofpoint estates
    - Threat-informed simulations, role/risk scoring, reporting button, strong ecosystem tie-in
    - Awareness value proposition partly depends on broader Proofpoint stack
  - - Hoxhunt
    - Adaptive HRM challenger
    - Official site highlights customer-reported resilience gains and large simulation volumes
    - Enterprise teams prioritizing engagement and reporting behavior
    - Gamified adaptive simulations and human-threat-intelligence framing
    - Public evidence on self-serve multi-channel depth and pricing remains limited
  - - Mimecast Engage
    - Bundle competitor / email-risk suite
    - 42k+ customers and 300+ integrations across broader Mimecast platform
    - Existing Mimecast and regulated email-heavy organizations
    - Awareness tied to email-security and human-risk positioning
    - May be chosen as a bundle convenience rather than a best-of-breed awareness tool
  - - SoSafe
    - EU-first HRM challenger
    - Pan-European scale with 34+ languages and EU-hosting/privacy positioning
    - European enterprises with works-council or NIS2 / DORA sensitivity
    - Behavioral science, multilingual delivery, privacy-aware reporting and compliance mapping
    - Less public evidence of content-library breadth than KnowBe4
  - - MetaCompliance
    - Compliance-first challenger
    - 10M+ people trained; 44+ languages claimed
    - Compliance-led programs and Microsoft-centric delivery
    - Policy management, Teams delivery, strong support positioning
    - Public positioning leans more compliance-first than deep threat telemetry
  - - Cofense
    - SOC-linked adjacent competitor
    - Focused post-delivery phishing-defense brand rather than broad SAT scale messaging
    - Security-operations-led organizations
    - Campaign-level remediation, reporting-loop integration, phishing-specific AI
    - Less obviously a full-spectrum awareness platform than KnowBe4
  - - CybSafe / SANS substitutes
    - Behavioral and program-design substitutes
    - CybSafe emphasizes behavioral database; SANS offers expert-led resources
    - Organizations seeking behavior analytics or expert-led internal programs
    - Alternative path away from classic phishing-click metrics
    - Can require more internal program ownership or adjacent tooling
  notes: Scale signals mix company-claimed customer or user counts with platform reach descriptors. They are useful for competitive orientation, not normalized audited market-share estimates.
