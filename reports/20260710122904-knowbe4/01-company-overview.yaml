  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A management-confirmed current global employee count by geography and function.
    whyItMatters: Third-party directories disagree on whether KnowBe4 is closer to roughly 1.3k employees or a broader 1k-5k band, which affects operating-leverage interpretation.
    diligencePath: Request current HR census or payroll-backed headcount from management and reconcile it to office footprint disclosures.
    relatedQuestionRefs:
    - QO010
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current annual revenue, ARR, EBITDA, and free-cash-flow figures for 2025-2026.
    whyItMatters: Credit commentary shows quality and leverage trends, but exact scale and valuation inputs cannot be underwritten without current financial statements.
    diligencePath: Request board deck, lender presentation, or audited management accounts covering FY2024-FY2026.
    relatedQuestionRefs:
    - QO023
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A full current board roster, committee map, and investor-control summary after the Vista acquisition.
    whyItMatters: Private-equity governance can materially affect capital-allocation, acquisition pace, and exit timing, but public sources only expose fragments.
    diligencePath: Request current board list, governance documents, and shareholder-rights summary from Vista or company counsel.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO002
    - TO003
  - type: stale
    severity: minor
    topic: litigation
