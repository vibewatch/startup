  rows:
  - - Security awareness training (broad SAT)
    - Training platforms, simulations, analytics, managed services, compliance content
    - Pure email gateways without user training; generic LMS without security workflows
    - CISO, security-awareness, compliance, IT
    - Broadest denominator for KnowBe4’s core category.
  - - Security awareness + phishing simulation
    - Role-based education plus realistic phishing tests and reporting metrics
    - Static annual training with no testing loop
    - Security, risk, and audit buyers
    - Closer fit to KnowBe4’s historical value proposition.
  - - Phishing attack training programs
    - Focused phishing simulation, exercises, and response learning
    - Broader human-risk or email-security suites
    - IT/security teams, managed providers
    - Useful narrow subsegment lens for SMB and focused buyers.
  - - Human risk management suites
    - Behavior analytics, continuous nudges, simulations, risk scoring, integrated controls
    - Pure content libraries with no behavior layer
    - CISO, GRC, security operations
    - Matches the direction of KnowBe4’s current positioning.
  - - Adjacent cloud email security and identity controls
    - Threat blocking, posture enforcement, phishing-resistant MFA, inbox security
    - Awareness-only spend if no integrated control loop
    - Security engineering, email teams, IAM teams
    - Important adjacency but not always counted inside SAT TAM.
  notes: The category boundary is definition-sensitive; rows distinguish what analysts, regulators, and vendors variously package together versus what they treat as adjacent controls.
