chapter:
  number: 2
  title: Market Analysis
  summary: 'KnowBe4 operates in a broad security-awareness-training market that multiple analyst sources size in the low-single-digit billions today, but the exact market denominator varies sharply depending on whether the lens is broad SAT, narrower awareness-plus-phishing-simulation suites, or the more focused phishing-training niche. Threat reports, regulatory guidance, and buyer guides all point the same way: human-risk tooling remains structurally necessary, but buyer fatigue, budget competition, and inconsistent market definitions materially affect adoption pace and valuation framing.'
sections:
- id: market-boundary-and-category-definition
  title: Market boundary and what is actually being bought
  body: 'The first analytical task is defining the market correctly, because “security awareness training” is not identical to “phishing simulation,” “human risk management,” or “email security.” The broadest market lens, used by Mordor Intelligence and syndicated by Research and Markets, covers security awareness training as a mix of software platforms and managed services that educate employees, run simulations, track behavior, and support compliance. Narrower lenses focus on awareness-plus-phishing-simulation suites or even more tightly on phishing attack training programs. Official and semi-official guidance from CISA and NIST supports this boundary logic: the core spend category is not just classroom content, but an operating layer that teaches users to recognize phishing across email, text, voice, social media, and other channels, then measures whether behaviors improve over time. That means pure email gateways, generic learning-management systems, or static compliance libraries are
    only adjacent unless they include active simulation, measurement, and response loops. For KnowBe4, the relevant market is therefore a human-risk and phishing-simulation stack sitting between compliance training and technical email-security controls.'
