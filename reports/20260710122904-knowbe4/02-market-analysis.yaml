  title: The real market is bigger than phishing training but smaller than generic “cybersecurity spend”
  body: Broad SAT, awareness-plus-simulation, and phishing-training-program estimates all point to a growing market, but they describe different denominators. Investors should be explicit about which one they are using before turning market size into valuation support.
  claimRefs:
