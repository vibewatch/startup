- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Ransomware, BEC, and social-engineering losses
    - driver
    - current
    - Keeps training and simulation in the core control stack rather than optional compliance spend
    - Ask vendors or buyers for evidence that simulations measurably improve reporting or click-rate outcomes.
  - - Cyber-insurance and audit proof of employee education
    - driver
    - current to medium term
    - Supports repeat budgets, especially for SMEs and regulated industries
    - Test how often insurance questionnaires or contracts explicitly require simulation metrics.
  - - Generative-AI phishing kits and new social-engineering channels
    - driver
    - current
    - Raises demand for more realistic and continuously updated simulations
    - Request examples of how vendors refresh content for AI-driven lures, smishing, and collaboration attacks.
  - - Remote and hybrid work plus SaaS sprawl
    - driver
    - current
    - Broadens attack surface and favors cloud-delivered, always-on programs
    - Ask for role-based and channel-based simulation coverage beyond classic email.
  - - User fatigue and punitive-program backlash
    - constraint
    - current
    - Over-frequent or generic training can reduce participation and ROI
    - Inspect completion, repeat-clicker, and employee-sentiment data rather than assuming more campaigns are better.
  - - Budget competition from XDR, SASE, identity, and other controls
    - constraint
    - current
    - Security leaders may deprioritize training if effectiveness is not measurable
    - Test whether the vendor can tie behavior data into broader SOC or GRC metrics.
  - - Privacy, localization, and analytics restrictions
    - constraint
    - current to medium term
    - Limits how deeply vendors can personalize or benchmark globally
    - Review how regional data and content-localization rules affect product capability.
  - - Definition-sensitive TAM claims
    - constraint
    - current
    - Different market-lens choices can overstate or understate the addressable market for a single vendor
    - Demand a valuation model that clearly states which market boundary is being used.
  notes: Rows combine analyst market reports, regulator guidance, and threat-report implications; they are ecosystem drivers and constraints, not company-specific disclosures.
