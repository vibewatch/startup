  title: Human risk is persistent, but buyer fatigue is real
  body: Threat reports and regulator guidance make clear that continuous training matters, yet market reports also show fatigue, ROI-measurement gaps, and budget competition. That means category leaders still have to prove effectiveness rather than simply sell more content.
