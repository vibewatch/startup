- id: market-sizing-and-segmentation
  title: Sizing lenses, deployment mix, and segment economics
  body: 'Public market sizing is usable, but only if the reader preserves the differences in scope. Mordor’s broad SAT lens estimates a 2026 market size of USD 6.74 billion growing to USD 14.66 billion by 2031 at a 16.82% CAGR, with North America the largest region, cloud delivery the dominant mode, and SMEs growing faster than large enterprises from a smaller base. Virtue Market Research’s narrower awareness-and-phishing-simulation lens starts much lower at USD 1.45 billion in 2025 and projects roughly USD 3.02 billion by 2030 at a 15.8% CAGR. Intel Market Research’s phishing-attack-training-program niche is narrower again, projecting USD 489 million in 2026 and USD 735 million by 2034. Those differences are not contradictions so much as definitional choices. They also imply that investors should avoid claiming a single clean TAM for KnowBe4 without specifying whether they are valuing a compliance-training platform, a simulation-and-behavior suite, or a broader human-risk and cloud-email-security
    stack. The deployment and buyer mix nonetheless points in a clear direction: cloud-first delivery, large-enterprise purchasing today, and faster SMB adoption where insurance, regulations, and subscription pricing reduce barriers.'
