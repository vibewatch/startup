              公开客户证明的质量是真正强项。KnowBe4 的案例研究不只是 logo 页面；许多包含前后对比指标、用户数和部署细节。Cebu Pacific 称，在向超过 6,000 名员工以及后来另外 2,000
              名子公司用户推出培训时，易中钓鱼比例从 81% 降到 6%。City of Daytona Beach 报告政策接受率为 100%，易中钓鱼比例从 12% 改善到 2%，并借助 PhishER Plus
