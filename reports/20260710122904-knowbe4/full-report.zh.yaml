      - number: '6.2'
        title: 获客看起来是混合型：直销守核心，伙伴助扩张，MSP 覆盖边缘
        blocks:
          - type: paragraph
            body: >-
              KnowBe4 不披露 CAC、回本周期或分细分市场销售效率数据，因此渠道结构是最好的公开代理。公司伙伴页面明确招揽经销商、顾问和 MSP；ConnectWise marketplace 列表显示，KnowBe4
              可以通过以 MSP 为中心的采购界面分发。美洲和 EMEA 的区域奖项公告显示，伙伴覆盖不是装饰；它有组织、会续期，也重要到值得年度表彰。这一点重要，因为产品往往由
              IT、安全、托管服务或合规团队购买，而这些团队已经通过渠道关系采购。公开证据仍显示，大客户故事，尤其是企业或多产品部署，主要由直销主导；但伙伴生态很可能降低
              SMB、跨境和专业垂直场景中的获客摩擦。伙伴足迹也扩大了触达，而不迫使 KnowBe4 在每个地区都建设完全本地化的直销团队；这与公司的客户规模主张，以及美国之外可见案例研究的分布一致。
