      - number: '2.4'
        title: 增长驱动、约束，以及对 KnowBe4 的战略含义
        blocks:
          - type: paragraph
            body: >-
              结构性需求逻辑很强。Mordor 把市场增长与勒索软件和商务邮件欺诈（BEC）损失、网络保险培训证明、SME 采用 SaaS、零信任项目、ISO 27001 以人为中心的控制，以及生成式 AI
              钓鱼工具包联系起来。IBM、Verizon、Microsoft 和 CISA 从不同角度强化了同一个定性判断：人为错误和社会工程仍是持续的入侵路径，而 AI
              让诱饵更快、更便宜、更逼真。不过，市场并非没有摩擦。Mordor 强调用户疲劳、预算转向 XDR 和 SASE、分析中的隐私约束，以及本地化瓶颈。Intel 和 PMarket 补充了参与率较低、ROI
              衡量困难和培训扰动风险。竞争性买方指南也显示，品类判断正在从“谁有内容”转向谁能证明上报率提升、点击率下降、个性化更好，并能接入更宽的安全工作流。对 KnowBe4
              而言，这在一个层面上有利，因为公司已有规模和产品广度；另一个层面也更难，因为市场领导地位越来越需要靠有效性和经营杠杆证明，而不只是客户数或模块库规模。
