  - id: TP003
    title: 定价 / 包装比较
    columns:
      - 供应商
      - 公开定价可见度
      - 合同销售路径
      - 已包含能力信号
      - 未知项 / 折扣
      - 影响
    rows:
      - - KnowBe4
        - 中等：公开层级包装和功能包含项，但没有实际席位经济性
        - 按用户层级年订阅，可选附加模块
        - Foundation / Advanced 层级，加 SecurityCoach、Compliance Plus、PhishER Plus
        - 实际席位价格、折扣和企业捆绑经济性仍不公开
        - 包装比同业更透明，有助于早期评估
      - - Proofpoint
        - 低：公开页面以演示转化为主
        - 平台 / 套件主导的企业销售
        - 意识培训越来越与人因风险和邮件技术栈语境一起呈现
        - 交叉销售经济性和模块附加率未披露
        - 装机基础杠杆可能比透明标价更重要
      - - Hoxhunt
        - 低：公开页面以演示转化为主
        - 企业咨询式销售路径
        - 包装信息主打自适应模拟和 HRM 叙事
        - 定价、模块拆分和托管服务组成不公开
        - 买方必须验证更高参与度增益能否支撑支出
      - - Mimecast
        - 低：公开页面以演示转化为主
        - 套件主导路径，并贴近邮件安全
        - 意识培训被定位为更广人因风险平台的一部分
        - 实际捆绑折扣和附加率未披露
        - 现有 Mimecast 客户的切换摩擦可能更低
      - - SoSafe / MetaCompliance
        - 低：公开页面以演示转化为主
        - 咨询式企业销售路径
        - 强调本地化、合规和行为项目
        - 按地区、工会委员会约束和模块划分的实际定价不公开
        - 在欧洲或合规负担重的买方中，匹配度强可压过价格透明度
      - - Cofense
        - 低：公开页面以演示转化为主
        - 面向安全运营的咨询式销售路径
        - 价值绑定补救工作流、报告和托管防御
        - 仅意识培训价格与补救捆绑价格不公开
        - 当 SOC ROI 比通用培训成本更关键时，有机会胜出
    notes: 公开层面的主要差异是包装透明度，而不是标价可比性。多数供应商要求演示或报价，因此采购杠杆很可能由相邻产品关系塑造。
