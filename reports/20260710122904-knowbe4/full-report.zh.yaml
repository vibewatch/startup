      - number: '2.3'
        title: 买方、用户、付款方和采用路径
        blocks:
          - type: paragraph
            body: >-
              买方图谱比“安全团队给员工买培训”复杂得多。在大型企业里，预算所有者往往是 CISO 或安全意识负责人，但审计发现、网络保险要求或事故后的董事会压力都可能触发采购。在 BFSI
              和医疗等受监管行业，合规、隐私和运营韧性团队也会塑造需求，因为培训记录和报告结果属于证据包。SME 的购买方式往往不同：较小的 IT
              或托管服务团队寻找云化、低管理负担的订阅，满足保险商或客户要求，又不必配置完整的意识培训人员。实际用户是员工、承包商，以及越来越多使用协作工具的合作伙伴或智能体；付款方则是与安全、风险、IT
              或治理职能挂钩的企业预算。正因如此，NIST 和 CISA 强调结果指标和真实模拟，而不是一次性完成率。采用路径通常从广泛的意识传播开始，进入基线钓鱼测试，再到按角色模拟、持续提醒、报告工作流和生态集成。对
              KnowBe4 来说，这种结构有利于能同时服务勾选合规买方，以及希望衡量行为变化的成熟团队的平台。
