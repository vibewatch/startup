  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 最大战略风险不是培训需求塌陷，而是工作流被替代
        blocks:
          - type: paragraph
            body: >-
              KnowBe4 仍受益于庞大存量客户和真实市场需求，但战略威胁已经转移。最相关的竞争证据是 Abnormal 的替换案例研究，其中一家全球制造商明确选择不续约
              KnowBe4，原因是独立的钓鱼培训、报告和支持闭环制造了过多运营噪音。这一点重要，因为它重构了争论：威胁不是意识培训是否重要，而是意识培训会继续作为独立预算项存在，还是被更宽的邮件安全和响应工作流吸收。SMB
              调研数据让这个判断更尖锐。买方在网络安全上花更多钱，但也承受 AI 压力，高度依赖 MSP，并越来越想要稳固的一体化防护。Mordor 的市场研究显示，随着组织把资金转向自动化检测和 XDR
              式技术栈，意识预算可能被挤压。对 KnowBe4 而言，这意味着乐观情景取决于公司能否足够快地从 SAT 继续扩展到辅导、响应和邮件安全，避免单点方案被压缩。
