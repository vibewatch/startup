      - number: '8.2'
        title: 当下市场支持溢价，但不能无视倍数压缩和杠杆
        blocks:
          - type: paragraph
            body: >-
              估值张力很直接。一方面，Fitch 称超过 99% 的收入为经常性收入，留存保持稳定，利润率应显著改善。正是这些特征支撑收入倍数溢价。另一方面，DealMatrix 显示，截至 2025 年 3
              月，网络安全行业中位数约为 3.8x EV/Sales；北美通常是估值最贵的地区，但仍远低于网络安全最狂热时期。再融资也让杠杆维持在足够高的水平，因此 Fitch
              仍只预期公司逐步降杠杆，并明确警告私募股权所有权可能不会优先偿债。这意味着 KnowBe4 不能简单按一家没有债务包袱的干净上市 SaaS
              公司来估值。更合适的框架是，因质量和规模给出高于行业中位数的部分溢价，再因不透明度和资产负债表风险扣减。这样一来，测算更应落在公允价值区间，而不是单点估计；也解释了为什么 2023
              年披露的交易价格现在应被视为上限参照，而非默认基准情景。
            claimRefs:
              - CV007
              - CV008
              - CV009
