  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、规模和运营模式
        blocks:
          - type: paragraph
            body: >-
              KnowBe4 现在公开呈现的身份，已远不止 IPO 时期定义公司的安全意识供应商。官网首页、平台页和评价平台都把公司放在人因风险管理的框架下，并且越来越多地强调同时保护 AI
              智能体和人类员工。官方页面描述的平台，把意识与合规培训、钓鱼模拟、众包反钓鱼、实时辅导、云邮件安全和更新的 AI 防御智能体组合在一起。最醒目的规模信号在近期多个来源中保持一致：首页称公司拥有 15+
              年行为数据和 70,000 名全球客户，2025 年 CEO 交接新闻稿称公司已服务超过 70,000 名客户，Fitch 也描述其全球客户基数超过 70,000。这个规模显著高于 2023 年 2
              月私有化交割公告披露的 56,000 家组织，说明收购后仍在扩张。公开地点证据也一致：KnowBe4 总部位于佛罗里达州 Clearwater，总部地址列为 33 N Garden Ave, Suite
              1200。
