      - number: '2.2'
        title: 规模口径、部署组合和细分经济性
        blocks:
          - type: paragraph
            body: >-
              公开市场规模可以使用，但前提是保留口径差异。Mordor 的广义 SAT 口径估计，2026 年市场规模为 USD 6.74 billion，到 2031 年增至 USD 14.66 billion，CAGR 为
              16.82%；北美是最大区域，云交付是主导模式，SME 从较小基数出发、增速快于大型企业。Virtue Market Research 更窄的意识与钓鱼模拟口径低得多，2025 年为 USD 1.45
              billion，预计到 2030 年约为 USD 3.02 billion，CAGR 为 15.8%。Intel Market Research 的钓鱼攻击培训项目细分口径更窄，预计 2026 年为 USD
              489 million，2034 年为 USD 735
              million。这些差异与其说是矛盾，不如说是定义选择。它们也意味着，投资者不能在不说明是在评估合规培训平台、模拟与行为套件，还是更宽的人因风险和云邮件安全栈时，就给 KnowBe4 认定一个单一、干净的
              TAM。部署和买方组合仍指向清晰方向：云优先交付、今天由大型企业采购，以及在保险、监管和订阅定价降低门槛的地方，SMB 采用更快。
