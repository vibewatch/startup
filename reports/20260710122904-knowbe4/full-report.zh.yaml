      - number: '5.3'
        title: 信任态势成熟，但部分技术细节仍不透明
        blocks:
          - type: paragraph
            body: >-
              公开可见的安全与信任态势强于平均意识培训供应商。KnowBe4 的安全声明描述了
              CI/CD、同行评审、预发布环境隔离、集中加密日志、月度漏洞扫描、正式修复时间线和私人漏洞赏金计划。同一批材料还提到第三方审计，以及包括 FedRAMP、ISO 27001 和 SOC 2
              在内的合规项目。产品侧信号重要，因为 KnowBe4 越来越多地触及实时辅导、用户配置、可疑邮件处理和集成邮件响应等生产工作流。


              同时，一些最具战略重要性的技术细节仍然模糊。AIDA 显然处在 KnowBe4 路线图中心，但公开页面没有解释模型提供商、推理边界、AI 处理的数据驻留，或系统中确定性自动化与生成式 AI
              各占多少。开发者接口也受限：报告 API 可见，但公开材料对读取/报告访问的说明，远清楚于对广泛写入自动化的说明。这个组合支持一个结论：运营控制成熟、产品功能广，但最深层的 AI 和可编程架构可见度不完整。
