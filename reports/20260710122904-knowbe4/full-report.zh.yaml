      - number: '5.2'
        title: 运营模式云优先、身份驱动，并依赖集成
        blocks:
          - type: paragraph
            body: >-
              KnowBe4 的架构在运营上务实，而不是猎奇。支持文档显示，用户身份通过 ADI、Google provisioning 或 SCIM 从外部系统同步，其中 SCIM 作为单向身份流进入 KSAT
              控制台。平台支持 SAML SSO；导入指南也明确，实施从域名验证、用户配置、白名单配置和钓鱼可达性检查开始。换句话说，部署更多依赖身份卫生和邮件流配置，而不是客户侧代码变更。


              更高级的层次高度依赖第三方安全遥测。CrowdStrike、Zscaler 和类似集成，把数据送入 SecurityCoach 检测规则和实时辅导。PhishER Plus 的隔离和处置工作流依赖
              Microsoft 365 或 Google Workspace；其社区情报主张则依赖大用户基数带来的网络效应。这种架构很有力量，因为它让 KnowBe4
              能把学习连接到实时安全行为，但也产生清晰的依赖风险：安全栈薄弱的客户得到的价值较少，不同邮件生态上的客户可能看到不均衡的功能，路线图能否跑通取决于维护大量外部集成。
