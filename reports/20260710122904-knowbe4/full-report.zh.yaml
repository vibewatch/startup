  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: KnowBe4 卖的是工作流，不只是课程目录
        blocks:
          - type: paragraph
            body: >-
              KnowBe4 的产品最好理解为持续的员工风险工作流，而不是一次性培训库。导入材料、SAT 功能页和 AIDA
              材料都描述了一条序列：从用户配置开始，建立钓鱼基线，持续运行测试，分配培训，然后加入自动化处置或实时辅导。学习者应用、ModStore 内容库和与 SmartRisk
              连接的编排，又强化了这套工作流。结果是，一个从基线意识走向反复衡量和干预的平台。


              公司有多少相邻模块喂入同一工作流，直接显示了它的广度。SecurityCoach 把第三方安全事件转化为即时用户辅导。PhishER Plus
              把上报的钓鱼邮件转化为有优先级的响应队列、隔离动作，甚至可复用培训。AIDA 试图把活动创建、复训和钓鱼个性化中的大量管理负担自动化。Egress
              则把工作流进一步延伸到云邮件安全和自适应策略。这种广度是真正的产品优势，但也意味着客户体验取决于身份系统、邮件平台和外部安全工具连接得有多好。
