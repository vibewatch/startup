      - number: '3.3'
        title: 定价不透明和捆绑杠杆是主要竞争变量
        blocks:
          - type: paragraph
            body: >-
              公开定价仍是这个品类最不透明的部分之一。KnowBe4 通过 SAT 定价页披露档位结构和包含能力，清晰度高于多数同行，但即便如此，该页面提供的仍是包装透明度，而不是干净的实际单席经济性。包括
              Proofpoint、Hoxhunt、SoSafe、MetaCompliance、Cofense 和 Mimecast
              在内的多数对手，都突出以演示驱动的销售动作，而不是公开标价表。这意味着竞争往往较少取决于目录价格，更多取决于谁已经控制相邻预算，尤其是邮件安全预算、身份集成和安全运营工作流。


              这一点重要，因为 Proofpoint 和 Mimecast 可以靠分发权力与 KnowBe4 竞争，而不只是靠 SAT
              功能。已经使用这些供应商做邮件安全的买方，可能接受一个“够好”的意识模块，只要它能复用威胁遥测、采购关系和报告基础设施。Cofense
              在钓鱼上报工作流已经进入事件响应的组织里也有类似优势。相比之下，KnowBe4
              的防御路径，是通过更丰富内容、更容易推出、更强报告和扩张附加模块，让独立平台决策值得做。独立评价来源显示，这个策略对许多客户有效，但也暴露压力点，包括内容重复、本地化缺口和难以量化
              ROI。当意识培训成为被审视的预算项时，这些问题可能让捆绑驱动的替代方案更有吸引力。
