  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 最后公开数字显示出高质量 SaaS 经济性和强经常性
        blocks:
          - type: paragraph
            body: >-
              KnowBe4 进入 2023 年私有化交易时，对一家网络安全教育平台来说，公开市场运营信号异常有吸引力。公司报告 2021 年 Q3 收入同比增长 42.6%、ARR 增长 44.1%；随后在 2022 年
              Q4 初步公告中达到 $367.7 million ARR 和 $89.9 million 季度收入。毛利率一直保持在 80%
              中段，自由现金流在公司继续投入销售、营销和产品扩张时仍为正。这些指标重要，因为它们解释了 Vista 为什么能相对增长较慢的网络安全同行，证明一个溢价私有市场入场倍数合理。


              同样重要的是，收入质量看起来强于单看头部增长率。2022 年 Q3 10-Q 表示，几乎全部收入来自订阅服务，客户通常按年预付开票，递延收入是经营现金的重要来源。Fitch 后来进一步强化了这张信用画像，称超过
              99% 的收入为经常性收入，留存指标仍然强劲。换句话说，公开记录支持这样的判断：KnowBe4 不只是一个项目收入波动的内容供应商；它是一个经常性 SaaS 平台，账单可预测、预收现金，并有可观增购潜力。
