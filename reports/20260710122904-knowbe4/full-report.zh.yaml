      - number: '7.3'
        title: 旧并购诉讼和高杠杆把下行风险维持在高位
        blocks:
          - type: paragraph
            body: >-
              KnowBe4
              的法律风险和资本结构风险都不轻。修订后的佛罗里达证券诉状，以及仍在延续的特拉华并购诉讼轨迹表明，私有化流程在交割很久之后仍受到审视。即便这些事项不直接伤及运营，也会吃掉管理层精力，并可能迫使公司和解、补充披露或让渡治理条件。更迫近的是，Fitch
              的信用分析把高杠杆问题讲得很清楚。KnowBe4 的发行人评级为 B；第一留置权债务包扩容后，其回收评级最终被下调至 B+；Fitch 仍只预期杠杆率会逐步降至 7.5x
              以下。评级评论里最关键的不是评级本身，而是 Fitch 认为私募股权所有权可能把回报最大化置于提前还债之前。这形成了典型的 PE
              持有型软件风险：即便经常性收入很强，股权故事也可能被杠杆、再融资周期，以及围绕收购而非降杠杆的选择权挤压。
