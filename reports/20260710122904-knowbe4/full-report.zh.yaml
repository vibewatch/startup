    rows:
      - - KnowBe4
        - 直接在位者 / HRM 平台
        - 官方公司来源称客户 70,000+；私募股权持有
        - 从 SMB 到大型企业
        - 内容库宽、钓鱼测试不限量、管理工具成熟，可通过附加模块扩张
        - 行为改变叙事不如更新的 HRM 挑战者有差异
      - - Proofpoint ZenGuide
        - 捆绑竞争者 / 邮件安全在位者
        - 保护 2.7M 客户；Fortune 100 中 80+ 使用 Proofpoint
        - 大型企业，尤其是现有 Proofpoint 客户环境
        - 威胁情报驱动的模拟、角色 / 风险评分、报告按钮、生态绑定强
        - 意识培训价值主张部分依赖更广的 Proofpoint 技术栈
      - - Hoxhunt
        - 自适应 HRM 挑战者
        - 官方网站强调客户报告的韧性提升和大规模模拟量
        - 重视参与度和报告行为的企业团队
        - 游戏化自适应模拟，以及人因威胁情报叙事
        - 自助式多渠道深度和定价的公开证据仍有限
      - - Mimecast Engage
        - 捆绑竞争者 / 邮件风险套件
        - 更广的 Mimecast 平台拥有 42k+ 客户和 300+ 集成
        - 现有 Mimecast 客户，以及受监管、邮件密集型组织
        - 意识培训与邮件安全和人因风险定位绑定
        - 可能因捆绑便利被选中，而不是因最佳单点意识培训工具胜出
      - - SoSafe
        - 欧盟优先的 HRM 挑战者
        - 泛欧洲规模，支持 34+ 语言，并主打欧盟托管 / 隐私定位
        - 对工会委员会或 NIS2 / DORA 敏感的欧洲企业
        - 行为科学、多语言交付、隐私友好的报告与合规映射
        - 内容库广度的公开证据少于 KnowBe4
      - - MetaCompliance
        - 合规优先的挑战者
        - 声称已培训 10M+ 人，支持 44+ 语言
        - 合规主导项目和 Microsoft 中心化交付
        - 策略管理、Teams 交付、支持定位强
        - 公开定位更偏合规优先，而非深度威胁遥测
      - - Cofense
        - 连接 SOC 的相邻竞争者
        - 主打投递后钓鱼防御品牌，而不是宽口径 SAT 规模叙事
        - 安全运营主导的组织
        - 活动级补救、报告闭环集成、钓鱼专用 AI
        - 不如 KnowBe4 明显覆盖全谱意识培训平台
      - - CybSafe / SANS 替代方案
        - 行为与项目设计替代方案
        - CybSafe 强调行为数据库；SANS 提供专家主导资源
        - 寻求行为分析或专家主导内部项目的组织
        - 绕开经典钓鱼点击指标的替代路径
        - 可能需要更多内部项目负责人或相邻工具
    notes: 规模信号混合公司声称的客户 / 用户数与平台触达描述。它们可用于竞争定位，不是经过审计、可标准化比较的市场份额估计。
