  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买方真正购买的东西
        blocks:
          - type: paragraph
            body: >-
              第一个分析任务是把市场定义准，因为“安全意识培训”并不等同于“钓鱼模拟”、“人因风险管理”或“邮件安全”。Mordor Intelligence 使用并由 Research and Markets
              分发的最宽口径，把安全意识培训定义为软件平台和托管服务的组合：教育员工、运行模拟、跟踪行为并支持合规。更窄的口径聚焦意识加钓鱼模拟套件，甚至进一步收窄到钓鱼攻击培训项目。CISA 和 NIST
              的官方及半官方指南支持这种边界逻辑：核心支出品类不是课堂内容，而是一层运营系统，教用户在邮件、短信、语音、社交媒体和其他渠道识别钓鱼，然后衡量行为是否随时间改善。因此，纯邮件网关、通用学习管理系统或静态合规内容库只是相邻品类，除非它们包含主动模拟、衡量和响应闭环。对
              KnowBe4 而言，相关市场因此是一套夹在合规培训和技术型邮件安全控制之间的人因风险与钓鱼模拟栈。
