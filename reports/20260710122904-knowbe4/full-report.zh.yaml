      - number: '7.2'
        title: 朝鲜事件已被控制住，但仍是严重的运营警示信号
        blocks:
          - type: paragraph
            body: >-
              KnowBe4 迅速识破假员工事件，值得肯定，但事件本身仍然重大。公司称，在多轮面试、推荐人核验和背景审查之后，仍聘用了一名盗用身份的员工；笔记本一到手，恶意软件活动就开始。EDR 和 SOC
              控制发挥了作用，但事实模式仍让人不安：它说明，即便是安全厂商，也可能被 HR 和身份控制薄弱点打穿。更广泛的美国执法记录让风险更难轻描淡写。DOJ、FBI、美国财政部、美国国务院和 IC3 材料都把 DPRK
              关联远程员工骗局描述为活跃、会变形的威胁；这些骗局不只把工资转走，也牵涉数据盗窃和勒索。换句话说，声誉教训不止这一桩轶事：员工诚信、招聘核验、设备寄送控制和特权访问分段，已经成为董事会层面的安全议题。KnowBe4
              卖的是人因风险管理；如果再发生类似事件，即便技术爆炸半径再次被压住，声誉损伤也会不成比例。
