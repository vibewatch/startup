      - number: '8.3'
        title: 可比公司证明品类真实存在，但没有哪一家能单独回答定价问题
        blocks:
          - type: paragraph
            body: >-
              可比公司组主要用于框定区间，而不是给出精确答案。Proofpoint 和 Mimecast 是最接近的人因与邮件安全参照；SailPoint 提供私募股权控股网络安全软件基准，Rubrik
              提供近期公开市场对网络安全资产胃口的标记，Abnormal 与 Hoxhunt 则显示相邻 AI 原生或人因风险平台的融资位置。合在一起，它们说明 KnowBe4
              属于正规的网络安全软件估值圈，而不是一个合规小众赛道。但可比公司也无法被简单套用。Proofpoint 体量更大、范围更广；SailPoint 以身份为中心；Rubrik
              是具备公开市场流动性的数据安全公司；Abnormal 是 AI 原生邮件安全；Hoxhunt 是更小的人因层专家。结论不是某一个同业决定 KnowBe4 的价格，而是公司应同时对照高溢价网络安全平台和更成熟的
              PE 持有型资产来三角测算。这样的三角测算支持数十亿美元企业价值，但不能证明旧的 $4.6 billion 标记在今天显然便宜。
            claimRefs:
