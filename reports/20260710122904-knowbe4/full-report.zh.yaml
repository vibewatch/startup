  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - 勒索软件、BEC 与社会工程损失
        - 驱动因素
        - 当前
        - 培训和模拟继续留在核心控制栈，而不是可选合规支出
        - 向供应商或买方索取证据，证明模拟能可量化地改善报告率或点击率结果。
      - - 网络保险和审计要求证明员工教育
        - 驱动因素
        - 当前至中期
        - 支撑重复预算，尤其是在 SMB 和受监管行业
        - 核验保险问卷或合同多频繁地明确要求模拟指标。
      - - 生成式 AI 钓鱼工具包和新的社会工程渠道
        - 驱动因素
        - 当前
        - 抬高对更逼真、持续更新模拟的需求
        - 要求供应商举例说明如何为 AI 驱动诱饵、短信钓鱼和协作工具攻击刷新内容。
      - - 远程 / 混合办公与 SaaS 蔓延
        - 驱动因素
        - 当前
        - 攻击面被拉宽，利好云端交付、持续在线项目
        - 要求提供经典邮件之外的角色化、渠道化模拟覆盖。
      - - 用户疲劳和惩罚式项目反弹
        - 约束
        - 当前
        - 过于频繁或泛化的培训会压低参与度和 ROI
        - 不要假定活动越多越好，应查看完成率、重复点击者和员工情绪数据。
      - - XDR、SASE、身份和其他控制项争抢预算
        - 约束
        - 当前
        - 如果效果无法量化，安全负责人可能下调培训优先级
        - 核验供应商能否把行为数据接入更广泛的 SOC 或 GRC 指标。
      - - 隐私、本地化和分析限制
        - 约束
        - 当前至中期
        - 限制供应商做深度个性化或全球基准对比
        - 审查区域数据和内容本地化规则如何影响产品能力。
      - - 对定义敏感的 TAM 口径
        - 约束
        - 当前
        - 市场口径一换，单一供应商的可服务市场就可能被高估或低估
        - 要求估值模型明确写明采用哪条市场边界。
    notes: 各行结合分析师市场报告、监管指引和威胁报告含义；它们是生态层面的驱动因素和约束，不是公司特定披露。
