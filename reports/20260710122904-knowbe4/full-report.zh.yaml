  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基数广、分散，但仍以北美为锚
        blocks:
          - type: paragraph
            body: >-
              KnowBe4 的客户证据最强在广度。Fitch 称，公司服务于行业和地区分散的客户基数，没有客户集中；KnowBe4 自己的 2025-2026 年材料则把存量客户放在 70,000
              名以上。这个规模重要，因为上市公司时期已经显示 2021 年客户超过 44,000 名、2022 年末为 56,867 名，说明 Vista 旗下仍在扩张。与此同时，收入结构并非全球均衡。Fitch 称多数
              ARR 仍来自北美，BankInfoSecurity 报道 2022 年上半年销售近 83% 来自北美。组合里仍有显著 SMB 暴露：Fitch 称约三分之一 ARR 来自 SMB
              客户。这带来一定宏观敏感性，但也意味着 KnowBe4 不依赖少数巨型账户。最好的综合判断是，KnowBe4 现在有真实的企业和公共部门覆盖，但变现基础仍偏美国，并部分由 SMB 驱动。
