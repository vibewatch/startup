      - number: '7.4'
        title: 公司有能力消化这些风险，但战场太拥挤
        blocks:
          - type: paragraph
            body: >-
              Bryan Palma 接手的不是一家未经验证的公司；他接手的是一个已有规模、由 PE 控制的平台，客户超过 70,000 家，创始人仍任执行董事长，业务也已超出传统 SAT。这给公司留下了缓冲能力。Egress
              拓宽了产品组合，公司对假员工事件的回应也相对透明，经常性收入仍提供一定韧性。问题在于多线并发。竞争工作流压力、债务、诉讼、领导层交接和 AI
              时代威胁加速都同时存在。单独看，每个问题都能管；叠在一起，执行风险就明显上升，因为管理层无法靠一个杠杆解决。董事会和 PE
              控股方需要同时管资本结构、产品整合、招聘控制和商业化打法演进。因此，正确结论不是恐慌，而是排序：KnowBe4
              看起来是一家运营风险较高的可行公司，不是一家已经坏掉的公司。这个差别对承销很重要，因为它支持密切跟踪，而不是直接否定这门生意。
