      - number: '1.3'
        title: 所有权、信用结构和里程碑时间线
        blocks:
          - type: paragraph
            body: >-
              资本线索格外重要，因为 KnowBe4 的公开股权阶段以财务赞助方收购结束，随后又发生再融资。SEC 合并材料和交割公告显示，Vista 同意以每股 $24.90 现金收购，较 2022-09-16
              未受消息影响的收盘价溢价 44%，并在 2023 年 2 月 1 日完成收购，使 KnowBe4 从 Nasdaq 退市。此后，公司持续重塑平台和资本结构。公司历史页面强调 2019 年 KKR 领投的 $300
              million 融资和 2021 年 4 月 IPO；官方产品历史则列出 PhishER、SecurityCoach、AIDA 和 Agent Risk Manager 等发布。2024 年 7
              月，KnowBe4 完成对 Egress 的收购，加入自适应云邮件安全，战略范围再次扩大。到 2025 年 7 月，业务也完成了一轮重大再融资：Fitch 以 B/Stable 启动覆盖，随后在维持发行人 B
              评级时提到扩大的 $1.46 billion 第一留置权定期贷款和 $200 million 循环信贷；Private Equity Wire
              报道称利差显著低于此前的私人信贷债务。这个组合指向一家已有规模、经常性收入的软件资产，但所有权和治理逻辑更接近带 PE 杠杆，而不是公开市场透明度。
