      - number: '3.2'
        title: 能力差异越来越围绕工作流和遥测，而不是基础培训内容
        blocks:
          - type: paragraph
            body: >-
              这个市场的功能重叠很清楚：所有重要供应商都承诺钓鱼模拟、意识内容、报告和某种个性化。这种趋同很关键，因为它削弱了 KnowBe4 在核心 SAT
              工作流上拥有无争议功能垄断的论点。更耐久的差异如今来自每家供应商把意识与相邻系统接到哪里。Proofpoint 用实时威胁情报、可疑邮件上报和邮件安全上下文，让培训受威胁信息驱动。Mimecast
              同样主张，意识应嵌入更宽的人因风险和邮件防御栈。Cofense 通过连接上报行为和投递后处置做出差异化，这对由 SOC 拥有意识项目的组织有吸引力。


              KnowBe4 的竞争答案是广度和配置能力。官方定价和功能页面显示，它支持不限次数的钓鱼测试、AI 选择模板、用户事件 API、智能分组、高管报告、SCIM 和 SSO、通过 SecurityCoach
              进行可选实时辅导，以及通过 PhishER Plus 进行附加反钓鱼。这是一片很宽的控制面。但挑战者正在攻击经典 KnowBe4 剧本中的具体弱点。Hoxhunt
              把游戏化和自适应模拟营销为更能维持参与度；SoSafe 强调行为科学以及欧洲隐私或劳资委员会适配；CybSafe 则把多数传统工具描述为过度关注点击率，而非真实行为数据。结果是，能力广度有利于
              KnowBe4，但行为驱动的人因风险管理叙事势头有利于若干挑战者。
