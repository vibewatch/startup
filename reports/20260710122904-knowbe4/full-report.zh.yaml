      - number: '8.4'
        title: 最稳妥的立场是继续研究，并给出公允估值判断
        blocks:
          - type: paragraph
            body: >-
              由于当前经审计数据不可得，情景分析是收束本章唯一诚实的办法。下行情景：在 $550-580 million 收入基数上使用近似公开市场行业倍数，指向 $2 billion
              出头到高位区间的企业价值。中性情景：给予质量溢价但仍承认杠杆，指向约 $3.6-4.3 billion。乐观情景：假设私有化后增长更强、附加销售更好、优质资产属性延续，仍可达到或超过旧的 $4.6 billion
              锚点。实际含义是，KnowBe4 很可能仍是独角兽，也可能仍值 Vista 当年支付的价格附近，但公开证据没有给出安全边际。债务、PE
              控股方选择权和披露不透明都压窄了信心。因此，正确建议是继续研究，而不是买入：公司好到值得重视，但透明度不足，不能只靠公开信息激进承销。
