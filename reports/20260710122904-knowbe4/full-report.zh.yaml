      - number: '1.2'
        title: 领导层交接、全球布局和治理信号
        blocks:
          - type: paragraph
            body: >-
              领导层是公司私有化后最大的变化之一。KnowBe4 2025 年 4 月的公告任命 Bryan Palma 自 2025 年 5 月 5 日起出任总裁兼首席执行官，创始人 Stu Sjouwerman
              则转任执行董事长。Palma 的背景重要，因为公司日常经营不再由建立原始意识培训品类地位的创始人掌舵；新 CEO 是规模化企业运营者，最近一份前职是领导 Trellix。Sjouwerman
              仍具战略重要性，一方面他在 2010 年创立 KnowBe4，另一方面交接后公司明确让他帮助引导人工智能创新。公司可见足迹是全球性的，但量化并不完整。一份职场奖项公告显示，公司在 11 个国家获得 Great
              Place to Work 认证，并明确列出美国、英国、南非、澳大利亚、阿联酋、新加坡、荷兰、日本、印度、德国和巴西的办公室或运营存在。公开材料仍没有给出清晰的 2026
              年董事会名单、投资者控制图谱或准确员工数。第三方目录把员工规模放在数千人出头，但公司没有在官方页面发布确定数字。
