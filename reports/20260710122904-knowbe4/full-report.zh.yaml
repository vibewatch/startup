  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 这个品类已不只是钓鱼模拟软件
        blocks:
          - type: paragraph
            body: >-
              KnowBe4 仍处在经典安全意识培训市场的中心，但 2026 年的竞争格局比公司自己的比较框架更宽。KnowBe4 官方材料强调不限次数的钓鱼测试、大型内容库、AI 辅助的活动管理，以及向
              PhishER、SecurityCoach 和 Compliance Plus 的附加扩张。这个组合让 KnowBe4
              成为最清晰的既有供应商，适合希望用一个云控制台规模化运行培训、钓鱼、报告和基础人因风险评分的组织。独立评价来源也强化了这个定位，突出 KnowBe4 在大型企业使用、广泛内容和总体易部署方面的强项。


              更重要的竞争变化是，许多对手不再只卖“培训”。Proofpoint 和 Mimecast 把意识模块打包进更宽的邮件安全和人因风险平台。Hoxhunt、SoSafe 和 CybSafe
              围绕行为改变、自适应干预和实时风险分析进行营销，而不是围绕课程完成率。Cofense 向投递后检测和处置延伸得更远，把用户上报视为 SOC 输入，而不只是培训指标。SANS
              对那些希望获得专家主导项目设计或教育内容、但不想承诺完整人因风险平台的组织，仍是可信替代。实际采购中，买方现在不仅把 KnowBe4 与直接 SAT
              同行比较，也会与更宽的人因风险、安全邮件和内部项目替代方案比较。
