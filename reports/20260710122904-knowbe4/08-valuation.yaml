- id: current-multiple-framework
  title: Today's market argues for a premium, but not for ignoring compression or leverage
  body: The valuation tension is straightforward. On one hand, Fitch says more than 99% of revenue is recurring, retention remains stable, and margins should improve materially. Those are exactly the characteristics that justify a premium revenue multiple. On the other hand, DealMatrix shows cybersecurity medians around 3.8x EV/Sales as of March 2025, with North America typically the richest region but still far below the most exuberant cyber periods. The refinancing also kept leverage high enough that Fitch still expects only gradual deleveraging and explicitly warns that private-equity ownership may not prioritize debt paydown. That means KnowBe4 cannot simply be valued like a clean public SaaS name with no debt overhang. The right framework is to award some premium over the sector median for quality and scale, then subtract for opacity and balance-sheet risk. That pushes the exercise toward a fair-value range rather than a point estimate and explains why the 2023 headline should now be
    treated as an upper reference rather than a default base case.
  claimRefs:
