- id: scenario-range-and-investment-stance
  title: The most defensible stance is research-more with a fair valuation view
  body: 'Because current audited numbers are unavailable, scenario analysis is the only honest way to close the chapter. A downside case using roughly public-market-like sector multiples on a $550-580 million revenue base points to low-to-high $2 billions of enterprise value. A middle case using a quality premium but still acknowledging leverage points to roughly $3.6-4.3 billion. A bullish case, which assumes stronger private growth, attach, and premium-quality persistence, can still reach or exceed the old $4.6 billion anchor. The practical implication is that KnowBe4 likely remains a unicorn and may still be worth about what Vista paid, but the public evidence does not establish a margin of safety. Debt, sponsor optionality, and disclosure opacity all narrow conviction. That is why the right recommendation is research-more rather than buy: the company looks good enough to matter, but not transparent enough to underwrite aggressively on public information alone.'
