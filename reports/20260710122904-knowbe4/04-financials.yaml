tables:
- id: TI001
  title: Revenue streams table
  columns:
  - stream
  - mechanism
  - unit
  - current public value / status
  - quality
  - diligence ask
  rows:
  - - Core SAT subscription
    - Annual or multi-year subscription access to cloud-based training and phishing platform
    - ARR / subscription revenue
    - Primary disclosed revenue engine; substantially all public-company revenue came from subscriptions
    - High-quality recurring SaaS revenue
    - Request current ARR by product and cohort after privatization
  - - Downloadable content / LMS exports
    - Content access and downloadable modules allocated within contracts
    - Recognized revenue component
    - 10-Q states downloadable content is a separate performance obligation
    - Recurring but accounting treatment differs from hosted subscription delivery
    - Request current mix between hosted use and downloadable content
  - - Add-on modules
    - SecurityCoach, Compliance Plus, PhishER / PhishER Plus and related upsell modules
    - Seat-based or add-on subscription
    - Public pricing and product pages show optional add-on structure, but no revenue split is disclosed
    - Potentially higher-ARPU expansion path
    - Request attach rates and gross margin by module
  - - Email-security adjacency
    - Egress and cloud-email-security expansion after 2024 acquisition
    - Subscription / bundled cross-sell
    - Publicly disclosed as strategic diversification, but no financial contribution disclosed
    - Could reduce SAT concentration if scaled
    - Request Egress revenue, growth, and integration economics
  - - Services / other
    - Implementation or ancillary support activity
    - Limited / likely immaterial
    - No major public evidence that services dominate the model
    - Low relevance versus software revenue
    - Confirm services mix and professional-services margin
  notes: Table separates contractual revenue mechanisms from disclosed product packaging; it does not imply audited current mix after privatization.
