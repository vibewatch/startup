- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact
  - exact diligence path
  rows:
  - - FY2023-FY2024 audited revenue and EBITDA
    - Prevents clean valuation and leverage modeling
    - Obtain lender materials, management presentations, or confidential information memorandum
  - - Current ARR and NRR
    - Obscures revenue durability and growth quality
    - Request monthly recurring-revenue bridge and retention cohort data
  - - Realized pricing by segment
    - Prevents accurate gross-to-net and CAC-payback analysis
    - Review price books, discount policies, and sample contracts
  - - Egress financial contribution
    - Limits visibility into diversification beyond core SAT
    - Request acquired revenue, retention, and integration-margin data
  - - Sponsor sources-and-uses / current equity mark
    - Blocks precise private-equity return analysis
    - Request original LBO model and latest board valuation materials
  notes: These are the minimum information requests required to move from qualitative confidence to investable financial underwriting.
