  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: post-private-financials
    missingEvidence: Audited FY2023 and FY2024 revenue, EBITDA, cash flow, and balance-sheet statements.
    whyItMatters: Without audited post-private numbers, leverage and valuation can only be triangulated through lender commentary.
    diligencePath: Obtain lender presentations, management board decks, or any 144A / CIM materials tied to the refinancing.
    relatedQuestionRefs:
    - QI018
    - QI020
    - QI021
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: current-arr-and-nrr
    missingEvidence: Current ARR, numeric NRR, gross churn, and cohort performance by segment and geography.
    whyItMatters: These metrics determine whether recurring-revenue quality truly remained premium after privatization and sponsor ownership.
    diligencePath: Request monthly ARR bridge, cohort retention tables, and renewal pricing data.
    relatedQuestionRefs:
    - QI003
    - QI018
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Realized seat pricing, enterprise discounting, and attach-rate economics by product module.
    whyItMatters: Public pricing shows packaging but not net monetization or margin quality.
    diligencePath: Review price books, contracts, and win-loss notes by segment.
    relatedQuestionRefs:
    - QI017
    - QI018
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: material
    topic: equity-waterfall
    missingEvidence: Original sponsor sources-and-uses, rollover amounts, and current board mark or sponsor valuation.
    whyItMatters: Equity return potential cannot be modeled cleanly without the size of the equity check and updated debt waterfall.
    diligencePath: Request LBO model, debt schedule, and current sponsor valuation memos.
    relatedQuestionRefs:
    - QI011
    - QI020
    relatedTableRefs:
    - TI004
    - TI005
acknowledgedWarnings:
- dimension: tableNotes
  reason: Financial tables mix audited historical metrics with lender-based current signals, so notes clarify where values are forecast-like or packaging-level rather than audited current facts.
