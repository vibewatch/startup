- id: TI002
  title: Pricing / monetization table
  columns:
  - price / contract model
  - list vs realized pricing
  - discounts / unknowns
  - source-backed signal
  - implication
  rows:
  - - Per-user subscription tiers
    - Public tier packaging is visible on SAT pricing pages
    - Realized seat price is private
    - KnowBe4 monetizes largely through subscription tiers and add-ons
    - Supports predictable billings but hides enterprise discounting
  - - Annual advance billing
    - Public filings say subscription customers are typically invoiced annually in advance
    - Contract cadence by segment is not disclosed
    - Advance billing lifts deferred revenue and operating cash flow
    - Cash conversion likely stronger than usage-based SaaS models
  - - Add-on upsell motion
    - Optional modules are packaged separately from base SAT tiers
    - Attach-rate and bundle discounting unknown
    - Cross-sell appears central to monetization expansion
    - Expansion revenue may be more important than headline logo growth
  - - Pricing-packaging realignment
    - Fitch says the company implemented a strategic pricing and packaging realignment in 2024
    - Magnitude of uplift undisclosed
    - Suggests deliberate ARPU optimization post-take-private
    - Potential sponsor lever for EBITDA growth
  - - International and enterprise pricing
    - International growth and enterprise mix were discussed publicly before privatization
    - Regional pricing structure now opaque
    - Could materially affect realized ARPU and churn
    - Need cohort pricing by geography and segment
  notes: Public evidence is strong on packaging mechanics and weak on realized pricing.
