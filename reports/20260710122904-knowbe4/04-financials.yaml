- id: TI004
  title: Capital adequacy table
  columns:
  - cash on hand
  - monthly burn / FCF
  - runway months / adequacy
  - planned use of funds
  - debt obligations / trigger
  rows:
  - - $117M cash at Dec. 31 2024
    - Fitch expects FCF generation starting FY26
    - Adequate near-term liquidity per Fitch, not a venture-style runway story
    - Support operations, integration, and sponsor-backed growth under new debt stack
    - $1.46B first-lien term loan plus $200M revolver; leverage still elevated
  - - Undrawn revolver availability
    - $200M facility maturing 2030
    - Adds liquidity cushion if execution softens
    - Working capital and acquisition flexibility
    - Springing covenant detail not publicly disclosed
  - - No near-term maturities after refinance
    - Term loan due 2032
    - Removes refinancing cliff in near term
    - Allows management to focus on growth and margin expansion
    - Still leaves high absolute debt burden
  - - Interest burden reduced materially in 2025
    - Savings inferred from repricing from private-credit levels to syndicated levels
    - Improves coverage and sponsor equity value
    - Lower cash interest supports FCF improvement
    - Need exact interest schedule and fees
  - - Equity cushion opaque
    - Sponsor and rollover equity contributions undisclosed
    - Cannot fully underwrite residual equity value
    - Important for exit math and downside protection
    - Request original sources-and-uses and current debt waterfall
  notes: Capital adequacy is evaluated as a leveraged software credit, not as a cash-burning startup.
