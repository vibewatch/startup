company:
  name: KnowBe4
chapter:
  number: 4
  title: Financials
  summary: KnowBe4 looked like a high-gross-margin recurring-revenue SaaS business when it was public, but post-take-private disclosure has collapsed to a narrow credit lens. The public evidence supports a favorable view of revenue quality and cash conversion, while leaving current ARR, EBITDA, and sponsor equity value materially uncertain.
sections:
- id: public-era-revenue-quality
  title: The last public numbers showed premium SaaS economics with strong recurrence
  body: 'KnowBe4 entered its 2023 take-private as a business with unusually attractive public-market operating signals for a cybersecurity education platform. The company reported 42.6% year-over-year revenue growth and 44.1% ARR growth in Q3 2021, then reached $367.7 million of ARR and $89.9 million of quarterly revenue in its preliminary Q4 2022 release. Gross margins consistently stayed in the mid-80s, while free cash flow remained positive even as the company continued spending on sales, marketing, and product expansion. Those metrics matter because they explain why Vista could justify a premium private-market entry multiple relative to slower-growth cyber peers.


    Equally important, the quality of revenue looked stronger than the headline growth rate alone suggests. The Q3 2022 10-Q states that substantially all revenue came from subscription services, that customers are generally invoiced annually in advance, and that deferred revenue was a major source of operating cash. Fitch later reinforced that credit picture by stating that more than 99% of revenue is recurring and retention metrics remain strong. In other words, the public record supports the view that KnowBe4 was not simply a content vendor with volatile project revenue; it was a recurring SaaS platform with predictable billings, upfront cash collection, and meaningful upsell potential.'
