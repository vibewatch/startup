- id: cash-generation-and-unit-economics
  title: Unit-economics proxies were favorable, but current realized efficiency is no longer visible
  body: 'KnowBe4’s public filings gave a reasonably strong unit-economics sketch even before privatization. Q3 2021 free cash flow margin was 28.1%, and the Q3 2022 10-Q showed $80.1 million of operating cash flow over the first nine months of 2022. The company explicitly tied cash generation to annual advance billing, growing deferred revenue, and an efficient sales model. Q3 2021 commentary also highlighted rising multi-product attach rates and nearly 100% international revenue growth, both of which suggest improving customer-level monetization rather than pure logo growth. By Q4 2022, the business still showed positive operating cash flow and free cash flow despite acquisition-related noise and pending-take-private disruption.


    The problem for underwriters is that these are now legacy signals. After February 2023, investors lost visibility into current CAC efficiency, payback, NRR, realized pricing, and gross margin by product line. Fitch gives a partial substitute by projecting EBITDA margin expansion toward the low-40s and forecasting positive free cash flow starting in FY26, but that is still a ratings-agency lens rather than audited GAAP disclosure. The best defensible conclusion is that historical public metrics point to favorable software-style economics, while the current degree of operating leverage can only be inferred indirectly through debt-market behavior and lender confidence.'
