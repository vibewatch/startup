  title: Unit economics table
  columns:
  - metric
  - value / null
  - confidence
  - why it matters
  - diligence ask
  rows:
  - - Q3 2021 free cash flow margin
    - 28.1%
    - high
    - Shows strong cash conversion before privatization
    - Request FY2023-FY2025 FCF margins
  - - Q4 2022 GAAP gross margin
    - 85.4%
    - high
    - Supports premium software economics
    - Request current gross margin by product
  - - Q4 2022 non-GAAP operating margin
    - 13.0%
    - high
    - Indicates operating leverage once SBC and public-company effects are normalized
    - Request audited EBITDA bridge
  - - Net revenue retention
    - High / not quantified by Fitch
    - medium
    - Critical for compounding and debt service durability
    - Request numeric NRR by segment
  - - Multi-product attach rate
    - 19% in Q3 2021 commentary
    - medium
    - Early signal that cross-sell can raise ARPU and retention
    - Request current attach rate after Egress and PhishER expansion
  - - Capex intensity
    - About 1% of revenue in Fitch forecasts
    - medium
    - Low capex supports debt service and software valuation
    - Request actual capex and capitalization policy post-private
  notes: The current post-private picture depends on lender projections more than audited company reporting.
