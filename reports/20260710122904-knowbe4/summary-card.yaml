  topStrengths:
    - >-
      KnowBe4 has one of the strongest public customer-proof sets in private cybersecurity, including 70,000+ customers,
      broad vertical diversity, and many named case studies with measurable outcomes.
    - >-
      The revenue model still appears premium: Fitch says more than 99% of revenue is recurring and retention metrics
      remain stable.
    - >-
      The platform has expanded beyond classic SAT into response, coaching, and cloud email security, which helps defend
      against pure point-solution compression.
    - >-
      The 2025 refinancing shows lenders still underwrite KnowBe4 as a scaled sponsor-backed software asset rather than
      as a distressed special situation.
  topRisks:
    - Email-security-native and AI-native vendors can displace or compress standalone awareness-training workflows.
    - >-
      Leverage remains high and sponsor incentives may not prioritize fast deleveraging, which narrows equity margin of
      safety.
    - >-
      The North Korea fake-hire incident showed that workforce-integrity and hiring-process risk is not theoretical even
      for a security vendor.
    - Merger-related litigation and broader governance / disclosure issues still create legal overhead.
    - Current audited private-company financials, NRR, and post-refinancing equity details are not public.
  unresolvedGaps:
    - Current audited revenue, EBITDA, free cash flow, and net debt after the 2025 refinancing.
    - Segment-level renewal, churn, NRR, attach-rate, and CAC data by SMB, enterprise, and geography.
    - Full debt documents, equity ownership waterfall, and any sponsor recap or distribution constraints.
    - Quantified lost-deal / displacement evidence versus email-security-native challengers.
    - Likely settlement economics and insurance coverage for the active securities litigation.
