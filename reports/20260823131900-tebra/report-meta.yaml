  customerFocus: Independent ambulatory healthcare practices in the United States, especially small and mid-sized practices that want operations, billing, and patient-growth workflows in one system.
  businessModel: Subscription software with add-on monetization across clinical workflow, practice management, billing, payments, patient engagement, growth tools, and related services.
