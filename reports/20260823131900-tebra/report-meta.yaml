  topStrengths:
  - Integrated independent-practice workflow stack across EHR, billing, payments, patient engagement, growth, and AI-assisted documentation.
  - Scaled installed base disclosed at 140,000+ providers and 42,000+ private practices.
  - December 2025 financing added $250M and official sources describe an already profitable core business.
  - Focused solely on independent practices, a segment with real workflow pain and demand for all-in-one software.
  - Cross-module scope creates credible expansion upside if attach rates and retention are strong.
  topRisks:
  - Current ARR/revenue, NRR/GRR, gross margin, and churn remain undisclosed, leaving the valuation denominator unproven.
  - Independent-practice customers face reimbursement stress and consolidation pressure that can weaken growth and retention.
  - Review and complaint evidence suggests support, cancellation, pricing, and onboarding friction that could compress multiples.
  - The Kareo + PatientPop combination still carries product-integration and execution complexity relative to cleaner single-stack competitors.
  - Regulatory, interoperability, privacy, and information-blocking requirements add ongoing compliance and product-cost burden.
  unresolvedGaps:
  - Current ARR/revenue bridge, recent growth, and management forecast.
  - NRR, GRR, logo churn, contract length, and cohort retention by segment.
  - Gross-margin decomposition across software, RCM, payments, support, and services.
  - Cap table, preference stack, debt terms, and exact post-money valuation from the 2025 financing.
  - Customer concentration, module attach rates, and support cost per account.
