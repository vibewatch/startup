chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Origins, and Positioning
        blocks:
          - type: paragraph
            body: >-
              Tebra was created when Kareo and PatientPop closed their merger on November 2, 2021 and launched a
              combined company intended to modernize independent medical practices. The merger combined Kareo’s cloud
              EHR, scheduling, billing, and payments stack with PatientPop’s practice growth, websites, online booking,
              search marketing, registration, and messaging tools. At launch the combined platform supported more than
              100,000 healthcare providers, more than 85 million patients, and roughly 1,000 employees. Dan Rodrigues,
              Kareo’s founder and CEO, became chief executive of Tebra, while PatientPop co-founders Luke Kervin and
              Travis Schneider joined the combined leadership team. The public positioning has been consistent since
              formation: Tebra is built for independent or private practices rather than hospital systems, and it
              markets an all-in-one workflow spanning care delivery, billing, and patient acquisition instead of a
              standalone charting product.
