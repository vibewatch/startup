  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Boundary Logic
        blocks:
          - type: paragraph
            body: >-
              The right competitor map for Tebra starts with the buyer job, not the category label. Tebra sells to
              independent ambulatory practices that want to run core clinical, operational, financial, and
              patient-growth workflows from one platform. That makes athenahealth, AdvancedMD, DrChrono, RXNT, Office
              Ally, and NextGen more relevant than hospital-first vendors or generic CRM layers. It also makes
              Salesforce Health Cloud more of an adjacent enterprise platform than a like-for-like SMB EHR substitute.
              Independent reviews further sharpen the boundary: the strongest external assessment of Tebra says it is
              best when a practice both bills insurance and treats patient acquisition as an operational priority, but
              that solo therapy, cash-pay-only, and larger multi-site groups often fit better elsewhere. The practical
              read is that Tebra faces three classes of rivals at once: scaled ambulatory incumbents above it,
              lower-cost workflow substitutes below it, and adjacent enterprise platforms that matter when the customer
              is no longer truly independent.
            claimRefs:
