  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Surface
        blocks:
          - type: paragraph
            body: >-
              Tebra’s public product surface implies a multi-stream ambulatory SaaS model rather than a single-module
              EHR subscription. Official pages consistently bundle clinical documentation, practice management, billing,
              payments, patient communications, telehealth, and marketing. That architecture matters financially because
              it creates several monetization paths inside the same customer account: base software subscription,
              billing or payments-related economics, patient-experience add-ons, practice-growth services, and now
              AI-enhanced workflow features that can support pricing power or expansion. Independent reviews reinforce
              that real customer contracts are often sold as module bundles rather than as a flat commodity EHR license.
              The revenue quality upside is obvious: an integrated stack can raise ACV and create stickier workflows.
              The caution is equally clear: public evidence still does not separate software revenue from payments,
              services, or marketing-related revenue, so the precise mix and margin profile remain unknown.
