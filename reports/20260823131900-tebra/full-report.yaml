      - number: '5.4'
        title: Trust, Compliance, and Technology Risk
        blocks:
          - type: paragraph
            body: >-
              Security and compliance are central to the product pitch and not merely footer text. Tebra’s security
              pages describe HIPAA support, HITRUST and SOC 2 style control frameworks, PCI-related handling for
              payments, TLS-encrypted communications, firewalls, intrusion detection, endpoint protection, role-based
              controls, audit capabilities, and optional account-level two-factor authentication. The HIPAA page also
              references FIPS 140-2 validated encryption and independent-practice-specific support. These are credible
              trust signals, but not a full substitute for independent audit review. The same public evidence also
              surfaces real technical risk: the API terms disclaim warranties, prohibit reverse engineering and
              competing implementations, and require developers to report security deficiencies privately; the SOAP
              guide still expects polling; reviewers still describe navigation seams and pricing opacity. For product
              diligence, the result is encouraging but not clean: Tebra shows real platform depth and compliance intent,
              yet its operational complexity and mixed integration modernity remain first-order diligence topics. The
              most important missing diligence inputs are real security-audit deliverables, partner implementation
              references, API usage depth, and module-level uptime history. Without those materials, the technology case
              is directionally positive but not yet fully investment-grade.
