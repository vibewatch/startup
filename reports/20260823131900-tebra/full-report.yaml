  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Included Spend
        blocks:
          - type: paragraph
            body: >-
              Tebra should be analyzed as a workflow software platform for independent ambulatory practices, not as a
              generic global EHR vendor or as a pure practice-growth tool. The included spend is the stack that private
              practices actually buy to operate: ambulatory EHR, scheduling, billing and revenue-cycle management,
              patient communications, patient acquisition, telehealth, and reporting. The strongest external market
              proxies split this stack across multiple adjacent categories rather than one clean line item. Research and
              Markets sizes the U.S. ambulatory EHR market at $4.05 billion in 2026, while Mordor sizes the broader
              practice-management system market at $13.81 billion in 2026 and says billing and revenue-cycle
              functionality is the single largest functionality block. Tebra itself frames the opportunity as a $20
              billion-plus market because it spans more than one of those categories. The excluded spend includes
              hospital-optimized inpatient systems, life-sciences CRM, payer core-administration software, and consumer
              wellness apps that do not own insurer-linked ambulatory workflows. This boundary matters because Tebra
              wins when small practices want one vendor to run front office, clinical documentation, payments, and
              patient-growth operations together.
