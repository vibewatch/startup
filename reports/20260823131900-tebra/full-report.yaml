  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, confidence, and current price context
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a real company with meaningful platform breadth and scaled customer reach,
              but it does not support a price-insensitive underwriting decision. Tebra’s December 2025 financing is well
              corroborated and clearly strategic, yet the strongest primary sources stop short of publishing a clean
              post-money valuation, dilution stack, or current ARR. That matters because valuation quality in 2026
              depends less on narrative and more on denominator discipline. If an investor is really being asked to
              underwrite around a ~$1 billion valuation, the question is not whether Tebra is important; it is whether
              the current revenue, retention, and margin profile can justify that mark against disciplined
              healthcare-software and vertical-SaaS comparables. Because those core operating denominators remain
              private, the recommendation should remain track / research-more and the valuation stance should stay
              stretched-to-fair until management provides private evidence that the price is anchored in durable
              software economics rather than in strategic scarcity alone.
            claimRefs:
              - CV001
