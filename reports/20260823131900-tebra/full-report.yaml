      - number: '2.3'
        title: Buyers, Users, Payers, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is multi-role but operationally concentrated. The end users are clinicians, front-desk
              staff, billers, and practice managers; the economic buyer is usually the owner-physician, practice
              administrator, or small-group leadership team that has to balance reimbursement, staffing, and patient
              acquisition. Software Finder’s 2026 dataset is useful here because it says documentation speed, scheduling
              efficiency, and billing integrity explain nearly three-quarters of buyer demand, while ease of use and
              portals act as tie-breakers. That lines up closely with Tebra’s positioning. Software Finder also says SMB
              practices account for most buying activity, enterprise adoption is slower, and Tebra retains strong
              adoption in family medicine, mental health, and pediatrics—exactly the kinds of independent ambulatory
              groups the company says it serves. Tebra’s own 2026 survey reinforces the willingness-to-buy side:
              two-thirds of practices still want independence, but reimbursement pressure, claim leakage, and
              disconnected systems create urgency for integrated tools. Adoption usually starts with charting,
              scheduling, or billing pain, moves through implementation and data migration, and only later expands into
              patient engagement, marketing, automation, and AI.
