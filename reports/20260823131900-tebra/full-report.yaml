      - number: '3.3'
        title: Buying Criteria, Packaging, and Switching Cost
        blocks:
          - type: paragraph
            body: >-
              Packaging and procurement behavior explain why the field stays fragmented. Tebra’s official surface
              promises transparent pricing and hands-on onboarding, but independent review evidence says real-world
              quotes often bundle growth modules and annual commitments. athenahealth leans into
              percentage-of-collections or customized commercial models, which can fit larger or more RCM-intensive
              groups but makes direct comparison hard. AdvancedMD and DrChrono are usually evaluated as all-in-one
              EHR-plus-billing suites, while RXNT and Office Ally set the low-end anchor by being cheaper or even
              no-monthly-fee on the practice-management side. This creates a classic switching-cost problem for Tebra
              buyers: once a clinic has data, templates, claims workflows, and front-office habits inside one system,
              replacement is painful; but before go-live, pricing and module fit remain highly contestable. Tebra wins
              when the practice values integrated growth tooling and support enough to justify a higher effective ACV
              than low-cost substitutes, especially when onboarding quality, implementation support, smoother staff
              training, and new-patient ROI matter more than the cheapest possible monthly software bill overall.
            claimRefs:
