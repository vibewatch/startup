      - number: '1.3'
        title: Current Scale, Product Scope, and Independent-Practice Focus
        blocks:
          - type: paragraph
            body: >-
              Tebra’s latest official scale markers are materially higher than the launch metrics. The December 2025
              financing release says the platform is trusted by more than 140,000 private healthcare providers and
              monetizes an existing base of 125 million patient records. The same release says more than 42,000 private
              practices trust the platform, while the home page and feature pages emphasize a connected “EHR+” bundle
              that includes charting, billing, scheduling, reporting, patient experience, marketing, telehealth, and new
              AI automation. The official product framing is notable because it repeatedly defines Tebra against
              independent-practice economics rather than enterprise health-system complexity. The company pitches one
              login, faster go-live, minimal IT dependency, and integrated workflows for smaller ambulatory
              organizations that need both revenue-cycle discipline and patient acquisition support. Third-party
              hands-on review coverage broadly agrees with that segmentation, describing the sweet spot as small
              independent practices that bill insurance and care about patient growth, while warning that larger
              enterprises may prefer deeper analytics from incumbents such as athenahealth or AdvancedMD.
