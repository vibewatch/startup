            body: >-
              The most encouraging customer evidence is that Tebra appears able to expand within accounts and across
              adjacent customer types. Case studies show practices adopting more modules over time, a billing company
              standardizing all of its clients on Tebra, and public statements that existing customers monetize through
              AI, patient payments, review automation, and integrated workflows. But there is also visible churn
              pressure. Independent practices are under financial strain, buyer confidence is weakening, and several
