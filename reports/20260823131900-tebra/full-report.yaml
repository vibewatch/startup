            body: >-
              The go-to-market story is directionally supportive but not numerically complete. Tebra says the business
              has a diversified go-to-market engine and uses case studies to show how integrated billing, patient
              communications, and AI note automation can create ROI for independent practices. The psychiatry case study
              is particularly useful because it links workflow software to growth, telehealth mix, review improvement,
              and claimed annual savings. Third-party review sources also show why Tebra can monetize beyond pure
              software: customers repeatedly cite onboarding, billing guidance, API access, and support as part of the
              product value rather than as incidental services. But all of this remains proxy evidence. There is no
              public CAC, sales cycle, payback period, gross retention, NRR, or implementation cost disclosure. That
