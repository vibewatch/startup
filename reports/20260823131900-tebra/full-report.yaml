      - number: '8.2'
        title: Comparable valuation frame and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The comp set for Tebra should be triangulated, not copied. Tebra is not as broad or scaled as
              athenahealth, not as pure-play and profitable as Veeva, and not as publicly transparent as Phreesia.
              Still, those references are directionally useful because they show how investors price regulated workflow
              software when revenue quality, retention, and margin are visible. Third-party valuation pages and advisory
              writeups also show that 2026 software pricing is bifurcated: broad SaaS M&A medians are near 4x revenue,
              public SaaS medians can sit even lower, while premium vertical platforms with embedded workflows and
              defensible moats can trade materially higher. Entry discipline for Tebra should therefore start with an
              implied revenue test. If the company’s current ARR or revenue is only modestly above $100 million, a ~$1
              billion mark starts to look demanding unless retention, profitability, and embedded payments/RCM expansion
              are exceptional. If revenue is closer to the high hundreds of millions with profitable-core economics and
              good retention, the mark becomes much easier to defend.
            claimRefs:
