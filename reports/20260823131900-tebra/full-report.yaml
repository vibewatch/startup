companyProfile:
  summary: >-
    Tebra is the 2021 combination of Kareo and PatientPop, built to serve independent U.S. healthcare practices with an
    integrated workflow stack spanning EHR, scheduling, billing, payments, growth, and patient engagement. The company
    positions itself as an all-in-one platform for private practices rather than hospital systems, and its strongest
