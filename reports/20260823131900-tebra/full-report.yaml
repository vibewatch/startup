      - number: '2.4'
        title: Growth Drivers, Constraints, and Explicit Contradictions
        blocks:
          - type: paragraph
            body: >-
              The structural drivers are clear: outpatient migration, cloud replacement cycles, interoperability
              mandates, AI-enabled documentation and RCM automation, and mounting administrative burden at private
              practices. Mordor and Research and Markets both highlight cloud migration, specialty workflow needs,
              reimbursement complexity, and value-based-care reporting as growth engines. HHS and ONC sources show TEFCA
              exchange volume and interoperability expectations are still rising, while CMS quality-payment
              infrastructure continues to reward software that can capture and transmit quality data. But the
              constraints are equally important. Independent practice is shrinking as ownership consolidates;
              PAI/Avalere and AMA show physician-owned practices and private-practice share continuing to fall. Analyst
              sources also point to implementation cost, workflow disruption, staff training, cybersecurity risk, and
              outage exposure as meaningful barriers. This creates a subtle contradiction in the Tebra thesis: the pain
              points that make integrated software attractive also push some independent practices toward larger groups
              or hospital systems. That is why the best market read is not “every ambulatory dollar belongs to Tebra,”
              but “Tebra addresses a pressured and still-large segment whose urgency is high, whose budgets are
              fragmented, and whose long-term size depends on whether independent practices can remain viable.”
