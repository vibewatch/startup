      - number: '1.4'
        title: Leadership Signals, Customer Proof, and Category Context
        blocks:
          - type: paragraph
            body: >-
              Leadership visibility is strongest around founder-CEO Dan Rodrigues and around customer-outcome
              storytelling tied to private-practice pain points. Tebra’s case studies and AI pages describe
              note-generation, billing, and growth outcomes such as more than half a million AI-generated clinical notes
              in the second half of 2025, average documentation-time savings of 60% per note, and a 45% increase in
              website clicks from AI review-reply tools. Customer-facing proof also includes a billing-service case
              study highlighting 250-client scale and six-figure annualized savings, plus mixed but active review
              channels across Software Advice, Trustpilot, and BBB complaints. The broader backdrop supports Tebra’s
              strategic framing: AMA and PAI/Avalere evidence shows private practice is shrinking, reimbursement
              pressure remains intense, and independence is increasingly difficult to sustain. Tebra’s own 2026 survey
              echoes that environment, reporting that two-thirds of practices want to remain independent but many are
              under strain from weak reimbursements, disconnected systems, and claim leakage. This is the central
              company-overview takeaway: Tebra is not merely selling software, but selling a survival-and-growth
              operating system for a pressured ambulatory segment.
