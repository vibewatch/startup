      - number: '5.2'
        title: Architecture and Integration Model
        blocks:
          - type: paragraph
            body: >-
              Public documentation exposes enough of the integration model to say something concrete about architecture.
              Tebra still supports a mature SOAP API surface for third-party applications, with customer keys, login
              credentials, external IDs, and polling-based synchronization patterns. The help-center guide explicitly
              says there is no automatic push mechanism and no HL7 messaging support in that SOAP path, which is
              important because it reveals a more legacy integration posture than some modern cloud-native healthcare
              APIs. At the same time, Tebra’s FHIR guide shows real movement toward current interoperability
              expectations: it is built to satisfy USCDI requirements, conforms to HL7 FHIR US Core/STU3 and FHIR R4,
              and supports both patient-facing and backend application registration. The practical conclusion is that
              Tebra is evolving rather than freshly rebuilt—strong enough for production integrations, but still
              carrying older design choices that could slow partner implementation or create architectural seams.
