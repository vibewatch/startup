  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked Risk Overview
        blocks:
          - type: paragraph
            body: >-
              The highest-severity Tebra risks cluster around compliance-heavy operating complexity rather than a single
              binary failure. Because Tebra handles PHI across EHR, billing, patient communications, telehealth, AI note
              generation, and interoperability surfaces, even modest execution errors can have outsized regulatory or
              reputational consequences. At the same time, the company’s customer base is concentrated in independent
              practices that are already under reimbursement, staffing, and consolidation pressure. That creates an
              uncomfortable interaction: Tebra must keep expanding product breadth while making the platform easier,
              safer, and more supportable for customers who have limited tolerance for workflow friction or pricing
              surprises. The best way to read the current public record is that Tebra has meaningful mitigation in
              place—security controls, trust pages, release management, product documentation, and fresh financing—but
              still faces several material diligence questions around audit scope, incident history, contractual terms,
              and support economics. Investors should assume several risks interact simultaneously, not sequentially.
