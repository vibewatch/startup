  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base and Ideal Customer Profile
        blocks:
          - type: paragraph
            body: >-
              Tebra is not selling to the entire provider universe. Its public materials consistently narrow the target
              to independent practices that need both operational software and business support. Official disclosures
              say the platform serves more than 140,000 providers and more than 42,000 private practices, while external
              reviewers repeatedly describe the best-fit buyer as a small or mid-sized insurance-billing practice rather
              than a hospital enterprise or a cash-pay microclinic. The product promise is especially resonant where
              ownership still values independence but feels pressure from reimbursements, documentation, and patient
              acquisition. That means the ideal account is not merely an EHR buyer; it is a practice owner looking for
              one vendor to help protect revenue, reduce admin burden, and sustain growth. This framing matters because
              it explains both Tebra’s differentiation and its sales complexity: the company is trying to land a
              multithreaded operational buyer rather than a single clinical user. The practical implication for
              diligence is that customer quality depends on operational fit, not simply on provider count headlines.
