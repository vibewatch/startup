- id: operational-security-and-dependency-risk
  title: Operational, Security, and Dependency Risk
  body: The operational risk picture is mixed. Public security pages describe serious controls—TLS, firewalls, intrusion detection, endpoint protection, role-based permissions, account lockouts, and optional account-level two-factor authentication. Help documentation for AI Note Assist and API integrations also shows real workflow discipline, including explicit warnings about consent, browser constraints, structured-data completion, and the absence of automatic push or HL7 support on the SOAP path. These are helpful signals because they show Tebra is not hiding complexity. They also reveal where the platform can break. Customer administrators can still misconfigure access or defer stronger security options. AI and telehealth workflows depend on correct browser, microphone, and sharing behavior. Interoperability remains split between newer FHIR work and older polling-oriented patterns. The company is therefore exposed to both classic security/compliance incidents and slower-burn operational
    erosion caused by support burden, integration friction, and module seams. Monitoring discipline matters.
  claimRefs:
  - CR022
  - CR023
  - CR024
  - CR025
