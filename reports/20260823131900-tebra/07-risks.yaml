- id: regulatory-legal-and-privacy-risk
  title: Regulatory, Legal, and Privacy Risk
  body: 'Healthcare IT risk is increasingly shaped by access, interoperability, and privacy obligations that move faster than many vendors’ product roadmaps. Public 2025-2026 regulatory materials show intensifying federal attention on information blocking, TEFCA participant oversight, API policy, and patient access rights. Tebra’s FHIR and API posture puts it directly inside that changing landscape, even if it is not itself a QHIN. The risk is not that any one rule immediately breaks the business; it is that access-response timelines, API expectations, data-exchange rules, and patient-rights enforcement all increase the cost of staying compliant while narrowing room for implementation error. Tebra’s own public legal and trust surfaces help, but they do not answer the hardest diligence questions: exactly how responsibilities are allocated in enterprise contracts, how privacy complaints are handled operationally, or how quickly the company can turn policy change into shipped product behavior
    across legacy and newer modules.'
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
