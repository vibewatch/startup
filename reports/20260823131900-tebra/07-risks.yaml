- id: customer-model-and-execution-risk
  title: Customer, Model, and Execution Risk
  body: 'Tebra’s business model inherits risk from the health of independent practice itself. AMA, PAI/Avalere, and Becker’s evidence all point in the same direction: independent ownership continues to shrink while reimbursement pressure, administrative burden, and scale advantages push more physicians into hospital or corporate settings. That backdrop can raise both churn and acquisition costs even if Tebra executes well. Review channels add a second layer of risk by suggesting that support quality, billing transparency, migration experience, and cancellation handling materially shape customer outcomes. The company’s December 2025 financing and profitable-core language reduce immediate solvency anxiety, but they do not eliminate execution risk; if support intensity, product complexity, or commercial rigidity stay high, growth could become more expensive and reputation could deteriorate faster than headline provider counts suggest. For investment purposes, this is the chapter’s most practical
    kill zone: weak retention masked by top-line expansion would be hard to spot from public data but very damaging in reality. That is why private cohort data is essential.'
