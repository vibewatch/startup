- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Regulatory / interoperability compliance
    - Evidence of OCR/OIG/ONC enforcement, certification issues, or unresolved access complaints
    - Any formal enforcement action, public consent/privacy incident, or repeated missed policy deadlines
    - Escalate diligence immediately; assume margin and growth pressure
  - - Security / privacy controls
    - Major breach, material audit exception, or customer-facing security regression
    - Public incident with PHI exposure or inability to produce current control reports
    - Pause valuation support until root-cause and remediation are reviewed
  - - Customer retention quality
    - Rising complaints, cancellation disputes, or low module expansion versus sales pace
    - Cohort churn materially worse than management narrative or support ticket load surges
    - Treat provider-count growth with skepticism and cut revenue-multiple assumptions
  - - Independent-practice TAM erosion
    - Accelerating practice consolidation or worsened reimbursement shock in core segments
    - Customer cohort contraction or elevated downsell in small practices
    - Increase required return and shorten hold assumptions
  - - Operational support burden
    - Escalating time-to-go-live, unresolved ticket backlog, or heavy manual-save effort
    - Support cost/account rises faster than gross profit or NRR stalls
    - Reframe business as service-heavy software, not pure SaaS
  - - Legacy-modernization progress
    - Failure to migrate interoperability or module seams toward cleaner workflows
    - Roadmap slips on FHIR/API, billing, or cross-module usability priorities
    - Assume slower competitive differentiation and higher maintenance drag
  notes: These kill criteria are designed for investment monitoring, not for internal company risk management.
