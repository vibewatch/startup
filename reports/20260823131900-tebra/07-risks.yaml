  evidenceGaps:
  - type: missing-source
    severity: material
    topic: audit-and-incident-evidence
    missingEvidence: No public SOC report dates, control exceptions, incident history, pen-test summaries, or breach-response record sufficient for underwriting security posture.
    whyItMatters: Trust pages alone cannot price privacy/security downside in healthcare IT.
    diligencePath: Review current SOC/HITRUST materials, incident register, external pen tests, and security org ownership.
    relatedQuestionRefs:
