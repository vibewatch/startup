  evidenceGaps:
  - type: missing-source
    severity: material
    topic: independent-reliability-metrics
    missingEvidence: No public uptime, incident-rate, MTTR, or environment-level reliability dashboard for core product modules.
    whyItMatters: A broad ambulatory operating system creates many operational dependencies; reliability is central to customer trust.
    diligencePath: Request status history, uptime by module, incident postmortems, and support-volume trends.
    relatedQuestionRefs:
    - QE015
    - QE025
  - type: missing-source
    severity: material
    topic: api-adoption-and-modernization
    missingEvidence: No public data on active API partners, FHIR production volume, SOAP-to-FHIR migration, or partner implementation timelines.
    whyItMatters: Without adoption data, it is hard to judge whether interoperability is strategic depth or merely checkbox documentation.
    diligencePath: Request partner count, API call volumes, FHIR resource usage, and migration roadmap.
    relatedQuestionRefs:
    - QE009
    - QE011
    - QE025
  - type: missing-source
    severity: material
    topic: independent-security-evidence
    missingEvidence: Public pages reference controls and attestations, but not the underlying report dates, audit exceptions, or incident record.
    whyItMatters: Trust/compliance claims are central to the product thesis and need stronger verification for investment-grade diligence.
    diligencePath: Review current SOC/HITRUST/PCI materials, pen-test summaries, and security incident history.
    relatedQuestionRefs:
    - QE017
    - QE025
