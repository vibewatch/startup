- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - SOAP API
    - Legacy third-party integration surface for Tebra data and functions
    - Customer key, credentials, polling routines, developer implementation quality
    - Polling, no push, and no HL7 on published path can slow modern integrations
  - - FHIR API
    - ONC/USCDI-oriented modern interoperability surface
    - SmileCDR partnership, developer registration, OAuth app models
    - Implementation is ongoing and resource coverage is expanding over time
  - - AI Note Assist capture layer
    - Ambient recording and note generation during visits
    - Browser permissions, microphone quality, workflow discipline, consent process
    - Recording constraints, user error, and jurisdiction-specific consent rules
  - - Core clinical workflow
    - Patient chart, notes, medications, vitals, lab and history surfaces
    - Browser performance, role configuration, note types
    - AI output still needs structured data completion
  - - Practice growth stack
    - Websites, booking widgets, review replies, analytics
    - Legacy PatientPop surfaces and identity/reporting integration
    - Outside reviewers still report dashboard seams
  - - Security / identity layer
    - TLS, roles, account lockouts, optional 2FA, audit-style controls
    - User setup accuracy, customer policy choices, hosting environment
    - Misconfiguration or weak admin practice could undermine platform trust
  notes: Architecture evidence points to a real, layered platform, but one that mixes older and newer integration paradigms.
