- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Chart an encounter
    - Provider listens, documents, codes, finalizes note
    - AI Note Assist captures conversation and drafts structured note inside EHR
    - Up to 50% or 60% documentation-time reduction depending on source
    - Provider still reviews, edits, and adds structured data
  - - Run front-desk scheduling
    - Staff books, verifies eligibility, sends reminders
    - Connected scheduling, reminders, intake, and eligibility support
    - Lower admin burden and fewer handoffs
    - Workflow quality varies by configuration
  - - Submit and manage claims
    - Billers generate claims, post remits, chase denials
    - Integrated billing / RCM workflow with reports and claims operations
    - Goal is faster reimbursement and fewer denials
    - Public docs do not disclose claim-error or collection benchmarks
  - - Support telehealth documentation
    - Provider runs video visit then documents later
    - AI Note Assist telehealth workflow with recording and note generation
    - Reduced after-hours charting
    - Requires Chrome and screen sharing; group telehealth unsupported
  - - Attract and retain patients
    - Practice manages website, reviews, online booking, reminders
    - Practice Growth and Patient Experience modules
    - Potential website-click and review ROI
    - Outside reviewers still feel seams between charting and growth dashboards
  notes: Benefits are partly measured and partly directional; the public record is stronger on workflow detail than on independent benchmark output.
