  - - TABS billing service
    - Medical billing company / channel-like partner
    - Standardized clients on Billing, Clinical, Engage, RPA, and AI Note Assist
    - Production operating standard across client base
    - 250 active clients, 45 employees, 50 new healthcare clients per year, six-figure annual growth claimed
    - Customer mix, contract terms, and Tebra revenue share undisclosed
  - - Optimal Psychiatry & Wellness
    - Mental-health growth practice
    - Connected workflows across intake, charting, prescribing, and reputation management
    - Production proof via Tebra independent-practice article
    - Saved $195k annually on intake alone and $32.5k on lab/prescription management according to company story
    - Article summary rather than full neutral case study
  - - Celebrations Speech Group
    - Speech therapy multi-location practice
    - Workflow automation across scheduling, billing, documentation, and outreach
    - Production proof via Tebra independent-practice article
    - No-shows cut from ~50% to <1%; $2.75M annual efficiency gains claimed
    - No external validation or raw baseline data
  - - Public review-driven new-practice launches
    - New independent clinics
    - Onboarding, implementation, telehealth, and early workflow setup
    - Early production / go-live stage
    - Multiple Trustpilot AU reviews describe smooth launches and supportive onboarding managers
    - Review quality is self-selected and not contractually representative
  notes: This table isolates named or attributable customer proof rather than broad platform counts.
