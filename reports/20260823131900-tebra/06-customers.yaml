- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Cross-module upsell from core EHR / billing into AI, telehealth, reviews, payments, and growth tools
    - Medium — expansion depends on customers believing the all-in-one suite is worth extra spend
    - Can lift wallet share inside an installed 42k-practice base
    - Request attach rates, expansion ARR, and module-level renewal by cohort
  - - Billing-company standardization and partner-led influence
    - Medium — a few influential billing partners may represent outsized referral or support dynamics
    - Can multiply distribution into many downstream practices
    - Request revenue concentration and bookings sourced from partner/billing-company channels
  - - Independent-practice economic stress
    - High — customers face reimbursement pressure and consolidation that can remove them from the buyer pool entirely
    - Logo churn can occur even when product fit is reasonable
    - Map churn and downsell by specialty, payer mix, and practice size
  - - Support-led adoption model
    - Medium-High — value realization may depend on onboarding and rep quality
    - Strong support creates retention; weak support creates detractors quickly
    - Request support cost per account, first-response SLAs, and ticket escalation outcomes
  - - Commercial transparency and contract rigidity
    - High — early termination fees or hidden-cost perceptions can damage word of mouth across SMB buyers
    - Can depress close rates, NRR, and brand trust
    - Review contract templates, cancellation terms, and complaint-resolution data
  - - Data / workflow lock-in versus portability concerns
    - Medium — customers may stay for convenience but resent migration friction or data-export difficulty
    - Can create fragile retention and reputational harm if switching pain is high
    - Request export SLAs, migration win/loss notes, and save-team outcomes
  notes: The central customer risk is less single-logo concentration than exposure to stressed SMB cohorts, support intensity, and commercial fairness.
