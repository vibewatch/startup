  rows:
  - - Arjun Reyes MD and Associates
    - Psychiatry / mental health practice
    - EHR, eRx, reminders, billing, telehealth, patient surveys, portal tools, and AI Note Assist
    - Production deployment since 2018; AI add-on in 2025
    - 67% growth to 5,000+ clients; 40% telehealth mix in 2025; 230+ reviews and rating improvement claimed
