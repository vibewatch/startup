tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale signal
  - Revenue / strategic value
  - Gap
  rows:
  - - Independent owner-operated practices
    - Practice owner; providers; office staff; payer mix from insurers and patients
    - Core EHR, scheduling, billing, reminders, payments, patient messaging
    - 42,000+ practices and 140,000+ providers disclosed
    - Core logo base and primary upsell pool
    - No disclosure of average ACV or module mix
  - - Growing specialty groups
    - Physician-owner or operator; multi-clinician teams
    - Scale visits, documentation, telehealth, intake, and billing without adding admin headcount
    - Psychiatry and speech-therapy customer stories
    - Higher seat count and attach-rate potential
    - No segment-level retention or expansion data
  - - Medical billing companies
    - Billing-company owner; billing staff; downstream practice users
    - Standardize client billing, onboarding, and reporting on one system
    - TABS public case study; billing testimonials
    - Channel-like multiplier if one partner influences many practices
    - No disclosed share of bookings from billing-company cohort
  - - New practice launches
    - New owner-operators and startup clinics
    - Go-live, training, migration, and early workflow setup
    - Trustpilot onboarding narratives; implementation praise
    - Can create sticky early vendor relationship
    - High sensitivity to migration friction and hidden fees
  - - Cash-pay or single-purpose buyers
    - Small provider teams with limited RCM need
    - Light charting or patient communication only
    - External reviewers often suggest cheaper / narrower alternatives
    - Possible logo source but weaker suite monetization
    - No public attach or churn split
  - - Large enterprise / hospital buyers
    - Procurement-led organizations
    - Potential niche module interest only
    - External reviews steer these buyers elsewhere
    - Low strategic fit under current positioning
    - No evidence of large-enterprise penetration
  notes: Segmentation is inferred from official positioning, customer stories, and external review guidance rather than from a company-disclosed cohort deck.
