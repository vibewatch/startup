    severity: material
    topic: retention-metrics
    missingEvidence: No public cohort retention, gross retention, NRR, attach-rate, or churn-by-segment metrics.
    whyItMatters: Customer scale alone cannot distinguish sticky expansion from expensive replacement selling.
    diligencePath: Request cohort tables by practice size, specialty, product bundle, and acquisition year.
    relatedQuestionRefs:
    - QU022
    - QU024
  - type: missing-source
    severity: material
    topic: implementation-economics
    missingEvidence: No public time-to-go-live, migration success, support-load, or onboarding completion metrics.
    whyItMatters: Review evidence suggests onboarding quality is central to customer outcomes and support costs.
    diligencePath: Request implementation SLAs, average deployment time, support-ticket curves, and onboarding CSAT.
    relatedQuestionRefs:
    - QU015
    - QU023
    - QU024
  - type: missing-source
    severity: material
    topic: segment-profitability
    missingEvidence: No public view of which customer cohorts are most profitable or most complaint-prone.
    whyItMatters: Independent practices are heterogeneous; some may carry high support cost or high churn even if top-line scale looks strong.
    diligencePath: Request unit economics and retention by solo, 2-10 provider, specialty, and billing-company segments.
    relatedQuestionRefs:
    - QU003
    - QU021
    - QU024
    relatedTableRefs:
    - TU003
