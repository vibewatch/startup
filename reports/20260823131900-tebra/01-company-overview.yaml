- id: capital-and-corporate-evolution
  title: Capital Base, Rebranding, and Corporate Evolution
  body: 'Public financing history shows two major disclosed inflection points. First, Tebra received $65 million of additional growth financing from Golub Capital alongside the 2021 merger. Second, on December 17, 2025, the company announced $250 million of new equity and debt financing, led primarily by Hildred on the equity side with a debt facility from J.P. Morgan and follow-on support from Toba Capital, Transformation Capital, and HLM Venture Partners. Management described the round as oversubscribed and framed it as fuel for AI-led product development. The December 2025 release is also the cleanest public statement that the business had reached a profitable core and intended to scale a diversified go-to-market engine around its installed provider base. The branding integration also continued after the merger: Kareo’s website was transitioned fully to the Tebra brand, signaling the end of the dual-brand era and a single commercial identity for the combined company.'
