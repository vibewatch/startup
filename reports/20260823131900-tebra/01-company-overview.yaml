company:
  name: Tebra
chapter:
  number: 1
  title: Company Overview
  summary: Tebra is a private Newport Beach healthcare software company created by the 2021 merger of Kareo and PatientPop. The business positions itself as the only all-in-one EHR+ platform built specifically for independent practices, and its December 2025 financing reset the scale narrative to 140,000 providers, 42,000 practices, 125 million patient records, and a profitable core business. The public evidence supports a strong independent-practice focus and a meaningful capital base, but exact ownership percentages, full board composition, total lifetime capital raised, and detailed debt terms remain non-public diligence gaps.
sections:
- id: identity-and-origin
  title: Identity, Origins, and Positioning
  body: 'Tebra was created when Kareo and PatientPop closed their merger on November 2, 2021 and launched a combined company intended to modernize independent medical practices. The merger combined Kareo’s cloud EHR, scheduling, billing, and payments stack with PatientPop’s practice growth, websites, online booking, search marketing, registration, and messaging tools. At launch the combined platform supported more than 100,000 healthcare providers, more than 85 million patients, and roughly 1,000 employees. Dan Rodrigues, Kareo’s founder and CEO, became chief executive of Tebra, while PatientPop co-founders Luke Kervin and Travis Schneider joined the combined leadership team. The public positioning has been consistent since formation: Tebra is built for independent or private practices rather than hospital systems, and it markets an all-in-one workflow spanning care delivery, billing, and patient acquisition instead of a standalone charting product.'
  claimRefs:
