  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-composition
    missingEvidence: A current board roster with sponsor representation, committee membership, and independent directors.
    whyItMatters: Board composition determines governance discipline, sponsor control, and founder dependence at a critical stage after a large financing.
    diligencePath: Request the latest board deck, board observer list, and governance documents from management.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: ownership-structure
    missingEvidence: A full cap table showing ownership percentages, preference stack, and any special rights held by Hildred, Golub, or earlier investors.
    whyItMatters: Without ownership data, investors cannot assess control, dilution overhang, or whether new capital changed power dynamics materially.
    diligencePath: Request current cap table, charter, investor rights agreement, and any side letters associated with the 2025 financing.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: debt-facility-terms
    missingEvidence: Detailed J.P. Morgan facility size, maturity, covenants, pricing, collateral, and permitted indebtedness terms.
    whyItMatters: Debt structure changes downside risk, burn flexibility, and future financing capacity even if the operating business is profitable today.
    diligencePath: Obtain the credit agreement, lender presentation, or audited debt footnotes covering the December 2025 facility.
    relatedQuestionRefs:
    - QO025
  - type: private-evidence-only
    severity: minor
    topic: current-headcount
    missingEvidence: An exact current employee count by function and geography after the 2025 financing.
    whyItMatters: Headcount is a useful operating-efficiency proxy and helps assess support intensity, sales capacity, and post-merger integration maturity.
    diligencePath: Request an HR roster summary or current organizational snapshot from management.
    relatedQuestionRefs:
    - QO005
  - type: private-evidence-only
    severity: minor
    topic: lifetime-capital-raised
    missingEvidence: A complete round-by-round funding history across Kareo, PatientPop, merger financing, and post-merger capital.
    whyItMatters: The full funding record informs dilution history and whether the 2025 round was a reset, extension, or late-stage acceleration round.
    diligencePath: Request financing history from the finance team or prior board materials summarizing historical capital formation.
    relatedQuestionRefs:
    - QO006
    - QO011
