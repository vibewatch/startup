- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Revenue/ARR comfortably above premium-implied threshold; profitable core scales; net retention strong; support burden manageable
    - ~$1B can be fair-to-attractive and strategic upside can support higher marks over time
    - Competition, regulatory burden, and customer-base consolidation remain real
    - Management discloses strong cohorts and clean margin bridge
  - - Base
    - Company is strategically valuable, but denominator remains private and some execution friction persists
    - Track until ARR/revenue, NRR, and margin prove the mark; fair-to-stretched today
    - Price may be okay, but hard to verify without private KPI package
    - Management provides partial proof, not enough for conviction
  - - Bear
    - Revenue denominator materially below implied range, or retention/support economics weak
    - ~$1B looks expensive and return profile compresses
    - Customer stress, churn, pricing complaints, or services-heavy delivery
    - Private data misses core thresholds or cap-table terms are unattractive
  - - Strategic upside case
    - Large strategic or sponsor buyer values independent-practice distribution plus AI/RCM expansion
    - Could justify premium beyond base-case comp math
    - Requires scarcity and real cross-sell economics, not just story
    - Buyer interest and private metrics both validate the thesis
  notes: Scenario math is based on implied denominators and public comp ranges, not on reported Tebra revenue.
