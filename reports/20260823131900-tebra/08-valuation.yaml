- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Tebra financing reference
    - Official + secondary funding coverage
    - Closed $250M financing in Dec. 2025; clean post-money valuation not disclosed in strongest primary sources
    - Direct price context for subject company
    - Primary evidence supports amount and strategic intent more strongly than exact valuation
  - - athenahealth
    - Official and sector deal coverage
    - Acquired for ~$17B in 2022
    - Scaled ambulatory/EHR/RCM platform benchmark and strategic ceiling reference
    - Much larger, more mature, and not a direct private-market pricing comp for Tebra
  - - Veeva
    - Public company results + Windsor valuation survey
    - FY26 revenue $3.195B; Windsor cites ~9.0x trailing revenue public multiple
    - Premium regulated vertical-software comp showing what strong disclosure and margins can earn
    - Life-sciences focus and scale are very different from independent-practice healthcare IT
  - - Phreesia
    - Public company results + 10-K
    - FY26 revenue $480.6M, positive GAAP income, $101.5M adjusted EBITDA
    - Healthcare workflow / patient-engagement comp with visible public economics
    - Different product mix and business model, including network solutions and payments
  - - Healthcare IT vertical premium
    - Windsor vertical SaaS report
    - Healthcare IT roughly 8.5x-11.0x EV/revenue range in 2026 write-up
    - Useful premium-range lens for best-in-class healthcare vertical software
    - Advisory/benchmark source, not a direct Tebra mark
  - - SaaS / healthcare M&A median
    - Windsor ARR-band report and FOCUS dashboard
    - Broad SaaS M&A median around 4.0x revenue; founder-led ARR bands ~4.0x-6.5x; medtech/medical-practice ranges below top-tier public SaaS
    - Defines lower-bound or base-case market discipline
    - Ranges blend different samples, sizes, and quality bands
  - - Clay funding dossier
    - Secondary funding summary
    - Suggests >$1B valuation from 2022 and at least $387M raised overall
    - Helpful directional cross-check on market perception
    - Secondary, unaudited, and not sufficient as primary pricing proof
  notes: Comp set is representative and triangulated; it should guide entry discipline, not replace direct diligence.
