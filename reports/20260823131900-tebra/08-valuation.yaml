  - CV041
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - Current ARR / revenue and growth bridge
    - Run-rate revenue, recent quarters, bookings quality, and forecast
    - Validates whether the current price is even in the zone of reason
    - Request board KPI package and monthly revenue/ARR bridge
  - - Retention and concentration
    - NRR, GRR, logo churn, top-customer share, contract length
    - Separates broad installed base from durable economic value
    - Review cohort schedules and customer concentration by segment
  - - Gross margin and support load
    - Software gross margin, payments/RCM/services mix, support cost per account
    - Determines whether Tebra deserves software-like multiples
    - Review P&L by module and cost-to-serve analysis
  - - Cap table and financing terms
    - Preference stack, debt, option pool, liquidation rights, and dilution
    - Controls real entry economics and downside protection
    - Inspect financing docs and pro forma cap table
  - - Module attach and expansion
    - Share of customers using billing, payments, AI, growth, and telehealth products
    - Tests land-and-expand claim directly
    - Request attach-rate and expansion cohort tables
  - - Exit readiness and audit quality
    - Financial audit status, quality of earnings, legal/privacy artifacts, and customer references
    - Determines whether a strong story can become an institutional exit
    - QofE, legal diligence, security diligence, and reference calls
  notes: These asks are designed to convert a strategically plausible story into price-supporting underwriting evidence.
