company:
  name: Tebra
chapter:
  number: 8
  title: Valuation
  summary: 'Tebra looks strategically important and commercially credible, but the public record still does not provide the denominator needed to underwrite a price-insensitive buy. The strongest facts are the $250 million December 2025 financing, the official scale claims around providers and private practices, the profitable-core language, and a product/customer story consistent with a serious vertical-software platform. The weakest facts are exactly the ones valuation committees need most: current ARR or revenue, gross margin, NRR, cohort retention, cap-table terms, and clear post-money valuation support from primary sources. That combination argues for a track / research-more recommendation and a stretched-to-fair stance around an implied ~$1 billion mark, with willingness to turn constructive only if private KPI packs confirm that Tebra is already near the revenue and retention thresholds required by current healthcare-IT and vertical-SaaS comp ranges.'
sections:
- id: recommendation-and-price-context
  title: Recommendation, confidence, and current price context
  body: The public evidence supports a real company with meaningful platform breadth and scaled customer reach, but it does not support a price-insensitive underwriting decision. Tebra’s December 2025 financing is well corroborated and clearly strategic, yet the strongest primary sources stop short of publishing a clean post-money valuation, dilution stack, or current ARR. That matters because valuation quality in 2026 depends less on narrative and more on denominator discipline. If an investor is really being asked to underwrite around a ~$1 billion valuation, the question is not whether Tebra is important; it is whether the current revenue, retention, and margin profile can justify that mark against disciplined healthcare-software and vertical-SaaS comparables. Because those core operating denominators remain private, the recommendation should remain track / research-more and the valuation stance should stay stretched-to-fair until management provides private evidence that the price is
    anchored in durable software economics rather than in strategic scarcity alone.
  claimRefs:
