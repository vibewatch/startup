- id: scenario-valuation-logic
  title: Bull, base, and bear scenario logic under explicit uncertainty
  body: 'Scenario logic is possible without inventing Tebra revenue as long as the denominator is labeled as implied rather than reported. A ~$1 billion equity value would imply about $250 million of revenue at a 4.0x revenue multiple, roughly $200 million at 5.0x, about $154 million at 6.5x, and roughly $91 million to $118 million at 8.5x to 11.0x premium healthcare-IT multiples. The bull case requires Tebra to sit toward the premium end: strong retention, real margin durability, credible cross-sell from billing/payments/growth/AI, and little evidence that support or complaints are masking weak customer economics. The base case says the company is strategically strong but still needs KPI proof, making the mark fair-to-stretched rather than clearly attractive. The bear case is simple: if ARR/revenue is materially below the implied thresholds, if support burden is heavy, or if module seams drive weaker net retention, the public comp set will not rescue the price.'
