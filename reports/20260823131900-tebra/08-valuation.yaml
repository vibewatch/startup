- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence
  - What would change the view
  rows:
  - - 'Thesis: Tebra is a real vertical platform with meaningful strategic breadth'
    - Official financing, product, and customer-scale disclosures; cross-module case studies
    - Private cohort data showing durable expansion, not just broad installed base
  - - 'Thesis: independent-practice pain creates real willingness to pay for workflow software'
    - Funding narrative, survey data, AI productivity claims, and customer proof
    - Evidence that buyers keep spending despite reimbursement stress and consolidation
  - - 'Anti-thesis: current valuation denominator is missing'
    - No public ARR/revenue, NRR, or gross-margin package for Tebra
    - Board KPI pack or financing deck with current revenue and retention
  - - 'Anti-thesis: public valuation support is partly secondary and noisy'
    - Clay and other soft sources suggest >$1B, but primary funding sources do not cleanly publish post-money terms
    - Signed financing docs or cap-table schedule
  - - 'Anti-thesis: customer/support burden may make the economics more service-heavy than they appear'
    - Review channels and risk chapter show execution friction
    - Support cost/account, time-to-go-live, and renewal quality data
  notes: The anti-thesis is about denominator opacity, not about lack of product-market relevance.
