- id: exit-readiness-and-final-diligence
  title: Exit readiness, thesis-break triggers, and final diligence asks
  body: 'Exit readiness is not publicly evidenced today. Tebra has characteristics that strategic buyers and private equity firms like—recurring workflow software, payments and RCM adjacency, AI automation narrative, and a fragmented independent-practice customer base—but the retained sources do not disclose IPO preparation, audited private financials, preference stack, or secondary-liquidity mechanics. That means final diligence is decisive. The most important asks are current ARR/revenue bridge, gross margin after payments/RCM/service load, NRR/GRR and logo churn, customer concentration, support cost per account, module attach rates, and financing/cap-table terms. The thesis-break triggers are equally concrete: if management cannot support the revenue denominator implied by price, if retention is weak, if support burden is service-like rather than software-like, or if valuation claims rely mostly on soft secondary sources rather than primary financing documents, the investment committee
    should either reset price expectations or pass.'
