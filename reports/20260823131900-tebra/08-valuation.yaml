- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue denominator miss
    - ARR/revenue materially below the level implied by even base-case comp multiples
    - ~$1B price loses support quickly
    - Avoid or reset price; require lower entry or milestone structure
  - - Weak retention quality
    - NRR/GRR or logo churn inconsistent with premium vertical-software economics
    - Cross-sell and embedded-workflow thesis weakens
    - Lower multiple, shorten hold thesis, or pass
  - - Services-heavy support burden
    - Support cost/account, implementation friction, or time-to-go-live erodes software-like margins
    - Profitability and scalability thesis weakens
    - Treat as service-heavy software and haircut valuation
  - - Commercial rigidity and complaint drag
    - Cancellation disputes, hidden-fee narratives, or support escalation clusters persist
    - CAC efficiency and brand trust deteriorate
    - Raise required return and demand stronger customer-economics evidence
  - - Cap-table / preference overhang
    - Preference stack, debt, or option pool materially worsens common-equity economics
    - Headline valuation overstates investor return prospects
    - Rework price or structure
  - - Competitive or regulatory shock
    - Faster consolidation, reimbursement stress, or interoperability burden compresses growth
    - Exit multiple and growth duration assumptions weaken
    - Reduce target return or stop
  notes: Triggers are intended for investment committee discipline, not as assertions that the adverse condition already exists.
