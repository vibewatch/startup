  evidenceGaps:
  - type: missing-source
    severity: material
    topic: tobra-specific-sam
    missingEvidence: A defensible public methodology translating broad EHR/PMS forecasts into a Tebra-specific SAM for independent practices.
    whyItMatters: Investors can describe the market as large, but cannot cleanly underwrite penetration assumptions without a narrower serviceable base.
    diligencePath: Request management market model by segment, practice size, and module attach rate.
    relatedQuestionRefs:
    - QM022
  - type: missing-source
    severity: material
    topic: independent-vs-affiliated-spend
    missingEvidence: A public breakdown of ambulatory software spending by fully independent practices versus health-system-affiliated groups.
    whyItMatters: The size of the truly independent buyer pool determines whether Tebra’s market is expanding through digitization or shrinking through consolidation.
    diligencePath: Obtain management segmentation or commission primary survey work focused on ownership status and software budgets.
    relatedQuestionRefs:
    - QM023
  - type: private-evidence-only
    severity: minor
    topic: willingness-to-pay-by-practice-size
    missingEvidence: Practice-size-specific ACV, willingness-to-pay, and module attach-rate benchmarks for Tebra-like integrated stacks.
    whyItMatters: Without ACV and attach-rate data, revenue build-up models rely too heavily on generic market-size figures.
    diligencePath: Request anonymized pricing cohorts or sales funnel data from management and channel partners.
    relatedQuestionRefs:
    - QM025
