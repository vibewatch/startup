- id: sizing-lenses
  title: Sizing Lenses and What They Actually Mean
  body: No single public figure should be treated as Tebra’s definitive TAM. Instead, the evidence supports several overlapping lenses. Mordor says the practice-management market grows from $13.81 billion in 2026 to $20.75 billion by 2031, with integrated systems already taking most share and small groups growing faster than large groups. Research and Markets says the U.S. ambulatory EHR market grows from $4.05 billion in 2026 to $5.29 billion by 2031, with practice management the largest functionality slice and cloud already dominant. Market.us gives a much larger global EHR lens—$31.7 billion in 2026 and $45.9 billion by 2033—but that includes inpatient and international spend that Tebra does not directly monetize today. Tebra’s own December 2025 financing release says it is building a pure-play SaaS leader in a $20 billion-plus market, which is directionally plausible if one combines ambulatory EHR, practice management, revenue-cycle management, patient engagement, and related workflow
    modules. The investable conclusion is that Tebra has a credible multi-billion-dollar serviceable market, but any model should treat the company’s true SAM as the overlapping subset of independent-practice software budgets rather than summing every published EHR and PMS forecast.
