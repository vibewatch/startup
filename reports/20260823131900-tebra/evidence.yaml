evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-composition
    missingEvidence: A current board roster with sponsor representation, committee membership, and independent directors.
    whyItMatters: >-
      Board composition determines governance discipline, sponsor control, and founder dependence at a critical stage
      after a large financing.
    diligencePath: Request the latest board deck, board observer list, and governance documents from management.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: ownership-structure
    missingEvidence: >-
      A full cap table showing ownership percentages, preference stack, and any special rights held by Hildred, Golub,
      or earlier investors.
    whyItMatters: >-
      Without ownership data, investors cannot assess control, dilution overhang, or whether new capital changed power
      dynamics materially.
    diligencePath: >-
      Request current cap table, charter, investor rights agreement, and any side letters associated with the 2025
      financing.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: debt-facility-terms
    missingEvidence: Detailed J.P. Morgan facility size, maturity, covenants, pricing, collateral, and permitted indebtedness terms.
    whyItMatters: >-
      Debt structure changes downside risk, burn flexibility, and future financing capacity even if the operating
      business is profitable today.
    diligencePath: Obtain the credit agreement, lender presentation, or audited debt footnotes covering the December 2025 facility.
    relatedQuestionRefs:
      - QO025
  - type: private-evidence-only
    severity: minor
    topic: current-headcount
    missingEvidence: An exact current employee count by function and geography after the 2025 financing.
    whyItMatters: >-
      Headcount is a useful operating-efficiency proxy and helps assess support intensity, sales capacity, and
      post-merger integration maturity.
    diligencePath: Request an HR roster summary or current organizational snapshot from management.
    relatedQuestionRefs:
      - QO005
  - type: private-evidence-only
    severity: minor
    topic: lifetime-capital-raised
    missingEvidence: A complete round-by-round funding history across Kareo, PatientPop, merger financing, and post-merger capital.
    whyItMatters: >-
      The full funding record informs dilution history and whether the 2025 round was a reset, extension, or late-stage
      acceleration round.
    diligencePath: Request financing history from the finance team or prior board materials summarizing historical capital formation.
    relatedQuestionRefs:
      - QO006
      - QO011
  - type: missing-source
    severity: material
    topic: tobra-specific-sam
    missingEvidence: >-
      A defensible public methodology translating broad EHR/PMS forecasts into a Tebra-specific SAM for independent
      practices.
    whyItMatters: >-
      Investors can describe the market as large, but cannot cleanly underwrite penetration assumptions without a
      narrower serviceable base.
    diligencePath: Request management market model by segment, practice size, and module attach rate.
    relatedQuestionRefs:
      - QM022
  - type: missing-source
    severity: material
    topic: independent-vs-affiliated-spend
    missingEvidence: >-
      A public breakdown of ambulatory software spending by fully independent practices versus health-system-affiliated
      groups.
    whyItMatters: >-
      The size of the truly independent buyer pool determines whether Tebra’s market is expanding through digitization
      or shrinking through consolidation.
    diligencePath: Obtain management segmentation or commission primary survey work focused on ownership status and software budgets.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: minor
    topic: willingness-to-pay-by-practice-size
    missingEvidence: >-
      Practice-size-specific ACV, willingness-to-pay, and module attach-rate benchmarks for Tebra-like integrated
      stacks.
    whyItMatters: Without ACV and attach-rate data, revenue build-up models rely too heavily on generic market-size figures.
    diligencePath: Request anonymized pricing cohorts or sales funnel data from management and channel partners.
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: material
    topic: win-rate-by-segment
    missingEvidence: Public win/loss or replacement-rate data by competitor and customer segment.
    whyItMatters: >-
      Without segment-level win rates, the moat case rests on positioning narratives rather than verified displacement
      success.
    diligencePath: Request sales cohort data by segment, source competitor, and module attach.
    relatedQuestionRefs:
      - QP025
  - type: missing-source
    severity: material
    topic: module-attach-and-retention
    missingEvidence: Public evidence linking practice-growth module attach to higher ACV, retention, or NRR.
    whyItMatters: >-
      Tebra’s main differentiation is bundled growth plus billing; investors need proof that the bundle changes
      economics, not just feature count.
    diligencePath: Request module-level attach, churn, NRR, and expansion rates.
    relatedQuestionRefs:
      - QP003
      - QP025
  - type: missing-source
    severity: minor
    topic: realized-pricing-dispersion
    missingEvidence: A clean public sample of realized Tebra contract prices by practice size and module bundle.
    whyItMatters: Packaging opacity makes it hard to benchmark pricing power or discounting discipline.
    diligencePath: Collect anonymized quotes and renewals across customer cohorts.
    relatedQuestionRefs:
      - QP014
  - type: missing-source
    severity: material
    topic: revenue-and-arr
    missingEvidence: No public Tebra revenue, ARR, or historical growth bridge.
    whyItMatters: Without top-line disclosure, neither capital adequacy nor valuation can be underwritten with precision.
    diligencePath: Request audited revenue by quarter, ARR, net new ARR, and module mix.
    relatedQuestionRefs:
      - QI017
      - QI025
  - type: missing-source
    severity: material
    topic: margin-and-burn
    missingEvidence: No public gross margin, EBITDA, free cash flow, cash balance, or runway for Tebra.
    whyItMatters: >-
      The difference between a premium vertical SaaS asset and a service-heavy workflow business sits largely in margin
      and cash generation.
    diligencePath: Request management P&L, cash-flow statement, debt schedule, and covenant package.
    relatedQuestionRefs:
      - QI011
      - QI014
      - QI018
      - QI025
  - type: missing-source
    severity: material
    topic: retention-and-cac
    missingEvidence: No public CAC, payback, GRR, NRR, or churn disclosure.
    whyItMatters: Recurring-revenue quality cannot be assessed from anecdotal ROI or funding headlines alone.
    diligencePath: Request cohort retention, CAC, payback, implementation cost, and expansion by segment.
    relatedQuestionRefs:
      - QI010
      - QI025
  - type: missing-source
    severity: material
    topic: independent-reliability-metrics
    missingEvidence: No public uptime, incident-rate, MTTR, or environment-level reliability dashboard for core product modules.
    whyItMatters: >-
      A broad ambulatory operating system creates many operational dependencies; reliability is central to customer
      trust.
    diligencePath: Request status history, uptime by module, incident postmortems, and support-volume trends.
    relatedQuestionRefs:
      - QE015
      - QE025
  - type: missing-source
    severity: material
    topic: api-adoption-and-modernization
    missingEvidence: >-
      No public data on active API partners, FHIR production volume, SOAP-to-FHIR migration, or partner implementation
      timelines.
    whyItMatters: >-
      Without adoption data, it is hard to judge whether interoperability is strategic depth or merely checkbox
      documentation.
    diligencePath: Request partner count, API call volumes, FHIR resource usage, and migration roadmap.
    relatedQuestionRefs:
      - QE009
      - QE011
      - QE025
  - type: missing-source
    severity: material
    topic: independent-security-evidence
    missingEvidence: >-
      Public pages reference controls and attestations, but not the underlying report dates, audit exceptions, or
      incident record.
    whyItMatters: >-
      Trust/compliance claims are central to the product thesis and need stronger verification for investment-grade
      diligence.
    diligencePath: Review current SOC/HITRUST/PCI materials, pen-test summaries, and security incident history.
    relatedQuestionRefs:
      - QE017
      - QE025
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: No public cohort retention, gross retention, NRR, attach-rate, or churn-by-segment metrics.
    whyItMatters: Customer scale alone cannot distinguish sticky expansion from expensive replacement selling.
    diligencePath: Request cohort tables by practice size, specialty, product bundle, and acquisition year.
    relatedQuestionRefs:
      - QU022
      - QU024
  - type: missing-source
    severity: material
    topic: implementation-economics
    missingEvidence: No public time-to-go-live, migration success, support-load, or onboarding completion metrics.
    whyItMatters: Review evidence suggests onboarding quality is central to customer outcomes and support costs.
    diligencePath: Request implementation SLAs, average deployment time, support-ticket curves, and onboarding CSAT.
    relatedQuestionRefs:
      - QU015
      - QU023
      - QU024
  - type: missing-source
    severity: material
    topic: segment-profitability
    missingEvidence: No public view of which customer cohorts are most profitable or most complaint-prone.
    whyItMatters: >-
      Independent practices are heterogeneous; some may carry high support cost or high churn even if top-line scale
      looks strong.
    diligencePath: Request unit economics and retention by solo, 2-10 provider, specialty, and billing-company segments.
    relatedQuestionRefs:
      - QU003
      - QU021
      - QU024
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: audit-and-incident-evidence
    missingEvidence: >-
      No public SOC report dates, control exceptions, incident history, pen-test summaries, or breach-response record
      sufficient for underwriting security posture.
    whyItMatters: Trust pages alone cannot price privacy/security downside in healthcare IT.
    diligencePath: Review current SOC/HITRUST materials, incident register, external pen tests, and security org ownership.
    relatedQuestionRefs:
      - QR013
      - QR014
      - QR028
  - type: missing-source
    severity: material
    topic: contractual-allocation-of-risk
    missingEvidence: >-
      No public enterprise MSA/BAA/SLA package showing indemnities, liability caps, audit rights, or data-export
      obligations.
    whyItMatters: Commercial and legal risk often crystallizes in contract mechanics rather than in marketing claims.
    diligencePath: Review standard order forms, BAA, SLA, termination language, and export commitments.
    relatedQuestionRefs:
      - QR009
      - QR011
      - QR028
  - type: missing-source
    severity: material
    topic: support-and-retention-economics
    missingEvidence: No public ticket backlog, time-to-go-live, onboarding CSAT, support cost per account, gross retention, or NRR.
