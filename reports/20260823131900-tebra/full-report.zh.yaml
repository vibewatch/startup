            title: 为什么市场大于单一产品品类
            body: Tebra 的市场不只是 EHR，也不只是计费。经济逻辑来自向诊所销售一套连接的运营栈；否则，这些诊所要自己拼多个供应商，并在摩擦中损失收入。
