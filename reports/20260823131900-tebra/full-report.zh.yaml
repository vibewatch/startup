      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方图谱涉及多个角色，但运营上相对集中。终端用户是临床医生、前台人员、计费人员和诊所经理；经济买方通常是业主医生、诊所管理员或小型集团领导层，他们必须在报销、人手和患者获客之间做平衡。Software
              Finder 的 2026 年数据集在这里有用，因为它称文档速度、排班效率和计费完整性解释了近四分之三的买方需求，而易用性和门户则充当胜负手。这与 Tebra 的定位高度一致。Software Finder
              还称中小型诊所贡献了大多数采购活动，企业采用更慢，而 Tebra 在家庭医学、心理健康和儿科中保持强采用——正是公司所说的独立门诊集团类型。Tebra 自己的 2026
              年调研强化了购买意愿这一侧：三分之二诊所仍想保持独立，但报销压力、理赔漏损和系统割裂让集成工具变得紧迫。采用通常从病历、排班或计费痛点开始，经过实施和数据迁移，之后才扩展到患者互动、营销、自动化和 AI。
