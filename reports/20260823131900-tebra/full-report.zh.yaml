  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >-
              应把 Tebra 看作面向独立门诊诊所的工作流软件平台，而不是泛全球 EHR 厂商，也不是纯诊所增长工具。纳入支出应是私人诊所实际购买来维持运营的那套栈：门诊
              EHR、排班、计费和收入周期管理、患者沟通、患者获客、远程医疗和报告。最强的外部市场代理指标把这套栈拆进多个相邻品类，而不是一个干净单项。Research and Markets 估算美国门诊 EHR 市场
              2026 年为 $4.05 billion；Mordor 则估算更广的诊所管理系统市场 2026 年为 $13.81 billion，并称计费和收入周期功能是单一最大的功能模块。Tebra 自己把机会定义为超过
              $20 billion 的市场，因为它跨越不止一个品类。排除在外的支出包括面向医院住院场景优化的系统、生命科学
              CRM、付款方核心管理软件，以及不掌握保险相关门诊工作流的消费者健康应用。这个边界很重要，因为小型诊所希望由一个供应商同时跑前台、临床文档、支付和患者增长运营时，Tebra 才能赢。
