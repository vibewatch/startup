        title: 资本基础、品牌整合与公司演进
        blocks:
          - type: paragraph
            body: >-
              公开融资历史显示两个已经披露的主要拐点。第一，Tebra 在 2021 年合并时从 Golub Capital 获得 $65 million 额外增长融资。第二，公司于 2025 年 12 月 17 日宣布完成
              $250 million 新股权和债务融资，股权侧主要由 Hildred 领投，债务融资来自 J.P. Morgan，Toba Capital、Transformation Capital 和 HLM
              Venture Partners 继续支持。管理层称本轮超额认购，并把资金用途定义为推动 AI 主导的产品开发。2025 年 12
              月公告也是公开信息中最清晰的一次表述：公司核心业务已经盈利，并计划围绕既有医疗服务提供者客户基础扩张多元商业化引擎。合并后的品牌整合也在推进：Kareo 网站已完全切换为 Tebra
              品牌，标志着双品牌时代结束，合并公司采用单一商业身份。
