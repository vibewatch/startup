            body: >-
              公开证据显示，Tebra 的宽度有助于获客。Tebra
              点名支持初级保健、心理健康、儿科、皮肤科、脊椎按摩、足病和其他门诊专科工作流；客户证据同样很宽：精神科、言语治疗、医疗计费服务和一般独立诊所都出现在公开案例中。最有说服力的用例集中在文档、排班、计费、提醒、患者支付、门户消息、远程医疗和声誉管理。这个宽度很重要，因为独立诊所通常不会把软件当作纯临床工具来买；它们买软件，是为了解决直接影响服务提供者时间、患者吞吐量和报销的工作流瓶颈。不过，同样的宽度也意味着采用负担可能上升，尤其当诊所只使用套件的一部分，或团队需要同时学习临床和商业模块时。执行质量很重要。
