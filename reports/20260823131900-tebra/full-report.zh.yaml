  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与理想客户画像
        blocks:
          - type: paragraph
            body: >-
              Tebra 并不是卖给所有医疗服务提供者。公开材料持续把目标收窄到既需要运营软件，也需要业务支持的独立诊所。官方披露称平台服务超过 140,000 名医疗服务提供者和超过 42,000
              家私人诊所；外部评测则反复把最适配买方描述为小型或中型、向保险计费的诊所，而不是医院企业或只收现金的微型诊所。所有权仍重视独立、但承受报销、文档和患者获客压力的地方，产品承诺尤其容易打动客户。因此，理想账户不只是
              EHR 买方，而是希望一个供应商帮助保护收入、减轻行政负担并维持增长的诊所业主。这一框架很重要，因为它解释了 Tebra
              的差异化，也解释了其销售复杂度：公司要切入的是多线程运营买方，而不是单个临床用户。尽调上的实际含义是，客户质量取决于运营匹配度，而不只是服务提供者数量口径。
