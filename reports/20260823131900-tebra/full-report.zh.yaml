      - - 基准路径
        - 中
        - 中高
        - 合理至偏高
        - 围绕 KPI 门槛、价格纪律或里程碑结构谈判
      - - 悲观路径
        - 中
        - 高
        - 昂贵
        - 若收入分母、留存或支持经济性不及预期，回避或重设价格
    notes: 建议明确对价格敏感，因为当前公开记录缺少跨过门槛所需的分母。
    claimRefs:
      - CV001
      - CV003
      - CV004
