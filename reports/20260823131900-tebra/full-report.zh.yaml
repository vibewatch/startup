      - number: '2.2'
        title: 规模测算视角及其真实含义
        blocks:
          - type: paragraph
            body: >-
              任何一个公开数字都不应被当作 Tebra 的确定性总可用市场（TAM）。证据更支持几组相互重叠的视角。Mordor 称诊所管理市场将从 2026 年的 $13.81 billion 增长到 2031 年的
              $20.75 billion，集成系统已经占据多数份额，小型集团增长快于大型集团。Research and Markets 称美国门诊 EHR 市场将从 2026 年的 $4.05 billion 增长到
              2031 年的 $5.29 billion，其中诊所管理是最大的功能切片，云端部署已占主导。Market.us 给出更大的全球 EHR 口径——2026 年 $31.7 billion、2033 年 $45.9
              billion——但里面包含 Tebra 今天并不直接变现的住院和国际支出。Tebra 自己在 2025 年 12 月融资公告中称，公司正在一个超过 $20 billion 的市场里打造纯 SaaS
              领导者；如果把门诊 EHR、诊所管理、收入周期管理、患者互动和相关工作流模块合并看，这个方向上说得通。可投资结论是：Tebra
              拥有可信的数十亿美元级可服务市场，但任何模型都应把公司真正的可服务市场（SAM）视为独立诊所软件预算的重叠子集，而不是把所有已发布的 EHR 和 PMS 预测简单相加。
