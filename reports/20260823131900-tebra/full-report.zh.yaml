            body: >-
              Tebra 的商业模式继承了独立诊所自身健康状况的风险。AMA、PAI/Avalere 和 Becker’s
              的证据都指向同一方向：独立所有权继续萎缩，报销压力、行政负担和规模优势把更多医生推向医院或企业环境。即便 Tebra
              执行良好，这个背景也可能同时抬高流失率和获客成本。评测渠道增加了第二层风险：支持质量、计费透明度、迁移体验和取消处理会实质影响客户结果。公司 2025 年 12
              月融资和核心业务盈利表述降低了短期偿付焦虑，但没有消除执行风险；如果支持强度、产品复杂度或商业僵化度居高不下，增长可能变得更贵，声誉恶化也可能快过表层服务提供者数量所暗示的速度。就投资而言，这是本章最务实的杀伤区：被表层扩张掩盖的弱留存，很难从公开数据中发现，但现实破坏力很大。因此，私有队列数据必不可少。
