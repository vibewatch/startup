  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与变现面
        blocks:
          - type: paragraph
            body: >-
              Tebra 的公开产品界面指向多流门诊 SaaS 模型，而不是单模块 EHR
              订阅。官方页面持续把临床文档、诊所管理、计费、支付、患者沟通、远程医疗和营销打包在一起。这个架构在财务上重要，因为同一个客户账户内存在多条变现路径：基础软件订阅、计费或支付相关经济收益、患者体验附加模块、诊所增长服务，以及现在可支撑定价权或扩张的
              AI 增强工作流功能。独立评测也强化了这一点：真实客户合同往往按模块包销售，而不是扁平的商品化 EHR
              许可证。收入质量的上行很清楚：集成栈可以提高年合同价值（ACV），并让工作流更黏。谨慎点也同样清楚：公开证据仍未把软件收入同支付、服务或营销相关收入拆开，因此具体组合和利润率结构仍未知。
            claimRefs:
