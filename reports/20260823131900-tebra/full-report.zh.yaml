      - number: '8.3'
        title: 乐观、基准与悲观情景：在显性不确定性下推演
        blocks:
          - type: paragraph
            body: >-
              只要把分母标成“隐含”而不是“已披露”，就可以做情景推演，无需杜撰 Tebra 收入。约 $1 billion 股权价值，在 4.0x 收入倍数下隐含约 $250 million 收入，5.0x 下约 $200
              million，6.5x 下约 $154 million；若套用 8.5x–11.0x 的优质医疗 IT 倍数，则约为 $91 million–$118 million。乐观情景要求 Tebra
              站在溢价端：留存强、利润率耐久，计费 / 支付 / 增长 / AI 的交叉销售可信，而且几乎没有证据显示支持问题或投诉在掩盖疲弱的客户经济性。基准情景认为公司战略位置强，但仍需要 KPI
              证明，因此估值是合理到偏高，而非明确有吸引力。悲观情景很直接：如果 ARR / 收入显著低于隐含门槛，支持负担很重，或模块缝隙拉低净留存，公开可比公司不会拯救这个价格。
