      - number: '3.3'
        title: 购买标准、打包方式与切换成本
        blocks:
          - type: paragraph
            body: >-
              打包和采购行为解释了为什么这个市场仍然分散。Tebra 官方页面承诺透明定价和上手式上线导入，但独立评测证据显示，现实报价常常会捆绑增长模块和年度承诺。athenahealth
              更偏向按回款比例收费或定制商业模式，这适合更大或 RCM 更重的集团，却让直接比较变难。AdvancedMD 和 DrChrono 通常被视作 EHR 加计费的一体化套件来评估；RXNT 和 Office
              Ally 则靠更便宜、甚至诊所管理侧无月费来锚定低端。Tebra
              买方面临典型切换成本问题：诊所一旦把数据、模板、理赔工作流和前台习惯放进一个系统，替换就很痛；但上线之前，价格和模块匹配度仍高度可争夺。当诊所足够看重集成增长工具和支持，愿意接受高于低成本替代品的有效年合同价值（ACV），Tebra
              才能赢；尤其在上线导入质量、实施支持、更顺畅的员工培训和新患者 ROI 比最低月度软件账单更重要时。
