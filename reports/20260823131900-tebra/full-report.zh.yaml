      - number: '1.4'
        title: 领导层信号、客户证据与品类背景
        blocks:
          - type: paragraph
            body: >-
              领导层能见度最强的地方，是创始人 CEO Dan Rodrigues，以及围绕私人诊所痛点讲述的客户成效。Tebra 案例研究和 AI 页面描述了笔记生成、计费和增长成果：例如 2025 年下半年生成超过
              500,000 份 AI 临床笔记、每份笔记平均节省 60% 文档时间，以及 AI 评价回复工具带来网站点击量提升 45%。面向客户的证据还包括一个计费服务案例：规模达 250
              个客户，并实现六位数年化节省；此外，Software Advice、Trustpilot 和 BBB 投诉渠道上也有活跃但评价不一的反馈。更大的背景支撑 Tebra 的战略叙事：AMA 和 PAI/Avalere
              的证据显示私人执业在萎缩，报销压力仍然强，独立经营越来越难维持。Tebra 自己的 2026
              年调研也呼应了这种环境：三分之二诊所仍想保持独立，但很多诊所承受低报销、系统割裂和理赔漏损压力。公司概况的核心结论是：Tebra 卖的不只是软件，而是为承压门诊细分市场提供的一套生存与增长操作系统。
