      - number: '8.2'
        title: 可比估值框架与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Tebra 的可比公司要三角校准，不能照搬。论广度和规模，Tebra 不及 athenahealth；论业务纯度和盈利能力，不及 Veeva；论公开透明度，不及
              Phreesia。即便如此，这些参照仍有方向价值：当收入质量、留存和利润率可见时，投资人就是这样给受监管工作流软件定价。第三方估值页面和顾问报告也显示，2026 年软件定价已经分化：广义 SaaS 并购中位数接近
              4x 收入，上市 SaaS 中位数甚至更低；但嵌入工作流、护城河可守的优质垂直平台，可以拿到显著更高倍数。因此，Tebra 的入场纪律应先做隐含收入测试。如果公司当前 ARR 或收入只略高于 $100
              million，约 $1 billion 的估值就开始吃力，除非留存、盈利能力以及嵌入式支付 / RCM 扩张都异常强。如果收入接近数亿美元高位，核心业务能盈利且留存良好，这个价格就容易辩护得多。
