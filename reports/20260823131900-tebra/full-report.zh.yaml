              继承来的独立诊所计费基础设施和患者增长软件组合。独立评测证据明确称，对于同时重视保险计费和新患者增长的诊所，这套组合可以构成护城河。反向证据也很明确：评测者和外部测试者仍感到临床模块与营销模块之间有缝，一些用户抱怨定制和支持不一致；规模化对手则可能在分析能力、企业就绪度或低成本简洁性上超过
