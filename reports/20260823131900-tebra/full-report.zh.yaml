        title: 财务结论与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              因此，财务结论是好坏参半但有希望。Tebra 有可信的经常性收入、扩张路径和新资本信号；公司聚焦私人诊所，也可能带来相对分散的客户基础，而不是极端单客户集中。与此同时，几乎所有决定它究竟是高溢价垂直 SaaS
              资产，还是一套忙碌的医疗工作流组合包的投资测算指标，都仍未披露。公开证据没有给出年经常性收入（ARR）、确认收入、毛利率、EBITDA、烧钱速度、获客成本、实施负担、续约率或债务契约。案例研究和评测显示产品能带来有意义的
              ROI，但同一批来源也暗示小型诊所存在价格敏感、培训需求和工作流复杂度。对投资者而言，Tebra
              还不是一份数字干净的尽调文件；它是一家有资本支持、战略上自洽的公司，财务质量仍需用私有数据室材料、月度报告、贷款方文件、队列留存分析、董事会材料、实际续约数据、分细分市场利润率明细和债务时间表来证明。
