  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与边界逻辑
        blocks:
          - type: paragraph
            body: >-
              Tebra 的正确竞争图谱应从买方任务开始，而不是从品类标签开始。Tebra
              卖给独立门诊诊所，满足它们用一个平台跑核心临床、运营、财务和患者增长工作流的需求。因此，athenahealth、AdvancedMD、DrChrono、RXNT、Office Ally 和 NextGen
              比医院优先厂商或通用 CRM 层更相关。Salesforce Health Cloud 也更像相邻的企业平台，而不是可一一替代的中小型诊所 EHR。独立评测进一步收紧了边界：外部对 Tebra
              最强的评估认为，当诊所既向保险计费，又把患者获客视为运营优先级时，Tebra 最合适；但个人治疗师、只收现金的微型诊所和更大的多站点集团，往往在别处更合适。务实判断是，Tebra
              同时面对三类对手：上方有规模化门诊老牌厂商，下方有低成本工作流替代品，旁边还有当客户已不再真正独立时变得重要的企业平台。
