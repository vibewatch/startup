      - number: '2.4'
        title: 增长驱动、约束与明确矛盾
        blocks:
          - type: paragraph
            body: >-
              结构性驱动很清楚：门诊迁移、云替换周期、互操作性要求、AI 驱动的文档和 RCM 自动化，以及私人诊所不断加重的行政负担。Mordor 和 Research and Markets
              都把云迁移、专科工作流需求、报销复杂度和基于价值的医疗报告列为增长引擎。HHS 和 ONC 来源显示，TEFCA 交换量和互操作性预期仍在上升；CMS
              质量支付基础设施也继续奖励能够采集并传输质量数据的软件。但约束同样重要。独立诊所在所有权整合中萎缩；PAI/Avalere 和 AMA
              显示，医生持有的诊所和私人执业占比继续下降。分析师来源也指出，实施成本、工作流扰动、员工培训、网络安全风险和宕机暴露都是有意义的障碍。这让 Tebra
              逻辑出现一个微妙矛盾：让集成软件更有吸引力的痛点，也会把一些独立诊所推向更大的集团或医院系统。因此，最好的市场判断不是“每一美元门诊支出都属于 Tebra”，而是“Tebra
              面向一个承压但仍庞大的细分市场；它的紧迫感高、预算分散，长期规模取决于独立诊所能否继续活下去。”
