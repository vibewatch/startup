  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、信心与当前价格背景
        blocks:
          - type: paragraph
            body: >-
              公开证据能证明 Tebra 是一家真实公司，平台覆盖有分量，客户触达也已成规模，但不足以支持不看价格的投资判断。Tebra 2025 年 12
              月融资证据充分，战略意味也清楚；但最强的一手来源并未披露清晰的投后估值、摊薄结构或当前年经常性收入（ARR）。关键在于：2026 年估值质量更看分母纪律，而不是叙事。若投资人确实要按约 $1 billion
              估值投资，问题不是 Tebra 是否重要，而是当前收入、留存和利润率能否对照纪律化的医疗软件和垂直 SaaS 可比公司撑住这个价格。核心经营分母仍未公开，因此建议维持观察 /
              继续研究，估值立场维持偏高到合理；除非管理层拿出私下证据，证明价格由耐久的软件经济性锚定，而不只是战略稀缺性。
