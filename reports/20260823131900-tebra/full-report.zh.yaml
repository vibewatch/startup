      - number: '4.3'
        title: 资本充足性与基准读数
        blocks:
          - type: paragraph
            body: >-
              最硬的财务事实是 2025 年 12 月融资。Tebra 和独立报道称，公司完成 $250 million 融资，主要是股权资本，另有 J.P. Morgan 债务融资，由 Hildred
              领投，且本轮超额认购。管理层还称公司已经拥有盈利的核心业务，并计划用新资本加速文档、RCM、患者体验和营销中的
              AI。这强烈表明，即便没有公开现金余额，短期产品投资资本也较充足。上市公司读数有助于框定一个优秀门诊或医疗工作流软件模型可以长什么样，即便它们并非直接可比公司。Phreesia
              显示，患者激活和支付相邻软件在收入不到 $1 billion 的规模上也能实现正 EBITDA 和自由现金流。Veeva
              则展示另一个极端：高质量订阅经济、大额递延收入，以及在更大规模上耐久的经营利润率。Tebra 几乎肯定介于两极之间，但公开证据太薄，无法精准定位。
