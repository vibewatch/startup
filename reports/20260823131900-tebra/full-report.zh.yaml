            title: 为什么这里很容易夸大 TAM
            body: 多数已发布的市场估算测量对象并不相同：有些是全球口径，有些只看美国，有些只看 EHR，有些包含大量医院支出。投资者不应把它们相加，也不应误认为那就是 Tebra 的真实可服务市场。
