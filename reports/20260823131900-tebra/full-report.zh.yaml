            body: >-
              最令人鼓舞的客户证据是，Tebra 似乎能够在账户内扩张，并跨相邻客户类型扩张。案例研究显示，诊所随着时间采用更多模块，一家计费公司把全部客户标准化到 Tebra，公开表述也称既有客户通过
              AI、患者支付、评价自动化和集成工作流变现。但可见的流失压力也存在。独立诊所承受财务压力，买方信心在走弱，多条评测叙事指向合同压力、可负担性担忧、迁移挫败，或购买后预期未兑现。这意味着 Tebra
              的留存挑战有两面：第一，客户必须保持偿付能力和独立；第二，客户必须认为集成套件值得付出运营和合同承诺。尽调上，队列留存、模块挂载和支持成本强度因此成为最重要的缺失客户指标之一。这个组合让队列数据、投诉率和支持经济性比表层客户数量更重要。
