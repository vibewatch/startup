      - number: '5.4'
        title: 信任、合规与技术风险
        blocks:
          - type: paragraph
            body: >-
              安全与合规是产品卖点的核心，不只是页脚文字。Tebra 安全页面描述了 HIPAA 支持、HITRUST 和 SOC 2 风格的控制框架、支付相关 PCI 处理、TLS
              加密通信、防火墙、入侵检测、端点保护、基于角色的控制、审计能力，以及可选的账户级双因素认证。HIPAA 页面还提到 FIPS 140-2
              验证加密，以及面向独立诊所的支持。这些是可信的信任信号，但不能完全替代独立审计审查。同一批公开证据也暴露了真实技术风险：API 条款排除担保、禁止逆向工程和竞争性实现，并要求开发者私下报告安全缺陷；SOAP
              指南仍预期采用轮询；评测者仍描述导航缝隙和定价不透明。对产品尽调而言，结论是鼓舞人心但不干净：Tebra
              展示了真实的平台深度和合规意图，但运营复杂度和集成现代化程度不均仍是一阶尽调主题。最重要的缺失输入是真实安全审计交付物、合作伙伴实施参考、API
              使用深度和模块级运行时间历史。没有这些材料，技术逻辑方向上正面，但还不能完全达到投资级。
