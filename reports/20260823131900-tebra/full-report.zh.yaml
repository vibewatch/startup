      - number: '8.4'
        title: 退出准备度、投资逻辑破裂触发点和最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              目前没有公开证据证明 Tebra 已具备退出准备度。Tebra 有战略买家和私募股权机构喜欢的特征——经常性工作流软件、支付和 RCM 邻近场景、AI 自动化叙事，以及碎片化独立诊所客户基础——但保留来源没有披露
              IPO 准备、经审计私下财务、优先股堆叠或老股流动性机制。因此，最终尽调是决定性环节。最关键问题包括当前 ARR / 收入桥、支付 / RCM / 服务负载后的毛利率、NRR / GRR
              和客户数流失、客户集中度、单账户支持成本、模块附加率，以及融资 /
              股权结构表条款。投资逻辑破裂触发点同样具体：如果管理层无法证明价格隐含的收入分母，如果留存疲弱，如果支持负担更像服务业务而非软件业务，或如果估值说法主要依赖二手软信息而非一手融资文件，投委会应下调价格预期或放弃。
