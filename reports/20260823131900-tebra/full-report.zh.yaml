      - number: '1.3'
        title: 当前规模、产品范围与独立诊所聚焦
        blocks:
          - type: paragraph
            body: >-
              Tebra 最新官方规模指标显著高于上线时。2025 年 12 月融资公告称，平台获得超过 140,000 名私人医疗服务提供者信任，并在 125 million 份患者记录的既有基础上变现。同一公告称，超过
              42,000 家私人诊所信任该平台；官网和功能页则强调一个连接式 “EHR+” 套件，覆盖病历、计费、排班、报告、患者体验、营销、远程医疗和新的 AI 自动化。官方产品表述值得注意，因为它反复把 Tebra
              放在独立诊所经济模型中，而不是企业级医院系统复杂度中。公司主打一个登录入口、更快上线、最低 IT
              依赖，以及面向小型门诊组织的一体化工作流；这些组织既需要收入周期纪律，也需要患者获客支持。第三方实测评测基本同意这种细分，认为甜蜜点是向保险计费、并重视患者增长的小型独立诊所，同时提醒大型企业可能更偏好
              athenahealth 或 AdvancedMD 等老牌厂商的更深分析能力。
