  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 证据
      - 哪些因素会改变判断
    rows:
      - - 投资逻辑：Tebra 是真正的垂直平台，战略宽度有分量
        - 官方融资、产品和客户规模披露；跨模块案例研究
        - 私有队列数据证明扩张可持续，而不只是装机基数广
      - - 投资逻辑：独立诊所痛点带来真实的工作流软件付费意愿
        - 融资叙事、调研数据、AI 生产力主张和客户证据
        - 证据显示买方在报销压力和整合背景下仍继续花钱
      - - 反向逻辑：当前估值分母缺失
        - Tebra 未公开 ARR / 收入、NRR 或毛利率数据包
        - 含当前收入和留存的董事会 KPI 包或融资材料
      - - 反向逻辑：公开估值支撑部分来自二手来源，噪声较大
        - Clay 等软来源暗示估值 >$1B，但一手融资来源没有清晰披露投后条款
        - 已签署融资文件或股权结构表
      - - 反向逻辑：客户 / 支持负担可能让经济性比表面更偏服务
        - 评论渠道和风险章节显示执行摩擦
        - 单账户支持成本、上线周期和续约质量数据
    notes: 反向逻辑针对的是分母不透明，不是产品与市场无关。
    claimRefs:
      - CV002
      - CV005
      - CV007
      - CV008
      - CV015
      - CV018
      - CV020
      - CV033
      - CV034
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 收入 / ARR 明显高于溢价隐含门槛；盈利核心可扩张；净留存强劲；支持负担可控
        - ~$1B 可算合理至有吸引力，战略上行空间可逐步支撑更高估值
        - 竞争、监管负担和客户基础整合仍是真实风险
        - 管理层披露强劲队列和清晰利润率桥
      - - 基准
        - 公司具备战略价值，但分母仍未公开，且执行摩擦尚存
        - 继续观察，直到 ARR / 收入、NRR 和利润率证明该估值；目前合理至偏高
        - 价格可能说得通，但没有私有 KPI 包难以验证
        - 管理层给出部分证据，但不足以形成确信
      - - 悲观
        - 收入分母明显低于隐含区间，或留存 / 支持经济性偏弱
        - ~$1B 看起来昂贵，回报曲线被压缩
        - 客户压力、流失、定价投诉，或交付偏服务
        - 私有数据未达到核心门槛，或股权结构表条款缺乏吸引力
      - - 战略上行情景
        - 大型战略买家或财务买家看重独立诊所分发，加上 AI / RCM 扩张
        - 可支撑高于基准可比公司测算的溢价
        - 需要稀缺性和真实交叉销售经济性，而不只是故事
        - 买方兴趣和私有指标共同验证投资逻辑
    notes: 情景测算基于隐含分母和公开可比公司区间，而非 Tebra 披露收入。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Tebra 融资参照
        - 官方 + 二手融资报道
        - 2025 年 12 月完成 $250M 融资；最强一手来源未披露清晰投后估值
        - 为标的公司提供直接价格背景
        - 一手证据对金额和战略意图的支持强于对精确估值的支持
      - - athenahealth
        - 官方及行业交易报道
        - 2022 年以 ~$17B 被收购
        - 规模化门诊 / EHR / RCM 平台基准，也是战略上限参照
        - 规模大得多、成熟度更高，不能作为 Tebra 私有市场定价的直接可比
      - - Veeva
        - 上市公司业绩 + Windsor 估值调查
        - FY26 收入 $3.195B；Windsor 引用约 9.0x 往绩收入上市倍数
        - 受监管垂直软件的高端可比，显示强披露和利润率可获得的估值
        - 生命科学聚焦和规模与独立诊所医疗 IT 差异很大
      - - Phreesia
        - 上市公司业绩 + 10-K
        - FY26 收入 $480.6M，GAAP 收入为正，调整后 EBITDA 为 $101.5M
        - 医疗工作流 / 患者互动可比公司，公开经济性可见
        - 产品组合和商业模式不同，包括网络解决方案和支付
      - - 医疗 IT 垂直溢价
        - Windsor 垂直 SaaS 报告
        - 2026 年报告中，医疗 IT 约为 8.5x-11.0x EV / 收入区间
        - 可作为一流医疗垂直软件溢价区间的观察镜头
        - 咨询 / 基准来源，不是 Tebra 直接估值标记
      - - SaaS / 医疗 M&A 中位数
        - Windsor ARR 区间报告和 FOCUS 仪表盘
        - 广义 SaaS M&A 中位数约 4.0x 收入；创始人主导公司 ARR 区间约 4.0x-6.5x；医疗科技 / 医疗诊所区间低于顶级上市 SaaS
        - 界定下限或基准情景的市场纪律
        - 区间混合了不同样本、规模和质量层级
      - - Clay 融资档案
        - 二手融资摘要
        - 暗示 2022 年估值 >$1B，且累计融资至少 $387M
        - 有助于方向性校验市场认知
        - 二手、未经审计，不足以作为一手定价证明
    notes: 可比组具有代表性并经过三角校验；它应指导入场纪律，而不是替代直接尽调。
    enumerationScope:
      coverage: sample
      basis: >-
        Representative healthcare software, vertical SaaS, and historical transaction references retained from public
        and advisory sources.
    claimRefs:
      - CV001
      - CV009
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
  - id: TV005
    title: 投资逻辑破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入分母不达标
        - ARR / 收入明显低于即便按基准可比倍数也隐含的水平
        - ~$1B 价格很快失去支撑
        - 回避或重设价格；要求更低入场价或里程碑结构
      - - 留存质量偏弱
        - NRR / GRR 或 logo 流失与高端垂直软件经济性不匹配
        - 交叉销售和嵌入式工作流投资逻辑削弱
        - 下调倍数、缩短持有逻辑，或放弃
      - - 服务占比高的支持负担
        - 单账户支持成本、实施摩擦或上线周期侵蚀软件型利润率
        - 盈利能力和可扩张性投资逻辑削弱
        - 按服务占比高的软件看待，并给估值打折
      - - 商业条款僵硬与投诉拖累
        - 取消争议、隐藏费用叙事或支持升级集群持续存在
        - CAC 效率和品牌信任恶化
        - 提高要求回报，并要求更强的客户经济性证据
      - - 股权结构表 / 优先权悬顶
        - 优先股堆叠、债务或期权池明显压低普通股经济性
        - 名义估值夸大投资者回报前景
        - 重做价格或结构
      - - 竞争或监管冲击
        - 整合加速、报销压力或互操作性负担压缩增长
        - 退出倍数和增长持续期假设走弱
        - 下调目标回报或停止
    notes: 这些触发项用于投资委员会纪律，不是在断言反向情形已经存在。
    claimRefs:
      - CV024
      - CV027
      - CV030
      - CV033
      - CV034
      - CV036
      - CV038
      - CV041
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 当前 ARR / 收入及增长桥
        - 收入运行率、最近季度、预订质量和预测
        - 验证当前价格是否仍在合理区间内
        - 索取董事会 KPI 包和月度收入 / ARR 桥
      - - 留存与集中度
        - NRR、GRR、logo 流失、头部客户占比、合同期限
        - 区分广泛装机基础和可持续经济价值
        - 按细分市场审查队列表和客户集中度
      - - 毛利率与支持负荷
        - 软件毛利率、支付 / RCM / 服务组合、单账户支持成本
        - 判断 Tebra 是否配得上软件型倍数
        - 审查按模块拆分的 P&L 和服务成本分析
      - - 股权结构表与融资条款
        - 优先股堆叠、债务、期权池、清算权和稀释
        - 决定真实入场经济性和下行保护
        - 检查融资文件和备考股权结构表
      - - 模块附加与扩张
        - 使用账单、支付、AI、增长和远程医疗产品的客户占比
        - 直接检验先落地再扩张的主张
        - 索取附加率和扩张队列表
      - - 退出准备度与审计质量
        - 财务审计状态、盈利质量、法务 / 隐私材料和客户推荐
        - 判断强叙事能否转化为机构级退出
        - 盈利质量、法律尽调、安全尽调和推荐访谈
    notes: 这些要求旨在把一个战略上说得通的故事转化为能支撑价格的承销证据。
    claimRefs:
      - CV005
      - CV006
      - CV028
