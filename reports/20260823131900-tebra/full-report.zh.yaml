  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、起源与定位
        blocks:
          - type: paragraph
            body: >-
              Tebra 在 Kareo 和 PatientPop 于 2021 年 11 月 2 日完成合并后成立，合并公司旨在推动独立医疗诊所现代化。合并把 Kareo 的云端 EHR、排班、计费和支付栈，与
              PatientPop 的诊所增长、网站、在线预约、搜索营销、注册和消息工具接在一起。上线时，合并平台支持超过 100,000 名医疗服务提供者、超过 85 million 名患者，员工约 1,000
              人。Kareo 创始人兼 CEO Dan Rodrigues 出任 Tebra 首席执行官，PatientPop 联合创始人 Luke Kervin 和 Travis Schneider
              则加入合并后的领导团队。成立以来，公开定位一直一致：Tebra 服务独立或私人诊所，不做医院系统；它销售的是覆盖诊疗交付、计费和患者获客的一体化工作流，而不是单一病历产品。
