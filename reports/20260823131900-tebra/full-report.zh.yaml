  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序概览
        blocks:
          - type: paragraph
            body: >-
              Tebra 最高严重度的风险集中在合规密集的运营复杂度，而不是某个单一二元失败。Tebra 在 EHR、计费、患者沟通、远程医疗、AI 笔记生成和互操作性接口中处理
              PHI，因此即便执行错误不大，也可能带来放大的监管或声誉后果。与此同时，公司的客户基础集中在独立诊所，而这些客户已经承受报销、人手和整合压力。两者叠加并不舒服：Tebra
              必须继续扩展产品宽度，同时把平台做得更容易、更安全、更可支持；而客户对工作流摩擦或定价惊喜的容忍度有限。解读当前公开记录的最佳方式是：Tebra
              已经有不少缓释措施——安全控制、信任页面、发布管理、产品文档和新融资——但围绕审计范围、事件历史、合同条款和支持经济性，仍有几个重要尽调问题。投资者应假设多项风险会同时互动，而不是按顺序发生。
