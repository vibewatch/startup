- id: moat-durability-and-adverse-evidence
  title: Moat Durability and Adverse Evidence
  body: 'The moat is not generic EHR functionality. Most relevant rivals now claim integrated charting, billing, portals, telehealth, AI documentation, or cloud delivery. Tebra’s more distinctive wedge is the combination of independent-practice billing infrastructure and patient-growth software inherited from Kareo plus PatientPop. Independent review evidence explicitly says that combined stack can be a moat for practices that care about both insurance billing and new-patient growth. The adverse evidence is also explicit: reviewers and external testers still feel seams between clinical and marketing modules, some users complain about customization and support inconsistency, and scaled rivals can outmatch Tebra on analytics, enterprise readiness, or lower-cost simplicity depending on segment. That means durability depends less on raw feature count than on whether Tebra can keep integrating, automate billing and documentation faster than peers, and prove that the bundled growth layer raises
    ROI enough to offset higher price and complexity.'
