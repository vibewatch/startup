- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Tebra uniquely bundles growth plus billing
    - Competitors add AI, portals, and basic engagement while low-cost vendors keep EHR/PM good enough
    - High
    - Test module attach rate and ROI from growth products by cohort
  - - Independent-practice focus creates product fit
    - Independent practices keep consolidating or move to larger systems
    - High
    - Assess whether Tebra wins affiliated groups without losing simplicity
  - - All-in-one stack raises switching costs
    - Merger seams make some customers reconsider or buy point solutions
    - High
    - Request churn reasons and module-level satisfaction by cohort
  - - Support and onboarding are a differentiator
    - Negative reviews cite slowdowns, limited customization, and support inconsistency
    - Medium
    - Review support SLA, backlog, and implementation NPS
  - - API/integration access increases stickiness
    - SOAP-only and polling-oriented design can lag newer interoperability expectations
    - Medium
    - Review roadmap for modern APIs, FHIR depth, and partner usage
  - - Security/compliance posture supports trust
    - Any outage or privacy incident would damage the small-practice trust loop
    - Medium-High
    - Obtain incident history, SOC/HITRUST evidence, and response metrics
  notes: The moat is strongest when Tebra can prove that bundled practice growth lifts ROI and retention rather than merely increasing package size.
