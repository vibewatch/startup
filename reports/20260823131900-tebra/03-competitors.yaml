- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor
  - Price / unit / contract model
  - Included capabilities
  - Discount / unknowns
  - Implication
  rows:
  - - Tebra
    - HTO says realistic 2026 entry point ~$149-$199/provider/month for EHR + Billing; growth tiers ~$300-$500/provider/month, full suite $700+/month; annual commitments common above entry tier
    - EHR, billing, scheduling, portal; higher tiers add website, reputation, booking widgets, paid acquisition
    - Quote-driven; official site stresses transparency but public list pricing is limited
    - Tebra often sells a broader commercial bundle than pure-EHR alternatives
  - - athenahealth
    - Customized or percentage-of-collections style pricing per Software Finder
    - EHR, PM, patient engagement, network-enabled workflows
    - Hard to compare because realized fees depend on collections and scope
    - Can fit RCM-heavy operators but creates comparison friction
  - - AdvancedMD
    - $429/month PM scheduling & billing; $729/month EHR+PM; $999/month patient engagement bundle per Software Finder
    - PM, EHR, patient engagement, analytics
    - Third-party pricing; add-ons and tailored plans available
    - Premium all-in-one alternative for ambulatory groups
  - - DrChrono
    - $249/month and up per Software Finder alternatives page
    - EHR, telemedicine, billing integrations, patient engagement
    - Package-dependent
    - Mid-market benchmark with narrower growth tooling
  - - Office Ally
    - No monthly fee for Practice Mate; transactional fees may apply
    - Scheduling, billing, reports, eligibility and optional add-ons
    - Transactional fees and add-ons matter
    - Strong price umbrella below Tebra
  - - RXNT
    - $126/provider/month per RXNT cost guide; PM/EHR/eRx bundle value emphasized
    - ONC-certified EHR, PM, portal, eRx, training/support
    - Self-reported competitor comparisons
    - Transparent budget competitor for smaller practices
  notes: Packaging data mixes independent review evidence, third-party comparisons, and vendor self-reporting; it should be treated as procurement guidance, not realized revenue data.
