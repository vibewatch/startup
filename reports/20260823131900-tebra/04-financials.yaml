  - CI002
  - CI004
  - CI030
- calloutType: risk
  title: The main problem is missing disclosure, not missing narrative
  body: Capital, product breadth, and customer ROI anecdotes all point in a positive direction. The issue is that the public record still omits the core SaaS metrics needed to price risk appropriately.
  claimRefs:
  - CI021
  - CI028
