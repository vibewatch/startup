- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Recognized revenue and ARR
    - No direct revenue model or growth underwriting possible
    - Request audited monthly recurring revenue and historical growth bridge
  - - Gross margin and contribution margin
    - Cannot tell whether mix is software-like or service-heavy
    - Request margin stack by subscription, payments, services, and AI features
  - - CAC, payback, sales efficiency
    - No disciplined view of GTM quality
    - Request cohort CAC and sales-cycle metrics by segment
  - - Retention, churn, and expansion
    - Cannot evaluate durability of installed base
    - Request GRR, NRR, logo churn, and module expansion data
  - - Cash balance, debt terms, and covenant package
    - Capital adequacy remains narrative-led
    - Request latest balance sheet, debt docs, and compliance certificate
  - - Implementation burden and support cost
    - Unknown whether SMB onboarding scales efficiently
    - Request average onboarding days, support tickets, and gross margin by cohort
  notes: These gaps are material enough that no public-only investor should treat Tebra as a fully underwritten financial opportunity.
