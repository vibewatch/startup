callouts:
- calloutType: insight
  title: The company likely monetizes more than seats
  body: Tebra’s economics are probably a blend of recurring software, workflow-linked financial modules, and growth add-ons. That is attractive if margins stay software-like, but public evidence does not yet prove that they do.
  claimRefs:
