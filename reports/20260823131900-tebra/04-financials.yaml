- id: capital-adequacy-and-benchmark-readthrough
  title: Capital Adequacy and Benchmark Readthrough
  body: 'The best hard financial fact is the December 2025 financing. Tebra and independent coverage say the company closed $250 million in primarily equity capital plus a J.P. Morgan debt facility, led by Hildred, and that the round was over-subscribed. Management also says the company already has a profitable core business and intends to use the new capital to accelerate AI across documentation, RCM, patient experience, and marketing. That strongly suggests near-term capital adequacy for product investment, even without public cash-balance disclosure. Public-company readthroughs help frame what a good ambulatory or healthcare-workflow software model can look like, even if they are not direct comps. Phreesia shows that patient-activation and payments-adjacent software can reach positive EBITDA and free cash flow at sub-billion revenue scale. Veeva shows the other extreme: high-quality subscription economics, large deferred revenue, and durable operating margins at much larger scale. Tebra
    almost certainly sits between those poles, but public evidence is too thin to place it precisely.'
