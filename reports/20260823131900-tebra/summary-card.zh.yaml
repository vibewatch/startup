  topStrengths:
    - 独立诊所工作流栈已经整合 EHR、账单、支付、患者互动、增长和 AI 辅助文档。
    - 披露装机基础达到 140,000+ 名服务方和 42,000+ 家私人诊所。
    - 2025 年 12 月融资新增 $250M，官方来源称核心业务已经盈利。
    - 公司只聚焦独立诊所，这一客群有真实工作流痛点，也需要一体化软件。
    - 如果附加率和留存够强，跨模块范围能带来可信的扩张上行。
  topRisks:
    - 当前 ARR/收入、NRR/GRR、毛利率和流失仍未披露，估值分母尚未被证明。
    - 独立诊所客户面临报销压力和整合压力，增长和留存都可能被削弱。
    - 评论和投诉证据指向支持、取消、定价和上线摩擦，可能压缩倍数。
    - 相比更干净的单一栈竞争对手，Kareo + PatientPop 组合仍背着产品整合和执行复杂度。
    - 监管、互操作性、隐私和信息阻断要求，会持续增加合规和产品成本负担。
  unresolvedGaps:
    - 当前 ARR/收入桥、近期增长和管理层预测。
    - 按客群切分的 NRR、GRR、logo 流失、合同期限和队列留存。
    - 软件、RCM、支付、支持和服务之间的毛利率拆分。
    - 股权结构表、优先股堆叠、债务条款，以及 2025 年融资的确切投后估值。
    - 客户集中度、模块附加率，以及每账户支持成本。
