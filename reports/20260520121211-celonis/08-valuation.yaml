      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV033
      - CV034
      - CV037
  - calloutType: insight
    title: IPO timing is the single biggest 2026–2027 swing factor
    body: >-
      Reuters (September 2025) and The Information (December 2025) describe active US IPO exploration, while
      Bloomberg (June 2025) reported Celonis told staff plans were on hold for market volatility. A confidential S-1
      or a banker mandate would crystallize the denominator faster than any product launch and is the single most
      tractable diligence trigger for changing the call.
    claimRefs:
      - CV015
      - CV020
      - CV021
      - CV022
      - CV041
  - calloutType: assumption
    title: ARR baseline rests on a Sacra estimate, not audited revenue
    body: >-
      Every multiple in this chapter is anchored on Sacra's ~$700M 2024 ARR estimate. Celonis has not published an
      audited revenue or ARR figure since the 2022 round, and PitchBook, Forbes, and Wikipedia disagree on lifetime
      capital raised (~$1.37B vs. $1.6B+ vs. ~$1.77B). The valuation bands move materially if the true ARR is closer
      to $500M or $1B.
