  - id: comparable-analysis
    title: Comparable companies, multiple band, and scenario logic
    body: >-
      The defensible comp universe spans three layers. The closest workflow / process peers — Pegasystems, Appian,
      and UiPath — trade at roughly 4–6x trailing revenue per Wikipedia market-cap snapshots cross-checked with their
      SEC 10-K listings, anchoring a conservative valuation. The high-growth data-infrastructure layer — Snowflake
      and Datadog — runs at roughly 14–17x revenue and sets a realistic mid-band ceiling, given Celonis' AI-agent
      framing and 1,400+ enterprise footprint. ServiceNow, with a roughly $200B market cap on about $11–12B revenue,
      acts as the aspirational long-run anchor showing what scaled, profitable enterprise workflow software can earn
      in the public market. Bessemer's BVP Nasdaq Emerging Cloud Index data and the State of the Cloud 2024 narrative
      both document that the median public cloud multiple compressed materially from 2021 highs, which is exactly the
      reset SaaStr and Meritech-derived commentary describe. Applied to a Sacra estimated ARR of about $700M for
      2024, the bear case (5x) lands near $3.5B, the base case (12x using the data-infra blend) near $8.4B, and the
      bull case (18x with an AI-agent premium) near $12.6B — still below the 2022 $13B sticker.
