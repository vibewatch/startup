  - id: decision-diligence
    title: Recommendation, thesis-break triggers, and final diligence asks
    body: >-
      The committee call is track with medium confidence, valuation stance stretched, risk rating high, and an
      explicit ask for IPO-window discipline before any incremental commitment. The thesis-break triggers are
      concrete: a down-round or secondary print below $9B, ARR growth slipping below 25%, an adverse outcome in the
      SAP antitrust dispute filed in March 2025, a third layoff wave, or a 2026 IPO being formally postponed for more
      than two consecutive quarters. The diligence asks that would move the call are equally concrete: audited
      revenue, ARR, gross margin, and free-cash-flow bridges; the cap-table preference stack including the QIA-led
      Series D terms; a quantified read on SAP-related ACV concentration and reseller revenue at risk; and a verified
      mutual-fund mark or executed Forge / EquityZen secondary print to triangulate the current implied valuation.
      Until those land, public evidence supports patience rather than purchase. The KPI dashboard and the
      valuation-sensitivity chart make the trade-offs explicit, and the recommendation callout below restates the
      stance so the report-meta summary can cite it directly without re-deriving it.
