callouts:
  - calloutType: recommendation
    title: Track, not buy, at the 2022 $13B mark
    body: >-
      Underwrite Celonis as a high-quality category leader at a stretched private mark. Recommendation is track with
      medium confidence and high risk rating; the call moves to buy on (a) an IPO range at or below $10B, (b)
      audited FY2025 revenue and margin disclosure, or (c) a verified secondary print between $8B and $11B.
    claimRefs:
