  evidenceGaps:
    - type: enumeration-incomplete
      severity: minor
      topic: comparables (TV004)
      missingEvidence: Additional private RPA / process-mining peers (ABBYY, SAP Signavio, Microsoft Power Automate) with executable revenue denominators for TV004.
      whyItMatters: A fuller comp panel would tighten the multiple band used to discipline the 2022 $13B mark.
      diligencePath: Pull PitchBook / Tracxn private comps for ABBYY and Signavio; cross-check with Microsoft's Power Platform revenue disclosure.
      relatedTableRefs:
        - TV004
    - type: missing-source
      severity: material
      topic: mutual-fund-marks
      missingEvidence: Public mutual-fund mark for Celonis between 2023 and 2026 (e.g., Fidelity or T. Rowe Price N-PORT filings).
      whyItMatters: Mutual-fund marks would triangulate the 2022 $13B sticker against contemporaneous secondary pricing.
      diligencePath: Search EDGAR N-PORT filings for Celonis holdings; pull cross-fund pricing if disclosed.
      relatedQuestionRefs:
        - QV028
    - type: private-evidence-only
      severity: material
      topic: cap-table-waterfall
      missingEvidence: Series D and D-extension preference terms, ratchets, and liquidation stack.
      whyItMatters: Determines whether common-equivalent value at the next mark matches the headline post-money.
      diligencePath: Engage a secondary specialist or banker to model preference-adjusted equity if a transaction window opens.
      relatedQuestionRefs:
        - QV029
    - type: access-blocked
      severity: minor
      topic: secondary-market
      missingEvidence: Executed Forge / EquityZen / SharesPost trade prints for Celonis common or preferred.
      whyItMatters: A live secondary print would close the price-discovery gap between the 2022 mark and the next primary round.
      diligencePath: Ping secondary brokers for indicative bids; monitor Forge insights page once it returns Celonis-specific content.
      relatedQuestionRefs:
        - QV012
