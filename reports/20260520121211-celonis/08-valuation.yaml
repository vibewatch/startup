  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Audited financials
        - Recognized revenue, ARR, gross margin, free-cash-flow bridges for FY2024 and FY2025
        - Converts Sacra's $700M estimate into a verifiable denominator and re-anchors every multiple
        - Request a management data-room session conditional on engagement; cross-check with QIA disclosure
      - - Cap-table waterfall
        - Series D and D-extension preference, ratchets, and liquidation stack
        - Determines whether common-equivalent value at the next mark matches the headline post-money
        - Engage a secondary specialist or banker to model preference-adjusted equity
      - - SAP-coupled revenue concentration
        - ACV and growth contribution of SAP-resold or SAP-integrated accounts
        - Quantifies the downside of an adverse antitrust outcome on the partner channel
        - Customer reference calls plus channel-partner survey via independent diligence vendor
      - - Verified secondary print
        - Executed Forge / EquityZen / SharesPost trade or a fund N-PORT mark
        - Provides a price-discovery point between the 2022 mark and the next primary round
        - Search EDGAR N-PORT filings for Celonis holdings; ping secondary brokers for indicative bids
      - - IPO timeline and use of proceeds
        - Concrete S-1 timing, target proceeds, and lock-up structure
        - Anchors the exit pathway in the base case and disciplines the bull case
        - Track Bloomberg, Reuters, and The Information for confidential filing signals; monitor banker mandates
