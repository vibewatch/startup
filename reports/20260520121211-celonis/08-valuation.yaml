  - id: valuation-context
    title: Last formal mark, secondary signals, and disclosure quality
    body: >-
      The anchor mark is the QIA-led Series D extension announced on 2022-08-23 at a reported $13B post-money,
      preceded by the June 2021 Series D at $11B reported by Forbes. Total raised is itself contested across primary
      trackers: PitchBook cites roughly $1.37B, Forbes lists $1.6B+, and Wikipedia aggregates a figure closer to
      $1.77B; the contradiction is material because dilution and preference stacks change every scenario downstream.
      Public secondary marks for Celonis are not transparently disclosed: Forge Global lists the company on its
      private-market platform but the public-facing insight page returns boilerplate rather than executed pricing.
      Mutual-fund marks have not been re-published since the 2023 layoff cycle, and The Information's December 2025
      and Reuters' September 2025 reports describe IPO exploration without committing to a price band. The Bloomberg
      June 2025 staff note that the IPO was on hold for market volatility is the most adverse signal on this axis.
      Disclosure quality is therefore weak relative to the late-stage software peer set: there is no audited revenue,
      no margin disclosure, no cap-table waterfall, and no formal valuation refresh since the 2022 round.
    claimRefs:
