  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Down-round / secondary print
        - Primary or executed secondary below $9B post-money
        - Confirms public-comp reset is fully priced into Celonis
        - Re-underwrite at new anchor; consider entering at new mark only with audited disclosure
      - - ARR growth deceleration
        - Disclosed ARR growth below 25% year-over-year
        - Pulls the base case toward the bear scenario at workflow-comp multiples
        - Pause incremental work; revisit only after a full FY of evidence
      - - SAP antitrust outcome
        - Adverse ruling or settlement restricting Celonis' SAP data access
        - Caps the AI-agent thesis and increases churn risk on SAP-coupled accounts
        - Reduce position sizing or exit pre-IPO; recompute ACV at risk
      - - Layoff cycle
        - A third public layoff wave above 5% of headcount within 12 months
        - Signals durable cost / growth mismatch and forces margin focus
        - Treat as a growth re-rating event; reweight toward bear scenario
      - - IPO postponement
        - 2026 US IPO formally postponed beyond Q2 2027
        - Extends private hold and increases denominator-risk discount
        - Hold but tighten diligence cadence; demand fresh secondary marks
    notes: >-
      Thresholds are committee triggers, not market consensus; any single trigger should prompt a fresh re-rating
      rather than an automatic exit.
