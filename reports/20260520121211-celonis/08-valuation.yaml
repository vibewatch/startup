    title: Comparable valuation table
    columns:
      - Comparable
      - Valuation / market cap
      - Revenue denominator
      - Implied multiple / status
      - Relevance
      - Limitation
    rows:
      - - Celonis (subject)
        - $11B–$13B private post-money (2021 / 2022 rounds)
        - ~$700M ARR (Sacra estimate, 2024)
        - ~16x–19x implied
        - Anchors what existing investors are marked at versus current public comps.
        - Private post-money valuation and a third-party ARR estimate are not directly comparable to public EV / revenue.
      - - Pegasystems
        - ~$8B–$9B market cap (2026 snapshot)
        - ~$1.5B trailing revenue
        - ~5x–6x
        - Closest legacy workflow / BPM peer with a multi-decade enterprise footprint.
        - Pega has a larger services mix and slower growth profile than Celonis.
      - - Appian
        - ~$2.5B–$3B market cap
        - ~$600M trailing revenue
        - ~4x–5x
        - Useful low-growth workflow comp showing the floor for non-AI process automation.
        - Smaller scale and ongoing legal-tech narrative make it more floor than direct anchor.
      - - UiPath
        - ~$8B market cap
        - ~$1.4B trailing revenue
        - ~5x–6x
        - Closest RPA / automation peer with overlapping enterprise customers and 2021 IPO history.
        - UiPath's IPO re-rating shows the gap between private mark and public price discovery.
      - - ServiceNow
        - ~$200B market cap
        - ~$11B–$12B revenue
        - ~17x–18x
        - Scaled, profitable enterprise-workflow benchmark and the long-run aspirational anchor.
        - Far larger scale, audited disclosure, and broader product surface than Celonis.
      - - Snowflake
        - ~$50B market cap
        - ~$3.6B product revenue
        - ~14x
        - Data-infrastructure peer with comparable AI-narrative premium.
        - Different business model (consumption-based) and IPO-grade disclosure.
      - - Datadog
        - ~$45B market cap
        - ~$2.8B revenue
        - ~16x
        - High-growth enterprise SaaS peer at scale that justifies a mid-teens multiple.
        - Observability is a different end-market than process intelligence.
      - - BVP Emerging Cloud Index
        - Index basket
        - Median EV / revenue tracked by Bessemer
        - Median compressed materially from 2021 highs
        - Provides the public-cloud reset baseline that disciplines any Celonis premium.
        - Index methodology excludes mega-caps and skews to high-growth cloud names.
    notes: >-
      Public market caps and revenue denominators are 2026 directional snapshots cross-checked against Wikipedia
      summaries and the relevant SEC 10-K filings index pages; private Celonis figures are from PitchBook, Forbes, and
      Sacra and should be read as ranges, not point estimates.
