  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Category leadership
        - Named a Leader in the 2026 Gartner Magic Quadrant for Process Intelligence Platforms.
        - SAP Signavio, Microsoft, IBM, Appian, and UiPath all compete in adjacent or overlapping markets.
        - A second consecutive Forrester / IDC leadership citation with explicit revenue-share data.
      - - Customer base
        - 1,400+ enterprise customers including BMW, GE Healthcare, DHL, Lockheed Martin, PepsiCo, Standard Bank.
        - Customer count is self-reported; Forbes lists "1,500" and the website also references "5,000+ deployments".
        - Audited customer cohort disclosure with ARR bands and concentration data.
      - - AI narrative
        - Celonis Context Model and Ikigai Labs acquisition (2026-05-12) position Celonis as enterprise-AI substrate.
        - AI-agent revenue is not separately disclosed; competitors (ServiceNow, Microsoft, SAP) embed similar capabilities.
        - Quantified AI-agent ARR with attach rate, gross margin, and competitive win-rate evidence.
      - - Valuation anchor
        - QIA-led August 2022 $13B round and Reuters / Information IPO chatter validate a premium mark.
        - Public process / workflow comps re-rated to 4–6x and Bloomberg reported the IPO was put on hold in June 2025.
        - A confidential S-1 or a clean primary round at or above $10B with disclosed terms.
      - - Disclosure
        - PitchBook, Forbes, Sacra, and Crunchbase all cover the company; Wikipedia consolidates the financing history.
        - No audited revenue, no margin disclosure, contradictory total-raised figures, and no published mutual-fund mark.
        - SEC-quality filings (audited revenue, ARR, FCF, cap table) released as part of an IPO process.
    notes: >-
      The anti-thesis is intentionally focused on price-sensitive and disclosure-sensitive risks, not on whether
      Celonis is strategically relevant.
