  - calloutType: risk
    title: Public-comp reset is the dominant downside
    body: >-
      Pegasystems, Appian, and UiPath now trade at 4–6x trailing revenue, and Bessemer's BVP Nasdaq Emerging Cloud
      Index documents a multi-year compression in median public-cloud multiples; the SaaStr commentary frames the
      reset as a structural rather than cyclical event. If Celonis prices off that comp set rather than the
      Snowflake / Datadog ceiling, the implied private value falls well below the 2022 mark.
    claimRefs:
