  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - ARR scales toward $1.0B–$1.2B by FY2026, AI-agent narrative holds, 2026 IPO prices at data-infra premium.
        - 14x–18x on $1.0B–$1.2B implies $14B–$22B; 1.1x–1.7x gross from a $13B entry on a 2–3 year hold.
        - Premium multiple must survive both broader software repricing and SAP counter-narrative.
        - Possible but requires both flawless execution and a supportive 2026 IPO tape.
      - - Base
        - ARR around $850M, blend of workflow and data-infra comps, IPO arrives at neutral-to-slight-discount band.
        - 8x–12x on $850M implies $6.8B–$10.2B; roughly 0.5x–0.8x gross from a $13B entry.
        - Down-round risk and preference overhang make headline-loss possible even on solid operating progress.
        - Most plausible on public evidence; aligns with the public-comp reset documented by BVP and SaaStr.
      - - Bear
        - ARR stalls near $700M, SAP antitrust drags, third layoff wave, IPO postponed beyond 2027.
        - 4x–6x on $700M implies $2.8B–$4.2B; 0.2x–0.3x gross from a $13B entry.
        - A category leader can still produce a poor entry if public discipline arrives before disclosure quality.
        - Material downside if either macro multiples stay compressed or SAP partnership permanently breaks.
      - - Probability-weighted posture
        - Base-skewed because category quality is visible but price anchor is dated.
        - Supports track rather than buy at the 2022 sticker.
        - Cap-table opacity, SAP dispute, and IPO timing keep dispersion wide.
        - Late-stage private pricing needs more than category leadership.
    notes: >-
      Ranges are committee discussion tools built from Sacra's ARR estimate, public comp multiples, and explicit
      denominator caveats; they are not management guidance.
