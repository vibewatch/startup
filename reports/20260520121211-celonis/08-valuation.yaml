chapter:
  number: 8
  title: Valuation
  summary: >-
    Celonis still carries its 2022 $11–13B private mark while the public process / workflow comp set has compressed
    sharply, leaving the implied multiple stretched relative to Pegasystems, Appian, and UiPath and only defensible if
    investors anchor on the ServiceNow / Snowflake / Datadog ceiling. The honest call on public evidence is track
    rather than buy: company quality and the 2026 IPO chatter are real, but margin of safety at the last sticker is
    thin and audited financials are still missing.
sections:
  - id: thesis-anti-thesis
    title: Investment thesis, anti-thesis, and recommendation
    body: >-
      Celonis is the category-defining process-intelligence vendor, with a 2026 Gartner Magic Quadrant leader position,
      a 1,400+ enterprise customer base spanning BMW, Deutsche Post DHL, GE Healthcare, Lockheed Martin, PepsiCo, and
      Standard Bank, and a fresh AI narrative built on the Celonis Context Model launch and the announced Ikigai Labs
      acquisition on 2026-05-12. The thesis is that process mining is the durable substrate for enterprise AI agents,
      that Celonis has a multi-year head start, and that a 2026 US IPO would crystallize the value already implied by
      the August 2022 QIA-led $13B round. The anti-thesis is unforgiving: the last formal mark is almost four years
      old, Sacra estimates roughly $700M ARR for 2024, public process / workflow comps (Pegasystems, Appian, UiPath)
      have de-rated to 4–6x revenue, Bloomberg reported in June 2025 that Celonis told staff IPO plans were on hold,
      Sifted and Handelsblatt documented two waves of layoffs in 2023 and 2024, and SAP's antitrust counter-narrative
      caps the partner upside. On public evidence the recommendation is track, with valuation stance stretched and a
      buy call deferred until either an IPO discount or audited disclosure resets the denominator.
    claimRefs:
