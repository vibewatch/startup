        - Request 18-month cash bridge, treasury policy, and any debt covenants.
      - - 2024 financing event details
        - PitchBook lists a Jan 2024 "Later Stage VC" deal with no amount or valuation
        - PitchBook Wayback 2025 snapshot
        - Confirm investors, amount, valuation, and any anti-dilution / liquidation preferences.
      - - Mutual-fund marks vs $13B last round
        - Indicates private-market re-rating
        - No Fidelity, T. Rowe Price or other fund N-PORT disclosure captured for this run
        - Pull SEC N-PORT and prospectus filings of fund holders.
      - - 2023 layoffs primary source
        - ~140 layoffs reported but primary URL unverified in this run
        - Factpack flags this as an evidence gap
        - Confirm via Layoffs.fyi entry or TechCrunch/The Information article.
      - - SAP antitrust litigation financial exposure
        - Both upside (relief) and downside (cost, distribution disruption) outcomes possible
        - BloombergLaw covers the filing; financial exposure not quantified
        - Obtain pleadings, damages theory, and counsel cost estimate.
    notes: >-
      These are the unresolved disclosure gaps that block a full underwriting model. Each row's diligence path is
      executable in a normal due-diligence window.
