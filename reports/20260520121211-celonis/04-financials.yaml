callouts:
  - calloutType: risk
    title: $13B mark is nearly four years old and unrefreshed
    body: >-
      Celonis's last formal valuation is the August 2022 Series-D extension at $13B led by Qatar Investment Authority.
      No public up-round has refreshed that mark, and the January 2024 PitchBook-recorded later-stage event has no
      disclosed amount or valuation — leaving down-round risk on the table for any 2026 IPO or secondary.
    claimRefs:
      - CI029
      - CI030
      - CI031
      - CI034
  - calloutType: insight
    title: Public total-raised diverges by ~$400M across authoritative publishers
    body: >-
      PitchBook ($1.37B), Forbes ($1.6B+) and Wikipedia (~$1.77B) disagree on Celonis's cumulative capital raised.
      The most likely reconciliation is differential treatment of the ServiceNow strategic investment, secondaries
      and the undisclosed January 2024 deal — but a clean cap-table is a first-order diligence ask.
    claimRefs:
      - CI031
      - CI032
      - CI033
      - CI039
  - calloutType: strength
    title: Capital deployment continues — Ikigai Labs deal signals available dry powder
    body: >-
      Celonis is still doing capability M&A in 2026 (Ikigai Labs announced May 12), and the December 2024 CFO hire
      from Criteo/SAP/Contentsquare is widely read as IPO-preparation discipline. Both suggest the company is
      financing growth options rather than triaging a liquidity shortfall.
    claimRefs:
      - CI020
      - CI036
      - CI038
