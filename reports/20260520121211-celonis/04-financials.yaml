company:
  name: Celonis
chapter:
  number: 4
  title: Financials
  summary: >-
    Celonis is a late-stage private enterprise software company whose financial story is dominated by a $1.37B–$1.77B
    publicly reported capital stack, a frozen-at-2022 $13B last-round valuation, an undisclosed but materially scaled
    book of 1,400–1,500 enterprise customers, and a 2026 acquisition-and-rebrand narrative led by the new Celonis
    Context Model and the agreed Ikigai Labs purchase. Public evidence supports a usage- and platform-priced
    subscription model with significant enterprise expansion proof points, but withholds revenue, ARR, gross margin,
    cash, burn, and runway — the core inputs needed to underwrite the company. Capital adequacy looks adequate but is
    structurally dependent on whether the long-rumored 2026 US IPO actually clears and at what mark relative to the
    aging $13B Series-D-extension reference price.
sections:
  - id: revenue-model-and-monetization
    title: Revenue model, monetization surfaces, and what is publicly observable about traction
    body: >-
      Celonis monetizes a single integrated platform — the Celonis Platform built around the Data Core, the new Celonis
      Context Model, and Build experiences — sold to large enterprises as a process-intelligence and Enterprise AI
      subscription. The company itself states that "more than 1,400 companies" use Celonis, while the Forbes company
      profile cites 1,500 customers and the company's about page references 5,000+ enterprise deployments as a separate
      metric, so even the simplest top-of-funnel number is reported three different ways depending on the publisher.
      No list pricing is published on the company's own surfaces; in contrast to public-cloud comparators such as
      UiPath, Pegasystems and Appian (all SEC registrants), Celonis treats pricing as a sales-led, contract-by-contract
      conversation. That means every revenue, ARR, gross margin, take-rate, average contract value, and discount-band
      figure for Celonis is private, and any chapter that pretends otherwise is over-fitting. What the public record
      does support is a multi-stream revenue surface: core process-mining and process-intelligence subscriptions,
      add-on Enterprise AI capabilities including the new Celonis Context Model and AgentC, ecosystem integrations
      with SAP, ServiceNow, Microsoft, IBM watsonx and Databricks that are revenue-relevant via co-sell, and a small
      services and partner-led implementation layer. Customer-disclosed value (e.g., GE Healthcare's $1.3B free
      cash-flow lift) is marketing proof, not Celonis revenue.
    claimRefs:
