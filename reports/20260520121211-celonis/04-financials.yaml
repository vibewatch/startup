  - id: gtm-unit-economics
    title: GTM motion, customer cohorts, and the unit-economics proxies that actually exist
    body: >-
      Celonis does not publish CAC, payback, sales-cycle length, ACV, NRR, or quota productivity. The right
      diligence stance is therefore to triangulate from public proxies: the scale and quality of the named customer
      book, partner-distribution coverage, and headcount as a sales-capacity input. PitchBook's February 2025
      snapshot pegs Celonis at 3,353 total employees, while the company itself says "3,000+" employees across 20+
      offices, implying a meaningful field organisation. The named customer book — BMW, GE Healthcare, Deutsche Post
      DHL, Deutsche Telekom, Lufthansa Cargo, Carrefour, Lockheed Martin, PepsiCo, Kraft Heinz, Uber, Uniper,
      Fujitsu, Novartis, Standard Bank, Siemens GBS, AstraZeneca, ASOS, Dell and Johnson & Johnson — is
      institutional-grade and skews to multi-year, multi-process accounts where land-expand economics are highly
      likely but not measurable from outside. Distribution leverage from the ServiceNow strategic partnership (in
      which ServiceNow took a financial investment) and from SAP, IBM, KPMG, EY, Accenture, AWS and Microsoft
      partner motions is the most plausible explanation for Celonis sustaining enterprise scale without disclosed
      revenue. Independent profiling services Sacra, Tracxn and CB Insights either gate Celonis financial
      disclosures behind paid tiers or show no useful numerics on their free pages, which is itself an evidence
      signal: even specialist private-market trackers do not have an underwriteable view of Celonis revenue today.
    claimRefs:
