  - id: financial-verdict-and-gaps
    title: Financial verdict, evidence gaps, and underwriting diligence path
    body: >-
      The verdict is that Celonis presents as a well-capitalised, enterprise-anchored, late-stage private
      software company with a credible product/market story and an identifiable path to IPO, but with a public
      financial profile that is materially thinner than peers of comparable scale. The chapter cannot
      responsibly assert ARR, revenue growth, gross margin, operating margin, cash, burn, or runway because no
      verified primary source discloses them; the company-website "+$13B valuation" and "$6.5B realised customer
      value" are marketing aggregates rather than financial statements. The most important diligence blockers are
      therefore: (1) the exact 2025 and trailing-twelve-month revenue and ARR, with bookings vs. recognised
      revenue split; (2) audited gross and operating margin; (3) a current cash, runway and burn schedule
      including any venture-debt covenants; (4) clarity on the January 2024 PitchBook "Later Stage VC" event,
      including any flat or down mark; (5) any mutual-fund mark-to-market disclosures (e.g., from Fidelity or T.
      Rowe Price holders) implying private-market re-rating since the 2022 $13B reference; and (6) IPO timing
      and use-of-proceeds plan, including whether Celonis intends to clear a US listing in 2026 as widely
      rumoured. Adverse risks worth pricing in are the SAP antitrust litigation outcome (which could either
      accelerate Celonis distribution or strand it), persistent down-round risk relative to the $13B mark, and a
      cumulative absence of disclosure that resembles other late-stage private companies which subsequently
      revised valuations sharply at IPO.
