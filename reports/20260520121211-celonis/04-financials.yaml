        - Request audited statements; cross-check against company-provided ARR cohort schedule.
      - - Gross margin / contribution margin
        - Determines whether platform is software-economics or services-heavy
        - Public software comps (Pegasystems profitable; Appian disclosed) bound the envelope but do not measure Celonis
