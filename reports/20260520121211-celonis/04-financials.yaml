  evidenceGaps:
    - type: missing-source
      severity: material
      topic: Customer concentration and top-account exposure
      missingEvidence: 'No public source quantifies Celonis''s revenue share held by its top-10 or top-25 accounts.'
      whyItMatters: Large-account concentration can materially change revenue durability and pricing leverage.
      diligencePath: Request top-25 customer revenue concentration and cohort retention.
      relatedQuestionRefs:
        - QI016
      relatedTableRefs:
        - TI005
    - type: missing-source
      severity: material
      topic: Revenue and ARR
      missingEvidence: 'No public Celonis 2023–2026 revenue, ARR, NRR, recognised revenue or bookings disclosure was located.'
      whyItMatters: Core underwriting input; everything else is downstream.
      diligencePath: Request audited financials and an ARR cohort schedule with bookings vs recognised revenue split.
      relatedQuestionRefs:
        - QI014
      relatedTableRefs:
        - TI005
    - type: missing-source
      severity: material
      topic: Gross and operating margin
      missingEvidence: No Celonis gross margin, contribution margin or operating margin disclosure exists in public sources.
      whyItMatters: Determines whether the platform is genuinely software-economics or services-heavy.
      diligencePath: Request audited GAAP gross margin by product line and operating segment.
      relatedQuestionRefs:
        - QI015
      relatedTableRefs:
        - TI005
    - type: missing-source
      severity: material
      topic: Cash, monthly burn and runway
      missingEvidence: No public source discloses Celonis cash balance, monthly burn, or runway months.
      whyItMatters: Solvency test for a private company; capital adequacy not modelable without it.
      diligencePath: Request 18-month cash bridge, current treasury balance, and any venture-debt covenant terms.
      relatedQuestionRefs:
        - QI009
        - QI010
      relatedTableRefs:
        - TI004
        - TI005
    - type: missing-source
      severity: material
      topic: January 2024 financing event details
      missingEvidence: 'PitchBook lists a January 2024 Later Stage VC deal with no amount, investors, or valuation disclosed.'
      whyItMatters: Determines whether 2024 was a flat, up or down mark and therefore the most recent true reference price.
      diligencePath: Confirm lead investor, amount, valuation, and any anti-dilution or liquidation preferences.
      relatedQuestionRefs:
        - QI020
      relatedTableRefs:
        - TI004
        - TI005
    - type: missing-source
      severity: important
      topic: Mutual-fund marks vs $13B reference
      missingEvidence: No Fidelity, T. Rowe Price or other fund N-PORT disclosure of Celonis private-mark was captured.
      whyItMatters: Mutual-fund marks would indicate private-market re-rating since the August 2022 $13B mark.
      diligencePath: Pull SEC N-PORT and prospectus filings of likely fund holders.
      relatedQuestionRefs:
        - QI019
      relatedTableRefs:
        - TI005
