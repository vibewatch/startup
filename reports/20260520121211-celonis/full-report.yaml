  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Product scope: the Celonis Platform as a single integrated process-intelligence and Enterprise AI surface'
        blocks:
          - type: paragraph
            body: >-
              Celonis sells a single platform — the Celonis Platform — built around the Data Core, the new Celonis
              Context Model launched on 12 May 2026, Build experiences (Studio, Apps, Action Flows, Marketplace) and the
              AgentC agent layer first introduced at Celosphere on 23 October 2024. The customer-visible job is
              object-centric process mining (OCPM): connect to enterprise systems (SAP, Oracle, ServiceNow, Salesforce,
              Workday, custom databases), build a digital twin of operations across objects and events, find
              inefficiencies and value leakage, and then orchestrate change either through Action Flows automations or,
              increasingly, through AI agents that consume the same Context Model. The company's platform page frames
              the surface as 'industrialize Enterprise AI' rather than as a stand-alone process-mining tool, and the
              public docs site (docs.celonis.com) confirms that the same Data Core, PQL query language and PI Graph
              metadata layer underpin both the human-facing Studio and the agent-facing AgentC and CCM surfaces.
              Marketplace.celonis.com hosts partner-built apps, connectors and industry packages, and the company
              maintains a public GitHub organisation (github.com/celonis) plus a PyCelonis SDK referenced in docs, so
              the platform is genuinely developer-addressable even though no self-serve pricing is published.
