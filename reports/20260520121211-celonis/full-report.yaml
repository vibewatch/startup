      - number: '7.2'
        title: Operational, security, partner-concentration, and execution risk all transmit through SAP and the AI rollout
        blocks:
          - type: paragraph
            body: >-
              Celonis's operational risk surface is dominated by partner concentration, not by obvious uptime or breach
              events (no public security-incident register, breach notification, or status page was retrievable from
              primary Celonis sources during this run — itself a diligence gap). The most concentrated dependency is
              SAP: Celonis grew up as an SAP Startup Focus participant in 2012, signed a global reseller agreement in
              2015 (sold as "Celonis Process Mining by SAP"), and built its installed base around customers running SAP
              ECC and S/4HANA. SAP's own ownership of Signavio (a 2021 acquisition explicitly positioned as a
              process-mining/process-modelling competitor) plus the RISE/Grow with SAP data-access dispute mean that the
              single counterparty that historically sourced and distributed Celonis is now simultaneously an active
              legal adversary, an aggressive competitor, and a gatekeeper to roughly half the installed base's
              underlying ERP data. Beyond SAP, competitive pressure stacks: Microsoft is bundling Power Automate Process
              Mining inside the Microsoft 365 / Power Platform estate; UiPath pushes Process Mining inside its existing
              automation footprint; IBM ships its own process-mining product and simultaneously partners with Celonis
              via watsonx; Appian and Pegasystems carry adjacent low-code workflow narratives. The AgentC / CCM rollouts
              compound execution risk: launching enterprise-AI substrate while simultaneously closing the Ikigai Labs
              acquisition (announced 12 May 2026), absorbing PAF (2022), Symbio (2023/2024), Integromat/Make (2020),
              Lenses.io (2021), and Banyas (2019) creates real integration, talent, and product-management load against
              a 3,000+ headcount that already absorbed two rounds of layoffs. Talent risk is live: Glassdoor was
              unreachable to verify employee sentiment in this run, Sifted and Handelsblatt coverage of the 2023 and
              2024 reductions returned 404s through the standard fetch path, and the company has had no confirmed public
              up-round since 2022.
