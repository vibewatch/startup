      - number: '2.4'
        title: Growth drivers, adoption constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The demand backdrop is strong enough to justify continued category expansion. IDC says 2025 marks a shift
              from AI experimentation to reinvention; Celonis-cited Microsoft and Forrester commentary frames process
              intelligence as the missing operational context for AI agents; and Celonis's own "Four 2025 supply-chain
              predictions" piece and its 2026 tariff-management positioning argue that macro disruption (tariffs,
              supply-chain shocks, agentic-AI rollouts) increases willingness to fund process visibility. Celonis is
              also being designed into partner ecosystems as the data substrate for ServiceNow workflows, IBM watsonx,
              Microsoft Copilot, and AWS Bedrock — multiplying its surface area without proportionally growing its own
              sales force. Constraints are real and symmetric. Object-centric process mining (OCPM) is still novel;
              Celonis must educate buyers, as its own blog post on Everest Group concerns about OCPM acknowledges. The
              SAP relationship is now adversarial — Celonis sued SAP in March 2025 on antitrust grounds over data access
              — which directly threatens the SAP-event-log pipeline that historically powered the platform. Gartner's
              2026 Magic Quadrant moved IBM, UiPath, SAP/Signavio, Microsoft, and Software AG/ARIS into Leader or
              near-Leader positions, raising the risk of price compression. Celonis also faces commoditization pressure
              from open-source Apromore (now part of Salesforce) and from automation-suite bundling. Layered on top,
              broad IT-spend governance, FinOps scrutiny, and uneven enterprise data quality slow conversion from PoC to
              multiyear ARR. For valuation, the consequence is that Celonis benefits from a credible secular tailwind,
              but durable upside depends on (a) winning data access fights, (b) retaining a defensible OCPM and Context
              Model lead, and (c) attaching to AI-agent budgets at materially higher net retention than the underlying
              process-analytics category alone would justify.
