      - number: '3.3'
        title: Capability, pricing, and packaging comparison
        blocks:
          - type: paragraph
            body: >-
              Public capability comparison is partial because most competitors publish marketing surfaces rather than
              full capability matrices, but enough is on the public web to compare anchor dimensions. Celonis pitches
              the Process Intelligence Graph, object-centric process mining (OCPM), the Celonis Context Model, and
              AgentC as a layered stack that connects raw event data to AI agents, with Gartner Leader placement
              reinforcing the breadth claim. SAP Signavio matches on ERP depth and now layers process intelligence
              inside SAP Business Suite, but is weaker on object-centric mining and multi-source coverage outside SAP.
              Microsoft and UiPath lean on automation handoffs; ABBYY and QPR lean on task mining plus AI root-cause
              analysis; ARIS leans on BPM/governance heritage. None of the major competitors publish standardized
              per-user or per-event pricing on their public sites, and Celonis itself does not publish list pricing, so
              total cost of ownership is opaque across the board. That pricing opacity is itself a competitive vector:
              bundled competitors (SAP, Microsoft, IBM) can present process mining as a zero-incremental-cost feature of
              an existing contract, while Celonis must justify a standalone enterprise subscription. Customers can
              multi-home process mining (some firms run Celonis alongside Signavio for SAP and Microsoft for Power
              Platform workloads), but that increases total switching cost only marginally because event data extraction
              is the dominant integration effort.
