      - number: '7.4'
        title: Governance, geography, and people risk plus monitorable thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Celonis remains co-CEO led by founders Alex Rinke and Bastian Nominacher, with co-founder Martin Klenk as
              CTO. Co-CEO structures concentrate decision rights inside a personal relationship that has not been
              publicly stress-tested through a recession, a public-market filing, or a hostile-acquirer event. The
              recently added President (Carsten Thoma, ex-Hybris/SAP) and CFO (Benoit Fouilland, ex-Criteo) provide
              professional balance but are themselves new-in-seat. Geographic concentration is real: Munich plus New
              York City headquarters, European DACH-leaning reference base, German legal domicile and BaFin/BSI
              regulatory environment, and a German IPO ecosystem that has been historically thin make Celonis
              structurally exposed to European macroeconomic, geopolitical (Ukraine, energy, sanctions), and
              capital-markets conditions in a way US-domiciled peers like UiPath, Databricks, or Snowflake are not. IP
              risk is two-sided: the Celonis-vs-SAP patent suit asserts Celonis IP, but it also implicitly puts Celonis
              IP into public-domain scrutiny by counter-claim. The most actionable output of this chapter is therefore a
              set of monitorable kill criteria: an adverse SAP-suit ruling, an explicit down-round, a second IPO
              postponement past 2027, a third round of layoffs, a Gartner downgrade from Leader, or a public customer
              defection from Celonis to SAP Signavio would each independently compress the bull case. The recommendation
              is to treat the SAP-suit docket, BaFin and Bundeskartellamt registers, the EU AI Act implementing-act
              tracker, layoffs.fyi, and CourtListener as standing diligence surfaces — none of which the company
              controls — and to require management to map AgentC / CCM into provider vs deployer categories under the AI
              Act before underwriting any premium to the 2022 mark.
