      - number: '2.2'
        title: Sizing lenses, publisher contradictions, and demand backdrop
        blocks:
          - type: paragraph
            body: >-
              There is no single defensible TAM for Celonis. The closest analogue is the "process analytics" category
              that MarketsAndMarkets sized at USD 185.3 million in 2018 and projected to USD 1,421.7 million by 2023 at
              a 50.3% CAGR — a forecast that is now stale and well below current process-mining vendor revenue
              concentrations. More recent publishers (Grand View Research, IMARC, Fortune Business Insights, Precedence
              Research) publish process-mining software market reports, but most live behind paywalls or
              category-redirect pages on the public web, so absolute headline numbers are not independently verifiable
              in this run and are preserved here as evidence gaps. The outer envelope is IDC's 2025 FutureScape
              projection of USD 337 billion in worldwide AI-supporting technology spend rising past USD 749 billion by
              2028, which Celonis itself cites as the tailwind for Enterprise AI orchestration but which clearly
              overstates Celonis-specific revenue pool. The narrowest lens is Celonis's own self-reported USD 6.5
              billion in cumulative customer value to date — an output proxy, not a market size. IDC's own analyst
              Maureen Fleming and Forrester guests on Celonis-hosted content confirm process intelligence is becoming
              "foundational" for scaling agentic AI, while a 2023 Celonis-cited IDC outlook reframed process mining as
              "business value engineering." Each estimate uses a different boundary; collapsing them into one figure
              would mislead underwriting.
