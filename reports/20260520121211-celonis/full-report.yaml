      - number: '1.2'
        title: Founders, leadership bench, and governance disclosure
        blocks:
          - type: paragraph
            body: >-
              The founder record is unusually clean for a private German software company. Wikipedia, Forbes, and an
              archived TU Munich School of Management profile all confirm that Celonis was founded in 2011 by Alex
              Rinke, Bastian Nominacher, and Martin Klenk as a spin-off from the Technical University of Munich, with
              the three meeting through a student consulting project for Bayerischer Rundfunk. Fifteen years later Rinke
              and Nominacher still run the company as co-CEOs and Klenk remains the named CTO, which means
              founder-market fit is intact and key-person dependence on the founding trio is structurally high. The
              executive bench around them has only recently thickened: Carsten Thoma, a Hybris co-founder and former SAP
              CX global president, was appointed President in August 2023, and Benoit Fouilland, formerly CFO of Criteo,
              Contentsquare, Firmenich, and Business Objects, became CFO on 1 December 2024 after a publicly unfilled
              CFO seat. Public board and committee disclosure remains thin, so governance depth beyond the founders, the
              President, and the CFO should be treated as a real diligence gap rather than silently papered over.
