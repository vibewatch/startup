            body: >-
              The Company Overview chapter walks the round-by-round chronology; this section instead reframes the same
              facts through a capital-stack and adequacy lens. Publicly reported total raised diverges meaningfully
              across authoritative sources: PitchBook's February 2025 profile lists $1.37B raised, Forbes's company
              profile says "more than $1.6 billion," and Wikipedia's March 2026 article cites "approximately $1.77
              billion." The most likely explanation is that PitchBook excludes the ServiceNow strategic investment,
              certain secondaries, and an undisclosed January 2024 "Later Stage VC" deal whose amount is not public. The
              last formal valuation mark is the August 2022 $13B Series-D extension led by Qatar Investment Authority,
              which followed the June 2021 $11B Series D that made Celonis Germany's first decacorn — meaning Celonis
              has not raised at a fresh valuation in nearly four years, a long mark-life by late-stage software
              standards. There is no public cash balance, no monthly burn figure, and no runway disclosure, so capital
              adequacy must be inferred. Positive signals include the CFO hire framed around growth discipline, ongoing
              acquisitions (Make/Integromat, Lenses, PAF, Symbio, Sailfin, and the pending Ikigai Labs deal) which imply
              available capital, and the No. 3 ranking on the 2025 Fortune Future 50. Negative signals include no public
              up-round since 2022, persistent IPO rumours that have repeatedly slipped, the broader 2023
              enterprise-software layoff wave that hit ~140 Celonis roles, and the SAP antitrust lawsuit filed by
              Celonis in March 2025 which converts the company's largest historical distribution channel into an active
