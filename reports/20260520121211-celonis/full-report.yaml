  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base composition, count contradictions, and visible buyer map
        blocks:
          - type: paragraph
            body: >-
              Celonis sells almost exclusively to large enterprises, and the public buyer map skews heavily to the
              Global 2000 across manufacturing, automotive, consumer goods, life sciences, financial services, telecom,
              logistics, energy, public sector, and pharma. The company's own About Us page says "more than 1,400
              companies" use Celonis, while the Forbes Cloud 100 profile lists 1,500 customers and the company
              separately references "5,000+ deployments" — a different metric that almost certainly counts modules, use
              cases, or business-unit instances rather than logos. None of these numbers can be reconciled externally
              because Celonis has never published a full customer list, a region split, a vertical split, or a
              revenue-band breakdown. The /customers/ URL on celonis.com redirects to a curated /solutions/stories
              carousel that surfaces only a few dozen logos at a time. Geographically the disclosed reference set leans
              European DACH and US large-cap, with selective Asia-Pacific (Fujitsu) and African (Standard Bank)
              exposure, matching the Munich/New York co-headquartered GTM footprint and the SAP/Microsoft/IBM partner
              channels documented in chapter 5. Buyers cluster in CFO/finance, COO/operations, CIO/CTO, CPO/procurement,
              and supply-chain functions; the user surface is then process-engineering and analyst teams, with
              business-process owners as the indirect beneficiaries. The payer is almost always a central transformation
              or shared-services budget, which is why most public references describe enterprise-wide rollouts (BMW,
              Novartis, PepsiCo) rather than department-only pilots.
