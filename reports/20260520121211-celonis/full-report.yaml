        title: Revenue model, monetization surfaces, and what is publicly observable about traction
        blocks:
          - type: paragraph
            body: >-
              Celonis monetizes a single integrated platform — the Celonis Platform built around the Data Core, the new
              Celonis Context Model, and Build experiences — sold to large enterprises as a process-intelligence and
              Enterprise AI subscription. The company itself states that "more than 1,400 companies" use Celonis, while
              the Forbes company profile cites 1,500 customers and the company's about page references 5,000+ enterprise
              deployments as a separate metric, so even the simplest top-of-funnel number is reported three different
              ways depending on the publisher. No list pricing is published on the company's own surfaces; in contrast
              to public-cloud comparators such as UiPath, Pegasystems and Appian (all SEC registrants), Celonis treats
              pricing as a sales-led, contract-by-contract conversation. That means every revenue, ARR, gross margin,
              take-rate, average contract value, and discount-band figure for Celonis is private, and any chapter that
              pretends otherwise is over-fitting. What the public record does support is a multi-stream revenue surface:
              core process-mining and process-intelligence subscriptions, add-on Enterprise AI capabilities including
              the new Celonis Context Model and AgentC, ecosystem integrations with SAP, ServiceNow, Microsoft, IBM
              watsonx and Databricks that are revenue-relevant via co-sell, and a small services and partner-led
              implementation layer. Customer-disclosed value (e.g., GE Healthcare's $1.3B free cash-flow lift) is
              marketing proof, not Celonis revenue.
