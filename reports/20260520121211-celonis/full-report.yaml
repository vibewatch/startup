        title: Cost structure, margin drivers, and what public comparables imply for Celonis
        blocks:
          - type: paragraph
            body: >-
              With no audited financials, the only honest cost-structure read is via mechanism and comparable filings.
              Celonis's cost base is dominated by R&D and field sales for a Munich/New York dual-HQ organisation of
              roughly 3,000–3,353 people, plus hyperscaler infrastructure consumed when Celonis runs the Data Core and
              Context Model on AWS, Databricks and Microsoft Fabric. The December 2024 appointment of Benoit Fouilland —
              formerly CFO at Criteo (which he took public on Nasdaq), Contentsquare, Firmenich and SAP AG — was
              explicitly framed by the company as a move to "drive the next phase of growth," widely read as
              IPO-preparation discipline. Public software comparables suggest a realistic envelope: Pegasystems trades
              as a profitable mid-cap enterprise software company whose financial summary is publicly disclosed via the
              SEC, Appian files 10-Ks that show how a low-code enterprise platform reports gross margin and operating
              losses, and UiPath has documented consumption-vs-subscription pricing pressure since its 2021 IPO. None of
              those filings substitute for Celonis data, but they bound the question: a process-intelligence platform
              with Celonis's customer concentration should be capable of 70–80%+ software gross margin if delivery is
              genuinely software, and materially lower if the partner-services tail is large. The Ikigai Labs
              acquisition (announced 2026-05-12) adds R&D headcount and MIT-licensed patents — a capability buy, not a
              revenue-accretive deal — which suggests Celonis is still investing ahead of the curve rather than
              harvesting margin.
