      - number: '1.3'
        title: Capital formation, investor map, and the unresolved 2024 round
        blocks:
          - type: paragraph
            body: >-
              Celonis's capital formation is well documented through 2022 and progressively murkier afterwards.
              TechCrunch and Reuters reporting confirms a $27.5 million Series A led by Accel and 83North in June 2016,
              followed by a $50 million Series B at a $1 billion valuation in June 2018 that made Celonis Germany's
              first software unicorn, and a $290 million Series C at $2.5 billion in November 2019. Forbes documents the
              June 2021 $1 billion Series D at $11 billion (NZZ called Celonis the country's first decacorn), and
              Bloomberg confirms the August 2022 Qatar Investment Authority-led Series D extension that fixed the most
              recent formal valuation at $13 billion. After that the public record thins: PitchBook lists a January 2024
              Later Stage VC round with no disclosed amount, investors, or valuation, and the three main public
              databases now report meaningfully different lifetime totals - PitchBook $1.37 billion, Forbes "more than
              $1.6 billion," and Wikipedia approximately $1.77 billion. That spread and the unmarked 2024 round leave
              both ownership percentages and the question of any 2024-2026 down-round exposure unresolved without access
              to the cap table.
