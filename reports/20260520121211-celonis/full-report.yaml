    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      Decision chain from Celonis category leadership, last formal mark, public-comp reset, and IPO timing to the final
      recommendation.
    data:
      nodes:
        - id: n1
          label: Category leadership
          description: 2026 Gartner MQ leader, 1,400+ enterprise customers, AI-agent narrative refreshed in 2026.
        - id: n2
          label: Last formal mark
          description: 2022 $13B QIA-led round; no public refresh since then, no audited financials.
        - id: n3
          label: Public-comp reset
          description: Pegasystems / Appian / UiPath at 4–6x revenue; Snowflake / Datadog at 14–17x.
        - id: n4
          label: IPO timing
          description: Reuters Sep-2025 and The Information Dec-2025 chatter offset by Bloomberg Jun-2025 on-hold note.
        - id: n5
          label: Recommendation = track
          description: Asset quality is high but margin of safety at $13B is thin without audited disclosure.
      edges:
        - from: n1
          to: n5
        - from: n2
          to: n5
        - from: n3
          to: n5
