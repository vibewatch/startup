    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and current product positioning
        blocks:
          - type: paragraph
            body: >-
              Celonis describes itself in 2026 as the global leader in Process Intelligence and frames its homepage
              around the claim that "more than 1,400 companies around the world use Celonis to analyze, design, and
              operate AI-driven processes." The about page formalises the corporate identity with a dual-headquarter
              setup in Munich, Germany and New York City, USA, and reports a footprint of more than 20 offices worldwide
              alongside 3,000-plus employees and a self-reported aggregate of $6.5 billion of realised customer value.
              The product positioning is built around the Celonis Platform and its newly launched Celonis Context Model,
              which Celonis calls a dynamic, system-agnostic, real-time representation of a customer's entire business;
              this is the lens through which the company now sells Enterprise AI rather than process mining alone. The
              reusable identity for the rest of the report is therefore a Munich/New York-based, privately held process
              intelligence and enterprise-AI platform vendor, with explicit dependence on its own Context Model
              narrative and on a large installed base of SAP-anchored enterprise customers.
