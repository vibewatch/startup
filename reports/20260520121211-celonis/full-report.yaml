  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory risk is anchored by the SAP antitrust lawsuit and live EU AI Act exposure
        blocks:
          - type: paragraph
            body: >-
              Celonis's most material legal exposure as of May 2026 is the antitrust complaint it filed against SAP in
              the US District Court for the Northern District of California on 4 March 2025, alleging that SAP
              weaponised its ERP-data position — specifically through RISE with SAP and Grow with SAP migration
              packaging — to choke off third-party access to the customer data Celonis needs to operate. Bloomberg Law's
              antitrust desk, The Information, and Bloomberg Law's IP desk all reported that the case is now in active
              discovery, and a parallel Celonis patent suit against SAP escalates the legal posture from commercial
              dispute to multi-front litigation against its single largest historical distribution partner.
              CourtListener returns 98 hits on "celonis" across US federal dockets, indicating that the SAP matter is
              not the only active proceeding. Beyond US litigation, the EU AI Act entered force on 1 August 2024 with
              phased obligations: penalty and general-purpose-AI duties from 2 August 2025, the bulk of high-risk
              obligations from 2 August 2026, and full applicability by 2 August 2027. Because the October-2024 AgentC
              launch and the May-2026 Celonis Context Model are explicitly positioned as the substrate for enterprise AI
              agents acting on customer ERP data, Celonis is plausibly both a provider of AI systems and a deployer for
              customers in regulated verticals (banks, insurers, healthcare, automotive), which puts it inside the
              documentation, training-data-disclosure, and risk-management duties the Act imposes on GPAI and high-risk
              uses. German federal financial supervisor BaFin and the EDPB-aligned national DPAs will separately
              scrutinise data-access and AI-governance arrangements that Celonis ships into banks and insurers. These
              are not theoretical filings — they convert directly into contract friction, slower regulated-vertical GTM,
              and reserve-and-disclosure questions an IPO prospectus would need to answer.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
