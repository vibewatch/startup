  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      SAP litigation, EU AI Act exposure, layoffs, and valuation gap all transmit through a small set of nodes — data
      access, AgentC execution, talent, and trust — into revenue durability and IPO support.
    data:
      nodes:
        - id: sap_legal
          label: SAP antitrust + patent litigation
          detail: Celonis v SAP US suits; active discovery as of 2026.
          tone: negative
        - id: ai_act
          label: EU AI Act phased duties
          detail: GPAI obligations live 2025-08-02; high-risk obligations live 2026-08-02.
          tone: warning
        - id: layoffs
          label: 2023 + 2024 layoffs
          detail: ~10% cut mid-2023; reported Feb-2024 follow-on.
          tone: warning
        - id: data_access
          label: SAP ERP data access
          detail: RISE / Grow with SAP gatekeeping for installed base.
          tone: negative
        - id: agentc
          label: AgentC / CCM execution
          detail: Enterprise-AI substrate launched 2024-2026.
          tone: warning
        - id: talent
          label: Talent and morale
          detail: AI / product / sales capacity for AgentC and CCM rollout.
          tone: warning
        - id: trust
          label: Customer trust
          detail: Willingness to expand on Celonis vs hedge with Signavio / Microsoft.
          tone: warning
        - id: revenue
          label: Revenue durability
          detail: Net retention, expansion, and renewal across SAP-anchored cohort.
          tone: negative
        - id: ipo
          label: IPO support and valuation
          detail: Whether $13B 2022 mark is defensible at next priced event.
          tone: negative
      edges:
        - from: sap_legal
          to: data_access
        - from: data_access
          to: trust
        - from: data_access
          to: revenue
        - from: ai_act
          to: agentc
        - from: agentc
          to: trust
        - from: layoffs
          to: talent
        - from: talent
          to: agentc
        - from: trust
          to: revenue
        - from: revenue
          to: ipo
        - from: sap_legal
          to: ipo
    approximationNotes: Qualitative transmission graph; shows channels, not a quantified probability model.
    claimRefs:
      - CR001
      - CR010
      - CR012
      - CR014
      - CR027
      - CR028
      - CR031
      - CR033
      - CR037
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      Celonis sits on a dense partner / supplier graph; the critical concentration nodes are SAP (data and channel),
      hyperscalers (hosting + GTM), Big-4/GSIs (delivery), and frontier-model providers (AgentC).
    data:
      nodes:
        - id: core
          label: Celonis core platform
          detail: Process Intelligence Graph, OCPM, CCM, AgentC, Make, PAF, Symbio, Ikigai.
          tone: positive
        - id: sap
          label: SAP (ERP + Signavio)
          detail: Source of ERP data and direct process-mining competitor (now legal adversary).
          tone: negative
        - id: msft
          label: Microsoft / Azure / Power Platform
          detail: Hyperscaler hosting, co-sell, and Power Automate Process Mining competitor.
          tone: warning
        - id: aws
          label: AWS
          detail: Hosting, AWS Marketplace SKU, AgentC co-engineering.
          tone: warning
        - id: ibm
          label: IBM (watsonx + Consulting)
          detail: Strategic partnership, plus IBM Process Mining competitor.
          tone: warning
        - id: snow_now
          label: ServiceNow + KPMG (IRM bundle)
          detail: Three-way Connected Integrated Risk Management partnership.
          tone: neutral
        - id: gsi
          label: Big-4 / GSI bench
          detail: Accenture, KPMG, EY, Deloitte, IBM Consulting deliver enterprise rollouts.
          tone: neutral
        - id: llm
          label: Frontier-model providers
          detail: OpenAI / Anthropic / hyperscaler LLMs powering AgentC reasoning.
          tone: warning
        - id: cust
          label: Enterprise customers (SAP-running cohort)
          detail: 1,400–1,500 logos; concentration profile undisclosed.
          tone: warning
      edges:
        - from: sap
          to: core
        - from: sap
          to: cust
        - from: msft
          to: core
        - from: aws
          to: core
        - from: ibm
          to: core
        - from: snow_now
          to: cust
        - from: gsi
          to: cust
        - from: llm
          to: core
        - from: core
          to: cust
    approximationNotes: Dependency graph highlights critical nodes; not a complete ecosystem map.
