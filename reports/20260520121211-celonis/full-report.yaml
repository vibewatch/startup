        title: Expansion logic, partner channels, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The land-and-expand pattern visible in Celonis case studies is consistent: a single procure-to-pay or
              order-to-cash pilot in finance or shared services, followed by horizontal expansion into supply chain, IT,
              HR, audit, and customer service, then anchored by a customer-built Center of Excellence (BMW, Novartis,
              Standard Bank all match this arc). Partner channels — SAP (since 2015), ServiceNow, Microsoft, IBM
              Consulting + watsonx, AWS, Accenture, KPMG, EY — extend distribution and procurement surface; many large
              references (BMW, Uniper, Carrefour, Novartis) were originally co-sold or co-implemented. Concentration
              risk is harder to read: with no top-10 ARR disclosure, no segment mix, and a heavy DACH/Fortune 500
              reference skew, it is plausible that a small number of platform accounts represent an outsized share of
              revenue. The SAP relationship has become structurally ambiguous following Celonis's March 2025 US
              antitrust lawsuit against SAP (covered in chapter 7), which simultaneously threatens a long-standing
              customer-access channel and potentially exposes shared accounts to SAP-Signavio replacement pressure. The
              customer-side risk is therefore not a logo-quality problem but a channel-dependence and
              concentration-disclosure problem that only private diligence can close.
