  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Directional valuation outcomes as Celonis moves between workflow-comp and AI-premium multiple regimes.
    data:
      items:
        - label: 5x on $700M
          value: 3.5
          description: Bear if Celonis rerates to Appian / UiPath-style workflow comps.
        - label: 8x on $700M
          value: 5.6
          description: Conservative base using legacy workflow multiples without AI premium.
        - label: 12x on $850M
          value: 10.2
          description: Mid-band blend of workflow and data-infra peers at modest ARR growth.
        - label: 16x on $1.0B
          value: 16
          description: Bull case if Celonis preserves a Datadog-style premium through an IPO window.
        - label: 18x on $1.2B
          value: 21.6
          description: Stretch bull if AI-agent narrative re-rates Celonis to ServiceNow-style multiples.
    approximationNotes: >-
      Values are estimated USD billions using Sacra's $700M ARR estimate plus scenario ARR-growth assumptions; they are
      not enterprise-value calculations.
