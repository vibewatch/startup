        - label: SAP Signavio competitive bundling
          values:
            - label: high
              tone: negative
              detail: Signavio sits inside RISE/Grow contracting motion.
            - label: high
              tone: negative
              detail: Direct substitution risk in SAP-anchored accounts.
            - label: medium
              tone: warning
              detail: Gartner Leader positioning and AgentC differentiation.
            - label: high
              tone: negative
              detail: Bundle economics are SAP's lever, not Celonis's.
        - label: Valuation / IPO timing
          values:
            - label: medium-high
              tone: warning
              detail: No public up-round since Aug-2022; reported 2026 IPO on hold per Bloomberg.
            - label: high
              tone: negative
              detail: Down-round or delayed IPO compresses entry-price support.
            - label: medium
              tone: warning
              detail: New CFO, President, $1B cash from 2022 raise.
            - label: high
              tone: negative
              detail: Until a fresh priced event clears, mark is stale.
        - label: EU AI Act applicability
          values:
            - label: high
              tone: warning
              detail: Phased duties already live since 2025-08-02 for GPAI.
            - label: medium-high
              tone: warning
              detail: AgentC / CCM could fall into provider or high-risk categories.
            - label: low-medium
              tone: warning
              detail: No public AI Act applicability mapping retrieved.
            - label: medium-high
              tone: warning
              detail: Compliance load and EU GTM friction likely rise.
        - label: Layoffs / talent morale
          values:
            - label: medium
              tone: warning
              detail: Two rounds 2023 + 2024; coverage from Sifted, Handelsblatt, BigTechWire.
            - label: medium-high
              tone: warning
              detail: Hits AgentC / CCM execution capacity.
            - label: medium
              tone: warning
              detail: Severance, new President, controlled comms.
            - label: medium-high
              tone: warning
              detail: A third round would meaningfully reset the IPO narrative.
        - label: Customer concentration (undisclosed)
          values:
            - label: medium
              tone: warning
              detail: 1,400–1,500 logos; SAP-running overlap not disclosed.
            - label: high
              tone: negative
              detail: A whale or top-cohort migration to Signavio would be visible only after the fact.
            - label: low
              tone: negative
              detail: No public top-customer disclosure; G2 / TrustRadius are sentiment, not cohort.
            - label: high
              tone: negative
              detail: Cannot rule out top-customer / SAP-overlap risk from public data.
