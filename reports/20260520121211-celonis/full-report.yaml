            body: >-
              The durable moats are the Process Intelligence Graph and Celonis Context Model as a semantic abstraction
              layer, AgentC for agent enablement, the AppStore/Marketplace of 1,000+ accelerators and apps, the customer
              reference base, and analyst placement (Gartner Leader in Process Intelligence Platforms 2026; Everest
              Group Leader and Star Performer for the fifth consecutive year). The most material adverse signal is the
              antitrust lawsuit Celonis filed against SAP in March 2025, which alleges SAP is leveraging its ERP
              dominance to lock Celonis out of native SAP data access — a complaint that, by definition, concedes SAP
              can constrain Celonis distribution regardless of product quality. Hyperscaler bundling is a second
              material vector: Microsoft pulling process mining into Power Automate, and IBM pulling it into watsonx
              Orchestrate, both lower the price umbrella under which Celonis must justify a separate platform contract.
              Open-source Apromore and the IEEE Task Force on Process Mining (which standardized the XES event-log
              format) reduce vendor lock-in at the data-format layer. The offsetting structural lock-in is integration
              depth and customer-specific data models: once a customer has built hundreds of object-centric process
              models and AgentC agents inside Celonis, ripping them out has real switching cost even if the underlying
              mining algorithms commoditize.
