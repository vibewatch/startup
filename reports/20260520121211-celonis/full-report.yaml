  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape — direct, incumbent, adjacent, substitute, and status-quo paths
        blocks:
          - type: paragraph
            body: >-
              Celonis competes simultaneously in three overlapping arenas. The narrowest is dedicated process mining and
              process intelligence software, where the buyer is choosing between Celonis, SAP Signavio, IBM Process
              Mining, Microsoft Power Automate process mining, UiPath Process Mining, ABBYY Timeline, QPR
              ProcessAnalyzer, Software AG's ARIS, and the open-source Apromore stack. Gartner's published market
              definition frames this category as tooling that ingests event logs to discover, monitor, and improve
              operational processes. The second arena is bundled enterprise platforms: hyperscalers and incumbent
              application vendors fold process mining into broader Power Platform, watsonx, ServiceNow, or ERP suites
              and compete on bundle economics rather than mining depth. The third arena is status-quo substitutes —
              manual BPM, BI dashboards, custom event-log scripts, RPA-only point tools, and consulting-led six-sigma
              projects — which still absorb most enterprise process-improvement budget. The buyer can also build
              internally on cloud data platforms once event data is centralized, especially in firms that already pay
              for Databricks, Snowflake, or BigQuery. Substitution risk is therefore not just other process-mining
              vendors; it is the do-nothing path and the existing analytics stack.
