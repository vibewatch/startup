  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Celonis should be bounded outward from its monetization surfaces rather than from every dollar labeled
              Enterprise AI. The company sells a Process Intelligence Platform whose three layers — Data Core, Celonis
              Context Model, and a Build experience for analyze/design/operate workflows — are anchored on extracting
              event logs from ERP, CRM, supply chain, and ITSM systems, then exposing the resulting process graph to
              humans and AI agents. That means the most relevant direct spend pools are process mining and process
              intelligence software, the adjacent process-analytics and task-mining markets, AI-decision-intelligence
              tooling pulled in via the announced Ikigai Labs acquisition, and the operational orchestration spend now
              flowing through agent platforms like Microsoft Copilot Studio, IBM watsonx Orchestrate, Amazon Bedrock
              Agents, and CrewAI. The boundary should exclude pure RPA seat licenses, generic data-warehouse spend, and
              foundation-model inference that never touches a Celonis process graph. Status-quo substitutes that Celonis
              must displace include spreadsheet-based lean/Six-Sigma audits, custom BI dashboards over ERP extracts,
              embedded SAP Signavio process modeling, UiPath and Microsoft process-mining add-ons sold inside broader
              automation suites, and open-source Apromore deployments inside academic or cost-sensitive enterprises.
              Gartner formally defines process mining as a technique for analyzing operational processes based on event
              logs, and IBM and UiPath now sell competing products under that same definition. The practical implication
              is that Celonis is no longer the only category leader label; multiple Leader designations exist across
              Gartner Magic Quadrant and Everest Group PEAK Matrix in 2024–2026.
