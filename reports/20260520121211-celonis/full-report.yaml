        title: Adverse signals — review complaints and customer-quoted gaps
        blocks:
          - type: paragraph
            body: >-
              Adverse customer signals are real but bounded. The G2 review pool surfaces consistent friction on four
              points: (i) advanced features such as PQL and custom analyses have a steep learning curve; (ii)
              performance can lag on very large or complex datasets; (iii) industry-specific templates are still thin
              outside the most common verticals; and (iv) integration with smaller or custom-built tools requires
              technical expertise. The TrustRadius Novo Nordisk Associate Digital Director review makes a more pointed
              regulated-industry critique: "the platform's capabilities are evolving faster than we can validate them to
              our regulated processes, which limits how we are allowed to use Celonis," and requests a differentiated
              environment / mature Lifecycle Management model. Brocacef (a 501–1,000-employee Dutch pharma logistics
              firm) flags slow guidance on object/catalog modeling and an over-reliance on generic formula examples on
              the website. Independently, no public mass-churn event, no enterprise lawsuit from a customer, no large
              G2/TrustRadius rating collapse, and no publicly named failed deployment surfaced in 2024–2026 — the most
              material public adverse event of the period is Celonis's own action against SAP (a partner/competitor)
              rather than any customer revolt. The aggregate picture is a complex, expensive platform that requires
              sophisticated buyers but does not appear to be losing them.
