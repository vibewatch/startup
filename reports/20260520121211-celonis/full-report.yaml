        title: Milestone chronology and the SAP-adversary marker
        blocks:
          - type: paragraph
            body: >-
              The milestone record is rich enough that later chapters should not have to rediscover it. Celonis was
              founded in 2011, signed a reseller agreement with SAP in 2015, took its first institutional capital in
              2016, crossed unicorn status in 2018, reached decacorn status with the June 2021 $11 billion Series D, and
              locked in its $13 billion mark with the August 2022 QIA-led extension. The acquisition cadence has been
              steady: Make/Integromat (October 2020, "over $100 million"), Lenses.io (October 2021, undisclosed),
              Process Analytics Factory (March 2022), Symbio/Symbioworld (November 2023), and most recently the 12 May
              2026 agreement to acquire AI decision intelligence vendor Ikigai Labs alongside the launch of the Celonis
              Context Model. The single adverse marker that clearly belongs in the chronology is the breakdown of the
              SAP relationship: after SAP acquired direct competitor Signavio in early 2021, Celonis filed a US
              antitrust lawsuit against SAP in March 2025 alleging access restrictions to SAP system data, turning a
              long-time channel partner into an active legal adversary. That marker should carry into later risk work as
              a material structural risk to Celonis's SAP-anchored installed base, even though the primary docket URL
              was not captured in this run.
