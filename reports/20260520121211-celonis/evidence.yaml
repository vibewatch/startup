evidenceGaps:
  - type: missing-source
    severity: material
    topic: SAP US antitrust lawsuit primary source not captured.
    missingEvidence: >-
      Primary docket URL, complaint text, court jurisdiction, and case number for the March 2025 Celonis v. SAP US
      antitrust lawsuit were not captured in this research run.
    whyItMatters: >-
      The lawsuit converts Celonis's largest legacy channel partner into an active legal adversary; later risk and
      business-model chapters need primary documentation, not Wikipedia summary, to size exposure.
    diligencePath: >-
      Search PACER for "Celonis v. SAP" in 2025 filings; cross-reference Law360 and Reuters reporting; obtain the
      complaint and SAP's answer.
    relatedQuestionRefs:
      - QO023
  - type: missing-source
    severity: material
    topic: 2023 Celonis layoff scale and primary source.
    missingEvidence: >-
      No primary URL was captured for the reported 2023 layoff event (~140 employees); the figure is carried only via
      secondary discussion.
    whyItMatters: >-
      Headcount actions in 2023 affect the credibility of growth narratives and the trajectory toward the expected 2026
      IPO.
    diligencePath: >-
      Cross-check TechCrunch, The Information, Handelsblatt, and Layoffs.fyi entries for Celonis 2023; confirm date,
      scope, and affected functions.
    relatedQuestionRefs:
      - QO024
  - type: conflicting-data
    severity: material
    topic: Cap table and lifetime capital raised cannot be reconciled.
    missingEvidence: >-
      Public databases disagree on lifetime raised ($1.37B vs. $1.6B+ vs. $1.77B) and the January 2024 PitchBook Later
      Stage VC deal has no disclosed amount, investors, or valuation; no ownership percentages are public.
    whyItMatters: >-
      Without the cap table, a 2024-2026 down-round cannot be ruled out, ownership percentages cannot be sized, and
      liquidity preferences and control rights are unknowable.
    diligencePath: >-
      Request the current cap table, financing docs for Series A through D extension, the January 2024 deal terms, the
      ServiceNow investment size, and any side letters allocating board/observer rights.
    relatedQuestionRefs:
      - QO015
      - QO016
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: Board roster and governance disclosure beyond the founder/President/CFO triad.
    missingEvidence: >-
      Public Celonis pages do not list a complete board roster, committee structure, or investor nomination rights
      outside of the founder trio, President Thoma, and CFO Fouilland.
    whyItMatters: Later governance and risk chapters need to know whether oversight is founder-heavy, investor-heavy, or balanced.
    diligencePath: Request the current board deck, committee charters, observer list, and investor rights agreement.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: Milestone table is a partial public chronology, not a complete internal event log.
    missingEvidence: >-
      Public coverage is strong for financing, acquisitions, partnerships, leadership changes, and the live SAP lawsuit
      marker, but internal product, regional expansion, and workforce events remain undisclosed.
    whyItMatters: >-
      Later chapters reuse this chronology as ground truth; missing internal milestones could distort sequencing or
      causal narratives.
    diligencePath: >-
      Request an internal corporate timeline covering financings, product launches, major customer wins, leadership
      changes, layoffs, and material legal or regulatory events.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO004
  - id: GM001
