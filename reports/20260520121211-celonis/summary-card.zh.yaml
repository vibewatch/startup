  topStrengths:
    - >-
      品类定义级产品护城河 —— Celonis Context Model、Process Intelligence Graph 和 Object-Centric Process Mining
      已成为流程智能的参考架构，也越来越像企业 AI agent 的数据底座。
    - >-
      标杆客户群 —— 经验证案例覆盖 BMW、GE Healthcare、Deutsche Post DHL、Deutsche Telekom、Lufthansa Cargo、PepsiCo、Kraft Heinz、Lockheed
