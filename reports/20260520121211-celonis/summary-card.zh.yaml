    - >-
      分析师验证的领导地位 —— 连续五次入选 Everest Group PEAK Matrix 领导者、2024 Star Performer，并在 2026 年首份 Gartner Magic Quadrant for
      Process Intelligence（2026 年 5 月）中列为领导者。
    - >-
      深度合作伙伴与 AI 生态 —— ServiceNow 战略联盟，加上 AgentC 接入 Microsoft Copilot Studio、IBM watsonx Orchestrate、Amazon Bedrock
      Agents 和 CrewAI；咨询伙伴覆盖 Accenture、IBM Consulting、EY 和 KPMG。
  topRisks:
    - SAP 依赖与对抗 —— Celonis 正在美国对 SAP 进行反垄断诉讼（2025 年 3 月提起）和并行专利诉讼，同时 SAP Signavio 与 Celonis 直接竞争；结果将实质影响可防守 TAM 和续约经济性。
    - >-
      估值新鲜度缺口 —— 最后一次正式标记是 2022 年 8 月 QIA 领投的 $13B 轮；之后没有公开 up-round，2024 年 1 月 PitchBook later-stage VC 交易条款未披露，且 2022
      年以来 SaaS 倍数压缩，使公司若重组资本或 IPO，存在 down-round 或 markdown 的真实风险。
    - 私营公司不透明 —— Celonis 不披露经审计财务、ARR、NRR、毛利率或烧钱速度；累计融资在不同发布方之间为 $1.37B-$1.77B；2024 年 later-stage VC 交易后的股权结构表不公开。
    - Co-CEO 与关键人集中 —— Rinke 和 Nominacher 自创立以来共同领导；继任、分歧表决和 Martin Klenk 的 CTO 连续性均未公开披露，放大 IPO 过渡期执行风险。
    - >-
      宏观与品类风险 —— 2025-2026 年企业 IT 支出放缓、德国 IPO 市场降温、EU AI Act 对智能体工作负载的影响，以及 AI
      原生厂商（Microsoft、UiPath、ServiceNow、IBM）压缩流程智能价格溢价的风险。
  unresolvedGaps:
    - >-
      调和累计融资口径（PitchBook $1.37B、Forbes $1.6B+、Wikipedia 约 $1.77B），并取得 2024 年 1 月 1 日 PitchBook Later Stage VC
      交易的规模、领投方和估值。
    - 取得经审计或公司披露的 FY2024 与 FY2025 ARR、收入、毛利率、NRR、magic number 和自由现金流，用来锚定任何前瞻估值工作。
    - 调取 Celonis v. SAP 美国反垄断主诉状、并行专利诉状、SAP 答辩，以及任何初步裁定，以测算现实法律敞口和渠道经济性敞口。
    - >-
      确认截至 Q2 2026 的员工数，记录 2024-2026 年除已报道 2023 年约 140 人裁员之外的任何裁员，并调和 Celonis「1,400+」家公司、Forbes 1,500 家客户和官网「5,000+
      次部署」之间的客户口径。
    - 通过最新 N-CSR / N-PORT 文件核验 Fidelity / T. Rowe Price 共同基金对 Celonis 的当前标记，从而三角校验实时私募估值与 2022 年 $13B 参考价。
