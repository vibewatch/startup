callouts:
  - calloutType: risk
    title: SAP is both Celonis's deepest distribution channel and its named antitrust defendant
    body: >-
      Celonis filed an antitrust lawsuit against SAP in March 2025 alleging SAP is monopolizing the process-mining
      market and restricting native SAP data access. That single fact reframes Celonis's competitive position: the
      vendor with the deepest enterprise distribution to Celonis's largest customer cohort is now both a partner
      (legacy reseller) and a defendant. Any underwriting that treats SAP-bundled Signavio as a generic competitor
      under-prices the distribution risk.
    claimRefs:
      - CP011
      - CP032
      - CP037
  - calloutType: strength
    title: Analyst leadership and ecosystem assets are real, repeatable, and independently verified
    body: >-
      Celonis was named a Leader in the 2026 Gartner Magic Quadrant for Process Intelligence Platforms and has been an
      Everest PEAK Matrix Leader and Star Performer for five consecutive years. Combined with 1,400+ customers, the
      Marketplace, and the IBM/ServiceNow/Microsoft partner surfaces, this gives Celonis a defensible standalone story
      against bundled incumbents in shortlists where analyst placement is a gating criterion.
    claimRefs:
      - CP031
      - CP034
      - CP035
      - CP036
  - calloutType: insight
    title: Bundled hyperscalers and open-source Apromore compress pricing from opposite directions
    body: >-
      Microsoft Power Automate process mining, IBM Process Mining inside watsonx, and SAP Signavio inside the SAP
      suite all present process mining as a near-zero-incremental-cost feature of an existing contract. Open-source
      Apromore and the IEEE XES event-log standard attack from the other side, removing data-format lock-in. Celonis
      must therefore justify a standalone enterprise subscription against both a "free with your suite" pitch and a
      "free with your engineers" pitch.
    claimRefs:
      - CP013
      - CP014
      - CP015
      - CP020
      - CP021
      - CP039
