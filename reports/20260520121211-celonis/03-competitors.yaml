    figureRefs:
      - FP001
  - id: section-2
    title: Direct and incumbent profiles — SAP Signavio, Microsoft, IBM, UiPath, and the next tier
    body: >-
      SAP Signavio is the strongest direct competitor because SAP acquired Signavio in March 2021 for roughly 950
      million euros and now ships it as a native part of SAP's business transformation suite, with privileged access to
      SAP ERP data Celonis publicly says it is being denied. Microsoft has folded process mining into Power Automate
      and Power Platform with explicit Copilot integration, which gives Microsoft a bundled GTM into every Power
      Platform tenant. IBM Process Mining is positioned alongside watsonx Orchestrate and IBM Consulting, and is
      sometimes also sold jointly with Celonis through the IBM Consulting partnership, so IBM is simultaneously a
      partner and a competitor. UiPath Process Mining and Task Mining ride RPA budgets and are tuned for "discover then
      automate" handoffs. The dedicated specialist tier is led by ABBYY Timeline (process mining plus task mining),
      QPR ProcessAnalyzer (Finnish vendor, MCP-native, partnered with Snowflake), and Software AG's ARIS family (BPM
      first, process mining second). Open-source Apromore is the most plausible commoditization vector: it offers
      enterprise process mining with academic roots and is positioned as a vendor-neutral alternative for governance
      and sovereignty-sensitive buyers.
    claimRefs:
      - CP010
      - CP011
      - CP012
      - CP013
