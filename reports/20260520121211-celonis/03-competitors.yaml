company:
  name: Celonis
chapter:
  number: 3
  title: Competitors
  summary: >-
    Celonis is the public scale leader in process mining and process intelligence and was named a Leader in Gartner's
    2026 Magic Quadrant for Process Intelligence Platforms, but the competitive set is unusually crowded for a category
    Celonis helped create. The strongest direct threat is SAP Signavio, which now ships natively with SAP ERPs at the
    same time as Celonis is suing SAP for antitrust monopolization of process mining and ERP data access. Microsoft,
    IBM, UiPath, ABBYY, QPR, Software AG (ARIS) and the open-source Apromore project all attack adjacent slices of the
    same buyer with bundled, AI-led, or sovereignty pitches. The durable moats are AgentC, the Process Intelligence
    Graph, the Celonis Context Model, deep SAP/ServiceNow/Microsoft integrations, an 1,400+ customer reference base,
    and Gartner/Everest analyst placement. The most material competitive risks are SAP's distribution lock through
    Signavio, hyperscaler bundling (Microsoft Power Automate, IBM watsonx, AWS), open-source/sovereignty pressure, and
    pricing opacity that lets bundled incumbents undercut on apparent total cost of ownership.
sections:
  - id: section-1
    title: Competitive landscape — direct, incumbent, adjacent, substitute, and status-quo paths
    body: >-
      Celonis competes simultaneously in three overlapping arenas. The narrowest is dedicated process mining and
      process intelligence software, where the buyer is choosing between Celonis, SAP Signavio, IBM Process Mining,
      Microsoft Power Automate process mining, UiPath Process Mining, ABBYY Timeline, QPR ProcessAnalyzer, Software
      AG's ARIS, and the open-source Apromore stack. Gartner's published market definition frames this category as
      tooling that ingests event logs to discover, monitor, and improve operational processes. The second arena is
      bundled enterprise platforms: hyperscalers and incumbent application vendors fold process mining into broader
      Power Platform, watsonx, ServiceNow, or ERP suites and compete on bundle economics rather than mining depth. The
      third arena is status-quo substitutes — manual BPM, BI dashboards, custom event-log scripts, RPA-only point
      tools, and consulting-led six-sigma projects — which still absorb most enterprise process-improvement budget. The
      buyer can also build internally on cloud data platforms once event data is centralized, especially in firms that
      already pay for Databricks, Snowflake, or BigQuery. Substitution risk is therefore not just other process-mining
      vendors; it is the do-nothing path and the existing analytics stack.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP006
      - CP007
      - CP008
      - CP009
      - CP034
