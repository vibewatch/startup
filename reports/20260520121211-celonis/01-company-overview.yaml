callouts:
  - calloutType: strength
    title: Founder continuity plus a 2026-ready executive bench
    body: >-
      Fifteen years after founding, all three founders remain in the most senior operating roles (co-CEOs Rinke and
      Nominacher, CTO Klenk), and Celonis has added a Hybris co-founder as President and an IPO-experienced CFO inside
      the last 33 months. That combination is unusually durable for a private German software company at this scale and
      makes the company easy to anchor for later chapters.
    claimRefs:
      - CO002
      - CO010
      - CO015
      - CO016
  - calloutType: risk
    title: Long-time SAP channel is now an active legal adversary
    body: >-
      Celonis's installed base was built on top of SAP, with a 2015 reseller agreement that put the product inside
      SAP's go-to-market. After SAP acquired direct competitor Signavio in 2021, Celonis filed a US antitrust lawsuit
      against SAP in March 2025 over access restrictions, turning the most important channel into a courtroom counterpart
      and creating real disruption risk for the SAP-anchored installed base.
    claimRefs:
      - CO039
      - CO048
  - calloutType: insight
    title: 2026 IPO readiness signal is multi-modal, not just financing
    body: >-
      Celonis has been deliberately stacking IPO-readiness signals: a public-markets CFO hire in December 2024, a
      Fortune Future 50 No. 3 debut in 2025, a 2026 Gartner Magic Quadrant Leader designation in the new Process
      Intelligence category, the Context Model launch, and the Ikigai Labs acquisition all in the run-up to the
      widely-expected 2026 US listing.
    claimRefs:
      - CO016
      - CO028
      - CO037
      - CO042
  - calloutType: risk
    title: Cap-table and lifetime-raised numbers do not reconcile
    body: >-
      The three main public databases disagree on lifetime capital raised - PitchBook $1.37B, Forbes >$1.6B, Wikipedia
      ~$1.77B - and PitchBook's most recent recorded round (January 2024 Later Stage VC) has no disclosed amount,
      investors, or valuation. Without the cap table, a 2024-2026 down-round cannot be ruled out and ownership
      percentages cannot be sized.
    claimRefs:
      - CO026
      - CO027
