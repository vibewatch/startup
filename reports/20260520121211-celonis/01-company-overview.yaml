chapter:
  number: 1
  title: Company Overview
  summary: >-
    Celonis is a Munich- and New York-headquartered private process-intelligence platform company founded in 2011 by
    three TU Munich graduates and still run by a co-CEO pair (Alex Rinke and Bastian Nominacher) alongside CTO and
    co-founder Martin Klenk. The 2026 public record anchors the company at roughly 3,000-3,400 employees, more than
    1,400 named enterprise customers, and a last formal valuation of $13 billion from the QIA-led August 2022 Series D
    extension that has not been publicly re-marked since; lifetime capital raised sits in a contested $1.37-1.77 billion
    band depending on the database. Recent product, partnership, and M&A activity (AgentC in October 2024, the Celonis
    Context Model plus the Ikigai Labs acquisition agreement on 12 May 2026, the renewed BMW partnership, ServiceNow
    co-investment, and a 2026 Gartner Magic Quadrant Leader designation in the new Process Intelligence category) keeps
    Celonis visibly active ahead of a widely expected 2026 US IPO. The main company-overview diligence gaps are the
    unresolved SAP US antitrust lawsuit specifics, the 2023 layoff scale and primary source, and the cap-table
    reconciliation behind the conflicting total-raised figures.
sections:
  - id: section-1
    title: Identity, headquarters, and current product positioning
    body: >-
      Celonis describes itself in 2026 as the global leader in Process Intelligence and frames its homepage around the
      claim that "more than 1,400 companies around the world use Celonis to analyze, design, and operate AI-driven
      processes." The about page formalises the corporate identity with a dual-headquarter setup in Munich, Germany and
      New York City, USA, and reports a footprint of more than 20 offices worldwide alongside 3,000-plus employees and
      a self-reported aggregate of $6.5 billion of realised customer value. The product positioning is built around the
      Celonis Platform and its newly launched Celonis Context Model, which Celonis calls a dynamic, system-agnostic,
      real-time representation of a customer's entire business; this is the lens through which the company now sells
      Enterprise AI rather than process mining alone. The reusable identity for the rest of the report is therefore a
      Munich/New York-based, privately held process intelligence and enterprise-AI platform vendor, with explicit
      dependence on its own Context Model narrative and on a large installed base of SAP-anchored enterprise customers.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
    tableRefs:
      - TO001
    figureRefs:
      - FO002
  - id: section-2
    title: Founders, leadership bench, and governance disclosure
    body: >-
      The founder record is unusually clean for a private German software company. Wikipedia, Forbes, and an archived
      TU Munich School of Management profile all confirm that Celonis was founded in 2011 by Alex Rinke, Bastian
      Nominacher, and Martin Klenk as a spin-off from the Technical University of Munich, with the three meeting through
      a student consulting project for Bayerischer Rundfunk. Fifteen years later Rinke and Nominacher still run the
      company as co-CEOs and Klenk remains the named CTO, which means founder-market fit is intact and key-person
      dependence on the founding trio is structurally high. The executive bench around them has only recently
      thickened: Carsten Thoma, a Hybris co-founder and former SAP CX global president, was appointed President in
      August 2023, and Benoit Fouilland, formerly CFO of Criteo, Contentsquare, Firmenich, and Business Objects, became
      CFO on 1 December 2024 after a publicly unfilled CFO seat. Public board and committee disclosure remains thin, so
      governance depth beyond the founders, the President, and the CFO should be treated as a real diligence gap rather
      than silently papered over.
    claimRefs:
      - CO002
      - CO009
      - CO010
      - CO011
