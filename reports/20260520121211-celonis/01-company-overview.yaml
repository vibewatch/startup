  - id: section-4
    title: Scale signals, ecosystem reach, and analyst validation
    body: >-
      The strongest scale signals beyond valuation come from Celonis's customer roster, partner ecosystem, and analyst
      coverage rather than disclosed revenue, which the company does not publish. PitchBook's February 2025 snapshot
      records 3,353 total employees, and the about page now claims "3,000+" - both consistent with mid-thousands
      headcount and with a Fortune Future 50 No. 3 debut in 2025. Customer proof is dense: BMW Group has used Celonis
      for eight-plus years and has built a Process Mining Center of Excellence on the Process Intelligence Graph; the
      homepage and case-study library actively promote Fujitsu, Uniper, Standard Bank, PepsiCo, GE Healthcare, Deutsche
      Post DHL, Deutsche Telekom, Lufthansa Cargo, Carrefour, Lockheed Martin, Kraft Heinz, Uber, and Novartis. The
      partner side is equally dense: ServiceNow combines a strategic partnership with a direct equity investment, while
      IBM (watsonx and Consulting), Microsoft, AWS, Accenture, EY, and KPMG anchor the AgentC and Context Model
      rollout. Independent validation comes from Everest Group naming Celonis a Leader for the fifth consecutive year
      in 2024 and from Gartner's May 2026 Magic Quadrant Leader designation in the new Process Intelligence category.
    claimRefs:
