  topStrengths:
    - >-
      Category-defining product moat — Celonis Context Model, Process Intelligence Graph, and Object-Centric Process
      Mining are the reference architecture for Process Intelligence and are increasingly the data substrate for
      enterprise AI agents.
    - >-
      Marquee customer base — verified case studies span BMW, GE Healthcare, Deutsche Post DHL, Deutsche Telekom,
      Lufthansa Cargo, PepsiCo, Kraft Heinz, Lockheed Martin, Carrefour, Uber, Uniper, Fujitsu, Cosentino, Novartis,
      Standard Bank, and Siemens GBS, with quantified value claims (e.g., GE Healthcare $1.3B cash-flow uplift).
    - >-
      Analyst-validated leadership — Leader for five consecutive Everest Group PEAK Matrices, Star Performer 2024, and
      Leader in the inaugural 2026 Gartner Magic Quadrant for Process Intelligence (May 2026).
    - >-
      Deep partner and AI ecosystem — ServiceNow strategic alliance plus AgentC integrations with Microsoft Copilot
      Studio, IBM watsonx Orchestrate, Amazon Bedrock Agents, and CrewAI, with consulting partnerships across Accenture,
      IBM Consulting, EY, and KPMG.
  topRisks:
    - >-
      SAP dependency and adversary — Celonis is in active US antitrust litigation against SAP (filed March 2025) and a
      parallel patent suit, while SAP Signavio competes directly with Celonis; outcome materially affects defensible TAM
      and renewal economics.
    - >-
      Valuation freshness gap — the last formal mark is the August 2022 QIA-led $13B round; no public up-round since, a
      January 2024 PitchBook Later-Stage VC deal has undisclosed terms, and SaaS multiple compression since 2022 raises
      real risk of a down-round or markdown if the company recapitalises or IPOs.
    - >-
      Private-company opacity — Celonis publishes no audited financials, ARR, NRR, gross margin, or burn; total capital
      raised varies $1.37B-$1.77B across publishers; the cap table after the 2024 later-stage VC deal is not public.
    - >-
      Co-CEO and key-person concentration — Rinke and Nominacher have led together since founding; succession,
      tie-breaking, and CTO continuity around Martin Klenk are not publicly disclosed and amplify execution risk through
      an IPO transition.
    - >-
      Macro and category risk — slowing enterprise IT spend in 2025-2026, German IPO market chill, EU AI Act exposure on
      agentic workloads, and the risk that AI-native vendors (Microsoft, UiPath, ServiceNow, IBM) compress the Process
      Intelligence price premium.
  unresolvedGaps:
    - >-
      Reconcile total capital raised (PitchBook $1.37B vs Forbes $1.6B+ vs Wikipedia ~$1.77B) and obtain the 1 January
      2024 PitchBook Later Stage VC deal size, lead, and valuation.
    - >-
      Obtain audited or company-disclosed FY2024 and FY2025 ARR, revenue, gross margin, NRR, magic number, and free cash
      flow to anchor any forward valuation work.
    - >-
      Pull the primary Celonis v. SAP US antitrust complaint, the parallel patent complaint, SAP's answers, and any
      preliminary rulings to size the realistic legal and channel-economics exposure.
    - >-
      Confirm headcount as of Q2 2026, document any 2024-2026 layoffs beyond the reported 2023 ~140-person cut, and
      reconcile customer count between Celonis's "1,400+" companies, Forbes's 1,500, and the about page's "5,000+
      deployments" figure.
    - >-
      Verify current Fidelity/T. Rowe Price mutual-fund marks for Celonis through the most recent N-CSR / N-PORT filings
      to triangulate the live private mark versus the $13B 2022 reference.
