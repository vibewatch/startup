      - - EU AI Act applicability creep
        - EU / Member State implementing-act guidance on AgentC and CCM scope
        - AgentC / CCM categorised as GPAI provider or high-risk AI provider with no public mapping
        - Assume higher compliance load, slower EU expansion, additional product spend
      - - Gartner / Forrester downgrade
        - Annual Magic Quadrant and Wave releases
        - Loss of Leader quadrant or significant ranking slip
