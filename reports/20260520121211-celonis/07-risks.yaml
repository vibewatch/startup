      - - Valuation gap vs 2022 mark
        - Next priced round or IPO file
        - Down-round below $13B, or IPO priced below $13B, or further IPO postponement past 2027
        - Treat $13B carrying mark as stale; underwrite from comps not last round
      - - Layoffs continuation
