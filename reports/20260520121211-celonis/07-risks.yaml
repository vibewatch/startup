callouts:
  - calloutType: risk
    title: Primary underwriting issue — SAP is simultaneously the largest legal, channel, and competitive risk
    body: >-
      The March-2025 Celonis v SAP US antitrust suit, the parallel patent suit, SAP's 2021 acquisition of Signavio
      as a direct process-mining competitor, and SAP's RISE/Grow with SAP migration program collectively turn one
      counterparty into the source of the three largest risks in this chapter. Until the suit and the data-access
      question are resolved, structural exposure is unhedged.
    claimRefs:
      - CR001
      - CR012
      - CR014
      - CR016
  - calloutType: risk
    title: Valuation mark is stale and the 2026 IPO has reportedly been put on hold
    body: >-
      Celonis last printed a public up-round in August 2022 at $13B. Reuters reported a planned 2026 US IPO in
      September 2025, and Bloomberg reported in June 2025 that management told staff the IPO was on hold amid
      market volatility. Combined with two rounds of layoffs and undisclosed top-customer concentration, the
      carrying mark cannot be assumed without a fresh priced event.
    claimRefs:
      - CR027
      - CR028
      - CR031
      - CR033
      - CR034
  - calloutType: recommendation
    title: Monitorable thesis-break triggers
    body: >-
      Underwrite from monitorable triggers Celonis does not control: SAP-suit docket (PACER / CourtListener),
      BaFin / Bundeskartellamt registers, EU AI Act implementing-act guidance, layoffs.fyi / Sifted / Handelsblatt
      reporting, Gartner Magic Quadrant repositioning, and any public top-50 logo migration to SAP Signavio or
      Microsoft Power Automate Process Mining. A breach of any one trigger compresses the bull case independently.
    claimRefs:
      - CR001
      - CR010
      - CR027
      - CR028
      - CR037
      - CR040
  - calloutType: insight
    title: Mitigation exists but lives mostly in narrative
    body: >-
      Celonis has Gartner Leader 2026 status, a deep SI bench, a multi-hyperscaler footprint, a new President and
      CFO, $1B+ from the 2022 round, and visible flagship references (BMW, GE Healthcare, Deutsche Telekom,
      PepsiCo, Lufthansa Cargo, Standard Bank). These are real positives but they do not answer the specific
      legal, valuation, AI-Act, and concentration questions raised in this chapter.
    claimRefs:
      - CR010
      - CR023
      - CR025
      - CR029
      - CR030
