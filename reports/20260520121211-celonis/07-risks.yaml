company:
  name: Celonis
chapter:
  number: 7
  title: Risks
  summary: >-
    Celonis is a leader in a real and growing category, but its risk profile is unusually concentrated: a March 2025
    US antitrust lawsuit against SAP (filed by Celonis, alleging SAP throttled customer access to ERP data through
    its RISE/Grow with SAP migration program) turns a historic reseller partnership — through which a majority of
    Celonis's installed base still flows — into an active legal dispute and a structural distribution risk. On top of
    that sit a four-year valuation gap (no public up-round above the $13B Aug-2022 QIA mark), reporting that the
    expected 2026 US IPO has been pushed back amid market volatility, two confirmed rounds of layoffs (a ~10%
    workforce cut in mid-2023 and reported follow-on reductions in early 2024), a German co-CEO governance structure
    that has not been independently stress-tested, escalating competitive pressure from SAP Signavio / Microsoft
    Power Platform / UiPath Process Mining / IBM, phased EU AI Act obligations beginning 2 August 2025 that bite
    directly on the AgentC and Celonis Context Model launches, and an undisclosed customer-concentration profile
    against a 1,400–1,500 customer base where SAP-running enterprises are over-represented. Public mitigation is real
    (Gartner Leader 2026, deep partner bench, $1B+ cash from 2022, multi-year flagship references) but does not
    close the legal, distribution, valuation, or execution gaps.
sections:
  - id: S701
    title: Legal and regulatory risk is anchored by the SAP antitrust lawsuit and live EU AI Act exposure
    body: >-
      Celonis's most material legal exposure as of May 2026 is the antitrust complaint it filed against SAP in the
      US District Court for the Northern District of California on 4 March 2025, alleging that SAP weaponised its
      ERP-data position — specifically through RISE with SAP and Grow with SAP migration packaging — to choke off
      third-party access to the customer data Celonis needs to operate. Bloomberg Law's antitrust desk, The
      Information, and Bloomberg Law's IP desk all reported that the case is now in active discovery, and a parallel
      Celonis patent suit against SAP escalates the legal posture from commercial dispute to multi-front litigation
      against its single largest historical distribution partner. CourtListener returns 98 hits on "celonis" across
      US federal dockets, indicating that the SAP matter is not the only active proceeding. Beyond US litigation,
      the EU AI Act entered force on 1 August 2024 with phased obligations: penalty and general-purpose-AI duties
      from 2 August 2025, the bulk of high-risk obligations from 2 August 2026, and full applicability by 2 August
      2027. Because the October-2024 AgentC launch and the May-2026 Celonis Context Model are explicitly positioned
      as the substrate for enterprise AI agents acting on customer ERP data, Celonis is plausibly both a provider of
      AI systems and a deployer for customers in regulated verticals (banks, insurers, healthcare, automotive),
      which puts it inside the documentation, training-data-disclosure, and risk-management duties the Act imposes
      on GPAI and high-risk uses. German federal financial supervisor BaFin and the EDPB-aligned national DPAs will
      separately scrutinise data-access and AI-governance arrangements that Celonis ships into banks and insurers.
      These are not theoretical filings — they convert directly into contract friction, slower regulated-vertical
      GTM, and reserve-and-disclosure questions an IPO prospectus would need to answer.
