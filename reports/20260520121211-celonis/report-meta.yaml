companyProfile:
  summary: >-
    Celonis is the world's category-leading Process Intelligence vendor. Founded in 2011 as a Technical University
    of Munich (TUM) spin-off and operating as a co-CEO-led private German/American company headquartered in Munich
    and New York, it sells the Celonis Platform — anchored on the new Celonis Context Model (launched May 2026), the
    Process Intelligence Graph, the Data Core, AgentC AI-agent tooling, and the Celonis Marketplace — to large
    enterprises that use it to analyze, design, and operate AI-driven business processes. It was last formally
    valued at roughly $13B in an August 2022 Qatar Investment Authority-led Series D extension, employs more than
    3,000 people, publicly reports more than 1,400 customers, has been a Leader in successive Everest Group PEAK
    Matrices and was named a Leader in Gartner's first Magic Quadrant for Process Intelligence in May 2026, and is
    widely tracked as a 2026 IPO candidate even as it is in active US antitrust litigation against its largest
    historical channel partner SAP.
  foundedDate: '2011-01-01'
