  businessModel: >-
    Subscription enterprise software (multi-year SaaS contracts) sold direct and through a partner channel, with
    expansion revenue tied to additional processes, business units, and integrated AI use cases; growing partner-led
    marketplace and emerging AI-agent commerce.
  stage: Late-stage private (post Series D extension; 2026 IPO candidate)
