company:
  name: Celonis
chapter:
  number: 6
  title: Customers
  summary: >-
    Celonis has an unusually deep public customer surface for a private process-intelligence vendor: company-stated
    coverage of 1,400+ enterprises (Forbes counts 1,500 and the company also references 5,000+ deployments), dozens
    of named global references with quantified outcomes (BMW, GE Healthcare, Deutsche Telekom, PepsiCo, Standard
    Bank, Lufthansa Cargo, Kraft Heinz, Lockheed Martin, Carrefour, Uber, Novartis), and consistently positive
    third-party review scores (TrustRadius 9.5/10 on 252 reviews, G2 4.5/5 on 302 reviews). Public retention, NRR,
    GRR, top-customer concentration, churn, and contract-duration metrics are still entirely undisclosed, so the
    durability story rests on logo breadth, multi-year case-study renewals, and reviewer sentiment rather than
    audited cohort data — leaving customer quality directionally strong but not fully underwritten.
sections:
  - id: customer-base-composition
    title: Customer base composition, count contradictions, and visible buyer map
    body: >-
      Celonis sells almost exclusively to large enterprises, and the public buyer map skews heavily to the
      Global 2000 across manufacturing, automotive, consumer goods, life sciences, financial services, telecom,
      logistics, energy, public sector, and pharma. The company's own About Us page says "more than 1,400
      companies" use Celonis, while the Forbes Cloud 100 profile lists 1,500 customers and the company
      separately references "5,000+ deployments" — a different metric that almost certainly counts modules,
      use cases, or business-unit instances rather than logos. None of these numbers can be reconciled
      externally because Celonis has never published a full customer list, a region split, a vertical split,
      or a revenue-band breakdown. The /customers/ URL on celonis.com redirects to a curated /solutions/stories
      carousel that surfaces only a few dozen logos at a time. Geographically the disclosed reference set
      leans European DACH and US large-cap, with selective Asia-Pacific (Fujitsu) and African (Standard Bank)
      exposure, matching the Munich/New York co-headquartered GTM footprint and the SAP/Microsoft/IBM
      partner channels documented in chapter 5. Buyers cluster in CFO/finance, COO/operations,
      CIO/CTO, CPO/procurement, and supply-chain functions; the user surface is then process-engineering
      and analyst teams, with business-process owners as the indirect beneficiaries. The payer is almost
      always a central transformation or shared-services budget, which is why most public references describe
      enterprise-wide rollouts (BMW, Novartis, PepsiCo) rather than department-only pilots.
    claimRefs:
