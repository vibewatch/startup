  - id: TU005
    title: Expansion & concentration risk table
    columns:
      - Expansion driver
      - Concentration risk
      - Impact
      - Diligence path
    rows:
      - - Land-and-expand from one finance/SCM use case to enterprise CoE (BMW, Novartis, Standard Bank)
        - Top-account share undisclosed; flagship customers may concentrate ARR
        - Strong evidence of multi-year expansion offsetting unknown concentration
        - Request top-10 / top-25 ARR share, ARR per flagship, and consumption velocity by year.
      - - Partner channels — SAP, Microsoft, IBM, ServiceNow, AWS, Accenture, KPMG, EY
        - SAP relationship now adversarial (March 2025 antitrust suit); risk of channel reversal
        - Could compress economics or expose joint-customer access to SAP-Signavio replacement
        - Request direct-vs-partner sourced ARR mix, SAP-co-sold revenue at risk, marketplace bookings.
      - - DACH and Fortune 500 reference skew supports premium pricing
        - Geographic and revenue-band concentration; US growth still under-disclosed
        - Higher exposure if European macro/manufacturing slows or DACH IT budgets tighten
        - Request region split, NRR by region, and 2024–2026 US logo additions.
      - - Productized use cases (350+) on Celonis Marketplace boost expansion velocity
        - Use-case adoption per customer undisclosed; could mask shallow expansion
        - Stronger ACV growth if adoption broad; risk of plateau if adoption shallow
        - Request modules-per-customer distribution and incremental ACV from marketplace.
      - - Co-marketed flagship stories (BMW, PepsiCo, Standard Bank, Uniper-Microsoft, Novartis-Accenture)
        - Reference curation may overstate average deployment success; survivorship bias
        - Public proof is strong; failed-pilot disclosure is non-existent
        - Request 2023–2026 won/lost RFP data and reference customers that did not renew.
    notes: >-
      Expansion logic is well documented; concentration metrics are entirely undisclosed and SAP partner risk
      is now material following the March 2025 antitrust filing (carried into chapter 7 risks).
