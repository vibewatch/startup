  - id: retention-and-satisfaction
    title: Retention, satisfaction signals, and what is still missing
    body: >-
      Public retention proof for Celonis is qualitative, not quantitative. The company has never disclosed
      NRR, GRR, logo churn, contract length, ARR cohorts, or weighted average remaining duration; sell-side
      coverage in chapter 4 inherits the same opacity. What can be observed are review-site signals and
      multi-year customer continuity. TrustRadius rates Celonis 9.5 out of 10 across 252 reviews and shows
      best-in-class scores in process discovery (above 8.9 category average), process mining algorithms
      (above 8.8), and data connection (above 8.7). G2 shows 4.5 out of 5 across 302 reviews with a
      published time-to-implement of four months. FeaturedCustomers aggregates 194 Celonis customer
      references with 102 testimonials, 44 case studies, 48 customer videos, and a 4.7/5.0 rating based
      on 3,589 reference ratings. Multi-year continuity itself is evidence of renewal: Novartis has been
      live since 2018, BMW since 2016, and Lufthansa Cargo and Deutsche Telekom both feature in
      multi-vintage case studies. Recurring negative themes in the same review surfaces are also clear:
      a steep learning curve for PQL and advanced analyses, performance lag on very large datasets,
      integration complexity for non-standard systems, and — from a Novo Nordisk reviewer on TrustRadius —
      a request for a more mature Lifecycle Management model for regulated industries. None of this
      substitutes for audited GRR/NRR; an investor must request the underlying cohort and renewal data
      directly.
    claimRefs:
      - CU023
      - CU024
      - CU025
      - CU026
