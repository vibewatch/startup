  - id: named-customer-proof
    title: Named customer proof — outcomes, freshness, and depth of deployment
    body: >-
      The strongest public asset Celonis owns is a deep library of named customer references with quantified
      operating outcomes. BMW Group is the deepest reference: the March 2024 press release confirms a
      partnership that began in 2016, a dedicated BMW Process Mining Center of Excellence, and a Group-wide
      rollout aimed at making Celonis available to every employee — anchored by joint development on the
      Process Intelligence Graph. GE Healthcare publicly attributes a $1.3 billion free-cash-flow increase
      in a single year to its Celonis-led transformation. Deutsche Telekom reports 100% electronic POs,
      92% no-touch invoice processing, €12 million in savings, and a >96% on-time payment rate after
      automating procurement with Celonis. Kraft Heinz cites a 30% reduction in overdue payments using
      process mining. Lufthansa Cargo runs Object-Centric Process Mining over ~2 million Air Waybill
      records and >80 million activities a year, originally to optimize revenue accounting. PepsiCo
      reports "millions unlocked" in accounts receivable, an 86% reduction in rejected sales orders,
      and >1,000 hours/year saved in accounts payable. Standard Bank rebuilt its cross-border payments
      process with Celonis (and partner ProcessLab), pushing straight-through processing above 90% and
      cutting turnaround from up to 55 hours to "a handful." Lockheed Martin tied Celonis into its $4B
      "1LMX" multi-year process-transformation program. Carrefour, Uber, Uniper (with Microsoft), Cosentino,
      Fujitsu, Siemens GBS, Saint-Gobain, and Novartis (with Accenture, since 2018, across 15+ use cases)
      round out a reference set whose depth and 2024–2026 freshness compare favorably with any private
      enterprise SaaS vendor.
