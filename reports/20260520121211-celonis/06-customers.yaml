callouts:
  - calloutType: strength
    title: One of the deepest public customer rosters in private enterprise software
    body: >-
      Celonis publishes named, multi-year, outcome-attributed deployments at BMW, GE Healthcare, Deutsche
      Telekom, PepsiCo, Standard Bank, Lufthansa Cargo, Lockheed Martin, Kraft Heinz, Novartis, Carrefour,
      Uber, and Uniper. Combined with TrustRadius 9.5/10 across 252 reviews and G2 4.5/5 across 302 reviews,
      this is unusually deep customer-proof depth for a private software vendor of comparable scale.
    claimRefs:
      - CU011
      - CU012
      - CU013
      - CU014
      - CU017
      - CU019
      - CU024
      - CU025
  - calloutType: risk
    title: Zero disclosed NRR, GRR, churn, contract length, or top-customer concentration
    body: >-
      Despite the strong logo wall, Celonis discloses no NRR, no GRR, no logo churn, no contract length,
      no top-customer share, and no segment-level revenue. Durability proof rests entirely on multi-year
      case-study continuity and reviewer sentiment — meaning customer quality is directionally strong but
      not fully underwritten. Combined with the unresolved SAP partner reversal (chapter 7), an investor
      cannot underwrite renewal without private cohort and concentration data.
    claimRefs:
      - CU023
      - CU034
      - CU035
      - CU038
      - CU042
  - calloutType: insight
    title: Customer-count metrics are not interchangeable — 1,400 vs 1,500 vs 5,000+ measure different things
    body: >-
      The Celonis About Us "1,400+ companies," Forbes Cloud 100 "1,500," and company-cited "5,000+
      deployments" should not be averaged. The first two are logo counts (and differ by ~7%, within
      vendor-self-report tolerance); the 5,000+ figure almost certainly counts modules, use cases, or
      business-unit instances and is a different metric. Preserve all three when reporting scale.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU024
