  - id: TM001
    title: Market definition table
    columns:
      - segment/category
      - included spend
      - excluded spend
      - buyer/payer
      - relevance
    rows:
      - - Process mining and process intelligence software
        - >-
          Subscription license for event-log extraction, process discovery,
          conformance checking, KPI monitoring, and execution apps
        - Underlying ERP/CRM seat licenses and warehouse storage that already
          existed before process mining was added
        - CIO, transformation lead, process-excellence office, finance ops
        - Celonis core direct category
      - - Object-centric process mining (OCPM) and Context Model substrate
        - >-
          Premium spend for object-centric data models, the Celonis Context Model,
          and the new Process Intelligence Graph
        - Generic data-modeling tooling outside the process domain
        - CIO, Chief Data Officer, enterprise architecture
        - Differentiation surface where Celonis leads patent filings and product
          messaging
      - - Process analytics and task mining adjacencies
        - User-behavior task mining, desktop telemetry analytics, and process
          analytics tied back to event logs
        - Generic UX analytics, product analytics, or web analytics with no
          enterprise-process linkage
        - Operations, BPO, shared-services leaders
        - Natural expansion category that competitors attack from RPA suites
      - - AI agent orchestration and decision intelligence
        - >-
          Spend on agent platforms (AgentC, Copilot Studio, watsonx Orchestrate,
          Bedrock Agents, CrewAI) where Celonis Context Model is the operational
          memory; plus Ikigai Labs decision-intelligence tooling
        - Generic foundation-model API spend or generic ML platform spend
        - Chief AI Officer, CTO, head of automation
        - High-growth adjacency that Celonis now positions as its primary land motion
      - - Status-quo substitutes
        - >-
          Spreadsheet-based lean/Six-Sigma audits, custom BI dashboards over ERP
          extracts, embedded SAP Signavio, UiPath/Microsoft process-mining
          add-ons, open-source Apromore
        - Net-new AI agent spend that does not displace existing process-analysis
          tooling
        - Existing IT, transformation, and ops budget owners
        - Main source of displacement budget and the most-cited competitive risk
      - - Broad AI-supporting technology envelope
        - Worldwide AI-supporting software, infrastructure, and cloud renovation
          tracked by IDC FutureScape
        - Any assumption that all AI-supporting spend converts to Celonis revenue
        - CIO, CTO, transformation budget pools
        - Useful outer bound for demand context, but too broad to call Celonis SAM
    notes: >-
      The boundary starts from Celonis monetization surfaces and expands outward
      through adjacencies. Generic AI infrastructure spend and unrelated ERP/BI
      seat licenses remain context, not direct market size.
