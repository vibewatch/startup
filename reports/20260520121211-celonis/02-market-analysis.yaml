      a narrower process-intelligence category, a contested process-analytics
      baseline, and a company-specific output proxy that is not a market size.
    data:
      nodes:
        - label: 'Worldwide AI-supporting technology spend: USD 337B in 2025'
          detail: >-
            IDC outer envelope covering AI software, infrastructure, and cloud
            renovation; well beyond any Celonis-specific revenue pool.
          tone: neutral
        - label: 'Process intelligence + decision intelligence adjacencies: paywalled'
          detail: >-
            Grand View, IMARC, Fortune Business Insights, and Precedence publish
            process-mining software market reports but headline numbers are
            paywalled or routed; preserved as evidence gaps.
          tone: warning
        - label: 'Process analytics baseline: USD 1.42B by 2023 forecast (MarketsAndMarkets)'
          detail: >-
            Stale 2018-base forecast (50.3% CAGR) gives a narrow but verifiable
            anchor for the directly addressable software category.
          tone: positive
        - label: 'Celonis cumulative customer value: USD 6.5B (company-reported)'
          detail: >-
            Self-reported output proxy across thousands of processes; not a
            market measurement and not auditable from public filings.
          tone: warning
