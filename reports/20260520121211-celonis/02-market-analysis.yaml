  - id: FM004
    title: Adoption funnel
    type: funnel
    layout: wide
    summary: >-
      Celonis adoption typically begins with single-process discovery, expands
      through KPI monitoring and execution apps, and only converts to AI-agent
      orchestration after governance, data access, and partner integration
      gates are cleared.
    data:
      items:
        - id: s1
          label: Awareness — Process Intelligence category
          value: 100
          detail: >-
            Buyers reached via Gartner MQ Leader status, Everest Group PEAK
            Matrix coverage, Celosphere/Celonis:Next conferences, and consulting
            partner conversations.
          tone: neutral
        - id: s2
          label: Pilot — single process on Data Core
          value: 60
          detail: >-
            Free or paid PoC on one process (e.g. procure-to-pay) using event
            logs extracted from SAP/Oracle/ServiceNow.
          tone: positive
        - id: s3
          label: Land — first paid use case with execution apps
          value: 35
          detail: >-
            First contracted ARR; deployment via Accenture, IBM Consulting,
            KPMG, or EY.
          tone: positive
        - id: s4
          label: Expand — multi-process Center of Excellence
          value: 18
          detail: >-
            BMW-style internal Process Mining CoE; multi-LOB rollouts;
            Process Intelligence Graph adoption.
          tone: positive
        - id: s5
          label: Operate — AgentC + Context Model in production
          value: 8
          detail: >-
            AI agents in production using Celonis Context Model on
            Copilot Studio, watsonx Orchestrate, Bedrock, or CrewAI;
            gated by governance and SAP data-access resolution.
          tone: warning
