  evidenceGaps:
    - id: GM001
      description: >-
        Modern process-mining market-size headline numbers from Grand View
        Research, IMARC Group, Precedence Research, and Fortune Business
        Insights are paywalled, behind reader 404s, or routed to publisher
        home pages, so the absolute market-size figures cannot be
        independently verified in this run.
      relatedQuestionRefs:
        - QM024
        - QM005
      diligencePath: >-
        Purchase the Grand View Research, Precedence Research, and IMARC
        process mining software market reports; cross-check the headline
        global numbers and CAGR ranges against any analyst-day disclosures
        from Celonis pre-IPO.
    - id: GM002
      description: >-
        Celonis-specific revenue, AgentC ARR, and attach rate to Copilot
        Studio, watsonx Orchestrate, Bedrock Agents, and CrewAI are not
        publicly disclosed.
      relatedQuestionRefs:
        - QM024
        - QM025
      diligencePath: >-
        Request management disclosure of segmentation by product line
        (process mining, AgentC, Ikigai-derived decision intelligence) and
        attach rate to each named partner platform; cross-check against
        partner-side disclosures from Microsoft, IBM, AWS.
    - id: GM003
      description: >-
        The share of the Celonis platform connectivity that depends on
        SAP-owned event-log extractors — the central variable in the
        March 2025 antitrust lawsuit — is not publicly quantified.
      relatedQuestionRefs:
        - QM026
      diligencePath: >-
        Request the percentage of customer connections that route through
        SAP-controlled APIs, the percentage that use Celonis-built or
        third-party extractors, and the contingency roadmap if SAP API
        access is restricted.
