callouts:
  - calloutType: insight
    title: Celonis's useful market is process intelligence, not all of Enterprise AI
    body: >-
      The narrow public anchor is the process analytics / process mining
      category at roughly USD 1.4B by 2023 per MarketsAndMarkets, not the
      IDC USD 337B AI-supporting envelope. Underwriting should size Celonis
      against the narrower category plus AI-agent attach, with the broader
      envelope only as macro context.
    claimRefs:
      - CM012
      - CM013
      - CM014
      - CM016
      - CM017
  - calloutType: strength
    title: Multiple budget paths and a dense partner ecosystem
    body: >-
      Celonis can attack transformation, supply chain, finance, procurement,
      IT/ITSM, and AI/automation budgets, and routes through Accenture,
      IBM Consulting, EY, KPMG, ServiceNow, Microsoft, IBM watsonx, and
      AWS Bedrock. That diversifies revenue away from any single buyer or
      channel.
    claimRefs:
      - CM023
      - CM024
      - CM025
      - CM026
      - CM028
      - CM029
      - CM030
  - calloutType: risk
    title: SAP litigation and Magic Quadrant crowding cap pricing power
    body: >-
      The March 2025 antitrust lawsuit against SAP threatens the SAP event-log
      pipeline; the 2026 Gartner Magic Quadrant for Process Intelligence has
      multiple Leaders (IBM, UiPath, SAP/Signavio, Software AG/ARIS, Celonis),
      and Apromore (Salesforce-owned) adds open-source pressure — each of
      which can extend sales cycles and compress price.
    claimRefs:
      - CM008
      - CM009
      - CM010
      - CM011
      - CM033
      - CM036
      - CM037
