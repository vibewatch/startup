  - id: section-3
    title: Buyer segments, budget owners, and adoption path
    body: >-
      The Celonis buyer map is broader than a single IT-platform budget. Verified
      customer stories and partnership content show the platform landing first with
      transformation and process-excellence offices (BMW established a Process Mining
      Center of Excellence in central IT), then expanding into supply chain (Uniper,
      Lufthansa Cargo, Fujitsu), finance and shared services (GE Healthcare unlocked
      USD 1.3 billion in free cash flow, Deutsche Post DHL HR operations), procurement
      (Carrefour, Deutsche Telekom award-winning procurement transformation), and
      IT/ITSM through the ServiceNow partnership (Siemens GBS named as first mover).
      Budget owners therefore include the CIO, CFO, CPO, COO, and increasingly the
      Chief AI Officer or transformation lead funding agent rollouts via Microsoft
      Copilot Studio, IBM watsonx Orchestrate, or Amazon Bedrock Agents. The adoption
      path Celonis itself describes runs from ERP/CRM data extraction to process
      discovery, then to KPI monitoring and execution apps, then to AgentC-based
      automation, then to the new Celonis Context Model as the operational substrate
      for Enterprise AI. Consulting partners (Accenture, IBM Consulting, KPMG, EY)
      gate large enterprise rollouts; Celonis's own "1,400+ companies" homepage
      claim, "1,500 customers" Forbes figure, and "5,000+ deployments" about-page
      claim show the buyer count is contested and may overstate net new logo
      penetration in the global mid-market.
