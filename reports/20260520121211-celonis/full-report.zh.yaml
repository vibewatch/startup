      - number: '3.2'
        title: 直接与现有大厂画像——SAP Signavio、Microsoft、IBM、UiPath 及下一梯队
        blocks:
          - type: paragraph
            body: >-
              SAP Signavio 是最强直接竞争者，因为 SAP 2021 年 3 月以约 950 million euros 收购 Signavio，现在把它作为 SAP 业务转型套件原生组成部分发货，并拥有
              Celonis 公开称自己被拒绝的 SAP ERP 数据特权访问。Microsoft 已把流程挖掘折进 Power Automate 和 Power Platform，并明确集成 Copilot，这让
