            body: >-
              里程碑记录足够密，后续章节不必重新挖一遍。Celonis 创立于 2011 年，2015 年与 SAP 签署转售协议，2016 年拿到首笔机构资金，2018 年成为独角兽，2021 年 6 月 $11
              billion Series D 后进入十角兽阶段，并在 2022 年 8 月 QIA 领投的延展轮中锁定 $13 billion 估值。收购节奏稳定：Make / Integromat（2020 年 10
              月，“超过 $100 million”）、Lenses.io（2021 年 10 月，未披露）、Process Analytics Factory（2022 年 3 月）、Symbio /
              Symbioworld（2023 年 11 月），以及最近 2026 年 5 月 12 日在推出 Celonis Context Model 同时，宣布收购 AI 决策智能厂商 Ikigai
              Labs。唯一应明确写入时间线的反向标记，是 SAP 关系破裂：SAP 在 2021 年初收购直接竞争对手 Signavio 后，Celonis 于 2025 年 3 月在美国对 SAP
