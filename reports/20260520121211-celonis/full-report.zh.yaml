  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围：Celonis Platform 作为单一集成的流程智能与企业级 AI 界面
        blocks:
          - type: paragraph
            body: >-
              Celonis 销售单一平台——Celonis Platform——围绕 Data Core、2026 年 5 月 12 日推出的新 Celonis Context Model、Build
              体验（Studio、Apps、Action Flows、Marketplace），以及 2024 年 10 月 23 日在 Celosphere 首次推出的 AgentC
              智能体层搭建。客户看见的任务是以对象为中心的流程挖掘（OCPM）：连接企业系统（SAP、Oracle、ServiceNow、Salesforce、Workday、自定义数据库），跨对象和事件构建运营数字孪生，发现低效和价值漏损，然后借
              Action Flows 自动化，或越来越多地借使用同一 Context Model 的 AI 智能体来编排改变。公司平台页把这个界面描述为“把企业级 AI 工业化”，而不是独立流程挖掘工具；公开 docs
              站点（docs.celonis.com）确认，同一套 Data Core、PQL 查询语言和 PI Graph 元数据层支撑面向人的 Studio，也支撑面向智能体的 AgentC 与 CCM
              界面。Marketplace.celonis.com 托管伙伴构建的应用、连接器和行业包；公司还维护公开 GitHub 组织（github.com/celonis），docs 中引用 PyCelonis
              SDK，因此平台确实可被开发者访问，尽管没有发布自助价格。
