      - number: '3.3'
        title: 能力、定价与包装比较
        blocks:
          - type: paragraph
            body: >-
              公开能力比较并不完整，因为大多数竞争者发布的是营销页面，不是完整能力矩阵；但公共网络上已有足够信息比较锚点维度。Celonis 主打 Process Intelligence
              Graph、以对象为中心的流程挖掘（OCPM）、Celonis Context Model 和 AgentC，把它们包装成从原始事件数据连接到 AI 智能体的分层栈；Gartner
              领导者位置强化了这个广度主张。SAP Signavio 在 ERP 深度上相匹配，现在又把流程智能叠进 SAP Business Suite，但在以对象为中心的挖掘和 SAP 外多源覆盖上较弱。Microsoft
              和 UiPath 倚重自动化交接；ABBYY 和 QPR 倚重任务挖掘加 AI 根因分析；ARIS 倚重 BPM / 治理底蕴。主要竞争者都没有在官网发布标准化按用户或按事件定价，Celonis
              自己也不发布标价，因此全行业总拥有成本都不透明。定价不透明本身就是竞争向量：捆绑型竞争者（SAP、Microsoft、IBM）可以把流程挖掘包装成既有合同的零增量成本功能，而 Celonis
              必须证明单独企业订阅值得付费。客户可以多宿主流程挖掘（有些公司同时用 Celonis、面向 SAP 的 Signavio、面向 Power Platform 工作负载的
              Microsoft），但这只会小幅增加总切换成本，因为事件数据抽取才是主要集成工作。
