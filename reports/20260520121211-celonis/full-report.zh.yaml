      - number: '7.2'
        title: 运营、安全、伙伴集中与执行风险都通过 SAP 和 AI 推出传导
        blocks:
          - type: paragraph
            body: >-
              Celonis 的运营风险面主要由伙伴集中主导，而不是明显的宕机或泄露事件（本次运行无法从 Celonis 主站取回公开安全事件登记、 泄露通知或状态页——这本身就是尽调缺口）。最集中的依赖是
              SAP：Celonis 2012 年以 SAP Startup Focus 参与者起步， 2015 年签署全球转售协议（以「Celonis Process Mining by SAP」销售），并围绕运行 SAP
              ECC 和 S/4HANA 的客户建起安装基础。 SAP 自身拥有 Signavio（2021 年收购，明确定位为流程挖掘 / 流程建模竞争对手），再叠加 RISE/Grow with SAP
              数据访问争端，意味着这个曾经为 Celonis 提供来源和分销的单一交易对手，现在同时是活跃法律对手、强势竞争者，以及约一半安装基础底层 ERP 数据的守门人。SAP 之外，竞争压力层层叠加： Microsoft
              把 Power Automate Process Mining 捆进 Microsoft 365 / Power Platform 资产；UiPath 把 Process Mining 推入既有自动化版图；
              IBM 一边通过 watsonx 与 Celonis 合作，一边销售自己的流程挖掘产品；Appian 和 Pegasystems 则带着相邻的 low-code workflow 叙事。 AgentC / CCM
              推出又放大执行风险：Celonis 一边发布企业 AI 底座，一边要完成 Ikigai Labs 收购（2026 年 5 月 12 日宣布），并消化 PAF（2022）、
