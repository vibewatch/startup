              Celonis 最强的公开资产，是一套很深的具名客户参考库，并且附有量化运营结果。BMW Group 是最深的参考：2024 年 3 月新闻稿确认， 双方合作始于 2016 年，BMW 建有专门的 Process
              Mining Center of Excellence，且集团级铺开目标是让每位员工都能使用 Celonis； 这一合作还锚定在双方围绕 Process Intelligence Graph 的联合开发。GE
              Healthcare 公开将单年 $1.3 billion 自由现金流提升归因于 Celonis 主导的转型。Deutsche Telekom 在用 Celonis 自动化采购后，报告 100% 电子
              PO、92% 无接触发票处理、 €12 million 节省，以及超过 96% 的按时付款率。Kraft Heinz 称借助流程挖掘把逾期付款降低 30%。Lufthansa Cargo 在约 200 万条
              Air Waybill 记录和每年超过 8,000 万次活动上运行 Object-Centric Process Mining，最初目标是优化收入会计。 PepsiCo
              报告应收账款释放出「数百万」价值，拒绝销售订单减少 86%，应付账款每年节省超过 1,000 小时。Standard Bank 与 Celonis（及伙伴
