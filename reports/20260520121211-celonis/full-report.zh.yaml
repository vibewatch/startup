      - number: '1.2'
        title: 创始人、领导梯队与治理披露
        blocks:
          - type: paragraph
            body: >-
              Celonis 的创始人脉络非常清晰，这在德国私营软件公司中并不常见。Wikipedia、Forbes 和存档的 TU Munich School of Management 简介都确认，Celonis 由
              Alex Rinke、Bastian Nominacher、Martin Klenk 于 2011 年创立，是 Technical University of Munich 的孵化公司；三人是在为
              Bayerischer Rundfunk 做学生咨询项目时相识。十五年后，Rinke 和 Nominacher 仍以联席 CEO 身份运营公司，Klenk 仍是具名
              CTO，说明创始人—市场匹配仍在，但公司对创始三人组的关键人依赖也结构性偏高。围绕他们的高管梯队是最近才变厚：Hybris 联合创始人、前 SAP CX 全球总裁 Carsten Thoma 于 2023 年 8
              月出任 President；Benoit Fouilland 曾任 Criteo、Contentsquare、Firmenich 和 Business Objects CFO，在 CFO 职位公开空缺之后，于
              2024 年 12 月 1 日加入担任 CFO。公开董事会和委员会披露仍然很薄，因此创始人、President、CFO 之外的治理深度应被视作真实尽调缺口，不能被默默补齐。
