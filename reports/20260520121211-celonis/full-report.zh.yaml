              tone: negative
              detail: 无法用公开数据排除头部客户 / SAP 重叠风险。
    approximationNotes: 顺序评分有来源支撑但仍属定性；热力图排序的是剩余敞口，不是在断言合成概率。
    claimRefs:
      - CR001
      - CR010
      - CR012
      - CR014
      - CR026
      - CR027
      - CR028
      - CR031
      - CR033
      - CR034
      - CR037
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: SAP 诉讼、EU AI Act 敞口、裁员和估值缺口，都会通过少数节点传导——数据访问、AgentC 执行、人才和信任——再进入收入韧性和 IPO 支撑。
    data:
      nodes:
        - id: sap_legal
          label: SAP 反垄断 + 专利诉讼
          detail: Celonis v SAP 美国诉讼；截至 2026 年仍在证据开示。
          tone: negative
        - id: ai_act
          label: EU AI Act 分阶段义务
          detail: GPAI 义务于 2025-08-02 生效；高风险义务于 2026-08-02 生效。
          tone: warning
        - id: layoffs
          label: 2023 + 2024 裁员
          detail: 2023 年中裁员 ~10%；据报道 2024 年 2 月又有后续裁员。
          tone: warning
        - id: data_access
          label: SAP ERP 数据访问
          detail: RISE / Grow with SAP 对装机基盘把关。
          tone: negative
        - id: agentc
          label: AgentC / CCM 执行
          detail: 企业 AI 底座在 2024–2026 年推出。
          tone: warning
        - id: talent
          label: 人才与士气
          detail: AgentC 和 CCM 铺开所需的 AI / 产品 / 销售产能。
          tone: warning
        - id: trust
          label: 客户信任
          detail: 客户是继续在 Celonis 上扩张，还是用 Signavio / Microsoft 对冲。
          tone: warning
        - id: revenue
          label: 收入韧性
          detail: SAP 锚定队列的净留存、扩张和续约。
          tone: negative
        - id: ipo
          label: IPO 支撑和估值
          detail: 2022 年 $13B 估值标记能否在下一次定价事件中站住。
          tone: negative
      edges:
        - from: sap_legal
          to: data_access
        - from: data_access
          to: trust
        - from: data_access
          to: revenue
        - from: ai_act
          to: agentc
        - from: agentc
          to: trust
        - from: layoffs
          to: talent
        - from: talent
          to: agentc
        - from: trust
          to: revenue
        - from: revenue
          to: ipo
        - from: sap_legal
          to: ipo
    approximationNotes: 定性传导图；展示渠道，不是量化概率模型。
    claimRefs:
      - CR001
      - CR010
      - CR012
      - CR014
      - CR027
      - CR028
      - CR031
      - CR033
      - CR037
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Celonis 位于密集的伙伴 / 供应商网络上；关键集中节点是 SAP（数据和渠道）、超大规模云厂商（托管 + GTM）、Big-4/GSI（交付）和前沿模型提供商（AgentC）。
    data:
      nodes:
        - id: core
          label: Celonis 核心平台
          detail: 资产组合：Process Intelligence Graph、OCPM、CCM、AgentC、Make、PAF、Symbio、Ikigai。
          tone: positive
        - id: sap
          label: SAP（ERP + Signavio）
          detail: ERP 数据来源，也是直接流程挖掘竞争对手（现在还是法律对手）。
          tone: negative
        - id: msft
          label: Microsoft / Azure / Power Platform 生态
          detail: 超大规模云托管、联合销售，以及 Power Automate Process Mining 竞争对手。
          tone: warning
        - id: aws
          label: AWS
          detail: 托管、AWS Marketplace SKU、AgentC 联合工程。
          tone: warning
        - id: ibm
          label: IBM（watsonx + Consulting）
          detail: 战略合作伙伴，同时也是 IBM Process Mining 竞争对手。
          tone: warning
        - id: snow_now
          label: ServiceNow + KPMG（IRM 捆绑）
          detail: 三方 Connected Integrated Risk Management 合作。
          tone: neutral
        - id: gsi
          label: Big-4 / GSI 交付队伍
          detail: Accenture、KPMG、EY、Deloitte、IBM Consulting 交付企业铺开。
          tone: neutral
        - id: llm
          label: 前沿模型提供商
          detail: OpenAI / Anthropic / 超大规模云 LLM 为 AgentC 推理提供动力。
          tone: warning
        - id: cust
          label: 企业客户（运行 SAP 的队列）
          detail: 1,400–1,500 个 logo；集中度画像未披露。
          tone: warning
      edges:
        - from: sap
          to: core
        - from: sap
          to: cust
        - from: msft
          to: core
        - from: aws
          to: core
        - from: ibm
          to: core
        - from: snow_now
          to: cust
        - from: gsi
          to: cust
        - from: llm
          to: core
        - from: core
          to: cust
    approximationNotes: 依赖图突出关键节点；不是完整生态图。
    claimRefs:
      - CR012
      - CR014
      - CR016
      - CR017
      - CR018
      - CR019
      - CR020
      - CR021
      - CR022
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 从 Celonis 的品类领先、最近正式估值、上市可比公司重估到 IPO 时点，串起最终投资建议的决策链。
    data:
      nodes:
        - id: n1
          label: 品类领先
          description: 2026 年 Gartner MQ 领导者、1,400+ 家企业客户，AI 智能体叙事在 2026 年重新拉起。
        - id: n2
          label: 最近正式估值
          description: 2022 年 QIA 领投一轮估值 $13B；此后没有公开刷新，也没有经审计财务。
        - id: n3
          label: 上市可比重估
          description: Pegasystems / Appian / UiPath 的收入倍数为 4–6x；Snowflake / Datadog 为 14–17x。
        - id: n4
          label: IPO 时点
          description: Reuters 2025 年 9 月和 The Information 2025 年 12 月的上市传闻，被 Bloomberg 2025 年 6 月的暂缓消息抵消。
        - id: n5
          label: 建议 = 观察
          description: 资产质量高，但缺少经审计披露时，$13B 估值下的安全边际很薄。
      edges:
        - from: n1
          to: n5
        - from: n2
          to: n5
        - from: n3
          to: n5
        - from: n4
          to: n5
    approximationNotes: null
    claimRefs:
      - CV002
      - CV005
      - CV012
      - CV019
      - CV020
      - CV023
      - CV024
      - CV043
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: Celonis 在工作流可比公司和 AI 溢价两套倍数区间之间移动时，估值结果的方向性变化。
    data:
      items:
        - label: 以 $700M 计 5x
          value: 3.5
          description: 悲观情景：如果 Celonis 重估到 Appian / UiPath 式工作流可比公司倍数。
        - label: 以 $700M 计 8x
          value: 5.6
          description: 保守基准：采用传统工作流倍数，不给 AI 溢价。
        - label: 以 $850M 计 12x
          value: 10.2
          description: 中位区间：ARR 温和增长，混合参考工作流和数据基础设施同业。
        - label: 以 $1.0B 计 16x
          value: 16
          description: 乐观情景：如果 Celonis 在 IPO 窗口守住 Datadog 式溢价。
        - label: 以 $1.2B 计 18x
          value: 21.6
          description: 高位乐观情景：如果 AI 智能体叙事把 Celonis 重估到 ServiceNow 式倍数。
    approximationNotes: 数值为估计值，单位是十亿美元，基于 Sacra 的 $700M ARR 估计和各情景 ARR 增长假设；它们不是企业价值计算。
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
      - CV043
      - CV044
      - CV045
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 在当前后期入场价位下，Celonis 的低位、基准和高位估值区间。
    data:
      items:
        - id: bear
          label: 悲观情景
          low: 2.8
          value: 3.5
          high: 4.2
        - id: base
          label: 基准情景
          low: 6.8
          value: 8.4
          high: 10.2
        - id: bull
          label: 乐观情景
          low: 14
          value: 18
          high: 22
    approximationNotes: 由于 Celonis 不披露经审计收入和资本结构细节，区间使用估值 / ARR 代理倍数，单位为十亿美元；入场参考点是 2022 年 $13B 估值。
    claimRefs:
      - CV012
      - CV019
      - CV023
      - CV043
      - CV044
      - CV045
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 投委会式仪表盘，抓住 Celonis 在当前 2022 年估值标尺下最关键的投资判断维度。
    data:
      items:
        - id: market
          label: 市场 / 品类
          value: Strong
          description: 到 2026 年，流程智能仍是企业 AI 智能体的长期底座。
          tone: positive
        - id: proof
          label: 验证点
          value: Strong
          description: 1,400+ 家企业客户、2026 年 Gartner MQ 领导者，AgentC 和 Context Model 已跑出牵引力。
          tone: positive
        - id: economics
          label: 经济质量
          value: Partially verified
          description: Sacra 的 $700M ARR 估计只具方向性；经审计利润率和 FCF 细节缺失。
          tone: neutral
        - id: valuation
          label: 估值
          value: Stretched
          description: 按 2022 年 $13B 估值隐含约 18x，高于最接近的工作流可比公司。
          tone: negative
        - id: liquidity
          label: 退出路径
          value: Unclear
          description: 2026 年 IPO 传闻被 Bloomberg 2025 年 6 月的暂缓消息抵消；尚无 S-1。
          tone: negative
        - id: evidence
          label: 证据质量
          value: Medium
          description: 公开证据足以支持「观察」结论；还不足以在 2022 年标价下明确买入。
          tone: neutral
    approximationNotes: null
    claimRefs:
      - CV002
      - CV005
      - CV011
      - CV012
      - CV019
      - CV020
      - CV023
      - CV043
      - CV046
