      - number: '5.5'
        title: 信任、IP 与路线图：已授权专利、不可发现的信任页面，以及 2026 发布管线
        blocks:
          - type: paragraph
            body: >-
              Celonis 最强的公开技术 IP 信号，是 Google Patents 收录的两项欧洲授权专利：EP4481646A1， 涉及用于流程树发现的近似归纳式 miner（受让人 Celonis SE，2023
              年 6 月 19 日提交，2024 年 12 月 25 日公开， 发明人为 van Detten、Leemans、Schumacher）；EP4468169A1，涉及对象中心数据模型图（优先权日 2023 年 5
              月 23 日， 2024 年 11 月 27 日公开，发明人为 Nolle、Glampedakis、Doumanis、Matthaei、Utz 和 Newman）。 这些专利直接支撑 OCPM
              和流程发现架构，而不是营销式 IP。信任与合规层面，明显入口 celonis.com/trust/ 和 celonis.com/security/ 在本次运行中返回 404（保留为 evidenceGaps，并在
              trust/quality 表中记录 accessStatus）； Celonis 平台页面声称具备企业级安全与合规，但没有在这里以机器可核验方式列出具体认证范围（SOC 2 Type II、 ISO
