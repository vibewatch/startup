  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 到 FY2026，ARR 扩大到接近 $1.0B–$1.2B，AI 智能体叙事守住，2026 年 IPO 按数据基础设施溢价定价。
        - $1.0B–$1.2B 上按 14x–18x，对应 $14B–$22B；以 $13B 入场、持有 2–3 年，毛回报 1.1x–1.7x。
        - 溢价倍数必须同时扛住软件整体重定价和 SAP 反叙事。
        - 有可能，但需要执行零失误，且 2026 年 IPO 市场配合。
      - - 基准
        - ARR 约 $850M，混合工作流与数据基础设施可比公司，IPO 落在中性至小幅折价区间。
        - $850M 上按 8x–12x，对应 $6.8B–$10.2B；相对 $13B 入场，毛回报约 0.5x–0.8x。
        - 降估值融资风险和优先权悬挂，让经营进展扎实也可能出现名义亏损。
        - 公开证据下最可信；与 BVP 和 SaaStr 记录的公开可比公司重置相符。
      - - 悲观
        - ARR 卡在接近 $700M，SAP 反垄断拖累，第三轮裁员，IPO 推迟到 2027 年之后。
        - $700M 上按 4x–6x，对应 $2.8B–$4.2B；相对 $13B 入场，毛回报 0.2x–0.3x。
        - 如果公开市场纪律先于披露质量到来，品类领导者也可能是糟糕入场点。
        - 如果宏观倍数继续压缩，或 SAP 合作关系永久破裂，下行空间很大。
      - - 概率加权姿态
        - 偏基准，因为品类质量可见，但价格锚已过时。
        - 支持观察，而不是按 2022 年标价买入。
        - 股权结构不透明、SAP 纠纷和 IPO 时点让结果分布很宽。
        - 后期私募定价不能只靠品类领导地位。
    notes: 区间是委员会讨论工具，基于 Sacra 的 ARR 估计、公开可比公司倍数和明确的分母限制；它们不是管理层指引。
