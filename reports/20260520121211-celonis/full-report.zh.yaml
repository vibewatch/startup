      - number: '4.4'
        title: 资本结构、稀释视角与前瞻资本充足性
        blocks:
          - type: paragraph
            body: >-
              公司概况章节已按轮次梳理融资时间线；本节把同一组事实放进资本结构和资本充足性框架。权威公开来源报告的累计融资差异明显：PitchBook 2025 年 2 月 简介列示 $1.37B，Forbes
              公司简介称“超过 $1.6 billion”，Wikipedia 2026 年 3 月文章引用“约 $1.77 billion”。最可能的解释是，PitchBook 排除了 ServiceNow
              战略投资、部分老股交易，以及金额未公开的 2024 年 1 月“Later Stage VC”交易。最后一次正式估值标记是 2022 年 8 月 Qatar Investment Authority 领投的
              $13B Series-D 延展轮，前一轮是 2021 年 6 月让 Celonis 成为德国首个十角兽的 $11B Series D——这意味着 Celonis
              近四年没有以新估值融资，对后期软件公司而言标记寿命很长。公司没有公开现金余额、月度烧钱速度或现金跑道披露，资本充足性只能推断。正面信号包括围绕增长纪律包装的 CFO 聘任、仍在进行的收购（Make /
              Integromat、Lenses、PAF、Symbio、Sailfin，以及待完成 Ikigai Labs 交易）暗示还有可用资本，以及 2025 年 Fortune Future 50 第 3
              名。负面信号包括 2022 年后没有公开上调估值融资、屡次后移的 IPO 传闻、2023 年席卷企业软件的裁员潮中 Celonis 约 140 个岗位受影响，以及 Celonis 2025 年 3 月对 SAP
              提起反垄断诉讼，把公司最大历史分销渠道变成现役法律对手。
