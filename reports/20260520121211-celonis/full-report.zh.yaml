  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、变现界面与公开可见的牵引力
        blocks:
          - type: paragraph
            body: >-
              Celonis 变现的是一个单一集成平台——围绕 Data Core、新 Celonis Context Model 和 Build 体验搭建的 Celonis Platform——以流程智能和企业级 AI
              订阅形式卖给大型企业。公司自己称“超过 1,400 家公司”使用 Celonis，Forbes 公司简介称 1,500 家客户，公司 About 页面又把 5,000+
              次企业部署作为另一指标，因此连最简单的漏斗顶部数字，也会随出版方不同出现三种口径。公司自有页面不发布标价；不同于 UiPath、Pegasystems、Appian 等上市云软件可比公司（均为 SEC
              注册主体），Celonis 把定价当作销售主导、逐合同谈判的问题。这意味着 Celonis
              的收入、ARR、毛利率、抽成率、平均合同价值、折扣带等数字全部是私人信息；任何假装知道的章节都是过拟合。公开记录真正支持的是多流收入界面：核心流程挖掘与流程智能订阅；包括新 Celonis Context
              Model 和 AgentC 在内的企业级 AI 附加能力；与 SAP、ServiceNow、Microsoft、IBM watsonx、Databricks
              的生态集成，可借联合销售产生收入；以及小型服务和伙伴主导实施层。客户披露的价值（例如 GE Healthcare 自由现金流提升 $1.3B）是营销证明，不是 Celonis 收入。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
