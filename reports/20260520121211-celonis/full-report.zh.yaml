  - id: TV005
    title: 投资逻辑破裂与终止触发表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 降估值融资 / 老股成交价
        - 新股融资或已执行老股交易的投后估值低于 $9B
        - 证实公开可比公司的重置已完全反映进 Celonis 定价
        - 按新锚重新承销；只有拿到经审计披露时，才考虑按新标记入场
      - - ARR 增长放缓
        - 披露 ARR 同比增速低于 25%
        - 按工作流可比公司倍数，把基准情景拉向悲观情景
        - 暂停增量工作；等完整一个 FY 的证据后再重审
      - - SAP 反垄断结果
        - 不利裁决或和解限制 Celonis 的 SAP 数据访问
        - 封顶 AI 智能体投资逻辑，并提高 SAP 绑定账户的流失风险
        - 降低仓位或 IPO 前退出；重新计算风险 ACV
      - - 裁员周期
        - 12 个月内出现第三轮公开裁员，幅度超过员工数 5%
        - 说明成本 / 增长错配变得持久，并迫使公司转向利润率
        - 视为增长重估事件；向悲观情景加权
      - - IPO 推迟
        - 2026 年美国 IPO 正式推迟到 2027 年 Q2 之后
        - 拉长私募持有期，并提高分母风险折价
        - 继续持有但收紧尽调节奏；要求新的老股标记
    notes: 阈值是委员会触发器，不是市场共识；任一单项触发都应促使重新评级，而不是自动退出。
