chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与当前产品定位
        blocks:
          - type: paragraph
            body: >-
              Celonis 在 2026 年自称是流程智能全球领导者，首页主张“全球超过 1,400 家公司使用 Celonis 分析、设计并运营 AI 驱动流程”。About 页面用 Munich, Germany 和
              New York City, USA 双总部确立公司身份，并披露全球超过 20 个办公室、3,000+ 名员工，以及自报累计为客户兑现 $6.5 billion 价值。产品定位围绕 Celonis
              Platform 和新推出的 Celonis Context Model 展开；Celonis 称 Context Model 是一个动态、不绑定系统、实时反映客户完整业务的表达层。公司现在借这套叙事销售企业级
              AI，而不只是流程挖掘。因此，本报告后续沿用的公司身份是：总部位于 Munich / New York 的私营流程智能与企业级 AI 平台厂商，明确依赖自有 Context Model 叙事，也依赖大量以 SAP
              为锚点的企业客户装机基础。
