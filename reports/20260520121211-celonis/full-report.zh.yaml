      - number: '5.2'
        title: 架构：Data Core、Context Model、OCPM、PQL、PI Graph 与随处运行连接
        blocks:
          - type: paragraph
            body: >-
              架构上，Celonis 把平台分为摄取 + Data Core + Context Model + Build / Apps + AgentC。Data Core 是存储与计算层，借 100+
              连接器从源系统摄取结构化事件和对象数据，将其规范化为以对象为中心的事件日志，并借 PQL（Process Query Language）和 PI Graph 元数据界面暴露出来。Data Core
              之上，Celonis Context Model——2026 年 5 月 12 日新闻稿称其为平台的“运营数字孪生”——增加语义层，使流程知识可被外部 AI 智能体和副驾驶使用。新闻稿明确列出 CCM
              随处运行连接：AWS、Databricks、Microsoft Fabric、Snowflake（宣布“即将推出”）和 Oracle。Build 体验（Studio、Apps、Action Flows）位于
              Data Core / CCM 之上，为业务分析师提供低代码 / 无代码 界面，用来构建流程应用、自动化和指标；docs.celonis.com 也记录了同一界面。OCPM 本身记录在 Celonis
              自己的“What is OCPM?”博客中，也是 Celonis SE 发明人 Nolle、Glampedakis、Doumanis、Matthaei、Utz、Newman 提交的对象中心数据模型图谱专利
              EP4468169A1 的学术框架。流程树发现则由近似归纳挖掘器专利 EP4481646A1 覆盖。
