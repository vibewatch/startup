        title: 规模信号、生态触达与分析师背书
        blocks:
          - type: paragraph
            body: >-
              除估值外，Celonis 最强的规模信号来自客户名单、伙伴生态和分析师覆盖，而非公司没有披露的收入。PitchBook 2025 年 2 月快照记录员工总数 3,353 人；About
              页面现在称“3,000+”——两者都指向数千人规模，也与 2025 年 Fortune Future 50 首次上榜第 3 名一致。客户证明很密：BMW Group 使用 Celonis 已超过八年，并基于
              Process Intelligence Graph 建起流程挖掘卓越中心；首页和案例库主动展示 Fujitsu、Uniper、Standard Bank、PepsiCo、GE
              Healthcare、Deutsche Post DHL、Deutsche Telekom、Lufthansa Cargo、Carrefour、Lockheed Martin、Kraft
              Heinz、Uber、Novartis。伙伴侧同样密集：ServiceNow 既有战略合作，也有直接股权投资；IBM（watsonx 与
              Consulting）、Microsoft、AWS、Accenture、EY、KPMG 是 AgentC 与 Context Model 推广的锚点。独立背书来自 Everest Group 在 2024
              年连续第五年把 Celonis 评为领导者，以及 Gartner 2026 年 5 月在新流程智能品类中授予 Magic Quadrant 领导者。
