      - number: '2.4'
        title: 增长驱动、采用约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              需求背景足以支撑品类继续扩张。IDC 称 2025 年标志着 AI 从实验转向重塑；Celonis 引用的 Microsoft 和 Forrester 评论把流程智能视为 AI
              智能体缺失的运营上下文；Celonis 自己的 “Four 2025 supply-chain predictions” 文章以及 2026 年关税管理定位都认为，宏观扰动（关税、供应链冲击、智能体 AI
              推出）会提高企业为流程可视性付费的意愿。Celonis 也被设计进伙伴生态，成为 ServiceNow 工作流、IBM watsonx、Microsoft Copilot 和 AWS Bedrock
              的数据底座，在不按比例扩大自身销售队伍的情况下放大触达面。约束同样真实且对称。以对象为中心的流程挖掘（OCPM）仍然新；Celonis 必须教育买方，它自己关于 Everest Group 对 OCPM
              担忧的博客也承认了这一点。SAP 关系现在是对抗性的——Celonis 2025 年 3 月以数据访问为由对 SAP 提起反垄断诉讼——直接威胁历史上驱动平台的 SAP 事件日志管道。Gartner 2026
              Magic Quadrant 将 IBM、UiPath、SAP / Signavio、Microsoft、Software AG / ARIS 推入领导者或接近领导者位置，提高价格压缩风险。Celonis
              还面临开源 Apromore（现属 Salesforce）和自动化套件捆绑带来的商品化压力。再叠加广泛 IT 支出治理、FinOps 审查、企业数据质量参差，PoC 转为多年 ARR
              的速度会被拖慢。落到估值上，Celonis 享受可信的长期顺风，但持久上行取决于三件事：(a) 打赢数据访问战，(b) 保住可防守的 OCPM 与 Context Model 领先，(c)
              以明显高于单独流程分析品类的净留存挂上 AI 智能体预算。
