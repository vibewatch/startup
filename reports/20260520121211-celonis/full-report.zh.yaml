        - 在接触意向成立后，要求一次管理层资料室会议；与 QIA 披露交叉核对
      - - 股权结构瀑布
        - Series D 和 D 延伸轮优先权、棘轮条款、清算堆叠
        - 判断下一次标记下的普通股等价价值是否匹配名义投后估值
        - 委托老股专家或投行建模，计算优先权调整后的股权价值
      - - SAP 绑定收入集中度
        - SAP 转售或 SAP 集成账户的 ACV 和增长贡献
        - 量化反垄断不利结果对合作伙伴渠道的下行影响
        - 客户访谈，加上通过独立尽调供应商完成的渠道合作伙伴调研
      - - 经核验老股成交价
        - 已执行的 Forge / EquityZen / SharesPost 交易或基金 N-PORT 标记
        - 在 2022 年标记和下一轮新股融资之间，提供一个价格发现点
