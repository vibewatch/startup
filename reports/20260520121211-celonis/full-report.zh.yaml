      - number: '4.3'
        title: 成本结构、利润率驱动与公开可比公司对 Celonis 的启示
        blocks:
          - type: paragraph
            body: >-
              没有经审计财务，唯一诚实的成本结构判断只能来自机制和可比公司文件。Celonis 成本基底由研发和现场销售主导，组织位于 Munich / New York 双总部，约 3,000–3,353 人；Celonis
              在 AWS、Databricks、Microsoft Fabric 上运行 Data Core 和 Context Model 时，也会消耗超大规模云基础设施。2024 年 12 月任命 Benoit
              Fouilland——曾任 Criteo（他带其在 Nasdaq 上市）、Contentsquare、Firmenich、SAP AG CFO——公司明确表述为“驱动下一阶段增长”，外界普遍解读为 IPO
              准备纪律。上市软件可比公司给出一个现实边界：Pegasystems 是可盈利的中型市值企业软件公司，财务摘要经 SEC 披露；Appian 提交 10-K，展示低代码企业平台如何报告毛利率和经营亏损；UiPath
              自 2021 年 IPO 以来记录了消耗型 vs 订阅型定价压力。这些文件都不能替代 Celonis 数据，但能界定问题：若交付真正是软件，一个拥有 Celonis 这种客户集中度的流程智能平台，应能达到
              70–80%+ 软件毛利率；若伙伴服务尾部很大，则会显著低于该水平。Ikigai Labs 收购（2026-05-12 宣布）增加研发人员和 MIT 许可专利——这是能力收购，不是收入增厚交易——说明
              Celonis 仍在曲线前投入，而不是收割利润率。
