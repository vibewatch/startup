      - number: '4.2'
        title: GTM 动作、客户队列与实际存在的单位经济代理
        blocks:
          - type: paragraph
            body: >-
              Celonis 不披露 CAC、回本周期、销售周期长度、ACV、NRR 或人均配额产出。正确的尽调姿态只能从公开代理三角测量：具名客户簿的规模与质量、伙伴分销覆盖，以及作为销售产能输入的员工数。PitchBook
              2025 年 2 月快照把 Celonis 员工总数定在 3,353 人；公司自己称在 20+ 个办公室拥有“3,000+”名员工，意味着相当可观的前线组织。具名客户簿——BMW、GE
              Healthcare、Deutsche Post DHL、Deutsche Telekom、Lufthansa Cargo、Carrefour、Lockheed Martin、PepsiCo、Kraft
              Heinz、Uber、Uniper、Fujitsu、Novartis、Standard Bank、Siemens GBS、AstraZeneca、ASOS、Dell、Johnson &
              Johnson——是机构级的，并偏向多年、多流程账户，落地后扩张经济性很可能很强，但外部无法量化。ServiceNow 战略合作（ServiceNow 进行了财务投资）以及
              SAP、IBM、KPMG、EY、Accenture、AWS、Microsoft 伙伴动作带来的分销杠杆，是 Celonis 能在不披露收入的情况下维持企业级规模的最可信解释。Sacra、Tracxn、CB
              Insights 等独立画像服务，要么把 Celonis 财务披露锁在付费层之后，要么在免费页没有有用数字；这本身就是证据信号：即便专业私募市场跟踪机构，今天也没有可用于投资判断的 Celonis 收入视图。
