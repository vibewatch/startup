      - number: '5.3'
        title: AgentC 与企业级 AI 集成界面：2024 年 10 月 vs 2026 年 5 月产品阵容
        blocks:
          - type: paragraph
            body: >-
              AgentC 是 Celonis 的 agent-layer SDK 和集成入口，最早在 2024 年 10 月 23 日的 Celosphere 上发布。 2024 年 10 月 AgentC
              新闻稿列出的生态，明显窄于 2026 年 5 月 Context Model 发布时的生态。本章不消解这个差异， 而是把它保留为一条互相冲突的证据信号。2024 年 10 月的发布明确点名 Microsoft
              Copilot Studio、 IBM watsonx Orchestrate、Amazon Bedrock 和 CrewAI 为首发生态；2026 年 5 月 CCM 新闻稿又加入 Anthropic
              Claude Cowork、Databricks Agent Bricks、Microsoft Agent365 / Copilot、Oracle OCI Enterprise AI， 以及经由 Ikigai
              Labs 收购取得的 MIT 许可决策智能专利。Ikigai Labs 于 2026 年 5 月 12 日达成收购协议， Devavrat Shah 出任 Chief Scientist Enterprise
              AI，MIT 成为 Celonis 股东——这是 AgentC 发布后最具体的能力补强。 从部署姿态看，2026 年的 Celonis 客户原则上可以把 Context Model 接入 Bedrock
              agent、watsonx Orchestrate 流程、 Copilot/Agent365 界面，或 CrewAI 多 agent 工作流。但各伙伴的生产深度证据并不均匀，有的只是列名集成，
              因此本报告把它记为证据缺口。AgentC 还要求 AI agents 通过 Data Core/Context Model 消费 PQL， 这是 Celonis 区别于横向 RPA 或 LLM 工具的锁定机制。
