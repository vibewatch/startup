  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与监管风险由 SAP 反垄断诉讼和欧盟 AI Act 实时敞口锚定
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月，Celonis 最重要的法律敞口，是其 2025 年 3 月 4 日在美国加州北区联邦地区法院对 SAP 提起的反垄断诉讼。 Celonis 指控 SAP 武器化其 ERP
              数据地位，尤其借助 RISE with SAP 和 Grow with SAP 迁移打包，扼住第三方访问客户数据的通道，而 Celonis 正是靠这些数据运行。Bloomberg Law 反垄断团队、The
              Information 和 Bloomberg Law IP 团队均报道称，该案已进入证据开示阶段； 并行的 Celonis 对 SAP
              专利诉讼，把法律态势从商业争端升级为针对其最大历史分销伙伴的多线诉讼。CourtListener 在美国联邦案卷中返回 98 条 「celonis」命中，说明 SAP 事项不是唯一活跃程序。美国诉讼之外，欧盟
              AI Act 已于 2024 年 8 月 1 日生效，义务分阶段落地：罚则和通用 AI 义务自 2025 年 8 月 2 日起，高风险义务主体自 2026 年 8 月 2 日起，2027 年 8 月 2
              日全面适用。2024 年 10 月 AgentC 发布和 2026 年 5 月 Celonis Context Model 明确把产品定位为企业 AI agents 作用于客户 ERP 数据的底座，因此
              Celonis 很可能既是 AI 系统提供方， 也是受监管垂直行业客户（银行、保险、医疗、汽车）的部署方，这使其落入该法对 GPAI 和高风险用途施加的文档、训练数据披露和风险管理义务。 德国联邦金融监管机构
              BaFin 以及与 EDPB 对齐的各国 DPA，也会分别审查 Celonis 交付给银行和保险公司的数据访问与 AI 治理安排。 这些不是理论文件——它们会直接转化为合同摩擦、受监管垂直 GTM 放慢，以及
              IPO 招股书必须回答的准备金和披露问题。
