          label: 资本基盘
          detail: $13B（2022 年）估值；累计融资 $1.37-1.77B；2024 年轮次金额未披露
        - id: n5
          label: 合作伙伴生态
          detail: ServiceNow（也是投资方）、IBM、Microsoft、AWS、Accenture、EY、KPMG
