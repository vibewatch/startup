      - number: '1.3'
        title: 融资形成、投资方地图与未解的 2024 轮
        blocks:
          - type: paragraph
            body: >-
              Celonis 到 2022 年的融资脉络记录充分，之后越来越不清晰。TechCrunch 和 Reuters 报道确认，2016 年 6 月 Accel 与 83North 领投 $27.5 million
              Series A；2018 年 6 月，$50 million Series B 把公司估值推到 $1 billion，使 Celonis 成为德国首家软件独角兽；2019 年 11 月，Series C 融资
              $290 million、估值 $2.5 billion。Forbes 记录 2021 年 6 月 $1 billion Series D、估值 $11 billion（NZZ 称 Celonis
              为德国首个十角兽）；Bloomberg 确认 2022 年 8 月 Qatar Investment Authority 领投 Series D 延展轮，把最近一次正式估值定在 $13
              billion。之后公开记录变薄：PitchBook 列出 2024 年 1 月一笔后期 VC 轮，但未披露金额、投资方或估值；三大主要公开数据库现在给出的累计融资明显不同——PitchBook $1.37
              billion、Forbes “超过 $1.6 billion”、Wikipedia 约 $1.77 billion。这个差距和未标价的 2024 轮使股权比例、以及 2024–2026
              年是否存在下调估值融资风险，都必须等拿到股权结构表后才能判断。
