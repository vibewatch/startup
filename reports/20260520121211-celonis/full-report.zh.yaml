              反向客户信号真实存在，但边界清晰。G2 评论池在四点上反复出现摩擦：（i）PQL 和自定义分析等高级功能学习曲线陡峭；（ii）在超大或复杂数据集上性能会滞后；
              （iii）常见垂直行业之外，行业模板仍偏薄；（iv）与较小或自建工具集成需要技术专长。TrustRadius 上 Novo Nordisk Associate Digital Director
              的评论给出更尖锐的受监管行业批评：「平台能力演进得比我们验证其能否进入受监管流程的速度更快，这限制了我们被允许使用 Celonis 的方式」， 并要求差异化环境 / 更成熟的 Lifecycle
              Management model。Brocacef （一家 501–1,000 人的荷兰制药物流公司）指出，object/catalog modeling 指导响应慢，网站过度依赖通用公式示例。独立检索没有发现
              2024–2026 年 公开大规模流失事件、客户发起的企业诉讼、大型 G2/TrustRadius 评分崩塌，或具名失败部署；这一时期最重要的公开反向事件是 Celonis 自己起诉 SAP （伙伴 /
              竞争对手），而不是客户反叛。总体看，Celonis 是复杂且昂贵的平台，需要成熟买方，但公开迹象并不显示它正在失去这些买方。
