          - type: paragraph
            body: >-
              Celonis 没有一个可单独防守的 TAM。最接近的类比是 MarketsAndMarkets 的“流程分析”品类：2018 年规模 USD 185.3 million，预计 2023 年达到 USD
              1,421.7 million，CAGR 50.3%——但这个预测如今已经过时，也明显低于当前流程挖掘厂商的收入集中度。更近的出版方（Grand View Research、IMARC、Fortune
              Business Insights、Precedence Research）发布了流程挖掘软件市场报告，但大多藏在付费墙或公共网页的品类跳转页之后，因此本轮无法独立验证绝对规模数字，只能保留为证据缺口。外层信封是
              IDC 2025 FutureScape：全球 AI 支撑技术支出从 USD 337 billion 升至 2028 年超过 USD 749 billion。Celonis 自己把它作为企业级 AI
              编排的顺风，但它显然夸大了 Celonis 特定收入池。最窄口径是 Celonis 自报迄今为客户累计创造 USD 6.5 billion 价值——这是产出代理，不是市场规模。IDC 分析师 Maureen
              Fleming 以及 Celonis 承办内容里的 Forrester 嘉宾都确认，流程智能正在成为扩展智能体 AI 的“基础性”底座；Celonis 引用的 2023 年 IDC 展望则把
              流程挖掘重塑为“业务价值工程”。每个估计使用的边界不同，把它们压成一个数字会误导投资判断。
