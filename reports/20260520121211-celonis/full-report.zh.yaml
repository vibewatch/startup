      - number: '2.3'
        title: 买方分层、预算主人与采用路径
        blocks:
          - type: paragraph
            body: >-
              Celonis 的买方地图比单一 IT 平台预算更宽。已验证客户案例和伙伴内容显示，平台往往先落在转型与流程卓越办公室（BMW 在中央 IT
              建立流程挖掘卓越中心），随后扩到供应链（Uniper、Lufthansa Cargo、Fujitsu）、财务与共享服务（GE Healthcare 释放 USD 1.3 billion
              自由现金流，Deutsche Post DHL HR 运营）、采购（Carrefour、Deutsche Telekom 获奖采购转型），以及借 ServiceNow 伙伴关系进入 IT /
              ITSM（Siemens GBS 被点名为先行者）。因此预算主人包括 CIO、CFO、CPO、COO，也越来越包括用 Microsoft Copilot Studio、IBM watsonx
              Orchestrate 或 Amazon Bedrock Agents 资金推出智能体的 Chief AI Officer 或转型负责人。Celonis 自己描述的采用路径，是先抽取 ERP / CRM
              数据，再做流程发现，随后做 KPI 监控和执行应用，再走向基于 AgentC 的自动化，最后把新的 Celonis Context Model 作为企业级 AI 的运营底座。咨询伙伴（Accenture、IBM
              Consulting、KPMG、EY）把住大型企业落地关口；Celonis 首页“1,400+ 家公司”、Forbes “1,500 家客户”、About 页“5,000+
