      - - EU AI Act 适用范围扩大
        - EU / 成员国关于 AgentC 与 CCM 范围的实施法指引
        - AgentC / CCM 被归类为 GPAI 提供方或高风险 AI 提供方，且没有公开映射
        - 假设合规负担更高、欧盟扩张更慢、产品投入增加
      - - Gartner / Forrester 下调
        - 年度 Magic Quadrant 和 Wave 发布
        - 失去领导者象限或排名显著下滑
        - 将竞争叙事视为受损；重审胜率假设
      - - 客户流向 SAP Signavio
        - 公开客户公告、Signavio 案例研究新增、丢单报道
        - 一个或多个前 50 大客户公开从 Celonis 迁移到 Signavio 或 Microsoft
        - 将集中度风险视为开始兑现；要求前 20 大客户队列和续约时间表
    notes: 触发项刻意设计成可通过公开案卷、监管出版物、裁员追踪器、分析师报告和客户公告监控——也就是说， 它们不依赖管理层私下披露。
