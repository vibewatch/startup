  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 估值 / 市值
      - 收入分母
      - 隐含倍数 / 状态
      - 相关性
      - 局限
    rows:
      - - Celonis（标的）
        - $11B–$13B 私募投后估值（2021 / 2022 轮）
        - 约 $700M ARR（Sacra 估计，2024）
        - 隐含约 16x–19x
        - 锚定现有投资人账面标记与当前公开可比公司的差距。
        - 私募投后估值和第三方 ARR 估计，不能与公开市场 EV / 收入直接比较。
      - - Pegasystems
        - 约 $8B–$9B 市值（2026 快照）
        - 约 $1.5B 过去 12 个月收入
        - ~5x–6x
        - 最接近的传统工作流 / BPM 同行，具备数十年的企业覆盖。
        - Pega 服务收入占比更高，增长画像比 Celonis 更慢。
      - - Appian
        - 约 $2.5B–$3B 市值
        - 约 $600M 过去 12 个月收入
        - ~4x–5x
        - 有助于观察低增长工作流可比公司，给非 AI 流程自动化定底。
        - 规模更小，且仍受法律科技叙事牵引，更像下限而非直接锚。
      - - UiPath
        - 约 $8B 市值
        - 约 $1.4B 过去 12 个月收入
        - ~5x–6x
        - 最接近的 RPA / 自动化同行，企业客户重叠，并有 2021 年 IPO 历史。
        - UiPath IPO 后重估，显示私募标记与公开价格发现之间的差距。
      - - ServiceNow
        - 约 $200B 市值
        - 约 $11B–$12B 收入
        - ~17x–18x
        - 规模化、盈利的企业工作流基准，也是长期愿景锚。
        - 规模远大于 Celonis，披露经审计，产品面也更宽。
      - - Snowflake
        - 约 $50B 市值
        - 约 $3.6B 产品收入
        - ~14x
        - 数据基础设施同行，享有相近的 AI 叙事溢价。
        - 商业模式不同（按用量计费），且已有 IPO 级披露。
      - - Datadog
        - 约 $45B 市值
        - 约 $2.8B 收入
        - ~16x
        - 规模化高增长企业 SaaS 同行，可支撑十几倍倍数。
        - 可观测性与流程智能是不同终端市场。
      - - BVP Emerging Cloud Index
        - 指数篮子
        - Bessemer 跟踪的 EV / 收入中位数
        - 中位数较 2021 年高点显著压缩
        - 提供公开云重置基线，约束任何 Celonis 溢价。
        - 指数方法排除超大市值公司，并偏向高增长云公司。
    notes: >-
      公开市值和收入分母是 2026 年方向性快照，已与 Wikipedia 摘要和相关 SEC 10-K 文件索引页交叉核对； 私募 Celonis 数字来自 PitchBook、Forbes 和
      Sacra，应按区间而非点估计阅读。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the closest workflow / process / data-infra public comps with readable market-cap and revenue
        denominators plus one index benchmark; excludes ServiceNow's full product mix, private RPA peers, and
        non-US-listed names.
