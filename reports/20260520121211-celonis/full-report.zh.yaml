      - number: '7.4'
        title: 治理、地域与人员风险，以及可监控的破坏投资论点触发器
        blocks:
          - type: paragraph
            body: >-
              Celonis 仍由创始人 Alex Rinke 和 Bastian Nominacher 担任 co-CEO，联合创始人 Martin Klenk 担任 CTO。co-CEO 结构把决策权集中在个人关系里，
              这套关系尚未经历衰退、公开市场申报或敌意收购方事件的公开压力测试。新加入不久的 President（Carsten Thoma，前 Hybris/SAP）和 CFO （Benoit Fouilland，前
              Criteo）带来职业化平衡，但两人也都刚上任。地域集中真实存在：慕尼黑加纽约市双总部、偏欧洲 DACH 的参考客户、 德国法律注册地与 BaFin/BSI 监管环境，以及长期偏薄的德国 IPO 生态，让
              Celonis 比 UiPath、Databricks 或 Snowflake 等美国注册地 同行更暴露于欧洲宏观、地缘政治（乌克兰、能源、制裁）和资本市场条件。IP 风险是双向的：Celonis-vs-SAP
              专利诉讼在主张 Celonis IP， 但也隐含着通过反诉把 Celonis IP 放到公开领域审视。因而，本章最可执行的输出是一组可监控否决标准：SAP 诉讼不利裁决、明确下行轮、 IPO 二次推迟到 2027
              年之后、第三轮裁员、Gartner 从 Leader 下调，或公开客户从 Celonis 转向 SAP Signavio，任何一项都会独立压缩牛市情景。 建议把 SAP 诉讼案卷、BaFin 和
              Bundeskartellamt 登记、欧盟 AI Act 实施法案追踪器、layoffs.fyi、CourtListener 作为常设尽调界面—— 这些都不由公司控制——并要求管理层在承销任何高于 2022
              年估值的溢价前，先把 AgentC / CCM 映射到 AI Act 下提供方与部署方类别。
