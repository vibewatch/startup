  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、邻近赛道与现状替代品
        blocks:
          - type: paragraph
            body: >-
              划定 Celonis 的边界，应从可变现界面往外推，而不是把所有标着企业级 AI 的钱都算进去。公司销售流程智能平台，三层是 Data Core、Celonis Context Model，以及用于分析 / 设计
              / 运营工作流的 Build 体验；底层从 ERP、CRM、供应链和 ITSM 系统抽取事件日志，再把流程图谱暴露给人类和 AI
              智能体。这意味着最相关的直接支出池包括流程挖掘与流程智能软件、邻近的流程分析和任务挖掘市场、因已宣布收购 Ikigai Labs 而并入的 AI 决策智能工具，以及现在流向 Microsoft Copilot
              Studio、IBM watsonx Orchestrate、Amazon Bedrock Agents、CrewAI 等智能体平台的运营编排支出。边界应排除纯 RPA 席位许可、通用数据仓库支出，以及从不触达
              Celonis 流程图谱的基础模型推理。Celonis 必须替代的现状方案包括基于电子表格的精益 / Six Sigma 审计、基于 ERP 抽取数据的定制 BI 仪表盘、嵌入式 SAP Signavio
              流程建模、UiPath 和 Microsoft 在更大自动化套件内销售的流程挖掘附加模块，以及学术或成本敏感企业内部署的开源 Apromore。Gartner
              正式把流程挖掘定义为基于事件日志分析运营流程的技术，IBM 和 UiPath 现在也按同一定义销售竞品。实际含义是，Celonis 不再独占“品类领导者”标签；2024–2026 年间，Gartner Magic
              Quadrant 与 Everest Group PEAK Matrix 中已经出现多个领导者。
