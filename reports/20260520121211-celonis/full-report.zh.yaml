      - number: '4.5'
        title: 财务结论、证据缺口与投资尽调路径
        blocks:
          - type: paragraph
            body: >-
              结论是，Celonis 呈现为一家资本充足、以企业客户为锚点的后期私营软件公司，产品 / 市场故事可信，也有可识别的 IPO 路径；但它公开财务画像明显薄于同等规模同行。本章不能负责任地断言
              ARR、收入增长、毛利率、经营利润率、现金、烧钱速度或现金跑道，因为没有经过验证的一手来源披露这些数字；公司网站上的“+$13B 估值”和“$6.5B
              已兑现客户价值”是营销汇总，不是财务报表。因此最重要的尽调卡点是：(1) 2025 年和过去十二个月的准确收入与 ARR，并拆分预订额与已确认收入；(2) 经审计毛利率和经营利润率；(3)
              当前现金、现金跑道与烧钱速度表，并包括任何风险债契约；(4) 2024 年 1 月 PitchBook “Later Stage VC” 事件的清晰解释，包括是否为持平或下调估值；(5)
              任何共同基金按市值重估披露（例如 Fidelity 或 T. Rowe Price 持有人），用于判断 2022 年 $13B 参考估值之后的私募市场重定价；(6) IPO 时间和募资用途计划，包括
              Celonis 是否准备按市场广泛传闻在 2026 年完成美国上市。需要计价的反向风险包括 SAP 反垄断诉讼结果（可能加速 Celonis 分销，也可能让其搁浅）、相对 $13B
              标记的持续下调估值风险，以及披露长期缺位——这种状态类似一些后期私营公司，后来在 IPO 时大幅下修估值。
