      - - 客户基础
        - 1,400+ 家企业客户，包括 BMW、GE Healthcare、DHL、Lockheed Martin、PepsiCo、Standard Bank。
        - 客户数量为自披露；Forbes 写的是 “1,500”，官网还提到 “5,000+ 次部署”。
        - 经审计的客户队列披露，包含 ARR 分档和集中度数据。
      - - AI 叙事
        - Celonis Context Model 和 Ikigai Labs 收购（2026-05-12）把 Celonis 定位成企业 AI 底座。
        - AI 智能体收入未单独披露；ServiceNow、Microsoft、SAP 等竞争对手也嵌入了类似能力。
        - 量化披露 AI 智能体 ARR，并给出附加率、毛利率和竞争胜率证据。
      - - 估值锚
        - QIA 领投的 2022 年 8 月 $13B 轮融资，以及 Reuters / Information 的 IPO 传闻，支撑溢价标记。
        - 公开流程 / 工作流可比公司已重估到 4–6x，Bloomberg 报道 IPO 已在 2025 年 6 月搁置。
        - 机密 S-1，或以 $10B 及以上估值完成且披露条款的干净新股融资。
      - - 披露
        - PitchBook、Forbes、Sacra 和 Crunchbase 都覆盖该公司；Wikipedia 汇总了融资历史。
        - 没有经审计收入，没有利润率披露，累计融资数字相互矛盾，也没有发布共同基金持仓标记。
        - 作为 IPO 流程一部分发布 SEC 质量文件（经审计收入、ARR、FCF、股权结构表）。
    notes: 反向逻辑刻意聚焦价格敏感和披露敏感风险，而不是争论 Celonis 是否具备战略相关性。
