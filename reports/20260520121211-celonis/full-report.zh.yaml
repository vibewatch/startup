        - id: n2
          label: Celonis Platform + Context Model 平台
          detail: 核心组件：Data Core, CCM, AgentC, OCPM
        - id: n3
          label: 企业客户基盘
          detail: 1,400+ 家公司；BMW、GE Healthcare、DHL、PepsiCo、Lockheed Martin
