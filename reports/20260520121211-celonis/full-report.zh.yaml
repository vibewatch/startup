            body: >-
              Celonis 案例研究中可见的「先落地、再扩张」路径高度一致：先在财务或共享服务里做一个 procure-to-pay 或 order-to-cash 试点，
              再横向扩到供应链、IT、HR、审计和客服，最后由客户自建 Center of Excellence 固化（BMW、Novartis、Standard Bank 都符合这条弧线）。 伙伴渠道——SAP（自 2015
              年起）、ServiceNow、Microsoft、IBM Consulting + watsonx、AWS、Accenture、KPMG、EY——扩大了分销和采购入口；
              许多大型参考客户（BMW、Uniper、Carrefour、Novartis）最初就是联合销售或联合实施。集中度风险更难判断：没有 top-10 ARR 披露、没有分部组合， 参考客户又明显偏 DACH /
              Fortune 500，因此少数平台账户很可能贡献超比例收入。2025 年 3 月 Celonis 在美国对 SAP 提起反垄断诉讼后 （第 7 章覆盖），SAP
              关系变得结构性暧昧：它一方面威胁长期客户入口渠道，另一方面可能让共享账户暴露于 SAP-Signavio 替换压力。 因此，客户侧风险不是 logo 质量问题，而是渠道依赖和集中度披露问题；只有私下尽调能闭合。
