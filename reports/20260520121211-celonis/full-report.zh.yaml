companyProfile:
  summary: >-
    Celonis 是全球流程智能赛道的品类龙头。公司 2011 年从 Technical University of Munich（TUM）孵化，今天是 Munich 与 New York 双总部、由联席 CEO 领导的德国 /
    美国私营公司；产品 Celonis Platform 面向大型企业，核心包括 2026 年 5 月推出的 Celonis Context Model、Process Intelligence Graph、Data
    Core、AgentC AI 智能体工具和 Celonis Marketplace，帮助企业分析、设计和运营 AI 驱动的业务流程。Celonis 上一次正式估值是 2022 年 8 月 Qatar Investment
    Authority 领投的 Series D 延展轮，约 $13B；员工超过 3,000 人，公开披露客户超过 1,400 家，连续入选 Everest Group PEAK Matrix 领导者，并在 2026 年 5 月
    Gartner 首个流程智能 Magic Quadrant 中被评为领导者。市场普遍把它视为 2026 年 IPO 候选，但公司也正与最大历史渠道伙伴 SAP 打美国反垄断官司。
