  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图——直接、现有大厂、邻近、替代与现状路径
        blocks:
          - type: paragraph
            body: >-
              Celonis 同时在三个重叠战场竞争。最窄的是专用流程挖掘和流程智能软件，买方在 Celonis、SAP Signavio、IBM Process Mining、Microsoft Power Automate
              流程挖掘、UiPath Process Mining、ABBYY Timeline、QPR ProcessAnalyzer、Software AG 的 ARIS，以及开源 Apromore
              技术栈之间选择。Gartner 发布的市场定义把该品类框定为摄取事件日志以发现、监控和改进运营流程的工具。第二个战场是捆绑式企业平台：超大规模云厂商和现有应用厂商把流程挖掘折进更大的 Power
              Platform、watsonx、ServiceNow 或 ERP 套件，靠捆绑经济性竞争，而不是挖掘深度。第三个战场是现状替代方案——手工 BPM、BI 仪表盘、定制事件日志脚本、只有 RPA
              的点工具，以及咨询主导的 Six Sigma 项目——这些仍吸走大部分企业流程改进预算。事件数据一旦集中，买方也可以在云数据平台上自建，尤其是已经为 Databricks、Snowflake 或 BigQuery
              付费的公司。因此替代风险不只是其他流程挖掘厂商；还包括什么都不做，以及既有分析栈。
