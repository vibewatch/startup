      - 数值
      - 理由
    rows:
      - - 建议
        - 观察
        - 资产质量高，但按 2022 年 $13B 标价看，基于公开可比公司的安全边际很薄。
      - - 置信度
        - 中
        - 可比公司信号方向明确；但 Celonis 的分母是第三方 ARR 估计，不是经审计收入。
      - - 风险评级
        - 高
        - SAP 反垄断纠纷、两轮裁员和暂停的 IPO 进程，拉宽了结果分布。
      - - 估值立场
        - 偏高
        - 按 Sacra 约 $700M ARR 估计，隐含约 18x，高于最接近的工作流可比公司；只有 AI 智能体叙事守住， 这个倍数才成立。
      - - 基准情景估值区间
        - $7B–$10B
        - 将 Pegasystems / Appian / UiPath 倍数混合，并因 AI 叙事部分加入 Snowflake / Datadog 溢价。
      - - 决策含义
        - 等待 IPO 折价或经审计披露
        - 清晰的 IPO 区间、经审计的利润率披露，或经核验的老股成交价，对判断的影响都会超过又一次产品发布。
