        - 要求披露现有客户中 OCPM 功能采用率。
      - - FinOps 与 IT 支出理性化
        - 下行
        - 当前
        - 预算负责人在扩大 Celonis 支出前，会审视席位蔓延和按流程定价
        - 要求披露多年期 ACV 趋势以及席位 / 消耗计费组合。
      - - IPO 窗口 2026 及 Fortune Future 50 曝光
        - 上行
