      - number: '7.3'
        title: 财务与估值风险由四年估值空窗、IPO 延迟和未披露集中度塑造
        blocks:
          - type: paragraph
            body: >-
              自 2022 年 8 月 QIA 领投的 Series D extension 以 $13B 估值完成后，Celonis 没有再公开完成估值上升轮；按本报告运行日期计算， 这个空窗接近四年。Wikipedia 和
              PitchBook 记录 2024 年 1 月一轮「晚期 VC 轮」，但未披露估值；Crunchbase、NZZ 和 PitchBook
              的覆盖合在一起，只能说明下行轮风险存在一致性线索，不能证明已经发生。累计融资额本身在主要追踪器之间也不一致（PitchBook $1.37B、Forbes $1.6B+、Wikipedia 约
              $1.77B），严肃的 IPO 招股书必须对齐。Reuters 2025 年 9 月报道称 Celonis 正探索 2026 年美国 IPO；Bloomberg 2025 年 6 月随后报道称（阅读器回退缓存为
              404），管理层告诉员工 IPO 因市场波动被搁置——这一序列与 The Information 和 Handelsblatt 关于 IPO 准备时间线的报道一致。裁员强化了烧钱与估值标记之间的张力：Sifted
              和 Handelsblatt 报道 2023 年中裁员约 10% （以当时约 3,000 人计算约 140 个岗位），BigTechWire 指出 2024 年 2 月又有后续重组；公司随后聘任 Benoit
              Fouilland 为 CFO （2024 年 12 月 1 日）并任命 Carsten Thoma 为 President（2023 年 8 月）——这些动作符合 IPO 级财务控制和运营纪律准备，
              但不能替代经审计披露。客户集中度数据在 1,400–1,500 logo 基础上完全未披露，而这些客户运行 SAP 的特征已与上文反垄断敞口重叠； 如果某个头部客户意外流失到 SAP Signavio 或
              Microsoft，外部只能事后看到。组合起来——高端私募估值、没有新一轮验证、IPO 暂停、裁员、 集中度不透明——使估值而非产品成为最大实时风险。
