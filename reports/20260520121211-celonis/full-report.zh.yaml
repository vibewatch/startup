  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - 流程挖掘与流程智能软件
        - 面向事件日志抽取、流程发现、一致性检查、KPI 监控和执行应用的订阅许可
        - 在加入流程挖掘之前已经存在的底层 ERP/CRM 席位许可和仓库存储
        - CIO、转型负责人、流程卓越办公室、财务运营
        - Celonis 的核心直接品类
      - - 对象中心流程挖掘（OCPM）和 Context Model 底座
        - 面向对象中心数据模型、Celonis Context Model 和新 Process Intelligence Graph 的高级支出
        - 流程领域之外的通用数据建模工具
        - CIO、首席数据官、企业架构
        - Celonis 在专利申请和产品叙事上领先的差异化面
      - - 流程分析与任务挖掘邻近品类
        - 与事件日志打通的用户行为任务挖掘、桌面遥测分析和流程分析
        - 不连接企业流程的通用 UX 分析、产品分析或 Web 分析
        - 运营、BPO、共享服务负责人
        - 竞争对手从 RPA 套件切入的自然扩张品类
      - - AI 智能体编排与决策智能
        - >-
          AgentC、Copilot Studio、watsonx Orchestrate、Bedrock Agents、CrewAI 等智能体平台支出，前提是 Celonis Context Model 充当运营记忆；另含
          Ikigai Labs 决策智能工具
        - 通用基础模型 API 支出或通用 ML 平台支出
        - 首席 AI 官、CTO、自动化负责人
        - Celonis 目前定位为主要切入动作的高增长邻近品类
      - - 维持现状的替代方案
        - 基于电子表格的精益 / 六西格玛审计、覆盖 ERP 抽取数据的定制 BI 看板、嵌入式 SAP Signavio、UiPath / Microsoft 流程挖掘附加组件、开源 Apromore
        - 不替代既有流程分析工具的净新增 AI 智能体支出
        - 现有 IT、转型和运营预算负责人
        - 替代预算的主要来源，也是最常被提及的竞争风险
      - - 广义 AI 支撑技术外沿
        - IDC FutureScape 跟踪的全球 AI 支撑软件、基础设施和云改造
        - 假设所有 AI 支撑支出都会转化为 Celonis 收入
        - CIO、CTO、转型预算池
        - 可作为需求背景的外沿边界，但过宽，不能称作 Celonis 的 SAM
    notes: 边界从 Celonis 的变现面出发，再向邻近品类外扩。通用 AI 基础设施支出和无关 ERP/BI 席位许可仍是背景，不是直接市场规模。
