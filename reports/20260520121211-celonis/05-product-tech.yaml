  body: celonis.com/trust/ and celonis.com/security/ both returned 404 in this run, and no public status page (status.celonis.com) was located. Specific certification scopes (SOC 2, ISO 27001/27018, HIPAA, FedRAMP, GDPR, PCI) are therefore not externally enumerable from the obvious public surface; this is logged as an evidence gap with a clear diligence path.
  claimRefs:
  - CE031
  - CE032
  - CE033
- calloutType: insight
  title: October 2024 vs May 2026 AgentC ecosystem delta is itself an underwriting signal
  body: The October 2024 AgentC press release names Microsoft Copilot Studio, IBM watsonx Orchestrate, Amazon Bedrock and CrewAI as launch partners; the May 2026 CCM press release additionally names Anthropic Claude Cowork, Databricks Agent Bricks, Microsoft Copilot/Agent365 and Oracle OCI Enterprise AI. The expansion looks like positioning ahead of production depth — diligence should ask for per-partner live customer counts and revenue attribution.
  claimRefs:
  - CE005
  - CE017
  - CE018
  - CE020
  - CE022
