- id: partners-ecosystem-marketplace
  title: 'Ecosystem: SIs, Marketplace, GitHub, customer-proof for deployment depth'
  body: Celonis is highly SI- and partner-led on the deployment side. IBM Consulting publicly states it has more than 2,000 certified Celonis consultants and frames the IBM–Celonis partnership as a co-sell and co-deliver motion across SAP-heavy enterprises; that scale of practitioner certification is itself a developer-signal proxy in a market where official GitHub stars and npm downloads understate real adoption. ServiceNow, SAP (despite the active Celonis antitrust filing), Microsoft, AWS, Databricks, Accenture, KPMG and EY round out the SI/co-sell layer documented across the Celonis press, partner pages, and the Celonis Next 2025 partner summit. Marketplace.celonis.com (JS-only page, captured here as accessStatus js-only) curates partner-built apps, connectors and industry packs that extend the Data Core into vertical workflows. Customer-proof for production depth is documented through named case-study blogs (Kraft Heinz, Lockheed Martin, Uber, GE Healthcare, PepsiCo), and the Celonis 'Where enterprise tech goes next' and 'Object-centric process mining' blogs argue the thesis for why OCPM and CCM together are the differentiating architecture rather than the agent integrations alone. The Celonis GitHub organisation (github.com/celonis) is live but hosts a small number of public repos relative to typical developer-tool vendors, and the PyCelonis Python SDK is documented at docs.celonis.com rather than published on PyPI's public index page (pypi.org/project/pycelonis returned 404 in this run) — recorded as an evidence gap.
