- id: trust-ip-roadmap
  title: 'Trust, IP and roadmap: granted patents, undiscoverable trust page, and the 2026 release pipeline'
  body: 'Celonis''s strongest public technical-IP signals are two granted European patents indexed on Google Patents: EP4481646A1, on an approximate inductive miner for process-tree discovery (assignee Celonis SE, filed 19 June 2023, published 25 December 2024, inventors van Detten, Leemans, Schumacher); and EP4468169A1, on an object-centric data model graph (priority 23 May 2023, published 27 November 2024, inventors Nolle, Glampedakis, Doumanis, Matthaei, Utz and Newman). The patents directly back the OCPM and process-discovery architecture rather than being marketing IP. On trust and compliance, however, the obvious URLs celonis.com/trust/ and celonis.com/security/ returned 404 in this run (preserved as evidenceGaps and an accessStatus row in the trust/quality table); the Celonis platform page asserts enterprise security and compliance but does not enumerate specific certification scopes (SOC 2 Type II, ISO 27001, ISO 27018, HIPAA, FedRAMP, GDPR, PCI) at a machine-checkable surface here. The 2026 roadmap is anchored to the CCM launch, the Ikigai Labs close, expansion of AgentC ecosystem partners, and the Solution Suite line (Supply Chain, Finance, Front Office, Sustainability) referenced across celonis.com and the Celonis Next 2025 partner summit; the Gartner Peer Insights page on Celonis (JS-only) is a reputation signal but not a roadmap source. Roadmap depth beyond 2026Q3 is not publicly enumerable and is logged as an evidence gap with diligence paths.'
