  - FE001
- id: architecture-ccm-data-core
  title: 'Architecture: Data Core, the Context Model, OCPM, PQL, PI Graph and run-on-anywhere connectivity'
  body: 'Architecturally Celonis layers the platform as ingestion + Data Core + Context Model + Build/Apps + AgentC. The Data Core is the storage and compute layer that ingests structured event and object data from source systems via 100+ connectors, normalises it into an object-centric event log, and exposes it through PQL (Process Query Language) and the PI Graph metadata surface. On top of the Data Core, the Celonis Context Model — described in the 12 May 2026 press release as the platform''s ''digital twin of operations'' — adds a semantic layer that makes process knowledge consumable by external AI agents and copilots. CCM run-on-anywhere connectivity is explicitly enumerated in the press release: AWS, Databricks, Microsoft Fabric, Snowflake (announced as ''coming soon''), and Oracle. Build experiences (Studio, Apps, Action Flows) sit above Data Core/CCM and give business analysts a low-code/no-code surface to build process applications, automations, and metrics; the same surface is documented at docs.celonis.com. OCPM is itself documented in Celonis''s own ''What is OCPM?'' blog and is the academic frame underlying patent EP4468169A1 on object-centric data model graphs filed by Celonis SE inventors Nolle, Glampedakis, Doumanis, Matthaei, Utz, and Newman. Process-tree discovery is in turn covered by patent EP4481646A1 on an approximate inductive miner.'
  claimRefs:
  - CE003
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
