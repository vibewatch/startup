- id: agentc-ai-integrations
  title: 'AgentC and the Enterprise AI integration surface: October 2024 vs May 2026 lineup'
  body: AgentC is Celonis's agent-layer SDK and integration surface, first announced at Celosphere on 23 October 2024. The October 2024 AgentC press release enumerates a much narrower ecosystem than the May 2026 Context Model launch does, and the chapter preserves that delta as a conflicting evidence signal rather than resolving it. The October 2024 release explicitly names Microsoft Copilot Studio, IBM watsonx Orchestrate, Amazon Bedrock and CrewAI as the launch ecosystem; the May 2026 CCM press release additionally names Anthropic Claude Cowork, Databricks Agent Bricks, Microsoft Agent365 / Copilot, Oracle OCI Enterprise AI, and (via the Ikigai Labs acquisition) MIT-licensed decision intelligence patents. The agreed acquisition of Ikigai Labs on 12 May 2026, with Devavrat Shah named Chief Scientist Enterprise AI and MIT becoming a Celonis shareholder, is the most concrete capability addition since AgentC launched. From a deployment posture this means a Celonis customer in 2026 can in principle plug the Context Model into a Bedrock agent, a watsonx Orchestrate flow, a Copilot/Agent365 surface, or a CrewAI multi-agent workflow — but evidence for production depth (vs. listed integration) is uneven across partners, which is recorded as an evidence gap. AgentC also requires AI agents to consume PQL through the Data Core/Context Model, which is the lock-in mechanism that differentiates Celonis from horizontal RPA or LLM tooling.
  claimRefs:
  - CE005
  - CE017
  - CE018
  - CE019
