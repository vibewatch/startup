  evidenceGaps:
  - type: missing-source
    severity: material
    topic: Public trust / security pages
    missingEvidence: celonis.com/trust/ and celonis.com/security/ both returned HTTP 404 in this run; no machine-checkable enumeration of certifications, audit reports or sub-processors located.
    whyItMatters: Enterprise buyers, especially in regulated industries, expect SOC 2 / ISO / HIPAA / FedRAMP / PCI scopes to be enumerated at a single discoverable URL.
    diligencePath: Request the current Celonis trust portal URL, audit-report covering letters, sub-processor list, and certification scope statements.
    relatedQuestionRefs:
    - QE015
    - QE022
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: Per-partner AgentC production depth
    missingEvidence: Listed AgentC / CCM integrations (Bedrock, watsonx Orchestrate, Copilot/Agent365, Claude Cowork, Agent Bricks, OCI, CrewAI) are not paired with public production-deployment counts or revenue attribution.
    whyItMatters: The October 2024 vs May 2026 ecosystem delta is large; without depth evidence the ecosystem map risks over-stating production maturity.
    diligencePath: Request per-partner live customer counts, named production references and 2025–2026 agent-call volumes by partner.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE001
  - type: missing-source
    severity: important
    topic: Action Flows / Marketplace run-rate
    missingEvidence: No public quantification of Action Flow run volume, Marketplace transaction count, or active-developer count was located.
    whyItMatters: Operating telemetry is the strongest proxy for product depth in a private company with no published ARR.
    diligencePath: Request 12-month run-rate of Action Flow executions, Marketplace installs, and active citizen-developer accounts.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE001
  - type: missing-source
    severity: important
    topic: Public roadmap beyond 2026Q3
    missingEvidence: Public roadmap signal beyond 2026Q3 is not enumerable from celonis.com or the Celonis Next 2025 partner summit page.
    whyItMatters: Forward feature commitments are necessary to underwrite product-velocity and competitive positioning.
    diligencePath: Request the 2026–2027 internal roadmap with GA dates, SKU mapping and commit-criteria.
    relatedQuestionRefs:
    - QE017
    - QE026
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: important
    topic: Public reliability / status page
    missingEvidence: No public status or reliability page (e.g., status.celonis.com) was located in this run.
    whyItMatters: Multi-tenant SaaS uptime evidence is a standard buyer due-diligence input.
    diligencePath: Request the URL of the production status page, 12-month uptime history, and post-mortems for any P1 incidents.
    relatedQuestionRefs:
    - QE016
    relatedTableRefs:
    - TE004
acknowledgedWarnings:
- dimension: paywallRisk
  reason: Two sources (marketplace.celonis.com and the Gartner Peer Insights Celonis page) render JS-only on direct fetch; treated as restricted-access reputation/marketplace signals rather than enumerable inventories.
- dimension: fetchTrailMissing
  reason: Several reused-as-local Celonis surfaces (homepage, about, platform, solutions/ai, OCPM blog) were verified live in prior-chapter runs and may not appear in this chapter's incremental fetch log under STARTUP_FETCH_LOG_PATH.
- dimension: unverifiedSource
  reason: celonis.com/trust/ and celonis.com/security/ are recorded as accessStatus 404 sources (SE029, SE030) deliberately, to preserve the negative evidence rather than to claim retrieved content.
