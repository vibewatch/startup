company:
  name: Celonis
chapter:
  number: 5
  title: Product & Technology
  key: product-tech
  summary: Celonis sells a single integrated process-intelligence and Enterprise AI platform built around the Data Core, the May-2026 Celonis Context Model (CCM), Build experiences and the AgentC agent layer. The product surface is well-documented on celonis.com and docs.celonis.com, and the architectural story is anchored to object-centric process mining (OCPM), PQL, the PI Graph, and run-on-anywhere connectivity to AWS, Databricks, Microsoft Fabric, Snowflake (planned), and Oracle. AI integrations are broad on paper — Amazon Bedrock, IBM watsonx Orchestrate, Microsoft Copilot/Agent365, Anthropic Claude Cowork, Databricks Agent Bricks, Oracle OCI Enterprise AI, Salesforce Agentforce, CrewAI — but the public ecosystem list has materially expanded between the October 2024 AgentC press release and the May 2026 CCM press release, and that delta is itself an underwriting signal rather than confirmed production depth. Two granted European patents (EP4481646A1 on approximate inductive miner process-tree discovery and EP4468169A1 on object-centric data model graphs) anchor verifiable IP. Public-surface gaps remain around an externally enumerable trust/security/compliance page, SOC/ISO/HIPAA certification scopes, and a discoverable public-cloud reliability/status page, which this chapter records as evidence gaps.
sections:
- id: product-scope-platform
  title: 'Product scope: the Celonis Platform as a single integrated process-intelligence and Enterprise AI surface'
  body: 'Celonis sells a single platform — the Celonis Platform — built around the Data Core, the new Celonis Context Model launched on 12 May 2026, Build experiences (Studio, Apps, Action Flows, Marketplace) and the AgentC agent layer first introduced at Celosphere on 23 October 2024. The customer-visible job is object-centric process mining (OCPM): connect to enterprise systems (SAP, Oracle, ServiceNow, Salesforce, Workday, custom databases), build a digital twin of operations across objects and events, find inefficiencies and value leakage, and then orchestrate change either through Action Flows automations or, increasingly, through AI agents that consume the same Context Model. The company''s platform page frames the surface as ''industrialize Enterprise AI'' rather than as a stand-alone process-mining tool, and the public docs site (docs.celonis.com) confirms that the same Data Core, PQL query language and PI Graph metadata layer underpin both the human-facing Studio and the agent-facing AgentC and CCM surfaces. Marketplace.celonis.com hosts partner-built apps, connectors and industry packages, and the company maintains a public GitHub organisation (github.com/celonis) plus a PyCelonis SDK referenced in docs, so the platform is genuinely developer-addressable even though no self-serve pricing is published.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  tableRefs:
  - TE001
