chapter:
  number: 7
  title: Risks
summary: 'Humanity Protocol’s risk profile is dominated by a single uncomfortable fact: a biometric identity network that asks users and partners to trust sensitive data flows already suffered a major privileged-key security failure in June 2026. That does not make the model uninvestable, but it does raise the burden of proof across privacy, key management, partner dependence, and recovery execution. The company has credible mitigations in motion — transparency tooling, incident reporting, token migration, compensation mechanics, and expanding anti-fraud positioning — yet the public record still lacks the third-party assurance and operational metrics needed to show that controls have fully matured.'
sections:
- id: privacy-regulatory-and-legal-exposure
  title: Biometric identity creates dense privacy, sanctions, and cross-border legal exposure
  body: 'Humanity is not just another crypto token project. Its own terms and privacy policy make clear that palm-based verification, biometric processing, sanctions controls, and jurisdiction-sensitive access restrictions are part of the core service model. That instantly places the company inside a tougher legal environment than a typical consumer app. Hong Kong privacy rules emphasize lawful and fair collection, retention discipline, and security. GDPR treatment of biometric data is stricter still, because special-category data cannot be processed casually. U.S. privacy and security expectations also matter if Humanity’s reusable credentials touch financial or consumer contexts. The company’s own documents add another layer: they contemplate provider storage, disclosure of biometric data under applicable law, and broad suspension rights under BVI-governed terms. In other words, the risk is not just “regulation may arrive someday.” Sensitive-data, cross-border, sanctions, and governance
    exposure are already part of the operating design. For investors, the important implication is that Humanity does not get to hide behind the phrase “decentralized identity.” Decentralization can reduce some centralized-database risks, but the company’s own legal documents show that off-chain governance, processors, law-enforcement requests, sanctions logic, and biometric-data handling are all part of the real-world operating model. Any mismatch between product claims and these operational realities could become a legal and reputational problem quickly.'
