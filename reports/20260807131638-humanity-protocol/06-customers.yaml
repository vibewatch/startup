    - Could remain a single flagship partnership
    - Limits proof of institutional repeatability
    - Request Open Campus rollout and institution count
  - - Events and loyalty
    - May depend too heavily on acquired Moongate channel
    - Expansion looks partner-led rather than native
    - Request Moongate customer list and attach rates
  - - Institutional ops through Fireblocks
    - Reach may not convert to active identity workflows
    - Could overstate enterprise traction
    - Request active institutional accounts using Humanity Mainnet
  - - Financial identity through Mastercard
    - High publicity could mask low production scale
    - May remain an ambition rather than revenue driver
    - Request launch geography, partner funnel, and active-user metrics
  - - Token-incentive growth loops
    - Fairdrop-led acquisition may not equal retention
    - Can inflate funnel metrics without durable customers
    - Request incentive cohort retention versus organic cohorts
  notes: The biggest visible risk is dependence on intermediating partners for proof and scale.
