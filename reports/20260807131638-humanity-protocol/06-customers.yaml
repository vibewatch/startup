  - Primary use case
  - Scale / strategic value
  - Gap
  rows:
  - - End users / Human ID holders
    - Users are visible; payer unclear
    - Reserve identity, prove humanity, hold credentials
    - Largest top-of-funnel base in retained set
    - User count is not revenue count
  - - Developers / dApps
    - Developers integrate; payer unclear
    - Add human-aware auth or credential checks
    - Critical to ecosystem growth
    - Paid plan and retention not disclosed
  - - Education ecosystem
    - Students, educators, and institutions via Open Campus
    - Issue and verify educational credentials
    - Shows non-crypto-native expansion path
    - No disclosed institutional contract count
  - - Events / loyalty ecosystem
    - Event operators, communities, and attendees via Moongate
    - Ticketing, access control, rewards, identity-linked participation
    - Strongest real-world deployment proof
    - Revenue contribution undisclosed
  - - Institutions / custody / treasury
    - Institutions reached through Fireblocks
    - Custody and operate H on mainnet
    - Improves operability and reach
    - Does not by itself prove Human ID usage
  - - Financial services / open finance
    - Users and lenders / service providers via Mastercard thesis
    - Reusable financial eligibility and identity credentials
    - Potential bridge into real-world finance
    - Still announcement-level proof
  notes: Segments separate visible users and partner channels from undisclosed direct payers.
