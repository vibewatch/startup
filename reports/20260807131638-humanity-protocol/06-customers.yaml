  evidenceGaps:
  - id: GU001
    gap: No retained source discloses paying-customer count, ACV, or revenue by customer segment.
    priority: high
    blocks:
    - customer-underwrite
    diligenceAsk: Request customer KPI deck with customer count, ACV, and segment mix.
  - id: GU002
    gap: No retained source discloses NRR, GRR, churn, or standard contract terms.
    priority: high
    blocks:
    - durability-underwrite
    diligenceAsk: Request retention and renewal cohorts.
  - id: GU003
    gap: Partner announcements do not quantify how many counterparties are fully live versus early or strategic.
    priority: medium
    blocks:
    - production-vs-pilot
    diligenceAsk: Request deployment stage, usage, and revenue contribution by named partner.
  - id: GU004
    gap: The user-growth funnel is visible, but the conversion from Human ID / wallet to paid or repeat usage is not.
    priority: high
    blocks:
    - funnel-quality
    diligenceAsk: Request activation, palm-verification, credential-use, and monetization cohorts.
  - id: GU005
    gap: TU003 samples the strongest named partner proofs, but the retained public set is not a complete customer roster or exhaustive deployment ledger.
    priority: medium
    blocks:
    - enumeration-completeness
    diligenceAsk: Request a full customer / partner deployment list with stage, revenue contribution, and production status.
    relatedTableRefs:
    - TU003
