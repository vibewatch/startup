  - - Moongate
    - Events / access / loyalty
    - Ticketing, access control, loyalty, and identity-linked participation
    - Existing platform plus post-acquisition integration
    - 300,000+ on-chain tickets give unusually concrete distribution proof
    - Still no disclosed revenue or attach rate to Human ID
  - - Fireblocks
    - Institutional custody / treasury
    - Supports Humanity Mainnet and H inside existing institutional operations
    - Production support on partner platform
    - Shows operational access to a large institutional channel
    - Treasury support does not prove direct identity-customer adoption
  - - Mastercard
    - Financial identity / open finance
    - Links Human ID with reusable financial verification workflows
    - Strategic integration / early motion
    - Shows ambition to bridge into credit and lending access
    - Revenue, launch scale, and customer volumes not disclosed
  notes: Named proofs are ranked by concreteness of deployment evidence rather than by publicity value alone.
