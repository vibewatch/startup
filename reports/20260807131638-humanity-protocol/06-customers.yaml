chapter:
  number: 6
  title: Customers
summary: 'Public evidence shows Humanity Protocol has a real but still partner-mediated customer story. The strongest proof is not a disclosed roster of paying enterprise accounts; it is a set of named deployment or distribution relationships that each anchor a different use case: Open Campus for education credentials, Moongate for event access and loyalty, Fireblocks for institutional custody operability, Walrus for developer and multi-chain identity workflows, and Mastercard for financial-identity ambition. That breadth is promising because it shows multiple expansion lanes. It is also incomplete because the public record still does not disclose who pays, what renews, or how much of the large Human ID and wallet funnel becomes durable revenue.'
sections:
- id: customer-segments-and-surface-area
  title: The customer story is broad across users, developers, institutions, and partners, but still light on direct payer disclosure
  body: 'Humanity’s public record no longer supports a narrow reading of the customer base. The obvious user is the end consumer who creates a Human ID and later completes stronger verification. But the retained set also shows at least four additional segment classes: developers building on the identity rails, education or credential issuers using Open Campus, event or loyalty operators reached through Moongate, and institutions or financial distributors reached through Fireblocks and Mastercard-style integrations. This breadth matters because it shows Humanity can tell a many-sided platform story rather than a single-app story. It also creates a recurring diligence problem. The public materials rarely separate buyer, user, and payer. A student, attendee, wallet holder, institution, or developer may all use the system, but the sources do not consistently reveal who is signing a contract, whether that contract is production, or whether any disclosed logo reflects meaningful recurring spend.
    That ambiguity is especially important for Humanity because some of the strongest public proof is partner-led. In a normal SaaS company, a logo list may still imply a billing relationship. Here, a named counterpart may instead be a distribution ally, an ecosystem integrator, a wallet surface, or a use-case demonstrator. The customer chapter therefore has to stay disciplined about what each proof actually establishes.'
