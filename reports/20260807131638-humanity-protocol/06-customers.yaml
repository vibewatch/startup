- id: durability-remains-the-open-underwriting-question
  title: Durability, concentration, and monetization are still private
  body: 'The customer chapter turns cautious once the question shifts from proof of existence to proof of durability. The public record does not disclose paying-customer counts, retention, net revenue retention, gross retention, churn, satisfaction, or customer concentration by revenue. It also leans heavily on ecosystem counterparties, which is useful for expansion but risky if partners do not convert into direct customer economics. Top-of-funnel user and wallet metrics are likewise easy to overread. They prove adoption interest, not contract quality. Adverse evidence matters here too. The June 2026 exploit and the resulting governance debate can weigh on trust-sensitive buyers, especially when the identity product is asking users and partners to depend on long-lived credentials. The right underwriting stance is therefore mixed: Humanity has stronger named proof than many early-stage identity protocols, but the public set is still too thin on renewals, ACV, and concentration to call the
    customer book durable. That gap matters because many early-stage crypto companies can demonstrate ecosystem enthusiasm without proving a durable book of business. Until Humanity discloses repeat usage, contract economics, and how many named partners are fully live in production, investors should treat the customer story as promising but still mediated by partnership narratives.'
