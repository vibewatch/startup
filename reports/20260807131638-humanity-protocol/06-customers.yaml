- id: named-proof-is-strongest-in-partnership-led-workflows
  title: Named proof is strongest where Humanity plugs into existing ecosystems
  body: The best customer evidence in the retained set is named and use-case specific. Open Campus gives Humanity a concrete education narrative around interoperable learner credentials and institution-facing adoption. Moongate gives it the clearest real-world access case, with ticketing, access control, and a disclosed 300,000-plus on-chain-ticket footprint that predates the acquisition. Fireblocks gives institutional operability rather than end-customer identity proof, but that still matters because it lowers workflow friction for institutions already active in digital assets. Walrus shows how developers on Sui-adjacent infrastructure can consume identity signals, while the Korea hackathon post shows that ecosystem builders are using the surfaces in practice. Mastercard adds a financial-services ambition layer around open-finance-powered Human ID. Together these named proofs show credible land-and-expand logic across multiple verticals. What they do not yet show is direct transparency
    on ACV, contract length, or renewal quality. The additional wallet, mobile-app, and institutional-distribution posts deepen that picture. D’CENT and Hex Trust extend the story into wallet and institutional-support surfaces, while the mobile-app launch suggests Humanity is trying to convert ecosystem awareness into a more repeatable consumer entry point. These are useful proof points, but they still sit closer to enablement and channel expansion than to disclosed contracted revenue.
