    - Research more
    - Live token-market price is observable, but business economics remain private.
    - Stay engaged only with deeper diligence and price discipline.
  - - Confidence
    - Medium
    - Price and funding history are visible; revenue and treasury data are not.
    - Use ranges and contingencies, not a single target.
  - - Risk rating
    - High
    - Post-hack trust, supply overhang, and partner conversion remain unresolved.
    - Underwrite downside first.
  - - Valuation stance
    - Fair-to-speculative near live levels; stretched near $1.1B FDV
    - Current pricing is below the last funding headline, but disclosure quality is still weak.
    - Do not anchor on prior funding alone.
  notes: Summary table is intentionally price-sensitive and evidence-sensitive.
