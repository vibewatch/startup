- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Repeat security failure
    - Any new privileged-key or recovery-control incident
    - Destroys trust-rebuild thesis
    - Move from research-more to avoid
  - - No operating disclosure progress
    - Still no revenue / retention / treasury disclosure by next major financing cycle
    - Keeps valuation purely narrative-driven
    - Maintain heavy discount or pass
  - - Partner proof stays symbolic
    - Partnership count rises but direct economics remain absent
    - Bull case fails to convert into business quality
    - Cut upside assumptions
  - - Token-supply governance deteriorates
    - Unlock or treasury behavior undermines market confidence
    - FDV-based bull case weakens materially
    - Reprice to lower scenario band
  notes: Kill triggers focus on events that quickly invalidate a token-led recovery thesis.
