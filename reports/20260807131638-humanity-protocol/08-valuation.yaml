    - Named partner lanes, large user funnel, and product breadth across credentials and trust workflows
    - Need proof that optionality converts into paying customer economics
  - - 'Bull thesis: the market already repriced a lot of bad news'
    - Current public FDV is below the old $1.1B financing benchmark
    - Need proof that live token pricing is stable and not just a narrative bounce
  - - 'Anti-thesis: the hack created a lasting governance discount'
    - Exploit, recovery mechanics, and pivot narrative still dominate the story
    - Need sustained evidence of stronger controls and trust recovery
  - - 'Anti-thesis: lack of revenue disclosure makes all valuation calls fragile'
    - No public revenue, margin, retention, or treasury data
    - Need operating metrics and treasury governance disclosures
