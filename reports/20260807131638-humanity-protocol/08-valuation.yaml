company:
  name: Humanity Protocol
chapter:
  number: 8
  title: Valuation
summary: Humanity Protocol’s valuation case has reset from a financing-led narrative to a market-led one. The cleanest historical marker is the January 2025 $1.1B fully diluted valuation; the cleanest current marker is a token trading range around $0.086, implying roughly $170M of circulating market value and roughly $850M of fully diluted value in early August 2026. That is a meaningful markdown from the old headline but not a true underwriting bargain by itself, because the company still lacks public revenue, margin, retention, and treasury disclosures. On public evidence alone, the right call is research-more with high risk and a price-sensitive stance.
sections:
- id: headline-valuation-has-reset-but-not-disappeared
  title: The market has repriced Humanity below its funding headline, but not into obvious cheapness
  body: 'The easiest valuation mistake is to anchor on one number. If an investor uses only the January 2025 $1.1 billion fully diluted valuation, Humanity can still look like a wounded unicorn waiting to recover. If the investor uses only today’s circulating market cap near $170 million, the company can look permanently broken. Neither reading is sufficient. The more disciplined approach is to use all three public markers together: prior financing FDV, live token FDV, and live circulating market value. That framing shows a real post-hack reset, but not a collapse to zero relevance. It also shows why the company is still hard to underwrite. Price has moved much faster than disclosure quality. Investors still do not have public revenue, margin, retention, or treasury detail. That means the market has discovered a token price, but not a defensible intrinsic value. That distinction matters even more in a tokenized system because supply mechanics can preserve a large headline FDV while the realized
    market value available to current holders is much smaller. An investor who ignores that spread can mistake scarcity for cheapness. An investor who ignores the remaining strategic value can make the opposite mistake and underwrite the asset as if the network has no future option value at all.'
