- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Revenue and gross margin
    - No public revenue or margin data
    - Needed to convert token narrative into business value
    - Management / data room
  - - Retention and customer economics
    - No NRR, GRR, ACV, or cohort disclosure
    - Needed to test durability of partner-led story
    - Management / customer cohort deck
  - - Treasury and supply governance
    - No detailed treasury composition or sale policy
    - Needed to judge dilution and overhang risk
    - Foundation / treasury committee
  - - Post-hack control changes
    - No independent proof of redesigned key management or ops controls
    - Needed to underwrite recurrence risk
    - Security audit / outside assessor
  - - Partner conversion
    - No quantified revenue or production depth for key integrations
    - Needed to price optionality rationally
    - Partner scorecards and signed-customer evidence
  notes: These are the minimum workstreams required before issuing a conviction-level investment recommendation.
