evidenceGaps:
  - type: missing-source
    severity: material
    topic: founding-date
    missingEvidence: >-
      Authoritative incorporation or founding documents that reconcile the user-provided 2022 date with the much clearer
      2024 public launch record.
    whyItMatters: >-
      Founding chronology affects how investors interpret execution speed, maturity, and whether the current protocol is
      a continuation of earlier work or a newer spinout.
    diligencePath: >-
      Request certificate of incorporation, first financing documents, and an internal timeline that bridges Human
      Institute work to Humanity Protocol launch.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: A current verified employee count plus an organization chart by function and geography.
    whyItMatters: >-
      Staff scale determines whether Humanity can support biometrics, developer tooling, compliance, and partner
      integrations at the pace implied by its growth story.
    diligencePath: Request HR headcount by office/function and reconcile it against LinkedIn, payroll, and contractor rosters.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO001
      - TO002
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      A full board, foundation, issuer, and privileged-key control map, including which entities hold bridge, mint, and
      upgrade rights.
    whyItMatters: The June 2026 exploit makes privileged access and entity-level governance central to underwriting risk.
    diligencePath: >-
      Request board list, foundation documents, token-governance controls, wallet-signing policies, and post-incident
      remediation plans.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: monetization
    missingEvidence: >-
      Disclosure on paying customers, revenue, partner contract economics, and the conversion from Human IDs to
      monetized verification activity.
    whyItMatters: >-
      The company’s public metrics are top-of-funnel usage markers, so later valuation and customer chapters cannot
      infer durable economics without internal revenue evidence.
    diligencePath: >-
      Request customer pipeline, booked revenue, contract structure, and cohort conversion from ID creation to paid or
      contracted verification volume.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: serviceable-market-sizing
    missingEvidence: >-
      A defensible public SAM or SOM specifically for privacy-preserving proof-of-personhood and reusable credential
      networks.
    whyItMatters: >-
      Broad biometric or identity-verification totals are too inflated to support precise valuation multiples for
      Humanity without a narrower serviceable layer.
    diligencePath: >-
      Build a bottom-up SAM from target segments, expected verification volume, pricing, and adoption assumptions by
      buyer type.
    relatedQuestionRefs:
      - QM017
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: monetization-conversion
    missingEvidence: >-
      Conversion data showing how many Human IDs or verified users turn into paid verifications, enterprise contracts,
      or recurring network revenue.
    whyItMatters: >-
      Without conversion evidence, market adoption cannot be translated into revenue forecasts or credible unit
      economics.
    diligencePath: Request internal funnel data from reservation to verification to paid usage by segment and geography.
    relatedQuestionRefs:
      - QM021
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: interoperability-proof
    missingEvidence: >-
      External proof that non-crypto issuers or enterprises already accept Humanity credentials in production at
      material scale.
    whyItMatters: >-
      Portable credential network effects only matter if relying parties outside the core community actually recognize
      the credential.
    diligencePath: Request signed integrations, production transaction volumes, and issuer rosters by segment.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM003
      - TM004
  - type: stale
    severity: minor
    topic: did-market-forecast
    missingEvidence: >-
      A cleaner 2026 public forecast specifically for decentralized identity spending rather than older or qualitative
      policy-oriented demand lenses.
    whyItMatters: >-
      A more current decentralized-ID market estimate would sharpen the gap between proof-of-personhood niche spend and
      generic identity-verification spend.
    diligencePath: >-
      Refresh with current analyst reports, enterprise RFP counts, and public-company disclosures on credential-wallet
      or reusable-identity budgets.
    relatedQuestionRefs:
      - QM017
      - QM025
    relatedTableRefs:
      - TM002
  - type: access-blocked
    severity: material
    topic: incumbent-product-detail
    missingEvidence: Direct readable product and packaging detail for Onfido and Jumio from current live pages.
    whyItMatters: >-
      Those incumbents represent the enterprise benchmark Humanity must beat, yet their blocked pages limited
      apples-to-apples comparison in this run.
    diligencePath: >-
      Revisit with authenticated access, current sales materials, or analyst notes that expose product scope and
      commercial packaging.
    relatedQuestionRefs:
      - QP008
      - QP025
    relatedTableRefs:
      - TP001
      - TP003
  - type: access-blocked
    severity: minor
    topic: fractal-visibility
    missingEvidence: Current public detail on Fractal ID strategy, customer traction, and pricing.
    whyItMatters: >-
      Fractal remains a named competitor in web3 identity, but weak current visibility reduces confidence in its present
      relevance.
    diligencePath: Refresh later via direct product docs, team updates, or partner announcements once the site is available.
    relatedQuestionRefs:
      - QP010
      - QP025
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Comparable enterprise pricing, discounting, and contract terms across Humanity, Persona, and other incumbents.
    whyItMatters: Without normalized commercial terms, feature comparisons cannot be translated into procurement or margin risk.
    diligencePath: >-
      Request current pricing sheets, minimum contract sizes, and pilot-to-production conversion terms from management
      and key vendors.
    relatedQuestionRefs:
      - QP018
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Real migration data showing whether customers replace one identity stack with another or simply layer multiple
      systems.
    whyItMatters: Winner-take-most outcomes and moat durability depend on whether the category consolidates or remains stackable.
    diligencePath: Request case studies on displacement, multi-vendor deployments, and renewal decisions by buyer segment.
    relatedQuestionRefs:
      - QP016
      - QP017
    relatedTableRefs:
      - TP004
