  topStrengths:
    - Humanity 所在的身份、反机器人和凭证验证赛道真实且在增长，欺诈和 AI 滥用让需求更急。
    - 产品不只是单一 token：它覆盖掌纹生物识别唯一性、可复用凭证、开发者工具和面向机构的业务通道。
    - 公开证据显示，公司在教育、活动、钱包、资金库工作流和开放金融愿景上有多个具名合作伙伴和分发通道。
    - 活跃 token 市场价格让投资者看到当前估值发现，而不只是过期的私募轮标记。
  topRisks:
    - 2026 年 6 月的特权密钥攻击留下持续的信任和治理折价，任何未来估值都必须消化。
    - 公开财务披露薄弱：没有可靠收入、利润率、留存、资金库或现金跑道视图。
    - 客户质量仍未被充分证明，因为最强公开证据大多由合作伙伴牵引，而不是直接合同收入证明。
    - Token 估值对稀释、供应治理和修复叙事高度敏感，而不是由可观察现金流基本面支撑。
    - 生物识别数据处理和跨境隐私义务带来的法律与声誉风险，高于一般 crypto token 项目。
  unresolvedGaps:
    - 当前收入、毛利率，以及企业或机构工作流是否产生有意义的经常性现金收入。
    - 资金库构成、解锁政策、token 销售治理，以及仍与 2026 年 6 月修复相关的任何储备或负债。
    - 黑客事件后的控制重构，包括密钥管理、签名人政策和特权访问加固的独立证据。
    - 具名合作伙伴和集成公告背后的直接客户转化、留存和合同深度。
    - 2026 年可靠员工数、组织架构图，以及公司和基金会实体之间的治理权利图谱。
