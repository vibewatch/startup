company:
  name: Humanity Protocol
chapter:
  number: 5
  title: Product & Technology
summary: 'Humanity Protocol has grown into a real multi-layer identity stack rather than a single palm-scan gimmick. Public materials now support six visible layers: Human ID reservation, palm-based proof-of-humanity, wallet-held verifiable credentials, OAuth-style developer APIs and SDKs, decentralized credential storage and verification infrastructure, and partner rails such as Walrus and Fireblocks that extend the system into multi-chain and institutional contexts. The underwriting catch is that product breadth now exceeds product proof. The company provides unusually detailed blogs, docs, and SDK readmes for a private crypto startup, but the public record still lacks independent benchmarking, certification evidence, and hard reliability metrics.'
sections:
- id: product-surface-and-user-jobs
  title: The product now spans proof-of-humanity, portable credentials, and identity-aware applications
  body: 'Humanity’s public surface has expanded meaningfully since the early “Worldcoin competitor” framing. The homepage, protocol page, and docs now present a broader trust layer: users reserve a Human ID, complete stronger palm-based verification, hold wallet-native credentials, and then reuse those credentials across applications that need proof of personhood, eligibility, or reputation. Mainnet and verifiable-credentials posts make the product ambition even clearer. Humanity is no longer selling only uniqueness proof. It is trying to become an identity graph where education, travel, employment, social, and financial facts can be selectively proven without surrendering raw personal data. That creates a bigger opportunity than one-time onboarding, but it also makes product execution harder because the company has to solve not just biometrics, but portability, developer ergonomics, issuance, revocation, and acceptance across many application contexts. The breadth is strategically attractive
    because it gives Humanity multiple wedges into the market: consumer identity, developer tooling, credential orchestration, and partner-mediated distribution. It also raises the bar for execution. A company can ship a compelling sign-up experience long before it proves that credential issuance, revocation, portability, and multi-app acceptance work reliably at scale. That is why the most important diligence question is not whether the product map is ambitious; it is whether the operational details behind that map are catching up quickly enough.'
