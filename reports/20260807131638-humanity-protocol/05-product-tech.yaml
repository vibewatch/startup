  evidenceGaps:
  - id: GE001
    gap: No retained source provides independent biometric accuracy, spoofing, or liveness benchmarks.
    priority: high
    blocks:
    - technical-underwrite
    diligenceAsk: Request independent test results and red-team findings.
  - id: GE002
    gap: No retained source proves enterprise certifications such as SOC 2 or ISO 27001.
    priority: high
    blocks:
    - enterprise-readiness
    diligenceAsk: Request current certification reports and control-scope documents.
  - id: GE003
    gap: No retained source exposes uptime, latency, throughput, or API SLA metrics.
    priority: high
    blocks:
    - reliability-underwrite
    diligenceAsk: Request status history, SLA terms, and performance dashboards.
  - id: GE004
    gap: The public stack depends on partner technologies, but liability and fallback design are not disclosed.
    priority: medium
    blocks:
    - dependency-underwrite
    diligenceAsk: Request partner-dependency map and contingency architecture.
