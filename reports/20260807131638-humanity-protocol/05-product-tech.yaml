- id: architecture-and-developer-surface
  title: The strongest public technical proof is the documentation and SDK surface, not third-party benchmarking
  body: 'The most persuasive evidence that Humanity is more than a story comes from its developer surface. The SDK/API docs explicitly frame the integration model as OAuth-like. The public TypeScript and React SDK repositories show concrete flows for auth URLs, token exchange, preset verification, credential polling, hooks, and testing mocks, which is far more specific than many private crypto identity projects publish. The GitHub organization also showed dozens of repositories and current August 2026 update activity, suggesting a live engineering cadence. On the architecture side, the public picture is layered: mainnet plus zkTLS for proving web-native facts, credentials that can be wallet-held and selectively shared, and APIs or smart-contract interfaces that can feed applications. Walrus adds a more explicit storage-and-verification architecture by describing decentralized nodes, encrypted-at-rest credential data, and verification receipts. Even here, however, the available proof is mostly
    self-described. The public record shows how the stack is supposed to work; it does not independently verify that the stack performs at enterprise grade. This is a meaningful advantage in diligence because repositories and docs create observable implementation detail. They reveal naming conventions, developer assumptions, supported presets, and the kinds of applications the team expects third parties to build. At the same time, they can also overstate maturity if they are not matched by production reference customers, performance telemetry, or formal assurance evidence.'
  claimRefs:
