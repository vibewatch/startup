tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current public status
  - Quality
  - Diligence ask
  rows:
  - - Token value / treasury exposure
    - Value accretion from the H token ecosystem and related treasury positioning
    - Token price, FDV, unlock path
    - Visible through public tokenomics and market data, but issuer economics are undisclosed
    - Medium strategic relevance, low accounting visibility
    - Disclose treasury holdings, token sale policy, realized gains/losses, and treasury wallet governance
  - - Validator / staking economy
    - Staking and validation rewards align participation and verification work
    - Token rewards / staking participation
    - Publicly visible as product surface, but not as issuer revenue
    - Good ecosystem signal, weak revenue visibility
    - Provide staking volume, validator count, yield formula, and treasury capture rate
  - - Developer / application activity
    - Developers use protocol identity and credentials to build apps
    - API usage, credential checks, integration contracts
    - Implied by official positioning, no public pricing disclosed
    - Potentially scalable, not yet proven as cash flow
    - Disclose paid developer plans, free-to-paid conversion, and contract sizes
  - - Enterprise identity / credential services
    - Organizations could pay for reusable identity and financial or educational credential workflows
    - Per deployment / contract / verification volume
    - Use cases are public, monetization terms are not
    - Strategically important but unproven publicly
    - Show reference contracts, pilots vs production, pricing, and renewal terms
  - - Moongate event and loyalty rails
    - Ticketing, access control, loyalty, and real-world onboarding via acquired platform
    - Campaign / event / access workflow
    - Acquisition broadens surface but no contribution numbers are public
    - Interesting adjacency, no financial proof yet
    - Disclose Moongate revenue, margin, customer count, and attach to Human ID growth
  - - Fairdrop / community growth
    - Token emissions drive user acquisition and ecosystem engagement
    - Token allocation / campaign output
    - Clearly visible, but better viewed as incentive spend than earned revenue
    - Useful growth lever, not revenue quality
    - Quantify CAC-equivalent, fraud savings, and conversion from fairdrop user to retained user
  notes: Rows distinguish possible value-capture surfaces from disclosed accounting revenue; Humanity has not published segment revenue.
