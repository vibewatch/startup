- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Revenue by product line
    - Cannot separate token narrative from cash business
    - Request board deck or management P&L split
  - - Gross margin and hosting / verification cost
    - Cannot judge whether protocol usage is profitable
    - Request margin bridge and infra / biometric cost breakdown
  - - Cash balance and monthly burn
    - Cannot assess next-round timing
    - Request latest balance sheet and 12-month operating plan
  - - Retention and paid-customer cohorts
    - Cannot tell whether integrations expand into durable revenue
    - Request cohort tables for enterprise / developer customers
  - - Treasury and unlock governance
    - Cannot price dilution and sell-pressure risk
    - Request treasury wallet mapping, unlock schedule, and token committee policy
  - - Exploit remediation cost
    - Cannot size the economic damage from the June 2026 incident
    - Request incident cost ledger, legal reserve, and compensation plan
  notes: These are the minimum missing data points required before producing an investment-grade financial model.
