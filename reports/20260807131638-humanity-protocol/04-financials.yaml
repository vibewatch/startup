company:
  name: Humanity Protocol
chapter:
  number: 4
  title: Financials
summary: 'Public evidence supports Humanity Protocol as a well-funded but still weakly disclosed crypto identity network whose economics are driven more by token design, user incentives, and ecosystem buildout than by disclosed software revenue. The best-supported hard numbers are financing and tokenomics: about $50M of disclosed capital raised, a January 2025 $1.1B fully diluted valuation, a 10B-token maximum supply, and a 2026 public token market that traded below that financing benchmark. What remains missing are the actual underwriting essentials: revenue, gross margin, burn, runway, CAC, retention, and how much protocol activity converts into company cash flow.'
sections:
- id: token-economics-and-revenue-model
  title: Public economics are token-first, while cash-revenue mechanics remain mostly opaque
  body: 'Humanity does not present a conventional software price sheet. The clearest public economic artifact is the H token page, which describes a fixed-supply ERC-20 asset used to reward validators, power developers, and coordinate protocol participation. Fairdrop and staking materials reinforce the same picture: incentives and ecosystem growth sit at the center of the model. That is important because it changes what “financials” mean. The most visible value drivers are token issuance, supply unlocks, credential adoption, and treasury or ecosystem leverage rather than disclosed ARR or seat-based subscriptions. Public materials do imply multiple potential monetization paths — enterprise identity services, credential verification, developer tooling, treasury appreciation, and event or loyalty rails via Moongate — but none of the retained sources disclose contract pricing, realized take rates, or recognized revenue by line. The result is a real economic system with an unclear cash conversion
    path. Another way to frame the gap is that Humanity has published the supply-side logic of its network but not the income-statement logic of its business. Investors can see how tokens are allocated, when some buckets unlock, and why the community is supposed to care. They still cannot see how much of the resulting demand becomes fees, service revenue, or treasury value captured by the issuer rather than passed through to validators, users, or market traders.'
