    - Provide NRR/GRR and churn by segment
  - - Verification cost per active user
    - Not publicly disclosed
    - Low
    - Critical for biometric scaling economics
    - Provide unit cost per palm verification and ongoing credential update
  - - Validator payout efficiency
    - Not publicly disclosed
    - Low
    - Shows how much network spend leaks before value capture
    - Provide validator-reward formula and aggregate payout ratios
