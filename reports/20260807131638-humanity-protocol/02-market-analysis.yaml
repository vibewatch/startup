  - - Travel / loyalty / credential reuse
    - Portable loyalty, account linking, education and professional proofs
    - Traditional CRM systems that do not require reusable trust credentials
    - Partnership, product, and operations owners
    - Represents the real-world bridge from crypto-native identity to consumer utility.
  - - Status-quo substitutes
    - Centralized KYC vendors, social login, manual review, CAPTCHAs, government IDs
    - —
    - Incumbent budget owners across identity workflows
    - These substitutes cap pricing power and slow protocol migration.
