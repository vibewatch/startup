- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Deepfakes and injection attacks
    - Driver
    - Now
    - Raise urgency for stronger human-verification layers beyond static docs or passwords
    - Can Humanity’s assurance model resist deepfake and injection bypass at scale?
  - - Synthetic identity growth
    - Driver
    - Now
    - Makes continuous verification and higher-assurance onboarding more valuable
    - Where does Humanity outperform document-only vendors on synthetic identity?
  - - Agentic bot traffic and human-like automation
    - Driver
    - Now
    - Supports demand for proof-of-personhood in community, gaming, and account-creation flows
    - How much of Humanity’s current traction comes from anti-bot demand versus speculative token demand?
  - - EU digital identity and reusable credential policy
    - Driver
    - Medium term
    - Improves the policy case for portable credentials and cross-platform trust
    - Can Humanity interoperate with enterprise and regulatory wallet standards?
  - - FATF / NIST assurance expectations
    - Driver
    - Medium term
    - Favors vendors that can explain identity proofing, authentication, and governance clearly
    - Does Humanity’s model map cleanly onto mainstream assurance frameworks?
  - - Privacy and biometric-consent law
    - Constraint
    - Now
    - Raises legal and reputational cost of biometric identity systems
    - What jurisdictions can Humanity enter without major redesign or local storage controls?
  - - Standards fragmentation / issuer acceptance
    - Constraint
    - Medium term
    - Network effects fail if credentials are not accepted across issuers and relying parties
    - Which external issuers or institutions have already accepted Humanity credentials?
  - - Trust damage after security incidents
    - Constraint
    - Now
    - Makes buyers more cautious about protocols with concentrated key or token controls
    - What concrete post-incident controls can management show to enterprise buyers?
  notes: This register treats growth and friction symmetrically. The same AI-fraud wave that creates demand also raises assurance expectations and punishes governance weaknesses.
