company:
  name: Humanity Protocol
chapter:
  number: 2
  title: Market Analysis
  summary: 'Humanity Protocol sits inside a layered market rather than a single clean TAM: the broadest comparable pools are identity verification and biometrics, while its nearer wedge is privacy-preserving proof-of-personhood and reusable credential infrastructure for anti-bot, KYC, and credential portability use cases. The demand side is clearly strengthening as AI fraud, synthetic identities, and agentic bots rise, but standards fragmentation, biometric privacy law, and trust requirements keep Humanity’s true serviceable market much smaller than headline biometrics or identity-verification totals.'
sections:
- id: market-boundary-and-substitutes
  title: 'Market boundary: Humanity is selling a proof-and-credential layer, not the whole identity stack'
  body: 'The cleanest way to frame Humanity’s market is as the overlap between identity verification, proof-of-personhood, biometric assurance, and reusable digital credentials. Official Humanity materials do not describe a narrow crypto-only niche. They talk about KYC, loyalty, access control, fraud reduction, credential portability, and sybil-resistant application design. That means the included spend is not just blockchain identity wallets; it also includes liveness and biometric proofing, credential issuance and reuse, and selected anti-bot or anti-fraud workflows where proving a unique human matters. The excluded spend is just as important. Humanity is not addressing the whole IAM stack, password management, generic security operations, or every outsourced KYC workflow. The status quo remains fragmented: centralized KYC vendors, social-logins, manual document review, CAPTCHAs, and adjacent proof-of-personhood systems like World ID all solve slices of the same job. This boundary logic
    matters because it prevents investors from treating the full biometrics market or the full identity-verification market as Humanity’s realistic serviceable market. The right question is which subset of that spending values privacy-preserving, reusable human uniqueness enough to adopt a new networked protocol rather than a cheaper incumbent point solution.'
