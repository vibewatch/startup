    - Compliance, fraud, risk, and platform teams
    - Closest broad public market proxy for Humanity’s enterprise side.
  - - Biometric assurance
    - Palm, face, fingerprint, iris, hardware scanners, matching engines
    - Commodity sensors with no identity workflow or credential layer
    - Governments, enterprises, access-control operators
    - Important enabling layer, but much broader than Humanity’s actual protocol wedge.
  - - Decentralized digital identity / verifiable credentials
    - Wallets, credential issuance, issuer registries, privacy-preserving proofs
    - Pure token speculation or non-credential consumer wallets
    - Governments, ecosystems, credential issuers, platform operators
    - Closest architectural peer set for Humanity’s reusable identity thesis.
  - - Proof-of-personhood / anti-sybil
    - Bot resistance, fairdrop gating, governance integrity, community verification
    - Generic captcha-only spam control without persistent identity
    - Protocol foundations, growth, trust & safety teams
