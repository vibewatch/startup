- id: buyers-users-payers-and-adoption-path
  title: Buyers, users, payers, and the adoption path differ by segment
  body: 'Humanity’s buyer map is heterogeneous. In Web3, the near-term buyer is usually a protocol foundation, growth team, or ecosystem operator trying to block sybil farming, improve fair token distribution, or increase trust in governance and community incentives. In regulated onboarding, the buyer is more often a risk, compliance, fraud, or platform-security team that cares about lower false positives, better liveness, and reduced synthetic identity losses. In travel, hospitality, education, and professional credentials, the user may be the consumer, but the payer is more likely to be a platform, issuer, or partnership owner seeking lower onboarding friction and portable trust signals. Humanity’s own mainnet positioning around travel loyalty, financial credentials, and educational or professional proofs fits that model. The adoption path is therefore multi-step: users must enroll, stronger verification must be completed, issuers and platforms must recognize the credential, developers
    must integrate the tooling, and regulators or enterprise risk teams must accept the assurance model. That makes network effects possible but not automatic. A protocol like Humanity can become more valuable as more issuers and applications recognize a single Human ID, yet it can also stall if portable credentials are not standardized enough or if users do not progress beyond low-friction reservation into higher-assurance verification.'
