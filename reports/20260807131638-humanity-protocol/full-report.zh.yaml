      - number: '7.2'
        title: 2026 年 6 月攻击证明，运营安全是论点级风险
        blocks:
          - type: paragraph
            body: >-
              事件记录异常重要，因为它揭示了失败在实践中如何发生。Quantstamp 总结、第三方报道和恢复界面都指向同一方向： Humanity 2026 年 6
              月事件由钓鱼、恶意软件和被盗特权密钥驱动，而不是传统智能合约 bug。这个区分有实质意义。 它意味着公司的真实攻击面包括人员操作、密钥备份、桥管理和钱包卫生，而不只是链上代码。事件规模同样重要。报告指向
              未授权铸造、大规模代币盗窃，以及被流动性池、金库、智能合约仓位和快照后购买者复杂化的恢复流程。公司用事件总结、
              透明度工具、迁移机制和补偿流程回应，这是建设性的。但同一组动作也展示出，一个核心承诺是信任的产品背后，如今有
              多复杂的运营系统。因此，事件应被解读为控制系统失效，而不只是糟糕标题。智能合约审计无法阻止被钓鱼的操作员、被盗
              签名密钥或被攻破的桥管理。投资人因此需要证明，公司在攻击后改变了人员、流程和基础设施控制，而不是只替换代币后继续前进。
