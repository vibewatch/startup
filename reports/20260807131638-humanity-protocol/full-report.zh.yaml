            body: >-
              一旦问题从存在性证明转向耐久性证明，客户章节就会转为谨慎。公开记录没有披露付费客户数、留存、净收入留存、毛留存、
              流失、满意度或按收入计的客户集中度。它也高度依赖生态对手方；这对扩张有用，但如果伙伴没有转化为直接客户经济，
              风险也高。漏斗顶部用户和钱包指标同样容易被过度解读。它们证明采用兴趣，不证明合同质量。负面证据在这里也重要。 2026 年 6
              月攻击及随后的治理争论，会压低信任敏感买家的意愿，尤其是当身份产品要求用户和伙伴依赖长期凭证时。 因此，正确承销立场是混合的：Humanity 比许多早期身份协议有更强具名证明，但公开集合在续约、ACV
