  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 公开经济模型以代币为先，现金收入机制大多仍不透明
        blocks:
          - type: paragraph
            body: >-
              Humanity 没有展示传统软件价目表。最清晰的公开经济载体是 H 代币页面，它描述了一种固定供应的 ERC-20 资产， 用于奖励验证者、驱动开发者并协调协议参与。Fairdrop
              和质押材料强化了同一图景：激励和生态增长位于模型中心。 这很重要，因为它改变了“财务”的含义。最可见的价值驱动是代币发行、供应解锁、凭证采用，以及资金库或生态杠杆， 而不是已披露 ARR
              或按席位订阅。公开材料确实暗示多条潜在变现路径——企业身份服务、凭证验证、开发者工具、 资金库升值，以及通过 Moongate 提供活动或忠诚度基础设施——但纳入来源没有披露合同定价、实际抽成率或按业务线
              确认的收入。结果是，一个真实经济系统存在，但现金转化路径不清楚。换一种说法，Humanity 公布了其网络的供给侧逻辑，
              却没有公布其业务的利润表逻辑。投资人能看到代币如何分配、部分桶何时解锁，以及社区为什么应该在意。但他们仍看不到
              由此产生的需求有多少会转化为费用、服务收入，或由发行方捕获的资金库价值，而不是流向验证者、用户或市场交易者。
