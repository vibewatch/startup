        title: 具名证明最强的地方，是 Humanity 接入既有生态的地方
        blocks:
          - type: paragraph
            body: >-
              纳入集合中最好的客户证据，是具名且针对具体用例的。Open Campus 给 Humanity 提供了围绕可互操作学习者凭证和 面向机构采用的具体教育叙事。Moongate
              提供了最清晰的现实世界访问案例，覆盖票务、访问控制，以及收购前已披露的 30 多万张链上门票足迹。Fireblocks 提供的是机构可运营性，而不是终端客户身份证明，但它仍重要，因为它降低了已经
              活跃于数字资产的机构的工作流摩擦。Walrus 展示 Sui 相邻基础设施上的开发者如何消费身份信号；韩国 hackathon 文章则显示生态建设者在实践中使用这些接口。Mastercard
              叠加了围绕开放金融驱动 Human ID 的金融服务 野心层。合在一起，这些具名证明展示出跨多个垂直领域可信的先落地再扩张逻辑。它们还没有展示的是 ACV、合同
              期限或续约质量的直接透明度。额外的钱包、移动应用和机构分发文章加深了这幅图景。D’CENT 和 Hex Trust 把故事延伸到 钱包和机构支持入口；移动应用发布则暗示 Humanity
              正试图把生态认知转化为更可重复的消费者入口。这些都是有用证明点， 但仍更接近赋能和渠道扩张，而不是已披露合同收入。
