  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围，以及 Humanity 为何存在
        blocks:
          - type: paragraph
            body: >-
              Humanity Protocol 更像是在把自己包装成一层信任基础设施，而不是单一应用。其当前主页称，网络能让机构、 品牌、开发者和用户在不存储敏感用户数据的前提下验证声明；协议和文档页面则把 Humanity
              定义为一个可扩展的、 基于 EVM 的真人证明系统，核心是生物识别身份和零知识证明。产品定位覆盖市场两侧：企业和品牌获得保护隐私的 KYC、忠诚度、访问和欺诈工具，开发者获得抗女巫身份层，用户获得可携带的
              Human ID。技术差异点在掌纹路线。 官方和高管材料反复强调，掌纹和掌静脉信号比虹膜方案侵入性更低、也更容易规模化，尤其是在结合智能手机采集、 扫描硬件和自我主权身份设计时。落到尽调语言，Humanity
              想靠比 Worldcoin 更低的摩擦，同时声称比中心化 KYC 栈更强的隐私，拿下真人证明品类。
