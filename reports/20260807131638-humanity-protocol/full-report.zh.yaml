              Humanity 最强的公开证据不是财务披露，而是网络拉新的速度。2024 年 5 月融资公告称，项目出隐身模式后一个月内 已收集超过 50 万个候补名单注册。到 2024 年末，Humanity 称 2024
              年 9 月测试网已达到 100 万个 Human ID； 后续官方更新又把这一数字推到超过 500 万个 Human ID，再到接近 700 万个 Human ID、近 1000 万个钱包地址， 以及超过 500
              万名 RWT 持有人。第二阶段掌纹扫描推出后，又声称在生物识别验证从预约进入真实真人认证之前， 已预留超过 800 万个 Human ID。并行地，协议在 2025 年 6 月发行 $H，用 fairdrop
              概念包装抗机器人代币分发， 随后在 zkTLS 支持的凭证证明下上线主网。这个顺序重要，因为它展示了 Humanity 的运营模型：先捕获身份，其次
