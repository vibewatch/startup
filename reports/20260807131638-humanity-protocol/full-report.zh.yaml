  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户故事横跨用户、开发者、机构和伙伴，但直接付费方披露仍偏轻
        blocks:
          - type: paragraph
            body: >-
              Humanity 的公开记录已不再支持对客户基础的狭义解读。最明显的用户是创建 Human ID、随后完成更强验证的终端消费者。 但纳入集合还显示至少四类额外细分：在身份基础设施上构建的开发者，使用 Open
              Campus 的教育或凭证发行方，通过 Moongate 触达的活动或忠诚度运营方，以及通过 Fireblocks 和 Mastercard 式集成触达的机构或金融分发方。这种广度 很重要，因为它说明
              Humanity 可以讲一个多边平台故事，而不是单一应用故事。它也制造了一个反复出现的尽调问题。 公开材料很少区分买家、用户和付费方。学生、参会者、钱包持有人、机构或开发者都可能使用系统，但来源并不稳定披露
              谁签了合同、合同是否进入生产，或任何披露标识是否代表有意义的经常性支出。对 Humanity 来说，这种模糊尤其重要， 因为一些最强公开证明由伙伴驱动。在普通 SaaS
              公司里，标识列表或许仍暗示计费关系。在这里，一个被点名的对手方 可能只是分发盟友、生态集成方、钱包界面或用例展示方。因此，客户章节必须严格区分每项证明实际成立的内容。
