      - number: '2.4'
        title: 增长驱动很明显；监管和信任约束同样真实
        blocks:
          - type: paragraph
            body: >-
              Humanity 所在品类的需求驱动异常清晰。Entrust、LexisNexis 和 ID.me 都描述了一个身份欺诈环境：深度伪造、
              注入攻击、合成身份，以及越来越像真人的自动化流量，正在以传统验证控制难以承受的速度扩张。在这种环境里，真人 证明和可复用信任信号的经济价值会上升。监管背景也支持更强基础设施的需求。FATF 称，稳健的数字 ID
              可以降低成本、 改善尽调并扩大包容性；NIST 2025 年对 SP 800-63-4 的更新强化了证明、认证和联邦化的重要性；欧洲委员会的
              数字身份计划也显示，可携带凭证正在成为政策目标，而不只是加密实验。但同一环境也带来约束。生物识别系统面临 隐私、同意和公平性审查；World Economic Forum 材料强调，去中心化数字 ID
              仍需要适配用途的政策、标准和治理， 才能避免复制新的监控或滥用形态。对 Humanity 来说，市场增长的理由是对的，但采用会奖励那些把低摩擦与可信保障、
              互操作性和事件后信任结合起来的供应商，而不是只展示快速获客的供应商。
            claimRefs:
              - CM015
              - CM016
              - CM017
              - CM018
