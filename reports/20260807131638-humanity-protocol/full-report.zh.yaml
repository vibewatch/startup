      - number: '4.2'
        title: 融资和代币市场信号足以证明相关性，但不足以证明持久经营质量
        blocks:
          - type: paragraph
            body: >-
              最强的公开数字是融资和代币市场数据。多个来源支持其在 2024 年融资和 2025 年 1 月 Series A 中合计披露融资约 $50 million；后者被描述为 $1.1 billion
              完全稀释估值，而不是传统经审计企业价值。2026 年 8 月的代币市场页面 显示，网络现货市值约 $170 million、完全稀释价值约 $852 million，仍然很大，但低于此前融资标题。漏斗顶部使用
              指标也看起来亮眼：Humanity 报告过 100 万个 Human ID，随后约 700 万个 ID 和 1000 万个钱包。但这些是采用指标，
              不是付费需求证明。它们说明网络和代币在市场想象中达到有意义的规模；它们没有揭示系统实际产生多少收入、利润率或
              净现金。这个区别在这里比传统创业公司更重要，因为代币网络在纸面上可以显得很大，却仍为运营方产生有限当前现金。 买家因此必须对估值标题打折，直到管理层打开叙事背后的账本。
