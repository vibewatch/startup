  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 生物识别身份带来密集的隐私、制裁和跨境法律暴露
        blocks:
          - type: paragraph
            body: >-
              Humanity 不只是另一个加密代币项目。其条款和隐私政策清楚显示，掌纹验证、生物识别处理、制裁控制和对司法辖区敏感
              的访问限制，都是核心服务模型的一部分。这立刻把公司置于比典型消费者应用更严苛的法律环境。香港隐私规则强调合法、 公平收集、留存纪律和安全。GDPR 对生物识别数据的处理更严格，因为特殊类别数据不能被随意处理。如果
              Humanity 的 可复用凭证触达金融或消费者语境，美国隐私和安全预期也重要。公司自己的文件又增加一层：它们考虑供应商存储、在适用 法律下披露生物识别数据，以及 BVI
              管辖条款下的广泛暂停权。换句话说，风险不只是“监管也许有一天会到来”。敏感数据、 跨境、制裁和治理暴露已经写进运营设计。对投资人来说，关键含义是 Humanity 不能躲在“去中心化身份”这个说法后面。
              去中心化可以降低部分中心化数据库风险，但公司自己的法律文件显示，链下治理、处理方、执法请求、制裁逻辑和生物识别
              数据处理，都是现实世界运营模型的一部分。产品主张与这些运营现实之间只要出现错配，就可能很快变成法律和声誉问题。
