  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：Humanity 卖的是证明与凭证层，不是整套身份栈
        blocks:
          - type: paragraph
            body: >-
              界定 Humanity 市场最清晰的方式，是把它放在身份验证、真人证明、生物识别保障和可复用数字凭证的交叉处。 Humanity 官方材料没有描述一个狭窄的纯加密细分市场。它们讨论
              KYC、忠诚度、访问控制、欺诈降低、凭证可携带性 和抗女巫应用设计。这意味着纳入的支出不只是区块链身份钱包，也包括活体检测和生物识别验证、凭证发行与复用，以及在
              证明唯一真人很重要的场景中选定的反机器人或反欺诈工作流。被排除的支出同样重要。Humanity 并未覆盖整套 IAM 栈、密码管理、通用安全运营或所有外包 KYC 工作流。现状仍然碎片化：中心化 KYC
              供应商、社交登录、人工 证件审核、CAPTCHA，以及 World ID 等相邻真人证明系统，都在解决同一任务的不同切片。这个边界逻辑重要，因为 它能防止投资人把整个生物识别市场或整个身份验证市场当成
              Humanity 的现实可服务市场。真正的问题是：这类支出中 哪个子集足够重视保护隐私、可复用的人类唯一性，愿意采用一个新的网络化协议，而不是更便宜的现有点解决方案。
