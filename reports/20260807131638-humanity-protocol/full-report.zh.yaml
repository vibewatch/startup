        - 需要它判断稀释和抛压风险
        - 基金会 / 金库委员会
      - - 黑客事件后的控制变更
        - 没有独立证据证明密钥管理或运营控制已重新设计
        - 需要它承销复发风险
        - 安全审计 / 外部评估方
      - - 伙伴转化
        - 关键集成没有量化收入或生产落地深度
        - 需要它给选择权理性定价
        - 伙伴评分卡和已签客户证据
    notes: 这些是给出高确信度投资建议前必须完成的最低限度工作流。
    claimRefs:
      - CV030
      - CV035
      - CV038
      - CV040
