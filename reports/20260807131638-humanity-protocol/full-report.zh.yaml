  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品如今横跨真人证明、可携带凭证和身份感知应用
        blocks:
          - type: paragraph
            body: >-
              自早期“Worldcoin 竞争者”定位以来，Humanity 对外展示的产品范围已经明显扩展。主页、协议页面和文档如今呈现的是更广的 信任层：用户预留 Human
              ID，完成更强掌纹验证，持有钱包原生凭证，然后在需要真人证明、资格或声誉的应用中复用 凭证。主网和可验证凭证文章让产品野心更清晰。Humanity 不再只销售唯一性证明。它试图成为一张身份图谱，让教育、
              旅行、就业、社交和金融事实可以被选择性证明，而不用交出原始个人数据。这创造了比一次性注册更大的机会， 但也让产品执行更难，因为公司要解决的不只是生物识别，还有可携带性、开发者体验、发行、撤销，以及在许多应用语境
              中被接受。广度在战略上有吸引力，因为它给 Humanity 提供了多个切入市场的楔子：消费者身份、开发者工具、凭证编排
              和伙伴中介分发。它也抬高了执行门槛。一家公司可以早早做出吸引人的注册体验，却要很久以后才能证明凭证发行、撤销、
              可携带性和多应用认可可以在规模上可靠运行。因此，最重要的尽调问题不是产品地图是否雄心勃勃；而是那张地图背后的 运营细节是否足够快地追上来。
