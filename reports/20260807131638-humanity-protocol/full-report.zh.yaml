        title: 在收入和控制证据改善前，最站得住脚的结论是继续研究
        blocks:
          - type: paragraph
            body: >-
              最终建议会故意让动量投资者不够满意。按公开证据，Humanity
              还没有便宜到可以轻松买入，也没有坏到可以完全放弃。在当前附近的代币市场水平，这个故事只对能承受高风险、经营证据不完整，并且接受重大事故后重建信任这一前提的投资者有吸引力。转向买入，需要收入、留存、资金库治理和黑客事件后安全控制的硬证据。转向回避，则可以由又一次控制失败，或持续无法把生态关系转成持久经济性来证明。剩下的正确结论就是继续研究：中等信心、高风险；按实时价格看估值公平到偏投机，按旧融资头条看则偏贵。
