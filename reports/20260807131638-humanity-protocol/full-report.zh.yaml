  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接真人证明对手按硬件、社交图谱、担保和聚合路线分化
        blocks:
          - type: paragraph
            body: >-
              最接近的直接对手，是其他用于证明唯一真人、而不只是验证政府证件的系统。World ID 是最明显的可比对象：它营销 通用真人证明、消费者登录场景，以及围绕深度伪造防御、凭证和奖励扩展的工具包，但仍依赖基于 Orb
              的验证，并 背负虹膜扫描争议留下的包袱。BrightID 和 Proof of Humanity 位于设计光谱另一端。BrightID 是一个公共品、
              开源的社交身份网络，避免个人身份信息并依靠社交图谱分析；Proof of Humanity 则用资料、押金、担保和挑战流程 维护一份抗女巫真人列表。Human Passport
              是最强的非生物识别聚合型竞争者：它为空投、治理、防垃圾信息和 在线社区打包真人证明、ZK KYC 和数据服务。面对这组对手，Humanity 的核心押注是，掌纹生物识别加可复用凭证， 可以在不继承 World 的
              Orb 系统同等硬件摩擦的情况下，比社交或担保模型提供更低摩擦。换句话说，直接竞争者 对“真人性”的事实来源并不一致：World 信任专用硬件，BrightID 信任社交连接，Proof of Humanity
              信任社区担保 和挑战激励，Human Passport 信任可组合信号聚合。Humanity 要求市场信任生物识别加可复用凭证。
