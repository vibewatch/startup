      - number: '8.2'
        title: 上行来自战略期权，下行来自未解的信任和披露风险
        blocks:
          - type: paragraph
            body: >-
              没有理由把 Humanity 一笔抹掉。它产品线有宽度，有具名伙伴，也踩在 bot、欺诈和可复用凭证这些正在 crypto 和 AI 工作流里变大的问题上。Fireblocks、Moongate、涉及
              Mastercard 的报道和其他集成表明，只要执行改善，身份图谱可以接入多条变现路径。但看空理由同样成立。2026 年 6
              月的攻击永久改写了叙事。安全修复、治理可信度和代币供给治理，如今已经和估值绑在一起。企业 AI
              转向未来可能拓宽机会，但按现有证据，它在带来更多现金流之前，主要先增加执行不确定性。投资者因此一边被要求为期权和修复买单，一边还缺少给企业定价所需的常规经营数字。
