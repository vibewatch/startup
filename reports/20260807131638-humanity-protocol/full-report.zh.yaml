  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Humanity 的客户采用常从用户或合作伙伴问题切入，再沿身份、凭证和生态集成扩展。
    data:
      nodes:
        - id: discover
          label: 发现
          detail: 用户、开发者或合作伙伴发现需要抗 Sybil 或可复用凭证。
          tone: neutral
        - id: enroll
          label: 注册 / 集成
          detail: 用户创建 Human ID，或开发者集成 SDK / 凭证流程。
          tone: positive
        - id: verify
          label: 验证 / 签发
          detail: 掌纹验证和凭证签发加深信任。
          tone: positive
        - id: deploy
          label: 部署到流程
          detail: 教育、活动、机构运营或金融准入流程上线。
          tone: positive
        - id: expand
          label: 扩展
          detail: 身份在更多应用或合作伙伴渠道复用。
          tone: warning
    approximationNotes: 旅程图概括多个细分市场的可见客户逻辑，并非每类买家的字面漏斗。
    claimRefs:
      - CU001
      - CU002
      - CU020
      - CU025
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: wide
    summary: 公开证据在漏斗顶部最强；问题转向变现和留存后，证据变薄。
    data:
      items:
        - label: Human IDs / 钱包
          value: 10
          detail: 数百万个 ID 和钱包显示覆盖面。
          tone: positive
        - label: 具名合作伙伴部署
          value: 5
          detail: Open Campus、Moongate、Fireblocks、Walrus、Mastercard 提供具体证据点。
          tone: positive
        - label: 有量化结果的生产用例
          value: 3
          detail: Moongate 票务和 Fireblocks 覆盖范围是最清楚的量化案例。
          tone: warning
        - label: 已披露付费客户指标
          value: 1
          detail: 公开记录对 ACV、NRR 或收入客户几乎没有信息。
          tone: negative
    approximationNotes: 数值是证据权重等级，不是实际客户数。
    claimRefs:
      - CU003
      - CU007
      - CU009
      - CU017
      - CU018
      - CU028
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 具名证明在部署具体度和经济可见度上差异明显。
    data:
      columns:
        - 部署具体度
        - 结果具体度
        - 收入可见度
        - 战略价值
      rows:
        - label: Open Campus
          values:
            - 中
            - 中
            - 低
            - 高
        - label: Moongate
          values:
            - 高
            - 高
            - 低
            - 高
        - label: Fireblocks
          values:
            - 高
            - 中
            - 低
            - 高
        - label: Walrus
          values:
            - 中
            - 低
            - 低
            - 中
        - label: Mastercard
          values:
            - 中
            - 中
            - 低
            - 高
    approximationNotes: 单元格是基于保留来源细节的等级判断，不是合同披露。
    claimRefs:
