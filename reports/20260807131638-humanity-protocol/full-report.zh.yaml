      - CU008
      - CU010
      - CU012
      - CU032
      - CU033
  - id: FU004
    title: 客户证明流与耐久性缺口
    type: flow
    layout: wide
    summary: 公开证明从合作伙伴公告到可见用例这段很顺；一问到续约、ACV 和集中度，证据就转弱。
    data:
      nodes:
        - id: p1
          label: 合作伙伴 / 部署公告
        - id: p2
          label: 可见用例和用户价值
        - id: p3
          label: 量化触达或活跃
        - id: p4
          label: 合同 / 留存透明度
        - id: p5
          label: 可持续客户研判
      edges:
        - from: p1
          to: p2
        - from: p2
          to: p3
        - from: p3
          to: p4
        - from: p4
          to: p5
    approximationNotes: 该流程显示，保留客户集中的证据在哪里变薄。
    claimRefs:
      - CU014
      - CU017
      - CU019
      - CU023
      - CU034
      - CU035
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 生物识别、特权访问和合作伙伴驱动采用交汇处，残余风险最高。
    data:
      columns:
        - 发生可能性
        - 严重性
        - 缓释成熟度
      rows:
        - label: 生物识别隐私合规
          values:
            - 高
            - 高
            - 低
        - label: 特权密钥 / 运维安全失效
          values:
            - 高
            - 严重
            - 中
        - label: 合作伙伴集中度
          values:
            - 中
            - 高
            - 低
        - label: 保障 / 正常运行证明缺口
          values:
            - 中
            - 高
            - 低
        - label: 恢复执行失败
          values:
            - 中
            - 高
            - 中
    approximationNotes: 热力图用基于保留证据的等级排序，不使用合成概率。
    claimRefs:
      - CR007
      - CR008
      - CR014
      - CR023
      - CR025
      - CR037
      - CR040
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Humanity 的主要风险沿信任、合规和合作伙伴渠道传导，影响客户增长、财库灵活性和估值。
    data:
      nodes:
        - id: privacy
          label: 隐私 / 法律负担
          detail: 生物识别和跨境合规
          tone: warning
        - id: opsec
          label: 运营安全失效
          detail: 钓鱼、密钥盗窃、特权访问
          tone: warning
        - id: partner
          label: 合作伙伴依赖
          detail: 采用要靠交易对手传导
          tone: warning
        - id: trust
          label: 用户 / 合作伙伴信任
          detail: 敏感身份系统需要高信任度
          tone: warning
        - id: growth
          label: 客户转化
          detail: 从合作伙伴证明到持久采用
          tone: warning
        - id: treasury
          label: 财库 / 恢复成本
          detail: 代币迁移和补偿负担
          tone: warning
        - id: valuation
          label: 估值与融资
          detail: 残余风险给故事打折
          tone: negative
      edges:
        - from: privacy
          to: trust
        - from: opsec
          to: trust
        - from: partner
          to: growth
        - from: trust
          to: growth
        - from: opsec
          to: treasury
        - from: growth
          to: valuation
        - from: treasury
          to: valuation
        - from: trust
          to: valuation
    approximationNotes: 展示因果方向，不量化损失概率。
    claimRefs:
      - CR010
      - CR021
      - CR023
      - CR028
      - CR035
      - CR040
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: 关键外部依赖集中在存储、托管、分发和监管合法性。
    data:
      nodes:
        - id: humanity
          label: Humanity 核心栈
          detail: 生物识别身份、凭证和代币治理
          tone: neutral
        - id: walrus
          label: Walrus
          detail: 去中心化存储层
          tone: warning
        - id: fireblocks
          label: Fireblocks
          detail: 机构运营通道
          tone: warning
        - id: moongate
          label: Moongate
          detail: 现实活动和准入渠道
          tone: warning
        - id: opencampus
          label: Open Campus
          detail: 教育凭证渠道
          tone: warning
        - id: mastercard
          label: Mastercard 路径
          detail: 金融身份分发
          tone: warning
        - id: regulators
          label: 隐私 / 制裁监管机构
          detail: 外部法律关口
          tone: warning
      edges:
        - from: humanity
          to: walrus
        - from: humanity
          to: fireblocks
        - from: humanity
          to: moongate
        - from: humanity
          to: opencampus
        - from: humanity
          to: mastercard
        - from: humanity
          to: regulators
    approximationNotes: 依赖图只覆盖保留证据集中最显眼的外部具名依赖。
    claimRefs:
      - CR022
      - CR023
      - CR024
      - CR035
      - CR039
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议从战略相关性出发，经过风险和披露约束，落到对价格敏感的继续研究立场。
    data:
      nodes:
        - id: s1
          label: 真实品类需求和合作伙伴可选性
        - id: s2
          label: 重大黑客事件和信任压力
        - id: s3
          label: 没有公开收入 / 利润率 / 留存证明
        - id: s4
          label: 当前价格低于旧融资标题估值，但仍具投机性
        - id: s5
          label: 继续研究
      edges:
        - from: s1
          to: s4
        - from: s2
          to: s4
        - from: s3
          to: s4
        - from: s4
          to: s5
    approximationNotes: 建议逻辑是因果链，不是量化模型。
    claimRefs:
      - CV010
      - CV012
      - CV013
      - CV026
      - CV029
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 最能支撑的公开估值标记，是上一轮融资、当前实时 FDV 和当前流通市值。
    data:
      items:
        - label: 2024 年融资估值
          value: 1000
          unit: USD M
        - label: 2025 年融资 FDV
          value: 1100
          unit: USD M
        - label: 2026 年实时 FDV
          value: 852
          unit: USD M
        - label: 2026 年流通现货市值
          value: 170
          unit: USD M
    approximationNotes: 柱状图比较不同语境下的公开标记；它们不是同口径企业价值。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV006
      - CV008
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公开证据支持很宽的区间，因为估值更取决于信任修复和运营证明质量，而不是单一干净 KPI。
    data:
      items:
        - label: 悲观情景
          low: 300
          mid: 400
          high: 500
          displayValue: $0.3B-$0.5B FDV
          detail: 信任拖累持续，经济性仍不透明。
          tone: negative
        - label: 基准情景
          low: 700
          mid: 800
          high: 900
          displayValue: $0.7B-$0.9B FDV
          detail: 没有新增事件，信任有所恢复，但披露有限。
          tone: warning
        - label: 乐观情景
          low: 1100
          mid: 1250
          high: 1400
          displayValue: $1.1B-$1.4B FDV
          detail: 信任重建和合作伙伴转化恢复溢价。
          tone: positive
    approximationNotes: 区间来自公开标记和叙事风险推导的情景输出，不是折现现金流。
    claimRefs:
      - CV032
      - CV033
      - CV034
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 实时市场给出的信号足以评估价格和风险，但不足以有把握地评估业务质量。
    data:
      items:
        - label: 当前 H 价格
          value: ~$0.086
        - label: 当前现货市值
          value: ~$170M
        - label: 当前实时 FDV
          value: ~$852M
        - label: 历史融资 FDV
          value: $1.1B
        - label: 建议
          value: research-more
        - label: 风险评级
          value: high
    approximationNotes: KPI 混合数字和类别标记，因为公开证据在市场定价上比运营更强。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV026
      - CV028
      - CV040
