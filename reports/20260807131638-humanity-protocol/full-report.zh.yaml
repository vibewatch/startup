        blocks:
          - type: paragraph
            body: >-
              即便隐私和事件风险都被完美控制，Humanity 仍会面临严肃执行挑战。最强的公开采用证明很多都穿过对手方：Walrus、 Fireblocks、Open Campus、Moongate、Mastercard
              和其他生态伙伴。这些关系有价值，但也意味着 Humanity 的公开 牵引力部分借自它无法完全控制的外部基础设施。竞争又增加一层。反机器人和真人证明问题在增长，这有利于品类需求；
              但对手路线仍然可用，未来任何安全或隐私争议都可能把伙伴或用户推向替代方案。与此同时，投资人仍缺少认证、正常运行
              时间、直接付费客户留存，或多少伙伴公告已转化为耐久商业部署的强公开证据。结果是，风险画像被可见缓释措施改善，
              但仍高度暴露于复发、合规摩擦，以及从生态兴趣转化为可信运营结果时的失望。伙伴故事放大了这个担忧。如果采用仍主要
              由伙伴驱动，那么每增加一次集成，公司必须处理的外部信任、运营协调和失效面管理都会增加。在这些条件下，增长仍可能 有吸引力，但前提是底层控制环境变得明显强于 2026 年 6 月时的样子。
