      - number: '5.2'
        title: 最强公开技术证明来自文档和 SDK 接口层，而不是第三方基准
        blocks:
          - type: paragraph
            body: >-
              最能说明 Humanity 不只是故事的证据，来自其开发者接口层。SDK/API 文档明确把集成模型描述为类似 OAuth。公开的 TypeScript 和 React SDK 仓库展示了认证
              URL、令牌交换、预设验证、凭证轮询、钩子和测试 mock 等具体流程，比许多私有加密身份项目发布的内容具体得多。GitHub 组织也显示出数十个仓库和 2026 年 8 月仍有更新
              活动，暗示工程节奏仍在运行。架构侧的公开图景是分层的：主网加 zkTLS 用于证明 Web 原生事实，可由钱包持有并 选择性分享的凭证，以及可接入应用的 API 或智能合约接口。Walrus
              通过描述去中心化节点、静态加密的凭证数据和 验证回执，补充了更明确的存储与验证架构。即便如此，可获得的证明大多仍是自我描述。公开记录显示了这套栈应该如何
              工作；它并未独立验证这套栈能达到企业级表现。这在尽调中是一个有意义的优势，因为仓库和文档创造了可观察的实现细节。
              它们揭示命名约定、开发者假设、支持的预设，以及团队期待第三方构建的应用类型。同时，如果没有生产参考客户、 性能遥测或正式保障证据匹配，它们也可能夸大成熟度。
