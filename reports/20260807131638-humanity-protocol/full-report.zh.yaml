            body: >-
              在投资人最需要承销证据的地方，公开记录明显更薄。Humanity 官方沟通在社区增长、身份预约和生态愿景上很丰富， 但对当前员工数、法律实体图谱、董事会构成、客户集中度，以及从庞大漏斗顶部 ID
              基础转化出的收入披露很少。 2026 年 6 月，信任叙事也急剧走弱：一份被广泛引用的攻击报告描述了 $H 在 Ethereum 和 BNB Chain 上被 未授权铸造和出售、代币约 86%
              暴跌，以及公众指控内部人控制或特权密钥管理过度集中。即便公司更愿意把事件 描述为外部密钥泄露，而非协议设计失败，事件仍削弱了 Humanity 叙事中最干净的那一版：一个隐私优先的身份网络
              理应在结构上比现有替代方案更安全。因此，概览结论应保持平衡。Humanity 建立了有吸引力的品类叙事，展现出 罕见的拉新动能，并吸引了顶级加密投资人，但它尚未给出足够公开证据，把 Human ID
