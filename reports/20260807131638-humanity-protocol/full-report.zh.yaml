  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 市场把 Humanity 重新定价到低于融资头条，但还谈不上明显便宜
        blocks:
          - type: paragraph
            body: >-
              最容易犯的估值错误，是盯住单一数字。只看 2025 年 1 月 11 亿美元完全稀释估值，Humanity 仍像一只受伤后等着恢复的独角兽；只看今天约 1.7
              亿美元的流通市值，又像已经彻底坏掉。两种读法都不够。更克制的做法，是把三个公开标尺放在一起：上一轮融资 FDV、实时代币
              FDV、实时流通市值。这个框架能看出黑客事件后的真实重置，但不是网络意义归零。它也解释了为什么这家公司仍难承销：价格跑得远快于披露质量。投资者仍看不到公开的收入、利润率、留存或资金库明细。也就是说，市场发现的是一个代币价格，不是站得住脚的内在价值。在代币化系统里，这个区别更关键：供给机制可以撑住很大的名义
              FDV，而当前持有人能兑现的市场价值小得多。忽视这个价差，投资者会把稀缺误判成便宜；忽视剩余战略价值，又会反过来把资产按网络完全没有未来期权来定价。
            claimRefs:
