        blocks:
          - type: paragraph
            body: >-
              公司的公开领导叙事高度集中在创始人兼 CEO Terence Kwok 身上。纳入资料中的访谈和发布材料一贯把他定位为 Humanity
              隐私与生物识别论点的创始人、公开战略制定者和首席解释者；最早的发布公告还突出 Yat Siu 和 Sandeep Nailwal，把他们作为有影响力的 founding-human
              和生态支持者，而不是运营高管。资本形成速度很快， 且高度加密原生。Humanity 2024 年 5 月种子轮由 Kingsway Capital 领投，Animoca
              Brands、Blockchain.com、 Hashed、Shima Capital 等参投，融资 $30 million、估值 $1 billion；2025 年 1 月又完成由 Pantera
              Capital 和 Jump Crypto 领投的 $20 million 融资，完全稀释估值 $1.1 billion。仅这两轮就确认了至少 $50 million 的 公开披露资本。它们也说明，投资人押注的是
              Humanity 的协议野心和网络效应，而不是已披露收入。因此，标准利益 相关方地图与其说围绕董事会治理，不如说围绕创始人中心性、战略 Web3 支持者、验证者 / 社区一致性，以及 Humanity
              Foundation 和代币基础设施周围仍不透明的控制权。
