      - number: '4.3'
        title: 资本形成看起来可信，但现金续航和单位经济仍藏在公司控制的披露背后
        blocks:
          - type: paragraph
            body: >-
              从尽调角度看，Humanity 可以融资，但还不能被充分承销。它确实已经融资、发行代币激励、扩展到主网，并用恢复与
              透明度界面回应了一次严重攻击。但这些都不能替代判断现金续航或利润率质量所需的私有指标。公开记录仍未披露收入、
              毛利率、现金消耗、账面现金、留存、客户集中度、CAC、回本周期或单用户验证成本。攻击事件又增加了一层不确定性，因为
              恢复义务、运营整改和信任修复都可能消耗资源，而不创造持久收入。相比一家上市身份软件公司，Humanity 的披露集
              极其单薄。因此，正确财务结论应保持谨慎：公司有足够资本、产品动能和代币基础设施，值得被认真对待；但投资人仍需要
              资料室，才能有信心为收入质量、资本充足性或事件后韧性定价。本章因此把未知项视为真实尽调阻塞点，而不是用 软件式经验法则把它们抹平。如果 Humanity
              最终展示经常性收入、有吸引力的贡献利润率，并控制事件后资金库暴露， 投资判断可以很快改善。但仅凭纳入的公开记录，正确立场仍是受证据约束，而不是乐观。
