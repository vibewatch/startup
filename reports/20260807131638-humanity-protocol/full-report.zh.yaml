      - number: '2.2'
        title: 规模测算视角：广义相邻市场很大，可用切入点窄得多
        blocks:
          - type: paragraph
            body: >-
              公开市场规模只能支持分层看法。Mordor Intelligence 估计，2026 年身份验证市场为 $15.78 billion，到 2031 年增至 $26.8 billion，CAGR 约
              11.2%；更广义的生物识别市场更大，2026 年为 $67.86 billion，预计 2031 年达到 $136.86 billion，CAGR 约
              15.1%。这些数字说明，买家已经在身份核验和生物识别保障上投入真金白银， 但它们不能证明 Humanity 能覆盖全部支出。Humanity 更近的切口更小，因为许多生物识别部署是物理访问或国家运营
              系统，不需要去中心化凭证；许多以证件为中心的 KYC 流程也不需要持续的真人证明。地理位置也重要。Mordor 显示 北美当前支出领先，而亚太在身份验证和生物识别两个市场中增速最快。这对 Humanity
              在方向上有利，因为公司的公开 足迹与亚洲相关，早期增长叙事也更偏互联网原生，而非网点银行原生。尽管如此，最强的可服务市场视角不是单一自上 而下的 TAM
              数字；而是一组由身份验证、生物识别和数字凭证复用锚定的相邻市场，其中真人证明层是更窄但演化更快 的子板块。
