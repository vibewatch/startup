      - number: '2.3'
        title: 买家、用户、付费方和采用路径因细分市场而异
        blocks:
          - type: paragraph
            body: >-
              Humanity 的买家地图很杂。在 Web3，近期买家通常是协议基金会、增长团队或生态运营方，目标是阻止女巫刷量、
              改善公平代币分发，或提升治理和社区激励中的信任。在受监管准入流程中，买家更常是风险、合规、欺诈或 平台安全团队，关心更低误报、更好活体检测和更少合成身份损失。在旅行、酒店、教育和职业凭证场景里，用户可能是
              消费者，但付费方更可能是平台、发行方或合作负责人，他们要降低准入摩擦并获得可携带的信任信号。 Humanity 自己围绕旅行忠诚度、金融凭证、教育或职业证明的主网定位符合这个模型。因此，采用路径是多步骤的：
              用户必须注册，更强验证必须完成，发行方和平台必须认可凭证，开发者必须集成工具，监管者或企业风险团队必须接受 这套保障模型。这让网络效应成为可能，但不会自动发生。随着更多发行方和应用认可单一 Human
              ID，Humanity 这样的 协议会更有价值；但如果可携带凭证的标准化不足，或用户没有从低摩擦预约走向更高保障验证，它也可能停滞。
