      - number: '8.3'
        title: 公开可比公司更多说明披露折价，而不是给出干净倍数
        blocks:
          - type: paragraph
            body: >-
              可比分析只有保持谦逊才有用。Okta、Coinbase 和 Palantir 规模大得多，透明度也远高于 Humanity。它们的市值展示了身份软件、上市 crypto
              基础设施和高溢价数据平台叙事的上限，但对尽调最大的价值是披露对照。上市公司文件会把收入、利润率、流动性、风险和治理说清楚，Humanity 做不到。这不等于 Humanity
              没有价值；这意味着投资者在借用任何上市公司光环之前，先要打上很重的披露和治理折价。因此，本章可比表是框架工具，不是把 Humanity
              硬塞进一个公开记录无法支持的伪收入倍数。公开可比仍能用来校验野心：当身份与信任业务把赛道位置、可验证经济性和可信控制环境配在一起时，可以长得很大。Humanity
              已经站在赛道上；缺的是一层证据，让外部人知道这种位置是否正在复利成持久企业价值。
