  - - Pantera Capital and Jump Crypto
    - Lead investors in January 2025 round
    - Defined the last disclosed $1.1B fully diluted valuation and reinforced the protocol’s crypto-native institutional backing
    - Request exact security purchased, token/equity mix, unlock terms, and side-letter rights.
