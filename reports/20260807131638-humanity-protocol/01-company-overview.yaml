    - Strategic backers and distribution validators
    - Provide ecosystem reach, credibility, and access to builders, gaming, and broader Web3 integration surfaces
    - Request commercial obligations, validator roles, and any preferential token access.
  - - Humanity community / validators / $H holders
    - Network participation base
    - Token launch and fairdrop structure make community incentives central to growth and security claims
    - Request staking concentration, validator distribution, and fairdrop retention behavior.
  - - Humanity Foundation / issuer infrastructure
    - Operational and control layer
    - Post-hack discourse suggests foundation-level key management and bridge control are economically material to risk
    - Request legal-entity map, custody policies, and privileged-key governance.
