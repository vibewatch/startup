company:
  name: Humanity Protocol
chapter:
  number: 1
  title: Company Overview
  summary: Humanity Protocol has built a high-visibility decentralized identity narrative around palm-based proof-of-humanity, rapid top-of-funnel Human ID growth, and two richly priced 2024-2025 financings, but the open record remains much stronger on onboarding metrics than on governance depth, monetization, or current headcount. By August 2026 the company can be described as a Hong Kong-rooted Web3 identity protocol led by Terence Kwok, valued publicly at $1.1 billion fully diluted in its last disclosed round, and carrying fresh trust damage from a June 2026 token exploit.
sections:
- id: identity-product-and-positioning
  title: Identity, product scope, and why Humanity exists
  body: 'Humanity Protocol presents itself less as a single app than as a trust infrastructure layer. Its current home page says the network lets institutions, brands, developers, and users verify claims without storing sensitive user data, while its protocol and documentation pages define Humanity as a scalable EVM-based proof-of-humanity system built around biometric identity and zero-knowledge proofs. The product positioning spans both sides of the market: enterprises and brands get privacy-preserving KYC, loyalty, access, and fraud tools, while developers get a sybil-resistant identity layer and users get a portable Human ID. The technical differentiator is the palm-based approach. Official and executive materials repeatedly argue that palm prints and palm-vein signals are less invasive and easier to scale than iris-based alternatives, especially when combined with smartphone capture, scanner hardware, and self-sovereign identity design. In practical diligence terms, that means Humanity
    is trying to win the proof-of-personhood category by promising lower friction than Worldcoin while still claiming stronger privacy than centralized KYC stacks.'
