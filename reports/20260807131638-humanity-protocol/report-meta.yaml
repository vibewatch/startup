companyProfile:
  summary: Humanity Protocol is a Hong Kong-based biometric identity network led publicly by founder and CEO Terence Kwok. Its product story spans palm-based proof-of-humanity verification, reusable credentials, developer-facing identity rails, and partner-led distribution across education, events, institutional crypto workflows, and anti-fraud use cases. Public evidence supports meaningful funding momentum and top-of-funnel adoption, but the operating business remains financially under-disclosed and governance confidence was damaged by the June 2026 exploit.
