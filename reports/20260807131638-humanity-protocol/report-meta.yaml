  headquarters: Hong Kong
  productSummary: Humanity sells a proof-of-humanity stack built around palm biometrics, decentralized identifiers, verifiable credentials, developer APIs and SDKs, and a tokenized network that supports validators and ecosystem participation.
  customerFocus: End users creating Human IDs, developers integrating identity checks, education and event ecosystems, and institutional or financial-distribution partners rather than a disclosed base of direct enterprise payers.
  businessModel: Public materials imply a mix of token incentives, validator economics, developer and ecosystem activity, and future enterprise credential or verification services, but the exact fee model remains undisclosed.
  stage: Series A / token-network private company
  fundingStatus: Humanity disclosed a $30M 2024 round at a $1B valuation and a January 2025 $20M Series A at a $1.1B fully diluted valuation; public capital raised is at least about $50M.
