      - number: '3.2'
        title: Adjacent enterprise incumbents may matter more than some web3 peers
        blocks:
          - type: paragraph
            body: >-
              The competitive story changes when the buyer is a regulated enterprise rather than a token-driven
              community. Persona’s public site shows why: it now markets itself as a flexible and secure way to verify
              real people and businesses online, displays blue-chip customer logos, and highlights recognition from
              Gartner and Forrester. Its product footprint spans government ID, document AI, selfie recognition, digital
              ID, KYB, KYA, reverification, and risk reports, which is much broader than Humanity’s current public
              product proof. Onfido and Jumio remain important substitutes even though their public pages were
              access-constrained in this run, because they represent the mainstream category of incumbent KYC and
              liveness vendors that many buyers will reach for first. Civic is instructive for a different reason: its
              public website now centers AI-agent integration, GTM workflows, and auth tooling, implying that a
              once-better-known identity brand has shifted strategic focus away from this exact arena. Fractal ID is
              harder to assess because its site was unavailable during retrieval, but that lack of visibility itself is
              a competitive signal. The biggest substitute, therefore, may be a hybrid stack: an incumbent KYC vendor
              for regulated assurance plus a separate anti-sybil layer such as Human Passport, BrightID, or internal
              heuristics.
