      - number: '8.3'
        title: Public comps frame the disclosure discount more than they frame a clean multiple
        blocks:
          - type: paragraph
            body: >-
              Comparable analysis is useful only if it stays humble. Okta, Coinbase, and Palantir are all much larger
              and much more transparent than Humanity. Their market caps show the outer bounds of what identity
              software, listed crypto infrastructure, and premium data-platform narratives can become, but their biggest
              value for diligence is the disclosure contrast. Public-company filings spell out revenue, margins,
              liquidity, risks, and governance in ways Humanity does not. That does not mean Humanity deserves no value.
              It means investors should apply a substantial disclosure and governance discount before borrowing any
              public-company halo. The comparable table in this chapter is therefore a framing tool, not a basis for
              forcing Humanity into a fake revenue multiple that the public record cannot support. The public comps are
              still helpful as a sanity check on ambition. They show that identity and trust businesses can become very
              large when they pair category relevance with verifiable economics and credible control environments.
              Humanity has category relevance already. What it lacks is the proof layer that lets outsiders know whether
              that relevance is compounding into durable enterprise value.
            claimRefs:
              - CV016
