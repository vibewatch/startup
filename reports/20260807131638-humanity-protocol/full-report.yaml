chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and why Humanity exists
        blocks:
          - type: paragraph
            body: >-
              Humanity Protocol presents itself less as a single app than as a trust infrastructure layer. Its current
              home page says the network lets institutions, brands, developers, and users verify claims without storing
              sensitive user data, while its protocol and documentation pages define Humanity as a scalable EVM-based
              proof-of-humanity system built around biometric identity and zero-knowledge proofs. The product
              positioning spans both sides of the market: enterprises and brands get privacy-preserving KYC, loyalty,
              access, and fraud tools, while developers get a sybil-resistant identity layer and users get a portable
              Human ID. The technical differentiator is the palm-based approach. Official and executive materials
              repeatedly argue that palm prints and palm-vein signals are less invasive and easier to scale than
              iris-based alternatives, especially when combined with smartphone capture, scanner hardware, and
              self-sovereign identity design. In practical diligence terms, that means Humanity is trying to win the
              proof-of-personhood category by promising lower friction than Worldcoin while still claiming stronger
              privacy than centralized KYC stacks.
