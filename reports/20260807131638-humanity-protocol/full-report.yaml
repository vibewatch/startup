      - number: '2.4'
        title: Growth drivers are obvious; regulatory and trust constraints are equally real
        blocks:
          - type: paragraph
            body: >-
              The demand drivers behind Humanity’s category are unusually visible. Entrust, LexisNexis, and ID.me all
              describe an identity-fraud environment where deepfakes, injection attacks, synthetic identities, and
              increasingly agentic or human-like bots are scaling faster than legacy verification controls were built to
              handle. In that environment, proof-of-personhood and reusable trust signals become more economically
              valuable. Regulatory context supports the need for stronger infrastructure as well. FATF says robust
              digital ID can lower cost, improve due diligence, and expand inclusion; NIST’s 2025 update to SP 800-63-4
              reinforces the importance of proofing, authentication, and federation; and the European Commission’s
              digital identity initiative shows that portable credentials are becoming a policy objective, not just a
              crypto experiment. But the same environment creates constraints. Biometric systems face privacy, consent,
              and fairness scrutiny, and World Economic Forum materials emphasize that decentralized digital ID still
              needs fit-for-purpose policy, standards, and governance to avoid reproducing new forms of surveillance or
              misuse. For Humanity, that means the market is growing for the right reasons, but adoption will reward
              vendors that combine low friction with credible assurance, interoperability, and trust after incidents—not
              vendors that only show rapid user acquisition.
            claimRefs:
