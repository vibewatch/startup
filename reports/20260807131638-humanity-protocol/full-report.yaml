      - number: '1.3'
        title: Rollout, traction, and the milestone sequence that later chapters should reuse
        blocks:
          - type: paragraph
            body: >-
              Humanity’s strongest open evidence is not financial disclosure but network-onboarding velocity. The May
              2024 round announcement said the project had already collected more than half a million waitlist signups
              within a month of emerging from stealth. By late 2024 Humanity said the September 2024 testnet had reached
              one million Human IDs, and later official updates stepped that figure up to over five million Human IDs,
              then to close to seven million Human IDs, nearly ten million wallet addresses, and more than five million
              RWT holders. The phase-two palm-scan rollout then claimed more than eight million reserved Human IDs
              before biometric verification moved from reservation into actual human authentication. In parallel, the
              protocol launched $H in June 2025, used the fairdrop concept to frame bot-resistant token distribution,
              and later pushed mainnet live with zkTLS-backed credential proofs. This sequencing matters because it
              shows Humanity’s operating model: capture identities first, deepen verification second, then layer tokens,
              attestations, and real-world integrations on top. For later chapters, the milestone table here should be
              treated as the single chronology of record.
