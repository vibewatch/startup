  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The market has repriced Humanity below its funding headline, but not into obvious cheapness
        blocks:
          - type: paragraph
            body: >-
              The easiest valuation mistake is to anchor on one number. If an investor uses only the January 2025 $1.1
              billion fully diluted valuation, Humanity can still look like a wounded unicorn waiting to recover. If the
              investor uses only today’s circulating market cap near $170 million, the company can look permanently
              broken. Neither reading is sufficient. The more disciplined approach is to use all three public markers
              together: prior financing FDV, live token FDV, and live circulating market value. That framing shows a
              real post-hack reset, but not a collapse to zero relevance. It also shows why the company is still hard to
              underwrite. Price has moved much faster than disclosure quality. Investors still do not have public
              revenue, margin, retention, or treasury detail. That means the market has discovered a token price, but
              not a defensible intrinsic value. That distinction matters even more in a tokenized system because supply
              mechanics can preserve a large headline FDV while the realized market value available to current holders
              is much smaller. An investor who ignores that spread can mistake scarcity for cheapness. An investor who
              ignores the remaining strategic value can make the opposite mistake and underwrite the asset as if the
              network has no future option value at all.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV022
              - CV037
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV008
      - number: '8.2'
        title: The upside case is strategic optionality, while the downside case is unresolved trust and disclosure risk
        blocks:
          - type: paragraph
            body: >-
              There is a real reason not to dismiss Humanity outright. It has product breadth, named partners, and
              category exposure to the bot, fraud, and reusable-credential problems that are growing across crypto and
              AI-linked workflows. Fireblocks, Moongate, Mastercard-related coverage, and other integrations show that
              the identity graph could plug into several monetization lanes if execution improves. But the bearish case
              is equally real. The June 2026 exploit permanently changed the story. Security recovery, governance
              credibility, and token-supply governance are now inseparable from valuation. The enterprise-AI pivot may
              eventually broaden the opportunity, yet on current evidence it mostly increases execution uncertainty
              before it produces more cash flow. Investors are therefore being asked to pay for optionality and recovery
              while still missing the ordinary operating numbers used to price businesses.
            claimRefs:
              - CV010
              - CV011
