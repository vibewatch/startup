              and payer. A student, attendee, wallet holder, institution, or developer may all use the system, but the
              sources do not consistently reveal who is signing a contract, whether that contract is production, or
              whether any disclosed logo reflects meaningful recurring spend. That ambiguity is especially important for
              Humanity because some of the strongest public proof is partner-led. In a normal SaaS company, a logo list
