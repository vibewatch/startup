      - number: '8.4'
        title: Research-more is the most supportable call until revenue and control evidence improve
        blocks:
          - type: paragraph
            body: >-
              The final recommendation should stay intentionally unsatisfying to momentum investors. Humanity is not
              cheap enough on public evidence to earn an easy buy, and it is not broken enough to dismiss entirely. Near
              current token-market levels, the story becomes interesting only for investors who can tolerate high risk,
              incomplete operating proof, and a thesis that depends on rebuilding trust after a major incident. A move
              to buy would require hard evidence on revenue, retention, treasury governance, and post-hack security
              controls. A move to avoid would be justified by another control failure or by continued inability to turn
              ecosystem relationships into durable economics. That leaves research-more as the right call, with medium
              confidence, high risk, and a valuation stance that is fair-to-speculative near live levels but stretched
              near the old funding headline.
            claimRefs:
