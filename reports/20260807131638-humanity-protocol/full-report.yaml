      - number: '1.2'
        title: Leadership, funding history, and who matters economically
        blocks:
          - type: paragraph
            body: >-
              The company’s public leadership story is concentrated around founder and CEO Terence Kwok. Retained
              interviews and launch materials consistently identify him as the founder, public strategist, and chief
              explainer of Humanity’s privacy and biometrics thesis, while the earliest launch announcement also
              highlights Yat Siu and Sandeep Nailwal as influential founding-human and ecosystem backers rather than
              operating executives. Capital formation has been fast and highly crypto-native. Humanity’s May 2024 seed
              round brought in $30 million at a $1 billion valuation led by Kingsway Capital with participation from
              Animoca Brands, Blockchain.com, Hashed, Shima Capital, and other investors; the January 2025 round then
              added $20 million led by Pantera Capital and Jump Crypto at a $1.1 billion fully diluted valuation. Those
              two financings alone establish at least $50 million of publicly disclosed capital. They also show that
              investors were underwriting Humanity on protocol ambition and network effects rather than on disclosed
              revenue. The canonical stakeholder map is therefore less about board governance than about founder
              centrality, strategic Web3 backers, validator/community alignment, and the still-opaque control rights
              around the Humanity Foundation and token infrastructure.
