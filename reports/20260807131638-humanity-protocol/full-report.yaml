      - number: '1.4'
        title: Governance, adverse signals, and what remains materially unverified
        blocks:
          - type: paragraph
            body: >-
              The open record is materially thinner where investors most need underwriting evidence. Humanity’s official
              communications are rich on community growth, identity reservations, and ecosystem aspirations, but sparse
              on current employee count, legal-entity map, board composition, customer concentration, and revenue
              conversion from its large top-of-funnel ID base. The trust narrative also weakened sharply in June 2026,
              when a widely cited exploit report described unauthorized minting and selling of $H across Ethereum and
              BNB Chain, an ~86% token collapse, and public accusations that insider controls or privileged-key
              management were too concentrated. Even if the company’s preferred framing is an external key compromise
              rather than a protocol design failure, the incident still undercuts the cleanest version of Humanity’s
              pitch: that a privacy-first identity network should be structurally safer than incumbent alternatives. The
              right overview conclusion is therefore balanced. Humanity has built a compelling category narrative, shown
              unusual onboarding momentum, and attracted elite crypto investors, but it has not yet provided enough open
              evidence to treat Human ID growth as proof of durable monetization or mature governance.
            claimRefs:
              - CO027
              - CO031
              - CO034
