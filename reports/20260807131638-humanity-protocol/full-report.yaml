      Humanity progressed from stealth launch to financing, testnet scale, tokenization, mainnet activation, palm-scan
      rollout, and then a major security setback within roughly two years of public visibility.
    data:
      items:
        - date: 2024-Q1
          label: Stealth launch
          detail: Protocol unveiled on Polygon CDK with palm-recognition identity thesis.
        - date: 2024-05
          label: Seed round
          detail: $30M at $1B valuation.
        - date: 2024-09
          label: Testnet live
          detail: Human ID reservation phase begins.
        - date: 2024-12
          label: 1M IDs
          detail: Officially reported milestone after testnet launch.
        - date: 2025-01
          label: Series A
          detail: $20M at $1.1B FDV led by Pantera and Jump.
        - date: 2025-06
          label: $H fairdrop
          detail: Token and staking economics become active.
        - date: 2025-2026
          label: Mainnet + zkTLS
          detail: Web2-to-Web3 credential proofs and partner integrations go live.
        - date: 2026-06
          label: Exploit
          detail: Privileged-key incident drives sharp token collapse and governance scrutiny.
