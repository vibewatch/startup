            body: >-
              From a diligence perspective, Humanity is financeable but not fully underwriteable. It has clearly raised
              capital, launched token incentives, expanded into mainnet, and responded to a serious exploit with
              recovery and transparency surfaces. Yet none of that substitutes for the private metrics needed to judge
              runway or margin quality. The public record still does not disclose revenue, gross margin, burn, cash on
              hand, retention, customer concentration, CAC, payback, or verification cost per user. The exploit adds
              another layer of uncertainty because recovery obligations, operational remediation, and trust repair can
              all absorb resources without creating durable revenue. Compared with a public identity software company,
              Humanity’s disclosure set is exceptionally thin. The right financial conclusion is therefore cautious: the
              company has enough capital, product momentum, and token infrastructure to matter, but investors still need
              a data room before they can price revenue quality, capital adequacy, or post-incident resilience with
              confidence. This chapter therefore treats unknowns as real diligence blockers instead of smoothing them
              away with software-style heuristics. If Humanity eventually shows recurring revenue, attractive
              contribution margins, and controlled post-incident treasury exposure, the case can improve quickly. On the
              retained public record alone, though, the correct stance is still evidence-constrained rather than
