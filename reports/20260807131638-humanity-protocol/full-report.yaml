            body: >-
              The strongest public numbers are financing and token-market data. Multiple sources support about $50
              million of disclosed capital raised across the 2024 round and the January 2025 Series A, while the latter
              was framed at a $1.1 billion fully diluted valuation rather than a traditional audited enterprise value.
              Token-market pages in August 2026 put the network at roughly $170 million of spot market capitalization
              and about $852 million of fully diluted value, which is still large but below the prior financing
              headline. Top-of-funnel usage metrics also look impressive: Humanity reported 1 million Human IDs, then
              roughly 7 million IDs and 10 million wallets. But those are adoption indicators, not proof of paid demand.
              They show that the network and token reached meaningful scale in the market’s imagination; they do not
              reveal how much revenue, margin, or net cash the system actually produces. That distinction matters more
              here than in a traditional startup because token networks can look very large on paper while still
              producing limited current cash generation for the operator. A buyer therefore has to discount valuation
