      - number: '2.2'
        title: 'Sizing lenses: broad adjacencies are large, but the usable wedge is much narrower'
        blocks:
          - type: paragraph
            body: >-
              Open market sizing supports only a layered approach. Mordor Intelligence places the 2026
              identity-verification market at $15.78 billion, growing to $26.8 billion by 2031 at roughly 11.2% CAGR,
              while the broader biometrics market is far larger at $67.86 billion in 2026 and forecast at $136.86
              billion by 2031 at roughly 15.1% CAGR. Those figures show that buyers already spend real money on identity
              proofing and biometric assurance, but they do not prove that Humanity can address all of it. Humanity’s
              nearer wedge is smaller because many biometrics deployments are physical access or state-run systems that
              do not need decentralized credentials, while many document-centric KYC flows do not need persistent
              proof-of-personhood. Geography also matters. Mordor shows North America leading current spend while
              Asia-Pacific posts the fastest growth in both identity verification and biometrics. That is directionally
              favorable for Humanity because the company’s public footprint is Asia-linked and its early growth
              narrative is internet-native rather than branch-banking-native. Still, the strongest serviceable market
              lens is not a single top-down TAM number; it is a stack of adjacent markets anchored by identity
              verification, biometrics, and digital-credential reuse, with the proof-of-personhood layer treated as a
              narrower but faster-evolving subsegment.
