- id: switching-costs-moats-and-risk
  title: Moat durability depends on acceptance and trust, not on sign-up counts alone
  body: No competitor in this market wins on every axis. World has stronger consumer awareness and a dedicated hardware moat but also more regulatory and privacy sensitivity. BrightID and Proof of Humanity appeal to privacy-oriented and governance-oriented communities but can feel slower or harder to scale to mainstream onboarding. Human Passport already has measurable web3 distribution and a composable multi-stamp model, which makes it a strong substitute for airdrop, governance, and community integrity use cases that do not want biometrics at all. Persona and enterprise incumbents are harder to displace in regulated onboarding because they already fit compliance workflows and have visible customer references. That leaves Humanity in an attractive but unstable middle ground. If palm-based verification truly proves easier to scale than Orb hardware and more usable than vouching-heavy systems while still supporting reusable credentials, Humanity can carve out a distinctive position. If not,
    buyers can multi-home, mix vendors, or default to whichever layer is most mature for their exact workflow. The key moat variables are therefore issuer acceptance, developer integration, post-incident trust, and whether Human ID becomes a credential other applications actually recognize. That also means competitive analysis cannot stop at product claims. It has to ask which systems get accepted by issuers, which are tolerated by regulators, and which survive real security or governance stress without losing buyer confidence.
