- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Competitor
  - Price / unit / contract model
  - Included capabilities
  - Discounts or unknowns
  - Implication
  rows:
  - - Humanity Protocol
    - No public list pricing in retained set; economics tied to protocol adoption and tokenized participation
    - Human ID, palm verification rollout, credentials, fairdrop / staking ecosystem
    - Commercial package terms for enterprise buyers remain undisclosed
    - Buyers cannot easily benchmark TCO versus enterprise incumbents yet.
  - - World ID
    - No public self-serve enterprise price in retained set
    - Proof of human, deep face, face auth, credentials, rewards
    - Commercial terms not public; hardware footprint is material
    - World may monetize through ecosystem/network effects rather than simple SaaS.
  - - BrightID
    - Community / public-good model; no standard enterprise pricing in retained set
    - Social-graph uniqueness, social recovery, fair-access proofs
    - Monetization appears less standardized than SaaS IDV
    - Appeals to privacy-minded communities more than procurement-led buyers.
  - - Proof of Humanity
    - Registry / challenge / vouch mechanics; no clear SaaS pricing in retained set
    - Verified human registry, airdrops, governance, certifications
    - Economic model is not positioned as classic enterprise software
    - Useful for governance contexts but harder to benchmark financially.
  - - Human Passport
    - API / data-service style positioning; no transparent public rate card in retained set
    - Real-time sybil checks, data services, ZK KYC, partner integrations
    - Likely package- and volume-dependent
    - Competes on web3 distribution and composability more than on list-price transparency.
  - - Persona / enterprise incumbents
    - Demo-led enterprise contracts, not simple public pricing
    - IDV, KYB, KYA, risk reports, reverification, case management
    - Public list prices remain limited or custom
    - Enterprise buyers may still prefer incumbents because opaque pricing is normal in compliance software.
  notes: The market is overwhelmingly opaque on pricing. Unknowns are explicit rather than guessed.
