tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - World ID / World
    - Biometric proof-of-personhood network
    - Consumer-scale network ambitions; exact current verified-user count not established in retained set
    - Consumer apps, rewards, social, gaming, live events
    - Orb-verified unique human proof, credentials, rewards, deepfake tools
    - Hardware dependency and heavier privacy/regulatory baggage around iris verification
  - - BrightID
    - Social-graph proof-of-uniqueness
    - Community-led public good; team roster visible on site
    - Web3 communities, voting, fair access
    - Nonintrusive, open-source, no PII, social recovery
    - Social graph onboarding can be slower and less enterprise-friendly
  - - Proof of Humanity
    - Vouching and challenge registry
    - Open human registry model; no disclosed enterprise scale in retained set
    - Governance, airdrops, social, certifications
    - Deposit, vouch, and challenge mechanics emphasize sybil resistance
    - Higher friction and slower enrollment than mobile-first systems
  - - Human Passport
    - Aggregator / anti-sybil data layer
    - 2M+ passports, 120+ partners, 43M+ credentials, $512M+ airdrops secured
    - Airdrops, governance, communities, spam prevention
    - Composable stamps, hashed signals, strong web3 distribution
    - Less differentiated on biometric uniqueness because it aggregates many signals instead
  - - Persona
    - Enterprise identity-verification platform
    - Mainstream customer roster and 2026 Gartner / 2025 Forrester recognition highlighted publicly
    - Fintech, marketplaces, crypto, government, education, workforce
    - Broad workflow breadth across IDV, KYB, KYA, reverification and risk
    - Not a purpose-built decentralized proof-of-personhood network
  - - Humanity Protocol
    - Palm-biometric credential network
    - $50M+ disclosed capital and strong Human ID growth, but enterprise scale not publicly proven
    - Web3 identity, anti-sybil, credential reuse, selected real-world integrations
    - Palm print plus palm-vein strategy aims to balance accessibility, privacy, and uniqueness
    - Must prove trust, issuer acceptance, and revenue conversion against more mature rivals
  notes: Scale fields mix directly disclosed metrics and clearly marked unknowns; many competitors do not publish directly comparable user, revenue, or contract counts.
