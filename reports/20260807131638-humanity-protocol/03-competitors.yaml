- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Palm biometrics are lower friction than Orb hardware
    - World can still win on consumer awareness and a purpose-built hardware moat
    - High
    - Demand empirical conversion, dropout, and accuracy data by modality and geography.
  - - Human ID can become a reusable credential layer
    - Buyers may multi-home and use separate KYC plus anti-sybil stacks instead
    - High
    - Request live issuer roster, repeat-usage data, and cross-app credential reuse rates.
  - - Privacy-first biometrics beat social or vouching models
    - Privacy-minded communities may still prefer non-biometric systems like BrightID, PoH, or Human Passport
    - Medium
    - Prove adoption in communities that currently reject heavier biometric collection.
  - - Rapid Human ID growth creates distribution advantage
    - Growth can commoditize if signups do not convert into trusted integrations or paid workflows
    - High
    - Request activation, verification completion, and monetization cohorts.
  - - Web3 roots create defensibility in airdrops and governance
    - Human Passport already has deep distribution in those exact workflows
    - High
    - Show why palm uniqueness wins versus multi-stamp aggregation on fraud, UX, or retention.
  - - Humanity can bridge web3 and enterprise identity
    - Persona and other incumbents already own enterprise trust and customer references
    - High
    - Request enterprise case studies, compliance controls, and referenceable production customers.
  notes: This risk register focuses on durable competitive threats rather than feature gaps alone.
