chapter:
  number: 3
  title: Competitors
  summary: 'Humanity Protocol competes in a fragmented field where no single rival dominates every buying criterion: World leads the consumer-biometric narrative, Human Passport leads the web3 anti-sybil aggregator model, BrightID and Proof of Humanity lead community-trust and social/vouching approaches, and Persona plus other enterprise incumbents lead mainstream compliance workflows. Humanity’s advantage is its attempt to combine reusable credentials, mobile-accessible palm biometrics, and web3-native incentives, but that middle-ground positioning is only defensible if it converts onboarding scale into accepted credentials and trusted integrations.'
sections:
- id: direct-proof-of-personhood-rivals
  title: Direct proof-of-personhood rivals split by hardware, social graph, vouching, and aggregation
  body: 'The closest direct rivals are other systems built to prove a unique human rather than merely validate a government document. World ID is the most obvious comparator: it markets universal proof of human, consumer sign-in use cases, and a growing toolkit around deepfake defense, credentials, and rewards, but it still depends on Orb-based verification and carries baggage from the iris-scan debate. BrightID and Proof of Humanity sit at the other end of the design spectrum. BrightID is a public-good, open-source social identity network that avoids personally identifying information and relies on social graph analysis, while Proof of Humanity uses profiles, deposits, vouching, and challenge processes to maintain a sybil-resistant list of humans. Human Passport is the strongest non-biometric aggregator competitor: it packages proof-of-personhood, ZK KYC, and data services for airdrops, governance, spam prevention, and online communities. Against that set, Humanity’s central bet is that
    palm biometrics plus reusable credentials can deliver lower friction than social or vouching models without inheriting the same hardware friction as World’s Orb system. Another way to say this is that direct rivals disagree on the source of truth for “humanness”: World trusts dedicated hardware, BrightID trusts social connections, Proof of Humanity trusts community vouching and challenge incentives, and Human Passport trusts composable signal aggregation. Humanity is asking the market to trust biometrics plus reusable credentials.'
