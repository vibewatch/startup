"callouts":
- "calloutType": "risk"
  "title": "Integration remains the master risk because public proof is heavier on messaging than on outcomes"
  "body": "The available evidence says Cohesity is moving quickly and talking clearly, but it still does not show the cohort-level renewal, conversion, or support outcomes that would make the Veritas combination look de-risked."
  "claimRefs":
  - "CR004"
  - "CR005"
  - "CR040"
  - "CR041"
  - "CR043"
- "calloutType": "insight"
  "title": "Regulation amplifies go-to-market risk rather than replacing it"
  "body": "The main regulatory danger is not a single headline enforcement event against Cohesity today; it is that customers in finance, government, and critical infrastructure increasingly want auditable control evidence, not just resilient product messaging."
  "claimRefs":
  - "CR015"
  - "CR016"
  - "CR019"
  - "CR021"
  - "CR023"
  - "CR024"
- "calloutType": "assumption"
  "title": "IPO upside should be treated as optional until disclosure readiness becomes observable"
  "body": "Management may reach the public market in 2026, but underwriting should assume that de-risking is earned only when combined-company reporting readiness, cap-table clarity, and post-merger operating proof all become visible."
  "claimRefs":
  - "CR034"
  - "CR035"
  - "CR036"
  - "CR039"
  - "CR042"
  - "CR044"
