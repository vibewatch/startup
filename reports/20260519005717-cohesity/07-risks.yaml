- "id": "disclosure-financing-and-kill-criteria"
  "title": "Private-company opacity means investors need hard monitoring triggers"
  "body": "Cohesity remains a private company asking investors to underwrite a public-company-scale story with private-company disclosure. The investor-relations page is promotional and even notes that internal data shown there has not been independently verified. Media coverage suggests management wants a 2026 IPO only after it can present a full year of combined results, and the public narrative frames the Veritas combination as a risky pairing of a fast-growing but historically unprofitable Cohesity with a larger profitable asset base. That can be a strong strategic setup, but it also leaves real cap-table, debt, refinancing, and ownership questions unanswered in the public record. Investors should therefore treat financing optionality as conditional, not banked. The cleaner underwriting move is to anchor on monitorable triggers: support-signal deterioration, delayed disclosure readiness, adverse government-compliance events, or evidence that inherited customers are not renewing or converting\
    \ smoothly. If those triggers move the wrong way, the thesis should be reevaluated quickly rather than averaged down on narrative."
