"chapter":
  "number": 7
  "title": "Risks"
  "summary": "Cohesity’s risk profile is dominated by execution after the Veritas combination: the company has real mitigation evidence on continuity, security architecture, and regulatory alignment, but public proof on migration outcomes, support stability, and disclosure maturity remains thin. Regulatory and sovereign requirements, open competitor attacks, and private-company opacity all raise the cost of a misstep, so underwriting should rely on monitored triggers rather than narrative alone."
"sections":
- "id": "integration-and-transition"
  "title": "Integration after the Veritas combination is the master risk"
  "body": "Cohesity’s biggest risk is not whether it can tell a continuity story but whether the merged operating system behind that story becomes boringly reliable. Public evidence shows real progress: the company launched a unified partner program, talked up RecoveryAgent as an early Veritas-derived output, and kept repeating that no customer would be left behind. The same evidence set also shows why execution risk remains elevated. Veritas partner infrastructure still showed transition notices, independent analysis said inherited customers were most concerned about pricing, support, and product direction, and there is still no public disclosure of conversion, churn, or renewal behavior for inherited NetBackup and Alta customers. That matters because the combined company is now large enough that ordinary friction can become material quickly. A merger of product lines, channel programs, support motions, and installed bases can fail slowly rather than theatrically, so this chapter treats\
    \ integration as the central lens through which the rest of the risk stack should be read."
