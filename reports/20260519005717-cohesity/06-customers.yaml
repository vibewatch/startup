figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Publicly visible customer journeys typically start with resilience or compliance pain, move through a proof-oriented evaluation, then expand from core backup into vaulting, SaaS protection, or AI-linked workflows.
  approximationNotes: Journey stages are synthesized from named customer stories, partner materials, and post-merger roadmap pages. They represent the dominant pattern visible in public evidence, not an audited average sales process.
  data:
    nodes:
    - id: urgency
      label: 1. Triggering event
      detail: A ransomware scare, compliance requirement, cloud migration, or restoration bottleneck creates urgency for change in a regulated or operationally critical environment.
    - id: evaluation
      label: 2. Multi-vendor evaluation
      detail: Customers compare immutable backup, restore speed, management simplicity, and cloud or sovereignty support before selecting Cohesity.
    - id: core-deploy
      label: 3. Initial core backup deployment
      detail: The first production scope usually covers core backup and recovery for on-prem, SaaS, databases, or NAS workloads.
    - id: operate
      label: 4. Recovery and governance operating loop
      detail: Customers begin weekly drills, policy automation, restore delegation, or security-governed workflows once the system is trusted in production.
    - id: expand
      label: 5. Expansion or renewal
      detail: Expansion pathways include FortKnox, Microsoft 365, Google workloads, Gaia, Nutanix or Kubernetes support, or government-cloud procurement routes; post-merger materials position migration as voluntary.
  claimRefs:
  - CU013
  - CU017
  - CU020
  - CU029
  - CU034
  - CU036
