  - FU003
- id: durability-and-expansion
  title: Durability signals are positive but incomplete; expansion is visible through modules, hyperscalers, and regulated workloads
  body: 'Cohesity’s public durability evidence is directionally positive but still incomplete for the merged entity. The strongest historical signal remains legacy Cohesity’s net expansion above 130 percent in 2021. More recent public evidence comes from review and reference surfaces rather than hard renewal disclosure: Gartner Peer Insights recognition for an eighth time in 2026, plus generally strong Capterra and G2 aggregates, indicate continuing customer satisfaction. Yet the same review surfaces also surface real friction around training, reporting, restore-from-cloud speed, governance of remote interfaces, and support responsiveness. Expansion logic is easier to see than retention math. Public stories repeatedly show backup deployments expanding into FortKnox, Microsoft 365, Google workloads, SaaS delivery, Gaia, or broader cyber-resilience programs. On the channel side, AWS, Google, Microsoft, SHI, WWT, and Presidio all appear in recent partner materials, implying that growth is not
    purely direct-led. The missing piece is cohort transparency: public sources still do not show current NRR, GRR, churn, or renewal economics for the combined customer base.'
