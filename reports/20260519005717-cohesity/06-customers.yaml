  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: post-merger-retention
    missingEvidence: Current NRR, GRR, logo churn, and renewal cohorts for the combined Cohesity plus inherited Veritas customer base.
    whyItMatters: The central underwriting question is whether broad post-merger customer counts convert into durable recurring revenue without concession-heavy renewals or migration leakage.
    diligencePath: Request monthly ARR bridges, renewal cohorts by legacy product family, migration-tool adoption rates, and support-escalation data for the first twelve months after close.
    relatedQuestionRefs:
    - QU008
    - QU014
    - QU015
    - QU025
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-20 customer ARR, contract lengths, renewal dates, and any customer or channel concentration by revenue.
    whyItMatters: Named stories prove quality of use cases, but they do not show whether a small number of very large accounts or inherited maintenance pools dominate revenue.
    diligencePath: Ask management for top-account concentration schedules, top-renewal calendars, and segment-level exposure split across native Cohesity, inherited Veritas, and partner-sourced channels.
    relatedQuestionRefs:
    - QU001
    - QU025
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-population
    missingEvidence: An exhaustive list of current production references by industry, geography, and deployment mode, plus which ones are reference-call ready.
    whyItMatters: The public customer-story pool is clearly non-exhaustive and over-indexed toward polished success stories, so diligence should not assume it represents the full active base.
    diligencePath: Request the current customer-reference catalog with industry, deployment status, outcome metrics, renewal status, and permission status for investor calls.
    relatedQuestionRefs:
    - QU003
    - QU006
    - QU021
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: migration-execution
    missingEvidence: Evidence that promised post-merger migration tooling is broadly live, used by customers, and associated with stable renewal outcomes.
    whyItMatters: Support promises are helpful, but switching-risk underwriting depends on actual migration behavior, tool readiness, and customer willingness to move between product families.
    diligencePath: Request migration playbooks, tool screenshots, completed migration counts, average migration duration, rollback rates, and renewal economics for customers who did and did not migrate.
    relatedQuestionRefs:
    - QU014
    - QU015
    - QU023
