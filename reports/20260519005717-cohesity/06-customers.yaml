  approximationNotes: Stage values reflect public proof counts or company-count claims, not audited internal conversion data. The figure is intended to show evidence density by stage, not literal CRM funnel conversion.
  data:
    items:
    - stage: Broad merged customer base claim
      value: 12000
      label: More than 12,000 customers at 2024 close; broadest scale signal but not specific deployment proof
    - stage: Named public customer stories reviewed
      value: 8
      label: Eight named deployment stories were retained as direct public proof for this chapter
    - stage: Named stories with quantified outcomes
      value: 6
      label: Six named stories disclose concrete restore, speed, savings, or capacity metrics
    - stage: Named stories showing clear expansion beyond core backup
      value: 5
      label: Five stories visibly extend into vaulting, SaaS protection, compliance automation, or AI use cases
    - stage: Post-merger continuity sources with migration commitments
      value: 4
      label: Four retained sources directly address support continuity and voluntary migration for inherited customers
