- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / concentration risk
  - Impact path
  - Current evidence
  - Magnitude / implication
  - Diligence path
  rows:
  - - Inherited Veritas installed-base renewals and migrations
    - Largest pool for expansion or churn after the merger
    - Roadmap promises years of support, voluntary migration, and future tooling
    - Potentially very large upside, but the same area is the biggest renewal-risk blind spot
    - Request renewal cohorts, conversion counts, and price-concession history for inherited NetBackup and Alta customers
  - - Cloud and hyperscaler channel expansion
    - Partners can source, deploy, and upsell cloud backup, sovereign vaults, and AI workflows
    - AWS SCA, AWS Gov Cloud listing, Google Cloud award, and partner awards all show active channel motion
    - Meaningful growth lever, but partner dependency can also dilute support accountability
    - Measure ARR by partner-sourced channel and partner-led support escalations
  - - Module expansion inside regulated accounts
    - Core backup can expand into FortKnox, M365, Google workloads, Gaia, or compliance-heavy recovery programs
    - Bethany, Maryland, RB, Nasdaq, and AWS/Google materials all show adjacent workflow expansion
    - Positive land-and-expand logic if attach rates are real
    - Request attach rates for FortKnox, cloud services, SaaS backup, and Gaia by installed-base cohort
  - - Review-platform support and training friction
    - Operational friction can slow renewals and reduce willingness to adopt new modules
    - Capterra, G2, and PeerSpot all surface training, reporting, setup, and support complaints
    - 'Medium risk: not thesis-breaking alone, but material if combined with merger complexity'
    - Inspect support KPI dashboards, training adoption, and product-telemetry evidence for restore success
  - - Revenue concentration opacity
    - Named logos may not match revenue concentration or renewal timing
    - No public top-customer revenue schedule or renewal calendar was found
    - Material underwriting gap because a few very large accounts could dominate ARR
    - Request top-20 ARR, term, and renewal-calendar disclosure
  - - Customer-count optics vs proof quality
    - Large post-merger customer counts can overstate current same-platform deployment depth
    - Broad counts are disclosed, but most hard proof comes from a smaller set of curated named references
    - Important analytical risk when translating logos into durable adoption
    - Separate native Cohesity cohorts, inherited Veritas cohorts, and reference-ready production accounts in diligence materials
  notes: This table mixes upside drivers and risks. It distinguishes public support promises from missing evidence on actual migration, retention, and concentration outcomes.
