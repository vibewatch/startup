company:
  name: Cohesity
chapter:
  number: 6
  title: Customers
  summary: Cohesity has real public customer proof across regulated and operationally critical environments, especially government, healthcare, financial-services, and large-enterprise IT, and the post-Veritas merger clearly expanded broad customer-count scale. The strongest public evidence comes from named deployments with concrete restore, compliance, or efficiency metrics, while the biggest remaining underwriting gaps are current combined-entity retention, concentration, and migration-conversion data.
sections:
- id: customer-base-mix
  title: 'Customer mix: broad scale claims exist, but named proof is the higher-quality lens'
  body: 'Cohesity has both a broad-count story and a named-proof story, and they should not be blended. The broad-count story comes from company materials: about 2,600 customers in fiscal 2021 and more than 12,000 customers after the Veritas combination closed in December 2024. Those numbers matter for scale, but they do not prove that the same platform, buyer, or cohort quality sits behind every logo. The named-proof story is more valuable for this chapter because it shows where Cohesity is actually being trusted with live workloads. Public examples span pediatric healthcare, municipal IT, state shared services, Japanese hospital systems, Icelandic payment rails, capital-markets backup, food production operations, and large European retail IT. That mix suggests Cohesity can sell into central infrastructure teams that protect regulated or operationally critical data, not just generic backup buyers. The caveat is that public proof remains curated: it says more about vertical breadth and workload
    seriousness than about revenue concentration, renewal depth, or average account size.'
  claimRefs:
  - CU001
  - CU003
  - CU027
  - CU028
  - CU042
  - CU044
  tableRefs:
  - TU001
  figureRefs:
  - FU004
- id: deployment-patterns
  title: Deployment patterns skew toward regulated hybrid environments and cyber-resilience workflows
  body: 'The public deployments in this chapter cluster around hybrid, compliance-sensitive environments where recovery speed matters more than backup marketing. Detroit uses Cohesity across municipal workloads, Microsoft 365, and Google services; Maryland uses it for shared-service NAS backups across roughly 40 agencies on Cisco UCS with a cyber-vault design; Musashino uses it for patient-care and hospital operations under Japan’s business-continuity expectations; RB uses it for national payment systems under DORA and PCI DSS; and Nasdaq uses it to protect both Microsoft 365 and remaining on-premises Exchange while keeping data in jurisdiction-specific regions. That is a coherent pattern: Cohesity lands where recovery, immutability, and sovereign-placement controls matter, then adds vaulting, cloud, or compliance automation. Federal evidence reinforces that pattern. The AWS GovCloud listing, DISA approval memo, and JITC certification show that government suitability is not just a marketing
    page claim. Public-sector penetration therefore looks real, though exact federal revenue and contract flow are still opaque.'
  claimRefs:
  - CU013
  - CU015
  - CU017
  - CU018
  - CU020
  - CU023
  - CU032
  - CU033
  tableRefs:
  - TU002
  figureRefs:
  - FU001
  - FU002
- id: named-customer-proof
  title: Named customer proof is strongest when the case study includes operational metrics, not just a logo and quote
  body: 'The best public proof does more than say a customer exists; it shows what changed after deployment. Maryland and Detroit are the cleanest public-sector examples because they disclose restore-time and labor or cost improvements, not just satisfaction language. Musashino offers the strongest healthcare metric with 500 GB recovered in 20 seconds during a business-continuity drill, while RB provides the clearest financial-infrastructure proof with a 30-40 TB Oracle database restored in under eight hours and automated weekly testing. Nasdaq is valuable because it links backup to concrete SaaS governance and data-sovereignty workflows at scale. Bethany and Conagra add mission criticality even where the metrics are thinner, while Schwarz IT broadens European enterprise relevance despite light quantitative detail. Put differently, named proof is real and multi-vertical, but quantified outcomes are concentrated in a subset of stories. That makes reference-call selection important: some stories
    demonstrate hard operating leverage, while others mainly demonstrate category fit and brand credibility.'
  claimRefs:
  - CU012
  - CU014
  - CU016
  - CU019
  - CU021
  - CU024
  - CU025
  - CU026
  - CU028
  tableRefs:
