tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Named proof / scale
  - Deployment pattern
  - Revenue / strategic value
  - Gap
  rows:
  - - Large enterprise central IT
    - 'Buyer: infrastructure or backup leadership; user: platform admins; payer: enterprise IT'
    - Nasdaq, Schwarz IT, Conagra, plus legacy Fortune 500 penetration
    - Hybrid backup plus SaaS protection, cyber resilience, and cloud governance
    - Supports large-ticket recurring backup and adjacent module attach
    - Public sources do not break out average contract value or renewal rates by enterprise cohort
  - - Public sector and shared-service IT
    - 'Buyer: state or municipal IT leadership; user: backup teams and agency admins; payer: taxpayer-funded IT budgets'
    - City of Detroit, Maryland DoIT, DISA and AWS Gov Cloud procurement signals
    - On-prem plus vault, Cisco UCS, shared-service backups, federal suitability
    - Strategically important for regulated proof and procurement credibility
    - No public federal contract revenue or win-rate disclosure
  - - Healthcare providers
    - 'Buyer: CIO or IT leadership; user: infrastructure and compliance teams; payer: provider IT budgets'
    - Bethany Children’s and Musashino Red Cross Hospital
    - EMR and patient-data recovery, business-continuity drills, FortKnox or HPE-based deployments
    - High-value regulated use cases that support vaulting and recovery upsell
    - Public evidence is case-study heavy and light on multi-hospital renewal or cohort data
  - - Financial infrastructure and services
    - 'Buyer: infrastructure or platform-security teams; user: DB and messaging admins; payer: central technology budgets'
    - Reiknistofa bankanna, Nasdaq, and legacy top-bank exposure claim
    - Payment-system resiliency, Oracle restore, Microsoft 365 and Exchange protection, data-residency controls
    - Strong trust signal because outages or compliance failures are highly visible
    - Exact financial-services ARR mix and bank-by-bank retention are not disclosed
  - - Manufacturing and operational environments
    - 'Buyer: enterprise infrastructure leaders; user: plant and central IT teams; payer: corporate IT'
    - Conagra and broader plant-operations story
    - Protection across both corporate systems and operational environments
    - Shows Cohesity can reach cyber-physical or downtime-sensitive operations
    - Public outcome detail is thinner than in healthcare, finance, or government stories
  - - Inherited Veritas installed base
    - 'Buyer: NetBackup or Alta admins; user: backup teams; payer: existing maintenance or renewal budgets'
    - Broad post-merger customer-count and roadmap materials, but few named migration completions
    - Support continuity first, migration optionality later
    - Potentially the largest expansion pool if renewals hold and migration tools work
    - Public evidence does not quantify conversion, churn, or cross-sell by inherited cohort
  notes: This table separates broad customer-count claims from named public proof. Strategic value reflects likely monetization or proof value, not disclosed revenue by segment.
