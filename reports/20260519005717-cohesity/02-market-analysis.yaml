tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - IDC data replication and protection software
    - Backup, replication, recovery, and related software vendor revenue
    - Storage hardware, unrelated security tools, and generic IT services
    - IT infrastructure and data-protection budget owners
    - Cleanest bounded core market with a public 2024 software estimate
  - - Cyber-recovery
    - Backup plus data survival, integrity, clean recovery, and response tooling
    - Traditional DR that lacks cyber-specific controls
    - CIO/CISO-backed resilience programs
    - Critical adjacency because buyers now expect recovery after attack, not only restore after outage
  - - SaaS data protection
    - Protection for enterprise SaaS apps beyond native tooling
    - Native app retention features used as the status quo
    - IT buyers managing growing SaaS estates
    - Explains why breadth of app coverage matters in procurement
  - - Public-sector and regulated resilience
    - Backup, recovery, GovCloud deployment, certification work, and compliant operations
    - Unregulated commodity storage with no compliance or continuity need
    - Federal/state/local agencies and regulated operators
    - Evidence shows a distinct regulated-buyer motion with certification gates
  - - Managed resilience services
    - MSP-delivered backup, replication, recovery, vaulting, and DRaaS wrappers
    - Pure labor-only consulting with no recurring protection stack
    - MSPs, channel partners, and their end customers
    - Expands adoption path beyond direct enterprise software purchasing
  notes: Rows define category boundaries rather than audited revenue buckets. Included and excluded spend preserve analyst and vendor wording so adjacent cyber-recovery and SaaS-protection layers are visible without pretending they are one uniform market.
