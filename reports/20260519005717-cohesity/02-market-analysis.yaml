  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam-som-gap
    missingEvidence: A management-grade bridge from the $12.2-$12.3B IDC core market to Cohesity’s claimed $30B/$40+B TAM, plus the subset management treats as real SAM and near-term SOM.
    whyItMatters: Without that bridge, investors cannot tell whether the company’s market-language inflation reflects new adjacencies, double counting, or a defendable serviceable-market expansion.
    diligencePath: Request the board or finance TAM workbook used for the Veritas merger and any post-close refresh showing geography, buyer segment, direct versus channel mix, and attach rates.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: payer-opacity
    missingEvidence: Segment-level evidence on who signs, owns budget, and pays for Cohesity deployments after the Veritas combination, including indicative contract sizes or pricing units.
    whyItMatters: Market attractiveness depends on whether spend sits with CIO infrastructure budgets, CISO cyber budgets, recovery compliance programs, or channel-managed service bundles.
    diligencePath: Ask sales leadership for anonymized recent deal examples by segment showing signer title, budget owner, unit economics, and direct versus MSP-delivered contract structure.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM003
  - type: conflicting-data
    severity: material
    topic: tam-bridge
    missingEvidence: A normalized market-definition walk-through reconciling the >$30B February 2024 TAM, the $40+B December 2024 TAM, the $12.2-$12.3B IDC core market, and peer public-company platform TAMs.
    whyItMatters: Preserving contradictory estimates is better than forcing a single number, but valuation work still needs a defendable apples-to-apples market frame.
    diligencePath: Cross-check investor decks, board materials, and banker analyses used in the Veritas transaction and map each number to included workloads, geography, and services.
    relatedQuestionRefs:
    - QM006
    - QM008
    - QM023
    relatedTableRefs:
    - TM002
  - type: access-blocked
    severity: minor
    topic: idc-detail-access
    missingEvidence: Full IDC market-share tables, category breakouts, and forecast detail behind the public abstracts and secondary summaries reviewed here.
    whyItMatters: The public abstracts are enough to anchor market definitions and buying criteria, but not enough to build a precise share bridge or subsegment CAGR model.
    diligencePath: Purchase the cited IDC tracker and MarketScape reports or request licensed excerpts from management, then reconcile them with the public abstracts used in this chapter.
    relatedQuestionRefs:
    - QM009
    - QM023
    relatedTableRefs:
    - TM002
