- id: sizing-lenses
  title: Sizing Lenses and Contradictory TAM Estimates
  body: |-
    Public TAM language around Cohesity is directionally useful but not internally consistent. The February 2024 Veritas transaction announcement used a TAM of over $30 billion and explicitly said that the $12.2 billion IDC data replication and protection software market was one component of that number. By the December 2024 close, the official framing had widened again to $40+ billion while citing a slightly higher $12.3 billion IDC core market estimate. Rubrik’s April 2024 S-1 used a different lens again: a $36.3 billion 2024 platform TAM growing to $52.9 billion by 2027. None of these should be collapsed into one “true TAM.” They use different category boundaries, vendor agendas, and time frames.

    The better read is that Cohesity operates inside a real and sizeable core software market, but management’s investable story depends on expanding outward into broader cyber-resilience and data-security budgets. IDC’s market-shares abstract and Blocks & Files’ summary also show why market size alone does not settle the thesis: the category remains fragmented and sticky, with no single vendor commanding share. That fragmentation supports consolidation upside, but it also means the serviceable market for a post-Veritas Cohesity is still constrained by installed-base inertia, migration risk, and buyer willingness to adopt broader platform bundles. Public evidence is therefore strong enough to size the outer range, but not to isolate Cohesity’s actual SAM or near-term SOM.
  claimRefs:
