  headline: Cohesity 在并入 Veritas 后已经成为有规模的网络韧性平台，官方 >$7B 价值锚点也能自洽；但在债务、所有权 waterfall 和 cohort 留存披露改善前，股权逻辑还无法按溢价承保。
