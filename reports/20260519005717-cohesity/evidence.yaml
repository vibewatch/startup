evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table public roster coverage
    missingEvidence: A full C-suite, VP, and board-committee roster with exact roles and reporting lines.
    whyItMatters: >-
      Public materials identify only part of the leadership and governance surface, which limits succession and
      operating-bench assessment.
    diligencePath: Request the org chart, executive bios, and board committee list in the data room.
    relatedQuestionRefs:
      - QO004
      - QO006
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: stakeholder-or-investor-map ownership percentages
    missingEvidence: The exact post-close cap table, ownership percentages, liquidation preferences, and board-rights schedule.
    whyItMatters: Control, dilution, and exit economics cannot be judged from a named-investor list alone.
    diligencePath: Request the capitalization table and financing documents from management or counsel.
    relatedQuestionRefs:
      - QO025
      - QO027
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table public chronology coverage
    missingEvidence: Internal product-roadmap checkpoints, integration PMO milestones, and any non-public adverse execution events.
    whyItMatters: >-
      The public timeline is strong on announcements but weak on internal execution checkpoints that determine whether
      the thesis is on track.
    diligencePath: Ask management for a board-deck chronology or integration PMO milestone tracker.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: post-close pricing and renewal behavior
    missingEvidence: Customer-level renewal pricing, discounting changes, and contract-term behavior after the Veritas close.
    whyItMatters: Consolidation can change price power and churn risk even when management says contracts are unchanged at close.
    diligencePath: Run customer and channel-reference calls and analyze renewal cohorts by product line.
    relatedQuestionRefs:
      - QO026
  - type: missing-source
    severity: minor
    topic: current headcount by region and function
    missingEvidence: A verified employee count plus a split by sales, engineering, support, and geography.
    whyItMatters: Headcount is needed to judge operating leverage, integration capacity, and hiring burden.
    diligencePath: >-
      Request an HRIS export or finance-approved headcount bridge and corroborate it against payroll or benefits
      records.
  - type: private-evidence-only
    severity: material
    topic: sam-som-gap
    missingEvidence: >-
      A management-grade bridge from the $12.2-$12.3B IDC core market to Cohesity’s claimed $30B/$40+B TAM, plus the
      subset management treats as real SAM and near-term SOM.
    whyItMatters: >-
      Without that bridge, investors cannot tell whether the company’s market-language inflation reflects new
      adjacencies, double counting, or a defendable serviceable-market expansion.
    diligencePath: >-
      Request the board or finance TAM workbook used for the Veritas merger and any post-close refresh showing
      geography, buyer segment, direct versus channel mix, and attach rates.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: payer-opacity
    missingEvidence: >-
      Segment-level evidence on who signs, owns budget, and pays for Cohesity deployments after the Veritas combination,
      including indicative contract sizes or pricing units.
    whyItMatters: >-
      Market attractiveness depends on whether spend sits with CIO infrastructure budgets, CISO cyber budgets, recovery
      compliance programs, or channel-managed service bundles.
    diligencePath: >-
      Ask sales leadership for anonymized recent deal examples by segment showing signer title, budget owner, unit
      economics, and direct versus MSP-delivered contract structure.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: tam-bridge
    missingEvidence: >-
      A normalized market-definition walk-through reconciling the >$30B February 2024 TAM, the $40+B December 2024 TAM,
      the $12.2-$12.3B IDC core market, and peer public-company platform TAMs.
    whyItMatters: >-
      Preserving contradictory estimates is better than forcing a single number, but valuation work still needs a
      defendable apples-to-apples market frame.
    diligencePath: >-
      Cross-check investor decks, board materials, and banker analyses used in the Veritas transaction and map each
      number to included workloads, geography, and services.
    relatedQuestionRefs:
      - QM006
      - QM008
      - QM023
    relatedTableRefs:
      - TM002
  - type: access-blocked
    severity: minor
    topic: idc-detail-access
    missingEvidence: >-
      Full IDC market-share tables, category breakouts, and forecast detail behind the public abstracts and secondary
      summaries reviewed here.
    whyItMatters: >-
      The public abstracts are enough to anchor market definitions and buying criteria, but not enough to build a
      precise share bridge or subsegment CAGR model.
    diligencePath: >-
      Purchase the cited IDC tracker and MarketScape reports or request licensed excerpts from management, then
      reconcile them with the public abstracts used in this chapter.
    relatedQuestionRefs:
      - QM009
      - QM023
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Realized enterprise pricing, discount bands, and support attach for Rubrik, Cohesity, Commvault, and Veeam across
      comparable deal sizes.
    whyItMatters: >-
      Without realized pricing, it is hard to judge whether breadth advantages translate into pricing power or only into
      bigger discount envelopes.
    diligencePath: >-
