  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 整合、受监管客户的证据负担和私营公司不透明交叠，又缺少公开运营遥测时，剩余风险最高。
    approximationNotes: 评级是基于保留证据集的分析判断，而非已披露的内部 KPI 阈值或管理层风险评分。
    claimRefs:
      - CR013
      - CR016
      - CR021
      - CR030
      - CR039
      - CR043
      - CR044
      - CR045
    data:
      columns:
        - 概率
        - 影响
        - 缓释成熟度
        - 剩余敞口
      rows:
        - label: 整合 / 支持迁移
          values:
            - label: 高
              tone: warning
              detail: 证据显示转型工作正在推进，同时客户对支持和产品方向仍有未解决担忧。
            - label: 高
              tone: warning
              detail: 该风险影响承接客户续约、路线图可信度和合并后公司的运营模式。
            - label: 中
              tone: neutral
              detail: 连续性信息和早期合并产品确实存在，但还没有结果证明。
            - label: 高
              tone: warning
              detail: 在转化和续约结果披露前，剩余敞口仍高。
        - label: 监管 / 主权合规
          values:
            - label: 中
              tone: warning
              detail: 负担集中在受监管行业，而不是整个客户群。
            - label: 高
              tone: warning
              detail: 一旦失手，可能卡住交易、抬高成本，或引发类似执法的后果。
            - label: 中
              tone: neutral
              detail: 框架对齐看得见，但审计级证据没有公开。
            - label: 高
              tone: warning
              detail: 金融、政府和关键基础设施客户会放大任何缺口的下行风险。
        - label: 竞争替代
          values:
            - label: 高
              tone: warning
              detail: 竞争对手已经直接围绕 Veritas 并购后的不确定性做营销。
            - label: 高
              tone: warning
              detail: 价格让步或迁移流失，都可能改写增长和利润率假设。
            - label: 低
              tone: warning
              detail: 没有公开证据表明，反向营销已被可量化的留存证明完全抵消。
            - label: 高
              tone: warning
              detail: 在公开指标或客户访谈证明承接客户群足够粘之前，剩余压力仍高。
        - label: 披露 / 融资准备
          values:
            - label: 中
              tone: warning
              detail: IPO 仍是可选项而非迫在眉睫，但管理层已公开把时间点挂到执行里程碑上。
            - label: 中
              tone: warning
              detail: 下行更多是去风险速度变慢、投资测算透明度降低，而不是立即资不抵债。
            - label: 低
              tone: warning
              detail: 公开界面仍偏宣传且有限，因此缓释成熟度很难验证。
            - label: 中
              tone: warning
              detail: 股权结构表和报表准备度细节仍不透明，因此剩余敞口持续存在。
        - label: 云与平台依赖
          values:
            - label: 中
              tone: warning
              detail: AWS 和 SaaS 平台依赖有实质影响，但尚未明显过度集中。
            - label: 中
              tone: warning
              detail: 服务或经济性变化可能削弱恢复承诺和 TCO 说法。
            - label: 中
              tone: neutral
              detail: 架构成熟到足以可信，但合作伙伴依赖写得很明确。
            - label: 中
              tone: warning
              detail: 依赖风险可控；如果竞争压力同步上升，风险会变得更严重。
