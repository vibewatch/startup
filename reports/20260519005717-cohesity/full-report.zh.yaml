        title: 变现、定价不透明与单位经济性代理
        blocks:
          - type: paragraph
            body: >-
              Cohesity 的收入质量看起来好于披露质量。2021 年独立阶段和 2024 年交割的官方材料都反复强调订阅驱动的经常性模式；原主体超过 130%
              的净扩张率，是公开证据中最干净的一条，说明产品历史上能在既有账户内扩张，而不只依赖新 logo。公开材料还暗示了几个变现桶：软件订阅或定期许可、支持和维护续费、DMaaS 或 SaaS 产品（例如以服务形式交付的
              DataProtect），以及服务或合作伙伴交付的实施。缺口在于这些收入流之间的确切结构；这很重要，因为继承自 Veritas 的维护收入与 Cohesity 净新增软件 ARR
              的经济属性不同。定价图景更不透明。已核验材料没有给出实际客户定价、折扣水平、CAC 和回本周期指标，因此最好的公开单位经济性读法只能来自代理指标和上市同行。Rubrik 的文件和业绩发布展示了网络韧性同行如何披露
              ARR、毛利率、自由现金流和贡献利润率。Commvault 的年报和 2026 财年结果则展示成熟上市公司在收入、ARR、毛利率和现金生成上的披露长什么样。这个对比强化了一个判断：Cohesity
              的核心引擎大概率是经常性且偏大型企业，但披露颗粒度仍不足以支持自下而上的承销。
