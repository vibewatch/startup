  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 有证据支撑的机制
      - 当前价值 / 状态
      - 收入质量
      - 尽调问题
    rows:
      - - 核心平台订阅 / 定期软件
        - Cohesity 和同业披露将业务定位为围绕经常性订阅 ARR 和软件主导型保护合同。
        - 旧有 FY2021 运行率 >$300M；交易完成时合并 ARR $1.5B。
        - 经常性质量高，但独立业务组合未披露。
        - 按产品族、队列和续约年份提供 ARR 桥接。
      - - Veritas 维护和支持续约
        - Veritas 交易带来庞大的装机基础，以及围绕 NetBackup、设备和 Alta 产品的持续支持承诺。
        - 在合并 ARR 和收入中经济意义重大，但公开资料没有单独拆出美元金额。
        - 具备经常性，但对迁移敏感；继承来的续约行为可能不同于 Cohesity 原生 ARR。
        - 拆出继承维护 ARR、总留存率，以及迁移至 DataProtect 的转化率。
      - - DMaaS / SaaS 产品
        - 官方材料提到以服务形式交付的 DataProtect，以及托管或 as-a-service 部署路径。
        - 具备战略意义和经常性，但未公开披露收入贡献。
        - 如果附加率真实，可能是高质量经常性收入；公开规模未知。
        - 展示 SaaS ARR、SaaS 毛利率和 DMaaS 客户数。
      - - 专业服务 / 实施服务 / 合作伙伴交付服务
        - 平台可自管、按服务交付，或由 Cohesity 授能的合作伙伴交付，意味着部署周边会有服务和赋能收入。
        - 公开资料只呈现为机制，没有单独拆分。
        - 如果占比过大，质量低于软件 ARR，因为它更偏一次性、也更依赖人力。
        - 提供服务收入占比、附加率和服务毛利率。
      - - 设备绑定或硬件相邻收入
        - 对 NetBackup 设备和自管部署的支持，意味着继承组合中存在部分硬件相邻经济性。
        - 没有公开拆分软件、设备支持和任何捆绑硬件内容。
        - 质量混杂，因为设备占比高的收入不如纯软件 ARR 经常性强。
        - 将设备相关收入和支持续约画像与软件 ARR 分开披露。
    notes: 各行列出可由已审阅公开披露支撑的主要收入桶；确切收入流组合仍未披露，需要管理层提供底稿。
