      - number: '1.4'
        title: 里程碑、合作伙伴势能与尽调风险
        blocks:
          - type: paragraph
            body: >-
              2021 到 2026 年的里程碑显示，公司从高增长私营备份厂商走向规模化平台整合者；同一组记录也暴露了尽调风险。2024 年 2 月交易逻辑建立在客户重叠度低、全球覆盖更广，以及同时保留 Cohesity 和
              Veritas 产品线的路线图之上。TechCrunch 后来报道称客户重叠不足
              5%，并描述了一套统一销售动作：在不立即裁撤销售团队的情况下捕捉协同。这利好交叉销售逻辑，但同一篇文章也点出经典整合副作用：竞争减少可能提高定价权，即便交割时没有宣布价格或合同变化。2026
              年官方发布进一步深化战略转向，把 Cohesity 与主权云、智能体风险恢复、Google 集成和 AI
              数据激活绑定起来，也解释了为什么管理层越来越多谈网络韧性，而不只是备份。即便如此，投资人面前仍有重要盲点：当前员工数没有公开验证，精确债务条款未披露，合并后定价行为也没有经过公开客户案例的压力测试。这些不是推翻投资逻辑的问题，但在把
              2024 年交割指标用作估值锚之前，它们是最值得追问的尽调事项。
