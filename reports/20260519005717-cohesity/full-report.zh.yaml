  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: Veritas 合并后的整合是主风险
        blocks:
          - type: paragraph
            body: >-
              Cohesity 最大的风险，不在于它能不能讲出连续性故事，而在于支撑这套故事的合并后运营系统能否变得足够可靠、甚至无聊。公开证据显示公司确有进展：它推出了统一的伙伴计划，把 RecoveryAgent
              包装成早期 Veritas 衍生成果，并反复强调不会让任何客户掉队。同一组证据也解释了为什么执行风险仍高。Veritas
              伙伴基础设施仍出现过渡通知；独立分析称，接手客户最担心定价、支持和产品方向；公开资料仍没有披露 NetBackup 和 Alta
              存量客户的转换、流失或续约行为。合并后公司体量已经足够大，普通摩擦也会很快变得重要。产品线、渠道计划、支持动作和安装基盘的合并，可能不是戏剧性失败，而是缓慢失灵。因此，本章把整合视为解读其余风险栈的中心镜头。
