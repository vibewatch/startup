  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 投资逻辑
      - 反向逻辑
      - 改变判断的因素
    rows:
      - - 规模
        - 披露收入显示，合并后公司规模已经超过 Rubrik 和 Commvault。
        - 如果收入结构里含有增长更慢或质量更低的继承收入，更大并不自动意味着更有价值。
        - 展示原生与继承 ARR 以及续约韧性。
      - - 利润率
        - 28% 调整后现金 EBITDA 利润率显示，合并后的盈利引擎可能较强。
        - 调整后现金 EBITDA 尚未桥接到上市公司现金流或 GAAP 经营经济性。
        - 披露债务服务、SBC、资本开支以及 GAAP 到 non-GAAP 调整桥。
      - - 市场地位
        - 收购 Veritas 后，Cohesity 可以主张品类领导地位和广泛工作负载覆盖。
        - 按市场份额算的领导地位，仍可能掩盖迁移风险和运营复杂度。
        - 按队列和产品家族展示留存与迁移结果。
      - - 公开可比公司支撑
        - 官方交割倍数介于 Commvault 与 Rubrik 之间，并不极端。
        - Rubrik 的溢价依赖公开披露、高增长和可见资产负债表强度；Cohesity 公开层面还没有做到。
        - 完成一个完整合并财年后，提供 Rubrik 式季度 KPI 包。
      - - 私募市场信号
        - 官方 >$7B 交割价提供了硬交易锚点。
        - Yahoo / Forge 的 $4.69B 估计值显示，部分私募市场参与者仍把公司标在远低于官方交易价值的位置。
        - 按股权类别验证实际二级市场成交，而不是依赖模型估计。
      - - IPO 路径
        - 如果合并执行保持强劲，管理层的 2026 年愿望可能成为催化剂。
        - 宏观波动和退出延迟会惩罚那些规模已成、但披露不完整就入场的公司。
        - 在追逐溢价簿记前，先证明审计准备和投行可用的披露。
    notes: 反向逻辑有意强调资本结构和披露风险，而不是产品质量，因为核心估值分歧在于投资者还看不到的部分。
