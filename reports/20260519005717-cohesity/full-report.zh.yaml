  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台范围与产品线图谱
        blocks:
          - type: paragraph
            body: >-
              Cohesity 现在展示的是一套宽网络韧性栈，而不是单一备份设备故事。公开界面覆盖用于核心企业备份的 DataProtect、承接 Veritas 存量环境的 NetBackup 连续性、用于隔离恢复副本的
              FortKnox 或 Alta Recovery Vault、面向 SaaS 与云原生保护的云服务，以及在备份数据之上做 AI 激活的 Gaia。产品文档索引进一步印证了这种铺开：Helios、Security
              Center、Threat Protection、Data Classification、RecoveryAgent、FortKnox、Gaia 和 NetBackup Web UI
              都是单独记录的界面。这种广度有战略吸引力，因为 Cohesity 可以用一个组合销售备份、保险库、DSPM、身份恢复和 AI
              上下文。需要注意的是，公开包装比公开可读的技术细节更宽，所以买方应承认模块数量真实存在，但不要假设每个具名界面都同样成熟。
