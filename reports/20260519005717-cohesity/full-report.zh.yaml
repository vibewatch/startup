      - number: '1.3'
        title: 资本基础、股东信号与披露边界
        blocks:
          - type: paragraph
            body: >-
              Cohesity 的资本故事分成两个阶段。第一阶段，公司在 2021 年 3 月通过 STEADFAST 领投的 $145 million 非稀释性要约收购达到 $3.7 billion 估值；当时披露的年同比
              ARR 增长接近 90%，净扩张率超过 130%，客户数超过 2,300 家。Reuters 相关报道后来称，公司已于 2021 年 12 月秘密提交美国 IPO
              申请，但软件市场环境转弱后，上市没有落地。第二阶段，Cohesity 放弃独立上市，转向并购扩规模。2024 年 2 月，公司宣布与 Veritas 企业数据保护业务合并，合并估值约 $7 billion；交易于
              2024 年 12 月交割，披露的合并主体备考收入超过 $1.7 billion，ARR 为 $1.5 billion，调整后现金 EBITDA 利润率 28%。这笔交易背后的投资人名单具有战略意义：Haveli
              领投 Series H，Carlyle 通过 Veritas 进入股权结构，SoftBank、Sequoia、Wing、Premji
              等长期支持者仍留在故事中。缺口在于真正的股权结构数学——交割后确切持股比例、清算优先权堆叠和债务规模都没有公开披露。
