            body: >-
              本章公开部署集中在混合、合规敏感的环境里；在这些地方，恢复速度比备份营销更重要。Detroit 用 Cohesity 覆盖市政工作负载、Microsoft 365 和 Google 服务；Maryland 用它在
              Cisco UCS 上为约 40 个机构做共享服务 NAS 备份，并采用网络保险库设计；Musashino 在日本业务连续性预期下，用它支撑患者护理和医院运营；RB 在 DORA 和 PCI DSS
              下用它支撑国家支付系统；Nasdaq 用它同时保护 Microsoft 365 和剩余本地 Exchange，并让数据留在特定司法辖区。这是一种一致模式：Cohesity
              进入的是恢复、不可变性和主权数据驻留控制很重要的地方，然后再叠加保险库、云或合规自动化。联邦证据也强化了这一模式。AWS GovCloud 上架、DISA 批准备忘录和 JITC
              认证显示，政府适配性不只是营销页面说法。因此，公共部门渗透看起来真实存在，尽管确切联邦收入和合同流仍不透明。
