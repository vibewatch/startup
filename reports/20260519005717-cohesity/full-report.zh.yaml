      - number: '6.5'
        title: 并购后的切换风险更多取决于执行与续约行为，而不是明确的强制迁移
        blocks:
          - type: paragraph
            body: >-
              公开的并购后材料确实压低了一个显而易见的担忧：强制迁走客户。路线图 PDF、Veritas「better together」页面、WWT 发布的公开信以及 Cohesity
              交割材料都在重复同一条信息：产品会获得多年支持，迁移自愿，客户可以留在自己偏好的平台上。这降低了接手 NetBackup 和 Alta
              账户的急性流失风险。但这并没有消除投资判断时最重要的执行风险。同一批材料把迁移工具描述成仍需建设和简化的东西，而不是已经在规模上公开验证过的能力。评论平台也呈现出一组会让宽产品组合续约变复杂的问题：报表不均、支持或培训缺口、设置复杂，以及围绕管理界面的治理担忧。因此结论是平衡的。Cohesity
              看起来不像一家会在第一天就强推破坏性迁移的公司，但公开证据仍无法说明，当路线图承诺撞上真实运营复杂度后，接手来的客户续约、转换或扩张会有多顺。
