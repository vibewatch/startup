  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户组合：广泛规模说法存在，但具名证据质量更高
        blocks:
          - type: paragraph
            body: >-
              Cohesity 同时有广泛数量故事和具名证据故事，二者不应混在一起。广泛数量故事来自公司材料：2021 财年约 2,600 家客户，2024 年 12 月 Veritas 合并交割后超过 12,000
              家客户。这些数字对规模有意义，但不能证明每个 客户标识背后都是同一平台、同一买方或同等队列质量。本章更看重具名证据，因为它显示 Cohesity 实际在哪些场景被托付给线上工作负载。公开案例横跨儿科医疗、市政
              IT、州级共享服务、日本医院系统、冰岛支付轨道、资本市场备份、食品生产运营和大型欧洲零售 IT。这个组合说明 Cohesity
              能卖给保护受监管或运营关键数据的中央基础设施团队，而不只是泛化备份买方。限制在于，公开证据仍经过筛选：它更能说明垂直行业广度和工作负载严肃性，而不是收入集中度、续约深度或平均账户规模。
