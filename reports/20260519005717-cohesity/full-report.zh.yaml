  - id: TR005
    title: 缓释与止损标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 为什么重要
      - 行动含义
    rows:
      - - 继承客户基础迁移风险
        - 转化与续约披露
        - 到下一轮重大尽调周期，管理层仍无法按队列展示续约或迁移指标
        - 交易中最大的价值池仍不透明，说明叙事质量跑在运营证据前面
        - 在队列数据出现前，把基准情景视为更慢、价值更低
      - - 支持质量恶化
        - 评论与客户背调趋势
        - 两个或更多新的独立信号指向支持响应、恢复速度或报告清晰度恶化
        - 支持摩擦最可能成为可避免续约流失的隐藏原因
        - 升级对支持 KPI 的尽调，并假设扩张效率更低
      - - 受监管客户合规失误
        - 负面政府或主权事件
        - 重大合规缺口、认证问题或执法式事件公开
        - 法律和主权要求能比产品营销更快关闭高价值行业；营销再重启也慢
        - 暂停投资信心，重新评估受监管行业承销逻辑
      - - 竞争替换
        - 替换或价格压力证据
        - 竞争对手迁移活动开始拿下有名有姓的继承客户，或迫使 Cohesity 做出有意义的价格让步
        - Commvault、Druva、Dell 和公开可比公司都在公开进攻，说明市场已经在争夺这一窗口
        - 下调增长和利润率假设
      - - 披露或融资延误
        - IPO 准备信号
        - 管理层无法展示合并后公司报告准备情况，或在没有新证据的情况下推迟时间点
        - 披露纪律可见前，不应把融资可选性计入
        - 把 IPO 上行视为后移，继续聚焦私募市场基本面
      - - 安全事件打破投资逻辑
        - 重大公开网络事件
        - 公开事件或披露事件削弱公司的韧性叙事，或暴露控制缺口
        - 品牌承诺建立在韧性上；一旦出现重大失误，信任、管线和估值会同时受击
        - 转入防守姿态，直到根因和整改质量得到证明
    notes: 这些是用于保持承销纪律的分析性止损标准，不是管理层指引；表格旨在让风险争论可观察，而不是停留在话术。
