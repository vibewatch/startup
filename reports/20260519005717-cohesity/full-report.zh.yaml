        title: 信任、安全与恢复控制
        blocks:
          - type: paragraph
            body: >-
              产品证据在韧性控制上最强。DataProtect、NetBackup、Alta Data Protection、Alta Recovery Vault
              以及更宽的网络韧性框架，都反复采用同一设计模式：不可变副本、基于角色的访问、多因素控制、异常检测、恶意软件扫描、干净恢复建议和编排蓝图。Cloud Services
              还加入了合作伙伴背书的信任信号，例如不可变存储、特权访问控制和 SOC 2 Type II 语言；Microsoft 则把 Cohesity 定位为 Microsoft 365 Backup Storage
              伙伴，支持带策略上下文的恢复和地理冗余。这些信号有意义，但信任图景并不完全干净。NetBackup 的关键加固指南仍放在 legacy Veritas 支持站点上，DataProtect、Helios 和
              NetBackup 更深层产品文档可被发现，却不能公开阅读。这意味着控制叙事可信，但详细证据基础仍分散在营销、合作伙伴和需认证访问的文档界面之间。
