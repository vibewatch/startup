  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块 / 资产
      - 主要用户
      - 公开成熟度 / 状态
      - 差异化信号
      - 尽调缺口
    rows:
      - - DataProtect
        - 备份管理员、基础设施团队、网络恢复负责人
        - 成熟核心平台
        - 统一管理、不可变快照、快速搜索、即时大规模恢复、混合工作负载覆盖广
        - 需要独立基准性能测试；无需登录即可查看的公开发布说明细节也要更清晰。
      - - NetBackup
        - 大型企业备份团队和设备占比较高的环境
        - 成熟继承平台
        - 设备支持、Kubernetes 备份、多云恢复、Alta 或 FortKnox 扩展、根深蒂固的企业客户基础
        - 与 DataProtect 的确切功能重叠，在公开来源中仍未清晰说明
      - - FortKnox / Alta Recovery Vault
        - 安全、韧性和灾难恢复团队
        - 成熟金库层
        - 托管网络金库、恶意软件扫描、加密、干净恢复、云服务商可选
        - 需要更清楚的公开指引，说明 Day-2 运维、测试节奏和按部署模式计价。
      - - Cloud Services / Microsoft 365 备份
        - 云运营、SaaS 备份管理员、托管服务买家
        - 成熟，并在积极拓展合作伙伴
        - 全托管备份服务、SOC 2 Type II 存储声明、Microsoft 365 Backup Storage 路径、无需管理本地基础设施
        - 需要公开拆解各工作负载限制、恢复 SLA，以及相较自管模式的控制差异。
      - - Gaia
        - 知识工作者、安全分析师、AI 平台团队
        - 新兴但已有在线产品界面
        - 激活不可变时间序列备份数据用于 AI、语义搜索、向量索引，并向 Copilot、Gemini 和 Glean 注入上下文
        - 需要公开的护栏文档、连接器成熟度地图，以及 GA 与预览边界。
      - - Helios / Alta View 控制平面
        - 平台管理员、中央运维、多集群管理者
        - 已上线，但明显处于整合中期
        - 单一环境可见性、NetBackup 接入路径、满足数据主权要求的区域选择
        - 手动开通和多品牌命名说明控制平面仍有复杂度
      - - Marketplace / 应用平台
        - 开发者、生态合作伙伴、高阶企业管理员
        - 已上线的扩展层
        - 基于 Docker 的 AppSpec 和 SDK 应用，加上 Cisco XDR、DataMasque 等合作伙伴附加组件
        - Marketplace 应用、合作伙伴应用和官方支持集成之间的支持边界并不完全透明
      - - 安全叠加模块（DSPM、威胁防护、身份韧性、恢复编排）
        - CISO、安全工程、事件响应
        - 已上线的组合叠加模块
        - 公开的网络韧性框架把 DSPM、身份恢复、威胁狩猎、金库和自动恢复串成一个叙事
        - 公开来源中的模块级技术深度不均，且常被导向解决方案页面，而不是详细文档
    notes: 各行覆盖截至 2026-05-19 公开产品页、文档索引条目和合作伙伴列表中明确提到的主要模块与叠加能力；这不是完整 SKU 清单。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the major product modules explicitly named on current official pages, docs index entries, and partner
        listings on 2026-05-19, but not every add-on, bundle, or regional variant is publicly readable.
