        title: 耐久性信号为正但不完整；扩张可见于模块、超大规模云厂商和受监管工作负载
        blocks:
          - type: paragraph
            body: >-
              Cohesity 公开可见的留存韧性证据方向上偏正面，但对合并后实体仍不完整。历史上最强的信号仍是原 Cohesity 在 2021 年超过 130%
              的净扩张。更新近的公开证据来自评论和客户背书平台，而不是硬性的续约披露：2026 年第八次获得 Gartner Peer Insights 认可，加上 Capterra 和 G2
              整体评分普遍较强，说明客户满意度仍在。但同一批评论也暴露了培训、报表、云端恢复速度、远程接口治理和支持响应上的真实摩擦。扩张逻辑比留存数学更容易看清。公开案例反复显示，备份部署会扩到
              FortKnox、Microsoft 365、Google 工作负载、SaaS 交付、Gaia，或更宽的网络韧性项目。渠道侧，AWS、Google、Microsoft、SHI、WWT 和 Presidio
              都出现在近期伙伴材料里，意味着增长不完全靠直销拉动。缺失的一块是队列透明度：公开资料仍看不到合并后客户群当前的 NRR、GRR、流失或续约经济性。
