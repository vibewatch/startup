    summary: 公开可见的客户旅程通常从韧性或合规痛点开始，进入以证明为核心的评估，再从核心备份扩展到隔离库、SaaS 保护或 AI 相关工作流。
    approximationNotes: 旅程阶段由具名客户案例、合作伙伴材料和并购后路线图页面综合而来。它们代表公开证据中最常见的模式，不是经审计的平均销售流程。
    data:
      nodes:
        - id: urgency
          label: 1. 触发事件
          detail: 勒索软件惊吓、合规要求、云迁移或恢复瓶颈，会在受监管或运营关键环境中制造变更紧迫感。
        - id: evaluation
          label: 2. 多供应商评估
          detail: 客户在选择 Cohesity 前，会比较不可变备份、恢复速度、管理简便性，以及云或主权支持。
        - id: core-deploy
          label: 3. 初始核心备份部署
          detail: 第一批生产范围通常覆盖本地、SaaS、数据库或 NAS 工作负载的核心备份与恢复。
        - id: operate
          label: 4. 恢复与治理运营循环
          detail: 系统在生产中获得信任后，客户开始每周演练、策略自动化、恢复授权或安全治理工作流。
        - id: expand
          label: 5. 扩展或续约
          detail: 扩展路径包括 FortKnox、Microsoft 365、Google 工作负载、Gaia、Nutanix 或 Kubernetes 支持，或政府云采购路径；并购后材料把迁移定位为自愿。
