      - number: '2.2'
        title: 规模测算视角与相互冲突的 TAM 估计
        blocks:
          - type: paragraph
            body: >-
              围绕 Cohesity 的公开 TAM 口径有方向价值，但内部并不一致。2024 年 2 月 Veritas 交易公告使用超过 $30 billion 的 TAM，并明确称 $12.2 billion 的 IDC
              数据复制与保护软件市场只是其中一个组成部分。到 2024 年 12 月交割时，官方框架又扩到 $40+ billion，同时引用略高的 $12.3 billion IDC 核心市场估计。Rubrik 2024 年
              4 月 S-1 又用了另一套视角：2024 年平台 TAM 为 $36.3 billion，到 2027 年增至 $52.9 billion。这些数字不应被压成一个“真实
              TAM”。它们采用了不同的品类边界、供应商议程和时间框架。


              更好的读法是：Cohesity 处在一个真实且规模可观的核心软件市场中，但管理层可投资的故事取决于向更宽的网络韧性和数据安全预算外扩。IDC 市场份额摘要和 Blocks & Files
              的总结也说明，市场规模本身并不能决定投资逻辑：品类仍然碎片化且粘性强，没有单一供应商占据主导份额。碎片化支持整合上行空间，但也意味着后 Veritas 的 Cohesity
              可服务市场仍受装机基础惯性、迁移风险和买方采用更宽平台套装的意愿约束。因此，公开证据足以圈定外沿范围，但还不足以拆出 Cohesity 的实际可服务市场（SAM）或近期可获取市场（SOM）。
