        - 把 FY2021 独立收入运行率桥接到 FY2024 独立收入。
      - - 原业务净扩张
        - '>130%'
        - 高
        - 强净扩张通常说明产品使用健康、交叉销售质量不错。
        - 提供原业务和继承队列的当前 NRR 与总留存率。
      - - 交割时合并备考 ARR
        - $1.5B
        - 高
        - 合并公司最强的公开规模指标。
        - 将 ARR 拆分为 Cohesity 原生、继承 Veritas、SaaS 和支持收入桶。
      - - 合并调整后现金 EBITDA 利润率
        - 28%
        - 高
        - 如果定义可持续，说明贡献经济性扎实。
        - 提供完整 EBITDA 桥接，并与 GAAP 经营利润或现金流对账。
      - - Rubrik FY2026 毛利率 / 自由现金流
        - 80.1% GAAP 毛利率；$237.8M FCF
        - 中
        - 展示高披露度网络韧性软件在规模化后可能呈现的经济性。
        - 用作 Cohesity 毛利率和 FCF 披露的同业基准。
      - - Commvault FY2026 毛利率 / 自由现金流
        - 81.2% GAAP 毛利率；$237M FCF
        - 中
        - 展示成熟公开品类的经济性和利润率透明度。
        - 用作支持占比高与 SaaS 占比高组合的基准。
      - - 独立 Cohesity 的 CAC、回本周期和 FCF
        - 未公开
        - 低
        - 这些是判断资本效率和现金跑道的核心承销变量。
        - 要求提供队列 CAC、S&M 回本周期、递延收入趋势和自由现金流桥接。
    notes: 各行混合直接披露和可比公司代理指标；缺少 Cohesity 自身单位经济数据才是核心尽调卡点，不是格式遗漏。
