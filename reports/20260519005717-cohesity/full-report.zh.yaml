  - id: TV004
    title: 可比估值表
    columns:
      - 参考对象
      - 日期 / 状态
      - 已披露规模
      - 估值或 EV 锚点
      - 隐含倍数口径
      - 参考价值
      - 局限
    rows:
      - - 旧 Cohesity 要约交易
        - Mar 2021 / 已完成
        - '>$300M 收入运行率；2,600 家客户；ARR 增长 >70%'
        - $3.7B 估值
        - 规模更小、独立经营时的旧私募估值标记
        - 说明合并前公司已能撑起数十亿美元级私募估值。
        - 不能直接对比 2024-2026 年合并后公司。
      - - Cohesity-Veritas 公告
        - Feb 2024 / 已签署
        - '>$1.6B 收入；$1.3B ARR；调整后现金 EBITDA 率 27%'
        - 合并后公司估值 ~$7.0B
        - 按早期规模基数为 ~4.4x 收入、~5.4x ARR
        - 第一个合并后公司估值锚点。
        - 交易交割前，尚未纳入最终融资和更新后的交割指标。
      - - Cohesity-Veritas 交割
        - Dec 2024 / 已完成
        - '>$1.7B 收入；$1.5B ARR；调整后现金 EBITDA 率 28%'
        - '>$7.0B 合并后公司估值'
        - '>=4.1x 收入，>=4.7x ARR'
        - 本章最硬的锚点。
        - 债务和分配瀑布仍未披露。
      - - Rubrik 公开市场
        - May 18 2026 / 实时
        - $1.32B 收入；~$1.46B ARR
        - $12.3B-$12.9B EV；$12.8B-$13.4B 市值
        - ~9.3x-9.8x EV/收入；~8.4x-8.8x EV/ARR
        - 网络韧性赛道最接近的高增长上市可比公司。
        - 披露质量和现金余额都远强于 Cohesity。
      - - Commvault 公开市场
        - May 18 2026 / 实时
        - $1.184B 收入；$1.122B ARR
        - ~$4.30B EV；$4.29B-$4.37B 市值
        - ~3.6x EV/收入；~3.8x EV/ARR
        - 可作为数据保护倍数的成熟软件下限参考。
        - 增长和业务组合比 Cohesity 更成熟。
      - - Yahoo/Forge 私募估值估计
        - May 18 2026 / 指示性
        - 页面未披露经审计规模
        - $4.69B 估计估值
        - 基于模型的老股市场信号，不是交易倍数
        - 可作为偏谨慎的私募市场交叉校验。
        - 明确不是报价，且可能依赖有限数据。
    notes: 表格抽取企业数据保护和网络韧性估值中最能支持决策的锚点样本， 不是所有软件可比公司或私募交易的完整清单。
