  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 原独立指标与合并备考规模
        blocks:
          - type: paragraph
            body: >-
              公开记录支持两套非常不同的财务视角。原独立公司视角在 2021 年最扎实，当时 Cohesity 披露年化收入运行率超过 $300 million，ARR 增长超过 70%，净扩张率超过 130%，截至 2021
              年 7 月 31 日约有 2,600 家客户。2021 年 3 月要约收购公告及同期报道也显示，投资人愿意通过非稀释性员工流动性事件支撑 $3.7 billion
              估值，说明软件市场重置之前，独立业务确有真实需求。但承销难点在于，这个视角基本到此为止。到 2024 和 2025 年，公司最有用的规模披露不再是独立 Cohesity 指标，而是 Veritas
              合并公告和交割材料提供的合并主体备考收入、ARR 和调整后现金 EBITDA。2024 年 2 月公告把业务描述为收入超过 $1.6 billion、ARR 达 $1.3 billion、调整后现金 EBITDA
              利润率 27%；2024 年 12 月交割时，这些指标更新为收入超过 $1.7 billion、ARR 达 $1.5 billion、调整后现金 EBITDA 利润率
              28%。这些是很有分量的规模标记，但不能被解读为经审计的独立 Cohesity 经济性。
