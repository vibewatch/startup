            body: >-
              反向逻辑并不是 Cohesity 缺少规模或战略相关性；反向逻辑是，投资者可能在看不到 Rubrik 式公开披露之前，就被要求为 Rubrik 式上市公司质量付钱。管理层解释推迟 IPO 的理由，是
              Cohesity 希望在上市前先成为最大那条鱼。这个逻辑在战略上自洽，但也承认公司仍需要证明。Dataconomy 对宏观波动的总结，以及来自 Yahoo/Forge 的 $4.69 billion
              估计，都指向同一个怀疑方向：私人和公开市场可能不会因为公司在 Veritas 交易后变大，就给它高溢价。如果债务或股权类别条款让新进入股权实质上后置；如果原 Veritas 续约黏性低于头条 ARR
              暗示；或如果未来 IPO 文件在不披露队列留存、原生与继承业务混合、现金流转换的情况下索要 Rubrik 式倍数，投资逻辑就会破裂。换句话说，主要估值风险是隐藏结构，不是隐藏增长。
