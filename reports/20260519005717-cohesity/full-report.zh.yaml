        - 索取当前欧盟合规资料包，以及按行业划分的各国扩展要求。
      - - DOJ 民事网络欺诈 / CMMC 执法
        - 政府业务中，安全控制、系统计划或评估分数一旦不准确，就可能演变成法律和金钱问题。
        - 美国联邦和国防承包
        - DOJ 正在和解与 DoD 项目中控制缺失、虚假分数和未履行网络义务相关的案件。
        - 中
        - 高
        - 公共部门定位、零信任对齐和现有网络韧性功能有帮助，但替代不了可审计的控制运行。
        - 索取当前联邦证明、SSP 实践，以及按产品和服务范围划分的 CMMC 准备证据。
      - - FTC 保障规则与服务商监督
        - 金融客户越来越需要服务商支持泄露通知，并可受控处理受保护信息。
        - 美国金融机构和服务商
