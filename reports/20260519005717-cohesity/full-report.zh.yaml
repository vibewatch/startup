  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层级 / 组件
      - 在运营模型中的角色
      - 关键依赖
      - 技术风险
    rows:
      - - 工作负载与数据源层
        - 把来自本地、SaaS、云原生、NAS、数据库、VM 和容器的源数据送入保护环境
        - 连接器覆盖、工作负载支持深度和特定来源的策略逻辑
        - 公开覆盖面很强，但并非每个模块的工作负载深度都有同等文档
      - - 主要保护引擎（DataProtect 和 NetBackup）
        - 创建受保护副本、应用策略，并在自管和继承环境中恢复工作负载
        - 跨产品一致的策略语义，以及干净的重叠管理
        - Veritas 合并后，功能重叠与产品区分并不总是透明
      - - 控制平面（Helios / Alta View）
        - 集中整个环境的可见性、开通和管理
        - 开通工作流、区域选择和管理界面收敛
        - 多品牌控制平面命名和手动接入说明整合仍在推进
      - - 金库层（FortKnox / Alta Recovery Vault）
        - 为网络恢复和灾难场景保留隔离的干净副本
        - 云服务商选择、复制路径、恶意软件扫描和不可变性控制
        - 公开文档没有充分披露真实事件中的运营成本、演练或故障模式
      - - 恢复编排层（RecoveryAgent / Blueprints）
        - 自动安排恢复工作流的顺序、测试和执行
        - Blueprint 质量、干净恢复建议和应用依赖映射
        - 详细 Blueprint 机制在营销中讲得多，公开文档讲得少
      - - 集成与应用层
        - 把告警、日志和工作流送入 Splunk、ServiceNow、SOAR/XDR 工具及 Marketplace 应用
        - 连接器维护、合作伙伴 API 和支持归属
        - 多个公开代码仓库和样例属于尽力而为，企业支持边界未必清晰
      - - AI 激活层（Gaia）
        - 搜索和总结不可变历史数据，并将受治理上下文注入智能体 AI 工具
        - 向量索引、保留 RBAC 的检索、模型路由和合作伙伴集成
        - AI 功能叙事很强，但公开证据对护栏和硬性 GA 边界仍然不足
    notes: 本架构表把有直接证据的层级与推断出的运营依赖分开。风险部分强调公开产品叙事跑在公开技术细节前面的地方。
