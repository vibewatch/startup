chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、平台与当前定位
        blocks:
          - type: paragraph
            body: >-
              Cohesity 是一家私营数据安全软件公司，总部位于加州 San Jose，成立于 2013 年。公司当前叙事围绕 Cohesity Data Cloud 展开：用一个平台保护本地、云和 SaaS 环境中的
              1,000+ 个工作负载，同时让受保护数据可用于 AI。公司页面现在称拥有 13,000+ 家客户、覆盖 70% 的 Global 500，并保护 200+ EB 数据；这在方向上高于 Veritas 合并于
              2024 年 12 月交割时披露的 12,000 家客户 / 数百 EB 规模。Nasdaq、Conagra 等客户案例显示，产品不只服务小型 IT 备份场景，也进入了受监管企业 SaaS
              备份和运营敏感环境。2026 年的产品叙事还把故事从传统备份继续外推：Cohesity 2026 年 3 月发布 Enterprise AI Resilience，4 月拿到 Google Cloud
              奖项，两者都强调受治理的企业数据、智能体风险恢复和云原生网络韧性。因此，后续章节应把 Cohesity 看作一家私营网络韧性平台商，而不是点状备份设备厂商；它正试图把受保护数据和合作伙伴集成转化为更宽的 AI
              时代控制平面。
