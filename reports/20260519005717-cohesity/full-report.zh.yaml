  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 概率信号
      - 隐含价值区间
      - 工作倍数逻辑
      - 前置条件
      - 下行触发因素
    rows:
      - - 悲观
        - 25%
        - $4.5B-$6.0B
        - 约 2.7x-3.5x 收入或 3.0x-4.0x ARR
        - 债务高于预期；迁移和留存表现不及预期；IPO 市场仍然关闭。
        - 队列留存走弱，或股权结构表条款让普通股处于次级位置。
      - - 基准
        - 50%
        - $7.0B-$9.0B
        - 约 4.1x-5.3x 收入或 4.7x-6.0x ARR
        - 官方交割锚点大体成立；合并后增长落在十几个点的低到中段；债务可控但并非小事。
        - 新披露未能提升可见度，使公司卡在接近官方交易价值的位置。
      - - 乐观
        - 25%
        - $10.0B-$13.0B
        - 约 5.9x-7.6x 收入或 6.7x-8.7x ARR
        - 完整一个合并年度显示增长耐久、FCF 转化可信、债务结构干净。
        - 由于申报文件缺乏公开市场级 KPI 披露，Rubrik 式溢价未能兑现。
    notes: 情景区间依据已披露的收入和 ARR 锚点，以及当前 Rubrik、Commvault 交易区间估算；它们是企业价值口径的估值区间，不是经审计的股权价值。
