  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 资格事件与估值重置
        blocks:
          - type: paragraph
            body: >-
              本章满足资格阈值，因为 2024 年 12 月完成的 Cohesity-Veritas 合并发生在 2024-05-19 之后，并且公司和 Veritas 明确称，这笔交易对合并后公司的估值超过 $7
              billion。这不同于原 Cohesity 2021 年 3 月 $3.7 billion 的要约回购估值。2021 年事件反映的是一家更小的独立业务，通过非稀释性的员工流动性要约提供流动性；当时交易规模为
              $145 million，收入运行率刚超过 $300 million，ARR 增长超过 70%，净扩张超过 130%。相比之下，2024 年和 2025 年的讨论对象是一家大得多的合并后公司，收入超过 $1.7
              billion，ARR 为 $1.5 billion，调整后现金 EBITDA 利润率为 28%，同时继承了 Veritas 的经济性和不透明债务。因此，分析重置是必须的：相关估值问题不是 Cohesity
              曾经是否配得上 $3.7 billion，而是当前合并实体在调整整合和资本结构不确定性后，是否配得上官方超过 $7 billion 的锚点。
