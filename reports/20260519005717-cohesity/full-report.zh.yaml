      - number: '4.3'
        title: 资本结构、融资依赖与 IPO 路径
        blocks:
          - type: paragraph
            body: >-
              资本堆叠的轮廓可见，债务细节不可见。签约时，Cohesity 和 Veritas 表示交易将由股权和债务共同融资，并明确提到与既有 Veritas
              债务相关的交换要约或类似交易。到交割时，公司收窄了股权侧叙事：Haveli 领投的 Series H 提供了大部分交易股权，Coatue、Sapphire Ventures 和 Dragon Fund
              也参与，Carlyle 通过 Veritas 持股进入合并公司，Sequoia、SoftBank、Wing、Premji、Madrona 等知名支持者也被点名。J.P. Morgan
              安排并承诺融资，说明债务真实且来自机构；但交割公告和已核验独立报道都没有披露这笔债务的金额、定价、期限或杠杆率。这个省略更重要，因为管理层已经在引导市场思考 IPO 准备度。CRN 引用 Sanjay
              Poonen 称，公司推迟 IPO 是为了完成并证明 Veritas 合并；CNBC 后来报道称，Cohesity 希望在上市前拿到一整年的合并结果，时间可能在 2026
              年。乐观读法是，融资买来了规模和时间。更严苛的读法是，投资人仍看不到债务负担、现金跑道，也无法判断 mid-30s 的 Rule of 40 目标是否足以抵消 IPO 窗口的宏观波动。
