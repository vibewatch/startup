  - id: TE004
    title: 信任 / 质量 / 合规表
    columns:
      - 控制项 / 信号
      - 公开状态
      - 范围
      - 支撑什么
      - 缺口或担忧
    rows:
      - - 不可变快照和干净恢复声明
        - DataProtect、FortKnox、Alta 和网络韧性页面均明确提到
        - 核心备份和金库层
        - 支撑 Cohesity 将备份完整性视为安全边界，而不只是存储功能这一说法
        - 多数证据由厂商撰写，缺少独立验证
      - - RBAC、MFA、SSO 和 MPA 式控制语言
        - DataProtect、NetBackup 或 Alta 界面均明确提到
        - 管理控制平面和恢复敏感操作
        - 显示原生和继承产品都有真实的零信任设计意图
        - 每个模块逐产品的精确实现细节并不公开
      - - 恶意软件扫描、异常检测、YARA 狩猎和沙箱
        - Alta 和网络韧性页面均明确提到
        - 威胁检测和恢复准备
        - 说明恢复工作流试图防止再次感染，而不只是恢复字节
        - 扫描覆盖深度和误报处理没有公开基准
      - - FIPS、数据主权和 24+ 区域表述
        - DataProtect 和云解决方案页面中明确
        - 受监管及主权敏感型部署
        - 支撑受监管环境定位和按区域部署云服务
        - 认证范围和部署细节主要仍来自供应商自述
      - - SOC 2 Type II 合规存储声明
        - AWS Cloud Services 列表中明确
        - 托管云备份服务
        - 为托管云服务路径增加合作伙伴背书的信任信号
        - 不能自动外推到每一种自管或跨云部署模式
      - - Microsoft 365 Backup Storage 集成
        - Microsoft Adoption 页面中明确
