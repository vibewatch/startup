        - 低
        - 中
        - 数据分类、保管库和策略控制能帮助受监管客户履行自身义务。
        - 索取客户版保障措施映射，明确服务商责任和事件通知流程。
      - - OMB 零信任与 CISA 指引
        - 联邦买家越来越按零信任和安全设计预期评估供应商，即使这些预期本身并不是产品认证。
