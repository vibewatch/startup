  - id: TV005
    title: 打破投资逻辑与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 为什么重要
      - 行动含义
    rows:
      - - 隐性杠杆
        - 债务包足够大，把有效股权价值拉到官方交割锚点以下
        - 如果债务吃掉大部分上行空间，高企业价值也不值得投。
        - 重置到悲观情景区间，避免溢价入场。
      - - 优先股堆叠侵蚀
        - Series H 或展期条款实质性压低新股权顺位
        - 即便账面 EV 上升，优先清算瀑布也可能毁掉普通股回报。
        - 看不清瀑布前，避开老股或 IPO 配售。
      - - 继承队列留存偏弱
        - Veritas 续约、迁移或支持业务经济性不及预期
        - 账面 ARR 质量比账面 ARR 规模更重要。
        - 把倍数压到接近 Commvault，甚至更低。
      - - IPO 准备中的披露失败
        - 未来监管文件缺少队列留存、收入结构和债务透明度
        - 公开市场投资者会拿 Rubrik 对标披露质量，而不是私营公司惯例。
        - 维持继续研究，或放弃参与 IPO。
      - - 宏观退出窗口关闭
        - IPO 市场走弱，同时投行要求更低倍数
        - 退出环境不友好时，好公司也可能以弱价格成交。
        - 要求更大入场折扣，或推迟参与。
      - - 未证明先要溢价
        - 管理层或卖方在缺少 Rubrik 级证据时，要求 Rubrik 式倍数
        - 核心错误，是为私募溢价的不确定性支付上市公司溢价价格。
        - 新证据出现前，按硬性拒绝处理。
    notes: 这些否决触发因素关注隐性结构如何传导到估值， 而不是重复风险章节已经覆盖的通用经营风险。
    claimRefs:
      - CV023
      - CV054
      - CV055
      - CV056
      - CV057
      - CV058
      - CV059
      - CV060
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 债务包
        - 确切债务金额、利息成本、期限、契约余量和担保情况
        - 把官方企业价值式估值转成股权价值，需要这些数据。
        - CFO 与贷款方资料室；债务条款清单。
      - - 股权结构瀑布
        - Series H 经济条款、展期持股、清算优先权和附函
        - 决定新投资者能否真正分享上行。
        - 财务加法务审阅章程、附函和瀑布模型。
      - - 合并后收入结构
        - 原生 Cohesity 与继承 Veritas 的 ARR、支持和维护收入结构
        - 拆清经常性软件质量与传统维护拖累。
        - 管理层桥接材料和队列收入明细。
      - - 留存证明
        - 按旧平台队列拆分的总留存、NRR 和迁移成功率
        - 判断是否应重估到溢价倍数的核心输入。
        - 收入运营和客户成功队列分析。
      - - 上市公司披露包
        - 未来 IPO 文件的 KPI 草案、审计就绪度和现金流桥接
        - Rubrik 级倍数需要 Rubrik 级披露。
        - 投行准备材料和审计师工作计划。
      - - 老股价格发现
        - 按股份类别观察到的交割后交易，而不是模型估计
        - 实时市场信号会验证或挑战官方交割锚点。
        - 经纪商指示、撮合交易日志或董事会转让批准。
    notes: 这些要求按它们改变估值置信度的幅度排序，而不是按收集难度排序； 前三项缺任何一项，当前区间都更像叙事，而不是完成承销的估值。
    claimRefs:
      - CV055
      - CV056
      - CV057
      - CV058
      - CV059
      - CV060
