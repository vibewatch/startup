  - id: TI004
    title: 资本充足性表
    columns:
      - 资本项目
      - 公开数值 / 状态
      - 重要性
      - 后续影响
      - 尽调要求
    rows:
      - - 股权融资
        - Haveli 领投的 Series H 提供了交易所需大部分股权资金；Coatue、Sapphire 和 Dragon 也参与。
        - 说明交易并非只靠债务融资，也带来新的财务赞助方支持。
        - 提供整合现金跑道，但也抬高了最终流动性的预期。
        - 提供股权结构表、优先权和交割后持股比例。
      - - 债务融资
        - J.P. Morgan 安排并承诺提供融资；确切债务金额未披露。
        - 债务规模决定杠杆、利息负担和再融资风险。
        - 即使收入规模强，不透明的杠杆也会压低估值。
        - 提供债务规模、定价、到期日、契约条款和摊还安排。
      - - 原 Veritas 债务置换
        - 公告提到与既有债务相关的交换要约或类似交易。
        - 说明这笔剥离交易除普通股权支票外，还带有融资复杂性。
        - 可能改变实际杠杆和索偿优先级。
        - 提供交换要约机制和交割后债务堆栈。
      - - 账面现金 / 现金跑道
        - 未公开披露 Cohesity 或合并公司的数据。
        - 现金和跑道决定 IPO 时点是可选项还是被迫选择。
        - 投资者无法判断增长计划能否自筹资金。
        - 提供交割现金、月度烧钱或 FCF，以及基准 / 下行情景下的跑道。
      - - 计划资金用途
        - 公开强调增长、全球扩张、客户支持连续性和产品创新。
        - 资本配置能说明交易资金用于进攻、防守，还是整合清理。
        - 沉重的支持负担可能拖慢利润率扩张。
        - 提供整合预算、协同计划和产品投资路线图。
      - - 下一轮融资或 IPO 触发条件
        - 管理层表示，可能在取得一整年合并业绩后于 2026 年 IPO。
        - IPO 窗口是新老投资者最清晰的公开流动性路径。
        - 宏观时点风险仍不受管理层控制。
        - 如果 IPO 市场继续关闭，提供董事会批准的融资计划。
    notes: 大体融资结构已经公开，但债务层和现金跑道并不透明；这个缺口是资本充足性只能部分回答的关键原因。
