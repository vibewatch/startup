            body: >-
              情景分析比点估值更重要，因为资本结构藏在水下。基准情景最容易从公开证据中支撑：合并后公司价值约 $7-$9 billion，让 Cohesity 高于 Commvault 式成熟软件交易水平，但低于 Rubrik
              的上市高溢价倍数。这个区间实质上是在说，官方交割锚点站得住，但并不明显便宜。乐观情景可拉到约 $10-$13 billion，但前提是投资者看到上市公司级别证据：28% 调整后现金 EBITDA
              利润率可持续，合并后增长保持在十几个百分点中段或更好，继承 Veritas 队列的留存稳固，而且债务不吞掉股权上行。悲观情景约 $4.5-$6
              billion；如果倍数压缩、迁移摩擦或杠杆风险把业务拖向低质量基础设施可比公司，或拖向 Yahoo/Forge
              上可见的模型化私人估值，这一情景就变得可信。由于下行情景由缺失分母驱动，而不是明显产品弱点，入场纪律比叙事信念更重要。
