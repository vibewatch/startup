  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图、同行集合与替代路径
        blocks:
          - type: paragraph
            body: >-
              Cohesity 的竞争集合比投资人口头常提的四个直接同行更宽。独立 2025 年市场报道仍把 Rubrik、Veeam、Commvault、Cohesity、Dell 和 Druva
              放在企业备份与数据保护品类第一梯队，但实际采购场还包括 Microsoft 和 AWS 原生服务、IBM 长期经营的保护栈，以及许多企业仍在运营上熟悉的 Veritas
              存量。这形成了多层版图：直接平台同行争夺大型整合项目；既有供应商防守现有环境；超大规模云厂商原生替代品则能满足更窄的云内工作负载，而无需完整控制平面的推倒重来。


              这种结构很重要，因为买方并不是只在两个边界清楚的产品之间做选择。大型企业可以保留 Veeam 覆盖广泛 VM，用 Azure Backup 或 AWS Backup 处理云原生工作负载，依靠 IBM 或 Dell
              覆盖重留存或与现有环境绑定的用例，同时继续评估 Cohesity、Rubrik 或 Commvault
              的网络恢复和编排能力。换句话说，真实替代集合既包括完整平台挑战者，也包括足够多的现状工具，让多栖部署继续存在。Cohesity 的优势在于，Veritas
              之后的广度已经进入这片更宽版图的第一梯队；但同样的广度也让它同时面对更多竞争正面。
