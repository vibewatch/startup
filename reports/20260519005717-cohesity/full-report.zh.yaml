companyProfile:
  summary: >-
    Cohesity 是一家总部位于 San Jose 的数据安全公司，Mohit Aron 于 2013 年创立；2024 年 12 月与 Veritas 的企业数据保护业务合并交割后，公司以合并主体运营。它的平台横跨
    DataProtect、NetBackup、 保险库、云备份，以及覆盖混合云、多云和 SaaS 环境的 Gaia / AI 韧性工作流。交割材料显示，合并主体备考收入超过 $1.7 billion，ARR 为 $1.5
    billion，企业客户超过 12,000 家；公司当前口径则称客户数超过 13,000 家，覆盖约 70% 的 Global 500。即便规模已经很大，Cohesity
    仍是一家私营且披露很少的公司：公开资料没有给出当前员工数、债务规模或交割后的确切持股条款。
