  - id: TE002
    title: 工作流 / 使用场景表
    columns:
      - 用户任务
      - 当前工作流问题
      - Cohesity 工作流
      - 可衡量收益 / 证据
      - 已知限制
    rows:
      - - 保护混合工作负载
        - 备份工具按本地、云和 SaaS 环境割裂
        - 用 DataProtect 或 NetBackup，在更宽的 Data Cloud 控制叙事下跨环境保护工作负载
        - 官方页面称 DataProtect 覆盖本地、云和 SaaS，NetBackup 覆盖云、VM、文件和 Kubernetes
        - 跨产品运维简化的独立公开证据有限
      - - 保留干净恢复副本
        - 普通备份副本对勒索软件恢复来说可能隔离不够
        - 将受保护数据复制或封存到 FortKnox 或 Alta Recovery Vault，用于隔离的干净恢复
        - FortKnox 和 Alta Recovery Vault 都强调不可变性、恶意软件扫描、加密和干净恢复
        - 测试节奏、恢复顺序和运维开销在公开资料中没有深入说明
      - - 管理混合的 Cohesity 和 Veritas 环境
        - 既有 NetBackup 客户需要连续性，同时不能失去现代化路径
        - 在保留既有环境的同时，将 NetBackup 管理开通到 Helios 或 Alta View
        - Helios 开通明确支持管理 NetBackup 环境，并允许按数据主权选择区域
        - 开通仍似乎是手动流程，最长可达 2 个工作日
      - - 保护 Microsoft 365 和云原生数据
        - M365 和云数据需要单独的留存与恢复工具
        - 用 Cloud Services 和 Microsoft 365 Backup Storage 集成，更快保护云和 SaaS 数据
        - Microsoft 称 Cohesity 客户很快将获得近乎即时的完整备份和恢复，并支持策略上下文恢复
        - 收益时点仍是前瞻表述，不是完整历史证明
      - - 把安全上下文送入相邻工具
        - 事件响应人员需要在既有平台中看到备份告警和恢复上下文
        - 用 Splunk add-on、ServiceNow 自动化，以及 SOAR 或 XDR hooks，把数据和动作送入既有工作流
        - 公开页面展示了 Splunk add-on，以及 Alta Data Protection 针对 SOAR 或 XDR 事件的暂停 / 恢复钩子
        - 连接器覆盖真实存在，但仍依赖集成，并非纯原生能力
      - - 激活受保护数据用于 AI
        - 企业 AI 缺少受治理的历史上下文，且常需要昂贵 ETL 复制
        - 用 Gaia 搜索和总结不可变时间序列备份数据，并把上下文注入 Copilot、Gemini 或 Glean
        - Gaia 页面声称可无复制激活、语义搜索、向量索引和具名智能体集成
        - 护栏、预览边界和生产成熟度在公开资料中没有完整说明
    notes: 收益单元格混合公司声称、合作伙伴描述和有限评测证据。除非明确注明，量化性能表述仍来自厂商或合作伙伴。
