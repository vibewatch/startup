  - id: TV001
    title: 建议摘要表
    columns:
      - 指标
      - 当前判断
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - 观察 / 继续研究
        - 官方 >$7B 锚点有支撑，但杠杆和分配瀑布细节缺失。
        - 暂不要按溢价倍数承销。
      - - 信心
        - 中低
        - 规模和可比公司测算可见；债务、优先股权利和队列结构不可见。
        - 在把上行视为可投资前，需要更多尽调。
      - - 估值立场
        - 官方交割价合理；没有新披露时，超过 $10B 偏高
        - 官方交割价意味着约 4.1x 收入、4.7x ARR；相比之下，Rubrik 接近 9x+ EV/revenue，Commvault 接近 3.6x。
        - 存在上行，但前提是披露质量大幅提升。
      - - 入场纪律
        - 穿透债务后，偏好 <=5x 收入或 <=6x ARR
        - 这样入场价更接近打折后的公开可比公司区间，而不是 Rubrik 的溢价带。
        - 不要为私营公司的不透明支付公开市场溢价。
      - - 上调触发因素
        - 公开市场级别的债务、队列和现金流披露
        - 需要债务规模、分配瀑布、原生与继承 ARR 结构，以及留存证明。
        - 只有到那时，超过 $9B 的案例才可承销。
      - - 主要下行触发因素
        - 隐藏杠杆或合并后留存偏弱
        - 任一问题都会把公司压向低质量软件倍数。
        - 若触发，重估至 $4.5-$6B 悲观区间。
    notes: 这份摘要带有判断色彩，因为公司披露了企业级收入规模，却没有披露把企业价值转换成股权回报案例所需的债务和优先股堆叠。
