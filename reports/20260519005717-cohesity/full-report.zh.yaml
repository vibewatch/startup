  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标
      - 对承销判断的影响
      - 公开可比公司披露内容
      - 具体尽调路径
    rows:
      - - 独立 Cohesity 收入、毛利率和现金流
        - 阻碍把原 Cohesity 经济性与合并备考指标清晰拆开。
        - Rubrik 和 Commvault 都披露收入、毛利率和现金流细节。
        - 索取经审计的独立财务报表，以及进入合并备考结果的桥接。
      - - 债务金额、杠杆率和到期日
        - 阻断估值、偿付能力和再融资分析。
        - 公开同业在申报文件和业绩材料中披露现金和债务。
        - 索取最终债务协议、贷款人演示材料和任何交换要约材料。
      - - 按软件、支持、SaaS 和服务拆分的收入组合
        - 难以判断收入持久性和毛利质量。
        - Commvault 公开拆分订阅、期限许可和 SaaS 收入。
        - 索取按产品族和交付模式拆分的 ARR 与收入组合。
      - - CAC、回本周期和队列销售效率
        - 阻碍资本效率分析和前瞻烧钱建模。
        - 即使没有完整 CAC 细节，Rubrik 也给出 ARR 贡献和自由现金流披露。
        - 索取队列预订额数据、S&M 支出映射和回本周期分析。
      - - 继承 Veritas 客群的留存、流失和续约数据
        - 让合并后最大的收入风险无法量化。
        - 公开同业每季度讨论 ARR 和客户队列。
        - 索取总留存率、流失瀑布和迁移转化数据。
      - - 合并公司现金余额和现金跑道
        - 让 IPO 时点在叙事上看似可选，但数字无法验证。
        - Rubrik 和 Commvault 都披露现金余额和自由现金流。
        - 索取交割现金、流动性预测和下行跑道情景。
    notes: 每一行都是会直接影响承销信心的公开数据缺口；只靠更仔细阅读现有新闻稿，一个也解决不了。
