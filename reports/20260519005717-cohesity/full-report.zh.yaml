      - number: '2.4'
        title: 增长驱动、采用触发点与约束
        blocks:
          - type: paragraph
            body: >-
              这个市场的需求驱动很具体，不是概念性想象。CISA 勒索软件指南把离线、加密且经过测试的备份列为基线控制；GAO 则记录了勒索软件对关键基础设施的影响，以及领先实践采用仍不完整。Cohesity
              自身调研也指向同一方向：只有 39% 的组织表示在混合与多云环境中使用单一平台，少于一半遵循 3-2-1 或使用不可变性，只有 6% 真正达到风险就绪。IDC 摘要语言还给出宏观读法：市场保持韧性，因为它现在处在
              AI 项目、勒索软件防御和基础设施优化的交汇点。公共部门需求也并非理论存在；Cohesity 政府指南称 72% 的州计划在 12 到 18 个月内升级备份和恢复，而 GAO
              点名医疗、交通、能源和制造业都是活跃勒索风险行业。


              同一组证据也解释了为什么采用不会自动转化为快速收入。买方面临既有供应商拖拽、复杂评估周期、认证要求、公共部门预算时间，以及许多组织尚未落地的洁净室式恢复能力。IDC
              明确称价格和既有供应商地位同样重要，不只是功能；Rubrik 文件也警告，政府资金授权和认证要求可能拖慢甚至打断需求。因此，Cohesity 受益于强劲长期需求，但估值仍取决于它能否在不依赖过宽 TAM
              叙事的情况下，把需求转化为更快迁移、更大交叉销售套装和可复制的渠道辅助转化。
