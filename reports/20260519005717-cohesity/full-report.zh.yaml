      - number: '3.2'
        title: 直接竞争者画像、部署模式与定价不透明
        blocks:
          - type: paragraph
            body: >-
              直接同行比较已经不只是备份性能。Rubrik 的主张是围绕数据和身份安全构建云原生 SaaS 控制平面，并通过先落地再扩张的 动作销售，越来越依赖生态系统杠杆。Commvault 是最接近 Cohesity
              广度的类比对象，因为它明确横跨托管 SaaS、客户自管软件、集成设备和合作伙伴交付模式，并把网络恢复打包进模块化层级。Veeam 的 2026 年故事更偏路线图：更广的 hypervisor 支持、自动化 AD
              Forest Recovery，以及试图降低迁移摩擦的统一运营界面。Druva 走了相反方向，以完全托管 SaaS、客户无需直接保护基础设施，以及以自动化为中心的勒索响应来形成差异。


              定价透明度远低于营销文案暗示。官方公开价格最容易从超大规模云厂商原生服务和 Druva 定价简报中找到；后者明确提到常见计划、企业折扣和用量折扣。Commvault
              的包装页面有助于理解功能打包，但仍把买方推向销售对话，而不是公开企业价目表。已核验的 Rubrik 和 Veeam
              资料同样展示了架构、路线图和生态深度，却没有给出清晰公开标价，无法让投资人或买方做苹果对苹果的经济性对标。这意味着，即便在功能比较开始之前，采购能力、折扣行为和装机基础杠杆仍是重要竞争变量。
