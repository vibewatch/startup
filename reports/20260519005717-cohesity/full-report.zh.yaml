              Cohesity 确实有扩展界面，但按成熟 SaaS 的标准看，它更偏集成驱动，而不是平台原生。开发者门户主推 API、自定义工作流和应用构建；应用构建文档显示，公司确有一个基于 Docker
              容器、AppSpec 和 SDK 的应用框架，可以发布到 Cohesity Marketplace。2026 年 5 月 GitHub 上的社区自动化样例、Ansible
              collection、PowerShell module 和 Terraform provider
              也证明，工程团队正在主动扩展这个平台。与此同时，多个代码仓库提醒脚本和集成属于尽力而为，并非官方支持；这对计划重度自动化的买方很重要。生态叙事在有合作伙伴分销的地方最强：ServiceNow
              有上架应用，Splunk 有附加组件，Microsoft 和 AWS 提供 Cohesity Marketplace 产品，Marketplace 本身还突出展示 Cisco XDR
