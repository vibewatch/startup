      - number: '1.2'
        title: 领导层、治理与从创始人到职业经理人的过渡
        blocks:
          - type: paragraph
            body: >-
              领导权已经明显从创始人主导转向运营者主导。2021 年 3 月估值公告仍把 Mohit Aron 描述为 CEO 和创始人，但当前官方材料显示 Sanjay Poonen 担任 President and
              CEO；独立报道也把他 2022 年 8 月加入公司，与一项刻意整合碎片化数据保护市场的计划联系起来。Veritas 交易之后，治理结构也扩容。官方合并材料称 Greg Hughes
              将继续以董事和战略顾问身份参与，Brian Sheth（Haveli）、Patrick McCarter（Carlyle）和 Sandesh
              Patnam（Premji）获得董事会或观察员席位。当前领导层页面还显示 Kevin Mandia 担任独立董事，并强调董事会由独立代表和投资方代表共同组成。这种组合给 Cohesity
              带来规模化治理的好处，但也暴露了关键人依赖。公开发布、合作伙伴公告和整合信息仍围绕 Sanjay 与少数具名高管展开。如果增长、整合或 IPO
              准备失速，即便第三方名录暗示内部梯队比官网逐一展示的更宽，公司的领导层叙事在公开层面仍缺少冗余。
