  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入的支出
        blocks:
          - type: paragraph
            body: >-
              Cohesity 的市场不应被框成狭窄的备份设备小赛道。已核验证据指向一个分层市场定义：核心是数据复制与保护软件品类；其上叠加网络恢复，增加完整性和干净恢复要求；旁边还有数据安全 /
              数据管理工作负载，供应商借此扩大总可用市场（TAM）。边界最清楚的一层是 IDC 的数据复制与保护软件市场；Veritas 合并材料把 2024 年厂商销售额定在约 $12.2-$12.3
              billion。这个核心层明确包括企业备份、复制、恢复及相关软件收入。单靠它还无法覆盖供应商如今打着网络韧性、SaaS 保护或数据安全态势名义销售的所有相邻工作负载。


              Cohesity 及同行希望投资人计入的周边支出，包括网络恢复工具、SaaS 保护广度、安全驱动的恢复工作流，以及部分托管或合作伙伴交付的服务。IDC 自身的 MarketScape
              表述支持这种更宽框架：它把网络恢复与传统 DR 区分开，也把 SaaS 保护与原生应用工具区分开。与此同时，这并不意味着每一笔相邻安全或存储预算都属于 Cohesity
              的真实市场。纯网络安全、端点安全、通用存储硬件和无关云管理工具，仍在本章工作边界之外。真正相关的现状替代方案，是既有备份套件、原生点状工具和 MSP 交付的恢复服务，而不是一个统一买方预算。
