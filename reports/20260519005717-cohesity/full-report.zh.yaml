      - number: '4.4'
        title: 上市公司参照、披露缺口与财务结论
        blocks:
          - type: paragraph
            body: >-
              上市同行让 Cohesity 的披露缺口无法被忽视。Rubrik 的 S-1 披露 2024 财年收入 $627.9 million、Subscription ARR $784.0 million，IPO
              前自由现金流为负。一年后，Rubrik 2026 财年结果显示收入 $1.32 billion、订阅 ARR $1.46 billion、GAAP 毛利率 80.1%、自由现金流 $237.8
              million，以及现金和短期投资 $1.68 billion。Commvault 2024 年报已经给出收入、现金和 ARR 增长；2026 财年结果进一步披露收入 $1.184 billion、总 ARR
              $1.122 billion、GAAP 毛利率 81.2%，自由现金流 $237 million。在这个背景下，合并后的 Cohesity 在已披露收入和 ARR
              上都比任一上市可比公司更大，这有战略价值。但比较仍不完美，因为 Cohesity 的标题级盈利指标是合并备考口径下的调整后现金 EBITDA，而不是上市公司式 GAAP 或标准化 non-GAAP
              桥接。财务结论因此是：规模和经常性收入质量为正，但可承销性要谨慎。投资人看不到独立财务、债务条款、定价实现和合并后留存之前，公司更容易在收入规模层面令人钦佩，而不是让人有把握地估值。
