        title: 支持质量和产品迁移风险卡在路线图与续约之间
        blocks:
          - type: paragraph
            body: >-
              公开客户情绪并不灾难，但噪声恰好集中在大平台转换时会变危险的地方。TrustRadius 用户提到许可证可见性、错误清晰度和 O365 工作流缺口。PeerSpot
              突出了报表限制、云恢复速度慢、遗留集成需求、文档缺口和支持响应不均。Cohesity 自有社区需要 MyCohesity
              登录，这对企业软件很正常，但降低了外部对问题量或反复缺陷模式的可见度。这些都不能证明系统性失败。事实上，评论平台仍有不少对恢复速度、简单性和节省成本的认可。风险更微妙：当更多 NetBackup 和 Alta
              客户决定留下、转换或扩张时，报表、恢复性能、文档和支持响应时间上的普通摩擦，可能叠加成续约犹豫。因此，产品支持迁移风险卡在技术整合故事和商业留存故事之间；它决定路线图承诺会落成运营事实，还是变成失望。
