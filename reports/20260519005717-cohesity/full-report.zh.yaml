  - id: TU005
    title: 扩张和集中度风险表
    columns:
      - 扩张驱动 / 集中度风险
      - 影响路径
      - 当前证据
      - 规模 / 含义
      - 尽调路径
    rows:
      - - 继承 Veritas 装机基础的续约和迁移
        - 合并后最大扩张池，也可能是最大流失池
        - 路线图承诺多年支持、自愿迁移和未来工具
        - 上行空间可能很大，但同一区域也是最大的续约风险盲区
        - 要求继承 NetBackup 和 Alta 客户的续约分组、转化数量和价格折让历史
      - - 云和超大规模云厂商渠道扩张
        - 合作伙伴可获客、部署并加售云备份、主权隔离库和 AI 工作流
        - AWS SCA、AWS Gov Cloud 列表、Google Cloud 奖项和合作伙伴奖项都显示渠道动作活跃
        - 有意义的增长杠杆，但合作伙伴依赖也会稀释支持责任
        - 衡量合作伙伴来源渠道 ARR 和由合作伙伴牵头的支持升级
      - - 受监管账户内模块扩张
        - 核心备份可扩展到 FortKnox、M365、Google 工作负载、Gaia 或合规要求重的恢复项目
        - Bethany、Maryland、RB、Nasdaq 及 AWS/Google 材料均显示相邻工作流扩张
        - 如果附加率真实，落地扩张逻辑为正
        - 要求按装机基础分组披露 FortKnox、云服务、SaaS 备份和 Gaia 的附加率
      - - 评论平台暴露的支持和培训摩擦
        - 运营摩擦会拖慢续约，并降低采用新模块的意愿
        - Capterra、G2 和 PeerSpot 均暴露培训、报表、设置和支持投诉
        - 中等风险：单独看不至于打破投资论点，但若叠加并购复杂性就很重要
        - 审查支持 KPI 仪表盘、培训采用率，以及恢复成功相关的产品遥测证据
      - - 收入集中度不透明
        - 具名客户标识未必对应收入集中度或续约时间
        - 未找到公开的头部客户收入明细或续约日历
        - 这是重要承销缺口，因为少数超大账户可能主导 ARR
        - 要求披露前 20 大 ARR、期限和续约日历
      - - 客户数观感与证明质量
        - 合并后的大客户数可能夸大当前同平台部署深度
        - 宽口径数量已披露，但多数硬证据来自较小一组经筛选具名引用
        - 将客户标识转化为持久采用时，这是重要分析风险
        - 在尽调材料中拆分 Cohesity 原生客户分组、继承的 Veritas 客户分组和可作引用的生产账户
    notes: 本表混合上行驱动和风险。它区分公开支持承诺与实际迁移、留存和集中度结果的缺失证据。
