      - number: '7.2'
        title: 网络安全、法律和主权要求会放大普通软件执行风险
        blocks:
          - type: paragraph
            body: >-
              Cohesity 销售进入的环境里，备份不只是基础设施管道，而是受监管的韧性基础设施。因此，监管和主权风险高于普通企业软件厂商。金融行业客户面对 DORA，关键行业运营方需要面对 NIS2，联邦买家受 OMB
              零信任要求和 CISA 成熟度模型影响；一旦未来 IPO，公司还会进入 SEC 网络治理和事件披露规则之下。这些来源都没有说 Cohesity
              已经踩线；风险在于，产品、支持、审计和报表成熟度必须跟上公司现在瞄准的受监管客户。DOJ 与 Georgia Tech 的和解说明，政府项目里的网络安全控制失败可能演变成 False Claims Act
              事件；FTC 保障规则指南则说明，泄露报告和服务提供商监督仍在收紧。落到实务里，受监管客户胜单会把门槛抬高两次：产品要能跑，背后的证据包也要经得起采购、认证和事后审查。
