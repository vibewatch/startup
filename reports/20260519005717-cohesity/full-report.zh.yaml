      - number: '8.2'
        title: 上市可比公司基准与可承销性
        blocks:
          - type: paragraph
            body: >-
              最接近的上市锚点说明，Cohesity 不能简单继承 Rubrik 的高溢价倍数。Rubrik 的 2026 财年业绩叠加 2026 年 5 月市场数据，意味着 EV-to-revenue 约
              9.3x-9.8x、EV-to-ARR 约 8.4x-8.8x；支撑因素包括 48% 收入增长、80.1% GAAP 毛利率、正自由现金流和 $1.68 billion 现金余额。相比之下，Commvault
              的交易水平接近 3.6x EV-to-revenue、约 3.8x EV-to-ARR，增长较低，但毛利率相近，自由现金流可比。Cohesity 官方交割锚点，至少约 4.1x 收入、4.7x
              ARR，位于这两个上市标尺之间。这个位置对一家有规模但不透明的私人公司方向上合理：披露的收入规模大于两个同行，但可承销性更弱，因为投资者无法检查杠杆、优先股堆叠，或原生 ARR 与继承 ARR
              的混合。正确结论是，当前官方锚点并不明显便宜；如果假设相对 Rubrik 有显著债务和披露折扣，它也不明显虚高。
