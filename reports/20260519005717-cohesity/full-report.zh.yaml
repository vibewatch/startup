      - number: '2.3'
        title: 买方、用户、付款方与渠道图谱
        blocks:
          - type: paragraph
            body: >-
              Cohesity 这类平台的可见买方仍由 IT 主导。IDC 反复描述的是“IT 买方”，而非业务职能负责人，并建议他们权衡复杂度、广度、服务、价格和既有供应商地位。Cohesity 展示的 Gartner
              Peer Insights 角色也强化了这个框架：备份管理负责人、银行系统工程师和 CIO 是公开可见的操作者与评估者。Rubrik
              文件补充称，大型企业采购可能变成全组织决策，测试和教育周期漫长；公共部门动作则需要专门覆盖联邦、州和地方销售。实践中，用户往往是备份、基础设施或安全运营团队；买方通常是基础设施或网络安全负责人；付款方似乎也在同一技术预算体系内，但公开资料没有给出足够的分行业定价或签署人细节，无法下定论。


              渠道结构重要，因为 Cohesity 不必用纯直营软件动作拿下每一个工作负载。Veritas 交割材料强调了横跨 VAR、系统集成商、云服务商、MSP 和 OEM 的庞大合作伙伴生态；11:11 Systems
              则显示，这一品类也能作为托管备份、复制、恢复、DRaaS
              和网络保险库服务出售。公共部门和运营精简的中端市场客户最看重这一点：合规门槛、服务深度和采购支持可能压过产品功能差异。结果是，进入市场路径设计成了产品的一部分，而不只是销售外壳。
