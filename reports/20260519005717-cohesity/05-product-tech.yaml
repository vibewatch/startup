- id: workflow-and-architecture
  title: Customer workflow and operating architecture
  body: 'At a workflow level, Cohesity starts with broad workload capture, adds centralized policy and search, then layers vaulting and orchestrated recovery on top. DataProtect is the clearest expression of that pattern on the Cohesity side: single management, immutable snapshots, fast search, instant restore, and optional backup as a service. NetBackup extends the same story into the inherited Veritas estate, especially for appliances, Kubernetes, and high-scale enterprise recovery. The most important architecture signal after the combination is the control-plane story. Helios provisioning shows that NetBackup management is being folded into the Cohesity plane, but the onboarding sequence still depends on manual ticketing and can take up to two business days. That is good enough to prove continuity, but not yet elegant enough to remove all integration friction. The architecture is therefore plausible and enterprise-grade, yet still visibly mid-integration rather than fully harmonized.'
