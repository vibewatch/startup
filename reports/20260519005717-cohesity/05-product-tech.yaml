- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow problem
  - Cohesity workflow
  - Measurable benefit / evidence
  - Known limitation
  rows:
  - - Protect hybrid workloads
    - Backup tools are siloed by on-prem, cloud, and SaaS environment
    - Use DataProtect or NetBackup under a broader Data Cloud control story to protect workloads across environments
    - Official pages say DataProtect spans on-prem, cloud, and SaaS and NetBackup covers cloud, VMs, files, and Kubernetes
    - Independent public proof for cross-product operational simplicity is limited
  - - Keep a clean recovery copy
    - Ordinary backup copies may not be isolated enough for ransomware recovery
    - Replicate or vault protected data into FortKnox or Alta Recovery Vault for isolated clean recovery
    - FortKnox and Alta Recovery Vault both emphasize immutability, malware scanning, encryption, and clean recovery
    - Testing cadence, recovery sequencing, and operational overhead are not deeply documented publicly
  - - Manage a mixed Cohesity and Veritas estate
    - Legacy NetBackup customers need continuity without losing modernization paths
    - Provision NetBackup management into Helios or Alta View while keeping the existing environment
    - Helios provisioning explicitly supports managing NetBackup environments and allows regional selection for sovereignty
    - Provisioning still appears manual and can take up to two business days
  - - Protect Microsoft 365 and cloud-native data
    - M365 and cloud data need separate retention and restore tooling
    - Use Cloud Services and Microsoft 365 Backup Storage integrations for faster cloud and SaaS protection
    - Microsoft says Cohesity customers will soon get near-instant full backups and restores with policy-context recovery
    - Benefit timing is still forward-looking rather than fully historical proof
  - - Send security context into adjacent tools
    - Incident responders need backup alerts and recovery context inside existing platforms
    - Use Splunk add-on, ServiceNow automation, and SOAR or XDR hooks to move data and actions into existing workflows
    - Public pages show a Splunk add-on plus Alta Data Protection pause-resume hooks for SOAR or XDR events
    - Connector coverage is real but still integration-dependent rather than purely native
  - - Activate protected data for AI
    - Enterprise AI lacks governed historical context and often requires costly ETL duplication
    - Use Gaia to search and summarize immutable time-series backup data and inject that context into Copilot, Gemini, or Glean
    - Gaia page claims no-copy activation, semantic search, vector indexing, and named agentic integrations
    - Guardrails, preview boundaries, and production maturity are not fully documented publicly
  notes: Benefit cells mix company-claimed, partner-described, and limited review evidence. Quantitative performance statements remain vendor- or partner-framed unless explicitly noted otherwise.
