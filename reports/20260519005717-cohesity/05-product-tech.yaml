        detail: RBAC and auditability are explicit, but deep assurance detail is limited.
      - label: High
        tone: warning
        detail: The feature story depends heavily on Microsoft, Google, Glean, and NVIDIA ecosystems.
      - label: High
        tone: warning
        detail: Gaia Catalog is still coming soon and connector maturity is not fully spelled out.
    - label: Developer and automation surface
      values:
      - label: Medium
        tone: neutral
        detail: Developer portals and repos exist, but some surfaces are sparse.
      - label: Low
        tone: warning
        detail: Important support and lifecycle boundaries are only partially documented in public.
      - label: Medium
        tone: neutral
        detail: Extension paths can automate workflows, but they are not all security-assured products.
      - label: High
        tone: warning
        detail: A large share of the value sits in GitHub repos, Terraform, PowerShell, and partner stores.
      - label: Medium
        tone: warning
        detail: Active repo updates are positive, but best-effort language increases support volatility.
callouts:
- calloutType: strength
  title: Breadth is real across protection, vaulting, cloud backup, and AI activation
  body: Cohesity is no longer selling only a backup engine. Public product, partner, and documentation surfaces support a broad estate that now includes DataProtect, NetBackup continuity, FortKnox or Recovery Vault, cloud services, app extensibility, and Gaia-driven AI context activation.
  claimRefs:
  - CE001
  - CE007
  - CE017
  - CE025
  - CE028
  - CE032
- calloutType: insight
  title: The extension surface is meaningful but not uniformly enterprise-supported
  body: Developer portals, GitHub repos, Terraform, PowerShell, ServiceNow, and Splunk show that Cohesity has a real integration and automation surface. The same sources also repeatedly warn that several repos and scripts are best-effort rather than formally supported, which matters for production automation plans.
  claimRefs:
  - CE017
  - CE019
  - CE020
  - CE021
  - CE022
  - CE023
  - CE024
- calloutType: risk
  title: Post-Veritas complexity is the main product risk
  body: The biggest technical risk is not missing features but operating complexity. Multiple control-plane names, authenticated docs, legacy Veritas support properties, manual Helios provisioning, and limited independent performance evidence all suggest day-two execution could lag the marketing story.
  claimRefs:
  - CE014
  - CE034
  - CE035
  - CE036
  - CE039
  - CE040
  - CE041
