- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role in operating model
  - Key dependency
  - Technical risk
  rows:
  - - Workload and data-source layer
    - Feeds the protection estate across on-prem, SaaS, cloud-native, NAS, database, VM, and container sources
    - Connector coverage, workload support depth, and source-specific policy logic
    - Public breadth is strong, but workload-specific depth is not equally documented for every module
  - - Primary protection engines (DataProtect and NetBackup)
    - Create protected copies, apply policy, and recover workloads across self-managed and inherited estates
    - Consistent policy semantics across products plus clean overlap management
    - Feature overlap versus product distinction is not always transparent after the Veritas combination
  - - Control plane (Helios / Alta View)
    - Centralizes visibility, provisioning, and management across the estate
    - Provisioning workflows, regional selection, and management-surface convergence
    - Multi-brand control-plane naming and manual onboarding suggest ongoing integration work
  - - Vaulting layer (FortKnox / Alta Recovery Vault)
    - Holds isolated clean copies for cyber recovery and disaster scenarios
    - Cloud provider choice, replication paths, malware scanning, and immutability controls
    - Public docs do not fully expose operating costs, drills, or failure modes during real incidents
  - - Recovery orchestration layer (RecoveryAgent / Blueprints)
    - Automates sequencing, testing, and execution of recovery workflows
    - Blueprint quality, clean-recovery recommendations, and application dependency mapping
    - Detailed blueprint mechanics are marketed more heavily than they are publicly documented
  - - Integration and app layer
    - Moves alerts, logs, and workflows into Splunk, ServiceNow, SOAR/XDR tools, and marketplace apps
    - Connector maintenance, partner APIs, and support ownership
    - Multiple public repos and samples are best-effort, so enterprise support boundaries are not always clean
  - - AI activation layer (Gaia)
    - Searches and summarizes immutable historical data and injects governed context into agentic AI tools
    - Vector indexing, RBAC-preserving retrieval, model routing, and partner integrations
    - The AI feature story is strong, but the public evidence base is still thin on guardrails and hard GA boundaries
  notes: This architecture table separates directly evidenced layers from inferred operating dependencies. Risks emphasize where the public product story outruns the public technical detail.
