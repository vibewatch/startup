company:
  name: Cohesity
chapter:
  number: 5
  title: Product & Technology
  summary: 'Cohesity''s post-Veritas product surface is genuinely broad: DataProtect, NetBackup, FortKnox or Alta Recovery Vault, managed cloud backup, Helios or Alta control planes, and Gaia all appear on live official or partner surfaces. Public evidence supports meaningful strengths in immutability, cyber-vaulting, cross-cloud and Microsoft 365 backup, partner integrations, and API or app extensibility, but the deepest technical detail is still fragmented across authenticated docs, multi-brand control planes, and best-effort automation repos. The main product risk is therefore execution and coherence after the Veritas combination rather than lack of feature breadth.'
sections:
- id: platform-scope
  title: Platform scope and product-line map
  body: Cohesity now presents a broad cyber-resilience stack rather than a single backup appliance story. The public surface spans DataProtect for core enterprise backup, NetBackup continuity for the inherited Veritas estate, FortKnox or Alta Recovery Vault for isolated recovery copies, cloud services for SaaS and cloud-native protection, and Gaia for AI activation on top of backup data. The product-doc index reinforces that sprawl by listing Helios, Security Center, Threat Protection, Data Classification, RecoveryAgent, FortKnox, Gaia, and NetBackup Web UI as separate documented surfaces. That breadth is strategically attractive because it lets Cohesity sell backup, vaulting, DSPM, identity recovery, and AI context from one portfolio. The caveat is that the public packaging is broader than the publicly readable technical detail, so buyers should treat the module count as real but avoid assuming uniform maturity across every named surface.
