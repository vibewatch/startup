tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Public maturity / status
  - Differentiation signal
  - Diligence gap
  rows:
  - - DataProtect
    - Backup admins, infrastructure teams, cyber-recovery owners
    - Established core platform
    - Single management, immutable snapshots, fast search, instant mass restore, hybrid workload breadth
    - Need independently benchmarked performance and clearer public release-note detail without login
  - - NetBackup
    - Large enterprise backup teams and appliance-heavy estates
    - Established inherited platform
    - Appliance support, Kubernetes backup, multi-cloud recovery, Alta or FortKnox extensions, entrenched enterprise base
    - Exact feature overlap versus DataProtect is still not crisply documented in public sources
  - - FortKnox / Alta Recovery Vault
    - Security, resilience, and disaster-recovery teams
    - Established vaulting layer
    - Managed cyber vaulting, malware scanning, encryption, clean recovery, choice of cloud provider
    - Need clearer public guidance on day-two operations, testing cadence, and pricing by deployment model
  - - Cloud Services / Microsoft 365 backup
    - Cloud operations, SaaS backup admins, managed-service buyers
    - Established with active partner expansion
    - Fully managed backup service, SOC 2 Type II storage claims, Microsoft 365 Backup Storage path, no on-prem infrastructure to manage
    - Need public breakdown of workload-specific limits, restore SLAs, and control differences versus self-managed
  - - Gaia
    - Knowledge workers, security analysts, AI platform teams
    - Emerging but live product surface
    - Activates immutable time-series backup data for AI, semantic search, vector indexing, context injection into Copilot, Gemini, and Glean
    - Need public guardrail docs, connector maturity map, and clear GA versus preview boundaries
  - - Helios / Alta View control plane
    - Platform admins, central ops, multi-cluster managers
    - Live but visibly mid-integration
    - Single-estate visibility, NetBackup onboarding path, region choice for sovereignty requirements
    - Manual provisioning and multi-brand naming imply some control-plane complexity remains
  - - Marketplace / app platform
    - Developers, ecosystem partners, advanced enterprise admins
    - Live extension layer
    - Docker-based apps via AppSpec and SDKs, plus partner add-ons such as Cisco XDR and DataMasque
    - Support boundaries between marketplace apps, partner apps, and officially backed integrations are not fully transparent
  - - Security overlays (DSPM, threat protection, identity resilience, recovery orchestration)
    - CISO, security engineering, incident response
    - Live portfolio overlays
    - Public cyber-resilience framework ties DSPM, identity recovery, threat hunting, vaulting, and automated recovery into one story
    - Module-level technical depth is uneven in public sources and often routed through solution pages rather than detailed docs
  notes: Rows cover the major modules and overlays explicitly named across public product pages, docs index entries, and partner listings as of 2026-05-19; this is not a full SKU inventory.
  enumerationScope:
    coverage: partial
    basis: Rows cover the major product modules explicitly named on current official pages, docs index entries, and partner listings on 2026-05-19, but not every add-on, bundle, or regional variant is publicly readable.
