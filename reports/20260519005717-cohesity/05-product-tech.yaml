- id: trust-security-and-recovery
  title: Trust, security, and recovery controls
  body: 'The product evidence is strongest on resilience controls. DataProtect, NetBackup, Alta Data Protection, Alta Recovery Vault, and the broader cyber-resilience framework all repeat the same design pattern: immutable copies, role-based access, multifactor controls, anomaly detection, malware scanning, clean recovery recommendations, and orchestrated blueprints. Cloud Services adds partner-backed trust signals such as immutable storage, privileged-access controls, and SOC 2 Type II language, while Microsoft positions Cohesity as a Microsoft 365 Backup Storage partner with policy-context restores and geographic redundancy. Those are meaningful signals, but the trust picture is not fully clean. Critical hardening guidance for NetBackup still sits on a legacy Veritas support property, and deeper product docs for DataProtect, Helios, and NetBackup are discoverable but not publicly readable. That means the control story is credible, yet the detailed evidence base remains fragmented across
    marketing, partner, and authenticated documentation surfaces.'
