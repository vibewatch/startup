- id: developer-and-ecosystem-surface
  title: Developer surface and ecosystem integrations
  body: 'Cohesity has a real extension surface, but it looks more integration-led than platform-native in the polished SaaS sense. The developer portal pushes APIs, custom workflows, and app building, and the app-build docs show an actual app framework based on Docker containers, AppSpec, and SDKs that can publish into the Cohesity Marketplace. GitHub activity in May 2026 across community automation samples, the Ansible collection, the PowerShell module, and the Terraform provider also proves that the platform is actively extended by engineering teams. At the same time, multiple repos warn that scripts and integrations are best-effort rather than officially supported, which matters for buyers planning heavy automation. The ecosystem story is strongest where partner distribution exists: ServiceNow has a listed app, Splunk has an add-on, Microsoft and AWS carry Cohesity marketplace offers, and the Marketplace itself highlights partner-developed extensions such as Cisco XDR. The surface is
    real, but support boundaries are not always enterprise-clean.'
