  evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: product-module-enumeration
    missingEvidence: A full SKU-by-SKU product inventory, including every add-on and regional variant, is not publicly readable from the sources reviewed here.
    whyItMatters: The chapter can map the major modules, but buyers still need a complete SKU inventory to understand bundling and overlap after the Veritas combination.
    diligencePath: Request the current product catalog and packaging matrix by SKU, deployment model, and customer segment.
    relatedQuestionRefs:
    - QE009
    - QE010
    relatedTableRefs:
    - TE001
  - type: missing-source
    severity: material
    topic: docs-access
    missingEvidence: Publicly readable admin guides, release notes, and API coverage maps for DataProtect, Helios, and NetBackup without customer authentication.
    whyItMatters: Without readable docs, it is difficult to separate GA operational detail from marketing claims and to estimate day-two operations cost.
    diligencePath: Request a customer-access docs bundle or a guided walkthrough of the current admin and release-note portals.
    relatedQuestionRefs:
    - QE007
    - QE018
  - type: private-evidence-only
    severity: material
    topic: migration-path
    missingEvidence: Product roadmap and migration runbooks showing when NetBackup, Alta View, and Helios converge or remain separate.
    whyItMatters: Operational complexity after the Veritas combination is one of the biggest technical risks in this chapter.
    diligencePath: Ask product or field engineering for current migration playbooks, control-plane architecture, and brand deprecation timelines.
    relatedQuestionRefs:
    - QE007
    - QE025
  - type: missing-source
    severity: material
    topic: gaia-guardrails
    missingEvidence: Technical docs for Gaia permissions, model routing, guardrails, and GA versus preview status by integration.
    whyItMatters: AI claims are broad, but buyers need to know what is production-ready and how governance actually works.
    diligencePath: Request the Gaia admin guide, connector matrix, and release notes for Copilot, Gemini, and Glean integrations.
    relatedQuestionRefs:
    - QE022
    - QE023
  - type: missing-source
    severity: minor
    topic: performance-benchmarks
    missingEvidence: Independent benchmarks or customer evidence for 18x backup, 2x recovery, and 1,000-VM restore claims.
    whyItMatters: Performance claims shape differentiation, but they are vendor-framed in the public material reviewed here.
    diligencePath: Obtain benchmark methodology, reference-customer data, and restore metrics by workload class.
    relatedQuestionRefs:
    - QE003
    - QE027
  - type: private-evidence-only
    severity: material
    topic: automation-support
    missingEvidence: A support matrix clarifying which GitHub, Terraform, PowerShell, and sample assets are officially supported, versioned, or SLA-backed.
    whyItMatters: Automation is a core extension path, but several public repos disclaim official support, increasing day-two risk for production users.
    diligencePath: Request the formal support policy for developer artifacts and map it to the repos customers actually deploy.
    relatedQuestionRefs:
    - QE015
    - QE016
  - type: missing-source
    severity: material
    topic: reliability-and-support
    missingEvidence: Broader customer evidence on cloud control-plane uptime, console reliability, and support responsiveness outside one marketplace review.
    whyItMatters: A single adverse review is enough to flag friction, but not enough to size the real operational risk.
    diligencePath: Collect reference calls, support SLA data, and incident history for Helios and Data Cloud services.
    relatedQuestionRefs:
    - QE026
    - QE027
