- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / signal
  - Public status
  - Scope
  - What it supports
  - Gap or concern
  rows:
  - - Immutable snapshots and clean recovery claims
    - Explicit on DataProtect, FortKnox, Alta, and cyber-resilience pages
    - Core backup and vault layers
    - Supports the claim that Cohesity treats backup integrity as a security boundary, not just a storage feature
    - Most evidence is vendor-authored rather than independently validated
  - - RBAC, MFA, SSO, and MPA-style control language
    - Explicit on DataProtect and NetBackup or Alta surfaces
    - Administrative control plane and recovery-sensitive operations
    - Shows real zero-trust design intent across both native and inherited products
    - Precise product-by-product implementation detail is not public for every module
  - - Malware scanning, anomaly detection, YARA hunting, and sandboxing
    - Explicit on Alta and cyber-resilience pages
    - Threat detection and recovery preparation
    - Suggests a recovery workflow that tries to prevent reinfection rather than just restore bytes
    - Depth of scanning coverage and false-positive handling is not publicly benchmarked
  - - FIPS, sovereignty, and 24+ region language
    - Explicit on DataProtect and cloud-solution pages
    - Regulated and sovereignty-sensitive deployments
    - Supports regulated-environment positioning and region-aware cloud deployment
    - Certification scope and deployment nuance remain mostly vendor-described
  - - SOC 2 Type II-compliant storage claim
    - Explicit on AWS Cloud Services listing
    - Managed cloud backup service
    - Adds a partner-backed trust signal for the managed cloud service path
    - Does not automatically generalize to every self-managed or cross-cloud deployment mode
  - - Microsoft 365 Backup Storage integration
    - Explicit on Microsoft Adoption page
    - Microsoft 365 backup and restore workflows
    - Provides a concrete external platform signal that Cohesity is deepening M365 backup capabilities
    - Benefits are still described as soon-to-arrive enhancements rather than long-proven production outcomes
  - - Splunk add-on plus SOAR/XDR hooks
    - Explicit on Splunkbase and Alta page
    - Security operations integrations
    - Shows that alerting and workflow integration exist on real third-party surfaces
    - Public evidence proves connector existence more than operational maturity at scale
  - - NetBackup hardening guide published in 2026
    - Explicit on Veritas support property
    - Inherited NetBackup and appliance lines
    - Shows active security-guidance maintenance for the legacy stack
    - Also highlights documentation fragmentation and dependence on legacy support properties
  notes: Controls listed here are limited to what was directly visible in public product, partner, and documentation surfaces. The table avoids inferring unpublished certifications or internal assurance practices.
