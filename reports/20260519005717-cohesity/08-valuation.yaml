tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Metric
  - Current read
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - Track / research-more
    - Official >$7B anchor is defensible, but leverage and waterfall details are missing.
    - Do not underwrite a premium multiple yet.
  - - Confidence
    - Medium-low
    - Scale and comp math are visible; debt, preferences, and cohort mix are not.
    - Require more diligence before treating upside as investable.
  - - Valuation stance
    - Fair at the official close; stretched above $10B without new disclosure
    - Official close implies about 4.1x revenue and 4.7x ARR versus Rubrik near 9x+ EV/revenue and Commvault near 3.6x.
    - Upside exists, but only if disclosure quality rises materially.
  - - Entry discipline
    - Prefer <=5x revenue or <=6x ARR after debt look-through
    - That keeps entry closer to a discounted public-comp range than to Rubrik’s premium band.
    - Avoid paying public-premium prices for private-company opacity.
  - - Upgrade trigger
    - Public-grade debt, cohort, and cash-flow disclosure
    - Need debt quantum, waterfall, native-vs-inherited ARR mix, and retention proof.
    - Only then does a >$9B case become underwriteable.
  - - Primary downside trigger
    - Hidden leverage or weak post-merger retention
    - Either issue would compress the business toward lower-quality software multiples.
    - Re-rate toward $4.5-$6B bear range if triggered.
  notes: This summary is judgmental because the company discloses enterprise-scale top-line figures but not the debt and preference stack needed to convert enterprise value into an equity return case.
