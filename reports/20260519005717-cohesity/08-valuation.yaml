  evidenceGaps:
  - type: missing-source
    severity: material
    topic: deal-financing
    missingEvidence: Exact debt amount, maturity ladder, pricing, covenant package, and any secured collateral for the Veritas combination financing.
    whyItMatters: Without debt visibility, an enterprise-value anchor cannot be converted into an equity-value underwrite with confidence.
    diligencePath: Request the closing debt term sheet, lender presentation, and any board materials summarizing leverage and covenant headroom.
    relatedQuestionRefs:
    - QV023
    - QV028
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: preference-overhang
    missingEvidence: Cap-table waterfall showing Series H terms, Veritas rollover economics, Carlyle ownership, and liquidation preferences.
    whyItMatters: A hidden preference stack can absorb much of the upside even if the headline enterprise value appears attractive.
    diligencePath: Obtain the post-close cap table, charter terms, and any investor side letters or redemption rights.
    relatedQuestionRefs:
    - QV025
    - QV028
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: native-vs-inherited-arr-mix
    missingEvidence: Split of combined revenue and ARR between native Cohesity software, inherited Veritas maintenance and support, and any SaaS or DMaaS streams.
    whyItMatters: The bull case depends on durable recurring economics, not just headline scale inherited from a larger legacy base.
    diligencePath: Ask management for a combined revenue bridge by product family, cohort retention by legacy platform, and migration conversion data.
    relatedQuestionRefs:
    - QV022
    - QV030
    relatedTableRefs:
    - TV003
    - TV006
  - type: stale
    severity: minor
    topic: secondary-liquidity
    missingEvidence: Observed post-close secondary trades or broker indications that can replace the official transaction value as a live market anchor.
    whyItMatters: The only live independent private-market datapoint reviewed here is a model-based Forge estimate with limited-data caveats.
    diligencePath: Request recent secondary indications, transfer board materials, or a broker summary of actual matched trades by share class.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: ipo-readiness
    missingEvidence: Board-approved IPO timing, audit work status, and the exact metrics management plans to present after a full year of combined results.
    whyItMatters: A premium public-market case depends on proving that the combined company can satisfy public disclosure expectations, not just on being larger than peers.
    diligencePath: Review IPO-readiness dashboards, auditor workplans, and any internal draft KPI packages prepared for bankers.
    relatedQuestionRefs:
    - QV010
    - QV021
    - QV030
    relatedTableRefs:
    - TV006
