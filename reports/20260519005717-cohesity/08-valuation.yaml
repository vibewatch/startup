chapter:
  number: 8
  title: Valuation
  summary: 'The valuation reset is real: legacy Cohesity’s 2021 $3.7 billion tender mark is no longer the right anchor after the December 2024 completed Veritas combination that explicitly valued the combined company at over $7 billion on over $1.7 billion of revenue and $1.5 billion of ARR. That official close value implies a multiple above Commvault but far below Rubrik, which is directionally fair for a larger but much less transparent private company. The recommendation is therefore track or research-more with tight entry discipline: do not pay a Rubrik-like premium until debt, waterfall, and post-merger cohort economics are disclosed.'
sections:
- id: qualification-event-and-anchor-reset
  title: Qualification Event and Valuation Reset
  body: 'This chapter clears the qualification threshold because the completed December 2024 Cohesity-Veritas combination occurred after 2024-05-19 and was explicitly described by the company and Veritas as a transaction that valued the combined company at over $7 billion. That is not the same fact as legacy Cohesity’s March 2021 tender valuation of $3.7 billion. The 2021 event reflected a smaller, standalone business using a non-dilutive liquidity tender for employees; it came with a $145 million transaction, a revenue run rate just above $300 million, ARR growth above 70%, and net expansion above 130%. By contrast, the 2024 and 2025 debate is about a much larger combined company with over $1.7 billion of revenue, $1.5 billion of ARR, and a 28% adjusted cash EBITDA margin, but also with inherited Veritas economics and opaque debt. The analytical reset is therefore mandatory: the relevant valuation question is not whether Cohesity once deserved $3.7 billion, but whether the current combined
    entity deserves more than the official over-$7 billion anchor after adjusting for integration and capital-structure uncertainty.'
