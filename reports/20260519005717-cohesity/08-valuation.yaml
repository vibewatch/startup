- id: scenarios-and-range-discipline
  title: Scenarios and Range Discipline
  body: 'Scenario work matters more than point estimates because the capital structure is hidden. The base case is the easiest to justify from public evidence: a combined-company value of roughly $7-$9 billion, which keeps Cohesity above Commvault-like mature-software trading but below Rubrik’s premium public multiple. That range effectively says the official close anchor is defensible but not obviously underpriced. The bull case stretches toward roughly $10-$13 billion, but only if investors see public-grade proof that the 28% adjusted cash EBITDA margin is durable, that combined growth holds in the mid-teens or better, that retention across inherited Veritas cohorts is solid, and that debt does not consume the equity upside. The bear case, roughly $4.5-$6 billion, becomes plausible if multiple compression, migration friction, or leverage risk drags the business toward lower-quality infrastructure comps or toward the model-based private mark visible on Yahoo/Forge. Because the downside
    case is driven by missing denominators rather than by obvious product weakness, entry discipline is more important than narrative conviction.'
