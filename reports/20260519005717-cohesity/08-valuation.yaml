- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Debt package
    - Exact debt amount, interest cost, maturity, covenant headroom, and securedness
    - Needed to convert official enterprise-style value into equity value.
    - CFO and lender data room; debt term sheet.
  - - Cap-table waterfall
    - Series H economics, rollover ownership, liquidation preferences, and side letters
    - Determines whether new investors actually participate in upside.
    - Finance plus legal review of charter, side letters, and waterfall model.
  - - Combined revenue mix
    - Native Cohesity versus inherited Veritas ARR, support, and maintenance mix
    - Separates recurring software quality from legacy maintenance drag.
    - Management bridge deck and cohort revenue schedule.
  - - Retention proof
    - Gross retention, NRR, and migration success by legacy platform cohort
    - Core input for deciding whether premium multiple rerating is deserved.
    - Revenue operations and customer-success cohort analysis.
  - - Public-company disclosure pack
    - Draft KPI set, audit readiness, and cash-flow bridge for a future IPO filing
    - Rubrik-level multiples require Rubrik-level disclosure.
    - Banker readiness materials and auditor workplan.
  - - Secondary price discovery
    - Observed post-close trades by share class rather than model estimates
    - A live market signal would either validate or challenge the official close anchor.
    - Broker indications, matched-trade logs, or board transfer approvals.
  notes: The asks are ordered by how much they would change valuation confidence, not by ease of collection; missing any of the first three leaves the current range more narrative than underwritten.
