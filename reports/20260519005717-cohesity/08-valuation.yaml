- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Why it matters
  - Action implication
  rows:
  - - Hidden leverage
    - Debt package is large enough to pull effective equity value below the official close anchor
    - A high enterprise value is not investable if debt absorbs most upside.
    - Reset toward bear-case range and avoid premium entry.
  - - Preference stack leakage
    - Series H or rollover terms meaningfully subordinate new equity
    - Preference waterfalls can destroy common-equity returns even when headline EV rises.
    - Avoid secondary or IPO allocation without waterfall visibility.
  - - Weak inherited-cohort retention
    - Veritas renewals, migrations, or support economics underperform
    - Headline ARR quality matters more than headline ARR size.
    - Compress multiple toward Commvault-like or lower band.
  - - Disclosure failure in IPO prep
    - Future filing lacks cohort retention, mix, and debt transparency
    - Public investors will benchmark quality of disclosure against Rubrik, not against private-company precedent.
    - Keep stance at research-more or walk away from the IPO.
  - - Macro exit window shuts
    - IPO market weakens while bankers demand lower multiples
    - Even a good business can clear at a weak price if exits are hostile.
    - Require wider entry discount or postpone involvement.
  - - Premium pricing before proof
    - Management or sellers target Rubrik-like multiples without Rubrik-like evidence
    - The core mistake would be paying public-premium pricing for private-premium uncertainty.
    - Treat as a hard no until new evidence arrives.
  notes: These kill triggers focus on transmission from hidden structure to valuation rather than on generic operating risks already covered in the risks chapter.
