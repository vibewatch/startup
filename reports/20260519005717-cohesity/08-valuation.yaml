- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Investment thesis
  - Counter-thesis
  - What changes the view
  rows:
  - - Scale
    - The combined company is already larger than Rubrik and Commvault on disclosed revenue.
    - Bigger does not automatically mean more valuable if the mix contains slower or lower-quality inherited dollars.
    - Show native-versus-inherited ARR and renewal durability.
  - - Margins
    - A 28% adjusted cash EBITDA margin suggests a potentially strong combined earnings engine.
    - Adjusted cash EBITDA is not yet bridged to public-company cash flow or GAAP operating economics.
    - Disclose debt service, SBC, capex, and GAAP-to-non-GAAP bridges.
  - - Market position
    - Post-Veritas Cohesity can argue category leadership and broad workload coverage.
    - Leadership by market share may still hide migration risk and operational complexity.
    - Show retention and migration outcomes by cohort and product family.
  - - Public comp support
    - Official close multiple sits between Commvault and Rubrik rather than at an extreme.
    - Rubrik’s premium depends on public disclosure, high growth, and visible balance-sheet strength that Cohesity has not matched publicly.
    - Provide Rubrik-style quarterly KPI pack after one full combined fiscal year.
  - - Private-market signal
    - The official >$7B close provides a hard transaction anchor.
    - Yahoo/Forge’s $4.69B estimate suggests some private-market participants still mark the company well below the official transaction value.
    - Validate actual secondary clears by share class instead of model-based estimates.
  - - IPO path
    - Management’s 2026 aspiration could create a catalyst if combined execution stays strong.
    - Macro volatility and delayed exits can punish even scaled companies that arrive with incomplete disclosure.
    - Prove audit readiness and banker-ready disclosure before chasing a premium bookbuild.
  notes: The anti-thesis intentionally emphasizes capital-structure and disclosure risk rather than product quality because the main valuation dispute is what investors cannot yet see.
