- id: diligence-path-and-exit-readiness
  title: Diligence Path and Exit Readiness
  body: 'The recommendation is therefore track or research-more, not because the business lacks quality, but because the underwriting package remains incomplete. A disciplined investor can already say what would change the call: full debt terms, cap-table waterfall, combined revenue and ARR bridge, retention by inherited and native cohorts, and a credible IPO-readiness pack showing that management can support Rubrik-style disclosure. Without those items, even a seemingly reasonable valuation entry can be misleading because enterprise value may not map cleanly to equity value. Exit readiness is similarly conditional. Management clearly wants the option to go public after a full year of combined results, but public-market success depends on proving more than size. The company must show that its headline scale survives integration, that its adjusted margin can be translated into public-market cash economics, and that the Veritas combination created a cleaner market leader rather than a larger
    but more complex capital structure. Until then, entry discipline should emphasize downside protection and information rights over speed.'
