- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Main threat
  - Severity
  - Why the threat is credible
  - Mitigation / diligence ask
  rows:
  - - Post-Veritas workload breadth
    - Rubrik and Commvault continue closing capability gaps
    - High
    - Independent commentary already says only Commvault is near Cohesity on breadth and that Rubrik is catching up on coverage
    - Request current win/loss data by workload and by replacement target
  - - Installed-base leverage
    - Multi-homing persists
    - High
    - Veeam is still frequently found alongside other backup tools on customer floors
    - Measure how often Cohesity displaces versus coexists with incumbent tools
  - - Cyber recovery differentiation
    - Features are converging
    - High
    - Immutable backups, clean recovery, AI-assisted ops, and SaaS control planes are becoming market-wide expectations
    - Demand product-level proof on recovery speed, malware-free restore confidence, and customer references
  - - Partner-led distribution
    - Peers also have broad ecosystems
    - Medium-High
    - Rubrik, Commvault, Veeam, and Druva all explicitly market partner reach, and Commvault added NetApp alliance expansion in 2026
    - Break pipeline and renewals out by direct, partner, and cloud-led channels
  - - SaaS simplicity
    - Druva and native cloud tools can win narrower workloads faster
    - High
    - Druva is the only 100 percent SaaS leader in reviewed MQ commentary and AWS/Azure pricing is easy to consume
    - Check cloud-first account win rates and support cost to serve versus simpler substitutes
  - - Pricing power
    - Quote-led procurement can compress margins in a clustered leader set
    - Medium
    - Official packaging is visible, but realized enterprise pricing remains opaque across most major peers
    - Obtain recent realized pricing, discount bands, and service attach by deal size
  notes: Severity is an analytical judgment based on the reviewed 2025-2026 evidence. Threats emphasize where Cohesity’s post-Veritas moat could still narrow even if feature breadth remains strong.
