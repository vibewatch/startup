  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Realized enterprise pricing, discount bands, and support attach for Rubrik, Cohesity, Commvault, and Veeam across comparable deal sizes.
    whyItMatters: Without realized pricing, it is hard to judge whether breadth advantages translate into pricing power or only into bigger discount envelopes.
    diligencePath: Request three recent redacted quotes or executed order forms per vendor class and normalize by protected capacity or workload scope.
    relatedQuestionRefs:
    - QP011
    - QP012
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: switching-costs
    missingEvidence: Customer-level evidence showing when Cohesity fully displaces Veeam, Rubrik, or native-cloud tools versus coexisting with them.
    whyItMatters: The moat case weakens materially if large enterprises keep multiple platforms in place instead of consolidating onto Cohesity after the Veritas deal.
    diligencePath: Obtain win-loss analysis and three migration case studies that quantify tool retirement, coexistence duration, and workload overlap.
    relatedQuestionRefs:
    - QP019
    - QP022
    - QP025
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: partner-economics
    missingEvidence: Partner contribution by pipeline, bookings, and renewal influence for Cohesity and the main direct peers.
    whyItMatters: Distribution power is a core competitive variable, but public partner pages reveal channel breadth more easily than actual revenue dependence or efficiency.
    diligencePath: Request channel mix by new ARR/bookings, top alliance concentration, and attach rates for managed services or cloud-hosted offerings.
    relatedQuestionRefs:
    - QP015
    - QP016
  - type: missing-source
    severity: minor
    topic: native-cloud-substitutes
    missingEvidence: Comparable customer stories showing when Azure Backup or AWS Backup is sufficient by itself versus when an enterprise adds a broader platform.
    whyItMatters: Native services shape substitute pressure, especially in cloud-first accounts, but public pricing alone does not reveal where platform expansion still wins.
    diligencePath: Ask for cloud-first competitive battlecards or customer references segmented by single-cloud versus heterogeneous workload mix.
    relatedQuestionRefs:
    - QP007
    - QP017
    relatedTableRefs:
    - TP003
