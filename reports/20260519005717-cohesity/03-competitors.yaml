- id: profiles-deployment-pricing
  title: Direct Competitor Profiles, Deployment Models, and Pricing Opacity
  body: |-
    The direct peer comparison is no longer just about backup performance. Rubrik’s pitch is a cloud-native SaaS control plane built around data and identity security, sold through a land-and-expand motion that increasingly leans on ecosystem leverage. Commvault is the closest breadth analogue to Cohesity because it explicitly spans hosted SaaS, customer-managed software, integrated appliances, and partner-delivered models while packaging cyber recovery into modular tiers. Veeam’s 2026 story is roadmap-heavy: broader hypervisor support, automated AD Forest Recovery, and a unified operating surface that tries to reduce migration friction. Druva stays differentiated by going the other direction—fully managed SaaS, no infrastructure for customers to secure directly, and automation-centered ransomware response.

    Pricing is materially less transparent than marketing copy suggests. Official public pricing is easiest to find from hyperscaler-native services and from Druva’s pricing brief, which explicitly mentions common plans plus enterprise and volume discounts. Commvault’s packaging page is useful for feature packaging but still pushes buyers toward a conversation rather than a posted enterprise rate card. Reviewed Rubrik and Veeam sources likewise show architecture, roadmap, and ecosystem depth without exposing a clean public list price that would let investors or buyers benchmark apples-to-apples economics. That means procurement strength, discounting behavior, and installed-base leverage remain important competitive variables even before feature comparisons begin.
