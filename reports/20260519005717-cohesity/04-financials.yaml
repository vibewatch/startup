tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Evidence-backed mechanism
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Core platform subscriptions / term software
    - Cohesity and peer disclosures frame the business around recurring subscription ARR and software-led protection contracts.
    - Legacy FY2021 run rate >$300M; combined ARR $1.5B at close.
    - High recurring quality, but standalone mix not disclosed.
    - Provide ARR bridge by product family, cohort, and renewal vintage.
  - - Veritas maintenance and support renewals
    - The Veritas transaction brought in a large installed base and ongoing support commitments for NetBackup, appliances, and Alta offerings.
    - Economically material inside combined ARR and revenue, but no separate public dollar split.
    - Recurring but migration-sensitive because inherited renewals may behave differently from native Cohesity ARR.
    - Break out inherited maintenance ARR, gross retention, and migration-to-DataProtect conversion.
  - - DMaaS / SaaS offerings
    - Official materials reference DataProtect delivered as a Service and a managed or as-a-service deployment path.
    - Strategic and recurring, but no public revenue contribution disclosed.
    - Potentially high-quality recurring revenue if attach rate is real; public scale unknown.
    - Show SaaS ARR, SaaS gross margin, and DMaaS customer counts.
  - - Professional / implementation / partner-delivered services
    - The platform can be delivered self-managed, as a service, or by Cohesity-powered partners, implying services and enablement revenue around deployments.
    - Present as a mechanism, but not separated publicly.
    - Lower quality than software ARR if too large, because it is more one-time and labor-linked.
    - Provide services mix, attach rate, and services gross margin.
  - - Appliance-attached or hardware-adjacent revenue
    - Support for NetBackup appliances and self-managed deployments implies some hardware-adjacent economics in the inherited portfolio.
    - No public split between software, appliance support, and any bundled hardware content.
    - Mixed quality because appliance-heavy revenue is less recurring than pure software ARR.
    - Disclose appliance-related revenue and support renewal profile separately from software ARR.
  notes: Rows enumerate the main revenue buckets supportable from reviewed public disclosures; exact stream mix remains undisclosed and needs management backup.
