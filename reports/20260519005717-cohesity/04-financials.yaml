- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Legacy annualized revenue run rate (FY2021)
    - Above $300M
    - Medium
    - Shows the standalone business had meaningful scale before the merger narrative took over.
    - Bridge FY2021 standalone run rate to FY2024 standalone revenue.
  - - Legacy net expansion
    - '>130%'
    - High
    - Strong expansion usually signals healthy product usage and cross-sell quality.
    - Provide current NRR and gross retention for legacy and inherited cohorts.
  - - Combined pro forma ARR at close
    - $1.5B
    - High
    - The strongest public scale metric for the combined company.
    - Break ARR into native Cohesity, inherited Veritas, SaaS, and support buckets.
  - - Combined adjusted cash EBITDA margin
    - 28%
    - High
    - Suggests solid contribution economics if the definition is durable.
    - Provide full EBITDA bridge and reconcile to GAAP operating income or cash flow.
  - - Rubrik FY2026 gross margin / free cash flow
    - 80.1% GAAP GM; $237.8M FCF
    - Medium
    - Shows what high-disclosure cyber-resilience software economics can look like at scale.
    - Use as a peer benchmark for Cohesity gross margin and FCF disclosure.
  - - Commvault FY2026 gross margin / free cash flow
    - 81.2% GAAP GM; $237M FCF
    - Medium
    - Shows mature public-category economics and margin transparency.
    - Use as a benchmark for support-heavy versus SaaS-heavy mix.
  - - Standalone Cohesity CAC, payback, and FCF
    - Not public
    - Low
    - These are core underwriting variables for capital efficiency and runway.
    - Request cohort CAC, S&M payback, deferred revenue trends, and free-cash-flow bridge.
  notes: Rows mix direct disclosures with comparable-company proxies; missing Cohesity-specific unit-economics data is the central diligence blocker, not a formatting omission.
