- id: TI004
  title: Capital adequacy table
  columns:
  - Capital item
  - Public value / status
  - Why it matters
  - Forward implication
  - Diligence ask
  rows:
  - - Equity financing
    - Series H led by Haveli provided the majority of transaction equity; Coatue, Sapphire, and Dragon also participated.
    - Shows the deal was not funded by debt alone and brought in fresh sponsor support.
    - Provides integration runway but also sets expectations for eventual liquidity.
    - Provide cap table, preferences, and post-close ownership percentages.
  - - Debt financing
    - J.P. Morgan arranged and committed financing; exact debt amount not disclosed.
    - Debt size determines leverage, interest burden, and refinancing risk.
    - Opaque leverage can compress valuation even if top-line scale is strong.
    - Provide debt quantum, pricing, maturities, covenant package, and amortization.
  - - Legacy Veritas debt exchange
    - Announcement referenced exchange offers or similar transactions tied to existing debt.
    - Suggests the carve-out carried financing complexity beyond a plain equity check.
    - Potentially changes effective leverage and claims seniority.
    - Provide exchange-offer mechanics and post-close debt stack.
  - - Cash on hand / runway
    - Not publicly disclosed for Cohesity or the combined company.
    - Cash and runway determine whether IPO timing is elective or forced.
    - Investors cannot tell if growth plans are self-funded.
    - Provide closing cash, monthly burn or FCF, and runway under base / downside cases.
  - - Planned use of funds
    - Growth, global expansion, customer support continuity, and product innovation are emphasized.
    - Capital allocation tells whether the deal funds offense, defense, or integration cleanup.
    - A heavy support burden could slow margin expansion.
    - Provide integration budget, synergy plan, and product investment roadmap.
  - - Next-round or IPO trigger
    - Management pointed to a full year of combined results before a possible 2026 IPO.
    - The IPO window is the clearest public liquidity path for new and old investors.
    - Macroeconomic timing risk remains outside management control.
    - Provide board-approved financing plan if IPO markets stay shut.
  notes: The broad financing stack is public, but the debt layer and cash runway are not; that omission is the key reason capital adequacy remains only partially answerable.
