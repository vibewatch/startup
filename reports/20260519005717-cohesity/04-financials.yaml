- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - What public comps disclose
  - Exact diligence path
  rows:
  - - Standalone Cohesity revenue, gross margin, and cash flow
    - Prevents clean separation of legacy Cohesity economics from combined pro forma metrics.
    - Rubrik and Commvault both publish revenue, gross margin, and cash-flow detail.
    - Request audited standalone statements and the bridge into combined pro forma results.
  - - Debt amount, leverage ratio, and maturities
    - Blocks valuation, solvency, and refinancing analysis.
    - Public peers disclose cash and debt in filings and earnings materials.
    - Request final debt agreements, lender presentation, and any exchange-offer materials.
  - - Revenue mix by software, support, SaaS, and services
    - Makes it hard to judge durability and gross-margin quality.
    - Commvault publicly splits subscription, term-license, and SaaS revenue.
    - Request ARR and revenue mix by product family and delivery model.
  - - CAC, payback, and cohort sales efficiency
    - Prevents capital-efficiency analysis and forward burn modeling.
    - Rubrik gives ARR contribution and free-cash-flow disclosure even without full CAC detail.
    - Request cohort booking data, S&M spend mapping, and payback analysis.
  - - Retention, churn, and renewal data for inherited Veritas base
    - Leaves the biggest post-merger revenue risk unquantified.
    - Public peers discuss ARR and customer cohorts every quarter.
    - Request gross retention, churn waterfall, and migration conversion data.
  - - Cash balance and runway for the combined company
    - Makes IPO timing look optional in narrative but untestable in numbers.
    - Rubrik and Commvault both disclose cash balances and free cash flow.
    - Request closing cash, liquidity forecast, and downside runway scenarios.
  notes: Every row is a concrete public-data gap that directly affects underwriting confidence; none can be solved by better reading of existing press releases alone.
