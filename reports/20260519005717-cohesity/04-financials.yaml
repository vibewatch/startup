  evidenceGaps:
  - type: missing-source
    severity: material
    topic: debt-opacity
    missingEvidence: Exact debt amount, interest rate, maturity ladder, leverage covenant package, and whether legacy Veritas debt exchange offers increased combined-company obligations.
    whyItMatters: Without the debt quantum and terms, it is impossible to underwrite leverage, refinance risk, or how much of the claimed EBITDA margin can convert to equity value.
    diligencePath: Request the closing financing summary, debt commitment papers, final credit agreement, and any exchange-offer materials used in the Veritas carve-out financing.
    relatedQuestionRefs:
    - QI014
    - QI017
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Customer-level pricing waterfalls, discount bands, contract minimums, and net revenue retention by cohort for both legacy Cohesity and inherited Veritas renewals.
    whyItMatters: Revenue quality depends on whether ARR is expansion-led and durable or held up by discounting and renewal concessions that public sources cannot see.
    diligencePath: Request anonymized booking cohorts, top-50 contract summaries, renewal decks, and pricing committee materials that show realized rather than list or narrative pricing.
    relatedQuestionRefs:
    - QI009
    - QI010
    relatedTableRefs:
    - TI002
    - TI003
  - type: private-evidence-only
    severity: material
    topic: standalone-financials
    missingEvidence: Audited standalone Cohesity income statement, balance sheet, cash flow statement, and deferred-revenue walk for fiscal 2024 through fiscal 2026.
    whyItMatters: The public story is dominated by combined-entity pro forma metrics, so investors cannot isolate legacy Cohesity margin quality, cash generation, or working-capital intensity.
    diligencePath: Request board or lender reporting packs that bridge legacy Cohesity standalone results into the combined pro forma metrics disclosed at announcement and close.
    relatedQuestionRefs:
    - QI006
    - QI017
    - QI021
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: post-merger-retention
    missingEvidence: Renewal retention, migration take-rate, gross churn, and downsell data for the Veritas installed base during the first post-close year.
    whyItMatters: Management can frame the merger as scale-enhancing, but the real test of revenue durability is whether inherited maintenance and renewal dollars stay put without margin-eroding concessions.
    diligencePath: Request monthly ARR bridge reporting, renewal cohorts by legacy product family, migration incentive schedules, and any board materials covering retention risk after close.
    relatedQuestionRefs:
    - QI023
    - QI025
    relatedTableRefs:
    - TI001
    - TI004
    - TI005
