- id: public-comp-context-and-verdict
  title: Public-Company Context, Disclosure Gaps, and Financial Verdict
  body: Public peers make Cohesity’s disclosure gaps impossible to ignore. Rubrik’s S-1 showed fiscal 2024 revenue of $627.9 million, Subscription ARR of $784.0 million, and negative free cash flow before the IPO. One year later, Rubrik’s fiscal 2026 results showed $1.32 billion of revenue, $1.46 billion of subscription ARR, 80.1 percent GAAP gross margin, $237.8 million of free cash flow, and $1.68 billion of cash and short-term investments. Commvault’s 2024 annual report already gave investors revenue, cash, and ARR growth, and its fiscal 2026 results extended that with $1.184 billion of revenue, $1.122 billion of total ARR, 81.2 percent GAAP gross margin, and $237 million of free cash flow. Against that backdrop, combined Cohesity looks bigger on disclosed revenue and ARR than either public comp, which is strategically valuable. But the comparison is still imperfect because Cohesity’s headline profitability metric is adjusted cash EBITDA on a combined pro forma basis, not a public-company
    style GAAP or standardized non-GAAP bridge. The financial verdict is therefore positive on scale and recurring revenue quality, but cautious on underwriteability. Until investors can see standalone financials, debt terms, pricing realization, and post-merger retention, the company remains easier to admire at a top-line level than to value with conviction.
