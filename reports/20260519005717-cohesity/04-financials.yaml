- id: TI002
  title: Pricing / monetization table
  columns:
  - Offer / contract motion
  - Public pricing signal
  - Realized pricing visibility
  - Current read
  - Source or diligence ask
  rows:
  - - Enterprise platform subscription
    - No public Cohesity enterprise rate card found in reviewed materials.
    - Low
    - Negotiated pricing dominates the public picture.
    - Need anonymized price waterfalls and discount ranges by segment.
  - - DMaaS / DataProtect delivered as a Service
    - Public materials confirm the offer exists but do not publish price per workload or per TB.
    - Low
    - Commercial structure is visible; unit pricing is not.
    - Need SaaS SKU sheet, packaging logic, and attach-rate data.
  - - Inherited Veritas renewals and migrations
    - Public sources discuss support commitments and migration incentives, not actual renewal pricing.
    - Low
    - Likely a major swing factor for ARR durability and margins.
    - Need renewal bands, downsell incidence, and migration incentive schedules.
  - - Rubrik public comp
    - Rubrik discloses ARR, revenue, contribution margin, and free cash flow, but not a comparable enterprise list price.
    - Medium
    - Public-company KPIs exist even without list pricing.
    - Use public KPI cadence as a disclosure benchmark rather than a price card.
  - - Commvault public comp
    - Commvault discloses subscription revenue, SaaS revenue, ARR, and free cash flow, but enterprise pricing still routes through sales.
    - Medium
    - Better public monetization disclosure than Cohesity, even though realized pricing remains negotiated.
    - Benchmark Cohesity against public disclosure depth, not against posted rate cards.
  notes: This table focuses on monetization visibility rather than list pricing alone; Cohesity’s central issue is missing realized economics, not just missing sticker prices.
