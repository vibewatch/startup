- id: capital-structure-and-adequacy
  title: Capital Structure, Financing Dependency, and IPO Path
  body: 'The capital stack is visible in outline but not in debt detail. At signing, Cohesity and Veritas said the transaction would be funded with both equity and debt, and they explicitly referenced exchange offers or similar transactions tied to existing Veritas debt. By close, the company had narrowed the equity side of that story: a Haveli-led Series H provided the majority of transaction equity, Coatue, Sapphire Ventures, and Dragon Fund also participated, Carlyle rolled into the combined company through Veritas ownership, and marquee backers such as Sequoia, SoftBank, Wing, Premji, and Madrona were named as supporters. J.P. Morgan arranged and committed financing, which gives comfort that the debt was real and institutional, but neither the close release nor the reviewed independent coverage disclosed the amount, pricing, maturity, or leverage ratio of that debt package. That omission matters more because management is already telling the market to think about IPO readiness. CRN quoted
    Sanjay Poonen on delaying the IPO to complete and prove the Veritas combination, while CNBC later reported that Cohesity wants a full year of combined results before going public, potentially in 2026. The bullish read is that financing bought scale and time. The harder read is that investors still cannot see the debt burden, cash runway, or whether a mid-30s Rule of 40 target is enough to offset macro volatility in the IPO window.'
