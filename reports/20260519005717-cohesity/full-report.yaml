    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Why it matters
      - Action implication
    rows:
      - - Inherited-base migration risk
        - Conversion and renewal disclosure
        - Management still cannot show cohort renewal or migration metrics by the next major diligence cycle
        - The biggest value pool in the deal remains opaque, so narrative quality is outrunning operating proof
        - Treat the base case as slower and less valuable until cohort data arrives
      - - Support-quality deterioration
        - Review and reference trend
        - Two or more fresh independent signals point to worsening support response, restore speed, or reporting clarity
        - Support friction is the most likely hidden cause of avoidable renewal leakage
        - Escalate diligence on support KPIs and assume lower expansion efficiency
      - - Regulated-customer compliance miss
        - Adverse government or sovereign event
        - A material compliance lapse, certification problem, or enforcement-style issue becomes public
        - Legal and sovereign requirements can shut off high-value sectors faster than product marketing can reopen them
        - Pause conviction and reassess the regulated-sector underwriting case
      - - Competitive displacement
        - Take-out or price-pressure evidence
        - >-
          Competitor migration campaigns begin winning named inherited customers or forcing meaningful pricing
          concessions
        - Open attacks from Commvault, Druva, Dell, and public comps show the market is already contesting this moment
        - Revise growth and margin assumptions downward
      - - Disclosure or financing slippage
        - IPO readiness signal
        - Management cannot show combined-company reporting readiness or pushes timing without new evidence
        - Financing optionality should not be counted until disclosure discipline is visible
        - Treat IPO upside as deferred and keep focus on private-market fundamentals
      - - Security-incident thesis break
        - Material public cyber event
        - A public incident or disclosure event undermines the company’s resilience narrative or exposes control gaps
        - >-
          The brand promise is built around resilience, so a material miss would hit trust, pipeline, and valuation at
          once
        - Move to a defensive stance until the root cause and remediation quality are proven
    notes: >-
      These are analytical kill criteria for underwriting discipline, not management guidance; the table is designed to
