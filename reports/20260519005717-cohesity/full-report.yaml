  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Customer mix: broad scale claims exist, but named proof is the higher-quality lens'
        blocks:
          - type: paragraph
            body: >-
              Cohesity has both a broad-count story and a named-proof story, and they should not be blended. The
              broad-count story comes from company materials: about 2,600 customers in fiscal 2021 and more than 12,000
              customers after the Veritas combination closed in December 2024. Those numbers matter for scale, but they
              do not prove that the same platform, buyer, or cohort quality sits behind every logo. The named-proof
              story is more valuable for this chapter because it shows where Cohesity is actually being trusted with
              live workloads. Public examples span pediatric healthcare, municipal IT, state shared services, Japanese
              hospital systems, Icelandic payment rails, capital-markets backup, food production operations, and large
              European retail IT. That mix suggests Cohesity can sell into central infrastructure teams that protect
              regulated or operationally critical data, not just generic backup buyers. The caveat is that public proof
              remains curated: it says more about vertical breadth and workload seriousness than about revenue
              concentration, renewal depth, or average account size.
