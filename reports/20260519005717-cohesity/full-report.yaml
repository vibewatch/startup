      - number: '1.2'
        title: Leadership, Governance, and Founder-to-Operator Transition
        blocks:
          - type: paragraph
            body: >-
              Leadership has clearly shifted from founder-led to operator-led. Mohit Aron was still described as CEO and
              founder in the March 2021 valuation announcement, but current official materials identify Sanjay Poonen as
              President and CEO, and independent coverage ties his August 2022 arrival to a deliberate plan to
              consolidate the fragmented data-protection market. Governance also expanded with the Veritas transaction.
              Official combination materials said Greg Hughes would stay involved as a board member and strategic
              advisor, while Brian Sheth (Haveli), Patrick McCarter (Carlyle), and Sandesh Patnam (Premji) gained board
              or observer roles. The current leadership page additionally shows Kevin Mandia as an independent board
              member and highlights a board structure mixing independent and investor representation. That mix gives
              Cohesity scale-governance benefits, but it also creates visible key-person dependence. Public launches,
              partner announcements, and integration messaging still orbit Sanjay and a relatively small named executive
              set. If growth, integration, or IPO preparation stumbles, the business has limited public redundancy in
              its leadership narrative, even if third-party directories imply the internal bench is broader than the
              website individually profiles.
