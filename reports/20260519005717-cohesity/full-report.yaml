  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Why it matters
      - Action implication
    rows:
      - - Hidden leverage
        - Debt package is large enough to pull effective equity value below the official close anchor
        - A high enterprise value is not investable if debt absorbs most upside.
        - Reset toward bear-case range and avoid premium entry.
      - - Preference stack leakage
        - Series H or rollover terms meaningfully subordinate new equity
        - Preference waterfalls can destroy common-equity returns even when headline EV rises.
        - Avoid secondary or IPO allocation without waterfall visibility.
      - - Weak inherited-cohort retention
        - Veritas renewals, migrations, or support economics underperform
        - Headline ARR quality matters more than headline ARR size.
        - Compress multiple toward Commvault-like or lower band.
      - - Disclosure failure in IPO prep
        - Future filing lacks cohort retention, mix, and debt transparency
        - Public investors will benchmark quality of disclosure against Rubrik, not against private-company precedent.
        - Keep stance at research-more or walk away from the IPO.
      - - Macro exit window shuts
        - IPO market weakens while bankers demand lower multiples
        - Even a good business can clear at a weak price if exits are hostile.
        - Require wider entry discount or postpone involvement.
      - - Premium pricing before proof
        - Management or sellers target Rubrik-like multiples without Rubrik-like evidence
        - The core mistake would be paying public-premium pricing for private-premium uncertainty.
        - Treat as a hard no until new evidence arrives.
    notes: >-
      These kill triggers focus on transmission from hidden structure to valuation rather than on generic operating
      risks already covered in the risks chapter.
    claimRefs:
      - CV023
      - CV054
      - CV055
      - CV056
      - CV057
      - CV058
      - CV059
      - CV060
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Debt package
        - Exact debt amount, interest cost, maturity, covenant headroom, and securedness
        - Needed to convert official enterprise-style value into equity value.
        - CFO and lender data room; debt term sheet.
      - - Cap-table waterfall
        - Series H economics, rollover ownership, liquidation preferences, and side letters
        - Determines whether new investors actually participate in upside.
        - Finance plus legal review of charter, side letters, and waterfall model.
      - - Combined revenue mix
        - Native Cohesity versus inherited Veritas ARR, support, and maintenance mix
        - Separates recurring software quality from legacy maintenance drag.
        - Management bridge deck and cohort revenue schedule.
      - - Retention proof
        - Gross retention, NRR, and migration success by legacy platform cohort
        - Core input for deciding whether premium multiple rerating is deserved.
        - Revenue operations and customer-success cohort analysis.
      - - Public-company disclosure pack
        - Draft KPI set, audit readiness, and cash-flow bridge for a future IPO filing
        - Rubrik-level multiples require Rubrik-level disclosure.
        - Banker readiness materials and auditor workplan.
      - - Secondary price discovery
        - Observed post-close trades by share class rather than model estimates
        - A live market signal would either validate or challenge the official close anchor.
        - Broker indications, matched-trade logs, or board transfer approvals.
    notes: >-
      The asks are ordered by how much they would change valuation confidence, not by ease of collection; missing any of
      the first three leaves the current range more narrative than underwritten.
    claimRefs:
      - CV055
      - CV056
      - CV057
      - CV058
      - CV059
      - CV060
