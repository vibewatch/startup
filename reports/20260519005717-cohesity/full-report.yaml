  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, Peer Set, and Substitute Paths
        blocks:
          - type: paragraph
            body: >-
              Cohesity’s competitive set is broader than the four direct peer names most often cited in investor
              shorthand. Independent 2025 market coverage still clusters Rubrik, Veeam, Commvault, Cohesity, Dell, and
              Druva at the top of the enterprise backup-and-data-protection category, but the practical buying field
              also includes Microsoft and AWS native services, IBM’s long-standing protection stack, and the residual
              Veritas footprint that many enterprises still understand operationally. The result is a multi-layer
              landscape: direct platform peers that compete for large consolidation programs, incumbents that defend
              existing estates, and hyperscaler-native substitutes that can satisfy narrower cloud-resident workloads
              without a full control-plane rip-and-replace.


              That structure matters because buyers do not choose between only two neatly bounded products. A large
              enterprise can keep Veeam for broad VM coverage, use Azure Backup or AWS Backup for cloud-native
              workloads, rely on IBM or Dell for retention-heavy or estate-tied use cases, and still evaluate Cohesity,
              Rubrik, or Commvault for cyber recovery and orchestration. In other words, the real alternative set
              includes both full-platform challengers and enough status-quo tooling to keep multi-homing alive.
              Cohesity’s advantage is that post-Veritas breadth now belongs in the top tier of this wider landscape, but
              that same breadth also exposes it to more fronts of competition at once.
