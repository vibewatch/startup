      - number: '7.2'
        title: Cyber, legal, and sovereign requirements amplify normal software execution risk
        blocks:
          - type: paragraph
            body: >-
              Cohesity sells into environments where backup is not just infrastructure plumbing but regulated resilience
              infrastructure. That makes regulatory and sovereign risk higher than it would be for a generic
              enterprise-software vendor. Financial-sector customers face DORA, critical-sector operators face NIS2,
              federal buyers are shaped by OMB zero-trust requirements and CISA maturity models, and any future IPO
              would pull the company into SEC cyber-governance and incident-disclosure rules. None of these sources says
              Cohesity has failed them; the risk is that product, support, audit, and reporting maturity must keep pace
              with the regulated customers the company now targets. DOJ’s Georgia Tech settlement shows that
              cybersecurity-control failures in government work can become False Claims Act events, while FTC safeguards
              guidance shows that breach reporting and service-provider oversight continue to tighten. In practice,
              regulated wins raise the bar twice: the product must work, and the evidence package behind it must survive
              procurement, certification, and post-incident scrutiny.
            claimRefs:
