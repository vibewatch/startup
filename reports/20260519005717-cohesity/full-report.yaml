companyProfile:
  summary: >-
    Cohesity is a San Jose-based data-security company founded in 2013 by Mohit Aron that now operates as the combined
    post-Veritas enterprise data protection business closed in December 2024. Its platform spans DataProtect, NetBackup,
    vaulting, cloud backup, and Gaia/AI-resilience workflows across hybrid, multi-cloud, and SaaS environments. Public
    close materials put the combined entity above $1.7 billion in pro forma revenue, at $1.5 billion of ARR, and above
