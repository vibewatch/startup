      - number: '6.5'
        title: Post-merger switching risk is more about execution and renewal behavior than explicit forced migration
        blocks:
          - type: paragraph
            body: >-
              Public post-merger materials do reduce one obvious fear: forced customer displacement. The roadmap PDF,
              Veritas “better together” page, WWT-published open letter, and Cohesity close materials all repeat the
              same message that products will be supported for years, migrations are voluntary, and customers can stay
              on their preferred platform. That lowers acute churn risk for inherited NetBackup and Alta accounts. But
              it does not remove the execution risk that matters most for underwriting. The same materials frame
              migration tooling as something to be built and streamlined, not something publicly proven at scale. Review
              platforms also show the kinds of issues that can complicate renewals in a broad product estate: uneven
              reporting, support or training gaps, setup complexity, and governance concerns around management surfaces.
              The result is a balanced conclusion. Cohesity does not look like a company about to force disruptive
              migrations on day one, but public evidence still cannot show how smoothly inherited customers renew,
              convert, or expand once roadmap promises meet real operational complexity.
