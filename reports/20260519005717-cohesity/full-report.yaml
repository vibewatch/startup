      - number: '6.2'
        title: Deployment patterns skew toward regulated hybrid environments and cyber-resilience workflows
        blocks:
          - type: paragraph
            body: >-
              The public deployments in this chapter cluster around hybrid, compliance-sensitive environments where
              recovery speed matters more than backup marketing. Detroit uses Cohesity across municipal workloads,
              Microsoft 365, and Google services; Maryland uses it for shared-service NAS backups across roughly 40
              agencies on Cisco UCS with a cyber-vault design; Musashino uses it for patient-care and hospital
              operations under Japan’s business-continuity expectations; RB uses it for national payment systems under
              DORA and PCI DSS; and Nasdaq uses it to protect both Microsoft 365 and remaining on-premises Exchange
              while keeping data in jurisdiction-specific regions. That is a coherent pattern: Cohesity lands where
              recovery, immutability, and sovereign-placement controls matter, then adds vaulting, cloud, or compliance
              automation. Federal evidence reinforces that pattern. The AWS GovCloud listing, DISA approval memo, and
              JITC certification show that government suitability is not just a marketing page claim. Public-sector
              penetration therefore looks real, though exact federal revenue and contract flow are still opaque.
            claimRefs:
