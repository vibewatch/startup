      - number: '2.4'
        title: Growth Drivers, Adoption Triggers, and Constraints
        blocks:
          - type: paragraph
            body: >-
              Demand drivers for this market are concrete rather than speculative. CISA’s ransomware guidance makes
              offline, encrypted, and tested backups a baseline control, while GAO documents the impact of ransomware
              across critical infrastructure and the still-incomplete adoption of leading practices. Cohesity’s own
              survey evidence points in the same direction: only 39% of organizations say they use a single platform
              across hybrid and multicloud environments, fewer than half follow 3-2-1 or use immutability, and only 6%
              qualify as truly risk-ready. IDC’s abstract language adds a macro read-through: the market remains
              resilient because it now sits at the intersection of AI initiatives, ransomware defense, and
              infrastructure optimization. Public-sector demand is not theoretical either; Cohesity’s government guide
              says 72% of states planned backup-and-recovery upgrades within 12 to 18 months, while GAO highlights
              healthcare, transportation, energy, and manufacturing as active ransomware-risk sectors.


              The same evidence also shows why adoption does not automatically convert into fast revenue. Buyers face
              incumbency drag, complicated evaluation cycles, certification requirements, public-sector budget timing,
              and the need for cleanroom-style recovery capabilities that many organizations still have not
              operationalized. IDC explicitly says price and incumbency matter, not just features, and Rubrik’s filing
              warns that government funding authorizations and certification requirements can slow or derail demand.
              Cohesity therefore benefits from strong secular demand, but valuation still depends on whether it can turn
              that demand into faster migrations, larger cross-sell bundles, and repeatable channel-assisted conversions
              without relying on over-broad TAM language.
