            - label: High
              tone: warning
              detail: This risk touches inherited renewals, roadmap credibility, and the combined-company operating model.
            - label: Medium
              tone: neutral
              detail: Continuity messaging and early combined products are real but not outcome-proof.
            - label: High
              tone: warning
              detail: Residual exposure stays high until conversion and renewal outcomes are disclosed.
        - label: Regulatory / sovereign compliance
          values:
            - label: Medium
              tone: warning
              detail: The burden is concentrated in regulated sectors rather than the whole customer base.
            - label: High
              tone: warning
              detail: Misses can block deals, raise costs, or create enforcement-like consequences.
            - label: Medium
              tone: neutral
              detail: Framework alignment is visible, but audit-grade evidence is not public.
            - label: High
              tone: warning
              detail: Customers in finance, government, and critical infrastructure raise the downside of any gap.
        - label: Competitive displacement
          values:
            - label: High
              tone: warning
              detail: Competitors are already marketing directly against post-Veritas uncertainty.
            - label: High
              tone: warning
              detail: Pricing concessions or lost migrations could alter both growth and margin assumptions.
            - label: Low
              tone: warning
              detail: >-
                There is no public evidence that counter-marketing has been fully neutralized by measured retention
                proof.
            - label: High
              tone: warning
              detail: >-
                Residual pressure remains high until the inherited base proves sticky in public metrics or reference
                calls.
        - label: Disclosure / financing readiness
          values:
            - label: Medium
              tone: warning
              detail: >-
                An IPO remains optional rather than imminent, but management has publicly attached timing to execution
                milestones.
            - label: Medium
              tone: warning
              detail: The downside is slower de-risking and less transparent underwriting rather than immediate insolvency.
            - label: Low
