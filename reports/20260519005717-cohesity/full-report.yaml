      - number: '4.2'
        title: Monetization, Pricing Opacity, and Unit Economics Proxies
        blocks:
          - type: paragraph
            body: >-
              Cohesity’s revenue quality appears better than its disclosure quality. Official materials from both the
              2021 standalone period and the 2024 close repeatedly emphasize a subscription-led recurring model, and the
              legacy net-expansion figure above 130 percent is the cleanest public evidence that the product
              historically expanded within existing accounts rather than depending only on new logos. Public materials
              also imply several monetization buckets: software subscriptions or term licenses, support and maintenance
              renewals, DMaaS or SaaS offerings such as DataProtect delivered as a service, and services or
              partner-delivered implementations. What is missing is the exact mix between those streams, which matters
              because inherited Veritas maintenance dollars are economically different from net-new Cohesity software
              ARR. The pricing picture is even more opaque. Reviewed materials do not expose realized customer pricing,
              discount levels, or CAC and payback metrics, so the best public unit-economics read comes from proxies and
              public peers. Rubrik’s filing and earnings releases show how a cyber-resilience peer discloses ARR, gross
              margin, free cash flow, and contribution margin. Commvault’s annual report and fiscal 2026 results show
              what mature public disclosure looks like for revenue, ARR, gross margin, and cash generation. That
              contrast strengthens the view that Cohesity’s core engine is probably recurring and enterprise-heavy, but
              still not disclosed at a level that supports bottom-up underwriting.
