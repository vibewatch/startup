      - number: '1.4'
        title: Milestones, Partnership Momentum, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              The milestone record from 2021 to 2026 shows a company moving from high-growth private backup vendor to
              scaled platform consolidator, but the same record also surfaces diligence risks. The February 2024 deal
              thesis rested on low customer overlap, broader global coverage, and a roadmap that preserved both the
              Cohesity and Veritas product lines. TechCrunch later reported less than 5% customer overlap and described
              a unified sales motion designed to capture synergies without immediate sales layoffs. That is positive for
              cross-sell logic, yet the same article points out the classic consolidation downside: less competition can
              raise pricing power even if no pricing or contract changes were announced at close. Official 2026 launches
              deepen the strategic shift by tying Cohesity to sovereign cloud, agent-risk recovery, Google integrations,
              and AI data activation, which helps explain why management increasingly talks about cyber resilience
              rather than backup alone. Even so, there are still important blind spots for investors: current headcount
              is not publicly verified, precise debt terms are undisclosed, and post-merger pricing behavior has not
              been pressure-tested through public customer references. Those are not thesis breakers, but they are the
              highest-value diligence follow-ups before using the 2024 close metrics as a valuation anchor.
