      - number: '8.2'
        title: Public Comp Benchmark and Underwriteability
        blocks:
          - type: paragraph
            body: >-
              The closest public anchors show why Cohesity cannot simply inherit Rubrik’s premium multiple. Rubrik’s
              fiscal 2026 results combined with May 2026 market data imply roughly 9.3x-9.8x EV-to-revenue and about
              8.4x-8.8x EV-to-ARR, supported by 48% revenue growth, 80.1% GAAP gross margin, positive free cash flow,
              and a $1.68 billion cash balance. Commvault, by contrast, trades nearer 3.6x EV-to-revenue and about 3.8x
              EV-to-ARR with lower growth but similar gross margin and comparable free cash flow. Cohesity’s official
              close anchor, at at least about 4.1x revenue and 4.7x ARR, sits between those two public markers. That
              positioning is directionally reasonable for a scaled but opaque private company: larger than both peers on
              disclosed top-line scale, yet less underwriteable because investors cannot inspect leverage, preference
              stack, or native-versus-inherited ARR mix. The right conclusion is that the current official anchor is not
              obviously cheap, but it is also not obviously inflated if one assumes meaningful debt and disclosure
              discounts versus Rubrik.
