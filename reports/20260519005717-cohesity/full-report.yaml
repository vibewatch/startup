      - number: '6.3'
        title: Named customer proof is strongest when the case study includes operational metrics, not just a logo and quote
        blocks:
          - type: paragraph
            body: >-
              The best public proof does more than say a customer exists; it shows what changed after deployment.
              Maryland and Detroit are the cleanest public-sector examples because they disclose restore-time and labor
              or cost improvements, not just satisfaction language. Musashino offers the strongest healthcare metric
              with 500 GB recovered in 20 seconds during a business-continuity drill, while RB provides the clearest
              financial-infrastructure proof with a 30-40 TB Oracle database restored in under eight hours and automated
              weekly testing. Nasdaq is valuable because it links backup to concrete SaaS governance and
              data-sovereignty workflows at scale. Bethany and Conagra add mission criticality even where the metrics
              are thinner, while Schwarz IT broadens European enterprise relevance despite light quantitative detail.
              Put differently, named proof is real and multi-vertical, but quantified outcomes are concentrated in a
              subset of stories. That makes reference-call selection important: some stories demonstrate hard operating
              leverage, while others mainly demonstrate category fit and brand credibility.
