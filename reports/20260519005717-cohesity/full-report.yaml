  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Included Spend
        blocks:
          - type: paragraph
            body: >-
              Cohesity’s market should not be framed as a narrow backup-appliance niche. The reviewed evidence points to
              a layered market definition: a core data replication and protection software category, a cyber-recovery
              overlay that adds integrity and clean-recovery requirements, and adjacent data-security / data-management
              workloads that vendors use to enlarge TAM. The cleanest bounded layer is IDC’s data replication and
              protection software market, which the Veritas combination materials peg at roughly $12.2-$12.3 billion in
              2024 vendor sales. That core layer clearly includes enterprise backup, replication, recovery, and related
              software revenue. It does not by itself capture every adjacent workload vendors now sell under cyber
              resilience, SaaS protection, or data-security posture language.


              The surrounding spend that Cohesity and peers want investors to count includes cyber-recovery tooling,
              SaaS protection breadth, security-driven recovery workflows, and some managed or partner-delivered
              services. IDC’s own MarketScape language supports this broader framing by distinguishing cyber-recovery
              from traditional DR and SaaS protection from native app tooling. At the same time, that does not make
              every adjacent security or storage budget part of Cohesity’s real market. Pure network security, endpoint
              security, generic storage hardware, and unrelated cloud administration tools remain outside this chapter’s
              working boundary. The relevant status-quo substitutes are incumbent backup suites, native point tools, and
              MSP-delivered recovery services, not a single unified buyer budget.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
