      - number: '1.3'
        title: Capital Base, Shareholder Signals, and Disclosure Limits
        blocks:
          - type: paragraph
            body: >-
              Cohesity's capital story has two distinct phases. First, the company reached a $3.7 billion valuation in
              March 2021 via a $145 million non-dilutive tender offer led by STEADFAST, after disclosing nearly 90%
              year-over-year ARR growth, net expansion above 130%, and more than 2,300 customers. Reuters-linked
              coverage later reported that the company confidentially filed for a U.S. IPO in December 2021, but the
              listing did not happen as software market conditions weakened. Second, Cohesity chose scale-through-M&A
              rather than a standalone listing. In February 2024 it announced the Veritas enterprise data protection
              combination at an approximate $7 billion combined valuation, then closed the transaction in December 2024
              with disclosed pro forma revenue above $1.7 billion, ARR of $1.5 billion, and 28% adjusted cash EBITDA
              margin for the combined entity. The investor roster around that transaction is strategically important:
              Haveli led the Series H financing, Carlyle rolled into the cap table through Veritas, and long-time
              backers such as SoftBank, Sequoia, Wing, and Premji remained part of the story. What is still missing is
              the real cap-table math—exact post-close ownership percentages, liquidation stack, and debt sizing were
              not publicly disclosed.
