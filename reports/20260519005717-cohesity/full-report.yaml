  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Legacy Standalone Metrics Versus Combined Pro Forma Scale
        blocks:
          - type: paragraph
            body: >-
              The public record supports two very different financial lenses. The legacy standalone lens is strongest in
              2021, when Cohesity disclosed an annualized revenue run rate above $300 million, ARR growth above 70
              percent, net expansion above 130 percent, and roughly 2,600 customers by July 31, 2021. The March 2021
              tender announcement and contemporaneous coverage also showed that investors were willing to support a 3.7
              billion dollar valuation through a non-dilutive employee liquidity event, which indicates real demand for
              the standalone business before the software-market reset. But the underwriting problem is that this lens
              effectively stops there. By 2024 and 2025, the company’s most useful scale disclosures are no longer
              standalone Cohesity metrics. Instead, the announcement and close materials for the Veritas combination
              provide combined-entity pro forma revenue, ARR, and adjusted cash EBITDA figures. The February 2024
              announcement framed the business at more than $1.6 billion of revenue, $1.3 billion of ARR, and 27 percent
              adjusted cash EBITDA margin, while the December 2024 close updated those metrics to more than $1.7 billion
              of revenue, $1.5 billion of ARR, and 28 percent adjusted cash EBITDA margin. Those are powerful scale
              markers, but they cannot be read as audited standalone Cohesity economics.
