chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Platform, and Current Positioning
        blocks:
          - type: paragraph
            body: >-
              Cohesity is a private San Jose, California data-security software company founded in 2013. Its current
              corporate pitch centers on Cohesity Data Cloud, a single platform for protecting 1,000+ workloads across
              on-premises, cloud, and SaaS environments while also making protected data usable for AI. The company page
              now claims 13,000+ customers, 70% of the Global 500, and 200+ exabytes of protected data, which is
              directionally above the 12,000-customer / hundreds-of-exabytes scale disclosed when the Veritas
              combination closed in December 2024. Customer references such as Nasdaq and Conagra show the product being
              used in regulated enterprise SaaS backup and operationally sensitive environments rather than only in
              small IT backup niches. The 2026 product narrative also broadens the story beyond classic backup:
              Cohesity's March 2026 Enterprise AI Resilience launch and April 2026 Google Cloud award both emphasize
              governed enterprise data, agent-risk recovery, and cloud-native cyber resilience. The identity to carry
              into later chapters is therefore not a point backup appliance vendor but a private cyber-resilience
              platform vendor trying to convert protected data and partner integrations into a broader AI-era control
              plane.
