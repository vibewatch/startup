companyProfile:
  summary: >-
    Cohesity is a San Jose-based data-security company founded in 2013 by Mohit Aron that now
    operates as the combined post-Veritas enterprise data protection business closed in December
    2024. Its platform spans DataProtect, NetBackup, vaulting, cloud backup, and Gaia/AI-resilience
    workflows across hybrid, multi-cloud, and SaaS environments. Public close materials put the
    combined entity above $1.7 billion in pro forma revenue, at $1.5 billion of ARR, and above
    12,000 enterprise customers, while current company messaging claims 13,000+ customers and
    roughly 70% of the Global 500. Despite that scale, Cohesity remains a private, disclosure-light
    company: public sources do not reveal current headcount, debt sizing, or exact post-close
    ownership terms.
  foundedDate: "2013-06-01"
  founders:
    - name: Mohit Aron
      role: Founder
      claimRefs: [CO006]
  foundingLocation: San Jose, CA
  headquarters: San Jose, CA
  productSummary: >-
    Cyber-resilience and data protection platform spanning DataProtect backup and recovery,
    NetBackup continuity for inherited Veritas estates, FortKnox/Alta vaulting, cloud backup
    services, and Gaia-based data activation / AI resilience workflows.
  customerFocus: >-
    Large enterprises and regulated organizations running hybrid, multi-cloud, SaaS, and public-
    sector workloads, including Fortune 100/500 accounts, government agencies, healthcare
    providers, financial institutions, and large centralized IT environments.
  businessModel: >-
    Subscription-led recurring software business with monetization across software subscriptions or
    term licenses, support and maintenance renewals, SaaS/DMaaS offerings, and professional or
    partner-delivered services.
  stage: Late Stage / Post-Merger
  fundingStatus: >-
    The 2024 Veritas transaction was funded through Haveli-led Series H equity plus a JPMorgan-
    arranged term-loan facility; public sources identify major investors and rollover shareholders
    but do not disclose exact debt size, ownership percentages, or preference terms.
  disclosureProfile: private-undisclosed
