  topStrengths:
    - >-
      Combined Cohesity entered the post-Veritas period at more than $1.7B of revenue, $1.5B of ARR, and over 12,000
      customers, giving it unusual scale in data protection.
    - >-
      Product breadth across DataProtect, NetBackup, vaulting, cloud services, and Gaia supports cross-sell into hybrid
      and multi-cloud cyber-resilience budgets.
    - >-
      Public customer proof spans healthcare, public sector, financial infrastructure, capital markets, and other
      mission-critical environments rather than a narrow IT niche.
    - >-
      The official close multiple sits well below Rubrik's premium public multiple, limiting the case for calling the
      2024 anchor obviously overvalued.
  topRisks:
    - >-
      Debt size, pricing, maturity, and covenant detail from the Veritas transaction remain undisclosed, obscuring true
      equity value.
    - >-
      Public evidence on renewal durability, migration conversion, and support stability for inherited NetBackup and
      Alta cohorts remains thin.
    - >-
      Cohesity still lacks public-company-grade disclosure on current growth, gross margin, net retention, CAC, payback,
      and headcount.
    - >-
      Rivals such as Rubrik, Commvault, Veeam, and cloud-native alternatives can exploit any integration wobble or
      pricing friction.
  unresolvedGaps:
    - Debt quantum, pricing, maturity, and covenant package from the Veritas transaction.
    - Native-versus-inherited ARR and revenue mix, plus retention by legacy Cohesity versus inherited Veritas cohorts.
    - Cap-table waterfall, preference stack, and exact post-close ownership percentages.
    - Current headcount, cash runway, and post-merger pricing realization by segment.
