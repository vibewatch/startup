  rows:
  - - Recommendation
    - research-more
    - Kraken has real strategic traction, but public disclosure is too thin to underwrite a fresh entry at the unicorn headline without diligence access.
  - - Confidence
    - medium
    - The financing round and customer anchors are public, but the decisive revenue-quality inputs are not.
  - - Risk rating
    - high
    - Customer concentration, hardware intensity, export-control burden, and limited public unit economics create downside if conversion slips.
  - - Valuation stance
    - stretched
    - The price is defensible only if Kraken converts current reference wins into durable, higher-quality revenue.
  - - Entry discipline
    - Do not underwrite blindly at headline price
    - Require NDA diligence on revenue, margins, backlog, partner economics, and financing terms.
  - - Monitor horizon
    - 12-24 months
    - That window should reveal whether current reference programs mature into repeatable fleet or sustainment revenue.
