company:
  name: Kraken Technology
chapter:
  number: 8
  title: Valuation
  summary: Kraken’s July 2026 $175 million Series B at a $1 billion valuation is a real financing anchor, not a rumor, and it sits inside a market that is currently rewarding defense-autonomy scarcity with aggressive private marks. Public evidence supports a serious company with named military customers, sovereign backers, and credible manufacturing pathways, but the same public record still lacks revenue, margin, backlog, preference, and concentration disclosure. The right stance is research-more with medium confidence, high risk, and a stretched-but-not-absurd valuation view.
sections:
- id: valuation-anchor-and-initial-call
  title: Valuation anchor and initial call
  body: Kraken crossed the unicorn threshold in July 2026 when DTCP and multiple secondary outlets reported a $175 million Series B at a $1 billion valuation. That financing anchor is strong enough to matter because it comes from a named lead investor, a recognizable defense-focused syndicate, and corroborating coverage across UK and international outlets. It is also connected to a credible use-of-funds story around capability development and international manufacturing expansion rather than to a vague AI narrative. The problem is not whether the round happened; it clearly did. The problem is that the public record still does not supply the financial pack that lets an outside investor test whether the round price is attractive versus merely plausible. There is no disclosed revenue, ARR, gross margin, runway math, preference stack, or customer concentration table in retained public sources. On that basis, the recommendation should remain research-more, confidence should remain medium, risk
    should remain high, and the valuation stance should be stretched rather than clearly cheap.
  claimRefs:
