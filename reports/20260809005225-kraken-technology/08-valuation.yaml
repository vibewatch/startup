- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Status
  - Valuation / financing marker
  - Why it matters
  - Limitation
  rows:
  - - Saronic
    - Private maritime autonomy peer
    - '2026 Series D: $1.75B raised at $9.25B valuation'
    - Closest public maritime-autonomy valuation reference and far above Kraken’s current mark.
    - Has larger disclosed scale ambitions and a stronger U.S.-centric naval narrative.
  - - Shield AI
    - Private autonomy / defense software-hardware peer
    - '2026 Series G: $1.5B equity plus $500M preferred at $12.7B post-money'
    - Shows how richly the market can value mission-critical autonomy with deeper program depth.
    - Broader product scope and larger capital base than Kraken.
  - - Mach Industries
    - Private defense-manufacturing peer
    - '2026 Series C: $300M at $1.8B valuation'
    - Shows current market appetite for hardware-heavy defense startups with manufacturing narratives.
    - Different product category and may not map cleanly to maritime autonomy.
  - - Helsing
    - Private European defense AI peer
    - '2026 financing: $1.8B raised at $18B valuation'
    - Demonstrates that European defense premiums can be extreme when strategic urgency is high.
    - Software and AI profile differs materially from Kraken’s maritime-hardware mix.
  - - Anduril
    - Private defense prime challenger
    - '2026 Series H: $5B raise at $61B scale marker'
    - Sets the upper bound for strategic defense-platform enthusiasm.
    - Too large and broad to be a direct valuation comp, but useful as a premium ceiling.
  notes: Comparable rows illustrate market context rather than precise multiple equivalence.
