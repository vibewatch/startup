- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Prototype-to-production conversion stalls
    - Reference programs remain trial-like without clear follow-on revenue
    - Undermines the strategic-scarcity premium embedded in the current round
    - Do not add capital at headline price until conversion evidence improves.
  - - Revenue-quality opacity persists
    - Management still cannot show recognized revenue, gross margin, and backlog quality under NDA
    - Makes it impossible to test whether Kraken deserves strategic-premium or hardware-risk pricing
    - Shift stance from research-more toward avoid-at-price.
  - - Partner QA or export-control problem emerges
    - Cross-site quality or transfer-control issue delays a meaningful program
    - Turns strategic scaling narrative into execution drag
    - Discount manufacturing-expansion upside and re-rate operational risk.
  - - Budget timing shock
    - Major sovereign customers delay awards or options for an extended period
    - Stretches cash conversion and slows scale narrative
    - Stress-test runway and lower fair-value range.
  - - Follow-on financing below current mark
    - Next priced round or strategic transaction implies a lower enterprise value without broad market reset
    - Signals that current public valuation support was too optimistic
    - Treat the July 2026 round as peak narrative pricing until proven otherwise.
  notes: Triggers are valuation-specific and tied to monitorable operating, customer, and capital-market events.
