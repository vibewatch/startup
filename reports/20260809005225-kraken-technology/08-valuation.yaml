- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue quality
    - Recognized revenue, backlog, and conversion by customer and program
    - The public record is not enough to test whether the unicorn price is fair.
    - Request management accounts and signed backlog bridge under NDA.
  - - Gross margin / unit economics
    - Platform-family margin, partner revenue share, working-capital burden
    - Determines whether Kraken deserves strategic-premium or hardware-risk valuation treatment.
    - Review product-level P&L and partner economics.
  - - Customer durability
    - Renewal history, option exercise cadence, top-customer concentration
    - Reference wins alone do not prove durable cash flow.
    - Request customer-concentration schedule and renewal tracker.
  - - Financing terms
    - Liquidation preferences, ratchets, warrants, board rights, and any debt
    - Headline valuation can mask less attractive economics for new money.
    - Review financing docs or counsel summary.
  - - Operational reliability
    - MTBF, incident log, support cost, and acceptance history
    - Hardware-autonomy execution risk can erase valuation premium quickly.
    - Review QA, reliability, and field-support evidence.
  notes: Each diligence ask is directly tied to whether an investor should accept, reject, or renegotiate the July 2026 price.
