- id: what-supports-the-price
  title: What supports the price
  body: 'There is real evidence behind the $1 billion mark. Kraken is not a pre-customer concept company. The Royal Navy has publicly announced a £12.3 million order for 20 uncrewed boats, and USSOCOM has been linked to an OTA worth up to $49 million for rapid development and prototyping. The company has also attracted sovereign and strategic capital from the British Business Bank, NATO-linked capital sources, and defense-industrial partners, which gives the round more policy and industrial weight than a pure momentum markup. Public product and deployment evidence suggests Kraken is pursuing a capital-intensive but strategically relevant position in modular maritime autonomy, with manufacturing routes in multiple allied jurisdictions. Analyst-market-data sources also support the idea that autonomous naval and autonomous-ship markets are expanding, which helps explain why investors may pay ahead of current disclosure. In short, the price has real strategic support: named customers, industrial
    relevance, and a market that currently rewards credible defense-autonomy platforms. The valuation is therefore not arbitrary, even if it remains only partially underwritten by public fundamentals.'
