- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Revenue / traction assumption
  - Valuation logic
  - Equity value range
  - Probability signal
  rows:
  - - Bull
    - Royal Navy, USSOCOM, and allied programs convert into broader fleet procurement and sustainment revenue; partner production scales cleanly.
    - Premium defense-autonomy logic with meaningful production conversion and improving margin visibility.
    - $1.5B-$2.2B
    - Requires strong conversion evidence and cleaner unit-economics disclosure than is public today.
  - - Base
    - Current reference accounts deepen, but disclosure remains incomplete and hardware intensity stays meaningful.
    - Current round remains roughly fair to slightly stretched on strategic scarcity and moderate execution.
    - $0.9B-$1.2B
    - Closest fit to current public evidence.
  - - Bear
    - Prototype-heavy demand persists, customer concentration remains high, and partner or budget friction slows conversion.
    - Valuation resets toward a more conventional defense-hardware risk band.
    - $0.5B-$0.8B
    - Triggered by thin revenue proof, delayed programs, or weak margin quality.
  - - Current round
    - Investors already assume material progress from reference wins toward scalable production and industrial relevance.
    - Headline price is plausible only if future conversion significantly outgrows current public evidence.
    - ~$1.0B
    - The round can work, but only with stronger fundamentals than the public record independently proves.
  notes: Ranges are author estimates in USD billions derived from public demand anchors, peer context, and execution-risk weighting.
