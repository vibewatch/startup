  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算口径
        blocks:
          - type: paragraph
            body: >-
              Kraken 所处市场真实存在，但分析上很混乱。公司不是通用自主航运供应商；它向盟友海上安全项目销售防务导向的无人水面与水下平台、
              载荷集成和本地化产业能力。因此，广义自主船舶市场有方向性参考价值，但单独使用过宽，因为它包括商业航行、货运自主化和民用海事自动化。 较窄的自主海军舰艇口径更接近 Kraken
              当前产品和客户集合；最宽的自主海上防务口径则覆盖联盟安全、海岸防护和无人任务预算， 这些预算最终可以支撑 K3 SCOUT、K4 MANTA 和 K5 KRAKEN 这类平台。因此，2026
              年公开市场估算跨度很大： Research and Markets 估计自主海军舰艇约 $1.7 billion，Fortune Business Insights 估计自主船舶为 $7.09 billion，
              NextMSC 估计自主海上防务系统为 $10.54 billion。正确的分析结论不是挑一个数字称为 TAM，而是把 Kraken 的可服务市场看成分层机会： 近期 SAM
              显著窄于自上而下的全球数字，但战略方向仍然有利。稳健的市场判断需要保留三层口径，再明确收窄到 Kraken 已有客户验证的项目。
