      - number: '8.5'
        title: 最终尽调问题与否决触发器
        blocks:
          - type: paragraph
            body: >-
              估值判断缺口非常具体。第一，Kraken 需要证明收入质量：已确认收入、积压订单、按平台家族划分的利润率，以及硬件交付与经常性支持或软件各占多少。第二，投资人需要一套客户转化资料，说明 Royal Navy
              授标、USSOCOM OTA 和盟友管线如何从演示与原型推进到多周期生产或保障。第三，资本结构本身很重要：清算优先权、棘轮条款、债务和任何战略治理叠加，都可能改变名义
              独角兽标记对新资金是否有吸引力。第四，尽调需要把合作伙伴依赖与单位经济性对齐，因为本地生产声望并不总等于价值捕获。在这些问题闭合之前，正确姿态是避免把本轮融资当作自证。击穿投资假设的触发器包括：项目转化一再滑坡；数据室仍无法展示可靠利润率或续约；出现实质
              QA 或出口管制问题；或后续融资低于当前估值且没有清晰的全市场解释。
