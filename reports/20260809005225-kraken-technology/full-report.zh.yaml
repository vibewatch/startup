  - id: TV005
    title: 投资论点失效与否决触发表
    columns:
      - 触发项
      - 阈值
      - 如何传导到论点
      - 行动含义
    rows:
      - - 原型到量产转化停滞
        - 标杆项目仍像试点，没有清晰后续收入
        - 削弱当前轮次内含的战略稀缺溢价
        - 转化证据改善前，不要按名义价格加码。
      - - 收入质量仍不透明
        - 管理层在 NDA 下仍无法提供已确认收入、毛利率和在手订单质量
        - 无法判断 Kraken 应按战略溢价还是硬件风险定价
        - 将立场从「继续研究」转向「按该价格回避」。
      - - 合作伙伴 QA 或出口管制问题暴露
        - 跨站点质量或转移管制问题拖慢关键项目
        - 战略扩张叙事变成执行拖累
        - 下调制造扩张上行空间，并重估运营风险。
      - - 预算节奏冲击
        - 主要主权客户长期推迟授标或合同选项
        - 拉长现金转化，放慢规模化叙事
        - 压力测试现金跑道，并下调公允价值区间。
      - - 后续融资低于当前估值标记
        - 若市场没有整体重置，下一轮定价融资或战略交易却隐含更低企业价值
        - 说明当前公开估值支撑过于乐观
        - 在相反证据出现前，把 2026 年 7 月轮次视为叙事峰值定价。
    notes: 这些触发项聚焦估值，绑定可监测的运营、客户和资本市场事件。
    claimRefs:
      - CV024
      - CV026
      - CV027
      - CV029
      - CV035
      - CV038
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入质量
        - 按客户和项目拆分的已确认收入、在手订单和转化
        - 公开材料不足以判断独角兽价格是否公允。
        - 在 NDA 下索取管理报表和已签约在手订单桥表。
      - - 毛利率 / 单位经济性
        - 按平台家族拆分的毛利率、合作伙伴收入分成、营运资本压力
        - 决定 Kraken 应按战略溢价还是硬件风险估值。
        - 审阅产品级 P&L 和合作伙伴经济性。
      - - 客户韧性
        - 续约历史、期权行使节奏、头部客户集中度
        - 仅有标杆订单不能证明现金流持久。
        - 索取客户集中度明细表和续约跟踪表。
      - - 融资条款
        - 清算优先权、棘轮条款、认股权证、董事会权利及任何债务
        - 名义估值可能掩盖新资金拿到的经济性不够好。
        - 审阅融资文件或律师摘要。
      - - 运营可靠性
        - MTBF、事故日志、支持成本和验收历史
        - 硬件自主系统执行风险会很快抹掉估值溢价。
        - 审阅 QA、可靠性和现场支持证据。
    notes: 每个尽调问题都直接对应投资者应接受、拒绝，还是重新谈判 2026 年 7 月价格。
    claimRefs:
      - CV005
      - CV006
      - CV011
      - CV024
      - CV034
      - CV036
