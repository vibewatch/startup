        title: 点名客户验证与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              客户验证明显强于标识营销，但成熟度仍不均衡。英国皇家海军证据最深，因为它包括已宣布的 £12.3 million 合同、20 艘无人艇、 点名终端用户组织，以及后来英国皇家海军支持的 K3 SCOUT
              空投试验公开证据。USSOCOM 验证也有分量，因为 OTA 上限很高， 多家独立媒体描述了一条围绕特种作战需求塑造的快速开发路径；但公开记录仍把相关工作表述为原型开发，而非已宣布的生产舰队订单。 NATO
              和盟友验证来自 Task Force-X 参与、主权制造公告，以及引用盟友防务需求的融资叙事；但在点名采购订单或稳定舰队使用方面更薄。 Kraken
              自己的新闻页面还提出一个更强但独立可验证性较弱的主张：系统已经部署在进行中的冲突中。因此，采用故事可信但分阶段： 真实合同和操作者触点存在，活跃舰队规模、出动节奏、续约时间和利用率等大分母指标仍未披露。换个说法，
              Kraken 已有足够客户验证具备战略意义，但重复使用披露还不足以建模稳定装机基础。因此，本章把点名合同证据视为强信号， 同时仍折价看待缺少分母或重复使用披露的主张。
