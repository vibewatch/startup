  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与竞争者类别
        blocks:
          - type: paragraph
            body: >-
              Kraken 的竞争场最好按层理解，而不是归入单一同业组。直接同行包括其他销售或推广专用无人艇的海上自主化供应商， 最明显的是 Saronic、Saildrone 以及 Anduril 的部分海上产品。第二层是
              Shield AI 这类以自主能力为核心的防务公司， 它们的相关性更多来自争夺环境下的韧性自主能力，而不是船体。第三层是海事和防务老牌厂商——Rheinmetall、Lockheed Martin、 Exail
              等产业玩家——即便不像初创点状竞争者，也能把自主能力、载荷集成和采购可信度组合起来。这一点重要， 因为买方评估的往往是一个项目，而不是一艘独立船：平台必须适配本土成分规则、载荷选择、支持模式和指挥控制环境。
              因此，Kraken 的公开形象竞争的不只是艇体规格；它竞争的是信任、盟友可制造性、集成路径，以及公司能否成为主权或联盟海上项目中合适的产业节点。
              分层视角既避免本章夸大它与每一家防务主承包商的竞争，也承认采购替代方案可能来自大得多的组织。它还解释了为什么没有单一竞争者能作为完美类比：
              有的赢在续航，有的赢在自主技术栈深度，有的赢在主权主承包商身份。按今天的公开资料看，也是如此。
