        - 说明当前市场愿意追捧制造叙事强、硬件占比高的防务初创公司。
        - 产品类别不同，未必能干净映射到海事自主。
      - - Helsing
        - 欧洲未上市防务 AI 同行
        - 2026 年融资：募资 $1.8B，估值 $18B
        - 证明战略紧迫性高时，欧洲防务溢价也可能极端。
        - 软件和 AI 属性与 Kraken 的海事硬件组合明显不同。
      - - Anduril
        - 未上市防务主承包商挑战者
        - 2026 年 Series H 轮：募资 $5B，$61B 规模标记
        - 给战略防务平台热度设定上限。
        - 体量太大、范围太宽，不适合做直接估值可比，但可作为溢价天花板。
    notes: 这些可比项用于说明市场语境，而不是精确倍数对照。
