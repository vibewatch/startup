      - number: '3.2'
        title: 能力、打包方式与进入市场路径
        blocks:
          - type: paragraph
            body: >-
              公开能力主张显示出有意义的差异化，但重叠也很大。Kraken 的 K3 SCOUT 强调速度、模块化和濒海任务； K4 MANTA 增加了少见的混合水面 - 水下形态；K5 KRAKEN
              则把组合延伸到更高载荷和反潜作战概念。 Saildrone 的营销指向持久在线和海洋情报规模，Saronic 强调先进自主舰艇和不断增加的海军验证。Anduril 围绕海权和更广的防务系统集成定位自己，
              Shield AI 则强调能在通信降级和操作者过载中存活的自主能力。Lockheed 和 Exail 等大厂用围绕自主概念的可信产业外壳，让市场更不宽松。
              打包方式也因此不透明：多数玩家通过项目特定合同销售，而不是公开标价；相关「产品」常常包括艇体硬件、自主软件、载荷集成、
              支持和本地化产业内容。进入市场的能力因此混合了产品能力、操作者验证、制造通道以及谁控制主承包关系。结果是， 能力比较应被视为解决方案包比较，而不只是这一艘艇对比另一艘艇。这种复杂性有利于能降低采购摩擦的供应商。
