      - number: '8.3'
        title: 价格仍被拉伸之处
        blocks:
          - type: paragraph
            body: >-
              拉伸来自不透明和商业模式不确定性。公开来源没有说明 Kraken 是否已经确认了数千万美元收入，还是当前叙事仍主要由原型合同金额、期权价值和预期量产转化支撑。最清晰的具名需求锚点——Royal Navy 订单和
              USSOCOM
              OTA——很有价值，但合在一起仍不能证明公司已经拥有广泛、可复购的装机基础。公开证据也显示业务偏硬件和集成，这通常应该采用不同于软件公司的估值逻辑；后者能够证明更干净的经常性利润率。客户集中、出口管制负担和合作伙伴主导制造都会增加执行风险，除非增长可见度异常强，否则通常会压缩倍数。关键问题因此不是
              Kraken
              是否重要；它大概率重要。关键问题是，在尽调拿到收入质量、利润率、合作伙伴经济条款和转化里程碑之前，公开记录是否支持支付完整独角兽价格。没有这些数据，只有愿意同时承保稀缺性、战略时点和当前基本面的买方，才适合投资这一轮。
            claimRefs:
              - CV005
