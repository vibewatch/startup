            body: >-
              Kraken 的客户风险和依赖风险紧密相连。主权客户集中让订单具备战略价值，也让收入节奏对采购周期和项目赞助异常敏感。 GAO 2026
              年报告称，临时拨款决议会拖延或复杂化防务活动；英国议会的装备计划调查也凸显英国采购体系的不确定性。 对 Kraken 而言，这些动态重要，因为公开牵引力仍集中在少数防务锚点，而不是广泛的经常性客户基础。与此同时，
              国际扩张依赖德国、美国和加拿大的合作伙伴和本地化生产节点。这些关系可以加速采用并改善主权适配，但也让公司依赖共享 QA、
              排期、出口管制一致性和仍属私密的商业激励。风险传导路径很直接：如果客户项目滑期、伙伴排期滑期，或跨境合规问题暂停发货， 硬件属性很重的公司会很快在订单、制造节奏和估值支撑上感到冲击。正向解读是 Kraken
              选择了强战略交易对手； 风险解读是，这些交易对手已经成为公司操作系统的一部分。
