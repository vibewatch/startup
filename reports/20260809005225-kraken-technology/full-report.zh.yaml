      - number: '5.3'
        title: 信任、质量控制与路线图验证
        blocks:
          - type: paragraph
            body: >-
              公开层面的信任和质量证据在改善，但仍不完整。Kraken 强调人在环中监督、航线保持、避碰、安全通信和低信号特征设计， 并且已经把这些主张同可见演示绑定起来：DSEI 2025、SOF Week 2026、与
              Rheinmetall 的汉堡生产， 以及英国皇家海军支持的 K3 SCOUT 空投。因此，路线图似乎正从演示和任务验证走向规模生产、更广泛载荷集成和本地化制造。
              不过，独立验证仍薄于产品雄心。公开材料没有提供失效率、MTBF 或出动成功率统计，除 K5 KRAKEN 按 MCA WBC3 编码这类孤立表述外， 认证语言也很少。相较 Saildrone
              这类同行——它公开续航、ABS 入级里程碑和特定任务能力页面——Kraken 的信任证据有希望，
              但量化成熟度较低。尽调的关键问题不是平台是否有意思——它们确实有——而是可靠性、安全性和可支持性是否和路线图叙事进展得一样快。
              强尽调应聚焦证据：架构能否承受真实操作者节奏，而不只是功能集在纸面上显得差异化。Kraken 跨伙伴和地区扩张得越多， 证明负担越重。每增加一个伙伴地点和任务画像，证据负担都会上升。
