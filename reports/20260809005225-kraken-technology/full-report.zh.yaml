      - number: '1.2'
        title: 领导层、治理与创始人依赖
        blocks:
          - type: paragraph
            body: >-
              创始人兼 CEO Mal Crease 仍是 Kraken 战略的公众面孔，现有证据显示，创始人 - 市场匹配是公司故事的核心。 投资者和媒体稿件反复引用 Crease 对 NATO
              需求、制造扩张和产品理念的表述；官方页面则把 Kraken 的工程身份与离岸赛艇传统和复合材料船艇设计联系起来。 2026 年，Kraken 扩充了高管梯队，任命 Amelia Gould
              为首席技术官、Justin Litko 为 Kraken Technology US 首席执行官； 后者明确服务 Anduril 合作与 USSOCOM
              项目之后的美国本土扩张。治理支持也在通过顾问模式扩展：Kraken 宣布三位美国国家安全领域资深人士加入顾问委员会， 并在前海军少将 James Parkin 于 2025
              年从英国皇家海军退役后单独突出其顾问角色。即便如此，公开报道仍未披露完整法定董事会构成或投资者控制图谱， 因此关键人集中度仍有分量，应在管理层访谈中复核。治理层面同样如此：顾问深度提升快于正式披露。实际效果是，
              投资者可能先从公司周围的名字获得安慰，却还看不到完整的控制机制、信息权或董事会委员会安排。
