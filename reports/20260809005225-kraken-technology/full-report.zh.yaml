chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与平台范围
        blocks:
          - type: paragraph
            body: >-
              Kraken Technology Group 自称是一家由英国创始人创立的海上防务公司，专注面向濒海、水面和水下任务的模块化无人系统。 主投方公告披露公司总部在英国
              Fareham；独立摘要则有时称其为英国创立、位于 Fareham 或位于伦敦， 说明公司运营重心在英国，但媒体对城市标签的写法并不一致。公司的使命围绕「敏捷、多能、坚韧」的自主海上能力，
              服务快速变化的作战需求；商业身份绑定的是加固、任务就绪的平台，而不是纯软件。公开产品页描述了三条核心产品线：K3 SCOUT 面向高速水面任务， K4 MANTA 面向混合水面 - 水下作业，K5 KRAKEN
              面向更高载荷、长航程的水面任务。公开网站也分成两块： 一个极简的 krakentechnologygroup.com 落地页，以及内容更完整的
              krakentechnology.com，后者承载本报告使用的使命、平台和公告档案。 网站割裂在运营上也重要：投资者、合作伙伴和客户都被导向同一套防务就绪叙事，但公开公司外壳仍相对单薄。
              快速扩张的防务初创公司常见这种情况；也因此，尽调应优先做来源交叉验证，而不是押注任何一个落地页。
