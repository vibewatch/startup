          - type: paragraph
            body: >-
              架构故事模块化，也很务实。Kraken 页面描述了面向自主能力的开放接口、按任务配置的载荷舱、多种操作模式（从监督式自主到远程驾驶）， 以及与传统通信和指挥系统的兼容性。K3 SCOUT 和 K4 MANTA
              都提到 Auterion 操作系统，K5 KRAKEN 则提到 PX4 和面向自主能力的开放接口，
              说明公司更倾向于借助成熟自主工具，而不是封闭黑盒。运营模式围绕部署、集成、操作、适配和规模化建立。每个产品页都重复这套顺序， 并把可制造性和标准化部件当成设计系统的一部分。结果是，Kraken
              的技术护城河可能和船体设计、系统集成、任务重构同样相关， 不只在某个单一软件模块里。这也意味着现场可靠性和人在环上控制是产品接受度的核心，尤其是在争夺环境或高海况中。
              该架构有吸引力，恰恰因为操作逻辑清楚。买方能看见自主能力在哪里结束、人类控制在哪里保留、制造纪律又必须在哪里把设计雄心转化为可重复现场表现。
              它也给出更清楚的尽调路径：检查接口、载荷更换、测试数据和支持流程，而不是只依赖营销标题。路径很清楚。
