      - number: '8.4'
        title: 可比公司组与情景桥
        blocks:
          - type: paragraph
            body: >-
              最合适的可比框架是私营防务自主，而不是只看上市工业公司。Saronic 2026 年 3 月估值 $9.25 billion 的 Series D、Shield AI 2026 年 3 月 $12.7
              billion 估值、Mach Industries 2026 年 $1.8 billion 融资、Anduril 2026 年 $5 billion Series H，以及 Helsing 的 $18
              billion 融资，都说明投资人愿意为任务相关自主能力、制造产能或战略防务软硬件支付很高溢价。因此，在板块语境里，Kraken 的 $1 billion
              估值并不疯狂；甚至更接近当前高溢价防务同业组的低端。但这不等于便宜。上述若干同业披露过更大规模融资、更宽的平台野心、更深的美国项目准入，或更外延的防务科技叙事。Kraken
              因此应该按情景桥估值，而不是简单羡慕同业倍数。牛市情景下，标杆客户转化为多项目舰队，主权生产规模化。基准情景下，当前轮次大致公允。熊市情景下，偏原型的需求和单薄的利润率可见度会导向持平轮或降估值融资。
