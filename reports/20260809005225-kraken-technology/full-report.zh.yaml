  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用客户工作流理解平台家族
        blocks:
          - type: paragraph
            body: >-
              Kraken 的产品组合按家族组织，而不是一次性艇体。K3 SCOUT 是核心高速水面平台，服务海上态势感知、兵力保护、 后勤和精确打击角色；K4 MANTA 将产品线延伸到混合水面 -
              水下作业，用于隐蔽投送、侦察和徘徊；K5 KRAKEN 则推向更高载荷、 更长航程的打击、ASW 和多域任务。按客户工作流看，Kraken 试图嵌入任务链：部署和投送、远程或监督式自主操作、载荷执行、
              回收或保障。这很重要，因为技术命题不只是「自主能力」，而是把自主能力包进可部署艇体、模块化任务套件和能适配传统指挥控制结构的接口里。 公开材料一贯把快速改任务、空 / 陆 /
              海运输性和系统之系统集成描述为产品价值主张，而不只是原始速度或载荷。 这也意味着买方承销的是工作流压缩：发射约束更少、人员暴露更低，操作者需要短时间更换载荷或任务时，任务适配更快。
              工作流框架很重要，因为多数防务客户买的是结果和集成信心，不会单独购买抽象的自主能力声明。整体如此。
