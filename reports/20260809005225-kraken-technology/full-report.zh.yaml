            body: >-
              正确的风险结论不是 Kraken 不能投，而是举证责任要从叙事转向运营控制。公开缓释因素确实存在。Royal Navy 和 USSOCOM 的具名接触表明，严肃客户已经检验过 Kraken
              的可信度。主权资本和防务对齐投资人也压低了一部分融资与政策摩擦风险。公开平台页面还强调人在回路控制、模块化和按任务设计，而不是完全不受约束的自主叙事。但这些缓释因素还不够；尽调必须先核实出口筛查流程由谁负责、合作伙伴
              QA
              如何治理、可靠性数据是否扎实，以及项目集中度。击穿投资假设的触发器因此都可以量化：出口管制或安全流程存在弱点；原型和试验平台无法转成稳定项目；跨场地合作伙伴质量漂移；预算驱动的授标一再滑坡；或私有数据室仍拿不出续约、事故和利润率证据。Kraken
              大概率能消化孤立摩擦；如果几条风险线同时叠加，就会吃力。因此，即便战略叙事很强，剩余评级仍应保持高位。
