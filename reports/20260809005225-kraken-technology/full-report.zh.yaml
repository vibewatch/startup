  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点与初步判断
        blocks:
          - type: paragraph
            body: >-
              2026 年 7 月，DTCP 与多家后续媒体报道 Kraken 完成 $175 million Series B，估值 $1
              billion，正式跨过独角兽门槛。这个融资锚点足够重要：领投方具名，防务导向的投资财团有辨识度，英国和国际媒体也交叉印证。资金用途也说得通，指向能力开发和国际制造扩张，而不是泛泛的 AI
              故事。问题不在这轮融资是否发生；它显然已经发生。问题在于，公开记录仍没有给出外部投资人判断轮次价格是否有吸引力所需的财务包，而不只是看起来合理。已审阅的公开来源没有披露收入、ARR、毛利率、现金续航
              测算、优先权栈或客户集中度表。基于这一点，建议应维持「继续研究」，置信度维持中等，风险维持高位，估值立场应是偏拉伸，而不是明显便宜。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
