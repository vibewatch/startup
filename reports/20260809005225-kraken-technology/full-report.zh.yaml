      - number: '2.2'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方图谱也比典型商业自主化故事更专门。买方通常是国防部、海军、特种作战组织和海上安全机构，它们控制采购或紧急作战预算；
              用户是需要以更低人员风险获得持续感知、后勤、警戒或临近打击能力的舰队指挥官、操作者和任务规划者。因此，付款方是政府机构，
              即便产业伙伴或融资方能帮助加速部署。英国皇家海军和盟友评论显示，需求正由混合舰队思路拉动：无人系统预期会增强护卫舰能力、
              支持水雷和咽喉要道作业，并让指挥官在海上获得更长久在线能力。采用路径通常从演示、试验或原型活动开始，再进入由操作者支持的演习、 有限作战部署，最终走向采购或系列化生产。Kraken 2025-2026
              年公开记录——DSEI 演示、SOF Week 演示、Hormuz 相关报道、 英国皇家海军支持的空投和 USSOCOM OTA——与这条路径高度吻合。对市场章节而言，这很重要，因为它说明采用门槛不在原始好奇心，
              而在机构信任、集成负担和任务验证。换句话说，需求形成已经可见，但预算转化仍是顺序推进、证据密集的过程。
