  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律敞口
        blocks:
          - type: paragraph
            body: >-
              Kraken 的监管负担比典型英国初创公司更重，因为产品、客户、投资者和制造足迹都触及敏感防务制度。
              英国战略出口管制明确适用于货物、软件和技术，并涉及许可、最终用途管制、制裁、处罚和罚款。英国《国家安全与投资法》 为涉及敏感国家安全能力的交易审查提供法律背景。在美国一侧，Kraken 与 USSOCOM
              的关系以及更广泛美国工业雄心， 指向 ITAR 和其他出口管制规则敞口，即便公开来源尚未显示详细合规架构。实际风险不是 Kraken 被指控违反这些规则；
              保留来源没有显示这一点。风险在于，每一次跨境载荷、软件更新、数据流、投资者权利或本地生产安排，
              可能都需要比公司公开表面暗示更多的出口筛查和法律流程。公司正在盟友司法辖区间快速增长，流程成熟度几乎和技术能力同样重要。
