      - number: '3.3'
        title: 护城河耐久性、切换成本与被替代风险
        blocks:
          - type: paragraph
            body: >-
              Kraken 的护城河可信，但还谈不上舒服。最强的公开优势是模块化家族架构、高速濒海聚焦，以及与 Rheinmetall、Anduril、 Davie
              等能满足本地生产和采购偏好的产业节点建立的可见合作关系。在主权和产业政策与纯技术实力同样重要的防务市场，这些资产不轻。 但护城河也高度依赖执行。Anduril 和 Saronic
              等美国本土冠军拥有更深的本土客户拉力；Saildrone 拥有更可见的海上续航验证； 如果买方想要资产负债表安全感，Lockheed 或 Rheinmetall
              这类主承包商能吸收更多项目复杂性。一旦舰队、自主技术栈、载荷适配和支持链被选定， 切换成本会很高；但在此之前，多供应商并行和竞争性比测试仍然可能。最可能的结果是市场碎片化：Kraken 可以拿下重要口袋，
              尤其是在盟友高速海上自主化领域，但价格压力、本土偏向规则和主承包商主导的捕获会持续构成风险。因此， 投资者应把竞争成功理解为项目捕获加经济留存，而不只是可见度或伙伴数量。换个说法，市场可能先奖励 Kraken
              相关性，再奖励它主导地位。 相关性与主导地位之间的落差，正是经济性被稀释、合作伙伴依赖和采购驱动价格压力可能出现的地方，而且影响可能相当实质。
