  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与牵引力代理指标
        blocks:
          - type: paragraph
            body: >-
              Kraken 的公开材料指向合同驱动的硬件与集成模式，而不是纯软件业务。产品和能力页面强调完整任务系统：模块化艇体、自主能力、
              载荷集成，以及嵌入操作者工作流的部署。融资和伙伴公告反复描述公司会继续开发无人水面艇和载荷能力， 这意味着变现来自项目授予、平台交付、任务包集成以及后续支持或保障。最强的公开收入代理指标不是 ARR 或订阅数据，
              而是操作者活动和合同证据，尤其是 $49 million USSOCOM OTA，以及公司反复提到的英国国防部和 NATO 相关项目。
              这说明公开牵引力存在，但以采购为中心。投资者能观察到需求信号，却仍看不到已签约收入、收入确认节奏，或价值有多少落在硬件、 软件、集成、支持或伙伴转付经济性上。没有价格披露也意味着投资者无法判断 Kraken
              是凭性能取胜、凭战略紧迫性取胜， 还是只是用较低早期利润率换取标杆项目。在防务硬件业务里，这些情形对后续现金生成的含义完全不同。因此， 收入质量评估仍是临时判断，单靠公开证据还不足以投入投资。这个限制是实质性的。
