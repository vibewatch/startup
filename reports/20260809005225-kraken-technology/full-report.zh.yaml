      - number: '6.3'
        title: 耐久性、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              耐久性是 Kraken 公开客户图景明显变薄的地方。保留的公开来源没有披露活跃客户数、NRR、GRR、流失率、续约率、合同期限、
              头部客户收入占比或部署后满意度指标。这不会否定已经在案的客户证据，但意味着投资者还无法判断 Kraken 是否已把早期战略胜利转化为可重复的装机基础业务。 最可能的扩张路径，是在 NATO
              阵营海军和特种作战群体中先落地再扩张：英国皇家海军验证可以播种更广泛英国舰队使用， USSOCOM 可以为更多美国操作者验证概念，参与盟友演习则有助于 Kraken
              与德国、美国和加拿大伙伴推进本地化生产。抵消项是集中度风险。 公开证据仍聚集在少数政府锚点，多项来源描述的是测试床、原型或潜在作战首秀，而不是多年生产续约。这意味着 Kraken 的客户结论在标杆质量上为正，
              但在集中度、采购时点和留存可见度上仍是高风险。投资者应把客户质量和客户广度分开看。以公司年龄看， Kraken
              似乎已经赢得了异常有价值的标杆账户；但公开记录仍留下一个问题：这些标杆究竟是一条持久舰队业务的最初节点， 还是一组更窄、战略价值高但节奏不平滑的项目。
