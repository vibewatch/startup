      - number: '8.2'
        title: 支撑价格的因素
        blocks:
          - type: paragraph
            body: >-
              $1 billion 标记背后有真实证据。Kraken 不是还没客户的概念公司。Royal Navy 已公开宣布一笔 £12.3 million、20 艘无人艇订单，USSOCOM 也被公开关联到一份最高 $49
              million 的 OTA，用于快速开发和原型验证。公司还从 British Business Bank、NATO
              关联资本来源和防务工业伙伴获得主权与战略资本，这让本轮融资比单纯动量加价更有政策和工业分量。公开产品和部署证据显示，Kraken
              在模块化海事自主领域追求一个资本密集但战略上有意义的位置，并在多个盟国司法辖区铺设制造路径。分析师市场数据来源也支持自主海军和自主船舶市场正在扩张，这解释了投资人为什么可能在当前披露之前先付溢价。简言之，这个价格有真实战略支撑：具名客户、工业价值，以及当下奖励可信防务自主平台的市场。即便公开基本面只部分支撑了估值，估值本身也并非随意定价。
            claimRefs:
