      - number: '7.2'
        title: 自主能力可靠性、安全与认证负担
        blocks:
          - type: paragraph
            body: >-
              Kraken 第二大风险簇是运营与技术：公众热度已经跑在公开可靠性披露前面。公司把 K3、K4 和 K5 营销到水面巡逻、后勤、 隐蔽投送、兵力保护以及打击或 ASW
              角色，这意味着舰队必须在非常不同的环境和任务条件下工作。与此同时，监管背景正在更正式化。 Workboat Code 第 3 版自 2023 年 12 月起适用于新工作艇，IMO 于 2026 年 5 月通过
              MASS Code 并于 2026 年 7 月生效， LR 和 ABS 等入级及保证机构则从验证、测试、完整性和合规角度框定自主能力。Kraken 有一些正面证据——英国皇家海军支持的试验、
              点名客户，以及至少一处公开提到 K5 按 WBC3 编码——但保留的公开来源仍未提供 MTBF、出动成功率、事故日志或组合层面的认证深度。
              这个缺口重要，因为自主海上系统一旦出现导航、通信或载荷故障，运营后果会很严峻。在 Kraken 打开测试数据和安全论证之前， 可靠性仍是真实的投资命题风险，而不是已解决的营销点。
