companyProfile:
  summary: >-
    Kraken Technology 是一家由英国创始人创立的海上防务初创公司，Mal Crease 于 2020 年创办；DTCP 描述其总部位于英国 Fareham。 公司打造一组模块化自主海上平台，包括 K3 SCOUT
    水面艇、K4 MANTA 混合水面 - 水下航行器，以及更大的 K5 KRAKEN 任务平台。 对一家私营防务硬件公司而言，公开客户验证已经有分量：公司拿到英国皇家海军 20 艘艇的点名订单，以及上限最高 $49 million 的
    USSOCOM OTA； 同时在德国、美国和加拿大建立盟友制造关系。Kraken 于 2026 年 7 月以 $1 billion 估值完成 $175 million Series B 轮，
    但公开资料仍未披露收入、利润率、留存、合作伙伴经济分配和融资条款等细节，战略牵引力还不能顺畅转化成高确信度的投资判断。
