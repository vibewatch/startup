  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 买方分层与采购表面
        blocks:
          - type: paragraph
            body: >-
              Kraken 销售进入的是一套防务采购体系，买方、用户、付款方和部署赞助方往往是不同组织。最强、且能直接归因的客户段是英国国防部和英国皇家海军； 2026 年 3 月 Project Beehive
              奖项披露了点名合同金额、舰队数量，以及 Coastal Forces Squadron 和 47 Commando Royal Marines 这些点名操作用户。 第二个客户段是美国特种作战领域，USSOCOM
              向 Kraken 授予一项 OTA，用于下一代无人水面和水下航行器的快速开发与原型化。 第三个客户段是通过演习、演示和主权制造伙伴触达的 NATO 及盟友海上操作者。公开产品页还显示，Kraken
              为海军巡逻、后勤、兵力保护、 隐蔽投送以及打击或 ASW 角色设计了不同任务画像，这意味着客户段图谱覆盖海军水面部队、突击队和特种作战用户，而不是单一同质客户账本。
              这很重要，因为采购路径本身就是产品的一部分。Kraken 的客户牵引力离不开任务紧迫性、原型授权和主权舰队现代化议程， 而不是标准目录销售。实际含义是，Kraken
              销售进入的组织，对条令适配、部署节奏和主权控制的重视不亚于平台规格。 即便技术兴趣真实，这通常也会拉长从兴趣到规模收入的路径。
