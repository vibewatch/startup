      - number: '1.3'
        title: 资本、合同与产业规模化
        blocks:
          - type: paragraph
            body: >-
              Kraken 的 2026 年 7 月 Series B 轮是当前公开资料中最关键的公司里程碑。DTCP 称其领投了一轮 $175 million 融资， 估值 $1 billion，British
              Business Bank、NATO Innovation Fund、Rheinmetall、Inocea Group 以及数家欧洲风投参与； NSSIF、SmartCap、Notion Capital 和
              Speedinvest 等早期支持者则把此前头寸转换为股权。管理层和投资者把这笔资金定义为两个相互绑定目标的燃料： 继续开发载荷与平台，并在盟友地区快速建设本地化制造能力。规模化故事并非停留在理论上。Kraken
              及其伙伴已宣布与德国 Rheinmetall、 美国 Anduril、加拿大 Davie 和德国 NVL 建立生产或集成关系；随后 Naval News 和 Rheinmetall 报道，K3 SCOUT
              已在汉堡启动系列化生产。 公开需求信号也从概念走向与操作者绑定的项目。Kraken 引用英国国防部、NATO 欧洲伙伴和 USSOCOM 合同； 官方与独立报道则把公司与 $49 million USSOCOM
              OTA、K4 MANTA 在 SOF Week 的演示、K3 SCOUT 围绕 Hormuz 的英国皇家海军相关部署， 以及英国皇家海军支持的 USV
              空投试验联系起来。主要未解问题仍是披露深度：市场已经看到清晰的资本和合作伙伴验证， 但仍缺少收入、利润率、员工数和客户数透明度。
