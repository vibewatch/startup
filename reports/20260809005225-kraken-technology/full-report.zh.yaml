      - number: '2.3'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              正向需求逻辑很强。冲突驱动的海上不安全，尤其是 Hormuz 这类咽喉要道周边的风险，抬高了持续无人感知和兵力保护的价值。 盟友海军现代化越来越强调分布式作战、有人 -
              无人协同，以及成本更低的海上规模，这有利于能快速交付模块化系统的公司。 投资者胃口也仍然强劲：Landbase 称 2025 年国防科技融资达到创纪录的 $49.1 billion，Kraken 自己的
              Series B 轮也显示， 只要有操作者验证和产业化潜力，投资者愿意专门下注海上自主化。但采用约束同样真实。防务采购仍然慢、项目化且受政治调节；
              对自主系统的信任取决于通信韧性、避碰、交战规则和人在环上控制；出口管制和主权要求会让跨境制造模式复杂化； 许多市场报告衡量的是邻近板块，而不是 Kraken
              服务的精确窄切片。因此，市场有吸引力，但并不顺滑。Kraken 能否把战略兴趣转化为持久生产收入， 取决于它能否比同行更快跨过这些机构门槛，同时在恶劣海况、通信受争夺的环境中守住可靠性。约束不会否定机会，
              但如果供应商不能证明运营可靠性和采购适配度，收入兑现就会落后于热度周期。
