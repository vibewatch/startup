      - number: '4.3'
        title: 关于收入质量、利润率路径与披露缺口的财务结论
        blocks:
          - type: paragraph
            body: >-
              因此，财务结论是喜忧参半。Kraken 当前阶段的资本化很强，投资者基础混合了战略、政策和风险资本，能够支持采购耐心和产业建设。
              如果公司把现有操作者验证转化为重复生产订单，并附带支持收入，收入质量可能有吸引力；但这仍是假设，不是已被公开证明的事实。
              风险在于，估值和制造雄心目前远比毛利率、现金转化或类似软件的经常性经济性更可见。公开证据还显示， 客户集中仍高度围绕政府和盟友防务项目，这可能造成订单节奏不平滑和营运资本压力。在 Kraken
              打开收入、烧钱、积压订单和合同结构的数据室之前， 正确立场是把财务实力视为已有资金支持的选择权，而不是已证明的运营效率。这足以支撑战略兴趣，但没有管理层披露，
              还不足以承销精细化价格判断。换句话说，今天的财务案例建立在资产负债表支持和战略定位上，经营案例仍取决于尽调访问。
              这种落差在防务初创公司里常见，但在这里更重要：如果项目转化滞后，本地化制造会很快消耗资本，当下尤其如此。
