        title: 成本结构、资本强度与资本充足性
        blocks:
          - type: paragraph
            body: >-
              公开资料中的一切都说明 Kraken 资本强度高。公司制造实体艇体、集成载荷，并与 Rheinmetall、Anduril 和 Davie 建设本地化产能， 而不是交付轻量软件产品。K3 SCOUT、K4
              MANTA 和 K5 KRAKEN 的规格都意味着可观的物料清单、测试、物流和支持义务； 能力页还增加了任务角色，抬高载荷、验证和认证负担。2026 年 7 月 Series B 轮以 $1 billion
              估值新增 $175 million， 显著改善资本充足性；管理层明确表示，资金将支持产品开发和国际制造扩张。但公开证据没有披露烧钱速度、账上现金、库存需求、 债务义务或可支撑月份数。最合理的解读是，Kraken
              有足够资本资助下一阶段产业化，但公开披露不足以判断这笔资本相对于其生产雄心是保守、 吃紧，还是激进乐观。Companies House 文件进一步说明 Kraken
              是一家活跃的私人有限公司，近期有账目、股本事件和证券决议； 但这些文件仍无法提供建模烧钱或利润率所需的管理层级经营指标。公开层面，只剩注册轨迹，没有完整经营仪表盘。
