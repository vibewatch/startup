callouts:
- calloutType: strength
  title: Rapid capital formation with strategic backers
  body: Kraken reached unicorn status on the back of a syndicate that mixes financial investors, NATO-linked capital, and industrial partners. That blend is unusually helpful for a defence hardware company because it can unlock both funding and manufacturing access.
  claimRefs:
  - CO017
  - CO018
  - CO019
  - CO022
- calloutType: strength
  title: Product family already spans surface and subsurface missions
  body: The company is not presenting a single prototype. Public platform pages show a family approach, from K3 SCOUT for force protection and logistics through K4 MANTA for covert subsurface roles and K5 KRAKEN for higher-endurance strike and ASW missions.
  claimRefs:
  - CO006
  - CO007
  - CO008
  - CO009
  - CO037
  - CO038
  - CO039
- calloutType: risk
  title: Disclosure is still thin relative to the valuation
  body: Investors and media confirm the $1 billion valuation, but the public evidence set still omits revenue, headcount, customer count, and margin data. That limits confidence in near-term commercial scale despite strong partner proof.
  claimRefs:
  - CO017
  - CO018
  - CO033
  - CO035
- calloutType: risk
  title: Execution is tied to procurement and geopolitical hotspots
  body: Kraken’s strongest public customer proof comes from defence operators and conflict-adjacent deployments, including Hormuz-related reporting and special-operations programmes. That creates relevance, but it also ties momentum to procurement cycles and escalatory theatres.
  claimRefs:
  - CO021
  - CO027
  - CO028
  - CO036
