  topStrengths:
    - 作为一家私营海上防务硬件公司，Kraken 的公开证据罕见地扎实：Royal Navy 订单、公开提到的 USSOCOM OTA，以及盟友产能扩张都可核验。
    - 产品族不是概念稿，而是贴着任务展开，覆盖模块化水面与水下自主用例，能映射到真实防务流程。
    - 投资人与合作伙伴同时包含风险资本、主权和工业侧资源，采购可信度和国际扩张选项都更强。
    - 战略海上自主赛道正吸引溢价资本，若当前标杆客户转化顺利，Kraken 有真实期权价值。
  topRisks:
    - $1 billion 估值很难靠公开证据审计，因为收入、毛利率、积压订单质量、留存、融资条款和合作伙伴经济性都未披露。
    - 客户和收入似乎集中在少数主权防务锚点上，公开采用叙事里仍有一部分更像试验床、原型或早期部署。
    - 业务看起来重硬件、重集成；若价值捕获或转化不及预期，资本消耗会更大，倍数也可能低于软件式经常性模型。
    - 跨境出口管制、认证和合作伙伴 QA 要求可能拖慢项目转化；若 Kraken 内部流程不如叙事成熟，估值支撑会被侵蚀。
  unresolvedGaps:
    - 已确认收入、积压订单、毛利率和平台级单位经济性未公开披露。
    - 公开来源看不到续约行为、期权执行历史、按金额计的头部客户集中度，或持续舰队利用率指标。
    - Series B 清算优先权、反稀释 / 调整条款、债务叠加和治理权仍不在公开记录内。
    - 出口管制流程归属、合作伙伴 QA 治理，以及细化的可靠性或事故证据仍是尽调项，而非公开事实。
