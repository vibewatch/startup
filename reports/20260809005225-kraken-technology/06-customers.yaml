tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public proof
  - Strategic value
  - Main gap
  rows:
  - - UK Ministry of Defence / Royal Navy surface forces
    - Buyer/payer = UK MOD; users = Coastal Forces Squadron and Royal Navy operators
    - Hybrid-fleet experimentation, training, tactical development, maritime security
    - Named £12.3m contract for 20 boats under Project Beehive
    - Best public proof of paid demand with quantity and contract value
    - No public follow-on order cadence, utilization rate, or renewal terms
  - - 47 Commando Royal Marines
    - Buyer/payer = UK MOD; users = littoral and commando units
    - Rapid insertion, force protection, and future autonomous littoral operations
    - Royal Navy announcement names 47 Commando as a user and later supported K3 airdrop trials
    - Creates high-value frontline reference for expeditionary use cases
    - Public sources do not disclose deployment scale beyond trials and initial procurement
  - - USSOCOM / U.S. special operations maritime users
    - Buyer/payer = USSOCOM; users = special operations maritime teams
    - Rapid development of USV/UUV capability for ISR, logistics, and contested littorals
    - Named OTA up to $49m with prototyping scope
    - Strong strategic reference in the U.S. market and operator-led product shaping
    - OTA is not the same as disclosed production conversion or recurring program revenue
  - - NATO and allied maritime operators
    - Buyer/user/payer vary by member state or exercise sponsor
    - Interoperability testing, awareness, and hybrid-fleet experimentation
    - Task Force-X (Baltic) participation and allied demand cited in funding announcements
    - Can widen reference quality beyond bilateral UK/U.S. proof
    - Exercise participation is weaker than named procurement awards
  - - Allied sovereign-production channels
    - Buyer = allied defense establishments through local industrial routes; users = navy and defense operators
    - Localized procurement and industrial participation
    - Rheinmetall, Anduril, and Davie partnerships support route-to-market in Germany, the U.S., and Canada
    - May lower adoption friction where sovereign build capacity matters
    - Partners are channels and enablers, not proof of diversified paying end customers yet
  notes: Segmentation separates direct government buyers from allied exercise users and production channels. Public proof is strongest where a named government customer, quantity, and mission context are all visible.
