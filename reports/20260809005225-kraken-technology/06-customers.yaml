- id: named-customer-proof-and-adoption-trajectory
  title: Named customer proof and adoption trajectory
  body: 'The customer proof is materially stronger than logo marketing, but it is still uneven in maturity. Royal Navy evidence is the deepest because it includes an announced £12.3 million contract for 20 uncrewed boats, named end-user organizations, and later public proof of a Royal Navy-supported K3 SCOUT airdrop trial. USSOCOM proof is also meaningful because the OTA cap is large and multiple independent outlets describe a rapid-development path shaped around special-operations requirements, but the public record still frames the work as prototyping rather than as an announced production fleet order. NATO and allied proof exists through Task Force-X participation, sovereign-manufacturing announcements, and funding narratives that cite allied defense demand, yet it is thinner on named purchase orders or steady-state fleet utilization. Kraken’s own news surface adds a stronger but less independently verifiable claim that systems are already deployed in ongoing conflicts. The adoption story
    is therefore credible but phase-specific: real contracts and operator touchpoints exist, while broad denominator metrics such as active fleet size, sortie tempo, renewal timing, and utilization remain undisclosed. Another way to frame the adoption curve is that Kraken already has enough customer proof to matter strategically, but not enough recurring-use disclosure to model a stable installed base. The chapter therefore treats named contract evidence as strong while still discounting claims that lack denominators or repeat-use disclosure.'
