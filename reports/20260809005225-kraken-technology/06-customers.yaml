chapter:
  number: 6
  title: Customers
  summary: Kraken has real named defense-customer proof, but it is concentrated in UK and U.S. government buyers and still skews toward prototyping, testbeds, and operational demonstrations rather than publicly disclosed recurring fleetwide production. The best public customer evidence is the Royal Navy’s £12.3 million 20-boat award and USSOCOM’s up-to-$49 million OTA; the biggest customer-side gap is the absence of renewal, utilization, or concentration metrics.
sections:
- id: buyer-segments-and-procurement-surface
  title: Buyer segments and procurement surface
  body: Kraken sells into a defense buying system where the buyer, user, payer, and deployment sponsor are often different organizations. The strongest directly attributable segment is the UK Ministry of Defence and Royal Navy, where the March 2026 Project Beehive award identifies a named contract value, a fleet quantity, and named operating users in the Coastal Forces Squadron and 47 Commando Royal Marines. A second segment is U.S. special operations, where USSOCOM awarded Kraken an OTA for rapid development and prototyping of next-generation uncrewed surface and subsurface vessels. A third segment is NATO and allied maritime operators reached through exercises, demonstrations, and sovereign-manufacturing partnerships. Public product pages also show Kraken designing separate mission profiles for naval patrol, logistics, force protection, covert insertion, and strike or ASW roles, which implies a segment map spanning navy surface forces, commandos, and special operations users rather than
    a single homogeneous customer book. This matters because procurement path is part of the product. Kraken’s customer traction is inseparable from mission urgency, prototyping authorities, and sovereign fleet modernization agendas rather than from standardized catalog sales. A practical implication is that Kraken is selling into organizations that care as much about doctrine fit, deployment tempo, and sovereign control as they do about platform specifications. That usually lengthens the path from interest to scaled revenue even when technical interest is genuine.
