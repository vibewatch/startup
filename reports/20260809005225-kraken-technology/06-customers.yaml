    - 'Mixed: paid procurement with testbed framing'
    - Best named proof of real adoption with value and unit count
    - Public evidence still frames boats as testbeds for future hybrid-fleet operations
  - - 47 Commando Royal Marines
    - Direct government user inside UK MOD
    - Future autonomous littoral and commando missions plus airdrop experimentation
    - Pilot-to-early-fielding
    - Named frontline user plus Royal Navy-supported insertion trial
    - No public contract line item or utilization cadence for this sub-user
  - - USSOCOM
    - Direct government customer
    - Rapid development and prototyping of novel USV and UUV technologies
    - Prototype / OTA phase
    - Large U.S. customer reference and operator-shaped roadmap signal
    - Public sources do not disclose production follow-on, renewal, or deployed fleet size
  - - NATO Task Force-X (Baltic) participant users
    - Alliance exercise user set
    - Exercise participation and allied evaluation
    - Pilot / exercise
    - Shows interoperability relevance beyond one-country demand
    - No named procurement award, contract value, or sustained-use metric disclosed
  notes: Named proof is strongest where the source names a customer, use case, and program stage. Public proof remains better on early adoption than on long-duration production maturity.
