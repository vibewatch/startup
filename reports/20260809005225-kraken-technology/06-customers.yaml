  title: Named customer proof table
  columns:
  - Customer / user
  - Segment
  - Deployment / use case
  - Production vs. pilot
  - Outcome or signal
  - Limitation
  rows:
  - - Royal Navy / Coastal Forces Squadron
    - Direct government customer
