companyProfile:
  summary: >-
    Fal is a San Francisco-based generative media inference platform founded in 2021 by Burkay Gur and Gorkem Yurtseven.
    It sells hosted model APIs, serverless deployment, and reserved compute for image, video, audio, and 3D workloads,
    and its public materials emphasize enterprise readiness and trust-and-safety controls. The company has scaled
    quickly to a Series D valuation of $4.5B, but the public financial picture remains estimate-driven and internally
    inconsistent across sources.
