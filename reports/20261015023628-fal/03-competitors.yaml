figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >
      Retained public evidence places Fal at the convenience extreme, while programmable infrastructure and
      self-hosting trade speed of adoption for more control and lower steady-state unit economics.
    data:
      xAxis:
        label: Operational control / deployment flexibility
        min: 1
        max: 5
        low: Managed API only
        high: Full infra control
        description: Ordinal score synthesized from retained public evidence.
        scale: ordinal
      yAxis:
        label: Time-to-value for media teams
        min: 1
        max: 5
        low: Heavy platform work
        high: Fastest zero-ops adoption
        description: Ordinal score synthesized from retained public evidence.
        scale: ordinal
      points:
        - label: Fal
          x: 2
          y: 5
          detail: Unified media API, strong catalog breadth, and enterprise-facing onboarding.
        - label: Replicate
          x: 3
          y: 4
          detail: Better docs and community, but less breadth and weaker price position in retained comparisons.
        - label: Modal
          x: 4
          y: 3
          detail: Strong for programmable custom workloads, but requires deployment code and infra ownership.
        - label: RunPod
          x: 4
          y: 2
          detail: Attractive raw GPU economics with more operational and latency variability.
        - label: Baseten
          x: 4
          y: 3
          detail: Production serving features and SLAs, but not the lowest-friction or lowest-cost option in every case.
        - label: Self-hosted H100
          x: 5
          y: 1
          detail: Maximum control and lower sustained image economics, with the highest implementation burden.
    approximationNotes: >
      Ordinal 1-5 coordinates synthesize cited public statements about deployment control, onboarding burden,
      and pricing model trade-offs; they are not direct benchmark outputs.
    claimRefs: [CP007, CP008, CP009, CP010, CP011, CP014]
callouts:
  - calloutType: strength
    title: Fal still sets the convenience benchmark
    body: >
      Across the retained source set, Fal's strongest edge is not raw exclusivity but packaging: one API,
      strong video/image coverage, enterprise-facing procurement, and faster deployment for teams that want a
      managed media stack more than they want infrastructure freedom.
    claimRefs: [CP001, CP002, CP009, CP013]
  - calloutType: risk
    title: The moat weakens as volume and control matter more
    body: >
      The clearest displacement path is selective multi-homing. Once a buyer prioritizes custom deployment,
      easier docs, lower steady-state GPU economics, or reduced lock-in, credible substitutes emerge without
      needing a single rival to match Fal on every dimension.
    claimRefs: [CP008, CP009, CP010, CP011, CP014]
