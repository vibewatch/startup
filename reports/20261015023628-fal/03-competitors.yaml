      - ["RunPod", "Per-hour or per-second infrastructure", "Community A100 $0.69/h; Secure A100 about $1.64/h", "Cheap GPU supply and serverless endpoints", "Preemption and latency variability can be unacceptable for user-facing apps", "Best for budget-sensitive batch or mixed workloads"]
      - ["Baseten", "Per-second inference", "A100 $0.001267/sec", "Managed serving with batching, caching, and production API features", "Savings depend on traffic shape and batching effectiveness", "Best when reliability and serving features matter more than lowest headline rate"]
