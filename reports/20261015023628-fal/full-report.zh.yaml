          - type: paragraph
            body: >-
              可投资的逻辑是，Fal 在生成式媒体基础设施中拥有真实的分发和使用量切入点：Fortune 报道其 2025 年 2 月开发者超过 100
              万，公司也建立了专门的信任与安全职能及执法流程。反向逻辑是，证据质量落后于估值叙事。Multiples 记录 2025 年 12 月收入 $200M，而一份存档的 CompWorth 页面估计约
              $40M；前者明确说明其数值可能是运行率收入或已报告 LTM 收入，因此两者都不应改称 ARR。QuantLogix 只估计 45%-55% 的毛利率区间，并强调 GPU
              成本压力、模型商品化、超大规模云厂商竞争和客户集中度。这些条件意味着，单靠快速扩大收入规模还不够：投资逻辑需要队列留存、客户集中度、合同毛利率和算力承诺，才能证明增长会转化为持久的股权价值。
            claimRefs:
              - CV003
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: 情景与可比逻辑
        blocks:
          - type: paragraph
            body: >-
              情景框架仅把 Multiples 记录的 2025 年 12 月收入 $200M 作为共同分母；它不是经审计收入、ARR 或当前收入。悲观情景采用来源中的 5.0x-5.4x 上市公司参考倍数，对应约
              $1.00B-$1.08B；基准情景采用 Fal 自身报告的 2025 年 7 月至 12 月 15.8x-22.5x 倍数区间，对应约 $3.16B-$4.50B；乐观情景采用来源中的 26.6x-56.0x
              私营公司参考倍数，对应约 $5.32B-$11.20B。这些是敏感性区间，不是公允价值估算：具名可比公司在产品、成熟度、盈利能力和流动性上各不相同，来源池中也没有证据证明这些倍数可直接转用于
              Fal。基准区间的概率信号最强，因为它采用 Fal 自身报告的估值标记；悲观和乐观区间分别是对倍数压缩和异常增长的压力测试。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
      - number: '8.4'
        title: 退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              退出准备度尚未得到证明。QuantLogix 称 Fal 仍为私营公司，且没有公开提交的 S-1；其二级市场观察也缺乏实时买价、卖价或价差。公司可能拥有融资渠道，但现有证据无法证明 IPO
              时间表、可转让流动性或普通股经济性。可作出决策的流程应取得经审计或质量化收益口径的收入、按工作负载拆分的毛利率、客户和模型集中度、已承诺 GPU
              义务、完全摊薄股权结构表、优先股堆叠及全部老股交易条款。投资逻辑的破坏触发条件包括：经核实收入显著低于 $200M 分母；规模化后毛利率仍未脱离估计的 45%-55%
              区间；集中度使某一客户、模型提供商或云对手方变得决定性；或者入场条款隐含的估值高于乐观敏感性区间，却没有相称的经审计增长。积极变化需要经过勾稽的指标和干净的证券条款，而不是又一个标题式融资标记。
            claimRefs:
              - CV003
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.5'
        title: 展品
        blocks:
          - type: callout
            title: 决策
            body: 继续研究。在确定入场价格或目标回报前，要求提供主要股权结构表和融资文件，以及经过勾稽的收入和毛利率证据。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV008
              - CV009
              - CV010
              - CV015
          - type: callout
            title: 不要混同不同的价格标记
            body: 报告的融资估值、模型估算和二级市场点估值拥有不同的发布者、日期、证券和流动性；任何一个都不能替代当前完全摊薄的普通股等价价值。
            calloutType: risk
            claimRefs:
              - CV004
              - CV009
              - CV010
