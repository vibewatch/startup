    title: 公司概况
    sections:
      - number: '1.1'
        title: 基础、身份与创始人匹配度
        blocks:
          - type: paragraph
            body: >-
              Fal 作为一家私营 AI 基础设施公司的公开身份相当清晰：当前官网将其定位为生成式媒体推理平台，开发者可通过一个 API 调用 1,000+ 个模型，在无服务器 GPU 上部署自定义工作负载，或在 GPU
              集群上训练。留存的公司资料将其总部和创立时间分别指向 San Francisco 与 2021 年；创始人履历也持续指向技术运营背景，而非纯财务工程。Burkay Gur 被描述为前 Coinbase
              机器学习负责人，Gorkem Yurtseven 则是前 Amazon 开发者，这支持 Fal
              围绕高吞吐模型服务、开发者工具和基础设施抽象形成创始人与市场匹配度的判断。创始人之下的组织层仍缺乏公开信息：留存证据没有披露独立董事名单、除信任与安全之外的明确职能负责人，也看不出清晰的继任梯队。
