        - Fortune 报道称，截至 2025 年 2 月，开发者已超过 100 万
        - 若队列留存、付费转化和当前活跃开发者证据得到验证，这一逻辑会更有说服力
      - - 投资逻辑
        - 公司正在投入平台治理
        - Fal 表示，公司设有专职信任与安全负责人，并建立了相应执行流程
        - 若独立控制测试和事故指标能把政策落到运营证据上，这一逻辑会得到支撑
      - - 投资逻辑
        - 机构融资反复发生，说明公司仍能获得资本
        - Fal 宣布完成 $140M Series D，投资人包括重要的新老股东
        - 首轮交割文件和当前现金余额将证明实际融资能力
      - - 反向逻辑
        - 收入分母不稳定
        - 公开来源显示，估计值约为 $40M，之后又出现 $200M 的记录值
        - 按期间和收入确认政策编制、并完成 ARR 调节的经审计收入数据，才能填补这一缺口
      - - 反向逻辑
        - 计算经济性可能限制软件式毛利率
        - QuantLogix 估计毛利率区间为 45%-55%
        - 按工作负载拆分的毛利率和承诺容量经济性，将检验经营杠杆
      - - 反向逻辑
        - 竞争与集中度可能压低溢价
        - QuantLogix 指出商品化、超大规模云厂商、GPU 成本压力和客户集中度问题
        - 更加多元的合同收入和持续扩张的毛利率，将削弱这一担忧
    notes: 公司声明只能说明 Fal 自称搭建了哪些东西；这些声明无法独立验证采用质量、控制有效性或财务韧性。
