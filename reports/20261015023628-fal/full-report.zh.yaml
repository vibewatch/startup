        - 增长放缓、利润率承压、公开市场倍数压缩
        - 如果经审计的增长或利润率不及预期，下行信号为中等
      - - 基准
        - 以同一个 $200M 分母，采用 Fal 历史报告中的 15.8x-22.5x 倍数区间
        - 隐含价值 $3.16B-$4.50B；上限与据报的 2025 年 12 月估值相符
