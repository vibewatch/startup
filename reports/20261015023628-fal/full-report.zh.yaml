  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 留存的公开证据将 Fal 放在便利性一端；可编程基础设施和自托管则以更高的采用门槛换取更多控制权和更低的稳态单位经济性。
    data:
      xAxis:
        label: 运营控制 / 部署灵活性
        min: 1
        max: 5
        low: 仅托管 API
        high: 完整基础设施控制
        description: Ordinal score synthesized from retained public evidence.
        scale: ordinal
      yAxis:
        label: 媒体团队的价值实现时间
        min: 1
        max: 5
        low: 大量平台工作
        high: 最快的零运维采用
        description: Ordinal score synthesized from retained public evidence.
        scale: ordinal
      points:
        - label: Fal
          x: 2
          'y': 5
          detail: 统一媒体 API、丰富的目录，以及面向企业的导入支持。
        - label: Replicate
          x: 3
          'y': 4
          detail: 文档和社区更好，但在留存的对比中覆盖广度较弱、价格定位也较差。
        - label: Modal
          x: 4
          'y': 3
          detail: 适合可编程的定制工作负载，但需要编写部署代码并自行负责基础设施。
        - label: RunPod
          x: 4
          'y': 2
          detail: GPU 原始算力的经济性有吸引力，但运营和延迟波动更大。
        - label: Baseten
          x: 4
          'y': 3
          detail: 提供生产服务功能和 SLA，但并非每种情况下摩擦或成本最低的选项。
        - label: 自托管 H100
          x: 5
          'y': 1
          detail: 控制力最大，持续运行下的图像单位经济性更低，但实施负担也最高。
    approximationNotes: 1-5 的序数坐标综合了关于部署控制、上手负担和定价模式取舍的公开引述，不是直接的基准测试结果。
