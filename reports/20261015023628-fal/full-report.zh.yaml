  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 服务市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Fal 自身的公开页面将核心类别定义为生成式媒体基础设施，而不是面向消费者的创意应用或前沿模型实验室。纳入的支出包括模型访问、私有或托管部署、无服务器 GPU，以及在生产环境运行图像、视频、音频和 3D
              工作负载所需的运营工具。因此，最相关的替代方案是自建基础设施、直接使用模型实验室的模型，以及超大规模云厂商的 AI 服务，而不是泛化的 MarTech
              或更宽泛的“AI”软件类别。主要边界风险在于过度外推：公开来源不足以把 Fal 纳入所有生成式 AI 软件或云算力支出；指定市场页面中还有一篇与公司无关的光纤报告，这反而说明仅凭关键词估 TAM
              会夸大公开记录能够支持的范围。
            claimRefs:
