        - 三种信号中最强，因为参考了 Fal 过往自行给出的估值
      - - 乐观
        - 以同一个 $200M 分母，采用 26.6x-56.0x 的私募市场参考区间
        - 隐含价值 $5.32B-$11.20B；没有证券条款和稀释条件，无法计算回报
        - 可比性弱、私募市场流动性不足，且需要靠执行力维持溢价
        - 在经审计的增长和利润率扩张足以支撑异常高倍数前，信号偏弱
    notes: 分析师推导的算术使用 Multiples 的 $200M 记录收入和引用的倍数；这些区间是敏感性分析，不是预测或公允价值，可比对象也并非同类同项。
