              的二级市场点估值。这些不是可以互换的观察值。融资公告不等于可用现金，模型价格不等于交易，缺乏买价、卖价、价差或证券条款的二级市场点估值也不等于当前公司估值。因此，入场纪律要求先取得实际证券价格、完全摊薄股本、清算优先权和经过勾稽的收入口径，再评估回报。在这些材料出示前，估值立场偏高，不能负责任地确定目标回报、持有期或退出倍数。
