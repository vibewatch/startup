figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 留存证据显示，Fal 从成立到 2025 年密集融资期间迅速加速，随后运营规模扩大，并在 2026 年展现出明确的故障与安全应对姿态。
    data:
      items:
        - date: '2021'
          label: 在旧金山成立
          detail: 留存的公司简介来源显示，Fal 成立于 2021 年，旧金山是其总部所在地。
          tone: neutral
        - date: 2022-07
          label: 开始种子融资
          detail: Multiples 称，第一轮融资是 2022 年 7 月完成的 $9M 种子前轮。
          tone: positive
        - date: 2024-09
          label: Series A 建立早期定价基准
          detail: 留存的融资时间表列出一笔 $14M Series A，投后估值约为 $100M。
          tone: positive
        - date: 2025-02
          label: Series B 继续抬升融资阶梯
          detail: 公司简介来源列出由 Notable Capital 领投的 $49M Series B。
          tone: positive
        - date: 2025-07
          label: Series C 将 Fal 推至 $1.5B 估值
          detail: Meritech 领投 $125M Series C，Shopify、Salesforce 和 Google AI Futures Fund 参与战略投资。
          tone: positive
        - date: 2025-12
          label: Series D 将公司估值推至 $4.5B
          detail: Sequoia 领投 $140M Series D；留存的公司简介还称，2025 年 10 月收入超过 $200M，截至 2026 年 8 月汇编时员工数为 80 人。
          tone: positive
        - date: 2026-02
          label: 收入追踪机构的估算趋同于约 $400M 年化收入
          detail: Sacra 和 Clink 都认为，Fal 到 2026 年初的年化收入约为 $400M，但该数字未经审计。
          tone: opportunity
        - date: 2026-08
          label: 正式建立公开信任与安全项目
          detail: Fal 的信任与安全页面介绍了专职团队、来自 TikTok 的负责人，以及与 NCMEC、Thorn、StopNCII 和 OpenAI 内容审核的集成。
          tone: neutral
        - date: '2026-08-27'
          label: 故障复盘指出历史资产受损
          detail: 第三方故障复盘称，8 月 1 日至 26 日生成的历史请求查询和资产可能受损，且未标注解决时间。
          tone: adverse
