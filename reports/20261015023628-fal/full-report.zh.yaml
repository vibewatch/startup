  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 公开证据展示了 Fal 如何把开发者和企业活动转化为按用量计费的收入，但毛利和现金转化仍未披露。
    data:
      nodes:
        - id: demand
          label: 开发者与企业需求
          detail: 公司报告称有 2.5M 名开发者和每日数百万次推理调用
        - id: hosted
          label: 托管模型 API
          detail: 一个 API 覆盖 1,400+ 个图像、视频、音频和 3D 端点
        - id: custom
          label: 无服务器与预留部署
          detail: 客户自有模型、容器和突发容量运行在 Fal 管理的运行时上
        - id: units
          label: 可计费使用单位
          detail: 按图像、百万像素、视频秒数、字符或 GPU 小时计费
        - id: revenue
          label: 按用量计费的收入
          detail: 目录价公开；实际折扣和收入组合未披露
        - id: cost
          label: 云、GPU 与许可成本
          detail: AWS 首选云部署和媒体模型供应意味着可变交付成本
        - id: profit
          label: 毛利与现金跑道
          detail: 公开毛利率、烧钱速度、现金和债务数据仍未披露
      edges:
        - from: demand
          to: hosted
          relationship: 现成模型
        - from: demand
          to: custom
          relationship: 客户自有工作负载
        - from: hosted
          to: units
          relationship: 按输出定价的推理
        - from: custom
          to: units
          relationship: 按计算定价的部署
        - from: units
          to: revenue
          relationship: 计量计费
        - from: revenue
          to: cost
          relationship: 服务交付与模型供应成本
        - from: cost
          to: profit
          relationship: 利润率与现金转化
    approximationNotes: 这张桥接图只呈现结构，不做定量计算：公开来源披露了计费机制和部分目录价，却没有披露确认收入组合、毛利率或烧钱速度。
    claimRefs:
      - CI001
      - CI003
      - CI006
      - CI007
      - CI013
