        title: 收入模式与公开定价
        blocks:
          - type: paragraph
            body: >-
              Fal 的变现方式原生于基础设施，而不是按席位收费。官方推理页面在同一运行时上呈现两类主要商业入口：用于图像、视频、音频和 3D 生成的托管模型
              API，以及面向客户自有模型和容器的无服务器部署。公开定价证据强化了这一框架。Ry Walker 2026 年 6 月的研究笔记列出了模型 API 的单次输出价格和自定义部署的 GPU 小时价格，而 Fal
              官网强调按使用量付费和预留容量，而非订阅套餐。因此，公开证据足以帮助理解计费机制，却不足以评估实际变现质量，因为留存来源没有披露折扣率、企业承诺、收入确认政策或产品线组合。
