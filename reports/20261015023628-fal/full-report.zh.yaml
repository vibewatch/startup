  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Fal 似乎先靠开发者访问切入，再扩展到采购流程更复杂的企业场景；合作伙伴渠道扩大触达，但可靠性决定黏性。
    data:
      nodes:
        - label: 发现模型目录
          tone: neutral
          actor: Developer or creative technologist
          phase: Discovery
          touchpoints:
            - 1,000+ model gallery
            - ChatGPT app install
          note: Fal 广泛的目录和低摩擦集成入口支持自助发现。
        - label: 用 API 工作流做原型
          tone: positive
          actor: Builder or automation team
          phase: Trial
          touchpoints:
            - Fal.run API
            - n8n workflow template
          note: 外部工作流构建者可以在 Fal 之上自动化 2D 转 3D 生成等任务。
        - label: 扩大基础设施容量
          tone: positive
          actor: Product or ML infrastructure team
          phase: Expansion
          touchpoints:
            - Reliability proof
            - More capacity moved
          note: DigitalOcean 的客户页面将更高的容量使用量与可靠性和易用性联系起来。
        - label: 完成企业采购审核
          tone: positive
          actor: Security, IT, and procurement
          phase: Procurement
          touchpoints:
            - SOC 2
            - SSO
            - Private endpoints
            - Usage analytics
          note: 官方页面强调了面向大型企业买家的控制措施。
        - label: 增加渠道杠杆
          tone: warning
          actor: Cloud and enterprise partner teams
          phase: Distribution
          touchpoints:
            - AWS preferred-cloud-provider claim
            - Custom enterprise credits
          note: 合作伙伴渠道可能扩大触达，但公开证据没有显示经济性或集中度。
        - label: 证明高负载下的耐久性
          tone: risk
          actor: Existing customer accounts
          phase: Retention
          touchpoints:
            - Outage recap
            - Missing churn metrics
          note: 可靠性事故和缺失的留存数据意味着耐久性尚未得到充分验证。
