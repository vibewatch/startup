        title: 资本充足性与投资判断障碍
        blocks:
          - type: paragraph
            body: >-
              Fal 的融资势头清晰可见，但资本充足性并不透明。Business Wire 称 Fal 累计融资 $300M，且最近一轮 Series D 估值为 $4.5B；Multiples 则记录 2025 年 12
              月收入 $200M 和 22.5 倍收入倍数。这些数据点单独看足以支持高增长叙事，但 Compworth
              对同一公司的收入、估值和累计融资给出了低得多的估算。若没有管理层材料，这种差异使第三方财务基线过于不稳定，无法锚定投资判断。更重要的是，留存的公开来源没有一家披露 Fal
              的现金余额、毛利率、月度烧钱、债务义务或现金跑道，因此未来融资依赖仍需直接尽调，不能从标题式融资数字推断。
