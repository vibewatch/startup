    title: 产品架构图
    type: stack
    summary: Fal 展示了一套分层的生成式媒体基础设施栈，覆盖模型访问、编排、弹性服务、云容量和安全控制。
    data:
      layers:
        - label: 客户需求入口
          detail: 消费生成媒体的开发者和企业工作流。
          items:
            - label: 图像、视频、音频和 3D 功能构建者
            - label: 企业媒体与创意工作流
        - label: 统一模型访问层
          modules:
            - label: 1 API
              value: 1000+ production-ready models
            - label: 商业化接入自研与开源模型
        - label: 编排层
          modules:
            - label: Queue API
            - label: 工作流端点
            - label: 模型端点
            - label: 缓存与批处理模式
        - label: 部署层
          detail: 为定制模型和应用提供托管服务选项。
          items:
