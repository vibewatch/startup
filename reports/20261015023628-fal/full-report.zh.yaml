    rows:
      - - Fal
        - 按输出计费的模型价格，加 GPU 小时选项
        - Flux 2 Pro $0.05/image；Wan 2.5 $0.05/sec；Aireiter 评测中的 H100 批量价格为 $1.89/h
        - 1,000+ 个媒体模型、模型体验区、私有端点、企业采购功能
        - 留存来源未公开实际折扣、合同条款和多模型打包价格
        - 最适合优先追求最快托管式落地的团队
      - - Replicate
        - 按秒计费的 GPU 和部署端点
        - Flux 2 Pro $0.055/image；留存比较中的 A100 为 $0.001150/sec
        - 开放模型目录、部署能力、强文档 / 社区
        - 冷启动可能抬高低热度模型的实际成本
        - 文档和自定义模型开放性比价格更重要时更合适
      - - Modal
        - 按秒计费的计算
        - A100-80GB，单价 $0.001036/sec
        - 用 Python 定义的自定义工作负载，支持缩容至零
        - 需要承担代码和基础设施设计
        - 适合希望获得可编程控制、又不想完全自托管的团队
      - - RunPod
        - 按小时或按秒计费的基础设施
        - 社区版 A100 $0.69/h；Secure A100 约 $1.64/h
        - 低价 GPU 供应和无服务器端点
        - 抢占和延迟波动对面向用户的应用可能不可接受
        - 最适合预算敏感的批处理或混合负载
      - - Baseten
        - 按秒计费的推理
        - A100 $0.001267/sec
        - 托管式服务，支持批处理、缓存和生产 API 功能
        - 节省幅度取决于流量形态和批处理效果
        - 可靠性和服务功能比最低标价更重要时最合适
      - - 自托管 H100 / GPU 云
        - 直接 GPU 容量成本
        - Spheron 示例采用 $2.01/h 的 H100 PCIe，并估计稳定规模下图像生成经济性约比 Fal 低 2.5x
        - 完整的模型栈控制
        - 运维负担、利用率风险和支持责任由买方承担
        - 适合需求可重复、已具备规模的团队的强替代方案
