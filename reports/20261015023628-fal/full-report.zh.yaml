      - number: '4.2'
        title: 单位经济性与交付成本信号
        blocks:
          - type: paragraph
            body: >-
              公开记录更能证明需求强度，而不是实际单位经济性。Fal 称其服务超过 250 万名开发者、每天处理数百万次推理调用，并提供 99.99%
              的可用性；由此可见，吞吐量可观，收入引擎也直接绑定使用量。成本可见度仍然很低。2026 年 5 月 AWS 公告称 AWS 成为 Fal 的首选云提供商，并将在 2026
              年逐步上线，这指向服务交付栈中的重大云集中度。Ry Walker 对无服务器 GPU 的列表定价有助于框定可计费算力单位，但留存来源仍未披露毛利率、模型授权分成、支持负荷或
