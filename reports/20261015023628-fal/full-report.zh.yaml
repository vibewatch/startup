      - number: '1.3'
        title: 治理信号、安全姿态与延续风险
        blocks:
          - type: paragraph
            body: >-
              Fal 的公开控制面在政策和运营姿态上强于正式治理。信任与安全页面称，公司建立了由前 TikTok 信任与安全负责人带领的专门安全职能，并将平台接入 NCMEC、Thorn、StopNCII 及 OpenAI
              的审核工具；这一点很重要，因为后续章节要判断平台能否承受企业和监管审查。与此同时，留存证据记录了 2026 年 8
              月下旬的一次事故：历史请求查询和当月早些时候生成的资产“可能降级”，而捕获的中断复盘没有显示解决时间。结合融资和员工数的冲突口径，后续应保持这样的判断：Fal
              显然真实且已具规模，但对于投资判断最关键的指标和治理细节，透明度仍然有限。
