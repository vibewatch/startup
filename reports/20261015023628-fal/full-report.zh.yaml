      - number: '3.3'
        title: 持久性、锁定效应与替代风险
        blocks:
          - type: paragraph
            body: >-
              留存证据中的 Fal 持久优势确实存在，但主要来自执行。SOC 2、SSO、私有端点和专门的信任与安全项目支撑了可信的企业姿态，TechCrunch 的客户名单和融资报道也暗示了有意义的市场验证。这些特征应帮助
              Fal 比功能型 API 经纪商更好地守住大型客户和受监管的媒体场景。不过，同一来源集没有显示排他性分发或不可替代的模型供给。Wireflow
              明确提示，如果更便宜的模型在别处，客户会面临厂商锁定；Aireiter
              和竞争对手发布的比较则强调文档与计费摩擦；随着用量上升，自托管经济性也更有吸引力。更可能的结果不是被某一家竞争对手突然替代，而是选择性多归属：企业客户把对速度敏感的媒体路径留给
              Fal，同时将定制化、成本密集或合规敏感的工作负载转给其他平台或内部栈。
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP008
              - CP009
              - CP010
              - CP011
              - CP013
      - number: '3.4'
        title: 展品
        blocks:
          - type: callout
            title: Fal 仍是便利性的标杆
            body: 在留存来源中，Fal 最强的优势不是底层排他性，而是产品打包：一个 API、强大的视频和图像覆盖、面向企业的采购能力，以及为希望使用托管媒体栈而非掌控基础设施的团队提供更快部署。
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP009
              - CP013
          - type: callout
            title: 用量和控制权越重要，护城河越弱
            body: 最清晰的替代路径是选择性多归属。一旦买方优先考虑自定义部署、更易用的文档、更低的稳态 GPU 经济性或更弱的锁定效应，可信的替代方案就会出现，而不必由一家竞争对手在每个维度上都复制 Fal。
            calloutType: risk
            claimRefs:
