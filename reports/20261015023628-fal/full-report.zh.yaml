              Fal 的融资轨迹是本章最可靠、也最可复用的事实基础。公司从 2025 年 7 月以 $1.5B 估值完成的 $125M Series C，走到 2025 年 12 月以 $4.5B 估值完成的 $140M
              Series D；前一轮由 Meritech 领投，后一轮由 Sequoia 领投，几位投资人跨轮继续跟投。到 2026 年初，第三方报道对约 $400M
              的年化收入数字逐渐趋同，但证据质量仍弱于股权故事：留存的公司资料称 2025 年 10 月收入为 $200M+、员工 80 人，而聚合平台报告的融资总额和员工数明显不同。因此，Fal
              在商业上看起来颇具规模，但核心经营指标尚未达到审计级。
