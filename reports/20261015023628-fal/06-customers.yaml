        - CompWorth
        - low
        - Directionally suggests meaningful throughput if methodology is sound
        - Estimate is not company-verified and methodology is opaque
    notes: This table mixes verified operating signals with low-confidence third-party estimates; null customer denominators remain the main analytical limitation.
