        - high
        - Broad catalog supports multi-use-case acquisition and experimentation
        - Does not reveal paying customers, active deployments, or revenue mix
      - - Third-party workflow adoption
        - Fal.run API used in an n8n 2D-to-3D automation template
        - Last update shown as 8 months before fetch
        - n8n workflow template
        - medium
        - Confirms external builders are wiring Fal into production-like workflows
        - No install count, execution volume, or spend disclosed
      - - Partner capacity expansion
        - Customer quote says Fal moved more capacity after reliability proof
        - Current fetch
        - DigitalOcean customer page
        - medium
        - Suggests at least one vendor relationship expanded after initial validation
        - No baseline capacity, contract term, or spend level disclosed
      - - Independent scale estimate
        - 100M daily requests and 99.99% uptime (estimate)
