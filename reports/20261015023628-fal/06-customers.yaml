  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-proof
      missingEvidence: Public NRR, GRR, churn, renewal-rate, contract-length, or cohort-retention evidence.
      whyItMatters: Without durability metrics, it is impossible to judge whether Fal's adoption is sticky enterprise revenue or bursty usage-driven demand.
      diligencePath: Request cohort retention tables, renewal dashboards, or board metrics that separate self-serve usage from contracted enterprise accounts.
      relatedQuestionRefs: [QU005]
    - type: private-evidence-only
      severity: material
      topic: concentration-gap
      missingEvidence: Top-customer revenue share, top-10 concentration, and self-serve versus enterprise revenue mix.
      whyItMatters: Customer concentration and partner dependence directly affect downside risk and the quality of expansion revenue.
      diligencePath: Request an ARR bridge by cohort plus a concentration schedule showing top accounts, partner-sourced spend, and contract terms.
      relatedQuestionRefs: [QU006]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof-table
      missingEvidence: Customer-authored deployment case studies, procurement records, or outcome KPIs that verify the named accounts are live and production-level.
      whyItMatters: Logos and secondary lists do not prove production deployment, renewal, or material spend.
      diligencePath: Request at least three customer references or public case studies mapping buyer, use case, rollout status, and measurable KPI impact.
      relatedQuestionRefs: [QU003, QU004]
      relatedTableRefs: [TU003]
