figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Fal appears to land through developer access and expand into procurement-heavy enterprise usage, with partner channels widening reach but reliability determining stickiness.
    data:
      nodes:
        - label: Discover the model catalog
          tone: neutral
          actor: Developer or creative technologist
          phase: Discovery
          touchpoints:
            - 1,000+ model gallery
            - ChatGPT app install
          note: Fal's broad catalog and low-friction integration surface support self-serve discovery.
        - label: Prototype with API workflows
          tone: positive
          actor: Builder or automation team
          phase: Trial
          touchpoints:
            - Fal.run API
            - n8n workflow template
          note: External workflow builders can automate tasks such as 2D-to-3D generation on top of Fal.
        - label: Expand infrastructure capacity
          tone: positive
          actor: Product or ML infrastructure team
          phase: Expansion
          touchpoints:
            - Reliability proof
            - More capacity moved
          note: DigitalOcean's customer page links greater capacity usage to reliability and ease of use.
        - label: Clear enterprise procurement
          tone: positive
          actor: Security, IT, and procurement
          phase: Procurement
          touchpoints:
            - SOC 2
            - SSO
            - Private endpoints
            - Usage analytics
          note: Official pages highlight controls meant for larger enterprise buyers.
        - label: Add channel leverage
          tone: warning
          actor: Cloud and enterprise partner teams
          phase: Distribution
          touchpoints:
            - AWS preferred-cloud-provider claim
            - Custom enterprise credits
          note: Partner leverage may expand reach, but public evidence does not show economics or concentration.
        - label: Prove durability under load
          tone: risk
          actor: Existing customer accounts
          phase: Retention
          touchpoints:
            - Outage recap
            - Missing churn metrics
          note: Reliability incidents and absent retention data keep durability under-proven.
    claimRefs: [CU002, CU004, CU005, CU007, CU010, CU013]
callouts:
  - calloutType: insight
    title: Developer motion is visible; enterprise proof is thinner
    body: >-
      Fal has credible external workflow usage and enterprise-oriented
      packaging, but the strongest public named-account evidence still comes
      from one secondary profile rather than customer-authored deployment
      stories.
    claimRefs: [CU002, CU005, CU006, CU012]
  - calloutType: risk
    title: Retention is the biggest unresolved customer question
    body: >-
      The assigned pool supports adoption and some expansion signals, but not
      NRR, churn, renewals, or concentration, so customer durability remains
      more inferred than demonstrated.
    claimRefs: [CU010, CU011, CU013]
