      - ["Risk rating", "High", "Compute economics, commoditization, hyperscaler competition, concentration, and liquidity remain material", "Underwrite downside before assigning a return target"]
      - ["Valuation stance", "Stretched", "$4.5B reported round mark, $9.9B model estimate, and $12B secondary point are not directly comparable", "Treat every mark above the evidenced base range as conditional"]
      - ["Return / hold / exit", "Not supportable from public evidence", "No entry security, preference stack, audited denominator, or filed exit path", "Defer target return and hold-period claims"]
    notes: >-
      Assessments are analyst judgments based only on the cited public evidence; funding
      raised is not cash available, and private-company price markers are not live quotations.
    claimRefs: [CV001, CV002, CV003, CV004, CV008, CV009, CV010, CV011, CV015, CV016]
  - id: "TV002"
    title: "Thesis and anti-thesis"
    columns: ["Side", "Argument", "Evidence", "What would change the view"]
    rows:
      - ["Thesis", "Developer adoption creates a distribution wedge", "Fortune reported more than one million developers in February 2025", "Cohort retention, paid conversion, and current active-developer evidence would strengthen the thesis"]
      - ["Thesis", "The company is investing in platform governance", "Fal says it has a dedicated trust-and-safety leader and enforcement process", "Independent control testing and incident metrics would convert policy into operating proof"]
      - ["Thesis", "Repeated institutional financing signals access to capital", "Fal announced a $140M Series D with major new and existing investors", "Primary closing documents and current cash would establish actual financing capacity"]
      - ["Anti-thesis", "The revenue denominator is unstable", "Public sources show a roughly $40M estimate and a later $200M recorded figure", "Audited revenue with period, recognition policy, and ARR reconciliation would resolve the gap"]
      - ["Anti-thesis", "Compute economics may cap software-like margins", "QuantLogix estimates a 45%-55% gross-margin band", "Workload-level gross margins and committed-capacity economics would test operating leverage"]
      - ["Anti-thesis", "Competition and concentration can compress the premium", "QuantLogix identifies commoditization, hyperscalers, GPU cost pressure, and customer concentration", "Diversified contracted revenue and sustained margin expansion would weaken this concern"]
    notes: >-
      Company statements establish what Fal says it has built; they do not independently
      verify adoption quality, control effectiveness, or financial durability.
    claimRefs: [CV002, CV003, CV012, CV013, CV014, CV015, CV016]
  - id: "TV003"
    title: "Bull / base / bear valuation sensitivity"
    columns: ["Case", "Assumptions", "Valuation / return logic", "Key risks", "Probability signal"]
    rows:
      - ["Bear", "5.0x-5.4x public-reference revenue multiple on $200M recorded December 2025 revenue", "$1.00B-$1.08B implied value; no investor return computed without entry terms", "Growth deceleration, margin pressure, and public-multiple compression", "Moderate downside signal if audited growth or margins miss"]
      - ["Base", "15.8x-22.5x Fal historical reported multiple range on the same $200M denominator", "$3.16B-$4.50B implied value; upper end matches the reported December 2025 mark", "Revenue basis may be run-rate or LTM and is unaudited in the available evidence", "Strongest of the three signals because it references Fal's own prior marks"]
      - ["Bull", "26.6x-56.0x private-reference range on the same $200M denominator", "$5.32B-$11.20B implied value; no return computed without security and dilution terms", "Weak comparability, private-market illiquidity, and execution needed to sustain a premium", "Weak until audited growth and margin expansion justify exceptional multiples"]
    notes: >-
      Analyst-derived arithmetic uses Multiples' $200M recorded revenue and cited multiples;
      ranges are sensitivities, not forecasts or fair values, and comparables are not like-for-like.
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV009, CV010]
