company:
  name: "Fal"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    Fal shows meaningful product and developer adoption, but public valuation evidence is
    too inconsistent to support a priced investment decision. The appropriate stance is
    research-more with high valuation risk: scenario outputs span roughly $1.00B to $11.20B
    because neither the revenue denominator nor the current security terms are independently
    verified.
sections:
  - id: "verdict-and-entry-discipline"
    title: "Verdict and entry discipline"
    body: >-
      The recommendation is research-more, with medium confidence in the direction of the
      call and high risk around price. Fal's own December 2025 announcement establishes a
      $140M Series D, while third-party sources disagree on cumulative funding and later
      value markers: Clay reports $337M raised, Tracxn reports $400M, Multiples records a
      $4.5B December 2025 valuation, and QuantLogix publishes a $9.9B model estimate plus a
      $12B June 2026 secondary point estimate. These are not interchangeable observations.
      A financing announcement is not cash available, a modeled price is not a transaction,
      and a secondary point without bid, ask, spread, or security terms is not a current
      company valuation. Entry discipline therefore requires the actual security price,
      fully diluted capitalization, liquidation preferences, and a reconciled revenue basis
      before underwriting returns. Until those items are produced, the valuation stance is
      stretched and no target return, hold period, or exit multiple can be responsibly fixed.
    claimRefs: [CV001, CV002, CV003, CV004, CV008, CV009, CV010]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: "thesis-and-anti-thesis"
    title: "Thesis and anti-thesis"
    body: >-
      The investable thesis is that Fal has a real distribution and usage wedge in
      generative-media infrastructure: Fortune reported more than one million developers in
      February 2025, and the company has added a dedicated trust-and-safety function and
      enforcement process. The anti-thesis is that evidence quality lags the valuation
      narrative. Multiples records $200M of December 2025 revenue, whereas an archived
      CompWorth page estimated roughly $40M; the former explicitly says its values may be
      run-rate revenue or reported LTM revenue, so neither figure should be relabeled ARR.
      QuantLogix estimates only a 45%-55% gross-margin band and highlights GPU cost pressure,
      model commoditization, hyperscaler competition, and customer concentration. Those
      conditions make rapid top-line expansion insufficient on its own: the thesis needs
      cohort retention, customer concentration, contracted gross margin, and compute
      commitments to show that growth converts into durable equity value.
    claimRefs: [CV003, CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV002]
  - id: "scenario-and-comparable-logic"
    title: "Scenario and comparable logic"
    body: >-
      The scenario framework uses Multiples' $200M December 2025 recorded revenue solely as
      a common denominator; it is not audited revenue, ARR, or current revenue. The bear case
      applies the source's 5.0x-5.4x public-company references and yields about
      $1.00B-$1.08B. The base case uses Fal's own reported July-to-December 2025 multiple
      range of 15.8x-22.5x and yields about $3.16B-$4.50B. The bull case applies the
      source's 26.6x-56.0x private-company references and yields about $5.32B-$11.20B.
      These are sensitivity ranges, not fair-value estimates: the named comparables span
      different products, maturity, profitability, and liquidity, and no evidence in the
      pool establishes that their multiples transfer directly to Fal. The base range has
      the strongest probability signal because it uses Fal's own reported marks; the bear
      and bull ranges are stress tests for compression and exceptional growth, respectively.
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV009, CV010, CV014, CV015]
    tableRefs: [TV003]
  - id: "exit-readiness-and-final-diligence"
    title: "Exit readiness and final diligence"
    body: >-
      Exit readiness is unproven. QuantLogix states that Fal is private and has no public
      S-1 on file, while its secondary-market observation lacks a live bid, ask, or spread.
      The company may have financing access, but the available evidence does not establish
      an IPO timetable, transferable liquidity, or common-share economics. A decision-ready
      process should obtain audited or quality-of-earnings revenue, gross margin by workload,
      customer and model concentration, committed GPU obligations, the fully diluted cap
      table, preference stack, and all secondary tender terms. Thesis-break triggers are:
      verified revenue materially below the $200M recorded denominator; gross margin failing
      to improve from the estimated 45%-55% band despite scale; concentration that makes one
      customer, model provider, or cloud counterparty decisive; or entry terms implying a
      valuation above the bull sensitivity without commensurate audited growth. Positive
      movement would require reconciled metrics and clean security terms, not another
      headline financing marker.
    claimRefs: [CV003, CV010, CV011, CV015, CV016]
tables:
  - id: "TV001"
    title: "Recommendation summary"
    columns: ["Decision field", "Assessment", "Evidence basis", "Decision implication"]
    rows:
      - ["Recommendation", "Research more", "Public price markers and funding totals conflict", "Do not approve an entry until primary financing and cap-table documents reconcile the record"]
