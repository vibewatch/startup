    title: "Decision"
    body: >-
      Research more. Require primary cap-table and financing documents plus reconciled
      revenue and gross-margin evidence before setting entry price or target return.
    claimRefs: [CV001, CV003, CV004, CV008, CV009, CV010, CV015]
  - calloutType: "risk"
    title: "Do not collapse unlike price markers"
    body: >-
      A reported financing valuation, a model estimate, and a secondary point estimate have
      different issuers, dates, securities, and liquidity; none should substitute for current
      fully diluted common-equivalent value.
    claimRefs: [CV004, CV009, CV010]
