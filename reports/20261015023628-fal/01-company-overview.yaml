  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: funding-total
      missingEvidence: >-
        A signed financing summary or cap-table-backed ledger that reconciles
        the $346M+ profile total with the $587M aggregate reported by Multiples,
        including whether any secondary sales or unclosed tranches are bundled
        into third-party totals.
      whyItMatters: >-
        Later valuation and dilution analysis will be directionally wrong if the
        capital base is understated or if third-party totals mix primary and
        secondary activity.
      diligencePath: >-
        Request the latest board package or financing memo showing closed round
        dates, primary proceeds, secondary proceeds, and cumulative capital
        raised.
      relatedQuestionRefs: [QO005]
      relatedTableRefs: [TO003]
    - type: missing-source
      severity: material
      topic: governance
      missingEvidence: >-
        Current board composition, voting rights, founder control provisions,
        and any investor governance terms tied to the 2025 financings.
      whyItMatters: >-
        Fal's public evidence shows investors and trust/safety posture, but not
        who actually governs key decisions or how much founder control remains.
      diligencePath: >-
        Obtain the board roster, charter materials, and the latest investor
        rights agreement or equivalent governance summary.
      relatedQuestionRefs: [QO003]
    - type: private-evidence-only
      severity: material
      topic: financial-quality
      missingEvidence: >-
        Audited or management-certified revenue, gross margin, burn, cash
        balance, and definition notes for whether reported figures are ARR,
        run-rate revenue, or trailing revenue.
      whyItMatters: >-
        Fal's growth story is central to the investment case, but current
        retained figures are tracker estimates or company-reported metrics that
        cannot support precise underwriting alone.
      diligencePath: >-
        Request monthly management reporting or audited statements with explicit
        metric definitions and period coverage.
      relatedQuestionRefs: [QO006]
      relatedTableRefs: [TO001]
    - type: conflicting-data
      severity: material
      topic: headcount
      missingEvidence: >-
        Timestamped HR or payroll evidence reconciling the retained 80, 100+,
        and 190 employee counts.
      whyItMatters: >-
        Headcount is a proxy for operating leverage, hiring intensity, and burn
        assumptions in later chapters, so a wide unresolved range matters.
      diligencePath: >-
        Request current employee census, last twelve months of net adds, and
        open-requisition counts by function.
      relatedQuestionRefs: [QO006]
