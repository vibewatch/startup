callouts:
  - calloutType: risk
    title: The evidence quality is itself a top risk
    body: >-
      Fal's public control surface is stronger than its public verification surface. That is a
      genuine investment risk because the assigned independent evidence does not reconcile
      incident quality, concentration, or financial transparency tightly enough to underwrite the
      narrative at face value.
    claimRefs: [CR005, CR011, CR012, CR014]
  - calloutType: insight
    title: The first diligence ask should be post-control operating data
    body: >-
      The next diligence step is not more marketing or architecture detail; it is operating proof:
      abuse-enforcement metrics, postmortems, enterprise security artifacts, cloud-commit
      economics, and reconciled funding / headcount / valuation disclosures.
    claimRefs: [CR005, CR009, CR011, CR013]
