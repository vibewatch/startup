        - AWS plus underlying premium GPU suppliers
        - Inference capacity, throughput economics, and enterprise delivery
        - High
        - Capacity or pricing leverage compresses margin or constrains customer commitments
        - High
        - Fal markets large GPU access and strategic cloud alignment, but contractual offsets are undisclosed
        - High
