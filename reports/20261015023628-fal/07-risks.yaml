  evidenceGaps:
    - type: missing-source
      severity: material
      topic: enforcement-efficacy
      missingEvidence: Independent incident-rate, escalation-SLA, false-positive, false-negative, and appeal-volume reporting for trust-and-safety operations.
      whyItMatters: Without operating-quality metrics, the disclosed control stack is hard to underwrite as effective rather than merely well-described.
      diligencePath: Request a trust-and-safety metrics pack, independent audit summary, and sample post-incident review artifacts.
      relatedQuestionRefs: [QR002]
      relatedTableRefs: [TR001]
    - type: missing-source
      severity: material
      topic: financial-opacity
      missingEvidence: Audited or management-certified revenue, gross margin, burn, cash, and top-customer concentration disclosures.
      whyItMatters: The assigned third-party profiles disagree enough that valuation discipline and downside modeling remain unstable.
      diligencePath: Obtain board-report or investor-update metrics and reconcile them against public funding and workforce disclosures.
      relatedQuestionRefs: [QR006, QR007]
      relatedTableRefs: [TR003]
    - type: missing-source
      severity: material
      topic: cloud-concentration
      missingEvidence: Contract economics, reserved-capacity commitments, and dependency terms for AWS and premium GPU supply.
      whyItMatters: Cloud leverage and minimum commits can turn a growth advantage into a margin, liquidity, or service-level risk.
      diligencePath: Review the preferred-cloud agreement, GPU reservation terms, and any vendor concentration reporting.
      relatedQuestionRefs: [QR005]
      relatedTableRefs: [TR003]
    - type: missing-source
      severity: material
      topic: incident-history
      missingEvidence: Official status-history exports, root-cause analyses, and resolution timestamps for recent degraded-performance events.
      whyItMatters: A single recap proves an incident happened, but not whether the pattern is recurring or whether remediation was durable.
      diligencePath: Request status-page exports, postmortems, and customer communication logs for 2026 incidents.
      relatedQuestionRefs: [QR004]
      relatedTableRefs: [TR002]
