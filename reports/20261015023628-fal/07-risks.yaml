        - Request incident volumes, appeal rates, regulator inquiries, and trust-and-safety audit trails
      - - Enterprise privacy / procurement assurance
        - Enterprise buyers across regulated and non-regulated sectors
        - Homepage claims SOC 2, SSO, and private endpoints, but the assigned pool lacks DPA, subprocessor, or pen-test detail
        - Medium
        - High
        - Enterprise controls are explicitly marketed
        - Medium
        - Review DPA, subprocessor list, pen-test letters, and any customer security questionnaires
