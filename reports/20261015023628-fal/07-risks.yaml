        - Medium
        - Medium
        - Formal enforcement process with appeal mechanisms
        - Medium
        - Ask for SLA data, false-positive / false-negative samples, and policy exception logs
    notes: >-
      Ordered by residual severity using only the assigned public evidence; "current evidence"
      distinguishes disclosed controls from unverified operating outcomes.
