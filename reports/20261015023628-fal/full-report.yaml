      - number: '3.3'
        title: Durability, lock-in, and displacement risk
        blocks:
          - type: paragraph
            body: >
              Fal's durable advantages in the retained evidence are real but mostly executional. Official pages support
              a credible enterprise posture through SOC 2, SSO, private endpoints, and a dedicated trust-and-safety
              program, while TechCrunch's customer list and financing coverage imply meaningful market validation. Those
              attributes should help Fal defend larger accounts and regulated media use cases better than a feature-only
              API broker. Still, the same source set does not show exclusive distribution or irreplaceable model supply.
              Wireflow explicitly flags vendor lock-in if a cheaper model lives elsewhere, Aireiter and
              competitor-issued comparisons highlight documentation and billing friction, and self-hosting economics
              become more attractive as volume rises. The likely outcome is not sudden displacement by one rival, but
              selective multi-homing: enterprise buyers keep Fal for speed-sensitive media paths while routing custom,
              cost-heavy, or compliance-sensitive workloads to other platforms or internal stacks.
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP008
              - CP009
              - CP010
              - CP011
              - CP013
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Fal still sets the convenience benchmark
            body: >
              Across the retained source set, Fal's strongest edge is not raw exclusivity but packaging: one API, strong
              video/image coverage, enterprise-facing procurement, and faster deployment for teams that want a managed
              media stack more than they want infrastructure freedom.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP009
              - CP013
          - type: callout
            title: The moat weakens as volume and control matter more
            body: >
              The clearest displacement path is selective multi-homing. Once a buyer prioritizes custom deployment,
              easier docs, lower steady-state GPU economics, or reduced lock-in, credible substitutes emerge without
              needing a single rival to match Fal on every dimension.
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public pricing
        blocks:
          - type: paragraph
            body: >-
              Fal's monetization is infrastructure-native rather than seat-based. Its official inference page presents
              two primary commercial surfaces on one runtime: hosted model APIs for image, video, audio, and 3D
              generation, plus serverless deployment for customer-owned models and containers. Public pricing evidence
              reinforces that framing. Ry Walker's June 2026 research note lists per-output prices for model APIs and
              hourly GPU pricing for custom deployments, while Fal's own site emphasizes pay-per-use and reserved
              capacity instead of subscription bundles. That makes the public evidence good for understanding billing
              mechanics, but weak for underwriting realized monetization because the retained sources do not disclose
              discount rates, enterprise commitments, revenue recognition policy, or product-line mix.
            claimRefs:
