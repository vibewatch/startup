  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual exposure stays highest where Fal's disclosed controls are strongest but independent verification is
      weakest.
    data:
      columns:
        - label: Likelihood
          note: Probability if current disclosures and mitigations remain unchanged.
        - label: Impact
          note: Severity for underwriting, enterprise adoption, or operating continuity.
        - label: Mitigation maturity
          note: Whether named mitigations are concrete and already productized.
        - label: Residual exposure
          note: Exposure remaining after disclosed mitigations.
      rows:
        - label: Abuse / policy liability
          note: Strong official controls, limited independent efficacy evidence.
          values:
            - label: Medium
              tone: medium
            - label: High
              tone: high
            - label: Medium
              tone: medium
            - label: High
              tone: high
        - label: Availability / incident handling
          note: Reliability controls are real, but one 2026 degradation is already on record.
          values:
            - label: Medium
              tone: medium
            - label: High
              tone: high
            - label: High
              tone: low
            - label: Medium
              tone: medium
        - label: Cloud / GPU concentration
          note: Strategic alignment can help growth while still increasing dependency risk.
          values:
            - label: Medium
              tone: medium
            - label: High
              tone: high
            - label: Low
              tone: low
            - label: High
              tone: high
        - label: Financial transparency
          note: External profiles disagree too much to serve as a clean underwriting base.
          values:
            - label: High
              tone: high
            - label: High
              tone: high
            - label: Low
              tone: low
            - label: High
              tone: high
        - label: Enterprise security assurance
          note: SOC 2 and enterprise controls are company-disclosed; audit scope is unavailable.
          values:
            - label: Unquantified
              tone: medium
            - label: High
              tone: high
            - label: Medium
              tone: medium
            - label: Medium
              tone: medium
        - label: SDK and file-transfer edge cases
