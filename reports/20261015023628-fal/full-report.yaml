      - number: '4.2'
        title: Unit economics and delivery-cost signals
        blocks:
          - type: paragraph
            body: >-
              The public record supports demand intensity more than actual unit economics. Fal says it serves more than
              2.5 million developers, processes millions of daily inference calls, and delivers 99.99% uptime; that
              implies meaningful throughput and a revenue engine tied directly to usage volume. Cost visibility is still
              thin. The May 2026 AWS announcement says AWS became Fal's preferred cloud provider, with rollout through
              2026, which points to material cloud concentration inside the service-delivery stack. Ry Walker's list
              pricing for serverless GPUs helps bound billable compute units, but the retained sources still do not show
              gross margin, model-licensing take rates, support load, or sales-efficiency metrics such as CAC or
              payback. The August 2026 degraded-performance incident is also relevant because reliability disruptions
              can defer or destroy otherwise billable usage.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI012
              - CI013
