  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Served market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Fal's own surfaces define the core category as generative-media infrastructure rather than a consumer
              creative app or a frontier-model lab. The included spend is the stack around model access, private or
              managed deployments, serverless GPUs, and the operational tooling needed to run image, video, audio, and
              3D workloads in production. That makes the most relevant substitute set self-managed infrastructure,
              direct model access from labs, and hyperscaler AI serving, not generic MarTech or broader "AI" software
              categories. The main boundary risk is overreach: public sources do not justify rolling Fal into every
              genAI software or cloud-compute dollar, and one assigned market page was actually an unrelated
              fiber-optics report, which is useful evidence that keyword-only TAM shortcuts would overstate what the
              public record can support.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM013
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM013
              - CM014
      - number: '2.2'
        title: Buyers, users, and budget owners
        blocks:
          - type: paragraph
            body: >-
              The adoption path runs from self-serve developers into governed enterprise and model-lab use cases. Fal's
              public messaging consistently splits the market into developers who want broad model access with low setup
              friction, enterprises that need reliability, procurement readiness, and private endpoints, and research
              labs or model providers that want optimized serving and distribution without building the full delivery
              stack themselves. That creates a multi-budget motion: engineering teams can start with API
              experimentation, but enterprise expansion depends on platform, infrastructure, product, and
              creative-operations owners who can justify reserved capacity, compliance controls, and production workflow
              integration.
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
