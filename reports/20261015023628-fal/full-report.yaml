      - number: '1.2'
        title: Funding trajectory and disclosed scale
        blocks:
          - type: paragraph
            body: >-
              Fal's financing arc is the chapter's strongest reusable ground truth. The company moved from a $125M
              Series C at a $1.5B valuation in July 2025 to a $140M Series D at a $4.5B valuation in December 2025, with
              Meritech leading the former and Sequoia leading the latter while several investors rolled forward across
              rounds. Third-party coverage then converged on a roughly $400M annualized revenue figure by early 2026,
              but the proof quality is still weaker than the equity story: the retained company profile cites $200M+
              revenue as of October 2025 and 80 employees, while aggregators report materially different totals for
              funding and headcount. That makes Fal look commercially important, but not yet audit-grade on core
              operating metrics.
