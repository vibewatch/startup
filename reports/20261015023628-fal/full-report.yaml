chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Foundation, identity, and founder fit
        blocks:
          - type: paragraph
            body: >-
              Fal's public identity is unusually legible for a private AI infrastructure company: the current homepage
              positions it as a generative media inference platform where developers can call 1,000+ models through one
              API, deploy custom workloads on serverless GPUs, or train on GPU clusters. Retained profile sources place
              the company in San Francisco and date its founding to 2021, while founder biographies consistently point
              back to technical operator roots rather than pure financial engineering. Burkay Gur is described as a
              former Coinbase machine learning leader, and Gorkem Yurtseven as an ex-Amazon developer, which supports a
              founder-market-fit narrative around high-throughput model serving, developer tooling, and infrastructure
              abstraction. What remains less public is the layer beneath the founders: retained evidence does not
              surface an independent board roster, named functional executives beyond trust and safety, or clear
              succession depth.
