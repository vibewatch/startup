      - number: '6.2'
        title: Adoption proof is real but mostly indirect
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence that Fal has real external usage comes from three different surfaces, but each has
              limits. A third-party n8n workflow template shows Fal.run being operationalized in an automation flow for
              2D-to-3D generation, which is meaningful developer-signal proof beyond Fal's own site. A DigitalOcean
              customer page adds a more expansion-oriented clue: the quoted user says reliability and ease of use led
              Fal to move more capacity to the platform, which is stronger than a logo but still stops short of giving
              spend, duration, or workload volumes. The broadest named-customer proof comes from QuantLogix, which lists
              enterprise customers including Adobe, Canva, Shopify, Quora, and Amazon MGM Studios; however, the assigned
              pool does not include customer-authored case studies, production KPI disclosures, or renewal proof for
              those accounts.
            claimRefs:
