      - number: '1.3'
        title: Governance signals, safety posture, and carry-forward risks
        blocks:
          - type: paragraph
            body: >-
              The public control surface is stronger on policy and operating posture than on formal governance. Fal's
              trust and safety page says the company built a dedicated safety function led by a former TikTok trust and
              safety operator and connected the platform to NCMEC, Thorn, StopNCII, and OpenAI moderation tooling, which
              is meaningful because later chapters will depend on whether the platform can absorb enterprise and
              regulatory scrutiny. At the same time, the retained evidence also records a late-August 2026 incident in
              which historical request lookup and assets generated earlier in the month "may be degraded," with no
              resolution timestamp shown in the captured outage recap. Combined with conflicting funding and headcount
              aggregates, the correct carry-forward stance is that Fal is clearly real and scaled, but still only
              partially transparent on the metrics and governance details that matter most for underwriting.
            claimRefs:
              - CO010
              - CO014
              - CO015
