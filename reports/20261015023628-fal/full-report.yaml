      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Developer motion is visible; enterprise proof is thinner
            body: >-
              Fal has credible external workflow usage and enterprise-oriented packaging, but the strongest public
              named-account evidence still comes from one secondary profile rather than customer-authored deployment
              stories.
            calloutType: insight
            claimRefs:
