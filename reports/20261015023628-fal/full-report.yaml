              - CE005
              - CE006
              - CE007
              - CE009
      - number: '5.3'
        title: Enterprise packaging includes compliance and safety controls, but proof is mostly company-issued
        blocks:
          - type: paragraph
            body: >-
              Fal clearly recognizes that enterprise adoption depends on more than raw model performance. The homepage
              lists SOC 2, single sign-on, private endpoints, usage analytics, and priority support as procurement
              features, while the trust-and-safety page describes a dedicated leadership function, a formal enforcement
              process, CSAM hashing partnerships, StopNCII onboarding, and OpenAI moderation integration. Those controls
              matter because the company is an infrastructure layer for image and video generation rather than a narrow
              single-purpose application. The limitation is evidentiary: outside of media coverage echoing SOC 2 and
              enterprise readiness, the public package reviewed here does not include independent audit summaries,
              status-history evidence, or externally reported incident metrics that would verify how these controls
              operate in production.
            claimRefs:
              - CE005
              - CE006
              - CE009
      - number: '5.4'
        title: >-
          Differentiation rests on integration convenience and performance claims, but technical moat still needs
          external proof
        blocks:
          - type: paragraph
            body: >-
              Fal's differentiation case is strongest where multiple sources agree that it bundles model choice, managed
              inference, and enterprise-scale deployment in one commercial surface. That is a meaningful buyer benefit
              for media workloads because it reduces GPU-fleet management and lets teams swap among proprietary and
              open-source models. However, the public record still leaves material gaps around economics and durability.
              The AWS announcement did not disclose pricing or exclusivity terms, the articles reviewed do not precisely
              define what remains multi-cloud versus AWS-backed, and the assigned source set lacks hard developer-signal
              telemetry such as repo activity, package distribution, or community usage proxies. Investors can therefore
              underwrite the category fit and product packaging more confidently than the long-term defensibility of
              Fal's infrastructure moat.
            claimRefs:
