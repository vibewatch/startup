  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface maps to the developer workflow
        blocks:
          - type: paragraph
            body: >-
              Fal is selling workflow compression for teams that want generative-media capability without assembling
              their own inference stack. The official homepage positions the product as one API for more than 1,000
              production-ready image, video, audio, and 3D models, plus serverless deployment for custom models and
              separate GPU compute for training and research. The official optimization guide reinforces that split by
              naming three product surfaces—model APIs, serverless custom deployments, and controlled compute—while
              external coverage describes the value proposition as abstracting GPU fleet management and open-source
              model hosting complexity behind a unified interface. That makes the product definition more
              infrastructure-led than application-led, with value centered on model access, orchestration, and
              performance operations.
            claimRefs:
              - CE001
              - CE002
              - CE009
              - CE010
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
