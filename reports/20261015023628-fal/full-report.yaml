          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV009
              - CV010
              - CV013
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is that Fal has a real distribution and usage wedge in generative-media
              infrastructure: Fortune reported more than one million developers in February 2025, and the company has
              added a dedicated trust-and-safety function and enforcement process. The anti-thesis is that evidence
              quality lags the valuation narrative. Multiples records $200M of December 2025 revenue, whereas an
              archived CompWorth page estimated roughly $40M; the former explicitly says its values may be run-rate
              revenue or reported LTM revenue, so neither figure should be relabeled ARR. QuantLogix estimates only a
              45%-55% gross-margin band and highlights GPU cost pressure, model commoditization, hyperscaler
              competition, and customer concentration. Those conditions make rapid top-line expansion insufficient on
              its own: the thesis needs cohort retention, customer concentration, contracted gross margin, and compute
              commitments to show that growth converts into durable equity value.
            claimRefs:
              - CV003
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: Scenario and comparable logic
        blocks:
          - type: paragraph
            body: >-
              The scenario framework uses Multiples' $200M December 2025 recorded revenue solely as a common
              denominator; it is not audited revenue, ARR, or current revenue. The bear case applies the source's
              5.0x-5.4x public-company references and yields about $1.00B-$1.08B. The base case uses Fal's own reported
              July-to-December 2025 multiple range of 15.8x-22.5x and yields about $3.16B-$4.50B. The bull case applies
              the source's 26.6x-56.0x private-company references and yields about $5.32B-$11.20B. These are sensitivity
              ranges, not fair-value estimates: the named comparables span different products, maturity, profitability,
              and liquidity, and no evidence in the pool establishes that their multiples transfer directly to Fal. The
              base range has the strongest probability signal because it uses Fal's own reported marks; the bear and
              bull ranges are stress tests for compression and exceptional growth, respectively.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
      - number: '8.4'
        title: Exit readiness and final diligence
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is unproven. QuantLogix states that Fal is private and has no public S-1 on file, while its
              secondary-market observation lacks a live bid, ask, or spread. The company may have financing access, but
              the available evidence does not establish an IPO timetable, transferable liquidity, or common-share
              economics. A decision-ready process should obtain audited or quality-of-earnings revenue, gross margin by
              workload, customer and model concentration, committed GPU obligations, the fully diluted cap table,
              preference stack, and all secondary tender terms. Thesis-break triggers are: verified revenue materially
              below the $200M recorded denominator; gross margin failing to improve from the estimated 45%-55% band
              despite scale; concentration that makes one customer, model provider, or cloud counterparty decisive; or
              entry terms implying a valuation above the bull sensitivity without commensurate audited growth. Positive
              movement would require reconciled metrics and clean security terms, not another headline financing marker.
            claimRefs:
              - CV003
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Decision
            body: >-
              Research more. Require primary cap-table and financing documents plus reconciled revenue and gross-margin
              evidence before setting entry price or target return.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV008
              - CV009
              - CV010
              - CV015
          - type: callout
            title: Do not collapse unlike price markers
            body: >-
              A reported financing valuation, a model estimate, and a secondary point estimate have different issuers,
              dates, securities, and liquidity; none should substitute for current fully diluted common-equivalent
              value.
            calloutType: risk
            claimRefs:
              - CV004
              - CV009
              - CV010
