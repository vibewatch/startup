          - type: callout
            title: Retention is the biggest unresolved customer question
            body: >-
              The assigned pool supports adoption and some expansion signals, but not NRR, churn, renewals, or
              concentration, so customer durability remains more inferred than demonstrated.
            calloutType: risk
            claimRefs:
