      - number: '2.3'
        title: Sizing lenses, growth drivers, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Fal has enough public evidence to show a fast-growing served market, but not enough to publish a clean
              TAM/SAM/SOM. The strongest lenses are bottom-up and behavioral: developer counts, enterprise-customer
              counts, daily media throughput, model breadth, pricing entry points, and product evidence that latency is
              dropping toward interactive video workflows. Those signals matter because they connect directly to buyer
              value: enterprises want better speed, lower operational overhead, broader model choice, and production
              controls for personalized media. The constraints are equally important. Trust-and-safety obligations raise
              the operating bar, public performance claims are still partly vendor-stated, and no assigned independent
              source delivers a direct market-size estimate for Fal's exact category. That means public valuation work
              should treat market size as an evidence-constrained range question, not a solved constant.
            claimRefs:
              - CM005
