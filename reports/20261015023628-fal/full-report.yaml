              - CI011
              - CI013
      - number: '4.3'
        title: Capital adequacy and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Fal's funding momentum is visible, but capital adequacy is not. Business Wire says Fal had raised $300
              million to date and was valued at $4.5 billion in its most recent Series D, while Multiples records $200
              million of latest revenue and a 22.5x revenue multiple as of December 2025. Those datapoints would support
              a premium-growth narrative on their own, but Compworth publishes a much lower revenue, valuation, and
              cumulative-funding estimate for the same company. That discrepancy makes third-party financial baselines
              too unstable to anchor an investment case without management materials. More importantly, none of the
              retained public sources publish Fal's cash balance, gross margin, monthly burn, debt obligations, or
              runway, so the forward financing dependency still has to be diligenced directly rather than inferred from
              headline fundraising.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI013
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Monetization matches infrastructure usage
            body: >-
              Fal's public packaging aligns revenue with workload intensity, which is attractive for a fast-growing
              inference platform because demand, product breadth, and billable units all move together when customers
              scale successful generative-media features.
            calloutType: strength
            claimRefs:
              - CI001
              - CI003
              - CI006
          - type: callout
            title: Public underwriting is blocked by weak financial disclosure
            body: >-
              The retained sources are enough to understand list pricing and growth narrative, but not enough to
              underwrite margins or capital adequacy because revenue estimates conflict and cash, burn, debt, and runway
              are not disclosed.
            calloutType: risk
            claimRefs:
              - CI011
