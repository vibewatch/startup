      - number: '6.3'
        title: Durability and concentration remain under-disclosed
        blocks:
          - type: paragraph
            body: >-
              The weakest part of Fal's customer evidence is not initial adoption but durability. No source in the
              assigned pool discloses NRR, GRR, churn, contract length, cohort behavior, or top-customer concentration,
              so there is no public way to separate sticky enterprise revenue from bursty usage-driven demand. The
              August 27, 2026 outage recap is a useful adverse datapoint because it ties customer risk to degraded
              historical request lookup and generated assets, reminding us that service reliability matters directly to
              retention. Channel leverage could become a meaningful expansion tailwind if the AWS
              preferred-cloud-provider claim is correct, yet the same claim increases the need to understand partner
              dependence, economics, and whether a small number of large creative-platform customers account for an
              outsized share of spend.
            claimRefs:
              - CU007
