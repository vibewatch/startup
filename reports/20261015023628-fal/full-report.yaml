  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Developer-led entry point with enterprise upsell
        blocks:
          - type: paragraph
            body: >-
              Fal's customer motion is visible even without a disclosed customer count. Official pages consistently
              position the company as a generative-media infrastructure layer with more than 1,000 models behind one
              API, while the GPT-6 Astra integration page shows a low-friction entry path for self-serve builders and
              explicitly describes enterprise contracts for larger accounts. That combination suggests a
              land-with-developers, expand-to-procurement pattern rather than a pure top-down sales model. The same
              official surfaces also emphasize SOC 2, SSO, private endpoints, usage analytics, and custom enterprise
              credits, which are procurement aids rather than proof of retention, but they do show Fal is packaging
              itself for buyers beyond hobbyist creators.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
