  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitute classes
        blocks:
          - type: paragraph
            body: >
              The retained source set supports a broad competitive frame rather than a single peer list. Fal's own
              public surface positions the company as a unified generative-media inference layer with 1,000+ models,
              serverless deployment, and enterprise procurement features, while its late-2025 and 2026 funding signals
              imply enough balance-sheet capacity to keep adding supply, distribution, and partner programs. But the
              comparison sources also show that buyers can solve the same job through at least four substitute classes:
              API aggregators such as Replicate and Pollo, programmable platforms such as Modal and Baseten, cheaper
              raw-GPU or serverless infrastructure such as RunPod, and direct/self-hosted GPU workflows for teams that
              can absorb operational complexity. That matters because Fal's differentiation is mostly packaging,
              speed-to-production, and media-specific catalog breadth rather than a structurally exclusive route to the
              underlying models.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
