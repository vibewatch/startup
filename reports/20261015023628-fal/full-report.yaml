              - CR006
              - CR007
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Kill criteria should focus on evidence failure, not only operating failure
        blocks:
          - type: paragraph
            body: |-
              The thesis should break faster on evidence deterioration than on narrative strength. A
              repeat of asset-history degradation without a transparent postmortem would weaken the
              reliability case. A widening gap between company-controlled claims and independent
              operating evidence would weaken the legal-and-policy case, especially if Fal cannot show
              abuse-enforcement metrics or enterprise security diligence artifacts. On the financing side,
              the call should downgrade if management cannot reconcile the conflicting public profiles on
              funding, valuation, and workforce scale, or if the cloud/GPU relationship carries minimum
              commits or customer-concentration dynamics that remain undisclosed after diligence.
            claimRefs:
              - CR005
              - CR009
              - CR011
              - CR012
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The evidence quality is itself a top risk
            body: >-
              Fal's public control surface is stronger than its public verification surface. That is a genuine
              investment risk because the assigned independent evidence does not reconcile incident quality,
              concentration, or financial transparency tightly enough to underwrite the narrative at face value.
            calloutType: risk
            claimRefs:
              - CR005
              - CR011
              - CR012
              - CR014
          - type: callout
            title: The first diligence ask should be post-control operating data
            body: >-
              The next diligence step is not more marketing or architecture detail; it is operating proof:
              abuse-enforcement metrics, postmortems, enterprise security artifacts, cloud-commit economics, and
              reconciled funding / headcount / valuation disclosures.
            calloutType: insight
            claimRefs:
              - CR005
              - CR009
              - CR011
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Verdict and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, with medium confidence in the direction of the call and high risk
              around price. Fal's own December 2025 announcement establishes a $140M Series D, while third-party sources
              disagree on cumulative funding and later value markers: Clay reports $337M raised, Tracxn reports $400M,
              Multiples records a $4.5B December 2025 valuation, and QuantLogix publishes a $9.9B model estimate plus a
              $12B June 2026 secondary point estimate. These are not interchangeable observations. A financing
              announcement is not cash available, a modeled price is not a transaction, and a secondary point without
              bid, ask, spread, or security terms is not a current company valuation. Entry discipline therefore
              requires the actual security price, fully diluted capitalization, liquidation preferences, and a
              reconciled revenue basis before underwriting returns. Until those items are produced, the valuation stance
              is stretched and no target return, hold period, or exit multiple can be responsibly fixed.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV001
