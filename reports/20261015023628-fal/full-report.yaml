  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >
      Retained public evidence places Fal at the convenience extreme, while programmable infrastructure and self-hosting
      trade speed of adoption for more control and lower steady-state unit economics.
    data:
      xAxis:
        label: Operational control / deployment flexibility
        min: 1
        max: 5
        low: Managed API only
        high: Full infra control
        description: Ordinal score synthesized from retained public evidence.
        scale: ordinal
      yAxis:
        label: Time-to-value for media teams
        min: 1
        max: 5
        low: Heavy platform work
        high: Fastest zero-ops adoption
        description: Ordinal score synthesized from retained public evidence.
        scale: ordinal
      points:
        - label: Fal
          x: 2
          'y': 5
          detail: Unified media API, strong catalog breadth, and enterprise-facing onboarding.
        - label: Replicate
          x: 3
          'y': 4
          detail: Better docs and community, but less breadth and weaker price position in retained comparisons.
        - label: Modal
          x: 4
          'y': 3
          detail: Strong for programmable custom workloads, but requires deployment code and infra ownership.
        - label: RunPod
          x: 4
          'y': 2
          detail: Attractive raw GPU economics with more operational and latency variability.
        - label: Baseten
          x: 4
          'y': 3
          detail: Production serving features and SLAs, but not the lowest-friction or lowest-cost option in every case.
        - label: Self-hosted H100
          x: 5
          'y': 1
          detail: Maximum control and lower sustained image economics, with the highest implementation burden.
    approximationNotes: >
      Ordinal 1-5 coordinates synthesize cited public statements about deployment control, onboarding burden, and
      pricing model trade-offs; they are not direct benchmark outputs.
    claimRefs:
      - CP007
      - CP008
      - CP009
      - CP010
      - CP011
      - CP014
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows how Fal converts developer and enterprise activity into usage-based revenue, while leaving
      gross profit and cash conversion undisclosed.
    data:
      nodes:
        - id: demand
          label: Developer and enterprise demand
          detail: Company-reported 2.5M developers and millions of daily inference calls
        - id: hosted
          label: Hosted model APIs
          detail: One API across 1,400+ image, video, audio, and 3D endpoints
        - id: custom
          label: Serverless and reserved deployments
          detail: Customer-owned models, containers, and burst capacity on Fal-managed runtime
        - id: units
          label: Billable usage units
          detail: Per image, megapixel, video second, character, or GPU hour
        - id: revenue
          label: Usage-based revenue
          detail: List pricing is public; realized discounts and mix are not
        - id: cost
          label: Cloud, GPU, and licensing costs
          detail: AWS preferred-cloud rollout and media-model supply imply variable delivery cost
        - id: profit
          label: Gross profit and runway
          detail: Public gross margin, burn, cash, and debt data remain undisclosed
      edges:
        - from: demand
          to: hosted
          relationship: Off-the-shelf models
        - from: demand
          to: custom
          relationship: Customer-owned workloads
        - from: hosted
          to: units
          relationship: Output-priced inference
        - from: custom
          to: units
          relationship: Compute-priced deployment
        - from: units
          to: revenue
          relationship: Metered billing
        - from: revenue
          to: cost
          relationship: Service delivery and model-supply costs
        - from: cost
          to: profit
          relationship: Margin and cash conversion
    approximationNotes: >-
      This bridge is structural rather than quantitative because public sources expose billing mechanics and selected
      list prices, but not recognized revenue mix, gross margin, or burn.
    claimRefs:
      - CI001
      - CI003
      - CI006
      - CI007
      - CI013
