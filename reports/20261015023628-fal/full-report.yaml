              - CE006
              - CE009
              - CE010
      - number: '5.2'
        title: Architecture emphasizes orchestration, elastic inference, and cloud capacity
        blocks:
          - type: paragraph
            body: >-
              The reviewed sources point to a layered operating model rather than a monolithic application. Fal's
              technical materials describe queue-driven processing, workflow endpoints, model endpoints, batching,
              caching, and scaling techniques intended to reduce latency and increase throughput, while the homepage
              separates model invocation, serverless serving, and raw compute access. Independent reporting adds that
              Fal chose AWS as a preferred cloud provider to add global scale, custom silicon options, and reliability
              for generative-media workloads, with the rollout planned across 2026. The architecture story is therefore
              credible at the level of control planes and deployment surfaces, but still incomplete on which workloads
              remain multi-cloud, which are migrating, and what the AWS preference contractually requires.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE007
              - CE008
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
