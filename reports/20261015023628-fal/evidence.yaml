evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding-total
    missingEvidence: >-
      A signed financing summary or cap-table-backed ledger that reconciles the $346M+ profile total with the $587M
      aggregate reported by Multiples, including whether any secondary sales or unclosed tranches are bundled into
      third-party totals.
    whyItMatters: >-
      Later valuation and dilution analysis will be directionally wrong if the capital base is understated or if
      third-party totals mix primary and secondary activity.
    diligencePath: >-
      Request the latest board package or financing memo showing closed round dates, primary proceeds, secondary
      proceeds, and cumulative capital raised.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      Current board composition, voting rights, founder control provisions, and any investor governance terms tied to
      the 2025 financings.
    whyItMatters: >-
      Fal's public evidence shows investors and trust/safety posture, but not who actually governs key decisions or how
      much founder control remains.
    diligencePath: >-
      Obtain the board roster, charter materials, and the latest investor rights agreement or equivalent governance
      summary.
    relatedQuestionRefs:
      - QO003
  - type: private-evidence-only
    severity: material
    topic: financial-quality
    missingEvidence: >-
      Audited or management-certified revenue, gross margin, burn, cash balance, and definition notes for whether
      reported figures are ARR, run-rate revenue, or trailing revenue.
    whyItMatters: >-
      Fal's growth story is central to the investment case, but current retained figures are tracker estimates or
      company-reported metrics that cannot support precise underwriting alone.
    diligencePath: Request monthly management reporting or audited statements with explicit metric definitions and period coverage.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: Timestamped HR or payroll evidence reconciling the retained 80, 100+, and 190 employee counts.
    whyItMatters: >-
      Headcount is a proxy for operating leverage, hiring intensity, and burn assumptions in later chapters, so a wide
      unresolved range matters.
    diligencePath: Request current employee census, last twelve months of net adds, and open-requisition counts by function.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: material
    topic: evidence-constrained-sizing
    missingEvidence: >-
      A direct independent TAM/SAM/SOM estimate for generative-media inference and managed-serving spend that matches
      Fal's actual category boundary.
    whyItMatters: >-
      Valuation work needs an addressable-market range grounded in the same workflow and budget boundary that the
      company actually serves.
    diligencePath: >-
      Request paid analyst work or triangulate public-cloud, model-serving, and creative-software spend by workload
      instead of relying on a generic genAI headline.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      Segment-level expansion data showing which budgets convert from self-serve experimentation into reserved
      enterprise or platform spend.
    whyItMatters: >-
      The public sources identify buyer archetypes, but not which segment produces the best retention, payback, or
      budget durability.
    diligencePath: >-
      Ask management for cohort data by customer segment, reserved-capacity uptake, and representative ROI cases tied to
      real production workloads.
    relatedQuestionRefs:
      - QM003
      - QM007
  - type: missing-source
    severity: material
    topic: win-loss-data
    missingEvidence: >-
      Neutral customer win/loss or workload-routing evidence showing when buyers keep Fal, multi-home, or churn to named
      alternatives.
    whyItMatters: >-
      Competitive durability is easier to underwrite with observed switching behavior than with vendor-authored
      comparisons.
    diligencePath: >-
      Request customer references, expansion/contraction cohorts, and named case studies on workload routing versus
      Replicate, RunPod, self-hosting, and other substitutes.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Realized contract pricing, committed-use discounts, and margin effects for Fal versus managed and self-hosted
      substitutes.
    whyItMatters: >-
      Public list prices and review examples are directional, but they do not prove which platform wins on actual
      enterprise economics.
    diligencePath: >-
      Obtain live quotes, committed-use discount schedules, and anonymized production workload invoices across at least
      three deployment patterns.
    relatedQuestionRefs:
      - QP003
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, sales cycle, and channel economics by customer segment
    whyItMatters: These inputs are necessary to judge go-to-market efficiency and whether growth is buying uneconomic volume.
    diligencePath: Request board or finance materials with CAC payback, sales cycle, and partner-economics breakdowns.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Gross margin by product line, cloud spend by provider, and model-licensing cost structure
    whyItMatters: >-
      Fal's valuation depends on durable infrastructure economics, but public evidence exposes only list prices and
      supplier concentration.
    diligencePath: Request product-line gross margin, vendor-spend concentration, and model-licensing agreements or summaries.
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Cash balance, monthly burn, debt obligations, and management runway plan
    whyItMatters: Fundraising headlines do not prove current liquidity or time to the next financing event.
    diligencePath: Obtain current cash, debt, covenant, and runway schedules from finance leadership.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: aws-dependency
    missingEvidence: >-
      The AWS agreement terms, exclusivity boundaries, retained multi-cloud architecture, and unit economics of the
      preferred-cloud arrangement.
    whyItMatters: >-
      Cloud concentration and pricing terms directly affect margin durability, resilience, and negotiating leverage for
      an infrastructure business.
    diligencePath: >-
      Request the AWS partnership summary, current provider map, and internal reliability or cost dashboard segmented by
      workload.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: enterprise-controls
    missingEvidence: >-
      Independent support for SOC 2 scope, uptime history, incident rates, private-endpoint architecture, and control
      operation in production.
    whyItMatters: >-
      Enterprise-readiness claims matter only if they stand up to procurement review and are backed by operating
      evidence rather than marketing copy.
    diligencePath: >-
      Obtain the trust-center package, latest SOC 2 report, customer security questionnaire responses, and a 12-month
      availability incident log.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: developer-signal-gap
    missingEvidence: >-
      Public developer-signal proxies such as repository activity, package-distribution metrics, forum traffic, or
      partner engineering references.
    whyItMatters: >-
      Without external developer or practitioner telemetry, it is hard to test whether Fal's adoption quality and
      switching costs are stronger than the category narrative suggests.
    diligencePath: >-
      Gather GitHub or package-registry telemetry, partner implementation references, or community usage data from
      forums and technical talks.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: retention-proof
    missingEvidence: Public NRR, GRR, churn, renewal-rate, contract-length, or cohort-retention evidence.
    whyItMatters: >-
      Without durability metrics, it is impossible to judge whether Fal's adoption is sticky enterprise revenue or
      bursty usage-driven demand.
    diligencePath: >-
      Request cohort retention tables, renewal dashboards, or board metrics that separate self-serve usage from
      contracted enterprise accounts.
    relatedQuestionRefs:
      - QU005
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: Top-customer revenue share, top-10 concentration, and self-serve versus enterprise revenue mix.
    whyItMatters: Customer concentration and partner dependence directly affect downside risk and the quality of expansion revenue.
    diligencePath: >-
      Request an ARR bridge by cohort plus a concentration schedule showing top accounts, partner-sourced spend, and
      contract terms.
    relatedQuestionRefs:
      - QU006
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table
    missingEvidence: >-
      Customer-authored deployment case studies, procurement records, or outcome KPIs that verify the named accounts are
      live and production-level.
    whyItMatters: Logos and secondary lists do not prove production deployment, renewal, or material spend.
    diligencePath: >-
      Request at least three customer references or public case studies mapping buyer, use case, rollout status, and
      measurable KPI impact.
    relatedQuestionRefs:
      - QU003
      - QU004
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: enforcement-efficacy
    missingEvidence: >-
      Independent incident-rate, escalation-SLA, false-positive, false-negative, and appeal-volume reporting for
      trust-and-safety operations.
    whyItMatters: >-
      Without operating-quality metrics, the disclosed control stack is hard to underwrite as effective rather than
      merely well-described.
    diligencePath: Request a trust-and-safety metrics pack, independent audit summary, and sample post-incident review artifacts.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: financial-opacity
    missingEvidence: Audited or management-certified revenue, gross margin, burn, cash, and top-customer concentration disclosures.
    whyItMatters: The assigned third-party profiles disagree enough that valuation discipline and downside modeling remain unstable.
    diligencePath: >-
      Obtain board-report or investor-update metrics and reconcile them against public funding and workforce
      disclosures.
    relatedQuestionRefs:
      - QR006
      - QR007
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: cloud-concentration
    missingEvidence: Contract economics, reserved-capacity commitments, and dependency terms for AWS and premium GPU supply.
    whyItMatters: Cloud leverage and minimum commits can turn a growth advantage into a margin, liquidity, or service-level risk.
    diligencePath: Review the preferred-cloud agreement, GPU reservation terms, and any vendor concentration reporting.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: incident-history
    missingEvidence: >-
      Official status-history exports, root-cause analyses, and resolution timestamps for recent degraded-performance
      events.
    whyItMatters: >-
      A single recap proves an incident happened, but not whether the pattern is recurring or whether remediation was
      durable.
    diligencePath: Request status-page exports, postmortems, and customer communication logs for 2026 incidents.
    relatedQuestionRefs:
      - QR004
    relatedTableRefs:
      - TR002
  - type: conflicting-data
    severity: material
    topic: valuation-and-revenue
    missingEvidence: >-
      Audited revenue by period and recognition policy, ARR reconciliation, current gross margin, and primary documents
      for the latest priced financing or tender.
    whyItMatters: >-
      The scenario denominator and current price markers cannot be reconciled, so the public evidence does not support a
      precise entry valuation.
    diligencePath: >-
      Review audited financial statements, board-approved financing documents, tender materials, and a management
      reconciliation of revenue, run-rate revenue, and ARR.
    relatedQuestionRefs:
      - QV004
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Fully diluted cap table, option pool, liquidation preferences, participation rights, anti-dilution provisions, and
      transfer restrictions for primary and secondary shares.
    whyItMatters: Headline enterprise value does not determine common-share outcomes without dilution and preference terms.
    diligencePath: >-
      Obtain the current cap table, charter, investor-rights agreements, side letters, and transaction-specific term
      sheet directly from the company and lead investor.
    relatedQuestionRefs:
      - QV009
  - type: missing-source
    severity: material
    topic: comparable-quality
    missingEvidence: >-
      Like-for-like public or transaction comparables with verified revenue quality, growth, gross margin, customer
      concentration, and liquidity adjustments.
    whyItMatters: >-
      The available public and private reference companies differ materially from Fal, so their multiples are useful
      only as broad sensitivity bounds.
    diligencePath: >-
      Build a banker-supported comparable set and normalize each company to the same revenue period, growth metric,
      margin basis, and enterprise-value definition.
