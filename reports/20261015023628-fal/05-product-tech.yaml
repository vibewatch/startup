  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: aws-dependency
      missingEvidence: The AWS agreement terms, exclusivity boundaries, retained multi-cloud architecture, and unit economics of the preferred-cloud arrangement.
      whyItMatters: Cloud concentration and pricing terms directly affect margin durability, resilience, and negotiating leverage for an infrastructure business.
      diligencePath: Request the AWS partnership summary, current provider map, and internal reliability or cost dashboard segmented by workload.
      relatedQuestionRefs: [QE007]
    - type: private-evidence-only
      severity: material
      topic: enterprise-controls
      missingEvidence: Independent support for SOC 2 scope, uptime history, incident rates, private-endpoint architecture, and control operation in production.
      whyItMatters: Enterprise-readiness claims matter only if they stand up to procurement review and are backed by operating evidence rather than marketing copy.
      diligencePath: Obtain the trust-center package, latest SOC 2 report, customer security questionnaire responses, and a 12-month availability incident log.
      relatedQuestionRefs: [QE006]
    - type: missing-source
      severity: material
      topic: developer-signal-gap
      missingEvidence: Public developer-signal proxies such as repository activity, package-distribution metrics, forum traffic, or partner engineering references.
      whyItMatters: Without external developer or practitioner telemetry, it is hard to test whether Fal's adoption quality and switching costs are stronger than the category narrative suggests.
      diligencePath: Gather GitHub or package-registry telemetry, partner implementation references, or community usage data from forums and technical talks.
      relatedQuestionRefs: [QE008]
