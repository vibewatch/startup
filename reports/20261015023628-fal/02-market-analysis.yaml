          note: "Useful workflow threshold for video, but still vendor-stated."
          claimRefs: ["CM011", "CM012"]
        - label: "Entry pricing"
          displayValue: "$0.04/sec promo; $0.08/sec list"
          note: "Launch pricing for one 768p video model rather than the whole platform."
          claimRefs: ["CM012"]
    approximationNotes: >-
      Layers mix supply, adoption, throughput, performance, and pricing because
      no assigned source provides a direct public TAM/SAM/SOM for Fal's exact
      category; ordering shows narrowing commercial proof, not additive market
      math.
    claimRefs: ["CM005", "CM006", "CM011", "CM012", "CM014"]
callouts:
  - calloutType: "insight"
    title: "The served market is real, but public sizing is still lens-based"
    body: >-
      Public evidence is strongest on developer reach, enterprise adoption, and
      workload intensity; it is weakest on a clean top-down market-size number
      for generative-media infrastructure.
    claimRefs: ["CM005", "CM006", "CM014"]
  - calloutType: "risk"
    title: "Performance-led ROI still needs buyer-side validation"
    body: >-
      Fal's speed narrative is commercially important, especially for video
      workflows, but the most eye-catching latency claim in the assigned pool is
      still vendor-stated rather than independently wall-clock verified.
    claimRefs: ["CM011", "CM012"]
