            body: >-
              Lenskart 的轨迹从 2010 年纯电商创业公司，走到如今准备冲刺 $10B IPO 的印度最大全渠道眼镜平台。公司 2014 年转向线下零售、2021 年 SoftBank 入股、2022 年收购
              Owndays、FY25 实现盈利，以及 2025 年 7 月提交 DRHP，是最重要的拐点。公司 2025 年 5 月改制为公众有限公司，随后提交 DRHP，Peyush Bansal 又进行 IPO
              前股份交易，显示上市已近，预计在 2025 年底或 2026 年初落地。FY26，公司收入突破 ₹8,800 crore，全球门店达到 2,723 家，证明支撑 IPO 叙事的运营规模已经形成。Telangana
              工厂于 2025 年 2 月奠基，标志制造产能扩张进入下一阶段。
