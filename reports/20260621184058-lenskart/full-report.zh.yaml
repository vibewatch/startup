      - CV031
      - CV033
      - CV034
      - CV044
  - id: TV007
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 最终价格区间和锚定簿记
        - 精确 IPO 价格区间、锚定分配，以及上市后稳定机制。
        - 建议对价格高度敏感；没有实际公开入场点，就无法定稿。
        - 主承销商 / 最终 RHP / 锚定簿记披露。
      - - 正常化 FY26/FY27 盈利
        - 从报告利润到稳态经营利润和自由现金流的桥接。
        - 公开市场投资者最终会为盈利转化付费，而不只是收入增长。
        - CFO 尽调；上市后的季度公开申报。
      - - 内部人士二级交易测算
        - 精确股数、稀释基数，以及 2025 年 7 月内部人士交易背后的理由。
        - 需要核对 ₹8,700 crore 与媒体解读所隐含的约 ₹10,891 crore。
        - 股本结构表和转让文件。
      - - 锁定期和 OFS 压力
        - SoftBank、Temasek、Kedaara、Alpha Wave 和创始人上市后预计供给。
        - 二级出售偏重的股本结构，即便业务表现稳健，也会压制重估。
        - RHP 锁定期章节和股东协议。
      - - 公开可比公司监测
        - 按季度刷新 Warby、EssilorLuxottica 和 Titan 的倍数变化。
        - 如果同业降级，Lenskart 可接受的公开市场倍数也会压缩。
        - 持续交易可比公司仪表盘。
      - - AI / 智能眼镜变现
        - 证明可选性转化为收入或利润率，而不只是叙事。
        - 可选性是溢价案例的一部分，但尚未以公开市场方式变现。
        - 跟踪 FY27 发布、附着率和披露的利润率贡献。
    notes: 这些问题是从继续研究走向更明确承销判断的最短路径。
    claimRefs:
      - CV015
      - CV016
      - CV040
      - CV041
      - CV042
      - CV043
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 从创立（2010）到提交 DRHP（2025）以及 FY26 业绩的关键融资、运营和治理里程碑。
    data:
      items:
        - label: 创立
          detail: Valyoo Technologies 由 Peyush Bansal、Amit Chaudhary、Sumeet Kapahi 注册成立
