        title: 披露轨迹与备考口径叠加
        blocks:
          - type: paragraph
            body: >-
              最干净的起点是经审计合并记录，而不是管理层调整后的股东信。Lenskart 报告经营收入从 FY24 的 ₹5,427.7 crore 增至 FY25 的 ₹6,652.5 crore，再到 FY26 的
              ₹8,814.0 crore；报告税后利润则从 FY24 亏损 ₹10.2 crore，转为 FY25 盈利 ₹297.3 crore、FY26 盈利 ₹501.0 crore。Q4 FY26 报告收入达到
              ₹2,515.7 crore，较 Q4 FY25 的 ₹1,727.6 crore 同比增长约 45.6%。同一个 FY26 季度 / 年度，在近期 M&A 正常化后也按备考口径呈现，对应 FY26 收入
              ₹9,002.3 crore、调整后 PAT ₹530.0
              crore。这个区分很重要：备考桥接有助于理解当前运营方向，但法定承销应先锚定报告的经审计数字，再把备考数据作为运营镜头。公开第三方文章即便引用的是四舍五入或调整后数字，而不是精确申报数字，整体方向也大体一致。
