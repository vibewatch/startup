      - number: '6.4'
        title: 扩张、集中度与耐久性风险
        blocks:
          - type: paragraph
            body: >-
              国际领导力和本土广度看起来都可信，但耐久性风险集中在披露缺口和服务一致性。最常被重复的国际宣传——三个新加坡人中就有一个戴 Lenskart
              眼镜——在后续管理层评论中已经弱化为约四分之一，且未被任何独立国家级客户审计验证。印度方面，客户引擎仍高度依赖门店：IPO 募资用途包括新 CoCo 门店、租赁义务、营销和技术，门店本身也充当社区光学节点。如果
              NPS 维持高位，这很强；但这也意味着本地服务缺口、配送滑坡或保修摩擦，会削弱管理层明确依赖的推荐循环。最大未解尽调点是按 cohort 看留存质量：Lenskart 不披露 NRR、GRR、复购率或按渠道拆分的
              cohort 行为。底线是，对采用规模和渠道广度保持建设性，但在管理层分享 cohort 数据和更干净的国家级客户证据前，对购买后耐久性只能保持中等信心。
