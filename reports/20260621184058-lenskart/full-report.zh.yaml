            title: 把「Titan EyeCare 8x」视为代理指标，而不是可观察市场报价
            body: Titan 的眼镜收入公开，但该板块没有独立公开估值。因此，任何 8x 基准都应作为思考实验使用，而不是作为已报价可比公司。
            calloutType: assumption
