      - number: '5.4'
        title: 品牌与差异化
        blocks:
          - type: paragraph
            body: >-
              Lenskart 的组合策略不是为了品牌数量本身而铺开；申报文件清楚显示，公司用品牌分层覆盖高端、可负担高端、时尚导向和儿童专属使用场景。John Jacobs 和 Owndays 位于高端，Vincent
              Chase 锚定快时尚价值，Hooper 则围绕儿童耐用性和舒适性定位。这一点在技术上重要，因为同一套垂直一体化设计与制造底座，可以在控制成本和质量的同时快速更新系列。DRHP 还指出公司拥有 241
              个商标，包括 John Jacobs 和 Vincent Chase；这增加了 IP 深度，尽管试戴或诊断相关的公开专利级细节仍有限。Owndays
              组合增加了地域触达，也让计算机视觉和全渠道栈更容易在亚洲输出；John Jacobs 等专属品牌页面则强化了一个事实：分层不只是投资者文件中的描述，也活在实际商业表面中。
