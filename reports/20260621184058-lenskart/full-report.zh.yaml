            body: >-
              Lenskart 已不再是单一市场创业公司，但证据仍显示，印度是这个故事中最关键的盈利和门店密度引擎。基于 DRHP 的报道显示，FY25 印度约占收入 60%，在 FY26 Q1 和 Q3
              仍是更大的地理市场；同店增长和首次验光创造在印度最强。需求健康时，这种集中可以是优势；但它也意味着，如果本土零售环境转弱、服务摩擦增加，或在位者更激烈地用价格回应，海外规模尚不足以完全缓冲冲击，业务会先受到影响。竞争背景并非假设：6Wresearch
              仍把 Titan Eyeplus 和 EssilorLuxottica India 列为主要有组织玩家，两者都拥有成熟上市公司的披露、资本和品牌优势。因此，Lenskart
              必须在不牺牲服务或单位经济的前提下扩大市场份额和国际占比，因为单纯门店数量增长本身，无法中和国家或竞争对手集中度。
