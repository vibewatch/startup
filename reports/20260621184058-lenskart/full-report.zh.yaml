            body: >-
              Lenskart 仍高度依赖 Peyush Bansal：他既是创始人、CEO、公开市场叙事者，也是
              AI、扩张和招聘的内部推动者。公司处于私有、增长灵活时，这种集中度可管理；但一旦公司要求公开市场投资者按高估值承销大型消费科技 IPO，重要性就上升。发行结构强化了这种张力：新股发行相对 OFS
              较小，创始人与早期投资者部分套现，公开募资用途则偏运营扩张，而不是资产负债表防御。同时，记录中已经有现实治理和监管问题，包括加盟商就披露质量向 SEBI 投诉，以及一项与进出口申报相关、尚未解决的 ED/FEMA
              事项。实际含义是，Lenskart 无法把关键人物依赖、治理质量和 IPO 执行拆开看；三者现在共同影响同一个估值和可信度结果。
