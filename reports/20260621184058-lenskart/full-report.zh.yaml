      - number: '8.2'
        title: 融资背景与 IPO 架构
        blocks:
          - type: paragraph
            body: >-
              IPO 结构很关键，因为它同时决定摊薄程度，以及市场实际给公司注入多少新钱。公开报道口径基本一致：交易包括 ₹2,150 crore 新股发行，以及约 13.2-13.23 crore 股
              OFS。如果整笔交易落在 ₹7,500-8,000 crore 左右，新资本只占约
              27-29%；其余部分是在给现有股东提供流动性。这并不否定交易本身，但会改变框架：投资者不只是资助未来增长，也是在承销创始人和现有支持者的一次大规模变现。


              新募集资金用途并不含糊。草案文件报道列出了具体投向：新开公司自营门店、现有网络的租赁与租金义务、技术和云基础设施、品牌营销。对一家全渠道零售商来说，这些用途合理，也支撑了一个判断：Lenskart
              正在用规模扩大分销，并把价值链更多环节自动化。即便如此，偏重老股出售的结构通常会削弱新资金投资者用「纯增长资本」解释高溢价的空间。


              IPO 前二级交易也留下一个尚未解开的信号。Economic Times 将 Peyush Bansal 2025 年 7 月的购买解读为约 ₹8,700 crore 隐含价值；NDTV Profit
              则用同样的每股 ₹52 背景，推导出约 ₹10,891 crore 的更高隐含价值。这个差异不改变 $8-10B IPO
              的核心争议，但会影响承销纪律，因为它让人看不清内部人相对最终公开要价到底买得有多积极。在完全摊薄股本数学被核清前，这类二级交易应只被视为内部人支持的方向性证据，而不是干净的估值锚。
            claimRefs:
              - CV003
              - CV005
