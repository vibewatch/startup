      - number: '7.4'
        title: 缓释因素确实存在，但只有多元化尽快变成可衡量结果才管用
        blocks:
          - type: paragraph
            body: >-
              Lenskart 的缓释因素站得住：国际收入在增长，海外利润率在改善，门店扩张靠经营现金流供血；在业务完全上市前，管理层也在补产能、加 AI
              工具、扩充人才梯队。这些不是表面功夫。问题在节奏。投资者需要相信，公司能一边扩工厂、开门店、做 AI
              产品、推进全球运营，一边收紧上市公司治理，还要消化法律或监管噪音。因此，投资逻辑更可能败在几个可监控触发点，而不是叙事本身：出现重大披露或 ED
              升级；中国采购仍卡在当前水平且没有可信的多元化路径；Bhiwadi-Gurugram 发生重大中断；国际收入占比改善放慢；Titan、EssilorLuxottica
              或其他有组织竞争者在价格或服务上明显反击。如果这些触发点保持安静，同时 Telangana 和海外组合改善，当前风险折价应会收窄；否则，IPO 倍数可能迅速回落。
