      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              印度有组织眼镜零售的主要买方包括 18-45 岁城市中产消费者（按销量最大）、追求品牌镜架的高端 / 时尚意识消费者、受屏幕时间和认知提升驱动的首次眼镜用户，以及通过员工健康计划采购的企业 / 机构买方。买方 -
              用户 - 付款方关系会变化：个人消费者通常同时是买方、用户和付款方；企业眼健康项目中，雇主付款，员工使用；儿童眼镜则由父母购买并付款。大多数购买来自个人可支配收入预算（处方眼镜平均客单价
              ₹2,000-5,000），部分高端购买由健康保险承担，B2B 项目则来自企业健康福利预算。采用触发点包括首次视力问题诊断（近视通常在 15-25 岁）、生活方式 / 时尚诉求，以及更换周期（处方变化平均 2-3
              年）。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
