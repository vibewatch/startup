      - number: '8.3'
        title: 上市可比公司与倍数差距
        blocks:
          - type: paragraph
            body: >-
              压测 Lenskart 最干净的方法，是把 IPO 目标与公开市场可观察的销售额倍数放在一起。Warby Parker 是最接近的数字优先眼镜零售可比公司，虽然规模更小且只在美国。公开数据源显示，2026 年中
              Warby 市值约 $3.18-3.19 billion，过去十二个月收入约 $0.89 billion，对应约 3.6x 销售额。EssilorLuxottica
              完全是另一类公司——全球化、成熟、批发占比高、盈利能力强得多——但它仍是这个行业的公开市场锚。2026 年中数据给出的市值约 $92 billion，收入约 €28.49 billion / $35
              billion，EV/收入倍数接近 3.0x。


              Titan 提供了一个印度上市消费品基准，但必须谨慎使用。Titan 母公司市值约 ₹3.93 trillion，收入约 ₹875.84 billion，对应约 4.5x 母公司销售额。其 EyeCare 板块
              FY26 收入约 ₹9.16 billion，可作为印度有组织眼镜零售的规模参照；但 Titan EyeCare 并没有独立业务的公开市值报价。因此，任何「Titan 眼镜业务
              8x」数字都是分析师代理指标，不是可观察的公开市场倍数。


              放在这个背景下，Lenskart 的定价缺口很难忽视。$6.1 billion 私募估值相对这些可比公司已经有溢价，但成长型私营公司仍可能为这个溢价辩护。$8-10 billion IPO
              区间则要求公开市场投资者在公司从私募转入公开审视后，再支付更厚一层溢价。这不代表 IPO
              不能完成；它意味着举证责任明确转到管理层身上：收入复合增长、利润率转化和国际扩张必须跑赢当前上市可比公司集合已经反映的预期。
