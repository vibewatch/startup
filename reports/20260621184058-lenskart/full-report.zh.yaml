      - number: '2.5'
        title: 测算缺口与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              市场规模估计存在显著差异。Lenskart 自身 DRHP 引用印度眼镜市场 $9 billion，而 Titan 投资者材料提到其可服务细分市场为 $3.4 billion。分析师报告从
              $4.1B（仅眼镜，2024 年）到 $11.1B（所有眼镜品类，2025 年）不等。差异来自口径不同：是否只包括处方眼镜、是否只看有组织市场还是包含非组织化总市场、采用零售价值还是制造商收入。最保守的
              $3.5-4B 估计，反映的是 Lenskart 和 Titan 等连锁可触达的有组织零售市场；$9-11B 数字则纳入非组织化部门和所有产品品类。估值时，如果 Lenskart
              能系统性转化非组织化市场份额，$9-11B TAM 是合理口径；但按当前渗透率，短期可服务市场对有组织玩家更接近 $4-5B。
            claimRefs:
              - CM018
              - CM019
              - CM020
              - CM006
