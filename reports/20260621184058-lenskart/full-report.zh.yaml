      - number: '6.2'
        title: 全渠道渠道与国际足迹
        blocks:
          - type: paragraph
            body: >-
              客户获取模式毫无疑问是全渠道，但并不对称。门店仍是验光、试戴、取货、维修和服务的实体信任层；数字界面则推动发现、筛选和辅助转化。管理层披露，FY26 印度收入约 50% 受数字渠道影响，高于 FY25 的约
              45%，但仍未发布清晰的线上与线下入账收入拆分。这很重要，因为即便旅程从线上开始，经济性很可能仍依赖门店作为转化和服务枢纽。足迹扩张快到造成指标混乱：FY25 和 IPO 期间综合材料仍引用约 2,723
              家全球门店，而 FY26 股东信报告 3,327 家活跃门店，其中 718 家在国际市场。海外最强证据来自新加坡和更广泛的 Owndays 相关亚洲足迹：FY25 印度以外业务拥有 656 家门店、2.47
              million 名交易客户，并贡献集团收入近 40%；Q4 FY26 的增长仍被描述为由新加坡、泰国和阿联酋的同店与线上共同驱动。
