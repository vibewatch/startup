      - number: '8.4'
        title: 情景区间与否决触发点
        blocks:
          - type: paragraph
            body: >-
              Lenskart 正从私募估值进入公开市场定价发现，情景框架比单点估值更有用。牛市情景下，投资者继续给接近 IPO 的溢价，因为 Lenskart 维持 25%+ 收入增长，证明 FY26
              现金生成不是一次性事件，并继续靠门店效率和自动化推高利润率。这支持约 $9.5-10.5 billion 估值。基准情景下，市场认可 Lenskart 是一家高质量零售商，但并不认为它能脱离品类约束，于是按
              FY26 销售额 6-7x 定价，对应约 $6.3-7.4 billion——更接近 Fidelity 最近已知估值，而不是 IPO 传闻上沿。


              熊市情景不是「业务坏掉」，而是「倍数压缩」。如果投资者盯住正常化盈利、一次性收益，以及交易中大比例老股出售，Lenskart 可能被重估到更接近公开同业平价的位置，约为销售额 3.5-4.5x，或约
              $3.7-4.7 billion。这仍是一门有分量的生意，但如果 IPO 买家按讨论区间上沿进场，下行空间会很清楚。


              按 25% 牛市、50% 基准、25% 熊市加权，中心价值约为 $6.8 billion。这并不是说 Lenskart
              在任何价格都被高估；它说明，合理私募价值与激进公开市场要价之间的差距太大，无法忽略。主要否决触发点很直接：上市后增长跌破 20% 中段，正常化利润率无法向上收敛，锁定期结束后创始人或大投资者持续卖出。
