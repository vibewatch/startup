      - number: '4.2'
        title: 收入模型、定价与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              公开披露支持的是全渠道零售模式，而不是软件式经常性收入模式。FY25 年报披露显示，核心引擎仍是商品销售，并由服务、租赁收入和小额其他经营收入线补充。第三方 IPO 前报道和管理层信件显示，FY25 约 40%
              收入来自国际市场；FY26 经审计分部数据则显示印度为 ₹5,260.1 crore，国际为 ₹3,606.0 crore。经济性方面，管理层披露 H1 FY26 产品利润率 69.2%，国际产品利润率
              75.7%，营销成本占收入比从 FY23 的 9.7% 降至 7.5%，印度门店层面 EBITDA 利润率约 33%，门店回本周期低于 12 个月。FY26 印度收入中，₹10,000 以上高端订单占比升至
              20.5%；管理层称印度 ASP 历史上约为 ₹1,760，后因 New Lens Replacement 活动暂时把 Q4 FY25 ASP 压低至 ₹1,609。FY26
              印度收入约一半受数字渠道影响。这些数据点支撑了可信的运营杠杆故事，但折扣后的实际净定价、分 cohort CAC，以及按地区拆分的毛利率，公开材料仍未披露。
