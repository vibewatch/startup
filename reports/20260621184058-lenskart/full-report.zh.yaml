            body: >-
              第二个主要风险簇是运营。Lenskart 确实拥有垂直一体化优势，但同一模式也制造了集中故障点。公开 IPO 报道称，公司仍从中国采购大量原材料，包括通过 Baofeng Framekart
              合资企业采购；原材料也仍占总费用的有意义比例。因此，外汇、贸易政策、货运或供应商可靠性扰动，会直接传导至利润率和库存风险。制造也尚未完全多元化：Bhiwadi
              仍是披露中最大的工厂，Gurugram-Bhiwadi 集群被明确点名为集中风险，用于拓宽产能的 Telangana 工厂仍在建设中。除此之外，消费者法院关于保修和促销纠纷的裁定说明，服务控制不是抽象问题。随着
              Lenskart 推进 AI 驱动验光、当日达和智能眼镜，隐私、产品治理和售后控制都变成运营风险表面的一部分，而不是边缘议题。
