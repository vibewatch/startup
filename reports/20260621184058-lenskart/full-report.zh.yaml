      - number: '5.5'
        title: 质量控制、风险与未解技术问题
        blocks:
          - type: paragraph
            body: >-
              Lenskart 的公开流程纪律强于许多消费创业公司，但风险图谱依然真实。HTO 流程有明确临床边界，这是积极信号，因为它说明公司没有把所有眼部问题都包装成可远程解决。制造端使用计算机视觉和 SOP
              审计，申报文件也提到镜架缺陷保修，说明质量治理较为结构化。与此同时，远程验光模式把临床判断集中到 AI
              辅助的中心化流程中；独立报道提示，如果规模跑在控制之前，可能带来责任和预防性护理担忧。智能眼镜路线图引入第二类信任风险：带摄像头的 AI 眼镜带来隐私问题，而公开材料目前还没有详细回答。最大的尽调缺口不是
              Lenskart 是否使用 AI——它显然在用——而是当这些系统从商品辅助走向临床或社会敏感流程时，公司能否披露更强证据，说明模型治理、聊天机器人架构、质量错误率和隐私控制。
