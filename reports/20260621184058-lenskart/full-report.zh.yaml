        title: 规模与运营
        blocks:
          - type: paragraph
            body: >-
              截至 FY26，Lenskart 全球运营 2,723 家门店，FY26 净新增 603 家门店（印度 542 家）。公司 FY26 收入达到 ₹8,814 crore（按当时汇率约 $1.05B），较 FY25
              的 ₹6,652.5 crore 同比增长 32%。Lenskart 在 FY25 首次实现全年盈利，净利润 ₹297 crore，FY26 增至 ₹501 crore。公司位于 Rajasthan 邦
              Bhiwadi 的自动化制造工厂雇佣 3,000+ 名员工，采用机器人、计算机视觉和 AI 驱动质检等 Industry 4.0 技术。第二座更大的工厂正在
              Telangana（Hyderabad）建设，被描述为全球最大的眼镜制造设施，承诺投资 ₹1,500 crore。随着印度本土制造规模扩大，FY25 产品利润率达到 68.5%。公司 Q4 FY26 单体收入为
              ₹2,516 crore，同比增长 46%。
