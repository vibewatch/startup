      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              印度眼镜市场的关键增长驱动包括近视率上升（城市儿童中预计 2030 年达到 32%，2019 年为 21%）、数字屏幕时间增加、Tier-2/3
              城市可支配收入提升、把眼镜当成配饰而非医疗器械的时尚意识增强、政府眼健康行动，以及从非组织化向有组织零售的持续迁移。采用约束包括印度农村对视力矫正需求认知低（农村地区有屈光不正的青少年中 86%
              未矫正）、低收入人群价格敏感、都市圈以外验光师供给有限、部分社群对戴眼镜存在文化污名，以及本地非组织化眼镜店主导市场，这些眼镜店提供赊账和个性化服务。监管环境整体有利，基础眼镜不存在处方壁垒，不过隐形眼镜被归为医疗器械会增加合规复杂度。
            claimRefs:
              - CM013
