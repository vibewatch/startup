        title: 图表
        blocks:
          - type: callout
            title: 主要风险是倍数压缩，不是业务崩塌
            body: IPO 买家不需要等到 Lenskart 运营失望才会亏钱；只要交易倍数比拟议价格区间假设的更接近公开同业，就足够造成损失。
            calloutType: risk
            claimRefs:
              - CV007
