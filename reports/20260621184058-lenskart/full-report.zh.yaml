      - number: '4.3'
        title: 资本充足性、现金生成与融资背景
        blocks:
          - type: paragraph
            body: >-
              资本充足性强于 FY24 标题数字可能传递的印象。管理层披露 FY26 经营现金流为 ₹886.7 crore，营运资本释放 ₹98.3 crore，FY26 期末净现金为 ₹3,880.8 crore（不含
              IPO 相关应付款和应计利息）。股东信明确称，经营现金流支撑了 603 家净新增门店和制造 capex；即便偏负面的卖方风格评论也承认，当前争论更多围绕资本强度，而不是即时流动性。IPO 本身于 2025 年
              11 月 10 日上市，总发行规模约 ₹7,278.0 crore，其中新股发行 ₹2,150 crore，其余为出售老股。截至 2026 年 3 月 31 日，新股发行募集资金仅使用 ₹177.1
              crore。IPO 前后，公开市场背景改善：截至 2025 年 4 月 30 日，Fidelity 将 Lenskart 估值标记为 $6.1 billion；多家媒体描述 IPO 目标为以 $8-10
              billion 估值募资约 $1 billion。Economic Times 还报道，自成立以来累计募资接近 $2 billion（含二级交易），足以支持“生命周期融资超过 $1 billion”的表述。
