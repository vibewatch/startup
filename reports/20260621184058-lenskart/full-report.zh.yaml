      - number: '2.2'
        title: TAM/SAM/SOM 测算
        blocks:
          - type: paragraph
            body: >-
              多个分析师估计，印度 2025 年整体眼镜市场（TAM）为 $9.5-11.1 billion，预计到 2034 年 CAGR 为 10.8-12%。眼镜片 / 眼镜框细分市场本身估计为 $4.1
              billion（2024 年），按零售价值约占总市场 45%。全球眼镜市场 2025 年规模为 $174-182 billion，CAGR 为 11.3%。印度有组织眼镜零售（线上和实体连锁门店）的 SAM 约为
              $3-4 billion，因为有组织零售只服务总市场需求的 30-40%。按 Lenskart FY26 印度收入约 ₹5,300 crore（~$630M）测算，其 SOM 大致对应印度总眼镜市场的
              6-8%，以及有组织市场的 15-20%。关键测算约束是非组织化市场份额巨大；即便只把 10% 的非组织化需求转向有组织零售，也意味着 Lenskart 单独可获得 $600-700M 机会。
            claimRefs:
