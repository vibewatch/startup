            body: >-
              客户证明存在，但质量参差不齐，有时还互相矛盾。官方口径下，印度 NPS 在 Q4 FY26 达到 81.4，全年为 79.8，Gold 活跃会员达到 8.8
              million，管理层称口碑带来大多数新客户。这些都是满意度和复购意愿的强信号。独立公开证据则严厉得多。Trustpilot 2026 年 2 月归档快照给 lenskart.com 评分
              1.7/5；PissedConsumer 基于 164 条评论显示 1.4/5；SmartCustomer 汇总为 1.9 星；ConsumerComplaints 和 ComplaintsBoard
              反复出现退款、配送延迟、保修纠纷、产品质量，以及门店或客服响应迟缓等问题。正确综合不是认定其中一方必然错误。更像是 Lenskart
              在规模化顶部漏斗品牌和服务承诺上交付很强，但购买后执行波动显著。对处方眼镜而言，这种波动比许多零售品类更重要，因为度数错误、佩戴不合、退款延误或保修处理差，会直接影响客户是否复购或推荐。
