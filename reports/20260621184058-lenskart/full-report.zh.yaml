    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Lenskart Solutions Ltd（原 Valyoo Technologies Pvt Ltd）是印度最大的全渠道眼镜零售商，总部位于印度 Haryana 邦 Gurugram。公司 2010
              年成立，跑通了垂直一体化模式，横跨电商、2,700+ 家线下零售门店、内部镜片和镜架制造，以及 AI 驱动的眼科诊断。Lenskart 通过自有品牌（Vincent Chase、John
              Jacobs、Hooper）和授权国际品牌销售处方眼镜、太阳镜和隐形眼镜。公司的新加坡实体 Lenskart Solutions Pte Ltd 历史上曾作为母控股公司；不过印度实体 Lenskart
              Solutions Ltd 在 2025 年 5 月改制为公众有限公司后，成为主要上市主体。Lenskart 通过线上和线下渠道的 DTC 零售销售变现，FY25 约 60% 收入来自印度，40%
              来自国际业务，包括新加坡、日本（通过 Owndays 子公司）、阿联酋和东南亚。
