        - 要求按城市和产品类别披露眼检到购买、首单和复购转化
      - - 3,327 家门店的全渠道网络
        - 客户体验会因本地门店、员工和服务补救质量而显著波动
        - 如果服务执行滑坡，即便官方 NPS 很高，转介绍引擎也会走弱
        - 要求按门店形态和区域披露投诉结案率、服务 TAT 和保修结果
      - - 约 40% 收入来自国际业务
        - 国家层面的客户数量和 NPS 大多未披露
        - 难以判断海外经济性是否依赖新加坡、日本等少数突出市场
        - 要求按国家披露交易客户账户、同店增长和按区域 NPS
      - - 新加坡旗舰市场
        - 三分之一或四分之一渗透率说法未经审计，且前后口径不一致
        - 如果分母松散，旗舰国际样板可能被高估
        - 要求经审计的活跃客户数量，以及新加坡市场领先地位的精确定义
      - - 数字化需求生成
        - 虽披露数字化影响，但线上与线下确认收入拆分缺失
        - 没有清晰渠道结构，就难判断各渠道 CAC 和利润率
        - 要求按线上、门店和协助式全渠道旅程拆分订单和收入
      - - Gold 会员和转介绍
        - Gold 规模已披露，但续费、更换周期和客户队列留存未披露
        - 忠诚度可能比表面会员数更浅
        - 要求 12-24 个月 Gold 续费、复购和镜片更换客户队列
    notes: 主要客户风险不是需求不足，而是 Lenskart 在门店、地域和售后复杂度扩张快于客户队列数据披露时，能否守住转介绍驱动的满意度。
