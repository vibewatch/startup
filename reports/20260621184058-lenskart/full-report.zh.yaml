  - id: TV006
    title: 论点破裂与退出触发因素
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对估值的传导
      - 行动含义
    rows:
      - - 上市后增长放缓
        - 收入增速明显低于 20% 中段，且没有利润率扩张抵消。
        - 高倍数增长溢价快速压缩。
        - 重估至同业倍数；不要只凭叙事加仓。
      - - 正常化盈利不及预期
        - 剔除一次性收益后，核心 PAT 利润率仍低于约 3%。
        - IPO 估值对公开市场投资者而言过于轻盈利。
        - 重置基准价值，并将溢价视为投机。
      - - 二级供给压力
        - 大股东在锁定期届满时或刚届满后继续卖出。
        - 供给压力压制倍数扩张，并削弱公开市场稀缺价值。
        - 在承销上行前，等待供给被吸收。
      - - 国际执行摇摆
        - 海外收入占比停止复利增长，或整合经济性恶化。
        - 平台溢价收窄；市场回到仅印度零售框架。
        - 下调牛市概率，并重新审视公开可比公司组。
      - - 治理 / 披露噪音
        - 内部人士定价叙事相互冲突，或季度透明度持续偏弱。
        - 抬高公开市场投资者的折现率和信任成本。
        - 入场前要求更宽的安全边际。
    notes: 触发因素聚焦估值传导，而不是泛泛的经营风险。
    claimRefs:
