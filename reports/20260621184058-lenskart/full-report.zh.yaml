            title: 价格或证据改善前继续研究
            body: 最清晰的上调路径，要么是更低的公开市场入场倍数，要么是上市后几个季度的证据，证明 Lenskart 能维持高增长，并把更多增长转成正常化盈利。
            calloutType: recommendation
