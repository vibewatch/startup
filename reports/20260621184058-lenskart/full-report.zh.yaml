    rows:
      - - 正方
        - FY26 收入突破约 ₹90B，门店扩张由现金支撑，证明了真实零售规模。
        - 上市后收入增速若明显低于 20% 中段，规模论点会走弱。
      - - 正方
        - 69% 毛利率、垂直整合和自动化，共同支撑一个可信的高品质零售故事。
        - 如果正常化盈利未随规模提升，毛利率故事本身不够。
      - - 正方
        - 国际敞口和庞大存量门店，让公司叙事比印度本土眼镜连锁更接近平台。
        - 如果海外增长放缓，或整合经济性不及预期，平台溢价会收窄。
      - - 反方
        - IPO 要价对应 7.6-9.5x FY26 销售额，高于 Warby Parker、EssilorLuxottica 和 Titan 母公司的销售倍数。
        - 更低入场点，或上市后异常强劲的复利增长，会缓解倍数差距。
      - - 反方
        - 反向来源认为，FY25 利润质量被一次性收益和售股股东大量参与美化。
