      - CE041
      - CE043
  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    layout: wide
    summary: 公开证据显示，核心眼镜电商和制造自动化成熟度最高；对话式 AI、隐私控制和质量指标披露的透明度更低。
    data:
      columns:
        - 商业成熟度
        - 自动化深度
        - 公开证明深度
        - 风险可见度
      rows:
        - label: 核心眼镜目录
          values:
            - 高
            - 中
            - 高
            - 低
        - label: AR 试戴 / 面部分析
          values:
            - 高
            - 中
            - 中
            - 中
        - label: 远程验光
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 制造 + 智能仓库
          values:
            - 高
            - 高
            - 中
            - 中
        - label: 对话式 AI / AI 眼镜
          values:
            - 中
            - 中
            - 中
            - 高
    approximationNotes: 评级只反映保留的公开证据，不是内部采用率、正常运行时间或毛利率评分。
