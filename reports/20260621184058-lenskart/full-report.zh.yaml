              - CM019
              - CM020
          - type: callout
            title: 非组织化转向有组织化是关键杠杆
            body: 最重要的增长驱动不是市场扩容，而是市场正规化——靠更好服务、价格透明和便利性，把 60-70% 的非组织化眼镜店份额转向有组织连锁。
