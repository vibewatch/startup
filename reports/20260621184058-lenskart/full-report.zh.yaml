      - number: '5.3'
        title: 制造与履约引擎
        blocks:
          - type: paragraph
            body: >-
              Lenskart 最强的产品技术差异化，是把设计、镜片生产、镜架制造、分销和质控耦合在一起。DRHP 称，公司 2021 年开始内部生成镜架结构、模具、镜片设计和制造，Bhiwadi
              工厂在质检阶段前运行全自动镜片表面加工线。Mint 补充称，Bhiwadi 把镜片实验室、镜架制造和面向太阳镜等专用 SKU 的高度自动化配送中心结合起来，Addverb
              则提供机器人、AI、机器学习、深度学习、计算机视觉和 IoT 系统。这是留存证据集中最清晰的 Industry 4.0
              风格证据：软件引导生产、机器视觉、自动化存储与取货、数字吞吐管理，都存在于同一个运营系统中。正在建设的 Telangana
              工厂会把该模式扩展到一体化镜架、镜片和眼镜制造，并叠加高自动化；但它今天仍是面向未来的产能项目，而不是已被证明的生产节点。
