  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 以发生概率和影响程度观察主要剩余风险，创始人集中、中国相关采购和制造集中度落在最高风险格。
    approximationNotes: 位置为定性判断，依据有来源支撑的剩余风险敞口，而非统计损失模型。
    claimRefs:
      - CR002
      - CR010
      - CR021
      - CR025
      - CR036
      - CR043
      - CR044
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
        - 关键影响
      rows:
        - label: 高概率
          values:
            - label: n/a
              tone: neutral
            - label: 消费者服务失误
              tone: warning
            - label: 印度集中度持续
              tone: warning
            - label: 中国投入品 / 汇率压力
              tone: negative
        - label: 中等概率
          values:
            - label: 轻微 IP 纠纷
              tone: neutral
            - label: AI 隐私反弹
              tone: warning
            - label: 竞争挤压利润率
              tone: warning
            - label: 创始人 / IPO 执行失误
              tone: negative
        - label: 低概率
          values:
            - label: n/a
              tone: neutral
            - label: 加盟治理风波
              tone: warning
            - label: Telangana 爬坡延误
              tone: warning
            - label: ED / 披露升级
              tone: negative
        - label: 极低概率
          values:
            - label: n/a
              tone: neutral
            - label: n/a
              tone: neutral
            - label: 医疗器械规则冲击
              tone: warning
            - label: Bhiwadi-Gurugram 多站点中断
              tone: negative
  - id: FR002
    title: 影响时间线
    type: timeline
    layout: wide
    summary: 公开节点显示，进入 FY27 前，制造多元化、IPO 准备、监管摩擦和 AI 产品推出层层叠加。
    approximationNotes: 时间线只采用保留公开来源可见的事件，因此不包含私下整改或董事会行动。
    claimRefs:
      - CR006
      - CR007
      - CR010
      - CR028
      - CR034
      - CR046
    data:
      items:
        - date: 2024-12
          label: Telangana 工厂计划公开
          detail: Lenskart 签署 Rs 1,500 crore Telangana MoU，但工厂仍是推进中的缓释项，还不是已经投入使用的多元化产能。
          tone: warning
          claimRefs:
            - CR026
            - CR028
        - date: 2025-07
          label: DRHP 与偏重印度的扩张计划
          detail: IPO 计划把新增资本投向更多印度门店、租赁和技术，而不是简单修复资产负债表。
          tone: warning
          claimRefs:
            - CR006
            - CR020
        - date: 2025-08
          label: 加盟商向 SEBI 提出披露疑虑
          detail: 一起公开投诉把治理和流程风险直接写进 IPO 叙事。
          tone: negative
          claimRefs:
            - CR008
            - CR009
        - date: 2025-10
          label: RHP 披露印度和加盟集中度
          detail: 更新后的 IPO 报告仍显示印度是更大的收入地区，加盟店在网络中仍占有意义的一块。
          tone: warning
          claimRefs:
            - CR014
            - CR047
        - date: 2026-02
          label: 国际增长改善，但投入品敏感性仍在
          detail: FY26 Q3 国际业务占比达到 40%，但材料成本仍吃掉大块费用。
          tone: warning
          claimRefs:
            - CR015
            - CR024
        - date: 2025-10
          label: ED 调查未结，RHP 生效
          detail: 公开市场发行继续推进，记录里仍挂着未解决的进出口合规压力。
          tone: negative
          claimRefs:
            - CR007
            - CR010
        - date: 2026-05
          label: AI 眼镜与 3,327 家门店规模扩大控制面
          detail: 智能眼镜推出，叠加更大的全渠道版图，同时拉高隐私、服务和执行要求。
          tone: warning
          claimRefs:
            - CR017
            - CR018
            - CR034
            - CR046
        - date: 2026-05
          label: FY26 收官，印度布局更深
          detail: FY26 结束时，Lenskart 新增 603 家门店和 157 个城市，触达更广，但执行仍集中在零售网络里。
          tone: warning
          claimRefs:
            - CR017
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: Lenskart 是一家质地不错的成长公司，但当前 IPO 传闻估值要求公开市场投资者提前支付太多未来价值。
    data:
      nodes:
        - id: scale
          label: FY26 规模
          detail: ₹90.0B 收入、净增 603 家门店，经营现金流支撑扩张
        - id: quality
          label: 业务质量
          detail: 69% 毛利率和垂直整合的全渠道模式
        - id: premium
          label: 溢价有一定道理
          detail: $6.1B 私募估值 = ~5.8x 销售额
        - id: public-gap
          label: 公开市场定价缺口
          detail: $8-10B IPO 传闻 = ~7.6-9.5x 销售额，高于更低的上市同业倍数
        - id: decision
          label: 建议
          detail: 继续研究 / 在价格或证据改善前估值偏紧
      edges:
        - from: scale
          to: quality
          label: 支撑
        - from: quality
          to: premium
          label: 换得
        - from: premium
          to: public-gap
          label: 但
        - from: public-gap
          to: decision
          label: 推动
    approximationNotes: 逻辑链把多变量承销判断简化为主要估值传导步骤。
    claimRefs:
      - CV006
      - CV007
      - CV010
      - CV033
      - CV041
  - id: FV002
    title: 销售倍数对比
    type: bar
    layout: wide
    summary: Lenskart 的私募和 IPO 估值高于可观察的上市眼镜与零售可比公司组。
    data:
      items:
        - label: Warby Parker（TTM）
          value: 3.6
        - label: Warby Parker（FY26 指引）
          value: 3.3
        - label: EssilorLuxottica（EV/Rev）
          value: 3
        - label: Titan 母公司销售额
          value: 4.5
        - label: Lenskart 私募估值
          value: 5.8
        - label: Lenskart IPO 低端
          value: 7.6
        - label: Lenskart IPO 高端
          value: 9.5
    approximationNotes: 数值为四舍五入后的倍数，来自公开市场数据来源和 Lenskart FY26 收入。
    claimRefs:
      - CV021
      - CV025
      - CV027
      - CV029
      - CV035
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 情景区间刻画 Lenskart 进入公开市场价格发现后，还剩多少下行或上行空间。
    data:
      items:
        - label: 熊市情景
          low: 3.7
          high: 4.7
        - label: 基准情景
          low: 6.3
          high: 7.4
        - label: 牛市情景
          low: 9.5
          high: 10.5
        - label: 当前私募估值
          low: 6.1
          high: 6.1
        - label: IPO 传闻区间
          low: 8
          high: 10
    approximationNotes: 所有数值单位均为十亿美元，是情景区间而非市场报价。
    claimRefs:
      - CV003
      - CV005
      - CV037
      - CV038
      - CV039
  - id: FV004
    title: 投资 KPI 记分卡
    type: kpi
    layout: wide
    summary: Lenskart 在增长和运营能力上得分较高，但入场估值和利润质量透明度明显弱得多。
    data:
      items:
        - label: 增长耐久性
          value: 8
          detail: FY26 收入和门店增长仍强
        - label: 毛利率质量
          value: 8
          detail: ~69% 毛利率支撑高端零售经济性
        - label: 经营杠杆证据
          value: 7
          detail: FY26 现金生成和 PAT 明显改善
        - label: 上市可比公司支撑
          value: 4
          detail: 相比 Warby、Essilor 和 Titan，IPO 要价显得偏贵
        - label: 交易结构友好度
          value: 4
          detail: 大额 OFS 占比削弱新钱观感
        - label: 利润质量透明度
          value: 5
          detail: 负面来源质疑 FY25 利润正常化处理
        - label: 入场估值纪律
          value: 3
          detail: 拟议区间高端几乎不容失望
    approximationNotes: 分数是分析师基于引用证据给出的 1-10 分判断，而非公司发布的指标。
    claimRefs:
      - CV010
      - CV017
      - CV031
      - CV033
      - CV035
      - CV041
