  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 主要威胁
      - 严重性
      - 证据
      - 缓释措施 / 尽调问题
    rows:
      - - Lenskart 门店密度和本地化履约
        - 本地眼镜店仍靠距离和个人信任取胜
        - 高
        - 行业来源仍把社区眼镜店视为现状替代方案，Lenskart 自身也称其竞争对象包括非组织化眼镜店
        - 索取城市级复购率、同一邮编留存率，以及相对本地门店的周转时间数据
      - - 垂直整合和价格架构
        - 关税、高端品牌组合变化和竞争对手折扣可能压缩眼镜利润率
        - 中
        - Warby 报告关税 / 运输成本带来利润率压力；印度连锁品牌使用可见促销钩子和入门梯度
        - 按镜片 / 镜框类别检查毛利率韧性，并验证 Hyderabad 制造是否支撑入门价优势
      - - 高端化和品牌加价销售
        - Titan、GKB 和 EssilorLuxottica 在信任、诊断和高端标签上竞争更强
        - 高
        - Titan Runway 门店、GKB 生活方式优先门店，以及 EssilorLuxottica 高端品牌都在争夺更高价值的钱包份额
        - 测试核心一线城市和商场密集商圈中，相比 Titan/GKB 的高端 ASP 留存
      - - 验光作为获客和留存护城河
        - 免费或低价验光在组织化连锁中越来越像标配
        - 中
        - Vision Express、Titan、GKB、Warby 和 Specsmakers 都营销眼护理或验光线索
        - 衡量验光到复购的转化率，并与同行比较
      - - 国际规模和品类宽度
        - Warby 仍是更尖锐的全渠道参照，EssilorLuxottica 的全球规模则远超所有玩家
        - 中
        - Warby 门店增长和 EssilorLuxottica 近 2 万个网点说明，规模在其他市场仍可持续复利
        - 将国际门店坪效和附加销售率与 Warby/Owndays 业态对标
      - - 线上优先挑战者风险
        - Coolwinks 式纯电商模式已经走弱，但如果平台补贴眼镜，该风险可能重新出现
        - 低-中
        - Coolwinks 现在标记为已合并，说明只有线上、缺少更强线下 / 服务支撑的模式曾经吃力
        - 跟踪平台眼镜补贴，以及不需要实体服务的订单占比
      - - 智能眼镜邻近机会
        - Titan、EssilorLuxottica 和 Warby 推进 AI / 智能眼镜的速度，快于印度眼镜连锁过去的节奏
        - 中-高
        - Titan 营销 Ray-Ban Meta 和 EyeX，Warby 正在准备智能眼镜，EssilorLuxottica 提到 AI 眼镜动能
        - 评估 Lenskart 在智能眼镜中想做零售商、制造商，还是平台伙伴
      - - 扩张速度作为护城河代理
        - 行业评论显示，增长质量正在从门店数量转向坪效和服务一致性
        - 高
        - VisionPlus 认为 2026 年重点是坪效和服务，而不是单纯讲扩张故事
        - 在承保更多扩张驱动的上行空间前，索取门店级回本期、SSSG 和按城市 cohort 的流失率
    notes: 严重性等级是基于截至 2026 年 6 月所审阅公开证据作出的分析判断。它们不是管理层披露，需用内部 cohort、利润率和门店表现数据检验。
