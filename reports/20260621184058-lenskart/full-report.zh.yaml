  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Lenskart 的可服务市场覆盖通过有组织零售（线上和线下）在印度及部分国际市场销售的处方眼镜、太阳镜、隐形眼镜和眼科护理服务。核心市场包括镜架、镜片（单光、渐进、变色）、镀膜，以及配套验光服务。主要 TAM
              不包括外科视力矫正（LASIK/PRK）、眼科药品，以及仅通过高端零售销售的奢侈设计师眼镜。相邻市场包括智能眼镜（AR
              眼镜）、防蓝光产品和企业眼健康福利项目。在印度，有组织眼镜零售的现状替代品仍是庞大的非组织化市场，约 100,000-150,000 家独立眼镜店仍服务 60-70% 的眼镜买家，尤其在 Tier-2+
              城市和农村地区。
            claimRefs:
              - CM001
              - CM002
              - CM003
