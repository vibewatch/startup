  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 替代方案版图
        blocks:
          - type: paragraph
            body: >-
              Lenskart 同时面对四层竞争。第一层是印度有组织连锁，Titan Eye+ 是最可信的规模化在位者，Specsmakers、Vision Express India 和 GKB Opticals
              则各自切入更窄市场。第二层是全球可比公司和零售供应商：Warby Parker 展示成熟全渠道眼镜 D2C 模式可以长成什么样，EssilorLuxottica
              则带来巨大的高端品牌、镜片和智能眼镜规模，可能通过分销和合作渗入印度。第三层是现状替代品：非组织化社区眼镜店，仍为大量印度买家提供信任、便利和价格灵活性。第四层是相邻市场，AI
              眼镜、可穿戴设备和高端进口品牌可能从普通镜架中抽走价值。基于已审阅证据，Lenskart 仍是唯一一家专注印度、运营数千家门店且拥有有意义国际收入的玩家；但竞争问题不只是“谁能逐项复制 Lenskart
              功能”，而是谁能赢下不同客户任务，比如最低入门价、最快本地服务、最强临床信任，或更有吸引力的高端品牌。
