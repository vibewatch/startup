  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反方逻辑与决策
        blocks:
          - type: paragraph
            body: >-
              Lenskart 已经是少数几家看起来像规模化运营公司、而不只是风投故事的印度消费科技企业。FY26 股东沟通材料显示，公司收入约 ₹90,023 million、EBITDA 为 ₹17,895
              million、调整后 PAT 为 ₹5,300 million，净新增 603 家门店，扩张由经营现金流支撑。正因为运营曲线已经跑出来，Fidelity 在 2025 年 4 月给出的最新已知私募市场估值
              $6.1 billion，表面看并不离谱。按 FY26 约 $1.05 billion 收入计算，这一私募估值约为 5.8x
              销售额：相对成熟上市同业仍有溢价，但增长、垂直整合、强毛利率和国际扩张或许能解释一部分。


              反方逻辑从 IPO 传闻开始。主要新闻报道把拟上市估值放在 $8-10 billion，约为 FY26 销售额的 7.6-9.5x。这个入场倍数明显高于公开市场目前给 Warby
              Parker、EssilorLuxottica 或 Titan 合并业务的定价。多份负面材料也认为，本次发行很大程度依赖一次性利润调整和老股出售。换句话说，争议不在于 Lenskart 是否是真业务，而在于
              IPO 区间已经预售了多少未来执行。


              因此，决策应看价格，而不是非买即不买。业务质量足以让人继续跟踪，但拟议估值区间似乎提前透支了太多上行空间。按上一轮私募估值，Lenskart 相比上市同业已经有清晰溢价；到了 IPO 目标区间，如果没有持续
              25%+ 增长、利润率继续扩张，以及从风投式叙事顺利切换到公开市场认可的盈利可信度，这个溢价就很难自圆其说。因此，本章给出「继续研究」建议，置信度中等，风险高，估值偏紧。
