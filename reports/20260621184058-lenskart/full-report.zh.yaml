      - number: '4.4'
        title: 盈利质量与剩余尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              收入和现金轨迹转正，并没有消除盈利质量问题。官方 FY26 材料反复提示，FY25 可比数据应剔除与 Owndays 递延对价相关的 ₹167.2 crore 非现金公允价值收益；负面评论认为，这使 FY25
              底层盈利基础明显薄于标题 PAT。相同的怀疑性报道把 IPO 描述为 OFS
              占比较高，指出门店足迹重租赁，并质疑运营杠杆能否持续跑赢租金、营销和国际整合成本。没有申报文件时，不应直接接受这些批评，但它们足够重要，应该留在本章，因为它们定义了主要承销争议。最大的剩余阻塞项不是收入可见度，而是缺失的私有数据：扣除维护和增长
              capex 后的真实 FY26 自由现金流、按渠道拆分的 cohort CAC 与回本、折扣后的实际净
              ASP，以及经审计的地区层面利润率披露。数据可得之前，合适的财务结论是质量在改善但仍有重大尽调缺口，而不是承销案例已经完全闭合。
