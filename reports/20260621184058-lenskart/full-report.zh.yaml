      - number: '1.2'
        title: 创始人与领导层
        blocks:
          - type: paragraph
            body: >-
              Lenskart 由 Peyush Bansal（董事长、董事总经理兼 CEO）、Amit Chaudhary（执行董事，全球扩张）和 Sumeet
              Kapahi（联合创始人，全球采购负责人）共同创立。Peyush Bansal 拥有 IIT Delhi 工学学士和 McGill University MBA 学位；创立 Lenskart 时 25
              岁，此前任职 Microsoft。Peyush 的妻子 Neha Bansal 以联合创始人兼执行董事身份加入，负责全球商品管理。职业经理人层包括 Abhishek Gupta（CFO）、Ramneek
              Khurana（全球技术负责人）和 Ashwani Agarwal（全球运营负责人）。IPO 前的 2025 年，董事会完成重组：SoftBank 的 Sumer Juneja 退出，由独立董事 Ashish
              Kashyap（INDmoney 创始人）和 Sayali Karanjkar（PaySense 创始人）接替。其他独立董事包括 Jayesh Tulsidas Merchant（前 Asian Paints
              CFO）和 Bijou Kurien（前 Titan COO）。Kedaara Capital 的 Anant Gupta 担任提名董事。Peyush Bansal 也因自 2022 年第 1 季起担任
              Shark Tank India 评委而获得公众知名度。
