      - number: '1.3'
        title: 融资历史与估值
        blocks:
          - type: paragraph
            body: >-
              Lenskart 自成立以来已募集超过 $1 billion 一级和二级资本。关键融资节点包括：2020 年 Epiq Capital 投资 $100M，2021 年 SoftBank Vision Fund
              投资 $250M，2022 年 1 月 SoftBank 和 Temasek 以 $4.5B 估值参与 $400M Series J，以及 2023 年 Abu Dhabi Investment
              Authority（ADIA）以 $4.5B 估值投资 $500M。2024 年 6 月，公司从 Temasek 和 Fidelity 获得一笔 $200M 二级交易，估值 $5B。2024 年 7
              月，联合创始人以每股 ₹2,300 认购 695,875 股 CCPS，内部募资约 ₹165 crore（~$20M）——这是 2024 年 6 月之后的合格融资事件。Fidelity 在 2024 年 11
              月将其 Lenskart 持股估值上调至 $5.6B，2025 年 4 月又上调至 $6.1B。公司于 2025 年 7 月向 SEBI 提交 DRHP，计划发行 ₹2,150 crore 新股并通过 OFS
              出售 13.2 crore 股，目标 IPO 估值 $8-10 billion。发起人集团（主要是 Peyush Bansal）IPO 前持股约 20%；SoftBank Vision Fund
              虽然退出董事会，仍是最大机构股东。
