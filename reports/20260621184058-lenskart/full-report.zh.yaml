  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础规模与分层组合
        blocks:
          - type: paragraph
            body: >-
              Lenskart 最好的公开客户基础证据，不是模糊的用户话术，而是验光漏斗。FY26 公司报告 23.8 million 次验光，并称约一半是首次检查，意味着一年内约 11.9 million 次新进品类互动。仅
              Q4 就达到 6.8 million 次验光和 4.3 million 个印度交易客户账户，远超小众高端时尚眼镜故事。分层组合也比单一城市 D2C
              原型更宽。公开来源指向职场年龄城市专业人士、年轻家庭和中产家庭为核心客群，并为首次购买和 Tier-2/3 买家设置明确预算层，同时为高客单处方产品保留高端通道。实际读数是，Lenskart
              越来越像一个披着消费科技品牌外衣的日常光学基础设施。仍不够精确的是人口结构：公开来源支持“职场年龄、城市、中产”为宽泛中心，但不支持完全审计过的 18-45 岁年龄拆分。
