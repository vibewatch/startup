          - type: callout
            title: $6.1B 私募估值与 $8-10B IPO 要价是两场不同讨论
            body: 最新已知私募估值已经内含溢价，但拟议 IPO 区间要求公开市场投资者在尚无实时市场验证前，再额外支付一层溢价。
            calloutType: insight
            claimRefs:
              - CV003
