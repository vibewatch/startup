  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: standard
    summary: Lenskart 的核心旅程从数字渠道开始，经眼检和试戴验证信任，最后靠交付和服务质量赢得复购与推荐。
    data:
      items:
        - label: 发现
          detail: 客户通过 app、web、广告或口碑找到镜框、优惠或品牌记忆。
          tone: positive
        - label: 入围
          detail: 3D 试戴、面部分析和浏览先缩小选项，再到店或线上下单。
          tone: positive
        - label: 验证处方
          detail: 免费门店眼检、上门眼检，或远程验光辅助旅程建立信任。
          tone: neutral
        - label: 购买
          detail: 客户在门店、线上或辅助式全渠道路径购买，路径由价格层级和紧迫性塑造。
          tone: positive
        - label: 收货与服务
          detail: 配送速度、适配准确性、维修、退款和保修处理，决定首次购买是否让人觉得可靠。
          tone: warning
        - label: 复购或推荐
          detail: Gold 会员、更换周期和口碑只有在购后服务顶住时，才会带来扩张。
          tone: neutral
    approximationNotes: null
    claimRefs:
      - CU009
      - CU017
      - CU029
      - CU039
      - CU042
  - id: FU002
    title: 全渠道采用与扩张流
    type: flow
    layout: wide
    summary: 该模型从数字影响开始，经眼检和门店转化，再靠忠诚度和区域复制扩张；服务失败是主要断点。
    data:
      nodes:
        - id: digital
          label: 数字发现
          detail: 印度收入约 50% 受 app 和 web 界面数字化影响。
          tone: positive
        - id: tests
          label: 眼检漏斗
          detail: FY26 的 2,380 万次眼检创造漏斗顶部的眼镜需求。
          tone: positive
        - id: stores
          label: 门店信任层
          detail: 门店承接试戴、处方验证、自提和服务。
          tone: positive
        - id: loyalty
          label: 忠诚度与推荐循环
          detail: 服务跑顺时，Gold 会员和口碑会加深复购行为。
          tone: neutral
        - id: intl
          label: 国际复制
          detail: Singapore、Thailand、UAE 以及与 Owndays 关联的亚洲市场复用同一打法。
          tone: positive
        - id: risk
          label: 执行断点
          detail: 退款、保修、配送和处方错误可能打断推荐驱动增长。
          tone: warning
      edges:
        - from: digital
          to: tests
        - from: tests
          to: stores
        - from: stores
          to: loyalty
        - from: loyalty
          to: intl
        - from: risk
          to: loyalty
        - from: risk
          to: stores
    approximationNotes: null
    claimRefs:
      - CU001
      - CU004
      - CU005
      - CU007
      - CU022
      - CU029
      - CU039
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: standard
    summary: Lenskart 的证明在采用规模和官方满意度上最强，但在独立验证留存和国家层面客户渗透率上弱得多。
