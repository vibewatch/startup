      - number: '8.5'
        title: 退出准备度与最后尽调问题
        blocks:
          - type: paragraph
            body: >-
              从运营层面看，Lenskart 确实已经具备退出条件。公司已改制为公众架构，重组董事会，公开提交 DRHP，在 FY25
              扭亏，并披露了合理的募集资金用途计划。相比许多首次冲击公开市场的印度消费科技发行人，这已经更成熟。问题不是 Lenskart 能不能上市，而是相对于已经计入价格的业务质量，新投资者还能拿到多少上行空间。


              现在最重要的尽调工作集中在正常化和供给端。投资者应剔除一次性收益后核对 FY25 利润质量，确认 FY26 与 FY27
              初期盈利能转化为多少可持续自由现金流，并理解偏重老股出售的股本结构可能带来多大股票悬压。媒体对 2025 年 7 月内部人交易的冲突解读，也需要用准确的完全摊薄股数测算来解决。


              对新投资者来说，最建设性的路径是把公司留在买入候选名单上，但要求更好的入场价格，或更多公开市场证据。如果交易定价靠近下沿，且上市后前几个季度证明 25%+
              增长能与持久利润率扩张共存，判断可以迅速改善。如果股票在最高端推出，却没有相应盈利基础，回报就过度偏向当前卖方。这也是本章给出继续研究而非买入的原因。
