      - number: '5.2'
        title: 技术与运营栈
        blocks:
          - type: paragraph
            body: >-
              公开产品和申报证据显示，Lenskart 的运营栈分层清晰。客户侧，公司拥有 AR 试戴、面部分析、推荐、基于图像的视觉搜索，以及 app 驱动个性化。门店内，公司描述了排队管理、线上 / 线下一体库存、POS
              升级、基于计算机视觉的人流分析，以及用于选址的 geo-analytics 或 GeoIQ。诊断侧，远程验光用视频连接和 AI
              支持检测设备，让中心化验光师服务多家门店。运营侧，计算机视觉用于监控门店、制造和眼检流程中的 SOP 执行。在产品路线图边缘，管理层如今把公司定位为 AI-first，并把 app
              发现、planogramming、RFID 和智能眼镜都视为同一数据与 AI 层的延伸。主要保留意见是披露深度：公开来源对能力和界面的解释远多于底层架构、正常运行时间或模型治理细节。
