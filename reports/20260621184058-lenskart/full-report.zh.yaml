  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: 运营杠杆取决于公司能否让诊断、门店、制造、仓库自动化和 AI 治理保持同步。
    data:
      nodes:
        - id: core
          label: 产品与目录核心
        - id: diag
          label: 验光师 + 诊断设备
        - id: stores
          label: 门店操作系统
        - id: mfg
          label: Bhiwadi / Telangana 制造
        - id: dc
          label: Addverb DC 与路由栈
        - id: ai
          label: AI / ML / 计算机视觉层
        - id: users
          label: 客户 app、web 和门店用户
        - id: risk
          label: 隐私 / 临床 / QC 治理
      edges:
        - from: users
          to: core
          label: 浏览 + 下单意图
        - from: core
          to: diag
          label: 检测工作流
        - from: diag
          to: stores
          label: 处方 + 服务输出
        - from: stores
          to: mfg
          label: 工单路由
        - from: mfg
          to: dc
          label: 成品
        - from: dc
          to: stores
          label: 库存 + 履约
        - from: ai
          to: core
          label: 推荐 + 个性化
        - from: ai
          to: stores
          label: 客流 + SOP 分析
        - from: ai
          to: mfg
          label: QC 与流程遵守
        - from: risk
          to: ai
          label: 治理要求
    approximationNotes: 该 DAG 仅限于保留公开证据中明示或直接暗示的依赖；不推断云供应商或内部数据库拓扑。
