- id: TI007
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Why it matters
  - Current public proxy
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Realized net ASP after discounts
    - List pricing and mix can overstate economics
    - ASP history of ~₹1,760 and temporary dip to ₹1,609
    - Hard to underwrite true pricing power
    - Request monthly gross-to-net bridge by channel and product bucket
  - - Cohort CAC and channel payback
    - Marketing leverage is helpful but incomplete
    - Marketing cost ratio fell to 7.5% and payback is said to be <12 months
    - Cannot test durability of acquisition efficiency
    - Request CAC, repeat rate, and payback by online, offline, and omnichannel cohorts
  - - True FY26 free cash flow
    - OCF alone can overstate distributable cash
    - OCF ₹886.7 Cr plus commentary that cash funded store and plant capex
    - Cannot separate maintenance from growth reinvestment
    - Request CFO-to-FCF bridge including store, manufacturing, and technology capex
  - - Geography-level gross margin and returns
    - International scale is meaningful but still heterogeneous
    - Reported FY26 segment revenue, 75.7% international product-margin proxy, and 7.0% pre-IndAS margin commentary
    - Cannot isolate which markets are truly compounding
    - Request India, Japan, SEA, and MENA contribution-margin / ROIC views
  - - Customer concentration, return rates, and warranty claims
    - Retail cash flow can be pressured by hidden after-sales costs
    - Public disclosures discuss eye tests, Gold members, and digital influence, not concentration or returns
    - Limits downside-case underwriting
    - Request cohort return/warranty data and large-account exposure if any B2B channels exist
  notes: 'These are not cosmetic gaps: they are the missing private metrics that keep the chapter from a fully closed underwriting
    view despite the visible improvement in revenue, PAT, and cash generation.'
