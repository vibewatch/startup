- id: TI003
  title: Revenue streams and monetization signals
  columns:
  - Stream / signal
  - Public evidence
  - Unit / price point
  - Revenue quality
  - Diligence ask
  rows:
  - - Sale of goods
    - FY25 annual report shows ₹3,795.1 Cr from sale of goods
    - Prescription eyewear, sunglasses, contacts, accessories
    - Core recurring demand driver, but retail not contractual
    - Break out lenses vs frames vs accessories by geography
  - - Services
    - FY25 annual report shows ₹83.7 Cr of service revenue
    - Eye check-ups, membership, service fees
    - Supports funnel and retention more than headline revenue
    - Disclose service-margin and attachment-rate economics
  - - Lease and other operating income
    - FY25 annual report shows ₹143.3 Cr lease income plus ₹17.2 Cr other operating revenue
    - Ancillary and non-core lines
    - Useful but not the main underwriting engine
    - Separate recurring ancillary income from one-off items
  - - Premiumization
    - Orders above ₹10,000 reached 20.5% of FY26 India revenue
    - Premium ticket mix
    - Improves ASP and margin if sustained
    - Show premium cohort repeat behavior and returns
  - - Digital influence
    - ~50% of FY26 India revenue was digitally influenced
    - Online-to-offline funnel
    - Supports omnichannel acquisition efficiency
    - Disclose contribution margin by digitally influenced cohort
  notes: Public materials are better at describing mechanisms than realized pricing. They show how revenue is generated, but
    not the fully discounted net ASP or contribution margin by channel.
