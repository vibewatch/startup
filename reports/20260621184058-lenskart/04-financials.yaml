  title: Quality-of-earnings scrutiny is still warranted
  body: Official materials acknowledge the FY25 Owndays fair-value gain in other income, and adverse public commentary argues
    that the IPO asks investors to pay up for a business whose core earnings are still thinner than the headline PAT implies.
