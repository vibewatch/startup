- id: quality-of-earnings-and-diligence-blockers
  title: Quality of earnings and the remaining diligence blockers
  body: 'The positive revenue and cash trajectory does not eliminate quality-of-earnings questions. The official FY26 materials
    repeatedly note that FY25 comparatives should be adjusted for a ₹167.2 crore non-cash fair-value gain tied to Owndays
    deferred consideration, and adverse commentary argues this makes the FY25 underlying earnings base materially thinner
    than the headline PAT suggests. The same skeptical coverage frames the IPO as OFS-heavy, notes a lease-heavy store footprint,
    and questions whether operating leverage can sustainably outrun rent, marketing, and international integration costs.
    Those criticisms should not be taken at face value without the filings, but they are serious enough to keep in the chapter
    because they define the main underwriting debate. The biggest remaining blockers are not top-line visibility but missing
    private data: true FY26 free cash flow after maintenance and growth capex, cohort CAC and payback by channel, realized
    net ASP after discounting, and audited geography-level margin disclosure. Until that data is available, the appropriate
    financial verdict is improving quality with still-material diligence gaps, rather than a fully closed underwriting case.'
  claimRefs:
