company:
  name: Lenskart
chapter:
  number: 4
  title: Financials
  summary: Audited consolidated filings show Lenskart moving from a FY24 loss into FY25 and FY26 profitability, with reported
    revenue rising from ₹5,427.7 crore to ₹6,652.5 crore to ₹8,814.0 crore and reported PAT rising from -₹10.2 crore to ₹297.3
    crore to ₹501.0 crore. Management’s pro forma shareholder communications point to 19.9% FY26 EBITDA margin and a ~25%
    steady-state target, but the underwriting debate still turns on quality of earnings, lease-heavy capital intensity, and
    missing public disclosure on true free cash flow and cohort-level CAC.
sections:
- id: reported-trajectory
  title: Reported trajectory and the pro forma overlay
  body: 'The cleanest starting point is the audited consolidated record rather than the management-adjusted shareholder letter.
    Lenskart’s reported revenue from operations rose from ₹5,427.7 crore in FY24 to ₹6,652.5 crore in FY25 and ₹8,814.0 crore
    in FY26, while reported profit after tax moved from a ₹10.2 crore loss in FY24 to ₹297.3 crore in FY25 and ₹501.0 crore
    in FY26. Q4 FY26 reported revenue reached ₹2,515.7 crore, up about 45.6% year over year from ₹1,727.6 crore in Q4 FY25.
    The same FY26 quarter/year are also presented on a pro forma basis after recent M&A normalisation, yielding ₹9,002.3 crore
    revenue and ₹530.0 crore adjusted PAT for FY26. That distinction matters: the pro forma bridge is useful for understanding
    current operating direction, but statutory underwriting should anchor on the reported audited numbers first and then use
    the pro forma set as an operating lens. Public third-party writeups broadly match the direction of travel even when they
    quote rounded or adjusted figures rather than the exact reported filing numbers.'
