- id: capital-adequacy-and-funding-context
  title: Capital adequacy, cash generation, and funding context
  body: 'Capital adequacy is stronger than the FY24 headline might imply. Management disclosed FY26 operating cash flow of
    ₹886.7 crore, working-capital release of ₹98.3 crore, and FY26-end net cash of ₹3,880.8 crore excluding IPO-related payables
    and accrued interest. The shareholder letter explicitly says operating cash flow funded 603 net new stores plus manufacturing
    capex, and adverse sell-side-style commentary still concedes that the current debate is more about capital intensity than
    immediate liquidity. The IPO itself listed on 10 November 2025, with a total issue size of about ₹7,278.0 crore, a ₹2,150
    crore fresh issue, and the rest offer-for-sale. As of 31 March 2026, only ₹177.1 crore of fresh-issue proceeds had been
    deployed. Around the IPO, public-market context improved: Fidelity marked Lenskart to $6.1 billion as of 30 April 2025,
    while multiple publications described an IPO objective around $1 billion at an $8-10 billion valuation. Economic Times
    also reported cumulative capital raised since inception at nearly $2 billion including secondaries, which comfortably
    supports a greater-than-$1-billion lifetime-funding statement.'
