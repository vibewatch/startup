  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: A gross-to-net pricing bridge that shows realized ASP after discounts, couponing, and channel incentives.
    whyItMatters: Margin durability cannot be underwritten cleanly from list pricing, premium-mix commentary, or historical
      ASP alone.
    diligencePath: Request monthly realized ASP, discount rate, and return-adjusted contribution margin by product bucket
      and channel.
    relatedQuestionRefs:
    - QI006
    - QI024
    relatedTableRefs:
    - TI003
    - TI007
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: Cohort-level CAC, repeat purchase, and payback by online, offline, and omnichannel customer segment.
    whyItMatters: Marketing leverage and sub-12-month store payback are encouraging but do not reveal the actual acquisition
      economics by channel.
    diligencePath: Request cohort CAC and payback tables tied to revenue retention, repeat rate, and contribution margin by
      channel.
    relatedQuestionRefs:
    - QI008
    - QI022
    - QI024
    relatedTableRefs:
    - TI004
    - TI007
  - type: missing-source
    severity: material
    topic: free-cash-flow
    missingEvidence: A published FY26 bridge from operating cash flow to maintenance capex, growth capex, and true free cash
      flow.
    whyItMatters: Without a clean FCF bridge, investors cannot tell how much of current cash generation is structurally distributable
      versus temporarily supported by working-capital timing.
    diligencePath: Request the FY26 CFO-to-FCF bridge including store capex, manufacturing capex, technology capex, and acquisition-related
      investing cash flows.
    relatedQuestionRefs:
    - QI021
    - QI024
    relatedTableRefs:
    - TI006
    - TI007
  - type: missing-source
    severity: material
    topic: lease-and-capex-schedule
    missingEvidence: A full lease-maturity schedule, store-capex cohort table, and Hyderabad project cash-deployment timeline.
    whyItMatters: The debate between a self-funding retail flywheel and a lease-heavy expansion story cannot be closed without
      the fixed-cost and future-capex schedule.
    diligencePath: Request lease maturity by year, store opening capex by cohort and market, and committed versus spent manufacturing
      capex by quarter.
    relatedQuestionRefs:
    - QI016
    - QI018
    relatedTableRefs:
    - TI005
    - TI006
  - type: missing-source
    severity: minor
    topic: funding-chronology
    missingEvidence: A complete round-by-round chronology with primary versus secondary split and use-of-funds for each major
      capital event.
    whyItMatters: The chapter can underwrite current capital adequacy with the recent markers, but a fully normalized capital-history
      model still benefits from a complete chronology.
    diligencePath: Use company-ledgers or cap-table materials to build a full financing timeline that reconciles with the
      Company Overview chapter.
    relatedQuestionRefs:
    - QI013
    relatedTableRefs:
    - TI005
