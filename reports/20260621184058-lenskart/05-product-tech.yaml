- id: TE002
  title: Customer Workflow / Use-Case Table
  columns:
  - User job
  - Current workflow
  - Lenskart solution
  - Measurable / claimed benefit
  - Limitation
  rows:
  - - Preview frame fit before buying
    - Browse web/app → compare looks → shortlist frames
    - AR / 3D try-on with facial analysis and recommendations
    - 38.59M virtual trials in FY25; lowers selection friction
    - Public sources do not publish conversion delta by feature
  - - Get prescription without store visit
    - Book at-home visit → certified test → trial at door
    - Home eye test with computerized equipment and 150+ frames
    - Bundles diagnosis and merchandising into one visit
    - Not suitable for all users; explicit age and clinical exclusions
  - - Serve small or optometrist-light stores
    - Customer enters store → remote optometrist joins by video → AI-assisted testing
    - Remote optometry / remote eye testing
    - 298 supported stores by mid-2025; 500+/623 stores by FY26 depending on disclosure point
    - Clinical accountability and quality-control metrics are not publicly deep
  - - Unify store and digital shopping
    - Store visit or online browse → shared catalog → POS/order completion
    - Integrated inventory, digital browsing, queue management, and POS upgrades
    - Improves wait times, transparency, and omnichannel conversion
    - No public uptime/SLA disclosures for this internal stack
  - - Fulfill custom eyewear quickly
    - Prescription captured → frame/lens routing → manufacturing/QC → delivery or pickup
    - Vertically integrated manufacturing plus automated DC
    - Supports next-day or same-day service expansion in some markets
    - Public sources do not show defect, remake, or on-time-delivery rates
  notes: Benefits are taken from public operational disclosures rather than controlled experiments; where metrics are missing,
    the limitation column keeps the diligence ask explicit.
