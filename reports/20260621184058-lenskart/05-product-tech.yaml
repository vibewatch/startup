- id: TE001
  title: Product Portfolio and Brand Surface
  columns:
  - Surface
  - Primary user
  - Current public status
  - Differentiation / brand cue
  - Evidence limit / diligence ask
  rows:
  - - Prescription eyeglasses
    - Vision-correction user
    - Core live category; single-vision, bifocal, progressive, reading, and coatings referenced publicly
    - Largest integrated lens + frame workflow; feeds try-on, testing, and manufacturing stack
    - Need public SKU-level mix by lens type and ASP band
  - - Sunglasses
    - Fashion and sun-protection buyer
    - Core live category; served through Lenskart and sub-brands including Vincent Chase and John Jacobs
    - Fashion-led assortment plus automated distribution for specialized SKUs
    - Public data does not break sunglasses revenue or margin separately
  - - Contact lenses
    - Vision-correction or cosmetic user
    - Core live category on site and in filing taxonomy
    - Completes eyewear basket and broadens repeat-purchase frequency
    - Public sources do not disclose brand-level share or replenishment economics
  - - Home eye test / home trial
    - Household needing convenience
    - Live service with certified optometrists/refractionists and 150+ frame trial at home
    - Expands conversion beyond stores; pairs diagnosis with merchandising
    - Clinical-suitability boundaries are explicit and should be audited for adherence
  - - AI smart glasses roadmap
    - Early adopter / prescription wearable user
    - Publicly announced and pre-ordering, but still roadmap-stage relative to core eyewear business
    - Gemini-powered in-house full-stack device extends Lenskart into consumer AI wearables
    - Need shipment timing, return rates, privacy controls, and attach-rate data after launch
  notes: Table mixes current commercial categories with one publicly announced roadmap product because smart glasses are now
    part of the disclosed product narrative.
