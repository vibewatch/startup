  evidenceGaps:
  - type: missing-source
    severity: material
    topic: chatbot-disclosure-gap
    missingEvidence: A public product or technical document that separately describes any standalone Lenskart AI chatbot,
      its scope, model architecture, guardrails, and operating metrics.
    whyItMatters: The prompt specifically calls out an AI chatbot, but the retained evidence better supports conversational
      AI in smart glasses and app surfaces than a distinct chatbot product.
    diligencePath: Ask management for product documentation, launch notes, or KPI dashboards covering any standalone support
      or commerce chatbot.
    relatedQuestionRefs:
    - QE027
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: computer-vision-qc-metrics
    missingEvidence: Quantitative production or clinical metrics for computer-vision-led quality control, such as defect detection
      rates, false-positive rates, override rates, or audit-accuracy trends.
    whyItMatters: Public sources confirm that computer vision exists in manufacturing and store processes, but not whether
      it materially improves quality or merely adds monitoring.
    diligencePath: Request internal QA dashboards, warranty-return analysis, and SOP-audit precision/recall metrics by plant
      and workflow.
    relatedQuestionRefs:
    - QE028
    relatedTableRefs:
    - TE004
    - TE005
  - type: private-evidence-only
    severity: material
    topic: store-stack-reliability
    missingEvidence: Incident history, uptime, service-level targets, and failover design for queue management, POS upgrades,
      and online/offline inventory synchronization.
    whyItMatters: The product workflow depends on integrated retail software, but public evidence does not show whether that
      operational stack is robust at peak scale or during outages.
    diligencePath: Request architecture review materials, incident postmortems, and store-level service dashboards for the
      retail operating stack.
