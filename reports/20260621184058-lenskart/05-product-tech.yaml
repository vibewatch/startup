- id: TE003
  title: Technology Stack / Operating Architecture
  columns:
  - Layer / component
  - Role
  - Public evidence
  - Dependency
  - Primary risk
  rows:
  - - AR try-on and face mapping
    - Lets users preview frames and receive fit/style cues
    - Official tech page, Compare Looks page, and external reporting on 3D face mapping
    - Camera capture, facial-analysis models, product catalog metadata
    - Public detail on model accuracy and bias is limited
  - - Recommendation and visual-search layer
    - Suggests frames and finds similar products from images
    - Data engineering blog describes curated recommendations, visual search, and ML platform ambition
    - User-history data, catalog embeddings, app/web instrumentation
    - Performance and governance metrics are not public
  - - Remote-optometry diagnostics
    - Extends eye testing into more stores via centralized optometrists
    - Kotak Neo, Yahoo transcript, ScanX, and official tech page
    - Video connectivity, proprietary test equipment, clinician workflow design
    - Clinical liability and regulatory scrutiny rise with scale
  - - Store operating system
    - Runs queue management, integrated inventory, digital browsing, and POS upgrades
    - Official tech page plus DRHP operating description
    - Reliable store connectivity, data synchronization, store associate adoption
    - No public reliability or incident history
  - - Computer-vision analytics and QC
    - Monitors customer flow, SOP adherence, eye-test operations, and manufacturing process adherence
    - DRHP descriptions of CCTV analytics and manufacturing QC
    - CCTV coverage, labeled process rules, audit workflows
    - False positives / misses are not quantified publicly
  - - Conversational / AI-assistant surfaces
    - Extends discovery and wearable interactions through Gemini-powered smart glasses and broader AI product roadmap
    - Medianama smart-glasses and FY27 AI-first coverage
    - Gemini AI platform, device hardware, app software, privacy controls
    - Standalone chatbot details remain under-documented in public sources
  notes: This table stays at the public-architecture level; it does not infer cloud vendors, data stores, or internal model-serving
    topology beyond what retained sources say directly.
