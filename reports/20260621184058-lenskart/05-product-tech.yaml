- id: technology-and-operating-stack
  title: Technology and Operating Stack
  body: 'Public product and filing evidence shows a layered operating stack. On the customer side, Lenskart has AR try-on,
    facial analysis, recommendations, image-based visual search, and app-driven personalization. In store, the company describes
    queue management, integrated online/offline inventory, POS upgrades, computer-vision-based footfall analysis, and geo-analytics
    or GeoIQ for location selection. In diagnostics, remote optometry uses video links and AI-enabled testing equipment to
    let centralized optometrists serve multiple stores. In operations, computer vision is used to monitor SOP adherence across
    stores, manufacturing, and eye-test workflows. On the product-roadmap edge, management is now framing the company as AI-first,
    with app discovery, planogramming, RFID, and smart glasses all treated as extensions of the same data and AI layer. The
    main caveat is disclosure depth: public sources explain capabilities and surfaces far better than low-level architecture,
    uptime, or model-governance details.'
