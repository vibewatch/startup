company:
  name: Lenskart
chapter:
  number: 5
  title: Product & Technology
  summary: 'Lenskart''s product stack is no longer just a retail catalog: it combines prescription eyewear, sunglasses, contact
    lenses, home and remote eye-testing, and an increasingly automated supply chain anchored by Bhiwadi manufacturing and
    a Telangana expansion project. Public evidence strongly supports AR try-on, remote diagnostics, proprietary store systems,
    computer-vision-led operations, and smart-warehouse automation; by contrast, public detail on a standalone AI chatbot
    remains thin, so conversational AI is better evidenced in smart-glasses and app-personalization surfaces than in a separately
    documented support bot.'
sections:
- id: product-surface-and-customer-workflow
  title: Product Surface and Customer Workflow
  body: 'Lenskart''s customer-visible product surface is broad enough to behave like a full optical platform rather than a
    single eyewear SKU: official pages and the DRHP show prescription eyeglasses, sunglasses, contact lenses, progressive
    and reading-lens options, home eye testing, in-store diagnostics, and remote optometry-enabled workflows. The workflow
    starts with discovery on app, web, or store, but the important technical point is that Lenskart tries to collapse discovery,
    testing, merchandising, and fulfillment into one journey. AR try-on and the Compare Looks surface reduce selection friction
    before a prescription is finalized; home eye tests and remote eye-check flows widen access where in-store optometrist
    availability is constrained; and the company keeps both online and store browsing tied to the same inventory and sales
    stack. The result is a product architecture built around conversion from diagnosis to frame selection to controlled fulfillment
    rather than around isolated catalog pages.'
  claimRefs:
