- id: TE004
  title: Trust, Quality, and Compliance Controls
  columns:
  - Control / metric
  - Status
  - Scope
  - Why it matters
  - Gap / risk
  rows:
  - - Home-eye-test eligibility boundaries
    - Publicly specified
    - Age 14-75; diabetics/high-BP users redirected to clinical testing
    - Shows the company recognizes limits of at-home workflow
    - No public audit rate for how often exclusions are enforced
  - - Manufacturing SOP audits via computer vision
    - Publicly described
    - Manufacturing facilities and eye-test/store processes
    - Creates scalable process adherence beyond manual spot checks
    - No public defect-detection precision/recall or override rates
  - - Automated lens surfacing + quality-check stage
    - Publicly described
    - Bhiwadi lens line
    - Supports consistency and lower manual variation at scale
    - No remake, scrap, or warranty-claim rate by plant
  - - 12-month frame warranty for corrosion/rusting/coating defects/colour fading
    - Publicly described
    - Eyeglass frames
    - Signals product-quality accountability beyond sale
    - Warranty-claim volumes and cost of quality are undisclosed
  - - Remote-optometry clinical model
    - Scaling rapidly
    - 500+ stores / 623 stores by FY26 disclosures
    - Expands access where optometrists are scarce
    - Independent experts flag liability and preventive-care concerns
  - - AI glasses privacy posture
    - Risk visible, mitigation detail limited
    - Camera-equipped smart glasses and broader AI-first roadmap
    - Trust failure here would hit brand and product adoption simultaneously
    - Public sources do not yet explain consent, storage, or on-device/off-device safeguards in detail
  notes: Controls are stronger on process existence than on published performance metrics; the diligence burden therefore
    shifts from “is there a control?” to “how well does it work in production?”
  claimRefs:
  - CE003
  - CE015
  - CE020
  - CE035
  - CE037
  - CE039
- id: TE005
  title: Manufacturing Capabilities and Roadmap
  columns:
  - Facility / capability
  - Current status
  - What it produces / does
  - Automation / tech
  - Open diligence point
  rows:
  - - Bhiwadi lens design + surfacing
    - Operational
    - Single-vision, bifocal, and progressive lenses; 4.06M in-house lenses in FY25
    - Advanced automated technology, precision tooling, fully automated surfacing until QC
    - Need current utilization, yield loss, and defect rates
  - - Bhiwadi frames + lens lab
    - Operational
    - In-house frame manufacturing and specialized SKU handling including sunglasses
    - In-house mould/design work and precision engineering
    - Need split between domestic and export supply plus lead times
  - - Addverb-enabled distribution center
    - Operational
    - Automated storage, retrieval, picking, packing, and dispatch above 200,000 eyewear/day
    - Robotics, AI, ML, deep learning, computer vision, IoT, Quadron, Rapido
    - Need service-level performance and downtime history
  - - Computer-vision-led manufacturing QC
    - Operational
    - SOP adherence and audit reporting across manufacturing workflows
    - AI-enabled CCTV analysis and automated deviation reporting
    - Need public validation that QC automation reduces defects or rework
  - - Telangana / Tukkuguda integrated plant
    - Under construction
    - Future frame, lens, and complete-eyewear manufacturing for India, Asia, and Middle East
    - High automation, precision engineering, integrated plant design, >2 lakh glasses/day at full scale
    - Need commissioning timeline, capex ramp, and whether Bhiwadi blueprint transfers cleanly
  notes: The table focuses on capabilities that are explicitly described in retained sources; Telangana is included as a forward
    capacity node because management and news coverage describe it as under construction rather than speculative.
