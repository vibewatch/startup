- id: manufacturing-and-fulfillment-engine
  title: Manufacturing and Fulfillment Engine
  body: 'Lenskart''s strongest product-technology differentiation is the coupling of design, lens production, frame manufacturing,
    distribution, and quality control. The DRHP says the company began generating frame structures, moulds, lens design, and
    manufacturing in-house in 2021, and that the Bhiwadi site runs a fully automated lens-surfacing line until the quality-check
    stage. Mint adds that Bhiwadi combines a lens lab, frame manufacturing, and a highly automated distribution center for
    specialized SKUs such as sunglasses, with Addverb supplying robotics, AI, machine learning, deep learning, computer vision,
    and IoT systems. This is the clearest Industry 4.0-style evidence in the retained set: software-guided production, machine
    vision, automated storage and retrieval, and digital throughput management are all present in one operating system. The
    Telangana plant under construction extends that model with integrated frame, lens, and eyewear manufacturing plus high
    automation, but it remains a forward-looking capacity project rather than a proven production node today.'
  claimRefs:
