  customerFocus: "Urban middle-class Indian consumers (18-45); expanding internationally in Singapore, Japan (Owndays), UAE, and Southeast Asia"
  businessModel: "Direct-to-consumer eyewear retail with vertically-integrated manufacturing, earning revenue from product sales (frames, lenses, coatings), eye-testing services, and subscription/repeat purchases"
