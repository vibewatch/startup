companyProfile:
  summary: "Lenskart Solutions Ltd is India's largest omnichannel eyewear retailer, founded in 2010 by Peyush Bansal. The company operates a vertically-integrated model across e-commerce, 2,723 physical retail stores globally, in-house automated manufacturing (Bhiwadi, Rajasthan), and AI-powered eye diagnostics. With revenue of ₹8,814 crore in FY26 and net profit of ₹501 crore, Lenskart filed its DRHP with SEBI in July 2025 targeting a $8-10 billion IPO — among the largest by an Indian startup."
