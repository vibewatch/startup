  topStrengths:
    - 垂直一体化模式（制造 + 零售 + 技术）撑起 68.5% 产品毛利率
    - 结构性增长跑道巨大：800M+ 印度人需要视力矫正，有组织零售仅服务 30%
    - 盈利路径已经验证：FY25 首次盈利后，FY26 净利润达到 ₹501 Cr
