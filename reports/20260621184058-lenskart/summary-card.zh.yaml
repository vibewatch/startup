    - IPO 估值 $8-10B 隐含 FY26 收入 8-10x，需要 30%+ 增长持续兑现
    - 制造集中风险突出（Bhiwadi 单一主力工厂）
    - 资本充足的 Titan Eye+ 和 EssilorLuxottica 加剧竞争
    - 印度市场仍贡献约 60% 收入，国际扩张存在执行风险
  unresolvedGaps:
