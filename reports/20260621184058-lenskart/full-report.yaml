              flow funded 603 net new stores plus manufacturing capex, and adverse sell-side-style commentary still
              concedes that the current debate is more about capital intensity than immediate liquidity. The IPO itself
              listed on 10 November 2025, with a total issue size of about ₹7,278.0 crore, a ₹2,150 crore fresh issue,
