              sunglasses, with Addverb supplying robotics, AI, machine learning, deep learning, computer vision, and IoT
              systems. This is the clearest Industry 4.0-style evidence in the retained set: software-guided production,
              machine vision, automated storage and retrieval, and digital throughput management are all present in one
              operating system. The Telangana plant under construction extends that model with integrated frame, lens,
              and eyewear manufacturing plus high automation, but it remains a forward-looking capacity project rather
