  - id: FV004
    title: Investment KPI Scorecard
    type: kpi
    layout: wide
    summary: >-
      Lenskart scores well on growth and operating capability, but much less well on entry valuation and profit-quality
      transparency.
    data:
      items:
        - label: Growth durability
          value: 8
          detail: FY26 top-line and store growth remain strong
        - label: Gross-margin quality
          value: 8
          detail: ~69% gross margin supports premium retail economics
        - label: Operating leverage proof
          value: 7
          detail: FY26 cash generation and PAT improved materially
        - label: Public comp support
          value: 4
          detail: IPO ask screens rich versus Warby, Essilor, and Titan
        - label: Deal-structure friendliness
          value: 4
          detail: Large OFS mix weakens new-money optics
        - label: Profit-quality transparency
          value: 5
          detail: Adverse sources question normalization of FY25 profit
        - label: Entry valuation discipline
          value: 3
          detail: Little room for disappointment at the rich end of the proposed range
    approximationNotes: Scores are analyst judgments on a 1-10 scale anchored to the cited evidence rather than company-issued metrics.
    claimRefs:
      - CV010
      - CV017
      - CV031
      - CV033
      - CV035
      - CV041
