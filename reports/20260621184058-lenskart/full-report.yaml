  - id: TP004
    title: Moat Durability / Competitive Risk Register
    columns:
      - Moat Claim
      - Primary Threat
      - Severity
      - Evidence
      - Mitigation / Diligence Ask
    rows:
      - - Lenskart store density and localized fulfillment
        - Local opticians still win on proximity and personal trust
        - High
        - >-
          Industry sources still frame neighborhood opticians as the status-quo substitute, while Lenskart itself says
          it competes with unorganized opticians
        - Request city-level repeat rates, same-pincode retention, and turnaround-time data versus local shops
      - - Vertical integration and price architecture
        - Tariffs, premium-brand mix shifts, and competitor discounting can compress eyewear margins
        - Medium
        - >-
          Warby reported margin pressure from tariff/shipping costs; Indian chains use visible promo hooks and entry
          ladders
        - >-
          Check gross-margin resilience by lens/frame category and whether Hyderabad manufacturing sustains entry-price
          advantage
      - - Premiumization and brand-upselling
        - Titan, GKB, and EssilorLuxottica compete harder on trust, diagnostics, and premium labels
        - High
        - >-
          Titan Runway stores, GKB lifestyle-first stores, and EssilorLuxottica premium brands all attack the
          higher-value wallet share
        - Test premium ASP retention versus Titan/GKB in top metros and mall-heavy catchments
      - - Eye testing as traffic and retention moat
        - Free or low-cost eye tests are increasingly table stakes across organized chains
        - Medium
        - Vision Express, Titan, GKB, Warby, and Specsmakers all market eye-care or testing cues
        - Measure conversion from eye tests to repeat purchases versus peers
      - - International scale and category breadth
        - Warby remains a sharper omnichannel benchmark while EssilorLuxottica dwarfs all players on global scale
        - Medium
        - Warby store growth and EssilorLuxottica’s nearly 20k locations show scale can keep compounding elsewhere
        - Benchmark international store productivity and attach rates against Warby/Owndays formats
      - - Online-first challenger risk
        - >-
          Coolwinks-style pure e-commerce models have weakened, but that risk could re-emerge if marketplaces subsidize
          eyewear
        - Low-Medium
        - >-
          Coolwinks is now marked amalgamated, suggesting online-only models struggled without stronger offline/service
          support
        - Track marketplace eyewear subsidies and the share of orders where physical service is unnecessary
      - - Smart eyewear adjacency
        - >-
          Titan, EssilorLuxottica, and Warby are pushing AI / smart eyewear faster than Indian optical chains
          historically did
        - Medium-High
        - >-
          Titan markets Ray-Ban Meta and EyeX, Warby is preparing intelligent eyewear, and EssilorLuxottica cites
          AI-glasses momentum
        - Assess whether Lenskart wants to be retailer, manufacturer, or platform partner in smart eyewear
      - - Rollout velocity as moat proxy
        - >-
          Industry commentary suggests growth quality is shifting from store count to productivity and service
          consistency
        - High
        - VisionPlus argues 2026 is about productivity and service rather than pure rollout storytelling
        - Ask for store-level payback, SSSG, and churn by city cohort before underwriting more rollout-led upside
    notes: >-
      Severity levels are analytical judgments based on reviewed public evidence as of June 2026. They are not
      management disclosures and should be tested against internal cohort, margin, and store-performance data.
