              - CM004
          - type: callout
            title: TAM Definition Uncertainty
            body: >-
              Market size estimates range from $4B to $11B depending on definition. The accessible organized market is
              significantly smaller than headline TAM figures suggest, which could mislead valuation expectations.
            calloutType: risk
            claimRefs:
