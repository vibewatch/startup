  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Founder concentration, governance, and IPO execution now sit in the same risk stack
        blocks:
          - type: paragraph
            body: >-
              Lenskart still relies heavily on Peyush Bansal as founder, CEO, public-market narrator, and the internal
              sponsor for AI, expansion, and hiring. That concentration is manageable while growth is private and
              flexible, but it matters more once the company is asking public investors to underwrite a large
              consumer-tech IPO at a demanding valuation. The issue structure reinforces that tension: the fresh issue
              is comparatively modest versus the OFS, founders and early investors are taking partial liquidity, and the
              public use-of-proceeds plan is operationally ambitious rather than balance-sheet defensive. Meanwhile, the
              record already contains live governance and regulatory questions, including a franchisee complaint to SEBI
              over disclosure quality and an unresolved ED/FEMA matter linked to import-export filings. The practical
              implication is that Lenskart cannot separate key-person dependency from governance quality or IPO
              execution; all three now influence the same valuation and credibility outcome.
            claimRefs:
