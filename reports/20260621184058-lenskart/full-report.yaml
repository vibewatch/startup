      - number: '8.5'
        title: Exit Readiness and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Lenskart is genuinely exit-ready in the operational sense. It has already converted to a public structure,
              refreshed the board, filed a public DRHP, turned profitable in FY25, and disclosed a sensible
              use-of-proceeds plan. That is more maturity than many Indian consumer-tech issuers had when they first
              approached public markets. The question is not whether Lenskart can list; it is whether new investors are
              being offered enough upside versus the quality already priced in.


              The most important diligence work now sits around normalization and supply. Investors should reconcile
              FY25 profit quality after stripping out one-time gains, confirm how FY26 and early FY27 earnings translate
              into sustainable free cash flow, and understand how much stock overhang could emerge from a
              secondary-heavy cap table. The conflicting press interpretations of the July 2025 insider transactions
              also need to be resolved with exact fully diluted share-count math.


              The most constructive path for a new investor is to keep the company on the buy list but demand either a
              better entry price or more public-market evidence. If the deal prices near the lower end and the first few
              quarters show that 25%+ growth can coexist with durable margin expansion, the call can improve quickly. If
              the stock is pushed out at the richest end without a corresponding earnings base, the reward skews too far
              in favour of current sellers. That is why the chapter ends with research-more rather than buy.
            claimRefs:
              - CV017
              - CV018
              - CV031
              - CV040
              - CV041
              - CV042
              - CV043
              - CV044
          - type: table
            tableRef: TV007
            claimRefs:
              - CV015
              - CV016
              - CV040
              - CV041
              - CV042
              - CV043
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The Main Risk Is Multiple Compression, Not Business Implosion
            body: >-
              Lenskart does not need to disappoint operationally for IPO buyers to lose money; it only needs to trade
              closer to public peer multiples than the proposed price range assumes.
            calloutType: risk
            claimRefs:
              - CV007
              - CV021
              - CV025
              - CV027
              - CV033
          - type: callout
            title: The $6.1B Private Mark and the $8-10B IPO Ask Are Different Debates
            body: >-
              The latest known private mark already embeds a premium, but the proposed IPO range asks public investors
              to pay a second premium on top of that without yet having live-market proof.
            calloutType: insight
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV035
          - type: callout
            title: Treat “Titan EyeCare at 8x” as a Proxy, Not an Observable Market Print
            body: >-
              Titan’s eyecare revenue is public, but no standalone public valuation for that segment is. Any 8x
              benchmark should therefore be used as a thought experiment rather than a quoted comp.
            calloutType: assumption
            claimRefs:
              - CV028
              - CV029
          - type: callout
            title: Research-More Until Price or Proof Improves
            body: >-
              The cleanest upgrade path is either a lower public entry multiple or several quarters of post-listing
              evidence that Lenskart can sustain high growth while converting more of it into normalized earnings.
            calloutType: recommendation
            claimRefs:
              - CV036
              - CV039
              - CV041
