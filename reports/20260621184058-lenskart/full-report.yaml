        title: Revenue model, pricing, and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              Public disclosures support an omnichannel retail model rather than a software-style recurring model. FY25
              annual-report disclosures show the core engine is still sale of goods, supplemented by services, lease
              income, and small other operating revenue lines. Third-party pre-IPO reporting and management letters
              suggest roughly 40% of FY25 revenue came from international markets, while FY26 audited segment data puts
              India at ₹5,260.1 crore and international at ₹3,606.0 crore. On economics, management disclosed a 69.2%
              product margin in H1 FY26, a 75.7% international product margin, marketing cost down to 7.5% of revenue
              from 9.7% in FY23, India store-level EBITDA margin around 33%, and store payback periods under 12 months.
              FY26 premium orders above ₹10,000 rose to 20.5% of India revenue, while management said India ASP
              historically sat around ₹1,760 before the New Lens Replacement campaign temporarily depressed Q4 FY25 ASP
              to ₹1,609. Roughly half of FY26 India revenue was digitally influenced. These data points support a
              credible operating-leverage story, but realized net pricing after discounts, cohort CAC, and
              geography-level gross margins remain undisclosed in public materials.
