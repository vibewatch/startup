      - number: '2.2'
        title: TAM/SAM/SOM Sizing
        blocks:
          - type: paragraph
            body: >-
              Multiple analyst estimates place India's total eyewear market (TAM) between $9.5-11.1 billion in 2025,
              with a CAGR of 10.8-12% projected through 2034. The spectacles segment specifically is estimated at $4.1
              billion (2024) and represents approximately 45% of the total market by retail value. The global eyewear
              market stands at $174-182 billion (2025) with an 11.3% CAGR. India's SAM for organized retail eyewear
              (both online and physical chain stores) is approximately $3-4 billion, given that organized retail serves
              only 30-40% of total market demand. Lenskart's SOM, based on its FY26 India revenue of approximately
              ₹5,300 crore (~$630M), implies roughly 6-8% of the total India eyewear market and approximately 15-20% of
              the organized segment. The key sizing constraint is the massive unorganized market share; converting even
              10% of unorganized demand to organized retail represents a $600-700M opportunity for Lenskart
              specifically.
