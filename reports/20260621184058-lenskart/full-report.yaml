      - number: '2.5'
        title: Sizing Gaps and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >-
              Significant discrepancies exist in market size estimates. Lenskart's own DRHP cites a $9 billion India
              eyewear market, while Titan's investor presentations reference a $3.4 billion market for their addressable
              segment. Analyst reports range from $4.1B (spectacles only, 2024) to $11.1B (all eyewear categories,
              2025). These differences arise from varying definitions of what is included (prescription-only vs all
              eyewear; organized vs total including unorganized; retail value vs manufacturer revenue). The most
              conservative estimate of $3.5-4B reflects the organized retail market accessible to chains like Lenskart
              and Titan, while the $9-11B figure includes the unorganized sector and all product categories. For
              valuation purposes, the $9-11B TAM is reasonable if Lenskart can systematically convert unorganized market
              share, but current penetration suggests the near-term addressable market is closer to $4-5B for organized
              players.
            claimRefs:
              - CM018
              - CM019
              - CM020
              - CM006
