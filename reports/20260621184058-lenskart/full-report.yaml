      - number: '8.3'
        title: Public Comparable Set and Multiple Gap
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to pressure-test Lenskart is to compare the IPO ambition with observable public-market
              sales multiples. Warby Parker is the closest digital-first optical retail comp, albeit smaller and
              US-only. Public data sources place Warby around $3.18-3.19 billion of market capitalisation and about
              $0.89 billion of trailing revenue in mid-2026, or roughly 3.6x trailing sales. EssilorLuxottica is a very
              different animal—global, mature, wholesale-heavy, and far more profitable—but it is still the sector’s
              public anchor. Mid-2026 data put it around $92 billion market cap with roughly €28.49 billion / $35
              billion of revenue and an EV/revenue multiple near 3.0x.


              Titan adds an India-listed consumer benchmark, but it must be handled carefully. Titan parent trades
              around ₹3.93 trillion market capitalisation on about ₹875.84 billion of revenue, or roughly 4.5x parent
              sales. Its EyeCare segment generated about ₹9.16 billion of FY26 revenue, which is useful as a scale
              reference for organised Indian eyewear, but there is no directly quoted public market cap for Titan
              EyeCare as a standalone business. That means any “8x Titan eyewear division” number is an analyst proxy,
              not an observed public multiple.


              Against that backdrop, Lenskart’s pricing gap is hard to ignore. The $6.1 billion private mark already
              sits at a premium to these comps, but a premium a growth private company might still defend. The $8-10
              billion IPO range asks public investors to pay a much fatter premium again, even after moving from private
              to public scrutiny. That does not mean the IPO cannot clear; it means the burden of proof shifts
              decisively onto management to show that revenue compounding, margin conversion, and international
              expansion will outpace what the current public comp set already discounts.
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
