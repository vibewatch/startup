  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Lenskart's customer-visible product surface is broad enough to behave like a full optical platform rather
              than a single eyewear SKU: official pages and the DRHP show prescription eyeglasses, sunglasses, contact
              lenses, progressive and reading-lens options, home eye testing, in-store diagnostics, and remote
              optometry-enabled workflows. The workflow starts with discovery on app, web, or store, but the important
              technical point is that Lenskart tries to collapse discovery, testing, merchandising, and fulfillment into
              one journey. AR try-on and the Compare Looks surface reduce selection friction before a prescription is
              finalized; home eye tests and remote eye-check flows widen access where in-store optometrist availability
              is constrained; and the company keeps both online and store browsing tied to the same inventory and sales
              stack. The result is a product architecture built around conversion from diagnosis to frame selection to
              controlled fulfillment rather than around isolated catalog pages.
