  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Likelihood-versus-impact view of the main residual risks, with founder concentration, China-linked sourcing, and
      manufacturing concentration occupying the highest-risk cells.
    approximationNotes: Placement is qualitative and based on source-backed residual exposure rather than a statistical loss model.
    claimRefs:
      - CR002
      - CR010
      - CR021
      - CR025
      - CR036
      - CR043
      - CR044
    data:
      columns:
        - Low Impact
        - Medium Impact
        - High Impact
        - Critical Impact
      rows:
        - label: High Likelihood
          values:
            - label: n/a
              tone: neutral
            - label: Consumer-service lapse
              tone: warning
            - label: India concentration persists
              tone: warning
            - label: China input / FX pressure
              tone: negative
        - label: Medium Likelihood
          values:
            - label: Minor IP dispute
              tone: neutral
            - label: AI privacy backlash
              tone: warning
            - label: Competition-driven margin pressure
              tone: warning
            - label: Founder / IPO execution slip
              tone: negative
        - label: Low Likelihood
          values:
            - label: n/a
              tone: neutral
            - label: Franchise governance flare-up
              tone: warning
            - label: Telangana ramp delay
              tone: warning
            - label: ED / disclosure escalation
              tone: negative
        - label: Very Low Likelihood
          values:
            - label: n/a
              tone: neutral
            - label: n/a
              tone: neutral
            - label: Medical-device rule shock
              tone: warning
            - label: Bhiwadi-Gurugram multi-site outage
              tone: negative
  - id: FR002
    title: Impact timeline
    type: timeline
    layout: wide
    summary: >-
      Public milestones showing how manufacturing diversification, IPO preparation, regulatory friction, and AI product
      rollout stacked on top of each other entering FY27.
    approximationNotes: >-
      Timeline uses only events visible in retained public sources and therefore omits private remediation or board
      actions.
    claimRefs:
      - CR006
      - CR007
      - CR010
      - CR028
      - CR034
      - CR046
    data:
      items:
        - date: 2024-12
          label: Telangana factory plan becomes public
          detail: >-
            Lenskart signs a Rs 1,500 crore Telangana MoU, but the plant is still a mitigation-in-progress rather than
            active diversification.
          tone: warning
          claimRefs:
            - CR026
            - CR028
        - date: 2025-07
          label: DRHP and India-heavy expansion plan
          detail: >-
            The IPO plan points fresh capital toward more India stores, leases, and technology rather than a simple
            balance-sheet reset.
          tone: warning
          claimRefs:
            - CR006
            - CR020
        - date: 2025-08
          label: Franchisees take disclosure concerns to SEBI
          detail: A public complaint adds governance and process risk directly into the IPO narrative.
          tone: negative
          claimRefs:
            - CR008
            - CR009
        - date: 2025-10
          label: RHP exposes India and franchise concentration
          detail: >-
            Updated IPO reporting keeps India as the larger revenue geography and shows franchise stores are still a
            meaningful share of the network.
          tone: warning
          claimRefs:
            - CR014
            - CR047
        - date: 2026-02
          label: International growth improves but input sensitivity remains
          detail: Q3 FY26 brings a 40% international mix, yet cost of material still consumes a large share of expense.
          tone: warning
          claimRefs:
            - CR015
            - CR024
        - date: 2025-10
          label: RHP goes live while ED inquiry remains pending
          detail: Public-market launch proceeds with an unresolved import-export compliance overhang still in the record.
          tone: negative
          claimRefs:
            - CR007
            - CR010
        - date: 2026-05
          label: AI glasses and 3,327-store scale increase control surface
          detail: >-
            Smart-glasses rollout and a much larger omnichannel footprint widen privacy, service, and execution demands
            at the same time.
          tone: warning
          claimRefs:
            - CR017
            - CR018
            - CR034
            - CR046
        - date: 2026-05
          label: FY26 closes with deeper India footprint
          detail: >-
            Lenskart finishes FY26 after adding 603 stores and 157 cities, which helps reach but also keeps execution
            concentrated in the retail network.
          tone: warning
          claimRefs:
            - CR017
  - id: FV001
    title: Recommendation Logic
    type: flow
    layout: wide
    summary: >-
      Lenskart is a quality growth business, but current IPO talk asks public investors to pay too much of that future
      value upfront.
    data:
      nodes:
        - id: scale
          label: FY26 scale
          detail: ₹90.0B revenue, 603 net new stores, operating cash flow funded expansion
        - id: quality
          label: Business quality
          detail: 69% gross margin and vertically integrated omnichannel model
        - id: premium
          label: Premium justified to a point
          detail: $6.1B private mark = ~5.8x sales
        - id: public-gap
          label: Public pricing gap
          detail: $8-10B IPO talk = ~7.6-9.5x sales vs lower public peer multiples
        - id: decision
          label: Recommendation
          detail: research-more / stretched until price or proof improves
      edges:
        - from: scale
          to: quality
          label: supports
        - from: quality
          to: premium
          label: earns
        - from: premium
          to: public-gap
          label: but
        - from: public-gap
          to: decision
          label: drives
    approximationNotes: Logic chain simplifies a multi-variable underwriting view into the main valuation transmission steps.
    claimRefs:
      - CV006
      - CV007
      - CV010
      - CV033
      - CV041
