      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The primary buyer segments for organized eyewear retail in India include urban middle-class consumers aged
              18-45 (largest segment by volume), premium/fashion-conscious consumers seeking branded frames, first-time
              eyewear users driven by increased screen time and awareness, and corporate/institutional buyers through
              employee wellness programs. The buyer-user-payer dynamic varies: for individual consumers, the buyer is
              typically the user and payer; for corporate eye-care programs, the employer is the payer while employees
              are users; for children's eyewear, parents are buyers/payers. Budget ownership sits with individual
              disposable income for most purchases (average ticket size ₹2,000-5,000 for prescription glasses), health
              insurance for some premium purchases, and corporate wellness budgets for B2B programs. Adoption triggers
              include first vision problem diagnosis (typically age 15-25 for myopia), lifestyle/fashion aspiration, and
              replacement cycle (average 2-3 years for prescription changes).
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
