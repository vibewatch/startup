      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Key growth drivers for India's eyewear market include rising myopia prevalence (projected 32% by 2030 from
              21% in 2019 among urban children), increasing digital screen time, rising disposable incomes in Tier-2/3
              cities, growing fashion consciousness treating eyewear as an accessory rather than medical device,
              government eye-health initiatives, and the ongoing shift from unorganized to organized retail. Adoption
              constraints include low awareness of vision correction needs in rural India (86% of adolescents with
              refractive errors in rural areas have no correction), price sensitivity in lower-income segments, limited
              optometrist availability outside metros, cultural stigma around wearing glasses in some communities, and
              the dominance of local unorganized opticians who offer credit and personalized service. The regulatory
              environment is favorable with no prescription barriers for basic eyeglasses, though medical device
              classification for contact lenses adds compliance complexity.
            claimRefs:
