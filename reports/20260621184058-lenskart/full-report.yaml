      - number: '3.4'
        title: Moat Durability and Status-Quo Risk
        blocks:
          - type: paragraph
            body: >-
              Lenskart's strongest public moat signals are store density, manufacturing-backed cost control,
              international operating leverage, and a broad enough price architecture to sell both entry and premium
              eyewear. But the evidence also shows why that moat is not unassailable. Titan and GKB are attacking with
              higher-trust service and premium diagnostics; Vision Express and Specsmakers use promotions and eye tests
              to keep switching friction low; Warby and EssilorLuxottica show that AI eyewear and branded lenses can
              shift profit pools away from commodity frames; and local opticians still win on proximity, personal
              relationships, and flexible price negotiation. Industry commentary increasingly argues that the next phase
              of Indian optical retail is about productivity and retention rather than just opening more stores, which
              is an adverse read-through for any chain relying only on rollout velocity. The upshot is that Lenskart
              still leads the organized field, but competitive durability comes from execution quality at the
              store-and-service layer, not from permanent winner-take-all economics.
            claimRefs:
              - CP002
              - CP024
              - CP025
              - CP026
              - CP027
              - CP034
              - CP035
