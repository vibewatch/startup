          detail: Singapore, Thailand, UAE, and Owndays-linked Asia markets reuse the same playbook.
          tone: positive
        - id: risk
          label: Execution break point
          detail: Refund, warranty, delivery, and prescription errors can interrupt referral-led growth.
          tone: warning
