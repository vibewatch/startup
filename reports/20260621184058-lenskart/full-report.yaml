      - number: '1.2'
        title: Founders and Leadership
        blocks:
          - type: paragraph
            body: >-
              Lenskart was co-founded by Peyush Bansal (Chairman, Managing Director & CEO), Amit Chaudhary (Executive
              Director, Global Expansion), and Sumeet Kapahi (Co-Founder, Global Head of Sourcing). Peyush Bansal holds
              a B.Tech from IIT Delhi and an MBA from McGill University; he previously worked at Microsoft before
              founding Lenskart at age 25. Neha Bansal, Peyush's wife, joined as Co-Founder and Executive Director
              responsible for Global Merchandising. The professional management layer includes Abhishek Gupta (CFO),
              Ramneek Khurana (Global Head of Technology), and Ashwani Agarwal (Global Head of Operations). The board
              was reconstituted ahead of the IPO in 2025: SoftBank's Sumer Juneja exited, replaced by independent
              directors Ashish Kashyap (INDmoney founder) and Sayali Karanjkar (PaySense founder). Other independents
              include Jayesh Tulsidas Merchant (former Asian Paints CFO) and Bijou Kurien (former Titan COO). Anant
              Gupta of Kedaara Capital serves as nominee director. Peyush Bansal also gained public visibility as a
              judge on Shark Tank India since Season 1 in 2022.
