      - number: '5.5'
        title: Quality Controls, Risks, and Open Technical Questions
        blocks:
          - type: paragraph
            body: >-
              Lenskart has more public process discipline than many consumer startups, but the risk picture is still
              real. The HTO flow has explicit clinical boundaries, which is positive because it shows the company is not
              presenting every eye issue as remotely solvable. The manufacturing side uses computer vision and SOP
              audits, and the filing cites warranty coverage on frame defects, which suggests structured quality
              governance. At the same time, the remote-optometry model concentrates clinical judgment into AI-assisted
              centralized workflows, and independent coverage notes liability and preventive-care concerns if scale
              outruns control. The smart-glasses roadmap introduces a second class of trust risk: camera-equipped AI
              eyewear brings privacy questions that public materials do not yet answer in much detail. The biggest
              diligence gap is not whether Lenskart uses AI—it clearly does—but whether it can publish stronger evidence
              on model governance, chatbot architecture, quality-error rates, and privacy controls as these systems move
              from merchandising aids into clinically or socially sensitive workflows.
