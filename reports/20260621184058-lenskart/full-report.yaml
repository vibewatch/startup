        title: Customer base scale and segment mix
        blocks:
          - type: paragraph
            body: >-
              Lenskart’s best public customer-base evidence is the eye-test funnel rather than vague user-language. In
              FY26 the company reported 23.8 million eye tests and said about half were first-time exams, implying
              roughly 11.9 million new-to-category interactions in a single year. Q4 alone reached 6.8 million eye tests
              and 4.3 million India transacting customer accounts, which is far beyond a niche premium-fashion eyewear
              story. The segment mix is also broader than a single urban D2C archetype. Public sources point to
              working-age urban professionals, young families, and middle-class households as the core audience, with
              explicit budget tiers for first-time and Tier-2/3 buyers and a premium lane for higher-ticket prescription
              products. The practical read is that Lenskart increasingly behaves like an everyday optical utility
              wrapped in a consumer-tech brand. What remains less exact is demographic precision: public sources support
              a broad working-age urban and middle-class center, but not a fully audited 18-45 age split.
