        - 69% gross margin, vertical integration, and automation create a credible premium-quality retail story.
        - If normalized earnings fail to rise with scale, the gross-margin story is not enough.
      - - Thesis
        - >-
          International exposure and a large installed store base support a broader platform narrative than India-only
          eyewear chains.
        - If overseas growth slows or integration economics disappoint, the platform premium narrows.
      - - Anti-thesis
        - >-
          The IPO ask implies 7.6-9.5x FY26 sales, above Warby Parker, EssilorLuxottica, and Titan parent sales
          multiples.
