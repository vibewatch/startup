          - type: callout
            title: Unorganized-to-Organized Shift is the Key Lever
            body: >-
              The single most important growth driver is not market expansion but market formalization — converting the
              60-70% unorganized optician share to organized chains through better service, price transparency, and
              convenience.
            calloutType: insight
            claimRefs:
