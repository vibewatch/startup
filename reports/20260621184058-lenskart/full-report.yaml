  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              The addressable market for Lenskart encompasses prescription eyeglasses, sunglasses, contact lenses, and
              eye-care services sold through organized retail (both online and offline) in India and select
              international markets. The core market includes frames, lenses (single vision, progressive, photochromic),
              coatings, and associated eye-testing services. Excluded from the primary TAM are surgical vision
              correction (LASIK/PRK), pharmaceutical eye-care products, and luxury designer eyewear sold exclusively
              through high-end retail. Adjacent markets include smart eyewear (AR glasses), blue-light filtering
              products, and corporate eye-care wellness programs. The status-quo substitute for organized eyewear retail
              in India remains the vast unorganized sector of approximately 100,000-150,000 independent optical shops,
              which still serve 60-70% of eyewear buyers, particularly in Tier-2+ cities and rural areas.
            claimRefs:
              - CM001
              - CM002
