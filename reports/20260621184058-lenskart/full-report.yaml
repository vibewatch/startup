  - id: TV006
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Valuation
      - Action Implication
    rows:
      - - Post-listing growth slowdown
        - Revenue growth drops materially below the mid-20s without offsetting margin expansion.
        - High-multiple growth premium compresses quickly.
        - Re-rate toward peer multiples; do not average up on narrative alone.
      - - Normalized profitability disappointment
        - Core PAT margin stays below ~3% after stripping one-time gains.
        - IPO valuation looks too earnings-light for public investors.
        - Reset base-case value and treat the premium as speculative.
      - - Secondary overhang
        - Large holders keep selling into or soon after lockup expiries.
        - Supply pressure caps multiple expansion and narrows public scarcity value.
        - Wait for supply absorption before underwriting upside.
      - - International execution wobble
        - Overseas revenue mix stops compounding or integration economics deteriorate.
        - Platform premium narrows; market reverts to India-only retail framing.
        - Cut bull-case probability and revisit public comp set.
      - - Governance / disclosure noise
        - Conflicting insider-pricing narratives or weak quarterly transparency persist.
        - Raises discount-rate and trust costs for public investors.
        - Demand wider margin of safety before entry.
    notes: Triggers focus on valuation transmission rather than generic operating risks.
