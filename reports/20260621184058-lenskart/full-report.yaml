  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape of Alternatives
        blocks:
          - type: paragraph
            body: >-
              Lenskart competes across four layers at once. The first is organized Indian chains, where Titan Eye+ is
              the most credible scaled incumbent and Specsmakers, Vision Express India, and GKB Opticals each attack
              narrower slices of the market. The second is global analogs and suppliers-to-retailers: Warby Parker shows
              what a mature omnichannel eyewear D2C model can look like, while EssilorLuxottica brings enormous
              premium-brand, lens, and smart-eyewear scale that can spill into India through distribution and
              partnerships. The third is the status quo substitute: unorganized neighborhood opticians, which still
              anchor trust, convenience, and price flexibility for a large share of Indian buyers. The fourth is
              adjacency, where AI eyewear, wearables, and premium imported brands can pull value away from plain-vanilla
              frames. On the evidence reviewed, Lenskart is still the only India-focused player operating at
              multi-thousand-store scale with meaningful international revenue, but the competitive question is not only
              who matches Lenskart feature-for-feature; it is who wins different customer jobs such as lowest opening
              price, fastest local service, strongest clinical trust, or aspirational premium branding.
            claimRefs:
