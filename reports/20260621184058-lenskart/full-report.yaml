      - number: '5.4'
        title: Brands and Differentiation
        blocks:
          - type: paragraph
            body: >-
              Lenskart's portfolio strategy is not brand sprawl for its own sake; the filing makes clear that the
              company uses brand segmentation to cover premium, affordable-premium, fashion-led, and children-specific
              use cases. John Jacobs and Owndays sit at the premium end, Vincent Chase anchors fast-fashion value, and
              Hooper is positioned around durability and comfort for children. That matters technologically because the
              same vertically integrated design-and-manufacturing backbone can be used to refresh collections quickly
              while controlling cost and quality. The DRHP also points to 241 trademarks, including John Jacobs and
              Vincent Chase, which adds IP depth even though public patent-level detail on try-on or diagnostics remains
              limited. The Owndays combination adds geographic reach and makes the computer-vision and omnichannel stack
              more exportable across Asia, while dedicated branded pages such as John Jacobs reinforce that segmentation
              is active in the live commercial surface rather than only described in investor documents.
