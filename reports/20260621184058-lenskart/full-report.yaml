      - number: '7.4'
        title: The mitigants are real, but they only work if diversification becomes measurable fast
        blocks:
          - type: paragraph
            body: >-
              Lenskart does have credible mitigants. International revenue is growing, overseas margins are improving,
              store rollout has been funded through operating cash generation, and management is trying to add new
              capacity, more AI tooling, and a deeper talent bench before the business becomes fully public. Those are
              not cosmetic. The problem is sequencing. Investors are being asked to believe that the company can expand
              factories, stores, AI products, and global operations at the same time it tightens listed-company
              governance and absorbs legal or regulatory noise. The thesis therefore breaks less on narrative than on a
              few monitorable triggers: a material disclosure or ED escalation, evidence that China sourcing remains
              stuck at current levels without a credible diversification path, a major Bhiwadi-Gurugram disruption,
              slower international mix improvement, or a visible pricing or service response from Titan,
              EssilorLuxottica, or other organized competitors. If those triggers stay quiet while Telangana and
              overseas mix improve, the current risk discount should compress; if not, the IPO multiple can unwind
              quickly.
