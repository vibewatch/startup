      - number: '8.4'
        title: Scenario Ranges and Kill Triggers
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more useful than a single point estimate because Lenskart is crossing from private
              marks into public price discovery. In a bull case, investors continue to award a near-IPO premium because
              Lenskart sustains 25%+ revenue growth, demonstrates that FY26 cash generation was not a one-off, and keeps
              pushing margin expansion through store productivity and automation. That supports a valuation roughly
              around $9.5-10.5 billion. In a base case, the market accepts Lenskart as a high-quality but not
              category-exempt retailer and prices it closer to 6-7x FY26 sales, yielding about $6.3-7.4 billion—much
              closer to Fidelity’s last known mark than to the upper IPO chatter.


              The bear case is not “business broken”; it is “multiple compression.” If investors focus on normalized
              earnings, one-time gains, and the large secondary component of the deal, Lenskart could be re-rated closer
              to public peer parity at roughly 3.5-4.5x sales, or about $3.7-4.7 billion. That is still a meaningful
              business, but it would leave IPO buyers with clear downside if they enter at the top of the discussed
              range.


              Probability-weighting those scenarios at 25% bull, 50% base, and 25% bear yields a central value of
              roughly $6.8 billion. That does not suggest that Lenskart is overvalued at any price; it suggests that the
              spread between fair private value and aggressive public ask is too wide to ignore. The main kill triggers
              are straightforward: post-listing growth slipping below the mid-20s, normalized margin failing to converge
              upward, and sustained selling pressure from founders or large investors once lockups expire.
            claimRefs:
              - CV006
              - CV007
              - CV030
              - CV031
              - CV033
              - CV036
              - CV037
              - CV038
              - CV039
              - CV044
