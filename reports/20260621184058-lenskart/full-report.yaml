            body: >-
              International leadership and domestic breadth both look credible, but the durability risks sit in
              disclosure gaps and service consistency. The most repeated international boast—that one in three
              Singaporeans wear Lenskart glasses—has already softened in later management commentary to about one in
              four and remains unverified by any independent country-level customer audit. In India, the customer engine
              is still heavily store-dependent: IPO proceeds were earmarked for new CoCo stores, lease obligations,
              marketing, and tech, while stores themselves function as community optical nodes. That is powerful if NPS
              stays high, but it also means local service gaps, delivery slippage, or warranty friction can degrade the
              referral loop management explicitly depends on. The largest unresolved diligence point is retention
              quality by cohort: Lenskart does not disclose NRR, GRR, repeat-purchase rates, or channel-wise cohort
              behavior. The bottom line is constructive on adoption scale and channel breadth, but only moderately
              confident on post-purchase durability until management shares cohort data and cleaner country-level
              customer evidence.
