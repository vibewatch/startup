      - number: '1.3'
        title: Funding History and Valuation
        blocks:
          - type: paragraph
            body: >-
              Lenskart has raised over $1 billion in primary and secondary capital since inception. Key funding
              milestones include a $100M round from Epiq Capital in 2020, $250M from SoftBank Vision Fund in 2021, a
              $400M Series J from SoftBank and Temasek in January 2022 at a $4.5B valuation, and a $500M round from Abu
              Dhabi Investment Authority (ADIA) in 2023 at $4.5B. In June 2024, the company raised $200M in a secondary
              transaction from Temasek and Fidelity at a $5B valuation. In July 2024, co-founders subscribed to 695,875
              CCPS at ₹2,300 per share, raising approximately ₹165 crore (~$20M) internally — this is the qualifying
              post-June-2024 financing event. Fidelity marked up its Lenskart stake to $5.6B in November 2024 and to
              $6.1B in April 2025. The company filed its DRHP with SEBI in July 2025 for a ₹2,150 crore fresh issue plus
              an OFS of 13.2 crore shares, targeting an IPO valuation of $8-10 billion. Promoter group (primarily Peyush
              Bansal) held approximately 20% pre-IPO; SoftBank Vision Fund remains the largest institutional shareholder
              despite exiting the board.
