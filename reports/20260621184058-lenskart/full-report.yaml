      - number: '1.4'
        title: Scale and Operations
        blocks:
          - type: paragraph
            body: >-
              As of FY26, Lenskart operates 2,723 stores globally, having added 603 net new stores in FY26 (542 in
              India). The company's revenue reached ₹8,814 crore in FY26 (approximately $1.05B at prevailing exchange
              rates), growing 32% year-over-year from ₹6,652.5 crore in FY25. Lenskart achieved its first full-year
