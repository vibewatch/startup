      - number: '7.2'
        title: Operations still depend on China-linked sourcing, concentrated factories, and controllable service quality
        blocks:
          - type: paragraph
            body: >-
              The second major risk cluster is operational. Lenskart has real vertical-integration advantages, but the
              same model creates concentrated failure points. Public IPO reporting says the company still sources a
              large share of raw materials from China, including through the Baofeng Framekart joint venture, while raw
              materials remain a meaningful share of total expenses. Disruption in foreign exchange, trade policy,
              freight, or vendor reliability therefore feeds directly into margin and inventory risk. Manufacturing is
              also not yet fully diversified: Bhiwadi remains the largest disclosed facility, the Gurugram-Bhiwadi
              cluster is explicitly called out as a concentration risk, and the Telangana plant meant to broaden
              capacity is still being built. On top of that, consumer-court orders on warranty and promotional disputes
              show that service controls are not abstract. As Lenskart extends AI-led eye testing, same-day delivery,
              and smart glasses, privacy, product-governance, and after-sales controls become part of the operating-risk
              surface rather than a side issue.
