      - - Anti-thesis
        - >-
          Adverse sources argue FY25 profit quality was flattered by one-time gains and heavy selling-shareholder
          participation.
        - Sustained clean profits and lockup discipline would reduce the concern.
      - - Anti-thesis
        - >-
