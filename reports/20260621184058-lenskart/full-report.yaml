              The customer acquisition model is unmistakably omnichannel, but not symmetric. Stores remain the physical
              trust layer for eye tests, frame try-on, pickup, repair, and service, while digital surfaces drive
              discovery, shortlisting, and assisted conversion. Management disclosed that about 50% of FY26 India
              revenue was digitally influenced, up from roughly 45% in FY25, yet it still does not publish a clean
