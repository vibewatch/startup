        title: Exhibits
        blocks:
          - type: callout
            title: Massive Underpenetration = Growth Runway
            body: >-
              With 800M+ Indians needing vision correction and only ~25% currently served by organized retail,
              Lenskart's addressable market has a multi-decade structural growth runway independent of GDP cyclicality.
            calloutType: strength
            claimRefs:
