chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Lenskart Solutions Ltd (formerly Valyoo Technologies Pvt Ltd) is India's largest omnichannel eyewear
              retailer, headquartered in Gurugram, Haryana, India. The company was incorporated in 2010 and operates a
              vertically-integrated model spanning e-commerce, 2,700+ physical retail stores, in-house lens and frame
              manufacturing, and AI-powered eye diagnostics. Lenskart sells prescription eyeglasses, sunglasses, and
              contact lenses through its own brands (Vincent Chase, John Jacobs, Hooper) and licensed international
              brands. The company's Singapore entity Lenskart Solutions Pte Ltd historically served as the parent
              holding company, though the Indian entity Lenskart Solutions Ltd became the primary listing vehicle
              following its conversion to a public limited company in May 2025. Lenskart generates revenue through
              direct-to-consumer retail sales across online and offline channels, with approximately 60% of FY25 revenue
              from India and 40% from international operations including Singapore, Japan (via Owndays subsidiary), UAE,
              and Southeast Asia.
