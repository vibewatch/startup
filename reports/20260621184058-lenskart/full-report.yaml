            body: >-
              Lenskart's strongest product-technology differentiation is the coupling of design, lens production, frame
              manufacturing, distribution, and quality control. The DRHP says the company began generating frame
              structures, moulds, lens design, and manufacturing in-house in 2021, and that the Bhiwadi site runs a
              fully automated lens-surfacing line until the quality-check stage. Mint adds that Bhiwadi combines a lens
