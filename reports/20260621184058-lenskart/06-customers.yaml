- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration or blocker
  - impact
  - diligence path
  rows:
  - - 23.8 million annual eye tests
    - Conversion from test to first purchase and repeat purchase is undisclosed
    - Top-of-funnel scale is proven, but unit economics by cohort remain opaque
    - Request test-to-purchase, first-purchase, and repeat-purchase conversion by city and product category
  - - 3,327-store omnichannel network
    - Customer experience can vary materially by local store, staff, and service recovery quality
    - If service execution slips, the referral engine can weaken despite high official NPS
    - Request complaint closure rate, service TAT, and warranty outcomes by store format and region
  - - ~40% of revenue from international operations
    - Country-level customer counts and NPS are mostly undisclosed
    - Hard to tell whether overseas economics depend on a few standout markets like Singapore and Japan
    - Request country-level transacting customer accounts, same-store growth, and NPS by region
  - - Singapore flagship market
    - One-in-three or one-in-four penetration claim is unaudited and internally inconsistent over time
    - The flagship international proof point could be overstated if the denominator is loose
    - Request audited active-customer count and exact definition of Singapore market leadership
  - - Digital demand generation
    - Booked online versus offline revenue split is missing even though digital influence is disclosed
    - Without clean channel mix, CAC and margin by channel stay hard to judge
    - Request order and revenue split by online, store, and assisted omnichannel journey
  - - Gold membership and referrals
    - Gold scale is disclosed but renewals, replacement cycles, and cohort retention are not
    - Loyalty could be shallower than the headline member count implies
    - Request Gold renewal, repeat purchase, and lens-replacement cohorts over 12-24 months
  notes: The main customer risk is not lack of demand; it is whether Lenskart can preserve referral-driven satisfaction while scaling stores, geographies, and after-sales complexity faster than it discloses cohort data.
