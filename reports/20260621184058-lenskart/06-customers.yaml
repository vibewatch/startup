callouts:
- calloutType: insight
  title: Eye tests are the real customer-count proxy
  body: The cleanest public customer-scale metric is not headline customer count but the 23.8 million eye-test funnel, because first-time exams show Lenskart is still creating category demand rather than only harvesting existing optical spend.
  claimRefs:
  - CU001
  - CU003
  - CU004
- calloutType: risk
  title: Official NPS and public reviews diverge sharply
  body: Lenskart’s official India NPS is excellent, but third-party review and complaint forums still skew adverse on refunds, delivery, quality control, and store-level resolution. That gap is the chapter’s main durability caution.
  claimRefs:
  - CU006
  - CU030
  - CU031
  - CU032
  - CU033
- calloutType: insight
  title: Singapore traction is credible, but the population-penetration line is not independently verified
  body: Singapore clearly matters as a flagship overseas market, yet the famous one-in-three claim shifted to one-in-four in later management commentary and remains unaudited. Treat it as directional proof of traction, not a bankable market-share fact.
