  - - Gold active members
    - 8.8 million members at FY26 end
    - Best official loyalty-scale proxy for repeat intent and wallet share
    - High
    - Provide Gold renewal and repeat purchase rates by cohort
  - - Word-of-mouth dependence
    - Management says majority of new customers come through referrals
    - Important because service quality can directly affect acquisition efficiency
    - Medium
    - Provide referral share by market and post-complaint churn
  - - Delivery and convenience surface
    - Next-day delivery in 78 Indian cities and same-day in select markets including Singapore
    - Speeds post-purchase satisfaction and lowers replacement friction
    - High
    - Provide on-time delivery rates and issue-resolution SLAs
  - - Trustpilot snapshot
    - 1.7 / 5, with recurring refund, quality, and staff complaints
    - Adverse external check on official NPS narrative
    - Medium
    - Share internal complaint categories and closure times against public allegations
  - - PissedConsumer snapshot
    - 1.4 / 5 from 164 reviews
    - Adverse external signal on after-sales service quality
    - Medium
    - Provide replacement, refund, and exchange completion rates
  - - ComplaintsBoard complaint resolution
    - 5% of 17 listed complaints marked resolved
    - Signals post-purchase process risk even if some positive reviews exist
    - Low
    - Provide company-side resolved/unresolved counts for official channels
  notes: This table intentionally mixes official NPS and loyalty data with independent review-platform proxies. The measures are not directly comparable, but the contrast is analytically important for judging durability.
