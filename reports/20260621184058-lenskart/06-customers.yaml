- id: proof-retention-and-satisfaction
  title: Customer proof, retention proxies, and satisfaction
  body: Customer proof exists, but it is mixed-quality and sometimes contradictory. Officially, India NPS reached 81.4 in Q4 FY26 and 79.8 for the full year, Gold active members hit 8.8 million, and management says word of mouth drives the majority of new customers. Those are strong signals of satisfaction and repeat intent. Independent public evidence is much harsher. Trustpilot’s archived February 2026 snapshot rated lenskart.com 1.7 out of 5; PissedConsumer showed 1.4 out of 5 from 164 reviews; SmartCustomer summarized 1.9 stars; ConsumerComplaints and ComplaintsBoard surface repeated issues around refunds, delayed deliveries, warranty disputes, product quality, and unresponsive stores or support. The right synthesis is not that one side is necessarily false. Instead, Lenskart appears to deliver a strong top-of-funnel brand and service promise at scale, but with meaningful execution volatility after purchase. That volatility matters more for prescription eyewear than for many retail categories
    because wrong power, fit problems, refund delays, or poor warranty handling directly affect whether customers return or refer.
