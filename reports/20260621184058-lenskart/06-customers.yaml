company:
  name: Lenskart
chapter:
  number: 6
  title: Customers
  summary: 'Lenskart’s customer engine is real: FY26 eye tests reached 23.8 million, roughly half first-time, with 4.3 million Q4 India transacting accounts, 8.8 million Gold members, and a store network that acts as trust, service, and conversion infrastructure while digital surfaces influence about half of India revenue. The chapter is strongest on adoption scale and omnichannel breadth, but more cautious on durability because official NPS is high while third-party review platforms still show persistent refund, delivery, and after-sales friction.'
sections:
- id: customer-base-and-segments
  title: Customer base scale and segment mix
  body: 'Lenskart’s best public customer-base evidence is the eye-test funnel rather than vague user-language. In FY26 the company reported 23.8 million eye tests and said about half were first-time exams, implying roughly 11.9 million new-to-category interactions in a single year. Q4 alone reached 6.8 million eye tests and 4.3 million India transacting customer accounts, which is far beyond a niche premium-fashion eyewear story. The segment mix is also broader than a single urban D2C archetype. Public sources point to working-age urban professionals, young families, and middle-class households as the core audience, with explicit budget tiers for first-time and Tier-2/3 buyers and a premium lane for higher-ticket prescription products. The practical read is that Lenskart increasingly behaves like an everyday optical utility wrapped in a consumer-tech brand. What remains less exact is demographic precision: public sources support a broad working-age urban and middle-class center, but not
    a fully audited 18-45 age split.'
