tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - segment
  - buyer / user / payer
  - primary job to be done
  - public scale or evidence signal
  - strategic value
  - key gap
  rows:
  - - Urban professionals and students
    - Usually self / self / self
    - Prescription eyewear plus style-led refresh for daily screen time, office, and commute use
    - Supported by urban and middle-class demographic framing plus app-led discovery tools
    - Largest organized-retail pool and the easiest to monetize digitally
    - No audited age-band or income-band breakout
  - - Middle-class family households
    - Parent or household head / one or more family users / household budget
    - Affordable prescription, kids eyewear, replacements, and multi-pair purchases
    - Budget pricing, free eye tests, and home services are positioned for family adoption
    - Expands beyond single-person fashion use into household optical utility
    - No disclosed household share or family repeat-purchase data
  - - Tier-2/3 first-time buyers
    - Usually self or parent / user / household budget
    - First eye test and first branded prescription purchase in underpenetrated towns
    - 254 FY26 India store additions were in Tier-2+ markets and sources explicitly cite first-time cohorts
    - Important source of category creation, not only market-share capture
    - No city-level conversion cohort or CAC data
  - - Budget first-time buyers
    - Self or parent / user / payer
    - Low-ticket entry purchase that solves first prescription or replacement need
    - Entry tier starts around Rs 999 in public case-study sources
    - Feeds volume and first-time acquisition at scale
    - No disclosed margin or repeat behavior by budget tier
  - - Mid-premium and premium prescription buyers
    - Self / self / self
    - Higher-ASP frames, progressive lenses, and branded products with better fit and finish
    - Mid-premium and premium price bands are explicitly called out in case-study sources; official commentary also notes premium mix expansion
    - Supports wallet-share expansion without abandoning accessibility
    - No public cohort on how premium buyers retain versus entry buyers
  - - International urban mall and app shoppers
    - Usually self / self / self
    - Quick optical purchase in Singapore, Japan or Gulf malls, with online-to-store support for replenishment or contact lenses
    - Singapore, Thailand, and UAE are cited as app-led or omnichannel overseas markets
    - Proves the model can travel beyond India with localized assortment
    - Country-level customer counts and NPS remain largely undisclosed
  notes: Segmentation is synthesized from official operating commentary, public pricing bands, and case-study evidence. Public sources support a broad working-age urban and middle-class core, but not a fully audited age split.
