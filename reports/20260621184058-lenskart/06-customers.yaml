- id: TU006
  title: Channel and international footprint table
  columns:
  - channel / market
  - latest public scale
  - evidence
  - customer role
  - implication
  - gap
  rows:
  - - India stores
    - 2,609 stores and 556 cities in FY26
    - Official shareholder letter
    - Eye tests, try-on, conversion, pickup, repair, and service
    - Physical trust layer is still central to acquisition and retention
    - Same-store productivity by customer cohort is undisclosed
  - - India digital influence
    - ~50% of FY26 India revenue digitally influenced
    - Official shareholder letter
    - Discovery, shortlisting, assisted conversion, and repeat browsing
    - Digital is material even when stores close many purchases
    - Booked online/offline revenue split is undisclosed
  - - Global store base
    - 2,723 around FY25 / 3,327 active stores by FY26
    - D2C Pulse plus FY26 official disclosures
    - Shows how quickly omnichannel density scaled
    - The physical network is still expanding fast enough to reshape customer reach annually
    - Different periods create apparent metric conflict if dates are ignored
  - - Singapore
    - 70 stores in late 2023; later market-leader and same-day-delivery claims
    - Economic Times and Moneycontrol
    - High-penetration proving ground for Lenskart-branded overseas retail
    - Strongest public evidence for direct international customer pull
    - One-in-three or one-in-four penetration remains unaudited
  - - UAE / Middle East
    - 41 Middle East stores by FY26 end; app-led and online-driven growth cited
    - Official shareholder letter
    - Regional growth node and testbed for omnichannel convenience
    - Confirms Gulf relevance without dominating the international mix
    - No country-level customer count or NPS disclosed
  - - Owndays-linked SEA footprint
    - 97.67% indirect Owndays ownership after May 2026 top-up
    - BusinessLine and Indian Retailer
    - Partner-led scale in Japan and Southeast Asia beyond greenfield openings
    - Gives Lenskart regional depth without relying only on India exports
    - Country-level retail productivity and customer cohorts are not public
  notes: 'This table separates direct Lenskart-branded channels from the broader partner and acquired-brand footprint. Period labels matter: 2,723 and 3,327 refer to different moments in the expansion curve, not necessarily a direct contradiction.'
