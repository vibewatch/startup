- id: TU003
  title: Named customer proof table
  enumerationScope:
    coverage: sample
    basis: This sample captures the strongest attributed public customer experiences found across independent review and complaint surfaces; it is not a representative or exhaustive roster of Lenskart customers by market or product.
  columns:
  - customer / proof source
  - segment
  - deployment / use case
  - production vs pilot
  - outcome / signal
  - limitation
  rows:
  - - Ramanan A Bol (PissedConsumer, Jun 2026)
    - India prescription buyer
    - Two-pair order with delayed second pair and weak store follow-up
    - Production post-purchase experience
    - Shows real buyer usage but also exposes after-sales friction
    - Single public complaint; no company-side resolution metric
  - - Singapore warranty reviewer (SmartCustomer, Apr 2025)
    - Singapore international store buyer
    - Warranty complaint around rusty screw, coating defects, and broken frame parts
    - Production post-purchase experience
    - Useful proof that Singapore has real repeat or warranty interactions, not just marketing claims
    - Public review only; no order history or frequency disclosed
  - - ConsumerComplaints progressive-lens buyer (Chennai, 2025)
    - India premium prescription buyer
    - Repeated attempts to resolve poor progressive-lens experience after a Rs 20,000 purchase
    - Production post-purchase experience
    - Shows that premium buyers can still face prescription-quality and service resolution issues
    - Customer narrative is unattributed beyond platform text and not independently verified
  - - Trustpilot prescription complaint (Feb 2026)
    - India store or online-assisted buyer
    - Wrong left/right eye power, refund friction, and perceived medical-negligence risk
    - Production post-purchase experience
    - Highlights the downside if prescription accuracy or escalation fails
    - Archived review snapshot, not a verified company case study
  - - ComplaintsBoard replacement review
    - General consumer buyer
    - Customer says original frame issue was resolved with a replacement of their choice
    - Production post-purchase experience
    - Provides at least one positive public proof that replacements can work well
    - Date and order context are not fully standardized by the platform
  notes: For consumer retail, attributed public reviews are the closest public equivalent to enterprise case studies. The sample is intentionally mixed because the public record shows both positive service recovery and adverse prescription, refund, and warranty experiences.
  claimRefs:
  - CU030
  - CU031
  - CU032
  - CU033
  - CU034
  - CU035
