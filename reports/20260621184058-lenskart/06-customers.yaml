  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: A verified customer roster or structured case-study set showing buyer type, product bought, purchase date, repeat status, and outcome by market is not publicly available.
    whyItMatters: The chapter can show attributed public experiences, but not a representative named sample of Lenskart’s customer base or repeat economics.
    diligencePath: Request anonymized but structured customer cohorts and 10 to 20 referenceable customer interviews split across India, Singapore, UAE, and Owndays-linked SEA markets.
    relatedQuestionRefs:
    - QU016
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: channel-mix
    missingEvidence: Booked revenue and order share by online, store, and digitally assisted or omnichannel conversion path is not publicly disclosed.
    whyItMatters: Digitally influenced revenue is directionally useful but does not reveal channel margins, CAC, or how dependent the model remains on physical conversion.
    diligencePath: Request FY25-FY26 revenue and orders by pure online, store-led, and assisted omnichannel journeys, plus the same split for India versus international markets.
    relatedQuestionRefs:
    - QU010
  - type: private-evidence-only
    severity: material
    topic: retention-cohorts
    missingEvidence: NRR, GRR, repeat purchase rates, Gold renewal, replacement-cycle cohorts, and complaint-closure rates by cohort remain private.
    whyItMatters: Without retention cohorts, official NPS and Gold member growth cannot be translated into hard customer lifetime value or durability.
    diligencePath: Request 12-24 month repeat-purchase cohorts by country, Gold renewal rates, lens replacement frequency, and refund or warranty closure times segmented by store format.
    relatedQuestionRefs:
    - QU022
    - QU026
  - type: conflicting-data
    severity: minor
    topic: singapore-penetration
    missingEvidence: Independent customer counts or audited market-share denominators for Singapore are absent, while management commentary itself shifts from one in three to one in four.
    whyItMatters: Singapore is the flagship international proof point, so overstating penetration could make the overseas moat look stronger than it really is.
    diligencePath: Request audited active-customer counts, repeat customer share, and management’s exact denominator for the Singapore penetration claim.
    relatedQuestionRefs:
    - QU014
