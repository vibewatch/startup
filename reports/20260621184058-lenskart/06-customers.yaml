- id: omnichannel-and-international-footprint
  title: Omnichannel channels and international footprint
  body: 'The customer acquisition model is unmistakably omnichannel, but not symmetric. Stores remain the physical trust layer for eye tests, frame try-on, pickup, repair, and service, while digital surfaces drive discovery, shortlisting, and assisted conversion. Management disclosed that about 50% of FY26 India revenue was digitally influenced, up from roughly 45% in FY25, yet it still does not publish a clean booked online-versus-offline revenue split. That matters because the economics likely still depend on stores as conversion and service hubs even when journeys start online. The footprint has scaled quickly enough to create metric confusion: FY25 and IPO-period syntheses still cite roughly 2,723 global stores, while the FY26 shareholder letter reports 3,327 active stores including 718 internationally. Abroad, the strongest evidence is in Singapore and the broader Owndays-linked Asia footprint: FY25 outside-India operations had 656 stores, 2.47 million transacting customers, and nearly
    40% of group revenue, with Q4 FY26 growth still described as same-store and online led in Singapore, Thailand, and the UAE.'
