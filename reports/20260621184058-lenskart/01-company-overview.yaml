callouts:
  - calloutType: "strength"
    title: "Vertically-Integrated Moat"
    body: "Lenskart's ownership of the entire value chain — from manufacturing through retail to eye testing — creates significant barriers to entry and enables 68.5% product margins, among the highest in global eyewear retail."
    claimRefs: ["CO024", "CO025", "CO003"]
  - calloutType: "strength"
    title: "IPO-Ready Profitability"
    body: "The company achieved its first full-year profit in FY25 (₹297 Cr) and accelerated to ₹501 Cr in FY26, demonstrating sustainable unit economics ahead of its planned $8-10B IPO."
    claimRefs: ["CO021", "CO022", "CO030"]
  - calloutType: "risk"
    title: "Key-Person Dependency on Peyush Bansal"
    body: "The brand is heavily identified with founder Peyush Bansal, who serves as Chairman/MD/CEO and is the company's primary public spokesperson through Shark Tank India. His departure or reputational damage could materially impact the brand."
    claimRefs: ["CO006", "CO011"]
  - calloutType: "insight"
    title: "Founder Pre-IPO Stake Consolidation"
    body: "Peyush Bansal acquired 4.27 crore shares at ₹52/share (₹221 Cr) from early investors in July 2025, signaling strong founder conviction in the IPO pricing upside (target ₹510/share represents ~10x return)."
    claimRefs: ["CO019", "CO031"]
