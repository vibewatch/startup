company:
  name: "Lenskart"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Lenskart is India's largest omnichannel eyewear retailer, founded in 2010, now operating 2,700+ stores globally with vertically-integrated manufacturing. The company filed its DRHP with SEBI in July 2025 targeting a $8-10B IPO after reaching profitability in FY25 with revenue of ₹6,652 crore."
sections:
  - id: "identity-and-business-model"
    title: "Identity and Business Model"
    body: "Lenskart Solutions Ltd (formerly Valyoo Technologies Pvt Ltd) is India's largest omnichannel eyewear retailer, headquartered in Gurugram, Haryana, India. The company was incorporated in 2010 and operates a vertically-integrated model spanning e-commerce, 2,700+ physical retail stores, in-house lens and frame manufacturing, and AI-powered eye diagnostics. Lenskart sells prescription eyeglasses, sunglasses, and contact lenses through its own brands (Vincent Chase, John Jacobs, Hooper) and licensed international brands. The company's Singapore entity Lenskart Solutions Pte Ltd historically served as the parent holding company, though the Indian entity Lenskart Solutions Ltd became the primary listing vehicle following its conversion to a public limited company in May 2025. Lenskart generates revenue through direct-to-consumer retail sales across online and offline channels, with approximately 60% of FY25 revenue from India and 40% from international operations including Singapore, Japan (via Owndays subsidiary), UAE, and Southeast Asia."
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO005"]
    tableRefs: ["TO001"]
    figureRefs: ["FO003"]
  - id: "founders-and-leadership"
    title: "Founders and Leadership"
    body: "Lenskart was co-founded by Peyush Bansal (Chairman, Managing Director & CEO), Amit Chaudhary (Executive Director, Global Expansion), and Sumeet Kapahi (Co-Founder, Global Head of Sourcing). Peyush Bansal holds a B.Tech from IIT Delhi and an MBA from McGill University; he previously worked at Microsoft before founding Lenskart at age 25. Neha Bansal, Peyush's wife, joined as Co-Founder and Executive Director responsible for Global Merchandising. The professional management layer includes Abhishek Gupta (CFO), Ramneek Khurana (Global Head of Technology), and Ashwani Agarwal (Global Head of Operations). The board was reconstituted ahead of the IPO in 2025: SoftBank's Sumer Juneja exited, replaced by independent directors Ashish Kashyap (INDmoney founder) and Sayali Karanjkar (PaySense founder). Other independents include Jayesh Tulsidas Merchant (former Asian Paints CFO) and Bijou Kurien (former Titan COO). Anant Gupta of Kedaara Capital serves as nominee director. Peyush Bansal also gained public visibility as a judge on Shark Tank India since Season 1 in 2022."
    claimRefs: ["CO006", "CO007", "CO008", "CO009", "CO010", "CO011"]
    tableRefs: ["TO002"]
  - id: "funding-and-valuation"
    title: "Funding History and Valuation"
    body: "Lenskart has raised over $1 billion in primary and secondary capital since inception. Key funding milestones include a $100M round from Epiq Capital in 2020, $250M from SoftBank Vision Fund in 2021, a $400M Series J from SoftBank and Temasek in January 2022 at a $4.5B valuation, and a $500M round from Abu Dhabi Investment Authority (ADIA) in 2023 at $4.5B. In June 2024, the company raised $200M in a secondary transaction from Temasek and Fidelity at a $5B valuation. In July 2024, co-founders subscribed to 695,875 CCPS at ₹2,300 per share, raising approximately ₹165 crore (~$20M) internally — this is the qualifying post-June-2024 financing event. Fidelity marked up its Lenskart stake to $5.6B in November 2024 and to $6.1B in April 2025. The company filed its DRHP with SEBI in July 2025 for a ₹2,150 crore fresh issue plus an OFS of 13.2 crore shares, targeting an IPO valuation of $8-10 billion. Promoter group (primarily Peyush Bansal) held approximately 20% pre-IPO; SoftBank Vision Fund remains the largest institutional shareholder despite exiting the board."
    claimRefs: ["CO012", "CO013", "CO014", "CO015", "CO016", "CO017", "CO018", "CO019"]
    tableRefs: ["TO003"]
    figureRefs: ["FO001"]
  - id: "scale-and-operations"
    title: "Scale and Operations"
    body: "As of FY26, Lenskart operates 2,723 stores globally, having added 603 net new stores in FY26 (542 in India). The company's revenue reached ₹8,814 crore in FY26 (approximately $1.05B at prevailing exchange rates), growing 32% year-over-year from ₹6,652.5 crore in FY25. Lenskart achieved its first full-year profit in FY25 at ₹297 crore, which grew to ₹501 crore in FY26. The company's automated manufacturing facility in Bhiwadi, Rajasthan employs 3,000+ workers and uses Industry 4.0 technologies including robotics, computer vision, and AI-driven quality control. A second larger facility is under construction in Telangana (Hyderabad), described as the world's largest eyewear manufacturing facility with a committed investment of ₹1,500 crore. Product margins reached 68.5% in FY25 due to increasing domestic manufacturing scale. The company's Q4 FY26 standalone revenue was ₹2,516 crore, up 46% year-over-year."
    claimRefs: ["CO020", "CO021", "CO022", "CO023", "CO024", "CO025", "CO026"]
    tableRefs: ["TO004"]
    figureRefs: ["FO002"]
  - id: "milestones"
    title: "Key Milestones"
    body: "Lenskart's trajectory spans from a pure e-commerce startup in 2010 to India's largest omnichannel eyewear platform preparing for a $10B IPO. The company's pivot to physical retail in 2014, SoftBank's entry in 2021, the Owndays acquisition in 2022, achievement of profitability in FY25, and DRHP filing in July 2025 represent the most significant inflection points. The company's conversion to public limited status in May 2025, followed by the DRHP filing and pre-IPO share transactions by Peyush Bansal, signals imminent listing expected in late 2025 or early 2026. In FY26, the company crossed ₹8,800 crore in revenue with 2,723 stores globally, demonstrating the operational scale that underpins the IPO thesis. The Telangana facility groundbreaking in February 2025 marks the next phase of manufacturing capacity expansion."
    claimRefs: ["CO027", "CO028", "CO029", "CO030", "CO031", "CO022"]
