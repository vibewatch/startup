- id: TV007
  title: Final Diligence Asks
  columns:
  - Topic
  - Missing Evidence
  - Why It Matters
  - Owner / Diligence Path
  rows:
  - - Final price band and anchor book
    - Exact IPO price band, anchor allocations, and aftermarket stabilisation approach.
    - The recommendation is highly price-sensitive and cannot be final without the actual public entry point.
    - Lead managers / final RHP / anchor book disclosures.
  - - Normalized FY26/FY27 earnings
    - Reconciliation from reported profit to steady-state operating profit and free cash flow.
    - Public investors will ultimately pay for earnings conversion, not only revenue growth.
    - CFO diligence; quarterly public filings after listing.
  - - Insider secondary math
    - Exact share count, dilution base, and rationale behind July 2025 insider transactions.
    - Needed to reconcile ₹8,700 crore versus ~₹10,891 crore implied media interpretations.
    - Cap-table schedule and transfer documentation.
  - - Lock-up and OFS overhang
    - Expected post-listing supply from SoftBank, Temasek, Kedaara, Alpha Wave, and founders.
    - Secondary-heavy cap tables can suppress rerating even when business performance is sound.
    - RHP lock-up section and shareholder agreements.
  - - Public-comp monitoring
    - Quarterly refresh on Warby, EssilorLuxottica, and Titan multiple moves.
    - If peers de-rate, Lenskart’s acceptable public multiple also compresses.
    - Ongoing trading comp dashboard.
  - - AI / smart-glasses monetisation
    - Evidence that optionality translates into revenue or margin, not just narrative.
    - Optionality is part of the premium case but is not yet monetised in a public-market way.
    - Track FY27 launches, attach rates, and disclosed margin contribution.
  notes: These asks are the shortest path to moving from research-more to a firmer underwriting call.
