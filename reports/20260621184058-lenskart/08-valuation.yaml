- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Side
  - Argument
  - What Would Change the View
  rows:
  - - Thesis
    - FY26 revenue crossed ~₹90B with strong cash-funded store expansion, proving real retail scale.
    - If post-listing revenue growth falls materially below the mid-20s, the scale thesis weakens.
  - - Thesis
    - 69% gross margin, vertical integration, and automation create a credible premium-quality retail story.
    - If normalized earnings fail to rise with scale, the gross-margin story is not enough.
  - - Thesis
    - International exposure and a large installed store base support a broader platform narrative than India-only eyewear chains.
    - If overseas growth slows or integration economics disappoint, the platform premium narrows.
  - - Anti-thesis
    - The IPO ask implies 7.6-9.5x FY26 sales, above Warby Parker, EssilorLuxottica, and Titan parent sales multiples.
    - A lower entry point or exceptional post-listing compounding would ease the multiple gap.
  - - Anti-thesis
    - Adverse sources argue FY25 profit quality was flattered by one-time gains and heavy selling-shareholder participation.
    - Sustained clean profits and lockup discipline would reduce the concern.
  - - Anti-thesis
    - The July 2025 insider secondary pricing is not a clean valuation anchor because public sources interpret it differently.
    - A reconciled cap-table and transaction memo would clarify how insiders actually priced the company.
  notes: Thesis rows isolate business quality; anti-thesis rows isolate entry-price and deal-structure risks.
