company:
  name: Lenskart
chapter:
  number: 8
  title: Valuation
  summary: Lenskart’s $6.1B Fidelity mark is broadly defensible on FY26 execution, but the $8-10B IPO ambition implies roughly 7.6-9.5x FY26 revenue—well above observable public eyewear comps such as Warby Parker (~3.6x), EssilorLuxottica (~3.0x EV/revenue), and Titan (~4.5x parent sales). Multiple adverse sources question profit quality, cash-out optics, and peer valuation stretch, so the chapter lands on research-more, medium confidence, high risk, and a stretched valuation stance.
sections:
- id: thesis-and-decision
  title: Investment Thesis, Anti-Thesis, and Decision
  body: |-
    Lenskart has become one of the few Indian consumer-tech businesses that now looks like a scaled operating company rather than a pure venture narrative. FY26 shareholder communication points to about ₹90,023 million of revenue, ₹17,895 million of EBITDA, ₹5,300 million of adjusted PAT, 603 net new stores, and operating cash flow that funded expansion. That operating trajectory is why the latest known private-market mark—Fidelity’s $6.1 billion April 2025 valuation—does not look absurd on its face. On FY26 revenue of roughly $1.05 billion, that private mark is about 5.8x sales: still premium to mature public peers, but potentially explainable by growth, vertical integration, strong gross margins, and international expansion.

    The anti-thesis starts where the IPO talk begins. Major news reports place the proposed listing around $8-10 billion, or roughly 7.6-9.5x FY26 sales. That is a materially richer entry multiple than what public investors currently pay for Warby Parker, EssilorLuxottica, or Titan’s consolidated business. Several adverse sources also argue that the offer leans heavily on one-time profit adjustments and secondary selling. In other words, this is not a debate over whether Lenskart is a real business; it is a debate over how much future execution is already pre-sold into the IPO range.

    The decision therefore needs to be price-sensitive rather than binary. The business quality is good enough to justify attention, but the proposed valuation range appears to pull forward too much of the upside. At the last private mark, Lenskart already traded at a clear premium to public peers; at the IPO target range, that premium becomes difficult to justify without sustained 25%+ growth, continued margin expansion, and a clean transition from venture-style storytelling to public-market earnings credibility. That supports a research-more recommendation, medium confidence, high risk, and a stretched valuation stance.
