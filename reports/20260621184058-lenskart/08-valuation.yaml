- id: exit-readiness-and-diligence-asks
  title: Exit Readiness and Final Diligence Asks
  body: |-
    Lenskart is genuinely exit-ready in the operational sense. It has already converted to a public structure, refreshed the board, filed a public DRHP, turned profitable in FY25, and disclosed a sensible use-of-proceeds plan. That is more maturity than many Indian consumer-tech issuers had when they first approached public markets. The question is not whether Lenskart can list; it is whether new investors are being offered enough upside versus the quality already priced in.

    The most important diligence work now sits around normalization and supply. Investors should reconcile FY25 profit quality after stripping out one-time gains, confirm how FY26 and early FY27 earnings translate into sustainable free cash flow, and understand how much stock overhang could emerge from a secondary-heavy cap table. The conflicting press interpretations of the July 2025 insider transactions also need to be resolved with exact fully diluted share-count math.

    The most constructive path for a new investor is to keep the company on the buy list but demand either a better entry price or more public-market evidence. If the deal prices near the lower end and the first few quarters show that 25%+ growth can coexist with durable margin expansion, the call can improve quickly. If the stock is pushed out at the richest end without a corresponding earnings base, the reward skews too far in favour of current sellers. That is why the chapter ends with research-more rather than buy.
