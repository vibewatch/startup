  evidenceGaps:
  - type: missing-source
    severity: material
    topic: titan-eyecare-segment-multiple
    missingEvidence: A directly observable transaction multiple or public market quote for Titan EyeCare as a standalone business.
    whyItMatters: Without a standalone quote, any 8x Titan EyeCare benchmark remains a proxy rather than a hard comparable for Lenskart.
    diligencePath: Look for a disclosed segment carve-out, acquisition multiple, management commentary, or analyst sum-of-the-parts note that explicitly values Titan EyeCare.
    relatedQuestionRefs:
    - QV012
    relatedTableRefs:
    - TV005
  - type: conflicting-data
    severity: material
    topic: insider-secondary-valuation
    missingEvidence: A reconciled cap-table schedule explaining why public sources derived roughly ₹8,700 crore and roughly ₹10,891 crore from pre-IPO insider transactions.
    whyItMatters: This discrepancy affects how much conviction investors should place on insider buying as a price signal relative to the eventual IPO ask.
    diligencePath: Request transaction-level secondary sale documentation, diluted share count, and management clarification in the RHP or analyst calls.
    relatedQuestionRefs:
    - QV026
  - type: private-evidence-only
    severity: material
    topic: final-ipo-clearing-price
    missingEvidence: The final public price band, anchor-book composition, and post-listing trading evidence that will reveal the market-clearing multiple.
    whyItMatters: The chapter’s recommendation is highly price-sensitive, so pre-listing analysis cannot fully settle the underwriting question.
    diligencePath: Wait for the final RHP, anchor allocations, and at least one or two public quarters of trading and results.
    relatedQuestionRefs:
    - QV030
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set-coverage
    missingEvidence: A broader disclosed set of comparable private Indian optical chains and directly quoted eyewear segment carve-outs.
    whyItMatters: The comparable table is directionally useful, but a fuller comp universe would improve precision around the premium investors should pay for Lenskart.
    diligencePath: Expand the comparable set when more private India filings, segment disclosures, or M&A multiples become public.
    relatedQuestionRefs:
    - QV012
    relatedTableRefs:
    - TV005
