- id: global-and-adjacent-benchmarks
  title: Global and Adjacent Benchmarks
  body: 'Warby Parker and EssilorLuxottica matter less as direct India-on-India rivals and more as indicators of where the category is going. Warby Parker shows that vertically integrated omnichannel eyewear can scale profitably with stores, eye exams, and clear entry pricing; its 2026 agenda is expanding stores while preparing intelligent eyewear. EssilorLuxottica represents a different kind of threat: overwhelming brand, lens, and retail heft, with nearly 20,000 locations globally and growth increasingly tied to AI glasses and myopia-management products. Those players matter for Lenskart because they compress the strategic room in premium brands, prescription technology, and smart eyewear. They also show that eyewear retail is no longer just about frames on shelves: the winning models pair product, service, data, and recurring eye-care behavior. Lenskart''s global growth narrows the perception gap with these benchmarks, but it remains much closer to Warby''s scale than to EssilorLuxottica''s
    industrial footprint.'
