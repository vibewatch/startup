- id: direct-indian-chains
  title: Direct Indian Chains and the Fading Online-Only Model
  body: 'Titan Eye+ is the clearest domestic incumbent because it combines national footprint, Tata trust, and a premiumizing service model, even though eyewear is a small part of Titan Company overall. Specsmakers comes across as the strongest value-led challenger among private chains: it advertises 275+ stores, 10M+ customers, and sharp entry prices, which makes it relevant in the mid-market where Lenskart also plays. Vision Express India presents a service-forward organized alternative built around free eye tests, broad assortment, and 100+ stores, while GKB Opticals is a narrower premium player leaning on optometrists, styling, and mall-heavy high-end retail. Coolwinks is the counterexample for a weaker model: corporate directories now show the entity as amalgamated, with stale filing activity, suggesting that pure online eyewear without strong omnichannel or capital support has faded as a major threat. That matters because it narrows serious domestic competition to chains with stores,
    service infrastructure, and a more durable offline presence.'
