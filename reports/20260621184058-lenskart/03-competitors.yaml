    - Mass-premium omnichannel eyewear
    - Vertical integration, manufacturing leverage, remote eye test, international scale
    - Still fighting local trust and premium-brand perception gaps
  - - Titan Eye+
    - Incumbent chain
    - FY25 eyewear revenue ₹796 Cr; ~900 stores in 350 cities; aiming for 1,000+
    - Premium-service organized retail
    - Tata trust, diagnostics, premiumization, smart-eyewear partnerships
    - Eyewear is a small subscale division inside Titan overall
  - - Specsmakers
    - Value chain
    - 275+ stores; 10M+ customers; founded 2007
