    - Much smaller footprint than Lenskart or Titan
  - - Warby Parker
    - Global benchmark
    - Q1 2026 revenue $242.4M; 337 stores; 50 openings guided for 2026
    - Affordable premium eyewear in North America
    - Clear opening price, vertically integrated omnichannel retail, eye exams
    - No operating footprint in India
  - - EssilorLuxottica
    - Global incumbent / supplier-retailer
    - Q1 2026 revenue €7.127B; nearly 20k retail locations globally
    - Premium brands, lenses, and med-tech eyewear
    - Ray-Ban/Oakley scale, lens leadership, smart-eyewear momentum
    - Not configured as a low-price India mass retailer
  - - Coolwinks
    - Former online-only rival
    - Corporate status marked amalgamated; stale filing cadence
    - Budget online eyewear
    - Historically competed on digital convenience and low prices
    - No sign of current standalone scale or active market challenge
  - - Unorganized opticians
    - Status quo substitute
    - Large fragmented local market; no single operator scale
    - Neighborhood and price-sensitive buyers
    - Proximity, trust, negotiable pricing, fast local service
    - Weak branding, inconsistent quality, limited tech or premium assortment
