  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: competitor-universe
    missingEvidence: A fuller, auditable roster of regional optical chains, hospital optical counters, and marketplace-led substitutes with comparable store and revenue data.
    whyItMatters: The competitor profile table intentionally covers the main visible rivals but cannot claim exhaustive coverage of the fragmented Indian optical field.
    diligencePath: Request third-party channel-mapping data or management win-loss by city and channel to extend the roster beyond publicly visible chains.
    relatedQuestionRefs:
    - QP001
    relatedTableRefs:
    - TP001
  - type: missing-source
    severity: material
    topic: vision-express-disclosure
    missingEvidence: A current, clean primary disclosure for Vision Express India store count, ownership, and financial scale.
    whyItMatters: Vision Express clearly markets service and scale, but public evidence is thinner and more webpage-driven than for Titan, Warby, or EssilorLuxottica.
    diligencePath: Obtain a current corporate profile, press release, or management interview that confirms India store count and strategy in a citable format.
    relatedQuestionRefs:
    - QP008
    relatedTableRefs:
    - TP001
  - type: enumeration-incomplete
    severity: minor
    topic: pricing-catalog-depth
    missingEvidence: A durable, comparable catalog scrape for current entry prices and bundled inclusions across all major chains.
    whyItMatters: The pricing table captures public entry-price or promo signals, but several chains do not expose durable package terms in easily citable public pages.
    diligencePath: Run a controlled SKU-level mystery shop across major cities and channels to compare frames, lenses, tests, and bundle terms on a like-for-like basis.
    relatedQuestionRefs:
    - QP017
    - QP022
    relatedTableRefs:
    - TP003
  - type: conflicting-data
    severity: material
    topic: organized-share-split
    missingEvidence: A consistent 2026 estimate of how organized eyewear revenue is split between Lenskart and other chains under one market definition.
    whyItMatters: Public sources compare chains using different periods, geographies, and definitions, making exact share claims easy to overstate.
    diligencePath: Normalize chain revenues to India-only eyewear revenue and reconcile against one accepted organized-market denominator before claiming precise share.
    relatedQuestionRefs:
    - QP025
  - type: missing-source
    severity: minor
    topic: switching-cost-quantification
    missingEvidence: Cohort data on repeat purchases, prescription migration, and promo-driven churn across organized chains and local opticians.
    whyItMatters: Public evidence shows service and promos matter, but it does not quantify true switching friction for eyewear buyers.
    diligencePath: Ask management for repeat-rate by cohort and city, and supplement with mystery-shopping on transfer of prescriptions, repairs, and reorders.
    relatedQuestionRefs:
    - QP022
