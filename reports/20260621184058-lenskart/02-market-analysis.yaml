callouts:
  - calloutType: "strength"
    title: "Massive Underpenetration = Growth Runway"
    body: "With 800M+ Indians needing vision correction and only ~25% currently served by organized retail, Lenskart's addressable market has a multi-decade structural growth runway independent of GDP cyclicality."
    claimRefs: ["CM013", "CM014", "CM004"]
  - calloutType: "risk"
    title: "TAM Definition Uncertainty"
    body: "Market size estimates range from $4B to $11B depending on definition. The accessible organized market is significantly smaller than headline TAM figures suggest, which could mislead valuation expectations."
    claimRefs: ["CM018", "CM019", "CM020"]
  - calloutType: "insight"
    title: "Unorganized-to-Organized Shift is the Key Lever"
    body: "The single most important growth driver is not market expansion but market formalization — converting the 60-70% unorganized optician share to organized chains through better service, price transparency, and convenience."
    claimRefs: ["CM003", "CM015"]
