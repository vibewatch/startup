- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Founder and governance concentration
    - Leadership changes, disclosure restatements, or repeated controversy around promoter communications
    - Unexpected Peyush role change, material restatement, or SEBI intervention tied to disclosure quality
    - Pause multiple expansion and require a refreshed governance and succession plan
  - - China sourcing and forex exposure
    - China share of purchases, INR weakness, or trade friction
    - China-linked sourcing stays above current levels without a credible diversification path while landed costs rise
    - Cut margin assumptions and increase working-capital stress in the model
  - - Manufacturing concentration
    - Bhiwadi / Gurugram outages and Telangana milestone slippage
    - Multi-day cluster disruption or meaningful delay to the second factory timeline
    - Push out volume assumptions and assume slower risk diversification
  - - India market dependency
    - International mix, India SSSG, and first-time eye-test creation
    - International share stalls below current trajectory while India growth or service metrics soften
    - Treat Lenskart as more India-cyclical than diversification advocates assume
  - - Competition from Titan and EssilorLuxottica
    - Market-share commentary, pricing pressure, and service/NPS slippage
    - Visible discounting response or sustained deterioration in customer experience metrics
    - Lower unit-economics confidence and re-rate market-share assumptions
  - - IPO / regulatory execution
    - SEBI, ED/FEMA, franchise litigation, or consumer-case cadence
    - Any new enforcement action, adverse disclosure update, or public-market timetable disruption
    - Move the name to watchlist-only until the legal and disclosure stack clears
  notes: Triggers are intentionally observable and tied to model actions rather than generic discussion points.
