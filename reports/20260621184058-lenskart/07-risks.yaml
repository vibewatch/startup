- id: TR006
  title: Scenario analysis
  columns:
  - Scenario
  - Trigger stack
  - Likely business impact
  - Valuation / investment implication
  - Monitoring window
  rows:
  - - Base
    - IPO clears, Telangana progresses, international mix keeps improving but India stays dominant
    - Growth stays healthy, but execution remains the main debate
    - Public multiple can hold only if governance and diversification metrics continue to print
    - Next 2-4 quarters
  - - Downside
    - SEBI or ED/FEMA issue escalates while franchise disputes keep surfacing
    - Listing friction rises, management bandwidth is diverted, and investor trust weakens
    - Valuation compresses toward a governance-discounted retail multiple
    - Immediate to 12 months
  - - Stress
    - China sourcing shock combines with Bhiwadi-Gurugram disruption before Telangana is ready
    - Inventory, margin, and delivery reliability all deteriorate at once
    - Assume slower expansion, lower gross margin, and a need for defensive capital allocation
    - Immediate
  - - Mitigation upside
    - International share grows, second factory ramps on time, and no new legal/regulatory surprises emerge
    - Risk concentration narrows and execution credibility improves materially
    - Risk discount compresses and the company earns room for continued reinvestment
    - 6-18 months
  notes: Scenarios are qualitative and intentionally focus on concentration, regulatory, and execution interactions rather than forecasting a precise earnings path.
