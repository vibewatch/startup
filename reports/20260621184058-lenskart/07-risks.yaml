- id: india-concentration-and-incumbent-competition
  title: India remains the profit engine even as competition and diversification demands increase
  body: 'Lenskart is no longer a single-market startup, but the evidence still says India is the earnings and store-density engine that matters most to the story. DRHP-based reporting shows India at about 60% of revenue in FY25 and still the larger geography in Q1 and Q3 FY26, while same-store growth and first-time eye-test creation are strongest in India. That concentration can be good when demand is healthy, yet it also means weaker domestic retail conditions, service friction, or a sharper pricing response from incumbents would hit the business before overseas scale can fully cushion the effect. The competitive backdrop is not hypothetical: 6Wresearch still lists Titan Eyeplus and EssilorLuxottica India among the major organized players, and both Titan and EssilorLuxottica operate with the disclosure, capital, and brand advantages of established listed incumbents. Lenskart therefore has to widen market share and international mix without sacrificing service or unit economics, because
    mere store-count growth does not neutralize country or competitor concentration by itself.'
  claimRefs:
