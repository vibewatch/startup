  title: Risks
summary: Lenskart now screens as an execution-risk story more than a demand-creation story. The public record shows founder concentration around Peyush Bansal, India-heavy revenue and store exposure, China-linked sourcing and a still-concentrated Indian manufacturing footprint, all landing just as the company tries to complete a highly scrutinized IPO. New capacity, improving international mix, strong same-store growth, and centralized operations are real mitigants, but they do not remove the residual risk from SEBI and ED overhangs, franchise-control issues, consumer-service disputes, or escalating competition from Titan Eyeplus and EssilorLuxottica. The underwriting question is therefore whether diversification and governance mature fast enough to narrow the risk discount before any one of these surfaces turns into a listed-company credibility event.
sections:
- id: founder-governance-and-ipo-risk
  title: Founder concentration, governance, and IPO execution now sit in the same risk stack
  body: 'Lenskart still relies heavily on Peyush Bansal as founder, CEO, public-market narrator, and the internal sponsor for AI, expansion, and hiring. That concentration is manageable while growth is private and flexible, but it matters more once the company is asking public investors to underwrite a large consumer-tech IPO at a demanding valuation. The issue structure reinforces that tension: the fresh issue is comparatively modest versus the OFS, founders and early investors are taking partial liquidity, and the public use-of-proceeds plan is operationally ambitious rather than balance-sheet defensive. Meanwhile, the record already contains live governance and regulatory questions, including a franchisee complaint to SEBI over disclosure quality and an unresolved ED/FEMA matter linked to import-export filings. The practical implication is that Lenskart cannot separate key-person dependency from governance quality or IPO execution; all three now influence the same valuation and credibility
    outcome.'
