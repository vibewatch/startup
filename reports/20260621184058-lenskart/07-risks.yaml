  evidenceGaps:
  - type: missing-source
    severity: material
    topic: ed-fema-resolution
    missingEvidence: A direct regulator, court, or company filing showing the current status and likely resolution path of the ED and FEMA-related inquiry.
    whyItMatters: The inquiry is already public and can affect IPO timing, overseas investment approvals, and the governance discount applied by investors.
    diligencePath: Request the latest show-cause response, bank correspondence, and any legal memo on outstanding IDPMS or EPDMS exposure from management.
    relatedQuestionRefs:
    - QR005
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-register-coverage
    missingEvidence: A complete list of product classifications, open notices, complaints, and litigation matters that go beyond the small set of public cases visible online.
    whyItMatters: The regulatory/legal register is intentionally partial and could understate exposure if private notices, tax matters, or product-specific obligations are more material than public sources suggest.
    diligencePath: Request a litigation tracker, product-compliance register, and counsel-certified schedule of all material notices before underwriting the IPO.
    relatedQuestionRefs:
    - QR008
    - QR030
    relatedTableRefs:
    - TR001
  - type: enumeration-incomplete
    severity: material
    topic: supplier-diversification
    missingEvidence: A public supplier mix by country, product class, and alternate-vendor depth beyond the disclosed China share and Baofeng JV references.
    whyItMatters: Without a diversification map, investors cannot tell whether China concentration is already shrinking or whether the disclosed percentage is structurally sticky.
    diligencePath: Ask management for the top supplier list, country split, dual-source coverage, and the expected sourcing mix after Telangana ramps.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: ai-glasses-privacy-controls
    missingEvidence: A device-level privacy design, retention policy, and incident-response framework for AI glasses and AI-enabled eye-test data flows.
    whyItMatters: The public record raises the privacy question but does not yet show whether Lenskart has built controls strong enough for a scaled wearable and AI rollout.
    diligencePath: Request a privacy impact assessment, user-consent flow, retention schedule, and security-owner memo for all camera, audio, and eye-test data.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR001
    - TR002
