evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: exact headcount
    missingEvidence: Official employee count from DRHP or annual report; media estimates range from 7,000-10,000
    whyItMatters: Headcount is a key cover metric and impacts operating leverage analysis
    diligencePath: Request exact figure from DRHP filing or annual report once published
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: minor
    topic: lead bankers
    missingEvidence: Names of investment banks managing the IPO process
    whyItMatters: Banker quality signals market confidence and execution capability
    diligencePath: Check DRHP cover page or SEBI filing database
    relatedQuestionRefs:
      - QO020
  - type: missing-source
    severity: material
    topic: leadership team completeness (TO002)
    missingEvidence: Full C-suite roster and independent director backgrounds not yet verified from DRHP
    whyItMatters: Leadership table coverage is partial; key hires beyond founders may drive execution
    diligencePath: Cross-reference DRHP management discussion section for complete officer list
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: SoftBank ownership percentage
    missingEvidence: Exact percentage ownership of SoftBank Vision Fund pre-IPO from shareholding table
    whyItMatters: Largest institutional holder; OFS quantum affects post-IPO free float
    diligencePath: Cross-reference DRHP shareholding table when available
    relatedQuestionRefs:
      - QO004
  - type: enumeration-incomplete
    severity: minor
    topic: milestone table completeness (TO004)
    missingEvidence: Earlier seed/angel rounds (2010-2014), specific international market entry dates, and minor product launches
    whyItMatters: Milestone table covers major events but may miss early-stage history relevant to founder story
    diligencePath: Review Crunchbase or company timeline for pre-2020 funding events
    relatedTableRefs:
      - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: investor map completeness (TO003)
    missingEvidence: Exact ownership percentages and full list of pre-IPO shareholders from DRHP
    whyItMatters: Partial shareholder visibility limits understanding of control and float dynamics
    diligencePath: Cross-reference DRHP shareholding pattern table once available publicly
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: India eyewear TAM
    missingEvidence: Reconciled market size from a single authoritative source with transparent methodology
    whyItMatters: TAM feeds directly into revenue growth projections and valuation; $4B vs $11B creates 3x uncertainty
    diligencePath: Commission a custom market study or obtain Euromonitor's India eyewear report with methodology
    relatedQuestionRefs:
      - QM010
  - type: missing-source
    severity: material
    topic: organized vs unorganized rate of conversion
    missingEvidence: Annual tracking data on organized retail share growth rate in Indian eyewear
    whyItMatters: The key growth thesis depends on this conversion; without trend data, projections are speculative
    diligencePath: Request Euromonitor or Technopak data on organized retail penetration by year
    relatedQuestionRefs:
      - QM011
  - type: missing-source
    severity: minor
    topic: corporate eye-care segment sizing
    missingEvidence: Data on B2B corporate eye-care program market size and growth
    whyItMatters: Could represent a significant untapped revenue stream for Lenskart
    diligencePath: Survey large corporates on wellness program eyewear budgets
    relatedQuestionRefs:
      - QM017
  - type: missing-source
    severity: minor
    topic: unit economics of organized vs unorganized
    missingEvidence: Comparative data on margins, ASPs, and customer lifetime value
    whyItMatters: Helps assess whether organized players can sustainably undercut unorganized on price
    diligencePath: Interview local opticians or obtain industry body data
    relatedQuestionRefs:
      - QM015
  - type: enumeration-incomplete
    severity: minor
    topic: buyer segmentation completeness (TM003)
    missingEvidence: Detailed data on segment sizes, growth rates, and wallet share by buyer type
    whyItMatters: Segment-level sizing would sharpen SAM/SOM calculations
    diligencePath: Analyze Lenskart's customer cohort data from DRHP if disclosed
    relatedTableRefs:
