      - [DA Direkt, Carrier distribution partner, "Joint retail motor products with Ominimo", "Planned/announced rollout", "Poland launch announced for Q2 2025", "Current live-market performance not disclosed"]
      - [Signal Iduna, Carrier partner, "Reported underwriting relationship for initial Hungary entry", "Reported operating relationship", "Supports initial-market policy distribution", "Terms and current status not disclosed"]
      - [Hungarian retail drivers, Consumer segment, "Digital motor policy purchase", "Production sales reported", "More than 300,000 policies reported in first year", "No named customer references, renewals, or claims outcomes"]
      - [Netherlands and Poland retail drivers, Consumer segment, "Expansion-market motor policy distribution", "Production/expansion sales reported", "Most volume in a June 2026 24-hour record reportedly came from these markets", "No independently verified policy or retention data"]
    notes: "Enumeration is partial: the pool contains named carrier relationships and aggregate consumer evidence, but not a complete list of end customers or independently audited deployments."
    enumerationScope:
      coverage: partial
      basis: "Named counterparties and aggregate consumer deployments explicitly described by assigned sources through 2026-10-25"
    claimRefs: [CU003, CU005, CU007, CU011, CU013]
figures:
  - id: FU001
    title: Customer journey from discovery to expansion
    type: journey-map
    summary: Ominimo's disclosed journey runs from partner-led quote discovery through digital purchase and carrier-backed policy servicing, with expansion depending on renewals and market-level proof that are not publicly disclosed.
    data:
      items:
        - stage: "1. Discovery"
          label: "Partner-led shopping"
          title: "Partner-led shopping"
          touchpoints: ["Aggregators, price-comparison sites, brokers, and direct web traffic"]
          detail: "Public reporting says approximately one in five policies is bought directly through Ominimo's website."
        - stage: "2. Quote and purchase"
          label: "Digital motor policy"
          title: "Digital motor policy"
          touchpoints: ["Mobile app", "Web portal", "Risk-priced quote"]
          detail: "Public profiles describe mandatory liability and comprehensive motor policies with machine-learning pricing."
        - stage: "3. Coverage and service"
          label: "Carrier-backed policy"
          title: "Carrier-backed policy"
          touchpoints: ["Ominimo customer experience", "Zurich / DA Direkt underwriting capacity"]
          detail: "Ominimo operates as an MGA while Zurich acts as risk carrier in the disclosed partnership."
        - stage: "4. Expansion"
          label: "Market and channel growth"
          title: "Market and channel growth"
          touchpoints: ["Hungary", "Poland", "Netherlands", "Sweden"]
          detail: "Expansion evidence shows policy-sales velocity, but not renewal, claims satisfaction, or cohort economics."
        - stage: "5. Retention"
          label: "Renewal and claims experience"
          title: "Durability check"
          touchpoints: ["Renewal", "Claims handling", "Customer satisfaction"]
          detail: "No quantified public retention or claims-service outcome is available in the assigned evidence."
        - stage: "6. Scale decision"
          label: "Partner and market expansion"
          title: "Evidence-led expansion"
          touchpoints: ["Carrier capacity", "Distribution partners", "Market-level cohorts"]
          detail: "Expansion should be underwritten by market-level retention, concentration, and unit-economics evidence."
    claimRefs: [CU001, CU003, CU004, CU009, CU010]
callouts:
  - calloutType: assumption
    title: Policy volume is not retention
    body: The available evidence supports acquisition and written-volume claims, but not active customer count, renewal durability, or customer lifetime value.
    claimRefs: [CU005, CU007, CU008, CU010]
