chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Ominimo was founded in 2024 by Dusan Komar, Dennis Weinbender, and Laslo Horvath. It sells digital
              motor-insurance products through a managing general agent model: Ominimo controls pricing, distribution,
              claims, and customer experience while partner carriers, including Signal Iduna and DA Direkt in the
              reviewed coverage, provide underwriting capacity. That structure supports expansion without requiring
              Ominimo to carry all policy risk on its own balance sheet, but it also makes carrier contracts and binding
              authority central diligence items. Headquarters are not consistently described. InsurTech List calls the
              company Budapest-headquartered, while The Recursive calls it Novi Sad-headquartered and describes
              engineering activity in Belgrade and Novi Sad. The evidence therefore supports a multi-city operating
              footprint, not a single verified headquarters answer.
            claimRefs:
