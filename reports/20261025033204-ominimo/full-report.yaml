  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Ominimo's relevant market is digitally originated motor insurance, especially mandatory third-party
              liability and comprehensive cover, delivered through an MGA structure rather than a balance-sheet carrier.
              The boundary therefore includes premiums written on partner paper, MGA commissions and fees, underwriting
              and distribution services, and the carrier capacity that makes those policies possible. It excludes the
              full economic value of partner-carrier risk capital and unrelated insurance lines unless Ominimo launches
              them. The practical substitutes are incumbent direct insurers, price-comparison and broker channels, and
              the status quo of buying a conventional policy. This distinction matters because gross written premium is
              a flow of insured risk, not Ominimo revenue or ARR.
            claimRefs:
              - CM001
              - CM005
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM011
              - CM016
      - number: '2.2'
        title: Sizing lenses and geographic comparability
        blocks:
          - type: paragraph
            body: >-
              The strongest public sizing evidence is for the European MGA ecosystem, not an Ominimo-specific SAM or
              SOM. Howden Re reports more than 650 European MGAs, approximately EUR18 billion of 2024 gross written
              premium, and a roughly 23% five-year CAGR; MarshBerry separately cites a Howden estimate of EUR20.8
              billion of European MGA premiums in 2025, up 11% that year. These are market-wide MGA measures rather than
              motor-only addressable spend. Regional estimates also use differing labels and definitions, so they are
              directional lenses rather than additive market layers. Ominimo's reported expansion from Hungary into
              Poland, the Netherlands, and Sweden demonstrates geographic reach, but not transferable conversion,
              loss-ratio, or unit-economics performance.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM009
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM010
              - CM014
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM015
      - number: '2.3'
        title: Buyer, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer is usually the consumer or fleet policyholder, while the payer is the policyholder and
              the risk-bearing balance sheet belongs to a licensed carrier. Ominimo's MGA sits between those parties: it
              designs and prices the product, acquires the customer, and operates the digital journey while partners
              provide capacity. The adoption path is consequently a two-sided sale: consumers must accept a quote and
              service experience, while carriers and distribution partners must trust underwriting governance, claims
              visibility, and portfolio performance. Zurich's investment and DA Direkt distribution relationship
              validate access to capacity and distribution, but public materials do not disclose renewal, churn,
              country-level CAC, or retained revenue.
            claimRefs:
              - CM001
              - CM008
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM008
              - CM011
              - CM012
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption is supported by universal compulsory motor demand, digital quote-and-bind workflows, carrier
              demand for specialist market access, and the possibility of more granular risk selection. Howden describes
              AI triage, proprietary pricing engines, and API-integrated claims as emerging MGA capabilities; MarshBerry
              identifies local execution and capacity durability as prerequisites for cross-border value. The principal
              constraints are fragmented regulation, scarce capacity, switching and service expectations, and the risk
              that Western incumbents already possess dense data and established distribution. The Series B plan to
              obtain an own licence could expand control and product scope, but it also changes the capital and
              regulatory burden. The valuation case should therefore use MGA economics and underwriting evidence, not
              simply premium volume.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM012
              - CM013
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The critical transfer test
            body: >-
              Ominimo's early Hungarian traction demonstrates a wedge, but the market question is whether its pricing
              and operating advantage survives markets with stronger incumbent data, higher acquisition costs, and
              different regulatory and carrier conditions.
            calloutType: insight
            claimRefs:
              - CM009
              - CM013
          - type: callout
            title: Unresolved market conversion
            body: >-
              No public source isolates Ominimo's serviceable obtainable market, retained revenue, country-level
              renewal, or the economics of moving from partner paper to an own licence.
            calloutType: risk
            claimRefs:
              - CM010
              - CM012
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Ominimo's relevant competitive set is broader than other AI-labelled startups. It includes traditional
              motor carriers that own licenses, capital, claims infrastructure, and distribution; Lemonade, which
              TechCrunch records Ominimo's CEO naming as a key competitor; publicly traded financial references such as
              Root; brokers and comparison channels; and the status quo of a customer choosing the cheapest acceptable
              policy through an incumbent. Ominimo's own reported model is narrower: it operates as a managing general
              agent, while carrier partners retain underwriting risk. That makes distribution and carrier access part of
              the product, not just a financing input. The clearest buyer trade-off is therefore speed and granular
              pricing versus the trust, claims history, and balance-sheet depth of an incumbent. Public customer
              evidence is incomplete: a Reddit discussion asks for actual claims and service experiences rather than
              supplying them, so the comparison should not assume superior customer outcomes.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
              - CP011
              - CP012
      - number: '3.2'
        title: Differentiation, capability, and distribution
        blocks:
          - type: paragraph
            body: >-
              The reported differentiation is concentrated in underwriting and operating design. Sources describe a
              proprietary platform and pricing engine using hundreds of variables, while TechCrunch gives the more
              specific contrast of five or six traditional parameters and roughly 100 vehicle variables available from a
              license plate. Ominimo also claims early scale in Hungary, and Zurich's DA Direkt relationship supplies a
              carrier and distribution route for European rollout. These are stronger strategic assets than a generic
              front-end claim, but they are not yet a public moat. A pricing model can be copied or matched by carriers
              with data and capital; a carrier partnership can also impose product, geographic, and termination
              dependencies. The matrix below marks unsupported cells as unknown and separates observed partnership facts
              from inferred competitive implications.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP013
      - number: '3.3'
        title: Pricing, switching costs, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Public pricing comparisons are not sufficiently granular to establish a like-for-like premium advantage.
              One directory claims rates can be up to 30% below traditional averages, but that is a secondary
              company-description claim rather than a disclosed realized-price dataset; no source in the assigned pool
              supplies comparable quotes, loss-cost controls, or renewal cohorts. Switching costs are consequently
              asymmetric: an individual motor customer may switch at renewal, while Ominimo's own switching burden sits
              in regulatory permissions, carrier capacity, claims operations, data access, and country-by-country
              distribution. The adverse signal is not a proven failure but an evidence gap: the customer discussion
              explicitly seeks claims and service experiences, and TechCrunch describes WeFox's financing distress as a
              warning about scaling insurance businesses. Ominimo's moat is more durable if it converts underwriting
              signal into verified loss-ratio and retention performance that partners cannot easily reproduce.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP005
              - CP009
              - CP015
      - number: '3.4'
        title: Competitive positioning
        blocks:
          - type: paragraph
            body: >-
              The positioning map is an ordinal analytical aid, not a market-share or quality ranking. It places
              alternatives by the publicly evidenced degree of data-led pricing differentiation and the apparent depth
              of carrier balance-sheet and distribution power. Ominimo scores high on the former and medium on the
              latter because sources describe a broad-variable pricing engine and Zurich/DA Direkt support, while Zurich
              and traditional carriers score high on distribution and risk-bearing depth. Lemonade is a named strategic
              comparator, while Root is only a public-company financial reference in the assigned evidence; neither
              establishes directly comparable European motor-insurance economics. This distinction matters: the map
              supports a diligence hypothesis about where Ominimo may win, not a claim that it has already outperformed
              every alternative.
            claimRefs:
              - CP003
              - CP005
              - CP009
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Ominimo sells digital motor insurance through mandatory liability and comprehensive products, with pricing
              and purchase completed digitally. The company operates as a managing general agent: public coverage
              describes Ominimo as pricing risk, managing customer relationships, and handling claims while carrier
              partners carry underwriting risk. That distinction is central to underwriting the business: gross written
              premium (GWP) is policy volume, not Ominimo revenue, and partner-carrier economics are not disclosed.
              Beinsure reports annualised GWP rising from €26.3 million in 2024 to about €307 million and nearly one
              million customers across Hungary, Poland, the Netherlands, and Sweden; Pulse2 reports more than $350
              million of annualised GWP. The differing currencies and measures should not be reconciled into a single
              precise figure. The available evidence supports strong distribution traction, not a verified ARR or
              retained-revenue number.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI009
              - CI010
      - number: '4.2'
        title: Pricing, distribution, and unit economics
        blocks:
          - type: paragraph
            body: >-
              Ominimo's stated economic mechanism is data-assisted risk selection plus automated policy issuance,
              distributed through direct digital channels and carrier, broker, aggregator, or comparison-platform
              relationships. Startup.eu describes hundreds of data points and a claim of premiums up to 30% below
              traditional market averages; this is a company/profile claim rather than evidence of realized premium,
              retention, or margin. The Recursive reports that approximately one in five policies is purchased through
              Ominimo's own website and that the company integrates with aggregators, price comparison engines, and
              broker networks. That channel mix may reduce direct marketing spend, but commissions, CAC, conversion,
              renewal, churn, loss ratio by cohort, and carrier revenue share remain private. Ominimo's reported
              combined ratio of 92% to 100% in The Recursive is an underwriting metric, not gross margin or company net
              income, and is presented as a reported range rather than independently audited evidence.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI005
              - CI007
              - CI008
      - number: '4.3'
        title: Capital needs and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The Series B gives Ominimo disclosed growth capital, but the public sources do not state cash on hand,
              monthly burn, runway, debt, covenants, or the amount available after transaction costs and operating
              investment. Vestbee says approximately €30 million of external funding has been raised to date, while
              separate coverage reports the Series B as $22.5 million; these are financing figures, not cash available.
              The stated uses include European expansion, a planned US launch in 2027, new products, technology
              investment, and obtaining an own insurance licence. Moving from MGA economics toward carrying risk could
              retain more underwriting economics but increases regulatory capital requirements; Beinsure cites an
              approximate 20 cents of capital per euro of premium underwritten. EIOPA's overview is based on annually
              reported Solvency II information, but it provides sector context rather than Ominimo-specific solvency
              evidence. The financial verdict is therefore positive on demand and reported underwriting traction,
              conditional on proving retained revenue, loss-ratio durability, carrier economics, and licence-capital
              adequacy.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate observed public metrics from company-reported or profile-reported figures and
              identify the diligence requests required before underwriting a valuation. The revenue table keeps policy
              products, GWP, customers, and licensing plans distinct because each has a different economic meaning. The
              pricing table distinguishes list positioning and distribution claims from realized revenue and margin. The
              unit economics table deliberately leaves cash, burn, retention, CAC, and Ominimo revenue null where the
              assigned public evidence does not disclose them. This is not a claim that the metrics are zero; it is a
              material underwriting gap. The requested follow-up evidence is therefore operationally specific: carrier
              contracts, claims development, channel cohorts, management accounts, and the capital plan for any
              own-license transition.
            claimRefs:
              - CI002
              - CI004
              - CI007
              - CI009
              - CI011
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reported underwriting traction
            body: >-
              Ominimo's public evidence combines rapid GWP growth with a reported 92%-100% combined-ratio range, a
              stronger signal than volume growth alone but not an audited company-level profit measure.
            calloutType: strength
            claimRefs:
              - CI002
              - CI007
          - type: callout
            title: Capital and margin disclosure blocker
            body: >-
              The largest underwriting gap is the bridge from GWP and carrier-backed policies to Ominimo's retained
              revenue, cash generation, and capital need if it obtains its own licence.
            calloutType: risk
            claimRefs:
              - CI009
              - CI011
              - CI012
          - type: callout
            title: Require an insurance economics data room
            body: >-
              Underwriting should remain conditional on policy and renewal cohorts, carrier contracts, claims
              development, cash-flow statements, and licence-capital requirements.
            calloutType: recommendation
            claimRefs:
              - CI006
              - CI007
              - CI011
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Ominimo is described as a managing general agent offering digital mandatory liability and comprehensive
              motor policies through a mobile app and web portal. Its customer proposition is an online quote-and-bind
              journey with risk-adjusted prices, while the underwriting capacity remains supplied by Zurich's DA Direkt.
              The public record supports a consumer-facing digital workflow, but does not document the full
              policy-administration stack, identity controls, payment flow, or country-specific service-level
              commitments. Fixico's announcement adds a downstream claims workflow: repair management is integrated
              directly into Ominimo's claims systems and processes, with status, performance, and customer-experience
              visibility. That is useful operational evidence, but it is a partner statement and does not independently
              establish end-to-end claims reliability.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE009
          - type: table
