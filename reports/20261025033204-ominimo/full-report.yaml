          detail: Revenue share, CAC, claims, and margin remain private
      edges:
        - from: demand
          to: pricing
        - from: pricing
          to: policy
        - from: policy
          to: carrier
        - from: carrier
          to: premium
        - from: premium
          to: gap
    approximationNotes: >-
