  - id: FP001
    title: Competitive positioning by pricing differentiation and institutional power
    type: quadrant
    summary: >-
      Ordinal positioning separates data-led pricing differentiation from carrier balance-sheet and distribution power;
      scores are evidence-backed hypotheses, not market rankings.
    data:
      xAxis: Data-led pricing differentiation (ordinal 1–5)
      yAxis: Carrier balance-sheet and distribution power (ordinal 1–5)
      points:
        - label: Ominimo
          x: 5
          'y': 3
          detail: >-
            Hundreds of variables and proprietary platform are reported; Zurich/DA Direkt add carrier and distribution
            access.
          source: CP005, CP006
        - label: Zurich / DA Direkt
          x: 3
          'y': 5
          detail: Carrier pricing expertise, risk capacity, and European retail reach are evidenced.
          source: CP006, CP007
        - label: Lemonade
          x: 3
          'y': 3
          detail: >-
            Named by Ominimo's CEO as a key competitor; neutral midpoint scores reflect missing motor-specific
            capability evidence.
          source: CP009
        - label: Traditional insurer
          x: 2
          'y': 5
          detail: >-
            TechCrunch contrasts Ominimo's broad-variable model with traditional pricing and identifies incumbent legacy
            systems as a constraint.
