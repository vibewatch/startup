      - CE002
      - CE005
      - CE009
  - id: FU001
    title: Customer journey from discovery to expansion
    type: journey-map
    summary: >-
      Ominimo's disclosed journey runs from partner-led quote discovery through digital purchase and carrier-backed
      policy servicing, with expansion depending on renewals and market-level proof that are not publicly disclosed.
    data:
      items:
        - stage: 1. Discovery
          label: Partner-led shopping
          title: Partner-led shopping
          touchpoints:
            - Aggregators, price-comparison sites, brokers, and direct web traffic
          detail: Public reporting says approximately one in five policies is bought directly through Ominimo's website.
        - stage: 2. Quote and purchase
          label: Digital motor policy
          title: Digital motor policy
          touchpoints:
            - Mobile app
            - Web portal
            - Risk-priced quote
          detail: Public profiles describe mandatory liability and comprehensive motor policies with machine-learning pricing.
        - stage: 3. Coverage and service
          label: Carrier-backed policy
          title: Carrier-backed policy
          touchpoints:
            - Ominimo customer experience
            - Zurich / DA Direkt underwriting capacity
          detail: Ominimo operates as an MGA while Zurich acts as risk carrier in the disclosed partnership.
        - stage: 4. Expansion
          label: Market and channel growth
          title: Market and channel growth
          touchpoints:
            - Hungary
            - Poland
            - Netherlands
            - Sweden
          detail: Expansion evidence shows policy-sales velocity, but not renewal, claims satisfaction, or cohort economics.
        - stage: 5. Retention
          label: Renewal and claims experience
          title: Durability check
          touchpoints:
            - Renewal
            - Claims handling
            - Customer satisfaction
          detail: No quantified public retention or claims-service outcome is available in the assigned evidence.
        - stage: 6. Scale decision
          label: Partner and market expansion
          title: Evidence-led expansion
          touchpoints:
            - Carrier capacity
            - Distribution partners
            - Market-level cohorts
          detail: Expansion should be underwritten by market-level retention, concentration, and unit-economics evidence.
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU009
      - CU010
