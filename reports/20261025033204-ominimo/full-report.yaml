        title: Financing and operating scale
        blocks:
          - type: paragraph
            body: >-
              The financing trajectory is rapid but contains one important disclosure conflict. Coverage reports Zurich
              investing EUR 10 million for a 5% stake at a EUR 200 million post-money valuation in 2025. July 2026
              coverage then consistently places the Series B valuation at $1.6 billion with EBRD leading, but IBS
