  - id: FI001
    title: Reported motor-insurance economic bridge
    type: flow
    summary: >-
      The public model runs from data-assisted acquisition and pricing through carrier-backed underwriting; retained
      economics are not disclosed.
    data:
      nodes:
        - id: demand
          label: Drivers seek cover
          detail: Direct, aggregator, comparison, and broker channels
        - id: pricing
          label: Data-assisted pricing
          detail: Hundreds of variables are described in public coverage
        - id: policy
