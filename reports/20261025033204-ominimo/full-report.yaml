              detail: Real-time risk-adjusted pricing is claimed; validation evidence is not public.
        - label: Carrier capacity
          detail: Carrier-backed MGA operating layer.
          items:
            - label: MGA and carrier capacity
              detail: Zurich/DA Direkt is described as risk carrier and distribution partner.
        - label: Claims fulfillment
          detail: Partner-operated repair workflow.
          items:
            - label: Claims and repairs
