company:
  name: Ominimo
chapter:
  number: 8
  title: Valuation
  summary: "Ominimo's reported Series B valuation has risen sharply alongside rapid gross-written-premium and customer growth, but the private mark is not supported by a disclosed round size, cap table, or audited company-level revenue and margin data. The appropriate stance is research-more: the operating signals are promising, while entry price, dilution, carrier economics, and cross-border loss performance remain unverified."
sections:
  - id: investment-case
    title: Investment thesis and anti-thesis
    body: "The thesis is that Ominimo has assembled a differentiated underwriting and distribution system quickly: independent coverage reports a move from a reported $230 million Series A valuation to $1.6 billion in Series B valuation in roughly 15 months, while the company says it is approaching one million customers and more than $350 million of annualized gross written premium. The partnership with Zurich and DA Direkt adds carrier capacity and distribution rather than leaving the company dependent on direct acquisition alone. The anti-thesis is valuation sensitivity. The $1.6 billion mark is a private financing valuation with no disclosed Series B amount, no public cap table, and no public bridge from gross written premium to Ominimo revenue, contribution profit, cash generation, or equity value. Reported 92%–100% combined-ratio performance appears in a company-focused article and is not independently audited in the assigned evidence. Growth therefore improves the operating case but does not, by itself, establish that the current price is attractive."
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001, TV002]
  - id: price-and-financing
    title: Financing context and entry discipline
    body: "The observable financing path contains two materially different marks. Coverage of the Zurich-led Series A describes a €200 million valuation in April 2025, while later coverage reports a $1.6 billion Series B valuation led by the EBRD investment arm in July 2026; another source states €1.48 billion, which is directionally consistent but not identical. Insurtech Daily reports $32.5 million across two disclosed rounds, including $21.7 million reported as €20.1 million in July 2026, but that tracker is secondary coverage rather than a company filing. Caplight labels Ominimo private, says its $1.6B estimate is based on funding-round data, and notes that secondary-market access may be subject to transfer restrictions; its public table does not disclose round amounts or transaction prices. There is consequently no defensible public basis for a target return, liquidation-preference analysis, or dilution-adjusted entry price. A new investor should require the signed term sheet, fully diluted capitalization, preference stack, option pool, debt, participating rights, and the exact relationship between the financing price and any secondary price."
    claimRefs: [CV007, CV008, CV009, CV010, CV012]
  - id: scenarios-and-diligence
    title: Scenarios, exit readiness, and diligence gates
    body: "The bull case requires the expansion markets to preserve underwriting profitability while Ominimo adds six European Union markets and enters the United States, as reported in the Series B coverage. The base case assumes continued premium and customer growth but applies a material discount until country-level renewal, claims development, carrier sharing, and company revenue are disclosed. The bear case is a down-round or stalled expansion if loss ratios deteriorate, distribution partners change terms, licensing or capital requirements rise, or the reported valuation proves to have been set on a narrow financing transaction. Exit readiness is therefore low for an outside investor: Ominimo is private, no IPO plan is announced in the assigned evidence, and no audited financial statements or liquidity timetable are available. The decision should move toward investment only after verifying policy-level cohorts, ultimate loss triangles, carrier and MGA economics, current capitalization, governance rights, and an independently supportable comparable set."
    claimRefs: [CV013, CV014, CV015, CV016, CV017, CV018]
    tableRefs: [TV003]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision dimension, Current assessment, Evidence basis, What changes the view]
    rows:
      - ["Recommendation", "Research-more", "Strong reported operating momentum, but no public audited revenue, cap table, or Series B amount", "Verified company-level economics and investable terms"]
      - ["Confidence", "Medium", "Multiple independent outlets report the $1.6B financing mark, while core performance metrics remain largely company-reported", "Audited or regulator-grade corroboration"]
      - ["Risk rating", "High", "Private-company opacity, carrier dependency, cross-border execution, and insurance-loss uncertainty", "Stable country cohorts, capital plan, and contractual protections"]
      - ["Valuation stance", "Stretched", "Reported mark increased from about $230M to $1.6B in roughly 15 months; revenue conversion is not disclosed", "Price reset or verified earnings/cash-flow support"]
    notes: "The recommendation is an evidence-sensitive judgment, not a market quote. $1.6B is a reported private financing valuation; no public price, audited revenue bridge, or target-return calculation was available in the assigned sources."
    claimRefs: [CV001, CV007, CV010, CV014]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, Anti-thesis or uncertainty, What would change the view]
    rows:
      - ["Data-driven underwriting can scale", "Reported use of hundreds of variables and proprietary pricing infrastructure", "Model performance and calibration by country are not independently validated", "Audited loss-ratio and cohort evidence by market"]
      - ["Carrier partnership lowers early balance-sheet burden", "Zurich/DA Direkt reported as risk carrier, distribution partner, and minority investor", "Terms, economics, termination rights, and concentration are undisclosed", "Executed agreements and counterparty concentration schedule"]
      - ["Demand and distribution are real", "Reported near-one-million customers and more than $350M annualized business volume", "Gross written premium is not Ominimo revenue and direct versus partner-channel economics are unclear", "Revenue, CAC, retention, and contribution-margin bridge"]
      - ["Financing validates institutional interest", "EBRD investment arm reported as Series B lead and Zurich as prior strategic investor", "Round size, rights, preferences, and price mechanics are not public", "Fully diluted cap table and signed financing documents"]
    notes: "Reported metrics retain their source terminology. Gross written premium/business volume is not treated as revenue or cash available."
    claimRefs: [CV003, CV004, CV005, CV009, CV012]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Key risks and trigger]
    rows:
      - ["Bull", "Expansion markets retain underwriting discipline; six additional EU markets and US entry progress; premium growth converts into company contribution profit", "A higher valuation could be justified only if audited revenue, durable margins, and a clean cap table support the financing mark", "Low-to-medium; operating evidence is encouraging but incomplete", "Combined ratio deterioration, carrier withdrawal, or inability to secure required capital"]
      - ["Base", "Growth continues, but country-level retention, claims development, carrier economics, and cash conversion remain mixed or undisclosed", "Apply a substantial private-company and evidence discount to the reported $1.6B mark; do not underwrite a target return yet", "Medium; this is the prudent underwriting case", "No timely disclosure of audited KPIs, term-sheet rights, or loss triangles"]
      - ["Bear", "Cross-border growth raises losses, licensing/capital needs, or distribution costs; financing terms reset", "Down-round risk and preference overhang can impair common-equity returns even if gross written premium grows", "Medium; insurance scaling and valuation compression are material risks", "Combined ratio above plan, partner termination, regulatory delay, or liquidity event at a lower price"]
      - ["Decision gate", "Proceed only after the listed diligence package is complete and price is reconciled to fully diluted ownership", "Target return and exit multiple remain intentionally unquantified because the necessary denominator and rights are missing", "High importance; unresolved evidence is decision-relevant", "Any material inconsistency between financing documents and public valuation claims"]
    notes: "These are qualitative scenarios, not a discounted-cash-flow forecast. Public evidence does not support precise probability-weighted valuation ranges or a target return."
    claimRefs: [CV013, CV014, CV015, CV016, CV017, CV018]
