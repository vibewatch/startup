callouts:
  - calloutType: recommendation
    title: "Recommendation: research-more"
    body: "Ominimo shows unusually fast reported operating and financing momentum, but the public evidence does not establish that the $1.6B private mark supports attractive common-equity returns. Require the financing documents, audited economics, loss development, carrier contracts, and an exit path before underwriting an entry price."
    claimRefs: [CV001, CV010, CV014, CV017]
  - calloutType: risk
    title: "Primary thesis-break trigger"
    body: "A materially worse ultimate combined ratio, loss of a key carrier or distribution partner, or a financing round that reveals substantial preference or dilution overhang would invalidate the current growth-led thesis even if gross written premium continues to rise."
    claimRefs: [CV004, CV015, CV016]
