callouts:
  - calloutType: insight
    title: The critical transfer test
    body: Ominimo's early Hungarian traction demonstrates a wedge, but the market question is whether its pricing and operating advantage survives markets with stronger incumbent data, higher acquisition costs, and different regulatory and carrier conditions.
    claimRefs: [CM009, CM013]
  - calloutType: risk
    title: Unresolved market conversion
    body: No public source isolates Ominimo's serviceable obtainable market, retained revenue, country-level renewal, or the economics of moving from partner paper to an own licence.
    claimRefs: [CM010, CM012, CM014]
