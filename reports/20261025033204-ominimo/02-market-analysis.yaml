chapter:
  number: 2
  title: Market Analysis
  summary: Ominimo operates in a large but fragmented European motor-insurance and MGA market where digital distribution and data-led underwriting can shift share, but local regulation, carrier capacity, and incumbent data advantages constrain the path to scale. Public evidence supports a market-sizing lens for European MGAs and Ominimo's reported early traction, while SAM, retained revenue, and country-level adoption remain unresolved.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: Ominimo's relevant market is digitally originated motor insurance, especially mandatory third-party liability and comprehensive cover, delivered through an MGA structure rather than a balance-sheet carrier. The boundary therefore includes premiums written on partner paper, MGA commissions and fees, underwriting and distribution services, and the carrier capacity that makes those policies possible. It excludes the full economic value of partner-carrier risk capital and unrelated insurance lines unless Ominimo launches them. The practical substitutes are incumbent direct insurers, price-comparison and broker channels, and the status quo of buying a conventional policy. This distinction matters because gross written premium is a flow of insured risk, not Ominimo revenue or ARR.
    claimRefs: [CM001, CM005, CM016]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and geographic comparability
    body: The strongest public sizing evidence is for the European MGA ecosystem, not an Ominimo-specific SAM or SOM. Howden Re reports more than 650 European MGAs, approximately EUR18 billion of 2024 gross written premium, and a roughly 23% five-year CAGR; MarshBerry separately cites a Howden estimate of EUR20.8 billion of European MGA premiums in 2025, up 11% that year. These are market-wide MGA measures rather than motor-only addressable spend. Regional estimates also use differing labels and definitions, so they are directional lenses rather than additive market layers. Ominimo's reported expansion from Hungary into Poland, the Netherlands, and Sweden demonstrates geographic reach, but not transferable conversion, loss-ratio, or unit-economics performance.
    claimRefs: [CM002, CM003, CM004, CM005, CM009, CM014, CM015]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-adoption
    title: Buyer, payer, and adoption path
    body: >-
      The economic buyer is usually the consumer or fleet policyholder, while the payer is the policyholder and the risk-bearing balance sheet belongs to a licensed carrier. Ominimo's MGA sits between those parties: it designs and prices the product, acquires the customer, and operates the digital journey while partners provide capacity. The adoption path is consequently a two-sided sale: consumers must accept a quote and service experience, while carriers and distribution partners must trust underwriting governance, claims visibility, and portfolio performance. Zurich's investment and DA Direkt distribution relationship validate access to capacity and distribution, but public materials do not disclose renewal, churn, country-level CAC, or retained revenue.
    claimRefs: [CM001, CM008, CM011, CM012]
    tableRefs: [TM003]
  - id: drivers-constraints
    title: Growth drivers, constraints, and valuation relevance
    body: Adoption is supported by universal compulsory motor demand, digital quote-and-bind workflows, carrier demand for specialist market access, and the possibility of more granular risk selection. Howden describes AI triage, proprietary pricing engines, and API-integrated claims as emerging MGA capabilities; MarshBerry identifies local execution and capacity durability as prerequisites for cross-border value. The principal constraints are fragmented regulation, scarce capacity, switching and service expectations, and the risk that Western incumbents already possess dense data and established distribution. The Series B plan to obtain an own licence could expand control and product scope, but it also changes the capital and regulatory burden. The valuation case should therefore use MGA economics and underwriting evidence, not simply premium volume.
    claimRefs: [CM006, CM007, CM008, CM012, CM013]
