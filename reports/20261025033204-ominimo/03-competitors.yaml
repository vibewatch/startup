      - ["Zurich / DA Direkt", "Incumbent carrier and distribution partner", "Zurich described as Europe's second-largest insurer by revenue; DA Direkt is the carrier/distribution route in the partnership", "European retail motor customers", "Balance sheet, licensing, distribution, and pricing expertise", "Legacy scale may be slower to change; Ominimo partnership terms and dependence are not fully disclosed"]
      - [Lemonade, "Digital insurer comparator", "$3.47bn market cap as of October 2026", "Digital insurance customers; assigned evidence is not motor-market comparable", "Digital-first customer journey and publicly traded scale signal", "Assigned evidence does not establish like-for-like European motor pricing or claims performance"]
      - [Root, "Public-company financial reference", "$1.02bn market cap and $674.69m enterprise value in the archived April-May 2024 snapshot", "Not established by the retained source", "Public financial disclosure supplies scale context only", "The retained page does not establish product, geography, pricing, or underwriting comparability with Ominimo"]
      - ["Traditional motor insurer or broker", "Incumbent/status quo substitute", "No single provider or aggregate scale is isolated in the assigned evidence", "Customers buying mandatory or comprehensive cover through existing channels", "Established trust, claims processes, licenses, and multi-homing through comparison channels", "Potentially less granular pricing and slower product iteration; provider-level comparison remains a diligence gap"]
    notes: "Signals mix company/partner descriptions, independent reporting, and market-data snapshots with different dates and geographies. Scale figures are not interchangeable with revenue, premiums, or customer profitability."
    claimRefs: [CP001, CP002, CP003, CP005, CP006, CP011, CP012]
  - id: TP002
    title: Feature and capability matrix
    columns: [Buying criterion, Ominimo, Zurich / DA Direkt, Lemonade, "Root (financial reference)", Status quo or internal build]
    rows:
      - ["Granular data-led pricing", "Hundreds of variables reported; exact production performance not independently disclosed", "Zurich has established pricing expertise; Ominimo partnership combines both", "Unknown from assigned evidence", "Unknown from assigned evidence", "Often fewer visible variables; provider-specific evidence unavailable"]
      - ["Risk-bearing license and capital", "MGA; partner carriers retain underwriting risk", "Carrier and risk-bearing infrastructure evidenced", "Unknown from assigned evidence", "Assigned snapshot provides balance-sheet ratios but no comparable insurance-operating evidence", "Incumbent carrier normally bears risk; internal build would require approvals and capital"]
      - ["European retail distribution", "Zurich/DA Direkt route and planned multi-country rollout reported", "Existing European retail reach", "Unknown in assigned evidence", "Unknown from assigned evidence", "Broker/comparison routes may provide reach but are not mapped for Ominimo"]
      - ["Customer experience and claims proof", "Customer-facing product described; public claims cohort not found", "Established claims infrastructure implied by carrier role", "Digital-first experience is a public positioning signal", "Claims and retention comparability unknown", "Trust and claims history are likely incumbent advantages, but no uniform benchmark was found"]
      - ["Regulatory posture for AI pricing", "Must operate within insurance rules and, where applicable, AI requirements", "Subject to the same insurance-sector supervision and carrier controls", "Unknown from assigned evidence", "Unknown from assigned evidence", "Internal build bears direct governance and model-risk burden"]
      - ["Switching and lock-in", "Customer can potentially switch at renewal; Ominimo depends on carrier, data, and market access", "Carrier relationship and policy infrastructure can increase institutional stickiness", "Unknown from assigned evidence", "Unknown from assigned evidence", "Renewal cycles and comparison channels limit customer lock-in"]
    notes: "Cells state only what the assigned sources support. Unknown means no comparable evidence was retained, not that the capability is absent."
    claimRefs: [CP005, CP006, CP007, CP008, CP010, CP013]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Alternative, Price or contract model, Included capabilities, Discount or unknowns, Competitive implication]
    rows:
      - [Ominimo, "Motor policy pricing; public list-price schedule not retained", "MGA-managed quote, underwriting, distribution, and claims workflow with carrier capacity", "A directory claims up to 30% below traditional averages; realized price, coverage, and sample are unknown", "Potential price advantage requires validation against comparable quotes and loss outcomes"]
      - ["Zurich / DA Direkt", "Carrier product pricing; public comparable quote not retained", "Risk capacity, licensing, distribution, and pricing expertise", "Discounts and partner economics unknown", "Can scale Ominimo's distribution while retaining incumbent trust and capital"]
      - [Lemonade, "Public-market digital insurer; assigned evidence has no comparable motor quote", "Digital-first insurance experience", "Price, coverage, and geography not comparable in assigned evidence", "Useful strategic comparator, not a pricing benchmark"]
      - [Root, "Archived market-data page does not disclose policy price", "Public financial scale data only", "Product, pricing, coverage, and geography are unknown from the retained page", "Cannot serve as a pricing benchmark without product-level evidence"]
      - ["Traditional insurer / broker", "Mandatory third-party and comprehensive motor policies; provider-specific list prices unknown", "Established coverage, claims, and distribution", "No pooled price or realized margin evidence", "Status quo remains the default against which Ominimo's quote conversion and retention must be tested"]
    notes: "No retained source provides a controlled, same-driver, same-coverage quote comparison. Pricing claims are therefore labelled as unknown or company-description signals rather than treated as verified discounts."
    claimRefs: [CP010, CP011, CP012]
figures:
  - id: FP001
    title: Competitive positioning by pricing differentiation and institutional power
    type: quadrant
    summary: Ordinal positioning separates data-led pricing differentiation from carrier balance-sheet and distribution power; scores are evidence-backed hypotheses, not market rankings.
    data:
      xAxis: "Data-led pricing differentiation (ordinal 1–5)"
      yAxis: "Carrier balance-sheet and distribution power (ordinal 1–5)"
      points:
        - {label: Ominimo, x: 5, y: 3, detail: "Hundreds of variables and proprietary platform are reported; Zurich/DA Direkt add carrier and distribution access.", source: "CP005, CP006"}
        - {label: "Zurich / DA Direkt", x: 3, y: 5, detail: "Carrier pricing expertise, risk capacity, and European retail reach are evidenced.", source: "CP006, CP007"}
        - {label: Lemonade, x: 3, y: 3, detail: "Named by Ominimo's CEO as a key competitor; neutral midpoint scores reflect missing motor-specific capability evidence.", source: "CP009"}
        - {label: "Traditional insurer", x: 2, y: 5, detail: "TechCrunch contrasts Ominimo's broad-variable model with traditional pricing and identifies incumbent legacy systems as a constraint.", source: "CP005, CP015"}
        - {label: "Insurer internal build", x: 3, y: 4, detail: "TechCrunch describes major insurers commissioning new products and taking over code, but also reports execution and talent constraints.", source: "CP015"}
        - {label: "Front-end-led insurtech", x: 3, y: 2, detail: "Ominimo's CEO characterizes many startup peers as stronger in customer experience than underwriting depth; this is not an independent benchmark.", source: "CP015"}
    approximationNotes: "Coordinates are analyst-assigned ordinal scores from 1 to 5 based only on the cited evidence; midpoint scores denote unresolved capability evidence and are not measured benchmarks."
    claimRefs: [CP003, CP005, CP009, CP015]
