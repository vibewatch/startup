callouts:
  - calloutType: risk
    title: Valuation does not resolve retained economics
    body: The $1.6 billion valuation and gross written premium figures do not disclose Ominimo's retained revenue, cash generation, contribution margin, carrier take rates, or capital obligations.
    claimRefs: [CO008, CO011]
  - calloutType: recommendation
    title: Verify governance and carrier dependence
    body: Obtain the cap table, board and investor rights, carrier agreements, licensing plan, claims triangles, retention cohorts, and country-level complaints before relying on the headline scale.
    claimRefs: [CO004, CO005, CO008, CO016]
