company:
  name: Ominimo
chapter:
  number: 1
  title: Company Overview
  summary: Ominimo is a founder-led motor-insurance MGA founded in 2024 and built around data-driven pricing, carrier capacity, and rapid European expansion. July 2026 sources consistently report a $1.6 billion valuation and nearly one million customers, while headquarters, the exact Series B amount, governance, retained economics, and customer outcomes remain incompletely disclosed.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Ominimo was founded in 2024 by Dusan Komar, Dennis Weinbender, and Laslo
      Horvath. It sells digital motor-insurance products through a managing
      general agent model: Ominimo controls pricing, distribution, claims, and
      customer experience while partner carriers, including Signal Iduna and
      DA Direkt in the reviewed coverage, provide underwriting capacity. That
      structure supports expansion without requiring Ominimo to carry all
      policy risk on its own balance sheet, but it also makes carrier contracts
      and binding authority central diligence items. Headquarters are not
      consistently described. InsurTech List calls the company
      Budapest-headquartered, while The Recursive calls it
      Novi Sad-headquartered and describes engineering activity in Belgrade and
      Novi Sad. The evidence therefore supports a multi-city operating
      footprint, not a single verified headquarters answer.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      The public leadership narrative remains concentrated in the founding
      team. Komar is identified as co-founder and CEO, Horvath as co-founder
      and CTO, and Weinbender as co-founder; several sources describe the
      founders as former McKinsey consultants. That background provides
      relevant insurance-strategy and technical context, but the assigned
      evidence does not establish a complete executive roster, current board,
      investor consent rights, succession plan, or role boundaries beyond the
      named founders. The resulting key-person exposure is material because the
      company is simultaneously managing underwriting models, carrier
      relationships, licensing plans, and multi-country launches. The
      stakeholder map should therefore be treated as a partial public view, not
      a cap table or governance register, and ownership or control conclusions
      require primary documents.
    claimRefs: [CO001, CO015]
    tableRefs: [TO002, TO003]
  - id: financing-and-scale
    title: Financing and operating scale
    body: >-
      The financing trajectory is rapid but contains one important disclosure
      conflict. Coverage reports Zurich investing EUR 10 million for a 5%
      stake at a EUR 200 million post-money valuation in 2025. July 2026
      coverage then consistently places the Series B valuation at $1.6 billion
      with EBRD leading, but IBS Intelligence reports $22.5 million of Series B
      funding while The Recursive says the amount was not being disclosed at
      its publication date. Scale metrics also require precise labels:
      publications report nearly one million customers across Hungary, Poland,
      the Netherlands, and Sweden, annualized gross written premium above $350
      million or around EUR 307 million, and approximately 130 employees.
      Gross written premium is policy volume, not Ominimo revenue, ARR, cash,
      or contribution margin, and the sources do not reconcile currency,
      cutoff date, active-customer definitions, or retained economics.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010, CO011, CO012]
  - id: milestones-and-diligence-implications
    title: Milestones and diligence implications
    body: >-
      The milestone record shows fast execution from a 2024 founding through a
      Zurich-backed Series A, four-market operation, a reported June 2026 daily
      sales record, and a July 2026 unicorn financing. Expansion plans include
      obtaining an insurance licence, adding products, entering more European
      markets, and targeting the United States in 2027; these are plans rather
      than completed outcomes. Adverse public evidence is thin rather than
      reassuring: one Swedish Reddit user said they could find few firsthand
      experiences and asked about service and claims, but the post supplied no
      verified outcome. No assigned source establishes complaint rates,
      settlement times, renewals, or country-level claims performance. The
      absence of a documented incident in this pool is not evidence that no
      incident occurred, so customer and regulatory checks remain open.
    claimRefs: [CO013, CO014, CO016]
    figureRefs: [FO001]
