      - [Comprehensive motor cover, "Digital Casco policy", "Product offered; realized pricing not disclosed", "Observed product description", "Obtain policy-level premium, renewal, and claims cohorts"]
      - [Gross written premium run-rate, "Annualised premium volume written", "€26.3m in 2024 to about €307m reported by Beinsure", "Third-party reported; GWP is not revenue", "Reconcile policy, market, currency, and run-rate definitions"]
      - [Gross written premium run-rate, "Annualised premium volume written", "More than $350m reported by Pulse2 in July 2026", "Third-party report of company announcement", "Obtain management accounts and currency/date bridge"]
      - [Customers, "Customers across four European markets", "Nearly 1m reported by Beinsure", "Third-party reported", "Obtain active, paying, policy, and renewal definitions"]
      - [Policy volume, "Policies sold in Hungary", "More than 300,000 reported after 15 months", "Profile/news reported", "Obtain issued-policy, in-force-policy, and cancellation data"]
      - [Insurance licence, "Potential transition toward own licensed capacity", "Planned use of Series B capital", "Company-reported plan", "Confirm application status, capital requirement, and timing"]
      - [New products, "Expansion beyond current motor offerings", "Planned over the next 18 months", "Company-reported plan", "Obtain product economics and launch gates"]
      - [US expansion, "Entry outside Europe", "Planned for 2027", "Company-reported plan", "Obtain state-by-state capital, licensing, and launch budget"]
      - [Partner-carrier economics, "Carrier supplies underwriting capacity", "Terms and revenue share not public", "Private-evidence gap", "Request carrier contracts, commissions, and termination rights"]
    notes: "Public sources mix GWP, policy, customer, and funding measures across dates and currencies; none should be treated as Ominimo revenue or ARR without a management reconciliation."
    claimRefs: [CI001, CI002, CI003, CI004, CI009, CI010]
  - id: TI002
    title: Pricing and monetization
    columns: [Metric or lever, Public evidence, Status, Why it matters, Diligence ask]
    rows:
      - [List premium positioning, "Up to 30% lower than traditional market averages", "Profile-reported claim", "May support conversion but does not establish realized margin", "Obtain quoted-versus-bound premium by market"]
      - [Risk variables, "Hundreds of data points described in company/profile coverage", "Reported operating approach", "May improve selection and pricing granularity", "Validate lift, calibration, and stability by cohort"]
      - [Direct channel mix, "Approximately one in five policies bought on own website", "The Recursive report", "Lower direct acquisition dependence is plausible", "Obtain CAC, conversion, and renewal by channel"]
      - [Aggregator channel, "Integrates with price comparison engines", "Company-reported channel strategy", "Can expand reach while adding possible commissions", "Obtain commission schedules and attribution"]
      - [Broker channel, "Broker networks used alongside direct channel", "Company-reported channel strategy", "May accelerate distribution but increase intermediation cost", "Obtain broker fees and concentration"]
      - [Carrier distribution, "DA Direkt and Signal Iduna named as partners", "Third-party reported", "Provides underwriting and distribution access", "Obtain partner-level volume and economics"]
      - [Combined ratio, "92% to 100% including RBNS and IBNR", "The Recursive report", "Suggests reported underwriting profitability at the policy book level", "Obtain audited loss triangles and cohort ratio bridge"]
      - [Gross margin, "Not disclosed", "Unavailable", "Prevents software-versus-insurance margin assessment", "Request statutory and management gross-margin definitions"]
      - [CAC payback, "Not disclosed", "Unavailable", "Prevents sales-efficiency underwriting", "Request CAC, contribution margin, and payback by channel"]
      - [Retention and churn, "Not disclosed", "Unavailable", "Determines whether growth compounds", "Request renewal, churn, lapse, and claims-free retention cohorts"]
    notes: "List-price and channel claims are not realized revenue; the combined ratio is an underwriting metric and cannot be substituted for gross margin or net income."
    claimRefs: [CI005, CI006, CI007, CI008]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value or null, Confidence, Why it matters, Diligence ask]
    rows:
      - [Gross written premium, "€307m run-rate / $350m+ reported in separate sources", medium, "Scale indicator but not retained revenue", "Reconcile date, currency, and definition"]
      - [Revenue retained by Ominimo, null, low, "Core underwriting value capture is unknown", "Obtain revenue recognition and carrier-settlement schedules"]
      - [Combined ratio, "92%-100% reported range", medium, "Tests underwriting profitability", "Validate ultimate claims and development"]
      - [Gross margin, null, low, "Needed to assess operating leverage", "Provide audited or management gross-margin bridge"]
      - [Customer acquisition cost, null, low, "Tests channel efficiency", "Provide CAC by direct, aggregator, broker, and carrier channel"]
      - [CAC payback, null, low, "Tests cash efficiency of growth", "Provide contribution-margin payback by cohort"]
      - [Cash on hand, null, low, "Determines ability to fund expansion", "Provide latest balance sheet and restricted cash"]
      - [Monthly burn, null, low, "Determines runway", "Provide trailing twelve-month cash-flow bridge"]
      - [Runway, null, low, "Determines financing dependency", "Provide base/downside runway with licence capex"]
      - [Capital per premium euro, "About €0.20 cited for own underwriting capacity", medium, "Illustrates capital intensity if Ominimo assumes risk", "Confirm regulatory basis, eligible capital, and target book"]
      - [Debt and project finance, null, low, "Could constrain expansion and liquidity", "Provide debt schedule, covenants, and guarantees"]
      - [Funding raised, "Approximately €30m external funding reported", medium, "Indicates financing history, not cash available", "Reconcile gross proceeds, dilution, fees, and cash balance"]
    notes: "Nulls are unavailable public inputs and require management evidence; funding raised must not be interpreted as cash available or runway."
    claimRefs: [CI009, CI010, CI011, CI012]

figures:
  - id: FI001
    title: Reported motor-insurance economic bridge
    type: flow
    summary: "The public model runs from data-assisted acquisition and pricing through carrier-backed underwriting; retained economics are not disclosed."
    data:
      nodes:
        - {id: demand, label: "Drivers seek cover", detail: "Direct, aggregator, comparison, and broker channels"}
        - {id: pricing, label: "Data-assisted pricing", detail: "Hundreds of variables are described in public coverage"}
        - {id: policy, label: "Policy issued", detail: "Mandatory liability and comprehensive motor products"}
        - {id: carrier, label: "Carrier capacity", detail: "Partner carriers retain underwriting risk under the MGA model"}
        - {id: premium, label: "GWP recorded", detail: "Publicly reported run-rate; not Ominimo revenue"}
        - {id: gap, label: "Retained economics", detail: "Revenue share, CAC, claims, and margin remain private"}
      edges:
        - {from: demand, to: pricing}
        - {from: pricing, to: policy}
        - {from: policy, to: carrier}
        - {from: carrier, to: premium}
        - {from: premium, to: gap}
    approximationNotes: "The diagram is a qualitative operating model, not a proportional financial waterfall; no undisclosed revenue or margin values are inferred."
    claimRefs: [CI001, CI005, CI007, CI008]

callouts:
  - calloutType: strength
    title: Reported underwriting traction
    body: Ominimo's public evidence combines rapid GWP growth with a reported 92%-100% combined-ratio range, a stronger signal than volume growth alone but not an audited company-level profit measure.
    claimRefs: [CI002, CI007]
  - calloutType: risk
    title: Capital and margin disclosure blocker
    body: The largest underwriting gap is the bridge from GWP and carrier-backed policies to Ominimo's retained revenue, cash generation, and capital need if it obtains its own licence.
    claimRefs: [CI009, CI011, CI012]
  - calloutType: recommendation
    title: Require an insurance economics data room
    body: Underwriting should remain conditional on policy and renewal cohorts, carrier contracts, claims development, cash-flow statements, and licence-capital requirements.
    claimRefs: [CI006, CI007, CI011, CI012]

