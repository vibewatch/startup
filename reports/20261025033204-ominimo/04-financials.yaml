schemaVersion: "report-v2"
artifact: financials
slug: ominimo
runDate: 2026-10-25
company:
  name: Ominimo
chapter:
  number: 4
  title: Financials
  summary: Ominimo has disclosed rapid gross-written-premium and customer growth while operating as an MGA whose carrier partners retain underwriting risk. The public record supports a capital-light distribution model and reported underwriting profitability, but it does not disclose Ominimo revenue, cash, burn, realized pricing, or audited unit economics.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and public traction
    body: >-
      Ominimo sells digital motor insurance through mandatory liability and comprehensive
      products, with pricing and purchase completed digitally. The company operates as a
      managing general agent: public coverage describes Ominimo as pricing risk, managing
      customer relationships, and handling claims while carrier partners carry underwriting
      risk. That distinction is central to underwriting the business: gross written premium
      (GWP) is policy volume, not Ominimo revenue, and partner-carrier economics are not
      disclosed. Beinsure reports annualised GWP rising from €26.3 million in 2024 to about
      €307 million and nearly one million customers across Hungary, Poland, the Netherlands,
      and Sweden; Pulse2 reports more than $350 million of annualised GWP. The differing
      currencies and measures should not be reconciled into a single precise figure. The
      available evidence supports strong distribution traction, not a verified ARR or
      retained-revenue number.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
  - id: pricing-and-unit-economics
    title: Pricing, distribution, and unit economics
    body: >-
      Ominimo's stated economic mechanism is data-assisted risk selection plus automated
      policy issuance, distributed through direct digital channels and carrier, broker,
      aggregator, or comparison-platform relationships. Startup.eu describes hundreds of
      data points and a claim of premiums up to 30% below traditional market averages;
      this is a company/profile claim rather than evidence of realized premium, retention,
      or margin. The Recursive reports that approximately one in five policies is purchased
      through Ominimo's own website and that the company integrates with aggregators, price
      comparison engines, and broker networks. That channel mix may reduce direct marketing
      spend, but commissions, CAC, conversion, renewal, churn, loss ratio by cohort, and
      carrier revenue share remain private. Ominimo's reported combined ratio of 92% to 100%
      in The Recursive is an underwriting metric, not gross margin or company net income, and
      is presented as a reported range rather than independently audited evidence.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002]
    figureRefs: [FI001]
  - id: capital-adequacy-and-verdict
    title: Capital needs and underwriting verdict
    body: >-
      The Series B gives Ominimo disclosed growth capital, but the public sources do not
      state cash on hand, monthly burn, runway, debt, covenants, or the amount available
      after transaction costs and operating investment. Vestbee says approximately €30
      million of external funding has been raised to date, while separate coverage reports
      the Series B as $22.5 million; these are financing figures, not cash available. The
      stated uses include European expansion, a planned US launch in 2027, new products,
      technology investment, and obtaining an own insurance licence. Moving from MGA
      economics toward carrying risk could retain more underwriting economics but increases
      regulatory capital requirements; Beinsure cites an approximate 20 cents of capital per
      euro of premium underwritten. EIOPA's overview is based on annually reported Solvency II
      information, but it provides sector context rather than Ominimo-specific solvency
      evidence. The financial verdict is therefore positive on demand and reported
      underwriting traction, conditional on proving retained revenue, loss-ratio durability,
      carrier economics, and licence-capital adequacy.
    claimRefs: [CI009, CI010, CI011, CI012]
    tableRefs: [TI003]
  - id: exhibits
    title: Exhibits
    body: >-
      The exhibits separate observed public metrics from company-reported or profile-reported
      figures and identify the diligence requests required before underwriting a valuation.
      The revenue table keeps policy products, GWP, customers, and licensing plans distinct
      because each has a different economic meaning. The pricing table distinguishes list
      positioning and distribution claims from realized revenue and margin. The unit
      economics table deliberately leaves cash, burn, retention, CAC, and Ominimo revenue
      null where the assigned public evidence does not disclose them. This is not a claim
      that the metrics are zero; it is a material underwriting gap. The requested follow-up
      evidence is therefore operationally specific: carrier contracts, claims development,
      channel cohorts, management accounts, and the capital plan for any own-license
      transition.
    claimRefs: [CI002, CI004, CI007, CI009, CI011]

