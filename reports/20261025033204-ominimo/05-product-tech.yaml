callouts:
  - calloutType: strength
    title: Reusable operating model is plausible
    body: >-
      Carrier capacity, a digital quote-and-bind surface, machine-learning pricing, and a digitally integrated repair workflow form a coherent operating model for an MGA. The model is strategically attractive, but most architecture and performance claims remain company- or partner-reported.
    claimRefs: [CE002, CE005, CE009]
  - calloutType: risk
    title: Model and control evidence is thin
    body: >-
      No assigned source documents Ominimo's production controls for model governance, privacy, security, resilience, or explainability. Expansion diligence should therefore require technical and regulatory evidence rather than relying on product descriptions.
    claimRefs: [CE013, CE014, CE015, CE016]
