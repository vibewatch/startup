chapter:
  number: 5
  title: Product & Technology
  summary: Ominimo presents a digital motor-insurance MGA built around machine-learning pricing, carrier-backed underwriting, and partner-led claims operations. Public evidence supports the product workflow and selected operating integrations, but not a complete technical architecture, model-governance record, or independently verified reliability and security profile.
sections:
  - id: customer-workflow
    title: Product and customer workflow
    body: >-
      Ominimo is described as a managing general agent offering digital mandatory liability and comprehensive motor policies through a mobile app and web portal. Its customer proposition is an online quote-and-bind journey with risk-adjusted prices, while the underwriting capacity remains supplied by Zurich's DA Direkt. The public record supports a consumer-facing digital workflow, but does not document the full policy-administration stack, identity controls, payment flow, or country-specific service-level commitments. Fixico's announcement adds a downstream claims workflow: repair management is integrated directly into Ominimo's claims systems and processes, with status, performance, and customer-experience visibility. That is useful operational evidence, but it is a partner statement and does not independently establish end-to-end claims reliability.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: underwriting-engine
    title: Underwriting engine and operating architecture
    body: >-
      The product's claimed technical differentiator is granular motor-risk pricing. Public descriptions say the models evaluate hundreds of variables, including vehicle dimensions and urban infrastructure, and generate risk-adjusted pricing in real time; another profile describes more than 100 variables per application. These descriptions establish the intended mechanism, not model accuracy, fairness, calibration, or production latency. The clearest architecture evidence is a cloud-native, internally engineered microservices platform reported by The Recursive, with localized configuration used for new markets rather than a rebuilt core. This remains a media-reported company description: no API documentation, architecture diagram, benchmark, uptime history, model card, or independent reproducibility evidence was available in the assigned pool.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: integrations-and-maturity
    title: Integrations, maturity, and scale signals
    body: >-
      Ominimo's strongest public maturity signal is not a software release history but a live operating footprint. Fixico says it manages all body and glass repairs in the Netherlands under a long-term exclusive arrangement, with target lead times, quote turnaround, and satisfaction thresholds. Zurich's distribution relationship supplies carrier capacity and a route into additional European markets. The product therefore appears to combine a reusable pricing and policy platform with market-specific carrier, distribution, and repair integrations. Public sources do not establish whether these integrations are standardized APIs, bilateral workflows, or manual operational handoffs. The pool also contains no developer repository, package registry, public status history, or customer-verified production outcomes, so technical maturity should be treated as partially evidenced rather than proven.
    claimRefs: [CE009, CE010, CE011, CE012]
  - id: trust-controls-and-gaps
    title: Trust, safety, privacy, and diligence gaps
    body: >-
      Motor-insurance pricing is a regulated, high-impact use of data. EIOPA describes AI use across the insurance value chain as subject to sectoral supervision alongside the EU AI framework, while Insurance Europe emphasizes machine-readable vehicle data, GDPR alignment, deletion rules, profiling limits, and protection of business-sensitive derived data. Those sources describe the control environment, not Ominimo's implementation. A 2026 independent research profile in the assigned pool provided only a beta disclaimer and no Ominimo-specific technical analysis, reinforcing rather than closing the verification gap. The evidence does not show Ominimo's model-validation policy, explainability process, bias testing, incident response, penetration testing, data-retention schedule, certification, licensing status by market, or audit results. The practical risk is insufficient public evidence, not a proven control failure.
    claimRefs: [CE013, CE014, CE015, CE016]
