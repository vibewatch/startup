callouts:
  - calloutType: risk
    title: The largest unresolved risk is evidence, not a proven incident
    body: No retained source establishes a security breach, regulatory enforcement action, or claims-service failure. The material concern is that licensing coverage, model controls, claims outcomes, partner economics, and concentration are not publicly verified across the expansion footprint.
    claimRefs: [CR003, CR006, CR007, CR011]
  - calloutType: assumption
    title: Gross written premium must not be treated as Ominimo revenue
    body: Secondary descriptions report policy, customer, and premium figures, but the retained evidence does not disclose Ominimo's retained revenue, commission structure, loss ratio, or cash conversion. Financial diligence should test the bridge from gross written premium to contribution margin and runway.
    claimRefs: [CR013, CR014, CR015]

