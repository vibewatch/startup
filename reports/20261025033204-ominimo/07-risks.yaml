    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Pricing-model drift or inadequate calibration across countries", medium, high, "Low: variable count is described but validation is not", "High", "Need cohort loss ratios, calibration, fairness, drift, and override monitoring by market"]
      - ["Claims-service or customer-support failure during rapid growth", medium, high, "Low: no claims-resolution or complaint dataset retained", "High", "Need claims cycle time, complaint rate, escalations, and service-level performance"]
      - ["Cybersecurity, privacy, or data-availability failure affecting digital underwriting", medium, high, "Low: no incident, control, or recovery evidence retained", "High", "Obtain SOC/ISO evidence, DPA, penetration-test summary, incident log, RTO/RPO, and vendor map"]
      - ["Repair-cost inflation and supply-chain disruption compress underwriting margins", high, high, "Partial: external market outlook identifies claims-cost pressure", "Medium-high", "Stress-test pricing and reserves against repair, parts, energy, and claims-severity scenarios"]
    notes: "Risk ratings are analytical judgments anchored to the cited operating and market evidence; unavailable internal controls, incidents, and performance metrics remain explicit gaps."
    claimRefs: [CR005, CR006, CR007, CR008, CR012, CR016]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration evidence, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Risk carrier and delegated underwriting, "Zurich / DA Direkt", "Carrier, investor, and distribution partner", "Public sources describe the relationship; share of premium and authority scope are undisclosed", "Carrier withdraws capacity, changes appetite, or disputes delegated authority", high, "Document authority, economics, renewal, termination, and replacement-carrier plan", "High"]
      - [Broker and comparison-site distribution, "Brokers and comparison sites", "Customer acquisition and policy distribution", "Scalable describes these channels, but channel mix and concentration are not disclosed", "Acquisition cost rises or a channel removes the product", medium-high, "Obtain channel-level policies, CAC, renewal, commission, and termination data", "Medium-high"]
      - [Market-entry regulatory infrastructure, "Country regulators and local entities", "Permissions, notifications, and consumer-protection oversight", "Expansion is described across multiple EU markets, but country-by-country status is not retained", "Launch is delayed or a product must be withdrawn", high, "Maintain a market-entry checklist with legal sign-off and regulator evidence", "High"]
    notes: "Partner and channel concentration cannot be quantified from the retained public sources. The table separates disclosed relationship roles from the unverified scale of dependency."
    claimRefs: [CR009, CR010, CR011]

