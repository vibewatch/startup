      - [Local financial-services authorisation and formal business name may differ from the consumer brand, Sweden, medium, high, "Partial: FI explains that formal names and brands may differ", "Medium-high until the legal entity and status are matched", "Match Ominimo and DA Direkt entities to FI's company register and retain authorisation evidence"]
      - [Dutch register status and any notification or exemption are not established, Netherlands, medium, high, "Low: DNB register guidance is retained but no Ominimo result is shown", "High until DNB confirmation is obtained", "Request a dated DNB register search and legal opinion on passporting or exemption"]
    notes: "Register pages describe the relevant public systems; they do not prove Ominimo's presence or absence. Null or unconfirmed status is an evidence gap, not a finding of non-compliance."
