companyProfile:
  summary: >-
    Ominimo is a founder-led European motor-insurance managing general agent founded in 2024. It distributes digital
    motor policies, manages pricing, distribution, claims, and customer experience, and relies on partner carriers for
    underwriting capacity. Public reporting describes rapid expansion from Hungary into additional European markets and
    a July 2026 Series B valuation of approximately $1.6 billion, while the exact headquarters, ownership, retained
    economics, and governance remain only partly disclosed.
