  topStrengths:
    - Rapid multi-market expansion with reported near-million-customer scale.
    - MGA structure combines proprietary pricing and distribution with partner-carrier capacity.
    - Strong capital-markets signal from a reported $1.6 billion Series B valuation.
  topRisks:
    - >-
      Public evidence does not bridge gross written premium to retained revenue, contribution margin, or cash
      generation.
    - Carrier concentration, binding authority, termination rights, and licensing requirements remain unclear.
    - Private-company governance, dilution, and investor-control terms are not publicly established.
  unresolvedGaps:
    - How much of gross written premium converts into retained revenue and contribution margin for Ominimo itself.
    - Country- and channel-level renewal, churn, and retention data across Hungary, Poland, the Netherlands, and Sweden.
    - Partner-carrier economics, termination rights, and concentration by channel or market.
    - Current board composition, cap-table rights, dilution, and investor-control structure after Series B.
    - >-
      Licensing capital plan and whether the model scales into larger European markets and the United States with the
      same discipline.
