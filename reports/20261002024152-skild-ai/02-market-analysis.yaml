callouts:
  - calloutType: "insight"
    title: "Manipulation Represents the High-Willingness-to-Pay Foundation Frontier"
    body: "While market enthusiasm frequently centers on bipedal humanoids and autonomous mobile transport, Skild AI's commercial revenue breakdown indicates that roughly 90% of its $100M ARR is generated from manipulation tasks. Autonomous mobility is largely commoditized, representing just 10% of revenue (with 4% tied to acquired Zebra AMRs). Real industrial spend is directed at automating complex, high-dexterity manipulation tasks such as wire harness insertion and electronics assembly that previously resisted automation."
