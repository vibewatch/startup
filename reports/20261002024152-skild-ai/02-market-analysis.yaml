chapter:
  number: 2
  title: "Market Analysis"
  summary: "Skild AI addresses the physical AI and general-purpose robotics intelligence market by offering an omni-bodied foundation model (the Skild Brain) as software infrastructure across fragmented robot form factors. While long-term analyst projections forecast a $38B humanoid market by 2035 and structural shortages of 2.1M manufacturing workers by 2030, commercial adoption in 2026 remains governed by integration friction, cycle-time parity, and impending European safety regulation for self-evolving machinery."
sections:
  - id: "market-boundary-and-taxonomy"
    title: "Market Boundary, Taxonomy, and Structural Shifts"
    body: "The addressable market for Skild AI occupies the horizontal physical intelligence layer of robotics automation, distinct from traditional robotics hardware OEMs, single-purpose industrial robotics cells, and purely digital multimodal language models. Historically, robotic automation required bespoke hardware engineering, hand-crafted control policies, and custom programming for every machine geometry and task. Skild AI defines its market around universal robotics foundation models that act as an operating system or software intelligence layer capable of controlling diverse morphologies including quadrupeds, mobile manipulators, humanoid systems, and tabletop robotic arms. The addressable software spend includes robotics operating software licenses, foundation model API usage, and vertical solution orchestration modules. Spend excluded from Skild AI's direct model revenue includes raw mechanical hardware, structural castings, and standard actuator manufacturing. Incumbent status-quo substitutes consist of fixed-function robotic automation, manual human labor across warehousing and manufacturing stations, and proprietary vertically integrated autonomy stacks developed by single-form-factor OEMs. By acquiring Zebra Technologies' robotics automation business, Skild AI absorbed established autonomous mobile robot (AMR) orchestration to directly access brownfield logistics and warehouse fulfillment operations."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM003"
      - "CM007"
    tableRefs:
      - "TM001"
  - id: "market-sizing-and-adoption-lenses"
    title: "Market Sizing Lenses, Growth Drivers, and Near-Term Reality"
    body: "Evaluating the addressable market for general-purpose physical AI requires contrasting long-range macroeconomic labor projections against concrete deployment metrics. Macroeconomic thesis drivers cite structural labor scarcity, including projections that 2.1 million U.S. manufacturing positions could remain unfilled by 2030 with potential economic output impacts exceeding $1 trillion. Long-horizon analyst estimates forecast the global humanoid robot market to reach $38 billion by 2035 and speculative evaluations reach $5 trillion by 2050. However, near-term shipment data highlights the early stage of physical deployment: global humanoid robot shipments reached approximately 13,300 units in 2025 with forecasts targeting 250,000 units by 2030. Consequently, Skild AI's near-term serviceable market is concentrated in non-humanoid industrial form factors, specifically mobile manipulation, quadrupedal security/inspection, and warehouse material transport. Commercial revenue traction expanded rapidly from zero to approximately $30 million during 2025, with company announcements stating annual recurring revenue crossed $100 million in September 2026 across 60+ enterprise customers. Of this recognized revenue base, manipulation tasks account for roughly 90%, while mobility solutions account for 10% (including 4% from acquired AMR solutions). This distribution illustrates that customer willingness to pay is currently driven by dexterous manipulation bottlenecks rather than standalone wheeled locomotion."
    claimRefs:
      - "CM004"
      - "CM005"
      - "CM006"
      - "CM008"
      - "CM009"
      - "CM010"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyer-segmentation-and-constraints"
    title: "Buyer Segmentation, Procurement Paths, and Adoption Constraints"
    body: "Adoption of physical foundation models spans three primary customer profiles: robot hardware OEMs, industrial enterprise operators, and automated system integrators. Robot manufacturers license the Skild Brain to eliminate multi-year in-house AI development cycles, converting capital expenditure into cloud-based API licensing and edge runtime fees. Enterprise buyers in manufacturing, logistics, and critical infrastructure evaluate deployments based on cycle-time parity, station throughput, and error recovery rather than passive benchmark demonstrations. Commercial deployments across Foxconn Blackwell server assembly, Sumitomo Wiring Systems, and Mitsui commercial kitchen pilots reveal that industrial adoption triggers center on labor availability and retooling speed. However, critical constraints govern deployment velocity. Deployments require cycle-time parity with human line workers, where a robot operating with high accuracy but at one-tenth human speed cannot be placed into production. Furthermore, physical foundation models face impending regulatory hurdles: the European Union's Machinery Regulation takes effect on January 20, 2027, introducing mandatory third-party notified body assessments for machinery demonstrating self-evolving or out-of-distribution operational behaviors. Hardware integration friction, sim-to-real physical discrepancies, and liability risks for physical property damage remain persistent adoption bottlenecks."
    claimRefs:
      - "CM011"
      - "CM012"
      - "CM013"
      - "CM014"
      - "CM015"
    tableRefs:
      - "TM003"
