callouts:
  - calloutType: "insight"
    title: "In-Context Video Prompting Overcomes the Post-Training Bottleneck"
    body: "Conventional robotic foundation models mirror the BERT era of NLP, requiring tens to hundreds of hours of teleoperated post-training data and custom fine-tuning for each new deployment workflow. Skild AI's S1 establishes that large-scale pre-training across diverse embodiments enables direct in-context learning from a single video demonstration, delivering performance equivalent to roughly 380 post-training teleoperation episodes without fine-tuning neural network weights."
    claimRefs:
      - "CE003"
      - "CE005"
  - calloutType: "risk"
    title: "Throughput Constraints and Cycle Time Bottlenecks in Production"
    body: "While in-context learning achieves 66% cumulative success on unseen long-horizon manipulation tasks, autonomous industrial deployments face stringent cycle time demands. In synchronized assembly lines with human workers or adjacent automated stations, a robotic manipulator that operates even slightly below required line speeds becomes a throughput bottleneck, indicating that rapid task adaptation must still be paired with extensive speed and reliability distillation before replacing hardcoded automation."
    claimRefs:
      - "CE004"
      - "CE006"
