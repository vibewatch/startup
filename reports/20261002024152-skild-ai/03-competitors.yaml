company:
  name: "Skild AI"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Skild is positioned as a horizontal, hardware-agnostic robotics intelligence layer,
    competing with other foundation-model developers, big-tech platforms, and vertically
    integrated robot makers. Its claimed one-video adaptation and deployment traction are
    differentiated, but public pricing, named-customer proof, and independent comparative
    benchmarks remain material diligence gaps.
sections:
  - id: "competitive-landscape"
    title: "Competitive landscape and buyer alternatives"
    body: >-
      The relevant landscape is broader than direct robotics-foundation-model startups.
      Independent analysis groups Covariant, Physical Intelligence, and Genesis AI as
      horizontal peers, while Alphabet's Intrinsic and NVIDIA's Isaac represent platform
      alternatives with compute, ecosystem, and enterprise-distribution advantages. A
      separate threat comes from vertically integrated developers such as Figure, Tesla,
      and Apptronik, whose hardware-software deployments can produce proprietary operating
      data and reduce demand for a third-party intelligence layer. Internal development and
      continued use of task-specific automation are also buyer alternatives, but the
      assigned evidence does not quantify their cost or adoption share. The table therefore
      presents a representative, evidence-bounded landscape rather than an exhaustive market
      census.
    claimRefs: ["CP001", "CP002", "CP003", "CP004", "CP012", "CP014"]
    tableRefs: ["TP001"]
  - id: "capability-and-positioning"
    title: "Capability positioning and technical differentiation"
    body: >-
      Skild's central differentiation claim is breadth across robot morphologies combined
      with rapid task adaptation. The company describes one brain spanning quadrupeds,
      humanoids, tabletop arms, and mobile manipulators, and says S1 can execute a new task
      from one video without task-specific fine-tuning. Its internal comparison reports 66%
      average cumulative per-step success on unseen long-horizon tasks at 100,000 hours of
      pre-training, versus 9% for a language-prompted VLA baseline. Those results are useful
      indicators of the intended moat, not independent proof: the benchmark, task suite,
      grading intervention, and model comparison are company-issued. Hardware breadth may
      lower initial integration friction, while proprietary protocols and fragmented
      hardware can recreate integration costs and lock-in at deployment.
    claimRefs: ["CP004", "CP005", "CP006", "CP007"]
    tableRefs: ["TP002"]
    figureRefs: ["FP001"]
  - id: "commercial-scale-and-packaging"
    title: "Commercial scale, distribution, and packaging"
    body: >-
      Skild reports crossing $100 million in ARR ten months after its first commercial
      deployment and serving more than 60 paying customers. It also reports that about 90%
      of revenue comes from manipulation and 10% from mobility, including 4% from acquired
      Zebra/Fetch Robotics AMR solutions. These disclosures suggest that deployment access,
      integration capability, and acquired distribution are becoming competitive assets,
      rather than the model alone determining outcomes. However, TNW reported that the
      company declined to name the customers described in its coverage. AI Business
      separately reported $30 million of 2025 revenue; that historical accounting-period
      figure is not interchangeable with the later ARR claim. No retained source provides
      public list pricing, realized pricing, discounting, contract duration, or competitor
      packaging on a comparable basis.
    claimRefs: ["CP008", "CP009", "CP010", "CP011", "CP012", "CP013"]
    tableRefs: ["TP003"]
  - id: "durability-and-displacement-risk"
    title: "Moat durability and displacement risk"
    body: >-
      The moat depends on whether cross-embodiment learning and deployment data improve
      faster than integrated competitors' proprietary fleets and big-tech platforms'
      ecosystems. Skild's reported funding provides substantial capacity, but capital scale
      does not demonstrate benchmark leadership, pricing power, or low switching cost.
      Independent analysis explicitly warns that vertically integrated players may shrink
      the addressable market for a horizontal provider, while hardware fragmentation can
      constrain portability. Regulatory trust will also matter: TNW reports that Europe's
      Machinery Regulation will cover AI-based safety functions and self-evolving machinery
      from 20 January 2027 and require notified-body assessment. The fetched careers page
      did not establish current hiring scale, so organizational capacity relative to larger
      platforms remains unverified. The investment conclusion is therefore differentiation
      with material proof risk, not a demonstrated durable monopoly.
    claimRefs: ["CP002", "CP003", "CP004", "CP012", "CP014", "CP015", "CP016"]
