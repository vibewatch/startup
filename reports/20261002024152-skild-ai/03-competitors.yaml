callouts:
  - calloutType: "strength"
    title: "Differentiation is adaptation speed, not just morphology breadth"
    body: >-
      Skild's strongest claim is that one video can specify an unseen task without updating
      model weights, potentially reducing repeated data collection and task-specific
      fine-tuning. The retained performance evidence is company-issued and still requires an
      independent, common-task benchmark.
    claimRefs: ["CP005", "CP006", "CP007"]
  - calloutType: "risk"
    title: "Integrated stacks can capture the learning loop"
    body: >-
      Competitors that own hardware, software, customer deployment, and resulting data may
      compound faster than a horizontal model vendor, while big-tech platforms can use
      existing ecosystems to influence distribution.
    claimRefs: ["CP002", "CP003", "CP004"]
