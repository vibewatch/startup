companyProfile:
  summary: >-
    Skild AI is a 2023-founded robotics-model company that sells the Skild Brain as a general-purpose control layer
    across robot morphologies and deployment environments. Public evidence points to rapid commercialization, with a
    reported $100M ARR run rate and 60+ paying customers, but the company still does not disclose audited revenue
    quality, customer concentration, or full operating economics.
