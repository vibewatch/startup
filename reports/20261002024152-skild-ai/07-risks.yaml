chapter:
  number: 7
  title: "Risks"
  summary: "Skild AI's principal risks are scaling reliable physical performance, integrating an acquired orchestration business, establishing regulatory readiness for adaptive machinery, and supporting a $14 billion valuation with independently verifiable economics. Public evidence shows rapid company-reported adoption, but incident history, customer concentration, burn, cash, and external production benchmarks remain material diligence gaps."
sections:
  - id: "regulatory-legal-and-safety"
    title: "Regulatory, legal, and safety exposure"
    body: >-
      The clearest identified regulatory issue is Europe's Machinery Regulation, which The Next Web
      reports will cover AI-based safety functions and machinery with self-evolving behavior from
      January 20, 2027, with notified-body assessment rather than only manufacturer declaration.
      Applicability to Skild AI is conditional: the same report says the company had not disclosed
      whether it sells into Europe. The assigned evidence contains no regulator filing, conformity
      plan, safety certification, litigation search result, incident register, privacy assessment,
      export-control classification, or insurance disclosure. The investment implication is therefore
      not a finding of noncompliance; it is a readiness gap. Before underwriting European expansion
      or safety-critical deployments, diligence should verify intended jurisdictions, legal entity
      responsibilities, applicable standards, independent testing, incident reporting, and contractual
      allocation of product-liability risk.
    claimRefs:
      - "CR001"
      - "CR002"
    tableRefs:
      - "TR001"
    figureRefs:
      - "FR001"
  - id: "operational-quality-and-security"
    title: "Operational reliability, quality, and security"
    body: >-
      Skild AI itself identifies the hard part of robotics deployment as the final reliability margin:
      its egg task took one week to work once and another two months to work reliably across eggs and
      setups. It also says a robot that is 99.9% accurate but ten times too slow is not deployable,
      because one slow station constrains an entire production line. Those observations are more
      decision-useful than demo footage, but they do not provide fleet uptime, intervention frequency,
      mean time between failures, safety-event rates, or customer-level cycle times. S1's published
      results use internal benchmark suites, and the described evaluation used human intervention
      mainly to recover the VLA baseline. Kill criteria should therefore focus on audited production
      telemetry: repeated safety incidents, intervention rates that erase labor savings, or cycle time
      below contracted throughput after an agreed remediation window.
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
    tableRefs:
      - "TR002"
  - id: "partners-platform-and-integration"
    title: "Partner, platform, and integration dependencies"
    body: >-
      Skild AI depends on external infrastructure and counterparties even though its product thesis is
      hardware-agnostic. S1 is built on NVIDIA AI infrastructure, while the company's data strategy
      combines sources with different tradeoffs: teleoperation is close to deployment hardware but
      scales poorly, and egocentric video scales better but has a larger robot-domain gap. The Zebra
      Robotics Automation acquisition adds the Symmetry Fulfillment orchestration platform and creates
      an end-to-end warehouse proposition, but the available release does not disclose purchase price,
      transferred liabilities, customer retention, service obligations, or integration milestones.
      Public customer breadth also does not reveal revenue concentration: Skild AI reports more than
      60 paying customers, while independent reporting says customers were largely unnamed. Investment
      diligence should test compute portability, acquisition integration, renewal quality, and
      concentration rather than treating a broad customer count as proof of diversified economics.
    claimRefs:
      - "CR004"
      - "CR010"
      - "CR012"
      - "CR013"
    tableRefs:
      - "TR003"
  - id: "financial-model-and-thesis-breaks"
    title: "Financial-model risk and thesis-break triggers"
    body: >-
      The public financial signals are promising but not interchangeable. Skild AI says it crossed
      $100 million in annual recurring revenue and recognized $50 million of revenue during its first
      ten months of deployment; the latter is not ARR, and neither figure discloses gross margin,
      contract duration, collections, or concentration. A separate company-issued acquisition release
      described approximately $30 million of 2025 revenue. Independent reporting says the company
      raised $1.4 billion in January 2026 at a $14 billion valuation, but funding raised is not evidence
      of cash currently available. The valuation leaves execution sensitive to slower conversion,
      integration costs, or weak unit economics. Thesis-break triggers are failure to reconcile ARR to
      audited revenue, customer cohorts and cash receipts; runway below the investment plan once burn
      is verified; or material dependence on a small number of counterparties without contractual
      protection.
    claimRefs:
      - "CR003"
      - "CR005"
      - "CR014"
      - "CR015"
