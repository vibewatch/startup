callouts:
  - calloutType: "risk"
    title: "Do not equate deployment claims with reliability proof"
    body: "The company reports more than 60 paying customers, but the assigned evidence does not disclose fleet uptime, intervention rates, renewals, or customer concentration. Production telemetry and reference calls are required before customer breadth can reduce operational risk."
    claimRefs:
      - "CR004"
      - "CR006"
      - "CR007"
  - calloutType: "assumption"
    title: "Financial metrics require reconciliation"
    body: "The reported $100 million ARR, $50 million recognized revenue, $1.4 billion financing, and $14 billion valuation describe different measures. Diligence must reconcile contracts, accounting revenue, collections, cash, burn, and financing terms rather than using any one measure as a proxy for the others."
    claimRefs:
      - "CR003"
      - "CR005"
      - "CR015"
