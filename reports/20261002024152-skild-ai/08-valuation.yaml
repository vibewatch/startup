company:
  name: Skild AI
chapter:
  number: 8
  title: Valuation
  summary: >-
    Skild AI's January 2026 financing established a reported $14 billion post-money
    valuation, while the company now claims $100 million of ARR. That combination
    implies a 140x post-money valuation-to-ARR reference, but the absence of audited
    economics, usable comparable multiples, and a supportable exit-return model
    warrants a research-more recommendation at a stretched valuation.
sections:
  - id: recommendation-and-price
    title: Recommendation and price discipline
    body: >-
      The recommendation is research-more, with medium confidence, high risk, and a
      stretched valuation stance. Forge and Silicon Valley Investclub both place the
      January 2026 post-money valuation at roughly $14 billion, and the financing was
      reported at approximately $1.4 billion. Skild AI's September 2026 claim of $100
      million in ARR makes the simple post-money valuation-to-ARR reference 140x; this
      is neither an enterprise-value multiple nor an audited revenue multiple. The
      company separately described $50 million as recognized since deployment began,
      so funding, ARR, and recognized revenue must not be treated as interchangeable
      liquidity or accounting measures. Entry at the latest mark is not supported by
      the retained public evidence without audited revenue quality, margin, retention,
      burn, cash, and customer-concentration proof.
    claimRefs: [CV001, CV002, CV006, CV007, CV009, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-countercase
    title: Thesis, anti-thesis, and comparable context
    body: >-
      The thesis is that a hardware-agnostic robot foundation model can compound
      deployment data across embodiments, and Skild reports both technical progress
      and early commercial scale. Its S1 evaluation reports 66% success on unseen
      long-horizon tasks from one demonstration, while HPE describes dedicated private
      infrastructure for training and inference. The anti-thesis is evidence quality:
      those technical results are company-issued, the commercial metrics are unaudited,
      and an Exa directory remained materially stale after the latest financing.
      Retained market-data pages identify CoreWeave and LightOn only as broad public
      yardsticks and disclose no usable like-for-like revenue multiple. Competitor
      comparisons therefore do not provide an independent valuation benchmark, and
      the current financing mark is the only defensible price anchor.
    claimRefs: [CV011, CV012, CV013, CV014, CV016]
    tableRefs: [TV002]
  - id: scenarios-and-downside
    title: Scenario framing and downside triggers
    body: >-
      Scenario values are bounded by observed financing marks rather than invented
      multiples. A bull case can defend $14 billion or more only after the $100 million
      ARR claim is audited, customer references establish durability, and margins and
      retention support software-like economics. The base case lies somewhere between
      the May 2025 $4.7 billion Series B mark and the January 2026 $14 billion Series C
      mark, but public evidence cannot locate a fair value within that interval. The
      bear case falls to or below the prior mark if ARR proves services-heavy,
      concentrated, or non-recurring, or if regulatory deployment friction rises.
      These are decision bands and triggers, not probability-weighted fair-value
      estimates; no numerical probabilities are supportable from the retained sources.
    claimRefs: [CV001, CV003, CV006, CV008, CV009, CV010, CV015, CV016]
    tableRefs: [TV003]
  - id: terms-exit-and-diligence
    title: Financing terms, exit readiness, and diligence asks
    body: >-
      Forge's records indicate a 1.0x liquidation preference, a 6% non-cumulative
      dividend, and non-participating Series C economics, while Silicon Valley
      Investclub estimates roughly 10% dilution from the round; neither source is a
      complete fully diluted cap table. The retained evidence does not establish an
      IPO timetable, a credible strategic-acquirer set, or a supportable target return,
      hold period, or exit window. Before underwriting price, obtain audited revenue
      recognition and ARR schedules, gross margin by deployment, retention and
      concentration cohorts, burn and cash, the complete preference stack and option
      pool, customer reference calls, and jurisdiction-specific machinery compliance.
      Thesis-break triggers are failed revenue verification, weakening renewal quality,
      hidden preference seniority, or a deployment regime that materially slows
      commercialization.
    claimRefs: [CV004, CV005, CV008, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, research-more, "Do not underwrite the January 2026 mark until core economics are verified."]
      - [Confidence, medium, "Financing marks and company claims are current, but audited operating evidence is absent."]
      - [Risk rating, high, "Commercial quality, capital intensity, regulatory exposure, and exit liquidity remain unresolved."]
      - [Valuation stance, stretched, "The $14B post-money mark equals 140x the company-claimed $100M ARR reference."]
    notes: >-
      Assessments use the January 2026 financing mark and September 2026 company ARR
      claim; the 140x reference is post-money valuation divided by ARR, not EV/revenue.
    claimRefs: [CV001, CV006, CV009, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Argument, What would change the view]
    rows:
      - [Thesis, "S1 reports one-demonstration adaptation on unseen long-horizon tasks.", "Independent benchmark replication and production reliability data would strengthen the claim."]
      - [Thesis, "Company-reported $100M ARR and 60+ paying customers indicate rapid early commercialization.", "Audited ARR, named references, retention, and gross margin would establish revenue quality."]
      - [Anti-thesis, "Dedicated AI infrastructure and broad deployment integration may keep capital and service intensity high.", "Workload cost, deployment labor, and contribution-margin data could disprove this concern."]
      - [Anti-thesis, "No like-for-like independent revenue multiple supports the latest private financing mark.", "A relevant public or M&A comp set with matching revenue definitions could anchor price."]
    notes: >-
      Technical and commercial upside is company-claimed; HPE supplies partner proof
      of infrastructure, while comparable-multiple coverage remains incomplete.
    claimRefs: [CV006, CV008, CV011, CV012, CV013, CV016]
  - id: TV003
    title: Bull, base, and bear decision bands
    columns: [Case, Assumptions, Valuation or return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Audited $100M ARR; durable retention; healthy margins; referenceable customers; manageable compliance.", "$14B+ becomes defensible, but no upper range or target return is supportable publicly.", "Execution and multiple compression remain material.", "Requires multiple unverified milestones; currently low-support."]
      - [Base, "Commercial claims broadly hold, but services intensity and unit economics remain unclear.", "Use the observed $4.7B-to-$14B financing-mark interval; no fair-value point is supportable.", "Dilution, burn, concentration, and exit timing are unknown.", "Current evidence supports research-more rather than a numeric probability."]
      - [Bear, "ARR quality fails audit, renewals weaken, customers concentrate, or regulatory friction slows deployments.", "At or below the prior $4.7B mark is a downside anchor, not a fair-value estimate.", "Down-round, preference, liquidity, and commercialization risk compound.", "Any named trigger would move the case toward avoid."]
    notes: >-
      Bounds are observed May 2025 and January 2026 post-money financing marks, not
      comparable-derived valuations; probability percentages are omitted as unsupported.
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV008, CV009, CV010, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The latest financing mark is filtered through commercial proof, evidence quality,
      operating risk, and price discipline before reaching the recommendation.
    data:
      nodes:
        - id: financing
          label: "$14B financing anchor"
          detail: "January 2026 post-money valuation reported by two market-data sources."
        - id: commercial
          label: "$100M ARR claim"
          detail: "Company-issued September 2026 metric; $50M recognized revenue is a separate measure."
        - id: implied
          label: "140x valuation / ARR"
          detail: "Derived reference, not an enterprise-value or audited-revenue multiple."
        - id: proof
          label: "Evidence gap"
          detail: "No audited economics, complete cap table, or like-for-like comparable multiple."
        - id: risk
          label: "High residual risk"
          detail: "Commercial quality, infrastructure intensity, regulation, dilution, and liquidity remain open."
        - id: decision
          label: "Research more"
          detail: "Re-underwrite only after evidence closes or entry terms materially improve."
    approximationNotes: >-
      The 140x node is a direct arithmetic reference using reported post-money
      valuation and company-claimed ARR; it is not a fair-value estimate.
    claimRefs: [CV002, CV005, CV007, CV009, CV013, CV014, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Price-sensitive decision
    body: >-
      Treat $14 billion as a financing mark, not demonstrated fair value. Advance only
      after audited economics and cap-table diligence support the implied premium, or
      after entry terms reset materially toward the prior financing anchor.
    claimRefs: [CV001, CV003, CV004, CV009, CV016]
  - calloutType: risk
    title: Metric comparability warning
    body: >-
      The reported $30 million of 2025 revenue, $50 million recognized after deployment,
      and $100 million of September 2026 ARR have different periods and definitions;
      they do not establish a clean growth rate or cash runway.
    claimRefs: [CV006, CV007, CV010]
