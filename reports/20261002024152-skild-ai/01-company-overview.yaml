callouts:
  - calloutType: "risk"
    title: "Scale metrics need reconciliation"
    body: >-
      The same $100M milestone is described as annual revenue run rate by NVIDIA and ARR by
      Technical.ly. Diligence should obtain the underlying revenue bridge before using either
      label in valuation work.
    claimRefs: ["CO011", "CO012"]
  - calloutType: "insight"
    title: "Strategic investors do not prove commercial adoption"
    body: >-
      The financing syndicate includes industrial and technology names, but the public evidence
      does not establish which investors are customers, channel partners, or governance holders.
    claimRefs: ["CO007", "CO008"]
