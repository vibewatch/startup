company:
  name: "Skild AI"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Skild AI is a 2023-founded robotics-model company whose company-issued materials position the
    Skild Brain as a unified control layer across robot bodies and tasks. A $1.4 billion Series C
    at a valuation above $14 billion and partner-reported deployment growth establish scale, but
    revenue terminology, customer count, headcount, governance rights, and full capitalization
    remain insufficiently disclosed.
sections:
  - id: "identity-and-operating-footprint"
    title: "Identity, product, and operating footprint"
    body: >-
      Skild AI was founded in 2023 and an independent January 2026 profile placed its operations
      in Pittsburgh, the San Francisco Bay Area, and Bengaluru. The company describes the Skild
      Brain as one robotics foundation model intended to generalize across tasks and hardware
      forms, while its homepage presents lower-level mobile-manipulation skills such as grasping,
      handover, and navigation through an API. That supports a software/control-layer identity,
      but the assigned evidence does not disclose pricing, contract structure, or the split
      between software, services, and hardware-linked revenue. The operating footprint is
      therefore supportable; the detailed business model is not.
    claimRefs: ["CO001", "CO002", "CO003", "CO004"]
    tableRefs: ["TO001"]
  - id: "leadership-and-governance"
    title: "Founder leadership and governance visibility"
    body: >-
      Public reporting identifies Deepak Pathak as cofounder and CEO and Abhinav Gupta as
      cofounder and president. Their public comments span the technical thesis, model training,
      commercial testing, and deployment plans, indicating that the two founders remain central
      to both product direction and market communication. The same source set does not identify
      a board roster, independent directors, succession arrangements, executive bench, voting
      rights, or material leadership changes. This is evidence of concentrated visible
      leadership, not proof that broader governance infrastructure is absent; those records
      require direct diligence.
    claimRefs: ["CO005", "CO006"]
    tableRefs: ["TO002"]
  - id: "capitalization-and-stakeholders"
    title: "Capitalization and stakeholder concentration"
    body: >-
      On January 14, 2026, Skild AI announced a $1.4 billion Series C led by SoftBank and said the
      financing valued the company above $14 billion. Independent reporting repeated those
      figures, while Technical.ly later reported more than $2 billion raised in total. The latter
      is retained as a third-party total rather than reconstructed from unavailable round data.
      The round brought together financial sponsors, strategic technology investors, and
      potential enterprise-channel stakeholders, but participation alone does not establish
      board control, commercial commitments, or customer status. No assigned source resolves
      ownership percentages, liquidation preferences, secondaries, debt, or credit facilities.
    claimRefs: ["CO007", "CO008", "CO009"]
    tableRefs: ["TO003"]
  - id: "commercial-scale-and-milestones"
    title: "Commercial scale, milestone sequence, and evidence limits"
    body: >-
      The company said live revenue rose from zero to about $30 million within a few months in
      2025. By September 2026, NVIDIA described a $100 million annual revenue run rate ten months
      after first commercial deployment and more than 60 deployment partnerships; Technical.ly
      separately called the $100 million figure ARR. Those labels are not interchangeable, so
      this chapter preserves the conflict and does not convert either into audited revenue.
      NVIDIA also described S1's August launch and Skild's internal task results, while
      Technical.ly reported customer testing and a 2027 deployment target. The careers page
      displayed zero current openings at access, but that is neither headcount nor evidence of
      no hiring. No assigned source establishes the absence of legal, regulatory, outage, or
      other adverse events.
    claimRefs:
      ["CO010", "CO011", "CO012", "CO013", "CO014", "CO015", "CO016"]
    figureRefs: ["FO001"]
