chapter:
  number: 6
  title: "Customers"
  summary: "Skild AI reached $100M in annual recurring revenue across 60+ paying customers within ten months of its initial commercial deployment, led by high-margin manipulation workloads on NVIDIA and Foxconn assembly lines. However, public disclosures reveal no verified enterprise reference customers outside its investor and hardware OEM syndicate, while acquired AMR warehouse lines face integration and customer churn risks."
sections:
  - id: "customer-base-segmentation"
    title: "Enterprise and OEM Customer Segmentation"
    tableRefs:
      - "TU001"
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU008"
      - "CU011"
    body: "Skild AI segments its commercial revenue across two primary functional modalities: robotic manipulation and robotic mobility. According to disclosures from company leadership upon crossing the $100M annual recurring revenue threshold, manipulation tasks constitute approximately 90% of total revenue, while mobility applications account for the remaining 10%. Within mobility, autonomous mobile robot (AMR) orchestration solutions acquired from Zebra Technologies represent roughly 4% of total ARR, or approximately $4M. The company's customer base is structured primarily around high-value enterprise original equipment manufacturers (OEMs) and industrial conglomerates rather than fragmented end-user accounts. Target buyers consist of Vice Presidents of Manufacturing, Plant Automation Directors, and Supply Chain Executives across electronics manufacturing, automotive components, logistics fulfillment, and commercial food preparation. Skild AI delivers its foundation intelligence via software subscription agreements with terms varying across customer accounts, enabling enterprise customers to upgrade robot capabilities dynamically as foundation model iterations advance without requiring complete robotic hardware overhauls."
  - id: "deployment-trajectory-and-scale"
    title: "Commercial Trajectory and Revenue Run-Rate Acceleration"
    tableRefs:
      - "TU002"
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU010"
      - "CU011"
    body: "Skild AI's commercial adoption trajectory has expanded rapidly throughout 2025 and 2026, advancing from zero commercial revenue in early 2025 to approximately $30M in live revenue late in the year, and ultimately surpassing $100M in annual recurring revenue ten months after its initial commercial deployment. Over this same ten-month operating window, the company reported scaling from eight commercial customer accounts to more than 60 paying enterprise customers. In addition to the $100M recurring run-rate, the company recognized over $50M in cumulative revenue since beginning deployments. Operational footprints span facility inspections, point-to-point delivery, security, commercial kitchens, manufacturing facilities, and data centers. The rapid velocity of deployment is facilitated by the S1 foundation model's in-context learning architecture, which reports a 96% success rate on seen manipulation tasks and 66% on novel, unseen tasks from a single video demonstration, reducing deployment setup from weeks of specialized programming to rapid in-situ prompting."
  - id: "named-customer-deployments"
    title: "Named Customer Deployments and Strategic Integration"
    tableRefs:
      - "TU003"
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
    body: "Skild AI's public customer footprint is anchored by high-visibility deployments with major strategic partners and investors. On NVIDIA Blackwell GPU assembly lines operated in collaboration with Foxconn in Houston, Skild Brain powers dual-arm robotic manipulators executing high-precision tasks including busbar insertion, screw fastening, and component placement. In automotive manufacturing, the company is conducting advanced integration work with Sumitomo Wiring Systems to automate delicate wire harness assembly operations previously deemed intractable for mechanical automation. In commercial food service, Skild AI has deployed S1 in commercial kitchen pilots with Mitsui & Co., whose distribution operations supply 1.4 million meals daily across Japan. Furthermore, the company is collaborating with LG CNS to deploy foundation models across partner logistics facilities, citing Market Kurly as a key operational target. However, independent diligence highlights that nearly all publicly named customer references represent corporate shareholders or strategic go-to-market partners, leaving third-party commercial traction outside partner circles largely unverified."
  - id: "retention-durability-and-concentration-risks"
    title: "Retention Durability, Channel Dependence, and Concentration Risks"
    figureRefs:
      - "FU001"
    claimRefs:
      - "CU007"
      - "CU009"
      - "CU012"
      - "CU013"
      - "CU014"
    body: "Despite reporting top-line ARR acceleration, Skild AI exhibits notable customer concentration and durability vulnerabilities. The company relies heavily on indirect sales channels through legacy industrial robot manufacturers, notably ABB, Universal Robots, and Mobile Industrial Robots, rather than an extensive direct enterprise sales organization. This indirect go-to-market structure limits direct operational feedback from frontline factory floors and exposes Skild AI to partner channel friction. Furthermore, Skild AI has disclosed zero audited metrics regarding net revenue retention (NRR), gross retention (GRR), annual contract renewal rates, or cohort-level churn. Additional churn risk stems from the April 2026 acquisition of Zebra Technologies' robotics division: taking over an autonomous mobile robot business that Zebra had actively slated for downsizing in late 2025 threatens customer retention across inherited Fetch Robotics accounts. Internationally, pending European regulatory scrutiny under the Machinery Regulation in January 2027 introduces compliance barriers for self-evolving AI machinery, creating potential friction for European customer expansion."
