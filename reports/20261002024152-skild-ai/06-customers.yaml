callouts:
  - calloutType: "risk"
    title: "Reference Customer Opacity and Strategic Syndicate Concentration"
    body: "While Skild AI demonstrates legitimate production deployments with Foxconn, NVIDIA, and Sumitomo Wiring, all publicly disclosed customers are capital investors or strategic OEM partners. The absence of independent, arms-length enterprise customer references prevents third-party verification of standard software licensing willingness, pricing power, and organic enterprise demand."
    claimRefs:
      - "CU004"
      - "CU007"
  - calloutType: "insight"
    title: "Indirect OEM Channel Leverage vs. End-User Relationship Ownership"
    body: "By embedding the Skild Brain into existing fleets from ABB, Universal Robots, and Zebra Technologies, Skild AI bypasses traditional industrial procurement cycles and hardware manufacturing bottlenecks. However, this structure cedes primary customer relationship ownership to hardware OEMs and risks customer attrition if partners introduce competing foundation models."
    claimRefs:
      - "CU003"
      - "CU009"
      - "CU012"
