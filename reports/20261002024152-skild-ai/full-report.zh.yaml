  - id: TV003
    title: 乐观、基准与悲观决策区间
    columns:
      - 情景
      - 核心假设
      - 估值或回报逻辑
      - 核心风险
      - 概率信号
    rows:
      - - 乐观情景
        - 经审计的 $100M ARR；高留存韧性；健康毛利率；具备标杆效应的客户；合规风险可控。
        - $14B+ 估值具备合理支撑，但公开信息无法支撑给出估值上限或目标回报率。
        - 交付执行与估值倍数压缩仍是实质风险。
        - 依赖多项未经证实的里程碑；当前证据支撑度低。
      - - 基准情景
        - 商业化表述大体成立，但服务强度与单位经济模型仍不明朗。
        - 参考实际观察到的 $4.7B 至 $14B 融资估值区间；无法得出公允价值单点。
        - 股权稀释、烧钱速度、客户集中度及退出时机均属未知。
        - 当前证据更支持“继续研究”，而非给出具体概率数值。
      - - 悲观情景
        - ARR 质量未通过审计、续约走弱、客户过度集中，或监管阻力拖慢部署节奏。
        - 不高于前期 $4.7B 的估值标记仅作为下行下限锚点，并非公允价值估算。
        - 折价轮、清算优先权、流动性与商业化风险叠加放大。
        - 上述任一负面诱因触发，都将促使决策转向“回避”。
    notes: 区间上下限基于 2025 年 5 月及 2026 年 1 月观察到的投后融资估值标记，而非来自可比估值推算；因缺乏依据，未给出具体概率百分比。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
      - CV010
      - CV015
      - CV016
