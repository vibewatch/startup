      - number: '5.3'
        title: 训练数据飞轮、仿真架构与技术依赖
        blocks:
          - type: paragraph
            body: >-
              规模化获取可执行的物理数据是机器人基础模型研发的核心瓶颈 [CE002, CE007]。Skild AI
              依靠结合大规模合成物理仿真、互联网量级人类视频数据集以及针对性的真实世界机器人遥操作的多管齐下数据引擎，来解决这一数据稀缺问题 [CE002, CE007]。公司的算力与仿真技术栈高度依赖 NVIDIA AI
              基础设施，利用 Isaac Lab 运行可扩展的强化学习场景，并通过 Cosmos Transfer 借助文本提示在不同光照、纹理和相机参数下成倍扩增仿真数据集 [CE007,
              CE008]。这种仿真先行的流水线让跨多种形态的数千个虚拟机器人实例能够安全经历数百万次边缘失效工况，使机器人能在轮子卡死等物理干扰发生后 2 至 3 秒内恢复，或在机械肢体故障后通过上下文行为自适应继续作业
              [CE007, CE008]。为了补充合成物理数据，Skild AI
              深入挖掘互联网规模的视频库，将人类视为“生物机器人”来提取功能性操作示能（affordances）[CE007]。真实生产环境的落地则反哺到递归自进化飞轮（具身 RSI）中，在 60+
              家商业客户现场捕获的特定边缘任务案例被提炼蒸馏回通用基座模型，以持续提升其通用操作泛化能力 [CE006]。软件工程实现上，其运行时技术栈深度依赖工业级 C++ 与 Python
              模块，并与用于运动规划、感知、SLAM 及高层行为控制的 ROS/ROS2 机器人中间件生态深度整合 [CE010, CE011]。
            claimRefs:
