      - number: '8.2'
        title: 投资逻辑、反向逻辑与对标环境
        blocks:
          - type: paragraph
            body: >-
              正向投资逻辑在于：跨硬件形态解耦的机器人基础模型能够跨多种载体复利沉淀部署数据，且 Skild 在技术进展与早期商业化规模上均有所斩获。其 S1 评测显示仅凭一次演示在未见过的长序列任务上达到 66%
              的成功率，而 HPE 则披露了用于训练与推理的专用私有基础设施。反向逻辑则在于证据质量：上述技术评测成果均为公司自研自述，商业化指标未经第三方审计，且在最新一轮融资后 Exa
              上的企业档案依然严重滞后。现存的市场数据页面仅将 CoreWeave 和 LightOn
              作为宽泛的公开市场参照物，未披露任何具备可比性的同类收入估值倍数。因此，同业对比无法提供独立的估值锚点，最新一轮的融资估值是唯一具备证据支撑的参考价格。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV008
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.3'
        title: 情景测算与下行情景触发点
        blocks:
          - type: paragraph
            body: >-
              情景推演的估值边界由实际观察到的各轮融资估值锁定，而非凭空虚构的估值倍数。仅在公司宣称的 $100M ARR 通过审计、标杆客户建立起留存韧性、且利润率与留存表现支撑软件级经济模型之后，乐观情景（bull
              case）才能立足于 $14B 甚至更高的估值水平。基准情景（base case）介于 2025 年 5 月 B 轮的 $4.7B 估值与 2026 年 1 月 C 轮的 $14B
              估值之间，但公开证据无法在该区间内精确定位合理公允价值。悲观情景（bear case）在 ARR
              被证实重度依赖定制服务、客户高度集中或缺乏持续性，亦或监管准入摩擦加剧时，将跌至或低于前一轮估值。这些是决策区间与逻辑触发点，而非经概率加权的公允价值测算；现有审阅材料不支持给出任何量化的发生概率。
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV008
              - CV009
              - CV010
              - CV015
              - CV016
          - type: table
            tableRef: TV003
