      - number: '5.5'
        title: 图表与附录
        blocks:
          - type: callout
            title: 上下文视频提示突破后训练瓶颈
            body: >-
              传统的机器人基础模型类似于自然语言处理的 BERT 时代，针对每个新部署工作流，都需要采集数十至数百小时的遥操作后训练数据并进行定制化微调。Skild AI 的 S1
              表明，跨多种形态的大规模预训练能够实现单段视频演示下的直接上下文学习，在无需微调神经网络权重的情况下，达到相当于约 380 次后训练遥操作任务的性能水准。
            calloutType: insight
            claimRefs:
              - CE003
              - CE005
          - type: callout
            title: 生产环境中的吞吐量制约与节拍时间瓶颈
            body: >-
              尽管上下文学习在未见过的长序列操作任务上实现了 66%
              的累计成功率，但实际工业自主部署面临严苛节拍要求。在与人工工人或相邻自动化工位协同作业的流水线上，一台运行速度稍慢于产线节拍的机械操作臂就会成为全线吞吐量的瓶颈。也就是说，在替代固化硬编码自动化之前，快速任务自适应能力必须与大幅速度提升及可靠性蒸馏工程相结合。
            calloutType: risk
            claimRefs:
              - CE004
