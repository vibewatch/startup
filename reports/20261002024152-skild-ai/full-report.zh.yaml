      - number: '6.4'
        title: 客户留存韧性、渠道依赖与集中度风险
        blocks:
          - type: paragraph
            body: >-
              尽管公布了高速增长的 ARR 顶线数据，Skild AI 仍暴露出显著的客户集中度与留存韧性脆弱点。公司严重依赖传统工业机器人制造商（特别是 ABB、Universal Robots 和 Mobile
              Industrial Robots）的间接分销渠道，而非自建庞大的企业级直销团队。这种间接的市场切入架构限制了其直接获取一线车间的运营反馈，并使 Skild AI 面临渠道伙伴摩擦的风险。此外，Skild AI
              未披露任何经审计的净留存率（NRR）、总留存率（GRR）、年度合同续约率或队列流失率指标。另一重流失风险源于 2026 年 4 月对 Zebra Technologies 机器人业务部门的收购：接手一项
              Zebra 在 2025 年底就已计划缩减规模的自主移动机器人业务，直接威胁到其继承的 Fetch Robotics 存量客户留存。国际市场上，欧洲即将于 2027 年 1
              月实施《机械条例》监管审查，对具备自进化特性的 AI 机械设立了准入门槛，可能对其欧洲客户的扩张形成阻碍。
            claimRefs:
              - CU007
              - CU009
              - CU012
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
