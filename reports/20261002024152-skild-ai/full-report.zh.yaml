  - id: TV002
    title: 核心逻辑与反向逻辑
    columns:
      - 立场
      - 论点
      - 转变观点的触发条件
    rows:
      - - 投资逻辑
        - 据称 S1 在未见过的长周期任务上能实现单次演示自适应。
        - 独立的基准测试复现与实际生产可靠性数据将有力支撑该断言。
      - - 投资逻辑
        - 据公司披露 $100M ARR 与 60+ 家付费客户表明早期商业化进展迅速。
        - 经审计的 ARR、实名客户标杆、留存率与毛利率才能确立真实的收入质量。
      - - 反向逻辑
        - 专属 AI 基础设施与广泛的部署集成可能导致资本密集度与服务强度居高不下。
        - 工作负载成本、现场部署人力与边际贡献率数据有望证伪该担忧。
      - - 反向逻辑
        - 缺乏同口径的可比独立收入倍数支撑最新的一级市场融资估值。
        - 收入口径匹配的上市或并购可比标的池可为定价提供锚点。
    notes: 技术与商业化上行空间系公司自述；HPE 提供了基础设施层面的合作伙伴印证，而可比倍数数据仍不完整。
