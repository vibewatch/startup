            body: >-
              Skild AI 通过企业级软件授权与集成式自动化部署方案，将其通用机器人基础模型商业化。2026 年 9 月，公司披露其在 60 多家付费企业客户推动下，年经常性收入（ARR）运行率达到 $100M，相比
              2025 日历年约 $30M 的收入呈现陡峭的爬坡态势。商业落地涵盖工业机械操作、现场巡检、安防监控、食品制备、物流转运以及车间作业。收入结构高度偏向机器人操作类任务，占经常性收入的约
              90%；移动类及自主移动机器人（AMR）业务构成剩余的 10%，其中包含收购 Zebra Technologies 自动化业务所贡献的
