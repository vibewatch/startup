      - number: '2.4'
        title: 图表与附录
        blocks:
          - type: callout
            title: 机械操作构成高付费意愿的基础模型前沿
            body: >-
              尽管市场热点常聚焦于双足人形机器人与自主移动运输，但 Skild AI 的商业收入拆分表明，其 $100M ARR 中约 90% 源于机械操作任务。自主移动技术已高度大宗商品化，仅占收入的 10%（其中 4%
              归属于收购的 Zebra AMR）。真正的工业级实际支出，正流向此前难以实现自动化的高灵巧度复杂操作任务，如线束插接和电子元件组装。
            calloutType: insight
            claimRefs:
              - CM008
              - CM010
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与客户替代方案
        blocks:
          - type: paragraph
            body: >-
              相关的竞争格局远不止于同类的机器人基础模型初创公司。独立分析将 Covariant、Physical Intelligence 和 Genesis AI 归为横向同行，而 Alphabet 旗下的
              Intrinsic 和 NVIDIA 的 Isaac 则代表着兼具算力、生态和企业级渠道分发优势的平台型替代方案。另一股威胁来自 Figure、Tesla 和 Apptronik
              等垂直一体化开发商，其软硬件一体化部署能够沉淀自研运营数据，从而削弱对第三方智能层的需求。客户自研以及继续使用专机专用型自动化设备也是可行替代路径，但审阅的证据材料并未量化其成本或采纳份额。因此，下表呈现的是一份基于证据边界的代表性竞争格局，而非穷尽式的全市场普查。
            claimRefs:
