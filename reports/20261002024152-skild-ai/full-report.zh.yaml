      - number: '3.3'
        title: 商业规模、渠道分发与产品打包模式
        blocks:
          - type: paragraph
            body: >-
              Skild 称其在首次商业化部署 10 个月后 ARR 突破 $100M，服务超过 60 家付费客户。公司还披露约 90% 的收入来自机械操作，10% 来自移动任务，其中 4% 源于收购的 Zebra/Fetch
              Robotics AMR 解决方案。这些披露表明，落地准入、集成交付能力和收购带来的渠道网络正在转化为竞争壁垒，而非仅靠模型本身决定胜负。然而，TNW 报道称公司拒绝指名其报道中提及的客户。AI Business
              另外报道称其 2025 年收入为 $30M；这一历史会计周期收入与随后的 ARR 口径不可混淆。现有资料中没有任何来源提供可比的公开目录价、实际成交价、折扣力度、合同期限或竞争对手的产品打包方案。
            claimRefs:
