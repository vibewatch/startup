      - number: '5.4'
        title: 差异化优势、运行可靠性与技术局限性
        blocks:
          - type: paragraph
            body: >-
              Skild AI 的核心技术差异化在于真正的跨形态泛化能力与演示驱动的上下文自适应，这与依赖固定运动学标定或专有硬件锁定的传统机器人系统形成了鲜明对比 [CE001, CE002,
              CE007]。通过实现跨硬件形态的通用控制，Skild AI 使商业合作伙伴能够在单价 $4,000 至 $15,000 的标准化通用硬件上部署机器人智能，而传统专用工业机器人动辄需要 $250,000
              以上的硬件开销 [CE007]。在匹兹堡城市环境开展的实地运动测试中，Skild 的视觉驱动模型在非结构化地形、户外公园和消防逃生通道等完全没有预先建图的环境中，仅通过数小时的数据采集便达到了 60% 至 80%
              的任务达标率 [CE007]。尽管展现出这些优势，重大的技术与尽调风险依然存在 [CE012]。在高速制造节拍下，公司公开发布的经同行评审及独立审计的长序列持续作业精度与平均故障间隔时间（MTBF）基准仍十分有限
              [CE006, CE012]。此外，第三方行业分析指出，从概念验证（PoC）试点工位迈向关键工业装配线时，通用机器人模型面临着显著的物理 AI 数据瓶颈与未经验证的安全认证标准 [CE008,
              CE012]。软件工程师招聘信息显示公司仍在持续开发 SLAM、低延迟运动规划和硬件安全联锁系统，这凸显了其商业化扩张依然受到物理环境长尾不确定性以及对外部算力栈依赖的制约 [CE009, CE010,
              CE011]。
