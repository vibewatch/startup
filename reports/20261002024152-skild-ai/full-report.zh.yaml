          detail: 低频导航与操作策略，负责在复杂环境中解析空间动作可行性（affordances）并生成高层轨迹路标。
          tone: positive
        - label: Layer 3：实时底层电机控制
          detail: 高频关节力矩与角度动作策略，执行连续闭环驱动，并基于上下文动态自适应机器人机械构型。
          tone: positive
        - label: Layer 2：边缘中间件与系统运行时
          detail: 生产级 C++、Python 及 ROS/ROS2 低延迟运行环境，对接 NVIDIA 计算栈、SLAM 以及本地传感器数据流。
          tone: neutral
        - label: Layer 1：异构物理硬件本体
          detail: 通用机械本体平台（$4,000–$15,000），涵盖双足人形、四足仿生、双臂操作机械臂与工业移动底盘。
          tone: neutral
    approximationNotes: 架构分层反映了 Skild AI 技术披露中提及的高低频分层策略结构与数据飞轮引擎。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE006
      - CE007
      - CE010
      - CE011
  - id: FU001
    title: 客户全生命周期旅程图
    type: journey-map
    summary: 展示企业客户从 OEM 硬件集成、视频 Prompt 试点，到机队规模化部署与业务工序拓展的多阶段演进路径。
    approximationNotes: 推进阶段基于 Skild AI 的 S1 上下文部署工作流及 OEM 渠道合作体系建模梳理。
    claimRefs:
      - CU008
      - CU009
      - CU010
      - CU011
      - CU014
    data:
      items:
        - label: OEM 硬件接入
          stage: OEM 硬件接入
          touchpoints:
            - 集成 ABB、Universal Robots 或 Zebra AMR
            - 预装 Skild Brain 底层电机控制策略
          detail: 客户直接经由既有 OEM 代理商渠道采购适配 Skild 的机器人，无需自行定制硬件。
        - label: 工作流视频 Prompt
          stage: 工作流视频 Prompt
          touchpoints:
            - 录制人工操作员演示的单段任务视频
            - 免微调模型权重，通过上下文完成任务定义
          detail: 操作员录制 5-10 分钟演示视频作为 Prompt，引导 S1 模型掌握新的操作工作流。
        - label: 试点产线验证
          stage: 试点产线验证
          touchpoints:
            - 对标人工基准，开展针对性生产节拍测试
            - 安全边界核验与异常恢复测试
          detail: 初期部署 1-2 台机器人，验证任务准确率（已见任务达 96%）及工位生产节拍约束。
        - label: 商业化量产上线
          stage: 商业化量产上线
          touchpoints:
            - 生效年度软件订阅协议
            - 对接 Zebra Symmetry 履约编排系统协同作业
          detail: 全面接入工厂或仓库生产作业，能实时自适应零部件的细微形变与位置偏差。
        - label: 跨工位横向扩展
          stage: 跨工位横向扩展
          touchpoints:
            - 在相邻制造单元规模化部署多台机器人
            - 反哺递归自我改进（RSI）数据飞轮
          detail: 企业客户在更多工位及异地厂区扩大 Skild Brain 软件许可采购规模。
        - label: 监管合规与机队治理
          stage: 监管合规与机队治理
          touchpoints:
            - 针对自演化系统的欧盟《机械法规》合规审计
            - 年度合同续签与多年期商务承诺
          detail: 持续开展合规监测、安全认证复审，并向海外业务分支机构稳步拓展。
  - id: FR001
    title: 残留风险热力图
    type: matrix
    summary: 定性呈现关乎投资决策的核心风险，将有据可查诱因与未公开披露的缓解成熟度明确剥离。
    data:
      columns:
        - label: 发生概率
          detail: 基于所获公开证据，划分为已观察到、条件触发、结构性或未知。
        - label: 影响程度
          detail: 潜在的投资层级影响，非针对具体风险事件的发生概率预测。
        - label: 缓解成熟度
          detail: 具备公开证据支撑的成熟度；未披露不代表完全缺失。
        - label: 残留严重程度
          detail: 结合已有缓解证据后，分析师的综合研判结论。
      rows:
        - label: 欧盟符合性认证就绪度
          note: 仅当 Skild AI 落地属于监管覆盖范围的欧洲部署时才相关。
          values:
            - label: 条件触发
              tone: warning
            - label: 高
              tone: negative
            - label: 未予披露
              tone: warning
            - label: 若适用则为高
              tone: negative
        - label: 产线运行可靠性
          note: 公司承认实际部署强化攻关难度远超首次演示。
          values:
            - label: 已有印证的隐忧
              tone: warning
            - label: 高
              tone: negative
            - label: 推进中
              tone: warning
            - label: 高
              tone: negative
        - label: 生产节拍经济性
          note: 公开材料中缺乏客户层面的生产节拍分母数据。
          values:
            - label: 已有印证的隐忧
              tone: warning
            - label: 高
              tone: negative
            - label: 未披露
              tone: warning
            - label: 高
              tone: negative
        - label: Zebra 业务整合
          note: 收购条款与整合里程碑均未披露。
          values:
            - label: 结构性
              tone: warning
            - label: 高
              tone: negative
            - label: 未披露
              tone: warning
            - label: 高
              tone: negative
        - label: 客户集中度
          note: 客户数量见诸报道，但合同与 ARR 分布情况不对外公开。
          values:
            - label: Unknown
              tone: neutral
            - label: 高
              tone: negative
            - label: 未披露
              tone: warning
            - label: Unknown
              tone: neutral
        - label: 估值与融资
          note: 已融资金额不视作账面可用现金。
          values:
            - label: 取决于市场环境
              tone: warning
            - label: 高
              tone: negative
            - label: 大额轮次已交割
              tone: positive
            - label: 高
              tone: negative
    approximationNotes: 定性评级均为分析师基于所引披露信息及明确证据缺口做出的评估，并非实测概率、事故预测或公司官方给出的评级。
    claimRefs:
      - CR001
      - CR006
      - CR007
      - CR013
      - CR015
      - CR016
  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: 最新融资定价需依次经过商业化验证、证据质量、运营风险及价格纪律层层把关，最终落入投资建议。
    data:
      nodes:
        - id: financing
          label: $14B 融资基准
          detail: 两家市场数据来源报道的 2026 年 1 月投后估值。
        - id: commercial
          label: $100M ARR 官方宣称口径
          detail: 公司 2026 年 9 月发布的指标；$50M 已确认收入属于独立统计口径。
        - id: implied
          label: 140x 估值 / ARR
          detail: 测算参考倍数，并非企业价值或经审计收入倍数。
        - id: proof
          label: 证据缺口
          detail: 尚无经审计的财务数据、完整股权结构表或同口径可比倍数。
        - id: risk
          label: 高残余风险
          detail: 商业质量、基础设施投入强度、监管合规、股权稀释与流动性等问题仍未闭环。
        - id: decision
          label: 继续研究
          detail: 待证据缺口补齐或入场条款实质性改善后，再重新评估。
    approximationNotes: 140x 节点仅为采用报道投后估值与公司宣称 ARR 计算的直接算术参考，并非公允价值估算。
    claimRefs:
      - CV002
      - CV005
      - CV007
      - CV009
      - CV013
      - CV014
      - CV015
      - CV016
