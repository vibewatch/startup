  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、分类体系与结构性演变
        blocks:
          - type: paragraph
            body: >-
              Skild AI 的目标市场位于机器人自动化的横向具身物理智能层，区别于传统机器人硬件
              OEM、专机专用型工业机器人工作站以及纯数字多模态语言模型。历史上，机器人自动化需要针对每种机械几何结构和作业任务进行定制硬件工程、手工设计控制策略以及专用编程。Skild AI
              将其市场界定为通用机器人基础模型，作为操作系统或软件智能层，能够控制包括四足机器人、移动操作臂、人形系统和桌面机械臂在内的多种构型。其可获取的软件支出涵盖机器人操作系统授权、基础模型 API
              调用以及垂直场景编排模块。不计入 Skild AI 直接模型收入的支出包括机械硬件裸机、结构铸件和标准执行器制造。现有的替代方案包括固定功能机器人自动化、仓储和制造工位的传统人工作业，以及单一形态硬件 OEM
              自研的垂直一体化自主系统。通过收购 Zebra Technologies 的机器人自动化业务，Skild AI 整合了成熟的自主移动机器人（AMR）编排能力，从而直接切入存量物流与仓储履约作业场景。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
      - number: '2.2'
        title: 市场规模测算视角、增长驱动力与近期现实
        blocks:
          - type: paragraph
            body: >-
              评估通用具身物理 AI 目标市场，需要将长期宏观劳动力预测与具体实际部署数据进行对比。支撑宏观逻辑的驱动因素主要源于结构性劳动力短缺，例如预测到 2030 年美国将有 2.1 million
              个制造业岗位面临空缺，对经济产出的潜在影响超过 $1 trillion。长期分析师预测全球人形机器人市场到 2035 年将达 $38 billion，部分偏远期的推演甚至认为 2050 年将达 $5
              trillion。然而，近期的出货量数据揭示了物理部署仍处早期：2025 年全球人形机器人出货量仅约 13,300 台，预计到 2030 年达到 250,000 台。因此，Skild AI
              的近期可服务市场主要集中在非人形工业形态上，特别是移动操作臂、四足安防巡检以及仓储物料搬运。商业化收入在 2025 年迅速从零增长至约 $30M；公司公告称，截至 2026 年 9 月，其年经常性收入在 60+
              家企业客户推动下突破 $100M。在这一已确认收入结构中，机械操作类任务贡献了约 90%，而移动类解决方案占 10%（其中 4% 来自收购的 AMR
              业务）。这种结构表明，客户目前的付费意愿主要由高灵巧度操作瓶颈驱动，而非单纯的轮式移动导航。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
      - number: '2.3'
        title: 客户画像分层、采购路径与落地阻力
        blocks:
          - type: paragraph
            body: >-
              具身物理基础模型的采用涵盖三类主要客户画像：机器人硬件 OEM、工业企业运营商以及自动化系统集成商。机器人制造商借助 Skild Brain 授权，省去长达数年的内部 AI 研发周期，将大额资本开支转化为云端
              API 授权与边缘侧运行费用。制造、物流和关键基础设施领域的企业采购方，重点依据节拍时间对齐度、工位吞吐量以及故障自恢复能力来评估部署，而非被动查看基准评测展示。在 Foxconn Blackwell
              服务器组装、Sumitomo Wiring Systems 以及 Mitsui
              商用厨房试点中的商业落地表明，工业客户的核心买单逻辑集中在劳动力供给保障与产线换模速度。然而，多项关键约束制约着落地节奏。产线部署要求机器人具备与产线工人对齐的节拍时间，一台虽然精度极高但速度仅有人工十分之一的机器人无法投入实际生产。此外，具身基础模型还面临迫在眉睫的合规门槛：欧盟《机械条例》将于
              2027 年 1 月 20 日生效，对具备自进化或超出预设分布作业特性的机械强制要求第三方公告机构评估。硬件集成摩擦、仿真到真实世界的物理差距，以及设备损坏的财产责任归属，依然是持续存在的落地瓶颈。
            claimRefs:
