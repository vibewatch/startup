      - number: '6.3'
        title: 已披露客户落地与战略协同整合
        blocks:
          - type: paragraph
            body: >-
              Skild AI 已公开的客户落地主要锚定在与核心战略伙伴及投资方的高光合作上。在与 Foxconn 合作、位于休斯敦的 NVIDIA Blackwell GPU 组装产线上，Skild Brain
              驱动双臂机器人操作工位执行高精度作业，包括母线排（busbar）插接、螺丝锁付和元件安放。在汽车制造领域，公司正与 Sumitomo Wiring Systems
              开展深度集成，以实现此前被认为机械自动化难以攻克的精密汽车线束组装。在商用餐饮配餐场景，Skild AI 在 Mitsui & Co. 的商用厨房试点中部署了 S1，后者在日本每日供应 140
              万份餐食。此外，公司正与 LG CNS 合作，在其合作物流设施中部署基础模型，并将 Market Kurly
              列为重点落地标杆。然而，独立尽调指出，几乎所有公开点名的标杆客户均为其企业股东或战略商业化合作伙伴，在合作方圈子之外的独立第三方商业化渗透在很大程度上未经证实。
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
