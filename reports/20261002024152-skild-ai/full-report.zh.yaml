      - number: '3.2'
        title: 能力定位与技术差异化
        blocks:
          - type: paragraph
            body: >-
              Skild 的核心差异化主张在于对多种机器人构型的广泛兼容性与快速任务适应能力。公司宣称其单一模型大脑可通用于四足机器人、人形机器人、桌面机械臂和移动操作臂，并表示 S1
              无需针对特定任务进行微调，仅凭一段视频即可执行全新任务。其内部对比测试显示，在 100,000 小时预训练数据下，S1 在未见过的长序列任务上平均每步累计成功率达 66%，而基于语言提示的 VLA 基线模型仅为
              9%。这些结果展现了公司所追求的护城河构想，但并非独立第三方验证：基准集、任务组、评分干预以及模型对比测试均由公司自行发布。硬件兼容面广虽可降低初始集成摩擦，但专有通信协议与碎片化硬件在实际部署中仍会重新引发集成成本与厂商锁定风险。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
