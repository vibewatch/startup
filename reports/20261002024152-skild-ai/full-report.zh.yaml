      - number: '5.2'
        title: S1 架构、上下文学习与预训练流水线
        blocks:
          - type: paragraph
            body: >-
              Skild AI 机械操作能力的技术核心是 S1，这是一款从底层彻底按机器人上下文学习器架构打造的旗舰基础模型
              [CE003]。与传统的视觉-语言-动作（VLA）模型不同（后者在每个新部署环境下都需要采集数十至数百小时的后训练演示数据并微调模型权重），S1 完全凭视觉视频提示适应未见过的任务，全程无需修改神经网络权重
              [CE003]。在该范式下，用户只需提供一段第一人称视角的视觉演示视频来指定目标任务；S1 便能在其上下文窗口内解析该演示提示，推断演示者的意图，解算不同形态视点间的空间映射关系，并将提示转化为自主运动控制指令
              [CE003]。公司的内部受控基准评测报告显示，在跨越 4 至 8 分钟、涵盖数十种操作原语的未见过长序列任务上，将预训练数据规模扩展至 100,000 小时后，S1 实现了 66%
              的单步累计成功率，而基于语言提示的 VLA 基线模型仅为 9%，在分布外操作场景中展现出 7x 的性能优势 [CE004]。Skild AI 估计，一段置于上下文中的视频演示所达成的任务性能，相当于约 380
              次后训练遥操作演示，从而为每个新任务省去了估计 50 至 100 小时的人工遥操作采集开销
              [CE005]。尽管如此，实际产线部署仍需兼顾精度与执行节拍时间以防止产线拥堵，这仍需持续进行模型蒸馏与针对特定硬件的延迟优化 [CE006]。
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
