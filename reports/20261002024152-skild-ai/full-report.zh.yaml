      - number: '8.4'
        title: 融资条款、退出成熟度与尽调要点
        blocks:
          - type: paragraph
            body: >-
              Forge 的记录显示 1.0x 清算优先权、6% 非累积股息及非参与型 Series C 经济条款；Silicon Valley Investclub 则估计本轮稀释比例约为
              10%。两处来源均非完整的完全稀释后股权结构表。现有留存证据无法证实 IPO 时间表、可信的战略收购方阵列，或有数据支撑的目标回报率、持有期与退出窗口。在对入场价格下投资判断前，须获取经审计的收入确认与 ARR
              明细表、分部署场景的毛利率、留存与集中度队列、烧钱速度与现金储备、完整的优先股堆叠与期权池、客户背调访谈，以及各司法管辖区的机械设备合规认证。投资逻辑破裂的触发条件包括：收入核验未获通过、续约质量恶化、存在隐性清算优先权层级，或部署监管要求显著拖慢商业化进程。
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV015
              - CV016
      - number: '8.5'
        title: 附录图表
        blocks:
          - type: callout
            title: 价格敏感型决策
            body: 须将 $14B 视作融资定价，而非经证实的公允价值。仅当经审计的财务数据与股权结构表尽调足以支撑该估值溢价，或入场条款大幅回调至上一轮融资锚点时，方可推进。
