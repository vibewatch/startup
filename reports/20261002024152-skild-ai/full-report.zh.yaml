      - number: '6.5'
        title: 图表与附录
        blocks:
          - type: callout
            title: 标杆客户不透明与战略投资圈内集中
            body: >-
              尽管 Skild AI 在 Foxconn、NVIDIA 和 Sumitomo Wiring 展示了真实的生产部署，但目前公开披露的所有客户均为其资本投资方或战略 OEM
              伙伴。缺乏独立的、无关联的企业级标杆客户背书，使得第三方无法验证其标准软件授权的付费意愿、定价权以及真实自发的企业级市场需求。
            calloutType: risk
            claimRefs:
              - CU004
              - CU007
          - type: callout
            title: 间接 OEM 渠道杠杆 vs 终端客户关系掌控力
            body: >-
              通过将 Skild Brain 嵌入 ABB、Universal Robots 和 Zebra Technologies 的现有设备网络，Skild AI
              绕开了传统工业采购的长周期与硬件制造瓶颈。然而，这种模式将最核心的客户关系掌控权拱手让给了硬件 OEM，一旦合作伙伴推出同类竞争的基础模型，将面临客户流失的风险。
            calloutType: insight
            claimRefs:
              - CU003
              - CU009
              - CU012
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与安全风险敞口
        blocks:
          - type: paragraph
            body: >-
              目前查明最清晰的监管问题来自欧洲《机械条例》。据 The Next Web 报道，该条例将于 2027 年 1 月 20 日起覆盖基于 AI
              的安全功能及具备自进化特性的机械，且要求由公告机构介入评估，而不能仅由制造商单方声明。这一条例对 Skild AI
              的适用性取决于具体情况：报道称公司尚未披露是否向欧洲市场销售。审阅的现有证据中未包含任何监管备案文件、合规方案、安全认证、诉讼检索记录、事故登记簿、隐私评估、出口管制分类或保险披露。因此，投资层面的含义并非证实其违规，而是表明其合规就绪度存在明显缺口。在将欧洲市场扩张或安全关键型部署计入投资判断前，尽调应核实目标司法管辖区、法人责任主体、适用技术标准、独立第三方测试、事故报告机制以及产品责任风险在合同中的划分机制。
            claimRefs:
              - CR001
              - CR002
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR013
          - type: figure
