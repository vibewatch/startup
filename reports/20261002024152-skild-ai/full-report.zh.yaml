              $100M。在这一同样的 10 个月运营窗口期内，公司称其商业客户数从 8 家扩展至 60 多家付费企业客户。除 $100M 的经常性运行率外，公司自启动部署以来累计确认收入已超过
              $50M。实际业务场景覆盖设施巡检、点对点配送、安防巡逻、商用厨房、制造车间和数据中心。这种极高的交付部署效率得益于 S1 基础模型的上下文学习架构；据称该模型在已知操作任务上的成功率达
              96%，在仅凭单段视频演示的全新未见任务上成功率达 66%，将原本耗时数周的专用编程交付缩短为现场即时提示词引导。
            claimRefs:
              - CU001
              - CU002
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
