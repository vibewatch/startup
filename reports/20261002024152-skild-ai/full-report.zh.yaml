  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与全形态通用运行机制
        blocks:
          - type: paragraph
            body: >-
              Skild AI 将其核心产品定义为通用物理人工智能，旨在将机器人的软件智能能力与固定的机械构型完全解耦 [CE001]。公司并未针对特定机械臂或专有移动底盘构建狭隘的行为控制策略，而是开发了 Skild
              Brain——一种专为控制异构机器人形态而设计的以动作为中心的基础模型 [CE001, CE002]。其核心运行机制依靠两级分层策略组织执行
              [CE002]：低频的高层导航与操作策略负责理解任务目标与环境状态，并生成空间动作规划 [CE002]；随后，该高层指令序列被输入到高频的底层动作策略中，直接输出控制物理机器人硬件的关节角度与电机扭矩
              [CE002]。将硬件控制抽象进统一的策略架构后，Skild AI 使从四足机器人、双足人形机器人到桌面机械臂和工业移动底盘的各类机器人平台，均能在同一模型底座上运行 [CE001,
              CE002]。此外，据公司披露，在首次商业化部署 10 个月后年经常性收入已突破 $100M，其中机械操作类应用约占总收入的 90%，移动解决方案占 10%
              [CE006]。商业落地已延伸至多种工业作业流中，包括与 Foxconn 合作开展的 NVIDIA Blackwell 系统双臂组装、与 Sumitomo Wiring Systems
              合作的线束制造自动化，以及与 Mitsui & Co. 合作开展的商用厨房食品加工试点 [CE006]。
            claimRefs:
              - CE001
              - CE002
              - CE006
