      - number: '7.4'
        title: 财务模型风险与投资逻辑证伪触发点
        blocks:
          - type: paragraph
            body: >-
              公开的财务数据看似向好，但各项口径绝不可混为一谈。Skild AI 称其年经常性收入突破 $100M，并在部署的前 10 个月内确认了 $50M 收入；后者并非
              ARR，且两项数据均未披露毛利率、合同期限、回款情况或客户集中度。公司发布的一份收购通告中另外提及 2025 年收入约为 $30M。独立报道称公司于 2026 年 1 月以 $14B 估值完成 $1.4B
              融资，但累计融资额并不能作为当前实际账面可用现金的证明。这一高估值使得公司的实际执行对转化放缓、并购整合开销或单机经济模型疲软极为敏感。投资逻辑证伪的触发条件包括：无法将 ARR
              与经审计的财务收入、客户留存队列及现金回款相对齐；核实实际烧钱率（burn）后现金跑道短于投资规划；或在缺乏合同保护的情况下对少数合作方产生重大依赖。
            claimRefs:
              - CR003
              - CR005
              - CR014
              - CR015
      - number: '7.5'
        title: 图表与附录
        blocks:
          - type: callout
            title: 切勿将落地宣称等同于可靠性验证
            body: 公司宣称拥有 60 多家付费客户，但审阅的证据材料并未披露机队正常运行时间、人工干预率、续约表现或客户集中度。在将广泛的客户数量视为已化解运营风险之前，必须获取实际生产现场的遥测数据并开展客户尽调访谈。
            calloutType: risk
            claimRefs:
              - CR004
              - CR006
              - CR007
          - type: callout
            title: 财务指标亟待勾稽对齐
            body: >-
              据报道的 $100M ARR、$50M 确认收入、$1.4B 融资金额与 $14B
              估值代表着截然不同的统计口径。尽调必须对销售合同、会计收入、现金回款、账面资金、烧钱率以及融资条款进行逐一勾稽，而不能将任何单一指标作为推算其他数据的替代指标。
            calloutType: assumption
            claimRefs:
              - CR003
              - CR005
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与估值纪律
        blocks:
          - type: paragraph
            body: >-
              投资建议为继续研究（research-more），置信度中等，风险评级高，估值判断为偏高（stretched）。Forge 和 Silicon Valley Investclub 均将 2026 年 1
              月的投后估值定在大约 $14B，融资金额据报道约为 $1.4B。根据 Skild AI 2026 年 9 月宣称的 $100M ARR 计算，简化的投后估值对应 ARR 倍数为
              140x；这既非企业价值（EV）倍数，亦非经审计的会计收入倍数。公司另外说明自部署启动以来已确认 $50M 收入，因此融资额、ARR
              和已确认收入绝不能被混淆为等同的流动性或财务核算口径。在缺乏关于收入质量、利润率、客户留存、现金消耗率、实际账面资金及客户集中度经审计证据的情况下，现有公开资料无法支撑在最新估值水平上入场。
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV009
              - CV016
