      - number: '7.2'
        title: 运行可靠性、质量控制与安全防护
        blocks:
          - type: paragraph
            body: >-
              Skild AI 自身也坦言，机器人落地的难点在于最后的可靠性裕量：其抓鸡蛋任务仅用一周就成功实现了一次，但要让其在不同鸡蛋和台架设置下稳定可靠运行，又额外花费了两个月。公司还指出，一台准确率达到 99.9%
              但速度慢了十倍的机器人根本无法部署，因为一个迟缓的工位就会拖慢整条生产线。这些观察结论比演示视频更具决策参考价值，但它们并未提供机队正常运行时间、人工干预频率、平均故障间隔时间（MTBF）、安全事件发生率或客户现场实际节拍时间。S1
              公开发布的测试结果均采用内部基准测试集，且所述评测中的人工干预主要用于帮助 VLA 基线模型恢复。因此，尽调的否决标准（kill
              criteria）应重点关注经审计的生产现场遥测数据：是否频繁出现安全事故、干预率是否抵消了节省的人工成本，或在约定的整改期后节拍时间仍无法达到合同约定的吞吐量。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR016
      - number: '7.3'
        title: 合作伙伴、底层平台与系统集成依赖
        blocks:
          - type: paragraph
            body: >-
              尽管 Skild AI 的产品定位是跨硬件形态解耦，但其依然深度依赖外部基础设施与合作方。S1 基于 NVIDIA AI
              基础设施构建，而公司的数据策略组合了存在不同权衡的多样数据源：遥操作数据贴近实际部署硬件但极难规模化，第一人称视频更易规模化但存在较大的跨域鸿沟。收购 Zebra Robotics Automation 带来了
              Symmetry Fulfillment
              履约编排平台，并构建起端到端的仓储解决方案，但公开通告并未披露收购价格、承接的债务负债、客户留存率、后续维保义务或整合里程碑。公开宣称的客户规模也未能反映收入集中度：Skild AI 称其拥有 60
              多家付费客户，但独立报道指出绝大多数客户未予指名。投资尽调应测试算力迁移能力、并购整合效果、续约质量与客户集中度，而不能将庞大的客户数量直接等同于收入结构健康分散的证明。
            claimRefs:
              - CR004
              - CR010
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR010
              - CR011
