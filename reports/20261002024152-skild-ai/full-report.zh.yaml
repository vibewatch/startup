            body: Skild 最核心的主张在于无需更新模型权重，仅凭单段视频即可定义未见过的全新任务，这有望大幅减少重复的数据采集与特定任务微调。但目前保留的性能证据均为公司自行发布，仍需独立且通用的任务基准予以验证。
