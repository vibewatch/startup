      - number: '3.4'
        title: 护城河持久性与被替代风险
        blocks:
          - type: paragraph
            body: >-
              其护城河取决于跨形态具身学习与部署数据的迭代速度，能否超越一体化竞争对手的自有设备网络以及科技巨头的平台生态。Skild
              披露的融资规模提供了充裕的资金底气，但资本体量并不代表具备基准性能领先优势、定价权或较低的切换成本。独立分析明确警告，垂直一体化厂商可能会挤压横向软件供应商的目标市场空间，而硬件碎片化也会限制跨设备的迁移效率。合规信任同样至关重要：TNW
              报道称，自 2027 年 1 月 20 日起，欧洲《机械条例》将覆盖基于 AI
              的安全功能及具备自进化能力的机械，并强制要求由公告机构介入评估。查阅的招聘页面未能明确其当前人员招聘规模，因此相较于大平台，其组织承载力仍有待验证。投资结论是：具备显著的技术差异化，但面临重大的实质性证据风险，尚无法证明其具备持久的垄断优势。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP012
