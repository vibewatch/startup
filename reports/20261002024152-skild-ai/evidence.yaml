evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Board roster, independent directors, voting rights, succession plan, executive bench, and leadership-change
      history.
    whyItMatters: Founder concentration and investor rights cannot be assessed from public titles or financing participation.
    diligencePath: >-
      Request the current organization chart, board minutes and observer list, voting agreement, and founder succession
      plan.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: capitalization
    missingEvidence: >-
      Round-by-round capitalization, ownership percentages, preferences, secondaries, debt, credit facilities, and cash
      balance.
    whyItMatters: >-
      Funding raised is not cash available, and headline valuation does not reveal dilution, seniority, or financing
      obligations.
    diligencePath: >-
      Obtain the fully diluted cap table, financing documents, debt schedule, secondary-sale ledger, and current cash
      reconciliation.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-metrics
    missingEvidence: >-
      Audited revenue, an ARR definition and bridge, customer count, signed contract values, retention, gross margin,
      burn, and employee headcount.
    whyItMatters: >-
      Run-rate labels, partnerships, and open-role counts cannot establish recognized revenue quality, customer scale,
      or operating capacity.
    diligencePath: >-
      Request audited statements, monthly recurring-revenue cohorts, customer and contract schedules, payroll roster,
      and board-approved operating plan.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Authoritative legal, regulatory, outage, safety, recall, sanctions, and complaint records tied to Skild AI
      deployments.
    whyItMatters: No result in the assigned adverse query is not evidence that incidents or obligations do not exist.
    diligencePath: >-
      Run jurisdiction-specific court, regulator, safety, sanctions, insurance-claim, and customer-reference checks
      during full diligence.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: regulatory-compliance
    missingEvidence: >-
      Direct EU notified body filings or official compliance statements regarding how Skild AI's in-context learning
      models meet EU Machinery Regulation (2023/1230) requirements.
    whyItMatters: >-
      Self-evolving and adaptive models that perform unseen physical actions without post-training safety fences may
      face regulatory deployment restrictions in European jurisdictions.
    diligencePath: >-
      Review technical conformity documentation with European machine safety notified bodies and cross-reference Skild
      AI's EU sales distribution declarations.
    relatedQuestionRefs:
      - QM007
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: >-
      Audited financial statements, gross margin figures, customer churn data, and contract billing structures for the
      reported $100M ARR.
    whyItMatters: >-
      Rapid ARR expansion from $30M in 2025 to $100M in late 2026 relies on self-reported management announcements,
      making cash collection and customer retention diligence essential.
    diligencePath: >-
      Request audited revenue recognition schedules, billing terms, and customer cohort expansion data during
      confirmatory diligence.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable list and realized prices, billing units, contract duration, included integration and support, inference
      charges, discounting, and renewal terms for Skild and named competitors.
    whyItMatters: >-
      Without comparable total-cost evidence, differentiation cannot be translated into buyer ROI, pricing power,
      switching cost, or margin durability.
    diligencePath: >-
      Request representative customer contracts and quotes, then normalize software, hardware, integration, support, and
      compute costs by deployed robot and task.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: benchmarks
    missingEvidence: >-
      Independent common-task evaluations comparing Skild with direct foundation-model, platform, integrated, and
      internal-build alternatives under matched hardware, task-horizon, intervention, data, and compute conditions.
    whyItMatters: >-
      Company-issued S1 results cannot establish relative performance or moat durability when competitor systems were
      not tested under the same protocol.
    diligencePath: >-
      Commission a third-party bake-off with preregistered tasks, denominators, failure recovery rules, cycle-time
      limits, and full unsuccessful-run disclosure.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
  - type: enumeration-incomplete
    severity: minor
    topic: competition
    missingEvidence: >-
      Direct official product, pricing, deployment, security, integration, and roadmap sources for each named competitor
      and a quantified internal-build or status-quo baseline.
    whyItMatters: >-
      The current landscape is representative and relies heavily on one analyst comparison, so company-specific
      differences and likely entrants may be omitted.
    diligencePath: >-
      Build a competitor-class search plan and retain one current official source plus one independent customer,
      procurement, benchmark, or filing source per material option.
    relatedTableRefs:
      - TP001
      - TP002
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: >-
      Audited financial statements confirming net revenue, gross margin percentage, cash operating burn rate, and
      balance sheet cash reserves.
    whyItMatters: >-
      Without audited figures, underwriting must rely entirely on management claims of $100M ARR and $50M recognized
      revenue, leaving net cash generation unverified.
    diligencePath: Obtain audited 2025 financial statements and quarterly 2026 management reports during management diligence access.
    relatedQuestionRefs:
      - QI009
  - type: missing-source
    severity: material
    topic: independent-benchmarks
    missingEvidence: >-
      Third-party audited MTBF benchmarks, standardized industrial manipulation success rates, and continuous run logs
      in real-world customer production environments.
    whyItMatters: >-
      Reported 66% cumulative success rate on unseen tasks and single-demo video adaptation are evaluated internally on
      company testbeds; production line readiness requires independent verification.
    diligencePath: >-
      Request customer deployment telemetry, line yield impact studies, and cycle time distribution logs from partner
      production pilots.
    relatedQuestionRefs:
      - QE004
      - QE008
    relatedTableRefs:
      - TE001
      - TE002
  - type: private-evidence-only
    severity: material
    topic: simulation-to-real-fidelity
    missingEvidence: >-
      Quantitative data on domain gap loss when transferring Cosmos Transfer and Isaac Lab synthetic policies to diverse
      customer-owned physical hardware.
    whyItMatters: >-
      Synthetic data generation via NVIDIA frameworks powers the foundation models, but real-world hardware variance and
      sensor noise can cause unpredictable actuation errors.
    diligencePath: >-
      Review internal sim-to-real benchmark discrepancy reports and hardware qualification requirements across partner
      deployments.
    relatedQuestionRefs:
      - QE005
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: retention-and-churn-metrics
    missingEvidence: >-
      Audited net revenue retention (NRR), gross revenue retention (GRR), annual renewal rates, and cohort retention
      curves.
    whyItMatters: >-
      Without retention disclosures, it is impossible to evaluate whether the $100M ARR milestone represents durable
      recurring software contracts or front-loaded implementation and hardware-bundle billings.
    diligencePath: >-
      Request customer cohort renewal schedules, contract duration distributions, and churn logs under confidentiality
      agreement.
    relatedQuestionRefs:
      - QU005
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: material
    topic: independent-named-customer-references
    missingEvidence: >-
      Direct, independently verifiable enterprise reference accounts operating outside the investor and hardware partner
      syndicate (Foxconn, NVIDIA, LG, Samsung, Mitsui, Sumitomo).
    whyItMatters: >-
      Reliance on strategic investors and hardware OEMs for customer proof masks whether pure-play commercial
      enterprises find standard pricing and ROI compelling.
    diligencePath: >-
      Conduct blind customer reference calls with end-user facility operators at ODW Logistics and Market Kurly
      deployments.
    relatedQuestionRefs:
      - QU004
      - QU005
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: legal-regulatory-record
    missingEvidence: >-
      Primary regulator, court, certification, safety-incident, cybersecurity-incident, privacy, IP, and export-control
      records applicable to Skild AI.
    whyItMatters: >-
      The assigned pool cannot establish compliance, incident absence, litigation status, or the legal scope of planned
      deployments.
    diligencePath: >-
      Run jurisdiction-specific regulator and court searches, then obtain management's compliance register,
      certifications, legal letters, and incident history.
    relatedQuestionRefs:
      - QR001
      - QR003
    relatedTableRefs:
      - TR001
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      A complete jurisdiction-by-jurisdiction register of licenses, standards, certifications, cases, and enforcement
      exposure.
    whyItMatters: TR001 is a partial public-evidence sample and cannot establish the full legal perimeter for physical deployments.
    diligencePath: >-
      Map every current and planned deployment jurisdiction and have counsel identify required approvals, testing,
      notices, and contractual protections.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: production-reliability
    missingEvidence: >-
      Customer-level uptime, intervention frequency, mean time between failures, safety events, cycle time, and recovery
      performance.
    whyItMatters: >-
      Internal task benchmarks and selected demonstrations do not establish safe, economic performance over sustained
      production shifts.
    diligencePath: Review raw fleet telemetry, incident logs, SLA reports, failed deployments, and customer references under NDA.
    relatedQuestionRefs:
      - QR002
      - QR007
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: concentration-and-contracts
    missingEvidence: >-
      Customer-level ARR, renewals, churn, contract duration, implementation status, partner terms, and top-customer
      concentration.
    whyItMatters: >-
      A count of paying customers does not show revenue durability, production depth, or dependence on a small number of
      deployments.
    diligencePath: >-
      Inspect the contract and renewal cohort schedule, top-20 customer ARR, pipeline conversion, cancellations, and
      partner termination rights.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: financial-model
    missingEvidence: >-
      Audited revenue recognition, ARR reconciliation, gross margin, cash collections, cash balance, burn, runway, debt,
      and financing preferences.
    whyItMatters: >-
      ARR, recognized revenue, financing raised, and valuation are different measures and cannot establish liquidity or
      unit economics.
    diligencePath: >-
      Reconcile customer contracts to ARR and GAAP revenue, then review audited financials, bank statements, burn
      forecast, cap table, and financing documents.
    relatedQuestionRefs:
      - QR005
      - QR009
  - type: missing-source
    severity: minor
    topic: workforce-capacity
    missingEvidence: >-
      A reliable current role inventory, organization chart, attrition data, and staffing plan for research,
      integration, safety, and field support.
    whyItMatters: Execution capacity cannot be inferred from a careers page that rendered no usable opening details.
    diligencePath: >-
      Obtain headcount by function and geography, open requisitions, attrition, critical-person dependencies, and
      post-acquisition retention data.
    relatedQuestionRefs:
      - QR008
  - type: missing-source
    severity: material
    topic: comparable-set
    missingEvidence: >-
      A like-for-like public, private-round, or M&A comparable set with matching revenue definitions, growth, margins,
      and observable valuation multiples.
    whyItMatters: >-
      Without comparable multiples, the latest private round cannot be tested against an independent market-clearing
      benchmark.
    diligencePath: >-
      Build a banker-sourced transaction and public-comp set, normalize revenue definitions, and reconcile enterprise
      value, growth, and margin differences.
    relatedQuestionRefs:
      - QV005
  - type: private-evidence-only
    severity: material
    topic: audited-economics
    missingEvidence: >-
      Audited revenue recognition, ARR schedules, gross margin, retention, customer concentration, burn, cash balance,
      and infrastructure cost.
    whyItMatters: >-
      These inputs determine revenue quality, runway, capital intensity, and whether a premium valuation can produce an
      acceptable risk-adjusted return.
    diligencePath: >-
      Obtain audited statements, board reporting, cohort schedules, customer invoices, cloud and hardware commitments,
      and management reconciliation of ARR to revenue.
    relatedQuestionRefs:
      - QV009
      - QV010
  - type: private-evidence-only
    severity: material
    topic: exit-return
    missingEvidence: >-
      Fully diluted ownership, complete preference stack, IPO readiness, strategic acquirer evidence, and a
      board-supported exit timing range.
    whyItMatters: >-
      Entry price alone cannot establish investor return without dilution, preference, ownership, holding-period, and
      exit-value assumptions.
    diligencePath: >-
      Review the charter, cap table, option pool, side letters, investor rights, board materials, financing plan, and
      management exit scenarios.
    relatedQuestionRefs:
      - QV003
      - QV008
      - QV010
