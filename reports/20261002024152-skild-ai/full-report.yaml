      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat depends on whether cross-embodiment learning and deployment data improve faster than integrated
              competitors' proprietary fleets and big-tech platforms' ecosystems. Skild's reported funding provides
              substantial capacity, but capital scale does not demonstrate benchmark leadership, pricing power, or low
              switching cost. Independent analysis explicitly warns that vertically integrated players may shrink the
              addressable market for a horizontal provider, while hardware fragmentation can constrain portability.
              Regulatory trust will also matter: TNW reports that Europe's Machinery Regulation will cover AI-based
