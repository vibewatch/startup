  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Omni-Bodied Operating Model
        blocks:
          - type: paragraph
            body: >-
              Skild AI defines its core product offering around general-purpose physical artificial intelligence
              designed to decouple robotic software capabilities from fixed machine morphologies [CE001]. Rather than
              constructing narrow behavioral policies tailored to specific mechanical arms or proprietary mobile bases,
              the company develops the Skild Brain, an action-centric foundation model engineered to control
              heterogeneous robotic form factors [CE001, CE002]. The core operating model structures execution through a
              two-tier hierarchical policy [CE002]. A low-frequency, high-level navigation and manipulation policy
              interprets task goals and environmental state to generate spatial action plans [CE002]. This high-level
              command sequence is subsequently fed into a high-frequency, low-level action policy that directly outputs
              joint angles and motor torques governing the physical robot hardware [CE002]. By abstracting hardware
              control into a unified policy architecture, Skild AI enables robotic platforms ranging from quadrupeds and
              bipedal humanoids to table-top manipulators and mobile industrial bases to run on a shared model
              foundation [CE001, CE002]. Furthermore, the company reported crossing $100 million in annual recurring
              revenue ten months after its initial commercial deployment, with manipulation applications accounting for
              approximately 90% of total revenue and mobility solutions generating 10% [CE006]. Commercial deployments
              span diverse industrial workflows, including dual-arm manipulation for NVIDIA Blackwell system assembly
              with Foxconn, wire harness manufacturing automation with Sumitomo Wiring Systems, and commercial kitchen
              food preparation pilots with Mitsui & Co. [CE006].
            claimRefs:
              - CE001
              - CE002
              - CE006
