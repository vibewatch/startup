        - Medium
        - Benchmark portability and negotiate capacity and pricing protections
        - Switching cost and performance dependence remain unknown
      - - Warehouse orchestration and acquired operations
        - Zebra Technologies' Robotics Automation business
        - Symmetry Fulfillment platform and fleet orchestration
        - Purchase terms and retained-customer concentration are undisclosed
        - Integration delays, service burden, or customer attrition weaken the end-to-end offer
