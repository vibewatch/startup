      - number: '5.2'
        title: S1 Architecture, In-Context Learning, and Pre-Training Pipeline
        blocks:
          - type: paragraph
            body: >-
              The technical centerpiece of Skild AI's manipulation capabilities is S1, a flagship foundation model built
              from the ground up as an in-context learner for robotics [CE003]. In contrast to conventional
              vision-language-action models that require collecting tens to hundreds of hours of post-training
              demonstration data and fine-tuning model weights for every novel deployment condition, S1 adapts to unseen
              tasks entirely through visual video prompting without altering neural network weights [CE003]. Under this
              paradigm, a user specifies a target task by supplying a single egocentric visual demonstration video; S1
              processes the demonstration prompt within its context window, infers the demonstrator's intent, resolves
              functional correspondences across embodiment viewpoints, and translates the prompt into autonomous motor
              commands [CE003]. The company's controlled internal benchmark evaluations report that on long-horizon
              unseen tasks (spanning 4 to 8 minutes across dozens of manipulation primitives), scaling pre-training data
              to 100,000 hours enabled S1 to achieve a 66% cumulative per-step success rate, compared to 9% for
              language-prompted VLA baselines, demonstrating a 7x performance advantage on out-of-distribution
              manipulation [CE004]. Skild AI estimates that a single video demonstration in context achieves task
              performance comparable to approximately 380 post-training teleoperation demonstrations, eliminating an
              estimated 50 to 100 hours of manual teleoperation per new task [CE005]. Nevertheless, real-world
              deployment requires balancing accuracy with execution cycle time to prevent factory line bottlenecks,
              demanding continued distillation and hardware-specific latency optimizations [CE006].
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE007
      - number: '5.3'
        title: Training Data Flywheel, Simulation Stack, and Technical Dependencies
        blocks:
          - type: paragraph
            body: >-
              Acquiring actionable physical data at scale represents the fundamental bottleneck in robotics foundation
              model development [CE002, CE007]. Skild AI addresses this data scarcity through a multi-pronged data
              engine that combines large-scale synthetic physics simulation, web-scale human video datasets, and
              targeted real-world robot teleoperation [CE002, CE007]. The company's computational and simulation stack
              is heavily dependent on NVIDIA AI infrastructure, utilizing Isaac Lab for scalable reinforcement learning
              scenarios and Cosmos Transfer to multiply simulation datasets across varying environmental lighting,
              textures, and camera parameters via text prompts [CE007, CE008]. This simulation-first pipeline allows
              thousands of virtual robot instances across multiple morphologies to experience millions of edge-case
              failure modes safely, enabling robots to recover from physical disruptions such as jammed wheels within 2
              to 3 seconds or continue operating after limb failures through in-context behavioral adaptation [CE007,
              CE008]. To complement synthetic physics data, Skild AI mines internet-scale video repositories to extract
              functional manipulation affordances by treating humans as biological robots [CE007]. Real-world production
              deployments feed into a recursive self-improvement flywheel (physical RSI), where specialized task edge
              cases encountered across 60+ commercial customer sites are distilled back into the generalist base model
              to enhance universal manipulation capabilities [CE006]. On the software engineering layer, the runtime
              stack relies heavily on production-level C++ and Python modules integrated with the ROS/ROS2 robotics
              middleware ecosystem for motion planning, perception, SLAM, and high-level behavioral control [CE010,
              CE011].
            claimRefs:
              - CE002
              - CE006
              - CE007
              - CE008
              - CE010
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE006
              - CE007
              - CE010
              - CE011
      - number: '5.4'
        title: Differentiation, Operational Reliability, and Technical Limitations
        blocks:
          - type: paragraph
            body: >-
              Skild AI's primary technical differentiation lies in true cross-morphology generalization and
              demonstration-driven in-context adaptation, contrasting sharply with conventional robotic systems that
              require fixed kinematic calibrations or proprietary hardware lock-in [CE001, CE002, CE007]. By
              establishing hardware-agnostic control, Skild AI enables commercial partners to deploy robotic
              intelligence on commodity hardware priced between $4,000 and $15,000, compared to traditional specialized
              industrial robotics requiring upwards of $250,000 [CE007]. In field locomotion testing conducted in
              Pittsburgh urban environments, Skild's vision-driven models achieved 60% to 80% task performance within
              hours of data collection across unstructured terrain, outdoor parks, and fire escapes without pre-mapped
              environments [CE007]. Despite these demonstrated strengths, substantial technical and diligence risks
              persist [CE012]. The company has published limited peer-reviewed, independently audited benchmarks on
              sustained long-horizon precision and mean time between failures (MTBF) under high-speed manufacturing
              cycle times [CE006, CE012]. Furthermore, third-party industry analyses note that generalized robotics
              models face significant physical AI data bottlenecks and unproven safety verification standards when
              transitioning from piloted proof-of-concept cells to mission-critical industrial assembly lines [CE008,
              CE012]. Software engineering recruiting profiles indicate ongoing development across SLAM, low-latency
              motion planning, and hardware safety interlocks, underscoring that commercial scaling remains constrained
              by edge-case physical uncertainties and dependency on external compute stacks [CE009, CE010, CE011].
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: In-Context Video Prompting Overcomes the Post-Training Bottleneck
            body: >-
              Conventional robotic foundation models mirror the BERT era of NLP, requiring tens to hundreds of hours of
              teleoperated post-training data and custom fine-tuning for each new deployment workflow. Skild AI's S1
              establishes that large-scale pre-training across diverse embodiments enables direct in-context learning
              from a single video demonstration, delivering performance equivalent to roughly 380 post-training
              teleoperation episodes without fine-tuning neural network weights.
            calloutType: insight
            claimRefs:
              - CE003
              - CE005
          - type: callout
            title: Throughput Constraints and Cycle Time Bottlenecks in Production
            body: >-
              While in-context learning achieves 66% cumulative success on unseen long-horizon manipulation tasks,
              autonomous industrial deployments face stringent cycle time demands. In synchronized assembly lines with
              human workers or adjacent automated stations, a robotic manipulator that operates even slightly below
              required line speeds becomes a throughput bottleneck, indicating that rapid task adaptation must still be
              paired with extensive speed and reliability distillation before replacing hardcoded automation.
            calloutType: risk
            claimRefs:
              - CE004
              - CE006
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Enterprise and OEM Customer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Skild AI segments its commercial revenue across two primary functional modalities: robotic manipulation
              and robotic mobility. According to disclosures from company leadership upon crossing the $100M annual
              recurring revenue threshold, manipulation tasks constitute approximately 90% of total revenue, while
              mobility applications account for the remaining 10%. Within mobility, autonomous mobile robot (AMR)
              orchestration solutions acquired from Zebra Technologies represent roughly 4% of total ARR, or
              approximately $4M. The company's customer base is structured primarily around high-value enterprise
              original equipment manufacturers (OEMs) and industrial conglomerates rather than fragmented end-user
              accounts. Target buyers consist of Vice Presidents of Manufacturing, Plant Automation Directors, and
              Supply Chain Executives across electronics manufacturing, automotive components, logistics fulfillment,
              and commercial food preparation. Skild AI delivers its foundation intelligence via software subscription
              agreements with terms varying across customer accounts, enabling enterprise customers to upgrade robot
              capabilities dynamically as foundation model iterations advance without requiring complete robotic
              hardware overhauls.
            claimRefs:
              - CU001
              - CU002
              - CU008
              - CU011
          - type: table
            tableRef: TU001
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU006
              - CU011
      - number: '6.2'
        title: Commercial Trajectory and Revenue Run-Rate Acceleration
        blocks:
          - type: paragraph
            body: >-
              Skild AI's commercial adoption trajectory has expanded rapidly throughout 2025 and 2026, advancing from
              zero commercial revenue in early 2025 to approximately $30M in live revenue late in the year, and
              ultimately surpassing $100M in annual recurring revenue ten months after its initial commercial
              deployment. Over this same ten-month operating window, the company reported scaling from eight commercial
              customer accounts to more than 60 paying enterprise customers. In addition to the $100M recurring
              run-rate, the company recognized over $50M in cumulative revenue since beginning deployments. Operational
              footprints span facility inspections, point-to-point delivery, security, commercial kitchens,
              manufacturing facilities, and data centers. The rapid velocity of deployment is facilitated by the S1
              foundation model's in-context learning architecture, which reports a 96% success rate on seen manipulation
              tasks and 66% on novel, unseen tasks from a single video demonstration, reducing deployment setup from
              weeks of specialized programming to rapid in-situ prompting.
            claimRefs:
              - CU001
              - CU002
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
      - number: '6.3'
        title: Named Customer Deployments and Strategic Integration
        blocks:
          - type: paragraph
            body: >-
              Skild AI's public customer footprint is anchored by high-visibility deployments with major strategic
              partners and investors. On NVIDIA Blackwell GPU assembly lines operated in collaboration with Foxconn in
              Houston, Skild Brain powers dual-arm robotic manipulators executing high-precision tasks including busbar
              insertion, screw fastening, and component placement. In automotive manufacturing, the company is
              conducting advanced integration work with Sumitomo Wiring Systems to automate delicate wire harness
              assembly operations previously deemed intractable for mechanical automation. In commercial food service,
              Skild AI has deployed S1 in commercial kitchen pilots with Mitsui & Co., whose distribution operations
              supply 1.4 million meals daily across Japan. Furthermore, the company is collaborating with LG CNS to
              deploy foundation models across partner logistics facilities, citing Market Kurly as a key operational
              target. However, independent diligence highlights that nearly all publicly named customer references
              represent corporate shareholders or strategic go-to-market partners, leaving third-party commercial
              traction outside partner circles largely unverified.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
      - number: '6.4'
        title: Retention Durability, Channel Dependence, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Despite reporting top-line ARR acceleration, Skild AI exhibits notable customer concentration and
              durability vulnerabilities. The company relies heavily on indirect sales channels through legacy
              industrial robot manufacturers, notably ABB, Universal Robots, and Mobile Industrial Robots, rather than
              an extensive direct enterprise sales organization. This indirect go-to-market structure limits direct
              operational feedback from frontline factory floors and exposes Skild AI to partner channel friction.
              Furthermore, Skild AI has disclosed zero audited metrics regarding net revenue retention (NRR), gross
              retention (GRR), annual contract renewal rates, or cohort-level churn. Additional churn risk stems from
              the April 2026 acquisition of Zebra Technologies' robotics division: taking over an autonomous mobile
              robot business that Zebra had actively slated for downsizing in late 2025 threatens customer retention
              across inherited Fetch Robotics accounts. Internationally, pending European regulatory scrutiny under the
              Machinery Regulation in January 2027 introduces compliance barriers for self-evolving AI machinery,
              creating potential friction for European customer expansion.
            claimRefs:
              - CU007
              - CU009
              - CU012
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reference Customer Opacity and Strategic Syndicate Concentration
            body: >-
              While Skild AI demonstrates legitimate production deployments with Foxconn, NVIDIA, and Sumitomo Wiring,
              all publicly disclosed customers are capital investors or strategic OEM partners. The absence of
              independent, arms-length enterprise customer references prevents third-party verification of standard
              software licensing willingness, pricing power, and organic enterprise demand.
            calloutType: risk
            claimRefs:
              - CU004
              - CU007
          - type: callout
            title: Indirect OEM Channel Leverage vs. End-User Relationship Ownership
            body: >-
              By embedding the Skild Brain into existing fleets from ABB, Universal Robots, and Zebra Technologies,
              Skild AI bypasses traditional industrial procurement cycles and hardware manufacturing bottlenecks.
              However, this structure cedes primary customer relationship ownership to hardware OEMs and risks customer
              attrition if partners introduce competing foundation models.
            calloutType: insight
            claimRefs:
              - CU003
              - CU009
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and safety exposure
        blocks:
          - type: paragraph
            body: >-
              The clearest identified regulatory issue is Europe's Machinery Regulation, which The Next Web reports will
              cover AI-based safety functions and machinery with self-evolving behavior from January 20, 2027, with
              notified-body assessment rather than only manufacturer declaration. Applicability to Skild AI is
              conditional: the same report says the company had not disclosed whether it sells into Europe. The assigned
              evidence contains no regulator filing, conformity plan, safety certification, litigation search result,
              incident register, privacy assessment, export-control classification, or insurance disclosure. The
              investment implication is therefore not a finding of noncompliance; it is a readiness gap. Before
              underwriting European expansion or safety-critical deployments, diligence should verify intended
              jurisdictions, legal entity responsibilities, applicable standards, independent testing, incident
              reporting, and contractual allocation of product-liability risk.
            claimRefs:
              - CR001
              - CR002
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR013
              - CR015
              - CR016
      - number: '7.2'
        title: Operational reliability, quality, and security
        blocks:
          - type: paragraph
            body: >-
              Skild AI itself identifies the hard part of robotics deployment as the final reliability margin: its egg
              task took one week to work once and another two months to work reliably across eggs and setups. It also
              says a robot that is 99.9% accurate but ten times too slow is not deployable, because one slow station
              constrains an entire production line. Those observations are more decision-useful than demo footage, but
              they do not provide fleet uptime, intervention frequency, mean time between failures, safety-event rates,
              or customer-level cycle times. S1's published results use internal benchmark suites, and the described
              evaluation used human intervention mainly to recover the VLA baseline. Kill criteria should therefore
              focus on audited production telemetry: repeated safety incidents, intervention rates that erase labor
              savings, or cycle time below contracted throughput after an agreed remediation window.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR016
      - number: '7.3'
        title: Partner, platform, and integration dependencies
        blocks:
          - type: paragraph
            body: >-
              Skild AI depends on external infrastructure and counterparties even though its product thesis is
              hardware-agnostic. S1 is built on NVIDIA AI infrastructure, while the company's data strategy combines
              sources with different tradeoffs: teleoperation is close to deployment hardware but scales poorly, and
              egocentric video scales better but has a larger robot-domain gap. The Zebra Robotics Automation
              acquisition adds the Symmetry Fulfillment orchestration platform and creates an end-to-end warehouse
              proposition, but the available release does not disclose purchase price, transferred liabilities, customer
              retention, service obligations, or integration milestones. Public customer breadth also does not reveal
              revenue concentration: Skild AI reports more than 60 paying customers, while independent reporting says
              customers were largely unnamed. Investment diligence should test compute portability, acquisition
              integration, renewal quality, and concentration rather than treating a broad customer count as proof of
              diversified economics.
            claimRefs:
              - CR004
              - CR010
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
      - number: '7.4'
        title: Financial-model risk and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The public financial signals are promising but not interchangeable. Skild AI says it crossed $100 million
              in annual recurring revenue and recognized $50 million of revenue during its first ten months of
              deployment; the latter is not ARR, and neither figure discloses gross margin, contract duration,
              collections, or concentration. A separate company-issued acquisition release described approximately $30
              million of 2025 revenue. Independent reporting says the company raised $1.4 billion in January 2026 at a
              $14 billion valuation, but funding raised is not evidence of cash currently available. The valuation
              leaves execution sensitive to slower conversion, integration costs, or weak unit economics. Thesis-break
              triggers are failure to reconcile ARR to audited revenue, customer cohorts and cash receipts; runway below
              the investment plan once burn is verified; or material dependence on a small number of counterparties
              without contractual protection.
            claimRefs:
              - CR003
              - CR005
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not equate deployment claims with reliability proof
            body: >-
              The company reports more than 60 paying customers, but the assigned evidence does not disclose fleet
              uptime, intervention rates, renewals, or customer concentration. Production telemetry and reference calls
              are required before customer breadth can reduce operational risk.
            calloutType: risk
            claimRefs:
              - CR004
              - CR006
              - CR007
          - type: callout
            title: Financial metrics require reconciliation
            body: >-
              The reported $100 million ARR, $50 million recognized revenue, $1.4 billion financing, and $14 billion
              valuation describe different measures. Diligence must reconcile contracts, accounting revenue,
              collections, cash, burn, and financing terms rather than using any one measure as a proxy for the others.
            calloutType: assumption
            claimRefs:
              - CR003
              - CR005
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, with medium confidence, high risk, and a stretched valuation stance.
              Forge and Silicon Valley Investclub both place the January 2026 post-money valuation at roughly $14
              billion, and the financing was reported at approximately $1.4 billion. Skild AI's September 2026 claim of
              $100 million in ARR makes the simple post-money valuation-to-ARR reference 140x; this is neither an
              enterprise-value multiple nor an audited revenue multiple. The company separately described $50 million as
              recognized since deployment began, so funding, ARR, and recognized revenue must not be treated as
              interchangeable liquidity or accounting measures. Entry at the latest mark is not supported by the
              retained public evidence without audited revenue quality, margin, retention, burn, cash, and
              customer-concentration proof.
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV009
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV009
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV005
              - CV007
              - CV009
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and comparable context
        blocks:
          - type: paragraph
            body: >-
              The thesis is that a hardware-agnostic robot foundation model can compound deployment data across
              embodiments, and Skild reports both technical progress and early commercial scale. Its S1 evaluation
              reports 66% success on unseen long-horizon tasks from one demonstration, while HPE describes dedicated
              private infrastructure for training and inference. The anti-thesis is evidence quality: those technical
              results are company-issued, the commercial metrics are unaudited, and an Exa directory remained materially
              stale after the latest financing. Retained market-data pages identify CoreWeave and LightOn only as broad
              public yardsticks and disclose no usable like-for-like revenue multiple. Competitor comparisons therefore
              do not provide an independent valuation benchmark, and the current financing mark is the only defensible
              price anchor.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV008
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.3'
        title: Scenario framing and downside triggers
        blocks:
          - type: paragraph
            body: >-
              Scenario values are bounded by observed financing marks rather than invented multiples. A bull case can
              defend $14 billion or more only after the $100 million ARR claim is audited, customer references establish
              durability, and margins and retention support software-like economics. The base case lies somewhere
              between the May 2025 $4.7 billion Series B mark and the January 2026 $14 billion Series C mark, but public
              evidence cannot locate a fair value within that interval. The bear case falls to or below the prior mark
              if ARR proves services-heavy, concentrated, or non-recurring, or if regulatory deployment friction rises.
              These are decision bands and triggers, not probability-weighted fair-value estimates; no numerical
              probabilities are supportable from the retained sources.
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV008
              - CV009
              - CV010
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV015
              - CV016
      - number: '8.4'
        title: Financing terms, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              Forge's records indicate a 1.0x liquidation preference, a 6% non-cumulative dividend, and
              non-participating Series C economics, while Silicon Valley Investclub estimates roughly 10% dilution from
              the round; neither source is a complete fully diluted cap table. The retained evidence does not establish
              an IPO timetable, a credible strategic-acquirer set, or a supportable target return, hold period, or exit
              window. Before underwriting price, obtain audited revenue recognition and ARR schedules, gross margin by
              deployment, retention and concentration cohorts, burn and cash, the complete preference stack and option
              pool, customer reference calls, and jurisdiction-specific machinery compliance. Thesis-break triggers are
              failed revenue verification, weakening renewal quality, hidden preference seniority, or a deployment
              regime that materially slows commercialization.
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive decision
            body: >-
              Treat $14 billion as a financing mark, not demonstrated fair value. Advance only after audited economics
              and cap-table diligence support the implied premium, or after entry terms reset materially toward the
              prior financing anchor.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV009
              - CV016
          - type: callout
            title: Metric comparability warning
            body: >-
              The reported $30 million of 2025 revenue, $50 million recognized after deployment, and $100 million of
              September 2026 ARR have different periods and definitions; they do not establish a clean growth rate or
              cash runway.
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV010
