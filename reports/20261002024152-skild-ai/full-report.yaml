  - id: TV003
    title: Bull, base, and bear decision bands
    columns:
      - Case
      - Assumptions
      - Valuation or return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - Audited $100M ARR; durable retention; healthy margins; referenceable customers; manageable compliance.
        - $14B+ becomes defensible, but no upper range or target return is supportable publicly.
        - Execution and multiple compression remain material.
        - Requires multiple unverified milestones; currently low-support.
      - - Base
        - Commercial claims broadly hold, but services intensity and unit economics remain unclear.
        - Use the observed $4.7B-to-$14B financing-mark interval; no fair-value point is supportable.
        - Dilution, burn, concentration, and exit timing are unknown.
        - Current evidence supports research-more rather than a numeric probability.
      - - Bear
        - ARR quality fails audit, renewals weaken, customers concentrate, or regulatory friction slows deployments.
        - At or below the prior $4.7B mark is a downside anchor, not a fair-value estimate.
        - Down-round, preference, liquidity, and commercialization risk compound.
        - Any named trigger would move the case toward avoid.
    notes: >-
      Bounds are observed May 2025 and January 2026 post-money financing marks, not comparable-derived valuations;
      probability percentages are omitted as unsupported.
