  - id: FE001
    title: Skild AI Omni-Bodied Robotics Foundation Stack Architecture
    type: stack
    summary: >-
      Hierarchical architecture of the Skild Brain spanning deployment flywheel data collection down to low-level
      physical actuation.
    data:
      layers:
        - label: 'Layer 6: In-Context Task Prompting'
          detail: >-
            Translates single visual video demonstration of seen or unseen manipulation tasks into goal specification
            and spatial execution plans without fine-tuning weights.
          tone: positive
        - label: 'Layer 5: Physical RSI Deployment Flywheel'
          detail: >-
            Distills real-world deployment telemetry and edge-case failure recoveries from 60+ customer sites back into
            general-purpose base model pre-training.
          tone: positive
        - label: 'Layer 4: Omni-Bodied High-Level Policy'
          detail: >-
            Low-frequency navigation and manipulation policy resolving spatial affordances and high-level trajectory
            waypoints across diverse environments.
          tone: positive
        - label: 'Layer 3: Real-Time Low-Level Motor Control'
          detail: >-
            High-frequency joint torque and angle action policy executing continuous closed-loop actuation and
            in-context dynamic morphology adaptation.
          tone: positive
        - label: 'Layer 2: Edge Middleware & Systems Runtime'
          detail: >-
            Production C++, Python, and ROS/ROS2 low-latency execution interfacing with NVIDIA compute stacks, SLAM, and
            local sensor feeds.
          tone: neutral
        - label: 'Layer 1: Heterogeneous Physical Hardware'
          detail: >-
            Commodity mechanical platforms ($4,000–$15,000) including bipedal humanoids, quadrupeds, dual-arm
            manipulators, and mobile industrial bases.
          tone: neutral
    approximationNotes: >-
      Layer partitioning reflects the hierarchical low-frequency/high-frequency policy structure and data engine
      described in Skild AI's technical disclosures.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE006
      - CE007
      - CE010
      - CE011
