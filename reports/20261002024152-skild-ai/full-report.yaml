      - number: '2.3'
        title: Buyer Segmentation, Procurement Paths, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption of physical foundation models spans three primary customer profiles: robot hardware OEMs,
              industrial enterprise operators, and automated system integrators. Robot manufacturers license the Skild
              Brain to eliminate multi-year in-house AI development cycles, converting capital expenditure into
              cloud-based API licensing and edge runtime fees. Enterprise buyers in manufacturing, logistics, and
              critical infrastructure evaluate deployments based on cycle-time parity, station throughput, and error
              recovery rather than passive benchmark demonstrations. Commercial deployments across Foxconn Blackwell
              server assembly, Sumitomo Wiring Systems, and Mitsui commercial kitchen pilots reveal that industrial
              adoption triggers center on labor availability and retooling speed. However, critical constraints govern
              deployment velocity. Deployments require cycle-time parity with human line workers, where a robot
              operating with high accuracy but at one-tenth human speed cannot be placed into production. Furthermore,
              physical foundation models face impending regulatory hurdles: the European Union's Machinery Regulation
              takes effect on January 20, 2027, introducing mandatory third-party notified body assessments for
              machinery demonstrating self-evolving or out-of-distribution operational behaviors. Hardware integration
              friction, sim-to-real physical discrepancies, and liability risks for physical property damage remain
              persistent adoption bottlenecks.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM007
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Manipulation Represents the High-Willingness-to-Pay Foundation Frontier
            body: >-
              While market enthusiasm frequently centers on bipedal humanoids and autonomous mobile transport, Skild
              AI's commercial revenue breakdown indicates that roughly 90% of its $100M ARR is generated from
              manipulation tasks. Autonomous mobility is largely commoditized, representing just 10% of revenue (with 4%
              tied to acquired Zebra AMRs). Real industrial spend is directed at automating complex, high-dexterity
              manipulation tasks such as wire harness insertion and electronics assembly that previously resisted
              automation.
