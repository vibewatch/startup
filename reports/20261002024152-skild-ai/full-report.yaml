  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - - Thesis
        - S1 reports one-demonstration adaptation on unseen long-horizon tasks.
        - Independent benchmark replication and production reliability data would strengthen the claim.
      - - Thesis
        - Company-reported $100M ARR and 60+ paying customers indicate rapid early commercialization.
        - Audited ARR, named references, retention, and gross margin would establish revenue quality.
      - - Anti-thesis
        - Dedicated AI infrastructure and broad deployment integration may keep capital and service intensity high.
        - Workload cost, deployment labor, and contribution-margin data could disprove this concern.
      - - Anti-thesis
        - No like-for-like independent revenue multiple supports the latest private financing mark.
        - A relevant public or M&A comp set with matching revenue definitions could anchor price.
    notes: >-
      Technical and commercial upside is company-claimed; HPE supplies partner proof of infrastructure, while
      comparable-multiple coverage remains incomplete.
