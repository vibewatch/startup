- id: western-international-peers
  title: Western & International Peers
  body: Figure AI completed a $1B+ Series C in September 2025 at a $39B valuation, bringing total capital raised above $1.9B.
    Figure's Figure 03 is deployed at BMW's Spartanburg plant processing over 90,000 auto parts, and the company's BotQ factory
    produces one unit every 90 minutes, demonstrating the most advanced humanoid manufacturing ramp of any US company. Figure
    AI's Helix AI system and BMW partnership represent the clearest path to commercial humanoid deployment in Western automotive
    OEM settings — a market Galaxea is not yet positioned to address. Physical Intelligence raised $400M Series B in November
    2025 at a $5.6B valuation, with additional $1B raise discussions at $11B+ reported in early 2026. Its π0.7 generalist
    policy model, open-sourced in April 2026, is hardware-agnostic and can run on any compatible platform including the Galaxea
    R1 Pro, creating direct competition to Galaxea's G0 VLA open-source strategy. The model's hardware independence reduces
    switching costs across the entire ecosystem, compressing the exclusivity value of any single OEM's proprietary dataset.
    1X Technologies sold approximately 10,000 NEO units at $20,000 within five days of opening sales and separately closed
    a 10,000-unit enterprise deal with EQT Group; it is targeting a $1B raise at a $10B valuation. At $20,000, the NEO undercuts
    the Galaxea R1 Pro by 71% and occupies a prosumer-to-light-industrial price bracket that Galaxea does not serve. Boston
    Dynamics' Atlas, with 56 degrees of freedom, is the most mechanically capable commercial humanoid available, though its
    entire 2026 production run is committed internally to Hyundai Group use, effectively removing Atlas from the open commercial
    market through at least 2027. Apptronik closed a $935M Series A in early 2026 at a $5.5B valuation, with Apollo deployed
    in pilots at Mercedes-Benz, GXO Logistics, and Jabil, and is targeting a sub-$50,000 unit price at scale. CNBC headlined
    Apptronik's raise as funding to "beat Chinese humanoid robots," reflecting the intensifying US-China competitive framing.
    Counterpoint Research confirms that approximately 90% of all humanoid units sold globally in 2025 were manufactured in
    China, highlighting the structural volume advantage held by Chinese domestic producers regardless of AI sophistication
    metrics.
