- id: chinese-domestic-competitors
  title: Chinese Domestic Competitors
  body: AgiBot (深圳智元机器人) is the single largest humanoid robot volume producer globally, shipping over 5,100 units in 2025
    and capturing an estimated 39% of the global humanoid installed base according to the Shanghai municipal government. The
    company's AgiBot World multi-task dataset, released in 2025, serves as both a competitive product and an open-source ecosystem
    play designed to accelerate cross-platform VLA training. AgiBot's valuation is disputed — ranging from $2.1B (PitchBook)
    to $6.4B (company-stated) — and its enterprise client base is concentrated in Chinese manufacturing. Unitree Robotics
    (宇树科技) shipped approximately 5,500 humanoid units in 2025, generating $235M revenue and $83M net profit, with its G1 priced
    from $13,500 — a 5.2× discount to Galaxea's R1 Pro. Unitree filed for a Hong Kong IPO in March 2026 at a targeted $6B
    valuation, representing what would be the first major humanoid robot public offering globally. UBTECH Robotics (优必选),
    already HK-listed (9880.HK), reported 2025 humanoid revenue of approximately RMB 2 billion (≈$275M) from 1,079 Walker
    S2 units deployed across BYD, NIO, and Dongfeng automotive assembly lines, with year-over-year humanoid revenue growth
    of 2,203%. UBTECH's average selling price of approximately $105,000 positions it above Galaxea in the enterprise tier,
    though its deployment base is concentrated in Chinese automotive OEMs and does not compete directly in Galaxea's current
    academic and developer segments. LimX Dynamics closed a $200M Series B in February 2026 at a $3.3B valuation, with its
    LimX Oli platform priced at $22,730 — targeting the research-to-industrial bridge market. Fourier Intelligence is pivoting
    its GR-2 (priced at $125,000–$150,000) toward rehabilitation and healthcare via the GR-3 Care-Bot, reducing direct competition
    with Galaxea in industrial settings but intensifying competition for academic and institutional research budgets. Chinese
    domestic competitors collectively hold a 6–18 month lead on manufacturing scale, with AgiBot and Unitree operating automated
    production lines at volumes Galaxea has not yet announced.
