  evidenceGaps:
  - type: missing-source
    severity: material
    topic: VLA benchmark comparisons
    missingEvidence: No independent third-party benchmark comparing Galaxea G0 performance directly to Physical Intelligence
      π0.7 or NVIDIA GR00T on standardised manipulation benchmarks was identified.
    whyItMatters: Without a validated cross-framework performance comparison, Galaxea's claimed superiority in multi-task
      generalisation cannot be independently verified, weakening the G0 moat narrative in enterprise sales and investor diligence
      contexts.
    diligencePath: Request G0 performance data on LIBERO, MetaWorld, or RoboSuite benchmarks from Galaxea. Monitor arXiv for
      cross-framework VLA evaluation papers citing G0 and π0.7.
    relatedQuestionRefs:
    - QP011
    - QP015
  - type: private-evidence-only
    severity: material
    topic: Enterprise client revenue
    missingEvidence: Galaxea's 40+ enterprise clients have not been individually named or quantified by revenue, unit volume,
      or contract value in any publicly available source.
    whyItMatters: The commercial traction narrative rests entirely on a company-stated client count. Without per-client or
      aggregate revenue disclosure, the competitive moat from enterprise relationships cannot be independently assessed.
    diligencePath: Request client reference list, aggregate revenue by segment, and named pilot deployments from Galaxea directly.
      Triangulate with public statements from named clients (Huawei Cloud, VW).
    relatedQuestionRefs:
    - QP024
    - QP028
  - type: missing-source
    severity: minor
    topic: 1X Technologies $10B valuation confirmation
    missingEvidence: A $10B valuation target for 1X Technologies' new fundraise was reported in secondary sources but not
      confirmed as a closed round as of May 2026.
