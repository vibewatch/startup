  researchQuestions:
  - id: QP001
    question: Who are the ten primary direct competitors to Galaxea AI in the humanoid and dexterous manipulation robot market
      as of mid-2026?
    type: enumeration
    targets:
    - contentRequirements/0
    status: answered
    answer: 'The ten primary competitors are: (1) Figure AI, (2) Physical Intelligence, (3) 1X Technologies, (4) Boston Dynamics
      / Atlas, (5) Apptronik, (6) AgiBot, (7) Unitree Robotics, (8) UBTECH, (9) LimX Dynamics, and (10) Fourier Intelligence.
      These span two Chinese domestic volume leaders (AgiBot, Unitree), two Chinese enterprise specialists (UBTECH, LimX),
      one Chinese healthcare pivot (Fourier), and five Western-funded startups / subsidiaries.'
  - id: QP002
    question: What is Figure AI's current valuation, total capital raised, and commercial deployment status?
    type: quantification
    targets:
    - contentRequirements/1
    status: answered
    answer: Figure AI completed a Series C in September 2025 at a $39B valuation, raising $1B+, bringing total capital raised
      above $1.9B. Commercially, Figure 03 is deployed at BMW Spartanburg processing 90,000+ auto parts, and BotQ factory
      produces one Figure 03 per 90 minutes.
  - id: QP003
    question: What is Figure AI's most recent commercial or production milestone?
    type: freshness
    targets:
    - contentRequirements/1
    status: answered
    answer: The BotQ factory cadence (1 unit per 90 minutes) and BMW Spartanburg deployment (90,000+ parts processed) were
      the most recent confirmed milestones as of early 2026. Series C close at $39B was the most recent capital event (September
      2025).
  - id: QP004
    question: What is Physical Intelligence's valuation, total funding, and latest model release?
    type: quantification
    targets:
    - contentRequirements/1
    status: answered
    answer: Physical Intelligence raised $400M Series B in November 2025 at a $5.6B valuation; total funding exceeded $900M.
      The company open-sourced π0.7 in April 2026 — a hardware-agnostic generalist policy model. Additional $1B raise at $11B+
      valuation was in discussions as of early 2026.
  - id: QP005
    question: How many humanoid units has AgiBot shipped, and what global market share does it hold?
    type: quantification
    targets:
    - contentRequirements/1
    status: answered
    answer: AgiBot shipped over 5,100 humanoid units in 2025, representing approximately 39% of the global humanoid installed
      base per the Shanghai municipal government announcement of January 2026.
  - id: QP006
    question: How many humanoid units did Unitree ship in 2025, and what revenue and profit did it report?
    type: quantification
    targets:
    - contentRequirements/1
    status: answered
    answer: Unitree shipped approximately 5,500 humanoid units in 2025, generating $235M revenue and $83M net profit, with
      G1 priced from $13,500. Unitree filed for a Hong Kong IPO in March 2026 targeting a $6B valuation.
  - id: QP007
    question: How does Galaxea's R1 Pro pricing compare to Chinese domestic competitors?
    type: comparison
    targets:
    - contentRequirements/2
    status: answered
    answer: Galaxea R1 Pro at $69,999 is 5.2× the price of Unitree G1 ($13,500), 3.1× the price of 1X NEO ($20,000), and 3.1×
      the price of LimX Oli ($22,730). Only UBTECH Walker S2 (~$105K ASP) and Fourier GR-2 ($125–150K) are priced above Galaxea
      R1 Pro.
  - id: QP008
    question: Has Galaxea AI achieved bipedal locomotion comparable to Atlas, Figure 03, or Unitree G1?
    type: verification
    targets:
    - contentRequirements/2
    status: answered
    answer: 'No. Galaxea AI''s production R1 Pro uses a wheeled mobile base, not bipedal locomotion. This is a definitive
      product characteristic, not a gap — Galaxea deliberately chose wheeled form factor for stability in confined industrial
      environments. A bipedal G1 concept has been referenced in communications but has not entered production as of May 2026.
      The question of whether Galaxea bipedal prototypes would match Atlas or Figure 03 remains unanswered, but the production
      platform comparison is clear: R1 Pro is wheeled, Atlas and Figure 03 are bipedal — they target different use-case envelopes.'
  - id: QP009
    question: What is the most recent funding milestone for Physical Intelligence?
    type: freshness
    targets:
    - contentRequirements/1
    status: answered
    answer: Physical Intelligence completed a $400M Series B in November 2025 at a $5.6B valuation. Reports of a $1B additional
      raise at $11B+ valuation emerged in early 2026, as yet unconfirmed.
  - id: QP010
    question: What are Galaxea AI's most significant competitive weaknesses relative to peers?
    type: adverse
    targets:
    - contentRequirements/4
    status: answered
    answer: 'Three material weaknesses: (1) no mass-production history — all 10 primary competitors have either shipped more
      units or secured larger enterprise pipeline; (2) wheeled form factor excludes Galaxea from bipedal-specific use cases
      (stair climbing, unstructured terrain); (3) pricing at $69,999 is under sustained pressure from sub-$25K volume competitors
      (Unitree, 1X, LimX).'
  - id: QP011
    question: Has Galaxea's G0 VLA framework been independently benchmarked against competing VLA frameworks (π0.7, GR00T)?
    type: verification
    targets:
    - contentRequirements/2
    status: unresolved
    answer: No independent third-party benchmark comparing Galaxea G0 performance directly to Physical Intelligence π0.7 or
      NVIDIA GR00T was identified in available sources as of May 2026. The G0 arXiv paper reports internal metrics (150+ tasks,
      50 scenes, 500+ hours), but cross-framework performance comparisons on standardised benchmarks have not been published.
  - id: QP012
    question: What is Apptronik's Series A total and what enterprise pilots are active?
    type: quantification
    targets:
    - contentRequirements/1
    status: answered
    answer: Apptronik closed a $935M Series A in early 2026 at a $5.5B valuation. Apollo is deployed in active pilots at Mercedes-Benz,
      GXO Logistics, and Jabil, targeting a sub-$50,000 unit price at scale.
  - id: QP013
    question: What is 1X Technologies' commercial scale and current valuation?
    type: quantification
    targets:
    - contentRequirements/1
    status: partial
    answer: 1X Technologies sold approximately 10,000 NEO units at $20,000 within five days of opening sales and closed a
      10,000-unit enterprise deal with EQT Group. A $1B fundraise at a $10B valuation was reported as of early 2026 but not
      confirmed as closed.
  - id: QP014
    question: Which Chinese humanoid manufacturers have crossed 1,000-unit annual production in 2025?
    type: enumeration
    targets:
    - contentRequirements/0
    status: answered
    answer: 'Three Chinese manufacturers crossed the 1,000-unit threshold in 2025: AgiBot (5,100+ units), Unitree (5,500+
      units), and UBTECH (1,079 units). LimX Dynamics and Fourier Intelligence remained below 1,000 units annually.'
  - id: QP015
    question: How does Galaxea's G0 open-source strategy compare to Physical Intelligence's π0.7 open-source release?
    type: comparison
    targets:
    - contentRequirements/2
    status: answered
    answer: Galaxea G0 was open-sourced earlier (arXiv March 2025) and is hardware-coupled to the R1 Pro platform with 500+
      hours of demonstration data, 150+ tasks, and 50 scene types. Physical Intelligence's π0.7 (April 2026) is hardware-agnostic,
      compatible with any robot platform, and backed by a $5.6B company focused solely on AI — making it a more direct and
      scalable open-source competitor to G0's ecosystem.
  - id: QP016
    question: How does the R1 Pro's wheeled mobile-base form factor create competitive advantages over bipedal robots in enterprise
      settings?
    type: mechanism
    targets:
    - contentRequirements/2
    status: answered
    answer: Wheeled locomotion eliminates balance instability, reducing actuator complexity and per-DoF cost versus bipedal
      platforms. In confined industrial and laboratory spaces, wheeled bases provide predictable, safe navigation without
      fall-recovery overhead. Cycle times for manipulation tasks are less constrained by gait management, enabling higher
      dexterous throughput per unit time. These advantages are most pronounced in structured factory and logistics settings
      — exactly Galaxea's current enterprise segment.
  - id: QP017
    question: Has Boston Dynamics committed its entire 2026 Atlas production run to internal Hyundai Group use?
    type: verification
    targets:
    - contentRequirements/1
    status: answered
    answer: Yes. Forbes reporting (January 2026) confirmed that Boston Dynamics' entire 2026 Atlas production run is committed
      to internal Hyundai Group deployment. Atlas is not available for external commercial sales in 2026.
  - id: QP018
    question: Is UBTECH's Walker S2 currently deployed in active automotive assembly lines?
    type: verification
    targets:
    - contentRequirements/1
    status: answered
    answer: Yes. UBTECH's Walker S2 is deployed across BYD, NIO, and Dongfeng automotive assembly lines, performing bolt-tightening
      and quality inspection tasks. UBTECH's 2025 annual results (HKEX filing) confirm 1,079 units shipped with RMB 2B humanoid
      revenue.
  - id: QP019
    question: What was UBTECH's 2025 humanoid revenue and Walker S2 average selling price?
    type: quantification
    targets:
    - contentRequirements/1
    status: answered
    answer: UBTECH reported 2025 humanoid revenue of approximately RMB 2 billion (≈$275M) from 1,079 Walker S2 units deployed,
      implying an average selling price of approximately $105,000 per unit. Year-over-year humanoid revenue growth was 2,203%.
  - id: QP020
    question: How does Fourier Intelligence's target market compare to Galaxea R1 Pro's target market?
    type: comparison
    targets:
    - contentRequirements/2
    status: answered
    answer: Fourier's GR-2 (priced $125–150K) was initially targeted at research and industrial applications. With the GR-3
      Care-Bot pivot, Fourier is repositioning toward healthcare and rehabilitation, reducing direct overlap with Galaxea's
      industrial logistics and academic research positioning. The ASP premium at $125–150K also separates Fourier from Galaxea's
      $69,999 enterprise tier.
  - id: QP021
    question: What enterprise customer segments are each of the ten competitors primarily targeting in 2026?
    type: enumeration
    targets:
    - contentRequirements/0
    status: answered
    answer: 'Figure AI: automotive OEM (BMW). Physical Intelligence: cross-platform AI licensing. 1X: home and light industrial.
      Boston Dynamics: internal Hyundai. Apptronik: enterprise logistics (Mercedes, GXO, Jabil). AgiBot: general industrial
      / manufacturing. Unitree: prosumer, research, light industrial. UBTECH: automotive OEM (BYD, NIO, Dongfeng). LimX Dynamics:
      research / early industrial. Fourier Intelligence: healthcare / rehabilitation. Galaxea: academic research and enterprise
      pilots.'
  - id: QP022
    question: What technical barriers prevent Chinese domestic competitors from rapidly replicating Galaxea's G0 VLA architecture?
    type: mechanism
    targets:
    - contentRequirements/3
    status: answered
    answer: Galaxea's G0 dataset required 500+ hours of expert demonstration collection across 150+ tasks and 50 scene types
      — a multi-year data collection effort that cannot be accelerated by funding alone. The two active AI professor co-founders
      (Xu Huazhe at Tsinghua TEA Lab, Zhao Hang at MARS Lab) enable ongoing academic co-development that connects Galaxea
      to frontier VLA research without replication lag. However, AgiBot World and NVIDIA GR00T represent serious efforts to
      close this gap with open datasets.
  - id: QP023
    question: Is Galaxea AI's self-reported $29B valuation corroborated by independent third-party sources?
    type: verification
    targets:
    - contentRequirements/1
    status: partial
    answer: No credible third-party source corroborates the $29B figure. InforCapital and PitchBook both cite approximately
      $2.9B — a 10× discrepancy. The $29B figure (CNY 200B) was reported by Yicai Global citing a company announcement, which
      may reflect a valuation methodology or currency error.
  - id: QP024
    question: What is the risk that Galaxea's open-source G0 model enables competitors to commoditise its AI framework?
    type: adverse
    targets:
    - contentRequirements/4
    status: partial
    answer: 'Medium-term risk is rated high. Physical Intelligence''s π0.7 is hardware-agnostic and can run on R1 Pro, effectively
      providing competing VLA capability on Galaxea''s own platform. If PI''s model achieves parity or superiority to G0 on
      Galaxea''s target tasks, the open-source moat reverses: enterprise buyers could prefer PI''s framework on Galaxea hardware,
      eroding Galaxea''s AI value-add. The ecosystem benefit (developer community) partially offsets this risk.'
  - id: QP025
    question: How do Galaxea's academic partnerships differentiate its R&D pipeline from purely commercial competitors?
    type: mechanism
    targets:
    - contentRequirements/3
    status: answered
    answer: 'Galaxea''s two professor co-founders (Xu Huazhe, Tsinghua TEA Lab; Zhao Hang, Tsinghua IIIS MARS Lab) provide
      direct research pipeline integration: graduate student researchers contribute to G0 dataset collection, VLA model training,
      and platform-specific task learning without requiring full-time hiring. This reduces R&D cost per experiment and accelerates
      publication-driven credibility that commercial peers (Unitree, AgiBot) replicate only through hiring.'
  - id: QP026
    question: What is the latest development status of XPeng's IRON humanoid robot and its mass production timeline?
    type: freshness
    targets:
    - contentRequirements/0
    status: partial
    answer: XPeng unveiled the IRON humanoid in late 2025 and has stated a mass production target for 2026. XPeng's Foxconn-level
      manufacturing infrastructure and automotive distribution relationships give it structural advantages over most startups.
      However, specific production volume commitments and launch timelines for IRON in 2026 have not been confirmed as of
      May 2026.
  - id: QP027
    question: What pricing pressure does Unitree G1 ($13,500) create for Galaxea R1 Pro ($69,999) in overlapping segments?
    type: adverse
    targets:
    - contentRequirements/4
    status: answered
    answer: The Unitree G1's 80% price discount creates acute pressure in research and light-industrial segments where Galaxea
      competes. Enterprise buyers evaluating both platforms must justify a $56,500 premium per unit. Galaxea's mitigation
      relies on wheeled form factor stability, G0 multi-task VLA capability, and enterprise SLA — none of which have been
      independently benchmarked against G1 in published studies. If Unitree adds comparable multi-task VLA at its price tier,
      Galaxea's enterprise differentiation collapses.
  - id: QP028
    question: How does Galaxea's 40+ enterprise client count compare to peers at similar funding stages?
    type: comparison
    targets:
    - contentRequirements/2
    status: answered
    answer: At a Series A-B funding stage (≈$434M cumulative through Series B), 40+ enterprise clients is above average for
      Chinese robotics startups. However, individual client revenue and deployment size are not disclosed, making the comparison
      qualitative. By unit count, AgiBot (5,100 units) and UBTECH (1,079 units) are ahead by 30–130×, though both are further
      along in their funding and go-to-market cycles.
