    0=concept to 10=mass production) and vertical (AI openness & research integration, 0=proprietary to 10=fully open-source,
    academic-led). Galaxea occupies the high-openness, low-production quadrant alongside Physical Intelligence; AgiBot and
    Unitree dominate the high-production quadrant; Figure AI and Boston Dynamics hold the high-production, lower-openness
    quadrant.'
