summary:
  headline: >-
    Galaxea AI has best-in-class academic credentials, a credible product roadmap, and genuine developer traction, but
    zero verified commercial revenue, a stretched ~$2.9B valuation implying >290x on 2025 guidance, and high
    geopolitical and disclosure risk that make it uninvestable without further transparency.
