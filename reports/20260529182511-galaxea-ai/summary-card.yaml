  topStrengths:
    - >-
      World-class founding team: four co-founders spanning Tsinghua, Berkeley, Stanford, and USC with dual active AI
      professorships — the only Chinese robotics startup with this academic depth.
    - >-
      Vertically integrated full-stack platform (hardware, VLA model, developer ecosystem) reduces dependency on
      third-party AI software and creates a potential data flywheel advantage.
    - >-
      Open-source momentum is real: G0 dataset exceeded 400,000 downloads within two months, 18+ academic research
      projects built on Galaxea hardware, and 5+ active OpenGalaxea repositories.
    - >-
      Aggressive pricing ($2,999 arm, $49,999–$69,999 humanoid) targets a volume market; A1Z arm is priced at ~10% of
      Franka Emika, lowering adoption friction in research settings.
    - >-
      Strong policy tailwind: China's 15th Five-Year Plan (2026–2030) designates embodied intelligence a priority
      sector, with 40+ state training centers and procurement mandates.
  topRisks:
    - >-
      Valuation conflict and disclosure gap: the 10x discrepancy between Yicai ($29B) and the CNY 20bn / ~$2.9B
      consensus, combined with no audited financials and no HKEX prospectus, leaves investors without a verified price
      anchor.
    - >-
      Zero commercial revenue in 2024; guided 2025 revenue of tens of millions of yuan ($3–10M) is management-only,
      implying the company remains entirely pre-commercial at the time of writing.
    - >-
      Geopolitical and export-control exposure: the American Security Robotics Act (March 2026) blocks US federal
      procurement, and US-China tech decoupling threatens access to NVIDIA Jetson compute and international
      institutional capital.
    - >-
      Intense competitive saturation: 140+ Chinese humanoid startups tracked by TrendForce; Unitree ($13,500 G1), AgiBot
      (5,100+ units shipped), and UBTECH (1,079 units) all have volume and pricing advantages; R1 Pro at $69,999 is 5.2x
      Unitree G1.
    - >-
      Customer evidence is thin: only two clients (Physical Intelligence, Stanford University) independently confirmed;
      40+ client count is company-claimed and unverified; all industrial clients withheld under NDA.
  unresolvedGaps:
    - >-
      Audited revenue, gross margin, burn rate, and cash runway for 2024–2026 are not public; without these, valuation
      diligence cannot be completed.
    - >-
      The correct post-money valuation after the Series B+ remains disputed — the $29B vs. $2.9B discrepancy must be
      resolved before any investment decision, ideally via cap table or term sheet review.
    - >-
      HKEX prospectus filing status and IPO timeline are unconfirmed; the $500M target figure appears in a single press
      report with no official corroboration.
    - >-
      2026 headcount is unknown; the 120-person August 2025 figure may be significantly stale given ~$290M injected in
      April 2026.
    - >-
      Production delivery scale is unverified — "thousand-unit order validation" is company-claimed and no independent
      delivery confirmation has been identified.
    - >-
      G0 Plus non-commercial licence restriction limits monetisation pathways; licensing strategy for commercial use has
      not been disclosed.
    - >-
      Gross margin on hardware is estimated as thin-to-negative at current pricing vs. BOM estimates of $40,000–$80,000
      for humanoids; management has not disclosed cost structure.
