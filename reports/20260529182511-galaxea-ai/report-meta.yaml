companyProfile:
  summary: >-
    Galaxea AI (星海图; legal name Galaxea (Beijing) Artificial Intelligence Technology Co., Ltd.)
    is a Beijing-headquartered, Suzhou-manufacturing embodied intelligence company founded in September 2023.
    The company builds a full-stack robotics platform spanning hardware (A1/A1Z manipulator arms, R1 Lite /
    R1 / R1 Pro wheeled humanoids), proprietary Vision-Language-Action (VLA) foundation models (G0 and
    G0 Plus), and an open-source developer ecosystem under the OpenGalaxea organisation. Its stated mission —
    "10 billion robots for 10 billion people" — reflects an ambition to deploy embodied AI at planetary scale,
    beginning with enterprise R&D and industrial pilot customers and targeting eventual home deployment. By
    April 2026 the company had raised an estimated ~$724M across seven tranches, reaching an approximately
    $2.9B post-money valuation after its Series B+ close.
  foundedDate: "2023-09-01"
  founders:
    - name: Gao Jiyang
      role: CEO
      background: PhD Computer Vision, USC (3.5 years, fastest in IRIS Lab's 35-year history); previously AI software engineer at Waymo and Momenta.
      claimRefs: [CO006, CO007]
    - name: Zhao Hang
      role: Co-Chief Science Officer
      background: MIT-affiliated academic; MARS Lab director at Tsinghua IIIS; former Waymo engineer; Forbes Science Under 30.
      claimRefs: [CO008, CO009]
    - name: Xu Huazhe
      role: Co-Chief Science Officer
      background: PhD UC Berkeley BAIR; postdoc Stanford Vision & Learning Lab; directs Tsinghua Embodied AI Lab (TEA Lab).
      claimRefs: [CO010, CO011]
    - name: Li Tianwei
      role: COO
      background: MSc University College London; former Momenta colleague of Gao Jiyang.
      claimRefs: [CO011]
  foundingLocation: Beijing, China
  headquarters: Beijing, China
  productSummary: >-
    Galaxea sells four hardware SKUs — the A1Z 6-DOF manipulator arm ($2,999–$3,999), R1 Lite
    (data-collection research platform), R1 wheeled humanoid ($49,999), and R1 Pro 7-DOF arm variant
    ($69,999) — plus the G0/G0 Plus VLA foundation model (open-source with non-commercial licence).
    An all-in-one VLA unit and the DEXO dexterous hand debuted at CES 2026. The developer ecosystem
    (GitHub/Hugging Face) hosts 500+ hours of open-world teleoperation data with 400,000+ downloads.
  customerFocus: Enterprise research labs, universities, industrial manufacturers (automotive, logistics, warehousing), and AI developer community.
  businessModel: Hardware product sales (arms, humanoids); developer/research licensing; long-term ambition of subscription software and data licensing.
  stage: Series B+
  fundingStatus: >-
