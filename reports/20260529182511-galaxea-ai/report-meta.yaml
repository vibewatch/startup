    Hong Kong targeting ~$500M reportedly in planning as of May 2026.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO006, CO007, CO008, CO009, CO011, CO012, CO027, CV001, CV002]
summary:
  headline: >-
    Galaxea AI has best-in-class academic credentials, a credible product roadmap, and genuine developer
    traction, but zero verified commercial revenue, a stretched ~$2.9B valuation implying >290x on
    2025 guidance, and high geopolitical and disclosure risk that make it uninvestable without further
    transparency.
