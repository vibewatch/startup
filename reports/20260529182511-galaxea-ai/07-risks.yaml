chapter:
  number: 7
  title: Risks
  summary: >-
    Galaxea AI's risk profile is high on five interconnected dimensions that together threaten the investment
    thesis: (1) geopolitical and export-control escalation — the American Security Robotics Act (March 2026)
    blocks US federal procurement and a broader US-China tech-decoupling trend threatens access to NVIDIA
    Jetson compute and international capital; (2) disclosure and valuation risk — a 10x discrepancy between
    Yicai's reported $29B and third-party databases' $2.9B valuation, combined with no audited financials and
    no HKEX prospectus filed as of the report date, leaves investors without a verified price anchor;
    (3) competitive saturation — TrendForce classifies Galaxea in the second tier of China's 140+ humanoid
    robot manufacturers, with AgiBot and Unitree each capturing approximately 40% of shipments, BYD targeting
    $27,600 humanoid pricing that would undercut Galaxea's $69,999 R1 Pro, and Physical Intelligence's pi0.7
    open-sourcing threatening the G0 VLA moat; (4) financial and burn risk — zero revenue in 2024, thin-to-
    negative hardware gross margins, and an estimated annual burn exceeding $100M against a pre-IPO capital
    raise schedule; and (5) regulatory compliance obligations — China's HEIS 2026 safety standard system,
    undisclosed safety certifications, and the G0 Plus non-commercial license structurally limiting developer-
    to-revenue conversion. Key-person concentration in CEO Gao Jiyang and dual-professor co-CSOs adds
    governance fragility at a critical scale-up inflection point.

sections:
  - id: geopolitical-export-control-risk
    title: Geopolitical & Export-Control Risk
    body: >-
      Galaxea AI faces a deteriorating geopolitical operating environment that creates material barriers
      to its stated global expansion goals. The most acute near-term legal risk is the American Security
      Robotics Act introduced in the US Senate on March 26, 2026 by Senators Tom Cotton (R-AR) and
      Chuck Schumer (D-NY), with a companion bill introduced by Representative Elise Stefanik (R-NY)
      in the House. The bipartisan bill would prohibit US federal agencies from purchasing or operating
      unmanned ground vehicles — including humanoid robots — manufactured by Chinese companies, and
      would bar the use of any federal funds for such systems. Limited exemptions apply only to military
      and law enforcement for controlled research purposes, provided the robots cannot transmit data to
      or receive data from China. The sponsors have characterized Chinese humanoid robots as a national
      security risk capable of surveilling US facilities and transmitting data to China, as well as
      being potentially subject to remote control by adversary actors. While the Act has not yet passed
      into law, the bipartisan composition of its sponsors — combining the third-most powerful Republican
      in the Senate with the top Senate Democrat — signals unusually strong legislative momentum. Even
      before passage, the bill's introduction will structurally deter US federal procurement officers
      and defense-adjacent enterprise customers from evaluating Galaxea robots, chilling a segment of
      the addressable market that includes research labs, defense contractors, and national laboratories.

      At the semiconductor layer, US export controls have progressively restricted China's access to
      advanced AI compute. NVIDIA's H20 processor — a chip designed specifically to comply with prior
      export control thresholds — was blocked for Chinese customers in April 2025 under additional
      curbs. Galaxea's R1 and R1 Pro robots are shipped with NVIDIA Jetson AGX Orin modules at 200
      TOPS; if more capable Jetson generations are classified as restricted technology, Galaxea would
      face a supply disruption forcing migration to domestic Chinese alternatives (Huawei Ascend,
      Cambricon) at a material performance degradation. US House legislation in April 2026 is actively
      targeting AI compute export loopholes including cloud-mediated training — directly relevant to
      Galaxea's open-source dataset training stack. A broader AI export control regime covering VLA
      model weights or robotics software would compound the risk.

      China's own export controls on rare earth minerals — including samarium, gadolinium, and lutetium
      compounds introduced in 2026 via the Import-Export Licensing Catalogue — represent a double-edged
      risk for Galaxea. As a Chinese-domiciled manufacturer, Galaxea benefits from unrestricted domestic
      access to the rare earth magnets essential for its actuators, while Western humanoid competitors
      face licensing delays and price spikes. However, if Galaxea expands manufacturing capacity for
      export markets, the rare earth licensing regime could add compliance complexity, and any tit-for-tat
      escalation that further restricts Chinese robot exports would directly impair Galaxea's global
      distribution plans. Tesla's CEO Elon Musk publicly acknowledged in April 2025 that China's rare
      earth controls had disrupted Optimus production, illustrating the severity of the mechanism for
      any non-Chinese manufacturer.

      CNBC's April 2026 reporting confirms that US-China tensions have substantially chilled cross-
      border investment: large US pension funds have reduced exposure to Chinese AI and robotics
      startups, with Middle Eastern sovereign funds now filling the capital gap. This investor
      fragmentation increases Galaxea's cost of capital from Western limited partners and narrows the
      universe of strategic acquirers able to execute a cross-border transaction at exit.
