callouts:
  - calloutType: risk
    title: "Thesis-Break: Valuation Opacity + IPO Failure"
    body: >-
      The 10x discrepancy between reported valuations ($2.9B vs. $29B) and the absence of a filed
      HKEX prospectus as of May 29, 2026 create a compounding governance risk: investors cannot
      verify the actual capitalization, preference overhang, or financial health of the company.
      If the IPO is delayed beyond Q1 2027 or withdrawn, the private valuation mark becomes
      unverifiable, existing investors face mark-to-market uncertainty, and the primary exit path
      for Series A/B/B+ investors is eliminated. This cluster constitutes the most actionable
      thesis-break trigger for any investor entering the company at the current reported valuation.
    claimRefs:
      - CR010
      - CR011
      - CR014
      - CR015
      - CR039

  - calloutType: risk
    title: "Structural Competitive Risk: BYD + Physical Intelligence Sandwich"
    body: >-
      Galaxea faces a pricing attack from below (BYD targeting $27,600 humanoid vs. Galaxea R1 Pro
      at $69,999) and a software/ecosystem attack from above (Physical Intelligence pi0.7 open-sourcing
      compositional generalization, threatening the G0 VLA moat). Unlike most competitive risks that
      arrive sequentially, these two vectors are occurring simultaneously in the 2026 commercialization
      window — when Galaxea needs to convert pilots to production orders. If hardware price falls and
      the software differentiator is commoditized concurrently, Galaxea's current positioning as a
      premium full-stack platform becomes difficult to defend.
    claimRefs:
      - CR030
      - CR037
      - CR023
      - CR038

