  - id: leadership-and-founding-team
    title: Leadership & Founding Team
    body: >-
      Galaxea AI was founded by four individuals with complementary AI research and industry backgrounds,
      three of whom are Tsinghua University alumni. CEO Gao Jiyang (高继扬, b. 1992) holds a BS in
      Electronics Engineering from Tsinghua and completed his PhD in Computer Vision at the University
      of Southern California in just 3.5 years — the fastest in the 35-year history of USC's IRIS Lab.
      He subsequently worked as an AI software engineer at Waymo (Google's autonomous driving unit) and
      Momenta, bringing deep AV perception expertise to robotics. Co-Chief Science Officer Zhao Hang
      (赵航) holds credentials from MIT-affiliated institutions and is an Assistant Professor and director
      of the MARS Lab at Tsinghua's Institute for Interdisciplinary Information Sciences; he previously
      worked at Waymo and was recognised on Forbes' Science Under 30 list. Co-CSO Xu Huazhe (徐华哲,
      b. ~1993) earned his PhD from UC Berkeley AI Research (BAIR) and completed a postdoc at Stanford
      University's Vision & Learning Lab before returning to Tsinghua as an Assistant Professor directing
      the Tsinghua Embodied AI Lab (TEA Lab). Co-founder and COO Li Tianwei holds a master's degree from
      University College London and is a former Momenta colleague of Gao Jiyang. Galaxea claims to be the
      only Chinese robotics startup simultaneously co-led by two AI professors. As of August 2025 headcount
      stood at approximately 120, with a target of 200 by year-end 2025.
