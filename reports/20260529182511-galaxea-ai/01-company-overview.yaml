  - id: products-and-commercial-scale
    title: Product Portfolio & Commercial Scale
    body: >-
      Galaxea AI's hardware portfolio centres on the A1 robot arm and the R1 series wheeled humanoids.
      The A1 is a 6-DOF force-controlled manipulator weighing ~6 kg, capable of a maximum end-effector
      linear speed of 10 m/s and acceleration of 40 m/s², with a peak payload between 3.5 kg (retail
      listings) and 5 kg (company documents); the A1XY variant is priced at $2,999–$3,999, approximately
      one-tenth the cost of a Franka Emika research arm. The standard R1 wheeled humanoid carries 24 DOF
      (6-DOF omnidirectional chassis + 4-DOF torso + 2×6-DOF A1 arms), stands 170 cm (extendable to
      200 cm), and is priced from ~$49,999. The R1 Pro upgrades to 26 DOF with dual 7-DOF A2 arms, a
      10 kg maximum payload, 96 kg weight, and costs ~$69,999; compute is an NVIDIA Jetson AGX Orin
      32GB (200 TOPS). The R1 Lite (wheeled dual-arm mobile platform) and DEXO dexterous hand (0.1N
      tactile sensing, 1 kg fingertip force per finger) debuted at CES 2026 in January. On the software
      side, the G0 end-to-end VLA model was launched and open-sourced in August 2025; G0 Plus ("slow
      thinking, fast execution" dual-system) followed in January 2026; and the Fast-WAM world model
      was released in 2026. The OpenGalaxea ecosystem on GitHub and Hugging Face hosts five or more
      active open-source repositories. As of August 2025, Galaxea had 40+ enterprise clients including
      Huawei Cloud, Volkswagen, Haier, Samsung, ByteDance, Physical Intelligence, Stanford University,
      and MIT. Several thousand units were reported on order as of February 2026, with plans for
      10,000-unit mass production in 2026. The company recorded no revenue in 2024, expected tens of
      millions of yuan in 2025 sales, and targeted profitability in 2026.
