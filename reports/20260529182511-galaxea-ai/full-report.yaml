  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio & SKU Map
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI sells four distinct products grouped into two hardware families and one software/model unit.
              The robotic-arm family consists of the A1Z — a 6-DOF, 5 kg, force-controlled desktop arm priced at $2,999
              — which is sold both standalone and embedded as the A1X variant inside the R1 Lite. The mobile
              manipulation family spans three wheeled-humanoid configurations: R1 Lite (23 DOF, 128 cm, $39,999), R1 (24
              DOF, 170 cm, ~$49,999), and R1 Pro (26 DOF, 170 cm, $69,999). Across all three R1 variants the upper body
              uses dual Galaxea A-series arms on a four-DOF torso, while the lower body is a three-wheel vector-drive
              chassis capable of 1.5 m/s. The key design choice separating the variants is arm DOF (6 vs 7) and compute
              package: R1 Lite and R1 use the NVIDIA Jetson AGX Orin 32 GB at 200 TOPS, while the standard R1 spec page
              claims an optional 550 TOPS configuration. R1 Pro's dual 7-DOF A2 arms add integrated force sensors and
              deliver a higher maximum combined payload of 10 kg versus 5 kg on R1 Lite and R1. Beyond hardware,
              Galaxea's most strategically differentiated offering is the G0 VLA unit — a pre-trained, out-of-the-box
              VLA experience pre-loaded on the R1 Pro and R1 Lite. The G0Plus 3B checkpoint ships as a deployment-ready
              pick-and-place model, while G0Tiny (250 M parameters) enables on-device inference at up to 10 Hz via
              TensorRT. All products are manufactured in Suzhou and ship globally; lead times and exact unit
              availability are managed through direct inquiry with Galaxea Dynamics.
