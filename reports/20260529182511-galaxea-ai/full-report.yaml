  - id: FR002
    title: Galaxea AI Risk Transmission Map
    type: dag
    layout: wide
    summary: >-
      Directed acyclic graph showing how Galaxea AI's five primary risk categories transmit through intermediate
      operating outcomes to compress revenue, margin, financing access, and exit valuation.
    data:
      nodes:
        - id: r-geopolitical
          label: Geopolitical / Export-Control Risk
          detail: American Security Robotics Act; NVIDIA Jetson export controls; US investor chilling
        - id: r-competitive
          label: Competitive Saturation Risk
          detail: Second-tier ranking; BYD price target; Physical Intelligence pi0.7; 140+ entrants
        - id: r-regulatory
          label: Regulatory / Legal / Disclosure Risk
          detail: HEIS 2026; G0 Plus non-commercial license; no HKEX prospectus filed
        - id: r-operational
          label: Operational / Supply-Chain Risk
          detail: 10K unit manufacturing transition; Lens Technology single-source; NVIDIA dependency
        - id: r-governance
          label: Financial / Governance Risk
          detail: Zero 2024 revenue; valuation discrepancy; board opacity; key-person concentration
        - id: i-tam
          label: TAM Contraction
          detail: US market excluded; EU certification gap; enterprise chilling effect
        - id: i-pricing
          label: Pricing Pressure
          detail: BYD forces ASP down; margin compression; commoditization
        - id: i-manufacturing
          label: Production Delay / Volume Miss
          detail: 10K unit target at risk; quality issues; compute disruption
        - id: i-trust
          label: Customer / Partner Trust Erosion
          detail: Safety cert gap; PI ecosystem displacement; pilot-to-production stall
        - id: i-valuation
          label: Valuation Uncertainty
          detail: 10x discrepancy; no audited financials; no prospectus
        - id: o-revenue
          label: Revenue Miss
          detail: Below tens-of-millions-of-yuan 2025 guidance; production delayed
        - id: o-margin
          label: Gross Margin Negative
          detail: BOM $40K-80K vs $69.9K ASP; no scale offset yet
        - id: o-financing
          label: Financing Constraint
          detail: Down-round risk; Western LP withdrawal; runway below 18 months
        - id: o-ipo
          label: IPO Failure or Delay
          detail: No prospectus; auditor not confirmed; market window uncertain
        - id: o-exit
          label: Exit Valuation Compression
          detail: Strategic acquirers limited by geopolitics; IPO price below expectations
      edges:
        - from: r-geopolitical
          label: blocks US procurement
          to: i-tam
        - from: r-geopolitical
          label: restricts compute access
          to: i-manufacturing
