  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity & Business Model
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI (星海图; legal name Galaxea (Beijing) Artificial Intelligence Technology Co., Ltd. post January
              2026 equity reform) was founded in September 2023 in Beijing, China, with a manufacturing base in Suzhou.
              The company's stated mission is "10 billion robots for 10 billion people" — reflecting an ambition to
              deploy embodied AI robots at planetary scale. Galaxea operates as a full-stack developer and manufacturer:
              it designs its own robot hardware (arms, wheeled humanoids), trains proprietary Vision-Language-Action
              (VLA) foundation models on real-world data, and operates an open-source developer platform (OpenGalaxea on
              GitHub and Hugging Face). The company's design philosophy is summarised as "Intelligence Defines the Body"
              — the contention that hardware form should follow the demands of AI-first task execution rather than
              preceding it. Products are positioned primarily at enterprise research labs, industrial clients, and
              developers, with consumer home use described as a medium-term ambition. Galaxea is classified as a
              private, pre-IPO company; as of May 2026, reports indicate plans for a Hong Kong listing targeting $500M
              in proceeds.
