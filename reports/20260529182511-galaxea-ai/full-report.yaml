      - number: '7.4'
        title: Operational & Supply-Chain Risk
        blocks:
          - type: paragraph
            body: >-
              Galaxea's planned transition to 10,000-unit annual production in 2026 is the single highest-
              execution-risk milestone in its near-term roadmap. The company has disclosed a manufacturing partnership
              with Lens Technology (a HKEX-listed glass and optics manufacturer), which is also a Series B+ round
              participant — creating a dual investor-supplier relationship that adds governance complexity if the
              manufacturing relationship requires renegotiation. The transition from sub-100-unit prototype volumes to
              10,000-unit production requires automated assembly lines, standardized quality assurance for 100+
              components per robot, tolerance management for precision actuators, and a field support network capable of
              maintaining robots already deployed. Current humanoid robots from all manufacturers require heavily manual
              assembly, and industry analysis notes that robot actuators represent up to 60% of BOM cost with
              small-batch, high-cost, low-yield characteristics.

              The NVIDIA Jetson AGX Orin dependency creates a technology risk point under current US export control
              trajectories. Galaxea's R1 series ships with Jetson AGX Orin 32 GB (200 TOPS) as standard and references
              an optional 550 TOPS configuration. US export controls have been tightening progressively on compute
              thresholds; if the Jetson AGX Orin is reclassified or if a next-generation Jetson module Galaxea plans to
              adopt exceeds restricted thresholds, the company would need to migrate to domestic alternatives. Huawei
              Ascend and domestic compute options remain behind Nvidia in performance-per-watt and ecosystem maturity
              for robotics inference, meaning a forced transition would impose both product performance regression and
              re-engineering costs.

              China controls approximately 85% of global humanoid robot production and supply chains, including 90%+ of
              rare earth magnet refining — giving Galaxea structural advantage in domestic component sourcing relative
              to Western competitors. However, quality consistency at production scale, sensor fusion reliability for
              real-world deployment, and field service infrastructure for robots operating 24/7 in industrial
              environments represent unresolved operational gaps. No mean-time-between-failure data, field uptime
              metrics, or maintenance cost per unit has been publicly disclosed by Galaxea. Industry analysis of HEIS
              2026 noted that the standard was partly motivated by documented industrial robot incidents, highlighting
              the real-world liability exposure from insufficient safety controls in pre-certified humanoid deployments.

              Lens Technology's participation in the B+ round as both an investor and manufacturing partner creates a
              structural conflict-of-interest risk: if Galaxea needs to diversify its manufacturing base to reduce
              dependency, negotiating with a round investor creates board dynamics that may impede optimal supply-chain
              decisions. Similarly, Walden International and CICC Capital as financial investors in the B+ round create
              a capital structure that ties fundraising leverage to manufacturing partnership decisions.
