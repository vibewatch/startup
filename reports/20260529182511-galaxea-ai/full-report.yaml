  - id: TV005
    title: Thesis-Break and Monitoring Triggers
    columns:
      - Trigger
      - Threshold / Event
      - Monitoring Signal
      - Action Implication
    rows:
      - - Production ramp failure
        - Year-end 2026 cumulative units shipped below 500
        - Quarterly update from company; supply-chain partner (Lens Technology) public disclosures
        - Reduce position; base case collapses to bear; IPO window likely closes
      - - Valuation confirmed at $29B
        - Audited cap table or prospectus shows post-B+ valuation of CNY 200bn, not 20bn
        - HKEX prospectus filing; independent data-room verification
        - Re-evaluate thesis; current price would be deeply discounted if $29B confirmed
      - - Valuation confirmed much below $2.9B
        - Audited cap table shows post-B+ significantly below $2.9B (e.g., $1.4B same as Series B)
        - HKEX prospectus filing; secondary market price discovery
        - Down-round signal; prior thesis invalid; immediate re-assessment required
      - - US geopolitical escalation
        - New US executive order or legislation banning investment in or importation of Galaxea hardware
        - OFAC/Commerce BIS watch lists; annual NDAA legislation
        - Reduce or exit; IPO market access severely constrained; US institutional participation blocked
      - - Leadership departure
        - CEO Gao Jiyang or co-CSOs Zhao Hang / Xu Huazhe announce exit
        - LinkedIn, company official channels, Chinese financial media
        - Pause; founding-team continuity is a primary valuation driver at this stage
      - - IPO withdrawn or postponed over 12 months
        - No HKEX prospectus filing by Q4 2026; or formal announcement of IPO withdrawal
        - HKEX new listing announcements; company official communications
        - Liquidity risk rises sharply; track but do not add capital; seek secondary bid
      - - Competing platform wins Physical Intelligence / NVIDIA contracts
        - PI or NVIDIA publicly switches robot hardware base to a competitor (e.g., Figure, Fourier)
        - PI/NVIDIA press releases, academic papers citing hardware
        - Partial thesis impairment; developer-market moat questioned
    notes: >-
      Triggers are qualitative thresholds based on publicly observable signals. All are point-in-time indicators and
      should be monitored at least quarterly. None of these triggers had fired as of the report date (May 29, 2026).
    claimRefs:
      - CV034
      - CV035
      - CV009
      - CV037
      - CV039
      - CV042
      - CV044
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Diligence Path / Owner
    rows:
      - - Audited financials
        - FY2024 and H1 2025 audited financial statements (P&L, balance sheet, cash flow)
        - The only way to verify whether 2025 revenue guidance is accurate and what gross margin looks like
        - Request directly from company in a data-room; or wait for HKEX prospectus
      - - Cap table and preference stack
        - Full capitalisation table showing all round valuations, liquidation preferences, anti-dilution provisions
        - Determines whether $2.9B post-money is correct and how preference stack affects common-holder returns
        - Data-room request; HKEX prospectus will include this
      - - Production backlog verification
        - Independent confirmation of thousand-unit order validation binding purchase orders
        - Distinguishes letter-of-intent demand from hard backlog; critical for supply-chain planning
        - Customer reference calls; Lens Technology supply-chain disclosure
      - - Valuation discrepancy resolution
        - Official written clarification from Galaxea of whether post-B+ valuation is CNY 20bn or CNY 200bn
        - The discrepancy is the single largest governance concern; HKEX listing sponsor will require resolution
        - Written representation from CFO / counsel; law firm opinion if needed
      - - US market access legal opinion
        - Legal memo on American Security Robotics Act exposure for Galaxea hardware and data contracts
        - Determines the size of the addressable market and risk of mid-contract disruption
        - US export-control counsel; company legal team
      - - Unit economics at pilot scale
        - Bill-of-materials breakdown, direct labour, warranty provision, and actual ASP for first deliveries
        - At claimed ASP of $44,500-$69,999 vs. BOM estimates of $40,000-$80,000, gross margin could be negative
        - Manufacturing facility audit; supplier pricing verification
    notes: >-
      Priority order reflects urgency for a buy decision. Items 1 and 4 are blocking: no buy recommendation until both
      are resolved. Items 2, 3, 5, and 6 are material but can be addressed during normal IPO due diligence.
    claimRefs:
      - CV005
      - CV006
      - CV009
      - CV034
      - CV035
      - CV036
