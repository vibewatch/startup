      - number: '1.3'
        title: Funding History & Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI has raised capital across at least seven disclosed tranches since founding, progressing from
              angel to Series B+ in under 30 months — an unusually rapid pace even by Chinese AI startup standards. The
              angel round (January 2024, tens of millions USD) was led by IDG Capital and Baidu Ventures, with MiHoYo
              (via Argo Technology), GSR Ventures, and the Beijing Robotics Industry Development Investment Fund also
              participating at various early stages. A Pre-A round (November 2024, RMB 200M+) was led by Hillhouse
              Capital and Ant Group, followed by a Series A (February 2025, ~RMB 300M) again led by Ant Group. Summer
              2025 saw additional A4 and A5 closes (combined >$100M), bringing cumulative funding near $210M and pushing
              the valuation to $700M, with Capital Today, Meituan Long-Z Investments, Ant Group, IDG, Baidu Ventures, GL
              Ventures, and FunPlus participating. The Series B (February 2026, ~RMB 1bn / ~$144M) introduced Jinding
              Capital, BAIC Capital, Bihong Investment, Loyal Valley Capital, Qianhai Ark, and InnoVen Capital, with all
              major existing shareholders maintaining or increasing positions; this round achieved unicorn status at
              ~RMB 10bn (~$1.4B) valuation. A subsequent Series B+ (April 2, 2026, ~RMB 2bn / ~$290M) attracted
              industrial investors Walden International, Lens Technology (a key supply-chain partner), Xixin Investment,
              Financial Street Capital, and CICC Capital funds. The post-B+ valuation is disputed: Yicai reported CNY
              200bn (~$29B) per company announcement, while InforCapital and PitchBook cite ~$2.9B — a tenfold
              discrepancy that remains unverified from audited sources. Cumulative capital raised through the Series B
              is approximately $434M (RMB 3bn); including B+, total approaches $724M. An IPO in Hong Kong targeting
              ~$500M was reportedly in planning as of May 2026.
