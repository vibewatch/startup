  - id: FO002
    title: Galaxea AI Company Snapshot — Logic Map
    type: flow
    layout: standard
    summary: >-
      How Galaxea AI's founding team, technology stack, customer traction, capital, and competitive position
      interconnect to form the company's current value and risk profile.
    data:
      nodes:
        - id: founding-team
          label: World-Class Founding Team
          detail: >-
            Gao Jiyang (CEO/Waymo/USC), Zhao Hang (Co-CSO/Tsinghua/Waymo), Xu Huazhe
            (Co-CSO/Berkeley/Stanford/Tsinghua), Li Tianwei (COO/UCL/Momenta). Unique blend of AV industry and academic
            AI expertise.
          tone: positive
        - id: research-base
          label: Embodied AI Foundation Models
          detail: >-
            G0 VLA model (open-sourced Aug 2025), G0 Plus dual-system (Jan 2026), Fast-WAM world model (2026). Trained
            on real-world data; end-to-end architecture.
          tone: positive
        - id: hw-stack
          label: Hardware Product Stack
          detail: >-
            A1 robot arm (6-DOF, $3K-$4K), R1 wheeled humanoid ($50K), R1 Pro ($70K), R1 Lite (mobile), DEXO dexterous
            hand. Full-stack in-house development.
          tone: positive
        - id: data-flywheel
          label: Real-World Data Flywheel
          detail: >-
            Each deployed robot generates real-world training data fed back into model improvement. Galaxea argues
            real-data approach beats simulation-heavy methods.
          tone: positive
        - id: dev-ecosystem
          label: Open Developer Ecosystem
          detail: >-
            OpenGalaxea GitHub (5+ active repos); Hugging Face org; open-source VLA models and datasets. Attracts
            research partners; accelerates third-party integrations.
          tone: positive
        - id: customers
          label: 40+ Enterprise Clients
          detail: >-
            Huawei Cloud, Volkswagen, Haier, Samsung, ByteDance, Physical Intelligence, Stanford, MIT, and others.
            Validation across US and Chinese academic and industrial accounts.
          tone: positive
        - id: capital
          label: ~$724M Capital Raised
          detail: >-
            Seven disclosed tranches from Angel to Series B+ (2024-2026). Blue-chip cap table includes Ant Group,
            Hillhouse, IDG, Capital Today, Meituan, GL Ventures, Lens Technology.
          tone: positive
        - id: revenue-gap
          label: Nascent Revenue Stage
          detail: >-
            Zero commercial revenue in 2024; tens of millions RMB targeted for 2025. Revenue profile lags capital raised
            by wide margin.
          tone: warning
        - id: competition
          label: Intense Domestic Competition
          detail: >-
            30-40 Chinese humanoid robot startups; key rivals: Unitree ($1.7B), AgiBot, Galbot, Fourier Intelligence.
            Market consolidation predicted by co-founders.
          tone: negative
        - id: valuation-risk
          label: Disputed Valuation
          detail: >-
            Post-B+ valuation disputed: $29B (Yicai/company) vs ~$2.9B (InforCapital/PitchBook). Tenfold discrepancy
            unresolved; no audited verification.
          tone: negative
        - id: market-target
          label: Target Markets
          detail: >-
            Primary: intelligent manufacturing, logistics, commercial services (2026). Future: consumer home use (3-10
            year horizon). R1 priced for enterprise R&D labs.
          tone: neutral
        - id: ipo-path
          label: Potential Hong Kong IPO
          detail: >-
            Equity reform in Jan 2026 converted company to joint-stock. GMT8 Press (May 2026) reports planned Hong Kong
            listing targeting $500M. Not officially confirmed.
          tone: neutral
