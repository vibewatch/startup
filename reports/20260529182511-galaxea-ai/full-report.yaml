      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: World-Class Founding Team with Full-Stack Credentials
            body: >-
              The four co-founders combine Tsinghua (3 of 4), Berkeley, Stanford, and USC doctorates with hands-on
              autonomous-driving industry experience from Waymo and Momenta — arguably the strongest team pedigree of
              any Chinese embodied-AI startup. The presence of two active Tsinghua AI professors (Zhao Hang and Xu
              Huazhe) as co-CSOs provides both research depth and continuous access to top graduate talent in a highly
              competitive recruitment market.
            calloutType: strength
            claimRefs:
