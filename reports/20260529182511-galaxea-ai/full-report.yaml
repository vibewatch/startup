      - number: '1.5'
        title: Corporate Milestones & Risk Signals
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI has achieved a remarkable sequence of financing and product milestones in its first 30 months
              of existence. Key corporate events are detailed in the milestone table below. Beyond the positive
              trajectory, several risk signals warrant attention. First, the $29B Series B+ valuation reported by Yicai
              is disputed by third-party trackers (InforCapital, PitchBook) by a factor of roughly ten; the discrepancy
              has not been independently resolved and may reflect a forward-looking cap or data entry error. Second, the
              company reported zero revenue in 2024 and only nascent sales in 2025, creating a significant gap between
              the capital raised (~$724M) and demonstrated commercial output; without audited financials this is a
              material uncertainty. Third, Galaxea faces intense competition from an estimated 30–40 Chinese humanoid
              robot startups, including Unitree Robotics (~$1.7B valuation), AgiBot, Galbot, Fourier Intelligence, and
              LimX Dynamics. Co-founder Xu Huazhe himself acknowledged in Forbes that "there may be too many humanoid
              robot companies in China right now" and predicted consolidation within three to five years. Fourth, the
              January 2026 conversion from a limited liability company to a joint-stock structure signals IPO
              preparation but also concentrates governance risk during a period of rapid scaling. No lawsuits,
              regulatory sanctions, layoffs, or leadership departures were identified in public sources as of the report
              date.
