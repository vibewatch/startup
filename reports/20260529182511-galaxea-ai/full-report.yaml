      - number: '2.2'
        title: Market Sizing and Analyst Estimates
        blocks:
          - type: paragraph
            body: >-
              Analyst forecasts for the global humanoid robot market by 2030 span a wide range — from $11B (BCC
              Research, hardware-focused) to $15.3B (MarketsandMarkets, bottom-up) to $39B (TechRT / Business Research
              Company, inclusive of AI platform layer) — reflecting fundamentally different scope definitions and
              adoption assumptions. Goldman Sachs, using a labour-shortage lens, sets a base-case of at least $6B in
              10–15 years (from 2023/24) with a revised 2035 estimate of $38B and a blue-sky scenario of $154B if every
              adoption barrier is overcome. Grand View Research places the broader embodied AI market (including
              software) at $4.7B in 2025, growing to $67.6B by 2033 at roughly 41% CAGR. Global humanoid shipments
              surpassed 18,000 units in 2025 (508% year-on-year growth), with China accounting for over 80% of those
              installations. China's own market is projected to exceed 100 billion RMB (~$14.2B) by 2030. TrendForce
              estimates China's humanoid output will surge 94% in 2026, while AinChina projects total 2026 China
              shipments of 62,500–200,000 units depending on the scenario. These divergent forecasts make precise
              SAM/SOM estimation unreliable; the sizing table below preserves source diversity and highlights
              methodology differences rather than synthesizing a single figure.
