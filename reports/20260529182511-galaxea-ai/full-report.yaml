            title: Valuation Dispute — $2.9B vs $29B Is a 10× Gap With No Resolution
            body: >-
              Yicai (a credible Shanghai media outlet) reported the Series B+ post-money valuation as "CNY200 billion
              (USD29 billion)." All independent third-party databases (InforCapital, PremierAlts) and Chinese-language
              media consistently cite "突破200亿元" (exceeds CNY 20 billion, ~$2.78B). The most likely explanation is a
              bilingual transcription error — "200亿" (200 units of 100 million) equals CNY 20 billion, not CNY 200
              billion. Investors relying on the $29B figure for multiple analysis would overestimate the valuation by
              10×. Neither figure has been confirmed by audited document. Any diligence process must resolve this before
              using valuation in any modelling exercise.
