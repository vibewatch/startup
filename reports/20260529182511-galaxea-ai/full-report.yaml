      - number: '4.5'
        title: Financial Verdict & Investment Diligence
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI's financial profile in mid-2026 is that of an ambitious pre-commercial robotics company whose
              capital base significantly exceeds its demonstrated revenue. The company's strengths are real: a
              diversified investor base spanning industrial, state-backed, and tier-1 venture capital; a credible
              hardware product in commercial production; and a strategic position in the emerging embodied AI foundation
              model market. However, the diligence blockers are numerous and material. First, true gross margins on the
              R1 series at current volumes are unknown and likely very thin or negative given BOM estimates. Second, the
              2026 profitability target appears optimistic without a rapid step-change in unit volumes (to 10,000+) that
              has not yet been operationally demonstrated. Third, the valuation dispute ($2.9B vs $29B) represents a
              fundamental gap in publicly verifiable financial data. Fourth, the cost of real-world data collection,
              dual-track model development, and manufacturing scale-up creates a high and growing burn that is not
              offset by current revenue. Fifth, no HKEX prospectus or audited financials exist against which to validate
              the funding and revenue claims. The recommended diligence path is: (1) obtain audited 2024–2025 financial
              statements via an NDA data room; (2) request a confirmed cap table and option pool structure; (3) request
