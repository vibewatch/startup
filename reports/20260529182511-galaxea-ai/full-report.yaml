  - id: FE001
    title: Product architecture map
    type: stack
    layout: standard
    summary: >-
      Galaxea's product stack from physical actuators at the base through perception, compute, and software to
      foundation-model intelligence at the top. Each layer shows the key components, vendors, and how they integrate
      across the R1 series.
    data:
      layers:
        - label: Foundation Model Layer (G0 Dual-System VLA)
          detail: >-
            G0-VLM (System 2 slow planner, ~1 Hz, PaliGemma-3B / proprietary fine-tune) + G0-VLA (System 1 fast
            executor, ~10 Hz, flow-matching action head); G0Tiny (250M, SmolVLM2) for edge. Trained via 3-stage
            curriculum on Galaxea Open-World Dataset (100K trajectories, 500+ hrs). Non-commercial G0Plus licence
            applies from Jan 2026.
        - label: AI Inference & Deployment Runtime
          detail: >-
            EFMNode (Galaxea Embodied Deployment Node); TensorRT FP16 engine for G0Tiny on Jetson Orin;
            openpi-compatible pi0/pi0fast fine-tuning scripts; SwanLab training logging; Docker-based out-of-box demo
            packages (Pick Up Anything, Fold Towels, Handover Gift).
        - label: Software Middleware Layer
          detail: >-
            OS: Ubuntu 22.04; ROS2 Humble (EOL 2027); NVIDIA JetPack 6.0 on Orin; GalaxeaLeRobotToolkit (LeRobot v3.0
            fork, Apache-2.0); GalaxeaManipSim (30+ sim environments, 17 tasks, Diffusion Policy baseline). SDK for
            isomorphic teleop (LAN-based).
        - label: Compute & Sensor Fusion
          detail: >-
            NVIDIA Jetson AGX Orin 32GB (200 TOPS) on R1 Lite / R1 / R1 Pro; Intel Core i9 NUC (32GB RAM) as additional
            compute on some R1 Lite configs. Sensor fusion: stereo RGB (head), Intel RealSense D405 RGB-D (wrists), 5×
            monocular RGB (chassis), 360° LiDAR.
        - label: Perception Hardware
          detail: >-
            R1 Pro: 1× binocular RGB (head, 120mm baseline), 2× wrist depth cameras (optional), 5× chassis RGB, 1× 360°
            LiDAR; dual IMUs. R1 Lite adds stereo + dual RealSense D405. Force/torque sensors in A2 joints (R1 Pro);
            proprietary joint encoders in all arms.
        - label: Actuator & Kinematic Layer
          detail: >-
            A1 arm (6-DOF, 6kg, ±1mm, 48V): J1/J2 20Nm; A1X (6-DOF, force-controlled, 7-DOF per side on R1 Lite); A2 arm
            (7-DOF, force sensors, 10kg combined payload, R1 Pro); G1 parallel grippers (100N rated force, 0-100mm
            range); 4-DOF torso; 6-DOF 3-wheel vector-drive chassis (1.5 m/s max).
