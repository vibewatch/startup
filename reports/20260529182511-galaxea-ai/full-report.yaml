  - id: FV004
    title: Investment KPIs to Track
    type: kpi
    layout: standard
    summary: >-
      Eight key performance indicators that, once disclosed, would materially shift the investment recommendation from
      TRACK toward BUY or AVOID.
    data:
      items:
        - label: 2025 Audited Revenue
          value: 'Undisclosed (guided: ''tens of millions of yuan'')'
          note: BUY signal if >= CNY 100M ($14M); AVOID signal if < CNY 20M ($2.8M)
        - label: 2026 Units Shipped (cumulative)
          value: 'Unverified (target: 10,000)'
          note: BUY signal if >= 5,000; AVOID signal if < 1,000 by end-Q3 2026
        - label: Gross Margin (first production run)
          value: Undisclosed (estimated 5-30% at early scale)
          note: BUY signal if >= 20%; AVOID signal if negative on hardware alone
        - label: HKEX Prospectus Filing Status
          value: Not filed as of 2026-05-29
          note: BUY signal when filed with confirmed $2.9B+ valuation and audited accounts
        - label: Valuation Discrepancy Resolution
          value: Unresolved ($2.9B vs $29B)
          note: BUY signal if CNY 20bn confirmed in official document; AVOID if misstatement found
        - label: Physical Intelligence / NVIDIA Data Contract Renewal
          value: Active as of report date
          note: BUY signal if multi-year contracts confirmed; AVOID if partnerships transfer to competitors
        - label: US Export-Control Legal Opinion
          value: Not publicly available
          note: BUY signal if clean opinion with carve-outs; AVOID if hardware classified as export-controlled
        - label: Series B+ Preference Structure
          value: Not publicly disclosed
          note: BUY signal if 1x non-participating; AVOID if ratchet or participating preferred with high floor
