  - id: FR001
    title: Galaxea AI Risk Heatmap — Likelihood vs. Impact
    type: matrix
    layout: wide
    summary: >-
      Nine-cell likelihood-impact matrix placing Galaxea AI's primary risks. The highest-severity cluster (High
      Likelihood, High/Critical Impact) includes manufacturing scale-up failure, American Security Robotics Act US
      market exclusion, HEIS 2026 compliance obligations, and Chinese market competitive saturation.
    data:
      columns:
        - Medium Impact
        - High Impact
        - Critical Impact
      rows:
