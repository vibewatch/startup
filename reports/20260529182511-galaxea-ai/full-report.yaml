      - number: '7.5'
        title: Financial, Burn & Governance Risk
        blocks:
          - type: paragraph
            body: >-
              Galaxea's financial risk profile is among the most acute of any Chinese deep-tech startup at this stage.
              The company disclosed zero commercial revenue in 2024 and guided investors toward tens of millions of yuan
              in 2025 hardware sales — implying a revenue run-rate of roughly $3–10M against cumulative capital deployed
              of $654M–$724M. This capital-to-revenue ratio is extreme even by hardware-AI startup standards and
              reflects the investment-cycle reality of building a full-stack robotics platform before commercial volume
              materializes. With an estimated annual burn exceeding $100M (driven by headcount of ~120+, R&D for dual
              VLA and world-model tracks, manufacturing infrastructure, and data collection operations), the $290M
              Series B+ provides an estimated 18– 24 months of runway if spending acceleration is constrained — a
              timeline that assumes a successful HKEX IPO or follow-on round before the window closes.

              The valuation discrepancy creates a governance and investor relations risk. Yicai Global reported the
              Series B+ post-money valuation as CNY 200 billion ($29B), placing Galaxea alongside OpenAI and Anthropic
              in global AI startup rankings. ChinaBizInsider and InforCapital/PremierAlts databases report the valuation
              as CNY 20 billion ($2.9B) — a 10x difference that almost certainly reflects a currency translation error
              in reporting (CNY 200 billion vs. CNY 20 billion) rather than investor fraud, but creates significant
              confusion in international reporting. Regardless of the correct figure, a $2.9B valuation on $654M raised
              implies 4.4x capital efficiency — defensible for a deep-tech company — while a $29B valuation would imply
              a 44x multiple on total capital raised, which is extraordinarily high for a company with negligible
              revenue and no audited financials. Without an HKEX prospectus, the actual capitalization structure,
              preference waterfalls, secondary transaction history, and investor rights cannot be verified. Down-round
              risk is real if the IPO is delayed or market conditions deteriorate for AI hardware valuations.

              Governance opacity is a compounding risk at the IPO preparation stage. CEO Gao Jiyang is the sole founder
              with a significant public profile; co-CSOs Zhao Hang and Xu Huazhe hold active Tsinghua professorships,
              creating competing time obligations and ambiguity about their exclusive commitment to Galaxea at a
              critical manufacturing scale-up. The board composition, independent director count, audit committee
              structure, and related-party transaction protocols are not publicly disclosed. Galaxea's investor base —
              including Ant Group, Hillhouse Capital, Baidu, Meituan, IDG Capital, Walden International, CICC Capital,
              and Lens Technology — spans both strategic corporate investors and financial investors, creating potential
              board-level conflicts between strategic (data partnership, supply chain) and financial (return
              maximization) objectives. The forthcoming HKEX prospectus will be the first opportunity for public market
              investors to evaluate these governance structures under Hong Kong listing rules.
