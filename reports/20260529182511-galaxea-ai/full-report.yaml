      - number: '8.4'
        title: Scenario Analysis and Return Expectations
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis for Galaxea must contend with two layers of uncertainty: the unit economics of humanoid
              robots at scale (largely unvalidated across the sector) and the company-specific execution risk of scaling
              from "thousand-unit order validation" to 10,000-unit volume production within 12 months. The analysis
              below uses a 2026-2027 exit or IPO horizon consistent with Galaxea's stated HK IPO intent, and anchors
              multiples on UBTECH's 27x and Unitree's 13-30x as the only disclosed sector benchmarks.

              Bull scenario (probability 20%): Galaxea ships 8,000-10,000 units by end-2027 at an average ASP of
              ~$45,000-$50,000 (mid-range between the R1 Lite research price and the higher R1 Pro spec), generating
              $360-500M in 2027 revenue. Adding model-licensing and data fees at 15% of hardware revenue brings total to
              $415-575M. At 15-20x 2027 revenue (discount to UBTECH's 27x for IPO uncertainty), the implied valuation
              range is $6.2-11.5B. Series B+ investors at $2.9B entry see a 2.1-4.0x gross return at exit. Key enablers:
              Lens Technology supply chain delivering, pilot-to-production conversions in industrial transport and
              packaging, and a successful 2026 HK IPO.

              Base scenario (probability 55%): Galaxea ships 2,000-4,000 units by end-2027, revenue reaches $90-180M.
              The IPO is either delayed or executes in 2027 at a 10-15x revenue multiple (AgiBot-comparable), implying a
              $900M-$2.7B valuation range. This includes flat-to-modest returns for Series B+ investors. Discount
              drivers: manufacturing ramp-up challenges typical of first-generation humanoid mass production, softening
              of developer-market pricing, and an IPO window that may demand closer-to-profitability metrics than
              current guidance implies.

              Bear scenario (probability 25%): Revenue below $30M in 2027 due to production yield issues, supply chain
              disruptions, or loss of key enterprise contracts. IPO delayed beyond 2027 or withdrawn. At 1-5x revenue,
              fair value is $30-150M -- near-total loss for all private-round investors except those holding liquidation
              preference.

              Probability-weighted fair value: 0.20 x $8.9B (bull mid) + 0.55 x $1.8B (base mid) + 0.25 x $90M (bear
              mid) = approximately $2.8B. This is nearly coincident with the $2.9B entry price, meaning the current
              valuation already prices in a base-to-bull mix with minimal margin of safety. The current price is not
              obviously wrong -- but there is almost no downside protection, confirming a STRETCHED valuation stance.
            claimRefs:
