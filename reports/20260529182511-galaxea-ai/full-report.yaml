      - number: '5.3'
        title: Software Stack & Developer Ecosystem
        blocks:
          - type: paragraph
            body: >-
              Galaxea's software platform is built on ROS2 Humble running on Ubuntu 22.04, with NVIDIA JetPack 6.0 on
              Orin compute units. The company operates the OpenGalaxea organisation on GitHub, hosting eight publicly
              accessible repositories as of April 2026. The most active repo is GalaxeaVLA (599 stars, 46 forks, last
              updated February 14 2026), which contains G0-VLA and G0Plus fine-tuning and inference code licensed under
              Apache-2.0 (pre-2026 commits) and the G0 Plus Community License — a non-commercial-only licence — for
              content committed on or after January 4 2026. This non-commercial restriction is a significant barrier for
              industrial and production deployments that want to build on G0Plus without a separate commercial licence
              agreement. The EFMNode repo (Galaxea Embodied Deployment Node) provides the real-robot inference runtime
              that bridges trained checkpoints to the physical R1 hardware. GalaxeaManipSim provides 30+ simulation
              environments across 17 tasks supporting R1, R1 Pro, and R1 Lite, with one-command setup,
              LeRobot-compatible dataset export, and drop-in Diffusion Policy training scripts. GalaxeaLeRobotToolkit
              (15 stars, Apache-2.0) is a modified fork of HuggingFace's LeRobot 3.0 with faster data generation and
              improved merge tooling. The GalaxeaDP repo (37 stars) released the first Galaxea-specific Diffusion Policy
              baseline. Model weights are hosted on Hugging Face under OpenGalaxea (G0_3B_base, G0Plus_3B_base,
              G0Tiny_250M_base checkpoints) and mirrored on ModelScope. The developer documentation
              (docs.galaxea-ai.com) is generated from the userguide-galaxea/Product_User_Guide GitHub repo (38 stars,
              248 commits), which includes hardware user guides, ROS2 tutorials, and teleoperation SDK setup guides.
              External AI development compatibility is confirmed for Physical Intelligence pi-0 / pi0fast fine-tuning
              (openpi-based), showing deliberate ecosystem interoperability with competing model frameworks.
