      - number: '5.6'
        title: Trust, Safety, Security & Compliance
        blocks:
          - type: paragraph
            body: >-
              Galaxea R1 Pro carries an IP20 ingress-protection rating, providing dust protection against objects larger
              than 12.5 mm but no water-ingress protection. This rating limits deployment to dry, climate-controlled
              indoor environments and rules out wet manufacturing or outdoor field settings without enclosure upgrades.
              The robot is rated "safe with humans" per humanoid.guide and aparobot.com third-party profiles, enabled by
              its sensor suite, intelligent motion planning, and force-controlled joints. End-to-end inference latency
              of below 200 ms is cited as a safety-relevant specification for collaborative operation. No ISO 10218:2025
              or CE marking certification has been publicly disclosed by Galaxea AI, representing a material gap for
              regulated industrial deployments in Europe and the US. On software security, the G0 Plus Community License
              explicitly restricts commercial use — including production deployment and providing services to third
              parties — without a separate commercial licence from Galaxea; the licence boundary is the January 4 2026
              commit. Pre-2026 content retains Apache-2.0. The documentation explicitly disclaims liability for network
              interruptions, latency, and jitter during teleoperation, indicating that real-time safety for remote
              operation is a shared responsibility with the operator. Motor brakes are absent on R1 Lite arms: the user
              guide states that operators must manually support both arms before powering off to prevent sudden falling
              — a relevant safety consideration for lab deployment without safety interlocks. No formal privacy-impact
              assessment or data-governance documentation for the Galaxea Open-World Dataset (collected in real
              residential and public spaces) has been publicly disclosed.
            claimRefs:
