      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Platform Optionality Is Real but Unmonetised
            body: >-
              The Galaxea full-stack platform -- R1 hardware, G0/G0 Plus VLA models, Fast-WAM world model, and
              multi-scenario data engine -- provides a credible moat differentiation above pure hardware competitors.
              Physical Intelligence's use of the R1 Lite for pi0.5 and Stanford's Fei-Fei Li lab build on R1 body are
              independent third-party validations that carry analytical weight. The data flywheel, if scaled, could
              generate software-adjacent economics. However, none of this optionality has yet converted to disclosed
              recurring revenue, making it a qualitative premium that investors must price cautiously.
            calloutType: strength
            claimRefs:
              - CV031
              - CV032
              - CV033
          - type: callout
            title: 10x Valuation Discrepancy Is the Primary Governance Red Flag
            body: >-
              The gap between Yicai's "$29 billion" and the consensus "$2.9 billion" is unique in the humanoid robotics
              sector. If the true post-money is $2.9B (CNY 20bn), as supported by Gasgoo, HKET, InforCapital, and
              PremierAlts, then Yicai's English article contains a material factual error. If the true post-money is
              $29B (CNY 200bn), it would require Galaxea to have commanded a ~20x premium to Physical Intelligence's
              contemporaneous $5.6B -- implausible for a Chinese hardware company at the same commercialisation stage.
              Either way, the discrepancy must be resolved before a buy commitment.
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV034
          - type: callout
            title: Base Valuation Assumes $2.9B (CNY 20 Billion) Post-Money
            body: >-
              All scenario analyses, return calculations, and comparable multiples in this chapter are anchored on the
              $2.9B (CNY 20bn) figure corroborated by Gasgoo's "valuation breaks 20 billion yuan," HKET's confirmation
              of exceeded CNY 20 billion, InforCapital's $2.9B record, and PremierAlts' $2.9B database entry. The $29B
              Yicai figure is treated as a probable translation error and is NOT used as a valuation anchor. If the $29B
              were correct, the entire analysis would shift dramatically in the direction of expensive/avoid.
            calloutType: assumption
            claimRefs:
              - CV003
              - CV004
              - CV005
          - type: callout
            title: TRACK -- Strong Technology, Stretched Price, Opaque Disclosure
            body: >-
              The investment recommendation is TRACK. Galaxea has genuine technology assets, a world- class team,
              strategic sector position, and a plausible IPO exit path in 2026-2027. However, the $2.9B entry price
              leaves almost no margin of safety relative to the probability-weighted fair value of ~$2.8B, and the
              absence of audited financials and the 10x valuation discrepancy create governance uncertainty that cannot
              be resolved without access to a data room or HKEX prospectus. A move to BUY requires: (1) audited 2025
              financials confirming revenue and gross margin, (2) HKEX prospectus filed with confirmed cap table and
              post-money, and (3) verified production backlog of 2,000+ binding orders. A move to AVOID would require:
              any of the thesis-break triggers in TV005, particularly valuation confirmed materially below $2.9B, or US
              escalation blocking the company's international research partnerships.
            calloutType: recommendation
            claimRefs:
              - CV041
              - CV042
              - CV043
              - CV009
