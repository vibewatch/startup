  - id: FO001
    title: Galaxea AI Corporate Milestone Timeline
    type: timeline
    layout: standard
    summary: >-
      Chronological record of Galaxea AI's founding, financing events, product launches, and corporate governance
      changes from September 2023 through May 2026.
    data:
      items:
        - date: Sep 2023
          label: Company Founded
          detail: >-
            Gao Jiyang, Zhao Hang, Xu Huazhe, and Li Tianwei found Galaxea AI in Beijing. Team combines Tsinghua,
            Berkeley, Stanford, USC, and Waymo/Momenta backgrounds.
          tone: positive
        - date: Jan 2024
          label: Angel Round — IDG & Baidu Ventures
          detail: >-
            First institutional capital (tens of millions USD) from IDG Capital, Baidu Ventures, MiHoYo (Argo
            Technology), and GSR Ventures.
          tone: positive
        - date: Nov 2024
          label: Pre-A — RMB 200M+, Hillhouse & Ant Group
          detail: >-
            Hillhouse Capital and Ant Group lead a RMB 200M+ Pre-A round; IDG and Baidu follow on. Cumulative capital
            passes RMB 350M+.
          tone: positive
        - date: Feb 2025
          label: Series A — RMB 300M, Ant Group Led
          detail: >-
            Ant Group leads a RMB ~300M Series A; Hillhouse, IDG, Baidu Ventures, and Tongge participate. Cumulative
            capital ~RMB 650M+.
          tone: positive
        - date: H1 2025
          label: First R1 Commercial Sales
          detail: >-
            R1 humanoid robots first sold commercially (RMB 320K–460K per unit). First 40+ enterprise clients onboarded
            including Huawei Cloud, VW, Samsung, ByteDance, Physical Intelligence, Stanford, and MIT.
          tone: positive
        - date: Aug 2025
          label: G0 VLA Model Open-Sourced; $700M Valuation
          detail: >-
            G0 foundation model launched and open-sourced. A4/A5 rounds close (>$100M combined); valuation reaches $700M
            with Capital Today and Meituan Long-Z as new leads.
          tone: positive
        - date: Jan 2026
          label: CES 2026 — R1 Lite, DEXO Hand, G0 Plus
          detail: >-
            R1 Lite and DEXO dexterous hand debut internationally at CES 2026. G0 Plus dual-system model ("slow
            thinking, fast execution") released alongside.
          tone: positive
        - date: Jan 2026
          label: Equity Reform — LLC to Joint-Stock
          detail: >-
            Galaxea converts from limited liability company to joint-stock company (foreign-invested, unlisted); renames
            to Galaxea (Beijing) AI Technology Co., Ltd. IPO preparation signal.
          tone: neutral
        - date: Feb 2026
          label: Series B — RMB 1bn, Unicorn Status
          detail: >-
            Series B closes at ~RMB 1bn (~$144M). Post-money valuation ~RMB 10bn ($1.4B); Galaxea becomes a unicorn. New
            investors: Jinding Capital, BAIC Capital, Bihong, Loyal Valley, Qianhai Ark, InnoVen. Cumulative raised ~RMB
            3bn.
          tone: positive
        - date: Apr 2026
          label: Series B+ — RMB 2bn ($290M); Valuation Disputed
          detail: >-
            Series B+ closes at ~RMB 2bn ($290M). Yicai reports CNY 200bn ($29B) valuation per company announcement;
            InforCapital/PitchBook show ~$2.9B. Lens Technology joins as supply-chain partner.
          tone: neutral
        - date: May 2026
          label: Hong Kong IPO Plans Reported
          detail: >-
            GMT8 Press reports Galaxea plans a Hong Kong listing targeting ~$500M in proceeds. Not yet officially
            confirmed by the company.
          tone: neutral
        - date: 2026 H1
          label: Plans for 10K-Unit Mass Production
          detail: >-
            CNTechPost reports Galaxea plans to initiate production at 10,000-unit scale in 2026, targeting intelligent
            manufacturing, logistics, and commercial services.
          tone: positive
    approximationNotes: >-
      Exact closing dates for H1-2025 rounds are approximate; some sources report ranges. USD conversions use ~7.1
      CNY/USD FX rate. IPO reports are unconfirmed by Galaxea officially.
