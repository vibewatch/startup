            body: >-
              Galaxea AI has raised capital through at least six disclosed tranches in under 30 months, culminating in a
              Series B (February 2026, ~$144M / RMB 1bn) led by Jinding Capital at a RMB 10bn (~$1.4B) valuation,
              followed immediately by a Series B+ (April 2, 2026, ~$290M / RMB 2bn) that dramatically expanded the
