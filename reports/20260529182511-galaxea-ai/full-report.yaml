      - number: '2.3'
        title: China Policy and Regulatory Landscape
        blocks:
          - type: paragraph
            body: >-
              China's 15th Five-Year Plan (2026–2030) is the single most consequential policy catalyst for Galaxea's
              near-term market. Embodied intelligence commands its own dedicated inset box (Box 3, Item 02) among the
              plan's ten priority future-industry tracks — alongside quantum technology, brain-computer interfaces, and
              6G — and is simultaneously listed as one of eight "strategic emerging industries" receiving accelerated
              development mandates. This inclusion triggers mandatory coordination across all central ministries,
              provincial governments, and state financial institutions, and unlocks access to the 60 billion RMB
              National AI Industry Investment Fund, provincial matching funds, and state-backed venture capital. The
              plan specifically directs authorities to coordinate embodied intelligence training grounds, promote
              virtual-real fusion collaborative training, develop integrated big-brain/small-brain embodied models, and
              accelerate deployment of humanoid robots — language that functions as a procurement directive rather than
              aspiration. In parallel, China's Ministry of Industry and Information Technology (MIIT) released the
              Humanoid Robot and Embodied Intelligence Standard System (HEIS 2026) in February 2026. Developed by 120+
              research institutions and manufacturers, HEIS 2026 establishes a six-pillar framework covering
              foundational standards, neuromorphic computing, limbs/components specifications, full-system integration
              protocols, application guidelines, and safety/ethics requirements. By unifying technical specifications,
              HEIS 2026 aims to reduce inter-vendor integration costs, enable modular component reuse (analogous to
              automotive supply-chain standardization), and guide R&D toward core areas rather than redundant work. The
              2023 "Robot+" Action Plan, an earlier MIIT initiative, had already extended the policy framework beyond
              manufacturing into healthcare, agriculture, logistics, and elderly care, broadening the commercial
              pipeline for platforms like Galaxea's. Despite these strong tailwinds, IFR noted in May 2026 that actual
              humanoid robot capabilities in real-world production settings remain limited to demonstrators or pilot
              projects, and that the 15th FYP itself places mass commercialization of humanoids toward the end of the
              plan period (i.e., 2029–2030).
            claimRefs:
