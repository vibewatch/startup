  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case for Galaxea AI rests on three interlocking pillars. First, platform optionality: the company
              has built a full-stack robotics intelligence platform combining proprietary hardware (R1 wheeled humanoid,
              A1 arm), Vision-Language-Action models (G0 series), World Action Models (Fast-WAM), and a real-world data
              engine that powers at least 40-150+ enterprise and research customers globally. Unlike pure hardware
              makers, this stack generates compounding data and software assets that could support SaaS-adjacent
              monetisation through model licensing, data-as-a-service, and developer toolchain fees. Second, research
              validation: Physical Intelligence selected the Galaxea R1 Lite as the hardware base for its pi0.5
              open-world generalisation model, and Stanford's Fei-Fei Li lab published a whole-body manipulation kit
              built on the R1 body -- two independent corroborations that Galaxea hardware meets the tolerance
              requirements of top-tier AI labs. Third, sector momentum: the humanoid robotics sector raised $13.8B
              globally in 2025 and is tracking above that pace in 2026, with UBTECH publicly listed at ~$7.6B on
              disclosed revenue, Unitree filing for an IPO, and AgiBot targeting $5-6B for its own listing. This wave of
              public-market validation creates a credible liquidity path for Galaxea's own planned Hong Kong IPO
              targeting ~$500M in proceeds.

              The anti-thesis is equally substantive. At the credible $2.9B post-money valuation the company is priced
              at 290-580x 2025 estimated revenue ($3-10M), compared with UBTECH's ~27x trailing revenue and Unitree's
              13-30x on a profitable, fast-growing base. That premium requires execution on a 10,000-unit production
              ramp in 2026 that has not yet been independently validated. No audited financials have been filed; the
              only disclosed revenue figure is internal guidance of "tens of millions of yuan." The 10x discrepancy
              between Yicai's $29B and the consensus $2.9B is the single largest documentation red flag in the humanoid
              sector, raising questions about governance standards ahead of an IPO. Geopolitically, the American
              Security Robotics Act (March 2026) bars US federal procurement of Chinese-made robots, cutting off the
              most liquid exit market for both government contracts and US institutional participation in the IPO.
              Finally, preference stack overhang from $650M+ in cumulative equity means common-holder returns are
              subordinated through at least $650M before any residual flows to founders and employees.
