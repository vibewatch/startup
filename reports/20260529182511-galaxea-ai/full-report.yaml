      - number: '6.5'
        title: Concentration and GTM Risks
        blocks:
          - type: paragraph
            body: >-
              Galaxea's customer base carries several interrelated concentration risks. First, geographic concentration:
              if the 40+ enterprise clients are primarily Chinese companies (as suggested by CEO statements about
              Chinese car makers, and investor composition from Chinese corporates), the base is highly China-centric.
              Achieving the 50% overseas target requires qualifying and selling into markets — including the US — where
              Galaxea faces geopolitical risk from US-China technology export controls, and where the R1 robot currently
              lacks published safety certifications (CE or UL/OSHA), as documented in Chapter 5.

              Second, sector concentration: the large majority of confirmed customers are in research/algorithm-
              training roles (Stanford, PI, BAAI), with no public confirmation of revenue-generating production
              deployments. If the research-customer base delays conversion to industrial production customers, revenue
              growth will lag the capital deployed.

              Third, platform concentration risk: the open-source channel creates a risk that large enterprises
              (including US AI labs) build their own pipelines on Galaxea's freely available data and models without
              ever purchasing hardware. Physical Intelligence itself is an example — it builds its own robot hardware
              (ALOHA, π0 platform) and may primarily consume GOD as a training resource, not as a customer buying R1
              units. The CC BY-NC-SA licence partially mitigates this by blocking direct commercial use of GOD without a
              separate agreement, but enforcement is uncertain and governance of the licence has not been detailed
              publicly.

              Fourth, the NeuralWired 2026 manufacturing readiness guide, which surveys production-ready humanoid
              platforms for factory deployment, identifies Agility Digit, Boston Dynamics Atlas, Figure 02/03, and Tesla
              Optimus as candidates — with no mention of Galaxea — reflecting limited recognition of Galaxea as a
              production-grade vendor outside China. This absence is partially explained by Galaxea's primary market
              being China and limited safety certifications, but it also signals that Galaxea's industrial traction
              claims have not translated into Western analyst or end-user recognition as of early 2026.
