    title: Unit Economics Bridge — R1 Pro Cost and Revenue Decomposition
    type: flow
    layout: wide
    summary: >-
      Qualitative decomposition of R1 Pro unit economics from list price through estimated BOM components to uncertain
      gross margin. All cost nodes are industry benchmarks, not Galaxea-specific COGS.
    data:
      nodes:
        - id: list-price
          label: R1 Pro List Price — $69,999
          detail: >-
            Publicly listed price per humanoid.guide and Forbes reporting. Actual realized ASP may differ due to volume
            discounts, bundled accessories, or research partnerships.
          tone: positive
        - id: actuators
          label: Actuators & Motion Systems — $28,000–$40,000 est.
          detail: >-
            40–50% of estimated $40,000–$80,000 BOM. Largest cost driver. Lens Technology partnership targets cost
            reduction. Actuator sourcing terms not disclosed.
          tone: negative
        - id: sensors
          label: Sensors & Perception — $6,000–$16,000 est.
          detail: >-
            15–20% of BOM. Includes depth cameras, force/torque sensors, IMUs, tactile fingertips. NVIDIA Jetson AGX
            Orin 32GB (compute) overlaps this category.
          tone: negative
        - id: compute
          label: Compute (NVIDIA Jetson AGX Orin) — $4,000–$12,000 est.
          detail: >-
            10–15% of BOM. NVIDIA Jetson AGX Orin 32GB (200 TOPS) is standard R1 Pro compute. Cost partly mitigated by
            commodity GPU market dynamics.
          tone: negative
        - id: structure-battery
          label: Structure, Battery & Assembly — $5,000–$15,000 est.
          detail: >-
            Remaining 15–25% of BOM. Carbon fiber/aluminum frame, lithium-ion battery pack, wiring, connectors, thermal
            management, final assembly labor in Suzhou.
          tone: negative
        - id: gross-margin
          label: Implied Gross Margin — Negative to ~43% (estimated)
          detail: >-
            If BOM = $40,000: margin ≈ 43% before integration/service costs. If BOM = $80,000: margin ≈ negative.
            Full-absorption cost is higher than hardware-only BOM. Early-stage volumes likely push true margin toward or
            below zero.
          tone: warning
      edges:
