            - >-
              Manufacturing scale-up failure (10K units); HEIS 2026 compliance obligations; Chinese market competitive
              saturation (second-tier ranking)
            - American Security Robotics Act — US federal market structural exclusion
        - label: Medium Likelihood
          values:
            - China rare earth controls — indirect compliance complexity on export shipments
            - >-
