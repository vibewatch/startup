  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              The global humanoid and dexterous manipulation robot market as of mid-2026 is contested by approximately
              30 active developers across three structural tiers. The first tier comprises Chinese domestic volume
              manufacturers — AgiBot, Unitree, and UBTECH — that have crossed the 1,000-unit annual production threshold
              and compete primarily on scale, manufacturing cost efficiency, and proximity to Chinese OEM demand. The
              second tier consists of Western-funded, AI-first startups — Figure AI, Physical Intelligence, 1X
              Technologies, Boston Dynamics, and Apptronik — that lead on software sophistication, brand recognition,
              and deep enterprise relationships in Western markets. The third tier encompasses earlier-stage platforms
              including Galaxea AI, LimX Dynamics, and Fourier Intelligence, which compete on specialised form factors,
              open-source ecosystems, or niche application focus (e.g., healthcare robotics). Beyond direct robot
              competitors, status quo alternatives — including traditional robotic arms, autonomous mobile robots
              (AMRs), and teleoperated systems — remain cost-competitive for repetitive structured tasks and represent
              an indirect displacement risk. Critically, large Chinese technology and automotive OEMs including XPeng,
              Haier, and BYD have initiated internal humanoid programmes, introducing latent volume competitors that
              combine manufacturing infrastructure with captive distribution. The market bifurcated sharply in 2025–2026
              between sub-$25K prosumer-research platforms (Unitree G1, 1X NEO, LimX Oli) and premium enterprise systems
              priced $50K–$150K (Galaxea R1 Pro, UBTECH Walker S2, Fourier GR-2). Galaxea occupies the mid-upper tier of
              enterprise pricing while simultaneously offering a differentiated wheeled mobile-base architecture absent
              from all nine primary competitors. NVIDIA's GR00T foundation model, adopted by multiple OEMs including
              Galaxea and Figure AI, creates an emerging platform standard that simultaneously broadens Galaxea's
              ecosystem access and raises the risk of AI commoditisation across the sector.
