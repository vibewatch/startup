      - number: '8.5'
        title: Exit Readiness and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Galaxea's stated exit path is a Hong Kong IPO targeting ~$500M in proceeds, a route for which preparatory
              steps are largely complete: equity reform (January 2026), HK non-local company registration (May 2026, CR
              80393712), and an "all-ecosystem" investor base including CICC Capital funds (who function as quasi-IPO
              underwriters in China), state-backed funds (Beijing Sci-Tech, Financial Street Capital), and industrial
              strategics (Lens Technology, Walden International). No HKEX listing application or prospectus draft has
              been publicly filed as of the report date.

              The IPO will need to resolve several disclosure issues to attract international institutional investors.
              Most critically, the 10x valuation discrepancy must be clarified before any prospectus can assert a
              reliable post-money figure. Second, audited financials for FY2024 and H1 2025 are prerequisite for a HKEX
              listing; none have been made public. Third, US-China geopolitical risk requires explicit disclosure of
              what the American Security Robotics Act means for Galaxea's US-market access, and how the company plans to
              serve its US-domiciled partners (Stanford, MIT, Physical Intelligence) post-legislation.

              M&A exits are also conceivable. Plausible strategic acquirers include: a large Chinese industrial
              conglomerate (Haier, Foxconn, BYD) seeking to internalise humanoid intelligence supply; a global
              semiconductor company (NVIDIA, Qualcomm) seeking hardware-anchored distribution for physical-AI models; or
              a major Chinese internet platform (Alibaba, Tencent -- both already investors via affiliated entities)
              seeking an embodied-AI layer for their cloud platforms. Strategic premiums of 20-40% above fair value are
              typical in technology acquisitions, which at a $2B-$3B base would yield $2.4B-$4.2B, providing
              modest-to-acceptable returns for B+ investors.

              The final diligence asks prioritise closing the evidence gaps that most directly affect the investment
              decision. Absent these, the TRACK/research-more recommendation stands.
