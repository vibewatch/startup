  - id: FI001
    title: Revenue Model Bridge — How Customer Activity Converts to Revenue
    type: flow
    layout: standard
    summary: >-
      Customer activity flows from developer/research deployments through productivity market engagements to potential
      recurring data and software revenue. Real-world data flywheel is the key economic moat.
    data:
      nodes:
        - id: customer-activity
          label: Customer Deploys Robot
          detail: >-
            40–150+ enterprise clients (Aug 2025–2026) including Stanford, MIT, Huawei Cloud, Volkswagen, Physical
            Intelligence. Initial use: algorithm training, data collection, productivity pilots.
          tone: neutral
        - id: hardware-revenue
          label: Hardware Sale Revenue
          detail: >-
            One-time ASP: A1Z $2,999–$3,999; R1 $44,500–$64,000; R1 Pro $69,999. List pricing only — realized ASP and
            volume discount terms not disclosed. Primary 2025–2026 revenue stream.
          tone: neutral
        - id: data-flywheel
          label: Real-World Data Generated
          detail: >-
            Each deployed robot generates telemetry and task execution data fed into Galaxea's real-data engine.
            600,000+ GOD dataset downloads signals external demand. Data collection is both a cost and a potential
            revenue moat.
          tone: positive
        - id: model-improvement
          label: VLA / World Model Improvement
          detail: >-
            Real-world data trains G0 Plus VLA, Fast-WAM world model, and upcoming G0.5. Externally verifiable model
            iteration is Galaxea's key fundraising signal and competitive moat claim.
          tone: positive
        - id: potential-software
          label: Potential Software/Model License Revenue
          detail: >-
            Not yet confirmed as a product line. G0 models are currently open-sourced; no software pricing has been
            published. Transition to paid licensing is a future possibility.
          tone: warning
        - id: gross-profit
          label: Gross Profit (Estimated Negative to ~43%)
          detail: >-
            Estimated gross margin ranges from deeply negative at low volumes to ~43% at best-case pricing vs low BOM.
            Full-absorption cost including integration, field service, and software not included in hardware BOM
            benchmarks. Margin expansion requires scale to 10,000+ units.
          tone: negative
      edges:
        - from: customer-activity
          to: hardware-revenue
          label: Unit sale at list price
        - from: customer-activity
          to: data-flywheel
          label: Deployment generates telemetry
        - from: data-flywheel
          to: model-improvement
          label: Real-world data trains models
        - from: model-improvement
          to: potential-software
          label: Improved models = future licensing candidates
        - from: hardware-revenue
          to: gross-profit
          label: Revenue minus estimated BOM and delivery cost
