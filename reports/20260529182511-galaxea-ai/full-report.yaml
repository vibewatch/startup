            body: >-
              The strongest customer-proof evidence centres on two named relationships confirmed by Forbes and
              corroborated by published academic work. Stanford University's Human-Centered AI group, involving
              professors Li Fei-Fei and Jiajun Wu, developed the BEHAVIOR Robot Suite (BRS) using a Galaxea R1 platform.
              The resulting paper was accepted at CoRL 2025, and the open-source project website explicitly documents
              the R1 as the hardware backbone for whole-body teleoperation and demonstration data collection. This is a
              verifiable third-party use case with a peer-reviewed publication and reproducible artefacts, making it the
              highest-quality customer proof available for Galaxea. However, it is a research collaboration, not a
              commercial deployment; Stanford does not pay for a service but rather collaborates on capability
              development.

              Physical Intelligence (PI), the US robotics AI company backed by top-tier investors, is confirmed as a
              customer or close partner by Forbes, by the Sohu/Lenovo CIG article that noted PI researchers publicly
              endorsed the GOD dataset, and by the awesome-galaxea-developers repository which lists PI's pi0.5 model as
              validated on Galaxea R1 Lite. Again, PI's engagement appears to be in the research and open-source
              ecosystem rather than a commercial client relationship. Physical Intelligence itself releases models as
              open-source (openpi), making it more accurate to classify PI as a research partner / developer
              collaborator than a revenue-generating commercial customer.

              Beyond Stanford and PI, the awesome-galaxea-developers repository on GitHub documents 18+ open-source
              research projects built on Galaxea hardware or the GOD dataset, from institutions including BAAI
              (RoboBrain-X0), Stanford (BRS, VR-Robo, DenseMatcher), and research teams that produced papers at CoRL
              2025, RA-L 2025, ICLR 2025, and CVPR 2025. This constitutes a material academic ecosystem, but all
              projects appear to be non-commercial. The distinction between "developer/researcher using open-source
              tools on Galaxea hardware" and "paying enterprise customer" is critical for revenue modelling and has not
              been resolved from public evidence.

              The broader list of 40+ clients — which secondary sources embellish with names such as Huawei Cloud,
              Volkswagen, Haier, Samsung, and ByteDance — derives from aggregators and AI wikis (sudoremove.com,
              aiwiki.ai) rather than primary sources. Forbes, the only authoritative outlet that interviewed Galaxea's
              leadership directly, confirms only Physical Intelligence and Stanford. Prudent analysis treats the broader
              industrial client list as company-claimed with low corroboration until independent confirmation is
