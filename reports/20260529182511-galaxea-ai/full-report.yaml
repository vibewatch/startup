  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              The market relevant to Galaxea AI spans hardware-plus-software platforms enabling mobile manipulation in
              human-centric environments: full-body humanoid robots, wheeled mobile manipulators (the R1 product
              family), and embodied AI software layers (VLA models, developer SDKs). This chapter explicitly excludes
              fixed-arm industrial cobots, SCARA/delta arms used in single-axis pick-and-place, traditional AGV/AMR
              fleets lacking manipulation capability, and cloud-only LLM inference services. Status-quo substitutes for
              Galaxea's target use cases include fixed industrial robots (dominant in automotive welding and painting),
              human contract labor (the primary alternative in China's still-large manufacturing workforce), and
              task-specific machines (e.g., dedicated vision-inspection robots). Adjacencies that could expand the total
              opportunity include human-robot collaboration (cobot) platforms, industrial digital-twin software, and
              elderly-care or home-service robots — each representing a future market extension rather than the current
              core. The global humanoid robot market in 2025 stood at $1.9B–$5.4B depending on scope; China's embodied
              intelligence market reached approximately 82 billion RMB ($11.4B) in 2025 when including the full platform
              layer. Galaxea competes within the mobile-manipulator and full-humanoid sub-segment where deep AI
              integration is the differentiating factor.
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
