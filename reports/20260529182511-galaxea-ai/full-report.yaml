      - number: '5.5'
        title: Deployment, Integration & Roadmap
        blocks:
          - type: paragraph
            body: >-
              All Galaxea robots ship from Suzhou with ROS2 Humble pre-installed and documentation available at
              docs.galaxea-ai.com (generated from the userguide-galaxea GitHub repo). The end-to-end inference latency
              for G0Tiny on the R1 Pro Orin platform is rated at under 200 ms (glass-to-action), with out-of-the-box
              demos for Pick Up Anything, Fold Towels, and Handover Gift using Docker containers and step-by-step
              scripts. Connectivity options on R1 Pro include Ethernet, HDMI, and USB; the LAN-based teleoperation is
              recommended for stable low-latency SDK operation. The R1 Lite isomorphic teleop kit requires a dedicated
              Ubuntu 22.04 laptop with ROS Humble as the upper computer — Bluetooth-based connections are explicitly not
              recommended due to instability. On the product roadmap, Galaxea has confirmed development of a G0.5 model
              targeting broader general-purpose task capabilities beyond single-demo specialisation. The company has
              also referenced Fast-WAM (a world-action model track) as a parallel effort to VLA, framing it as risk
              management across two AI paradigms rather than a commitment to one. Production scale targets are material:
              Galaxea has validated thousand-unit order scale and is targeting ten-thousand-unit shipments in 2026 per
              company and investor statements. Five standardised industrial scenarios have been prioritised for early
              commercial deployments: material handling, pick-and-place, sealing and packing, garment folding, and
              equipment interconnection. A bipedal humanoid was in development as of August 2025, reportedly targeted
              for launch in 2026, extending the product line beyond wheeled platforms.
