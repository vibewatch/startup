summary:
  headline: Galaxea AI 的学术背景顶尖，产品路线图可信，开发者牵引也真实；但商业收入尚无验证，约 $2.9B 估值对应 2025 年指引超过 290x，叠加高地缘政治和披露风险，透明度补齐前不适合投资。
