  - id: funding-history-and-capital-adequacy
    title: Funding History & Capital Adequacy
    body: >-
      Galaxea AI has raised capital through at least six disclosed tranches in under 30 months, culminating
      in a Series B (February 2026, ~$144M / RMB 1bn) led by Jinding Capital at a RMB 10bn (~$1.4B)
      valuation, followed immediately by a Series B+ (April 2, 2026, ~$290M / RMB 2bn) that dramatically
      expanded the investor base. The Series B+ attracted an "all-ecosystem" coalition: industrial capital
      (Walden International, Lens Technology, Sixcore Investment, Times Bonile, Aero Engine Fund), long-term
      institutional funds (Xiuyuan Capital, Hongzhang Investment, Yuhai Capital), state-backed vehicles
      (Financial Street Capital, Jinpu Investment, Beijing Sci-Tech, Guoyuan Equity), and top-tier private
      equity (CICC Capital funds, Puhua Capital, Hongtai Fund, GF Qianhe). Earlier tranches included the
      Series A (July–August 2025, >$100M at $700M valuation) led by Capital Today with Meituan Long-Z,
      Ant Group, IDG Capital, Baidu Ventures, GL Ventures, and FunPlus. Total cumulative raises are reported
      at $563M (InforCapital, 5 rounds) to $654M (PremierAlts) — a gap attributable to different
      treatment of angel/seed tranches and FX conversion methods. The valuation post-Series B+ is sharply
      contested: Yicai's English-language article reported "CNY200 billion (USD29 billion)," while
      Chinese-language reporting from HKET, Tencent News, and GMT Eight consistently cite "已突破200亿元"
      (exceeded CNY 20 billion, ~$2.78B), and InforCapital and PremierAlts independently record $2.9B.
      The 10× gap strongly suggests Yicai's English translation conflated "200亿" (200 hundred-millions =
      20 billion CNY) with "200 billion CNY" — a known source of transcription error in bilingual
      financial reporting. No audited source has confirmed either figure. From a capital adequacy standpoint,
      with ~$434M raised in the February–April 2026 window alone, the company's near-term cash position
      appears robust; however, the burn rate is not disclosed. The equity reform (股改) completed in
      January 2026 converted the entity from a limited liability company to a joint-stock company (foreign
      investment, unlisted), and a Hong Kong non-local company was registered under commercial registration
      number 80393712 in May 2026 — both preparatory steps for a targeted HK IPO raising ~$500M.
