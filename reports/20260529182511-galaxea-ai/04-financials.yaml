  - id: financial-disclosure-gaps-and-valuation-uncertainty
    title: Financial Disclosure Gaps & Valuation Uncertainty
    body: >-
      Galaxea AI is a private company with no obligation to publish audited financial statements, and none
      have been made public. All revenue figures are company-guided and unaudited. The investor cap table,
      liquidation preference stack, option pool size, and debt obligations (if any) are not publicly
      known. The valuation dispute is particularly material: a 10× discrepancy between the Yicai $29B
      figure and the $2.9B figure from InforCapital, PremierAlts, and Chinese-language press undermines
      confidence in any multiple-based analysis. If the correct post-B+ valuation is ~$2.9B, the
      company is priced at roughly 290–580× estimated 2025 revenue of $3–10M — elevated but not
      unusual for early-stage robotics in China's 2026 AI funding environment. If the $29B figure is
      accepted, the implied multiple is 2,900–5,800× estimated 2025 revenue, which would be indefensible
      on current financial fundamentals and would rank the company above Figure AI ($39B) despite Figure
      having a BMW production deployment. The company has not issued a formal statement disambiguating
      the valuation figures beyond the April 2 press release that Yicai reported as $29B. The total
      capital raised figure also varies ($563M–$724M depending on source and FX assumptions), and the
      post-B+ cash position is estimated but not confirmed. Burn rate is entirely undisclosed; the
      company is running parallel hardware manufacturing ramp, VLA model training, world model
      development, and global ecosystem expansion simultaneously, all of which are capital-intensive.
      An HKEX prospectus filing would be the primary mechanism to resolve most disclosure gaps,
      but no pre-listing document has been published as of May 2026.
