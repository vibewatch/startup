  - id: unit-economics-and-cost-structure
    title: Unit Economics & Cost Structure
    body: >-
      Galaxea's unit economics are structurally challenging at current volumes. The A1Z arm is offered at
      $2,999–$3,999 on the company's official Galaxea Dynamics storefront — a deliberate entry-level
      price to seed the developer ecosystem. The R1 wheeled humanoid is priced at $44,500–$64,000
      depending on configuration (with or without five-finger dexterous hands), and the R1 Pro stands at
      $69,999 on independent product trackers. Against these prices, industry cost-structure analysis
      places the 2026 bill of materials for a mid-range industrial humanoid at $40,000–$80,000 per unit,
      with actuators and motion systems alone consuming 40–50% of BOM. At the low end of pricing ($44,500
      R1) against the high end of BOM estimates ($80,000), initial gross margins are deeply negative.
      Even at the high end of pricing ($69,999 R1 Pro) against the low end of BOM ($40,000), the implied
      gross margin is approximately 43% — but this ignores integration, testing, field service, and
      software costs that are embedded in the full cost of delivery. Given Galaxea's early production
      volume, full-absorption manufacturing cost almost certainly exceeds the hardware-only BOM. Industry
      forecasts suggest 15–30% gross margins become achievable at 10,000+ unit scale, but this depends
      on cost-downs in actuators (the largest cost driver), supply chain integration with partners like
      Lens Technology, and software/service attach rates that have not yet been demonstrated. The cost
      structure is further pressured by Galaxea's strategic choice to pursue real-world data collection
      rather than simulation: real-world embodied interaction data is materially more expensive to acquire,
      label, and process than simulation data, adding operating cost that simulation-first competitors
      avoid. Pursuing two parallel model development tracks (VLA + world models) further multiplies R&D
      expenditure in what is already a capital-intensive domain. The capital efficiency ratio sits at
      roughly 4.43× (valuation ÷ cumulative raised), which is below many pure-software AI peers but
      reasonable for a full-stack hardware-plus-AI company. No customer acquisition cost, payback period,
      or gross retention data has been publicly disclosed.
