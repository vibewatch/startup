callouts:
  - calloutType: risk
    title: Valuation Dispute — $2.9B vs $29B Is a 10× Gap With No Resolution
    body: >-
      Yicai (a credible Shanghai media outlet) reported the Series B+ post-money valuation as "CNY200 billion
      (USD29 billion)." All independent third-party databases (InforCapital, PremierAlts) and Chinese-language
      media consistently cite "突破200亿元" (exceeds CNY 20 billion, ~$2.78B). The most likely explanation is
      a bilingual transcription error — "200亿" (200 units of 100 million) equals CNY 20 billion, not CNY 200
      billion. Investors relying on the $29B figure for multiple analysis would overestimate the valuation by
      10×. Neither figure has been confirmed by audited document. Any diligence process must resolve this
      before using valuation in any modelling exercise.
    claimRefs:
      - CI014
      - CI015
      - CI016
      - CI017

  - calloutType: risk
    title: Pre-Commercial Revenue vs $563M+ Capital — A Material Burn-to-Revenue Gap
    body: >-
      Galaxea has raised more than $563M in cumulative capital against approximately $3–10M in estimated 2025
      revenue and zero 2024 revenue. At the current burn trajectory — dual-track AI model development, Suzhou
      manufacturing scale-up, and global ecosystem expansion — the company must reach the 10,000-unit production
      target in 2026 to have any realistic path to the profitability it has publicly targeted. If unit volumes
      fall short, the company will require additional capital before achieving positive gross margin. The IPO
      proceeds (~$500M targeted) are likely intended to fund this gap rather than return capital to investors.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI021
      - CI040

  - calloutType: assumption
    title: Gross Margin Modeling Relies Entirely on Industry BOM Benchmarks
    body: >-
      All gross margin estimates in this chapter use the robozaps.com 2026 humanoid production economics
      benchmark ($40,000–$80,000 BOM for a mid-range industrial humanoid) and humanoid.guide 2026 market
      report projections (15–30% margin at 10k+ units). These are industry-wide benchmarks, not Galaxea-specific
      cost data. Galaxea's actual COGS could be materially different due to its proprietary actuator design,
      DEXO dexterous hand manufacturing, and supply chain terms with Lens Technology. All margin figures
      should be treated as directional estimates pending audited financial disclosure.
    claimRefs:
      - CI022
      - CI023
      - CI024
      - CI033

