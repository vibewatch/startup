figures:
  - id: FI001
    title: Revenue Model Bridge — How Customer Activity Converts to Revenue
    type: flow
    layout: standard
    summary: >-
      Customer activity flows from developer/research deployments through productivity market engagements
      to potential recurring data and software revenue. Real-world data flywheel is the key economic moat.
    data:
      nodes:
        - id: customer-activity
          label: Customer Deploys Robot
          detail: >-
            40–150+ enterprise clients (Aug 2025–2026) including Stanford, MIT, Huawei Cloud,
            Volkswagen, Physical Intelligence. Initial use: algorithm training, data collection,
            productivity pilots.
          tone: neutral
        - id: hardware-revenue
          label: Hardware Sale Revenue
          detail: >-
            One-time ASP: A1Z $2,999–$3,999; R1 $44,500–$64,000; R1 Pro $69,999. List pricing
            only — realized ASP and volume discount terms not disclosed. Primary 2025–2026 revenue stream.
          tone: neutral
        - id: data-flywheel
          label: Real-World Data Generated
          detail: >-
            Each deployed robot generates telemetry and task execution data fed into Galaxea's
            real-data engine. 600,000+ GOD dataset downloads signals external demand. Data collection
            is both a cost and a potential revenue moat.
          tone: positive
        - id: model-improvement
          label: VLA / World Model Improvement
          detail: >-
            Real-world data trains G0 Plus VLA, Fast-WAM world model, and upcoming G0.5. Externally
            verifiable model iteration is Galaxea's key fundraising signal and competitive moat claim.
          tone: positive
        - id: potential-software
          label: Potential Software/Model License Revenue
          detail: >-
            Not yet confirmed as a product line. G0 models are currently open-sourced; no software
            pricing has been published. Transition to paid licensing is a future possibility.
          tone: warning
        - id: gross-profit
          label: Gross Profit (Estimated Negative to ~43%)
          detail: >-
            Estimated gross margin ranges from deeply negative at low volumes to ~43% at best-case
            pricing vs low BOM. Full-absorption cost including integration, field service, and software
            not included in hardware BOM benchmarks. Margin expansion requires scale to 10,000+ units.
          tone: negative
      edges:
        - from: customer-activity
          to: hardware-revenue
          label: Unit sale at list price
        - from: customer-activity
          to: data-flywheel
          label: Deployment generates telemetry
        - from: data-flywheel
          to: model-improvement
          label: Real-world data trains models
        - from: model-improvement
          to: potential-software
          label: Improved models = future licensing candidates
        - from: hardware-revenue
          to: gross-profit
          label: Revenue minus estimated BOM and delivery cost
    approximationNotes: >-
      Gross profit estimate is derived from list pricing vs $40,000–$80,000 industry BOM benchmark (robozaps 2026).
      No company-specific COGS data available. Software licensing revenue is speculative.
    claimRefs:
      - CI001
      - CI006
      - CI007
      - CI022
      - CI024

  - id: FI002
    title: Unit Economics Bridge — R1 Pro Cost and Revenue Decomposition
    type: flow
    layout: wide
    summary: >-
      Qualitative decomposition of R1 Pro unit economics from list price through estimated BOM components
      to uncertain gross margin. All cost nodes are industry benchmarks, not Galaxea-specific COGS.
    data:
      nodes:
        - id: list-price
          label: R1 Pro List Price — $69,999
          detail: >-
            Publicly listed price per humanoid.guide and Forbes reporting. Actual realized ASP
            may differ due to volume discounts, bundled accessories, or research partnerships.
          tone: positive
        - id: actuators
          label: Actuators & Motion Systems — $28,000–$40,000 est.
          detail: >-
            40–50% of estimated $40,000–$80,000 BOM. Largest cost driver. Lens Technology
            partnership targets cost reduction. Actuator sourcing terms not disclosed.
          tone: negative
        - id: sensors
          label: Sensors & Perception — $6,000–$16,000 est.
          detail: >-
            15–20% of BOM. Includes depth cameras, force/torque sensors, IMUs, tactile fingertips.
            NVIDIA Jetson AGX Orin 32GB (compute) overlaps this category.
          tone: negative
        - id: compute
          label: Compute (NVIDIA Jetson AGX Orin) — $4,000–$12,000 est.
          detail: >-
            10–15% of BOM. NVIDIA Jetson AGX Orin 32GB (200 TOPS) is standard R1 Pro compute.
            Cost partly mitigated by commodity GPU market dynamics.
          tone: negative
        - id: structure-battery
          label: Structure, Battery & Assembly — $5,000–$15,000 est.
          detail: >-
            Remaining 15–25% of BOM. Carbon fiber/aluminum frame, lithium-ion battery pack,
            wiring, connectors, thermal management, final assembly labor in Suzhou.
          tone: negative
        - id: gross-margin
          label: Implied Gross Margin — Negative to ~43% (estimated)
          detail: >-
            If BOM = $40,000: margin ≈ 43% before integration/service costs.
            If BOM = $80,000: margin ≈ negative. Full-absorption cost is higher than hardware-only BOM.
            Early-stage volumes likely push true margin toward or below zero.
          tone: warning
      edges:
        - from: list-price
          to: actuators
          label: Largest cost deduction
        - from: list-price
          to: sensors
          label: Perception cost
        - from: list-price
          to: compute
          label: AI hardware cost
        - from: list-price
          to: structure-battery
          label: Frame and assembly cost
        - from: list-price
          to: gross-margin
          label: Residual after estimated BOM
    approximationNotes: >-
      All cost estimates are from robozaps.com 2026 humanoid production economics benchmark (industry-wide,
      not Galaxea-specific). Gross margin is an estimate based on list price minus benchmark BOM range.
      True COGS including integration, testing, field service provisioning, and software overhead are unknown.
