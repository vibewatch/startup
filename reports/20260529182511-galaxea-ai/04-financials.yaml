chapter:
  number: 4
  title: Financials
  summary: >-
    Galaxea AI is a pre-commercial, capital-intensive robotics startup that recorded zero revenue in
    2024 and expects only tens of millions of yuan (roughly $3–10M) in 2025 hardware sales — far below
    the capital deployed ($563–724M cumulative). Its April 2026 Series B+ closed ~$290M at a disputed
    post-money valuation: Yicai quoted CNY 200 billion ($29B) while multiple Chinese-language outlets
    and third-party databases (InforCapital, PremierAlts) report ~$2.9B, suggesting a probable 10×
    translation error. The company's hardware pricing ($2,999 arm; $44,500–$69,999 humanoid) is
    aggressive relative to a mid-range BOM estimated at $40,000–$80,000, implying thin-to-negative
    early gross margins. A Hong Kong IPO targeting ~$500M is in preparation; no audited financials
    or HKEX prospectus has been filed as of the report date.

sections:
  - id: revenue-model-and-commercial-traction
    title: Revenue Model & Commercial Traction
    body: >-
      Galaxea AI's revenue model in 2026 rests on direct hardware sales (robot arms and wheeled humanoids),
      early-stage research partnerships, and data licensing arrangements. The company explicitly confirmed
      zero commercial revenue in 2024 — the founding year focused entirely on product development and
      fundraising — and guided investors toward "tens of millions of yuan" in 2025 sales (roughly $3–10M),
      contingent on initial R1 series deliveries. For 2026, management targets profitability, which would
      require a dramatic step-up in unit shipments to the 10,000-unit scale it has publicly announced as a
      production goal. Whether this threshold is achievable given the company's manufacturing maturity, supply
      chain scale-up with Lens Technology, and the capital intensity of real-world data collection remains
      unverified. The company has completed what it describes as "thousand-unit order validation," implying
      binding demand commitments in the hundreds of units, but no independent verification of the backlog
      value or delivery schedule has been published. Five focused industrial scenarios drive near-term
      productivity-market revenue: material transport, pick-and-place, sealing and packaging, textile
      folding, and equipment interconnection. In the developer market, Galaxea serves 40–150+ customers
      (the range reflects reporting date differences — Forbes cited 40+ as of mid-2025; the company's
      own about page cited "nearly 100 global top-tier embodied intelligence customers" by mid-2026),
      including Huawei Cloud, Volkswagen, Haier, Samsung, ByteDance, Stanford University, MIT, Physical
      Intelligence, and NVIDIA. Revenue quality from this customer base is low: most relationships appear
      to involve pilot deployments, algorithm training access, and data collection arrangements rather
      than large recurring contracts. The R1 Lite platform was used by Physical Intelligence as the
      hardware base for its π0.5 open-world generalization model, and the Fei-Fei Li lab at Stanford
      released a whole-body mobile manipulation kit built on the Galaxea R1 body — both indicating
      high technical credibility but not necessarily sustained revenue.
