  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue
      missingEvidence: >-
        Audited 2024–2025 P&L statement with revenue, COGS, gross margin, and operating expense breakdown
        by product line and customer category.
      whyItMatters: >-
        Without audited financials, all revenue and margin claims are unverifiable. The path to 2026
        profitability cannot be assessed; the company may be tracking far behind or ahead of guidance.
      diligencePath: >-
