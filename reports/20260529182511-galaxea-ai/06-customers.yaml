company:
  name: Galaxea AI

chapter:
  number: 6
  title: Customers
  summary: >-
    Galaxea AI claims 40+ enterprise clients as of August 2025, with only Physical Intelligence
    and Stanford University publicly confirmed by authoritative sources; industrial clients are
    withheld under NDA. The developer community shows genuine traction — the Galaxea Open-World
    Dataset exceeded 400,000 downloads within two months of its August 2025 release, and 18+
    academic research projects have been built on Galaxea hardware — but this open-source
    adoption is non-commercial, constrained by a CC BY-NC-SA 4.0 licence. Revenue was zero in
    2024, with "tens of millions of yuan" targeted in 2025; no production-scale commercial
    deployment has been independently verified as of Q2 2026.

sections:
  - id: seg
    title: Customer Segmentation and Buyer Profiles
    body: >-
      Galaxea AI's customer universe divides into four distinct cohorts with materially different
      buyer profiles, use cases, and revenue contributions. The first and currently largest cohort
      consists of enterprise research labs and corporate AI teams — organisations such as Huawei
      Cloud, ByteDance, and Samsung (named by secondary sources) that procure Galaxea hardware
      primarily for embodied AI algorithm training, data collection, and internal R&D. These buyers
      hold high technical readiness and R&D budgets but have no confirmed public statements
      independently corroborating their deployments; CEO Gao Jiyang cited NDAs when declining to
      identify industrial clients to Forbes in August 2025.

      The second cohort covers academic institutions. Stanford University and Physical Intelligence
      (a US-based AI company) are the only customers named by Forbes — an authoritative, independent
      source. Stanford's collaboration produced the BEHAVIOR Robot Suite (BRS), a CoRL 2025 paper
      and open-source framework built around the Galaxea R1 for whole-body household manipulation.
      Physical Intelligence's pi0.5 model was validated on the Galaxea R1 Lite and is listed in the
      company's open ecosystem repository. MIT is cited by secondary aggregators but is not
      independently confirmed. BAAI (Beijing Academy of AI) deployed its RoboBrain-X0 foundation
      model on Galaxea R1 Lite, also in a research context.

      The third cohort is the global developer and research community, which engages primarily through
      the Galaxea Open-World Dataset (GOD) on HuggingFace and the OpenGalaxea GitHub organisation.
      This community is large by robotics-ecosystem standards — 400,000+ dataset downloads within two
      months of the August 2025 release, and 593 GitHub stars on the GalaxeaVLA repo by February 2026
      — but participation is non-commercial, governed by the CC BY-NC-SA 4.0 licence that prohibits
      direct commercial use. This funnel is not yet a validated pathway to paying enterprise customers.

      The fourth and strategically most important cohort is industrial manufacturers. Galaxea's CEO
      confirmed to Forbes that unnamed Chinese car makers planned to begin using R1 to ferry goods
      across factory floors in late 2025. BAIC Capital (Beijing Automotive Group) participated in the
      Series B, signalling potential deployment interest, but no deployment agreement has been
      confirmed publicly. Meituan Long-Z participated in Series A rounds, with a possible logistics
      deployment angle, but again with no disclosed deployment terms. The five standardised scenarios
      Galaxea has prioritised for commercial rollout — material handling, pick-and-place, sealing and
      packing, garment folding, and equipment interconnection — are all within the industrial cohort.
