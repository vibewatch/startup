callouts:
  - calloutType: strength
    title: "Open-Source Developer Flywheel Builds Genuine Ecosystem Traction"
    body: >-
      Galaxea's decision to open-source the GOD dataset, GalaxeaVLA models, and simulation toolkit
      has generated exceptional developer-community engagement by robotics standards: 400,000+
      dataset downloads within two months, 18+ peer-reviewed research projects, and contributions
      from leading institutions including Stanford, BAAI, and Physical Intelligence. The BEHAVIOR
      Robot Suite (CoRL 2025), built on Galaxea R1, is the strongest single piece of third-party
      validation — a published, reproducible academic study by the Li Fei-Fei group at Stanford that
      explicitly demonstrates the R1's capability for whole-body household manipulation. This flywheel
      creates awareness, credibility, and potentially a training-data moat, even if it does not yet
      translate directly to paid revenue.
    claimRefs:
      - CU008
      - CU009
      - CU021
      - CU025
      - CU027

  - calloutType: risk
    title: "NDA Wall and Evidence Gaps Make Revenue Verification Impossible"
    body: >-
      Galaxea AI's commercial story rests almost entirely on a company-claimed 40+ enterprise client
      count that is unverifiable from primary sources. The CEO explicitly declined to name industrial
      clients to Forbes in August 2025, citing NDAs. The secondary-source client list (Huawei,
      Volkswagen, Samsung, etc.) originates from AI-wiki aggregators with no independent corroboration.
      The only two clients independently confirmed are in research contexts (Stanford, Physical
      Intelligence). The company had zero commercial revenue in 2024 and no confirmed production-scale
      deployment. Investors and analysts face a situation where the headline "40+ clients" claim cannot
      be decomposed into segment, revenue, or deployment-maturity dimensions without privileged access
      to company data. This makes revenue multiple analysis speculative.
    claimRefs:
      - CU003
      - CU012
      - CU013
      - CU014
      - CU035
      - CU036

  - calloutType: recommendation
    title: "Priority Diligence Actions for Customer Verification"
    body: >-
      Investors and acquirers should request: (1) a client list with revenue attribution by segment
      and deployment status (research vs. pilot vs. production) under NDA; (2) signed purchase orders
      or LOIs from BAIC and/or Meituan confirming any committed deployment programme; (3) customer
      reference calls with at least three named industrial clients; (4) the company's 2025 audited or
      management-reviewed revenue figure to verify the "tens of millions of yuan" target was met;
      (5) a breakdown of the "several thousand units on order" figure from February 2026 — including
      signed vs. LOI-only commitments. Developer traction is genuine and should be viewed as a leading
      indicator, but it does not substitute for revenue-generating customer proof.
    claimRefs:
      - CU015
      - CU017
      - CU018
      - CU032
      - CU033

