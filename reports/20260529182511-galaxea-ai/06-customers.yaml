  - id: adoption
    title: Adoption Trajectory and Order Signals
    body: >-
      Galaxea's commercial activity has been characterised by rapid fundraising velocity but slow
      revenue recognition. The company recorded zero revenue in 2024 — its first full year after
      launching the A1 arm commercially — and targeted "tens of millions of yuan" (~$1.4M–$7M) in
      2025 sales, per CEO statements to Forbes in August 2025. This is a very modest revenue
      ambition relative to the $700M valuation reported at Series A close (August 2025) and the
      $2.9B+ valuation by April 2026. The company targeted profitability in 2026 — an aggressive
      target given the capital intensity of hardware manufacturing.

      On unit volumes, Forbes reported a target of up to 1,000 robot units shipped by December 2025,
      with the split approximately 50% Chinese market and 50% overseas including the US. By
      February 2026, multiple media reports citing Gasgoo and EqualOcean noted "several thousand"
      units on order (not necessarily shipped). ChinaBizInsider's coverage of the April 2026 B+ round
      used the phrase "thousand-unit order validation" to indicate Galaxea had demonstrated demand at
      that scale before targeting "ten-thousand-unit" mass production in 2026. No independently
      audited unit shipment figure is available; all volume data is company-claimed or derived from
      investor communications.

      Developer adoption provides a more verifiable traction proxy. The Galaxea Open-World Dataset
      surpassed 400,000 downloads within two months of its August 2025 release on HuggingFace and
      Modelscope (per Lenovo CIG/Sohu, which holds a direct investment relationship). The GalaxeaVLA
      GitHub repository accumulated approximately 593 stars and 45 forks by February 2026. These are
      meaningful signal numbers for an embodied AI dataset, but they do not directly translate to
      commercial traction because the GOD licence prohibits commercial use without a separate
      agreement. The awesome-galaxea-developers repository lists 18+ research projects from 2025 H2
      and 2026 Q1 that leverage Galaxea hardware, confirming active third-party adoption of the
      hardware/software stack for research purposes.

      The critical gap is the absence of any disclosed contract value, production-scale throughput
      metric, repeat purchase, or customer-reported outcome (e.g., labour displacement, defect
      reduction, throughput improvement) from any named client. This is typical of early-stage
      hardware companies but creates material uncertainty for revenue projections and unit economics
      modelling.
