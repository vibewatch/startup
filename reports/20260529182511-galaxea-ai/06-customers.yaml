    title: "Galaxea AI Adoption and Deployment Funnel"
    type: funnel
    layout: standard
    summary: >-
      Illustrates the steep drop from developer community engagement to confirmed commercial
      deployments, highlighting the gap between open-source traction and revenue-generating
      production installations.
    data:
