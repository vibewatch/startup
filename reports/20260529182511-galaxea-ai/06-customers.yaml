  - id: retention-gtm
    title: Retention, GTM Motions, and Distribution
    body: >-
      Galaxea operates two overlapping go-to-market motions: a direct enterprise sales channel
      and an open-source developer-led channel. The direct channel targets enterprise research labs
      and industrial manufacturers, where robots are priced at RMB 320,000–459,900 (~$44,500–$64,000),
      depending on configuration. This price tier implies that deployments require a formal procurement
      process, technical integration, and likely a contract with after-sales support. RBTX (igus robot
      marketplace) lists Galaxea as a partner, providing a secondary marketplace touchpoint, though
      the RBTX listing is thin on detail.

      The open-source channel operates through the OpenGalaxea GitHub organisation and HuggingFace,
      where the GOD dataset, GalaxeaVLA models, and developer documentation are freely available.
      The intended conversion path is: developer downloads GOD → fine-tunes on Galaxea hardware →
      validates in lab → enterprise procurement follows. This mirrors the model used successfully by
      Hugging Face, Weights & Biases, and similar ML infrastructure companies, but Galaxea faces
      an additional hurdle: the hardware itself costs ~$50,000+ per unit, requiring capital-budget
      approval that purely software-driven developer-led funnels do not face. There is no evidence of
      a hardware seed/loan programme or academic discount tier that would accelerate developer-to-buyer
      conversion.

      On retention, no publicly available NRR, GRR, contract renewal, or repeat-purchase data exists
      for Galaxea. The GOD dataset's non-commercial licence (CC BY-NC-SA 4.0) means download activity
      does not translate to billing retention. Hardware customers, once deployed, face switching costs
      (learned model weights, teleoperation data, integration code), suggesting moderate stickiness
      if deployments succeed — but no customer has published a case study documenting this. Investor
      repeat participation (Ant Group across Pre-A, Series A, and A4/A5; Hillhouse/GL Ventures across
      Series A and Series B) is a positive signal of institutional confidence but is not a customer
      retention proxy.
