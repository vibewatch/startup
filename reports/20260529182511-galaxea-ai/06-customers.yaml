  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: industrial-client-names
      missingEvidence: "Named confirmation of industrial clients (Huawei, Volkswagen, Samsung, Haier, ByteDance, or others) from authoritative independent sources or the company itself under structured NDA diligence"
      whyItMatters: "Without confirmed client identities and deployment terms, the 40+ client claim cannot be decomposed into revenue, segment, or maturity dimensions, making revenue modelling speculative"
      diligencePath: "Request a client list with revenue attribution under NDA during due diligence; obtain three reference customer calls from industrial segment"
      relatedQuestionRefs: [QU002, QU003, QU015]
      relatedTableRefs: [TU002]

    - type: missing-source
      severity: blocking
      topic: revenue-verification
      missingEvidence: "2025 audited or management-reviewed revenue figure to verify the 'tens of millions of yuan' target; any signed purchase orders or LOIs from industrial clients"
      whyItMatters: "Zero 2024 revenue and unverified 2025 revenue make it impossible to validate valuation multiples or assess the commercial viability of the business model"
      diligencePath: "Request management accounts, customer invoices, or investor-shared financials for 2025; confirm revenue recognition method"
      relatedQuestionRefs: [QU005, QU004, QU014]
      relatedTableRefs: [TU003]

