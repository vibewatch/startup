figures:
  - id: FU001
    title: "Galaxea AI Customer Journey Map"
    type: journey-map
    layout: wide
    summary: >-
      Maps the discovery-to-deployment path across Galaxea's four customer segments, highlighting
      the distinct touchpoints for developer/researcher adoption versus enterprise procurement.
    data:
      nodes:
        - label: "Discovery"
          detail: "Researchers and developers find Galaxea via GitHub (GalaxeaVLA), HuggingFace (GOD dataset), arXiv papers (BRS, GOD), or Forbes/media coverage; enterprise buyers may encounter via trade shows (CES 2026), investor channels, or industry network referrals"
        - label: "Evaluation"
          detail: "Researchers clone GalaxeaVLA, run out-of-box demo Docker containers, or download GOD on HuggingFace; enterprise buyers request a product demo, review R1/R1 Pro hardware specs (docs.galaxea-ai.com), or obtain a demo unit through direct sales"
        - label: "Pilot / Proof-of-Concept"
          detail: "Academic labs purchase or borrow an R1/A1 unit for research; industrial customers commission a pilot under NDA (e.g. factory-floor material handling); developer community uses GOD to fine-tune VLA models without hardware purchase"
        - label: "Deployment"
          detail: "Research deployments produce academic papers (BEHAVIOR Robot Suite, CoRL 2025) and open-source artefacts; industrial pilots expand task coverage and generate proprietary training data; no production-scale deployment independently verified as of Q2 2026"
        - label: "Expansion / Retention"
          detail: "Research expansions: additional robot units for larger studies or new task types; industrial expansion: additional units for new factory stations or sites; developer expansion: publishing new community projects in awesome-galaxea-developers; no commercial renewal or NRR data available"
    claimRefs:
      - CU002
      - CU026
      - CU027

