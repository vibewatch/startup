callouts:
  - calloutType: strength
    title: China Policy as Market Accelerant
    body: >-
      The 15th Five-Year Plan's explicit inclusion of embodied intelligence at the top-level strategic
      layer — triggering mandatory ministry and provincial coordination — is the strongest near-term
      demand stimulus Galaxea could ask for. The combination of the 60 billion RMB National AI
      Investment Fund, HEIS 2026 standards, and 40+ state training grounds directly funds the
      infrastructure and customers that Galaxea's R&D/developer-kit segment serves.
    claimRefs:
      - CM013
      - CM014
      - CM018

  - calloutType: risk
    title: Analyst Forecast Divergence Creates Valuation Uncertainty
    body: >-
      The 3.5× spread between BCC Research ($11B) and TechRT/Business Research Co ($39B) for the
      same 2030 TAM reflects genuine disagreement about adoption pace, not just scope differences.
      Goldman Sachs' blue-sky scenario of $154B by 2035 could anchor high valuations even if the
      base case is closer to $38B. Investors pricing Galaxea off the high end of the range face
      material downside if adoption remains in the industrial-pilot phase through 2030.
    claimRefs:
      - CM002
      - CM003
      - CM004

  - calloutType: risk
    title: IFR and NDRC Warnings Signal Near-Term Ceiling
    body: >-
      IFR's May 2026 assessment that humanoid robots remain limited to demonstrators or pilots
      in real-world production, combined with NDRC's November 2025 warning about market crowding
      with similar products, creates a ceiling for the commercial fleet segment in the 2026–2028
      window. Galaxea's valuation and revenue projections must account for a scenario where the
      industrial-pilot segment does not graduate to commercial fleets before 2029.
    claimRefs:
      - CM019
      - CM035
      - CM038

  - calloutType: insight
    title: Supply-Chain Window Closing by 2027–2028
    body: >-
      Humanoid.guide's May 2026 supply chain report identifies 2027–2028 as the lock-in point
      where dominant designs for actuators, sensors, compute, and integration will consolidate.
      Galaxea's investor Lens Technology is a direct supply-chain lever; the company must cement
      its actuator and component sourcing arrangements before the window closes or risk being
      structurally disadvantaged against Unitree and AgiBot.
    claimRefs:
      - CM025
      - CM026
      - CM028

