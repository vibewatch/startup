chapter:
  number: 2
  title: Market Analysis
  summary: >-
    The global humanoid and embodied-robotics market is in its earliest commercial phase, with analyst
    size estimates for 2030 ranging from $11B to $39B at CAGRs of 39–47%, reflecting genuine uncertainty
    rather than consensus. China accounts for roughly 85% of global humanoid installations in 2025 and
    commands 63–70% of the global supply chain; the 15th Five-Year Plan (2026–2030) embeds embodied
    intelligence as a top-tier future industry, unlocking procurement mandates, subsidies, and 40+ state
    training centers. Galaxea AI's addressable market spans three stacked segments — R&D / developer kits,
    industrial pilots, and eventual commercial fleets — with near-term revenue concentrated in the first two
    while broad factory adoption remains 2028–2030+.

sections:
  - id: market-boundary-and-definition
    title: Market Boundary and Definition
    body: >-
      The market relevant to Galaxea AI spans hardware-plus-software platforms enabling mobile manipulation
      in human-centric environments: full-body humanoid robots, wheeled mobile manipulators (the R1 product
      family), and embodied AI software layers (VLA models, developer SDKs). This chapter explicitly excludes
      fixed-arm industrial cobots, SCARA/delta arms used in single-axis pick-and-place, traditional AGV/AMR
      fleets lacking manipulation capability, and cloud-only LLM inference services. Status-quo substitutes
      for Galaxea's target use cases include fixed industrial robots (dominant in automotive welding and
      painting), human contract labor (the primary alternative in China's still-large manufacturing
      workforce), and task-specific machines (e.g., dedicated vision-inspection robots). Adjacencies that
      could expand the total opportunity include human-robot collaboration (cobot) platforms, industrial
      digital-twin software, and elderly-care or home-service robots — each representing a future market
      extension rather than the current core. The global humanoid robot market in 2025 stood at $1.9B–$5.4B
      depending on scope; China's embodied intelligence market reached approximately 82 billion RMB ($11.4B)
      in 2025 when including the full platform layer. Galaxea competes within the mobile-manipulator and
      full-humanoid sub-segment where deep AI integration is the differentiating factor.
    claimRefs:
      - CM001
      - CM003
      - CM005
      - CM007
    tableRefs:
      - TM001

  - id: market-sizing-and-analyst-estimates
    title: Market Sizing and Analyst Estimates
    body: >-
      Analyst forecasts for the global humanoid robot market by 2030 span a wide range — from $11B (BCC
      Research, hardware-focused) to $15.3B (MarketsandMarkets, bottom-up) to $39B (TechRT / Business
      Research Company, inclusive of AI platform layer) — reflecting fundamentally different scope
      definitions and adoption assumptions. Goldman Sachs, using a labour-shortage lens, sets a base-case
      of at least $6B in 10–15 years (from 2023/24) with a revised 2035 estimate of $38B and a blue-sky
      scenario of $154B if every adoption barrier is overcome. Grand View Research places the broader
      embodied AI market (including software) at $4.7B in 2025, growing to $67.6B by 2033 at roughly
      41% CAGR. Global humanoid shipments surpassed 18,000 units in 2025 (508% year-on-year growth),
      with China accounting for over 80% of those installations. China's own market is projected to exceed
      100 billion RMB (~$14.2B) by 2030. TrendForce estimates China's humanoid output will surge 94% in
      2026, while AinChina projects total 2026 China shipments of 62,500–200,000 units depending on the
      scenario. These divergent forecasts make precise SAM/SOM estimation unreliable; the sizing table
      below preserves source diversity and highlights methodology differences rather than synthesizing a
      single figure.
