  - id: industrial-demand-and-supply-chain-economics
    title: Industrial Demand and Supply Chain Economics
    body: >-
      China's manufacturing automation demand provides the underlying demand engine for Galaxea's
      market. China installed 295,000 industrial robots in 2024 — 54% of the global annual total —
      and operates a stock of roughly 2 million units, approximately 4.5 times that of Japan. The
      country runs 30,000+ smart factories as of early 2026, and the warehouse automation market
      (China) is projected to grow from $3.0B in 2025 to $9.2B by 2032 at a 17.2% CAGR. Rising
      labour costs and demographic pressure (China's working-age population is declining) are structural
      demand drivers that improve the ROI case for robotic automation year after year. The
      Chang'An Automobile dark factory in Chongqing — using 2,000+ robots to produce cars at 20%
      lower cost than traditional methods — illustrates the manufacturing transformation already underway
      for fixed automation; humanoid/mobile manipulators are the next frontier. On the supply side,
      China commands 63–70% of the global humanoid supply chain with a 30–40% cost advantage
      over Western equivalents. Actuators, which represent 40–60% of a humanoid robot's bill of
      materials, have been compressed to below RMB 1,000 per joint module by Chinese suppliers
      through vertical integration and mass production — versus multi-thousand-dollar Western prices.
      The "EV-ification" model (controlling motors, gearboxes, power systems, and casting in-house)
      is being applied to robots, and Galaxea's strategic investor Lens Technology gives it direct
      supply-chain access. AgiBot's milestone of shipping its 10,000th robot in March 2026 — scaling
      from 1,000 units to 10,000 in under three months — demonstrates the production velocity achievable.
      By 2027–2028, humanoid.guide forecasts that dominant designs will lock in across actuators,
      sensors, and compute, creating a window-closing dynamic for supply-chain positioning.
