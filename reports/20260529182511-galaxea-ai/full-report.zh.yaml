      - number: '3.5'
        title: 护城河分析与替代风险
        blocks:
          - type: paragraph
            body: >-
              Galaxea 近期最耐用的护城河，是开源 VLA 生态：G0 数据集和 OpenGalaxea 开发者社区带来网络效应，提高研究人员和企业开发者在 Galaxea 数据基础设施上搭建工作流集成后的切换成本。
              但在 Physical Intelligence π0.7 开源发布（2026 年 4 月）、AgiBot World 数据集和 NVIDIA GR00T
              基础模型的竞争压力下，这条护城河正在被压缩；这些方案都抬高了任何平台可用的开源 VLA 基线。企业客户部署 R1 Pro
              后，会积累任务特定工作流数据，也承担系统集成开销，这会阻止短周期平台替换；但一旦竞争者在价格或能力上追平，多年期迁移仍难以避免。轮式形态在目标细分市场中，是抵御双足平台替代的结构性护城河；
              但非人形替代方案（传统机械臂、AMR）在结构化重复任务上仍有竞争力。Galaxea 的学术联合创始人管线是一条人才护城河，复制难度高，但在中国生态中并不独一无二；AgiBot、LimX
              等多家人形机器人初创公司也有大学联系。 最高严重度的替代风险是价格压缩：如果 Unitree 或 1X Technologies 把产量优势延伸到多任务 VLA 能力，并达到与 G0 相近水平，Galaxea 的
              $69,999 定价若没有企业规模上的显著更强操作性能支撑， 将很难维持。XPeng 的 IRON 人形机器人目标在 2026 年量产，背后有 Foxconn 级制造基础设施和 XPeng 分销关系；如果
              IRON 达到 VLA 平价，24 个月内就可能在中国企业市场替代 Galaxea。 表 TP004 列出了护城河维度和主要威胁的结构化风险清单。
