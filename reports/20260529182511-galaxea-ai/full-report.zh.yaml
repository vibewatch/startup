      - number: '5.4'
        title: 数据管线、遥操作与训练流程
        blocks:
          - type: paragraph
            body: >-
              Galaxea 的数据策略是投资人和分析师报道中最常被提及的差异点：公司把真实世界遥操作数据放在仿真之上，认为重仿真的管线很难可靠迁移到非结构化环境。 主要数据采集平台是 R1
              Lite，这是一台刻意简化的机器人，为高吞吐同构遥操作而设计。同构遥操作中，操作者的上半身动作通过定制的、 基于 JoyCon 的 R1 Lite Teleop kit，以 1:1 映射到机器人机械臂运动学，避开
              VR 重定向伪影和 IK 失败。 作为替代模态，系统也支持使用头显的 VR 遥操作。Galaxea Open-World Dataset（GOD）就是这条管线的产物： 它包含 100,000 条演示轨迹，覆盖
              150+ 个任务类别（抓取放置、叠布、物体交接、设备操作、长时序铺床），记录于 50 个不同真实世界场景（住宅、零售、餐饮、办公室）。GOD 超过 500
              小时高保真移动操作数据，在子任务层级用中英双语自然语言描述标注， 并以 LeRobot v2.1 / RLDS 格式发布。数据集覆盖 1,600 多个独特物体和 58 项操作技能，并为保持一致性使用单一机器人本体
              （R1 Lite）采集。按 ChinaBizInsider 对 B+ 轮的报道，数据集 2025 年 9 月发布后约一个月内下载量超过 600,000
              次，并被称为当时全球下载量最高的机器人数据集。后训练（微调）阶段使用任务专属演示并支持多种算法：G0Plus 通过基于 openpi 的微调脚本（也兼容 pi0/pi0fast），Diffusion Policy
              则通过 GalaxeaManipSim。完整微调对 GPU 要求很高： 70+ GB VRAM（推荐 A100 80GB 或 H20 96GB），可参与微调的主要是资源充足的实验室；G0Plus 推理只需 8+
              GB VRAM（推荐 RTX 3090/4090）。
