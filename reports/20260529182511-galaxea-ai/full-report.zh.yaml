      - number: '8.3'
        title: 可比公司分析
        blocks:
          - type: paragraph
            body: >-
              为 Galaxea 构建可靠可比集，需要横跨三类价值驱动因素：（1）披露财务的人形机器人上市公司；（2）后期私有人形机器人 / 具身 AI 独角兽；（3）因基础模型可选性而被奖励的跨行业、收入前平台公司。

              唯一的纯人形机器人上市可比是 UBTECH Robotics（HKEX: 9880）。其已发布经审计的 2025 年业绩：收入 RMB 2,001M（+53.3%），人形机器人收入 RMB
              820.6M（+2,203.7%），毛利率 37.7%，净亏损 RMB 789.8M。按 2026 年 5 月下旬约 HKD 59B（约 $7.6B）市值计算，UBTECH 交易在约 27x
              追踪收入。这是行业唯一经审计的收入基准，且是在 2025 年出货 1,079 台人形机器人之后达到的。Unitree 2026 年 3 月为科创板 IPO 提交材料，披露 2025 年收入 CNY 1.71B（约
              $235M，+335%）且净盈利，目标 IPO 估值 $3–7B；这意味着 IPO 区间内收入倍数为 13–30x。UBTECH 和 Unitree 与 Galaxea 处在根本不同的商业化阶段。

              后期私有同行中，Figure AI 于 2025 年 9 月以 $39B 完成 Series C——行业最高估值——此前已从 NVIDIA、Macquarie 和 Microsoft 融资
              $1.9B+。Physical Intelligence 正洽谈以 $11B+ 估值融资 $1B（2026 年 3 月），没有商业收入，策略也只押基础模型。Apptronik 2026 年 2 月以 $5B
              估值融资 $520M，背后有 Google 和 Mercedes-Benz，Apollo 已在工业伙伴处商业部署。AgiBot 2025 年出货 5,100 台后，目标在 2026 年 Q3 以 $5–6B
              估值赴港 IPO。

              按 $2.9B 估值，Galaxea 低于 Apptronik（$5B）和 Physical
              Intelligence（$5.6–11B），而这两家公司商业化阶段相当或更早。考虑地缘政治负担和披露缺口，这一折价合理。NMP Humanoid Tracker 单独列出的“Galaxea
              Dynamics”$850M–$1.0B 估值似乎反映 Series B 前的早期数据快照；$2.9B 的 B+ 投后估值是最新数字。对比 Physical Intelligence
              这类研究阶段美国可比公司，地缘折价应为 30–40%，对应合理价值 $3.4–7.7B，高于 $2.9B 入场价，说明当前价格可能已包含中国折价。但对比 UBTECH 规模化收入上的约 27x，Galaxea
              基于 2025E 收入的 290–580x，仅靠近期盈利能力无法支撑。
