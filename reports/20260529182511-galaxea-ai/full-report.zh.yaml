  - id: FV003
    title: 估值区间——乐观 / 基准 / 悲观退出结果
    type: range
    layout: standard
    summary: 各情景的低—高退出估值区间，并以 Series B+ 入场价作参考。概率加权公允价值约 $2.8B ~= 入场价。数值单位为 $M USD。
