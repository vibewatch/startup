      - number: '7.4'
        title: 运营与供应链风险
        blocks:
          - type: paragraph
            body: >-
              Galaxea 计划在 2026 年切到年产 10,000 台，这是其近期路线图中执行风险最高的里程碑。公司披露与 Lens Technology（港交所上市的玻璃和光学制造商）建立制造合作，而 Lens
              Technology 也是 Series B+ 轮参与方；这形成了投资人 - 供应商双重关系，一旦制造关系需要重新谈判，治理复杂度会被放大。从不足 100 台原型机放大到 10,000
              台量产，需要自动化装配线、每台机器人 100+ 个部件的标准化质量保证、精密执行器公差管理，以及能维护已部署机器人的现场支持网络。当前所有厂商的人形机器人装配仍高度依赖人工；行业分析也指出，机器人执行器最高可占
              BOM 成本 60%，且具有小批量、高成本、低良率特征。

              对 NVIDIA Jetson AGX Orin 的依赖，在当前美国出口管制走向下形成技术风险点。Galaxea R1 系列标配 Jetson AGX Orin 32 GB（200 TOPS），并提到可选 550
              TOPS 配置。美国出口管制正持续收紧算力阈值；如果 Jetson AGX Orin 被重新分类，或 Galaxea 计划采用的下一代 Jetson
              模块超过受限阈值，公司就必须迁移到国产替代方案。用于机器人推理时，Huawei Ascend 和国产算力选项在每瓦性能和生态成熟度上仍落后于 Nvidia，强制切换会同时带来产品性能倒退和重新工程化成本。

              中国控制全球约 85% 的人形机器人生产与供应链，包括 90%+ 的稀土磁体精炼；相较西方竞争对手，Galaxea
              在国内零部件采购上具备结构性优势。但量产阶段的质量一致性、真实部署中的传感器融合可靠性，以及在工业环境中 24/7 运行机器人的现场服务基础设施，仍是未解决的运营缺口。Galaxea
              没有公开披露平均故障间隔、现场在线率指标或单台维护成本。关于 HEIS 2026 的行业分析指出，该标准的出台部分源于已有工业机器人事故，这凸显了未认证人形机器人部署中安全控制不足带来的真实责任暴露。

              Lens Technology 同时以投资人和制造伙伴身份参与 B+ 轮，形成结构性利益冲突风险：如果 Galaxea
              需要分散制造基地、降低依赖，与本轮投资人谈判会引入董事会层面的博弈，可能阻碍最优供应链决策。类似地，Walden International 和 CICC Capital 作为 B+
              轮财务投资人，也让资本结构把融资议价能力与制造伙伴决策绑在一起。
