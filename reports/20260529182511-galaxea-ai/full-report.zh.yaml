  - id: FV001
    title: 推荐逻辑流程
    type: flow
    layout: wide
    summary: 从市场验证、技术证据和融资事实出发，经由关键风险，推导至观察（TRACK）建议和必要尽调关口。
    data:
      nodes:
        - id: n1
          label: 市场：2025 年人形机器人赛道融资 $13.8B+；UBTECH / Unitree / AgiBot IPO 浪潮
        - id: n2
          label: 技术：Physical Intelligence 使用 R1 Lite；Stanford Fei-Fei Li 实验室使用 R1 机身
        - id: n3
          label: 融资：B+ 后估值 $2.9B（CNY 20bn 共识）；累计融资 $650M+
        - id: n4
          label: 估值：2025E 收入的 290-580x；相对概率加权 $2.8B，安全边际近乎为零
        - id: n5
          label: 风险 1：估值差异 10x（$2.9B vs $29B）；无审计财务
        - id: n6
          label: 风险 2：US Security Robotics Act；相对 Figure AI / PI 的中国地缘政治折价
        - id: n7
          label: 风险 3：商业化前（2024 年收入为零）；10,000 台爬坡未验证
        - id: n8
          label: 关口 1：审计财务确认 2025 年收入和毛利率
        - id: n9
          label: 关口 2：提交 HKEX 招股书，确认估值和股权结构表
        - id: n10
          label: 建议：观察（TRACK）——关口 1 和 2 通过前不启动
