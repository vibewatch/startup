  - id: FO002
    title: Galaxea AI 公司快照 — 逻辑图
    type: flow
    layout: standard
    summary: 展示 Galaxea AI 的创始团队、技术栈、客户牵引、资本和竞争位置如何相互连接，构成公司当前的价值与风险画像。
    data:
      nodes:
        - id: founding-team
          label: 世界级创始团队
          detail: >-
            Gao Jiyang（CEO / Waymo / USC）、Zhao Hang（联席 CSO / Tsinghua / Waymo）、Xu Huazhe（联席 CSO / Berkeley / Stanford /
            Tsinghua）、Li Tianwei（COO / UCL / Momenta）。团队独特地融合自动驾驶产业与学术 AI 能力。
          tone: positive
        - id: research-base
          label: 具身 AI 基础模型
          detail: G0 VLA 模型（2025 年 8 月开源）、G0 Plus 双系统（2026 年 1 月）、Fast-WAM 世界模型（2026 年）。基于真实世界数据训练；端到端架构。
          tone: positive
        - id: hw-stack
          label: 硬件产品栈
          detail: A1 机械臂（6-DOF，$3K-$4K）、R1 轮式人形机器人（$50K）、R1 Pro（$70K）、R1 Lite（移动版）、DEXO 灵巧手。全栈自研。
          tone: positive
        - id: data-flywheel
          label: 真实世界数据飞轮
          detail: 每台部署机器人都会生成真实世界训练数据，并回流到模型改进。Galaxea 主张真实数据路线优于重模拟方法。
          tone: positive
        - id: dev-ecosystem
          label: 开放开发者生态
          detail: OpenGalaxea GitHub（5+ 个活跃仓库）；Hugging Face 组织；开源 VLA 模型和数据集。吸引研究伙伴，加速第三方集成。
          tone: positive
        - id: customers
          label: 40+ 家企业客户
          detail: Huawei Cloud、Volkswagen、Haier、Samsung、ByteDance、Physical Intelligence、Stanford、MIT 等。覆盖美国和中国学术及工业账户的验证。
          tone: positive
        - id: capital
          label: 累计融资约 $724M
          detail: >-
            天使轮到 Series B+ 共七笔已披露融资（2024-2026）。蓝筹股东结构包括 Ant Group、Hillhouse、IDG、Capital Today、Meituan、GL Ventures、Lens
            Technology。
          tone: positive
        - id: revenue-gap
          label: 收入仍处萌芽期
          detail: 2024 年商业收入为零；2025 年目标收入为数千万元人民币。收入曲线大幅落后于已融资本金。
          tone: warning
        - id: competition
          label: 国内竞争激烈
          detail: 中国有 30-40 家人形机器人初创公司；主要对手包括 Unitree（$1.7B）、AgiBot、Galbot、Fourier Intelligence。联合创始人预测市场会整合。
          tone: negative
        - id: valuation-risk
          label: 估值有争议
          detail: B+ 后估值存在争议：$29B（Yicai / 公司）对比约 $2.9B（InforCapital / PitchBook）。十倍差异未解决；没有经审计核验。
          tone: negative
        - id: market-target
          label: 目标市场
          detail: 主要市场：智能制造、物流、商业服务（2026 年）。未来市场：家庭消费使用（3-10 年周期）。R1 定价面向企业 R&D 实验室。
          tone: neutral
        - id: ipo-path
          label: 潜在香港 IPO
          detail: 2026 年 1 月完成股改，转为股份制公司。GMT8 Press（2026 年 5 月）报道公司计划赴港上市，目标募资 $500M。尚未得到官方确认。
          tone: neutral
