        - 降估值轮信号；原投资逻辑失效；需要立即重新评估
      - - 美国地缘政治升级
        - 美国新行政令或立法禁止投资 Galaxea 硬件，或禁止进口 Galaxea 硬件
        - OFAC / Commerce BIS 观察名单；年度 NDAA 立法
        - 减仓或退出；IPO 市场准入受到严重限制；美国机构参与受阻
      - - 领导层离职
        - CEO Gao Jiyang 或联席 CSO Zhao Hang / Xu Huazhe 宣布离职
        - LinkedIn、公司官方渠道、中国财经媒体
        - 暂停；现阶段创始团队连续性是主要估值驱动因素
      - - IPO 撤回或推迟超过 12 个月
        - 到 2026 年 Q4 仍未提交 HKEX 招股书；或正式宣布撤回 IPO
        - HKEX 新上市公告；公司官方沟通
        - 流动性风险急剧上升；继续跟踪但不追加资本；寻求二级市场买盘
      - - 竞争平台赢得 Physical Intelligence / NVIDIA 合约
        - PI 或 NVIDIA 公开将机器人硬件底座切换至竞争对手（如 Figure、Fourier）
        - PI / NVIDIA 新闻稿、引用硬件的学术论文
        - 投资逻辑部分受损；开发者市场护城河受到质疑
    notes: 触发项是基于公开可观察信号设定的定性阈值。全部都是时点指标，至少应每季度监控一次。截至报告日期（2026 年 5 月 29 日），上述触发项均未发生。
    claimRefs:
      - CV034
      - CV035
      - CV009
