      - number: '6.4'
        title: 留存、GTM 动作与分销
        blocks:
          - type: paragraph
            body: >-
              Galaxea 同时跑两条相互重叠的 GTM 路线：企业直销渠道，以及开源开发者驱动渠道。直销渠道面向企业研究实验室和工业制造商； 机器人按配置不同定价 RMB 320,000–459,900（约
              $44,500–$64,000）。这个价位意味着部署需要正式采购流程、技术集成， 也很可能需要带售后支持的合同。RBTX（igus 机器人市场）把 Galaxea 列为合作伙伴，提供了一个二级市场触点， 但
              RBTX 列表细节很少。

              开源渠道通过 OpenGalaxea GitHub 组织和 HuggingFace 运转，GOD 数据集、GalaxeaVLA 模型和开发者文档都免费开放。 预期转化路径是：开发者下载 GOD → 在
              Galaxea 硬件上微调 → 在实验室验证 → 企业采购跟进。这类似 Hugging Face、 Weights & Biases 等 ML 基础设施公司跑通的模式，但 Galaxea
              多了一道门槛：硬件本身每台约 $50,000+，需要资本预算审批， 纯软件驱动的开发者漏斗没有这个问题。没有证据显示公司提供硬件种子 / 借用计划或学术折扣层级，来加速开发者向买方转化。

              留存方面，Galaxea 没有公开可得的 NRR、GRR、合同续约或复购数据。GOD 数据集采用非商业许可（CC BY-NC-SA 4.0），
              下载活动不等于计费留存。硬件客户一旦完成部署，会面对切换成本（已学习的模型权重、遥操作数据、集成代码）；如果部署成功， 这意味着中等粘性——但没有客户发布案例研究来证明。投资人反复参与（Ant Group 参与
              Pre-A、Series A、A4/A5； Hillhouse/GL Ventures 参与 Series A 和 Series B）是机构信心的正面信号，但不是客户留存代理指标。
