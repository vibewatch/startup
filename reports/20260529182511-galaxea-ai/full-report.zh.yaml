      - number: '1.4'
        title: 产品组合与商业规模
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI 的硬件组合以 A1 机械臂和 R1 系列轮式人形机器人为核心。A1 是一款 6 自由度力控机械臂，重量约 6 kg，末端最大线速度 10 m/s、 加速度 40 m/s²，峰值负载介于
              3.5 kg（零售列表）与 5 kg（公司文件）之间；A1XY 版本定价 $2,999–$3,999，约为 Franka Emika 研究型机械臂成本的十分之一。 标准 R1 轮式人形机器人具备 24 自由度（6
              自由度全向底盘 + 4 自由度躯干 + 2×6 自由度 A1 机械臂），身高 170 cm（可扩展至 200 cm），起售价约 ~$49,999。R1 Pro 升级到 26 自由度，配双 7 自由度 A2
              机械臂，最大负载 10 kg，重量 96 kg，售价约 ~$69,999；算力为 NVIDIA Jetson AGX Orin 32GB（200 TOPS）。R1 Lite（轮式双臂移动平台）和 DEXO
              灵巧手（0.1N 触觉感知，每指 1 kg 指尖力）于 2026 年 1 月在 CES 2026 首次亮相。软件方面，端到端 VLA 模型 G0 于 2025 年 8 月发布并开源；G0
              Plus（“慢思考、快执行”双系统）于 2026 年 1 月跟进；Fast-WAM 世界模型在 2026 年发布。OpenGalaxea 在 GitHub 和 Hugging Face
              上至少维护五个活跃开源仓库。截至 2025 年 8 月，Galaxea 拥有 40+ 企业客户， 包括 Huawei
              Cloud、Volkswagen、Haier、Samsung、ByteDance、Physical Intelligence、Stanford University 和 MIT。截至 2026 年 2
              月，公司据报已有数千台订单， 并计划在 2026 年实现 10,000 台量产。公司 2024 年没有收入，预期 2025 年销售额达到数千万元人民币，并以 2026 年盈利为目标。
