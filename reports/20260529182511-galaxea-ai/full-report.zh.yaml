  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI 的乐观情景建立在三个相互咬合的支柱上。第一，平台可选性：公司已搭出全栈机器人智能平台，把自研硬件（R1 轮式人形机器人、A1 机械臂）、视觉 - 语言 - 动作模型（G0
              系列）、世界动作模型（Fast-WAM）和真实世界数据引擎组合起来，支撑全球至少 40–150+
              家企业和研究客户。不同于纯硬件厂商，这套栈会沉淀复合的数据和软件资产，未来可能通过模型授权、数据即服务和开发者工具链收费，做出接近 SaaS 的变现。第二，研究验证：Physical Intelligence
              选择 Galaxea R1 Lite 作为 pi0.5 开放世界泛化模型的硬件底座，Stanford 的 Fei-Fei Li 实验室也发布了基于 R1 机身的全身操作套件；这两项独立证据说明，Galaxea
              硬件满足顶级 AI 实验室的公差要求。第三，行业动能：2025 年全球人形机器人行业融资 $13.8B，2026 年节奏还在更高水平；UBTECH 已按披露收入在公开市场以约 ~$7.6B 交易，Unitree
              已提交 IPO，AgiBot 也为自身上市瞄准 $5–6B。公开市场验证浪潮，为 Galaxea 计划中募资约 ~$500M 的香港 IPO 提供了可信流动性路径。

              反向逻辑同样扎实。按可信的 $2.9B 投后估值计算，公司价格相当于 2025 年估计收入（$3–10M）的 290–580x；UBTECH 约为追踪收入 27x，Unitree 则在盈利且高速增长的基座上为
              13–30x。这样的溢价要求 2026 年跑通 10,000 台产能爬坡，但这一点尚未独立验证。公司没有提交审计财报；唯一披露的收入数字是“数千万元人民币”的内部指引。Yicai 的 $29B 与市场共识
              $2.9B 之间 10 倍差异，是人形机器人行业最大的单项文件红旗，也让 IPO 前治理标准受到质疑。地缘政治上，American Security Robotics Act（2026 年 3
              月）禁止美国联邦采购中国制造机器人，切断了政府合同和美国机构参与 IPO 这两个最有流动性的退出市场。最后，$650M+ 累计股权融资形成的优先股堆叠意味着，在至少 $650M
              先被清偿前，普通股持有人、创始人和员工无法获得剩余收益。
