  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 地缘政治与出口管制风险
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI 面对的地缘政治经营环境正在恶化，并对其公开提出的全球扩张目标构成实质障碍。近期最尖锐的法律风险，是 2026 年 3 月 26 日由参议员 Tom Cotton（R-AR）和 Chuck
              Schumer（D-NY）在美国参议院提出的 American Security Robotics Act；众议员 Elise
              Stefanik（R-NY）也在众议院提出配套法案。这项两党法案将禁止美国联邦机构采购或运营中国公司制造的无人地面车辆——
              包括人形机器人——并禁止把任何联邦资金用于此类系统。有限豁免只适用于军事和执法部门的受控研究用途，前提是机器人不能向中国传输数据，也不能从中国接收数据。
              提案人把中国人形机器人定性为国家安全风险，称其可能监视美国设施并向中国传输数据，也可能受对手远程控制。该法案尚未通过成为法律，
              但发起人组合横跨参议院第三号共和党人和参议院民主党领袖，显示出异常强的立法动能。即便在通过前，法案提出本身也会结构性劝退美国联邦采购官和国防相关企业客户， 使研究实验室、国防承包商、国家实验室等可服务市场降温。

              半导体层面，美国出口管制持续限制中国获取先进 AI 算力。NVIDIA H20 处理器原本就是为符合此前出口管制阈值而专门设计的芯片， 但 2025 年 4 月又在额外限制下被禁止面向中国客户。Galaxea
              R1 和 R1 Pro 出货时搭载 200 TOPS 的 NVIDIA Jetson AGX Orin 模块；如果性能更强的 Jetson 世代被归入受限技术，Galaxea 将遭遇供应中断，
              被迫迁移到中国国产替代方案（Huawei Ascend、Cambricon），并承受实质性能下降。2026 年 4 月的美国众议院立法正在主动瞄准 AI 算力出口漏洞，包括通过云端进行的训练；这与 Galaxea
              的开源数据集训练栈直接相关。如果更广泛的 AI 出口管制覆盖 VLA 模型权重或机器人软件， 风险会进一步叠加。

              中国自身对稀土矿物的出口管制——包括 2026 年通过《进出口许可证目录》纳入的钐、钆、镥化合物——对 Galaxea 是一把双刃剑。 作为注册地在中国的制造商，Galaxea
              可在国内不受限制地获得执行器所需的关键稀土磁体；西方人形机器人竞争对手则面对许可证延迟和价格飙升。 但如果 Galaxea
              为出口市场扩张制造产能，稀土许可制度会增加合规复杂度；任何进一步限制中国机器人出口的报复性升级，也会直接损害 Galaxea 的全球分销计划。 Tesla CEO Elon Musk 在 2025 年 4
              月公开承认，中国稀土管制已经扰乱 Optimus 生产，说明这一机制对任何非中国制造商都足够严厉。

              CNBC 2026 年 4 月的报道确认，中美紧张关系已显著冷却跨境投资：大型美国养老基金降低了对中国 AI 和机器人初创公司的敞口， 中东主权基金正在填补资本缺口。投资人碎片化会提高 Galaxea 从西方
              LP 获得资本的成本，也会缩小退出时有能力执行跨境交易的战略收购方范围。
