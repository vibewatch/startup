  - id: FE002
    title: 客户工作流 / 运行流程
    type: flow
    layout: wide
    summary: 端到端工作流从研究团队决定部署机器人学习项目开始，经数据采集、训练和部署，展示 Galaxea 硬件与软件在各阶段如何集成。
    data:
      nodes:
        - id: setup
          label: 研究员设置 R1 Lite + Teleop Kit
          detail: >-
            通过 USB 将 JoyCon 同构控制器连接到运行 Ubuntu 22.04 和 ROS Humble 的笔记本。R1 Lite 通过 LAN/Ethernet
            连接。每次会话前设置初始姿态。按开箱指南，平均设置时间约 ~30 min。
          tone: neutral
        - id: teleoperate
          label: 同构 / VR 遥操作 — 采集示教
          detail: 操作员手臂动作以 1:1 映射到机器人（同构），或通过 VR 头显映射。数据记录为 LeRobot v2.1 格式，并带有子任务级语言标注。覆盖住宅、零售、餐饮、办公场景中的 150+ 任务类型。
          tone: positive
        - id: dataset
          label: 转换为 LeRobot 数据集并推送到 HuggingFace / ModelScope
          detail: GalaxeaLeRobotToolkit 转换录制数据。GOD 数据集格式兼容标准 HuggingFace datasets API。可使用私有数据集；也可通过 GOD 镜像公开共享。
          tone: neutral
        - id: finetune
          label: 在特定任务数据上微调 G0Plus 或 G0Tiny
          detail: >-
            finetune.sh 脚本（8 GPUs）；任务配置位于 configs/tasks/real/；支持 G0Plus（完整微调需要 A100 80GB）或 G0Tiny（用于 Orin 部署的轻量微调）。训练记录到
            SwanLab。仅推理最低需要 8GB VRAM。
          tone: neutral
        - id: deploy
          label: 通过 EFMNode 将训练好的检查点部署到 R1 Pro / R1 Lite
          detail: >-
            EFMNode 管理推理循环；G0Tiny 通过 TensorRT 在设备端以 10 Hz 服务。G0Plus 推理由 RTX 4090 工作站（8GB+ VRAM）服务。已验证的开箱演示：Pick Up
            Anything、Fold Towels、Handover Gift。
          tone: positive
        - id: iterate
          label: 采集失败案例示教 → 重新微调 → 重新部署
          detail: 主动学习 / 失败修正循环。新的真实世界任务数据加入私有数据集；重新运行 G0Plus 微调。数据飞轮：每台已部署机器人都为下一轮迭代产生训练信号。
          tone: positive
      edges:
        - from: setup
          to: teleoperate
          label: 硬件就绪
        - from: teleoperate
          to: dataset
          label: 原始录制数据
        - from: dataset
          to: finetune
          label: LeRobot 格式
        - from: finetune
          to: deploy
          label: 检查点
        - from: deploy
          to: iterate
          label: 失败数据
        - from: iterate
          to: finetune
          label: 增强数据集
    claimRefs:
      - CE026
      - CE027
      - CE028
      - CE030
      - CE031
  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: Galaxea 在硬件、计算、模型和分销层的关键外部依赖，以及依赖类型和相关风险。
    data:
      nodes:
        - label: Galaxea AI 平台
          detail: 全栈机器人硬件 + VLA 模型 + 开发者生态；所有产品均以 Galaxea Dynamics 品牌销售
        - label: NVIDIA 计算栈（Jetson AGX Orin / CUDA / JetPack）
          detail: 所有 R1 变体的计算依赖：200 TOPS 推理；TensorRT 用于 G0Tiny 边缘部署。存在美中出口管制风险。
        - label: Google (PaliGemma-3B)
          detail: G0Plus 主干的基础 VLM；开源权重模型（Apache-2.0）。风险：模型弃用或许可变更。
        - label: HuggingFace (SmolVLM2-500M / LeRobot)
          detail: G0Tiny 主干；LeRobot 数据集格式标准；模型托管。风险：格式迁移、平台风险。
        - label: Lens Technology
          detail: 执行器关键供应链伙伴；也是 Series B+ 投资方。定价 / 排他性条款未披露。
        - label: Intel RealSense D405
          detail: R1 Lite 腕部深度相机。Intel 已退出 RealSense 深度相机业务——存在产品延续风险。
        - label: ROS2 / Open Robotics 中间件
          detail: 软件中间件用于所有机器人；Humble EOL 2027。必须迁移到更新的 LTS 版本。
        - label: Physical Intelligence 兼容层（pi-0 / openpi）
