      - number: '8.5'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Galaxea 声称的退出路径是香港 IPO，目标募资约 ~$500M；这条路线的准备步骤大体完成：股改（2026 年 1 月）、香港非本地公司注册（2026 年 5 月，CR
              80393712），以及“全生态”投资人基础，包括 CICC Capital 基金（在中国近似 IPO 承销资源）、国资背景基金（Beijing Sci-Tech、Financial Street
              Capital）和产业战略方（Lens Technology、Walden International）。截至报告日，未公开提交 HKEX 上市申请或招股书草稿。

              IPO 若要吸引国际机构投资者，必须解决几项披露问题。最关键的是，10 倍估值差异必须在任何招股书给出可靠投后估值前澄清。第二，FY2024 和 H1 2025 审计财务是 HKEX
              上市前置条件，但尚未公开。第三，中美地缘风险需要明确披露 American Security Robotics Act 对 Galaxea
              美国市场准入意味着什么，以及立法后公司如何服务其美国注册伙伴（Stanford、MIT、Physical Intelligence）。

              M&A 退出也可想象。可能的战略买家包括：希望内化人形智能供给的大型中国工业集团（Haier、Foxconn、BYD）；希望为物理 AI
              模型寻找硬件锚定分发的全球半导体公司（NVIDIA、Qualcomm）；或希望为云平台补齐具身 AI
              层的大型中国互联网平台（Alibaba、Tencent——两者均已通过关联实体投资）。技术并购中，战略溢价通常较公允价值高 20–40%；若基准价值为 $2B–$3B，对应 $2.4B–$4.2B，可为 B+
              投资者提供温和到可接受的回报。

              最终尽调问题优先补齐最直接影响投资决策的证据缺口。若这些问题无法关闭，观察 / 继续研究建议仍然成立。
