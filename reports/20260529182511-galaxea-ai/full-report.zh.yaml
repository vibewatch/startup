  - id: TV006
    title: 最终尽调要求
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径 / 负责人
    rows:
      - - 经审计财务
        - FY2024 和 H1 2025 经审计财务报表（损益表、资产负债表、现金流量表）
        - 验证 2025 年收入指引是否准确、毛利率究竟如何的唯一方式
        - 直接向公司数据室索取；或等待 HKEX 招股书
      - - 股权结构表与优先权堆叠
        - 完整股权结构表，列明全部轮次估值、清算优先权、反稀释条款
        - 判断 $2.9B 投后估值是否正确，以及优先股堆叠如何影响普通股持有人回报
        - 数据室索取；HKEX 招股书会包含
      - - 生产订单储备核验
        - 对千台级订单验证和具约束力采购订单进行独立确认
        - 区分意向订单与硬订单；对供应链规划至关重要
        - 客户背调访谈；Lens Technology 供应链披露
      - - 估值差异解决
        - Galaxea 正式书面澄清 B+ 后估值是 CNY 20bn 还是 CNY 200bn
        - 该差异是最大的单一治理担忧；HKEX 上市保荐人会要求解决
        - CFO / 法务书面陈述；必要时取得律所意见
      - - 美国市场准入法律意见
        - 关于 Galaxea 硬件和数据合同暴露于 American Security Robotics Act 的法律备忘录
        - 决定可服务市场规模，以及合同中途被打断的风险
        - 美国出口管制律师；公司法务团队
      - - 试点规模单位经济
        - BOM 拆分、直接人工、质保拨备，以及首批交付的实际 ASP
        - 在声称 ASP 为 $44,500-$69,999、BOM 估计 $40,000-$80,000 的情况下，毛利率可能为负
        - 制造设施审计；供应商价格核验
    notes: 优先级反映买入决策的紧迫性。第 1 和第 4 项是阻断项：两者解决前不作买入建议。第 2、3、5、6 项也重要，但可在正常 IPO 尽调中处理。
