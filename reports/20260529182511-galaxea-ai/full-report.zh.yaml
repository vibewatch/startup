      - number: '6.2'
        title: 具名客户证明与学术生态
        blocks:
          - type: paragraph
            body: >-
              最强的客户证明围绕两段具名关系展开：它们由 Forbes 确认，并由已发表学术工作佐证。Stanford University 的 Human-Centered AI 团队 （包括 Li Fei-Fei 和
              Jiajun Wu 教授）使用 Galaxea R1 平台开发了 BEHAVIOR Robot Suite（BRS）。 相关论文被 CoRL 2025 接收，开源项目网站也明确记录 R1
              是全身遥操作和演示数据采集的硬件骨干。这是一个可验证的第三方用例， 带有同行评审论文和可复现工件，因此是 Galaxea 目前质量最高的客户证明。不过，它是研究合作，不是商业部署；Stanford
              并非为服务付费， 而是在共同开发能力。

              Physical Intelligence（PI）是一家由顶级投资人支持的美国机器人 AI 公司。Forbes 确认其为客户或紧密伙伴；Sohu/Lenovo CIG 文章提到 PI 研究人员公开背书 GOD
              数据集；awesome-galaxea-developers 仓库也列出 PI 的 pi0.5 模型已在 Galaxea R1 Lite 上验证。 但 PI
              的参与看起来仍在研究和开源生态内，而非商业客户关系。Physical Intelligence 自身也以开源方式发布模型（openpi）， 因此把 PI 归类为研究伙伴 /
              开发者合作者，比归为贡献收入的商业客户更准确。

              除 Stanford 和 PI 外，GitHub 上的 awesome-galaxea-developers 仓库记录了 18+ 个基于 Galaxea 硬件或 GOD 数据集的开源研究项目，来自
              BAAI（RoboBrain-X0）、Stanford（BRS、VR-Robo、DenseMatcher）等机构， 以及在 CoRL 2025、RA-L 2025、ICLR 2025、CVPR 2025
              发表论文的研究团队。这构成了一个实质性的学术生态， 但所有项目看起来都非商业化。「在 Galaxea 硬件上使用开源工具的开发者 / 研究者」与「付费企业客户」之间的差别，对收入建模至关重要；
              公开证据尚未解决这个问题。

              更宽泛的 40+ 客户名单——二手来源会加入 Huawei Cloud、Volkswagen、Haier、Samsung、ByteDance 等名字——来自聚合网站和 AI wiki
              （sudoremove.com、aiwiki.ai），而不是一手来源。唯一直接采访 Galaxea 管理层的权威媒体 Forbes 只确认了 Physical Intelligence 和
              Stanford。在取得独立确认前，审慎分析应把更宽泛的工业客户名单视为公司声称、佐证较弱的信息。
