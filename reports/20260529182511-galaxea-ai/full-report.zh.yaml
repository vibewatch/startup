figures:
  - id: FO001
    title: Galaxea AI 公司里程碑时间线
    type: timeline
    layout: standard
    summary: 按时间记录 Galaxea AI 从 2023 年 9 月到 2026 年 5 月的创立、融资事件、产品发布和公司治理变化。
    data:
      items:
        - date: Sep 2023
          label: 公司成立
          detail: >-
            Gao Jiyang、Zhao Hang、Xu Huazhe 和 Li Tianwei 在北京创立 Galaxea AI。团队融合 Tsinghua、Berkeley、Stanford、USC，以及 Waymo /
            Momenta 背景。
          tone: positive
        - date: Jan 2024
          label: 天使轮 — IDG 与 Baidu Ventures
          detail: 首笔机构资本（数千万美元）来自 IDG Capital、Baidu Ventures、MiHoYo（Argo Technology）和 GSR Ventures。
          tone: positive
        - date: Nov 2024
          label: Pre-A — RMB 200M+，Hillhouse 与 Ant Group
          detail: Hillhouse Capital 与 Ant Group 领投 RMB 200M+ Pre-A 轮；IDG 和 Baidu 跟投。累计融资突破 RMB 350M+。
          tone: positive
        - date: Feb 2025
          label: Series A — RMB 300M，Ant Group 领投
          detail: Ant Group 领投约 RMB 300M Series A；Hillhouse、IDG、Baidu Ventures 和 Tongge 参投。累计融资约 RMB 650M+。
          tone: positive
        - date: H1 2025
          label: R1 首次商业销售
          detail: >-
            R1 人形机器人首次商业销售（每台 RMB 320K–460K）。首批接入 40+ 家企业客户，包括 Huawei Cloud、VW、Samsung、ByteDance、Physical
            Intelligence、Stanford 和 MIT。
          tone: positive
        - date: Aug 2025
          label: G0 VLA 模型开源；估值 $700M
          detail: G0 基础模型发布并开源。A4 / A5 轮完成（合计 >$100M）；估值达 $700M，Capital Today 和 Meituan Long-Z 新加入领投。
          tone: positive
        - date: Jan 2026
          label: CES 2026 — R1 Lite、DEXO Hand、G0 Plus 首秀
          detail: R1 Lite 与 DEXO 灵巧手在 CES 2026 国际首秀。G0 Plus 双系统模型（“慢思考、快执行”）同期发布。
          tone: positive
        - date: Jan 2026
          label: 股改 — LLC 转为股份公司
          detail: Galaxea 从有限责任公司改制为股份有限公司（外商投资、未上市）；更名为 Galaxea (Beijing) AI Technology Co., Ltd.。这是 IPO 准备信号。
          tone: neutral
        - date: Feb 2026
          label: Series B — RMB 1bn，成为独角兽
          detail: >-
            Series B 约 RMB 1bn（约 $144M）完成。投后估值约 RMB 10bn（$1.4B）；Galaxea 成为独角兽。新投资方包括 Jinding Capital、BAIC
            Capital、Bihong、Loyal Valley、Qianhai Ark、InnoVen。累计融资约 RMB 3bn。
          tone: positive
        - date: Apr 2026
          label: Series B+ — RMB 2bn（$290M）；估值存争议
          detail: >-
            Series B+ 约 RMB 2bn（$290M）完成。Yicai 按公司公告报道估值 CNY 200bn（$29B）；InforCapital / PitchBook 显示约 $2.9B。Lens
            Technology 作为供应链伙伴加入。
          tone: neutral
        - date: May 2026
          label: 香港 IPO 计划被报道
          detail: GMT8 Press 报道 Galaxea 计划赴香港上市，目标募资约 $500M。公司尚未正式确认。
          tone: neutral
        - date: 2026 H1
          label: 计划 10K 台规模量产
          detail: CNTechPost 报道 Galaxea 计划在 2026 年启动 10,000 台规模生产，目标场景为智能制造、物流和商业服务。
          tone: positive
    approximationNotes: H1 2025 轮次的确切交割日期为近似值；部分来源给出区间。USD 换算使用约 7.1 CNY/USD 汇率。IPO 报道尚未得到 Galaxea 官方确认。
