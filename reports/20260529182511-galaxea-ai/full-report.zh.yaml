  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与 SKU 图谱
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI 销售四类产品，分属两个硬件家族和一个软件 / 模型单元。机械臂家族以 A1Z 为核心——这是一款 6-DOF、5 kg、力控桌面机械臂，定价 $2,999；它既可单独销售，也以 A1X
              变体嵌入 R1 Lite。 移动操作家族覆盖三种轮式人形机器人配置：R1 Lite（23 DOF、128 cm、$39,999）、R1（24 DOF、170 cm、 约 $49,999）和 R1 Pro（26
              DOF、170 cm、$69,999）。三款 R1 的上半身都在四自由度躯干上使用双 Galaxea A 系列机械臂，下半身则是最高 1.5 m/s 的三轮矢量驱动底盘。区分各版本的关键设计选择是机械臂自由度
              （6 对 7）和算力配置：R1 Lite 与 R1 使用 200 TOPS 的 NVIDIA Jetson AGX Orin 32 GB， 标准 R1 规格页则声称可选 550 TOPS 配置。R1 Pro 的双
              7-DOF A2 机械臂集成力传感器，最大合计载荷 10 kg，高于 R1 Lite 和 R1 的 5 kg。硬件之外，Galaxea 最具战略差异化的产品是 G0 VLA 单元—— 预训练、开箱即用的 VLA
              体验，预装在 R1 Pro 和 R1 Lite 上。G0Plus 3B checkpoint 以可部署的抓取放置模型交付， G0Tiny（250 M 参数）则借助 TensorRT 在设备端实现最高 10 Hz
              推理。所有产品均在苏州制造并全球发货； 交付周期和具体可供货数量需直接向 Galaxea Dynamics 咨询。
