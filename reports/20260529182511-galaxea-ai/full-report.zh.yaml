      - number: '3.3'
        title: 西方与国际同业
        blocks:
          - type: paragraph
            body: >-
              Figure AI 于 2025 年 9 月完成 $1B+ C 轮，估值 $39B，累计融资超过 $1.9B。Figure 03 已部署在 BMW Spartanburg 工厂，处理超过 90,000
              个汽车零部件； 公司 BotQ 工厂每 90 分钟生产一台，展示了美国公司中最先进的人形机器人制造爬坡能力。Figure AI 的 Helix AI 系统和 BMW 合作，是西方汽车 OEM
              场景中商业化人形机器人部署最清晰的路径——而 Galaxea 尚未具备服务这一市场的位置。Physical Intelligence 于 2025 年 11 月完成 $400M B 轮，估值 $5.6B；2026
              年初又据报讨论以 $11B+ 估值再融资 $1B。其 π0.7 通用策略模型于 2026 年 4 月开源，不绑定硬件，可在包括 Galaxea R1 Pro 在内的任何兼容平台上运行，直接挑战 Galaxea 的
              G0 VLA 开源策略。模型不依赖特定硬件，降低了整个生态的切换成本， 也压缩了单一 OEM 自有数据集的排他价值。1X Technologies 开售后五天内售出约 10,000 台 NEO，单价
              $20,000，另与 EQT Group 签下 10,000 台企业订单； 公司目标以 $10B 估值融资 $1B。NEO 的 $20,000 定价比 Galaxea R1 Pro 低 71%，占据
              Galaxea 不覆盖的 prosumer 到轻工业价格带。Boston Dynamics 的 Atlas 拥有 56 自由度，是现有商业人形机器人中机械能力最强的产品；但其 2026 年全部产能已留给
              Hyundai Group 内部使用，至少到 2027 年前基本退出开放商业市场。Apptronik 于 2026 年初完成 $935M A 轮，估值 $5.5B；Apollo 已在
              Mercedes-Benz、GXO Logistics 和 Jabil 试点部署，并目标在规模化后把单台价格压到 $50,000 以下。 CNBC 把 Apptronik
              的融资标题写成“击败中国人形机器人”的资金，反映出中美竞争叙事正在升温。Counterpoint Research 确认，2025 年全球销售的全部人形机器人中约 90% 由中国制造， 无论 AI
              成熟度如何，中国本土厂商都掌握结构性产量优势。
