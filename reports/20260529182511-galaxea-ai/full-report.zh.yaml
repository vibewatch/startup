      - number: '4.2'
        title: 融资历史与资本充足性
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI 在不到 30 个月里完成至少六个已披露融资轮次，最终是 Jinding Capital 领投的 B 轮（2026 年 2 月，~$144M / RMB 1bn），估值 RMB
              10bn（~$1.4B），随后马上完成 B+ 轮（2026 年 4 月 2 日，~$290M / RMB 2bn），投资人基础大幅扩展。B+ 轮吸引了一个“全生态”联盟：产业资本 （Walden
              International、Lens Technology、Sixcore Investment、Times Bonile、Aero Engine Fund）、长期机构资金（Xiuyuan
              Capital、Hongzhang Investment、Yuhai Capital）、国资背景载体（Financial Street Capital、Jinpu Investment、Beijing
              Sci-Tech、Guoyuan Equity），以及头部私募股权 （CICC Capital 旗下基金、Puhua Capital、Hongtai Fund、GF Qianhe）。更早轮次包括 Capital
              Today 领投的 A 轮（2025 年 7–8 月，>$100M，估值 $700M），Meituan Long-Z、Ant Group、IDG Capital、Baidu Ventures、GL
              Ventures 和 FunPlus 参投。累计融资总额的报道从 $563M（InforCapital， 5 轮）到 $654M（PremierAlts）不等，差异来自对天使 /
              种子轮的处理和汇率换算方法不同。B+ 轮后估值争议很大：Yicai 英文文章写成“CNY200 billion (USD29 billion)”，而 HKET、Tencent News 和 GMT Eight
              等中文报道一致写为“已突破200亿元”（即 CNY 20bn，~$2.78B），InforCapital 和 PremierAlts 也独立记录为 $2.9B。10 倍差距强烈提示，Yicai
              英文翻译把“200亿”（200 个亿 = 200 亿元人民币）误写成“200 billion CNY”——这是双语财经报道中常见的转录错误。 没有经审计来源确认任一数字。从资本充足性看，仅 2026 年 2–4
              月窗口公司就融资约 ~$434M，近期现金位置看起来稳健；但烧钱速度未披露。2026 年 1 月完成股改后， 公司从有限责任公司转为股份有限公司（外商投资、未上市）；2026 年 5 月又在香港以商业登记号
              80393712 注册非香港公司——两者都是目标募资 ~$500M 的香港 IPO 准备步骤。
