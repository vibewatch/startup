  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              与 Galaxea AI 最相关的市场，是能在人类中心环境中完成移动操作的软硬件一体平台：全身人形机器人、轮式移动操作机器人（R1 产品家族）以及具身 AI 软件层（VLA 模型、开发者
              SDK）。本章明确排除固定式工业协作机械臂、用于单轴抓放的 SCARA / delta 机械臂、没有操作能力的传统 AGV / AMR 车队，以及纯云端 LLM 推理服务。Galaxea
              目标用例的存量替代方案包括固定式工业机器人（汽车焊装和喷涂中的主力）、人力外包（中国庞大制造业劳动力中的主要替代项）和任务专用机器（例如专用视觉检测机器人）。
              可能扩张总机会的相邻领域包括人机协作（cobot）平台、工业数字孪生软件，以及养老护理或家庭服务机器人——这些代表未来市场延伸，而不是当前核心。2025 年全球人形机器人市场规模因口径不同为
              $1.9B–$5.4B；若纳入完整平台层，中国具身智能市场在 2025 年达到约 820 亿元人民币（$11.4B）。Galaxea 竞争的子赛道是移动操作机器人与全尺寸人形机器人， 深度 AI
              集成是差异化核心。
