  - id: FE001
    title: 产品架构图
    type: stack
    layout: standard
    summary: Galaxea 的产品栈从底部物理执行器，到感知、计算和软件，再到顶部基础模型智能。每一层展示 R1 系列的关键组件、供应商及集成方式。
    data:
      layers:
        - label: 基础模型层（G0 双系统 VLA）
          detail: >-
            G0-VLM（System 2 慢规划器，~1 Hz，PaliGemma-3B / 自有微调）+ G0-VLA（System 1 快执行器，~10 Hz，flow-matching 动作头）；用于边缘端的
            G0Tiny（250M，SmolVLM2）。通过 3 阶段课程在 Galaxea Open-World Dataset（100K 轨迹，500+ 小时）上训练。2026 年 1 月起适用非商业 G0Plus 许可。
        - label: AI 推理与部署运行时
          detail: >-
            EFMNode（Galaxea Embodied Deployment Node）；用于 Jetson Orin 上 G0Tiny 的 TensorRT FP16 引擎；openpi 兼容的 pi0/pi0fast
            微调脚本；SwanLab 训练日志；基于 Docker 的开箱演示包（Pick Up Anything、Fold Towels、Handover Gift）。
        - label: 软件中间件层
          detail: >-
            OS：Ubuntu 22.04；ROS2 Humble（EOL 2027）；Orin 上的 NVIDIA JetPack 6.0；GalaxeaLeRobotToolkit（LeRobot v3.0
            fork，Apache-2.0）；GalaxeaManipSim（30+ 仿真环境、17 个任务、Diffusion Policy 基线）。用于同构遥操作的 SDK（基于 LAN）。
        - label: 计算与传感器融合
          detail: >-
