      - number: '1.5'
        title: 公司里程碑与风险信号
        blocks:
          - type: paragraph
            body: >-
              成立后的前 30 个月里，Galaxea AI 接连完成融资与产品里程碑，节奏相当罕见。关键公司事件见下方里程碑表。正向轨迹之外，仍有几项风险信号值得关注。 第一，Yicai 报道的 $29B B+
              轮估值与第三方跟踪机构（InforCapital、PitchBook）相差约十倍；差异尚未被独立厘清，可能来自前瞻性估值上限或数据录入错误。 第二，公司 2024 年收入为零，2025
              年销售才刚起步，已融资本（约 $724M）与已验证商业产出之间存在明显落差；在缺少经审计财务数据时，这是重大不确定性。 第三，Galaxea 面对约 30–40 家中国人形机器人初创公司的激烈竞争，包括
              Unitree Robotics（估值约 ~$1.7B）、AgiBot、Galbot、Fourier Intelligence 和 LimX Dynamics。联合创始人徐华哲本人也在 Forbes
              中承认，“中国现在的人形机器人公司可能太多了”，并预测未来三到五年会出现整合。第四，2026 年 1 月从有限责任公司改制为股份制， 显示 IPO
              准备在推进，但也在快速扩张期放大治理风险。截至报告日，公开来源未发现诉讼、监管处罚、裁员或领导层离职。
