            RAM）。传感器融合：立体 RGB（头部）、Intel RealSense D405 RGB-D（腕部）、5× 单目 RGB（底盘）、360° LiDAR。
        - label: 感知硬件
          detail: >-
            R1 Pro：1× 双目 RGB（头部，120mm 基线）、2× 腕部深度相机（可选）、5× 底盘 RGB、1× 360° LiDAR；双 IMU。R1 Lite 增加立体视觉 + 双 RealSense
            D405。A2 关节配力 / 扭矩传感器（R1 Pro）；所有机械臂均配自有关节编码器。
        - label: 执行器与运动学层
