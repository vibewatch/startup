      - number: '5.5'
        title: 部署、集成与路线图
        blocks:
          - type: paragraph
            body: >-
              所有 Galaxea 机器人都从苏州发货，预装 ROS2 Humble，文档可在 docs.galaxea-ai.com 查看（由 userguide-galaxea GitHub 仓库生成）。在 R1 Pro
              Orin 平台上，G0Tiny 的端到端推理延迟标称低于 200 ms（从画面到动作）；Pick Up Anything、Fold Towels、Handover Gift 等开箱演示通过 Docker
              容器和分步脚本提供。R1 Pro 的连接选项包括 Ethernet、HDMI 和 USB；为保证 SDK 稳定低延迟运行， 官方建议使用基于 LAN 的遥操作。R1 Lite 同构遥操作套件需要一台专用
              Ubuntu 22.04 笔记本作为上位机，并安装 ROS Humble；由于不稳定，官方明确不建议使用基于 Bluetooth 的连接。产品路线图上，Galaxea 已确认正在开发 G0.5
              模型，目标是突破单一演示专精，覆盖更广泛的通用任务能力。公司还提到 Fast-WAM（一条世界-动作模型路线）， 作为与 VLA 并行的努力；Galaxea 将其表述为在两种 AI
              范式之间做风险管理，而不是押注单一路线。生产规模目标很关键： 按公司和投资人说法，Galaxea 已验证千台级订单规模，并将 2026 年目标指向万台级出货。早期商业部署优先选择了五个标准化工业场景：
              物料搬运、抓取放置、封装打包、服装折叠和设备联动。截至 2025 年 8 月，一款双足人形机器人正在开发中，据称目标是在 2026 年发布，把产品线从轮式平台延伸出去。
