      - number: '5.6'
        title: 信任、安全、安保与合规
        blocks:
          - type: paragraph
            body: >-
              Galaxea R1 Pro 的防护等级为 IP20，可防护大于 12.5 mm 的物体和灰尘，但不防水。这个等级把部署限制在干燥、
              恒温的室内环境；如果不升级外壳，潮湿制造场景或户外现场都无法覆盖。humanoid.guide 和 aparobot.com 的第三方档案将该机器人评为
              「可与人类安全共处」，依据是传感器套件、智能运动规划和力控关节。低于 200 ms 的端到端推理延迟也被列为协作操作中与安全相关的规格。 Galaxea AI 尚未公开披露 ISO 10218:2025 或 CE
              marking 认证；对欧美受监管工业部署来说，这是重大缺口。软件安全方面， G0 Plus Community License 明确限制商业使用——包括生产部署和向第三方提供服务——除非另行取得 Galaxea
              商业许可； 许可边界是 2026 年 1 月 4 日的提交。2026 年前内容仍保留 Apache-2.0。文档明确声明不对遥操作期间的网络中断、 延迟和抖动负责，说明远程操作的实时安全由操作者共同承担。R1
              Lite 机械臂没有电机制动器：用户指南要求操作者在断电前手动托住双臂， 防止突然下落——在没有安全联锁的实验室部署中，这是相关安全事项。Galaxea Open-World Dataset
              采集于真实住宅和公共空间， 但尚未公开正式的隐私影响评估或数据治理文件。
