      - number: '2.2'
        title: 市场规模与分析师预测
        blocks:
          - type: paragraph
            body: >-
              分析师对 2030 年全球人形机器人市场的预测跨度很大——从 $11B（BCC Research，偏硬件）到 $15.3B（MarketsandMarkets，自下而上）再到 $39B（TechRT /
              Business Research Company，纳入 AI 平台层）——背后是范围定义和采用假设的根本差异。Goldman Sachs 从劳动力短缺视角出发，给出未来 10–15 年（自 2023/24
              起）至少 $6B 的基准情景，并把 2035 年修订估算定为 $38B；若所有采用障碍都被打破，蓝天情景可达 $154B。Grand View Research 将更广义的具身 AI 市场（含软件）估为 2025
              年 $4.7B，并预计到 2033 年增至 $67.6B，CAGR 约 41%。2025 年全球人形机器人出货量超过 18,000 台，同比增长 508%，中国占这些装机量的 80% 以上。中国自身市场预计到
              2030 年超过 1000 亿元人民币（~$14.2B）。TrendForce 估计中国人形机器人产量将在 2026 年激增 94%；AinChina 则按不同情景预测 2026 年中国总出货量为
              62,500–200,000 台。预测分歧如此大，精确估算 SAM/SOM 并不可靠；下方规模表保留来源差异，突出方法差别，而不是合成单一数字。
