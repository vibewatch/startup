      - number: '6.5'
        title: 集中度与 GTM 风险
        blocks:
          - type: paragraph
            body: >-
              Galaxea 的客户基础有几类相互关联的集中度风险。第一是地域集中。如果 40+ 企业客户主要是中国公司（CEO 关于中国车企的说法， 以及来自中国企业的投资人构成都指向这一点），客户基础就高度偏中国。要实现
              50% 海外目标，Galaxea 必须在包括美国在内的市场完成资质准入和销售； 在这些市场，公司既面对中美技术出口管制带来的地缘政治风险，R1 机器人目前也缺少已发布的安全认证（CE 或
              UL/OSHA），这一点在第 5 章已有记录。

              第二是行业集中。已确认客户绝大多数处于研究 / 算法训练角色（Stanford、PI、BAAI），没有公开证据确认产生收入的生产部署。 如果研究客户迟迟不能转化为工业生产客户，收入增长就会落后于已投入资本。

              第三是平台集中风险。开源渠道带来一种风险：大型企业（包括美国 AI 实验室）可能基于 Galaxea 免费开放的数据和模型搭建自己的管线， 却从不购买硬件。Physical Intelligence
              本身就是例子——它自建机器人硬件（ALOHA、π0 平台），可能主要把 GOD 当作训练资源使用， 而不是作为购买 R1 设备的客户。CC BY-NC-SA 许可通过禁止在没有单独协议的情况下直接商业使用
              GOD，部分缓解了这一点， 但执行不确定，许可证治理也未公开详细说明。

              第四，NeuralWired 2026 制造就绪指南调研可用于工厂部署的生产级人形机器人平台，列出 Agility Digit、Boston Dynamics Atlas、 Figure 02/03 和
              Tesla Optimus 等候选项，却没有提到 Galaxea。这反映出 Galaxea 在中国以外作为生产级供应商的认知度有限。 缺席名单部分可以由 Galaxea
              主要市场在中国、且安全认证有限来解释；但它也说明，截至 2026 年初，Galaxea 的工业牵引说法尚未转化为西方分析师或终端用户的认可。
