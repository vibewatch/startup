      - number: '7.3'
        title: 竞争饱和与商业化风险
        blocks:
          - type: paragraph
            body: >-
              中国人形机器人市场已经进入结构性产能过剩，实质威胁 Galaxea 放大收入的能力。TrendForce 2026 年 1 月的分析把 Galaxea 放在中国 100+ 家人形机器人公司中的第二梯队，排在
              Unitree、Zhiyuan（AgiBot）、UBTECH、Galbot 之后；报告指出，一线玩家商业订单正逼近 RMB 1 billion，二线及以下公司面临生存级融资压力。TrendForce 预测
              2026 年中国人形机器人产量同比增长 94%，仅 Unitree 和 AgiBot 预计就拿下约 80% 总出货量。Galaxea 正试图从试点转向量产，硬件市场却在同一时点被集中度推向商品化。

              国家发改委已明确提示人形机器人产能过剩风险，因为 BYD、XPeng、Chery、Li Auto 等汽车 EV 厂商正把 EV 过剩资本开支转向人形机器人。BYD 已为 AI
              和机器人预留数千亿元资金，并提出其人形机器人目标单价 RMB 200,000（约 $27,600）——约为当前行业均价 ~$100,000 的三分之一，也不到 Galaxea R1 Pro $69,999
              的一半。如果 BYD 达成这一价格，行业利润率会被全面压缩，Galaxea 要么跟价并承受负毛利，要么守住高端定位但牺牲销量。Galaxea 硬件 BOM 估计为每台
              $40,000–$80,000，在不陷入结构性亏损的前提下吸收价格压力的空间有限。

              Physical Intelligence 2026 年 4 月发布具备组合泛化能力的 pi0.7 VLA 基础模型，对 Galaxea 的 G0 生态护城河构成直接竞争威胁。pi0.7
              展示了把不同场景中学到的技能组合起来、执行训练中从未见过的新任务的能力；在部分任务上，零样本成功率可比专家人类。该模型通过开源 OpenPI 库提供。TechCrunch 报道称 Physical
              Intelligence 正讨论新一轮融资，估值约 ~$11B（高于 $5.6B），说明投资人对西方 VLA 路线信心很强。Physical Intelligence 的 pi0
              仍局限于窄任务分布时，Galaxea 的 G0 数据集（500+ 小时、150+ 个任务）是差异点；pi0.7 已展示泛化能力后，Galaxea 必须加速 G0.5 路线图，否则核心模型 - 数据优势会被商品化。

              从 40+ 个企业试点转化为量产收入，仍是最关键、也最未被验证的主张。公司声称拥有千台级订单管线，但尚未得到独立确认；R1 系列也没有被报道出现生产规模的商业部署。Galaxea
              的五个商业场景（物料搬运、抓取放置、涂胶 / 密封、衣物折叠、设备互联）只是工业用例中的一条窄切口，仍要面对更低成本机械臂、AMR
              和既有工业自动化厂商竞争。公司没有公布从部署到留存的转化率，也没有任何客户结果数据，投资者因此难以判断早期合作的持久性。
