  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与买方画像
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI 的客户池可分为四个清晰客群，买方画像、使用场景和收入贡献差异都很大。第一类、也是当前规模最大的客群，是企业研究实验室和公司 AI 团队——二手来源点名的 Huawei
              Cloud、ByteDance、Samsung 等组织，主要采购 Galaxea 硬件用于具身 AI 算法训练、 数据采集和内部研发。这类买方技术准备度高、研发预算充足，但没有独立公开声明可证实其部署；2025
              年 8 月，CEO 高继扬在拒绝向 Forbes 透露工业客户名称时，给出的理由是 NDA。

              第二类是学术机构。Stanford University 和 Physical Intelligence（一家美国 AI 公司）是 Forbes 这家权威独立来源唯一点名的客户。 Stanford 的合作产出了
              BEHAVIOR Robot Suite（BRS）：这是一篇 CoRL 2025 论文和开源框架，围绕 Galaxea R1 构建， 用于全身家庭操作。Physical Intelligence 的 pi0.5
              模型已在 Galaxea R1 Lite 上验证，并列入公司开放生态仓库。 MIT 被二手聚合来源提及，但没有独立确认。BAAI（Beijing Academy of AI）也在研究场景中把
              RoboBrain-X0 基础模型部署到 Galaxea R1 Lite 上。

              第三类是全球开发者和研究社区，主要通过 HuggingFace 上的 Galaxea Open-World Dataset（GOD）以及 OpenGalaxea GitHub
              组织参与。按机器人生态标准，这个社区规模不小——2025 年 8 月发布后两个月内数据集下载量超过 400,000 次，GalaxeaVLA 仓库到 2026 年 2 月拿到 593 个 GitHub
              stars——但参与性质是非商业的，受禁止直接商业使用的 CC BY-NC-SA 4.0 许可约束。这条漏斗尚未被验证为通向付费企业客户的路径。

              第四类、也是战略上最重要的客群，是工业制造商。Galaxea CEO 向 Forbes 确认，未具名的中国车企计划在 2025 年底开始使用 R1 在工厂车间运送货物。 BAIC Capital（Beijing
              Automotive Group）参与 B 轮，释放了潜在部署兴趣信号，但没有部署协议被公开确认。Meituan Long-Z 参与 A 轮， 可能对应物流部署角度，但同样没有披露部署条款。Galaxea
              优先推进商业落地的五个标准化场景——物料搬运、抓取放置、封装打包、 服装折叠和设备联动——都属于工业客群。
