      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 平台可选性真实存在，但尚未变现
            body: >-
              Galaxea 全栈平台——R1 硬件、G0/G0 Plus VLA 模型、Fast-WAM 世界模型和多场景数据引擎——相较纯硬件竞争对手，提供了可信的护城河差异。Physical Intelligence 用
              R1 Lite 支撑 pi0.5，Stanford 的 Fei-Fei Li 实验室也基于 R1
              机身开发，这些独立第三方验证具有分析权重。如果数据飞轮放大，可能产生接近软件的经济性。但这些可选性尚未转化为已披露的经常性收入，因此只是定性溢价，投资者必须谨慎定价。
            calloutType: strength
            claimRefs:
              - CV031
              - CV032
              - CV033
          - type: callout
            title: 10 倍估值差异是首要治理红旗
            body: >-
              Yicai 的“$29 billion”和市场共识的“$2.9 billion”之间的缺口，在人形机器人行业很特殊。如果真实投后估值是 $2.9B（CNY 20bn），且得到
              Gasgoo、HKET、InforCapital 和 PremierAlts 支持，那么 Yicai 英文文章存在重大事实错误。如果真实投后估值是 $29B（CNY 200bn），Galaxea 就必须拿到比同期
              Physical Intelligence $5.6B 高约 20x 的溢价；对一家处在同一商业化阶段的中国硬件公司来说，这并不可信。无论哪种情况，买入承诺前都必须解决该差异。
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV034
          - type: callout
            title: 基准估值假设投后估值为 $2.9B（CNY 20B）
            body: >-
              本章所有情景分析、回报计算和可比倍数，都锚定 Gasgoo“估值突破 200 亿元”、HKET 确认超过 CNY 20 billion、InforCapital $2.9B 记录以及 PremierAlts
              $2.9B 数据库条目共同支持的 $2.9B（CNY 20bn）数字。Yicai 的 $29B 数字被视为大概率翻译错误，不作为估值锚点。如果 $29B 是正确的，整个分析会大幅转向昂贵 / 回避。
            calloutType: assumption
            claimRefs:
              - CV003
              - CV004
              - CV005
          - type: callout
            title: 观察 —— 技术强、价格偏高、披露不透明
            body: >-
              投资建议为观察。Galaxea 拥有真实技术资产、世界级团队、战略行业位置，以及 2026–2027 年可行的 IPO 退出路径。但 $2.9B 入场价相对概率加权公允价值 ~$2.8B
              几乎没有安全边际；缺少审计财报和 10 倍估值差异造成的治理不确定性，若没有数据室或 HKEX 招股书无法解决。转为买入需要：（1）经审计的 2025 年财务确认收入和毛利率，（2）提交 HKEX
              招股书并确认股权结构表和投后估值，（3）验证 2,000+ 台具有约束力订单的生产积压。转为回避需要：TV005 中任何投资逻辑破裂触发器出现，尤其是估值被确认显著低于
              $2.9B，或美国升级措施阻断公司的国际研究合作。
            calloutType: recommendation
            claimRefs:
              - CV041
              - CV042
              - CV043
              - CV009
