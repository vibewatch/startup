      - number: '5.2'
        title: 核心技术架构
        blocks:
          - type: paragraph
            body: >-
              Galaxea 的技术架构可以拆成三层：硬件（执行器、传感器、算力）、实时控制与感知中间件（Ubuntu 22.04 上的 ROS2 Humble、NVIDIA JetPack 6.0），以及基础模型层（G0
              双系统 VLA）。硬件层面，A 系列机械臂每个关节都使用高精度行星齿轮电机来提供力反馈。
              力控关节让机械臂能够做柔顺操作——它根据接触力调整输出扭矩，而不只是按位置移动——这对物体交接、叠布、装配等依赖丰富接触的任务至关重要。 R1 Lite 和 R1 在部分配置中依赖 Intel NUC（i9
              级）做本地计算，并用 Jetson Orin 做 AI 推理； R1 Pro 则把全部算力合并到一块 Jetson AGX Orin 32 GB 上。G0 架构耦合两个异步系统：G0-VLM（System 2，
              慢速，约 1 Hz）用微调后的视觉语言模型，根据自然语言指令做多模态规划和子任务拆解；G0-VLA（System 1， 快速，约 10 Hz）用基于 flow matching 的动作 Transformer
              执行细粒度电机动作。基础模型以 PaliGemma-3B（Google）作为 VLM 骨干。G0Tiny 用 SmolVLM2-500M（HuggingFace）替代 PaliGemma， 以适配 Orin
              上的边缘部署和 TensorRT FP16 量化。训练管线分三步：（1）在公开跨机器人数据集（OXE、BridgeV2、DROID）上做跨本体预训练， 获取通用世界先验；（2）在专有 Galaxea
              Open-World Dataset 上做单一本体预训练（100K 条轨迹、150+ 个任务、50 个真实世界场景， 使用 R1 Lite
              采集）；（3）面向目标部署，用演示数据做任务专属后训练（微调）。arXiv:2509.00576 论文验证了这套三阶段课程， 结果显示单一本体预训练影响最大；当本体差异较大时，它优于单独跨本体预训练。
