      - number: '4.5'
        title: 财务结论与投资尽调
        blocks:
          - type: paragraph
            body: >-
              到 2026 年中，Galaxea AI 的财务画像是一家雄心很大的商业化前机器人公司：资本底座明显大于已验证收入。
              公司优势真实存在：投资人覆盖产业资本、国资背景和一线风投；硬件产品已进入商业化生产；并且卡位正在成形的具身 AI 基础模型市场。 但尽调阻断点多且关键。第一，按 BOM 估算，R1
              系列在当前出货量下的真实毛利率未知，且很可能极薄甚至为负。第二， 如果单量不能快速跃升到 10,000+，而公司又尚未在运营上证明这一点，2026 年盈利目标就显得乐观。第三，$2.9B 与 $29B
              的估值争议暴露出公开可验证财务数据的根本缺口。第四，真实世界数据采集、双线模型开发和制造扩产成本带来高且继续上升的 burn，
              当前收入无法抵消。第五，没有港交所招股书或经审计财务报表可用于核验融资和收入说法。建议尽调路径是：（1）通过 NDA 数据室取得 2024–2025
              年经审计财务报表；（2）要求确认后的股权结构表和期权池结构；（3）要求当前出货量下 R1 Pro 的单机毛利率数据； （4）通过公司官方股权结构表或领投方确认解决估值差异；（5）将确认后的 B+
              轮后现金余额与人员增长、算力开支和制造投资对照， 评估烧钱速度。
            claimRefs:
              - CI030
              - CI031
              - CI033
              - CI040
      - number: '4.6'
        title: 附录
        blocks:
          - type: callout
            title: 估值争议——$2.9B 与 $29B 相差 10×，尚无定论
            body: >-
              一财（一家可信的上海媒体）将 B+ 轮投后估值报道为「CNY200 billion（USD29 billion）」。
              所有独立第三方数据库（InforCapital、PremierAlts）和中文媒体都一致写作「突破200亿元」 （超过 CNY 20 billion，约
              $2.78B）。最可能的解释是双语转写错误——「200亿」（200 个一亿）等于 CNY 20 billion，而不是 CNY 200 billion。若投资人用 $29B 口径做倍数分析，就会把估值高估
              10×。两个数字都未由经审计文件确认。任何尽调流程在把估值用于模型测算前，都必须先解决这个问题。
