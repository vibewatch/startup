      - number: '4.4'
        title: 财务披露缺口与估值不确定性
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI 是私营公司，没有义务发布经审计财务报表，目前也未公开任何审计报表。所有收入数字都来自公司指引，且未经审计。
              投资人股权结构、清算优先权层级、期权池规模以及债务义务（如有）均未公开。估值争议尤其关键：一财报道的 $29B 与 InforCapital、PremierAlts 及中文媒体给出的 $2.9B 相差
              10×，削弱了任何基于倍数分析的可信度。 如果 B+ 轮后正确估值约为 $2.9B，公司估值约等于 2025 年预计收入 $3–10M 的 290–580×——偏高， 但放在中国 2026 年 AI
              融资环境下的早期机器人公司里并不罕见。如果接受 $29B 口径，隐含倍数就是预计 2025 年收入的 2,900–5,800×；按当前财务基本面无法自洽，而且会让 Galaxea 的估值高于 Figure
              AI（$39B），尽管 Figure 已有 BMW 生产部署。除 4 月 2 日被一财报道为 $29B 的新闻稿外，公司没有发布正式声明澄清这些估值口径。累计融资总额也不一致 （按来源和汇率假设不同为
              $563M–$724M），B+ 轮后现金余额只是估算，未获确认。烧钱速度完全未披露；公司同时推进硬件制造爬坡、 VLA
              模型训练、世界模型开发和全球生态扩张，每一项都资本密集。港交所招股书原本是解决大部分披露缺口的主要机制，但截至 2026 年 5 月，尚未发布任何上市前文件。
