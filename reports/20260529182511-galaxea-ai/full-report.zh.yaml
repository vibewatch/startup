      - number: '4.3'
        title: 单位经济模型与成本结构
        blocks:
          - type: paragraph
            body: >-
              以当前出货量看，Galaxea 的单位经济模型结构性承压。A1Z 机械臂在公司官方 Galaxea Dynamics 店铺定价 $2,999–$3,999，明显是用入门价铺开发者生态。R1
              轮式人形机器人按配置不同（是否配五指灵巧手）定价 $44,500–$64,000；独立产品追踪网站给出的 R1 Pro 价格为 $69,999。对照这些售价，行业成本结构分析把 2026 年中端工业人形机器人的
              BOM 放在每台 $40,000–$80,000，其中执行器和运动系统单项就吃掉 BOM 的 40–50%。如果拿低端售价（$44,500 的 R1）对高端 BOM 估算（$80,000），早期毛利率会深度为负。
              即便拿高端售价（$69,999 的 R1 Pro）对低端 BOM（$40,000），隐含毛利率约 43%；但这个口径没有计入集成、 测试、现场服务和软件成本，而这些都会进入完整交付成本。Galaxea
              仍处早期量产阶段，全吸收制造成本几乎肯定高于硬件 BOM。行业预测认为，10,000+ 台规模后毛利率有望做到 15–30%，但前提是执行器（最大成本项）降本、 与 Lens Technology
              等伙伴的供应链整合跑通，以及尚未被验证的软件 / 服务附加率落地。Galaxea 选择真实世界数据采集、
              而不是仿真优先，进一步压住成本结构：真实世界具身交互数据的采集、标注和处理成本明显高于仿真数据，仿真优先的竞争对手可以避开这部分运营成本。 VLA +
              世界模型两条模型开发线并行，又在本就资本密集的领域放大了研发支出。资本效率比约为 4.43×（估值 ÷ 累计融资），低于许多纯软件 AI 同行，但对一家全栈硬件 + AI
              公司仍算合理。客户获取成本、回本周期和总留存数据均未公开披露。
