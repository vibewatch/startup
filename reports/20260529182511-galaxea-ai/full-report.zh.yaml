      - number: '7.2'
        title: 监管、法律与披露风险
        blocks:
          - type: paragraph
            body: >-
              2026 年 2 月 28 日，中国工业和信息化部发布《人形机器人与具身智能标准体系》（HEIS
              2026）——全球首个覆盖人形机器人的完整国家级监管框架，包含基础通用、类脑计算、肢体与部件、整机、应用、安全与伦理六大支柱。HEIS 2026 由 MIIT/TC08 体系下 120+
              家科研机构和制造商组成的委员会制定，强制条款涵盖结构完整性、力限制、急停机制、最低风险状态行为（系统故障时默认进入安全状态）、数据全生命周期治理，以及到 2027
              年实现端侧个人数据处理等隐私保护。标准引入五级智能分级体系，任何宣称具备商业化能力的机器人都会因此承担认证义务。对 Galaxea 而言，满足 HEIS 2026 意味着必须证明其 VLA
              推理栈符合行为安全和最低风险状态要求，力传感器与关节执行器达到物理安全规范，数据采集实践也符合新的数据全生命周期和隐私条款。

              Galaxea 尚未公开披露 R1 系列持有哪些工业安全认证。截至报告日，Galaxea 产品页和新闻材料均未列出 CE、UL、IEC 62061、ISO 10218
              或同等级认证状态。认证无法确认，Galaxea 就不能在欧洲、北美或日本受监管的工业环境中合法部署机器人，国际可服务市场因此受限。

              G0 Plus VLA 模型自 2026 年 1 月 4 日起按专有、非商业的 G0 PLUS Community License
              发布。该许可明确禁止任何商业目的的使用、复制、修改或分发，并包含一项有限专利条款，可能限制下游衍生模型开发。实际结果是：Galaxea 最强的开源模型，若没有 Galaxea
              单独授予商业许可，任何第三方伙伴把它集成进产品或服务都无法直接产生商业收入。这一结构性限制压低了 Galaxea 600,000+ 次数据集下载和开发者社区向付费客户转化的能力，也给误把 G0 Plus
              用于商业场景的客户带来法律风险。

              IPO 披露路径本身也有独立风险。International Finance Review 和 HKET 在 2026 年初报道称，Galaxea 计划赴港交所上市、目标募资 $500M，并已在 2026 年 1
              月完成改制为股份有限公司这一前置步骤。但截至 2026 年 5 月 29 日，HKEX
              News（港交所所有上市申请的公开资料库）尚未出现申请版本或招股书。这个缺口很关键：招股书需要最近几个财政年度的审计财务报表、强制性的风险因素章节，并披露所有重大关联交易、政府补贴和投资者权利。评估
              Galaxea 的机构投资者目前看不到审计财报，只能依赖新闻稿和二手来源。
