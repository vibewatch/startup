  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              到 2026 年中，全球人形与灵巧操作机器人市场约有 30 家活跃开发商，竞争格局可分为三层。第一层是中国本土量产制造商——AgiBot、Unitree 和 UBTECH——年产量已跨过 1,000
              台门槛，主要比拼规模、制造成本效率，以及贴近中国 OEM 需求。第二层是西方资金支持、AI 优先的初创公司——Figure AI、Physical Intelligence、1X
              Technologies、Boston Dynamics 和 Apptronik——软件成熟度、品牌认知和西方市场企业关系领先。第三层是更早期平台，包括 Galaxea AI、LimX Dynamics 和
              Fourier
              Intelligence，它们靠特定形态、开源生态或垂直应用聚焦竞争（例如医疗机器人）。直接机器人竞争者之外，传统方案——包括传统机械臂、自主移动机器人（AMR）和遥操作系统——在重复、结构化任务中仍有成本竞争力，
              构成间接替代风险。更关键的是，XPeng、Haier、BYD 等中国大型科技和汽车 OEM 已启动内部人形机器人项目，潜在量产竞争者正在出现，它们把制造基础设施和自有分销结合在一起。2025–2026 年，
              市场在低于 $25K 的 prosumer / 研究平台（Unitree G1、1X NEO、LimX Oli）与 $50K–$150K 的高端企业系统（Galaxea R1 Pro、UBTECH Walker
              S2、Fourier GR-2）之间明显分化。Galaxea 处于企业定价的中高端，同时提供九个主要竞争对手都没有的差异化轮式移动底盘架构。NVIDIA 的 GR00T 基础模型已被 Galaxea、
              Figure AI 等多个 OEM 采用，正在形成新平台标准：它一方面扩大 Galaxea 的生态入口，另一方面也提高全行业 AI 商品化风险。
