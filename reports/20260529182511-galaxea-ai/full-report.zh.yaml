      - number: '5.3'
        title: 软件栈与开发者生态
        blocks:
          - type: paragraph
            body: >-
              Galaxea 的软件平台建立在 Ubuntu 22.04 上运行的 ROS2 Humble 之上，Orin 算力单元使用 NVIDIA JetPack 6.0。 公司在 GitHub 运营
              OpenGalaxea 组织，截至 2026 年 4 月托管 8 个公开仓库。最活跃的仓库是 GalaxeaVLA（599 stars、46 forks，最后更新于 2026 年 2 月 14 日），包含
              G0-VLA 和 G0Plus 的微调与推理代码； 2026 年前提交采用 Apache-2.0，2026 年 1 月 4 日及之后提交的内容采用 G0 Plus Community License——
              一个仅限非商业使用的许可证。对希望在没有单独商业许可协议的情况下基于 G0Plus 做工业和生产部署的客户来说，这个非商业限制是显著障碍。 EFMNode 仓库（Galaxea Embodied
              Deployment Node）提供真实机器人推理运行时，把训练好的 checkpoint 接到物理 R1 硬件上。 GalaxeaManipSim 提供覆盖 17 个任务的 30+ 个仿真环境，支持 R1、R1
              Pro 和 R1 Lite，并带有一键安装、 LeRobot 兼容数据集导出和可即插即用的 Diffusion Policy 训练脚本。GalaxeaLeRobotToolkit（15
              stars、Apache-2.0） 是 HuggingFace LeRobot 3.0 的修改 fork，提升了数据生成速度和合并工具。GalaxeaDP 仓库（37 stars）发布了首个 Galaxea 专属
              Diffusion Policy 基线。模型权重托管在 Hugging Face 的 OpenGalaxea 名下（G0_3B_base、G0Plus_3B_base、 G0Tiny_250M_base
              checkpoints），并镜像到 ModelScope。开发者文档（docs.galaxea-ai.com）由 userguide-galaxea/Product_User_Guide GitHub
              仓库生成（38 stars、248 次提交），内容包括硬件用户指南、ROS2 教程和遥操作 SDK 设置指南。Physical Intelligence pi-0 / pi0fast 微调（基于
              openpi）已确认兼容，说明 Galaxea 有意与竞争模型框架保持生态互操作。
