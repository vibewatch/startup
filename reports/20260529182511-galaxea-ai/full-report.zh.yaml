      - number: '6.3'
        title: 采用轨迹与订单信号
        blocks:
          - type: paragraph
            body: >-
              Galaxea 的商业活动呈现出融资速度快、收入确认慢的特征。2024 年是 A1 机械臂商业发布后的第一个完整年度，公司收入为零； CEO 在 2025 年 8 月对 Forbes 表示，2025
              年销售目标是「数千万元人民币」（约 $1.4M–$7M）。相对于 A 轮交割时 （2025 年 8 月）报道的 $700M 估值，以及到 2026 年 4 月的 $2.9B+
              估值，这个收入目标非常保守。公司把盈利目标定在 2026 年；考虑到硬件制造的资本密集度，这一目标相当激进。

              单量方面，Forbes 报道的目标是到 2025 年 12 月最多交付 1,000 台机器人，约 50% 面向中国市场、50% 面向包括美国在内的海外市场。 到 2026 年 2 月，多家媒体援引 Gasgoo
              和 EqualOcean 称在手订单为「数千台」（不一定已经发货）。ChinaBizInsider 对 2026 年 4 月 B+ 轮的报道使用「千台级订单验证」这一表述，意思是 Galaxea 在把 2026
              年目标指向「万台级」量产前， 已证明该规模需求存在。没有独立审计的单量发货数字；所有量级数据要么来自公司声称，要么来自投资人沟通。

              开发者采用是更可验证的牵引代理指标。按 Lenovo CIG/Sohu（与公司有直接投资关系）的说法，Galaxea Open-World Dataset 2025 年 8 月在 HuggingFace 和
              Modelscope 发布后，两个月内下载量超过 400,000 次。到 2026 年 2 月， GalaxeaVLA GitHub 仓库累计约 593 stars 和 45 forks。对具身 AI
              数据集来说，这些信号有意义；但 GOD 许可证禁止在没有单独协议的情况下商业使用， 所以它们不能直接转化为商业牵引。awesome-galaxea-developers 仓库列出 2025 H2 和 2026
              Q1 的 18+ 个研究项目， 都使用 Galaxea 硬件，确认第三方确实在研究场景采用这套硬件 / 软件栈。

              关键缺口在于，没有任何具名客户披露合同金额、生产规模吞吐指标、复购，或客户报告的成果（例如替代人工、降低缺陷率、提升吞吐）。 这在早期硬件公司中很常见，但会给收入预测和单位经济模型带来重大不确定性。
