      - number: '3.2'
        title: 中国本土竞争者
        blocks:
          - type: paragraph
            body: >-
              AgiBot（深圳智元机器人）是全球最大的人形机器人量产厂商，2025 年出货超过 5,100 台；按上海市政府数据，它约占全球人形机器人装机基数的 39%。公司 2025 年发布的 AgiBot World
              多任务数据集，既是竞争产品，也是开源生态打法，用于加速跨平台 VLA 训练。AgiBot 估值存在争议——从 $2.1B（PitchBook）到 $6.4B（公司口径）不等——企业客户群集中在中国制造业。
              Unitree Robotics（宇树科技）2025 年出货约 5,500 台人形机器人，实现收入 $235M、净利润 $83M；其 G1 起售价 $13,500，比 Galaxea R1 Pro 低 5.2
              倍。Unitree 于 2026 年 3 月按目标 $6B 估值申请香港 IPO，若成功将成为全球首个主要人形机器人公开上市案例。UBTECH Robotics（优必选）已在香港上市（9880.HK）， 2025
              年通过部署于 BYD、NIO 和 Dongfeng 汽车装配线的 1,079 台 Walker S2，实现人形机器人收入约 RMB 2bn（≈$275M），同比增长 2,203%。UBTECH 平均售价约
              $105,000，定价高于 Galaxea 的企业层；但部署基础集中在中国汽车 OEM，与 Galaxea 当前的学术和开发者客群并不直接竞争。LimX Dynamics 于 2026 年 2 月完成 $200M
              B 轮，估值 $3.3B；其 LimX Oli 平台定价 $22,730，瞄准研究到工业之间的桥接市场。Fourier Intelligence 正把 GR-2（定价 $125,000–$150,000）
              转向康复和医疗，通过 GR-3 Care-Bot 切入，因而降低了与 Galaxea 在工业场景的直接竞争，却加剧了学术和机构研究预算之争。中国本土竞争者整体在制造规模上领先 6–18 个月； AgiBot 和
              Unitree 的自动化产线产量，Galaxea 尚未公布同等级别。
