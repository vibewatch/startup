      - number: '7.5'
        title: 财务、烧钱与治理风险
        blocks:
          - type: paragraph
            body: >-
              在这一阶段的中国深科技创业公司中，Galaxea 的财务风险画像属于最尖锐的一类。公司披露 2024 年商业收入为零，并向投资者指引 2025 年硬件销售为数千万元人民币；这意味着在累计投入资本
              $654M–$724M 的基础上，收入运行率大约只有 $3–10M。即便按硬件 AI 创业公司标准，这一资本 / 收入比也极端，反映出在商业规模真正出现前先搭全栈机器人平台的投资周期现实。估计年烧钱超过
              $100M（由约 120+ 员工、VLA 与世界模型双路线研发、制造基础设施和数据采集运营驱动）；如果限制开支加速，$290M Series B+ 估计只能支撑 18–24
              个月现金跑道。这个时间表假设窗口关闭前能成功完成 HKEX IPO 或后续融资。

              估值差异带来治理和投资者关系风险。Yicai Global 报道 Series B+ 投后估值为 CNY 200 billion（$29B），把 Galaxea 放进与 OpenAI、Anthropic
              并列的全球 AI 创业公司梯队。ChinaBizInsider 与 InforCapital/PremierAlts 数据库则记录为 CNY 20 billion（$2.9B）。10
              倍差异几乎肯定来自报道中的币种 / 数字翻译错误（CNY 200 billion vs. CNY 20 billion），而不是投资人欺诈，但它显著扰乱了国际报道。无论正确数字是哪一个，以 $654M 融资对应
              $2.9B 估值，意味着 4.4x 资本效率，对深科技公司尚可辩护；若估值是 $29B，则相当于累计融资额的 44x，对于一家收入可以忽略且没有审计财报的公司来说极高。没有 HKEX
              招股书，实际资本结构、优先权瀑布、老股交易历史和投资者权利都无法验证。如果 IPO 延迟，或市场对 AI 硬件估值恶化，下轮降价风险是真实的。

              IPO 准备阶段的治理不透明会放大风险。CEO Gao Jiyang 是唯一拥有显著公众形象的创始人；联席 CSO Zhao Hang 和 Xu Huazhe
              仍在清华任教，时间分配存在竞争，也让他们在关键制造爬坡期是否全职投入 Galaxea 存在模糊。董事会构成、独立董事人数、审计委员会结构和关联交易制度均未公开。Galaxea 投资人包括 Ant
              Group、Hillhouse Capital、Baidu、Meituan、IDG Capital、Walden International、CICC Capital 和 Lens
              Technology，横跨战略企业投资者与财务投资者，董事会层面可能在战略目标（数据合作、供应链）与财务目标（回报最大化）之间发生冲突。即将提交的 HKEX
              招股书，将是公开市场投资者首次按香港上市规则评估这些治理结构的机会。
