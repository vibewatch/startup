      - number: '2.5'
        title: 买方分层与采用动态
        blocks:
          - type: paragraph
            body: >-
              Galaxea 当前买方可分为三层，各自的预算负责人、采用触发点和准备度不同。R&D / 开发者套件层——高校实验室、企业 AI 研究团队和政府支持的研究机构——是今天准备度最高的买方。 这些客户通常采购 1–5
              台机器人，经费来自研究资助或 R&D 预算，最看重基础模型训练数据入口和平台开放性。Galaxea 声称拥有 40+ 企业客户和接近 100 家具身 AI 客户，
              与这一层主导早期收入的判断一致。工业试点层——汽车 OEM（NIO、Geely、Zeekr 是已知 Unitree 伙伴）、消费电子制造商和物流 3PL——是中期增长引擎。这些买方会跑 10–100
              台试点，先验证 ROI，再承诺车队级订单。预算负责人是运营副总裁或工厂经理；劳动力成本上升和政府工业升级激励触发采用。2025 年 Q3，中国制造商（Zhipu、Yuanli、 Unitree / China
              Mobile）出现多笔数亿元人民币商业订单，说明工业试点层正从 R&D 验证转向真实需求。Galaxea 计划在 2026 年量产 10,000 台 R1，目标正是这一层。 商业车队层——单站点 100+
              台的大规模工厂自动化和物流——对大多数市场参与者而言仍是 2028–2030 年机会，门槛包括无围栏作业安全认证、MES / ERP 集成成熟度和任务广度
              （今天的人形机器人只能处理范围狭窄、重复且结构化的任务）。IFR 明确警告，人形机器人作为通用工厂助手的大规模采用不会在近中期发生。所有层面的关键采用障碍包括：（1）MES / ERP / WMS
              软件集成复杂；（2）缺少面向近人作业的双足 / 轮式人形机器人标准化安全认证；（3）任务成熟度仍限于重复、低灵巧度工作流；（4）NDRC 2025 年 11 月警告不要让相似产品“扎堆涌入市场”，
              显示过度拥挤子赛道可能受到监管审视。生态平台维度正在变得更关键：竞争正从硬件参数转向谁能搭起 SDK / 内容生态，让机器人理解任务、执行工作并持续进化——Galaxea 的开源 OpenGalaxea 和
              VLA 一体机让它具备参与这场竞争的位置。
