      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              自成立以来，Galaxea AI 至少完成七个已披露融资轮次，不到 30 个月就从天使轮推进到 B+ 轮——即便按中国 AI 初创公司的节奏看，这也异常快。 天使轮（2024 年 1 月，数千万美元）由 IDG
              Capital 和 Baidu Ventures 领投，MiHoYo（通过 Argo Technology）、GSR Ventures 以及北京机器人产业发展投资基金 也在早期不同阶段参与。Pre-A
              轮（2024 年 11 月，RMB 200M+）由 Hillhouse Capital 和 Ant Group 领投，随后 A 轮（2025 年 2 月，约 RMB 300M） 再次由 Ant Group
              领投。2025 年夏季，公司又完成 A4 和 A5 轮（合计 >$100M），累计融资接近 $210M，估值升至 $700M；Capital Today、Meituan Long-Z
              Investments、Ant Group、IDG、Baidu Ventures、GL Ventures 和 FunPlus 均参与。B 轮（2026 年 2 月，约 RMB 1bn / ~$144M） 引入
              Jinding Capital、BAIC Capital、Bihong Investment、Loyal Valley Capital、Qianhai Ark 和 InnoVen
              Capital，主要老股东全部保持或加码持仓； 该轮把公司推到约 RMB 10bn（~$1.4B）估值，进入独角兽区间。随后的 B+ 轮（2026 年 4 月 2 日，约 RMB 2bn / ~$290M）吸引了
              Walden International、Lens Technology（关键供应链伙伴）、Xixin Investment、Financial Street Capital 和 CICC Capital
              旗下基金等产业投资人。 B+ 轮后的估值存在争议：Yicai 按公司公告报道 CNY 200bn（~$29B），而 InforCapital 和 PitchBook 给出的数字约为
              ~$2.9B——二者相差十倍，且尚无经审计来源验证。 截至 B 轮，公司累计融资约 $434M（RMB 3bn）；计入 B+ 轮后，总额接近 $724M。截至 2026 年 5 月，公司据称正筹划香港
              IPO，目标募资约 ~$500M。
