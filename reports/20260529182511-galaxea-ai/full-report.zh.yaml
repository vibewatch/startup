  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与商业牵引
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI 2026 年的收入模式建立在直接硬件销售（机器人机械臂和轮式人形机器人）、早期研究合作以及数据授权安排之上。公司明确确认 2024
              年没有商业收入——成立第一年全部投入产品开发和融资——并引导投资者预期 2025 年销售额为“数千万元人民币”（约 $3–10M），前提是 R1 系列初始交付落地。管理层 2026
              年目标是盈利，这要求单位出货量大幅跃升到其公开宣布的 10,000 台生产目标。 考虑到公司的制造成熟度、与 Lens Technology
              的供应链爬坡以及真实世界数据采集的资本强度，这一门槛能否达到仍未被验证。公司称已完成“千台级订单验证”，暗示有数百台级别的绑定需求承诺，
              但尚无独立来源验证积压订单金额或交付排期。五个聚焦工业场景推动近期生产力市场收入：物料转运、抓取放置、封装包装、纺织折叠和设备互联。开发者市场中，Galaxea 服务 40–150+ 家客户
              （区间来自报道时间差异——Forbes 在 2025 年中引用 40+；公司自身 about 页面到 2026 年中称“近 100 家全球顶尖具身智能客户”），包括 Huawei
              Cloud、Volkswagen、 Haier、Samsung、ByteDance、Stanford University、MIT、Physical Intelligence 和
              NVIDIA。这一客户基础的收入质量偏低：多数关系看起来是试点部署、算法训练入口和数据采集安排， 而非大型经常性合同。Physical Intelligence 曾用 R1 Lite 平台作为其 π0.5
              开放世界泛化模型的硬件底座，Fei-Fei Li 在 Stanford 的实验室也发布了基于 Galaxea R1 本体的全身移动操作套件——二者都证明技术可信度很高，但不一定意味着持续收入。
