            title: 商业化前收入与 $563M+ 资本——烧钱与收入缺口显著
            body: >-
              Galaxea 累计融资已超过 $563M，而 2025 年预计收入约 $3–10M，2024 年收入为零。按当前烧钱轨迹—— 双线 AI 模型开发、苏州制造扩产、全球生态扩张——公司必须在 2026 年达到
              10,000 台产量目标，才有现实路径实现公开提出的盈利目标。 如果单量不及预期，公司在做到正毛利前还需要追加资本。IPO 募资（目标约 $500M）很可能用于填补这个缺口，而不是向投资人返还资本。
