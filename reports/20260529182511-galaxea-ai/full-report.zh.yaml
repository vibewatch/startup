companyProfile:
  summary: >-
    Galaxea AI（星海图；法定名称 Galaxea (Beijing) Artificial Intelligence Technology Co., Ltd.）是一家总部在北京、制造基地在苏州的具身智能公司， 成立于 2023
    年 9 月。公司搭建全栈机器人平台，覆盖硬件（A1/A1Z 机械臂、R1 Lite / R1 / R1 Pro 轮式人形机器人）、自研视觉-语言-动作（VLA） 基础模型（G0 和 G0 Plus），以及 OpenGalaxea
    组织下的开源开发者生态。公司提出的使命——“为 100 亿人提供 100 亿台机器人”——体现了把具身 AI 推向全球规模部署的野心，起点是企业 R&D 与工业试点客户，长期目标是进入家庭。到 2026 年 4
    月，公司估计已通过七个轮次融资约 ~$724M； B+ 轮完成后，投后估值约 $2.9B。
