    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI（星海图；2026 年 1 月股改后的法定名称为 Galaxea (Beijing) Artificial Intelligence Technology Co., Ltd.）于 2023 年
              9 月在中国北京成立，制造基地位于苏州。公司提出的使命是“为 100 亿人提供 100 亿台机器人”，目标是在全球范围内部署具身 AI 机器人。 Galaxea
              既做开发，也做制造：自研机器人硬件（机械臂、轮式人形机器人），用真实世界数据训练自有视觉-语言-动作（VLA）基础模型，并在 GitHub 和 Hugging Face 上运营开源开发者平台
              OpenGalaxea。公司的设计理念可概括为“智能定义本体”：硬件形态应服从 AI 优先的任务执行需求，
              而不是先有硬件再让智能适配。产品主要面向企业研究实验室、工业客户和开发者；家庭消费场景被描述为中期目标。Galaxea 目前仍是私营、Pre-IPO 公司；截至 2026 年 5
              月，已有报道称公司计划赴港上市，目标募资 $500M。
