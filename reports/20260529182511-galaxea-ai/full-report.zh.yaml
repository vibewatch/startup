  - id: FI001
    title: 收入模型桥 — 客户活动如何转化为收入
    type: flow
    layout: standard
    summary: 客户活动从开发者 / 研究部署流向生产力市场互动，再到潜在的经常性数据和软件收入。真实世界数据飞轮是关键经济护城河。
    data:
      nodes:
        - id: customer-activity
          label: 客户部署机器人
          detail: >-
            40–150+ 企业客户（2025 年 8 月–2026 年），包括 Stanford、MIT、Huawei Cloud、Volkswagen、Physical
            Intelligence。初始用途：算法训练、数据采集、生产力试点。
          tone: neutral
        - id: hardware-revenue
          label: 硬件销售收入
          detail: 一次性 ASP：A1Z $2,999–$3,999；R1 $44,500–$64,000；R1 Pro $69,999。仅为标价——实际 ASP 和批量折扣条款未披露。2025–2026 年主要收入流。
          tone: neutral
        - id: data-flywheel
          label: 生成真实世界数据
          detail: 每台已部署机器人都会生成遥测和任务执行数据，进入 Galaxea 真实数据引擎。GOD 数据集 600,000+ 次下载显示外部需求。数据采集既是成本，也可能成为收入护城河。
          tone: positive
        - id: model-improvement
          label: VLA / 世界模型改进
          detail: 真实世界数据训练 G0 Plus VLA、Fast-WAM 世界模型和即将推出的 G0.5。外部可验证的模型迭代，是 Galaxea 最关键的融资信号和竞争护城河主张。
          tone: positive
        - id: potential-software
          label: 潜在软件 / 模型许可收入
          detail: 尚未确认成为产品线。G0 模型目前开源；尚未发布软件定价。转向付费许可是未来可能性。
          tone: warning
        - id: gross-profit
          label: 毛利（估计为负至 ~43%）
          detail: 估计毛利率区间从低销量下深度为负，到最佳情形下按低 BOM 对比标价约 ~43%。硬件 BOM 基准未包括集成、现场服务和软件在内的完全吸收成本。毛利率扩张需要 10,000+ 台规模。
          tone: negative
      edges:
        - from: customer-activity
          to: hardware-revenue
          label: 按标价销售单台
        - from: customer-activity
          to: data-flywheel
          label: 部署产生遥测数据
        - from: data-flywheel
          to: model-improvement
          label: 真实世界数据训练模型
        - from: model-improvement
          to: potential-software
          label: 模型改进 = 未来许可候选
        - from: hardware-revenue
          to: gross-profit
          label: 收入减估计 BOM 和交付成本
    approximationNotes: 毛利估计来自标价与 $40,000–$80,000 行业 BOM 基准（robozaps 2026）的对比。没有公司特定 COGS 数据。软件许可收入具有推测性。
    claimRefs:
      - CI001
      - CI006
      - CI007
      - CI022
      - CI024
  - id: FI002
    title: 单位经济桥 — R1 Pro 成本与收入拆解
    type: flow
    layout: wide
    summary: 定性拆解 R1 Pro 单位经济：从标价到估计 BOM 组件，再到不确定毛利率。所有成本节点均为行业基准，不是 Galaxea 特定 COGS。
    data:
      nodes:
        - id: list-price
          label: R1 Pro 标价 — $69,999
          detail: humanoid.guide 和 Forbes 报道的公开标价。实际实现 ASP 可能因批量折扣、捆绑配件或研究合作而不同。
          tone: positive
        - id: actuators
          label: 执行器与运动系统 — $28,000–$40,000 估计
          detail: 占估计 $40,000–$80,000 BOM 的 40–50%。最大成本驱动项。Lens Technology 合作旨在降本。执行器采购条款未披露。
          tone: negative
        - id: sensors
          label: 传感器与感知 — $6,000–$16,000 估计
          detail: 占 BOM 的 15–20%。包括深度相机、力 / 扭矩传感器、IMU、触觉指尖。NVIDIA Jetson AGX Orin 32GB（计算）与该类别有重叠。
          tone: negative
        - id: compute
          label: 计算（NVIDIA Jetson AGX Orin）— $4,000–$12,000 估计
          detail: 占 BOM 的 10–15%。NVIDIA Jetson AGX Orin 32GB（200 TOPS）是 R1 Pro 标准计算平台。商品 GPU 市场动态部分缓解成本。
          tone: negative
        - id: structure-battery
          label: 结构、电池与组装 — $5,000–$15,000 估计
          detail: BOM 剩余 15–25%。碳纤维 / 铝框架、锂离子电池包、线束、连接器、热管理和苏州最终组装人工。
          tone: negative
        - id: gross-margin
          label: 隐含毛利率 — 负值至 ~43%（估计）
          detail: 若 BOM = $40,000：集成 / 服务成本前毛利率 ≈ 43%。若 BOM = $80,000：毛利率约为负。完全吸收成本高于仅硬件 BOM。早期销量很可能把真实毛利推向零或低于零。
          tone: warning
      edges:
        - from: list-price
          to: actuators
          label: 最大成本扣减
        - from: list-price
          to: sensors
          label: 感知成本
        - from: list-price
          to: compute
          label: AI 硬件成本
        - from: list-price
          to: structure-battery
          label: 机身与组装成本
        - from: list-price
          to: gross-margin
          label: 估计 BOM 后的剩余
    approximationNotes: 所有成本估计来自 robozaps.com 2026 人形机器人生产经济性基准（行业范围，不是 Galaxea 特定）。毛利率为基于标价减去基准 BOM 区间的估计。包含集成、测试、现场服务准备和软件开销的真实 COGS 未知。
    claimRefs:
      - CI008
      - CI022
      - CI023
      - CI024
      - CI033
