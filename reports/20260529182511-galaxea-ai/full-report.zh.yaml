      - number: '2.4'
        title: 工业需求与供应链经济性
        blocks:
          - type: paragraph
            body: >-
              中国制造业自动化需求，是 Galaxea 所处市场的底层需求引擎。2024 年中国安装 295,000 台工业机器人，占全球年度总量的 54%；运行中的存量约 200 万台，约为日本的 4.5 倍。截至 2026
              年初，全国有 30,000+ 座智能工厂；中国仓储自动化市场预计从 2025 年 $3.0B 增至 2032 年 $9.2B，CAGR 为 17.2%。劳动力成本上升和人口压力
              （中国劳动年龄人口正在下降）是结构性需求驱动，每年都会改善机器人自动化的 ROI。重庆长安汽车黑灯工厂用 2,000+ 台机器人生产汽车，成本比传统方式低 20%，说明固定式自动化的制造业转型已经发生； 人形 /
              移动操作机器人是下一道前沿。供给侧，中国掌握全球人形机器人供应链 63–70%，成本比西方同类方案低 30–40%。执行器占人形机器人 BOM 的 40–60%；通过垂直整合和量产，
              中国供应商已把单个关节模块压到 RMB 1,000 以下，而西方价格仍是数千美元级别。机器人正在套用“EV 化”模式——电机、齿轮箱、电源系统和铸造环节尽量内控；Galaxea 的战略投资方 Lens
              Technology 则给了它直接供应链入口。AgiBot 在 2026 年 3 月发出第 10,000 台机器人的里程碑，从 1,000 台扩到 10,000 台不到三个月，证明了可实现的产能速度。
              humanoid.guide 预计，到 2027–2028 年，执行器、传感器和算力的主导设计会锁定，供应链卡位窗口正在关闭。
