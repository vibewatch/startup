              报道估值之间存在 10 倍差异（$2.9B vs. $29B），且截至 2026 年 5 月 29 日尚未提交 HKEX
              招股书，两者叠加成复合治理风险：投资者无法验证公司的真实资本结构、优先权负担或财务健康。如果 IPO 延后到 2027 年 Q1
