      - number: '3.4'
        title: Galaxea 的竞争定位
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI 在竞争格局中拥有三个结构性差异点。第一，R1 Pro
              的轮式移动底盘是十家被跟踪竞争者中唯一的这类配置。轮式移动消除了平衡不稳定，降低每自由度执行器成本，并能在空间受限的工业和实验室环境中可靠完成灵巧操作；
              双足机器人在这些场景下面临安全和节拍约束。形态差异不是一个等待补齐的临时短板——Galaxea 的 G1 双足概念存在，但并未量产——而是刻意设计理念的体现：硬件形态应跟随操作任务需求。第二， Galaxea 的
              G0 开放世界数据集（500+ 小时演示数据、150+ 操作任务、50 类场景）是截至 2026 年最大的一批开源人形机器人训练数据集之一，比 Physical Intelligence 的 π0.7
              开源发布时间早约十二个月。结合 OpenGalaxea 开发者社区和 GitHub 仓库，这构成了一套生态打法：它与 Physical Intelligence 的硬件无关模型策略直接平行，但扎根于
              Galaxea 自有硬件平台。第三，Galaxea 联合创始人在清华大学（TEA Lab）、清华 IIIS（MARS Lab）和其他中国顶尖研究机构担任在职助理教授，给公司带来学术人才管线和前沿具身 AI
              研究入口；纯商业竞争者只能靠招聘来复制。与这些优势相对，Galaxea 也有三项实质竞争劣势。R1 Pro 的 $69,999 定价显著高于中国市场正在扩大的 sub-$25K 层， Unitree 和 LimX
              2025 年合计出货超过 5,500 台。Galaxea 报告的 40+ 企业客户数，按融资阶段看并不差，但与 AgiBot 的 5,100 台装机和 UBTECH 的 1,079
              台部署相比仍小得多。Galaxea 自报 $29B 估值又与 InforCapital 和 PitchBook 给出的 $2.9B 冲突，使不同公司之间的融资阶段比较更复杂。表 TP002
              给出了十家竞争者逐项能力对比。
