      - number: '8.4'
        title: 情景分析与回报预期
        blocks:
          - type: paragraph
            body: >-
              Galaxea 的情景分析必须处理两层不确定性：人形机器人规模化后的单台经济性（行业整体基本未验证），以及公司自身从“千台级订单验证”在 12 个月内放大到 10,000 台量产的执行风险。下文分析采用
              2026–2027 年退出或 IPO 窗口，与 Galaxea 已表达的香港 IPO 意图一致；估值倍数锚定 UBTECH 的 27x 和 Unitree 的 13–30x，因为它们是行业内仅有的披露基准。

              乐观情景（概率 20%）：到 2027 年底，Galaxea 出货 8,000–10,000 台，平均 ASP 约 ~$45,000–$50,000（介于 R1 Lite 研究版价格和更高配置 R1 Pro
              之间），2027 年收入 $360–500M。模型授权和数据费用按硬件收入 15% 计入后，总收入达到 $415–575M。按 2027 年收入 15–20x 估值（相对 UBTECH 的 27x 因 IPO
              不确定性打折），隐含估值区间为 $6.2–11.5B。以 $2.9B 入场的 Series B+ 投资者退出时可获得 2.1–4.0x 总回报。关键促成因素包括：Lens Technology
              供应链交付、工业搬运和包装场景试点转量产，以及 2026 年 HK IPO 成功。

              基准情景（概率 55%）：到 2027 年底，Galaxea 出货 2,000–4,000 台，收入达到 $90–180M。IPO 要么延迟，要么在 2027 年按 10–15x 收入倍数执行（可比
              AgiBot），对应 $900M–$2.7B 估值区间。Series B+ 投资者回报从持平到小幅正回报。折价因素包括：第一代人形机器人大规模量产常见的制造爬坡挑战、开发者市场定价走软，以及 IPO
              窗口可能要求比当前指引更接近盈利。

              悲观情景（概率 25%）：2027 年收入低于 $30M，原因可能是生产良率问题、供应链中断或关键企业合同流失。IPO 延迟到 2027 年之后或撤回。按 1–5x 收入，公允价值为
              $30–150M；除持有清算优先权的投资者外，所有私募轮投资者几乎全损。

              概率加权公允价值：0.20 x $8.9B（乐观中位）+ 0.55 x $1.8B（基准中位）+ 0.25 x $90M（悲观中位）= 约 $2.8B。这个数字几乎与 $2.9B
              入场价重合，意味着当前估值已经计入基准到乐观的组合，安全边际极小。当前价格并非明显错误，但几乎没有下行保护，因此估值立场为偏高。
            claimRefs:
