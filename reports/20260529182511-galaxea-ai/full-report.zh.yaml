      - number: '2.3'
        title: 中国政策与监管格局
        blocks:
          - type: paragraph
            body: >-
              中国“十五五”规划（2026–2030）是 Galaxea 近期市场里最关键的政策催化剂。具身智能在规划十大未来产业重点赛道中拥有独立专栏（Box 3, Item 02），与量子技术、脑机接口、 6G
              并列；同时又被列为八个“战略性新兴产业”之一，获得加速发展要求。入选后，中央各部委、省级政府和国有金融机构必须协同，600 亿元人民币国家人工智能产业投资基金、省级配套资金和国家支持的风险资本也会打开入口。
              规划明确要求统筹具身智能训练场，推进虚实融合协同训练，发展大小脑一体化具身模型，并加快人形机器人部署——这类措辞更像采购指令，而不是愿景口号。与此同时，中国工业和信息化部（MIIT）在 2026 年 2
              月发布《人形机器人与具身智能标准体系》（HEIS 2026）。HEIS 2026 由 120+ 家研究机构和制造商共同制定，建立了六大支柱框架：基础标准、类脑计算、肢体 / 部件规范、
              整机集成协议、应用指南以及安全 / 伦理要求。HEIS 2026 通过统一技术规范，旨在降低跨厂商集成成本，支持模块化部件复用（类似汽车供应链标准化），并引导 R&D 进入核心领域，而不是重复建设。 2023
              年“Robot+”行动计划这一更早的 MIIT 倡议，已把政策框架从制造业扩展到医疗、农业、物流和养老，拓宽了 Galaxea 这类平台的商业管线。尽管顺风很强，IFR 仍在 2026 年 5
              月指出，人形机器人在真实生产环境中的实际能力仍限于演示或试点项目；“十五五”本身也把人形机器人大规模商业化放在规划期末段（即 2029–2030 年）。
