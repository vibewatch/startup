            body: >-
              本章所有毛利率估算都使用 robozaps.com 的 2026 年人形机器人生产经济性基准（中端工业人形机器人 BOM 为 $40,000–$80,000）和 humanoid.guide 2026
              年市场报告预测（10k+ 台时毛利率为 15–30%）。这些是行业整体基准，不是 Galaxea 的专属成本数据。Galaxea 的实际 COGS 可能因自研执行器设计、 DEXO 灵巧手制造以及与 Lens
              Technology 的供应链条款而明显不同。在审计财务披露前，所有毛利率数字都只能视为方向性估算。
