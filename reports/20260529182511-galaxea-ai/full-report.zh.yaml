  - id: FV004
    title: 需跟踪的投资 KPI
    type: kpi
    layout: standard
    summary: 八项关键绩效指标，一旦披露，将实质性推动投资建议从观察（TRACK）转向买入（BUY）或回避（AVOID）。
    data:
      items:
        - label: 2025 年审计收入
          value: 'Undisclosed (guided: ''tens of millions of yuan'')'
          note: 若 >= CNY 100M（$14M）为买入信号；若 < CNY 20M（$2.8M）为回避信号
        - label: 2026 年出货量（累计）
          value: 'Unverified (target: 10,000)'
          note: 若 >= 5,000 为买入信号；若到 2026 年 Q3 末仍 < 1,000，为回避信号
        - label: 毛利率（首个生产批次）
          value: Undisclosed (estimated 5-30% at early scale)
          note: 若 >= 20% 为买入信号；若仅硬件毛利为负，则为回避信号
        - label: HKEX 招股书提交状态
          value: Not filed as of 2026-05-29
          note: 提交后若确认 $2.9B+ 估值和审计账目，为买入信号
        - label: 估值差异解决
          value: Unresolved ($2.9B vs $29B)
          note: 若官方文件确认 CNY 20bn，为买入信号；若发现误述，为回避信号
        - label: Physical Intelligence / NVIDIA 数据合同续约
          value: Active as of report date
          note: 若确认多年期合同，为买入信号；若合作转向竞争对手，为回避信号
        - label: 美国出口管制法律意见
          value: Not publicly available
          note: 若法律意见干净且明确豁免条款，为买入信号；若硬件被归类为出口管制品，为回避信号
        - label: Series B+ 优先权结构
          value: Not publicly disclosed
          note: 若 1x 非参与型，为买入信号；若存在棘轮条款或高底价参与型优先股，为回避信号
    claimRefs:
      - CV009
      - CV010
      - CV034
      - CV035
      - CV042
