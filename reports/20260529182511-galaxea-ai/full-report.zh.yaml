      - number: '8.2'
        title: 估值背景与融资证据
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI 的融资历史显示，18 个月内估值由里程碑驱动、快速重定价。2023 年末和 2024 年初的天使轮 / Pre-seed 轮把公司放在一个相对温和的基座上。Series A（2025 年
              7–8 月）在 $700M 估值上融资超过 $100M，由 Capital Today 领投，Ant Group、IDG Capital、Baidu Ventures 和 Meituan Long-Z
              参与。六个月内，2026 年 2 月由 Jinding Capital 领投的 Series B 把估值翻倍到 RMB 10bn（约 $1.4B）。又过两个月，Series B+ 以约 $290M（RMB
              2bn）完成；Gasgoo、HKET 和 GMT Eight 的中文报道一致称投后估值“超过 CNY 20 billion”（约 $2.78–2.9B USD），InforCapital 和
              PremierAlts 也独立记录为 $2.9B。Yicai Global 题为“Chinese Embodied AI Startup Galaxea Is Valued at Over USD29
              Billion”的英文文章指向同一事件；10 倍差异几乎肯定来自把“CNY 200 yi”（200 个亿 = CNY 20B）误写成“CNY 200
              billion”——这是中英双语财经媒体中反复出现的转写错误。没有审计来源、监管文件或股权结构表文件独立确认任一数字。

              估值轨迹从 2025 年 8 月 $700M 到 2026 年 4 月 $2.9B，意味着九个月约 4x 跳升。这个速度激进，但在行业内并非没有先例：Physical Intelligence 从 2024 年末
              $2.4B Series A，到 2025 年 11 月 $5.6B Series B，再到 2026 年 3 月据报讨论 $11B+ 的轮前估值，约 16 个月跳升 5x。对照这一基准，Galaxea
              的轨迹仍在行业常态带内；不过 Physical Intelligence 是美国注册的研究实验室，没有地缘出口限制，通向美国机构资本的路径也更直接。

              从资本结构看，Series B+ 投资财团包括产业资本（Lens Technology、Walden International）、国资背景基金（Financial Street Capital、Jinpu
              Investment、Beijing Sci-Tech）和头部私募股权（CICC Capital、GF Qianhe），形成异质化优先股堆叠。如果所有轮次的清算优先权都按 1x
              非参与式设计，任何退出收益上的总优先索取权约为 $650M。按 $2.9B 入场的 Series B+ 投资者若要获得 3x 总回报，Galaxea 需要约 $5.7B 的退出或
              IPO；乐观情景下可达，基准或悲观情景下则难以实现。2026 年 1 月完成的股改把实体转为股份有限公司，满足香港 IPO 的形式监管要求；2026 年 5 月，公司还以商业登记号 80393712
              注册为香港非本地公司。
