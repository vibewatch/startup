      - number: '1.2'
        title: 领导层与创始团队
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI 由四位创始人共同创立，四人在 AI 研究与产业经历上互补，其中三位为清华大学校友。CEO 高继扬（1992 年生）本科毕业于清华电子工程系， 仅用 3.5 年在 University of
              Southern California 取得计算机视觉博士学位，是 USC IRIS Lab 35 年历史上最快纪录。之后他在 Waymo（Google 旗下自动驾驶部门）和 Momenta 担任 AI
              软件工程师，把深厚的自动驾驶感知经验带入机器人领域。联席首席科学官赵航具有 MIT 相关机构背景，现任清华大学 交叉信息研究院助理教授、MARS Lab 主任；他曾在 Waymo 任职，并入选 Forbes
              Science Under 30。联席 CSO 徐华哲（约 1993 年生）博士毕业于 UC Berkeley AI Research（BAIR），在 Stanford University's Vision &
              Learning Lab 完成博士后，回到清华后担任助理教授并负责 Tsinghua Embodied AI Lab（TEA Lab）。联合创始人兼 COO 李天威拥有 University College
              London 硕士学位，是高继扬在 Momenta 的前同事。Galaxea 自称是唯一一家由两位 AI 教授同时联合领导的中国机器人初创公司。截至 2025 年 8 月，公司约有 120 名员工，目标是在
              2025 年底达到 200 人。
