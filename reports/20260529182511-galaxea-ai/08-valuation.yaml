  - id: comparable-analysis
    title: Comparable Company Analysis
    body: >-
      Constructing a reliable comparable set for Galaxea requires bridging three value-driver
      categories: (1) public humanoid robotics companies with disclosed financials; (2) late-
      stage private humanoid/embodied-AI unicorns; and (3) cross-sector pre-revenue platform
      companies rewarded for foundation-model optionality.

      The only pure-play public comparable is UBTECH Robotics (HKEX: 9880), which published
      audited 2025 results showing revenue of RMB 2,001M (+53.3%), humanoid robot revenue of
      RMB 820.6M (+2,203.7%), a gross margin of 37.7%, and a net loss of RMB 789.8M. At a
      late-May 2026 market cap of ~HKD 59B (~$7.6B), UBTECH trades at approximately 27x
      trailing revenue. This is the sector's only audited revenue benchmark, and it was achieved
      after shipping 1,079 humanoids in 2025. Unitree filed for a STAR Market IPO in March 2026
      on CNY 1.71B (~$235M) in 2025 revenue (+335%) and net profit, targeting a $3-7B IPO
      valuation -- implying 13-30x revenue multiples in the IPO range. Both UBTECH and Unitree
      are at a fundamentally different commercialisation stage from Galaxea.

      Among late-stage private peers, Figure AI closed its Series C in September 2025 at $39B
      -- the sector's highest valuation -- after raising $1.9B+ from NVIDIA, Macquarie, and
      Microsoft. Physical Intelligence is in talks to raise $1B at $11B+ (March 2026), with
      zero commercial revenue and a foundation-model-only strategy. Apptronik raised $520M in
      February 2026 at $5B, backed by Google and Mercedes-Benz, with commercial deployments
      of Apollo at industrial partners. AgiBot targets a $5-6B HK IPO in Q3 2026 after
      shipping 5,100 units in 2025.

      At $2.9B, Galaxea sits below Apptronik ($5B) and Physical Intelligence ($5.6-11B), two
      companies at comparable or earlier commercialisation stages. The discount is appropriate
      given the geopolitical overhang and disclosure gaps. The NMP Humanoid Tracker's separate
      "Galaxea Dynamics" listing at $850M-$1.0B appears to reflect an earlier data snapshot
      pre-Series B; the $2.9B B+ post-money is the most current figure. Against research-stage
      US comps like Physical Intelligence the geopolitical discount should be 30-40%, which
      would imply a warranted value of $3.4-7.7B -- above the $2.9B entry, suggesting the
      current price may already embed the China discount. Against UBTECH's ~27x at-scale
      revenue, however, Galaxea's 290-580x on 2025E revenue is not justified on near-term
      earnings power alone.
