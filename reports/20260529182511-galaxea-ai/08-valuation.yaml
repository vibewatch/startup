  - id: TV002
    title: Investment Thesis and Anti-Thesis by Pillar
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Argument
      - Evidence Quality
    rows:
      - - Full-Stack Platform
        - Hardware + VLA models + data flywheel creates compounding software moat; developer ecosystem with 40-150+ global research users
        - No recurring software revenue confirmed; platform narrative is early-stage positioning, not demonstrated unit economics
        - Medium (confirmed customer base; no revenue breakdown)
      - - Research Validation
        - Physical Intelligence uses R1 Lite for pi0.5; Stanford Fei-Fei Li lab builds on R1 body; NVIDIA EgoScale data integration
        - Research adoption does not equal commercial adoption; Stanford/PI usage is hardware purchases, not recurring license revenue
        - High (independently confirmed usage by named labs)
      - - Sector Momentum
        - Humanoid sector raised $13.8B in 2025; UBTECH, AgiBot, Unitree all on IPO path; wave of public-market listings creates liquidity
        - Sector heat drives valuation multiples above earnings power; UBTECH and Unitree IPOs create direct comps that compress Galaxea multiples
        - High (public data from filings and multiple trackers)
      - - IPO Pathway
        - January 2026 equity reform, HK company registration, CICC Capital participation all signal credible IPO in 2026
        - No prospectus filed as of May 2026; IPO market conditions and geopolitical climate could delay or reprice offering
        - Medium (corporate actions confirmed; IPO status unconfirmed)
      - - Team Quality
        - Co-founders from Tsinghua, Berkeley, Stanford, USC; CEO from Horizon Robotics; strong academic pedigree
        - Team tenure (~2.5 yrs post-founding) and first hardware product cycle bring execution risk; no prior large-scale manufacturing exit
        - High (founder credentials verifiable; execution risk is structural)
      - - Valuation Discrepancy
        - $2.9B is defensible vs. sector comps; even the disputed $29B is not obviously wrong in a sector where Figure AI trades at $39B
        - 10x discrepancy between Yicai and all other sources is unique in the sector; raises governance and disclosure concerns ahead of IPO
        - Medium-Low (no audited source resolves the dispute)
    notes: >-
      Evidence quality reflects the depth and independence of publicly available sources per pillar.
      No audited financials available. Revenue claims are based on company guidance and third-party
