  - id: valuation-context
    title: Valuation Context and Financing Evidence
    body: >-
      Galaxea AI's financing history shows aggressive milestone-driven repricing over an
      18-month arc. The angel / pre-seed rounds in late 2023 and early 2024 established the
      company on a modest base. The Series A (July-August 2025) raised over $100M at a $700M
      valuation, led by Capital Today with Ant Group, IDG Capital, Baidu Ventures, and
      Meituan Long-Z. That valuation doubled within six months to RMB 10bn (~$1.4B) at the
      Series B in February 2026, led by Jinding Capital. Two months later the Series B+
      closed at approximately $290M (RMB 2bn) with a post-money valuation that Chinese-
      language reporting from Gasgoo, HKET, and GMT Eight consistently states as "exceeded
      CNY 20 billion" (~$2.78-2.9B USD), and which InforCapital and PremierAlts independently
      record at $2.9B. Yicai Global's English article titled "Chinese Embodied AI Startup
      Galaxea Is Valued at Over USD29 Billion" contains the same underlying event; the 10x
      difference almost certainly stems from conflating "CNY 200 yi" (200 hundred-million
      = CNY 20B) with "CNY 200 billion" -- a recurring transcription error in bilingual
      Chinese financial media. No audited source, regulatory filing, or cap-table document
      has independently confirmed either figure.

      The valuation trajectory (from $700M in August 2025 to $2.9B by April 2026) implies a
      ~4x step-up in nine months. This pace is aggressive but not unprecedented in the sector:
      Physical Intelligence moved from a $2.4B Series A (late 2024) to $5.6B Series B
      (November 2025) to a reported $11B+ pre-round negotiation in March 2026 -- a 5x
      step-up in approximately 16 months. Against that benchmark, Galaxea's trajectory is
      within the band of sector norms, though Physical Intelligence is a US-domiciled research
      lab with no geopolitical export constraints and a more direct path to US institutional
      capital.

      From a capital structure standpoint, the Series B+ investor syndicate includes industrial
      capital (Lens Technology, Walden International), state-backed funds (Financial Street
      Capital, Jinpu Investment, Beijing Sci-Tech), and leading private equity (CICC Capital,
      GF Qianhe), creating a heterogeneous preference stack. If liquidation preferences are
      structured at 1x non-participating across all rounds, the total senior claim against any
      exit proceeds stands at approximately $650M. For a 3x gross return to the Series B+
      cohort investing at $2.9B, Galaxea would need an exit or IPO at approximately $5.7B --
      achievable in the bull scenario but not in the base or bear cases. The equity reform
      completed January 2026 converts the entity to a joint-stock company, satisfying a formal
      regulatory requirement for a Hong Kong IPO, and a Hong Kong non-local company was
      registered under commercial number 80393712 in May 2026.
