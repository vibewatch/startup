  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: audited-financials
      missingEvidence: >-
        Audited financial statements for Galaxea AI covering FY2024 and at least H1 2025,
        including revenue, gross margin, operating expenses, and cash balance.
      whyItMatters: >-
        Without audited financials, all revenue and margin claims rest solely on company
        guidance and analyst estimates. The 290-580x implied revenue multiple cannot be
        evaluated, and the HKEX IPO cannot proceed.
      diligencePath: >-
        Request via formal data-room process with NDAs; expect availability concurrent
        with HKEX prospectus filing. Listing sponsor (likely CICC) will require audited accounts.
      relatedQuestionRefs:
        - QV006
        - QV018

    - type: conflicting-data
      severity: material
      topic: valuation-discrepancy-resolution
      missingEvidence: >-
        An authoritative primary document -- audited cap table, legal opinion, or official
        Galaxea written statement -- clarifying whether the Series B+ post-money is CNY 20
        billion or CNY 200 billion.
      whyItMatters: >-
        The $2.9B vs $29B discrepancy directly determines the investment return profile.
        If $29B is correct, the entry is deeply discounted vs. sector comps; if $2.9B is
        correct, all scenario returns are recalibrated accordingly.
      diligencePath: >-
        CFO written representation in data room; HKEX prospectus will formally state the
        post-money; secondary market transaction at defined valuation would also confirm.
      relatedQuestionRefs:
        - QV001
        - QV005
        - QV032

    - type: private-evidence-only
      severity: material
      topic: cap-table-and-preference-stack
      missingEvidence: >-
