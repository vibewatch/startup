    title: Critical dependency map
    type: dag
    layout: wide
    summary: >-
      Key external dependencies for Galaxea's hardware, compute, model, and distribution layers,
      with dependency types and associated risks.
    data:
      nodes:
        - label: "Galaxea AI Platform"
