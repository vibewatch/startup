  - id: technology-architecture
    title: Core Technology Architecture
    body: >-
      Galaxea's technical architecture is best understood as three integrated layers: hardware
      (actuators, sensors, compute), a real-time control and perception middleware (ROS2 Humble on
      Ubuntu 22.04, NVIDIA JetPack 6.0), and a foundation-model layer (G0 dual-system VLA).
      At the hardware level the A-series arms use high-precision planetary-gear motors in each
      joint for force feedback. Force-controlled joints enable compliant manipulation — the arm
      adjusts applied torque in response to contact forces rather than position alone — which is
      essential for tasks like object handover, cloth folding, and assembly requiring contact
      richness. The R1 Lite and R1 rely on Intel NUC (i9-class) for local compute in some
      configurations and Jetson Orin for AI inference, while R1 Pro consolidates all compute
      onto a single Jetson AGX Orin 32 GB.
      The G0 architecture couples two asynchronous systems: G0-VLM (System 2, slow, ~1 Hz)
      performs multimodal planning and subtask decomposition from natural-language instructions
      using a fine-tuned vision-language model; G0-VLA (System 1, fast, ~10 Hz) executes
      fine-grained motor actions using a flow-matching-based action transformer. The base model
      uses PaliGemma-3B (Google) as the VLM backbone. G0Tiny replaces PaliGemma with
      SmolVLM2-500M (HuggingFace) to fit edge deployment on Orin with TensorRT FP16 quantisation.
      The training pipeline proceeds in three stages: (1) cross-embodiment pre-training on
      publicly available cross-robot datasets (OXE, BridgeV2, DROID) to acquire generic
      world priors; (2) single-embodiment pre-training on the proprietary Galaxea Open-World
      Dataset (100K trajectories, 150+ tasks, 50 real-world scenes, collected using R1 Lite);
      (3) task-specific post-training (fine-tuning) on demonstration data for target deployments.
      This three-stage curriculum was validated by the arXiv:2509.00576 paper to show that
      single-embodiment pre-training is the most impactful stage, outperforming cross-embodiment
      pre-training alone when there is large embodiment gap.
