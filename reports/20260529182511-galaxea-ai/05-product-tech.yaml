callouts:
  - calloutType: strength
    title: Real-World Data Moat and Open-Source Cadence
    body: >-
      Galaxea's most defensible technical asset is its real-world data pipeline: the R1 Lite
      platform plus isomorphic teleoperation has produced 500+ hours (100K trajectories) of
      GOD data, which attracted 600K+ downloads after release and validated a clear data-flywheel
      thesis. Combined with the fastest open-source model release cadence in the embodied AI
      space (G0 → G0Plus → G0Tiny within six months), this positions Galaxea as both a hardware
      vendor and an ecosystem anchor.
    claimRefs:
      - CE028
      - CE029
      - CE030
      - CE032

  - calloutType: risk
    title: G0 Plus Non-Commercial Licence Limits Revenue Path
    body: >-
      As of January 4 2026, all new GalaxeaVLA code commits are governed by the G0 Plus
      Community Licence, which explicitly prohibits commercial use — including production
      deployment and providing services to third parties — without a separate commercial licence.
      This creates a binary gating event for any enterprise customer: before scaling deployments,
      they must negotiate a paid commercial licence whose terms, pricing, and exclusivity
      conditions are not publicly disclosed.
    claimRefs:
      - CE021
      - CE022
      - CE041

  - calloutType: risk
    title: Safety and Certification Gaps Constrain Regulated Industrial Deployments
    body: >-
      No publicly disclosed ISO 10218:2025 compliance, CE marking, or UL certification has been
      confirmed for any Galaxea product. R1 Pro's IP20 rating rules out wet or outdoor settings.
      R1 Lite arms lack motor brakes, requiring manual safety procedures during power-off. These
      gaps collectively block deployments in regulated EU and US industrial environments and will
      require material diligence investment before institutional buyers can commit.
    claimRefs:
      - CE039
      - CE040
      - CE042
      - CE043

  - calloutType: insight
    title: NVIDIA Orin Concentration and US-China Export Controls
    body: >-
      All Galaxea robots depend on NVIDIA Jetson AGX Orin as the sole AI inference platform.
      US-China export controls on advanced semiconductors represent a supply-chain risk,
      particularly if restrictions on Orin-class chips tighten. Galaxea has not disclosed
      a contingency compute vendor, making this an unaddressed single-point dependency.
    claimRefs:
      - CE009
      - CE010

