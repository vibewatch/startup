  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      End-to-end workflow from research team decision to deploy a robot-learning project,
      through data collection, training, and deployment, showing how Galaxea's hardware
      and software integrate at each stage.
    data:
      nodes:
        - id: setup
          label: "Researcher sets up R1 Lite + Teleop Kit"
          detail: >-
            Connects JoyCon isomorphic controller via USB to Ubuntu 22.04 laptop with ROS Humble.
            R1 Lite connected via LAN/Ethernet. Sets initial pose before each session. Average
            setup time: ~30 min per out-of-box guide.
          tone: neutral
        - id: teleoperate
          label: "Isomorphic / VR teleoperation — collect demonstrations"
          detail: >-
            Operator's arm movements mapped 1:1 to robot (isomorphic) or via VR headset. Data
            logged to LeRobot v2.1 format with subtask-level language annotations. Covers 150+
            task types across residential, retail, catering, office scenes.
          tone: positive
        - id: dataset
          label: "Convert to LeRobot dataset and push to HuggingFace / ModelScope"
          detail: >-
            GalaxeaLeRobotToolkit converts recordings. GOD dataset format compatible with
            standard HuggingFace datasets API. Private datasets possible; public sharing via GOD
            mirrors available.
          tone: neutral
        - id: finetune
          label: "Fine-tune G0Plus or G0Tiny on task-specific data"
          detail: >-
            finetune.sh script (8 GPUs); task configs in configs/tasks/real/; supports G0Plus
            (requires A100 80GB for full fine-tuning) or G0Tiny (lighter fine-tune for Orin
            deployment). Training logged to SwanLab. Min 8GB VRAM for inference only.
          tone: neutral
        - id: deploy
          label: "Deploy trained checkpoint to R1 Pro / R1 Lite via EFMNode"
          detail: >-
            EFMNode manages inference loop; G0Tiny served via TensorRT at 10 Hz on-device.
            G0Plus inference served from workstation RTX 4090 (8GB+ VRAM). Out-of-box demos
            validated: Pick Up Anything, Fold Towels, Handover Gift.
          tone: positive
        - id: iterate
          label: "Collect failure-case demos → re-fine-tune → redeploy"
          detail: >-
            Active learning / failure-correction loop. New real-world task data added to
            private dataset; G0Plus fine-tuning re-run. Data flywheel: each deployed robot
            generates training signal for next iteration.
          tone: positive
      edges:
        - from: setup
          to: teleoperate
          label: "Hardware ready"
        - from: teleoperate
          to: dataset
          label: "Raw recordings"
        - from: dataset
          to: finetune
          label: "LeRobot format"
        - from: finetune
          to: deploy
          label: "Checkpoint"
        - from: deploy
          to: iterate
          label: "Failure data"
        - from: iterate
          to: finetune
          label: "Augmented dataset"
    claimRefs:
      - CE026
      - CE027
      - CE028
      - CE030
      - CE031

