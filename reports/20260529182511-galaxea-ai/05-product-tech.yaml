  - id: data-pipeline-and-training
    title: Data Pipeline, Teleoperation & Training Workflow
    body: >-
      Galaxea's data strategy is the most cited differentiator in investor and analyst coverage:
      the company prioritises real-world teleoperation data over simulation, arguing that
      simulation-heavy pipelines fail to transfer reliably to unstructured environments.
      The primary data collection platform is R1 Lite, an intentionally stripped-down robot
      designed for high-throughput isomorphic teleoperation. In isomorphic teleoperation,
      the operator's upper-body motions are mapped 1:1 to the robot's arm kinematics using a
      custom JoyCon-based R1 Lite Teleop kit, avoiding VR retargeting artifacts and IK failures.
      VR teleoperation is also supported as an alternative modality using head-mounted displays.
      The Galaxea Open-World Dataset (GOD) — the product of this pipeline — contains 100,000
      demonstration trajectories spanning 150+ task categories (pick-and-place, cloth folding,
      object handover, device operation, long-horizon bed-making) recorded across 50 distinct
      real-world scenes (residential, retail, catering, office). GOD exceeds 500 hours of
      high-fidelity mobile manipulation, annotated at subtask level with bilingual (Chinese/English)
      natural-language descriptions, and is released in LeRobot v2.1 / RLDS format. It covers
      more than 1,600 unique objects and 58 operational skills and was collected using a single
      robot embodiment (R1 Lite) for consistency. After release in September 2025, the dataset
      surpassed 600,000 downloads within approximately one month, and was described as the top
      globally downloaded robot dataset at that time, according to the ChinaBizInsider coverage
      of the B+ round. The post-training (fine-tuning) phase uses task-specific demonstrations
      and supports multiple algorithms: G0Plus via openpi-based fine-tuning scripts
      (also compatible with pi0/pi0fast), and Diffusion Policy through GalaxeaManipSim.
      GPU requirements for full fine-tuning are substantial: 70+ GB VRAM (A100 80GB or H20 96GB
      recommended), limiting accessible fine-tuning to well-resourced labs; inference of G0Plus
      requires only 8+ GB VRAM (RTX 3090/4090 recommended).
