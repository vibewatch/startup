            body: >-
              The strongest public evidence for the software layer is the combination of Flexible Intelligent Platform
              documentation, third-party descriptions of AgileCore, and a public AI R&D post about natural-language
              programming. Together they point to an operating model in which Agile Robots controls the robot, conveyor,
              feeding, sensing, and skill-upload layers while pushing toward easier programming and cell
              reconfiguration. That is reinforced by a geographically distributed footprint across Munich, Kaufbeuren,
              Gemmingen, China, India, and Palo Alto, suggesting the company expects to deliver, integrate, and support
