figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      The visible company arc runs from a 2018 DLR spin-off through financing, manufacturing expansion, and
      acquisition-led portfolio building.
    data:
      items:
        - date: '2018'
          label: Company founded
          detail: Zhaopeng Chen, Peter Meusel, and eight other DLR experts launch Agile Robots.
          tone: positive
          claimRefs:
            - CO001
        - date: '2019-07-31'
          label: Pre-A financing announced
          detail: Hillhouse, Sequoia, Tinavi, and Linear are named in the pre-A round after earlier seed and angel backing.
          tone: positive
          claimRefs:
            - CO011
        - date: '2019'
          label: Early product and manufacturing expansion
          detail: The company timeline says Diana 7 debuted and the first China production facility opened in the same year.
          tone: positive
          claimRefs:
            - CO014
        - date: '2021'
          label: SoftBank-backed unicorn step-up
          detail: >-
            Series C materials say total financing exceeded US$130 million in 2020 and that the company crossed the US$1
            billion valuation benchmark.
          tone: opportunity
          claimRefs:
            - CO012
            - CO013
        - date: '2022'
          label: German manufacturing added
          detail: >-
            The official company timeline says Agile Robots opened its first production facility in Germany in
            Kaufbeuren.
          tone: positive
          claimRefs:
            - CO014
        - date: '2023'
          label: Automotive and robotics portfolio expands
