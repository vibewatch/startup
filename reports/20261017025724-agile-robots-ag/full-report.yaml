      - number: '7.4'
        title: Capital, partner, and proof-of-performance dependencies
        blocks:
          - type: paragraph
            body: >-
              The dependency risk is twofold. First, the company narrative still leans heavily on funding and
              unicorn-status framing, while public capital and operating metrics remain only partially transparent; that
              raises the odds that a future financing or valuation reset becomes the event that surfaces hidden margin,
              working-capital, or integration strain. Second, the product proof set in the assigned pool is still partly
              vendor-framed: Robotics Registry explicitly labels technical specifications as vendor-stated and its
              deployment log as announced-and-cited only. That does not disprove the business, but it does mean the
              investment case depends on diligence-quality confirmation of customer concentration, partner economics,
              and post-acquisition commercial performance rather than on public evidence alone.
            claimRefs:
