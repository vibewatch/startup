      - number: '5.3'
        title: Differentiation and maturity
        blocks:
          - type: paragraph
            body: >-
              Differentiation is evidenced less by consumer-style software distribution and more by a combination of
              torque-sensitive hardware, vertically integrated control software, and acquired implementation capacity.
              The DLR lineage matters because third-party sources consistently link the company back to force-controlled
              robotics research, while official materials show that the company has extended that base with its own
              product families and several acquisitions. The 2026 thyssenkrupp Automation Engineering transaction is
              especially important for this chapter because it shifts Agile Robots further toward end-to-end automation
              delivery and plant integration instead of only selling robots or subassemblies.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE013
              - CE015
              - CE016
      - number: '5.4'
        title: Controls, quality signals, and open technical risks
        blocks:
          - type: paragraph
            body: >-
              Public trust and quality signals exist, but they are uneven. Product pages repeatedly emphasize collision
              detection, torque sensing, and force control, and the about-us timeline says the management system was
              certified to ISO 9001 in 2020. That gives some evidence of product-safety and manufacturing-discipline
              intent. What remains thin is the software assurance layer: the retained materials do not document
              cybersecurity certifications, privacy controls, uptime or SLA disclosures, or a public API and release
              ecosystem comparable to enterprise software vendors. For diligence, the main technical risk is not whether
              Agile Robots has interesting hardware, but how repeatable, secure, and supportable the full stack is once
              deployed across customer production environments.
            claimRefs:
              - CE005
              - CE012
              - CE013
              - CE014
