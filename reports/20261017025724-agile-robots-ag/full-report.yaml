            title: Opacity is the gating investment risk
            body: >-
              The biggest near-term thesis breaker is not visible external distress; it is that public headcount,
              revenue, and funding snapshots do not reconcile cleanly enough to underwrite leverage, burn, or
              acquisition absorption from public evidence alone.
