      - number: '1.2'
        title: Founder bench, governance signals, and perimeter ambiguity
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports founder-market fit more strongly than it supports current governance
              detail. Official sources consistently tie Agile Robots to Zhaopeng Chen’s DLR research background and pair
              him with co-founder Peter Meusel, another long-time robotics researcher with hardware and torque-sensing
              expertise. That origin story matters because it underpins the company’s product credibility and its
              positioning as a force-controlled, AI-enabled robotics platform. On the legal-entity side, the accessible
              Northdata page still lists Agile Robots AG in Munich under District Court HRB 241039 and describes a
              robotics corporate purpose, but it does not expose the current financial detail or cap-table data that
              would let an investor reconcile the public legal entity, the website’s broader operating footprint, and
              third-party references to Agile Robots SE. For diligence, that leaves clear key-person dependence around
              Chen and an unresolved governance question around current board control, reporting perimeter, and investor
              rights.
