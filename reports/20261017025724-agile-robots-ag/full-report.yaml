      - number: '4.2'
        title: Cost structure and delivery footprint
        blocks:
          - type: paragraph
            body: >
              Agile Robots looks financially like a hardware-and-integration platform with software leverage, not like a
              lightweight SaaS vendor. The official About page says the company manufactures automation solutions and
              industrial robots at more than 15 sites worldwide, and German Wikipedia describes a full-service model in
              which hardware and software are largely developed and manufactured in-house. The footprint spans
              production in China, Kaufbeuren, and Chennai, while the portfolio has been expanded through acquisitions
              such as idealworks, BÄR Automation, Franka Robotics, audEERING, and XNG Automation. Those facts support a
              margin profile shaped by factories, component sourcing, field deployment, system integration, and
              post-acquisition integration costs; they do not support any public conclusion on gross margin, because the
              retained sources do not disclose it.
            claimRefs:
              - CI007
