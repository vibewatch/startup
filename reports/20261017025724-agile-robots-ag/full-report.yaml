      - number: '2.3'
        title: Evidence-constrained sizing lenses, drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The chapter can support market-access proxies, but not a defensible public TAM/SAM/SOM stack. Official
              pages provide deployment and capacity signals such as more than 20,000 installed robotics solutions, seven
              production sites, and two R&D centers, which are relevant because they show that the company is already
              serving real industrial workflows at global scale. Independent public monetary lenses are weaker and
              contradictory: Wikipedia summarizes 2024 revenue at EUR 103.4 million, while CompWorth estimates yearly
              revenue near USD 162.8 million and values the company at about USD 1 billion. Those numbers are useful
              only as triangulation. The practical growth drivers are the same features the company emphasizes
              repeatedly: force sensing, computer vision, natural language control, and a full-stack hardware-software
              offering that can expand into harder automation tasks. The matching constraint is that the same full-stack
              delivery model is likely more capital- and integration-intensive than pure software, and the absence of
              public pricing, ACV, or budget-owner data prevents a clean bottom-up SAM or SOM estimate.
            claimRefs:
              - CM008
              - CM009
