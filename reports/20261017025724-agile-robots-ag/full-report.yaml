  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The highest residual risk is disclosure quality rather than a single visible external shock. In the
              retained pool, Agile Robots presents itself as a fast-scaling multinational robotics platform, but public
              operating snapshots do not line up cleanly: the March 2024 SE announcement cites more than 1,700 employees
              worldwide, RocketReach cites more than 2,300 employees while also showing 405 employees and 327
              on-platform, and Wikipedia cites roughly 387 employees and EUR 103.4 million of 2024 revenue. That
              inconsistency makes it harder to underwrite operating leverage, burn, and integration capacity from public
              evidence alone. The second tier of risk comes from acquisition-led execution and globally distributed
              production, while the third tier is governance and product-assurance risk in a business that pairs
              industrial robotics with increasingly autonomous AI control surfaces.
            claimRefs:
              - CR001
