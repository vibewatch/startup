  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set spans peers, adjacent specialists, and substitutes
        blocks:
          - type: paragraph
            body: >-
              The public peer set is broad because Agile Robots sells an integrated automation stack rather than a
              single component. Official and profile sources consistently describe the company as combining robot
              hardware, software, vision, and accessories, while Tracxn places it in a landscape with thousands of
              active competitors and explicitly names ABB, Geekplus, and UBTECH among the top peers. That mix matters
              because it means the buyer can solve the same job through several routes: incumbent industrial automation
              suites, narrower robotics specialists, custom system integration, or simply keeping more rigid/manual
              workflows in place.


              The practical boundary of competition is therefore "who can automate a contact-rich industrial task with
              enough trust, integration depth, and service capacity," not just "who sells a robot arm." Agile's
              differentiation pitch centers on spanning more of the workflow than a point solution can, but that same
              breadth also widens the comparison set and makes category-by-category win evidence more important than a
              generic unicorn narrative.
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP009
              - CP011
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP009
              - CP012
              - CP013
      - number: '3.2'
        title: Differentiation thesis is real, but comparable proof is thin
        blocks:
          - type: paragraph
            body: >-
              Source-backed differentiation does exist. Agile's pre-A and Series C materials contrast its
              force-controlled, vision-enabled, software-led robots with traditional position-controlled industrial
              robots that are weaker in non-standardized and close-collaboration tasks. The company also pitches
              multi-industry applicability across medical, automotive, consumer electronics, research, and precision
              assembly, which supports a positioning claim above a single-use robot vendor.


              What is still missing is apples-to-apples public proof that this breadth beats named competitors on price,
              deployment speed, or retention. The best-supported conclusion from the assigned source pool is not that
              Agile has already won the market, but that it is trying to compete on integration breadth and
              difficult-workflow suitability while many comparison cells remain unknown in public materials.
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP011
              - CP012
