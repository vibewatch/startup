        - label: Multi-vertical demand framing
          detail: >-
            Official funding material frames manufacturing, logistics and healthcare as target settings without
            deployment counts.
          touchpoints:
            - Manufacturing
            - Logistics
            - Healthcare
        - label: Global delivery footprint
          detail: >-
            The company presents itself as able to serve customers from production sites across Europe, America and
            Asia.
          touchpoints:
            - Over 15 sites worldwide
            - Regional production and R&D footprint
        - label: Integrator-led expansion
          detail: BÄR adds system-integration capabilities and an inherited international customer base.
          touchpoints:
