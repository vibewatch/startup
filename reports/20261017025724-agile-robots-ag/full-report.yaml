  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a **research-more** recommendation rather than a buy or pass. On the positive side,
              Agile Robots has already crossed a real institutional-financing threshold: the September 2021 Series C
              brought in US$220 million and set a public benchmark above US$1 billion, while the November 2025
              acquisition announcement described roughly EUR 200 million of 2024 revenue and more than 2,500 employees
              before the thyssenkrupp Automation Engineering team is added. Those are not seed-stage ambition signals;
              they indicate a scaled robotics platform with meaningful manufacturing and systems-integration reach.


              The problem is price sensitivity. Public evidence still does not show a fresh priced round after the 2021
              unicorn marker, the acquisition price for thyssenkrupp Automation Engineering was undisclosed, and the
              most explicit later funding commentary in the assigned pool warns that reported 2025 revenue and
              cumulative funding are company statements rather than audited figures. A disciplined investor can
              therefore justify continued work on the asset, but not underwriting an entry price that is unknown, above
              the last disclosed unicorn benchmark, or unsupported by audited margin, burn, retention, and
              preference-stack data. That combination is best described as **medium confidence**, **high risk**, and
              **stretched** on valuation.
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV010
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
