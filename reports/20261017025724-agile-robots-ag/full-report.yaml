  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >
              The retained public evidence points to a product-led B2B revenue model rather than a pure-software
              subscription profile. Multiples categorizes Agile Robots as B2B with "Product sales" as the revenue model,
              while third-party and company-authored descriptions show a bundled offer that combines robot hardware,
              AgileCore software, and deployment-level automation work across manufacturing, logistics, and adjacent
              industrial settings. Public traction is real, but the figures are not directly comparable: Multiples
              records $230 million of revenue at the April 2022 round snapshot, German Wikipedia cites €103.4 million of
              2024 revenue for Agile Robots SE, and Startuprad reports about €300 million of 2025 revenue from a chief
              executive statement that it explicitly says is not independently audited. That combination is enough to
              confirm commercial scale, but not enough to reconcile group revenue mix, entity boundaries, or
              revenue-recognition quality.
