  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a narrow market definition around embodied automation, not generic enterprise AI.
              North Data's corporate-purpose summary anchors the legal scope in "service and industrial robotics", while
              Agile Robots' current product pages describe a stack that combines robotic arms, hands, mobile robots,
              automation cells, AgileCore software, and AI. That means the relevant spend pool is the subset of
              industrial and adjacent service/medical automation budgets where customers need sensing, adaptation, and
              system integration together. The clearest status-quo substitute is fixed-sequence automation: the Physical
              AI page explicitly contrasts legacy machines that repeat fixed sequences with systems that can perceive,
              reason, and adapt. For diligence, that implies the addressable opportunity is not "all AI" or even "all
              factory software", but the workflows where manual handling or rigid automation breaks down because
              precision, variability, or safety matters.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
      - number: '2.2'
        title: Buyer segments, users, and the adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is broader than one factory niche. Across official pages, the 2021 Series C announcement,
              Nature partner content, and Wikipedia's current summary, Agile Robots is repeatedly tied to automotive
              production, consumer-electronics and other precision assembly, healthcare or medical robotics, and
              selected agriculture, hospitality, and retail use cases. The supportable user story is operational rather
              than departmental-software-led: line operators, manufacturing engineers, automation teams, and clinical
              staff are the people who interact with the systems, while the paying budget almost certainly sits with
              industrial capex or transformation programs instead of a generic IT line item. The gap is that assigned
              public sources do not disclose who exactly signs the budget by segment, nor do they disclose package
              pricing, deployment payback periods, or renewal mechanics. That keeps the adoption path intelligible but
              still incomplete for underwriting speed or repeatability.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM013
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
