      - number: '3.3'
        title: Distribution and switching costs can help, but moat durability is unproven
        blocks:
          - type: paragraph
            body: >-
              Agile's acquisition pattern and legal-entity evolution strengthen the case that it wants to compete as a
              scaled industrial platform. Startuprad and Wikipedia describe how Franka, idealworks, and thyssenkrupp
              automation assets broadened the product and integration footprint, and the 2024 SE conversion explicitly
              links the new structure to easier cross-border distribution for European industrial customers. Together,
              those moves can raise switching costs by bundling robot hardware, software, and integration capabilities
              inside one vendor relationship.


              Even so, the durability argument remains incomplete. Public evidence does not show standardized pricing,
              discounting behavior, documented win rates against named incumbents, or customer-retention quality.
              Startuprad also treats reported 2025 scale figures as chief-executive statements rather than audited
              third-party proof. For underwriting, that leaves Agile with a credible strategic position but not yet a
              publicly demonstrated moat against larger incumbents or focused specialists.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP008
              - CP009
              - CP010
              - CP011
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public moat proof still lags the strategic narrative
            body: >-
              Agile can credibly argue for a differentiated full-stack position, but the assigned evidence does not yet
              publish the pricing, win-rate, or retention data needed to prove that the position compounds into a
              durable moat against incumbents or specialists.
            calloutType: risk
            claimRefs:
