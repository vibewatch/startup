      - number: '6.3'
        title: Durability, expansion and concentration remain diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The commercial upside is plausible: Agile Robots can now approach buyers through direct robot sales,
              integrator-led automation projects and portfolio cross-sell from Franka, idealworks and BÄR. What is
              missing is the evidence that separates a broad funnel from durable economics. The reviewed sources do not
              disclose customer count, NRR, GRR, churn, contract length, top-customer exposure or revenue split by
              direct versus acquired channels. Independent commentary also warns that some scale figures are management
              statements rather than audited customer-quality evidence, so the customer chapter should be read as
              evidence of addressable traction and channel breadth, not proof of repeatable retention.
            claimRefs:
              - CU008
              - CU009
              - CU011
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Durability evidence lags deployment evidence
            body: >-
              Agile Robots has enough public proof to establish real deployment surfaces, but not enough to prove
              renewal quality or concentration resilience. Investors should treat current customer evidence as traction
              proof, not as a substitute for cohort, retention and top-account diligence.
            calloutType: risk
