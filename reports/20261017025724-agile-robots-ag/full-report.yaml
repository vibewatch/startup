      - number: '6.2'
        title: Adoption proof is real but mostly company-described
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does contain concrete adoption signals: Agile Robots says Diana 7 was used early in
              electronics installation, while the BÄR acquisition added an existing automation integrator with an
              international customer base. Its 2020 financing release separately frames manufacturing, logistics and
              healthcare as addressable settings rather than quantifying adoption. Together, the first two points make
              it hard to dismiss Agile Robots as purely pre-revenue R&D theatre. Even so, the public proof remains
              uneven. Named end customers are scarce, many references are to sectors or unnamed enterprises, and the
              strongest scale claims still come from company materials rather than independent customer disclosures or
              procurement records.
