      - number: '4.3'
        title: Capital base and financing dependency
        blocks:
          - type: paragraph
            body: >
              Agile Robots has raised substantial external capital, but the public record on current capital adequacy is
              stale and incomplete. Multiples reports $270 million raised across three completed rounds, and
              independent/company-retained sources corroborate a $220 million Series C in September 2021 at a valuation
              above $1 billion; the company profile on Munich Startup also still frames that round as the step that made
              Agile Robots "the world's first robotics unicorn." The latest priced valuation marker in the retained
              corpus is still April 2022 at $1 billion, while Startuprad cautions that more recent figures in
              circulation such as about €300 million of 2025 revenue, cumulative funding of about $1.5 billion, or
              reports of a possible further $800 million round are either unaudited, unconfirmed, or still only
              negotiations. Without disclosed cash, burn, debt, or capex commitments, the evidence is strong enough to
              show financing dependence and scale, but not enough to prove present runway.
            claimRefs:
              - CI003
              - CI004
              - CI006
              - CI009
              - CI014
              - CI016
      - number: '4.4'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >
              The financial verdict is mixed. Public evidence supports a sizeable robotics platform with real
              manufacturing assets, broad delivery scope, and repeated access to outside capital. It does not support a
              clean underwriting model. The strongest current-period number in the retained corpus is the €103.4 million
              2024 revenue reference for Agile Robots SE, but that sits alongside a separate 2025 company statement of
              about €300 million revenue with no audited bridge between the entity-level accounts and the broader group
              narrative. Just as importantly, the retained sources do not publish list pricing, realized pricing, CAC,
              payback, gross margin, cash on hand, or runway. For diligence, the next step is not another public-source
              search; it is management evidence on revenue mix, contract terms, service-delivery economics, and
              liquidity.
            claimRefs:
              - CI008
              - CI009
              - CI014
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
