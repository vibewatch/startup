  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence suggests a hardware-led automation bundle in which demand converts into system sales, deployment
      work, and only partially visible software economics.
    data:
      nodes:
        - id: demand
          label: Industrial demand
          note: >-
            Official and third-party sources place Agile Robots in automotive, consumer technology, healthcare,
            manufacturing, and logistics use cases.
        - id: order
          label: System order
          note: Multiples categorizes the company as B2B with product sales as the public revenue model.
        - id: bundle
          label: Bundled offer
          note: >-
            Hardware, AgileCore software, and acquired portfolio components are presented as one integrated automation
            stack.
        - id: delivery
          label: Manufacturing and deployment
          note: >-
            More than 15 sites worldwide and multiple production locations imply delivery labor, component sourcing, and
            working-capital demands.
        - id: recognized
          label: Recognized revenue
          note: >-
            Public snapshots include $230M at the April 2022 round, €103.4M for Agile Robots SE in 2024, and an
            unaudited ~€300M 2025 management statement.
        - id: profit
          label: Gross-profit visibility
          note: >-
            Public sources do not disclose gross margin, CAC, payback, or runway, so conversion from revenue to free
            cash remains opaque.
      edges:
        - from: demand
          to: order
