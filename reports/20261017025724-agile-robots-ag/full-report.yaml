        - from: order
          to: bundle
          label: sold as automation solution
        - from: bundle
          to: delivery
          label: requires build + integration
        - from: delivery
          to: recognized
          label: converted into booked revenue
        - from: recognized
          to: profit
          label: quality depends on undisclosed margins
