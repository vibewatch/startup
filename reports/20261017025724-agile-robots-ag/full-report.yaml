      - number: '7.3'
        title: Operational scale and integration risk
        blocks:
          - type: paragraph
            body: >-
              Execution risk is elevated because Agile Robots is scaling across both geography and portfolio breadth at
              the same time. The company describes more than 15 sites worldwide with production and regional
              headquarters across Germany, China, India, and the United States, and it has layered in Franka Robotics,
              BÄR Automation, idealworks, audEERING, and—most recently in 2026—XNG Automation. The new
              9,200-square-metre Munich headquarters reinforces that the organization is still absorbing rapid staff
              growth and footprint expansion. That creates classic integration, quality drift, and management-bandwidth
              risk even before accounting for frontier control-stack work such as natural-language robot programming.
            claimRefs:
              - CR007
