        title: Product scope and workflow fit
        blocks:
          - type: paragraph
            body: >-
              The documented portfolio spans several layers of an industrial automation workflow rather than a single
              robot family. Official materials describe a modular production platform, multiple arm families, tactile
              and gripping accessories, mobile systems, and training hardware, while third-party profiles frame the
              company as a DLR-derived force-control specialist that has expanded into a broader automation stack. The
              practical workflow focus is assembly, insertion, loading and unloading, palletizing, welding, inspection,
              and training use cases where force sensing, collision detection, and faster line changeovers matter more
              than generic robot throughput claims.
