      - number: '7.2'
        title: Regulatory, legal, and governance exposure
        blocks:
          - type: paragraph
            body: >-
              Agile Robots has already taken one structural step to support cross-border operations by converting from
              an AG to an SE in March 2024, and its own governance language is stronger than a typical marketing page:
              the company explicitly references privacy protection, anti-bribery controls, whistleblower procedures,
              lawful AI deployment, and a commitment not to build military robots. Those are meaningful mitigants, but
              they are still self-described controls. The assigned evidence does not independently confirm
              sector-specific approvals, product-liability history, litigation outcomes, or security-incident handling.
              Northdata adds registry traceability, yet the retained page surface is thin enough that it does not close
              legal-disclosure risk for an investor.
            claimRefs:
              - CR001
