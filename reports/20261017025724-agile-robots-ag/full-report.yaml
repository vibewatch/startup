chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Agile Robots traces its origin to a 2018 spin-off from the German Aerospace Center (DLR), founded by
              Zhaopeng Chen, Peter Meusel, and other DLR researchers. The company’s current positioning is broader than
              a single robot product: its own materials describe an AI-driven robotics and automation platform spanning
              hardware, software, and physical-AI systems for industrial and service use cases. The most current
              official location signal in the assigned pool is the June 2025 opening of a new global headquarters in
              Munich’s Sendling district, while the about-us page shows a wider operating footprint across Germany, the
              United States, China, and India. Scale claims are substantial but not perfectly comparable: the homepage
              cites 2,000+ R&D experts and the headquarters release cites more than 2,300 employees worldwide, whereas a
              later third-party Wikipedia summary reports much smaller 2024 employee counts for Agile Robots SE
              specifically. That makes the company clearly scaled, but not yet transparent enough to treat every
              workforce or revenue number as the same reporting perimeter.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO007
              - CO008
              - CO009
              - CO010
