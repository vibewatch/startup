      - number: '1.3'
        title: Funding history and the milestone pattern behind today’s scale
        blocks:
          - type: paragraph
            body: >-
              Funding and milestone evidence shows a company that scaled quickly, but without current valuation
              transparency. The July 2019 pre-A announcement names Hillhouse, Sequoia, Tinavi, and Linear Venture after
              earlier seed and angel backing, and the Series C release says Agile Robots had raised more than US$130
              million in 2020 and crossed a US$1 billion valuation benchmark. The official company timeline adds that
              SoftBank became the anchor investor in 2021, then records a manufacturing expansion in Germany, multiple
              2023 acquisitions (idealworks, BÄR Automation, and Franka Robotics), the 2025 Munich headquarters opening,
              the 2025 audEERING acquisition, and a 2026 majority stake in India-based XNG Automation. That pattern
              supports a view of Agile Robots as an expansionary consolidator rather than a single product company, but
              the assigned pool still lacks current priced-round evidence, customer count disclosure, and
              portfolio-integration KPIs.
