      - number: '4.3'
        title: 资本基础与融资依赖
        blocks:
          - type: paragraph
            body: >
              Agile Robots 已筹集大量外部资本，但公开记录对当前资本充足度的描述已经过时且不完整。Multiples 报告三轮已完成融资合计 $270 million；独立来源和公司留存来源也相互印证，称公司于
              2021 年 9 月完成 $220 million C 轮融资，估值超过 $1 billion；Munich Startup 的公司档案仍将该轮描述为 Agile Robots
              成为“全球首家机器人独角兽”的一步。留存语料中最新的定价估值标记仍是 2022 年 4 月的 $1 billion；Startuprad 则提醒，流传较新的数字——例如 2025 年收入约 €300
              million、累计融资约 $1.5 billion，或可能再融资 $800
              million——要么未经审计、要么未经确认、要么仍停留在谈判阶段。公司没有披露现金、烧钱、债务或资本开支承诺，因此证据足以说明融资依赖和规模，却不足以证明当前 runway。
            claimRefs:
              - CI003
              - CI004
              - CI006
              - CI009
              - CI014
              - CI016
      - number: '4.4'
        title: 投资判断与尽调阻碍
        blocks:
          - type: paragraph
            body: >
              财务判断是混合的。公开证据支持这样一家公司：拥有规模不小的机器人平台、真实制造资产、广泛交付能力，并多次获得外部资本。但这些证据不足以搭建干净的投资模型。留存语料中最强的当前期数字，是 Agile Robots
              SE 2024 年收入 €103.4 million；与此同时，公司另有一项 2025 年收入约 €300 million
              的声明，却没有经审计的桥接表，把实体层账目与更宽泛的集团叙事对上。更重要的是，留存来源没有披露挂牌价格、实际成交价、CAC、回本周期、毛利率、现金余额或
              runway。尽调下一步不应继续搜索公开来源，而应获取管理层关于收入结构、合同条款、服务交付经济性和流动性的证据。
            claimRefs:
