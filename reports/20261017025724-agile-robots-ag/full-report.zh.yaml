  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 经审计的 2025—2026 年收入支持公司更大规模的叙事；thyssenkrupp 整合顺利完成；当前融资价格没有明显高于改善后的规模所能支撑的水平。
        - 只有当经审计的增长、利润率路径和整合证据都验证了这一步提升时，相对于 2021 年超过 10 亿美元基准的溢价才可接受。
        - 收购带来的执行压力、协同延迟，或价格涨幅超出证据支持范围
        - 条款清晰的已签融资、经审计报表和披露的整合 KPI
      - - 基准
        - 公司在战略上仍可信，但价格、股权表条款和经济性仍有部分不公开。
        - 围绕最近披露的独角兽锚点设置下行保护后再等待或参与，不要只为叙事扩张买单。
        - 未知稀释、隐藏的优先权以及实体与集团口径混杂
        - 价格发现仍不透明，尽调仍依赖管理层材料
      - - 悲观
        - 新一轮融资或二级市场估值高于历史基准，却没有利润率、烧钱或客户质量的经审计证据；或者近期整合无法证明创造了价值。
        - 避免按报价进行投资判断；只有出现明显更低的入场点或强得多的披露后才重新评估。
        - 估值过高、倍数压缩、收购后表现不佳和结构风险
        - 融资传闻仍未落地，公司声明仍未经审计，尽调缺口持续存在
    notes: 情景区间有意保持定性，因为指定证据池没有当前定价轮、经审计的经济性数据或条款清单细节。
