  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 公开证据表明，这是一种以硬件为主导的自动化捆绑方案，其中需求转化为系统销售、部署工作以及仅部分可见的软件经济效益。
    data:
      nodes:
        - id: demand
          label: 工业需求
          note: 官方和第三方来源将 Agile Robots 置于汽车、消费科技、医疗、制造和物流应用场景中。
        - id: order
          label: 系统订单
          note: Multiples 将该公司归类为 B2B，公司公开的收入模式为产品销售。
        - id: bundle
          label: 捆绑式方案
          note: 硬件、AgileCore 软件以及收购所得的产品组合组件被作为一个集成式自动化栈呈现。
        - id: delivery
          label: 制造与部署
          note: 全球超过 15 个地点以及多个生产地点意味着交付人力、零部件采购和营运资金需求。
        - id: recognized
          label: 已确认收入
          note: 公开快照包括 2022 年 4 月融资轮时的 $230m、Agile Robots SE 在 2024 年的 €103.4m，以及管理层对 2025 年约 €300m 的未经审计表述。
        - id: profit
          label: 毛利润可见性
          note: 公开来源未披露毛利率、CAC、回本期或现金跑道，因此从收入到自由现金的转化仍不透明。
      edges:
        - from: demand
          to: order
          label: 买方需求
        - from: order
          to: bundle
          label: 作为自动化解决方案出售
        - from: bundle
          to: delivery
          label: 需要制造与集成
        - from: delivery
          to: recognized
          label: 转化为已入账收入
        - from: recognized
          to: profit
          label: 质量取决于未披露的利润率
    claimRefs:
