        title: 融资历史与今日规模背后的里程碑路径
        blocks:
          - type: paragraph
            body: >-
              融资和里程碑证据显示，公司扩张很快，但当前估值并不透明。2019 年 7 月的 A 轮前公告提到，在此前种子轮和天使轮支持之后，投资方包括 Hillhouse、Sequoia、Tinavi 和 Linear
              Venture；C 轮公告称，Agile Robots 在 2020 年融资超过 US$130 million，并突破 US$1 billion 估值基准。公司官方时间线还显示，SoftBank 于 2021
              年成为锚定投资人，随后公司在德国扩充制造能力，于 2023 年多次收购 idealworks、BÄR Automation 和 Franka Robotics，2025 年启用慕尼黑总部、收购
              audEERING，并于 2026 年取得印度 XNG Automation 的多数股权。这条路径更像扩张型整合者，而非单一产品公司；但指定来源仍缺少当前定价轮证据、客户数量披露和组合整合 KPI。
