  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              证据支持的市场定义应聚焦具身自动化，而不是泛企业 AI。North Data 的公司目的摘要将法律范围锚定在“服务机器人和工业机器人”，Agile Robots
              当前产品页面则描述了一套结合机械臂、灵巧手、移动机器人、自动化单元、AgileCore 软件和 AI 的技术栈。因此，相关支出池是工业及相邻服务 /
              医疗自动化预算中，那些同时需要感知、适应和系统集成的部分。最清晰的现状替代方案是固定序列自动化：Physical AI
              页面明确将重复固定序列的传统机器，与能够感知、推理和适应的系统作对比。对尽调而言，可服务机会不是“所有 AI”，甚至也不是“所有工厂软件”，而是精度、变化性或安全性使人工处理和刚性自动化失效的工作流。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
      - number: '2.2'
        title: 买家分层、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              买家版图不止一个工厂细分领域。官方页面、2021 年 C 轮公告、Nature 合作内容和 Wikipedia 当前摘要反复将 Agile Robots
              与汽车生产、消费电子及其他精密装配、医疗保健或医疗机器人，以及部分农业、酒店和零售场景联系起来。可得到支持的用户故事偏运营，而不是部门软件：产线操作员、制造工程师、自动化团队和临床人员会直接使用这些系统；付费预算几乎肯定来自工业资本开支或转型项目，而不是泛
              IT 科目。缺口在于，指定公开来源没有披露各细分市场究竟由谁签署预算，也没有披露套餐定价、部署回本周期或续约机制。因此，采用路径虽清晰，仍不足以判断销售速度或可复制性。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM013
              - CM015
