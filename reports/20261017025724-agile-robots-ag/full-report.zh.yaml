      - number: '2.3'
        title: 受证据约束的规模视角、驱动因素与限制
        blocks:
          - type: paragraph
            body: >-
              本章可以支持市场触达代理指标，但无法搭建有说服力的公开 TAM / SAM / SOM。官方页面提供了部署和产能信号，例如已安装超过 20,000 套机器人解决方案、7 个生产基地和 2
              个研发中心；这些数据说明公司已在全球范围服务真实工业工作流。独立公开金额口径更弱且互相矛盾：Wikipedia 将 2024 年收入概括为 EUR 103.4 million，CompWorth 则估算年收入接近
              USD 162.8 million、公司估值约 USD 1
              billion。这些数字只能用于交叉验证。实际增长驱动正是公司反复强调的能力：力感知、计算机视觉、自然语言控制，以及可向更复杂自动化任务延伸的软硬件全栈方案。相应限制是，全栈交付模式可能比纯软件更耗资本、也更依赖集成；缺少公开定价、ACV
              或预算负责人数据，也就无法干净地自下而上估算 SAM 或 SOM。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM014
