              - CP008
              - CP011
              - CP012
      - number: '3.3'
        title: 分销与转换成本有帮助，但护城河持久性尚未证明
        blocks:
          - type: paragraph
            body: >-
              Agile 的收购路径和法律实体演变，强化了其要成为规模化工业平台的意图。Startuprad 和 Wikipedia 描述了 Franka、idealworks 及 thyssenkrupp
              自动化资产如何扩大产品与集成版图；2024 年转为 SE 的公告也将新结构与面向欧洲工业客户的跨境分销便利性联系起来。这些动作把机器人硬件、软件和集成能力捆在同一供应商关系中，可能抬高转换成本。

              但护城河能否持久仍未厘清。公开证据没有展示标准化定价、折扣行为、对知名既有厂商的书面赢单率或客户留存质量。Startuprad 还将 2025 年规模数字视为 CEO
              说法，而非经审计的第三方证明。对投资判断而言，Agile 有可信的战略位置，却还没有公开证明能对大型既有厂商或专注型公司形成护城河。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP008
              - CP009
              - CP010
              - CP011
      - number: '3.4'
        title: 图表
        blocks:
          - type: callout
            title: 公开护城河证据仍落后于战略叙事
            body: Agile 有理由主张自己拥有差异化全栈定位，但指定证据尚未披露定价、赢单率或留存数据，无法证明这种定位能积累成对既有厂商或专注型公司的持久护城河。
            calloutType: risk
            claimRefs:
              - CP010
              - CP012
