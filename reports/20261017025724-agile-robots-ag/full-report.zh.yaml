      - number: '8.2'
        title: 估值背景与情景
        blocks:
          - type: paragraph
            body: >-
              现有公开估值背景在方向上有用，但数字并不完整。历史融资证据很清楚：Agile Robots 宣布过 SoftBank 领投的 2021 年 C 轮，估值突破 US$1 billion；更早的 A 轮前公告也显示
              Hillhouse、Sequoia、Tinavi 和 Linear 组成了可信投资人团。近期运营规模信号则不够干净：2025 年收购公告称 2024 年收入约 EUR 200 million、员工超过 2,500
              人，而 2025 年 11 月 Wikipedia 修订版称 Agile Robots SE 2024 年收入 EUR 103.4 million、员工约 387
              人。最可能的解释是集团层面与更窄法律实体之间存在口径错配，但这仍然重要，因为投资人定价的是法律实体和证券，而不只是叙事。

              因此，下面的情景表采用有纪律的区间，而不是虚假的精确度。乐观情景只有在后续尽调验证集团规模收入、证明收购后整合，并确认当前价格没有简单外推 2021
              年独角兽标签时才成立。基准情景假设公司在战略上有吸引力，但披露仍不足；最佳投资姿态是等待价格和经济性变得透明，或要求强有力的下行保护。若新一轮融资达到或超过历史基准，却没有利润率、现金烧钱和商业化质量的审计证明，则触发悲观情景。
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV011
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV009
              - CV010
              - CV014
              - CV015
      - number: '8.3'
        title: 最终尽调事项与论点破坏触发器
        blocks:
          - type: paragraph
            body: >-
              最终尽调路径很明确，因为剩余阻碍都很具体。第一，取得当前融资文件或可信的二级估值：指定公开来源仍集中在 2021 年独角兽事件，少数后续融资引用也明确称传闻中的 2026
              年融资仍只在谈判中。第二，核对法律实体口径，把任何拟发行证券与实际发行实体及更广泛运营集团的经审计收入、员工数、利润率、现金烧钱和客户集中度数据连接起来。第三，审阅整合 KPI、留存客户项目、工厂利用率及与
              thyssenkrupp 交易相关的监管条件，检验近期收购是否真正增值。

              如果 Agile Robots
              一边要求溢价入场价，一边继续把这些尽调事项留在内部；如果整合进度落后于收购驱动增长所暗示的速度；或后续披露显示集团规模说法无法落到被融资的实体上，投资论点就会破裂。只有当价格、结构和经济性具体到足以评估目标回报时，判断才可能从“继续研究”改善为“投资”；在此之前，应把公司留在工作清单上，但不要只为增长动能付费。
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV011
              - CV013
              - CV015
