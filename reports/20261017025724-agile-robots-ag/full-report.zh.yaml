chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与运营版图
        blocks:
          - type: paragraph
            body: >-
              Agile Robots 源于德国航空航天中心（DLR）2018 年的一次分拆，由 Zhaopeng Chen、Peter Meusel 及其他 DLR
              研究人员创立。公司如今的定位已不只是单一机器人产品：自有材料将其描述为面向工业和服务场景、覆盖硬件、软件及物理 AI 系统的 AI 驱动机器人与自动化平台。本次指定来源中最新的官方地点信号，是公司于 2025 年
              6 月在慕尼黑 Sendling 区启用新全球总部；其关于我们页面则显示，公司在德国、美国、中国和印度均有运营布局。规模数据很可观，但口径并不完全可比：官网称有 2,000+
              名研发专家，总部启用公告称全球员工超过 2,300 人，而之后的第三方 Wikipedia 摘要对 Agile Robots SE 单体披露的 2024
              年员工数小得多。因此，公司显然已具备规模，但公开信息还不足以把每个员工数或收入数都视为同一报告口径。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO007
