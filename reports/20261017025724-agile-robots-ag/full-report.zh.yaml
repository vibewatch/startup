  - id: FE001
    title: 产品架构与交付栈
    type: stack
    summary: Agile Robots 的技术栈覆盖客户工作流、机器人系统、控制软件以及收购获得的实施能力。
    data:
      layers:
        - label: 客户工作流
          detail: 精密装配、装载与卸载、焊接、检测和培训工作流是公开资料中反复出现的应用场景。
        - label: 应用系统
          detail: FIP、焊接单元、Zeus 3 检测 AMR 和 H10-W 将机器人硬件封装为面向特定工作流的系统。
        - label: 机器人平台
          detail: Diana 和 Thor 系列提供核心的力控机械臂层，覆盖从轻型到较重型的工业任务。
        - label: 末端执行器与传感
          detail: Tekken D 夹爪和 VT10-G 触觉传感扩展了操作精度和反馈能力。
        - label: 控制与编排
          detail: Agile Core 和 AgileAI 被描述为用于技能、自然语言编程和协调的软件层。
        - label: 交付与集成
          detail: Franka、idealworks、BÄR 和 Krause 资产将公司拓展至移动机器人、自动化工程和工厂集成领域。
    claimRefs:
      - CE003
      - CE007
      - CE008
      - CE011
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据指向一条从精密装配应用场景起步、通过多垂直行业营销主张扩大、并借助收购渠道扩张的旅程， 但从部署到续约的闭环仍未公开量化。
    data:
      items:
        - label: 精密装配切入点
          detail: 据描述，Diana 7 自推出起便用于电子元件安装工作。
          touchpoints:
            - 在智能手机、平板电脑、PC 等设备中安装电子元件
            - 灵敏的力控与碰撞感知操作
        - label: 多垂直行业需求框架
          detail: 官方融资材料将制造、物流和医疗列为目标场景，但未提供部署数量。
          touchpoints:
            - 制造
            - 物流
            - 医疗
        - label: 全球交付足迹
          detail: 公司称能够依托遍布欧洲、美洲和亚洲的生产基地为客户提供服务。
          touchpoints:
            - 全球超过 15 个地点
            - 区域生产与研发足迹
        - label: 集成商主导的扩张
          detail: BÄR 增加了系统集成能力和继承而来的国际客户群。
          touchpoints:
            - 特种设备制造
            - 工业自动化服务
        - label: 产品组合交叉销售面
          detail: idealworks、Franka 和 BÄR 将买方范围扩大到单一机器人手臂 SKU 之外。
          touchpoints:
            - 汽车生产
            - 内部物流
            - 研究与先进机器人用户
        - label: 续约证据缺口
          detail: 公开来源未披露留存率、流失率、合同期限或客户集中度。
          touchpoints:
            - 无公开 NRR 或 GRR
            - 无前十大客户拆分
    approximationNotes: 该顺序是根据官方和独立来源综合出的、有证据支持的商业路径，而非公司发布且披露转化率的漏斗。
    claimRefs:
      - CU002
      - CU004
      - CU005
      - CU006
      - CU012
      - CU014
