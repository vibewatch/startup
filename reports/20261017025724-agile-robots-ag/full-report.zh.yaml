  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争者涵盖同业、相邻专家型公司与替代方案
        blocks:
          - type: paragraph
            body: >-
              Agile Robots 销售的是一体化自动化技术栈，而非单一部件，因此公开同业范围很广。官方和公司资料一贯将其描述为结合机器人硬件、软件、视觉和配件；Tracxn
              则将其放在拥有数千家活跃竞争者的市场中，并明确把 ABB、Geekplus 和 UBTECH 列为主要同业。买家可以沿多条路径解决同一任务，包括既有工业自动化套件
              工业自动化套件、专注单点的机器人公司、定制系统集成，或继续采用更刚性 / 更依赖人工的工作流。

              竞争边界实际是“谁能以足够的信任度、集成深度和服务能力自动化接触密集型工业任务”，而不只是“谁卖机器人机械臂”。Agile
              的差异化主张是覆盖比单点方案更长的工作流，但这种广度也扩大了比较范围，使逐类别的赢单证据比泛化的独角兽叙事更重要。
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP009
              - CP011
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP009
              - CP012
              - CP013
      - number: '3.2'
        title: 差异化逻辑真实存在，但可比证据不足
        blocks:
          - type: paragraph
            body: >-
              有来源支持的差异化确实存在。Agile 的 A 轮前和 C
              轮材料，将其力控、视觉增强、软件驱动的机器人，与在非标准化和紧密协作任务中能力较弱的传统位置控制工业机器人作对比。公司称其方案适用于医疗、汽车、消费电子、科研和精密装配等多个行业，因此可将其定位为多用途机器人供应商。

              但公开材料仍缺少同口径证据，无法证明这种广度在价格、部署速度或留存上胜过点名的竞争者。最稳妥的结论不是 Agile 已经赢得市场，而是它正试图凭集成广度和复杂工作流适配性竞争，同时大量比较项在公开材料中仍未知。
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP011
              - CP012
