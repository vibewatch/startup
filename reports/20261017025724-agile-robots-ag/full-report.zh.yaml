  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              证据支持“继续研究”，而不是买入或放弃。积极的一面是，Agile Robots 已跨过真正的机构融资门槛：2021 年 9 月 C 轮融资获得 US$220 million，并建立了高于 US$1 billion
              的公开基准；2025 年 11 月收购公告则称，公司在加入 thyssenkrupp Automation Engineering 团队前，2024 年收入约 EUR 200 million、员工超过 2,500
              人。这些不是种子期雄心信号，而是一个具备实质制造和系统集成能力的规模化机器人平台。

              问题在于价格敏感性。公开证据仍未显示 2021 年独角兽标记之后的新定价轮；thyssenkrupp Automation Engineering 的收购价格未披露；指定来源中最明确的后续融资评论也提醒，2025
              年收入和累计融资数字是公司说法，而非经审计数据。因此，纪律严明的投资人可以继续研究这个资产，但不能据此承保一个未知、超过最后披露独角兽基准，或缺少经审计利润率、烧钱、留存和优先权结构数据支撑的入场价格。综合判断是：估值信心
              **中等**、风险 **高**、价格 **偏高**。
