      - number: '1.2'
        title: 创始团队、治理信号与口径歧义
        blocks:
          - type: paragraph
            body: >-
              指定证据对创始人与市场的匹配度支持更强，对当前治理细节的支持则较弱。官方来源一贯将 Agile Robots 与 Zhaopeng Chen 的 DLR 研究背景联系起来，并将他与联合创始人 Peter
              Meusel 并列；后者同样是长期从事机器人研究、具备硬件和扭矩感知专长的研究人员。这段起源故事很重要，因为它支撑了公司的产品可信度，也支撑其力控、AI 机器人平台定位。从法律实体看，现可访问的
              Northdata 页面仍将慕尼黑的 Agile Robots AG 列在地方法院 HRB 241039
              名下，并注明其机器人业务目的，但没有披露当前财务细节或股权结构表数据，投资人无法据此核对公开法律实体、官网更广泛的运营版图，以及第三方对 Agile Robots SE 的引用。对尽调而言，Chen
              仍存在明显的关键人物依赖，当前董事会控制权、报告口径和投资人权利也仍是未解的治理问题。
