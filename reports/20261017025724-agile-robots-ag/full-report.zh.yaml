companyProfile:
  summary: >-
    Agile Robots 是一家以慕尼黑为根基、从 DLR 分拆出来的工业机器人平台，将扭矩感知机器人硬件、软件、视觉和系统集成服务结合起来，服务于工业及部分服务 /
    医疗场景。公司依靠收购和全球生产基地扩张了业务，但公开证据对定价、利润率、客户集中度和合并口径财务质量的披露仍不够透明。
