company:
  name: "Agile Robots AG"
chapter:
  number: 7
  title: "Risks"
  summary: "The main underwriting risk is not a single product defect but a stack of opacity and execution burdens: public workforce and revenue snapshots conflict, the operating footprint spans multiple manufacturing jurisdictions, and the company is still integrating a string of acquisitions while pushing frontier AI controls into production robotics. Agile Robots does show real mitigation scaffolding—ISO 9001, formal compliance language, whistleblower procedures, and a cross-border SE structure—but the assigned evidence still leaves unresolved diligence around litigation, incident history, partner concentration, and post-acquisition KPI discipline."
sections:
  - id: "ranked-risk-picture"
    title: "Ranked risk picture"
    body: "The highest residual risk is disclosure quality rather than a single visible external shock. In the retained pool, Agile Robots presents itself as a fast-scaling multinational robotics platform, but public operating snapshots do not line up cleanly: the March 2024 SE announcement cites more than 1,700 employees worldwide, RocketReach cites more than 2,300 employees while also showing 405 employees and 327 on-platform, and Wikipedia cites roughly 387 employees and EUR 103.4 million of 2024 revenue. That inconsistency makes it harder to underwrite operating leverage, burn, and integration capacity from public evidence alone. The second tier of risk comes from acquisition-led execution and globally distributed production, while the third tier is governance and product-assurance risk in a business that pairs industrial robotics with increasingly autonomous AI control surfaces."
    claimRefs: ["CR001", "CR003", "CR004", "CR005", "CR006", "CR007", "CR008", "CR013", "CR015"]
    figureRefs: ["FR001"]
  - id: "regulatory-and-governance"
    title: "Regulatory, legal, and governance exposure"
    body: "Agile Robots has already taken one structural step to support cross-border operations by converting from an AG to an SE in March 2024, and its own governance language is stronger than a typical marketing page: the company explicitly references privacy protection, anti-bribery controls, whistleblower procedures, lawful AI deployment, and a commitment not to build military robots. Those are meaningful mitigants, but they are still self-described controls. The assigned evidence does not independently confirm sector-specific approvals, product-liability history, litigation outcomes, or security-incident handling. Northdata adds registry traceability, yet the retained page surface is thin enough that it does not close legal-disclosure risk for an investor."
    claimRefs: ["CR001", "CR002", "CR010", "CR011", "CR014"]
    tableRefs: ["TR001"]
  - id: "operational-and-integration"
    title: "Operational scale and integration risk"
    body: "Execution risk is elevated because Agile Robots is scaling across both geography and portfolio breadth at the same time. The company describes more than 15 sites worldwide with production and regional headquarters across Germany, China, India, and the United States, and it has layered in Franka Robotics, BÄR Automation, idealworks, audEERING, and—most recently in 2026—XNG Automation. The new 9,200-square-metre Munich headquarters reinforces that the organization is still absorbing rapid staff growth and footprint expansion. That creates classic integration, quality drift, and management-bandwidth risk even before accounting for frontier control-stack work such as natural-language robot programming."
    claimRefs: ["CR007", "CR008", "CR009", "CR012", "CR015"]
    tableRefs: ["TR002"]
  - id: "capital-and-dependency"
    title: "Capital, partner, and proof-of-performance dependencies"
    body: "The dependency risk is twofold. First, the company narrative still leans heavily on funding and unicorn-status framing, while public capital and operating metrics remain only partially transparent; that raises the odds that a future financing or valuation reset becomes the event that surfaces hidden margin, working-capital, or integration strain. Second, the product proof set in the assigned pool is still partly vendor-framed: Robotics Registry explicitly labels technical specifications as vendor-stated and its deployment log as announced-and-cited only. That does not disprove the business, but it does mean the investment case depends on diligence-quality confirmation of customer concentration, partner economics, and post-acquisition commercial performance rather than on public evidence alone."
    claimRefs: ["CR005", "CR006", "CR007", "CR008", "CR013", "CR016"]
    tableRefs: ["TR003"]
