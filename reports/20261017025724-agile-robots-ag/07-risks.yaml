callouts:
  - calloutType: "risk"
    title: "Opacity is the gating investment risk"
    body: "The biggest near-term thesis breaker is not visible external distress; it is that public headcount, revenue, and funding snapshots do not reconcile cleanly enough to underwrite leverage, burn, or acquisition absorption from public evidence alone."
    claimRefs: ["CR003", "CR004", "CR005", "CR006"]
  - calloutType: "risk"
    title: "Execution risk is acquisition-led"
    body: "Agile Robots is trying to integrate portfolio companies, manufacturing sites, and frontier AI tooling simultaneously. That raises the odds that any next disappointment arrives through delayed integration or quality drift rather than through a single headline event."
    claimRefs: ["CR007", "CR008", "CR009", "CR012", "CR015"]
  - calloutType: "recommendation"
    title: "Kill criteria should be operational, not narrative"
    body: "Before underwriting the next round or secondary mark, diligence should demand plant-level quality metrics, post-acquisition KPI bridges, customer concentration data, and a clean explanation for the public workforce and revenue discrepancies."
    claimRefs: ["CR005", "CR006", "CR007", "CR008", "CR010", "CR014"]
