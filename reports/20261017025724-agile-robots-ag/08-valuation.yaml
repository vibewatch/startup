slug: agile-robots-ag
runDate: 2026-10-17
company:
  name: Agile Robots AG
chapter:
  number: 8
  title: Valuation
  summary: >-
    Agile Robots has enough public scale and financing evidence to justify continued
    diligence, but not enough price or economics disclosure to justify a buy call.
    The chapter therefore lands on research-more with medium confidence, high risk,
    and a stretched valuation stance until the company discloses a current priced
    round, audited operating metrics, and clearer integration proof.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: |-
      The evidence supports a **research-more** recommendation rather than a buy or pass. On the positive side, Agile Robots has already crossed a real institutional-financing threshold: the September 2021 Series C brought in US$220 million and set a public benchmark above US$1 billion, while the November 2025 acquisition announcement described roughly EUR 200 million of 2024 revenue and more than 2,500 employees before the thyssenkrupp Automation Engineering team is added. Those are not seed-stage ambition signals; they indicate a scaled robotics platform with meaningful manufacturing and systems-integration reach.

      The problem is price sensitivity. Public evidence still does not show a fresh priced round after the 2021 unicorn marker, the acquisition price for thyssenkrupp Automation Engineering was undisclosed, and the most explicit later funding commentary in the assigned pool warns that reported 2025 revenue and cumulative funding are company statements rather than audited figures. A disciplined investor can therefore justify continued work on the asset, but not underwriting an entry price that is unknown, above the last disclosed unicorn benchmark, or unsupported by audited margin, burn, retention, and preference-stack data. That combination is best described as **medium confidence**, **high risk**, and **stretched** on valuation.
    claimRefs: [CV001, CV003, CV005, CV010, CV014]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: valuation-context-and-scenarios
    title: Valuation context and scenarios
    body: |-
      The available public valuation context is directionally useful but numerically incomplete. Historical financing evidence is clear: Agile Robots announced a SoftBank-led Series C in 2021 that pushed it above US$1 billion, and the older pre-A announcement shows a credible investor syndicate around Hillhouse, Sequoia, Tinavi, and Linear. Recent operating scale signals are less clean. The 2025 acquisition release cites around EUR 200 million of 2024 revenue and more than 2,500 employees, while a November 2025 Wikipedia revision reports EUR 103.4 million of 2024 revenue and about 387 employees for Agile Robots SE. The most likely explanation is scope mismatch between group-level statements and a narrower legal entity, but that mismatch still matters because investors price legal entities and securities, not just narratives.

      That ambiguity is why the scenario table below uses disciplined bands instead of false precision. The bull case only works if later diligence validates that group-scale revenue, proves post-acquisition integration, and confirms that a current price does not simply extrapolate the 2021 unicorn badge. The base case assumes the company is strategically interesting but still under-disclosed, which means the best underwriting posture is to wait for price and economics visibility or demand strong downside protection. The bear case is triggered if a new round clears at or above historical benchmarks without audited proof on margins, cash burn, and commercialization quality.
    claimRefs: [CV001, CV003, CV006, CV007, CV011, CV014]
    tableRefs: [TV003]
  - id: final-diligence-and-thesis-breaks
    title: Final diligence asks and thesis-break triggers
    body: |-
      The final diligence path is straightforward because the remaining blockers are specific. First, obtain the current financing documents or a credible secondary mark: public sources in the assigned pool still cluster around the 2021 unicorn event, and one of the few later financing references explicitly says a rumored 2026 round was only in negotiation. Second, reconcile legal-entity scope by tying any offered security to audited revenue, headcount, margin, cash-burn, and customer-concentration data for the actual issuing entity and the broader operating group. Third, test whether recent acquisitions are genuinely additive by reviewing integration KPIs, retained customer programs, plant utilization, and any regulatory conditions tied to the thyssenkrupp transaction.

      The thesis breaks if Agile Robots seeks a premium entry price while keeping those diligence items private, if integration progress lags the pace implied by acquisition-led growth, or if later disclosures show that group-level scale claims do not translate into the entity being financed. The call can improve from research-more toward invest only if price, structure, and economics become concrete enough to underwrite target returns; absent that, the right discipline is to keep the company on the worklist but avoid paying for momentum alone.
    claimRefs: [CV005, CV008, CV009, CV011, CV013, CV015]
