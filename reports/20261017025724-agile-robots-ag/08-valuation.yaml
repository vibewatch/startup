  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - View
      - Evidence-backed argument
      - What would change the view
    rows:
      - [Thesis, "SoftBank-led Series C and the >US$1 billion unicorn benchmark show institutional willingness to fund the platform at scale.", "A later down-round, weak secondary mark, or heavily structured terms would weaken the financing-quality signal."]
      - [Thesis, "The 2025 acquisition release points to about EUR 200 million of 2024 revenue and more than 2,500 employees, suggesting real commercial and operating heft.", "Audited filings or lender materials that materially undercut those scale claims would reduce confidence."]
      - [Thesis, "Acquisitions across Franka, idealworks, and thyssenkrupp Automation Engineering create a broader automation stack and larger industrial footprint.", "Poor integration KPIs, customer attrition, or delayed regulatory closing would turn breadth into a discount factor."]
      - [Anti-thesis, "The current priced valuation is still not public: the acquisition price was undisclosed, Parsers.vc hides the underlying valuation details behind sign-up prompts, and later round talk is described as negotiation rather than closure.", "A signed round price, credible secondary mark, or lender-grade valuation memo would directly improve underwriteability."]
      - [Anti-thesis, "Public metrics do not reconcile cleanly: company statements describe group-scale revenue and staffing, while Wikipedia reports much smaller 2024 entity-level figures for Agile Robots SE.", "A legal-entity bridge from group results to the financed issuer would remove scope ambiguity."]
      - [Anti-thesis, "Public sources still do not disclose gross margin, burn, runway, preference stack, or customer concentration, so expected returns cannot be modeled with precision.", "Audited financials, cap-table terms, and retention/concentration disclosures would narrow the risk discount."]
    notes: Rows separate upside arguments from the specific diligence items required to convert them into an investable entry case.
    claimRefs: [CV001, CV003, CV005, CV008, CV009, CV010, CV013, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Audited 2025-2026 revenue supports the company's higher-scale narrative; thyssenkrupp integration closes cleanly; a current financing price is not far above what the improved scale can justify.", "A premium to the 2021 >US$1 billion benchmark is only acceptable if audited growth, margin path, and integration evidence all validate the step-up.", "Execution strain from acquisitions, delayed synergies, or price inflation beyond evidence.", "Signed financing with clean terms, audited statements, and disclosed integration KPIs."]
      - [Base, "The company remains strategically credible, but price, cap-table terms, and economics remain partially private.", "Wait or participate only with downside protection around the last disclosed unicorn anchor rather than paying for narrative expansion alone.", "Unknown dilution, hidden preferences, and mixed entity-versus-group reporting.", "Price discovery remains opaque and diligence still depends on management materials."]
      - [Bear, "A new round or secondary mark clears above historical benchmarks without audited evidence on margins, burn, or customer quality, or recent integrations fail to prove value creation.", "Avoid underwriting at the offered price; re-open only after a materially lower entry point or much stronger disclosure.", "Overvaluation, multiple compression, post-acquisition underperformance, and structure risk.", "Rumored financing remains unclosed, company statements stay unaudited, and diligence gaps persist."]
    notes: Scenario bands are intentionally qualitative because the assigned pool does not contain a current priced round, audited economics, or term-sheet detail.
    claimRefs: [CV001, CV003, CV009, CV010, CV014, CV015]
