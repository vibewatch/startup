    - type: missing-source
      severity: material
      topic: current-priced-round
      missingEvidence: A closed 2026 financing price, credible secondary-market mark, or lender-grade valuation memo after the 2021 unicorn round.
      whyItMatters: Without a current entry price, the recommendation cannot move from research-more to invest on public evidence alone.
      diligencePath: Request the latest financing deck, signed term sheet, or independent secondary pricing evidence from management or major investors.
      relatedQuestionRefs: [QV001]
    - type: private-evidence-only
      severity: material
      topic: preference-stack
      missingEvidence: Cap-table, board-control, liquidation-preference, and anti-dilution details for the currently issued security.
      whyItMatters: Structure can erase headline valuation upside even if the operating business is attractive.
      diligencePath: Review the current cap table, shareholder agreement, and any side-letter terms under NDA.
      relatedQuestionRefs: [QV005]
    - type: conflicting-data
      severity: material
      topic: entity-vs-group-scope
      missingEvidence: A bridge that reconciles group-level revenue and staffing claims with the legal entity investors would actually own.
      whyItMatters: Investors price the financed issuer, so entity-versus-group ambiguity can distort both valuation and risk.
      diligencePath: Obtain audited entity financials plus a consolidation bridge for subsidiaries, acquisitions, and internal transfers.
      relatedQuestionRefs: [QV003]
    - type: missing-source
      severity: material
      topic: post-acquisition-integration
      missingEvidence: Integration KPIs, retained customer programs, plant utilization, and synergy evidence for Franka, idealworks, and thyssenkrupp Automation Engineering.
      whyItMatters: Recent scale expansion is partly inorganic, so valuation upside depends on execution rather than deal announcements alone.
      diligencePath: Review post-close integration dashboards, segment gross margin trends, and customer retention by acquired business.
