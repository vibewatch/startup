    rows:
      - [Flexible Intelligent Platform (FIP), Industrial line owners and system integrators, Publicly documented platform, "Combines robot operation platform, modular conveyor belt, feeding system, and Agile Core skill uploads", "Need live references for deployed lines, cycle-time gains, and integration effort"]
      - [Diana and Thor robot-arm families, Manufacturing engineers and automation teams, Publicly documented product families, "Torque sensing, force control, collision detection, and graphical programming for precision assembly through palletizing", "Need shipped-unit counts, yield deltas, and field reliability by model"]
      - [Tekken D gripper and VT10-G tactile sensor, Manipulation and end-effector engineers, Publicly documented accessories, "Adds force feedback and tactile perception to grasping workflows", "Need proof of customer adoption beyond demo use"]
      - ["H10-W, Zeus 3, and mobile welding systems", "Research, inspection, and industrial operations users", Publicly documented adjacent systems, "Extends the stack into mobile manipulation, inspection, and process automation", "Need commercialization status and revenue contribution by system"]
      - ["Franka Robotics, idealworks, BÄR Automation, and Krause Automation assets", Enterprise manufacturing programs and OEM plants, Acquired portfolio extensions, "Broadens from robot hardware into mobile robotics, automation engineering, and plant integration", "Need post-acquisition integration KPIs and product rationalization roadmap"]
    notes: >-
      Compiled from retained official product and company pages plus independent acquisition coverage; maturity labels are public-surface observations, not audited shipment or revenue evidence.
    claimRefs: [CE003, CE004, CE005, CE006, CE007, CE008]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Agile Robots solution
      - Measurable benefit
      - Limitation
    rows:
      - [Electronics insertion and delicate assembly, "Manual or rigidly programmed cell setup for precise component placement", "Diana 7 force-controlled arm", "Official materials claim responsive force control for complex, sensitive tasks", "No public yield, scrap, or downtime figures"]
      - [Light assembly and loading / unloading, "Standalone robots or manual stations that need quick reconfiguration", "Thor family with graphical programming and collision detection", "Public documentation emphasizes quick deployment across multiple scenarios", "No public evidence on programming time or operator training burden"]
      - [Flexible production-line changeover, "Traditional custom automation with longer engineering change cycles", "FIP plus Agile Core skill uploads and layout changes", "Company claims significantly shorter deployment time and lower integration difficulty", "No public benchmarking against rival integrators"]
      - ["Inspection, welding, and remote operations", "Human inspection rounds or specialized automation cells", "Zeus 3 inspection AMR and mobile welding robot systems", "Product pages describe remote monitoring, early warning, and trajectory optimization", "No public uptime, safety-incident, or maintenance statistics"]
    notes: >-
      Benefits are qualitative because the retained pool did not provide audited throughput, defect-rate, or ROI metrics; null quantitative detail should be treated as a diligence ask rather than a hidden estimate.
    claimRefs: [CE003, CE004, CE005, CE006, CE007]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - [Agile Core and FIP software layer, "Uploads skills, programs tasks, and adapts production-line layouts", "Requires continued software maturity and integration tooling", "Public materials do not expose APIs, release cadence, or security architecture"]
      - [Torque-sensed robot arms, "Provide precision manipulation with force control and collision detection", "Depends on sensor calibration, control software, and mechanical reliability", "No public field-failure, MTBF, or maintenance disclosure"]
      - ["Vision, tactile, and task-specific peripherals", "Support grasping, welding, inspection, and environment sensing", "Depends on sensor fusion, model performance, and application engineering", "No public accuracy or false-positive metrics for inspection or tactile systems"]
      - [Acquired implementation and plant-integration assets, "Extend delivery from robot cells into full manufacturing systems", "Depends on successful integration of Franka, idealworks, BÄR, and Krause capabilities", "Post-acquisition roadmap, SKU overlap, and services margin profile remain opaque"]
    notes: >-
      This table focuses on the documented operating model and its dependencies; the retained evidence pool did not include public architecture diagrams, security controls, or support-operating metrics detailed enough for deeper decomposition.
    claimRefs: [CE004, CE007, CE008, CE010, CE011, CE014]
figures:
  - id: FE001
    title: Product architecture and delivery stack
    type: stack
    summary: Agile Robots' stack spans customer workflows, robot systems, control software, and acquired implementation capacity.
    data:
      layers:
        - label: Customer workflows
          detail: Precision assembly, loading and unloading, welding, inspection, and training workflows are the recurring public use cases.
        - label: Application systems
          detail: FIP, welding cells, Zeus 3 inspection AMR, and H10-W package robot hardware into workflow-specific systems.
        - label: Robot platforms
          detail: Diana and Thor families provide the core force-controlled arm layer across light to heavier industrial tasks.
        - label: End effectors and sensing
          detail: Tekken D grippers and VT10-G tactile sensing extend manipulation accuracy and feedback.
        - label: Control and orchestration
          detail: Agile Core and AgileAI are described as the software layer for skills, natural-language programming, and coordination.
        - label: Delivery and integration
          detail: Franka, idealworks, BÄR, and Krause assets extend the company into mobile robotics, automation engineering, and plant integration.
    claimRefs: [CE003, CE007, CE008, CE011, CE012]
callouts:
  - calloutType: strength
    title: Breadth now extends beyond a single cobot line
    body: >-
      The retained evidence supports a broader platform narrative than a single-arm vendor story: official pages list multiple
      robot families, peripherals, and systems, while independent sources show that acquisitions are adding mobile robotics and plant integration.
    claimRefs: [CE006, CE007, CE008]
  - calloutType: risk
    title: Public software-assurance evidence is thinner than hardware breadth
    body: >-
      The stack looks technically ambitious, but the retained public materials still do not show enough about cybersecurity,
      uptime, support operations, or external developer tooling to underwrite enterprise software quality with confidence.
    claimRefs: [CE012, CE014]
