  evidenceGaps:
    - type: missing-source
      severity: material
      topic: cybersecurity-and-privacy
      missingEvidence: Public security architecture, cybersecurity certification, privacy controls, and incident-handling documentation for Agile Core and connected deployments.
      whyItMatters: Enterprise buyers need proof that the software and connected automation stack can be operated securely in production environments.
      diligencePath: Request security white papers, certification records, architecture diagrams, and customer security-review outcomes from the company.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: material
      topic: deployment-reliability
      missingEvidence: Public uptime, support-coverage, rollout-time, maintenance, and field-reliability metrics by product line or customer deployment.
      whyItMatters: Without operating metrics, diligence cannot distinguish a broad catalog from a repeatable implementation business.
      diligencePath: Request deployment KPIs, SLA commitments, MTBF or service logs, and post-go-live support statistics by major product family.
      relatedQuestionRefs: [QE004, QE007]
    - type: missing-source
      severity: minor
      topic: public-developer-surface
      missingEvidence: Public repositories, SDK documentation, package releases, forum traffic, or other practitioner-community metrics tied to Agile Core.
      whyItMatters: The current developer signal is limited to an employee publication, which is too thin to underwrite ecosystem depth.
      diligencePath: Ask for public SDK docs, repo history, release notes, integrator documentation, or usage telemetry for external developers.
      relatedQuestionRefs: [QE006]
