schemaVersion: report-v2
artifact: product-tech
slug: agile-robots-ag
runDate: 2026-10-17
company:
  name: Agile Robots AG
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Agile Robots presents itself as a full-stack industrial automation platform rather than a single cobot SKU,
    combining torque-sensed robot arms, end effectors, mobile systems, Agile Core software, and acquired plant-integration assets.
    Public materials support breadth and manufacturing reach, but they leave real gaps around cybersecurity, uptime, and the depth of the external developer ecosystem.
sections:
  - id: product-scope
    title: Product scope and workflow fit
    body: >-
      The documented portfolio spans several layers of an industrial automation workflow rather than a single robot family.
      Official materials describe a modular production platform, multiple arm families, tactile and gripping accessories,
      mobile systems, and training hardware, while third-party profiles frame the company as a DLR-derived force-control
      specialist that has expanded into a broader automation stack. The practical workflow focus is assembly, insertion,
      loading and unloading, palletizing, welding, inspection, and training use cases where force sensing, collision detection,
      and faster line changeovers matter more than generic robot throughput claims.
    claimRefs: [CE001, CE003, CE004, CE005, CE006, CE007, CE015]
    tableRefs: [TE001, TE002]
  - id: operating-stack
    title: Operating stack and delivery model
    body: >-
      The strongest public evidence for the software layer is the combination of Flexible Intelligent Platform documentation,
      third-party descriptions of AgileCore, and a public AI R&D post about natural-language programming.
      Together they point to an operating model in which Agile Robots controls the robot, conveyor, feeding, sensing,
      and skill-upload layers while pushing toward easier programming and cell reconfiguration. That is reinforced by a
      geographically distributed footprint across Munich, Kaufbeuren, Gemmingen, China, India, and Palo Alto, suggesting
      the company expects to deliver, integrate, and support systems internationally rather than only ship components.
    claimRefs: [CE002, CE004, CE007, CE010, CE011, CE012]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-maturity
    title: Differentiation and maturity
    body: >-
      Differentiation is evidenced less by consumer-style software distribution and more by a combination of torque-sensitive
      hardware, vertically integrated control software, and acquired implementation capacity. The DLR lineage matters because
      third-party sources consistently link the company back to force-controlled robotics research, while official materials
      show that the company has extended that base with its own product families and several acquisitions. The 2026
      thyssenkrupp Automation Engineering transaction is especially important for this chapter because it shifts Agile Robots
      further toward end-to-end automation delivery and plant integration instead of only selling robots or subassemblies.
    claimRefs: [CE008, CE009, CE010, CE013, CE015, CE016]
  - id: controls-and-open-risks
    title: Controls, quality signals, and open technical risks
    body: >-
      Public trust and quality signals exist, but they are uneven. Product pages repeatedly emphasize collision detection,
      torque sensing, and force control, and the about-us timeline says the management system was certified to ISO 9001 in 2020.
      That gives some evidence of product-safety and manufacturing-discipline intent. What remains thin is the software
      assurance layer: the retained materials do not document cybersecurity certifications, privacy controls, uptime or SLA
      disclosures, or a public API and release ecosystem comparable to enterprise software vendors. For diligence, the main
      technical risk is not whether Agile Robots has interesting hardware, but how repeatable, secure, and supportable the
      full stack is once deployed across customer production environments.
    claimRefs: [CE005, CE012, CE013, CE014]
tables:
