schemaVersion: report-v2
artifact: customers
slug: agile-robots-ag
runDate: 2026-10-17
company:
  name: Agile Robots AG
chapter:
  number: 6
  title: Customers
  summary: >-
    Agile Robots shows credible multi-vertical commercial intent and some
    production-use proof, especially in precision assembly and channel
    expansion through acquisitions, but public customer evidence is still
    dominated by company-issued use-case claims rather than named accounts or
    disclosed retention data. The strongest signals are early electronics
    deployment, multi-site manufacturing footprint, and BÄR's inherited
    integrator customer base; the weakest areas are customer count, renewal
    quality, and concentration.
sections:
  - id: customer-footprint
    title: Customer footprint and buyer mix
    body: >-
      Agile Robots appears to sell into multiple buyer environments rather than
      a single robot niche. Across the assigned sources, the company and
      third-party profiles repeatedly point to automotive, electronics
      manufacturing, healthcare and adjacent service workflows, with the
      Chinese catalogue adding inspection, training and mobile-robot
      scenarios. That breadth matters because it suggests the commercial story
      is not only a single cobot SKU sale but a broader automation-stack pitch
      spanning robot arms, software, special-purpose systems and acquired
      channels. The trade-off is that most public evidence still describes
      targetable segments and use cases rather than disclosed account counts or
      revenue mix by segment today.
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU007
      - CU010
    tableRefs:
      - TU001
  - id: adoption-proof
    title: Adoption proof is real but mostly company-described
    body: >-
      The assigned pool does contain concrete adoption signals: Agile Robots
      says Diana 7 was used early in electronics installation, while the BÄR
      acquisition added an existing automation integrator with an international
      customer base. Its 2020 financing release separately frames
      manufacturing, logistics and healthcare as addressable settings rather
      than quantifying adoption. Together, the first two points make it hard to
      dismiss Agile Robots as purely pre-revenue R&D theatre.
      Even so, the public proof remains uneven. Named end customers are
      scarce, many references are to sectors or unnamed enterprises, and the
      strongest scale claims still come from company materials rather than
      independent customer disclosures or procurement records.
    claimRefs:
      - CU002
      - CU005
      - CU006
      - CU011
      - CU013
      - CU014
    tableRefs:
      - TU002
      - TU003
    figureRefs:
      - FU001
  - id: durability-and-concentration
    title: Durability, expansion and concentration remain diligence gaps
    body: >-
      The commercial upside is plausible: Agile Robots can now approach buyers
      through direct robot sales, integrator-led automation projects and
      portfolio cross-sell from Franka, idealworks and BÄR. What is missing is
      the evidence that separates a broad funnel from durable economics. The
      reviewed sources do not disclose customer count, NRR, GRR, churn,
      contract length, top-customer exposure or revenue split by direct versus
      acquired channels. Independent commentary also warns that some scale
      figures are management statements rather than audited customer-quality
      evidence, so the customer chapter should be read as evidence of
      addressable traction and channel breadth, not proof of repeatable
      retention.
    claimRefs:
      - CU008
      - CU009
      - CU011
      - CU012
    calloutRefs: []
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Core use case
      - Public scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Precision-assembly manufacturers
        - Factory automation buyers; manufacturing engineers and line operators; payer is the OEM or tier supplier
        - Sensitive assembly plus loading and unloading in electronics production
        - Diana 7 is described as used from launch for installing components in smartphones, tablets and PCs; the 2020 release frames automotive and electronics as intended automation markets
        - Likely the earliest direct monetization wedge for core Agile Robots hardware
        - No named accounts, installed-base count or segment revenue
      - - Automotive and intralogistics operators
        - Plant engineering and logistics teams; system-integration users; payer is the industrial group
        - Robotics ecosystems, special-purpose automation and intralogistics adjacency
        - About-us timeline says idealworks and BÄR joined to drive automotive production; BÄR brought an international customer base
        - Strategic because acquisitions widen route-to-market and aftermarket reach
        - No disclosure of revenue concentration, OEM dependence or BMW-related exposure
      - - Healthcare and medtech institutions
        - Hospitals, medtech OEMs and clinical-operations users; payer likely provider or device company
        - Medical robotics, teleoperated sampling and hospital-adjacent automation
        - Nature partner content describes medical applications and teleoperated swab work; the 2020 release frames healthcare as a target setting
        - Important adjacency because it broadens proof beyond factory automation
        - Public proof is mostly company-described and customer names are not disclosed
      - - Research, training, inspection and service operators
        - Labs, vocational training programs and facilities operators; payer varies by deployment
        - Training platforms, voice-command service robots and switch-cabinet inspection
        - Chinese catalogue lists training, H10-W interaction and Zeus 3 inspection products
        - Expands TAM and creates non-manufacturing proof surfaces
        - No evidence on repeat purchase, usage intensity or pricing
    notes: Public scale signals mix official use-case descriptions, independent profiles and acquired-channel evidence; cells highlight commercial surfaces, not comparable booked revenue.
    claimRefs:
      - CU001
      - CU003
      - CU006
      - CU010
      - CU013
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Precision-assembly production use
        - Diana 7 used to install electronic components in smartphones, tablets and PCs
        - "2019"
        - Agile Robots About Us
        - Medium
        - Earliest concrete sign that the flagship arm moved beyond lab/demo status
        - No customer name, site count, deployment duration or revenue
      - - Multi-vertical demand framing
        - Manufacturing, logistics and healthcare cited as settings for cost-effective robotic solutions
        - "2020-04-06"
        - Agile Robots 8-figure funding release
        - Medium
        - Supports target-market breadth but does not establish deployment or commercial scale
        - No shipped units, active accounts, installed robots, adoption period or renewal data
      - - Channel and installed-base expansion
        - BÄR acquisition adds a 140-plus employee system integrator with an international customer base
        - "2023-09-12"
        - Agile Robots BÄR acquisition release
        - Medium
        - Improves route-to-market and potential cross-sell into existing industrial accounts
        - No acquired revenue, margin, retention or conversion rate
      - - Current delivery footprint
        - Production sites in Europe, America and Asia; over 15 sites worldwide
        - Current by 2026 access date
        - Agile Robots About Us
        - Medium
        - Supports ability to serve multinational customers locally
        - No active-customer count, utilization rate or regional revenue split
    notes: This table records the best public adoption signals in the assigned pool; most are qualitative or company-issued, so missing denominators remain part of the judgment.
    claimRefs:
      - CU002
      - CU004
      - CU005
      - CU006
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / proof surface
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - BÄR Automation inherited customer base
        - Industrial manufacturers served through a system integrator
        - Special-purpose machine construction, robotics and mechatronics projects
        - Production installed base inherited through acquisition rather than an original Agile Robots logo
        - Gives Agile Robots access to an existing international customer base and services layer
        - Not a named end-customer roster; no disclosed retention, revenue or cross-sell conversion
      - - Unnamed consumer-electronics manufacturers
        - Precision-assembly buyers
        - Electronics component installation plus broader consumer-electronics manufacturing scenarios
        - Production use claimed
        - Strongest direct proof that core hardware was deployed on real factory tasks
        - End customers are unnamed and public materials omit scale and commercial outcomes
      - - Unnamed hospitals and medtech partners
        - Healthcare and clinical robotics
        - Hospital cooperation, teleoperated swab collection and medical robot applications
        - Mixed proof; some described as applications, some as development or cooperation
        - Shows expansion beyond factory automation into healthcare workflows
        - No hospital names, renewal data, contract terms or proof that pilots converted to durable revenue
    notes: Publicly named or specifically described customer evidence in the assigned pool is partial; acquisitions and unnamed enterprise references are included because the pool does not disclose a fuller direct customer list.
    enumerationScope:
      coverage: partial
      basis: Publicly named or specifically described customer evidence in the assigned pool as of 2026-10-17, including acquired-channel proof where direct end-customer disclosure is absent.
    claimRefs:
      - CU002
      - CU005
      - CU006
      - CU011
      - CU013
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Public evidence points to a journey that starts with precision-assembly use cases, broadens through multi-vertical marketing claims, and expands through acquired channels, but the loop from deployment to renewal is still not publicly quantified.
    data:
      items:
        - label: Precision-assembly entry point
          detail: Diana 7 is described as used from launch for electronics component installation work.
          touchpoints:
            - Install electronic components in smartphones, tablets, PCs and more
            - Sensitive force control and collision-aware operation
        - label: Multi-vertical demand framing
          detail: Official funding material frames manufacturing, logistics and healthcare as target settings without deployment counts.
          touchpoints:
            - Manufacturing
            - Logistics
            - Healthcare
        - label: Global delivery footprint
          detail: The company presents itself as able to serve customers from production sites across Europe, America and Asia.
          touchpoints:
            - Over 15 sites worldwide
            - Regional production and R&D footprint
        - label: Integrator-led expansion
          detail: BÄR adds system-integration capabilities and an inherited international customer base.
          touchpoints:
            - Special-purpose machine construction
            - Industrial automation services
        - label: Portfolio cross-sell surface
          detail: idealworks, Franka and BÄR broaden the buyer universe beyond a single robot-arm SKU.
          touchpoints:
            - Automotive production
            - Intralogistics
            - Research and advanced robotics users
        - label: Renewal evidence gap
          detail: Public sources stop short of disclosing retention, churn, contract duration or customer concentration.
          touchpoints:
            - No public NRR or GRR
            - No top-customer breakdown
    approximationNotes: The sequence is an evidence-backed commercial path synthesized from official and independent sources, not a company-published funnel with disclosed conversion rates.
    claimRefs:
      - CU002
      - CU004
      - CU005
      - CU006
      - CU012
      - CU014
callouts:
  - calloutType: risk
    title: Durability evidence lags deployment evidence
    body: >-
      Agile Robots has enough public proof to establish real deployment
      surfaces, but not enough to prove renewal quality or concentration
      resilience. Investors should treat current customer evidence as traction
      proof, not as a substitute for cohort, retention and top-account
      diligence.
    claimRefs:
      - CU008
      - CU009
      - CU012
