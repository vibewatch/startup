      - ["AgileCore / software layer", "Software embedded in broader automation offer", "Unknown public unit", "Commercial role public; standalone monetization not disclosed", "Could improve margins, but no public attach-rate or pricing evidence", "Provide standalone software pricing, attach rate, and renewal behavior"]
      - ["Integration and one-stop solutions", "Deployment, configuration, and system integration around hardware", "Per project", "Operationally evident; no public segment revenue", "Material to delivery economics because the company presents itself as full-service", "Provide services mix, delivery hours, warranty burden, and contribution margin"]
      - ["Acquired portfolio cross-sell", "Revenue contribution from idealworks, BÄR, Franka, audEERING, XNG", "By subsidiary / product line", "Portfolio breadth public; revenue contribution not disclosed", "Potentially meaningful but impossible to size from public evidence", "Provide subsidiary revenue, intercompany mix, and integration milestones"]
