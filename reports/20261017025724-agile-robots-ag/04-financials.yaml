company:
  name: "Agile Robots AG"
chapter:
  number: 4
  title: "Financials"
  summary: "Agile Robots has real scale and a capital-intensive hardware footprint, but the public financial picture is still stitched together from old round snapshots, entity-level accounts, and unaudited management statements. The retained evidence supports product-led revenue and meaningful manufacturing depth, while still leaving realized pricing, margins, cash runway, and go-to-market efficiency unavailable for underwriting."
sections:
  - id: "revenue-model-and-public-traction"
    title: "Revenue model and public traction"
    body: |
      The retained public evidence points to a product-led B2B revenue model rather than a pure-software subscription profile. Multiples categorizes Agile Robots as B2B with "Product sales" as the revenue model, while third-party and company-authored descriptions show a bundled offer that combines robot hardware, AgileCore software, and deployment-level automation work across manufacturing, logistics, and adjacent industrial settings. Public traction is real, but the figures are not directly comparable: Multiples records $230 million of revenue at the April 2022 round snapshot, German Wikipedia cites €103.4 million of 2024 revenue for Agile Robots SE, and Startuprad reports about €300 million of 2025 revenue from a chief executive statement that it explicitly says is not independently audited. That combination is enough to confirm commercial scale, but not enough to reconcile group revenue mix, entity boundaries, or revenue-recognition quality.
    claimRefs: ["CI001", "CI002", "CI006", "CI008", "CI009", "CI011", "CI015"]
    tableRefs: ["TI001", "TI002"]
    figureRefs: ["FI001"]
  - id: "cost-structure-and-delivery-footprint"
    title: "Cost structure and delivery footprint"
    body: |
      Agile Robots looks financially like a hardware-and-integration platform with software leverage, not like a lightweight SaaS vendor. The official About page says the company manufactures automation solutions and industrial robots at more than 15 sites worldwide, and German Wikipedia describes a full-service model in which hardware and software are largely developed and manufactured in-house. The footprint spans production in China, Kaufbeuren, and Chennai, while the portfolio has been expanded through acquisitions such as idealworks, BÄR Automation, Franka Robotics, audEERING, and XNG Automation. Those facts support a margin profile shaped by factories, component sourcing, field deployment, system integration, and post-acquisition integration costs; they do not support any public conclusion on gross margin, because the retained sources do not disclose it.
    claimRefs: ["CI007", "CI010", "CI011", "CI012", "CI016"]
    tableRefs: ["TI003"]
  - id: "capital-base-and-financing-dependency"
    title: "Capital base and financing dependency"
    body: |
      Agile Robots has raised substantial external capital, but the public record on current capital adequacy is stale and incomplete. Multiples reports $270 million raised across three completed rounds, and independent/company-retained sources corroborate a $220 million Series C in September 2021 at a valuation above $1 billion; the company profile on Munich Startup also still frames that round as the step that made Agile Robots "the world's first robotics unicorn." The latest priced valuation marker in the retained corpus is still April 2022 at $1 billion, while Startuprad cautions that more recent figures in circulation such as about €300 million of 2025 revenue, cumulative funding of about $1.5 billion, or reports of a possible further $800 million round are either unaudited, unconfirmed, or still only negotiations. Without disclosed cash, burn, debt, or capex commitments, the evidence is strong enough to show financing dependence and scale, but not enough to prove present runway.
    claimRefs: ["CI003", "CI004", "CI006", "CI009", "CI014", "CI016"]
  - id: "underwriting-verdict-and-diligence-blockers"
    title: "Underwriting verdict and diligence blockers"
    body: |
      The financial verdict is mixed. Public evidence supports a sizeable robotics platform with real manufacturing assets, broad delivery scope, and repeated access to outside capital. It does not support a clean underwriting model. The strongest current-period number in the retained corpus is the €103.4 million 2024 revenue reference for Agile Robots SE, but that sits alongside a separate 2025 company statement of about €300 million revenue with no audited bridge between the entity-level accounts and the broader group narrative. Just as importantly, the retained sources do not publish list pricing, realized pricing, CAC, payback, gross margin, cash on hand, or runway. For diligence, the next step is not another public-source search; it is management evidence on revenue mix, contract terms, service-delivery economics, and liquidity.
    claimRefs: ["CI008", "CI009", "CI014", "CI015", "CI016"]
