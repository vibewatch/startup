      - ["Integration / deployment services", null, "Service monetization implied by full-service model but not disclosed", "Unknown installation fees, warranty economics, and field-support structure", "German Wikipedia; Agile Robots About page"]
    notes: "Null price cells mean no retained public source disclosed list price, realized ASP, contract term, or discount policy."
    enumerationScope:
      coverage: "partial"
      basis: "Public pricing surface review across retained financial and official company sources as of the 2026-10-17 run date."
