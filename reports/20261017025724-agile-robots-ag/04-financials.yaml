  - id: "TI003"
    title: "Unit economics table"
    columns: ["Metric", "Value / public proxy", "Confidence", "Why it matters", "Diligence ask"]
    rows:
      - ["Gross margin", null, "Low", "Needed to distinguish hardware, software, and services quality", "Provide consolidated and segment gross margin with warranty reserve treatment"]
      - ["CAC / payback", null, "Low", "Needed to underwrite go-to-market efficiency for complex industrial sales", "Provide sales-cycle length, CAC, payback, win rate, and channel mix"]
      - ["Cash on hand / runway", null, "Low", "Needed to judge financing dependency and next-round timing", "Provide current cash, monthly burn, debt, covenants, and minimum liquidity targets"]
      - ["Delivery-capacity proxy", "Over 1,700 employees worldwide in March 2024; about 387 employees and €103.4M revenue at the SE entity in 2024", "Medium", "Shows the platform has scale but does not resolve group economics", "Reconcile entity-level headcount and revenue with group-level operating segments"]
    notes: "Null values reflect missing public disclosure in retained sources, not zero economics; the one populated proxy mixes group and entity-level snapshots and therefore needs management reconciliation."
    enumerationScope:
      coverage: "partial"
      basis: "Public unit-economics proxy review using retained official, analyst, and independent sources available to this worker."
    claimRefs: ["CI007", "CI008", "CI009", "CI016"]
