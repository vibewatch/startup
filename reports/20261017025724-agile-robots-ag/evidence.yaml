evidenceGaps:
  - type: missing-source
    severity: material
    topic: leadership-governance
    missingEvidence: >-
      A current board, executive, and committee roster tied clearly to the AG and any broader operating-group or SE
      structure.
    whyItMatters: >-
      Founder quality is visible, but control, reporting lines, and formal governance cannot be judged from the assigned
      public sources alone.
    diligencePath: >-
      Request the latest governance chart, board observer list, and legal-entity map covering AG, SE references, and key
      subsidiaries.
    relatedQuestionRefs:
      - QO007
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: >-
      A current priced round, secondary transaction, or board-approved valuation reference after the 2021 unicorn
      benchmark.
    whyItMatters: >-
      The existing public valuation evidence is stale relative to the company's acquisition pace and footprint
      expansion.
    diligencePath: >-
      Request the latest financing memo, cap-table snapshot, and any 2024-2026 secondary or strategic transaction
      references.
    relatedQuestionRefs:
      - QO005
      - QO007
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-scale
    missingEvidence: >-
      A management bridge reconciling AG legal-entity reporting, SE references, and group-wide revenue and headcount
      metrics.
    whyItMatters: Without a perimeter bridge, public scale metrics cannot support clean valuation, burn, or margin judgments.
    diligencePath: >-
      Request the latest legal-entity chart plus audited or board-report figures for group revenue, gross margin, opex,
      cash, and headcount.
    relatedQuestionRefs:
      - QO004
      - QO007
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: customers
    missingEvidence: Current customer-count, concentration, and pricing evidence tied to named deployments or disclosed contracts.
    whyItMatters: >-
      Customer breadth and concentration determine how much of Agile Robots' scale comes from repeatable product demand
      versus project-heavy deployments.
    diligencePath: >-
      Request a customer KPI pack with active logos, revenue concentration, renewal behavior, and product-versus-project
      mix.
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: public-market-sizing
    missingEvidence: >-
      Independent 2025-2026 market-size data for force-controlled industrial and medical robotics by geography and
      workflow segment.
    whyItMatters: >-
      Without segment-specific market datasets, TAM claims would be too broad to support valuation or market-share
      assumptions.
    diligencePath: >-
      Obtain analyst or trade-association datasets for industrial robotics, medical robotics, and factory automation,
      then map only the slices matching Agile Robots' embodied workflows.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-owner
    missingEvidence: Buyer-level pricing, payback period, budget owner, and contract structure by vertical.
    whyItMatters: >-
      Adoption speed and repeatability depend on whether spend comes from plant capex, operations budgets, or bespoke
      systems-integration projects.
    diligencePath: >-
      Request customer case studies with quoted ROI and commercial terms or interview reference customers in automotive,
      electronics, and medical deployments.
    relatedQuestionRefs:
      - QM004
      - QM008
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: public-scale-conflict
    missingEvidence: >-
      Audited reconciliation between third-party revenue or employee estimates and verified company financial
      disclosures.
    whyItMatters: Conflicting public scale numbers can distort market-share and operating-leverage assumptions.
    diligencePath: >-
      Verify 2024-2026 audited accounts or management-provided KPI packs before using any single public revenue estimate
      in valuation work.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Public price lists, contract structures, implementation fees, and discounting behavior for Agile and the named
      peer classes.
    whyItMatters: >-
      Without comparable commercial terms, it is hard to test whether Agile wins on cost, bundling, or only on narrative
      breadth.
    diligencePath: Request customer contracts, quote examples, and sales-compensation or discount policy evidence from management.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: win-rate-and-displacement
    missingEvidence: >-
      Named competitive win/loss data, customer migration examples, and third-party proof of why buyers chose Agile over
      incumbents or specialists.
    whyItMatters: Moat durability depends on repeated competitive wins, not just capital raised or product breadth claims.
    diligencePath: Request customer references, lost-deal analysis, and independent procurement or case-study evidence by competitor.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: material
    topic: acquisition-integration
    missingEvidence: >-
      Post-acquisition revenue mix, cross-sell metrics, product roadmap integration milestones, and margin impact for
      Franka, idealworks, and thyssenkrupp assets.
    whyItMatters: >-
      The platform-breadth thesis relies on these deals creating real switching costs instead of organizational
      complexity.
    diligencePath: Ask management for integration KPIs, acquired-book retention, and cross-sell attach rates by product family.
    relatedQuestionRefs:
      - QP005
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Current list pricing, realized selling prices, contract length, maintenance terms, and software attach rates by
      product family.
    whyItMatters: >-
      Without pricing realization, the chapter can describe the monetization structure but cannot judge revenue quality
      or discount pressure.
    diligencePath: Request current price books, three recent signed customer contracts, and realized-ASP waterfalls by product line.
    relatedQuestionRefs:
      - QI001
      - QI008
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-opacity
    missingEvidence: >-
      CAC, sales-cycle length, gross margin, warranty reserve behavior, services gross margin, and deployment labor
      intensity.
    whyItMatters: >-
      These are the minimum inputs needed to underwrite whether hardware and integration growth translates into durable
      contribution profit.
    diligencePath: >-
      Request cohort-level CAC/payback, gross margin by segment, implementation hours, and warranty/returns data for the
      last eight quarters.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: public-revenue-bridge
    missingEvidence: A reconciled bridge from Agile Robots SE's 2024 accounts to any broader group-level 2025 revenue figure.
    whyItMatters: >-
      The public corpus mixes entity-level accounts, financing-round snapshots, and unaudited management statements that
      are not directly comparable.
    diligencePath: >-
      Request a legal-entity map plus audited 2024 and management 2025 revenue bridges by entity, geography, and
      business line.
    relatedQuestionRefs:
      - QI002
      - QI006
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, burn rate, debt facilities, covenant package, capex plan, and minimum-liquidity thresholds.
    whyItMatters: >-
      A company can be valuable and still be financing-dependent; without liquidity data there is no defensible runway
      or next-round view.
    diligencePath: Request the latest monthly cash bridge, debt schedule, capex budget, and board-approved operating plan.
    relatedQuestionRefs:
      - QI003
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: cybersecurity-and-privacy
    missingEvidence: >-
      Public security architecture, cybersecurity certification, privacy controls, and incident-handling documentation
      for Agile Core and connected deployments.
    whyItMatters: >-
      Enterprise buyers need proof that the software and connected automation stack can be operated securely in
      production environments.
    diligencePath: >-
      Request security white papers, certification records, architecture diagrams, and customer security-review outcomes
      from the company.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: deployment-reliability
    missingEvidence: >-
      Public uptime, support-coverage, rollout-time, maintenance, and field-reliability metrics by product line or
