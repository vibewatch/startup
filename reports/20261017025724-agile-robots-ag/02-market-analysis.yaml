        - null
        - Official deployment-footprint proxy
        - Medium
        - Indicates solved workflows and installed base, not market value
      - - Agile Robots Physical AI page
        - Current page
        - Global
        - 7 production sites and 2 R&D centers
        - null
        - Official operating-footprint proxy
        - Medium
        - Capacity lens only; it does not quantify demand or segment size
      - - Wikipedia summary citing 2024 annual accounts
