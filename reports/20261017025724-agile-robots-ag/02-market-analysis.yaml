    notes: >-
      No assigned source provides a supportable public TAM, SAM, or SOM estimate; this table preserves
      the best available operational and monetary lenses plus their limitations instead of overstating precision.
    claimRefs:
      - CM009
      - CM010
      - CM011
      - CM012
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Automotive and precision manufacturing
        - Plant automation and operations leaders
        - Manufacturing engineers and line operators
        - Corporate or plant automation budget
        - Precision assembly, handling, and adaptive production tasks
        - Not publicly disclosed; likely operations or transformation owner
        - Need for sensitivity, collision detection, and adaptation beyond fixed automation
      - - Consumer electronics and 3C production
        - Electronics manufacturers and contract manufacturers
        - Process engineers and operators
        - Production capex budget
        - Complex or high-sensitivity component installation
        - Not publicly disclosed
        - Higher throughput or accuracy in precision assembly
      - - Medical and clinical robotics
        - Hospitals, surgical-robot programs, and clinical automation teams
        - Clinicians and medical staff
        - Medical-equipment or automation budget
        - Sensing-intensive clinical or teleoperated procedures
        - Not publicly disclosed
        - Safety, precision, and reduced staff exposure in complex procedures
      - - Service, agriculture, hospitality, and retail adjacencies
        - Domain-specific automation programs
        - Frontline operators
        - Project-based automation budgets
        - Embodied automation outside core factory settings
        - Not publicly disclosed
        - Expansion once a workflow needs physical manipulation rather than software-only automation
    notes: >-
      Buyer and budget-owner fields remain partially inferred because assigned sources name use cases and
      users more clearly than procurement structures, contract values, or payback rules.
    claimRefs:
      - CM004
      - CM005
      - CM006
      - CM013
      - CM015
