        - label: Agile Robots
          x: 5
          y: 5
          tone: positive
          note: Full-stack hardware-plus-software positioning and acquisition-led breadth
        - label: Traditional industrial robots
          x: 2
          y: 2
          tone: risk
          note: Official sources position these as weaker in non-standardized and close-collaboration tasks
        - label: Incumbent automation suites
          x: 4
          y: 3
          tone: neutral
          note: Tracxn names ABB as a top peer; distribution breadth likely matters, while exact task performance is not benchmarked here
        - label: Warehouse / mobile automation specialists
          x: 3
          y: 2
          tone: neutral
          note: Geekplus-class specialists compete on narrower workflow depth rather than full-stack breadth
        - label: Humanoid / service robotics specialists
          x: 2
          y: 4
          tone: opportunity
          note: UBTECH-class peers represent an alternate robotics form factor with unclear industrial overlap
        - label: Internal build / systems integration
          x: 4
          y: 3
          tone: risk
          note: Custom fit can be high, but deployment proof and economics remain private
    approximationNotes: >-
      Scores are ordinal synthesis, not benchmarks. They are anchored to source-backed differentiation claims for Agile and to the peer classes explicitly surfaced in the assigned pool; unsupported direct comparisons remain approximate.
    claimRefs: [CP004, CP005, CP007, CP008, CP011, CP012]
callouts:
