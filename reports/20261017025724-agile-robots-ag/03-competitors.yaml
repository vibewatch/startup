  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-transparency
      missingEvidence: Public price lists, contract structures, implementation fees, and discounting behavior for Agile and the named peer classes.
      whyItMatters: Without comparable commercial terms, it is hard to test whether Agile wins on cost, bundling, or only on narrative breadth.
      diligencePath: Request customer contracts, quote examples, and sales-compensation or discount policy evidence from management.
      relatedQuestionRefs: [QP008]
      relatedTableRefs: [TP003]
    - type: missing-source
      severity: material
      topic: win-rate-and-displacement
      missingEvidence: Named competitive win/loss data, customer migration examples, and third-party proof of why buyers chose Agile over incumbents or specialists.
      whyItMatters: Moat durability depends on repeated competitive wins, not just capital raised or product breadth claims.
      diligencePath: Request customer references, lost-deal analysis, and independent procurement or case-study evidence by competitor.
      relatedQuestionRefs: [QP007]
    - type: private-evidence-only
      severity: material
      topic: acquisition-integration
      missingEvidence: Post-acquisition revenue mix, cross-sell metrics, product roadmap integration milestones, and margin impact for Franka, idealworks, and thyssenkrupp assets.
      whyItMatters: The platform-breadth thesis relies on these deals creating real switching costs instead of organizational complexity.
      diligencePath: Ask management for integration KPIs, acquired-book retention, and cross-sell attach rates by product family.
      relatedQuestionRefs: [QP005]
