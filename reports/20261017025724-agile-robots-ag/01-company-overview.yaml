callouts:
  - calloutType: "strength"
    title: "Real research pedigree and visible industrial scale"
    body: >-
      The strongest positive pattern in the assigned record is the combination of DLR-originated
      technical credibility, a broadening manufacturing footprint, and a sustained acquisition
      program that extends the platform beyond a single robot family.
    claimRefs: ["CO001", "CO004", "CO008", "CO014", "CO015"]
  - calloutType: "risk"
    title: "Scope opacity remains a core diligence risk"
    body: >-
      Public evidence in the assigned pool mixes group-wide operating claims with narrower
      legal-entity reporting, so headline figures on headcount, revenue, and valuation should not
      be treated as directly comparable without management reconciliation.
    claimRefs: ["CO009", "CO010", "CO016"]
