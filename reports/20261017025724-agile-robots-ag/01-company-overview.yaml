company:
  name: "Agile Robots AG"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Agile Robots presents as a DLR-rooted, AI-driven robotics platform with a widened global
    footprint, a 2021 unicorn funding benchmark, and an active 2023-2026 acquisition agenda.
    The strongest caveat in the assigned evidence is scope opacity: official materials describe a
    2,300+ employee global group while third-party public reporting visible in the pool only
    surfaces narrower legal-entity metrics, leaving current valuation, customer count, and
    financial quality unresolved.
sections:
  - id: "identity-and-scale"
    title: "Identity, headquarters, and operating footprint"
    body: >-
      Agile Robots traces its origin to a 2018 spin-off from the German Aerospace Center (DLR),
      founded by Zhaopeng Chen, Peter Meusel, and other DLR researchers. The company’s current
      positioning is broader than a single robot product: its own materials describe an AI-driven
      robotics and automation platform spanning hardware, software, and physical-AI systems for
      industrial and service use cases. The most current official location signal in the assigned
      pool is the June 2025 opening of a new global headquarters in Munich’s Sendling district,
      while the about-us page shows a wider operating footprint across Germany, the United States,
      China, and India. Scale claims are substantial but not perfectly comparable: the homepage
      cites 2,000+ R&D experts and the headquarters release cites more than 2,300 employees
      worldwide, whereas a later third-party Wikipedia summary reports much smaller 2024 employee
      counts for Agile Robots SE specifically. That makes the company clearly scaled, but not yet
      transparent enough to treat every workforce or revenue number as the same reporting perimeter.
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO007", "CO008", "CO009", "CO010"]
    tableRefs: ["TO001"]
  - id: "leadership-and-governance"
    title: "Founder bench, governance signals, and perimeter ambiguity"
    body: >-
      The assigned evidence supports founder-market fit more strongly than it supports current
      governance detail. Official sources consistently tie Agile Robots to Zhaopeng Chen’s DLR
      research background and pair him with co-founder Peter Meusel, another long-time robotics
      researcher with hardware and torque-sensing expertise. That origin story matters because it
      underpins the company’s product credibility and its positioning as a force-controlled,
      AI-enabled robotics platform. On the legal-entity side, the accessible Northdata page still
      lists Agile Robots AG in Munich under District Court HRB 241039 and describes a robotics
      corporate purpose, but it does not expose the current financial detail or cap-table data that
      would let an investor reconcile the public legal entity, the website’s broader operating
      footprint, and third-party references to Agile Robots SE. For diligence, that leaves clear
      key-person dependence around Chen and an unresolved governance question around current board
      control, reporting perimeter, and investor rights.
    claimRefs: ["CO001", "CO005", "CO006", "CO010", "CO016"]
    tableRefs: ["TO002", "TO003"]
  - id: "capital-formation-and-milestones"
    title: "Funding history and the milestone pattern behind today’s scale"
    body: >-
      Funding and milestone evidence shows a company that scaled quickly, but without current
      valuation transparency. The July 2019 pre-A announcement names Hillhouse, Sequoia, Tinavi,
      and Linear Venture after earlier seed and angel backing, and the Series C release says Agile
      Robots had raised more than US$130 million in 2020 and crossed a US$1 billion valuation
      benchmark. The official company timeline adds that SoftBank became the anchor investor in
      2021, then records a manufacturing expansion in Germany, multiple 2023 acquisitions
      (idealworks, BÄR Automation, and Franka Robotics), the 2025 Munich headquarters opening, the
      2025 audEERING acquisition, and a 2026 majority stake in India-based XNG Automation. That
      pattern supports a view of Agile Robots as an expansionary consolidator rather than a single
      product company, but the assigned pool still lacks current priced-round evidence, customer
      count disclosure, and portfolio-integration KPIs.
    claimRefs: ["CO003", "CO011", "CO012", "CO013", "CO014", "CO015"]
    figureRefs: ["FO001"]
