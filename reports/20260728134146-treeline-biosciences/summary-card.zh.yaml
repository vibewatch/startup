summary:
  headline: Treeline 把 Loxo 级别创始人、覆盖面很宽的多模态平台和备考口径 >$900M 现金放在一起，但完全没有人体概念验证；因此， 约 ~$2.5B 的隐含估值本质上是现金托底的期权，只有 2027 年临床数据能重新定价。
