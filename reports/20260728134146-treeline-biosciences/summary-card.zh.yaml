  topStrengths:
    - >-
      创始人与市场的匹配度极强——CEO Josh Bilenker 曾把 Loxo Oncology 做到三项 FDA 批准，并以约 $8B 卖给 Lilly；CSO Jeff Engelman 此前在 Novartis NIBR
      负责肿瘤业务。
    - 平台罕见地宽，且靠计算驱动，覆盖抑制剂、降解剂、TT-ADC；四个 Phase 1 项目分散推进，BCL6 降解剂有机会成为首个进临床的同类资产。
    - 财务火力少见——累计融资约 $1.2B，预期备考现金 >$900M，能把运营撑到 2029 年；还通过 Standard BioTools 反向并购取得 Nasdaq 上市路径。
  topRisks:
    - 任何项目都还没有人体疗效概念验证；肿瘤药从 Phase 1 走到批准的概率很低，按统计看，多数项目很可能在 2027 年读数前失败。
    - Revolution Medicines 的 pan-RAS 抑制剂已进入 Phase 3，临床领先数年，可能在 TLN-372 成熟前先定义 KRAS 市场。
    - 依赖项集中——两位创始人、从中国 Hengrui 引进的 EZH2 资产、以及仍取决于股东投票的合并；同时，公司在任何概念验证前已投入约 $1.2B。
  unresolvedGaps:
    - 审计财务、披露的烧钱速度、股权结构表、逐项目资本分配均未公开；烧钱速度和现金跑道仍要等 S-4 及交易后 SEC 文件确认。
    - Treeline 谈判口径 pre-money 估值未披露，逐项目风险调整 NPV 输入也不可得；因此约 ~$2.5B 只是隐含数字，不是自下而上估算。
    - 任何项目都没有人体疗效数据；在 2027 年开始中期读数前，整个平台逻辑尚未在患者身上验证。
    - 完整临床站点名单、各试验入组人数和 Hengrui 授权条款未披露，限制了对数据时间表和授权方依赖的判断。
