evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: Exact per-round sizes, dates and pre-money valuations for the stealth Series A tranches.
    whyItMatters: Would clarify Treeline’s valuation trajectory and dilution history for later valuation work.
    diligencePath: Request the cap table from the company and review SEC Form D filings.
    relatedQuestionRefs:
      - QO008
      - QO025
  - type: missing-source
    severity: minor
    topic: leadership churn and governance disputes
    missingEvidence: Any record of material leadership departures or governance disputes at Treeline.
    whyItMatters: Absence of adverse governance signals supports the key-person and stability assessment.
    diligencePath: Search litigation dockets, news archives and LinkedIn tenure histories for churn.
    relatedQuestionRefs:
      - QO024
  - type: conflicting-data
    severity: material
    topic: market-size sizing lens and SAM isolation
    missingEvidence: A reconciled, defensible SAM/SOM for Treeline’s specific programs across geographies.
    whyItMatters: Divergent KRAS and degrader forecasts prevent a single credible addressable-market figure for valuation.
    diligencePath: >-
      Commission a bottom-up model tied to biomarker prevalence, penetration and pricing; triangulate DelveInsight,
      DataIntelo and Evaluate.
    relatedQuestionRefs:
      - QM024
      - QM017
  - type: stale
    severity: minor
    topic: freshness of 2026 market forecasts
    missingEvidence: The most current, dated revisions of KRAS and degrader market forecasts.
    whyItMatters: Forecasts move with clinical readouts, so stale figures can misstate the opportunity.
    diligencePath: Subscribe to updated analyst reports and re-pull forecasts each diligence cycle.
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: material
    topic: head-to-head comparative efficacy data versus competitors
    missingEvidence: >-
      Any comparative or head-to-head clinical efficacy data for Treeline programs versus approved or advanced
      competitors.
    whyItMatters: >-
      Without comparative data, competitive differentiation remains mechanistic and unproven, capping confidence in
      positioning.
    diligencePath: Monitor Phase 1 dose-escalation and expansion readouts and competitor Phase 2/3 data at ASCO/ESMO.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: minor
    topic: net pricing versus rival list prices
    missingEvidence: Projected net (post-rebate) pricing Treeline could realize versus competitor list prices.
    whyItMatters: Net pricing drives commercial value but is unknowable pre-approval and pre-contracting.
    diligencePath: Build payer-mix and gross-to-net models once label and indications are clearer.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: material
    topic: unit economics per-program capital allocation and burn
    missingEvidence: Explicit cash burn rate and per-program capital allocation for Treeline.
    whyItMatters: Burn and per-program spend determine capital efficiency and true runway, which the valuation depends on.
    diligencePath: Obtain S-4 financial statements, management burn guidance, and a diligence data room.
    relatedQuestionRefs:
      - QI024
      - QI025
  - type: access-blocked
    severity: minor
    topic: gross margin and divestiture proceeds
    missingEvidence: Projected product gross margin and legacy-asset divestiture proceeds sizing the CVR.
    whyItMatters: These shape long-term profitability and CVR value but are not yet disclosed.
    diligencePath: Review CVR and divestiture agreements and comparable oncology COGS.
    relatedQuestionRefs:
      - QI023
      - QI019
  - type: missing-source
    severity: material
    topic: human efficacy proof-of-concept for the platform
    missingEvidence: Pivotal or expansion-cohort human efficacy data validating any Treeline program.
    whyItMatters: >-
      The entire technology thesis is unproven in patients until efficacy readouts arrive, capping confidence in the
      platform.
    diligencePath: Track Phase 1 dose-escalation/expansion readouts at ASCO/ESMO/AACR beginning in 2027.
    relatedQuestionRefs:
      - QE024
  - type: private-evidence-only
    severity: minor
    topic: antibody-drug conjugate program status and design
    missingEvidence: Concrete status, targets and design of Treeline’s targeted-therapy ADC programs.
    whyItMatters: ADCs are claimed as a platform pillar but no clinical ADC candidate is disclosed, leaving the pillar unverified.
    diligencePath: Request ADC program detail in diligence and monitor patent filings and conference abstracts.
    relatedQuestionRefs:
      - QE025
  - type: enumeration-incomplete
    severity: material
    topic: Named Customer Proof Table site roster and enrollment counts
    missingEvidence: The full trial-site roster and exact per-program enrollment counts for Treeline’s Phase 1 studies.
    whyItMatters: Site breadth and enrollment pace determine data timelines and the credibility of the customer base.
    diligencePath: >-
      Pull complete site lists and enrollment status from ClinicalTrials.gov and the EMA CTIS each cycle; request
      enrollment metrics from the company.
    relatedQuestionRefs:
      - QU024
      - QU005
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: minor
    topic: patient-reported outcomes and satisfaction data
    missingEvidence: Structured patient-reported-outcome, retention or satisfaction datasets for Treeline trials.
    whyItMatters: These would substantiate the reframed retention/satisfaction analogs used here.
    diligencePath: Await Phase 1 duration-of-response and PRO data disclosures beginning in 2027.
    relatedQuestionRefs:
      - QU025
      - QU008
  - type: missing-source
    severity: material
    topic: data security and IT risk for the computational platform
    missingEvidence: Any disclosure of data-security, IT or IP-protection controls for Treeline’s computational platform.
    whyItMatters: >-
      The computational engine is a claimed moat; undisclosed security posture is a blind spot for a data-intensive
      discovery model.
    diligencePath: Request security/IT diligence and IP-protection policies from the company data room.
    relatedQuestionRefs:
      - QR024
  - type: stale
    severity: minor
    topic: adverse events, recalls or reputational incidents in 2026
    missingEvidence: Confirmation of the absence (or presence) of any 2026 adverse regulatory or reputational incidents.
    whyItMatters: A clean adverse-event record supports the risk assessment; new incidents would change it.
    diligencePath: Monitor FDA, EMA, litigation dockets and news each diligence cycle.
    relatedQuestionRefs:
      - QR025
  - type: enumeration-incomplete
    severity: minor
    topic: Regulatory / legal risk register completeness
    missingEvidence: >-
      A complete enumeration of regulatory and legal risks beyond those identifiable from public FDA/EMA guidance and
      the S-4.
    whyItMatters: Undisclosed IND correspondence or non-public disputes could add risks not visible in the partial register.
    diligencePath: Obtain full IND/regulatory correspondence and legal disclosure schedules in diligence.
    relatedTableRefs:
      - TR001
    relatedQuestionRefs:
      - QR025
  - type: private-evidence-only
    severity: material
    topic: Comparable valuation table and per-program rNPV inputs
    missingEvidence: >-
