callouts:
  - calloutType: strength
    title: 'Founder pedigree: Bilenker built Loxo to three approvals and an $8B exit'
    body: >-
      CEO Josh Bilenker previously founded Loxo Oncology, which produced three FDA-approved medicines before its ~$8
      billion sale to Eli Lilly in 2019, and CSO Jeff Engelman ran oncology at Novartis NIBR — an unusually strong
      founder-market fit for a precision-oncology company.
    claimRefs:
      - CO006
      - CO007
  - calloutType: risk
    title: Over $1.2B raised before any human proof-of-concept
    body: >-
      Treeline has raised roughly $1.2 billion and is still enrolling its first Phase 1 trials, so investors are
      underwriting a capital-intensive build-for-scale model with no clinical efficacy readouts expected before 2027.
    claimRefs:
      - CO032
      - CO010
  - calloutType: insight
    title: A reverse merger, not a traditional IPO
    body: >-
      Rather than a conventional IPO, Treeline is reaching Nasdaq via an all-stock reverse merger with Standard BioTools
      that hands Treeline shareholders ~84% ownership and more than $900 million of pro-forma cash while the deal
      remains subject to a shareholder vote.
    claimRefs:
      - CO021
      - CO024
