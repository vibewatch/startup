company:
  name: Treeline Biosciences
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Treeline Biosciences is a clinical-stage oncology company founded in 2021 by Josh Bilenker (Loxo Oncology) and Jeff
    Engelman (Novartis NIBR) that has raised approximately $1.2 billion, runs three Phase 1 programs targeting BCL6,
    KRAS and EZH2, and announced a June 2026 reverse merger with Standard BioTools that would list it on Nasdaq as TRLN
    with more than $900 million of pro-forma cash.
sections:
  - id: identity-and-model
    title: Identity, Stage and Business Model
    body: >-
      Treeline Biosciences is a clinical-stage oncology company founded in 2021 and headquartered in Watertown,
      Massachusetts, with additional research operations in San Diego, California and Basel, Switzerland. Its stated
      mission is to make great medicines reliably and repeatedly by matching validated disease targets with proven drug
      modalities — small-molecule inhibitors, protein degraders and targeted antibody-drug conjugates — supported by
      in-house computational tools. Unlike the typical single-asset biotech, Treeline pursues a deliberately
      diversified, build-for-scale model that resources several programs with complementary time horizons and technical
      risks. As of the July 2026 run date the company is private and pre-revenue, running three Phase 1 oncology
      programs with a fourth entering the clinic in 2026, and has announced a reverse merger that would list it on
      Nasdaq as TRLN.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO017
      - CO030
      - CO018
    tableRefs:
      - TO001
    figureRefs:
      - FO002
  - id: founders-leadership
    title: Founders, Leadership and Governance
    body: >-
      Treeline was co-founded by two veteran drug hunters. CEO Josh Bilenker, MD, previously founded Loxo Oncology,
      which advanced three FDA-approved medicines and was acquired by Eli Lilly for approximately $8 billion in 2019; he
      also worked at the U.S. FDA and Aisling Capital. CSO Jeff Engelman, MD, PhD, was Global Head of Oncology at the
      Novartis Institutes for BioMedical Research and Director of Thoracic Oncology at Massachusetts General Hospital.
      CFO Spencer Smith brings capital-markets and finance experience from Sentio, Aisling Capital and McKinsey. This
      pedigree is a core part of the investment narrative, but it also concentrates key-person risk in two individuals.
      After the merger the combined company is expected to be governed by a twelve-member board — ten Treeline designees
      and two from Standard BioTools — including Sue Desmond-Hellmann.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO009
      - CO028
    tableRefs:
      - TO002
  - id: funding-capital
    title: Funding, Investors and Capital
    body: >-
      Since 2021 Treeline has raised approximately $1.2 billion from a syndicate of leading life-sciences investors,
      building much of that base in stealth before disclosing roughly $1.1 billion alongside a $200 million Series A
      extension in September 2025. Named backers include ARCH Venture Partners, OrbiMed, GV, KKR, AI Life Sciences (an
      Access Industries affiliate), accounts advised by T. Rowe Price, Casdin Capital, Fidelity, Aisling Capital, Rock
      Springs Capital and Exor. No negotiated pre-money valuation has ever been disclosed; the pending merger implies
      roughly $2.5 billion of equity value for Treeline shareholders. Critics note that raising this much capital before
      any human proof-of-concept concentrates capital-efficiency risk, a theme later chapters revisit in the financial
      and valuation analysis.
    claimRefs:
      - CO010
      - CO011
      - CO036
      - CO012
      - CO013
      - CO014
      - CO015
      - CO032
    tableRefs:
      - TO003
    figureRefs:
      - FO003
  - id: milestones-merger
    title: Milestones and the Standard BioTools Merger
    body: >-
      Treeline’s chronology of record runs from its 2021 founding through its September 2025 emergence to the June 8,
      2026 announcement of an all-stock reverse merger with Standard BioTools (Nasdaq: LAB). Under the deal, Treeline
      shareholders would own approximately 84% of the combined company and Standard BioTools shareholders approximately
      16%, with roughly $450 million of net cash contributed and more than $900 million of pro-forma cash expected at
      closing, funding operations into 2029. Standard BioTools holders also receive a contingent value right tied to
      legacy-asset proceeds and an Illumina/SomaLogic earnout. A Form S-4 was filed on July 20, 2026, but as of the July
      28, 2026 run date the merger remains pending a Standard BioTools shareholder vote and regulatory approvals, with
      the legacy instrument businesses slated for divestiture.
    claimRefs:
      - CO019
      - CO020
      - CO021
      - CO022
      - CO023
      - CO024
      - CO027
      - CO026
      - CO025
      - CO031
      - CO037
    tableRefs:
      - TO004
    figureRefs:
      - FO001
  - id: snapshot
    title: Snapshot KPIs and Investability Logic
    body: >-
      Pulling the threads together, Treeline in mid-2026 is defined by an unusually deep capital base (~$1.2 billion
      raised, more than $900 million of pro-forma cash), a small but expert organization of roughly 168 employees, a
      diversified set of three Phase 1 oncology programs with a fourth entering the clinic, and zero product revenue.
      Its investability logic connects founder pedigree and computational discovery to a portfolio pipeline and a
      strengthened balance sheet, but the entire thesis is gated on clinical proof-of-concept that will not begin to
      arrive until interim readouts in 2027. These snapshot facts — capital, scale, pipeline breadth and the pending
      public listing — are the ground truth that the market, competitor, financial and valuation chapters build upon.
    claimRefs:
      - CO033
      - CO034
      - CO035
      - CO016
      - CO024
    figureRefs: []
