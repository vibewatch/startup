            body: >-
              Treeline’s defining financial feature is the scale of its capital. Since 2021 it has raised approximately
              $1.2 billion, much of it in stealth, including a $200 million Series A extension in September 2025 that
              brought disclosed cumulative funding to about $1.1 billion. The pending merger adds roughly $450 million
              of net cash from Standard BioTools (net cash plus a $10 million fee, about $470 million of value),
              producing more than $900 million of pro-forma cash at close. Against an estimated $200-300 million annual
              burn, that balance implies roughly three years of runway, consistent with the company’s stated funding
              into 2029. The all-stock structure leaves Treeline shareholders with approximately 84% of the combined
