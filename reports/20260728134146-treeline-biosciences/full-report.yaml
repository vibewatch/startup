  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Treeline’s regulatory and legal risks span both its science and its pending transaction. On the clinical
              side, all first-in-human oncology programs carry the risk of an FDA clinical hold if a safety signal
              emerges, and modern dose-optimization expectations under Project Optimus raise the evidentiary bar even
              for active programs; European enrollment adds EMA oversight and multi-jurisdiction surface area. On the
              transaction side, the all-stock reverse merger must clear a Standard BioTools shareholder vote and
              regulatory approvals, and legal commentary and public dockets show such deals commonly attract shareholder
              litigation around the vote and disclosures. Intellectual-property and freedom-to-operate risk also exists
              in the crowded degrader and KRAS chemistry spaces, where overlapping filings could invite disputes. None
              of these is unusual for a clinical-stage biotech, but together they form a meaningful regulatory-legal
              surface that the S-4 risk factors themselves enumerate.
            claimRefs:
              - CR001
              - CR002
              - CR021
              - CR029
              - CR003
              - CR025
              - CR020
              - CR022
              - CR024
