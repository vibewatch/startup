      - number: '5.2'
        title: Technology Platforms and Architecture
        blocks:
          - type: paragraph
            body: >-
              Underneath the assets sits a deliberately broad technology stack. Treeline has enabled four in-house
              platforms — small-molecule inhibitors, protein degraders (PROTACs and molecular glues), targeted-therapy
              antibody-drug conjugates, and computational drug-design tools — and its stated "matchmaking" philosophy is
              to pair each disease target with the modality most likely to drug it. Computational, physics- and
              machine-learning-based methods are integrated with classical medicinal chemistry to accelerate candidate
              design, and the company is actively hiring cheminformatics and ML-engineering staff to deepen that
              capability. Critical research is executed in-house across US laboratories in Watertown and San Diego and a
              European laboratory in Basel. The architecture is genuinely differentiated in breadth, though the
              antibody-drug-conjugate layer remains preclinical and no ADC clinical candidate has yet been disclosed, so
              the platform’s productivity claim is still partly aspirational.
