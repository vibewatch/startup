  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Pipeline Assets and Mechanisms
        blocks:
          - type: paragraph
            body: >-
              Treeline’s product is its pipeline of four disclosed oral small molecules plus three undisclosed programs.
              TLN-121 is an internally discovered BCL6 protein degrader in a Phase 1 lymphoma trial (NCT07082803);
              because BCL6 is a transcription-factor oncogene that lymphoma cells co-opt to survive, degrading it
              removes a survival dependency that occupancy inhibitors struggle to address. TLN-372 is an internally
              discovered pan-KRAS inhibitor engineered for deep, continuous inhibition across KRAS variants while
              sparing HRAS and NRAS to limit toxicity, reaching the roughly 87% of KRAS mutations beyond G12C. TLN-254
              is an EZH2 inhibitor in-licensed from Hengrui after Phase 2 in China and now in a Phase 1 (NCT06733441) in
              T-cell lymphomas. TLN-499 is a selective BCL-XL degrader expected in the clinic in 2026, designed to spare
              platelets. All four are oral, supporting outpatient dosing and combinations.
