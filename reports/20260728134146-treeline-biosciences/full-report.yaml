        title: Unit Economics and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              On a unit basis, Treeline is a deliberately capital-intensive company. Advancing a single small-molecule
              oncology asset through Phase 1 typically costs tens of millions of dollars, and Treeline is running
              three-to-four such programs in parallel, so its roughly $1.2 billion has effectively funded several
              simultaneous bets plus the fixed cost of US and European laboratories and about 168 staff. This
              build-for-scale model trades higher upfront burn for a diversified portfolio of shots on goal, contrasting
              with the milestone-to-milestone, single-asset approach that concentrates a typical biotech’s resources.
              The economics are attractive only if the portfolio yields at least one clinical winner, because value is
              realized solely on clinical success; until then the model looks expensive. Operating expense is dominated
