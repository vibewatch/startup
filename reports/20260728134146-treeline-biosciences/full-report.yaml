              - CR014
              - CR005
          - type: figure
            figureRef: FR002
            claimRefs:
              - CR017
              - CR030
      - number: '7.3'
        title: Dependency, Partner and People Risk
        blocks:
          - type: paragraph
            body: >-
              Treeline’s risk profile is shaped by a few concentrated dependencies. The Hengrui license for TLN-254
              provides an externally validated, China-approved asset but exposes it to US-China geopolitical, regulatory
              and supply risk that internally discovered programs avoid. The merger with Standard BioTools is a second
              major dependency: it delivers roughly $450 million of cash and a Nasdaq listing but is contingent on a
              shareholder vote, and its legacy-asset divestiture adds distraction and potential value leakage. People
              and execution risk is concentrated in founders Josh Bilenker and Jeff Engelman, whose reputations underpin
              both the strategy and the valuation; while no departures are on record, founder-centric biotechs face
              elevated key-person risk. Finally, the multi-program build-for-scale model, though diversifying, spreads
              capital and management attention across several simultaneous Phase 1 trials in a way that is untested at
              Treeline’s scale and could dilute focus.
            claimRefs:
              - CR007
              - CR008
              - CR013
              - CR018
              - CR009
              - CR010
              - CR015
              - CR026
