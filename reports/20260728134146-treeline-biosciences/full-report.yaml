            body: >-
              The financial picture carries real gaps and one central risk. As a private company Treeline publishes no
              audited statements, no explicit burn figure, no cap table and no per-program spend, so its burn and runway
              estimates carry wide error bars until the S-4 and post-close SEC filings provide detail. The central risk
              is capital efficiency: Treeline has deployed roughly $1.2 billion before any human proof-of-concept, and
              skeptics argue this front-loaded spend can only be justified by clinical data that will not begin arriving
              until 2027. Layered on top is merger-completion risk — if the deal fails, Treeline loses the $450 million
              contribution and its public listing, leaving runway certainty materially weaker and dependent on a fresh
              private raise. The valuation implied by the deal, roughly $2.5 billion of equity value for Treeline
