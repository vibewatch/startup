      - number: '1.2'
        title: Founders, Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Treeline was co-founded by two veteran drug hunters. CEO Josh Bilenker, MD, previously founded Loxo
              Oncology, which advanced three FDA-approved medicines and was acquired by Eli Lilly for approximately $8
              billion in 2019; he also worked at the U.S. FDA and Aisling Capital. CSO Jeff Engelman, MD, PhD, was
              Global Head of Oncology at the Novartis Institutes for BioMedical Research and Director of Thoracic
              Oncology at Massachusetts General Hospital. CFO Spencer Smith brings capital-markets and finance
              experience from Sentio, Aisling Capital and McKinsey. This pedigree is a core part of the investment
              narrative, but it also concentrates key-person risk in two individuals. After the merger the combined
              company is expected to be governed by a twelve-member board — ten Treeline designees and two from Standard
              BioTools — including Sue Desmond-Hellmann.
