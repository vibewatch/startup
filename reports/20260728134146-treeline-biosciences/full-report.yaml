              Traditional retention and satisfaction metrics do not apply to a pre-commercial biotech, so we reframe
              them: retention becomes time on therapy without progression, repeat usage becomes continuation until
              progression or toxicity, and satisfaction becomes clinician and patient receptivity — none of which
              Treeline has yet quantified, leaving the illustrative cohort figures as placeholders. Expansion of the
              customer base would come from additional indications and combinations, expansion cohorts, and geographic
              broadening into the EU and beyond, which also diversifies regulatory exposure. The principal near-term
