      - number: '1.5'
        title: Snapshot KPIs and Investability Logic
        blocks:
          - type: paragraph
            body: >-
              Pulling the threads together, Treeline in mid-2026 is defined by an unusually deep capital base (~$1.2
              billion raised, more than $900 million of pro-forma cash), a small but expert organization of roughly 168
              employees, a diversified set of three Phase 1 oncology programs with a fourth entering the clinic, and
              zero product revenue. Its investability logic connects founder pedigree and computational discovery to a
              portfolio pipeline and a strengthened balance sheet, but the entire thesis is gated on clinical
              proof-of-concept that will not begin to arrive until interim readouts in 2027. These snapshot facts —
              capital, scale, pipeline breadth and the pending public listing — are the ground truth that the market,
