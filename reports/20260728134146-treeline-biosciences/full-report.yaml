      - number: '2.2'
        title: Sizing the Opportunity Across Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              No single TAM captures Treeline’s opportunity, so we bound it with several lenses. The broadest is the
              global oncology drugs market, which exceeds $200 billion and grows at double-digit rates. Narrower
              mechanism lenses are more relevant: the KRAS inhibitor market was about $526 million in 2025 and is
              forecast to reach roughly $2.9 billion by 2034, while the targeted protein degrader market was around $2
              billion in 2025 and is projected to exceed $13 billion by 2034. Disease-incidence lenses show roughly
              26,000 US DLBCL cases annually (about 150,000 globally), 80,000-90,000 total NHL cases, and only a few
              thousand PTCL and CTCL cases. KRAS mutations appear in about a quarter of adult cancers with non-G12C
              variants dominating, and BCL6 is overexpressed in 40-50% of DLBCL — large biological substrates that these
              dollar forecasts only partly monetize.
