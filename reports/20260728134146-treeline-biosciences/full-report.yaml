      - number: '7.2'
        title: Clinical, Operational and Competitive Risk
        blocks:
          - type: paragraph
            body: >-
              The single most important risk is scientific. Oncology has among the lowest Phase 1-to-approval success
              rates of any therapeutic area — historically only a few percent — and Treeline has no human efficacy
              proof-of-concept, so the base rate implies most of its programs will fail and the entire platform thesis
              is unproven until 2027 readouts. Operationally, the company must coordinate R&D across US and European
              laboratories, eventually solve CMC and manufacturing scale-up, and execute clinical trials concentrated in
              a small number of flagship centers within a crowded KRAS and lymphoma landscape where enrollment is slower
              and costlier. Competitively, Revolution Medicines’ Phase 3 pan-RAS lead is a direct threat that could
              define the pan-KRAS market before TLN-372 matures, and approved tazemetostat sets a differentiation bar
              for TLN-254. Data-security exposure on the computational platform is undisclosed and flagged as a gap.
            claimRefs:
              - CR005
              - CR004
              - CR006
              - CR014
              - CR011
              - CR023
              - CR030
          - type: table
            tableRef: TR002
            claimRefs:
