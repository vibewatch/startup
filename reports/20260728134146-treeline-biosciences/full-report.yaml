  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Treeline’s market is best defined by mechanism and indication rather than by a single broad label. The
              relevant included spend is targeted oncology therapeutics for genetically defined tumors: pan-KRAS and
              KRAS-mutant agents for solid tumors, BCL6-directed degraders for B-cell lymphoma, EZH2 inhibitors for
              T-cell lymphoma, and selective BCL-XL degraders. Excluded from this boundary are non-targeted
              chemotherapy, surgery, radiation and all non-oncology spend. The status-quo Treeline must displace is
              defined by chemotherapy, immunotherapy, the approved KRAS G12C inhibitors sotorasib and adagrasib, and the
              first-in-class EZH2 inhibitor tazemetostat. Adjacencies — combination regimens, additional KRAS
              indications, and future neurology and immunology programs — provide optionality but are not part of the
              current addressable market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM032
              - CM031
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
