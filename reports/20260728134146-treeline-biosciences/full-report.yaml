  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization
        blocks:
          - type: paragraph
            body: >-
              Treeline is a pre-revenue, clinical-stage company: as of the July 2026 run date it has no product sales,
              no recurring revenue and no disclosed partnership or milestone income. Its revenue model is therefore
              entirely prospective and follows the standard biopharma logic — computational and in-house discovery feeds
              a preclinical attrition filter, surviving candidates advance through Phase 1-3 clinical development, and
              value is realized only upon regulatory approval and product sales, with optional out-licensing available
              at any stage. Because approved targeted-oncology small molecules command six-figure annual pricing and
              high gross margins, the eventual monetization potential is attractive, but it is years away and contingent
              on clinical success. The contingent value right created in the merger is not company revenue: it accrues
              to Standard BioTools shareholders from legacy asset proceeds and an Illumina/SomaLogic earnout, so it
              should not be confused with Treeline’s own monetization.
