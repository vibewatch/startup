      - number: '3.5'
        title: Net Competitive Read and Diligence Focus
        blocks:
          - type: paragraph
            body: >-
              Synthesizing across programs, Treeline enters its competitive arenas with two genuine advantages and one
              decisive disadvantage. The advantages are breadth and resources: it spans small-molecule inhibitors,
              protein degraders and antibody-drug conjugates in-house, backed by roughly $1.2 billion raised and more
              than $900 million of expected pro-forma cash, which comfortably outmatches the smaller degrader
              specialists it competes with on BCL6 and BCL-XL. The disadvantage is clinical timing: on its
              highest-profile asset, the pan-KRAS TLN-372, it trails Revolution Medicines by multiple clinical phases,
              and its EZH2 and BCL6 assets still lack the human efficacy data that would convert mechanistic novelty
              into a defensible position. The practical diligence focus therefore narrows to three questions — how
              quickly Treeline can generate differentiating Phase 1 data, whether its composition-of-matter IP and
              computational engine translate into real productivity, and how exposed TLN-254 is to Hengrui licensor and
              geopolitical risk. Until those resolve, Treeline is best read as resource-rich and broad but clinically
              unproven relative to a fast-moving field.
            claimRefs:
