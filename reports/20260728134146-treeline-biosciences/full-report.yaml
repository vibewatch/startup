      - number: '2.3'
        title: Buyers, Payers and the Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The buyers of Treeline’s future products are medical and hematologist-oncologists at academic and
              community cancer centers, but the economic decision rests with payers — Medicare and commercial insurers
              in the US, HTA bodies and national health systems in Europe, and the NRDL in China. The adoption path for
              a new oncology drug runs from FDA approval, frequently via accelerated approval, through NCCN guideline
              inclusion, payer formulary listing, companion biomarker testing, and finally prescribing. Because rare
              lymphoma prescribing concentrates in a limited set of academic centers, launch and trial-site strategy
              overlap. Geography matters: the US leads on pricing and access, the EU adds volume under tighter
              reimbursement, and China provides a separate regime relevant to the Hengrui-licensed EZH2 asset. An
              illustrative funnel shows substantial attrition from diagnosed population to treated patients.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM021
              - CM023
              - CM034
              - CM035
          - type: table
            tableRef: TM003
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM021
              - CM034
          - type: figure
