      - number: '3.2'
        title: Capabilities, Mechanism and Differentiation
        blocks:
          - type: paragraph
            body: >-
              On capabilities, Treeline’s pitch is breadth: it has enabled small-molecule inhibitors, protein degraders
              and targeted antibody-drug conjugates in-house, coupled to computational discovery tools, whereas degrader
              specialists such as C4 and Kymera are more single-modality and Revolution Medicines is RAS-focused.
              Mechanistically, TLN-372’s pan-KRAS approach is designed to reach the roughly 87% of KRAS mutations beyond
              G12C while sparing HRAS and NRAS to limit toxicity, a genuine point of differentiation from
              mutation-specific G12C incumbents — though it must still beat their established efficacy bar. TLN-254 must
              demonstrate differentiated single-agent activity in T-cell lymphomas, a setting tazemetostat does not
              target, and TLN-121 is positioned for combinations with standard-of-care lymphoma regimens. All of this
              differentiation, however, is presently mechanistic and preclinical rather than proven in humans.
            claimRefs:
              - CP013
              - CP030
              - CP011
              - CP012
              - CP019
              - CP020
              - CP028
              - CP033
          - type: table
            tableRef: TP002
            claimRefs:
              - CP013
              - CP030
              - CP011
          - type: figure
            figureRef: FP002
            claimRefs:
              - CP013
              - CP030
      - number: '3.3'
        title: Pricing and Packaging Context
        blocks:
          - type: paragraph
            body: >-
              Because Treeline is pre-approval, pricing analysis is necessarily indicative. Its eventual competitors
              price within the targeted-oncology class: approved KRAS G12C inhibitors sotorasib and adagrasib and the
              EZH2 inhibitor tazemetostat all carry six-figure annual list prices, with substantial payer rebating
              typical of the category. Treeline has no products priced yet, so the competitive pricing question is less
              about undercutting incumbents and more about whether its programs can clear the efficacy and biomarker
              thresholds that justify class-level pricing and reimbursement. Net (post-rebate) pricing that Treeline
              could realize is unknowable pre-approval and is preserved as a diligence gap. The practical implication is
              that pricing is unlikely to be a differentiator; clinical data and label breadth will determine commercial
              value far more than list-price positioning.
            claimRefs:
              - CP014
              - CP028
          - type: table
            tableRef: TP003
            claimRefs:
              - CP014
              - CP028
      - number: '3.4'
        title: Moats, Durability and Competitive Threats
        blocks:
          - type: paragraph
            body: >-
              Treeline’s potential moats are composition-of-matter intellectual property covering its degrader and
              pan-KRAS chemistry, novel chemistry itself, an integrated computational invention engine, a diversified
              pipeline that spreads risk, and a deep capital base that outmatches many degrader-focused peers. Yet
              durability is uncertain: competitor pipelines are numerous and advancing quickly, and no human efficacy
              data yet validate any of Treeline’s differentiation. The principal threats are Revolution Medicines’
              clinical lead in pan-RAS, entrenched G12C incumbents that set the benchmark, the possibility that degrader
              rivals reach the clinic first on other targets, licensor dependence on Hengrui for TLN-254 with its
              attendant geopolitical exposure, and the execution uncertainty of the pending reverse merger relative to
              already-public rivals. Competitor readouts, especially Revolution Medicines’ Phase 3 data, will pressure
              Treeline’s positioning before its own interim readouts arrive in 2027.
            claimRefs:
              - CP015
              - CP016
              - CP030
              - CP034
              - CP017
              - CP018
              - CP021
