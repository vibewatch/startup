              Treeline’s chronology of record runs from its 2021 founding through its September 2025 emergence to the
              June 8, 2026 announcement of an all-stock reverse merger with Standard BioTools (Nasdaq: LAB). Under the
              deal, Treeline shareholders would own approximately 84% of the combined company and Standard BioTools
              shareholders approximately 16%, with roughly $450 million of net cash contributed and more than $900
