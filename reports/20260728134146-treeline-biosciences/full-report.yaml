        title: Discovery-to-Clinic Workflow and Trials
        blocks:
          - type: paragraph
            body: >-
              Treeline’s operating workflow runs from target selection and modality matchmaking through in-house
              invention, a built-in preclinical attrition filter that advances only the most promising candidates, and
              into first-in-human Phase 1 trials designed with dose escalation and expansion cohorts consistent with FDA
              guidance and Project Optimus dose-optimization expectations. Three programs opened Phase 1 trials in 2025
