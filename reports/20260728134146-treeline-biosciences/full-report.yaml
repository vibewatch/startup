            body: >-
              The platform rests on several critical dependencies: the computational engine, in-house medicinal
              chemistry, the US and EU laboratories, the Hengrui license for TLN-254, and the ability to enroll patients
              at clinical sites. The Hengrui relationship is a double-edged dependency — it provides an externally
              validated, China-approved asset but introduces licensor, supply and geopolitical risk that internally
              discovered programs avoid. Quality and compliance signals are development-stage: trials are registered,
              trial design is FDA-aligned, and the EZH2 asset is approved in China, but there are no manufacturing or
              CMC disclosures and only preliminary safety data. The roadmap adds TLN-499 to the clinic in 2026 and three
              further oncology, neurology and immunology programs in 2027-2028, with interim data readouts beginning in
              2027. On a stage-versus-modality view, Treeline is early clinical but unusually broad, with the licensed
              EZH2 program the most externally de-risked and the internal degrader and pan-KRAS programs the
              highest-risk, highest-reward.
