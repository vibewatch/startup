            figureRef: FM004
            claimRefs:
              - CM014
              - CM035
      - number: '2.4'
        title: Drivers, Constraints and Sizing Gaps
        blocks:
          - type: paragraph
            body: >-
              Demand drivers are real: a very large non-G12C KRAS population, growing clinical validation of protein
              degradation as a modality, rising precision-oncology biomarker testing, and accelerated regulatory
              pathways that can compress time-to-market. But the constraints are equally material. The field is crowded,
              with more than 120 KRAS programs in Phase 2/3 and Revolution Medicines already in Phase 3 with a pan-RAS
              inhibitor that defines the competitive frontier; approved G12C incumbents set the efficacy and pricing
              bar; payers increasingly demand biomarker-defined populations and outcomes data; and oncology development
              still fails roughly 90% of the time. Finally, the sizing itself is uncertain — KRAS and degrader forecasts
              diverge by publisher and are revised frequently — so a defensible SAM or SOM for Treeline cannot yet be
              isolated and is preserved here as a diligence gap rather than a point estimate.
            claimRefs:
              - CM015
              - CM025
              - CM023
              - CM016
              - CM017
              - CM029
              - CM019
              - CM035
              - CM022
              - CM033
              - CM024
              - CM027
              - CM026
              - CM030
          - type: table
            tableRef: TM004
            claimRefs:
              - CM015
              - CM023
              - CM017
              - CM016
              - CM035
              - CM029
      - number: '2.5'
        title: Segmentation Within Degraders and Net Read
        blocks:
          - type: paragraph
            body: >-
              A final lens separates Treeline’s programs by both modality and disease compartment. Within targeted
              protein degradation, its BCL6 (TLN-121) and future BCL-XL (TLN-499) assets address hematologic
              malignancies, while its pan-KRAS inhibitor TLN-372 competes in solid tumors and its in-licensed EZH2
              inhibitor TLN-254 sits in rare T-cell lymphomas. Each compartment carries a different competitive
              intensity and payer profile: solid-tumor KRAS is the largest but most contested, B-cell lymphoma is a
              validated but crowded degrader niche, and T-cell lymphoma is smaller yet comparatively open because
              tazemetostat is focused elsewhere. Net, the market is genuinely large in biological terms — a quarter of
              adult cancers carry KRAS mutations and roughly 1.25 million new US and EU patients are implicated annually
              — but the monetizable, reimbursable slice available to a Phase 1 entrant is narrower and gated by
              competition, biomarker access and pricing. The disciplined read is a large, growing, but heavily contested
              opportunity whose realizable value depends almost entirely on differentiated clinical data.
            claimRefs:
              - CM030
              - CM031
              - CM028
              - CM017
              - CM020
              - CM027
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Non-G12C KRAS is the largest unaddressed prize
            body: >-
              Because approved drugs only hit the G12C mutation — about 13% of KRAS cases — the roughly 87% of KRAS
              mutations that are non-G12C represent a very large, still-unaddressed population that Treeline’s pan-KRAS
              TLN-372 is designed to reach.
            calloutType: insight
            claimRefs:
              - CM009
              - CM017
          - type: callout
            title: A crowded, fast-moving competitive field
            body: >-
              With more than 120 KRAS programs in Phase 2/3 and Revolution Medicines already in Phase 3 with a pan-RAS
              inhibitor, the addressable share available to a Phase 1 entrant like Treeline is constrained and could
              erode further before its own data mature.
            calloutType: risk
            claimRefs:
              - CM019
              - CM029
          - type: callout
            title: Sizing must be a range, not a point
            body: >-
              KRAS and degrader forecasts differ widely by publisher and methodology and are revised frequently, so this
              analysis carries ranges rather than a single TAM and preserves the contradictions for diligence.
            calloutType: assumption
            claimRefs:
              - CM022
              - CM033
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The Competitive Landscape by Program
        blocks:
          - type: paragraph
            body: >-
              Treeline competes in three largely separate arenas, one per lead program. For the pan-KRAS TLN-372, the
              field is crowded and led by Revolution Medicines, whose daraxonrasib is a pan-RAS(ON) inhibitor already in
              Phase 3 for pancreatic and non-small-cell lung cancer; Amgen’s sotorasib and Bristol Myers Squibb’s
              adagrasib are approved G12C incumbents, and Chinese players such as Jacobio and Betta Pharma add further
              density with over 120 KRAS programs in Phase 2/3. For the BCL6 degrader TLN-121, the competitive set is
              early-stage — C4 Therapeutics and Kymera have degrader research relevant to BCL6/BCL-XL — and Treeline may
              be first or among the first into Phase 1. For the EZH2 inhibitor TLN-254, the reference competitor is
              Ipsen’s approved tazemetostat, though its indications differ from Treeline’s T-cell lymphoma focus.
              Dialectic’s DT-2216 is the nearest analog to the future TLN-499.
            claimRefs:
