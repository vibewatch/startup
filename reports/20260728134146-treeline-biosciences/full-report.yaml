      - number: '5.5'
        title: Net Technology Read
        blocks:
          - type: paragraph
            body: >-
              Taken together, Treeline’s product and technology position is one of unusual breadth and genuine
              mechanistic sophistication paired with a complete absence of validating human efficacy data. On the
              positive side, the company can attack a target with whichever modality fits best — an occupancy inhibitor
              for pan-KRAS, a degrader for BCL6 and BCL-XL, or an antibody-drug conjugate — all invented in-house and
              accelerated by computational design across US and European laboratories, and it has already put three
              programs into registered Phase 1 trials with a fourth entering in 2026. On the cautionary side, the
              antibody-drug-conjugate pillar is still preclinical, the platform’s repeatable-invention claim is unproven
              at scale, and every clinical asset rests on early tolerability and exposure signals rather than efficacy.
              The disciplined read is that the technology is a credible, well-resourced engine whose true value is
              entirely gated on the 2027 interim readouts that will show whether breadth converts into clinical wins.
