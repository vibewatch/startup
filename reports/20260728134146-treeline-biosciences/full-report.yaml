            tableRef: TV003
            claimRefs:
              - CV008
              - CV020
              - CV017
              - CV029
          - type: table
            tableRef: TV004
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV032
              - CV002
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV026
              - CV008
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV008
              - CV017
              - CV022
      - number: '8.4'
        title: Kill Triggers, Diligence Asks and Timing
        blocks:
          - type: paragraph
            body: >-
              A wait-for-data stance is only actionable with a clear monitoring checklist. The thesis-break triggers
              that would invalidate the case are a lead-program failure or clinical hold, a decisive Revolution
              Medicines efficacy win, merger termination, a founder departure, or a cash/runway shortfall forcing
              dilution. The corresponding diligence asks — which mostly require private data or post-close filings — are
              the S-4 financials and burn rate, per-program rNPV inputs, the Hengrui license terms, the cap table and
              preferences, full clinical-site and enrollment data, and the CVR and divestiture agreements. Timing
              matters too: the merger is expected to close in the second half of 2026, so the practical entry point
              depends on deal completion and any pre-close data, and the CVR value accrues to Standard BioTools holders
              rather than Treeline shareholders. Analyst price-target coverage of LAB already reflects the pending
              combination rather than standalone omics fundamentals.
            claimRefs:
              - CV014
              - CV015
              - CV028
              - CV025
              - CV021
              - CV034
              - CV031
          - type: table
            tableRef: TV005
            claimRefs:
              - CV014
              - CV020
              - CV023
          - type: table
            tableRef: TV006
            claimRefs:
              - CV015
              - CV035
              - CV025
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV002
      - number: '8.5'
        title: Net Valuation Read
        blocks:
          - type: paragraph
            body: >-
              Netting everything, Treeline’s valuation is best understood as a cash-supported call option on a broad,
              founder-led oncology pipeline, priced roughly fairly today and capable of being re-rated — sharply, in
              either direction — only by the 2027 clinical readouts. The downside is partly protected by more than $900
              million of pro-forma cash that limits how far the equity can fall relative to cashless clinical-stage
              peers, while the upside is anchored by a management team that has built a multi-billion-dollar oncology
              franchise before. But the return profile is binary and catalyst-concentrated, a precise standalone
              valuation cannot be built without per-program rNPV inputs that are not yet public, and a Phase 3
              competitor is already ahead in the highest-profile program. The result is a research-more recommendation
              with medium confidence and a high risk rating: an attractive team and balance sheet do not, on their own,
              justify committing capital ahead of the data that will decide the outcome.
            claimRefs:
              - CV037
              - CV029
              - CV033
              - CV035
              - CV023
              - CV016
              - CV022
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Research-more: a cash-supported option on unproven science'
            body: >-
              Treeline pairs Loxo-caliber founders, a broad platform and more than $900 million of pro-forma cash with a
              complete absence of human efficacy data, so its ~$2.5B implied valuation is best treated as a fairly
              priced call option that only 2027 readouts can re-rate — a clear research-more rather than buy.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV037
          - type: callout
            title: Only a ~2x step-up on capital
            body: >-
              The implied ~$2.5B equity value is roughly twice the ~$1.2B raised, and more than a third of it is cash,
              so investors are not yet paying a large speculative premium above cash plus early pipeline — the upside
              (and downside) lives almost entirely in the clinical data.
            calloutType: insight
            claimRefs:
              - CV005
              - CV017
          - type: callout
            title: Binary, catalyst-concentrated returns
            body: >-
              With value clustering around 2027 interim readouts and a Phase 3 competitor already ahead in KRAS, the
              return profile is high-variance and binary: a strong lead readout could roughly double equity value while
              a failure could push it toward the cash floor near $1B.
            calloutType: risk
            claimRefs:
              - CV033
              - CV020
