  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Who Treeline’s Customers Are
        blocks:
          - type: paragraph
            body: >-
              Treeline is a pre-commercial, clinical-stage company, so it has no paying customers and no
              revenue-generating customer relationships as of the July 2026 run date. The meaningful "customers" today
              are the heavily pretreated relapsed/refractory patients enrolled in its Phase 1 trials and the academic
              cancer centers and investigators that conduct those trials, while the true paying customers — payers such
              as Medicare, commercial insurers and European health systems, and the oncologists who prescribe — only
              emerge after regulatory approval. The enrolled populations are specific: relapsed/refractory B-cell and
              T-cell lymphoma patients for the BCL6 degrader TLN-121 and the EZH2 inhibitor TLN-254, and KRAS-altered
              solid-tumor patients for the pan-KRAS TLN-372. This segmentation, from patients and sites today to payers
              and prescribers tomorrow, frames the entire customer analysis and its gaps.
