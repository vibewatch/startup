chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Stage and Business Model
        blocks:
          - type: paragraph
            body: >-
              Treeline Biosciences is a clinical-stage oncology company founded in 2021 and headquartered in Watertown,
              Massachusetts, with additional research operations in San Diego, California and Basel, Switzerland. Its
              stated mission is to make great medicines reliably and repeatedly by matching validated disease targets
              with proven drug modalities — small-molecule inhibitors, protein degraders and targeted antibody-drug
              conjugates — supported by in-house computational tools. Unlike the typical single-asset biotech, Treeline
              pursues a deliberately diversified, build-for-scale model that resources several programs with
              complementary time horizons and technical risks. As of the July 2026 run date the company is private and
              pre-revenue, running three Phase 1 oncology programs with a fourth entering the clinic in 2026, and has
              announced a reverse merger that would list it on Nasdaq as TRLN.
