        blocks:
          - type: paragraph
            body: >-
              Since 2021 Treeline has raised approximately $1.2 billion from a syndicate of leading life-sciences
              investors, building much of that base in stealth before disclosing roughly $1.1 billion alongside a $200
              million Series A extension in September 2025. Named backers include ARCH Venture Partners, OrbiMed, GV,
              KKR, AI Life Sciences (an Access Industries affiliate), accounts advised by T. Rowe Price, Casdin Capital,
              Fidelity, Aisling Capital, Rock Springs Capital and Exor. No negotiated pre-money valuation has ever been
              disclosed; the pending merger implies roughly $2.5 billion of equity value for Treeline shareholders.
              Critics note that raising this much capital before any human proof-of-concept concentrates
              capital-efficiency risk, a theme later chapters revisit in the financial and valuation analysis.
