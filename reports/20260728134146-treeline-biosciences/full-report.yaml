              - CR010
      - number: '7.4'
        title: Capital Risk, Transmission and Mitigation
        blocks:
          - type: paragraph
            body: >-
              On capital, Treeline’s deep balance sheet cuts both ways: more than $900 million of expected pro-forma
              cash de-risks the next three years of operations, but having deployed roughly $1.2 billion before any
              proof-of-concept concentrates capital-efficiency risk, and a failed merger would remove the contributed
              cash and listing, exposing the company to refinancing risk in a selective funding market. These risks do
              not sit in isolation — they transmit and compound: a scientific setback feeds clinical-execution and
              financing risk and, because value is concentrated in a few 2027 catalysts, a single negative readout could
              reprice the whole company. Mitigations are real but partial: portfolio diversification across four
              mechanisms, the post-merger cash cushion, FDA-aligned trial design, and stated preclinical kill criteria
              all help, yet none removes the platform-level scientific risk. Diligence should therefore prioritize
              kill-criteria discipline, runway protection if the merger slips, and the sensitivity of valuation to each
              catalyst.
            claimRefs:
              - CR012
              - CR013
              - CR026
              - CR017
              - CR030
              - CR016
              - CR027
              - CR028
              - CR031
          - type: table
            tableRef: TR005
