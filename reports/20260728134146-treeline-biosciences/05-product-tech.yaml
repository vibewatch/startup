callouts:
  - calloutType: strength
    title: Rare multi-modality, multi-target platform
    body: >-
      Treeline has enabled small-molecule inhibitors, protein degraders and antibody-drug conjugates in-house, coupled
      to computational design, letting it choose the best modality per target — a breadth few clinical-stage peers match
      and the mechanistic core of its "matchmaking" thesis.
    claimRefs:
      - CE006
      - CE034
  - calloutType: insight
    title: Degraders can drug the undruggable
    body: >-
      TLN-121 exploits targeted protein degradation to eliminate BCL6, a transcription factor lymphomas depend on that
      occupancy inhibitors struggle to drug — a mechanistic advantage if the early single-agent activity signal holds.
    claimRefs:
      - CE022
      - CE024
  - calloutType: risk
    title: No human proof-of-concept yet
    body: >-
      Every Treeline program is still in Phase 1 with only early tolerability and exposure signals; there is no pivotal
      human efficacy proof-of-concept, so the entire technology thesis remains scientifically unvalidated in patients as
      of 2026.
    claimRefs:
      - CE033
      - CE012
