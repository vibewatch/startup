company:
  name: Treeline Biosciences
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Treeline’s product is a broad, oral, small-molecule oncology pipeline — TLN-121 (BCL6 degrader), TLN-372 (pan-KRAS
    inhibitor), TLN-254 (EZH2 inhibitor) and TLN-499 (BCL-XL degrader) — built on four in-house platforms (inhibitors,
    degraders, TT-ADCs and computational design). The technology breadth is genuinely differentiated, but every program
    is Phase 1 with only early tolerability/exposure signals and no human efficacy proof-of-concept as of 2026.
sections:
  - id: assets
    title: Pipeline Assets and Mechanisms
    body: >-
      Treeline’s product is its pipeline of four disclosed oral small molecules plus three undisclosed programs. TLN-121
      is an internally discovered BCL6 protein degrader in a Phase 1 lymphoma trial (NCT07082803); because BCL6 is a
      transcription-factor oncogene that lymphoma cells co-opt to survive, degrading it removes a survival dependency
      that occupancy inhibitors struggle to address. TLN-372 is an internally discovered pan-KRAS inhibitor engineered
      for deep, continuous inhibition across KRAS variants while sparing HRAS and NRAS to limit toxicity, reaching the
      roughly 87% of KRAS mutations beyond G12C. TLN-254 is an EZH2 inhibitor in-licensed from Hengrui after Phase 2 in
      China and now in a Phase 1 (NCT06733441) in T-cell lymphomas. TLN-499 is a selective BCL-XL degrader expected in
      the clinic in 2026, designed to spare platelets. All four are oral, supporting outpatient dosing and combinations.
    claimRefs:
      - CE001
      - CE002
      - CE024
      - CE003
      - CE019
      - CE025
      - CE004
      - CE026
      - CE005
