callouts:
  - calloutType: risk
    title: The binding risk is scientific, not financial
    body: >-
      Treeline is exceptionally well-funded, but oncology has among the lowest Phase 1-to-approval success rates of any
      field and Treeline has no human proof-of-concept yet, so the dominant risk is that its programs simply fail to
      show efficacy — a risk no amount of capital can retire before the 2027 readouts.
    claimRefs:
      - CR005
      - CR004
  - calloutType: risk
    title: 'Concentrated dependencies: founders, Hengrui and the merger'
    body: >-
      Value hinges on a small set of single points of failure — two founders whose reputations anchor the model, a
      China-licensed EZH2 asset with geopolitical exposure, and a pending reverse merger that must clear a shareholder
      vote — any of which could impair the thesis if it breaks.
    claimRefs:
      - CR018
      - CR008
      - CR013
  - calloutType: recommendation
    title: Watch kill criteria and 2027 catalysts
    body: >-
      Diligence should focus on whether Treeline enforces clear go/no-go kill criteria, how it protects runway if the
      merger slips, and how each 2027 interim readout could cascade into a company-wide revaluation given concentrated
      catalysts.
    claimRefs:
      - CR016
      - CR030
