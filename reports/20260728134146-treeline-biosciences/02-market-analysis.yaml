      whyItMatters: Divergent KRAS and degrader forecasts prevent a single credible addressable-market figure for valuation.
      diligencePath: >-
        Commission a bottom-up model tied to biomarker prevalence, penetration and pricing; triangulate DelveInsight,
        DataIntelo and Evaluate.
      relatedQuestionRefs:
