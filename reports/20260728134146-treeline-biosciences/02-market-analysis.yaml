company:
  name: Treeline Biosciences
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Treeline’s addressable market is mechanism-defined targeted oncology — pan-KRAS solid tumors and BCL6/EZH2/BCL-XL
    lymphoma niches — bounded by a >$200B global oncology market, a KRAS inhibitor market growing toward ~$2.9B and a
    degrader market toward >$13B by 2034, but constrained by heavy competition, payer scrutiny and ~90% oncology
    attrition.
sections:
  - id: market-boundary
    title: Market Boundary and Substitutes
    body: >-
      Treeline’s market is best defined by mechanism and indication rather than by a single broad label. The relevant
      included spend is targeted oncology therapeutics for genetically defined tumors: pan-KRAS and KRAS-mutant agents
      for solid tumors, BCL6-directed degraders for B-cell lymphoma, EZH2 inhibitors for T-cell lymphoma, and selective
      BCL-XL degraders. Excluded from this boundary are non-targeted chemotherapy, surgery, radiation and all
      non-oncology spend. The status-quo Treeline must displace is defined by chemotherapy, immunotherapy, the approved
      KRAS G12C inhibitors sotorasib and adagrasib, and the first-in-class EZH2 inhibitor tazemetostat. Adjacencies —
      combination regimens, additional KRAS indications, and future neurology and immunology programs — provide
      optionality but are not part of the current addressable market.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM032
      - CM031
    tableRefs:
      - TM001
  - id: sizing
    title: Sizing the Opportunity Across Multiple Lenses
    body: >-
      No single TAM captures Treeline’s opportunity, so we bound it with several lenses. The broadest is the global
      oncology drugs market, which exceeds $200 billion and grows at double-digit rates. Narrower mechanism lenses are
      more relevant: the KRAS inhibitor market was about $526 million in 2025 and is forecast to reach roughly $2.9
      billion by 2034, while the targeted protein degrader market was around $2 billion in 2025 and is projected to
      exceed $13 billion by 2034. Disease-incidence lenses show roughly 26,000 US DLBCL cases annually (about 150,000
      globally), 80,000-90,000 total NHL cases, and only a few thousand PTCL and CTCL cases. KRAS mutations appear in
      about a quarter of adult cancers with non-G12C variants dominating, and BCL6 is overexpressed in 40-50% of DLBCL —
      large biological substrates that these dollar forecasts only partly monetize.
    claimRefs:
      - CM018
      - CM004
      - CM005
      - CM006
      - CM007
      - CM008
      - CM009
      - CM010
      - CM011
      - CM028
    tableRefs:
      - TM002
    figureRefs:
      - FM001
      - FM002
  - id: buyers
    title: Buyers, Payers and the Adoption Path
    body: >-
      The buyers of Treeline’s future products are medical and hematologist-oncologists at academic and community cancer
      centers, but the economic decision rests with payers — Medicare and commercial insurers in the US, HTA bodies and
      national health systems in Europe, and the NRDL in China. The adoption path for a new oncology drug runs from FDA
      approval, frequently via accelerated approval, through NCCN guideline inclusion, payer formulary listing,
      companion biomarker testing, and finally prescribing. Because rare lymphoma prescribing concentrates in a limited
      set of academic centers, launch and trial-site strategy overlap. Geography matters: the US leads on pricing and
      access, the EU adds volume under tighter reimbursement, and China provides a separate regime relevant to the
      Hengrui-licensed EZH2 asset. An illustrative funnel shows substantial attrition from diagnosed population to
      treated patients.
    claimRefs:
      - CM012
      - CM013
      - CM014
      - CM021
      - CM023
      - CM034
      - CM035
    tableRefs:
      - TM003
    figureRefs:
      - FM003
      - FM004
  - id: drivers-constraints
    title: Drivers, Constraints and Sizing Gaps
    body: >-
      Demand drivers are real: a very large non-G12C KRAS population, growing clinical validation of protein degradation
      as a modality, rising precision-oncology biomarker testing, and accelerated regulatory pathways that can compress
      time-to-market. But the constraints are equally material. The field is crowded, with more than 120 KRAS programs
      in Phase 2/3 and Revolution Medicines already in Phase 3 with a pan-RAS inhibitor that defines the competitive
      frontier; approved G12C incumbents set the efficacy and pricing bar; payers increasingly demand biomarker-defined
      populations and outcomes data; and oncology development still fails roughly 90% of the time. Finally, the sizing
      itself is uncertain — KRAS and degrader forecasts diverge by publisher and are revised frequently — so a
      defensible SAM or SOM for Treeline cannot yet be isolated and is preserved here as a diligence gap rather than a
      point estimate.
    claimRefs:
      - CM015
      - CM025
      - CM023
      - CM016
      - CM017
      - CM029
      - CM019
      - CM035
      - CM022
      - CM033
      - CM024
      - CM027
      - CM026
      - CM030
    tableRefs:
      - TM004
  - id: segmentation-conclusion
    title: Segmentation Within Degraders and Net Read
    body: >-
      A final lens separates Treeline’s programs by both modality and disease compartment. Within targeted protein
      degradation, its BCL6 (TLN-121) and future BCL-XL (TLN-499) assets address hematologic malignancies, while its
      pan-KRAS inhibitor TLN-372 competes in solid tumors and its in-licensed EZH2 inhibitor TLN-254 sits in rare T-cell
      lymphomas. Each compartment carries a different competitive intensity and payer profile: solid-tumor KRAS is the
      largest but most contested, B-cell lymphoma is a validated but crowded degrader niche, and T-cell lymphoma is
      smaller yet comparatively open because tazemetostat is focused elsewhere. Net, the market is genuinely large in
      biological terms — a quarter of adult cancers carry KRAS mutations and roughly 1.25 million new US and EU patients
      are implicated annually — but the monetizable, reimbursable slice available to a Phase 1 entrant is narrower and
      gated by competition, biomarker access and pricing. The disciplined read is a large, growing, but heavily
      contested opportunity whose realizable value depends almost entirely on differentiated clinical data.
    claimRefs:
      - CM030
      - CM031
      - CM028
      - CM017
      - CM020
      - CM027
