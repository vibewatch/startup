callouts:
  - calloutType: insight
    title: Non-G12C KRAS is the largest unaddressed prize
    body: >-
      Because approved drugs only hit the G12C mutation — about 13% of KRAS cases — the roughly 87% of KRAS mutations
      that are non-G12C represent a very large, still-unaddressed population that Treeline’s pan-KRAS TLN-372 is
      designed to reach.
    claimRefs:
      - CM009
      - CM017
  - calloutType: risk
    title: A crowded, fast-moving competitive field
    body: >-
      With more than 120 KRAS programs in Phase 2/3 and Revolution Medicines already in Phase 3 with a pan-RAS
      inhibitor, the addressable share available to a Phase 1 entrant like Treeline is constrained and could erode
      further before its own data mature.
    claimRefs:
      - CM019
      - CM029
  - calloutType: assumption
    title: Sizing must be a range, not a point
    body: >-
      KRAS and degrader forecasts differ widely by publisher and methodology and are revised frequently, so this
      analysis carries ranges rather than a single TAM and preserves the contradictions for diligence.
    claimRefs:
      - CM022
      - CM033
