callouts:
  - calloutType: insight
    title: The "customers" are trial patients and cancer centers
    body: >-
      Treeline is pre-commercial, so it has no paying customers; its de-facto customers are heavily pretreated trial
      patients and the flagship academic cancer centers — MSK, MD Anderson, Dana-Farber, City of Hope and Europe’s VHIO
      — that enroll them, with payers and prescribers only becoming customers after approval.
    claimRefs:
      - CU001
      - CU004
      - CU005
  - calloutType: risk
    title: Enrollment competition and site concentration
    body: >-
      A crowded KRAS and lymphoma trial landscape makes recruitment slower and costlier, and Treeline’s reliance on a
      small set of flagship centers concentrates operational and data-quality dependence — a genuine customer-side risk
      before any commercial base exists.
    claimRefs:
      - CU016
      - CU028
  - calloutType: assumption
