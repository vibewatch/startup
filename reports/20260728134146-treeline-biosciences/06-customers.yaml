company:
  name: Treeline Biosciences
chapter:
  number: 6
  title: Customers
  summary: >-
    Treeline is pre-commercial with no paying customers; its de-facto customers are heavily pretreated Phase 1 trial
    patients and flagship academic cancer centers (MSK, MD Anderson, Dana-Farber, City of Hope, VHIO) that enroll them.
    Demand and clinician receptivity are strong, but enrollment counts, retention and satisfaction data are undisclosed,
    and reliance on a few centers plus crowded KRAS/lymphoma trials pose enrollment and concentration risk.
sections:
  - id: who-are-customers
    title: Who Treeline’s Customers Are
    body: >-
      Treeline is a pre-commercial, clinical-stage company, so it has no paying customers and no revenue-generating
      customer relationships as of the July 2026 run date. The meaningful "customers" today are the heavily pretreated
      relapsed/refractory patients enrolled in its Phase 1 trials and the academic cancer centers and investigators that
      conduct those trials, while the true paying customers — payers such as Medicare, commercial insurers and European
      health systems, and the oncologists who prescribe — only emerge after regulatory approval. The enrolled
      populations are specific: relapsed/refractory B-cell and T-cell lymphoma patients for the BCL6 degrader TLN-121
      and the EZH2 inhibitor TLN-254, and KRAS-altered solid-tumor patients for the pan-KRAS TLN-372. This segmentation,
      from patients and sites today to payers and prescribers tomorrow, frames the entire customer analysis and its
      gaps.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU017
      - CU020
      - CU022
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: sites-proof
    title: Named Trial Sites and Enrollment
    body: >-
      The clearest customer proof available for a clinical-stage company is its trial-site network. Public cancer-center
      listings and registries identify participation by Memorial Sloan Kettering (TLN-121 lymphoma), MD Anderson
      (TLN-372 KRAS solid tumors), Dana-Farber (TLN-254 T-cell lymphoma) and City of Hope, with European enrollment
      supported by centers such as the Vall d’Hebron Institute of Oncology. These are among the most respected oncology
      institutions, which strengthens data quality and investigator credibility. Exact per-trial enrollment counts are
      not disclosed, but Phase 1 dose-escalation cohorts typically enroll tens of patients per program, and with
      three-to-four programs open aggregate enrollment is scaling through 2026 toward the interim readouts planned for
      2027. The named-site roster here is a partial, publicly identifiable sample rather than an exhaustive list, which
      Treeline has not released in full.
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU025
      - CU031
      - CU019
    tableRefs:
      - TU003
    figureRefs:
      - FU003
  - id: demand-adoption
    title: Demand, Access and the Adoption Path
    body: >-
      Underlying patient demand is substantial and supports enrollment: roughly 26,000 US DLBCL cases a year, a quarter
      of adult cancers carrying KRAS mutations, and rare but underserved T-cell lymphomas together create a large pool
      of patients with poor relapsed/refractory survival who actively seek trial access, often via patient-advocacy
      referral channels. The adoption path for these "customers" runs from trial enrollment and early activity signals
      toward approval, guideline inclusion, formulary access and eventual prescribing to commercial patients — a
      multi-year funnel with heavy attrition at each step. Key opinion leaders describe strong clinician receptivity to
      pan-KRAS and BCL6-degrader mechanisms given the unmet need, a useful proxy for future adoption, and Treeline has
      reported encouraging early single-agent activity for TLN-121. None of this, however, substitutes for the efficacy
      data that will ultimately convert clinical interest into commercial demand.
    claimRefs:
      - CU011
      - CU021
      - CU018
      - CU029
      - CU010
      - CU013
      - CU026
      - CU023
    tableRefs:
      - TU002
    figureRefs:
      - FU002
  - id: retention-expansion-risk
    title: Retention, Expansion and Concentration Risk
    body: >-
      Traditional retention and satisfaction metrics do not apply to a pre-commercial biotech, so we reframe them:
      retention becomes time on therapy without progression, repeat usage becomes continuation until progression or
      toxicity, and satisfaction becomes clinician and patient receptivity — none of which Treeline has yet quantified,
      leaving the illustrative cohort figures as placeholders. Expansion of the customer base would come from additional
      indications and combinations, expansion cohorts, and geographic broadening into the EU and beyond, which also
      diversifies regulatory exposure. The principal near-term risk is concentration: Treeline’s enrollment leans on a
      small set of flagship academic centers, which speeds high-quality recruitment but concentrates operational and
      data dependence, and it does so in a crowded KRAS and lymphoma trial landscape where recruitment is slower and
      costlier. Exact enrollment counts and structured outcome data remain the key gaps.
    claimRefs:
      - CU012
      - CU027
      - CU030
      - CU014
      - CU024
      - CU015
      - CU028
      - CU016
    tableRefs:
      - TU004
      - TU005
    figureRefs:
      - FU004
  - id: net-customer-read
    title: Net Customer Read
    body: >-
      Synthesizing the clinical-stage customer picture, Treeline presents a high-quality but pre-commercial footprint.
      On the strength side, it enrolls heavily pretreated patients with genuine unmet need through some of the world’s
      most respected cancer centers across the US and a growing European network, and clinician and patient demand for
      its mechanisms is durable enough that trial-slot demand is unlikely to be the binding constraint. On the caution
      side, there is no commercial customer base, no revenue, and no disclosed enrollment counts, retention or
      patient-reported-outcome data, so the entire analysis is a leading indicator of eventual demand rather than
      evidence of it. The practical conclusion is that Treeline’s customer story today is really a trial-execution
      story: whether it can enroll fast enough in a crowded landscape, keep responders on therapy, and convert
      flagship-site credibility into the efficacy data that will ultimately create a paying customer base beginning only
      after approval.
    claimRefs:
      - CU035
      - CU034
      - CU032
      - CU033
      - CU015
      - CU020
