  productSummary: >-
    A pipeline of four oral small-molecule oncology programs — TLN-121 (BCL6 protein degrader), TLN-372 (pan-KRAS
    inhibitor), TLN-254 (EZH2 inhibitor, in-licensed from Hengrui) and TLN-499 (BCL-XL degrader) — built on four
    in-house platforms: small-molecule inhibitors, protein degraders (PROTACs/molecular glues), targeted-therapy
    antibody-drug conjugates, and computational drug design.
  customerFocus: >-
    Pre-commercial; de-facto customers are heavily pretreated Phase 1 trial patients and flagship academic cancer
