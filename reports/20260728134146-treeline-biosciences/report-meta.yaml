summary:
  headline: >-
    Treeline pairs Loxo-caliber founders, a broad multi-modality platform and >$900M of pro-forma cash with a
    complete absence of human proof-of-concept, making its ~$2.5B implied valuation a cash-supported option that
    only 2027 clinical data can re-rate.
