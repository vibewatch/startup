companyProfile:
  summary: >-
    Treeline Biosciences is a Watertown, Massachusetts-based clinical-stage oncology company founded in 2021 by
    Josh Bilenker, MD (founder of Loxo Oncology, sold to Eli Lilly for ~$8B) and Jeff Engelman, MD, PhD (ex-Global
    Head of Oncology at Novartis NIBR). It has raised approximately $1.2 billion from a syndicate including ARCH,
    OrbiMed, GV, KKR, T. Rowe Price and Fidelity, and pursues a diversified, build-for-scale model spanning
    small-molecule inhibitors, protein degraders and targeted antibody-drug conjugates. Its pipeline comprises
    three Phase 1 programs — TLN-121 (BCL6 degrader), TLN-372 (pan-KRAS inhibitor) and TLN-254 (EZH2 inhibitor) —
    with TLN-499 (BCL-XL degrader) entering the clinic in 2026. In June 2026 it announced an all-stock reverse
    merger with Standard BioTools (Nasdaq: LAB) that would give Treeline shareholders ~84% of a combined company
    trading as TRLN with more than $900 million of pro-forma cash and runway into 2029; the deal is pending a
    shareholder vote as of the run date.
