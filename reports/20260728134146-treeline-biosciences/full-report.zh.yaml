      - number: '2.3'
        title: 买方、支付方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Treeline 未来产品的买方是学术和社区癌症中心的内科肿瘤医生与血液肿瘤医生，但经济决策在支付方手里——美国的 Medicare 和商业保险、欧洲的 HTA 机构和国家医疗体系，以及中国的
              NRDL。一款新肿瘤药的采用路径从 FDA 批准开始，常常经由加速批准，再进入 NCCN
              指南、支付方目录、伴随生物标志物检测，最后才到开方。罕见淋巴瘤开方集中在有限的学术中心，因此上市策略与试验中心策略会重叠。地域也重要：美国在定价和准入上领先，欧盟在更严格报销下贡献量，中国则为 Hengrui
              授权的 EZH2 资产提供另一套相关制度。一个示意漏斗显示，从确诊人群到治疗患者会经历大量流失。
            claimRefs:
              - CM012
