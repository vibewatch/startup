            body: >-
              Treeline 的风险由少数高度集中的依赖项塑形。Hengrui 授权的 TLN-254 是一项已在中国获批、经外部验证的资产，但也把美国-中国地缘政治、监管和供应风险带进来；内部发现项目没有这类暴露。与
              Standard BioTools 的合并是第二个重大依赖：它带来约 $450M 现金和 Nasdaq 上市地位，但取决于股东投票，旧资产剥离也会分散注意力并可能造成价值流失。人员和执行风险集中在创始人 Josh
              Bilenker 与 Jeff Engelman
              身上，两人的声誉支撑策略和估值；目前没有离职记录，但创始人中心型生物技术公司关键人风险更高。最后，多项目、按规模搭建的模式虽能分散风险，却把资本和管理注意力摊到数个同步 1 期试验上；Treeline
              还没在这种规模下验证这种打法，焦点可能被稀释。
