      - number: '5.5'
        title: 技术净判断
        blocks:
          - type: paragraph
            body: >-
              合在一起看，Treeline 的产品与技术位置，是罕见宽度和真实机制复杂度，与完全缺乏人体疗效验证并存。正面看，公司可以用最适合的模态攻击靶点——pan-KRAS 用占位型抑制剂，BCL6 和 BCL-XL
              用降解剂，也可用抗体偶联药物——这些都在内部发明，并由横跨美国和欧洲实验室的计算设计加速；公司已经把三个项目推进注册 Phase 1 试验，第四个将在 2026
              年进入临床。谨慎面在于，抗体偶联药物支柱仍处临床前，平台可重复发明的主张还没有在规模上证明，所有临床资产也都只是基于早期耐受性和暴露信号，而不是疗效。克制的判断是：这是一台可信、资源充足的技术引擎，但真正价值完全取决于
              2027 年中期读出能否证明宽度会转化为临床胜利。
            claimRefs:
              - CE035
              - CE006
              - CE034
              - CE030
              - CE033
              - CE016
