            body: Treeline 已在内部打通小分子抑制剂、蛋白降解剂和抗体偶联药物，并连接计算设计，让公司可以为每个靶点选择最佳模态——这种宽度是少数临床阶段同业才具备的，也是其「matchmaking」命题的机制核心。
