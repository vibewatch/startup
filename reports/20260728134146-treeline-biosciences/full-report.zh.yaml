      - number: '5.3'
        title: 从发现到临床的工作流与试验
        blocks:
          - type: paragraph
            body: >-
              Treeline 的运营工作流从靶点选择和模态匹配开始，经由内部发明和内置临床前淘汰筛，只把最有希望的候选物向前推进，再进入首次人体 Phase 1 试验；这些试验采用剂量递增和扩展队列设计，符合 FDA 指引和
              Project Optimus 对剂量优化的预期。2025 年，TLN-121、TLN-372 和 TLN-254 三个项目开启 Phase 1 试验，并在 ClinicalTrials.gov 注册。公司披露了
              TLN-121 早期广泛单药活性和耐受性的临床证据，称 TLN-372 游离药物暴露与临床前预测一致，同时 TLN-254
              显示出与其中国发表数据一致的活性和安全性。这些都是鼓舞人的方向性信号，但还达不到关键疗效概念验证；这套工作流要从 2027 年中期读出开始产出这种验证。
