            body: >-
              首要风险是科学风险。肿瘤学从 1 期走到获批的成功率在各治疗领域中处在最低一档，历史上只有几个百分点；Treeline 还没有人体疗效概念验证，因此基准概率意味着其大多数项目会失败，整个平台假设在 2027
              年读出前都未经验证。运营上，公司必须协调美国和欧洲实验室的研发，最终解决 CMC 和生产放大，并在少数旗舰中心集中执行临床试验；KRAS 和淋巴瘤赛道拥挤，入组更慢、成本更高。竞争上，Revolution
              Medicines 处于 3 期的 pan-RAS 领先项目是直接威胁，可能在 TLN-372 成熟前定义 pan-KRAS 市场；已获批的 tazemetostat 也为 TLN-254
              设定了差异化门槛。计算平台的数据安全暴露没有披露，仍是一个缺口。
