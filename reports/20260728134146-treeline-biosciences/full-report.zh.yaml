      - number: '8.3'
        title: 情景、可比公司与方法
        blocks:
          - type: paragraph
            body: >-
              因为 Treeline 还没有收入，正确估值视角不是任何盈利倍数，而是风险调整后的管线 NPV 加净现金；价值对假设的临床成功概率高度敏感——每个项目概率移动几个百分点，rNPV
              就会变动数亿美元。情景分析给隐含基准案例设边界：如果领先项目失败或合并破裂，熊市情景接近约 $1B 现金底；基准情景约为隐含 $2.5B；若多个项目成功，牛市情景可达 $5B
              或更高。临床阶段肿瘤可比公司给出区间：早期降解剂玩家 C4 Therapeutics 低于 $1B，Kymera 处在低数十亿美元，Revolution Medicines 作为已去风险的 3
              期龙头获得数十亿美元估值——这正说明临床去风险值多少钱。Treeline 隐含约 $2.5B 处在区间中部，符合其广度，但也符合其未经验证的阶段。
