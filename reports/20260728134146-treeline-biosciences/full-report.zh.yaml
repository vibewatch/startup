chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与商业模式
        blocks:
          - type: paragraph
            body: >-
              Treeline Biosciences 是一家临床阶段肿瘤公司，2021 年创立，总部位于 Massachusetts 州 Watertown，并在 California 州 San Diego 和
              Switzerland Basel
              设有研究运营。公司自称使命是把经过验证的疾病靶点与成熟药物模态匹配起来——小分子抑制剂、蛋白降解剂和靶向抗体偶联药物——再用内部计算工具支撑，从而可靠、反复地做出好药。典型单资产生物科技公司往往只押一个项目，Treeline
              则有意走多元化、按规模化搭建的路线，为多个时间线和技术风险互补的项目配置资源。截至 2026 年 7 月本次运行日期，公司仍为私营、尚无收入，正在推进三个 Phase 1 肿瘤项目，第四个项目将在 2026
              年进入临床，并已宣布一项反向并购，若完成将以 TRLN 在 Nasdaq 上市。
