          - type: paragraph
            body: >-
              在资本端，Treeline 的深厚资产负债表是一把双刃剑：预计超过 $900M 的备考现金为未来三年运营降风险，但在任何概念验证前已投入约
              $1.2B，资本效率风险被集中；如果合并失败，公司会失去注入现金和上市地位，在选择性融资市场暴露再融资风险。上述风险不是孤立存在，而会传导并叠加：科学挫折会引发临床执行和融资风险；由于价值集中在少数 2027
              年催化剂上，单个负面读出就可能重估整家公司。缓释因素真实但不充分：四种机制分散的组合、合并后现金垫、与 FDA
              对齐的试验设计，以及公司所称临床前淘汰标准都有帮助，但都无法移除平台层面的科学风险。因此尽调应优先看三件事：淘汰标准执行纪律、合并延迟时的资金跑道保护、估值对每个催化剂的敏感性。
            claimRefs:
              - CR012
              - CR013
              - CR026
              - CR017
              - CR030
              - CR016
              - CR027
              - CR028
              - CR031
          - type: table
            tableRef: TR005
            claimRefs:
              - CR016
              - CR027
              - CR028
              - CR011
      - number: '7.5'
        title: 净风险判断与催化剂集中度
        blocks:
          - type: paragraph
            body: >-
              合并来看，Treeline 的主要风险异常集中且彼此相关。公司价值押在少数近期临床催化剂上——领先项目首批有意义的 1 期数据大约会在 2027
              年一起到来——所以单个领先项目读出不及预期，可能触发全公司大幅重估，而不是孤立减记。叠加其上的是一项待决且依赖投票的合并、一项带地缘政治暴露的中国授权资产，以及两位以声誉锚定投资假设的创始人。最强抵消因素是资本：预计超过
              $900M 的备考现金可支撑约三年运营，上市公司董事会也带来治理和资本纪律；协调一致的 FDA 与 EMA 框架、清晰的临床前淘汰标准进一步约束执行风险。总体看，Treeline
              资金充足，但上行和下行都不成比例地取决于未经验证的科学和合并完成；逐个催化剂、守纪律跟踪，是正确的尽调姿态。
            claimRefs:
              - CR034
              - CR035
              - CR036
              - CR032
              - CR033
              - CR037
              - CR038
              - CR039
              - CR040
              - CR041
              - CR042
      - number: '7.6'
        title: 附表
        blocks:
          - type: callout
            title: 约束风险是科学，不是财务
            body: >-
              Treeline 资金极其充足，但肿瘤学从 1 期到获批的成功率在各领域中处在最低一档，Treeline 还没有人体概念验证；因此主导风险是项目根本做不出疗效——在 2027
              年读出前，再多资本也无法消除这项风险。
            calloutType: risk
            claimRefs:
              - CR005
              - CR004
          - type: callout
            title: 依赖项集中：创始人、Hengrui 和合并
            body: 价值押在少数单点失败上：两位以声誉锚定模型的创始人、一项带地缘政治暴露的中国授权 EZH2 资产，以及一项必须通过股东投票的待决反向合并；任一环断裂都可能损害投资假设。
            calloutType: risk
            claimRefs:
              - CR018
              - CR008
              - CR013
          - type: callout
            title: 盯住淘汰标准和 2027 年催化剂
            body: 尽调应看 Treeline 是否执行清晰的推进 / 叫停标准，若合并延迟如何保护资金跑道，以及在催化剂集中的情况下，每个 2027 年中期读出会如何传导成全公司重估。
            calloutType: recommendation
            claimRefs:
              - CR016
              - CR030
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与隐含估值
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 7 月本次报告日，我们对 Treeline 的立场是继续研究：这是一个质量高、资本极其充足的平台，但在 2027 年临床数据开始到来前，其估值无法被有把握地承销。2026 年反向合并对
              Treeline 股东隐含约 $2.5B 股权价值——该数值来自 Treeline 股东约 84% 持股，以及 Standard BioTools 贡献价值约 $470M，对应合并后企业价值约
              $2.9B——Form S-4 确定了换股比例和所有权基础。关键在于，Treeline 从未披露过协商确定的投前估值，因此该数字不是敲定价格，而是根据持股比例和 Standard BioTools 可观察的
              LAB 市值推算。相对约 $1.2B 已融资本，隐含价值只提高约 2 倍，且其中超过 $900M 是备考现金，所以投资者尚未为投机性溢价支付很高价格。
