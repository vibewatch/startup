        blocks:
          - type: paragraph
            body: >-
              Treeline 是一家尚无收入的临床阶段公司：截至 2026 年 7
              月本次运行日期，公司没有产品销售、没有经常性收入，也没有披露合作或里程碑收入。因此它的收入模型完全是前瞻性的，遵循标准生物医药逻辑——计算发现和内部发现先进入临床前淘汰筛，存活下来的候选物推进 Phase 1-3
              临床开发，只有在获得监管批准并产生产品销售后才兑现价值，任何阶段也都可以选择对外授权。已获批靶向肿瘤小分子药具备六位数年度定价和高毛利，最终变现潜力有吸引力，但还在多年之后，并且取决于临床成功。合并中产生的或有价值权利不是公司收入：它从遗留资产收益和
              Illumina / SomaLogic earnout 中归属于 Standard BioTools 股东，因此不应与 Treeline 自身变现混同。
