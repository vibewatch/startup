      - number: '5.2'
        title: 技术平台与架构
        blocks:
          - type: paragraph
            body: >-
              资产之下是一套有意做宽的技术栈。Treeline 已在内部打通四个平台——小分子抑制剂、蛋白降解剂（PROTACs
              和分子胶）、靶向治疗抗体偶联药物，以及计算药物设计工具——其所谓「matchmaking」理念，是把每个疾病靶点与最可能实现成药化的模态配对。公司把基于物理和机器学习的计算方法与经典药物化学结合，加速候选物设计，并正在招聘化学信息学和
              ML 工程人才来加深这项能力。关键研究在内部完成，横跨 Watertown、San Diego 的美国实验室和 Basel 的欧洲实验室。架构宽度确实具备差异化，但抗体偶联药物层仍处临床前，尚未披露 ADC
              临床候选物，因此平台生产力主张仍有一部分是愿景。
