      - number: '8.2'
        title: 正方假设、反方假设与 Loxo 先例
        blocks:
          - type: paragraph
            body: >-
              多头假设在输入项上确实有吸引力：Loxo 级别创始人，同一 CEO 此前交付 3 项 FDA 批准和约 $8B 退出；一个覆盖多种技术路线的发现引擎；巨大且大体未被满足的非 G12C KRAS
              机会；以及可支撑运营到 2029 年的资产负债表。空头反假设同样清楚：没有人体概念验证，Revolution Medicines 的 pan-RAS 抑制剂已在 3 期，任何数据前已花掉约
              $1.2B，通往公开市场还依赖一项以股东投票为条件的合并，并且会带入 Standard BioTools 的剥离复杂性。Loxo
              先例是最强的多头锚——它证明这支团队能打造定义品类的药物——但先例不是证据；更守纪律的净判断是，每项优势都对应一项具体且尚未解决的风险。
            claimRefs:
              - CV006
              - CV007
              - CV019
              - CV036
              - CV010
