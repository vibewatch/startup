  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Treeline 的市场最好按机制和适应症来界定，而不是套进一个宽泛标签。应纳入的相关支出，是面向基因定义肿瘤的靶向肿瘤疗法：用于实体瘤的 pan-KRAS 与 KRAS 突变药物、用于 B 细胞淋巴瘤的
              BCL6 靶向降解剂、用于 T 细胞淋巴瘤的 EZH2 抑制剂，以及选择性 BCL-XL 降解剂。边界之外是非靶向化疗、手术、放疗以及所有非肿瘤支出。Treeline 必须替代的现状由化疗、免疫治疗、已获批
              KRAS G12C 抑制剂 sotorasib 和 adagrasib，以及同类首创 EZH2 抑制剂 tazemetostat 共同定义。相邻机会——联合用药、更多 KRAS
              适应症，以及未来神经和免疫项目——提供可选性，但不属于当前可服务市场。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM032
              - CM031
          - type: table
            tableRef: TM001
            claimRefs:
