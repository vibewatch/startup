        title: 管线资产与机制
        blocks:
          - type: paragraph
            body: >-
              Treeline 的产品就是其四个已披露口服小分子项目加三个未披露项目组成的管线。TLN-121 是内部发现的 BCL6 蛋白降解剂，正在进行 Phase 1 淋巴瘤试验（NCT07082803）；由于 BCL6
              是淋巴瘤细胞挟持来维持生存的转录因子癌基因，降解 BCL6 可以移除一种生存依赖，而占位型抑制剂很难处理这一点。TLN-372 是内部发现的 pan-KRAS 抑制剂，被设计为跨 KRAS
              变体实现深度、持续抑制，同时避开 HRAS 和 NRAS 以限制毒性，覆盖 G12C 之外约 87% 的 KRAS 突变。TLN-254 是从 Hengrui 引进的 EZH2 抑制剂，在中国完成 Phase 2
              后，目前在 T 细胞淋巴瘤中进行 Phase 1（NCT06733441）。TLN-499 是选择性 BCL-XL 降解剂，预计 2026
              年进入临床，设计上旨在避开血小板。四个项目均为口服，支持门诊给药和联合用药。
