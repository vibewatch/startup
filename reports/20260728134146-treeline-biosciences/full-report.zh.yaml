      - number: '8.5'
        title: 净估值判断
        blocks:
          - type: paragraph
            body: >-
              综合来看，Treeline 的估值最适合理解为一个由现金支撑的看涨期权，标的是一条广泛、创始人主导的肿瘤管线；今天定价大致公平，只有 2027
              年临床读出能让它大幅重估，方向可能向上也可能向下。下行有部分保护：超过 $900M
              的备考现金限制了股权相对无现金临床阶段同行的下跌空间；上行则由一支曾打造数十亿美元肿瘤业务的管理团队锚定。但回报曲线是二元且催化剂集中；没有尚未公开的单项目 rNPV
              输入，无法搭出精确独立估值；最高关注度项目上已有 3 期竞争者领先。结论是中等置信度、高风险评级下的继续研究建议：有吸引力的团队和资产负债表，本身不足以支持在决定结果的数据到来前投入资本。
            claimRefs:
              - CV037
              - CV029
              - CV033
              - CV035
              - CV023
              - CV016
              - CV022
      - number: '8.6'
        title: 附表
        blocks:
          - type: callout
            title: 继续研究：由现金支撑、押注未验证科学的期权
            body: >-
              Treeline 把 Loxo 级别创始人、宽管线平台和超过 $900M 备考现金，与完全缺失的人体疗效数据放在一起；因此其约 $2.5B 隐含估值最好被视为定价大致合理的看涨期权，只有 2027
              年读出才能重估——明确是继续研究，而不是买入。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV037
          - type: callout
            title: 资本仅约 2 倍抬升
            body: 约 $2.5B 隐含股权价值约为已融资 $1.2B 的两倍，且超过三分之一是现金，所以投资者尚未在现金加早期管线之上支付很大投机溢价——上行（和下行）几乎全在临床数据里。
            calloutType: insight
            claimRefs:
              - CV005
              - CV017
          - type: callout
            title: 回报二元，催化剂集中
            body: 价值集中在 2027 年中期读出，且 KRAS 已有 3 期竞争者领先，因此回报高波动且二元：强劲的领先项目读出可能让股权价值约翻倍，失败则可能把价值推向接近 $1B 的现金底。
            calloutType: risk
            claimRefs:
              - CV033
              - CV020
