  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Treeline 的监管和法律风险横跨其科学项目与待完成交易。临床端，所有首次人体肿瘤项目一旦出现安全信号，都可能面临 FDA 临床暂停；Project Optimus
              下现代剂量优化预期，即便对有活性的项目也抬高了证据门槛；欧洲入组还增加 EMA 监管和多司法辖区暴露。交易端，全股票反向并购必须通过 Standard BioTools
              股东投票和监管批准；法律评论和公开案卷显示，这类交易常围绕投票和披露引发股东诉讼。知识产权和实施自由风险也存在于拥挤的降解剂与 KRAS
              化学空间，重叠申请可能引发争议。对临床阶段生物科技公司来说，这些风险并不异常，但合在一起构成了有意义的监管-法律暴露面，S-4 风险因素本身也逐项列出。
