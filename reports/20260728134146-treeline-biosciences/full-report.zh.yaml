            body: >-
              等待数据的立场只有配上清晰监控清单才可执行。会打破假设的触发点包括：领先项目失败或临床暂停、Revolution Medicines 取得决定性疗效胜利、合并终止、创始人离职，或现金 /
              跑道短缺并被迫稀释。对应尽调问题——多数需要私有数据或交割后文件——包括 S-4 财务和烧钱率、每个项目的 rNPV 输入、Hengrui 授权条款、股权结构和优先权、完整临床中心和入组数据，以及 CVR
              和剥离协议。时点也重要：合并预计在 2026 年下半年完成，因此实际进入点取决于交易完成和任何交割前数据；CVR 价值归 Standard BioTools 持有人，而不是 Treeline 股东。LAB
              的分析师目标价覆盖已经反映待决合并，而非独立组学基本面。
