      - number: '2.5'
        title: 降解剂内部细分与净判断
        blocks:
          - type: paragraph
            body: >-
              最后一层视角同时按模态和疾病分区拆分 Treeline 的项目。在靶向蛋白降解内部，BCL6（TLN-121）和未来 BCL-XL（TLN-499）资产面向血液系统恶性肿瘤；pan-KRAS 抑制剂
              TLN-372 竞争实体瘤；引进的 EZH2 抑制剂 TLN-254 则处在罕见 T 细胞淋巴瘤。每个分区都有不同的竞争强度和支付方画像：实体瘤 KRAS 最大但最拥挤，B
              细胞淋巴瘤是已被验证但拥挤的降解剂细分，T 细胞淋巴瘤更小，但因为 tazemetostat 聚焦别处，竞争相对开放。净看，生物学意义上的市场确实很大——四分之一成人癌症携带 KRAS 突变，美国和欧盟每年约
              1.25M 新患者受牵连——但 Phase 1
              新进入者真正能变现、能报销的切片更窄，并受竞争、生物标志物可及性和定价制约。克制的判断是：这是一个大、在增长、但竞争极重的机会；可实现价值几乎完全取决于差异化临床数据。
