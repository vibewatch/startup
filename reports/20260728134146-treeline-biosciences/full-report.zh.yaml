      - number: '2.4'
        title: 驱动因素、约束与规模缺口
        blocks:
          - type: paragraph
            body: >-
              需求驱动是真实的：非 G12C KRAS 人群很大，蛋白降解作为一种模态的临床验证不断增加，精准肿瘤生物标志物检测渗透率提升，加速监管路径也可能压缩上市时间。但约束同样实质。赛道拥挤，Phase 2/3 KRAS
              项目超过 120 个，Revolution Medicines 已凭 pan-RAS 抑制剂进入 Phase 3，并定义竞争前沿；已获批 G12C
              既有药物设定疗效和定价门槛；支付方越来越要求生物标志物定义的人群和结局数据；肿瘤药开发仍有约 90% 失败率。最后，规模测算本身不确定——KRAS 和降解剂预测因发布方而异，且频繁修订——因此 Treeline
              的可防守 SAM 或 SOM 目前还无法单独切出，本报告把它保留为尽调缺口，而不是给出单点估计。
            claimRefs:
