        title: 快照 KPI 与可投资性逻辑
        blocks:
          - type: paragraph
            body: >-
              把线索合在一起看，2026 年中期的 Treeline 由几项罕见特征定义：资本底座很深（累计融资约 $1.2B，备考现金超过 $900M）、组织规模小但专业（约 168 名员工）、三条 Phase 1
              肿瘤项目加上第四条即将入临床的多元化管线，以及零产品收入。它的可投资性逻辑把创始人履历、计算发现、组合式管线和更强的资产负债表连在一起，但整个投资命题都卡在临床概念验证上，最早要到 2027
