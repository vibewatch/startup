      - number: '6.3'
        title: 需求、准入与采用路径
        blocks:
          - type: paragraph
            body: >-
              底层患者需求很大，足以支撑入组：美国每年约 26,000 例 DLBCL，四分之一成人癌症携带 KRAS 突变，再加上罕见但服务不足的 T 细胞淋巴瘤，共同构成一个大患者池；这些患者复发 /
              难治后生存较差，会主动寻求试验机会，常常通过患者倡导转诊渠道进入。对这些「客户」而言，采用路径从试验入组和早期活性信号开始，走向批准、指南纳入、目录准入，最终到商业患者开方——这是一个多年漏斗，每一步都有重度流失。鉴于未满足需求，关键意见领袖描述临床医生对
              pan-KRAS 和 BCL6 降解剂机制接受度高，这是未来采用的有用代理信号；Treeline 也报告了 TLN-121 鼓舞人的早期单药活性。但这一切都不能替代最终把临床兴趣转化为商业需求的疗效数据。
