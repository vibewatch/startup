      - number: '6.4'
        title: 留存、扩张与集中风险
        blocks:
          - type: paragraph
            body: >-
              传统留存和满意度指标不适用于尚未商业化的生物科技公司，因此我们重新定义：留存变成无进展治疗时间，重复使用变成持续治疗直至进展或毒性，满意度变成临床医生和患者接受度——Treeline
              尚未量化这些指标，因此示意队列数字只是占位。客户基础扩张将来自更多适应症和联合用药、扩展队列，以及向欧盟及更广地域扩展；这也能分散监管暴露。近期主要风险是集中度：Treeline
              的入组依赖少数旗舰学术中心，这会加速高质量招募，但也集中运营和数据依赖；而公司所处的 KRAS 和淋巴瘤试验格局拥挤，招募更慢也更贵。精确入组人数和结构化结局数据仍是关键缺口。
