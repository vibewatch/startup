      - number: '6.5'
        title: 客户净判断
        blocks:
          - type: paragraph
            body: >-
              综合临床阶段客户图景，Treeline
              呈现出高质量但尚未商业化的触达面。强项是，公司通过美国一些全球最受尊重的癌症中心和不断扩大的欧洲网络，招募真正有未满足需求的多线治疗患者；临床医生和患者对其机制的需求足够持久，试验名额需求不太可能成为约束。谨慎面是，公司没有商业客户基础、没有收入，也没有披露入组人数、留存或患者报告结局数据，因此整个分析只是未来需求的领先指标，而不是需求证据。实际结论是，Treeline
              今天的客户故事本质上是试验执行故事：它能否在拥挤格局中足够快地入组，让应答者持续治疗，并把旗舰中心可信度转化为最终创造付费客户基础的疗效数据；而付费客户基础只会在获批后才开始出现。
