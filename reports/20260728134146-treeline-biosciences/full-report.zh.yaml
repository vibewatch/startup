            body: >-
              Treeline 由两位资深药物猎手联合创立。CEO Josh Bilenker, MD 此前创立 Loxo Oncology，推动三款药物获 FDA 批准，并在 2019 年以约 $8B 被 Eli Lilly
              收购；他还曾任职于美国 FDA 和 Aisling Capital。CSO Jeff Engelman, MD, PhD 曾任 Novartis Institutes for BioMedical
              Research 全球肿瘤负责人，并担任 Massachusetts General Hospital 胸部肿瘤主任。CFO Spencer Smith 则带来 Sentio、Aisling Capital 和
              McKinsey 的资本市场与财务经验。这组履历是投资叙事的核心，但也把关键人风险集中在两个人身上。合并后，合并公司预计由 12 名董事组成的董事会治理——10 名由 Treeline 提名，2 名来自
              Standard BioTools——其中包括 Sue Desmond-Hellmann。
