  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: Treeline 的客户是谁
        blocks:
          - type: paragraph
            body: >-
              Treeline 是尚未商业化的临床阶段公司，因此截至 2026 年 7 月本次运行日期，没有付费客户，也没有产生收入的客户关系。今天有意义的「客户」是其 Phase 1 试验中接受过多线治疗的复发 /
              难治患者，以及执行这些试验的学术癌症中心和研究者；真正付费的客户——Medicare、商业保险、欧洲医疗体系等支付方，以及开方肿瘤医生——只会在监管批准后出现。入组人群很具体：BCL6 降解剂 TLN-121 和
              EZH2 抑制剂 TLN-254 面向复发 / 难治 B 细胞和 T 细胞淋巴瘤患者，pan-KRAS TLN-372 面向 KRAS
              改变的实体瘤患者。从今天的患者和中心，到明天的支付方和开方医生，这一分层框定了整个客户分析及其缺口。
