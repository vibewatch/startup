companyProfile:
  summary: >-
    Treeline Biosciences 是一家总部位于 Massachusetts 州 Watertown 的临床阶段肿瘤公司，2021 年由 Josh Bilenker, MD（Loxo Oncology 创始人，后者以约
    $8B 出售给 Eli Lilly）和 Jeff Engelman, MD, PhD（前 Novartis NIBR 全球肿瘤负责人）创立。公司已从 ARCH、OrbiMed、GV、KKR、T. Rowe
    Price、Fidelity 等机构组成的投资人团体融资约 $1.2B，采取多元化、按规模化搭建的模式，覆盖小分子抑制剂、蛋白降解剂和靶向抗体偶联药物。管线包括三个 Phase 1 项目——TLN-121（BCL6
    降解剂）、TLN-372（pan-KRAS 抑制剂）和 TLN-254（EZH2 抑制剂）——TLN-499（BCL-XL 降解剂）将在 2026 年进入临床。2026 年 6 月，公司宣布与 Standard
    BioTools（Nasdaq: LAB）进行全股票反向并购，Treeline 股东将持有合并后公司约 84%，新公司将以 TRLN 交易，拥有超过 $900M 的备考现金，资金可支撑至 2029
    年；截至本次运行日期，该交易仍待股东投票通过。
