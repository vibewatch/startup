      - number: '5.4'
        title: 依赖、质量与路线图
        blocks:
          - type: paragraph
            body: >-
              平台依赖几项关键条件：计算引擎、内部药物化学、美国和欧盟实验室、TLN-254 的 Hengrui 授权，以及在临床中心招募患者的能力。Hengrui
              关系是双刃依赖——它带来一个经外部验证、已在中国获批的资产，但也引入授权方、供应和地缘政治风险，而内部发现项目不会有这些风险。质量和合规信号仍处开发阶段：试验已注册，试验设计与 FDA 对齐，EZH2
              资产已在中国获批，但没有制造或 CMC 披露，安全性数据也只是初步。路线图将在 2026 年把 TLN-499 推入临床，并在 2027-2028 年加入另外三个肿瘤、神经和免疫项目，中期数据读出从 2027
              年开始。按阶段与模态对照，Treeline 处在早期临床，但宽度异常；授权的 EZH2 项目外部去风险最多，内部降解剂和 pan-KRAS 项目风险最高、回报也最高。
