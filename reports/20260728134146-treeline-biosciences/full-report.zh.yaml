              财务图景存在真实缺口，也有一个核心风险。作为私营公司，Treeline 不发布经审计报表、不披露明确烧钱数字、股权结构或每个项目支出，因此在 S-4 和交割后 SEC
              文件给出细节之前，烧钱和跑道估计的误差区间很宽。核心风险是资本效率：Treeline 在任何人体概念验证之前已投入约 $1.2B，怀疑者认为，这种前置支出只有靠 2027
              年才开始出现的临床数据才能证明合理。其上还叠加合并完成风险——如果交易失败，Treeline 将失去 $450M 注入和公开上市通道，跑道确定性会明显变弱，并依赖新一轮私募融资。因此，交易隐含的 Treeline
              股东约 $2.5B 股权价值，建立在资本和管线宽度之上，而不是任何已证明的财务表现。
