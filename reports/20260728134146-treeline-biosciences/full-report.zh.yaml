              等中心支持。这些都是最受尊重的肿瘤机构之一，增强了数据质量和研究者可信度。公司没有披露各试验精确入组人数，但 Phase 1 剂量递增队列通常每个项目入组数十名患者；三到四个项目同时开放，合计入组到 2026
