          label: 识别未满足需求患者
        - id: j2
          label: 转诊至试验中心
        - id: j3
          label: 筛选与入组
        - id: j4
          label: 试验给药（1 期）
        - id: j5
          label: 应答 / 续治
        - id: j6
          label: 未来：获批产品患者
    approximationNotes: 这张旅程图把「客户」重写为试验患者的路径，终点是未来商业化用药。
    claimRefs:
      - CU002
      - CU018
      - CU010
  - id: FU002
    title: Treeline 入组到商业化采用漏斗
    type: funnel
    data:
      items:
        - label: 符合条件的 R/R 患者池
          value: 100
        - label: 转诊至试验中心
          value: 40
        - label: 已筛选
          value: 25
        - label: 入组并给药
          value: 15
        - label: 治疗中应答者
          value: 6
    approximationNotes: 用于说明早期肿瘤试验入组漏损的示意性比例，并非 Treeline 披露数据。
    claimRefs:
      - CU010
      - CU009
  - id: FU003
    title: Treeline 具名试验中心验证矩阵
    type: matrix
    data:
      columns:
        - 项目
        - 适应症
        - 地区
      rows:
        - label: Memorial Sloan Kettering
          values:
            - TLN-121
            - B 细胞淋巴瘤
            - 美国
        - label: MD Anderson
          values:
            - TLN-372
            - KRAS 实体瘤
            - 美国
        - label: Dana-Farber
          values:
            - TLN-254
            - T 细胞淋巴瘤
            - 美国
        - label: City of Hope 癌症中心
          values:
            - 肿瘤
            - 早期阶段
            - 美国
        - label: Vall d’Hebron 癌症中心
          values:
            - pan-KRAS / 降解剂
            - 早期阶段
            - 欧盟
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU008
  - id: FU004
    title: Treeline 治疗中留存队列示意（%）
    type: cohort
    data:
      columns:
        - 第 1 周期
        - 第 3 周期
        - 第 6 周期
      rows:
        - label: 淋巴瘤队列（示意）
          values:
            - 100
            - 70
            - 45
        - label: 实体瘤队列（示意）
          values:
            - 100
            - 60
            - 35
    approximationNotes: 按治疗周期展示治疗中留存率的示意性百分比；不是 Treeline 报告数据（公司尚未披露留存数据）。
    claimRefs:
      - CU012
      - CU027
  - id: FR001
    title: Treeline 风险热力图（可能性 × 影响）
    type: matrix
    data:
      columns:
        - 可能性
        - 影响
        - 速度
      rows:
        - label: 临床疗效失败
          values:
            - 中高
            - 很高
            - 慢（2027+）
        - label: 竞争落后（RevMed）
          values:
            - 高
            - 高
            - 中
        - label: 合并失败
          values:
            - 中低
            - 高
            - 快
        - label: 入组延迟
          values:
            - 高
            - 中
            - 中
        - label: Hengrui / 地缘政治
          values:
            - 中
            - 中
            - 慢
        - label: 关键人物离职
          values:
            - 低
            - 很高
            - 快
    claimRefs:
      - CR019
      - CR005
  - id: FR002
    title: Treeline 风险传导图
    type: dag
    data:
      nodes:
        - id: r1
          label: 科学 / 疗效风险
        - id: r2
          label: 临床执行（暂停、入组）
        - id: r3
          label: 竞争落后
        - id: r4
          label: 合并 / 公司风险
        - id: r5
          label: 资本与融资风险
        - id: r6
          label: 估值受损
      edges:
        - from: r1
          to: r6
        - from: r2
          to: r1
        - from: r3
          to: r6
        - from: r4
          to: r5
        - from: r5
          to: r6
        - from: r1
          to: r5
    claimRefs:
      - CR017
      - CR030
  - id: FR003
    title: Treeline 风险依赖与单点故障图
    type: dag
    data:
      nodes:
        - id: s1
          label: 创始人（Bilenker / Engelman）
        - id: s2
          label: 核心平台未验证
        - id: s3
          label: Hengrui 授权（TLN-254）
        - id: s4
          label: 合并完成
        - id: s5
          label: 公司价值
      edges:
        - from: s1
          to: s5
        - from: s2
          to: s5
        - from: s3
          to: s5
        - from: s4
          to: s5
    claimRefs:
      - CR018
      - CR010
  - id: FV001
    title: Treeline 建议逻辑
    type: flow
    data:
      nodes:
        - id: v1
          label: 强项输入（创始人、现金、平台）
          type: input
        - id: v2
          label: 尚无人体验证
          type: process
        - id: v3
          label: 隐含约 $2.5B，合理到偏高
          type: process
        - id: v4
          label: 2027 年催化剂决定重估
          type: process
        - id: v5
          label: 建议：继续研究
          type: output
      edges:
        - from: v1
          to: v3
        - from: v2
          to: v3
        - from: v3
          to: v4
        - from: v4
          to: v5
    claimRefs:
      - CV001
      - CV016
  - id: FV002
    title: Treeline 估值对临床成功的敏感性（USD B）
    type: bar
    data:
      items:
        - label: 悲观（失败）
          value: 1
        - label: 低 PoS 基准
          value: 1.8
        - label: 隐含基准
          value: 2.5
        - label: 高 PoS 基准
          value: 3.5
        - label: 乐观（多项成功）
          value: 5.5
    approximationNotes: 不同临床成功概率假设下的示意性股权价值，单位为十亿美元；作者估算。
    claimRefs:
      - CV026
      - CV008
  - id: FV003
    title: Treeline 估值 / 回报区间（USD B）
    type: range
    data:
      items:
        - label: Treeline 隐含股权价值
          low: 1.8
          mid: 2.5
          high: 3.5
        - label: 三年情景股权价值
          low: 1
          mid: 3
          high: 6
        - label: 现金支撑的估值底线
          low: 0.9
          mid: 1
          high: 1.1
    approximationNotes: 区间以 USD B 计；基准锚定隐含约 $2.5B，边界为示意性情景估算。
    claimRefs:
      - CV008
      - CV017
      - CV022
  - id: FV004
    title: Treeline 投资 KPI
    type: kpi
    data:
      items:
        - label: 隐含股权价值
          value: ~$2.5B
          claimRefs:
            - CV002
        - label: 累计融资额
          value: ~$1.2B
          claimRefs:
            - CV005
        - label: 备考现金
          value: '>$900M'
          claimRefs:
            - CV017
        - label: 持股比例（Treeline）
          value: ~84%
          claimRefs:
            - CV018
        - label: 综合评分（0-10）
          value: 5.6
          claimRefs:
            - CV001
        - label: 关键催化年份
          value: '2027'
          claimRefs:
            - CV013
    claimRefs:
      - CV002
