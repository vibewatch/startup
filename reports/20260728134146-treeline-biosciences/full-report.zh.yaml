      - number: '2.2'
        title: 多个视角测算机会
        blocks:
          - type: paragraph
            body: >-
              单一 TAM 无法概括 Treeline 的机会，因此我们用几个视角给它划边界。最宽的是全球肿瘤药物市场，规模超过 $200B，且以两位数增速增长。更相关的是较窄的机制视角：KRAS 抑制剂市场 2025 年约
              $526M，预计到 2034 年达到约 $2.9B；靶向蛋白降解剂市场 2025 年约 $2B，预计到 2034 年超过 $13B。疾病发病率视角显示，美国每年约 26,000 例 DLBCL（全球约
              150,000 例）、NHL 总病例 80,000-90,000 例，PTCL 和 CTCL 只有数千例。KRAS 突变出现在约四分之一成人癌症中，且非 G12C 变体占主导；40-50% 的 DLBCL 过表达
              BCL6——这些都是很大的生物学底盘，而美元预测只部分把它们货币化。
            claimRefs:
