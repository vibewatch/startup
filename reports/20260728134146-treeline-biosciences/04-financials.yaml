callouts:
  - calloutType: strength
    title: Rare financial firepower for a clinical-stage biotech
    body: >-
      With roughly $1.2 billion raised and more than $900 million of expected pro-forma cash funding operations into
      2029, Treeline enters the public markets far better capitalized than the typical clinical-stage company, reducing
      near-term financing risk.
    claimRefs:
      - CI003
      - CI005
  - calloutType: risk
    title: Capital deployed ahead of proof-of-concept
    body: >-
      All of this capital has been spent building a multi-program engine before any human efficacy data exist, so the
      model’s capital efficiency cannot be judged until 2027 readouts — a genuine concern for a pre-revenue company
      burning an estimated $200-300 million a year.
    claimRefs:
      - CI010
      - CI006
  - calloutType: assumption
    title: Burn and unit economics are estimates
    body: >-
      Because Treeline is private and files no audited statements, its burn rate, runway math and per-program costs are
      author estimates triangulated from disclosures and comparables, and should be re-derived from the S-4 and
      post-close SEC filings.
    claimRefs:
      - CI011
      - CI029
