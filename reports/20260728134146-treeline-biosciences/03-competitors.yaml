callouts:
  - calloutType: risk
    title: Revolution Medicines is years ahead in the RAS race
    body: >-
      Treeline’s most-watched asset, the pan-KRAS TLN-372, competes in a category where Revolution Medicines already has
      a pan-RAS inhibitor in Phase 3 for pancreatic and lung cancer — a multi-year clinical lead that could define the
      market before Treeline generates its own efficacy data.
    claimRefs:
      - CP002
      - CP018
  - calloutType: strength
    title: Potential first-in-clinic BCL6 degrader plus rare modality breadth
    body: >-
      Treeline may be first or among the first to put a BCL6 degrader into Phase 1, and it has enabled inhibitors,
      degraders and antibody-drug conjugates in-house — unusually broad modality coverage versus single-modality
      degrader specialists.
    claimRefs:
      - CP010
      - CP013
  - calloutType: assumption
    title: Moats are potential, not proven
    body: >-
      Treeline’s IP, chemistry and computational engine are plausible moats, but with no human efficacy data yet,
      durability depends entirely on clinical readouts and remains unproven against fast-moving rivals.
    claimRefs:
      - CP017
      - CP030
