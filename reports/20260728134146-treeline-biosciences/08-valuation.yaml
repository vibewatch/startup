callouts:
  - calloutType: recommendation
    title: 'Research-more: a cash-supported option on unproven science'
    body: >-
      Treeline pairs Loxo-caliber founders, a broad platform and more than $900 million of pro-forma cash with a
      complete absence of human efficacy data, so its ~$2.5B implied valuation is best treated as a fairly priced call
      option that only 2027 readouts can re-rate — a clear research-more rather than buy.
    claimRefs:
      - CV001
      - CV037
  - calloutType: insight
    title: Only a ~2x step-up on capital
    body: >-
      The implied ~$2.5B equity value is roughly twice the ~$1.2B raised, and more than a third of it is cash, so
      investors are not yet paying a large speculative premium above cash plus early pipeline — the upside (and
      downside) lives almost entirely in the clinical data.
    claimRefs:
      - CV005
      - CV017
  - calloutType: risk
    title: Binary, catalyst-concentrated returns
    body: >-
      With value clustering around 2027 interim readouts and a Phase 3 competitor already ahead in KRAS, the return
      profile is high-variance and binary: a strong lead readout could roughly double equity value while a failure could
      push it toward the cash floor near $1B.
    claimRefs:
      - CV033
      - CV020
