callouts:
  - calloutType: "insight"
    title: "MSP Channel Distribution Drives Scalable Multi-Tenant Footprint"
    body: "ThreatLocker's expansion to more than 70,000 protected customer organizations is fundamentally driven by its Managed Service Provider (MSP) and MSSP channel strategy. By enabling channel partners to manage multi-tenant endpoint policies and elevation controls through a single pane of glass, ThreatLocker achieves rapid customer acquisition across thousands of small and mid-market organizations without proportional direct sales headcount expansion."
    claimRefs:
      - "CU001"
      - "CU009"
      - "CU012"
  - calloutType: "risk"
    title: "Absence of Audited Cohort Durability and Churn Benchmarks"
    body: "While headline organizational growth has surged by 40% year-over-year, ThreatLocker discloses zero public metrics regarding net revenue retention (NRR), gross renewal rates, or customer logo churn. Prospective investors cannot verify whether customer expansion is driven by expanding contract values within sticky accounts or by high-velocity new logo acquisition masking churn in smaller MSP accounts."
    claimRefs:
      - "CU001"
      - "CU013"
      - "CU014"
