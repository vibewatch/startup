company:
  name: "ThreatLocker, Inc."
chapter:
  number: 6
  title: "Customers"
  summary: "ThreatLocker protects over 70,000 organizations worldwide through a differentiated default-deny Zero Trust platform, scaling predominantly via an extensive Managed Service Provider (MSP) channel alongside prominent public-sector and sports enterprise deployments like the Orlando Magic and Niles Community Schools. While vendor-reported logo growth has surged by 40% year-over-year from 50,000 in 2025, commercial durability remains clouded by the complete absence of audited retention, churn, NRR, and cohort unit economic disclosures."
sections:
  - id: "sec-segmentation-channel"
    title: "Customer Base Segmentation and Channel Distribution"
    body: "ThreatLocker's commercial footprint is anchored by a differentiated multi-tenant Zero Trust architecture designed to serve organizations across several distinct commercial tiers. The company's primary distribution volume flows through Managed Service Providers (MSPs) and Managed Security Service Providers (MSSPs), who integrate default-deny application allowlisting, ringfencing, and elevation control into their managed cybersecurity service bundles for small and mid-market commercial clients. Beyond the MSP channel, ThreatLocker serves direct and partner-assisted institutional deployments across resource-constrained public K-12 school districts, municipal government agencies including local law enforcement, and professional sports and entertainment franchises such as the Orlando Magic and Indianapolis Colts. In addition, ThreatLocker maintains high-profile reference accounts with enterprise transportation and international infrastructure operators including JetBlue and Heathrow Airport. This multi-tiered channel structure enables ThreatLocker to achieve broad geographical scale without the immediate burden of building an equivalent large-scale direct enterprise sales force, although it introduces strategic dependency on third-party channel partner relationships and revenue-sharing arrangements."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU006"
      - "CU009"
      - "CU012"
    tableRefs:
      - "TU001"
    figureRefs: []
  - id: "sec-growth-trajectory"
    title: "Adoption Trajectory, Logo Scale, and Service SLAs"
    body: "ThreatLocker's reported adoption trajectory indicates substantial top-of-funnel logo momentum, expanding from more than 50,000 protected customer organizations in 2025 to over 70,000 organizations worldwide by July 2026. This expansion represents an apparent 40 percent year-over-year increase in customer entity count, reflecting rapid adoption among mid-market enterprises and MSP partner portfolios seeking proactive alternatives to traditional reactive antivirus and EDR suites. To mitigate the friction historically associated with strict default-deny application allowlisting, ThreatLocker backs its customer deployments with high-velocity operational support. The vendor's proprietary Cyber Hero support organization operates 24/7/365 out of its Florida headquarters, delivering live chat and telephone response times typically under 60 seconds. Furthermore, the platform's administrative workflow is architected to allow IT managers to review and permit blocked applications within 60 seconds when users request software access. However, because ThreatLocker remains a private company without audited financial filings, publicly reported revenue metrics diverge substantially across secondary market aggregators, and reported customer counts lack standardized denominator disclosures regarding active billable endpoint volume."
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU010"
      - "CU014"
    tableRefs:
      - "TU002"
    figureRefs: []
  - id: "sec-customer-proof"
    title: "Production Deployments and Named Customer Case Evidence"
    body: "Documented customer deployments provide concrete empirical validation of ThreatLocker's operating model across demanding operational environments. In the education sector, Niles Community Schools deployed ThreatLocker across teacher laptops and district endpoints, leveraging the platform's initial Learning Mode to identify and neutralize active malware before finalizing its commercial software purchase, while using 24/7 MDR escalation to verify anomalous service account changes within 90 seconds. In professional sports, the Orlando Magic implemented ThreatLocker's allowlisting and ringfencing modules to automate application vetting, eliminate manual software testing by internal IT staff, and provide verifiable telemetry that directly reinforced the franchise's cyber insurance posture. Similarly, managed service provider 3rd Element Consulting deployed ThreatLocker across municipal clients, including municipal police departments, successfully eliminating shadow IT and unauthorized video playback utilities. These customer proof points illustrate measurable risk reduction and workflow automation across diverse operational contexts, although public references remain vendor-curated case studies subject to inherent survivorship bias."
    claimRefs:
      - "CU001"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU011"
    tableRefs:
      - "TU003"
    figureRefs: []
  - id: "sec-journey-retention-risks"
    title: "Customer Lifecycle, Expansion Loops, and Retention Disclosures"
    body: "The customer adoption lifecycle typically initiates with an automated discovery phase utilizing ThreatLocker's Learning Mode, which profiles application execution across customer endpoints to build baseline allowlisting policies without causing operational downtime. Following initial policy baseline establishment, customer accounts commonly expand across the broader Zero Trust suite, adding Ringfencing to confine legitimate utilities like PowerShell, Elevation Control to remove local administrative privileges, and Storage Control to enforce USB and backup share protection. Organizations with lean technical teams frequently layer on ThreatLocker Detect and Cyber Hero MDR for 24/7 managed event investigation. Despite this technical expansion pathway, ThreatLocker's commercial durability remains a critical diligence blind spot. The company discloses no audited figures for net revenue retention (NRR), gross retention rates, logo churn, or customer acquisition payback periods. For diligence assessors, the lack of disclosed cohort retention data makes it challenging to verify whether rapid headline logo growth reflects durable recurring software usage or continuous top-of-funnel acquisition masking unobserved channel churn."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU008"
      - "CU010"
      - "CU012"
      - "CU013"
    tableRefs: []
    figureRefs:
      - "FU001"
