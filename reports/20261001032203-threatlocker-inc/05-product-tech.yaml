chapter:
  number: 5
  title: "Product & Technology"
  summary: "ThreatLocker delivers an endpoint and network security platform built on a default-deny Zero Trust architecture, combining application allowlisting, ringfencing, privilege elevation, storage auditing, and network access controls to preemptively block unauthorized execution and data exfiltration across managed enterprise environments."
sections:
  - id: "core-platform-definition-workflow"
    title: "Product Definition and Customer Workflow"
    body: "ThreatLocker operates on a default-deny Zero Trust philosophy that fundamentally departs from conventional reactive antivirus and post-execution detection platforms. Rather than maintaining extensive blacklists of known malicious signatures or attempting to heuristically detect suspicious activity after code has already begun running, ThreatLocker blocks all software, scripts, and libraries from executing unless they are explicitly permitted by policy. When the ThreatLocker agent is initially deployed across an organization's endpoints and servers, it operates in an automated Learning Mode that comprehensively catalogs installed executables, dependencies, and operational scripts. Once the learning period concludes, administrators review and baseline the approved software repository, placing the fleet into a locked enforcement posture where untrusted binaries are denied execution by default. To maintain operational agility and minimize employee downtime, the platform pairs this strict default-deny boundary with an automated approval workflow. Endpoints encountering an unlisted binary present the user with a streamlined access request prompt, allowing systems administrators or managed service providers to evaluate file safety and grant granular permissions within approximately 60 seconds. The platform further supports operational reliability through its 24/7/365 Cyber Hero Support Team, which delivers a lightning-fast response time typically within 60 seconds for administrative escalations, emergency approvals, and deployment assistance."
    claimRefs:
      - "CE001"
      - "CE006"
      - "CE007"
    tableRefs:
      - "TE002"
  - id: "modular-architecture-controls"
    title: "Core Security Modules and Operating Architecture"
    body: "The ThreatLocker product portfolio is structured around seven interconnected functional modules that enforce defense-in-depth across endpoints, servers, and storage assets. Application Allowlisting serves as the foundational barrier, preventing unapproved executables, dynamic link libraries (DLLs), and scripts from launching. Building directly upon allowlisting, Ringfencing™ enforces granular behavioral boundaries around permitted applications, preventing legitimate utilities such as PowerShell, Command Prompt, or Microsoft Office from accessing unneeded files, interacting with the system registry, calling external internet IP addresses, or spawning rogue child processes. Elevation Control eliminates the security vulnerability of persistent local administrative accounts by granting Just-In-Time elevation specifically to approved individual applications rather than elevating the entire user desktop session. Storage Control regulates access to local folders, network shares, and external USB storage devices based on granular user, time, and application identity rules, enforcing encryption on removable media to prevent data leakage. Centralized logging is achieved through Unified Audit, which records all allow, deny, elevation, and file access events in real time. Configuration Manager enforces standardized operating system security baselines across distributed endpoints without requiring Active Directory domain controllers, while ThreatLocker Detect analyzes collected endpoint telemetry to identify indicators of compromise, trigger automated isolation responses, and alert SOC analysts."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE010"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "differentiation-technical-mechanisms"
    title: "Technical Differentiation and Living-off-the-Land Mitigation"
    body: "ThreatLocker's primary technological differentiation centers on its ability to neutralize Living-off-the-Land (LotL) cyberattacks and fileless malware that routinely evade standard signature-based endpoint detection and response (EDR) tools. Attackers frequently utilize legitimate, pre-installed administrative utilities—such as PowerShell, Remote Desktop (RDP), or scripting engines—to pivot laterally and exfiltrate confidential data without deploying custom malware. ThreatLocker addresses this vector by combining Ringfencing with dynamic Network Control and simulated canary detection. Ringfencing restricts approved software so that a word processor cannot invoke scripting interpreters, and scripting utilities cannot establish arbitrary external connections. To safely assess unknown software requests without putting corporate production environments at risk, ThreatLocker incorporates an isolated cloud-based Testing Environment powered by Virtual Desktop Infrastructure (VDI). The testing sandbox automatically spins up a clean virtual machine to execute requested binaries, observe file system modifications, monitor registry alterations, and cross-reference hashes against VirusTotal threat classifications. Furthermore, the testing sandbox deploys simulated confidential canary files; if an untrusted application attempts to read these canary assets, ThreatLocker flags the behavior as potentially malicious and prevents deployment. Architectural scalability across multi-tenant environments is supported by high-performance RESTful Web APIs engineered with C#/.NET, connecting distributed endpoint agents, core data layers, and user-facing administration consoles."
    claimRefs:
      - "CE002"
      - "CE008"
      - "CE009"
      - "CE011"
      - "CE012"
      - "CE013"
    tableRefs:
      - "TE003"
  - id: "trust-safety-compliance-risks"
    title: "Trust, Security Governance, and Operational Limitations"
    body: "Implementing default-deny application control introduces notable operational dependencies, policy maintenance overhead, and governance responsibilities for enterprise IT organizations. While default-deny security drastically curtails ransomware propagation and unauthorized execution, improperly scoped policies can inadvertently impede critical business workflows, block custom internal software builds, or create administrative request backlogs during software upgrade cycles. ThreatLocker mitigates policy friction through its cloud community repository, enabling organizations to subscribe to curated rule sets established by cybersecurity peers and the ThreatLocker engineering team. Additionally, ThreatLocker provides Unified Audit logs to support regulatory frameworks, such as NIST Cybersecurity Framework guidelines and FTC reasonable security benchmarks, which increasingly mandate strict access control, system logging, and prompt incident response. However, commercial relationships and enterprise deployments carry ongoing operational and legal risks. Public court records indicate that ThreatLocker is actively engaged in commercial contract litigation with Charles Schwab & Co. in federal court (Case No. 6:25-cv-923-AGM-LHP in the Middle District of Florida), with a bench trial scheduled for July 2027. Furthermore, independent third-party performance benchmarks evaluating agent driver overhead across complex non-Windows environments remain limited in public technical disclosures, highlighting key diligence requirements for cross-platform deployments."
    claimRefs:
      - "CE007"
      - "CE010"
      - "CE014"
