company:
  name: "ThreatLocker, Inc."
chapter:
  number: 4
  title: "Financials"
  summary: "ThreatLocker monetizes its Zero Trust security platform through per-endpoint subscription software delivered predominantly via an expansive MSP partner channel. The company has demonstrated rapid commercial adoption, protecting over 70,000 organizations and securing $489 million in cumulative funding through a $190 million Series F in July 2026, though lack of audited ARR and unit economics remains a key diligence hurdle."
sections:
  - id: "revenue-streams-and-pricing-architecture"
    title: "Revenue Streams and Pricing Architecture"
    body: "ThreatLocker operates as a dedicated cybersecurity software vendor delivering Zero Trust architecture across endpoint, server, and network environments. The commercial platform centers on application execution control, allowlisting, Ringfencing, storage control, network access control, and endpoint detection and response (EDR/MDR) capabilities. Monetization is structured primarily as a multi-tier SaaS model billed on a per-endpoint, per-agent monthly or annual basis. The core value proposition rests on default-deny execution controls, blocking unapproved software, scripts, and libraries before malicious code can execute. Rather than publishing fixed list prices on its public website, ThreatLocker utilizes a quote-based enterprise and partner model alongside a standard 30-day free trial. Pricing realizations vary depending on volume tiers, multi-module packaging, and partner agreements, while standard enterprise support is reinforced by an in-house 24/7/365 Cyber Hero support desk based in Orlando, Florida, with sub-60-second response commitments."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI005"
    tableRefs:
      - "TI001"
      - "TI002"
  - id: "gtm-motion-and-channel-economics"
    title: "GTM Motion and Channel Economics"
    body: "ThreatLocker’s go-to-market strategy relies heavily on an indirect, channel-first distribution architecture centered around Managed Service Providers (MSPs) and Managed Security Service Providers (MSSPs). By recruiting IT service providers that manage technology and security infrastructure for hundreds of thousands of small and medium-sized businesses (SMBs), ThreatLocker achieves substantial distribution leverage and accelerated customer acquisition. This channel-leveraged sales motion minimizes direct sales overhead while embedding ThreatLocker's agent into standard managed IT stacks. The company has demonstrated dramatic scale under this model, expanding from serving more than 50,000 protected customer organizations in early 2024 to protecting over 70,000 organizations globally by mid-2026. To support this expanding international partner ecosystem, ThreatLocker has established regional operational presences in Dublin, Dubai, Brisbane, and Reading, U.K., enabling localized partner enablement and follow-the-sun technical assistance."
    claimRefs:
      - "CI001"
      - "CI004"
      - "CI007"
      - "CI013"
    figureRefs:
      - "FI001"
  - id: "capital-adequacy-and-financing-history"
    title: "Capital Adequacy and Financing History"
    body: "ThreatLocker has maintained strong access to institutional private equity and venture capital to finance platform expansion and international scaling. Following a $100 million Series C in April 2022 and a $115 million Series D in April 2024 led by General Atlantic, the company announced another year of doubling revenue and 50 percent workforce expansion. On July 29, 2026, ThreatLocker completed a $190 million Series F financing round led by Elephant, with participation from D. E. Shaw Ventures, Arthur Ventures, and a new strategic investment from Koch Disruptive Technologies. Across seven institutional funding rounds since inception, cumulative equity financing reached $489 million as of July 2026. The company’s workforce expanded in parallel, reaching approximately 756 employees as of August 2026. This substantial capital cushion provides extensive runway to support ongoing research and development into artificial intelligence security controls, international sales offices, and corporate operations without immediate financing vulnerability."
    claimRefs:
      - "CI006"
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI015"
  - id: "unit-economics-and-financial-verdict"
    title: "Unit Economics and Financial Verdict"
    body: "From an underwriting perspective, ThreatLocker presents a bifurcated financial profile characterized by exceptional commercial footprint alongside complete private metric opacity. While the platform protects over 70,000 organizations and has demonstrated sustained institutional backing, neither annual recurring revenue (ARR), GAAP gross margins, net revenue retention (NRR), nor customer acquisition cost (CAC) payback periods are publicly disclosed. Secondary market data sources exhibit severe conflicts, estimating revenue anywhere between $100 million in FY2025 and $380 million in 2024. Furthermore, broader legal and regulatory trends in financial services emphasize third-party vendor risks, where shared vendor intrusions increasingly trigger class action litigation and scrutiny over data governance. Consequently, ThreatLocker cannot be underwritten on verified SaaS unit economics based solely on public data; prospective investors must require confidential audit reconciliations covering recognized revenue, gross margin contribution, and cohort churn dynamics."
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI011"
      - "CI014"
      - "CI015"
    tableRefs:
      - "TI003"
