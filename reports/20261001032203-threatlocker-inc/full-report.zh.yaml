      - number: '8.2'
        title: 融资历史、估值倍数与股权结构表
        blocks:
          - type: paragraph
            body: >-
              自 2017 年成立以来，ThreatLocker 完成多轮机构融资；截至 2026 年 8 月，机构股权融资累计达 $489.4 million。2026 年 7 月 29 日，公司宣布完成由 Elephant
              领投的 $190 million Series F 轮融资，D. E. Shaw Ventures、Arthur Ventures 以及企业投资者 Koch Disruptive Technologies
              跟投。该轮交易投前估值为 $1.6 billion，投后估值达 $1.79 billion，对应股权稀释比例约 11%。此前，公司于 2025 年 4 月按 $1.2 billion 投后估值完成 $60
              million Series E 轮融资（稀释约 5%），2024 年 4 月完成由 General Atlantic 领投、StepStone Group 与 D. E. Shaw Ventures 跟投的
              $115 million Series D 轮，并在 2022 年 4 月完成 $100 million Series C 轮。尽管早期名录资料记录的历史累计金额较低（如 $299 million 或 $363
              million），但 2026 年 8 月最新投资者资料确认，公司历经 7 轮融资、引入 8 家机构投资者，累计募资 $489.4 million。按 Series F 轮 $1.79 billion
              投后估值计算，若以 $100 million 营收为基准，企业价值倍数约为 17.9x；若按 $71.5 million 年化营收计，倍数则达 25.0x。相较 Rubrik（IPO 时 14.4x
              P/S）、Tenable（IPO 时 8.0x P/S）、SentinelOne 及 CyberArk 等上市终端安全可比公司，该估值享有显著溢价。
            claimRefs:
