      - number: '7.2'
        title: 运营执行、系统可靠性与软件完整性风险
        blocks:
          - type: paragraph
            body: >-
              由于 ThreatLocker 作为底层默认拒绝的 Zero Trust 控制面运行，强力执行应用白名单、Ringfencing 与存储隔离，其系统架构天然具备极高的故障波及严重性 (CR007)。内核级默认拒绝
              Agent 内部一旦出现软件缺陷、策略下发失误或服务意外中断，极易诱发企业级大面积系统停摆，导致管理员被锁在核心业务系统之外，或产生大量误报致使业务中断 (CR008)。公司运营规模急剧扩张，团队规模预估已达
              700 至 739 人，并在 Orlando、Dublin、Dubai 与 Brisbane 设立了跨国据点，大幅推高了跨境协同与多地运营的复杂性 (CR009)。ThreatLocker
              的现网遥测与威胁情报显示，黑客正频繁利用合法开发工具、wscript.exe 及 PowerShell 等系统原生组件，结合 ClickFix 社交工程手段发动无文件与分阶段恶意攻击，这对其白名单策略定义与自动化
              Ringfencing 规则构成了持续压力，必须严防漏报失陷 (CR010)。尽管 ThreatLocker 依托坐落于 Orlando 的 24/7 Cyber Hero 客服团队提供 60
              秒以内的极速响应以对冲部署阻力与停摆风险，但全球终端数量的爆发式增长，正严苛考验着高度集中式人工技术支持体系的服务弹性上限 (CR011)。
