      - number: '3.4'
        title: 护城河持久度与被替代风险
        blocks:
          - type: paragraph
            body: >-
              ThreatLocker 最具防御壁垒的定位，在于清晰的默认拒绝运行模型与持续扩张的控制面二者结合。公司官方资料载明，该平台服务逾 50,000 家机构，2025 年新增 5 款解决方案，并已进驻 FedRAMP
              Marketplace。此类陈述印证了其市场覆盖度与产品研发投入，却不足以证明真实的客户留存率、竞标胜率、独立安全实测表现或商业定价权。验证了其比选池的同批软件目录，同样暴露出产品被替代的风险：买方在选型考察中会同时接触到综合终端安全套件、专注型
              EDR 工具、特权管控软件以及 RMM 运维平台。产品线持续外延固然能增强交叉销售潜力，却也可能将 ThreatLocker
              拖入日益拥挤的全家桶套件同质化红海。定位图表是基于公开记载的产品侧重点与功能广度提炼的定序综合评估，并非产品效能优劣排名。因此，确立可持续的护城河投资判断，高度取决于独立第三方的攻防实测报告、分批次客户续约留存数据、竞标赢单输单归因及渠道分成模型，而这部分核心证据在当前资料中仍告缺失。
