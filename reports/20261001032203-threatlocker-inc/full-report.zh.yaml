              托管式安全事件调查服务。尽管技术层面的增购延伸路径明确，ThreatLocker
              的商业韧性在尽调中依然存在致命盲区。公司至今未披露关于净留存率（NRR）、总留存率、客户流失率或获客成本回本周期的任何经审计数据。对尽调团队而言，分批次留存数据的缺失，导致外界极难判断高歌猛进的头部客户数增速，究竟代表着高黏性的长期软件使用，还是在依靠源源不断的漏斗顶端新客获取来掩盖底层尚未显现的渠道流失隐患。
