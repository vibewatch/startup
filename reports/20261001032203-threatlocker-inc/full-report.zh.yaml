figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: ThreatLocker 从 2017 年创立到 2026 年 F 轮扩张与产品规模化演进的时间线。
    approximationNotes: null
    data:
      items:
        - label: 公司成立与初创
          date: '2017-09-25'
          detail: 在经历一起严重的重大企业网络钓鱼事件后，Danny Jenkins、Sami Jenkins 与 John Carolan 于佛罗里达州共同创立 ThreatLocker，开创默认拒绝白名单机制。
          tone: positive
        - label: 种子轮融资与早期孵化
          date: '2017-09-30'
          detail: ThreatLocker 完成由 MACH37 支持的初步种子孵化与加速器扶持，构建初始概念验证级终端安全引擎。
          tone: neutral
        - label: A 轮扩张融资
          date: '2020-08-24'
          detail: 完成由 Arthur Ventures 领投的 444 万美元 A 轮融资，加速在托管服务提供商渠道中的早期客户拓展。
          tone: positive
        - label: B 轮融资与国际化布局
          date: '2021-05-18'
          detail: 完成由 Elephant 领投的 2000 万美元 B 轮融资，扩大零信任平台规模并拓展国际渠道业务。
          tone: positive
        - label: C 轮成长期融资
          date: '2022-04-05'
          detail: 完成由 General Atlantic 领投的 1 亿美元 C 轮融资，重点投入围栏控制与企业级产品能力研发。
          tone: positive
        - label: D 轮融资与全球扩张
          date: '2024-04-08'
          detail: 完成由 General Atlantic 领投、StepStone Group 参投的 1.15 亿美元 D 轮融资，推进全球部署并启动潜在 IPO 筹备。
          tone: positive
        - label: E 轮融资与 5 万客户突破
          date: '2025-04-10'
          detail: ThreatLocker 完成 $60M-$67M E 轮融资，估值 $1.2B，并将全球受保护客户机构扩大至 50,000 家以上。
          tone: positive
        - label: F 轮融资与 AI 安全发布
          date: '2026-07-29'
          detail: 以 17.9 亿美元估值完成由 Elephant 领投、Koch Disruptive Technologies 参投的 1.9 亿美元 F 轮融资，受保护机构达 70,000 余家，并向英国雷丁拓展。
          tone: positive
        - label: 全球团队与成熟渠道网络
          date: '2026-08-01'
          detail: 全球员工跨越五大洲超过 700 人，并在梅特兰、都柏林、迪拜、布里斯班和雷丁设立业务枢纽。
          tone: neutral
    claimRefs:
      - CO005
      - CO010
