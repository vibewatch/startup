        title: 采购方、最终用户与采纳路径
        blocks:
          - type: paragraph
            body: >-
              证据显示，核心买方是安全与 IT 负责人，日常使用者是系统管理员和安全分析师，付款方则是运营企业或其托管服务提供商。Exa 目录显示 ThreatLocker 正把营收拓展到 MSP
              和企业市场；TrustRadius 用户评测看重软件审批、快速支持、简便的 Agent
              部署，以及中小企业可负担的价格。金融机构需求尤为迫切：监管披露、第三方集中和身份数据暴露，让控制证据与事件响应成为董事会级议题。落地通常从终端基线与白名单开始，再扩至提权、网络或存储策略，最后加入监控。即便
              Agent 部署很快，整个过程仍需实施投入。
