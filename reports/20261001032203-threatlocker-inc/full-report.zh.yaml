      - number: '5.3'
        title: 技术差异化与无文件/离地攻击防御机制
        blocks:
          - type: paragraph
            body: >-
              ThreatLocker 最核心的技术壁垒，在于能够有效瓦解屡屡绕过常规基于特征码 EDR 检测的离地攻击（Living-off-the-Land,
              LotL）与无文件恶意软件。网络黑客频繁借助操作系统预装的合法运维组件（如 PowerShell、远程桌面 RDP
              或脚本引擎）发起横向移动并窃取核心机密，期间完全无需向靶机植入外部恶意程序。ThreatLocker 巧妙结合 Ringfencing、动态 Network Control
              与诱饵金丝雀（Canary）模拟检测，彻底封堵该攻击路径：Ringfencing
              严格隔离放行软件的调用链，使得文档处理软件无法私自唤醒脚本解释器，脚本工具亦无法随意向外部公网建立连接。为在确保生产环境绝对安全的前提下研判未知软件请求，平台内置了由虚拟桌面基础架构（VDI）驱动的云端隔离沙箱
              Testing Environment。该沙箱可秒级拉起纯净虚拟机运行待检二进制文件，捕获其文件系统与注册表读写痕迹，并与 VirusTotal
              威胁分类库交叉比对哈希；同时沙箱内布设了高仿核心机密的诱饵文件，一旦待审程序发生读取企图，系统立即将其标记为可疑恶意行为并终止策略下发。针对多租户场景的底层吞吐扩展性，系统采用基于 C#/.NET 打造的高性能
              RESTful Web API 作为通信枢纽，将分布式终端 Agent、核心数据层与管理控制台紧密联通。
            claimRefs:
              - CE002
              - CE008
              - CE009
              - CE011
              - CE012
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
      - number: '5.4'
        title: 信任度、安全治理与工程运维瓶颈
        blocks:
          - type: paragraph
            body: >-
              推行默认拒绝应用管控体系，必然会对企业 IT
              组织提出极高的运维依赖、策略维护负荷与治理规范要求。尽管默认拒绝架构能够极大程度阻断勒索病毒蔓延与越权执行，但若策略配置界限失准，极易误阻关键业务工作流、阻断自研内部软件构建，甚至在大型软件升级周期内引发审批工单堆积。ThreatLocker
              借助云端社区策略库来平滑落地阻力，允许客户直接订阅由安全同行与 ThreatLocker 官方工程团队维护的主流规则集。此外，Unified Audit 审计日志能满足各类强合规要求，如 NIST 网络安全框架与
              FTC 合理安全基准中关于严格访问控制、全量日志留存及快速响应的条款。然而，商业合作与大型项目交付仍伴随持续的运营与法律隐患。公开法庭卷宗记载，ThreatLocker 正卷入与 Charles Schwab &
              Co. 的联邦法院商业合同诉讼（Middle District of Florida，案号 6:25-cv-923-AGM-LHP），无陪审团法官审判已排期至 2027 年 7
              月。此外，公开技术披露中仍缺少独立第三方基准，用于评估复杂非 Windows 环境下 Agent 驱动带来的性能开销。因此，跨平台部署尽调仍需重点核查这项缺口。
            claimRefs:
              - CE007
              - CE010
              - CE014
      - number: '5.5'
        title: 展品
        blocks:
          - type: callout
            title: 默认拒绝架构封堵离地攻击利用敞口
            body: >-
              不同于传统终端检测工具在可执行文件启动后才比对特征码或启发式分析可疑动作，ThreatLocker 的默认拒绝架构直接在源头阻止不可信文件加载运行。借助 Ringfencing™，即使是 PowerShell 和
              Microsoft Office 等已获批放行的实用程序也会受到严格的行为围栏管控，严禁越权触碰敏感文件库、系统注册表或向外部网络建立连接。
