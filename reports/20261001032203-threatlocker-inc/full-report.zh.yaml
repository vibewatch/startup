  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律诉讼、办公租赁与监管合规风险敞口
        blocks:
          - type: paragraph
            body: >-
              ThreatLocker 当前最迫近的现实法律风险敞口，源于其与 Charles Schwab & Co., Inc. 就总部商业租赁合同产生的诉讼纠纷。该案最初由 ThreatLocker 于 2025 年 4
              月 9 日向 Florida 州法院（Orange County 第九司法巡回法院）提起，案号为 2025-CA-003071-O，随后于 2025 年 5 月 27 日被移送至美国联邦地区法院佛罗里达中区法院
              Orlando 分院，案号变更为 6:25-cv-00923 (CR001)。起诉状就公司位于 Maitland, Florida 的 1950 Summit Park Drive
              总部主要办公物业提出了强制实际履行主张及多项违反租约指控；公司现有场地的年租金开支超过 $500,000，且针对面积达 21,373 平方英尺整层拓展空间的期权年费用亦需再支出 $500,000
              (CR002)。ThreatLocker 称对方违约行为已对日常经营造成实质性干扰，在公司正大举扩建集中式实体客服支持团队与总部职能之际构成了显性运营瓶颈
              (CR003)。联邦法院备案文件证实该项纠纷仍处于白热化对抗阶段，近期截至 2026 年 9 月法院卷宗仍记录有调解员介入与本地诉讼规则通知 (CR004)。与此同时，ThreatLocker
              身处动态演进的合规监管环境中，众多客户依赖该平台以满足 NIST、FTC 与 CISA 网络安全基线标准要求 (CR005)。尽管 ThreatLocker
              自身并未被列为外部重大企业数据泄露诉讼的被告，但金融与制造等领域的司法判例表明，安全软件厂商及用人单位在第三方供应商审查与合理网络安全基线义务上面临着与日俱增的法律追偿与集体诉讼风险 (CR006)。
