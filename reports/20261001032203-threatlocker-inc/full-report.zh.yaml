      - number: '2.2'
        title: 基于有限证据的市场规模测算
        blocks:
          - type: paragraph
            body: >-
              现有资料未披露细分品类营收、终端装机量、单终端客单价、附加组件选购率或口径一致的地域分布，因而无法精确测算得出具体金额口径的总可用市场（TAM）或可服务市场（SAM）。审视公司业务体量最具体的切入点，是一份引用公司声称截至
              2026 年 7 月保护超过 70,000
              家机构的独立分析简报；但这仅是装机覆盖指标，不能等同于付费客户数，亦非测算市场渗透率的基准分母。需求信号在金融服务业表现最为迫切：公司官方文章列举了勒索软件发生率、灾后恢复成本及第三方数据泄露暴露面，但底层数据集未收录于本批研究材料中。此类观察能印证市场需求的紧迫性，却无法推导得出确切的营收空间。因此，严谨的投资判断应基于尽调中核实的真实终端数量与实际客单价来构建可触达市场模型。
