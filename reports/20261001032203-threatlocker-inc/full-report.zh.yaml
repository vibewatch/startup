      - number: '8.4'
        title: 附表
        blocks:
          - type: callout
            title: 估值立场与投资建议
            body: >-
              给予 ThreatLocker「跟踪」（Track）评级与「偏高」（Stretched）估值立场。尽管公司将防护版图拓展至逾 70,000 家机构并以 $1.79 billion 估值斩获 $190
              million Series F 轮融资，展现出强劲的商业势头，但在缺乏毛利率、净留存率或现金消耗率等经审计 GAAP 数据支撑的情况下，18x 至 25x 的隐含市销率倍数已处于偏高区间。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV012
              - CV014
          - type: callout
            title: 下行风险与估值倍数收缩
            body: >-
              若二级市场对中等梯队终端安全厂商的估值倍数继续向 8x 至 10x ARR 的历史中位数收缩，ThreatLocker 将面临显著下行风险。在缺乏内部一手 ARR 与利润率数据的情况下，若增长在拟定 IPO
              前放缓，二级老股买方将面临下行风险敞口。
            calloutType: risk
            claimRefs:
