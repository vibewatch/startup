      - number: '2.4'
        title: 驱动因素、制约瓶颈与估值关联
        blocks:
          - type: paragraph
            body: >-
              需求主要来自勒索软件暴露、安全防护不足引发的诉讼、趋严的监管合规要求、安全供应商集中风险，以及混合云 IT 架构的普及。ThreatLocker 一篇混合云文章称，80%
              的企业正在采用公有云与私有云并用的架构；但文章没有交代原始调研出处、地域分布或样本构成，因此只能作为方向性的公司发布材料。采纳仍可能卡在策略制定耗时、默认拒绝控制偶尔干扰日常操作、传统终端安全套件捆绑销售、定价不透明，以及向买方证明相对既有安全投入的增量投资回报率（ROI）。估值层面，公开装机规模和工作流覆盖广度是积极的体量信号；但细分市场基准分母、各客群转化率、客户定义和定价明细均缺失，公开证据仍无法验证市场份额与渗透率。
