      - number: '3.3'
        title: 定价透明度、渠道分销与切换成本断层
        blocks:
          - type: paragraph
            body: >-
              商业条款透明度是各方横向比对中最薄弱的一环。Software Advice 记录 ThreatLocker
              采取按需询价机制，但现有证据未提供任何实际履约合同金额、按终端或席位划分的单价、签约年限、阶梯折扣表，亦无直接可比的竞品定价。TrustRadius 按小型、中型及大型企业买方维度梳理各备选方案，Software
              Advice 展示了其与 IT
              工作流集成的重合度，但二者均未披露渠道分成让利空间、分销商保底承诺或获客经济效益。部署后建立的策略基准固然可能产生一定的切换成本，但保留的材料中没有一项评估了迁移所需人工、多方案共存成本、续约行为特征或多厂商共用机制。定价表格因而将已披露的模块范围与未知的商业条款明确区分。在评估
              ThreatLocker 相对于巨头捆绑方案的定价权或锁定效应价值之前，尽调阶段必须获取标准化报价单与历史迁移案例记录。
            claimRefs:
              - CP005
