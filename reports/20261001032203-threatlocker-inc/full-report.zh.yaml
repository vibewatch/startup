  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 营收来源与定价体系
        blocks:
          - type: paragraph
            body: >-
              ThreatLocker 定位为专注跨终端、服务器与网络环境交付 Zero Trust
              架构的专业网络安全软件厂商。商业化平台以应用执行控制、白名单、Ringfencing、存储控制、网络访问控制及终端检测与响应（EDR/MDR）能力为支柱。商业变现主要采用多层级 SaaS 模式，按受保护终端及
              Agent 数量按月或按年计费。核心价值主张建立在默认拒绝执行机制之上，抢在恶意代码启动前阻断未经批准的软件、脚本与代码库。ThreatLocker
              官方网站未公开发布固定标价，而是推行基于按需询价的企业与合作伙伴商务模式，并配套标准的 30 天免费试用期。实际成交价随终端采购阶梯量级、多模块打包方案及渠道合作伙伴协议条款浮动；企业级客户支持由设立在
