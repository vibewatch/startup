  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群细分客群与渠道分销格局
        blocks:
          - type: paragraph
            body: >-
              ThreatLocker 的商业版图建立在差异化的多租户 Zero Trust
              架构之上，针对不同客群层级提供弹性匹配。公司绝大部分分销出货依托托管服务提供商（MSP）与托管安全服务提供商（MSSP），由后者将默认拒绝应用白名单、Ringfencing
              与提权控制深度打包进面向中小企业客户的日常安全托管服务包。除 MSP 渠道外，ThreatLocker 亦面向资源有限的公立 K-12 学区、涵盖地方执法机构在内的基层政府部门，以及 Orlando
              Magic、Indianapolis Colts 等知名职业体育娱乐特许经营权机构交付直销及伙伴协助部署项目。此外，ThreatLocker 在大型交运与跨国枢纽领域打造了包括 JetBlue 与
              Heathrow Airport 在内的行业标杆客户。这种分层的渠道网络使 ThreatLocker
              摆脱了前期自建庞大企业直销团队的高昂包袱，以更快的节奏铺开全球业务网络，但也由此形成了对第三方渠道合作伙伴关系与分成结算模式的战略依赖。
