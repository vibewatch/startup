  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              ThreatLocker 的核心投资逻辑在于其差异化的默认拒绝（default-deny）Zero Trust 架构，将终端防御从被动检测转向确定性应用控制。公司企业客户网络从 2025 年的逾 50,000
              家扩展至 2026 年 7 月全球逾 70,000 家受保护机构，在托管服务商（MSP）与大企业客户中建立了显著的分销势能。其持续扩展的产品矩阵涵盖
              Allowlisting、Ringfencing、Storage Control、Network Control、ThreatLocker Detect、Elevation Control 及
              Configuration Manager。反向逻辑则直指核心财务运营指标极度不透明。二级市场对 ThreatLocker 年营收的估算差异极大：早期尽调记录显示为 $71.5 million，行业总结普遍援引
              $100 million，第三方数据库未经证实的估算在 $25 million 至 $100 million 不等，投机性推测甚至跨越 $1 billion 至 $10
              billion。公司从未公开披露年度经常性收入（ARR）、毛利率、净金额留存率（NRR）或运营现金消耗率。此外，ThreatLocker 记录的外部平台诉讼案例——包括第三方服务商 Marquis
              Software Solutions 遭勒索软件入侵，以及 Treasure Global 遭遇域名劫持——凸显出网络安全与托管 IT 服务商正面临日益严峻的法律责任、数据泄露冲击及系统性运营风险。
