  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户业务工作流
        blocks:
          - type: paragraph
            body: >-
              ThreatLocker 践行默认拒绝的 Zero Trust
              理念，从根本上区别于传统被动防护型杀毒软件与事后检测平台。它并不依赖维护庞大的已知恶意特征码黑名单，亦不依赖在恶意代码启动后再通过启发式规则搜寻可疑行为，而是从源头阻断所有软件、脚本与代码库的运行，除非该对象已被显式策略授权放行。当
              ThreatLocker 终端 Agent 首次部署至企业终端与服务器时，会先进入自动化学习模式（Learning
              Mode），对已安装的可执行文件、关联依赖与运维脚本完成详尽建档。学习周期结束后，管理员对批准的软件资产进行审核固化基线，将全部设备切换至锁定阻断模式，使不受信任的二进制文件默认禁止运行。为兼顾业务敏捷性并降低员工停工等待成本，平台将严苛的默认拒绝边界与自动化审批流无缝衔接。一旦终端遇上未登记的二进制文件，系统会向用户弹出极简的访问申请界面，方便系统管理员或签约
              MSP 服务商评估文件安全性，通常在约 60 秒内即可完成细粒度授权。此外，平台由 24/7/365 Cyber Hero
              技术支持团队保驾护航，在遇到权限升级流转、紧急审批及部署疑难时提供极速技术支持，通常响应时效锁定在 60 秒以内。
            claimRefs:
              - CE001
              - CE006
              - CE007
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
              - CE007
      - number: '5.2'
        title: 核心安全模块与运行技术架构
        blocks:
          - type: paragraph
            body: >-
              ThreatLocker 旗下产品矩阵由 7 大互联协同的功能模块构成，对终端、服务器与存储资产构筑纵深防御体系。Application Allowlisting
              作为基础屏障，坚决拦截未经批准的可执行程序、动态链接库（DLL）及脚本；Ringfencing™ 直接在此基石上对放行程序设定细粒度行为边界，严控诸如 PowerShell、Command Prompt 或
              Microsoft Office 等合法实用工具越权访问敏感文件、擅自修改系统注册表、调用外部互联网 IP 地址或派生异常子进程；Elevation Control
              彻底根除常驻本地管理员特权账号带来的漏洞敞口，提供针对指定受信任应用程序的即时（Just-In-Time）临时提权，而非放开整套桌面会话特权；Storage Control
              则基于用户身份、时段及应用凭据策略，严密管控对本地文件夹、网络共享盘与外部 USB 存储设备的访问行为，并对可移动介质强制实施加密以杜绝数据外泄；Unified Audit
              充当集中式日志审计中枢，毫秒级实时记录所有放行、阻断、提权及文件访问事件；Configuration Manager 无需借助 Active Directory
              域控制器即可在分布式终端上统一分发操作系统安全基线；ThreatLocker Detect 则持续研判端点遥测指标，精准捕获失陷指征（IoC），联动执行自动化隔离并向企业 SOC 安全运营团队实时告警。
            claimRefs:
              - CE001
