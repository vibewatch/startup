      - number: '1.2'
        title: 核心高管、创始人履历与公司治理结构
        blocks:
          - type: paragraph
            body: >-
              ThreatLocker 由首席执行官 Danny Jenkins、首席运营官 Sami Jenkins 与首席质量保证官 John Carolan 联合创立。Danny Jenkins 于 1997
              年开启网络安全职业生涯，在企业 IT 管理与多次创业中积累了深厚的系统工程经验。创立 ThreatLocker 的契机，始于 Jenkins
              目睹一起企业钓鱼入侵造成的严重后果：该事件致使企业业务瘫痪且险遭覆灭，彻底暴露出基于特征码与启发式杀毒工具的系统性缺陷。Sami Jenkins 主管运营执行、人员扩张与跨国据点建设；John Carolan
              则统筹软件质量工程、内核级客户端兼容性与 Agent 稳定性。管理团队还吸纳了主管平台基础设施与技术创新的首席技术官 Michael Jenkins，以及统筹财务规划、资本结构与成长期股权融资的首席财务官
              Ross McIntosh。尽管公司在产品、销售、市场及运营职能上已建立起广泛的管理覆盖，但 ThreatLocker 对作为核心愿景制定者与首席技术布道者的 Danny Jenkins
              仍存在较强的关键人物依赖。此外，正式董事会席位构成及具体专门委员会治理结构至今仍未公开。
            claimRefs:
              - CO002
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
