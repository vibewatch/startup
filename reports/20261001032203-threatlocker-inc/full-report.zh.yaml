      - number: '8.3'
        title: 情景分析、退出就绪度与尽调要点
        blocks:
          - type: paragraph
            body: >-
              评估 ThreatLocker 中期股权价值，需权衡终端规模扩张与激进的一级市场估值倍数，并对标潜在上市要求。在乐观情景下，ThreatLocker 顺利变现现有的 70,000 家受保护机构客户群，推动 ARR
              迈向 $200 million 且毛利率超过 75%，并按 15.0x 估值倍数成功 IPO，对应股权估值 $3.00 billion（较 Series F 轮实现 1.68x 毛投资回报倍数
              MOIC）。在基准情景下，ARR 稳步增至 $140 million，但二级市场倍数承压将远期市销率压制在 10.0x，对应股权估值 $1.40 billion（较 Series F 轮投后折价
              -22%）。在悲观情景下，捆绑平台套件（如 Microsoft Defender、CrowdStrike 及 SentinelOne）的竞对挤压与中小企业渠道持续的价格压力将 ARR 压制在 $90
              million，估值倍数回落至 8.0x，对应股权估值 $720 million（下行幅度 -60%）。出资前的核心尽调要点包括：获取经审计的 GAAP 利润表与现金流量表、核实 MSP
              渠道的历史流失率与净留存率，并查验 Series D、E、F 轮优先股的清算优先权条款。
            claimRefs:
