      - number: '3.2'
        title: 功能差异化与全家桶套件挤压
        blocks:
          - type: paragraph
            body: >-
              ThreatLocker 标榜的核心差异化优势在于执行层管控：放行必要代码，默认阻断一切未授权行为。公司对外公开材料将这一理念进一步延伸至
              Ringfencing、存储、权限提升、网络、威胁检测、补丁管理、配置管控及云端策略等模块。TrustRadius 显示各替代方案的侧重点截然不同：SentinelOne 侧重防病毒与 EDR
              深度融合；Microsoft Defender 贯穿漏洞管理、自动化修复与托管威胁搜寻；WatchGuard 则将 EDR
              与补丁修补、内容过滤、数据加密等多项控制打包交付。这类横向对照只能说明大致方向，不能充当独立功效基准。ThreatLocker
              的功能陈述均属公司单方披露，而第三方软件目录多为品类归纳，未开展实验室基准比对。因此，市场竞争压力来自双重维度：垂直厂商能在检测、响应或特权工作流上做深做精，平台型套件则能通过打包捆绑重叠功能实施挤压。矩阵中缺乏证据支持的单元格统一标记为未知，而非推定为产品功能缺失。
