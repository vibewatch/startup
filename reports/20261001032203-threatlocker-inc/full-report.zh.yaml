      - number: '1.5'
        title: 展品
        blocks:
          - type: callout
            title: 范式转移：在智能体 AI 时代践行默认拒绝安全机制
            body: >-
              ThreatLocker 核心架构特征在于彻底颠覆传统的响应式 EDR
              被动检测范式。它并非在代码进入终端后扫描已知恶意特征码，而是在默认状态下直接阻断所有未经批准的脚本、可执行文件与运行库。随着企业环境逐步引入自主 AI 智能体与动态代码生成，这一默认拒绝基线与细粒度
              Ringfencing 管控，在防范未授权工具调用及横向数据外发时正变得愈发关键。
            calloutType: insight
            claimRefs:
              - CO008
              - CO014
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              狭义市场聚焦于终端应用管控：裁定哪些应用程序、脚本、进程与提权请求获准运行，继而强制执行默认拒绝策略。ThreatLocker
              将其视作平台立足之本，并表示部署耗时仅需数小时至数天。广义层面的竞争预算则与终端检测与响应、特权访问控制、网络微分段、存储控制及混合云安全重叠，但这几类预算不应全数计入 ThreatLocker
              的潜在可用支出。现状替代品涵盖宽松的终端权限策略、操作系统自带原生控件、管理员人工审批，以及未搭载默认拒绝应用控制的传统防病毒或 EDR 方案。用户反馈表明该产品可由现有 IT
              人员运维管理，但策略自学习与审批流配置仍属于实际落地层面的推进工作，绝非零阻力的即插即用采购。
            claimRefs:
