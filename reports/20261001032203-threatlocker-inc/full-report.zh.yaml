  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争边界与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              ThreatLocker 面临的竞争边界远超出传统终端安全同业清单范畴。Owler 列出了 CyberArk、SentinelOne 与 Huntress；TrustRadius 则将 Microsoft
              Defender、WatchGuard 等终端安全产品纳入买方比选池。Software Advice 平台更将 N-central、NinjaOne 等 RMM、数据备份、IT
              文档与系统管理工具列入关联比对。此类广泛交叉印证出，MSP 或内部 IT 团队往往倾向借助涵盖范围更广的管理软件栈解决相邻工作流需求，而非单独采购一对一的安全管控工具。ThreatLocker
              自身则将核心定位确立为跨终端、云端及网络环境的默认拒绝管控体系。因此，其直接竞品为垂直终端安全平台；既有巨头包括综合安全软件套件；相邻赛道涵盖
              RMM、备份及特权访问工具；替代方案则包括操作系统自带捆绑控件或内部策略自研管理。所分配的研究材料未对后两项方案的有效性及总体拥有成本进行基准测试，因而它们仍属于尽调阶段的假设推论，而非已被验证的等效替代方案。
