chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、创立使命与 Zero Trust 运行架构
        blocks:
          - type: paragraph
            body: >-
              ThreatLocker, Inc. 是一家成立于 2017 年的非上市网络安全软件公司，总部位于 Orlando 大都会区 Maitland, Florida。公司深耕企业安全与网络管理领域，提供终端 Zero
              Trust 安全平台，旨在推动企业从传统被动检测转向严格的默认拒绝运行架构。在该模式下，所有未经授权的软件、可执行文件、脚本、动态链接库（DLL）及未验证进程默认均被禁止运行。核心产品组合涵盖
              Application Allowlisting、Ringfencing、Storage Control、Network Control、Elevation Control 与 ThreatLocker
              Detect。Ringfencing
              对获准运行的软件设定细粒度行为边界，防止合法应用程序遭恶意利用以执行未授权命令或外发敏感文件。公司早期依托托管服务提供商（MSP）渠道在中小企业市场确立产品契合度（PMF），随后在全球范围向中型企业与大型企业层级渗透；截至
              2026 年，其服务机构已超过 70,000 家，跨越五大洲雇佣逾 700 名员工。
            claimRefs:
