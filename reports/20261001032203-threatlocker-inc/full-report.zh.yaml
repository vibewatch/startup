          'y': 4
          note: 广泛的 IT 运维相邻领域，重合功能比例有限
        - label: 自研构建 / 原生控制现状
          x: 1
          'y': 2
          note: 作为明确尽调假设予以保留且未经对标的替代方案
    approximationNotes: 仅基于指定描述的 1-5 序数分析师综合评估：x 轴衡量已有记录的默认拒绝执行控制侧重点，y 轴衡量已有记录的相邻套件广度。评分并非实测结果、市场份额或定价排名。
    claimRefs:
      - CP001
      - CP003
      - CP007
      - CP009
      - CP010
      - CP011
      - CP013
  - id: FI001
    title: 商业模式转化链路
    type: flow
    summary: 展示 ThreatLocker 如何将 MSP 渠道分销及终端代理安装转化为持续性订阅收入的结构化序列。
    data:
      nodes:
        - id: channel-onboarding
          label: 1. MSP 及企业渠道接入
          detail: ThreatLocker 通过直销团队与 30 天免费试用吸纳 IT 服务提供商和企业 IT 团队。
        - id: agent-deployment
          label: 2. 终端代理安装
          detail: 在客户终端及服务器上部署轻量级代理以实现默认拒绝。
        - id: policy-learning
          label: 3. 学习模式与基线策略
          detail: 在实施锁定前，自动对已授权应用程序哈希、脚本及代码库建立目录索引。
        - id: subscription-billing
          label: 4. 按月订阅计费
          detail: 直接计费或通过 MSP 合作伙伴协议按月计费的单终端循环软件许可。
        - id: service-delivery-support
          label: 5. Cyber Hero 支持与交付
          detail: 提供 24/7 持续运维、规则管理及不间断威胁情报更新。
        - id: modular-expansion
          label: 6. 模块化 SKU 增销拓展
          detail: 交叉销售包括 Detect MDR、Network Control 与 Elevation Control 在内的更多平台模块。
        - id: gross-profit-realization
          label: 7. 毛利实现
          detail: 在扣除云端多租户基础设施和支持人力成本后实现的净贡献。
    approximationNotes: 代表 SaaS 业务运营转化流程的业务过程模型；财务转化比例仍未披露。
    claimRefs:
      - CI001
      - CI004
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 展示 ThreatLocker 多租户管理、API 网关、VDI 沙箱、审计引擎、终端执行及操作系统驱动层级的六层架构模型。
    data:
      layers:
        - label: 展示与管理层
          detail: 多租户云管理门户、审批工作流控制台及 ThreatLocker Community 社区中心
          modules:
            - Web 管理门户
            - 移动端与 Web 审批界面
            - 社区策略库
            - Cyber Hero 支持网关
        - label: API 与编排调度层
          detail: 可扩展的 C#/.NET RESTful Web API，在云端与终端之间路由指令、策略及遥测数据
          modules:
            - RESTful 代理 API 网关
            - 租户策略引擎
            - 审批请求中介
            - 身份与认证服务
        - label: 评估与测试基础设施层
          detail: 云端托管的隔离虚拟桌面基础设施（VDI），用于执行不受信任的二进制文件并审计行为
          modules:
            - 自动化 VDI 沙箱
            - VirusTotal 情报集成
            - 金丝雀数据访问监控器
            - 实时注册表与网络跟踪器
        - label: 检测与统一审计层
          detail: 集中式日志记录与实时行为分析引擎，摄取终端运行遥测数据
          modules:
            - 统一审计引擎
            - ThreatLocker Detect 引擎
            - 失陷指标（IOC）匹配器
            - Cyber Hero MDR 服务
        - label: 本地终端执行层
          detail: 轻量级终端代理，直接在客户端计算机与服务器上强制执行底层安全规则
          modules:
            - 应用程序白名单过滤器
            - 围栏策略边界
            - 特权提升控制中介
            - 存储控制与加密模块
        - label: 网络与操作系统接口层
          detail: 跨终端和服务器的动态数据包检测、防火墙 ACL 管理及操作系统内核钩子
          modules:
            - Network Control 动态 ACL
            - Windows 内核过滤驱动程序
            - 按需端口控制器
            - 配置管理器基线
    approximationNotes: 架构层级划分综合自 ThreatLocker 解决方案概览、工程招聘职位说明及技术解决方案文档。
    claimRefs:
      - CE008
      - CE009
      - CE012
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 说明从初始 MSP 试用与导入、默认拒绝锁定、日常运维支持到套件扩展采纳各阶段的客户旅程图。
    data:
      nodes:
        - label: 需求发掘与 MSP 评估
          touchpoints:
            - Partner webinar & industry event demo
            - Cyber Hero 30-day free trial deployment
            - MSP multi-tenant console evaluation
        - label: 客户导入与学习模式
          touchpoints:
            - Automated environment audit and application discovery
            - Baseline policy profiling across endpoints and servers
            - Early threat neutralization before commercial purchase
        - label: 核心零信任锁定
          touchpoints:
            - Default-deny Application Allowlisting activation
            - Ringfencing boundaries on built-in tools (PowerShell, RDP)
            - Elevation Control eliminating local administrative rights
        - label: 日常运营管理与技术支持
          touchpoints:
            - Under 60-second administrative file approval workflows
            - Cyber Hero 24/7 technical and phone support access
            - Reduction in helpdesk tickets for unauthorized software
        - label: 套件拓展与 MDR 叠加
          touchpoints:
            - Addition of Storage Control for USB and backup shares
            - Deployment of Network Control endpoint firewall rules
            - ThreatLocker Detect and 24/7 Managed Detection & Response (MDR)
        - label: 年度续约与渠道规模化拓展
          touchpoints:
            - Audit log verification for cyber insurance renewals
            - MSP cross-client policy replication and tier expansion
            - Enterprise multi-site compliance benchmarking
    approximationNotes: 阶段划分反映了案例研究与产品文献中所记录的标准厂商接入工作流及模块扩展时序。
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU008
      - CU010
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 从发生概率和严重程度两个维度评估 ThreatLocker 的主要风险向量，以展现机构残留风险敞口。
    data:
      columns:
        - 可忽略严重程度
        - 低严重程度
        - 中等严重程度
        - 高严重程度
        - 极高严重程度
        - 灾难性严重程度
      rows:
        - label: 高发生概率
          values:
            - 常规供应商干扰
            - 供应商集中度
            - 总部租赁纠纷
            - MSP 渠道流失风险
            - 内核执行锁定风险
            - 企业全面停摆
        - label: 中等发生概率
          values:
            - 轻微策略延迟
            - 跨国协同摩擦
            - 监管合规审计
            - 离地攻击防御绕过
            - 资金消耗殆尽
            - 宿主平台接口弃用
        - label: 低发生概率
          values:
            - 遥测数据丢包
            - 轻微供应商中断
            - 单租户故障停机
            - 诉讼败诉且无抗辩余地
            - 系统性平台瘫痪
            - 公司彻底破产倒闭
    notes: 梳理 ThreatLocker 主要法律、运营与财务风险发生概率与严重程度的风险矩阵。
    claimRefs:
      - CR001
      - CR003
      - CR008
      - CR010
      - CR012
      - CR014
  - id: FV001
    title: ThreatLocker 估值与决策逻辑流
    type: flow
    summary: 贯通业务规模、财务不透明度与倍数溢价，最终导出「观察」（Track）建议的决策路径。
    data:
      nodes:
        - id: scale-driver
          label: 业务规模：70k+ 机构与 $190M Series F 轮融资
          value: 70,000 orgs
        - id: gap-driver
          label: 不透明：ARR、利润率与烧钱速度未披露
          value: No audited GAAP
        - id: multiple-driver
          label: 估值：投后估值 $1.79B（18x-25x EV/Rev）
          value: 17.9x - 25.0x EV/Rev
        - id: comparables-driver
          label: 对标公司：上市终端安全公司 P/S 处于 8x-14x
          value: 8.0x - 14.4x P/S
        - id: downside-driver
          label: 下行情景：倍数压缩至 8x-10x 的风险
          value: '-22% to -60% risk'
        - id: recommendation-node
          label: 最终立场：估值偏高 / 维持「观察」（Track）姿态
          value: Track Stance
      edges:
        - from: scale-driver
          to: gap-driver
        - from: gap-driver
          to: multiple-driver
        - from: multiple-driver
          to: comparables-driver
        - from: comparables-driver
          to: downside-driver
        - from: downside-driver
          to: recommendation-node
    approximationNotes: 该逻辑流综合呈现了业务规模验证、估值偏高以及核心财务基本面缺失之间的权衡关系。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV012
      - CV014
