    title: 受证据约束的目标市场层级
    type: pyramid
    summary: 该层级结构将广泛的相邻技术环境层层收窄至已披露的 ThreatLocker 安装基数，避免给出缺乏证据支持的金额化 TAM。
    data:
      nodes:
