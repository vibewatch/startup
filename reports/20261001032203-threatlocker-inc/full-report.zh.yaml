      - number: '1.4'
        title: 业务规模里程碑、全球扩张与竞争格局
        blocks:
          - type: paragraph
            body: >-
              2017 年至 2026 年间，ThreatLocker 从早期白名单原型演进为跨国网络安全厂商。受保护机构规模从 2025 年的逾 50,000 家扩增至 2026 年年中的逾 70,000 家，连续上榜
              Inc. 5000 全美增长最快私营企业榜单。ThreatLocker 积极扩张海外实体运营据点，在 Dublin、Dubai、Brisbane 以及英国 Reading 设立区域分支机构，提供本地化的
              24/7/365 Cyber Hero 支持服务。公司设有活跃的威胁情报团队，持续追踪分析外部重大安全事件，包括 2025 年 8 月 INC RANSOM 犯罪团伙针对 Monterey Mushrooms
              发起的勒索攻击，以此印证未隔离网络与过度凭据分配如何致使攻击者窃取未加密数据记录。放眼更广阔的市场，ThreatLocker 身处竞争极为激烈的环境，既要抗衡 CrowdStrike、Microsoft
              Defender for Endpoint 与 SentinelOne 等平台型终端检测与响应（EDR）巨头，又要应对 Airlock Digital 与 BeyondTrust
              等专注白名单与最小特权管控的垂直厂商，亟需在自主 AI 工具治理、网络流量管控及云访问权限等领域保持持续创新。
