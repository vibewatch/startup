              - CO006
      - number: '1.3'
        title: 融资历程、估值演进与投资方阵容
        blocks:
          - type: paragraph
            body: >-
              ThreatLocker 自成立以来已完成 7 轮机构融资，经历了从早期孵化到大规模成长期股权融资的完整演化。2017 年入驻 MACH37 完成早期种子孵化后，公司于 2020 年完成由 Arthur
              Ventures 领投的 $4.44 million A 轮融资；2021 年完成由 Elephant 领投的 $20 million B 轮融资。随着业务扩张提速，公司于 2022 年与 2024 年先后完成
              $100 million C 轮与 $115 million D 轮融资，两轮均由 General Atlantic 领投，StepStone Group 与 D. E. Shaw Ventures
              跟投。2025 年 4 月，ThreatLocker 完成 $60 million 至 $67 million 的 E 轮融资，以 $1.2 billion 估值晋升独角兽。最新一轮融资公布于 2026 年 7
              月 29 日，ThreatLocker 宣布完成 $190 million F 轮融资，由 Elephant 领投，D. E. Shaw Ventures 与 Arthur Ventures 参投，并获得
              Koch Disruptive Technologies 重磅战略注资。二级市场投资机构将其投后估值定格在约 $1.79 billion，对应累计融资金额 $489.4
              million。尽管获得多家机构加持并可能正在筹备 IPO，ThreatLocker 仍未公开披露经审计的 GAAP 营收、年经常性收入（ARR）、毛利率或现金消耗率，这一信息断层仍需通过进入数据室（Data
              Room）深入核实。
