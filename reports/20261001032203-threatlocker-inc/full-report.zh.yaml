            body: >-
              ThreatLocker 的商业化拓展极度依赖面向中小企业的托管服务提供商（MSP）与托管安全服务提供商（MSSP）分销体系
              (CR012)。尽管该渠道实现了向数万家客户机构的高效多租户软件交付，但也引发了下游合作伙伴高度集中的风险；一旦遭遇渠道客户流失、MSP
              运维软件栈整合削减，或爆发供应商商务纠纷，将对净留存率与新客获取产生不成比例的负面冲击 (CR013)。财务上，ThreatLocker 资本消耗激进，历经多轮机构股权融资累计募资 $469M 至
