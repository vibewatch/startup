evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Formal board of directors composition, investor voting rights, protective covenants, and liquidation preference
      terms across Series D through Series F financing rounds.
    whyItMatters: >-
      Without board seat allocation and protective provisions, minority investors cannot evaluate institutional control
      dynamics or potential founder dilution overhang.
    diligencePath: >-
      Review ThreatLocker's amended and restated certificate of incorporation, investors' rights agreement, and voting
      agreements during confirmatory legal diligence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-transparency
    missingEvidence: >-
      Audited GAAP financial statements, annualized recurring revenue (ARR), gross margin percentage, net revenue
      retention (NRR), and monthly cash burn rate.
    whyItMatters: >-
      Secondary valuation benchmarks cannot be rigorously verified without audited revenue scale, SaaS unit economics,
      and cash runway projections.
    diligencePath: >-
      Request audited financial statements, historical GAAP revenue schedules, cohort retention tables, and management's
      operating budget under NDA.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-agreements
    missingEvidence: >-
      Complete executive employment contracts, non-compete agreements, key-person insurance policies, and full secondary
      leadership roster beyond named C-suite officers.
    whyItMatters: >-
      High operational dependence on visionary co-founder Danny Jenkins creates key-person operational risk that
      requires contractual and organizational mitigation.
    diligencePath: >-
      Inspect executive employment contracts, key-person life insurance documentation, and succession planning
      frameworks in the management diligence track.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Verified endpoint counts by segment, realized price per endpoint, customer conversion, retention, and expansion
      data.
    whyItMatters: >-
      Without compatible volume and pricing denominators, monetary TAM, SAM, SOM, penetration, and market share cannot
      be estimated responsibly.
    diligencePath: >-
      Obtain customer and endpoint cohorts, invoices, price books, renewal files, and segment-level pipeline exports;
      reconcile them to audited revenue.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: demand-drivers
    missingEvidence: >-
      Original FS-ISAC, SecurityScorecard, recovery-cost, and hybrid-cloud survey publications cited or repeated on
      company pages.
    whyItMatters: >-
      Company-issued secondary citations do not reveal the source methodology, geography, sample, or comparability
      needed for independent demand sizing.
    diligencePath: >-
      Request the cited studies or retrieve publisher-original datasets, then reproduce every denominator and period
      used in the market model.
    relatedQuestionRefs:
      - QM004
      - QM006
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: adoption-economics
    missingEvidence: >-
      Independent pricing, implementation effort, win-rate, displacement, churn, and return-on-investment evidence by
      buyer segment.
    whyItMatters: >-
      Buyer urgency does not establish willingness to pay, sales-cycle duration, implementation capacity, or durable
      budget ownership.
    diligencePath: >-
      Sample contracts and lost-deal records, interview customers and MSPs, and compare realized pricing and deployment
      hours across cohorts.
    relatedQuestionRefs:
      - QM005
      - QM007
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable current quotes, billing units, contract terms, discount schedules, and realized prices for ThreatLocker
      and named alternatives.
    whyItMatters: >-
      Without normalized commercial data, the analysis cannot establish relative price, bundle economics, or pricing
      power.
    diligencePath: Request matched-scope vendor quotes and a sample of recent customer contracts or invoices by segment.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: switching-costs
    missingEvidence: Measured migration labor, policy-portability, coexistence, renewal, churn, and multi-homing evidence.
    whyItMatters: These inputs determine whether configured policies create durable lock-in or merely implementation friction.
    diligencePath: Review churn cohorts, renewal records, loss interviews, migration plans, and customer administrator time studies.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: competitor-scale
    missingEvidence: >-
      Current competitor funding, customer scale, target-segment mix, and directly comparable independent efficacy
      results.
    whyItMatters: >-
      The available directories identify alternatives but do not support a scale-adjusted or performance-adjusted
      competitive ranking.
    diligencePath: >-
      Obtain current filings or official disclosures, independent lab tests, procurement records, and competitive
      win-loss data.
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: financial-underwriting
    missingEvidence: >-
      Audited income statements detailing exact ARR, subscription gross margins, net burn rate, and cohort retention
      metrics.
    whyItMatters: >-
      ThreatLocker is a private unicorn preparing for a potential public offering, but divergent third-party revenue
      estimates and lack of disclosed unit economics prevent definitive underwriting of its operating efficiency.
    diligencePath: >-
      Request confidential financial disclosure packages, auditor management letters, and SaaS retention schedules
      during private equity or pre-IPO diligence.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: revenue-estimates
    missingEvidence: Reconciliation of secondary revenue reporting ($100 million vs $380 million) against GAAP recognized revenue.
    whyItMatters: >-
      Divergent tracker estimates create an unacceptable range of uncertainty regarding actual enterprise traction and
      revenue run-rate multiples.
    diligencePath: >-
      Cross-reference customer contract billings, channel partner sell-through records, and ARR breakdown by product
      module.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: cross-platform-performance
    missingEvidence: >-
      Third-party independent kernel performance benchmarks measuring agent CPU, memory, and I/O latency under
      high-throughput process creation across macOS and enterprise Linux environments.
    whyItMatters: >-
      ThreatLocker's architectural documentation and marketing predominantly showcase Windows environments; lack of
      independent telemetry leaves enterprise non-Windows deployment risks unquantified.
    diligencePath: >-
      Request customer proof-of-concept benchmark data and engineering telemetry for non-Windows deployments during
      technical diligence sessions.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: conflicting-data
    severity: minor
    topic: enterprise-commercial-disputes
    missingEvidence: >-
      Underlying commercial agreement filings and unredacted counterclaims in ThreatLocker, Inc. v. Charles Schwab & Co.
      Inc.
    whyItMatters: >-
      Public docket filings confirm active contract litigation scheduled for 2027 bench trial, but substantive dispute
      claims remain contested under sealed or pending motions to dismiss.
    diligencePath: >-
      Review public court docket updates in case 6:25-cv-923-AGM-LHP (M.D. Fla.) and request disclosure of potential
      commercial liabilities during legal diligence.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-cohort-durability
    missingEvidence: >-
      Audited cohort retention metrics including Net Revenue Retention (NRR), Gross Retention Rate (GRR), logo churn,
      and contract renewal rates.
    whyItMatters: >-
      Without verified retention benchmarks, it is impossible to assess whether ThreatLocker's rapid customer count
      expansion reflects sticky recurring revenue or high underlying churn masked by new logo acquisition.
    diligencePath: >-
