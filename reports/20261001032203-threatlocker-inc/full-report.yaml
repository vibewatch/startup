  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              ThreatLocker operates on a default-deny Zero Trust philosophy that fundamentally departs from conventional
              reactive antivirus and post-execution detection platforms. Rather than maintaining extensive blacklists of
              known malicious signatures or attempting to heuristically detect suspicious activity after code has
              already begun running, ThreatLocker blocks all software, scripts, and libraries from executing unless they
              are explicitly permitted by policy. When the ThreatLocker agent is initially deployed across an
              organization's endpoints and servers, it operates in an automated Learning Mode that comprehensively
              catalogs installed executables, dependencies, and operational scripts. Once the learning period concludes,
              administrators review and baseline the approved software repository, placing the fleet into a locked
              enforcement posture where untrusted binaries are denied execution by default. To maintain operational
              agility and minimize employee downtime, the platform pairs this strict default-deny boundary with an
              automated approval workflow. Endpoints encountering an unlisted binary present the user with a streamlined
              access request prompt, allowing systems administrators or managed service providers to evaluate file
              safety and grant granular permissions within approximately 60 seconds. The platform further supports
              operational reliability through its 24/7/365 Cyber Hero Support Team, which delivers a lightning-fast
              response time typically within 60 seconds for administrative escalations, emergency approvals, and
              deployment assistance.
            claimRefs:
              - CE001
              - CE006
              - CE007
