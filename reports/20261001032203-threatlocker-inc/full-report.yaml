              - CE010
              - CE011
      - number: '5.4'
        title: Trust, Security Governance, and Operational Limitations
        blocks:
          - type: paragraph
            body: >-
              Implementing default-deny application control introduces notable operational dependencies, policy
              maintenance overhead, and governance responsibilities for enterprise IT organizations. While default-deny
              security drastically curtails ransomware propagation and unauthorized execution, improperly scoped
              policies can inadvertently impede critical business workflows, block custom internal software builds, or
              create administrative request backlogs during software upgrade cycles. ThreatLocker mitigates policy
              friction through its cloud community repository, enabling organizations to subscribe to curated rule sets
              established by cybersecurity peers and the ThreatLocker engineering team. Additionally, ThreatLocker
              provides Unified Audit logs to support regulatory frameworks, such as NIST Cybersecurity Framework
              guidelines and FTC reasonable security benchmarks, which increasingly mandate strict access control,
              system logging, and prompt incident response. However, commercial relationships and enterprise deployments
              carry ongoing operational and legal risks. Public court records indicate that ThreatLocker is actively
              engaged in commercial contract litigation with Charles Schwab & Co. in federal court (Case No.
              6:25-cv-923-AGM-LHP in the Middle District of Florida), with a bench trial scheduled for July 2027.
              Furthermore, independent third-party performance benchmarks evaluating agent driver overhead across
              complex non-Windows environments remain limited in public technical disclosures, highlighting key
              diligence requirements for cross-platform deployments.
            claimRefs:
              - CE007
              - CE010
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Default-Deny Architecture Mitigates Living-off-the-Land Exploits
            body: >-
              Unlike traditional endpoint detection tools that inspect signatures or heuristically detect malicious
              activity after binary execution commences, ThreatLocker's default-deny architecture prevents untrusted
              executables from launching initially. Through Ringfencing™, permitted applications such as PowerShell and
              Microsoft Office are ringfenced to prevent interaction with sensitive file repositories, system
              registries, or external networks.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE007
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Channel Distribution
        blocks:
          - type: paragraph
            body: >-
              ThreatLocker's commercial footprint is anchored by a differentiated multi-tenant Zero Trust architecture
              designed to serve organizations across several distinct commercial tiers. The company's primary
              distribution volume flows through Managed Service Providers (MSPs) and Managed Security Service Providers
              (MSSPs), who integrate default-deny application allowlisting, ringfencing, and elevation control into
              their managed cybersecurity service bundles for small and mid-market commercial clients. Beyond the MSP
              channel, ThreatLocker serves direct and partner-assisted institutional deployments across
              resource-constrained public K-12 school districts, municipal government agencies including local law
              enforcement, and professional sports and entertainment franchises such as the Orlando Magic and
              Indianapolis Colts. In addition, ThreatLocker maintains high-profile reference accounts with enterprise
              transportation and international infrastructure operators including JetBlue and Heathrow Airport. This
              multi-tiered channel structure enables ThreatLocker to achieve broad geographical scale without the
              immediate burden of building an equivalent large-scale direct enterprise sales force, although it
              introduces strategic dependency on third-party channel partner relationships and revenue-sharing
              arrangements.
