  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              ThreatLocker's core investment thesis centers on its differentiated default-deny Zero Trust architectural
              posture, transitioning endpoint defense from reactive detection to deterministic application control. The
              company expanded its enterprise footprint from more than 50,000 organizations in 2025 to over 70,000
              protected organizations worldwide by July 2026, establishing significant distribution momentum across
              managed service providers and enterprise accounts. Its expanded platform portfolio encompasses
              Allowlisting, Ringfencing, Storage Control, Network Control, ThreatLocker Detect, Elevation Control, and
              Configuration Manager. Conversely, the anti-thesis highlights severe disclosure opacity across core
              financial operating metrics. Secondary estimates of ThreatLocker's annual revenue range wildly between
              $71.5 million from prior diligence records, $100 million cited across industry summaries, and
              uncorroborated third-party database ranges of $25 million to $100 million or speculative ranges spanning
              $1 billion to $10 billion. The company has not publicly disclosed annual recurring revenue, gross margins,
              net revenue retention, or operating cash burn. Furthermore, external platform litigation case studies
              documented by ThreatLocker—including ransomware intrusions at third-party services like Marquis Software
              Solutions and domain hijacking incidents at Treasure Global—demonstrate the intensifying liability, breach
              fallout, and systemic operational risks confronting cybersecurity and managed IT vendors.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
