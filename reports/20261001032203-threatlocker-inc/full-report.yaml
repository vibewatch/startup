  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, Real Estate, and Regulatory Compliance Exposure
        blocks:
          - type: paragraph
            body: >-
              ThreatLocker's most immediate active legal exposure stems from contested commercial headquarters lease
              litigation with Charles Schwab & Co., Inc. Originally initiated by ThreatLocker on April 9, 2025, in
              Florida State Court (Ninth Judicial Circuit, Orange County) under Case No. 2025-CA-003071-O, the matter
              was removed to the U.S. District Court for the Middle District of Florida (Orlando Division) as Case No.
              6:25-cv-00923 on May 27, 2025 (CR001). The complaint alleges specific performance and multiple counts of
              breach of lease regarding the company's principal headquarters premises at 1950 Summit Park Drive in
              Maitland, Florida, where annual lease obligations exceed $500,000 for existing premises and another
              $500,000 annually for an option over an entire additional floor of 21,373 square feet (CR002).
              ThreatLocker alleges that lease violations have materially disrupted ongoing operations, representing a
              tangible operational bottleneck as the company expands its centralized physical support and headquarters
              operations (CR003). Federal court filings confirm the dispute remains actively contested, with ongoing
              mediator involvement and local rule notices filed as recently as September 2026 (CR004). Concurrently,
              ThreatLocker operates in an evolving regulatory compliance environment where clients rely on its platform
              for NIST, FTC, and CISA cybersecurity baseline alignment (CR005). Although ThreatLocker is not a named
              defendant in external enterprise breach litigation, court precedents in financial and manufacturing
              sectors demonstrate that security vendors and employers face mounting legal liabilities and class-action
              risks regarding third-party vendor oversight and reasonable cybersecurity standards (CR006).
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
