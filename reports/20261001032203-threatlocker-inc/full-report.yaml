figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Chronological evolution of ThreatLocker from 2017 founding through 2026 Series F expansion and product scale.
    approximationNotes: null
    data:
      items:
        - label: Company Inception & Founding
          date: '2017-09-25'
          detail: >-
            Danny Jenkins, Sami Jenkins, and John Carolan co-found ThreatLocker in Florida following a severe enterprise
            phishing incident, pioneering default-deny allowlisting.
          tone: positive
        - label: Seed Financing & Early Incubation
          date: '2017-09-30'
          detail: >-
            ThreatLocker completes initial seed incubation and accelerator backing with MACH37 to build its initial
            proof-of-concept endpoint security engine.
          tone: neutral
        - label: Series A Expansion Round
          date: '2020-08-24'
          detail: >-
            Secures $4.44M in Series A funding led by Arthur Ventures to expand early customer acquisition across
            managed service providers.
          tone: positive
        - label: Series B Round & International Footprint
          date: '2021-05-18'
          detail: >-
            Raises $20M in Series B financing led by Elephant to scale the Zero Trust platform and expand international
            channel operations.
          tone: positive
        - label: Series C Growth Round
          date: '2022-04-05'
          detail: >-
            Secures $100M Series C financing led by General Atlantic, investing in Ringfencing controls and enterprise
            product capabilities.
          tone: positive
        - label: Series D & Global Scale
          date: '2024-04-08'
          detail: >-
            Raises $115M Series D led by General Atlantic with StepStone Group, expanding global deployments and
            initiating potential IPO preparations.
          tone: positive
        - label: Series E Financing & 50K Customers
          date: '2025-04-10'
          detail: >-
            ThreatLocker raises $60M-$67M Series E at $1.2B valuation, scaling beyond 50,000 protected customer
            organizations worldwide.
          tone: positive
        - label: Series F Financing & AI Security Launch
          date: '2026-07-29'
          detail: >-
            Secures $190M Series F led by Elephant with Koch Disruptive Technologies at $1.79B valuation, protecting
            70,000+ organizations and expanding to Reading, U.K.
          tone: positive
        - label: Global Workforce & Channel Maturity
          date: '2026-08-01'
          detail: >-
            Reaches over 700 global employees across 5 continents with established hubs in Maitland, Dublin, Dubai,
            Brisbane, and Reading.
          tone: neutral
    claimRefs:
      - CO005
      - CO010
