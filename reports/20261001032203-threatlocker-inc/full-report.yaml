      - number: '5.2'
        title: Core Security Modules and Operating Architecture
        blocks:
          - type: paragraph
            body: >-
              The ThreatLocker product portfolio is structured around seven interconnected functional modules that
              enforce defense-in-depth across endpoints, servers, and storage assets. Application Allowlisting serves as
              the foundational barrier, preventing unapproved executables, dynamic link libraries (DLLs), and scripts
              from launching. Building directly upon allowlisting, Ringfencing™ enforces granular behavioral boundaries
              around permitted applications, preventing legitimate utilities such as PowerShell, Command Prompt, or
              Microsoft Office from accessing unneeded files, interacting with the system registry, calling external
              internet IP addresses, or spawning rogue child processes. Elevation Control eliminates the security
              vulnerability of persistent local administrative accounts by granting Just-In-Time elevation specifically
              to approved individual applications rather than elevating the entire user desktop session. Storage Control
              regulates access to local folders, network shares, and external USB storage devices based on granular
              user, time, and application identity rules, enforcing encryption on removable media to prevent data
              leakage. Centralized logging is achieved through Unified Audit, which records all allow, deny, elevation,
              and file access events in real time. Configuration Manager enforces standardized operating system security
              baselines across distributed endpoints without requiring Active Directory domain controllers, while
              ThreatLocker Detect analyzes collected endpoint telemetry to identify indicators of compromise, trigger
              automated isolation responses, and alert SOC analysts.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE010
