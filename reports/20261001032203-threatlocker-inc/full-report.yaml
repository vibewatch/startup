            body: >-
              ThreatLocker's commercial go-to-market model exhibits substantial channel dependency on Managed Service
              Providers (MSPs) and Managed Security Service Providers (MSSPs) serving small and mid-sized enterprises
              (CR012). While this channel enables efficient multi-tenant software distribution across tens of thousands
              of customer organizations, it creates downstream partner concentration where channel churn, MSP tooling
