        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Stance and Investment Stance
            body: >-
              We assign ThreatLocker a recommendation of Track and a valuation stance of Stretched. While the company
              demonstrates exceptional commercial traction in expanding its protected footprint to over 70,000
              organizations and securing $190 million in Series F capital at a $1.79 billion valuation, the implied
              multiple of 18x to 25x revenue is stretched without verified GAAP figures for gross margins, net
              retention, or cash burn.
