      - number: '8.2'
        title: Financing History, Valuation Multiples, and Cap Table Structure
        blocks:
          - type: paragraph
            body: >-
              ThreatLocker has completed multiple institutional funding rounds since its 2017 founding, scaling
              cumulative equity capital to $489.4 million across institutional equity rounds as of August 2026. On July
              29, 2026, the company announced a $190 million Series F funding round led by Elephant, with participation
              from D. E. Shaw Ventures, Arthur Ventures, and corporate investor Koch Disruptive Technologies. The
              transaction priced at a pre-money valuation of $1.6 billion and a post-money valuation of $1.79 billion,
              implying approximately 11% equity dilution for the round. This financing followed a $60 million Series E
              round in April 2025 at a $1.2 billion post-money valuation (~5% dilution), a $115 million Series D in
              April 2024 led by General Atlantic with StepStone Group and D. E. Shaw Ventures, and a $100 million Series
              C in April 2022. While early directory profiles cited lower historical totals such as $299 million or $363
              million, latest August 2026 investor tear sheets confirm $489.4 million cumulative funding across 7 rounds
              with 8 institutional investors. At the $1.79 billion Series F post-money valuation, enterprise value
              multiples range from approximately 17.9x on a $100 million revenue base to 25.0x on a $71.5 million
              run-rate basis, representing a steep premium relative to public endpoint and security comparables like
              Rubrik (14.4x P/S at IPO), Tenable (8.0x P/S at IPO), SentinelOne, and CyberArk.
            claimRefs:
              - CV001
              - CV002
              - CV006
