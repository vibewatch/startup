            body: >-
              ThreatLocker faces meaningful downside risk if public market multiples for mid-tier endpoint security
              providers continue to compress toward historical medians of 8x to 10x ARR. In the absence of proprietary
              ARR or margin clarity, secondary buyers face downside exposure if growth decelerates before a planned IPO.
            calloutType: risk
