              sports, the Orlando Magic implemented ThreatLocker's allowlisting and ringfencing modules to automate
              application vetting, eliminate manual software testing by internal IT staff, and provide verifiable
              telemetry that directly reinforced the franchise's cyber insurance posture. Similarly, managed service
              provider 3rd Element Consulting deployed ThreatLocker across municipal clients, including municipal police
              departments, successfully eliminating shadow IT and unauthorized video playback utilities. These customer
              proof points illustrate measurable risk reduction and workflow automation across diverse operational
