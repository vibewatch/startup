chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding Mission, and Zero Trust Operating Model
        blocks:
          - type: paragraph
            body: >-
              ThreatLocker, Inc. is a private cybersecurity software corporation founded in 2017 and headquartered in
              Maitland, Florida, within the greater Orlando metropolitan area. The company operates across the
              enterprise security and network management sectors, delivering an endpoint Zero Trust security platform
              designed to transition organizations from conventional reactive detection to a strict default-deny
              operating architecture. Under this model, all unauthorized software, executables, scripts, dynamic link
              libraries, and unverified processes are prevented from running by default. The core product suite
              comprises Application Allowlisting, Ringfencing, Storage Control, Network Control, Elevation Control, and
              ThreatLocker Detect. By establishing granular boundaries around permitted software, Ringfencing prevents
              legitimate applications from being exploited to execute unauthorized commands or exfiltrate sensitive
              files. While the company initially established product-market fit serving small-to-medium businesses
              through managed service provider (MSP) channels, it has expanded into mid-market and enterprise customer
              tiers globally, scaling to support over 70,000 organizations and employing more than 700 personnel across
              five continents as of 2026.
            claimRefs:
              - CO002
              - CO004
              - CO008
              - CO011
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO007
              - CO011
              - CO012
      - number: '1.2'
        title: Executive Leadership, Founder Experience, and Governance Architecture
        blocks:
          - type: paragraph
            body: >-
              ThreatLocker was co-founded by Chief Executive Officer Danny Jenkins, Chief Operations Officer Sami
              Jenkins, and Chief Quality Assurance Officer John Carolan. Danny Jenkins initiated his cybersecurity
              career in 1997, developing deep systems engineering experience across corporate IT administration and
              entrepreneurial ventures. The catalyst for establishing ThreatLocker occurred after Jenkins observed the
              devastating aftermath of a corporate phishing breach that crippled enterprise operations and nearly
              destroyed the impacted firm, exposing systemic vulnerabilities in signature-based and heuristic antivirus
              tools. Sami Jenkins directs operational execution, personnel growth, and cross-border facility
              development, while John Carolan oversees software quality engineering, kernel-level client compatibility,
              and agent stability. The executive leadership team is augmented by Chief Technology Officer Michael
              Jenkins, who directs platform infrastructure and technical innovation, and Chief Financial Officer Ross
              McIntosh, who oversees financial planning, capital structure, and growth equity financings. While
              functional management coverage across product, sales, marketing, and operations is extensive, ThreatLocker
              maintains substantial key-person dependence on Danny Jenkins as its primary visionary and chief technical
              evangelist. Furthermore, formal board of directors composition and specific committee governance
              structures remain private.
            claimRefs:
              - CO002
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO006
      - number: '1.3'
        title: Capitalization History, Valuation Evolution, and Investor Syndicate
        blocks:
          - type: paragraph
            body: >-
              ThreatLocker has completed seven distinct institutional financing rounds since inception, progressing from
              early incubation through large-scale growth equity financings. Following initial seed incubation with
              MACH37 in 2017, the company raised a $4.44 million Series A led by Arthur Ventures in 2020, followed by a
              $20 million Series B led by Elephant in 2021. Growth accelerated with a $100 million Series C in 2022 and
              a $115 million Series D in 2024, both led by General Atlantic with participation from StepStone Group and
              D. E. Shaw Ventures. In April 2025, ThreatLocker raised a $60 million to $67 million Series E round that
              established unicorn status at a $1.2 billion valuation. Most recently, on July 29, 2026, ThreatLocker
              announced a $190 million Series F financing round led by Elephant, supported by D. E. Shaw Ventures,
              Arthur Ventures, and a major strategic investment from Koch Disruptive Technologies. Secondary investor
              valuations peg the post-money valuation at approximately $1.79 billion on cumulative raised capital of
              $489.4 million. Despite institutional investor backing and potential initial public offering preparations,
              ThreatLocker does not publicly disclose audited GAAP revenue, annual recurring revenue (ARR), gross
              margins, or cash burn rate, creating an information gap that requires direct data-room diligence.
            claimRefs:
              - CO001
              - CO003
              - CO007
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO003
              - CO007
      - number: '1.4'
        title: Operational Scale Milestones, Global Expansion, and Competitive Dynamics
        blocks:
          - type: paragraph
            body: >-
              From 2017 through 2026, ThreatLocker expanded from an early allowlisting prototype into a multinational
              cybersecurity vendor. Customer scale expanded from over 50,000 protected organizations in 2025 to more
              than 70,000 organizations by mid-2026, supported by consecutive rankings on the Inc. 5000 list of
              America's fastest-growing private companies. ThreatLocker has expanded its physical operational hubs
              internationally, establishing regional corporate offices in Dublin, Dubai, Brisbane, and Reading, United
              Kingdom, to deliver localized 24/7/365 Cyber Hero support. The company maintains an active threat
              intelligence division that analyzes major external security incidents, including the August 2025
              ransomware attack against Monterey Mushrooms by the INC RANSOM syndicate, demonstrating how unsegmented
              networks and excessive credentials allow threat actors to exfiltrate unencrypted records. In the broader
              marketplace, ThreatLocker operates in an intensely contested environment. It competes against platform
              endpoint detection and response (EDR) giants such as CrowdStrike, Microsoft Defender for Endpoint, and
              SentinelOne, as well as specialized allowlisting and least-privilege vendors like Airlock Digital and
              BeyondTrust, requiring continued innovation in governing autonomous AI tools, network traffic, and cloud
              access.
            claimRefs:
              - CO004
              - CO005
              - CO009
              - CO010
              - CO013
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO005
              - CO010
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'The Paradigm Shift: Enforcing Default-Deny Security in an Agentic AI Era'
            body: >-
              ThreatLocker's core architectural distinction lies in reversing the traditional reactive EDR detection
              paradigm. Instead of scanning for known malicious signatures after code enters the endpoint, ThreatLocker
              blocks all unapproved scripts, executables, and libraries by default. As enterprise environments
              incorporate autonomous AI agents and dynamic code generation, this default-deny posture and granular
              Ringfencing controls become increasingly critical for mitigating unauthorized tool execution and lateral
              data exfiltration.
            calloutType: insight
            claimRefs:
              - CO008
              - CO014
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The narrow market is endpoint application control: deciding which applications, scripts, processes, and
              privilege requests may run, then enforcing a default-deny policy. ThreatLocker presents this as the center
              of its platform and says deployment takes hours to days. The broader competitive budget overlaps endpoint
              detection and response, privileged-access controls, network segmentation, storage control, and
              hybrid-cloud security, but those categories should not all be counted as ThreatLocker's addressable spend.
              Status-quo substitutes include permissive endpoint policies, native operating-system controls, manual
              administrator approval, and conventional antivirus or EDR without default-deny application control. User
              evidence suggests the product can be managed by existing IT staff, while policy learning and approval
              workflows remain operational adoption work rather than a zero-friction purchase.
            claimRefs:
              - CM001
              - CM002
              - CM011
              - CM015
              - CM016
