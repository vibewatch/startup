            title: Operational Headwind from Headquarters Litigation
            body: >-
              The federal lease dispute with Charles Schwab & Co. (Case No. 6:25-cv-00923) poses a non-trivial
              operational distraction for ThreatLocker's executive leadership and centralized Maitland operations.
              Beyond financial commitments exceeding $500,000 annually per floor, the active claim of disrupted
              operations indicates physical infrastructure constraints that could impede planned hiring expansion if
              space options remain blocked.
