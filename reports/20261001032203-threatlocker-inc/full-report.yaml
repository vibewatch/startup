      - number: '6.4'
        title: Customer Lifecycle, Expansion Loops, and Retention Disclosures
        blocks:
          - type: paragraph
            body: >-
              The customer adoption lifecycle typically initiates with an automated discovery phase utilizing
              ThreatLocker's Learning Mode, which profiles application execution across customer endpoints to build
              baseline allowlisting policies without causing operational downtime. Following initial policy baseline
              establishment, customer accounts commonly expand across the broader Zero Trust suite, adding Ringfencing
              to confine legitimate utilities like PowerShell, Elevation Control to remove local administrative
              privileges, and Storage Control to enforce USB and backup share protection. Organizations with lean
              technical teams frequently layer on ThreatLocker Detect and Cyber Hero MDR for 24/7 managed event
              investigation. Despite this technical expansion pathway, ThreatLocker's commercial durability remains a
              critical diligence blind spot. The company discloses no audited figures for net revenue retention (NRR),
              gross retention rates, logo churn, or customer acquisition payback periods. For diligence assessors, the
              lack of disclosed cohort retention data makes it challenging to verify whether rapid headline logo growth
              reflects durable recurring software usage or continuous top-of-funnel acquisition masking unobserved
