  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Structural sequence showing how ThreatLocker converts MSP channel distribution and endpoint agent installations
      into recurring subscription revenue.
    data:
      nodes:
        - id: channel-onboarding
          label: 1. MSP & Enterprise Channel Onboarding
          detail: ThreatLocker recruits IT service providers and corporate IT teams via direct sales and 30-day trials.
        - id: agent-deployment
          label: 2. Endpoint Agent Installation
          detail: Deployment of lightweight agent across customer endpoints and servers implementing default-deny.
        - id: policy-learning
          label: 3. Learning Mode & Baseline Policy
          detail: Automated cataloging of authorized application hashes, scripts, and libraries before lockdown.
        - id: subscription-billing
          label: 4. Monthly Subscription Billing
          detail: Recurring monthly per-endpoint software licensing billed directly or through MSP partner agreements.
        - id: service-delivery-support
          label: 5. Cyber Hero Support & Delivery
          detail: Ongoing 24/7 operations, rule management, and continuous threat intelligence updates.
        - id: modular-expansion
          label: 6. Modular SKU Expansion
          detail: Cross-selling additional platform modules including Detect MDR, Network Control, and Elevation Control.
        - id: gross-profit-realization
          label: 7. Gross Profit Realization
          detail: Net contribution generated after absorbing cloud multi-tenant infrastructure and support labor costs.
    approximationNotes: Process model representing operational SaaS conversion flow; financial conversion percentages remain undisclosed.
    claimRefs:
      - CI001
      - CI004
      - CI013
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Six-tier architectural model showing ThreatLocker's multi-tenant management, API gateway, VDI sandbox, audit
      engine, endpoint enforcement, and OS driver layers.
    data:
      layers:
        - label: Presentation & Management Tier
          detail: Multi-tenant cloud management portal, approval workflow console, and ThreatLocker Community hub
          modules:
            - Web Management Portal
            - Approval Mobile & Web Interface
            - Community Policy Repository
            - Cyber Hero Support Gateway
        - label: API & Orchestration Tier
          detail: Scalable C#/.NET RESTful Web APIs routing commands, policies, and telemetry between cloud and endpoints
          modules:
            - RESTful Agent API Gateway
            - Tenant Policy Engine
            - Approval Request Broker
            - Identity & Auth Service
        - label: Evaluation & Testing Infrastructure Tier
          detail: >-
            Cloud-hosted isolated Virtual Desktop Infrastructure (VDI) executing untrusted binaries and auditing
            behaviors
          modules:
            - Automated VDI Sandbox
            - VirusTotal Intelligence Integration
            - Canary Data Access Monitor
            - Real-Time Registry & Network Tracer
        - label: Detection & Unified Audit Tier
          detail: Centralized logging and real-time behavioral analytics engine ingesting endpoint operational telemetry
          modules:
            - Unified Audit Engine
            - ThreatLocker Detect Engine
            - Indicators of Compromise (IOC) Matcher
            - Cyber Hero MDR Service
        - label: Local Endpoint Enforcement Tier
          detail: Lightweight endpoint agent enforcing low-level security rules directly on client machines and servers
          modules:
            - Application Allowlisting Filter
            - Ringfencing Policy Boundary
            - Elevation Control Broker
            - Storage Control & Encryption Module
        - label: Network & Operating System Interface Tier
          detail: Dynamic packet inspection, firewall ACL management, and OS kernel hooks across endpoints and servers
          modules:
            - Network Control Dynamic ACLs
            - Windows Kernel Filter Driver
            - On-Demand Port Controller
            - Configuration Manager Baseline
    approximationNotes: >-
      Architectural tiering synthesized from ThreatLocker Solutions Overview, engineering hiring specifications, and
      technical solution documentation.
