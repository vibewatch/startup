    title: Workflow / use-case table
    columns:
      - User Job
      - Current / Legacy Workflow
      - ThreatLocker Solution
      - Measurable Benefit
      - Operational Limitation
    rows:
      - - Software Deployment & Approvals
        - Manual IT ticket creation or unrestricted local administrative execution
        - Learning Mode catalogs baseline binaries; temporary VDI testing environment evaluates new requests
        - Reduces software approval turnaround to approximately 60 seconds with automated dependency tracing
        - Requires administrator evaluation for bespoke in-house scripts not recognized in community repository
      - - Ransomware & Living-off-the-Land Defense
        - Signature-based EDR alerts reacting after binary execution begins
        - Default-deny execution blocks unapproved binaries; Ringfencing stops PowerShell/scripts calling external IPs
        - Preemptively neutralizes unauthorized executables and script weaponization before initial execution
        - Strict policies may restrict legitimate developer tools or CLI utilities if rules are improperly configured
      - - Privilege Escalation Management
        - Granting permanent local admin accounts to power users or running entire sessions elevated
        - Elevation Control grants Just-In-Time elevation specifically to individual approved executable files
        - Eliminates persistent local administrative privilege exposure across fleet endpoints
        - Applications with hardcoded credential dependencies or legacy drivers may require manual policy tuning
      - - Removable Storage & Data Loss Prevention
        - Blanket USB port disabling or unmonitored external drive transfers
        - Storage Control enforces granular read/write rules and device encryption by vendor and serial number
        - Detailed Unified Audit trails log all file interaction events and device serial numbers within minutes
        - >-
          File access logging introduces telemetry volume and requires structured policy maintenance across distributed
          endpoints
    notes: >-
      Workflow stages and measurable operational outcomes compiled from ThreatLocker Solutions Overview and technical
      documentation.
