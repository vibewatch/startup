      - number: '4.1'
        title: Revenue Streams and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              ThreatLocker operates as a dedicated cybersecurity software vendor delivering Zero Trust architecture
              across endpoint, server, and network environments. The commercial platform centers on application
              execution control, allowlisting, Ringfencing, storage control, network access control, and endpoint
              detection and response (EDR/MDR) capabilities. Monetization is structured primarily as a multi-tier SaaS
              model billed on a per-endpoint, per-agent monthly or annual basis. The core value proposition rests on
              default-deny execution controls, blocking unapproved software, scripts, and libraries before malicious
              code can execute. Rather than publishing fixed list prices on its public website, ThreatLocker utilizes a
              quote-based enterprise and partner model alongside a standard 30-day free trial. Pricing realizations vary
              depending on volume tiers, multi-module packaging, and partner agreements, while standard enterprise
              support is reinforced by an in-house 24/7/365 Cyber Hero support desk based in Orlando, Florida, with
              sub-60-second response commitments.
