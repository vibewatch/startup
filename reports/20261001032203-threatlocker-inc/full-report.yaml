      - number: '8.3'
        title: Scenario Analysis, Exit Readiness, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Evaluating ThreatLocker's medium-term equity value requires balancing top-line endpoint expansion against
              aggressive private multiples and potential public listing requirements. In a bull case, ThreatLocker
              successfully monetizes its base of 70,000 protected organizations, scales revenue toward $200 million ARR
              with gross margins exceeding 75%, and executes a successful public listing at a 15.0x multiple, achieving
              an equity valuation of $3.00 billion (yielding a 1.68x gross MOIC over Series F). In the base case,
              revenue grows steadily toward $140 million ARR but public multiple compression holds the forward revenue
              multiple at 10.0x, resulting in an equity valuation of $1.40 billion (-22% discount to Series F
              post-money). In a bear case, competitive displacement from bundled platform suites (such as Microsoft
              Defender, CrowdStrike, and SentinelOne) and ongoing pricing pressure in the SMB channel constrain ARR to
              $90 million while valuation compresses to an 8.0x multiple, yielding a $720 million equity valuation (-60%
              downside). Core diligence priorities before capital commitment include obtaining audited GAAP income and
              cash flow statements, verifying historical churn and net retention across MSP channels, and inspecting
              Series D, E, and F preferred stock liquidation preferences.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV012
