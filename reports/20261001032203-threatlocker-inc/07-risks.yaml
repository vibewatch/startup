callouts:
  - calloutType: "risk"
    title: "Operational Headwind from Headquarters Litigation"
    body: "The federal lease dispute with Charles Schwab & Co. (Case No. 6:25-cv-00923) poses a non-trivial operational distraction for ThreatLocker's executive leadership and centralized Maitland operations. Beyond financial commitments exceeding $500,000 annually per floor, the active claim of disrupted operations indicates physical infrastructure constraints that could impede planned hiring expansion if space options remain blocked."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
  - calloutType: "risk"
    title: "The Double-Edged Sword of Default-Deny Architecture"
    body: "ThreatLocker's core product differentiation—blocking all unapproved executables, scripts, and libraries by default—is simultaneously its greatest operational liability. Unlike passive detection platforms where false positives generate manageable alerts, an erroneous default-deny block immediately halts business workflows, placing extreme dependency on flawless policy updates and 24/7 support availability."
    claimRefs:
      - "CR007"
      - "CR008"
      - "CR011"
