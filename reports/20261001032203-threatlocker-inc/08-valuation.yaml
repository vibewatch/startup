company:
  name: "ThreatLocker, Inc."
chapter:
  number: 8
  title: "Valuation"
  summary: "ThreatLocker expanded its capitalization through a $190 million Series F funding round in July 2026 at a post-money valuation of $1.79 billion led by Elephant, supported by rapid customer footprint expansion across more than 70,000 protected organizations. However, wide disparities in secondary revenue estimates and total absence of audited gross margins, net retention, or cash burn warrant a disciplined Track posture."
sections:
  - id: "investment-thesis-and-antithesis"
    title: "Investment Thesis and Anti-Thesis"
    body: "ThreatLocker's core investment thesis centers on its differentiated default-deny Zero Trust architectural posture, transitioning endpoint defense from reactive detection to deterministic application control. The company expanded its enterprise footprint from more than 50,000 organizations in 2025 to over 70,000 protected organizations worldwide by July 2026, establishing significant distribution momentum across managed service providers and enterprise accounts. Its expanded platform portfolio encompasses Allowlisting, Ringfencing, Storage Control, Network Control, ThreatLocker Detect, Elevation Control, and Configuration Manager. Conversely, the anti-thesis highlights severe disclosure opacity across core financial operating metrics. Secondary estimates of ThreatLocker's annual revenue range wildly between $71.5 million from prior diligence records, $100 million cited across industry summaries, and uncorroborated third-party database ranges of $25 million to $100 million or speculative ranges spanning $1 billion to $10 billion. The company has not publicly disclosed annual recurring revenue, gross margins, net revenue retention, or operating cash burn. Furthermore, external platform litigation case studies documented by ThreatLocker—including ransomware intrusions at third-party services like Marquis Software Solutions and domain hijacking incidents at Treasure Global—demonstrate the intensifying liability, breach fallout, and systemic operational risks confronting cybersecurity and managed IT vendors."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV013"
    tableRefs:
      - "TV002"
  - id: "capitalization-and-financing-history"
    title: "Financing History, Valuation Multiples, and Cap Table Structure"
    body: "ThreatLocker has completed multiple institutional funding rounds since its 2017 founding, scaling cumulative equity capital to $489.4 million across institutional equity rounds as of August 2026. On July 29, 2026, the company announced a $190 million Series F funding round led by Elephant, with participation from D. E. Shaw Ventures, Arthur Ventures, and corporate investor Koch Disruptive Technologies. The transaction priced at a pre-money valuation of $1.6 billion and a post-money valuation of $1.79 billion, implying approximately 11% equity dilution for the round. This financing followed a $60 million Series E round in April 2025 at a $1.2 billion post-money valuation (~5% dilution), a $115 million Series D in April 2024 led by General Atlantic with StepStone Group and D. E. Shaw Ventures, and a $100 million Series C in April 2022. While early directory profiles cited lower historical totals such as $299 million or $363 million, latest August 2026 investor tear sheets confirm $489.4 million cumulative funding across 7 rounds with 8 institutional investors. At the $1.79 billion Series F post-money valuation, enterprise value multiples range from approximately 17.9x on a $100 million revenue base to 25.0x on a $71.5 million run-rate basis, representing a steep premium relative to public endpoint and security comparables like Rubrik (14.4x P/S at IPO), Tenable (8.0x P/S at IPO), SentinelOne, and CyberArk."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV006"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV014"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "valuation-scenarios-exit-readiness"
    title: "Scenario Analysis, Exit Readiness, and Diligence Asks"
    body: "Evaluating ThreatLocker's medium-term equity value requires balancing top-line endpoint expansion against aggressive private multiples and potential public listing requirements. In a bull case, ThreatLocker successfully monetizes its base of 70,000 protected organizations, scales revenue toward $200 million ARR with gross margins exceeding 75%, and executes a successful public listing at a 15.0x multiple, achieving an equity valuation of $3.00 billion (yielding a 1.68x gross MOIC over Series F). In the base case, revenue grows steadily toward $140 million ARR but public multiple compression holds the forward revenue multiple at 10.0x, resulting in an equity valuation of $1.40 billion (-22% discount to Series F post-money). In a bear case, competitive displacement from bundled platform suites (such as Microsoft Defender, CrowdStrike, and SentinelOne) and ongoing pricing pressure in the SMB channel constrain ARR to $90 million while valuation compresses to an 8.0x multiple, yielding a $720 million equity valuation (-60% downside). Core diligence priorities before capital commitment include obtaining audited GAAP income and cash flow statements, verifying historical churn and net retention across MSP channels, and inspecting Series D, E, and F preferred stock liquidation preferences."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV004"
      - "CV007"
      - "CV012"
      - "CV014"
      - "CV015"
      - "CV016"
