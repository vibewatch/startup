callouts:
  - calloutType: "recommendation"
    title: "Valuation Stance and Investment Stance"
    body: "We assign ThreatLocker a recommendation of Track and a valuation stance of Stretched. While the company demonstrates exceptional commercial traction in expanding its protected footprint to over 70,000 organizations and securing $190 million in Series F capital at a $1.79 billion valuation, the implied multiple of 18x to 25x revenue is stretched without verified GAAP figures for gross margins, net retention, or cash burn."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV004"
      - "CV012"
      - "CV014"
  - calloutType: "risk"
    title: "Downside Risks and Multiples Contraction"
    body: "ThreatLocker faces meaningful downside risk if public market multiples for mid-tier endpoint security providers continue to compress toward historical medians of 8x to 10x ARR. In the absence of proprietary ARR or margin clarity, secondary buyers face downside exposure if growth decelerates before a planned IPO."
    claimRefs:
      - "CV004"
      - "CV012"
      - "CV015"
      - "CV016"
