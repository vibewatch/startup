companyProfile:
  summary: >-
    ThreatLocker is a private cybersecurity company that sells a default-deny Zero Trust endpoint security platform
    centered on application allowlisting, Ringfencing, storage control, network control, and privilege elevation
    controls. The company was founded in 2017, is headquartered in the Orlando metro area in Maitland, Florida, and has
    scaled through MSP/MSSP channels to protect more than 70,000 organizations while expanding its enterprise and
    public-sector footprint.
