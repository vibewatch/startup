    claimRefs: [CM003, CM012, CM013, CM014, CM015]
callouts:
  - calloutType: insight
    title: Installed base is evidence of reach, not market share
    body: "The reported 70,000-plus organizations indicate distribution reach, but the source does not define paying customers, endpoints, contract value, retention, or the total eligible population."
    claimRefs: [CM013, CM014]
  - calloutType: risk
    title: Monetary sizing remains a diligence item
    body: "A market model needs verified endpoint counts by segment, realized price per endpoint, attach rates, and win rates; none is available in the assigned prefetched evidence."
    claimRefs: [CM014]
