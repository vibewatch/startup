company:
  name: "ThreatLocker, Inc."
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    ThreatLocker addresses the application-control and endpoint-policy layer of Zero Trust, with
    adjacent exposure to EDR, hybrid-cloud security, privilege control, and compliance workflows.
    The assigned evidence shows acute demand signals and a reported installed base above 70,000
    organizations, but it does not support a defensible monetary TAM, SAM, or SOM.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The narrow market is endpoint application control: deciding which applications, scripts,
      processes, and privilege requests may run, then enforcing a default-deny policy. ThreatLocker
      presents this as the center of its platform and says deployment takes hours to days. The
      broader competitive budget overlaps endpoint detection and response, privileged-access
      controls, network segmentation, storage control, and hybrid-cloud security, but those
      categories should not all be counted as ThreatLocker's addressable spend. Status-quo
      substitutes include permissive endpoint policies, native operating-system controls, manual
      administrator approval, and conventional antivirus or EDR without default-deny application
      control. User evidence suggests the product can be managed by existing IT staff, while policy
      learning and approval workflows remain operational adoption work rather than a zero-friction
      purchase.
    claimRefs: [CM001, CM002, CM011, CM015, CM016]
    tableRefs: [TM001]
  - id: evidence-constrained-sizing
    title: Evidence-constrained sizing
    body: >-
      The available sources do not disclose category revenue, endpoint counts, price per endpoint,
      attach rates, or a consistent geography from which a monetary TAM or SAM could be calculated.
      The most concrete company-scale lens is an independent tear sheet that repeats the company's
      claim of more than 70,000 protected organizations by July 2026; this is an installed-base
      indicator, not a count of paying customers or a market-size denominator. Demand indicators
      are strongest in financial services: a company-authored article cites ransomware incidence,
      recovery cost, and third-party breach exposure, but the underlying datasets were not included
      in the assigned pool. These observations support market urgency, not a precise revenue
      opportunity. Investment underwriting should therefore model addressability from verified
      endpoint counts and realized pricing obtained in diligence.
    claimRefs: [CM004, CM005, CM006, CM013, CM014]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users, and adoption path
    body: >-
      The evidence points to security and IT leaders as buyers, administrators and analysts as daily
      users, and either the operating company or its managed service provider as payer. Exa's
      directory describes ThreatLocker revenue expansion into MSP and enterprise markets, while
      TrustRadius reviewers emphasize software approvals, fast support, straightforward agent
      deployment, and affordability for small businesses. Financial institutions form an acute
      vertical because regulatory disclosure, third-party concentration, and identity-data
      exposure make control evidence and incident response board-level concerns. A practical
      adoption path starts with endpoint baselining and allowlisting, expands into elevation and
      network or storage policies, and then adds monitoring. That path creates implementation work
      even where agent deployment itself is quick.
    claimRefs: [CM007, CM008, CM010, CM011, CM012, CM016]
    tableRefs: [TM003]
  - id: drivers-constraints-and-valuation
    title: Drivers, constraints, and valuation relevance
    body: >-
      Demand is supported by ransomware exposure, litigation over allegedly inadequate safeguards,
      regulatory expectations, vendor concentration, and the spread of hybrid-cloud estates.
      ThreatLocker's hybrid-cloud article says 80% of companies are adopting mixed public and
      private environments, but it does not identify the original survey, geography, or sample, so
      this is directional company-issued evidence only. Adoption constraints include policy-design
      effort, user disruption from default-deny controls, incumbent endpoint bundles, uncertain
      pricing, and the need to prove incremental ROI over tools already funded. For valuation, the
      reported installed base and breadth of workflows are positive scale signals, while the absent
      category denominator, segment conversion, customer definition, and pricing make market-share
      and penetration claims untestable from public evidence.
    claimRefs: [CM003, CM007, CM008, CM009, CM013, CM014, CM016]
