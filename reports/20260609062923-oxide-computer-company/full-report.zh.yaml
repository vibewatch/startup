  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              Oxide 并不只是和另一家创业公司竞争。它要求买方替换几种根深蒂固的解决同一任务方式：以 VMware 为中心的虚拟化栈、Nutanix 式 HCI、AWS Outposts 和 Azure Local
              等超大规模云的本地延伸、HPE GreenLake 和 Dell APEX/VxRail 等消费式混合云平台，以及把服务器、存储、网络和运维工具拼在一起的内部自建现状。Oxide 自己的 VMware
              替代和混合云页面也明确把产品放在 VMware、Nutanix、OpenStack 和公有云对面，而不是只针对单一硬件
              OEM。这个宽竞争集很重要，因为买方采购路径不同。联邦和受监管买方可能足够看重主权、证明和本土采购路径，愿意把 Oxide
              与公有云替代方案比较。金融服务和云运营商买方更在意低延迟控制、可预测经济性，以及在自有基础设施上运行现代 API 的能力。已经标准化使用 VMware 或 Nutanix 的企业，会把 Oxide
              与迁移摩擦、既有员工知识和现有支持关系比较，而不只看技术优劣。战略结论是，Oxide 的战场由更新周期和迁移周期驱动：当买方已经在承担切换成本事件，并愿意重新考虑全栈时，Oxide 才最容易赢。
