      - number: '3.3'
        title: 定价、切换成本与分销能力
        blocks:
          - type: paragraph
            body: >-
              Oxide 的商业信息异常清晰：一次性基础设施采购，没有经常性软件授权，没有出站费用，也没有已安装容量内的工作负载用量限制。对逃离 VMware 订阅重置或公有云计量的买方，这个说法很有吸引力；但它也意味着
              Oxide 要求客户先承诺资本和物理空间规划。HPE GreenLake 和 Dell APEX 用按使用付费、订阅或融资月供明确对冲这一弱点；Azure Local 仍绑定 Azure；Nutanix
              强调软件式授权；AWS Outposts 则把买方留在 AWS 运营和计费模型内。换句话说，Oxide
              的包装在总控制权上更透明，但在短期预算形态上更不灵活。分销能力进一步放大定价差距。Dell、HPE、Microsoft、Amazon 和 Nutanix
              都带着庞大一线销售组织、成熟合作伙伴和支持历史进场。Oxide 公开可见的分销面明显更窄：Carahsoft 打开重要联邦通路，CoreSite
              合作提供托管和近场部署选项，但这两者都不是全球渠道机器。切换成本因此双向作用。VMware 和 DIY 存量痛点可以为 Oxide 打开门，但一整柜采购也意味着一旦比选输掉，Oxide
              可能被客户排除整整一个更新周期。
