      - number: '5.2'
        title: 架构与运营模式
        blocks:
          - type: paragraph
            body: >
              本章最强的公开证据来自架构。Oxide 自己的文档描述了一套大致基于 OCP ORV3 的机柜：热插拔插舱、前部可维护线缆槽、低压 DC
              母排配电、双交换机，以及每块板上的硬件信任根和嵌入式服务处理器。网络也不是简单的机柜顶桥接：文档明确列出按项目划分的 VPC、基于 Geneve 的封装、Delay Driven Multipath
              路由、用于防火墙 / 路由 / NAT 的 OPTE，以及 Tofino 2 边界服务。

              公开仓库表面补足了软件层。Omicron 是机柜控制平面；Helios 是驱动机柜的 illumos 发行版；Propolis 是基于 bhyve、通过 REST API 操作的 VMM；Crucible
              是复制型块存储服务；Hubris 是用于可靠性导向底层控制的嵌入式操作环境。这一组合让 Oxide 的架构相对硬件公司而言异常可检视。不透明的不是广义栈布局，而是内部设计文档、外部安全审计和成熟生产可运维指标。
