      - number: '6.4'
        title: 反向信号与尽调优先级
        blocks:
          - type: paragraph
            body: >-
              主要反向信号不是客户不满，而是客户不透明。最好的独立负面数据点仍是 Blocks & Files 在 2024 年中期的报道：Oxide 出货少于 20
              个机柜，且多数是单柜部署。对于一家出售持久基础设施层的硬件公司，这足以证明真实采用，却远不足以证明规模或多元化。同样，Carahsoft
              带来的联邦采购帮助减少了一类摩擦，但没有消除漫长审批周期、场地约束，也没有消除少数大合同主导早期销售管线的风险。即使最强公开案例——LLNL 和 Switch——也仍以强调技术用途为主，而不是清晰的商业规模。

              剩余尽调问题因此很直接。投资人需要按客群拆分的出货机柜和在线账户队列数据、早期客户第二单和第三单的证据、支持绑定与续约行为，以及当前头部客户集中度。他们还需要渠道组合：需求有多少来自合作伙伴协助、多少来自直销；如果更多客户从单柜安装走向多站点铺开，Oxide
              的支持组织能否跟上。在这些答案出现前，客户章节支持建设性但谨慎的判断：Oxide 已经越过从概念到真实买方需求的门槛，但公开证据基础仍像一家早期商业化硬件公司，而不是已经广泛证明的基础设施平台。
