        - label: 激活
          description: Oxide 强调机柜安装后数小时内即可供开发者使用，用户通过 API、CLI 和既有自动化工具消费 VM 和服务。
        - label: 扩张循环
          description: 首个机柜若部署成功，可以扩到更多工作负载、更安全的租户或更多站点，但公开证据仍很稀疏。
