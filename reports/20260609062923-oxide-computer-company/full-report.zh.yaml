      - number: '2.5'
        title: 约束、反向信号与规模测算缺口
        blocks:
          - type: paragraph
            body: >
              Oxide 的短期市场渗透面临结构性约束。最突出的是，截至 2024 年中，Oxide 出货少于 20 个机柜——这是最近一次独立确认的数据。即便假设 $100M Series B（2025 年 7 月）和
              $200M Series C（2026 年 2 月）后快速爬坡，公司制造能力和商业规模仍只是 Nutanix（约 3,000+ 企业客户）、Dell（VxRail 部署广泛）或 HPE GreenLake
              的一小部分。赢下单个联邦机构，可能消耗数月销售和集成工作，最后只在单一站点交付一个机柜。

              回迁趋势真实存在，但属于选择性回迁。CIO.com 2025 年分析——基于 IDC 2024
              数据——把云回迁描述为“更宽工作负载放置纪律下的选择性优化，而不是退出云”。多数企业预期会有部分回迁，而不是全面退出云，这限制了回迁驱动 TAM 的可达规模。这个信号直接反驳 Oxide 最乐观的 TAM
              叙事，因此应作为重要反向证据保留。

              资本密集也是买方侧约束。Oxide 机柜要求客户承诺购买硬件——截至本报告时点，没有月度订阅模式。对习惯云端运营费用模式、预算受限的买方而言，即使 3 到 5 年总拥有成本有利于
              Oxide，前置资本投入仍是门槛。硬件销售周期长于软件订阅销售，评估期（PoC 部署）也需要投入实体基础设施。Nutanix、Dell VxRail、HPE GreenLake、AWS Outposts 和
              Azure Local 等现有玩家都提供更灵活的商业条款和更广的支持生态。Oxide 这个精确产品类别没有独立市场规模测算；没有更多专有数据，就无法验证任何具体 SOM 估计。
