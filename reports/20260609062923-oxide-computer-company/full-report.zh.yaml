      - number: '1.6'
        title: 要点
        blocks:
          - type: callout
            title: 硬件 + 软件纵向一体化，形成真实差异化
            body: >
              Oxide 是市场上唯一把开源固件、OS
              和控制平面与机柜级云计算机共同设计，并作为单一可购买产品交付的公司。这种集成消除了多供应商复杂度，也把开发者体验（API、多租户、自服务）交给了此前只能自建的本地部署买方。短期内很难复制，因为它要求硬件设计、固件、OS、网络、存储和云管理软件同时具备深度能力。
