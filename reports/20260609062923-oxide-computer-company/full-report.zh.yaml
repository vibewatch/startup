      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >
              2025 年中到 2026 年初，Oxide 的融资姿态显著改善，但公开记录仍不足以做干净的流动性承销。管理层在 Series B 文章中称，公司在该轮之前已融资 $89 million，随后在 2025 年 7
              月增加 $100 million，又在 2026 年 2 月增加 $200 million。Series B 的资金用途并不只是覆盖经营亏损；Oxide
              把这轮融资和制造规模、系统规模、运营规模及路线图范围绑定。Series C
              文章走得更远，称公司并不需要资本来支撑业务，并认为实体业务的产品市场契合要求把制造、库存、现金转换和供应链动态都跑通。管理层把更大一轮融资解释为降低资本可得性风险、确保独立性。

              这些表述对资本充足性是方向性利好，但仍不是资产负债表。Oxide 未披露在手现金、总烧钱速度或净烧钱速度、营运资本波动、债务安排或现金跑道目标。对 Oxide
              而言，这比对纯软件创业公司更重要，因为机柜业务会在收入收款外部可见之前，就通过组件采购、库存和现场部署吃掉现金。Dell 等公开现有玩家通过 Form 10-K 提供申报级披露；Oxide
              没有。实际结论是，两轮大额融资后，融资依赖大概率低于此前，但下一次融资需求的时间点仍无法通过公开来源检验。
