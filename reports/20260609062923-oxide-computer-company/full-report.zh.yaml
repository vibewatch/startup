  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 采购方、使用方、付款方与渠道面
        blocks:
          - type: paragraph
            body: >-
              Oxide 的公开客户叙事远比泛泛的“企业 IT”推介具体。Steve Tuck 在 Cloud Field Day 的演示描述了三个已经使用或评估该系统的核心客群：联邦机构、金融服务公司和云 SaaS
              公司。Oxide 自己的解决方案页面把图景进一步扩到主权云买方、VMware 迁移和混合云项目，以及需要带公有云式 API 的本地部署基础设施的 HPC 与 AI
              运营方。在这些客群里，经济买方通常是能批准机柜采购的基础设施或项目负责人；日常用户则是技术团队——安全工程师、平台 / SRE 团队、网络团队或 HPC 运营方——他们通过 Oxide 的控制平面使用 VM
              和服务。

              付款方画像很重要，因为 Oxide
              卖的是一次性购买的机柜，而不是按用量计费的服务。这会把采用倾向推向两类组织：已经习惯资本开支，或合规要求复杂、因此不愿使用公有云或多厂商私有云。渠道面仍窄，但确实存在：Oxide 直接销售；Carahsoft
              通过 GSA、SEWP 和 OTA 采购工具提供联邦采购路径；CoreSite 合作则为企业部署提供互联的托管机房入口。结果是，客户基础看起来与产品技术强项匹配，但还不足以证明普通企业 IT
              买方存在可重复的横向需求。
