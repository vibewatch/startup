  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >
              Oxide 的总可用市场（TAM）位于本地部署数据中心基础设施和云平台软件的交叉处。纳入的支出包括机柜级一体化计算、存储、网络系统，超融合基础设施（HCI）平台，私有云软件栈，VMware
              替代平台，以及主权云或气隙云设备。边界之外则是 Oxide 明确作为现状替代品竞争的超大规模公有云 IaaS
              支出（AWS、Azure、GCP）、纯托管服务（客户只购买空间和电力）、不带集成软件控制平面的传统机架式服务器，以及并非面向完整私有云工作负载的边缘计算设备。

              相邻支出类别构成未来扩张机会，包括联邦 IT 现代化预算、HPC 集群采购、本地部署 AI 推理，以及灾备或备份设备预算——这些场景的数据主权要求会让买方偏好自有基础设施。Oxide
              要替代的现状方案因买方而异：大型企业目前用 Cisco UCS 或 Dell PowerEdge 服务器、VMware vSphere 和独立存储阵列拼 DIY 栈；金融能力较强的买方使用 Nutanix
              HCI；公共部门买方依赖 FedRAMP 授权 SaaS 或老旧本地系统；部分工作负载已经迁往超大规模公有云（AWS、Azure、GCP），因此更像回迁目标，而非直接产品替代。超大规模云厂商也通过 AWS
              Outposts 和 Azure Local（原 Azure Stack HCI）延伸到本地部署，使它们既是云替代方案，也是竞争性的本地部署产品。
