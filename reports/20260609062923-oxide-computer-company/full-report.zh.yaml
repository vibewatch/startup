            body: >-
              财务模型风险不在短期偿债，而在公开证据是否足以支撑一家明显在为更大规模做准备的硬件公司。Oxide
              近期连续融到大量资本，并称融资不是为了生存，这降低了近端融资风险。但同一批来源把资本用途指向制造扩张、客户支持和长期独立——这些都说明营运资金、库存周转和客户爬坡时点很重要。没有公开订单储备、毛利率或出货数据，就无法判断这笔资本是在加速健康爬坡，还是在缓冲仍脆弱的运营模型。对投资人而言，做法是把剩余不确定性转成可监控标准。本章的触发表聚焦会打破当前投资逻辑的事件，而不是只会拖慢进度的事件：失去联邦采购资格；存量装机持续出现严重事故；组件或现场服务问题把交付拉长到可接受窗口之外；或者某次融资看起来像库存救援，而不是机会型扩张资本。这些触发条件刻意选运营和外部事件，因为
