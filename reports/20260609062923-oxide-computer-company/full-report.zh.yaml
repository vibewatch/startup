      - number: '2.3'
        title: 买方细分与画像
        blocks:
          - type: paragraph
            body: >
              Oxide CEO Steve Tuck 在 Cloud Field Day 20 上指出三类主要买方：联邦机构、金融服务公司和云 SaaS 运营商。HPC 与科研计算项目则构成补充，这由 Oxide 专门的
              HPC 解决方案页面和具名锚定客户 Idaho National Laboratory 佐证。

              联邦机构——包括 DoD、民用机构、情报界和 SLED（州 / 地方 / 教育）——是 Oxide 当前商业战略中优先级最高的垂直市场。驱动因素很特殊：NDAA、BAA、TAA 等合规要求，法定数据主权，以及通过
              Carahsoft（GSA、SEWP、OTA）降低采购摩擦的路径。预算由机构 IT 项目负责人和 CIO 掌握，资本预算支付硬件采购。一位联邦客户告诉 Oxide，他们熟练的安全工程师有 60% 时间花在管理
              VMware 授权和 BIOS 更新上，而不是安全项目上——这是一个直接采用触发点。

              金融服务公司（量化对冲基金、银行、交易公司）的需求来自延迟敏感、数据主权要求和监管审计轨迹。Jump Trading 是 Oxide 官网列出的参考客户。预算通常由 CTO 或 CIO 牵头，IT
              资本支出和硬件折旧放在基础设施预算中。云 SaaS 运营商——运营自有多租户云平台的公司——是第三类客户；数据中心运营商 Switch 已确认用 Oxide 部署内部云平台。HPC
              和科研计算项目则以批处理工作负载、GPU 密度和自服务供应需求为特征。
