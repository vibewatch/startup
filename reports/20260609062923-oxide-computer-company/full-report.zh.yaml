    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与产品命题
        blocks:
          - type: paragraph
            body: >
              Oxide Computer Company 于 2019 年在 California 的 Emeryville 创立——这是 San Francisco Bay 东岸、靠近 Oakland 的一座小城。创始人
              Steve Tuck（CEO）和 Bryan Cantrill（CTO）都曾在 Sun Microsystems 与 Joyent 工作，系统软件和硬件架构经验很深。公司在 2019
              年融资演示文稿中提出的创立命题，并一直延续到 2026
              年：第一，云计算会成为所有计算的未来；第二，出于安全、监管、延迟和经济性原因，相当多企业仍必须拥有本地部署基础设施；第三，真正把云体验带到本地部署，必须从零开始在机柜级尺度共同设计硬件和软件。第三点也是最差异化的主张——Oxide
              不是把软件叠在多家供应商的通用服务器上，而是把计算托盘、网络交换机、电源架、固件、主机操作系统、存储服务、虚拟机监控器和控制平面集成为一个可购买的实体机柜。公司官网把 Oxide
              放在两种企业痛点的对面：一边是传统本地部署，需要 8 家以上供应商、集成复杂、支持互相推诿；另一边是公有云租赁模式，账单和出站流量费用不可预测，主权也有缺口。Oxide 用“你拥有的云”的定位，同时瞄准
              AI、HPC、关键任务和通用工作负载。本报告时点，产品已经进入第二代硬件（使用 AMD EPYC 9005 / Zen 5 的 2nd Gen Sleds），公司也在第三轮融资后推进制造和客户扩张。
