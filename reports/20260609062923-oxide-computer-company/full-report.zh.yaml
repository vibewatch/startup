      - number: '4.2'
        title: 成本结构、单位经济代理指标与牵引缺口
        blocks:
          - type: paragraph
            body: >
              Oxide 的公开材料描绘的是一种经济性远比经典 SaaS 毛利数学更受实体系统执行约束的业务。产品页面和技术文档展示了一个完全一体化机柜，包含定制网络、存储、控制平面软件和低压 DC 母排；电力效率文章和
              CoreSite 发布还补充说，效率收益来自取消几十个 AC 电源、使用更大风扇，并把机柜作为统一系统运行。这些细节解释了可能的毛利驱动因素：硬件
              BOM、制造良率、物流、安装、质保、现场支持和库存持有成本都很关键。也正因为如此，尽管客户体验借用了云的语汇，Oxide 也不应按纯软件私有云厂商建模。

              公开单位经济代理指标很少，但方向上有用。Series B 文章提到漫长企业周期，Blocks & Files 则报道称，截至 2024 年 7 月，公司出货少于 20
              个机柜，且多数是单机柜部署。两者合在一起说明，装机基础杠杆有限，公开证据还不足以证明高量扩张经济性。与此同时，官方页面反复宣称相对公有云节省 40% 到 71% 计算成本，相对传统机柜改善 35% 到 50%
              电力经济性；如果 Oxide 能把工程效率转化为毛利，这就是实在的价值主张。同时，现有玩家的商业模式仍更灵活：AWS Outposts 定价提供三年期，并可选择前付或月付；Azure Local
              公开月度服务费。缺失的是从主张到财务结果的桥：审阅过的公开语料中，没有任何收入、ARR、毛利率、支持服务附加率、积压订单或质保数据。
