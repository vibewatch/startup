  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 新资本、需求信号和产品差异化都真实存在，但缺价格、缺经济性数据，阻挡买入建议。
    data:
      nodes:
        - id: capital
          label: 新资本
          detail: Series B 和据报道的 Series C 融资，给 Oxide 带来真实的制造和路线图跑道。
          tone: positive
        - id: demand
          label: 需求切入点
          detail: 联邦、金融服务、VMware 迁移和 AI 基础设施需求，支撑真实市场拉力。
          tone: positive
        - id: product
          label: 机柜尺度差异化
          detail: 软硬件协同设计、第二代计算和所有权经济性，支撑战略差异化。
          tone: positive
        - id: opaque-price
          label: 未披露轮次估值
          detail: 已审阅公开来源披露了融资金额，但没有披露最近两轮主要融资的价格。
          tone: warning
        - id: opaque-economics
          label: 无公开收入或利润率
          detail: 收入、毛利率、积压订单和优先股堆叠均不可见。
          tone: warning
        - id: comp-band
          label: 公开可比公司区间为 1.7x-6.2x 销售额
          detail: Dell 和 HPE 锚定低端；Nutanix 和 Pure 锚定高端。
          tone: neutral
        - id: recommendation
          label: 继续研究 / 跟踪
          detail: 不要盲买；等待价格和经济性披露，且需符合情景框架。
          tone: neutral
      edges:
        - from: capital
          to: recommendation
          label: 让公司仍可投资
        - from: demand
          to: recommendation
          label: 支撑继续尽调
        - from: product
          to: comp-band
          label: 可能支撑高端区间
        - from: opaque-price
          to: recommendation
          label: 阻断承销
        - from: opaque-economics
          to: recommendation
          label: 阻断倍数选择
        - from: comp-band
          to: recommendation
          label: 设定入场纪律
    approximationNotes: null
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV020
      - CV021
      - CV039
      - CV041
      - CV046
      - CV047
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 企业价值支撑会随收入水平和采用的公开可比倍数区间急剧变化。
    data:
      items:
        - label: $100M 收入，2x
          value: 0.2
          detail: 类硬件下行情景；EV 以十亿美元计。
          tone: negative
        - label: $250M 收入，2x
          value: 0.5
          detail: 即便有不错的硬件收入，在低倍数下也撑不起创投式溢价。
          tone: negative
        - label: $250M 收入，4x
          value: 1
          detail: 混合型基础设施业务基准情景的高端上限；EV 以十亿美元计。
          tone: warning
        - label: $400M 收入，5x
          value: 2
          detail: 进入类软件估值区间，需要披露强得多的规模。
          tone: neutral
        - label: $600M 收入，5x
          value: 3
          detail: 高端情景，需要有意义的公开规模；EV 以十亿美元计。
          tone: positive
        - label: $600M 收入，6x
          value: 3.6
          detail: 上市可比公司上沿情景，更接近 Pure Storage 这类估值支撑。
          tone: positive
    approximationNotes: 简单 EV/sales 示意，采用 2026-06-09 观察到的上市可比公司区间；不是 DCF 输出，也不是管理层指引。
    claimRefs:
      - CV039
      - CV042
      - CV043
      - CV044
      - CV045
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 当前轮价格未披露，诚实的区间只能按悲观、基准、乐观三种经营结果给出企业价值范围。
    data:
      items:
        - label: 悲观情景
          low: 0.05
          mid: 0.125
          high: 0.2
          detail: $50M-$100M 收入，1x-2x 销售额倍数；硬件式经济性占主导。
          tone: negative
        - label: 基准情景
          low: 0.45
          mid: 0.725
          high: 1
          detail: $150M-$250M 收入，3x-4x 销售额倍数；呈现混合型基础设施特征。
          tone: warning
        - label: 乐观情景
          low: 2
          mid: 2.8
          high: 3.6
          detail: $400M-$600M 收入，5x-6x 销售额倍数；软件式利润率和重复扩张得到验证。
          tone: positive
    approximationNotes: 数值为以十亿美元计的企业价值区间，绑定明确的收入和倍数假设。
    claimRefs:
      - CV042
      - CV043
      - CV044
      - CV045
      - CV046
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Oxide 在市场切入口、产品差异化和资金跑道上得分最高，在财务透明度和估值支撑上最弱。
    data:
      items:
        - label: 市场拉力
          score: 8
          detail: VMware 退出、联邦主权需求和私有云需求带来真实市场紧迫感。
          tone: positive
        - label: 客户证明
          score: 6
          detail: 已有具名客户和渠道证据，但装机规模仍处早期。
          tone: neutral
        - label: 产品护城河
          score: 7
          detail: 机架级协同设计、第二代计算和所有权经济性形成差异化。
          tone: positive
        - label: 财务透明度
          score: 2
          detail: 未公开收入、利润率、积压订单或股权结构表。
          tone: negative
        - label: 估值支撑
          score: 2
          detail: 当前轮价格未披露，因此公开信息无法支撑精确估值。
          tone: negative
        - label: 融资跑道
          score: 8
          detail: 近期融资为制造和路线图落地提供了真实经营跑道。
          tone: positive
        - label: 退出准备度
          score: 4
          detail: 产品和客户证明已经存在，但上市公司报告准备度还没有。
          tone: warning
    approximationNotes: 评分为 0-10 分，是 IC 基于公开证据综合形成的判断，不是机械模型。
    claimRefs:
      - CV002
      - CV009
      - CV017
      - CV020
      - CV041
      - CV047
      - CV048
      - CV049
      - CV050
