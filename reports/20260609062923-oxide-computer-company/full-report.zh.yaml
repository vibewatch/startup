      - number: '2.2'
        title: 市场规模：TAM、SAM 与 SOM 的多重口径
        blocks:
          - type: paragraph
            body: >
              目前没有独立分析机构专门发布机柜级、完全一体化本地部署云计算机的 TAM。规模只能用代理指标和相邻市场数据搭建，且不确定性很高。最宽的 TAM 口径——全球本地部署服务器、存储和网络硬件——对应每年
              $80B–$130B 支出，来自数据中心硬件厂商收入和接近 IDC 的行业估计。这个框架明显过宽：它包含 Oxide 并不竞争的传统机架式服务器，也包含只卖电力和空间的托管合同。

              更收紧的可服务市场（SAM）把边界放在现代私有云平台层（API 优先、软件定义、HCI 或一体化系统）。最可比的上市公司 Nutanix 在 2025 财年报告约 $2.1B 年经常性收入（ARR），可作为
              HCI 软件收入的下限。更宽的 HCI 市场（包括 Dell VxRail、HPE SimpliVity 和 Lenovo）意味着每年 $8B–$22B 的硬件 +
              软件市场，不过各家分析估计分歧很大，分部定义也不一致。Oxide 的 SOM——面向 VMware 退出、主权云、AI/HPC，以及联邦和金融市场中受监管工作负载的纵向一体化机柜系统楔子——估计为
              $1B–$5B。这个构造置信度低，应视为数量级框架，而不是预测。

              第二个规模测算口径来自云回迁信号。CIO.com 2025 年分析引用全球公有云终端用户支出，称 2025 年约为 $723B。2024 年 Barclays CIO 调研（EE Times 经
              ReadyWorks 报道）发现，83% 企业 CIO 计划在 2024 年从公有云回迁至少部分工作负载，高于 2020 年的 43%。即便公有云支出只有 2% 回迁，也会转化为每年约 $14B
              的本地部署再投资。相反信号也需要保留：IDC 2024 分析（CIO.com）显示，多数企业预期是选择性回迁，而非全面退出云；$723B 公有云总量也说明，云仍是多数新工作负载的默认去向。
