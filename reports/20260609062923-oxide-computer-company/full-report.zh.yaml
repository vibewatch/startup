      - number: '1.2'
        title: 创始人、领导层与组织纵深
        blocks:
          - type: paragraph
            body: >
              Oxide 的领导结构高度围绕两位联合创始人展开。Steve Tuck 担任 CEO，是商业策略、客户互动和公司定位的主要外部声音，经常出现在新闻稿和投资人公告中。Bryan Cantrill 作为 CTO
              负责技术战略，也是公开曝光最高的技术领袖；他因在 Sun Microsystems 参与 DTrace 工作，以及公开倡导开源固件和硬件透明度而为系统软件圈熟知。Series A、Series B 和
              Series C 公告材料均列出两位联合创始人，确认他们至少到 2026 年 2 月仍在原岗位运营公司。公司每周做一档直播播客 “Oxide and Friends”，另有技术播客 “On the
              Metal”，让创始人在 Oxide 这个体量的公司中拥有异常高的可见度。联合创始人之外，截至本报告时点，Oxide
              未在官网公布带姓名和职务的完整领导层名单；简介页面只链接社交渠道和联系方式，并未列出高管团队。早期商业化硬件公司有这种不透明并不罕见，但继任风险、董事会构成和治理结构仍无法从公开来源验证。创始团队在大规模系统基础设施上的经历（团队背景横跨
              Sun、Joyent、Nexenta）带来很强技术可信度；两位联合创始人到 Series C 仍留任原职，也说明治理相对稳定。不过，公开董事会名单和投资人观察权结构缺失，是后期投资人需要在尽调中补上的缺口。
