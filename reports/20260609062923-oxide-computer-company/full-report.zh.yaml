      - number: '1.5'
        title: 客户细分、早期牵引与反向信号
        blocks:
          - type: paragraph
            body: >
              Oxide 面向三类主要垂直客户，这是 CEO Steve Tuck 在 Cloud Field Day 20 上直接点出的：联邦机构、金融服务公司和云 SaaS 运营商。截至本报告时点，已具名参考客户包括
              Idaho National Laboratory（INL，2023 年 10 月正式可用（GA）时宣布）、Lawrence Livermore National Laboratory（LLNL，2024 年
              11 月博客披露）、Switch（数据中心与托管公司，部署 Oxide 支撑其内部云平台，2024 年由 Data Center Dynamics 报道）、Jump Trading（量化交易公司，出现在
              Oxide 官网）和 Stoke Space（发射载具公司，也出现在官网）。GA 时还提到一家全球金融服务公司但未点名；Oxide 2024 年 4 月宣布的 CoreSite 合作，把一台机柜放在
              CoreSite Silicon Valley SV2 数据中心，与服务托管型金融客户的目标一致。联邦渠道由 NDAA、BAA、TAA 合规，以及 Carahsoft、GSA、SEWP、OTA
              等采购路径支撑。Blocks & Files 于 2024 年中参访 Oxide 总部后报道称，公司当时已出货“少于 20
              个机柜”，多数以单机柜形式部署在客户现场——这是早期但真实的商业足迹。反向信号不多，但足够重要：Oxide 是资本密集型硬件业务，商业规模还很早；公司未披露 ARR、收入、毛利率或员工数；截至 2026 年 2
              月 Series C 完成时的总机柜数未公开；从零打造定制服务器硬件，在 COVID 期间遭遇的供应链挑战也被 Oxide 自己的供应链博客记录下来，说明制造能力仍在扩张中的公司面临持续运营风险。LLNL
              部署还提醒投资人，主权和联邦客户项目周期很长，合同转化和收入确认会比客户公告晚数月到数年。
