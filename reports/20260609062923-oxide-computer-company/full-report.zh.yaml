  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 品类
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 与 Oxide 的契合度
    rows:
      - - 本地部署机柜级云（Oxide 主战场）
        - 垂直整合机柜系统，统一硬件 + 软件、API 优先控制平面、多租户 VM、存储、网络
        - 没有集成云软件的传统多厂商 DIY 机柜；仅托管机房空间 / 电力
        - CIO / CTO / IT 项目负责人；付款方是企业或机构资本预算
        - Oxide 的直接产品；除 Oxide 外，没有在 GA 阶段销售完全一体化机柜级云计算机的在位厂商
      - - HCI / 私有云软件（相邻在位厂商）
        - 超融合基础设施平台（Nutanix、VMware vSAN、Dell VxRail）；软件定义存储与计算
        - 只有硬件转售、没有云级软件；公有 IaaS；仅 SaaS 管理工具
        - CIO / IT 负责人；付款方是 IT capex 预算
        - 主要在位市场；Nutanix 约 $2.1B ARR 是最接近的可比对象；Oxide 在高主权要求场景中替代或补充 HCI
      - - 超大规模云厂商本地扩展
        - AWS Outposts、Azure Local（Azure Stack HCI）、Google Distributed Cloud；公有云延伸到本地机柜
        - 仅软件远程管理；边缘设备；IoT 网关
        - CIO / 云架构师；付款方是云服务预算（通常为 OpEx）
        - 竞争品类；把客户锁进超大规模云厂商 API 和计费体系；主权性弱于 Oxide
      - - 主权云 / 联邦 IT
        - 政府控制的云基础设施、隔离部署、FIPS 合规硬件、硬件信任根系统
        - 运行在共享超大规模云基础设施上的商业 SaaS；公有云托管的 FedRAMP 工作负载
        - 机构 IT 项目经理、DoD CIO、IC 基础设施团队；付款方是机构资本和 O&M 预算
        - Oxide 高优先级垂直；可通过 GSA、SEWP、OTA 和 Carahsoft 分销渠道进入
      - - AI / HPC 本地部署计算
        - GPU 密集机柜、批处理计算集群、HPC 调度器（SLURM）、科研计算平台
        - 云 HPC-as-a-service（AWS HPC、Azure HPC）；IoT 规模边缘推理
        - 科研计算负责人、量化金融公司 CTO、AI 工程负责人；付款方是 capex 或科研经费
        - 增长切口；Oxide 第 2 代 Sleds（EPYC 9005 / Zen 5、AVX-512）明确瞄准 AI 推理和 HPC
    notes: 市场边界定义存在争议。分析师对软件、服务和托管机房的纳入或排除口径不同，因此任何单一 TAM 数字都值得怀疑。Oxide 横跨上述五个细分市场竞争，但当前商业牵引最强的是主权云 / 联邦以及金融服务。
