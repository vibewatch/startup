  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 估值逻辑
      - 概率信号
    rows:
      - - 乐观
        - Oxide 最终披露 $400M-$600M 收入、类软件毛利率、有意义的多机架扩张，以及持久的控制平面粘性。
        - 采用约 5x-6x 销售倍数，与 Nutanix 和 Pure Storage 公开可比公司上沿区间一致；隐含 EV 约 $2.0B-$3.6B。
        - 低；需要今天尚未公开的经济性和规模披露。
      - - 基准
        - Oxide 证明一种混合基础设施模型：$150M-$250M 收入、扎实但非类软件的利润率，以及企业 / 公共部门复购扩张。
        - 采用约 3x-4x 销售倍数，匹配硬件 + 平台混合画像；隐含 EV 约 $450M-$1.0B。
        - 中；在公开经营数据改善前，这是最可辩护的默认情景。
      - - 悲观
        - Oxide 仍主要是硬件供应商，收入 $50M-$100M，渠道广度有限，且单机架试点之外扩张温和。
        - 采用约 1x-2x 销售倍数，与硬件占比较高的一体化基础设施可比公司一致；隐含 EV 约 $50M-$200M。
        - 中；如果披露继续稀疏、规模转化滞后，这一结果会更可能发生。
    notes: 这些是锚定公开可比公司收入倍数的情景 EV 区间，不是当前市场标记或 DCF 输出。
