  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 方向
      - 论点
      - 证据
      - 什么会改变观点
    rows:
      - - 投资逻辑
        - 联邦和主权基础设施是真实的早期切入口。
        - Carahsoft、Oxide 公共部门材料和 Tech Field Day 都指向联邦、金融和云 SaaS 买家，这些买家有采购或合规紧迫性。
        - 如果管线证据显示联邦渠道主要停留在探索阶段，且不能转化为多机架复购部署。
      - - 投资逻辑
        - VMware 退出和私有云需求制造了及时的市场拉力。
        - Broadcom 调研数据、ReadyWorks 和 Oxide 迁移信息都指向活跃的工作负载回迁和私有云优先级提升。
        - 如果 Broadcom / VMware 驱动的迁移预算被证明只是暂时性，而 CIO 证据显示选择性优化主导实际采购行为。
      - - 投资逻辑
        - 若能证实，机架级软硬件协同设计可以支撑溢价经济性。
        - Oxide 强调第二代计算、集成控制平面、无出口费、无虚拟化管理器税，以及相对传统机架的能效提升。
        - 如果经审计毛利率和续约 / 扩张行为未能显示类软件经济性或持久的控制平面变现能力。
      - - 反向逻辑
        - 商业规模仍处早期。
        - Blocks & Files 报道称，到 2024 年中 Oxide 出货不足 20 个机架，并称大多数部署仍是单机架安装。
        - 公开证据显示明确加速到机群级复购订单，且安装基数显著扩大。
      - - 反向逻辑
        - 公开估值支撑缺失，而这恰好是投资纪律开始发挥作用的位置。
        - 已审阅的公开来源没有披露 Oxide 收入、毛利率、订单积压质量、股权结构优先权，或 Series B/C 投后估值。
        - 管理层披露经审计收入、毛利率、订单积压和实际轮次价格。
      - - 反向逻辑
        - 市场竞争激烈，回迁也不是全面回流。
        - CIO.com 将回迁描述为选择性优化；AWS / Azure 已经提供本地云扩展，限制了 Oxide 的独特性。
        - 客户证据显示 Oxide 能稳定赢过超大规模云厂商的本地产品，并把这些胜利转化为多机架扩张。
    notes: 反向逻辑有意以证据为基础，反映真实的商业化和定价风险，而不是泛泛的创投怀疑论。
    claimRefs:
