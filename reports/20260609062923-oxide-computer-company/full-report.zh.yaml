      - number: '1.4'
        title: 产品范围、技术架构与开源姿态
        blocks:
          - type: paragraph
            body: >
              Oxide Cloud Computer 是一套实体机柜系统，交付时计算、网络、存储和软件已经集成完毕。每个机柜最多容纳 32 个第一代计算托盘，或最多 24 个第二代计算托盘（2nd Gen 引入 AMD
              EPYC 9005 Series / Zen 5 处理器和 DDR5 内存）。满配单柜可提供最高 7,875 个客户机 vCPU、30.6 TiB 客户机内存、1.7 PiB NVMe 块存储，以及 12.8
              Tbit/s 网络交换能力。交换网络采用 Intel Tofino 2 ASIC，提供 6.4 Tbit/s，并带 32 个下行和 32 个上行 100 Gbps 端口。每柜有 2
              个冗余电源架，在冗余模式下最高可供 21.6 kW。软件栈几乎完全开源：Hubris（面向服务处理器和托盘管理的 Rust 微控制器 OS）、Helios（源自 illumos 的计算托盘主机
              OS）、Omicron（用 Rust 编写，管理虚拟机、网络和存储的控制平面）、Crucible（分布式 NVMe 块存储服务）和 Propolis（基于 illumos bhyve 的用户态 VMM）都是
              oxidecomputer 组织下的公开 GitHub 仓库。开发者集成面包括 Terraform provider（v0.19.0）、Rust SDK 与 CLI、覆盖全部操作的 REST API，以及对
              Kubernetes、Red Hat OpenShift、SUSE Rancher 和 Prometheus/Grafana 监控的官方支持。从交付到可开始供应资源，Oxide 声称少于 2
              小时——这与多供应商本地部署动辄数周的周期形成鲜明对比。该架构让 Oxide 有一个差异化支持叙事：所有组件都来自同一供应商，固件和软件又是开源，客户可以验证安全属性，也能避开多供应商环境常见的互相推诿。
