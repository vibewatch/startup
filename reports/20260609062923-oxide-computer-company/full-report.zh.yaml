      - number: '7.3'
        title: 运营、安全与人员执行风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Oxide 正在尝试一个高难度组合：高密度硬件、自研软件，以及企业级支持承诺；而公司所处阶段仍在公开招聘现场交付、支持工程和项目管理岗位。供应链博客和 Series C
              说明都强调，公司暴露在长组件交期、库存规划和制造扩产上。机柜本身不是轻量基础设施；公开的功耗、散热和重量边界意味着，场地准备、替换件和现场修复都会实质影响客户体验。安全与可靠性风险也因设计而集中。Oxide
              的架构把控制平面、固件、主机 OS、VMM
              和存储放在同一屋檐下。这消除了部分多厂商互相甩锅，但也意味着，一个缺陷或漏洞可能横跨更多栈层，客户绕开的空间更小。Omicron、Hubris、Crucible、Propolis 和 Helios
              的公开代码仓库体现了可贵透明度，但也清楚说明 Oxide 背负着很宽的软件表面，必须配人、打补丁并协调。支持主张和当前招聘信息缓释了这个风险，同时也暴露出：公司仍在搭建未来客户将依赖的运营肌肉。
