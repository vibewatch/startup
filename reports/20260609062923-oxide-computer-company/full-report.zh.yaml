      - number: '1.3'
        title: 融资历程、资本结构与投资人叙事
        blocks:
          - type: paragraph
            body: >
              Oxide 的融资故事是在真实技术风险之下，按里程碑谨慎加钱。产品尚未成型前，公司先获得 Eclipse Ventures 的种子融资；2023 年 10 月，Intel Capital、Riot
              Ventures、Counterpart Ventures 和 Rally Ventures 加入 $44 million Series A，同一事件也宣布首台商业云计算机正式可用。当时累计融资为 $78
              million，意味着 Series A 前约有 $34 million 资金。$100 million Series B 于 2025 年 7 月 30 日宣布，由新战略伙伴 USIT（Thomas Tull
              的 US Innovative Technology Fund）领投，所有既有投资人参投；公司自己的博客称，$100 million Series B 使累计融资不止翻倍，并把此前融资额表述为 $89
              million。HPCWire 的 $78 million 与公司博客的 $89 million 之间存在差异，最可能原因是 2023 年 10 月到 2025 年 7
              月之间发生了未单独公告的过桥或追加融资。$200 million Series C 于 2026 年 2 月完成，仍由 USIT 领投，Eclipse、Riot Ventures、Jane Street
              及其他既有投资人参投。Series C 博客明确称，这轮融资并非业务需要驱动——Oxide 称自己已经实现真实产品市场契合和正向单位经济——而是投资人希望降低长期资本可得性风险，并支持制造规模化。按 Series
              B 前 $89 million、Series B $100 million、Series C $200 million 计算，截至 2026 年 2 月，累计融资约 $389
              million。各轮估值均未公开；Oxide 一直用使命和产品市场契合来讲资本故事，而不是用估值倍数。这可能说明公司有意避开二级市场压力，但也意味着外部观察者无法独立判断当前股权价格。
