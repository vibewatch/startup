  - id: TV005
    title: 投资逻辑破裂和否决触发器表
    columns:
      - 触发器
      - 阈值
      - 向投资逻辑的传导
      - 行动含义
    rows:
      - - 未披露定价高于纪律区间
        - 下一轮融资在未披露经审计收入和毛利率前，定价高于 ~$1B。
        - 公司尚未拿出支撑溢价所需证据，融资轮就会先跑过公开可比公司的基准情景。
        - 不参与；等待更充分披露，或入场价格显著回落。
      - - 收入披露低于预期
        - 经审计或管理层认证收入低于 $100M，或试点之外扩张乏力。
        - 悲观收入情景会成为实际锚点，软件溢价倍数假设失效。
        - 将估值重置到硬件区间，并重新评估是否还能纳入风险投资框架。
      - - 毛利率证明更像硬件
        - 毛利率仍低于 ~20%-25%，或控制平面软件贡献不明显。
        - Oxide 就失去支撑 Nutanix / Pure 式倍数的论据，估值应更接近 Dell / HPE 区间。
        - 下调溢价倍数假设，并要求更低入场价格。
      - - 客户集中度极高
        - 单一客户或单一细分占积压订单或收入的 >40%。
        - 集中度抬高重新议价风险，也削弱可重复平台论证。
        - 要求客户队列细节，并在下行情景中计入集中风险。
      - - 制造规模没有转化
        - 到下一轮融资周期，装机基础仍以单机柜部署为主，多机柜扩张有限。
        - 市场故事仍有吸引力，但规模化故事没有跑通。
        - 将 Oxide 视为早期专用硬件公司，而不是已经起势的平台公司。
    notes: 这些阈值是基于公开证据和可比公司逻辑设定的 IC 护栏，不是管理层指引。
