      - number: '6.3'
        title: 持久性、重复使用，以及扩张与集中度
        blocks:
          - type: paragraph
            body: >-
              公开记录里，持久性的证据明显弱于技术匹配的证据。Oxide 在本章审阅的任何来源中都没有披露 NRR、GRR、流失率、合同期限或续约数据。因此，最强的重复使用信号只能是代理指标，而不是经典 SaaS
              留存指标：已经在现场的系统收到软件更新；出货后加入客户要求的功能；LLNL 表示有兴趣追加 Cloud Computers；Switch
              希望获得一个可跨数据中心复制的平台。这些信号鼓舞人，因为它们暗示首次购买后仍在活跃使用；但它们没有揭示多少客户会扩张、追加机柜有多快、早期账户是否续签支持并继续把 Oxide 当作战略供应商。

              扩张逻辑容易讲清：主权云买方可以在同一个安全环境内增加更多工作负载；退出 VMware 和混合云买方可以把更多内部应用迁回本地；AI 与 HPC
              用户可以增加相邻的数据和编排服务；服务商运营方可以跨站点复制已跑通的设计。问题在证据广度。公开具名案例集中在少数技术能力很强的账户，Oxide 自己坚持直销、无 OEM 的姿态也进一步压窄渠道宽度。AWS
              Outposts、HPE GreenLake、Dell APEX、Nutanix 等在位厂商也在营销更灵活或托管化的商业模型，会降低同一类买方的采购摩擦。Gartner 还为 AWS Outposts、Azure
              Local、Nutanix Cloud Platform 和 Dell VxRail 维护专门的替代品页面，强化了一个事实：主流买方进入这个品类时，已经有成熟在位厂商可比较。Gartner 也为 VMware
              vSAN、Proxmox Virtual Environment、Red Hat OpenShift Virtualization 和 Platform9 Managed OpenStack
              维护替代品页面，说明买方可把 Oxide 放进一个远超最大在位厂商的广泛替代集合中比较。因此，扩张潜力可信，但在管理层给出队列式存量装机证据前，集中度与商业摩擦仍是实质问题。
