  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前轮估值和每股价格
        - 已审阅公开来源均未披露 Series B 轮或 Series C 轮投后估值、股价或稀释。
        - 没有实际价格，估值章节就无法对价格敏感。
        - 管理层 / 领投方尽调包；董事会材料；股权结构表摘录。
      - - 经审计收入和毛利率
        - 未发现 Oxide 的公开收入、ARR、积压订单或毛利率披露。
        - 这些指标决定 Oxide 应靠近硬件倍数还是软件倍数。
        - 经审计财务报表；CFO 尽调访谈；客户扩张队列数据。
      - - 积压订单质量和扩张画像
        - 公开证据没有区分试点、复购和批量部署订单。
        - 最大估值问题是 Oxide 是否正从单机柜安装走向规模化多机柜推广。
        - 订单漏斗；装机基础队列分析；续约 / 扩张排期。
      - - 客户集中度
        - 虽有具名客户，但公开证据未量化收入或积压订单集中度。
        - 少数锚定账户一旦项目滑坡，下行会很陡。
        - Top-10 客户清单；细分集中度备忘录；客户访谈。
      - - 制造良率和质保准备金
        - 公开来源提到制造规模，但没有披露良率、退货或质保准备金数据。
        - 制造质量不过关，硬件业务规模越大越可能毁掉价值。
        - 运营尽调；供应链审查；质保计提和现场故障数据。
      - - 优先股堆叠和反稀释条款
        - 清算优先权、参与型优先股条款和反稀释权利均不公开。
        - 如果优先股堆叠很厚，企业价值和普通股回报可能大幅背离。
        - 对章程、股份购买协议和股权结构表开展法律尽调。
    notes: 这些问题按估值相关性排序：价格、收入质量、规模转化、集中度、制造，再到优先权悬置。
    claimRefs:
      - CV005
      - CV041
      - CV046
      - CV049
      - CV051
