    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - Oxide
        - 直接一体化私有云厂商
        - 私营公司，2026 年新近融资；截至 2024 年中，最新独立规模证据仍是出货 <20 个机架
        - 联邦、金融服务、云运营商、AI/HPC、VMware 退出买家
        - 机架级硬件 + 软件一体化、可验证技术栈、一次性采购经济性
        - 渠道覆盖更窄，缺少大规模广泛部署的公开证据
      - - Nutanix
        - 直接 HCI / 私有云既有厂商
        - 上市公司，有专门投资者关系页面和广泛企业覆盖
        - 企业数据中心、混合多云、VMware 替换项目
        - 成熟软件定义 HCI、AHV hypervisor、自助云界面、合作伙伴生态
        - 主权 / 可检查固件差异化较弱；许可仍由软件主导
      - - AWS Outposts
        - 超大规模云厂商替代品 / 既有厂商
        - 背靠 AWS 母体规模和服务目录
        - 需要本地驻留或低延迟扩展的 AWS 标准化企业
        - 本地部署保持 AWS API 和服务一致性，延续托管式 AWS 体验
        - 维持对 AWS 的依赖，以及服务 / 计费锁定
      - - Azure Local
        - 超大规模云厂商替代品 / 既有厂商
        - 背靠 Microsoft 分发能力和 Azure 控制平面
        - 以 Windows 和 Azure 为中心的企业、分支机构和混合云部署
        - 面向现代和传统应用的统一 Azure 关联管理
        - 云关联许可和控制平面依赖仍在
      - - HPE GreenLake
        - 混合云既有厂商 / 邻近玩家
        - 全球 OEM 平台，具备多种消费模式和庞大支持体系
        - 需要托管式混合云、数据、AI 和私有云服务的企业
        - 基于平台的多厂商运营，加上按使用量付费 / 订阅灵活性
        - 在全栈一体化上不如 Oxide 坚定；价值往往取决于服务打法
      - - Dell VxRail / APEX
        - HCI 既有厂商 / 打包既有厂商
        - 全球 OEM，拥有融资部门和成熟企业渠道
        - VMware 占比较高的机构，以及优先考虑交钥匙采购和支持的买家
        - 交钥匙式 VMware 对齐私有云，加上订阅或分期打包
        - VMware 依赖和既有体系复杂性仍在
      - - DIY 技术栈 / OpenStack / 传统本地部署
        - 现状方案 / 内部自建
        - 用现有人员、合同和沉没成本基础设施，避免选择新供应商
        - 重视熟悉度或希望尽量减少短期平台变更的组织
        - 架构选择自由度最高，并可复用既有工具
        - 集成负担重，支持模式容易互相推诿，云式运维更慢
    notes: 规模和融资仅限公开证据。若引用产品页面未披露精确业务单元收入，则使用上市公司或母公司支持等描述。
