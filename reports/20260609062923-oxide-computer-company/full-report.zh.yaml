      - number: '8.3'
        title: 情景区间与退出准备度
        blocks:
          - type: paragraph
            body: >-
              由于 Oxide 没有披露收入或轮次估值，唯一诚实的估值方法，是绑定上市公司倍数的情景框架，而不是假精确的点估值。悲观情景采用硬件式经济性：如果经审计收入只有
              $50M-$100M，利润率也更像集成硬件而非软件，可比区间大约是 1x-2x 销售额，企业价值只有约 $50M-$200M。基准情景假设 Oxide 证明一种混合基础设施模型，收入
              $150M-$250M，经济性更好但仍混合；这映射到约 3x-4x 销售额，即约 $450M-$1.0B。乐观情景假设 Oxide 最终披露 $400M-$600M
              收入，并且毛利率清楚呈软件式、多柜扩张强、控制平面经济性粘性高；只有到那时，来自 Nutanix 和 Pure Storage 的 5x-6x 区间才有意义，折合约 $2.0B-$3.6B。


              同一框架也解释了为什么退出准备度是混合的。产品成熟度、客户证明和融资现金跑道都可信。但 IPO 准备度不只是产品准备度；它要求上市公司级报告质量。Oxide
              仍缺少公开披露的收入、毛利率、订单储备、客户集中度和股权结构表条款。因此，最合理的近期退出里程碑是另一轮私募融资，或伴随更完整披露的战略融资事件，而不是马上 IPO。公开证据支持 Oxide
              正朝更大结果推进；它不支持公司已经能接受公开市场承销的判断。
