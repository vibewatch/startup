  - id: FI001
    title: 收入模型桥
    type: flow
    layout: standard
    summary: |
      从战略客户需求到前置机柜收入和毛利的定性桥接。图表反映 Oxide 已披露的自有基础设施模式，而非按量计费 SaaS 流程。
    approximationNotes: |
      公开来源描述了合同结构，但没有披露实际 ASP、付款里程碑或收入确认时点。因此，本流程图只映射价值如何在模型中流动，不分配美元金额。
    data:
      nodes:
        - id: trigger
          label: 战略工作负载触发
          detail: VMware 退出、主权、AI/HPC、时延或云成本压力催生自有基础设施需求
        - id: sale
          label: 直销或伙伴辅助企业销售
          detail: Oxide 主要直销，同时借助 Carahsoft 做联邦采购、借助 CoreSite 做托管部署
        - id: upfront
          label: 前置机柜采购收入
          detail: 一次性基础设施采购；客户拥有机柜；没有按核心收费或按用量计费
        - id: bundled
          label: 打包软件、更新和支持价值
          detail: 控制平面、API 以及至少部分更新 / 支持价值似乎嵌在合同里，而不是单独按量计费
        - id: gross_profit
          label: 硬件和服务交付后的毛利
          detail: 利润取决于 BOM、制造、库存、物流、安装和支持效率，而不是经常性软件利润率
      edges:
        - from: trigger
          to: sale
        - from: sale
          to: upfront
        - from: upfront
          to: bundled
        - from: bundled
          to: gross_profit
    claimRefs:
      - CI002
      - CI006
      - CI009
      - CI018
      - CI040
  - id: FI002
    title: 单位经济模型桥
    type: flow
    layout: standard
    summary: |
      从技术线索生成到首台机柜销售及潜在扩张的公开可支撑销售效率链条。CAC、转化率和回本周期均未公开，因此数值为定性。
    approximationNotes: |
      Oxide 未披露 CAC、试点转化、回本周期或扩张率。因此节点表述为流程步骤和代理指标，而非量化单位经济模型。
    data:
      nodes:
        - id: lead
          label: 技术线索生成
          detail: 播客、文档、RFD 和源代码带来有知识基础的入站兴趣
        - id: qualify
          label: 云经验买家筛选
          detail: Oxide 筛选能看到战略价值的客户，也欢迎平台工程团队参与销售电话
        - id: eval
          label: 长周期技术和商务评估
          detail: 即使部分早期交易推进速度快于预期，企业基础设施销售仍是高接触、长周期
        - id: first_order
          label: 首台机柜订单
          detail: 独立报道显示，许多早期部署最初是单机柜安装
        - id: deploy
