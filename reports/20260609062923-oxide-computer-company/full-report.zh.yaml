  - id: TR005
    title: 缓释和否决标准表
    columns:
      - 风险
      - 可监控触发器
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 联邦合规漂移
        - 客户或伙伴要求新的合规证据
        - 在活跃联邦机会中，任何原产国、Section 889 或采购资格声明未通过
        - 在法律范围和整改经独立厘清前，将其视为联邦切入口的投资逻辑破裂
      - - 供应链 / 组件冲击
        - 关键供应商发出交期、分配或重设计预警
        - 任何关键组件交期重新超过 >52 周，或迫使机架重新配置
        - 重切交付假设，推迟增长情景投资判断，并索取库存缓冲分析
      - - 严重可用性或安全事故
        - 公开复盘、客户背书流失或紧急补丁周期
        - 一次影响生产客户的重复性 severity-1 事故，或一个缺少及时整改证据的重大安全缺陷
        - 在复盘质量、补丁节奏和客户流失影响明确前，暂停信念
      - - 现场服务能力未达标
        - 支持升级积压或安装延期
        - 两个或更多具名部署因现场交付或更换能力不足而延期
        - 从增长情景判断转向运营尽调，并要求提供人员配置证明
      - - 营运资本压力
        - 新融资或投资人更新与库存或支持现金需求挂钩
        - 融资事件被描述为库存救援、现金转换或客户付款延迟，而非计划扩张
        - 除非披露订单积压质量和利润率过桥，否则视为投资逻辑破裂
      - - 生态 / 认证滑坡
        - 客户要求当前验证之外的兼容性证明
        - 失去 Red Hat 验证、出现重大兼容性缺口，或目标细分中的渠道伙伴回撤
        - 下调企业信心，并提高所需折扣 / 尽调负担
      - - 关键人扰动
        - 销售或架构层领导离职，或出现可见重组
        - Steve Tuck 或 Bryan Cantrill 离职，且没有具名副手和交接计划
        - 在连续性和客户关系转移得到证明前，暂停新的投资判断
      - - 披露恶化
        - 管理层继续增加资本和客户，但没有运营透明度
        - 又一次重大融资或客户营销推进，却没有披露出货、订单积压或利润率
        - 假设不透明是结构性问题，并按更高风险硬件扩张给公司定价
    notes: 这些阈值是投资监控触发器，不是契约式承诺。每一项都把定性担忧转成具体事件，事件一旦发生，就会暂停尽调或打破当前投资逻辑。
    claimRefs:
      - CR015
      - CR035
      - CR036
      - CR037
      - CR038
      - CR039
      - CR043
      - CR044
      - CR045
      - CR046
