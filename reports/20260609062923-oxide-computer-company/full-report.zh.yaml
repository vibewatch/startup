  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Oxide 的融资轨迹在 2025 和 2026 年明显加速。公司披露 $100M Series B，并称此前六年累计融资 $89M；第三方报道随后称，不到一年后，公司完成 $200M Series C，由
              U.S. Innovative Technology Fund
              领投。这是真实的融资动能，也很重要：新资金被明确用于制造规模、客户支持和路线图扩展，而不是生存资本。与此同时，公开记录在估值工作真正开始的地方严重不完整。审阅到的 Series B 或 Series C
              来源没有任何一个披露 post-money valuation、股价、稀释、清算优先权或反稀释条款。第三方融资总额也彼此冲突：DCD 称 Oxide 四轮累计融资 $378M，Owler 称 $356.0M，官方
              Series B 文章则暗示后续 $200M 融资后累计为 $389M。方向很清楚——Oxide 资本充足——但精确资本历史无法从公开证据完全对账。


              这种不完整让入场纪律更重要，而不是更不重要。公开证据可以支撑情景框架，但不能支撑不看价格的买入。关键问题不是 Oxide
              值不值得关注，而是任何拟议轮次价格，能否被上市公司倍数和已验证经营数据共同支撑。在管理层披露收入、毛利率、订单储备质量和实际轮次估值前，审慎立场是把公司留在继续研究 / 观察区间，拒绝只为叙事买单。
