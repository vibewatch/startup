  - id: FE001
    title: Oxide 产品架构图
    type: stack
    layout: wide
    summary: |
      从操作界面到底层机柜机械结构和安全管理的六层 Oxide 技术栈，结合官方文档和主要软件组件的公开仓库证据。
    data:
      layers:
        - label: 操作员与自动化界面
          detail: API、CLI、Web 控制台、Terraform、Packer，以及 GitHub Actions、GitLab CI 等工作流集成。
          items:
            - REST API
            - CLI / 控制台
            - Terraform 提供器
            - Packer
        - label: 控制平面层
          detail: Omicron 组件协调设置、编排、DNS、网关服务、遥测和技术员端口恢复。
          items:
            - Nexus
            - Sled Agent
            - DNS / 网关
            - Oximeter / Wicket
        - label: 工作负载服务层
          detail: 机柜原生 VM、磁盘、VPC 和指标抽象暴露出类云交互模型。
          items:
            - Propolis VMM
            - Crucible 块存储
            - VPC / OPTE / Geneve
            - 指标 API
        - label: 主机与计算托盘层
          detail: Helios 支撑主机环境，计算托盘提供 CPU、内存和 NVMe 资源。
          items:
            - Helios
            - 第 1 / 第 2 代计算托盘
            - AMD EPYC 9005
            - NVMe 槽位
        - label: 安全管理层
          detail: 板级硬件信任根和嵌入式服务处理器，取代传统以 BMC 为中心的设计。
          items:
            - 硬件信任根
            - 嵌入式服务处理器
            - 签名 / 度量启动链
        - label: 机柜与设施层
          detail: 机柜尺度机械结构、DC 配电和双交换机网络，构成物理运行模式的锚点。
          items:
            - ORV3 风格机柜 + 模块格
            - DC 母排 / 电源托架
            - 双 Tofino 2 交换机
            - 设施供电 + 上联
    approximationNotes: |
      这套栈来自公开文档、产品页面和代码库描述的拼合；Oxide 没有发布一张覆盖所有层的规范架构图。
    claimRefs:
      - CE002
      - CE013
      - CE014
      - CE018
      - CE021
      - CE032
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: |
      从机柜交付到第 2 天 VM 运维的端到端操作流程，刻画产品规格、官网和发布 / 部署报道共同指向的可支持工作流。
    data:
      nodes:
        - id: order
          label: 订购 Cloud Computer
          detail: 客户购买的是完整机柜，而不是分别组装计算、存储、网络和软件。
        - id: deliver
          label: 收到组装完成的机柜
          detail: Oxide 和第三方报道均称，机柜随所需软件一起完整发货，无需现场组装。
        - id: facility
          label: 放置、供电并接入网络
          detail: 客户把机柜放入设施，满足供电 / 气流要求，并连接最低要求的网络链路。
        - id: bootstrap
          label: 技术端口引导
          detail: 初始设置从 1GbE RJ45 技术端口开始。
        - id: setup
          label: 控制台 / CLI 设置
          detail: 输入必要信息后，通过 Web 控制台或 CLI 继续设置。
        - id: tenant
          label: 创建项目、VPC、镜像和磁盘
          detail: 运维人员定义项目和隔离虚拟网络，再准备镜像以及持久或本地存储。
        - id: workloads
          label: 配置 VM 并集成工具
          detail: 团队配置 VM，并通过 API、Terraform、Packer 和工作负载工具链接入自动化。
        - id: operate
          label: 第 2 天运维
          detail: 遥测、更新和面向工作负载的集成，支撑 AI、HPC、VMware 迁移和私有云等持续使用场景。
      edges:
        - from: order
          to: deliver
          label: 购买完整系统
        - from: deliver
          to: facility
          label: 搬入设施
        - from: facility
          to: bootstrap
          label: 接入电力 + 链路
        - from: bootstrap
          to: setup
          label: 初始化机柜
        - from: setup
          to: tenant
          label: 定义云原语
        - from: tenant
          to: workloads
          label: 部署工作负载
        - from: workloads
          to: operate
          label: 监控并更新
    approximationNotes: |
      流程仅反映公开设置和使用描述；面向具体客户的实施步骤、迁移工具和运维手册并未完整公开。
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE006
      - CE025
      - CE026
