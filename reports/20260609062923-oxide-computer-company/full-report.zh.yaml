      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >
              公开证据能支持的结论是：商业模式形态比商业模式表现更强。Oxide
              看起来有清晰的变现设计：销售完全一体化机柜，避开按核心和按插槽收费的授权，把软件价值封装进自有基础设施，并用更低的公有云和传统机柜成本说服买方。如果扩张队列强，这种模式可以产生高质量收入；但它天然资本密集，因为增长需要硬件、制造能力、库存、物流和支持。公开证据显示，公司理解这些约束，并用
              Series B 和 Series C 去缓解它们。

              承销的障碍不是战略含糊，而是财务披露缺失。公开材料没有真实
              ASP、订单、ARR、毛利率、支持服务附加率、客户集中度、现金或现金跑道证据。独立牵引证据也仍指向早期商业化基础，而不是规模化部署。因此，本章底线是混合的：收入质量和买方痛点看起来真实，毛利路径可成立但未被证明，资本充足性较此前改善但无法验证。数据室可以很快改善这一点；仅靠公开证据做不到。
            claimRefs:
              - CI040
              - CI041
              - CI042
              - CI043
              - CI044
              - CI045
