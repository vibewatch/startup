      - number: '3.2'
        title: 竞品画像与能力对比
        blocks:
          - type: paragraph
            body: >-
              最有防御性的直接比较，是 Oxide 与 Nutanix，因为两者都承诺把现代私有云运营模式带到本地部署。但 Nutanix 本质上仍是兼容生态很广的软件平台；Oxide
              卖的是物理集成机柜，网络、存储、固件和控制平面全是一方能力。AWS Outposts 和 Azure Local
              从相反方向攻击同一组工作负载：它们不是移除云依赖，而是把超大规模云控制平面延伸进客户数据中心。HPE 和 Dell 的定位围绕运营简化、融资灵活性和支持广度，往往保留多供应商或 VMware
              熟悉度，而不是替换成全新的运营模式。公开证据显示，相对传统本地部署栈，Oxide 在一方 API 自动化、内建网络、块存储和可验证固件上异常强。公开文档、Terraform provider 和 Red Hat
              目录上架记录让产品表面很具体，不是概念。但与此同时，功能广度仍窄于现有玩家的大型目录；公开来源也无法证明它在灾备、数据库生命周期工具、多集群舰队管理或广泛托管服务覆盖等周边企业服务上已经达到同等水平。对买方而言，关键问题因此不是
              Oxide 是否足够现代，而是它的一体化方式是否解决了足够多周边运营问题，值得离开现有生态。
