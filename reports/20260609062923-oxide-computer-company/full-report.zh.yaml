        - 过去 12 个月收入约 1.7x；最新 10-K 于 2025-12-18 提交
        - 下沿混合云 / 基础设施可比公司，尤其可对照 GreenLake 式消费替代方案。
        - 公开公司具备全球服务广度，产品集中风险远低于 Oxide。
