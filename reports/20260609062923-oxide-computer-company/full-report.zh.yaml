  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、定价与 GTM 动作
        blocks:
          - type: paragraph
            body: >
              Oxide 的公开商业模式在形式上异常清楚，但金额高度不透明。公司把 Oxide Cloud Computer 作为自有机柜级系统销售，而不是租赁服务：官网、VMware 替代页面、HPC
              页面和公共部门采购材料都强调一次性基础设施采购、无授权费、无用量计费，以及客户拥有机柜。这一定位强烈指向以前置硬件系统销售为主的收入模型，控制平面、更新和大部分软件价值打包进合同，而不是作为单独计量的订阅出售。不过，公开标价缺失，因此真实
              ASP、折扣、付款条件，以及是否单独拆出支持或专业服务仍未知。

              公开 GTM 证据指向直接企业销售，而不是广泛经销渠道或自服务模式。Blocks & Files 报道称，Oxide 没有 OEM 故事，并且会选择交付对象；Series B
              文章则说企业销售周期“出了名地长”，但早期客户从首次对话到系统交付比预期更快。Oxide 还把播客、文档、RFD 和源代码视为创造需求的因素，说明其入站线索生成异常技术化。近期 FAQ Friday
              文章补充了更多细节：Oxide 发布 SDK、面向 Terraform 和 Packer 式工具的 Go 集成路径、CI/CD runner 指引、Windows 实例支持和 Kubernetes
              集成，降低了平台团队的技术评估摩擦。Carahsoft 和 CoreSite 很重要，但作用是叠加在直接销售之上的采购和部署赋能，而不是替代直接销售。这种组合更像高触达、高 ACV
              的基础设施销售，而不是互联网规模的软件驱动“先落地再扩张”。Oxide 自己关于公司为何把工作负载迁回本地部署的 FAQ，也呼应了更宽的 CIO/Broadcom
              叙事：稳定工作负载、出站成本、监管、主权和延迟，仍是主要经济和技术触发点。
