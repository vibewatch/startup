  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >
              Oxide 的产品不是普通 OEM 意义上的服务器 SKU
              家族；它以完整机柜级云系统出售，把计算、存储、网络，以及供应和运行工作负载所需的操作软件结合在一起。抓取材料里的工作流很明确：机柜组装好后到场，运营者接入电力和网络链路，通过技术维护端口启动系统，随后进入 Web
              控制台、CLI、API、Terraform 或其他自动化驱动的供应流程。这让买方要完成的任务更接近“拥有一朵私有云”，而不是“组装一台机柜”。

              公开页面还显示，Oxide 试图用同一平台解决几个相邻任务，而不是拆成多个产品：VMware 替代、联邦主权基础设施、AI / 数据工程、HPC
              运营服务，以及混合云回迁。因此，模块地图最好描述为一个核心机柜，外面叠加计算、存储、网络、控制平面和工作负载覆盖层。公开证据可以支撑的是产品边界和当前暴露的模块，而不是完整内部 SKU 目录或报价矩阵。
