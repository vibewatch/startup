      - number: '8.4'
        title: 建议、否决触发条件与最终尽调
        blocks:
          - type: paragraph
            body: >-
              当前建议是继续研究。不是因为 Oxide 缺乏潜力，而是没有价格和经济性披露，估值纪律无从建立。中等置信度反映上行逻辑有真实证据支撑：主权云和退出 VMware
              的需求、采购渠道、新资本、差异化产品设计，以及正在扩大的私有云讨论。高风险反映账本另一面：早期出货规模、资本强度、直销带来的渠道限制、选择性而非全面的工作负载回迁，以及缺失的财务透明度。实际含义是：不能在叙事溢价下盲目买入。任何下一轮估值若高于约
              $1B，都需要显著强于当前公开材料的证据；若高于约 $2B，则需要 $400M+ 区间的经审计收入和软件式利润率，才足以对照上市可比区间站得住。


              什么会改变判断？第一，经审计或管理层认证的收入和毛利率。第二，订单储备质量和扩张数据，证明 Oxide
              正从单柜证明走向批量部署。第三，客户集中度和保修准备金披露。第四，未偿轮次的实际优先股堆叠。如果这些项目到位，且价格相对情景框架保持纪律，Oxide
              可以从继续研究转为买入。在此之前，尽调负担完全落在披露上，而不是故事上。
