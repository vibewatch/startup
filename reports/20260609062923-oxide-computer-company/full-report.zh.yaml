  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 展示 Oxide 最适配的买家如何从识别痛点，走到首个机柜部署；若结果满意，再进入后续工作负载或站点扩张。
    data:
      items:
        - label: 痛点识别
          description: 买家遇到触发因素：VMware 许可压力、公有云成本波动、主权要求，或密集计算工作负载遥测不足。
        - label: 技术评估
          description: 工程师主导的团队会借 Cloud Field Day 内容、文档、公开 RFD 和开源代码验证 Oxide，而不只看营销材料。
        - label: 采购路径
