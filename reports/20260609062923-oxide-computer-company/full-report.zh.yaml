      - number: '2.4'
        title: 增长驱动与需求催化
        blocks:
          - type: paragraph
            body: >
              最直接的需求催化，是 Broadcom 2023 年收购 VMware 后重组授权模式，显著抬高了 VMware 存量客户成本。这触发了企业和公共部门 IT 对 VMware 退出路径的紧迫评估，许多组织开始比较
              Nutanix、OpenStack，以及 Oxide 这类专门构建的替代方案。ReadyWorks 把 VMware 退出与云回迁同时发生的趋势称为一个结构性的“基础设施汇合时刻”。

              AI 和 HPC 工作负载是第二个近端驱动。Broadcom Private Cloud Outlook 2025 调研（2025 年 5 月，1,800 名 IT 负责人）发现，55% 受访者偏好用私有云做
              AI 模型训练、调优和推理——这说明 GPU 高密度本地部署基础设施需求具备持续性。Oxide 的 2nd Gen Sleds（AMD EPYC 9005 / Zen 5、AVX-512）明确面向 AI
              推理和向量密集型计算。Oxide 博客引用 Goldman Sachs 研究，预计数据中心电力消耗将从全球用电的 1–2% 升至 2030 年的 3–4%，并称机柜级设计对效率至关重要；Oxide
              声称相较传统机柜可把单工作负载耗电降低 50%。

              数据主权监管是第三个结构性驱动。VMware Sovereign Cloud Initiative（2021）记录了企业和政府日益增长的需求：云基础设施必须能在硬件层面执行数据驻留。联邦法规、EU
              数据驻留要求和金融服务监管要求（例如数据不得离开特定司法辖区）都更偏向 Oxide 的本地拥有模式，而不是超大规模公有云。BVP Nasdaq Emerging Cloud Index
              的背景说明，公有云估值仍处高位，但规模化使用云的相对成本已经吸引了回迁资本。DHH 2022 年 Basecamp 文章 “Renting computers is (mostly) a bad deal for
              medium-sized companies”，为经济性论点提供了锚点，也推动 a16z 发表 “The Cost of Cloud, a Trillion Dollar Paradox”（2021）。
