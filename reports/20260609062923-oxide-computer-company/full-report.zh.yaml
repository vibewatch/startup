        title: 部署、集成、可靠性与路线图
        blocks:
          - type: paragraph
            body: >
              部署速度是 Oxide 叙事的核心，但能支撑的说法是一个区间，而不是合同承诺。官方页面称系统可在两小时内投入运行，独立报道则写到从安装到开发者可用只需数小时，一篇发布报道引用了四小时。共同点在于，Oxide
              交付的是一整柜、连软件都装好的系统；不是它公开了硬性的部署 SLA。集成证据更宽也更扎实：抓取页面显示 REST API、CLI、控制台、Terraform provider、Packer、GitHub
              Actions、GitLab CI、OpenShift、Rancher、Kubernetes 周边工作流、Flux、Slurm、Jupyter、Prometheus 和 Grafana。

              可靠性证据有强有弱。正面看，存储页面记载三副本镜像、快照、校验和与持续校验；文档显示双交换机连接和硬件信任根管理模型；Series B 文章称 Oxide
              已经在现场交付软件更新和客户要求的功能。弱项是，没有抓取到的来源公布正常运行时间历史、公开事故报告、备件政策或支持响应承诺。因此，路线图证据在规模化层面最强——制造、运营、客户支持和更宽的路线图范围；在详细的公开发布日历上最弱。
