      - number: '3.4'
        title: 护城河耐久性、反向证据与替代风险
        blocks:
          - type: paragraph
            body: >-
              当买方重视一体化控制、可验证基础设施，以及没有超大规模云锁定的公有云式自动化时，Oxide
              的护城河最强。硬件信任根、开源栈组件、内建网络和存储，以及明确的主权和公共部门定位，合在一起不是商品化信息。在联邦、国家安全和部分金融工作负载里，这些属性可能比 AWS、Azure、HPE、Dell 或
              Nutanix 更宽的产品目录更重要。公司还受益于产品是实体机柜：一旦安装，电力、冷却和运营手册会带来有意义的黏性。但耐久性不等于必然胜出。最强的反向证据是，更大的市场叙事仍有争议。CIO.com
              把回迁定义为选择性工作负载优化，而不是大规模退出云；主流 HCI 替代文章仍把现有玩家放在候选清单中心，很少把 Oxide 当成默认比较对象。Oxide
              还必须穿过供应链和制造复杂度实现规模化，而软件主导的对手大多不用面对这些问题。定制硬件既是差异化，也是约束。正确的投资解读是：Oxide
              具有真实的细分护城河，但还没有分销护城河；风险不是产品没有差异化，而是资本更强的现有玩家可能用买方更熟悉的包装吸走足够多需求，赶在 Oxide 扩大装机基础之前截流市场。
