  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险图谱
        blocks:
          - type: paragraph
            body: >-
              Oxide 最高的剩余风险并不是产品逻辑不连贯；证据反而显示，产品可信、切入点窄但真实，只是规模化路径受几个集中的失效模式约束。第一是联邦采购资格漂移。Oxide 有意押注公共部门和主权云工作负载，自身话术加上
              Carahsoft 的包装，使本土来源、贸易协定和 Section 889
              筛查成为商业承诺的一部分，而不是事后补项。如果供应链替代或未记录组件削弱这个承诺，公司可能丢掉最契合其安全与主权叙事的客群。第二组风险是运营：制造、库存和支持执行。Oxide
              仍是一家硬件创业公司，卖的是笨重、高功率密度的机柜，必须发货、安装、现场服务并持续支持。当前出货量的公开证据仍薄，但最好的独立信号仍指向很小的存量装机；这意味着一次延迟扩张、重大故障或现场服务失误，都可能实质动摇客户信心。第三组是财务模型不透明。新资金和合作伙伴验证有帮助，但公开来源仍未披露订单储备、毛利率或当前机柜数。对投资人而言，这意味着缓释因素看得见，但剩余敞口仍只能部分支撑投资判断。
