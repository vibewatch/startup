      - number: '6.2'
        title: 采用轨迹与具名客户证明
        blocks:
          - type: paragraph
            body: >-
              Oxide 的公开采用证据，按时间线读比盯一个客户数量指标更有信息量。2023 年 10 月 GA 时，Oxide 点名 Idaho National Laboratory
              和一家未具名全球金融服务公司为早期客户，说明产品已经从概念走到付费部署。到 2024 年 7 月，Blocks & Files 报道出货机柜少于 20
              台，并称多数是单柜部署。这个数字很小，但仍重要：它证实现场有真实硬件，而不是纯试点故事。之后的证明收敛到几个可信账户。LLNL 宣布安装 Oxide，用于在 HPC 旁现代化运营工作负载；Switch
              则在自有数据中心内部署 Oxide 硬件，搭建内部使用的私有云平台。

              2025-2026 年，新鲜度提高了，但精确度没有提高。Oxide 的 Series B 文章称，首批出货后客户落地更快，现场更新和客户要求的功能已经发生。Intel Capital 和 Oxide 的
              Series C
              材料随后描述了产品市场匹配和加速采用。这些表述有方向性意义，尤其对销售周期天然较长的硬件创业公司而言；但它们仍没有披露当前客户数、在线机柜数或已签约的追加订单。因此，本章把采用判断为真实且在改善，但维持中等置信度，因为最关键的分母仍未公开。
