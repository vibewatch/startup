      - number: '8.2'
        title: 投资逻辑、反向逻辑与可比公司锚
        blocks:
          - type: paragraph
            body: >-
              正向估值逻辑始于一个真实市场切口。Oxide 卖的不是通用服务器；它围绕主权和受监管工作负载、VMware 替代、金融服务延迟要求，以及客户希望完全自有的 AI 数据基础设施定位。Carahsoft
              显示真实的联邦采购路径，Tech Field Day 捕捉到围绕联邦、金融服务和云 SaaS 的具体买方分层，Oxide
              自己的产品页面则围绕一次性购买经济性、无出口流量费、软硬件协同设计和第二代计算给出一致论证。Broadcom 2025 年私有云调查和 ReadyWorks 的回迁摘要进一步说明需求背景有利，尤其适用于重新评估
              VMware 或公有云成本结构的买方。


              反向逻辑同样重要。CIO.com 明确认为，回迁是选择性优化，而不是从云端全面撤退；这直接警告不要做夸张 TAM 假设。Blocks & Files 报道，截至 2024 年中，Oxide 出货少于 20
              个机柜，且多数部署仍是单柜安装；这是有意义的商业证明，但不是后期规模。Oxide 还处在一个已有强大在位厂商的市场：Nutanix 和 Pure Storage 以软件式收入倍数交易，Dell 和 HPE
              则使用低得多的硬件导向倍数。这些上市可比公司给出一个现实估值走廊，约为 1.7x 到 6.2x 收入。只有未来披露显示软件式利润率、重复扩张和持久控制平面价值，而不是以硬件收入组合为主，Oxide
              才配得上该走廊上沿。
