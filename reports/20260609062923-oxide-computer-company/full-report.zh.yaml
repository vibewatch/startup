      - number: '7.2'
        title: 监管、法律与合作伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              Oxide 的监管和法律风险集中在一件事：能否在最契合客户所处的采购与安全环境里执行到位。公司公开承诺 NDAA、BAA 和 TAA 对齐，并通过 Carahsoft 的联邦采购工具销售，因此 FAR
              本土内容规则、贸易协定覆盖和 Section 889 筛查都会变成实际市场推进关口。垂直整合让风险更高：同一套架构能堵住多厂商安全缝隙，也意味着
              BOM、固件链和支持流程中更大一部分，都必须为联邦审查员保持证据清洁。出口与数据处理问题次要但真实。BIS 指引意味着，任何跨境发货或外国主权部署，都需要出口分类和许可纪律；公开材料中看不到这种体系。Oxide
              的隐私政策也确认，尽管工作负载数据由客户在本地控制，公司仍处理网站、招聘和部分企业服务个人数据。缓释面有分量：主权云话术强调开放固件、来源证明、硬件信任根和运营方控制的连接性；Red Hat 与
              Carahsoft 则提供外部验证，表明 Oxide 可以嵌入企业和联邦采购流程。即便如此，法律风险登记仍不完整，因为没有任何公开来源集合给出律师级的 IP、合同或诉讼敞口全景。
