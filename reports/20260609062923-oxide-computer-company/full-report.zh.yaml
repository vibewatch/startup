  - id: TV001
    title: 建议摘要表
    columns:
      - 决策字段
      - 当前观点
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 将 Oxide 留在主动尽调 / 跟踪名单中；在价格和经济性披露前，不要对新一轮融资形成投资判断。
      - - 信心
        - 中
        - 需求和融资证据真实，但收入、利润率和轮次价格缺失，估值支撑不完整。
      - - 风险评级
        - 高
        - 资本强度、早期出货规模和透明度缺失，使下一轮若激进定价会产生实质下行。
      - - 估值立场
        - 未披露；缺少更完整披露时，约 $1B 以上缺乏支撑
        - 公开证据能支撑情景区间，不能支撑当前点估值；高于基准情景区间的价格，需要经审计收入和利润率。
      - - 退出姿态
        - 跟踪后续私募轮或战略融资
        - 近期价值拐点更可能来自披露充分的融资，而不是立刻 IPO。
      - - 上调触发器
        - 披露收入 + 毛利率 + 实际轮次价格
        - 只有经审计经营数据和进入价格匹配公开可比公司走廊时，才从继续研究转为买入。
    notes: 公开证据允许建立有纪律的进入框架，但没有披露当前股权价格或经审计经营指标。
