- id: recommendation-triggers-and-final-diligence
  title: Recommendation, Kill Triggers, and Final Diligence
  body: >-
    The current recommendation is research-more. Not because Oxide lacks promise, but because valuation discipline is impossible without price and economics disclosure. Medium confidence reflects that the upside case is grounded in actual evidence: sovereign and VMware-exit demand, procurement channels, fresh capital, differentiated product design, and a widening private-cloud discussion. High risk reflects the opposite side of the ledger: early shipment scale, capital intensity, channel limits from direct sales, selective rather than wholesale repatriation, and missing financial transparency. In practical terms, this means no blind buy at a narrative premium. Any next-round valuation above roughly $1B would require substantially better evidence than is currently public; any valuation above roughly $2B would require audited revenue in the $400M+ range plus software-like margins to be supportable against the public comp band.


    What would change the call? First, audited or management-certified revenue and gross margin. Second, backlog quality and expansion data showing that Oxide is graduating from single-rack proofs to fleet rollouts. Third, customer concentration and warranty-reserve disclosure. Fourth, the actual preference stack for the outstanding rounds. If those items arrive and the price is disciplined relative to the scenario framework, Oxide could move from research-more to buy. Until then, the diligence burden remains squarely on disclosure, not storytelling.
