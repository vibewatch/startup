  - Relevance
  - Limitation
  rows:
  - - Nutanix
    - Market cap ~$14.02B; trailing revenue ~$2.75B
    - ~5.1x trailing revenue; latest 10-K filed 2025-09-24
    - Closest public private-cloud software comparator with hybrid-cloud and VMware-displacement relevance.
