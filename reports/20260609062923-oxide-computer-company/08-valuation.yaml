- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Key assumptions
  - Valuation logic
  - Probability signal
  rows:
  - - Bull
    - Oxide eventually discloses $400M-$600M revenue, software-like gross margins, meaningful multi-rack expansion, and durable control-plane stickiness.
    - Apply roughly 5x-6x sales, in line with the upper public comp band from Nutanix and Pure Storage; implied EV about $2.0B-$3.6B.
    - Low; requires economics and scale disclosures that are not public today.
  - - Base
    - Oxide proves a blended infrastructure model with $150M-$250M revenue, solid but not software-like margins, and repeat enterprise / public-sector expansion.
    - Apply roughly 3x-4x sales for a mixed hardware-plus-platform profile; implied EV about $450M-$1.0B.
    - Medium; most defensible default until public operating data improves.
  - - Bear
    - Oxide remains primarily a hardware vendor with $50M-$100M revenue, limited channel breadth, and only modest expansion beyond single-rack pilots.
    - Apply roughly 1x-2x sales, consistent with hardware-heavy integrated infrastructure comps; implied EV about $50M-$200M.
    - Medium; this outcome becomes more likely if disclosure remains sparse and scale conversion lags.
  notes: >-
    These are scenario EV ranges anchored to public comparable revenue multiples, not current-market marks or DCF outputs.
