company:
  name: Oxide Computer Company
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports a real company with real customer demand signals, fresh financing, and differentiated rack-scale infrastructure, but it does not support a defensible current entry price. Oxide disclosed a $100M Series B and third parties reported a $200M Series C, yet no public source reviewed discloses revenue, gross margin, backlog, liquidation preferences, or the round valuation itself. Public comparable revenue multiples span roughly 1.7x to 6.2x sales across HPE, Dell, Nutanix, and Pure Storage, so the only supportable call is research-more with medium confidence and high risk until price discovery and audited operating metrics arrive.
sections:
- id: financing-context-and-entry-discipline
  title: Financing Context and Entry Discipline
  body: >-
    Oxide's funding trajectory clearly accelerated in 2025 and 2026. The company disclosed a $100M Series B and said it had raised $89M over the prior six years before that round; third-party coverage then reported a $200M Series C less than a year later, led by the U.S. Innovative Technology Fund. That is real financing momentum and it matters: the new capital was explicitly framed around manufacturing scale, customer support, and roadmap expansion rather than survival capital. At the same time, the public record is materially incomplete where valuation work actually begins. None of the reviewed Series B or Series C sources discloses post-money valuation, share price, dilution, liquidation preferences, or anti-dilution terms. Third-party capital tallies also conflict: DCD says Oxide has raised $378M across four rounds, Owler says $356.0M, and the official Series B post implies $389M after the later $200M financing. The direction is clear — Oxide is well-capitalized — but the exact capital
    history is not fully reconciled from public evidence.


    That incompleteness makes entry discipline more important, not less. Public evidence can support a scenario framework, but it cannot justify a price-insensitive buy. The key question is not whether Oxide is interesting; it is whether any proposed round price sits inside a range that can be defended from public-company multiples and verified operating data. Until management discloses revenue, gross margin, backlog quality, and the actual round valuation, the prudent stance is to keep the company in research-more / track territory and refuse to underwrite narrative alone.
