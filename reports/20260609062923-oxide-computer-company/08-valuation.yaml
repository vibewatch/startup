  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-round-valuation
    missingEvidence: Series B and Series C post-money valuation, share price, and dilution terms.
    whyItMatters: A valuation chapter cannot be price-sensitive without the actual price.
    diligencePath: Obtain financing term sheet, cap table, and board-approved financing summary from management or lead investor.
    relatedQuestionRefs:
    - QV002
    - QV029
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: revenue-and-margin
    missingEvidence: Audited revenue, gross margin, backlog, and expansion data.
    whyItMatters: These metrics determine whether Oxide belongs near hardware multiples or software multiples.
    diligencePath: Request audited financial statements, bookings cohort analysis, and gross-margin bridge by product and services.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue and backlog concentration by top customer, segment, and deployment size.
    whyItMatters: Concentration can materially increase downside risk even when top-line demand looks healthy.
    diligencePath: Review top-customer schedule, customer contracts, and expansion cohorts by deployment size.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV005
    - TV006
  - type: missing-source
    severity: material
    topic: comparable-coverage-gap
    missingEvidence: Public valuation and revenue anchors for the most similar private rack-scale or sovereign-cloud peers beyond the four disclosed public comps in TV004.
    whyItMatters: TV004 is intentionally partial because Oxide's closest private analogs do not publish enough valuation and revenue data to anchor row-level comparisons cleanly.
    diligencePath: Add private-market data room marks, banker comp sheets, or management-provided peer revenue and valuation snapshots for the closest private comparables.
    relatedQuestionRefs:
    - QV017
    - QV018
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: preference-stack
    missingEvidence: Liquidation preferences, participation features, anti-dilution terms, and other preference overhang in the cap table.
    whyItMatters: Enterprise value and common-equity return can diverge sharply when the preference stack is heavy.
    diligencePath: Have counsel review charter, stock purchase agreements, pro forma cap table, and any investor side letters.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV006
