  - - Pure Storage
    - Market cap ~$24.52B; trailing revenue ~$3.94B
    - ~6.2x trailing revenue; latest 10-K filed 2026-03-25
    - Useful upper-band comp for modern infrastructure with strong software and recurring-services mix.
    - Storage-heavy mix and public-market disclosure quality make it cleaner and more mature than Oxide.
  - - Dell
    - Market cap ~$260.33B; trailing revenue ~$134.00B
    - ~1.9x trailing revenue; latest 10-K filed 2026-03-16
    - Useful lower-band comp for integrated hardware and infrastructure systems at large scale.
    - Conglomerate scale and diversified businesses make it much less pure-play than Oxide.
  - - HPE
    - Market cap ~$66.04B; trailing revenue ~$38.79B
    - ~1.7x trailing revenue; latest 10-K filed 2025-12-18
    - Lower-band hybrid-cloud / infrastructure comp, especially against GreenLake-style consumption alternatives.
    - Public company with global services breadth and far lower product concentration risk than Oxide.
