- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Undisclosed price arrives above disciplined range
    - Next financing is priced above ~$1B without audited revenue and gross-margin disclosure.
    - The round would outrun the public-comp base case before the company has supplied the evidence needed to justify a premium.
    - Do not participate; wait for fuller disclosure or a materially lower entry point.
  - - Revenue disclosure disappoints
    - Audited or management-certified revenue lands below $100M or shows weak expansion beyond pilots.
    - Bear-case revenue becomes the operative anchor and premium-software multiple assumptions collapse.
    - Reset valuation to hardware-like range and reassess fit for venture underwriting.
  - - Gross margin proves hardware-like
    - Gross margin remains below ~20%-25% or control-plane software contribution is immaterial.
    - Oxide loses the argument for Nutanix/Pure-style multiple support and belongs nearer Dell/HPE valuation territory.
    - Cut premium multiple assumptions and demand lower price discipline.
  - - Customer concentration is extreme
    - One customer or one segment accounts for >40% of backlog or revenue.
    - Concentration raises renegotiation risk and weakens the repeatable-platform thesis.
    - Require customer cohort detail and adjust downside case for concentration risk.
  - - Manufacturing scale does not convert
    - Installed base remains predominantly single-rack deployments with limited multi-rack expansions through the next financing cycle.
    - The market story remains interesting, but the scale story fails to validate.
    - Treat Oxide as an early specialty hardware company rather than a breakout platform company.
  notes: >-
    Thresholds are IC guardrails derived from public evidence and comp logic, not management guidance.
