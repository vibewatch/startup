  productSummary: The Oxide Cloud Computer ships as a single rack containing second-generation AMD EPYC 9005 compute sleds, NVMe storage, an integrated switching fabric, and full firmware and control-plane software — removing the need for customers to integrate servers, switches, and hypervisors separately.
  customerFocus: Enterprises in federal agencies, financial services, HPC, and cloud SaaS operations that require on-premises sovereign cloud with hardware root of trust, compliance postures (NDAA/BAA/TAA), and Carahsoft-channel accessibility.
  businessModel: Direct enterprise hardware sales (rack as a capital purchase) with annual software subscription licensing; hardware sold through Carahsoft for federal channels and directly for commercial accounts; no metered-billing or third-party license taxes on the compute layer.
  stage: Series C
  fundingStatus: $200M Series C closed February 2026, led by USIT (Thomas Tull), with participation from Eclipse Ventures, Riot Ventures, Jane Street, and existing investors. Total capital raised approximately $389M.
