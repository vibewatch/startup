companyProfile:
  summary: Oxide Computer Company is an Emeryville, CA infrastructure startup that builds a vertically integrated rack-scale cloud computer — fusing hardware, open-source firmware (Hubris RTOS, Oxide RFD engineering process), a proprietary control plane (Omicron), and full-rack networking into a single purchasable unit. Founded in 2019 by Steve Tuck (CEO) and Bryan Cantrill (CTO), Oxide shipped its first commercial rack in June 2023, raised $200M in a Series C in February 2026, and targets enterprises in federal, financial services, and regulated industries that require on-premises cloud with strong sovereignty and compliance posture. Revenue, valuation, and gross margin are not publicly disclosed.
