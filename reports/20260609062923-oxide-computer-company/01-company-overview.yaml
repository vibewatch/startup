  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: Oxide has not disclosed any round valuation; no secondary market data found.
    whyItMatters: Without a valuation anchor, investors and diligence teams cannot assess the current equity price, dilution
      from the three rounds, or return multiples for earlier investors.
    diligencePath: Request capitalization table and round-by-round share prices directly from Oxide management or a participating
      investor.
    relatedQuestionRefs:
    - QO006
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: No official headcount figure found in any reviewed source; company does not publish team size.
    whyItMatters: Employee count is a key scaling signal and necessary for benchmarking revenue-per-head and burn rate against
      similar hardware companies.
    diligencePath: Request current org chart and headcount figure from Oxide management; LinkedIn data can provide a floor
      estimate.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: No ARR, revenue, gross margin, or unit-economics data found in any reviewed source.
    whyItMatters: Hardware companies have cost structures and gross margins that differ materially from SaaS; without revenue
      visibility, assessing burn and runway against the $389 M raised is impossible.
    diligencePath: Request audited financials or management accounts from Oxide; revenue per rack and total racks shipped
      as of June 2026 would anchor the model.
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: deployment-scale
    missingEvidence: Total rack shipments as of February 2026 Series C close are not publicly stated; the last known data
      point (fewer than 20 racks) is from mid-2024.
    whyItMatters: The Series C was justified in part by product-market fit and scaling demand; the actual deployment footprint
      as of the close is relevant to validating that claim.
    diligencePath: Ask management for rack-shipped-and-in-production count as of Q1 2026; cross-reference with customer reference
      calls.
    relatedQuestionRefs:
    - QO016
    - QO004
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: minor
    topic: governance
    missingEvidence: 'Oxide''s full board composition, investor governance rights, observer-seat holders, and executive team
      beyond the two co-founders are not publicly disclosed on the company website or in any reviewed filing.

      '
    whyItMatters: 'Without board and governance transparency, investors cannot assess who controls strategic decisions, exit
      timing, major capital expenditure approvals, or founder override rights after the Series C.

      '
    diligencePath: 'Request capitalization table and governance term sheets from Oxide management; confirm board seat holders
      for Eclipse, USIT, and any other lead-round investors; verify preferred-stock control provisions.

      '
    relatedQuestionRefs:
    - QO001
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: minor
    topic: competitive-landscape
    missingEvidence: No independent analyst or competitive-intelligence report was found that benchmarks Oxide against Dell,
      HPE, Nutanix, or Pure Storage on on-prem cloud appliances.
    whyItMatters: The competitive context shapes how quickly Oxide can grow its customer base and whether incumbents will
      close the feature gap with less vertically-integrated products.
    diligencePath: Commission or source a Gartner/IDC/Forrester evaluation of rack-scale on-prem cloud players; review Dell
      APEX, HPE GreenLake, and Nutanix roadmaps.
    relatedQuestionRefs:
    - QO015
