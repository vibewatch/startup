- id: product-architecture
  title: Product scope, technical architecture, and open-source posture
  body: 'The Oxide Cloud Computer is a physical rack system shipped with all compute, networking, storage, and software already
    integrated. Each rack houses up to 32 first-generation compute sleds or up to 24 second-generation sleds (2nd Gen introduced
    AMD EPYC 9005 Series / Zen 5 processors with DDR5 memory). At full configuration, a single rack delivers up to 7,875 guest
    vCPUs, 30.6 TiB of guest memory, 1.7 PiB of NVMe block storage, and 12.8 Tbit/s of network switching capacity. The switch
    fabric uses an Intel Tofino 2 ASIC delivering 6.4 Tbit/s with 32 downlink and 32 uplink 100 Gbps ports. Power shelves
    (2 per rack, redundant) can deliver up to 21.6 kW in redundant mode. The software stack is almost entirely open-source:
    Hubris (a Rust-based microcontroller OS for service processors and sled management), Helios (an illumos-derived host OS
    for compute sleds), Omicron (the Rust control plane managing virtual machines, networking, and storage), Crucible (a distributed
    NVMe block storage service), and Propolis (a VMM userspace based on illumos bhyve) are all public GitHub repositories
    under the oxidecomputer organization. Developer integration surfaces include a Terraform provider (v0.19.0), a Rust SDK
    and CLI, REST APIs covering all operations, and official support for Kubernetes, Red Hat OpenShift, SUSE Rancher, and
    Prometheus/Grafana monitoring. Setup time from delivery to provisioning is claimed at under two hours — a sharp contrast
    to multi-vendor on-prem which can require weeks. This architecture gives Oxide a differentiated support story: because
    all components come from one vendor and the firmware and software are open-source, customers can verify security properties
    and avoid the finger-pointing that characterizes multi-vendor environments.

    '
