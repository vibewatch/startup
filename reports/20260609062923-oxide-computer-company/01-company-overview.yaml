company:
  name: Oxide Computer Company
chapter:
  number: 1
  title: Company Overview
  summary: 'Oxide Computer Company, founded in 2019 and headquartered in the San Francisco East Bay (Emeryville, California),
    builds and sells the world''s first commercial rack-scale cloud computer — a vertically integrated hardware-and-software
    product delivering public-cloud-style APIs and economics to on-premises data centers. Co-founders Steve Tuck (CEO) and
    Bryan Cantrill (CTO) have raised $389 million across three rounds (Series A $44 M in October 2023, Series B $100 M in
    July 2025, Series C $200 M in February 2026), achieving stated product-market fit with anchor customers including Idaho
    National Laboratory, Lawrence Livermore National Laboratory, Switch, and Jump Trading, while keeping financial and headcount
    disclosures private.

    '
sections:
- id: identity-footprint
  title: Identity, headquarters, and product thesis
  body: 'Oxide Computer Company was founded in 2019 in Emeryville, California — a small city on the eastern shore of San Francisco
    Bay, near Oakland — by Steve Tuck (CEO) and Bryan Cantrill (CTO), both veterans of Sun Microsystems and Joyent with deep
    backgrounds in systems software and hardware architecture. The company''s founding thesis, articulated in its 2019 pitch
    deck and consistently maintained through 2026, is threefold: cloud computing is the future of all computing; on-premises
    ownership is strategically necessary for a large share of enterprises for security, regulatory, latency, and economic
    reasons; and delivering a true cloud experience on-premises requires co-designing hardware and software together from
    the ground up at rack scale. That third leg is the most differentiated claim — rather than software layered onto commodity
    servers from multiple vendors, Oxide integrates compute sleds, networking switches, power shelves, firmware, host OS,
    storage service, hypervisor, and control plane into a single purchasable product shipped as a physical rack. The company''s
    official homepage positions Oxide against two failure modes that enterprises face today: Alto traditional on-prem with
    eight-plus vendors, complex integrations, and finger-pointing support, and the public cloud''s rental model with unpredictable
    billing végül egress fees and sovereignty gaps. Oxide''s positioning as "the cloud you own" targets AI, HPC, mission-critical,
    and general workloads simultaneously. By the run date the product was in its second hardware generation (2nd Gen Sleds
    using AMD EPYC 9005 / Zen 5), and the company was in active manufacturing and customer expansion following its third financing
    round.

    '
