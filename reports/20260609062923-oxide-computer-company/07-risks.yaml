  evidenceGaps:
  - type: missing-source
    severity: material
    topic: legal-exposure
    missingEvidence: An exhaustive litigation, IP, and contract-terms review covering court dockets, patents, export classifications, and customer procurement representations.
    whyItMatters: The public record is good enough to identify procurement and privacy obligations but not good enough to rule out hidden contracting, IP, or enforcement exposure.
    diligencePath: Request outside-counsel memo summarizing litigation, patent, export-classification, and public-sector contracting exposure for the last 24 months.
    relatedQuestionRefs:
    - QR006
    - QR030
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: economics-and-backlog
    missingEvidence: Current rack shipments, backlog, gross margin, cash-conversion cycle, inventory turns, and customer concentration by revenue.
    whyItMatters: These numbers are necessary to distinguish a healthy hardware scale-up from one that merely has strong fundraising and reference accounts.
    diligencePath: Request board materials or CFO bridge showing backlog, shipment cadence, gross margin, inventory, and cash-conversion metrics since the Series B.
    relatedQuestionRefs:
    - QR020
    - QR030
    relatedTableRefs:
    - TR005
  - type: missing-source
    severity: material
    topic: incident-history-and-support-slas
    missingEvidence: Severity-1 incident history, support SLA attainment, replacement-part fill rates, current install-base count, and regional support coverage metrics.
    whyItMatters: A small installed base makes each outage or field miss disproportionately important, but public evidence does not quantify reliability or support performance.
    diligencePath: Request support dashboard excerpts, recent postmortems, and a regional support staffing map with spare-parts coverage.
    relatedQuestionRefs:
    - QR012
    - QR030
    relatedTableRefs:
    - TR002
    - TR004
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-risk-register
    missingEvidence: A counsel-grade legal risk register covering export classifications, privacy addenda, federal terms, and any non-public customer-specific compliance obligations.
    whyItMatters: TR001 is intentionally partial because public evidence cannot exhaustively enumerate legal vectors for a company selling to sovereign and federal buyers.
    diligencePath: Convert the public register into a closed-list legal memo during diligence, then compare it against active customer and channel contracts.
    relatedQuestionRefs:
    - QR006
    - QR030
    relatedTableRefs:
    - TR001
