- id: financial-model-and-kill-criteria
  title: Financial Model Risk, Monitoring, and Kill Criteria
  body: 'The financial-model risk is less about immediate solvency and more about whether public evidence is sufficient to underwrite a hardware business that is clearly preparing for larger scale. Oxide has raised substantial capital in quick succession and says it did not need the money for survival, which lowers near-term financing risk. But the same sources tie the capital to manufacturing expansion, customer support, and long-term independence — all signals that working capital, inventory turns, and customer-ramp timing matter. Without public backlog, margin, or shipment data, it is impossible to tell whether that capital is accelerating a healthy ramp or simply buffering a still-fragile operating model. For investors, the answer is to convert the residual uncertainty into monitorable criteria. The chapter''s trigger table focuses on events that would break the current thesis rather than merely slow it: loss of federal procurement eligibility, persistent severe incidents on the installed
    base, component or field-service problems that stretch delivery beyond acceptable windows, or a financing event that looks like inventory rescue rather than opportunistic scale capital. Those triggers are intentionally operational and external, because Oxide''s published mitigations are plausible but still too qualitative to justify passive trust.'
