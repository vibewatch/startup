- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Federal compliance drift
    - Customer or partner requests new compliance evidence
    - Any failed country-of-origin, Section 889, or procurement-eligibility representation on an active federal pursuit
    - Treat as thesis-break for the federal wedge until legal scope and remediation are independently cleared
  - - Supply-chain / component shock
    - Lead-time, allocation, or redesign warning from a key supplier
    - Any critical component lead time returning to >52 weeks or forcing rack reconfiguration
    - Re-cut delivery assumptions, defer growth underwriting, and request inventory buffer analysis
  - - Severe availability or security incident
    - Public postmortem, customer reference loss, or emergency patch cycle
    - One recurring severity-1 incident affecting production customers, or one material security flaw without timely remediation evidence
    - Pause conviction until postmortem quality, patch cadence, and customer churn impact are known
  - - Field-service capacity miss
    - Support escalation backlog or installation slippage
    - Two or more named deployments slipping because onsite delivery or replacement capacity is unavailable
    - Move from growth underwriting to operations diligence and require staffing proof
  - - Working-capital stress
    - New financing or investor update tied to inventory or support cash needs
    - A financing event framed around inventory rescue, cash conversion, or delayed customer payment rather than planned expansion
    - Treat as thesis-break unless backlog quality and margin bridge are disclosed
  - - Ecosystem / certification slippage
    - Customer asks for compatibility proof beyond current validation
    - Loss of Red Hat validation, major compatibility gap, or channel-partner rollback in a target segment
    - Downgrade enterprise confidence and increase required discount / diligence burden
  - - Key-person disruption
    - Leadership departure or visible re-org at sales or architecture layer
    - Departure of Steve Tuck or Bryan Cantrill without named deputies and transition plan
    - Pause new underwriting until continuity and customer-relationship transfer are evidenced
  - - Disclosure deterioration
    - Management continues to add capital and customers without operating transparency
    - Another major financing or customer-marketing push with no shipment, backlog, or margin disclosure
    - Assume opacity is structural and price the company as a higher-risk hardware buildout
  notes: These thresholds are investment-monitoring triggers rather than covenant-style promises. Each is designed to convert a qualitative concern into a concrete event that would either pause diligence or break the current thesis.
