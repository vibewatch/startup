company:
  name: Oxide Computer Company
chapter:
  number: 7
  title: Risks
  summary: Oxide's main residual risks come from federal procurement eligibility, supply-chain and manufacturing scale, support execution on a still-small installed base, and financial opacity around a capital-intensive hardware model. Public mitigations are real—Carahsoft access, Red Hat validation, open-source auditability, 24x7 support claims, and fresh capital—but the underwritten residual exposure is still constrained by limited shipment, incident, and margin disclosure.
sections:
- id: ranked-risk-landscape
  title: Severity-Ranked Risk Landscape
  body: 'Oxide''s top residual risk is not that the product thesis is incoherent; the evidence instead shows a credible product with a narrow but real wedge whose scaling path is constrained by a few concentrated failure modes. The first is federal-procurement eligibility drift. Oxide is deliberately leaning into public-sector and sovereign-cloud workloads, and its own messaging plus Carahsoft''s packaging make domestic-origin, trade-agreement, and Section 889 screening part of the commercial promise, not an afterthought. If supply-chain substitutions or undocumented components undermine that promise, the company could lose the segment that most cleanly matches its security and sovereignty story. The second ranked cluster is operational: manufacturing, inventory, and support execution. Oxide is still a hardware startup selling a heavy, power-dense rack that must be shipped, installed, serviced onsite, and supported continuously. Public evidence remains thin on current shipment volume, but
    the best independent signal still points to a very small installed base, which means even one delayed expansion, critical outage, or field-service miss can move customer confidence materially. The third cluster is financial-model opacity. Fresh capital and partner validation help, but public sources still do not disclose backlog, gross margin, or current rack count. For an investor, that means mitigations are visible while residual exposure is still only partially underwritten.'
