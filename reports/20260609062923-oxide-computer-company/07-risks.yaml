- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Rule / legal vector
  - Jurisdiction
  - Status
  - Likelihood
  - Severity
  - Mitigation evidence
  - Residual exposure
  - Diligence path
  rows:
  - - Federal procurement eligibility (BAA / TAA / NDAA positioning)
    - United States federal
    - Oxide and Carahsoft publicly claim alignment; FAR rules remain binding gate
    - Medium
    - Critical
    - USA assembly claim, Carahsoft packaging, sovereignty posture
    - Any supplier-origin drift or undocumented component can stall or disqualify deals
    - Request current country-of-origin memo, Section 889 representation pack, and most recent federal compliance attestation
  - - Section 889 covered-equipment screening
    - United States federal
    - Rule is active for covered telecom/video equipment in government contracts
    - Medium
    - High
    - Oxide positions zero external dependencies and secure supply chain
    - Indirect supplier exposure can still enter through components or surveillance gear in facilities
    - Obtain supplier screening workflow, approved-vendor list, and remediation process for covered components
  - - Export-control / EAR licensing for international sovereign deployments
    - United States export control
    - No public export program disclosed; BIS licensing process clearly applies when required
    - Low-Medium
    - High
    - On-prem installations and early U.S. focus reduce immediate exposure
    - International expansion or foreign sovereign customers would require classification and licensing discipline
    - Request ECCN analysis, export-compliance owner, and country-screening workflow
  - - Privacy and enterprise-support data handling
    - Multi-jurisdiction
    - Privacy policy discloses web, recruiting, and enterprise-solution personal data handling
    - Medium
    - Medium
    - Customer workloads remain on customer-owned infrastructure; policy says enterprise data can be handled on customer behalf
    - Support logs, recruiting workflows, and commercial telemetry still create privacy obligations and contracting load
    - Request DPA templates, retention schedule, subprocessors, and support-data segregation controls
  notes: Partial public-only legal register ordered by residual severity. It is not a counsel-grade litigation or IP sweep; it focuses on supportable legal and regulatory vectors that visibly touch Oxide's go-to-market motion.
