      - number: '1.3'
        title: 2025-2026 年里程碑与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >
              资料池中最有力的带日期里程碑，指向运营可信度提升和重大所有权变化。公司及母公司来源称，GoCardless 于 2025 年夏季实现首个 EBITDA 盈利季度，随后在 2026 年 6 月通过 Sequence
              和 Intelligent Billing 扩大嵌入式计费分发，最终于 2026 年 9 月完成 Mollie 交易。这些里程碑 支持规模化和效率提升叙事，但并未消除估值与披露风险。FinTech
              Magazine 报道收购价值为 €1.1bn，而此处审阅的官方公告没有披露交易价格、 清算分配经济条件或交割后治理细节；Akurateco
              的外部指南还提醒，产品仍以银行借记为主，存在卡支付缺口、分层定价以及结算速度慢于卡支付 轨道等问题。
