chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、所有权与已披露运营范围
        blocks:
          - type: paragraph
            body: >
              这批 2026 年证据将 GoCardless 描绘为银行支付专业平台，如今已并入 Mollie，而不再是独立的后期金融科技公司。公司及母公司声明称， Mollie 于 2026 年 9 月 1 日完成收购，保留
              “GoCardless，Mollie 旗下公司” 品牌，并由联合创始人 Hiroki Takeuchi 继续负责该业务， Koen Köppen 则领导更大的合并集团。就产品范围而言，公司当前控制的页面将
              GoCardless 定位在银行支付收款、Pay by Bank 能力和银行账户 数据访问上，而不是覆盖多种支付轨道的广泛结账栈。这一定位在战略上自洽，但本资料池中的官方交易材料仍未披露交易对价、资本结构变化或
              少数股东待遇。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO006
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.2'
        title: 领导层集中度、运营足迹与利益相关方
        blocks:
          - type: paragraph
            body: >
              当前公开材料主要围绕少数几位具名领导者描述 GoCardless。交割后，Hiroki Takeuchi 是明确的运营负责人；Koen Köppen 是 Mollie 集团层面的 决策者；Tom Metcalfe
              则是 GoCardless 在 2026 年合作发布中的最显眼高管。这足以勾勒出基本的公开组织图景，但对治理尽调而言仍然单薄，
              因为资料池没有列出更完整的高管梯队或董事会结构。就足迹和规模而言，GoCardless 仍将自己描述为总部位于英国、在另外五个国家设有办公室的 全球运营商；平台服务超过 100,000 家企业，年处理金额超过
              US$130bn，开放银行连接覆盖英国和欧洲 2,300 多家银行。
