            body: >
              保留的技术证据指向一致的集成模式：商户或软件伙伴通过 API 发起计费或授权请求，为终端客户跳转或嵌入授权流程，再依靠 webhook 和后续出款文件 对账状态变化。独立的 CiviCRM
              扩展文档很有价值，因为它描述了具体事件编排，而不是营销文案：计费请求创建授权流程，客户完成授权设置后 返回商户流程，之后的支付确认和取消通过 webhook
              异步到达。异步设计有利于自动化，但实施方必须正确处理待处理、失败和已出款状态，不能假设 结果立即最终确定。
