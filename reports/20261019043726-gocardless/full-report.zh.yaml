      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开可观察的架构围绕客户授权、API 编排、异步状态更新和下游对账展开。
    data:
      layers:
        - label: 客户支付体验
          detail: 商户会根据紧迫性和复用需求，提供不同的银行支付入口。
          modules:
            - label: 周期性收款
              detail: 基于支付授权的订阅和分期付款。
            - label: 一次性 Direct Debit
              detail: 针对复用授权收取可变金额。
            - label: 银行支付
              detail: 每笔支付单独授权，确认更快。
        - label: 授权与开户
          detail: 资金流动开始前，客户先同意，商户先完成设置。
          modules:
            - label: 账单请求与授权设置
              detail: 通过 API 设置银行借记授权。
            - label: 重定向或嵌入式流程
              detail: 托管页面或合作伙伴原生的计费体验。
          outputs:
            - label: Mandate or authorization record
            - label: Customer and bank-account linkage
        - label: 支付编排与事件
          detail: 商户创建支付指令，并接收异步状态事件。
          modules:
            - label: 支付与订阅创建
              detail: 授权完成后，商户系统发起 API 调用。
            - label: Webhook 处理
              detail: 已确认、失败、取消和已付款状态随后返回。
          outputs:
            - label: Updated billing status
            - label: Retry and exception triggers
        - label: 结算与对账
          detail: 银行支付体系处理完成后，财务团队接收后续付款和支付参考数据。
          modules:
            - label: 付款与账本匹配
              detail: 支付参考信息回溯匹配到发票和客户记录。
          outputs:
            - label: Cash-application visibility
            - label: Finance reconciliation workflow
        - label: 套件扩展路线图
          detail: 收购后的产品扩展在公开表述中是分阶段组合，而不是已经完成的单一平台。
          modules:
            - label: 跨支付轨道套件
              detail: 未来在一个套件中整合银行卡、Pay by Bank、账户和融资。
          outputs:
            - label: Broader product adjacency
        - label: 信任与控制层
          detail: 公开描述的控制措施强调认证、隐私立场和支付回收工具。
          modules:
            - label: ISO 27001 和 GDPR 声明
              detail: 认证和隐私声明是公开营销的控制措施。
            - label: Success+ 与欺诈工具
              detail: 重试和保护工具被描述为提升韧性的附加功能。
          outputs:
            - label: Control baseline for diligence
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE006
      - CE009
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: GoCardless 的采用通常始于计费或银行支付需求，随后扩展到自动化和回收层。
    data:
      items:
        - label: 识别周期性或银行支付需求
          actor: 财务或支付负责人
          channel: 直销或产品驱动评估
          detail: 周期性计费、发票收款或 Pay by Bank 的经济性是主要切入点。
          tone: neutral
        - label: 评估覆盖范围与匹配度
          actor: 财务、资金和支付运营团队
          channel: 产品页面、合作伙伴渠道或平台集成评估
          detail: 买方会测试支付体系覆盖、银行覆盖、地域范围，以及 GoCardless 是补充还是替代银行卡支付流程。
          tone: neutral
        - label: 客户授权 / 付款授权设置
          actor: 最终付款人
          channel: 托管门户或应用内银行授权
          detail: 付款人在商户或平台工作流中授权支付指令或 Pay by Bank 转账。
          tone: positive
        - label: 周期性收款与对账
          actor: 商户财务或收入运营团队
          channel: 直接集成、Sequence 或 Intelligent Billing
          detail: 发票和订阅的收款、状态更新与对账进入财务工作流。
          tone: positive
        - label: 失败支付回收与欺诈工具
          actor: 应收账款和风险团队
          channel: Success+ 与 Protect+ 增购层
          detail: 核心收款上线后，现有客户可以增加支付重试和欺诈工作流。
          tone: positive
        - label: 多支付方式与交叉销售扩展
          actor: 支付运营与支持团队
          channel: 编排、开放银行或收购后的产品套件
          detail: 客户可以扩展到 Pay by Bank、多支付方式栈或集团更广的能力，但银行卡支付仍可能保留在其他供应商处。
          tone: neutral
    claimRefs:
      - CU001
      - CU005
      - CU007
      - CU008
      - CU009
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 公开证据指向四项首要风险：交易完成后的整合治理、商户账户冻结 / 支持摩擦、产品范围限制，以及首次授权带来的现金流延迟。
    data:
      columns:
        - label: 可能性
          note: 对未来 12-18 个月的公开证据判断。
        - label: 剩余严重性
          note: 扣除当前可见缓解措施后的风险敞口。
      rows:
        - label: Mollie 整合与治理
          note: 收购已完成，但运营模式和迁移时间表的公开披露有限。
          values:
            - label: 高
              tone: risk
            - label: 高
              tone: risk
        - label: 合规冻结与支持升级
          note: AML 审查可能暂停账户并冻结资金，而升级处理似乎受到限制。
          values:
            - label: 中
              tone: risk
            - label: 高
              tone: risk
        - label: 结账覆盖缺口
          note: 独立运营的 GoCardless 仍聚焦银行支付，而不包含银行卡支付。
          values:
            - label: 高
              tone: risk
            - label: 中高
              tone: risk
        - label: 首次授权现金流滞后
          note: 新客户收款在进入正常结算节奏前可能需要约七个工作日。
          values:
            - label: 高
              tone: risk
            - label: 中
              tone: risk
        - label: 依赖合作伙伴 / 渠道执行
          note: 嵌入式计费和回收动作依赖交易对手及共同的产品交付。
          values:
            - label: 中
              tone: risk
            - label: 中
              tone: risk
        - label: 合规与支付体系责任委托
          note: 商户依赖 GoCardless 执行直接借记的监管和支付体系义务。
          values:
            - label: 中
              tone: risk
            - label: 中高
              tone: risk
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR011
      - CR012
      - CR015
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 规模和产品验证都有分量，但交易完成后的估值不透明，使结论停留在跟踪，而不是买入。
    data:
      nodes:
        - id: scale
          label: 规模化运营基础
          value: 100,000+ businesses; US$130bn+ annual payment volume
          note: 在 2026 年 6 月分别发布的 GoCardless 合作伙伴公告中反复出现
        - id: expansion
          label: 近期分发扩张
          value: Sequence and Intelligent Billing integrations
          note: 支持深入渗透经常性收入工作流
        - id: profitability
          label: 利润率验证点
          value: First EBITDA-positive quarter in summer 2025
          note: 结果为正，但不足以构成完整的年度质量桥接
        - id: ownership
          label: 所有权重置
          value: Mollie completed the acquisition on 1 September 2026
          note: 估值视角从后期融资轮次转向战略出售经济性
        - id: opacity
          label: 公开价格不透明
          value: Official completion release omits consideration and waterfall details
          note: 独立的出售价格参考仍是重构结果
        - id: call
          label: 建议
          value: Track / medium confidence / high risk
          note: 在评估上行空间前，等待经核实的交易完成后经济数据
      edges:
        - from: scale
          to: expansion
          label: 支持
        - from: expansion
          to: profitability
          label: 有助于支持
        - from: profitability
          to: ownership
          label: 汇入
        - from: ownership
          to: opacity
          label: 但
        - from: opacity
          to: call
          label: 因此
    claimRefs:
      - CV002
      - CV003
      - CV007
      - CV008
      - CV009
      - CV013
