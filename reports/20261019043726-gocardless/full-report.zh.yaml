  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 以客户工作流定义产品范围
        blocks:
          - type: paragraph
            body: >
              公开产品围绕商户如何从银行账户收款，而不是卡收单功能组织。GoCardless 将核心产品定位为覆盖经常性收款、一次性或发票支付、出款、集成和 定制 API
              构建的一体化平台；一次性直接借记文档则区分了授权驱动的收款和每次都需要客户授权的 Pay by Bank 流程。实际工作流中，公司服务
              于财务和计费团队：它们只需设置一次银行支付指令，之后重复用于收费，并把支付事件同步回运营系统，而不是手工核对每笔收款。
