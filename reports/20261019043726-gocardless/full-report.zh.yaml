      - number: '4.3'
        title: 成本结构与资本充足性
        blocks:
          - type: paragraph
            body: >
              公开成本和资本披露明显少于产品与收入披露。公司来源称 FY25 亏损收窄 27%，业务实现首个调整后 EBITDA 盈利季度，但没有公布当前毛利率、 销售效率、烧钱、现金跑道或 Mollie
              交易出售所得。最有力的外部运营参照仍是较早的 Business of Payments 评测，其中提到较高定价、31 bps 费率、显著的员工与合规成本，以及不可忽视的欺诈和失败支付准备。Tracxn 补充称
              GoCardless 已被收购，历史融资额为 USD540m，截至 2026 年 9 月约有 854 名员工，但这些仍不足以判断当前资产负债表承载能力。
