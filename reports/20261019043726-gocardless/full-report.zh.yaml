  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界窄于“所有支付”，但宽于单一英国直接借记
        blocks:
          - type: paragraph
            body: >-
              证据显示，这个市场的核心是银行支付受理：经常性收款、发票驱动的一次性支付和新兴账户间转账，而不是泛化的卡收单。GoCardless 自有页面将平台定位于经常性支付、一次性发票收款、出款、支付追回和 Pay by
              Bank；第三方解读仍认为，产品最适合买方本就预期使用银行账户 支付轨道和授权收款的场景。因此，最相关的替代方案不只是其他直接借记服务商，也包括卡处理商、支付编排层和能减少多支付方式拼接痛苦的计费系统。
            claimRefs:
              - CM001
              - CM004
              - CM007
              - CM017
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM007
              - CM017
      - number: '2.2'
        title: 规模证据具有方向性且由采用率驱动，尚不足以支撑可信的 TAM 拆解
        blocks:
          - type: paragraph
            body: >-
              资料池中最有力的数字证据描述的是市场压力，而不是完整分层的可服务市场。第三方材料显示英国存在庞大的既有卡支付成本池和直接借记基础， GoCardless
              及合作伙伴材料则强调低成本、结算速度和失败支付追回的价值。这足以为经常性收入商户提供一套由采用率驱动的规模测算视角， 但不足以按行业、地域或商户规模拆出清晰的 GoCardless SAM 或
              SOM。因此，市场论证只能作为受证据约束的组合来理解：既有支出、现有银行 借记使用量和买方明确意向。
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
              - CM011
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
              - CM011
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM016
      - number: '2.3'
        title: 买方需求集中在经常性计费、发票自动化和多轨道简化
        blocks:
          - type: paragraph
            body: >-
              资料来源反复指向由财务团队主导的经常性收入工作流，而不是争夺消费者结账入口。Sequence 将一次性发票和经常性计划嵌入 quote-to-cash 软件； Intelligent Billing
              面向拥有复杂经常性模式的电信运营商和 MSP；Akurateco 则认为 GoCardless 最适合订阅、会员、SaaS 计费、专业服务和 B2B 开票。Mollie
              的收购后定位又将买方范围扩展到更大的欧洲企业和 SaaS 平台：它们希望在一个商业关系下同时获得卡、当地支付方式和银行支付， 而不必自行拼接这些轨道。
            claimRefs:
              - CM007
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: 卡支付、国际复杂度和细分层面证据仍是约束
        blocks:
          - type: paragraph
            body: >-
              支持采用的同一批证据也说明，市场并非没有摩擦。第三方仍将 GoCardless 定义为银行借记基础设施，而非完整的卡加银行支付栈，因此许多商户仍需
              第二家服务商或支付编排层。国际收款和供应商出款会增加成本及工作流复杂度，资料池也混用了不同的国家数量口径和收购后定位。更重要的是，
              保留的来源没有提供足够强的独立商户支出、队列转化或垂直收入数据，无法把方向性论点转化为精确的自下而上 SAM 或 SOM。
            claimRefs:
              - CM006
              - CM007
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 市场论点本质上是“多轨道简化”论点
            body: 最有说服力的买方故事不是泛泛的结账增长主张，而是由财务团队主导的案例：经常性银行支付、重试、开票和相邻支付轨道，降低了拼接多家服务商的运营复杂度。
            calloutType: insight
            claimRefs:
              - CM007
              - CM012
              - CM013
              - CM014
              - CM017
          - type: callout
            title: 资料池仍不足以支撑精确 SAM 或 SOM
            body: 保留的来源说明了这一品类为何重要，但没有提供足够强的独立商户支出、队列转化或垂直收入数据，无法为 GoCardless 当前的自下而上市场模型提供投资判断依据。
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合超出直接借记同业
        blocks:
          - type: paragraph
            body: >-
              相关买方选择不只是“另一个直接借记工具”。GoCardless 仍将自己定位为银行支付专家，覆盖经常性直接借记、一次性 Pay by Bank、开放银行验证、
              出款和银行账户数据产品。这个专业化定位对经常性计费和发票收款很重要，但相邻替代方案会从不同角度争夺同一工作流。Airwallex 推出更广的 多方式跨境支付栈；Wise 的替代方案指南将买方引向
              Braintree、Adyen 和 Dwolla 等替代品；Mollie 完成收购后，GoCardless 进入了包含卡支付
              和本地支付方式的更大捆绑式支付平台。现状本身也是竞争者：买方可以继续分别使用卡支付、银行支付、银行服务和融资服务商，承担对账成本， 而不统一到一家服务商。
            claimRefs:
              - CP001
              - CP004
              - CP009
              - CP010
              - CP011
              - CP012
              - CP015
