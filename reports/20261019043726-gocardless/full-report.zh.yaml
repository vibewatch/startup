  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序展望
        blocks:
          - type: paragraph
            body: >-
              风险更多在执行和商户匹配，而非产品是否具有生存价值。公开证据仍显示这是一个集成广泛、覆盖地域广的银行支付平台，但也暴露了聚焦定位的边界： GoCardless 强调 Pay by
              Bank、直接借记和集成，而非卡支付受理；独立评测仍认为它擅长经常性计费，却不适合需要完整结账或首笔收款快速到账的商户。 因此核心论点对客户组合很敏感。如果在 Mollie
              合并产品完成运营统一前，GoCardless 赢得更多需要卡加银行混合支付栈的商户，产品窄化可能推高流失、
              增加集成负担或限制扩张。可监测的失效标准包括交割后整合导致商户受扰、账户冻结投诉反复出现，或重要新细分仍需第三方卡轨道且没有清晰的捆绑路线图。
