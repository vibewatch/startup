      - number: '3.3'
        title: 壁垒来自实施杠杆和信任，而非排他性
        blocks:
          - type: paragraph
            body: >-
              保留来源显示，GoCardless 的持久优势是实施杠杆，而非硬性排他。公司宣传拥有 350 多项集成和 API 集成；Great Partners 称这些连接器让采用
              变成已有目录可直接接入的“应用商店式连接”；2026 年 6 月的合作发布也显示 GoCardless 直接嵌入 quote-to-cash 及电信 / MSP 计费工作流。 FCA
              授权同样有助于赢得重视信任的买方。这些确实构成切换摩擦，但并非不可攻破：买方仍可多家并用，Mollie 收购后的平台也能通过加入卡和
              本地支付方式回应“只有银行支付”的质疑，而不必立即改变现有合同。仍缺少的是企业级证据：实际折扣、交割后的打包设计，以及能量化这些集成 入口是否转化为持久定价权的真实赢单 / 输单或流失数据。
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP006
              - CP012
              - CP014
              - CP015
