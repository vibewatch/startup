      - number: '4.2'
        title: 定价、分发与变现质量
        blocks:
          - type: paragraph
            body: >
              当前最清晰的变现逻辑是：GoCardless 在客户计费工作流内实现支付收款变现，再以附加产品和嵌入式合作伙伴强化核心业务。官方来源强调 Sequence 和 Intelligent Billing
              集成，把支付授权与收款移入 quote-to-cash 或计费系统；当前网站文案则强调更快结算、更低卡支付成本和追回自动化， 而非透明的公开价目表。因此，独立定价证据已经过时：资料池中最好的外部参照是 2022
              年分析，显示交易费加月度承诺商户费；它仍有背景价值， 但太旧，不能在没有直接尽调的情况下用于判断当前实际定价。
            claimRefs:
              - CI002
              - CI007
              - CI008
              - CI013
          - type: table
            tableRef: TI002
