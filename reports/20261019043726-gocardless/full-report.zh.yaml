              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: 在交割后经济条件和治理可验证前保持跟踪
        blocks:
          - type: paragraph
            body: >-
              建议是跟踪，而不是买入，因为业务的产品市场证据足以支持持续观察，却没有足够的价格透明度，无法以已确认的入场基础为上行空间作投资判断。 如果买方能以接近已报道出售区间的价格获得敞口，并确认治理权、少数股东保护以及
              EBITDA 盈利季度已变得可重复，可以重新考虑立场。否则， 下行风险在于投资者锚定 2022 年独角兽估值，尽管最新公开事件是经济条件未披露的战略收购。最有价值的尽调问题包括确切对价构成和清算分配、
              交割后董事会及报告结构、FY26 收入质量和现金生成，以及整合优先级在 Mollie 内调整后可能变得重要的客户或伙伴集中度。论点失效触发条件是
              交割后仍持续不透明、出现整合扰动证据，或证明已报道的出售背景明显低估了非控制权持有人的稀释或优先权损失。
            claimRefs:
              - CV007
              - CV009
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: 展示
        blocks:
          - type: callout
            title: 建议
            body: 在投资者能够验证已完成 Mollie 交易的实际经济条件和交割后盈利的持久性之前，将 GoCardless 保留在跟踪名单上，而不是从 2022 年私募轮次外推。
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV009
              - CV013
