  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开市场表现
        blocks:
          - type: paragraph
            body: >
              公开证据支持 GoCardless 是银行支付基础设施业务，而非纯软件订阅商。公司当前将经常性直接借记收款、即时 Pay by Bank、出款、失败支付追回 和银行账户数据服务作为一个平台；FY25
              更新将这套产品与 GBP160.9m 集团营业额和 GBP79.2bn 处理支付额联系起来。同一批材料将合作伙伴签约、
              续约和更广工作流覆盖列为增长驱动，因此投资判断必须把活动规模与变现质量分开，因为公开来源没有披露不同支付轨道、附加产品、地域或客户 队列的贡献。
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI006
          - type: table
            tableRef: TI001
            claimRefs:
