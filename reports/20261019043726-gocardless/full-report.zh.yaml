        title: 展示
        blocks:
          - type: callout
            title: 原生计费嵌入是最站得住脚的卖点
            body: 保留证据中最强的差异化不是拥有支付轨道本身，而是凭借预构建集成和合作伙伴嵌入，直接进入 quote-to-cash、电信、MSP 和会计工作流。
            calloutType: insight
