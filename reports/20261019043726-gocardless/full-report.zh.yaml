              100,000 多家企业在使用平台；开放银行材料则强调可访问 100 多家英国主要银行以及约 99% 的消费者和企业账户。合作伙伴案例进一步明确了这一点：Sequence 将 GoCardless 放进
              quote-to-cash 和计费自动化，服务一次性发票及经常性订阅； Intelligent Billing 则将其放入电信和 MSP 计费运营。Akurateco 的独立指南方向一致，认为
