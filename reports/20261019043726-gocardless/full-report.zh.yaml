      - number: '4.4'
        title: 财务结论与阻碍
        blocks:
          - type: paragraph
            body: >
              公开证据支持这样一家企业：规模真实、支付工作流在扩展，也有改善运营杠杆的合理路径，但还不是清晰的投资判断案例。GoCardless 似乎已从 2022 年严重亏损状态走向 FY25
              盈利改善，合作伙伴嵌入式工作流分发也可能带来持久使用；然而实际定价、客户队列留存、客户集中度和收购后流动性
              仍有重大缺口。因此，财务尽调应将公开收入和规模声明视为方向上积极，但对利润率构成、合同经济条件及控制权变更后的资本充足性保持条件性判断。
