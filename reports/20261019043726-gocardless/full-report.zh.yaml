      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 整合扩大了 Mollie 现有客户基础的分发范围，EBITDA 为正的季度持续出现，且披露的经济数据表明偏好泄漏很少。
        - 上行空间将体现在 Mollie 内部；公开证据不足以支持 GoCardless 独立估值区间。
        - 在更大平台内部执行复杂，产品焦点也可能被稀释。
        - 需要交易完成后的披露，以及早期交叉销售或利润率证据。
      - - 基准
        - GoCardless 仍具战略重要性，但外部投资者只能获得与已完成出售背景和部分协同落地相符的可见度。
        - Multiples 报道的 $1.2B 价格只能作为暂定交易参考，不能视为已核实的对价或当前入场价格。
        - 公开披露仍然稀薄，导致上行空间评估缓慢且零散。
        - 最符合当前证据集。
      - - 悲观
        - 整合停滞、治理持续不透明，或少数持有人最终实现的收益明显差于交易传闻所暗示的水平。
        - 一旦弄清分配瀑布和控制权经济，实际实现价值低于报道的战略出售区间。
        - 没有公开交易时间表，且可能出现集中度或商业化进度滑坡。
        - 如果交易完成后仍然不透明，或运营指标走弱，这一情景的可能性会提高。
    notes: 情景区间是定性的，因为公开渠道没有官方的交易完成后对价金额、分配瀑布或当前独立 FY26 财务报告包。
