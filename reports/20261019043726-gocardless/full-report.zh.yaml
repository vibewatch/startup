companyProfile:
  summary: >-
    GoCardless 是一家总部位于伦敦的银行支付平台，随着 2026 年 9 月收购交割，如今已并入 Mollie 运营。它提供直接借记、Pay by Bank 和银行账户数据能力，服务于经常性计费、一次性收款和支付追回，并通过
    API 及合作伙伴工作流分发。公开记录显示其覆盖面广、盈利能力改善， 但交易经济条件、交割后治理和独立财务披露仍部分不透明。
