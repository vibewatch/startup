          label: 收入捕获
          value: Transaction fees plus monthly committed-merchant fees
          note: 当前公开证据池确认了现有价值主张，但最清晰的明确变现代理指标仍是 2022 年外部定价分析。
          claimRefs:
            - CI007
            - CI008
            - CI009
        - id: economics
          label: 毛利与现金结果
          value: Margin path improving, capital data still opaque
          note: FY25 盈利能力改善，但当前毛利率、现金、资金续航和出售所得仍未披露。
          claimRefs:
            - CI005
            - CI010
            - CI012
    approximationNotes: 这张流程图综合了已披露的工作流阶段和变现代理指标；它是概念性的，而非按价值比例桥接，因为公开来源没有提供完整的当前利润率分配瀑布。
    claimRefs:
