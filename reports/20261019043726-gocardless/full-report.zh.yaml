    rows:
      - - 多方
        - 100,000+ 家企业、30+ 个国家，以及 US$130bn+ 的年支付量，证明产品已有真实的规模化使用。
        - 交易完成后的支付量持续增长，并披露经审计的留存率或利润率，将增强投资确信。
      - - 多方
        - Sequence 和 Intelligent Billing 的集成显示，GoCardless 正更深地嵌入经常性收入工作流。
        - 若有证据表明这些渠道显著扩大了企业客户占比或改善了净收入质量，上行空间的确信度会提高。
      - - 空方
        - 最近一次官方所有权事件是一笔已完成的出售，但对价和治理条款均未披露。
        - 若披露收购价格、股权表分配瀑布和交易完成后的报告包，估值不确定性会下降。
      - - 空方
        - 较早的独立资料仍在重复自报或交易前的过时指标，因此可比数据噪声很大。
        - 新的经审计或经管理层认证的 FY26 收入、EBITDA、流失率和集中度数据，会让情景分析更可靠。
    notes: 这些论点总结了最重要、可用于投资判断的正面和负面因素；它们权重并不相同，应与情景表一并阅读。
