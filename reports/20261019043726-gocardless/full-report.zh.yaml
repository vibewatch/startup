      - number: '3.2'
        title: 广度型竞争者在支付方式和打包方案上挑战 GoCardless
        blocks:
          - type: paragraph
            body: >-
              保留的公开定价和对比页面呈现出一致取舍：GoCardless 按聚焦型银行支付产品定价，而竞争对手以更广的支付方式覆盖切入。Airwallex 的对比页称， GoCardless 标准价为每笔 1% 加
              £0.20、最高 £4，但自身支持 160 多种支付方式和更广的国家覆盖。Pinch 的对比页进一步显示，GoCardless 不提供线上信用卡受理，而两家都支持直接借记和 API。Wise 的替代方案指南也突出
              Braintree 等同时支持经常性计费、卡、钱包和 ACH 直接借记 的替代品。因此，GoCardless
              在聚焦的银行支付场景中占优，但当买方需要更广的结账能力、钱包受理或一家服务商同时覆盖卡支付和账户间转账时， 更容易被替代。
            claimRefs:
              - CP007
              - CP008
