          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR011
              - CR012
              - CR015
      - number: '7.2'
        title: Regulatory, legal, and governance risk
        blocks:
          - type: paragraph
            body: >-
              The public record supports a regulated operating posture but not a fully de-risked governance picture.
              GoCardless and third-party reviewers both point to FCA oversight, GDPR-aware operations, and the company's
              role in handling Direct Debit compliance on behalf of merchants, which lowers onboarding complexity but
              also concentrates compliance and scheme-execution responsibility inside the platform. The more material
              current legal-governance risk is post-acquisition opacity: Mollie says the acquisition is completed, no
              immediate changes are planned, and integration will be phased, but public materials do not yet spell out
              post-close governance rights, data-sharing mechanics, or when combined card-plus-bank packaging becomes
              generally available. The practical diligence path is to obtain post-close org charts, board and
              delegated-risk ownership, data-sharing controls, and any revised contractual or scheme-liability terms.
            claimRefs:
              - CR002
              - CR008
              - CR011
              - CR012
              - CR017
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR007
              - CR008
              - CR011
              - CR012
              - CR017
      - number: '7.3'
        title: Operational, partner, and financial exposure
        blocks:
          - type: paragraph
            body: >-
              Operationally, the biggest public red flags are not catastrophic outages but merchant working-capital
              friction and support escalation when compliance reviews intervene. Independent reviews describe slow
              payout timing, first-mandate holds, and account suspensions during AML reviews, while GoCardless's own
              materials market faster one- off Pay by Bank settlement and automated recovery tooling rather than
              claiming those frictions disappear for all use cases. Partner reliance is also visible in the 2026 push
              into embedded billing: integrations with Sequence and Intelligent Billing deepen workflow stickiness and
              can improve failed-payment recovery, but they also make roadmap delivery and merchant experience partly
              dependent on partner execution. Financial-model risk remains a diligence gap rather than a quantified
              public failure: Mollie disclosed that GoCardless had its first EBITDA-positive quarter in summer 2025, but
              there is still no public FY26 cash-generation, margin, or concentration disclosure sufficient to
              underwrite downside with precision.
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR009
              - CR010
              - CR018
          - type: table
            tableRef: TR003
            claimRefs:
