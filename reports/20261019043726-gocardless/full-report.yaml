              - CP015
              - CP016
      - number: '3.2'
        title: Breadth competitors challenge GoCardless on payment methods and packaging
        blocks:
          - type: paragraph
            body: >-
              The retained public pricing and comparison pages imply a consistent trade: GoCardless is priced as a
              focused bank-payments product, while rivals use broader payment-method coverage as their wedge.
              Airwallex's comparison page cites GoCardless list pricing at 1% plus £0.20 per transaction capped at £4,
              but pairs that against 160+ payment methods and wider country coverage. Pinch's comparison page makes the
              contrast starker by marking GoCardless as unavailable for online credit-card acceptance while both vendors
              support direct debit and APIs. Wise's alternatives guide similarly highlights substitutes such as
              Braintree that combine recurring billing with cards, wallets, and ACH direct debit. That means GoCardless
              wins on focused bank-payment use cases, but is easier to displace when a buyer wants checkout breadth,
              wallet acceptance, or a single vendor for both card and account-to-account flows.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP013
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP008
              - CP009
              - CP011
              - CP012
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP011
              - CP013
      - number: '3.3'
        title: The moat is implementation leverage and trust, not exclusivity
        blocks:
          - type: paragraph
            body: >-
              GoCardless's durable edge in the retained sources is implementation leverage rather than hard exclusivity.
              The company advertises 350+ integrations and API integrations, Great Partners describes those connectors
              as reducing adoption to an "app-store-style connection" where listings already exist, and June 2026
              partnership releases show GoCardless embedding directly into quote-to-cash and telecom/MSP billing
              workflows. FCA authorisation also matters for trust-sensitive buyers. Those are real switching frictions,
              but they are not unassailable: buyers can still multi-home, and the post-Mollie platform can answer the
              "bank-only" objection by adding cards and local methods without changing current contracts immediately.
              What remains missing is the enterprise-level proof: realised discounting, post-close bundle design, and
              actual win/loss or churn data that would quantify whether these integration hooks translate into durable
              pricing power.
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP006
              - CP012
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Native billing embeds are the most defensible part of the offer
            body: >-
              The strongest retained differentiation is not raw payment-rail ownership but the ability to sit inside
              quote-to-cash, telecom, MSP, and accounting workflows through pre-built integrations and partner embeds.
            calloutType: insight
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP014
          - type: callout
            title: Breadth competitors can collapse the "bank-only" wedge
            body: >-
              Where buyers want cards, wallets, broader geography, or one-provider consolidation, GoCardless's focused
              bank-payment scope becomes easier to replace or subordinate inside a larger bundle.
            calloutType: risk
            claimRefs:
              - CP009
              - CP011
              - CP012
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >
              Public evidence supports GoCardless as a bank-payments infrastructure business rather than a pure software
              subscription vendor. The company currently presents recurring Direct Debit collection, instant
              pay-by-bank, outbound payouts, failed-payment recovery, and bank-account data services as one platform,
              while its FY25 update ties that product stack to GBP160.9m of group turnover and GBP79.2bn of processed
              payments. The same materials position partner signings, renewals, and broader workflow coverage as growth
              drivers, which means underwriting must separate activity volume from monetization quality because the
              public sources do not disclose contribution by rail, add-on, geography, or customer cohort.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI006
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI006
