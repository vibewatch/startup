  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Publicly observable architecture centers on customer authorization, API orchestration, asynchronous status updates
      and downstream reconciliation.
    data:
      layers:
        - label: Customer payment experiences
          detail: Merchants expose different bank-payment entry points depending on urgency and reuse.
          modules:
            - label: Recurring collections
              detail: Mandate-based subscriptions and instalments.
            - label: One-off Direct Debit
              detail: Variable charges collected against a reused mandate.
            - label: Pay by Bank
              detail: Per-payment authorization with faster confirmation.
        - label: Authorization and onboarding
          detail: Customer consent and merchant setup happen before money movement begins.
          modules:
            - label: Billing requests and mandate setup
              detail: API-led setup for bank-debit authority.
            - label: Redirect or embedded flows
              detail: Hosted pages or partner-native billing experiences.
          outputs:
            - label: Mandate or authorization record
            - label: Customer and bank-account linkage
        - label: Payment orchestration and eventing
          detail: Merchants create payment instructions and consume asynchronous status events.
          modules:
            - label: Payment and subscription creation
              detail: Merchant systems issue API calls after authorization.
            - label: Webhook processing
              detail: Confirmed, failed, cancelled and paid-out states return later.
          outputs:
            - label: Updated billing status
            - label: Retry and exception triggers
        - label: Settlement and reconciliation
          detail: Finance teams consume later payout and payment-reference data after bank-scheme processing completes.
          modules:
            - label: Payout and ledger matching
              detail: Payment references reconcile back to invoices and customer records.
          outputs:
            - label: Cash-application visibility
            - label: Finance reconciliation workflow
        - label: Suite expansion roadmap
          detail: >-
            Post-acquisition product expansion is publicly framed as a phased combination rather than a finished single
            platform.
          modules:
            - label: Cross-rail bundle
              detail: Cards, pay by bank, accounts and financing in one future suite.
          outputs:
            - label: Broader product adjacency
        - label: Trust and control layer
          detail: Publicly described controls emphasize certification, privacy posture and payment-recovery tooling.
          modules:
            - label: ISO 27001 and GDPR claims
              detail: Certification and privacy statements are publicly marketed controls.
            - label: Success+ and fraud tooling
              detail: Retry and protection tooling are described as add-on resilience features.
          outputs:
            - label: Control baseline for diligence
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE006
      - CE009
      - CE010
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      GoCardless adoption typically starts with a billing or bank-payment need, then expands into automation and
      recovery layers.
    data:
      items:
        - label: Identify recurring or bank-payment need
          actor: Finance or payments owner
          channel: Direct sales or product-led evaluation
          detail: Recurring billing, invoice collection, or pay-by-bank economics are the main entry points.
          tone: neutral
        - label: Evaluate coverage and fit
          actor: Finance, treasury, and payments operations
          channel: Product page, partner channel, or platform integration review
          detail: >-
            Buyers test scheme reach, bank coverage, geography, and whether GoCardless complements or replaces card
            flows.
          tone: neutral
        - label: Customer mandate / authorization setup
          actor: End payer
          channel: Hosted portal or in-app banking authorization
          detail: Payers authorize mandates or pay-by-bank transfers within the merchant or platform workflow.
          tone: positive
        - label: Recurring collection and reconciliation
          actor: Merchant finance or revenue operations team
          channel: Direct integration, Sequence, or Intelligent Billing
          detail: Collections, status updates, and reconciliation move into finance workflows for invoices and subscriptions.
          tone: positive
        - label: Failed-payment recovery and fraud tooling
          actor: AR and risk teams
          channel: Success+ and Protect+ upsell layer
          detail: Existing customers can add payment retry and fraud workflows after core collection is live.
          tone: positive
        - label: Multi-method and cross-sell expansion
          actor: Payments operations and support
          channel: Orchestration, open banking, or post-acquisition product bundle
          detail: >-
            Accounts can expand into pay-by-bank, multi-method stacks, or wider group capabilities, but may still keep
            cards elsewhere.
          tone: neutral
    claimRefs:
