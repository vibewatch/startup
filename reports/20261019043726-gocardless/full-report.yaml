      - number: '6.2'
        title: >-
          Adoption proof exists through scale claims, partner launches, and named testimonials, but most proof remains
          company-curated
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption signals in the pool are scale claims repeated across multiple official surfaces and
              named customer proof published on GoCardless's own site. GoCardless repeats the 100,000+ business and
              $130bn+ annual payments claims on its homepage and June 2026 partner announcements, while Wikipedia echoes
              the same footprint at a one-year lag. Named proof is more specific than a logo wall: DocuSign says
              customers convert better where GoCardless is offered, JustGiving reports a 70-80% reduction in cost per
              payment plus higher conversion for Pay by Bank, and Sage describes major reductions in payment-chasing
              labor. Sequence and Intelligent Billing add channel proof that GoCardless is embedded in adjacent billing
              platforms aimed at SaaS, telecom, and MSP finance teams. The chapter can therefore verify live deployment
              narratives and credible land-and-expand surfaces, but not independent denominators for active accounts,
              payment volume by customer tier, or the share of adoption driven by partners versus direct sales.
            claimRefs:
              - CU002
              - CU003
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
