      - number: '1.3'
        title: 2025-2026 milestones and remaining diligence gaps
        blocks:
          - type: paragraph
            body: >
              The strongest dated milestones in the assigned pool point to improving operating credibility and a major
              ownership change. Company and parent sources say GoCardless reached its first EBITDA-positive quarter in
              summer 2025, then spent June 2026 broadening embedded billing distribution through Sequence and
              Intelligent Billing before closing the Mollie transaction in September 2026. Those milestones support a
              scale-and-efficiency narrative, but they do not remove valuation and disclosure risk. FinTech Magazine
              reports a €1.1bn acquisition value, while the official announcements reviewed here omit transaction price,
              waterfall economics, and post-close governance detail; Akurateco's external guide also reminds readers
              that the product remains bank-debit led, with card gaps, layered pricing, and slower settlement than card
              rails.
