chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, ownership, and disclosed operating scope
        blocks:
          - type: paragraph
            body: >
              The assigned 2026 evidence depicts GoCardless as a bank-payments specialist that now sits inside Mollie
              rather than as an independent late-stage fintech. Company and parent statements say Mollie completed the
              acquisition on 1 September 2026, kept the brand alive as "GoCardless, a Mollie company," and left
              co-founder Hiroki Takeuchi running the unit while Koen Köppen leads the broader combined group. On product
              scope, current company-controlled pages position GoCardless around bank-payment collection, pay-by-bank
              capabilities, and bank-account-data access rather than around a broad multi-rail checkout stack. That
              identity is strategically coherent, but official deal materials in this pool still stop short of
              disclosing transaction consideration, capital structure changes, or minority-holder treatment.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO006
              - CO007
