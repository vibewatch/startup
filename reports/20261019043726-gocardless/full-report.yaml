  - id: FM001
    title: Evidence-constrained market sizing lens
    type: pyramid
    summary: >-
      The assigned pool supports a layered adoption case built from incumbent card economics, existing debit behavior,
      and survey intent, but not a uniform TAM/SAM/SOM stack.
    data:
      items:
        - label: UK retail spending still concentrated on cards
          displayValue: 84%
          unit: of UK retail spending by turnover
          note: Incumbent baseline from UKPI framing cited by The Fintech Times.
          tone: neutral
        - label: Annual UK merchant card-fee pool
          displayValue: £1.5bn
          unit: annual transaction fees
          note: Cost pool cited by The Fintech Times; not equivalent to GoCardless revenue.
          tone: neutral
        - label: Existing Bacs direct debit base
          displayValue: 4.8bn
          unit: payments per year
          note: WorldFirst's UK scheme-volume lens shows a large recurring-debit habit base.
          tone: positive
        - label: Merchants expecting lower payment overhead
          displayValue: 91%
          unit: of surveyed corporate decision-makers
          note: Opinium research reported in The Fintech Times.
          tone: positive
        - label: Merchants planning early adoption
          displayValue: 49%
          unit: of surveyed businesses
          note: Intent metric rather than observed rollout.
          tone: positive
        - label: Gen Z openness to recurring bank payouts
          displayValue: 60%
          unit: vs 38% among general consumers
          note: Consumer willingness signal, not merchant budget.
          tone: positive
    approximationNotes: >-
      Layers deliberately mix scheme volume, fee-pool, and survey-intent measures because the assigned evidence does not
      support a defensible same-unit TAM/SAM/SOM model. Values match the retained sources but should be read as
      directional market signals, not additive market size.
    claimRefs:
      - CM008
      - CM009
      - CM010
      - CM016
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      GoCardless sits high on implementation leverage but lower on payment-stack breadth than full-stack rivals and the
      combined Mollie platform.
    data:
      xAxis:
        label: Payment-stack breadth
        min: 1
        max: 5
        lowLabel: Narrow bank-only scope
        highLabel: Full multi-method / finance stack
      yAxis:
        label: Distribution / implementation leverage
        min: 1
        max: 5
        lowLabel: Fragmented or custom-heavy
        highLabel: Strong embedded / channel leverage
      points:
        - label: GoCardless
          x: 2
          'y': 4
          note: Bank-payment specialist with 350+ integrations and billing embeds.
        - label: Airwallex
          x: 5
          'y': 3
          note: Broader method and geography coverage, but weaker retained evidence on recurring debit embeds.
        - label: Braintree
          x: 4
          'y': 2
          note: Broad checkout and ACH mix for app/web merchants, with less retained evidence of ecosystem distribution.
        - label: Pinch Payments
          x: 3
          'y': 3
          note: Regional alternative combining direct debit, cards, and service-led onboarding.
        - label: Mollie + GoCardless
          x: 5
          'y': 4
          note: Combined platform breadth plus GoCardless bank-payment assets, but roadmap still phased.
        - label: Fragmented provider stack
          x: 4
          'y': 1
          note: High breadth by stitching vendors together, but lowest consolidation and reconciliation leverage.
    approximationNotes: >-
      Axes use evidence-backed ordinal 1-5 scoring derived from retained product scope, integration surfaces, and
