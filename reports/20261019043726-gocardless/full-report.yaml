              - CR010
              - CR011
              - CR012
              - CR018
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers
            body: >-
              The risk case worsens materially if Mollie integration forces contract or service disruption, if
              merchant-hold complaints become a recurring public pattern, or if GoCardless still lacks a broadly
              available bundled card-plus-bank proposition after the combined platform has had time to execute
              post-close.
            calloutType: risk
            claimRefs:
              - CR007
              - CR011
              - CR012
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price support is real, but the public valuation anchor is stale
        blocks:
          - type: paragraph
            body: >-
              Public valuation context now rests on two different anchors that should not be blended into a false
              precision number. Independent market-data pages still point back to the February 2022 Series G, when
              Multiples and Silicon Valley Invest Club both place GoCardless at roughly a $2.1 billion valuation, while
              Seedtable still records the last funding date as 1 February 2022. Since then, the decisive corporate event
              is Mollie's 1 September 2026 completion of the acquisition, which moves the underwriting frame from
              venture-mark appreciation to realized strategic-sale economics. The problem is that the post-close
              official release confirms control and strategic rationale, but not purchase consideration, waterfall
              terms, minority-holder treatment, or any updated standalone mark. Multiples fills some of that gap with an
              estimated roughly $1.2 billion sale context and a 7.1x revenue multiple, yet that remains a third-party
              reconstruction rather than a disclosed final transaction schedule. The right reading is therefore not that
              GoCardless is cheaply available versus a four-year-old private round, but that investors lack verified
              price formation for the current ownership structure.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV009
              - CV011
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV008
              - CV009
              - CV013
      - number: '8.2'
        title: Operating proof supports interest, while opacity caps conviction
        blocks:
          - type: paragraph
            body: >-
              The positive side of the case is not hypothetical. Two separate June 2026 GoCardless partner releases
              repeat that the platform serves more than 100,000 businesses, processes more than US$130 billion annually,
              and operates across more than 30 countries, while also showing new distribution in embedded billing and
              telecom-focused recurring-revenue workflows. Mollie adds a useful profitability datapoint by saying
              GoCardless recorded its first EBITDA-positive quarter in summer 2025, which suggests that scale is no
              longer purely volume without operating leverage. The anti-thesis is equally important: several independent
              pages still rely on stale funding-round data, while the company-voiced profile reposted by Startups.RIP
              still carries the older 75,000-business and $30 billion annual-volume figures instead of the newer company
              figures. Because the latest official completion notice omits transaction economics and the independent
              sale-price references are third-party estimates rather than official transaction disclosure, scenario work
              should stay directional and price-disciplined rather than pretending the evidence can support a clean
              fair-value point estimate.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: Track until post-close economics and governance are verifiable
        blocks:
          - type: paragraph
            body: >-
              The recommendation is Track, not Buy, because the business has enough product-market proof to warrant
              continued monitoring but not enough price transparency to justify underwriting upside against a confirmed
              entry basis. A buyer who can access exposure near the reported sale range with clear governance rights,
              minority protections, and evidence that EBITDA-positive quarters have become repeatable could revisit the
              stance. Without that, the downside is that investors anchor on the 2022 unicorn mark even though the
              latest public event is a strategic acquisition with undisclosed realized economics. The highest-value
              diligence asks are the exact consideration mix and waterfall, post-close board and reporting structure,
              FY26 revenue quality and cash generation, and customer or partner concentration that could matter if
              integration priorities shift inside Mollie. Thesis-break triggers are continued opacity after close,
              evidence of integration disruption, or proof that the reported sale context materially understates
              dilution or preference leakage for non-control holders.
            claimRefs:
              - CV007
              - CV009
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Keep GoCardless on a Track list until investors can verify the realized economics of the completed Mollie
              transaction and the durability of post-close profitability rather than extrapolating from the 2022 private
              round.
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV009
              - CV013
