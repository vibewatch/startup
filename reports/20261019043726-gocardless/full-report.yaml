  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary is narrower than "all payments" but broader than UK direct debit alone
        blocks:
          - type: paragraph
            body: >-
              The evidence points to a market boundary centered on bank-based payment acceptance for recurring
              collections, invoice-led one-off payments, and newer account-to-account flows rather than generic card
              acquiring. GoCardless's own surfaces position the platform around recurring payments, one-off invoice
              collection, outbound payments, payment recovery, and Pay by Bank, while third-party explainers still
              describe a product that is strongest where buyers already expect bank-account rails and mandate-based
              collection. That means the most relevant substitutes are not only other direct debit providers, but also
              card processors, orchestration layers, and billing systems that reduce the pain of stitching multiple
              payment methods together.
            claimRefs:
              - CM001
              - CM004
              - CM007
              - CM017
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM007
              - CM017
      - number: '2.2'
        title: Sizing evidence is directional and adoption-led rather than a defensible TAM waterfall
        blocks:
          - type: paragraph
            body: >-
              The strongest numeric evidence in the pool describes market pressure, not a fully segmented addressable
              market. Third-party materials show a large incumbent card-cost pool in the UK and a large existing direct
              debit base, while GoCardless and partner materials emphasize the value of lower cost, settlement speed,
              and failed-payment recovery. That is enough to support an adoption-led sizing lens for recurring revenue
              merchants, but not enough to isolate a clean GoCardless SAM or SOM by vertical, geography, or merchant
              size. The market case is therefore credible only as an evidence-constrained stack of incumbent spend,
              existing bank-debit usage, and stated buyer intent.
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
              - CM011
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
              - CM011
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM016
      - number: '2.3'
        title: Buyer pull is concentrated in recurring billing, invoice automation, and multi-rail simplification
        blocks:
          - type: paragraph
            body: >-
              The assigned sources repeatedly point to finance-led recurring-revenue workflows rather than a consumer
              checkout land-grab. Sequence's integration targets one-off invoices and recurring schedules inside
              quote-to-cash software, Intelligent Billing targets telecom operators and MSPs with complex recurring
              models, and Akurateco places GoCardless most naturally in subscriptions, memberships, SaaS billing,
              professional services, and B2B invoicing. Mollie's post-acquisition framing extends that buyer map toward
              larger European enterprises and SaaS platforms that want cards, local methods, and bank payments under one
              commercial relationship instead of stitching those rails together themselves.
            claimRefs:
              - CM007
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: Constraints remain around cards, international complexity, and segment-level proof
        blocks:
          - type: paragraph
            body: >-
              The same evidence that supports adoption also shows why the market should not be treated as frictionless.
              GoCardless is still framed by third parties as bank-debit infrastructure rather than a full card-plus-bank
              payments stack, so many merchants need a second provider or an orchestration layer. International
              collections and supplier payouts introduce additional cost and workflow complexity, and the evidence pool
              mixes different country-count definitions and post-acquisition framing. Most importantly, none of the
              retained sources provides independent merchant-spend, cohort-conversion, or vertical revenue data strong
              enough to convert the directional thesis into a precise bottom-up SAM or SOM.
            claimRefs:
              - CM006
              - CM007
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The market thesis is really a "multi-rail simplification" thesis
            body: >-
              The most compelling buyer stories are not generic checkout growth claims; they are finance-led cases where
              recurring bank payments, retries, invoicing, and adjacent rails reduce operational complexity versus
              stitching together several providers.
            calloutType: insight
            claimRefs:
              - CM007
              - CM012
              - CM013
              - CM014
              - CM017
          - type: callout
            title: The evidence pool still cannot defend a precise SAM or SOM
            body: >-
              The retained sources show why the category matters, but they do not provide independent merchant-spend,
              cohort conversion, or vertical revenue data strong enough to underwrite a bottom-up market model for
              GoCardless today.
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set extends beyond direct-debit peers
        blocks:
          - type: paragraph
            body: >-
              The relevant buying set is broader than "another direct-debit tool." GoCardless still presents itself as a
              bank-payments specialist, spanning recurring direct debit, one-off pay-by-bank, open-banking verification,
              payouts, and bank-account-data products. That specialization matters for recurring billing and invoice
              collection, but adjacent substitutes attack the same workflow from different angles. Airwallex markets a
              much broader multi-method and cross-border stack, Wise's alternatives guide points buyers toward
              substitutes such as Braintree, Adyen, and Dwolla, and Mollie's completed acquisition moves GoCardless into
              a larger bundled payments platform with cards and local methods. The status quo is also a competitor:
              buyers can keep separate providers for cards, bank payments, banking, and financing, accepting
              reconciliation overhead instead of standardising on one provider.
            claimRefs:
              - CP001
              - CP004
              - CP009
              - CP010
              - CP011
              - CP012
              - CP015
