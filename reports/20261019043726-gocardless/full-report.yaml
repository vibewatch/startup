  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Public evidence points to four top risks: post-close integration governance, merchant hold/support friction,
      product-scope limitations, and first-mandate cash-flow delay.
    data:
      columns:
        - label: Likelihood
          note: Public-evidence view over the next 12-18 months.
        - label: Residual severity
          note: Exposure after currently visible mitigants.
      rows:
        - label: Mollie integration and governance
          note: Completed acquisition but limited public disclosure on operating model and migration timing.
          values:
            - label: High
              tone: risk
            - label: High
              tone: risk
        - label: Compliance holds and support escalation
          note: AML reviews can suspend accounts and hold funds while escalation appears constrained.
          values:
            - label: Medium
              tone: risk
            - label: High
              tone: risk
        - label: Checkout coverage gap
          note: Stand-alone GoCardless remains bank-payments focused rather than card-inclusive.
          values:
            - label: High
              tone: risk
            - label: Medium-high
              tone: risk
        - label: First-mandate cash-flow lag
          note: New-customer collections can take about seven working days before normal settlement cadence.
          values:
            - label: High
              tone: risk
            - label: Medium
              tone: risk
        - label: Partner/channel execution dependence
          note: Embedded billing and recovery motions rely on counterparties and shared product delivery.
          values:
            - label: Medium
              tone: risk
            - label: Medium
              tone: risk
        - label: Compliance and scheme-liability delegation
          note: Merchants rely on GoCardless to operationalize direct-debit regulatory and scheme obligations.
          values:
            - label: Medium
              tone: risk
            - label: Medium-high
              tone: risk
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR011
      - CR012
      - CR015
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Scale and product proof are meaningful, but post-close valuation opacity keeps the call at Track rather than Buy.
    data:
      nodes:
        - id: scale
          label: Scaled operating footprint
          value: 100,000+ businesses; US$130bn+ annual payment volume
          note: Repeated in separate June 2026 GoCardless partner releases
        - id: expansion
          label: Recent distribution expansion
          value: Sequence and Intelligent Billing integrations
          note: Supports recurring-revenue workflow penetration
        - id: profitability
          label: Margin proof point
          value: First EBITDA-positive quarter in summer 2025
          note: Positive but not a full annual quality bridge
        - id: ownership
          label: Ownership reset
          value: Mollie completed the acquisition on 1 September 2026
          note: Valuation lens shifts from late-stage round to strategic-sale economics
        - id: opacity
          label: Public price opacity
          value: Official completion release omits consideration and waterfall details
          note: Independent sale-price references remain reconstructed
        - id: call
          label: Recommendation
          value: Track / medium confidence / high risk
          note: Wait for verified post-close economics before underwriting upside
      edges:
