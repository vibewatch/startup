              - CO009
      - number: '1.2'
        title: Leadership concentration, operating footprint, and stakeholder surface
        blocks:
          - type: paragraph
            body: >
              Current public materials heavily center GoCardless around a small named leadership set. Hiroki Takeuchi is
              the clearly identified operating leader after the close, Koen Köppen is the group-level decision-maker at
              Mollie, and Tom Metcalfe is the most visible GoCardless executive in 2026 partnership launches. That
              creates a workable public org picture, but it is thin for governance diligence because the assigned pool
              does not enumerate a broader executive bench or board structure. On footprint and scale, GoCardless
              continues to describe itself as a UK-headquartered global operator with offices across five additional
              countries, over 100,000 businesses using the platform, more than US$130bn processed annually, and
              open-banking connectivity spanning 2,300+ banks in the UK and Europe.
