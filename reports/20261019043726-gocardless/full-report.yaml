      - number: '6.3'
        title: Expansion logic is plausible, yet retention and concentration remain unproven in the assigned pool
        blocks:
          - type: paragraph
            body: >-
              The assigned sources support a reasonable expansion thesis: GoCardless can start as a direct-debit or
              pay-by-bank rail, add payment-recovery and fraud tooling, and broaden distribution through billing and
              finance platforms. Intelligent Billing's release claims Success+ recovers 70% of initially failed payments
              on average, which is a concrete upsell story for accounts already running recurring revenue workflows.
              Mollie's September 2026 acquisition FAQ also lowers near-term disruption risk by stating existing
              GoCardless pricing, contracts, dashboards, and support channels remain unchanged immediately after close.
              The limiting evidence is just as important: Akurateco says GoCardless is rarely a standalone choice and is
              weaker where card or wallet acceptance is required, while none of the assigned sources disclose NRR, GRR,
              churn, average contract length, top-customer concentration, or partner-channel concentration. The result
              is a chapter with good adoption evidence but only partial durability evidence.
            claimRefs:
              - CU009
              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Adoption proof is real, not just logo-level
            body: >-
              The assigned pool contains named customer quotes, partner-launch evidence, and repeated scale claims, so
              this chapter can validate real deployment surfaces even though most of that proof is still
              company-curated.
            calloutType: strength
            claimRefs:
              - CU002
              - CU003
              - CU010
              - CU011
              - CU012
          - type: callout
            title: Durability is the key remaining diligence gap
            body: >-
              The current source set does not disclose NRR, GRR, churn, renewal rates, or customer concentration, so the
              adoption story is much better evidenced than the durability and concentration story.
            calloutType: risk
            claimRefs:
              - CU013
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk outlook
        blocks:
          - type: paragraph
            body: >-
              The risk picture is more about execution and merchant fit than existential product validity. Public
              evidence still shows a capable bank-payments platform with broad integrations and geographic reach, but it
              also shows the limits of that focus: GoCardless emphasizes Pay by Bank, Direct Debit, and integrations
              rather than card acceptance, and independent reviewers continue to frame the product as strong for
              recurring billing but a weak fit for merchants needing a full checkout or fast first- collection cash
              flow. That makes the core thesis sensitive to customer mix. If GoCardless wins more merchants that need
              hybrid card-plus-bank payment stacks before Mollie's combined product is operationally unified, product
              narrowness could raise churn, increase integration burden, or cap expansion. Monitorable kill criteria are
              merchant disruption during post-close integration, repeated account-hold complaints, or evidence that
              important new segments still require third-party card rails with no clear bundled roadmap.
            claimRefs:
              - CR011
              - CR012
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
