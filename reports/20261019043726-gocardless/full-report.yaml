              - CI002
              - CI005
              - CI007
              - CI008
              - CI010
              - CI012
              - CI013
      - number: '4.2'
        title: Pricing, distribution, and monetization quality
        blocks:
          - type: paragraph
            body: >
              The clearest current monetization story is that GoCardless monetizes payment collection inside customer
              billing workflows and reinforces that core with add-ons and embedded partners. Official sources emphasize
              Sequence and Intelligent Billing integrations that move payment authorization and collection into
              quote-to-cash or billing systems, while current website copy focuses on faster settlement, lower card
              cost, and recovery automation rather than a transparent public rate card. Independent pricing evidence is
              therefore dated: the best external proxy in the assigned pool is a 2022 analysis showing transaction fees
              plus monthly committed-merchant fees, which remains useful context but is too old to underwrite present
              realized pricing without direct diligence.
            claimRefs:
              - CI002
              - CI007
              - CI008
              - CI013
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI007
              - CI008
      - number: '4.3'
        title: Cost structure and capital adequacy
        blocks:
          - type: paragraph
            body: >
              Public cost and capital disclosure remain materially thinner than product and revenue disclosure. Company
              sources say losses narrowed 27% in FY25 and that the business produced its first adjusted EBITDA-positive
              quarter, but they do not publish current gross margin, sales efficiency, burn, runway, or sale proceeds
              from the Mollie transaction. The strongest outside operating proxy is still the older Business of Payments
              review, which highlighted premium pricing, 31 bps take rate, meaningful employee and compliance cost, and
              non-trivial fraud and failed-payment provisions. Tracxn adds that GoCardless is now acquired, has raised
              USD540m historically, and had roughly 854 employees as of September 2026, but that still does not resolve
              present balance-sheet capacity.
            claimRefs:
              - CI005
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Financial verdict and blockers
        blocks:
          - type: paragraph
            body: >
              The public evidence supports a business with real scale, a broadening payment workflow, and a plausible
              path to better operating leverage, but not a clean underwriting case. GoCardless appears to have moved
              from a heavily loss-making 2022 profile toward FY25 profitability improvement, and partner-embedded
              workflow distribution could support durable usage, yet the evidence still leaves major gaps on realized
              pricing, cohort retention, customer concentration, and post-acquisition liquidity. Financial diligence
              should therefore treat public revenue and scale claims as directionally encouraging while keeping judgment
              conditional on private evidence about margin composition, contract economics, and capital sufficiency
              after the change of control.
            claimRefs:
              - CI009
              - CI010
              - CI012
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Workflow distribution is the clearest public GTM proxy
            body: >-
              Sequence and Intelligent Billing suggest GoCardless is trying to embed payment collection inside existing
              billing or revenue workflows, which can improve retention and reduce direct-sales friction if the partner
              channel scales.
            calloutType: insight
            claimRefs:
              - CI002
              - CI013
          - type: callout
            title: Capital adequacy is still not publicly underwritable
            body: >-
              Historical funding and headcount are visible, but the assigned public evidence still does not quantify
              sale proceeds, cash on hand, burn, or runway after the Mollie transaction.
            calloutType: risk
            claimRefs:
              - CI011
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope in customer workflow terms
        blocks:
          - type: paragraph
            body: >
              The public product surface is organized around how merchants get paid from bank accounts rather than
              around card-acquiring features. GoCardless positions its core offer as one platform for recurring
              collections, one-off or invoice payments, outbound payments, integrations and custom API builds, while the
              one-off Direct Debit documentation separates mandate-led collections from pay-by-bank flows that require
              customer authorization each time. In practical workflow terms, that means the company serves finance and
              billing teams that want to set up a bank-payment instruction once, reuse it for later charges, and keep
              payment events synchronized back into their operating systems instead of manually reconciling each
              collection.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE007
              - CE008
      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >
              The retained technical evidence points to a consistent integration pattern: merchants or software partners
              initiate billing or mandate requests through the API, redirect or embed authorization flows for end
              customers, then rely on webhooks and later payout files to reconcile state changes. The independent
              CiviCRM extension documentation is useful because it describes the concrete event choreography rather than
              marketing copy: billing requests create authorization flows, the customer returns to the merchant flow
              after mandate setup, and later payment confirmations and cancellations arrive asynchronously through
              webhooks. That asynchronous design is a strength for automation but it also means implementers must handle
              pending, failed and paid-out states correctly rather than assume instant finality.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE006
              - CE009
              - CE010
      - number: '5.3'
        title: Deployment surfaces, partner embedding and roadmap
        blocks:
          - type: paragraph
            body: >
              Deployment evidence in the assigned pool is strongest where GoCardless is embedded into adjacent billing
              software. The Sequence launch shows native Direct Debit inside quote-to-cash workflows for one-off
              invoices and recurring schedules, while the Mollie acquisition materials and follow-on independent
              coverage describe a broader product roadmap that combines GoCardless bank-payment rails with cards,
              accounts and financing. That expands the strategic product narrative, but the same sources explicitly say
              integration will be phased and that existing dashboards, contracts and services remain unchanged for now,
              so the broader suite should be treated as roadmap direction rather than already-unified technical reality.
            claimRefs:
              - CE008
              - CE009
              - CE010
      - number: '5.4'
        title: Trust, compliance and remaining diligence gaps
        blocks:
          - type: paragraph
            body: >
              Public evidence supports the existence of baseline controls, but not a deep independent reliability
              review. The developer page claims ISO 27001 certification, GDPR-aligned data-risk management and
              AI-powered retries and fraud tooling, and the third-party setup guides reinforce that integrators must
              plan for webhook handling, sandbox testing, consent capture and exception states before launch. What is
              still missing from this pool is a public SLA, MTTR disclosure, detailed incident root-cause evidence, or
              independent technical validation of the underlying fraud, data and routing engines. For underwriting, that
              leaves implementation maturity reasonably evidenced while operational resilience and security-depth claims
              remain only partially testable from public materials.
            claimRefs:
              - CE005
              - CE006
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base is broad by workflow, but the evidence is workflow-led rather than revenue-bucketed
        blocks:
          - type: paragraph
            body: >-
              GoCardless is evidenced most clearly as a bank-payments infrastructure layer for recurring billing,
              invoice collection, and pay-by-bank flows rather than as a universal checkout stack. Company materials
              repeatedly place the product in finance- team and payments-operations workflows: 100,000+ businesses,
              small to enterprise, are said to use the platform, while the open-banking material emphasizes access to
              more than 100 major UK banks and roughly 99% of consumer and business accounts. The assigned partner
              examples sharpen that picture further. Sequence positions GoCardless inside quote-to-cash and billing
              automation for one-off invoices plus recurring subscriptions, while Intelligent Billing positions it
              inside telecom and MSP billing operations. Akurateco's independent guide is directionally consistent: it
              describes GoCardless as strongest for subscriptions, memberships, invoicing, and multi-method stacks where
              merchants deliberately add bank debit alongside cards. What is missing is revenue segmentation by SMB
              versus enterprise, vertical mix, or geography mix, so segment breadth is evident but monetization
              concentration is not.
