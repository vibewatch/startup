companyProfile:
  summary: >-
    GoCardless is a London-based bank-payments platform that now operates inside Mollie after the September 2026
    acquisition close. It sells direct debit, pay-by-bank, and bank-account-data capabilities for recurring billing,
    one-off collections, and payment recovery, with distribution through APIs and partner workflows. The public record
    shows broad reach and improving profitability, but still leaves transaction economics, post-close governance, and
    standalone financial disclosure partially opaque.
