    title: Recommendation summary table
    columns:
      - Dimension
      - View
      - Evidence
      - Decision implication
    rows:
      - [Recommendation, Track, "Strong payments footprint but no verified current entry price", "Keep the company investable on watchlists, not approved for immediate underwriting"]
      - [Confidence, Medium, "Scale and sale completion are supported; realized economics are not", "Do not underwrite upside from stale private-round marks"]
      - [Risk rating, High, "Post-close governance, integration, and minority economics remain unclear", "Require tighter sizing and explicit downside protections"]
      - [Valuation stance, Unknown, "The 2022 $2.1B mark is stale; Multiples reports a $1.2B acquisition price, but the official completion release omits consideration", "Do not treat the third-party transaction figure as a verified entry price"]
      - [Underwriting lens, Strategic-sale outcome not standalone venture round, "Ownership has moved inside Mollie", "Use strategic-exit logic and integration milestones rather than late-stage round heuristics"]
    notes: Directional judgment only; public sources do not disclose the final consideration mix, waterfall, or minority-holder outcomes for the completed Mollie transaction.
    claimRefs: [CV004, CV005, CV007, CV009, CV011, CV013]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - [Thesis, "100,000+ businesses, 30+ countries, and US$130bn+ annual payment volume show real scaled usage.", "Sustained post-close volume growth plus audited retention or margin disclosure would strengthen conviction."]
      - [Thesis, "Sequence and Intelligent Billing integrations show GoCardless is embedding deeper into recurring-revenue workflows.", "Evidence that these channels materially expand enterprise mix or net revenue quality would improve upside confidence."]
      - [Anti-thesis, "The latest official ownership event is a completed sale with undisclosed consideration and governance terms.", "A disclosed purchase price, cap-table waterfall, and post-close reporting package would reduce valuation ambiguity."]
      - [Anti-thesis, "Older independent profiles still recycle self-reported or stale pre-close metrics, so comparables are noisy.", "New audited or management-certified FY26 revenue, EBITDA, churn, and concentration data would make scenario work more reliable."]
    notes: Arguments summarize the strongest investable positives and negatives; they are not equally weighted and should be read together with the scenario table.
    claimRefs: [CV002, CV003, CV007, CV008, CV009, CV010, CV011]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Integration broadens distribution across Mollie's installed base, EBITDA-positive quarters repeat, and disclosed economics show little preference leakage.", "Upside would accrue inside Mollie; public evidence does not support a standalone GoCardless valuation range.", "Execution complexity and loss of product focus inside a larger platform.", "Would require post-close disclosure plus early cross-sell or margin evidence."]
      - [Base, "GoCardless remains strategically important, but external investors only get visibility consistent with the completed sale context and partial synergy realization.", "Use Multiples' reported $1.2B price only as a provisional transaction reference, not as verified consideration or a current entry price.", "Public reporting stays thin and makes upside underwriting slow and episodic.", "Best fits the current evidence set."]
      - [Bear, "Integration stalls, governance stays opaque, or realized proceeds prove meaningfully worse for minority holders than headline deal chatter implied.", "Effective realized value lands below the reported strategic-sale range once waterfall and control economics are understood.", "No public transaction schedule, plus possible concentration or commercialization slippage.", "Becomes likelier if opacity persists after close or operational metrics weaken."]
    notes: Scenario ranges are qualitative because no official post-close consideration amount, waterfall, or current standalone FY26 financial package is publicly available.
    claimRefs: [CV007, CV008, CV009, CV011, CV012, CV013]
