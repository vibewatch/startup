  evidenceGaps:
    - type: missing-source
      severity: material
      topic: transaction-consideration
      missingEvidence: Official disclosure of the final purchase consideration, cash-versus-share mix, and any escrow, earn-out, or adjustment terms for the Mollie acquisition.
      whyItMatters: Without the realized price mechanics, investors cannot tell whether the reported sale context fairly represents value for all holders or only headline control economics.
      diligencePath: Request the transaction summary, shareholder communications, or board-approved sale materials covering proceeds allocation and closing adjustments.
    - type: private-evidence-only
      severity: material
      topic: fy26-financial-quality
      missingEvidence: FY26 revenue, gross margin, EBITDA, cash generation, and retention data after the first EBITDA-positive quarter disclosure.
      whyItMatters: A single profitability milestone is not enough to test whether valuation should be anchored on strategic scarcity, durable margins, or temporary integration timing.
      diligencePath: Obtain the latest management accounts, board pack, and KPI bridge from FY24 through the current post-close period.
    - type: missing-source
      severity: material
      topic: post-close-governance
      missingEvidence: Confirmed post-close board composition, reporting cadence, minority protections, and decision rights for the GoCardless business inside Mollie.
      whyItMatters: Governance determines whether external investors can rely on future disclosure, influence strategy, and capture value if integration priorities change.
      diligencePath: Review shareholder agreements, governance side letters, and the first post-close board materials or investor update.
