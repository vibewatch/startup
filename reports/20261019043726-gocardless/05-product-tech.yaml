  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: reliability-gap
      missingEvidence: Public or diligence-room evidence for uptime SLA, MTTR, incident postmortems and status-page history for core payment services.
      whyItMatters: Reliability and recovery depth affect enterprise suitability, operational risk and the credibility of automation claims.
      diligencePath: Request contractual SLA terms, incident logs or postmortems, and a current status-history export from management.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: material
      topic: trust-controls
      missingEvidence: Independent detail on the scope, recency and operational coverage of GoCardless's ISO 27001 and privacy controls.
      whyItMatters: Marketing-level certification statements do not show which systems, geographies or control boundaries are actually covered.
      diligencePath: Request certification scope statements, the latest audit dates and any customer-facing security whitepaper or shared assessment.
      relatedQuestionRefs: [QE006]
    - type: missing-source
      severity: material
      topic: post-acquisition-roadmap
      missingEvidence: A dated migration roadmap explaining when, if at all, GoCardless and Mollie products, data models or dashboards will converge.
      whyItMatters: Product-bundle upside depends on execution timing, integration complexity and customer migration friction, all of which remain open.
      diligencePath: Ask management for integration milestones, platform-boundary decisions and any customer cohort migration sequencing.
      relatedQuestionRefs: [QE005]
    - type: private-evidence-only
      severity: minor
      topic: developer-surface
      missingEvidence: Broader practitioner telemetry such as public repo activity, package download data, support-forum traffic or API error-rate benchmarks.
      whyItMatters: The retained developer signal confirms an integration ecosystem exists but does not independently validate developer adoption quality or maintenance velocity.
      diligencePath: Request internal API adoption metrics, public SDK repository pointers and support-volume or release-cadence summaries.
