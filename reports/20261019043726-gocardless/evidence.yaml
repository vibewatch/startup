evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding-disclosure
    missingEvidence: >-
      Official post-close transaction consideration, cash-versus-share mix, minority-holder treatment, total historical
      capital raised, current headcount, and standalone FY26 revenue or run-rate.
    whyItMatters: >-
      These data determine whether the reported €1.1bn transaction value, 2025 profitability milestone, and
      combined-group scale claims translate into an attractive standalone underwriting baseline for later financial and
      valuation chapters.
    diligencePath: >-
      Request the acquisition term sheet or sale memo, cap table and waterfall, board materials describing governance
      changes, and current management accounts covering headcount, revenue, and cash generation.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: tam-sam-som
    missingEvidence: >-
      Independent market-size data that isolates recurring bank-payment spend or merchant counts by geography, segment,
      and payment workflow.
    whyItMatters: >-
      Without a same-unit independent dataset, the chapter can defend only directional adoption logic rather than a
      precise TAM, SAM, or SOM.
    diligencePath: >-
      Pull an analyst-market-data or public-company disclosure that quantifies recurring bank-payment or A2A adoption by
      customer segment in GoCardless core markets.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: geographic-coverage
    missingEvidence: >-
      A current primary source that reconciles whether "30+ countries", "38 countries", and "40+ countries" refer to
      GoCardless alone, specific payment schemes, or the post-acquisition combined surface.
    whyItMatters: >-
      Market-boundary and distribution claims can overstate addressable geography if those labels are treated as
      interchangeable.
    diligencePath: >-
      Obtain an updated official product or investor fact sheet that defines country, scheme, and combined-group
      coverage on one basis.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: segment-conversion
    missingEvidence: Segment-level conversion, NRR, win-rate, or payment-mix data for SaaS, telecom, MSP, and invoice-led B2B cohorts.
    whyItMatters: >-
      Buyer-fit claims are credible, but valuation-relevant proof still requires evidence that those segments convert
      efficiently and expand economically.
    diligencePath: Request management cohort reporting or customer concentration by segment and payment rail after the Mollie close.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Segment-level enterprise pricing, volume discounts, realised take rates, and any post-Mollie bundle incentives.
    whyItMatters: >-
      Without realised commercial terms, it is impossible to test whether GoCardless's integration moat converts into
      pricing power or margin resilience.
    diligencePath: >-
      Request current rate cards, discount schedules, and recent enterprise win/loss pricing examples by customer
      segment.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: switching-costs
    missingEvidence: Customer retention, multi-homing, migration friction, and win/loss data versus broader payment stacks.
    whyItMatters: >-
      The chapter can show plausible switching frictions, but not whether those frictions are strong enough to prevent
      displacement at scale.
    diligencePath: >-
      Ask for cohort retention by product, competitor displacement reasons, and case studies showing migration from or
      to multi-provider stacks.
    relatedQuestionRefs:
      - QP006
      - QP007
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash balance, burn, runway, debt facilities, covenant package, and the cash-versus-share economics of the
      Mollie transaction.
    whyItMatters: >-
      Without post-close liquidity detail, the chapter cannot determine how much flexibility GoCardless has to absorb
      product investment, compliance cost, or adverse macro conditions.
    diligencePath: >-
      Request the latest management accounts, monthly cash bridge, debt schedule, and transaction documents or board
      materials describing sale proceeds and any trapped cash.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Current realized pricing by product, take rate by rail, discounting policy, committed-merchant attach rate, CAC,
      sales-cycle length, and payback period.
    whyItMatters: >-
      Public sources describe value propositions and an older fee schedule, but they do not show whether current growth
      is coming from durable unit economics or promotional pricing and channel mix.
    diligencePath: >-
      Obtain a pricing waterfall by segment, contract samples, sales funnel metrics, and cohort-level gross profit by
      product and geography.
    relatedQuestionRefs:
      - QI003
      - QI004
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: margin-path
    missingEvidence: >-
      Current gross margin, failed-payment loss rate, fraud loss rate, customer or partner concentration, and net
      revenue retention.
    whyItMatters: >-
      Public profitability improvement is encouraging, but underwriting the margin path requires knowing how
      concentrated revenue is and how much operational risk leaks through the payment and recovery stack.
    diligencePath: >-
      Request product-level P&L, gross-margin bridge, top-customer and top-partner concentration, and cohort retention
      by product family.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: minor
    topic: customer-scale
    missingEvidence: >-
      A normalized customer-count series and methodology that reconciles older third-party figures with current company
      claims.
    whyItMatters: >-
      The assigned pool contains older evidence below today's official 100,000-plus customer claim, so investors should
      not compare raw counts without controlling for date and definition.
    diligencePath: >-
      Ask management for annual customer-count definitions, cohort rules, and bridge tables linking merchants,
      organizations, and active payers over time.
    relatedQuestionRefs:
      - QI001
  - type: private-evidence-only
    severity: material
    topic: reliability-gap
    missingEvidence: >-
      Public or diligence-room evidence for uptime SLA, MTTR, incident postmortems and status-page history for core
      payment services.
    whyItMatters: >-
      Reliability and recovery depth affect enterprise suitability, operational risk and the credibility of automation
      claims.
    diligencePath: Request contractual SLA terms, incident logs or postmortems, and a current status-history export from management.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: Independent detail on the scope, recency and operational coverage of GoCardless's ISO 27001 and privacy controls.
    whyItMatters: >-
      Marketing-level certification statements do not show which systems, geographies or control boundaries are actually
      covered.
    diligencePath: >-
      Request certification scope statements, the latest audit dates and any customer-facing security whitepaper or
      shared assessment.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: post-acquisition-roadmap
    missingEvidence: >-
      A dated migration roadmap explaining when, if at all, GoCardless and Mollie products, data models or dashboards
      will converge.
    whyItMatters: >-
      Product-bundle upside depends on execution timing, integration complexity and customer migration friction, all of
      which remain open.
    diligencePath: >-
      Ask management for integration milestones, platform-boundary decisions and any customer cohort migration
      sequencing.
    relatedQuestionRefs:
      - QE005
  - type: private-evidence-only
    severity: minor
    topic: developer-surface
    missingEvidence: >-
      Broader practitioner telemetry such as public repo activity, package download data, support-forum traffic or API
      error-rate benchmarks.
    whyItMatters: >-
      The retained developer signal confirms an integration ecosystem exists but does not independently validate
      developer adoption quality or maintenance velocity.
    diligencePath: >-
      Request internal API adoption metrics, public SDK repository pointers and support-volume or release-cadence
      summaries.
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal-rate, cohort, or contract-duration evidence for the GoCardless customer base.
    whyItMatters: >-
      Without retention metrics, it is not possible to distinguish broad top-of-funnel adoption from durable revenue
      retention.
    diligencePath: >-
      Request board materials, cohort exports, or investor reporting showing customer and revenue retention by segment
      and geography.
    relatedQuestionRefs:
      - QU006
  - type: private-evidence-only
    severity: material
    topic: concentration-risk
    missingEvidence: Revenue, payment-volume, and gross-margin concentration by top customers, partner channels, and geography.
    whyItMatters: Channel-heavy adoption can look broad while still being dependent on a few customers, partners, or markets.
    diligencePath: >-
      Obtain customer concentration schedules, top-account payment-volume reports, and partner-sourced revenue mix from
      management.
    relatedQuestionRefs:
      - QU010
  - type: enumeration-incomplete
    severity: minor
    topic: TU003 named customer proof coverage
    missingEvidence: An exhaustive current list of named GoCardless customer deployments and live partner-channel accounts.
    whyItMatters: >-
      The chapter can cite a credible sample of customer proof, but the assigned pool does not establish whether those
      examples are representative of the installed base.
    diligencePath: >-
      Request a current customer reference list with deployment status, segment, geography, and permissioned case-study
      support for publication.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: >-
