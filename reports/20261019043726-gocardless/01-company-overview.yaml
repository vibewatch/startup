chapter:
  number: 1
  title: "Company Overview"
  summary: "GoCardless enters late 2026 as a Mollie-owned bank-payments platform with public evidence of broad bank-payment reach, 100,000+ historical standalone business users, 350,000+ combined-group businesses, and a first EBITDA-positive quarter reported in summer 2025. The same assigned pool still leaves underwriting gaps on transaction economics, total raised, current headcount, and standalone post-close financial disclosure."
sections:
  - id: "identity-and-ownership"
    title: "Identity, ownership, and disclosed operating scope"
    body: |
      The assigned 2026 evidence depicts GoCardless as a bank-payments specialist that now sits inside Mollie rather than as an independent late-stage fintech. Company and parent statements say Mollie completed the acquisition on 1 September 2026, kept the brand alive as "GoCardless, a Mollie company," and left co-founder Hiroki Takeuchi running the unit while Koen Köppen leads the broader combined group. On product scope, current company-controlled pages position GoCardless around bank-payment collection, pay-by-bank capabilities, and bank-account-data access rather than around a broad multi-rail checkout stack. That identity is strategically coherent, but official deal materials in this pool still stop short of disclosing transaction consideration, capital structure changes, or minority-holder treatment.
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO006", "CO007"]
    tableRefs: ["TO001"]
  - id: "leadership-and-stakeholders"
    title: "Leadership concentration, operating footprint, and stakeholder surface"
    body: |
      Current public materials heavily center GoCardless around a small named leadership set. Hiroki Takeuchi is the clearly identified operating leader after the close, Koen Köppen is the group-level decision-maker at Mollie, and Tom Metcalfe is the most visible GoCardless executive in 2026 partnership launches. That creates a workable public org picture, but it is thin for governance diligence because the assigned pool does not enumerate a broader executive bench or board structure. On footprint and scale, GoCardless continues to describe itself as a UK-headquartered global operator with offices across five additional countries, over 100,000 businesses using the platform, more than US$130bn processed annually, and open-banking connectivity spanning 2,300+ banks in the UK and Europe.
    claimRefs: ["CO004", "CO009", "CO010", "CO011", "CO015"]
    tableRefs: ["TO002", "TO003"]
  - id: "milestones-and-disclosure-gaps"
    title: "2025-2026 milestones and remaining diligence gaps"
    body: |
      The strongest dated milestones in the assigned pool point to improving operating credibility and a major ownership change. Company and parent sources say GoCardless reached its first EBITDA-positive quarter in summer 2025, then spent June 2026 broadening embedded billing distribution through Sequence and Intelligent Billing before closing the Mollie transaction in September 2026. Those milestones support a scale-and-efficiency narrative, but they do not remove valuation and disclosure risk. FinTech Magazine reports a €1.1bn acquisition value, while the official announcements reviewed here omit transaction price, waterfall economics, and post-close governance detail; Akurateco's external guide also reminds readers that the product remains bank-debit led, with card gaps, layered pricing, and slower settlement than card rails.
    claimRefs: ["CO005", "CO006", "CO008", "CO012", "CO013", "CO014"]
    figureRefs: ["FO001"]
