      - ["Airwallex", "Adjacent multi-method PSP / financial platform", "160+ payment methods in 180+ countries", "Growing international companies", "Broader acceptance, FX, spend management, global accounts", "Less specialized around direct debit and recurring bank-collection workflows in the retained evidence"]
      - ["Braintree", "Adjacent card + ACH substitute", "Cards, wallets, ACH direct debit, payouts in 200+ countries/regions", "App and web businesses needing recurring billing plus cards", "Combines recurring billing with mainstream checkout methods", "ACH detail is US-centric in the retained source; broader bank-debit depth is not evidenced here"]
      - ["Pinch Payments", "Regional direct-debit + card alternative", "Supports Xero, cards, direct debit, and APIs in the cited comparison", "ANZ-oriented SMBs that want local support and guided onboarding", "Combines bank debit with card acceptance and service-heavy onboarding", "Geographic scope is narrower than Airwallex or the combined Mollie footprint in the retained sources"]
      - ["Mollie + GoCardless", "Bundled incumbent response", "350,000+ businesses across 30+ markets", "SMBs to larger European businesses seeking one provider", "Adds cards and local methods to GoCardless's pay-by-bank assets", "Bundle roadmap and new pricing architecture are still undisclosed"]
      - ["Fragmented multi-provider stack", "Status quo substitute", "Common pattern described as cards + direct debit + banking + financing with different vendors", "Operators willing to optimise each workflow separately", "Avoids migration to a single platform and can preserve existing provider choices", "Adds integrations, reconciliation work, and cash-visibility blind spots"]
    notes: >-
      Scale and segment cells use only retained public signals; missing funding,
      market-share, or revenue data means it was not disclosed in this source
      set.
    claimRefs: [CP004, CP009, CP011, CP012, CP015]
  - id: TP002
