    columns:
      - Buying criterion
      - GoCardless
      - Airwallex
      - Braintree
      - Pinch Payments
      - Mollie + GoCardless
      - Implication
    rows:
      - ["Recurring bank debit", "Yes: direct debit plus recurring pay by bank", "A2A pricing cited; recurring bank-debit depth not fully detailed", "Yes: ACH Direct Debit pricing cited", "Yes: domestic direct debit", "Yes: GoCardless direct debit retained inside the combined group", "GoCardless remains credible where bank-account collection is the core job"]
      - ["Card acceptance", "No evidence in retained sources; Pinch comparison marks 'not offered' for credit card", "Yes", "Yes", "Yes", "Yes via Mollie's card stack", "Breadth rivals can neutralise a bank-only pitch when checkout mix matters"]
      - ["Pre-built software integrations", "Yes: 350+ integrations; Xero, QuickBooks, Zuora named", "Unknown in retained source", "Unknown in retained source", "Yes: Xero yes, QuickBooks no in cited comparison", "Likely broader after combination, but specific merged integration catalogue is not disclosed", "Integration density is a real distribution asset for GoCardless today"]
      - ["Custom API route", "Yes", "Unknown in retained source", "Yes via app/website integration framing", "Yes", "Unknown in retained source", "Internal build stays possible, but native connectors lower adoption effort"]
      - ["Geographic / payment-method breadth", "Bank-payment specialist; 30+ countries in official PRs", "160+ methods, 180+ countries", "200+ countries/regions for payouts; card and ACH mix", "Narrower regional scope in retained source", "30+ markets with cards + local methods + pay by bank", "GoCardless is narrowest where the buyer wants one provider for many rails"]
      - ["Embedded billing workflow partnerships", "Yes: Sequence and Intelligent Billing", "Unknown in retained source", "Recurring billing mentioned, but no equivalent ecosystem embeds cited here", "Unknown in retained source", "Phased integration promised, but no merged embedded bundle yet", "GoCardless's channel moat is strongest inside billing and finance software"]
    notes: >-
      Unknown means the capability was not evidenced in the retained source set,
      not that it is absent from the vendor's actual product.
    claimRefs: [CP001, CP002, CP005, CP006, CP008, CP009, CP011, CP012, CP014]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Provider
      - Published entry pricing in retained source
      - Included capabilities cited
      - Known limits / unknowns
      - Implication
    rows:
      - ["GoCardless", "1% + £0.20 per transaction, capped at £4; +0.3% above £2,000; no monthly subscription or account fees", "Direct debit / A2A bank payments", "Realised enterprise pricing, discount schedules, and post-close bundle terms are not disclosed", "Entry pricing is legible, but enterprise underwriting still needs direct diligence"]
      - ["Airwallex", "1.3% + 20p for UK card transactions; 0.4% A2A with £5 max; FX at interbank + 0.5%-1%", "160+ payment methods, global accounts, spend management, embedded finance", "Retained source is competitor-authored and does not prove realised pricing or discounts", "Airwallex competes by bundling broader financial tooling around payments"]
      - ["Braintree", "Cards and Digital Wallets 2.59% + 0.49¢; ACH Direct Debit 0.75%", "Cards, wallets, recurring billing, payouts", "No retained evidence on non-US direct-debit depth or enterprise discounts", "Adjacent substitutes can pair bank debit with mainstream checkout methods"]
      - ["Pinch Payments", "Domestic direct debit 1.00% + 30c capped at $5; credit card 1.95% + 30c", "Direct debit, cards, APIs, Xero integration", "Comparison is vendor-authored and regionally scoped", "Regional specialists can win when service and card acceptance matter more than global scale"]
      - ["Mollie + GoCardless", "Current pricing, contracts, and terms remain unchanged; no new bundle price disclosed", "Cards, local methods, direct debit, open banking, accounts, financing direction", "Bundle economics and migration incentives are still opaque", "Strategic threat is platform breadth first, immediate repricing second"]
    notes: >-
      Prices are retained public list or comparison-page figures. Enterprise
      discounts, FX spreads outside cited examples, and merged bundle pricing
      remain unresolved. The Airwallex comparison was updated in Q3 2025, the
      Wise page identifies 2025 in its title, the Pinch page has no publication
      date, and the Mollie pricing statement is dated 1 September 2026.
    claimRefs: [CP007, CP008, CP009, CP011, CP013]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      GoCardless sits high on implementation leverage but lower on payment-stack
      breadth than full-stack rivals and the combined Mollie platform.
    data:
      xAxis:
        label: Payment-stack breadth
        min: 1
        max: 5
        lowLabel: Narrow bank-only scope
        highLabel: Full multi-method / finance stack
      yAxis:
        label: Distribution / implementation leverage
        min: 1
        max: 5
        lowLabel: Fragmented or custom-heavy
        highLabel: Strong embedded / channel leverage
      points:
        - label: GoCardless
          x: 2
          y: 4
          note: "Bank-payment specialist with 350+ integrations and billing embeds."
        - label: Airwallex
          x: 5
          y: 3
          note: "Broader method and geography coverage, but weaker retained evidence on recurring debit embeds."
        - label: Braintree
          x: 4
          y: 2
          note: "Broad checkout and ACH mix for app/web merchants, with less retained evidence of ecosystem distribution."
        - label: Pinch Payments
          x: 3
          y: 3
          note: "Regional alternative combining direct debit, cards, and service-led onboarding."
        - label: Mollie + GoCardless
          x: 5
          y: 4
          note: "Combined platform breadth plus GoCardless bank-payment assets, but roadmap still phased."
        - label: Fragmented provider stack
          x: 4
          y: 1
          note: "High breadth by stitching vendors together, but lowest consolidation and reconciliation leverage."
    approximationNotes: >-
      Axes use evidence-backed ordinal 1-5 scoring derived from retained product
      scope, integration surfaces, and implementation-friction signals; they are
      not third-party benchmark measurements.
    claimRefs: [CP002, CP004, CP009, CP011, CP012, CP014, CP015, CP016]
callouts:
  - calloutType: insight
    title: Native billing embeds are the most defensible part of the offer
    body: >-
      The strongest retained differentiation is not raw payment-rail ownership
      but the ability to sit inside quote-to-cash, telecom, MSP, and accounting
      workflows through pre-built integrations and partner embeds.
    claimRefs: [CP002, CP005, CP006, CP014]
  - calloutType: risk
    title: Breadth competitors can collapse the "bank-only" wedge
    body: >-
      Where buyers want cards, wallets, broader geography, or one-provider
      consolidation, GoCardless's focused bank-payment scope becomes easier to
      replace or subordinate inside a larger bundle.
    claimRefs: [CP009, CP011, CP012, CP016]
