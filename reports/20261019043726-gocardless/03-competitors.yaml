schemaVersion: report-v2
artifact: competitors
slug: gocardless
runDate: 2026-10-19
company:
  name: GoCardless
chapter:
  number: 3
  title: Competitors
  summary: >-
    GoCardless remains strongest where the buyer wants bank-account payments to
    be the primary rail and can adopt through an existing billing or accounting
    integration. The main competitive pressure comes from broader stacks:
    Airwallex, Braintree, Pinch, and the newly combined Mollie + GoCardless
    proposition all compete by bundling cards, wider geography, or one-platform
    consolidation, while post-acquisition bundle pricing remains opaque.
sections:
  - id: competitive-landscape
    title: Competitive set extends beyond direct-debit peers
    body: >-
      The relevant buying set is broader than "another direct-debit tool."
      GoCardless still presents itself as a bank-payments specialist, spanning
      recurring direct debit, one-off pay-by-bank, open-banking verification,
      payouts, and bank-account-data products. That specialization matters for
      recurring billing and invoice collection, but adjacent substitutes attack
      the same workflow from different angles. Airwallex markets a much broader
      multi-method and cross-border stack, Wise's alternatives guide points
      buyers toward substitutes such as Braintree, Adyen, and Dwolla, and
      Mollie's completed acquisition moves GoCardless into a larger bundled
      payments platform with cards and local methods. The status quo is also a
      competitor: buyers can keep separate providers for cards, bank payments,
      banking, and financing, accepting reconciliation overhead instead of
      standardising on one provider.
    claimRefs: [CP001, CP004, CP009, CP010, CP011, CP012, CP015]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-and-pricing-tradeoffs
    title: Breadth competitors challenge GoCardless on payment methods and packaging
    body: >-
      The retained public pricing and comparison pages imply a consistent trade:
      GoCardless is priced as a focused bank-payments product, while rivals use
      broader payment-method coverage as their wedge. Airwallex's comparison
      page cites GoCardless list pricing at 1% plus £0.20 per transaction
      capped at £4, but pairs that against 160+ payment methods and wider
      country coverage. Pinch's comparison page makes the contrast starker by
      marking GoCardless as unavailable for online credit-card acceptance while
      both vendors support direct debit and APIs. Wise's alternatives guide
      similarly highlights substitutes such as Braintree that combine recurring
      billing with cards, wallets, and ACH direct debit. That means GoCardless
      wins on focused bank-payment use cases, but is easier to displace when a
      buyer wants checkout breadth, wallet acceptance, or a single vendor for
      both card and account-to-account flows.
    claimRefs: [CP007, CP008, CP009, CP010, CP011, CP013, CP016]
    tableRefs: [TP002, TP003]
  - id: durability-and-switching-costs
    title: The moat is implementation leverage and trust, not exclusivity
    body: >-
      GoCardless's durable edge in the retained sources is implementation
      leverage rather than hard exclusivity. The company advertises 350+
      integrations and API integrations, Great Partners describes those
      connectors as reducing adoption to an "app-store-style connection" where
      listings already exist, and June 2026 partnership releases show GoCardless
      embedding directly into quote-to-cash and telecom/MSP billing workflows.
      FCA authorisation also matters for trust-sensitive buyers. Those are real
      switching frictions, but they are not unassailable: buyers can still
      multi-home, and the post-Mollie platform can answer the "bank-only"
      objection by adding cards and local methods without changing current
      contracts immediately. What remains missing is the enterprise-level proof:
      realised discounting, post-close bundle design, and actual win/loss or
      churn data that would quantify whether these integration hooks translate
      into durable pricing power.
    claimRefs: [CP002, CP003, CP005, CP006, CP012, CP014, CP015]
