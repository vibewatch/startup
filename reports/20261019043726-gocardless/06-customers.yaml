figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: GoCardless adoption typically starts with a billing or bank-payment need, then expands into automation and recovery layers.
    data:
      items:
        - label: Identify recurring or bank-payment need
          actor: Finance or payments owner
          channel: Direct sales or product-led evaluation
          detail: Recurring billing, invoice collection, or pay-by-bank economics are the main entry points.
          tone: neutral
        - label: Evaluate coverage and fit
          actor: Finance, treasury, and payments operations
          channel: Product page, partner channel, or platform integration review
          detail: Buyers test scheme reach, bank coverage, geography, and whether GoCardless complements or replaces card flows.
          tone: neutral
        - label: Customer mandate / authorization setup
          actor: End payer
          channel: Hosted portal or in-app banking authorization
          detail: Payers authorize mandates or pay-by-bank transfers within the merchant or platform workflow.
          tone: positive
        - label: Recurring collection and reconciliation
          actor: Merchant finance or revenue operations team
          channel: Direct integration, Sequence, or Intelligent Billing
          detail: Collections, status updates, and reconciliation move into finance workflows for invoices and subscriptions.
          tone: positive
        - label: Failed-payment recovery and fraud tooling
          actor: AR and risk teams
          channel: Success+ and Protect+ upsell layer
          detail: Existing customers can add payment retry and fraud workflows after core collection is live.
          tone: positive
        - label: Multi-method and cross-sell expansion
          actor: Payments operations and support
          channel: Orchestration, open banking, or post-acquisition product bundle
          detail: Accounts can expand into pay-by-bank, multi-method stacks, or wider group capabilities, but may still keep cards elsewhere.
          tone: neutral
    claimRefs: [CU001, CU005, CU007, CU008, CU009, CU014]
callouts:
  - calloutType: strength
    title: Adoption proof is real, not just logo-level
    body: >-
      The assigned pool contains named customer quotes, partner-launch evidence, and
      repeated scale claims, so this chapter can validate real deployment surfaces even
      though most of that proof is still company-curated.
    claimRefs: [CU002, CU003, CU010, CU011, CU012]
  - calloutType: risk
    title: Durability is the key remaining diligence gap
    body: >-
      The current source set does not disclose NRR, GRR, churn, renewal rates, or
      customer concentration, so the adoption story is much better evidenced than the
      durability and concentration story.
    claimRefs: [CU013, CU014, CU015]
