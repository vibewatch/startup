schemaVersion: report-v2
artifact: customers
slug: gocardless
runDate: 2026-10-19
company:
  name: GoCardless
chapter:
  number: 6
  title: Customers
  summary: >-
    The assigned evidence supports a real and fairly broad GoCardless customer footprint:
    the company repeatedly states it serves 100,000+ businesses, processes more than
    $130bn annually, and spans SMB through enterprise use cases across recurring billing,
    pay-by-bank, and embedded billing workflows. What the pool does not prove is the
    durability of that footprint by revenue concentration, NRR/GRR, or renewal behavior,
    so the chapter can confirm adoption surfaces and named proof more confidently than
    retention quality.
sections:
  - id: segment-and-buyer-map
    title: Customer base is broad by workflow, but the evidence is workflow-led rather than revenue-bucketed
    body: >-
      GoCardless is evidenced most clearly as a bank-payments infrastructure layer for
      recurring billing, invoice collection, and pay-by-bank flows rather than as a
      universal checkout stack. Company materials repeatedly place the product in finance-
      team and payments-operations workflows: 100,000+ businesses, small to enterprise,
      are said to use the platform, while the open-banking material emphasizes access to
      more than 100 major UK banks and roughly 99% of consumer and business accounts.
      The assigned partner examples sharpen that picture further. Sequence positions
      GoCardless inside quote-to-cash and billing automation for one-off invoices plus
      recurring subscriptions, while Intelligent Billing positions it inside telecom and
      MSP billing operations. Akurateco's independent guide is directionally consistent:
      it describes GoCardless as strongest for subscriptions, memberships, invoicing, and
      multi-method stacks where merchants deliberately add bank debit alongside cards.
      What is missing is revenue segmentation by SMB versus enterprise, vertical mix, or
      geography mix, so segment breadth is evident but monetization concentration is not.
    claimRefs: [CU001, CU002, CU004, CU005, CU006, CU007, CU008, CU014, CU015]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Adoption proof exists through scale claims, partner launches, and named testimonials, but most proof remains company-curated
    body: >-
      The strongest adoption signals in the pool are scale claims repeated across multiple
      official surfaces and named customer proof published on GoCardless's own site.
      GoCardless repeats the 100,000+ business and $130bn+ annual payments claims on its
      homepage and June 2026 partner announcements, while Wikipedia echoes the same
      footprint at a one-year lag. Named proof is more specific than a logo wall: DocuSign
      says customers convert better where GoCardless is offered, JustGiving reports a
      70-80% reduction in cost per payment plus higher conversion for Pay by Bank, and
      Sage describes major reductions in payment-chasing labor. Sequence and Intelligent
      Billing add channel proof that GoCardless is embedded in adjacent billing platforms
      aimed at SaaS, telecom, and MSP finance teams. The chapter can therefore verify live
      deployment narratives and credible land-and-expand surfaces, but not independent
      denominators for active accounts, payment volume by customer tier, or the share of
      adoption driven by partners versus direct sales.
    claimRefs: [CU002, CU003, CU007, CU008, CU009, CU010, CU011, CU012, CU016]
    tableRefs: [TU002, TU003]
  - id: durability-and-expansion
    title: Expansion logic is plausible, yet retention and concentration remain unproven in the assigned pool
    body: >-
      The assigned sources support a reasonable expansion thesis: GoCardless can start as
      a direct-debit or pay-by-bank rail, add payment-recovery and fraud tooling, and
      broaden distribution through billing and finance platforms. Intelligent Billing's
      release claims Success+ recovers 70% of initially failed payments on average, which
      is a concrete upsell story for accounts already running recurring revenue workflows.
      Mollie's September 2026 acquisition FAQ also lowers near-term disruption risk by
      stating existing GoCardless pricing, contracts, dashboards, and support channels
      remain unchanged immediately after close. The limiting evidence is just as important:
      Akurateco says GoCardless is rarely a standalone choice and is weaker where card or
      wallet acceptance is required, while none of the assigned sources disclose NRR,
      GRR, churn, average contract length, top-customer concentration, or partner-channel
      concentration. The result is a chapter with good adoption evidence but only partial
      durability evidence.
    claimRefs: [CU009, CU013, CU014, CU015]
