schemaVersion: report-v2
artifact: financials
slug: gocardless
runDate: 2026-10-19
company:
  name: GoCardless
chapter:
  number: 4
  title: Financials
  summary: GoCardless has current public evidence of scale and improving profitability, with FY25 turnover of GBP160.9m and its first adjusted EBITDA-positive quarter, but public underwriting is still constrained by undisclosed realized pricing, current gross margin, and post-sale capital resources. The revenue model is clear enough to map around recurring bank payments, pay-by-bank, payouts, and recovery add-ons, yet the public evidence still relies heavily on company-issued scale claims and older independent unit-economics proxies.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and public traction
    body: >
      Public evidence supports GoCardless as a bank-payments infrastructure business rather than a pure software subscription vendor. The company currently presents recurring Direct Debit collection, instant pay-by-bank, outbound payouts, failed-payment recovery, and bank-account data services as one platform, while its FY25 update ties that product stack to GBP160.9m of group turnover and GBP79.2bn of processed payments. The same materials position partner signings, renewals, and broader workflow coverage as growth drivers, which means underwriting must separate activity volume from monetization quality because the public sources do not disclose contribution by rail, add-on, geography, or customer cohort.
    claimRefs: [CI001, CI003, CI004, CI006]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-distribution-and-monetization
    title: Pricing, distribution, and monetization quality
    body: >
      The clearest current monetization story is that GoCardless monetizes payment collection inside customer billing workflows and reinforces that core with add-ons and embedded partners. Official sources emphasize Sequence and Intelligent Billing integrations that move payment authorization and collection into quote-to-cash or billing systems, while current website copy focuses on faster settlement, lower card cost, and recovery automation rather than a transparent public rate card. Independent pricing evidence is therefore dated: the best external proxy in the assigned pool is a 2022 analysis showing transaction fees plus monthly committed-merchant fees, which remains useful context but is too old to underwrite present realized pricing without direct diligence.
    claimRefs: [CI002, CI007, CI008, CI013]
    tableRefs: [TI002]
  - id: cost-structure-and-capital-adequacy
    title: Cost structure and capital adequacy
    body: >
      Public cost and capital disclosure remain materially thinner than product and revenue disclosure. Company sources say losses narrowed 27% in FY25 and that the business produced its first adjusted EBITDA-positive quarter, but they do not publish current gross margin, sales efficiency, burn, runway, or sale proceeds from the Mollie transaction. The strongest outside operating proxy is still the older Business of Payments review, which highlighted premium pricing, 31 bps take rate, meaningful employee and compliance cost, and non-trivial fraud and failed-payment provisions. Tracxn adds that GoCardless is now acquired, has raised USD540m historically, and had roughly 854 employees as of September 2026, but that still does not resolve present balance-sheet capacity.
    claimRefs: [CI005, CI009, CI010, CI011, CI012]
    tableRefs: [TI003]
  - id: financial-verdict-and-blockers
    title: Financial verdict and blockers
    body: >
      The public evidence supports a business with real scale, a broadening payment workflow, and a plausible path to better operating leverage, but not a clean underwriting case. GoCardless appears to have moved from a heavily loss-making 2022 profile toward FY25 profitability improvement, and partner-embedded workflow distribution could support durable usage, yet the evidence still leaves major gaps on realized pricing, cohort retention, customer concentration, and post-acquisition liquidity. Financial diligence should therefore treat public revenue and scale claims as directionally encouraging while keeping judgment conditional on private evidence about margin composition, contract economics, and capital sufficiency after the change of control.
    claimRefs: [CI009, CI010, CI012, CI014]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Public evidence or current status
      - Revenue quality
      - Diligence ask
    rows:
      - - Recurring Direct Debit
        - Automated recurring bank-debit collection across multiple schemes and countries
        - 30+ countries, 8 bank debit schemes, and 97.3% first-time success claimed on current website
        - Sticky workflow fit, but realized pricing and segment mix are undisclosed
        - Segment recurring TPV, net retention, and gross margin by geography
      - - Instant pay-by-bank / one-off payments
        - Account-to-account invoice or one-off collections with faster settlement
        - Same or next day settlement and average 49% lower cost than cards claimed on website
        - Attractive value proposition, but take rate and adoption by cohort are undisclosed
        - Take rate, pay-by-bank share of TPV, and attach by merchant type
      - - Outbound payments
        - Payouts to customers, suppliers, or third parties from the same platform
        - Website and FY25 update position payouts as part of the end-to-end platform
        - Expands workflow scope, but revenue contribution is undisclosed
        - Payout TPV, pricing, and margin versus collection products
      - - Success+ / failed-payment recovery
        - Add-on retry and payment-intelligence workflow
        - Official sources claim up to 70% of initially failed payments can be recovered
        - Likely higher-value software-like upsell, but attach rate is undisclosed
        - Attach rate, pricing basis, and incremental gross profit
      - - Bank-account data services
        - AIS and bank-account verification / data services
        - Government marketplace listing includes bank-account data services
        - Adjacent product broadens monetization, but stand-alone pricing is absent
        - Product revenue split, conversion funnel, and data-service economics
    notes: Public evidence mixes current company-issued product claims with limited external monetization detail; row language distinguishes disclosed workflow scope from undisclosed realized pricing.
    claimRefs: [CI001, CI002, CI006, CI007]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Public monetization evidence
      - Public price or proxy
      - Caveat
      - Source basis
    rows:
      - - Core domestic collection
        - Transaction-fee model on bank-debit collections
        - 1% + GBP0.2 or EUR0.2 capped at GBP4 or EUR4
        - External evidence is from 2022, so current realized pricing may differ
        - Business of Payments 2022 analysis
      - - International transactions
        - Cross-border or international bank-payment collections
        - 2% + GBP0.2 or EUR0.2
        - Public assigned pool does not confirm whether this schedule is still current
        - Business of Payments 2022 analysis
      - - Committed merchants
        - Monthly fee layered on top of transaction pricing for extra features
        - 37% of revenue came from committed merchants in 2022
        - Helpful revenue-quality proxy, but no updated mix is public here
        - Business of Payments 2022 analysis
      - - Pay by Bank / one-off payments
        - Value proposition sold on speed and lower cost versus cards
        - Claimed to cost 49% less than cards and settle same or next day
        - Savings claim is not a customer invoice rate card
        - Current GoCardless website
      - - Embedded partner workflows and Success+
        - Monetization appears tied to partner-integrated collection and recovery add-ons
        - Price not publicly disclosed
        - Public evidence confirms product/workflow value, not realized contract economics
        - Sequence, Intelligent Billing, and website sources
    notes: This table separates disclosed value propositions from dated or missing rate-card evidence; null-free rows still include caveats because current realized pricing is not publicly disclosed in the assigned source pool.
    claimRefs: [CI002, CI007, CI008]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - FY25 turnover growth
        - Group turnover rose to GBP160.9m from GBP132.3m
        - Medium
        - Confirms recent top-line growth from official FY25 disclosure
        - Revenue bridge by product, geography, and customer cohort
      - - FY25 payment volume
        - GBP79.2bn processed, described as double the prior year
        - Medium
        - Volume scale helps frame monetization leverage and payment-rail importance
        - Volume split by product, geography, and customer size
      - - Profitability trajectory
        - First adjusted EBITDA-positive quarter in FY25; adjusted FY26 profitability targeted
        - Medium
        - Suggests operating leverage is improving, but not enough to infer free cash flow
        - Current EBITDA margin, cash conversion, and working-capital profile
      - - Historical take rate
        - 31 bps in 2022
        - Medium
        - External proxy for monetization efficiency before current product broadening
        - Updated take rate by rail and merchant segment
      - - Historical cost drag
        - GBP114m administrative expense, including GBP74m employee cost; fraud and failed-payment provisions were material
        - Medium
        - Shows compliance, fraud, and service-delivery costs can absorb a large share of revenue
        - Current gross margin, support cost, fraud loss rate, and bad-debt trend
      - - Current cash / runway
        - null
        - Medium
        - Post-acquisition capital adequacy cannot be underwritten from the assigned public sources
        - Cash balance, burn, debt, covenant, and sale-proceeds waterfall
    notes: This table intentionally mixes FY25 company disclosures, older independent unit-economics proxies, and nulls for undisclosed current metrics; null means the assigned public evidence does not quantify the item.
    claimRefs: [CI003, CI004, CI005, CI009, CI010, CI011, CI012]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence shows customer payment activity flowing into payment rails, embedded workflows, add-ons, and eventual profit drivers, but not into a fully disclosed current margin stack.
    data:
      nodes:
        - id: demand
          label: Customer payment activity
          value: Recurring subscriptions, invoices, and payouts
          note: Demand begins with customers needing recurring collections, one-off pay-by-bank, and outbound disbursements.
          claimRefs: [CI001, CI002]
        - id: rails
          label: Core bank-payment rails
          value: Direct Debit, pay by bank, and outbound payments
          note: GoCardless presents one platform spanning collection and payout payment rails.
          claimRefs: [CI001, CI007]
        - id: workflow
          label: Workflow distribution
          value: Partner embeds and integrations
          note: Sequence and Intelligent Billing show quote-to-cash and billing-system embeds as a GTM and retention lever.
          claimRefs: [CI002, CI013]
        - id: addons
          label: Add-ons and recovery
          value: Success+ and account-data services
          note: Recovery and data services broaden monetization beyond base transaction collection.
          claimRefs: [CI001, CI007]
        - id: monetization
          label: Revenue capture
          value: Transaction fees plus monthly committed-merchant fees
          note: The assigned public pool confirms value claims today, but the clearest explicit monetization proxy is still the 2022 external pricing analysis.
          claimRefs: [CI007, CI008, CI009]
        - id: economics
          label: Gross-profit and cash outcome
          value: Margin path improving, capital data still opaque
          note: FY25 profitability improved, yet current gross margin, cash, runway, and sale proceeds remain undisclosed.
          claimRefs: [CI005, CI010, CI012]
    approximationNotes: This flow synthesizes disclosed workflow stages and monetization proxies; it is conceptual rather than a value-proportional bridge because public sources do not provide a full current margin waterfall.
    claimRefs: [CI001, CI002, CI005, CI007, CI008, CI010, CI012, CI013]
callouts:
  - calloutType: insight
    title: Workflow distribution is the clearest public GTM proxy
    body: Sequence and Intelligent Billing suggest GoCardless is trying to embed payment collection inside existing billing or revenue workflows, which can improve retention and reduce direct-sales friction if the partner channel scales.
    claimRefs: [CI002, CI013]
  - calloutType: risk
    title: Capital adequacy is still not publicly underwritable
    body: Historical funding and headcount are visible, but the assigned public evidence still does not quantify sale proceeds, cash on hand, burn, or runway after the Mollie transaction.
    claimRefs: [CI011, CI012]
