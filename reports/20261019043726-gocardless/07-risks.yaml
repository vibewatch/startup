company:
  name: GoCardless
chapter:
  number: 7
  title: Risks
  summary: >-
    GoCardless's highest current risk is execution around life inside Mollie after the
    September 2026 close: the deal is done and public messaging says contracts and service
    remain unchanged for now, but the public record still lacks detailed governance,
    product-bundling, and integration milestones. The next-highest risks are merchant
    cash-flow friction and support escalation during compliance holds, plus the strategic
    constraint that GoCardless is still a specialist bank-payments rail rather than a full
    checkout stack.
sections:
  - id: ranked-risk-outlook
    title: Ranked risk outlook
    body: >-
      The risk picture is more about execution and merchant fit than existential product
      validity. Public evidence still shows a capable bank-payments platform with broad
      integrations and geographic reach, but it also shows the limits of that focus:
      GoCardless emphasizes Pay by Bank, Direct Debit, and integrations rather than card
      acceptance, and independent reviewers continue to frame the product as strong for
      recurring billing but a weak fit for merchants needing a full checkout or fast first-
      collection cash flow. That makes the core thesis sensitive to customer mix. If
      GoCardless wins more merchants that need hybrid card-plus-bank payment stacks before
      Mollie's combined product is operationally unified, product narrowness could raise
      churn, increase integration burden, or cap expansion. Monitorable kill criteria are
      merchant disruption during post-close integration, repeated account-hold complaints,
      or evidence that important new segments still require third-party card rails with no
      clear bundled roadmap.
    claimRefs: [CR011, CR012, CR014, CR015, CR016]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: regulatory-legal-and-governance
    title: Regulatory, legal, and governance risk
    body: >-
      The public record supports a regulated operating posture but not a fully de-risked
      governance picture. GoCardless and third-party reviewers both point to FCA oversight,
      GDPR-aware operations, and the company's role in handling Direct Debit compliance on
      behalf of merchants, which lowers onboarding complexity but also concentrates
      compliance and scheme-execution responsibility inside the platform. The more material
      current legal-governance risk is post-acquisition opacity: Mollie says the
      acquisition is completed, no immediate changes are planned, and integration will be
      phased, but public materials do not yet spell out post-close governance rights,
      data-sharing mechanics, or when combined card-plus-bank packaging becomes generally
      available. The practical diligence path is to obtain post-close org charts, board
      and delegated-risk ownership, data-sharing controls, and any revised contractual or
      scheme-liability terms.
    claimRefs: [CR002, CR008, CR011, CR012, CR017]
    tableRefs: [TR001]
  - id: operational-partner-and-financial-exposure
    title: Operational, partner, and financial exposure
    body: >-
      Operationally, the biggest public red flags are not catastrophic outages but merchant
      working-capital friction and support escalation when compliance reviews intervene.
      Independent reviews describe slow payout timing, first-mandate holds, and account
      suspensions during AML reviews, while GoCardless's own materials market faster one-
      off Pay by Bank settlement and automated recovery tooling rather than claiming those
      frictions disappear for all use cases. Partner reliance is also visible in the 2026
      push into embedded billing: integrations with Sequence and Intelligent Billing deepen
      workflow stickiness and can improve failed-payment recovery, but they also make
      roadmap delivery and merchant experience partly dependent on partner execution.
      Financial-model risk remains a diligence gap rather than a quantified public failure:
      Mollie disclosed that GoCardless had its first EBITDA-positive quarter in summer
      2025, but there is still no public FY26 cash-generation, margin, or concentration
      disclosure sufficient to underwrite downside with precision.
    claimRefs: [CR004, CR006, CR007, CR009, CR010, CR018]
    tableRefs: [TR003]
