callouts:
  - calloutType: risk
    title: Thesis-break triggers
    body: >-
      The risk case worsens materially if Mollie integration forces contract or service
      disruption, if merchant-hold complaints become a recurring public pattern, or if
      GoCardless still lacks a broadly available bundled card-plus-bank proposition after
      the combined platform has had time to execute post-close.
    claimRefs: [CR007, CR011, CR012, CR015]
