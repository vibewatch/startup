chapter:
  number: 2
  title: Market Analysis
  summary: 'insitro sits in a layered market rather than one clean TAM: a near-term buyer market for AI-enabled
    biopharma partnerships, a broader pharma R&D budget pool, and downstream disease markets in metabolism,
    neurodegeneration, and ophthalmology. Public evidence supports strong long-term demand and rising
    AI spend, but published market estimates are non-comparable and no reviewed source isolates a clean
    SAM or SOM for insitro’s exact cross-therapeutic model.'
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, adjacencies, and status-quo substitutes
  body: 'The first analytical mistake with insitro is to call its market simply “AI in pharma” or simply
    “obesity drugs.” The company is not yet a commercial drug seller, but it is also no longer a pure
    tools vendor. Its own platform and pipeline pages show a business model that uses multimodal human
    and cellular data, machine learning, and design tooling to generate both internal programs and partner-facing
    discovery output. That means the near-term monetizable market is partnership and milestone economics
    with pharmaceutical R&D buyers, while the downstream economic upside sits in much larger therapeutic
    end markets that will matter only if internal assets reach later development. The right boundary therefore
    has three layers: AI-enabled drug-discovery partnerships, insitro-controlled therapeutic programs
    in metabolism, neuroscience, and ophthalmology, and data-intensive discovery collaborations that strengthen
    the platform. The status-quo alternatives are internal pharma discovery teams, conventional CRO and
    medicinal-chemistry workflows, and competing AI-biopharma platforms such as Recursion, Schrödinger,
    Relay, and Evotec—not consumer digital-health tools or hospital IT software.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: sizing-lenses-and-sam-limits
  title: 'Sizing lenses: AI market forecasts, R&D budgets, and disease-burden demand'
  body: 'Public sizing data exists, but it does not line up neatly enough to produce a single underwritten
    TAM. Analyst pages for AI in pharma and AI in drug discovery are directionally bullish, with forecasts
    ranging from low-single-digit billions today to mid-teens or even mid-twenties of billions by the
    early 2030s. Those estimates, however, mix different category boundaries: some include broad pharmaceutical
    AI workflows, some isolate drug discovery, and others include the wider precision-medicine software
    stack. A second lens is the budget pool behind the buyer: EFPIA estimates EUR 55 billion of pharmaceutical
    R&D spend in Europe alone in 2024, which shows the scale of the buyer base that can fund partnerships.
    A third lens is demand pull from disease burden. WHO reports 890 million adults living with obesity,
    insitro’s Lilly release says MASLD affects about 100 million people in the United States, WHO reports
    2.2 billion people with vision impairment, and CDC estimates 9.6 million U.S. people with diabetic
    retinopathy. These figures confirm large demand domains around insitro’s programs, but they are not
    interchangeable with a software or partnership TAM. The clean conclusion is that insitro’s market
    must be sized through multiple evidence-constrained lenses, not through one generic headline number.'
  claimRefs:
  - CM009
  - CM010
  - CM011
  - CM012
  - CM013
  - CM014
  tableRefs:
  - TM002
  figureRefs: []
- id: buyers-users-and-adoption-path
  title: Buyer, user, payer, and adoption path
  body: 'insitro’s buyer map changes depending on where one sits in the value chain. In the current partnership-led
    model, the buyer is usually a pharmaceutical R&D or business-development organization deciding whether
    insitro’s discovery engine, disease models, or target work justify upfront capital and milestone exposure.
    The functional users are scientific teams on both sides, while the budget owner is a pharma R&D or
    external-innovation budget. The adoption path is therefore evidence-heavy: platform validation, disease-model
    credibility, target nomination, and then negotiated development rights with milestone structures.
    In a later internal-drug path, the buyer map shifts. Physicians, health systems, and payers become
    relevant only after clinical proof and regulatory clearance, and that path is still mostly hypothetical
    for insitro. The data collaborations with Genomics England and Moorfields sit alongside this as enabling
    inputs rather than direct clean-market outputs. This is why buyer analysis matters so much for valuation:
    the company’s immediate revenue path is controlled by sophisticated counterparties who demand proof
    long before patients or payers ever see the product.'
  claimRefs:
  - CM005
  - CM006
  - CM007
  - CM008
  tableRefs:
  - TM003
  figureRefs: []
- id: growth-drivers-constraints-and-open-gaps
  title: Growth drivers, adoption constraints, and preserved contradictions
  body: The growth case for insitro’s market is straightforward. Disease burdens in obesity, MASLD, vision,
    and neurodegeneration are large; pharmaceutical R&D budgets are enormous; and AI is spreading deeper
    into the medicines lifecycle across discovery, safety, and operations. At the same time, the category’s
    adoption constraints are unusually important. WHO and EMA both stress governance, risk management,
    and lifecycle controls. McKinsey says pharma has not yet seen clear proof that AI alone materially
    shortens timelines or boosts success rates, and KPMG notes that tougher financing conditions pushed
    buyers toward lower-risk structures. Those facts mean enthusiasm does not automatically convert into
    premium economics. Investors therefore need to preserve two tensions instead of collapsing them. First,
    analyst market forecasts are bullish but non-comparable. Second, disease burden confirms demand, but
    it does not prove that insitro captures software revenue, partnership revenue, or future product revenue
    at attractive conversion rates. The chapter should therefore carry forward explicit gaps around exact
    SAM, buyer conversion, and category-level proof of AI productivity.
  claimRefs:
  - CM015
  - CM016
  tableRefs: []
tables:
- id: TM001
  slug: market-definition-table
  title: Market definition table
  description: Boundary logic for the market layers that matter to insitro today.
  columns:
  - Segment / category
  - Included spend or activity
  - Excluded spend
  - Buyer / payer
  - Relevance to insitro
  rows:
  - - AI-enabled drug-discovery partnerships
    - Upfronts, milestones, option fees, and research funding tied to target discovery, model building,
      and program design
    - Commercial drug sales, hospital software, broad consumer health apps
    - Large-pharma R&D and BD budgets
    - Immediate monetization path; this is where insitro signs deals today
  - - Internal metabolic-disease therapeutics
    - Future revenue from obesity, MASLD, and related metabolic programs if assets advance
    - Primary-care chronic-disease management services or wellness subscriptions
    - Future prescribers, payers, and specialty pharma channels
    - Important long-term upside, but mostly pre-commercial today
  - - Internal neuroscience therapeutics
    - ALS, FTD, and related neuro target economics through partnerships or internal assets
    - Neurology care delivery spend unrelated to drugs
    - Pharma partners today; clinicians and payers later
    - Current BMS collaboration makes neuroscience commercially relevant already
  - - Ophthalmology and neurodegeneration data layer
    - Retinal imaging and multimodal discovery inputs that improve target selection and patient segmentation
    - General hospital IT, PACS software, and routine ophthalmology services
    - Research partners and future pharma users
    - Strategic moat and discovery input rather than clean standalone revenue category
  - - Status-quo substitute stack
    - In-house pharma discovery, conventional CRO workflows, medicinal chemistry, and competitor AI platforms
    - Consumer digital health, billing software, or general hospital analytics
    - Existing pharma budgets already allocated to incumbent workflows
    - Defines what insitro must displace to win budgets
  notes: Rows define market boundary logic, not additive TAM buckets. Included and excluded spend intentionally
    separates present buyer economics from future therapeutic upside.
