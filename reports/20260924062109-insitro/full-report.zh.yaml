      - number: '6.3'
        title: 留存与耐久性：BMS 是最佳信号，Lilly 仍早，Gilead 不透明，使用指标缺席
        blocks:
          - type: paragraph
            body: >-
              留存和耐久性正是公开记录明显变薄的地方。公司没有披露 NRR、GRR、流失率、NPS、活跃客户数或账户级收入留存指标。最强耐久性代理指标是观察到的连续性：BMS 自 2020 年到 2026
              年保持公开并跨四个不同证据点扩展，使其成为 insitro 在赢得科学信任后可以加深标杆关系的最佳证据。Lilly 令人鼓舞，但更新，目前只有 2024 至 2025 年的公开序列。Gilead
              证明大型药企早期愿意付费，但原始期限之后的当前状态在已审阅来源中不可见。研究环境合作加入了另一类粘性。Genomics England 和 INSIGHT
              都描述了安全环境：数据留在受控基础设施内，导出受门控，工具或虚拟机为获批研究者配置。这种运营模式意味着上手摩擦和一定切换成本，但仍未揭示续约经济、用户满意度或重复使用质量。
            claimRefs:
              - CU001
              - CU002
              - CU003
      - number: '6.4'
        title: 扩张上行存在，但集中度风险主导可投资客户故事
        blocks:
          - type: paragraph
            body: >-
              扩张上行和集中度风险并存。上行面上，insitro 已证明客户关系可以从靶点发现推进到化学、模态扩展或生态暴露：BMS 跨靶点和模态拓宽；Lilly 拓宽到 ADMET 和 TuneLab；Genomics
              England 可以把 insitro 搜索暴露给更广的研究网络。下行面上，Joe Hand 2026 年公司声明把约 $150 million 合作收入归入仅三个名字——BMS、Lilly 和
              Gilead——但没有披露各自占比。这足以说明收入来源集中，却不足以判断收入质量。BioPharma Dive 2025 年裁员报道，包括 22% 裁员和现金跑道至 2027
              年的说法，强化了这样一种看法：insitro 仍像资本密集型生物科技公司运作，依赖少数交易对手和内部证据点。KPMG 和 McKinsey 把这置于 AI
              生物制药交易的常态中：合作定制化、重证据、重整合。结果是，客户基础在战略上可信，但仍过于不透明，不能当作多元化经常性收入引擎看待。
            claimRefs:
              - CU001
              - CU002
              - CU003
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险态势：临床转化和 AI 治理风险居前
        blocks:
          - type: paragraph
            body: >-
              insitro 的主要风险集中在两个紧密相连的问题上：把 AI
              驱动的发现推进临床，以及在监管环境下完成这件事；该环境正更明确要求使用场景、数据治理、生命周期管理和可信度证据。公开证据仍停留在临床前和合作阶段。MASLD 更新把 CTRO-1013 描述为正推进 IND
              准备工作并走向首次人体试验；裁员和现金跑道相关表述则显示，时间安排在财务上和科学上一样重要。如果临床转化放慢，里程碑时点和融资灵活性可能同时恶化。客户侧无法抵消这一风险，因为合作验证集中在 BMS、Lilly 和
              Gilead，而不是分散到广泛组合。因此，本章把临床就绪风险、AI 治理风险、集中度融资风险视为三类最重要风险；数据权利、质量认证不透明和人员执行风险则是放大器，而不是独立干扰项。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR011
      - number: '7.2'
        title: 监管、法律与数据治理风险：原则可见，公司特定证据有限
        blocks:
          - type: paragraph
            body: >-
              FDA 和 EMA 现在已经相当清楚地展示了 AI 用于药物开发时「好」是什么样。FDA 指出 AI 相关提交显著增加、基于风险的监管框架，以及使用场景的重要性。EMA
              明确把其反思文件从药物发现延伸到上市后，并强调偏见、患者安全、隐私和数据治理。对面向美国的项目，这些预期还叠加在围绕 IND 提交和电子记录的正式法律规则旁。相比之下，insitro
              的公开记录没有展示针对这些预期的验证包映射。法律图景同样混合。网站隐私政策很窄，且针对网站；它不能替代合作伙伴数据治理文件。Genomics England 和 INSIGHT
              展示了严肃的安全环境控制，但这些控制存在于合作伙伴环境中，也可能限制数据可移植性和复用。专利显示真实 IP
              布局，但自由实施、许可负担、诉讼历史和赔偿条款仍未公开。结果不是已知不合规的红旗，而是在监管方和成熟合作伙伴最关心的领域存在重大可见度缺口。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
