  - id: FE001
    type: stack
    slug: product-architecture-map
    title: 产品架构图
    summary: 从数据获取、因果发现，到疗法设计和项目交付，概览 insitro 的产品栈。
    approximationNotes: 这些层按公开平台和合作伙伴材料重构；未披露内部子服务。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE006
      - CE011
      - CE013
    data:
      layers:
        - label: 合作伙伴与队列数据层
          detail: 来自 Genomics England、INSIGHT/Moorfields、Lilly 等合作方的生物样本库、临床影像、基因组学和合作伙伴数据集
        - label: 表型 / 表征层
          detail: 从多模态数据提取 ClinML 表型、向量嵌入搜索和基础模型式表征
        - label: 细胞实验层
          detail: iPSC 和原代细胞模型、分化方案，以及自动化湿实验生成扰动数据
        - label: POSH / 扰动层
          detail: 用 pooled CRISPR、Cell Painting 和自监督向量嵌入，规模化推断基因功能
        - label: Virtual Human 因果生物学层
          detail: 整合人体和细胞证据，决定要瞄准哪类生物学机制
        - label: TherML / ChemML 设计层
          detail: 用主动学习选择模态，并设计小分子、寡核苷酸或生物制剂
        - label: 项目 / 部署层
          detail: 内部资产，加上 BMS ALS 项目、Lilly 代谢项目、Genomics England 向量嵌入搜索、INSIGHT OCT 建模等合作伙伴工作流
  - id: FU001
    type: journey-map
    slug: customer-journey-map
    title: 客户旅程图
    summary: insitro 的具名客户关系通常如何从未满足科学需求推进到部署、里程碑验证和扩展。
    approximationNotes: 该旅程图根据公开合作和安全环境材料重构，而非来自公司发布的 GTM 图。
    claimRefs:
      - CU001
      - CU004
      - CU006
    data:
      items:
        - label: 一家药企或研究数据机构发现某个疾病、数据集或工作流瓶颈，认为 insitro 的 ML 平台可能有用。
        - label: 科学尽调和商业结构设计明确数据权利、模态范围、安全环境要求，以及里程碑或支持条款。
        - label: insitro 工具或模型部署在合作伙伴工作流或安全研究环境中，而不是通过通用自助产品界面交付。
        - label: 首个验证点可能是获提名的靶点、付费里程碑、对外可用的搜索工具，或共同开发的基础模型。
        - label: 成功关系会扩展到新靶点、新模态、更广的合作伙伴网络访问，或间接生态使用。
        - label: 除非披露更多里程碑、条款细节或使用指标，否则外界仍难判断续约质量和变现情况。
  - id: FR001
    type: matrix
    slug: risk-heatmap
    title: 风险热力图
    summary: insitro 主要风险类别的相对可能性、影响、缓释成熟度和剩余严重性。
    approximationNotes: 分数是只基于公开证据的定性分析师判断。披露缺失常常拉低缓释成熟度分数。
    claimRefs:
      - CR001
      - CR011
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重性
      rows:
        - label: 临床转化 / 进入临床
          values:
            - label: High
              tone: warning
              detail: 尚无公开 IND 或人体数据
            - label: High
              tone: critical
              detail: 核心逻辑取决于临床转化
            - label: 中
              tone: neutral
              detail: 已有部分临床前进展和领导层补强
            - label: High
              tone: critical
              detail: 仍是最重要的单一未解决风险
        - label: AI 监管可信度 / 文档
          values:
            - label: High
              tone: warning
              detail: FDA 和 EMA 要求明确
            - label: High
              tone: critical
              detail: 可能拖慢申报并削弱合作伙伴信任
            - label: 低中
              tone: warning
              detail: 缺少公开映射的控制措施
            - label: High
              tone: critical
              detail: 验证负担还在前面
        - label: 合作伙伴集中 / 里程碑依赖
          values:
            - label: High
              tone: warning
              detail: 收入和验证集中在少数名字上
            - label: High
              tone: critical
              detail: 一旦暂停，现金和叙事都会受冲击
            - label: 中
              tone: neutral
              detail: 关系真实但集中
            - label: High
              tone: critical
              detail: 集中度披露仍不足
        - label: 数据权利 / 隐私 / 受治理访问
          values:
            - label: 中
              tone: neutral
              detail: 合作伙伴环境控制访问
            - label: 中高
              tone: warning
              detail: 可能限制复用和可携带性
            - label: 中
              tone: neutral
              detail: 安全环境是真实缓释手段
            - label: 中高
              tone: warning
              detail: 企业级整体姿态仍不透明
        - label: 资本强度 / 现金跑道
          values:
            - label: 中高
              tone: warning
              detail: 裁员和现金跑道表述显示压力
            - label: High
              tone: critical
              detail: 临床转化和算力都很贵
            - label: 中
              tone: neutral
              detail: 历史融资规模不小
            - label: High
              tone: critical
              detail: 具体现金和烧钱速度未披露
        - label: 人才 / 执行
          values:
            - label: 中高
              tone: warning
              detail: 跨职能人才稀缺，裁员又削掉冗余空间
            - label: 中高
              tone: warning
              detail: 执行质量会牵动其他所有风险
            - label: 中
              tone: neutral
              detail: 董事会和管理层升级有所帮助
            - label: 中高
              tone: warning
              detail: 公开信息还没有完全拆掉风险
  - id: FV001
    type: flow
    slug: recommendation-logic
    title: 建议逻辑——从证据到继续研究
    summary: 这张流程图把 insitro 最强的公开正面证据、缺失的估值输入，以及最终对价格敏感的建议串起来。
    approximationNotes: 这条流程刻意服务于决策，而非穷尽所有因素。它展示投资人只靠公开证据为一轮私募融资定价时，最核心的判断逻辑。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
    data:
      nodes:
        - id: f1
          label: 真实正面项
          detail: BMS / Lilly 验证、约 $150M 合作收入、约 $800M 融资
        - id: f2
          label: 定价输入缺失
          detail: 缺少当前价格、股权结构表、优先股堆叠和清晰年收入
        - id: f3
          label: 临床前内部价值
          detail: CTRO-1013 仍在 IND 支持 / FIH 准备阶段
        - id: f4
          label: 公开可比公司护栏
          detail: 当前公开可比公司群的估值约为 $0.5B-$2.46B
        - id: f5
          label: 剩余风险高
          detail: 监管、转化、集中度和融资风险仍会叠加
        - id: f6
          label: 继续研究 / 价格敏感
          detail: 只有价格接近「公开可比公司 + 溢价」逻辑时，才值得继续
        - id: f7
          label: 上调 / 下调监测项
          detail: IND 进展、合作伙伴扩张、干净条款，或惩罚性定价
      edges:
        - from: f1
          to: f6
        - from: f2
          to: f6
        - from: f3
          to: f6
        - from: f4
          to: f6
        - from: f5
          to: f6
        - from: f6
          to: f7
