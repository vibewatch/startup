      - number: '3.4'
        title: 护城河耐久性、商品化风险与反向竞争证据
        blocks:
          - type: paragraph
            body: >-
              看多 insitro 的最强理由，是公司不依赖单一算法叙事。它的护城河主张把多模态疾病数据、细胞模型、项目所有权和已展示的合作伙伴验证组合在一起。但这条护城河并非免疫商品化。如果买家在交易前越来越把 AI
              药物发现供应商视为可互换，定价权就会被压缩。如果药企内部自建能力改善，外部平台胃口会变弱。如果 Recursion、Insilico、Xaira 或 Isomorphic Labs
              等同行继续在资本、数据集广度或公开验证节奏上放大规模，它们可能塑造整个类别的买家预期。这里的反向证据很重要。BenevolentAI 的战略重组和拟退市说明，早期 AI
              药物发现领导地位并不保证持久经济性；Exscientia 被 Recursion 吸收则说明整合已经开始。因此，竞争结论更有层次：insitro
              有差异化，但只有后续证据显示其靶点质量更好、里程碑转化更强，或买家锁定比不断扩大的 AI 生物制药替代阵营更可防守，护城河才会显得持久。
            claimRefs:
              - CP001
              - CP002
              - CP003
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价：定制化合作经济，不是标价表
        blocks:
          - type: paragraph
            body: >-
              公开证据只支持一个清晰的变现结论：insitro 不是靠产品收入或公开席位制软件定价出售价值。相反，价值被打包进定制化药企合作和带里程碑付款的延展中。2020 年 Bristol Myers Squibb
              交易披露首付款 $50 million、近期运营里程碑 $20 million、超过 $2 billion 的后续里程碑以及特许权使用费。到 2024 年末，insitro 又宣布获得 $25 million 的
              BMS 里程碑；2025 年 ChemML 延展最高可再增加 $20 million 资金；2026 年靶点扩展公告又增加一个 $10 million 里程碑。Lilly 的 2024
              年结构显示了另一种经济设计：insitro 保留完整全球权利，Lilly 则有资格获得里程碑和特许权使用费；也就是说，合作虽能加速推进资产，但无法充当清晰的年度收入流。官方 2026 年公司信息称，insitro
              已在 BMS、Lilly 和 Gilead 上产生约 $150 million
              合作收入，但该数字是累计且未经审计的。结果是一个真实但难以标准化的收入基础；合作伙伴现金规模可观，公开定价透明度薄弱，且没有经审计的产品销售引擎。
