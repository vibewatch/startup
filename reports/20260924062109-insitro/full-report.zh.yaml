companyProfile:
  summary: >-
    insitro 是一家位于南旧金山的 AI 药物研发公司，由 Daphne Koller 于 2018 年创立。公司已从机器学习药物发现平台，转向自建覆盖代谢、神经科学和眼科的药物管线。BMS、Lilly 及更早期的 Gilead
    合作及其经济条款，为 insitro 提供了强于许多 TechBio 同行的外部验证；不过，它本质上仍是一家后期私营、处于临床前至 IND 准备阶段的平台型管线生物科技公司，而非商业化软件企业。
  foundedDate: '2018-01-01'
  founders:
    - name: Daphne Koller
      role: 创始人兼 CEO
      background: Stanford 机器学习教授、Coursera 联合创始人；她与市场的契合点，在于把 AI 和数据科学用于高维生物学问题。
      claimRefs:
        - CO001
        - CO006
  foundingLocation: South San Francisco, California, USA
  headquarters: South San Francisco, CA
  productSummary: insitro 把多模态人群队列与细胞数据、机器学习，以及内部和合作伙伴发现工作流串在一起。公开管线覆盖代谢、神经科学和眼科；CTRO-1013 是目前最接近进入临床的内部资产。
  customerFocus: 公开可见的客户合作集中在少数大型药企，而非广泛的软件客户群。BMS 是持续性最强的信号，Lilly 是第二个主要伙伴，Gilead 则提供早期验证。
  businessModel: insitro 一边靠药企合作获得里程碑资金，一边保留内部管线的长期期权价值。定价、续约和收入确认细节仍不透明，因此更适合把它看作经合作验证的 TechBio 平台，而非定价透明的产品公司。
  stage: private, late-preclinical
