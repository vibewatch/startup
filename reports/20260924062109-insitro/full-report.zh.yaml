      - number: '5.3'
        title: 部署、成熟度与路线图：真实合作伙伴使用，但证据仍多停留在临床前
        blocks:
          - type: paragraph
            body: >-
              最强成熟度证据不是广泛客户铺开，而是在具体合作和命名项目中反复使用。Bristol Myers Squibb 最初让 insitro 建立 ALS 和 FTD 疾病模型，随后把关系转成已提名靶点、基于
              ChemML 的分子设计阶段，最后扩展到覆盖寡核苷酸和小分子的多模态合作。Lilly 同样从围绕 siRNA 递送和抗体发现的代谢协议，扩展到小分子 ADMET 模型开发。药企之外，Genomics
              England 和 INSIGHT/Moorfields 描述了 insitro 技术在安全环境中的合作伙伴专属部署，说明至少部分平台组件可以交付给外部组织。从 2025 年末到 2026
              年的路线图也重要：POSH 从概念推进到论文发表和公开代码发布；TherML 作为带品牌的治疗设计层推出；BAT-01
              作为端到端栈产出的命名临床前资产浮出。即便如此，成熟度天花板仍很清楚。公开证据大多止于临床前或合作阶段里程碑，而不是获批产品或公开人体疗效结果。
            claimRefs:
              - CE015
              - CE016
      - number: '5.4'
        title: 差异化、数据护城河与 IP：生物学、数据密度和模态广度交叉处最强
        blocks:
          - type: paragraph
            body: >-
              insitro 的差异化似乎并不建立在单一模型架构或单一治疗模态上。更强的公开故事，是把大规模人类数据资产、高密度细胞扰动系统，以及能跨模态选择和工程化干预的整合设计循环组合起来。POSH
              给公司提供了一个具体技术证据点，因为它展示了 insitro 如何试图打破表型筛选中规模与深度的取舍；cp-posh 仓库也给出真实开发者信号，说明部分工作可复现。TherML
              通过把靶点选择连接到模态选择，延展了护城河主张；这比仅仅围绕一个靶点优化小分子更有野心。Justia 专利记录也表明，insitro 正在建立真实的图像和组学 IP
              资产。尽管如此，护城河可见度仍不完整。栈中最有价值的部分很可能是私有数据集、内部反馈循环和合同数据权利，而公开记录无法清晰暴露这些。
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
              - CE014
      - number: '5.5'
        title: 信任、安全、隐私、合规与质量控制：原则可见，审计不可见
        blocks:
          - type: paragraph
            body: >-
              公开信任信号偏正面，但仍不完整。Genomics England 和 INSIGHT/Moorfields 都强调安全研究环境和受限数据访问；这很关键，因为 insitro
              平台触及敏感临床和影像数据集。外部框架也清楚展示「好」应该是什么样：FDA 强调用于药物决策的 AI 模型需要基于风险的可信度评估；EMA 强调数据治理和生命周期管理；WHO
              把信任和伦理视为基础，因为技术部署跑在法律前面。但 insitro 自身公开披露在运营细节上仍很薄。已发布隐私政策聚焦网站，不是合作数据控制的窗口；没有来源材料披露 SOC 2、ISO
              27001、GxP、HIPAA 或 HITRUST 认证姿态。这留下了熟悉的尽调结论：公司似乎理解正确的治理语言，但投资人仍需要私下证据，验证这些控制是否以工业级深度落实到真实发现工作流中。
            claimRefs:
              - CE001
              - CE002
              - CE003
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群细分：少数药企付款方、少数外部用户，没有广泛安装基础
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月，insitro 的客户图谱很窄。最清晰的直接付款方是 Bristol Myers Squibb、Lilly，以及历史上的 Gilead：这些大型药企交易对手用 insitro
              平台发现靶点、设计模态，并建立机器学习驱动的化学或 ADMET 能力。与这些付款方分开的，是 Genomics England 和 INSIGHT/Moorfields 等研究环境合作伙伴；这说明 insitro
              的工具能进入受严格治理的外部数据基础设施。另一条触达路径来自 Lilly TuneLab 和 Catalyze360 获得的间接生态触达；insitro 构建的模型可能触达生物科技用户，但这些用户不一定成为
              insitro
              直接客户。同样重要的是缺席项：已审阅来源没有出现自助产品、公开定价、市场平台招商动作或长尾命名企业账户。主页、平台、使命和管线材料仍描述一家在内部项目和合作项目之间平衡的公司，因此当前客户经济依赖少数高价值关系，而不是广泛安装基础。
