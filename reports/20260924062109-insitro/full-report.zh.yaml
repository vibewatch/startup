      - number: '4.2'
        title: GTM 与销售效率代理指标：企业级药企账户和先落地再扩张动作
        blocks:
          - type: paragraph
            body: >-
              insitro 的市场拓展更像面向大型药企的战略性业务开发，而非广泛的软件分销。每份披露的协议都经过定制，赋予较多项目权利，并围绕治疗项目设计，而非订阅设计。BMS 关系尤其有启发性：2020
              年发现合作、2024 年里程碑转化、2025 年 ChemML 延展，以及 2026 年新增靶点。这一串动作像先落地再扩张销售：先靠科学进展赚到信任，再通过后续工作变现。KPMG 和 McKinsey 都把药企
              AI 采用描述为重证据、重合作，这与 insitro 的公开姿态一致：它是战略发现能力，而不是通用 AI
              工具。由于没有公开来源披露获客成本、胜率或回本周期，销售效率只能用少数标杆账户随时间加深的能力来代理。公开证据说明 BMS 已经扩展；但还不能证明 insitro
              拥有广泛、可复制、多客户商业引擎，且漏斗效率可衡量。
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
      - number: '4.3'
        title: 成本结构、毛利率路径与公开业务进展
        blocks:
          - type: paragraph
            body: >-
              成本结构比验证情况更容易推断。insitro 运营湿实验室生物学、人类细胞数据生成、化学和大量算力，而不是轻量 SaaS 栈。2025 年 ChemML 延展特别强调了 192-H100 GPU
              集群；公司平台也依赖大规模数据生成和内部管线研发。因此，即便长期里程碑或特许权使用费可能带来吸引力，当前业务的毛利率也不太可能达到纯软件水平。公开业务进展同样参差不齐。官方材料如今提到约 $150 million
              累计合作收入，对私有生物科技公司有意义；但第三方追踪器对年化收入和员工数分歧很大。GetLatka 报告 2024 年收入 $69 million、员工 262 人；Usearch 列出收入 $7.5
              million、员工 267 人；Awaira 报告约 300 名员工和一个很宽的估计 ARR 区间；WorxForm 则把融资压缩成单一 $400 million
              数字。较稳妥的结论是：合作现金确实存在，也很重要；但没有可靠的公开来源能核对年度收入、毛利率和运营规模。
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI016
      - number: '4.4'
        title: 资本充足性与同业资本强度基准
        blocks:
          - type: paragraph
            body: >-
              资本充足性必须从融资、合作现金和成本重置中重建。公开报道描述，2019 年前已融资超过 $100 million，2020 年中累计风投资金 $243 million；随后 insitro 在 2021
              年披露进一步 $400 million Series C。到 2026 年 2 月，公司称自己有约 $800 million 资本支持；这个更大数字可能混合了股权、合作现金或其他资本来源。因此，2025
              年裁员在财务上很重要。BioPharma Dive 报道 insitro 裁掉 22% 员工，剩余约 230 人，并把运营目标指向 2027 年。行业背景让这种行为并不意外：EY 2025
              年生物科技报告称，后续融资是 2016 年以来最差，IPO 窗口仍低迷，而裁员持续广泛到 2026 年。公开 AI 生物制药可比公司进一步强化烧钱风险。Recursion 2023 年在 $44.6
              million 收入上亏损约 $328 million；Relay 没有产品收入却亏损 $342 million；Schrödinger 即使收入基数大得多，仍消耗约 $136.7 million
              经营现金。insitro 很可能比这些同行更有资本纪律，但公开数据不足以证明。
            claimRefs:
              - CI003
      - number: '4.5'
        title: 公开财务缺口与无法调和的估计
        blocks:
          - type: paragraph
            body: >-
              投资判断的难点不是没有信号，而是信号彼此无法核对。公开来源未披露当前现金、月度烧钱、递延收入、债务、租赁承诺或项目支出。追踪器对融资、收入、估值和员工数说法不一；公司披露的资本和合作收入也是累计数，而非经审计的期间数据。即便有公开可比数据，也回答不了
              insitro 自身的问题：合作现金有多少确认为收入，活跃合作的毛利率是多少，又有多少资金已投向内部临床项目。上市可比公司的披露只能帮助界定行业资本强度，不能替代 insitro
              自身数据。因此，现金跑道、扣除合作现金后的烧钱速度、下一轮融资规模和稀释风险等关键判断，仍要依赖非公开材料。
            claimRefs:
              - CI016
      - number: '4.6'
        title: 财务结论：真实合作伙伴验证仍伴随高融资依赖
        blocks:
          - type: paragraph
            body: >-
              insitro
              并非毫无验证的科学项目。大型药企已向它支付实际合作款，核心合作至少多次延展；平台业务也为公司打开了里程碑、特许权使用费和自有资产价值等路径。这比完全没有变现的临床前生物科技公司更有经济基础。但公开证据仍显示它依赖融资：现金余额未经审计、年度收入无法核对、义务时间表未披露，也没有足够公开数据评估当前毛利率或烧钱速度。2025
              年重组说明，管理层仍优先把资源投向关键验证节点，而非追求自我造血的经营杠杆。与上市 AI 生物医药同行相比，insitro
              很可能拥有财务上可信的平台故事，但现有公开数据还不足以用传统模型精确估值。关键尽调问题仍是当前现金、年度合作收入、各项义务，以及按资产和阶段拆分的项目支出。
            claimRefs:
              - CI001
              - CI002
              - CI003
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 工作流语境下的产品定义：先是发现系统，其次才是产品 SKU
        blocks:
          - type: paragraph
            body: >-
              公开材料一贯将 insitro
              描述为一套工业化药物发现系统，而非软件供应商。它整合多模态人群队列和临床数据、内部生成的细胞与扰动数据，再用机器学习提出疾病生物学的因果假设；之后还会把发现结果推进到治疗设计，而非止步于靶点排序。客户买到的「产品」也因对象而异：药企伙伴获得从生物学发现到干预设计的工作流；数据伙伴可能部署向量搜索或共同开发的基础模型；insitro
              则用这套系统产出并保留自有管线资产。公开资料没有定价、自助 API 或标准化软件文档，也印证其对外提供的是按合作定制的工作流，而非通用企业 SaaS 平台。
            claimRefs:
