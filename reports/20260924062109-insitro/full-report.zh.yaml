chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与当前阶段
        blocks:
          - type: paragraph
            body: >-
              insitro 把自己定位为以因果生物学为基础的 AI 药物研发公司，而非纯软件或工具供应商。公司由 Daphne Koller 于 2018 年创立，总部位于南旧金山 East Grand Avenue 279
              号；公开使命是用多模态人类和细胞数据结合机器学习来解码疾病。这个定位很关键：insitro
              既不只开发单一治疗资产，也不提供通用机器学习平台；它要搭建一套可重复运转的引擎，从靶点发现走到特定模态的药物设计，再把成果推进为自有管线资产。官网和使命页面显示，公司仍专注于药物发现与开发，尚未商业化。它没有上市产品，但已披露项目组合，数据和设计合作也在增加；这让公司走出种子前「AI
              赋能生物科技」阶段，进入后期私有、支撑临床前到 IND 准备的运营阶段。
            claimRefs:
              - CO001
              - CO002
              - CO003
