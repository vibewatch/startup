      - number: '7.4'
        title: 人员、执行与终止标准：缓释措施存在，但举证责任仍在前方
        blocks:
          - type: paragraph
            body: >-
              公开记录里确有缓释因素。Amy Abernethy 进入董事会，带来临床开发和前 FDA 经验。Joe Hand
              的任命说明，公司进入运营要求更高的阶段后，已经把人才战略摆到台面上。合作机构的安全环境也显示，insitro
              对外协作时已经把部分高风险治理控制纳入工作方式。但这些缓释因素都没有消掉核心举证责任。公司仍需证明，它能把项目推进到临床，产出成熟合作方和监管机构都愿意接受的验证文件，并且不再进一步削弱执行能力或加深合作方集中。尽调最有用的可监测触发点不是模糊的进展印象，而是具体事件：申报状态、首次人体试验准备度、进一步裁员、缺失验证包、缺乏审计证据，以及合作方不续约或降低优先级。在这些问题厘清之前，正确姿态是把领导层补强视为有意义但不完整的缓释，残余风险仍然偏高。
            claimRefs:
              - CR007
              - CR008
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与估值框架：先守定价纪律，再谈热情
        blocks:
          - type: paragraph
            body: >-
              首要问题不是 insitro 是否令人印象深刻。答案显然是肯定的。真正的问题是，公开证据是否足够给它定价。公开来源显示不少正面因素：头部合作伙伴、BMS 多次扩展合作、累计合作收入约 $150
              million，以及已融资或被引用的资本约 $800
              million。但它们没有给出当前入场价格、优先股堆叠、当前现金余额、可靠年收入，或内部资产的人体数据验证点。因此，直接给出坚决买入或坚决回避都显得牵强。基于公开证据，诚实姿态是继续研究、价格敏感。正确框架不是单点目标回报，而是一组参考区间，由公开可比公司、最后已知融资锚点和证据状态假设拼出。如果公司报价接近公开可比公司集群并加上合理溢价，尽调值得做；如果价格已经按一个去风险的前沿平台来给，公开记录提示应放慢。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
      - number: '8.2'
        title: 投资逻辑与反向逻辑：合作方验证真实，经济性证据仍不完整
        blocks:
          - type: paragraph
            body: >-
              insitro 的正向逻辑不是假设。BMS 提供了本文件中最强的公开验证序列：首付款安排、已兑现的里程碑、平台扩展资金和新靶点提名。Lilly
              增加第二个重大关系，并保留通向可观下游期权价值的路径。公司还受益于治理和人才信号，包括 Amy Abernethy 的董事会角色和 Joe Hand
              的人才职责。这些资产并不轻。反向逻辑在于，最重要的价值驱动因素仍处于临床前或私人信息状态。CTRO-1013 仍在推进 IND
              支持工作，还没有进入人体验证。收入可见度很差，公开跟踪网站之间差异巨大。合同条款、数据权利、优先权悬置，以及当前现金和烧钱情况都未公开。换句话说，insitro
              可能是家好公司，但公开记录仍更容易为愿景定价，而不是为已验证经济性定价。这个差别应主导投资姿态。
            claimRefs:
              - CV002
              - CV003
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: 融资背景与入场纪律：旧锚点、嘈杂跟踪网站、容错空间有限
        blocks:
          - type: paragraph
            body: >-
              最明确的融资锚点仍是 2021 年 Series C 轮。insitro 官方披露融资 $400 million，Forge 估算投后约 $2.57
              billion。除此之外，公开估值可见度明显变弱。GetLatka 和 Awaira 都把 insitro 放在低 $2 billion 区间，但它们在收入、融资总额，甚至基本轮次细节上相互冲突。Usearch
              将收入压到 $7.5 million，而 GetLatka 声称 $69 million。这种分歧不是小会计问题；它意味着公开跟踪网站只能当粗略路标。实际结果不是目标价，而是一条入场纪律规则。有效投后估值低于约
              $2.0 billion 且条款干净时，机会才开始值得深入研究。在旧的 $2.57 billion 锚点附近，公开记录只支持有限上行。高于约 $3 billion，投资人就在为公开文件没有包含的私人证据付费。
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.4'
        title: 可比公司背景与情景区间：公开技术生物企业估值给出护栏
        blocks:
          - type: paragraph
            body: >-
              防止付高价的最强公开保护是可比公司组。截至 2026 年 5 月，Eikon 交易市值约 $0.54 billion，Absci 约 $0.90 billion，Schrödinger 约 $0.95
              billion，Recursion 约 $1.73 billion，Relay 约 $2.46 billion。这些同行并不完美，但每一个都给出有用约束。Eikon
              显示，公开市场可以多快重置早期证据故事。Absci 显示，AI 生物学平台估值可能长期低于 $1 billion。Schrödinger
              显示，即使计算平台商业化程度更高，也未必能获得软件公司式溢价。Recursion 显示，规模、资本和合作伙伴并不自动支撑很高倍数。Relay
              显示，更清晰的临床资产可以将估值推至上市可比公司区间上沿，但仍不会进入无约束地带。在这个背景下，insitro 的公开证据基准情景应落在约 $1.5-2.5 billion，悲观情景约 $0.8-1.3
              billion；只有临床进入和合作方转化明显改善时，乐观情景才约 $3.0-4.5 billion。
            claimRefs:
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
      - number: '8.5'
        title: 退出准备度、投资逻辑破裂触发点与最终结论
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，insitro 还没到 IPO
              准备好状态。私人股份没有公开价格历史，公司也没有经审计的财务包、清晰的现金与烧钱数据，内部资产更没有可见的人体数据。因此，近期价值兑现更可能靠继续拓展合作、吸引战略方关注或进行下一轮私募融资，而不是直接按公开市场投资判断的路径推进。最终尽调重点也由此明确：投资人需要当前股权结构表和优先股堆叠、现金消耗与跑道模型、重大合作的合同条款和收入确认逻辑、CTRO-1013
              的 IND 关键路径，以及后期交易对手会要求的 AI 验证和安全材料。关键的投资逻辑破裂触发点同样具体：到 2027 年底仍无 IND
              或首次人体试验进展，再次发生重大人员重置，合作方不续约变得可见，或条款清单在溢价估值之上嵌入重度稀释。最终结论：继续研究，高风险、中等信心，且只在定价有纪律时推进。
            claimRefs:
              - CV001
              - CV002
              - CV003
      - number: '8.6'
        title: 图表证据
        blocks:
          - type: callout
            title: 在价格和条款明确前继续研究
            body: insitro 若价格合适，值得继续尽调；但公开资料不足以支持按溢价估值参与一轮条款未知的私募融资。
            calloutType: recommendation
            claimRefs:
              - CV001
          - type: callout
            title: 公开可比公司远低于前沿 AI 叙事暗示的水平
            body: Recursion、Relay、Schrödinger、Absci 和 Eikon 都处在一个公开市场区间，约束投资人在没有更强私人证据时应为 insitro 支付的价格。
            calloutType: risk
            claimRefs:
              - CV016
          - type: callout
            title: BMS 给出真实验证，但不足以抹平条款不透明
            body: BMS 合作一再兑现，是认真评估 insitro 的最强理由；价格、优先权和当前经济状况仍未公开，则是必须保持纪律的原因。
            calloutType: insight
            claimRefs:
              - CV011
