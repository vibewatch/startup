      nodes:
        - id: n1
          label: 股权资本基础
          detail: 2019 年前 >100M，2020 年达到 $243M，2021 年 Series C +$400M；公司后续表述称资本约 ~$800M。
          claimRefs:
            - CI003
        - id: n2
          label: 平台 / 实验室 / 计算建设
          detail: 资本投向数据生成、使能数据集、互补技术、化学能力和重计算发现基础设施。
          claimRefs:
