  - id: FP001
    type: quadrant
    slug: competitive-positioning-map
    title: 竞争定位图：平台广度 vs 公开证据
    summary: 象限图按平台雄心广度和已审阅来源中可见的公开证据或验证数量，对 insitro 和主要同行定位。
    approximationNotes: 坐标轴使用从已审阅公开证据推导的 1-10 定性评分。x 越高，平台雄心越广；y 越高，公开证据、合作关系或临床推进越可见。
    claimRefs:
      - CP002
      - CP006
      - CP009
      - CP012
    data:
      points:
        - label: insitro
          x: 7
          'y': 5
