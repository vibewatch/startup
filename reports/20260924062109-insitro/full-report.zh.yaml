  - id: FI001
    type: flow
    slug: revenue-model-bridge
    title: 收入模型桥
    summary: 流程图展示 insitro 如何把已融资本和平台投入转化为当下的合作现金，以及之后期权式的下游经济收益。
    approximationNotes: 该图是结构图，不是预测。它映射公开披露所暗示的价值路径，而不是预测财务结果。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI006
      - CI007
      - CI008
