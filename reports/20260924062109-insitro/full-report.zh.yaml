      - number: '1.3'
        title: 资本结构、合作经济与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              公开数字之所以不一致，是因为 insitro 的资金既来自股权融资，也来自合作现金。Forbes 报道，2020 年 Series B 后累计风险投资达到 $243 million；insitro 2021
              年新闻稿记录了由 CPP Investments 领投的 $400 million Series C。后续公告把合作现金也算入资本后，先后提到超过 $700 million、约 $800 million
              的资本；第三方追踪器给出的融资和估值数字也彼此冲突。较稳妥的判断是：insitro 获得了顶级私募投资人和可观的药企合作现金，但不能把任何一个公开数字当作定论。合作伙伴的经济分量也不同：Gilead 验证了早期
              NASH 路线；Bristol Myers Squibb 是经济分量最大的神经科学合作方；Lilly 则通过 2024 年和 2025
              年协议拓宽代谢布局。合作集中带来上行空间，也放大融资风险：少数交易对手贡献了大部分可见的外部验证、里程碑现金和下游期权价值。
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
              - CO013
              - CO014
              - CO015
      - number: '1.4'
        title: 里程碑与管线演进
        blocks:
          - type: paragraph
            body: >-
              把 insitro 的发展放在一连串里程碑中看，才能看清数据与机器学习平台如何逐步延伸为更广的治疗管线。Gilead 合作和 2020 年 Bristol Myers Squibb ALS
              协议，说明大型药企愿意为 insitro 的发现引擎付费。下一阶段加入更大规模股权支持和 Genomics England 等研究合作，随后又通过 Lilly 代谢疾病合作、Bristol Myers
              Squibb 带里程碑付款的 ALS 靶点工作，更明确地搭建管线。到 2025 和 2026 年，运营模式明显更工业化：公司通过 Moorfields 扩大眼科和神经退行性疾病数据网络，在管线页面披露肥胖和
              MASH 项目，并在收购 CombinAbleAI 后推出
              TherML。当前披露组合覆盖代谢、神经科学和眼科，共有八个命名项目，但仍没有上市产品，也没有公开临床阶段资产。因此，里程碑时间线比传统商业化时间线更重要。
            claimRefs:
              - CO005
              - CO014
              - CO015
              - CO016
      - number: '1.5'
        title: 反向信号与未决尽调缺口
        blocks:
          - type: paragraph
            body: >-
              公开来源中最清晰的反向信号是 2025 年裁员。BioPharma Dive 报道 insitro 裁员 22%，剩余约 230
              名员工，并明确将裁员与临床准备和融资环境趋紧联系起来。这一点值得关注：追踪器给出的员工数、融资总额和估值差异很大，公司实际情况远没有表面叙事那么清楚。收入质量也难判断：低可信度追踪器虽给出收入估算，但已审阅的公开来源没有披露经审计的当前收入构成，也没有提供资产负债表勾稽。总体而言，问题并非
              insitro
              并非缺乏技术野心或合作伙伴验证；真正的问题是，投资人最需要精确信息的地方，公开尽调材料恰恰最薄。当前估值、客户集中度、债务或老股交易历史，以及实际运营规模仍未厘清，后文应把它们当作待核实的投资问题，而非既定事实。
            claimRefs:
              - CO001
              - CO002
              - CO003
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、邻近领域与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              分析 insitro 最容易犯的第一个错误，是简单称其市场为「药企
              AI」或「肥胖药物」。公司还不是商业化药物销售方，但也不再是纯工具供应商。它自己的平台和管线页面显示，商业模式是用多模态人类和细胞数据、机器学习以及设计工具，产出内部项目和面向合作伙伴的发现结果。因此，近期可变现市场是药企研发买家的合作与里程碑经济；下游经济上行空间则落在大得多的治疗终端市场，只有内部资产进入更后期开发时才真正重要。正确边界有三层：AI
              驱动的药物发现合作、insitro 控制的代谢 / 神经科学 / 眼科治疗项目，以及强化平台的数据密集型发现合作。现状替代方案是药企内部发现团队、传统 CRO 和药物化学工作流，以及
              Recursion、Schrödinger、Relay、Evotec 等竞争性 AI 生物制药平台，而不是消费者数字健康工具或医院 IT 软件。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: figure
            figureRef: FM001
            claimRefs:
