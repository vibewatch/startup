              - CM002
              - CM013
      - number: '2.2'
        title: 规模测算视角：AI 市场预测、研发预算与疾病负担需求
        blocks:
          - type: paragraph
            body: >-
              公开市场规模数据不少，但口径无法对齐，难以据此估出可用于投资判断的 TAM。分析师对药企 AI 和药物发现 AI 的预测整体偏乐观：市场规模从当前的低个位数十亿美元，预计到 2030
              年代初的一百多亿美元中段，甚至二百多亿美元中段。但这些估计混合了不同类别边界：有的纳入广义药企 AI 工作流，部分单独聚焦药物发现，另一些则涵盖更宽的精准医疗软件栈。第二个视角是买家背后的预算池：EFPIA 估计
              2024 年仅欧洲药企研发支出就有 EUR 55 billion，说明足以资助合作的买家基数有多大。第三个视角是疾病负担带来的需求拉动。WHO 报告 890 million 成年人患有肥胖；insitro 的
              Lilly 新闻稿称 MASLD 在美国影响约 100 million 人；WHO 报告 2.2 billion 人存在视力损害；CDC 估计美国有 9.6 million 糖尿病视网膜病变患者。这些数字确认了
              insitro 所涉疾病领域的需求确实庞大，但不能把疾病负担直接当成软件或合作 TAM。更稳妥的做法是从多个有证据支撑的角度测算 insitro 的市场，而不是套用一个笼统的市场规模数字。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.3'
        title: 买家、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              insitro 的买家图谱取决于所处价值链位置。在当前合作主导模式中，买家通常是药企研发或业务发展组织；他们判断 insitro
              的发现引擎、疾病模型或靶点工作是否值得前期资金和里程碑敞口。职能用户是双方科学团队，预算所有者是药企研发或外部创新预算。因此采用路径高度依赖证据：平台验证、疾病模型可信度、靶点提名，随后才是带里程碑结构的开发权谈判。在更后期的内部药物路径里，买家图谱会改变。只有临床证据和监管批准之后，医生、医疗系统和付款方才相关；而
              insitro 这条路径目前大多仍是假设。Genomics England 和 Moorfields
              的数据合作并列作为赋能输入，而不是直接清晰的市场输出。这就是买家分析对估值如此重要的原因：公司眼前收入路径由成熟交易对手控制；他们在患者或付款方看到产品很久之前，就会要求证据。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.4'
        title: 增长驱动、采用约束与保留的矛盾
        blocks:
          - type: paragraph
            body: >-
              insitro 所处市场的增长逻辑很直接。肥胖、MASLD、视力和神经退行性疾病负担巨大；药企研发预算庞大；AI 正在沿药物生命周期更深地渗透到发现、安全和运营环节。同时，该类别的采用约束格外重要。WHO 和
              EMA 都强调治理、风险管理和生命周期控制。McKinsey 认为药企还没有看到清晰证据，证明 AI 单独就能显著缩短周期或提高成功率；KPMG
              指出，更严峻的融资条件把买家推向风险更低的结构。这些事实意味着，热情不会自动转化为溢价经济。投资人需要保留两组张力，而不是把它们压平。第一，分析师市场预测看多，但彼此不可比。第二，疾病负担确认需求，却不能证明
              insitro 能以有吸引力的转化率获得软件收入、合作收入或未来产品收入。因此，本章应继续保留围绕精确 SAM、买家转化和类别层面 AI 生产力证据的明确缺口。
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同行、邻近公司、替代方案与潜在进入者
        blocks:
          - type: paragraph
            body: >-
              insitro 没有一个显而易见的单一对手。竞争集合至少分成三类。第一类是直接 AI 药物发现同行，它们同样试图把自有数据、机器学习和湿实验室工作流转成治疗管线或可合作项目。在已审阅公开来源中，最清晰的名字包括
              Recursion/Exscientia、Insilico Medicine、Xaira、Isomorphic Labs、Generate Biomedicines、Valo Health 和
              BenevolentAI。第二类是 Schrödinger、Evotec
              等邻近替代方案，它们用不同方式解决相似的买家需求：基于物理的计算发现、整合型研发服务或灵活合作。第三类是药企内部自建；大型买家若选择把发现留在内部，而不是外包给平台，默认替代方案就是内部自建。因此，insitro
              的竞争不只在原始科学上，也在于买家是否相信其多模态人类数据方法足以区别于不断增殖的 AI 叙事和替代工作流。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP011
              - CP014
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP006
              - CP009
              - CP012
      - number: '3.2'
        title: 竞争者画像：规模、融资与公开验证信号
        blocks:
          - type: paragraph
            body: >-
              直接同行中，Recursion/Exscientia 是公开市场中最清晰的规模基准：大型生物数据护城河、>10 个内部项目、>10 个合作项目，以及数亿美元已实现合作现金。Insilico 在生成式 AI
              同行中公开验证节奏最强，拥有 40 多个总项目、多个 IND 获批资产，以及披露的具体对外授权经济条款。Xaira 和 Isomorphic Labs 在私有同行中呈现最强的公开平台野心；Xaira
              推动虚拟细胞逻辑，Isomorphic 则把源自 AlphaFold 的设计延展到大型药企合作和大额融资。Generate Biomedicines 和 Valo Health
              的差异化更多来自模态或人类因果生物学角度，而不是清晰公开商业验证。BenevolentAI 仍是有意义的类别参照，因为其知识图谱传统让它成为早期 AI
              药物发现领导者；但其战略重组和拟退市也显示，一旦执行或市场胃口转弱，类别叙事会迅速压缩。合起来看，这组画像表明 insitro 有差异化，但不是该类别的规模或融资领导者。
            claimRefs:
