  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: No public source disclosed the current cap table, liquidation preferences, participating
      preference terms, anti-dilution protections, or any side-letter economics for the latest private
      shares.
    whyItMatters: These terms determine whether a nominally attractive headline valuation actually leaves
      common-equivalent upside for a new investor.
    diligencePath: Request the current cap table, financing history, term sheet, preferred-stock rights
      summary, SAFEs or convertibles if any, and a fully diluted waterfall under base and downside exit
      values.
    relatedQuestionRefs:
