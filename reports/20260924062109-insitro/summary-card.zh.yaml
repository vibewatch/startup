  topStrengths:
    - BMS 已用首付款、里程碑兑现、追加合作资金和新增靶点提名，为一家未上市 techbio 提供了罕见而扎实的公开验证。
    - 公开材料提及约 $800M 资本和约 $150M 合作收入，说明它获得的资金与商业验证都强于典型临床前平台故事。
    - 平台加管线的模式为 insitro 打开多条价值兑现路径，前提是 CTRO-1013 和后续自研资产进入临床、合作继续扩张。
    - Amy Abernethy、Joe Hand 等董事会与人才补强，显示公司正从早期叙事驱动的初创阶段走向更成熟的组织。
  topRisks:
    - 当前价格、股权结构表、清算优先权和最新融资条款都未公开，单靠公开信息无法判断入场价格是否合理。
    - 自研资产仍处于临床前阶段：CTRO-1013 正在推进 IND 申报支持性研究并准备首次人体试验，尚无人体数据验证。
    - 收入、现金余额和烧钱速度都不透明，难以据此建立可靠的收入倍数或现金跑道估值模型；公开追踪数据也彼此矛盾。
    - 上市 AI/TechBio 可比公司的估值大多在 $0.5B-$2.5B；没有更强的非公开证据，溢价空间就很有限。
    - AI 验证、安全和监管准备材料仍未公开，但合作伙伴信心和后续融资都要看这些材料。
  unresolvedGaps:
    - 当前完全稀释股权结构表和清算优先权瀑布
    - 当前现金余额、月度烧钱速度和下行风险现金跑道计划
    - 2021 年 Series C 之后的任何定价融资、老股交易估值或 409A 估值更新
    - BMS 与 Lilly 的合同条款、续约机制和收入确认方式
    - CTRO-1013 及相关工作流的 IND 关键路径和 AI 验证材料
    - 后期投资者或战略买家预期看到的安全、质量和审计材料
