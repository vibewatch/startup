          detail: Selects modality and designs small molecules, oligonucleotides, or biologics using active learning
        - label: Program / deployment layer
          detail: >-
            Internal assets plus partner workflows such as BMS ALS programs, Lilly metabolic programs, Genomics England
            embedding search, and INSIGHT OCT modeling
