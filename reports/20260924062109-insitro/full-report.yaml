      - number: '6.3'
        title: >-
          Retention and durability: BMS is the best signal, Lilly is early, Gilead is opaque, and usage metrics are
          absent
        blocks:
          - type: paragraph
            body: >-
              Retention and durability are where the public record thins materially. No NRR, GRR, churn, NPS,
              active-customer counts, or account-level revenue-retention metrics are disclosed. The strongest durability
              proxy is observed continuity: BMS has stayed public and expanded across four distinct proof points from
              2020 through 2026, making it the best evidence that insitro can deepen a marquee relationship once
              scientific trust is earned. Lilly is encouraging but newer, with only a 2024-to-2025 public sequence so
              far. Gilead proves that large pharma was willing to pay early, but current status after the original term
              is not visible in reviewed sources. Research-environment partnerships add a different kind of stickiness.
              Genomics England and INSIGHT both describe secure environments where data stay inside controlled
              infrastructure, exports are gated, and tools or virtual machines are provisioned for approved researchers.
              That operating model implies onboarding friction and some switching cost, but it still does not reveal
              renewal economics, user satisfaction, or repeat-usage quality.
            claimRefs:
              - CU001
              - CU002
              - CU003
      - number: '6.4'
        title: Expansion upside exists, but concentration risk dominates the investable customer story
        blocks:
          - type: paragraph
            body: >-
              Expansion upside and concentration risk coexist. On the upside, insitro has shown that a customer
              relationship can move from target discovery into chemistry, modality expansion, or ecosystem exposure: BMS
              broadened across targets and modalities; Lilly broadened into ADMET and TuneLab; Genomics England can
              expose insitro search to a wider research network. On the downside, Joe Hand’s 2026 company statement
              lumps roughly $150 million of partnership revenue into just three names—BMS, Lilly, and Gilead—without
              revealing the split. That is enough to indicate concentration, but not enough to underwrite quality of
              revenue. BioPharma Dive’s 2025 layoff coverage, including a 22% workforce reduction and runway-to-2027
              language, reinforces the view that insitro still operates like a capital-intensive biotech that depends on
              a handful of counterparties and internal proof points. KPMG and McKinsey contextualize this as normal for
              AI-biopharma deals: partnerships are bespoke, proof-sensitive, and integration-heavy. The result is a
              customer base that is strategically credible but still too opaque to treat as a diversified
              recurring-revenue engine.
            claimRefs:
              - CU001
              - CU002
              - CU003
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Severity-ranked risk posture: translation and AI-governance risks dominate the stack'
        blocks:
          - type: paragraph
            body: >-
              insitro’s risk stack is led by two tightly linked issues: getting AI-enabled discovery into the clinic,
              and doing so under a regulatory environment that is getting more explicit about context of use, data
              governance, lifecycle management, and credibility evidence. Public proof still sits at the preclinical and
              collaboration stage. The MASLD update frames CTRO-1013 as moving through IND-enabling work toward
              first-in-human, while layoffs and runway language show that timing matters financially as well as
              scientifically. This creates a compounding structure: if translation slows, milestone timing and financing
              flexibility can deteriorate together. The customer side does not offset this risk because partnership
              validation is concentrated in BMS, Lilly, and Gilead rather than spread across a broad portfolio. The
              chapter therefore treats clinic-readiness risk, AI-governance risk, and concentration-financing risk as
              the three most important categories, with data-rights, quality-certification opacity, and people-execution
              risk as amplifiers rather than independent distractions.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
