              - CP009
              - CP011
              - CP013
              - CP015
      - number: '3.3'
        title: Capability, packaging, GTM, and switching-cost comparisons
        blocks:
          - type: paragraph
            body: >-
              Capability comparison is less about who “uses AI” and more about what kind of proof each company can
              attach to that claim. insitro’s public angle is multimodal human and cellular data tied to disease
              understanding and internal pipeline formation. Recursion’s public edge is dataset and industrial scale.
              Insilico’s public edge is velocity and repeated program output. Xaira sells a virtual-cell ambition, while
              Isomorphic Labs sells AlphaFold-adjacent predictive design. Schrödinger is the clearest computational
              substitute, and Evotec is the clearest integrated-service substitute. Public pricing comparison is much
              weaker than capability comparison. In reviewed sources, economics are disclosed through collaboration
              structures, license-outs, milestone packages, and service or partnering posture—not through transparent
              seat pricing or menu-based packaging. That makes GTM and switching-cost analysis especially important.
              Buyers can likely multi-home across several platforms before deep integration, but switching costs rise
              once data, model workflows, or program rights are embedded inside a collaboration. Distribution power,
              meanwhile, still favors big pharma and later-stage commercial organizations over insitro and most private
              peers.
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP011
              - CP014
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
      - number: '3.4'
        title: Moat durability, commoditization risk, and adverse competitive evidence
        blocks:
          - type: paragraph
            body: >-
              The strongest case for insitro is that it does not rely on a single algorithmic pitch. Its moat claim
              combines multimodal disease data, cell-based models, program ownership, and demonstrated partner
              validation. But that moat is not immune to commoditization. If buyers increasingly view AI-drug-discovery
              vendors as interchangeable pre-deal, pricing power compresses. If internal pharma build improves, external
              platform appetite weakens. If peers such as Recursion, Insilico, Xaira, or Isomorphic Labs continue to
              out-scale insitro on capital, dataset breadth, or public proof cadence, they may shape buyer expectations
              for the whole category. The adverse evidence matters here. BenevolentAI’s strategic overhaul and proposed
              delisting show that early AI-drug-discovery leadership does not guarantee durable economics, while
              Exscientia’s absorption into Recursion shows that consolidation is already underway. The competitive
              bottom line is therefore nuanced: insitro is differentiated, but its moat will only look durable if later
              evidence shows better target quality, stronger milestone conversion, or more defensible buyer lock-in than
              a widening field of AI-biopharma alternatives.
            claimRefs:
              - CP001
              - CP002
              - CP003
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue model and pricing: bespoke partnership economics, not list pricing'
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports only one clean monetization conclusion: insitro is not being sold through product
              revenue or public seat-based software pricing. Instead, value is packaged through bespoke pharma
              collaborations and milestone-bearing extensions. The 2020 Bristol Myers Squibb deal disclosed $50 million
              upfront, $20 million in near-term operational milestones, more than $2 billion in downstream milestones,
              and royalties. By late 2024, insitro had announced a further $25 million BMS milestone; the 2025 ChemML
              extension could add up to $20 million more funding; and the 2026 target-expansion announcement added
              another $10 million milestone. Lilly’s 2024 structure shows a different economic design: insitro keeps
              full global rights while Lilly becomes eligible for milestones and royalties, meaning the partnership can
              accelerate assets without functioning as a clean annual-revenue stream. Official 2026 company messaging
              says insitro has generated about $150 million of partnership revenue across BMS, Lilly, and Gilead, but
              that figure is cumulative and unaudited. The result is a real but hard-to-normalize revenue base:
              meaningful partner cash, weak public pricing transparency, and no audited product-sales engine.
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI005
              - CI006
              - CI007
              - CI011
