      - number: '5.3'
        title: 'Deployment, maturity, and roadmap: real partner use, still mostly preclinical proof'
        blocks:
          - type: paragraph
            body: >-
              The strongest maturity evidence is not broad customer rollout but repeated use inside specific
              collaborations and named programs. Bristol Myers Squibb first engaged insitro to build ALS and FTD disease
              models, then converted that relationship into nominated targets, a ChemML-based molecule-design phase, and
              finally a multimodality expansion that spans oligonucleotides and small molecules. Lilly likewise
              broadened from metabolic agreements around siRNA-delivery and antibody discovery into small-molecule ADMET
              model development. Outside pharma, Genomics England and INSIGHT/Moorfields describe partner-specific
              deployments of insitro technology inside secure environments, showing that at least some platform
              components are deliverable to external organizations. The roadmap from late 2025 into 2026 also matters:
              POSH moved from concept to publication plus public code release, TherML launched as a branded
              therapeutic-design layer, and BAT-01 emerged as a named preclinical asset from the end-to-end stack. Even
              so, the maturity ceiling is still clear. Public proof stops mostly at preclinical or collaboration-stage
              milestones rather than approved products or public human efficacy outcomes.
            claimRefs:
              - CE015
              - CE016
      - number: '5.4'
        title: 'Differentiation, data moat, and IP: strongest where biology, data density, and modality breadth intersect'
        blocks:
          - type: paragraph
            body: >-
              insitro’s differentiation does not appear to rest on a single model architecture or a single therapeutic
              modality. The stronger public story is the combination of massive human-data assets, high-density cellular
              perturbation systems, and an integrated design loop that chooses and engineers interventions across
              modalities. POSH gives the company a concrete technical proof point because it shows how insitro tries to
              break the scale-versus-depth trade-off in phenotypic screening, and the cp-posh repository adds real
              developer signal that some of this work is reproducible. TherML extends that moat claim by linking target
              choice to modality choice, which is more ambitious than simply optimizing a small molecule against a
              target. The Justia patent record also suggests that insitro is building a real image-and-omics IP estate.
              Still, moat visibility remains incomplete. The most valuable parts of the stack are probably the private
              datasets, internal feedback loops, and contractual data rights that the public record does not expose
              cleanly.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
              - CE014
      - number: '5.5'
        title: 'Trust, safety, privacy, compliance, and quality controls: principles are visible; audits are not'
        blocks:
          - type: paragraph
            body: >-
              Public trust evidence is directionally positive but incomplete. Genomics England and INSIGHT/Moorfields
              both emphasize secure research environments and restricted data access, which is meaningful because
              insitro’s platform touches sensitive clinical and imaging datasets. External frameworks also give a clear
              view of what “good” should look like: FDA highlights risk-based credibility assessments for AI models used
              in drug decision-making, EMA emphasizes data governance and lifecycle management, and WHO frames trust and
              ethics as foundational because technical deployment is moving faster than law. But insitro’s own public
              disclosures remain thin on operational detail. The published privacy policy is website-focused, not a
              window into collaboration-data controls, and no sourced materials disclosed SOC 2, ISO 27001, GxP, HIPAA,
              or HITRUST certification posture. That leaves a familiar diligence conclusion: the company appears to
              understand the right governance language, but investors still need private evidence to verify whether
              those controls are implemented at industrial depth across the actual discovery workflow.
            claimRefs:
              - CE001
              - CE002
              - CE003
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Customer base segmentation: a few pharma payers, a few external users, and no broad install base'
        blocks:
          - type: paragraph
            body: >-
              As of May 2026, insitro’s customer map is narrow. The clearest direct payers are Bristol Myers Squibb,
              Lilly, and historically Gilead: large-pharma counterparties that use insitro’s platform to discover
              targets, design modalities, and build ML-enabled chemistry or ADMET capabilities. Separate from those
              payers are research-environment partners such as Genomics England and INSIGHT/Moorfields, which matter
              because they show insitro tools can be delivered into real external data infrastructures with strict
              governance. A third surface is indirect ecosystem reach via Lilly TuneLab and Catalyze360, where
              insitro-built models may reach biotech users without those users necessarily becoming direct insitro
              customers. What is absent is just as important: no self-serve product, public pricing, marketplace motion,
              or long tail of named enterprise accounts surfaced in reviewed sources. Home, platform, purpose, and
              pipeline materials still describe a company balancing internal programs with partnered programs, so
              current customer economics depend on a few high-value relationships rather than a broad installed base.
            claimRefs:
              - CU001
              - CU002
