company:
  name: insitro
chapter:
  number: 6
  title: Customers
  summary: 'insitro’s external customer base is narrow and strategic. The clearest paying counterparties
    are Bristol Myers Squibb, Lilly, and historically Gilead, while Genomics England and INSIGHT/Moorfields
    provide partner-side proof that insitro tools can operate inside real secure research environments.
    The strongest durability signal is BMS’s multi-step expansion from 2020 through 2026; Lilly shows
    early expansion, and Gilead’s current status is opaque. This is materially better customer proof than
    a logo wall, but it is still concentrated and under-disclosed: no public customer counts, retention
    metrics, satisfaction data, or account-level revenue mix are available.'
sections:
- id: customer-base-segmentation
  title: 'Customer base segmentation: a few pharma payers, a few external users, and no broad install
    base'
  body: 'As of May 2026, insitro’s customer map is narrow. The clearest direct payers are Bristol Myers
    Squibb, Lilly, and historically Gilead: large-pharma counterparties that use insitro’s platform to
    discover targets, design modalities, and build ML-enabled chemistry or ADMET capabilities. Separate
    from those payers are research-environment partners such as Genomics England and INSIGHT/Moorfields,
    which matter because they show insitro tools can be delivered into real external data infrastructures
    with strict governance. A third surface is indirect ecosystem reach via Lilly TuneLab and Catalyze360,
    where insitro-built models may reach biotech users without those users necessarily becoming direct
    insitro customers. What is absent is just as important: no self-serve product, public pricing, marketplace
    motion, or long tail of named enterprise accounts surfaced in reviewed sources. Home, platform, purpose,
    and pipeline materials still describe a company balancing internal programs with partnered programs,
    so current customer economics depend on a few high-value relationships rather than a broad installed
    base.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-adoption-proof
  title: 'Named adoption proof: strongest where counterparties describe real deployments or paid milestone
    progression'
  body: 'Named customer proof is real, but it is collaboration-led rather than subscription-led. Gilead’s
    2019 NASH deal disclosed a three-year term, upfront cash, milestone potential, and rights to advance
    up to five targets, which is much stronger than a passive logo reference. Bristol Myers Squibb is
    the best public adoption case: a five-year 2020 collaboration, a $25 million 2024 milestone and first
    nominated ALS target, a 2025 ChemML extension into small-molecule design, and a 2026 expansion with
    two additional targets plus another milestone. Lilly is the second major land-and-expand example:
    three 2024 metabolic agreements broadened in 2025 to ADMET models trained on Lilly data and exposed
    through Lilly TuneLab. Outside pharma, Genomics England says insitro’s embedding search will be available
    inside its secure Research Environment, and INSIGHT/Moorfields says a co-developed OCT foundation
    model is being built on millions of linked images. These are meaningful external deployments, but
    their public outcomes are still framed as milestones or technical capabilities rather than utilization
    or ROI.'
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  tableRefs:
  - TU002
  - TU003
  figureRefs: []
- id: retention-and-durability
  title: 'Retention and durability: BMS is the best signal, Lilly is early, Gilead is opaque, and usage
    metrics are absent'
  body: 'Retention and durability are where the public record thins materially. No NRR, GRR, churn, NPS,
    active-customer counts, or account-level revenue-retention metrics are disclosed. The strongest durability
    proxy is observed continuity: BMS has stayed public and expanded across four distinct proof points
    from 2020 through 2026, making it the best evidence that insitro can deepen a marquee relationship
    once scientific trust is earned. Lilly is encouraging but newer, with only a 2024-to-2025 public sequence
    so far. Gilead proves that large pharma was willing to pay early, but current status after the original
    term is not visible in reviewed sources. Research-environment partnerships add a different kind of
    stickiness. Genomics England and INSIGHT both describe secure environments where data stay inside
    controlled infrastructure, exports are gated, and tools or virtual machines are provisioned for approved
    researchers. That operating model implies onboarding friction and some switching cost, but it still
    does not reveal renewal economics, user satisfaction, or repeat-usage quality.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  tableRefs: []
  figureRefs: []
- id: expansion-and-concentration
  title: Expansion upside exists, but concentration risk dominates the investable customer story
  body: 'Expansion upside and concentration risk coexist. On the upside, insitro has shown that a customer
    relationship can move from target discovery into chemistry, modality expansion, or ecosystem exposure:
    BMS broadened across targets and modalities; Lilly broadened into ADMET and TuneLab; Genomics England
    can expose insitro search to a wider research network. On the downside, Joe Hand’s 2026 company statement
    lumps roughly $150 million of partnership revenue into just three names—BMS, Lilly, and Gilead—without
    revealing the split. That is enough to indicate concentration, but not enough to underwrite quality
    of revenue. BioPharma Dive’s 2025 layoff coverage, including a 22% workforce reduction and runway-to-2027
    language, reinforces the view that insitro still operates like a capital-intensive biotech that depends
    on a handful of counterparties and internal proof points. KPMG and McKinsey contextualize this as
    normal for AI-biopharma deals: partnerships are bespoke, proof-sensitive, and integration-heavy. The
    result is a customer base that is strategically credible but still too opaque to treat as a diversified
    recurring-revenue engine.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  tableRefs: []
