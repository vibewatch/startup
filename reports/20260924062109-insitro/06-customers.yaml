    - insitro may not be the direct commercial vendor to those users
  - - Internal insitro pipeline programs
    - 'Buyer/payer: insitro itself; users: internal disease and platform teams'
    - Use the platform to advance wholly owned assets and partnered programs
    - Multiple programs but not customer accounts
    - Strategically important, but does not diversify external revenue
    - Consumes capital without proving third-party willingness to pay
  - - Broad self-serve or long-tail enterprise customers
