  - - Indirect Lilly TuneLab ecosystem users
    - 'Buyer/payer: Lilly and partner biotechs; users: medicinal chemistry and data-science teams'
    - Access to insitro-built ADMET models inside federated Lilly infrastructure
    - Indirect; partner count not disclosed
