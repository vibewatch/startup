    - No account-level revenue split, renewal terms, or customer-count denominator
  - - Research-environment deployment partners
    - 'Buyer: partner leadership; users: approved Genomics England and INSIGHT/Moorfields researchers;
      payer: unclear'
    - Embedding search and foundation-model workflows inside secure environments
    - 2 named U.K. institutions
