- id: TU003
  slug: named-customer-proof-table
  title: Named customer proof table
  description: Named external counterparties with the strongest public evidence of real adoption, including
    the main limitation that still remains.
  columns:
  - Customer / partner
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome / proof
  - Main limitation
  rows:
  - - Bristol Myers Squibb
    - Large-pharma payer
    - ALS/FTD target discovery that expanded into ChemML small-molecule design and additional targets
    - Active strategic program
    - 2020 launch, 2024 $25M milestone, 2025 extension, 2026 extra targets + $10M milestone
    - No public revenue split, contract term remaining, or renewal mechanics
  - - Eli Lilly
    - Large-pharma payer
    - Metabolic disease target and modality agreements plus ADMET / PK model development for small molecules
    - Active strategic program
    - 2024 three strategic agreements and 2025 expansion into TuneLab-linked ADMET models
    - Public duration is still short and economics remain undisclosed
  - - Gilead Sciences
    - Large-pharma payer
    - NASH disease modeling and target discovery with rights to advance up to five targets
    - Historical production-like collaboration
    - Official Gilead terms disclosed upfront cash, milestones, royalties, and a defined three-year term
    - Current status after the initial term is not publicly visible
  - - Genomics England
    - Research-data partner / external user surface
    - Embedding search made available inside the secure Research Environment for research partners
    - Deployed external tool inside partner environment
    - Partner-side page plus current RE docs confirm a real governed external environment
    - No public usage, satisfaction, or cash-value data
  - - INSIGHT / Moorfields
    - Research-data partner / external user surface
    - Co-developed OCT foundation model for neurodegeneration-related discovery inside secure environment
    - Active joint development in partner-controlled environment
    - Partner-side materials describe millions of OCT images, secure access controls, and approved-researcher
      infrastructure
    - No public repeat-usage, monetization, or renewal metrics
  notes: Rows are limited to externally named counterparties with concrete deployment or economic proof.
    The evidence is materially stronger than logos alone, but still incomplete on utilization and renewal.
