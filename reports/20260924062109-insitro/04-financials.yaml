- id: TI003
  slug: unit-economics-table
  title: Unit economics table
  description: Public signals that help bound insitro’s cost structure and unit-economics discussion,
    even where company-specific figures are missing.
  columns:
  - Metric
  - Public signal
  - Anchor / comparator
  - Why it matters
  - Diligence ask
  rows:
  - - Revenue concentration
    - Named monetized partner set is concentrated in BMS, Lilly, and earlier Gilead
    - Not diversified across dozens of customers
    - A small number of counterparties can drive a large share of economics and strategic risk
    - Request partner-by-partner revenue and deferred-revenue split
  - - Current workforce scale
    - BioPharma Dive said ~230 employees after 2025 cuts; trackers still show ~250-300
    - Tracker disagreement remains material
    - Personnel is likely one of the largest cost pools, but even the denominator is fuzzy publicly
    - Request current org chart and fully loaded compensation base
  - - Compute intensity
    - 2025 ChemML update highlighted a 192-H100 GPU cluster
    - Closer to frontier-model R&D than light enterprise software
    - Supports the view that compute and experimentation are non-trivial cost centers
    - Request annual cloud / compute and depreciation spend
  - - Peer R&D expense benchmark (2023)
    - Recursion $241.2M; Schrödinger $181.8M; Relay $330.0M
    - Public AI-biopharma comps
    - Bounds what scaled platform-plus-pipeline operations can cost annually
    - Show insitro platform vs program R&D allocation against these peers
  - - Peer operating cash use benchmark (2023)
    - Schrödinger ~$136.7M; Relay ~$300.3M
    - Public cash-burn anchors
    - Shows how quickly cash can be consumed even when some revenue exists
    - Request insitro monthly cash-burn trend for last 24 months
  - - Gross-margin path
    - No public insitro figure; economics likely between software and wet-lab service models
    - Public comps still absorb large R&D despite revenue
    - Without margin disclosure, collaboration revenue quality remains hard to underwrite
    - Request gross margin by collaboration or program family
  notes: The table intentionally mixes direct insitro signals with peer anchors because insitro-specific
