- id: TE003
  slug: technology-operating-architecture-table
  title: Technology / operating architecture table
  description: Publicly reconstructable layers of insitro’s architecture, including the role each layer
    plays and what dependency or risk matters most.
  columns:
  - Layer / component
  - Role
  - Key dependency
  - Primary risk
  rows:
  - - Human cohort and partner data
    - Supply multimodal clinical and phenotypic inputs
    - Biobank and partner data rights
    - Rights fragmentation or restricted reuse
  - - Phenotype / representation learning
    - Build embeddings, foundation models, and scalable human phenotypes
    - Curated high-quality linked datasets
    - Drift, bias, or weak transfer outside source cohorts
  - - Cell model generation
    - Create disease-relevant human cellular systems for discovery
    - Automated labs and differentiated protocols
    - Biological reproducibility risk
  - - Perturbation screening
    - Measure the effect of genes or perturbations at phenotypic depth
    - POSH imaging, barcode, and sequencing stack
    - Throughput and cost are not externally disclosed
  - - Therapeutic design engine
    - Choose modality and optimize interventions for potency plus developability
    - Compute, partner datasets, QALs, molecular simulation
    - Compute economics and post-acquisition integration risk
  - - Program translation layer
    - Move outputs into partner or internal asset programs
    - BMS, Lilly, and internal pipeline execution
    - Clinical translation and CMC risk
  - - Governance layer
    - Constrain high-stakes AI use with privacy and validation controls
    - Partner secure environments; regulatory frameworks
    - Control implementation is not publicly auditable
  notes: Detailed system diagrams are not public; the table reconstructs the operating model from the
    company’s own module descriptions and partner deployments.
