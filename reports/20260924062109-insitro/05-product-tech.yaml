  data:
    layers:
    - label: Partner and cohort data layer
      detail: Biobanks, clinical imaging, genomics, and partner datasets from Genomics England, INSIGHT/Moorfields,
        Lilly, and other collaborators
    - label: Phenotype / representation layer
      detail: ClinML phenotypes, embedding search, and foundation-model style representations derived
        from multimodal data
    - label: Cellular experimentation layer
      detail: iPSC and primary-cell models, differentiated protocols, and automated wet-lab generation
        of perturbation data
    - label: POSH / perturbation layer
      detail: Pooled CRISPR plus Cell Painting and self-supervised embeddings to infer gene function at
        scale
    - label: Virtual Human causal-biology layer
      detail: Integrates human and cellular evidence to choose what biology to target
    - label: TherML / ChemML design layer
      detail: Selects modality and designs small molecules, oligonucleotides, or biologics using active
        learning
    - label: Program / deployment layer
      detail: Internal assets plus partner workflows such as BMS ALS programs, Lilly metabolic programs,
        Genomics England embedding search, and INSIGHT OCT modeling
