companyProfile:
  summary: >-
    Zipline International Inc. is a late-stage private autonomous logistics company that designs, manufactures, and
    operates drone delivery networks for healthcare systems, retailers, restaurants, and governments. Founded in 2014 in
    South San Francisco, Zipline built its reputation in Rwanda with blood delivery and has since expanded into
    multi-country healthcare logistics and U.S. consumer/retail delivery through Platform 2. In 2026 the company
    reported more than 2.5 million commercial deliveries, 135 million+ commercial autonomous miles, and more than 5,000
    hospitals and health facilities served while raising an additional $800M at a $7.6B valuation. The public case now
    looks materially stronger on scale and partner adoption, but the company still does not disclose revenue, margin, or
    cash flow.
