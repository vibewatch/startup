chapter:
  order: 6
  number: 6
  title: Customers
  summary: 'The customer base is no longer just a healthcare story. In 2026 Zipline has visible proof of

    healthcare, retail, and platform-driven consumer adoption. Walmart marked 1 million drone

    deliveries; Cleveland Clinic launched a home prescription drone service; and Uber announced a

    Zipline partnership intended to reach millions of Americans. Zipline itself said the number of

    businesses offering delivery via the app grew 13X in the first half of 2026. That said, public

    evidence still does not reveal cohort retention, NRR, or customer concentration, so the investor

    case remains a mix of observable adoption and missing commercial detail.

    '
  letter: U
sections:
- id: CU-segmentation
  title: Customer Segmentation
  body: "Zipline’s customers fall into four practical segments: healthcare systems, governments,\nretailers, and marketplace/merchant\
    \ platforms. Healthcare and government buyers care most about\naccess, reliability, and emergency response. Retailers\
    \ care about speed, convenience, and basket\nconversion. Marketplace platforms care about network utility and order density.\
    \ The 2026 proof\npoints show all four are now active enough to matter. That is a big change from the earlier\nreport,\
    \ where Zipline’s customer story still looked mostly like a healthcare proof-of-concept.\n Even so, the public record\
    \ still hides the exact customer mix and churn behavior. Repeat usage is visible, but concentration remains opaque. Repeat\
    \ usage is visible, but concentration remains opaque, and the public evidence still does not show cohort retention or\
    \ renewal timing."
  claimRefs:
  - CU001
  - CU002
  - CU003
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: CU-adoption
  title: Adoption Trajectory and Durability
  body: 'The adoption curve has moved from pilot to repeat use. Walmart’s one-million-delivery milestone

    and Zipline’s own 2.5M+ delivery count show that customers are now using the system at scale.

    Cleveland Clinic’s launch proves the product can extend beyond retail into health-system home

    delivery. Uber’s partnership is especially important because it may convert a new platform buyer

    into a distribution channel. What remains missing is the normal SaaS-style proof of retention:

    there is no public NRR, GRR, or cohort data, so durability is inferred from repeat-use milestones

    rather than measured contract metrics.

    '
  claimRefs:
  - CU004
  - CU005
  - CU006
  - CU007
  tableRefs:
  - TU002
  - TU003
- id: CU-concentration
  title: Expansion and Concentration Risk
  body: 'Concentration risk is likely still present, but it is less visible than before. Walmart remains a

    major proof point, healthcare remains strategically important, and Uber could become a major

    demand funnel if the partnership scales. The public evidence suggests Zipline is widening the

    customer base faster than the prior report cycle, which should help reduce reliance on a single

    program or geography. Even so, because no public customer-revenue split exists, concentration

    cannot be quantified precisely. The right diligence stance is to treat Walmart and healthcare as

    foundational, not yet fully diversified.

    '
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU011
