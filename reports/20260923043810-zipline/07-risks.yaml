company:
  name: Zipline
chapter:
  order: 7
  number: 7
  title: Risks
  letter: R
  summary: 'Zipline’s risk profile in 2026 is better funded and more visible than before, but it is still a

    high-risk, capital-intensive, regulated operating business. The main shift is that the company

    now has real demand, real scale, and real partners; the remaining risk is not whether drones can

    work, but whether Zipline can keep permissions, public trust, and economics aligned as it scales.

    Regulatory exposure, community acceptance, privacy, and customer concentration remain the most

    important risks. Financial risk is improved by the new funding but not eliminated, because the

    company still lacks public revenue and margin disclosure.

    '
sections:
- id: CR-regulatory
  title: Regulatory and Legal Risk
  body: "Zipline’s highest-severity risks are still regulatory. The company depends on Part 135,\nBVLOS, local airspace approvals,\
    \ NEPA/environmental review, and ongoing FAA/community engagement\nfor U.S. expansion. The FAA’s package-delivery guidance\
    \ makes clear that local requirements,\ncommunity notice, and environmental mitigation remain part of the operating burden.\
    \ Even with\nstrong federal progress, every new city is effectively a regulatory project. That means a rules\nchange,\
    \ a delayed approval, or a more aggressive privacy regime could materially slow rollout.\n That leaves community acceptance\
    \ and permitting risk as practical constraints, not abstractions. That matters because the public risk surface is still\
    \ unusually permissioned. That matters because the public risk surface is still unusually permissioned, with approvals\
    \ and local politics both affecting route openings and ongoing operations."
  claimRefs:
  - CR001
  - CR002
  - CR003
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: CR-op-risk
  title: Operational, Technical, and Community Risk
  body: 'The operational risk surface includes weather, hub uptime, fleet maintenance, cybersecurity,

    noise, and customer acceptance. Zipline’s security addendum shows a formal security program and

    SOC 2 Type II controls, which is positive, but it also confirms that a security program must be

    actively maintained and audited. Axios’ 2026 comparison highlights that drone noise will be a

    public issue as fleets expand. Cleveland Clinic and Walmart are strong proof points, but they

    also raise expectations: if service levels slip, the reputational downside could be large.

    '
  claimRefs:
  - CR004
  - CR005
  - CR006
  - CR007
  tableRefs:
  - TR002
- id: CR-financial
  title: Financial, Partner, and Execution Risk
  body: 'The financial risk is improved but not gone. Zipline now has a much larger 2026 funding base,

    but the company still does not publish revenue, gross margin, or burn. That means investors cannot

    verify that new markets are self-funding. Partner risk is also real: Walmart is a large proof

    point, Uber could become a major funnel, and Cleveland Clinic validates healthcare home delivery,

    but each partner could renegotiate scope, delay rollout, or reprice economics. In practical

    terms, the risk is not one bad customer; it is a mismatch between capital spend and route-level

    economics.

    '
  claimRefs:
  - CR008
  - CR009
  - CR010
  - CR011
  - CR012
  tableRefs:
  - TR003
