companyProfile:
  summary: >-
    Zipline International Inc. is a late-stage private autonomous logistics company that designs, manufactures, and
    operates drone delivery networks for healthcare systems, retailers, restaurants, and governments. Founded in 2014 in
    South San Francisco, Zipline built its reputation in Rwanda with blood delivery and has since expanded into
    multi-country healthcare logistics and U.S. consumer/retail delivery through Platform 2. In 2026 the company
    reported more than 2.5 million commercial deliveries, 135 million+ commercial autonomous miles, and more than 5,000
    hospitals and health facilities served while raising an additional $800M at a $7.6B valuation. The public case now
    looks materially stronger on scale and partner adoption, but the company still does not disclose revenue, margin, or
    cash flow.
  foundedDate: '2014-01-01'
  founders:
    - name: Keller Cliffton
      role: CEO and co-founder
      background: >-
        Former Romotive founder and the public face of Zipline’s fundraising, government partnerships, and strategic
        expansion.
      claimRefs:
        - CO004
    - name: Will Hetzler
      role: CTO and co-founder
      background: Technical leader responsible for aircraft and systems engineering across Zipline’s platforms.
      claimRefs:
        - CO004
  foundingLocation: South San Francisco, California
  headquarters: South San Francisco, California
  productSummary: >-
    Zipline provides delivery-as-a-service through two main platforms: Platform 1 for long-range healthcare and
    enterprise routes, and Platform 2 for shorter-range consumer, retail, and healthcare deliveries. The company owns
    the aircraft, launch and delivery infrastructure, software, and operations stack rather than selling hardware alone.
  customerFocus: >-
    Government healthcare systems, hospitals, retailers, restaurants, and consumer delivery partners in the U.S.,
    Africa, and Japan.
  businessModel: B2B2C delivery-as-a-service with government contracts, partner-funded delivery capacity, and per-delivery economics.
  stage: late-stage private
