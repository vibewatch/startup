  topStrengths:
    - Zipline 业务已具备真实规模：累计完成 2.5M+ 次配送，自主飞行里程超 135M+ 英里，服务 5,000+ 家医疗机构。
    - 2026 年新一轮融资重置为公司补充了充沛资本，支撑其持续推进美国本土与海外扩张。
    - 核心合作伙伴已拓展至 Walmart、Cleveland Clinic、Uber 及多国国家级医疗系统，需求渠道进一步拓宽。
    - 拿下 FAA Part 135 认证并推进 BVLOS，构建起稳固监管护城河，竞对资质明显受限。
    - 引入来自 Tesla、Waymo 和 Uber 的高管，显现出支撑下一阶段增长的运营成熟度。
  topRisks:
    - 收入、毛利率与烧钱速度均未公开，单位经济模型无法独立核算。
    - 每座新城市的落地仍取决于准入批文、NEPA 式环境审查及当地社区接受度。
    - 即便技术跑通，噪音、隐私与许可审批等顾虑仍可能拖慢消费市场的拓展节奏。
    - Walmart 等少数核心合作伙伴依然带来客户集中度风险。
    - 重资产投入属性依然明显，良好的运营叙事仍需站得住脚的底层盈利能力来支撑估值。
  unresolvedGaps:
    - 公开收入、毛利率及烧钱速度均未披露。
    - 各细分业务各航线的边际贡献率仍未公开。
    - 优先股堆叠与股权结构表依然不透明。
    - 现金跑道及下一轮融资触发条件均未公开。
    - CEO 继任计划未见公开披露。
