companyProfile:
  summary: >-
    Zipline International Inc. 是一家后期非上市自主物流企业，自研、制造并运营无人机配送网络，客户涵盖医疗系统、零售商、餐饮品牌与政府机构。公司 2014
    年成立于南旧金山，靠在卢旺达运送血液一战成名，随后将跨国医疗物流版图铺开，并借 Platform 2 杀入美国本地消费及零售配送。2026 年，公司披露累计完成逾 250 万次商业配送、自主商业飞行里程超 135M+ 英里，覆盖
    5,000 多家医院与医疗机构，并以 $7.6B 估值完成 $800M 新一轮融资。从公开基本面看，规模与合作方落地明显做实，但收入、毛利率和现金流依然未对外公开。
