      - - NEPA / 地方审查
        - 中
        - 高
        - 运用枢纽选址与社区沟通打法
        - 遭遇社区或环保禁令
      - - 隐私监管
        - 中
        - 中
        - 完善合规策略与数据管控
        - 摄像头数据引发监管调查或舆论反弹
      - - 劳工与运营规则
        - 低
        - 中
        - 强化人员配置与流程纪律
        - 网点无法配齐人员或通不过资质认证
    sourceRefs:
      - SR001
