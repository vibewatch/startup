  - id: TR003
    title: 合作伙伴与依赖风险清单
    description: Business-model dependencies that could hurt scale.
    columns:
      - 依赖对象
      - 重要性
      - 核心风险
      - 应对措施
    rows:
      - - Walmart
        - 零售领域的关键标杆实证
        - 客户集中度偏高，面临压价风险
        - 拓展多元商家与合作平台
      - - Uber
        - 庞大的 C 端获客漏斗
        - 渠道依赖度过高
        - 锁定有利商业条款与航线所有权
      - - Cleveland Clinic
        - 医疗场景拓展的标杆实证
        - 合作范围可能局限在窄场景
        - 拓展至更多医疗卫生体系
      - - 监管机构
        - 准入特许经营模式
        - 审批进度可能拖慢扩张步伐
        - 深化政策沟通与合规打法
