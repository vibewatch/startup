      - CV006
      - CV007
    notes: 公开数据快照；部分字段为公司估算或仅部分披露。
figures:
  - id: FO001
    type: timeline
    title: Zipline 发展里程碑时间线
    summary: 涵盖公司成立、适航认证、资本融资与美国本土规模化扩张的关键商业节点。
    data:
      items:
        - label: '2014'
          detail: Zipline 于南旧金山成立
        - label: '2016'
          detail: 在卢旺达启动全国医疗物资配送网络
        - label: '2022'
          detail: 获得 FAA Part 135 航空承运人认证
        - label: '2023'
          detail: 在盐湖城周边取得 FAA 超视距飞行（BVLOS）许可
        - label: 2026-01
          detail: 按 $7.6B 估值完成逾 $600M 融资
        - label: 2026-07
          detail: 平台端商户增长 13 倍，在美国启动多处新业务点
  - id: FM001
    type: pyramid
    title: Zipline 目标市场测算金字塔
    summary: 市场规模逻辑从宏观大物流支出一路收窄，最终锚定 Zipline 实际切入的细分场景。
    data:
      items:
        - label: 宏观物流整体支出
          value: largest layer
        - label: 医疗物流
          value: mid layer
        - label: 即时零售配送
          value: mid layer
        - label: 应急响应配送
          value: small but urgent
        - label: Zipline 可服务市场（SAM）
          value: current SAM anchor
        - label: Zipline 当前可获取市场（SOM）
          value: execution wedge
  - id: FP001
    type: quadrant
    title: 无人机配送竞争格局图
    summary: Zipline 的核心壁垒在于全流程运营把控与服务覆盖面，而非单纯依靠品牌效应。
    data:
      points:
        - label: Zipline
          x: 9
          'y': 8
        - label: Wing
          x: 8
          'y': 6
        - label: Amazon Prime Air
          x: 7
          'y': 5
        - label: Flytrex
          x: 5
          'y': 4
        - label: DroneUp
          x: 6
          'y': 3
        - label: 地面传统配送
          x: 2
          'y': 7
  - id: FI001
    type: flow
    title: Zipline 资本与财务演进脉络
    summary: 资本故事沿着融资、网络扩张与投资底线假设层层递进。
    data:
      nodes:
        - id: funding
          label: 2026 年 1 月与 3 月融资
        - id: capital
          label: 累计融资 $1.78B
        - id: scale
          label: 累计完成 2.5M+ 次配送
        - id: headcount
          label: 2,255 名员工
        - id: partner
          label: Walmart / Uber / Cleveland Clinic 订单需求
        - id: economics
          label: 毛利率仍未公开
      edges:
        - from: funding
          to: capital
        - from: capital
          to: scale
        - from: scale
          to: headcount
        - from: scale
          to: partner
        - from: partner
          to: economics
  - id: FE001
    type: stack
    title: Zipline 平台技术与运营架构
    summary: 产品架构将飞行器、地面运营、调度软件与合规准入融为一体。
    data:
      layers:
        - label: 合规与准入边界
          detail: 包含 Part 135、BVLOS 以及保障合法飞行的各地方审批。
        - label: 飞行器硬件层
          detail: 包含面向不同航线场景打造的 Platform 1 与 Platform 2 机型。
        - label: 地面运营层
          detail: 涵盖配送中心、机队维保以及起降发射物流。
        - label: 软件与算法层
          detail: 负责路径规划、调度、订单管理与空域协同软件。
        - label: 客户交互层
          detail: 面向终端用户与合作伙伴的下单、通知及接口集成。
        - label: 安全与数据层
          detail: 涵盖安全附约、隐私政策与内部合规控制。
  - id: FU001
    type: journey-map
    title: 客户落地与留存全流程
    summary: 客户合作始于试点项目，唯有通过高频复购配送才能形成稳定黏性。
    data:
      items:
        - label: 明确配送需求
        - label: 批准试点或上线
        - label: 审核患者或商户资质
        - label: 完成下单
        - label: 无人机配送履约
        - label: 复用与规模扩张
  - id: FR001
    type: matrix
    title: 核心风险矩阵
    summary: 核心风险主要集中在监管准入、社区接纳、运营稳定性与合作伙伴依赖四大维度。
    data:
      columns:
        - 发生概率
        - 影响程度
        - 可见度
        - 应对措施
      rows:
        - label: BVLOS 审批
          values:
            - 中
            - 高
            - 高
            - 监管主动沟通
        - label: 社区噪音
          values:
            - 中
            - 高
            - 高
            - 科学选址布局
        - label: 隐私舆论反弹
          values:
            - 中
            - 中
            - 中
            - 合规策略管控
        - label: 安全事故
          values:
            - 低
            - 高
            - 中
            - 安全审计
        - label: 合作伙伴集中度
          values:
            - 中
            - 高
            - 高
            - 拓展多元渠道
        - label: 单票经济模型
          values:
            - 高
            - 高
            - 低
            - 做大网络密度
  - id: FV001
    type: flow
    title: 估值情景推演图
    summary: 以当期经营实证为起点，推导悲观、基准与乐观三种估值情景。
    data:
      nodes:
        - id: evidence
          label: 当期经营实证
        - id: bear
          label: 悲观情景
        - id: base
          label: 基准情景
        - id: bull
          label: 乐观情景
        - id: pricing
          label: 投资人定价区间
        - id: decision
          label: 尽调最终结论
      edges:
        - from: evidence
