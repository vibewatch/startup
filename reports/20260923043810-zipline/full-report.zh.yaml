  - id: TV001
    title: 投资建议汇总表
    description: What the current evidence supports.
    columns:
      - 评估维度
      - 核心观点
      - 论证依据
    rows:
      - - 投资建议
        - 审慎看好 / 建议继续研究
        - 配送规模已经跑出，但财务数据依然不透明
      - - 风险评级
        - 高
        - 监管、运营与资金链风险依然显著
      - - 估值判断
        - 偏贵但基本面已见起色
        - $7.6B 估值有规模撑腰，但仍高度依赖后续执行兑现
      - - 持有 / 退出视角
        - 长周期持有
        - 达到二级市场资产质地前，仍需多年业绩自证
