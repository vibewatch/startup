  - id: TV003
    title: 乐观 / 基准 / 悲观情景推演表
    description: Scenario framing rather than precise DCF outputs.
    columns:
      - 情景
      - 核心假设
      - 估值判断
      - 下行触发条件
    rows:
      - - 乐观
        - 商户密度提升，医疗业务放量，C 端配送形成规模
        - $7.6B 估值合理甚至偏低
        - 具备网络效应、毛利率持续改善的高壁垒业务
      - - 基准
        - 增速依然强劲，但属于重资本扩张模式
        - 当前估值已打满，但尚能支撑
        - 后续仍需开展新一轮融资
      - - 悲观
        - 航线单票模型受挫，监管审批不及预期
        - 估值倍数大幅压缩
        - 尚未证明毛利打平前，增长先现颓势
    sourceRefs:
      - SV001
      - SV002
      - SV004
