      - SV001
      - SV002
      - SV003
    notes: 公开数据快照；部分字段为公司估算或仅部分披露。
  - id: TV002
    title: 核心逻辑与反向逻辑对照表
    description: Why the stock could work and why it could fail.
    columns:
      - 投资逻辑
      - 反向逻辑
      - 佐证证据
    rows:
      - - Zipline 是赛道绝对龙头
        - 行业领跑不等于能赚到利润
        - 完成 2.5M+ 次配送，但尚无公开营收数据
      - - 头部合作伙伴正在放量
        - 大客户可能重新议价或放慢铺开节奏
        - Walmart、Uber、Cleveland Clinic
      - - 空域准入资质确实到手
        - 牌照仍属特许审批性质，根基较为脆弱
        - 受制于 FAA Part 135 与 BVLOS 审批关卡
      - - 网络效应有望逐步显现
        - 网点密度可能永远达不到临界点
        - 平台端商户实现 13 倍增长，但毛利率仍未可知
    sourceRefs:
      - SV002
      - SV004
      - SV005
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV008
