  topStrengths:
    - 'Zipline now has real scale: 2.5M+ deliveries, 135M+ autonomous miles, and 5,000+ health facilities served.'
    - The 2026 financing reset gives the company meaningful capital to keep scaling U.S. and international expansion.
    - >-
      Major partners now span Walmart, Cleveland Clinic, Uber, and national healthcare systems, widening demand
      channels.
    - FAA Part 135 and BVLOS progress keep the regulatory moat intact while competitors remain more limited.
    - Leadership additions from Tesla, Waymo, and Uber suggest operational maturity for the next growth phase.
  topRisks:
    - Revenue, margin, and burn remain undisclosed, so unit economics cannot be independently underwritten.
    - Each new city still depends on approvals, NEPA-style reviews, and local community acceptance.
    - Noise, privacy, and permitting concerns can slow consumer-market rollout even when the technology works.
    - Walmart and a small set of major partners still represent concentration risk.
    - Capital intensity remains high, so a good operating story still needs durable economics to justify the valuation.
  unresolvedGaps:
    - Public revenue, gross margin, and burn rate remain undisclosed.
    - Route-level contribution margin by segment is still not public.
    - Preference stack and cap table remain opaque.
    - Cash runway and next financing trigger are not public.
    - CEO succession planning is not documented publicly.
