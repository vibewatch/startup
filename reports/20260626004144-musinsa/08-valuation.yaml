        for ZOZO Japan on an IFRS basis to cross-check the Yahoo Finance figure
      whyItMatters: >-
        TV004 (comparable-valuation-table) relies on publicly available market data
        for listed peers; private comp multiples are estimated and the ZOZO multiple
        is derived from a single financial data aggregator without a primary-tier filing
      diligencePath: >-
