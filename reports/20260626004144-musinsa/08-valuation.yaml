  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: rcps-overhang
      missingEvidence: >-
        Exact RCPS conversion price, maturity date, redemption trigger conditions, and
        liquidation preference stacking for the ~KRW 736B RCPS tranche
      whyItMatters: >-
        Without knowing whether preferred holders will convert vs. redeem at IPO, the
        post-IPO cap table and effective dilution to public shareholders cannot be
        modeled; this is the single most critical financial diligence item
      diligencePath: >-
        Request data room access to RCPS agreement and confirm terms in IPO
        prospectus once filed with DART
      relatedQuestionRefs: [QV006]
      relatedTableRefs: [TV006]

    - type: missing-source
      severity: minor
