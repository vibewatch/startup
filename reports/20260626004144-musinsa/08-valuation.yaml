company:
  name: Musinsa
chapter:
  number: 8
  title: Valuation
  summary: >-
    Musinsa is a genuine market-leader and profitable growth platform—KRW 1.47T revenue, 9.6%
    operating margin, 16M+ members, 10,000+ brands—but its IPO target of KRW 10T (~$7.4B)
    requires a 143× PER on current earnings, more than 10× the industry norm, and 6.8× EV/Sales
    versus ZOZO's 4.3×, Zalando's 0.5×, Naver's 2.7×, and Coupang's 0.9×. Mirae Asset
    Securities withdrew from the IPO pitch process in November 2025, citing overvaluation; the
    OTC market implied only KRW 3.4T (~$2.5B) at the same date. The EQT secondary at KRW 4T
    (April 2025) is the most recent arm's-length price and forms the floor of the base case.
    With KFTC antitrust exposure, KRW 736B RCPS-as-debt overhang, nascent international GMV
    (0.57% of total), and Soldout/Japan subsidiaries still loss-making, the evidence supports
    a WATCH recommendation at current private marks; the base-case fair value range is
    KRW 4.5–6T (~$3.4–4.6B), and entry is disciplined only if the IPO prices below KRW 5.5T.

sections:
  - id: section-thesis
    title: Investment thesis and anti-thesis
    body: >
      Musinsa's bull case rests on five compounding strengths. First, the company has
      demonstrated operating leverage: revenue grew from KRW 708.5B in 2022 to KRW 1.47T
      in 2025—a 27.5% CAGR—while operating margin expanded from 1.6% to 9.6%, putting
      it at the high end of global fashion marketplace peers. Second, the platform moat is
      deep: 10,000+ partner brands depend on Musinsa Fulfillment Service (MFS) for
      pick-pack-ship, making switching costs real and revenue stickiness high. Third,
      private-label Musinsa Standard generated KRW 471B in transaction volume in 2025
      (+33% YoY), establishing a high-margin secondary revenue engine with physical-store
      optionality that pure marketplaces cannot replicate. Fourth, the company has completed
      IPO preparation infrastructure—co-CEO governance restructuring in December 2025,
      three independent board directors appointed in March 2025, and a global underwriter
      syndicate (Citi, JPMorgan, Korea Investment & Securities, KB Securities) assembled by
      December 2025. Fifth, Q1 2026 accelerated to KRW 363.6B revenue (+24.1% YoY) and
      KRW 15.3B in exports (+11.9×), suggesting the international narrative is turning
      from pilot to traction.

      The anti-thesis is equally concrete. The company is targeting a KRW 10T market cap
      at IPO, which implies a 143× price-to-earnings ratio on roughly KRW 70B of 2025 net
      income—approximately 10× the industry average for Korean listed internet companies
      and 7× Zalando's current PE. The IB industry consensus estimated fair value at
      KRW 4–5T, roughly half the target. Mirae Asset Securities—one of Korea's most
      prominent underwriters—declined to present at the final IPO round in November 2025,
      an event that analysts described as a rare and meaningful signal of overvaluation
      skepticism. The OTC market (Securities Plus) implied only KRW 3.4T (~$2.5B) at the
      time. The RCPS reclassification creates a KRW 736B non-cash debt load that inflates
      the apparent debt ratio to ~620% and produces a standalone net loss even when
      underlying operating profit is positive. International GMV remains 0.57% of total
      transactions through H1 2025, directly contradicting the global-growth narrative that
      justifies premium multiples. Soldout and Musinsa Japan were both loss-making in 2024.
      A KFTC investigation into alleged anti-competitive exclusivity practices—launched in
      2024 and ongoing through June 2026—introduces a structural risk that could force
      operational changes and damage the supply-side moat central to the thesis.
