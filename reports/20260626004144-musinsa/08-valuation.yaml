  - id: section-diligence
    title: Final diligence asks and thesis-break triggers
    body: >
      Several gaps prevent a more confident recommendation. The most critical is the RCPS
      conversion and redemption schedule: without understanding exact conversion prices,
      redemption triggers, and maturity dates on the KRW 736B RCPS tranche, public-investor
      economics cannot be accurately modeled. This is a blocking diligence item.

      The second gap is international revenue quality. The 11.9× export growth in Q1 2026
      sounds compelling but is off a very small base (0.44% of revenue in Q1 2025, now
      4.2%). Monthly GMV by geography—Japan, China, Southeast Asia, North America—is not
      public. Without this, the China Anta JV contribution cannot be isolated from organic
      global store traction, making it impossible to assess the sustainability of
      international momentum.

      Third, the KFTC investigation outcome is unresolved. The specific exclusivity clauses
      under review have not been publicly disclosed. A structural remedy—such as forcing
      Musinsa to list brands on competing platforms simultaneously—could erode supply-side
      lock-in meaningfully and would require a valuation revision downward.

      Fourth, Soldout (SLDT) and 29CM profitability timelines: Soldout has carried
      cumulative operating losses exceeding KRW 66B from 2022–2023 alone, and its revenue
      (~KRW 16.7B) remains small versus Naver-backed KREAM (~KRW 157B). The turnaround
      path is unclear. 29CM's GMV crossed KRW 1T, but its standalone contribution to group
      EBIT is not public.

      Fifth, management depth and key-person risk: the co-CEO structure added Jo Nam-sung
      for IPO-readiness, but Cho Man-ho (founder) has reduced operational involvement. The
      extent of institutional capability below the C-suite needs verification.
