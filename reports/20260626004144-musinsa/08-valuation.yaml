  - id: section-scenarios
    title: Bull, base, and bear scenario framework
    body: >
      The three scenarios below are driven by two primary variables: (1) revenue trajectory
      through 2027–2028 and (2) the EV/Operating Profit multiple at IPO exit. All scenarios
      assume the RCPS converts to common equity at IPO, eliminating the non-cash interest
      distortion. The scenarios also assume KOSPI is the listing venue; a NASDAQ listing
      would likely imply a wider discount given US investors' limited K-fashion familiarity
      and higher disclosure costs.

      BULL CASE (KRW 8–10T, ~$6.1–7.7B): Revenue reaches KRW 2.0T by FY2027 driven by
      Musinsa Standard global store expansion, Anta JV scaling beyond 10 Shanghai locations,
      Japan permanent stores generating positive EBITDA, and international GMV crossing 5%
      of total transactions. Operating margin expands to 12–14% through leverage on the
      MFS platform and reduced brand acquisition costs. EV/Operating Profit of 55–65× is
      applied (premium to ZOZO's PE of 21× given structural growth), implying EV of
      KRW 8–10T. Probability trigger: IPO oversubscribed, international GMV KPIs on-track
      by H1 2027, KFTC case closes without structural remedy.

      BASE CASE (KRW 4.5–6T, ~$3.4–4.6B): Revenue grows 15–20% annually, reaching
      KRW 1.7–1.8T by FY2027. Operating margin holds at 9–10%. International remains
      meaningful but modest (<3% of GMV). EV/Operating Profit of 32–42× applied (moderate
      discount to Zalando's 60× PE given higher growth, but constrained by Korean market
      re-rating history). Implies EV KRW 4.5–6T. Downside triggers: China Anta JV
      underperforms, KFTC requires operational changes, domestic GMV growth decelerates
      below 10%. EQT's KRW 4T secondary price anchors the floor of this range.

      BEAR CASE (KRW 2.5–3.5T, ~$1.9–2.7B): Revenue growth decelerates sharply to <10%
      YoY due to Coupang/Naver brand recruitment, Chinese price competition, and KFTC-
      imposed restrictions on exclusivity. Operating margin compresses to 6–7%. RCPS
      conversion terms are dilutive. Multiple collapses to 15–25× EV/Operating Profit
      (Coupang's post-IPO re-rating trajectory). Implies EV near the OTC-market-implied
      KRW 3.4T or below. Triggered by: down-round pricing at IPO, KFTC ruling with
      structural remedies, or global market multiple compression.
