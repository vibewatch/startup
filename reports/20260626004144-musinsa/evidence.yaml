      preference structure for Series A/B/C and EQT.
    whyItMatters: >-
      The IPO valuation target, economic interests of existing holders, and potential for overhang selling cannot be
      assessed without a verified cap table. The gap between EQT secondary mark (KRW 4T) and IPO target (KRW 10T) could
      hide preference structures that inflate headline valuation.
