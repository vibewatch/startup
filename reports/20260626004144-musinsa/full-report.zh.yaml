      - number: '8.3'
        title: 可比公司组与倍数分析
        blocks:
          - type: paragraph
            body: >
              没有一个全球可比公司能完全匹配 Musinsa 的模式：它是以内需为主的精选时尚 marketplace，叠加自有品牌、线下零售和刚起步的国际扩张。最有参考价值的同业可分为四类：（1）亚洲上市时尚
              marketplace；（2）欧洲时尚电商；（3）韩国互联网平台锚点；（4）私募二级市场标记。

              ZOZO Inc（Tokyo: 3092.T）是结构上最接近的参照：精选时尚 marketplace，拥有自有品牌线（Zozo Suit），在日本品类领导力强；截至 2026 年 6 月，收入
              ¥228B（~$1.5B），市值约 ¥991B（~$6.5B），隐含 EV/Sales ~4.3×、PE 20.7×。ZOZO 只经营一个成熟市场，增长曲线已饱和；Musinsa
              增速更高且有国际化可选性，可以相对 ZOZO 的 PE 享受小幅溢价。但考虑到 ZOZO 的规模优势，以及日本更大、更深的时尚市场，ZOZO 4.3× 的 EV/Sales 已经是 Musinsa
              可辩护区间的上沿。

              Zalando SE（XETRA: ZAL.DE）是欧洲参照：2025 年收入 €12.9B，市值 €6.87B（EV/Sales 0.53×，PE 60.4×），反映的是成熟、低利润率 marketplace
              在增长停滞环境中的估值。Zalando 的模式不是 Musinsa 的多头案例；它展示的是增长放缓后倍数压缩的样子。

              Coupang（NYSE: CPNG）提供韩国电商锚点：市值 $30.6B，2025 年收入 $35.1B，EV/Sales ~0.87×。Coupang
              是物流优先的综合电商平台，不是时尚垂类；但其估值历史（2021 年 IPO PSR 3.5×，到 2026 年降至 <1×）说明，一旦增长放缓，市场会如何重估。Economy.ac（2025 年 11
              月）明确指出，Musinsa 目标 PSR 7× 是 Coupang IPO PSR 的两倍。

              韩国互联网锚点 Naver（035420.KS，市值 KRW 29.6T，EV/Sales ~2.7×）和 Kakao（035720.KS，市值 KRW 14.9T，EV/Sales
              ~1.9×）给出本土平台基线。两者收入都比 Musinsa 高一个数量级，却以更低 EV/Sales 倍数交易，说明韩国市场给平台公司的倍数适中，并非高溢价成长倍数。

              私募二级市场确认了缺口：EQT 2025 年 4 月 KRW 4T（$3B）交易，是最干净的市场出清价格。Ably Corporation 获 Alibaba 支持的 $2.1B 估值，GMV 可比但更低（KRW
              2.8T），提供了邻近参考。按 KRW 4T，Musinsa 的 EV/Sales 为 2.7×，与 Naver 倍数一致；在国内业务持续强劲、但不给未经验证的国际收入记分的假设下，这是合理基线。KRW 10T
              IPO 目标要求 EV/Sales 达 6.8×，超过 ZOZO 的 4.3×，且需要非常激进的国际规模假设；目前 0.57% 的出口占比尚不足以支撑。
