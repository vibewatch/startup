  - id: TV005
    title: 推翻投资逻辑与止损触发器
    columns:
      - 触发器
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - KFTC 结构性救济
        - KFTC 要求 Musinsa 移除独家条款，或允许品牌同时上架竞争平台
        - 供给侧护城河变弱；品牌对 MFS 的依赖下降；估值倍数从平台溢价压回零售商倍数
        - 退出或减仓；不再按 3×+，而是按 EV/Sales 1.5–2× 重建模型
      - - IPO 定价低于 KRW 4.5T
        - KOSPI 上市定价 <KRW 4.5T（EV/Sales <3.1×）
        - 市场拒绝给成长溢价；说明基本情境下，机构需求撑不起这套叙事
        - 等 KFTC 结果明确后，再在 <KRW 3.5T 重新评估入场
      - - 国际 GMV 起不来
        - 到 2026 年下半年，虽已开出中国 / 日本门店，国际 GMV 仍 <总 GMV 的 2%
        - 牛市情境的收入假设失效；增长故事退回韩国本土；估值倍数上限按 Naver EV/Sales 处理
        - 降低信心；任何入场前再观察两个季度
      - - RCPS 赎回而非转换
        - 任一 RCPS 批次在 IPO 时选择赎回，而不是转为普通股
        - IPO 锁定期届满时，现金流出、稀释与潜在资产负债表压力会同时出现
        - 直接放弃；任何入场前必须公开 RCPS 条款
      - - 经营利润率压到 6% 以下
        - 2026–2027 年连续两个季度经营利润率 <6%
        - MFS 平台能释放经营杠杆的逻辑被打破；也可能说明品牌定价权在转移
        - 退出；只有结构性修复或 CEO 更换后才重新评估
      - - 中国 Anta JV 退出或减记
        - Musinsa 宣布退出 Anta JV，或在 18 个月内减记中国投资
        - 中国可选性——牛市溢价的关键来源——消失；国际 GMV 增长坍塌
        - 熊市情境变成基本情境；目标区间 KRW 2.5–3.5T
    notes: 触发器可通过 DART 文件、KFTC 官方新闻稿，以及 IPO 后季度业绩会跟踪。
