      - number: '2.5'
        title: 跨境、全球扩张与 K-fashion 出口市场
        blocks:
          - type: paragraph
            body: >-
              Musinsa 市场机会中的跨境维度，既是增长最快的方向，也是最不确定的方向。2025 年，韩国企业海外线上时尚销售达到创纪录的 ₩3.0 trillion（$2.1 billion），同比增长
              16.4%，连续三年录得两位数增长。2025 年对美国出口增长 26.3%；中国和东南亚仍然强劲。Musinsa 自身全球店铺 GMV 在 2026 年 Q1 增长超过 48%，平台出口额仅 2026 年 Q1
              就同比激增约 11.9 倍至 ₩15.3 billion，占季度收入 4.2%（一年前为 0.44%）。

              公司目标到 2030 年海外交易额达到 ₩3 trillion。截至 2026 年初，全球业务累计交易额达到 ₩240 billion，由日本和中国支撑。Musinsa 日本快闪店——包括 2026 年 4
              月为期 17 天、携 79 个韩国品牌亮相的 Media Department Tokyo 活动——显示真实消费者需求：2025 年 10 月的前序活动 24 天吸引 82,000 名访客，并把参与品牌销售额拉升
              3.5 倍。2025 年 12 月，Musinsa Standard 上海旗舰店（淮海路 1,400 sqm，日均 500,000 通勤人流）开业后立即获得强劲需求。

              韩国政府强化了这条轨迹：2026 年项目每年投入 ₩47.1 billion，支持跨境电商 SME 处理海关、认证、物流和数字化集成。对 Musinsa 的 10,000
              品牌出口基础设施来说，这是结构性顺风，因为较小品牌无法独自吸收跨境物流复杂度。

              国际 TAM 结构上很大，但转化并不均匀。2023 年，韩国以 $32.1 billion 时尚出口额位列全球第
              7；前五大出口目的地为美国（32%）、中国（18%）、日本（11%）、德国（7%）和英国（5%）。不过，Musinsa 具体平台模式可服务的全球 K-fashion 份额未知；没有分析师发布 Musinsa
              全球店铺的跨境 SAM。2026 年 IPO 流程以 ₩10 trillion（$7.4B）估值为目标，隐含定价了强劲全球增长；日本 / 中国 / 美国扩张轨迹若不及预期，将成为估值论点的重大下行风险。
