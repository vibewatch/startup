      - number: '5.3'
        title: 部署、工程组织与路线图
        blocks:
          - type: paragraph
            body: >-
              Musinsa 的招聘策略体现其 AI-native 转型野心。2026 年 1 月，公司推出「Musinsa Rookies」初级开发者项目，吸引 2,000 多名申请者，并以 OpenAI Codex
              作为核心评估工具——候选人考核重点是 AI 增强的问题解决能力，而不只是编码熟练度。2026 年 3 月，公司选出 66 名开发者。公司目标是在三年内将技术员工占比提高到总人数 40%
              以上；backend、frontend、ML、SRE 和 data engineering 岗位通过「Musinsa Careers」滚动招聘。2025 年 8 月举办的内部 AI
              黑客松「MUSNSAI」为开发者文化中的 AI 采用提供了早期概念验证。技术部门 VP Jeon Jun-hee 将强化 AI literacy 描述为「必要，不是选择」，公司推进四阶段「AI
              native」路线图，目标 2027 年 Q1 完成。路线图覆盖工程（初期 AI 工具采用）、内容创作（AI Studio 规模化）、客服（AI CS Agent 推出）和全平台整合。目前处于 beta 的「AI
              Customer Service Agent」把 LLM 检索标准流程与 FAQ 查询结合起来，处理售后咨询。新版 app 1.32.0（按 App Store 更新说明，2026 年 6 月 11
              日发布）在商品页加入 AI 驱动的商品摘要和翻译，以及真实客户穿搭照片——说明 AI 功能已经直接上线到面向消费者的产品界面。线下部署里程碑包括 Megastore Seongsu（2026 年 4 月）和
              Musinsa Standard 中国门店（上海淮海路与南京东路），两者都与 Tmall 和 Global App 打通，让到店后能无缝转到线上继续购物。
