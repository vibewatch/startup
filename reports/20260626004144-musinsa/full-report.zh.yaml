  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险框架与严重性概览
        blocks:
          - type: paragraph
            body: >-
              Musinsa 的投资风险画像由其后期私营公司状态、正在推进的
              IPO，以及三项相互竞争的战略任务之间的张力共同塑造：守住韩国平台主导地位、扩大线下零售、并在中国和日本执行资本密集型全球扩张。公司的经营模式——marketplace
              佣金、自有品牌直营零售、策展式品牌分销的混合体——同时暴露于平台监管风险、零售执行风险和品牌信任风险。本章风险按已知缓释措施后的剩余严重性排序。

              短期最尖锐的风险，是 IPO 估值和时间不确定性，以及正在进行的 KFTC 调查。两者都能直接传导到股权价值：上市失败或延迟会卡住中国扩张所需资本，而 KFTC
              若就不公平交易行为作出不利裁决，可能加速品牌合作伙伴流向 Naver 或 Coupang。2026 年 3 月爆出的换标丑闻，是四年内第三起产品完整性事件，强化了一个模式：2026 年 Q1 宣布的 AI
              筛查系统尚未完全解决问题。隐私合规风险是结构性的：Musinsa 管理 16M+ 会员的行为和支付数据，2026 年 PIPA 修订案把严重事件最高罚款提高到总收入 10%——按 2025 年收入规模，相当于
              KRW 146.7B。竞争侧，Shein 在韩国女装 MAU 的增长已于 2025 年末超过 Queenit，Naver 也在主动争抢在 Musinsa 上建立受众的 K-fashion 品牌，Musinsa
              的品牌伙伴护城河面临真实的多渠道侵蚀风险。
            claimRefs:
