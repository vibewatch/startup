      - number: '2.2'
        title: 市场规模：TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >-
              多个分析口径都指向一个约 ₩52.3 trillion（按 2023 年汇率约 $38B）的韩国整体时尚市场，并预计到 2027 年增至 ₩62 trillion，5 年 CAGR 为中个位数。线上时尚是
              Musinsa 的核心可服务市场，2023 年约占韩国国内时尚总销售额 38%，约等于 $14–17 billion；线上渠道增速快于整体市场（2023 年线上增长 12%，线下下降 5%）。Statista
              预计韩国电商时尚板块仅服装收入 2025 年约 $13.7 billion，到 2034 年增至 $22 billion，CAGR 为 5.44%。

              公开估计之间的方法冲突很重要，本报告予以保留：Gitnux 用更宽定义（包含美妆配饰）估算 2027 年韩国整体时尚市场为 ₩62 trillion（约 $45B），而 Statista 仅线上服装数字（2025
              年 $13.7B）采用更窄定义，排除鞋履和配饰。ECDB 追踪 Musinsa 2025 年年度 GMV 为 $2.531 billion——显著低于 Musinsa 公司口径披露的 2024 年 $3.3
              billion GMV，差异可归因于 1P vs. 3P 归因方法和汇率换算时点。两个数字都没有经审计披露独立验证。

              对 Musinsa 的 SAM，最佳可用代理是面向 18–35 岁人群的韩国线上街头服饰和当代时尚板块：2025 年估计每年 $5–8 billion，方法是把 Musinsa 披露的约 38%
              线上时尚市场份额主张，套用到 $14–17B 线上 TAM。SOM——Musinsa 实际平台 GMV——按公司披露口径，2024 年约 $3.3 billion，意味着在 $13–17B 线上时尚 TAM 中占
              20–25%。这些是作者构建的估算；没有独立分析机构发布 Musinsa 专属 SAM。
