      - number: '3.5'
        title: 不利证据与商品化风险
        blocks:
          - type: paragraph
            body: >
              三股不同的不利动态，对 Musinsa 竞争地位构成实质风险。第一，韩国公平交易委员会（KFTC）2024 年 9 月对 Musinsa 进行了为期四天的现场调查，并在 2026 年 4 月扩大为后续突击检查（同
              Lotte Himart 一起），调查大规模分销违规。调查核心是 Musinsa 是否胁迫品牌接受独家交易安排——阻止它们进入其他平台并强加最惠国定价——从而违反《垄断规制及公平交易法》第 45
              条。Musinsa 否认不当行为，称合作协议保护小品牌价值，但行业来源确认，限制品牌多平台经营的做法持续了数年。第二，品牌多平台经营趋势正在加速：包括 Matin Kim 和 Pottery 在内，曾在
              Musinsa 上建立身份的主要 K-fashion 品牌，已在 2025–2026 年扩张到 Naver 和 Coupang。KFTC 调查似乎正在催化品牌独家性更快从 Musinsa
              平台解绑。第三，Musinsa 通过 Anta Sports 合资公司进入中国，带有结构性风险：Hyundai Motor 和 Lotte 都曾大规模进入中国，随后因政治和竞争因素被迫以高成本撤退。分析师也质疑
              ₩10T（$7.4B）IPO 目标——约等于 143x 过去利润——是否嵌入了激进全球增长假设，而中国执行和韩国 KFTC 结果可能推翻这些假设。
