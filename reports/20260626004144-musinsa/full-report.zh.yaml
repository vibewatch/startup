          - type: callout
            title: 换标模式指向系统性平台信任风险
            body: >-
              2022 年 Fear of God Essentials 假货事件、2024–2025 年填充物标签丑闻，以及 2026 年 3 月 MARZIN 换吊牌事件，构成了模式，而不是孤立事件。每次都暴露
              Musinsa 售前核验能力的缺口。公司反复采取的回应——暂停品牌，而不是直接向消费者道歉——被批评为不足以修复信任。2026 年 Q1 上线的 AI
              筛查系统，是迄今最具体的缓释措施，但尚未经过独立验证；结构性约束仍在：Musinsa 不实际持有寄售库存，限制了售前检查覆盖面。
