      - number: '7.3'
        title: 竞争与商业模式风险
        blocks:
          - type: paragraph
            body: >-
              平台护城河侵蚀。韩国时尚电商市场正在发生结构性的多渠道碎片化。Naver 正积极引入 K-fashion 品牌——Matin Kim、MARITHÉ FRANÇOIS GIRBAUD、Pottery
              等——并提供资金支持、社区和营销工具。Coupang 于 2026 年初加入 Mardi Mercredi 和 MARITHÉ FRANÇOIS GIRBAUD，利用其 17M+
              日活用户基础和无摩擦退货，降低品牌感知风险门槛。Fashion News Korea 2026 年 5
              月报道称，一位行业人士表示：「时尚品牌正在摆脱对单一平台的依赖，并越来越多地为不同目标受众使用不同渠道。」如果 Musinsa 的 10,000+ 合作品牌转向多渠道分销，Musinsa
              的佣金收入护城河——2025 年贡献收入 38.8%——会受到实质侵蚀。平台主要防线是品牌社区数据，以及 20 多年来建立的策展权威；这有韧性，但没有法律排他性。

              Shein 与超快时尚竞争。Shein 的韩国月活用户在 2025 年末超过 Queenit，目前正逼近 Zigzag 和 Ably。Shein 的模式——算法趋势最大化，加上 KRW 5,000–20,000
              区间的制造到消费者定价——直接压低构成 Musinsa 目录一部分的东大门式批发品牌。虽然 ECDB 数据显示，随着小额进口免税取消，Shein 全球 GMV 增速在 2026 年急剧放缓至
              6.5%，但其既有用户基础会作为价格竞争替代选项持续存在。Temu 进入时尚也带来类似结构压力。Musinsa 的自有品牌回应 Musinsa Standard，在韩国 19–29
              岁消费者快时尚品牌采用调查中排名第一（购买率 48.1%，领先 Uniqlo 的 42% 和 Zara 的 36%），提供了部分竞争缓冲——但只在 Musinsa 的韩国国内堡垒市场。

              时尚周期性与趋势依赖。Musinsa 的收入模式集中在可选时尚消费——该板块 2023 年在韩国收缩，尽管 Musinsa 自身仍增长。如果 K-fashion
              全球文化顺风减弱，或韩国国内消费环境因通胀、地缘政治不确定性或韩元贬值恶化，GMV 增速可能比 34+ 家实体店承载的固定成本基底更快放缓。Musinsa Standard 线下扩张（目标到 2026
              年底在韩国和中国达到 60 家门店）把一个可变成本平台转成固定成本零售业务，会放大任何需求减速的冲击。
