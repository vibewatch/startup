            body: >
              Musinsa 最具体的客户证据更多来自品牌合作伙伴层面，而不是终端消费者层面。最强的具名案例是韩国女装品牌 Matin Kim：该品牌 2022 年 11 月加入 Musinsa Global
              Store，在日本举办的四场 pop-up 活动全部售罄，并于 2024 年春在 Shibuya Parco 的 pop-up 中 12 天实现 500M KRW 销售，开业前四天吸引超过 4,000
              名访客。2024 年 11 月，Musinsa 与 Matin Kim 签署日本市场独家分销合作，覆盖至 2029 年的所有营销、PR 和线下门店运营；采用 Musinsa 日本本地履约服务后，Matin Kim
              日均销售额提升 75%。Musinsa 日本品牌业务整体在 2021 年设立子公司到 2024 年之间增长 17 倍。


              自有品牌侧，Musinsa Standard 在韩国 19–29 岁人群中的购买意向领先（48.1%，对比 Uniqlo 42%），代表经验证的大规模消费者偏好。平台线下游客销售提供另一个具名证据点：2025
              年，Musinsa Select 店和韩国 Musinsa Standard 门店的外国顾客合计销售额超过 20B KRW，覆盖 136 个国籍，同比提升六倍。


              29CM 达到 KRW 1T 交易额里程碑（2025 年 10 月），以及 2026 年 Q1 时尚 GMV 增长 33%，构成 Musinsa Group 内部品牌扩张成功的平台级证据。Musinsa 提到
              Stand Oil、Glowny 和 Rest & Recreation 等小品牌通过其支持基础设施成功进入日本市场，但没有公开披露这些品牌的单独 GMV 或结果数据。
