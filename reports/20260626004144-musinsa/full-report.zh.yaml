      - number: '5.5'
        title: 信任、安全、隐私与合规
        blocks:
          - type: paragraph
            body: >-
              Musinsa 的合规底线建立在韩国 Personal Information Protection Act（PIPA）之上。公司修订后的 Global Store Terms of Service 和
              Privacy Policy 于 2026 年 4 月 17 日生效，并至少提前 30 天通过网站公告和直接 email / SMS 通知所有用户，符合 PIPA Article 3
              要求。已发布的隐私政策覆盖数据收集目的（会员管理、服务履行、支付处理和营销）、用户权利（访问、更正、删除、限制和反对）以及跨境数据传输保障。PIPA 2026 年修订案允许对影响 1,000
              万以上用户的严重或重复数据泄露处以最高总收入 10% 的罚款；考虑到 Musinsa 会员数超过 1,600 万，这是实质性合规风险。符合条件的公司到 2027 年 7 月 1 日必须取得
              ISMS-P（Information Security Management System–Privacy）认证；Musinsa 是否在准备尚未确认。产品质量方面，Musinsa 于 2025 年 3
              月与韩国前三大时尚检测认证机构签署 MOU，用于 Musinsa Standard 产品验证。转售真伪方面，Soldout 公开称，对鉴定后仍交付的假货提供 300%
              赔付保证——这是公司声称的数字，没有披露审计轨迹。可持续方面，Musinsa 于 2026 年 3 月发布 greenwashing 指南，但针对合作品牌的执行机制未说明。国际隐私界面正在成熟：Global
              Store 隐私政策处理跨境数据传输（与日本和中国业务相关），但这些司法辖区的数据本地化合规深度没有公开文件证明。
