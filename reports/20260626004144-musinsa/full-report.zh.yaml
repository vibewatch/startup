      - number: '1.4'
        title: 里程碑、扩张、不利事件与 IPO 时间线
        blocks:
          - type: paragraph
            body: >
              Musinsa 25 年公开发展史在韩国时尚独角兽里异常干净：没有破产事件，没有重大所有权争议，也没有其他韩国互联网公司曾遭遇的治理丑闻。公司 2012 至 2019
              年未引入外部资本，自我融资并保持经营盈利；Sequoia 投资后开始激进扩张。关键里程碑包括：2017 年推出 Musinsa Standard（自有品牌），到 2020 年收入突破 KRW 100B；2021
              年在弘益大学附近开出首家 Musinsa Standard 实体店；2022 年在 13 个国际地区上线 Musinsa Global Store；2024 年公司首次跨过 KRW 1 trillion
              年合并收入，并从 2023 年 KRW 8.6B 的小幅营业亏损，转为 KRW 102.8B 营业利润。


              IPO 时间线如下：2025 年 8 月——Musinsa 向本土和全球投行分发 RFP，目标上市估值 KRW 10 trillion（约 $7.4B）。2025 年 11 月——国内领先候选机构 Mirae
              Asset Securities 退出承销商陈述，释放估值怀疑信号（目标意味着基于 2024–2025 年利润的 PER 约 143–160x，远高于 KOSPI 可比公司）。2025 年 12
              月——Musinsa 敲定承销商：Citi Global Markets（全球牵头）、JPMorgan（全球联席牵头）、Korea Investment & Securities 和 KB
              Securities（国内）。2026 年 5–6 月——公司正在准备初步上市审查申请，目标 2026 年提交。


              2026 年初出现两项不利事件。第一，换标丑闻：Musinsa 暂停销售被发现虚报材料成分和产品产地的品牌，但因未直接向消费者道歉而受到批评，引发 IPO
              前的平台监管担忧。第二，韩国公平交易委员会（KFTC）2026 年 4 月对 Musinsa 开展现场检查，调查其供应商交易中是否违反《大型零售业法》——此前 Olive Young 和 Daiso
              也遭遇类似检查。截至本次报告日期，两起事件均未导致正式处罚，但都仍是活跃的监管和声誉尽调事项。
