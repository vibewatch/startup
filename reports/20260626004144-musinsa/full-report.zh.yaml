      - number: '6.2'
        title: 采用轨迹与平台级增长
        blocks:
          - type: paragraph
            body: >
              2026 年初，Musinsa 国内月活用户达到 765 万，同比增长 8.5%。绝对规模相对竞争对手很大，但增速已从此前高双位数水平放缓，反映韩国国内市场饱和度上升，也反映韩国线上时尚行业走向成熟。2026 年
              2 月，平台记录约 300 万笔交易，对应每 MAU 每月约 0.39 笔交易——低于 Daiso、Olive Young 等必需品类平台，但符合时尚电商低频、高客单的典型动态。过去六个月每名 Musinsa
              用户平均消费 124,000 KRW（约 $89 USD），在韩国主要垂直电商平台中最高，说明访问频次虽中等，但购买意图和客单价相对高端。


              全球店于 2022 年 9 月上线，截至 2025 年 4 月，年均增长 260%，覆盖 13 个市场并达到 300 万 MAU。Musinsa Standard 2025 年全球平台销售额同比增长
              162%，韩国门店外国顾客销售额超过 15B KRW——形成一个正循环：在韩国的 K-fashion 旅游转化为持续线上需求。29CM 时尚品类 GMV 在 2026 年 Q1 同比增长
              33%，跑赢主平台国内增长轨迹。


              Musinsa Standard 在韩国 Gen Z 消费者中的采用率已超过 Uniqlo：2024 年 10 月 Open Survey 对 800 名 19–29 岁韩国人的调查显示，48.1% 购买过
              Musinsa Standard，高于 Uniqlo 的 42% 和 Zara 的 36%。该消费者偏好调查佐证自有品牌采用率上升，但并不直接衡量平台级互动或忠诚度。Moloco Ads
              案例研究显示，Musinsa 将用户分为 active（60 天内登录）、semi-active 和 inactive 三类，用于定向重新激活；同时归因于 Moloco Ads 和 MCM 的用户 ARPPU
              比未归因用户高 66%。
