      - number: '5.2'
        title: 技术架构与 AI 基础设施
        blocks:
          - type: paragraph
            body: >-
              2025 年下半年开始，Musinsa 工程组织在全公司「AI Literacy」计划下进行结构性转型。技术部门对 OpenAI Codex 的采用，从 2025 年 7 月 100 名开发者的概念验证，扩大到
              2026 年 3 月约 700 名开发者。Musinsa 自称在这一窗口期内，开发者生产力（按内部「每名开发者每月 points」衡量）提升
              74.7%；该数字方向上有参考意义，但方法未披露，独立研究提示其可能高估真实吞吐，因为 commit 和 pull request 等活动指标会随 AI 工具自然上升，却没有计入新增 review 时间。其他在用
              AI 编码工具包括 Claude、Cursor 和 Junie，用于代码生成与分析。开发界面之外，Musinsa 的「AI Studio」内容生成工具每天由 10 多个部门超过 270 名员工使用，平均每月产出
              60,000 多条内容。「Visual Search」基于 300 万张时尚图片训练，支持以图找货。「AI CS Agent」处于 beta 阶段，用基于 LLM 的 FAQ 路由处理售后咨询。2026 年 6
              月，Musinsa 推出「AI Trend Curation」，分析实时外部时尚趋势数据并主动呈现相关商品——最初覆盖帽类，计划扩展至所有时尚和美妆品类。最核心的 AI 项目是 Musinsa MCP（Model
              Context Protocol），这是内部开发的商业发现界面，用户无需输入明确搜索关键词，就能凭自然语言上下文（时间、地点、场合、天气、价格区间、品牌偏好）获得商品推荐。MCP 服务于 2026 年 3 月在
              KakaoTalk 首发，并于 2026 年 6 月登陆 OpenAI 的 ChatGPT 平台，代表公司有意从以搜索为中心转向对话式时尚商业。技术媒体将其平台架构描述为 cloud-native 和基于
              microservices；公司正在建设统一数据平台，把过去分散在 Musinsa Store、29CM、Soldout 和 Global 的营销、销售、客户、运营数据流整合起来。CEO Park Joon-mo
              公开表述的目标，是让所有平台「像一个互联的核心一样运转」。
