  - id: FV003
    title: 估值与回报区间——熊市 / 基准 / 牛市情景
    type: range
    layout: standard
    summary: 熊市、基准、牛市三种情景下，以 KRW T 计的隐含企业价值低到高区间，并附 USD 等值；区间差异主要由国际 GMV 和 KFTC 结果不确定性拉开。
    data:
      items:
        - label: 熊市情景
          low: 2.5
          high: 3.5
          note: KFTC 补救措施 + 本土增长放缓 + 利润率压缩；OTC 市场隐含 KRW 3.4T 落在该区间内
        - label: 基准情景
          low: 4.5
          high: 6
          note: EQT 二级交易锚点（KRW 4T 底线），本土增长延续，国际业务温和推进；IB 共识 KRW 4–5T
        - label: 牛市情景
          low: 8
          high: 10
          note: IPO 目标区间；需要中国 / 日本放量且 KFTC 放行；目前仍是期权溢价
    approximationNotes: 按 KRW 1,310/USD 换算：熊市 $1.9–2.7B，基准 $3.4–4.6B，牛市 $6.1–7.6B。区间体现定性判断，不是 DCF；均假设 RCPS 在 IPO 时转为股权。
    claimRefs:
      - CV004
      - CV015
      - CV032
      - CV034
      - CV035
      - CV041
      - CV042
  - id: FV004
    title: 投资 KPI——IC 可用评分
    type: kpi
    layout: standard
    summary: 七维投资评分卡（0–5 分），覆盖市场、验证、护城河、经济性、风险、估值纪律和证据质量；总分 23/35，与 WATCH 定位一致。
    data:
      items:
        - label: 市场机会
          value: 4
          context: 韩国线上时尚 TAM 约 $17–18B，CAGR 8–10%；K-fashion 全球化叙事真实且在加速
        - label: 业务验证
          value: 4
          context: 收入 CAGR 27.5%；2024 年首次盈利；2025 年 OP 利润率 9.6%；2026 年 Q1 加速
        - label: 竞争护城河
          value: 3
          context: 深厚品牌生态 + MFS 锁定，但 KFTC 调查、Coupang/Naver 招募品牌和中国玩家进入，都是真实威胁
        - label: 单位经济性
          value: 3
          context: 佣金利润率强；库存周转下降；RCPS 费用扭曲净利润；Soldout/29CM 子公司拖累
        - label: 风险画像
          value: 2
          context: KFTC 未解决；RCPS 悬而未决；中国 / 日本执行仍处早期；OTC 隐含市值比 IPO 目标低 66%
        - label: 估值纪律
          value: 2
          context: KRW 10T 目标缺乏可比公司支撑；EQT 的 KRW 4T 和 IB 共识 KRW 4–5T 更可信；只在 KRW 5.5T 以下进入
        - label: 证据质量
          value: 5
          context: 四份 DART 公开申报；已确认承销团；已核验 OTC 价格；LS Securities 独立分析；EQT 标记
    approximationNotes: 评分为定性判断（0=很弱，5=很强）。总分 23/35 反映一个悖论：公司运营很优秀，但价格押注的是尚未兑现的乐观结果。
    claimRefs:
      - CV015
      - CV016
      - CV017
      - CV026
      - CV028
      - CV032
      - CV034
      - CV042
