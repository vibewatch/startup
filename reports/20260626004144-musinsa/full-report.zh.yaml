  - id: FV001
    title: 推荐逻辑流程
    type: flow
    layout: wide
    summary: 这条链路从 Musinsa 的规模验证和盈利能力出发，经过竞争位置、融资背景和估值，推导出 WATCH 建议。
    data:
      nodes:
