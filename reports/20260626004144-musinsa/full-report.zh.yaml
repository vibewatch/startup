      - number: '4.4'
        title: 资本结构、融资与 IPO 准备度
        blocks:
          - type: paragraph
            body: >
              自 2019 年以来，Musinsa 已披露三轮主要股权融资，合计约 KRW 430B（约 $474M）。分别是 Series A（2019 年 11 月，约 KRW 100B，Peak XV 投资，估值约
              $800M）、Series B（2021 年 3 月，约 KRW 130B，Peak XV + IMM 投资，估值约 $2.2B），以及 Series C（2023 年 7 月，KRW 200B /
              $190M，KKR + Wellington 投资，估值约 KRW 3.5T / $2.4B）。2025 年 4 月 EQT 交易（约 KRW 20B）是从早期投资者手中购买老股，隐含估值约 KRW
              4T，只给出二级市场价格锚，并未给公司带来新增股本。


              2025 年上半年一次 K-IFRS 会计处理调整显著改变了资本结构：公司将可赎回可转换优先股（RCPS）从权益重分类为金融负债，在债务端增加约 KRW 736B。报表口径的资产负债率因此被推高至约
              620%，但剔除 RCPS 后，真实经营杠杆更温和，约 100–150%。RCPS 的非现金利息费用（每半年约 KRW 40B）压低了报表净利润，也是 2025 年 KRW 140.5B 经营利润最终只剩 KRW
              7.7B 净利润的主要原因。IPO 时 RCPS 将转换或被赎回，上市后该项目会消失。


              根据 2025 年上半年 DART 半年报，截至 2025 年中，公司现金及短期金融资产约 KRW 462B（约 $323M），足以支撑持续经营和线下扩张。按 2025 年 EBITDA KRW 248B
              以及温和资本开支估算，年度经营现金生成（不含营运资本波动）约 KRW 200–250B。


              IPO 进程：Musinsa 于 2025 年 7 月向 Korea Exchange（KRX）提交初步上市审查申请，目标登陆 KOSPI。2025 年 12 月，公司选择 Korea Investment &
              Securities 和 KB Securities 担任国内主承销商，Citi Global Markets Securities 与 JP Morgan 担任海外联合承销商。公司目标市值为 KRW 10T（约
              $7.4B），意味着 IPO 募资规模超过 KRW 2T。Mirae Asset Securities 最初入围候选名单，但在 2025 年 11 月主动退出承销 PT，IB 消息人士称原因是与 KRW 10T
              估值存在分歧。市场共识估计公允价值在 KRW 4–7T，依据包括 PER 分析（KRW 10T = 2024 年利润的 143x，而行业均值 29x）和 PSR 对比（KRW 10T = 约 2025 年收入的
              7x，而 Coupang 在 NYSE 上市时为 3.5x）。
