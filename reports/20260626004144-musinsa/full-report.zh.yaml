  - id: TV002
    title: 投资论点与反论点
    columns:
      - 论点类型
      - 论点
      - 证据锚点
      - 什么会改变判断
    rows:
      - - 正论点
        - MFS 上有 10,000+ 个品牌，国内时尚护城河占主导；供给侧锁定真实存在
        - DART 申报；seoulz.com
