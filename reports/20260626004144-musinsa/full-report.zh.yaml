      - number: '2.3'
        title: 需求驱动：街头服饰、Gen Z 与 K-culture
        blocks:
          - type: paragraph
            body: >-
              Musinsa 的需求引擎建立在四个会相互叠加的结构性顺风上：Gen Z 数字优先购物行为、韩国街头服饰和球鞋文化、K-pop 与 K-media 的文化牵引，以及全球对 K-fashion 胃口扩大。

              韩国 Gen Z 消费者（18–24 岁）是全球数字活跃度最高的购物人群之一：35% 每周线上购物，72% 在购买前查看 Instagram 或 TikTok 以验证趋势，85% 阅读同伴评论。移动端推动韩国约
              78% 的线上时尚交易。这种数字优先姿态直接利好 Musinsa 这类围绕智能手机搭建发现、内容和履约的平台原生业务。

              街头服饰和球鞋文化是品类发动机。2026 年 Acubi 美学——一种融合 Y2K 廓形、低饱和配色和 oversized 技术层叠的韩国 Gen Z
              街头风格——持续拉动韩国小型独立品牌（thisisneverthat、mahagrid、ADLV/Acme De La Vie、Covernat）需求；Musinsa
              孵化了这些品牌，也是它们的主要分销渠道。不同于西方 hype-drop 文化，韩国街头服饰更重视多场景和持续可穿性，因此形成重复购买模式，而不是单一事件尖峰。

              K-pop 提供文化速度。Musinsa 签下 NewJeans 作为品牌大使；该组合美学与 Musinsa
              产品目录直接呼应。平台赞助的品牌活动和偶像联动，可以在很短周期内把粉丝转化为可衡量购买事件——行业观察者认为速度快于西方市场。Netflix 和 Disney+ 上的 K-drama 与 K-content 扩大
              K-fashion 全球触达，也拉动与入境旅游挂钩的零售：2026 年 Q1，外国顾客贡献 Musinsa Standard 旗舰店（明洞、西面、圣水、汉南、弘大）约 44% 销售额。

              美妆和运动相邻品类正在扩大平台 TAM。2026 年 Q1，Musinsa Beauty 自有品牌 GMV 同比增长 120%，公司正开设 Mega Store Seongsu，打造时尚与美妆结合的目的地。约
              800 个美妆品牌已入驻。运动品类受益于韩国消费者对户外 / 技术服饰的偏好，而这种审美本身又与 K-pop 相邻。
