figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Musinsa 用 25 年从韩国球鞋论坛走到 IPO 前时尚独角兽，中间经历融资拐点、产品转向和负面事件。
    data:
      items:
        - date: '2001'
          label: 以球鞋社区创立
          detail: Cho Man-ho 为韩国球鞋爱好者创办「Musinsa」线上论坛。
          tone: positive
        - date: '2003'
          label: Musinsa.com 内容上线
          detail: 平台扩展到泛街头时尚内容；创始人每周拍摄首尔街头穿搭。
          tone: positive
        - date: '2009'
          label: 电商店开业
          detail: Musinsa Store 上线；确立只做正品精选的原则。
          tone: positive
        - date: '2012'
          label: 公司注册成立
          detail: 正式主体设立；开始自筹资金并实现盈利。
          tone: positive
        - date: 2019-11
          label: Series A — $800M 独角兽
          detail: Sequoia Capital 领投 KRW ~100B；首次引入外部资本。
          tone: positive
        - date: 2021-03
          label: Series B — $2.2B 估值
          detail: Peak XV 与 IMM 投资 KRW ~130B；首家线下门店开业。
          tone: positive
        - date: '2022'
          label: Global Store 上线
          detail: 开始向 13 个地区做国际扩张；全球 GMV 以 >260% CAGR 增长。
          tone: positive
        - date: 2023-07
          label: Series C — KKR 以 $2.4B 估值领投
          detail: KKR 与 Wellington 投资 KRW ~200B；这是 KKR 在韩国的首个科技成长交易。
          tone: positive
        - date: '2024'
          label: 收入突破 KRW 1T；盈利
          detail: 合并收入 KRW 1.24T（同比 +25.1%）；经营利润 KRW 102.8B。
          tone: positive
        - date: 2025-04
          label: EQT 二级交易估值 KRW 4T
          detail: 欧洲 PE 巨头从早期 VC 手中买入股份，较 Series C 溢价 15%。
          tone: positive
        - date: 2025-08
          label: IPO 流程启动
          detail: 向全球与本土银行发出 RFP；目标估值 KRW 10T。
          tone: neutral
        - date: 2025-12
          label: 承销商确定；联席 CEO 重组
          detail: Citi 与 JPMorgan 被任命为全球牵头行；Cho Nam-sung 加入成为联席 CEO。
          tone: neutral
        - date: 2026-03
          label: 换标丑闻
          detail: 品牌因材料误导被暂停；未见消费者道歉。
          tone: warning
        - date: 2026-04
          label: KFTC 现场检查
