      - number: '3.3'
        title: 全球平台与替代威胁
        blocks:
          - type: paragraph
            body: >
              全球时尚平台和超快时尚零售商带来替代与位移威胁，其结构不同于韩国本土竞争者。Shein 是最尖锐的威胁：其韩国月活用户从 2025 年初 670,000 增长到 2025 年 11 月超过 Queenit 的
              MAU，动力来自 ₩10,000–₩20,000 的连衣裙、TikTok 放大的营销，以及全球趋势响应引擎。全球范围内，Shein 在 2024–2025 年服装市场份额增加 1.1 个百分点，而 Zara 下降
              0.3 个点，H&M 下降 0.6 个点。Zara 和 H&M 仍在韩国存在，但正向高端重新定位，让出大众时尚空间。Farfetch 2024 年 2 月进入清算，并被 Coupang 以 $500
              million 收购；如今它在韩国作为 Coupang 集成的奢侈品渠道运营，作为独立竞争力量的强度下降。SSENSE 2025 年因多品牌奢侈品零售商模式结构性崩塌——奢侈品牌收紧直接面向消费者渠道——在加拿大
              CCAA 下寻求债权人保护，如今在韩国面临运营约束。StockX 在带鉴定的限量转售细分市场竞争，而 Musinsa 通过 KREAM 和 Soldout 切入该市场；StockX
              的全球平台优势是二级市场板块的主要威胁。多个全球奢侈品多品牌平台（Farfetch、SSENSE、MatchesFashion、YNAP）倒下，减少了 Musinsa
              在高端市场面对的可服务竞争，但也说明多品牌时尚电商要盈利扩张有多难——这是 Musinsa 国际化时自身也要面对的风险。
