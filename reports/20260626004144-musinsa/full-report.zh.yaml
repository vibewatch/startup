      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: 以 10,000 个品牌护城河支撑品类领导地位
            body: >-
              Musinsa 目录深度——10,000+ 合作品牌，许多 K-indie 品牌与其有独家或近独家分销关系——形成发现网络效应，横向平台（Coupang、Naver）很难只靠 GMV
              复制。品牌生态就是护城河；thisisneverthat、ADLV 和 Matin Kim 等品牌的全国和全球影响力，几乎完全通过 Musinsa 的编辑基础设施建立。这种锁定是市场地位中最可防守的部分。
            calloutType: strength
            claimRefs:
              - CM003
              - CM016
              - CM033
          - type: callout
            title: GMV 方法冲突带来估值模糊
            body: >-
              Musinsa 披露 2024 年 GMV 为 $3.3B，而 ECDB 独立估计 2025 年为 $2.531B——差异显著，源于 1P/3P 归因方法和汇率时点。公司尚未发布 GMV 层面的经审计财务，预计
              2026 年 H2 的 IPO 招股书将是第一次严格验证披露。投资者若把公司披露 GMV 作为主要测算依据，应在招股书提交前给予显著不确定性折价。
            calloutType: risk
            claimRefs:
              - CM007
              - CM008
              - CM031
          - type: callout
            title: 跨境是新的利润率扩张向量
            body: >-
              2026 年 Q1，Musinsa 出口收入从近乎为零的基数同比激增 11.9x。它对 P&L 仍不重要（占季度收入 4.2%），但轨迹显示，如果日本和中国增长延续，2–3 年内可能达到
              10–15%。关键在于，韩国政府每年 ₩47.1B 的跨境支持项目，部分补贴了本会压缩全球利润率的物流成本。全球机会真实存在，但从 ₩240B 累计交易额增长到 2030 年 ₩3T，需要 5 年约 12x
              增长——无论按何种标准都很激进。
            calloutType: insight
            claimRefs:
              - CM020
              - CM032
              - CM034
              - CM035
              - CM036
          - type: callout
            title: SAM 与 SOM 均由作者构建
            body: >-
              没有独立分析机构发布 Musinsa 专属 SAM 或 SOM。本章中的 $5–8B SAM 和 $3.3B SOM（使用公司披露 2024 年
              GMV），来自把线上渗透率套用到汇编后的时尚市场统计。它们分析置信度低，应视为方向性脚手架，而非投资级预测。IPO 招股书将是第一次可以用经审计 GMV 和收入数字，以更高置信度重建这些估算的场合。
            calloutType: assumption
