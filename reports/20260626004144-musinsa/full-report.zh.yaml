      - number: '1.2'
        title: 治理、领导层与关键人物风险
        blocks:
          - type: paragraph
            body: >
              Musinsa 创始 CEO Cho Man-ho（Manho Cho）仍是公司的核心高管和公开门面，也是 The Business of Fashion BoF 500 Class of 2025
              中唯一的时尚平台 CEO。BoF 称其为「借助韩国文化影响力、建立融合技术与社区的新时尚商业模式，推动 K-fashion
              全球扩张的创新型领导者」。他的持续参与具有实质影响：他从高中项目搭起社区，历经三轮融资维系每一段机构投资者关系，也用创始人信誉支撑 10,000+ 合作品牌对平台的信任，而这些品牌的增长都系于 Musinsa。


              2025 年 12 月，Musinsa 正式采用联席 CEO 治理架构，任命 Cho Nam-sung 为联席 CEO，负责法务、财务、人力和公关等内部支持职能；Cho Man-ho
              继续领导业务运营、产品和全球战略。Park Jun-mo 至少自 2024 年起担任负责全球扩张的联席 CEO，并于 2026 年 1 月转任顾问。此次重组引入完整 C-suite
              层级——CCO、CBO、CGO、CTO、CFO、CLO、CPRO 和 CDeO——每个角色都有条线自主权和年度绩效考核。这是公司迈向 IPO
              准备度的一步，但作为私人公司，董事会构成和投资者治理权利并未公开。Cho Man-ho
              的关键人物风险实质存在：如果他离任或无法履职，平台品牌定位、投资者信心和合作生态都会受冲击，且目前看不到具备同等创始人信誉的明显继任者。
