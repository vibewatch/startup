      - CV023
      - CV024
      - CV032
      - CV041
      - CV042
      - CV043
      - CV044
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - RCPS 转换与赎回条款
        - KRW ~736B RCPS 批次的准确转换价格、赎回触发日期、到期安排，以及任何清算优先权叠加
        - 决定 IPO 后股权结构、优先股持有人会转换还是赎回，以及公众股东真实经济稀释
        - 要求开放 data room；IPO 招股书（DART）提交后确认
      - - 按地区拆分的国际 GMV（2026 年 Q1–Q2）
        - 来自日本、中国（Anta JV + 直营）、东南亚、北美的月度 GMV 拆分
        - 2026 年 Q1 出口增长 11.9× 是从很小基数起步；没有国家拆分，就无法判断中国 Anta JV 牵引力，还是全球店自然增长
        - Data room；IPO 路演管理层问答
      - - KFTC 调查范围与解决时间表
        - 正在审查的具体独家条款、KFTC 是否已出具预裁定建议，以及管理层对最坏救济方案的估计
        - 结构性救济（强制多平台经营）会侵蚀供给侧护城河，并要求估值倍数压缩
        - KFTC 公开公告；聘请法律顾问
      - - Soldout (SLDT) 与 29CM 独立 P&L 2025–2026
        - 各子公司的独立经营利润 / 亏损、GMV 与现金消耗率
        - SLDT 累计亏损 >KRW 66B（2022–2023）；29CM GMV 已突破 KRW 1T，但 EBIT 贡献未确认
        - 通过合并与单体 DART 文件对照确认；data room
      - - KKR、Wellington、EQT 的 IPO 后锁定期与二级流动性计划
        - 每家机构持有人的锁定期到期安排，以及任何计划中的二级发行批次
        - IPO 后机构抛压可能压低股价；KKR 入场估值 KRW 3.5T——在基本情境下，他们考虑退出前上行空间有限
        - IPO 招股书；与投行沟通
      - - 联席 CEO 分工与 Cho Man-ho 接班计划
        - Park Jun-mo（联席 CEO）与 Jo Nam-sung（联席 CEO）的明确职责，以及创始人 Cho Man-ho 在 IPO 后角色的清晰度
        - 关键人物风险：Cho 与 10,000+ 个合作品牌建立了品牌关系；一旦离任或角色弱化，供给侧护城河会受重大影响
        - 管理层访谈；IPO 招股书中的公司治理披露
    notes: 第 1 项和第 3 项是阻断性尽调（未解决就不能投资）。第 2、4、5、6 项为重大事项。
