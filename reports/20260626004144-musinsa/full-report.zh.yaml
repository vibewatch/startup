      - number: '1.3'
        title: 资本基础、融资历史与投资者图谱
        blocks:
          - type: paragraph
            body: >
              自 2019 年以来，Musinsa 通过三轮正式融资累计募集约 KRW 430 billion（约 $474 million），均为一级股权融资；EQT 则在 2025 年 4 月以约 KRW 4
              trillion（$2.8 billion）估值完成二级股份收购。融资顺序为：2019 年 11 月 Series A（Sequoia Capital 投入约 KRW 100B，公司以 $800M
              估值成为独角兽）；2021 年 3 月 Series B（Peak XV Partners 和 IMM Investment 投入约 KRW 130B，估值约 $2.2B）；2023 年 7 月 Series
              C（KKR 领投，Wellington Management 参投，约 KRW 200B，估值约 KRW 3.5T 或 $2.4B）。Series C 是 KKR 在韩国的首笔科技成长投资。


              2025 年 4 月 EQT 二级交易的结构，是以 KRW 20–30B 从韩国早期风投手中收购股份，把隐含估值抬至约 KRW 4T，较 2023 年 Series C 价格高约 15%。EQT Growth
              通过香港办公室运作该交易，据报道还在考虑追加投资。投资者图谱集中在机构 PE 和成长股权：KKR、Wellington、Peak XV、IMM 和 EQT 均持股，并在 IPO
              前拥有实质治理预期。完整股权结构、股份优先权、反稀释权和投票机制均未披露。外部投资者累计一级资本投入为 KRW 430
              billion；二级交易以及轮次之间任何二级市场定价，公开来源均未完整记录。创始人和管理层股权稀释未量化。
