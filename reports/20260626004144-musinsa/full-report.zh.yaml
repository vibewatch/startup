  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与人口结构
        blocks:
          - type: paragraph
            body: >
              Musinsa 可触达的客户宇宙横跨三个互相关联的群体：终端消费者（Musinsa 主 app、29CM 和 Musinsa Global Store 上的用户与买家）、合作品牌（韩国国内卖家 / 付费方超过
              10,000 家），以及在线下体验 K-fashion 的到店游客买家。消费者侧，平台起源于男性偏重的球鞋爱好者社区，如今已经转向更广泛的 Gen Z 和 Millennial 基础：Musinsa 15M+
              注册用户中约 78% 低于 30 岁，十几岁和 20 多岁用户约占总注册基数 60%。「MZ generation」（Millennials 加 Gen Z，年龄约 16–45
              岁）同时驱动国内购买频次和全球转化。


              2021 年收购 29CM 后，Musinsa 触达了女性 25–39 岁人群，这是主平台过去服务不足的客群。到 2026 年 Q1，29CM 女性 MAU 同比增长超过 20%，30 多岁和 40
              多岁女性增长超过 30%。29CM 的 1.76M MAU 超过 W Concept（约 1.15M MAU），使 Musinsa Group 同时成为男性 Gen Z
              街头服饰买家和城市女性生活方式买家的主导平台。


              合作品牌（国内 marketplace 超过 10,000 家，全球店截至 2025 年中约 2,000 家）构成付费方：它们贡献佣金收入（占 2025 年总收入 38.8%）、广告支出和履约费用。Musinsa
              扮演结构上复杂的双重角色——既是帮助这些品牌经营的 marketplace 主体，又运营 Musinsa Standard 这个竞争性自有品牌；后者现在已是 19–29
              岁韩国人购买最多的快时尚品牌。这种张力是客户关系的关键风险，在集中度部分展开。


              2025 年，来自 130+ 个国家的国际买家进入 Musinsa 生态，前五大来源市场——中国（19%）、台湾（18%）、日本（13%）、美国（12%）和新加坡（6%）——合计贡献全球平台买家超过三分之二。年轻
              MZ 消费者约占所有国际买家 80%，与国内年龄结构相似。
