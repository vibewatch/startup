  - id: FM001
    title: Musinsa 市场规模金字塔 — TAM / SAM / SOM（韩国时尚电商）
    type: pyramid
    layout: standard
    summary: Musinsa 韩国时尚电商机会的三层市场规模，从最宽的可触达市场收敛到公司实际平台交易额。
    data:
      items:
        - label: TAM：韩国线上时尚（所有平台、所有细分）
          value: 16
          note: 估计 2024 年年化 $14–17B（中点 $16B）；约 $38B 韩国整体时尚市场的 38%； Worldmetrics/Statista 混合估计；不含线下与非韩国跨境支出
        - label: SAM：韩国线上街头服饰 + 当代时尚（Musinsa 核心客群）
          value: 6.5
          note: 作者估计 ~$5–8B；按 18–35 岁年龄带套用线上时尚份额的约 40–50%；没有独立分析师确认这一子板块；仅作为分析脚手架
        - label: SOM：Musinsa 平台 GMV（2024，公司披露）
          value: 3.3
          note: 公司披露 2024 年 GMV 为 $3.3B；ECDB 用不同方法给出 2025 年 $2.5B；两者均未经审计；约占估算线上时尚 TAM 的 20–25%
    approximationNotes: >-
