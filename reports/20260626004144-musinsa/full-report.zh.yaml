  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反逻辑
        blocks:
          - type: paragraph
            body: >
              Musinsa 的多头逻辑靠五个复合优势支撑。第一，公司已经跑出经营杠杆：收入从 2022 年 KRW 708.5B 增至 2025 年 KRW 1.47T，CAGR 为 27.5%；经营利润率从 1.6% 扩至
              9.6%，处在全球时尚 marketplace 同业高位。第二，平台护城河很深：10,000+ 个合作品牌依赖 Musinsa Fulfillment
              Service（MFS）完成拣货、包装、发货，切换成本真实存在，收入粘性高。第三，自有品牌 Musinsa Standard 2025 年交易额达到 KRW 471B（YoY
              +33%），形成高利润率的第二收入引擎，还带有纯 marketplace 难以复制的实体店可选性。第四，公司已经搭好 IPO 准备基础设施：2025 年 12 月完成联席 CEO 治理重组，2025 年 3
              月任命三名独立董事，并在 2025 年 12 月组建全球承销团（Citi、JPMorgan、Korea Investment & Securities、KB Securities）。第五，2026 年 Q1
              收入加速至 KRW 363.6B（YoY +24.1%），出口达到 KRW 15.3B（+11.9×），说明国际化叙事正从试点转向牵引。

              反逻辑同样具体。公司 IPO 目标市值为 KRW 10T，按 2025 年净利润约 KRW 70B 计算，隐含市盈率 143×，约为韩国上市互联网公司行业均值的 10×，也是 Zalando 当前 PE 的
              7×。IB 行业共识估算的公允价值为 KRW 4–5T，约为目标的一半。Mirae Asset Securities 是韩国最重要的承销商之一，却在 2025 年 11 月最后一轮 IPO
              竞标中拒绝陈述；分析师称这是罕见且有分量的高估值怀疑信号。当时 OTC 市场（Securities Plus）仅隐含 KRW 3.4T（~$2.5B）。RCPS 重分类带来 KRW 736B
              非现金债务负担，把表观负债率推高至 ~620%；即便底层经营利润为正，单体报表仍出现净亏损。到 2025 年 H1，国际 GMV 仍仅占总交易额 0.57%，直接反驳支撑溢价倍数的全球增长叙事。Soldout 和
              Musinsa Japan 在 2024 年都亏损。KFTC 针对涉嫌反竞争排他做法的调查于 2024 年启动，并持续到 2026 年 6
              月，引入了结构性风险：监管可能迫使运营调整，并损害该逻辑最核心的供给侧护城河。
