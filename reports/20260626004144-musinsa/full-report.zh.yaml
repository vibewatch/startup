      - number: '8.5'
        title: 退出准备度与 IPO 机制
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，Musinsa 在几个关键层面已经具备 IPO 运营准备度。四家银行承销团（Korea Investment & Securities、KB
              Securities、Citi、JPMorgan）已于 2025 年 12 月敲定；公司披露，最早会在 2026 年 Q3 递交 KOSPI 初步审查。联席 CEO 架构（Park Jun-mo + Jo
              Nam-sung）和独立董事会（三名外部董事）与 KOSPI 上市要求匹配。公司选择 DART 作为主要披露体系，提交季度和半年度报告，提高了机构投资者尽调可得性。

              IPO 结构性风险不小。若按 KRW 10T 目标估值上市，所需 KRW 2T+ 公众流通盘体量很大；韩国本土先例并不乐观。DN Solutions（目标 KRW 4–5T）公开发行只募到 KRW
              1T；Lotte Global Logistics（KRW 500B）因需求疲弱撤回。Musinsa 管理层知道，仅靠韩国本土市场无法吸收 KRW 2T
              流通盘，因此引入全球承销商；但这也加大了对国际机构需求的依赖，而多数全球 LP 对 K-fashion 故事并无研究覆盖。

              优先股与摊薄压力：RCPS 转换机制对公开市场投资者很关键。若优先股股东按 IPO 价格转换，摊薄后股份数会增加。若 IPO
              价格低于转换门槛，优先股持有人可能行使赎回权而非转换，给公司带来现金压力。尽调必须确认转换条款、赎回权，以及任何清算优先权是否影响公众股东经济性。

              EQT 二级交易（2025 年 4 月，KRW 4T）由成熟机构买方给出了近期市场出清价。EQT 据报在二级交易后考虑追加投资，也说明其在 KRW 4T 水平仍有信心。对 IPO 前二级入场而言，KRW 4T
              仍是基于证据的锚；高于 KRW 5T 时，投资者买入的是多头情景可选性，安全边际有限。
            claimRefs:
