  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面与业务单元
        blocks:
          - type: paragraph
            body: >-
              Musinsa Group 运营五个已公开确认的数字商业界面。旗舰 Musinsa Store 是韩国占主导地位的多品牌时尚 marketplace，2009 年上线，目前通过网页和移动 app 服务估计 700
              万月活用户，合作品牌超过 8,000 个——从首尔独立街头服饰品牌到全球运动服饰品牌都有——排序依据是实时购买行为，而不是编辑选择或广告投放。29CM 是定位高端时尚和生活方式的平台，围绕「guide to a
              better choice」策展式编辑体验展开，包括 29LIVE 互动商业活动；其估计月活约 300 万，用户结构偏女性和生活方式品类。Soldout（前身为 Solid
              Out）专注限量球鞋和时尚转售，配套技术支持的鉴定，并宣称提供 300% 假货赔付保证。Musinsa Global 覆盖 13
              个国际市场——包括美国、日本、新加坡和澳大利亚——采用仅邮箱注册（无需韩国身份证或手机号）、本币结算、透明关税 / 税费计算，并有独立于国内 app 的 iOS / Android 专用 app。Musinsa
              Empty 是数字衣橱和点对点转售界面，与带鉴定的 Soldout 渠道不同。自有品牌板块——Musinsa Standard（服装）以及一组美妆品牌（Musinsa Standard
              Beauty、Whizzy、Oddtype、No the Love）——同时覆盖线上和不断扩张的线下网络；截至 2026 年 4 月，国内门店超过 75 家，其中 2026 年 4 月 24 日开业、面积
              6,600 平方米的 Megastore Seongsu 旗舰店是韩国最大的单品牌线下零售空间。Musinsa Beauty 自有品牌 2025 年交易量同比增长 120%，美妆品类的实时 K-beauty
              排名专区和 Musinsa 独家线下限定品牌，显示公司有意挑战既有 H&B 零售商。国际上，进入中国市场 100 天内（2025 年 9–12 月），Musinsa 线上线下累计销售额突破 KRW
