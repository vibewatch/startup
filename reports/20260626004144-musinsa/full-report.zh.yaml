      - number: '2.4'
        title: 采用约束与竞争逆风
        blocks:
          - type: paragraph
            body: >-
              Musinsa 面临四类采用约束：横向平台竞争、宏观消费逆风、跨境进入者压力和监管负担。

              结构上最重要的约束来自 Naver 和 Coupang 竞争。Naver Shopping 处理的总电商 GMV 远高于 Musinsa，受益于搜索意图流量，并运营 Naver Shopping
              Live（约占韩国直播电商 GMV 45%），作为一体化时尚电商渠道。Coupang 的物流统治力和品类宽度形成最低公分母威胁：重视速度和价格的消费者，越来越会把商品化时尚单品默认交给 Coupang
              Rocket Delivery。2025 年韩国电商洗牌加速，Coupang 和 Naver 从中腰部玩家吸收份额，带来平台整合。Musinsa 以品牌深度和编辑策展区分自己，但这条护城河正在被争夺。

              在时尚垂直领域，Zigzag（Kakao Style）财务表现已有实质改善：2025 年销售额 ₩219.2 billion（较 2021 年 +236%），并转为营业盈利。Zigzag 的 Jikjin
              当日达服务直接竞争 Musinsa 的配送主张。W Concept（2025 年销售额 ₩119.5 billion）瞄准高端 / 当代时尚，但在投资压力下 2025 年转为营业亏损，提示整合风险。

              中国跨境平台——Shein、Temu 和 AliExpress——构成新兴价格竞争约束。这些平台在基础款和快时尚层以超低价竞争，而 Musinsa 自有品牌 Musinsa Standard
              也处在该层级。Musinsa 的品牌质量和编辑策展在精选层能形成差异化，但大众市场的价格天花板正在被压低。

              2026 年韩国宏观消费逆风包括工资增长疲弱、家庭债务高企，以及消费者价格敏感度上升，推动韩国购物者转向价值驱动型购买。Samsung Fashion Research Institute 的 2026
              年展望将整体市场增长描述为「温和」，可选消费承压。韩国修订后的《电子商务法》（2026 年 1 月 20 日公布；2027 年 1 月 21 日合规截止）对平台施加新义务：在韩收入 ≥₩1 trillion
              或月活韩国用户 ≥1 million 的外国玩家必须任命本地代表；强化消费者评论规则会提高所有运营商合规成本；数据保护违规则可能触发最高达年营业额 10% 的 PIPA 罚款。
