  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、收入流与定价
        blocks:
          - type: paragraph
            body: >
              Musinsa 运营三支柱收入模型，这使其不同于纯 marketplace：（1）核心 Musinsa 平台和面向女性的 29CM marketplace 产生佣金收入，品牌按产品品类支付 15–30%
              佣金；（2）Musinsa Standard 自有品牌通过 34+ 家线下店和线上渠道直接面向消费者销售，产生产品收入；（3）Musinsa
              买入库存后转售精选品牌，产生商品（MD）收入。第四类附加收入——广告、履约和数据服务——嵌入佣金中，公开申报没有单独拆出。


              2025 年，三支柱贡献如下：佣金 KRW 568.9B（收入 38.8%）、产品 / Standard KRW 451.8B（30.8%）、商品 KRW
              400.7B（27.3%）。佣金是利润率引擎，因为平台对合作品牌销售不承担库存风险，增量利润率最高。产品收入包括 Musinsa Standard 线下零售（2024 年底 29 家店，正向 40+
              增长）以及线上自有品牌渠道，相比佣金会稀释毛利率，但受益于品牌控制和定价权。商品收入承担完整库存风险，是最低利润率板块，但也是战略杠杆，用来引入那些要求平台先承诺库存、才愿意上架的主要品牌。


              转售渠道 Musinsa Used（前身为 Solid Out）自 2026 年 1 月 23 日起采用统一 15% 寄售佣金模型，取代分层结构。这一简化提升了 KRW 120B+ 转售 GMV
              线条的利润率可预测性。2025 年 H1，国际出口 GMV 仅占总交易额 0.57%，确认全球收入仍处萌芽阶段，近期模型压倒性依赖韩国国内。


              确认口径：直接产品和商品收入在交易完成时确认；佣金收入按扣除向合作品牌提供的任何促销补贴后的净额确认。Musinsa 未披露广告和物流收入的独立拆分，这对没有 data room
              访问权限、却要构建完整单位经济模型的人来说是一个缺口。
