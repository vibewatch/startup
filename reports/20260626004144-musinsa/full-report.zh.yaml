      - number: '7.4'
        title: 财务、IPO 执行与资本结构风险
        blocks:
          - type: paragraph
            body: >-
              IPO 估值争议。Musinsa 目标是以 KRW 10T（约 $7.4B）估值登陆 KOSPI。按 2025 年净利润计算，这意味着 143x PER——约为行业均值的 10x。2025
              年中，Securities Plus 二级市场交易对 Musinsa 的估值约 KRW 3.4T，不到目标的 35%。Mirae Asset Securities 于 2025 年 11
              月退出承销流程，并明确称估值「过高」。行业对比不利：Musinsa 隐含 EV / Sales 约 7-8x，对比 Coupang 在 NYSE IPO 时的 3.5x，而 Coupang
              后续股价也跌破发行价。Financial News 2026 年 2 月指出，Musinsa 正「探索包括 NASDAQ 在内的多种上市选项」，说明 2026 年 KOSPI 时间表并不确定。IPO
              失败或大幅折价，将剥夺 Musinsa 到 2030 年建设中国 100 家门店所需资本，并可能对现有 RCPS 持有人造成二级市场压力。

              RCPS 结构性债务风险。2025 年，Musinsa 按 K-IFRS 将约 KRW 736B
              可赎回可转换优先股（RCPS）重分类为债务。该重分类不改变现金义务，但制造了会计层面的约束：融资成本现在几乎等同于经营利润，压低报表净利润；如果 IPO 超过约定时间，RCPS
              协议中的类似债务契约保护可能被触发。若 IPO 未在约定时间内完成并触发投资者赎回权，Musinsa 可能不得不以不利条款再融资。2026 年 Q1 季报确认，公司收入 KRW
              363.6B（+24.1%）、经营利润 KRW 19.0B（+8.2% YoY），增长动能仍在，但 RCPS 融资费用在净利润层面吸收了相当大一部分利润。

              营运资本与利润率压力。Musinsa 转向直接商品采购（2025 年 KRW 400.7B）和线下零售扩张，带来纯 marketplace
              模式中不存在的库存持有风险。库存增长叠加线下扩张，会放大营运资本需求。佣金 take rate（15–30%）可能受到 Online Platform Act 和品牌多渠道策略的下行压力。2023 年经营亏损
              KRW 8.6B 的驱动因素之一是营销成本；如果竞争强度要求更重促销，营销费用可能重新扩张。
