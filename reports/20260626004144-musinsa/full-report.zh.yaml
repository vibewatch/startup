      - number: '7.2'
        title: 监管、法律与合规风险
        blocks:
          - type: paragraph
            body: >-
              Korea Fair Trade Commission（KFTC）。2026 年 4 月，KFTC 对 Musinsa 进行现场检查，原因是怀疑其违反 Act on Fair Transactions in
              Large Retail Businesses；同一次行动也包括 Lotte Hi-Mart。这已经超出此前警告级别的动作：KFTC 曾在 2026 年 1 月确认 Musinsa
              入驻品牌广告中的羽绒含量和羊绒含量存在错标后，下达纠正令和警告——17 家服装公司被制裁，KFTC 还表示将与时尚平台建立常态化渠道以防复发。2025 年，KFTC 也曾就合成皮革的误导性环保声明警告
              Musinsa Standard 和三个 SPA 品牌（Topten、Spao、Zara）。这些行动仍属警告级别，但 2026 年 4
              月现场检查表明，监管姿态已从事后纠正转向主动探查平台商业行为。若调查产生命令或罚款，可能在 IPO 前引发卖家关系扰动和声誉损害。

              Online Platform Act。韩国 National Assembly 已审议 Online Platform Act 五年；截至 2026
              年中，经过小组委员会审查后，执政党与反对党的谈判仍在进行。若法案通过，Musinsa
              作为主导垂直平台，将被指定为受监管企业，接受佣金率透明度要求、结算时点规定，以及禁止对卖家采取不公平合同做法的约束。这会限制定价灵活性，并可能削弱 Musinsa 把优先展示位作为变现杠杆的能力。

              Personal Information Protection Act（PIPA）修订案。2025 年通过、2026 年末生效的修订案，将针对影响 10M+ 数据主体的重复或故意违规，最高行政罚款从年收入 3%
              提高到 10%；泄露定义扩展至伪造和篡改，并要求在「存在泄露可能」阶段即提前通知，而不是等事件确认。Musinsa 的 16M+
              会员基础，加上广泛的行为、支付和购买历史数据集，会让它成为高能见度执法目标。达到规模门槛的企业还必须落实 CEO 级问责，并由董事会批准 CPO 任命。2025 年 11 月 Coupang 数据泄露——影响
              33.7M 用户——展示了韩国电商平台单一事件可能引发的诉讼和监管敞口。

              商标与 IP。2026 年 6 月，BusinessKorea 报道越南 Nha Trang 一家门店以「MOOSINSA」运营，这是 Musinsa 商标的细微变体，同时还有一家「29M」门店模仿
              29CM。Musinsa 促成了招牌更换，但原名称仍留在 Google Maps 和社交媒体上，说明在 Musinsa
              缺乏本地法人布局的市场中仍有品牌可信度残余风险。随着中国和日本扩张推进，而公司尚未在所有产品和服务类别完成正式商标备案，该风险会扩大。2022 年 Musinsa Boutique 上 Fear of God
              Essentials 假货事件——Musinsa 售出后由 Naver 的 Kream 平台鉴定为假——建立了声誉先例，并在 2026 年标签欺诈事件中重演，说明这不是孤立失败，而是一个模式。
