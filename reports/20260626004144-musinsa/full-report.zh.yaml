        - 任何可执行的佣金做法限制，或超过 KRW 10B 的罚款
        - 在抽成率受限情境下重建佣金收入模型；评估品牌伙伴流失风险
      - - 收入增长放缓
        - 季度同比增速
        - 2026 年连续两个季度收入同比增速低于 15%
        - 重新检验 KRW 1.47T 的 2025 年基线增长假设；用固定线下成本底座压力测试利润率
      - - 数据泄露 / PIPA 执法
        - PIPC 调查或泄露通知影响 100 万+用户
        - 任何重大泄露导致 PIPC 执法行动或集体诉讼提交
        - 估算 10% 营收罚款敞口（KRW 146.7B+）；评估品牌信任和 IPO 时间影响
      - - Cho Man-ho 离任
        - 宣布离任、披露健康问题，或失去 IPO 领导角色
        - IPO 前任何 CEO 交接或正式休假
        - 评估承销商信心；要求董事会响应计划；评估 co-CEO 准备度
      - - 中国 JV 表现不及预期
        - 中国月度 GMV 轨迹和开店节奏，对比 2030 年 100 店目标
        - 中国 GMV 环比增长低于 50%，或 2026 年 H2 新开门店少于 5 家
        - 质疑中国作为近期估值驱动的有效性；重新评估 JV 结构和 Anta 一致性
    notes: 触发项设计为可通过公开披露、DART 申报和媒体报道监测。没有数据室访问时，并非所有触发项都能独立核验；KFTC 结果和 RCPS 时间线是优先级最高的确认性尽调事项。
