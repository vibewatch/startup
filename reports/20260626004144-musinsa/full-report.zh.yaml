      - number: '3.2'
        title: 既有巨头与相邻平台竞争者
        blocks:
          - type: paragraph
            body: >
              在专业时尚之外，Musinsa 还面临韩国主导型综合电商平台的渠道竞争。Coupang 控制韩国整体电商市场 22.7%，并积极招募 MARITHÉ GIRBAUD 和 Mardi Mercredi
              等时尚品牌，把自己定位为拥有快速配送和无摩擦退货的高容量「销售渠道」。2025 年 11 月，一起暴露 33.7 million 客户记录——几乎覆盖 Coupang
              全部用户——的数据泄露，触发「Talpang」（退出 Coupang）运动，并导致 2026 年 Q1 出现 $242M 营业亏损，给 Naver 缩小市场份额差距至 20.7% 留出窗口。Naver
              Shopping 通过 Smart Store、直播电商基础设施和红人生态，为 K-fashion 品牌提供强大的「营销渠道」；2026 年招募品牌包括 Matin Kim 和 Pottery。SSG.com 以
              3% 市场份额，借助 Shinsegae 的高端百货基础设施和 Emart 物流，服务与 Musinsa 29CM 和 W Concept 板块部分重叠的近奢消费人群。Samsung C&T Fashion
              Group 的 SSF Shop 同时销售自有品牌（KUHO、BEANPOLE、8SECONDS）和高端进口品牌（Lemaire、AMI
              Paris、Ganni、Jacquemus），并有很强的线上到线下一体化。Handsome（Hyundai Dept. Store Group）在 2026 年 Q1 结束连续 10 个季度销售下滑，运营 41
              个品牌、1,323 个销售点，集中于高端线下主导分销，对 Musinsa 数字原生模式的直接竞争较弱。
