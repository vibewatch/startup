      - number: '4.3'
        title: 成本结构、毛利率与营运资本
        blocks:
          - type: paragraph
            body: >
              Musinsa 成本结构主要由商品和直接产品板块的销货成本，以及佣金板块的人力和营销成本构成。平台没有披露合并毛利率；不过，使用 DART 半年度申报数据估算，商品 / 直接产品合计毛利率约
              35–45%，而佣金收入按净费计接近 100% 毛利率。混合营业利润率从 2024 年 8.3% 提升至 2025 年 9.6%，确认随着高利润率佣金板块增速快于商品板块，经营杠杆转正。


              营运资本是重要监控项。库存从 2024 年底 KRW 330B 升至 2025 年 H1 约 KRW 425B，库存周转率从 1.7x 降至 1.4x——这一恶化导致 2025 年 H1 经营现金流转负（KRW
              –71.9B），而 2024 年 H1 为正 KRW +173.6B。这一摆动是近期最大的单一运营风险信号，因为它暗示商品板块需求偏软，或公司有意为 H2 旺季提前备货。公司尚未公开回应这一反转，data
              room 尽调应专门核查。


              Musinsa 投入品牌认知和国际扩张，营销成本仍然较高。履约部分外包；Musinsa 为 Musinsa Standard 运营物流网络，但 marketplace 订单使用第三方承运商。Capex
              相对收入适中（估计约为收入 4–6%），由 Musinsa Standard 线下门店扩张和技术基础设施驱动。P-CBO 债券项目（约 KRW 100B 未偿）和 34+
              家线下门店租赁负债形成固定费用，如果收入下滑，会限制下行灵活性。


              子公司拖累是复合成本因素：截至 2025 年 Q1，16 家子公司中 13 家亏损。最大拖累来自 Solid Out（SLDT），其截至 2024 年 Q1 累计亏损约 USD 79M，而年收入仅 USD
              12.5M；Musinsa Japan 2024 年录得营业亏损；29CM 承担收购后的历史投资成本。这些子公司亏损并入集团结果，压低集团 ROE。
