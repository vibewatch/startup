  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接专业平台同业
        blocks:
          - type: paragraph
            body: >
              2026 年，韩国专业时尚平台市场由五个直接同业主导，它们与 Musinsa 相邻运营或正面竞争。Ably Corporation 是按 GMV 看最接近的挑战者（2025 年 ₩2.8T，同比
              +12%），2025 年底月活用户 3.4 million，并获得 Alibaba 以 $2.1B 估值投入的 $71.4 million 支持。Ably 通过 AI 驱动个性化瞄准 Gen Z
              和千禧一代女性，并借「Amood」应用扩张到日本，累计下载 6.5 million。KakaoStyle 运营 Zigzag，这是一个女性时尚聚合器，2025 年 GMV 跨过 ₩2T，并录得 ₩5.8B
              营业利润——连续第二年盈利——借助 Kakao 超级应用生态和超个性化 AI。Shinsegae/SSG.com 旗下 W Concept 瞄准 20–40 岁女性，主打精选设计师品牌，但 2025 年录得
              ₩3.1B 营业亏损，MAU 也落后于 29CM：1.15M vs. 29CM 的 1.76M。Brandi 是一家 Series C 批发聚合器，聚焦年轻女性快时尚，披露融资
              $56.6M，并在东大门市场拥有供应链深度。Naver 子公司 KREAM 运营带鉴定背书的限量转售 marketplace，覆盖球鞋和奢侈品，20 多岁用户占 35.7%，直接竞争 Musinsa 的
              Soldout 平台。Musinsa 还拥有 29CM，这是一家高端女性生活方式平台，2025 年 10 月 GMV 连续第二年超过 ₩1T，自 2021 年被收购以来年增长 40%。
