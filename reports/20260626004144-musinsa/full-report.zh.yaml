      - number: '7.6'
        title: 缓释措施、否决标准与尽调问题
        blocks:
          - type: paragraph
            body: >-
              已落地的缓释措施包括：（1）2026 年 Q1 上线 AI 在线商品巡检系统，覆盖 Musinsa 与 29CM 的 1.2M
              个商品，用于识别标签欺诈和相似度违规；（2）对换标采取零容忍，永久封禁平台账号并提起法律行动；（3）IPO 承销团队由 Citigroup、JP Morgan、Korea Investment &
              Securities 与 KB Securities 组成，强制委任银行阵容较强，即使公司想把价格打高，也会受到约束；（4）RCPS 重分类已经反映在 2025
              年资产负债表里，会计扭曲已对未来公开市场投资者可见；（5）Musinsa Standard 品牌力较强，在韩国 19–29 岁消费者中排名第一，可部分对冲超快时尚替代。

              缺口和剩余敞口集中在五处：（1）KFTC 2026 年 4 月调查结果仍未落定，可能带来可执行的整改令、罚款，或面向卖家的行为限制；（2）RCPS 投资者赎回权时间表未公开，一旦 IPO
              滑过约定触发日期，强制再融资风险仍不确定；（3）Anta JV 控制结构未公开，Musinsa 对中国业务保留多少战略控制权，是重大尽调缺口；（4）PIPA 合规认证状态不透明，Musinsa 未公开
              ISMS-P 状态，也未披露任何既往 PIPC 通知；修订后 PIPA 执法门槛明确后，这些披露会变成强制要求；（5）品牌伙伴集中度数据缺失，前十大品牌 GMV 未公开，无法独立评估伙伴集中风险。

              打破投资逻辑的触发点包括：若 KOSPI 上市估值低于 KRW 5T，说明市场不接受平台溢价逻辑，也会重置投资者回报预期。若 KFTC 作出限制佣金做法的不利执法令，核心收入引擎会受到结构性削弱。Cho
              Man-ho 若在 IPO 前离任，承销商很可能重新评估。2026 年 Q2/Q3 收入增速若显著放缓（YoY 低于 15%），会让市场质疑 2025 年加速是否可持续。若发生影响会员的重大数据泄露，将触发
              PIPA 执法、类似 Coupang 的集体诉讼环境，并在上市窗口前损害品牌信任。
