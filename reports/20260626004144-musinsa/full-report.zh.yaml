      - number: '7.7'
        title: 附录
        blocks:
          - type: callout
            title: KFTC 现行调查是近期最高法律风险
            body: >-
              Korea Fair Trade Commission 于 2026 年 4 月就大型流通违规对 Musinsa
              开展现场检查，已经从此前警告级别行动升级；截至报告日，事件仍未解决。若结果不利——正式整改令或罚款——可能限制佣金做法、要求卖家补救，或在 IPO 敏感窗口正中制造声誉损害。公司此前 KFTC
              记录（2025–2026 年围绕环保标签、填充物广告和流通做法的三起独立行动）显示，监管对 Musinsa 的姿态更偏主动，而不是被动观察。
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR009
          - type: callout
            title: RCPS 重分类在 IPO 前制造结构性财务风险
            body: >-
              2025 年，KRW 736B RCPS 按 K-IFRS 重分类为债务，意味着 Musinsa 的融资成本几乎等同于经营利润。短期看这不是现金流受损，但若 IPO 未能在未公开的时间门槛内完成，RCPS
              投资者赎回权可能迫使 Musinsa 以不利条件再融资，或接受低于目标的估值来满足赎回窗口。Mirae Asset 退出和 NASDAQ 探索都说明 IPO 时间表并未锁定。
            calloutType: risk
