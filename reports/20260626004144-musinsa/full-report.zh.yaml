      - number: '4.2'
        title: GMV、收入与利润轨迹
        blocks:
          - type: paragraph
            body: >
              Musinsa 公开财务轨迹出现明显拐点：收入从 2022 年 KRW 708.5B 增至 2023 年 KRW 993.1B（+40.2%），再到 2024 年 KRW 1,242.7B（+25.1%）和
              2025 年 KRW 1,467.8B（+18.1%）。营业利润从 2022 年 KRW 11.3B，转为 2023 年 KRW 8.6B 亏损（投资年），随后恢复至 2024 年 KRW 102.8B（8.3%
              利润率）和 2025 年 KRW 140.5B（9.6% 利润率）。这条轨迹确认 2024 年是第一个完整盈利年度，且 2025 年在持续投资下利润率继续扩大。


              2024 年 GMV 达到 KRW 4.5T（约 $3.3B），意味着整体 GMV / 收入比约 3.6x，混合 marketplace 抽佣率在佣金 + 商品部分约
              27.6%（抽佣率计算排除直接产品销售）。2025 年 H1 GMV 为 KRW 2.3T，意味着 2025 全年运行率约 KRW 4.8–5.0T。


              2026 年 Q1 业绩（2026-05-27 向 DART 申报）显示，合并收入 KRW 363.6B（同比 +24.1%），营业利润 KRW 19.0B（同比 +8.2%）。2026 年 Q1
              营业利润增速落后于收入增速，反映第一季度季节性营运资本投放和更高营销支出。


              EBITDA 从 2024 年 KRW 195.1B 升至 2025 年 KRW 248B，比净利润更能干净反映现金生成；净利润被 RCPS 重新分类扭曲。2025 全年净利润仅 KRW 7.7B，而营业利润为
              KRW 140.5B，原因完全在于重新分类 RCPS 工具产生约 KRW 80B 非现金融资费用。该会计变化（按 K-IFRS 将优先股重新分类为金融负债）发生在 2025 年 H1，并不代表真实运营恶化。
