      - number: '8.4'
        title: 多头、基准与空头情景框架
        blocks:
          - type: paragraph
            body: >
              下列三个情景由两个核心变量驱动：（1）2027–2028 年收入轨迹；（2）IPO 退出时的 EV/经营利润倍数。所有情景都假设 RCPS 在 IPO 时转为普通股，消除非现金利息扭曲。情景也假设上市地点为
              KOSPI；若转向 NASDAQ，由于美国投资者对 K-fashion 熟悉度有限且披露成本更高，折价很可能更大。

              多头情景（KRW 8–10T，~$6.1–7.7B）：到 FY2027，收入达到 KRW 2.0T，驱动因素包括 Musinsa Standard 全球门店扩张、Anta JV 扩至超过 10
              家上海门店、日本常设门店跑出正 EBITDA，以及国际 GMV 超过总交易额 5%。经营利润率借 MFS 平台杠杆和品牌获取成本下降扩至 12–14%。采用 55–65× EV/经营利润（因结构性增长，相对
              ZOZO 21× PE 享受溢价），隐含 EV 为 KRW 8–10T。概率触发条件：IPO 超额认购，国际 GMV KPI 到 2027 年 H1 仍按计划推进，KFTC 案件无结构性补救措施结案。

              基准情景（KRW 4.5–6T，~$3.4–4.6B）：收入每年增长 15–20%，到 FY2027 达 KRW 1.7–1.8T。经营利润率维持 9–10%。国际业务有意义但仍温和（GMV 占比 <3%）。采用
              32–42× EV/经营利润（因更高增长，相对 Zalando 60× PE 中度折价，但受韩国市场重估历史约束）。隐含 EV 为 KRW 4.5–6T。下行情形触发：China Anta JV
              表现不及预期，KFTC 要求运营调整，国内 GMV 增速降至 10% 以下。EQT 的 KRW 4T 二级价格锚定该区间底部。

              空头情景（KRW 2.5–3.5T，~$1.9–2.7B）：受 Coupang/Naver 招募品牌、中国价格竞争以及 KFTC 对排他性的限制影响，收入增速大幅放缓至 YoY <10%。经营利润率压缩至
              6–7%。RCPS 转换条款带来摊薄。倍数塌缩至 15–25× EV/经营利润（Coupang IPO 后重估轨迹）。隐含 EV 接近或低于 OTC 市场暗示的 KRW 3.4T。触发条件包括：IPO
              降轮定价、KFTC 作出带结构性补救的裁决，或全球市场倍数压缩。
