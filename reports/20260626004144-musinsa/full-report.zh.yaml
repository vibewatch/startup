      - number: '6.4'
        title: 留存、重复使用与满意度缺口
        blocks:
          - type: paragraph
            body: >
              留存可见度是本章最重要的尽调缺口。Musinsa 没有公开披露 NPS、GRR、NRR 或正式 cohort 留存曲线。可用代理指标包括：（a）截至 2026 年 2 月，平台整体复购率为 29.3%（Seoul
              Economic Daily），低于生鲜和美妆电商同业——Olive Young 为 36.3%，Kurly 为 71.7%——但符合时尚品类低频、高客单驱动的常态；（b）29CM 自报 2026 年 Q1
              时尚品类复购率超过 90%，反映的是更深度参与的策展生活方式购物人群，而不是广义 marketplace。


              Moloco Ads 互动案例研究提供了一个可量化、接近留存的代理指标：分层 AI 重新互动 campaign 面向 active 用户时，CPS 效率分别比 DSP Media A 和 B 高 10% 和
              22%，视频素材 CPS 比图片素材高 2.5x，归因用户 ARPPU 高 66%。这些指标确认 Musinsa 主动投资于挽回流失互动，并把重新激活用户转化为付费客户，但不能替代正式的 cohort 留存数据。


              消费者满意度信号混杂。截至 2026 年，JustUseApp 汇总的 265 条 App Store 评论显示，Musinsa 全球 app 平均评分
              3.4/5，负面情绪集中在物流延迟和客服响应。PissedConsumer 汇总的三条经验证评论给出 2.2/5 评分，重复抱怨包括包裹丢失、客服复制粘贴式回复以及退货 / 退款摩擦。韩国国内受众（核心 Gen
              Z）满意度更高——品牌购买意向调查和 MAU 增长可以佐证——但国内分部没有公开系统性 CSAT 或 NPS 数据。
