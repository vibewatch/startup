chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与运营模式
        blocks:
          - type: paragraph
            body: >
              Musinsa Co., Ltd. 是韩国最大的线上时尚 marketplace，也是 10,000 多个韩国时尚品牌触达国内外消费者的主入口，品牌覆盖街头服饰、当代风格、极简和设计师品类。公司由 Cho
              Man-ho 2001 年在首尔创立，最初是球鞋爱好者线上社区，全名「Mujinjang Sinbal Sajin-i Maneun Got」可粗略译作「球鞋照片很多的地方」；缩写 Musinsa
              后来成为品牌。Musinsa.com 2003 年上线，最初是报道首尔街头时尚的编辑杂志；电商店铺 2009 年开张，创立原则只有一条：只卖正品，只卖别处买不到的品牌。公司 2012 年完成法人化。


              公司注册总部位于韩国首尔江南区。截至 2026 年中，Musinsa 以控股实体运营，合并主 Musinsa 时尚平台、面向女性和生活方式的 29CM 品牌、Solid Out 球鞋转售渠道、自有品牌
              Musinsa Standard 连锁，以及服务美国、日本、新加坡、澳大利亚等 13 个地区的 Musinsa Global Store。业务模型是混合型：合作品牌销售佣金（占 2025 年总收入
              38.8%）、直接产品和 Musinsa Standard 销售（30.8%），以及履约、广告和附加服务（30.4%）。这套三边经济结构让 Musinsa 不同于纯
              marketplace，并在规模扩大后托住更持久的利润率。公司处于后期私有阶段，是公认独角兽，并已启动 IPO 流程，主要上市目标为 KOSPI。
