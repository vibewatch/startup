      - number: '8.6'
        title: 最终尽调问题与打破投资逻辑的触发点
        blocks:
          - type: paragraph
            body: >
              几个缺口限制了更高置信度的建议。最关键的是 RCPS 转换和赎回时间表：若不了解 KRW 736B RCPS 批次的准确转换价格、赎回触发条件和到期日，就无法准确建模公开市场投资者的经济性。这是阻断性尽调事项。

              第二个缺口是国际收入质量。2026 年 Q1 出口增长 11.9× 听起来很亮眼，但基数极小（2025 年 Q1 收入占比 0.44%，现在为 4.2%）。按地区拆分的月度
              GMV——日本、中国、东南亚、北美——并未公开。缺少这些数据，就无法把 China Anta JV 贡献与全球店自然牵引区分开，也无法判断国际化动能是否可持续。

              第三，KFTC 调查结果未落定。正在审查的具体排他条款尚未公开。若出现结构性补救——例如强制 Musinsa 允许品牌同时上架竞争平台——供给侧锁定会被明显削弱，估值也需要下修。

              第四，Soldout（SLDT）和 29CM 盈利时间表不清。仅 2022–2023 年，Soldout 累计经营亏损就超过 KRW 66B，收入（~KRW 16.7B）仍远小于 Naver 支持的
              KREAM（~KRW 157B）。扭亏路径不明。29CM 的 GMV 已越过 KRW 1T，但其对集团 EBIT 的单体贡献未公开。

              第五，管理层纵深和关键人风险：联席 CEO 架构为 IPO 准备引入 Jo Nam-sung，但创始人 Cho Man-ho 已减少运营参与。C-suite 以下的制度化能力有多强，需要核验。
