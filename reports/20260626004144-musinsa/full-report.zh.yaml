      - number: '7.5'
        title: 运营、合作伙伴依赖与全球执行风险
        blocks:
          - type: paragraph
            body: >-
              物流与履约依赖。Musinsa 不运营自有末端配送网络，国内发货依赖包括 CJ Logistics 在内的第三方物流商。公司位于 Yeoju 中心的 Musinsa Fulfillment
              Service（MFS）正在导入法国 SkyPod 自动化系统，以提升拣货效率，但该设施是单节点集中。一旦 Yeoju 因劳资纠纷、火灾或系统故障中断，Musinsa
              的当日达和次日达订单履约会受损，而平台部分竞争力正来自配送可靠性。Musinsa Logistics 2024 年净亏损 KRW 4.7B（较 2023 年 KRW 9B
              亏损改善），说明物流子公司仍拖累集团经济性。

              中国执行与 Anta JV 风险。Musinsa 中国战略采用与 Anta
              Sports（中国最大运动服饰集团）成立合资公司的结构。该模式把战略控制集中到本地伙伴手中，而后者在品牌定位、定价或扩张节奏上的利益可能与 Musinsa 自身目标不一致。公司在上海启动 100 天内实现 KRW
              10B+ GMV，但到 2030 年开 100 家门店的目标要求在中国新增 95+ 家门店，每一家都需要地产、人员和本地化策展；而 Musinsa 直到 2025 年末才进入该市场。K-fashion
              在中国的文化顺风是真实优势，但也受地缘政治风险影响：正如 2017 年 THAAD 部署对韩国消费品品牌的冲击所示，韩中关系可能迅速恶化。Musinsa CEO Cho Man-ho 被纳入 Lee 总统
              2026 年 1 月访华代表团，既凸显机会，也凸显地缘政治依赖。

              品牌合作伙伴集中。Musinsa 的平台价值取决于能否留住 10,000+ 合作品牌目录。按 GMV 排名的头部品牌未公开披露，但 Naver 和 Coupang
              作为时尚渠道快速增长，意味着表现最好的品牌可以在不受惩罚的情况下减少对 Musinsa 的独家依赖。如果 GMV 最高的五个或十个品牌大幅分流到竞争平台，佣金收入会受到不成比例影响。导致 MARZIN
              离开的换标丑闻显示，即便单一品牌争议，如果处理不果断，也会制造平台级信任风险。

              关键人物风险：Cho Man-ho。Cho Man-ho 仍是唯一创始人、品牌最主要的外部代表、IPO 进程设计者，也是带领中国和日本这种关系密集型全球扩张的高管。2025 年 12 月共同 CEO
              重组（加入负责内部职能的 Cho Nam-sung）以及 CFO / CLO 等 C-suite 补强，是 IPO 就绪动作，但没有解决创始人中心化：Cho Man-ho 离开会直接影响投资者信心、品牌伙伴关系和
              IPO 时间表。公司没有公开披露接班计划。BoF 500 Class of 2025 荣誉属于 Cho 个人，不代表机构能力。
