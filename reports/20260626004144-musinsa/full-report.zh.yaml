  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Musinsa 的主市场是韩国线上时尚与街头服饰电商生态——本报告将其定义为面向韩国国内消费者的服装、鞋履、配饰和相邻生活方式商品（美妆、运动、家居）的数字零售，并带有服务全球 K-fashion
              需求的次级跨境维度。该定义排除：奢侈品百货渠道（Hyundai、Shinsegae、Lotte）、线下大众服装零售（如 Uniqlo Korea、H&M Korea）、纯二手 / 转售 C2C
              平台（당근마켓、Bunjang），以及把韩国品牌直接连接给海外分销商的批发或 B2B 环节。Musinsa 的若干垂直业务触及这些相邻市场——SoldOut 处理球鞋转售，29CM
              覆盖生活方式设计商品——但核心投资论点仍围绕精选时尚 marketplace 业务。

              街头服饰和当代男装是 Musinsa 的创始领域，按 GMV 看仍是最大单一品类，尽管平台在 2022–2026 年已扩张到女装、美妆、运动和童装。相关买家是 18–35 岁韩国消费者，他们把 Musinsa
              当作发现并购买韩国独立品牌的平台；这些品牌缺少自己的全国分销基础设施，依赖 Musinsa 的编辑内容、物流网络和会员社区来生成需求。

              具有实质重叠的相邻市场包括：（1）社交和直播电商（Naver Shopping Live、Kakao Style），时尚是其中领先品类；（2）服务日本、中国、东南亚和北美全球 K-fashion
              需求的韩国时尚出口 / 跨境平台；（3）美妆电商，Musinsa 2026 年线下门店战略（Mega Store Seongsu）有意模糊时尚和美妆零售边界。这些相邻市场扩大了可服务机会，也把新的竞争者带入
              Musinsa 所在赛道。
