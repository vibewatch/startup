      - number: '8.7'
        title: 附录
        blocks:
          - type: callout
            title: Mirae Asset 退出是异常强烈的负面信号
            body: >-
              入围短名单的韩国本土大型承销商拒绝参加最终 IPO 陈述，这种情况并不常见。Mirae Asset Securities 是韩国最大的 IB 机构之一，却在 2025 年 11 月退出 Musinsa IPO
              陈述，具体原因是管理层判断 KRW 10T 目标过高。这是一个熟悉 KOSPI IPO 市场的成熟机构参与者释放的直接负面信号。投资者应给予较高权重。
            calloutType: risk
            claimRefs:
              - CV008
              - CV015
              - CV037
          - type: callout
            title: 9.6% 经营利润率在这一规模的时尚 marketplace 中属同类最佳
            body: >-
              在全球时尚 marketplace 可比公司中，基于 KRW 1.47T 收入取得 9.6% 经营利润率异常强劲。Zalando 调整后 EBIT 利润率低于 2%；Farfetch
              退市前仍在亏损。Musinsa 的三支柱模式（佣金 + 自有品牌 + 商品销售）能跑出高于行业的利润率，因为佣金线几乎没有增量成本。若国际化规模带来收入增长而成本不同比例上升，利润率确实有扩张空间。
            calloutType: strength
            claimRefs:
              - CV017
              - CV027
              - CV028
          - type: callout
            title: 估值方法采用 EV/经营利润，以避开 RCPS 扭曲
            body: >-
              RCPS 重分类会产生非现金利息费用，即便经营利润健康，单体层面也会出现净亏损，因此净利润倍数（PER）对 Musinsa 具有误导性。本章所有情景估值都以 EV/经营利润为主要倍数，并用
              EV/收入与同业交叉校验。分析师和媒体引用 143× PER 在数字上没有错，但应注明其中包含 RCPS 会计扭曲。
            calloutType: assumption
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV015
