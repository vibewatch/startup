      - - 正论点
        - 经营杠杆已验证：收入加速增长时，利润率从 1.6%（2022 年）扩大至 9.6%（2025 年）
        - 2025 年营业利润 KRW 140.5B（DART）
        - IPO 后连续两个季度经营利润率压缩至 6% 以下
      - - 正论点
        - 自有品牌（Musinsa Standard）2025 年增长 33%，并在全球扩张（上海、东京）
        - Standard GMV KRW 471B（Seoulz/Korea Herald 报道）
        - 中国 / 日本运营满 2 年+后，Global Standard 单位经济性仍为负
      - - 正论点
        - IPO 催化：承销商（Citi、JPMorgan、KIS、KB Securities）已敲定；KOSPI 申报临近
        - Infomax AI 2025 年 12 月；Korea Herald
        - IPO 延期 >12 个月，或定价较 KRW 10T 目标低 >50%，释放市场拒绝信号
      - - 反论点
        - KRW 10T IPO 对应 PER 143×，比韩国互联网板块常态（15–25×）高 6–10×
        - 数据来源：Economy.ac；TopDaily KR
        - 通过国际化放量，净利润 2 年内增长 5×
      - - 反论点
        - 国际 GMV 仍仅占总量 0.57%；整个增长叙事都是面向未来的期权
        - DART 2025 年 H1；Digital Today 2026 年 Q1
        - 4 个季度内国际 GMV 超过总交易额 5%
      - - 反论点
        - 约 KRW 736B RCPS 重分类为债务；负债率约 620%；非现金费用掩盖真实净利润
        - DART 2026 年申报；Economy.ac
        - IPO 时 RCPS 顺利转为股权，且没有稀释性赎回
      - - 反论点
        - KFTC 反垄断调查（2024–2026+）可能从结构上改变供给侧护城河
        - Seoulz.com；Biz Chosun 竞品报道
        - KFTC 到 2026 年 H2 结案，且无结构性整改
