    rows:
      - - 线上街头服饰与当代时尚（核心）
        - 通过精选时尚平台，面向 18–35 岁韩国消费者销售服装、鞋履、配饰
        - 线下百货和快时尚零售、B2B 批发
        - Musinsa、Zigzag、29CM 上的韩国消费者
        - 核心——Musinsa 的创立和主导细分；~10,000 个合作品牌
      - - 线上女装（大众市场）
        - 通过女性导向平台（Ably、Zigzag、StyleShare）进行数字零售
        - 奢侈品百货、品牌直营 D2C
        - 20–39 岁女性，Zigzag（Kakao Style）、Ably
        - 邻近——Musinsa 通过 Musinsa Women 和 29CM 垂直业务竞争
      - - 美妆电商
        - 通过时尚邻近渠道在线销售护肤、彩妆、美妆工具
        - 独立美妆零售商（Olive Young）、药房渠道
        - 通过 Musinsa Beauty、29CM、Kakao Beauty 触达韩国消费者
        - 扩张中——Musinsa Beauty GMV 2026 年 Q1 +120%；Mega Store Seongsu
      - - 球鞋转售 / 认证二级市场
        - 点对点和认证球鞋 / 街头服饰转售
        - 大众二手（당근마켓）
        - 通过 SoldOut（Musinsa 转售垂直）触达街头服饰收藏者
        - 内部业务——SoldOut 是 Musinsa 专门的转售垂直业务
      - - 直播与社交电商（时尚子集）
        - 通过 Naver Shopping Live、Kakao Live、GRIP 实时视频驱动时尚购买
        - 非时尚直播电商（食品、家居）
        - Naver（45% GMV 份额）、Kakao（25% GMV 份额）
        - 部分相关——Musinsa 运营自有直播电商；作为渠道替代与 Naver 竞争
      - - 跨境 K-fashion（出口）
        - 通过 Musinsa Global Store 和品牌出口渠道向海外消费者销售韩国时尚
        - 韩国品牌通过非 Musinsa 参与的海外中介销售
        - 通过 Musinsa Global Store 覆盖 13 个市场的全球消费者
        - 增长中——占 2026 年 Q1 收入 4.2%；累计全球 GMV ₩240B；2030 年目标 ₩3T
