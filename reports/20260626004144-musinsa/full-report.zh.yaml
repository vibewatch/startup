  - id: FR001
    title: 风险热力图 — 发生可能性与剩余严重度（2026 年 6 月）
    type: matrix
    layout: standard
    summary: 截至 2026 年中，KFTC 执法、标签造假 / 消费者信任事件、平台护城河侵蚀的可能性—影响综合分最高。IPO 估值风险概率较低，但会传导到所有下游战略目标，因此严重度为最高级。
    data:
      columns:
        - 发生可能性（1=低 / 2=中 / 3=高）
        - 剩余严重度（1=低 / 2=中 / 3=高 / 4=最高级）
        - 缓释成熟度
        - 主要缓释措施
      rows:
        - label: KFTC 调查结果（大规模分销）
          values:
            - '3'
            - '3'
            - 低
            - 自愿配合；卖家合同文档
        - label: 标签调换 / 商品完整性事件
          values:
            - '3'
            - '2'
            - 中
            - AI 筛查系统；零容忍执行政策
        - label: 平台护城河被 Naver / Coupang 侵蚀
          values:
            - '3'
            - '3'
            - 低
            - 社区数据护城河；策展权威；20+ 年品牌伙伴关系
        - label: PIPA 数据泄露 / 执法
          values:
            - '2'
            - '3'
            - 低至中
            - 隐私项目；CPO 治理；泄露响应程序
        - label: IPO 估值失败或大幅延迟
          values:
            - '2'
            - '4'
            - 中
            - 强承销商阵容；Q1 2026 增长动能
        - label: RCPS 赎回 / 再融资压力
          values:
            - '2'
            - '3'
            - 中
            - 营业利润增长；DART 披露 RCPS 条款
        - label: Shein / Temu 超快时尚替代
          values:
            - '2'
            - '2'
            - 中
            - Musinsa Standard 品牌强度；策展差异化
        - label: 中国 JV 表现不佳 / 与 Anta 错位
          values:
            - '2'
            - '3'
            - 低
            - 早期 GMV 牵引；Anta 本地分销经验
        - label: Cho Man-ho 关键人物离任
          values:
            - '1'
            - '4'
            - 低
            - 联席 CEO 重组；2025 年 12 月补强 C-suite 梯队
        - label: 扩张市场商标侵权
          values:
            - '2'
            - '2'
            - 中
            - 主动 IP 注册；海外法律代表
        - label: Online Platform Act 通过与佣金上限
          values:
            - '2'
            - '2'
            - 低
            - 立法监测；行业沟通
        - label: 时尚趋势周期性 / K-trend 退潮
          values:
            - '1'
            - '3'
            - 低
            - 多元收入模型；Musinsa Standard 作为逆周期基础服饰品牌
    approximationNotes: 发生可能性与严重度分数为作者估算，依据公开监管记录、媒体报道和可比行业事件。Musinsa 未提供内部风险登记册。分数使用顺序尺度（1=低至 4=最高级），并非校准后的概率。
