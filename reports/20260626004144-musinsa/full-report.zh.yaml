      - number: '8.2'
        title: 融资历史、股权结构背景与 RCPS 压力
        blocks:
          - type: paragraph
            body: >
              Musinsa 完成过三轮机构融资：Series A（约 KRW 100B，Sequoia Capital，2019 年）、Series B（KRW 130B，Sequoia + IMM
              Investment，2021 年）以及 Series C（KRW 200B+，KKR + Wellington Management，2023 年），投前估值约 KRW 3.5T，约为 Series B
              标记的三倍。KKR 参投，是其首次在韩国做科技成长投资。2025 年 4 月，EQT Growth（香港办公室，Wallenberg 家族载体）以约 KRW 20–30B 从早期韩国投资者手中收购老股，隐含
              KRW 4T 估值；较 Series C 价格溢价 14%，但显著低于 IPO 目标。这笔二级交易是最近的独立公平交易参考价，也是最可靠的估值底部锚。

              RCPS 结构是关键估值输入，却常被公开叙事低估。Musinsa 已按 IFRS 标准将可赎回可转换优先股重分类，作为金融负债而非权益处理。截至 2025 年 H1，重分类余额约 KRW
              736B。重分类把负债率推高至约 620%，并产生非现金利息费用；2026 年 Q1 即便同周期经营利润为 KRW 27.5B，单体仍录得 KRW 8.0B 净亏损。扭曲是真实存在的：任何按报告净利润给
              Musinsa 估值的投资者，要么会看到亏损（误导性偏负），要么在 IPO 目标下看到调整后数字对应 143× 倍数（误导性偏高）。正确视角应是 EV/经营利润或 EV/EBITDA。

              IPO 时，优先股转为普通股会消除 RCPS 负债、改善资产负债表观感，并降低非现金费用，可能释放出高得多的经济净利润。投资者必须在 IPO 后股权结构模型中内置转换假设。2025 年 4
              月员工股权授予隐含的现有普通股总数（约 202 million 股，价格 ~KRW 14,000/股）显示，按该价格完全摊薄后公司估值约 KRW 2.75T，不到 IPO
              目标的三分之一。员工授予隐含估值（~KRW 2.75T）、EQT 二级交易（KRW 4T）、IB 行业估计（KRW 4–5T）、OTC 市场（KRW 3.4T）与公司 IPO 目标（KRW
              10T）之间的差距，是本章核心估值张力。
