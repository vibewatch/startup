      aggregate compiled statistics without disclosing primary data sources or methodologies.
      These sources are used only to corroborate directional market-sizing ranges and
      consumer behavior patterns, not as sole support for any material claim. All
      high-confidence claims rest on primary sources with identified publishers
      (Musinsa official newsroom, Korea Herald, The Investor, Kim & Chang, Statista/ECDB)
