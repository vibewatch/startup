callouts:
  - calloutType: strength
    title: Category Leadership with 10,000-Brand Moat
    body: >-
      Musinsa's catalog depth—10,000+ partner brands with exclusive or near-exclusive
      distribution relationships for many K-indie labels—creates a discovery network effect
      that is difficult for horizontal platforms (Coupang, Naver) to replicate through GMV
      alone. The brand ecosystem is the moat; brands like thisisneverthat, ADLV, and Matin
      Kim built their national and global followings almost entirely through Musinsa's
      editorial infrastructure. This lock-in is the most defensible part of the market
      position.
    claimRefs:
      - CM003
      - CM016
      - CM033

  - calloutType: risk
    title: GMV Methodological Conflict Creates Valuation Ambiguity
    body: >-
      Musinsa reports $3.3B GMV for 2024, while ECDB independently estimates $2.531B for
      2025—a significant divergence attributable to 1P/3P attribution methodology and
      currency timing. The company has not published audited financials at the GMV level,
      and the IPO prospectus (expected H2 2026) will be the first rigorously validated
      disclosure. Investors relying on company-reported GMV as primary sizing should apply
      a significant uncertainty discount until the prospectus is filed.
    claimRefs:
      - CM007
      - CM008
      - CM031

  - calloutType: insight
    title: Cross-Border Is the New Margin Expansion Vector
    body: >-
      Musinsa's export revenue surged 11.9x year-on-year in Q1 2026, from a near-zero base.
      This is not yet material to the P&L (4.2% of quarterly revenue) but the trajectory
      suggests it could reach 10–15% within 2–3 years if Japan and China growth continues.
      Critically, the Korean government's ₩47.1B annual cross-border support program
      partially subsidizes the logistics cost that would otherwise compress global margins.
      The global opportunity is real, but the conversion rate from ₩240B cumulative
      to ₩3T by 2030 requires ~12x growth in 5 years—ambitious by any standard.
    claimRefs:
      - CM020
      - CM032
      - CM034
      - CM035
      - CM036

  - calloutType: assumption
    title: SAM and SOM Are Author-Constructed
    body: >-
      No independent analyst firm publishes a Musinsa-specific SAM or SOM. The $5–8B SAM
      and the $3.3B SOM (using company-reported 2024 GMV) in this chapter are derived
      from applying online penetration rates to compiled fashion market statistics.
      They carry low analytical confidence and should be treated as directional scaffolding,
      not investment-grade forecasts. The IPO prospectus will be the first occasion on which
      audited GMV and revenue figures can be used to reconstruct these estimates with
      higher confidence.
    claimRefs:
      - CM007
      - CM008
      - CM031

