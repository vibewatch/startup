  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: GMV-methodological-conflict
      missingEvidence: "Musinsa's audited GMV reconciliation distinguishing 1P and 3P sales, platform-reported vs. ECDB-reported figures; as a pre-IPO company, Musinsa has not published audited financials at the GMV level."
      whyItMatters: "The $700M+ discrepancy between company-reported $3.3B GMV (2024) and ECDB's $2.531B (2025) creates meaningful uncertainty in SAM/SOM calculations and in the $7.4B IPO valuation multiple."
