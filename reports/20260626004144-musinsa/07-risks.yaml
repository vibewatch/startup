callouts:
  - calloutType: risk
    title: KFTC Active Investigation Is the Highest Near-Term Legal Risk
    body: >-
      The Korea Fair Trade Commission's April 2026 on-site inspection of Musinsa for large-scale
      distribution violations is an escalation from prior warning-level actions and has not been resolved
      as of the report date. An adverse outcome — a formal corrective order or fine — could restrict
      commission practices, require seller remediation, or produce reputational damage precisely during
      the IPO sensitivity window. The company's prior KFTC history (three separate actions in 2025–2026
      across eco-labeling, fill-content advertising, and distribution practices) signals a regulatory
      posture toward Musinsa that is more active than passive.
    claimRefs:
      - CR006
      - CR007
      - CR009

  - calloutType: risk
    title: RCPS Reclassification Creates Structural Financial Risk Ahead of IPO
    body: >-
      The reclassification of KRW 736B in RCPS as debt under K-IFRS in 2025 means Musinsa's financing
      costs are nearly equivalent to operating profit. This is not a cash-flow impairment in the near term,
      but the RCPS investors' redemption rights — if the IPO is not completed within timeline thresholds
      that are not publicly disclosed — could force Musinsa to refinance at unfavorable terms or accept
      a below-target valuation to satisfy redemption windows. The Mirae Asset withdrawal and the
      NASDAQ exploration signal that the IPO timeline is not locked.
    claimRefs:
      - CR021
      - CR022
      - CR023

  - calloutType: risk
    title: Label-Switching Pattern Indicates Systemic Platform-Trust Risk
    body: >-
      The 2022 counterfeit Fear of God Essentials incident, the 2024–2025 fill-content labeling scandal,
      and the March 2026 MARZIN tag-switching episode form a pattern rather than isolated incidents.
      Each event exposed a gap in Musinsa's pre-sale verification capability. The company's repeated
      response — suspending brands rather than directly apologizing to consumers — has been criticized
      as insufficient for trust repair. The AI screening system deployed in Q1 2026 is the most concrete
      mitigation to date, but it has not yet been independently validated, and the structural constraint
      (Musinsa does not physically hold consignment inventory) limits pre-sale inspection coverage.
    claimRefs:
      - CR011
      - CR012
      - CR013
      - CR014

