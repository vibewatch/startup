        - Revenue growth falls below 15% YoY for two consecutive quarters in 2026
        - Revisit KRW 1.47T 2025 baseline growth assumptions; stress-test margin with fixed offline cost base
      - - Data breach / PIPA enforcement
        - PIPC investigation or breach notification affecting 1M+ users
        - Any material breach resulting in PIPC enforcement action or class-action lawsuit filing
        - Estimate 10% revenue fine exposure (KRW 146.7B+); assess brand-trust and IPO timing impact
      - - Cho Man-ho departure
        - Announced departure, health disclosure, or loss of IPO leadership role
        - Any pre-IPO CEO transition or formal leave of absence
        - Assess underwriter confidence; request board response plan; evaluate co-CEO readiness
      - - China JV underperformance
        - Monthly China GMV trajectory and store-opening pace vs 100-by-2030 target
        - China GMV growth falls below 50% QoQ or fewer than 5 new stores open in H2 2026
        - Challenge China as a near-term valuation driver; reassess JV structure and Anta alignment
    notes: >-
      Triggers are designed as monitorable via public disclosures, DART filings, and press reporting.
      Not all triggers are independently verifiable without data-room access; the KFTC outcome and RCPS
      timeline are the highest-priority confirmatory diligence items.
