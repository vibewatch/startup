  - id: financial-ipo
    title: Financial, IPO Execution, and Capital Structure Risks
    body: >-
      IPO valuation contest. Musinsa is targeting a KRW 10T (~$7.4B) KOSPI valuation. At 2025 net income,
      this implies a PER of 143x — roughly 10x the industry average. Secondary market trading on Securities
      Plus valued Musinsa at ~KRW 3.4T as of mid-2025, less than 35% of the target. Mirae Asset Securities
      withdrew from the underwriting process in November 2025, explicitly citing the valuation as
      "excessively high." Industry comparisons are unfavorable: Musinsa's implied EV/Sales of ~7-8x
      compares to Coupang's 3.5x at its NYSE IPO, which itself subsequently fell below its listing price.
      The Financial News in February 2026 noted that Musinsa is "exploring various options for listing,
      including NASDAQ," signaling that the KOSPI 2026 timeline is not certain. A failed or materially
      discounted IPO would deny Musinsa the capital it needs for the China 100-store buildout by 2030
      and could trigger secondary-market pressure on existing RCPS holders.

      RCPS structural debt risk. Musinsa reclassified ~KRW 736B of redeemable convertible preferred shares
      (RCPS) as debt under K-IFRS in 2025. This reclassification does not change cash obligations but
      creates an accounting-level constraint: financing costs are now nearly equivalent to operating profit,
      suppressing reported net income and potentially triggering debt-covenant-like protections in RCPS
      agreements if the IPO is delayed beyond agreed timelines. Investor redemption rights — if triggered
      by an IPO not completing within agreed timelines — could require Musinsa to refinance at unfavorable
      terms. The Q1 2026 quarterly report confirms operating profit of KRW 19.0B (+8.2% YoY) on revenue
      of KRW 363.6B (+24.1%), maintaining growth momentum, but RCPS financing charges absorb a significant
      share of that profit at the net income line.

      Working capital and margin pressure. Musinsa's shift toward direct merchandise purchasing
      (KRW 400.7B in 2025) and offline retail expansion creates inventory carrying risk absent from
      a pure marketplace model. Inventory growth concurrent with the offline expansion amplifies
      working-capital demands. Commission take rates (15–30%) face potential downward pressure from
      the Online Platform Act and multi-channel brand strategies. Marketing costs, which drove the
      2023 operating loss of KRW 8.6B, can re-expand if competitive intensity requires heavier promotions.
