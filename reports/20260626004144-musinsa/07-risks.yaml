  - id: regulatory-legal
    title: Regulatory, Legal, and Compliance Risks
    body: >-
      Korea Fair Trade Commission (KFTC). In April 2026, the KFTC conducted an on-site inspection of
      Musinsa over suspected violations of the Act on Fair Transactions in Large Retail Businesses, the same
      sweep that included Lotte Hi-Mart. This is an escalation beyond prior warning-level actions: the KFTC
      previously issued corrective orders and warnings in January 2026 after confirming that products
      advertised on Musinsa-hosted brands mis-stated down-fill and cashmere content — 17 clothing companies
      were sanctioned, and the KFTC stated it would establish an ongoing channel with fashion platforms to
      prevent recurrence. In 2025, the KFTC also warned Musinsa Standard and three SPA brands (Topten, Spao,
      Zara) about misleading eco-friendly claims on synthetic leather. These actions are warning-level, but
      the April 2026 inspection signals that the regulator's posture has shifted from ex post correction to
      active probing of platform business-practice conduct. If the investigation produces an order or fine,
      it could trigger seller-relationship disruption and reputational damage ahead of the IPO.

      Online Platform Act. Korea's National Assembly has been deliberating an Online Platform Act for five
      years; as of mid-2026 negotiations between ruling and opposition parties are ongoing after a
      subcommittee review. If enacted, Musinsa — as a dominant vertical platform — would be designated
      as a covered enterprise subject to commission-rate transparency requirements, settlement-timing
      mandates, and prohibitions on unfair contract practices with sellers. This would constrain pricing
      flexibility and potentially limit Musinsa's ability to use preferential listing positions as a
      monetization lever.

      Personal Information Protection Act (PIPA) amendments. An amendment passed in 2025 and in force by
      late 2026 raises the maximum administrative fine from 3% to 10% of total annual revenue for repeat or
      willful breaches affecting 10M+ data subjects, expands the breach definition to include forgery and
      alteration, and requires early notification at the "possibility of a breach" stage rather than
      confirmed incident. Musinsa's 16M+ member base and its extensive behavioral, payment, and purchase
      history data set would make it a high-profile enforcement target. It must also implement CEO-level
      accountability and board approval for CPO appointments for firms above size thresholds. A data breach
      at Coupang in November 2025 — affecting 33.7M users — demonstrated both the litigation and
      regulatory exposure a Korean e-commerce platform can face from a single incident.

      Trademark and IP. In June 2026, BusinessKorea reported that a store in Nha Trang, Vietnam was
      operating as "MOOSINSA," a subtle variation of Musinsa's trademark, along with a "29M" store copying
      29CM. Musinsa obtained a signboard replacement but the original name persists on Google Maps and
      social media, indicating residual brand-credibility risk in markets where Musinsa lacks local
      incorporation. As the China and Japan expansions proceed without formal trademark filings across
      all product and service classes, this risk grows. The 2022 counterfeit Fear of God Essentials
      incident on Musinsa Boutique — where Naver's Kream platform authenticated the product as fake
      after Musinsa sold it — established a reputational precedent that recurred with the 2026 tag-fraud
      episode, demonstrating a pattern rather than an isolated failure.
