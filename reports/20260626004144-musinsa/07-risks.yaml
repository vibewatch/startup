        covenants embedded in the Series B and C RCPS agreements
      whyItMatters: >-
        Without these terms, it is impossible to assess whether the RCPS redemption clock is ticking
        toward a forced refinancing that could result in a below-target IPO or capital constraint during
        the China buildout. Financing costs nearly equaling operating profit is already a material constraint.
      diligencePath: >-
        Request Series B and C RCPS agreements, conversion schedules, and any side letters related to
        IPO timeline from Korea Investment (Series C lead) or company counsel
      relatedQuestionRefs:
