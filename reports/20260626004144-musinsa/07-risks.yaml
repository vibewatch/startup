        - plannedTables/regulatory-legal-risk-register
      status: answered
      answerSummary: >
        No formal corrective order or fine has been publicly issued against Musinsa by KFTC as of June 2026. The April 2026 inspection remains under review. Prior KFTC actions against similar platforms (Naver Shopping, Kakao) resulted in corrective orders within 6-12 months.
  
