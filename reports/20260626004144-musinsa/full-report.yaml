      - number: '1.3'
        title: Capital base, funding history, and investor map
        blocks:
          - type: paragraph
            body: >
              Musinsa has raised approximately KRW 430 billion (~$474 million) across three formal funding rounds since
              2019, all structured as primary equity raises, while EQT completed a secondary share acquisition in April
              2025 at a ~KRW 4 trillion ($2.8 billion) valuation. The funding sequence is: Series A in November 2019
              (KRW ~100B from Sequoia Capital, unicorn at $800M valuation), Series B in March 2021 (KRW ~130B from Peak
              XV Partners and IMM Investment, valuation ~$2.2B), and Series C in July 2023 (KRW ~200B led by KKR with
              Wellington Management,  valuation KRW ~3.5T or ~$2.4B). The Series C was KKR's first technology growth
              investment in Korea.


              The April 2025 EQT secondary transaction—structured as a KRW 20–30B acquisition of shares from early
              Korean venture investors—raised the implied valuation to approximately KRW 4T, roughly 15% above the 2023
              Series C price. EQT Growth, operating from its Hong Kong office, is the vehicle and is reportedly
              considering follow-on investment. The investor map is concentrated in institutional PE and growth equity:
              KKR, Wellington, Peak XV, IMM, and EQT all hold stakes with material governance expectations ahead of the
              IPO. The full cap table, share preferences, anti-dilution rights, and voting mechanics remain undisclosed.
              Total primary capital raised from external investors is KRW 430 billion; secondary transactions and any
              secondary-market pricing between rounds are not fully documented in public sources. Founder and management
              ownership dilution is unquantified.
