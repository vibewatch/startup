  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Framework and Severity Overview
        blocks:
          - type: paragraph
            body: >-
              Musinsa's investment risk profile is shaped by its late-stage private status, active IPO process, and the
              tension between three competing strategic imperatives: defending Korean platform dominance, scaling
              offline retail, and executing a capital-intensive global expansion in China and Japan. The company's
              operating model — a hybrid of marketplace commission, private-label direct retail, and curated brand
              distribution — exposes it simultaneously to platform-regulatory risk, retail-execution risk, and
              brand-trust risk. Risks in this chapter are ordered by residual severity after known mitigations.

              The most acute near-term risks are the IPO valuation and timing uncertainty and the active KFTC
              investigation. Both have direct transmission paths to equity value: a failed or delayed listing blocks
              capital required for the China build, while an adverse KFTC ruling on unfair trade practices could
              accelerate brand-partner defections to Naver or Coupang. The label-switching scandal that surfaced in
              March 2026 is the third product-integrity incident in four years, reinforcing a pattern that an AI-based
              screening system announced in Q1 2026 has not yet fully resolved. Privacy compliance risk is structural:
              Musinsa manages 16M+ members' behavioral and payment data, and the 2026 PIPA amendments raise the maximum
              fine to 10% of total revenue for severe incidents — equivalent to KRW 146.7B at 2025 revenue scale. On the
              competitive side, Shein's growth in Korean women's fashion MAU overtook Queenit in late 2025, and Naver is
              actively poaching K-fashion brands that built their audiences on Musinsa, creating a real risk of a
              multi-channel erosion of Musinsa's brand-partner moat.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
