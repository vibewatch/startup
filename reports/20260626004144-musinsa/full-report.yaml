            body: >-
              Musinsa's catalog depth—10,000+ partner brands with exclusive or near-exclusive distribution relationships
              for many K-indie labels—creates a discovery network effect that is difficult for horizontal platforms
              (Coupang, Naver) to replicate through GMV alone. The brand ecosystem is the moat; brands like
