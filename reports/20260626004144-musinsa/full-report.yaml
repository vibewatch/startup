      - number: '5.2'
        title: Technology Architecture and AI Infrastructure
        blocks:
          - type: paragraph
            body: >-
              Musinsa's engineering organisation underwent a structural transformation beginning in H2 2025 under a
              company-wide "AI Literacy" initiative. The tech division expanded OpenAI Codex adoption from a
              100-developer proof of concept in July 2025 to approximately 700 developers by March 2026. Musinsa
              self-reports a 74.7 percent increase in developer productivity (measured in internal "points per developer
              per month") over this window—a directional figure based on an undisclosed methodology that independent
              research suggests may overstate real throughput, since activity metrics like commits and pull requests
              naturally rise with AI tooling without capturing added review time. Other AI coding tools in active use
              include Claude, Cursor, and Junie for code generation and analysis. Beyond the development surface,
              Musinsa's "AI Studio" content-generation tool is in daily use by over 270 employees across more than 10
              departments, producing an average of 60,000-plus pieces of content monthly. A "Visual Search" feature
              trained on 3 million fashion images enables image-based product discovery. An "AI CS Agent" is in beta for
              post-purchase inquiries using LLM-based FAQ routing. In June 2026 Musinsa launched "AI Trend Curation,"
              which analyses real-time external fashion trend data and proactively surfaces related products— initially
              in the hat category with a plan to expand across all fashion and beauty. The crown AI initiative is
              Musinsa MCP (Model Context Protocol), an in-house-developed commerce-discovery interface that allows users
              to receive product recommendations via natural-language context (time, place, occasion, weather, price
              range, brand preferences) without entering explicit search keywords. The MCP service debuted on KakaoTalk
              in March 2026 and launched on OpenAI's ChatGPT platform in June 2026, representing a deliberate shift from
              search-centred to conversational fashion commerce. The platform's architecture is described in technical
              press as cloud-native and microservices-based; a unified data platform is currently under construction to
              consolidate previously separate marketing, sales, customer, and operational data streams across Musinsa
              Store, 29CM, Soldout, and Global. CEO Park Joon-mo has publicly articulated the goal as making all
              platforms "function as one interconnected core."
