      - number: '7.6'
        title: Mitigations, Kill Criteria, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Known mitigations in place include: (1) AI-based online product inspection system covering 1.2M listings
              on Musinsa and 29CM, deployed Q1 2026 to detect label-fraud and similarity violations; (2) zero-tolerance
              enforcement policy with permanent platform bans and legal action for label switching; (3) IPO underwriter
              team comprising Citigroup, JP Morgan, Korea Investment & Securities, and KB Securities — a strong mandated
              bank lineup that constrains the company from excessive pricing even if it tries; (4) RCPS reclassification
              already absorbed in the 2025 balance sheet, meaning the accounting distortion is now visible to future
              public investors; (5) Musinsa Standard brand strength, ranked #1 among Korean consumers aged 19-29,
              providing partial hedge against ultra-fast-fashion substitution.

              Gaps and residual exposure are concentrated in: (1) the KFTC April 2026 investigation outcome — which is
              unresolved and could result in an enforceable corrective order, fine, or seller-facing conduct
              restriction; (2) the RCPS investor redemption rights timeline — not publicly disclosed, creating
              uncertainty about forced refinancing risk if the IPO slips past agreed trigger dates; (3) the Anta JV
              control structure — not publicly disclosed, so the extent to which Musinsa retains strategic control over
              the China business is a material diligence gap; (4) PIPA compliance certification status — Musinsa has not
              publicly disclosed its ISMS-P status or any prior PIPC notification, which becomes mandatory once amended
              PIPA enforcement thresholds are defined; (5) brand-partner concentration data — no public disclosure of
              GMV from top-10 brands, preventing independent assessment of partner concentration risk.

              Thesis-break triggers: A KOSPI listing at below KRW 5T valuation would signal market rejection of the
              platform-premium thesis and reset investor return expectations. An adverse KFTC enforcement order
              restricting commission practices would structurally impair the primary revenue driver. Cho Man-ho
              departure before the IPO would likely cause an underwriter reassessment. Material deceleration in Q2/Q3
              2026 revenue growth (below 15% YoY) would raise concerns about whether the 2025 acceleration was
              sustainable. A material data breach affecting members would trigger PIPA enforcement, a class-action
              environment similar to Coupang's, and brand-trust impairment ahead of the listing window.
