          - type: callout
            title: Private-Label Conflict and Seller Concentration Opacity
            body: >-
              Musinsa Standard's position as the top fast-fashion brand for Korean Gen Z while sharing the same
              marketplace with 10,000+ paying partner brands creates a structural conflict of interest. Without
              disclosed brand-GMV concentration data, investors cannot assess the platform's dependency on its top
              sellers or the risk of brand defection.
            calloutType: risk
