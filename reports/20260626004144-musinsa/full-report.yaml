      - number: '1.2'
        title: Governance, leadership, and key-person risk
        blocks:
          - type: paragraph
            body: >
              Musinsa's founding CEO Cho Man-ho (Manho Cho) remains the central executive and public face of the company
              and is the only fashion-platform chief executive on The Business of Fashion BoF 500 Class of 2025,
              described by BoF as an "innovative leader who is driving the global expansion of K-fashion by leveraging
              Korea's cultural influence and establishing a new fashion business model that integrates technology and
              community." His continued involvement is material: he built the community from a high-school project,
              cultivated every institutional investor relationship through three funding rounds, and anchors the brand's
              credibility with the 10,000+ partner labels whose growth is tied to Musinsa's platform.


              In December 2025, Musinsa adopted a formal co-CEO governance structure, appointing Cho Nam-sung as co-CEO
              responsible for internal support functions (legal, finance, HR, and PR), while Cho Man-ho retains
              leadership over business operations, product, and global strategy. Park Jun-mo, who served as co-CEO
              leading global expansion from at least 2024, transitioned to an advisory role in January 2026. The
              restructuring introduced a full C-suite tier—CCO, CBO, CGO, CTO, CFO, CLO, CPRO, and CDeO—with each role
              carrying area-specific autonomy and annual performance evaluations. This is a governance step toward IPO
              readiness, but the board composition and investor governance rights are not publicly disclosed for this
              private company. Key-person risk on Cho Man-ho is material: if he departed or became unavailable, the
              platform's brand positioning, investor confidence, and partnership ecosystem would face disruption without
              an obvious successor of comparable founder credibility.
