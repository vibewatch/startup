  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, streams, and pricing
        blocks:
          - type: paragraph
            body: >
              Musinsa operates a three-pillar revenue model that distinguishes it from a pure marketplace: (1)
              Commission revenue from the core Musinsa platform and the women-focused 29CM marketplace, where brands pay
              15–30% commission depending on product category; (2) Product revenue from direct-to-consumer Musinsa
              Standard private-label sales across 34+ offline stores and online channels; and (3) Merchandise (MD)
              revenue from curated brand distribution where Musinsa buys inventory and resells. A fourth ancillary
              stream—advertising, fulfillment, and data services—is embedded within commission but not broken out
              separately in public filings.


              In 2025, the three pillars contributed: Commission KRW 568.9B (38.8% of revenue), Product/Standard KRW
              451.8B (30.8%), and Merchandise KRW 400.7B (27.3%). Commission is the margin engine, carrying the highest
              incremental margin since the platform bears no inventory risk on partner brand sales. Product revenue
              includes Musinsa Standard offline retail (29 stores at end-2024, growing toward 40+) as well as the online
              private-label channel, and carries gross margin dilution versus commission but benefits from brand control
              and pricing power. Merchandise revenue carries full inventory risk and is the lowest-margin segment, but
              serves as a strategic lever to onboard major brands that require guaranteed inventory commitment before
              agreeing to list.


              The resale channel, Musinsa Used (formerly Solid Out), adopted a uniform 15% consignment commission model
              from January 23, 2026, replacing a tiered structure. This simplification improves margin predictability on
              the KRW 120B+ resale GMV line. International export GMV represented only 0.57% of total transaction value
              in H1 2025, confirming that global revenue is still nascent and the near-term model is overwhelmingly
              domestic Korea.


              Recognition basis: revenue is recognized at transaction close for direct product and merchandise;
              commission revenue is recognized net of any promotional subsidies provided to partner brands. Musinsa has
              not disclosed a breakdown of advertising and logistics revenue as distinct lines, which is a gap for
              constructing a full unit-economics model without data-room access.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
