      - number: '5.3'
        title: Deployment, Engineering Organisation, and Roadmap
        blocks:
          - type: paragraph
            body: >-
              Musinsa's recruitment strategy reflects its AI-native transformation ambition. In January 2026 the company
              launched "Musinsa Rookies," an entry-level developer programme that drew 2,000+ applicants and used OpenAI
              Codex as the core evaluation tool—candidates were assessed on AI-augmented problem-solving rather than
              coding proficiency alone. Sixty-six developers were selected in March 2026. The company targets expanding
              technical employees to over 40 percent of total headcount within three years; backend, frontend, ML, SRE,
              and data engineering roles are posted on a rolling basis via "Musinsa Careers." An internal AI hackathon
              ("MUSNSAI") held in August 2025 provided an early proof-of-concept for developer-culture AI adoption. The
              tech division VP Jeon Jun-hee described strengthening AI literacy as "a necessity, not a choice," and the
              company is pursuing a four-stage "AI native" roadmap targeting completion by Q1 2027. The roadmap
              encompasses engineering (initial AI tool adoption), content creation (AI Studio at scale), customer
              service (AI CS Agent rollout), and full platform integration. An "AI Customer Service Agent" currently in
              beta combines LLM searches of standard procedures with FAQ lookups for post-purchase inquiries. New app
              version 1.32.0 (released June 11, 2026 per App Store release notes) added AI-powered product summaries and
              translation on product pages along with real customer outfit photos—evidence that AI features are being
              shipped directly into the consumer-facing product surfaces. Offline deployment milestones include the
              Megastore Seongsu (April 2026) and Musinsa Standard China store openings (Shanghai Huaihai Road and
              Nanjing East Road), each integrated with Tmall and the Global App for seamless online continuation
