      - number: '4.3'
        title: Cost structure, gross margin, and working capital
        blocks:
          - type: paragraph
            body: >
              Musinsa's cost structure is dominated by cost of goods sold on the merchandise and direct product
              segments, and by personnel and marketing costs on the commission segment. The platform does not disclose a
              consolidated gross margin line; however, using the DART semi-annual filing data, the combined
              merchandising/direct-product segments carry estimated gross margins of 35–45% while commission revenue
              carries near-100% gross margin on the net fee. Blended operating margin improved from 8.3% in 2024 to 9.6%
              in 2025, confirming positive operating leverage as the higher-margin commission segment grows faster than
              the merchandise segment.


              Working capital is a material monitoring item. Inventory rose from KRW 330B at end-2024 to approximately
              KRW 425B at H1 2025, with inventory turnover declining from 1.7x to 1.4x—a deterioration that contributed
              to H1 2025 operating cash flow turning negative (KRW –71.9B) versus positive KRW +173.6B in H1 2024. This
              swing is the single largest near-term operational risk flag, as it suggests either demand softness in the
              merchandise segment or deliberate advance-stocking for the peak H2 season. The company has not publicly
              addressed this reversal, and it warrants specific data-room diligence.


              Marketing costs remain elevated as Musinsa invests in brand awareness and international expansion.
              Fulfillment is partially outsourced; Musinsa operates a logistics network for Musinsa Standard but uses
              third-party carriers for marketplace orders. Capex is moderate relative to revenue (~4–6% of revenue
              estimated), driven by Musinsa Standard offline store expansion and technology infrastructure. The P-CBO
              bond program (~KRW 100B outstanding) and lease liabilities from 34+ offline stores create fixed charges
              that limit downside flexibility if revenue were to decline.


              Subsidiary drag is a compound cost factor: 13 of 16 subsidiaries were loss-making as of Q1 2025. The
              largest drags are Solid Out (SLDT), which accumulated losses of approximately USD 79M through Q1 2024 on
              annual revenue of only USD 12.5M; Musinsa Japan, which posted an operating loss in 2024; and 29CM, which
              carries legacy investment costs from the acquisition. These subsidiary losses are consolidated into group
              results and suppress the group return on equity.
