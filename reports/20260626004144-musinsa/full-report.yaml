    layout: standard
    summary: >-
      Seven-dimension investment scorecard (0–5 scale) across market, proof, moat, economics, risk, valuation
      discipline, and evidence quality; aggregate score 23/35 is consistent with WATCH designation.
    data:
      items:
        - label: Market opportunity
          value: 4
          context: Korean online fashion TAM ~$17–18B growing 8–10% CAGR; K-fashion global thesis is real and accelerating
        - label: Business proof
          value: 4
          context: Revenue CAGR 27.5%; first profitable year 2024; 9.6% OP margin 2025; Q1 2026 acceleration
        - label: Competitive moat
          value: 3
          context: >-
            Deep brand ecosystem + MFS lock-in, but KFTC probe, Coupang/Naver brand recruitment, and Chinese entrants
            are real threats
        - label: Unit economics
          value: 3
          context: >-
            Commission margin strong; inventory turnover declining; RCPS charges distort net; Soldout/29CM subsidiaries
            drag
        - label: Risk profile
          value: 2
          context: KFTC unresolved; RCPS overhang; China/Japan execution early stage; OTC implied cap 66% below IPO target
        - label: Valuation discipline
          value: 2
          context: >-
            KRW 10T target unjustified by comps; EQT at KRW 4T and IB consensus at KRW 4–5T are credible; enter only
            below KRW 5.5T
        - label: Evidence quality
          value: 5
          context: >-
            Four DART public filings; confirmed underwriter syndicate; verified OTC prices; LS Securities independent
            analysis; EQT mark
    approximationNotes: >-
      Scoring is qualitative (0=very weak, 5=very strong). Aggregate 23/35 reflects the paradox of an operationally
      excellent company priced for an optimistic outcome that has not yet materialized.
