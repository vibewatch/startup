  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface and Business Units
        blocks:
          - type: paragraph
            body: >-
              Musinsa Group operates five publicly confirmed digital commerce surfaces. The flagship Musinsa Store is
              Korea's dominant multi-brand fashion marketplace, launched in 2009 and now serving an estimated 7 million
              monthly active users via web and mobile app with over 8,000 partner brands—from indie Seoul streetwear
              labels to global sportswear names—ranked by real-time purchase behaviour rather than editorial selection
              or ad spend. 29CM is a premium fashion and lifestyle platform positioned around curated "guide to a better
              choice" editorial experiences including 29LIVE interactive commerce events; it draws an estimated 3
              million monthly active users with a demographic skewed toward women and lifestyle categories. Soldout
              (formerly Solid Out) specialises in limited-edition sneaker and fashion resale with technology-backed
              authentication and a stated 300 percent counterfeit-compensation guarantee. Musinsa Global serves 13
              international markets—including the United States, Japan, Singapore, and Australia—using email-only
              registration (no Korean ID or phone number required), local currency checkout, transparent duty/tax
              calculation, and a dedicated iOS/Android app separate from the domestic app. Musinsa Empty functions as a
              digital-closet and peer-to-peer resale surface distinct from the authenticated Soldout channel. A
              private-label arm—Musinsa Standard (apparel) and a cluster of beauty labels (Musinsa Standard Beauty,
              Whizzy, Oddtype, No the Love)—spans both online and a growing offline network of over 75 domestic store
              locations as of April 2026, anchored by the 6,600-square-meter Megastore Seongsu flagship that opened
              April 24, 2026, the largest single-brand offline retail space in Korea. Musinsa Beauty's private labels
              recorded 120 percent year-on-year transaction volume growth in 2025, and the beauty category's real-time
              K-beauty ranking zone and Musinsa-exclusive offline-only brands signal a deliberate challenge to
              established H&B retailers. Internationally, within 100 days of China market entry (September–December
              2025), Musinsa crossed KRW 10 billion in cumulative online and offline sales, with Tmall transaction
              volume growing 9× and offline store visits surpassing 100,000 within 26 days of Shanghai openings.
