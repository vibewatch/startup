      - number: '8.2'
        title: Financing history, cap table context, and RCPS overhang
        blocks:
          - type: paragraph
            body: >
              Musinsa has raised three institutional rounds: Series A (KRW ~100B, Sequoia Capital, 2019), Series B (KRW
              130B, Sequoia + IMM Investment, 2021), and Series C (KRW 200B+, KKR + Wellington Management, 2023) at a
              ~KRW 3.5T pre-money valuation—roughly triple the Series B mark. KKR's participation marked its first Korea
              technology growth investment. In April 2025, EQT Growth (Hong Kong office, Wallenberg family vehicle)
              acquired existing shares from early Korean investors for approximately KRW 20–30B, implying a KRW 4T
              valuation—a 14% premium to the Series C price but materially below the IPO target. This secondary
              transaction is the most recent arm's-length reference price and the most reliable anchor for a floor
              valuation.

              The RCPS structure is a critical valuation input that public narratives routinely understate. Musinsa has
              reclassified redeemable convertible preferred shares under IFRS standards, treating them as financial
              liabilities rather than equity. The total reclassified balance was approximately KRW 736B as of H1 2025.
              This reclassification inflates the debt ratio to approximately 620% and generates a non-cash interest
              charge that produces standalone net losses—KRW 8.0B in Q1 2026—despite operating profit of KRW 27.5B in
              the same period. The distortion is real: any investor valuing Musinsa on reported net income will either
              see a loss (misleadingly negative) or, at the IPO target, a 143× multiple on the adjusted number
              (misleadingly high). The correct lens is EV/Operating Profit or EV/EBITDA.

              At IPO, preferred-share conversion to common equity would eliminate the RCPS liability, improve the
              balance sheet optics, and reduce the non-cash charge—potentially revealing considerably higher economic
              net income. Investors must model the post-IPO cap table with the conversion assumption baked in. The total
              existing ordinary shares implied by the April 2025 employee stock grants (roughly 202 million shares at
              ~KRW 14,000/share) suggest a fully diluted share count that values the company at roughly KRW 2.75T at
              that price—less than one-third of the IPO target. The spread between the employee-grant-implied valuation
              (~KRW 2.75T), the EQT secondary (KRW 4T), the IB industry estimate (KRW 4–5T), the OTC market (KRW 3.4T),
              and the company's IPO target (KRW 10T) is the central valuation tension for this chapter.
