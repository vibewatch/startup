      - number: '2.3'
        title: 'Demand Drivers: Streetwear, Gen Z, and K-Culture'
        blocks:
          - type: paragraph
            body: >-
              Musinsa's demand engine rests on four structural tailwinds that compound one another: Gen Z digital-first
              shopping behavior, Korean streetwear and sneaker culture, K-pop and K-media cultural pull, and the
              expanding global appetite for K-fashion.

              Korean Gen Z consumers (18–24) are among the most digitally active shoppers globally: 35% shop online
              weekly, 72% check Instagram or TikTok for trend validation before making purchases, and 85% read peer
              reviews. Mobile drives approximately 78% of all online fashion transactions in Korea. This digital-first
              posture directly benefits platform-native businesses like Musinsa that have built discovery, content, and
              fulfillment around the smartphone.

              Streetwear and sneaker culture is the category engine. The 2026 Acubi aesthetic—a Korean Gen Z streetwear
              style blending Y2K silhouettes, muted palettes, and oversized technical layering—has driven sustained
              demand for the small Korean independent brands (thisisneverthat, mahagrid, ADLV/Acme De La Vie, Covernat)
              that Musinsa has incubated and for which it is the primary distribution channel. Unlike Western hype-drop
              culture, Korean streetwear prioritizes versatility and continuous wearability, which creates
              repeat-purchase patterns rather than single-event spikes.

              K-pop provides cultural velocity. Musinsa signed NewJeans as its brand ambassador; the group's aesthetic
              directly mirrors the Musinsa product catalog. Platform-sponsored brand activations and idol tie-ins
              convert fandom into measurable purchase events on short timelines—faster than in Western markets according
              to industry observers. K-drama and K-content on Netflix and Disney+ extend K-fashion's global reach and
              drive inbound tourism-linked retail: foreign customers accounted for approximately 44% of sales at Musinsa
              Standard flagship stores (Myeong-dong, Seomyeon, Seongsu, Hannam, Hongdae) in Q1 2026.

              Beauty and sports adjacencies are expanding the platform's TAM. Musinsa Beauty's in-house brand GMV rose
              120% YoY in Q1 2026, and the company is opening Mega Store Seongsu as a combined fashion-beauty
              destination. Approximately 800 beauty brands are enrolled. The sports category benefits from Korean
              consumers' affinity for outdoor/technical wear, itself a K-pop–adjacent aesthetic.
            claimRefs:
