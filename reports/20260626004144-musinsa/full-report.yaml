      - number: '8.3'
        title: Comparable set and multiple analysis
        blocks:
          - type: paragraph
            body: >
              No single global comparable perfectly matches Musinsa's model—a domestic-dominant curated fashion
              marketplace with private-label and offline retail, plus nascent international expansion. The most
              instructive peers are assembled across four categories: (1) listed Asian fashion marketplaces, (2)
              European fashion e-commerce, (3) Korean internet platform anchors, and (4) private secondary marks.

              ZOZO Inc (Tokyo: 3092.T) is the closest structural analog—a curated fashion marketplace with a
              private-label line (Zozo Suit), strong category leadership in Japan, and approximately ¥991B (~$6.5B)
              market cap on ¥228B (~$1.5B) revenue as of June 2026, implying an EV/Sales of ~4.3× and PE of 20.7×. ZOZO
              operates in a single mature market with a saturated growth profile; Musinsa's higher growth rate and
              international optionality justify a modest premium over ZOZO's PE, but ZOZO's EV/Sales of 4.3× already
              represents the high end of the defensible range for Musinsa, given ZOZO's scale advantage and Japan's
              larger, deeper fashion market.

              Zalando SE (XETRA: ZAL.DE) serves as the European reference: €6.87B market cap on €12.9B 2025 revenue
              (EV/Sales 0.53×, PE 60.4×), reflecting a mature, low-margin marketplace in a stagnant growth environment.
              Zalando's model is not a bull case for Musinsa—it shows what multiple compression looks like when growth
              slows.

              Coupang (NYSE: CPNG) provides the Korean e-commerce anchor: $30.6B market cap, $35.1B 2025 revenue,
              EV/Sales ~0.87×. Coupang is a logistics-first generalist e-commerce platform—not a fashion specialist—but
              its valuation history (IPO PSR 3.5× in 2021 declining to <1× by 2026) illustrates the re-rating risk if
              growth decelerates. Economy.ac (November 2025) explicitly noted that Musinsa's targeted PSR of 7× was
              double Coupang's IPO PSR.

              Korean internet anchors Naver (035420.KS, market cap KRW 29.6T, EV/Sales ~2.7×) and Kakao (035720.KS,
              market cap KRW 14.9T, EV/Sales ~1.9×) provide the domestic platform baseline. Both have revenue an order
              of magnitude larger than Musinsa yet trade at lower EV/Sales multiples, implying that the Korean market
              applies a moderate multiple to platform companies—not a premium growth multiple.

              The private secondary market confirms the gap: EQT's April 2025 trade at KRW 4T ($3B) is the cleanest
              market-clearing price. Ably Corporation's $2.1B Alibaba-backed valuation on comparable but lower GMV (KRW
              2.8T) provides an adjacent reference. At KRW 4T, Musinsa trades at EV/Sales of 2.7×—consistent with
              Naver's multiple— which represents a reasonable base, assuming continued domestic strength but no credit
              for unproven international revenue. The KRW 10T IPO target requires EV/Sales of 6.8×, which exceeds ZOZO's
              4.3× and demands extraordinary international scale assumptions not yet supported by 0.57% export share.
