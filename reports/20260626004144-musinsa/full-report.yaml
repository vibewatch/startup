      - number: '6.3'
        title: Named Customer and Brand-Level Proof
        blocks:
          - type: paragraph
            body: >
              Musinsa's most concrete customer proof lives at the brand-partner level rather than at the end-consumer
              level. The strongest named case is Matin Kim, a Korean womenswear brand that joined the Musinsa Global
              Store in November 2022, saw four Japan pop-up events sell out entirely, and in spring 2024 generated 500
              million KRW in 12 days at a Shibuya Parco pop-up that drew more than 4,000 visitors in its first four
              days. In November 2024, Musinsa signed an exclusive distribution partnership with Matin Kim for the Japan
              market covering all marketing, PR, and offline store operations through 2029; since adopting Musinsa's
              Japan local fulfillment service, Matin Kim's average daily sales rose 75%. Musinsa's Japan brand business
              overall grew 17-fold between the 2021 subsidiary founding and 2024.


              On the private-label side, Musinsa Standard's purchase-intent leadership among Korean 19–29-year-olds
              (48.1% vs. Uniqlo's 42%) represents verified consumer preference at scale. The platform's offline tourist
              sales provide an additional named proof point: combined foreign-customer sales at Musinsa Select shops and
              Musinsa Standard stores in Korea exceeded 20 billion KRW in 2025, a sixfold year-on-year jump across 136
              nationalities.


              29CM's 1 trillion KRW transaction milestone (October 2025) and Q1 2026 fashion GMV growth of 33%
              constitute platform-level evidence of brand expansion success within Musinsa Group. Smaller brands Stand
              Oil, Glowny, and Rest & Recreation are cited by Musinsa as successful entrants into the Japanese market
              through its support infrastructure, though no individual GMV or outcome figures for these brands are
              publicly disclosed.
