  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Demographic Composition
        blocks:
          - type: paragraph
            body: >
              Musinsa's addressable customer universe spans three interconnected groups: end-consumers (users and buyers
              on the main Musinsa app, on 29CM, and on the Musinsa Global Store), partner brands (sellers/payers
              numbering 10,000+ domestically), and in-store tourist buyers who experience K-fashion offline. On the
              consumer side, the platform's origins as a male-skewed sneaker-enthusiast community have given way to a
              broadly Gen-Z and Millennial base: approximately 78% of Musinsa's 15M+ registered users are under 30, with
              teenagers and people in their 20s constituting roughly 60% of the total registered base. The "MZ
              generation" (Millennials plus Gen Z, ages approximately 16–45) drives both domestic purchase frequency and
              global conversion.


              The acquisition of 29CM in 2021 extended Musinsa's reach into the female 25–39 segment, which was
              historically underserved on the main platform. By Q1 2026, 29CM's female MAU grew more than 20%
              year-on-year, with women in their 30s and 40s growing over 30%. 29CM's 1.76M MAU surpasses W Concept
              (approximately 1.15M MAU) and positions Musinsa Group as the dominant platform for both the male Gen-Z
              streetwear buyer and the female-urban lifestyle shopper.


              Partner brands (10,000+ on the domestic marketplace, approximately 2,000 on the global store as of
              mid-2025) constitute the payer segment: they generate commission revenue (38.8% of 2025 total),
              advertising spend, and fulfillment fees. Musinsa occupies a structurally complex dual role—it is
              simultaneously the marketplace host enabling those brands and the operator of Musinsa Standard, a
              competing private-label brand that is now the most-purchased fast-fashion label among Koreans aged 19–29.
              This tension is a key customer-relationship risk addressed in the concentration section.


              International buyers from 130+ countries entered the Musinsa ecosystem in 2025, with the top five source
              markets—China (19%), Taiwan (18%), Japan (13%), United States (12%), and Singapore (6%)—accounting for
              more than two-thirds of global platform buyers. Younger MZ consumers represent approximately 80% of all
              international buyers, mirroring the domestic age profile.
