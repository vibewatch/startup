      - number: '2.5'
        title: Cross-Border, Global Expansion, and K-Fashion Export Market
        blocks:
          - type: paragraph
            body: >-
              The cross-border dimension of Musinsa's market opportunity is both the highest-growth vector and the most
              uncertain. Korean firms' overseas online fashion sales reached a record ₩3.0 trillion ($2.1 billion) in
              2025, up 16.4% year-on-year and marking three consecutive years of double-digit growth. Exports to the
              United States rose 26.3% in 2025; China and Southeast Asia remain strong. Musinsa's own global store GMV
              rose more than 48% in Q1 2026, and exports from its platform surged approximately 11.9 times year-on-year
              to ₩15.3 billion in Q1 2026 alone, representing 4.2% of quarterly revenue (up from 0.44% a year earlier).

              The company targets ₩3 trillion in overseas transactions by 2030. Cumulative global business transactions
              reached ₩240 billion by early 2026, anchored by Japan and China. Musinsa's Japan pop-up stores—including a
              17-day Media Department Tokyo event in April 2026 carrying 79 Korean brands—demonstrate real consumer
              demand: an October 2025 predecessor event drew 82,000 visitors in 24 days and lifted participating brand
              sales 3.5 times. The December 2025 Musinsa Standard Shanghai flagship (1,400 sqm on Huaihai Road, 500,000
              daily commuters) opened to immediate strong demand.

              The Korean government reinforces this trajectory: a 2026 program injects ₩47.1 billion annually to support
              cross-border e-commerce SMEs with customs, certification, logistics, and digital integration. This is a
              structural tailwind for Musinsa's 10,000-brand export infrastructure, as smaller brands cannot
              independently absorb cross-border logistics complexity.

              The international TAM is structurally large but conversion is uneven. Korea ranked 7th globally in fashion
              exports at $32.1 billion in 2023; the top five export destinations are U.S. (32%), China (18%), Japan
              (11%), Germany (7%), and the UK (5%). However, the global K-fashion addressable share for Musinsa's
              specific platform model is unknown; no analyst has published a cross-border SAM for Musinsa's global
