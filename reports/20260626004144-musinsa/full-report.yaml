      - number: '5.5'
        title: Trust, Safety, Privacy, and Compliance
        blocks:
          - type: paragraph
            body: >-
              Musinsa's compliance baseline is anchored in South Korea's Personal Information Protection Act (PIPA). The
              company revised its Global Store Terms of Service and Privacy Policy effective April 17, 2026 and notified
              all users at least 30 days in advance via website posting and direct email/SMS, consistent with PIPA
              Article 3 requirements. The published privacy policy covers data collection purposes (membership
              management, service execution, payment processing, and marketing), user rights (access, correction,
              deletion, restriction, and objection), and cross-border data transfer safeguards. PIPA's 2026
              amendments—authorising fines of up to 10 percent of total revenue for severe or repeated data breaches
              affecting 10+ million users—represent a material compliance exposure for Musinsa given its 16+ million
              membership base. A mandatory ISMS-P (Information Security Management System–Privacy) certification becomes
              required for qualifying companies by July 1, 2027; whether Musinsa is preparing is unconfirmed. On product
              quality, Musinsa signed MOUs with Korea's top three fashion testing and certification institutions in
              March 2025 for Musinsa Standard product validation. On resale authenticity, Soldout publicly states a 300%
              compensation guarantee for counterfeit items delivered after authentication—a company-claimed figure
              without a disclosed audit trail. On sustainability, Musinsa published a greenwashing guide in March 2026,
              though enforcement mechanisms against partner brands are unspecified. The international privacy surface is
              maturing: the Global Store privacy policy addresses cross-border data transfers (relevant for Japan and
              China operations), but the depth of data-localisation compliance in those jurisdictions is not publicly
              documented.
            claimRefs:
