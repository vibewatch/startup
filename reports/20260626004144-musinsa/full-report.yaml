chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and operating model
        blocks:
          - type: paragraph
            body: >
              Musinsa Co., Ltd. is South Korea's largest online fashion marketplace and the dominant gateway through
              which over 10,000 Korean fashion labels—spanning streetwear, contemporary, minimalist, and designer
              categories—reach domestic and international consumers. The company was founded in 2001 by Cho Man-ho in
              Seoul as an online sneaker enthusiast community whose full name, "Mujinjang Sinbal Sajin-i Maneun Got,"
              translates loosely as "a house of sneaker photos"; the abbreviation Musinsa became the brand. Musinsa.com
              launched in 2003 as an editorial magazine covering Seoul street fashion, and the e-commerce store opened
              in 2009 on a single founding principle: only authentic products, only brands you cannot find elsewhere.
              Incorporation as a corporate entity followed in 2012.


              The company's registered headquarters is Gangnam-gu, Seoul, South Korea. As of mid-2026, Musinsa operates
              as a holding entity that consolidates the main Musinsa fashion platform, the women's and lifestyle-focused
              29CM brand, the Solid Out sneaker-resale channel, the private-label Musinsa Standard chain, and the
              international Musinsa Global Store serving 13 regions including the United States, Japan, Singapore, and
              Australia. The business model is a hybrid: commission revenue on partner brand sales (38.8% of 2025
              total), direct product and Musinsa Standard sales (30.8%), and fulfillment, advertising, and ancillary
              services (30.4%). This three-sided economics structure distinguishes Musinsa from a pure marketplace and
              anchors durable margin as scale grows. The stage is late-stage private; the company is a recognized
              unicorn and has initiated the IPO process with KOSPI as primary listing target.
