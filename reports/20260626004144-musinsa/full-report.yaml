  - id: FO001
    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      Musinsa's 25-year trajectory from Korean sneaker forum to pre-IPO fashion unicorn, including financing
      inflections, product pivots, and adverse events.
    data:
      items:
        - date: '2001'
          label: Founded as sneaker community
          detail: Cho Man-ho creates "Musinsa" online forum for Korean sneaker enthusiasts.
          tone: positive
        - date: '2003'
          label: Musinsa.com editorial launch
          detail: Platform expands to general street-fashion editorial; founder photographs Seoul fashion weekly.
          tone: positive
        - date: '2009'
          label: E-commerce store opens
          detail: Musinsa Store launched; authentic-only curation principle established.
          tone: positive
        - date: '2012'
          label: Corporate incorporation
          detail: Formal entity established; self-funded profitability begins.
          tone: positive
        - date: 2019-11
          label: Series A — unicorn at $800M
          detail: Sequoia Capital leads KRW ~100B round; first external capital.
          tone: positive
        - date: 2021-03
          label: Series B — $2.2B valuation
          detail: Peak XV and IMM invest KRW ~130B; first offline store opened.
          tone: positive
        - date: '2022'
          label: Global Store launched
          detail: International expansion to 13 regions begins; global GMV growing >260% CAGR.
          tone: positive
        - date: 2023-07
          label: Series C — KKR leads at $2.4B
          detail: KKR and Wellington invest KRW ~200B; KKR's first Korea tech growth deal.
          tone: positive
        - date: '2024'
          label: Revenue crosses KRW 1T; profitable
          detail: Consolidated revenue KRW 1.24T (+25.1% YoY); operating profit KRW 102.8B.
          tone: positive
        - date: 2025-04
          label: EQT secondary at KRW 4T
          detail: European PE giant buys shares from early VCs at 15% premium to Series C.
          tone: positive
        - date: 2025-08
          label: IPO process initiated
          detail: RFPs sent to global and domestic banks; KRW 10T valuation targeted.
          tone: neutral
        - date: 2025-12
