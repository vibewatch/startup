  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              Musinsa's primary market is South Korea's online fashion and streetwear e-commerce ecosystem—a segment
              defined here as the digital retail of apparel, footwear, accessories, and adjacent lifestyle goods
              (beauty, sports, home) to domestic Korean consumers, with a secondary cross-border dimension serving
              global K-fashion demand. This definition excludes: luxury department-store channels (Hyundai, Shinsegae,
              Lotte), offline mass apparel retail (e.g., Uniqlo Korea, H&M Korea), pure-play secondhand/resale C2C
              platforms (당근마켓, Bunjang), and the wholesale or B2B segment that connects Korean brands to foreign
              distributors directly. While Musinsa operates verticals that touch several of these adjacencies—SoldOut
              handles sneaker resale, 29CM covers lifestyle design goods—the core investment thesis concerns the curated
              fashion marketplace business.

              The streetwear and contemporary menswear segment is Musinsa's founding domain and still its largest single
              category by GMV, though the platform has expanded into women's fashion, beauty, sports, and kids over
              2022–2026. The relevant buyer is a Korean consumer aged 18–35 who treats Musinsa as a discovery and
              purchasing platform for Korean independent brands—labels that lack their own national distribution
              infrastructure and depend on Musinsa's editorial content, logistics network, and member community for
              demand generation.

              Adjacent markets with meaningful overlap include: (1) social and live commerce (Naver Shopping Live, Kakao
              Style), where fashion is a leading category; (2) Korean fashion export/cross-border platforms serving
              global K-fashion demand in Japan, China, Southeast Asia, and North America; and (3) beauty e-commerce,
              where Musinsa's 2026 offline-store strategy (Mega Store Seongsu) deliberately blurs the boundary between
              fashion and beauty retail. These adjacencies expand the addressable opportunity but also bring new
              competitors into Musinsa's segment.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM036
