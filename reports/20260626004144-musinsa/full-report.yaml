          - type: callout
            title: International Expansion as the Key Growth Lever
            body: >-
              With domestic MAU growth decelerating to 8.5% YoY, Musinsa's KRW 3 trillion global GMV target by 2030
              (~12× current global store GMV) is the primary upside driver. The K-fashion tourism virtuous cycle—Korean
              store visits generating global online demand—is a differentiated acquisition mechanism absent from most
              Western fashion platforms.
