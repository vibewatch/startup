      - number: '8.5'
        title: Exit readiness and IPO mechanics
        blocks:
          - type: paragraph
            body: >
              Musinsa is operationally IPO-ready in several key respects as of June 2026. The four-bank underwriting
              syndicate (Korea Investment & Securities, KB Securities, Citi, JPMorgan) was finalized December 2025, and
              the company has disclosed that it will file for KOSPI preliminary review as early as Q3 2026. The co-CEO
              structure (Park Jun-mo + Jo Nam-sung) and independent board (three outside directors) align with KOSPI
              listing requirements. The company selects DART as its primary disclosure regime, filing quarterly and
              semi-annual reports, which improves institutional investor diligence access.

              IPO structural risks are non-trivial. The KRW 2T+ public float required at the KRW 10T target is
              substantial; domestic precedents are cautionary. DN Solutions (KRW 4–5T target) raised only KRW 1T in its
              public offering; Lotte Global Logistics (KRW 500B) withdrew due to weak demand. Musinsa's management is
              aware that domestic markets alone cannot absorb a KRW 2T float, hence the global underwriters—but this
              increases dependence on international institutional demand for a K-fashion story that most global LPs have
              no research coverage on.

              Preference and dilution overhang: RCPS conversion mechanics matter for public investors. If preferred
              shareholders convert at the IPO price, the diluted share count increases. If the IPO price is below the
              conversion threshold, preference holders may exercise redemption rights rather than convert, putting cash
              pressure on the company. Diligence must confirm conversion terms, redemption rights, and whether any
              liquidation preferences affect public shareholder economics.

              The EQT secondary transaction (April 2025, KRW 4T) established a recent market- clearing price from a
              sophisticated institutional buyer. EQT's reported consideration of a follow-on investment after the
              secondary also signals continued conviction at the KRW 4T level. For pre-IPO secondary entry, KRW 4T
              remains the evidence-based anchor; above KRW 5T, the investor is buying optionality on the bull case with
              limited margin of safety.
            claimRefs:
