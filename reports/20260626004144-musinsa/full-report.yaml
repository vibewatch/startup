      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and SOM'
        blocks:
          - type: paragraph
            body: >-
              Multiple analyst lenses converge on a South Korean total fashion market of approximately ₩52.3 trillion
              ($38B at 2023 exchange rates), growing to an estimated ₩62 trillion by 2027 at a 5-year mid-single-digit
              CAGR. The online fashion segment—Musinsa's core addressable market—represented approximately 38% of total
              domestic fashion sales in 2023, equivalent to roughly $14–17 billion, with online channels growing faster
              than the market as a whole (online up 12%, offline down 5% in 2023). Statista projects the Korean
              e-commerce fashion segment reaching approximately $13.7 billion in 2025 apparel revenues alone, growing to
              $22 billion by 2034 at a CAGR of 5.44%.

              Methodological conflicts among published estimates are material and preserved here: Gitnux cites a total
              Korean fashion market of ₩62 trillion (~$45B) by 2027 using a broader definition that includes beauty
              accessories, while Statista's online-only apparel number ($13.7B in 2025) uses a narrower definition
              excluding footwear and accessories. ECDB tracks Musinsa's annual GMV at $2.531 billion in
              2025—considerably lower than Musinsa's company-reported $3.3 billion GMV for 2024, a discrepancy
              attributable to methodological differences in 1P vs. 3P attribution and currency conversion timing.
              Neither figure is independently verified through audited disclosure.

              For Musinsa's SAM, the best available proxy is the online Korean streetwear and contemporary fashion
              segment for the 18–35 demographic: an estimated $5–8 billion annually in 2025, derived by applying
              Musinsa's reported ~38% online-fashion-market share claim to the $14–17B online TAM. The SOM—Musinsa's
              actual platform GMV—was approximately $3.3 billion on a company-reported basis in 2024, suggesting a
              20–25% share of a $13–17B online fashion TAM. These are author-constructed estimates; no independent
              analyst firm publishes a Musinsa-specific SAM.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
