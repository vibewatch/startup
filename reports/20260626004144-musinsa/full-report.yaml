      - number: '3.3'
        title: Global Platforms and Substitute Threats
        blocks:
          - type: paragraph
            body: |
              Global fashion platforms and ultra-fast fashion retailers represent substitute and displacement
              threats that differ structurally from domestic Korean competitors. Shein is the most acute threat:
              its Korean monthly active users grew from 670,000 in early 2025 to surpass Queenit's MAU by
              November 2025, powered by dresses priced at ₩10,000–₩20,000, TikTok-amplified marketing, and
              a global trend-response engine. Globally, Shein gained 1.1 percentage points of apparel market
              share in 2024–2025 while Zara lost 0.3 points and H&M lost 0.6 points. Zara and H&M remain
              present in Korea but are repositioning upmarket, ceding the mass-fashion space. Farfetch entered
              liquidation in February 2024 and was acquired by Coupang for $500 million; it now operates in
              Korea as a Coupang-integrated luxury channel, reducing its independence as a competitive force.
              SSENSE sought creditor protection under Canada's CCAA in 2025 amid the structural collapse of the
              multi-brand luxury retailer model — driven by luxury brands tightening direct-to-consumer channels
              — and now faces operational constraints in Korea. StockX competes in the authenticated limited-
              edition resale niche that Musinsa addresses through KREAM and Soldout; StockX's global platform
              advantage is the primary threat in the secondary-market segment. The collapse of several global
              luxury multi-brand platforms (Farfetch, SSENSE, MatchesFashion, YNAP) reduces the addressable
              competition Musinsa faces at the high end, but it also illustrates the difficulty of scaling
              multi-brand fashion commerce profitably — a risk Musinsa itself confronts as it internationalizes.
