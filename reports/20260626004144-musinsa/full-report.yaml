      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - KFTC structural remedy
        - KFTC orders Musinsa to remove exclusivity clauses or allows parallel listing on competing platforms
        - >-
          Supply-side moat weakens; brands lose MFS dependency; multiple compresses from platform premium to retailer
          multiple
        - Exit or reduce position; re-model at EV/Sales 1.5–2× rather than 3×+
      - - IPO prices below KRW 4.5T
        - KOSPI listing prices <KRW 4.5T (EV/Sales <3.1×)
        - >-
          Market has rejected growth premium; signals that institutional demand cannot support the narrative at base
          case
        - Reassess entry at <KRW 3.5T with confirmed KFTC resolution
      - - International GMV fails to ramp
        - International GMV still <2% of total by H2 2026 despite China/Japan store openings
        - >-
          Bull-case revenue assumption invalid; growth story reverts to domestic Korea only; cap multiple at Naver
          EV/Sales
        - Reduce conviction; monitor two more quarters before any entry
      - - RCPS redemption rather than conversion
        - Any RCPS tranche exercises redemption at IPO rather than converting to equity
        - Cash drain, dilution, and potential balance-sheet distress at IPO lock-up expiry
        - Hard pass; RCPS terms must be public before any entry
      - - Operating margin compression below 6%
        - Two consecutive quarters of operating margin <6% in 2026–2027
        - Thesis that MFS platform generates operating leverage is broken; may signal brand pricing power shifting
        - Exit; re-evaluate only after structural fix or CEO change
      - - China Anta JV exit or write-down
        - Musinsa announces exit from Anta JV or writes down China investment within 18 months
        - China optionality—a key bull premium driver—disappears; international GMV growth collapses
        - Bear case becomes base; target KRW 2.5–3.5T range
