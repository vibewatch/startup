      - number: '4.4'
        title: Capital structure, funding, and IPO readiness
        blocks:
          - type: paragraph
            body: >
              Musinsa has raised approximately KRW 430B (~$474M) in three disclosed primary equity rounds since 2019.
              Series A (Nov 2019, ~KRW 100B, Peak XV at ~$800M valuation), Series B (Mar 2021, ~KRW 130B, Peak XV + IMM
              at ~$2.2B valuation), and Series C (Jul 2023, KRW 200B/$190M, KKR + Wellington at ~KRW 3.5T/$2.4B
              valuation). The April 2025 EQT transaction (~KRW 20B) was a secondary share purchase from early investors
              at a valuation implying ~KRW 4T, providing a secondary market mark but no new equity capital to the
              company.


              The capital structure was significantly altered by an H1 2025 K-IFRS accounting change: the company
              reclassified its Redeemable Convertible Preferred Shares (RCPS) from equity to financial liabilities,
              adding approximately KRW 736B to the debt side. This inflates the reported debt-to-equity ratio to
              approximately 620%, but the underlying operating leverage (net of RCPS) is more moderate at roughly
              100–150%. The non-cash RCPS interest charge (~KRW 40B per half-year) depresses reported net income and is
              the primary reason the KRW 140.5B 2025 operating profit compressed to KRW 7.7B at the net level. RCPS will
              convert or be redeemed at IPO, eliminating this line item post-listing.


              Cash and short-term financial assets stood at approximately KRW 462B (~$323M) as of mid-2025 per the H1
              2025 semi-annual DART filing, providing comfortable liquidity for continued operations and offline
              expansion. Estimated annual operating cash generation (excluding working capital swings) is approximately
              KRW 200–250B based on EBITDA of KRW 248B in 2025 and moderate capex.


              IPO process: Musinsa filed a preliminary listing review application with the Korea Exchange (KRX) in July
              2025 targeting KOSPI. In December 2025, the company selected Korea Investment & Securities and KB
              Securities as domestic lead managers, with Citi Global Markets Securities and JP Morgan as foreign
              co-underwriters. The company targets a market capitalization of KRW 10T (~$7.4B), implying an IPO raise of
              KRW 2T+. Mirae Asset Securities, initially shortlisted, voluntarily withdrew from the underwriting PT in
              November 2025, with IB sources attributing the withdrawal to disagreement over the KRW 10T valuation.
              Market consensus estimates place fair value at KRW 4–7T, supported by PER analysis (KRW 10T = 143x 2024
              earnings vs. sector avg 29x) and PSR comparisons (KRW 10T = ~7x 2025 revenue vs. Coupang's 3.5x at NYSE
              debut).
