      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Mirae Asset withdrawal is an unusually strong adverse signal
            body: >-
              It is rare for a major Korean domestic underwriter that has been shortlisted to decline to present at the
              final IPO round. Mirae Asset Securities, one of Korea's largest IB franchises, withdrew from the Musinsa
              IPO presentation in November 2025 specifically because management concluded the KRW 10T target was
              excessively high. This is a direct adverse signal from a sophisticated institutional actor with deep
              familiarity with the KOSPI IPO market. Investors should weight this signal heavily.
            calloutType: risk
            claimRefs:
              - CV008
              - CV015
              - CV037
          - type: callout
            title: Operating margin of 9.6% is best-in-class for a fashion marketplace at this scale
            body: >-
              Among global fashion marketplace comparable companies, a 9.6% operating margin on KRW 1.47T revenue is
              unusually strong. Zalando operates at <2% adjusted EBIT margins; Farfetch was loss-making until delisting.
              Musinsa's three-pillar model (commission + private label + merchandise) generates above-sector margins
              because the commission line carries near-zero incremental cost. If international scale delivers revenue
              growth without proportionate cost increase, the margin has genuine expansion potential.
            calloutType: strength
            claimRefs:
              - CV017
              - CV027
              - CV028
          - type: callout
            title: Valuation methodology uses EV/Operating Profit to avoid RCPS distortion
            body: >-
              Net income multiples (PER) are misleading for Musinsa due to the RCPS reclassification generating a
              non-cash interest charge that produces a net loss at the standalone level even when operating profit is
              healthy. All scenario valuations in this chapter use EV/Operating Profit as the primary multiple,
              cross-checked against EV/Revenue for comparability with peers. Analysts and media citing the 143× PER are
              correct numerically but should note this includes the RCPS accounting distortion.
            calloutType: assumption
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV015
