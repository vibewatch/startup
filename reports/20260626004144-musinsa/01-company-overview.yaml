  - id: section-2
    title: Governance, leadership, and key-person risk
    body: >
      Musinsa's founding CEO Cho Man-ho (Manho Cho) remains the central executive and public face of the company and
      is the only fashion-platform chief executive on The Business of Fashion BoF 500 Class of 2025, described by BoF
      as an "innovative leader who is driving the global expansion of K-fashion by leveraging Korea's cultural influence
      and establishing a new fashion business model that integrates technology and community." His continued involvement
      is material: he built the community from a high-school project, cultivated every institutional investor relationship
      through three funding rounds, and anchors the brand's credibility with the 10,000+ partner labels whose growth is
      tied to Musinsa's platform.


      In December 2025, Musinsa adopted a formal co-CEO governance structure, appointing Cho Nam-sung as co-CEO
      responsible for internal support functions (legal, finance, HR, and PR), while Cho Man-ho retains leadership over
      business operations, product, and global strategy. Park Jun-mo, who served as co-CEO leading global expansion
      from at least 2024, transitioned to an advisory role in January 2026. The restructuring introduced a full C-suite
      tier—CCO, CBO, CGO, CTO, CFO, CLO, CPRO, and CDeO—with each role carrying area-specific autonomy and annual
      performance evaluations. This is a governance step toward IPO readiness, but the board composition and investor
      governance rights are not publicly disclosed for this private company. Key-person risk on Cho Man-ho is material:
      if he departed or became unavailable, the platform's brand positioning, investor confidence, and partnership
      ecosystem would face disruption without an obvious successor of comparable founder credibility.
    claimRefs:
      - CO015
      - CO016
      - CO017
      - CO018
    tableRefs:
      - TO002
  - id: section-3
    title: Capital base, funding history, and investor map
    body: >
      Musinsa has raised approximately KRW 430 billion (~$474 million) across three formal funding rounds since 2019,
      all structured as primary equity raises, while EQT completed a secondary share acquisition in April 2025 at
      a ~KRW 4 trillion ($2.8 billion) valuation. The funding sequence is: Series A in November 2019 (KRW ~100B from
      Sequoia Capital, unicorn at $800M valuation), Series B in March 2021 (KRW ~130B from Peak XV Partners and IMM
      Investment, valuation ~$2.2B), and Series C in July 2023 (KRW ~200B led by KKR with Wellington Management, 
      valuation KRW ~3.5T or ~$2.4B). The Series C was KKR's first technology growth investment in Korea.


      The April 2025 EQT secondary transaction—structured as a KRW 20–30B acquisition of shares from early Korean
      venture investors—raised the implied valuation to approximately KRW 4T, roughly 15% above the 2023 Series C
      price. EQT Growth, operating from its Hong Kong office, is the vehicle and is reportedly considering follow-on
      investment. The investor map is concentrated in institutional PE and growth equity: KKR, Wellington, Peak XV,
      IMM, and EQT all hold stakes with material governance expectations ahead of the IPO. The full cap table, share
      preferences, anti-dilution rights, and voting mechanics remain undisclosed. Total primary capital raised from
      external investors is KRW 430 billion; secondary transactions and any secondary-market pricing between rounds are
      not fully documented in public sources. Founder and management ownership dilution is unquantified.
    claimRefs:
