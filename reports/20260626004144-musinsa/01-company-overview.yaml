callouts:
  - calloutType: strength
    title: Profitable platform at scale ahead of IPO
    body: >-
      Musinsa crossed KRW 1 trillion in revenue and turned operating-profitable in 2024, then accelerated further in
      2025 with 18.1% revenue growth and 36.7% operating-profit growth. This profitability trajectory removes a major
      IPO objection and supports the company's case for a premium listing multiple.
    claimRefs:
      - CO024
      - CO025
      - CO036
  - calloutType: risk
    title: Valuation gap between secondary mark and IPO target is a structural risk
    body: >-
      The EQT secondary values Musinsa at KRW 4T (~$2.8B), while the company targets a KRW 10T IPO listing—a 2.5x
      premium to the most recent arm's-length transaction. The implied PER of 143–160x far exceeds comparable KOSPI
      listings and caused Mirae Asset to withdraw. This gap must be bridged through investor education or a
      revised valuation target; failure to close the gap risks a pulled or delayed IPO.
    claimRefs:
      - CO012
      - CO014
      - CO032
      - CO033
