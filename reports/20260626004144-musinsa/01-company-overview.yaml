  - id: section-4
    title: Milestones, expansion, adverse events, and IPO chronology
    body: >
      Musinsa's 25-year public chronology is unusually clean for a Korean fashion unicorn: no bankruptcy events,
      no major ownership disputes, and no governance scandal of the type that plagued other Korean internet
      companies. The company self-financed from 2012 to 2019 without external capital while maintaining operating
      profitability, then scaled aggressively after the Sequoia investment. Key milestones include: the 2017 launch
      of Musinsa Standard (the private-label brand), which crossed KRW 100B in revenue by 2020; the 2021 opening of
      the first physical Musinsa Standard store near Hongik University; the 2022 launch of the Musinsa Global Store
      in 13 international regions; and the 2024 inflection at which the company crossed KRW 1 trillion in annual
      consolidated revenue for the first time while swinging to an operating profit of KRW 102.8B after a narrow
      KRW 8.6B operating loss in 2023.


      The IPO chronology is: August 2025—Musinsa distributed RFPs to domestic and global investment banks targeting
      a KRW 10 trillion (~$7.4B) listing valuation. November 2025—Mirae Asset Securities, the leading domestic
      candidate, withdrew from the underwriter presentation, signaling valuation skepticism (the target implies a
      PER of ~143–160x on 2024–2025 earnings, far above KOSPI comparables). December 2025—Musinsa finalized
      underwriters: Citi Global Markets (lead global), JPMorgan (co-lead global), Korea Investment & Securities,
      and KB Securities (domestic). May–June 2026—the company is preparing a preliminary listing review
      application targeting a 2026 filing.


      Two adverse events emerged in early 2026. First, a label-switching scandal: Musinsa suspended sales of brands
      found to have misrepresented material composition and product origins, but was criticized for failing to issue
      a direct consumer apology, raising platform-oversight concerns ahead of the IPO. Second, the Korea Fair Trade
      Commission (KFTC) conducted an on-site inspection of Musinsa in April 2026 for potential violations of the
      Large Retail Business Act in its supplier dealings—following similar inspections of Olive Young and Daiso.
      Neither event has resulted in a formal sanction as of the run date, but both represent live regulatory and
      reputational diligence items.
