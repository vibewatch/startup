  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: board-governance
      missingEvidence: >-
        Full board composition including investor-appointed directors, independent directors, reserved matters, and
        governance rights attached to KKR, Wellington, and EQT stakes.
      whyItMatters: >-
        Without board composition and control rights, it is impossible to assess governance risk, anti-dilution
        mechanics, or investor drag-along provisions relevant to the IPO pricing and process.
      diligencePath: >-
        Request investor rights agreements, board minutes, and governance schedule from Musinsa data room;
        verify against FSS filings if company proceeds with KOSPI listing.
      relatedQuestionRefs:
        - QO017
      relatedTableRefs:
        - TO002
    - type: private-evidence-only
      severity: material
      topic: cap-table
      missingEvidence: >-
        Full capitalization table including founder dilution, management equity pool, secondary sales since Series B,
        and preference structure for Series A/B/C and EQT.
      whyItMatters: >-
        The IPO valuation target, economic interests of existing holders, and potential for overhang selling cannot
        be assessed without a verified cap table. The gap between EQT secondary mark (KRW 4T) and IPO target (KRW 10T)
        could hide preference structures that inflate headline valuation.
      diligencePath: >-
        Obtain capitalization table from the data room; request preference waterfall analysis from legal counsel;
        review FSS registration statement when filed.
      relatedQuestionRefs:
        - QO006
      relatedTableRefs:
        - TO003
    - type: enumeration-incomplete
      severity: minor
      topic: brand-catalog
      missingEvidence: >-
        Full enumeration and revenue-weighted breakdown of the 10,000+ brands on the Musinsa platform, including
        top-brand concentration, exclusivity terms, and churn rate.
      whyItMatters: >-
        Platform moat depends on brand depth and exclusivity; a small cohort of top brands driving most GMV would
        signal high concentration risk not visible in aggregate figures.
      diligencePath: >-
        Request brand-level GMV contribution data and top-brand concentration analysis from the Musinsa data room.
      relatedQuestionRefs:
        - QO022
    - type: access-blocked
      severity: minor
      topic: regulatory
      missingEvidence: >-
        Full text of KFTC inspection scope, the specific Large Retail Business Act provisions cited, and any interim
        KFTC findings or remediation demands.
      whyItMatters: >-
        If the KFTC inspection results in a fine or structural remedy (e.g., mandatory reporting, supplier pricing
        changes), it could increase compliance costs and affect IPO timing.
      diligencePath: >-
        Retrieve KFTC press release or official notice; request legal counsel summary of KFTC proceeding status.
      relatedQuestionRefs: []
      relatedTableRefs:
        - TO004
    - type: private-evidence-only
      severity: minor
      topic: headcount
      missingEvidence: >-
        Official Musinsa employee count and department-level breakdown; current third-party workforce estimate
        (Revelio Labs) is unconfirmed by the company.
      whyItMatters: >-
        Headcount supports operating-leverage and burn-rate analysis needed for IPO valuation and staffing-cost
        modeling in the financials chapter.
      diligencePath: >-
        Request official HR headcount data from the Musinsa data room or confirm via DART/FSS filings.
      relatedQuestionRefs: []
