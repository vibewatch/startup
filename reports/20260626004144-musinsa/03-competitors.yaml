callouts:
  - calloutType: strength
    title: "Brand Ecosystem Is the Structural Moat"
    body: >-
      Musinsa's 10,000-brand ecosystem, built over two decades of editorial investment and brand
      incubation, cannot be replicated quickly by logistic-first platforms like Coupang or by boutique
      aggregators like Ably. The average 40% annual GMV growth of 29CM since acquisition demonstrates
      that this curation moat extends to subsidiaries. Brands that originated on Musinsa now arrive in
      Tokyo and Shanghai with pre-built demand, reducing their CAC in new markets and reinforcing the
      flywheel.
    claimRefs: [CP004, CP007, CP028]

  - calloutType: risk
    title: "KFTC Investigation and Multi-Homing Erode Supply-Side Lock-In"
    body: >-
      The Korea Fair Trade Commission's investigation of Musinsa for alleged anti-competitive exclusivity
      practices — raiding headquarters twice in 2024 and 2026 — represents a direct threat to the
      supply-side lock-in mechanism that underlies Musinsa's moat. As brands accelerate multi-homing
      to Naver and Coupang for distribution reach, the exclusive channel dependency that gave Musinsa
      pricing power over brands is structurally eroding, potentially reducing per-brand commission leverage.
    claimRefs: [CP035, CP036, CP037, CP041]

  - calloutType: risk
    title: "Shein Commoditization and IPO Skepticism"
    body: >-
      Shein's rapid Korean MAU growth from 670K to surpassing Queenit in 2025 signals that ultra-low
      pricing is reshaping consumer tolerance for fashion quality. Analysts question whether Musinsa's
      ₩10T ($7.4B) IPO target at ~143x trailing earnings is achievable given KFTC exposure, China
      execution risk from the Anta JV, and an eroding brand exclusivity advantage, making the IPO
      pricing range itself a key near-term signal to watch.
    claimRefs: [CP022, CP038, CP039, CP042]

