  topStrengths:
    - 韩国时尚 marketplace 绝对领先，注册会员超过 16M、合作品牌超过 10,000 个。
    - 经营杠杆已被验证：2024 年跨过盈利线后，FY2025 收入 KRW 1.47T、营业利润 KRW 140.5B。
