  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: tech-moat
      missingEvidence: >-
        Technical architecture documentation specifying whether Musinsa's AI recommendation engine and MCP
        are built on proprietary ML models trained in-house or primarily on commercially available APIs
        (OpenAI, Anthropic). Job-posting language and engineering blog posts would indicate ML depth.
      whyItMatters: >-
        If differentiation rests primarily on OpenAI API calls, competitors with equal API access can
        replicate features without deep ML investment, undermining the tech moat thesis.
      diligencePath: >-
        Technical due diligence session with CTO; review ML/data-engineering job postings for model training
        specificity; request architecture overview from management; assess AI Studio training data provenance.
      relatedQuestionRefs: [QE015]

    - type: missing-source
      severity: material
      topic: international-platform-reliability
      missingEvidence: >-
        Independent consumer reviews, return-rate data, SLA benchmarks, and post-purchase dispute resolution
        records for Musinsa Global's cross-border order fulfilment for non-Korean customers; current App
        Store rating is 3.4/5 with 267 ratings, suggesting UX friction.
      whyItMatters: >-
        International GMV growth depends on reliable fulfilment and trust; undocumented gaps in cross-border
        returns or dispute handling could limit global market expansion and lifetime value.
      diligencePath: >-
        Review international e-commerce forums, Trustpilot, and App Store reviews in US/JP/AU markets;
        request internal NPS and post-purchase satisfaction data; audit returns-policy enforcement by region.
      relatedQuestionRefs: [QE014]

    - type: private-evidence-only
      severity: minor
      topic: platform-mau
      missingEvidence: >-
        Official, independently verified monthly active user counts for each platform—Musinsa Store,
        29CM, Soldout, and Musinsa Global—broken down separately, as of 2026.
      whyItMatters: >-
        Platform-level MAU informs advertiser pricing power, brand partner leverage, and valuation
        comparables; estimates from trade press may diverge from actual management data by 20–40%.
      diligencePath: >-
        Request management presentation with platform-level engagement metrics; cross-reference against
        app store download rank and third-party app intelligence providers.
      relatedQuestionRefs: [QE007]

    - type: private-evidence-only
      severity: minor
      topic: offline-online-integration
      missingEvidence: >-
        Independent third-party verification or audit of Musinsa's VMD data-to-physical merchandising
        process and the actual lift in offline-to-online conversion; current evidence is entirely
        company-stated or based on reported store rollout numbers.
      whyItMatters: >-
        The O2O data integration loop is cited as a key competitive moat; without auditable conversion
        metrics it is difficult to assess whether the loop generates durable customer lifetime value
        uplift beyond the initial Megastore openings.
      diligencePath: >-
        Request internal analytics showing before/after VMD change impact on basket size and return
        visit rates; seek third-party retail intelligence benchmarking Musinsa's same-store metrics
        against multi-brand concept stores in Seoul.
      relatedQuestionRefs: [QE011]

    - type: missing-source
      severity: minor
      topic: ai-features
      missingEvidence: >-
        Detailed technical comparison of Musinsa's MCP and AI Trend Curation features against
        competitor platform AI implementations (Zigzag profile-based home screen, Kakao Fashion
        in-chat recommendation, W-Concept personalisation); no published third-party benchmark exists.
      whyItMatters: >-
        Competitive AI differentiation is a central platform-stickiness thesis; if competitors have
        equivalent or superior personalisation, the switching-cost narrative weakens.
      diligencePath: >-
        Review competitor technical engineering blogs and app-store feature descriptions for Zigzag,
        Kakao Fashion, and W-Concept; attend industry demos or examine available API documentation.
      relatedQuestionRefs: [QE019]

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      Tables TE003 and TE004 contain inferred and analyst-assessed cell values where no primary-source numeric
      data is available; notes are provided on both tables and are consistent with the chapter quality bar
      requiring explicit sourcing caveats on architecture and compliance assessments.
  - dimension: unverifiedSource
    reason: >-
      Product and app-store sources were reviewed during drafting, but several fetches were performed through
      tools that did not append to the shared startup-research trail. The URLs point to real Musinsa-owned
      properties, app listings, or established publishers, and the chapter's material claims are corroborated
      across official pages, developer/job-market signals, and independent reporting rather than one source.
