      models or commercially available API calls—if the latter, competitor parity is achievable without deep ML
      investment. (2) Musinsa's 16M+ membership base creates a 10%-of-revenue PIPA fine exposure under 2026
      amendments; whether ISMS-P certification preparation is underway is not publicly disclosed.
    claimRefs: [CE034, CE008, CE021]

