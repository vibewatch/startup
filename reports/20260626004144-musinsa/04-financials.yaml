      severity: material
      topic: commission-rate
      missingEvidence: >-
        Per-category commission rate schedule and historical rate trend are not publicly disclosed. The 15–30%
        range is confirmed from news sources but the specific rate per category and any promotional subsidy
        arrangements require seller-facing platform documentation.
      whyItMatters: Take-rate trend determines whether commission revenue growth reflects volume or pricing power.
      diligencePath: Obtain seller-facing commission rate documentation and historical rate change log from data room.
      relatedQuestionRefs:
