company:
  name: Musinsa
chapter:
  number: 4
  title: Financials
  summary: >-
    Musinsa crossed KRW 1T revenue and achieved its first operating profit in 2024 (KRW 102.8B, 8.3% margin), then
    accelerated to KRW 1.47T revenue and KRW 140.5B operating profit (9.6% margin) in 2025. GMV reached KRW 4.5T
    (~$3.3B) in 2024 with an implied take rate of ~27.6%. The revenue model is a three-pillar hybrid: commission
    (~39%), direct product (~31%), and merchandise (~27%). Capital structure is distorted by a ~KRW 736B RCPS
    reclassification as debt in 2025, but the underlying operating leverage is real. IPO targeting KRW 10T (~$7.4B)
    faces a contested 143x PER and Mirae Asset's withdrawal over valuation, creating the chapter's central diligence
    blocker. Q1 2026 revenue of KRW 363.6B (+24.1% YoY) and Q1 operating profit of KRW 19.0B (+8.2%) sustain
    growth momentum, though net income is distorted by non-cash RCPS financing charges.
sections:
  - id: section-1
    title: Revenue model, streams, and pricing
    body: >
      Musinsa operates a three-pillar revenue model that distinguishes it from a pure marketplace: (1) Commission
      revenue from the core Musinsa platform and the women-focused 29CM marketplace, where brands pay 15–30%
      commission depending on product category; (2) Product revenue from direct-to-consumer Musinsa Standard
      private-label sales across 34+ offline stores and online channels; and (3) Merchandise (MD) revenue from
      curated brand distribution where Musinsa buys inventory and resells. A fourth ancillary stream—advertising,
      fulfillment, and data services—is embedded within commission but not broken out separately in public filings.


      In 2025, the three pillars contributed: Commission KRW 568.9B (38.8% of revenue), Product/Standard KRW 451.8B
      (30.8%), and Merchandise KRW 400.7B (27.3%). Commission is the margin engine, carrying the highest incremental
      margin since the platform bears no inventory risk on partner brand sales. Product revenue includes Musinsa
      Standard offline retail (29 stores at end-2024, growing toward 40+) as well as the online private-label channel,
      and carries gross margin dilution versus commission but benefits from brand control and pricing power. Merchandise
      revenue carries full inventory risk and is the lowest-margin segment, but serves as a strategic lever to onboard
      major brands that require guaranteed inventory commitment before agreeing to list.


      The resale channel, Musinsa Used (formerly Solid Out), adopted a uniform 15% consignment commission model from
      January 23, 2026, replacing a tiered structure. This simplification improves margin predictability on the
      KRW 120B+ resale GMV line. International export GMV represented only 0.57% of total transaction value in H1
      2025, confirming that global revenue is still nascent and the near-term model is overwhelmingly domestic Korea.


      Recognition basis: revenue is recognized at transaction close for direct product and merchandise; commission
      revenue is recognized net of any promotional subsidies provided to partner brands. Musinsa has not disclosed
      a breakdown of advertising and logistics revenue as distinct lines, which is a gap for constructing a full
      unit-economics model without data-room access.
