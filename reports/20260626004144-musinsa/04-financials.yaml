  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: rcps
      missingEvidence: >-
        Full RCPS instrument terms including conversion price per share, redemption triggers (change of control,
        IPO proceeds minimum, time-based), and post-IPO proceeds waterfall require data-room access. Public DART
        filings confirm the reclassification and amount (~KRW 736B) but do not disclose conversion mechanics.
      whyItMatters: Conversion mechanics determine dilution profile at IPO and affect per-share economics.
      diligencePath: Review RCPS subscription agreements and side letters in the data room.
      relatedQuestionRefs:
        - QI015
        - QI020

    - type: private-evidence-only
      severity: blocking
      topic: operating-cash-flow
      missingEvidence: >-
        Management explanation and Q3/Q4 2025 operating cash flow data to confirm whether the H1 2025 reversal
        (–KRW 71.9B) was corrected in the second half. FY2025 annual report filed 2026-03-31 should contain full-year
        OCF but detailed commentary requires data room.
      whyItMatters: OCF reversal is the single largest near-term financial risk indicator; trend recovery needed.
      diligencePath: Obtain FY2025 cash flow statement and H2 2025 management commentary on inventory normalization.
      relatedQuestionRefs:
        - QI017
        - QI018

    - type: private-evidence-only
      severity: material
      topic: subsidiaries
      missingEvidence: >-
        Segment-level P&L for each of the 16 subsidiaries, including revenue, gross margin, operating profit,
        and path-to-profitability timeline for Solid Out (SLDT), Musinsa Japan, and 29CM. Only aggregate loss
        counts are disclosed in public DART filings.
      whyItMatters: Subsidiary losses of 13/16 entities compress group ROE and mask core-platform economics.
      diligencePath: Request segmented P&L, headcount, and unit economics for all material subsidiaries.
      relatedQuestionRefs:
        - QI021
        - QI022
        - QI009

