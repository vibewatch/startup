  - id: TI005
    title: Financial diligence blockers and evidence gaps
    columns:
      - blocker
      - severity
      - what is needed
      - current evidence status
    rows:
      - - H1 2025 OCF reversal (–KRW 71.9B vs. +173.6B in H1 2024)
        - blocking
        - Management explanation; H2 2025 and FY2025 OCF confirmation; inventory turn recovery data
        - Semi-annual DART filing shows the reversal; FY2025 annual report partially addresses it
      - - RCPS conversion terms and redemption schedule
        - blocking
