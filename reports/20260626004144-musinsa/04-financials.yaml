  - id: section-5
    title: Financial verdict — revenue quality, margin path, and diligence blockers
    body: >
      Revenue quality is high on the commission and direct-product segments: both are recurring, growing, and
      increasingly margin-positive. The merchandise segment introduces inventory risk and is the primary working
      capital consumption driver. The GMV-to-revenue ratio of approximately 3.6x and implied take rate of ~27.6%
      are strong by global fashion marketplace comparisons (Zozotown ~26%, Zalando ~14% net revenue/GMV), but
      are not directly comparable given Musinsa's hybrid revenue model.


      Margin path is credible through 2025: operating margin expanded from 8.3% to 9.6% over one year, and the
      EBITDA margin reached 16.9% in 2025. If the commission segment continues to outgrow merchandise, and if
      subsidiary losses narrow, operating margin could reach 12–14% on a two-year horizon. The key margin risk is
      marketing spend: Musinsa competes against Naver Shopping, Kakao Style, and international fast-fashion platforms
      for consumer attention, and any demand softening would require increased incentive spend that would compress margin.


      Capital adequacy is not a near-term concern: KRW 462B+ in liquid assets vs. estimated annual burn of ~KRW 150B
      (capex + interest + net working capital) provides roughly 3 years of runway. The IPO, if successful at even
      a discounted valuation of KRW 5–7T, would generate KRW 1–1.5T in proceeds and eliminate RCPS as a liability.


      Key diligence blockers: (1) H1 2025 operating cash flow turned negative KRW 71.9B — management explanation
      and Q3/Q4 2025 cash flow data required; (2) RCPS conversion terms and redemption schedule require data-room
      review; (3) 13/16 subsidiaries unprofitable — segment-level P&L and path to contribution needed; (4) IPO
      valuation gap (10T target vs. 4–7T market consensus) creates execution risk for the primary liquidity event;
      (5) global GMV only 0.57% of total in H1 2025 despite stated 260% CAGR — magnitude remains small, requiring
      international scale-up confirmation before underwriting international growth premium.
    claimRefs:
      - CI033
      - CI034
      - CI035
      - CI036
      - CI037
      - CI038
    tableRefs:
      - TI005

