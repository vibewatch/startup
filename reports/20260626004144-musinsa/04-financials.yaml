  - id: section-2
    title: GMV, revenue, and profit trajectory
    body: >
      Musinsa's public financial trajectory shows a sharp inflection: revenue grew from KRW 708.5B in 2022 to
      KRW 993.1B in 2023 (+40.2%), then to KRW 1,242.7B in 2024 (+25.1%), and KRW 1,467.8B in 2025 (+18.1%).
      Operating profit swung from KRW 11.3B in 2022 to a loss of KRW 8.6B in 2023 (investment year) before
      recovering to KRW 102.8B in 2024 (8.3% margin) and KRW 140.5B in 2025 (9.6% margin). This trajectory
      confirms the first full profitable year in 2024 and expanding margins in 2025 despite continued investment.


      GMV reached KRW 4.5T (~$3.3B) in 2024, implying an overall GMV-to-revenue ratio of approximately 3.6x,
      and a blended marketplace take rate of approximately 27.6% on the commission + merchandise components
      (excluding direct product sales from the take-rate calculation). H1 2025 GMV was KRW 2.3T, implying a
      full-year 2025 run rate of approximately KRW 4.8–5.0T.


      Q1 2026 results (filed with DART on 2026-05-27) show consolidated revenue of KRW 363.6B (+24.1% YoY) and
      operating profit of KRW 19.0B (+8.2% YoY). The operating profit growth rate lagging revenue growth in Q1 2026
      reflects seasonal working capital deployment and higher marketing spend in the first quarter.


      EBITDA climbed from KRW 195.1B in 2024 to KRW 248B in 2025, providing a cleaner cash-generation proxy than
      net income, which is distorted by the RCPS reclassification. Full-year 2025 net income was only KRW 7.7B
      versus operating profit of KRW 140.5B, entirely due to approximately KRW 80B in non-cash financing charges
      on reclassified RCPS instruments. This accounting change (reclassification of preferred shares as financial
      liabilities under K-IFRS) occurred in H1 2025 and does not reflect a genuine operational deterioration.
    claimRefs:
