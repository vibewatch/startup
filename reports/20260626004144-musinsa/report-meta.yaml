companyProfile:
  summary: >-
    Musinsa began in 2001 as Cho Man-ho's sneaker community and has evolved into Korea's dominant
    fashion-commerce platform spanning the core Musinsa marketplace, private-label Musinsa Standard,
    29CM, Soldout resale, global storefronts, and a growing offline store network. The platform pairs
    merchandising and community content with marketplace, advertising, and owned-brand economics,
    serving more than 16 million registered members and over 10,000 partner brands. Musinsa has
    crossed KRW 1 trillion in annual revenue, produced meaningful operating profit, and is preparing a
    KOSPI IPO, but its valuation ambition, regulatory scrutiny, and limited disclosure on concentration
    and retention still require disciplined diligence.
  foundedDate: '2001-01-01'
  founders:
    - name: Cho Man-ho
      role: Founder and co-CEO
      background: >-
        Started Musinsa in 2001 as a sneaker-focused online community and still leads business
        operations, product strategy, and global expansion.
      claimRefs: [CO001, CO015]
  foundingLocation: Seoul, South Korea
  headquarters: Seoul, South Korea
  productSummary: >-
    A fashion marketplace and retail ecosystem spanning third-party brand commerce, Musinsa Standard
    owned-brand apparel, editorial and community discovery, resale, cross-border K-fashion storefronts,
    and physical stores.
  customerFocus: >-
    Gen Z and Millennial fashion consumers in Korea first, then overseas shoppers seeking curated
    K-fashion brands and Musinsa Standard products.
  businessModel: >-
    Hybrid monetization from marketplace commissions and advertising, direct product sales through
    Musinsa Standard and other retail channels, merchandise distribution, and offline store expansion.
  stage: Late-stage private unicorn preparing for IPO
  fundingStatus: >-
    Roughly KRW 430 billion of primary capital raised across Series A-C, followed by an April 2025 EQT
    secondary transaction at about KRW 4 trillion valuation; targeting a KOSPI IPO with a KRW 10
    trillion aspirational valuation.
  disclosureProfile: private-disclosed
  claimRefs: [CO001, CO006, CO013, CO014, CO015, CO023, CO024, CO028, CO030, CO031, CO036]
summary:
  headline: >-
    Musinsa combines category leadership, real profitability, and strong Korean fashion consumer mindshare,
    but the current private/IPO valuation ambition runs materially ahead of disclosed fundamentals and the
    company still carries regulatory, trust, and international-execution risk.
