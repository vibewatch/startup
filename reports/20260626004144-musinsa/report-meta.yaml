  topStrengths:
    - Dominant Korean fashion marketplace position with 16M+ registered members and 10,000+ partner brands.
    - "Demonstrated operating leverage: KRW 1.47T FY2025 revenue and KRW 140.5B operating profit after crossing profitability in 2024."
    - Multi-engine model spanning marketplace, owned-brand retail, offline stores, and cross-border K-fashion expansion.
  topRisks:
    - IPO pricing ambition at KRW 10T implies valuation multiples far above listed e-commerce and fashion comps.
    - Regulatory and trust risk remains active after the 2026 label-switching scandal and KFTC scrutiny.
    - International business is growing fast but still small relative to domestic scale, limiting the case for a global-growth premium.
    - RCPS accounting overhang and limited disclosure on concentration, retention, and brand economics complicate underwriting.
  unresolvedGaps:
    - Full cap table, RCPS preference terms, and dilution/waterfall mechanics are not publicly disclosed.
    - Brand concentration, cohort retention, CAC/payback, and segment gross margins remain absent from public materials.
    - IPO timing, final underwriter lineup economics, and acceptable valuation range versus book-building demand are still unsettled.
    - International GMV, country-level unit economics, and profitability by subsidiary remain only partially disclosed.
