  - id: TU005
    title: Expansion and Concentration Risk
    columns:
      - Driver / Risk
      - Type
      - Severity
      - Evidence
      - Diligence Path
    rows:
      - - K-fashion global tailwind (MZ cross-border demand)
        - Expansion driver
        - Positive
        - Musinsa Standard +162% global sales 2025; buyers from 130+ countries
        - Track quarterly global GMV; monitor CAC by region
      - - International market concentration (Asia-heavy)
        - Geographic risk
        - Medium
        - China 19%, Taiwan 18%, Japan 13%, US 12% of global buyers
        - Diversify target markets beyond Greater China; monitor geopolitical exposure
      - - Brand-seller concentration (top brands vs 10,000+)
        - Concentration risk
        - Material
        - No public data on top-10 GMV share; Matin Kim single exclusive deal
        - Request Herfindahl index or top-10 brand GMV share; track partner brand churn
      - - Musinsa Standard private-label conflict
        - Structural risk
        - Material
        - #1 fast-fashion for 19–29 Koreans while hosting 10,000+ competing brands
        - Monitor partner brand complaints about preferential placement; track brand churn YoY
      - - Label-switching scandal (March 2026)
        - Platform trust / adverse event
        - Material
        - Multiple sellers caught; sales suspended; no apology; AI crackdown launched
        - Monitor recurrence rate; track delisting volume and seller remediation process
      - - Domestic market saturation (8.5% MAU growth)
        - Growth risk
        - Medium
        - MAU growth decelerating; 51% activation rate of 15M registered base
        - Track MAU activation rate improvement; monitor competitive wins from ABLY, Zigzag
      - - Global GMV target ambition (KRW 3T by 2030)
        - Execution risk
        - Medium-high
        - Requires ~12× expansion from current global GMV; capital-intensive offline rollout
        - Request capital expenditure plan for offline global expansion; monitor Japan 2025–2026
      - - Customer service / logistics quality (international)
        - Adverse customer experience
        - Medium
        - 2.2/5 PissedConsumer; 3.4/5 App Store (265 reviews); lost packages, refund friction
        - Request CS escalation rate, return/refund SLA; monitor international review volume
    notes: "Severity assessed from available public evidence as of 2026-06-26. No formal risk rating from Musinsa management is available. Brand-seller GMV concentration data is an estimate; actual figures are proprietary."
