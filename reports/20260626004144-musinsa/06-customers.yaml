      Row 2 (29CM fashion segment) derived from 90%+ Q1 2026 repurchase rate (Musinsa
      newsroom, Apr 2026) with curated-segment retention benchmarks. Row 3 (global store
      users) estimated from 260% annual MAU growth trajectory with new-market churn
      assumptions. These are order-of-magnitude proxies, not audited statistics.
