callouts:
  - calloutType: strength
    title: Gen Z Platform Dominance with Named Proof
    body: >-
      Musinsa's 15M+ registered user base with 78% under 30 and 48.1% Gen Z purchase
      intent leadership over Uniqlo/Zara gives it an unrivalled domestic positioning.
      Matin Kim's 75% daily-sales uplift through Musinsa fulfillment and the 29CM platform's
      90%+ Q1 2026 repurchase rate are the strongest customer-retention proof points.
    claimRefs:
      - CU001
      - CU007
      - CU016
      - CU025
  - calloutType: risk
    title: Retention Opacity and Label-Switching Trust Damage
    body: >-
      The 29.3% overall repeat-purchase rate (below beauty/grocery peers) and the complete
      absence of disclosed NPS, GRR, or cohort data are material diligence gaps ahead of
      the IPO. The March 2026 label-switching scandal—handled without a public apology—adds
      a platform-trust risk that is particularly damaging given that curation credibility is
      central to Musinsa's brand.
    claimRefs:
      - CU024
      - CU032
      - CU033
      - CU034
  - calloutType: risk
    title: Private-Label Conflict and Seller Concentration Opacity
    body: >-
      Musinsa Standard's position as the top fast-fashion brand for Korean Gen Z while
      sharing the same marketplace with 10,000+ paying partner brands creates a structural
      conflict of interest. Without disclosed brand-GMV concentration data, investors cannot
      assess the platform's dependency on its top sellers or the risk of brand defection.
    claimRefs:
      - CU027
      - CU036
      - CU037
  - calloutType: insight
    title: International Expansion as the Key Growth Lever
    body: >-
      With domestic MAU growth decelerating to 8.5% YoY, Musinsa's KRW 3 trillion global
      GMV target by 2030 (~12× current global store GMV) is the primary upside driver. The
      K-fashion tourism virtuous cycle—Korean store visits generating global online demand—is
      a differentiated acquisition mechanism absent from most Western fashion platforms.
    claimRefs:
      - CU002
      - CU018
      - CU029
      - CU035

