  - id: retention-repeat
    title: Retention, Repeat Usage, and Satisfaction Gaps
    body: >
      Retention visibility is the most material diligence gap in this chapter. Musinsa does
      not publicly disclose NPS, GRR, NRR, or formal cohort retention curves. The available
      proxies are: (a) an overall platform repeat-purchase rate of 29.3% as of February 2026
      (Seoul Economic Daily), which is below grocery and beauty e-commerce peers—Olive Young
      at 36.3%, Kurly at 71.7%—but consistent with fashion-category norms driven by
      lower-frequency, higher-basket-size dynamics; and (b) 29CM's self-reported Q1 2026
      fashion category repurchase rate exceeding 90%, which reflects a more deeply engaged
      curated-lifestyle shopper segment rather than the broad marketplace.


      The Moloco Ads engagement case study offers a quantifiable retention-adjacent proxy:
      segmented AI re-engagement campaigns achieved 10% and 22% stronger CPS efficiency for
      active users versus DSP Media A and B respectively, and 2.5x stronger CPS for video
      versus image creatives, with attributed users showing 66% higher ARPPU. These metrics
      confirm that Musinsa actively invests in reversing lapsed engagement and converting
      reactivated users into paying customers, but they do not substitute for formal
      cohort-based retention data.


      Consumer satisfaction signals are mixed. The Musinsa global app holds a 3.4/5
      average rating across 265 App Store reviews aggregated by JustUseApp as of 2026, with
      negative sentiment concentrated on logistics delays and customer service
      responsiveness. PissedConsumer aggregated three verified reviews giving a 2.2/5
      rating, with recurring complaints about lost shipments, copy-paste customer service
      replies, and return/refund friction. The domestic Korean audience (core Gen Z) shows
      higher satisfaction—evidenced by brand purchase-intent surveys and growing MAU—but no
      systematic CSAT or NPS data for the domestic segment is public.
