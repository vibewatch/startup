  - id: adoption-trajectory
    title: Adoption Trajectory and Platform-Level Growth
    body: >
      Musinsa's domestic monthly active user base reached 7.65 million in early 2026,
      representing an 8.5% year-on-year growth rate. While absolute scale is large relative
      to competitors, the growth rate is decelerating from prior high double-digit levels,
      reflecting increasing domestic market saturation and the maturing profile of Korea's
      online fashion sector. In February 2026, the platform logged approximately 3 million
      transactions, corresponding to roughly 0.39 transactions per MAU per month—lower than
      necessity-category platforms such as Daiso and Olive Young but consistent with the
      lower-frequency, higher-basket-size dynamics typical of fashion e-commerce. The average
      spending per Musinsa user over the trailing six months was 124,000 KRW (~$89 USD), the
      highest among major Korean vertical commerce platforms, indicating that while visit
      frequency is moderate, the buyer intent and basket size are comparatively premium.


      The global store, launched in September 2022, has grown at an average of 260% per year
      through April 2025 and reached 3 million MAU across 13 markets. Musinsa Standard's
      global-platform sales rose 162% in 2025 versus the prior year, with foreign-customer
      in-store sales at Korean locations exceeding 15 billion KRW—a virtuous loop where
      K-fashion tourism in Korea translates into sustained online demand. 29CM's fashion
      category GMV grew 33% year-on-year in Q1 2026, outperforming the main platform's
      domestic growth trajectory.


      Musinsa Standard's adoption among Korean Gen Z consumers surpassed that of Uniqlo:
      an October 2024 Open Survey of 800 Koreans aged 19–29 found 48.1% had purchased from
      Musinsa Standard, versus 42% for Uniqlo and 36% for Zara. This consumer preference
      survey corroborates growing private-label adoption but does not directly measure
      platform-level engagement or loyalty. The Moloco Ads case study demonstrates that
      Musinsa segments its user base into active (logged in within 60 days), semi-active,
      and inactive cohorts for targeted reactivation campaigns, achieving 66% higher ARPPU
      for users attributed across both Moloco Ads and MCM versus non-attributed users.
