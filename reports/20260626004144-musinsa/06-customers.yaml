  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: retention-disclosure-gap
      missingEvidence: >-
        Formal monthly cohort retention curves, NPS, GRR, or NRR data from Musinsa's
        management, IPO prospectus, or investor presentations.
      whyItMatters: >-
        Without cohort data, it is impossible to distinguish genuine loyalty from
        high promotional dependency; NPS and NRR are fundamental valuation inputs
        for a platform IPO at a KRW 10T target.
      diligencePath: >-
        Request management data room access; review DART preliminary prospectus
        once filed; ask IR for anonymized cohort data by registration vintage.
      relatedQuestionRefs:
        - QU006
        - QU020
    - type: missing-source
      severity: material
      topic: seller-concentration
      missingEvidence: >-
        Herfindahl-Hirschman Index or top-10/top-100 brand GMV concentration ratio
        for Musinsa's domestic and global marketplace.
      whyItMatters: >-
        If the top 50 brands contribute 60%+ of GMV, the departure or direct-to-consumer
        shift of even a few major brands (e.g., Matin Kim, Stand Oil) could significantly
        impair revenues.
      diligencePath: >-
        Request seller GMV concentration data from management; review IPO filing for
        customer/seller concentration disclosures per Korean securities regulations.
      relatedQuestionRefs:
        - QU011
      relatedTableRefs:
        - TU003
    - type: missing-source
      severity: material
      topic: demographics-gender
      missingEvidence: >-
        Official gender split of Musinsa's domestic user base (main platform, not 29CM)
        and how it has trended since the 29CM acquisition.
      whyItMatters: >-
        Gender balance affects product mix, advertising targeting ROI, and competitive
        positioning versus women-focused competitors Ably and Zigzag.
      diligencePath: >-
        Request internal user demographics from Musinsa; look for disclosures in DART
        IPO prospectus.
      relatedQuestionRefs:
        - QU003
    - type: missing-source
      severity: material
      topic: label-switching-scandal
      missingEvidence: >-
        Number of brands implicated, GMV volume affected, and post-scandal user churn
        data from the March 2026 label-switching crisis.
      whyItMatters: >-
        Without churn impact data, investors cannot quantify the reputational and
        financial damage from the incident or assess its recurrence probability.
      diligencePath: >-
        Request from Musinsa management the number of sellers delisted, GMV share
        affected, and any post-incident survey on consumer trust.
      relatedQuestionRefs:
        - QU014
    - type: missing-source
      severity: minor
      topic: international-buyer-economics
      missingEvidence: >-
        Customer acquisition cost (CAC), lifetime value (LTV), and contribution margin
        per international buyer on the Musinsa global store.
      whyItMatters: >-
        Unit economics for international expansion are essential for validating the
        KRW 3T 2030 GMV target; rapid GMV growth on poor unit economics would be
        unsustainable.
      diligencePath: >-
        Request unit economics by cohort from management; review global CAC/payback
        period in IPO prospectus materials.
      relatedQuestionRefs:
        - QU018
    - type: enumeration-incomplete
      severity: minor
      topic: Matin-Kim-partnership
      missingEvidence: >-
        Named customer outcomes for additional partner brands (Stand Oil, Glowny,
        Rest & Recreation, Andar, Nerdy) beyond Matin Kim; no public GMV or
        retention data for these brands is available.
      whyItMatters: >-
        Over-reliance on one marquee proof case (Matin Kim) makes brand-partner
        traction harder to generalize across 10,000+ brands.
      diligencePath: >-
        Request 3–5 additional brand outcome case studies from Musinsa with
        independently verifiable metrics.
      relatedQuestionRefs:
        - QU008
      relatedTableRefs:
        - TU003

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      All five tables include notes fields documenting estimation basis, data sources,
      and caveats. The notes are non-null for all tables and explain partial coverage,
      proxy metrics, and self-reported data. No pure factual snapshot tables are present.
  - dimension: figureType
    reason: >-
      FU004 uses cohort type with estimated values clearly marked in approximationNotes,
      as Musinsa does not disclose formal monthly cohort retention curves publicly.
      All four planned figure types (journey-map, funnel, matrix, cohort) are rendered.
  - dimension: paywallRisk
    reason: >-
      10 of 25 sources (40%) are js-only or rate-limited, primarily Chosunbiz articles
      that return 200 but require JavaScript rendering, and en.sedaily.com articles that
      were CloudFront-blocked. These sources are corroborated by accessible alternatives
      (Korea Herald, The Investor, Musinsa official newsroom) for all key claims. The
      restricted sources are retained for completeness of coverage and citation trail.
  - dimension: unverifiedSource
    reason: >-
      Customer and brand-proof URLs were manually validated during drafting, but the retrieval method used
      for part of the source set did not write those requests into the shared startup-research fetch trail.
      These citations are retained only where the underlying claims are corroborated by accessible official,
      customer-proof, review, or major-news sources, so no key judgment rests on a lone unlogged URL.
