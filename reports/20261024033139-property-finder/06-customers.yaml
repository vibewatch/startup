    summary: "Property Finder's public customer journey runs from discovery through agent interaction and adjacent transaction services, with trust controls as the main unresolved hinge."
    data:
      items:
        - id: discover
          label: Discover
          title: Search and compare
          description: "Home seekers browse listings using location, budget, lifestyle, commute, community, and amenity filters."
