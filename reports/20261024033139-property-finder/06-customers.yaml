schemaVersion: "report-v2"
artifact: customers
slug: property-finder
runDate: 2026-10-24
company:
  name: Property Finder
chapter:
  number: 6
  title: Customers
  summary: >-
    Property Finder serves a multi-sided customer system of home seekers, owners,
    brokers, agencies, and developers across several MENA markets. Public evidence
    supports broad reach, product-led engagement, and agent-facing monetization
    surfaces, but does not establish retention, conversion, concentration, or
    production deployment quality at the account level.
sections:
  - id: customer-system
    title: Customer system and segmentation
    body: >-
      Property Finder's customer system is structurally multi-sided. The consumer
      side includes buyers, renters, sellers, and owners searching across the UAE,
      Saudi Arabia, Egypt, Qatar, and Bahrain, while the commercial side includes
      agents, agencies, developers, and related property professionals. The app
      listings emphasize filters, alerts, community comparisons, valuation, and
      direct connections to agents; the company also describes professional tools
      and a broader data and workflow proposition. This breadth creates a useful
      network effect if listings, qualified demand, and responsive professionals
      reinforce one another, but public sources do not disclose the number of
      paying accounts, payer mix, average revenue per customer, or the share of
      activity from each geography.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-engagement
    title: Adoption and engagement signals
    body: >-
      The strongest public adoption signals are reach and usage proxies rather
      than contractual customer metrics. An Entrepreneur Middle East interview
      reports more than 5.5 million monthly active users across six markets and
      describes more than 4,000 agents recognized by the SuperAgent program. The
      app stores provide additional evidence of an active consumer surface:
      Google Play shows 8.54 thousand reviews and a recent update cadence, while
      AppBrain estimates 4.7 million installs and 67 thousand installs in the
      latest 30-day period. These measures are not interchangeable: active users,
      installs, reviews, and agent badges have different denominators and do not
      prove paid conversion, repeat usage, or retention. A customer-quality
      diligence process should therefore request cohort activity, lead-to-deal
      conversion, renewal, and product-level usage by market.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-durability
    title: Named proof, durability, and customer risk
    body: >-
      Public named proof is concentrated in company-selected testimonials and
      ecosystem relationships rather than independently audited deployments.
      Partner Hub identifies named agencies and presents agent and agency
      testimonials, while the company describes SuperAgent as a response to
      consumer trust concerns and says the program recognizes more than 4,000
      agents. Those signals support the existence of an agent-service layer, but
      they do not establish production depth, customer outcomes, or renewal
      economics. The adverse evidence is material: AppBrain reproduces user
      complaints about fake listings, incomplete details, agent responsiveness,
      and data-sharing harassment, while the Google Play listing includes
      similar complaints and a company response directing users to report
      listings. The central unresolved customer risk is whether verification and
      complaint handling scale with marketplace growth.
    claimRefs: [CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
  - id: expansion-and-diligence
    title: Expansion surfaces and diligence priorities
    body: >-
      Expansion is visible in adjacent workflow surfaces, but the public record
      does not quantify attach or repeat purchase. Mortgage Finder describes an
      end-to-end mortgage journey and says it is powered by Property Finder,
      while the app listings describe home valuation, rent-versus-sell analysis,
      alerts, and rent-now-pay-monthly functionality. CNBC reports management's
      ambition to move beyond listings toward online transactions, with adoption
      expected to begin in rentals. These are plausible land-and-expand surfaces,
      not evidence of realized cross-sell. Investors should request segment-level
      revenue, attach rates, active-to-paying conversion, churn and renewal by
      product, top-account concentration, lead quality, complaint-resolution
      times, and the denominator behind every customer-count or usage claim.
    claimRefs: [CU014, CU015, CU016]

tables:
  - id: TU001
    title: Customer segmentation table
    columns: [segment, buyer/user/payer, use case, scale or evidence, revenue or strategic value, diligence gap]
    rows:
      - [Home seekers, "User; may become buyer or renter", "Search, compare, receive alerts, contact agents", "App listings cover UAE, Saudi Arabia, Egypt, Qatar, and Bahrain", "Demand-side liquidity and lead generation", "No public conversion, repeat-use, or paid-acquisition denominator"]
      - [Owners and sellers, "Payer or supply-side user", "Valuation, rent-versus-sell analysis, reach buyers and renters", "App listings describe valuation and tailored rent-versus-sell options", "Supply acquisition and listing monetization", "No public listing-to-transaction or seller-retention data"]
      - [Agents and agencies, "Payer and service provider", "Advertise inventory, receive leads, manage professional reputation", "App listing says 20,000+ professionals; Entrepreneur reports 4,000+ SuperAgents", "Recurring marketplace monetization and service quality", "No public paying-account, renewal, lead-quality, or concentration data"]
      - [Developers and ecosystem partners, "Payer, partner, or strategic customer", "Promote projects, use market data, and extend transaction workflow", "Permira describes a property platform serving consumers and partners; Partner Hub names agencies", "Enterprise relationships and expansion into data and transactions", "No public contract value, attach, or partner concentration data"]
    notes: "Sources: Apple App Store, Google Play, Entrepreneur Middle East, Permira, and Property Finder Partner Hub; counts are source-reported and not normalized across segments."
    claimRefs: [CU001, CU002, CU003, CU004]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [metric, value, date, source, confidence, implication, missing denominator]
    rows:
      - [Monthly active users, "More than 5.5 million", "Article access date 2026-10-24; period not stated", "Entrepreneur Middle East interview", medium, "Indicates broad regional consumer reach", "Definition, geography mix, and repeat-user methodology"]
      - [App installs, "4.7 million", "2026-10-22 data update", AppBrain, medium, "Shows material app distribution", "Install deduplication, active share, and web usage"]
      - [Recent installs, "67 thousand in the last 30 days", "2026-10-22 data update", AppBrain, medium, "Suggests continuing acquisition", "Whether installs are organic, retained, or geographically concentrated"]
      - [App review volume, "8.54 thousand Google Play ratings; 2.2 thousand Apple ratings in the fetched listings", "2026-10-13 to 2026-10-15 listing updates", "Google Play and Apple App Store", medium, "Provides a visible feedback surface", "Review-selection bias and relationship to active or paying users"]
    notes: "Metrics are heterogeneous proxies with different units, periods, and denominators; they must not be read as a single funnel or as retention evidence."
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
  - id: TU003
    title: Named customer proof table
    columns: [customer or counterparty, segment, deployment or use case, production versus pilot, outcome, limitation]
    enumerationScope:
      coverage: partial
      basis: "Publicly named customer and agency references found in the assigned 2026 refresh source pool; not a complete customer population or contract register."
    rows:
      - [Betterhomes, Real-estate agency, "Named as a SuperAgent award participant", "Program participation; production usage not independently verified", "Recognition indicates a relationship with the platform", "No account tenure, spend, lead volume, or outcome disclosed"]
      - [Allsopp & Allsopp, Real-estate agency, "Named as a SuperAgent award participant", "Program participation; production usage not independently verified", "Recognition indicates a relationship with the platform", "No retention or conversion evidence disclosed"]
      - [Arabian Estates, Real-estate agency, "Partner Hub testimonial attributed to Executive Director Leon Wright", "Testimonial; deployment scope not disclosed", "Supports existence of an agency-facing relationship", "No independently measured outcome, contract terms, or renewal disclosed"]
    notes: "Enumeration is a partial sample of company-selected named references; logos, awards, and testimonials do not prove production deployment, retention, or economic value."
    claimRefs: [CU010, CU011, CU012]

