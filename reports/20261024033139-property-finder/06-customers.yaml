          title: Assess value and fit
          description: "Users can review valuation, historical transactions, market insights, and rent-versus-sell considerations."
          touchpoints: [Home valuation, price trends, data insights]
        - id: connect
          label: Connect
          title: Contact professionals
          description: "The platform connects users with agents and agencies and promotes SuperAgent service quality."
          touchpoints: [Agent contact, SuperAgent badge, alerts]
        - id: transact
          label: Transact
          title: Move toward a deal
          description: "Management describes a path beyond listings toward online transactions, starting with rentals."
          touchpoints: [Rental workflow, rent now pay monthly, transaction ambition]
        - id: finance
          label: Finance
          title: Add mortgage support
          description: "Mortgage Finder describes eligibility, pre-approval, bank comparison, and closing support."
          touchpoints: [Mortgage eligibility, pre-approval, bank options]
        - id: expand
          label: Expand
          title: Retain and cross-sell
          description: "The public record does not disclose attach, renewal, or repeat-use rates for adjacent services."
          touchpoints: [Product attach, repeat usage, renewal gap]
    claimRefs: [CU014, CU015, CU016]

callouts:
  - calloutType: strength
    title: Broad demand-side reach
    body: "The public evidence supports a large, geographically distributed consumer surface and a substantial professional network, although the measures are not a substitute for paid-account or retention data."
    claimRefs: [CU001, CU005, CU006]
  - calloutType: risk
    title: Marketplace trust and quality control
    body: "Repeated public complaints about fake listings, incomplete information, agent responsiveness, and data-sharing harassment make listing verification and complaint-resolution performance a central customer diligence item."
    claimRefs: [CU011, CU012, CU013]
  - calloutType: recommendation
    title: Request customer cohort evidence
    body: "Before underwriting durability, obtain customer-level cohorts, payer conversion, renewal and churn, lead quality, product attach, concentration, and complaint-resolution data by market."
    claimRefs: [CU014, CU015, CU016]

