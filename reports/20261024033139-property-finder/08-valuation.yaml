artifact: valuation
slug: property-finder
runDate: 2026-10-24
company:
  name: Property Finder
chapter:
  number: 8
  title: Valuation
  summary: >-
    Property Finder has attracted substantial institutional capital, including a $525 million
    minority transaction announced in 2025 and a $170 million investment announced in 2026,
    but the retained public evidence does not disclose enough transaction terms or verified
    operating metrics to underwrite an entry price. The recommendation is research-more with
    low confidence in valuation, high underwriting risk, and no supportable numeric range.
sections:
  - id: recommendation-and-investment-case
    title: Recommendation and investment case
    body: >-
      The appropriate public-evidence recommendation is research-more rather than buy. Investor
      participation is meaningful: Permira described the 2025 transaction as a $525 million
      investment for a meaningful minority stake, while Mubadala announced a further $170 million
      transaction in 2026. Those transactions validate institutional interest, but they do not
      establish the price a new investor should pay. A third-party database reports a $2 billion
      September 2025 valuation and $117 million of revenue, implying 17.1x revenue, yet the retained
      text does not explain or independently verify the revenue basis. The thesis is therefore
      conditional on obtaining audited financials and transaction documents; the anti-thesis is
      that a capital-rich portal may still deliver weak returns if entry pricing embeds unsupported
      growth or if marketplace trust problems impair engagement.
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV015
      - CV016
    tableRefs:
      - TV001
      - TV002
    figureRefs:
      - FV001
  - id: financing-context-and-entry-discipline
    title: Financing context and entry discipline
    body: >-
      The financing record must be separated from cash available and from valuation. Mubadala's
      announcement says the 2026 transaction comprised $75 million from Mubadala, $75 million from
      another UAE sovereign wealth fund, and $20 million from BECO Capital. The same announcement
      says Property Finder had raised nearly $700 million of aggregate equity and a further $250
      million of debt from Ares Management and HSBC; those figures describe financing raised, not
      current liquidity or runway. Permira also disclosed that General Atlantic sold part of its
      stake in the 2025 transaction while retaining a significant minority holding, showing that
      at least part of that transaction was secondary. Entry discipline should therefore require
      a primary-versus-secondary bridge, fully diluted capitalization, debt terms, liquidation
      preferences, and the proposed security price before treating either headline amount as
      growth capital or price discovery.
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV014
      - CV016
  - id: scenarios-and-downside-signals
    title: Scenarios and downside signals
    body: >-
      Scenario analysis cannot responsibly produce numeric valuation ranges from the allocated
      evidence. The bull case requires verified growth, profitability, retention, and successful
      expansion from listings into online transactions; CNBC's interview summary notes that the
      chief executive expects that transition to take time and begin with rentals. The base case
      assumes the portal remains strategically important but that returns depend on an entry price
      benchmark established from audited metrics. The bear case combines multiple compression,
      debt or preference overhang, slower transaction adoption, and marketplace-quality risk.
      Recent Google Play reviews allege fake or misleading listings and ineffective reporting,
      but these are individual customer reports rather than a measured fraud rate. They are a
      diligence signal, not proof of platform-wide incidence.
    claimRefs:
      - CV009
      - CV011
      - CV012
      - CV013
      - CV014
    tableRefs:
      - TV003
  - id: comparables-exit-readiness-and-diligence
    title: Comparables, exit readiness, and final diligence
    body: >-
      A revenue-multiple framework is directionally appropriate for a classified marketplace, but
      the only allocated source offering a direct multiple is a low-confidence database entry whose
      revenue methodology is not independently substantiated. Its labels also conflict with primary
      transaction descriptions: it calls the January 2026 event an acquisition by BECO Capital and
      Mubadala, whereas Mubadala describes a new investment by three investors. DXBStart argues that
      direct developer sales reduce dependence on portals and that returns likely require an IPO or
      strategic sale, an adverse structural consideration rather than an exit forecast. Exit
      readiness remains unproven until management supplies audited revenue and EBITDA, cohort
      retention, debt covenants, cap-table and preference details, listing-integrity metrics, and a
      credible public-market or strategic-buyer pathway. A failure to provide those items, or an
      entry price anchored to the unverified 17.1x figure, should break the current thesis.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV010
      - CV014
      - CV015
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Dimension
      - Current view
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - Research more
        - Institutional financing is visible, but verified valuation and operating inputs are missing.
        - Do not price or approve an investment from public evidence alone.
      - - Confidence
        - Low
        - Financing announcements are primary or partner-issued; financial metrics and terms remain private.
        - Require a controlled data-room review before changing the call.
      - - Risk rating
        - High
        - Leverage, preferences, pricing, retention, and listing-integrity incidence are unresolved.
        - Treat missing terms as underwriting risks rather than neutral assumptions.
      - - Valuation stance
        - Unknown
        - A reported $2 billion valuation and 17.1x revenue multiple are not independently verified.
        - Do not use the reported multiple as an entry anchor.
      - - Price discipline
        - Terms-dependent
        - The 2025 transaction included a partial shareholder sale, and the primary-secondary split is undisclosed.
        - Set a ceiling only after reconciling capitalization, debt, preferences, and audited metrics.
    notes: >-
      Analytical judgment as of 2026-10-24; headline financing is not treated as cash available,
      and no numeric valuation range is inferred from undisclosed transaction terms.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV007
      - CV014
      - CV015
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - Evidence signal
      - What would change the view
    rows:
      - - Thesis
        - Repeated backing from large global and sovereign investors supports financing access.
        - $525 million transaction announced in 2025 and $170 million investment announced in 2026.
        - Verified pricing below a defensible comparable range with clean preference terms.
      - - Thesis
        - Expansion from listings into transactions could broaden monetization.
        - CEO interview summary identifies online transactions as a growth direction, beginning with rentals.
        - Cohort evidence showing transaction adoption, retention, and incremental margin.
      - - Anti-thesis
        - Public evidence cannot establish an acceptable entry valuation.
        - The only direct 17.1x multiple is based on an unverified database revenue figure.
        - Audited revenue, EBITDA, cash flow, and exact fully diluted transaction price.
      - - Anti-thesis
        - Marketplace trust failures could weaken network effects and monetization.
        - Individual app reviews allege fake listings, misleading media, and ineffective reporting.
        - Independent incidence, remediation-time, repeat-offender, and retention data.
    notes: >-
      The thesis signals combine investor announcements, an interview summary, a low-confidence
      database estimate, and anecdotal customer reviews; they are not equally reliable.
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV009
      - CV011
      - CV012
      - CV013
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Assumptions
      - Valuation and return logic
      - Probability signal
      - Downside or upgrade trigger
    rows:
      - - Bull
        - Verified growth and profitability; transaction products scale; listing trust improves.
        - No public numeric range is supportable; upside requires entry below a verified portal-comparable range.
        - Not estimable from retained public evidence.
        - Upgrade after audited metrics, clean preferences, and measurable transaction adoption.
      - - Base
        - Core portal remains valuable, but transaction adoption is gradual and financing terms are conventional.
        - Return depends on disciplined entry pricing against audited revenue and EBITDA.
        - Not estimable from retained public evidence.
        - Hold research-more until capitalization, debt, retention, and margins are verified.
      - - Bear
        - Multiple compression, leverage or preference overhang, slow adoption, and persistent listing-quality concerns.
        - Downside is unbounded without verified entry price and liquidation waterfall.
        - Customer complaints and contradictory transaction labels are warning signals, not calibrated probabilities.
        - Break thesis if terms are punitive, metrics cannot be reconciled, or integrity indicators deteriorate.
    notes: >-
      Scenarios are qualitative because the allocated sources do not establish audited operating
      metrics, transaction price, capitalization, or a reliable comparable-multiple range.
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV011
      - CV012
      - CV014
      - CV016
