    title: Evidence-constrained UAE market sizing lenses
    type: pyramid
    summary: >-
      The pyramid orders broad market lenses from wider UAE property value to
      narrower observable Dubai transaction subsets; widths indicate authored
      stage order, not comparable magnitude.
    data:
      nodes:
        - id: uae-market-2025
          label: UAE real estate market 2025
          value: "$149.4bn"
          unit: USD
          note: "Next Move Strategy Consulting estimate; broad market"
        - id: uae-market-2024
          label: UAE market 2024 alternative lens
          value: "$160bn"
          unit: USD
          note: "Property Finder / Permira announcement; definition not fully disclosed"
        - id: dubai-sales-q1
          label: Dubai sales Q1 2025
          value: "AED151.6bn"
          unit: AED
          note: "Chestertons; local sales transaction value"
        - id: dubai-offplan-q1
          label: Dubai off-plan Q1 2025
          value: "AED53.83bn"
          unit: AED
          note: "Chestertons; subset of Dubai sales"
        - id: dubai-leasing-q1
          label: Dubai leasing Q1 2025
          value: "AED14.6bn"
          unit: AED
          note: "Chestertons; leasing transaction value"
        - id: abu-dhabi-activity
          label: Abu Dhabi transaction activity
          value: "50%"
          unit: YoY
          note: "CBRE; annual transaction-volume increase, not market value"
    items: []
    approximationNotes: >-
      Stage order is analytical and not magnitude-proportional. The USD and AED
      values have different currencies, populations and definitions; no
      conversion, share or implied TAM is calculated.
    claimRefs: [CM006, CM007, CM009, CM010]
callouts:
  - calloutType: insight
    title: Market depth is credible; capture is not yet measurable
    body: >-
      Regional coverage, high Dubai liquidity and multiple demand-side and
      professional workflows support a substantial addressable market, but the
      public record does not provide a defensible platform share or revenue
      bridge.
    claimRefs: [CM003, CM009, CM017]
  - calloutType: risk
    title: Trust and supply-cycle risks can weaken monetization
    body: >-
      Moderating residential conditions, possible oversupply, upfront-cost
      pressure and user allegations about listing quality create risks to
      qualified-lead economics even while gross market values grow.
    claimRefs: [CM014, CM015, CM016]
