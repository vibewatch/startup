callouts:
  - calloutType: strength
    title: Institutional backing and platform breadth
    body: Permira, Blackstone, General Atlantic, Mubadala, and BECO are named across the retained funding evidence, while the product surfaces span search, transaction data, projects, valuation, and professional connectivity.
    claimRefs: [CO002, CO007, CO008]
  - calloutType: risk
    title: Private-company opacity and marketplace integrity
    body: The retained evidence does not establish current valuation terms, KPI definitions, debt covenants, or listing-fraud prevalence; those gaps matter because marketplace trust and leverage directly affect durability.
    claimRefs: [CO010, CO013, CO014]

