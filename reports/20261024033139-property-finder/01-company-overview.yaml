artifact: company-overview
slug: property-finder
runDate: 2026-10-24
company:
  name: Property Finder
chapter:
  number: 1
  title: Company Overview
  summary: Property Finder is a Dubai-headquartered, privately held real-estate marketplace serving consumers and property professionals across MENA. The evidence supports a scaled platform and substantial institutional backing, but public sources conflict on founding year and provide limited independently verifiable operating metrics.
sections:
  - id: identity-and-product
    title: Identity, footprint, and product
    body: Property Finder operates a digital property marketplace with consumer search and professional tools. Its official site presents buying, renting, investing, transaction data, new-project discovery, valuation, and alerts as parts of the user journey, while the app describes coverage across the UAE, Saudi Arabia, Egypt, Qatar, and Bahrain and says it connects users with more than 20,000 professionals. Independent company-data coverage describes a Dubai headquarters and B2C/B2B focus, but its reported footprint and financial figures should be treated as secondary data rather than audited company disclosure. The identity is therefore clear; the precise current operating perimeter is not.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-capital
    title: Leadership, ownership, and capital
    body: Michael Lahyani is identified as founder and chief executive in investor communications, while Jamie O’Mahony is identified as chief financial officer in the January 2026 funding account. The capital record shows a $525 million 2025 investment led by Permira with Blackstone Growth participation, followed by a reported $170 million investment led by Mubadala in January 2026; Wamda describes nearly $700 million of aggregate equity and $250 million of debt financing. These are transaction announcements and secondary reporting, not a complete cap table. The current valuation, dilution, preference stack, and control arrangements remain undisclosed in the retained evidence.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO002, TO003]
  - id: milestones-and-open-issues
    title: Milestones, scale signals, and diligence limits
    body: The company’s chronology indicates a long operating history, successive institutional financings, secondary liquidity, product expansion, strategic investment activity, and a transition toward a broader real-estate operating system. The platform’s current scale is supported by app-store descriptions, investor statements, and Dubai market data, but not by a consistent audited KPI series. User reviews in the Google Play record allege fake listings, incomplete details, and broker-contact harassment; Property Finder replies with a reporting workflow, so the issue is an adverse user signal rather than proof of systemic prevalence. Investors should verify listing controls, complaint outcomes, customer concentration, and debt-service capacity directly.
    claimRefs: [CO011, CO012, CO013, CO014]
    figureRefs: [FO001]
  - id: exhibits
    title: Exhibits
    body: >-
      The exhibits consolidate the available snapshot, named leadership and stakeholders, and dated milestones. Where the evidence is company-issued, partner-issued, or secondary, the table preserves that provenance through the linked claims rather than presenting the figures as independently audited. This distinction is important for a private marketplace: announced capital is not the same as cash available, secondary valuation is not an audited operating result, and partner descriptions do not establish independent verification of management depth or customer economics.
    claimRefs: [CO001, CO005, CO011]

tables:
  - id: TO001
    title: Snapshot KPI table
    columns: [Metric, Value or status, Date, Confidence, Gap]
    rows:
      - [Headquarters, Dubai, current source pages, medium, Confirm legal entity and operating subsidiaries]
      - [Operating model, Digital property marketplace for consumers and professionals, current source pages, medium, Verify revenue mix by product]
      - [Geographic coverage, "UAE Saudi Arabia Egypt Qatar Bahrain; broader MENA references also appear", "2026", medium, Confirm active markets and market-level revenue]
      - [Professional network, "20,000+ trusted professionals", "2026-10-13", medium, Obtain active-agent and paying-account definitions]
      - [Latest announced investment, "$170 million", "2026-01", medium, Confirm transaction close and instrument terms]
      - [2025 strategic investment, "$525 million combined investment", "2025-09-09", medium, Confirm proceeds allocation and post-money valuation]
      - [Total equity raised, "Nearly $700 million", "2026-01", medium, Reconcile with cap table and any secondary proceeds]
      - [Debt financing, "$250 million", "2026-01", medium, "Obtain facility terms, covenants, and maturity"]
      - [Valuation, "$2 billion reported by secondary database", "2025-09", low, Obtain primary valuation evidence]
      - [Revenue, "$117 million reported by secondary database", "2025-09", low, Obtain audited or management financials]
    notes: Values mix company, partner, government, and secondary-source disclosures; dates are publication or stated transaction periods, and null-like gaps identify items requiring direct diligence.
    claimRefs: [CO001, CO002, CO005, CO006, CO007, CO008, CO009, CO010]
  - id: TO002
    title: Leadership and founder table
    columns: [Person, Role, Background or coverage, Founder-market fit or functional coverage, Key-person dependency]
    rows:
      - [Michael Lahyani, Founder and Chief Executive Officer, Named in Permira and Wamda investment communications, Founder-led marketplace and strategic direction, Confirm succession and delegated authority]
      - [Jamie O’Mahony, Chief Financial Officer, Named in Wamda’s January 2026 funding account, Finance and institutional capital coverage, Confirm tenure and finance-team depth]
    notes: The retained pool does not provide a complete board or executive roster; both rows require corroboration through governance records or direct management diligence.
    enumerationScope:
      coverage: partial
      basis: Publicly named leadership in successful prefetched investor and funding sources available for the 2026-10-24 refresh.
    claimRefs: [CO005, CO006]
  - id: TO003
    title: Stakeholder or investor map
    columns: [Stakeholder, Role, Control or economic importance, Diligence ask]
    rows:
      - [Permira, Lead investor in 2025 transaction, Significant minority investment and strategic support, Confirm rights and board representation]
      - [Blackstone Growth, Co-investor in 2025 transaction, Significant capital and platform expertise, Confirm ownership and reserved matters]
      - [General Atlantic, Existing shareholder since 2018, Retained a significant minority after partial sale, Confirm remaining stake and liquidity rights]
      - [Mubadala, Lead investor in reported 2026 transaction, Reported $75 million commitment, Confirm final syndicate and governance rights]
      - [BECO Capital, Early investor and reported 2026 participant, Reported $20 million commitment and long relationship, Confirm fund vehicle and control rights]
      - [Ares Management and HSBC, Debt providers reported by Wamda, Reported $250 million debt financing, Obtain facility documents and covenant headroom]
    notes: Stakeholder roles are reconstructed from transaction announcements and secondary reporting; economic importance does not imply control, voting rights, or a completed closing unless separately documented.
    enumerationScope:
      coverage: partial
      basis: Named capital and financing stakeholders in the 2025-2026 successful prefetched evidence pool, not a complete cap table.
    claimRefs: [CO007, CO008, CO009, CO010]

