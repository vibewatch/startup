      - Probability signal
      - Downside or upgrade trigger
    rows:
      - - Bull
        - Verified growth and profitability; transaction products scale; listing trust improves.
        - No public numeric range is supportable; upside requires entry below a verified portal-comparable range.
        - Not estimable from retained public evidence.
        - Upgrade after audited metrics, clean preferences, and measurable transaction adoption.
      - - Base
        - Core portal remains valuable, but transaction adoption is gradual and financing terms are conventional.
        - Return depends on disciplined entry pricing against audited revenue and EBITDA.
        - Not estimable from retained public evidence.
        - Hold research-more until capitalization, debt, retention, and margins are verified.
      - - Bear
        - Multiple compression, leverage or preference overhang, slow adoption, and persistent listing-quality concerns.
        - Downside is unbounded without verified entry price and liquidation waterfall.
        - Customer complaints and contradictory transaction labels are warning signals, not calibrated probabilities.
        - Break thesis if terms are punitive, metrics cannot be reconciled, or integrity indicators deteriorate.
