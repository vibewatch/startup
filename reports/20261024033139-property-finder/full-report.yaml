  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Institutional financing supports strategic validation, but missing price and operating proof plus
      marketplace-quality signals keep the decision at research-more.
    data:
      nodes:
        - id: financing
          label: Institutional financing
          detail: $525 million 2025 transaction and $170 million 2026 investment.
        - id: expansion
          label: Expansion option
          detail: Management describes a gradual move from listings toward online transactions.
        - id: opacity
          label: Valuation opacity
          detail: No verified 2026 valuation, fully diluted price, or transaction terms.
        - id: quality
          label: Marketplace-quality signal
          detail: Anecdotal reviews allege fake or misleading listings.
        - id: discipline
          label: Entry discipline
          detail: Require audited metrics, capitalization, debt, preferences, and integrity data.
        - id: decision
          label: Research more
          detail: No supportable numeric range or buy recommendation from public evidence.
      edges:
        - from: financing
          to: expansion
          label: supports
        - from: expansion
          to: opacity
          label: does not resolve
        - from: opacity
          to: discipline
          label: requires
        - from: quality
          to: discipline
          label: reinforces
        - from: discipline
          to: decision
          label: determines
    approximationNotes: The sequence is analytical logic, not a quantitative scoring model or implied conversion funnel.
    claimRefs:
      - CV001
      - CV009
      - CV011
      - CV014
      - CV015
      - CV016
