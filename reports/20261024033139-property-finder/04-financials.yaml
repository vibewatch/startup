    title: Revenue model bridge
    type: flow
    summary: "The observable path from free consumer demand to potential B2B and transaction monetization, with undisclosed conversion and margin."
    data:
      nodes:
        - id: consumer-demand
          label: Free consumer demand
          detail: "Property seekers use the app without a disclosed consumer charge."
        - id: discovery
          label: Listings and decision tools
          detail: "Search, alerts, community information, valuation, and transaction history support discovery."
        - id: professional-network
          label: Real-estate professionals
          detail: "Agents, agencies, and developers receive visibility and leads; storefront counts conflict."
        - id: b2b-monetization
          label: B2B advertising and workflow
          detail: "Advertising is reported as the model, but price, contract terms, and realized yield are unavailable."
        - id: transaction-layer
          label: Rent and payment workflows
          detail: "Rent-now-pay-monthly indicates movement beyond listings; adoption and take rate are unavailable."
        - id: gross-profit
          label: Gross profit and cash generation
          detail: "Revenue mix, gross margin, service cost, credit exposure, and cash conversion are not publicly quantified."
    approximationNotes: "This is a mechanism map, not a value-proportional funnel; it does not infer conversion rates, revenue shares, or gross margin."
    claimRefs: [CI003, CI004, CI005, CI010, CI013, CI016]
callouts:
  - calloutType: risk
    title: Funding headlines are not runway
    body: >-
      The disclosed transaction amounts do not establish primary proceeds, cash on
      hand, burn, debt availability, or debt-service obligations.
    claimRefs: [CI006, CI007, CI016]
  - calloutType: recommendation
    title: Gate financial underwriting on a monthly operating pack
    body: >-
      Require audited revenue by stream, cohort retention, realized pricing, gross
      margin, cash, burn, and complete debt terms before relying on profitability or
      capital-adequacy assertions.
    claimRefs: [CI011, CI013, CI016]
