schemaVersion: "report-v2"
artifact: financials
slug: property-finder
runDate: 2026-10-24
company:
  name: Property Finder
chapter:
  number: 4
  title: Financials
  summary: >-
    Property Finder shows a plausible two-sided classifieds model with free consumer
    access, paid B2B visibility and workflow products, plus a developing transaction
    layer. Publicly announced equity and debt transactions demonstrate financing
    access, but the retained evidence does not disclose audited revenue, revenue mix,
    gross margin, burn, cash, runway, or debt terms, leaving capital adequacy and
    earnings quality unverified.
sections:
  - id: revenue-model
    title: Revenue model and pricing visibility
    body: >-
      The observable model starts with free consumer discovery and routes demand to
      agents, agencies, and developers. A third-party database labels advertising as
      the revenue model, while Property Finder's app-store copy describes search,
      alerts, valuation tools, verified listings, and access to real-estate
      professionals. The Apple listing also introduces an adjacent "rent now, pay
      monthly" workflow with income verification and in-app tenancy payments. These
      surfaces support a blended hypothesis of listing or advertising revenue,
      professional workflow monetization, and emerging transaction services, but no
      retained source discloses current B2B rate cards, realized discounts, contract
      duration, revenue recognition, or revenue mix. Consumer access being free
      therefore establishes only one side of the pricing architecture, not the
      economics of the paying side.
    claimRefs: [CI003, CI004, CI005, CI013]
    tableRefs: [TI001, TI002]
  - id: traction-and-unit-economics
    title: Traction signals do not close the unit-economics gap
    body: >-
      Public storefronts demonstrate broad geographic reach and a large professional
      network, but even those operating figures are inconsistent: Apple says the
      platform connects users with more than 40,000 professionals, whereas Google
      Play says more than 20,000. A commercial database records $117 million of
      September 2025 revenue and a 17.1x revenue multiple against a $2 billion
      valuation, yet its own methodology says round-linked figures may be run-rate
      revenue or reported LTM revenue. That ambiguity prevents treating the figure as
      audited revenue or ARR. More important underwriting metrics remain absent from
      the retained evidence: gross margin, contribution margin, CAC, payback, churn,
      cohort retention, sales cycle, channel fees, customer concentration, capex, and
      working-capital needs.
    claimRefs: [CI001, CI002, CI011, CI012, CI013]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Financing access is visible; capital adequacy is not
    body: >-
      The September 2025 transaction announced a combined $525 million investment,
      but General Atlantic also sold part of its stake, so the headline amount cannot
      be equated with primary cash delivered to Property Finder. Wamda later reported
      a $170 million investment and $250 million of debt financing from Ares
      Management and HSBC; the article then reproduces a company press release and
      does not supply debt pricing, maturity, covenants, draw status, or the primary
      versus secondary split. Property Finder also invested in Stake for an
      undisclosed amount, showing capital deployment into adjacent real-estate
      workflows without quantifying the outlay. These events evidence access to
      capital, not cash available, burn rate, runway, debt-service headroom, or the
      next financing trigger.
    claimRefs: [CI006, CI007, CI008, CI009, CI016]
    figureRefs: [FI001]
  - id: financial-verdict
    title: Financial verdict and downside checks
    body: >-
      The financial case is promising but not underwritable from public evidence.
      Consumer scale, professional participation, and the planned move from listings
      toward online transactions suggest multiple monetization surfaces, while the
      CEO cautioned that transaction adoption will take time and begin with rentals.
      User reviews on Google Play allege fake or duplicated listings, misleading
      images, and unwanted broker contact; these reports are anecdotal rather than an
      incidence measure, but they identify moderation, verification, and support work
      that could pressure service-delivery costs and conversion. Property Finder says
      reported non-genuine listings reach its team for removal. Diligence should
      therefore prioritize audited segment revenue, realized pricing, gross and
      contribution margins, trust-and-safety cost, cash, burn, debt terms, and a
      downside runway bridge before assigning confidence to profitability or
      self-funding claims.
    claimRefs: [CI010, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams and evidence status
    columns: [Stream, Mechanism, Unit, Public status, Revenue quality, Diligence ask]
    rows:
      - [Professional advertising and listings, "Paid visibility to consumer demand", "Agent, agency, developer, or listing", "Third-party database labels the model advertising; realized price unavailable", "Recurring potential, unverified", "Contracted revenue by product, customer cohort, and term"]
      - [Professional workflow and data tools, "Lead, valuation, and decision-support tooling", "Seat, account, lead, or subscription is possible but unverified", "Products are visible; billing unit and attach are unavailable", "Potential software-like revenue, unverified", "Rate card, realized ARPA, attach, churn, and gross margin"]
      - [Transaction services, "Rent-now-pay-monthly eligibility and tenancy-payment workflow", "Eligible tenancy or payment", "Launched in the Apple listing; fee payer and economics unavailable", "Nascent transaction revenue hypothesis", "Take rate, credit exposure, funding partner, loss allocation, and adoption"]
      - [Strategic ecosystem expansion, "Investment in adjacent real-estate platform Stake", "Undisclosed investment", "Partner confirms the investment; no consideration disclosed", "Capital allocation rather than established operating revenue", "Investment amount, ownership, commercial agreement, and return hurdle"]
    notes: "Mechanisms are limited to retained public evidence; unreported billing units, prices, mix, and margins are shown as unavailable rather than estimated."
    claimRefs: [CI003, CI005, CI009, CI013]
  - id: TI002
    title: Pricing and monetization visibility
    columns: [Surface, Public price or unit, List versus realized, Discount evidence, Underwriting implication]
    rows:
      - [Consumer search app, "Free download and consumer access", "Public list price is zero", "Not applicable to free access", "Supports demand acquisition but does not reveal payer economics"]
      - [B2B listings and advertising, "Unavailable", "Neither list nor realized pricing retained", "Unavailable", "Cannot calculate ARPA, yield per listing, or price realization"]
      - [Rent now pay monthly, "Unavailable", "No fee or take rate disclosed", "Unavailable", "Transaction monetization and credit economics remain unquantified"]
    notes: "The table distinguishes a visible zero consumer price from unavailable B2B and transaction pricing; absence of a public price is not treated as a zero price."
    claimRefs: [CI003, CI004, CI005, CI013]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue, "$117M as of September 2025 in Multiples", "Low; basis may be run-rate or LTM and is not audited in the retained evidence", "Sets scale but not revenue quality", "Audited monthly revenue by stream and geography"]
      - [Gross margin, null, "Unavailable", "Tests marketplace operating leverage and service burden", "Gross margin bridge by product, including moderation and support"]
      - [CAC and payback, null, "Unavailable", "Determines efficiency of B2B customer acquisition", "CAC by channel, sales cycle, payback, and cohort retention"]
      - [Cash and burn, null, "Unavailable", "Required to calculate runway", "Monthly cash, restricted cash, operating burn, and downside plan"]
      - [Debt capacity, "$250M financing reported by Wamda", "Medium on announced amount; low on availability and terms", "Debt service can constrain equity runway", "Drawn balance, pricing, maturity, covenants, security, and amortization"]
    notes: "Null means no value was disclosed in the retained chapter evidence; announced financing is not treated as cash on hand or runway."
    claimRefs: [CI007, CI011, CI013, CI016]
figures:
