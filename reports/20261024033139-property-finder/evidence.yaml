evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: milestones
    missingEvidence: >-
      A primary corporate record that reconciles the 2005 founding date reported by Multiples with the 2007 date
      reported by Stake.
    whyItMatters: Founding date affects company age, historical growth interpretation, and milestone chronology.
    diligencePath: Request incorporation records, the official company history, or a founder-confirmed chronology.
    relatedQuestionRefs:
      - QO006
      - QO010
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Current cap table, valuation, dilution, liquidation preferences, secondary transactions, and board rights.
    whyItMatters: Headline funding totals do not establish investor economics, control, or entry valuation.
    diligencePath: Obtain the latest financing documents, shareholder agreement, cap table, and board materials under NDA.
    relatedQuestionRefs:
      - QO004
      - QO005
      - QO008
  - type: missing-source
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Audited or management-reported revenue, run-rate, customer count, headcount, retention, and market-level
      contribution.
    whyItMatters: Secondary database values are not a substitute for consistent definitions or audited operating performance.
    diligencePath: Request monthly KPI packs, audited accounts, cohort metrics, and definitions for each headline measure.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: marketplace-integrity
    missingEvidence: >-
      Listing-verification rates, complaint volumes, takedown SLAs, repeat-offender controls, and broker-contact consent
