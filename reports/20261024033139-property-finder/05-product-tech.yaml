  - id: TE002
    title: Workflow and use-case table
    columns: [User job, Current workflow, Company solution, Measurable benefit, Limitation]
    rows:
      - [Find a home, Search fragmented listings and compare options, Filters for location budget lifestyle and commute plus alerts, Faster candidate discovery is the stated benefit, No public precision or time-to-match metric]
      - [Assess a property, Compare community amenity and historical context, Home valuation and historical transaction features, More informed pricing decision is the stated benefit, No disclosed valuation error or coverage denominator]
      - [Manage property leads, Track contacts after a listing inquiry, myCRM Pro and Lead Tracker, Centralized lead workflow is the stated benefit, No public lead-to-close or retention metric]
      - [Understand market pricing, Combine realized and asking-price signals, DLD data plus Property Finder asking-price data in Mo'asher, Public transparency and market insight are the stated benefits, Methodology and refresh audit trail are not public here]
      - [Pay or manage rent, Match eligibility to rent-eligible homes and track payments, Rent-now-pay-monthly with income verification, Payment workflow convenience is the stated benefit, Eligibility and compliance performance are not disclosed]
    notes: "Benefits are product-positioning claims or logical workflow implications, not independently measured outcomes. The table separates the job from the missing performance denominator."
    claimRefs: [CE001, CE005, CE007, CE009]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk or diligence question]
    rows:
      - [Discovery interface, Web and mobile search, App inventory and user identity, Cross-market availability and search relevance]
      - [Inventory and property data, Listings property details and agent profiles, Broker submissions and data-quality controls, Duplicate or fake listings and stale attributes]
      - [Location and search services, Autocomplete rental and purchase search, Structured location IDs and filters, API availability and latency under load]
      - [Market intelligence, Valuation historical transactions and Data Finder analysis, DLD monthly data plus proprietary asking-price data, Methodology lineage and model error]
      - [Professional workflow, CRM lead tracking mortgage and training modules, Agent and agency adoption, Integration depth and measurable workflow outcomes]
      - [Trust and support, Reporting flow encryption-in-transit and support response, User reports and internal review operations, Fraud takedown effectiveness privacy controls and incident transparency]
    notes: "This is an evidence-bounded operating model assembled from public feature descriptions and the DLD partnership. It is not a disclosed internal software architecture; dependency and risk fields are diligence questions."
    claimRefs: [CE002, CE006, CE007, CE013, CE014]
