    type: stack
    summary: Property Finder's public product surface can be read as a layered workflow from discovery to data, professional operations, and trust controls.
    data:
      layers:
        - label: Discovery
          detail: Web and mobile apps, search filters, and alerts
          modules: [Web and mobile apps, Search filters, Alerts]
        - label: Inventory
          detail: Listings, property details, and agent profiles
          modules: [Listings, Property details, Agent profiles]
        - label: Intelligence
          detail: Valuation, transaction history, and market analysis
          modules: [Home Valuation, Historical transactions, Data Finder]
        - label: Professional workflow
          detail: Tools for agents, agencies, and financing workflows
          modules: [myCRM Pro, Lead Tracker, Mortgage Finder]
        - label: Transactions and partnerships
          detail: Tenancy payments, digital investing, and government data
          modules: [Rent-now-pay-monthly, Stake connection, Mo'asher]
        - label: Trust and controls
          detail: Reporting, encryption, and support surfaces
          modules: [Report Listing flow, Encryption in transit, Support response]
    approximationNotes: "Layer ordering is an analytical presentation of publicly described modules and dependencies, not a disclosed technical stack or proof of implementation topology."
    claimRefs: [CE001, CE005, CE006, CE007, CE008, CE013]
