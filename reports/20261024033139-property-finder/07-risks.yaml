    columns: [Failure mode, likelihood, severity, mitigation maturity, residual exposure, unresolved gap]
    rows:
      - ["Duplicate or misleading inventory reaches search results", "High", "High", "Medium: stated nightly AI sweeps and source validation", "High", "No independent precision, recall, or takedown-SLA data"]
      - ["Regional inconsistency in listing quality", "High", "High", "Low-medium: Dubai controls are clearer than other-market evidence", "High", "Need market-by-market complaint and verified-listing baselines"]
      - ["Privacy leakage or unsolicited broker contact", "Medium", "High", "Low-medium: app disclosure and reporting channel exist", "Medium-high", "Need consent, access-log, deletion, and incident metrics"]
      - ["Data ingestion, rate-limit, or scraper-facing availability failure", "Medium", "Medium", "Unknown: third-party tooling documents rate-limit and failure settings", "Medium", "Need internal uptime, API dependency, and recovery evidence"]
    notes: "Operational maturity is assessed from stated controls and external user/developer evidence; no internal reliability, security, or quality dashboard was available."
    claimRefs: [CR001, CR002, CR003, CR006, CR012, CR013, CR014]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, counterparty, role, concentration, failure scenario, severity, mitigation, residual exposure]
    rows:
      - ["Regulatory data and listing permissions", "Dubai Land Department / RERA", "Permit and compliance framework", "High for Dubai inventory", "Rule or integration change slows listing activation", "High", "Source-level validation and regulatory partnership", "Medium"]
      - ["Agent and broker supply", "20,000+ professionals claimed in app listing", "Inventory, leads, and customer contact", "Potentially high; concentration is undisclosed", "Agent churn, poor conduct, or supply quality reduces trust", "High", "Verification, Super Agent network, reporting", "High"]
      - ["Capital and strategic investors", "Permira, Blackstone, General Atlantic", "Meaningful minority financing and expansion support", "Material; terms and control rights undisclosed", "Funding conditions, governance friction, or delayed approvals constrain execution", "Medium", "Named advisors and investor expertise", "Medium-high"]
      - ["Property-market transaction activity", "Dubai market participants", "Demand backdrop for listings and advertising", "High in core market", "Volume or price correction reduces agent spend and lead economics", "High", "Regional expansion and product breadth", "Medium-high"]
    notes: "Counterparty roles are sourced from company, regulator, partner, and market sources; concentration is explicitly marked as unknown where ownership or customer data are not disclosed."
    claimRefs: [CR001, CR004, CR005, CR007, CR008, CR009, CR010, CR011]

