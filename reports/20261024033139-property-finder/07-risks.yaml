        - label: Market and financing cycle
          values: [Medium, High, Medium, Medium-high]
        - label: Transaction approval
          values: [Low, Medium, Medium, Low-medium]
        - label: Partner concentration
          values: [Medium, High, Low-medium, Medium-high]
    approximationNotes: "Qualitative ratings synthesize the cited evidence and are not a statistical probability model."
    claimRefs: [CR003, CR006, CR007, CR010, CR013, CR014]

