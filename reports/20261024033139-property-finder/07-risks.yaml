company:
  name: Property Finder
chapter:
  number: 7
  title: Risks
  summary: Property Finder's principal risks are marketplace trust and data-governance failures, execution complexity across markets, and exposure to transaction and funding cycles. Public evidence shows meaningful compliance controls and strong market activity, but user complaints and limited private-company disclosure leave residual exposure that warrants measurable monitoring.
sections:
  - id: trust-and-regulatory
    title: Trust, privacy, and regulatory exposure
    body: Property Finder operates in a high-stakes marketplace where listing accuracy, broker conduct, and personal-data handling directly affect consumer trust. The company says every Dubai listing is verified at source and that AI sweeps remove thousands of duplicate or misleading listings daily, while an app-store review reports fake listings, misleading imagery, and broker harassment. The evidence therefore supports a control framework but not a clean outcome record. DLD compliance is a positive signal, yet independent user evidence makes complaint-resolution and cross-market enforcement material residual risks.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR013, CR014]
    tableRefs: [TR001]
  - id: operating-and-platform
    title: Operating, quality, and platform risk
    body: The platform's operating model depends on continuously ingesting and ranking large volumes of listing data, detecting duplicates, validating permits, and keeping search and contact workflows reliable. A third-party scraper description shows that listings expose verification, RERA, availability, ranking, agent, and contact fields, but also describes rate-limit and failure-handling settings; this is evidence of technical dependence, not proof of Property Finder's own uptime or data quality. User reviews indicate quality can vary by emirate and that reported problems may persist, so monitoring needs to separate Dubai compliance from broader regional performance.
    claimRefs: [CR002, CR003, CR006, CR012, CR013, CR014]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: market-and-financing
    title: Market, partner, and financing dependencies
    body: Property Finder benefits from a large and active Dubai market, but transaction volume and investor activity are cyclical inputs to advertising demand, lead conversion, and agent budgets. Dubai government data reports AED917 billion of 2025 transactions and 20% year-on-year growth, while the company’s financing announcement describes a $525 million meaningful minority investment subject to customary approvals. The sources do not disclose revenue concentration, debt-service headroom, or terms such as liquidation preferences. Expansion and strategic investments can add execution and counterparty dependencies without resolving those information gaps.
    claimRefs: [CR007, CR008, CR009, CR010, CR011]
    tableRefs: [TR003]
  - id: monitoring-and-thesis-breaks
    title: Monitoring plan and thesis-break triggers
    body: The highest-priority monitoring indicators are verified-listing pass rates by market, complaint closure times, repeat reports of fake or misleading inventory, privacy incidents, platform availability, and agent-level concentration. A thesis break would occur if regulatory compliance deteriorates, material privacy or security incidents are not remediated, or complaint evidence shows systematic persistence outside Dubai. Financially, a sustained property-market slowdown combined with weaker agent demand, a refinancing constraint, or adverse financing terms would weaken the case. These triggers are operationally measurable, but public evidence does not provide current baselines for several of them.
    claimRefs: [CR003, CR004, CR006, CR007, CR010, CR013, CR014]
    tableRefs: []

