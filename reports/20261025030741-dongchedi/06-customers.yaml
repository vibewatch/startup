  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention
      missingEvidence: Customer-level cohorts showing NRR, GRR, churn, renewal, repeat purchase, or active-account retention.
      whyItMatters: Audience scale and city coverage do not demonstrate durable monetization or customer lifetime value.
      diligencePath: Request monthly cohort, renewal, repeat-purchase, and churn data segmented by automaker, dealer, consumer transaction, and overseas marketing customer.
      relatedQuestionRefs: [QU004, QU010]
    - type: enumeration-incomplete
      severity: material
      topic: named-proof
      missingEvidence: Named automotive manufacturers, dealers, or overseas brands with production status, contract scope, and measured outcomes.
      whyItMatters: Unnamed collaborations and pilots cannot independently validate referenceability, deployment depth, or expansion.
      diligencePath: Obtain customer-consented references, contracts or case studies, deployment dates, and outcome metrics for each major customer segment.
      relatedQuestionRefs: [QU003, QU008]
      relatedTableRefs: [TU003]
    - type: conflicting-data
      severity: material
      topic: operating-reach
      missingEvidence: A dated company or independent reconciliation of the 280-city versus 350-city coverage figures and dealer count.
      whyItMatters: The denominator and date basis determine whether the used-car network is a broad marketplace or a smaller fulfilled footprint.
      diligencePath: Request a dated city-by-city active inventory, fulfilled-order, store, and cooperating-dealer schedule.
      relatedQuestionRefs: [QU002, QU007]
      relatedTableRefs: [TU002]
    - type: missing-source
      severity: material
      topic: customer-trust
      missingEvidence: Complaint volumes, resolution rates, refund rates, dealer fulfillment, and independent service-quality outcomes.
      whyItMatters: Reported complaints and test controversy may affect conversion and repeat use, but their severity and resolution are unknown.
      diligencePath: Review complaint taxonomy, SLA and resolution logs, refund/return data, dealer scorecards, and independent customer surveys.
      relatedQuestionRefs: [QU009]
