chapter:
  number: 6
  title: Customers
  summary: Dongchedi shows meaningful audience and transaction-surface scale, but the assigned evidence is stronger on platform reach and product coverage than on named production customers, retention, or repeat economics. The customer thesis is therefore credible for acquisition and marketplace breadth while remaining constrained by opaque customer denominators and limited independent outcome evidence.
sections:
  - id: customer-segments-and-jobs
    title: Customer segments and jobs
    body: "Dongchedi serves several linked customer groups rather than one homogeneous buyer. Consumers use the platform for automotive information, car selection, content, rankings, live broadcasts, and used-car transactions. Automotive manufacturers and dealers are the commercial side of the platform, buying access to audience, marketing execution, leads, and increasingly overseas campaign services. Used-car buyers are a distinct transaction segment: the documented “buy online, collect offline” model combines digital selection with physical inspection, transfer, and after-sales support. The evidence supports these jobs and surfaces, but it does not disclose customer-level revenue, payer mix, or the share of activity attributable to ByteDance distribution."
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and operating reach
    body: Available adoption evidence points to growth in audience and a widening operating footprint, but the measures are not interchangeable. Pandaily reports 7.32 million daily active users in the first half of 2023 and 57% growth from the first half of 2021; Bloomberg separately reports about 35.7 million monthly active users from a QuestMobile report published in June, although the fetched text does not identify the report year. A later sector comparison reported 10.041 million average quarterly DAU in Q3 2023, while the used-car model is described as reaching more than 280 cities and, in a dated end-2025 snapshot, more than 350 cities with roughly 30,000 cooperating dealers. These figures indicate reach, not retention or monetization.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
  - id: named-proof-and-durability
    title: Named proof, durability, and concentration
    body: "The evidence is thin on named customer references. DCar Engine is described as piloted in the Middle East and used for overseas brand-account launches, with multiple automotive companies said to have collaborated, but no customer names or outcome metrics are supplied. The used-car proposition includes inspection, fixed-price sale, delivery centers, warranties, and return or compensation policies, yet the available text does not establish renewal, repeat purchase, cohort retention, or realized service quality. Dongchedi’s traffic relationship with Douyin is also material: Bloomberg says the platforms share a user traffic pool, making ByteDance distribution a strategic acquisition advantage and a potential concentration dependency."
    claimRefs: [CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
  - id: customer-risks-and-implications
    title: Expansion and customer diligence risks
    body: "Expansion is visible in the move from content into live selling, offline stores, used cars, and overseas marketing, but the evidence does not show a measured land-and-expand motion from a named account or a repeatable conversion funnel. Commercial durability is also contested: Radar Finance reports outside doubts about professionalism and fairness, more than 340 complaints on a complaint platform at the time of its article, and criticism of the 2023 winter test, while Dongchedi disputed the testing and commercial-interference allegations. These are not proof of systemic failure, but they make customer trust, complaint resolution, dealer fulfillment, and independent outcome verification central diligence items."
    claimRefs: [CU014, CU015, CU016]
    figureRefs: [FU001]
callouts:
  - calloutType: strength
    title: Broad acquisition surface
    body: Audience scale, ByteDance traffic access, used-car transaction infrastructure, and overseas marketing services give Dongchedi multiple ways to acquire and monetize automotive participants.
    claimRefs: [CU005, CU006, CU008, CU010]
  - calloutType: risk
    title: Retention is not demonstrated
    body: No retained source in this pool discloses NRR, GRR, churn, renewal, repeat-purchase cohorts, or customer-level revenue concentration.
    claimRefs: [CU012, CU013]
