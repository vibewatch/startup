callouts:
  - calloutType: strength
    title: Broad product-to-transaction surface
    body: Dongchedi combines content, decision tools, dealer connectivity, and offline transaction fulfillment, giving it more ways to participate in the automotive purchase workflow than a content-only site.
    claimRefs: [CE001, CE002, CE003, CE004, CE007]
  - calloutType: risk
    title: Technical and trust controls are not disclosed
    body: The assigned evidence does not verify APIs, reliability, security, privacy, incident response, or a consistently accepted vehicle-test methodology; these gaps limit confidence in technical defensibility.
    claimRefs: [CE012, CE013, CE014, CE015]
