  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: platform-revenue-sizing
      missingEvidence: >-
        Revenue, gross margin, conversion, take rate, and eligible dealer and
        automaker spend by product line.
      whyItMatters: >-
        Reach and vehicle-unit statistics cannot be converted into platform TAM,
        SAM, SOM, or valuation without monetization and denominator data.
      diligencePath: >-
        Obtain monthly cohort, funnel, pricing, revenue-segment, and contribution
        margin schedules from management and reconcile them to audited or IPO
        materials.
      relatedQuestionRefs: [QM002, QM006, QM008, QM009]
    - type: conflicting-data
      severity: material
      topic: audience-measurement
      missingEvidence: >-
        A consistent audience measurement series defining DAU, MAU, platform scope,
        and the treatment of cross-platform ByteDance traffic.
      whyItMatters: >-
        Reported audience figures use different periods and metrics, so an apparent
        growth trajectory may reflect measurement changes rather than adoption.
      diligencePath: >-
        Request third-party measurement workpapers and platform-level deduplication
        methodology for 2023-2026.
      relatedQuestionRefs: [QM003, QM007, QM010]
    - type: missing-source
      severity: material
      topic: buyer-budget
      missingEvidence: >-
        Independent evidence of dealer and automaker budgets, willingness to pay,
        lead quality, and switching behavior across competing channels.
      whyItMatters: >-
        The buyer map identifies budget owners but does not establish incremental
        ROI or durable pricing power.
      diligencePath: >-
        Interview representative dealer groups and automakers, inspect contracts
        and renewal cohorts, and benchmark attributable sales against Autohome,
        Bitauto, and direct channels.
      relatedQuestionRefs: [QM004, QM005]
