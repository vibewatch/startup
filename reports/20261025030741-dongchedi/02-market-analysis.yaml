chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Dongchedi participates in a multi-sided automotive information and transaction
    market rather than a single vehicle-sales market. Public evidence supports
    meaningful user, dealer, content, and used-car activity, while the absence of
    company revenue disclosure prevents a defensible SAM or SOM calculation.
sections:
  - id: market-boundary
    title: Market boundary and value chain
    body: >-
      The relevant market is the China automotive discovery and transaction
      services layer: consumer research and content, vehicle comparison and
      ranking tools, dealer lead generation, advertising, transaction facilitation,
      and selected used-car fulfillment. BigGo describes Dongchedi's revenue
      sources as cost-per-sale, brand advertising, transaction service fees, and
      value-added services, which is a broader boundary than a pure media site.
      Pandaily similarly describes an independent app that expanded from car
      information into offline selling. The market therefore includes consumer
      attention and purchase-intent monetization, but excludes automaker
      manufacturing revenue, vehicle financing principal, insurance premiums, and
      the full retail value of cars merely listed on the platform. Status-quo
      substitutes include automaker and dealer websites, offline dealerships,
      independent media and creator channels, and direct consumer referrals.
    claimRefs: [CM001, CM002]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing lenses
    body: >-
      Available sources provide several lenses but not a single additive TAM.
      China passenger-vehicle sales reached 10.891 million units in H1 2025, of
      which NEVs represented 5.458 million; a separate CPCA report cited by Global
      Times puts 2025 NEV retail sales at about 12.81 million units. These are
      vehicle-unit demand indicators, not platform revenue. A Dongchedi-focused
      project using 743 valid vehicle entries identifies three attention segments
      and a price threshold, useful for user-intent segmentation but not a market
      value estimate. Company-market reporting supplies platform reach, including
      more than 10 million mobile DAU, over 30,000 dealerships, and over 500
      million users interested in cars as of August 2025, but it does not disclose
      monetized revenue. Consequently, a platform TAM can be framed by reachable
      attention, dealer budgets, and transaction take-rate, while SAM and SOM
      remain open until revenue, conversion, price, and geographic eligibility
      data are obtained.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, adoption drivers, and constraints
    body: >-
      The buyer map is multi-sided. Automakers and dealers are the budget owners
      for advertising, leads, and dealer services; consumers are the users and
      may become transaction payers; creators supply content and attention; and
      Dongchedi operates or coordinates fulfillment where it enters used-car
      transactions. NEV penetration is an important demand driver: China NEV
      passenger-vehicle sales grew 33% year over year in H1 2025 and reached
      50.1% of passenger-vehicle sales in that period. The same transition raises
      information complexity and creates demand for rankings, testing, and
      comparison. Constraints are material: Autohome remains a scaled incumbent,
      Dongchedi's financial performance is not publicly disclosed, its testing
      credibility has faced automaker criticism, and its transaction expansion
      requires offline inspection, delivery, warranty, and dealer execution.
      These factors make adoption and valuation sensitive to trust, measurable
      lead ROI, switching costs, and the ability to monetize attention without
      sacrificing neutrality.
    claimRefs: [CM011, CM012, CM013, CM014, CM015, CM016]
    tableRefs: [TM003]
  - id: diligence-gaps
    title: Sizing and adoption diligence gaps
    body: >-
      The central unresolved question is conversion from reach to durable,
      attributable economics. Public sources report user, creator, dealer, and
      vehicle-unit measures, but no reconciled revenue bridge from advertising,
      cost-per-sale, subscriptions, transaction fees, or value-added services.
      Nor do they isolate China-only eligible spend, dealer acquisition cost,
      lead-to-sale conversion, transaction take rate, repeat purchase behavior,
      or gross margin by service. Reported reach figures also vary by date and
      measurement definition: Dongchedi is described as having 7.32 million DAU
      in H1 2023, more than 10 million mobile DAU in August 2025, and 35.7
      million monthly active users in a Bloomberg report. These are not
      contradictions without a common methodology, but they cannot be combined
      into a growth rate. The investment case needs a cohort-based funnel,
      segment-level budget data, and independent verification of transaction
      quality before a platform-market multiple is reliable.
    claimRefs: [CM017, CM018]
