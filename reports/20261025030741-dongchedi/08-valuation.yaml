      - [Confidence, medium, Financing and IPO signals are corroborated but reported by unnamed sources]
      - [Risk rating, high, Opaque economics and capitalization terms create material downside uncertainty]
      - [Valuation stance, fair only as an unverified reference point, Treat the reported $3 billion mark as an anchor requiring an information discount]
    notes: "Assessment is based on assigned public reporting; no audited Dongchedi financial statements or cap table were available."
    claimRefs: [CV001, CV002, CV004, CV009]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Evidence, What would change the view]
    rows:
      - [Scaled automotive platform, "35.7 million monthly active users reported for June; 7.32 million DAU reported for H1 2023", Reconcile definitions and show conversion to revenue and gross profit]
      - [ByteDance distribution can support reach, "Bloomberg reports shared user traffic with Douyin; Pandaily describes ByteDance origin", Disclose traffic economics and related-party arrangements]
      - ["IPO can unlock liquidity", "China Daily reports possible Hong Kong offering; Bloomberg reports bank selection", "Publish audited accounts, prospectus terms, and timetable"]
      - ["Public-market benchmark is demanding", "Radar Finance compares the mark with Autohome and notes Autohome's share-price decline", "Demonstrate superior growth, margins, retention, or monetization"]
    notes: "User metrics come from different sources, definitions, and periods; they are not converted into a funnel or valuation multiple."
    claimRefs: [CV002, CV003, CV005, CV006, CV007, CV008]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Downside trigger]
    rows:
      - [Bull, "IPO process advances; audited revenue growth and improving margins are disclosed; ByteDance relationship is arm's-length", "Potentially supports or exceeds the reported $3 billion private reference, but no numeric range is supportable", "Prospectus shows weak monetization, material related-party dependence, or adverse unit economics"]
      - [Base, "Reported $3 billion mark remains the only financing anchor; IPO timing and terms remain uncertain", "Research-more; require a negotiated price below the unverified anchor to compensate for missing information", "No audited accounts, cap table, or preference schedule before a financing decision"]
      - [Bear, "IPO is delayed or repriced; public-market multiples compress; reputational or regulatory friction limits monetization", "Down-round or impaired liquidity is plausible; numeric downside cannot be estimated without financials", "Down round, failed listing process, loss of distribution support, or disclosed cash burn"]
    notes: "These are decision scenarios, not forecasts. Numeric valuation ranges are intentionally omitted because public revenue, profit, cash-flow, debt, and capitalization inputs are unavailable."
    claimRefs: [CV001, CV002, CV003, CV009, CV010, CV011, CV012]
