    Dongchedi is a ByteDance-originated automotive platform combining vehicle information, reviews, rankings,
    communities, live content, vehicle-selection tools, dealer services, and transaction surfaces. The evidence supports
    meaningful audience reach and expansion into used-car and offline services, but public disclosure remains
    insufficient to verify standalone economics, ownership, governance, and current headquarters.
