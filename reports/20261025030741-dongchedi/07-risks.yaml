chapter:
  number: 7
  title: Risks
  summary: Dongchedi's principal risks are regulatory exposure from algorithmic recommendation and data governance, dependence on ByteDance-linked distribution and capital-market access, and execution risk in testing and used-car transactions. Public evidence documents applicable controls and several adverse signals, but does not establish current compliance, incident frequency, loss rates, or financial resilience.
sections:
  - id: risk-priorities
    title: Risk priorities and investment implications
    body: >-
      Dongchedi combines a high-reach information product with transaction, testing, and used-car activities, so failure modes can compound across content credibility, consumer protection, and operational liabilities. The most decision-relevant exposures are regulatory and data-governance obligations, parent and financing dependence, and the possibility that quality disputes reduce trust or create remediation costs. The evidence supports a high residual-risk posture rather than a quantified loss estimate: sources report rules, complaints, controversies, and financing plans, but no public disclosure establishes incident rates, reserves, insurance coverage, or cash runway. Monitoring should therefore focus on regulator filings and rectification, substantiated safety or inspection failures, complaint resolution, financing/IPO milestones, and any change in ByteDance support or governance.
    claimRefs: [CR001, CR002, CR003, CR004, CR014, CR015, CR016]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: China's algorithmic-recommendation provisions create a broad compliance perimeter for a platform that ranks, recommends, distributes information, and sells or facilitates services. DigiChina's translation says the rules apply to personalized recommendation, ranking and selection, search filtering, dispatching, and decision-making technologies, and require management systems covering algorithm review, security monitoring, incident response, data security, and personal-information protection. The same text requires complaint channels and feedback, and provides for warnings, correction orders, and, in serious or uncorrected cases under Article 31, suspension of information updates and fines of 10,000 to 100,000 yuan. This is an exposure assessment, not a finding that Dongchedi violated the provisions; the assigned evidence does not verify its filing number, assessments, or remediation history.
    claimRefs: [CR004, CR005, CR006]
    tableRefs: [TR001]
  - id: operational-and-dependency
    title: Operational, quality, and dependency risks
    body: Public reporting describes adverse quality signals in both editorial testing and used-car transactions. Radar Finance reported that Dongchedi's winter-test conclusions were questioned by multiple automakers and industry leaders, while also reporting more than 340 app-related complaints on the Heimao platform, including telephone harassment, unrealistic online quotes, dealer non-performance, and false promotions. Distill's current monitoring page separately highlights a used-car buyer who reported faults shortly after a platform inspection marked the vehicle excellent, and an automotive safety test in which all three tested vehicles reportedly suffered brake-pedal-bracket failures. These reports do not prove systemic failure, but they make test methodology, inspection accuracy, dealer controls, refunds, and complaint closure material diligence items. The operating model also depends on ByteDance-linked traffic and a growing physical fulfillment footprint, creating concentration and fixed-cost sensitivity if traffic, capital, or transaction quality weakens.
    claimRefs: [CR003, CR007, CR008, CR009, CR010]
    tableRefs: [TR002]
  - id: kill-criteria
    title: Monitoring, mitigations, and thesis-break triggers
    body: The mitigation posture should be judged by observable controls rather than by the existence of policies. A credible control package would include a published algorithm filing and assessment trail, documented consumer complaint service levels, independent test protocols with conflict disclosures, inspection-quality sampling and remediation, and transparent financing or IPO disclosures. The current pool does not establish that these controls are complete or effective. A thesis-break event would be a confirmed regulatory suspension or material fine, a substantiated pattern of safety or inspection failures without timely remediation, evidence that ByteDance distribution or financing support is being withdrawn before standalone economics are visible, or a failed capital-market process combined with worsening operating metrics. Until those tests are passed, the risk-adjusted view should remain conservative and avoid false precision about probability or financial impact.
    claimRefs: [CR004, CR006, CR009, CR011, CR012, CR013, CR015, CR016]
    tableRefs: [TR003]
callouts:
  - calloutType: risk
    title: Highest residual exposure
    body: Regulatory and trust risk is amplified because recommendation, content testing, and transactions all touch user decisions and consumer outcomes; current public evidence does not quantify incident frequency or remediation effectiveness.
    claimRefs: [CR004, CR007, CR008, CR009]
  - calloutType: assumption
    title: Evidence boundary
    body: Reported complaints, disputes, and planned financing are risk signals, not proof of systemic misconduct, loss severity, or current non-compliance; those require primary company, regulator, court, insurance, and financial records.
    claimRefs: [CR003, CR006, CR011]
