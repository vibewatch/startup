evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: disclosure
    missingEvidence: Audited revenue, margins, cash balance, burn, headcount, and current customer metrics.
    whyItMatters: >-
      The platform's scale cannot be translated into operating quality, liquidity, or valuation support without
      financial and organizational data.
    diligencePath: >-
      Request audited financial statements, management accounts, KPI definitions, headcount by function, and a current
      cash-flow bridge.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Complete board, executive, founder, beneficial ownership, and preference-rights records.
    whyItMatters: >-
      The separation from ByteDance and reported financing could materially affect control, related-party exposure, and
      investor economics.
    diligencePath: >-
      Obtain the latest corporate registry extracts, cap table, shareholder agreement, board minutes, and IPO filing
      when available.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: users
    missingEvidence: >-
      A consistent current user series reconciling DAU and MAU definitions across QuestMobile and other measurement
      sources.
    whyItMatters: >-
      The reported 7.32 million DAU and 35.7 million MAU are different metrics and cannot establish a single growth
      trajectory.
    diligencePath: >-
      Request source reports and monthly KPI exports with definitions, deduplication rules, geography, and platform
      coverage.
    relatedQuestionRefs:
      - QO003
  - type: access-blocked
    severity: minor
    topic: adverse
    missingEvidence: Primary records for testing methodology, commercial cooperation, and complaint resolution.
    whyItMatters: >-
      Secondary adverse reporting identifies credibility and service risks but does not establish their current severity
      or remediation.
    diligencePath: Review Dongchedi's test protocols, automaker correspondence, complaint-level data, refunds, and remediation logs.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: platform-revenue-sizing
    missingEvidence: Revenue, gross margin, conversion, take rate, and eligible dealer and automaker spend by product line.
    whyItMatters: >-
      Reach and vehicle-unit statistics cannot be converted into platform TAM, SAM, SOM, or valuation without
      monetization and denominator data.
    diligencePath: >-
      Obtain monthly cohort, funnel, pricing, revenue-segment, and contribution margin schedules from management and
      reconcile them to audited or IPO materials.
    relatedQuestionRefs:
      - QM002
      - QM006
      - QM008
      - QM009
  - type: conflicting-data
    severity: material
    topic: audience-measurement
    missingEvidence: >-
      A consistent audience measurement series defining DAU, MAU, platform scope, and the treatment of cross-platform
      ByteDance traffic.
    whyItMatters: >-
      Reported audience figures use different periods and metrics, so an apparent growth trajectory may reflect
      measurement changes rather than adoption.
    diligencePath: Request third-party measurement workpapers and platform-level deduplication methodology for 2023-2026.
    relatedQuestionRefs:
      - QM003
      - QM007
      - QM010
  - type: missing-source
    severity: material
    topic: buyer-budget
    missingEvidence: >-
