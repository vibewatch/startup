      - [Autohome, "Direct incumbent", "About 12m DAU in the Pandaily-cited comparison; 14.148m average quarterly DAU in Q3 2023 in AsiaICT's cited report", "Broad automotive research and advertiser demand", "Established scale and automotive information depth", "Growth described as limited or flat in the cited comparisons"]
      - [Yiche / Bitauto, "Direct platform peer", "Yiche at 6.54m DAU in H1 2023 in Pandaily's comparison; Bitauto named as a peer by Tech in Asia", "Automotive research, media and leads", "Earlier automotive-platform position and dealer relationships", "Relative current scale and pricing are not consistently disclosed"]
