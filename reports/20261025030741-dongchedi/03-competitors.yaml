      - ["Used-car transaction and offline fulfillment", "Supported; online order, offline delivery, diagnostics and warranty described", "Unknown in retained sources", "Unknown in retained sources", "Workflow breadth may raise switching costs but adds execution exposure"]
      - ["Editorial trust and testing credibility", "Mixed; content scale plus reported disputes over winter-test methodology", "Established incumbent reputation is reported but not independently benchmarked here", "No comparable retained trust evidence", "Trust posture is unresolved and should not be treated as a settled advantage"]
    notes: "Cells marked Unknown mean no comparable evidence was retained in the assigned pool; they are not negative findings."
    claimRefs: [CP004, CP008, CP009, CP010, CP013]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Provider, Price or unit, Contract or packaging model, Included capability, Discount or unknown, Competitive implication]
    rows:
      - [Dongchedi, null, "Advertising, lead, transaction, or service model not publicly itemized in retained sources", "Content, AI selection, information lookup, transaction and used-car services", "Realized prices and take rates unknown", "Distribution breadth may support monetization, but price power is unproven"]
      - [Autohome, null, "Media, lead, online marketing and other segments described in a secondary account", "Automotive information, advertising and lead services", "Comparable list and realized prices unknown", "Scale is visible, but direct price comparison is unavailable"]
      - [Yiche / Bitauto, null, "No comparable retained rate card", "Automotive information and platform services", "Pricing, discounts and take rates unknown", "Potential substitute pressure cannot be quantified"]
      - [Dealer-led status quo, null, "Local negotiation and dealer-specific offers", "Advice, inventory access and transaction completion", "Terms vary by dealer and vehicle", "Local execution can compete even without a national platform"]
    notes: "No retained source provides comparable public price cards or realized take rates; nulls are intentional evidence gaps, not zero prices."
    claimRefs: [CP011, CP012, CP014]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: "Dongchedi is positioned as a high-distribution, broad-workflow platform relative to incumbent information peers, with trust and pricing still uncertain."
    data:
      xAxis: "Distribution and traffic leverage (ordinal, 0-10)"
      yAxis: "Purchase-workflow breadth (ordinal, 0-10)"
      points:
        - label: Dongchedi
          x: 8
          y: 8
          detail: "ByteDance-linked distribution, reported high DAU, AI selection, transaction and used-car workflow."
        - label: Autohome
          x: 8
          y: 6
          detail: "Higher reported DAU in retained comparisons and established information platform; newer workflow breadth is not fully evidenced here."
        - label: Yiche / Bitauto
          x: 6
          y: 5
          detail: "Direct platform peer with lower reported DAU in one comparison; current workflow and monetization evidence are incomplete."
        - label: Dealer-led status quo
          x: 3
          y: 7
          detail: "Local transaction execution can be broad, but discovery and cross-market distribution are fragmented."
        - label: Used-car specialist
          x: 5
          y: 8
          detail: "Transaction-focused substitute with potentially strong fulfillment, but no comparable retained national distribution metric."
        - label: Fragmented search and referrals
          x: 4
          y: 4
          detail: "Status-quo discovery path with broad informal inputs but no unified comparison or transaction workflow."
    approximationNotes: "Ordinal coordinates are analyst synthesis from the retained evidence, not measured market-share percentages; unsupported dimensions remain described as unknown in the chapter tables."
    claimRefs: [CP006, CP009, CP012, CP014]
callouts:
  - calloutType: strength
    title: Distribution-to-transaction adjacency
    body: "Dongchedi's strongest competitive argument is the combination of ByteDance-linked reach with an expanding path from content and AI selection into transaction and used-car fulfillment."
    claimRefs: [CP004, CP006, CP009]
  - calloutType: risk
    title: Trust and pricing remain unproven
    body: "Reported testing disputes, complaints, absent comparable price cards, and private financial disclosure prevent a conclusion that Dongchedi has a durable trust or monetization moat."
    claimRefs: [CP010, CP011, CP014]
