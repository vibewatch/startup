company:
  name: Dongchedi
chapter:
  number: 1
  title: Company Overview
  summary: Dongchedi is a ByteDance-originated automotive information, trading, and services platform that became a standalone company in 2023. Public evidence supports meaningful user scale, a 2024 private financing reportedly valuing it near $3 billion, and continued expansion into offline and used-car services, but leadership, ownership, financial performance, and headquarters remain incompletely disclosed.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Dongchedi originated in ByteDance's automotive channel and launched as an independent
      app in 2017. The platform combines automotive information, reviews, rankings, communities,
      live content, vehicle-selection tools, and transaction services rather than operating as
      only a media site. A 2026 industry description says it combines artificial intelligence,
      big-data analytics, and professional automotive media services, while a 2024 report
      describes the standalone product as an automobile information, trading, and services
      platform. Its operating model therefore spans consumer research and commercial
      intermediation, creating a potentially broad funnel but also exposing the business to
      trust, testing, and service-quality scrutiny. Headquarters and a complete legal-entity
      map are not established by the retained public evidence.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: governance-funding-and-leadership
    title: Governance, leadership, and capitalization
    body: >-
      ByteDance began relocating Dongchedi employees to a wholly owned subsidiary in early
      2024, with an independent office contemplated and Dongchedi's strategic leader expected
      to become the legal representative. The same account says the separation could support an
      IPO, external partners, independent accounting, or cost reduction, but gave no specific
      timeline. Later reporting says Dongchedi was carved out in 2023 and raised about $600
      million in 2024 from General Atlantic, Gaorong Ventures, HSG, and KKR at a valuation
      near $3 billion; another report characterizes the round as as much as $600 million and
      says the investors were joint participants. These reports are useful but rely on
      unnamed sources and do not provide a cap table, preference stack, debt schedule, or
      verified cash balance. A March 2026 report says Citigroup and Goldman Sachs were selected
      for a planned Hong Kong IPO, reinforcing strategic separation while leaving timing and
      size uncertain.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO002, TO003]
  - id: scale-milestones-and-open-risks
    title: Scale, milestones, and unresolved diligence
    body: >-
      Dongchedi's disclosed operating indicators show a platform that expanded from content
      into testing, dealer support, and transactions. Pandaily reports 7.32 million daily
      active users in the first half of 2023, up 57% from the first half of 2021, while the
      Bloomberg-syndicated report cites 35.7 million monthly active users in June 2024. Those
      are different populations and periods, so they should not be combined into a single
      growth rate. A Russian-language Baidu encyclopedia entry describes a used-car model
      launched in 2021, more than 150 stores and delivery centers by the end of 2025, and
      coverage of more than 280 cities, but its underlying citations and editorial controls
      require verification. Adverse reporting also records automaker criticism of Dongchedi's
      2023 winter tests and more than 340 user complaints cited by Radar Finance. The key
      overview conclusion is therefore scale with material disclosure and trust gaps, not a
      fully verified financial profile.
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Distribution-backed category position
    body: Dongchedi has a standalone product history, ByteDance distribution ties, reported multi-million user scale, and an expanding online-to-offline automotive workflow.
    claimRefs: [CO001, CO003, CO011, CO012]
  - calloutType: risk
    title: Transparency and credibility remain gating issues
    body: Public sources do not establish audited revenue, current ownership, leadership depth, or a settled IPO timetable, while reported testing criticism and user complaints create diligence questions around platform neutrality and service quality.
    claimRefs: [CO009, CO010, CO015, CO016]
