    title: Evidence-backed revenue model bridge
    summary: Reported platform activities can connect audience and commercial inventory to transactions, but the conversion rates and gross-profit split are not publicly disclosed.
    type: flow
    data:
      nodes:
        - id: audience
          label: "Automotive audience"
          detail: "Bloomberg reports 35.7m monthly active users"
        - id: content
          label: "Content and tools"
          detail: "Information, tools, communities, and car-selection services"
        - id: commercial
          label: "Automaker and dealer demand"
          detail: "Advertising, lead, and partner-service mechanisms are plausible or reported"
        - id: transactions
          label: "New and used-car activity"
          detail: "Reported channels, car products, and offline stores"
        - id: revenue
          label: "Recognized revenue"
          detail: "Dongchedi revenue mix and recognition policy unavailable"
        - id: gross-profit
          label: "Gross profit"
          detail: "Margin by stream unavailable; do not infer from audience or funding"
      edges:
        - [audience, content]
        - [content, commercial]
        - [commercial, revenue]
        - [commercial, transactions]
        - [transactions, revenue]
        - [revenue, gross-profit]
    claimRefs: [CI001, CI003, CI004, CI007]
callouts:
  - calloutType: strength
    title: Audience and financing access are observable
    body: Bloomberg reports 35.7 million monthly active users, while independent coverage reports a $600 million private round and a potential Hong Kong IPO mandate. Those signals support distribution and capital-market access, not profitability.
    claimRefs: [CI003, CI009, CI011, CI014]
  - calloutType: risk
    title: Financial underwriting is disclosure-constrained
    body: Revenue, cash, burn, runway, margin, realized pricing, debt, and working-capital exposure are not disclosed in the retained evidence. The absence of a figure is an evidence gap, not evidence of zero.
    claimRefs: [CI004, CI007, CI010, CI012]
  - calloutType: recommendation
    title: Require stream-level financial diligence before underwriting
    body: Request a 24-month monthly P&L and cash bridge, monetization-stream cohorts, customer concentration, contract and collection data, and IPO use-of-proceeds and dilution terms before relying on the private valuation.
    claimRefs: [CI007, CI010, CI012]
