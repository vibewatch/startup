    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Unit or value, Current status, Evidence quality, Diligence ask]
    rows:
      - [Automaker advertising, "Brand and regional marketing inventory", null, "Mechanism described for comparable platforms; Dongchedi revenue not disclosed", "Third-party reported / proxy", "Obtain billed and collected revenue by advertiser cohort"]
      - [Dealer and lead services, "Dealer subscriptions, lead generation, or display", null, "Plausible from platform scope; realized price and conversion unavailable", "Unverified", "Request lead-to-sale conversion, contract terms, and refunds"]
      - [Content and creator monetization, "Traffic and content products supporting commercial demand", null, "Content investment is reported; revenue attribution unavailable", "Third-party reported", "Reconcile content cost with attributable gross profit"]
      - [New and used-car transactions, "Transaction, dealer, or marketplace services", null, "Used-car channel, car products, and offline stores are reported", "Third-party reported", "Obtain GMV, take rate, inventory ownership, and service-cost data"]
      - [Financing or adjacent services, "Potential auto-finance or partner-led services", null, "No Dongchedi-specific current economics retained", "Gap", "Clarify whether revenue is principal, agent, referral, or absent"]
    notes: "Streams are analytical categories grounded in reported platform activities and comparable-platform descriptions; Dongchedi has not publicly disclosed current revenue mix, realized pricing, or recognition policy in the retained sources."
    claimRefs: [CI001, CI002, CI004]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Metric or offer, Value, Basis, Interpretation, Diligence ask]
    rows:
      - [Automaker/dealer list pricing, null, "No Dongchedi price card retained", "Cannot infer realized revenue or margin", "Obtain current rate card and realized net price by product"]
      - [Winter-test cooperation package, "6m-16m yuan reported", "Pandaily cites a promotional page", "Disputed allegation; not recognized revenue", "Validate contracts, invoices, collection, and whether packages existed"]
      - [Audience scale, "35.7m MAU", "Quest Mobile figure reported by Bloomberg", "Reach proxy, not paying-customer count", "Request monetized accounts, engagement, and conversion cohorts"]
      - [Potential IPO proceeds, "$1bn-$1.5bn", "People familiar with the matter, via China Daily/Ainvest", "Financing scenario, not operating revenue", "Obtain prospectus, use-of-proceeds plan, and dilution terms"]
    notes: "Dollar and yuan figures retain their source basis and are not converted into revenue, ARR, cash, or gross profit."
    claimRefs: [CI003, CI006, CI013, CI014]
  - id: TI003
    title: Unit-economics underwriting checklist
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue per MAU, null, low, "Separates audience scale from monetization", "Monthly revenue by user cohort and monetization surface"]
      - [Advertiser/dealer CAC or sales cost, null, low, "Tests sales efficiency and channel dependence", "Sales payroll, traffic spend, cycle time, and payback"]
      - [Lead conversion and take rate, null, low, "Tests marketplace economics", "Lead funnel, closed-won definition, take rate, and refunds"]
      - [Gross margin by stream, null, low, "Separates scalable media economics from service delivery", "COGS allocation, partner fees, incentives, and fulfillment costs"]
      - [Cash burn and runway, null, low, "Tests financing dependency", "Monthly cash flow, restricted cash, debt, capex, and 24-month plan"]
      - [Working-capital exposure, null, low, "Tests inventory and settlement risk", "Receivables, payables, deposits, inventory ownership, and aging"]
    notes: "Nulls mean the metric was not publicly disclosed in the retained evidence; each null has a specific diligence request rather than a zero assumption."
    claimRefs: [CI004, CI007, CI010, CI012]
