      - number: '1.3'
        title: Scale, milestones, and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              Dongchedi's disclosed operating indicators show a platform that expanded from content into testing, dealer
              support, and transactions. Pandaily reports 7.32 million daily active users in the first half of 2023, up
              57% from the first half of 2021, while the Bloomberg-syndicated report cites 35.7 million monthly active
              users in June 2024. Those are different populations and periods, so they should not be combined into a
              single growth rate. A Russian-language Baidu encyclopedia entry describes a used-car model launched in
              2021, more than 150 stores and delivery centers by the end of 2025, and coverage of more than 280 cities,
              but its underlying citations and editorial controls require verification. Adverse reporting also records
              automaker criticism of Dongchedi's 2023 winter tests and more than 340 user complaints cited by Radar
              Finance. The key overview conclusion is therefore scale with material disclosure and trust gaps, not a
              fully verified financial profile.
