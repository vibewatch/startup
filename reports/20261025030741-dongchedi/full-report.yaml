      - number: '5.3'
        title: Differentiation, trust, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Dongchedi's apparent differentiation is the combination of ByteDance distribution, content investment,
              automotive data, and a move into transaction fulfillment. ICV reported that the company originated inside
              Toutiao, became an independent app in 2017, and expanded from content and tools into trading and offline
              stores. Pandaily reported a CNY 500 million investment announced for 100 core video IP programs and later
              creator programming for new-energy-vehicle content. Those are capability and investment signals, not proof
              of defensible algorithms or durable engagement. Trust is a material product risk because vehicle
              evaluations influence purchase decisions. Radar Finance reported that automakers and industry figures
              challenged Dongchedi's 2023 winter-test methodology, while Dongchedi responded that the test used uniform
              standards in below-minus-20-degree conditions. Electrek's account of a 36-car ADAS test described
              inconsistent outcomes across vehicles and within brands; that evidence demonstrates ambitious test
              production, but it does not independently validate repeatability or methodology. The assigned sources do
              not establish a security certification, privacy control, incident response process, regulatory approval,
              or independently verified test protocol. A diligence process should therefore treat technical
              defensibility and trust controls as open questions, especially as the company links editorial influence to
              commerce and physical vehicle delivery.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad product-to-transaction surface
            body: >-
              Dongchedi combines content, decision tools, dealer connectivity, and offline transaction fulfillment,
              giving it more ways to participate in the automotive purchase workflow than a content-only site.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE007
          - type: callout
            title: Technical and trust controls are not disclosed
            body: >-
              The assigned evidence does not verify APIs, reliability, security, privacy, incident response, or a
              consistently accepted vehicle-test methodology; these gaps limit confidence in technical defensibility.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and jobs
        blocks:
          - type: paragraph
            body: >-
              Dongchedi serves several linked customer groups rather than one homogeneous buyer. Consumers use the
              platform for automotive information, car selection, content, rankings, live broadcasts, and used-car
              transactions. Automotive manufacturers and dealers are the commercial side of the platform, buying access
              to audience, marketing execution, leads, and increasingly overseas campaign services. Used-car buyers are
              a distinct transaction segment: the documented “buy online, collect offline” model combines digital
              selection with physical inspection, transfer, and after-sales support. The evidence supports these jobs
              and surfaces, but it does not disclose customer-level revenue, payer mix, or the share of activity
              attributable to ByteDance distribution.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU009
      - number: '6.2'
        title: Adoption trajectory and operating reach
        blocks:
          - type: paragraph
            body: >-
              Available adoption evidence points to growth in audience and a widening operating footprint, but the
              measures are not interchangeable. Pandaily reports 7.32 million daily active users in the first half of
              2023 and 57% growth from the first half of 2021; Bloomberg separately reports about 35.7 million monthly
              active users from a QuestMobile report published in June, although the fetched text does not identify the
              report year. A later sector comparison reported 10.041 million average quarterly DAU in Q3 2023, while the
              used-car model is described as reaching more than 280 cities and, in a dated end-2025 snapshot, more than
              350 cities with roughly 30,000 cooperating dealers. These figures indicate reach, not retention or
              monetization.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
      - number: '6.3'
        title: Named proof, durability, and concentration
        blocks:
          - type: paragraph
            body: >-
              The evidence is thin on named customer references. DCar Engine is described as piloted in the Middle East
              and used for overseas brand-account launches, with multiple automotive companies said to have
              collaborated, but no customer names or outcome metrics are supplied. The used-car proposition includes
              inspection, fixed-price sale, delivery centers, warranties, and return or compensation policies, yet the
              available text does not establish renewal, repeat purchase, cohort retention, or realized service quality.
              Dongchedi’s traffic relationship with Douyin is also material: Bloomberg says the platforms share a user
              traffic pool, making ByteDance distribution a strategic acquisition advantage and a potential
              concentration dependency.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU010
              - CU013
      - number: '6.4'
        title: Expansion and customer diligence risks
        blocks:
          - type: paragraph
            body: >-
              Expansion is visible in the move from content into live selling, offline stores, used cars, and overseas
              marketing, but the evidence does not show a measured land-and-expand motion from a named account or a
              repeatable conversion funnel. Commercial durability is also contested: Radar Finance reports outside
              doubts about professionalism and fairness, more than 340 complaints on a complaint platform at the time of
              its article, and criticism of the 2023 winter test, while Dongchedi disputed the testing and
              commercial-interference allegations. These are not proof of systemic failure, but they make customer
              trust, complaint resolution, dealer fulfillment, and independent outcome verification central diligence
              items.
            claimRefs:
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU013
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad acquisition surface
            body: >-
              Audience scale, ByteDance traffic access, used-car transaction infrastructure, and overseas marketing
              services give Dongchedi multiple ways to acquire and monetize automotive participants.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU008
              - CU010
          - type: callout
            title: Retention is not demonstrated
            body: >-
              No retained source in this pool discloses NRR, GRR, churn, renewal, repeat-purchase cohorts, or
              customer-level revenue concentration.
            calloutType: risk
            claimRefs:
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk priorities and investment implications
        blocks:
          - type: paragraph
            body: >-
              Dongchedi combines a high-reach information product with transaction, testing, and used-car activities, so
              failure modes can compound across content credibility, consumer protection, and operational liabilities.
              The most decision-relevant exposures are regulatory and data-governance obligations, parent and financing
              dependence, and the possibility that quality disputes reduce trust or create remediation costs. The
              evidence supports a high residual-risk posture rather than a quantified loss estimate: sources report
              rules, complaints, controversies, and financing plans, but no public disclosure establishes incident
              rates, reserves, insurance coverage, or cash runway. Monitoring should therefore focus on regulator
              filings and rectification, substantiated safety or inspection failures, complaint resolution,
              financing/IPO milestones, and any change in ByteDance support or governance.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              China's algorithmic-recommendation provisions create a broad compliance perimeter for a platform that
              ranks, recommends, distributes information, and sells or facilitates services. DigiChina's translation
              says the rules apply to personalized recommendation, ranking and selection, search filtering, dispatching,
              and decision-making technologies, and require management systems covering algorithm review, security
              monitoring, incident response, data security, and personal-information protection. The same text requires
              complaint channels and feedback, and provides for warnings, correction orders, and, in serious or
              uncorrected cases under Article 31, suspension of information updates and fines of 10,000 to 100,000 yuan.
              This is an exposure assessment, not a finding that Dongchedi violated the provisions; the assigned
              evidence does not verify its filing number, assessments, or remediation history.
            claimRefs:
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR012
              - CR014
      - number: '7.3'
        title: Operational, quality, and dependency risks
        blocks:
          - type: paragraph
            body: >-
              Public reporting describes adverse quality signals in both editorial testing and used-car transactions.
              Radar Finance reported that Dongchedi's winter-test conclusions were questioned by multiple automakers and
              industry leaders, while also reporting more than 340 app-related complaints on the Heimao platform,
              including telephone harassment, unrealistic online quotes, dealer non-performance, and false promotions.
              Distill's current monitoring page separately highlights a used-car buyer who reported faults shortly after
              a platform inspection marked the vehicle excellent, and an automotive safety test in which all three
              tested vehicles reportedly suffered brake-pedal-bracket failures. These reports do not prove systemic
              failure, but they make test methodology, inspection accuracy, dealer controls, refunds, and complaint
              closure material diligence items. The operating model also depends on ByteDance-linked traffic and a
              growing physical fulfillment footprint, creating concentration and fixed-cost sensitivity if traffic,
              capital, or transaction quality weakens.
            claimRefs:
              - CR003
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR007
              - CR008
              - CR009
              - CR010
              - CR014
              - CR015
      - number: '7.4'
        title: Monitoring, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The mitigation posture should be judged by observable controls rather than by the existence of policies. A
              credible control package would include a published algorithm filing and assessment trail, documented
              consumer complaint service levels, independent test protocols with conflict disclosures,
              inspection-quality sampling and remediation, and transparent financing or IPO disclosures. The current
              pool does not establish that these controls are complete or effective. A thesis-break event would be a
              confirmed regulatory suspension or material fine, a substantiated pattern of safety or inspection failures
              without timely remediation, evidence that ByteDance distribution or financing support is being withdrawn
              before standalone economics are visible, or a failed capital-market process combined with worsening
              operating metrics. Until those tests are passed, the risk-adjusted view should remain conservative and
              avoid false precision about probability or financial impact.
            claimRefs:
              - CR004
              - CR006
              - CR009
              - CR011
              - CR012
              - CR013
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR011
              - CR013
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest residual exposure
            body: >-
              Regulatory and trust risk is amplified because recommendation, content testing, and transactions all touch
              user decisions and consumer outcomes; current public evidence does not quantify incident frequency or
              remediation effectiveness.
            calloutType: risk
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR009
          - type: callout
            title: Evidence boundary
            body: >-
              Reported complaints, disputes, and planned financing are risk signals, not proof of systemic misconduct,
              loss severity, or current non-compliance; those require primary company, regulator, court, insurance, and
              financial records.
            calloutType: assumption
            claimRefs:
              - CR003
              - CR006
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and valuation stance
        blocks:
          - type: paragraph
            body: >-
              The evidence supports research-more, not a buy or a precise target price. Bloomberg reported a fundraising
              round valuing Dongchedi close to $3 billion and described approximately 35.7 million monthly active users,
              while China Daily reported a possible Hong Kong offering that could raise $1 billion to $1.5 billion; both
              accounts identify unnamed sources and leave timing and size subject to change. Those signals establish a
              financing reference point, not fair value. The key positive is a scaled automotive information, trading,
              and services platform with access to ByteDance traffic. The key negative is that public evidence still
              does not disclose revenue, margins, cash generation, ownership, dilution, or liquidation preferences.
              Autohome is a useful business-model and public-market comparator, but its disclosed profitability and
              trading multiples cannot be transplanted to a private company with a different disclosure set. Until
              management provides audited financials and a capitalization table, entry discipline should require a price
              no higher than independently supported financing terms and a material information discount.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV009
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV009
      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Dongchedi can convert ByteDance distribution, automotive content, and transaction
              tooling into a scaled monetization platform. Pandaily describes the product as originating in Toutiao's
              car channel and reports 7.32 million daily active users in the first half of 2023; Bloomberg separately
              reports 35.7 million monthly active users in June, illustrating scale but also a metric-definition and
              period mismatch that prevents direct conversion. The anti-thesis is that platform scale has not yet been
              translated into public evidence of durable economics. Radar Finance reports that outside observers
              questioned testing professionalism and fairness, while also noting that Dongchedi had not disclosed
              financial data; it compares the reported $3 billion valuation with Autohome and warns that Autohome's
              public-market performance creates a difficult benchmark. A positive IPO process could improve disclosure
              and liquidity, but a delay, down round, or weak filing would expose the valuation gap.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: Scenarios, comparables, and diligence
        blocks:
          - type: paragraph
            body: >-
              A conventional revenue multiple or discounted cash-flow model is not supportable from the assigned public
              evidence because revenue, growth, gross margin, operating margin, cash flow, and net debt are absent. The
              scenarios therefore use valuation logic rather than invented outputs. The bull case requires an IPO or
              financing at or above the reported $3 billion reference with audited growth, improving monetization, clean
              governance, and no material preference overhang. The base case assumes the reported private mark is an
              unverified anchor and that IPO timing or terms remain uncertain; capital should be held back until
              disclosure improves. The bear case is a down round or delayed listing caused by weak monetization,
              regulatory or reputational friction, parent-dependency concerns, or public-market multiple compression.
              Exit readiness depends on audited accounts, a reconciled cap table, related-party arrangements with
              ByteDance, and a credible path from users to revenue and cash generation.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Evidence boundaries
        blocks:
          - type: paragraph
            body: >-
              The available evidence is directional rather than complete. Reported financing and IPO plans are
              attributed to people familiar with the matter or media reporting, not company filings. Autohome data
              provides a public comparator but not a verified Dongchedi multiple. Forge's private-market examples show
              that funding rounds can establish post-money marks, but the examples are from unrelated sectors and cannot
              establish a Dongchedi benchmark. The decision should therefore be revisited when audited financials, final
              IPO documents, investor rights, and transaction-level unit economics become available.
            claimRefs:
              - CV002
              - CV003
              - CV009
              - CV012
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more at reported private mark
            body: >-
              A reported $3 billion valuation is an anchor, not a supported fair value; require audited revenue and
              capitalization evidence before underwriting.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV009
          - type: callout
            title: IPO optionality is not liquidity
            body: >-
              Potential Hong Kong listing plans may improve disclosure, but timing, size, dilution, and execution remain
              uncertain.
            calloutType: risk
            claimRefs:
              - CV002
              - CV003
              - CV010
          - type: callout
            title: No false precision
            body: >-
              Revenue and cash-flow inputs are not public in the assigned evidence, so scenario values remain unpriced
              pending diligence.
            calloutType: assumption
            claimRefs:
              - CV009
              - CV012
