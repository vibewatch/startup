      and periods, so no conversion or market-value inference is made.
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: >-
      Dongchedi is positioned as a high-distribution, broad-workflow platform relative to incumbent information peers,
      with trust and pricing still uncertain.
    data:
      xAxis: Distribution and traffic leverage (ordinal, 0-10)
      yAxis: Purchase-workflow breadth (ordinal, 0-10)
      points:
        - label: Dongchedi
          x: 8
          'y': 8
          detail: ByteDance-linked distribution, reported high DAU, AI selection, transaction and used-car workflow.
        - label: Autohome
          x: 8
          'y': 6
          detail: >-
            Higher reported DAU in retained comparisons and established information platform; newer workflow breadth is
            not fully evidenced here.
        - label: Yiche / Bitauto
          x: 6
          'y': 5
          detail: >-
            Direct platform peer with lower reported DAU in one comparison; current workflow and monetization evidence
            are incomplete.
        - label: Dealer-led status quo
          x: 3
          'y': 7
          detail: Local transaction execution can be broad, but discovery and cross-market distribution are fragmented.
        - label: Used-car specialist
          x: 5
          'y': 8
          detail: >-
            Transaction-focused substitute with potentially strong fulfillment, but no comparable retained national
            distribution metric.
        - label: Fragmented search and referrals
          x: 4
          'y': 4
          detail: Status-quo discovery path with broad informal inputs but no unified comparison or transaction workflow.
    approximationNotes: >-
      Ordinal coordinates are analyst synthesis from the retained evidence, not measured market-share percentages;
      unsupported dimensions remain described as unknown in the chapter tables.
    claimRefs:
