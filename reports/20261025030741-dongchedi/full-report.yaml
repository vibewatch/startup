  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and public traction
        blocks:
          - type: paragraph
            body: >-
              Dongchedi is described as an automobile information, trading, and services platform rather than a pure
              subscription software business. The available evidence supports several potential revenue
              streams—automaker and dealer advertising, lead generation, transaction services, and used-car activity—but
              does not provide Dongchedi revenue by stream or a published price card. Pandaily's account says the
              product covers content, tools, communities, and car-selection services, while its disclosed operating
              history includes dealer support, used-car channels, car products, and offline stores. Those activities
              imply different revenue-recognition and service-cost profiles, so a single ARR or SaaS-multiple framing
              would be inappropriate. Bloomberg reports about 35.7 million monthly active users, but that is audience
              reach, not monetized customers or revenue. Public financial statements, take rate, conversion, customer
              concentration, and realized pricing remain unavailable.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI004
      - number: '4.2'
        title: Pricing, cost structure, and unit economics
        blocks:
          - type: paragraph
            body: >-
              No retained source establishes Dongchedi's list prices, realized discounts, sales-cycle length, CAC,
              payback, gross margin, contribution margin, or customer retention. A third-party report describes
              commercial cooperation packages around the 2023 winter test, including quoted amounts from 6 million to 16
              million yuan, but the same source also reports a denial that any of the 53 participating cars had
              commercial cooperation. These are disputed promotional allegations, not evidence of realized revenue or a
              repeatable price list. The cost base is likely heterogeneous: content and creator spending, traffic
              acquisition, dealer or transaction operations, offline inventory/service delivery, and platform
              engineering can have different variable-cost behavior. An industry summary citing S&P describes soft
              demand, persistent EV price pressure, and intensified competition; that is a market margin risk, not a
              Dongchedi margin observation. An authorized 36Kr analysis also records criticism that extreme test
              scenarios may differ from real-world road conditions, reinforcing the reputational sensitivity of
              monetized testing. Underwriting should request cohort contribution by monetization stream and reconcile
              billed, collected, refunded, and deferred amounts.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI013
              - CI015
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI006
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI007
              - CI010
              - CI012
      - number: '4.3'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The reported 2024 private financing was about $600 million at a valuation close to $3 billion, and later
              coverage describes a possible Hong Kong IPO that could raise $1 billion to $1.5 billion. Bloomberg's March
              2026 report says Citi and Goldman Sachs were selected for the planned offering, but the process is private
              and may change. These figures describe financing or valuation, not revenue, cash on hand, runway, or cash
              available to the operating company. The sources do not disclose debt, restricted cash, burn, working
              capital, capex, use of proceeds, or the threshold that would trigger another financing. The reported
              ByteDance carve-out and shared Douyin traffic create a financing-dependency question: the company may
              benefit from distribution while still needing to prove standalone traffic, infrastructure, and corporate
              costs. A reasonable financial verdict is research-more: audience and capital-market access are credible
              strengths, while revenue quality, margin path, liquidity, and ownership economics remain material
              diligence blockers.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI014
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI007
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Audience and financing access are observable
            body: >-
              Bloomberg reports 35.7 million monthly active users, while independent coverage reports a $600 million
              private round and a potential Hong Kong IPO mandate. Those signals support distribution and capital-market
              access, not profitability.
            calloutType: strength
            claimRefs:
              - CI003
              - CI009
              - CI011
              - CI014
          - type: callout
            title: Financial underwriting is disclosure-constrained
            body: >-
              Revenue, cash, burn, runway, margin, realized pricing, debt, and working-capital exposure are not
              disclosed in the retained evidence. The absence of a figure is an evidence gap, not evidence of zero.
            calloutType: risk
            claimRefs:
