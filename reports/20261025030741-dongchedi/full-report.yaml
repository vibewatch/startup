chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Dongchedi originated in ByteDance's automotive channel and launched as an independent app in 2017. The
              platform combines automotive information, reviews, rankings, communities, live content, vehicle-selection
              tools, and transaction services rather than operating as only a media site. A 2026 industry description
              says it combines artificial intelligence, big-data analytics, and professional automotive media services,
              while a 2024 report describes the standalone product as an automobile information, trading, and services
              platform. Its operating model therefore spans consumer research and commercial intermediation, creating a
              potentially broad funnel but also exposing the business to trust, testing, and service-quality scrutiny.
              Headquarters and a complete legal-entity map are not established by the retained public evidence.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO011
              - CO012
              - CO013
      - number: '1.2'
        title: Governance, leadership, and capitalization
        blocks:
          - type: paragraph
            body: >-
              ByteDance began relocating Dongchedi employees to a wholly owned subsidiary in early 2024, with an
              independent office contemplated and Dongchedi's strategic leader expected to become the legal
              representative. The same account says the separation could support an IPO, external partners, independent
              accounting, or cost reduction, but gave no specific timeline. Later reporting says Dongchedi was carved
              out in 2023 and raised about $600 million in 2024 from General Atlantic, Gaorong Ventures, HSG, and KKR at
              a valuation near $3 billion; another report characterizes the round as as much as $600 million and says
              the investors were joint participants. These reports are useful but rely on unnamed sources and do not
              provide a cap table, preference stack, debt schedule, or verified cash balance. A March 2026 report says
              Citigroup and Goldman Sachs were selected for a planned Hong Kong IPO, reinforcing strategic separation
              while leaving timing and size uncertain.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
