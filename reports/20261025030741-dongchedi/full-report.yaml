  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and value chain
        blocks:
          - type: paragraph
            body: >-
              The relevant market is the China automotive discovery and transaction services layer: consumer research
              and content, vehicle comparison and ranking tools, dealer lead generation, advertising, transaction
              facilitation, and selected used-car fulfillment. BigGo describes Dongchedi's revenue sources as
              cost-per-sale, brand advertising, transaction service fees, and value-added services, which is a broader
              boundary than a pure media site. Pandaily similarly describes an independent app that expanded from car
              information into offline selling. The market therefore includes consumer attention and purchase-intent
              monetization, but excludes automaker manufacturing revenue, vehicle financing principal, insurance
              premiums, and the full retail value of cars merely listed on the platform. Status-quo substitutes include
              automaker and dealer websites, offline dealerships, independent media and creator channels, and direct
              consumer referrals.
            claimRefs:
              - CM001
              - CM002
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Available sources provide several lenses but not a single additive TAM. China passenger-vehicle sales
              reached 10.891 million units in H1 2025, of which NEVs represented 5.458 million; a separate CPCA report
              cited by Global Times puts 2025 NEV retail sales at about 12.81 million units. These are vehicle-unit
              demand indicators, not platform revenue. A Dongchedi-focused project using 743 valid vehicle entries
              identifies three attention segments and a price threshold, useful for user-intent segmentation but not a
              market value estimate. Company-market reporting supplies platform reach, including more than 10 million
              mobile DAU, over 30,000 dealerships, and over 500 million users interested in cars as of August 2025, but
              it does not disclose monetized revenue. Consequently, a platform TAM can be framed by reachable attention,
              dealer budgets, and transaction take-rate, while SAM and SOM remain open until revenue, conversion, price,
              and geographic eligibility data are obtained.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM009
      - number: '2.3'
        title: Buyers, adoption drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The buyer map is multi-sided. Automakers and dealers are the budget owners for advertising, leads, and
              dealer services; consumers are the users and may become transaction payers; creators supply content and
              attention; and Dongchedi operates or coordinates fulfillment where it enters used-car transactions. NEV
              penetration is an important demand driver: China NEV passenger-vehicle sales grew 33% year over year in H1
              2025 and reached 50.1% of passenger-vehicle sales in that period. The same transition raises information
              complexity and creates demand for rankings, testing, and comparison. Constraints are material: Autohome
              remains a scaled incumbent, Dongchedi's financial performance is not publicly disclosed, its testing
              credibility has faced automaker criticism, and its transaction expansion requires offline inspection,
              delivery, warranty, and dealer execution. These factors make adoption and valuation sensitive to trust,
              measurable lead ROI, switching costs, and the ability to monetize attention without sacrificing
              neutrality.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM012
              - CM013
      - number: '2.4'
        title: Sizing and adoption diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The central unresolved question is conversion from reach to durable, attributable economics. Public
              sources report user, creator, dealer, and vehicle-unit measures, but no reconciled revenue bridge from
              advertising, cost-per-sale, subscriptions, transaction fees, or value-added services. Nor do they isolate
              China-only eligible spend, dealer acquisition cost, lead-to-sale conversion, transaction take rate, repeat
              purchase behavior, or gross margin by service. Reported reach figures also vary by date and measurement
              definition: Dongchedi is described as having 7.32 million DAU in H1 2023, more than 10 million mobile DAU
              in August 2025, and 35.7 million monthly active users in a Bloomberg report. These are not contradictions
              without a common methodology, but they cannot be combined into a growth rate. The investment case needs a
              cohort-based funnel, segment-level budget data, and independent verification of transaction quality before
              a platform-market multiple is reliable.
            claimRefs:
              - CM017
              - CM018
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The investable market is monetized intent, not vehicle volume
            body: >-
              NEV and passenger-vehicle volumes establish demand context, but Dongchedi's economic opportunity depends
              on attributable attention, dealer and automaker budgets, transaction conversion, and service take rates.
            calloutType: insight
            claimRefs:
              - CM002
              - CM005
              - CM007
              - CM009
          - type: callout
            title: Reach metrics do not yet prove a scalable SAM
            body: >-
              Audience figures vary by period and metric, while revenue, conversion, and margin disclosures are absent;
              valuation work should therefore use scenario ranges only after management supplies a reconciled funnel.
            calloutType: risk
            claimRefs:
              - CM015
              - CM017
              - CM018
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and category boundaries
        blocks:
          - type: paragraph
            body: >-
              Dongchedi's relevant competitive set spans automotive information platforms, transaction and
              lead-generation services, used-car marketplaces, and the status quo of dealer-led research. Tech in Asia
              describes Dongchedi as an automotive information and trading platform that competes with Autohome and
              Bitauto, while China Daily identifies the same peer set after the company became standalone. The
              comparison is therefore not limited to media traffic: it includes content discovery, vehicle comparison,
              lead generation, and increasingly the execution of a purchase. Pandaily's historical account says
              Dongchedi originated as Toutiao's car channel and later added offline car-selling activity, whereas the
              Baidu encyclopedia entry describes a used-car model combining online ordering with offline delivery. This
              breadth makes Autohome and Yiche direct platform peers, used-car marketplaces adjacent transaction
              competitors, and dealer groups plus fragmented search the status quo substitute. The evidence does not
              establish that every listed competitor offers the same end-to-end workflow, so unlike-for-like comparisons
              are marked as unknown where public data are absent.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP007
      - number: '3.2'
        title: Capability, distribution, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              Dongchedi's principal differentiation is the combination of ByteDance distribution, short-form and live
              content, and a path from discovery to transaction. Pandaily reports that Dongchedi's daily active users
              rose 57% from the first half of 2021 to the first half of 2023, reaching 7.32 million, while Autohome's
              daily active users were around 12 million and Yiche reached 6.54 million in the cited comparison. The same
              source reports that Autohome remained the largest platform and that Dongchedi had expanded into offline
              selling, but it also notes that earlier Autohome and Yiche offline attempts were not sustained. AsiaICT
              gives a different measurement frame, placing Dongchedi second with 10.041 million average quarterly DAU in
              Q3 2023 versus Autohome first at 14.148 million; this is a reported discrepancy in period and methodology,
              not a reason to pick one number as canonical. Sina reports that Dongchedi launched AI vehicle selection in
              2025 with fuzzy search, multi-car comparison, information lookup, transaction, and service functions.
              These features can increase decision support and conversion potential, but the sources do not disclose
              comparative conversion, retention, realized pricing, or unit economics. Trust is a material counterweight:
              AsiaICT recounts disputes over winter-test methodology and user complaints, so editorial credibility is a
              competitive variable rather than an assumed moat.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP008
              - CP009
              - CP010
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP006
              - CP009
              - CP012
              - CP014
      - number: '3.3'
        title: Moat durability, pricing, and displacement risks
        blocks:
          - type: paragraph
            body: >-
              The defensible part of Dongchedi's position is likely distribution and workflow integration, not a
              publicly demonstrated pricing moat. Tech in Asia reports a potential 2026 Hong Kong IPO and a proposed
              US$1 billion to US$1.5 billion offering, while the underlying platform remains private and does not
              publish a comparable rate card. Jiemian's 2025 monitoring report says automotive websites were the core
              media channel for advertisers and that mobile Dongchedi and Autohome were ahead of Yiche and Baidu on
              advertiser presence, supporting the importance of distribution but not proving relative monetization.
              Sina's AI-selection launch and Baidu's used-car workflow evidence indicate product expansion, yet they
              also increase operational complexity and expose the platform to execution, fulfillment, and trust costs.
              The competitive threat is therefore two-sided: Autohome retains scale and established data depth, while
              Yiche, dealers, and specialized used-car operators can narrow functional gaps or compete on transaction
              execution. Pricing comparisons remain an evidence gap because no retained source provides comparable list
              or realized prices for Dongchedi, Autohome, and Yiche.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP012
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution-to-transaction adjacency
            body: >-
              Dongchedi's strongest competitive argument is the combination of ByteDance-linked reach with an expanding
              path from content and AI selection into transaction and used-car fulfillment.
            calloutType: strength
            claimRefs:
