            title: Require stream-level financial diligence before underwriting
            body: >-
              Request a 24-month monthly P&L and cash bridge, monetization-stream cohorts, customer concentration,
              contract and collection data, and IPO use-of-proceeds and dilution terms before relying on the private
              valuation.
            calloutType: recommendation
            claimRefs:
              - CI007
              - CI010
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Dongchedi began as Toutiao's automotive channel and launched as an independent app in 2017. The reported
              product surface combines automotive content, tools, communities, vehicle databases, rankings, live
              broadcasts, and new- and used-car transaction services. That breadth matters because the platform is not
              simply a media property: it can attract a shopper with editorial or creator content, support comparison
              and selection, and then route the user toward a dealer or transaction workflow. The available descriptions
              identify Dongchehao, car-owner circles, evaluation systems, car-model databases, new-car sales
              experiments, used-car listings, and offline stores, but they do not disclose product-level conversion,
              search quality, inventory freshness, or service-level metrics. The product therefore appears mature in
              breadth while remaining opaque in measurable reliability and monetization. The customer-facing used-car
              workflow described by the Baike page is online selection and deposit followed by offline inspection,
              delivery, and title transfer. That operating model introduces physical handoffs and quality-control
              obligations that are distinct from the app experience.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE007
