      - number: '5.2'
        title: Operating architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              Public reporting describes a layered operating model rather than a disclosed technical stack. The
              discovery layer is ByteDance-linked distribution and automotive content; the decision layer is vehicle
              information, rankings, tests, and creator programming; the transaction layer includes dealer
              relationships, new-car and used-car listings, and sales experiments; and the fulfillment layer includes
              stores, delivery centers, inspections, transfer, and after-sales policies. EqualOcean reported that
              Dongchedi's daily active users reached 7.32 million in the first half of 2023, while Bloomberg reported
              about 35.7 million monthly active users in June 2024; these are different metrics, periods, and sources,
              not interchangeable measures. A Russian-language product description reports more than 300,000 used-car
              listings, about 30,000 cooperating dealers, and more than 150 stores or delivery centers by the end of
              2025, but those figures are attributed through a secondary encyclopedia page and should be
              diligence-checked. Bloomberg's March 2026 report that the company had selected IPO banks is evidence of
              organizational maturation, not proof that infrastructure, data, or controls have separated from ByteDance.
              No assigned source documents APIs, data schemas, model architecture, uptime, release controls, or
              integration contracts. The architecture should consequently be treated as an externally observed operating
              model, not as verified software design.
            claimRefs:
              - CE005
              - CE006
              - CE008
              - CE009
              - CE010
              - CE016
          - type: table
            tableRef: TE003
