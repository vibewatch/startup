- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Valuation range ($B)
  - Probability signal
  - Decision implication
  rows:
  - - Bear
    - Concentration remains high, economics stay opaque, and investors apply a specialized-contractor discount to the story.
    - $0.6-$0.9B
    - More likely if no new disclosure appears and policy or procurement friction rises.
    - Do not pay at or above the latest private mark.
  - - Base
    - Government demand stays strong, existing deployments deepen, and no major negative diligence surprise emerges, but economics remain only partially disclosed.
    - $1.0-$1.5B
    - Most consistent with the current public evidence package.
    - Interesting only with disciplined terms or better disclosure.
  - - Bull
    - Deployments broaden across agencies, software economics prove strong, and the company earns a clearer platform-leader frame.
    - $1.8-$2.5B
    - Requires evidence that is not yet public.
    - Re-engage aggressively only if proof arrives before price runs further.
  notes: Ranges are analyst-generated and use public financing marks, private-defense-AI comps, public cyber-software references, and explicit opacity penalties.
