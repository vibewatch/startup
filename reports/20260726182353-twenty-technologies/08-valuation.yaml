- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Public evidence
  - Decision implication
  rows:
  - - Recommendation
    - research-more
    - The company is real and strategically relevant, but public economics are too incomplete for a conviction buy.
    - Stay engaged, but do not underwrite the latest mark as self-justifying.
  - - Confidence
    - medium
    - Financing marks, product posture, and customer proof are visible; revenue quality and cap-table terms are not.
    - Treat this as an IC-screening view rather than final approval.
  - - Risk rating
    - high
    - Customer concentration, policy risk, and financing opacity can all compress equity value.
    - Protect downside before chasing category momentum.
  - - Valuation stance
    - stretched
    - The $1.0B and $1.2B marks are credible historical prices, but public evidence does not fully defend them.
    - Require more disclosure or better entry discipline.
  - - Entry discipline
    - Prefer stronger evidence or better than current mark
    - A narrower scenario spread is needed before paying as though the latest round price is already conservative.
    - Upgrade only if economics or price improve materially.
  notes: The table summarizes an analyst underwriting stance, not a quoted market price or management target.
