- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - Economics stay opaque
    - No meaningful revenue, margin, retention, or mix disclosure appears during diligence.
    - The bull and base cases remain too dependent on narrative and comps.
    - Keep recommendation at research-more or walk on price.
  - - Concentration proves extreme
    - A very small set of programs or agencies dominates value.
    - Customer and policy risk become central rather than peripheral.
    - Demand a deeper discount or decline to proceed.
  - - Policy or export friction rises
    - Legal review or policy change narrows deployment pathways.
    - Addressable scale shrinks even if technology demand remains real.
    - Re-cut the range toward the bear case.
  - - Cap table proves heavily senior
    - Preferences or other senior claims materially subordinate new equity.
    - Headline valuation overstates common-equity upside.
    - Require full waterfall analysis before any investment decision.
  - - Economics prove software-quality
    - Management shows strong gross margins, retention, and recurring mix.
    - The comp lens can move closer to premium software and defense-AI references.
    - Re-open underwriting at a better-supported price.
  notes: Triggers are intentionally observable and investment-specific; they describe what would invalidate or materially improve the public-only case.
  claimRefs:
  - CV025
  - CV031
  - CV037
  - CV038
  - CV044
  - CV045
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current revenue quality
    - Current revenue or ARR, growth, renewal, and concentration by agency/program
    - Without this, valuation support rests too heavily on narrative and comp transfer.
    - Request CFO package or investor deck with top-customer bridge.
  - - Gross-margin structure
    - Gross margin by recurring software, services, and one-time work
    - This determines whether software comps are aspirational or actually relevant.
    - Request product- and contract-level contribution view.
  - - Pilot conversion and backlog
    - Conversion rates from pilot to operational program plus backlog by buyer
    - This shows whether customer proof is repeatable rather than anecdotal.
    - Request sales / deployment funnel by agency.
  - - Capitalization
    - Cap table, preference stack, and liquidation waterfall
    - Common-equity upside cannot be inferred from post-money headline marks alone.
    - Request legal capitalization schedule and waterfall model.
  - - Regulatory posture
    - Legal review on export, autonomy, and deployment controls
    - Policy friction can cap deployment breadth even if buyers are enthusiastic.
    - Request counsel memos and internal review controls.
  notes: 'The ask list is intentionally short and IC-oriented: every row could move recommendation, confidence, or price discipline materially.'
