- id: comparable-benchmarking
  title: Comparable benchmarking is useful only when its limitations are stated explicitly
  body: 'The comparison set for Twenty should be intentionally mixed. Shield AI, Helsing, and Anduril show that defense-AI platforms can attract extraordinary private valuations in 2026, but they are broader autonomy and hardware-software systems, not clean offensive-cyber analogs. Palantir is relevant because it is the best-known public benchmark for U.S. government AI at scale, yet that same scale makes it more of a ceiling reference than a peer. Elastic and Darktrace are useful because they are legible public security software businesses with mature disclosure, while ZeroFox and IronNet serve as cautionary evidence that cybersecurity branding and government adjacency do not remove execution or financing risk. The conclusion is not that any single comp settles the debate. Rather, the comp set brackets the range: broad defense-AI leaders show how high the category can go, public cyber software names show what economics disclosure should look like, and adverse precedents remind investors
    that opacity deserves a penalty.'
