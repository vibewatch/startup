company:
  name: Twenty Technologies
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports Twenty as a genuinely differentiated defense-cyber company with real customer pull, but not as an easy underwrite at its latest private marks. The company clearly cleared $1.0B in June 2026 and $1.2B in July 2026, yet public disclosure still omits the revenue, margin, retention, concentration, and cap-table data needed to defend those marks with high precision. The right public-only verdict is research-more with medium confidence, high risk, a stretched valuation stance, and a base-case range that clusters near but only modestly above the latest official pricing.
