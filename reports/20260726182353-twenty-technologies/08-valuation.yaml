- id: entry-discipline-diligence
  title: Recommendation, kill triggers, and diligence asks are all evidence-sensitive
  body: 'The right investment posture is deliberately conditional. On public evidence, Twenty remains interesting enough to stay active in diligence because the company has real strategic relevance, live government demand, and investor validation that many younger cyber companies lack. But the record is still too incomplete for a clean buy recommendation at the latest mark. The proper stance is research-more with medium confidence and high risk, paired with a stretched valuation view that could improve if management opens the economics package. The most important diligence asks are straightforward: current revenue and renewal by agency, recurring-versus-services mix, pilot-to-program conversion, cap-table seniority, and legal or export-control review status. The same evidence that could upgrade the call could also break it. If concentration proves extreme, if economics are much weaker than investors assume, or if policy friction narrows deployment pathways, the downside case moves from theoretical
    to practical very quickly.'
