- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Lens
  - Current valuation proxy / status
  - Why it matters
  - Limitation
  - Read-through for Twenty
  rows:
  - - Twenty June 2026 Series B
    - Historical private anchor
    - $1.0B valuation on $100M raise
    - Establishes the first current-year price anchor.
    - It is a company financing mark, not a public-market-clearing value.
    - Baseline reference, not automatic fair value.
  - - Twenty July 2026 extension
    - Updated private anchor
    - $1.2B valuation on additional $30M
    - Shows investor appetite held up a month later.
    - Still a company-controlled signal with limited economics disclosure.
    - Useful for momentum context, not for precision underwriting.
  - - Shield AI
    - Private defense-AI leader
    - $12.7B valuation
    - Shows investors still pay heavily for scaled autonomy leaders.
    - Broader product scope and scale than Twenty.
    - Supports premium-category logic, not peer parity.
  - - Helsing
    - Private defense-AI leader
    - ~$18B reported valuation
    - Reinforces global investor appetite for defense autonomy.
    - European context and broader autonomy mission differ materially.
    - Another ceiling-style private reference.
  - - Anduril
    - Private defense-AI leader / ceiling
    - $61B announced round; ~$100B reported discussions
    - Shows how large a scaled defense platform can become.
    - Hardware, manufacturing, and scale make it far broader than Twenty.
    - Useful only as an upper-bound category signal.
  - - Palantir
    - Public government-AI ceiling reference
    - Public filing benchmark with broad government-AI scale
    - Best public indicator of what elite government-AI disclosure looks like.
    - Far larger and more diversified than Twenty.
    - Ceiling reference and disclosure standard.
  - - Elastic
    - Public security software reference
    - Public filing benchmark with mature software disclosure
    - Shows what recurring-revenue software valuation support requires.
    - Commercial software mix differs from Twenty's buyer and mission base.
    - Disclosure benchmark more than mission peer.
  - - Darktrace
    - Public AI-cyber reference
    - Public filing benchmark for AI-led cyber platform
    - Useful for a disclosed cyber-software operator.
    - Commercial and international mix differ materially.
    - Anchors software quality expectations.
  - - ZeroFox
    - Public adverse cyber reference
    - Public filing shows riskier equity outcome set
    - Reminds investors that cyber narratives do not prevent weak public outcomes.
    - Not a government-offensive-cyber analog.
    - Supports valuation caution.
  - - IronNet
    - Adverse precedent
    - Bankruptcy 8-K
    - Sharp example of cybersecurity equity downside despite national-security branding.
    - Distress is not a one-to-one comp.
    - Justifies opacity and financing penalties.
  notes: This is a selected comparison set rather than an exhaustive sector census. It intentionally mixes current private defense-AI marks, public cyber-software references, and adverse precedents.
