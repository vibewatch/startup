  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-and-retention-gap
    missingEvidence: Current revenue or ARR, renewal behavior, and agency-level customer concentration.
    whyItMatters: The recommendation cannot move from research-more to a cleaner buy or pass without seeing the quality and concentration of current revenue.
    diligencePath: Request current ARR or revenue bridge, top-customer concentration, and renewal cohort data.
    relatedQuestionRefs:
    - QV009
    - QV021
    - QV030
  - type: private-evidence-only
    severity: material
    topic: margin-and-mix-gap
    missingEvidence: Gross margin and contribution by recurring software, services, and one-time integration work.
    whyItMatters: Comparable selection depends on whether Twenty behaves more like software, services, or a hybrid mission contractor.
    diligencePath: Request product- and contract-level gross margin by line of business.
    relatedQuestionRefs:
    - QV017
    - QV024
    - QV030
  - type: private-evidence-only
    severity: material
    topic: cap-table-gap
    missingEvidence: Cap-table seniority, liquidation preferences, and any structure that changes common-equity value.
    whyItMatters: Headline post-money valuations can materially overstate common-equity upside when seniority is heavy.
    diligencePath: Request capitalization schedule, preference stack, and liquidation waterfall.
    relatedQuestionRefs:
    - QV010
    - QV024
    - QV030
  - type: private-evidence-only
    severity: material
    topic: conversion-and-backlog-gap
    missingEvidence: Pilot-to-program conversion rates, booked backlog, and deployment cadence by agency.
    whyItMatters: The bull case requires repeatability, not just isolated high-value programs.
    diligencePath: Request sales and deployment funnel data broken out by program status and buyer.
    relatedQuestionRefs:
    - QV027
    - QV028
    - QV030
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: minor
    topic: legal-and-policy-gap
    missingEvidence: Internal legal review status on export-control, autonomy, and deployment-governance issues.
    whyItMatters: Policy friction could reduce addressable deployment even if core customer demand remains strong.
    diligencePath: Request counsel summaries and internal control descriptions for relevant regulatory reviews.
