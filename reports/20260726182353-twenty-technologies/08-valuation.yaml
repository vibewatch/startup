sections:
- id: pricing-context
  title: Current financing context supports interest, not complacency
  body: Twenty has a clear 2026 price ladder in public view. The company announced a $100 million Series B at a $1 billion valuation on June 17 and then announced an additional $30 million from Khosla Ventures at a $1.2 billion valuation on July 21. Those are real market signals, and they matter because many private companies never expose even that much pricing information. They also show that sophisticated investors still view AI-enabled national-security software as a premium category. The problem is not that the marks are fabricated; the problem is that they are far more visible than the economics behind them. Public sources still do not show current revenue, gross margin, retention, concentration by agency, or capitalization terms. That mismatch means the financing context is useful as a historical anchor and momentum signal, but not as a sufficient proof package for a fresh outside investor who must decide whether the latest mark is attractive rather than merely recent.
