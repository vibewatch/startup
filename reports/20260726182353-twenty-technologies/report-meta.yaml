  topStrengths:
    - Public evidence supports genuine mission relevance, including Pentagon-centric customer proof and offensive-cyber positioning.
    - The founding team has unusually strong national-security cyber pedigree, which helps credibility with cleared buyers.
    - June and July 2026 financings show that prominent investors continue to support the company at unicorn-plus valuations.
  topRisks:
    - Public sources still do not disclose current revenue, gross margin, retention, or customer concentration by program.
    - The latest $1.2B mark may be ahead of what public evidence alone can justify for new investors.
    - Government concentration, policy friction, and export or governance review issues could compress future growth or valuation.
    - Cap-table seniority and liquidation preferences are undisclosed, so common-equity downside is hard to model.
  unresolvedGaps:
    - Current revenue or ARR, renewal, and concentration by agency remain private.
    - Gross-margin structure across software, services, and integration work is not public.
    - Pilot-to-program conversion, backlog, and deployment cadence are not publicly broken out.
    - Cap-table seniority, dilution history, and liquidation waterfall are not publicly available.
