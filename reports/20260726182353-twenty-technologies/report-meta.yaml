companyProfile:
  summary: >-
    Twenty Technologies is an Arlington, Virginia-based offensive-cyber startup founded in 2024. Public materials and
    reporting describe a company building AI-enabled end-to-end cyber operations software for U.S. military and
    intelligence customers while keeping human judgment in consequential decisions. The founding team combines national-
    security cyber operators with Expanse, Palo Alto Networks, Palantir, and DHS experience, and the company has shown
    enough hiring breadth and customer proof to support the view that it is operating inside serious government mission
    environments. The valuation challenge is not lack of relevance but lack of economics disclosure: public sources do
    not yet reveal the revenue, margin, concentration, retention, or cap-table details needed to defend the latest
    private marks with high confidence.
