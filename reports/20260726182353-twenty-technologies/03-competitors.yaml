- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Risk
  - Why it matters
  - Most exposed competitor dynamic
  - Implication for Twenty
  rows:
  - - Incumbent trust advantage
    - Public filings and procurement history reduce buyer anxiety
    - Palantir / public vendors
    - Twenty must beat trust gaps with mission results.
  - - Good-enough automation
    - Agentic security becomes widespread
    - Elastic and adjacent AI-SOC tools
    - Workflow components may commoditize.
  - - Capital asymmetry
    - Larger peers can absorb longer sales cycles
    - Anduril / Shield AI
    - Twenty may need sharper focus or more capital.
  - - Budget bundling
    - Broader vendors can package cyber into larger programs
    - Palantir / primes
    - Point solutions risk getting displaced.
  - - Disclosure opacity
    - Private classified companies are hard to benchmark
    - Unique to Twenty
    - Can slow customer or investor conviction.
  - - Category drift
    - Adjacent defense-AI firms can move into cyber-enabled workflows
    - Rebellion / broader defense AI
    - Whitespace may not stay open.
  notes: This register focuses on strategic failure modes rather than routine operational risks covered later in the report.
