company:
  name: Twenty Technologies
chapter:
  number: 3
  title: Competitors
  summary: 'Twenty does not face one clean competitor class. Its practical competitive set spans public cyber incumbents such as Palantir, Elastic, ZeroFox, and Darktrace; broader defense-AI platforms such as Anduril and Shield AI; and adjacent critical-infrastructure players such as Rebellion Defense. The key insight is that most competitors win on budget access, trust, disclosure, or broad platform breadth rather than on exact offensive-cyber feature overlap. Twenty’s niche is therefore differentiated but fragile: strong on specialization, weaker on visible scale and procurement depth.'
sections:
- id: landscape-shape
  title: The landscape is mixed, not pure-play
  body: 'Twenty’s competitive environment is unusually mixed. On one side sit public cyber and data incumbents such as Palantir, Elastic, ZeroFox, and Darktrace. These companies offer broader, more mature, and more easily auditable platforms, but mostly for defensive, analytic, or enterprise use cases. On another side sit Anduril and Shield AI, which are not cyber pure-plays at all but compete for defense-AI capital, strategic attention, and national-security platform budgets. Rebellion Defense illustrates a third category: mission-oriented intelligence and protection software aimed at critical assets, but not publicized as offensive cyber. This means a diligence process should not ask, “Who is the identical company?” It should ask, “Who can absorb the same buyer dollars, talent, and political air cover?” On that broader test, Twenty competes in several directions at once.'
