  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: What market Twenty is actually in
        blocks:
          - type: paragraph
            body: >-
              The most common mistake in valuing Twenty’s addressable market is to start with the entire cybersecurity
              software industry and stop there. That headline market is far too broad. Twenty is not selling a
              general-purpose enterprise SOC, identity platform, or cloud-security bundle. The company’s own materials,
              its investor note, and independent reporting all locate it in a much narrower problem set:
              industrial-scale offensive cyber operations for U.S. government users that need to move faster than
              human-only workflows allow. In practice, that places Twenty at the overlap of AI-enabled cyber automation,
              mission software for national security, and offensive cyber operations. This overlap is still influenced
              by the wider AI-cybersecurity market because adjacent vendors are normalizing agentic response,
              automation, and machine-speed analysis. But Twenty’s real market is gated by trust, clearance access,
              mission legality, and force-generation shortages. That means public commercial TAM figures are useful as
              outer bounds and strategic context, not as direct revenue proxies.
            claimRefs:
              - CM001
              - CM024
