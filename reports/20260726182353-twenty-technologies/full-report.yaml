      - number: '3.3'
        title: Defense-AI platform peers compete more on capital and buyer access
        blocks:
          - type: paragraph
            body: >-
              Shield AI and Anduril matter less because they do the same cyber workflow as Twenty and more because they
              show what the defense market currently rewards. Shield AI’s March 2026 capital raise valued it at $12.7
              billion and paired autonomy software with aircraft, simulation, and military deployment proof. Anduril’s
              $5 billion Series H sits in an even larger category. These companies set the benchmark for what
              national-security investors call category infrastructure. For Twenty, that is encouraging and cautionary
              at once. Encouraging, because capital markets plainly believe in national-security AI platforms.
              Cautionary, because the bar for perceived category leadership is very high and often supported by broader
              product footprints, hardware ties, and more visible government programs than public evidence shows for
              Twenty today. Rebellion Defense reinforces another lesson: the defense-AI landscape is crowded with
              companies pitching intelligence, sensor fusion, and mission software around critical assets, so strategic
              whitespace can close quickly if adjacent vendors pivot toward cyber-enabled mission workflows.
