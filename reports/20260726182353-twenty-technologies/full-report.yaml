              dashboard, or a generic AI wrapper. It is positioning a mission platform for offensive cyber operations.
              Company materials consistently frame the offering as software and capabilities for modern cyber conflict,
              and outside reporting adds more operational detail: target identification, reconnaissance, compromise
              support, and parallelized campaign execution. That framing matters because it changes the right mental
              model for diligence. A buyer is not purchasing a commodity security control; it is adopting a mission
              workflow that blends AI-assisted automation with operator oversight. The Mission Architect role further
              reinforces that interpretation by describing a product process grounded in real user workflows, edge
              cases, and testable acceptance criteria. Even from sparse public evidence, the user path looks like
              command intent, target discovery, AI-assisted planning, operator review, execution, and iteration. That is
