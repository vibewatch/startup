      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Current revenue quality
        - Current revenue or ARR, growth, renewal, and concentration by agency/program
        - Without this, valuation support rests too heavily on narrative and comp transfer.
        - Request CFO package or investor deck with top-customer bridge.
      - - Gross-margin structure
        - Gross margin by recurring software, services, and one-time work
        - This determines whether software comps are aspirational or actually relevant.
        - Request product- and contract-level contribution view.
      - - Pilot conversion and backlog
        - Conversion rates from pilot to operational program plus backlog by buyer
        - This shows whether customer proof is repeatable rather than anecdotal.
        - Request sales / deployment funnel by agency.
      - - Capitalization
        - Cap table, preference stack, and liquidation waterfall
        - Common-equity upside cannot be inferred from post-money headline marks alone.
        - Request legal capitalization schedule and waterfall model.
      - - Regulatory posture
        - Legal review on export, autonomy, and deployment controls
        - Policy friction can cap deployment breadth even if buyers are enthusiastic.
        - Request counsel memos and internal review controls.
    notes: >-
      The ask list is intentionally short and IC-oriented: every row could move recommendation, confidence, or price
      discipline materially.
