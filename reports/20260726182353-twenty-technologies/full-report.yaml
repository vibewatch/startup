chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and operating posture
        blocks:
          - type: paragraph
            body: >-
              Twenty’s public materials leave little ambiguity about what kind of company it is trying to be. The
              homepage, about page, investor announcement, and June 2026 financing coverage all frame the company as an
              offensive cyber specialist rather than a broad enterprise-security vendor. Its pitch is that the United
              States and its allies need industrial-scale cyber capabilities, not boutique manual tradecraft, because
              adversaries now operate at machine speed across large target sets. The company therefore describes its
              software as an end-to-end cyber-operations platform for U.S. agencies that lets analysts and operators
              pursue many targets in parallel while keeping human judgment over consequential decisions. That
              positioning matters for diligence because it places Twenty in a rare category: a venture-backed company
              selling capabilities adjacent to cyber conflict, not just cyber defense tooling. The same framing also
              immediately narrows the plausible buyer base to cleared U.S. and allied national-security organizations,
              which explains why the public record is rich on mission rhetoric and fundraising but thin on ordinary SaaS
              metrics such as customer count, ARR, or net retention.
