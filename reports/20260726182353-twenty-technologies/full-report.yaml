      - number: '2.4'
        title: Growth drivers, constraints, and final market read-through
        blocks:
          - type: paragraph
            body: >-
              The demand drivers behind Twenty are strong and mutually reinforcing. Public threat-intelligence sources
              say GenAI is lowering the barrier to phishing, malware development, and manipulation; Darktrace and
              Elastic show that buyers increasingly expect machine-speed reasoning and response; and national-security
              policy sources repeatedly frame cyber conflict as continuous rather than episodic. In that sense, Twenty
              is riding both threat inflation and doctrine change. Yet adoption constraints are just as real.
              Procurement in this market is slow, budgets are fragmented, full visibility into classified demand is
              impossible, and offensive autonomy raises legal and reputational risks. In addition, the same AI-cyber
              boom that helps Twenty also funds adjacent defensive platforms and could eventually compress
              differentiation if customers decide they need mostly defensive or dual-use tools rather than a specialized
              offensive stack. The chapter verdict is therefore positive but bounded: the market is big enough, urgent
              enough, and budget-backed enough to support venture-scale outcomes, but only if Twenty can translate
              mission urgency into durable, production-grade programs rather than isolated proofs of concept.
