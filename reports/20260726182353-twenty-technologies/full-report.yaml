      - number: '1.3'
        title: Funding history, investors, and visible stakeholder map
        blocks:
          - type: paragraph
            body: >-
              The capital formation story is exceptionally fast. Virginia Business and Forbes place the company’s public
              emergence in November 2025 with a $38 million round led by Caffeinated Capital, backed by General Catalyst
              and In-Q-Tel. The June 17, 2026 Series B then added $100 million at a $1 billion valuation, led by Accel
              with Friends & Family Capital, Point72 Ventures, and Caffeinated Capital participating. By that point
              public sources described total capital as $138 million. Forbes subsequently reported that Khosla Ventures
              invested another $30 million by July 2026, implying a current valuation of roughly $1.2 billion and total
              disclosed capital of about $168 million. The investor mix matters as much as the totals. In-Q-Tel signals
              intelligence-community relevance; Accel and Khosla signal mainstream venture conviction; and Friends &
              Family Capital adds a Palantir-adjacent national-security network. Yet public evidence still leaves
              important cap-table questions unanswered. No reviewed source discloses liquidation preferences, board
              seats, secondary transactions, debt, or ownership concentration, so the economic meaning of the headline
              valuation is still only partially visible.
