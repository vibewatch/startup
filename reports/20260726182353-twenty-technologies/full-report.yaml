      - number: '7.3'
        title: Concentration and execution risk are inseparable
        blocks:
          - type: paragraph
            body: >-
              The third major category combines customers, finances, and execution. Public evidence suggests the buyer
              base is overwhelmingly Pentagon-centric. That concentration can be strategically attractive when the
              mission fit is strong, but it is still concentration. Budget reallocations, command restructurings, or
              procurement freezes can transmit almost directly into revenue because public diversification is limited.
              At the same time, customer success appears labor-intensive: mission deployment, forward-deployed analysts,
              and solutions translation seem central to converting pilots into operational use. That can create a
              defensible moat, but it also means scale may require scarce people, not just more software. Combined with
              limited public margin or renewal disclosure, this leaves a meaningful risk that demand remains real while
              economics or repeatability prove weaker than the narrative suggests. It also means that execution mistakes
              are not isolated: a weak deployment or a policy stumble can echo across the same buyer system and
              contaminate future procurement conversations.
            claimRefs:
              - CR017
              - CR018
              - CR019
              - CR025
              - CR026
              - CR027
              - CR028
              - CR033
              - CR034
              - CR036
              - CR041
      - number: '7.4'
        title: Mitigations exist, but several thesis-break triggers remain obvious
        blocks:
          - type: paragraph
            body: >-
              The public record does show mitigation direction. Management emphasizes human judgment. Recruiting shows
              active investment in DevSecOps, SRE, mission deployment, and cleared talent. WVU shows some
              pipeline-building effort. But the crucial question is whether these mitigations are strong enough relative
              to the downside transmission paths. If export-control interpretation tightens, if the Pentagon buying
              center shifts, or if the product proves too costly or too fragile to deploy broadly in restricted
              environments, the investment case would weaken quickly. The right risk verdict is therefore not
              “uninvestable,” but “evidence-sensitive.” Any underwriting process needs specific proof on classification,
              legal review, deployment reliability, concentration, and renewal depth before treating current momentum as
              durable. That is why the chapter’s central recommendation is disciplined follow-up diligence rather than
              passive comfort from favorable market momentum.
            claimRefs:
              - CR024
              - CR031
              - CR032
              - CR035
              - CR036
