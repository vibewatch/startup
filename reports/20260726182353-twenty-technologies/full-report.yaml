      - number: '8.3'
        title: The valuation range is narrower around the base case than the narrative suggests
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis matters here because public evidence can support only a bounded kind of optimism. The
              bear case does not require catastrophe; it merely requires that investors treat Twenty more like a
              concentrated, specialized government contractor with opaque software economics than like a platform-scale
              defense-AI champion. In that world, a value below the June unicorn mark becomes plausible. The base case
              is more balanced. It gives credit for real mission relevance, investor quality, category tailwinds, and
              the fact that the company already cleared $1.0 billion and $1.2 billion marks in quick succession. But it
              still applies a discipline penalty for missing financial disclosure and customer concentration. The bull
              case exists, yet it needs more than momentum. It requires evidence that deployments are repeatable across
              agencies, that economics are software-like enough to justify premium multiples, and that the company can
              compound from a niche offensive capability into a broader and more durable defense platform.
