      - number: '3.2'
        title: Public cyber and data platforms as substitutes and benchmarks
        blocks:
          - type: paragraph
            body: >-
              Palantir is the most relevant public procurement benchmark even though it is not a pure cyber company. Its
              filings show the scale, disclosure discipline, and government credibility that later-stage
              national-security software can achieve, including more than $1.6 billion of Q1 2026 revenue. Elastic,
              ZeroFox, and Darktrace are more directly cyber-facing, but their positioning is notably defensive and
              commercial: SIEM/XDR and agentic SOC at Elastic, external threat intelligence and takedowns at ZeroFox,
              and AI-led defensive cyber operations at Darktrace. These firms demonstrate the level of customer proof,
              ROI packaging, and visible scale that buyers can already access without betting on a classified offensive
              specialist. At the same time, their breadth is also a limitation relative to Twenty. None are publicly
              presenting themselves as purpose-built industrializers of offensive cyber operations for U.S. agencies.
              The substitution risk is therefore partial, not perfect: these companies can satisfy slices of the
              problem, especially detection, response, intelligence, and workflow tooling, but may not map cleanly onto
              high-end offensive mission execution.
