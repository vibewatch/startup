      - number: '2.2'
        title: Sizing the opportunity with multiple lenses
        blocks:
          - type: paragraph
            body: >-
              Analyst market reports show why a single top-down number should not drive diligence. MarketsandMarkets
              places the 2026 AI-in-cybersecurity market at $25.53 billion, Polaris at $38.89 billion, and Fortune
              Business Insights at $44.24 billion. Those estimates all point in the same direction—fast growth and
              increasing automation—but they are not interchangeable. They mix different boundaries, commercial
              verticals, and deployment models. The better sizing lens for Twenty is to triangulate those broad
              estimates against public defense budgets and the specific budget lines that can plausibly buy operational
              cyber software. CRS reports a FY2026 DOD cyber request of about $15.1 billion, with $5.4 billion for
              cyberspace operations and about $2.6 billion tied to Cyber Command resources. That defense budget lens is
              not Twenty’s revenue opportunity either, because much of it goes to workforce, infrastructure, readiness,
              and classified programs. Still, it is much closer to the company’s relevant demand base than commercial
              retail or BFSI cyber spend. The conclusion is that TAM is large enough to matter, SAM is much narrower,
              and SOM remains opaque without private procurement and contract data.
