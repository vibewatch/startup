evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-gap
    missingEvidence: Current revenue, ARR, gross margin, and revenue concentration by program or agency.
    whyItMatters: >-
      Without economics it is impossible to judge whether the unicorn valuation reflects repeatable software revenue or
      still-classified project work.
    diligencePath: Request management financials, cohort data, and contract mix under NDA.
    relatedQuestionRefs:
      - QO012
  - type: private-evidence-only
    severity: material
    topic: headcount-gap
    missingEvidence: Exact employee count, cleared-to-uncleared mix, and contractor ratio.
    whyItMatters: >-
      Hiring velocity alone does not show whether the company has enough cleared labor to support classified deployments
      at scale.
    diligencePath: Request current org chart, headcount by function, and recruiting funnel metrics.
    relatedQuestionRefs:
      - QO013
      - QO025
  - type: missing-source
    severity: material
    topic: governance-gap
    missingEvidence: Board composition, ownership stakes, liquidation preferences, and any secondary activity.
    whyItMatters: Headline valuation can be economically misleading without governance and preference detail.
    diligencePath: Obtain the latest cap table, board observer rights, and signed financing documents.
    relatedQuestionRefs:
      - QO006
      - QO024
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: minor
    topic: customer-count-gap
    missingEvidence: Active customer count, renewal rates, and revenue concentration across military and intelligence accounts.
    whyItMatters: Named public programs prove credibility but not diversification or durability.
    diligencePath: Request customer roster by classification level, contract duration, and percentage of revenue.
    relatedQuestionRefs:
      - QO023
      - QO025
    relatedTableRefs:
      - TO004
  - type: enumeration-incomplete
    severity: material
    topic: TM002 sizing lens coverage
    missingEvidence: Public classified-annex spending and program-level contract data that would bound Twenty’s real SOM.
    whyItMatters: >-
      Without those data, public TAM and defense-budget figures remain rough proxies rather than underwriteable revenue
      opportunities.
    diligencePath: Request classified or NDA-protected pipeline, awards, and budget-mapping detail from management.
    relatedQuestionRefs:
      - QM022
      - QM025
    relatedTableRefs:
      - TM002
  - type: enumeration-incomplete
    severity: minor
    topic: TM003 buyer map coverage
    missingEvidence: A full list of specific allied and intelligence buyers with attributable deployment status.
    whyItMatters: Public sources show the buyer categories, but not the full installed base or active opportunity set.
    diligencePath: Request buyer-by-buyer status segmented by agency, mission type, and deployment stage.
    relatedQuestionRefs:
      - QM018
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: som-gap
    missingEvidence: Conversion rates from pilot to production, average program size, and procurement-cycle duration.
    whyItMatters: Those variables determine whether the niche is venture-scale in practice rather than only in doctrine.
    diligencePath: Obtain cohort data on pilots, renewals, expansions, and time-to-award.
    relatedQuestionRefs:
      - QM022
      - QM023
      - QM025
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: Contract-level pricing, renewal behavior, and gross-margin data across Twenty and its most relevant peers.
    whyItMatters: Without economic comparability, strategic differentiation can be overstated or understated.
    diligencePath: Request customer pricing, program sizes, and renewal history under NDA.
    relatedQuestionRefs:
      - QP015
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: classified-depth-gap
    missingEvidence: Comparable classified deployment depth and renewal quality across Twenty, Palantir, and other mission vendors.
    whyItMatters: Public proof says little about repeatable mission penetration.
    diligencePath: Request deployment stage, contract duration, and expansion patterns by buyer.
    relatedQuestionRefs:
      - QP024
      - QP025
  - type: enumeration-incomplete
    severity: minor
    topic: TP001 profile coverage
    missingEvidence: A full list of all adjacent primes, government internal-build substitutes, and emerging offensive cyber startups.
    whyItMatters: The named set is representative but not exhaustive of all substitute paths.
    diligencePath: Expand the map with private deal-flow data and procurement pipeline review.
    relatedQuestionRefs:
      - QP001
      - QP014
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: revenue-and-margin-gap
    missingEvidence: Recognized revenue, gross margin, contribution margin, and contract-level margin data for Twenty.
    whyItMatters: These are the minimum inputs required to underwrite revenue quality and operating leverage.
    diligencePath: Request monthly revenue bridge, gross margin by program, and revenue recognition memos.
    relatedQuestionRefs:
      - QI002
      - QI008
      - QI010
  - type: private-evidence-only
    severity: material
    topic: balance-sheet-gap
    missingEvidence: Cash on hand, debt facilities, restricted cash, runway, and burn by month.
    whyItMatters: Financing adequacy cannot be translated into solvency or runway without balance-sheet detail.
    diligencePath: Request latest cash balance, debt schedule, burn trend, and 12-18 month operating plan.
    relatedQuestionRefs:
      - QI018
      - QI020
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-gap
    missingEvidence: Revenue concentration by agency, program, and classified vs unclassified work.
    whyItMatters: A single-buyer or single-program dependence could dominate downside risk.
    diligencePath: Request top-customer concentration table and contract duration/renewal data.
    relatedQuestionRefs:
      - QI012
      - QI025
  - type: private-evidence-only
    severity: material
    topic: benchmark-gap
    missingEvidence: No public benchmarks for task accuracy, exploit success, latency, reliability, or operational outcomes.
    whyItMatters: Without quantified performance, product diligence stays partly narrative-driven.
    diligencePath: Request internal evals, test harness results, production SLOs, and red-team validation reports.
    relatedQuestionRefs:
      - QE021
      - QE022
  - type: private-evidence-only
    severity: material
    topic: integration-gap
    missingEvidence: No public API, SDK, integration catalog, or reference-architecture documentation for customer deployments.
    whyItMatters: Integration friction can dominate adoption in sensitive mission environments.
    diligencePath: Request deployment reference architectures, interface specs, and security package documentation.
    relatedQuestionRefs:
      - QE008
      - QE024
  - type: private-evidence-only
    severity: minor
    topic: open-developer-surface-gap
    missingEvidence: No public repository, package, or changelog evidence was found in the reviewed materials.
    whyItMatters: For classified products this may be expected, but it weakens external maturity verification.
    diligencePath: Request internal release cadence artifacts and engineering quality metrics.
    relatedQuestionRefs:
      - QE017
      - QE021
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-roster-gap
    missingEvidence: A full list of customer agencies, commands, and production deployments is not public.
    whyItMatters: Public proof likely understates adoption while also preventing concentration analysis.
    diligencePath: Request named account roster with pilot vs production status and revenue share.
    relatedQuestionRefs:
      - QU007
      - QU024
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: No public renewal, churn, NRR, GRR, contract length, or cohort data for customer durability.
    whyItMatters: Without durability data, customer quality cannot be underwritten.
    diligencePath: Request renewal schedules, option-year exercise history, and account expansion cohorts.
    relatedQuestionRefs:
      - QU015
      - QU024
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: Revenue share by agency, command, office, and classified versus unclassified work.
    whyItMatters: A Pentagon-centric account base may still hide dangerous single-office dependence.
    diligencePath: Request top-customer concentration and procurement-vehicle mix.
    relatedQuestionRefs:
      - QU019
      - QU024
  - type: private-evidence-only
    severity: material
    topic: compliance-gap
    missingEvidence: No public export classification, legal review, or internal autonomy-governance documentation for the product.
    whyItMatters: These documents are necessary to evaluate whether legal risk is controlled or merely acknowledged.
    diligencePath: Request export memos, counsel opinions, customer review packages, and governance artifacts.
    relatedQuestionRefs:
      - QR008
      - QR023
  - type: private-evidence-only
    severity: material
    topic: dependency-gap
    missingEvidence: No public detail on model-provider agreements, hosting failover, incident history, or restricted-environment SLOs.
    whyItMatters: Without them, operational risk cannot be priced or bounded.
    diligencePath: Request dependency map, incident logs, uptime metrics, and failover design.
    relatedQuestionRefs:
      - QR012
      - QR013
      - QR023
  - type: enumeration-incomplete
    severity: minor
    topic: TR001 coverage
    missingEvidence: A complete inventory of every relevant export-control, sanctions, procurement, and autonomy rule that could apply.
    whyItMatters: The legal surface is broad and evolving.
    diligencePath: Commission specialist export-control and national-security counsel memo before investment.
    relatedQuestionRefs:
      - QR005
      - QR006
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: revenue-and-retention-gap
    missingEvidence: Current revenue or ARR, renewal behavior, and agency-level customer concentration.
    whyItMatters: >-
      The recommendation cannot move from research-more to a cleaner buy or pass without seeing the quality and
      concentration of current revenue.
    diligencePath: Request current ARR or revenue bridge, top-customer concentration, and renewal cohort data.
    relatedQuestionRefs:
      - QV009
      - QV021
      - QV030
  - type: private-evidence-only
    severity: material
    topic: margin-and-mix-gap
    missingEvidence: Gross margin and contribution by recurring software, services, and one-time integration work.
    whyItMatters: >-
      Comparable selection depends on whether Twenty behaves more like software, services, or a hybrid mission
      contractor.
    diligencePath: Request product- and contract-level gross margin by line of business.
    relatedQuestionRefs:
      - QV017
      - QV024
      - QV030
  - type: private-evidence-only
    severity: material
    topic: cap-table-gap
    missingEvidence: Cap-table seniority, liquidation preferences, and any structure that changes common-equity value.
    whyItMatters: Headline post-money valuations can materially overstate common-equity upside when seniority is heavy.
    diligencePath: Request capitalization schedule, preference stack, and liquidation waterfall.
    relatedQuestionRefs:
      - QV010
      - QV024
      - QV030
  - type: private-evidence-only
    severity: material
    topic: conversion-and-backlog-gap
    missingEvidence: Pilot-to-program conversion rates, booked backlog, and deployment cadence by agency.
    whyItMatters: The bull case requires repeatability, not just isolated high-value programs.
    diligencePath: Request sales and deployment funnel data broken out by program status and buyer.
    relatedQuestionRefs:
      - QV027
      - QV028
      - QV030
    relatedTableRefs:
      - TV004
  - type: private-evidence-only
    severity: minor
    topic: legal-and-policy-gap
    missingEvidence: Internal legal review status on export-control, autonomy, and deployment-governance issues.
    whyItMatters: Policy friction could reduce addressable deployment even if core customer demand remains strong.
    diligencePath: Request counsel summaries and internal control descriptions for relevant regulatory reviews.
    relatedQuestionRefs:
      - QV023
      - QV029
      - QV030
