- id: founders-and-team
  title: Founders, leadership bench, and founder-market fit
  body: 'Founder-market fit is the strongest part of the public identity story. Joe Lin, Leo Olson, Skyler Onken, and Pete Sorrentino all come out of the U.S. national-security cyber ecosystem and the Expanse/Palo Alto Networks national-security stack, which gives the company unusually strong credibility with cleared buyers. Lin brings product and policy exposure; Olson brings deep technical and Army/NSA/CYBERCOM experience; Onken brings operational credibility from CYBERCOM and Army service; and Sorrentino brings growth and procurement experience from Expanse, Palantir, and DHS. The official about page also adds a second line of leadership in finance, policy, and engineering, suggesting that Twenty is maturing from founder-led stealth startup into an operating company with broader functional coverage. Careers data reinforces that interpretation: the company was advertising dozens of roles across engineering, mission deployment, product, finance, and talent, many tied to Arlington, Fort
    Meade, or other government-adjacent hubs. What remains missing is formal governance transparency. Public sources still do not show a full board roster, ownership percentages, or any disclosed succession framework beyond the founders and named vice presidents.'
