company:
  name: Twenty Technologies
chapter:
  number: 1
  title: Company Overview
  summary: Twenty Technologies is an Arlington-based offensive cyber startup founded in 2024 that sells AI-enabled cyber operations systems to U.S. military and intelligence users. Public evidence shows a steep financing curve from a $38 million stealth-emergence round in late 2025 to a $100 million Series B at a $1 billion valuation in June 2026, followed by Forbes reporting a July 2026 follow-on that implied a $1.2 billion valuation and roughly $168 million of total capital. The main diligence gaps remain revenue, customer count, headcount, board composition, and how much of public traction reflects repeat program revenue versus still-classified prototype or mission work.
sections:
- id: identity-and-mission
  title: Identity, mission, and operating posture
  body: 'Twenty’s public materials leave little ambiguity about what kind of company it is trying to be. The homepage, about page, investor announcement, and June 2026 financing coverage all frame the company as an offensive cyber specialist rather than a broad enterprise-security vendor. Its pitch is that the United States and its allies need industrial-scale cyber capabilities, not boutique manual tradecraft, because adversaries now operate at machine speed across large target sets. The company therefore describes its software as an end-to-end cyber-operations platform for U.S. agencies that lets analysts and operators pursue many targets in parallel while keeping human judgment over consequential decisions. That positioning matters for diligence because it places Twenty in a rare category: a venture-backed company selling capabilities adjacent to cyber conflict, not just cyber defense tooling. The same framing also immediately narrows the plausible buyer base to cleared U.S. and allied
    national-security organizations, which explains why the public record is rich on mission rhetoric and fundraising but thin on ordinary SaaS metrics such as customer count, ARR, or net retention.'
