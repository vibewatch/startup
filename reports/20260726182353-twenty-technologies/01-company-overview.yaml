- id: milestones-proof-and-gaps
  title: Milestones, public proof points, and downside context
  body: 'Even with limited disclosure, the company has accumulated several real proof points. Forbes reported that Twenty had already won a U.S. Cyber Command contract worth up to $12.6 million and a Navy research award before public launch, and its July 2026 follow-up identified the Pentagon as the company’s only publicly acknowledged customer while naming an AFOSI contract worth up to $640,000. WVU’s May 2026 partnership announcement shows another type of signal: the company was confident enough in its national-security demand narrative to form a talent pipeline around offensive cyber and AI-enabled systems. Accel’s investment note also claims that government users described Twenty as the first call when they need help. At the same time, downside context is real. Virginia Business says the company had not disclosed revenue, employee count, or customer count; Forbes says it declined to provide complete revenue figures; and legal and policy commentary on autonomous and private-sector cyber
    operations warns that companies in this lane will face escalating oversight, accountability, and escalation questions. Diligence should therefore treat Twenty as a fast-rising but still opaque defense-tech company whose visible customer proof is meaningful yet far from complete.'
