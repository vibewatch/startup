- id: buyers-and-adoption-path
  title: Who buys, who uses, and how adoption likely happens
  body: The buyer map in this market is unusual because the user, payer, and authorizer are often different people or institutions. Operators and analysts may be the end users, but funding can sit in Cyber Command, service cyber components, investigative units, intelligence agencies, or defense-wide cyber and AI accounts. Public evidence also suggests universities, force-development programs, and primes can play enabling roles around talent and deployment. Adoption therefore depends on more than product performance. The software must fit controlled environments, pass security review, align to operational doctrine, and preserve human judgment over consequential decisions. Public policy sources reinforce this point. The White House cyber strategy and DOD commentary support more offensive cyber capability and more AI enablement, but CYBERCOM’s AI roadmap and later Senate discussion on autonomous systems both emphasize supervised use, evaluation, and records. That combination creates a real
    market tailwind for companies like Twenty while also slowing broad-based adoption compared with ordinary commercial software.
  claimRefs:
  - CM013
  - CM014
