sections:
- id: product-definition-and-user-workflow
  title: The product is mission software, not a generic cyber tool
  body: 'The clearest takeaway from public materials is that Twenty is not marketing a single exploit tool, a SOC dashboard, or a generic AI wrapper. It is positioning a mission platform for offensive cyber operations. Company materials consistently frame the offering as software and capabilities for modern cyber conflict, and outside reporting adds more operational detail: target identification, reconnaissance, compromise support, and parallelized campaign execution. That framing matters because it changes the right mental model for diligence. A buyer is not purchasing a commodity security control; it is adopting a mission workflow that blends AI-assisted automation with operator oversight. The Mission Architect role further reinforces that interpretation by describing a product process grounded in real user workflows, edge cases, and testable acceptance criteria. Even from sparse public evidence, the user path looks like command intent, target discovery, AI-assisted planning, operator
    review, execution, and iteration. That is a substantially deeper workflow than a point product.'
  claimRefs:
  - CE001
  - CE002
  - CE005
  - CE006
  - CE007
  - CE008
  - CE015
  - CE034
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE002
- id: architecture-and-deployment-model
  title: The visible architecture is layered and deployment-aware
  body: 'The strongest technical evidence comes not from public documentation, but from the role descriptions the company is using to recruit. The Applied AI Engineer role points to datasets, post-training, retrieval, evaluation, and model serving. The Staff Data Engineer role adds a data infrastructure layer with a data lake, ETL, and mission-specific query patterns. DevSecOps and forward-deployed SRE roles make the deployment model much more concrete: container security, IAM, secrets management, CI/CD hardening, Terraform, and support for a restricted, air-gapped AWS environment. Put together, these roles imply a layered system rather than a monolithic application: model and evaluation, data and retrieval, offensive workflow logic, deployment platform, and security controls. That architecture also appears designed for hostile or highly constrained environments, which is important because a product built for sensitive military networks cannot rely on the assumptions of ordinary SaaS delivery.'
  claimRefs:
  - CE009
  - CE010
  - CE011
  - CE012
