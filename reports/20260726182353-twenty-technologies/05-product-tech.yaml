- id: differentiation-and-technical-risks
  title: Differentiation is plausible, but technical diligence is still constrained
  body: 'The strongest product differentiation signal is not a publicly inspectable algorithm or patent portfolio; it is workflow fit. Twenty appears to encode operator tradecraft into a system that can automate meaningful portions of offensive cyber work while remaining deployable inside highly controlled environments. That combination is hard for general enterprise-security vendors to mimic quickly. Still, important technical risks remain. Dependence on outside frontier models could affect cost or capability. Sensitive-network deployment can slow releases and complicate recovery. And because public evidence is mostly narrative, external observers cannot independently validate accuracy, benchmark performance, or breadth of integrations. The company may well have answers to those questions in classified or customer-only materials, but the open record does not. The correct product verdict is therefore positive but conditional: real architecture, real workflow specificity, real deployment
    complexity — and still major evidence gaps for anyone doing outside diligence. That leaves customer-only artifacts and classified deployment evidence as the key missing proof set for deeper technical underwriting.'
