company:
  name: Twenty Technologies
chapter:
  number: 5
  title: Product & Technology
  summary: Twenty’s public product story is specific enough to show a real architecture, but not open enough to verify it the way one could verify an enterprise-security vendor. The evidence points to a multi-layer mission platform that combines AI models, data pipelines, offensive workflow logic, air-gapped deployment support, and security controls for highly sensitive government environments. Its differentiation appears to come from operator tradecraft and deployment fit rather than from a broad public developer ecosystem or a richly documented API surface.
