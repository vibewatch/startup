company:
  name: Twenty Technologies
chapter:
  number: 4
  title: Financials
  summary: 'Twenty’s public financial story is unusually asymmetric: financing signals are strong and easy to verify, while operating metrics remain largely undisclosed because the company sells into sensitive government cyber programs. The clearest evidence supports a government-contract revenue model, a research-and-engineering-heavy cost base, and meaningful post-Series-B capital flexibility. The core underwriting problem is not lack of demand; it is lack of public visibility into revenue quality, margins, customer concentration, and runway.'
