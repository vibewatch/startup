tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Public status
  - Revenue quality read
  - What is still missing
  rows:
  - - Mission software contracts
    - Agency contracts for offensive cyber capability and operational tooling
    - Supported by company press and media, but undisclosed in amount
    - Potentially high value and sticky if embedded in mission workflows
    - Exact contract structures, renewal terms, and recognition timing
  - - Deployment / forward support
    - Implementation, deployment, and mission enablement inside sensitive environments
    - Inferred from mission framing and forward-deployed hiring
    - Can accelerate adoption but may dilute software-like margin profile
    - Billable rates, attach rates, and staffing intensity
  - - Training / analyst support
    - Operator enablement, onboarding, and workflow support
    - Not separately disclosed
    - Could deepen lock-in but may behave like services revenue
    - Whether training is priced separately or bundled
  - - Classified program work
    - Sensitive or classified projects with little public disclosure
    - Clearly implied by customer set and Forbes reporting
    - May be large and durable, but nearly impossible to verify externally
    - Revenue mix, margin, and collection profile by program
  - - Follow-on expansion
    - Additional agencies, mission sets, or contract growth from existing footholds
    - Not disclosed
    - Could be the main long-term upside lever
    - Net expansion evidence and multi-year backlog
  notes: Rows distinguish visible revenue mechanisms from unverified revenue amounts.
