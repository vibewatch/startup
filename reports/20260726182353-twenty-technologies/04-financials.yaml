- id: cost-structure-unit-economics-and-benchmarking
  title: Cost structure likely looks like a defense software-services hybrid
  body: 'Twenty’s cost base appears to center on research engineering, cleared operator talent, compute, and forward deployment rather than on manufacturing or inventory. The company’s hiring page supports that interpretation: engineering, offensive cyber research, forward-deployed, and site-reliability roles dominate, while finance and accounting roles are only now being added. This profile suggests a company still investing heavily in product and mission delivery. It is probably more scalable than a pure services contractor, but also likely more labor- and compute-intensive than a clean enterprise SaaS model. Public-company benchmarks sharpen the point. Palantir’s Q1 2026 filing shows how profitable national-security software can become at scale, with about 87% GAAP gross margin, strong operating cash generation, and large deferred revenue balances. But those disclosures are precisely what Twenty lacks. Darktrace’s annual report similarly illustrates how public cyber platforms disclose
    far more about composition and governance. The conclusion is not that Twenty is weak; it is that public unit economics remain largely non-computable.'
