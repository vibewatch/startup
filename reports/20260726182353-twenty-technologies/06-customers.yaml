- id: named-customer-proof-and-adoption-signals
  title: Named proof is credible but still sparse
  body: The public proof set is narrow but meaningful. Forbes and Tectonic both point to a U.S. Cyber Command contract worth up to $12.6 million, while Forbes 2026 reported a December 2025 AFOSI contract worth up to $640,000. Forbes 2025 and Tectonic also referenced a $240,000 Navy research contract. Battle Policy went further by describing the Pentagon as running Twenty’s AI against live targets, which strengthens the case that adoption is not merely conceptual. On top of that, customer-facing roles show that deployment requires hands-on support, training, playbooks, and workflow translation, all of which are consistent with real field usage. Still, the proof set has obvious limits. These are contract and role signals, not broad deployment dashboards. Public sources do not reveal how many teams are active, whether the work is pilot or scaled production in each case, or what outcomes customers are actually measuring.
