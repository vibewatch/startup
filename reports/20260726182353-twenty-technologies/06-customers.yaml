- id: retention-expansion-and-concentration
  title: Durability is unknown and concentration is high
  body: This chapter’s central negative conclusion is that customer durability cannot be underwritten from public evidence. No customer count, NRR, GRR, churn, renewal rate, or contract-length data were found. That does not mean the relationships are weak; it means they are opaque. The likely expansion pattern is also unusual. Rather than seat-count upsell, growth probably comes from moving one mission team from demo to operational use and then expanding into additional workflows or neighboring offices. That can create strong internal account growth, but only if the initial deployment proves mission value. The concentration issue is more obvious. The Pentagon is the only publicly named umbrella customer, and the visible subcomponents — U.S. Cyber Command, AFOSI, and the Navy — all sit inside the same broad national-security buyer system. On the public record, that is a very concentrated base. That absence of observable durability data is especially important because customer quality in defense
    software often hinges on slow but sticky renewals rather than broad top-of-funnel volume.
  claimRefs:
  - CU017
  - CU018
  - CU020
  - CU021
  - CU027
  - CU028
