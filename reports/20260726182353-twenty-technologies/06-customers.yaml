company:
  name: Twenty Technologies
chapter:
  number: 6
  title: Customers
  summary: 'Twenty’s public customer proof is much stronger than its public retention or diversification proof. Open sources support real relationships inside the Pentagon umbrella — including U.S. Cyber Command, AFOSI, and a Navy research contract — and customer-facing roles indicate that Twenty is working directly with operators, analysts, mission owners, and Intelligence Community teams. But the customer base is also highly opaque and highly concentrated: public evidence does not disclose customer counts, renewals, or non-Pentagon diversification.'
