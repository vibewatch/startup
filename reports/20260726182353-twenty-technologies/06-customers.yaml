  reason: Sources were fetched and reviewed during research phase; content verified before inclusion as evidence in this chapter.
sections:
- id: customer-base-and-segmentation
  title: Customer base is concentrated inside U.S. national security
  body: Everything in the open record points to a very narrow customer universe. Twenty is not marketing itself to commercial enterprises, and no reviewed source identifies public private-sector customers. Instead, company materials and reporting consistently place the customer base inside the U.S. military and Intelligence Community. That matters because the buyer map is more complicated than a normal B2B SaaS company. Procurement may sit with a Pentagon office or program manager, but day-to-day users appear to be operators, targeters, analysts, and mission owners. The Mission Deployment Lead role is especially revealing because it explicitly references Intelligence Community teams and moving them from demo or pilot to operational use. This implies a buyer-user-payer split where adoption lives in the field, not just in headquarters procurement. It also means customer segmentation should be thought of by mission environment and command structure rather than by industry vertical or SMB/enterprise
    tiers.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU009
  - CU010
  - CU011
  - CU015
  - CU016
  tableRefs:
  - TU001
