  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: Twenty 真正所在的市场
        blocks:
          - type: paragraph
            body: >-
              评估 Twenty 的可寻址市场，最常见错误是从整个网络安全软件行业起步，然后就停在那儿。这个头部市场太宽。Twenty 不卖通用企业
              SOC、身份平台或云安全套件。公司自身材料、投资人说明和独立报道，都把它放在更窄的问题集：面向美国政府用户的工业化规模进攻性网络行动，这些用户需要跑得比纯人工工作流更快。实践中，Twenty 位于 AI
              赋能网络自动化、国家安全任务软件和进攻性网络行动的交叉点。更广义的 AI 网络安全市场仍会影响这个交叉点，因为相邻供应商正在把智能体式响应、自动化和机器速度分析变成常态。但 Twenty
              的真实市场由信任、保密资质、任务合法性和网络力量生成短缺把门。因此，公开商业 TAM 数字适合作为外边界和战略背景，不适合直接映射收入。
            claimRefs:
              - CM001
              - CM024
