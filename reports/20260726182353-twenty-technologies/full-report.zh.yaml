              外壳。它把自己定位为进攻性网络行动的任务平台。公司材料持续把产品框定为现代网络冲突中的软件和能力，外部报道又补充了更多行动细节：目标识别、侦察、入侵支持和并行化行动执行。这一框定很重要，因为它改变了尽调应采用的心智模型。买方不是购买商品化安全控制，而是在采用一种任务工作流，把
