chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、任务与运营姿态
        blocks:
          - type: paragraph
            body: >-
              Twenty 的公开材料几乎没有留下悬念：公司想做哪类公司非常明确。官网、关于页面、投资人公告和 2026 年 6
              月融资报道，都把公司定位为进攻性网络专家，而不是宽泛的企业安全供应商。它的核心主张是，美国及盟友需要工业化规模的网络能力，而不是小作坊式手工技艺，因为对手已经在大规模目标集上以机器速度行动。因此，公司把自己的软件描述为面向美国机构的端到端网络行动平台，让分析师和行动人员并行处理多个目标，同时把重大决策中的人类判断保留下来。这个定位对尽调很关键，因为
              Twenty
              被放进一个少见类别：一家获风投支持、销售接近网络冲突能力的公司，而不只是防御工具。同一套叙事也立刻把潜在买方收窄到具备保密资质的美国及盟友国家安全机构，这解释了为什么公开记录中任务叙事和融资信息丰富，而客户数、ARR、净留存等普通
              SaaS 指标稀薄。
