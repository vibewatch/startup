              Twenty 的信号一半是鼓舞，一半是警示。鼓舞之处在于，资本市场显然相信国家安全 AI 平台。警示之处在于，被认定为类别领导者的门槛很高，而且通常由更宽产品版图、硬件连接和比 Twenty
              当前公开证据更可见的政府项目支撑。Rebellion Defense 还强化了另一个教训：国防 AI
              格局里挤满了围绕关键资产兜售情报、传感器融合和任务软件的公司；相邻供应商一旦转向网络赋能任务工作流，战略空白会迅速关闭。
