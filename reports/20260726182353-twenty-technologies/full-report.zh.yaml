      - number: '1.4'
        title: 里程碑、公开验证点与下行背景
        blocks:
          - type: paragraph
            body: >-
              即使披露有限，公司也积累了几项真实验证点。Forbes 报道，Twenty 在公开发布前已经拿下最高 $12.6 million 的 U.S. Cyber Command 合同和一项 Navy 研究奖励；其
              2026 年 7 月后续报道把 Pentagon 认定为公司唯一公开承认的客户，并点名一份最高 $640,000 的 AFOSI 合同。WVU 2026 年 5
              月的合作公告给出另一类信号：公司对国家安全需求叙事足够有信心，围绕进攻性网络和 AI 赋能系统搭建人才管道。Accel 的投资说明还称，政府用户需要帮助时会第一时间找
              Twenty。与此同时，下行背景也真实存在。Virginia Business 称公司没有披露收入、员工数或客户数；Forbes
              称其拒绝提供完整收入数据；围绕自主和私营部门网络行动的法律与政策评论也提醒，这一赛道的公司将面对不断上升的监督、问责和升级风险。因此，尽调应把 Twenty
              视为一家快速上升但仍不透明的国防科技公司：可见客户验证有分量，但远未完整。
