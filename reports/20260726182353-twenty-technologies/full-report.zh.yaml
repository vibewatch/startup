      - number: '2.3'
        title: 谁买、谁用，采用路径可能怎么走
        blocks:
          - type: paragraph
            body: >-
              这个市场的买方地图不寻常，因为用户、付款方和授权方往往不是同一批人或机构。行动人员和分析师可能是最终用户，但资金可能在 Cyber Command、军种网络部队、调查单位、情报机构，或国防部层面的网络与 AI
              账户里。公开证据也显示，大学、力量发展项目和主承包商可以在人才和部署周边扮演赋能角色。因此，采用不只取决于产品表现。软件必须适配受控环境，通过安全审查，贴合行动条令，并在关键决策上保留人类判断。公开政策来源也强化了这一点。White
              House 网络战略和 DOD 评论支持更多进攻性网络能力和更多 AI 赋能，但 CYBERCOM 的 AI 路线图以及后续 Senate 关于自主系统的讨论，都强调监督使用、评估和记录。这一组合给 Twenty
              这类公司带来真实市场顺风，同时也让大范围采用慢于普通商业软件。
