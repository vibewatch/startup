  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 逻辑链从融资标记和客户证据出发，经过可比公司局限和披露缺口，落到最终建议。
    data:
      nodes:
        - id: price
          label: 2026 年融资标记
          detail: 6 月 $1.0B、7 月 $1.2B，建立真实价格锚。
        - id: proof
          label: 任务证据
          detail: 以 Pentagon 为中心的客户证据和进攻性网络定位，显示战略相关性。
        - id: comps
          label: 可比公司组
          detail: 防务 AI 龙头展示上行空间，上市网络安全可比公司提供纪律约束。
        - id: gaps
          label: 披露缺口
          detail: 收入、毛利率、留存、集中度和股权结构细节仍未公开。
        - id: risk
          label: 风险折扣
          detail: 集中度、政策和融资不透明度拉宽情景区间。
        - id: decision
          label: 建议：继续研究
          detail: 足够有吸引力，值得推进；但披露不足，不足以按表面价格放心买入。
      edges:
        - from: price
          to: comps
          label: 必须对照通过
        - from: proof
          to: comps
          label: 支撑溢价
        - from: comps
          to: gaps
          label: 被削弱
        - from: gaps
          to: risk
          label: 驱动
        - from: risk
          to: decision
          label: 迫使谨慎
        - from: proof
          to: decision
          label: 让项目继续保留
    approximationNotes: 该图是投资委员会推理辅助工具，不是数学模型；每个节点都把几条公开事实压缩成一个关口判断。
    claimRefs:
      - CV004
      - CV018
      - CV022
      - CV028
      - CV029
      - CV046
      - CV047
      - CV048
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 已观察到的估值标记和分析师承销情景显示，投资者一旦从纯叙事支撑转向更强证据，隐含价值会变化多快。
    data:
      items:
        - label: 熊市承销筛选
          value: 750
          detail: 若不透明度和集中度占主导，公开熊市情景的中点。
        - label: 2026 年 6 月官方标记
          value: 1000
          detail: 公司公布的 Series B 估值。
        - label: 基准承销筛选
          value: 1250
          detail: 公开基准情景的中点，接近当前估值标记。
        - label: 2026 年 7 月官方标记
          value: 1200
          detail: 公司公布的 Khosla 延长轮估值。
        - label: 牛市承销筛选
          value: 2150
          detail: 公开牛市情景的中点，需要更广部署和更好经济性。
        - label: Shield AI 2026 年标记
          value: 12700
          detail: 私营防务 AI 类别龙头参照。
        - label: Helsing 2026 年报道标记
          value: 18000
          detail: 欧洲防务自主性溢价参照。
        - label: Anduril 报道中的讨论标记
          value: 100000
          detail: 极高天花板参照，不是直接可比公司。
    approximationNotes: 柱状条混合了已观察到的公司或可比估值，以及分析师生成的承销筛选值（$M），用于展示相对支撑水平，而不是给出单一公允价值结果。
    claimRefs:
      - CV001
      - CV002
      - CV009
      - CV010
      - CV011
      - CV033
      - CV034
      - CV035
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 基于公开信息的低位、基准和高位价值结果，覆盖熊市、基准、牛市情景以及已观察到的融资锚。
    data:
      items:
        - label: 熊市情景价值（$M）
          low: 600
          base: 750
          high: 900
          unit: $M
          note: 若不透明度和集中度占主导，结果会落向专精承包商或重折扣情景。
        - label: 基准情景价值（$M）
          low: 1000
          base: 1250
          high: 1500
          unit: $M
          note: 若需求保持强劲且没有负面意外，目前公开信息下最站得住脚的区间。
        - label: 乐观情形估值（$M）
          low: 1800
          base: 2150
          high: 2500
          unit: $M
          note: 需要打进更多政府机构，并证明具备软件型经济性。
        - label: 2026 年 6 月官方锚点（$M）
          low: 1000
          base: 1000
          high: 1000
          unit: $M
          note: 历史融资参照，不是独立公允价值。
        - label: 2026 年 7 月官方锚点（$M）
          low: 1200
          base: 1200
          high: 1200
          unit: $M
          note: 最新公开融资参照，仍受非上市公司信息不透明影响。
    approximationNotes: 这些区间只基于公开信息推演；未纳入任何未披露的优先权层级、二级交易结构或非公开财务数据。
    claimRefs:
