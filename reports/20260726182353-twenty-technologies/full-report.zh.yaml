      - CV023
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 投委会式评分同时权衡战略相关性、证据质量和价格纪律。
    data:
      items:
        - label: 赛道动能
          value: 4/5
          detail: 2026 年，国防 AI 和 AI 网络安全需求仍强劲。
        - label: 客户验证质量
          value: 4/5
          detail: 政府客户验证看起来扎实，但仍然集中。
        - label: 护城河叙事
          value: 4/5
          detail: 进攻性网络安全能力稀缺，且契合任务场景，支撑差异化。
        - label: 经济性披露
          value: 1/5
          detail: 没有公开的收入、利润率、留存或业务结构材料。
        - label: 股权结构清晰度
          value: 1/5
          detail: 没有公开的清算瀑布或优先权信息。
        - label: 可比公司匹配度
          value: 2/5
          detail: 有相关可比公司，但没有一家是纯粹的进攻性网络安全同行。
        - label: 当前入场吸引力
          value: 2/5
          detail: 公司值得关注，但最新价格已经跑在公开证据包前面。
    claimRefs:
      - CV019
      - CV020
      - CV022
      - CV024
      - CV027
      - CV028
      - CV029
      - CV032
