  - id: TV002
    title: 投资假设 / 反向假设表
    columns:
      - 视角
      - 乐观假设
      - 反向假设
      - 哪些证据会改变判断
    rows:
      - - 任务重要性
        - Twenty 卡在 AI 与进攻性网络行动的关键交叉点。
        - 任务重要，不等于经济性可规模化、可重复。
        - 证明部署能在少数敏感项目之外持续扩张。
      - - 可比标的稀缺
        - 直接同业有限，稀缺品类可以拿到溢价定价。
        - 稀缺也容易把相邻国防 AI 赢家的乐观预期过度套用进来。
        - 给出足够的公司自身经济性，降低对嘈杂可比公司的依赖。
      - - 政府客户证明
        - 以 Pentagon 为核心的证明，可能比浅层商业 logo 清单更有力。
        - 过度依赖很小的买方圈子，会放大集中度和政策风险。
        - 披露客户广度、续约深度和多元化趋势。
      - - 产品经济性
        - 如果毛利够强，软件赋能的网络行动可以支撑类软件估值。
        - 公开证据还没有显示经常性收入占比、留存，或软件级毛利结构。
        - 按项目或产品线披露 ARR、毛利率和服务收入占比。
      - - 融资动量
        - 2026 年 6 月和 7 月轮次显示投资人兴趣仍在。
        - 公司主导的价格信号，不等于可独立验证的公允价值。
        - 给出第三方价格验证，或更充分的经营披露。
    notes: 反向假设的核心不是公司缺乏战略重要性，而是好公司也可能买贵。
    claimRefs:
