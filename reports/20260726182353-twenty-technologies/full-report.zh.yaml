  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前融资背景足以支持兴趣，但不足以支撑自满
        blocks:
          - type: paragraph
            body: >-
              Twenty 在公开视野中有清晰的 2026 年价格阶梯。公司 6 月 17 日宣布以 $1B 估值完成 $100M Series B 轮融资，随后又在 7 月 21 日宣布 Khosla Ventures 以
              $1.2B 估值追加 $30M。两次融资都是真实市场信号，也很重要，因为许多私有公司连这点定价信息都不会披露。融资还说明，成熟投资人仍把 AI
              驱动的国家安全软件视为溢价品类。问题不在于公开估值是编造的，而在于估值远比背后的经济性更可见。公开来源仍没有给出当前收入、毛利率、留存、按机构划分的集中度或资本结构条款。价格与经济性错配意味着，融资背景可以作为历史锚点和动量信号，但还不足以构成完整证据包，无法让新的外部投资人判断最新估值是否有吸引力，而不只是足够新。
