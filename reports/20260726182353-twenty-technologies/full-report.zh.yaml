      - number: '2.4'
        title: 增长驱动、约束与最终市场读数
        blocks:
          - type: paragraph
            body: >-
              Twenty 背后的需求驱动强，而且相互强化。公开威胁情报来源称，GenAI 正在降低钓鱼、恶意软件开发和操纵的门槛；Darktrace 和 Elastic
              显示，买方越来越期待机器速度的推理与响应；国家安全政策来源也反复把网络冲突描述为持续状态，而非偶发事件。从这个意义上说，Twenty
              同时踩在威胁膨胀和条令变化上。但采用约束同样真实。这个市场采购慢、预算分散、涉密需求不可能被完整看见，进攻性自主还会带来法律和声誉风险。另一个约束是，同一波 AI 网络安全热潮既帮
              Twenty，也在资助相邻防御平台；如果客户最终认为自己主要需要防御或两用工具，而不是专门进攻栈，Twenty
              的差异化可能被压缩。因此，本章结论积极但有边界：市场足够大、足够急迫，也有预算支撑，足以支撑风险投资级回报，但前提是 Twenty 能把任务紧迫性转化为耐久、生产级项目，而不是孤立概念验证。
