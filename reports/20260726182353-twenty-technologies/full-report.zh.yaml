        title: 上市网络安全与数据平台：替代品和基准
        blocks:
          - type: paragraph
            body: >-
              Palantir 是最相关的公开采购基准，哪怕它不是纯网络安全公司。它的申报文件展示了后期国家安全软件可达到的规模、披露纪律和政府可信度，包括 2026 年 Q1 超过 $1.6 billion
              收入。Elastic、ZeroFox 和 Darktrace 更直接面向网络安全，但定位明显偏防御和商业：Elastic 是 SIEM/XDR 与智能体 SOC，ZeroFox
              是外部威胁情报和关停行动，Darktrace 是 AI 主导的防御性网络行动。这些公司证明，买方不用押注一家带涉密属性的进攻专家，也已经能获得一定水平的客户验证、ROI 包装和可见规模。与此同时，它们的宽度相对
              Twenty
              也是限制。没有一家公开把自己定位为面向美国机构、专门工业化进攻性网络行动的公司。因此，替代风险是部分而非完全：这些公司可以满足问题的某些切片，尤其是检测、响应、情报和工作流工具，但未必能干净映射到高端进攻性任务执行。
