  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式只有轮廓可见，指标不可见
        blocks:
          - type: paragraph
            body: >-
              公开记录足以勾勒 Twenty 的经济形态，但不足以按常规方式承销。公司向政府和情报买方销售 AI
              赋能网络能力，媒体报道和公司材料也持续把产品描述为面向战斗人员部署的任务软件，而不是商品化软件席位。因此，最贴合的解释是政府项目收入模式：谈判合同、部署工作、持续支持，以及敏感环境中的里程碑制或用量挂钩工作。公开证据没显示什么，同样重要。Twenty
              没有发布定价、ARR、毛利率，也没有公布客户数，只给出高度选择性的引用。Forbes
              报道称，公司拒绝提供完整收入数据；公司官网也没有费率表或产品化变现信息。因此，当前牵引力只能从投资人背书、合同信号和机构相关性推断，而不是从普通 SaaS 指标读出。这足以用于战略尽调，但对投资承销偏弱。
