  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律审查可能比产品演进收紧得更快
        blocks:
          - type: paragraph
            body: >-
              第一类风险是法律和监管。Twenty 销售的不是通用防御软件，而是 AI
              赋能的进攻性网络能力。仅这一点，就让它暴露在围绕自主性、武力使用、出口管制，以及软件辅助与行动行为边界的审查之下。公开证据已经显示几套重叠治理系统。DoD 自主政策强调人类判断和审查。ICRC、Human
              Rights Watch 和 West Point 法律分析都认为，目标选择和武力应用中的自主性，会带来未解决的问责问题。BIS 和 DDTC
              同时指向出口管制制度：当网络能力、入侵软件功能或技术援助跨越监管边界时，这些制度可能变得关键。结果不是单一清晰风险，而是分层风险：政策收紧、涉密分类模糊、合规成本上升，都可能在正式禁令到来前出现。实践中，这迫使尽调同时审视现行法律和未来规则制定的可能轨迹，因为明天保持合规的成本，可能远高于公司今天公开姿态所暗示的成本。
