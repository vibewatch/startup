      - number: '2.2'
        title: 用多重视角测算机会
        blocks:
          - type: paragraph
            body: >-
              分析师市场报告说明，尽调不该被一个自上而下数字牵着走。MarketsandMarkets 将 2026 年 AI 网络安全市场估为 $25.53 billion，Polaris 为 $38.89
              billion，Fortune Business Insights 为 $44.24 billion。这些估算方向一致——快速增长、自动化加深——但不能互换。它们混合了不同边界、商业垂直和部署模式。更适合
              Twenty 的测算方法，是把这些宽口径估算同公开国防预算，以及可能购买作战网络软件的具体预算科目交叉校准。CRS 报告 FY2026 DOD 网络预算请求约 $15.1 billion，其中 $5.4
              billion 用于网络空间行动，约 $2.6 billion 与 Cyber Command 资源相关。这个国防预算视角也不是 Twenty
              的收入机会，因为大量资金流向人员、基础设施、战备和涉密项目。但相比商业零售或 BFSI 网络安全支出，它更接近公司的相关需求基础。结论是：TAM 大到值得关注，SAM 窄得多；没有私有采购和合同数据，SOM
              仍不透明。
