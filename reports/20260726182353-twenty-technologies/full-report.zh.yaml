              采购中心转向，或产品在受限环境中部署成本过高、韧性不足，投资逻辑会很快削弱。因此，正确的风险判断不是“不可投”，而是“对证据敏感”。任何承销流程都需要在分类定密、法律审查、部署可靠性、集中度和续约深度上拿到具体证据，才能把当前势头视为可持续。也因此，本章的核心建议是有纪律的后续尽调，而不是因市场顺风而被动安心。
