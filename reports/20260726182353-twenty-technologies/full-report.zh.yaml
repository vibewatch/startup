              最可验证的财务事实是，Twenty 在很短时间内筹集了大量私募资本。2026 年 6 月 Series B 把已披露总融资推至 $138 million；Forbes 后来报道称，Khosla
              追加投资后总融资达到 $168 million。这一资本基础很重要，因为公开来源可见的合同上限远小于融资池，意味着公司仍在搭建更大的长期收入基础，而不只是收割已知披露合同。Series B
              新闻稿还称，资金将直接投入研究和工程，这符合公司的招聘节奏和产品野心。即便如此，资本充足性也无法干净转化为现金跑道，因为公开消耗、账上现金、债务和受限项目营运资金需求都未披露。最多只能说，融资依赖降低了，但没有消失。下一轮资本形成触发点很可能是规模化部署、更广机构采用，或市场对利润率和可重复性的信心增强。
