      - number: '8.2'
        title: 战略论点真实存在，反论点主要在于过度外推
        blocks:
          - type: paragraph
            body: >-
              Twenty 的建设性逻辑强于普通国防科技叙事。公司公开关联的是进攻性网络行动，而不是商品化安全工具；它强调人类判断在回路中；从公开信息看，它正在美国网络行动中价值最高的买方体系内部工作。Accel
              对工业规模网络行动的表述契合这一叙事，也解释了投资人为何愿意容忍溢价估值。反论点并不是公司没有实质，而是投资人很容易把 Shield AI、Helsing、Anduril 或 Palantir
              等更广泛赢家的估值逻辑，过度迁移到一个更窄、更不透明的业务上。进攻性网络的稀缺性是双刃剑：直接同业稀少，故事因此更好讲；但可比公司集合也更嘈杂，估值纪律更难守住。投资人可能从相邻国防 AI
              品类偷渡乐观情绪，而那些品类往往规模更可见、产品范围更广或披露更充分。
