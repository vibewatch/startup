      - number: '8.4'
        title: 可比基准只有在明确限制时才有用
        blocks:
          - type: paragraph
            body: >-
              Twenty 的可比集合应当有意混合。Shield AI、Helsing 和 Anduril 说明，国防 AI 平台在 2026
              年可以获得非凡的私募估值，但它们是更宽的自主系统和软硬件系统，并不是干净的进攻性网络类比。Palantir 相关，因为它是美国政府大规模 AI
              最知名的公开基准；但正是规模，让它更像天花板参考，而不是同业。Elastic 和 Darktrace 有用，因为它们是披露成熟、容易读懂的公开安全软件公司；ZeroFox 和 IronNet
              则提供警示：网络安全品牌和政府邻近性并不能消除执行或融资风险。结论不是某一个可比公司能终结争论。更准确地说，可比集合划出区间：广义国防 AI
              龙头显示品类上限，公开网络软件公司显示经济性披露应有的样子，负面先例则提醒投资人，不透明应当被折价。
