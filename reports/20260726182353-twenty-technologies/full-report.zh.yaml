  - id: TV005
    title: 假设失效与终止触发表
    columns:
      - 触发项
      - 阈值或事件
      - 对投资假设的传导
      - 行动含义
    rows:
      - - 经济性继续不透明
        - 尽调期间没有出现有意义的收入、毛利、留存或收入结构披露。
        - 乐观和基准情景仍过度依赖叙事和可比公司。
        - 建议维持继续研究；价格不合适就退出。
      - - 集中度被证明极端
        - 极少数项目或机构主导价值。
        - 客户和政策风险从边缘变量变成核心变量。
        - 要求更深折价，或拒绝推进。
      - - 政策或出口摩擦上升
        - 法律审查或政策变化收窄部署路径。
        - 即使技术需求真实，可触达规模也会收缩。
        - 将估值区间向悲观情景重切。
      - - 股权结构显示大量优先权
        - 优先股权利或其他高级索赔显著压低新股权顺位。
        - 名义估值夸大普通股上行空间。
        - 任何投资决策前，都要求完整清算分配瀑布分析。
      - - 经济性达到软件水准
        - 管理层展示强毛利、强留存和经常性收入占比。
        - 可比视角可以更接近高溢价软件和国防 AI 参照。
        - 价格有更充分支撑时，重启投资测算。
    notes: 这些触发项刻意设为可观察、且直接影响投资；它们描述哪些事件会推翻或实质改善仅靠公开信息得出的判断。
    claimRefs:
      - CV025
      - CV031
      - CV037
      - CV038
      - CV044
      - CV045
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前收入质量
        - 按机构 / 项目拆分的当前收入或 ARR、增长、续约和集中度
        - 没有这些，估值支撑就过度依赖叙事和可比公司迁移。
        - 要求 CFO 材料包，或带头部客户桥接的投资人演示。
      - - 毛利结构
        - 按经常性软件、服务和一次性工作拆分的毛利
        - 这决定软件可比公司只是愿景，还是确实能用。
        - 要求产品和合同层面的贡献视图。
      - - 试点转化和积压订单
        - 从试点到作战项目的转化率，以及按买方拆分的积压订单
        - 这能说明客户证明可重复，而不是个案轶事。
        - 要求按机构拆分的销售 / 部署漏斗。
      - - 资本结构
        - 股权结构、优先权堆栈和清算分配瀑布
        - 普通股上行不能只靠投后名义估值推断。
        - 要求法律资本结构表和瀑布模型。
      - - 监管姿态
        - 关于出口、自主性和部署控制的法律审查
        - 即使买方热情很高，政策摩擦也可能卡住部署广度。
        - 要求律师备忘录和内部审查控制。
    notes: 这份要求清单刻意保持简短，面向投委会：每一行都可能实质改变建议、信心或价格纪律。
    claimRefs:
