companyProfile:
  summary: >-
    Twenty Technologies 是一家位于 Virginia 州 Arlington 的进攻性网络初创公司，成立于 2024 年。公开材料和报道显示，公司正在为美国军事和情报客户构建 AI
    赋能的端到端网络行动软件，同时把关键决策中的人类判断保留下来。创始团队由国家安全网络行动人员，以及 Expanse、Palo Alto Networks、Palantir、DHS
    背景组成；招聘广度和客户验证也足以支持一个判断：公司已经进入严肃政府任务环境。估值难点不在相关性不足，而在经济指标披露不足：公开来源尚未披露收入、毛利率、集中度、留存或股权结构细节，无法高置信度支撑最新私募估值。
