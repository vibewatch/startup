      - number: '8.3'
        title: 围绕基准情形的估值区间比叙事暗示的更窄
        blocks:
          - type: paragraph
            body: >-
              情景分析在这里很重要，因为公开证据只能支持有边界的乐观。熊市情形不需要灾难，只需要投资人把 Twenty 更像一家客户集中、专业化的政府承包商来看待，且其软件经济性不透明，而不是把它看作平台级国防 AI
              冠军。按这种框架，估值低于 6 月独角兽标记就变得合理。基准情形更平衡：它承认真实任务相关性、投资人质量、品类顺风，以及公司已经在很短时间内连续跨过 $1.0B 和 $1.2B
              估值。但它仍要因缺少财务披露和客户集中而打纪律折扣。牛市情形存在，但不能只靠动量。它需要证据证明，部署能在多个机构间复制，经济性足够像软件、能支撑溢价倍数，并且公司能从细分进攻能力复利扩展成更广、更耐久的国防平台。
