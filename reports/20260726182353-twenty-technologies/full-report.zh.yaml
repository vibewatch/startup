      - number: '1.2'
        title: 创始人、领导梯队与创始人-市场匹配
        blocks:
          - type: paragraph
            body: >-
              创始人-市场匹配是公开身份叙事中最强的一环。Joe Lin、Leo Olson、Skyler Onken 和 Pete Sorrentino 都来自美国国家安全网络生态，以及 Expanse/Palo Alto
              Networks 的国家安全技术栈，这让公司在涉密买方面前有异常强的可信度。Lin 有产品和政策经验；Olson 有深厚技术背景，并曾在 Army、NSA、CYBERCOM 任职；Onken 的可信度来自
              CYBERCOM 和 Army 的一线行动经历；Sorrentino 则带来 Expanse、Palantir 和 DHS 的增长与采购经验。官网关于页面还补上了财务、政策和工程等第二层领导团队，说明
              Twenty 正从创始人主导的隐身初创，成熟为职能覆盖更广的运营公司。招聘数据也强化了这一判断：公司当时在工程、任务部署、产品、财务和人才等方向发布了数十个岗位，许多岗位绑定 Arlington、Fort
              Meade 或其他政府相邻枢纽。缺口仍在正式治理透明度。公开来源仍没有完整董事会名单、持股比例，或创始人与已披露副总裁之外的继任框架。
