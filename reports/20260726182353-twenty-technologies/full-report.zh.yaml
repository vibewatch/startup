        title: 成本结构可能像国防软件-服务混合体
        blocks:
          - type: paragraph
            body: >-
              Twenty
              的成本基础看起来集中在研究工程、涉密行动人才、算力和前沿部署，而不是制造或库存。公司的招聘页面支持这一判断：工程、进攻性网络研究、前沿部署和站点可靠性岗位占主导，财务与会计岗位才刚开始补齐。这个画像说明，公司仍在重投入产品和任务交付。它大概率比纯服务承包商更可扩展，但也可能比干净的企业
              SaaS 模型更依赖人力和算力。上市公司基准把这一点看得更清楚。Palantir 的 2026 年 Q1 申报显示，国家安全软件做到规模后盈利能力可以很强：GAAP 毛利率约
              87%，经营现金流强，递延收入余额大。但这些披露正是 Twenty 所缺的。Darktrace 年报也说明，上市网络安全平台会对收入构成和治理披露更多。结论不是 Twenty 弱，而是公开单位经济性基本无法计算。
