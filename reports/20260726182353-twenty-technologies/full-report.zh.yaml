  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值区间（$B）
      - 概率信号
      - 决策含义
    rows:
      - - 悲观
        - 集中度仍高，经济性继续不透明，投资人按专业承包商折价看待这个故事。
        - $0.6-$0.9B
        - 如果没有新披露，且政策或采购摩擦上升，这一情景更可能发生。
        - 不要按最新私募估值或更高价格买入。
      - - 基准
        - 政府需求保持强劲，现有部署加深，没有出现重大负面尽调意外，但经济性仍只披露一部分。
        - $1.0-$1.5B
        - 与当前公开证据包最一致。
        - 只有条款克制或披露更好，才值得关注。
      - - 乐观
        - 部署拓展到更多机构，软件经济性得到证明，公司获得更清晰的平台龙头叙事。
        - $1.8-$2.5B
        - 需要目前尚未公开的证据。
        - 只有证据在价格继续上行前出现，才积极重启跟进。
    notes: 区间由分析师生成，使用公开融资估值标记、私募国防 AI 可比公司、公开网络安全软件参照，并明确计入不透明折价。
