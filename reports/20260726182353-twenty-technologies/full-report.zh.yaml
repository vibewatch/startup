      - number: '1.3'
        title: 融资历史、投资方与可见利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              资本形成速度异常快。Virginia Business 和 Forbes 认为公司于 2025 年 11 月公开亮相，当时它完成 $38 million 融资，由 Caffeinated Capital
              领投，General Catalyst 和 In-Q-Tel 参投。2026 年 6 月 17 日的 Series B 又新增 $100 million，估值 $1 billion，由 Accel
              领投，Friends & Family Capital、Point72 Ventures 和 Caffeinated Capital 参投。到那时，公开来源称累计融资为 $138 million。Forbes
              随后报道称，Khosla Ventures 到 2026 年 7 月又投资 $30 million，意味着当前估值约 $1.2 billion，已披露融资约 $168
              million。投资方组合与总额同样重要。In-Q-Tel 指向情报界相关性；Accel 和 Khosla 指向主流风险投资信念；Friends & Family Capital 则带来靠近 Palantir
              的国家安全网络。但公开证据仍留下关键股权结构问题。已审阅来源没有披露清算优先权、董事会席位、老股交易、债务或持股集中度，所以标称估值的经济含义仍只露出一部分。
