  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局是混合型，不是纯玩家对纯玩家
        blocks:
          - type: paragraph
            body: >-
              Twenty 的竞争环境异常混杂。一边是 Palantir、Elastic、ZeroFox、Darktrace
              等上市网络安全和数据既有厂商。这些公司平台更宽、更成熟、更容易审计，但主要服务防御、分析或企业场景。另一边是 Anduril 和 Shield AI，它们根本不是纯网络安全公司，却会争夺国防 AI
              资本、战略注意力和国家安全平台预算。Rebellion Defense
              展示第三类：面向关键资产、以任务为中心的情报和防护软件，但公开叙事并未定位为进攻性网络。这意味着尽调不该问：「谁是完全一样的公司？」而该问：「谁能吸走同一批买方预算、人才和政治背书？」按这个更宽的测试，Twenty
              同时在多个方向竞争。
