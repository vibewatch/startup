              Twenty 自己的描述强调严格评估、受控部署、任务对齐和人类判断。公司向国防和情报场景销售网络能力，这些点不是装饰，而是产品要求。Politico 关于 Pentagon 急于把强大 AI
              工具放进敏感网络的报道，解释了原因。可靠性、访问控制和符合政策的运行，是这个市场的生死门槛。IT Security Engineer 岗位又补上一层，指向漏洞管理、IAM、事件响应和合规工作流。前沿部署 SRE
              岗位说明，可靠性工程被推近客户环境，而不是只作为中央平台职能处理。这些都是强成熟度信号。与此同时，公开验证仍很薄：已审阅证据中看不到变更日志、基准测试套件、状态页或详细技术文档集。因此，成熟度图景是混合的——内部运营细节可信，外部可观察性偏弱。
