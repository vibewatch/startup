      - number: '8.5'
        title: 建议、否决触发项和尽调问题都对证据敏感
        blocks:
          - type: paragraph
            body: >-
              正确的投资姿态应当刻意有条件。基于公开证据，Twenty
              仍值得继续尽调，因为公司有真实战略相关性、活跃政府需求，以及许多更年轻网络公司缺少的投资人验证。但记录仍太不完整，无法在最新估值上给出干净的买入建议。合理立场是继续研究，信心中等、风险高，并配合偏高的估值判断；如果管理层打开经济性证据包，估值判断可能改善。最重要的尽调问题很直接：按机构划分的当前收入和续约、经常性收入与服务收入的组合、试点到项目的转化、资本结构优先级，以及法律或出口管制审查状态。同一批证据既可能上调判断，也可能打破判断。若集中度被证明极端、经济性远弱于投资人假设，或政策摩擦收窄部署路径，下行情形会很快从理论变成现实。
