            body: >-
              最强产品差异化信号不是可公开检查的算法或专利组合，而是工作流契合度。Twenty
              看起来把行动人员技艺编码进一个系统，让系统能自动化进攻性网络工作的有意义部分，同时仍可部署在高度受控环境中。这个组合让通用企业安全供应商很难快速模仿。技术风险仍然重要。依赖外部前沿模型可能影响成本或能力。敏感网络部署会放慢发布并让恢复更复杂。由于公开证据主要是叙事，外部观察者无法独立验证准确率、基准表现或集成广度。公司很可能在涉密或仅客户可见材料中回答了这些问题，但公开记录没有。正确产品结论因此是积极但有条件的：架构真实、工作流细节真实、部署复杂度真实——但对外部尽调者来说，重大证据缺口仍在。更深技术承销的关键缺失证据，是客户专属材料和涉密部署证据。
