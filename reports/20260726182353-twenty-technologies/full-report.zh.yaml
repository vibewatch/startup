  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 视角
      - 当前估值代理 / 状态
      - 重要性
      - 局限
      - 对 Twenty 的启示
    rows:
      - - Twenty 2026 年 6 月 Series B 轮
        - 历史私募锚点
        - $100M 融资对应 $1.0B 估值
        - 建立本年度第一个价格锚点。
        - 这是公司融资估值标记，不是公开市场出清价值。
        - 基线参照，不自动等于公允价值。
      - - Twenty 2026 年 7 月延展轮
        - 更新后的私募锚点
        - 追加 $30M，对应 $1.2B 估值
        - 显示一个月后投资人兴趣仍在。
        - 仍是公司主导信号，经济性披露有限。
        - 可用于理解动量，不适合精确定价。
      - - Shield AI
        - 私募国防 AI 龙头
        - $12.7B 估值
        - 显示投资人仍愿意为规模化自主系统龙头支付高价。
        - 产品范围和规模都比 Twenty 更宽。
        - 支撑高溢价品类逻辑，但不代表同业等价。
      - - Helsing
        - 私募国防 AI 龙头
        - 据报约 $18B 估值
        - 进一步说明全球投资人对国防自主系统的兴趣。
        - 欧洲语境和更宽的自主系统任务都明显不同。
        - 又一个天花板式私募参照。
      - - Anduril
        - 私募国防 AI 龙头 / 天花板
        - 已宣布 $61B 轮次；据报讨论约 $100B
        - 显示规模化国防平台可以长到多大。
        - 硬件、制造和规模让它远宽于 Twenty。
        - 只能作为品类上限信号。
      - - Palantir
        - 公开政府 AI 天花板参照
        - 拥有广泛政府 AI 规模的公开申报基准
        - 最能公开说明顶级政府 AI 公司该如何披露。
        - 规模和多元化程度远高于 Twenty。
        - 天花板参照，也是披露标准。
      - - Elastic
        - 公开安全软件参照
        - 具备成熟软件披露的公开申报基准
        - 显示经常性收入软件估值需要哪些支撑。
        - 商业软件组合不同于 Twenty 的买方和任务基础。
        - 更像披露基准，而非任务同业。
      - - Darktrace
        - 公开 AI 网络安全参照
        - AI 驱动网络安全平台的公开申报基准
        - 可参照一家已有披露的网络安全软件运营商。
        - 商业和国际业务组合明显不同。
        - 锚定软件质量预期。
      - - ZeroFox
        - 公开负面网络安全参照
        - 公开申报显示更高风险的股权结果集
        - 提醒投资人，网络安全叙事挡不住疲弱的公开市场结果。
        - 不是政府进攻性网络业务的类似标的。
        - 支撑估值谨慎。
      - - IronNet
        - 负面先例
        - 破产 8-K
        - 鲜明案例：即便贴着国家安全标签，网络安全股权仍可能大幅下行。
        - 困境案例不能一对一类比。
        - 支持计入不透明和融资折价。
    notes: 这是一组精选可比对象，不是完整行业普查。它有意混合当前私募国防 AI 估值、公开网络安全软件参照和负面先例。
