- id: mitigation-kill-criteria-and-verdict
  title: Mitigations exist, but several thesis-break triggers remain obvious
  body: The public record does show mitigation direction. Management emphasizes human judgment. Recruiting shows active investment in DevSecOps, SRE, mission deployment, and cleared talent. WVU shows some pipeline-building effort. But the crucial question is whether these mitigations are strong enough relative to the downside transmission paths. If export-control interpretation tightens, if the Pentagon buying center shifts, or if the product proves too costly or too fragile to deploy broadly in restricted environments, the investment case would weaken quickly. The right risk verdict is therefore not “uninvestable,” but “evidence-sensitive.” Any underwriting process needs specific proof on classification, legal review, deployment reliability, concentration, and renewal depth before treating current momentum as durable. That is why the chapter’s central recommendation is disciplined follow-up diligence rather than passive comfort from favorable market momentum.
  claimRefs:
