sections:
- id: regulatory-and-legal-risk
  title: Regulatory and legal scrutiny could tighten faster than the product evolves
  body: 'The first risk category is legal and regulatory. Twenty is not selling generic defensive software; it is selling AI-enabled offensive cyber capability. That alone exposes it to scrutiny around autonomy, use of force, export control, and the boundary between software assistance and operational action. Public evidence already shows several overlapping governance systems. DoD autonomy policy emphasizes human judgment and review. ICRC, Human Rights Watch, and West Point legal analysis all argue that autonomy in targeting and force application raises unresolved accountability issues. BIS and DDTC meanwhile point to export-control regimes that can matter when cyber capabilities, intrusion-software functionality, or technical assistance cross regulatory lines. The result is not a single clean risk but a layered one: policy tightening, classification ambiguity, and compliance-cost growth can all emerge before any formal prohibition arrives. In practice, this forces diligence to examine
    both current law and the trajectory of likely future rulemaking, because the cost of being compliant tomorrow may be much higher than the cost implied by today’s public posture.'
