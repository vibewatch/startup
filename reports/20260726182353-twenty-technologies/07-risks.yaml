- id: customer-financial-and-execution-risk
  title: Concentration and execution risk are inseparable
  body: 'The third major category combines customers, finances, and execution. Public evidence suggests the buyer base is overwhelmingly Pentagon-centric. That concentration can be strategically attractive when the mission fit is strong, but it is still concentration. Budget reallocations, command restructurings, or procurement freezes can transmit almost directly into revenue because public diversification is limited. At the same time, customer success appears labor-intensive: mission deployment, forward-deployed analysts, and solutions translation seem central to converting pilots into operational use. That can create a defensible moat, but it also means scale may require scarce people, not just more software. Combined with limited public margin or renewal disclosure, this leaves a meaningful risk that demand remains real while economics or repeatability prove weaker than the narrative suggests. It also means that execution mistakes are not isolated: a weak deployment or a policy stumble
    can echo across the same buyer system and contaminate future procurement conversations.'
