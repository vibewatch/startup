- id: operational-and-dependency-risk
  title: Restricted-environment deployment and supplier dependencies are material operating risks
  body: The second risk category is operational. The public role mix makes clear that Twenty is not shipping effortless commodity SaaS. It is supporting restricted, sometimes air-gapped environments, hardening infrastructure, managing identity and secrets, and embedding field-facing staff into customer operations. That is a demanding delivery model. The company also appears dependent on external AI models and commercially available model ecosystems even if it can choose among providers. This helps flexibility, but it does not remove supplier, policy, or cost risk. If model access changes, if hosting constraints tighten, or if customer environments are harder to support than expected, delivery cost and deployment speed can deteriorate quickly. Because public uptime, incident, and failover data are absent, the outside observer can see the burden, but not the success rate of the mitigations. For a company serving sensitive government environments, each of these operational dependencies has
    strategic weight because remediation windows are slower and failures can damage trust quickly.
  claimRefs:
  - CR016
