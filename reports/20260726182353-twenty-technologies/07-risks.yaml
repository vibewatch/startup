company:
  name: Twenty Technologies
chapter:
  number: 7
  title: Risks
  summary: 'Twenty’s risk profile is dominated by three interacting uncertainties: legal and regulatory scrutiny around offensive cyber AI, concentration inside U.S. national-security buyers, and the operational challenge of deploying complex systems into restricted environments. None of these risks automatically break the company, but each can transmit quickly into revenue, growth, and valuation if controls are weak. The public record supports a serious but still incomplete view: real mitigations exist, yet critical compliance, review, and dependency details remain undisclosed.'
