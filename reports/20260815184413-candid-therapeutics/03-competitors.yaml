- id: section-2
  title: Capability depth and where Candid seems strongest
  body: 'Candid’s clearest strengths are focus, portfolio coherence, and speed. By March 2026 the company was presenting four TCE assets and describing over 10 ongoing autoimmune indications, while also narrowing global Phase 2 focus to myasthenia gravis and rheumatologic ILD. That combination suggests a company willing to run a broad discovery funnel while keeping a sharp near-term registrational wedge. The China execution model is also meaningful: even if it does not create a permanent moat, it appears to have accelerated data generation faster than a typical U.S.-only private biotech could manage. Public evidence is less flattering on other dimensions. Candid has no public commercial infrastructure, no pricing, and no durable market-access proof yet. Roche still holds the biggest scale advantage, and even peers like IGM or Zenas can be more instructive on financing or public-market positioning in specific contexts. So the picture is not that Candid dominates every vector; it leads most
    clearly in concentrated autoimmune TCE identity and recent momentum.'
