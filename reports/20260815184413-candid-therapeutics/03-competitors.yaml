  - TP003
  - TP004
- id: section-4
  title: 'Competitive verdict: timing lead, not unassailable dominance'
  body: 'Public evidence supports a nuanced competitive verdict. Candid looks differentiated enough that UCB chose acquisition over passive observation, which is an important endorsement. The company also appears ahead of many peers in presenting a coherent autoimmune-specific TCE portfolio with early clinical signal and an explicit outpatient thesis. But the same public record does not support unqualified best-in-class language. No head-to-head autoimmune trials exist. Durable commercial advantages remain unproven. Manufacturing scale, payer positioning, and launch execution would still favor much larger incumbents. And adjacent modalities can still capture budget share even if TCEs work. Put differently: Candid’s edge today is best described as a focused, well-funded timing lead in a still-forming category. If randomized data validate that lead, it could harden into a meaningful moat. If not, richer and broader competitors will have multiple ways to catch up or route around the thesis.'
