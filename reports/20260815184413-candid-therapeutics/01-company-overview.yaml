company:
  name: Candid Therapeutics
chapter:
  number: 1
  title: Company Overview
  summary: Candid Therapeutics emerged in September 2024 as a San Diego-based clinical-stage biotech focused on autoimmune T-cell engagers, assembling two oncology-derived bispecific assets through the acquisition of Vignette Bio and TRC 2004. Within less than two years it progressed into multiple autoimmune indications, announced a $505.5 million reverse-merger financing with Rallybio, and then agreed to a strategic sale to UCB for up to $2.2 billion, while still leaving important governance, headcount, and standalone financial disclosures private.
sections:
- id: section-1
  title: Identity, formation, and operating model
  body: 'Candid Therapeutics launched on September 9, 2024 as a clinical-stage biotechnology company built specifically around the idea that T-cell engagers can deliver the same deep B-cell and plasma-cell depletion now associated with autoimmune CAR-T, but in an off-the-shelf antibody format that is easier to manufacture, easier to dose, and more practical for outpatient use. Public launch coverage consistently places the company in San Diego and describes the operating model as a three-way combination: a newly formed shell led by RayzeBio founder Ken Song, plus Vignette Bio and TRC 2004, each of which had recently licensed oncology-stage bispecific assets from China for autoimmune repositioning. That formation story matters because it explains why Candid emerged with clinical-stage assets rather than a discovery-only platform. Instead of inventing a new target class from scratch, management selected late-entry assets with prior oncology dose-escalation experience, then redirected them
    toward autoimmune disease where B-cell depletion has shown extraordinary proof-of-concept. The resulting business is not a services company and not a commercialization-stage biotech; it is a capital-intensive, clinically driven drug developer whose value depends on how quickly it can translate immune-reset biology into registrational autoimmune programs.'
