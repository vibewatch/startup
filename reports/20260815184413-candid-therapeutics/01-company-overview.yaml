- id: section-2
  title: Leadership, governance, and founder-market fit
  body: 'Ken Song is the obvious center of gravity in the public record. Sources identify him simultaneously as Chairman, President, and CEO, and frame Candid as the next company he built immediately after selling RayzeBio to Bristol Myers Squibb for $4.1 billion. That recent exit is more than biography: it helps explain why the company could launch with unusually large capital support and later secure a major public-market transaction despite being privately held for less than two years. Song also recruited a management team with unusually direct autoimmune relevance. Timothy Lu came from DICE Therapeutics, where oral IL-17 development provided adjacent scientific and strategic context for autoimmune drug differentiation; Bernie Hyunghe added antibody and biotech development background from Viridian; and Arvind Kush became the financing and investor-relations voice across launch and merger materials. What remains notably thinner is formal governance disclosure. Public sources describe the
    executive bench, but they do not publish a complete private-company board roster, committee structure, succession plan, or headcount by function. That means founder-market fit is strong, yet governance transparency before the proposed public listing remained limited and highly CEO-centric.'
  claimRefs:
  - CO006
