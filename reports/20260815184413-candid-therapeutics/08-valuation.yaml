- id: TV005
  slug: thesis-break-kill-triggers-table
  title: Thesis-Break and Kill Triggers Table
  description: What events should change the recommendation quickly.
  columns:
  - Trigger
  - Threshold
  - Transmission to Thesis
  - Action Implication
  rows:
  - - UCB closing slippage
    - Material delay, renegotiation, or failed close
    - Removes strongest value anchor and strategic validation
    - Downgrade to hold/sell pending new financing logic
  - - Weaker future dataset
    - Data no longer supports superior safety / efficacy narrative
    - Compresses strategic-premium logic and buyer enthusiasm
    - Lower valuation anchor toward pre-takeout levels
  - - Rights-chain issue
    - Adverse license event or dispute
    - Damages moat and acquirer economics
    - Treat as major thesis break
  - - Execution sprawl
    - Unexpected pauses or reprioritizations across lead studies
    - Signals optionality is turning into dilution of focus
    - Reassess operating premium
  notes: Kill triggers are selected for measurability and direct transmission to value, not completeness.
  claimRefs:
