  slug: thesis-anti-thesis-table
  title: Thesis / Anti-Thesis Table
  description: Strongest arguments for and against the investment case.
  columns:
  - Dimension
  - Thesis Argument
  - Anti-Thesis Argument
  - What Would Change the View
  rows:
  - - Strategic value
    - UCB bid confirms scarce, desirable autoimmune TCE assets
    - Strategic buyer may already have paid away most upside
    - Evidence of higher competing bids or broader later-stage success
  - - Clinical promise
    - Early safety and depletion data are differentiated for the class
    - Dataset is still too early and small for full conviction
    - Durable Phase 2 efficacy across multiple diseases
  - - Platform breadth
    - Multiple assets and many indications create optionality
    - Breadth can dilute execution and capital discipline
    - Clear disease-prioritization framework plus milestone delivery
  - - Moat
    - Speed, capital, and safety positioning created advantage
    - In-licensed assets and rising competition can compress moat
    - Public clarity on rights depth and sustained first-mover lead
  notes: This table compares argument quality, not probability, and is meant to clarify the price-sensitive decision boundary.
