- id: TV006
  slug: final-diligence-asks-table
  title: Final Diligence Asks Table
  description: Highest-priority follow-up items before treating the valuation as fully underwritten.
  columns:
  - Topic
  - Missing Evidence
  - Why It Matters
  - Owner / Diligence Path
  rows:
  - - Transaction close status
    - Latest closing checklist and approvals
    - Determines whether UCB anchor is realizable or only theoretical
    - Counsel / company / merger docs
  - - Lead-asset license economics
    - Royalty, milestone, field-of-use, and CoC terms
    - Affects true takeout economics and residual platform value
    - License review
  - - Durability by indication
    - Longer follow-up and remission depth
    - Determines whether early data deserves a premium multiple
    - Clinical data room / investigators
  - - Manufacturing robustness
    - Supplier map, release metrics, and CMC readiness detail
    - Critical for launch or even late-stage scale assumptions
    - Operations diligence
  - - Fallback financing plan
    - How company would react if timing slips
    - Essential for downside case underwriting
    - Finance diligence
  notes: These asks are intended to convert the fair-price conclusion into a higher-confidence underwriting decision.
