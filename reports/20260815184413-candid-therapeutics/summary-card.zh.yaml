  topStrengths:
    - 战略背书异常直接：公司成立不到两年，UCB 就同意以 $2.0B 首付款外加最高 $200M 里程碑款收购 Candid。
    - 领先管线已经覆盖两个临床期自身免疫 T 细胞接合器，早期清除和安全性信号支撑其门诊给药和皮下注射野心。
    - Ken Song、Timothy Lu 与顶级投资人给了公司信誉和资金，使其能快速拼出、资助并推进一个宽平台。
  topRisks:
    - 临床证据仍早、样本也偏小，持久缓解和更广泛疗效还没有被证明。
    - 两个领先资产均来自授权引进，投资人仍暴露在未完全公开的授权链经济条款、控制权变更条款和合同风险之下。
    - 截至本次报告运行日，UCB 交易仍未完成，时间表、审批或重新定价风险仍在。
  unresolvedGaps:
    - 已抓取的公开材料仍未披露详细烧钱速度、成本结构和当前员工数。
    - cizutamig 和 CND261 的完整授权条款、里程碑义务、适用领域边界和控制权变更条款均未公开。
    - 按适应症拆分的持久性、缓解深度和复发数据仍太早，尚不足以完整支撑峰值价值假设。
