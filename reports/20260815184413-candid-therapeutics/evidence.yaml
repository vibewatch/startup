evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: private-board-and-governance-disclosure
    missingEvidence: >-
      Complete board roster, committee structure, observer rights, and succession planning for the private company
      pre-merger.
    whyItMatters: Governance concentration around Ken Song cannot be fully assessed from public materials alone.
    diligencePath: Request the latest board deck, cap table governance side letters, and private board list from management.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: headcount-and-geographic-employee-mix
    missingEvidence: Current total employee count and split across San Diego, China, CMC, clinical, and G&A functions.
    whyItMatters: Operational scale and burn efficiency cannot be measured without staffing detail.
    diligencePath: Request an organization chart and payroll / headcount summary by function and geography.
    relatedQuestionRefs:
      - QO025
  - type: stale
    severity: minor
    topic: ucb-closing-status
    missingEvidence: >-
      Post-announcement confirmation of whether the May 2026 UCB transaction has formally closed or remains pending
      specific approvals.
    whyItMatters: Current ownership path and standalone-public thesis depend on closing status.
    diligencePath: Check UCB investor updates, regulatory approvals, and any later SEC or Belgian filings.
    relatedQuestionRefs:
      - QO024
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table coverage
    missingEvidence: Full roster of board directors and below-C-suite operators.
    whyItMatters: The public record likely understates governance depth and execution redundancy.
    diligencePath: Request private board list and organizational chart.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
