- id: TE002
  slug: workflow-use-case-table
  title: Workflow / Use-Case Table
  description: How Candid's product concept fits the autoimmune care workflow.
  columns:
  - User Job
  - Current Workflow Friction
  - Candid Solution
  - Measurable Benefit Signal
  - Limitation
  rows:
  - - Reset refractory autoantibody disease
    - Escalating biologics or cell therapy with meaningful logistic burden
    - Off-the-shelf T-cell engager depletion of B cells and plasma cells
    - Biopsy and depletion data plus early clinical activity across multiple autoimmune diseases
    - Long-term remission durability remains unknown
  - - Treat myasthenia gravis after prior biologics
    - Repeated symptomatic control and high-cost chronic therapy
    - cizutamig global Phase 2 path in MG
    - Early benefit reported even in refractory patients; outpatient aspiration
    - No pivotal efficacy data yet
  - - Reduce CRS burden versus more aggressive immune-reset approaches
    - Inpatient monitoring or conditioning can constrain access
    - Low-CD3-affinity CND261 and step-up/outpatient-minded safety posture
    - Public claims of <20% mostly low-grade CRS and no ICANS
    - Claims remain company-led and early
  - - Expand immune-reset therapy to additional indications
    - One-disease-at-a-time development is slow
    - Ten indications under evaluation with shared depletion thesis
    - Broader platform optionality if lead safety holds
    - Breadth can also strain capital and execution
  notes: Workflow framing is qualitative and reflects pre-commercial clinical usage rather than approved-label care pathways.
