- id: section-4
  title: Safety, quality controls, and trust posture
  body: 'The most important trust variable is whether the company can deliver cell-therapy-like depletion with a more manageable safety burden. That is why the cizutamig and CND261 safety narratives matter so much. Public materials described mostly grade 1/2 CRS, sub-20% incidence, no ICANS, and no grade 3/4 CRS in the highlighted autoimmune cizutamig cohort, while CND261 was positioned as similarly mild with grade 1 CRS under 20% and no ICANS. Those are still early datasets, but they give a concrete reason for the company''s outpatient claim and distinguish Candid from more logistically burdensome immune-reset approaches. The visible quality-control story is also credible for a pre-commercial biotech: trial registrations, conference abstracts, biomarker and biopsy evidence, completed manufacturing runs, and stated CMC infrastructure. What is missing is equally important. There are no external quality certifications, no commercial pharmacovigilance record, and no public operational metrics
    on release yields, batch-failure rates, or site-support performance. Investors should therefore read the trust posture as promising but incomplete: good enough for a growth-stage clinical thesis, not good enough to assume launch readiness.'
  claimRefs:
  - CE011
  - CE012
  - CE014
  - CE015
  - CE016
  - CE017
  - CE032
  - CE037
  tableRefs:
  - TE004
  figureRefs:
  - FE004
- id: section-5
  title: Differentiation, moat, and the core product risk
  body: 'Candid''s differentiation is compelling but not absolute. On the positive side, the company is early in autoimmune T-cell engagers, has already shown translational and early clinical signals, established subcutaneous formulation work, and attracted a pending UCB takeout that strongly suggests strategic buyers see platform value. The disease strategy also fits a large unmet need: achieving deep depletion in refractory autoimmune disease with an off-the-shelf therapy that may be easier to deploy than CAR-T. Against that, the moat is less discovery-platform purity than execution. The two lead assets were in-licensed, so a meaningful part of the current value stack depends on contract rights, upstream originators, and the company''s ability to run global studies faster and more safely than competitors such as Roche, IGM, Zenas, or Cullinan. That makes Candid a strong product-operations story rather than an unquestioned technical monopoly. If Phase 2 data stays favorable, that may be
    enough. If safety, durability, or licensor dependencies wobble, the moat narrative gets materially thinner.'
  claimRefs:
  - CE023
  - CE024
  - CE025
  - CE026
