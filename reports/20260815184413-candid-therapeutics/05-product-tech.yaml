    - Dual CD19/CD20 design broadens B-cell depletion logic beyond current leads
    - Need target-product profile and preclinical differentiation data
  - - CND460
    - Internal R&D
    - Preclinical
    - Undisclosed target preserves option value and platform breadth
    - Need target disclosure, rationale, and development timing
  - - CMC and global-trial operating layer
    - Clinical operations and manufacturing teams
    - Operational but pre-commercial
    - Completed manufacturing runs, stated CMC readiness, China execution capability
    - Need batch, yield, and supplier dependency disclosures
