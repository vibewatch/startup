- id: TE003
  slug: technology-architecture-table
  title: Technology / Operating Architecture Table
  description: Core components of Candid's autoimmune TCE operating architecture.
  columns:
  - Layer / Component
  - Role
  - Dependency
  - Risk
  rows:
  - - Target-biology layer (BCMA / CD20)
    - Defines which B-cell compartments are depleted
    - Scientific translation of immune-reset thesis
    - Wrong target or insufficient depth could limit efficacy
  - - T-cell engager design
    - Brings effector T cells into proximity with disease-driving cells
    - Molecule engineering and licensor-originated asset design
    - CRS or off-target activity can narrow therapeutic window
  - - Formulation / dosing layer
    - Moves therapy toward outpatient and potentially subcutaneous delivery
    - PK, tolerability, and device / administration design
    - Early convenience claims may not hold at scale
  - - CMC / manufacturing layer
    - Produces reliable clinical drug supply across multiple indications
    - Internal process control plus external manufacturing partners
    - Scale-up failure would delay trials and compress runway
  - - Global clinical-execution layer
    - Enrolls and monitors autoimmune studies across geographies
    - Regulatory approvals, trial sites, China entity, operational staffing
    - Protocol complexity and cross-border execution could slow readouts
  notes: Architecture rows are analyst synthesis from public disclosures and do not imply full manufacturing or protocol transparency.
