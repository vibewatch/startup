    - Rheumatology / neurology investigators and future specialists
    - Phase 1/2 autoimmune; global Phase 2 planned in 2026
    - BCMAxCD3 with evidence of deep B-cell and plasma-cell depletion; outpatient and subcutaneous potential
    - Need durability, larger safety denominator, and indication-by-indication efficacy detail
  - - CND261
    - Autoimmune investigators; future immunology prescribers
    - Phase 1 autoimmune
    - CD20xCD3 with low-CD3-affinity design intended to reduce CRS
    - Need independent dataset size, efficacy breakdown, and comparator positioning
  - - CND319
    - Internal R&D and future investigators
