  - TI002
- id: section-2
  title: Funding history, capitalization, and implied value
  body: 'The public capital story unfolds in three steps. First came the September 2024 launch with over $370 million of support, including roughly $206 million raised directly by Candid and about $165 million inherited through Vignette Bio and TRC 2004. Second came the March 2026 reverse-merger transaction with Rallybio and about $505.5 million of concurrent financing. Those documents disclosed valuable economic details: a legacy Candid value of about $750 million, a post-transaction fully diluted capitalization of roughly $1.303 billion, pro forma cash of about $700 million, and a 96.35%/3.65% ownership split that made clear Rallybio was mainly a listing vehicle. Third came the May 2026 UCB acquisition agreement for $2.0 billion upfront plus up to $200 million in milestones, which effectively superseded the public-listing thesis. Each step increased external validation, but only the March filings provide detailed mechanics on dilution, termination fees, CVRs, and closing conditions.'
