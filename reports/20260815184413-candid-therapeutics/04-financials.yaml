- id: section-3
  title: Runway, capital intensity, and what management said cash would buy
  body: 'Management used the March 2026 transaction to make a simple financial argument: the new cash should fund the company through 2030 and carry multiple programs through Phase 2 and potentially into pivotal development if data cooperate. That is encouraging but not the same as audited certainty. Runway guidance depends on assumptions about burn, pace of enrollment, CMC spend, and how aggressively Candid advances the rest of the portfolio. Public sources also imply substantial capital intensity. The company was already running multiple autoimmune studies, building China operations, performing manufacturing runs, and preparing additional preclinical assets for the clinic. Even without launch spending, that is expensive work. The absence of monthly burn and headcount disclosure means investors cannot independently validate efficiency. The right read is that Candid looked well financed for mid-stage biotech execution, but not self-funding and not immune to the operational realities of running
    several autoimmune programs in parallel.'
  claimRefs:
  - CI012
  - CI013
  - CI020
