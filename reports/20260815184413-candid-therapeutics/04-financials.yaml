company:
  name: Candid Therapeutics
chapter:
  number: 4
  title: Financials
  summary: 'Candid has no product revenue and almost no public operating metrics, so the financial story is primarily a capital story: >$370 million at launch, ~$505.5 million concurrent financing with the Rallybio reverse merger, ~ $700 million of guided pro forma cash, and then a UCB agreement worth up to $2.2 billion. That capital base looked unusually strong for a company of this age, but the public record still lacks burn, headcount, gross-margin, and launch-spend detail, so the financial verdict depends more on asset value and transaction support than on demonstrated operating efficiency.'
sections:
- id: section-1
  title: Pre-revenue model and what the public record actually shows
  body: 'Candid is financially unusual for a private biotech because it has raised or secured far more capital than most companies at its age, yet it remains straightforward on one point: it has no approved products and no disclosed product revenue. That means every discussion of revenue streams, pricing, or unit economics has to start from absence rather than projection. Public sources show no commercial sales, no ARR, no gross margin, and no customer count. They do, however, show the financing arc clearly enough to frame the business model: equity-funded clinical development aimed at reaching large autoimmune indications before either public-market or strategic-exit monetization. In practice, the company’s current “revenue model” is simply capital formation. The right diligence posture is to treat pricing and margin as future-state possibilities rather than current facts, while still recognizing that successful autoimmune biologics can become extremely valuable assets once efficacy, durability,
    and reimbursement are proven.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
