  topStrengths:
    - "Strategic validation is unusually explicit: UCB agreed to acquire Candid for $2.0B upfront plus up to $200M in milestones less than two years after launch."
    - "The lead pipeline already spans two clinical autoimmune T-cell engagers with early depletion and safety signals that support outpatient and subcutaneous ambitions."
    - "Ken Song, Timothy Lu, and a top-tier investor base gave the company the credibility and capital to assemble, fund, and advance a broad platform rapidly."
  topRisks:
    - "Clinical evidence is still early and relatively small, so durable remission and broader efficacy remain unproven."
    - "The two lead assets are in-licensed, leaving investors exposed to license-chain economics, change-of-control terms, and contract risk that are not fully public."
    - "The UCB transaction is still pending as of the run date, so timing, approvals, or repricing risk remains live."
  unresolvedGaps:
