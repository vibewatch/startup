  - - Enrolled refractory autoimmune patients
    - End users today
    - Receive investigational immune-reset therapy
    - Strongest signal that value proposition is not hypothetical
    - No public persistence or longitudinal patient-level outcomes
  - - UCB
    - Strategic buyer / diligence counterparty
    - Acquisition-based validation of downstream product demand
    - Most sophisticated external proof of platform attractiveness
