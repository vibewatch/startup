company:
  name: Candid Therapeutics
chapter:
  number: 6
  title: Customers
  summary: Candid is pre-commercial, so its current “customers” are better understood as clinical investigators, enrolled patients, trial sites, and strategic counterparties rather than paying accounts. Public proof of adoption comes from registered autoimmune trials, treated-patient cohorts for cizutamig and CND261, and the pending UCB acquisition as sophisticated-buyer validation. The chapter verdict is positive for pre-commercial traction but still explicit that there is no recurring revenue, retention data, or commercial deployment proof.
sections:
- id: section-1
  title: Who counts as a customer before product approval
  body: For a company like Candid, customer analysis has to be reframed away from standard enterprise revenue logic. There are no paying hospital contracts, specialty-pharmacy agreements, or reimbursed product claims yet. Instead, the current external user base is made up of three groups. First are clinical investigators and trial sites willing to activate protocols, dose patients, and keep studies running across multiple autoimmune diseases. Second are the actual patients entering those studies, whose enrollment is the strongest proof that the value proposition is not merely theoretical. Third are strategic counterparties—most notably UCB as pending acquirer—whose capital and diligence effectively validate downstream commercial potential. That means Candid's adoption evidence is real, but it is still pre-commercial in nature. The right framing is not “How many customers pay today?” but “How many external specialists, sites, patients, and sophisticated counterparties are willing to engage
    enough to move the platform forward?” On that narrower but appropriate standard, the company shows meaningful early traction.
  claimRefs:
  - CU001
  - CU002
  - CU010
  - CU016
  - CU017
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: section-2
  title: Adoption proof from protocols, cohorts, and disease breadth
  body: 'The cleanest public evidence of market adoption is not a logo wall; it is protocol activity and patients dosed. Candid has multiple active trial registrations, five autoimmune indications already in clinical evaluation by mid-2025, and later ten indications under evaluation according to management. Cizutamig and CND261 each contribute distinct proof: cizutamig had about 40 autoimmune patients within a broader 80-patient dataset discussed at EULAR 2026, while CND261 had treated more than 20 autoimmune patients within total experience above 110 patients. Those are still early numbers, but they show that adoption is not confined to a single disease or one narrow investigator network. The disease mix also matters. Myasthenia gravis, lupus, rheumatoid arthritis, systemic sclerosis, interstitial lung disease, and IgA nephropathy collectively span neurology, rheumatology, pulmonology, and nephrology. That specialty breadth is commercially meaningful because it creates several possible
    beachheads rather than forcing the company to win on one fragile patient segment. The main missing data are named site counts, enrollment velocity, and institution-level outcomes.'
  claimRefs:
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU025
  - CU028
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: section-3
  title: Named customer proof and strategic-buyer validation
  body: 'Candid''s named proof is strongest where actual external commitment is visible. The most concrete current proof comes from dosed autoimmune patient cohorts publicly discussed through conference-linked materials and from ClinicalTrials.gov records showing real regulated study activity. UCB adds a different kind of named validation. It is not a product customer in the usual sense, but as a strategic acquirer it is the most sophisticated external party to diligence the platform, the data package, the operating model, and the future market opportunity. In practical diligence terms, that matters more than a generic partnership press release. The same is true, in a smaller way, for physician and patient communities around MG, lupus, RA, systemic sclerosis, ILD, and IgA nephropathy: disease-group materials help confirm that the selected populations are clinically important and concentrated enough to support specialist adoption if efficacy holds. Still, this is not the same as having durable
    commercial references. Named proof today shows scientific and strategic pull, not recurring purchasing behavior.'
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU031
  - CU032
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: section-4
  title: Retention, concentration, and channel friction
  body: 'Retention and concentration are where the customer story remains weakest. There is no public NRR, GRR, churn, contract length, or customer-satisfaction reporting because no commercial customer base exists. Trial relationships are somewhat sticky once active—protocol training, IRB work, biomarker collection, and enrolled patients create real switching costs—but they are still reversible if safety signals worsen, sponsor priorities change, or financing tightens. Concentration risk is therefore severe. A small set of strategic and investigator relationships carries most of the current adoption burden, and UCB as pending acquirer represents an outsized validation node. Future channel friction is also easy to picture even before launch: specialty-biologic reimbursement, prior authorization, infusion or outpatient logistics, and step-therapy comparisons against entrenched immunology treatments could all slow uptake. In other words, the current adoption signal is strong enough for a pre-commercial
    biotech but too concentrated and too non-recurring to eliminate go-to-market risk.'
  claimRefs:
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU033
  - CU034
  tableRefs:
  - TU004
  - TU005
  figureRefs:
  - FU004
- id: section-5
  title: 'Customer verdict: credible pre-commercial pull, not yet commercial traction'
  body: The right verdict is balanced. Candid has better customer evidence than a platform biotech with only preclinical slideware, because real autoimmune patients have been dosed, multiple studies are registered, a broad disease mix is active, and a large pharmaceutical buyer has elected to acquire the company. Those are meaningful forms of adoption. However, none of them should be mistaken for commercial durability. There are no paying accounts, no disclosed renewal dynamics, no patient-persistence curves, and no payer-contracted evidence. The platform therefore deserves credit for credible pre-commercial pull but not for proven market traction. If Phase 2 data remains favorable and the outpatient narrative holds, adoption could expand quickly through concentrated specialist communities. Until then, investors should read the customer chapter as confirming demand potential rather than proving monetized demand.
  claimRefs:
  - CU014
  - CU015
  - CU024
  - CU026
  - CU027
  - CU029
  - CU030
  - CU035
  - CU036
