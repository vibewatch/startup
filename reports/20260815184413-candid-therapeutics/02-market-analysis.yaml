company:
  name: Candid Therapeutics
chapter:
  number: 2
  title: Market Analysis
  summary: The market Candid is pursuing is best framed as the emerging autoimmune use of B-cell-depleting T-cell engagers rather than the full oncology bispecific market. Third-party 2026 market estimates range widely, but all support rapid category growth; the practical first-wave opportunity is narrower, centered on refractory specialist-managed diseases such as myasthenia gravis and rheumatologic interstitial lung disease, where immune-reset biology could justify premium reimbursement if safety and randomized efficacy hold.
sections:
- id: section-1
  title: Market boundary and current spend that Candid is trying to redirect
  body: 'The market Candid wants to enter is not the entire bispecific-antibody universe and not the full oncology T-cell engager revenue pool. A realistic boundary is narrower: autoimmune and inflammatory diseases where deep B-cell and plasma-cell depletion could outperform standard chronic immunosuppression. That matters because the budget Candid is trying to win sits today inside established immunology categories, not in oncology. Status-quo spending is concentrated in TNF inhibitors, anti-CD20 antibodies, anti-FcRn agents, complement inhibitors, corticosteroids, and other biologics or small molecules that manage disease activity without necessarily resetting the immune system. Public company messaging explicitly frames T-cell engagers as a possible step beyond Humira- and Rituxan-era economics, but the category remains pre-commercial and evidence-sensitive. For diligence purposes, oncology TCE sales, hospital infusion economics from unrelated hematology products, and non-B-cell autoimmune
    spending should be treated as contextual adjacencies rather than directly addressable revenue. The relevant question is whether immune-reset-style B-cell depletion can earn reimbursed specialist adoption in a few severe autoimmune niches first, then expand outward from there.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM001
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: section-2
  title: 'Sizing lenses: broad syndicated estimates versus narrow first-wave opportunity'
  body: 'Third-party market reports support a clear conclusion but not a single precise number: the broader bispecific or T-cell engager therapeutics market is large and growing, yet the range of published estimates is extremely wide because publishers use different category definitions. Some sources show multi-billion-dollar 2026 baselines above $10 billion, while others suggest sub-$2 billion starting points. The discrepancy is too large to ignore, so a disciplined diligence view should preserve multiple lenses rather than hide the variance. For Candid specifically, the first commercial opportunity is far narrower than those top-down figures imply. Public materials repeatedly focus on myasthenia gravis and rheumatologic interstitial lung disease as the first global Phase 2 priorities, with rheumatoid arthritis and lupus remaining important but more crowded longer-run pools. That means the practical SAM/SOM should start with refractory specialist populations where immune-reset biology can
    justify premium biologic reimbursement and where symptom gains are visible enough to change behavior. Bottom-up logic therefore matters more than the headline syndicated TAM.'
  claimRefs:
  - CM005
  - CM006
  - CM007
  - CM008
  - CM009
