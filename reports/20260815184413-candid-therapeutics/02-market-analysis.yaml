- id: section-3
  title: Buyer-user-payer structure and adoption path
  body: 'Unlike capital equipment or software, autoimmune T-cell engagers move through a prescription and reimbursement chain in which the patient is the user, the physician is the prescriber and workflow gatekeeper, and the insurer is the effective budget owner. In the pre-approval phase, however, another stakeholder layer matters: investigators and key opinion leaders. Early adoption begins in academic and specialist centers that are willing to manage cytokine-risk protocols, measure tissue-depletion endpoints, and publish outcomes that reshape treatment expectations. Only after controlled trials, label approvals, and guideline recognition can the market migrate from KOL-driven enthusiasm into mainstream community use. That path also explains why Candid’s China operations and multi-indication studies matter commercially: faster clinical readouts can accelerate which diseases attract regulatory focus, partner attention, and payer modeling. The adoption journey is therefore evidence-led
    and sequential, not viral; physician comfort, guideline inclusion, and insurer willingness to reimburse a premium biologic all matter more than consumer pull.'
  claimRefs:
  - CM017
  - CM018
  - CM019
  - CM020
  - CM027
  - CM030
  - CM027
  tableRefs:
  - TM003
  figureRefs:
  - FM003
  - FM004
- id: section-4
  title: Growth drivers, adoption constraints, and the balanced market view
  body: The bullish case for the autoimmune TCE market is easy to understand. Deep B-cell depletion has generated some of the most exciting autoimmune proof points of the decade, and off-the-shelf T-cell engagers could deliver part of that effect without the cost, manufacturing, and lymphodepletion burden of CAR-T. Strategic interest from Roche, large pharma deal activity, and UCB’s acquisition of Candid all support the idea that this is now a serious therapeutic category. But the adverse evidence is also meaningful. CRS is still the most visible safety worry. Global randomized evidence remains limited. Incumbents own the current reimbursement pathways. And even Roche has already stepped back from at least one lupus TCE effort, showing that enthusiasm can evaporate when portfolio math or technical confidence changes. The correct market conclusion is therefore not that Candid has already captured a giant TAM, but that it participates in a fast-forming, high-variance category whose first meaningful
    commercial beachheads are severe, specialist-managed autoimmune subsegments.
  claimRefs:
