  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: precise-autoimmune-sam
    missingEvidence: Disease-by-disease epidemiology, line-of-therapy eligibility, dosing assumptions, and price assumptions for each target indication.
    whyItMatters: Public market reports are too broad and inconsistent to support investment-grade TAM without bottoms-up modeling.
    diligencePath: Build a physician- and payer-informed model for MG, ILD, RA, lupus, and other target diseases.
    relatedQuestionRefs:
    - QM004
    - QM017
    - QM024
  - type: conflicting-data
    severity: minor
    topic: syndicated-market-report-variance
    missingEvidence: Transparent methodologies behind the syndicated 2026 market estimates.
    whyItMatters: Different category definitions can move the top-down market estimate by multiples.
    diligencePath: Request methodology notes or avoid single-source TAM anchors in valuation.
    relatedQuestionRefs:
    - QM016
  - type: private-evidence-only
    severity: minor
    topic: payer-positioning-evidence
    missingEvidence: Formal payer advisory work, health-economic modeling, and anticipated line-of-therapy strategy.
    whyItMatters: Commercial conversion depends on where payers place a novel immune-reset biologic.
    diligencePath: Request market-access planning and any unpublished payer-research decks.
    relatedQuestionRefs:
