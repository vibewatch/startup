        title: 客户结论：可信的商业化前拉力，尚非商业牵引
        blocks:
          - type: paragraph
            body: >-
              正确结论是平衡的。相比只有临床前幻灯片的平台型生物技术公司，Candid
              的客户证据更好，因为已有真实自身免疫患者给药，多个研究完成登记，广泛疾病组合处于活跃状态，并且一家大型药企买方选择收购公司。这些都是有意义的采用形式。不过，任何一项都不应被误读为商业持久性。公司没有付费账户，没有披露续约动态，没有患者持续用药曲线，也没有支付方合同证据。因此，平台应因可信的商业化前拉力获得认可，但不能被认定已证明市场牵引。如果
              Phase 2 数据继续有利、门诊叙事站得住，采用可能通过集中的专科社区快速扩展。在此之前，投资者应把客户章节理解为确认需求潜力，而不是证明已变现需求。
