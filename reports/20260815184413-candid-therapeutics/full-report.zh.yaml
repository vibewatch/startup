            body: >-
              Candid
              的法律和监管风险更多由合同与交割驱动，而不是诉讼驱动。公司有多个已登记研究，因此方案监督、修订风险和潜在安全性暂停都是持续存在的标准现实。法律侧更重大的问题是依赖授权引进的领先资产。cizutamig 和
              CND261 并非完全诞生在今天的公司边界内；它们的价值取决于权利链、里程碑义务和合同完整性，而公开市场投资者无法完整检查。第二层来自 2026 年交易栈。Rallybio
              反向合并文件明确警示了融资失败、批准、换股比例调整、最低现金条件和终止风险。UCB 交易对 Candid
              在战略上更好，但截至运行日期仍待完成，意味着延迟或交割失败仍是实时风险。本章不是诉讼很多的章节，而是一个“权利和批准很重要”的章节；这些依赖应在承销中获得真实权重。
