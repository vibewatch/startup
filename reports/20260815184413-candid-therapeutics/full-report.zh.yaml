      - number: '6.3'
        title: 具名客户证据与战略买方验证
        blocks:
          - type: paragraph
            body: >-
              Candid 的具名证据在能看到真实外部承诺的地方最强。当前最具体的证据来自通过会议材料公开讨论的自身免疫已给药患者队列，以及 ClinicalTrials.gov 记录显示的真实、受监管研究活动。UCB
              增加了另一种具名验证。它不是通常意义上的产品客户，但作为战略收购方，它是对平台、数据包、运营模式和未来市场机会做尽调的最成熟外部方。放在实际尽调语境里，这比泛泛的合作伙伴新闻稿更重要。围绕
              MG、狼疮、RA、系统性硬化症、ILD 和 IgA
              肾病的医生与患者社区也是如此，只是权重更小：疾病团体材料有助于确认所选人群临床重要、也足够集中；如果疗效成立，它们能支撑专科采用。不过，这仍不等于拥有持久商业参考。今天的具名证据显示科学和战略拉力，而不是重复购买行为。
