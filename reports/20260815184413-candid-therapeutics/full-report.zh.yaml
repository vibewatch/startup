      - number: '5.5'
        title: 差异化、护城河与核心产品风险
        blocks:
          - type: paragraph
            body: >-
              Candid 的差异化有说服力，但并不绝对。积极面是，公司较早进入自身免疫 T 细胞接合器，已经显示转化和早期临床信号，建立了皮下制剂工作，并吸引 UCB
              待完成收购，强烈说明战略买方看到了平台价值。疾病战略也契合一个巨大的未满足需求：用可能比 CAR-T
              更容易部署的即用型疗法，在难治性自身免疫疾病中实现深度清除。反过来，护城河更多来自执行，而不是纯粹的发现平台。两项领先资产是授权引进的，因此当前价值栈中相当一部分取决于合同权利、上游原始方，以及公司能否比
              Roche、IGM、Zenas 或 Cullinan 等竞争者更快、更安全地跑全球研究。这让 Candid 更像一个强产品运营故事，而不是无可质疑的技术垄断。如果 Phase 2
              数据继续有利，这也许已经足够。如果安全性、持久性或授权方依赖出现摇摆，护城河叙事会明显变薄。
