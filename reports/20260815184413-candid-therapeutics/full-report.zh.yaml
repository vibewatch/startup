      - number: '8.4'
        title: 可比参照与市场背景
        blocks:
          - type: paragraph
            body: >-
              可比分析在这里有用，但前提是做得谨慎。最相关的参照不是成熟上市生物医药公司的倍数，而是自身免疫或免疫学战略交易锚、反向并购标记，以及显示 T
              细胞接合器稀缺性正在变得更重要的市场信号。更广泛的市场数据源噪音大、不完美，但方向上有帮助：它们支持一个判断，即投资人和收购方预期自身免疫 TCE 市场在未来十年会显著扩张。来自 Roche、IGM、Zenas
              等公司的竞争压力有两面。它验证品类，也压住上行；一旦多个可信同行出现，稀缺资产溢价会被侵蚀。因此，UCB 交易很可能同时反映战略稀缺性和对 Candid
              本身的信心。纯财务买方很难只凭当前公开证据证明同样价格合理；战略收购方则可以把平台稀缺性、疾病广度和内部管线协同放在一起，给出这个价格。
            claimRefs:
              - CV015
              - CV016
