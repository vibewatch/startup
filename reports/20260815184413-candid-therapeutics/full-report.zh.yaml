  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 谁真正属于竞争集合
        blocks:
          - type: paragraph
            body: >-
              Candid 周围的竞争格局必须拆成三组。第一组是直接自身免疫 T 细胞接合器同业：明确追求同样即用型免疫重置逻辑的公司或项目。公开证据中，Roche、Cullinan 和 IGM
              最接近这一类别，尽管三者在成熟度和战略承诺上差异很大。第二组是 Zenas
              等相邻自身免疫创新者；即使不使用相同模态，它们也争夺同一批投资者注意力和未来治疗预算。第三组才是启动时真正的现状竞争者：已获批生物制剂、抗 FcRn 药物、补体抑制剂、抗 CD20
              抗体，以及在最重症免疫重置讨论中可能出现的 CAR-T。这个框架很重要，因为拿小型私营生物技术同业对比有助于判断科学方向，但真实处方竞争会来自已进入指南、也有支付方先例的根深蒂固疗法。Candid
              的公开身份之所以强，正是因为它是少数公开围绕自身免疫 TCE 领导地位打造品牌的公司之一，而不是把自身免疫当作肿瘤平台的可选延伸。
