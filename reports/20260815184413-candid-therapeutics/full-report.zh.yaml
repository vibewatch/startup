      - number: '2.2'
        title: 规模口径：宽泛第三方估算 vs. 狭窄首波机会
        blocks:
          - type: paragraph
            body: >-
              第三方市场报告支撑一个清晰结论，但不给出单一精确数字：更广义的双特异性或 T 细胞接合器治疗市场很大且在增长，但已发布估算范围极宽，因为不同发布方使用的类别定义不同。有些来源给出的 2026 年多十亿美元基线高于
              $10B，另一些则指向低于 $2B 的起点。差异大到不能忽视，因此严谨的尽调视角应保留多重口径，而不是掩盖波动。具体到
              Candid，首个商业机会远窄于这些自上而下数字所暗示的规模。公开材料反复把重症肌无力和风湿病性间质性肺病列为第一批全球 Phase 2 优先方向，类风湿关节炎和狼疮仍重要，但更像拥挤的长期池。也就是说，实用的
              SAM/SOM 应从难治性专科人群开始：在这些人群里，免疫重置生物学能支撑高价生物制剂报销，症状改善也足够可见，可以改变行为。因此，自下而上逻辑比第三方 TAM 标题更重要。
