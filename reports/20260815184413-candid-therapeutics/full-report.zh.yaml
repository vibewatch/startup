      - number: '2.4'
        title: 增长驱动因素、采用约束与平衡的市场判断
        blocks:
          - type: paragraph
            body: >-
              自身免疫 TCE 市场的乐观逻辑很容易理解。深度 B 细胞清除拿出了本十年最令人兴奋的一批自身免疫概念验证，即用型 T 细胞接合器则可能在不承担 CAR-T
              成本、生产和淋巴清除负担的情况下交付其中一部分效果。Roche 的战略兴趣、大型药企交易活跃，以及 UCB 收购 Candid，都支持这一治疗类别已经变得严肃。但反向证据同样有分量。CRS
              仍是最显眼的安全担忧。全球随机证据仍有限。现有厂商掌握当前报销路径。即便是 Roche，也已经从至少一个狼疮 TCE 项目后退，说明当组合数学或技术信心改变时，热情会迅速消散。因此，正确的市场结论不是
              Candid 已经拿下一个巨大 TAM，而是它参与了一个快速成形、高方差的类别；这个类别第一批真正有意义的商业滩头堡，将是重症、由专科医生管理的自身免疫细分市场。
