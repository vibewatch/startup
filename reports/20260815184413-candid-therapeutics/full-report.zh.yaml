  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 临床与证据风险：有前景，但仍早期
        blocks:
          - type: paragraph
            body: >-
              最大单一风险很直接：Candid 的自身免疫数据集有前景，但仍早，一旦转负会产生过大影响。cizutamig 已经显示出投资者希望看到的深度清除，公开安全性到目前为止也比看空者对 T
              细胞接合器的预期更好。话虽如此，公司仍依赖会议材料和早期临床证据，而不是大型晚期数据集。持久性仍不确定，跨适应症可重复性还未被证明；类别层面的细胞因子释放风险，也不会因为早期队列可管理就消失。危险不在于当前数据弱，而在于投资者可能把生物标志物清除和小队列耐受性过度解读成注册级证据。本章的核心视角正是如此：多数下游风险——资本可得性、伙伴信心、战略价值和护城河强度——仍会通过下一批临床更新的质量传导。
