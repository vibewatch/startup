  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: Candid 试图重定向的市场边界与当前支出
        blocks:
          - type: paragraph
            body: >-
              Candid 想进入的市场不是整个双特异性抗体宇宙，也不是完整的肿瘤 T 细胞接合器收入池。更现实的边界窄得多：那些深度 B 细胞和浆细胞清除可能优于标准慢性免疫抑制的自身免疫和炎症性疾病。这一点很重要，因为
              Candid 试图争夺的预算今天在成熟免疫学类别里，而不是肿瘤学里。现状支出集中在 TNF 抑制剂、抗 CD20 抗体、抗 FcRn
              药物、补体抑制剂、糖皮质激素，以及其他能管理疾病活动、但未必重置免疫系统的生物制剂或小分子。上市公司表述明确把 T 细胞接合器定位为可能超越 Humira 和 Rituxan
              时代经济性的下一步，但这一类别仍处在商业化前阶段，对证据高度敏感。尽调时，肿瘤 TCE 销售、无关血液学产品的医院输注经济性，以及非 B
              细胞自身免疫支出，都应视为背景相邻项，而不是可直接触达收入。真正的问题是，免疫重置式 B 细胞清除能否先在少数重症自身免疫细分领域拿到报销支持的专科医生采用，再从那里向外扩展。
