            body: >-
              以一家如此年轻的公司而言，Candid 的运营野心令人印象深刻，但速度本身也会制造风险。管理层描述了全球试验 CMC
              准备度、多个已完成生产批次、配备人员的中国法律实体，以及十个适应症的评估足迹。这些事实支撑成熟度，但也意味着运营表面很宽：生产一致性、临床供应连续性、跨境治理、方案管理和中心支持必须同时运转。公开来源没有披露完整供应商图谱、批次收率或放行失败率，因此外部观察者无法验证运营栈到底有多稳健。中国足迹也是双刃剑。它可能改善人才、原始方关系和临床执行的可得性，但也加入了地缘政治和治理复杂性；这些因素在尽调或收购审查中可能重要。换句话说，运营风险不是附加在科学故事后的事后想法。它就是科学故事的一部分，因为免疫重置项目只有在生产和多中心执行跟上生物学前景时才会创造价值。
