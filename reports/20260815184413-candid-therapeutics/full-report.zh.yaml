        - 立即下修投资判断
      - - 交易风险
        - UCB 交割状态
        - 明显延迟、重新谈判或交割失败
        - 重新审视估值和后备融资假设
      - - 权利链风险
        - 许可 / 合同披露
        - 任何争议、终止通知或不利修订
        - 解决前按投资逻辑破裂处理
      - - 执行铺摊风险
        - 项目优先级变化
        - 核心研究出现意外暂停或降级
        - 质疑管理层带宽和资本纪律
    notes: 触发项按可衡量性而非完整性选择。
