        title: 开发成熟度、生产准备度与地理运营模式
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Candid 正试图压缩平台启动到全球中期阶段执行之间的常规时间。公司称，到 2025 年中已有五个自身免疫适应症进入临床评估，随后又称有十个适应症处于评估中；对一家 2024
              年末才成立的公司而言，这个范围异常宽。管理层把这种扩张与具体赋能主张配套起来：服务全球研究的 CMC
              基础设施、多个新药产品已完成生产批次，以及设立并配备人员的中国法律实体，用于跨地域执行。这些运营细节很重要，因为自身免疫 T
              细胞接合器不只是发现故事；它们需要可重复生产、批次放行、方案协调、安全监测，并且需要同时支撑多个疾病团队的能力。路线图也仍然具体。cizutamig 被定位为进入重症肌无力和间质性肺病全球 Phase 2
              研究，CND261 和临床前后续项目则避免平台变成一次性二元押注。因此，成熟度是真实的，但仍处在注册前：平台已经脱离概念阶段，却尚未跨入关键性证明或商业准备度阶段。
