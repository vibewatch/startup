  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 产品获批前，谁算客户
        blocks:
          - type: paragraph
            body: >-
              分析 Candid
              这样的公司时，客户问题必须从标准企业收入逻辑中重新框定。公司尚无付费医院合同、专科药房协议或已报销产品申报。当前外部用户群由三类组成。第一类是愿意启动方案、给患者用药，并让多种自身免疫疾病研究持续运转的临床研究者和试验中心。第二类是进入这些研究的真实患者；他们的入组最能证明价值主张不只是理论。第三类是战略交易对手，最突出的是待完成收购方
              UCB；其资本和尽调实际上验证了下游商业潜力。也就是说，Candid
              的采用证据是真实的，但性质仍是商业化前。正确问法不是“今天有多少客户付费？”，而是“有多少外部专科医生、中心、患者和成熟交易对手愿意投入到足以推动平台前进的程度？”
              按这个更窄但更合适的标准，公司显示出有意义的早期牵引力。
