  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值框架与锚点
        blocks:
          - type: paragraph
            body: >-
              不能用标准收入或 EBITDA 倍数给 Candid 定价：它还没有商业收入、没有毛利率基础，也没有已安装客户账本。更合适的框架，是把交易锚点、情景分析和战略可比逻辑放在一起看。两个锚点最关键。其一是 2026
              年 3 月反向并购框架；在更广义的融资后资本化测算之前，该框架对原 Candid 隐含约 $750M 价值。其二是 2026 年 5 月 UCB 交易；该交易给出 $2.0B 首付款、含里程碑最高 $2.2B
              的价值。两个锚点没有消除不确定性，但相比大多数风险投资阶段生物科技公司，已经大幅收窄合理估值区间。换句话说，投资人不是在真空中争论这个平台到底值数亿美元还是个位数十亿美元；市场已经给出一个准市场锚点和一个战略买方锚点。真正的问题，是该给更高那个锚点多少置信度，以及如果交易无法交割会怎样。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV036
      - number: '8.2'
        title: 投资逻辑、反向逻辑，以及为何价格合理但谈不上明显便宜
        blocks:
          - type: paragraph
            body: >-
              投资逻辑很强。Candid 迅速搭出一个先进程度靠前的自身免疫 T
              细胞接合器管线，且仍处于早期临床阶段就拿到已签署的数十亿美元战略交易。这说明这些资产不只是有意思的科研项目，而是大型药企想要控制的市场中稀缺的战略选项。反向逻辑同样重要。当前价格信号依赖早期证据、外部授权资产和交易交割。UCB
              已经激进出价，因此靠「发现」公司质量获得的显性上行，可能已经大多被吃掉。这就是为什么正确立场是价格合理，而不是便宜。公司看起来很强；价格已经反映这份强度。投资人应把两个常被混在一起的问题拆开：「这是一个高质量生物科技平台吗？」以及「按当前隐含价格，还有足够吸引人的上行吗？」第一个问题更接近是。第二个问题高度取决于进入价格和交易确定性。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV025
