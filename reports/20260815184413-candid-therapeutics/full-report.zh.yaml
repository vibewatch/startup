      - number: '1.2'
        title: 领导层、治理与创始人市场契合度
        blocks:
          - type: paragraph
            body: >-
              Ken Song 是公开记录里最明显的重心。资料同时称他为董事长、总裁和 CEO，并把 Candid 描述成他以 $4.1B 把 RayzeBio 卖给 Bristol Myers Squibb
              后马上打造的下一家公司。这次近期退出不只是履历：它有助于解释为什么公司能在创立时获得异常大额资本支持，并在私有不到两年后拿下一笔重要公开市场交易。Song 还招募了一支与自身免疫高度贴合的管理团队。Timothy
              Lu 来自 DICE Therapeutics，口服 IL-17 开发为自身免疫药物差异化提供了相邻的科学和战略语境；Bernie Hyunghe 带来了 Viridian 的抗体和生物技术开发背景；Arvind
              Kush
              则在启动和合并材料中承担融资与投资者关系发声。明显更薄弱的是正式治理披露。公开来源描述了高管班底，但没有发布完整的私营公司董事会名单、委员会结构、继任计划或按职能拆分的员工数。也就是说，创始人市场契合度很强，但拟议上市前的治理透明度有限，且高度围绕
              CEO。
