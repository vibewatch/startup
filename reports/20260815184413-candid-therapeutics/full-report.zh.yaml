      - number: '5.2'
        title: 自身免疫 T 细胞接合器栈的机制与架构
        blocks:
          - type: paragraph
            body: >-
              技术架构最好理解为五层栈。生物学层聚焦自身反应性 B 细胞和产生抗体的浆细胞；这些细胞支撑重症肌无力、狼疮、类风湿关节炎、系统性硬化症和 IgA 肾病等疾病。接合器设计层随后通过 BCMAxCD3 或
              CD20xCD3 结合，把这些致病细胞连接到 T 细胞；cizutamig 更深地推进浆细胞清除，CND261 则强调较低 CD3
              亲和力，以缓和细胞因子释放风险。制剂与给药层加入皮下选项和门诊野心，这很关键：如果这些疗法需要复杂住院监测，商业承诺就会消失。转化读出层建立在生物标志物和活检证据之上，尤其强调深度 B
              细胞和浆细胞清除，而不只是血清标志物移动。最后，临床运营层把机制转化为横跨多个适应症的正式全球试验。这套架构比泛泛的免疫学品牌更具体：每一层都在把免疫重置变成可执行药物开发战略中承担明确角色。
