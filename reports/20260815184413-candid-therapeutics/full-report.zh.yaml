              推进其余组合的激进程度。公开来源也暗示资本强度很高。公司已经在跑多个自身免疫研究、搭建中国运营、执行生产批次，并准备让更多临床前资产进入临床。即便没有上市支出，这也是昂贵工作。月度烧钱和员工数没有披露，投资者无法独立验证效率。正确解读是，Candid
