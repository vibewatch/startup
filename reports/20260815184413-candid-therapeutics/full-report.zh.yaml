      - number: '8.5'
        title: 建议、尽调事项与退出逻辑
        blocks:
          - type: paragraph
            body: >-
              最终建议有条件，但仍偏正面。若投资人能低于 UCB 隐含交割价值买入，风险调整后的判断仍有吸引力，因为战略验证异常明确。若投资人相当于按完整收购对价买入，更好的姿态是持有 /
              观察，因为最大的近期上行可能已经被消化。置信度应是中高，而非绝对；交易尚待交割，关键授权经济条款仍未公开，更大规模受控疗效数据也还在后面。因此，最高优先级的尽调问题都很务实：交割状态、围绕主要资产的准确合同权利、各适应症的持久性和缓解深度、生产稳健性，以及交易延迟时的备用融资逻辑。退出逻辑同样清楚。交易交割，价值通过战略路径兑现。交易失败，公司立即回到风险投资式承销问题，早期临床证据、现金需求和同类竞争风险会重要得多。
