companyProfile:
  summary: >-
    Candid Therapeutics 是一家位于 San Diego 的临床阶段生物技术公司，于 2024 年 9 月 9 日成立，目标是围绕即用型双特异性 T 细胞接合器搭建自身免疫疾病平台。公司没有从发现阶段起步，而是把
    Candid、Vignette Bio 和 TRC 2004 合并到一起，引入两项临床阶段领先资产——cizutamig（BCMAxCD3）和
    CND261（CD20xCD3）——以及后续临床前项目。不到两年内，公司推进到多个自身免疫适应症，宣布一笔 $505.5M 的 Rallybio 反向合并融资，随后同意以 $2.0B 首付款加最高 $200M
    里程碑付款的价格战略出售给 UCB。
  foundedDate: '2024-09-09'
  founders:
    - name: Ken Song
      role: 董事长、总裁兼 CEO
      background: 曾任 RayzeBio 总裁兼 CEO；Bristol Myers Squibb 于 2024 年以 $4.1B 收购 RayzeBio。
      claimRefs:
        - CO006
        - CO007
  foundingLocation: San Diego, CA
  headquarters: San Diego, CA
  productSummary: >-
    Candid 的平台围绕两款临床阶段自身免疫 T 细胞接合器抗体展开：cizutamig 是一款 BCMAxCD3 双特异性抗体，计划在重症肌无力和间质性肺病开展 Phase 2 研究；CND261 是一款低 CD3 亲和力
    CD20xCD3 双特异性抗体，正处于 Phase 1 自身免疫开发阶段。公司还披露了临床前项目 CND319 和 CND460、两项领先资产的皮下制剂，以及服务全球试验的 CMC 基础设施。
  customerFocus: 这是一家尚未产生收入的生物技术公司，目前通过研究者和试验中心服务自身免疫疾病患者；未来价值面向风湿病学、神经病学、肾脏病学和免疫学治疗路径，也面向战略药企收购方或合作伙伴。
  businessModel: 药物开发模式建立在授权引进或收购的自身免疫 T 细胞接合器资产之上，目前靠风险投资和 crossover 资本供血；若获批，预期通过授权、收购或最终产品销售变现。
