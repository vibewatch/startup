              即使一款自身免疫 TCE
              很有说服力，也会进入一个现有玩家拥有结构性优势的市场，单靠科学无法抹平。已获批生物制剂已经嵌入治疗算法、处方集和医生习惯。品牌发挥作用前，切换成本就已经存在。支付方可以强制治疗排序；专科医生可以保持保守；安全管理物流也可能把新药限制在更窄人群里。因此，公开竞争者转向非常重要。Roche
              撤出狼疮 TCE 并不是对整个模态的判决，但它清楚提醒人们：当风险收益变化时，严肃公司仍会放弃项目。IGM 转向自身免疫给出另一种警示：组合聚焦或许提高战略清晰度，同时也会暴露资本压力。这些同业信号并不否定
              Candid 的潜力，却正是避免夸大护城河持久性所需的证据。本章的平衡结论是，Candid 也许有领先，但赛道尚未稳定到可以把这种领先称为永久。
