            body: >-
              公开资本故事分三步展开。第一步是 2024 年 9 月启动时获得超过 $370M 支持，其中约 $206M 由 Candid 直接募集，约 $165M 通过 Vignette Bio 和 TRC 2004
              承接。第二步是 2026 年 3 月与 Rallybio 的反向合并交易，以及约 $505.5M 同步融资。这些文件披露了有价值的经济细节：原 Candid 价值约 $750M，交易后完全摊薄资本规模约
              $1.303B，备考现金约 $700M，以及 96.35%/3.65% 的所有权分拆，清楚表明 Rallybio 主要是上市载体。第三步是 2026 年 5 月 UCB 收购协议，价格为 $2.0B 首付款加最高
              $200M 里程碑付款，实际上取代了公开上市逻辑。每一步都提高了外部验证度，但只有 2026 年 3 月文件给出了稀释、终止费、CVR 和交割条件的详细机制。
