      - number: '7.4'
        title: 竞争、护城河与执行风险
        blocks:
          - type: paragraph
            body: >-
              即便当前数据继续好看，Candid 仍面临护城河压缩风险。自身免疫 T 细胞接合器机会正在吸引 Roche 这样的大型、资本雄厚公司，也吸引 IGM 和 Zenas
              等规模较小但聚焦的同业。这意味着战略扩散是真实威胁：如果这一机制类别继续得到验证，资金更充足的竞争者可以跑得更快，在试验上砸更多钱，或收购相邻资产。因此，Candid
              的护城河不是有保证的专利堡垒。它更像时间、资本、安全性定位和执行质量的组合。尤其如果 UCB
              完成交割并积极支持这些资产，这个组合可能足够；但它比建立在完全自研发现基础设施上的逻辑更脆弱。还有聚焦风险。十个适应症处于评估中听起来强大，但如果公司试图同时满足每一个自身免疫机会，也可能造成组合蔓延。这是经典生物技术执行问题：广度是在放大可选性，还是在稀释严谨性？公开证据目前还不能完全回答。
