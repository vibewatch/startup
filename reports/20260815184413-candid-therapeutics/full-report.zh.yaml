              Candid 仍明显依赖领导层质量和战略交易对手。Ken Song 和 Timothy Lu 在当前故事中不是可替换经理人；他们是投资者和收购方相信公司能在自身免疫 T
              细胞接合器上异常快速推进的原因之一。财务侧风险不在于已融资金额这个标题数字，而在于仍未知的内容。公司没有公开细颗粒度烧钱桥，没有详细成本结构，也看不到交易时点变化后会怎样。因为公司没有商业收入，任何重大失望都会快速传导到估值——没有已安装收入基础可吸收冲击。因此，最清晰的逻辑破裂触发点很容易列出：未来临床数据明显转弱、UCB
