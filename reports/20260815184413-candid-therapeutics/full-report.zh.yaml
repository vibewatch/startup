              因此，财务结论是喜忧参半但偏正面。积极面是，Candid
              解决了通常会杀死商业化前生物技术公司的最大问题：它拼出了足够资本，可以运行一个宽临床项目，同时还以数十亿美元价格吸引战略收购方。消极面是，公开记录仍留下重大阻碍未解。投资者没有审计后的独立财务报表、烧钱速度、利润率、详细组织规模或商业化支出计划。合并文件也充满交易风险，包括交割条件、终止权、换股比例敏感性，以及公开市场计划可能失败。简言之，对这个年龄的公司而言，资本充足度看起来异常强，但底层运营经济性大多仍不透明。只有当估值逻辑锚定资产价值和战略可选性、而不是近期财务效率时，这对私营生物技术尽调文件才算可以接受。实践中，交易对手和临床里程碑今天仍比报告出来的运营效率更有分量。
