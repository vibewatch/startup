      - number: '1.5'
        title: 临床里程碑、当前状态与证据平衡
        blocks:
          - type: paragraph
            body: >-
              到 2026 年 3 月合并材料发布时，最重要的近期里程碑是公司决定优先推进 cizutamig 在重症肌无力和间质性肺病中的全球 Phase 2
              研究。这个选择建立在正在出现的自身免疫数据之上：组织清除很深、疾病活动评分改善，安全性也可管理。后续 EULAR 2026
              报道进一步强化了耐受性论点：在已分析的自身免疫队列中，细胞因子释放综合征少见且轻微，未报告 ICANS，也没有死亡。与此同时，本章不应夸大成熟度。Candid
              仍没有获批产品，没有披露收入，没有公开员工数披露，治理透明度也不完整。它的临床叙事强到足以吸引反向合并，随后又拿到一项重大收购协议，但公司仍处在投资者信心依赖管理层执行、以及把有启发性的早期自身免疫信号转化为受控全球研究的阶段。因此，拟议
              UCB 收购既是一次验证事件，也提醒人们：在晚期试验数据和监管批准到来前，Candid 的大部分价值仍是前瞻性的。
