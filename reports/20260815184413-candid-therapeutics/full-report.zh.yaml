  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 资产图谱与公司实际交付物
        blocks:
          - type: paragraph
            body: >-
              Candid 当前的产品不是已上市药物，而是一个临床推进中的自身免疫治疗平台，围绕即用型双特异性 T 细胞接合器搭建。放到实际工作流里，公司想给风湿科医生、神经科医生和专科研究者一种可重复的方法，在没有
              CAR-T 治疗伴随的生产摩擦、化疗预处理负担和个体化物流的情况下，实现深度 B 细胞和浆细胞清除。平台目前由两项临床资产支撑：cizutamig 是 BCMAxCD3 双特异性抗体，CND261 是
              CD20xCD3 双特异性抗体，并刻意削弱 CD3 臂。两者之后还有已披露的两个临床前项目 CND319 和 CND460。因此，Candid
              更像是一个围绕共同运营逻辑集中的产品家族，而不是单资产生物技术公司；共同逻辑就是通过 T
              细胞接合清除来重置免疫。今天已经可见的实体，是临床方案活动、会议披露的转化数据、试验登记和生产准备度，而不是商业产品收入或获批标签基础设施。
