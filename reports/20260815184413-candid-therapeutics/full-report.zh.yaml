      - number: '6.2'
        title: 来自方案、队列和疾病广度的采用证据
        blocks:
          - type: paragraph
            body: >-
              最干净的公开市场采用证据不是 logo 墙，而是方案活动和已给药患者。Candid 拥有多个活跃试验登记，到 2025
              年中已有五个自身免疫适应症进入临床评估，随后管理层又称有十个适应症处于评估中。cizutamig 和 CND261 各自提供不同证据：EULAR 2026 讨论的更广泛 80 名患者数据集中，cizutamig
              约有 40 名自身免疫患者；CND261 则在总经验超过 110 名患者的基础上，治疗了 20
              多名自身免疫患者。这些数字仍早，但说明采用并不局限于单一疾病或一个狭窄研究者网络。疾病组合也很重要。重症肌无力、狼疮、类风湿关节炎、系统性硬化症、间质性肺病和 IgA
              肾病，合计覆盖神经病学、风湿病学、呼吸病学和肾脏病学。这样的专科广度具有商业意义，因为它创造了多个可能滩头堡，而不是迫使公司押注一个脆弱患者细分。主要缺失数据是具名中心数量、入组速度和机构层面结果。
