      - number: '2.3'
        title: 买方、使用者、支付方结构与采用路径
        blocks:
          - type: paragraph
            body: >-
              自身免疫 T
              细胞接合器不像资本设备或软件，它要穿过处方和报销链条：患者是使用者，医生是处方者和工作流守门人，保险方才是实际预算所有者。但在获批前阶段，另一层利益相关方同样关键：研究者和关键意见领袖。早期采用始于愿意管理细胞因子风险流程、测量组织清除终点、并发表能够重塑治疗预期结果的学术与专科中心。只有在受控试验、标签批准和指南认可之后，市场才可能从
              KOL 驱动的热情迁移到主流社区使用。这条路径也解释了为什么 Candid
              的中国运营和多适应症研究具有商业意义：更快的临床读出可以加速判断哪些疾病会吸引监管重点、伙伴关注和支付方建模。因此，采用路径由证据牵引，且按顺序推进，不会病毒式扩散；医生舒适度、进入指南以及保险方愿意为高价生物制剂报销，都比消费者拉动更重要。
