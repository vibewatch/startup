  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 尚未产生收入的模式，以及公开记录真正显示的内容
        blocks:
          - type: paragraph
            body: >-
              对一家私营生物技术公司而言，Candid
              在财务上很不寻常：它募集或锁定的资本远高于大多数同龄公司，但有一点很简单——它没有获批产品，也没有披露产品收入。因此，任何关于收入流、定价或单位经济的讨论，都必须从“缺失”而不是预测开始。公开来源没有显示商业销售、ARR、毛利率或客户数。不过，它们足以清晰勾勒融资弧线：公司靠股权资助临床开发，目标是在进入大型自身免疫适应症后，通过公开市场或战略退出变现。实际看，公司当前的“收入模式”就是资本形成。正确的尽调姿态是把定价和利润率视为未来状态的可能性，而不是当前事实；同时也要承认，一旦疗效、持久性和报销得到证明，成功的自身免疫生物制剂可以变成极有价值的资产。
