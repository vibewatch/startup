chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、成立路径与运营模式
        blocks:
          - type: paragraph
            body: >-
              Candid Therapeutics 于 2024 年 9 月 9 日成立，是一家临床阶段生物技术公司，核心假设很明确：T 细胞接合器可以像自身免疫 CAR-T 一样实现深度 B
              细胞和浆细胞清除，但用即用型抗体形式交付，生产更容易、给药更简单，也更适合门诊使用。公开发布报道一致把公司放在 San Diego，并把其运营模式描述为三方合并：由 RayzeBio 创始人 Ken Song
              领导的新设壳公司，加上 Vignette Bio 和 TRC 2004；后两者都刚从中国授权引进肿瘤阶段双特异性资产，用于自身免疫再定位。这段成立故事很关键，因为它解释了为什么 Candid
              一出场就拥有临床阶段资产，而不是只有发现平台。管理层没有从零发明新靶点类别，而是选择已有肿瘤剂量递增经验的后进入资产，再把它们转向自身免疫疾病；在这些疾病中，B
              细胞清除已经拿出异常强的概念验证。因此，这家公司不是服务公司，也不是商业化阶段生物技术公司；它是一家资本密集、由临床推进驱动的药物开发商，价值取决于它能多快把免疫重置生物学转化为可注册的自身免疫项目。
