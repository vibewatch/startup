            body: >-
              留存和集中度是客户故事最弱的部分。公司没有公开 NRR、GRR、流失率、合同期限或客户满意度报告，因为商业客户基础尚不存在。试验关系一旦启动会有一定粘性——方案培训、IRB
              工作、生物标志物采集和已入组患者都会产生真实切换成本——但如果安全信号恶化、申办方优先级变化或融资收紧，这些关系仍可逆转。因此，集中风险很高。少数战略和研究者关系承担了当前大部分采用负担，待完成收购方 UCB
              也是一个权重过大的验证节点。即便在上市前，未来渠道摩擦也很容易想象：专科生物制剂报销、事先授权、输注或门诊物流，以及与根深蒂固免疫学疗法的阶梯治疗比较，都可能拖慢采用。换句话说，当前采用信号对一家商业化前生物技术公司足够强，但过于集中、且过于非经常性，无法消除上市路径风险。
