      - number: '1.4'
        title: 管线快照、运营足迹与执行准备度
        blocks:
          - type: paragraph
            body: >-
              到 2025 年 6 月，Candid 已把两项领先资产推进到五种自身免疫疾病；到 2026 年 3 月，公司描述的组合进一步扩展到 10
              多个适应症，并加入两个较新的临床前或临床前到临床三特异性项目。BCMAxCD3 领先项目 cizutamig 成为公司旗舰，因为管理层认为，要实现最深的浆细胞清除、也就是最清晰的免疫重置生物学，必须瞄准
              BCMA。CD20xCD3 项目 CND261 提供互补的 B 细胞清除轮廓，也给公司第二条临床读出路径。到 2026 年 3 月，公司还强调 CND319 和 CND460 是下一代三特异性资产，说明
              Candid
              试图搭建组合，而不是做单资产生物技术公司。执行准备度还体现在三处。第一，管理层称已设立中国实体，以加速高成本效率的自身免疫数据生成。第二，公司报告已完成生产批次，并开发出皮下制剂，这两点对门诊定位都很重要。第三，交易材料提到
              10 多个适应症的在研临床工作，显示公司愿意在收窄到关键性研究前使用多条概念验证路径。如此年轻的公司拥有这样广的运营足迹并不常见，因此资本可得性和项目优先级纪律成为尽调案例的核心。
