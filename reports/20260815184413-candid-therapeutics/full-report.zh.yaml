            body: >-
              Candid 最清晰的优势是聚焦、组合一致性和速度。到 2026 年 3 月，公司展示了四项 TCE 资产，并描述 10 多个在研自身免疫适应症，同时又把全球 Phase 2 重点收窄到重症肌无力和风湿病性
              ILD。这个组合说明，公司愿意跑宽发现漏斗，同时保留锋利的近期注册切入口。中国执行模式也有意义：即便不能形成永久护城河，它看起来也让数据生成比典型只在美国运营的私营生物技术公司更快。公开证据在其他维度并不那么好看。Candid
              没有公开商业化基础设施，没有定价，也没有持久市场准入证据。Roche 仍拥有最大规模优势，即便 IGM 或 Zenas 这样的同业，在特定语境下也可能更能说明融资或公开市场定位。因此，图景不是 Candid
              在所有维度都占优；它最明确领先的是集中自身免疫 TCE 身份和近期动能。
