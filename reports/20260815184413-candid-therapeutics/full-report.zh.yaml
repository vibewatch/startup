      - number: '1.3'
        title: 资本形成与战略交易
        blocks:
          - type: paragraph
            body: >-
              Candid 的资本故事压缩得不同寻常。启动时，公司称可动用资金超过 $370M，其中约 $206M 由 Candid 直接募集，另有约 $165M 来自 Vignette Bio 和 TRC
              2004。这笔资金足够公司运营数年，更重要的是，让公司能够机会主义地选择公开市场窗口，而不是仓促 IPO。六个月后，公司完全绕过传统 IPO，同意并入 Nasdaq 上市公司 Rallybio，同时从一个大型
              crossover 和医疗投资者财团募集约 $505.5M。2026 年 3 月材料进一步披露了资本结构数学：交易前 Rallybio 持有人预计仅持有合并后公司 3.65%，Candid
              持有人和新融资投资者合计持有 96.35%，说明 Rallybio 主要充当上市载体。同一份文件把原 Candid 的隐含估值定在约 $750M，合并后完全摊薄资本规模约 $1.303B。2026 年 5
              月，在公开上市逻辑尚未跑通前，UCB 签署最终协议，以 $2.0B 首付款加最高 $200M 里程碑付款收购 Candid，将估值逻辑从公开市场价格发现改写为战略并购。
