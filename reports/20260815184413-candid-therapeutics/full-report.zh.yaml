            figureRef: FV001
            claimRefs:
              - CV008
              - CV011
              - CV013
              - CV020
              - CV025
      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              基准情景最简单：UCB 大体按已宣布条款交割，强价值被兑现，但开放式上行被封顶。因此基准情景不错，却不爆发。乐观情景不只是交割。它假设战略溢价最终低估了自身免疫 TCE 平台的价值——等更广泛 Phase 2
              数据和更多项目成熟后，平台会显得更值钱；或者二级交易投资人能以低于隐含交割价值的折扣进入。在这个版本里，UCB 价格是底，不是顶。悲观情景也好理解。如果 UCB
              路径失败或被大幅重定价，公司会失去最强验证锚，估值可能回到 2026 年 3 月反向并购基准，甚至更低；尤其是公开证据仍早，也没有商业收入来托住下行。因此，情景表的形态更像一桩由 M&A
              背书的生物科技交易，而不是普通的风险轮估值上调。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV028
              - CV035
