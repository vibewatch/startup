      - number: '5.4'
        title: 安全性、质量控制与信任姿态
        blocks:
          - type: paragraph
            body: >-
              最重要的信任变量，是公司能否在安全负担更可管理的情况下交付类似细胞疗法的清除效果。这就是 cizutamig 和 CND261 安全叙事如此重要的原因。公开材料描述了以 1/2 级 CRS 为主、发生率低于
              20%、无 ICANS、且在突出展示的自身免疫 cizutamig 队列中无 3/4 级 CRS；CND261 也被定位为同样温和，1 级 CRS 低于 20%，且无
              ICANS。这些仍是早期数据集，但它们为公司的门诊主张提供了具体理由，也把 Candid
              同物流负担更重的免疫重置路径区分开来。对一家商业化前生物技术公司而言，可见的质量控制故事也可信：试验登记、会议摘要、生物标志物和活检证据、已完成生产批次，以及公司称已具备 CMC
              基础设施。缺失项同样重要。公司没有外部质量认证，没有商业药物警戒记录，也没有关于放行收率、批次失败率或中心支持表现的公开运营指标。因此，投资者应把信任姿态读成有前景但不完整：足以支撑成长期临床逻辑，不足以假设上市准备就绪。
