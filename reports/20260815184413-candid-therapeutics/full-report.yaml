      - number: '2.4'
        title: Growth drivers, adoption constraints, and the balanced market view
        blocks:
          - type: paragraph
            body: >-
              The bullish case for the autoimmune TCE market is easy to understand. Deep B-cell depletion has generated
              some of the most exciting autoimmune proof points of the decade, and off-the-shelf T-cell engagers could
              deliver part of that effect without the cost, manufacturing, and lymphodepletion burden of CAR-T.
              Strategic interest from Roche, large pharma deal activity, and UCB’s acquisition of Candid all support the
              idea that this is now a serious therapeutic category. But the adverse evidence is also meaningful. CRS is
              still the most visible safety worry. Global randomized evidence remains limited. Incumbents own the
              current reimbursement pathways. And even Roche has already stepped back from at least one lupus TCE
              effort, showing that enthusiasm can evaporate when portfolio math or technical confidence changes. The
              correct market conclusion is therefore not that Candid has already captured a giant TAM, but that it
              participates in a fast-forming, high-variance category whose first meaningful commercial beachheads are
              severe, specialist-managed autoimmune subsegments.
