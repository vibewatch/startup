      - number: '3.3'
        title: Distribution power, switching friction, and adverse peer evidence
        blocks:
          - type: paragraph
            body: >-
              Even a compelling autoimmune TCE will enter a market where incumbents have structural advantages that
              science alone does not erase. Approved biologics already sit in treatment algorithms, formularies, and
              physician habit. That creates switching costs long before brand matters. Payers can force sequencing;
              specialists can stay conservative; and safety-management logistics can keep novel agents confined to
              narrower segments. This is why public competitor pivots matter so much. Roche’s lupus TCE retreat is not a
              verdict against the whole modality, but it is a clear reminder that serious companies still abandon
              programs when risk-reward changes. IGM’s autoimmunity pivot provides a different warning: portfolio focus
              may improve strategic clarity while simultaneously revealing capital strain. These peer signals do not
              negate Candid’s promise, yet they are precisely the evidence needed to avoid overstating moat durability.
              The chapter’s balanced conclusion is that Candid may have a lead, but the field has not yet stabilized
              enough to call that lead permanent.
            claimRefs:
              - CP022
              - CP023
              - CP024
              - CP025
              - CP026
              - CP033
