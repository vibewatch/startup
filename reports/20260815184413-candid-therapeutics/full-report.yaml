chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, formation, and operating model
        blocks:
          - type: paragraph
            body: >-
              Candid Therapeutics launched on September 9, 2024 as a clinical-stage biotechnology company built
              specifically around the idea that T-cell engagers can deliver the same deep B-cell and plasma-cell
              depletion now associated with autoimmune CAR-T, but in an off-the-shelf antibody format that is easier to
              manufacture, easier to dose, and more practical for outpatient use. Public launch coverage consistently
              places the company in San Diego and describes the operating model as a three-way combination: a newly
              formed shell led by RayzeBio founder Ken Song, plus Vignette Bio and TRC 2004, each of which had recently
              licensed oncology-stage bispecific assets from China for autoimmune repositioning. That formation story
              matters because it explains why Candid emerged with clinical-stage assets rather than a discovery-only
              platform. Instead of inventing a new target class from scratch, management selected late-entry assets with
              prior oncology dose-escalation experience, then redirected them toward autoimmune disease where B-cell
              depletion has shown extraordinary proof-of-concept. The resulting business is not a services company and
              not a commercialization-stage biotech; it is a capital-intensive, clinically driven drug developer whose
              value depends on how quickly it can translate immune-reset biology into registrational autoimmune
              programs.
