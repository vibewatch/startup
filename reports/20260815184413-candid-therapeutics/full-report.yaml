      - number: '5.5'
        title: Differentiation, moat, and the core product risk
        blocks:
          - type: paragraph
            body: >-
              Candid's differentiation is compelling but not absolute. On the positive side, the company is early in
              autoimmune T-cell engagers, has already shown translational and early clinical signals, established
              subcutaneous formulation work, and attracted a pending UCB takeout that strongly suggests strategic buyers
              see platform value. The disease strategy also fits a large unmet need: achieving deep depletion in
              refractory autoimmune disease with an off-the-shelf therapy that may be easier to deploy than CAR-T.
              Against that, the moat is less discovery-platform purity than execution. The two lead assets were
              in-licensed, so a meaningful part of the current value stack depends on contract rights, upstream
              originators, and the company's ability to run global studies faster and more safely than competitors such
              as Roche, IGM, Zenas, or Cullinan. That makes Candid a strong product-operations story rather than an
              unquestioned technical monopoly. If Phase 2 data stays favorable, that may be enough. If safety,
              durability, or licensor dependencies wobble, the moat narrative gets materially thinner.
