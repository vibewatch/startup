  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Clinical and evidence risk: promising but still early'
        blocks:
          - type: paragraph
            body: >-
              The single biggest risk is straightforward: Candid's autoimmune dataset is promising, but it is still
              early enough that a negative turn would have outsized impact. cizutamig has shown the kind of deep
              depletion investors hoped to see, and the public safety profile so far looks better than a bearish
              observer might have expected for a T-cell engager. That said, the company is still living off
              conference-linked and early clinical evidence rather than large late-stage datasets. Durability remains
              uncertain, cross-indication reproducibility is not yet proven, and class-level cytokine-release risk has
              not vanished simply because early cohorts were manageable. The danger is not that the current data is
              weak; it is that investors may over-read biomarker depletion and small-cohort tolerability as if they were
              registrational-grade proof. In this chapter, that is the central lens: most downstream risks—capital
              access, partner confidence, strategic value, and moat strength—still transmit through the quality of the
              next clinical updates.
