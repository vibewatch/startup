      - number: '8.3'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              The base case is the simplest: UCB closes broadly on announced terms, crystallizing strong value but
              capping open-ended upside. That is why the base case is good but not explosive. The bull case requires
              more than just closing. It assumes that the strategic premium ultimately understates how valuable the
              autoimmune TCE platform will look once broader Phase 2 data and additional programs mature, or that
              secondary investors can access the company at a discount to implied close value. In that version, the UCB
              price is a floor rather than the ceiling. The bear case is also easy to understand. If the UCB path fails
              or is materially repriced, the company loses its strongest validation anchor and valuation could reset
              toward the March 2026 reverse-merger benchmark or worse, especially because public evidence is still early
              and no commercial revenue exists to defend the downside. The shape of the scenario table therefore
              resembles an M&A-underwritten biotech more than a normal venture mark-up exercise.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
