companyProfile:
  summary: >-
    Candid Therapeutics is a San Diego-based clinical-stage biotech launched on September 9, 2024 to build an
    autoimmune-disease platform around off-the-shelf bispecific T-cell engagers. Rather than start from discovery, the
    company combined Candid, Vignette Bio, and TRC 2004 to bring in two clinical-stage lead assets—cizutamig (BCMAxCD3)
    and CND261 (CD20xCD3)—plus preclinical follow-ons. Within less than two years it advanced into multiple autoimmune
    indications, announced a $505.5M Rallybio reverse-merger financing, and then agreed to a strategic sale to UCB for
    $2.0B upfront plus up to $200M in milestones.
  foundedDate: '2024-09-09'
  founders:
    - name: Ken Song
      role: Chairman, President & CEO
      background: Former President and CEO of RayzeBio, which Bristol Myers Squibb acquired for $4.1B in 2024.
      claimRefs:
        - CO006
        - CO007
  foundingLocation: San Diego, CA
  headquarters: San Diego, CA
  productSummary: >-
    Candid's platform centers on two clinical autoimmune T-cell engager antibodies: cizutamig, a BCMAxCD3 bispecific
    with planned Phase 2 studies in myasthenia gravis and interstitial lung disease, and CND261, a low-CD3-affinity
    CD20xCD3 bispecific in Phase 1 autoimmune development. The company also disclosed preclinical programs CND319 and
    CND460, subcutaneous formulations for both lead assets, and CMC infrastructure for global trials.
  customerFocus: >-
    Pre-revenue biotech serving autoimmune-disease patients through investigators and trial sites today, with future
    value aimed at rheumatology, neurology, nephrology, and immunology care pathways as well as strategic pharma
    acquirers or partners.
  businessModel: >-
