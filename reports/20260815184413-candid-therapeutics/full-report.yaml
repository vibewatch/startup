      - number: '5.4'
        title: Safety, quality controls, and trust posture
        blocks:
          - type: paragraph
            body: >-
              The most important trust variable is whether the company can deliver cell-therapy-like depletion with a
              more manageable safety burden. That is why the cizutamig and CND261 safety narratives matter so much.
              Public materials described mostly grade 1/2 CRS, sub-20% incidence, no ICANS, and no grade 3/4 CRS in the
              highlighted autoimmune cizutamig cohort, while CND261 was positioned as similarly mild with grade 1 CRS
              under 20% and no ICANS. Those are still early datasets, but they give a concrete reason for the company's
              outpatient claim and distinguish Candid from more logistically burdensome immune-reset approaches. The
              visible quality-control story is also credible for a pre-commercial biotech: trial registrations,
              conference abstracts, biomarker and biopsy evidence, completed manufacturing runs, and stated CMC
              infrastructure. What is missing is equally important. There are no external quality certifications, no
              commercial pharmacovigilance record, and no public operational metrics on release yields, batch-failure
              rates, or site-support performance. Investors should therefore read the trust posture as promising but
              incomplete: good enough for a growth-stage clinical thesis, not good enough to assume launch readiness.
