            body: >-
              The financial verdict is therefore mixed but favorable. On the positive side, Candid solved the biggest
              problem that usually kills pre-commercial biotechs: it assembled enough capital to run a broad clinical
              program while also attracting a strategic acquirer at a multibillion-dollar price. On the negative side,
              the public record still leaves major blockers unresolved. Investors do not have audited standalone
              financials, burn, margin, detailed organizational scale, or commercial-spend planning. The merger
              documents are also full of transaction risks, including closing conditions, termination rights,
              exchange-ratio sensitivity, and the possibility that public-market plans could fail. In short, capital
              adequacy looked unusually strong for a company of this age, but the underlying operating economics remain
              mostly opaque. That is acceptable for a private biotech diligence file only if the valuation thesis is
              anchored on asset value and strategic optionality rather than near-term financial efficiency. In practice,
