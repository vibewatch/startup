      - number: '2.3'
        title: Buyer-user-payer structure and adoption path
        blocks:
          - type: paragraph
            body: >-
              Unlike capital equipment or software, autoimmune T-cell engagers move through a prescription and
              reimbursement chain in which the patient is the user, the physician is the prescriber and workflow
              gatekeeper, and the insurer is the effective budget owner. In the pre-approval phase, however, another
              stakeholder layer matters: investigators and key opinion leaders. Early adoption begins in academic and
              specialist centers that are willing to manage cytokine-risk protocols, measure tissue-depletion endpoints,
              and publish outcomes that reshape treatment expectations. Only after controlled trials, label approvals,
              and guideline recognition can the market migrate from KOL-driven enthusiasm into mainstream community use.
              That path also explains why Candid’s China operations and multi-indication studies matter commercially:
              faster clinical readouts can accelerate which diseases attract regulatory focus, partner attention, and
              payer modeling. The adoption journey is therefore evidence-led and sequential, not viral; physician
              comfort, guideline inclusion, and insurer willingness to reimburse a premium biologic all matter more than
              consumer pull.
            claimRefs:
