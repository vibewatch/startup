      - number: '1.5'
        title: Clinical milestones, current status, and balance of evidence
        blocks:
          - type: paragraph
            body: >-
              The most important near-term milestone by the time of the March 2026 merger materials was the decision to
              prioritize global Phase 2 cizutamig studies in myasthenia gravis and interstitial lung disease. That
              choice was anchored in emerging autoimmune data showing deep tissue depletion, improving disease-activity
              scores, and a manageable safety profile. Later EULAR 2026 coverage reinforced the tolerability case: in
              the analyzed autoimmune cohort, cytokine release syndrome remained uncommon and mild, no ICANS was
              reported, and no deaths occurred. At the same time, the chapter should not overstate maturity. Candid
              still had no approved products, no disclosed revenue, no public headcount disclosure, and incomplete
              governance transparency. Its clinical narrative was strong enough to attract both a reverse merger and
              then a major acquisition agreement, but the company remained in the phase where investor confidence rested
              on management execution and the conversion of provocative early autoimmune signals into controlled global
              studies. The proposed UCB acquisition is therefore both a validation event and a reminder that most of
              Candid’s value remains prospective until late-stage trial data and regulatory approvals arrive.
