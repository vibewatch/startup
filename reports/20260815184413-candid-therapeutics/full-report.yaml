  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Who counts as a customer before product approval
        blocks:
          - type: paragraph
            body: >-
              For a company like Candid, customer analysis has to be reframed away from standard enterprise revenue
              logic. There are no paying hospital contracts, specialty-pharmacy agreements, or reimbursed product claims
              yet. Instead, the current external user base is made up of three groups. First are clinical investigators
              and trial sites willing to activate protocols, dose patients, and keep studies running across multiple
              autoimmune diseases. Second are the actual patients entering those studies, whose enrollment is the
              strongest proof that the value proposition is not merely theoretical. Third are strategic
              counterparties—most notably UCB as pending acquirer—whose capital and diligence effectively validate
              downstream commercial potential. That means Candid's adoption evidence is real, but it is still
              pre-commercial in nature. The right framing is not “How many customers pay today?” but “How many external
              specialists, sites, patients, and sophisticated counterparties are willing to engage enough to move the
              platform forward?” On that narrower but appropriate standard, the company shows meaningful early traction.
