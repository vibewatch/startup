  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Pre-revenue model and what the public record actually shows
        blocks:
          - type: paragraph
            body: >-
              Candid is financially unusual for a private biotech because it has raised or secured far more capital than
              most companies at its age, yet it remains straightforward on one point: it has no approved products and no
              disclosed product revenue. That means every discussion of revenue streams, pricing, or unit economics has
              to start from absence rather than projection. Public sources show no commercial sales, no ARR, no gross
              margin, and no customer count. They do, however, show the financing arc clearly enough to frame the
              business model: equity-funded clinical development aimed at reaching large autoimmune indications before
              either public-market or strategic-exit monetization. In practice, the company’s current “revenue model” is
              simply capital formation. The right diligence posture is to treat pricing and margin as future-state
              possibilities rather than current facts, while still recognizing that successful autoimmune biologics can
              become extremely valuable assets once efficacy, durability, and reimbursement are proven.
