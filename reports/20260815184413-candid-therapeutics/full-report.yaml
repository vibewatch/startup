  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation framework and anchor points
        blocks:
          - type: paragraph
            body: >-
              Candid should not be valued with standard revenue or EBITDA multiples because it has no commercial
              revenue, no gross-margin base, and no installed customer book. Instead, the relevant framework is a blend
              of transaction anchors, scenario analysis, and strategic comparable logic. Two anchors dominate. The first
              is the March 2026 reverse-merger framework, which implied roughly $750 million of value for legacy Candid
              before the broader post-financing capitalization math. The second is the May 2026 UCB deal, which set
              value at $2.0 billion upfront and up to $2.2 billion with milestones. Those anchors do not eliminate
              uncertainty, but they dramatically narrow the plausible valuation band compared with most venture-stage
              biotechs. In effect, investors are not debating whether the platform is worth hundreds of millions or
              single-digit billions in a vacuum; they already have one quasi-market anchor and one strategic-buyer
              anchor. The real question is how much confidence to place in the higher one and what happens if it fails
              to close.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV036
      - number: '8.2'
        title: Thesis, anti-thesis, and why the price is fair rather than obviously cheap
        blocks:
          - type: paragraph
            body: >-
              The thesis is powerful. Candid built one of the most advanced autoimmune T-cell engager portfolios quickly
              enough to attract a signed multibillion-dollar strategic transaction while still in the early clinical
              phase. That suggests the assets are not merely interesting science projects; they are scarce strategic
              options in a market large pharma wants to own. The anti-thesis is equally important. The current price
              signal depends on early evidence, in-licensed assets, and transaction completion. Because UCB has already
              bid aggressively, much of the obvious upside from “discovering” the company's quality may be gone. That is
              why the right stance is fair, not cheap. The company appears strong; the price already reflects that
              strength. Investors should therefore separate two questions that are often conflated: “Is this a
              high-quality biotech platform?” and “Is there still attractive upside at the current implied price?” The
              answer to the first looks closer to yes than no. The second depends heavily on entry level and deal
              certainty.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV025
