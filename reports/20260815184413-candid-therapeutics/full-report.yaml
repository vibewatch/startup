            body: >-
              Public evidence shows a company trying to compress the usual time between platform launch and global
              mid-stage execution. Candid said five autoimmune indications were already active in clinical evaluation by
              mid-2025 and later described ten indications under evaluation, a scope unusually broad for a company
              launched only in late 2024. Management paired that expansion with specific enabling claims: CMC
              infrastructure for global studies, completed manufacturing runs for multiple new drug products, and an
              established China legal entity staffed for cross-geography execution. Those operating details matter
              because autoimmune T-cell engagers are not just discovery stories; they require repeatable manufacturing,
              lot release, protocol coordination, safety monitoring, and the capacity to support several disease teams
              at once. The roadmap also remains concrete. Cizutamig is positioned to move into global Phase 2 studies in
              myasthenia gravis and interstitial lung disease, while CND261 and preclinical follow-ons keep the platform
              from being a one-shot binary bet. Maturity is therefore real but still pre-registrational: the platform
              has escaped concept stage, yet has not crossed into pivotal-proof or commercial-readiness territory.
