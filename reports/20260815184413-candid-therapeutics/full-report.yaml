      - number: '5.2'
        title: Mechanism and architecture of the autoimmune T-cell engager stack
        blocks:
          - type: paragraph
            body: >-
              The technical architecture is best understood as a five-layer stack. The biology layer focuses on
              autoreactive B cells and antibody-producing plasma cells that sustain diseases such as myasthenia gravis,
              lupus, rheumatoid arthritis, systemic sclerosis, and IgA nephropathy. The engager-design layer then links
              those disease cells to T cells through BCMAxCD3 or CD20xCD3 binding, with cizutamig pushing deeper into
              plasma-cell depletion and CND261 emphasizing lower CD3 affinity to moderate cytokine-release risk. The
              formulation and delivery layer adds subcutaneous options and outpatient ambitions, which matter because
              the commercial promise disappears if these therapies require complex inpatient monitoring. The
              translational-readout layer is built on biomarker and biopsy evidence—especially proof of deep B-cell and
              plasma-cell depletion rather than only serum-marker movement. Finally, the clinical-operations layer
              translates the mechanism into formal global trials across multiple indications. This architecture is more
              specific than generic immunology branding: each layer has a concrete role in turning immune reset into a
              practical drug-development strategy.
