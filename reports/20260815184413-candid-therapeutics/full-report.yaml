      - number: '8.4'
        title: Comparable references and market context
        blocks:
          - type: paragraph
            body: >-
              Comparable analysis is useful here, but only if done carefully. The most relevant references are not
              mature public biopharma multiples; they are strategic autoimmune or immunology transaction anchors, the
              reverse-merger mark, and market signals showing that T-cell engager scarcity is growing in importance. The
              broader market-data sources are noisy and imperfect, yet directionally helpful: they support the idea that
              investors and acquirers expect autoimmune TCE markets to expand meaningfully over the coming decade.
              Competitive pressure from Roche, IGM, Zenas, and others cuts both ways. It validates the category but also
              caps upside, because a scarce-asset premium erodes if multiple credible peers emerge. That is why the UCB
              deal likely reflects both strategic scarcity and belief in Candid specifically. A purely financial buyer
              would struggle to justify the same price with current public evidence alone; a strategic acquirer can
              justify it by combining platform scarcity, disease breadth, and internal portfolio synergies.
            claimRefs:
              - CV015
