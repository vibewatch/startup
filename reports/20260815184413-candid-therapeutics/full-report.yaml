      - number: '1.4'
        title: Pipeline snapshot, operating footprint, and execution readiness
        blocks:
          - type: paragraph
            body: >-
              By June 2025 Candid had already advanced its two lead assets into five autoimmune diseases, and by March
              2026 it was describing a broader portfolio spanning more than 10 indications plus two newer preclinical or
              preclinical-to-clinic trispecific programs. Cizutamig, the BCMAxCD3 lead program, became the company’s
              flagship because management believed BCMA targeting would be required for the deepest plasma-cell
              depletion and therefore the clearest immune-reset biology. CND261, the CD20xCD3 program, provided a
              complementary B-cell depletion profile and a second clinical readout path. By March 2026 the company also
              highlighted CND319 and CND460 as next-generation trispecific assets, evidence that Candid was trying to
              build a portfolio rather than a single-asset biotech. Execution readiness showed up in three additional
              places. First, management said it had established a China entity to accelerate cost-efficient autoimmune
              data generation. Second, it reported completed manufacturing runs and developed subcutaneous formulations,
              both important for outpatient positioning. Third, transaction materials referenced ongoing clinical work
              in over 10 indications, showing a willingness to use multiple proof-of-concept pathways before narrowing
              into pivotal studies. This operating footprint is unusually expansive for such a young company, which is
              why capital access and program-prioritization discipline are so central to the diligence case.
