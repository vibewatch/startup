  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Who actually belongs in the competitive set
        blocks:
          - type: paragraph
            body: >-
              The competitor landscape around Candid has to be split into three groups. First are direct autoimmune
              T-cell engager peers: companies or programs explicitly pursuing the same off-the-shelf immune-reset logic.
              Roche, Cullinan, and IGM sit closest to that category in public evidence, although each differs sharply in
              maturity and strategic commitment. Second are adjacent autoimmune innovators such as Zenas, which compete
              for the same investor attention and future treatment budgets even without using the identical modality.
              Third are the true status-quo competitors at launch: approved biologics, anti-FcRn agents, complement
              inhibitors, anti-CD20 antibodies, and potentially CAR-T in the most severe immune-reset discussions. This
              framing matters because small private biotech peer comparisons are useful for scientific direction, but
              actual prescription competition will come from entrenched therapies with guideline presence and payer
              precedent. Candid’s public identity is strong precisely because it is one of the few companies openly
              branding itself around autoimmune TCE leadership rather than treating autoimmunity as an optional
              extension of an oncology platform.
