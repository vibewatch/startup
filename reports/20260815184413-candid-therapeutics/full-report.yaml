      - number: '2.2'
        title: 'Sizing lenses: broad syndicated estimates versus narrow first-wave opportunity'
        blocks:
          - type: paragraph
            body: >-
              Third-party market reports support a clear conclusion but not a single precise number: the broader
              bispecific or T-cell engager therapeutics market is large and growing, yet the range of published
              estimates is extremely wide because publishers use different category definitions. Some sources show
              multi-billion-dollar 2026 baselines above $10 billion, while others suggest sub-$2 billion starting
              points. The discrepancy is too large to ignore, so a disciplined diligence view should preserve multiple
              lenses rather than hide the variance. For Candid specifically, the first commercial opportunity is far
              narrower than those top-down figures imply. Public materials repeatedly focus on myasthenia gravis and
              rheumatologic interstitial lung disease as the first global Phase 2 priorities, with rheumatoid arthritis
              and lupus remaining important but more crowded longer-run pools. That means the practical SAM/SOM should
              start with refractory specialist populations where immune-reset biology can justify premium biologic
              reimbursement and where symptom gains are visible enough to change behavior. Bottom-up logic therefore
              matters more than the headline syndicated TAM.
