            body: >-
              Even if the current data continues to look good, Candid still faces moat compression risk. The autoimmune
              T-cell engager opportunity is attracting large and well-capitalized companies such as Roche, plus smaller
              but focused peers such as IGM and Zenas. That means strategy diffusion is a real threat: better-funded
              competitors can run faster, outspend in trials, or acquire adjacent assets if the mechanism class
              continues to validate. Candid's moat is therefore not a guaranteed patent fortress. It looks more like a
              combination of timing, capital, safety positioning, and execution quality. That can be enough, especially
              if UCB closes and backs the assets aggressively, but it is more fragile than a thesis resting on fully
              proprietary discovery infrastructure. There is also focus risk. Ten indications under evaluation sounds
              powerful, yet it can create portfolio sprawl if the company tries to satisfy every autoimmune opportunity
              at once. This is the classic biotech execution question: does breadth multiply optionality, or does it
