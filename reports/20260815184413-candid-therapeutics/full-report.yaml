      - number: '1.3'
        title: Capital formation and strategic transactions
        blocks:
          - type: paragraph
            body: >-
              Candid’s capital story is unusually compressed. At launch, the company said it had access to more than
              $370 million, of which about $206 million was raised directly by Candid and another roughly $165 million
              came from Vignette Bio and TRC 2004. That gave the company enough funding to operate for several years
              and, importantly, to behave opportunistically in public-market timing rather than rushing into an IPO. Six
              months later it bypassed a conventional IPO altogether by agreeing to merge into Nasdaq-listed Rallybio
              while simultaneously raising approximately $505.5 million from a large syndicate of crossover and
              healthcare investors. The March 2026 materials went further by disclosing capitalization math:
              pre-transaction Rallybio holders were expected to own only 3.65% of the combined company, while Candid
              holders plus the new financing investors would own 96.35%, implying that Rallybio functioned primarily as
              a listing vehicle. The same filing set legacy Candid’s implied valuation around $750 million and the
              combined fully diluted capitalization around $1.303 billion. In May 2026, before that public listing
              thesis could play out, UCB signed a definitive agreement to buy Candid for $2.0 billion upfront plus up to
              $200 million in milestones, reframing valuation around strategic M&A rather than public-market price
              discovery.
