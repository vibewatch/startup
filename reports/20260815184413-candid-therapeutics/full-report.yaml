  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Asset map and what the company actually delivers
        blocks:
          - type: paragraph
            body: >-
              Candid's current product is not a marketed drug but a clinically advancing autoimmune-treatment platform
              built around off-the-shelf bispecific T-cell engagers. In practical workflow terms, the company is trying
              to give rheumatologists, neurologists, and specialty investigators a repeatable way to achieve deep B-cell
              and plasma-cell depletion without the manufacturing friction, chemo-conditioning burden, and
              individualized logistics associated with CAR-T therapy. The platform is presently anchored by two clinical
              assets: cizutamig, a BCMAxCD3 bispecific, and CND261, a CD20xCD3 bispecific with a deliberately attenuated
              CD3 arm. Behind them sit two disclosed preclinical programs, CND319 and CND460. That makes Candid less a
              single-asset biotech than a concentrated product family with a shared operating thesis: immune reset via
              T-cell-engaged depletion. What is already tangible today is clinical protocol activity,
              conference-disclosed translational data, trial registrations, and manufacturing readiness—not commercial
              product revenue or approved-label infrastructure.
