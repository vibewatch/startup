        - Execution still matters, but strategic premium proves conservative
        - Moderate
      - - Base
        - UCB closes broadly on terms
        - Strategic value crystallizes near announced range; upside bounded
        - Most upside already embedded in signed deal
        - Highest
      - - Bear
        - Deal fails or reprices; next data less impressive
        - Value resets toward reverse-merger anchor or lower; financing risk returns
        - Strategic validation disappears quickly
        - Moderate
      - - Optional upside branch
        - Deal closes and follow-on milestones ultimately pay
        - Adds milestone value above upfront realization
        - Milestones are contingent and not guaranteed
        - Low-moderate
