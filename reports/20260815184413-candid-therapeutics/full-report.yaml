              Retention and concentration are where the customer story remains weakest. There is no public NRR, GRR,
              churn, contract length, or customer-satisfaction reporting because no commercial customer base exists.
              Trial relationships are somewhat sticky once active—protocol training, IRB work, biomarker collection, and
              enrolled patients create real switching costs—but they are still reversible if safety signals worsen,
              sponsor priorities change, or financing tightens. Concentration risk is therefore severe. A small set of
              strategic and investigator relationships carries most of the current adoption burden, and UCB as pending
              acquirer represents an outsized validation node. Future channel friction is also easy to picture even
              before launch: specialty-biologic reimbursement, prior authorization, infusion or outpatient logistics,
              and step-therapy comparisons against entrenched immunology treatments could all slow uptake. In other
              words, the current adoption signal is strong enough for a pre-commercial biotech but too concentrated and
