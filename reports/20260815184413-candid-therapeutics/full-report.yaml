  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and current spend that Candid is trying to redirect
        blocks:
          - type: paragraph
            body: >-
              The market Candid wants to enter is not the entire bispecific-antibody universe and not the full oncology
              T-cell engager revenue pool. A realistic boundary is narrower: autoimmune and inflammatory diseases where
              deep B-cell and plasma-cell depletion could outperform standard chronic immunosuppression. That matters
              because the budget Candid is trying to win sits today inside established immunology categories, not in
              oncology. Status-quo spending is concentrated in TNF inhibitors, anti-CD20 antibodies, anti-FcRn agents,
              complement inhibitors, corticosteroids, and other biologics or small molecules that manage disease
              activity without necessarily resetting the immune system. Public company messaging explicitly frames
              T-cell engagers as a possible step beyond Humira- and Rituxan-era economics, but the category remains
              pre-commercial and evidence-sensitive. For diligence purposes, oncology TCE sales, hospital infusion
              economics from unrelated hematology products, and non-B-cell autoimmune spending should be treated as
              contextual adjacencies rather than directly addressable revenue. The relevant question is whether
              immune-reset-style B-cell depletion can earn reimbursed specialist adoption in a few severe autoimmune
              niches first, then expand outward from there.
