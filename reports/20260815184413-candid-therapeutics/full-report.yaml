      - number: '8.5'
        title: Recommendation, diligence asks, and exit logic
        blocks:
          - type: paragraph
            body: >-
              The resulting recommendation is conditional but still positive. For investors able to buy below
              UCB-implied close value, the risk-adjusted call remains attractive because strategic validation is
              unusually explicit. For investors effectively buying at full takeout-equivalent value, the better stance
              is hold/track because the largest near-term upside may already be spoken for. Confidence should be
              medium-high rather than absolute because the close is pending, key license economics remain private, and
              larger controlled efficacy datasets are still ahead. The highest-priority diligence asks are therefore
              practical: closing status, exact contract rights around the lead assets, durability and remission depth by
              indication, manufacturing robustness, and fallback financing logic if the transaction slips. Exit logic is
              equally clear. If the deal closes, value is realized strategically. If it fails, the name reverts
              immediately to a venture-style underwriting problem where early clinical evidence, cash needs, and
              competitive class risk matter far more.
