  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: economics-disclosure
    missingEvidence: Standalone audited revenue, gross margin, EBITDA, cash balance, and segment-level mix for Noon’s marketplace, food, quick commerce, membership, and payments businesses.
    whyItMatters: The company’s public valuation narrative is much stronger than its public financial disclosure, which blocks any defensible underwriting of revenue quality or cash-burn durability.
    diligencePath: Request management accounts, audited entity financials, and a segment bridge tying GMV, commissions, delivery fees, payment fees, and membership revenue into consolidated results.
    relatedQuestionRefs:
    - QO025
  - type: missing-source
    severity: material
    topic: governance-depth
    missingEvidence: A reconciled board list, committee structure, and executive roster beyond founder Mohamed Alabbar and CEO Faraz Khalid.
    whyItMatters: Leadership concentration and shallow governance disclosure increase succession, oversight, and key-person risk for a company at decacorn scale.
    diligencePath: Request an org chart, board observer rights, committee charters, and a current list of named executives with tenure and remit.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: minor
    topic: workforce-scale
    missingEvidence: A reconciled definition of drivers, contractors, employees, and country-by-country workforce totals.
    whyItMatters: Public sources cite more than 40,000 drivers and a separate 48,206 employee count, but neither clarifies the operational perimeter.
    diligencePath: Request headcount by contract type, function, and geography, including which categories are included in any public workforce statement.
    relatedQuestionRefs:
    - QO022
  - type: conflicting-data
    severity: minor
    topic: m-and-a-chronology
    missingEvidence: A verified acquisition chronology for Namshi and SIVVI with dates, deal terms, and post-merger integration outcomes.
    whyItMatters: Market-data sources appear noisy on acquisition timing, which weakens confidence in the exact corporate-history sequence.
    diligencePath: Request primary transaction announcements or legal transaction summaries for all major acquisitions and integrations.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO004
  - type: missing-source
