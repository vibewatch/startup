- id: TU006
  title: Customer feedback signal table
  columns:
  - Signal
  - What it measures
  - Current message
  - Why it matters
  - Limitation
  rows:
  - - Item Defect Rate
    - Low ratings plus seller-controllable returns over 60 days
    - Directly affects account health and visibility
    - Links customer quality outcomes to seller durability
    - Threshold values are not fully disclosed
  - - Cancellation Rate
    - Out-of-stock driven cancellations over 10 days
    - High rate hurts warehouse performance and account health
    - Shows inventory accuracy matters to customer trust
    - No public median or benchmark disclosed
  - - Late Shipment Rate
    - Late fulfillment relative to estimated ship date
    - Can hurt visibility and risk warehouse deactivation
    - Delivery quality is a direct customer experience lever
    - No public country split
  - - Seller review disputes
    - Process for invalid or irrelevant reviews
    - Can remove some reviews and ratings if accepted
    - Shows a governance mechanism rather than passive complaint exposure
    - Generic or old complaints may still count
  - - Plan of Action window
    - 7-day correction path for poor status
    - Needed before deactivation or low visibility escalates
    - Indicates Noon actively manages merchant-side customer outcomes
    - Does not prove recovery rates
  notes: These seller-facing quality signals matter because Noon’s marketplace customer experience depends on how the platform disciplines sellers and fulfillment operations.
