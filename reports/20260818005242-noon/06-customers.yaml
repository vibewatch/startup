- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale signal
  - Strategic value
  - Gap
  rows:
  - - General retail shoppers
    - Households and individuals / same / same
    - Multi-category ecommerce purchases
    - Localized UAE, Saudi, and Egypt storefronts; 50M+ app downloads
    - Core demand engine for assortment and cross-sell
    - No active buyer count or order-frequency disclosure
  - - Urgent convenience users
    - Households / same / same
    - 15-minute grocery and top-up delivery
    - Noon Minutes branded promise; quick-retail lead signal in UAE
    - High-frequency demand can improve habit and delivery density
    - No public SLA, order density, or contribution-margin data
  - - Food-ordering users
    - Consumers / same / same
    - Restaurant delivery inside Noon app
    - App Store says 10,000+ restaurants and 100+ cuisines
    - Adds meal occasions and more frequent app opens
    - No public food-order count or retention data
  - - Noon One members
    - Loyal households / same / same
    - Delivery benefits and deal-led loyalty
    - Dedicated membership surface
    - Potential repeat-purchase and attach-rate lever
    - No member count, pricing detail, or renewal-rate disclosure
  - - Marketplace sellers
    - SMBs, brands, and distributors / seller teams / seller firms
    - Catalog listing, pricing, fulfillment, payouts
    - Seller Lab and localized onboarding pages
    - Expands catalog breadth and can deepen supply density
    - No public seller count, churn, or GMV-by-seller distribution
  - - Payment merchants
    - Merchants and institutions / merchant ops teams / merchant firms
    - Gateway collection, pages, links, installments, subscriptions
    - Named merchant stories across sectors
    - Diversifies customer base beyond shoppers and can raise ecosystem stickiness
    - No public merchant count, TPV, or merchant retention disclosure
  notes: Segments are based on product surfaces and named proof visible in public sources, not on internal revenue segmentation published by Noon.
