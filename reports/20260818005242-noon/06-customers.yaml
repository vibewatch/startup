- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Super-app cross-sell across marketplace, food, and minutes
    - No disclosed attach rates by segment
    - Could lift lifetime value if same user cohorts buy more categories
    - Request category overlap and share of buyers using 2+ modules
  - - Noon One loyalty loop
    - No member-count or renewal disclosure
    - Could create habitual buying and lower delivery friction
    - Request renewal cohorts and member order frequency
  - - Seller acquisition and service tooling
    - No active-seller count or GMV concentration
    - Catalog density can expand assortment, but weak seller health could reduce supply
    - Request top-seller concentration and seller churn by country
  - - Merchant-payments land-and-expand
    - No merchant-count, TPV, or concentration data
    - Could diversify customer base beyond retail and deepen ecosystem control
    - Request TPV concentration, merchant churn, and upsell conversion
  - - Multi-country surface
    - No country revenue mix or contribution margin
    - Geographic diversification may help resilience but may hide weaker markets
    - Request country-by-country active users, orders, and gross margin
  notes: Expansion logic is visible, but concentration cannot be quantified from public evidence because core customer denominators and mix disclosures are absent.
