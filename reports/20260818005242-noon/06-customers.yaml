  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Active buyers, repeat-purchase cohorts, Noon One renewal, seller churn, merchant churn, and net revenue retention by segment.
    whyItMatters: Customer breadth is easier to prove than customer durability; without cohort data, unit economics and concentration cannot be underwritten.
    diligencePath: Request cohort tables by country and product line, plus member renewal, seller churn, merchant churn, and net revenue retention schedules.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: customer-mix
    missingEvidence: Country-level active customer counts, order counts, merchant counts, and seller counts with contribution by product module.
    whyItMatters: Noon likely has very different economics across marketplace, food, quick commerce, and payments, but public sources do not identify which customer pools matter most.
    diligencePath: Request customer, merchant, and seller counts by geography and product line, including order-frequency distributions and top-customer concentration.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU001
    - TU005
  - type: missing-source
    severity: minor
    topic: merchant-proof-bias
    missingEvidence: Independent merchant references or contract documents that validate Noon Payments case studies beyond curated company blog stories.
    whyItMatters: Named merchant stories are directionally helpful but inherently selection-biased and do not prove average merchant satisfaction.
    diligencePath: Request reference calls across three merchants per country plus TPV, chargeback, and support-SLA history.
    relatedQuestionRefs:
    - QU011
    relatedTableRefs:
    - TU003
  - type: conflicting-data
    severity: minor
    topic: satisfaction-sample-bias
    missingEvidence: A reconciled internal CSAT / NPS / refund-cycle dataset that explains why app-store sentiment is strong while review sites are heavily adverse.
    whyItMatters: The split between high app ratings and poor complaint-site ratings makes it hard to assess true service quality or user mix.
    diligencePath: Request internal satisfaction trends, delivery success, refund timing, and complaint-root-cause dashboards by country.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU002
    - TU004
  - type: missing-source
