tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Noon
  rows:
  - - Marketplace retail
    - Digital GMV across electronics, fashion, beauty, home, baby, pet, and grocery sold through app/web storefronts
    - Offline store-only purchases and wholesale procurement
    - Household shopper / household budget
    - Core catalog breadth and repeat-use anchor
  - - Quick commerce / urgent grocery
    - Top-up baskets for groceries, snacks, beverages, personal care, and household essentials
    - Planned weekly offline hypermarket stock-up missions
    - Urban household / household budget
    - Core urgency layer validated by Noon Minutes
  - - Food delivery
    - Restaurant and prepared-food orders fulfilled through app marketplaces
    - Offline dine-in spend unless converted through app-led offers
    - Individual consumer / household or workplace budget
    - Adjacent but important frequency engine for Noon
  - - Merchant payments
    - Gateway, links, pages, subscriptions, QR, and invoice acceptance for merchants
    - General consumer credit, deposits, wealth products
    - Merchant / merchant P&L
    - Extends Noon beyond retail into commerce infrastructure
  - - Incumbent broad-marketplace convenience
    - Fast-delivery or grocery-enabled assortment sold by Amazon, Carrefour, and similar incumbents
    - Pure offline supermarket sales
    - Household shopper / household budget
    - Defines the substitution set Noon must win against
  - - Cross-border discount commerce
    - Imported, app-led low-price discretionary retail that competes for wallet share
    - Travel, ticketing, and unrelated digital services
    - Price-sensitive consumers / household budget
    - Important substitute pressure but not Noon’s full market definition
  notes: The market is defined around commerce categories Noon visibly serves or must defend against, not around all retail or all fintech spend in the region.
