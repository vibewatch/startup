- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - 99% internet penetration and 218 Mbps average mobile speed in Saudi Arabia
    - Driver
    - Ongoing
    - Supports mobile-first ordering and high-frequency re-engagement
    - Validate Noon’s country-level order mix and device share
  - - 70% cashless-transactions target by 2030
    - Driver
    - Medium term
    - Reduces checkout friction and supports payments attach
    - Request Noon Payments TPV and payment-method mix
  - - Saudi digital economy at 16.0% of GDP and rising e-commerce registrations
    - Driver
    - Ongoing
    - Signals business-formation and digital-demand depth
    - Request seller growth and merchant-activation trends
  - - Subsidy-led discounting and free-delivery intensity
    - Constraint
    - Immediate
    - Can inflate GMV while compressing contribution margin
    - Request retention by cohort with and without promo spend
  - - Draft competition guidelines on predatory pricing, exclusivity, and self-preferencing
    - Constraint / normalizer
    - Immediate to medium term
    - Likely shifts competition from subsidy wars toward service quality
    - Request management view on normalized unit economics
  - - Localization, RHQ rules, and Saudization requirements
    - Constraint
    - Ongoing
    - Increase execution friction and staffing complexity
    - Request local hiring mix and legal-entity readiness
  - - Cross-border data-transfer and privacy uncertainty
    - Constraint
    - Ongoing
    - Can affect data architecture, vendor selection, and compliance cost
    - Request PDPL compliance design and data-hosting map
  - - Egypt macro volatility
    - Constraint
    - Ongoing
    - Makes demand quality and margin durability less predictable outside the GCC core
    - Request country-level contribution margin and FX exposure
  notes: The most important constraints affect margin quality and operational execution rather than headline demand existence.
