evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: economics-disclosure
    missingEvidence: >-
      Standalone audited revenue, gross margin, EBITDA, cash balance, and segment-level mix for Noon’s marketplace,
      food, quick commerce, membership, and payments businesses.
    whyItMatters: >-
      The company’s public valuation narrative is much stronger than its public financial disclosure, which blocks any
      defensible underwriting of revenue quality or cash-burn durability.
    diligencePath: >-
      Request management accounts, audited entity financials, and a segment bridge tying GMV, commissions, delivery
      fees, payment fees, and membership revenue into consolidated results.
    relatedQuestionRefs:
      - QO025
  - type: missing-source
    severity: material
    topic: governance-depth
    missingEvidence: >-
      A reconciled board list, committee structure, and executive roster beyond founder Mohamed Alabbar and CEO Faraz
      Khalid.
    whyItMatters: >-
      Leadership concentration and shallow governance disclosure increase succession, oversight, and key-person risk for
      a company at decacorn scale.
    diligencePath: >-
      Request an org chart, board observer rights, committee charters, and a current list of named executives with
      tenure and remit.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: minor
    topic: workforce-scale
    missingEvidence: A reconciled definition of drivers, contractors, employees, and country-by-country workforce totals.
    whyItMatters: >-
      Public sources cite more than 40,000 drivers and a separate 48,206 employee count, but neither clarifies the
      operational perimeter.
    diligencePath: >-
      Request headcount by contract type, function, and geography, including which categories are included in any public
      workforce statement.
    relatedQuestionRefs:
      - QO022
  - type: conflicting-data
    severity: minor
    topic: m-and-a-chronology
    missingEvidence: >-
      A verified acquisition chronology for Namshi and SIVVI with dates, deal terms, and post-merger integration
      outcomes.
    whyItMatters: >-
      Market-data sources appear noisy on acquisition timing, which weakens confidence in the exact corporate-history
      sequence.
    diligencePath: >-
      Request primary transaction announcements or legal transaction summaries for all major acquisitions and
      integrations.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: stakeholder-map-coverage
    missingEvidence: >-
      A fully reconciled cap table, current investor stakes, board-right package, and merchant or payments-customer
      concentration for the stakeholder map.
    whyItMatters: >-
      The current stakeholder map is directionally useful but still partial, which limits assessment of control,
      dilution, and ecosystem concentration risk.
    diligencePath: >-
      Request the latest cap table, governance-rights summary, merchant concentration schedule, and Noon Payments
      merchant mix by country.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: noon-sam-and-som
    missingEvidence: >-
      No public data isolates Noon’s exact category mix, country mix, active-buyer mix, or merchant-attach rates well
      enough to derive a precise SAM or SOM.
    whyItMatters: >-
      Without category and geography mix, broad TAM figures are easy to overuse and difficult to convert into an
      investable revenue opportunity.
    diligencePath: >-
      Request GMV split by country, category, and vertical plus active customers, frequency, and merchant counts by
      cohort.
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: material
    topic: consumer-penetration-by-country
    missingEvidence: >-
      A reconciled country-by-country active-customer and order-frequency dataset for Noon across Saudi Arabia, UAE, and
      Egypt.
    whyItMatters: >-
      Regional market estimates are only useful if they can be anchored to Noon’s actual exposure and repeat-use quality
      in each geography.
    diligencePath: Request monthly active buyers, order frequency, and churn / retention by country and vertical.
    relatedQuestionRefs:
      - QM014
      - QM022
  - type: conflicting-data
    severity: minor
    topic: quick-commerce-estimate-delta
    missingEvidence: >-
      A reconciled methodology note explaining why IMARC and Mordor publish materially different GCC quick-commerce
      starting points.
    whyItMatters: TAM narratives can become misleading when publisher boundary choices are not normalized.
    diligencePath: >-
      Compare the included countries, product categories, and order types in each analyst methodology before using
      either figure in valuation models.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: regulatory-operating-detail
    missingEvidence: Specific Saudi compliance cost, localization-plan, and PDPL architecture disclosures from Noon itself.
    whyItMatters: Market-level regulatory discussion does not reveal how prepared Noon is relative to peers.
    diligencePath: Request legal-entity map, data-hosting architecture, rider-compliance playbook, and Saudization plan.
    relatedQuestionRefs:
      - QM019
      - QM023
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
