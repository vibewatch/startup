  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: Noon 体验把发现、选择、结账和履约串联到多个垂直品类。
    data:
      nodes:
        - id: browse
          label: 浏览本地化店面或 App
          detail: 零售、餐饮、杂货、优惠
