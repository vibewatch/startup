              One；先采用收款的商户，如果服务保持强势，可能加深使用。这一战略逻辑在产品界面和商户推荐语中可见。问题在衡量。公开来源没有披露活跃买方数、客户队列、卖家或商户数、国家组合或续约数据。没有这些分母，投资者无法判断客户价值是分散且耐久，还是集中且脆弱。负面评价悬而未决，也提出一种可能：获客规模正在掩盖服务一致性弱点。因此，本章主要结论不是
