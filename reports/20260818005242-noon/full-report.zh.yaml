  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 这张图概括 Noon 超级应用和卖家生态里的典型客户旅程：发现、下单、配送、复购和投诉升级。
    data:
      nodes:
        - id: discover
          label: 发现
          detail: 用户通过应用商店、商城搜索，或区域品牌认知进入。
        - id: browse
          label: 浏览
          detail: 用户在一个应用里浏览零售、餐饮或即时零售入口。
        - id: checkout
          label: 下单
          detail: 会员权益、速度承诺和支付体验降低下单阻力。
        - id: delivery
          label: 配送 / 履约
          detail: 订单体验取决于 Noon 物流、卖家表现和客服响应。
        - id: repeat
          label: 复购或扩展
          detail: 如果服务跑顺，Minutes、餐饮和 Noon One 能提高使用频次。
        - id: complaint
          label: 投诉或争议循环
          detail: 服务薄弱会把用户推向退款、客服、评分和卖家账号处罚链路。
    approximationNotes: 这是基于消费者、卖家和商户界面拼出的综合用户旅程，不是公司发布的流程图。
