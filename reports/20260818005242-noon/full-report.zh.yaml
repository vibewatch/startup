        - 重大执法行动、牌照问题或转移规则违规
        - 损害支付业务可选性，并提高法律折价
        - 暂停尽调，直到架构得到验证
      - - 服务质量恶化
        - 投诉趋势恶化，卖家健康处罚加剧
        - 削弱客户耐久性和留存假设
        - 提高不透明折价，并下调情景区间
      - - 即时零售利润率失效
        - 补贴容忍度收紧时，仍看不到更健康经济性的清晰路径
        - 削弱 Minutes 和便利零售的可选性价值
        - 剥离即时零售增长叙事溢价
      - - IPO 延迟且披露未升级
        - 退出窗口后移，财务可见度仍差
        - 将战略吸引力变成纸面价值被困风险
        - 倾向观察 / 等待，而不是激进跟投
    notes: 即便对 Noon 的广泛战略兴趣仍在，上述触发项也最可能迅速改变估值判断。
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV014
      - CV036
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计财务
        - 收入、毛利率、EBITDA、现金消耗和分部结构
        - 任何有真实置信度的估值方法都离不开
        - 要求提供经审计主体报表和管理层调节表
      - - 客户耐久性
        - 买家队列、Noon One 续费、卖家流失、商户流失、NRR
        - 区分规模与有价值的复购 / 持续行为
        - 要求按国家和产品线提供队列包
      - - 即时零售单位经济
        - 贡献利润率、订单密度、补贴强度、客单经济
        - 是判断 Minutes 是期权价值还是利润率拖累的关键
        - 要求提供单位经济材料和监管情景规划
      - - 融资条款
        - 优先股堆叠、清算权、反稀释、债务或附属协议
        - 没有资本结构细节，私募回报算不清
        - 要求提供最新条款清单和股权结构摘要
      - - 治理与退出计划
        - 董事会构成、委员会、审计准备度、IPO 里程碑
        - 决定 Noon 能否长到经得起公开市场审视
        - 要求提供治理资料包和上市准备路线图
    notes: 上述尽调要求杠杆最高，因为它们会直接改变建议、置信度和估值立场，而不是只增加叙事色彩。
    claimRefs:
      - CV005
      - CV006
      - CV037
      - CV036
