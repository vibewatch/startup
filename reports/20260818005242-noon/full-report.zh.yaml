              客户地图比简单的消费者市场故事更宽。公开站点和 App 描述显示，至少有五个有意义的客户群：普通零售购物者、使用 Noon Minutes 的紧急便利买方、餐厅点单用户、为配送绑定便利付费的 Noon One
