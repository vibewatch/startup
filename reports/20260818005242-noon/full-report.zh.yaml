      - number: '8.4'
        title: 退出准备度仍有限；眼下最有价值的是聚焦尽调，而不是外推叙事
        blocks:
          - type: paragraph
            body: >-
              Noon 可能成长为达到 IPO 规模的区域冠军，但这种可能性不等于今天已经准备好
              IPO。公开市场投资人和后期私募投资人仍需要经审计的收入和利润率证据、队列耐久性、分部结构以及融资条款清晰度，才能有信心支撑溢价结果。也正因此，目标回报测算不能只靠公开数据负责地完成。缺少经审计的运营基线，也看不到优先股堆叠，精确回报预测只会制造虚假精确。正确的下一步不是讲更多故事，而是一套更窄的最终尽调包，直指会移动价格的变量。如果管理层能补上这些证据缺口，建议可以上调。如果新一轮融资或监管挫折先于更好披露发生，投资逻辑破裂触发条件会很快生效，估值论据也会进一步变弱。换句话说，这里的更多尽调不是官僚负担；它是把叙事估值转成能被投资委员会承接的投资判断的唯一负责路径。
