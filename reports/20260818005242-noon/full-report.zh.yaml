              则把更多负担转回给商户。这指向一个混合模型：Noon 可以用更高物流和逆向物流成本敞口，换取更强服务控制和更快配送。即时零售和餐饮很可能进一步加重成本负担，因为它们依赖密集履约和快速最后一公里。Redseer
              关于补贴驱动规模的警告在这里很重要：如果免配送费和返现帮助建立品类需求，已报告活动的盈利性可能低于表面。商户侧经济性也受到竞争对手卖家项目和结账平台压力。Amazon 明显用费率折扣和广告点数吸引卖家，Tabby
              Business 则声称能给商户带来强转化收益。结果是，这个模型很可能承载有意义的物流和商户获客成本，哪怕公开记录没有披露真实毛利率桥。缺失的这座桥，正是利润率判断仍只能暂定的原因。
