              支撑，更广泛的支付界面也暗示了结构化商户入驻和集成纪律。面向卖家的页面还显示品牌注册、审批和文档检查，这些都与目录质量和商户信任有关。但除此之外，公开证据比投资者想要的更薄。已审阅材料没有建立正式 uptime
