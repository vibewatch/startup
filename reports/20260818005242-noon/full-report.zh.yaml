      - number: '8.2'
        title: 多头逻辑是真实的平台相关性；反向逻辑是相关性跑在披露前面
        blocks:
          - type: paragraph
            body: >-
              看多 Noon
              的逻辑很直接。它覆盖多个国家，搭起多垂直品类的电商栈，消费者触达信号强，还能通过便利零售、外卖、会员和支付打开更多选择。在数字零售和物流仍有深化空间的区域，这些特征很值钱。看空逻辑同样清楚：公开投诉渠道仍然粗糙；补贴容忍度下降后，即时零售可能变得更贵；公司仍不披露投资人最需要的运营数据。从估值看，Noon
              已有足够战略验证，值得认真尽调，但达到公开市场质量的证据还不够，无法抹掉显著的不透明折价。这种张力解释了为什么投资逻辑和反向逻辑仍同时成立。公司可能应享有高于较小区域同行的溢价，但公开证据仍支持怀疑：它是否应拿到接近全球规模可比公司的溢价。
            claimRefs:
              - CV007
              - CV008
              - CV009
