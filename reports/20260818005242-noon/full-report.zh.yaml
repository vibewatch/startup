        blocks:
          - type: paragraph
            body: >-
              Noon 并非没有缓释因素。本地化卖家工作流、明确卖家治理系统，以及新近主权资本加创始人资金，都降低了一些眼前失败模式。但剩余风险仍高，因为治理深度仍不透明，公开叙事过多集中在少数人和少数主张上。Mohamed
              Alabbar 作为创始人和出资人仍居核心，Faraz Khalid 则是少数清晰可见的运营领导者之一。这不能证明脆弱，但确实提出接班和监督问题。Tracxn 的员工数代理指标和 Noon
