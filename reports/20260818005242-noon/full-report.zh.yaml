  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：为什么 Noon 的真实战场比泛电商 TAM 更窄
        blocks:
          - type: paragraph
            body: >-
              分析 Noon 市场时，第一个陷阱是把整个 GCC 电商板块都叫作公司的 TAM，然后就此打住。这会高估 Noon 以当前产品形态能够实际变现的范围。Noon
              明确参与了几层相连业务：市场零售、即时生鲜杂货和便利服务、餐厅配送，以及商户侧支付赋能。这些层共享买方关系、App
              界面、物流版图和支付完成闭环，因此应纳入可服务市场讨论。与此同时，线下零售、批发采购、旅游和无关金融服务等受数字影响很大的品类，应留在核心市场边界之外，因为 Noon
              当前公开产品界面并不能证明它在那里有持久参与。更合适的框架，是 GCC 城市便利型商业，叠加支付和目录宽度，而不是 MENA 全部零售支出。这个更窄的框架解释了为什么即时零售、餐饮配送和支付证据虽然面对 Noon
              更宽的消费者店面，却对估值格外重要。
            claimRefs:
              - CM001
              - CM002
              - CM028
              - CM029
              - CM030
