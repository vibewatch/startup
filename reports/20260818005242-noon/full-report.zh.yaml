  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、区域版图与产品范围
        blocks:
          - type: paragraph
            body: >-
              Noon 的公开消费端界面已经足够大，更像一个区域平台，而不是单一国家的线上零售商。公司在阿联酋、沙特阿拉伯和埃及都有独立站点，统一使用 Noon
              品牌；仅阿联酋站点就展示了很宽的品类组合，包括电子、时尚、美妆、家居、母婴、运动、宠物和生鲜杂货。公开 App 商店描述把这个版图从目录型市场延伸到餐饮配送、生鲜杂货和快速配送便利服务。实际看，Noon
              现在更像一个有多层变现方式的海湾消费者超级 App，而不只是横向电商网站。Noon One 会员页叠加了订阅层，围绕免配送费和专属优惠展开；Noon
              配送商店页则强调灵活退货、安全支付和城市级速度承诺。证据在地理和品类宽度上相互一致，但在法律实体边界、各国活跃客户数、各垂直业务收入贡献上远不够精确。
