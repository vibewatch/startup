  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: Noon 最严重的风险集中在监管、服务质量、资本依赖和估值不透明，而不是单一、非黑即白的法律问题。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 高影响
          values:
            - 创始人继任冲击
            - BNPL 结构压力
            - PDPL / 客服 / 竞争挤压利润率
        - label: 中等影响
          values:
            - 品牌问题
            - 埃及宏观压力
            - 卖家质量恶化
        - label: 较低影响
          values:
            - 一次性投诉激增
            - 临时品类限制
            - 小幅工作流变化
    approximationNotes: 单元格概括所审语料中的定性位置；并非统计概率。
    claimRefs:
      - CR001
      - CR006
      - CR011
      - CR018
      - CR024
      - CR032
      - CR034
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Noon 的主要风险沿关联路径传导到客户信任、卖家健康度、单位经济、融资和估值弹性。
    data:
      nodes:
        - id: reg
          label: 监管 / 法律
          detail: 隐私、BNPL、本地化、标准
        - id: ops
          label: 运营质量
          detail: 延迟发货、退货、客服、卖家缺陷
        - id: macro
          label: 宏观 / 国家
          detail: 埃及通胀和外汇压力
        - id: margin
          label: 利润率 / 烧钱
          detail: 补贴、服务补救、合规成本
        - id: trust
          label: 客户 / 卖家信任
          detail: 评论、留存、可见度
        - id: valuation
          label: 融资 / 估值
          detail: 轮次定价和 IPO 准备度
      edges:
        - from: reg
          to: margin
          label: 推高成本
        - from: ops
          to: trust
          label: 削弱
        - from: macro
          to: margin
          label: 挤压
        - from: trust
          to: valuation
          label: 削弱叙事
        - from: margin
          to: valuation
          label: 迫使重定价
        - from: reg
          to: trust
          label: 制造摩擦
    approximationNotes: 传导箭头反映公开证据最支持的因果链，而不是完整内部风险模型。
    claimRefs:
      - CR008
      - CR020
      - CR029
      - CR018
      - CR032
      - CR041
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: 业务同时依赖监管方、资本提供方、卖家、物流执行、商户和宏观条件。
    data:
      nodes:
        - id: pif
          label: PIF / 创始人资本
          detail: 资金支持和战略背书
        - id: reg
          label: 监管方
          detail: SAMA、CBUAE、隐私与标准主管机构
        - id: sellers
          label: 卖家 / 仓库
          detail: 库存、缺陷率、发货纪律
        - id: merchants
          label: 支付商户
          detail: 持牌且已集成的支付使用场景
        - id: users
          label: 消费者
          detail: 需求、留存、投诉压力
        - id: egy
          label: 埃及宏观
          detail: 通胀、外汇、区域冲击
      edges:
        - from: pif
          to: users
          label: 为增长供资
        - from: reg
          to: merchants
          label: 许可
        - from: sellers
          to: users
          label: 履约
        - from: merchants
          to: users
          label: 完成结账
        - from: egy
          to: users
          label: 影响需求
        - from: users
          to: sellers
          label: 反馈循环
    approximationNotes: 这张图突出关键外部和半外部依赖，而不是每个内部运营团队。
    claimRefs:
      - CR023
      - CR031
      - CR033
      - CR030
      - CR019
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议来自一个权衡：真实战略证据被估值不透明和未解风险抵消。
    data:
      nodes:
        - id: scale
          label: 真实平台规模
          detail: 区域商城、应用触达、产品广度
        - id: proof
          label: 战略证据
          detail: 即时零售相关性、商户业务可选性、出资方背书
        - id: gaps
          label: 披露缺口
          detail: 无经审计收入、利润率、队列或融资条款
        - id: risk
          label: 剩余风险
          detail: 服务质量、监管、即时零售利润率、国家风险
        - id: decision
          label: 决策
          detail: 继续研究 / 昂贵 / 高风险
      edges:
        - from: scale
          to: proof
          label: 支撑
        - from: proof
          to: decision
          label: 推高
        - from: gaps
          to: decision
          label: 拖低
        - from: risk
          to: decision
          label: 要求折价
        - from: scale
          to: gaps
          label: 跑在前面
    approximationNotes: 逻辑链是定性的，并有意保持简单，因为核心争论是证据是否足够，而不是电子表格有多复杂。
    claimRefs:
      - CV007
      - CV008
      - CV004
      - CV005
      - CV012
      - CV041
      - CV044
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 最能撬动 Noon 估值论证的变量与证据有关，而非纯叙事。
    data:
      items:
        - label: 经审计收入与分部结构
          value: 10
          detail: 最重要的缺失输入
        - label: 贡献利润率证据
          value: 9
          detail: 对平台业务、即时零售和餐饮经济性至关重要
        - label: 客户持续性 / 留存
          value: 8
          detail: 支撑溢价倍数所需
        - label: 支付 / 隐私监管清晰度
          value: 7
          detail: 可能快速拉宽或收窄折价
        - label: 退出时点 / 流动性窗口
          value: 6
          detail: 影响赞助方耐心和跟价意愿
    approximationNotes: 柱状条按 1 到 10 排列相对重要性；它们不代表统计模型。
    claimRefs:
      - CV034
      - CV005
      - CV017
      - CV035
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公开证据下的估值区间说明，为什么多数更守纪律的情景低于 Noon 当前隐含估值。
    data:
      items:
        - label: 悲观
          low: 3
          high: 5
          unit: USD billions
          detail: 融资重定价、服务拖累和即时零售利润率压力
        - label: 基准
          low: 6
          high: 8
          unit: USD billions
          detail: 战略相关性仍在，但不透明折价持续
        - label: 当前隐含估值
          low: 10
          high: 10
          unit: USD billions
          detail: 媒体报道的轮后估值锚
        - label: 乐观
          low: 10
          high: 12
          unit: USD billions
          detail: 需要 IPO 级披露和更好的经济性
    approximationNotes: 这些区间是基于公开证据划出的判断带，不应误认为完整估值模型。
    claimRefs:
      - CV002
      - CV031
      - CV032
      - CV033
      - CV027
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: Noon 在战略相关性上得分最高，在证据质量和估值支撑上最弱。
    data:
      items:
        - label: 市场相关性
          value: 8/10
          note: GCC 地位强，数字市场背景有利
        - label: 产品广度
          value: 8/10
          note: 电商平台、即时零售、餐饮、会员、支付
        - label: 客户证据
          value: 6/10
          note: 应用触达强，也有具名商户案例；满意度分化
        - label: 经济性证据
          value: 3/10
          note: 无公开经审计收入或利润率包
        - label: 风险画像
          value: 4/10
          note: 监管、服务质量和不透明度仍有分量
        - label: 估值支撑
          value: 3/10
          note: 当前估值跑在公开可比支撑之前
    approximationNotes: 评分是定性尽调速记，不是专有量化框架的输出。
    claimRefs:
      - CV015
      - CV008
      - CV009
      - CV012
      - CV005
