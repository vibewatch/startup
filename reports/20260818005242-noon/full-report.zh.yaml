      - number: '8.3'
        title: 可比公司给出的区间很宽，但按公开证据推演，多数合理情景都低于当前估值
        blocks:
          - type: paragraph
            body: >-
              即便不能推导出精确倍数，可比公司分析仍有价值。Jahez 和 Jumia 表明，上市的区域或新兴市场电商运营商即便业务不小，Jahez 还披露真实收入，公开市值也可能长期偏低。Delivery Hero 和
              Coupang 展示了区间另一端：大型上市运营商可以支撑更高市值，但它们的规模和财务披露也远深于 Noon 目前水平。Noon
              因此夹在尴尬的中间地带。它显然比小型投机平台更具战略重要性，但当前估值已经把它拉得更接近超大型全球运营商，而不是较小的上市同行。因此，基准情景应假设估值低于当前私募标记，除非 Noon
              证明其经济性和披露强度高于公开证据目前支持的水平。乐观情景需要真正的 IPO 级证据；悲观情景只要少得多的变量出错就会成立。
