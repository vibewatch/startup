        title: 能力宽度真实存在，但标价和实际经济性仍不透明
        blocks:
          - type: paragraph
            body: >-
              相比只做餐饮或只做目录的对手，Noon 最强的可见优势是宽度。公开来源显示，市场选品、即时零售、餐饮配送和商户支付都在 Noon 栈内。在商户支付上，它比 Talabat 或 HungerStation
              更宽；在商业功能上，它比 Tabby 或 Tamara 更宽；在品类范围上，它也比 Namshi 更宽。但仅有宽度并不能解决比较，因为专业玩家往往在自己的任务中更强。Amazon 和 Carrefour
              传递可靠性和生鲜杂货深度，Talabat 和 HungerStation 传递本地高频习惯和优惠，Namshi 传递正品与退货信心，BNPL
              领导者则传递转化信任。公开定价数据也很薄：分期条款、配送速度承诺和会员界面可见，但佣金率、实际配送补贴和商户经济性大多不可见。商户获取能力同样重要：Amazon 卖家激励、Deliveroo 商户工具、Tabby
              Business 的转化主张，都显示对手在激烈争夺供给和需求。结果是，能力比较可以做，但真正的定价权比较仍取决于私下尽调。
