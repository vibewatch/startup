      - number: '2.4'
        title: 驱动因素强劲，但监管、补贴和宏观分化决定真实风险边界
        blocks:
          - type: paragraph
            body: >-
              Noon 所在市场受益于罕见强劲的结构驱动：沙特阿拉伯近乎普及的互联网接入、数字支付渗透提升、密集城市地理、气候驱动的便利需求，以及购物和餐饮 App 参与度的季节性峰值反复出现。Sensor Tower 的区域
              App 数据支持这个需求故事：收入增长快于下载增长，说明变现正在成熟，而不只是新鲜感推动。但市场并非没有摩擦。Redseer 认为，2025
              年沙特即时零售增长被重补贴的免配送费和返现行为加速，同时压缩了利润率；新的沙特竞争指引也开始针对掠夺性定价、排他性和自我优待。Trade.gov
              又增加了一层摩擦：本地化规则、劳工配额、数据传输不确定性，以及持续存在的假货问题。最后，按 World Bank
              口径，埃及仍有战略价值，但宏观经济弱于阿联酋或沙特阿拉伯。结果是，市场仍有吸引力并在增长，但可持续份额更可能取决于留存、物流效率和监管纪律，而不只是促销投入。
