      - number: '2.2'
        title: 多组测算都指向沙特阿拉伯是重心
        blocks:
          - type: paragraph
            body: >-
              沙特阿拉伯是公开证据中最重要的地理市场，因为它同时拥有最大的数字基础设施底盘和最深的即时零售需求。Trade.gov 将沙特 ICT 市场描述为接近 $48 billion，互联网渗透率 99%，平均移动网速
              218 Mbps，并预计电商收入到 2027 年达到 $24.7 billion。GASTAT 进一步强化了这个背景：数字经济占 GDP 的
              16.0%，电商企业注册量继续上升。分析师估计随后把范围收窄到便利服务层。Mordor 估算 2026 年 GCC 即时零售为 $4.59 billion，沙特阿拉伯单独为 $2.38 billion，并把
              2025 年 GCC 需求的 54.76% 归于沙特阿拉伯。IMARC 给出的 2025 年 GCC 基数较低，为 $2.7
              billion，但长期曲线陡峭得多；这不是方向矛盾，更是在提醒市场边界和方法选择会实质改变标题数字。可靠结论不是某个精确 TAM，而是沙特阿拉伯是区域变现锚点，也是 Noon 增量份额提升最重要的市场。
