  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 正确比较对象是一组对手类型，而不是单一同业
        blocks:
          - type: paragraph
            body: >-
              Noon 的竞争地图异常宽，因为公司本身覆盖了多种商业任务。Amazon 和 Carrefour 争夺广泛选择和以生鲜杂货为核心的家庭支出。Talabat、HungerStation、Deliveroo 和
              Jahez 争夺高频本地餐饮和便利场景。Namshi 争夺时尚策展和品牌驱动发现，Temu 和 SHEIN 则靠跨境目录深度争夺低价可选消费需求。结账侧，Tabby 和 Tamara
              也重要，因为它们影响支付点的转化和客户信任，即便它们本身不是综合市场。含义是，Noon
              很少只在同一时间面对一个敌人。相反，它在不同任务中对阵不同替代品并决定输赢。这让生态便利性成为最可信的护城河故事，但也意味着简单的「区域版 Amazon」比较会漏掉 Noon
              在时尚、餐饮或结账特定买方选择中的重要弱点。
