  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管对 Noon 不是抽象变量；它触及数据、支付、商品、用工和内容
        blocks:
          - type: paragraph
            body: >-
              沙特阿拉伯对 Noon 有战略吸引力，但也是合规栈最厚的司法辖区。Trade.gov
              描述的市场仍带有监管不可预测、本地化要求和实施持续演变的特征。对一个多边商业平台来说，这些压力会同时打到几个层面：市场库存的产品合规和假货控制、客户数据的隐私和跨境传输控制、运营中的用工和本地内容要求，以及结账产品的支付或
              BNPL 规则。法律指南进一步强调，PDPL 覆盖很广，给控制者带来真实责任。BNPL 或分期相关产品在阿联酋和沙特阿拉伯都面临正式央行监管。这些都不意味着 Noon
              不能投，但确实意味着，以它所处阶段和所宣称价值看，公司的运营模型需要异常强的法律、数据治理和国家运营纪律。
