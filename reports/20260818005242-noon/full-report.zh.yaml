      - number: '1.2'
        title: 领导层、融资与治理姿态
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开领导层事实是，Mohamed Alabbar 创立了 Noon，Faraz Khalid 曾作为 Namshi 联合创始人被外界熟知，并被公开宣布担任 CEO。这一组合有战略意义：Alabbar
              锚定海湾地区的资本通道和政治信用，Khalid 则代表区域电商运营经验。下行面在于，相比公开市场同业，甚至一些披露更好的后期私营公司，Noon
              更广泛的董事会和高管梯队在公开证据中仍不透明。融资披露同样只给方向，无法完全对账。Semafor 报道称，业务推进 IPO 时，Public Investment Fund 和 Alabbar 在 2025
              年末领投了新一轮 $500 million 融资；Gulf News 则报道累计融资约 $2.7 billion、估值接近 $10 billion。Tracxn
              补充了投资者和收购线索，但这些来源合在一起，仍无法解释准确持股比例、董事会权利、清算条款，或已报道融资历史中有多少是新股资本、战略支持，还是老股流转。
