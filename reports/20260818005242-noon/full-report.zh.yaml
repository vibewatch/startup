      - number: '1.3'
        title: 规模信号与战略位置
        blocks:
          - type: paragraph
            body: >-
              Noon 的规模最好通过间接证据确认，而不是经审计的公司报告。消费者端，Google Play 称该 App 在中东获得超过 50 million 用户信任；Apple 的 App Store 显示约
              760,000 条评价给出 4.6 评分，并描述了一个集购物、餐饮和生鲜杂货于一体的 App，覆盖 10,000 多家餐厅和 100 多个菜系。商户端，Noon Payments 称其已服务 MENA
              大范围内的企业，并支持网关、链接、品牌支付页、循环订阅、QR 流程、发票和 API 集成，使它不只是一个结账组件。独立第三方背景也重要：U.S. International Trade
              Administration 将 Noon 列为沙特阿拉伯占主导地位的本土电商平台之一；Redseer 称 Talabat 和 Noon 似乎共同领跑阿联酋即时零售，并把 Noon Minutes 归入 GCC
              即时零售的前置仓或微型履约分支。这些都是有意义的规模信号，但仍未披露收入质量、贡献利润率、队列留存或逐国市场份额。
