      - number: '2.3'
        title: 买方分群偏向频次、紧急性和多垂直 App 习惯形成
        blocks:
          - type: paragraph
            body: >-
              Noon 市场中最强的需求模式不是按月计划囤货，而是城市家庭在重视便利、选择和缺货快速补位时产生的反复补货行为。Mordor 数据称，生鲜杂货和日用品约占 GCC 与沙特即时零售组合的 53%；主流配送承诺落在
              11 至 30 分钟区间，而不是极端的 10 分钟以内。官方竞争对手页面印证了这个行为框架。Talabat、HungerStation、Carrefour 和 Amazon
              都在营销生鲜杂货、餐饮、药品、鲜花、便利品或快速配送宽度的组合，这意味着客户正在被训练成期待同一个 App 提供多垂直功能。Noon 自身界面也符合这个模式：Noon Minutes 主打 15
              分钟紧急性，App Store 列出 10,000 多家餐厅和 100 多个菜系，Jahez 文件显示区域 App
              越来越多地在生鲜杂货、即时零售和餐饮之间合作或汇合。因此，市场奖励的不是只能带来一次性折扣订单的经营者，而是能把获客转成反复、跨品类使用的经营者。
