companyProfile:
  summary: >-
    Noon is a Dubai-headquartered commerce platform built to be a Gulf-native
    alternative to global ecommerce incumbents. Public evidence shows a
    business that now spans marketplace retail, grocery and quick commerce
    through Noon Minutes, food ordering, seller operations, and merchant
    payments. That breadth matters because Noon is no longer just a storefront;
    it is trying to own a larger share of the region’s demand, fulfillment,
    loyalty, and checkout stack. The strongest parts of the public record are
    customer reach, multi-country deployment, and continuing sponsor support
    from PIF and founder Mohamed Alabbar. The weakest parts are the ones that
    matter most for underwriting the current private price: audited revenue,
    segment economics, retention, and financing terms. Noon looks strategically
    important, but it still looks under-disclosed for a company being valued
    around $10 billion.
  foundedDate: '2016-01-01'
  founders:
    - name: Mohamed Alabbar
      role: Founder
      background: >-
        Founder of Noon and the company’s central public sponsor figure, with
        continuing influence through both strategy and funding support.
      claimRefs: [CO002, CR035]
  foundingLocation: Dubai, UAE
  headquarters: Dubai, UAE
  productSummary: >-
    Noon combines a regional ecommerce marketplace, quick-commerce and grocery
    delivery, food ordering, a delivery-linked membership product, seller
    tooling, and a merchant-payments platform.
  customerFocus: >-
    GCC and Egypt consumers, marketplace sellers, and merchants that need
    payment collection and localized commerce infrastructure.
  businessModel: >-
    Revenue appears to come from a mix of marketplace commissions, direct
    retail and delivery economics, membership, and merchant-payments services,
    though the public segment mix remains undisclosed.
  stage: late-stage private
  fundingStatus: >-
    Received a reported $500 million round in late 2025 from PIF and Mohamed
    Alabbar at an implied valuation near $10 billion.
  disclosureProfile: private-undisclosed
  claimRefs: [CO005, CO012, CV001, CV002, CV003, CV005]
