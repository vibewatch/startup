    - Sustained improvement in independent service-quality and retention evidence
  - - 'Counter-case: current valuation already prices in substantial future execution without public proof'
    - A materially lower entry valuation or materially stronger disclosure would reduce the opacity discount
  notes: The table distinguishes why Noon is strategically interesting from why investors still should not pay any price for that interest.
