- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Down-round or flat round without improved disclosure
    - Any financing at or below current implied valuation before public evidence improves
    - Invalidates confidence that current mark is durable
    - Avoid price-following and re-underwrite from new mark
  - - Payments / privacy regulatory event
    - Material enforcement action, license issue, or transfer-rule breach
    - Damages payments optionality and raises legal discount
    - Pause diligence until architecture is verified
  - - Service-quality deterioration
    - Complaint trends worsen and seller-health penalties intensify
    - Weakens customer-durability and retention assumptions
    - Increase opacity discount and re-cut scenario range lower
  - - Quick-commerce margin failure
    - No clear route to healthier economics as subsidy tolerance tightens
    - Undermines optionality value in Minutes and convenience commerce
    - Strip premium for q-commerce growth narrative
  - - IPO delay with no disclosure upgrade
    - Exit window slips while financial visibility remains poor
    - Turns strategic relevance into trapped-paper risk
    - Prefer track / wait instead of aggressive follow-on
  notes: These triggers identify the events most likely to change the valuation call quickly, even if broad strategic interest in Noon remains intact.
  claimRefs:
  - CV038
  - CV039
  - CV040
  - CV014
  - CV036
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited financials
    - Revenue, gross margin, EBITDA, cash burn, and segment mix
    - Essential for any valuation method with real confidence
    - Request audited entity statements and management bridge
  - - Customer durability
    - Buyer cohorts, Noon One renewal, seller churn, merchant churn, NRR
    - Separates scale from valuable recurring behavior
    - Request cohort pack by country and product line
  - - Quick-commerce unit economics
    - Contribution margin, order density, subsidy intensity, basket economics
    - Key to valuing Minutes as option value or margin drag
    - Request unit-economic deck and regulator-scenario planning
  - - Financing terms
    - Preference stack, liquidation rights, anti-dilution, debt or side letters
    - Private return math is impossible without capital-structure detail
    - Request latest term sheet and cap-table summary
  - - Governance and exit plan
    - Board composition, committees, audit readiness, IPO milestones
    - Determines whether Noon can grow into public-market scrutiny
    - Request governance pack and listing-readiness roadmap
  notes: These are the highest-leverage diligence asks because they would directly move recommendation, confidence, and valuation stance rather than merely add narrative color.
  claimRefs:
