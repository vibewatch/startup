- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Jahez
    - 2025 revenue SAR 2,323.6M; listed KSA delivery / commerce peer
    - Market cap about $0.61B (Aug 2026)
    - Closest publicly disclosed GCC-adjacent comp with local-market relevance
    - Category mix and business model are not identical to Noon
  - - Jumia
    - 70,000+ sellers across 8 countries; listed emerging-market ecommerce platform
    - Market cap about $0.78B (Aug 2026)
    - Useful disclosure and marketplace benchmark for emerging-market ecommerce
    - Africa exposure and operating history differ from GCC dynamics
  - - Delivery Hero
    - Global public delivery-commerce operator with audited annual statements
    - Market cap about $13.19B (Aug 2026)
    - Upper-end scale reference for food and delivery platform value
    - Far larger disclosed scale and different geographic mix
  - - Coupang
    - Q1 2026 revenue about $8.5B; public ecommerce operating system
    - Market cap about $28.21B (Aug 2026)
    - Shows what very large disclosed ecommerce scale can command publicly
    - Scale and disclosure depth are far beyond Noon’s public record
  - - Noon (implied)
    - Private multi-vertical GCC commerce platform
    - Media-reported valuation about $10B after late-2025 round
    - Shows current private market ask investors are being offered
    - No public audited revenue, margin, or cap-table detail
  notes: The table is designed to anchor valuation discipline, not to claim these businesses are directly comparable on a one-for-one multiple basis.
  enumerationScope:
    coverage: partial
    basis: Includes the most decision-useful public comparables reviewed for Noon’s business model and region, but not every global ecommerce or delivery peer.
