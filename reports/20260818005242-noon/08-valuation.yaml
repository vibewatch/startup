- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Noon proves strong revenue scale, improved service quality, and clearer profitability path while preserving GCC leadership
    - ~$10B to $12B could hold or improve if IPO-grade disclosure and margins emerge
    - Execution misses or regulatory setbacks break the case quickly
    - Possible but needs evidence that is still absent publicly
  - - Base
    - Noon remains strategically important, but better disclosure still lags and public market comps anchor discipline
    - ~$6B to $8B range more defensible than current mark under opacity discount
    - Capital remains available but price-following enthusiasm cools
    - Most consistent with current public evidence
  - - Bear
    - Customer-service drag, quick-commerce margin pressure, Egypt risk, or financing repricing hit before stronger disclosure arrives
    - ~$3B to $5B reset possible in a harder funding or IPO environment
    - Down-round, regulatory event, or worsening complaint trend
    - Not the central case, but clearly plausible
  notes: Scenario ranges are judgment-based public-evidence envelopes rather than outputs of a complete DCF or revenue-multiple model, because Noon withholds key inputs.
