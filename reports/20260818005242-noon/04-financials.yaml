  - FI001
- id: traction-proxies-and-public-comparables
  title: Traction proxies are strong; direct economics are mostly absent
  body: The reviewed public evidence supports the idea that Noon has real commercial activity, but only through proxies. Apple’s App Store lists strong ratings at material scale and indicates restaurant breadth above 10,000, while Google Play cites more than 50 million users across the Middle East. Tracxn contributes a very large employee estimate, further implying operational scope. None of those proxies, however, reveal the GMV-to-revenue conversion that investors actually need. For that, the cleanest public benchmark is Jahez, whose FY2025 and Q1 2026 filings show how a Saudi multi-vertical platform can translate GMV into revenue while staying EBITDA-positive despite promotional pressure. Jahez is not a perfect analogue to Noon’s broader cross-country model, but it is a useful signal that high-competition Gulf commerce can produce real operating leverage. The practical conclusion is that public traction is credible, while direct monetization and margin data for Noon itself remain largely
    unavailable.
  claimRefs:
  - CI010
  - CI011
  - CI014
  - CI015
