- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Country-level GMV and revenue mix
    - Blocks market-to-model conversion
    - Request Saudi / UAE / Egypt GMV, revenue, and contribution margin split
  - - Vertical mix across marketplace, food, quick commerce, membership, and payments
    - Obscures revenue quality and durability
    - Request segment P&L and share of total revenue
  - - Gross margin and contribution margin bridge
    - Prevents evaluation of logistics and promo intensity
    - Request order-level or vertical-level gross margin waterfall
  - - Cash, burn, runway, and debt
    - Blocks capital-adequacy judgment
    - Request treasury snapshot, debt schedule, and 12-month operating plan
  - - Take rate, payment yield, and ad monetization
    - Blocks monetization-quality analysis
    - Request merchant rate cards and realized monetization by product
  - - Retention / cohort economics
    - Blocks CAC payback and LTVCAC view
    - Request buyer and merchant cohorts with promo-adjusted repeat behavior
  notes: The biggest risk is not absence of activity but absence of finance-grade disclosure.
