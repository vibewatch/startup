- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Payments / BNPL compliance
    - Licensing or regulator action
    - Any suspension, enforcement notice, or partner-structure failure in UAE or Saudi
    - Pause underwriting until legal architecture is re-validated
  - - Service-quality deterioration
    - Complaint volume, refund cycle, or seller-health stress
    - Evidence of worsening review trends or rising deactivation / low-visibility incidents
    - Treat as thesis-break on customer durability until operational data is reviewed
  - - Quick-commerce unit economics
    - Subsidy or discount dependence persists
    - No credible path to positive contribution margin for Minutes despite regulatory tightening
    - Lower valuation tolerance and require segment-level unit economics
  - - Egypt macro spillover
    - Inflation / FX / external pressure worsens materially
    - Consumer demand and import costs deteriorate beyond management plan
    - Increase country-risk haircut and request contingency plan
  - - Capital dependency
    - New financing needed before public disclosure improves
    - Follow-on round or liquidity event occurs without better revenue and margin visibility
    - Assume down-round or dilution risk and avoid price-following
  notes: These kill criteria convert public-evidence risk into monitorable triggers an investor can track between rounds or before IPO preparation.
