      - number: '3.4'
        title: Adverse evidence says Noon is relevant, but not yet unassailable
        blocks:
          - type: paragraph
            body: >-
              Third-party evidence supports both Noon’s relevance and its vulnerability. Redseer puts Noon alongside
              Talabat at the front of UAE quick retail, which is strong evidence that Noon has earned genuine local
              convenience relevance. Yet the same regional analysis also shows Saudi food delivery concentrated among
              top players and moving through a regulatory normalization cycle intended to curb the most aggressive
              subsidy tactics. That makes execution quality more important and could favor scaled operators with better
              discipline. Trustpilot adds another caution flag by surfacing delivery, refund, and alleged-counterfeit
              complaints that can push buyers toward cleaner specialist or incumbent alternatives. Jahez’s partnership
              with Noon is strategically interesting for the same reason: it suggests Noon has enough strategic value to
              integrate with a rival ecosystem, but also that category ownership in Saudi food and convenience is not
              fully settled in Noon’s favor. Merchant-acquisition pressure from Amazon seller programs and Deliveroo
              partner tooling reinforces how contested supply remains. The core read-through is that Noon is
              competitively important, but advantage durability is still open rather than proven.
