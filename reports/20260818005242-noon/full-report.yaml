              descriptions show at least five meaningful customer groups: general retail shoppers, urgent convenience
              buyers using Noon Minutes, restaurant-ordering users, Noon One members who pay for delivery-linked
              convenience, and sellers or merchants that use Noon’s operating or payments stack. That breadth matters
