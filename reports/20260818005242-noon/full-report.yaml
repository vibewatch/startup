      - number: '8.4'
        title: >-
          Exit readiness is still limited, so the most valuable work now is focused diligence rather than narrative
          extrapolation
        blocks:
          - type: paragraph
            body: >-
              Noon could become an IPO-scale regional champion, but that possibility is not the same thing as IPO
              readiness today. Public investors and late-stage private investors still need audited revenue and margin
              evidence, cohort durability, segment mix, and financing-term clarity before they can defend a premium
              outcome with confidence. This is also why target return math cannot be handled responsibly from public
              data alone. Without an audited operating baseline or a view into the preference stack, precise return
              projections would create false precision. The right next step is therefore not more storytelling; it is a
              narrower final diligence package aimed directly at the variables that would move the price. If management
              can close those evidence gaps, the recommendation can improve. If a new round or regulatory setback
              arrives before better disclosure, then the thesis-break triggers become active quickly and the valuation
              case weakens further. Put differently, more diligence here is not bureaucratic overhead; it is the only
              responsible way to turn a narrative mark into an underwritable investment view.
            claimRefs:
