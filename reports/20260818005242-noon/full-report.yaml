  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: The product stack covers several user jobs inside one commerce system
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to understand Noon’s product is by the jobs it solves. For consumers, Noon offers a broad
              marketplace, urgent top-up delivery through Noon Minutes, restaurant ordering, and membership-led
              convenience benefits. For sellers, it offers onboarding, catalog management, fulfilment choices, and a
              localized operating hub. For merchants on the payments side, Noon offers gateway processing and merchant
              tools such as links, pages, subscriptions, installments, and app management. This breadth matters because
              it means Noon is not just a storefront; it is a layered operating model with several modules that feed one
              another. The consumer app attracts demand, sellers and merchants provide inventory or acceptance,
              fulfilment makes speed credible, and payments close the loop. Public evidence does not prove that every
              module is equally strong, but it does show that the stack exists across several distinct workflows and
              geographies. Comparable Gulf apps now train users to expect this kind of bundled experience.
