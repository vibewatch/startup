      - number: '1.3'
        title: Scale signals and strategic position
        blocks:
          - type: paragraph
            body: >-
              Noon’s scale is best evidenced indirectly rather than through audited company reporting. On the consumer
              side, Google Play says the app is trusted by more than 50 million users across the Middle East, while
              Apple’s App Store shows a 4.6 rating from roughly 760,000 reviews and describes a combined shopping, food,
              and grocery app with more than 10,000 restaurants and 100-plus cuisines. On the merchant side, Noon
              Payments says it already serves businesses across a wide MENA footprint and supports gateways, links,
              branded payment pages, recurring subscriptions, QR flows, invoices, and API integrations, making it more
              than a checkout widget. Independent third-party context also matters: the U.S. International Trade
              Administration names Noon among Saudi Arabia’s dominant local e-commerce platforms, and Redseer says
              Talabat and Noon appear to share the UAE quick-retail lead while classifying Noon Minutes inside the
              dark-store or micro-fulfillment wing of GCC q-commerce. These are meaningful scale signals, but they still
              stop short of disclosing revenue quality, contribution margin, cohort retention, or country-by-country
              market share.
