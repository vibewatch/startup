    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, regional footprint, and product scope
        blocks:
          - type: paragraph
            body: >-
              Noon’s public consumer surface is large enough to qualify as a regional platform rather than a
              single-country online retailer. The company runs dedicated storefronts for the UAE, Saudi Arabia, and
              Egypt, each under the same Noon brand, and the UAE storefront alone shows a broad category mix that
              includes electronics, fashion, beauty, home, baby, sports, pet, and grocery. Public app-store descriptions
              extend that footprint beyond a catalog marketplace into food delivery, grocery, and fast-delivery
              convenience. In practice, Noon now looks like a Gulf consumer super-app with multiple monetization layers
              rather than only a horizontal e-commerce site. The Noon One membership page adds a subscription layer
              built around free delivery and exclusive deals, while the Noon delivery store page emphasizes flexible
              returns, secure payments, and city-level speed promises. The evidence is consistent on geography and
              category breadth, but far less precise on legal entity boundaries, active-customer counts by country, or
              the revenue contribution of each vertical.
