  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: The revenue model is broad, but the revenue mix is still opaque
        blocks:
          - type: paragraph
            body: >-
              Noon’s financial story starts with breadth. Public seller-facing pages show a marketplace in which
              merchants manage listings, inventory, pricing, orders, settlements, and payouts, which is enough to
              support marketplace commissions and adjacent merchant services. The same seller surfaces reference ads and
              insights, indicating an additional sponsored-visibility or merchant-acquisition monetization layer. On top
              of that, Noon Payments markets gateway processing, links, pages, subscriptions, invoices, QR flows, and
              installment support, expanding Noon’s potential revenue base beyond buyer-side commerce alone. Noon One
              adds a membership layer, while Noon Minutes and food delivery likely add delivery-fee or
              convenience-driven monetization even if public fee terms are missing. The problem is that the public
              evidence does not disclose how much of total revenue comes from each stream or how much is gross versus
              net. That means the monetization architecture is visible, but the revenue-quality mix is not.
