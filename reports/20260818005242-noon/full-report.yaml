      - number: '2.2'
        title: Sizing lenses point to Saudi Arabia as the center of gravity
        blocks:
          - type: paragraph
            body: >-
              Saudi Arabia is the most important geography in the public evidence because it combines the largest
              digital-infrastructure base with the deepest quick-commerce demand. Trade.gov describes the Kingdom’s ICT
              market as nearly $48 billion, with 99 percent internet penetration, 218 Mbps average mobile speeds, and
              e-commerce revenues projected to reach $24.7 billion by 2027. GASTAT reinforces that backdrop by showing
              the digital economy at 16.0 percent of GDP and rising e-commerce business registrations. Analyst estimates
              then narrow the convenience layer. Mordor places GCC quick commerce at $4.59 billion in 2026 and Saudi
              Arabia alone at $2.38 billion, while also attributing 54.76 percent of 2025 GCC demand to Saudi Arabia.
              IMARC’s lower 2025 GCC base of $2.7 billion but much steeper long-term curve is not a contradiction in
              direction so much as a reminder that boundary and methodology choices materially change the headline
              number. The dependable conclusion is not a single precise TAM, but that Saudi Arabia is the region’s
              monetization anchor and the most important market for Noon’s incremental share gains.
