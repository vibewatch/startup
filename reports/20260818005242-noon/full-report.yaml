  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and why Noon’s true arena is narrower than generic e-commerce TAMs
        blocks:
          - type: paragraph
            body: >-
              The first analytical trap in Noon’s market chapter is to call the entire GCC e-commerce sector the
              company’s TAM and stop there. That overstates what Noon can practically monetize with its current product
              shape. Noon clearly participates in several connected layers: marketplace retail, urgent grocery and
              convenience, restaurant delivery, and merchant-side payments enablement. Those layers share a buyer
              relationship, app surface, logistics footprint, and payment completion loop, so they belong in the
              served-market discussion. At the same time, large digitally influenced categories such as offline retail,
              wholesale procurement, travel, and unrelated financial services should remain outside the core market
              boundary because Noon’s current public product surface does not prove durable participation there. The
              right frame is therefore urban GCC convenience commerce with attached payments and catalog breadth, not
              all retail spend across MENA. That narrower framing explains why quick-commerce, food-delivery, and
              payments evidence matters disproportionately for valuation despite Noon’s broader consumer storefronts.
            claimRefs:
              - CM001
              - CM002
              - CM028
              - CM029
              - CM030
