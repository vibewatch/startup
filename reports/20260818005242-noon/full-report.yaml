        title: Milestones, regulatory context, and immediate constraints
        blocks:
          - type: paragraph
            body: >-
              The milestone record that can be established publicly is coherent even if it is not exhaustive. Noon’s
              path begins with 2016 founding and 2017 launch, followed by PIF-backed scale-up, acquisitions such as
              Namshi and SIVVI, expansion into additional service layers such as payments and fast delivery, and then
              the late-2025 financing tied to potential IPO preparation. The surrounding market context is supportive:
              Saudi Arabia’s ICT market is near $48 billion, internet penetration is reported at 99%, and GASTAT says
              the digital economy reached 16.0% of GDP in 2024 with e-commerce registrations still rising. At the same
              time, the public record also contains non-trivial constraint signals. Saudi e-commerce law imposes clear
              consumer-protection duties and fines, and Trustpilot captures recurring complaints around delivery,
              refunds, and allegedly fake goods. The overall takeaway is that Noon has established real regional
              relevance, but operational quality, governance disclosure, and financial transparency still lag the scale
              implied by its current valuation narrative.
