  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulation is not abstract for Noon; it touches data, payments, products, staffing, and content
        blocks:
          - type: paragraph
            body: >-
              Saudi Arabia is strategically attractive for Noon, but it is also the jurisdiction where the compliance
              stack is thickest. Trade.gov describes a market still marked by regulatory unpredictability, localization
              requirements, and evolving implementation. For a multi-sided commerce platform, those pressures hit
              several layers at once: product conformity and counterfeit control for marketplace inventory, privacy and
              cross-border transfer controls for customer data, staffing and local-content expectations for operations,
              and payments or BNPL rules for checkout products. Legal guides reinforce that PDPL is broad and creates
              real controller duties. BNPL or installment-linked products face formal central-bank oversight in both the
              UAE and Saudi Arabia. None of this makes Noon uninvestable, but it does mean the company’s operating model
              needs unusually strong legal, data-governance, and country-operations discipline for its stage and claimed
              value.
