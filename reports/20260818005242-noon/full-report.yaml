      - number: '3.2'
        title: Capability breadth is real, but list pricing and realized economics stay opaque
        blocks:
          - type: paragraph
            body: >-
              The strongest visible advantage Noon has over food-only or catalog-only rivals is breadth. Public sources
              show marketplace assortment, quick commerce, food delivery, and merchant payments all inside the Noon
              stack. That is broader than Talabat or HungerStation on merchant payments, broader than Tabby or Tamara on
              commerce utility, and broader than Namshi on category scope. But breadth alone does not settle the
              comparison because specialists are often stronger within their own jobs. Amazon and Carrefour signal
              reliability and grocery depth, Talabat and HungerStation signal local-frequency habits and offers, Namshi
              signals authenticity and returns confidence, and BNPL leaders signal conversion trust. Public pricing data
              is also thin: installment terms, delivery-speed promises, and membership surfaces are visible, but
              commission rates, realized delivery subsidies, and merchant economics are mostly not. Merchant-acquisition
              power also matters: Amazon seller incentives, Deliveroo merchant tools, and Tabby Business conversion
              claims all show rivals fighting aggressively for supply as well as demand. The result is that capability
              comparison is possible, whereas true pricing-power comparison still depends on private diligence.
