      - number: '3.3'
        title: Switching costs look low, so retention tooling and ecosystem habit matter most
        blocks:
          - type: paragraph
            body: >-
              Nothing in the public evidence suggests that Noon benefits from hard lock-in. Consumers can move across
              Amazon, Talabat, HungerStation, Carrefour, Temu, or SHEIN with a few taps, and each app emphasizes its own
              discount, delivery, or category hooks. Merchant-side multi-homing also looks plausible because partner
              pages from Talabat and Deliveroo openly sell customer reach and because marketplaces generally depend on
              broad seller availability rather than exclusive distribution. This puts enormous weight on frequency loops
              such as quick commerce, food, and loyalty tools. HPlus, coupon ecosystems, cashback, delivery memberships,
              and trusted payment plans all serve the same retention goal: keep the user inside the app for the next
              order. Noon’s moat therefore looks more like a repeated-habit system than a technology lock. That can
              work, but it is inherently vulnerable to execution slippage on trust, fulfillment quality, and category
              leadership in any one important mission.
