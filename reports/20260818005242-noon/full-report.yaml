      - number: '8.3'
        title: Comparables support a wide range, but most plausible public-evidence scenarios land below today’s mark
        blocks:
          - type: paragraph
            body: >-
              Comparable work is informative even when it cannot produce a precise multiple. Jahez and Jumia show how
              low public market caps can stay for listed regional or emerging-market ecommerce operators even when they
              have meaningful operations and, in Jahez’s case, real revenue disclosure. Delivery Hero and Coupang show
              the other end of the range: large public operators can justify much bigger market caps, but they also
              provide much deeper scale and financial disclosure than Noon currently does. This leaves Noon in an
              awkward middle ground. It is clearly more strategically important than a small speculative platform, yet
              the current mark already pulls it closer to very large global operators than to smaller public peers. That
              is why the base case should assume a valuation below the current private mark unless Noon proves stronger
              economics and disclosure than public evidence currently supports. The bull case requires real IPO-grade
              proof; the bear case requires much less to go wrong.
            claimRefs:
