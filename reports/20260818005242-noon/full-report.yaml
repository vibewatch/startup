      - number: '4.3'
        title: Fulfilment choices imply real logistics, working-capital, and promo-risk exposure
        blocks:
          - type: paragraph
            body: >-
              The most visible cost-structure clue is Noon’s fulfilment design. Fulfilled by noon clearly requires
              warehousing, inbound shipping, storage, removals, and return processing, while Fulfilled by Partner shifts
              more of that burden back to merchants. That points to a hybrid model in which Noon can trade higher
              service control and faster delivery for higher logistics and reverse-logistics cost exposure. Quick
              commerce and food probably intensify that cost burden further because they rely on dense fulfilment and
              rapid last mile. Redseer’s warning on subsidy-led scale matters here: if free delivery and cashback helped
              build category demand, reported activity could be less profitable than it looks. Merchant-side economics
              are also under pressure from rival seller programs and checkout platforms. Amazon is visibly offering fee
              discounts and ad credits to attract sellers, while Tabby Business claims strong merchant conversion
              benefits. The result is a model that likely carries meaningful logistics and merchant-acquisition cost,
              even though the public record does not disclose the actual gross-margin bridge. That missing bridge is
              exactly why margin underwriting remains provisional.
