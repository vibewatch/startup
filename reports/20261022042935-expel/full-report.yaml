  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and category
        blocks:
          - type: paragraph
            body: >-
              The relevant market is managed security operations sold as a recurring service: a provider ingests
              telemetry from a customer's existing endpoint, identity, email, cloud, network, and SIEM tools,
              investigates alerts, and helps contain validated threats. This boundary includes traditional MDR,
              co-managed SOC coverage, and the expanding MXDR layer when the provider reaches beyond endpoint telemetry.
              It excludes standalone endpoint software, a customer's underlying SIEM license, one-off incident-response
              retainers, and a fully internal SOC except as the status-quo substitute. Expel's own packages describe
              24x7 SOC coverage, Workbench access, investigation and response, automation, and transparent reporting,
              while a competitor comparison describes the alternative model as bundling a SIEM and SOC rather than
              monitoring the customer's existing stack. The category remains difficult to label: Expel's market
              discussion says MDR, AI SOC, co-managed SOC, platform, and hybrid labels overlap, so category growth
              should not be treated as a single homogeneous spend pool.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and market momentum
        blocks:
          - type: paragraph
            body: >-
              Available sources support momentum, not a defensible company-specific TAM/SAM/SOM. A competitor-authored
              2026 market mapping reports that MDR grew nearly 49% year over year from 2020 to 2021 and repeats a
              projection that half of organizations would use MDR services by 2025; those figures are historical or
              forecast measures and are not a 2026 market-dollar estimate. The same source describes the category
              broadening into cloud, identity, network, OT, MXDR, CTEM, and agentic AI. Expel's market discussion says
              more than 40 AI SOC companies were already in the category and that customers are deciding among MDR, AI
              SOC, co-managed, and internal-build models. Independent but non-comparable proxies place Expel at 2.5% of
              PeerSpot MDR engagement and 7.61% valid recommendation coverage in Citeworks Studio's October 2026 AI
              benchmark. These are useful demand and boundary signals, but the sources use different populations and
              denominators. The evidence-constrained conclusion is therefore that the addressable category is
              established and expanding, while a reliable dollar TAM, Expel-fit SAM, and attainable SOM remain open
              diligence items.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM011
              - CM015
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: Buyers, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >-
              The primary buyer is a commercial mid-market or enterprise security organization that already owns a
              substantial security stack but cannot staff continuous triage, investigation, and response. The CISO or
              security operations leader is the operational sponsor; the CFO or finance leader increasingly controls
              budget approval and wants measurable cost avoidance or risk reduction. Users are internal analysts and
              incident responders, while the payer is the security budget owner purchasing a recurring service. Adoption
              can be relatively low-friction when the customer keeps its tools and connects through APIs: Expel's
              package page says most customers reach operational coverage within two to four weeks, and its market page
              describes 160+ integrations. The main constraints are existing-stack quality, integration complexity,
              trust in automated decisions, procurement and compliance review, and the continuing cost of the customer's
              SIEM. A mid-market in-house SOC is described as costing approximately $2-$5 million or more annually, but
              that is a company-published benchmark rather than an independent market average. Finance/security metric
              misalignment is a separate adoption friction: CFO Dive reports that 40% of surveyed finance leaders said
              quantified risk reduction would make a spending increase easier to justify.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Market judgment and unresolved sizing
        blocks:
          - type: paragraph
            body: >-
              Expel's market position is strongest where a buyer wants a vendor-agnostic managed layer over tools it
              already owns, transparent analyst work, and human-led operations augmented by automation. The opportunity
              is supported by persistent cyber risk, expanding attack surfaces, and demand for coverage that can operate
              continuously; the World Economic Forum's 2026 report ranks cyber insecurity among the major near-term
              global risks. The countercase is that the market is crowded, labels are unsettled, AI SOC entrants are
              multiplying, and a buyer may instead consolidate onto an incumbent platform, build internally, or choose a
              provider that bundles the SIEM and operating stack. No retained source isolates Expel's market share,
              serviceable spend, win rate, price realization, or conversion from the broad category into Expel's target
              segment. Those gaps prevent a quantitative valuation bridge from market size to company revenue and should
              be closed with internal pipeline, ACV, win/loss, retention, and segment-level budget data.
            claimRefs:
              - CM008
              - CM011
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Established category, unsettled boundary
            body: >-
              MDR is a recognizable buying category, but current providers span human-led services, AI SOCs, co-managed
              models, and platformized MXDR. Expel's opportunity is therefore a defined service category with expanding
              adjacencies rather than a single clean market total.
            calloutType: insight
            claimRefs:
              - CM004
              - CM006
              - CM007
          - type: callout
            title: SAM and SOM remain unproven
            body: >-
              Public evidence does not provide a comparable market-dollar estimate, Expel's serviceable segment, share,
              or conversion assumptions. A valuation case should not translate category growth directly into Expel
              revenue.
            calloutType: risk
            claimRefs:
              - CM005
              - CM008
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer choice
        blocks:
          - type: paragraph
            body: >-
              Expel sits in a crowded MDR field rather than a protected category. The available evidence identifies
              Arctic Wolf, Red Canary, eSentire, Rapid7, Secureworks, ReliaQuest, Huntress, and CrowdStrike managed
              services as alternatives, while an internal SOC, a traditional MSSP, or point tools can also solve parts
              of the same job. Expel's model is deliberately different from a bundled security stack: it connects by API
              to tools the customer already owns and turns their signals into monitored investigations. That creates a
              credible fit for security-mature enterprises with heterogeneous tooling, but it leaves the buyer paying
              for the underlying SIEM and comparing Expel with both managed services and platform-native providers.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP008
              - CP013
              - CP015
              - CP016
