              - CP010
      - number: '3.2'
        title: Capability, packaging, and distribution trade-offs
        blocks:
          - type: paragraph
            body: >-
              Expel's practical advantage is operating transparency: Workbench exposes investigation history, analyst
              and bot actions, and API-accessible findings and remediation actions. TrustRadius user commentary supports
              accurate triage, few false positives, and effective auto-remediation, while Torq documents that the
              Workbench API can be orchestrated in bidirectional workflows. The trade-off is packaging. A competitor
              comparison says Expel's threat hunting and incident response are separate add-ons, and that its Managed
              SIEM scope is limited to Microsoft Sentinel and Splunk Enterprise Security. PeerSpot reports a stronger
              user-rating and mindshare position than the compared Adlumin product, but also highlights that the
              comparison is based on limited review counts; this is directional, not a market-share fact.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP012
              - CP014
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Expel's defensibility is more operational than proprietary: broad integrations, accumulated investigation
              workflows, customer-visible process, and analyst-plus-automation execution can compound with usage.
              Company-authored material cites a Forrester Leader position and an internal account of more than 100
              integrations, while YesPress describes the customer-facing Workbench experience and a 160-plus integration
              claim. These are useful signals but remain issuer-attributed. Independent evidence is less complete on
              realized pricing, retention, win rates, and switching costs. Forrester commentary reproduced by Expel also
              flags late channel development, larger competitor budgets, and a price premium. The resulting underwriting
              view is a differentiated service with a plausible workflow moat, but not an unassailable barrier against
              platform bundling, channel-led rivals, or internal build.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Workflow transparency is the clearest moat candidate
            body: >-
              Expel's differentiated buyer promise is not simply 24/7 monitoring; it is visible, API-accessible
              investigation work that lets customers inspect and orchestrate the service.
            calloutType: strength
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP010
          - type: callout
            title: Premium packaging raises substitution risk
            body: >-
              Separate hunting and incident-response add-ons, a stated price premium, and later channel development can
              make bundled or channel-led alternatives more attractive even when Expel wins on transparency.
            calloutType: risk
            claimRefs:
              - CP008
              - CP011
              - CP012
