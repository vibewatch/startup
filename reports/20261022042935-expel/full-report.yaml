              - CI002
              - CI005
              - CI013
      - number: '4.2'
        title: Sales efficiency and cost drivers
        blocks:
          - type: paragraph
            body: >-
              Expel sells into organizations that already own security tooling and need 24x7 investigation capacity,
              which can reduce rip-and-replace friction but leaves the company responsible for integrations, analysts,
              detection engineering, and response operations. Public materials describe 160+ integrations, direct API
              connections, human analysts, continuous rule tuning, and customer-facing transparency. A partner account
              of the Workbench API also shows that customers can automate investigations and remediation through
              bidirectional workflows. These are useful operating proxies, but none is a CAC, payback, gross-margin, or
              utilization disclosure. The cost base likely includes SOC labor, engineering, cloud and telemetry
              operations, partner/channel activity, and onboarding; that is an analytical framework, not a reported
              accounting breakdown. Diligence should reconcile bookings and implementation effort by package, customer
              segment, and channel.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI011
              - CI014
              - CI015
              - CI016
      - number: '4.3'
        title: Public traction and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Public evidence indicates commercial traction and a broad operating footprint, but the available pool does
              not provide a current cash balance, monthly burn, runway, debt schedule, or financing trigger. YesPress
              reports 500+ customers in an Expel overview and describes recurring enterprise service revenue, while
              Expel's own site reports customer outcome percentages and 145 reviews as of August 2026; these remain
              company-presented or company-attributed figures rather than audited financial statements. PeerSpot
              supplies an external demand signal, but its 9.0 average rating for Expel rests on only one review, so it
              cannot support a broad retention or willingness-to-pay conclusion. The latest retained financing context
              is background only and is not repeated as a current financial claim here. Capital adequacy is consequently
              a material unresolved underwriting question because service growth can require continued analyst hiring,
              engineering investment, and working capital even when customer demand is real.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial case is promising on revenue mechanism and customer value but not yet financeable from
              public evidence alone. Expel's service is differentiated by operating over existing tools, exposing
              investigations, and packaging managed detection with optional extensions; however, a competitor comparison
              says threat hunting and incident response can sit behind add-ons, while Expel's own Managed SIEM page
              describes a separate service for existing SIEM environments. A CFO Dive report shows buyers increasingly
              require quantified risk reduction and reports a survey of 136 cybersecurity leaders and 164 finance
              executives, reinforcing the need for measurable economic proof. The key diligence blockers are retention,
              realized pricing, gross margin, analyst productivity, customer concentration, cash and burn, debt, and the
              mix of recurring versus services revenue. Until those are obtained, the appropriate stance is
              research-more, not a precise valuation conclusion.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwrite the private metrics, not the package labels
            body: >-
              Expel has a credible recurring MDR mechanism and public operating proof, but the retained evidence does
              not establish ARR, gross margin, retention, cash, burn, or runway. Require cohort, contract, margin, and
              liquidity evidence before underwriting a price.
            calloutType: recommendation
            claimRefs:
              - CI001
              - CI009
              - CI014
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered service and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Expel sells an operating service rather than a replacement endpoint or SIEM product. The documented
              workflow connects to a customer's existing security tools, correlates and enriches signals, and routes the
              surviving cases to analysts for investigation and response. Expel's own service description says it
              monitors 160+ coverage areas and has built 2,450 proprietary detections, but that scale is
              company-reported rather than an independently audited coverage measure. The product's customer-facing
              differentiator is Workbench: a shared view of evidence, actions, reasoning, and recommended remediation,
              with collaboration features intended to keep the customer involved during an incident. An independent
              PeerSpot review describes rapid API-based setup, broad integrations, automated active response, and a
              short time to value, while also identifying a managed-SIEM gap. The practical product boundary is
              therefore clear: Expel operates above a customer's security stack and makes investigation legible, but a
              buyer may still need to procure and operate log storage or SIEM engineering separately. A January 2026 CFO
              Dive account of an Expel survey adds a buyer-side design constraint: 40% of 164 finance executives said
              quantified risk reduction would make a spending increase easier to justify. Product diligence should
              therefore connect technical workflow claims to measurable risk or cost outcomes rather than treating
              integration breadth as an outcome by itself.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE009
              - CE011
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE006
              - CE007
              - CE008
              - CE013
      - number: '5.2'
        title: Architecture, integrations, and automation
        blocks:
          - type: paragraph
            body: >-
              The public architecture is an agentless integration layer over customer-owned telemetry, with Workbench as
              the investigation and collaboration surface. Expel's technical material describes SIEM data as an
              investigation source and distinguishes detection engineering from the underlying log platform; it also
              says Managed SIEM addresses existing investments rather than requiring a new vendor. Torq's partner
              documentation shows that the Workbench API exposes alerts, investigations, findings, comments, and
              remediation actions, enabling deterministic playbooks and bidirectional updates. This is a meaningful
              integration surface, but it also creates dependency on API permissions, source-tool quality, customer data
              retention, and correct response guardrails. Expel's public SIEM article identifies detection engineering
              and analyst-led monitoring as the operational layer, while the PeerSpot comparison reports support for
              160+ integrations and describes Workbench transparency as a differentiator. These materials support the
              operating model, not an independent conclusion about latency, detection recall, uptime, or total cost.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE009
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE015
              - CE016
      - number: '5.3'
        title: Maturity, differentiation, and control gaps
        blocks:
          - type: paragraph
            body: >-
              Expel's differentiation is a combination of vendor-agnostic integration, visible analyst work, and
              automation constrained by human review rather than a standalone security data platform. YesPress reports
              that the Ruxie layer handles bounded enrichment and triage jobs while analysts retain consequential
              decisions; that is a more credible maturity signal than an unqualified claim of autonomous response, but
              it remains a company account carried by a secondary publication. The company has also positioned Managed
              SIEM around existing Sentinel and Splunk investments, which may help buyers with detection-engineering
              capacity but does not eliminate their platform and retention obligations. The independent reseller review
              is favorable on onboarding and support yet explicitly flags the absence of a managed SIEM as a limitation.
              Public evidence does not establish a complete security certification set, incident history, service-level
              performance, data residency, model-evaluation results, or customer-level detection outcomes. Those
              omissions matter because the product handles sensitive telemetry and can initiate remediation through
              integrated tools. The refresh-required help-center source confirms that Expel publicly labels a
              Vulnerability Prioritization documentation category, but the fetched page contains no substantive feature,
              maturity, or integration detail. It is therefore a product-surface signal only, not evidence that the
              module is production-ready or differentiated.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Legible managed operations
            body: >-
              Workbench's shared investigation history and broad integration model make Expel's managed service more
              inspectable than a conventional alert handoff.
            calloutType: strength
            claimRefs:
              - CE002
              - CE003
              - CE007
              - CE015
          - type: callout
            title: Platform dependency remains
            body: >-
              Public evidence supports detection engineering over an existing SIEM, but does not show that Expel
              replaces the customer's logging, retention, or data-governance obligations.
            calloutType: risk
            claimRefs:
              - CE005
              - CE011
              - CE012
          - type: callout
            title: Validate controls before deployment
            body: >-
              Diligence should test API permissions, tenant isolation, response approvals, data residency, service
              levels, and the boundary between managed detection and managed SIEM.
            calloutType: recommendation
            claimRefs:
              - CE006
              - CE010
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying motions
        blocks:
          - type: paragraph
            body: >-
              The evidence points to a two-sided customer motion: security-mature enterprises with existing tools use
              Expel as a transparent operating layer, while leaner teams use it to obtain continuous monitoring and
              specialist capacity they cannot staff internally. The named examples span financial technology, financial
              services, and a technology provider serving the exchange-traded-derivatives industry. FIA Tech selected
              Expel to monitor alerts from endpoint, SIEM, cloud, and network tools after expansion increased
              operational burden; its stated requirements included compatibility with Carbon Black, Sumo Logic,
              Microsoft, and AWS. Affirm similarly retained control of custom detections while Expel handled initial
              triage and escalated complex findings. This is evidence of integration-led adoption, not proof that every
              listed logo is a paying, production customer. Public materials also describe buyer value in terms of
              reduced manual review, faster response, and visibility into analyst actions, suggesting a purchase case
              built around capacity and accountability rather than replacement of the customer's security stack.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU007
      - number: '6.2'
        title: Adoption trajectory and measurable outcomes
        blocks:
          - type: paragraph
            body: >-
              Public customer proof is outcome-oriented but unevenly quantified. FIA Tech's case study says alerts
              became visible in hours, response time fell, and the customer saved an estimated 40 work hours per week
              previously spent sifting through alerts.       YesPress, citing AWS's Affirm case study, reports a 50%
              reduction in alerts requiring manual review and a 40% improvement in mean time to remediate, while AWS
              states that Expel handles day-to-day alert triage and escalates high-value complex findings. These are
              useful operating outcomes, but they are customer case-study claims with no disclosed baseline period,
              denominator, confidence interval, or independent audit in the supplied texts. Scale Venture Partners
              provides a second adoption pattern: it trialed the service, evaluated multiple EDRs, and used simulated
              attacks before continuing with 24x7 monitoring and Workbench. PeerSpot's October 2026 category page
              reports Expel at 2.5% MDR mindshare, up from 2.1% the prior year, and says 100% of its users were willing
              to recommend it; the page also shows only one review, so this is a directional platform signal rather than
              a representative retention or satisfaction survey.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU008
              - CU009
      - number: '6.3'
        title: Named proof, durability, and concentration limits
        blocks:
          - type: paragraph
            body: >-
              Named proof is strongest where a customer describes a concrete workflow and outcome. FIA Tech identifies
              its technology stack and quantified time saving; Affirm identifies AWS services, triage ownership,
              escalation boundaries, and custom-detection collaboration; Scale identifies trial validation and simulated
              attacks. A Torq partner article documents that Expel's Workbench API exposes investigations, findings,
              comments, and remediation actions for automation, supporting the durability of an integration surface but
              not customer retention. Expel's own platform page reports 75 customer NPS, 160+ integrations, and a
              14-minute MTTR for critical/high incidents with auto-remediation; these are company-reported operational
              or satisfaction metrics, not independently verified customer cohorts. A competitor comparison
              characterizes Expel as a credible fit for security-mature enterprises and flags that threat hunting and
              full incident response may be separately priced, which could create expansion friction or procurement
              complexity. No supplied source discloses NRR, GRR, logo churn, contract duration, top-customer share,
              customer count denominator, or revenue by segment; those remain material underwriting gaps.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU005
              - CU007
              - CU010
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU010
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Concrete named-use proof
            body: >-
              FIA Tech, Affirm, and Scale Venture Partners describe distinct deployments or validation steps rather than
              relying only on logo display.
            calloutType: strength
            claimRefs:
              - CU001
              - CU005
              - CU007
          - type: callout
            title: Retention remains unproven
            body: >-
              Public sources provide outcome anecdotes and directional review signals, but no cohort retention, churn,
              contract, or customer-concentration data.
            calloutType: risk
            claimRefs:
              - CU009
              - CU014
          - type: callout
            title: Request the customer cohort bridge
            body: >-
              Obtain current and prior-period customer counts, gross and net retention, logo churn, contract duration,
              expansion revenue, and top-10 customer concentration split by segment.
            calloutType: recommendation
            claimRefs:
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, regulatory, and disclosure exposure
        blocks:
          - type: paragraph
            body: >-
              Expel operates in a security service where customers retain accountability for coverage, response
              authority, data handling, and the performance of third-party tools. Public material reviewed for this
              chapter did not identify a specific Expel enforcement action or lawsuit, but the absence of a hit in the
              FTC's general cases directory is not proof that no regulator correspondence, contract dispute, privacy
              issue, or incident exists. The principal legal and regulatory risk is therefore disclosure and
              customer-control risk: an MDR provider can influence containment without replacing the customer's
              obligations, and the quality of evidence available to an investor is thinner than the quality of product
              marketing. Expel's public materials emphasize visibility into investigations, while the competitor
              comparison describes pre-approved actions through customer-owned APIs; these are mitigations, not
              independent proof of authorization design across every deployment. A diligence process should obtain
              current security attestations, data-processing terms, incident-notification history, customer contract
              allocation of liability, and a litigation/regulator search scoped to Expel and its legal entities.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operating, technical, and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              The operating model creates a trade-off between breadth and control. Expel's agentless,
              bring-your-own-technology approach can reduce migration friction, but it leaves the customer responsible
              for suitable licensed EDR, SIEM, cloud, identity, and other telemetry sources. Supporting more than 160
              integrations also creates a maintenance surface: API changes, data-model differences, detection coverage
              gaps, and inconsistent customer configurations can degrade outcomes even when the MDR provider's own
              workflow is sound. Public reporting describes human review of AI-assisted triage and customer-visible
              investigations, which is a meaningful control against opaque automation, but those controls do not
              establish service levels across every integration or prove that reported response times persist in each
              environment. Expel also claims 91% analyst retention, but that company figure is not independently
              verified in the assigned evidence. Partner and platform dependency is material because the service sits
              above customer-owned systems and works through their APIs; the failure mode is degraded visibility or
              delayed remediation rather than a simple product outage. Procurement should test integration coverage,
              staffing continuity, rollback and failover procedures, response authority, change management, and the
              treatment of unsupported or degraded telemetry.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR013
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR006
              - CR007
              - CR009
              - CR011
              - CR012
      - number: '7.3'
        title: Financial, customer, and thesis-break risks
        blocks:
          - type: paragraph
            body: >-
              Expel's public evidence supports an enterprise recurring-service model, but the risk underwriting is
              incomplete without private operating data. A comparison source describes custom-quoted annual contracts
              and continuing customer SIEM licensing, while a company-oriented overview reports more than 500 customers
              and 160-plus integrations; neither establishes recurring revenue quality, gross margin, renewal, logo
              churn, concentration, or cash runway. This creates financial-model risk: the company may carry labor and
              integration costs while customers retain other security spend, and premium positioning can face budget
              pressure when cyber spending is scrutinized. A Built In profile mentions workforce reductions, but the
              page explicitly warns that its insights are AI-generated and may not reflect verified company information;
              the headcount claims are therefore diligence leads, not established facts. The same evidence suggests that
              add-ons and partner routes can expand the offering, but it does not quantify attach rates or
              partner-sourced revenue. The investment thesis should break if retention deteriorates, integration
              coverage produces material missed detections, response authority is curtailed in practice, or undisclosed
              financing needs require a down round. Required diligence is current NRR/GRR and churn, gross margin by
              service, top-customer concentration, partner channel economics, cash and burn, workforce continuity,
              security incident history, and customer references that verify production outcomes rather than logos.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-priority thesis break
            body: >-
              The most material unresolved risk is not a documented public incident; it is the combination of incomplete
              private operating disclosure and a technically broad service that depends on customer-owned telemetry. A
              diligence decision should remain conditional until retention, margin, concentration, runway, and
              integration-control evidence are supplied.
            calloutType: risk
            claimRefs:
              - CR006
              - CR009
              - CR011
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is a differentiated operating model rather than a single feature. Paladin describes
              Expel combining security practitioners with Workbench, ingesting billions of events monthly and reporting
              a 23-minute critical-alert mean time to respond; a recent independent trade report also found that finance
              leaders want quantified risk reduction before increasing cybersecurity spend. A competitor comparison
              describes Expel as a credible fit for security-mature enterprises with 160-plus integrations, transparent
              analyst actions, and API-based onboarding. These signals support demand relevance and product
              differentiation, but they do not establish revenue quality or an investable entry price. The anti-thesis
              is that the same broad integration model leaves customers paying for their existing SIEM, while a
              competitor claims threat hunting and full incident response are add-ons. Those assertions are
              competitor-issued and require customer and contract verification.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV011
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV016
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Expel's financing history establishes venture backing but not today's equity value. The company announced
              a $7.5 million Series A in September 2016, led by Paladin with NEA, Battery, Greycroft, Lightbank, and
              other investors. YesPress reports that a $140.3 million Series E in 2021 valued Expel above $1 billion,
              but that historical mark is not a current financing price. Paladin later reported that Expel was among
              companies selected for Deloitte's 2024 Technology Fast 500 and said the awardees grew 270% to 379% over
              the prior three fiscal years, but the release does not isolate Expel's percentage. The assigned refresh
              evidence also shows why public-company metrics are context rather than a direct multiple: SentinelOne
              reported FY2026 revenue of $1,001.3 million, 22% growth, 74% GAAP gross margin, and $769.6 million of
              cash, while Zscaler's Red Canary modeling presents ARR and acquisition assumptions for a different
              public-company transaction. Neither source establishes Expel's revenue, ARR, margin, cash, or current
              purchase price. Entry discipline should therefore require a current cap table, latest preferred price,
              liquidation preferences, net retention, gross margin, and a bridge from contracted recurring revenue to
              cash generation before underwriting a premium.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV016
      - number: '8.3'
        title: Recommendation, scenarios, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              The evidence supports research-more rather than buy or avoid. Expel's newsroom shows active 2026 expansion
              into Managed SIEM, AI-focused capabilities, and partner programs; these are useful indicators of product
              breadth but remain company descriptions rather than audited adoption. PeerSpot reports a 2.5% MDR
              mindshare and a 9.0 average rating based on one review, which is directional and not a revenue or
              retention measure. The base case should assume continued relevance in MDR but no multiple expansion until
              private metrics are verified. The bull case requires evidence that integration breadth, automation, and
              enterprise demand convert into durable recurring growth with improving margins. The bear case is a
              down-round or impaired exit if SIEM economics, add-on pricing, customer concentration, or AI
              commercialization weaken. A thesis break is a materially lower renewal rate, a financing at a lower
              preferred price, or evidence that response capabilities commonly expected by buyers are outside the
              contracted base service.
            claimRefs:
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV011
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline dominates the call
            body: >-
              Expel merits continued diligence, not a buy recommendation, because the assigned evidence does not
              establish a current private valuation, recurring-revenue quality, margins, retention, runway, or
              preference stack.
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV015
              - CV016
          - type: callout
            title: The key adverse test is monetization
            body: >-
              The most decision-relevant downside work is to test whether broad integrations and visible operations
              produce durable renewals and margin, or instead leave customers carrying SIEM costs while advanced
              response capabilities remain add-ons.
            calloutType: risk
            claimRefs:
              - CV005
              - CV011
              - CV015
