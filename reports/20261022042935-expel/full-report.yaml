chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Expel is a Herndon, Virginia-headquartered managed detection and response provider founded in 2016 by Dave
              Merkel, Justin Bajko, and Yanek Korff. The company describes its service as monitoring, investigating, and
              remediating threats across a customer's existing security tools 24x7, with Workbench providing the
              operating record and human analysts retaining consequential judgment. The model is therefore an outsourced
              security-operations layer rather than a replacement endpoint, SIEM, firewall, or identity product. Expel's
              own current fact sheet says it connects through APIs and supports 160+ coverage options, while a
              competitor comparison independently describes the product as vendor-agnostic across 160+ integrations.
              That breadth is strategically useful for security-mature buyers with heterogeneous stacks, but it also
              creates an execution dependency on third-party APIs, data models, and customer-controlled systems. Public
              evidence supports the core identity and product model; it does not establish current contract mix, gross
              margin, retention, or customer concentration.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
