      - number: '1.4'
        title: Diligence judgment and open questions
        blocks:
          - type: paragraph
            body: >-
              The strongest verified conclusion is that Expel has a coherent identity, an experienced operating team, a
              differentiated transparency-oriented MDR workflow, and a channel model that extends reach without
              requiring customers to replace their security stack. The weakest part of the public record is financial
              and ownership visibility: valuation is historical, revenue and headcount are estimate-based, and current
