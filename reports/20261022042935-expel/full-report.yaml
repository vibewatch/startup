            title: Competitive underwriting remains evidence-limited
            body: >-
              Public assigned sources do not establish current realized pricing, retention, win rates, or switching
              costs, so durability should not be scored as proven market power.
            calloutType: assumption
            claimRefs:
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Expel's public monetization model is a recurring managed-service subscription rather than a self-serve
              software license. The strongest available pricing description says packages vary by coverage and that
              pricing scales with integrated technologies and telemetry volume, while the company's Managed SIEM surface
              emphasizes a bring-your-own-SIEM model and says it does not profit when customer data volume grows. This
              supports a qualitative view of recurring enterprise revenue, but it does not disclose contract values,
              realized price, renewal rates, services-versus-recurring mix, or accounting treatment. Official
              performance claims such as a 14-minute mean time to remediate and 160+ integrations describe service
              capability, not revenue or ARR. The financial model should therefore separate list/package architecture
              from recognized revenue and test whether add-ons, onboarding, and professional services create a material
              lower-quality component.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
