              but condition any valuation or liquidity conclusion on primary confirmation of the latest financing, cap
              table, recurring-revenue composition, retention, margins, concentration, cash, and debt. The absence of a
              recorded adverse incident in this pool is not evidence that no incident, dispute, or regulator
