              strategy officer, and Korff as chief operating officer. Their prior work at Mandiant, FireEye, AOL, and
              related security operations provides direct founder-market fit for an MDR service. This continuity is a
              strength, but it also means diligence should test succession depth and the portability of founder-specific
              customer and partner relationships. The public leadership page supplies detailed biographies, while the
              current pool does not supply a complete board roster, board rights, ownership table, or a verified record
              of leadership changes. Those omissions are material for a private-company underwriting decision, and the
              visible operating roster should not be mistaken for evidence of independent governance or a complete
