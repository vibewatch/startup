        - Multiple compression, down-round pressure, customer concentration, or add-on limits weaken monetization.
        - Avoid a premium price; require downside protection or wait for a financing reset.
        - Material; adverse competitor assertions and opacity make it plausible.
        - Lower preferred price, deteriorating renewals, margin pressure, or stalled commercialization.
    notes: >-
      Scenario labels are analyst decision cases, not reported forecasts; no numerical valuation range is fabricated
      because current Expel revenue, ARR, cash, and transaction terms are not publicly disclosed in the assigned pool.
    claimRefs:
      - CV005
      - CV007
      - CV008
      - CV009
