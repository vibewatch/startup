  evidenceGaps:
    - type: missing-source
      severity: material
      topic: diligence-gap
      missingEvidence: Current Expel and competitor price cards, renewal rates, win-loss data, logo churn, and switching-cost evidence.
      whyItMatters: Without comparable commercial and retention data, a workflow moat cannot be translated into durable share or pricing power.
      diligencePath: Request the latest competitive win-loss review, renewal cohort data, realized contract pricing, add-on attach rates, and customer references from management.
      relatedQuestionRefs: [QP008]
    - type: enumeration-incomplete
      severity: minor
      topic: competitor-profiles
      missingEvidence: A complete, current profile of every material MDR competitor's scale, funding, product scope, and target segment.
      whyItMatters: Assigned public evidence supports a directional landscape but not exhaustive competitor coverage.
      diligencePath: Build a named competitor list from management's pipeline and benchmark each provider using primary product, pricing, and customer evidence.
      relatedQuestionRefs: [QP001, QP003]
      relatedTableRefs: [TP001]
