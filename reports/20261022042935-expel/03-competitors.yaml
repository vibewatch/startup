callouts:
  - calloutType: strength
    title: Workflow transparency is the clearest moat candidate
    body: Expel's differentiated buyer promise is not simply 24/7 monitoring; it is visible, API-accessible investigation work that lets customers inspect and orchestrate the service.
    claimRefs: [CP005, CP006, CP007, CP010]
  - calloutType: risk
    title: Premium packaging raises substitution risk
    body: Separate hunting and incident-response add-ons, a stated price premium, and later channel development can make bundled or channel-led alternatives more attractive even when Expel wins on transparency.
    claimRefs: [CP008, CP011, CP012]
  - calloutType: assumption
    title: Competitive underwriting remains evidence-limited
    body: Public assigned sources do not establish current realized pricing, retention, win rates, or switching costs, so durability should not be scored as proven market power.
    claimRefs: [CP014]
