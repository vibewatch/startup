callouts:
  - calloutType: insight
    title: Established category, unsettled boundary
    body: MDR is a recognizable buying category, but current providers span human-led services, AI SOCs, co-managed models, and platformized MXDR. Expel's opportunity is therefore a defined service category with expanding adjacencies rather than a single clean market total.
    claimRefs: [CM004, CM006, CM007]
  - calloutType: risk
    title: SAM and SOM remain unproven
    body: Public evidence does not provide a comparable market-dollar estimate, Expel's serviceable segment, share, or conversion assumptions. A valuation case should not translate category growth directly into Expel revenue.
    claimRefs: [CM005, CM008, CM014]

