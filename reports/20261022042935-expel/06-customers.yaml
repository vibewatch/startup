      - [Affirm, Financial technology, "Distributed AWS monitoring across GuardDuty, CloudTrail, S3, SSO, GitHub, and other SaaS; custom detections and escalation", Production described, "50% fewer manual-review alerts; 40% better mean time to remediate", "YesPress cites an AWS case study; measurement window and denominator absent"]
