figures:
  - id: FU001
    title: Customer journey from alert burden to expansion question
    type: journey-map
    summary: Named evidence shows a recurring path from heterogeneous tooling and alert burden to integrated MDR outcomes, while retention and expansion remain unverified.
    data:
      nodes:
        - id: alert-burden
          label: Existing tools generate alert volume
          touchpoints: ["FIA Tech: growing endpoint, SIEM, cloud, and network alerts", "Scale: alert noise overwhelmed the firm"]
        - id: integration
          label: API-led onboarding
          touchpoints: ["FIA Tech: APIs not agents", "Affirm: existing AWS and SaaS tooling retained"]
        - id: triage
          label: 24x7 triage and investigation
          touchpoints: ["Affirm: Expel handles initial triage", "Scale: continuous MDR and analyst expertise"]
        - id: collaboration
          label: Customer-visible operations
          touchpoints: ["Workbench exposes investigations and analyst actions", "Customers can comment and collaborate in real time"]
        - id: outcomes
          label: Measurable operating relief
          touchpoints: ["FIA Tech: estimated 40 hours/week saved", "Affirm: 50% fewer manual-review alerts and 40% better MTTR"]
        - id: expansion-test
          label: Renewal and expansion diligence
          touchpoints: ["NRR, GRR, churn, contract length, and top-customer share are not disclosed", "Threat hunting and full incident response may be separately priced"]
    claimRefs: [CU001, CU005, CU006, CU010, CU014]
callouts:
  - calloutType: strength
    title: Concrete named-use proof
    body: FIA Tech, Affirm, and Scale Venture Partners describe distinct deployments or validation steps rather than relying only on logo display.
    claimRefs: [CU001, CU005, CU007]
  - calloutType: risk
    title: Retention remains unproven
    body: Public sources provide outcome anecdotes and directional review signals, but no cohort retention, churn, contract, or customer-concentration data.
    claimRefs: [CU009, CU014]
  - calloutType: recommendation
    title: Request the customer cohort bridge
    body: Obtain current and prior-period customer counts, gross and net retention, logo churn, contract duration, expansion revenue, and top-10 customer concentration split by segment.
    claimRefs: [CU014]
