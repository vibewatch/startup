chapter:
  number: 6
  title: Customers
  summary: Expel shows credible adoption evidence across named production and trial deployments, with customer value concentrated in alert triage, response capacity, and transparent collaboration. Public evidence supports segment fit and workflow outcomes, but does not establish retention, revenue concentration, or a complete customer denominator.
sections:
  - id: customer-segments-and-buying-motions
    title: Customer segments and buying motions
    body: >-
      The evidence points to a two-sided customer motion: security-mature enterprises
      with existing tools use Expel as a transparent operating layer, while leaner
      teams use it to obtain continuous monitoring and specialist capacity they cannot
      staff internally. The named examples span financial technology, financial
      services, and a technology provider serving the exchange-traded-derivatives
      industry. FIA Tech selected Expel to monitor alerts from endpoint, SIEM, cloud,
      and network tools after expansion increased operational burden; its stated
      requirements included compatibility with Carbon Black, Sumo Logic, Microsoft,
      and AWS. Affirm similarly retained control of custom detections while Expel
      handled initial triage and escalated complex findings. This is evidence of
      integration-led adoption, not proof that every listed logo is a paying,
      production customer. Public materials also describe buyer value in terms of
      reduced manual review, faster response, and visibility into analyst actions,
      suggesting a purchase case built around capacity and accountability rather than
      replacement of the customer's security stack.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-outcomes
    title: Adoption trajectory and measurable outcomes
    body: >-
      Public customer proof is outcome-oriented but unevenly quantified. FIA Tech's
      case study says alerts became visible in hours, response time fell, and the
      customer saved an estimated 40 work hours per week previously spent sifting
      through alerts.       YesPress, citing AWS's Affirm case study, reports a 50% reduction in alerts
      requiring manual review and a 40% improvement in mean time to remediate, while
      AWS states that Expel handles day-to-day alert triage and escalates high-value
      complex findings. These are useful operating outcomes, but they are customer
      case-study claims with no disclosed baseline period, denominator, confidence
      interval, or independent audit in the supplied texts. Scale Venture Partners
      provides a second adoption pattern: it trialed the service, evaluated multiple
      EDRs, and used simulated attacks before continuing with 24x7 monitoring and
      Workbench. PeerSpot's October 2026 category page reports Expel at 2.5% MDR
      mindshare, up from 2.1% the prior year, and says 100% of its users were willing
      to recommend it; the page also shows only one review, so this is a directional
      platform signal rather than a representative retention or satisfaction survey.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
  - id: proof-quality-and-durability-gaps
    title: Named proof, durability, and concentration limits
    body: >-
      Named proof is strongest where a customer describes a concrete workflow and
      outcome. FIA Tech identifies its technology stack and quantified time saving;
      Affirm identifies AWS services, triage ownership, escalation boundaries, and
      custom-detection collaboration; Scale identifies trial validation and simulated
      attacks. A Torq partner article documents that Expel's Workbench
      API exposes investigations, findings, comments, and remediation actions for
      automation, supporting the durability of an integration surface but not
      customer retention. Expel's own platform page reports 75 customer NPS, 160+
      integrations, and a 14-minute MTTR for critical/high incidents with
      auto-remediation; these are company-reported operational or satisfaction
      metrics, not independently verified customer cohorts. A competitor comparison
      characterizes Expel as a credible fit for security-mature enterprises and
      flags that threat hunting and full incident response may be separately priced,
      which could create expansion friction or procurement complexity. No supplied
      source discloses NRR, GRR, logo churn, contract duration, top-customer share,
      customer count denominator, or revenue by segment; those remain material
      underwriting gaps.
    claimRefs: [CU010, CU011, CU012, CU013, CU014]
    tableRefs: [TU003]
    figureRefs: [FU001]
