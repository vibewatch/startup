  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-concentration
      missingEvidence: "A customer cohort bridge showing beginning customers, new logos, churn, expansion, NRR, GRR, and contract duration by segment."
      whyItMatters: "Named deployments and case-study outcomes do not show whether customers renew, expand, or concentrate revenue risk."
      diligencePath: "Request monthly cohort and renewal data for the last eight quarters, reconciled to ARR or contracted revenue."
      relatedQuestionRefs: [QU004, QU007]
    - type: enumeration-incomplete
      severity: material
      topic: customer-proof-volume
      missingEvidence: "A complete customer list or defensible denominator separating current production customers, pilots, former customers, and referenceable accounts."
      whyItMatters: "Public logos, testimonials, and directory counts cannot be converted into active-customer penetration or retention."
      diligencePath: "Reconcile CRM customer status to billing and renewal records, then provide an anonymized segment and geography cut."
      relatedQuestionRefs: [QU001, QU005]
      relatedTableRefs: [TU003]
