  evidenceGaps:
    - type: missing-source
      severity: material
      topic: controls
      missingEvidence: Independent evidence for certifications, tenant isolation, data residency, incident history, and service-level performance.
      whyItMatters: Expel processes sensitive security telemetry and may initiate remediation through connected customer systems.
      diligencePath: Request current SOC 2 or ISO reports, security architecture and data-flow documentation, subprocessor and residency schedules, incident disclosures, and contractual SLA credits.
      relatedQuestionRefs: [QE007]
    - type: private-evidence-only
      severity: material
      topic: performance
      missingEvidence: Customer-level detection recall, response latency, false-positive reduction, uptime, and deployment-cost benchmarks.
      whyItMatters: Public product descriptions demonstrate workflow design but do not prove operational outcomes in a buyer's environment.
      diligencePath: Obtain anonymized cohort metrics, reference calls, a controlled proof of value, and a representative integration test.
      relatedQuestionRefs: [QE004, QE008]
    - type: missing-source
      severity: minor
      topic: SIEM
      missingEvidence: Precise Managed SIEM scope, supported versions, pricing, retention responsibility, and coverage boundaries.
      whyItMatters: The buyer may still carry material platform, ingestion, and compliance obligations.
      diligencePath: Request a responsibility matrix and quote covering existing SIEM engineering, log retention, data export, and response authority.
      relatedQuestionRefs: [QE005]
