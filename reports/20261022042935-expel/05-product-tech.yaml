      - [Investigate a suspected threat, Gather evidence across tools, Analyst-led investigation with shared history, Customer can see evidence and actions, Requires usable telemetry and permissions]
      - [Contain an incident, Coordinate actions across consoles, API-exposed remediation actions, Repeatable response playbooks are possible, Authority and approval boundaries require validation]
      - [Tune detection coverage, Maintain rules inside SIEM, Managed detection engineering, Outsources rule maintenance, SIEM licensing and data obligations remain]
    notes: >-
      Benefits are reported or described by sources, not independently benchmarked conversion or response metrics; the limitation column records the unresolved implementation dependency.
    claimRefs: [CE003, CE006, CE007, CE008, CE013]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - ["Customer telemetry and existing tools", "Generate endpoint, cloud, identity, email, and SIEM signals", "Customer stack and API access", "Blind spots when sources are absent or misconfigured"]
      - ["Integration and enrichment layer", "Normalize and add context to incoming signals", "Supported APIs and data quality", "Schema or permission changes can reduce coverage"]
      - ["Workbench", "Present investigations, findings, comments, and actions", "Tenant controls and service availability", "Sensitive case data requires strong access and retention controls"]
      - ["Ruxie and bounded automation", "Triage, enrich, and draft or propose actions", "Training data, rules, and human review", "Model error or inappropriate automation needs guardrails"]
    notes: >-
      This is an evidence-based operating model assembled from technical and partner descriptions; it is not a disclosed internal software architecture diagram.
    claimRefs: [CE005, CE006, CE009, CE010]
figures:
  - id: FE001
    title: Expel product architecture map
    type: stack
    summary: Expel layers customer telemetry and integrations beneath Workbench investigations, analyst operations, and bounded automation.
    data:
      layers:
        - label: Customer environment
          detail: Customer-owned security telemetry enters the service.
          modules:
            - label: Endpoint and identity telemetry
              detail: Signals from customer-owned security products
            - label: Cloud, email, network, and SIEM data
              detail: Additional sources for correlation and investigation
        - label: Integration layer
          detail: APIs connect supported tools and add context before review.
          modules:
            - label: API connections
              detail: Agentless access to supported tools and remediation actions
            - label: Enrichment and correlation
              detail: Adds context before analyst review
        - label: Workbench operations
          detail: Customers and analysts work from a shared investigation surface.
          modules:
            - label: Investigation history
              detail: Evidence, findings, comments, and actions are exposed to customers
            - label: Analyst and automation workflow
              detail: Human investigation with bounded triage and response assistance
        - label: Detection engineering
          detail: Detection logic is maintained against the customer's existing SIEM investment.
          modules:
            - label: Managed detections
              detail: Detection content and tuning are described as a service responsibility
        - label: Response actions
          detail: Approved remediation actions can be exposed through integrated APIs.
          modules:
            - label: Containment and remediation
              detail: Actions remain bounded by customer permissions and approval policy
        - label: Customer governance
          detail: The customer retains responsibility for environment context and control decisions.
          modules:
            - label: Collaboration and oversight
              detail: Shared records support review of evidence, actions, and recommendations
    approximationNotes: >-
      The layered order represents the documented operating model, not a disclosed implementation stack or a performance ranking.
    claimRefs: [CE015, CE016]
callouts:
  - calloutType: strength
    title: Legible managed operations
    body: Workbench's shared investigation history and broad integration model make Expel's managed service more inspectable than a conventional alert handoff.
    claimRefs: [CE002, CE003, CE007, CE015]
  - calloutType: risk
    title: Platform dependency remains
    body: Public evidence supports detection engineering over an existing SIEM, but does not show that Expel replaces the customer's logging, retention, or data-governance obligations.
    claimRefs: [CE005, CE011, CE012]
  - calloutType: recommendation
    title: Validate controls before deployment
    body: Diligence should test API permissions, tenant isolation, response approvals, data residency, service levels, and the boundary between managed detection and managed SIEM.
    claimRefs: [CE006, CE010, CE012]
