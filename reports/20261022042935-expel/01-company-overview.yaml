company:
  name: Expel
chapter:
  number: 1
  title: Company Overview
  summary: Expel is a privately held managed detection and response provider founded in 2016 by three Mandiant/FireEye security operators, with a product model that operates customers' existing tools rather than replacing them. Current public evidence confirms the leadership bench, platform positioning, and partner ecosystem, while revenue, current valuation, retention, cash runway, and governance detail remain partly private or estimate-based.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: Expel is a Herndon, Virginia-headquartered managed detection and response provider founded in 2016 by Dave Merkel, Justin Bajko, and Yanek Korff. The company describes its service as monitoring, investigating, and remediating threats across a customer's existing security tools 24x7, with Workbench providing the operating record and human analysts retaining consequential judgment. The model is therefore an outsourced security-operations layer rather than a replacement endpoint, SIEM, firewall, or identity product. Expel's own current fact sheet says it connects through APIs and supports 160+ coverage options, while a competitor comparison independently describes the product as vendor-agnostic across 160+ integrations. That breadth is strategically useful for security-mature buyers with heterogeneous stacks, but it also creates an execution dependency on third-party APIs, data models, and customer-controlled systems. Public evidence supports the core identity and product model; it does not establish current contract mix, gross margin, retention, or customer concentration.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, founder continuity, and governance
    body: "Expel retains all three co-founders in operating roles: Merkel as chief executive officer, Bajko as chief strategy officer, and Korff as chief operating officer. Their prior work at Mandiant, FireEye, AOL, and related security operations provides direct founder-market fit for an MDR service. This continuity is a strength, but it also means diligence should test succession depth and the portability of founder-specific customer and partner relationships. The public leadership page supplies detailed biographies, while the current pool does not supply a complete board roster, board rights, ownership table, or a verified record of leadership changes. Those omissions are material for a private-company underwriting decision, and the visible operating roster should not be mistaken for evidence of independent governance or a complete succession plan."
    claimRefs: [CO001, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: capital-scale-and-milestones
    title: Capital, scale, and milestone record
    body: Funding evidence is directionally consistent but not numerically uniform. Tracxn reports $289 million across six rounds and identifies a $141 million November 2021 Series E at a $1 billion valuation, plus a $30 million October 2022 round; GetLatka reports $257.8 million across five rounds and the same $1 billion November 2021 valuation. These are third-party databases, not audited company financials, so the chapter preserves the discrepancy rather than selecting a false point estimate. GetLatka also labels $142.2 million of June 2025 revenue as a Growjo estimate and reports 508 employees in December 2024 from LinkedIn; neither is company-reported. The milestone record adds company-claimed market recognition and partner awards, while CFO Dive's coverage indicates that quantified risk reduction matters to the finance buyers approving cybersecurity budgets. Current cash, burn, runway, ARR, NRR, gross margin, customer count, and complete board governance remain diligence gaps.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: diligence-judgment
    title: Diligence judgment and open questions
    body: "The strongest verified conclusion is that Expel has a coherent identity, an experienced operating team, a differentiated transparency-oriented MDR workflow, and a channel model that extends reach without requiring customers to replace their security stack. The weakest part of the public record is financial and ownership visibility: valuation is historical, revenue and headcount are estimate-based, and current private-company liquidity and retention metrics are not disclosed in the assigned evidence. A buyer or investor should therefore treat the company as a real operating asset with credible institutional backing, but condition any valuation or liquidity conclusion on primary confirmation of the latest financing, cap table, recurring-revenue composition, retention, margins, concentration, cash, and debt. The absence of a recorded adverse incident in this pool is not evidence that no incident, dispute, or regulator correspondence exists."
    claimRefs: [CO012, CO013, CO014, CO015, CO016]
callouts:
  - calloutType: strength
    title: Founder and operator continuity
    body: All three founders remain in senior operating roles, preserving continuity across company direction, strategy, and operations.
    claimRefs: [CO001, CO006, CO007, CO008]
  - calloutType: risk
    title: Private-company visibility
    body: Public evidence does not verify current valuation, recurring-revenue quality, retention, cash runway, customer concentration, or complete governance terms.
    claimRefs: [CO012, CO013, CO014, CO015, CO016]
  - calloutType: insight
    title: Operating-model choice
    body: Expel's core proposition is to operate and explain a customer's existing security stack, not replace it with a proprietary endpoint or SIEM product.
    claimRefs: [CO002, CO003, CO004]
