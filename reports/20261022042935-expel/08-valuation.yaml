    title: Price discipline dominates the call
    body: "Expel merits continued diligence, not a buy recommendation, because the assigned evidence does not establish a current private valuation, recurring-revenue quality, margins, retention, runway, or preference stack."
    claimRefs: [CV007, CV008, CV009, CV015, CV016]
