    claimRefs: [CV001, CV006, CV011, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - [Differentiated MDR workflow, "Workbench transparency and 160+ integrations are described by company and competitor sources.", "Customer references showing measurable renewal, expansion, and response outcomes."]
      - [Large and active demand, "CFO/CISO survey coverage says 40% of finance leaders wanted quantified risk reduction to justify more spend.", "Evidence that Expel converts demand into durable contracted recurring revenue."]
      - [Integration economics risk, "A competitor says customers retain their SIEM bill and some response functions are add-ons.", "Contracts showing bundled scope, attach rates, gross margin, and customer willingness to pay."]
      - [Financing opacity, "A 2026 profile reports a 2021 valuation above $1 billion, but the assigned sources establish no current price.", "Latest preferred price, cap table, preferences, dilution, and secondary or financing marks."]
    notes: "The competitor comparison is not an independent benchmark; its adverse assertions are diligence leads rather than established facts."
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV016]
  - id: TV003
    title: Bull, base, and bear scenario
    columns: [Scenario, Explicit assumptions, Valuation or return logic, Probability signal, Key trigger]
    rows:
      - [Bull, "Verified recurring growth remains strong; retention and gross margin are durable; AI and Managed SIEM expand wallet share.", "A premium entry can be justified only after a verified revenue base and preferred-price terms support a market-consistent forward multiple.", "Low-to-medium; depends on private data not in the pool.", "Net retention, gross margin, expansion, and current financing price all clear diligence thresholds."]
      - [Base, "MDR demand persists; product differentiation remains useful; growth continues but valuation support is ordinary.", "Track or negotiate price protection; no precise target return is supportable without revenue, cash, and cap-table data.", "Medium; best fit to currently available evidence.", "Customer renewal, services mix, and cash runway are verified."]
      - [Bear, "Multiple compression, down-round pressure, customer concentration, or add-on limits weaken monetization.", "Avoid a premium price; require downside protection or wait for a financing reset.", "Material; adverse competitor assertions and opacity make it plausible.", "Lower preferred price, deteriorating renewals, margin pressure, or stalled commercialization."]
    notes: "Scenario labels are analyst decision cases, not reported forecasts; no numerical valuation range is fabricated because current Expel revenue, ARR, cash, and transaction terms are not publicly disclosed in the assigned pool."
    claimRefs: [CV005, CV007, CV008, CV009, CV011, CV015]
