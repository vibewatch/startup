evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: A current capitalization table, financing documents, and any secondary or debt instruments.
    whyItMatters: Third-party profiles disagree on total raised and do not establish present ownership, preferences, or liquidity.
    diligencePath: Request the latest cap table, financing term sheets, board approvals, debt schedule, and investor rights package.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Audited or management revenue bridge separating recurring MDR revenue, services, and any non-recurring items.
    whyItMatters: The only retained revenue figure is a third-party estimate and cannot establish ARR, growth quality, or margins.
    diligencePath: >-
      Obtain monthly recurring-revenue cohorts, bookings, billings, revenue recognition policy, gross margin, and
      services mix.
    relatedQuestionRefs:
      - QO005
      - QO010
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: customers
    missingEvidence: >-
      Verified active customer count, retention, concentration, contract duration, and customer-level revenue
      distribution.
    whyItMatters: A 500+ customer claim does not show economic quality, renewal risk, or dependence on a few accounts or partners.
    diligencePath: >-
      Request logo and dollar retention cohorts, top-20 customer concentration, contract terms, churn analysis, and
      reference calls.
    relatedQuestionRefs:
      - QO005
      - QO007
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Complete current board roster, committee structure, ownership rights, and documented leadership succession plan.
    whyItMatters: The public leadership page does not establish board control, investor rights, or resilience to founder departure.
    diligencePath: >-
      Request board minutes or roster, governance documents, option ledger, key-person coverage, and succession plans
      under NDA.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: adverse
    missingEvidence: >-
      Independent legal, regulatory, incident, outage, and sanctions searches beyond the retained comparison and news
      sources.
    whyItMatters: No adverse record in the assigned pool is not proof that no adverse event exists.
    diligencePath: >-
      Run targeted federal and state court, regulator, sanctions, breach-notification, and outage-history checks using
      primary records.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: blocking
    topic: market-sizing
    missingEvidence: A common-basis 2026 MDR market-dollar estimate with geography, buyer population, and service boundary.
    whyItMatters: >-
      Without a comparable denominator, category growth cannot be translated into Expel's SAM, SOM, or valuation
      support.
    diligencePath: >-
      Obtain current analyst market data and reconcile definitions, geography, and recurring-service inclusion with
      Expel's internal planning model.
    relatedQuestionRefs:
      - QM002
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Expel's segment-level pipeline, ACV, win/loss, market share, and conversion from target account universe to
      serviceable opportunity.
    whyItMatters: The public record defines the buyer but does not demonstrate how much of the category Expel can reach or win.
    diligencePath: >-
      Request the latest board or planning market model, segmented pipeline, win/loss analysis, and competitive
      displacement data under NDA.
    relatedQuestionRefs:
      - QM003
      - QM009
  - type: conflicting-data
    severity: material
    topic: category
    missingEvidence: A normalized taxonomy distinguishing MDR, MXDR, AI SOC, co-managed SOC, platform, and internal-build spend.
    whyItMatters: Overlapping labels can double count adjacent services and overstate market growth.
    diligencePath: Build a vendor and buyer taxonomy using analyst definitions, procurement categories, and Expel's win/loss records.
    relatedQuestionRefs:
      - QM001
      - QM008
    relatedTableRefs:
      - TM001
      - TM002
  - type: missing-source
    severity: material
    topic: diligence-gap
    missingEvidence: Current Expel and competitor price cards, renewal rates, win-loss data, logo churn, and switching-cost evidence.
    whyItMatters: >-
      Without comparable commercial and retention data, a workflow moat cannot be translated into durable share or
      pricing power.
    diligencePath: >-
      Request the latest competitive win-loss review, renewal cohort data, realized contract pricing, add-on attach
      rates, and customer references from management.
    relatedQuestionRefs:
      - QP008
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-profiles
    missingEvidence: A complete, current profile of every material MDR competitor's scale, funding, product scope, and target segment.
    whyItMatters: Assigned public evidence supports a directional landscape but not exhaustive competitor coverage.
    diligencePath: >-
      Build a named competitor list from management's pipeline and benchmark each provider using primary product,
      pricing, and customer evidence.
    relatedQuestionRefs:
      - QP001
      - QP003
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: ARR, recognized revenue, gross margin, CAC, payback, GRR, NRR, churn, and analyst productivity by cohort.
    whyItMatters: >-
      These metrics determine whether recurring service growth converts into durable contribution profit rather than
      labor-intensive low-margin revenue.
    diligencePath: >-
      Request cohort revenue files, contract samples, bookings bridge, gross-margin schedule, and fully loaded
      acquisition and delivery-cost allocations.
    relatedQuestionRefs:
      - QI002
      - QI004
      - QI005
      - QI008
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash, monthly burn, runway, debt or project-finance obligations, and financing plan.
    whyItMatters: >-
      A private service company may need continued capital to fund analyst hiring, engineering, and working capital even
      with credible demand.
    diligencePath: >-
      Request the latest balance sheet, cash-flow statement, debt schedule, board-approved plan, and downside runway
      case.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: add-ons
    missingEvidence: >-
      Current contracts and price books showing whether threat hunting, incident response, and managed SIEM are bundled
      or separately priced across customer cohorts.
    whyItMatters: >-
      Add-on dependence changes realized ACV, gross margin, renewal value, and the comparability of package-level
      pricing claims.
    diligencePath: >-
      Request anonymized order forms, attach-rate reporting, renewal cohorts, and contribution margin by core and
      extension service.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI001
      - TI002
  - type: enumeration-incomplete
    severity: material
    topic: revenue-mix
    missingEvidence: >-
      Customer concentration, vertical mix, partner-sourced revenue, add-on attach rates, and recurring versus services
      revenue.
    whyItMatters: Concentration and mix determine revenue durability, pricing power, margin quality, and renewal risk.
    diligencePath: >-
      Request revenue by customer, vertical, channel, product package, add-on, and contract-recognition category for the
      last eight quarters.
    relatedQuestionRefs:
      - QI001
