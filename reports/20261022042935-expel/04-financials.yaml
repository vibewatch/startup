    title: Revenue model bridge
    type: flow
    summary: Expel converts customer security-tool coverage and telemetry into managed investigation, response, and optional services; public evidence does not quantify conversion into revenue or gross profit.
    data:
      nodes:
        - id: customer-stack
          label: "Customer-owned security stack"
          detail: "Endpoint, identity, cloud, email, SaaS, network, and SIEM tools"
        - id: integrations
          label: "API integrations"
          detail: "160+ integrated tools reported by Expel"
        - id: telemetry
          label: "Telemetry and alerts"
          detail: "Pricing is described as scaling with integrated technologies and telemetry volume"
        - id: workbench
          label: "Workbench and Ruxie"
          detail: "AI-assisted triage, investigation context, and transparent audit trail"
        - id: human-soc
          label: "24x7 human SOC"
          detail: "Analyst investigation, customer communication, and remediation decisions"
        - id: revenue
          label: "Recurring MDR subscription plus extensions"
          detail: "Package tiers and optional Managed SIEM, phishing, hunting, or IR scope; price and margin undisclosed"
      edges:
        - [customer-stack, integrations]
        - [integrations, telemetry]
        - [telemetry, workbench]
        - [workbench, human-soc]
        - [human-soc, revenue]
    claimRefs: [CI001, CI002, CI005, CI013]
callouts:
  - calloutType: recommendation
    title: Underwrite the private metrics, not the package labels
    body: Expel has a credible recurring MDR mechanism and public operating proof, but the retained evidence does not establish ARR, gross margin, retention, cash, burn, or runway. Require cohort, contract, margin, and liquidity evidence before underwriting a price.
    claimRefs: [CI001, CI009, CI014, CI016]
