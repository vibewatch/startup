      - [Incident response, "Response and remediation support", "API-exposed actions and service scope", "Competitor comparison describes full IR as a separate add-on", "Third-party reported; verify current contracts", "Retainer revenue, utilization, and response labor cost"]
      - [Managed phishing, "M365 or Google Workspace service extension", "Email environment and service scope", "Listed as an add-on in the retained review", "Review-source description", "Attach rate, delivery cost, and churn by bundle"]
      - [Workbench API ecosystem, "Customer or partner automation of investigations and remediation", "API calls, workflows, and integrations", "Torq documents alert, finding, comment, and remediation automation", "Partner-issued proof of integration capability", "API usage, support burden, and paid entitlement"]
    notes: "Public sources describe mechanisms and package structure, not recognized revenue. Null or undisclosed pricing fields require contract-level confirmation."
    claimRefs: [CI001, CI002, CI006, CI013]
  - id: TI002
    title: Pricing and monetization disclosures
    columns: [Pricing element, Public evidence, List versus realized, Financial interpretation, Unknown or diligence request]
    rows:
      - [Starter package, "Cloud, identity, network, and endpoint coverage described", "List/package scope only", "Entry coverage may support land motion", "Dollar price, minimum commitment, and discounting"]
      - [Select package, "Adds cloud control plane, SaaS coverage, and multi-surface remediation", "List/package scope only", "Expansion path by attack surface", "Expansion rate and realized uplift"]
      - [Premium package, "Unlimited integrations, Workbench API access, and dedicated engagement manager", "List/package scope only", "Potential higher-ACV enterprise tier", "ACV distribution and service burden"]
      - [Technology count, "Review says pricing scales with number of integrated technologies", "Driver, not reported revenue", "Broader stack may raise contract value and implementation effort", "Price curve and marginal gross margin"]
      - [Telemetry volume, "Review says pricing scales with telemetry volume", "Driver, not reported revenue", "Potential variable cost exposure", "Noisy-month policy, cloud cost pass-through, and caps"]
      - [Managed SIEM pricing, "Company says it does not profit when data volume grows", "Company positioning, not realized price", "May reduce data-volume conflict but does not establish margin", "Price book, discounts, and delivery economics"]
    notes: "These rows distinguish package/list architecture from realized contract economics; no public source in the pool supplies dollar pricing or accounting recognition."
    claimRefs: [CI001, CI002, CI003, CI013]
  - id: TI003
    title: Unit economics and underwriting gaps
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue run rate, null, low, "Cannot infer ARR from customer counts or package descriptions", "Monthly recurring revenue bridge and definition"]
      - [ARR, null, low, "No retained source reports ARR", "ARR reconciliation to GAAP revenue and deferred revenue"]
      - [Gross margin, null, low, "SOC labor and telemetry costs may materially affect margin", "Gross margin by package and customer cohort"]
      - [CAC, null, low, "No acquisition-spend or bookings evidence in pool", "Fully loaded CAC by direct, partner, and channel motion"]
      - [CAC payback, null, low, "Requires CAC, gross margin, and expansion data", "Cohort payback with implementation costs"]
      - [Net revenue retention, null, low, "No retention or expansion disclosure retained", "GRR, NRR, logo churn, and contraction by cohort"]
      - [Analyst productivity, null, low, "Public response times do not establish staffing economics", "Alerts per analyst, automation rate, and utilization"]
      - [Cash balance, null, low, "No current cash position disclosed in assigned evidence", "Latest balance sheet or treasury statement"]
      - [Monthly burn, null, low, "No cash-flow disclosure retained", "Trailing twelve-month cash burn and hiring plan"]
      - [Runway, null, low, "Cannot calculate without cash and burn", "Base/downside runway and next-round trigger"]
    notes: "Null means unavailable in the assigned public evidence, not zero. Each missing metric is a specific diligence request."
    claimRefs: [CI009, CI011, CI014, CI015, CI016]
figures:
