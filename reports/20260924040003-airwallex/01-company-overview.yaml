  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Airwallex is a Melbourne-founded global B2B financial infrastructure platform that now reports $1.3B in annualized revenue, $287B in annualized transaction volume, 200,000+ direct business customers, and 85+ licenses while scaling autonomous finance products and a second Series H-backed expansion phase."
  },
  "sections": [
    {
      "id": "s1",
      "title": "Identity and Business Model",
      "body": "Airwallex was founded in Melbourne in 2015 after Jack Zhang and the founding team experienced the friction of moving money across borders while operating a cafe importing goods. The company now positions itself as an AI-native financial operating system for modern businesses. Its core platform covers cross-border payments, multi-currency accounts, FX, cards, spend management, billing, embedded finance APIs, and a newer autonomous-finance roadmap anchored by T:0 and Airi.\n\nThe business model remains platform-based rather than product-point-solution based: Airwallex monetizes transaction fees, FX spread, interchange, subscription-style account and workflow products, and API or infrastructure usage tied to embedded finance. Public messaging in 2026 emphasizes that more than 90% of revenue comes from customers using multiple products, which supports the view that the company is becoming a broader operating layer rather than a single transfer rail.",
      "claimRefs": [
