    {
      "id": "s2",
      "title": "Leadership, Governance, and Footprint",
      "body": "Jack Zhang remains the public face and primary decision-maker. Lucy Liu is president, while the technical and product leadership structure is still anchored by the original founding team. Public sources do not disclose a full board map or shareholder rights stack, so governance assessment remains limited by private-company opacity. That said, the company is operating at a visibly larger scale than in the prior refresh: Airwallex now says it has over 2,300 employees across 27 offices and is co-headquartered in San Francisco and Singapore.\n\nThe footprint matters strategically because the company has chosen to support regulatory breadth, local payment-rail integration, and regional sales coverage at the same time. That breadth is hard to replicate and helps explain why the business is still able to sign enterprise customers while expanding into new regions and new product categories.",
      "claimRefs": [
        "CO006",
        "CO007",
        "CO008",
        "CO012",
