      - number: '3.2'
        title: 功能广度、定价机制与 GTM
        blocks:
          - type: paragraph
            body: >-
              Airwallex
              的竞争策略是捆绑足够多元的功能，促使客户停用多套单点工具。如果采购决策由渴望减少供应商数量与对账负担的财务与运营团队主导，这一打法优势明显。短板在于功能过于庞杂会加剧定价、客户入驻与售后支持的复杂度，对仅需单一功能的客户尤为明显。


              实际运营中，公司护城河不仅来自产品广度，更依托牌照布局、本地直连清算网络，以及免除平台客户从零搭建合规与资金流转架构的赋能实力。纯软件竞品短期内难以快速复刻这套复合壁垒。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
