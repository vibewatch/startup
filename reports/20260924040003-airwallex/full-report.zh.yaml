      - number: '4.3'
        title: 盈利质量综合裁定
        blocks:
          - type: paragraph
            body: >-
              财务面貌颇具吸引力却不够完整。Airwallex
              展现出高增长、盈利能力逐步增强的平台姿态，具备扎实的交叉销售能力以及通往公开市场规模的可信路径。与此同时，公司尚未发布经审计财务报表、分产品线收入、分地区收入、毛利率或
              NRR。这些信息断层影响重大，导致外界难以将 Airwallex 与公开上市金融科技同行对标，亦无法客观评判业务体量扩大后的增长持久性。


              合理的尽调结论并非“缺乏透明度即等同基本面羸弱”，而是公司已行进至关键分水岭：收入质量、利润率构成与合规成本已成为核心承销考量。上述核验若能过关，估值便有据可依；若通不过，表面的亮眼增速参考价值将大打折扣。
            claimRefs:
              - CI012
              - CI013
              - CI015
              - CI016
