      - number: '1.3'
        title: 融资历程、估值与规模里程碑
        blocks:
          - type: paragraph
            body: >-
              最新公开融资事件为 2026 年 6 月完成的 H 轮，以 $11B 估值融资 $320M，由 Addition 领投，多家后期投资机构跟投。Airwallex 自述其在 2026 年 3 月年化营收达到
              $1.3B，年化交易量达 $287B，直接服务或经平台触达的企业达 676,000 家。相较 2025 年 12 月披露的 $8B 估值，公司估值中枢明显上移。


              融资节奏的关键之处在于，证明公司在宣称实现盈利或接近盈亏平衡的同时，依然能持续完成估值上涨轮。两相结合，市场已将 Airwallex 视作规模化基础设施资产，而非风险投资阶段的试验项目；但随着业务挺进 AI
              原生金融与代理商业，市场对合规纪律、财务透明度与资本配置的要求也水涨船高。
