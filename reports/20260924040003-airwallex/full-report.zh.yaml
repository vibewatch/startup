      - number: '4.2'
        title: 定价模型、单位经济与资本配置
        blocks:
          - type: paragraph
            body: >-
              公司定价机制倾向于用量计费与多模块捆绑，而非单一定价表。此举利于从大型客户身上捕获价值，但也推高了尽调评估难度，净费率会随地域、产品组合与大客户协商条款动态浮动。核心财务课题不仅在于 Airwallex
              能收多少费，更在于扣除合规、客服支持、基础设施与渠道伙伴成本后能截留多少毛利。


              公开证据显示单位经济效益持续改善：Airwallex 披露已跨过盈利里程碑，并以 $11B 估值再获大额融资。预期资本用途包括继续拓展美国市场、获取合规牌照与研发 AI
              原生产品。潜在矛盾在于，即便长期收入大盘持续扩张，前述资本开支短期内仍可能压制利润率表现。
            claimRefs:
