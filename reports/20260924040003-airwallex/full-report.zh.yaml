  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品版图与功能边界
        blocks:
          - type: paragraph
            body: >-
              产品版图极广：全球账户、跨境支付、外汇兑换、企业卡、支出管理、账单结算及嵌入式金融 API。2026 年公司将 T:0 与 Airi
              纳入产品路线图，释放出跳出单纯清结算与发卡、全面发力自主金融与代理商业的信号。这一跨越意义重大，促使产品从“资金搬运”升级为“接管财务工作流”。


              产品架构上的关键考量，在于功能覆盖面能否保持足够的内聚性以便于客户采纳。Airwallex 公开资料显示，答案取决于客群属性：财务团队寻求高度整合的工作流，平台型客户则偏好可直接嵌入自有产品体验的 API
              原语与本地底层通道。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE013
              - CE014
      - number: '5.2'
        title: 架构设计、高可用性与系统集成
        blocks:
          - type: paragraph
            body: >-
              系统架构采用 API 优先设计，直接集成各地区本地支付通道、银行卡网络、余额账户及账单原语。GitHub 仓库、GitLab 客户资料以及 Airwallex
              官方开发者文档显示，其工程团队将产品视作底层基础设施而非前端应用。这种定位差异至关重要，基础设施的优劣取决于集成深度、系统可用性与合规管控，而非 UI 视觉打磨。


              核心尽调认知在于，产品版图越庞杂，运营上的外部依赖项就越多：合作银行、卡组织、结算伙伴、云服务商以及各司法管辖区的特定法规。Airwallex
              似乎在押注，自持的合规与清结算网络能将这种系统复杂度沉淀为护城河，而非拖累运营的包袱。
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE014
      - number: '5.3'
        title: 信任机制、合规风控与产品路线图
        blocks:
          - type: paragraph
            body: >-
              合规与信任机制并非 Airwallex
              的边缘考量，而是产品内核的有机组成部分。牌照资质布局、反洗钱与反恐融资（AML/CTF）审查纪录，以及发卡行响应状态文档均证明，高可靠性与强监管履约能力是产品的核心属性。产品路线图必须在推进速度与风控把关之间求取平衡。推出
              AI 原生金融产品更推高了这一门槛，自动化若欠缺严密内控，对严肃财务团队而言根本无法投入生产。


              技术评估裁定积极但附带先决条件：Airwallex 似乎已构建起足以支撑业务扩张的底层基础设施深度，但下一阶段成败，取决于其在叠加更多 AI 行为的同时，能否维系平台的合规可控、高可观测性与敏捷集成体验。
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE013
              - CE014
  - number: 6
    title: 客户分析
    sections:
      - number: '6.1'
        title: 客户细分客群
        blocks:
          - type: paragraph
            body: >-
              客群构成可拆解为三大主力：需要跨国资金流动的出海企业、需要多币种运营底座的财务团队，以及希望在自有产品中嵌入金融基础设施的软件平台。Airwallex 对外宣传持续强调在全球服务逾 200,000
              家企业，近期官方披露更反映出，直客与平台辐射客户的总量已远超该直客底座。


              客户采纳规律鲜明：企业在完成首次出海扩张，或平台寻求直接变现金融工作流时，产品使用往往迅速放量。这促使公司从同质化的汇款通道升级为深度嵌入的工作流平台。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU008
              - CU012
      - number: '6.2'
        title: 标杆客户、落地佐证与使用深度
        blocks:
          - type: paragraph
            body: >-
              公开客户案例与企业客户名录映射出涵盖科技企业、在线业务及跨国品牌的客户结构。最强有力的落地证据不仅是客户标杆清单，更在于多批可复现的案例研究明确揭示了工作流重构前后的量化成效：客户入驻提速、手续费支出减少、多币种调度更为便捷、支出管控流转更顺畅。


              由于 Airwallex 尚未上市，公开记录未披露完整的留存率或队列数据。替代尽调的最佳抓手，是观察知名客户是否同时出现在多款产品矩阵中，以及同类客群是否反复在公开案例中得到验证。现有证据给出了肯定答案。
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
