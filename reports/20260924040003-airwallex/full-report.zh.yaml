      - number: '2.3'
        title: 增长驱动、约束条件与尽调盲区
        blocks:
          - type: paragraph
            body: >-
              行业顺风清晰可见：企业跨国经营日趋普遍、平台迫切希望变现金融功能，财务团队也渴望借助软件降低人工对账成本。逆风阻力同样不容忽视：监管合规、牌照获取、KYC/AML
              审查、本地银行合作以及交易监控义务，构筑了极易被低估的成本曲线。竞价环境同样激烈，工作流一旦足够简单，大量买方即可同时接入多家供应商或退回银行电汇。


              尽调的核心命题并非市场空间是否宽广，而是 Airwallex 在拓展美国市场与布局 AI
              驱动工作流之际，能否持续把牌照广度与产品厚度转化为持久的市场份额。市场机遇确凿无疑，却极度考验底层运营功力，执行质量远比宣讲 TAM 口号关键。
            claimRefs:
              - CM011
              - CM012
              - CM015
              - CM016
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局
        blocks:
          - type: paragraph
            body: >-
              直接竞争格局包括 Wise、Revolut Business、Stripe、Adyen、Payoneer、Nium、Brex、Ramp、Airbase 与
              Mercury，此外还需面对传统银行及企业自建系统的竞争。Airwallex 最锋利的破局切入点，在于将全球支付、账户、银行卡、支出管控与 API
              聚合在统一合规牌照体系下。面对出海基因浓厚、从创立第一天起就面向全球的企业，这种全栈广度价值尤为突出。


              相比之下，竞品方案更聚焦或推进路径各异：Wise 核心优势在跨境汇款，Stripe 与 Adyen 属于重支付的基础设施厂商，Brex 和 Ramp
              则以支出管理见长。这让战局跳脱出单纯的点对点厮杀，转为争夺谁能充当企业资金流动的操作系统。
            claimRefs:
              - CP001
