  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Airwallex 的实际业务边界远宽于跨境汇款，囊括企业账户、多币种资金管理、分发与收单网络、外汇兑换、支出管理、账单结算及嵌入式金融
              API。现状替代方案包括银行电汇、代理行网络、卡组网络、本地支付服务商（PSP）、薪酬服务商、报销工具与纯手工财务操作。客户若需要统一控制台而非拼凑单点工具，Airwallex 便能胜出。


              需求动能来自中小企业跨国贸易普及、分布式团队扩张、合规门槛抬高，以及软件平台倾向于嵌入支付与银行功能而非自研。这类诉求使得 Airwallex 不再是纯粹的支付管道，而是化身跨国财务运营的基础设施层。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
