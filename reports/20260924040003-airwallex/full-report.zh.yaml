      - number: '2.2'
        title: 规模测算维度与买方客群
        blocks:
          - type: paragraph
            body: >-
              Airwallex 确切 TAM 并未公开披露，审慎的尽调方法是从贸易流、支出管理预算与嵌入式金融渗透率三个维度交叉推算。近端 SAM
              锁定需要跨司法管辖区合规资金流动的跨国中小企业、中端市场企业及软件平台交集。最强买方群体为掌管跨国资金流或嵌入式金融产品的财务团队、运营负责人与平台产品团队。


              采购往往发生在企业现有纯本土工具链不堪重负之际。催化节点包括进军新市场、向境外承包商或供应商付款、多币种资金调度复杂度攀升，或是希望在软件产品内部直接变现支付流程。一旦客户将合规规则、账户体系、报表及发卡集成进同一业务流，迁移成本便显著抬高。
