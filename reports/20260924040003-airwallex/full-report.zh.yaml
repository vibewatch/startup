chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              Jack Zhang 与创始团队在经营一家进口物料的咖啡馆时，亲历跨国资金流转摩擦，随后于 2015 年在墨尔本创立 Airwallex。公司如今将自身定位为面向现代企业的 AI
              原生金融操作系统。核心平台覆盖跨境支付、多币种账户、外汇、银行卡、支出管理、账单结算、嵌入式金融 API，以及由 T:0 和 Airi 担纲的全新自主金融路线图。


              商业模式立足平台而非单点产品方案：Airwallex 变现渠道涵盖交易手续费、外汇利差、刷卡手续费分成、账户与工作流工具订阅费，以及挂钩嵌入式金融的 API 与基础设施调用费。2026 年公开口径强调，超过
              90% 的收入来自使用多款产品的客户，佐证了公司正蜕变为更底层的运营中枢，而非单一资金通道。
