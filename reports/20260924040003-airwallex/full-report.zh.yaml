      - number: '3.3'
        title: 护城河韧性与风险
        blocks:
          - type: paragraph
            body: >-
              核心风险在于服务同质化。客户若仅需简单转账或开卡，银行与单点服务商便足以胜任。Airwallex 必须沿价值链向上爬坡，布局工作流自动化、嵌入式金融与 AI
              原生金融工具。公司同样需要证明，牌照覆盖广度能够转化为稳固的市场份额，而非仅沦为高昂的合规成本。


              现有公开证据显示，Airwallex
              在复杂的跨国工作流中具备竞争力，但面对知名度更高的品牌与低成本替代品，其护城河仍未经过充分压力测试。尽调重心应锁定在客户留存率、交叉销售表现，以及产品能否真正确立为财务团队的底层事实系统（system of
              record）。
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
  - number: 4
    title: 财务分析
    sections:
      - number: '4.1'
        title: 营收结构与变现模式
        blocks:
          - type: paragraph
            body: >-
              Airwallex 变现组合融合了外汇利差、交易手续费、订阅制软件费、刷卡手续费分成，以及嵌入式金融客户的基础设施调用费。这种多元结构摊薄了对单一业务线的依赖，并在客户采购多款产品时放大交叉销售价值。公司
              2026 年公开宣传口径显示，这一交叉销售效应已相当显著。


              最具说服力的财务证据来自业务规模：Airwallex 披露 2026 年 3 月年化营收达 $1.3B，年化交易量达 $287B，并称目前超过 90%
              的收入来自采用多款产品的客户。这一数据印证了平台正深度嵌入客户财务运营，而非充当一次性转账工具。
            claimRefs:
