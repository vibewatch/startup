companyProfile:
  summary: >-
    Airwallex 是一家全球 B2B 金融基础设施平台，2015 年 1 月创立于墨尔本，由五位联合创始人联手打造：CEO Jack Zhang、总裁 Lucy Liu、Xijing Dai、Max Li 以及 Ki-lok
    Wong。公司于 2026 年 3 月年化营收突破 $1.3B，同比增长逾 74%，年化交易量达 $287B。2026 年 6 月，Airwallex 完成由 Addition 领投的 $320M H 轮融资，估值达
    $11B，累计融资金额达到约 $1.85B。公司称其在全球服务逾 200,000 家直接客户与 676,000 家企业，持有 85+ 张牌照，目前在新加坡与旧金山设立双总部。标杆企业客户案例包含 Google Cloud，2026
    年产品路线图重点推出面向自主金融与代理商业的 T:0 和 Airi。
