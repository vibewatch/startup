          - type: paragraph
            body: >-
              Jack Zhang 依然是对外代表与核心战略决策人。Lucy Liu
              出任总裁，技术与产品领导层依然由原初创始团队坐镇。公开信源未披露完整董事会席位或股东权利架构，治理评估受制于未上市企业的不透明度。话虽如此，公司运营规模已显著超过上一轮更新：Airwallex 称目前在 27
              处办公地点拥有逾 2,300 名员工，并在旧金山与新加坡设立双总部。


              这一全球版图具有战略意义，在于公司选择同步推进牌照准入广度、本地支付通道直连与区域销售覆盖。此类广度极难复刻，也解释了为何业务在开拓新区域与新产品线的同时，仍能持续签下大型企业客户。
