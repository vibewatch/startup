  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Airwallex serves a mix of internationally active SMBs, mid-market companies, and platform customers that need global payments, accounts, cards, and embedded finance workflows."
  },
  "sections": [
    {
      "id": "s1",
      "title": "Customer Segments",
      "body": "The customer base is best understood as three groups: businesses that need cross-border money movement, finance teams that need a multi-currency operating layer, and platforms that want to embed financial infrastructure into their own product. Airwallex\u2019s public messaging continues to emphasize that it serves more than 200,000 companies worldwide, and its recent reporting implies that direct users plus platform-served customers are materially larger than that direct base.\n\nThe key pattern is that customer adoption seems to widen after a first international expansion or when a platform wants to monetize finance workflows directly. That makes the company more of a workflow provider than a commodity transfer service.",
      "claimRefs": [
        "CU001",
        "CU002",
        "CU003",
        "CU004",
        "CU005",
        "CU006"
      ],
      "tableRefs": [
        "TU001"
      ],
      "figureRefs": [
        "FU001"
      ]
    },
    {
      "id": "s2",
      "title": "Named Customers, Proof, and Usage",
      "body": "Public case studies and logo references point to a customer mix that includes technology companies, online businesses, and globally active brands. The strongest proof is not just the logo list but the existence of repeatable case studies that show a workflow before-and-after result: faster onboarding, fewer fees, easier multi-currency control, and better spend workflow.\n\nBecause Airwallex is private, the public record does not give you full retention or cohort data. That means the best diligence proxy is whether named customers show up across multiple product surfaces and whether the same customer types recur in public stories. The evidence suggests that they do.",
      "claimRefs": [
        "CU007",
        "CU008",
        "CU009",
        "CU010",
        "CU011"
      ],
      "tableRefs": [
        "TU002",
        "TU003"
      ],
      "figureRefs": []
    },
    {
      "id": "s3",
      "title": "Concentration, Retention, and Expansion",
      "body": "The main customer risk is concentration in globally ambitious customers that can multi-home or switch to another provider if the workflow is not sticky enough. Airwallex appears to mitigate that by expanding from payments into cards, spend, billing, and embedded finance, which increases the number of daily touchpoints and the cost of replacement. The absence of public NRR or GRR remains the biggest gap, because customer scale alone does not prove customer durability.\n\nThe overall customer verdict is positive: Airwallex seems to have a credible mix of direct customers and platform customers, but the public evidence still leaves open questions on retention, concentration, and whether enterprise logos are truly productionized rather than pilot-heavy.",
      "claimRefs": [
        "CU012",
        "CU013",
        "CU014",
        "CU015",
        "CU016"
      ],
      "tableRefs": [],
      "figureRefs": []
    }
  ],
