  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              The practical market boundary for Airwallex is broader than cross-border transfers. It includes business
              accounts, multi-currency treasury, payout and acceptance rails, FX conversion, spend management, billing,
              and embedded finance APIs. Status-quo substitutes include bank wires, correspondent banking, card
              networks, local PSPs, payroll providers, expense tools, and manual finance operations. The company wins
              when customers want one control plane rather than a collection of point solutions.


              Demand is driven by the globalization of SMB commerce, distributed workforces, higher compliance
              expectations, and the tendency of software platforms to embed payments and banking features rather than
              build them themselves. That makes Airwallex less of a pure payments utility and more of an infrastructure
              layer for international finance operations.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
