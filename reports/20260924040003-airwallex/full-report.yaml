      - number: '3.3'
        title: Moat Durability and Risk
        blocks:
          - type: paragraph
            body: >-
              The main risk is commoditization. If customers only need a simple transfer or card program, banks and
              point providers can be good enough. Airwallex therefore has to keep moving up the stack into workflow
              automation, embedded finance, and AI-native finance tools. The company also has to prove that licensing
              breadth converts into durable share rather than just higher compliance cost.


              The current public evidence suggests Airwallex is competitive in complex international workflows, but the
              moat is still being tested against better-known brands and lower-cost substitutes. That means the
              diligence focus should stay on retention, cross-sell, and whether the product really becomes the system of
              record for finance teams.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Monetization
        blocks:
          - type: paragraph
            body: >-
              Airwallex monetizes a mix of FX spread, transaction fees, subscription-style software fees, card
              interchange, and infrastructure usage from embedded-finance customers. That mix matters because it reduces
              dependence on any one line of business and makes cross-sell more valuable as customers adopt multiple
              products. The company’s public 2026 messaging suggests this cross-sell effect is already material.


              The strongest financial evidence is scale: Airwallex reported $1.3B in annualized revenue and $287B in
              annualized transaction volume in March 2026, and it says more than 90% of revenue now comes from customers
              using multiple products. That is consistent with a platform that is becoming more deeply embedded in
              customer finance operations rather than acting as a one-off transfer tool.
