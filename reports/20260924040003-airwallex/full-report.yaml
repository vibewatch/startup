      - number: '4.3'
        title: Verdict on Quality of Earnings
        blocks:
          - type: paragraph
            body: >-
              The financial readout is attractive but incomplete. Airwallex looks like a high-growth, increasingly
              profitable platform with real cross-sell and a credible path to public-market scale. At the same time, the
              company has not published audited financial statements, product-line revenue, geographic revenue, gross
              margin, or NRR. Those gaps matter because they make it hard to compare Airwallex to public fintech peers
              or to judge how durable its growth is as it gets larger.


              The right conclusion is not “opaque therefore weak.” It is that the company has reached the stage where
              the quality of revenue, margin mix, and compliance costs are now the central underwriting questions. If
              those checks pass, the valuation can be defended; if they do not, the headline growth rate is less
              informative than it looks.
            claimRefs:
              - CI012
