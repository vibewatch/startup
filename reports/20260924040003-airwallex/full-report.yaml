      - number: '6.2'
        title: Named Customers, Proof, and Usage
        blocks:
          - type: paragraph
            body: >-
              Public case studies and logo references point to a customer mix that includes technology companies, online
              businesses, and globally active brands. The strongest proof is not just the logo list but the existence of
              repeatable case studies that show a workflow before-and-after result: faster onboarding, fewer fees,
              easier multi-currency control, and better spend workflow.


              Because Airwallex is private, the public record does not give you full retention or cohort data. That
              means the best diligence proxy is whether named customers show up across multiple product surfaces and
              whether the same customer types recur in public stories. The evidence suggests that they do.
            claimRefs:
              - CU007
              - CU008
