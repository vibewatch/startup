      - number: '1.3'
        title: Funding, Valuation, and Scale Milestones
        blocks:
          - type: paragraph
            body: >-
              The latest public financing event is a June 2026 Series H that raised $320M at an $11B valuation, led by
              Addition with participation from a broader late-stage investor set. Airwallex now describes itself as
              having reached $1.3B in annualized revenue in March 2026 and $287B in annualized transaction volume, with
              676,000 businesses served either directly or through the platform. This materially re-rates the company
              relative to the prior $8B valuation disclosed in December 2025.


              The fundraising cadence matters because it shows the company is still raising at an up-round while
              claiming profitability or near-profitability. That combination suggests the market now views Airwallex as
              a scaled infrastructure asset rather than a venture-stage experiment, but it also raises the bar on
              regulatory discipline, financial transparency, and capital allocation as the company pushes into AI native
              finance and agentic commerce.
