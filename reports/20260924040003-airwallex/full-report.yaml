      - number: '2.2'
        title: Sizing Lenses and Buyer Segments
        blocks:
          - type: paragraph
            body: >-
              A precise TAM for Airwallex is not public, so the better diligence approach is to triangulate via trade
              flows, spend-management budgets, and embedded-finance attach rates. The near-term SAM is the intersection
              of internationally active SMBs, mid-market companies, and software platforms that need regulated money
              movement in multiple jurisdictions. The strongest buyers are finance teams, operations leaders, and
              platform product teams that own cross-border cash flow or embedded financial products.


              Adoption tends to happen after a business outgrows a domestic-only stack. Triggers include new market
              entry, the need to pay contractors or suppliers abroad, multi-currency treasury complexity, or the desire
              to monetize payments directly inside a software product. Switching costs rise when the customer links
              compliance rules, account structures, reporting, and card issuance into the same operating workflow.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
