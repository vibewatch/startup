              - CM014
      - number: '2.3'
        title: Growth Drivers, Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The market tailwinds are clear: more businesses operate globally, platforms want to monetize financial
              features, and finance teams want software that reduces manual reconciliation. Countervailing forces are
              equally important. Regulation, licensing, KYC/AML controls, local-bank partnerships, and
              transaction-monitoring obligations create a cost curve that is easy to underestimate. Pricing is also
              competitive because many buyers can multi-home or fall back to bank wires when a workflow is simple
              enough.


              The key diligence question is not whether the market is large; it is whether Airwallex can keep
              translating regulatory breadth and product breadth into sustainable share gains as it expands in the US
              and in AI-driven workflows. That makes the company’s market opportunity real but operationally demanding,
              with execution quality more important than TAM slogans.
            claimRefs:
              - CM011
              - CM012
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape
        blocks:
          - type: paragraph
            body: >-
              The direct landscape includes Wise, Revolut Business, Stripe, Adyen, Payoneer, Nium, Brex, Ramp, Airbase,
              and Mercury, plus banks and internal build. Airwallex’s strongest wedge is that it combines global
              payments, accounts, cards, spend controls, and APIs under one regulatory umbrella. That breadth matters
              most when the customer is international from day one.


              By contrast, some rivals are narrower or have a different motion: Wise is strongest in cross-border
              transfers, Stripe and Adyen are payments-heavy infrastructure players, and Brex/Ramp are
              spend-management-first. This makes the market less a single head-to-head and more a battle over which
              workflow becomes the customer’s operating system for money movement.
