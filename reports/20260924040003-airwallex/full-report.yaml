      - number: '4.2'
        title: Pricing, Economics, and Capital Use
        blocks:
          - type: paragraph
            body: >-
              The company’s pricing appears to be usage-based and bundled rather than a single simple fee schedule. That
              helps capture value from larger customers but also creates more complexity in diligence because net
              pricing can vary by geography, product mix, and negotiated enterprise terms. The main financial question
              is therefore not just what Airwallex charges, but what it keeps after compliance, support, infrastructure,
              and partner costs.


              Public evidence suggests the economics are improving: Airwallex has described profitability milestones and
              has been able to raise another large round at an $11B valuation. The likely capital use is continued US
              expansion, regulatory licensing, and AI-native product development. The tension is that those investments
              could pressure near-term margins even if the long-term revenue base keeps expanding.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI014
