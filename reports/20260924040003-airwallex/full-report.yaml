      - number: '5.2'
        title: Architecture, Reliability, and Integration
        blocks:
          - type: paragraph
            body: >-
              The architecture appears to be API-first, with direct integration to local payment rails, cards, balances,
              and billing primitives. GitHub repositories, GitLab customer materials, and Airwallex’s own developer and
              docs content suggest an engineering organization that treats the product as infrastructure rather than as
              a front-end app. That distinction matters because infrastructure quality is judged by integration depth,
              uptime, and compliance controls, not just UI polish.


              The key diligence point is that a more complex product surface usually means more operational
              dependencies: bank partners, card networks, settlement partners, cloud services, and jurisdiction-specific
              rules. Airwallex seems to be betting that its owned regulatory and settlement layers can turn that
              complexity into a moat rather than a drag.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE002
