  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments
        blocks:
          - type: paragraph
            body: >-
              The customer base is best understood as three groups: businesses that need cross-border money movement,
              finance teams that need a multi-currency operating layer, and platforms that want to embed financial
              infrastructure into their own product. Airwallex’s public messaging continues to emphasize that it serves
              more than 200,000 companies worldwide, and its recent reporting implies that direct users plus
              platform-served customers are materially larger than that direct base.


              The key pattern is that customer adoption seems to widen after a first international expansion or when a
              platform wants to monetize finance workflows directly. That makes the company more of a workflow provider
              than a commodity transfer service.
