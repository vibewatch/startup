  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface Area
        blocks:
          - type: paragraph
            body: >-
              The product surface is broad: global accounts, cross-border payments, FX, corporate cards, spend
              management, billing, and embedded finance APIs. In 2026 the company added T:0 and Airi to its roadmap,
              signaling a push into autonomous finance and agentic commerce rather than only settlement and card
              issuance. That shift matters because it moves the product from “move money” into “run finance workflows.”


              The relevant design question is whether the surface area is coherent enough to stay easy for customers to
              adopt. Airwallex’s public materials suggest that the answer depends on the customer type: finance teams
              want a consolidated workflow, while platform customers want API primitives and local rails that they can
              embed into their own product experience.
            claimRefs:
              - CE001
