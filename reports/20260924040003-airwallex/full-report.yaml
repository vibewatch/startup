              - CE014
      - number: '5.3'
        title: Trust, Compliance, and Roadmap
        blocks:
          - type: paragraph
            body: >-
              Trust and compliance are not side issues for Airwallex; they are part of the product. The company’s
              licensing footprint, AML/CTF scrutiny, and issuer-response documentation all show that reliability and
              regulatory execution are core product attributes. That means the roadmap has to balance speed with
              control. The introduction of AI-native finance products raises the bar because automation without strong
              controls would be unusable for finance teams.


              The technology verdict is favorable but conditional: Airwallex appears to have built enough infrastructure
              depth to support expansion, but the next phase will depend on whether it can keep the platform compliant,
              observable, and easy to integrate while layering more AI behavior on top.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
