      basis: Public leadership and hiring signals.
  - id: TV001
    title: Recommendation summary table
    columns:
      - Field
      - Value
      - Basis
    rows:
      - - Recommendation
        - Track / conditional watch
        - Real scale, but still private and disclosure-light
      - - Confidence
        - Medium
        - Public evidence is strong but incomplete
      - - Risk rating
        - High
        - Compliance and execution risk remain material
      - - Valuation stance
        - Fair
        - $11B is supportable if growth and margin quality persist
    notes: This is not a public-market-style DCF; it is an evidence-based diligence stance.
    claimRefs:
      - CV001
      - CV002
      - CV009
    enumerationScope:
      coverage: partial
      basis: Public disclosures, analyst context, and current financing events.
  - id: TV002
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation signal
      - What would change it
    rows:
      - - Bull
        - Multi-product and AI adoption accelerate
        - Multiple stays elevated
        - Sustained growth + margin expansion
      - - Base
        - Growth continues at a more normal rate
        - Fair value around current level
        - Good execution but slower momentum
      - - Bear
        - Compliance, pricing, or customer friction slow growth
        - Multiple compresses
        - Audit issues or weak retention
    notes: Scenarios are directional and meant to frame diligence rather than forecast exact financial outcomes.
    claimRefs:
      - CV013
      - CV014
      - CV015
    enumerationScope:
      coverage: partial
      basis: Public performance signals and private-company diligence assumptions.
  - id: TV003
    title: Comparable valuation table
    columns:
      - Comparable
      - Why it matters
      - Relative read-through
    rows:
      - - Wise
        - Cross-border payments / accounts benchmark
        - Useful lower-breadth comparator
      - - Stripe
        - Infrastructure and platform software comparator
        - Higher-scale infrastructure comp
      - - Adyen
        - Enterprise payments benchmark
        - Enterprise trust comparator
      - - Payoneer
        - Cross-border SMB payments comp
        - Closer workflow overlap
      - - Revolut Business
        - Business banking / cards comp
        - Broader banking comparator
    notes: Public comps are only directional because each company has a different product mix and geography mix.
    claimRefs:
      - CV007
      - CV008
      - CV010
    enumerationScope:
      coverage: partial
      basis: Public-market fintech peers and category-adjacent private comparables.
