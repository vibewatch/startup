      - number: '6.3'
        title: Concentration, Retention, and Expansion
        blocks:
          - type: paragraph
            body: >-
              The main customer risk is concentration in globally ambitious customers that can multi-home or switch to
              another provider if the workflow is not sticky enough. Airwallex appears to mitigate that by expanding
              from payments into cards, spend, billing, and embedded finance, which increases the number of daily
              touchpoints and the cost of replacement. The absence of public NRR or GRR remains the biggest gap, because
              customer scale alone does not prove customer durability.


              The overall customer verdict is positive: Airwallex seems to have a credible mix of direct customers and
              platform customers, but the public evidence still leaves open questions on retention, concentration, and
              whether enterprise logos are truly productionized rather than pilot-heavy.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Compliance Risk
        blocks:
          - type: paragraph
            body: >-
              The clearest current risk is regulatory scrutiny. Airwallex was ordered by AUSTRAC to undergo an external
              audit in 2026, which means regulators are actively testing the company’s AML/CTF controls. That is not
              unusual for a global payment platform, but it is material because it can lead to remediation cost, slower
              expansion, or more conservative product rollout.


              The company’s licensing footprint is also a double-edged sword: it enables expansion, but each
              jurisdiction adds compliance complexity, reporting obligations, and operational overhead. That makes the
              business structurally dependent on strong controls and senior management attention, not just product
              growth.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
