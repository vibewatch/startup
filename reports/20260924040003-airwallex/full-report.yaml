      - number: '3.2'
        title: Feature Breadth, Pricing, and GTM
        blocks:
          - type: paragraph
            body: >-
              Airwallex competes by bundling enough functionality that the customer can retire multiple point tools.
              That helps when buying decisions are made by finance and operations teams that want fewer vendors and
              fewer reconciliations. The drawback is that breadth can complicate pricing, onboarding, and support,
              particularly for customers that only need a single function.


              In practice, the company’s moat is not just product breadth. It is also the licensing footprint, local
              rails, and the ability to serve platform customers without forcing them to rebuild compliance and money
              movement from scratch. That is a harder story for pure software competitors to copy quickly.
            claimRefs:
              - CP007
