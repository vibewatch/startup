  topStrengths:
    - $1.3B ARR and more than $287B in annualized transaction volume demonstrate real product-market fit at scale
    - 85+ licenses across major regions create a hard-to-replicate regulatory moat
    - More than 90% multi-product revenue suggests strong cross-sell and platform lock-in
    - AI-native finance products (T:0 and Airi) add new upside beyond the core payments business
    - Large enterprise and platform references show the company can operate at meaningful customer scale
  topRisks:
    - Regulatory and AML/CTF scrutiny can slow expansion and create remediation cost
    - No audited financials, no gross-margin disclosure, and no NRR data leave the quality of earnings unverified
    - Founder concentration remains high around Jack Zhang
    - US expansion and AI roadmap add execution complexity on top of already broad geographic reach
    - Customer multi-homing and competitive pressure can compress pricing if the workflow is not sticky enough
  unresolvedGaps:
    - Audited financial statements and revenue breakdown by geography/product line
    - Cap table, investor preferences, board composition, and formal governance structure
    - Net revenue retention, gross retention, and customer cohort data
    - Gross margin, EBITDA margin, and operating leverage trajectory
    - US revenue run-rate and pipeline by segment
    - Regulatory enforcement history, open investigations, and compliance posture across jurisdictions
