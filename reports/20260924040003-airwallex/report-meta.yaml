    cards, expense management, billing, embedded finance APIs, and AI-native finance products T:0 and Airi.
  customerFocus: >-
    International SMBs, mid-market finance teams, marketplace operators, and software platforms that need global money
    movement and embedded financial infrastructure.
  businessModel: >-
    Revenue from FX spread, payment-processing fees, subscription or workflow fees, card interchange, and
    embedded-finance API usage. More than 90% of revenue comes from customers using more than one product, supporting a
    multi-product monetization model.
