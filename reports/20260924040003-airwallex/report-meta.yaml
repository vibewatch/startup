companyProfile:
  summary: >-
    Airwallex is a Melbourne-founded (January 2015) global B2B financial infrastructure platform built by five
    co-founders: Jack Zhang (CEO), Lucy Liu (President), Xijing Dai, Max Li, and Ki-lok Wong. The company crossed $1.3B
    in annualized revenue in March 2026, with 74%+ YoY growth and $287B in annualized transaction volume. In June 2026,
    Airwallex raised $320M in a Series H at an $11B valuation led by Addition, bringing total funding to roughly $1.85B.
    The company says it serves more than 200,000 direct customers and 676,000 businesses worldwide, operates with 85+
    licenses, and now co-headquarters in Singapore and San Francisco. Major enterprise references include Google Cloud
    case-study coverage, and the 2026 roadmap highlights T:0 and Airi for autonomous finance and agentic commerce.
