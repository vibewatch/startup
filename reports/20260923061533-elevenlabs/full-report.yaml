  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              ElevenLabs, Inc. is a privately held AI-audio-infrastructure company headquartered in New York, NY, with
              additional hubs in London and Warsaw. Founded in January 2022 by Mati Staniszewski (CEO) and Piotr
              Dąbkowski (CTO), the company launched its public platform in January 2023. ElevenLabs builds foundational
              AI models for speech synthesis, voice cloning, real-time conversational AI agents, and audio content
              localization. Its business model combines a freemium self-serve layer (starting at $22/month for creators)
              with enterprise SaaS contracts that can reach $2M+ annually. The company generates revenue from API usage,
              per-robot/per-seat subscriptions, and platform licensing, with approximately 50/50 split between
              self-serve and enterprise revenue as of late 2025. ElevenLabs describes its mission as making "speech the
              new standard for digital interaction" and building the most comprehensive audio AI platform in the world.
