      - number: '1.3'
        title: Funding History and Investors
        blocks:
          - type: paragraph
            body: >-
              ElevenLabs has raised approximately $781M across five rounds since 2022. The seed round of $2M in 2022
              established the company; a Series A of $19M in January 2023 funded the public platform launch. The $80M
              Series B (January 2024) at a $1.1B valuation marked its unicorn status. The $180M Series C (January 2025)
              led by a16z and ICONIQ Growth tripled the valuation to $3.3B. The $500M Series D (February 2026) led by
              Sequoia Capital pushed the valuation to $11B—a 10× increase in two years. Strategic investors include
              Deutsche Telekom, LG Technology Ventures, HubSpot Ventures, NTT DOCOMO Ventures, RingCentral Ventures, and
              Salesforce Ventures. Other financial investors include Lightspeed Venture Partners, NEA, Bond Capital,
              Andreessen Horowitz, Coatue, and SV Angel. The company reported approximately $550M in cash on hand after
              the Series D, providing extended runway. No debt facilities have been disclosed. Secondary transactions or
              insider tender offers have not been publicly confirmed.
