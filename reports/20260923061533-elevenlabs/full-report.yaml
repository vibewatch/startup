      - number: '1.2'
        title: Founders and Leadership
        blocks:
          - type: paragraph
            body: >-
              The company was co-founded by two childhood friends from Poland. Mati Staniszewski, CEO, previously worked
              as a deployment strategist at Palantir Technologies; Piotr Dąbkowski, CTO, was a machine learning engineer
              at Google. Both were motivated by the poor quality of voice dubbing in American films distributed to
              Polish audiences. Dąbkowski was named a TIME Magazine AI Top 100 Innovator. The founding team built the
              company as a tight two-person technical team before scaling. By January 2025, headcount had grown from 30
              to 120 employees, with offices in London, New York, and Warsaw. By late 2025, headcount reached
              approximately 330. The company has not disclosed a CFO or COO publicly; both founders occupy all primary
              executive roles. Sequoia partner Andrew Reed joined the board in conjunction with the February 2026 Series
              D. Key-person dependency on the two founding co-CEOs/CTOs is a material risk given the early-stage
              leadership structure.
