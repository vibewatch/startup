  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risks
        blocks:
          - type: paragraph
            body: >-
              ElevenLabs operates at the intersection of AI, biometric data, and consumer communications — three of the
              most actively regulated technology domains globally. The FCC's January 2024 ruling (DA-24-146) declaring
              AI-generated voices in robocalls illegal under the TCPA is the most immediate regulatory risk, directly
              affecting ElevenLabs' enterprise telephony customers. Any customer deploying ElevenLabs' Conversational AI
              platform for outbound automated calls without prior written consumer consent is now in violation of
              federal law, creating compliance liability that flows through to ElevenLabs if customers rely on its API
              as an unguarded tool. In Europe, the EU AI Act and GDPR create a dual compliance burden. The EU AI Act's
              Article 52 requires AI-generated voice outputs to be clearly labelled; any ElevenLabs customer
              distributing synthetic audio in the EU without such disclosure risks fines under the Act. Simultaneously,
              the European Data Protection Board has indicated that voice prints generated during voice cloning
              constitute biometric data under GDPR Article 9, requiring explicit informed consent. This significantly
              increases the overhead for ElevenLabs' European enterprise customers and could slow EU market adoption. On
              the litigation front, ElevenLabs has not faced a major filed lawsuit as of early 2026, but the sector has
              entered a period of active legal action from voice actors and rights holders. The removal of ElevenLabs'
              'Adam' default voice in 2023 following misuse to recreate non-consensual celebrity content demonstrated
              the company's reactive stance, raising questions about whether proactive IP clearance for default voice
              training data has been sufficient. SAG-AFTRA's ongoing AI voice negotiations with entertainment studios,
              and EFF's analysis highlighting fragmented right-of-publicity laws across 35 US states, confirm that the
              legal landscape is unstable. The FTC's Voice Cloning Challenge (January 2024) signals regulatory intent to
              impose safety standards on AI voice APIs. US Congressional hearings in 2024-2025 following the Biden
              deepfake robocall incident have increased the probability of federal legislation within ElevenLabs'
              investment horizon. ElevenLabs' CEO has committed publicly to regulatory engagement and a compliance
              roadmap, but the adequacy of its trust-and-safety measures has not been independently audited.
            claimRefs: []
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: figure
            figureRef: FR001
            claimRefs:
