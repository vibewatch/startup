        - Independent audit of content safety efficacy not available
      - - GPU capacity constraints increasing latency or inference costs
        - Low-Medium – NVIDIA supply chain risks
        - Medium – SLA violations, margin compression
        - Low – no disclosed capacity hedging strategy
        - Medium – NVIDIA dependency unhedged
        - No public multi-supplier GPU strategy disclosed
      - - Self-serve API abuse generating excess GPU costs
        - Medium – API-first model structurally exposed
        - Medium – unit economics impacted below headline ARR
        - Medium – rate limiting and abuse detection in place
        - Medium – structural exposure ongoing
        - Abuse loss rate not publicly disclosed
      - - Security breach of voice print biometric data
        - Low – no reported incidents to date
        - Very High – GDPR fines, customer loss, regulatory escalation
        - Low – no public independent security audit
        - High – biometric data high-value target
        - No SOC 2 or ISO 27001 certification status disclosed
