      - Supporting Evidence
      - Anti-Thesis Risk
      - Monitoring Signal
    rows:
      - - Voice AI platform dominance
        - 175% YoY ARR, 3K+ voices, 32 langs, Flash <75ms latency
        - BigTech bundles TTS at near-zero cost within 18-24 months
        - OpenAI/Google TTS API pricing trend; MOS quality benchmarks
      - - Durable quality moat
        - MOS benchmark leadership, instant voice cloning, AI Dubbing
        - Open-source TTS reaches 95%+ MOS parity by 2026
        - Hugging Face TTS leaderboard; enterprise open-source adoption
      - - Enterprise expansion flywheel
        - ARR per employee $825K; enterprise growing >200% YoY
        - NRR declines below 120% as enterprise churn accelerates
        - Quarterly NRR disclosure; Series E data room
      - - Category leader multiple
        - Top-tier investor syndicate; 33× ARR within AI SaaS range
        - Regulatory restrictions constrain enterprise telephony TAM
        - FTC rulemaking progress; FCC TCPA enforcement actions
      - - Platform network effects
        - Voice Library creator/user flywheel; 3000+ contributed voices
