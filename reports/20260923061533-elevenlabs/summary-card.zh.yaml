summary:
  headline: >-
    ElevenLabs 是 AI 语音基础设施领域的标杆公司：ARR 同比增长 175%，投资方阵容强劲，音质优势构成了扎实的护城河。但按 33× ARR 估值进入 Series D，
    新投资者的回报空间已被压缩；投资逻辑能否成立，取决于平台价值能否抵御 BigTech 的捆绑竞争。
