company:
  name: ElevenLabs
chapter:
  number: 1
  title: Company Overview
  summary: 'ElevenLabs is a New York-based AI audio platform founded in 2022 by Polish entrepreneurs Mati Staniszewski and Piotr Dabkowski. The company builds text-to-speech, voice cloning, AI dubbing, and conversational AI agent infrastructure. It reached a $11B valuation in February 2026 after raising $500M Series D led by Sequoia Capital. ARR hit $330M at end-2025 on 175% YoY growth. The company is privately held, pre-IPO, and faces material reputational risk from deepfake/misuse controversies.

    '
sections:
- id: s1
  title: Identity and Business Model
  body: ElevenLabs, Inc. is a privately held AI-audio-infrastructure company headquartered in New York, NY, with additional hubs in London and Warsaw. Founded in January 2022 by Mati Staniszewski (CEO) and Piotr Dąbkowski (CTO), the company launched its public platform in January 2023. ElevenLabs builds foundational AI models for speech synthesis, voice cloning, real-time conversational AI agents, and audio content localization. Its business model combines a freemium self-serve layer (starting at $22/month for creators) with enterprise SaaS contracts that can reach $2M+ annually. The company generates revenue from API usage, per-robot/per-seat subscriptions, and platform licensing, with approximately 50/50 split between self-serve and enterprise revenue as of late 2025. ElevenLabs describes its mission as making "speech the new standard for digital interaction" and building the most comprehensive audio AI platform in the world.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  figureRefs:
  - FO001
  tableRefs:
  - TO001
- id: s2
  title: Founders and Leadership
  body: The company was co-founded by two childhood friends from Poland. Mati Staniszewski, CEO, previously worked as a deployment strategist at Palantir Technologies; Piotr Dąbkowski, CTO, was a machine learning engineer at Google. Both were motivated by the poor quality of voice dubbing in American films distributed to Polish audiences. Dąbkowski was named a TIME Magazine AI Top 100 Innovator. The founding team built the company as a tight two-person technical team before scaling. By January 2025, headcount had grown from 30 to 120 employees, with offices in London, New York, and Warsaw. By late 2025, headcount reached approximately 330. The company has not disclosed a CFO or COO publicly; both founders occupy all primary executive roles. Sequoia partner Andrew Reed joined the board in conjunction with the February 2026 Series D. Key-person dependency on the two founding co-CEOs/CTOs is a material risk given the early-stage leadership structure.
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO008
  - CO009
  tableRefs:
  - TO002
  figureRefs: []
- id: s3
  title: Funding History and Investors
  body: ElevenLabs has raised approximately $781M across five rounds since 2022. The seed round of $2M in 2022 established the company; a Series A of $19M in January 2023 funded the public platform launch. The $80M Series B (January 2024) at a $1.1B valuation marked its unicorn status. The $180M Series C (January 2025) led by a16z and ICONIQ Growth tripled the valuation to $3.3B. The $500M Series D (February 2026) led by Sequoia Capital pushed the valuation to $11B—a 10× increase in two years. Strategic investors include Deutsche Telekom, LG Technology Ventures, HubSpot Ventures, NTT DOCOMO Ventures, RingCentral Ventures, and Salesforce Ventures. Other financial investors include Lightspeed Venture Partners, NEA, Bond Capital, Andreessen Horowitz, Coatue, and SV Angel. The company reported approximately $550M in cash on hand after the Series D, providing extended runway. No debt facilities have been disclosed. Secondary transactions or insider tender offers have not been publicly confirmed.
  claimRefs:
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
