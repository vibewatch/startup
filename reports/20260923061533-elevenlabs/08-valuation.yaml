- id: TV001
  title: ElevenLabs Recommendation Summary
  columns:
  - Dimension
  - Assessment
  - Rationale
  rows:
  - - Overall Recommendation
    - Watch / Conditional Buy
    - Strong growth and investor syndicate justify valuation; return profile compressed at Series D entry for new investors
  - - Confidence Level
    - Medium
    - ARR growth and quality moat are verifiable; margin, NRR, and customer concentration are estimated, not disclosed
  - - Risk Rating
    - Medium-High
    - Regulatory (FCC/EU AI Act), competitive (BigTech TTS bundling), and reputational (deepfake) risks are material but not imminent
  - - Valuation Stance
    - Fairly Valued at $11B (33× ARR)
    - Modest premium to AI SaaS public comps at 25-33× NTM; within range for a category leader at 175% growth
  - - Target Return (Bull Case)
    - 1.5-2.2× in 5 years (IPO 2028-2029)
    - Requires $900M+ ARR and 18-22× multiple at IPO; achievable in bull case
  - - Target Return (Base Case)
    - 0.7-1.0× (flat to slight upside)
    - Base case ARR of $600-750M at 12-15× multiple yields flat to modest uplift from $11B entry
  - - Hold Recommendation
    - 5-7 years for current investors
    - Voice AI platform thesis needs full enterprise telephony and Conversational AI cycle to play out
  - - Exit Recommendation
    - IPO preferred; strategic acquisition possible
    - M&A buyer (Microsoft, Apple, Salesforce) possible at $15-20B; IPO preferred for valuation maximization
