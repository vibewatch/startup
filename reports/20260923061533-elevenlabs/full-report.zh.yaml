      - number: '2.3'
        title: 采购方与客群画像
        blocks:
          - type: paragraph
            body: >-
              ElevenLabs 的客户分为自下而上的开发者与创作者，以及自上而下采购的企业。开发者与创作者预计贡献约 50% 收入，包括在应用和游戏中调用 API 的独立开发者、制作播客及 YouTube
              内容的创作者，以及希望自动处理客户互动的小微团队。企业客户约占收入的 50%，包括授权 ElevenLabs 用于内容制作和配音的媒体出版机构（TIME、Washington
              Post、HarperCollins）；部署对话式 AI 智能体的客服平台与联络中心；用于游戏内语音的游戏工作室（Paradox
              Interactive）；兼具投资方与分发渠道双重身份的电信运营商（Deutsche Telekom、NTT
              DOCOMO）；以及教育科技平台（Chess.com、Praktika）。企业级核心采购决策人多为首席数字官（CDO）、CTO 或客户体验负责人；开发者客群则以直接调用 API
              的工程师或初创企业创始人为主。企业级合同的预算归属通常为 IT 或数字化转型预算，而非营销预算。采购流程中的关键落地阻力在于涉及 AI 生成语音处理的安全合规审查，在强监管行业尤为突出。
