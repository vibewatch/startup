        title: 创始人与管理团队
        blocks:
          - type: paragraph
            body: >-
              两位来自波兰的儿时好友共同创办了 ElevenLabs。CEO Mati Staniszewski 曾在 Palantir Technologies 担任部署策略师；CTO Piotr Dąbkowski 曾是
              Google 机器学习工程师。两人创业的起因，是不满在波兰上映的美国电影配音质量不佳。Dąbkowski 入选《时代》周刊 AI 百大创新者。早期公司由两人组成紧密协作的技术团队，之后才扩招：员工从 30 人增至
              120 人，截至 2025 年 1 月，公司已在伦敦、纽约和华沙设有办公室；到 2025 年底，员工约 330 人。公司未公开 CFO 或 COO，两位创始人承担主要高管职责。Sequoia 合伙人 Andrew
              Reed 随 2026 年 2 月 Series D 加入董事会。公司仍处早期管理阶段，对两位创始人的依赖是实质性风险。
