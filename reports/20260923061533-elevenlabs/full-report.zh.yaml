      - number: '5.3'
        title: 信任与安全机制及潜在技术风险
        blocks:
          - type: paragraph
            body: >-
              ElevenLabs 的信任与安全仍是重要风险。《消费者报告》2025 年 3 月评估发现，行业内包括 ElevenLabs
              在内的声音克隆服务，主要靠容易绕过的同意勾选框保护用户。「禁用声音」名单可保护具名公众人物， 但依赖姓名匹配而非声纹识别，仍可能被绕过用于语音诈骗。围绕 Adam 和 Bella 默认 TTS
              声音的配音演员诉讼，也让其训练数据来源受到质疑。公司计划为 AI 生成音频加入加密溯源元数据， 但截至 2025 年中尚未上线。公司在 2026 年初公布的面向 2026 年自主 AI
              音频路线图，显示战略可能从语音工具转向音频智能体；这会扩大产品覆盖面，也扩大滥用面。

              公司依赖大型云厂商提供 GPU，AWS 或 Google Cloud 算力中断会直接影响 API 可用性。没有本地部署，也使其无法服务禁止第三方云处理数据的受监管行业；Resemble AI 和 Deepgram
              正利用这一缺口。 BigTech 捆绑 TTS 的威胁真实存在，但目前仍受语音自然度差距制约。ElevenLabs 必须持续投入模型，才能守住这项优势。
