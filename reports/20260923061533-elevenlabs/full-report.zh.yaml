      - number: '2.2'
        title: 市场规模测算 —— TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >-
              多家分析机构认为，2024 年核心 AI 语音生成市场约为 $3B；MarketsandMarkets 预测，到 2030 年该市场将以 37% CAGR 增至 $20.4B。Grand View
              Research 预测略高，预计 2030 年达 $21.75B（CAGR 29.6%）。涵盖 ASR、语音助手与 TTS 的更广义语音 AI 市场预计到 2030 年超过 $70B。ElevenLabs
              的可服务市场（SAM）是其 API 与企业合同可触达的部分，包括企业 AI 音频、对话式 AI 智能体基础设施及 AI 媒体本地化。按企业联络中心 AI（约 $4B）、媒体与出版语音 AI（$2B）及开发者
              API 基础设施（$2–4B）估算，到 2027 年该 SAM 约为 $8–12B。按当前轨迹，到 2027 年可获得市场（SOM）约为 $1–1.5B；在公司披露的增速下适度拿下企业份额，对应 ARR 达
              $500–700M。2025 年，ElevenLabs ARR 为 $330M，而总市场约 $4B，在核心 AI 语音生成市场的份额约为 7–8%。
