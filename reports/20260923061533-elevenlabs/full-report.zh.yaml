      - number: '4.3'
        title: 财务数据缺口与尽调核查要点
        blocks:
          - type: paragraph
            body: >-
              头部指标虽亮眼，ElevenLabs 的公开财务披露仍有关键缺口，投资人必须在承诺出资前补齐。公司未公开毛利率，公开投资材料也没有 NRR 或 GRR。缺少按职能拆分的员工数据，就无法计算 CAC
              和回本周期；烧钱速度也未获确认。公司据称已盈利，但未经独立审计。客户集中度同样未知：若少数大客户贡献超过 20% ARR，收入质量判断将明显改变。

              围绕 Adam 和 Bella 默认 TTS 声音的配音演员诉讼，是一项尚未公开量化的或有负债。若诉讼导致赔偿，或迫使公司重训、下架这些声音模型，财务影响可能重大。收入确认政策也只是推断，尚未核实；
              订阅和按量收入在递延收入及现金回款相对 ARR 的时点上并不相同。总体看，ElevenLabs
              增长快、资本效率高，但毛利率、NRR、CAC、流失率和烧钱速度等尽调所需数据尚无公开来源，任何投资都应以公司提供这些资料为前提。
