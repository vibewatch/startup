    title: 公司概况
    sections:
      - number: '1.1'
        title: 业务定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              ElevenLabs, Inc. 是一家非上市 AI 音频基础设施公司，总部位于纽约，另在伦敦和华沙设有办公点。Mati Staniszewski（CEO）与 Piotr Dąbkowski（CTO）于 2022
              年 1 月创立公司，公开平台于 2023 年 1 月上线。ElevenLabs 研发语音合成、声音克隆、实时对话式 AI 智能体和音频本地化所需的基础模型。收入模式由免费增值的自助服务层 （创作者套餐每月 $22
              起）和企业 SaaS 合同组成，单笔合同年额可达 $2M 以上；收入来自 API 用量、按机器人或席位收费的订阅，以及平台授权。截至 2025 年底，自助服务与企业收入约各占一半。
              公司称其使命是让「语音成为数字交互的新标准」，并打造全球最全面的音频 AI 平台。
