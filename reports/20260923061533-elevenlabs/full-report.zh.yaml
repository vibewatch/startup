      - number: '3.2'
        title: 竞品画像与定位分析
        blocks:
          - type: paragraph
            body: >-
              Cartesia AI 于 2024 年 9 月结束隐身状态，并完成 Andreessen Horowitz 领投的 $80M 融资。其语音合成延迟为 40–95ms，比 ElevenLabs
              更低；公司还声称处理复杂文本时不会产生幻觉。 每千字符 $0.038 的定价在同等用量下也远低于 ElevenLabs。Cartesia 的短板在于声音库规模较小（约 130 种声音）、支持语种偏少（约 15 至
              20 种）且多语言覆盖深度不足。Resemble AI 则凭借深度伪造检测、来源水印溯源、面向合规行业的本地私有化部署以及 149 种语言支持构筑差异化，瞄准优先考虑合规的客户。Play.ht
              依靠声音库广度（900 多种声音、142 种语言）参与竞争，但语音自然度不及 ElevenLabs。Murf AI 依靠易用的工作台界面与平价订阅服务非技术内容团队，但没有实时合成 API。OpenAI 的
              TTS API 音质较弱，却能接入其生态；2024 年推出的 GPT-4o 实时音频模式，则对 ElevenLabs 的对话式 AI 智能体构成长期威胁。VocalCopyCat 在 2025
              年的批判性分析认为，ElevenLabs 的商业成功可能跑在技术领先优势前面，延迟和定价上已有可信对手。 开发者社区的对比也有类似判断，但尚未出现企业合同因此转向竞品的证据。
