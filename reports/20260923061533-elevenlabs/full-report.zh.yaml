  - id: FO001
    title: ElevenLabs 里程碑时间线
    type: timeline
    summary: 梳理公司创立、融资历程、产品上线、增长里程碑、负面事件以及 2026 年 2 月 Series D 轮融资的时间线。
    data:
      items:
        - date: 2022-01
          label: 公司成立
          detail: Mati Staniszewski 与 Piotr Dąbkowski 发现面向波兰受众的语音配音质量欠佳，随后在纽约创立 ElevenLabs。
          tone: neutral
        - date: 2023-01
          label: 公开发布
          detail: 公开平台正式上线，公司开始将文本转语音（TTS）与声音克隆商业化变现。
          tone: positive
        - date: 2024-01
          label: Series B 轮 / 晋升独角兽
          detail: ElevenLabs 以 $1.1B 估值完成 $80M 融资，正式迈入独角兽行列。
          tone: positive
        - date: 2024-01
          label: 拜登语音自动电话事件
          detail: 利用 ElevenLabs 生成声音伪造拜登语音的自动拨号电话事件，引发监管调查与声誉风险。
          tone: negative
        - date: 2025-01
          label: Series C 轮
          detail: ElevenLabs 以 $3.3B 估值完成 $180M 融资，进一步扩充投资人阵容。
          tone: positive
        - date: 2026-02
          label: Series D 轮
          detail: ElevenLabs 以 $11B 估值完成由 Sequoia 领投的 $500M 融资。
          tone: positive
