  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律合规风险
        blocks:
          - type: paragraph
            body: >-
              ElevenLabs 同时处于 AI、生物识别数据和消费者通信三个监管密集领域。FCC 2024 年 1 月裁定（DA-24-146）将 AI 生成语音用于自动拨打电话纳入 TCPA
              禁令，是眼前最直接的监管风险， 影响 ElevenLabs 的企业电话客户。客户若未事先取得消费者书面同意，就用其 Conversational AI 平台拨打自动电话，便违反联邦法律；若客户把 API
              当作没有安全护栏的工具使用，责任也可能延伸至 ElevenLabs。欧洲则同时受 EU AI Act 和 GDPR 约束：EU AI Act 第 52 条要求清楚标注 AI
              生成的语音；在欧盟传播未标注合成语音的客户可能面临罚款。欧洲数据保护委员会也表示， 声音克隆产生的声纹属于 GDPR 第 9
              条所称的生物识别数据，须取得明确知情同意。这会增加欧洲企业客户的合规成本，也可能拖慢市场采用。

              截至 2026 年初，ElevenLabs 尚未卷入重大已立案诉讼，但配音演员和权利人正在对行业采取法律行动。2023 年，公司因有人滥用 Adam 默认音色仿造未经同意的名人内容而将其下架；
              这一事后应对引发外界对默认音色训练数据是否充分清权的疑问。SAG-AFTRA 与娱乐公司的 AI 声音谈判，以及 EFF 对美国 35 个州肖像权法律碎片化的分析，都显示法律环境仍不稳定。 FTC 2024 年
              1 月发起的 Voice Cloning Challenge，释放出可能为 AI 语音 API 设定安全标准的信号。拜登深伪自动电话事件后的 2024-2025
              年国会听证会，也提高了投资期内出台联邦立法的可能性。 ElevenLabs CEO 已承诺参与监管讨论并推进合规路线图，但其信任与安全措施尚未经过独立审计。
