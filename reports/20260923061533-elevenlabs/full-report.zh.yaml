      - number: '4.2'
        title: 单体经济学与资本效率
        blocks:
          - type: paragraph
            body: >-
              以晚期 AI 创业公司披露的数据衡量，ElevenLabs 的单位经济表现位居前列：约 400 名员工创造 $330M ARR，人均 ARR 约 $825,000，这一指标位于行业前十分位， 可与
              Snowflake、Datadog 等顶尖上市 SaaS 公司相比，也高于同阶段多数创业公司。据报道，公司在 2025 年中 ARR 约 $200M 时已实现运营盈亏平衡；按现有团队规模，新增 ARR
              可能显著增厚营业利润。公司未披露毛利率，分析师估算为 70%-80%；这与 API 模式相符，模型效率提升可逐步降低算力成本。

              资本效率也强。截至 2026 年 2 月，公司累计融资约 $781M，对应 $330M ARR，融资额约为 ARR 的 2.4×；Anthropic 和 OpenAI 在同等收入规模下分别超过 10× 和
              15×。完成 $500M Series D 后，公司报告持有约 $550M 现金，即使维持增长期的烧钱速度，也可支撑数年运营。公司未披露债务。ElevenLabs 称，其资本策略是稳步打造可持续业务、
              以产品驱动扩张，而不是不计代价冲收入。
