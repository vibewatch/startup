  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与业务范围
        blocks:
          - type: paragraph
            body: >-
              ElevenLabs 的业务跨越三个相邻但相互独立的细分市场：（1）AI 文本转语音（TTS）与语音合成基础设施，涵盖面向开发者、出版商及创作者以 API 形式提供的文本生成语音服务；（2）AI
              声音克隆与定制化，面向企业端打造品牌专属或个性化声音标识；（3）对话式 AI 智能体基础设施，为客户服务、销售、教育与游戏等场景提供实时语音交互智能体。公司还依托支持 32 种语言的配音产品切入 AI
              音频本地化与配音市场。非核心范围包括：语音识别/ASR（转录）、用于身份验证的声音生物识别，以及通用语音助手（如 Alexa、Siri 级别）。现有替代方案包括真人配音演员（用于内容创作）、传统
              IVR/呼叫中心电话系统（用于客户服务）以及人工配音工作室（用于本地化）。AI 智能体市场是战略意义最突出的相邻赛道，ElevenLabs 在该领域直面 OpenAI Realtime API、Google
              TTS、Amazon Polly 以及 Deepgram、Cartesia 等垂直服务商的竞争。
