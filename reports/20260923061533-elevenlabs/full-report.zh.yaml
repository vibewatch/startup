      - number: '1.3'
        title: 融资历程与投资方
        blocks:
          - type: paragraph
            body: >-
              自 2022 年以来，ElevenLabs 已完成五轮融资，累计约 $781M。2022 年的 $2M 种子轮启动公司；2023 年 1 月的 $19M Series A 支持公开平台上线；2024 年 1
              月，公司以 $1.1B 估值完成 $80M Series B，成为独角兽；2025 年 1 月，a16z 与 ICONIQ Growth 领投 $180M Series C，估值升至原来的三倍、达
              $3.3B；2026 年 2 月， Sequoia Capital 领投 $500M Series D，估值升至 $11B——两年增长 10×。战略投资方包括 Deutsche Telekom、LG
              Technology Ventures、HubSpot Ventures、NTT DOCOMO Ventures、RingCentral Ventures 与 Salesforce
              Ventures。其他财务投资方包括 Lightspeed Venture Partners、NEA、Bond Capital、Andreessen Horowitz、Coatue 与 SV
              Angel。Series D 后，公司报告账面现金约 $550M，可支撑较长运营跑道。公司未披露债务融资；二级交易或内部要约收购也未获公开证实。
