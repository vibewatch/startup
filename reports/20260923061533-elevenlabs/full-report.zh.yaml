  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与 ARR 增长轨迹
        blocks:
          - type: paragraph
            body: >-
              ElevenLabs 的 ARR 增速跻身企业软件史上最快之列。公开平台于 2023 年 1 月上线时，公司 ARR 几乎为零；到 2025 年底已达 $330M。 关键节点是：2025 年 1 月、上线 20
              个月后突破 $100M ARR；2025 年 9 月达到 $200M；2025 年 12 月升至 $330M。从 $100M 增至 $200M 用了 10 个月， 随后再增 $130M 只花了 5
              个月。增长加速来自企业客户采用：2025 年企业收入同比增长超过 200%，企业与自助服务收入占比从早期严重偏向自助服务，逐步接近各半。最大企业合同年额达到 $2M。

              公司有四类收入来源：（1）面向数百万开发者与创作者的自助订阅，价格从 Starter 每月 $5 到 Business 每年 $1,320+；（2）按用量分档、定制定价并签年度承诺的企业 SaaS
              合同；（3）按生成字符或音频分钟收取 API 用量费；（4）Voice Library 向企业授权声音并抽取佣金。截至 2026 年初，平台已向创作者支付超过 $2M，市场仍早期但正在起量。 SaaStr 将
              ElevenLabs 视为「PLG 转企业」路径的代表：自助产品先获用户，再转化为高价值企业客户。
