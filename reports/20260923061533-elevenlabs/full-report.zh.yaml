      - number: '7.2'
        title: 运营、供应链与竞争风险
        blocks:
          - type: paragraph
            body: >-
              ElevenLabs 的运营风险主要来自云基础设施依赖、deepfake 滥用和 BigTech 竞争加剧。公司完全依赖云服务（主要是 AWS），因此容易受到 GPU 产能、价格变化和意外宕机影响。
              Conversational AI 需要低于 75ms 的实时语音合成；AWS 若持续中断，可能导致企业 SLA 违约，并使最有价值的客户流失。NVIDIA GPU
              供应也带来风险：出口限制或供货短缺可能推高推理成本、 限制扩容。Deepfake 滥用则最难从结构上解决。公司虽部署滥用检测、用量监控和兼容 AI SynthID 的水印，MIT Technology
              Review 2024 年研究却发现，盲测中 AI 语音检测准确率不足 70%；因此，水印计划未必足以应对合规和声誉风险。ElevenLabs 技术被用于 2024
              年拜登深伪自动电话及多起电话诈骗，说明即使公司自身遵守政策，滥用仍会带来声誉责任。

              竞争方面，OpenAI 2024 年 5 月推出原生语音能力的 GPT-4o，是最大单一威胁。2025 年 OpenAI TTS API 定价为每百万字符 $15，约比 ElevenLabs 基础价格低
              50%；Microsoft 和 Google 价格更低。Coqui XTTS、StyleTTS2 等开源模型已接近商业级，可供价格敏感或要求本地部署的客户自建替代方案。各家 MOS
              分数趋同，说明模型商品化可能快于 ElevenLabs 溢价所暗示的速度。长期看，BigTech 在 AI 开发平台近乎零边际成本捆绑 TTS，是最重要的风险情景。ElevenLabs 目前靠音质、Flash
              低时延和 Voice Library、AI Dubbing、 多语言支持构成的生态守住优势；若音质差距在 18-24
              个月内消失，自助套餐的溢价将难以维持。缺少本地部署也限制了其服务对数据驻留要求严格的政府、医疗和金融客户。
