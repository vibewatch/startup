  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与客户工作流
        blocks:
          - type: paragraph
            body: >-
              ElevenLabs 已从单一 TTS API 扩展为涵盖八条产品线的 AI 音频平台。TTS API 通过 REST 或 WebSocket
              在数秒内将文本转成音频，服务游戏、出版等开发者和企业应用。声音克隆可用音频样本 创建个性化声线：即时克隆仅需 3 秒，专业克隆则需 30 分钟以上素材，可用于个性化客服和品牌声音。AI Dubbing 支持 32
              种语言的视频翻译与配音，并保留说话人身份，针对过去需数周人工处理的媒体本地化流程。

              Conversational AI 平台支持多轮对话、打断检测、情绪感知响应和 Twilio 电话接入，可用于呼叫中心自动化及客户互动。Voice Library 汇集 5,000 多种授权声音，创作者从中分成，
              企业客户可大规模调用。ElevenReader、Sound Effects AI 和 Projects Studio 分别拓展到个人阅读、音频制作和声音设计。产品共用一套
              API，企业可在不对接多家供应商的情况下组合语音工作流。
