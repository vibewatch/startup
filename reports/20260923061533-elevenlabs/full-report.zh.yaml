  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争全景概览
        blocks:
          - type: paragraph
            body: >-
              ElevenLabs 在三个梯队展开竞争：专注音频的 AI 原生语音 API 初创企业（Cartesia、Deepgram、Resemble AI、Play.ht、Murf）、捆绑 TTS
              的大型科技巨头（Google、Amazon、Microsoft），以及向音频领域拓展的基础模型机构（OpenAI，潜在包括 Anthropic）。各梯队呈现出不同的竞争动态。在 AI
              原生竞对中，ElevenLabs 保持音质领先，截至 2025 年其独立平均主观意见分（MOS）约为 4.5/5，领先于所有公开可调用的 API 竞品。然而，Cartesia 凭借低于 95ms
              的延迟与更低的单字符定价切入关键生态位，吸引了更侧重响应速度而非极致拟真度的语音智能体开发者。Deepgram 主营语音识别业务，但其 Aura TTS 模型在企业实时交互场景中正逐步打开市场。

              科技巨头（Google Cloud TTS、Amazon Polly、Microsoft Azure
              Speech）依托更广泛的云基础设施客户关系、现成企业采购通道以及云服务捆绑带来的零边际成本优势占据分发高地。巨头在语音自然度测评中落后于 ElevenLabs，但在以价格和平台整合为主导决策的大宗标品 TTS
              场景中构成了实质威胁。鉴于庞大的企业装机基础，Microsoft 将 Azure Speech 深度接入 Microsoft 365 Copilot 的举措尤为值得关注。
            claimRefs:
