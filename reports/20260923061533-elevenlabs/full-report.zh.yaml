        - 基准情景下 ARR 达 $600-750M，按 12-15× 倍数计算，较 $11B 入场估值基本持平至温和增值
      - - 持有建议
        - 现有投资人持有 5-7 年
        - 语音 AI 平台逻辑要等企业电话与 Conversational AI 的完整业务周期跑出来
