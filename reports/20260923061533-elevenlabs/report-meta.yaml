companyProfile:
  summary: >-
    ElevenLabs is the leading AI voice platform, providing best-in-class text-to-speech, instant voice cloning, AI
    dubbing (32 languages), and conversational AI agent APIs. Founded in January 2022 by Mati Staniszewski (CEO) and
    Piotr Dąbkowski (CTO), the company has grown from $0 to $330M ARR in under four years at exceptional capital
    efficiency ($825K ARR per employee). Its February 2026 Series D ($500M at $11B valuation) led by Sequoia Capital
    established it as the dominant independent voice AI infrastructure company.
  foundedDate: '2022-01-01'
  founders:
    - name: Mati Staniszewski
      role: CEO
      background: Ex-Palantir; raised ElevenLabs from concept to $11B valuation in 4 years.
      claimRefs: []
    - name: Piotr Dąbkowski
      role: CTO
      background: Ex-Google; responsible for core model architecture and R&D.
      claimRefs: []
  foundingLocation: New York, NY
  headquarters: New York, NY (London and Warsaw offices)
  productSummary: >-
    Core products: TTS API (Flash <75ms, Multilingual v2), Instant Voice Cloning (3-second cloning), AI Dubbing (32
    languages), Conversational AI Agents, Voice Library (3,000+ voices), ElevenReader, Projects Studio, Sound Effects
    API.
  customerFocus: >-
    1M+ developers (self-serve API); enterprise customers including Deutsche Telekom, Revolut, Square, TIME, Washington
    Post, Salesforce, NVIDIA, Ukrainian government.
  businessModel: >-
    API usage-based pricing for self-serve; enterprise SaaS contracts with volume discounts. Revenue mix ~50/50
    enterprise/self-serve. Enterprise growing >200% YoY.
  stage: Series D (pre-IPO)
  fundingStatus: $781M total raised; Series D $500M at $11B valuation (February 2026); ~$550M estimated cash on hand.
  disclosureProfile: private-disclosed
  claimRefs: []
summary:
  headline: >-
    ElevenLabs is the category-defining AI voice infrastructure company: 175% ARR growth, elite investor syndicate, and
    a defensible quality moat — but Series D entry at 33× ARR compresses new investor returns and requires the platform
    thesis to beat BigTech bundling.
