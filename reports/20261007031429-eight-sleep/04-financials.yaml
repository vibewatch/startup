callouts:
  - calloutType: "insight"
    title: "Software Lock-In vs Consumer Pushback Dynamics"
    body: "Eight Sleep's financial transition toward high-margin software relies on gating critical temperature-automation features behind an active $17 to $33 monthly Autopilot subscription [CI003, CI005]. While this mechanism provides high recurring revenue per active device, it generates friction among premium hardware buyers who expect full device autonomy without recurring payments [CI003]."
    claimRefs:
      - "CI003"
      - "CI005"
  - calloutType: "risk"
    title: "Cloud Infrastructure Dependency and Operational Vulnerability"
    body: "The financial efficiency of cloud-based Autopilot algorithms introduces direct business risk, as evidenced by the October 2025 AWS outage that disabled physical temperature controls and forced beds to overheat [CI002, CI004]. Ongoing cloud compute overhead and edge resilience investments represent a recurring cost driver that cannot be eliminated without altering the product architecture [CI004]."
    claimRefs:
      - "CI002"
      - "CI004"
