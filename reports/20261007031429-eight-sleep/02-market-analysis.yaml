    title: "Subscription Terms Must Be Normalized by Product and Period"
    body: "Public sources report different annual and monthly subscription ranges for different dates and product generations. They show recurring-payment friction, but they do not support one normalized current price or attractive unit economics."
    claimRefs:
      - "CM013"
      - "CM014"
  - calloutType: "risk"
    title: "Clinical Transition Gate: The Gap Between Wellness Claims and FDA Clearance"
    body: "Eight Sleep has described FDA Class II filings for sleep-apnea detection and mitigation, but the assigned evidence does not establish clearance, clinical procurement, or reimbursement. Clinical upside therefore remains an option rather than base-market demand."
    claimRefs:
      - "CM008"
