              - CM008
              - CM010
      - number: '2.2'
        title: Market Sizing, TAM/SAM/SOM Framework, and Clinical Expansion
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not support a defensible top-down TAM, serviceable market, or obtainable share.
              One June 2026 article attributes $21 billion for global sleep technology and $1.8 billion for smart
              mattresses to Fitt Insider, but the fetched article does not expose the underlying methodology, forecast
              period, or category boundary. It also reports more than $500 million of cumulative Pod sales since 2019,
              which is neither current revenue nor annual market share.


              Sacra adds demographic and geographic lenses: 1.1 billion women projected to experience menopause by 2030
              and 400 million middle-class consumers in China. Neither figure is a count of buyers, an annual spending
              pool, or revenue available to Eight Sleep. Company sources describe availability in more than 34 or 35
              countries, but a shipping footprint is not a demand denominator. The prudent conclusion is directional:
              the reachable niche sits below broad sleep technology and still lacks public household-income,
              replacement-cycle, conversion, retention, and willingness-to-pay inputs.
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
