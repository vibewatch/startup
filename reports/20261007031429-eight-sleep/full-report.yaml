        - Medium-high until independently tested across failure scenarios
        - No architecture diagram, test report, or fallback-function inventory is public in the assigned pool
      - - Loss of internet, app, firmware, or power availability
        - Independent review describes all four operating dependencies
        - Structural dependency, not a quantified incident rate
        - Medium-high because temperature control may become unavailable
        - Manual controls and Backup Mode are described, but scope is not independently verified
        - Medium
        - No recovery-time objective, local-control specification, or field-failure rate is disclosed
      - - Biometric-data misuse, transfer, or changed privacy terms
        - Independent reporting describes continuous server-transmitted sleep and body data
        - Structural exposure; no incident is established
        - High because the data are sensitive and collected in the bedroom
        - No specific public mitigation is established by the assigned evidence
        - High until governance and contractual controls are reviewed
        - Retention, deletion, model-training, onward-transfer, and change-of-control terms require diligence
      - - Clinical performance is insufficient for the intended medical claim
