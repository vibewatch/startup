      - number: '1.2'
        title: Executive Leadership, Governance, and Key-Person Dependence
        blocks:
          - type: paragraph
            body: >-
              Eight Sleep operates under founder-led executive management with pronounced key-person exposure centered
              on Chief Executive Officer Matteo Franceschetti and Vice President of Brand and Marketing Alexandra
              Zatarain. Franceschetti, a former securities lawyer at Freshfields Bruckhaus Deringer and Allen & Overy
              who previously founded and exited clean-technology ventures, provides strategic vision and external
              capital allocation. Zatarain has directed the brand architecture, influencer partnerships, and premium
              positioning that anchor consumer demand. Chief Technology Officer Massimo Andreasi Bassi oversees
              hardware-software systems architecture. The broader executive group and scientific advisory council
              integrate 12 PhDs and sleep scientists to support product efficacy studies. However, commercial
              storytelling and elite brand visibility heavily depend on the founding pair, creating substantial
              key-person dependence. The board and cap table feature prominent institutional sponsors including HSG,
              Founders Fund, Khosla Ventures, Valor Equity Partners, SoftBank, and Y Combinator, alongside high-profile
              individual backers such as Charles Leclerc and Zak Brown.
