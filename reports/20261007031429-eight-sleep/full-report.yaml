      - number: '2.4'
        title: Growth Drivers, Architectural Vulnerabilities, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Growth can come from geographic availability, more use cases, and a move from wellness toward regulated
              health. Eight Sleep's March 2026 release directs capital toward clinical trials, regulatory pathways,
              predictive models, and commercial partnerships. Those same moves raise the burden of proof. Independent
              reporting says FDA clearance for sleep-apnea detection and mitigation had been filed but not obtained,
              while an October 2025 cloud outage exposed dependence on remote infrastructure and reportedly disrupted
              temperature or elevation behavior.


              Public negative-event checks are incomplete. BreachHistory had no indexed public incident for 2026, but
              catalogue absence cannot prove that no incident occurred. ClaimWatch is internally inconsistent,
              describing a consumer-fraud case as both being litigated and dismissed with prejudice; only the primary
              docket can establish status. Underwriting should not award a clinical-market or trust premium until
              primary regulatory status, offline resilience, privacy controls, retention, cohort economics, and the
              legal record are verified.
            claimRefs:
              - CM008
              - CM009
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Subscription Terms Must Be Normalized by Product and Period
            body: >-
              Public sources report different annual and monthly subscription ranges for different dates and product
              generations. They show recurring-payment friction, but they do not support one normalized current price or
              attractive unit economics.
            calloutType: insight
            claimRefs:
              - CM013
              - CM014
          - type: callout
            title: 'Clinical Transition Gate: The Gap Between Wellness Claims and FDA Clearance'
            body: >-
              Eight Sleep has described FDA Class II filings for sleep-apnea detection and mitigation, but the assigned
              evidence does not establish clearance, clinical procurement, or reimbursement. Clinical upside therefore
              remains an option rather than base-market demand.
            calloutType: risk
            claimRefs:
              - CM008
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Architecture and Taxonomy
        blocks:
          - type: paragraph
            body: >-
              The competitive arena surrounding Eight Sleep spans five distinct categories of sleep optimization and
              thermal regulation alternatives. Direct competitors deploy active hydronic or thermoelectric cooling and
              heating covers engineered to retrofit onto existing mattresses, led by dedicated microclimate challengers
              such as sleepme (formerly ChiliSleep with the Dock Pro and Chilipad 2.0 platforms), Orion Sleep Systems,
              and European market entrant Qimora Sleep Core. Incumbent smart bed manufacturers, headlined by Sleep
              Number with its SleepIQ 360 and Climate360 integrated smart beds, embed active thermal balancing and
              adjustable pneumatic firmness into full mattress chassis rather than sell standalone retrofit covers.
              Adjacent tech-enabled sleep trackers, such as SleepScore Max and Sleep.ai, deliver non-contact acoustic or
              optical biometric analytics without microclimate hardware. Status-quo and passive substitutes comprise
              luxury mattress manufacturers—including Tempur-Pedic (TEMPUR-Breeze), Purple (GelFlex Grid), Casper (Snow
              hybrid), and Saatva (Solaire)—which rely on advanced phase-change material science and open-cell foams to
              mitigate heat retention without active electromechanical hardware or ongoing software subscriptions.
              Finally, low-cost convective air systems such as BedJet 3 offer forced-air bed cooling and heating at
              budget price points without circulating liquids or imposing SaaS paywalls. Eight Sleep differentiates
              primarily on predictive closed-loop machine learning, dual-zone dynamic thermal ranges spanning 55°F to
              110°F, and rich wearable-free health biometrics, yet remains vulnerable to growing consumer subscription
              fatigue.
            claimRefs:
              - CP001
              - CP002
              - CP003
