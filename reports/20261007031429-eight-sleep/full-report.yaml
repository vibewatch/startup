      - number: '1.3'
        title: Capitalization Trajectory, Milestones, and Healthcare Pivot
        blocks:
          - type: paragraph
            body: >-
              Eight Sleep has raised more than $310 million in cumulative equity financing, scaling its private market
              valuation from $500 million in 2021 to nearly $1.0 billion in August 2025, and ultimately to $1.5 billion
              in March 2026. The latest $50 million investment from stablecoin issuer Tether reinforced the company
              unicorn valuation and provided liquidity for international expansion and clinical validation. Operating
              discipline resulted in free-cash-flow positivity across 2025, distinguishing Eight Sleep from distressed
              consumer hardware peers such as Sleep Number, which entered Chapter 11 bankruptcy in mid-2026. Eight Sleep
              strategic roadmap is anchored by a deliberate clinical transition: the company is actively seeking FDA
              medical device clearance for sleep apnea detection and positional intervention, while initiating clinical
              trials with Abu Dhabi Department of Health. Concurrently, independent monitoring services catalog zero
              data breach incidents in 2026, though biometric data security and medical regulatory compliance remain
              critical operational gating factors.
