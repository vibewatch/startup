chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Founded in 2014 by Matteo Franceschetti, Alexandra Zatarain, and Massimo Andreasi Bassi, Eight Sleep
              operates at the intersection of consumer hardware and digital health. Headquartered in New York, NY, the
              business has evolved from an early crowdfunding project on Indiegogo into an established sleep fitness
              enterprise serving customers across 35 countries. The core value proposition centers on the Pod system, an
              active thermoregulation mattress cover that circulates heated and cooled water between 55°F and 110°F
              while passively monitoring cardiovascular and respiratory vitals without requiring wearable sensors. Eight
              Sleep couples upfront hardware purchases with mandatory or premium Autopilot software subscriptions
              ranging from $199 to $399 annually. This dual revenue model generates high initial transaction value
              alongside recurring software cash flow, driving cumulative Pod product sales past $500 million. Operating
              as a direct-to-consumer brand, the company maintains lean operational staffing of approximately 100
              employees, emphasizing software-driven automation and outsourced manufacturing to achieve operational cash
              flow sustainability.
