      - number: '5.2'
        title: Architecture and Integration Surface
        blocks:
          - type: paragraph
            body: >-
              The defensible public architecture is a closed control loop: the bed surface collects sleep and biometric
              signals, the user supplies schedules and preferences through the app, control software decides when to
              adjust temperature, and the Hub drives the thermal response. Community projects expose a much broader
              state and control surface—including temperature, presence, sleep stages, heart rate, HRV, respiratory
              rate, routines, alarms, water level, and priming—but those repositories explicitly rely on Eight Sleep
              credentials or reverse engineering. They are useful evidence of practitioner demand and observable
              interfaces, not proof of a supported developer platform. The same evidence indicates dependence on account
              authentication, device connectivity, and a continuing service API.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE012
              - CE013
