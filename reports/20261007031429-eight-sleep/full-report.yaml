      - number: '2.3'
        title: Buyer Segmentation, Workflow Ownership, and Subscription Economics
        blocks:
          - type: paragraph
            body: >-
              The observed route to market is consumer-led: the household is buyer and payer, one or two sleepers are
              users, and Eight Sleep owns the software relationship. Company positioning names couples, training and
              recovery users, and women navigating pregnancy or menopause; those are use-case segments, not
              independently measured demand pools. Adoption must clear a substantial upfront price, an ongoing software
              decision, installation on an existing bed, and confidence that nightly adjustments deliver enough benefit
              to persist.


              Current promotions of $100 to $400 show that price merchandising is part of acquisition, but a coupon page
              cannot establish conversion lift or durable willingness to pay. Public sources also use different
              subscription periods and product generations: Wikipedia reports $180 to $288 annually from February 2023,
              while a June 2026 article reports $17 to $33 monthly for Pod 5. Those ranges should not be treated as
              direct equivalents. Clinical, employer, or reimbursed payers remain future possibilities rather than
              evidenced current segments.
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
