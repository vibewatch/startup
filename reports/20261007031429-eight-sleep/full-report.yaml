  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable boundary is narrower than either mattresses or digital health. Eight Sleep sells a premium
              hardware-plus-subscription system whose core jobs are active bed-temperature control, passive sleep
              sensing, and automated personalization; ordinary mattresses, cooling bedding, room air conditioning,
              wearables, and doing nothing are substitutes rather than included spend. The current company page starts
              Solo configurations at $1,999, while third-party descriptions place higher-end systems and software above
              that entry point.


              This framing excludes general mattress replacement and broad wellness spending unless the purchase
              specifically substitutes for an active climate-and-sensing sleep system. It also separates today's
              consumer wellness category from a possible future regulated-health adjacency. The Pod's water-based
              dual-zone control and passive sensing create a differentiated bundle, but public sources do not quantify
              how many households value both functions, what share would otherwise buy a conventional premium mattress,
              or how many wearable users view a bed system as a substitute.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM010
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
