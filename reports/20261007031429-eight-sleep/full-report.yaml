              - CR012
              - CR014
              - CR015
      - number: '7.2'
        title: Operational resilience and privacy
        blocks:
          - type: paragraph
            body: >-
              Connected thermal hardware creates a risk that software availability becomes a physical product-control
              issue. Eastern Herald reports that an October 2025 AWS outage left some beds behaving unexpectedly,
              including overheating toward 110 degrees Fahrenheit and becoming stuck in elevated positions; it also
              reports that Eight Sleep subsequently announced a Bluetooth Backup Mode. That is a concrete mitigation,
              but the public record provided here does not establish its independent test coverage or whether all
              critical functions operate locally. FitnessNav separately says the system depends on app setup, Wi-Fi,
              firmware updates, and power. Privacy exposure is structural rather than incident- proven: Eastern Herald
              describes continuous biometric collection and a weaker protection boundary than HIPAA health records,
              while BreachHistory's empty catalog is only an absence in that catalog, not proof that no incident has
              occurred.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
              - CR008
              - CR009
              - CR015
              - CR016
      - number: '7.3'
        title: Business-model and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Commercial resilience depends on consumers accepting both premium hardware and recurring software fees.
              Fortune reports that automatic control and tracking require a $199-to-$399 annual subscription, while
              FitnessNav characterizes cost and the subscription model as limiting accessibility. Eight Sleep's own page
              now advertises entry pricing from $1,999, a 30-night return period, and protection for up to five years;
              those policies mitigate purchase anxiety but do not disclose retention, warranty incidence, or unit
              economics. A Yahoo Finance page carrying Forge-derived data further illustrates valuation-model
              uncertainty: it displays a $1.08 billion estimate while warning that Forge Price is not a quotation and
              may rely on limited data. Funding raised, modeled valuation, and cash available should therefore remain
              separate diligence questions.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR007
              - CR014
              - CR016
      - number: '7.4'
        title: Investment controls and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The underwriting case should be milestone-gated rather than assuming the medical pivot, resilience
              controls, or subscription economics are already proven. Before attributing healthcare value, diligence
              should obtain an FDA submission identifier, agency correspondence, trial protocols, and a claims-control
              policy. Before treating Backup Mode as a complete control, an independent failure test should demonstrate
              safe local operation during loss of cloud, internet, and power. Privacy diligence should establish
              deletion, transfer, secondary-use, and change-of-control rights for biometric data. Finally, cohort churn,
              refund rates, warranty claims, gross margin, cash burn, runway, and supplier concentration are required to
              quantify residual exposure. Failure to substantiate these controls is a thesis-break trigger, not evidence
              that the risks have already materialized.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Milestone-gated thesis-break triggers
            body: >-
              Do not underwrite a regulated-healthcare premium without a verifiable FDA record and clinical evidence
              package. Treat a failed independent Backup Mode test, inadequate biometric-data deletion or transfer
              controls, or refusal to provide cohort retention, warranty, margin, burn, and runway evidence as reasons
              to pause investment.
            calloutType: risk
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The investable conclusion is track rather than buy at the reported $1.5 billion mark. Independent records
              broadly corroborate a $50 million March 2026 financing at that headline valuation, while the company
              website shows a premium product starting at $1,999 and company-reported traction includes a 4.5 rating
              across more than 30,000 reviews. Those signals support product relevance and access to capital, but
              neither establishes recurring revenue, gross margin, retention, or distributable cash generation. Entry
              should therefore be conditioned on current audited financials, cohort data, subscription attach and churn,
              hardware warranty economics, and the full preference stack. Without those items, the valuation is
              stretched relative to what public evidence can substantiate, and confidence remains medium-low even though
              the product and financing signals are credible.
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV013
              - CV015
      - number: '8.2'
        title: Thesis, anti-thesis, and downside evidence
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Eight Sleep has converted an expensive physical product into a differentiated sleep
              platform with demonstrated pricing power, substantial reported cumulative product sales, and a pathway
              toward regulated health use. The anti-thesis is that the valuation asks investors to capitalize financial
              and clinical outcomes that remain mostly private. The retained reporting describes a mandatory paid
              subscription on the highest-priced configuration, pending FDA clearance, and a prior cloud outage that
              impaired bed controls. Legal evidence is also imperfect: ClaimWatch says a proposed fraud case was
              dismissed with prejudice, yet the same page labels the docket active. A breach catalog reports no
              catalogued 2026 event, which is only a statement about that catalog and is not proof that no incident
              occurred. These uncertainties keep residual execution, regulatory, reliability, and disclosure risk high.
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.3'
        title: Scenario framing and comparable context
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not support a conventional revenue-multiple valuation: current revenue, ARR, gross
              margin, recurring mix, retention, and normalized free cash flow are absent. The Multiples database offers
              public reference names spanning cosmetics, appliances, electronics, and telecom, while other reporting
              identifies Oura, Apple, Whoop, and ResMed as product or clinical competitors. That is useful strategic
              context but not a clean valuation benchmark because business models, margins, regulation, and revenue mix
              differ. The scenario table therefore uses only transparent arithmetic on the $1.5 billion headline entry
              mark. Its values are not forecasts and do not account for dilution, liquidation preferences, debt,
              option-pool expansion, taxes, or time-to-exit; those omitted terms can materially reduce common-equity
              returns.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV008
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is unproven rather than absent. The current financing mark demonstrates investor demand,
              but the evidence does not show an IPO-ready reporting package, durable public-market margins, or a
              disclosed buyer set. Before investment, obtain monthly revenue by hardware and subscription, gross margin
              and contribution margin, cohort retention, warranty and return rates, cash conversion, board-approved
              forecasts, debt, liquidation preferences, participation rights, anti-dilution provisions, and option-pool
              obligations. Also require FDA correspondence, clinical-validation protocols, outage postmortems,
              offline-control test results, privacy controls, and the final consumer-case docket. Thesis-break triggers
              are failed or materially delayed regulatory clearance paired with continued medical-positioning spend,
              recurring control outages, worsening subscription retention, negative normalized free cash flow, or
              financing terms that subordinate new common capital. A lower price alone would not cure missing evidence,
              but verified economics could move the recommendation from track to consider.
            claimRefs:
              - CV001
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track at the current mark
            body: >-
              The $1.5B financing is a credible price reference, not sufficient valuation support. Move to consider only
              after verified unit economics, retention, cash conversion, cap-table terms, regulatory progress, and
              reliability controls.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV008
              - CV010
              - CV015
