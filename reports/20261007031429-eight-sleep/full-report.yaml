      - number: '4.2'
        title: Unit Economics and Cost Structure Drivers
        blocks:
          - type: paragraph
            body: >-
              The economic engine of Eight Sleep balances capital-intensive hardware manufacturing with software-like
              subscription margins. Hardware gross margins are burdened by sensor integration, fluid-circulation hubs,
              specialized thermal grids, and global logistics across 34 to 35 export destinations [CI002, CI006]. The
              company mitigates production expenses through a dedicated manufacturing base in Shenzhen, providing direct
              supply chain efficiencies and regional manufacturing familiarity [CI006]. However, ongoing customer
              service delivery relies heavily on cloud infrastructure. Sensor-embedded ballistocardiography and machine
              learning models process continuous biometric telemetry across more than one billion recorded sleep hours
              [CI002, CI003]. Centralized cloud dependency was starkly demonstrated during an October 2025 Amazon Web
              Services outage that temporarily prevented active thermal regulation and caused user beds to overheat,
              necessitating an emergency firmware backup mode [CI002, CI004]. Customer acquisition costs (CAC), payback
              periods, and cohort retention rates remain closely guarded private metrics, preventing rigorous external
              assessment of long-term unit profitability.
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI006
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI008
      - number: '4.3'
        title: Capital Adequacy and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              Eight Sleep fortified its capitalization in March 2026 by securing a $50M strategic investment led by
              Tether Investments at a post-money valuation of $1.5B, bringing lifetime funding to approximately $310M
              [CI001, CI002]. Management announced that the business attained free-cash-flow positivity during 2025,
              demonstrating operating self-sufficiency that materially reduces near-term financing dependency and
              dilutive capital calls [CI001, CI002]. Capital proceeds are earmarked for scaling predictive AI agents,
              pursuing international retail distribution, and financing clinical trials for FDA Class II clearance in
              sleep apnea detection [CI002, CI003]. However, the company faces ongoing operational and legal friction: a
              consumer fraud class action filed in N.D. California alleged misrepresentations regarding product
              capabilities, and pending regulatory scrutiny restricts promotional claims to general wellness until
              formal medical device clearances are secured [CI003, CI009]. While cash flow self-sufficiency mitigates
              immediate liquidity risk, institutional underwriting remains blocked by the total absence of audited gross
              margins, ARR scale, and subscriber renewal durability.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI009
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Software Lock-In vs Consumer Pushback Dynamics
            body: >-
              Eight Sleep's financial transition toward high-margin software relies on gating critical
              temperature-automation features behind an active $17 to $33 monthly Autopilot subscription [CI003, CI005].
              While this mechanism provides high recurring revenue per active device, it generates friction among
              premium hardware buyers who expect full device autonomy without recurring payments [CI003].
            calloutType: insight
            claimRefs:
              - CI003
              - CI005
          - type: callout
            title: Cloud Infrastructure Dependency and Operational Vulnerability
            body: >-
              The financial efficiency of cloud-based Autopilot algorithms introduces direct business risk, as evidenced
              by the October 2025 AWS outage that disabled physical temperature controls and forced beds to overheat
              [CI002, CI004]. Ongoing cloud compute overhead and edge resilience investments represent a recurring cost
              driver that cannot be eliminated without altering the product architecture [CI004].
            calloutType: risk
            claimRefs:
              - CI002
              - CI004
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and User Workflow
        blocks:
          - type: paragraph
            body: >-
              The Pod is sold as an active sleep system rather than a passive mattress accessory: a bed surface and Hub
              heat or cool the sleeper while software adjusts the environment overnight. Eight Sleep's current product
              page advertises independent sides from 55°F to 110°F and positions Pod 6 as the next generation, with Solo
              sizes starting at $1,999. The principal user loop is straightforward—install the hardware, set
              side-specific preferences, sleep on the sensing surface, review metrics in the app, and allow Autopilot to
              change temperature. That loop is differentiated because it can alter the sleep environment as well as
              measure it, although the performance outcomes on the official page remain company claims rather than
              independent current-generation benchmarks.
            claimRefs:
