    body: "Eight Sleep is actively attempting to escape consumer hardware cyclicality by transforming its Pod platform into an FDA-cleared medical device for sleep apnea detection and mitigation. While traditional mattress incumbent Sleep Number collapsed into Chapter 11 bankruptcy in mid-2026 under heavy debt and retail headwinds, Eight Sleep has sustained profitability through high direct-to-consumer software attach rates and is targeting insurance reimbursement pathways to unlock non-luxury demographic reach."
