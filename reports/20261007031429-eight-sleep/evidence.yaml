evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financial-metrics
    missingEvidence: >-
      Audited income statements detailing exact FY2025 and FY2026 gross margins, ARR breakdown, GAAP net income, and
      cash burn rate.
    whyItMatters: >-
      While management reported positive free cash flow in 2025 and $500M+ cumulative Pod revenue, underlying
      subscription retention and hardware unit margins remain private.
    diligencePath: >-
      Request confidential disclosure schedules, management accounting reports, or audited financial statements during
      formal confirmatory due diligence.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: cap-table-ownership-percentages
    missingEvidence: Exact equity percentage stakes and liquidation preference waterfall for institutional and individual shareholders.
    whyItMatters: >-
      Disclosed rounds identify lead sponsors (HSG, Tether, Khosla, Founders Fund) but not their detailed control
      rights, voting thresholds, or board seats.
    diligencePath: >-
      Review the comprehensive capitalization table, investor rights agreements, and certificate of incorporation
      amendments.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-share
    missingEvidence: >-
      Independent category definitions and methodology plus audited geographic Pod sales, subscription revenue,
      conversion, attach, retention, churn, returns, and willingness-to-pay data.
    whyItMatters: >-
      Without comparable market denominators and company cohort evidence, broad category estimates cannot be translated
      into defensible TAM, SAM, SOM, market share, or obtainable revenue.
    diligencePath: >-
      Obtain the underlying Fitt Insider work and an independent market study, then reconcile their definitions to
      management cohort exports by product, channel, promotion, use case, and geography.
    relatedQuestionRefs:
      - QM002
      - QM004
      - QM005
  - type: missing-source
    severity: material
    topic: regulatory-clearance
    missingEvidence: Formal FDA 510(k) decision summary or Class II clearance confirmation documentation for sleep apnea detection.
    whyItMatters: >-
      Commercial entry into clinical sleep diagnostics and insurance reimbursement channels is legally gated by FDA
      regulatory clearance.
    diligencePath: >-
      Track FDA Medical Device Databases (510(k) clearances) for Eight Sleep, Inc. and monitor company regulatory
      announcements.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: competitors
    missingEvidence: Audited retention, churn rates, and unit shipment volumes comparing Eight Sleep against sleepme and Orion.
    whyItMatters: >-
      Without verified competitor unit economics and subscriber renewal rates, relative market share shifts cannot be
      definitively quantified.
    diligencePath: Obtain confidential vendor sales audits, retailer sell-through reports, or channel partner point-of-sale data.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: subscription-cohort-retention
    missingEvidence: >-
      Monthly and annual cohort churn, attach rate, and net revenue retention (NRR) for the mandatory Autopilot
      subscription.
    whyItMatters: >-
      Without retention data, underwriters cannot determine whether high upfront acquisition costs are amortized over a
      durable recurring software revenue stream or degraded by post-year-one cancellations.
    diligencePath: Request customer cohort retention matrices by subscription vintage under non-disclosure agreement.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: hardware-gross-margin
    missingEvidence: >-
      Disclosed bill-of-materials (BOM), manufacturing costs, shipping, and warranty replacement expenses for Pod
      hardware models.
    whyItMatters: >-
      Direct hardware profitability determines baseline cash generation before operating expenses and protects against
      tariff or supply-chain inflation.
    diligencePath: Review standard margin accounting schedules and warranty reserve rates across product lines.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: minor
    topic: audited-financial-statements
    missingEvidence: >-
      Audited income statements and balance sheets reconciling reported GMV and free-cash-flow claims to GAAP revenue
      and operating income.
    whyItMatters: >-
      Third-party estimates and press release milestones may deviate from recognized GAAP revenue, working capital
      timing, and non-cash charges.
    diligencePath: Obtain CPA-audited annual financial statements and trailing twelve-month management reports.
    relatedQuestionRefs:
      - QI002
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: security-and-privacy-controls
    missingEvidence: >-
      An official security or privacy control package covering encryption, retention, access controls, independent
      testing, certifications, and incident response for current Pod data.
    whyItMatters: >-
      The product handles intimate sleep and biometric signals, while a third-party catalog's lack of a recorded
      incident does not validate the control environment.
    diligencePath: >-
      Request the security architecture, data-flow map, retention schedule, latest penetration-test executive summary,
      subprocessor list, and incident-response metrics under NDA.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: hardware-reliability
    missingEvidence: >-
      Current-generation leak, pump-failure, return, replacement, and warranty claim rates by cohort and product
      generation.
    whyItMatters: >-
      A water-based system creates a distinctive physical failure mode, and one reviewer anecdote cannot establish
      incidence or remediation cost.
    diligencePath: >-
      Review Pod 4 through Pod 6 warranty cohorts, accelerated-life testing, root-cause categories, and net replacement
      cost with operations leaders.
    relatedQuestionRefs:
      - QE004
    relatedTableRefs:
      - TE001
      - TE003
  - type: missing-source
    severity: material
    topic: current-generation-validation
    missingEvidence: >-
      Independent Pod 6 studies with protocols, sample sizes, denominators, endpoints, adverse events, and reproducible
      metric-accuracy results.
    whyItMatters: >-
      Company-issued "up to" outcomes do not establish generalized efficacy or sensor accuracy for the current
      commercial generation.
    diligencePath: >-
      Obtain study protocols and datasets, map each marketing claim to a prespecified endpoint, and commission
      independent replication where none exists.
    relatedQuestionRefs:
      - QE005
      - QE008
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: material
    topic: official-api-and-service-reliability
    missingEvidence: >-
      Official API documentation, compatibility policy, uptime history, service-level objective, offline behavior, and
      endpoint deprecation plan.
    whyItMatters: >-
      Community integrations show utility but may fail when authentication or undocumented interfaces change, and
      service dependence affects the durable value of installed hardware.
    diligencePath: >-
      Request API ownership, incident history, endpoint-change logs, offline capability tests, and an explicit support
      roadmap from engineering.
    relatedQuestionRefs:
      - QE003
      - QE004
    relatedTableRefs:
      - TE001
      - TE003
  - type: missing-source
    severity: material
    topic: cohort-retention-churn
    missingEvidence: >-
      Publicly audited cohort churn, renewal rates, and Net Revenue Retention (NRR) for the recurring Autopilot software
      subscription.
    whyItMatters: >-
      Because hardware margins face high freight, return, and warranty costs, the enterprise value depends critically on
      subscription lifetime value (LTV) durability.
    diligencePath: >-
      Request cohort retention curves, monthly recurring revenue (MRR) churn by vintage, and subscription attach rates
      from management.
    relatedQuestionRefs:
