company:
  name: Eight Sleep
chapter:
  number: 7
  title: Risks
  summary: >-
    Eight Sleep's principal public-evidence risks are an unresolved FDA pathway for its
    medical ambitions, demonstrated cloud-control fragility, sensitive biometric-data
    governance, premium hardware plus subscription friction, and legal-status uncertainty.
    Public mitigations exist, but the assigned evidence does not disclose cash runway,
    subscription churn, supplier concentration, or authoritative regulator and court records.
sections:
  - id: regulatory-and-legal-boundary
    title: Regulatory and legal boundary
    body: >-
      The highest-consequence risk is the transition from consumer wellness to regulated
      healthcare. Fortune and Eastern Herald report that Eight Sleep is pursuing FDA clearance
      for sleep-apnea detection and mitigation, while Fortune says supporting clinical work is
      under way. Eastern Herald states that, until clearance, the Pod cannot be characterized
      as a medical device or marketed with specific diagnostic claims. The regulatory thesis
      therefore depends on an authorization and evidence package that the assigned pool does
      not independently verify through an FDA record. Legal evidence also needs careful
      qualification: an Eight Sleep complaint against Orion and Blue Fuzion is an allegation
      by the company, while ClaimWatch presents internally inconsistent status descriptions
      for a separate consumer case. Neither is a basis for assuming liability or resolution.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR010
      - CR011
      - CR012
      - CR013
    tableRefs:
      - TR001
    figureRefs:
      - FR001
  - id: operational-resilience-and-privacy
    title: Operational resilience and privacy
    body: >-
      Connected thermal hardware creates a risk that software availability becomes a physical
      product-control issue. Eastern Herald reports that an October 2025 AWS outage left some
      beds behaving unexpectedly, including overheating toward 110 degrees Fahrenheit and
      becoming stuck in elevated positions; it also reports that Eight Sleep subsequently
      announced a Bluetooth Backup Mode. That is a concrete mitigation, but the public record
      provided here does not establish its independent test coverage or whether all critical
      functions operate locally. FitnessNav separately says the system depends on app setup,
      Wi-Fi, firmware updates, and power. Privacy exposure is structural rather than incident-
      proven: Eastern Herald describes continuous biometric collection and a weaker protection
      boundary than HIPAA health records, while BreachHistory's empty catalog is only an
      absence in that catalog, not proof that no incident has occurred.
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR015
      - CR016
    tableRefs:
      - TR002
  - id: business-model-and-dependencies
    title: Business-model and dependency risk
    body: >-
      Commercial resilience depends on consumers accepting both premium hardware and recurring
      software fees. Fortune reports that automatic control and tracking require a $199-to-$399
      annual subscription, while FitnessNav characterizes cost and the subscription model as
      limiting accessibility. Eight Sleep's own page now advertises entry pricing from $1,999,
      a 30-night return period, and protection for up to five years; those policies mitigate
      purchase anxiety but do not disclose retention, warranty incidence, or unit economics.
      A Yahoo Finance page carrying Forge-derived data further illustrates valuation-model
      uncertainty: it displays a $1.08 billion estimate while warning that Forge Price is not
      a quotation and may rely on limited data. Funding raised, modeled valuation, and cash
      available should therefore remain separate diligence questions.
    claimRefs:
      - CR007
      - CR008
      - CR009
      - CR014
    tableRefs:
      - TR003
  - id: investment-controls-and-kill-criteria
    title: Investment controls and kill criteria
    body: >-
      The underwriting case should be milestone-gated rather than assuming the medical pivot,
      resilience controls, or subscription economics are already proven. Before attributing
      healthcare value, diligence should obtain an FDA submission identifier, agency
      correspondence, trial protocols, and a claims-control policy. Before treating Backup
      Mode as a complete control, an independent failure test should demonstrate safe local
      operation during loss of cloud, internet, and power. Privacy diligence should establish
      deletion, transfer, secondary-use, and change-of-control rights for biometric data.
      Finally, cohort churn, refund rates, warranty claims, gross margin, cash burn, runway,
      and supplier concentration are required to quantify residual exposure. Failure to
      substantiate these controls is a thesis-break trigger, not evidence that the risks have
      already materialized.
    claimRefs:
      - CR001
      - CR004
      - CR005
      - CR006
      - CR007
      - CR009
