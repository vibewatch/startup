callouts:
  - calloutType: risk
    title: Milestone-gated thesis-break triggers
    body: >-
      Do not underwrite a regulated-healthcare premium without a verifiable FDA record and
      clinical evidence package. Treat a failed independent Backup Mode test, inadequate
      biometric-data deletion or transfer controls, or refusal to provide cohort retention,
      warranty, margin, burn, and runway evidence as reasons to pause investment.
    claimRefs:
      - CR001
      - CR004
      - CR005
      - CR006
      - CR007
      - CR009
