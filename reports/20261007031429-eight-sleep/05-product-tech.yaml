callouts:
  - calloutType: insight
    title: Intervention is the Core Product Distinction
    body: >-
      Public evidence supports a product that both observes sleep-related signals
      and changes the bed's temperature. That closed loop is more strategically
      relevant than any single score, but its outcome advantage still needs
      independent validation on the current generation.
    claimRefs:
      - CE001
      - CE003
      - CE004
  - calloutType: risk
    title: Community Utility Does Not Equal Platform Support
    body: >-
      Home Assistant projects demonstrate technical demand and a rich observable
      control surface, yet credential-based and reverse-engineered integrations
      can break if authentication or endpoints change. Underwriting should treat
      them as developer signal, not an official integration commitment.
    claimRefs:
      - CE005
      - CE006
      - CE013
