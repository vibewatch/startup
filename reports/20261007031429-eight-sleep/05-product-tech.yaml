company:
  name: Eight Sleep
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Eight Sleep's product combines active bed heating and cooling, non-wearable
    sleep sensing, and software-driven overnight adjustments in one consumer
    system. Public evidence supports the broad product loop and an active
    community integration surface, but current-generation efficacy, fleet
    reliability, official API support, and security controls remain material
    diligence gaps.
sections:
  - id: product-and-user-workflow
    title: Product and User Workflow
    body: >-
      The Pod is sold as an active sleep system rather than a passive mattress
      accessory: a bed surface and Hub heat or cool the sleeper while software
      adjusts the environment overnight. Eight Sleep's current product page
      advertises independent sides from 55°F to 110°F and positions Pod 6 as the
      next generation, with Solo sizes starting at $1,999. The principal user
      loop is straightforward—install the hardware, set side-specific
      preferences, sleep on the sensing surface, review metrics in the app, and
      allow Autopilot to change temperature. That loop is differentiated because
      it can alter the sleep environment as well as measure it, although the
      performance outcomes on the official page remain company claims rather
      than independent current-generation benchmarks.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE010
      - CE011
    tableRefs:
      - TE001
      - TE002
  - id: architecture-and-integration
    title: Architecture and Integration Surface
    body: >-
      The defensible public architecture is a closed control loop: the bed
      surface collects sleep and biometric signals, the user supplies schedules
      and preferences through the app, control software decides when to adjust
      temperature, and the Hub drives the thermal response. Community projects
      expose a much broader state and control surface—including temperature,
      presence, sleep stages, heart rate, HRV, respiratory rate, routines,
      alarms, water level, and priming—but those repositories explicitly rely on
      Eight Sleep credentials or reverse engineering. They are useful evidence
      of practitioner demand and observable interfaces, not proof of a supported
      developer platform. The same evidence indicates dependence on account
      authentication, device connectivity, and a continuing service API.
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE012
      - CE013
    tableRefs:
      - TE003
    figureRefs:
      - FE001
  - id: maturity-reliability-and-support
    title: Maturity, Reliability, and Support
    body: >-
      Commercial maturity is clearest in the breadth of support and maintenance
      surfaces rather than in disclosed reliability statistics. Eight Sleep's
      help center treats reservoir refilling, priming, and Autopilot as routine
      customer topics and publishes 24/7 email support plus narrower chat and
      phone windows. A manuals aggregator specifies distilled water mixed with
      3% hydrogen peroxide and says the sensor-bearing Active Grid is not machine
      washable. These requirements create recurring setup and care burden around
      a water-based device. An independent reviewer reports effective
      temperature control but also an older Pod 2 leak and subscription
      limitations; that single-user account is an adverse signal, not a fleet
      failure rate. Warranty cohorts, return rates, leak incidence, pump life,
      and outage history are not established by the assigned evidence.
    claimRefs:
      - CE007
      - CE008
      - CE012
      - CE014
    calloutRefs: []
  - id: research-trust-and-quality-controls
    title: Research, Trust, and Quality Controls
    body: >-
      Eight Sleep describes a structured research process with validation,
      feature-development, exploratory, and long-term studies, followed by
      literature review, product requirements, study design, independent ethics
      review, data collection, analysis, and internal or public sharing. This is
      meaningful evidence of an internal quality process, but it is
      company-issued. The official product page also cites more than 50 studies
      and outcome improvements using "up to" language; those figures should not
      be treated as generalized clinical effects without protocols,
      denominators, and independent replication for Pod 6. BreachHistory
      catalogues no public Eight Sleep incident for 2026, but its page explicitly
      limits the statement to catalogued disclosures. The assigned evidence does
      not establish encryption design, retention rules, access controls,
      penetration testing, certifications, a status SLA, or medical-device
      clearance.
    claimRefs:
      - CE009
      - CE010
      - CE015
