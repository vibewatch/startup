      - number: '8.2'
        title: 论点、反论点与下行证据
        blocks:
          - type: paragraph
            body: >-
              论点是，Eight Sleep
              已把昂贵实体产品转成差异化睡眠平台，拥有已展示的定价能力、较大的已报告累计产品销售额，以及走向受监管医疗的路径。反论点是，估值要求投资者将仍主要处于私有状态的财务和临床结果资本化。保留的报道显示，最高价配置强制收取付费订阅，FDA
              许可仍待取得，且此前云端故障曾损害床铺控制。法律证据也不完整：ClaimWatch 称一起拟议欺诈案件被驳回且不得就同一请求重新起诉，但同一页面又将案卷标为活跃。一个泄露目录称 2026
              年没有收录事件，这只说明该目录的记录，不能证明没有发生事件。这些不确定性使剩余执行、监管、可靠性和披露风险维持高位。
