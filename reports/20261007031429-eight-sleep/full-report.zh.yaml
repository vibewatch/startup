      - number: '2.2'
        title: 市场规模、TAM/SAM/SOM 框架与临床扩张
        blocks:
          - type: paragraph
            body: >-
              现有证据不足以支持可辩护的自上而下 TAM、可服务市场或可获取份额。2026 年 6 月的一篇文章将全球睡眠科技规模 $21 billion、智能床垫规模 $1.8 billion 归因于 Fitt
              Insider，但抓取到的文章没有披露底层方法、预测期间或类别边界。文章还报告 Eight Sleep 自 2019 年以来 Pod 累计销售额超过 $500
              million，但这既不是当前收入，也不是年度市场份额。

              Sacra 补充了人口和地域视角：预计到 2030 年有 1.1 billion 女性经历更年期，中国有 400 million 中产消费者。两项数字都不是买家数量、年度消费池或 Eight Sleep
              可获得的收入。公司来源称产品覆盖超过 34 或 35 个国家，但运输范围不是需求分母。审慎结论只能是方向性的：可触达的细分市场低于广义睡眠科技市场，且仍缺乏公开的家庭收入、换新周期、转化率、留存率和支付意愿数据。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
