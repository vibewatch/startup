      - number: '7.4'
        title: 投资控制与止损标准
        blocks:
          - type: paragraph
            body: >-
              投资判断应按里程碑设门槛，而不是假定医疗转型、韧性控制或订阅经济已经得到证明。在赋予医疗健康价值前，应取得 FDA 申报编号、机构往来、试验方案和声明控制政策。在把 Backup Mode
              视为完整控制措施前，应由独立故障测试证明云端、互联网和电力中断时仍能安全本地运行。隐私尽调应确认生物特征数据的删除、转移、二次使用和控制权变更权利。最后，需要群组流失、退款率、保修索赔、毛利率、现金消耗、现金跑道和供应商集中度，以量化剩余风险。若无法证明这些控制措施，这是打破论点的触发条件，而不是风险已经实现的证据。
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
