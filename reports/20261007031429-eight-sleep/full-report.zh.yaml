      - number: '1.2'
        title: 管理层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              Eight Sleep 由创始人主导管理，关键人物风险主要集中在首席执行官 Matteo Franceschetti 和品牌与营销副总裁 Alexandra Zatarain 身上。Franceschetti
              曾任 Freshfields Bruckhaus Deringer 和 Allen & Overy 的证券律师，也曾创办并退出清洁技术企业，负责战略愿景与外部资本配置。Zatarain
              负责品牌架构、网红合作及支撑消费者需求的高端定位。首席技术官 Massimo Andreasi Bassi 负责硬件与软件系统架构。更广泛的管理团队和科学顾问委员会汇集 12
              名博士及睡眠科学家，支持产品功效研究。但商业叙事和高端品牌曝光高度依赖两位创始人，形成显著的关键人物依赖。董事会和股权结构表中有 HSG、Founders Fund、Khosla Ventures、Valor
              Equity Partners、SoftBank 和 Y Combinator 等机构投资者，也有 Charles Leclerc、Zak Brown 等知名个人投资人。
