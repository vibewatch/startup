              公开证据不支持传统收入倍数估值：当前收入、ARR、毛利率、经常性收入占比、留存和正常化自由现金流均未披露。Multiples 数据库提供横跨化妆品、家电、电子和电信的公开参考公司，其他报道则将
              Oura、Apple、Whoop 和 ResMed 列为产品或临床竞争者。这些内容有战略参考价值，但由于商业模式、利润率、监管和收入结构不同，不能构成干净的估值基准。因此，情景表只对 $1.5 billion
              headline 入场估值进行透明算术。表中数值不是预测，也不考虑摊薄、清算优先权、债务、期权池扩张、税费或退出时间；这些遗漏条款可能大幅降低普通股回报。
