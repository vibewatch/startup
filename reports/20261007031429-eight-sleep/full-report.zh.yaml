      - number: '8.4'
        title: 退出准备度、尽调要求与论点破坏触发条件
        blocks:
          - type: paragraph
            body: >-
              退出准备度尚未得到证明，而不是已经缺失。当前融资估值证明了投资者需求，但证据没有显示公司拥有可 IPO
              的报告体系、持久的公开市场利润率或已披露的买方名单。投资前应取得按硬件和订阅拆分的月度收入、毛利率和贡献利润、群组留存、保修与退货率、现金转换、董事会批准的预测、债务、清算优先权、参与权、反摊薄条款和期权池义务。同时要求
              FDA
              往来、临床验证方案、宕机复盘、离线控制测试结果、隐私控制和最终消费者案件案卷。论点破坏触发条件包括：监管许可失败或严重延迟，同时继续投入医疗定位；控制功能反复宕机；订阅留存恶化；正常化自由现金流为负；或融资条款使新增普通股资本处于次位。仅降低价格不能弥补证据缺失，但经验证的经济模型可能将建议从观望推向考虑。
