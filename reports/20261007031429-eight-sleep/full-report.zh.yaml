        title: 展示项
        blocks:
          - type: callout
            title: 以里程碑设门槛的论点破坏触发条件
            body: 在没有可验证的 FDA 记录和临床证据包之前，不应计入受监管医疗溢价。若独立 Backup Mode 测试失败、生物特征数据删除或转移控制不足，或公司拒绝提供群组留存、保修、利润、现金消耗和跑道证据，应暂停投资。
            calloutType: risk
