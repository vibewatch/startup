      - number: '2.3'
        title: 买家细分、流程归属与订阅经济
        blocks:
          - type: paragraph
            body: >-
              目前观察到的市场路径由消费者主导：家庭是买家和付款人，一至两名睡眠者是用户，Eight Sleep
              持有软件关系。公司定位提到情侣、训练和恢复用户，以及应对孕期或更年期的女性；这些是使用场景，不是独立测量的需求池。用户需要接受较高的前期价格、持续的软件决策、在现有床上安装设备，并相信每晚调节能带来足够收益，从而持续使用。

              当前 $100 至 $400 的促销显示，价格营销是获客的一部分，但优惠页面不能证明转化提升或持久的支付意愿。公开来源还使用了不同订阅周期和产品代际：Wikipedia 报告 2023 年 2 月的年费为
              $180 至 $288，而 2026 年 6 月的一篇文章报告 Pod 5 月费为 $17 至 $33。这些区间不应直接等同。临床、雇主或报销付款人仍是未来可能性，而不是已有证据支持的当前细分。
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
