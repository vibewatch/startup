      - number: '7.3'
        title: 商业模式与依赖风险
        blocks:
          - type: paragraph
            body: >-
              商业韧性取决于消费者是否同时接受高端硬件和持续软件费用。Fortune 报道自动控制和追踪需要每年 $199-to-$399 的订阅，FitnessNav 则认为成本和订阅模式限制了可及性。Eight Sleep
              自有页面如今宣传 $1,999 起价、30 晚退货期和最长五年的保障；这些政策能缓解购买焦虑，但没有披露留存、保修发生率或单位经济。一个载有 Forge 衍生数据的 Yahoo Finance
              页面进一步说明估值模型存在不确定性：页面显示 $1.08 billion 估计值，同时警告 Forge Price 不是报价，且可能依赖有限数据。因此，已融资金额、模型估值与可用现金应继续作为彼此独立的尽调问题。
            claimRefs:
              - CR007
