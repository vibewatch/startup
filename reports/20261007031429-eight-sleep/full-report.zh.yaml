      - number: '1.3'
        title: 资本化轨迹、里程碑与医疗健康转向
        blocks:
          - type: paragraph
            body: >-
              Eight Sleep 累计股权融资超过 $310 million，私募市场估值从 2021 年的 $500 million，升至 2025 年 8 月接近 $1.0 billion，最终于 2026 年 3
              月达到 $1.5 billion。稳定币发行商 Tether 最新投入的 $50 million 巩固了公司独角兽估值，并为国际扩张和临床验证提供流动性。运营纪律使公司在整个 2025 年保持自由现金流为正，与
              2026 年年中进入 Chapter 11 破产程序的 Sleep Number 等陷入困境的消费硬件同行形成对比。Eight Sleep 的战略路线图把有计划的临床转型放在核心位置：公司正积极寻求 FDA
              对睡眠呼吸暂停检测和体位干预的医疗器械许可，并与 Abu Dhabi Department of Health 启动临床试验。同时，独立监测服务在 2026
              年未记录数据泄露事件，但生物特征数据安全和医疗监管合规仍是关键运营门槛。
