        - 按公开证据看偏高
        - 价格锚点是当前的，但盈利和现金流基础未公开。
      - - 入场纪律
        - 以尽调为前置条件
        - 定价前必须取得财务、客户队列、股权表、FDA、中断和隐私证据。
    notes: 截至 2026-10-07 的分析判断；$1.5B 是据报道的融资估值，不是经过核实的企业价值，也不是独立评估的价格。
    claimRefs:
