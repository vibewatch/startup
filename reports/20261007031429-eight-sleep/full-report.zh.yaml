  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律边界
        blocks:
          - type: paragraph
            body: >-
              后果最严重的风险，是从消费者健康消费转向受监管医疗。Fortune 和 Eastern Herald 报道 Eight Sleep 正寻求睡眠呼吸暂停检测和缓解的 FDA 许可，Fortune
              称配套临床工作正在进行。Eastern Herald 表示，在获得许可前，Pod 不能被描述为医疗器械，也不能用于具体诊断声明。因此，监管论点依赖一份现有证据池未通过 FDA
              记录独立核验的许可和证据包。法律证据也需要谨慎限定：Eight Sleep 对 Orion 和 Blue Fuzion 提起的诉讼是公司自身的指控，而 ClaimWatch
              对另一起消费者案件给出了相互矛盾的状态描述。两者都不能作为假设责任或案件已解决的依据。
