chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、成立背景与商业模式
        blocks:
          - type: paragraph
            body: >-
              Eight Sleep 由 Matteo Franceschetti、Alexandra Zatarain 和 Massimo Andreasi Bassi 于 2014
              年创立，处于消费硬件与数字健康交汇处。公司总部位于纽约州纽约市，已从 Indiegogo 上的早期众筹项目发展为覆盖 35 个国家的成熟睡眠健身企业。其核心价值主张是 Pod 系统：主动调节温度的床垫套，在
              55°F 至 110°F 之间循环加热或冷却水，同时无需可穿戴设备即可被动监测心血管和呼吸生命体征。Eight Sleep 将前期硬件采购与每年 $199 至 $399 的强制或高端 Autopilot
              软件订阅绑定。双重收入模式既带来较高的初始客单价，也带来持续的软件现金流，推动 Pod 产品累计销售额超过 $500 million。作为 DTC 品牌，公司约有 100
              名员工，依靠软件自动化和外包制造，维持运营现金流可持续性。
            claimRefs:
