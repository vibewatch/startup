              Eight Sleep 通过以 Pod 睡眠健身系统为核心的 DTC 联网硬件加订阅模式变现。前期硬件价格从入门 Solo 配置的 $1,999，到旗舰 Pod 5 Ultra 系统（含可调底座）的 $5,000
              以上 [CI001, CI005]。要使用动态双区 Autopilot 温控和健康监测等核心智能功能，客户必须维持每月 $17 至 $33 的软件订阅 [CI004, CI005]。ECDB
              的第三方商业估算称，eightsleep.com 在 2025 年产生 $264M 年度电商 GMV，营收同比增长几乎为零（<0% YoY），且 100% 交易由一方完成 [CI007, CI008]。自
              2019 年首款 Pod 上市以来，累计硬件销售额超过 $500M [CI003]。强制订阅为每台新部署设备附加可预测的持续软件收入，但私营公司披露不足以看清硬件销售与高毛利软件订阅之间的确切收入拆分。
