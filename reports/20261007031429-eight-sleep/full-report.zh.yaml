  - id: TV002
    title: 论点与反论点
    columns:
      - 立场
      - 基于证据的论点
      - 哪些事实会改变判断
    rows:
      - - 论点
        - 高端硬件起售价为 $1,999，公司称评价数量广泛。
        - 若能核实客户队列留存率以及较低的退货率和保修率，将强化定价权证据。
      - - 论点
        - 报道将 2019 年以来超过 $500M 的 Pod 累计销售额归于该公司。
        - 按年份和产品审计、并与现金核对的收入数据，才能把累计销售额转化为可纳入投资判断的趋势。
      - - 论点
        - 据报道，管理层称公司在 2025 年实现自由现金流为正。
        - 银行流水和标准化现金流桥接表能证明持续性，而不是只证明单一期间的说法。
      - - 反论点
        - FDA 许可仍未获批，而高端系统带有经常性订阅经济性。
        - 获得许可、独立验证结果以及透明的流失率数据，可能降低商业化风险。
      - - 反论点
        - 中断报道和内部自相矛盾的二手法律记录留下未解决的可靠性与法律尽调问题。
        - 离线控制测试、事件历史和官方最终案卷将缩小剩余风险。
    notes: 累计销售额不是当前年度收入或 ARR，公司报告的自由现金流为正也不等于已披露现金余额、消耗率或现金跑道。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV015
  - id: TV003
    title: 牛市、基准和熊市情景框架
    columns:
      - 情景
      - 运营假设
      - 说明性主值
      - 总价值倍数
      - 主要风险
      - 概率信号
    rows:
      - - 牛市
        - 订阅留存持久，受监管医疗业务取得进展，控制系统可靠，标准化现金流持续为正。
        - $4.50B
        - 3.0x
        - 临床进展延迟、高端市场饱和、稀释和优先权悬置。
        - 经审计的增长和现金转化，加上 FDA 进展，会让证据更接近这一情景。
      - - 基准
        - 产品需求持续，但财务不透明度只会逐步收窄，健康表述仍以健康管理为主。
        - $2.25B
        - 1.5x
        - 倍数压缩、经常性收入经济性参差不齐，退出窗口拉长。
        - 客户队列稳定、披露改善但尚未完成临床验证，符合这一情景。
      - - 熊市
        - 留存率下降、中断再次发生、监管进展停滞，或未来融资重置价格和优先顺位。
        - $0.75B
        - 0.5x
        - 下轮融资、顺位劣后、现金消耗以及战略买家兴趣受限。
        - 不利的客户队列、现金流、事件或融资证据会使判断转向这一情景。
    notes: 数值是基于据报道的 $1.5B 融资估值所作的算术示例，未计稀释、优先权、债务、税费、货币时间价值和交易成本； 不是预测、概率、企业价值或目标价格。
    claimRefs:
      - CV001
      - CV008
      - CV010
      - CV011
      - CV012
      - CV015
      - CV016
