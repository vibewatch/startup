      - number: '7.2'
        title: 运营韧性与隐私
        blocks:
          - type: paragraph
            body: >-
              联网温控硬件带来一个风险：软件可用性会变成物理产品控制问题。Eastern Herald 报道，2025 年 10 月 AWS 故障使部分床铺行为异常，包括过热至 110 degrees Fahrenheit
              以及卡在抬高位置；报道还称 Eight Sleep 随后宣布 Bluetooth Backup
              Mode。这是具体的缓解措施，但现有公开记录无法证明其独立测试覆盖范围，也无法证明所有关键功能都能在本地运行。FitnessNav 另称，系统依赖 App
              设置、Wi-Fi、固件更新和电力。隐私暴露是结构性问题而非已证实事件：Eastern Herald 描述持续收集生物特征，且保护边界弱于 HIPAA 健康记录；BreachHistory
              的空目录只说明该目录没有记录，不能证明没有发生事件。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR015
              - CR016
