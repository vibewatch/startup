      - number: '1.4'
        title: 展示项
        blocks:
          - type: callout
            title: 从高端健康小工具转向可报销医疗器械
            body: >-
              Eight Sleep 正试图将 Pod 平台转为获 FDA 许可、用于检测和缓解睡眠呼吸暂停的医疗器械，以摆脱消费硬件周期性。传统床垫巨头 Sleep Number 在高债务和零售逆风下于 2026 年年中陷入
              Chapter 11 破产，而 Eight Sleep 依靠较高的 DTC 软件附加率维持盈利，并瞄准保险报销路径，以触达非奢侈品人群。
