  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              可投资结论是按兵观望，而不是在所报道的 $1.5 billion 估值买入。独立记录基本印证了 2026 年 3 月以该 headline 估值完成 $50 million 融资；公司网站显示高端产品起价
              $1,999，公司披露的增长信号包括超过 30,000 条评价中的 4.5
              分。这些信号支持产品相关性和融资能力，但都不能证明持续收入、毛利率、留存或可分配现金生成。因此，入场应以当前经审计财务报表、群组数据、订阅附加率和流失率、硬件保修经济以及完整优先股堆叠为条件。在缺少这些信息时，相对于公开证据能支撑的水平，该估值偏高；即便产品和融资信号可信，信心仍为中低。
