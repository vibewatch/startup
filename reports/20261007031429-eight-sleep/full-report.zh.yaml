  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、类别范围与现状替代品
        blocks:
          - type: paragraph
            body: >-
              可投资市场边界比床垫或数字健康任一类别都窄。Eight Sleep
              销售的是高端硬件加订阅系统，核心功能是主动控制床面温度、被动感知睡眠和自动个性化；普通床垫、凉感寝具、室内空调、可穿戴设备以及什么都不做，都是替代品，不应计入该市场。公司当前页面将 Solo 配置起售价定为
              $1,999，而第三方描述显示，高端系统及软件价格更高。

              这一框架排除了普通床垫更换和广义健康消费，除非购买行为明确替代主动温控与感知睡眠系统。它也将今天的消费者健康品类与未来可能受监管的医疗健康邻接市场区分开来。Pod
              的水循环双区控制和被动感知形成差异化组合，但公开来源没有量化有多少家庭同时看重两项功能、多少家庭原本会购买传统高端床垫，或多少可穿戴设备用户把床上系统视为替代品。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM010
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM003
              - CM004
