      - number: '2.4'
        title: 增长驱动、架构脆弱性与采用约束
        blocks:
          - type: paragraph
            body: >-
              增长可能来自扩大地域覆盖、增加使用场景，以及从健康消费转向受监管医疗。Eight Sleep 2026 年 3
              月的公告将资本投向临床试验、监管路径、预测模型和商业合作；但这些动作也提高了证明负担。独立报道称，睡眠呼吸暂停检测与缓解的 FDA 许可已提交但尚未获得，而 2025 年 10
              月的云端故障暴露了公司对远程基础设施的依赖，并据报道扰乱了温度或升降功能。

              公开负面事件核查并不完整。BreachHistory 的公开记录中未见 2026 年事件，但目录中没有记录不能证明事件从未发生。ClaimWatch
              自相矛盾地将一起消费者欺诈案件同时描述为诉讼中和驳回且不得就同一请求重新起诉；只有一手案卷才能确定状态。在一手监管状态、离线韧性、隐私控制、留存、群组经济和法律记录完成核验前，投资判断不应给予临床市场或信任溢价。
            claimRefs:
              - CM008
              - CM009
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 订阅条款必须按产品和周期归一化
            body: 公开来源针对不同日期和产品代际报告了不同的年费和月费区间。这些数据说明持续付款存在摩擦，但不足以支持一个统一的当前价格或有吸引力的单位经济。
            calloutType: insight
            claimRefs:
              - CM013
              - CM014
          - type: callout
            title: 临床转型门槛：健康消费声明与 FDA 许可之间的差距
            body: Eight Sleep 曾描述用于睡眠呼吸暂停检测与缓解的 FDA Class II 申报，但现有证据无法证明已获许可、已有临床采购或已有报销。因此，临床上行空间仍是期权，而非基础市场需求。
            calloutType: risk
            claimRefs:
              - CM008
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与分类
        blocks:
          - type: paragraph
            body: >-
              Eight Sleep 周围的竞争场涵盖五类睡眠优化和温控替代方案。直接竞争者提供可安装在现有床垫上的主动水循环或热电制冷、加热床垫套，包括 sleepme（原 ChiliSleep，拥有 Dock Pro 和
              Chilipad 2.0 平台）、Orion Sleep Systems，以及欧洲新进入者 Qimora Sleep Core。以 Sleep Number
              为代表的智能床制造商，把主动热平衡和可调气囊硬度嵌入完整床架，而不是销售独立改装床垫套；其产品包括 SleepIQ 360 和 Climate360。相邻的技术型睡眠追踪器，如 SleepScore Max 和
              Sleep.ai，提供非接触式声学或光学生物特征分析，但没有微气候硬件。现状和被动替代品包括 Tempur-Pedic（TEMPUR-Breeze）、Purple（GelFlex
              Grid）、Casper（Snow hybrid）和 Saatva（Solaire）等高端床垫制造商，它们依靠先进相变材料和开孔泡沫缓解热量滞留，不使用主动机电硬件或持续软件订阅。最后，BedJet 3
              等低价对流空气系统以预算价格提供强制风冷暖，不循环液体，也不设置 SaaS 付费墙。Eight Sleep 主要凭借预测式闭环机器学习、覆盖 55°F 至 110°F
              的双区动态温度范围和丰富的无可穿戴生物特征实现差异化，但仍容易受到消费者订阅疲劳的冲击。
