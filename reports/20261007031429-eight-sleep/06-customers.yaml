    title: Eight Sleep Customer Acquisition, Onboarding, and Retention Journey
    type: journey-map
    summary: End-to-end customer lifecycle spanning influencer discovery, high-ticket hardware purchase, nighttime onboarding, and subscription retention friction.
    data:
