callouts:
  - calloutType: insight
    title: Dual-Zone Thermoregulation as a Household Habit Anchor
    body: Unlike personal wearable trackers that measure an individual in isolation, Eight Sleep's dual-zone Pod solves a two-person household friction point by enabling independent temperature scheduling on the same mattress. This creates a powerful shared-use habit anchor, as neither partner can alter the master climate without disrupting the other, reinforcing product indispensability.
    claimRefs:
      - CU001
      - CU004
  - calloutType: risk
    title: Software Paywalling of Hardware Functionality Creates Churn Exposure
    body: Eight Sleep's requirement that owners maintain an ongoing $17 to $33 monthly Autopilot subscription to access dynamic temperature adjustments and advanced biometric telemetry creates latent customer resentment. If subscription fees escalate or if cloud outages sever real-time functionality, customers face hardware degradation on an expensive mattress cover, heightening long-term cohort churn risk.
    claimRefs:
      - CU002
      - CU010
      - CU011
      - CU012
