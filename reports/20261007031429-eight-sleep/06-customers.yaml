        - label: Discovery & Validation
          detail: Exposure via athlete ambassadors, podcast endorsements (Huberman), or social media; comparison of active vs passive cooling.
          tone: neutral
        - label: High-Ticket Purchase
          detail: Upfront investment of $1,999 to $5,000+ with 30-night home trial, financing options, or Truemed HSA/FSA qualification.
          tone: neutral
        - label: Unboxing & Setup
          detail: Connecting bedside Hub, filling reservoir with distilled water and hydrogen peroxide, pairing to 2.4GHz Wi-Fi network.
          tone: neutral
        - label: Nocturnal Habituation
          detail: Experiencing dual-zone thermoregulation (55°F–110°F), adjusting initial comfort preferences, receiving morning sleep scores.
          tone: positive
        - label: Autopilot Optimization
          detail: Cloud AI learns individual recovery patterns; automated predictive cooling responds to sleep stage shifts and room temps.
          tone: positive
        - label: Renewal & Paywall Friction
          detail: Annual subscription renewal ($199–$399/yr); risk of feature degradation or churn if cloud service is interrupted.
          tone: negative
    approximationNotes: "Lifecycle stages mapped from Eight Sleep customer onboarding documentation, agency marketing teardowns, and user reviews."
