      - CV010
      - CV011
      - CV012
      - CV015
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Evidence-based argument
      - What would change the view
    rows:
      - - Thesis
        - Premium hardware starts at $1,999 and the company reports broad review volume.
        - Verified cohort retention and low return and warranty rates would strengthen pricing-power evidence.
      - - Thesis
        - Reporting attributes more than $500M of cumulative Pod sales since 2019 to the company.
        - Audited revenue by year and product, reconciled to cash, would convert cumulative sales into an underwritable trend.
      - - Thesis
        - Management reportedly said the company reached free-cash-flow positivity in 2025.
        - Bank statements and normalized cash-flow bridges would establish durability rather than a single-period claim.
      - - Anti-thesis
        - FDA clearance remains pending and the premium system carries recurring subscription economics.
        - Clearance, independently validated outcomes, and transparent churn could reduce commercialization risk.
      - - Anti-thesis
        - Outage reporting and an internally inconsistent secondary legal record create unresolved reliability and legal diligence.
        - Offline-control testing, incident history, and the official final docket would narrow residual risk.
    notes: >-
      Cumulative sales are not current annual revenue or ARR, and company-reported
      free-cash-flow positivity is not a disclosed cash balance, burn rate, or runway.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV015
  - id: TV003
    title: Bull, base, and bear scenario framework
    columns:
      - Case
      - Operating assumptions
      - Illustrative headline value
      - Gross value multiple
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - Durable subscription retention, regulated-health progress, reliable controls, and sustained positive normalized cash flow.
        - $4.50B
        - 3.0x
        - Clinical delays, premium-market saturation, dilution, and preference overhang.
        - Audited growth and cash conversion plus FDA progress would move evidence toward this case.
      - - Base
        - Product demand persists but financial opacity narrows only gradually and health claims remain wellness-led.
        - $2.25B
        - 1.5x
        - Multiple compression, mixed recurring economics, and a longer exit window.
        - Stable cohorts and improving disclosure without full clinical validation would fit this case.
      - - Bear
        - Retention weakens, outages recur, regulatory progress stalls, or future financing resets price and seniority.
        - $0.75B
        - 0.5x
        - Down round, subordination, cash consumption, and constrained strategic-buyer interest.
        - Adverse cohort, cash-flow, incident, or financing evidence would move the view here.
    notes: >-
      Values are arithmetic illustrations from the reported $1.5B financing mark,
      before dilution, preferences, debt, taxes, time value, and transaction costs;
      they are not forecasts, probabilities, enterprise values, or target prices.
    claimRefs:
      - CV001
      - CV008
      - CV010
      - CV011
      - CV012
      - CV015
      - CV016
