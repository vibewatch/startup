company:
  name: Eight Sleep
chapter:
  number: 8
  title: Valuation
  summary: >-
    A $50 million March 2026 financing provides a current $1.5 billion headline
    valuation anchor, but the retained public evidence does not disclose the
    operating metrics or security terms needed to underwrite that price. The
    resulting stance is track, with high risk and medium-low confidence pending
    a verified financial, retention, regulatory, reliability, and cap-table package.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The investable conclusion is track rather than buy at the reported $1.5
      billion mark. Independent records broadly corroborate a $50 million March
      2026 financing at that headline valuation, while the company website shows
      a premium product starting at $1,999 and company-reported traction includes
      a 4.5 rating across more than 30,000 reviews. Those signals support product
      relevance and access to capital, but neither establishes recurring revenue,
      gross margin, retention, or distributable cash generation. Entry should
      therefore be conditioned on current audited financials, cohort data,
      subscription attach and churn, hardware warranty economics, and the full
      preference stack. Without those items, the valuation is stretched relative
      to what public evidence can substantiate, and confidence remains medium-low
      even though the product and financing signals are credible.
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV008
      - CV015
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: thesis-antithesis-and-risk
    title: Thesis, anti-thesis, and downside evidence
    body: >-
      The thesis is that Eight Sleep has converted an expensive physical product
      into a differentiated sleep platform with demonstrated pricing power,
      substantial reported cumulative product sales, and a pathway toward
      regulated health use. The anti-thesis is that the valuation asks investors
      to capitalize financial and clinical outcomes that remain mostly private.
      The retained reporting describes a mandatory paid subscription on the
      highest-priced configuration, pending FDA clearance, and a prior cloud
      outage that impaired bed controls. Legal evidence is also imperfect:
      ClaimWatch says a proposed fraud case was dismissed with prejudice, yet
      the same page labels the docket active. A breach catalog reports no
      catalogued 2026 event, which is only a statement about that catalog and
      is not proof that no incident occurred. These uncertainties keep residual
      execution, regulatory, reliability, and disclosure risk high.
    claimRefs:
      - CV005
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
    tableRefs:
      - TV002
  - id: scenarios-and-comparable-context
    title: Scenario framing and comparable context
    body: >-
      Public evidence does not support a conventional revenue-multiple valuation:
      current revenue, ARR, gross margin, recurring mix, retention, and normalized
      free cash flow are absent. The Multiples database offers public reference
      names spanning cosmetics, appliances, electronics, and telecom, while other
      reporting identifies Oura, Apple, Whoop, and ResMed as product or clinical
      competitors. That is useful strategic context but not a clean valuation
      benchmark because business models, margins, regulation, and revenue mix
      differ. The scenario table therefore uses only transparent arithmetic on
      the $1.5 billion headline entry mark. Its values are not forecasts and do
      not account for dilution, liquidation preferences, debt, option-pool
      expansion, taxes, or time-to-exit; those omitted terms can materially reduce
      common-equity returns.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
      - CV014
      - CV016
    tableRefs:
      - TV003
  - id: exit-readiness-and-diligence-gates
    title: Exit readiness, diligence asks, and thesis-break triggers
    body: >-
      Exit readiness is unproven rather than absent. The current financing mark
      demonstrates investor demand, but the evidence does not show an IPO-ready
      reporting package, durable public-market margins, or a disclosed buyer set.
      Before investment, obtain monthly revenue by hardware and subscription,
      gross margin and contribution margin, cohort retention, warranty and return
      rates, cash conversion, board-approved forecasts, debt, liquidation
      preferences, participation rights, anti-dilution provisions, and option-pool
      obligations. Also require FDA correspondence, clinical-validation protocols,
      outage postmortems, offline-control test results, privacy controls, and the
      final consumer-case docket. Thesis-break triggers are failed or materially
      delayed regulatory clearance paired with continued medical-positioning
      spend, recurring control outages, worsening subscription retention, negative
      normalized free cash flow, or financing terms that subordinate new common
      capital. A lower price alone would not cure missing evidence, but verified
      economics could move the recommendation from track to consider.
    claimRefs:
      - CV001
      - CV008
      - CV010
      - CV011
      - CV012
      - CV013
      - CV015
      - CV016
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Dimension
      - Current view
      - Decision implication
    rows:
      - - Recommendation
        - Track
        - Do not underwrite the reported $1.5B mark without a private diligence package.
      - - Confidence
        - Medium-low
        - Financing and product signals are visible, but core operating metrics are not.
      - - Risk rating
        - High
        - Regulatory, reliability, legal-record, and disclosure uncertainty remain material.
      - - Valuation stance
        - Stretched on public evidence
        - The price anchor is current; the earnings and cash-flow basis is not public.
      - - Entry discipline
        - Diligence-gated
        - Require financial, cohort, cap-table, FDA, outage, and privacy evidence before pricing.
    notes: >-
      Analytical judgment as of 2026-10-07; the $1.5B figure is a reported financing
      valuation, not a verified enterprise value or an independently appraised price.
    claimRefs:
