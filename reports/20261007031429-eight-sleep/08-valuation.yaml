          detail: Three independent records report a $50M March 2026 financing at this headline valuation.
        - id: product-signal
          label: Premium product signal
          detail: Official pricing starts at $1,999, with company-reported review volume and satisfaction.
        - id: cash-claim
          label: Positive cash-flow claim
          detail: Management reportedly said free-cash-flow positivity was reached in 2025.
        - id: missing-economics
          label: Underwriting metrics missing
          detail: Revenue, ARR, gross margin, retention, normalized cash flow, and financing terms remain private.
        - id: downside
          label: Residual risk remains high
          detail: FDA, outage, privacy, and legal-record questions can impair commercialization or exit value.
        - id: recommendation
          label: Track; diligence-gated
          detail: Require verified economics and terms before considering investment at any price.
      edges:
        - from: current-mark
          to: product-signal
        - from: product-signal
          to: cash-claim
        - from: cash-claim
          to: missing-economics
        - from: missing-economics
          to: downside
        - from: downside
          to: recommendation
    approximationNotes: >-
      This is a qualitative decision chain; it does not assign probabilities or
      infer financial performance from review counts, pricing, or funding raised.
