  topStrengths:
    - Real enterprise proof from complex engineering environments including Pure Storage, Intercom, WEX, and Rubrik.
    - Product story extends beyond autocomplete into repo-scale context, governed workflow support, and remote-agent execution.
    - Large 2024 financing and strong investor roster reduced near-term capital-scarcity risk.
    - Category tailwinds in enterprise coding agents remain meaningful even as competition intensifies.
  topRisks:
    - 'Public economics remain thin: no disclosed ARR, gross margin, NRR, burn, or customer-concentration detail.'
    - Trust, security, and legal diligence remain central because the platform touches sensitive proprietary code and increasingly automates real work.
    - Pricing and moat could compress against incumbents, bundled model providers, and faster-moving AI coding competitors.
    - High-quality customer logos may still overstate deployment depth, renewal durability, or breadth of expansion.
    - Any materially richer entry than the public 2024 anchor would be hard to defend without private proof.
  unresolvedGaps:
    - Current ARR, growth, gross margin, NRR, burn, and runway.
    - Customer concentration, renewal behavior, and breadth of deployment inside named accounts.
    - Exact terms and size of any post-2024 financing or valuation step-up.
    - Win-loss data and realized pricing versus Copilot, Cursor, Anthropic, and other rivals.
    - Independent security / reliability proof beyond company-authored materials.
