companyProfile:
  summary: >-
    Augment is a 2022-founded, privately held enterprise AI coding company focused on large
    engineering teams that need repo-scale context, governed workflow automation, and stronger
    security / privacy controls than lightweight individual developer tools typically provide.
    Public evidence supports a real enterprise product, meaningful named-customer proof, and a
    large 2024 financing, but still leaves core private-company questions unresolved around ARR,
    gross margin, retention, concentration, and later-round economics.
