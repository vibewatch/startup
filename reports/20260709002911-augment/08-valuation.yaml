- id: TV005
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - ARR materially below premium thresholds
    - Current ARR too low for even ~10x support
    - Near-unicorn price looks full or worse
    - Move to pass or deep price renegotiation
  - - Weak NRR / shallow expansions
    - Named accounts fail to broaden beyond pilot depth
    - Customer proof loses valuation relevance
    - Downgrade to track only
  - - Price compression against bundles
    - Wins require commodity seat pricing
    - Scarcity premium disappears
    - Re-underwrite on lower multiple band
  - - Gross margin / burn too AI-cost-heavy
    - Economics fail premium software expectations
    - Public comp framework no longer fits
    - Reject premium entry
  - - Later-round terms are protective or weak-quality
    - Headline valuation overstates economics
    - Cap-table quality weaker than narrative
    - Reduce confidence or pass
  notes: These are the few variables most capable of moving Augment from plausible to overpriced.
