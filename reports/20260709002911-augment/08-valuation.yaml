- id: TV004
  title: Comparable Valuation Table
  columns:
  - Comparable
  - Metric / status
  - Why it matters
  - Relevance
  - Limitation
  rows:
  - - Cursor / Anysphere
    - 2025-2026 private mega-round and acquisition reporting
    - Upper-end private-market comp for breakout AI coding tools
    - Shows how rich the category can price proven scale
    - Too hot and too scaled to map directly onto Augment
  - - Replit / Codeium
    - Official or widely reported private funding benchmarks
    - Mid-band coding-tool comps for developer workflow platforms
    - Shows the category does not price every tool like Cursor
    - Different customer mix and product positioning
  - - Sourcegraph
    - Official Series D plus profile context
    - Enterprise code-intelligence and workflow adjacency comp
    - Closer to Augment's context / workflow narrative
    - Older round and imperfect revenue visibility
  - - Datadog / GitLab / MongoDB / Atlassian
    - Audited public filings
    - Public-market discipline benchmark for premium software multiples
    - Defines the metrics later-stage investors eventually must satisfy
    - No perfect one-to-one AI coding agent analog
  - - HashiCorp strategic M&A
    - IBM deal at $6.4B
    - Strategic exit benchmark for enterprise infrastructure software
    - Useful as downside or exit context
    - Not an AI coding assistant company
  notes: The comp set mixes hot private AI coding names, enterprise code/workflow references, and audited public software companies because no single clean Augment analog exists.
