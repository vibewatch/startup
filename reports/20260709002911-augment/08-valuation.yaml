- id: comparable-framework-and-multiple-context
  title: Comparable Framework and Multiple Context
  body: 'Because Augment does not disclose the metrics needed for a true intrinsic model, valuation has to start with frameworks and comparable sets. Public software filings from Datadog, GitLab, MongoDB, and Atlassian are useful because they show the measurement discipline real public investors expect: revenue quality, retention, margin, and operating leverage. At the same time, the private comp file for AI coding tools has become unusually hot. TechCrunch and CNBC reporting around Cursor point to a market willing to grant extremely rich prices to breakout coding platforms with visible scale, while Replit, Codeium, and Sourcegraph show a much wider spread below that extreme. Put differently, Augment sits between two comp worlds: auditable public software discipline and hype-prone private AI scarcity. That is why price sensitivity matters more than generic admiration for the product category. Comp selection can change the answer as much as company quality does.'
