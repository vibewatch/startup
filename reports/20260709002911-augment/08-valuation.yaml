- id: diligence-asks-and-thesis-breaks
  title: Diligence Asks and Thesis Breaks
  body: The remaining valuation work is straightforward in concept even if it is impossible from public sources alone. Investors need current ARR, gross margin, NRR, concentration, later-round terms, and evidence on how much customer value is landing as durable paid expansion rather than narrative. They also need to know whether the company's AI-specific cost structure still behaves like premium software economics. Strategic-exit comps such as HashiCorp show that quality enterprise workflow assets can attract meaningful M&A values, but exit optionality is a backstop rather than a reason to overpay. The real thesis-breakers are weak renewals, shallow deployments behind the best logos, material price compression against bundled rivals, or margins that fail to support premium software multiples. Until diligence closes those gaps, valuation should stay scenario-based and medium-confidence. That is enough for serious interest, not final conviction. A disciplined investor should want proof of economics before paying for possibility today.'
