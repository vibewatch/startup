company:
  name: Augment
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports Augment's April 2024 near-unicorn pricing and later unicorn framing, but not the private economics required to know whether that entry is attractive. Customer proof, category momentum, and premium private coding-tool comps argue against dismissing the mark, while missing ARR, retention, margin, and concentration data argue against aggressive buy-in. Relative to both public developer-software comparables and hotter private AI coding transactions, Augment looks plausible but not obviously cheap, so the right stance from public evidence alone is price-sensitive track / research-more.
sections:
- id: current-valuation-facts-and-why-opacity-matters
  title: Current Valuation Facts and Why Opacity Matters
  body: The cleanest valuation facts in the public record are the headline financing anchors, not the economics underneath them. Augment's April 2024 round was widely reported at $227 million and a $977 million valuation, with roughly $252 million of cumulative capital raised around the stealth exit. Secondary and profile sources later support unicorn framing, but the exact size, structure, and preference quality of any later step-up are still unclear. That distinction matters. A company can deserve attention and still be too hard to price. Public outsiders do not know ARR, gross margin, burn, net retention, or customer concentration, so they cannot tell whether the near-unicorn mark was conservative, fair, or already full. The practical takeaway is that valuation opacity is the central issue, not whether investors cared about the company. The market signal is real; the underwriting proof remains incomplete. Investors are being asked to trust the silhouette more than the ledger today publicly.
  claimRefs:
