- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - ARR and growth
    - Current ARR, growth, and forward pipeline
    - Needed to locate Augment on a real multiple band
    - Request board deck or latest management accounts
  - - Gross margin and COGS
    - GAAP gross margin plus inference / infrastructure burden
    - Needed to test premium-software economics
    - Request finance pack and provider-cost bridge
  - - Retention and concentration
    - NRR, logo retention, top-customer concentration
    - Needed to know if logos translate into durable value
    - Request cohort analysis and top-customer schedule
  - - Later-round terms
    - Exact size, price, preference, and secondary mix of post-2024 financing
    - Needed to assess valuation quality rather than headline only
    - Request cap table and signed term sheet summary
  - - Competitive durability
    - Win-loss and pricing pressure versus Copilot, Cursor, and model bundles
    - Needed to know if premium pricing is durable
    - Request sales analytics and renewal notes
  - - Deployment depth
    - Share of named customers that are broad standards versus pilots
    - Needed to validate customer-proof value for valuation
    - Request product usage depth by account
  notes: Until these asks are answered, valuation should remain scenario-based rather than conviction underwriting.
