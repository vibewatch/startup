company:
  name: Augment
chapter:
  number: 1
  title: Company Overview
  summary: Augment is a Palo Alto-based private enterprise AI coding company founded in 2022 by Igor Ostrovsky and Guy Gur-Ari and led publicly by Scott Dietzen. Public evidence anchors the business at a disclosed $252 million raised and a $977 million post-money valuation from the April 2024 Series B, while the 2026 website shows a broader shift from an IDE helper toward Cosmos, an organizational agentic-SDLC platform. Customer proof is unusually strong for a young private company, but public visibility into revenue, board composition, current headcount, and whether later financing pushed the company definitively past unicorn valuation remains limited.
sections:
- id: identity-and-product
  title: Identity, Geography, and Product Scope
  body: 'Augment''s sourced public identity is clearer than some secondary summaries: the official April 2024 launch announcement and Tracxn profile both place the company in Palo Alto, California, and the privacy policy identifies the legal entity as Augment Computing, Inc. Founded in 2022 by Igor Ostrovsky and Guy Gur-Ari, Augment launched publicly as an AI coding-assistance startup but its 2026 website now leads with Cosmos, an agentic software-development platform aimed at organizational throughput rather than just individual autocomplete. That positioning matters because the product story is no longer only “better code suggestions”; it is coordinated agents, shared memory, workflow triggers, GitHub/Jira/Slack integration, and sandboxed execution across local, managed, and customer-controlled environments. In other words, the company is selling a platform layer for AI-native engineering organizations, not merely an IDE add-on.'
  claimRefs:
