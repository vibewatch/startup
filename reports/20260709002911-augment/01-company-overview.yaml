- id: enterprise-proof-and-open-gaps
  title: Enterprise Proof, Security Posture, and Open Gaps
  body: 'For a private company founded in 2022, Augment has an unusually dense public proof set. The customer hub names recognizable enterprise users across storage, payments, customer service, developer tooling, and healthcare-adjacent software. The cases emphasize concrete large-codebase and workflow evidence: Pure Storage on a 2.1 million line C++ estate, GoFundMe on multi-agent PR workflows, Intercom on hundreds of weekly PRs, WEX on accelerated refactors, and Rubrik on secure large-codebase adoption. Augment pairs that proof with an enterprise-security narrative that includes no-training claims, zero data retention, CMEK/BYOK-style controls, VPC and single-tenant deployment, SAML/OIDC/SCIM, RBAC, audit logs, and ISO 42001 plus SOC 2 messaging. Still, the chapter should not overstate what is known: public sources do not disclose revenue, margin, current customer count, current headcount, or board composition, and launch-thread commentary shows some investors and developers remain skeptical
    that category enthusiasm automatically translates into durable economics. That means later chapters must treat scale claims as evidence to be re-proven, not simply inherited from branding, customer logos, or private-market excitement.'
