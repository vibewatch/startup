- id: leadership-and-governance
  title: Leadership Bench and Governance Visibility
  body: 'The founding bench is technically credible and enterprise-oriented. Ostrovsky brings systems and infrastructure credentials from Pure Storage and Microsoft, while Gur-Ari contributes AI-research depth from Google. Public materials name Scott Dietzen as CEO and Dion Almaer as a senior product leader, and the launch materials emphasize a team recruited from Google, Meta, NVIDIA, Microsoft, Databricks, Snowflake, VMware, and Pure Storage. That talent profile matches the product pitch: deep systems engineering plus model/research experience. The missing piece is governance visibility. No fetched source names the board or clarifies observer rights, which means even the otherwise strong leadership story still depends on private diligence today clearly. Public sources do not disclose the board, voting control, or investor governance rights, so later diligence should treat leadership dependence and board composition as open questions rather than assumed strengths. The careers page does
    show the company still hiring across go-to-market and engineering functions, which supports a growth-stage rather than maintenance-stage operating posture.'
  claimRefs:
  - CO004
  - CO005
  - CO006
  - CO029
  tableRefs:
  - TO002
- id: capital-base-and-stage
  title: Capital Base, Investors, and Stage
  body: The best-corroborated funding picture is still the 2024 launch financing. Official company releases, BusinessWire, Voicebot, and TechCrunch all align on a $227 million Series B announced on 2024-04-24 at a $977 million post-money valuation, following a $25 million Series A led by Sutter Hill Ventures and bringing total disclosed funding to $252 million. The disclosed core investor set included Sutter Hill Ventures, Index Ventures, Innovation Endeavors, Lightspeed Venture Partners, and Meritech Capital; a later November 2024 PRNewswire release from Evolution Equity Partners confirms that Evolution also invested in the Series B round. Partner-owned portfolio pages from Lightspeed and Index still list Augment, which helps corroborate investor affiliation beyond launch-day PR. What remains unresolved is whether the later Series B extension actually repriced the company above $1 billion. Some secondary summaries round the company to “unicorn” status, but the fetched primary record still
    anchors on $977 million post-money.
  claimRefs:
