company:
  name: Augment
chapter:
  number: 7
  title: Risks
  summary: Augment's main public risks cluster around trust, execution, dependency, and valuation discipline rather than existential capital scarcity. The company has done more than most peers to publish security architecture and enterprise controls, but the most important proof points remain self-authored and the public file still lacks the renewal, concentration, margin, and incident history needed for high-conviction underwriting. Regulatory and legal uncertainty around AI claims, copyright, and buyer governance adds friction, while platform incumbents and model vendors increase price-compression and disintermediation risk.
sections:
- id: legal-regulatory-and-trust-boundary
  title: Legal, Regulatory, and Trust Boundary
  body: 'The legal and regulatory file is directionally serious but not fully de-risked. Augment has published the baseline materials sophisticated enterprise buyers expect, including a privacy policy, enterprise terms, a security page, and a detailed security-architecture write-up. That matters because code-handling trust is the first gate in this category. But the same evidence also exposes the core weakness of the public file: most of the critical trust claims are self-authored. Regulators are not waiting for the category to mature before acting. The FTC already treats AI marketing and competition as active policy areas, the European Commission has formalized obligations for covered general-purpose AI systems, and the Copyright Office is still working through training and output questions. Augment may not bear each of those burdens directly, yet enterprise customers will increasingly push those governance questions downstream into procurement, legal review, and renewal decisions. That creates friction even before any formal dispute appears in public.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR014
