evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board composition, board observers, and governance rights by investor cohort.
    whyItMatters: >-
      Board control and governance concentration affect underwriting, founder dependence, and refresh risk if the
      company raises again.
    diligencePath: Request board list, observer rights, and latest financing documents from the company or investors.
    relatedQuestionRefs:
      - QO016
  - type: private-evidence-only
    severity: material
    topic: revenue opacity
    missingEvidence: Current revenue, ARR, and margin disclosures.
    whyItMatters: Valuation cannot be underwritten cleanly without revenue quality and scale evidence.
    diligencePath: >-
      Ask management for current ARR, growth, gross margin, and expansion metrics with cohort or customer segmentation
      support.
    relatedQuestionRefs:
      - QO018
  - type: stale
    severity: material
    topic: headcount and customer count
    missingEvidence: Current employee count and active customer/account count with a date stamp.
    whyItMatters: Scale, hiring intensity, and support burden are central to enterprise-readiness claims.
    diligencePath: >-
      Request current headcount by function and customer/account counts by segment; reconcile against any directory data
      or case-study logos.
    relatedQuestionRefs:
      - QO019
      - QO025
  - type: conflicting-data
    severity: minor
    topic: valuation status
    missingEvidence: A direct post-November-2024 share price or board-approved valuation update.
    whyItMatters: >-
      Public summaries hint at an extension and some secondary write-ups round to unicorn status, but fetched primary
      evidence still anchors on $977 million post-money.
    diligencePath: >-
      Obtain the later financing term sheet or cap table update to confirm whether the company actually crossed $1
      billion post-money.
    relatedQuestionRefs:
      - QO005
      - QO025
  - type: conflicting-data
    severity: material
    topic: TAM/SAM precision
    missingEvidence: >-
      A single apples-to-apples public estimate for enterprise AI coding agents that isolates enterprise engineering
      teams from broader AI app-development or software-tool spending.
    whyItMatters: >-
      Valuation multiples and market-share assumptions become fragile when the numerator and denominator come from
      different market definitions.
    diligencePath: >-
      Ask management and investors for their internal TAM/SAM assumptions and reconcile them against a third-party
      category definition.
    relatedQuestionRefs:
      - QM004
      - QM024
  - type: private-evidence-only
    severity: material
    topic: buyer budgets
    missingEvidence: Actual budget ownership and ACV distribution by buyer segment, industry, and deployment model.
    whyItMatters: >-
      Knowing whether spend sits with CTO, platform engineering, security, or business units determines sales-cycle
      length and expansion potential.
    diligencePath: Request pipeline or customer segmentation by persona, ACV, and deployment type.
    relatedQuestionRefs:
      - QM008
      - QM024
  - type: conflicting-data
    severity: minor
    topic: ROI measurement
    missingEvidence: >-
      Independent audited ROI benchmarks separating individual productivity gains from team or organization-level
      throughput improvement.
    whyItMatters: >-
      Public sources mix self-reported case studies, surveys, and marketing estimates that are directionally helpful but
      not directly comparable.
    diligencePath: Request before/after DORA-style metrics from customers and compare them with pilot-control cohorts.
    relatedQuestionRefs:
      - QM020
      - QM023
  - type: missing-source
    severity: minor
    topic: SAM SOM geography
    missingEvidence: >-
      Region- and industry-specific SAM/SOM estimates for enterprise AI coding tools in North America and regulated
      verticals.
    whyItMatters: Augment sells to large enterprise teams, so generic global TAM is too broad for underwriting go-to-market realism.
    diligencePath: >-
      Build a bottom-up model from target enterprise seat counts, regulated-vertical adoption rates, and priced workload
      assumptions.
    relatedQuestionRefs:
      - QM004
      - QM024
  - type: missing-source
    severity: material
    topic: Head-to-head benchmarks
    missingEvidence: >-
      Independent enterprise benchmark data comparing Augment with Copilot, Cursor, Tabnine, Sourcegraph, Amazon Q, and
      Claude Code on large-repository tasks, setup burden, governance depth, and cost.
    whyItMatters: The public file is rich in feature pages and self-authored comparisons but weak in neutral measured comparisons.
    diligencePath: Request win/loss studies, pilot scorecards, and customer-side bakeoff documents.
    relatedQuestionRefs:
      - QP006
      - QP020
      - QP025
  - type: private-evidence-only
    severity: material
    topic: Win rates and displacement
    missingEvidence: Actual enterprise win/loss by competitor, deployment size, and buyer persona.
    whyItMatters: Distribution power and feature overlap only matter economically if they change close rates and expansion.
    diligencePath: Review CRM competitive-opportunity data and recent losses by named competitor.
    relatedQuestionRefs:
      - QP003
      - QP024
      - QP025
  - type: conflicting-data
    severity: minor
    topic: Pricing comparability
    missingEvidence: A normalized comparison of seat, credit, usage, and enterprise-bundle economics across rivals.
    whyItMatters: List prices are visible, but real enterprise cost depends on negotiated credits, consumption, and support.
    diligencePath: Model annualized cost for representative 100-seat and 1,000-seat deployments.
    relatedQuestionRefs:
      - QP007
      - QP019
  - type: private-evidence-only
    severity: material
    topic: Core software metrics
    missingEvidence: Current ARR, revenue growth, gross margin, NRR/GRR, churn, ACV, and customer concentration.
    whyItMatters: Without those metrics, the public funding story cannot be converted into an underwritten software-economics view.
    diligencePath: Request latest board metrics pack or audited management accounts.
    relatedQuestionRefs:
      - QI006
      - QI014
      - QI024
  - type: missing-source
    severity: material
    topic: Burn and runway
    missingEvidence: Cash on hand, monthly burn, runway, and exact size/terms of later financing events after the 2024 round.
    whyItMatters: Capital adequacy looks positive directionally, but exact dilution and runway remain opaque.
    diligencePath: Request cap table, cash balance, burn bridge, and financing documents.
    relatedQuestionRefs:
      - QI007
      - QI013
      - QI019
  - type: conflicting-data
    severity: minor
    topic: Valuation step-up quality
    missingEvidence: Clear primary-source confirmation of any later >$1B repricing versus secondary or investor-led descriptions.
    whyItMatters: A headline unicorn label is not the same as a fully evidenced price and round structure.
    diligencePath: Request signed term sheet or board-approved financing summary.
    relatedQuestionRefs:
      - QI020
  - type: missing-source
    severity: material
    topic: Independent technical benchmarks
    missingEvidence: >-
      Neutral benchmark data on Augment's retrieval quality, latency, multi-file edit accuracy, and total cost versus
      Copilot, Cursor, Sourcegraph, and Claude Code.
    whyItMatters: >-
      Most architecture specifics come from Augment itself, so buyers still need neutral proof that the technical edge
      is material.
    diligencePath: Request benchmark methodology, raw results, and customer bakeoff scorecards.
    relatedQuestionRefs:
      - QE014
      - QE024
  - type: private-evidence-only
    severity: material
    topic: Model-provider concentration
    missingEvidence: Actual share of workloads by underlying model family, switching economics, and provider fallback plans.
    whyItMatters: Prism improves flexibility but also reveals reliance on third-party models for core output quality.
    diligencePath: Request model mix, failover design, and margin sensitivity by provider.
    relatedQuestionRefs:
      - QE007
      - QE015
      - QE019
  - type: missing-source
    severity: minor
    topic: Operational reliability
    missingEvidence: Public incident history, uptime reporting, or postmortems covering agent workflows, indexing, and retrieval.
    whyItMatters: Production maturity claims are customer-backed, but service reliability evidence is still sparse.
    diligencePath: Request uptime SLOs, incident metrics, and support escalation examples.
    relatedQuestionRefs:
      - QE020
      - QE024
  - type: private-evidence-only
    severity: material
    topic: Retention and renewal
    missingEvidence: NRR, GRR, renewal rates, contract lengths, and cohort behavior by segment.
    whyItMatters: >-
      Named customer proof is helpful, but durability determines whether those references compound into lasting
