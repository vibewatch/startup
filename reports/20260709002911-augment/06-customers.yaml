schemaVersion: report-v2
artifact: customers
slug: augment
runDate: '2026-07-09'
company:
  name: Augment
chapter:
  number: 6
  title: Customers
  summary: 'Augment''s public customer file is stronger than most private AI tooling companies because it combines high-quality enterprise logos with several quantified or operationally specific case studies. The roster now spans software, infrastructure, payments, enterprise IT, and adjacent sectors, with especially strong proof from Pure Storage, GoFundMe, Intercom, Rubrik, and WEX. The weakest part of the record is not lack of customer proof but lack of durability metrics: no public retention, concentration, contract-length, or production-scope table exists, so the customer verdict is positive but still incomplete for underwriting.'
sections:
- id: customer-segmentation-and-fit
  title: Customer Segmentation and Fit
  body: The visible customer base suggests Augment is not a lightweight indie-developer tool. Public references point toward engineering organizations with real codebase complexity, brand weight, and meaningful software-delivery stakes. The roster spans cloud-native software, enterprise infrastructure, fintech and payments, developer platforms, and large enterprise IT. Webflow, MongoDB, DXC, MoneyGram, Tekion, Pure Storage, Intercom, Rubrik, GoFundMe, and WEX together suggest that Augment is finding fit where internal engineering coordination matters at least as much as raw code generation. That pattern is economically important because it supports a higher-value enterprise customer profile, but it also implies longer rollout cycles and more procurement friction than consumer-style developer tools face. It also means each reference can matter disproportionately in enterprise selling because buyers often want peers with similar engineering complexity. The public roster therefore says more about fit quality than about raw customer quantity today overall.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU012
  - CU013
  - CU017
  - CU026
  - CU034
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-customer-proof-and-deployment-depth
  title: Named Customer Proof and Deployment Depth
  body: The strongest part of Augment's customer evidence is the depth of several named stories. Pure Storage anchors the large-codebase thesis with a 2.1 million-line C++ environment and large-volume completions. GoFundMe adds workflow-speed evidence through cycle-time reduction. Intercom adds both quantified throughput and a comparison that implies simpler tools were not enough for its environment. Rubrik supports security-conscious enterprise transformation, and WEX shows broader refactor acceleration. Drata contributes rollout and governance evidence, which matters because scaling a coding assistant across an organization is not only a technical deployment question. These examples together make the public file stronger than a generic logo slide. They show production-like usage on real enterprise software problems, even if the exact contract sizes remain hidden. Importantly, the best stories span different jobs to be done rather than repeating one narrow ROI template. That variety reduces the risk that the proof set is only one unusually favorable use case.
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
  - CU014
  - CU025
  - CU033
  tableRefs:
  - TU002
  - TU003
  figureRefs:
  - FU002
  - FU003
- id: adoption-satisfaction-and-repeat-usage-proxies
  title: Adoption, Satisfaction, and Repeat-Usage Proxies
  body: Augment does not publish classic SaaS retention metrics, so public confidence has to come from adoption proxies. FeaturedCustomers helps here by showing a visible ecosystem of reviews, case studies, and videos, while the growing breadth of named customer pages suggests that reference generation continues beyond the original stealth-launch cohort. That said, the evidence is much stronger on proof depth than on denominators. We do not know how many customers are in production, how many teams are active, or how many logos have expanded beyond early use. The public proof therefore supports credibility and sales usefulness more than it supports investor-grade durability analysis. In other words, the customer story is good enough to show relevance, but not yet good enough to settle retention or standardization questions. That gap is especially important because later-stage investor outcomes depend more on repeatability than on showcase wins. Public proofs help selling, but they do not substitute for cohort data.
  claimRefs:
  - CU004
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU024
  - CU032
  - CU035
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: concentration-expansion-and-reference-quality-risks
  title: Expansion, Concentration, and Reference-Quality Risks
  body: The main customer risks are concentration opacity and uneven reference quality. Many of the strongest proofs are company-authored, and several logos outside the headline case studies are better treated as roster confirmation than as deep deployment evidence. Public sources also do not reveal whether the deepest logos represent small team pilots, broader rollout, or company-wide standards. Drata's rollout story implies that governance and internal enablement can slow expansion even when product value is real, while Hacker News skepticism is a reminder that category enthusiasm does not guarantee durable adoption. The most balanced reading is that Augment has earned serious customer credibility in complex engineering environments, but still needs private diligence to prove concentration safety, renewal durability, and how consistently local wins expand into organization-wide standardization. Without that data, even strong logos can overstate the breadth and durability of monetized deployment. That is the central reason customer proof should increase confidence, not end diligence alone.
  claimRefs:
  - CU015
  - CU016
  - CU023
  - CU027
  - CU028
  - CU029
  - CU030
  - CU031
  - CU036
  - CU037
