    - QU018
    - QU023
  - type: private-evidence-only
    severity: material
    topic: Concentration
    missingEvidence: Revenue share of top customers and production deployment scope by logo.
    whyItMatters: Marquee names can overstate diversification if revenue is concentrated or deployments remain narrow.
    diligencePath: Request top-10 customer revenue mix and deployment-stage mapping.
