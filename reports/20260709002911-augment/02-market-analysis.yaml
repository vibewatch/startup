  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: TAM/SAM precision
    missingEvidence: A single apples-to-apples public estimate for enterprise AI coding agents that isolates enterprise engineering teams from broader AI app-development or software-tool spending.
    whyItMatters: Valuation multiples and market-share assumptions become fragile when the numerator and denominator come from different market definitions.
    diligencePath: Ask management and investors for their internal TAM/SAM assumptions and reconcile them against a third-party category definition.
    relatedQuestionRefs:
    - QM004
    - QM024
  - type: private-evidence-only
    severity: material
    topic: buyer budgets
    missingEvidence: Actual budget ownership and ACV distribution by buyer segment, industry, and deployment model.
    whyItMatters: Knowing whether spend sits with CTO, platform engineering, security, or business units determines sales-cycle length and expansion potential.
    diligencePath: Request pipeline or customer segmentation by persona, ACV, and deployment type.
    relatedQuestionRefs:
    - QM008
    - QM024
  - type: conflicting-data
    severity: minor
    topic: ROI measurement
    missingEvidence: Independent audited ROI benchmarks separating individual productivity gains from team or organization-level throughput improvement.
    whyItMatters: Public sources mix self-reported case studies, surveys, and marketing estimates that are directionally helpful but not directly comparable.
    diligencePath: Request before/after DORA-style metrics from customers and compare them with pilot-control cohorts.
    relatedQuestionRefs:
    - QM020
    - QM023
  - type: missing-source
    severity: minor
    topic: SAM SOM geography
    missingEvidence: Region- and industry-specific SAM/SOM estimates for enterprise AI coding tools in North America and regulated verticals.
    whyItMatters: Augment sells to large enterprise teams, so generic global TAM is too broad for underwriting go-to-market realism.
    diligencePath: Build a bottom-up model from target enterprise seat counts, regulated-vertical adoption rates, and priced workload assumptions.
    relatedQuestionRefs:
    - QM004
    - QM024
