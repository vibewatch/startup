    - CTO / VP Eng / platform engineering
    - Core category from Gartner's 2026 framing
  - - AI code assistants / code tools
    - Autocomplete, chat, refactoring, debugging, repository-aware suggestions
    - Broader workflow systems with no coding surface
    - Engineering tools budget owners
    - Direct but somewhat narrower proxy for current market size
  - - AI application development platforms
    - Broader AI app-building and orchestration software
    - Infrastructure, services, and non-dev AI apps
    - Enterprise software buyers
    - Useful outer-envelope lens, but broader than Augment
  - - AI software spend
    - All AI software applications
    - Infrastructure, services, and hardware still separate
    - CIO / enterprise IT budgets
    - Too broad for direct underwriting, but shows top-down demand backdrop
  - - Status-quo substitute stack
    - Manual coding, internal scripts, repo-native controls, traditional review/testing
    - Paid external AI platforms
    - Existing engineering teams
    - Explains why displacement is gradual rather than binary
  notes: The key discipline is to avoid mixing broad AI software envelopes with narrower AI coding-tool categories without saying so explicitly.
