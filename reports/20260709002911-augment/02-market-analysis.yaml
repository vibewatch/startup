  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Codebase complexity and migration pain
    - Positive
    - Current
    - Supports deep-context and multi-file automation vendors
    - Ask for customer mix by repo size and modernization use case
  - - Desire to automate review, testing, and security
    - Positive
    - Current
    - Pushes category beyond autocomplete into SDLC platforms
    - Ask what share of workload already occurs outside the IDE
  - - Accuracy distrust
    - Negative
    - Current
    - Raises verification cost and slows autonomous adoption
    - Measure rework rates versus baseline coding workflows
  - - Security / privacy concerns
    - Negative
    - Current
    - Makes deployment, auditability, and governance primary purchase criteria
    - Ask for win/loss data in regulated industries
  - - Pricing complexity and credit models
    - Negative
    - Current
    - Can create budget uncertainty and procurement friction
    - Request average customer spend pattern by seat plus usage
  - - Provider lock-in / portability risk
    - Negative
    - Medium-term
    - Pushes buyers toward model-agnostic architectures or cautious pilots
    - Ask how customers hedge model-provider concentration
  notes: Rows mix drivers and constraints because the market is expanding even while buyer caution increases.
