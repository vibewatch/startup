      tone: neutral
    - label: '2026 AI application development platforms: $8.416B'
      detail: Adjacent platform category from Gartner.
      tone: neutral
    - label: '2025-2026 direct AI coding tools/assistants: roughly $7.9B-$10.1B'
      detail: Direct category estimates from Precedence and MarketsandMarkets.
      tone: positive
    - label: 'Augment-specific SAM/SOM: not publicly disclosed'
      detail: Public sources do not isolate target-seat counts or conversion assumptions.
      tone: warning
  approximationNotes: This pyramid mixes nested market lenses intentionally; each layer uses a different but explicitly labeled category definition.
