  evidenceGaps:
  - type: missing-source
    severity: material
    topic: Independent technical benchmarks
    missingEvidence: Neutral benchmark data on Augment's retrieval quality, latency, multi-file edit accuracy, and total cost versus Copilot, Cursor, Sourcegraph, and Claude Code.
    whyItMatters: Most architecture specifics come from Augment itself, so buyers still need neutral proof that the technical edge is material.
    diligencePath: Request benchmark methodology, raw results, and customer bakeoff scorecards.
    relatedQuestionRefs:
    - QE014
    - QE024
  - type: private-evidence-only
    severity: material
    topic: Model-provider concentration
    missingEvidence: Actual share of workloads by underlying model family, switching economics, and provider fallback plans.
    whyItMatters: Prism improves flexibility but also reveals reliance on third-party models for core output quality.
    diligencePath: Request model mix, failover design, and margin sensitivity by provider.
    relatedQuestionRefs:
    - QE007
    - QE015
    - QE019
  - type: missing-source
    severity: minor
    topic: Operational reliability
    missingEvidence: Public incident history, uptime reporting, or postmortems covering agent workflows, indexing, and retrieval.
    whyItMatters: Production maturity claims are customer-backed, but service reliability evidence is still sparse.
    diligencePath: Request uptime SLOs, incident metrics, and support escalation examples.
    relatedQuestionRefs:
    - QE020
    - QE024
