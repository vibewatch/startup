chapter:
  number: 5
  title: Product & Technology
  summary: Augment's product has evolved from an IDE coding assistant into a broader workflow and context platform for enterprise engineering teams. The strongest public technical evidence centers on the context engine, large-codebase retrieval, Next Edit, Prism model routing, and newer cloud-run Remote Agent capabilities, while security materials provide unusually detailed architecture notes on proof-of-possession and internal access control. The main diligence caveat is that architecture depth is well documented but still mostly self-authored, so independent technical benchmark evidence remains thinner than customer-outcome evidence.
sections:
- id: platform-definition-and-module-map
  title: Platform Definition and Module Map
  body: Augment is no longer best understood as a single autocomplete feature. Its public materials now describe a platform spanning shared codebase context, IDE assistance, next-edit suggestions, chat, remote agents, review workflows, and organization-level rollout patterns under the Cosmos and agentic-SDLC framing. That breadth matters because it changes the underwriting question from “Is the model good at completion?” to “Can the company coordinate more of the software-delivery workflow than point assistants can?” The module map visible in public sources is coherent enough to take seriously. Context Engine anchors the system, Next Edit extends support across the workspace, Prism manages cost and model selection, Remote Agent pushes execution into the cloud, and customer rollout materials show the product being operationalized at team level rather than only at individual-dev level. It is increasingly a platform story, not a plugin story.
  claimRefs:
  - CE001
  - CE002
  - CE020
  - CE034
  - CE037
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE001
- id: architecture-and-operating-model
  title: Architecture and Operating Model
  body: 'The technical heart of Augment is context retrieval at enterprise codebase scale. The public architecture story says embeddings are generated across user codebases and retrieved at task time to support chat, completion, and larger editing workflows. The repo-scale engineering post provides unusually specific performance claims: 100M-plus line support, an 8x memory reduction through quantized vector search, latency improvement from seconds to sub-200ms, and automatic fallbacks for rare edge cases. Next Edit then builds on that substrate with a trained retriever and compact diff-decoding approach so the system can reason across many files without turning interactive use into a slow batch job. Prism layers on another operating concern—cost and model selection—by routing turns among underlying models while minimizing prompt-cache loss. The result is a system architecture that looks thoughtfully engineered for large, live codebases, but also one that clearly depends on a mix of Augment-owned
    retrieval infrastructure and third-party inference providers.'
  claimRefs:
