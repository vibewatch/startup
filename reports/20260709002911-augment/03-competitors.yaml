  evidenceGaps:
  - type: missing-source
    severity: material
    topic: Head-to-head benchmarks
    missingEvidence: Independent enterprise benchmark data comparing Augment with Copilot, Cursor, Tabnine, Sourcegraph, Amazon Q, and Claude Code on large-repository tasks, setup burden, governance depth, and cost.
    whyItMatters: The public file is rich in feature pages and self-authored comparisons but weak in neutral measured comparisons.
    diligencePath: Request win/loss studies, pilot scorecards, and customer-side bakeoff documents.
    relatedQuestionRefs:
    - QP006
    - QP020
    - QP025
  - type: private-evidence-only
    severity: material
    topic: Win rates and displacement
    missingEvidence: Actual enterprise win/loss by competitor, deployment size, and buyer persona.
    whyItMatters: Distribution power and feature overlap only matter economically if they change close rates and expansion.
    diligencePath: Review CRM competitive-opportunity data and recent losses by named competitor.
    relatedQuestionRefs:
    - QP003
    - QP024
    - QP025
  - type: conflicting-data
    severity: minor
    topic: Pricing comparability
    missingEvidence: A normalized comparison of seat, credit, usage, and enterprise-bundle economics across rivals.
    whyItMatters: List prices are visible, but real enterprise cost depends on negotiated credits, consumption, and support.
    diligencePath: Model annualized cost for representative 100-seat and 1,000-seat deployments.
    relatedQuestionRefs:
    - QP007
    - QP019
