company:
  name: Augment
chapter:
  number: 3
  title: Competitors
  summary: Augment competes in a crowded but not fully commoditized market. The strongest substitutes are incumbent coding platforms such as GitHub Copilot, startup-native AI IDEs such as Cursor, deployment-first enterprise tools such as Tabnine and Sourcegraph, cloud-adjacent offers such as Amazon Q, and frontier-model products such as Claude Code. Augment's clearest wedge is shared repository-scale context plus enterprise governance, but incumbent distribution and rapidly improving bundled alternatives make the moat conditional rather than absolute.
sections:
- id: competitive-landscape-and-solution-classes
  title: Competitive Landscape and Solution Classes
  body: 'The buyer evaluating Augment is rarely choosing between only two startups. The realistic landscape breaks into several solution classes. First are direct enterprise coding-assistant platforms such as GitHub Copilot, Cursor, Tabnine, Sourcegraph Cody, and Codeium, all of which promise some mix of code completion, chat, refactoring, and codebase assistance. Second are platform-bundled entrants such as Amazon Q, GitLab, and JetBrains AI that can piggyback on pre-existing cloud, DevSecOps, or IDE relationships. Third are frontier-model products such as Claude Code that compress the stack by shipping coding workflows directly from the model provider. Finally there is the status quo: internal tooling, manual review, and partial use of repo-native or IDE-native functions. Gartner''s 2026 market-realignment framing and DORA''s systems view both support this broader reading. It means Augment is competing for a workflow and governance layer, not just for one autocomplete seat.'
  claimRefs:
  - CP001
  - CP010
  - CP012
  - CP023
  - CP024
  - CP025
  - CP034
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: direct-vendor-profiles-and-buyer-tradeoffs
  title: Direct Vendor Profiles and Buyer Tradeoffs
  body: 'The closest product overlap is with vendors that combine deep code assistance with enterprise packaging. GitHub Copilot is the default incumbent because of brand, Microsoft reach, and a broad plan ladder. Cursor is probably the sharpest startup-to-startup comparison because it sells AI-first development workflows with relatively simple team pricing. Tabnine and Sourcegraph matter when private deployment, self-hosting, or search-led repository context become primary buying criteria. Amazon Q and GitLab matter when procurement can ride a broader platform relationship rather than a new standalone contract. Anthropic and JetBrains matter for a different reason: they suggest that application-layer competition can come from adjacent control points rather than only from code-assistant startups. The buyer tradeoff is therefore multi-dimensional. Some buyers want the cheapest path to widespread adoption, some want the strongest governance surface, some want the deepest repo understanding,
    and some simply want to buy from an incumbent already inside the stack at scale.'
  claimRefs:
