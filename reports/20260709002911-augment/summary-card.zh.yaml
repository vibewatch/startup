  topStrengths:
    - 来自 Pure Storage、Intercom、WEX 和 Rubrik 等复杂工程环境的真实企业客户验证。
    - 产品叙事已经越过 autocomplete，延伸到 repo 级上下文、受治理的工作流支持和远程 agent 执行。
    - 2024 年大额融资和强投资人名单降低了近期资本稀缺风险。
    - 即使竞争加剧，企业级编程 agent 品类顺风仍然明显。
  topRisks:
    - 公开经济性仍很薄：没有披露 ARR、毛利率、NRR、烧钱速度或客户集中度细节。
    - 平台触及敏感自有代码，并且越来越多地自动化真实工作，因此信任、安全和法律尽调仍是核心。
    - 面对既有厂商、捆绑模型提供商和行动更快的 AI 编程竞争者，定价和护城河可能被压缩。
    - 高质量客户 logo 仍可能夸大部署深度、续约耐久度或扩张广度。
    - 若入场价格明显高于公开 2024 年锚点，没有私有证据很难辩护。
  unresolvedGaps:
    - 当前 ARR、增长、毛利率、NRR、烧钱速度和现金跑道。
    - 客户集中度、续约行为，以及具名账户内部部署广度。
    - 2024 年后任何融资或估值上调的精确条款和规模。
    - 相比 Copilot、Cursor、Anthropic 和其他对手的胜负数据与实际成交价格。
    - 超出公司自有材料的独立安全 / 可靠性证明。
