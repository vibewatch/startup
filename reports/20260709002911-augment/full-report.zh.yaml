  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与解决方案类别
        blocks:
          - type: paragraph
            body: >-
              评估 Augment 的买方，很少只在两家创业公司之间二选一。真实格局可以拆成几类解决方案。 第一类是直接的企业级编程助手平台，如 GitHub
              Copilot、Cursor、Tabnine、Sourcegraph Cody 和 Codeium；它们都承诺某种组合的代码补全、聊天、重构和代码库辅助。第二类是平台捆绑型进入者， 如 Amazon
              Q、GitLab 和 JetBrains AI，可以借助既有云、DevSecOps 或 IDE 关系进入。第三类是 Claude Code
              这样的前沿模型产品，由模型提供商直接交付编程工作流，从而压缩技术栈。最后是现状： 内部工具、人工审查，以及部分使用仓库原生或 IDE 原生功能。Gartner 的 2026 年市场重组框架和 DORA
              的系统视角都支持这种更宽的读法。也就是说，Augment 争的是工作流和治理层，而不只是一个自动补全席位。
