  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模口径
        blocks:
          - type: paragraph
            body: >-
              第一项分析工作，是界定 Augment 的真实市场边界。Gartner 的 2026 年框架说得很清楚： 企业级 AI 编程智能体已不再只是自动补全助手；这个品类正在扩展到 SDLC 中的规划、代码生成、
              审查、工作流编排和自动验证。因此，Augment 竞争的市场比广义 AI 软件支出窄， 却比简单代码补全插件宽。公开规模口径也不是单一数字，而是分层的。Gartner 给出 2026 年 AI 软件支出
              $453.2 billion，以及 AI 应用开发平台 $8.416 billion；直接品类发布方则估计 2025 年 AI 代码助手或代码工具约 $7.9-$8.1
              billion。这些数字方向上有用，但不能互换。最宽的数字会夸大 Augment 的现实机会； 最窄的数字又可能低估智能体平台想捕获的编排和工作流支出。
            claimRefs:
