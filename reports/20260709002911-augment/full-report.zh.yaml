      - number: '2.2'
        title: 采用信号与行业分布
        blocks:
          - type: paragraph
            body: >-
              采用是真实的，但成熟度不均。Stack Overflow 2025 年调查显示，AI 工具已经进入许多开发者的日常工作流，
              但智能体系统本身还没有。使用率上升，情绪却走弱；对准确性的怀疑仍高于信任。这个模式很重要： 市场正在从好奇转向有纪律的评估——企业想要收益，也要证明系统安全、可靠、可治理。调查和市场报告数据还显示，
              受监管或高复杂度行业并没有袖手旁观。Precedence 将 BFSI 列为 2025 年最大垂直领域、医疗列为增速最快的垂直领域； GitLab 的 2026 DevSecOps 调查则把 AI
              描述为会重塑数千名从业者的软件交付角色和工作流的力量。 最终图景是：需求强，但采用并不自动等于持久部署。这个细微差别对 Augment 很关键，因为一个品类在调查使用中可以看似主流，
              同时在企业标准化、预算集中和治理成熟度上仍处早期。
            claimRefs:
