        title: 领导团队与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始团队技术可信，也偏企业市场。Ostrovsky 带来 Pure Storage 和 Microsoft 的系统与基础设施履历， Gur-Ari 则有 Google 的 AI 研究深度。公开材料列 Scott
              Dietzen 为 CEO、Dion Almaer 为高级产品负责人； 发布材料还强调团队来自 Google、Meta、NVIDIA、Microsoft、Databricks、Snowflake、VMware 和
              Pure Storage。这类人才画像与产品叙事匹配：深系统工程能力叠加模型 / 研究经验。缺口在治理可见度。
              已获取来源没有披露董事会，也没有说明观察员权利；因此，即便领导力故事整体很强，今天仍要靠私下尽调确认。 公开来源未披露董事会、投票控制或投资人治理权利，后续尽调应把创始人依赖和董事会构成当作开放问题，
              而不是默认优势。招聘页显示公司仍在 GTM 和工程岗位扩张，这支持它处在成长阶段，而非维护阶段。
