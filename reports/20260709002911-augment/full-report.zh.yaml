      - number: '2.3'
        title: 买方、用户、付款方与评估维度
        blocks:
          - type: paragraph
            body: >-
              买方地图更像企业平台，而不是个人开发者工具。GitHub、Cursor、Tabnine、AWS、Anthropic 和 Sourcegraph
              的公开定价与控制界面显示，供应商越来越把治理、部署和计费模型与原始模型访问一起销售。 席位定价、计量额度、按 LOC 收费的改造、单租户或自托管部署、SAML/SCIM 和访问控制，
              都指向一个坐在个人开发者之上的付款方。现实中，经济买家往往是 CTO、工程 VP、平台工程负责人， 以及安全或采购利益相关方；工程师、代码审查者和相邻技术运营人员则是日常用户。Augment
              自身的市场叙事也强化这一点： 问题不是打字更快，而是在企业约束下让组织级软件开发工作流用上 AI。因此，上下文宽度、审查质量、 部署模型和商业清晰度，如今和模型质量本身一样重要。
