            body: >-
              Augment 的技术核心，是企业代码库规模的上下文检索。公开架构故事称，系统会在用户代码库上生成嵌入向量， 并在任务时检索，用于支持聊天、补全和更大的编辑工作流。仓库级工程文章给出少见的具体性能主张： 支持
              100M-plus 行代码，靠量化向量搜索把内存降低 8x，延迟从数秒改善到 sub-200ms， 并为罕见边界情况提供自动回退。Next Edit 随后在这个底座上，用训练过的检索器和紧凑 diff 解码方法，
              让系统能跨许多文件推理，而不把交互式使用变成缓慢批处理。Prism 再叠一层运营问题——成本和模型选择——
              在底层模型之间路由交互轮次，同时尽量减少提示缓存损失。结果是一套看起来为大型、实时代码库认真工程化的系统架构； 但它也明显依赖 Augment 自有检索基础设施和第三方推理提供商的组合。
