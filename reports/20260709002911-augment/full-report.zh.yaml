  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、监管与信任边界
        blocks:
          - type: paragraph
            body: >-
              法律和监管材料方向上严肃，但还没有完全去风险。Augment 发布了成熟企业买方会期待的基础材料， 包括隐私政策、企业条款、安全页和详细安全架构文章。这很重要，因为代码处理信任是这个品类的第一道门槛。
              但同一组证据也暴露了公开材料的核心弱点：多数关键信任主张由公司自写。监管者不会等品类成熟才行动。 FTC 已经把 AI 营销和竞争视为活跃政策领域，European Commission 已经为覆盖范围内的通用
              AI 系统正式规定义务， Copyright Office 仍在处理训练和输出问题。Augment 未必直接承担每一项负担，但企业客户会越来越把这些治理问题向下传导到采购、
              法务审查和续约决定中。即使没有正式争议公开出现，摩擦也已经形成。
