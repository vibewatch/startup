            body: >-
              产品重叠最接近的，是把深度代码辅助和企业级包装结合起来的供应商。GitHub Copilot 是默认在位者， 因为它有品牌、Microsoft 覆盖和宽计划梯队。Cursor
              可能是最锋利的创业公司对创业公司比较对象， 因为它销售 AI 优先开发工作流，团队定价也相对简单。当私有部署、自托管或以搜索驱动的仓库上下文成为主要购买标准时， Tabnine 和 Sourcegraph
              就重要。采购可以搭乘更宽平台关系、而不是签一份新的独立合同时，Amazon Q 和 GitLab 就重要。Anthropic 和 JetBrains 重要的原因不同：它们说明，应用层竞争可以来自相邻控制点，
              而不只来自代码助手创业公司。因此，买方取舍是多维的。有些买方想要最便宜的广泛采用路径， 有些想要最强的治理界面，有些想要最深的代码仓库理解，还有些只是想从已经大规模嵌入技术栈的在位厂商采购。
