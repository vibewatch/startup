      - number: '8.4'
        title: 尽调问题与论点破裂点
        blocks:
          - type: paragraph
            body: >-
              剩余估值工作在概念上并不复杂，只是单靠公开来源做不到。投资人需要当前 ARR、毛利率、NRR、客户集中度、后续轮次条款，以及客户价值有多少正转化为可持续的付费扩张，而不只是叙事。还要弄清公司的 AI
              特有成本结构是否仍像高溢价软件那样运转。HashiCorp 等战略退出可比案例说明，优质企业工作流资产能吸引可观 M&A 估值，但退出可选性只是底线保护，不是高价买入的理由。真正会打破投资论点的是续约疲弱、最佳
              logo
              背后部署很浅、面对捆绑对手出现明显价格压缩，或利润率撑不起高溢价软件倍数。尽调补齐这些缺口之前，估值应保持情景化、中等置信度。这足以支撑认真关注，但还不是最终确信。纪律严明的投资人应先拿到经济性证据，再为今天的可能性买单。
