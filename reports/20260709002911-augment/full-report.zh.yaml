companyProfile:
  summary: >-
    Augment 成立于 2022 年，是一家私营企业级 AI 编程公司，面向需要仓库级上下文、 可治理的工作流自动化，以及比轻量个人开发者工具更强安全 / 隐私控制的大型工程团队。 公开证据支持它确实有企业级产品、具名客户证据和
    2024 年大额融资，但 ARR、毛利率、 留存、集中度和后续轮次经济条款这些私营公司核心问题仍未解决。
