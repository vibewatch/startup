  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与适配度
        blocks:
          - type: paragraph
            body: >-
              可见客户基础显示，Augment 不是轻量独立开发者工具。公开引用指向的，是代码库复杂度真实、 品牌分量高、软件交付利害关系明显的工程组织。客户名单横跨云原生软件、企业基础设施、
              金融科技与支付、开发者平台和大型企业 IT。Webflow、MongoDB、DXC、MoneyGram、Tekion、Pure Storage、 Intercom、Rubrik、GoFundMe 和 WEX
              放在一起，说明 Augment 在内部工程协同至少和原始代码生成同样重要的地方找到适配。 这个模式在经济上重要，因为它支持更高价值的企业客户画像；但它也意味着上线周期更长，采购摩擦比消费者式开发者工具更大。
              它还意味着每个客户背书在企业销售中可能有不成比例的作用，因为买方常常想看到工程复杂度相似的同业。 因此，公开名单今天更能说明适配质量，而不是原始客户数量。
