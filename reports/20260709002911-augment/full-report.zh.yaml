  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与定价信号
        blocks:
          - type: paragraph
            body: >-
              公开定价证据显示，Augment 更像靠企业软件销售来变现，而不是大众自助式开发者工具。 它的定价界面由销售主导，远不如 Copilot、Cursor、Tabnine 或 Claude 订阅的标价梯队清楚。
              这不自动意味着变现更弱；事实上，在企业软件里往往相反。但它确实意味着外部人很难从公开材料推断 ACV、 席位与用量组合，或合同期限。最合理的读法是，Augment
              销售与企业安全、上下文和工作流深度绑定的谈判合同， 然后在客户从本地编程帮助走向更广代码审查和智能体工作流时，在账户内扩张。这个框架在经济上说得通，
              但仍给实际价格和折扣留下很大不确定性。它也暗示，支持、上线设计和高管赞助很可能从第一天起就是全球商业包的一部分。
