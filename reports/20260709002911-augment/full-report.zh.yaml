              也不知道有多少客户标识已经超出早期使用。公开证据因此更支持可信度和销售有用性，而不是投资级耐久性分析。 换句话说，客户故事足以显示产品切中需求，但还不足以解决留存或标准化问题。这个缺口尤其重要，
              因为后期投资者回报更取决于可重复性，而不是样板客户胜利。公开证明能帮销售，但不能替代同期客户群数据。
