      - number: '3.3'
        title: 切换成本、分发权力与多栖使用
        blocks:
          - type: paragraph
            body: >-
              这个市场的竞争耐久性，与其说取决于原始功能对等，不如说取决于谁控制分发、谁能成为默认组织标准。 GitHub、AWS、JetBrains、GitLab 和 Anthropic
              一开始就有独立创业公司没有的分发杠杆。 这很关键，因为企业买方通常偏好更少供应商、更简单采购和更紧密的身份集成。与此同时， 这里的切换成本又比数据平台品类更软。多数工具集成在
              IDE、仓库或工作流层，而不是要求硬性数据迁移； 因此，多栖使用仍然可行，买方也能并行试点。调查证据还显示，只要信任没有稳定，开发者会继续测试工具。 这给 Augment
              同时带来风险和机会：如果它在大型代码仓库上下文和治理上证明明显更好，就能赢； 但它不能像深度嵌入的系统级记录供应商那样，假设今天就有席位级粘性。
