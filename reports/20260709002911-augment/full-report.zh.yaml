        title: 身份、地域与产品范围
        blocks:
          - type: paragraph
            body: >-
              Augment 的公开身份比一些二级摘要更清楚：官方 2024 年 4 月发布公告和 Tracxn 画像都把公司放在 加利福尼亚州 Palo Alto，隐私政策则把法律实体列为 Augment
              Computing, Inc.。公司由 Igor Ostrovsky 和 Guy Gur-Ari 于 2022 年创立，公开发布时是一家 AI 编程辅助创业公司；但到 2026 年，官网主推
              Cosmos，一个面向组织吞吐量、而非只面向个人自动补全的智能体式软件开发平台。这个定位很关键： 产品故事已不再只是“更好的代码建议”，而是协同智能体、共享记忆、工作流触发器、GitHub / Jira /
              Slack 集成，以及横跨本地、托管和客户自控环境的沙箱执行。换句话说，公司卖的是 AI 原生 工程组织的平台层，而不只是 IDE 插件。
