  - id: TV002
    title: 投资逻辑 / 反论点表
    columns:
      - 视角
      - 多头论点
      - 反论点
      - 改变观点的证据
    rows:
      - - 品类
        - 企业级编码 agent 成为高溢价 AI 软件品类
        - 品类热度退去，回到普通软件倍数约束
        - 私下 ARR 增长和留存数据
      - - 产品护城河
        - 仓库级上下文和受治理工作流深度支撑稀缺性溢价
        - 模型层捆绑和既有巨头压缩差异化
        - 赢单 / 输单数据和产品附着率
      - - 客户证据
        - 具名客户支撑强付费意愿
        - 标杆背书可能掩盖部署浅或集中度高
        - 背调访谈和部署深度指标
      - - 估值质量
        - 2024 年准独角兽估值偏早，但不算鲁莽
        - 后续轮条款不透明，可能意味着经济性弱于头条叙事
        - 股权结构表和后续轮 term sheet
      - - 可比公司组
        - 火热的私有编码工具可比交易仍保留上行空间
        - 公开软件可比公司施加更严格约束
        - 实际利润率和 NRR 相对可比区间
    notes: 反论点针对的是倍数压缩和证据质量，不必然意味着业务会失败。
    claimRefs:
      - CV003
      - CV005
      - CV017
      - CV018
      - CV025
      - CV026
      - CV030
      - CV031
      - CV037
      - CV038
  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 隐含叙事
      - 指示性倍数
      - 支撑 $977M EV 所需 ARR（USD M）
      - 解读
    rows:
      - - 牛
        - 具备强企业留存的高溢价 AI 编码领导者
        - 20.0x
        - '48.9'
        - 如果 Augment 属于最热门的高溢价 AI 软件公司，只需要不高的 ARR
      - - 基准+
        - 具备真实 AI 溢价的高质量企业软件
        - 10.0x
        - '97.7'
        - 只有 ARR 和 NRR 已经强劲才说得通
      - - 基准
        - 扎实软件，但只有部分稀缺性溢价
        - 8.0x
        - '122.1'
        - 需要更大规模，超出公开材料能证明的范围
      - - 熊
        - 压缩后的普通软件倍数
        - 6.0x
        - '162.8'
        - 除非收入远高于可见代理指标所暗示的水平，否则当前估值很难自圆其说
      - - 下行战略退出
        - 低于高溢价增长区间的战略退出
        - 4.0x
        - '244.3'
        - 仅靠退出可选性，无法证明今天支付溢价合理
    notes: ARR 门槛只是用 $977M 企业价值除以各档倍数反推的简单算术；它们展示敏感性，不是公司披露的指标。
    claimRefs:
      - CV001
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
      - CV037
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标 / 状态
      - 重要性
      - 可借鉴点
      - 局限
    rows:
      - - Cursor / Anysphere
        - 2025-2026 年私募超大轮融资和收购报道
        - 爆发式 AI 编程工具在私募市场的上沿可比对象
        - 证明规模跑通后，该品类能给到多高定价
        - 热度和规模都太高，不能直接映射到 Augment
      - - Replit / Codeium
        - 官方或广泛报道的私募融资基准
        - 开发者工作流平台的中段编程工具可比对象
        - 说明该品类不会把每个工具都按 Cursor 定价
        - 客户结构和产品定位不同
      - - Sourcegraph
        - 官方 Series D 轮加画像背景
        - 企业代码智能和工作流邻近可比对象
        - 更贴近 Augment 的上下文 / 工作流叙事
        - 融资轮次较早，收入可见度不完整
      - - Datadog / GitLab / MongoDB / Atlassian
        - 经审计的上市公司文件
        - 高溢价软件倍数的公开市场约束基准
        - 划出后期投资者最终必须满足的指标线
        - 没有一一对应的 AI 编程智能体类比
      - - HashiCorp 战略并购
        - IBM 以 $6.4B 收购
        - 企业基础设施软件的战略退出基准
        - 可作为下行或退出情境参考
        - 不是 AI 编程助手公司
    notes: 这组可比对象故意混合热门私募 AI 编程公司、企业代码 / 工作流参照和经审计的上市软件公司，因为没有一个干净的 Augment 对标。
    enumerationScope:
      coverage: sample
      basis: >-
        Rows capture the main comp clusters useful for valuing Augment rather than an exhaustive sheet of every software
        or AI developer-tools transaction.
    claimRefs:
      - CV010
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV024
      - CV025
      - CV026
  - id: TV005
    title: 推翻投资论点与一票否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - ARR 显著低于溢价门槛
        - 当前 ARR 即便约 10x 倍数也难支撑
        - 近独角兽价格已显充分，甚至偏贵
        - 转为放弃，或大幅重新议价
      - - NRR 偏弱 / 扩张浅
        - 具名客户停留在试点深度，未能铺开
        - 客户证据对估值的支撑失效
        - 降为仅跟踪
      - - 面对套件，价格被压缩
        - 赢单必须按商品化席位价格
        - 稀缺溢价消失
        - 按更低倍数区间重算
      - - 毛利率 / 烧钱过度受 AI 成本拖累
        - 经济模型达不到高溢价软件预期
        - 公开市场可比框架不再适用
        - 拒绝溢价入场
      - - 后续轮条款保护性强或质量偏弱
        - 账面估值夸大实际经济性
        - 股权结构质量弱于叙事
        - 降低信心或放弃
    notes: 这些变量最可能把 Augment 从仍有可能推向价格过高。
    claimRefs:
      - CV004
      - CV005
      - CV029
      - CV031
      - CV035
      - CV036
      - CV037
      - CV040
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR 与增长
        - 当前 ARR、增长率和未来销售管线
        - 用来把 Augment 放到真实倍数区间
        - 索取董事会材料或最新管理账
      - - 毛利率与 COGS
        - GAAP 毛利率加推理 / 基础设施负担
        - 用来检验高溢价软件经济性
        - 索取财务包和供应商成本桥
      - - 留存与集中度
        - NRR、logo 留存、头部客户集中度
        - 用来判断 logo 能否转成持久价值
        - 索取分群分析和头部客户清单
      - - 后续轮条款
        - 2024 年后融资的确切规模、价格、优先权和老股转让占比
        - 用来评估估值质量，而不只看标题数字
        - 索取股权结构表和已签署投资条款清单摘要
      - - 竞争耐久性
        - 面对 Copilot、Cursor 和模型套件的赢亏单与价格压力
        - 用来判断溢价定价能否守住
        - 索取销售分析和续约记录
      - - 部署深度
        - 具名客户中，成为广泛标准而非试点的占比
        - 用来验证客户背书对估值的价值
        - 按账户索取产品使用深度
    notes: 这些问题回答前，估值应保持情景化，而不是高确信度投资测算。
    claimRefs:
      - CV004
      - CV005
      - CV038
      - CV039
      - CV040
