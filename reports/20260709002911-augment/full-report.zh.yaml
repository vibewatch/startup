      - number: '1.4'
        title: 企业级证据、安全姿态与未解缺口
        blocks:
          - type: paragraph
            body: >-
              作为一家 2022 年成立的私营公司，Augment 的公开证据密度少见。客户中心列出存储、支付、 客服、开发者工具和医疗健康周边软件等领域的知名企业用户。案例强调具体的大代码库和工作流证据： Pure
              Storage 的 2.1 million 行 C++ 代码资产，GoFundMe 的多智能体 PR 工作流， Intercom 的每周数百个 PR，WEX 的重构加速，以及 Rubrik 的安全大型代码库采用。
              Augment 还把这些证据和企业安全叙事绑定在一起，包括不用客户代码训练、零数据留存、 CMEK/BYOK 式控制、VPC 与单租户部署、SAML/OIDC/SCIM、RBAC、审计日志，以及 ISO
              42001 和 SOC 2 信息。不过，本章不应夸大已知事实：公开来源没有披露收入、毛利、当前客户数、当前员工数或董事会构成；
              发布帖评论也显示，一些投资人和开发者仍怀疑品类热度能否自动转成持久经济性。也就是说，后续章节必须把规模说法当作 需要重新验证的证据，而不能直接继承品牌、客户标识或私募市场兴奋感。
