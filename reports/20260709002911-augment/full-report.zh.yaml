              Augment 没有披露建立真正内在模型所需的指标，因此估值必须从框架和可比公司集合开始。 Datadog、GitLab、MongoDB 和 Atlassian
              的公开软件备案有用，因为它们展示了真实公开市场投资者期待的衡量纪律： 收入质量、留存、利润率和经营杠杆。与此同时，AI 编程工具的私营可比材料已经异常火热。 TechCrunch 和 CNBC 围绕 Cursor
              的报道显示，市场愿意给具有可见规模的爆发式编程平台极高价格； Replit、Codeium 和 Sourcegraph 则显示在那个极端之下，估值分布宽得多。换句话说，Augment 位于两个可比世界之间：
              可审计的公开软件纪律，以及容易被炒热的私营 AI 稀缺性。因此，价格敏感性比泛泛赞赏产品品类更重要。 可比对象怎么选，会像公司质量一样左右答案。
