            body: >-
              商业风险不是没人想要 AI 编程帮助，而是在“赢家拿走大部分”经济性被证明之前，品类已经变拥挤。 Gartner 描述竞争重组，GitHub 可以把 Copilot 捆绑进庞大的既有平台，Cursor
              已快速建立心智， Anthropic 正从模型层走向高端市场。这个组合会压缩高端独立定价空间，除非 Augment 持续证明企业上下文、
              治理和工作流深度能转化为可衡量价值。销售主导的定价界面意味着周期更长、证明要求更重； Drata 的上线故事也显示，采用需要真实的组织变化。与此同时，公开来源仍未披露集中度、续约或中位使用深度。
              因此，依赖风险和执行风险不可分割：公司可能正在拿下令人印象深刻的客户标识， 但公开证据仍无法说明这些胜利是否能足够持久地扩张，从而支撑估值叙事。
