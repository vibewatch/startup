        title: 当前估值事实与不透明为何重要
        blocks:
          - type: paragraph
            body: >-
              公开记录中最干净的估值事实，是头部融资锚点，而不是其下方经济性。Augment 2024 年 4 月融资被广泛报道为 $227 million、估值 $977 million，并在退出隐身前后累计融资约 $252
              million。后续二级和画像来源支持独角兽口径， 但任何后续估值上调的确切规模、结构和清算优先权质量仍不清楚。这个区别很重要。公司可以值得关注， 同时仍难以定价。公开外部人不知道
              ARR、毛利率、现金消耗、净留存或客户集中度，因此无法判断近独角兽估值是保守、 公允还是已经充分反映。实际结论是，估值不透明才是核心问题，而不是投资人是否关注公司。市场信号真实；
              投资判断证据仍不完整。今天，投资人被要求相信轮廓，而不是账本。
