  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Core software metrics
    missingEvidence: Current ARR, revenue growth, gross margin, NRR/GRR, churn, ACV, and customer concentration.
    whyItMatters: Without those metrics, the public funding story cannot be converted into an underwritten software-economics view.
    diligencePath: Request latest board metrics pack or audited management accounts.
    relatedQuestionRefs:
    - QI006
    - QI014
    - QI024
  - type: missing-source
    severity: material
    topic: Burn and runway
    missingEvidence: Cash on hand, monthly burn, runway, and exact size/terms of later financing events after the 2024 round.
    whyItMatters: Capital adequacy looks positive directionally, but exact dilution and runway remain opaque.
    diligencePath: Request cap table, cash balance, burn bridge, and financing documents.
    relatedQuestionRefs:
    - QI007
    - QI013
    - QI019
  - type: conflicting-data
    severity: minor
    topic: Valuation step-up quality
    missingEvidence: Clear primary-source confirmation of any later >$1B repricing versus secondary or investor-led descriptions.
    whyItMatters: A headline unicorn label is not the same as a fully evidenced price and round structure.
    diligencePath: Request signed term sheet or board-approved financing summary.
    relatedQuestionRefs:
    - QI020
