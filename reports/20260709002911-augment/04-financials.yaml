- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing metric
  - Impact
  - Exact diligence path
  rows:
  - - ARR and revenue growth
    - Prevents any direct revenue-multiple or efficiency underwriting
    - Request board pack or audited management accounts
  - - Gross margin by module
    - Blocks confidence on whether AI costs behave like software or hybrid services
    - Request COGS waterfall and model-provider spend breakout
  - - Burn and runway
    - Limits adequacy and dilution analysis
    - Request monthly burn bridge and cash position
  - - NRR / GRR / churn
    - Prevents durability and expansion judgment
    - Request cohort retention and logo churn by segment
  - - Customer concentration
    - Blocks downside and procurement-risk analysis
    - Request top-customer revenue share and renewal dates
  notes: These are not optional nice-to-haves; they are the exact missing inputs that separate a compelling story from a financeable software asset.
