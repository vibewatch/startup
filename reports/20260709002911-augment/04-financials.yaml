company:
  name: Augment
chapter:
  number: 4
  title: Financials
  summary: Augment's public financial file is strong on funding milestones, enterprise price posture, and customer ROI proof, but weak on the operating metrics needed for full underwriting. Public evidence supports a well-capitalized enterprise software motion built around negotiated platform contracts rather than simple self-serve seats, plus meaningful customer outcomes that imply real willingness to pay. But ARR, gross margin, burn, runway, retention, and concentration remain undisclosed, so the financial verdict stays directionally positive and underwritten only at medium confidence.
sections:
- id: revenue-model-and-pricing-signals
  title: Revenue Model and Pricing Signals
  body: Public pricing evidence suggests Augment is monetized through an enterprise software motion rather than a mass self-serve developer utility. The pricing surface is sales-led and far less explicit than the list-price ladders used by Copilot, Cursor, Tabnine, or Claude subscriptions. That does not automatically mean weaker monetization; in fact it often implies the opposite for enterprise software. But it does mean outsiders cannot easily infer ACV, seat-to-usage mix, or contract length from the public file. The most reasonable reading is that Augment sells negotiated contracts tied to enterprise security, context, and workflow depth, then aims to expand inside accounts as customers move from local coding help toward broader review and agent workflows. That framing is economically sensible, but still leaves large uncertainty around realized price and discounting. It also suggests that support, rollout design, and executive sponsorship are probably part of the commercial package from day one globally.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI027
  - CI028
  - CI030
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: traction-and-sales-efficiency-proxies
  title: Traction and Sales-Efficiency Proxies
  body: Because Augment does not publicly disclose ARR or cohort metrics, the best financial evidence comes from enterprise-outcome proxies. Those proxies are stronger than many private AI startups can show. Pure Storage documents 130,000-plus completions on a very large codebase, GoFundMe points to one- to two-day cycle-time reductions, Intercom describes 200 pull requests in a week and a better fit than simpler alternatives, and WEX frames a major refactor compressed into days. These are not direct revenue numbers, but they are the kind of ROI narratives that can support premium enterprise pricing if they recur. The GTM implication is a likely high-touch sale with reference-driven expansion rather than a lightweight bottom-up utility. The adverse side is that public case studies never disclose realized contract value, sales efficiency, or renewal, so traction remains persuasive but incomplete. They prove usefulness, not necessarily sales efficiency or durable recurring revenue quality.
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  - CI016
