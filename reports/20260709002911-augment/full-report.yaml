      - number: '2.2'
        title: Adoption Signals and Industry Segments
        blocks:
          - type: paragraph
            body: >-
              Adoption is real, but maturity is uneven. Stack Overflow's 2025 survey shows that AI tools are already
              mainstream in the daily workflow of many developers, yet agentic systems themselves are not. Usage rose
              while sentiment weakened, and distrust in accuracy still exceeds trust. That pattern matters because it
              implies the market is moving from curiosity to disciplined evaluation: enterprises want the gains, but
              they also want proof that the systems are safe, reliable, and governable. Survey and market-report data
              also indicate that regulated or high-complexity sectors are not sitting on the sidelines. Precedence
              places BFSI as the largest 2025 vertical and healthcare as the fastest-growing vertical, while GitLab's
              2026 DevSecOps survey frames AI as a force that will reshape software-delivery roles and workflows across
              thousands of practitioners. The resulting picture is a market with strong demand, but not one where
              adoption automatically equals durable deployment. That nuance is important for Augment because a category
              can look mainstream in survey usage while still being early in enterprise-standardization, budget
              centralization, and governance maturity.
            claimRefs:
