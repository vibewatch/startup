      - number: '4.4'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is promising but under-disclosed. Augment clearly has investor support, a relevant
              enterprise product, and customer stories strong enough to imply real commercial value. Those are
              meaningful positives. But they are not enough to underwrite the business in the disciplined way that
              later-stage software investing requires. The key missing metrics are exactly the ones that determine
              whether a richly funded AI developer-tools company is building a durable software franchise: ARR, realized
              pricing, gross margin, burn, runway, NRR, churn, and customer concentration. Stack Overflow survey
              evidence and Gartner's market-realignment framing matter here because they remind us that adoption, trust,
              and category economics are still evolving. In other words, the public file supports a company worth taking
              seriously, but not one whose economics can be confidently marked from headlines alone. The right posture
              from public evidence alone is serious investor interest plus intensive follow-up diligence, not blind
