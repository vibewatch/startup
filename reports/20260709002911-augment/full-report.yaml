        title: Operational and Product Failure Modes
        blocks:
          - type: paragraph
            body: >-
              Operationally, the largest risk is that Augment is trying to sell automation into the most sensitive
              artifact an enterprise owns: source code. Public materials show thoughtful design around proof of
              possession, internal access control, and enterprise administration, which is encouraging. Yet the product
              direction also raises the blast radius of failure. Remote Agent moves the company beyond local assistance
              into delegated execution. Customer wins at Pure Storage, Intercom, WEX, and Rubrik show why that ambition
              is attractive, but they also show why reliability, permissions, and review discipline matter. A retrieval
              mistake, bad edit proposal, leakage event, or weak operational control would damage more than one
              workflow; it could damage the entire trust narrative. Because the strongest operational evidence is still
              largely company-authored, the residual risk remains meaningfully above what a later-stage investor would
              want to accept without private diligence artifacts. The upside is visible; the operating proof is still
              incomplete.
