        - Named customers remain pilot-scale or NRR disappoints
        - Reference accounts fail to expand into broad standard usage
        - Cut valuation tolerance or move to research-more
      - - Pricing compression
        - Win rates require commodity pricing to compete with bundles
        - Realized pricing converges toward lower-cost seat tools
        - Reframe thesis around narrower niche or pass
      - - AI cost structure / margin weakness
        - Private margin or burn data fail software-like expectations
        - Gross margin and burn indicate structurally heavy inference burden
        - Reject premium multiple or pass entirely
    notes: These triggers translate abstract concern into concrete underwriting tests.
