      - number: '3.3'
        title: Switching Costs, Distribution Power, and Multi-Homing
        blocks:
          - type: paragraph
            body: >-
              Competitive durability in this market depends less on raw feature parity than on who controls distribution
              and who can become the default organizational standard. GitHub, AWS, JetBrains, GitLab, and Anthropic all
              start with distribution leverage that an independent startup does not have. That matters because
              enterprise buyers often prefer fewer vendors, simpler procurement, and tighter identity integration. At
              the same time, switching costs are softer than in data-platform categories. Most tools integrate at the
              IDE, repo, or workflow layer rather than requiring a hard data migration, which keeps multi-homing
              plausible and lets buyers run pilots side by side. Survey evidence also suggests developers will keep
              testing tools while trust remains unsettled. For Augment, that is both risk and opportunity: it can win if
              it proves materially better on large-repository context and governance, but it cannot assume seat-level
              persistence the way a deeply embedded system-of-record vendor can today.
            claimRefs:
              - CP011
