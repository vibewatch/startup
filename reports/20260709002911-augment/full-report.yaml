  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              The first analytical step is to define Augment's real market boundary. Gartner's 2026 framing makes clear
              that enterprise AI coding agents are no longer just autocomplete helpers; the category is expanding into
              planning, code generation, review, workflow orchestration, and automated validation across the SDLC. That
              means Augment competes in a narrower slice than broad AI software spending but a broader slice than simple
              code-completion plugins. Public sizing lenses are therefore layered rather than singular. Gartner shows
              $453.2 billion of 2026 AI software spending and $8.416 billion for AI application development platforms,
              while direct category publishers estimate 2025 AI code assistants or code tools around $7.9-$8.1 billion.
              Those figures are directionally useful, but they are not interchangeable. The broadest numbers overstate
              Augment's practical opportunity; the narrowest numbers may still undercount orchestration and workflow
              spend that agentic platforms aim to capture.
            claimRefs:
              - CM001
