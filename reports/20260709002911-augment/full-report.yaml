  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Geography, and Product Scope
        blocks:
          - type: paragraph
            body: >-
              Augment's sourced public identity is clearer than some secondary summaries: the official April 2024 launch
              announcement and Tracxn profile both place the company in Palo Alto, California, and the privacy policy
              identifies the legal entity as Augment Computing, Inc. Founded in 2022 by Igor Ostrovsky and Guy Gur-Ari,
              Augment launched publicly as an AI coding-assistance startup but its 2026 website now leads with Cosmos,
              an agentic software-development platform aimed at organizational throughput rather than just individual
              autocomplete. That positioning matters because the product story is no longer only “better code
              suggestions”; it is coordinated agents, shared memory, workflow triggers, GitHub/Jira/Slack integration,
              and sandboxed execution across local, managed, and customer-controlled environments. In other words, the
              company is selling a platform layer for AI-native engineering organizations, not merely an IDE add-on.
