  - id: FV001
    title: Recommendation Logic
    type: flow
    layout: wide
    summary: >-
      The recommendation runs from credible financing and customer proof through missing economics to a track /
      research-more stance.
    data:
      nodes:
        - id: f1
          label: Credible funding anchor
          detail: $977M 2024 valuation publicly supported
        - id: f2
          label: Real enterprise proof
          detail: Large-codebase and workflow outcomes matter
        - id: f3
          label: Opaque economics
          detail: ARR, NRR, margin, and concentration undisclosed
        - id: f4
          label: Wide comp band
          detail: Hot private AI comps versus audited public discipline
        - id: f5
          label: Track / research-more
          detail: Plausible company, insufficient pricing edge
      edges:
        - from: f1
          to: f2
          label: plus
        - from: f2
          to: f3
          label: offset by
        - from: f3
          to: f4
          label: forces
        - from: f4
          to: f5
          label: leads to
    claimRefs:
      - CV001
      - CV014
      - CV032
      - CV033
      - CV041
  - id: FV002
    title: Valuation Sensitivity
    type: bar
    layout: wide
    summary: >-
      The 2024 valuation anchor implies very different ARR requirements depending on which multiple band Augment
      deserves.
    data:
      items:
        - label: 20.0x premium AI software
          value: 48.9
        - label: 10.0x strong growth software
          value: 97.7
        - label: 8.0x solid software
          value: 122.1
        - label: 6.0x ordinary software
          value: 162.8
        - label: 4.0x strategic downside
          value: 244.3
      yAxis:
        label: ARR needed for $977M EV (USD M)
    approximationNotes: >-
      Values are simple EV divided by revenue-multiple sensitivity points; they are illustrative, not disclosed ARR
      ranges for Augment.
    claimRefs:
      - CV027
      - CV028
      - CV029
  - id: FV003
    title: Valuation / Return Range
    type: range
    layout: wide
    summary: >-
      For a few ARR bands, fair value swings materially depending on whether Augment earns premium AI-software treatment
      or normal software treatment.
    data:
      items:
        - label: If ARR is $50M
          low: 200
          mid: 500
          high: 1000
        - label: If ARR is $75M
          low: 300
          mid: 750
          high: 1500
        - label: If ARR is $100M
          low: 400
          mid: 1000
          high: 2000
    approximationNotes: >-
      Low uses a 4x downside strategic multiple, mid uses a 10x strong-growth software multiple, and high uses a 20x
      premium AI-software multiple.
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV036
  - id: FV004
    title: Investment KPIs
    type: kpi
