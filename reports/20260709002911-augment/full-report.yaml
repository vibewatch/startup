  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Signals
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence suggests Augment is monetized through an enterprise software motion rather than a
              mass self-serve developer utility. The pricing surface is sales-led and far less explicit than the
              list-price ladders used by Copilot, Cursor, Tabnine, or Claude subscriptions. That does not automatically
              mean weaker monetization; in fact it often implies the opposite for enterprise software. But it does mean
              outsiders cannot easily infer ACV, seat-to-usage mix, or contract length from the public file. The most
              reasonable reading is that Augment sells negotiated contracts tied to enterprise security, context, and
              workflow depth, then aims to expand inside accounts as customers move from local coding help toward
              broader review and agent workflows. That framing is economically sensible, but still leaves large
              uncertainty around realized price and discounting. It also suggests that support, rollout design, and
              executive sponsorship are probably part of the commercial package from day one globally.
            claimRefs:
