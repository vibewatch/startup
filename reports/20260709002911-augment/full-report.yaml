          value: '252'
          unit: USD M+
        - label: ARR disclosure quality
          value: Low
        - label: Customer proof quality
          value: Medium-High
        - label: Recommendation confidence
          value: Medium
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV014
      - CV034
