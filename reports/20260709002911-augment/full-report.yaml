      - number: '4.2'
        title: Traction and Sales-Efficiency Proxies
        blocks:
          - type: paragraph
            body: >-
              Because Augment does not publicly disclose ARR or cohort metrics, the best financial evidence comes from
              enterprise-outcome proxies. Those proxies are stronger than many private AI startups can show. Pure
              Storage documents 130,000-plus completions on a very large codebase, GoFundMe points to one- to two-day
              cycle-time reductions, Intercom describes 200 pull requests in a week and a better fit than simpler
              alternatives, and WEX frames a major refactor compressed into days. These are not direct revenue numbers,
              but they are the kind of ROI narratives that can support premium enterprise pricing if they recur. The GTM
              implication is a likely high-touch sale with reference-driven expansion rather than a lightweight
              bottom-up utility. The adverse side is that public case studies never disclose realized contract value,
              sales efficiency, or renewal, so traction remains persuasive but incomplete. They prove usefulness, not
