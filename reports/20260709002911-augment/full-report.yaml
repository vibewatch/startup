      - number: '1.2'
        title: Leadership Bench and Governance Visibility
        blocks:
          - type: paragraph
            body: >-
              The founding bench is technically credible and enterprise-oriented. Ostrovsky brings systems and
              infrastructure credentials from Pure Storage and Microsoft, while Gur-Ari contributes AI-research depth
              from Google. Public materials name Scott Dietzen as CEO and Dion Almaer as a senior product leader, and
              the launch materials emphasize a team recruited from Google, Meta, NVIDIA, Microsoft, Databricks,
              Snowflake, VMware, and Pure Storage. That talent profile matches the product pitch: deep systems
              engineering plus model/research experience. The missing piece is governance visibility. No fetched source
              names the board or clarifies observer rights, which means even the otherwise strong leadership story still
              depends on private diligence today clearly. Public sources do not disclose the board, voting control, or
              investor governance rights, so later diligence should treat leadership dependence and board composition as
              open questions rather than assumed strengths. The careers page does show the company still hiring across
              go-to-market and engineering functions, which supports a growth-stage rather than maintenance-stage
              operating posture.
