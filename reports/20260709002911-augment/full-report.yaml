  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current Valuation Facts and Why Opacity Matters
        blocks:
          - type: paragraph
            body: >-
              The cleanest valuation facts in the public record are the headline financing anchors, not the economics
              underneath them. Augment's April 2024 round was widely reported at $227 million and a $977 million
              valuation, with roughly $252 million of cumulative capital raised around the stealth exit. Secondary and
              profile sources later support unicorn framing, but the exact size, structure, and preference quality of
              any later step-up are still unclear. That distinction matters. A company can deserve attention and still
              be too hard to price. Public outsiders do not know ARR, gross margin, burn, net retention, or customer
              concentration, so they cannot tell whether the near-unicorn mark was conservative, fair, or already full.
              The practical takeaway is that valuation opacity is the central issue, not whether investors cared about
              the company. The market signal is real; the underwriting proof remains incomplete. Investors are being
              asked to trust the silhouette more than the ledger today publicly.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV032
              - CV036
              - CV041
