  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, Regulatory, and Trust Boundary
        blocks:
          - type: paragraph
            body: >-
              The legal and regulatory file is directionally serious but not fully de-risked. Augment has published the
              baseline materials sophisticated enterprise buyers expect, including a privacy policy, enterprise terms, a
              security page, and a detailed security-architecture write-up. That matters because code-handling trust is
              the first gate in this category. But the same evidence also exposes the core weakness of the public file:
              most of the critical trust claims are self-authored. Regulators are not waiting for the category to mature
              before acting. The FTC already treats AI marketing and competition as active policy areas, the European
              Commission has formalized obligations for covered general-purpose AI systems, and the Copyright Office is
              still working through training and output questions. Augment may not bear each of those burdens directly,
              yet enterprise customers will increasingly push those governance questions downstream into procurement,
              legal review, and renewal decisions. That creates friction even before any formal dispute appears in
              public.
