      - number: '3.2'
        title: Direct Vendor Profiles and Buyer Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              The closest product overlap is with vendors that combine deep code assistance with enterprise packaging.
              GitHub Copilot is the default incumbent because of brand, Microsoft reach, and a broad plan ladder. Cursor
              is probably the sharpest startup-to-startup comparison because it sells AI-first development workflows
              with relatively simple team pricing. Tabnine and Sourcegraph matter when private deployment, self-hosting,
              or search-led repository context become primary buying criteria. Amazon Q and GitLab matter when
              procurement can ride a broader platform relationship rather than a new standalone contract. Anthropic and
              JetBrains matter for a different reason: they suggest that application-layer competition can come from
              adjacent control points rather than only from code-assistant startups. The buyer tradeoff is therefore
              multi-dimensional. Some buyers want the cheapest path to widespread adoption, some want the strongest
              governance surface, some want the deepest repo understanding, and some simply want to buy from an
              incumbent already inside the stack at scale.
