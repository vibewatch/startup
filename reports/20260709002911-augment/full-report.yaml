      - number: '2.3'
        title: Buyer, User, Payer, and Evaluation Axes
        blocks:
          - type: paragraph
            body: >-
              The buyer map is more enterprise-platform than individual-developer tooling. Public pricing and control
              surfaces from GitHub, Cursor, Tabnine, AWS, Anthropic, and Sourcegraph show that vendors increasingly sell
              governance, deployment, and billing models alongside raw model access. Seat pricing, metered credits,
              LOC-based transformation charges, single-tenant or self-hosted deployment, SAML/SCIM, and access controls
              all imply a payer who sits above the individual developer. In practice that means CTOs, VPs of
              engineering, platform-engineering leaders, and security or procurement stakeholders are often the economic
              buyers, while engineers, reviewers, and adjacent technical operators are the day-to-day users. Augment's
              own market framing reinforces this: the problem is not typing faster, but making organizational
              software-development workflows work with AI under enterprise constraints. That is why context breadth,
              review quality, deployment model, and commercial clarity now matter as much as model quality itself.
            claimRefs:
