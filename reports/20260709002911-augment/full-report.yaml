  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Solution Classes
        blocks:
          - type: paragraph
            body: >-
              The buyer evaluating Augment is rarely choosing between only two startups. The realistic landscape breaks
              into several solution classes. First are direct enterprise coding-assistant platforms such as GitHub
              Copilot, Cursor, Tabnine, Sourcegraph Cody, and Codeium, all of which promise some mix of code completion,
              chat, refactoring, and codebase assistance. Second are platform-bundled entrants such as Amazon Q, GitLab,
              and JetBrains AI that can piggyback on pre-existing cloud, DevSecOps, or IDE relationships. Third are
              frontier-model products such as Claude Code that compress the stack by shipping coding workflows directly
              from the model provider. Finally there is the status quo: internal tooling, manual review, and partial use
              of repo-native or IDE-native functions. Gartner's 2026 market-realignment framing and DORA's systems view
              both support this broader reading. It means Augment is competing for a workflow and governance layer, not
              just for one autocomplete seat.
            claimRefs:
              - CP001
              - CP010
              - CP012
              - CP023
              - CP024
