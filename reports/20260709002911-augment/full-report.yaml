            body: >-
              From an investment perspective, the right posture is not to reject Augment on public-risk grounds alone,
              but to treat several issues as explicit gating questions. The most obvious kill criteria are a meaningful
              security event, evidence that named customers are shallow pilots rather than expanding standards, pricing
              pressure that forces the company toward commodity seat economics, or private metrics that show AI-specific
              cost structure is preventing software-like margins. Strong funding, detailed security writing, and
              high-quality logos make those risks worth diligencing rather than dismissing. But none of them are small.
              The public file supports a company with credible upside and credible execution discipline, yet it does not
              support a passive assumption that trust, retention, and valuation will take care of themselves. The thesis
              is viable only if private diligence materially upgrades proof on the highest-severity unknowns and
              confirms repeatability beyond showcase accounts. Otherwise the funding story can outrun the evidence base
