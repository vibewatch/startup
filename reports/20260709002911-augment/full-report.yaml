      - number: '1.3'
        title: Capital Base, Investors, and Stage
        blocks:
          - type: paragraph
            body: >-
              The best-corroborated funding picture is still the 2024 launch financing. Official company releases,
              BusinessWire, Voicebot, and TechCrunch all align on a $227 million Series B announced on 2024-04-24 at a
              $977 million post-money valuation, following a $25 million Series A led by Sutter Hill Ventures and
              bringing total disclosed funding to $252 million. The disclosed core investor set included Sutter Hill
              Ventures, Index Ventures, Innovation Endeavors, Lightspeed Venture Partners, and Meritech Capital; a later
              November 2024 PRNewswire release from Evolution Equity Partners confirms that Evolution also invested in
              the Series B round. Partner-owned portfolio pages from Lightspeed and Index still list Augment, which
              helps corroborate investor affiliation beyond launch-day PR. What remains unresolved is whether the later
              Series B extension actually repriced the company above $1 billion. Some secondary summaries round the
              company to “unicorn” status, but the fetched primary record still anchors on $977 million post-money.
