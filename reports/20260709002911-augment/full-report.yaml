      - number: '5.2'
        title: Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              The technical heart of Augment is context retrieval at enterprise codebase scale. The public architecture
              story says embeddings are generated across user codebases and retrieved at task time to support chat,
              completion, and larger editing workflows. The repo-scale engineering post provides unusually specific
              performance claims: 100M-plus line support, an 8x memory reduction through quantized vector search,
              latency improvement from seconds to sub-200ms, and automatic fallbacks for rare edge cases. Next Edit then
              builds on that substrate with a trained retriever and compact diff-decoding approach so the system can
              reason across many files without turning interactive use into a slow batch job. Prism layers on another
              operating concern—cost and model selection—by routing turns among underlying models while minimizing
              prompt-cache loss. The result is a system architecture that looks thoughtfully engineered for large, live
              codebases, but also one that clearly depends on a mix of Augment-owned retrieval infrastructure and
              third-party inference providers.
