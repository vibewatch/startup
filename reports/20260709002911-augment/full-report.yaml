  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Definition and Module Map
        blocks:
          - type: paragraph
            body: >-
              Augment is no longer best understood as a single autocomplete feature. Its public materials now describe a
              platform spanning shared codebase context, IDE assistance, next-edit suggestions, chat, remote agents,
              review workflows, and organization-level rollout patterns under the Cosmos and agentic-SDLC framing. That
              breadth matters because it changes the underwriting question from “Is the model good at completion?” to
              “Can the company coordinate more of the software-delivery workflow than point assistants can?” The module
              map visible in public sources is coherent enough to take seriously. Context Engine anchors the system,
              Next Edit extends support across the workspace, Prism manages cost and model selection, Remote Agent
              pushes execution into the cloud, and customer rollout materials show the product being operationalized at
              team level rather than only at individual-dev level. It is increasingly a platform story, not a plugin
              story.
