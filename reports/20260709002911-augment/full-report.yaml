              - CV014
              - CV034
      - number: '8.4'
        title: Diligence Asks and Thesis Breaks
        blocks:
          - type: paragraph
            body: >-
              The remaining valuation work is straightforward in concept even if it is impossible from public sources
              alone. Investors need current ARR, gross margin, NRR, concentration, later-round terms, and evidence on
              how much customer value is landing as durable paid expansion rather than narrative. They also need to know
              whether the company's AI-specific cost structure still behaves like premium software economics.
              Strategic-exit comps such as HashiCorp show that quality enterprise workflow assets can attract meaningful
              M&A values, but exit optionality is a backstop rather than a reason to overpay. The real thesis-breakers
              are weak renewals, shallow deployments behind the best logos, material price compression against bundled
              rivals, or margins that fail to support premium software multiples. Until diligence closes those gaps,
              valuation should stay scenario-based and medium-confidence. That is enough for serious interest, not final
              conviction. A disciplined investor should want proof of economics before paying for possibility today.'
            claimRefs:
              - CV024
              - CV038
              - CV039
              - CV040
              - CV041
          - type: table
            tableRef: TV006
            claimRefs:
              - CV004
              - CV005
              - CV038
              - CV039
              - CV040
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The debate is proof quality, not whether investors cared
            body: >-
              Public funding and customer evidence already show that serious investors and buyers cared about Augment.
              The open question is whether the economics behind that interest were strong enough to make the price
              attractive.
            calloutType: insight
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV014
              - CV041
          - type: callout
            title: Hot private comps can mislead more than help
            body: >-
              Cursor-scale comp headlines prove market appetite, but they can also anchor investors to the top end of
              the category even when the target company has not disclosed the revenue and retention needed to deserve
              that band.
            calloutType: risk
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV025
