company:
  name: "Liftoff Mobile"
chapter:
  number: 6
  title: "Customers"
  summary: "Liftoff Mobile serves over 1,000 global performance marketers and reaches 1.4 billion daily active users across 140,000 apps integrated with its SDK. Powered by its Cortex neural network prediction engine, the platform generated a 124% net dollar retention rate as non-gaming app verticals expanded to over half of revenue; however, extreme customer concentration persists, with 362 accounts generating 98% of Core Advertising revenue."
sections:
  - id: "sec-segmentation"
    title: "Customer Base Segmentation & Vertical Diversification"
    body: "Liftoff Mobile operates a dual-sided marketplace serving demand-side app marketers seeking profitable user acquisition and supply-side mobile app developers seeking automated in-app ad monetization. Historically centered on performance-driven mobile gaming studios, the company deliberately expanded into non-gaming app categories, including social media, financial services, and entertainment. By the nine months ended September 30, 2025, non-gaming categories generated slightly more than half of Core Advertising revenue. This vertical diversification insulates Liftoff from the volatile hit-driven release cycles typical of mobile game publishing. The customer base is geographically diverse, with more than 64% of nine-month 2025 revenue originating outside the Americas across 60 countries. Demand-side marketers interact through industry-tailored Cortex Adapters that tune neural network bidding logic to vertical-specific conversion events, such as opening an account or completing an initial purchase."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
    tableRefs:
      - "TU001"
  - id: "sec-adoption-trajectory"
    title: "Platform Adoption Scale & Key Account Trajectory"
    body: "Platform adoption is anchored in the widespread distribution of Liftoff's software development kit, which originated in the Vungle asset acquired and merged under Blackstone sponsorship in 2021. As of September 30, 2025, the SDK was integrated into over 140,000 mobile applications, establishing an addressable supply footprint of approximately 1.4 billion daily active users worldwide. This publisher reach enables Liftoff to service more than 1,000 active marketers across the Americas, APAC, and EMEA regions. High-value customer adoption has expanded steadily: accounts generating more than $100,000 in Core Advertising revenue grew from 287 in fiscal 2023 to 316 in fiscal 2024, and reached 362 accounts during the first nine months of fiscal 2025. This steady account progression demonstrates expanding enterprise wallet share across top-tier mobile growth teams."
    claimRefs:
      - "CU003"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU002"
  - id: "sec-customer-proof"
    title: "Customer Deployments, Proof Points & Integration Lifecycle"
    body: "Customer workflows on Liftoff begin with publisher SDK integration or advertiser DSP campaign onboarding, followed by automated bid calibration under the Cortex machine learning engine. Cortex processes roughly 21 times more telemetry data than legacy linear models and evaluates auction conditions four times more rapidly, driving higher prediction accuracy for customer ROAS objectives. In enterprise IT operations, partner proof from Cloudasta documents a successful Google Domain Transfer project consolidating Liftoff's enterprise infrastructure under a single tenant. For commercial adtech clients, independent research confirms that 87% of surveyed marketers are willing to increase ad budgets when KPIs beat targets by 10%, scaling to 100% willingness at 30% outperformance. While public S-1 filings redact individual brand contracts under commercial confidentiality rules, aggregate retention and cross-vertical deployments demonstrate widespread production reliance across global app categories."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU007"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU003"
    figureRefs:
      - "FU001"
  - id: "sec-retention-concentration"
    title: "Retention Durability, Budget Expansion & Concentration Risks"
    body: "Customer durability on the platform is demonstrated by a 124% trailing twelve-month Core Advertising Net Dollar Retention rate as of September 30, 2025, an increase from 121% in the prior period and 118% in 2023. Logo retention among the platform's top 100 advertisers was 99% over the trailing twelve months, while top 100 publisher retention reached 100%. However, this growth engine carries significant structural concentration risk. Exactly 362 customers spending over $100,000 generated 98% of Core Advertising revenue in the first nine months of 2025, representing an average spend of approximately $1.35 million per enterprise account without public disclosure of top single-customer revenue shares. Liftoff's June 2026 IPO on Nasdaq raised $437 million at a $3.83 billion valuation, providing capital to retire legacy acquisition debt; however, the company remains exposed to privacy policy changes by Apple and Google and faces intense competition from AppLovin."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
