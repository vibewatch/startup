chapter:
  number: 7
  title: "Risks"
  summary: "Liftoff's most consequential disclosed risks are platform-owner privacy restrictions, advertiser and Core Advertising concentration, Cortex execution, and sponsor control. IPO-funded debt repayment and non-gaming diversification provide visible mitigants, but public evidence does not establish legal-incident history, counterparty concentration, security performance, or the operating maturity of key controls."
sections:
  - id: "risk-ranking"
    title: "Risk ranking and investment consequence"
    body: >-
      The central investment risk is not one isolated event but a linked operating chain: platform owners can
      restrict identifiers and attribution, weaker signals can reduce campaign performance, and advertisers can
      then reduce transaction volume. Clarifo identifies advertiser retention, campaign performance, mobile media
      spend, model accuracy, and privacy rules as direct dependencies, while Reuters reports that the sector is
      already adapting to tighter platform-owner privacy restrictions. Core Advertising represents 85% of revenue
      in Clarifo's breakdown, so deterioration in that engine would not be contained to a peripheral product.
      These disclosures support a high residual-risk assessment until cohort retention, model-degradation, and
      platform-level ROAS evidence is reviewed.
    claimRefs:
      - "CR001"
      - "CR007"
      - "CR008"
      - "CR011"
    figureRefs:
      - "FR001"
  - id: "regulatory-legal-governance"
    title: "Regulatory, legal, and governance exposure"
    body: >-
      Privacy and app-store policy exposure is global because Liftoff depends on data access controlled by mobile
      platform owners and operates across the Americas, APAC, and EMEA. Public evidence establishes the mechanism
      of risk but does not identify a complete enforcement, litigation, or security-incident history; the absence
      of such records in this assigned evidence set is not evidence that none exists. Governance adds a separate
      minority-holder risk: InvestGame reports that Blackstone retained approximately 50.4% of voting power after
      the IPO, qualifying Liftoff as a Nasdaq controlled company. The legal register therefore treats privacy,
      controlled-company governance, and judgment-sensitive public reporting as monitorable exposures rather than
      claiming an unverified violation.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR010"
      - "CR012"
    tableRefs:
      - "TR001"
  - id: "operational-financial"
    title: "Operational, model, and financial execution"
    body: >-
      Cortex model, infrastructure, or bidding errors can weaken conversion outcomes and customer trust, making
      technical quality economically material rather than merely a service-level concern. The platform's reported
      scale as of September 2025—more than 140,000 integrated apps, approximately 1.4 billion daily active users,
      and more than 1,000 marketers—widens the consequence of a control failure without proving outage resilience.
      Financial reporting also requires care: Clarifo says principal-versus-agent judgments affect revenue and cost
      comparability, while fair-value remeasurement of an earnout liability can create non-cash earnings volatility.
      These are accounting risks, not equivalent to cash burn, and should be separated from operating cash
      performance in underwriting.
    claimRefs:
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
    tableRefs:
      - "TR002"
  - id: "dependencies-mitigations-triggers"
    title: "Dependencies, mitigations, and thesis-break triggers"
    body: >-
      Liftoff remains dependent on platform owners for data access, advertisers for transaction volume, supply
      partners for media inventory, and Blackstone for controlled-company governance. The June 2026 IPO reduced
      one balance-sheet pressure: InvestGame reports an intended application of approximately $413.8 million of
      proceeds to debt under a term loan maturing in 2032. Business-mix diversification is another visible signal,
      with slightly more than half of first-quarter 2026 advertiser revenue reportedly coming from outside gaming,
      but neither fact demonstrates that privacy, model, or counterparty controls are mature. Thesis-break triggers
      should therefore include sustained advertiser contraction, worsening retention, material attribution loss,
      repeated model or infrastructure failures, adverse legal findings, or governance actions that disadvantage
      minority holders.
    claimRefs:
      - "CR002"
      - "CR003"
      - "CR007"
      - "CR014"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR003"
