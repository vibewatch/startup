callouts:
  - calloutType: "strength"
    title: "Integrated Dual-Sided Scale and Neural Network Feedback Loop"
    body: "Liftoff Mobile's combination of a demand-side bidding platform and client SDKs embedded in over 140,000 apps gives Cortex direct access to contextual and post-install engagement data, creating a self-reinforcing training feedback loop that independent DSPs without proprietary SDK footprint cannot easily replicate."
    claimRefs:
      - "CE001"
      - "CE005"
      - "CE008"
  - calloutType: "risk"
    title: "OS-Level Identifier Depreciation and ATT Privacy Headwinds"
    body: "Ongoing mobile operating system restrictions, exemplified by Apple's App Tracking Transparency and evolving privacy restrictions on device identifiers, limit cross-app behavioral tracking and force increasing reliance on aggregated or probabilistic attribution, creating risk of model decay if privacy sandboxes restrict real-time telemetry."
    claimRefs:
      - "CE013"
