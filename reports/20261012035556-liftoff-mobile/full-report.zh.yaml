      - number: '3.3'
        title: 定价模式、聚合机制与切换成本
        blocks:
          - type: paragraph
            body: >-
              移动应用营销生态的商业条款通常对广告主采用按效果计费的单次安装成本（CPI）或单次行动成本（CPA）模式；发行商变现则依靠程序化竞价分成，以有效千次展示成本（eCPM）收益体现。Liftoff Mobile
              为企业营销客户提供混合合作方式，把托管式效果支出与软件分析工具结合起来。但需求侧切换成本结构性偏低，因为效果营销人员经常同时使用多个 DSP
              和广告网络，以获取增量用户并降低综合获客成本。相反，供给侧把软件开发工具包接入移动游戏代码会形成中等运营惯性，不过头部游戏工作室通常会接入多个聚合适配器，在不同需求合作方之间维持收益竞争。
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP005
              - CP012
              - CP013
      - number: '3.4'
        title: 护城河持续性、平台变化与颠覆风险
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile 的竞争护城河建立在双边市场网络效应、自有历史转化数据集，以及覆盖 140,000+ 个移动应用的嵌入式 SDK
              网络之上。但其持续性仍面临重大战略和结构性逆风。更广泛的移动广告科技行业持续适应限制性操作系统隐私框架，包括 Apple 的 App Tracking Transparency 和不断变化的 Google
              Privacy Sandbox 政策；这些政策限制跨应用设备标识符，迫使广告网络大量投入概率建模。此外，2026 年初企业对软件和广告科技商业模式的态度日趋谨慎，生成式 AI 颠覆的普遍担忧引发 S&P 500
              软件与服务指数 $800 billion 市值抛售，促使 Liftoff Mobile 推迟 2026 年 2 月的首次上市，最终于 2026 年 6 月以修订后的 $437 million IPO、较低的
              $3.83 billion 估值完成上市。
