  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与渠道划分
        blocks:
          - type: paragraph
            body: >-
              移动广告科技在全球数字经济中扮演关键基础设施角色，提供自动化软件，帮助移动应用开发者和商业企业获取用户、衡量营销效率并变现数字广告库存。Liftoff Mobile 专注于移动程序化效果营销和应用内变现，2021
              年与 Vungle
              合并后扩大了技术覆盖。可服务品类包括游戏、社交媒体、娱乐和电商领域的自动受众定向、动态创意优化、需求侧竞价以及开发者供给侧广告投放。相反，该市场不包括传统桌面展示广告网络、线性电视广告、印刷媒体和封闭式搜索生态。Meta、Google
              Search 等平台的封闭式流量属于独立替代品，而非独立程序化市场的一部分，因为封闭生态运行自有竞价协议和封闭归因机制。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 市场规模：TAM、SAM 与可获得市场分层
        blocks:
          - type: paragraph
            body: >-
              评估 Liftoff Mobile 的市场机会，首先要建立清晰的规模分层，把全部数字广告预算与可触达的应用内程序化支出区分开来。独立行业分析预计，全球移动广告支出将以约 14% 的复合年增长率扩张，到 2028
              年总量超过 $600 billion。在这个宏观市场中，移动需求侧平台交易的媒体价值约为 $350 billion，应用内视频广告网络市场超过 $100
              billion。独立、非封闭生态效果广告科技的可服务市场（SAM）约为 $28 billion，代表开发者主动寻找平台双寡头之外第三方替代方案的支出。Liftoff 当前在超过 140,000 个集成 SDK
              的应用和全球 1.4 billion 日活用户组成的网络中拥有约 $2.5 billion 的可服务可获得市场（SOM），但要继续扩张仍需持续从成熟竞争对手手中争取份额。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
