        blocks:
          - type: paragraph
            body: >-
              核心投资风险不是某个孤立事件，而是一条相互连接的运营链：平台所有者可以限制标识符和归因，信号变弱会降低活动效果，广告主随后可能减少交易量。Clarifo
              将广告主留存、活动表现、移动媒体支出、模型准确性和隐私规则列为直接依赖因素；Reuters 则报道称，该行业已经在适应平台所有者更严格的隐私限制。按 Clarifo 的拆分，Core Advertising
              占收入的 85%，因此该引擎恶化不会局限于边缘产品。在审阅用户群留存、模型退化和平台级 ROAS 证据之前，这些披露支持较高的剩余风险判断。
            claimRefs:
