        title: 公司定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile 运营 AI 驱动的效果营销与变现软件平台，服务游戏、社交媒体、金融和娱乐领域的移动应用广告主与发行商。公司最初于 2011 或 2012 年在加州 Redwood City
              成立，2021 年由大股东 Blackstone 主导 Liftoff 与 Vungle 合并后形成当前运营架构。平台以自研机器学习引擎 Cortex
              为核心，把用户获取定向、创意自动化和应用内变现统一起来；其集成的软件开发工具包覆盖全球约 14 亿日活用户。收入来自程序化广告预算和发行商变现费用，整体是轻资本的双边广告市场。
