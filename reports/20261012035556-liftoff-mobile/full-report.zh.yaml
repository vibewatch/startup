      - number: '4.4'
        title: 资本充足性、未来现金 runway 与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile 通过 2026 年 6 月 IPO 显著增强资产负债表，以每股 $23 发行 19 million 股普通股，在 NASDAQ 募得 $437 million 总额。发行价高于
              $20 至 $22 的市场区间，显示机构需求稳健；同时，最终 $3.83 billion 市值相对 General Atlantic 2025 年少数股权轮的 $4.3 billion 估值折价
              11%。这笔资金注入缓解了关键资产负债表约束，S&P Global Ratings 也因大幅偿债而上调公司信用状况。但机构投资判断仍受未解决的信息缺口限制。核心尽调包括核实经审计毛利率、明确 IPO
              后杠杆率，以及评估 AppLovin 由 AI 驱动的激进广告网络份额增长。中期资本充足性有保障，但长期回报取决于 Liftoff 能否抵御主导平台生态并守住自身抽成率。
            claimRefs:
