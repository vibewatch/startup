      - number: '1.2'
        title: 资本结构、融资历史与估值
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile 于 2026 年 6 月 4 日在 Nasdaq Global Select Market 完成 IPO，股票代码为 LFTO，以每股 $23.00 发行 19.0 million
              股，募得 $437 million 总额。发行价高于修订后的每股 $20.00 至 $22.00 发行区间；按招股书披露的流通普通股计算，初始公开市场市值为 $3.83 billion。该估值较 General
              Atlantic 于 2025 年在大股东 Blackstone 之外收购少数股权时确定的 $4.3 billion 私募估值低约 11%。这次 6 月成功上市经历了 2026
              年初动荡的资本市场环境：Liftoff 于 2025 年末秘密申报，并在 2026 年 1 月公开申报，目标募资最高 $711 million、对应市值 $5.5 billion；但在 2026 年 2
              月行业软件股普遍抛售期间撤回申报，随后于 2026 年 4 月重新申报。
