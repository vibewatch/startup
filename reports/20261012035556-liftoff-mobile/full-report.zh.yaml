    claimRefs:
      - CI003
      - CI010
      - CI011
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 垂直整合的移动广告技术栈，连接客户端应用、竞价基础设施、广告交易所和神经网络数据闭环。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE008
    data:
      layers:
        - label: 客户端应用与 SDK 层
          detail: 嵌入式软件开发工具包部署在 140,000+ 个移动应用中，触达 1.4B 日活用户。
          modules:
            - SDK 核心库
            - 可玩广告与视频渲染器
            - 上下文遥测采集器
        - label: 供给侧程序化交易所
          detail: Vungle 交易层管理应用内发行商库存、头部竞价和需求路由。
          modules:
            - 实时竞价引擎
            - 聚合连接器
            - 发行商收益管理器
        - label: Cortex 神经网络引擎
          detail: 专有机器学习引擎执行预测竞价和 LTV 评分算法。
          modules:
            - 转化率预测器
            - 出价估值模型
            - 自学习训练闭环
        - label: 需求侧平台（Liftoff DSP）
          detail: 活动自动化界面允许广告主在各应用中部署效果获客预算。
          modules:
            - 程序化预算分配器
            - 定向优化器
            - 活动分析控制台
        - label: 归因与数据管道
          detail: 高吞吐流式基础设施汇总安装后事件遥测和 MMP 回传。
          modules:
            - MMP Webhook 接入
            - 转化归因处理器
            - 实时指标聚合器
        - label: 基础设施与隐私治理
          detail: 具备隐私保护聚合和监管同意控制的云托管基础设施。
          modules:
            - 低延迟服务节点
            - SKAdNetwork / 隐私适配器
            - GDPR / CCPA 同意管理器
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从初始 SDK 集成和试点测试，到 Cortex 自动扩大预算的六阶段广告主与发行商生命周期。
    data:
      items:
        - label: SDK 集成
          detail: 发行商在 iOS 和 Android 应用中集成 Vungle / Liftoff 轻量 SDK。
          tone: neutral
        - label: 试点活动
          detail: 效果营销商启动初始广告支出，在非游戏和游戏垂直领域测试 ROAS 基准。
          tone: neutral
        - label: Cortex 校准
          detail: 神经网络模型基于应用遥测和竞价收益训练，运行 4 倍数量的测试来优化出价。
          tone: positive
        - label: 达到目标 ROAS
          detail: DSP 算法在全球库存来源中达到广告主的效果基准。
          tone: positive
        - label: 扩大预算
          detail: 广告主自动增加预算分配，实现 124% 的净美元留存率。
          tone: positive
        - label: 跨垂直扩张
          detail: 营销商将行业专用适配器部署到社交、金融和商业垂直领域。
          tone: positive
    approximationNotes: 代表 Liftoff S-1 披露和行业效果营销模型中记录的典型生命周期阶段。
    claimRefs:
      - CU001
      - CU004
      - CU007
      - CU010
