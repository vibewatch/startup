      - number: '2.3'
        title: 买方分层、预算动态与多平台部署行为
        blocks:
          - type: paragraph
            body: >-
              移动广告科技的采购反映出游戏工作室与企业级非游戏品牌不同的运营重点。移动游戏工作室是 Liftoff
              历史上的核心客户，通常拥有严格的日度广告支出回报率（ROAS）要求和自动化活动调整流程。这些买方几乎完全依据可衡量的单次安装成本（CPI）和安装后的用户生命周期价值分配预算。相比之下，金融科技、电商和订阅媒体领域的非游戏开发者会根据综合获客成本（CAC）和持续的用户群留存评估程序化平台。两类买方都有一个鲜明事实：广泛多平台部署。移动营销人员通常同时使用三至五个
              DSP 和广告网络，并实时把预算转向算法定向效率更高的平台。
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: 增长驱动、平台隐私逆风与战略约束
        blocks:
          - type: paragraph
            body: >-
              移动广告科技市场扩张受多重结构性顺风推动，包括消费者在智能手机上的参与度提升、亚太等国际新兴市场强劲增长，以及预测式人工智能在自动竞价中的成熟。但显著的系统性采用约束也抵消了部分驱动因素。最关键的是，平台隐私政策变化——包括
              Apple App Tracking Transparency（ATT）框架和 Google 分阶段推出 Privacy
              Sandbox——削弱了确定性标识符的可用性。这种退化损害传统用户级追踪，推高媒体采购成本，并在机器学习驱动的上下文归因领域引发激烈技术竞赛。此外，Liftoff
              对移动应用内环境的专门化也带来渠道集中风险，使公司无法接触 Connected TV（CTV）和零售媒体网络等高增长数字渠道。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 平台隐私逆风与定向能力退化
            body: >-
              Apple App Tracking Transparency（ATT）框架和 Google 分阶段推出 Privacy Sandbox，从结构上减少用户级标识符的可用性。在聚合且受隐私约束的环境中，纯移动
              DSP 需要加大算法研发投入，才能维持客户的广告支出回报。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
          - type: callout
            title: 封闭生态集中度与独立广告科技的可行性
            body: 尽管封闭生态吸收了绝大多数数字广告预算，独立应用开发者越来越依赖开放程序化平台，在不被单一平台锁定的情况下获取高生命周期价值用户，这支撑了对中立平台的韧性需求。
            calloutType: insight
            claimRefs:
              - CM001
              - CM008
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与市场定位
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile 所处的移动广告科技市场拥挤且高度集中，直接与 AppLovin、Unity 和 ironSource 等大型广告网络及聚合平台争夺移动应用开发者的获客与变现预算。Google
              AdMob、Meta Audience Network 等超大规模封闭生态覆盖了消费者场景中的大部分全球广告支出，但独立应用开发者仍高度依赖专业程序化需求侧平台和聚合引擎，推动安装后的精准用户参与。2021
              年在私募股权发起人 Blackstone 主导下与 Vungle 合并后，Liftoff Mobile 形成全球规模，其软件开发工具包覆盖超过 140,000 个移动应用，连接全球约 1.4 billion
              日活用户，覆盖游戏、社交媒体、金融和娱乐领域。然而，AppLovin 凭借自有 AXON 2.0 机器学习引擎扩大了移动效果营销领先优势，对程序化开发者支出形成显著竞争压力。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
