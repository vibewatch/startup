              运营。公开证据说明了风险机制，但没有给出完整的执法、诉讼或安全事件历史；指定证据集没有这类记录，不等于这些事件不存在。治理还带来单独的少数股东风险：InvestGame 报道称，IPO 后 Blackstone
              保留约 50.4% 的投票权，使 Liftoff 成为 Nasdaq 控制型公司。因此，法律登记将隐私、控制型公司治理和依赖判断的公开报告视为需要监测的暴露，而不是声称存在未经验证的违规。
