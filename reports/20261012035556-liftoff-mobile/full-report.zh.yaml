      - number: '4.3'
        title: 成本结构与单位经济性
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile 的成本结构由两项主要运营成本构成：支付给发行商应用的流量获取成本，以及评估每日数十亿次广告竞价所需的技术基础设施费用。在程序化聚合和网络广告投放中，流量获取成本历史上占媒体总支出的
              55% 至 70%，平台只能留下净保留收入池。托管和数据基础设施开销是第二大成本项，因为 Cortex 机器学习平台要在 1.4 billion 日活用户范围内处理高频实时竞价事件。由于初步公开发行摘要未披露详细
              GAAP 毛利率和营业利润项目，准确毛利率仍是核心尽调缺口。企业销售周期、销售代表生产率以及效果游戏客户的获客成本回收期等销售效率代理指标同样未公开，因此要全面评估单位经济性，必须直接取得经审计的 S-1
              财务披露。
