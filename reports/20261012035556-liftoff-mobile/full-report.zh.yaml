    approximationNotes: 定位分数是基于公开报告对 SDK 覆盖、日活用户规模和机器学习定向能力的定性综合。
    claimRefs:
      - CP001
      - CP004
      - CP007
      - CP015
  - id: FI001
    title: Liftoff 收入转化与成本结构桥
    type: waterfall
    summary: 示意性瀑布桥，展示平台总收入如何根据广告科技行业成本基准转化为净贡献。
    data:
      items:
        - label: 报告的 TTM 总收入（2026 年 3 月）
