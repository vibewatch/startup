  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现机制
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile 运营服务全球移动应用经济的综合双边市场。平台由 Blackstone 控制下的 Liftoff 与 Vungle 于 2021
              年合并形成，把需求侧用户获取能力与供给侧广告变现、聚合软件结合起来。需求侧，Liftoff 借助 Cortex
              的机器学习优化，帮助移动应用开发者和效果营销客户识别并获取游戏、社交媒体、金融和娱乐领域的高生命周期价值用户。收入主要来自动态单次安装成本（CPI）和单次行动成本（CPA）商业安排下的程序化效果竞价。供给侧，Vungle
              将软件开发工具包直接嵌入移动应用，让发行商靠应用内视频、可玩广告格式和自动广告交易聚合变现广告库存。Vungle
              按有效千次展示成本（eCPM）从广告展示总量中收取有效分成费率，形成平台收入。虽然正式合同规定了标准的分层计费结构，实际净收入仍会随实时竞价交易动态和平台流量获取成本波动。
