      - number: '4.2'
        title: 财务进展与运营规模
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile 在上市前已展现出较大的商业规模：截至 2026 年 3 月 31 日的 12 个月收入为 $741 million。相比初始 S-1 申报中截至 2025 年 9 月 30
              日期间披露的 $634 million TTM 收入。与前一申报期相比，收入增速加快，年化增长率约为 16.9%。业务收入的持续性来自广泛分发，其自有 SDK 已集成到全球超过 140,000
              个移动应用。该网络覆盖美洲、APAC 和 EMEA 约 1.4 billion 日活用户，为自动化活动优化提供所需的算法训练数据。商业客户基础包括全球超过 1,000
              名活跃营销客户。不过，收入集中度仍高度暴露于移动游戏工作室，而这些客户持续面临 ATT 后的追踪限制以及来自平台龙头 AppLovin 的激烈广告支出竞争。
