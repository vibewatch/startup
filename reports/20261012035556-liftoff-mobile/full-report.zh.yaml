        - 机器学习 Cortex 引擎驱动 1,000+ 家全球广告主的定向获客和变现。
        - 持续的平台隐私限制（Apple ATT 和 Google Sandbox）限制归因精度和竞价效率。
        - 第三方客户验证安装后留存和变现优于 Unity 与 ironSource。
    notes: 基于公开发行文件、行业可比公司和广告科技竞争格局，评估核心投资论点与结构性风险。
