      - number: '7.4'
        title: 依赖、缓释措施与论点失效触发因素
        blocks:
          - type: paragraph
            body: >-
              Liftoff 仍依赖平台所有者提供数据访问、广告主贡献交易量、供给合作伙伴提供媒体库存，并依赖 Blackstone 进行控制型公司治理。2026 年 6 月 IPO
              缓解了一项资产负债表压力：InvestGame 报道称，公司计划将约 $413.8 million 募资用于偿还 2032 年到期定期贷款下的债务。业务组合多元化也是一个可见信号，据报道 2026
              年第一季度广告主收入略高于一半来自游戏以外，但这两点都不能证明隐私、模型或交易对手控制已经成熟。因此，论点失效触发因素应包括广告主持续收缩、留存恶化、重大归因损失、模型或基础设施反复失效、不利法律裁定，或损害少数股东利益的治理行动。
