              - CV007
              - CV008
      - number: '8.3'
        title: 情景分析：乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              我们的估值情景框架以 Liftoff Mobile $634 million 基准收入和降债后的资本结构为锚，模拟三条不同的未来 12 个月运营路径。基准情景（概率 55%）假设收入每年复合增长 12% 至
              15%，达到 $710 million 至 $730 million；随着偿还 $414 million 债务带来的利息节省兑现，调整后 EBITDA 利润率保持在 20% 至 22%。这一路径支持 $3.80
              billion 至 $4.40 billion 的股权估值区间，对应 5.5x 至 6.0x 倍数。乐观情景（概率 25%）假设非游戏电商扩张和 Cortex AI 优化推动收入同比加速至 25%，对应 7.0x
              至 8.0x 倍数（$5.60 billion 至 $6.40 billion）。相反，悲观情景（概率 20%）评估在 AppLovin 竞争加剧、平台隐私约束增加和发起人减持压力下，倍数大幅压缩至 3.5x 至
              4.2x（$2.30 billion 至 $2.80 billion）。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV008
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV009
              - CV010
      - number: '8.4'
        title: 可比同行、尽调要求与论点失效
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile 的公开市场同行以 AppLovin 为锚，Caplight 认为两者商业模式嵌入相似度为 91%，更广泛的广告科技同行还包括 Unity Software 和
              InMobi。AppLovin 凭借更高的软件平台利润率和第一方游戏资产享有更高公开市场倍数，但 Liftoff 的独立定位为寻求无利益冲突变现的发行商提供了替代方案。后续季度的重点尽调包括核实传统 Vungle
              交易所与 DSP 竞价器之间拆分后的贡献利润率，以及跟踪 IPO 后广告主留存和用户群扩张率。会把我们的立场降为回避的明确论点失效触发因素包括核心收入增速连续两个季度降至 5% 以下、失去一级游戏 SDK
              集成，或发起人大规模且无纪律减持导致二级市场流动性失稳。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV012
              - CV014
      - number: '8.5'
        title: 展示
        blocks:
          - type: callout
            title: 审慎立场：跟踪 IPO 后执行情况
            body: Liftoff Mobile 上市带来了有价值的透明度和资产负债表去杠杆，但 AppLovin 持续施加竞争压力、分部利润率细节仍未解决，因此建议保持纪律性跟踪。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV008
          - type: callout
            title: 估值重置与发起人持股悬置
            body: $3.83 billion 市值标志着私募市场估值与公开股权现实之间完成了必要校准；必须持续监测 Blackstone 的多数持股和发起人减持。
            calloutType: risk
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV012
