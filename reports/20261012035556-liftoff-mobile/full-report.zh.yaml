      - number: '3.2'
        title: 平台能力与算法差异化
        blocks:
          - type: paragraph
            body: >-
              移动用户获取的差异化重点已从手动活动优化和宽泛人口定向，转向能够实时评估用户生命周期价值的预测式机器学习模型。Liftoff Mobile 的自研 Cortex
              系统用机器学习算法识别高参与倾向、可能完成可变现应用内行为的用户，优化效果营销活动的广告支出回报。同时，平台整合创意自动化工具，大规模测试和投放可玩及互动视频广告格式。尽管具备这些能力，行业龙头 AppLovin
              仍通过把 AXON 引擎直接连接 MAX 聚合平台，取得了显著广告效率提升；这让它能观察高频跨网络竞价信号，而没有同等发行商集成深度的独立 DSP 很难复制。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
