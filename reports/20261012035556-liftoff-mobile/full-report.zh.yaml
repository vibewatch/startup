          - type: paragraph
            body: >-
              Cortex 模型、基础设施或竞价错误可能削弱转化结果和客户信任，使技术质量成为具有经济实质的因素，而不只是服务水平问题。截至 2025 年 9 月，平台报告的规模——超过 140,000 个集成应用、约 1.4
              billion 日活用户和超过 1,000 名营销客户——放大了控制失效的后果，但不能证明其具备故障韧性。财务报告也需谨慎解读：Clarifo
              表示，主责方与代理方判断会影响收入和成本可比性，而对或有支付负债进行公允价值重估可能造成非现金收益波动。这些是会计风险，不等同于现金消耗；投资判断时应将其与经营现金表现分开。
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
