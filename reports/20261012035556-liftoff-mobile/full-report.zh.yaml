  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 从成立至 2026 年的基础建设、融资、并购、监管和上市里程碑时间线。
    data:
      items:
        - label: 在 Redwood City 创立
          timestamp: '2012-01-01'
          detail: Liftoff 在硅谷创立，定位为移动应用营销和用户获客技术平台。
        - label: 私募股权收购与 Vungle 合并
          timestamp: '2021-10-01'
          detail: Blackstone 主导旗下 Liftoff 与 Vungle 合并，形成统一的广告科技引擎。
        - label: Cortex AI 引擎上线
          timestamp: '2023-01-01'
          detail: 将专有 Cortex 机器学习引擎用于需求侧获客和广告创意优化。
        - label: General Atlantic 少数股权投资
          timestamp: '2025-06-01'
          detail: General Atlantic 收购 Liftoff Mobile 少数股权，建立 $4.3B 的私募估值。
        - label: 首次向 SEC 提交 S-1 IPO 文件
          timestamp: '2026-01-13'
          detail: 向 SEC 提交注册声明，计划按 $5.5B 目标估值募集最高 $711M 至 $800M。
        - label: IPO 不利延期与撤回
          timestamp: '2026-02-17'
          detail: 在软件估值普遍收缩、市场波动加剧之际，推迟并正式撤回首次 IPO 注册。
        - label: 向 SEC 重新提交修订版 S-1
          timestamp: '2026-04-17'
          detail: 向 SEC 重新提交注册声明，预计发行规模约 $700M，并披露 CY2025 收入为 $686M。
        - label: 纳斯达克 IPO 定价与交易首日
          timestamp: '2026-06-04'
          detail: 在纳斯达克以每股 $23 为 19.0M 股定价（代码 LFTO），按 $3.83B 市值募集 $437M。
        - label: 首次发布 2026 年第二季度业绩
          timestamp: '2026-08-12'
          detail: 报告 Q2 FY26 收入 $220M（同比增长 35%），调整后 EBITDA 为 $132M，并将全年收入指引上调至 $870M-$880M。
