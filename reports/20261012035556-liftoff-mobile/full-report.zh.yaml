  - id: FV001
    title: Liftoff Mobile 估值与建议决策逻辑
    type: flow
    summary: 将市场规模、估值倍数重置、竞争风险与最终建议串联起来的逻辑决策流。
    claimRefs:
      - CV001
      - CV002
      - CV011
      - CV012
    data:
      nodes:
        - id: scale
          label: 双边市场规模（140k+ 个应用，1.4B 日活用户）
        - id: revenue
          label: LTM 规模（$634M 收入，1,000+ 家营销商）
        - id: reset
          label: IPO 估值重置（$23 / 股对应 $3.83B；LTM 的 6.0 倍）
        - id: balance
          label: 资产负债表去杠杆（偿还 $414M 债务）
        - id: risks
          label: 竞争逆风（AppLovin AI 领先、发起人抛售压力）
        - id: stance
          label: 最终立场：跟踪 / 6.0 倍倍数对应合理价值
      edges:
        - from: scale
          to: revenue
        - from: revenue
          to: reset
        - from: reset
          to: balance
        - from: balance
          to: risks
        - from: risks
          to: stance
    approximationNotes: 流程图展示引导投资建议的定性分析依赖关系。
