  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、立场与建议
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile 带着已验证的双边移动广告科技网络进入公开股票市场，连接超过 140,000 个集成 SDK 的应用和超过 1,000
              名全球广告主。我们的基本投资建议是持续跟踪，信心水平中等、风险评级中等，估值判断为合理。核心论点建立在 Liftoff 可防守的移动用户获取与广告变现覆盖之上，由自有 Cortex 机器学习引擎和利用 IPO
              募资计划偿还 $414 million 债务、加速降低资产负债表杠杆共同驱动。但反方论点仍然有力：广告科技巨头 AppLovin 在游戏领域拥有更深的平台和归因优势，ATT
              后的隐私摩擦也持续挤压更广泛软件生态中的程序化广告利润率。按 IPO 后隐含 $3.83 billion 估值，公司交易于约 6.0x TTM 收入，风险回报较为均衡，更适合纪律性观察，而非立即激进买入。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV011
