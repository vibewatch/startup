              - CV004
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV011
              - CV012
      - number: '8.2'
        title: 融资历史与 IPO 估值背景
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile 于 2026 年 6 月 3 日登陆公开市场，结束了动荡的上市轨迹，也凸显私募估值与公开市场之间不断变化的估值动态。此前，公司在软件市场严重退潮期间推迟并正式撤回 2026 年 2
              月的发行，随后恢复注册，以 $23.00 发行 19 million 股，获得 $437 million 总额。发行价虽比修订后的 $20.00 至 $22.00 目标区间高 $1.00，但最终 $3.83
              billion 估值较 2026 年 1 月 S-1 申报寻求的 $30.00 上限折价 23%，也比 General Atlantic 少数股权投资后确定的 2025 年 $4.3 billion 私募估值低约
              11%。按 $634 million TTM 收入计算，公司估值约为 6.0x；这一倍数重置反映机构对广告科技周期性和发起人持股集中的审慎态度，因为 Blackstone 仍保持多数控制，General
              Atlantic 持有少数股权。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
