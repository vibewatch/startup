      - number: '4.3'
        title: Cost Structure and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile's cost structure is defined by two primary operational components: traffic acquisition
              costs paid to publisher applications and technical infrastructure expenses required to evaluate billions
              of daily ad auctions. In programmatic mediation and network ad delivery, traffic acquisition costs
              historically consume between 55% and 70% of gross media spend, leaving the platform with net retained
              revenue pools. Hosting and data infrastructure overhead constitute the next largest cost bucket, as the
              Cortex machine learning platform processes high-frequency real-time bidding events across 1.4 billion
              daily active users. Because detailed GAAP gross margin and operating profit line items were withheld from
              preliminary public offering summaries, precise gross margins remain a central diligence gap. Key sales
              efficiency proxies, including enterprise sales cycles, rep productivity, and customer acquisition cost
              payback periods across performance gaming accounts, are similarly private, necessitating direct access to
              audited S-1 financial disclosures for comprehensive unit economic underwriting.
