      - number: '2.3'
        title: Buyer Segmentation, Budget Dynamics, and Multi-Homing Behavior
        blocks:
          - type: paragraph
            body: >-
              Procurement dynamics across mobile adtech reflect distinct operational priorities between gaming studios
              and enterprise non-gaming brands. Mobile gaming studios represent Liftoff historical anchor clientele,
              characterized by performance marketing teams with strict daily Return on Ad Spend (ROAS) mandates and
              automated campaign adjustment workflows. These buyers allocate budgets based almost exclusively on
              measurable cost-per-install (CPI) and post-install lifetime value metrics. In contrast, non-gaming
              developers across fintech, e-commerce, and subscription media evaluate programmatic platforms on blended
              customer acquisition cost (CAC) and sustained cohort retention. A defining operational reality across both
              buyer groups is extensive multi-homing: mobile marketers routinely deploy three to five DSPs and ad
              networks concurrently, shifting spending dynamically in real time toward platforms demonstrating superior
              algorithmic targeting efficiency.
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: Growth Drivers, Platform Privacy Headwinds, and Strategic Constraints
        blocks:
          - type: paragraph
            body: >-
              The expansion of the mobile adtech market is propelled by structural tailwinds, including expanding
              consumer engagement on smartphones, robust growth across emerging international markets like Asia-Pacific,
              and the maturation of predictive artificial intelligence in automated bidding. However, significant
              systemic adoption constraints balance these growth drivers. Most critically, platform-level privacy policy
              changes—including Apple App Tracking Transparency (ATT) framework and Google phased Privacy Sandbox
              rollout—have degraded deterministic identifier availability. This degradation impairs conventional
              user-level tracking, elevating media procurement costs and creating a steep technological arms race in
              machine-learning-driven contextual attribution. In addition, Liftoff exclusive specialization in mobile
              in-app environments creates channel concentration risk, leaving the company without exposure to
              high-growth digital channels such as Connected TV (CTV) and retail media networks.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Platform Privacy Headwinds and Targeting Degradation
            body: >-
              Apple App Tracking Transparency (ATT) framework and Google staged Privacy Sandbox rollout structurally
              diminish the availability of user-level identifiers. Mobile-only DSPs face heightened algorithmic R&D
              requirements to sustain client return on ad spend in an aggregated, privacy-constrained environment.
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
          - type: callout
            title: Walled-Garden Concentration vs. Independent AdTech Viability
            body: >-
              While closed walled gardens capture the vast majority of digital ad budgets, independent app developers
              increasingly depend on open programmatic platforms to acquire high-lifetime-value users without
              platform-specific lock-in, underpinning resilient demand for neutral platforms.
            calloutType: insight
            claimRefs:
              - CM001
              - CM008
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape & Market Positioning
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile operates in a crowded and highly concentrated mobile advertising technology market,
              competing directly against large-scale ad networks and mediation platforms including AppLovin, Unity, and
              ironSource for mobile app developer acquisition and monetization budgets. While mega-cap walled gardens
              such as Google AdMob and Meta Audience Network capture the majority of global ad spend across consumer
              surfaces, independent app developers rely heavily on specialized programmatic demand-side platforms and
              mediation engines to drive targeted post-install user engagement. Following its combination with Vungle
              under private equity sponsor Blackstone in 2021, Liftoff Mobile established global scale, deploying its
              software development kit across more than 140,000 mobile applications and connecting to roughly 1.4
              billion daily active users worldwide across gaming, social media, finance, and entertainment. However,
              AppLovin has widened its lead in mobile performance marketing through its proprietary AXON 2.0 machine
              learning engine, creating substantial competitive pressure across programmatic developer spend.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
