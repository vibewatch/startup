        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Haircut vs. Public Peers
            body: >-
              Liftoff Mobile's valuation contracted from its $4.3 billion private mark and $5.5 billion initial filing
              ceiling to a $3.83 billion IPO valuation and subsequently ~ $2.6 billion market cap, reflecting broader
              market scrutiny of mid-tier adtech relative to market leader AppLovin.
            calloutType: risk
            claimRefs:
              - CP007
              - CP010
              - CP011
          - type: callout
            title: SDK Footprint as Defensive Moat
            body: >-
              With SDK integration across more than 140,000 apps reaching 1.4 billion daily active users, Liftoff Mobile
              maintains substantial data gravity and supply access, insulating it from commoditization by lightweight
              DSP aggregators.
            calloutType: insight
            claimRefs:
