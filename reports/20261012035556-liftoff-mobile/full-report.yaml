      - number: '4.4'
        title: Capital Adequacy, Forward Runway, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile significantly bolstered its balance sheet through its June 2026 initial public offering,
              raising $437 million in gross proceeds by issuing 19 million ordinary shares priced at $23 per share on
              the NASDAQ exchange. Pricing above the marketed $20 to $22 range demonstrated solid institutional
              appetite, even as the resulting $3.83 billion market capitalization cemented an 11% valuation haircut
              relative to General Atlantic's 2025 minority round mark of $4.3 billion. The capital infusion resolved
              critical balance sheet constraints, with S&P Global Ratings upgrading the company's credit profile in
              recognition of substantial debt paydown. Nonetheless, institutional underwriting remains constrained by
              unresolved information gaps. Key diligence requirements include verifying audited gross margins,
              clarifying post-IPO leverage ratios, and assessing AppLovin's aggressive AI-driven ad network share gains.
              While capital adequacy is secure for the medium term, long-term returns will hinge on Liftoff's ability to
              defend its take rates against dominant platform ecosystems.
