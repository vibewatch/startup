      - number: '3.2'
        title: Platform Capabilities & Algorithmic Differentiation
        blocks:
          - type: paragraph
            body: >-
              Differentiation in mobile user acquisition has shifted decisively from manual campaign optimization and
              broad demographic targeting toward predictive machine learning models capable of evaluating user lifetime
              value in real time. Liftoff Mobile's proprietary Cortex system uses machine learning algorithms to
              identify users with a high propensity to engage and complete monetizable in-app actions, optimizing return
              on ad spend across performance marketing campaigns. Concurrently, the platform integrates creative
              automation tools to test and deploy playable and interactive video ad formats at scale. Despite these
              capabilities, market incumbent AppLovin has achieved dramatic advertising efficiency gains by coupling its
              AXON engine directly with its MAX mediation platform, allowing it to observe high-frequency cross-network
              bidding signals that independent DSPs cannot easily replicate without equivalent publisher integration
              depth.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP015
          - type: table
