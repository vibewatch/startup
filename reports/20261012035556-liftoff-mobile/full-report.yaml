      - number: '5.2'
        title: Cortex Neural Network Engine and Programmatic Bidding
        blocks:
          - type: paragraph
            body: >-
              At the technical core of Liftoff Mobile's demand-side platform is Cortex, a proprietary machine learning
              and neural network engine designed for automated real-time bidding. Cortex evaluates incoming impression
              opportunities across mobile ad exchanges and predicts post-install user engagement, lifetime value, and
              return on ad spend. Rather than relying solely on surface-level device parameters or static heuristic bid
              rules, the neural network models complex non-linear relationships between contextual impression signals,
              creative attributes, and historical conversion outcomes. This predictive modeling allows advertisers to
              optimize programmatic user acquisition budgets dynamically toward users most likely to exhibit durable
              in-app retention and in-app purchase behavior, competing directly against peer algorithmic bidding engines
              in the independent ecosystem.
            claimRefs:
              - CE002
              - CE003
              - CE008
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE008
      - number: '5.3'
        title: SDK Distribution Footprint and Supply-Side Monetization
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile maintains widespread mobile developer distribution through its client software development
              kit integrations. As of September 30, 2025, Liftoff's lightweight SDK was integrated into more than
              140,000 mobile applications worldwide, reaching approximately 1.4 billion daily active users across the
              Americas, EMEA, and APAC regions. Subsequent equity research coverage from William Blair noted that this
              integration footprint expanded to over 167,000 applications by mid-2026. The client SDK manages local ad
              caching, high-definition video rendering, and interactive playable formats directly within host apps,
              minimizing latency and maximizing ad completion rates. On the publisher side, the Vungle supply-side
              platform provides programmatic auction execution and demand diversity, improving yield management for app
              developers.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE013
      - number: '5.4'
        title: Technical Differentiation, Platform Privacy, and Governance
        blocks:
          - type: paragraph
            body: >-
              The primary structural advantage of Liftoff Mobile's technology lies in its compounding data feedback
              loop: client SDK deployments generate granular engagement and contextual signals that continuously train
              the Cortex neural network engine, improving bid accuracy and client return on investment. However, this
              technical architecture operates under persistent external constraints. Mobile platform privacy frameworks,
              including Apple's App Tracking Transparency and evolving privacy restrictions on device identifiers,
              restrict cross-app behavioral tracking and demand sophisticated probabilistic attribution. Furthermore,
              while the company strengthened its liquidity profile and credit standing following its June 2026 initial
              public offering, independent technical validation of proprietary machine learning efficacy remains limited
              in public disclosures, necessitating focused technical due diligence.
            claimRefs:
              - CE008
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated Dual-Sided Scale and Neural Network Feedback Loop
            body: >-
              Liftoff Mobile's combination of a demand-side bidding platform and client SDKs embedded in over 140,000
              apps gives Cortex direct access to contextual and post-install engagement data, creating a
              self-reinforcing training feedback loop that independent DSPs without proprietary SDK footprint cannot
              easily replicate.
            calloutType: strength
            claimRefs:
              - CE001
              - CE005
              - CE008
          - type: callout
            title: OS-Level Identifier Depreciation and ATT Privacy Headwinds
            body: >-
              Ongoing mobile operating system restrictions, exemplified by Apple's App Tracking Transparency and
              evolving privacy restrictions on device identifiers, limit cross-app behavioral tracking and force
              increasing reliance on aggregated or probabilistic attribution, creating risk of model decay if privacy
              sandboxes restrict real-time telemetry.
            calloutType: risk
            claimRefs:
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation & Vertical Diversification
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile operates a dual-sided marketplace serving demand-side app marketers seeking profitable user
              acquisition and supply-side mobile app developers seeking automated in-app ad monetization. Historically
              centered on performance-driven mobile gaming studios, the company deliberately expanded into non-gaming
              app categories, including social media, financial services, and entertainment. By the nine months ended
              September 30, 2025, non-gaming categories generated slightly more than half of Core Advertising revenue.
              This vertical diversification insulates Liftoff from the volatile hit-driven release cycles typical of
              mobile game publishing. The customer base is geographically diverse, with more than 64% of nine-month 2025
              revenue originating outside the Americas across 60 countries. Demand-side marketers interact through
              industry-tailored Cortex Adapters that tune neural network bidding logic to vertical-specific conversion
              events, such as opening an account or completing an initial purchase.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU008
      - number: '6.2'
        title: Platform Adoption Scale & Key Account Trajectory
        blocks:
          - type: paragraph
            body: >-
              Platform adoption is anchored in the widespread distribution of Liftoff's software development kit, which
              originated in the Vungle asset acquired and merged under Blackstone sponsorship in 2021. As of September
              30, 2025, the SDK was integrated into over 140,000 mobile applications, establishing an addressable supply
              footprint of approximately 1.4 billion daily active users worldwide. This publisher reach enables Liftoff
              to service more than 1,000 active marketers across the Americas, APAC, and EMEA regions. High-value
              customer adoption has expanded steadily: accounts generating more than $100,000 in Core Advertising
              revenue grew from 287 in fiscal 2023 to 316 in fiscal 2024, and reached 362 accounts during the first nine
              months of fiscal 2025. This steady account progression demonstrates expanding enterprise wallet share
              across top-tier mobile growth teams.
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Customer Deployments, Proof Points & Integration Lifecycle
        blocks:
          - type: paragraph
            body: >-
              Customer workflows on Liftoff begin with publisher SDK integration or advertiser DSP campaign onboarding,
              followed by automated bid calibration under the Cortex machine learning engine. Cortex processes roughly
              21 times more telemetry data than legacy linear models and evaluates auction conditions four times more
              rapidly, driving higher prediction accuracy for customer ROAS objectives. In enterprise IT operations,
              partner proof from Cloudasta documents a successful Google Domain Transfer project consolidating Liftoff's
              enterprise infrastructure under a single tenant. For commercial adtech clients, independent research
              confirms that 87% of surveyed marketers are willing to increase ad budgets when KPIs beat targets by 10%,
              scaling to 100% willingness at 30% outperformance. While public S-1 filings redact individual brand
              contracts under commercial confidentiality rules, aggregate retention and cross-vertical deployments
              demonstrate widespread production reliance across global app categories.
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU003
              - CU007
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU004
              - CU007
              - CU010
      - number: '6.4'
        title: Retention Durability, Budget Expansion & Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Customer durability on the platform is demonstrated by a 124% trailing twelve-month Core Advertising Net
              Dollar Retention rate as of September 30, 2025, an increase from 121% in the prior period and 118% in
              2023. Logo retention among the platform's top 100 advertisers was 99% over the trailing twelve months,
              while top 100 publisher retention reached 100%. However, this growth engine carries significant structural
              concentration risk. Exactly 362 customers spending over $100,000 generated 98% of Core Advertising revenue
              in the first nine months of 2025, representing an average spend of approximately $1.35 million per
              enterprise account without public disclosure of top single-customer revenue shares. Liftoff's June 2026
              IPO on Nasdaq raised $437 million at a $3.83 billion valuation, providing capital to retire legacy
              acquisition debt; however, the company remains exposed to privacy policy changes by Apple and Google and
              faces intense competition from AppLovin.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Non-Gaming Expansion Creates Counter-Cyclical Insulation
            body: >-
              By capturing more than half of Core Advertising revenue from non-gaming verticals such as finance and
              social media, Liftoff has differentiated itself from gaming-concentrated peers and established greater
              revenue durability across advertising market cycles.
            calloutType: insight
            claimRefs:
              - CU001
              - CU007
          - type: callout
            title: 98% Concentration in 362 Accounts Amplifies Churn Vulnerability
            body: >-
              With 362 enterprise customers accounting for 98% of Core Advertising revenue and average spend exceeding
              $1.3 million, the loss of a small number of top performance marketers would materially impair revenue run
              rates.
            calloutType: risk
            claimRefs:
              - CU009
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and investment consequence
        blocks:
          - type: paragraph
            body: >-
              The central investment risk is not one isolated event but a linked operating chain: platform owners can
              restrict identifiers and attribution, weaker signals can reduce campaign performance, and advertisers can
              then reduce transaction volume. Clarifo identifies advertiser retention, campaign performance, mobile
              media spend, model accuracy, and privacy rules as direct dependencies, while Reuters reports that the
              sector is already adapting to tighter platform-owner privacy restrictions. Core Advertising represents 85%
              of revenue in Clarifo's breakdown, so deterioration in that engine would not be contained to a peripheral
              product. These disclosures support a high residual-risk assessment until cohort retention,
              model-degradation, and platform-level ROAS evidence is reviewed.
            claimRefs:
              - CR001
              - CR007
              - CR008
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR007
              - CR011
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and governance exposure
        blocks:
          - type: paragraph
            body: >-
              Privacy and app-store policy exposure is global because Liftoff depends on data access controlled by
              mobile platform owners and operates across the Americas, APAC, and EMEA. Public evidence establishes the
              mechanism of risk but does not identify a complete enforcement, litigation, or security-incident history;
              the absence of such records in this assigned evidence set is not evidence that none exists. Governance
              adds a separate minority-holder risk: InvestGame reports that Blackstone retained approximately 50.4% of
              voting power after the IPO, qualifying Liftoff as a Nasdaq controlled company. The legal register
              therefore treats privacy, controlled-company governance, and judgment-sensitive public reporting as
              monitorable exposures rather than claiming an unverified violation.
            claimRefs:
              - CR001
              - CR002
              - CR010
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR010
              - CR012
      - number: '7.3'
        title: Operational, model, and financial execution
        blocks:
          - type: paragraph
            body: >-
              Cortex model, infrastructure, or bidding errors can weaken conversion outcomes and customer trust, making
              technical quality economically material rather than merely a service-level concern. The platform's
              reported scale as of September 2025—more than 140,000 integrated apps, approximately 1.4 billion daily
              active users, and more than 1,000 marketers—widens the consequence of a control failure without proving
              outage resilience. Financial reporting also requires care: Clarifo says principal-versus-agent judgments
              affect revenue and cost comparability, while fair-value remeasurement of an earnout liability can create
              non-cash earnings volatility. These are accounting risks, not equivalent to cash burn, and should be
              separated from operating cash performance in underwriting.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR008
              - CR010
              - CR011
              - CR012
              - CR015
      - number: '7.4'
        title: Dependencies, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Liftoff remains dependent on platform owners for data access, advertisers for transaction volume, supply
              partners for media inventory, and Blackstone for controlled-company governance. The June 2026 IPO reduced
              one balance-sheet pressure: InvestGame reports an intended application of approximately $413.8 million of
              proceeds to debt under a term loan maturing in 2032. Business-mix diversification is another visible
              signal, with slightly more than half of first-quarter 2026 advertiser revenue reportedly coming from
              outside gaming, but neither fact demonstrates that privacy, model, or counterparty controls are mature.
              Thesis-break triggers should therefore include sustained advertiser contraction, worsening retention,
              material attribution loss, repeated model or infrastructure failures, adverse legal findings, or
              governance actions that disadvantage minority holders.
            claimRefs:
              - CR002
              - CR003
              - CR007
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR010
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The public record does not close incident and concentration diligence
            body: >-
              No assigned source provides a complete litigation, enforcement, security-incident, customer-concentration,
              publisher-concentration, or platform-exposure record. Those gaps require primary documents and management
              data rather than an assumption of no adverse history.
            calloutType: risk
            claimRefs:
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Stance, and Recommendation
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile enters the public equity markets with a verified dual-sided mobile adtech network
              connecting over 140,000 integrated SDK apps with more than 1,000 global advertisers. Our fundamental
              investment recommendation is track, accompanied by a medium confidence level, a medium risk rating, and a
              fair valuation stance. The primary thesis rests on Liftoff's defensible footprint in mobile user
              acquisition and ad monetization, driven by its proprietary Cortex machine-learning engine and accelerated
              balance sheet de-leveraging through $414 million in planned debt retirement from IPO proceeds. However,
              the anti-thesis remains substantial: adtech heavyweight AppLovin maintains deep platform and attribution
              advantages across gaming, while post-ATT privacy frictions continue to compress programmatic ad margins
              across the broader software ecosystem. At an implied post-IPO valuation of $3.83 billion, the company
              trades at approximately 6.0x trailing twelve-month revenue, reflecting a balanced risk-reward profile that
              warrants disciplined observation rather than immediate aggressive buying.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV011
              - CV012
      - number: '8.2'
        title: Financing History and IPO Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile's public market debut on June 3, 2026, concluded a volatile listing trajectory that
              highlights shifting valuation dynamics between private equity marks and public markets. After postponing
              and formally withdrawing an earlier February 2026 offering amid a severe software market retreat, Liftoff
              revived its registration and priced 19 million shares at $23.00, generating $437 million in gross
              proceeds. Although pricing landed $1.00 above the revised $20.00 to $22.00 target range, the resulting
              $3.83 billion valuation represents a 23% haircut from the $30.00 ceiling sought in its January 2026 S-1
              filing and sits approximately 11% below its $4.3 billion 2025 private mark established after General
              Atlantic's minority investment. Valued at roughly 6.0x trailing twelve-month revenue of $634 million,
              Liftoff's multiple reset reflects institutional discipline regarding adtech cyclicality and sponsor
              ownership concentration, as Blackstone maintains majority control alongside General Atlantic's minority
              equity interest.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: 'Scenario Analysis: Bull, Base, and Bear Cases'
        blocks:
          - type: paragraph
            body: >-
              Our valuation scenario architecture models three distinct twelve-month operating paths anchored on Liftoff
              Mobile's $634 million baseline revenue and debt-reduced capital structure. In the base case (55%
              probability), Liftoff compounds revenue at 12% to 15% annually to reach $710 million to $730 million,
              maintaining adjusted EBITDA margins between 20% and 22% as interest savings from $414 million in debt
              retirement materialize. This trajectory supports an equity valuation range of $3.80 billion to $4.40
              billion at a 5.5x to 6.0x multiple. The bull case (25% probability) assumes revenue acceleration to 25%
              YoY via non-gaming e-commerce expansion and Cortex AI optimization, commanding a 7.0x to 8.0x multiple
              ($5.60 billion to $6.40 billion). Conversely, the bear case (20% probability) evaluates severe multiple
              compression to 3.5x to 4.2x ($2.30 billion to $2.80 billion) under intensifying AppLovin competition,
              additional platform privacy constraints, and sponsor selldown pressure.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV008
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV009
              - CV010
      - number: '8.4'
        title: Comparable Peers, Diligence Asks, and Thesis Breaks
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile's public market peer group is anchored by AppLovin, which Caplight identifies as holding a
              91% business-model embedding similarity, alongside broader adtech peers including Unity Software and
              InMobi. While AppLovin commands premium public multiples due to superior software platform margins and
              first-party gaming assets, Liftoff's independent positioning provides an alternative for publishers
              seeking non-conflicted monetization. Key diligence priorities for subsequent quarters center on verifying
              disaggregated contribution margins between the legacy Vungle exchange and DSP bidder, as well as tracking
              post-IPO advertiser retention and cohort expansion rates. Definitive thesis-break triggers that would
              downgrade our stance to avoid include two consecutive quarters of decelerating core revenue growth below
              5%, loss of tier-1 gaming SDK integrations, or aggressive undisciplined sponsor block sales that
              destabilize secondary market liquidity.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV012
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Prudent Stance: Monitoring Post-IPO Execution'
            body: >-
              Liftoff Mobile's public debut provides welcome transparency and balance sheet de-leveraging, but ongoing
              competitive pressure from AppLovin and unresolved segment margin detail warrant a disciplined track
              recommendation.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV008
          - type: callout
            title: Valuation Reset and Sponsor Ownership Overhang
            body: >-
              A $3.83 billion market cap marks a necessary reconciliation between private-market marks and public equity
              realities; ongoing monitoring of Blackstone's majority ownership and sponsor selldowns is essential.
            calloutType: risk
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV012
