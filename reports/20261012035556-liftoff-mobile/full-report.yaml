      - number: '1.2'
        title: Capitalization, Financing History, and Valuation
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile completed an initial public offering on the Nasdaq Global Select Market under ticker symbol
              LFTO on June 4, 2026, offering 19.0 million shares priced at $23.00 per share to raise $437 million in
              gross proceeds. The offering priced above the revised marketing range of $20.00 to $22.00 per share,
              establishing an initial public market capitalization of $3.83 billion based on outstanding common shares
              disclosed in its prospectus. This valuation represented an approximate 11% discount to the $4.3 billion
              private valuation set when General Atlantic acquired a minority stake in 2025 alongside majority owner
              Blackstone. The successful June debut followed a volatile capital markets journey in early 2026: Liftoff
              filed confidentially in late 2025 and publicly in January 2026 targeting up to $711 million at a $5.5
              billion market capitalization, but withdrew the filing in February 2026 amid a sector-wide software
              selloff before refiling in April 2026.
