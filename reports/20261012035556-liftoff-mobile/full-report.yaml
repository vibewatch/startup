      - number: '3.3'
        title: Pricing Models, Mediation Dynamics & Switching Costs
        blocks:
          - type: paragraph
            body: >-
              Commercial terms across the mobile app marketing ecosystem typically operate on performance-based
              cost-per-install (CPI) or cost-per-action (CPA) models for advertisers, while publisher monetization
              relies on programmatic auction revenue shares expressed through effective cost-per-mille (eCPM) yields.
              Liftoff Mobile provides hybrid engagement structures for enterprise marketers, blending managed
              performance spend with software analytics tools. However, switching costs for app developers are
              structurally low on the demand side, as performance marketers regularly multi-home across multiple DSPs
              and ad networks to source incremental user volume and minimize blended acquisition costs. Conversely, on
              the supply side, software development kit integration into mobile game code bases creates moderate
              operational inertia, though top gaming studios routinely integrate multiple mediator adapters to maintain
              yield competition across competing demand partners.
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP005
              - CP012
              - CP013
      - number: '3.4'
        title: Moat Durability, Platform Shifts & Disruption Risks
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile's competitive moat is anchored by its dual-sided marketplace network effects, proprietary
              historical conversion dataset, and embedded SDK footprint across 140,000+ mobile applications.
              Nonetheless, durability faces substantial strategic and structural headwinds. The broader mobile adtech
              sector continues to adapt to restrictive operating system privacy frameworks, including Apple's App
              Tracking Transparency and evolving Google Privacy Sandbox policies, which restrict cross-app device
              identifiers and compel ad networks to invest heavily in probabilistic modeling. Furthermore, enterprise
              sentiment regarding software and adtech business models grew increasingly cautious in early 2026, when
              widespread concerns over generative AI disruption triggered an $800 billion market cap selloff across the
              S&P 500 software and services index, prompting Liftoff Mobile to postpone its initial February 2026
              listing before completing a revised $437 million initial public offering in June 2026 at a moderated $3.83
              billion valuation.
            claimRefs:
              - CP004
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
