  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Channel Demarcation
        blocks:
          - type: paragraph
            body: >-
              The mobile advertising technology sector occupies an essential infrastructure role within the global
              digital economy, delivering automated software solutions that enable mobile app developers and commercial
              enterprises to acquire users, measure marketing efficiency, and monetize digital inventory. Liftoff Mobile
              operates specifically across programmatic mobile performance marketing and in-app monetization, having
              broadened its technical footprint through the 2021 merger with Vungle. The addressable category
              encompasses automated audience targeting, dynamic creative optimization, demand-side bidding, and
              developer supply-side ad serving across gaming, social media, entertainment, and e-commerce verticals.
              Conversely, the market excludes traditional desktop display networks, linear television advertising, print
              media, and closed search ecosystems. Furthermore, direct walled-garden inventory on platforms such as Meta
              and Google Search represents a distinct substitute rather than part of the independent programmatic
              market, as closed ecosystems operate proprietary auction protocols and closed attribution mechanisms.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and Obtainable Market Layers'
        blocks:
          - type: paragraph
            body: >-
              Evaluating the market opportunity for Liftoff Mobile requires establishing disciplined sizing layers that
              differentiate total digital ad budgets from addressable in-app programmatic spend. Independent industry
              analysis projects global mobile ad spending to expand at a compound annual growth rate of approximately
              14%, advancing toward an aggregate volume exceeding $600 billion by 2028. Within this broad macroeconomic
              universe, the mobile demand-side platform segment represents approximately $350 billion in transacted
              media value, while the in-app video advertising network market exceeds $100 billion. The Serviceable
              Addressable Market (SAM) for independent, non-walled-garden performance adtech is constrained to
              approximately $28 billion, reflecting spend from developers actively seeking third-party alternatives to
              platform duopolies. Liftoff currently commands a Serviceable Obtainable Market (SOM) of roughly $2.5
              billion across its network of over 140,000 integrated SDK apps and 1.4 billion global daily active users,
              though market expansion requires ongoing market-share gains against entrenched competitors.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
