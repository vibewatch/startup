chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile operates an AI-powered performance marketing and monetization software platform serving
              mobile application advertisers and publishers across gaming, social media, finance, and entertainment
              verticals. Founded originally in 2011 or 2012 in Redwood City, California, the company reached its current
              operational structure through the 2021 merger of Liftoff and Vungle orchestrated by majority owner
              Blackstone. The platform centers on Cortex, a proprietary machine-learning engine that unifies user
              acquisition targeting, creative automation, and in-app monetization across an integrated software
              development kit footprint connecting to approximately 1.4 billion daily active users worldwide. Revenue is
              generated through programmatic advertising budgets and publisher monetization fees, operating primarily as
              a capital-light dual-sided ad marketplace.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
