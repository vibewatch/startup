  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Mechanics
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile operates a comprehensive, dual-sided marketplace serving the global mobile application
              economy. Formed through the 2021 merger of Liftoff and Vungle under Blackstone ownership, the platform
              unites demand-side user acquisition capabilities with supply-side ad monetization and mediation software.
              On the demand side, Liftoff provides mobile app developers and performance marketers with machine learning
              optimization through its Cortex system to identify and acquire high-lifetime-value users across gaming,
              social media, finance, and entertainment verticals. Revenue is generated primarily through programmatic
              performance bidding on dynamic cost-per-install (CPI) and cost-per-action (CPA) commercial arrangements.
              On the supply side, Vungle delivers software development kits directly embedded in mobile apps, enabling
              publishers to monetize ad inventory via in-app video, playable ad formats, and automated ad exchange
              mediation. Vungle generates platform revenue through an effective revenue-share take rate on gross ad
              impressions, monetized on an effective cost-per-thousand (eCPM) basis. While official contracts stipulate
              standard volume-tiered fee structures, realized net revenue fluctuates with real-time bidding exchange
              dynamics and platform traffic acquisition costs.
            claimRefs:
