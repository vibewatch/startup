  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Architecture and Product Scope
        blocks:
          - type: paragraph
            body: >-
              Liftoff Mobile delivers a vertically integrated mobile growth platform that unifies user acquisition
              marketing with in-app ad monetization. Originally established as a performance marketing service and
              expanded through the 2021 merger with mobile video advertising network Vungle under Blackstone ownership,
              the platform serves over 1,000 mobile app marketers globally across gaming, social media, finance, and
              entertainment verticals. The core operational architecture bridges demand-side programmatic buying with
              supply-side ad serving, enabling mobile developers to manage user acquisition budgets and monetize
              publisher inventory through a cohesive technical interface. By operating across both sides of the digital
              ad marketplace, Liftoff captures end-to-end transaction telemetry that informs its bidding and ad delivery
              workflows.
            claimRefs:
