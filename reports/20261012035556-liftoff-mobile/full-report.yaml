            body: >-
              Liftoff Mobile demonstrated substantial commercial scale leading up to its public listing, reporting $741
              million in revenue for the twelve months ended March 31, 2026. This performance marks accelerating revenue
              expansion compared to the $634 million in trailing-twelve-month revenue reported for the period ended
