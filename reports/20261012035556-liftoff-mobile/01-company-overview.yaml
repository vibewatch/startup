callouts:
  - calloutType: "insight"
    title: "Public Market Pricing Reset vs. Private Valuation"
    body: "Liftoff Mobile's successful IPO at $23 per share landed at a $3.83 billion market capitalization, roughly 11% below its 2025 private valuation mark of $4.3 billion following General Atlantic's investment, and substantially lower than the $5.5 billion valuation sought in January 2026. This realistic pricing recalibration allowed the company to generate strong demand and price above its revised $20-$22 marketing range."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
  - calloutType: "risk"
    title: "Majority Ownership Concentration Under Blackstone"
    body: "Despite listing publicly on the Nasdaq, Blackstone retains majority equity ownership and voting control over Liftoff Mobile, with General Atlantic holding a material minority stake. Public minority shareholders face governance risks typical of sponsor-controlled entities, including potential divergence between private equity fund monetization priorities and long-term common shareholder returns."
    claimRefs:
      - "CO007"
      - "CO012"
