chapter:
  number: 1
  title: "Company Overview"
  summary: "Liftoff Mobile is an adtech provider offering AI-powered user acquisition and monetization software for mobile apps, formed via the 2021 merger of Liftoff and Vungle. Following an initial filing withdrawal in early 2026 amid a software market contraction, the company completed its Nasdaq IPO (ticker LFTO) in June 2026 at $23 per share, raising $437 million at a $3.83 billion valuation below its prior $4.3 billion private peak."
sections:
  - id: "identity-and-operating-model"
    title: "Corporate Identity and Business Model"
    body: "Liftoff Mobile operates an AI-powered performance marketing and monetization software platform serving mobile application advertisers and publishers across gaming, social media, finance, and entertainment verticals. Founded originally in 2011 or 2012 in Redwood City, California, the company reached its current operational structure through the 2021 merger of Liftoff and Vungle orchestrated by majority owner Blackstone. The platform centers on Cortex, a proprietary machine-learning engine that unifies user acquisition targeting, creative automation, and in-app monetization across an integrated software development kit footprint connecting to approximately 1.4 billion daily active users worldwide. Revenue is generated through programmatic advertising budgets and publisher monetization fees, operating primarily as a capital-light dual-sided ad marketplace."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
    figureRefs: []
  - id: "capitalization-and-ipo-timeline"
    title: "Capitalization, Financing History, and Valuation"
    body: "Liftoff Mobile completed an initial public offering on the Nasdaq Global Select Market under ticker symbol LFTO on June 4, 2026, offering 19.0 million shares priced at $23.00 per share to raise $437 million in gross proceeds. The offering priced above the revised marketing range of $20.00 to $22.00 per share, establishing an initial public market capitalization of $3.83 billion based on outstanding common shares disclosed in its prospectus. This valuation represented an approximate 11% discount to the $4.3 billion private valuation set when General Atlantic acquired a minority stake in 2025 alongside majority owner Blackstone. The successful June debut followed a volatile capital markets journey in early 2026: Liftoff filed confidentially in late 2025 and publicly in January 2026 targeting up to $711 million at a $5.5 billion market capitalization, but withdrew the filing in February 2026 amid a sector-wide software selloff before refiling in April 2026."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
    tableRefs: []
    figureRefs:
      - "FO001"
  - id: "governance-leadership-and-ownership"
    title: "Governance, Leadership Structure, and Diligence Inquiries"
    body: "Executive leadership is directed by Chief Executive Officer Jeremy Bondy alongside President and Chief Financial Officer Tarek Kutrieh, who together steer post-merger integration, Cortex machine learning investments, and public quarterly capital allocation. Ownership remains concentrated under private equity sponsor Blackstone as majority equity holder, with growth equity firm General Atlantic holding a significant minority equity position following their recapitalizations prior to the IPO. Early institutional venture investors included Baseline Ventures, Core Ventures Group, Harrison Metal Capital, The Cambria Group, and The Ropart Asset Management Funds, although individual shareholder ownership percentages post-IPO remain private. Continued reliance on key executive leadership and concentrated private equity control require ongoing monitoring as the company balances margin expansion with competitive pressure from scaled peers like AppLovin."
    claimRefs:
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO002"
      - "TO003"
    figureRefs: []
