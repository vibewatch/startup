  - id: TV001
    title: Recommendation Summary and Investment Stance
    columns:
      - Dimension
      - Assessment
      - Evidence / Driver
      - Decision Implication
    rows:
      - - Recommendation
        - track
        - Dual-sided platform scale with 140,000+ SDK integrations balanced against competitive pressure from AppLovin
        - Maintain monitoring position without aggressive capital deployment pending post-IPO quarterly execution
      - - Confidence
        - medium
        - >-
          Verified June 2026 IPO pricing and LTM revenue disclosed, but product-line unit economics and EBITDA margins
          remain undisclosed
        - Defer high-conviction buy until segment margins and retention cohorts are disclosed in quarterly SEC filings
      - - Risk Rating
        - medium
        - >-
          Public market multiple reset and platform privacy dependencies (ATT/Privacy Sandbox) offset by debt reduction
          from IPO proceeds
        - Underwrite downside protection to a 15-20% multiple contraction scenario
      - - Valuation Stance
        - fair
        - Priced at $3.83B (~6.0x LTM revenue of $634M), representing an 11% haircut from its $4.3B 2025 private mark
        - Current entry multiple reflects reasonable risk-adjusted pricing relative to scaled peer AppLovin
    notes: >-
      Summary of investment stance following Liftoff Mobile's June 2026 public listing; incorporates disclosed IPO
      prospectus pricing and historical revenue data.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
  - id: TV002
    title: Core Investment Thesis and Anti-Thesis Analysis
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counterargument
      - What Would Change The View
    rows:
      - - Platform Scale & Network Effects
        - >-
          Durable dual-sided marketplace with SDK installed in over 140,000 apps reaching 1.4B DAUs creates programmatic
          inventory access.
        - AppLovin's AXON engine holds stronger attribution and data feedback loops across top-grossing gaming titles.
        - >-
          Sustained market share gains in non-gaming e-commerce and fintech verticals with documented ROAS
          outperformance.
      - - Valuation & Multiple Reset
        - >-
          Public listing at $3.83B (~6.0x revenue) compresses private-market froth ($4.3B private mark) into a
          defensible entry valuation.
        - >-
          A 23% share price discount from January 2026 expectations ($30 peak filing) signals persistent institutional
          valuation skepticism.
        - Two consecutive quarters of accelerating revenue growth (>20% YoY) with positive GAAP operating margins.
      - - Balance Sheet & Capital Structure
        - >-
          IPO raised $437M gross proceeds with approximately $414M dedicated to debt retirement, improving solvency and
          credit profile.
        - >-
          Past private equity LBO ownership (Blackstone/Vungle merger) leaves substantial sponsor concentration and
          potential secondary overhang.
        - S&P rating upgrades combined with orderly sponsor selldown without secondary price dislocation.
      - - AI Cortex Optimization
        - >-
          Machine learning Cortex engine drives targeted user acquisition and monetization across 1,000+ global
          advertisers.
        - >-
          Ongoing platform privacy restrictions (Apple ATT and Google Sandbox) constrain attribution precision and
          bidding efficiency.
        - >-
          Third-party customer verification of superior post-install retention and monetization relative to Unity and
          ironSource.
    notes: >-
      Evaluation of core investment thesis pillars versus structural risks based on public offering filings, industry
      comparables, and competitive adtech dynamics.
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV007
      - CV008
  - id: TV003
    title: Bull, Base, and Bear Twelve-Month Valuation Scenarios
    columns:
      - Scenario
      - Revenue Growth & Margin Assumptions
      - Implied Valuation / Multiple
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Revenue accelerates to 25% YoY growth reaching $800M+ run-rate; EBITDA margin expands to 28% via Cortex AI
          efficiencies.
        - $5.60B - $6.40B (7.0x - 8.0x revenue multiple)
        - Execution missteps in international expansion; retaliation or exclusive bidding deals by major ad networks.
        - 25% (requires sustained ad market recovery and non-gaming vertical expansion)
      - - Base Case
        - >-
          Revenue grows at 12-15% YoY reaching $710M-$730M; adjusted EBITDA margin stabilizes around 20-22% with debt
          service reduced.
        - $3.80B - $4.40B (5.5x - 6.0x revenue multiple)
        - AppLovin competitive dominance capping take-rates; continued soft gaming ad spend.
        - 55% (aligned with post-IPO consensus and current $3.83B valuation mark)
      - - Bear Case
        - >-
          Revenue growth stagnates below 5% YoY ($650M-$665M); privacy headwinds and competitive price cutting compress
          margins below 12%.
        - $2.30B - $2.80B (3.5x - 4.2x revenue multiple)
        - >-
          Further Apple/Google privacy restrictions; loss of tier-1 gaming publisher SDK integrations; sponsor block
          sales.
        - 20% (downside buffer provided by existing debt paydown and cash cushion)
    notes: >-
      Scenario analysis modeling 12-month post-IPO valuation ranges based on trailing revenue of $634M, public market
      multiples, and competitive headwinds.
