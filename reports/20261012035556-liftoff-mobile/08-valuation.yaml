company:
  name: Liftoff Mobile
chapter:
  number: 8
  title: Valuation
  summary: >-
    Liftoff Mobile completed its June 2026 initial public offering at $23.00 per share, raising $437 million at an
    implied valuation of $3.83 billion (~6.0x trailing revenue). We assign a track recommendation with fair valuation
    stance and medium risk, balancing substantial platform scale and debt retirement against persistent competitive
    headwinds from AppLovin.
sections:
  - id: investment-thesis-and-recommendation
    title: Investment Thesis, Stance, and Recommendation
    body: >-
      Liftoff Mobile enters the public equity markets with a verified dual-sided mobile adtech network connecting over
      140,000 integrated SDK apps with more than 1,000 global advertisers. Our fundamental investment recommendation is
      track, accompanied by a medium confidence level, a medium risk rating, and a fair valuation stance. The primary
      thesis rests on Liftoff's defensible footprint in mobile user acquisition and ad monetization, driven by its
      proprietary Cortex machine-learning engine and accelerated balance sheet de-leveraging through $414 million in
      planned debt retirement from IPO proceeds. However, the anti-thesis remains substantial: adtech heavyweight
      AppLovin maintains deep platform and attribution advantages across gaming, while post-ATT privacy frictions
      continue to compress programmatic ad margins across the broader software ecosystem. At an implied post-IPO
      valuation of $3.83 billion, the company trades at approximately 6.0x trailing twelve-month revenue, reflecting a
      balanced risk-reward profile that warrants disciplined observation rather than immediate aggressive buying.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV007
      - CV008
      - CV011
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: valuation-multiples-and-ipo-context
    title: Financing History and IPO Valuation Context
    body: >-
      Liftoff Mobile's public market debut on June 3, 2026, concluded a volatile listing trajectory that highlights
      shifting valuation dynamics between private equity marks and public markets. After postponing and formally
      withdrawing an earlier February 2026 offering amid a severe software market retreat, Liftoff revived its
      registration and priced 19 million shares at $23.00, generating $437 million in gross proceeds. Although pricing
      landed $1.00 above the revised $20.00 to $22.00 target range, the resulting $3.83 billion valuation represents a
      23% haircut from the $30.00 ceiling sought in its January 2026 S-1 filing and sits approximately 11% below its
      $4.3 billion 2025 private mark established after General Atlantic's minority investment. Valued at roughly 6.0x
      trailing twelve-month revenue of $634 million, Liftoff's multiple reset reflects institutional discipline
      regarding adtech cyclicality and sponsor ownership concentration, as Blackstone maintains majority control
      alongside General Atlantic's minority equity interest.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV010
      - CV012
      - CV013
    tableRefs:
      - TV002
  - id: scenario-analysis-and-returns
    title: 'Scenario Analysis: Bull, Base, and Bear Cases'
    body: >-
      Our valuation scenario architecture models three distinct twelve-month operating paths anchored on Liftoff
      Mobile's $634 million baseline revenue and debt-reduced capital structure. In the base case (55% probability),
      Liftoff compounds revenue at 12% to 15% annually to reach $710 million to $730 million, maintaining adjusted
      EBITDA margins between 20% and 22% as interest savings from $414 million in debt retirement materialize. This
      trajectory supports an equity valuation range of $3.80 billion to $4.40 billion at a 5.5x to 6.0x multiple. The
      bull case (25% probability) assumes revenue acceleration to 25% YoY via non-gaming e-commerce expansion and Cortex
      AI optimization, commanding a 7.0x to 8.0x multiple ($5.60 billion to $6.40 billion). Conversely, the bear case
      (20% probability) evaluates severe multiple compression to 3.5x to 4.2x ($2.30 billion to $2.80 billion) under
      intensifying AppLovin competition, additional platform privacy constraints, and sponsor selldown pressure.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV008
      - CV011
      - CV012
    tableRefs:
      - TV003
  - id: comparable-set-and-diligence-path
    title: Comparable Peers, Diligence Asks, and Thesis Breaks
    body: >-
      Liftoff Mobile's public market peer group is anchored by AppLovin, which Caplight identifies as holding a 91%
      business-model embedding similarity, alongside broader adtech peers including Unity Software and InMobi. While
      AppLovin commands premium public multiples due to superior software platform margins and first-party gaming
      assets, Liftoff's independent positioning provides an alternative for publishers seeking non-conflicted
      monetization. Key diligence priorities for subsequent quarters center on verifying disaggregated contribution
      margins between the legacy Vungle exchange and DSP bidder, as well as tracking post-IPO advertiser retention and
      cohort expansion rates. Definitive thesis-break triggers that would downgrade our stance to avoid include two
      consecutive quarters of decelerating core revenue growth below 5%, loss of tier-1 gaming SDK integrations, or
      aggressive undisciplined sponsor block sales that destabilize secondary market liquidity.
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV012
      - CV014
