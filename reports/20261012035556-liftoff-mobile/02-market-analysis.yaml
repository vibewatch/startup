callouts:
  - calloutType: risk
    title: Platform Privacy Headwinds and Targeting Degradation
    body: Apple App Tracking Transparency (ATT) framework and Google staged Privacy Sandbox rollout structurally diminish the availability of user-level identifiers. Mobile-only DSPs face heightened algorithmic R&D requirements to sustain client return on ad spend in an aggregated, privacy-constrained environment.
    claimRefs:
      - CM011
      - CM012
  - calloutType: insight
    title: Walled-Garden Concentration vs. Independent AdTech Viability
    body: While closed walled gardens capture the vast majority of digital ad budgets, independent app developers increasingly depend on open programmatic platforms to acquire high-lifetime-value users without platform-specific lock-in, underpinning resilient demand for neutral platforms.
    claimRefs:
      - CM001
      - CM008
