callouts:
  - calloutType: risk
    title: Down-Round Public Listing and Private Valuation Overhang
    body: Liftoff Mobile's $3.83 billion IPO market capitalization reflects an 11% decline from its $4.3 billion private valuation set by General Atlantic in 2025, and a 23% concession against its early 2026 $5+ billion pricing aspirations. While public listing restores liquidity, the valuation reset highlights persistent public market skepticism toward adtech multiples amidst intense competition from AppLovin.
    claimRefs:
      - CI002
      - CI008
      - CI009
      - CI011
  - calloutType: insight
    title: Balance Sheet De-leveraging via Primary IPO Proceeds
    body: The injection of $437 million in gross IPO proceeds provides Liftoff Mobile with critical balance-sheet flexibility to retire high-coupon private equity debt originated during Blackstone's 2021 LBO and Vungle combination, as reflected in S&P Global's credit upgrade.
    claimRefs:
      - CI001
      - CI010
