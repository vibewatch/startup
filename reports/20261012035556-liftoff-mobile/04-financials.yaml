company:
  name: Liftoff Mobile
chapter:
  number: 4
  title: Financials
  summary: Liftoff Mobile operates a dual-sided programmatic adtech platform booking $741 million in trailing twelve-month revenue through March 31, 2026, up from $634 million for the period ended September 30, 2025. In June 2026, the company completed a revived initial public offering on Nasdaq raising $437 million at a $3.83 billion valuation, executing an 11% valuation reset against its $4.3 billion private mark while securing essential liquidity to de-leverage balance sheet obligations.
sections:
  - id: revenue-streams-and-pricing-mechanisms
    title: Revenue Model and Monetization Mechanics
    body: Liftoff Mobile operates a comprehensive, dual-sided marketplace serving the global mobile application economy. Formed through the 2021 merger of Liftoff and Vungle under Blackstone ownership, the platform unites demand-side user acquisition capabilities with supply-side ad monetization and mediation software. On the demand side, Liftoff provides mobile app developers and performance marketers with machine learning optimization through its Cortex system to identify and acquire high-lifetime-value users across gaming, social media, finance, and entertainment verticals. Revenue is generated primarily through programmatic performance bidding on dynamic cost-per-install (CPI) and cost-per-action (CPA) commercial arrangements. On the supply side, Vungle delivers software development kits directly embedded in mobile apps, enabling publishers to monetize ad inventory via in-app video, playable ad formats, and automated ad exchange mediation. Vungle generates platform revenue through an effective revenue-share take rate on gross ad impressions, monetized on an effective cost-per-thousand (eCPM) basis. While official contracts stipulate standard volume-tiered fee structures, realized net revenue fluctuates with real-time bidding exchange dynamics and platform traffic acquisition costs.
    claimRefs:
      - CI001
      - CI003
      - CI005
      - CI006
      - CI007
    tableRefs:
      - TI001
      - TI002
  - id: financial-traction-and-scale
    title: Financial Traction and Operating Scale
    body: Liftoff Mobile demonstrated substantial commercial scale leading up to its public listing, reporting $741 million in revenue for the twelve months ended March 31, 2026. This performance marks accelerating revenue expansion compared to the $634 million in trailing-twelve-month revenue reported for the period ended September 30, 2025 in its initial S-1 filing, representing an annualized growth rate of approximately 16.9%. The business derives its revenue durability from significant distribution breadth, with its proprietary SDK integrated into more than 140,000 mobile applications worldwide. This footprint connects the platform to roughly 1.4 billion daily active users across the Americas, APAC, and EMEA regions, providing the algorithmic training data necessary to power automated campaign optimization. The commercial customer base encompasses over 1,000 active marketers globally. However, revenue concentration remains heavily exposed to mobile gaming studios, which face ongoing post-ATT tracking constraints and intense ad spend competition from platform leader AppLovin.
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI006
      - CI010
      - CI011
    figureRefs:
      - FI001
  - id: cost-structure-and-unit-economics
    title: Cost Structure and Unit Economics
    body: 'Liftoff Mobile''s cost structure is defined by two primary operational components: traffic acquisition costs paid to publisher applications and technical infrastructure expenses required to evaluate billions of daily ad auctions. In programmatic mediation and network ad delivery, traffic acquisition costs historically consume between 55% and 70% of gross media spend, leaving the platform with net retained revenue pools. Hosting and data infrastructure overhead constitute the next largest cost bucket, as the Cortex machine learning platform processes high-frequency real-time bidding events across 1.4 billion daily active users. Because detailed GAAP gross margin and operating profit line items were withheld from preliminary public offering summaries, precise gross margins remain a central diligence gap. Key sales efficiency proxies, including enterprise sales cycles, rep productivity, and customer acquisition cost payback periods across performance gaming accounts, are similarly private, necessitating direct access to audited S-1 financial disclosures for comprehensive unit economic underwriting.'
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI006
      - CI012
      - CI013
    tableRefs:
      - TI003
  - id: capital-adequacy-and-underwriting-verdict
    title: Capital Adequacy, Forward Runway, and Diligence Blockers
    body: Liftoff Mobile significantly bolstered its balance sheet through its June 2026 initial public offering, raising $437 million in gross proceeds by issuing 19 million ordinary shares priced at $23 per share on the NASDAQ exchange. Pricing above the marketed $20 to $22 range demonstrated solid institutional appetite, even as the resulting $3.83 billion market capitalization cemented an 11% valuation haircut relative to General Atlantic's 2025 minority round mark of $4.3 billion. The capital infusion resolved critical balance sheet constraints, with S&P Global Ratings upgrading the company's credit profile in recognition of substantial debt paydown. Nonetheless, institutional underwriting remains constrained by unresolved information gaps. Key diligence requirements include verifying audited gross margins, clarifying post-IPO leverage ratios, and assessing AppLovin's aggressive AI-driven ad network share gains. While capital adequacy is secure for the medium term, long-term returns will hinge on Liftoff's ability to defend its take rates against dominant platform ecosystems.
    claimRefs:
      - CI001
      - CI002
      - CI008
      - CI009
      - CI010
      - CI011
      - CI014
