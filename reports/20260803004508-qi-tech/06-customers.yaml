callouts:
  - calloutType: strength
    title: "Named proof quality is unusually good for a private infrastructure company"
    body: >-
      QI Tech does not just name customers; several cases include operational detail, module combinations, and concrete
      outcomes such as fund size, revenue, or cycle-time compression.
    claimRefs:
      - CU013
      - CU014
      - CU015
      - CU018
      - CU020

  - calloutType: risk
    title: "Retention and concentration remain the biggest hidden customer variables"
    body: >-
      Public case studies show strong deployments, but they do not show renewal rates, contract terms, or top-customer
      revenue share. That leaves a major gap between logo quality and true customer-quality underwriting.
    claimRefs:
      - CU026
      - CU027
      - CU028
      - CU030
      - CU031

  - calloutType: insight
    title: "Ombudsman data is the most useful counterweight to glossy case studies"
    body: >-
      The 1H25 report shows that service quality and complaint handling are real operational dimensions. That is exactly
      the kind of evidence investors need to balance logo-driven narratives.
    claimRefs:
      - CU033
      - CU034
      - CU035
      - CU036

