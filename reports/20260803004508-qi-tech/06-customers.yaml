company:
  name: "QI Tech"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    QI Tech's customer base is broad by logo type but concentrated in enterprise-style, regulated workflows rather than
    mass-market consumer usage directly under the QI Tech brand. Public proof points span telecom (Vivo Pay), wellness
    ecosystem finance (Wellhub), global fintech infrastructure (Jeeves), asset managers (Suno Asset, Estímulo,
    Ártico), structured-credit operators (LBA, Multiplike), and vertical SaaS / property operators (Almah). The best
    top-line customer metrics are 400+ clients in 2024, 400+ projects in 2025, and an expected jump to 750 customers
    after Singulare. Adoption evidence is strongest for named case studies and workflow outcomes, while retention,
    GRR/NRR, concentration, and contract duration remain undisclosed. The ombudsman report adds an important adverse
    signal: support demand is real and satisfaction appears mixed, which matters for long-term expansion quality.

sections:
  - id: customer-segmentation-and-buyer-map
    title: "Customer segments: enterprises, fintechs, asset managers, and ecosystem operators"
    body: >-
      QI Tech is not selling a single monolithic product into a single buyer. The public record supports at least five
      customer archetypes. First are large enterprise ecosystems such as Vivo and Wellhub that want to embed finance into
      an existing distribution base. Second are fintech and cross-border operators such as Jeeves that need local
      Brazilian regulatory and operational infrastructure without building it alone. Third are fund managers and
      structured-credit specialists such as Suno Asset, Estímulo, Ouro Preto, Ártico Capital, LBA, and Multiplike,
      where the problem is fiduciary administration, custody, escrow, and document flows rather than retail banking UI.
      Fourth are correspondents / lending operators such as Fintech do Corban and similar credit-originator partners.
      Fifth are vertical operators such as Almah that need integrated accounts, payments, onboarding, and anti-fraud.

      This mix matters because it implies buyer sophistication is high and sales cycles are probably consultative.
      QI Tech's customers are typically not picking a cheap point tool; they are outsourcing a regulated workflow.
      Public corporate materials also make clear that the company sells into companies that want to create their own
      financial products under their own brands. That increases potential revenue per customer but also raises switching
      costs and implementation friction. The visible customer surface therefore supports an enterprise infrastructure
      interpretation much more than a self-serve fintech-software interpretation.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: adoption-trajectory-and-named-proof
    title: "Adoption trajectory and named customer proof"
    body: >-
      QI Tech's best adoption signals come from two places: company-level logo counts and rich case-study proof.
      Official and investor-linked sources say the company had 400-plus clients in 2024, more than 400 projects in 2025,
      and expected to jump to roughly 750 customers after the Singulare acquisition, with a path to 1,000 by the end of
      the following year. Those figures show reach, but the named customer proof is more informative because it reveals
      which kinds of customers actually trust QI Tech in production. Vivo Pay is the clearest proof of an embedded-
      finance enterprise customer: the case cites a telecom base of 116 million accesses, 85 million app users, 1,800+
      stores, and more than R$400 million cumulative revenue for the financial vertical by end-2025. Wellhub shows QI
      Tech working as a fund-and-documentation layer inside a global wellness ecosystem through a R$100 million fund.
      Jeeves shows QI Tech as a local launch partner for a multi-country fintech.

      The asset-management and structured-credit cases deepen the proof set rather than simply repeat it. Suno Asset says
      it manages more than R$3.3 billion and 230 thousand investors, with three funds already under QI Tech
      administration. Ouro Preto says fund-structuring time fell from 60 to 30 days. LBA cites 200-plus operations,
      70-plus developers, and 150-plus escrow accounts. Multiplike cites R$4 billion of equity under management. These
      are not all comparable customer metrics, but together they show that QI Tech's proof skews toward high-complexity,
      production financial workflows rather than pilot-stage fintech experiments.
    claimRefs:
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
      - CU017
      - CU018
      - CU019
      - CU020
      - CU021
      - CU022
      - CU023
    tableRefs:
      - TU002
      - TU003
    figureRefs:
      - FU002

  - id: retention-expansion-and-concentration
    title: "Retention, expansion, and concentration: promising signals, little hard disclosure"
    body: >-
      Public evidence implies expansion is real but does not quantify it. QI Tech's cases repeatedly show the same
      customer adopting multiple modules—Vivo combines lending documents and FIDC workflows; Wellhub combines fund admin,
      escrituração, and signature; Jeeves combines wallet, KYC, and commercial-note credit; asset-manager cases combine
      custody, escrow, credit instruments, and white-label or payment layers. That pattern strongly suggests expansion by
      module, which should raise customer lifetime value once a client is live. The Singulare acquisition also appears to
      function as a customer-base expansion wedge because it brought hundreds of additional client relationships into the
      broader operating stack.

      But retention metrics remain missing. There is no public GRR, NRR, churn, logo-retention rate, average contract
      duration, or renewal schedule. Concentration is also hard to judge. The named customers are large enough that it is
      plausible a small number of flagship relationships contribute an outsized share of revenue or credibility,
      especially on the enterprise embedded-finance side. Conversely, the large number of funds, projects, and client
      logos suggests some diversification across buyer types. The correct customer-quality reading is therefore mixed:
      public cases support meaningful expansion potential and sticky workflows, but investors cannot yet quantify whether
      QI Tech is broadly diversified or quietly dependent on a handful of anchor programs.
    claimRefs:
      - CU024
      - CU025
      - CU026
      - CU027
      - CU028
      - CU029
      - CU030
      - CU031
      - CU032
    tableRefs:
      - TU004
      - TU005
    figureRefs:
      - FU004

  - id: support-signals-and-adverse-customer-evidence
    title: "Support signals and adverse customer evidence"
    body: >-
      The main adverse customer evidence in the retained set comes from QI Tech's own ombudsman reporting rather than
      from a consumer-review platform. For first-half 2025 the report shows 3,483 service interactions, average response
      time of 4.4 business days, satisfaction score of 2.2, and 2,435 external-channel demands, alongside Banco Central
      and consumidor.gov indicators. That is materially less flattering than the product marketing language and is worth
      taking seriously even though the report aggregates multiple regulated entities and channels. It suggests that once a
      company reaches meaningful scale across regulated operations, customer-support and complaint-handling quality can
      become a real operating variable rather than a back-office afterthought.

      The 2025 data-incident coverage adds a second adverse layer: for enterprise infrastructure, trust is part of the
      customer product. A reported incident does not directly prove churn, but it can affect procurement, renewal pace,
      and the willingness of larger enterprises to broaden module adoption. The right interpretation is not that QI Tech's
      customer quality is weak; public case proof is too strong for that. It is that customer durability cannot be scored
      only from glossy logos and success cases. Ombudsman and incident data show that the lived service layer deserves as
      much diligence as the API and regulatory layer.
    claimRefs:
      - CU033
      - CU034
      - CU035
      - CU036
      - CU037
      - CU038
    tableRefs: []
    figureRefs:
      - FU003


