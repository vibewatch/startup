callouts:
  - calloutType: strength
    title: "Brazil's rails-and-regulation stack is a genuine structural tailwind"
    body: >-
      Brazil combines unusually strong payment-rail adoption with active regulatory modernization. Pix ubiquity, open
      finance standardization, and the BCB's continued work on BaaS and eFX rules create an environment where regulated
      infrastructure providers can solve real pain for banks, fintechs, and non-financial enterprises.
    claimRefs:
      - CM005
      - CM008
      - CM009
      - CM028

  - calloutType: risk
    title: "Big market does not equal clear monetization"
    body: >-
      The public evidence proves rail activity and broad demand, but it does not reveal infrastructure take rates,
      customer payback, or a clean segment-level revenue pool for QI Tech. Investors can underwrite adoption potential,
      but not yet the exact portion of Pix, open-finance, and lending activity that converts into durable software-like
      economics.
    claimRefs:
      - CM006
      - CM010
      - CM014
      - CM034
      - CM035

  - calloutType: insight
    title: "The real competition is often fragmentation, not a single named rival"
    body: >-
      Customer evidence suggests QI Tech wins when a buyer wants multiple regulated workflows under one provider rather
      than best-of-breed point tools. That means the primary substitute is often a fragmented internal build or bank-led
      workaround, even when named competitors such as Celcoin, Dock, Zoop, or Pluggy participate in parts of the same
      deal.
    claimRefs:
      - CM016
      - CM017
      - CM019
      - CM031
      - CM032

