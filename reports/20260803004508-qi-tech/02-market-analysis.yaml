company:
  name: "QI Tech"

chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    QI Tech operates inside a Brazilian financial-infrastructure market shaped by Pix, open finance, SCD licensing, and
    the enterprise need to embed regulated payments, credit, onboarding, and fund operations without building a bank from
    scratch. Public evidence supports a broad addressable market that spans embedded-finance software / revenue pools,
    alternative-lending infrastructure, and high-volume payment rails, but it does not support one clean TAM number for
    QI Tech because the company straddles BaaS, lending, anti-fraud, open-finance connectivity, and FIDC administration.
    The strongest market drivers are regulatory modernization, Pix ubiquity, and enterprise demand for compliant launch
    speed; the main constraints are compliance burden, crowded supplier choice, and unclear public take rates.

sections:
  - id: market-boundary-and-what-counts
    title: "Market boundary, included spend, and substitutes"
    body: >-
      QI Tech's relevant market is not generic "fintech" or even generic banking-as-a-service. The retained evidence
      shows a narrower but still large financial-infrastructure layer: regulated APIs and operating services that let
      enterprises, fintechs, banks, marketplaces, and asset managers launch or operate credit, digital-account,
      payments, onboarding, anti-fraud, and fund-administration workflows. The company website and General Atlantic's
      2023 release both describe QI Tech as a one-stop-shop for those workflows, while customer cases show usage in
      telecom-led consumer finance, cross-border fintech localization, wellness-network lending, and marketplace credit.

      What is included in this chapter's market lens is therefore the infrastructure-value layer: compliance-led banking
      APIs, payment orchestration, lending operations, identity / KYC / anti-fraud rails, open-finance connectivity,
      and capital-markets operations such as FIDC administration and custody. What is excluded is end-consumer loan
      principal sitting on third-party balance sheets, merchant GMV that only passes through a rail, and the entire
      revenue of enterprises like Vivo or Wellhub that merely use QI Tech as a backend component. Status-quo
      substitutes remain direct bank relationships, legacy core providers, fragmented specialist vendors, or internal
      buildouts, each of which trades lower integration convenience for potentially greater control.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM020
      - CM021
      - CM022
      - CM023
      - CM024
      - CM025
      - CM032
    tableRefs:
      - TM001
  - id: sizing-lenses-and-what-can-be-supported
    title: "Sizing lenses: TAM, SAM, SOM proxies, and what public data cannot isolate"
    body: >-
      The public market data is best treated as a set of constrained lenses rather than a single authoritative TAM. The
      cleanest third-party top-down data point in the retained set is the Research and Markets databook summary carried
      by BusinessWire, which sizes Brazil's embedded-finance market at US$14.16B in 2025. That figure is useful because
      it points to the software-and-services revenue pool around embedded payments, lending, and banking. A second,
      narrower lens comes from the ezbob / CX Solutions open-finance piece, which cites a roughly US$1.9B Brazilian
      alternative-lending market by 2025. That is not QI Tech's full TAM, but it is a relevant floor for the credit-led
      part of the business.

      A third lens uses infrastructure throughput instead of revenue. The same ezbob piece says Pix is processing roughly
      six to seven billion monthly transactions in 2026 and about R$3T in monthly value, while QI Tech's own public
      materials advertise US$88B in Pix transactions and US$19B in credit issued. Those are not comparable units and
      therefore cannot be collapsed into a clean SAM or SOM. They do, however, show why QI Tech can plausibly monetize a
      multi-rail operating layer that sits across payments, credit, identity, and custody rather than one single product
      category. The correct market takeaway is breadth with measurement ambiguity: large opportunity, weak public
      take-rate transparency.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
      - CM009
      - CM010
      - CM011
      - CM012
      - CM013
      - CM014
      - CM015
      - CM034
      - CM035
    tableRefs:
      - TM002
    figureRefs:
      - FM001
      - FM002

  - id: buyers-users-payers-and-adoption-path
    title: "Buyer, user, payer, and adoption path"
    body: >-
      The retained evidence points to four recurring buyer groups. First are fintechs and banks that need licensed rails
      but want a faster and more modular path than building everything themselves. Second are non-financial enterprises
      such as telecoms, marketplaces, and ecosystem operators that want to monetize their customer base through financial
      products. Third are asset managers and structured-credit operators that need fund administration, escrow, custody,
      or debt-instrument infrastructure. Fourth are global entrants that can design financial products elsewhere but need
      local regulatory, Pix, and credit-instrument plumbing to operate in Brazil.

      In those segments the economic buyer is usually not the end user but a CFO, treasury, risk, product, or financial
      services lead who owns P&L or launch accountability. The end user is the enterprise's customer, merchant, partner,
      or borrower. The payer is the enterprise itself, often justifying adoption through faster time-to-market, lower
      compliance burden, new revenue lines, or better risk controls. The Jeeves, Wellhub, Vivo, and Bettr examples are
      especially useful because each maps to a different trigger: local market entry, partner-network financing,
      installed-base monetization, and embedded-commerce credit.
    claimRefs:
      - CM016
      - CM017
      - CM018
      - CM019
      - CM020
      - CM021
      - CM022
      - CM023
      - CM024
      - CM026
      - CM027
    tableRefs:
      - TM003
    figureRefs:
      - FM003
      - FM004

  - id: growth-drivers-constraints-and-diligence-gaps
    title: "Growth drivers, adoption constraints, and preserved diligence gaps"
    body: >-
      Brazil remains one of the strongest structural markets globally for regulated financial infrastructure. The BCB's
      2025-2026 priorities explicitly include Open Finance evolution, Pix expansion, evaluation of eFX rules, AI
      monitoring, and enactment of BaaS regulations. Chambers likewise describes a credit market in which fintechs keep
      expanding credit access while regulation evolves to balance prudential oversight with modernization. These drivers
      matter directly to QI Tech because a company with licensing, compliance, and multiple operating modules benefits
      when customer demand shifts from isolated point solutions toward integrated, regulator-ready stacks.

      The constraints are equally real. Compliance and trust requirements are high; sales cycles can be long because the
      budget owner often has to sign off on KYC, fraud, treasury, and legal-risk implications together. The competitive
      set is crowded: Celcoin, Dock, Zoop, Pluggy, Matera, and internal-bank alternatives all serve different slices of
      the stack. And the public evidence still cannot isolate core market metrics such as take rate, net revenue per
      client, or the precise boundary between payment value and software revenue. The result is a market that is clearly
      large and expanding, but one where investors still need deeper bottom-up pricing and cohort data before converting
      rail volume into durable equity value.
    claimRefs:
      - CM028
      - CM029
      - CM030
      - CM031
      - CM033
      - CM034
      - CM035
      - CM036
      - CM037
    tableRefs:
      - TM004


