      - number: '3.4'
        title: Switching cost, moat durability, and competitive risk
        blocks:
          - type: paragraph
            body: >-
              QI Tech's moat is not strongest where the market is most transparent. Public pages make many rivals sound
              broad, modern, and AI- or API-native. The more defensible edge appears where multiple regulated workflows
              are bundled: credit origination, anti-fraud, onboarding, Pix, debt instruments, and post-Singulare custody
              / administration. Once a client runs production flows across several of those layers, switching cost rises
              because legal, treasury, risk, and product teams all need to move in sync. This is especially true in
              credit and fund-operations contexts, where internal controls and regulatory process matter as much as
              front-end UX.

              The risks are also clear. Breadth can become a commodity if rivals such as Celcoin keep adding modules and
              if large platforms like Matera, Pismo, or Dock convince buyers to treat finance infrastructure as a
              general platform layer rather than a local regulated specialist. Pluggy's public pricing also shows how
              point-solution categories can turn into price-led, transparent software markets faster than integrated
              stacks do. The core diligence question is not whether QI Tech has competitors — it plainly does — but
              whether its multi-license and custody-linked stack keeps it on the short list when buyers want fewer
              counterparties and deeper local execution.
