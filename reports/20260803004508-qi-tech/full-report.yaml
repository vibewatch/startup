      - number: '7.2'
        title: Control environment and governance risk
        blocks:
          - type: paragraph
            body: >-
              On paper, QI Tech's control environment is more developed than many startup peers. The retained set shows
              a privacy notice built on LGPD, a cybersecurity policy referencing ISO/IEC 27001, NIST CSF, CMN 4.893/2021
              and BCB 85/2021, an AML/CFT policy with named governance roles and committees, an anti-corruption policy
              with public-sector and gifts guidance, a code of ethics with whistleblowing posture, and a transparency
              portal that centralizes the public control stack. Those are meaningful positives because they imply
              governance has been formalized as the company scaled.

              But policy visibility is not control proof. None of the public documents prove operating effectiveness,
              incident response maturity, segregation of duties quality, or audit-closure performance. The strongest
              charitable read is that QI Tech has built the right scaffolding for a regulated platform. The skeptical
              read is that scaling quickly, integrating acquisitions, and broadening product scope can easily outrun the
              day-to-day quality of execution behind the policies. This is the classic fintech-infrastructure risk gap:
              governance documents can be strong while control assurance remains hard to underwrite from public evidence
              alone.
