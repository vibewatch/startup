chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding, and regulatory positioning
        blocks:
          - type: paragraph
            body: >-
              QI Tech is a privately held Brazilian financial infrastructure company headquartered in São Paulo. The
              public legal footprint shown across its website footer and corporate pages is QI Sociedade de Crédito
              Direto S.A. for the credit institution and QI CTVM Ltda. for the securities broker-dealer arm, both
              operating from Pátio Rebouças in Jardim Paulistano. The company says it was founded in 2018 and built to
              act as a technological and regulatory layer for businesses that want to embed financial products without
              becoming full-stack banks themselves.

              The regulatory claim is central to the business model. QI Tech states that it was the first Direct Credit
              Society (SCD) approved by the Banco Central do Brasil and later became the first fintech to also hold a
              Securities Distributor / broker-dealer (DTVM / CTVM) license. Those permissions let QI Tech combine loan
              origination, payment flows, digital-account features, and capital-markets infrastructure in one stack.
              General Atlantic's 2023 investment release describes this as a "one-stop-shop" that wraps compliance,
              onboarding, credit underwriting, transfers, Pix, and FIDC structuring into modular APIs, while the company
              homepage frames the offer as financial infrastructure similar to an AWS-like utility for regulated
              finance.
