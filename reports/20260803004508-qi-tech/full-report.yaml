      - number: '6.3'
        title: 'Retention, expansion, and concentration: promising signals, little hard disclosure'
        blocks:
          - type: paragraph
            body: >-
              Public evidence implies expansion is real but does not quantify it. QI Tech's cases repeatedly show the
              same customer adopting multiple modules—Vivo combines lending documents and FIDC workflows; Wellhub
              combines fund admin, escrituração, and signature; Jeeves combines wallet, KYC, and commercial-note credit;
              asset-manager cases combine custody, escrow, credit instruments, and white-label or payment layers. That
              pattern strongly suggests expansion by module, which should raise customer lifetime value once a client is
              live. The Singulare acquisition also appears to function as a customer-base expansion wedge because it
              brought hundreds of additional client relationships into the broader operating stack.

              But retention metrics remain missing. There is no public GRR, NRR, churn, logo-retention rate, average
              contract duration, or renewal schedule. Concentration is also hard to judge. The named customers are large
              enough that it is plausible a small number of flagship relationships contribute an outsized share of
              revenue or credibility, especially on the enterprise embedded-finance side. Conversely, the large number
              of funds, projects, and client logos suggests some diversification across buyer types. The correct
              customer-quality reading is therefore mixed: public cases support meaningful expansion potential and
              sticky workflows, but investors cannot yet quantify whether QI Tech is broadly diversified or quietly
              dependent on a handful of anchor programs.
