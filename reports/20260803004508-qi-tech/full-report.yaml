  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              QI Tech's relevant market is not generic "fintech" or even generic banking-as-a-service. The retained
              evidence shows a narrower but still large financial-infrastructure layer: regulated APIs and operating
              services that let enterprises, fintechs, banks, marketplaces, and asset managers launch or operate credit,
              digital-account, payments, onboarding, anti-fraud, and fund-administration workflows. The company website
              and General Atlantic's 2023 release both describe QI Tech as a one-stop-shop for those workflows, while
              customer cases show usage in telecom-led consumer finance, cross-border fintech localization,
              wellness-network lending, and marketplace credit.

              What is included in this chapter's market lens is therefore the infrastructure-value layer: compliance-led
              banking APIs, payment orchestration, lending operations, identity / KYC / anti-fraud rails, open-finance
              connectivity, and capital-markets operations such as FIDC administration and custody. What is excluded is
              end-consumer loan principal sitting on third-party balance sheets, merchant GMV that only passes through a
              rail, and the entire revenue of enterprises like Vivo or Wellhub that merely use QI Tech as a backend
              component. Status-quo substitutes remain direct bank relationships, legacy core providers, fragmented
              specialist vendors, or internal buildouts, each of which trades lower integration convenience for
              potentially greater control.
            claimRefs:
