      - number: '3.3'
        title: Adjacents, pricing signals, and build-versus-buy alternatives
        blocks:
          - type: paragraph
            body: >-
              Pluggy demonstrates how a narrower competitor can still be strategically relevant. It is positioned around
              reading banking data and moving money in Brazil, is authorized by Banco Central as an ITP, and publicly
              advertises one of the few visible pricing schedules in the set: data products starting at R$2,500 per
              month and payments products starting at R$500 per month. That public price transparency makes Pluggy a
              useful benchmark for point-solution economics, even though its scope is narrower than QI Tech's. Matera
              and Pismo are different again: both present as deep platform layers for banks and large financial
              institutions, with stronger emphasis on core modernization, ledger / wallet performance, and card issuing
              than on local sponsor-like regulatory packaging.

              For many buyers the real alternative is not one named competitor but a hybrid architecture. A company can
              combine a data connector such as Pluggy, a bank or sponsor arrangement, a payments provider such as Zoop
              or Dock, and an internally built product layer. That keeps optionality high but raises integration,
              compliance, and vendor-management burden. QI Tech's integrated pitch is strongest when the buyer values
              reduced orchestration complexity more than it values picking the cheapest point tool in each category.
