      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to four recurring buyer groups. First are fintechs and banks that need
              licensed rails but want a faster and more modular path than building everything themselves. Second are
              non-financial enterprises such as telecoms, marketplaces, and ecosystem operators that want to monetize
              their customer base through financial products. Third are asset managers and structured-credit operators
              that need fund administration, escrow, custody, or debt-instrument infrastructure. Fourth are global
              entrants that can design financial products elsewhere but need local regulatory, Pix, and
              credit-instrument plumbing to operate in Brazil.

              In those segments the economic buyer is usually not the end user but a CFO, treasury, risk, product, or
              financial services lead who owns P&L or launch accountability. The end user is the enterprise's customer,
              merchant, partner, or borrower. The payer is the enterprise itself, often justifying adoption through
              faster time-to-market, lower compliance burden, new revenue lines, or better risk controls. The Jeeves,
              Wellhub, Vivo, and Bettr examples are especially useful because each maps to a different trigger: local
              market entry, partner-network financing, installed-base monetization, and embedded-commerce credit.
