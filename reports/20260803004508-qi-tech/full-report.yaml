  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue model and public scale: multi-line infrastructure monetization with one visible revenue snapshot'
        blocks:
          - type: paragraph
            body: >-
              QI Tech's economic model is broader than a single BaaS subscription. Public product surfaces show at least
              six monetization families: Banking as a Service, payment processing, lending infrastructure, risk /
              onboarding, administration and custody of funds, and DCM / securities infrastructure. The common pattern
              is regulated, API-driven enablement sold into enterprises that want to launch or operate financial
              products without building the full local stack in-house. The revenue mechanism therefore likely mixes
              implementation, ongoing platform usage, transaction fees, fund-administration fees, documentation /
              issuance services, and support for cross-sell into adjacent modules. That breadth is strategically
              attractive because no single product line needs to carry the full commercial burden.

              The best public revenue datapoint remains Bloomberg Línea's July 2024 interview after the Singulare
              approval. That article says QI Tech expected R$680 million of revenue in 2024, with lending contributing
              35%, administration and custody 30%, banking 25%, and compliance 10%. It also reports 400-plus clients,
              expected expansion to 750 with Singulare and 1,000 by the end of the following year, and management's view
              that lending would remain the largest revenue line while custody would matter disproportionately for
              cross-sell. Later 2025 official materials stop short of disclosing revenue, but they do disclose
              operating-scale proxies: more than 400 client projects, US$25 billion of AUM, US$17 billion of FIDC
              custody, over 20 million anti-fraud analyses per month, more than 90 million validated registrations, and
              insurance premium issuance above US$27 million within six months of launch. Those proxies support
              continued scale-up, but they do not replace audited financial statements.
