      - number: '8.2'
        title: Operating scale support for valuation
        blocks:
          - type: paragraph
            body: >-
              The best support for a premium valuation is that QI Tech does not look like a single-surface fintech.
              Portuguese product pages show the same broad operating footprint across modules: R$494B Pix transacted,
              R$98B protected against fraud, R$107B credit issued, and R$170B under administration. The
              administration-and-custody page adds 1,000-plus funds and 740-plus FIDCs in portfolio. The Risk Solutions
              page adds 20M analyses per month and 90M validated registrations. These are company-claimed metrics, but
              they matter because they show scale evidence across payments, credit, administration, and data workflows
              rather than in a single product bucket.

              Bloomberg Línea's 2024 revenue projection of R$680M is the most concrete monetization clue, and the
              article said Singulare would represent around 40% of revenue after consolidation. That suggests the
              valuation is not only about transaction volume optics; it is also tied to real revenue scale and a more
              diversified business mix. The caution is that official English pages still show older, lower metrics,
              which weakens confidence in perfect disclosure hygiene. The valuation case benefits from operating
              breadth, but the underwriting discount should reflect metric drift and the lack of audited profitability
              disclosure.
