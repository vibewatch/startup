          - type: callout
            title: The real competition is often fragmentation, not a single named rival
            body: >-
              Customer evidence suggests QI Tech wins when a buyer wants multiple regulated workflows under one provider
              rather than best-of-breed point tools. That means the primary substitute is often a fragmented internal
              build or bank-led workaround, even when named competitors such as Celcoin, Dock, Zoop, or Pluggy
              participate in parts of the same deal.
