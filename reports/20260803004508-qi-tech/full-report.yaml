      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              The founding trio disclosed in investment announcements is Pedro Mac Dowell, Marcelo Bentivoglio, and
              Marcelo Buosi. Public sources consistently identify Mac Dowell as founder and CEO, Bentivoglio as
              co-founder and CFO, and Buosi as co-founder / operating executive. The 2023 Series B communication notes
              that the round was completed on a pro-rata basis, preserving founder control without secondaries or
              cap-table exits. Public evidence further shows that QI Tech's leadership bench has expanded through
              acquisitions: Daniel Doll Lemos, formerly associated with Singulare, remained visible in post-acquisition
              communications, while Emílio Moreira was cited as the executive leading the Singulare integration.

              Governance visibility is still incomplete relative to institutional expectations. The public record
              confirms major shareholders such as GIC, General Atlantic, and Across Capital, but does not disclose
              precise ownership stakes, board seats, observer rights, or committee structure. That creates classic
              key-person dependence on Mac Dowell and the small founding group, especially because external evidence
              ties strategic direction, fundraising, M&A, and new product launches closely to the founder-CEO and CFO.
