  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Customer segments: enterprises, fintechs, asset managers, and ecosystem operators'
        blocks:
          - type: paragraph
            body: >-
              QI Tech is not selling a single monolithic product into a single buyer. The public record supports at
              least five customer archetypes. First are large enterprise ecosystems such as Vivo and Wellhub that want
              to embed finance into an existing distribution base. Second are fintech and cross-border operators such as
              Jeeves that need local Brazilian regulatory and operational infrastructure without building it alone.
              Third are fund managers and structured-credit specialists such as Suno Asset, Estímulo, Ouro Preto, Ártico
              Capital, LBA, and Multiplike, where the problem is fiduciary administration, custody, escrow, and document
              flows rather than retail banking UI. Fourth are correspondents / lending operators such as Fintech do
              Corban and similar credit-originator partners. Fifth are vertical operators such as Almah that need
              integrated accounts, payments, onboarding, and anti-fraud.

              This mix matters because it implies buyer sophistication is high and sales cycles are probably
              consultative. QI Tech's customers are typically not picking a cheap point tool; they are outsourcing a
              regulated workflow. Public corporate materials also make clear that the company sells into companies that
              want to create their own financial products under their own brands. That increases potential revenue per
              customer but also raises switching costs and implementation friction. The visible customer surface
              therefore supports an enterprise infrastructure interpretation much more than a self-serve
              fintech-software interpretation.
