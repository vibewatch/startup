      - number: '5.2'
        title: 'Architecture and developer model: credible integration surface, limited deep-stack disclosure'
        blocks:
          - type: paragraph
            body: >-
              Public developer materials are good enough to prove that QI Tech has a real integration platform. The API
              documentation states that sandbox and production are fully separate, with distinct hosts for BaaS / LaaS,
              CaaS, and CertifiQI-related services. The playground exposes 65 endpoints and automates JWT signing in the
              browser. The webhook documentation shows that integrations are configured through the platform, allows
              custom headers, warns clients not to hard-map webhook schemas too tightly, and sets a 10-second response
              timeout. On the credit-engine page, QI Tech says integrations can connect in up to two days, uses RESTful
              APIs, and offers logs and call-status monitoring via dashboard. Those are all meaningful developer
              signals.

              What is missing is the internal architecture that larger infrastructure customers usually want to see in
              diligence. Public materials do not disclose cloud provider, region strategy, data-store choices, message
              bus design, multi-tenant isolation model, disaster-recovery RTO / RPO, or observed uptime history. The
              product pages do prove modular coupling: onboarding flows into automated credit decisioning, anti-fraud
              into payments, DCM into banking, and recurring Pix into collections. But that is commercial architecture,
              not systems architecture. The product-tech verdict is therefore asymmetric: the external operating model
              looks integration-ready and production-oriented, while the internal technical stack remains largely
              opaque.
