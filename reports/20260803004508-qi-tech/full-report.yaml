            body: >-
              Celcoin is the most obviously broad direct peer in the retained set. Its own materials and Summit
              Partners' funding release show a modular platform spanning banking, payments, and credit, including BaaS,
              liquidating bank, white-label cards, open-insurance and regulatory modules, Pix and ITP functionality,
