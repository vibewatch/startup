  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Regulatory and licensing risk: advantaged position, heavier burden'
        blocks:
          - type: paragraph
            body: >-
              QI Tech's most important structural risk fact is also one of its advantages: it operates with real
              regulated licenses rather than trying to wrap regulated activity around a lightly supervised software
              shell. Public materials, terms, and investor releases consistently frame the company as the first SCD
              approved by Banco Central and, after Singulare, as a platform spanning additional capital-markets
              permissions. That lowers the basic risk of sudden business-model invalidation relative to unlicensed
              embedded-finance vendors. But it replaces licensing fragility with operating burden. Once the company sits
              inside a regulated perimeter, every new product, partner, or workflow brings conduct, AML, complaints,
              fraud, prudential, and data-governance obligations.

              This burden is unlikely to shrink. External legal commentary says Banco Central's 2025-2026 agenda
              includes Open Finance changes, virtual-asset rules, AI monitoring, expanded Pix functionality, fraud
              prevention, and prudential reviews. For a company whose product strategy explicitly rides on credit,
              payments, onboarding, and data workflows, that means regulatory change is not background noise; it is part
              of the roadmap. QI Tech therefore benefits from its licensed posture, but it also inherits a recurring
              implementation tax every time regulation evolves.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
