  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, adjacents, substitutes, and likely entrants'
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive landscape has at least six classes. First are direct embedded-finance
              infrastructure peers selling a broad enterprise stack: Celcoin, Dock, and Zoop. Second are adjacent data /
              connectivity players such as Pluggy that cover a narrower but strategically important slice of the
              workflow. Third are core-platform vendors such as Matera and Pismo that can power digital banks, card
              issuing, wallets, and real-time payments, even when they do not mirror QI Tech's regulatory wrapper or
              custody angle. Fourth are incumbent banks and sponsor-bank relationships that let enterprises launch
              financial products through partnerships rather than software-led infrastructure. Fifth are fragmented
              multi-vendor architectures where a buyer combines open-finance, KYC, payment, and credit tools from
              different suppliers. Sixth is internal build, especially for large enterprises with capital and patience.

              QI Tech therefore does not win by existing alone; it wins when a buyer prefers an integrated, regulated
              local stack over a mix-and-match architecture or a global core-banking platform. That distinction matters
              because many rivals can match one module, but fewer can match regulated credit origination, Pix,
              anti-fraud, onboarding, and FIDC / fund administration under one local operating umbrella.
            claimRefs:
