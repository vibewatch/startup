      - number: '1.3'
        title: Funding history, valuation, and capital base
        blocks:
          - type: paragraph
            body: >-
              QI Tech's capital formation has been unusually strong for a private Brazilian infrastructure fintech. In
              November 2021, the company announced a US$50M Series A led by GIC, at the time calling it one of the
              largest Series A rounds in Latin America. The 2023 Series B then brought US$200M (R$1B) led by General
              Atlantic, with Across Capital doubling its earlier position. General Atlantic's official release added an
              important quality signal by saying the company had already been profitable since its first year of
              operation, although the supporting audited financial statements are not public.

              In April 2024, QI Tech announced a US$50M Series B extension backed by General Atlantic and Across
              Capital. The company and subsequent coverage state that the extension took QI Tech to roughly a US$1.5B
              valuation and formalized unicorn status. In July 2025, the company announced another US$63M Series B
              extension, again led by General Atlantic with Across participating for a fourth consecutive time.
              Independent and official coverage frame the 2025 extension as capital for new products and acquisitions,
              and place the post-money valuation above US$2B. Across the disclosed 2021, 2023, 2024, and 2025 rounds,
              the public primary-source funding total is US$363M.
