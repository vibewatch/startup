      - number: '6.4'
        title: Support signals and adverse customer evidence
        blocks:
          - type: paragraph
            body: >-
              The main adverse customer evidence in the retained set comes from QI Tech's own ombudsman reporting rather
              than from a consumer-review platform. For first-half 2025 the report shows 3,483 service interactions,
              average response time of 4.4 business days, satisfaction score of 2.2, and 2,435 external-channel demands,
              alongside Banco Central and consumidor.gov indicators. That is materially less flattering than the product
              marketing language and is worth taking seriously even though the report aggregates multiple regulated
              entities and channels. It suggests that once a company reaches meaningful scale across regulated
              operations, customer-support and complaint-handling quality can become a real operating variable rather
              than a back-office afterthought.

              The 2025 data-incident coverage adds a second adverse layer: for enterprise infrastructure, trust is part
              of the customer product. A reported incident does not directly prove churn, but it can affect procurement,
              renewal pace, and the willingness of larger enterprises to broaden module adoption. The right
              interpretation is not that QI Tech's customer quality is weak; public case proof is too strong for that.
              It is that customer durability cannot be scored only from glossy logos and success cases. Ombudsman and
              incident data show that the lived service layer deserves as much diligence as the API and regulatory
