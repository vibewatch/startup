  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation history and public anchor points
        blocks:
          - type: paragraph
            body: >-
              The clearest public valuation anchors are straightforward. QI Tech's April 2024 extension round placed the
              company at a US$1.5B valuation, confirming unicorn status. By July 2025, independent and official coverage
              described a US$63M extension that took valuation to US$2B+. That implies roughly one-third valuation
              growth in about sixteen months, with no evidence of a full repricing collapse despite tighter global
              fintech sentiment. On its face, that is a strong signal that investors see QI Tech less as a commodity
              BaaS layer and more as a scarce licensed infrastructure asset with multiple monetization vectors.

              Still, the anchor points have limits. Public materials do not disclose exact ownership dilution,
              liquidation preferences, revenue-recognition policies, EBITDA, or free cash flow. The 2025 step-up
              therefore cannot be read as a clean mark-to-market on transparent operating metrics alone. It is better
              read as a strategic scarcity valuation supported by growth narrative, product breadth, and capital-markets
              optionality after Singulare.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
