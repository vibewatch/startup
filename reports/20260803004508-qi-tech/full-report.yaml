            body: >-
              QI Tech's best adoption signals come from two places: company-level logo counts and rich case-study proof.
              Official and investor-linked sources say the company had 400-plus clients in 2024, more than 400 projects
              in 2025, and expected to jump to roughly 750 customers after the Singulare acquisition, with a path to
              1,000 by the end of the following year. Those figures show reach, but the named customer proof is more
              informative because it reveals which kinds of customers actually trust QI Tech in production. Vivo Pay is
              the clearest proof of an embedded- finance enterprise customer: the case cites a telecom base of 116
              million accesses, 85 million app users, 1,800+ stores, and more than R$400 million cumulative revenue for
              the financial vertical by end-2025. Wellhub shows QI Tech working as a fund-and-documentation layer inside
              a global wellness ecosystem through a R$100 million fund. Jeeves shows QI Tech as a local launch partner
              for a multi-country fintech.

              The asset-management and structured-credit cases deepen the proof set rather than simply repeat it. Suno
              Asset says it manages more than R$3.3 billion and 230 thousand investors, with three funds already under
              QI Tech administration. Ouro Preto says fund-structuring time fell from 60 to 30 days. LBA cites 200-plus
              operations, 70-plus developers, and 150-plus escrow accounts. Multiplike cites R$4 billion of equity under
              management. These are not all comparable customer metrics, but together they show that QI Tech's proof
              skews toward high-complexity, production financial workflows rather than pilot-stage fintech experiments.
