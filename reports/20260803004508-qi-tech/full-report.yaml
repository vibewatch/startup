  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Product surface: a modular one-stop shop spanning risk, banking, credit, and capital-markets workflows'
        blocks:
          - type: paragraph
            body: >-
              QI Tech's product surface is unusually broad for a Brazilian financial-infrastructure provider. Public
              pages show five operating clusters. Risk Solutions includes onboarding, OCR-based document capture, facial
              recognition and liveness, background checks, device registration for Pix, transactional anti-fraud, and a
              no-code credit engine. Banking as a Service includes digital accounts, Pix, TED, boletos, BolePix,
              white-label banking, card issuance, and recurring-payments infrastructure. Lending covers multiple credit
              workflows such as consignado, FGTS-linked flows, CCB issuance, and related formalization. DCM and
              securities infrastructure cover escrow, escrituração, liquidation, custody, and direct integration into
              Brazilian capital-markets processes. Administration and custody adds the post-Singulare fund layer with
              structuring, fiduciary administration, custody, and controllership.

              The shared product logic is not consumer UX but regulated workflow compression. QI Tech repeatedly
              presents itself as the single counterparty that lets customers avoid stitching together separate KYC,
              payment, credit, documentation, custody, and fund administrators. Customer cases reinforce that framing:
              Vivo Pay combines credit, CCB issuance, and FIDC administration; Wellhub combines fund admin, note
              escrituração, and digital signature; Jeeves uses wallet plus KYC plus commercial-note infrastructure; and
              Ouro Preto uses white-label manager tooling, escrow, and credit documentation. The breadth itself is
              therefore part of the product thesis. QI Tech is not only selling features; it is selling fewer
              operational handoffs across a regulated stack.
