              Dock competes from a different angle: a larger, older platform emphasizing payment infrastructure, cards,
              fraud prevention, acquiring, and white-label banking. Dock's public pages stress 25-plus years of
              operating history, direct Pix participation, and a very broad payment-plus-cards portfolio. Zoop, now
              explicitly tied to the iFood ecosystem in its public positioning, focuses on unified commerce and embedded
              payments but also has payment-institution licensing, direct Pix / core-banking capability, and notable
              scale in processed payments, marketplaces, and merchant endpoints. Relative to QI Tech, Celcoin looks
              closest on modular breadth, Dock on enterprise-grade payment and card infrastructure, and Zoop on
