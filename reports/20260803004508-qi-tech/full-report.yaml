      - number: '8.3'
        title: Comparables, scarcity, and sector context
        blocks:
          - type: paragraph
            body: >-
              QI Tech should not be valued as a plain API tool. Brazilian financial-infrastructure assets with licensing
              or core processing depth have attracted meaningful capital and strategic interest: Summit Partners said
              Celcoin reached US$63M ARR in Q1 2024 and secured a US$125M investment; Startups.com.br said Zoop
              generated over R$700M revenue in calendar 2025 and expected to exceed R$1B in the fiscal year ending March
              2026; Brazil Journal reported Matera raised R$500M from Warburg Pincus. Taken together, those datapoints
              support the idea that scaled infrastructure players in Brazil can command premium valuations even before
              pristine public profitability disclosure.

              QI Tech's differentiated angle is breadth across credit, banking, payments, risk, and fund administration
              inside a regulated perimeter. That combination is rare. It does not guarantee the valuation is cheap, but
              it makes a pure low-multiple software comparison too harsh. The right contextual read is that QI Tech
              belongs in the upper tier of strategic infrastructure assets, while still deserving a discount for
              private-company opacity, integration risk, and unresolved customer-quality questions.
