      - number: '5.3'
        title: Trust, safety, compliance, and critical dependencies
        blocks:
          - type: paragraph
            body: >-
              QI Tech's public trust posture is stronger than its deep architecture transparency. The cybersecurity
              policy says the conglomerate aligns to LGPD, CMN Resolution 4.893/2021, BCB Resolution 85/2021, and
              guidance from ANBIMA and CVM, while referencing ISO/IEC 27001 and the NIST Cybersecurity Framework as
              organizing standards. The transparency portal centralizes ethics, tariffs, terms, and policies, and the
              ombudsman policy describes the group-level complaint-handling framework for the SCD and DTVM.
              Product-level pages add more concrete controls: Device Scan is explicitly framed around Resolution 403 and
              IN 491, including the R$200 / R$1,000 limits for unregistered devices; Payment as a Service emphasizes
              certificate-based authentication, audit logs, and granular permissions; and Anti-Fraud claims coverage
              across Pix, TED, cards, and boletos.

              Still, there is no clean public proof of third-party security certification. The cybersecurity policy
              references ISO 27001 and NIST but does not say QI Tech is certified. Nor do public materials disclose SOC
              2, PCI DSS scope, independent penetration-test results, or incident-frequency metrics. The 2025 Banco
              Central-reported data leak involving QI Sociedade de Crédito shows why this gap matters: even for a
              company with substantial compliance signaling, controls must be judged by observed outcomes as well as
              policy language. Product dependencies are also visible. QI Tech depends on Banco Central and CVM rule
              evolution, B3-linked market infrastructure for capital- markets workflows, external data sources such as
              Open Finance / SCR / bureaus, and customer engineering teams implementing the APIs correctly. That is
              manageable, but it means technical risk is partly institutional.
