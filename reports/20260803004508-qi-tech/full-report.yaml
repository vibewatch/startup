      - number: '7.3'
        title: Data protection, cyber, and reputation risk
        blocks:
          - type: paragraph
            body: >-
              The most concrete adverse risk event in the retained set is the March 2025 incident involving 25.34
              thousand people tied to QI Sociedade de Crédito. Independent coverage and Banco Central's incident page
              corroborate that a real event occurred. For a company selling regulated infrastructure, this matters
              disproportionately because trust is part of the product: customers adopt QI Tech not only for APIs and
              licenses but also for safe handling of identity, payment, and credit data. The privacy notice itself says
              QI Tech processes data on behalf of partners and their end customers, which means the company sits close
              to high-sensitivity information flows.

              The public record does not support an overreaction. One incident does not prove systemic control failure
              across the platform, and the company also publishes a substantial cyber-governance policy. Still, the
              right diligence posture is to treat the incident as a serious prompt for remediation review. Investors
              should want postmortems, root-cause analysis, compensating controls, notification timelines, and evidence
              that the event did not materially impair new enterprise sales or renewals. The incident is therefore a
              medium-to-high trust risk, even if it is not yet enough to overturn the broader business thesis.
