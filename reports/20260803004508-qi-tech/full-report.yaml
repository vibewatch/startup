      - number: '2.2'
        title: 'Sizing lenses: TAM, SAM, SOM proxies, and what public data cannot isolate'
        blocks:
          - type: paragraph
            body: >-
              The public market data is best treated as a set of constrained lenses rather than a single authoritative
              TAM. The cleanest third-party top-down data point in the retained set is the Research and Markets databook
              summary carried by BusinessWire, which sizes Brazil's embedded-finance market at US$14.16B in 2025. That
              figure is useful because it points to the software-and-services revenue pool around embedded payments,
              lending, and banking. A second, narrower lens comes from the ezbob / CX Solutions open-finance piece,
              which cites a roughly US$1.9B Brazilian alternative-lending market by 2025. That is not QI Tech's full
              TAM, but it is a relevant floor for the credit-led part of the business.

              A third lens uses infrastructure throughput instead of revenue. The same ezbob piece says Pix is
              processing roughly six to seven billion monthly transactions in 2026 and about R$3T in monthly value,
              while QI Tech's own public materials advertise US$88B in Pix transactions and US$19B in credit issued.
              Those are not comparable units and therefore cannot be collapsed into a clean SAM or SOM. They do,
              however, show why QI Tech can plausibly monetize a multi-rail operating layer that sits across payments,
              credit, identity, and custody rather than one single product category. The correct market takeaway is
              breadth with measurement ambiguity: large opportunity, weak public take-rate transparency.
