      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Brazil's rails-and-regulation stack is a genuine structural tailwind
            body: >-
              Brazil combines unusually strong payment-rail adoption with active regulatory modernization. Pix ubiquity,
              open finance standardization, and the BCB's continued work on BaaS and eFX rules create an environment
              where regulated infrastructure providers can solve real pain for banks, fintechs, and non-financial
              enterprises.
            calloutType: strength
            claimRefs:
              - CM005
              - CM008
              - CM009
              - CM028
          - type: callout
            title: Big market does not equal clear monetization
            body: >-
              The public evidence proves rail activity and broad demand, but it does not reveal infrastructure take
              rates, customer payback, or a clean segment-level revenue pool for QI Tech. Investors can underwrite
              adoption potential, but not yet the exact portion of Pix, open-finance, and lending activity that converts
              into durable software-like economics.
            calloutType: risk
            claimRefs:
              - CM006
              - CM010
              - CM014
              - CM034
