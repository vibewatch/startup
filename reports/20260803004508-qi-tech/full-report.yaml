      - number: '2.4'
        title: Growth drivers, adoption constraints, and preserved diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Brazil remains one of the strongest structural markets globally for regulated financial infrastructure.
              The BCB's 2025-2026 priorities explicitly include Open Finance evolution, Pix expansion, evaluation of eFX
              rules, AI monitoring, and enactment of BaaS regulations. Chambers likewise describes a credit market in
              which fintechs keep expanding credit access while regulation evolves to balance prudential oversight with
              modernization. These drivers matter directly to QI Tech because a company with licensing, compliance, and
              multiple operating modules benefits when customer demand shifts from isolated point solutions toward
              integrated, regulator-ready stacks.

              The constraints are equally real. Compliance and trust requirements are high; sales cycles can be long
              because the budget owner often has to sign off on KYC, fraud, treasury, and legal-risk implications
              together. The competitive set is crowded: Celcoin, Dock, Zoop, Pluggy, Matera, and internal-bank
              alternatives all serve different slices of the stack. And the public evidence still cannot isolate core
              market metrics such as take rate, net revenue per client, or the precise boundary between payment value
              and software revenue. The result is a market that is clearly large and expanding, but one where investors
              still need deeper bottom-up pricing and cohort data before converting rail volume into durable equity
              value.
            claimRefs:
