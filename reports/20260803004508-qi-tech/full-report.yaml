      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory stack + API breadth create real platform leverage
            body: >-
              QI Tech is not just a single-product API vendor. The combination of SCD licensing, securities-distribution
              / fund infrastructure, and a broad operational stack lets it package lending, payments, onboarding,
              anti-fraud, custody, and embedded banking into one relationship for enterprise customers. That breadth
              helps explain why acquisitions such as Singulare and Builders Bank have strategic value well beyond simple
              GMV expansion.
