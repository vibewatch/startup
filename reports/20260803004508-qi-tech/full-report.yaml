      - number: '8.4'
        title: Scenario analysis and valuation verdict
        blocks:
          - type: paragraph
            body: >-
              The central valuation question is not whether QI Tech is good—it clearly has meaningful market
              position—but whether US$2B+ already prices most of the next leg of execution. In the bull case, product
              breadth converts into durable cross-sell, Singulare integration expands monetization, and the company's
              scale metrics turn into strong revenue and margin progression. In that world, a premium private-market
              valuation is defensible. In the bear case, public scale metrics overstate monetization quality, support /
              incident issues slow enterprise adoption, and multi-entity integration makes the operating model more
              complex than the revenue base can justify.

              With current public evidence, the most defensible stance is constructive but disciplined. QI Tech looks
              more likely overvalued on disclosure risk than on strategic quality. Put differently, the company probably
              deserves a premium to simpler fintech tooling peers, but investors should demand a diligence discount
              until they see audited revenue, segment gross margins, concentration, cohort retention, and
              incident-remediation evidence. Recommendation: positive strategic view, moderate valuation caution, and
              strong insistence on deeper diligence before treating US$2B+ as a fully proven fair value.
