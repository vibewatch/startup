      - number: '4.3'
        title: Cost structure, capital adequacy, and funding dependency
        blocks:
          - type: paragraph
            body: >-
              QI Tech's cost structure appears to sit between SaaS infrastructure and regulated financial operations.
              Software, product development, compliance, customer success, and integration work are likely the core
              controllable expenses; unlike a lender, QI Tech does not appear to need large proprietary balance-sheet
              funding to book most customer credit volume itself. That said, the platform is not economically
              weightless. Administration and custody, escrow, securities issuance, and ombudsman / regulatory
              obligations add labor, control, and governance costs that a pure API gateway would not bear. The
              first-half-2025 ombudsman report, for example, shows 3,483 service interactions, 4.4-business-day average
              response time, and 2,435 external-channel demands, which is useful as a reminder that scale also creates
              support and control overhead.

              Capital adequacy looks directionally strong but not fully measurable from public data. QI Tech raised
              US$200 million in late 2023, then an additional US$50 million in April 2024 largely to finance the
              Singulare acquisition, and a further US$63 million in July 2025 to fund new solutions, support M&A, and
              strengthen cash position. Management has repeatedly framed acquisitions as a permanent part of the
              strategy, not a one-off event. That capital support lowers near-term existential financing risk,
              especially because General Atlantic and Across have kept participating, and because official sources say
              the company has been profitable since its first year. But the public record still omits the variables
              investors actually need for underwriting: current cash, monthly burn, operating cash flow, segment margin,
              debt / preferred obligations, and whether acquisitions or new regulated-product launches consume capital
              faster than internal profits replenish it.
