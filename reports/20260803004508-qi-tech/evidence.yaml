      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Realized contract pricing, discounts, attach rates, and renewal terms across major enterprise programs.
    whyItMatters: Platform breadth only becomes economics when pricing and retention are visible.
    diligencePath: Review at least three recent MSAs / order forms and one churned-customer postmortem.
    relatedQuestionRefs:
      - QI009
      - QI010
      - QI023
    relatedTableRefs:
