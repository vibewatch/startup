evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Current employee count by function and geography.
    whyItMatters: >-
      The run-date public record confirms scale in clients and throughput but not team size, which limits
      operating-leverage analysis.
    diligencePath: >-
      Request an up-to-date org snapshot or HRIS export during management diligence; cross-check with payroll vendor or
      LinkedIn aggregate.
    relatedQuestionRefs:
      - QO012
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board composition, observer rights, ownership percentages, and committee structure.
    whyItMatters: >-
      Control dynamics and investor protections are central to underwriting a private company that has raised multiple
      large rounds.
    diligencePath: Request the post-2025 cap table, shareholder agreement summary, and current board / observer roster.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Audited revenue, segment mix, margins, and cash-flow disclosures.
    whyItMatters: Bloomberg's projected revenue figure is directionally helpful but does not replace audited financial visibility.
    diligencePath: >-
      Obtain audited 2024-2025 statements and a segment-level management pack covering custody, banking, and
      credit-infrastructure revenue.
    relatedQuestionRefs:
      - QO013
  - type: conflicting-data
    severity: minor
    topic: custody-scale
    missingEvidence: >-
      A reconciled bridge between Anbima's US$17B / US$25B ranking lens and QI Tech's BRL121B / 1,000-fund disclosure
      after Singulare.
    whyItMatters: Different denominators and dates can create metric drift in later chapters if not normalized.
    diligencePath: >-
      Ask management for a dated metric glossary that maps custody, administration, and total AuM figures by
      methodology.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: minor
    topic: customer-count-current
    missingEvidence: Run-date customer count after integrating Singulare and subsequent 2025-2026 wins.
    whyItMatters: >-
      The 400+ customer disclosure is stale for current underwriting and may materially understate or overstate
      momentum.
    diligencePath: >-
      Request a current customer snapshot segmented by active enterprise, production implementation, pilot, and
      custody-only relationships.
    relatedQuestionRefs:
      - QO011
  - type: missing-source
    severity: minor
    topic: milestone-table-completeness
    missingEvidence: >-
      A fuller dated chronology for early operating milestones, internal governance changes, and exact acquisition close
      dates.
    whyItMatters: >-
      The milestone table is intentionally partial because the public record is strongest for financing and regulatory
      events, not every internal milestone.
    diligencePath: >-
      Ask management for a dated corporate timeline spanning foundation, licenses, acquisitions, new-product launches,
      and any material adverse events.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: tam-sam-som-boundary
    missingEvidence: >-
      A management-defined TAM / SAM / SOM bridge that maps QI Tech's actual monetizable layers across payments,
      lending, anti-fraud, and custody.
    whyItMatters: >-
      The retained public data proves a large market but mixes incompatible units, making valuation work fragile without
      an internal bridge.
    diligencePath: >-
      Request a board or fundraising deck that explicitly defines TAM, SAM, and SOM by product family with dated
      assumptions.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: take-rate
    missingEvidence: >-
      Product-level pricing, revenue capture, and implementation economics across Pix, credit, anti-fraud, and fund
      administration.
    whyItMatters: Market-rail scale only matters if QI Tech captures a durable share of value through pricing and retention.
    diligencePath: >-
      Request current pricing sheets, median implementation time, gross margin by module, and customer cohort revenue
      mix.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM004
  - type: stale
    severity: minor
    topic: open-finance-adoption
    missingEvidence: Direct official BCB or Open Finance Brasil run-date metrics for consents and business-account Pix mix.
    whyItMatters: >-
      The retained open-finance analysis is useful but secondary; primary metrics would increase confidence in adoption
      claims.
    diligencePath: Pull the latest BCB or Open Finance Brasil operational dashboard before any investment memo is finalized.
    relatedQuestionRefs:
      - QM008
      - QM009
  - type: private-evidence-only
    severity: minor
    topic: buyer-budget-cycle
    missingEvidence: Median sales cycle, procurement blockers, and module expansion path by customer segment.
    whyItMatters: The buyer map is well supported qualitatively but still lacks quantified sales-efficiency evidence.
    diligencePath: Ask management for win/loss data, implementation timelines, and expansion history across enterprise cohorts.
    relatedQuestionRefs:
      - QM011
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Real contract pricing, volume tiers, implementation fees, and minimum commitments for QI Tech and its full-stack
      peers.
    whyItMatters: >-
      Without real pricing and discount behavior, public feature comparison does not translate into revenue-quality or
      margin conclusions.
    diligencePath: >-
      Request redlined order forms or rate cards from QI Tech plus at least two competitor quotes from overlapping
      deals.
    relatedQuestionRefs:
      - QP021
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: win-loss
    missingEvidence: Win/loss rates, direct competitor overlap by deal, and reasons for displacement or upsell.
    whyItMatters: The public record shows who exists, not who actually wins the highest-value competitive situations.
    diligencePath: Request the past 12-18 months of late-stage competitive-deal data segmented by competitor and product family.
    relatedQuestionRefs:
      - QP022
  - type: private-evidence-only
    severity: minor
    topic: switching-cost
    missingEvidence: Customer architecture diagrams showing which modules are single-vendor versus multi-homed.
    whyItMatters: Switching-cost claims are strongest only if customers truly concentrate regulated workflows with one provider.
    diligencePath: Review 5-10 production customer deployments spanning fintech, enterprise, marketplace, and custody use cases.
    relatedQuestionRefs:
      - QP013
      - QP014
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: minor
    topic: custody-differentiation
    missingEvidence: Evidence on how often custody / FIDC administration directly changes competitive win rates.
    whyItMatters: >-
      The custody layer is the biggest apparent differentiator, but public proof of its commercial leverage is still
      thin.
    diligencePath: >-
      Ask management which closed deals required custody / fund-admin capabilities and what alternatives customers
      considered.
    relatedQuestionRefs:
      - QP023
      - QP025
    relatedTableRefs:
      - TP002
      - TP004
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited 2024-2025 income statements, current 2026 run rate, and segment-level gross margin.
    whyItMatters: Without audited current financials, revenue quality and margin path remain mostly narrative.
    diligencePath: Request auditor package, monthly management P&L, and segment contribution margin by business line.
    relatedQuestionRefs:
      - QI002
      - QI011
      - QI019
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Current cash balance, operating cash flow, monthly burn, and downside runway.
    whyItMatters: Capital adequacy cannot be underwritten from fundraising headlines alone.
    diligencePath: Request treasury pack, board budget, covenant schedule, and 12-month liquidity forecast.
