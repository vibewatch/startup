company:
  name: "QI Tech"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    QI Tech's public valuation markers rose from unicorn status at US$1.5B in April 2024 to US$2B+ in July 2025.
    The public case for that premium rests on three pillars: scarce licensed infrastructure in Brazil, broad multi-
    module product coverage across credit, banking, payments, fund administration, and risk, and visible operating scale
    signals such as R$170B under administration, R$107B credit issued, R$494B Pix processed, and 20M monthly analyses.
    The main problem is disclosure quality: public revenue detail is thin outside a Bloomberg Línea report citing a
    2024 projection of R$680M revenue and a 40% contribution from Singulare. That makes QI Tech look strategically
    valuable but only partially underwritten on unit economics and earnings power. Net: premium valuation appears
    directionally defensible, but only for investors comfortable underwriting growth, integration, and control quality
    with incomplete financial disclosure.

sections:
  - id: valuation-history-and-anchor-points
    title: "Valuation history and public anchor points"
    body: >-
      The clearest public valuation anchors are straightforward. QI Tech's April 2024 extension round placed the company
      at a US$1.5B valuation, confirming unicorn status. By July 2025, independent and official coverage described a
      US$63M extension that took valuation to US$2B+. That implies roughly one-third valuation growth in about sixteen
      months, with no evidence of a full repricing collapse despite tighter global fintech sentiment. On its face, that is
      a strong signal that investors see QI Tech less as a commodity BaaS layer and more as a scarce licensed
      infrastructure asset with multiple monetization vectors.

      Still, the anchor points have limits. Public materials do not disclose exact ownership dilution, liquidation
      preferences, revenue-recognition policies, EBITDA, or free cash flow. The 2025 step-up therefore cannot be read as
      a clean mark-to-market on transparent operating metrics alone. It is better read as a strategic scarcity valuation
      supported by growth narrative, product breadth, and capital-markets optionality after Singulare.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV001]
    figureRefs: [FV001]

  - id: operating-scale-support-for-valuation
    title: "Operating scale support for valuation"
    body: >-
      The best support for a premium valuation is that QI Tech does not look like a single-surface fintech. Portuguese
      product pages show the same broad operating footprint across modules: R$494B Pix transacted, R$98B protected
      against fraud, R$107B credit issued, and R$170B under administration. The administration-and-custody page adds
      1,000-plus funds and 740-plus FIDCs in portfolio. The Risk Solutions page adds 20M analyses per month and 90M
      validated registrations. These are company-claimed metrics, but they matter because they show scale evidence across
      payments, credit, administration, and data workflows rather than in a single product bucket.

      Bloomberg Línea's 2024 revenue projection of R$680M is the most concrete monetization clue, and the article said
      Singulare would represent around 40% of revenue after consolidation. That suggests the valuation is not only about
      transaction volume optics; it is also tied to real revenue scale and a more diversified business mix. The caution is
      that official English pages still show older, lower metrics, which weakens confidence in perfect disclosure hygiene.
      The valuation case benefits from operating breadth, but the underwriting discount should reflect metric drift and
      the lack of audited profitability disclosure.
    claimRefs: [CV011, CV012, CV013, CV014, CV015, CV016, CV017, CV018, CV019, CV020, CV021]
    tableRefs: [TV002, TV003]
    figureRefs: [FV002]

  - id: comps-scarcity-and-sector-context
    title: "Comparables, scarcity, and sector context"
    body: >-
      QI Tech should not be valued as a plain API tool. Brazilian financial-infrastructure assets with licensing or core
      processing depth have attracted meaningful capital and strategic interest: Summit Partners said Celcoin reached
      US$63M ARR in Q1 2024 and secured a US$125M investment; Startups.com.br said Zoop generated over R$700M revenue in
      calendar 2025 and expected to exceed R$1B in the fiscal year ending March 2026; Brazil Journal reported Matera
      raised R$500M from Warburg Pincus. Taken together, those datapoints support the idea that scaled infrastructure
      players in Brazil can command premium valuations even before pristine public profitability disclosure.

      QI Tech's differentiated angle is breadth across credit, banking, payments, risk, and fund administration inside a
      regulated perimeter. That combination is rare. It does not guarantee the valuation is cheap, but it makes a pure
      low-multiple software comparison too harsh. The right contextual read is that QI Tech belongs in the upper tier of
      strategic infrastructure assets, while still deserving a discount for private-company opacity, integration risk, and
      unresolved customer-quality questions.
    claimRefs: [CV022, CV023, CV024, CV025, CV026, CV027, CV028, CV029, CV030, CV031]
    tableRefs: [TV004]
    figureRefs: [FV003]

  - id: scenario-analysis-and-valuation-verdict
    title: "Scenario analysis and valuation verdict"
    body: >-
      The central valuation question is not whether QI Tech is good—it clearly has meaningful market position—but whether
      US$2B+ already prices most of the next leg of execution. In the bull case, product breadth converts into durable
      cross-sell, Singulare integration expands monetization, and the company's scale metrics turn into strong revenue and
      margin progression. In that world, a premium private-market valuation is defensible. In the bear case, public scale
      metrics overstate monetization quality, support / incident issues slow enterprise adoption, and multi-entity
      integration makes the operating model more complex than the revenue base can justify.

      With current public evidence, the most defensible stance is constructive but disciplined. QI Tech looks more likely
      overvalued on disclosure risk than on strategic quality. Put differently, the company probably deserves a premium to
      simpler fintech tooling peers, but investors should demand a diligence discount until they see audited revenue,
      segment gross margins, concentration, cohort retention, and incident-remediation evidence. Recommendation: positive
      strategic view, moderate valuation caution, and strong insistence on deeper diligence before treating US$2B+ as a
      fully proven fair value.
    claimRefs: [CV032, CV033, CV034, CV035, CV036, CV037, CV038, CV039, CV040]
    tableRefs: [TV005, TV006]
    figureRefs: [FV004]

