  claims:
    - { id: CV001, statement: "Public valuation anchors moved from US$1.5B in April 2024 to US$2B+ in July 2025.", type: third-party-reported, topic: anchor, sourceRefs: [SV001, SV002, SV003, SV004], confidence: high, freshness: recent, answersQuestionRefs: [QV001, QV002] }
    - { id: CV002, statement: "That implies roughly one-third valuation growth over about sixteen months.", type: inferred, topic: anchor, sourceRefs: [SV001, SV002], confidence: medium, freshness: recent, answersQuestionRefs: [QV002] }
    - { id: CV003, statement: "The step-up suggests investors continued to see scarcity value in QI Tech despite a tougher fintech backdrop.", type: inferred, topic: anchor, sourceRefs: [SV002, SV003, SV004, SV005], confidence: medium, freshness: recent, answersQuestionRefs: [QV001, QV003] }
    - { id: CV004, statement: "QI Tech's valuation case is being framed more as licensed infrastructure than as a generic BaaS wrapper.", type: inferred, topic: anchor, sourceRefs: [SV005, SV009], confidence: medium, freshness: current, answersQuestionRefs: [QV003, QV018] }
    - { id: CV005, statement: "The public anchor points do not disclose dilution, preferences, or detailed profitability, so they are imperfect fair-value markers.", type: inferred, topic: anchor, sourceRefs: [SV001, SV002, SV006], confidence: medium, freshness: current, answersQuestionRefs: [QV003, QV020] }
    - { id: CV006, statement: "Strategic scarcity matters because QI Tech combines licensed credit, payments, banking, risk, and administration infrastructure in one platform.", type: inferred, topic: scarcity, sourceRefs: [SV005, SV009, SV010, SV011, SV012, SV013, SV014, SV015], confidence: high, freshness: current, answersQuestionRefs: [QV018, QV019] }
    - { id: CV007, statement: "The Singulare acquisition strengthens the capital-markets and administration side of the valuation story.", type: inferred, topic: scarcity, sourceRefs: [SV006, SV027], confidence: medium, freshness: recent, answersQuestionRefs: [QV006, QV022] }
    - { id: CV008, statement: "Public valuation support is strongest when QI Tech is viewed as a multi-surface infrastructure asset.", type: inferred, topic: scarcity, sourceRefs: [SV005, SV006, SV009, SV015, SV016], confidence: medium, freshness: current, answersQuestionRefs: [QV012, QV019] }
    - { id: CV009, statement: "Public evidence is weaker for exact fair-value precision than for strategic desirability.", type: inferred, topic: scarcity, sourceRefs: [SV001, SV006, SV025], confidence: medium, freshness: current, answersQuestionRefs: [QV020, QV029] }
    - { id: CV010, statement: "A scarcity-premium reading is directionally plausible but not fully proven from public data alone.", type: inferred, topic: scarcity, sourceRefs: [SV005, SV006, SV020, SV022], confidence: medium, freshness: current, answersQuestionRefs: [QV019, QV026] }
    - { id: CV011, statement: "Portuguese product pages present a recurring operating metric set of R$494B Pix transacted, R$98B protected against fraud, R$107B credit issued, and R$170B under administration.", type: company-claimed, topic: scale, sourceRefs: [SV010, SV011, SV012, SV015], confidence: medium, freshness: current, answersQuestionRefs: [QV007, QV008] }
    - { id: CV012, statement: "The administration page adds more than 1,000 funds administered and more than 740 FIDCs in portfolio.", type: company-claimed, topic: scale, sourceRefs: [SV014], confidence: medium, freshness: current, answersQuestionRefs: [QV009] }
    - { id: CV013, statement: "The Risk Solutions page adds 20M analyses per month and 90M validated registrations.", type: company-claimed, topic: scale, sourceRefs: [SV013], confidence: medium, freshness: current, answersQuestionRefs: [QV010] }
    - { id: CV014, statement: "Those metrics indicate scale across multiple workflows rather than a single narrow product lane.", type: inferred, topic: scale, sourceRefs: [SV010, SV011, SV012, SV013, SV014], confidence: medium, freshness: current, answersQuestionRefs: [QV007, QV008, QV012] }
    - { id: CV015, statement: "Capital-markets pages reinforce that QI Tech is monetizing infrastructure beyond basic accounts and payments.", type: inferred, topic: scale, sourceRefs: [SV015, SV016], confidence: medium, freshness: current, answersQuestionRefs: [QV012] }
    - { id: CV016, statement: "The white-label bank, onboarding, credit-engine, and signature pages support a land-and-expand monetization narrative across modules.", type: inferred, topic: scale, sourceRefs: [SV017, SV018, SV019, SV031], confidence: medium, freshness: current, answersQuestionRefs: [QV008, QV012] }
    - { id: CV017, statement: "This breadth is supportive of premium lifetime value per enterprise account even though exact ARPA is undisclosed.", type: inferred, topic: scale, sourceRefs: [SV011, SV014, SV017, SV019], confidence: medium, freshness: current, answersQuestionRefs: [QV012, QV020] }
    - { id: CV018, statement: "Bloomberg Línea provided the most concrete revenue datapoint in the retained set: a projection of R$680M revenue for 2024.", type: third-party-reported, topic: monetization, sourceRefs: [SV006], confidence: medium, freshness: recent, answersQuestionRefs: [QV004, QV005] }
    - { id: CV019, statement: "The same article said Singulare would account for about 40% of revenue after consolidation.", type: third-party-reported, topic: monetization, sourceRefs: [SV006], confidence: medium, freshness: recent, answersQuestionRefs: [QV006] }
    - { id: CV020, statement: "That revenue evidence supports real monetization scale but does not reveal audited margins or cash generation.", type: inferred, topic: monetization, sourceRefs: [SV006], confidence: medium, freshness: current, answersQuestionRefs: [QV005, QV020] }
    - { id: CV021, statement: "Metric drift across English and Portuguese product pages should reduce confidence in perfect disclosure hygiene.", type: inferred, topic: disclosure, sourceRefs: [SV014, SV028, SV029, SV030], confidence: medium, freshness: current, answersQuestionRefs: [QV011, QV029] }
    - { id: CV022, statement: "Brazilian financial-infrastructure assets continue to attract meaningful capital and strategic interest.", type: inferred, topic: comps, sourceRefs: [SV020, SV021, SV022, SV023, SV025], confidence: high, freshness: current, answersQuestionRefs: [QV013, QV019] }
    - { id: CV023, statement: "Summit Partners said Celcoin reached US$63M ARR in Q1 2024 and raised a US$125M investment.", type: third-party-reported, topic: celcoin, sourceRefs: [SV020], confidence: medium, freshness: recent, answersQuestionRefs: [QV014] }
    - { id: CV024, statement: "Startups.com.br said Zoop generated more than R$700M revenue in calendar 2025 and expected to exceed R$1B in the fiscal year ending March 2026.", type: third-party-reported, topic: zoop, sourceRefs: [SV021], confidence: medium, freshness: recent, answersQuestionRefs: [QV015] }
    - { id: CV025, statement: "Brazil Journal reported Matera raised R$500M from Warburg Pincus.", type: third-party-reported, topic: matera, sourceRefs: [SV022], confidence: medium, freshness: recent, answersQuestionRefs: [QV016] }
    - { id: CV026, statement: "Comparable-context evidence supports premium sector appetite but not a precise multiple for QI Tech.", type: inferred, topic: comps, sourceRefs: [SV020, SV021, SV022, SV025], confidence: medium, freshness: current, answersQuestionRefs: [QV013, QV018] }
    - { id: CV027, statement: "QI Tech likely deserves a premium to simpler fintech tooling peers because it combines licensing and breadth.", type: inferred, topic: comps, sourceRefs: [SV005, SV009, SV014, SV015, SV016], confidence: medium, freshness: current, answersQuestionRefs: [QV018, QV027] }
    - { id: CV028, statement: "Celcoin, Zoop, and Matera together show that scaled Brazilian infrastructure businesses can attract premium capital without full public-equity-style disclosure.", type: inferred, topic: comps, sourceRefs: [SV020, SV021, SV022], confidence: medium, freshness: current, answersQuestionRefs: [QV013, QV019] }
    - { id: CV029, statement: "The broader embedded-finance market remains large enough to support strategic scarcity premiums for local rails and regulated infrastructure.", type: inferred, topic: market-context, sourceRefs: [SV025, SV026], confidence: medium, freshness: current, answersQuestionRefs: [QV019] }
    - { id: CV030, statement: "Pismo is relevant mainly as proof that core financial-infrastructure assets in the region can have strategic value beyond near-term software multiples.", type: inferred, topic: pismo, sourceRefs: [SV023, SV025], confidence: low, freshness: current, answersQuestionRefs: [QV017] }
    - { id: CV031, statement: "The comp set supports a premium-context reading for QI Tech, but not an unquestioned US$2B+ verdict. ", type: inferred, topic: comps, sourceRefs: [SV020, SV021, SV022, SV025], confidence: medium, freshness: current, answersQuestionRefs: [QV018, QV026] }
    - { id: CV032, statement: "The bull case requires sustained cross-sell, successful Singulare integration, and conversion of operating scale into durable revenue and margins.", type: inferred, topic: bull-case, sourceRefs: [SV006, SV007, SV014, SV015, SV016], confidence: medium, freshness: current, answersQuestionRefs: [QV024] }
    - { id: CV033, statement: "The base case is that QI Tech is strategically premium but still deserves a diligence discount because disclosure is incomplete.", type: inferred, topic: base-case, sourceRefs: [SV001, SV006, SV021], confidence: medium, freshness: current, answersQuestionRefs: [QV023, QV026] }
    - { id: CV034, statement: "The bear case is that public scale metrics overstate monetization quality or margin durability.", type: inferred, topic: bear-case, sourceRefs: [SV006, SV011, SV013, SV021], confidence: medium, freshness: current, answersQuestionRefs: [QV025] }
    - { id: CV035, statement: "Incident, support, and control-quality questions can matter to valuation because they affect enterprise trust and expansion pace.", type: inferred, topic: risk-discount, sourceRefs: [SV007, SV013, SV032], confidence: medium, freshness: current, answersQuestionRefs: [QV021, QV029] }
    - { id: CV036, statement: "The biggest valuation discount factors are missing audited revenue, margins, concentration, retention, and remediation evidence.", type: inferred, topic: risk-discount, sourceRefs: [SV006, SV007, SV021, SV032], confidence: medium, freshness: current, answersQuestionRefs: [QV020, QV029, QV030] }
    - { id: CV037, statement: "US$2B+ is easier to defend on strategic quality than on fully transparent financial proof.", type: inferred, topic: verdict, sourceRefs: [SV002, SV005, SV006, SV025], confidence: medium, freshness: current, answersQuestionRefs: [QV026] }
    - { id: CV038, statement: "The most defensible recommendation is constructive on the company and moderately cautious on the valuation. ", type: inferred, topic: verdict, sourceRefs: [SV001, SV005, SV006, SV025], confidence: medium, freshness: current, answersQuestionRefs: [QV026] }
    - { id: CV039, statement: "Investors should demand more diligence before treating US$2B+ as fully proven fair value. ", type: inferred, topic: verdict, sourceRefs: [SV006, SV007, SV021], confidence: medium, freshness: current, answersQuestionRefs: [QV030] }
    - { id: CV040, statement: "The valuation verdict is positive strategic view, moderate valuation caution, and high need for diligence on financial quality. ", type: inferred, topic: verdict, sourceRefs: [SV005, SV006, SV025], confidence: medium, freshness: current, answersQuestionRefs: [QV026, QV030] }

