callouts:
  - calloutType: strength
    title: "QI Tech looks more like a scarce platform asset than a narrow BaaS wrapper"
    body: >-
      The combination of licensed credit, payments, administration / custody, risk, and capital-markets infrastructure is
      the core argument for a premium valuation.
    claimRefs: [CV006, CV011, CV012, CV013, CV022, CV027]

  - calloutType: risk
    title: "The valuation is easier to believe strategically than financially"
    body: >-
      Public scale and funding signals are strong, but the absence of audited revenue, margins, and concentration data
      means investors still have to underwrite a significant disclosure discount.
    claimRefs: [CV018, CV019, CV020, CV026, CV033, CV036]

  - calloutType: insight
    title: "Scarcity premium is real in Brazilian financial infrastructure"
    body: >-
      Capital raised by Celcoin and Matera, revenue scale at Zoop, and the strategic outcome around Pismo all point to a
      sector where quality assets can command high valuations.
    claimRefs: [CV023, CV024, CV025, CV028, CV029, CV030]

