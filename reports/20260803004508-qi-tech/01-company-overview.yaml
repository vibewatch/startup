company:
  name: "QI Tech"

chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    QI Tech is a São Paulo-based financial infrastructure fintech founded in 2018 that combines a Brazilian Direct Credit
    Society (SCD) license with brokerage / securities-distribution capability to let enterprises launch credit, banking,
    payment, and fund-structuring products through APIs. Official and independent sources confirm a funding arc from a
    US$50M 2021 Series A led by GIC, to a US$200M 2023 Series B led by General Atlantic, to extensions in 2024 and 2025
    that pushed the company to unicorn status and then above a US$2B valuation. Public evidence also shows rapid scale in
    clients, anti-fraud throughput, and FIDC custody after the Singulare acquisition, but leaves material gaps around
    current headcount, full governance composition, exact cap-table ownership, and audited revenue.

sections:
  - id: identity-and-regulatory-positioning
    title: "Identity, founding, and regulatory positioning"
    body: >-
      QI Tech is a privately held Brazilian financial infrastructure company headquartered in São Paulo. The public legal
      footprint shown across its website footer and corporate pages is QI Sociedade de Crédito Direto S.A. for the credit
      institution and QI CTVM Ltda. for the securities broker-dealer arm, both operating from Pátio Rebouças in Jardim
      Paulistano. The company says it was founded in 2018 and built to act as a technological and regulatory layer for
      businesses that want to embed financial products without becoming full-stack banks themselves.

      The regulatory claim is central to the business model. QI Tech states that it was the first Direct Credit Society
      (SCD) approved by the Banco Central do Brasil and later became the first fintech to also hold a Securities
      Distributor / broker-dealer (DTVM / CTVM) license. Those permissions let QI Tech combine loan origination,
      payment flows, digital-account features, and capital-markets infrastructure in one stack. General Atlantic's 2023
      investment release describes this as a "one-stop-shop" that wraps compliance, onboarding, credit underwriting,
      transfers, Pix, and FIDC structuring into modular APIs, while the company homepage frames the offer as financial
      infrastructure similar to an AWS-like utility for regulated finance.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
      - CO009
      - CO041
      - CO044
    figureRefs:
      - FO002

  - id: founders-leadership-and-governance
    title: "Founders, leadership, and governance"
    body: >-
      The founding trio disclosed in investment announcements is Pedro Mac Dowell, Marcelo Bentivoglio, and Marcelo
      Buosi. Public sources consistently identify Mac Dowell as founder and CEO, Bentivoglio as co-founder and CFO, and
      Buosi as co-founder / operating executive. The 2023 Series B communication notes that the round was completed on a
      pro-rata basis, preserving founder control without secondaries or cap-table exits. Public evidence further shows
      that QI Tech's leadership bench has expanded through acquisitions: Daniel Doll Lemos, formerly associated with
      Singulare, remained visible in post-acquisition communications, while Emílio Moreira was cited as the executive
      leading the Singulare integration.

      Governance visibility is still incomplete relative to institutional expectations. The public record confirms major
      shareholders such as GIC, General Atlantic, and Across Capital, but does not disclose precise ownership stakes,
      board seats, observer rights, or committee structure. That creates classic key-person dependence on Mac Dowell and
      the small founding group, especially because external evidence ties strategic direction, fundraising, M&A, and new
      product launches closely to the founder-CEO and CFO.
    claimRefs:
      - CO010
      - CO011
      - CO012
      - CO018
      - CO019
      - CO020
      - CO036
    tableRefs:
      - TO002

  - id: funding-history-and-capital-base
    title: "Funding history, valuation, and capital base"
    body: >-
      QI Tech's capital formation has been unusually strong for a private Brazilian infrastructure fintech. In November
      2021, the company announced a US$50M Series A led by GIC, at the time calling it one of the largest Series A
      rounds in Latin America. The 2023 Series B then brought US$200M (R$1B) led by General Atlantic, with Across
      Capital doubling its earlier position. General Atlantic's official release added an important quality signal by
      saying the company had already been profitable since its first year of operation, although the supporting audited
      financial statements are not public.

      In April 2024, QI Tech announced a US$50M Series B extension backed by General Atlantic and Across Capital. The
      company and subsequent coverage state that the extension took QI Tech to roughly a US$1.5B valuation and
      formalized unicorn status. In July 2025, the company announced another US$63M Series B extension, again led by
      General Atlantic with Across participating for a fourth consecutive time. Independent and official coverage frame
      the 2025 extension as capital for new products and acquisitions, and place the post-money valuation above US$2B.
      Across the disclosed 2021, 2023, 2024, and 2025 rounds, the public primary-source funding total is US$363M.
    claimRefs:
      - CO013
      - CO014
      - CO015
      - CO016
      - CO017
      - CO021
