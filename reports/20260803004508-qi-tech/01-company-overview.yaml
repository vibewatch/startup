callouts:
  - calloutType: strength
    title: "Regulatory stack + API breadth create real platform leverage"
    body: >-
      QI Tech is not just a single-product API vendor. The combination of SCD licensing, securities-distribution / fund
      infrastructure, and a broad operational stack lets it package lending, payments, onboarding, anti-fraud, custody,
      and embedded banking into one relationship for enterprise customers. That breadth helps explain why acquisitions
      such as Singulare and Builders Bank have strategic value well beyond simple GMV expansion.
    claimRefs:
      - CO004
      - CO005
      - CO008
      - CO009
      - CO018
      - CO019

  - calloutType: risk
    title: "Public scale is strong, but audited financial transparency is still thin"
    body: >-
      Official releases support the fundraising, client-count, and operating-scale narrative, but the company does not
      publish audited revenue, current headcount, cap-table ownership, or board structure. Even the custody / assets
      metrics require careful handling because different vintages use different denominators (Anbima USD framing versus
      Uqbar / post-Singulare BRL disclosures). Investors can underwrite growth momentum, but not yet the full quality of
      earnings or governance.
    claimRefs:
      - CO016
      - CO021
      - CO030
      - CO031
      - CO032

  - calloutType: insight
    title: "Customer case studies show deep workflow ownership rather than light integrations"
    body: >-
      The strongest evidence of durability is not the funding history but the reference implementations. Vivo Pay, Jeeves,
      Wellhub, and Bettr all use QI Tech for regulated workflows that go beyond simple payments routing, including local
      wallet / onboarding, anti-fraud, credit issuance, fund administration, and FIDC structuring. That suggests higher
      switching costs than a pure gateway or API utility typically commands.
    claimRefs:
      - CO021
      - CO033
      - CO034
      - CO035
      - CO036

