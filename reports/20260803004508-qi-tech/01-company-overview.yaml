  - id: scale-products-and-operating-breadth
    title: "Scale, product breadth, and operating footprint"
    body: >-
      QI Tech's product footprint spans banking-as-a-service, white-label banking, payments-as-a-service,
      lending-as-a-service, anti-fraud, onboarding, and FIDC administration / custody. The official product pages claim
      website-snapshot scale of US$88B in Pix transactions, US$19B in credit issued, US$18B protected against fraud, and
      US$28B under administration. The administration-and-custody page narrows that specifically to more than 1,100
      funds and more than 700 FIDCs on the platform. These figures are website claims rather than audited disclosures,
      but they are directionally consistent with other scale signals from independent media and client case studies.

      The 2025 Series B extension materials add richer operating metrics: over 20 million anti-fraud analyses per
      month, more than 90 million verified registrations, and approximately US$13M in potentially fraudulent flows
      blocked monthly. The same source says that, after Singulare, QI Tech became Brazil's leading FIDC custodian with
      US$17B in assets under custody and US$25B in assets under management according to Anbima's July 2025 ranking.
      Separately, the company stated when Banco Central approved the Singulare deal that the combined platform would be
      managing over 1,000 funds and BRL121B in assets, including more than 650 FIDCs, using a 2024 Uqbar framing.
      These disclosures are not perfectly comparable, but together they show a business that grew from an API-led credit
      infrastructure vendor into a multi-license financial-operations platform with meaningful capital-markets scale.
    claimRefs:
      - CO023
      - CO024
      - CO025
      - CO026
      - CO027
      - CO028
      - CO029
      - CO030
      - CO031
