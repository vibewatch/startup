  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: headcount
      missingEvidence: "Current employee count by function and geography."
      whyItMatters: "The run-date public record confirms scale in clients and throughput but not team size, which limits operating-leverage analysis."
      diligencePath: "Request an up-to-date org snapshot or HRIS export during management diligence; cross-check with payroll vendor or LinkedIn aggregate."
      relatedQuestionRefs: [QO012]
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: "Board composition, observer rights, ownership percentages, and committee structure."
      whyItMatters: "Control dynamics and investor protections are central to underwriting a private company that has raised multiple large rounds."
      diligencePath: "Request the post-2025 cap table, shareholder agreement summary, and current board / observer roster."
      relatedQuestionRefs: [QO024]
      relatedTableRefs: [TO002, TO003]
    - type: private-evidence-only
      severity: material
      topic: revenue-quality
      missingEvidence: "Audited revenue, segment mix, margins, and cash-flow disclosures."
      whyItMatters: "Bloomberg's projected revenue figure is directionally helpful but does not replace audited financial visibility."
      diligencePath: "Obtain audited 2024-2025 statements and a segment-level management pack covering custody, banking, and credit-infrastructure revenue."
      relatedQuestionRefs: [QO013]
    - type: conflicting-data
      severity: minor
      topic: custody-scale
      missingEvidence: "A reconciled bridge between Anbima's US$17B / US$25B ranking lens and QI Tech's BRL121B / 1,000-fund disclosure after Singulare."
      whyItMatters: "Different denominators and dates can create metric drift in later chapters if not normalized."
      diligencePath: "Ask management for a dated metric glossary that maps custody, administration, and total AuM figures by methodology."
      relatedQuestionRefs: [QO026]
      relatedTableRefs: [TO003]
    - type: private-evidence-only
      severity: minor
      topic: customer-count-current
      missingEvidence: "Run-date customer count after integrating Singulare and subsequent 2025-2026 wins."
      whyItMatters: "The 400+ customer disclosure is stale for current underwriting and may materially understate or overstate momentum."
      diligencePath: "Request a current customer snapshot segmented by active enterprise, production implementation, pilot, and custody-only relationships."
      relatedQuestionRefs: [QO011]
    - type: missing-source
      severity: minor
      topic: milestone-table-completeness
      missingEvidence: "A fuller dated chronology for early operating milestones, internal governance changes, and exact acquisition close dates."
      whyItMatters: "The milestone table is intentionally partial because the public record is strongest for financing and regulatory events, not every internal milestone."
      diligencePath: "Ask management for a dated corporate timeline spanning foundation, licenses, acquisitions, new-product launches, and any material adverse events."
      relatedQuestionRefs: [QO026]
      relatedTableRefs: [TO004]
