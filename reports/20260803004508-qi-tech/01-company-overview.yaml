  - id: milestones-customer-proof-and-adverse-signals
    title: "Milestones, customer proof, and adverse signals"
    body: >-
      Customer proof in the public record is broader than a typical private fintech discloses. QI Tech's 2024 unicorn
      announcement said the company served more than 400 clients including Vivo, Unidas, 99, and QuintoAndar. Later
      materials and case studies show how that abstract claim turns into actual workloads: Vivo Pay built a financial
      vertical that had already generated more than R$400M in cumulative revenue by the end of 2025; Wellhub launched a
      R$100M credit vehicle for gyms and wellness partners using QI Tech infrastructure; Jeeves used QI Tech for local
      wallet / onboarding and note-issuance flows after entering Brazil in 2024; and Bettr / Ant International partnered
      with QI Tech to expand credit for merchants and consumers in Brazilian e-commerce. These examples support the view
      that QI Tech sells deep embedded workflows rather than one-off point products.

      The public record also contains meaningful adverse signals. Banco Central-linked reporting in March 2025 said data
      connected to 25,349 Pix keys at QI SCD had been exposed, though not sensitive balances or passwords. Separate 2026
      Times Brasil reporting linked the company's name to market rumors around a problematic FIDC portfolio tied to a
      firm under investigation; QI Tech denied any active negotiations. The same article also referenced a court decision
      that maintained a block on QI Tech resources in litigation related to the collapse of the Canis Majoris group.
      None of these items amount to a disclosed existential impairment, but they are sufficient to mark regulatory,
      reputational, and legal monitoring as a continuing diligence priority.
    claimRefs:
      - CO034
      - CO035
      - CO037
      - CO038
      - CO039
      - CO040
    tableRefs:
      - TO004

