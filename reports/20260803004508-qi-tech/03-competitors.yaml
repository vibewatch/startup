  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: "Real contract pricing, volume tiers, implementation fees, and minimum commitments for QI Tech and its full-stack peers."
      whyItMatters: "Without real pricing and discount behavior, public feature comparison does not translate into revenue-quality or margin conclusions."
      diligencePath: "Request redlined order forms or rate cards from QI Tech plus at least two competitor quotes from overlapping deals."
      relatedQuestionRefs: [QP021]
      relatedTableRefs: [TP003]
    - type: private-evidence-only
      severity: material
      topic: win-loss
      missingEvidence: "Win/loss rates, direct competitor overlap by deal, and reasons for displacement or upsell."
      whyItMatters: "The public record shows who exists, not who actually wins the highest-value competitive situations."
      diligencePath: "Request the past 12-18 months of late-stage competitive-deal data segmented by competitor and product family."
      relatedQuestionRefs: [QP022]
    - type: private-evidence-only
      severity: minor
      topic: switching-cost
      missingEvidence: "Customer architecture diagrams showing which modules are single-vendor versus multi-homed."
      whyItMatters: "Switching-cost claims are strongest only if customers truly concentrate regulated workflows with one provider."
      diligencePath: "Review 5-10 production customer deployments spanning fintech, enterprise, marketplace, and custody use cases."
      relatedQuestionRefs: [QP013, QP014]
      relatedTableRefs: [TP004]
    - type: private-evidence-only
      severity: minor
      topic: custody-differentiation
      missingEvidence: "Evidence on how often custody / FIDC administration directly changes competitive win rates."
      whyItMatters: "The custody layer is the biggest apparent differentiator, but public proof of its commercial leverage is still thin."
      diligencePath: "Ask management which closed deals required custody / fund-admin capabilities and what alternatives customers considered."
      relatedQuestionRefs: [QP023, QP025]
      relatedTableRefs: [TP002, TP004]
