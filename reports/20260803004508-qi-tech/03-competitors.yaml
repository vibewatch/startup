company:
  name: "QI Tech"

chapter:
  number: 3
  title: "Competitors"
  summary: >-
    QI Tech competes in a crowded but fragmented Brazilian infrastructure stack rather than against one single lookalike.
    Direct overlap is highest with full-stack embedded-finance vendors such as Celcoin, Dock, and Zoop; adjacent overlap
    comes from open-finance specialist Pluggy and broader core-banking / ledger platforms such as Matera and Pismo.
    QI Tech's clearest differentiation is the combination of local regulatory licenses, credit / anti-fraud / payments
    modules, and post-Singulare fund-administration capability, but the market is crowded enough that moat claims depend
    more on integration depth, trust, and switching cost than on any one feature list.

sections:
  - id: competitive-landscape-and-solution-classes
    title: "Landscape: direct peers, adjacents, substitutes, and likely entrants"
    body: >-
      The relevant competitive landscape has at least six classes. First are direct embedded-finance infrastructure peers
      selling a broad enterprise stack: Celcoin, Dock, and Zoop. Second are adjacent data / connectivity players such as
      Pluggy that cover a narrower but strategically important slice of the workflow. Third are core-platform vendors such
      as Matera and Pismo that can power digital banks, card issuing, wallets, and real-time payments, even when they do
      not mirror QI Tech's regulatory wrapper or custody angle. Fourth are incumbent banks and sponsor-bank
      relationships that let enterprises launch financial products through partnerships rather than software-led
      infrastructure. Fifth are fragmented multi-vendor architectures where a buyer combines open-finance, KYC, payment,
      and credit tools from different suppliers. Sixth is internal build, especially for large enterprises with capital
      and patience.

      QI Tech therefore does not win by existing alone; it wins when a buyer prefers an integrated, regulated local stack
      over a mix-and-match architecture or a global core-banking platform. That distinction matters because many rivals
      can match one module, but fewer can match regulated credit origination, Pix, anti-fraud, onboarding, and FIDC / fund
      administration under one local operating umbrella.
    claimRefs:
      - CP001
      - CP002
      - CP006
      - CP008
      - CP012
      - CP016
      - CP017
      - CP024
      - CP033
      - CP035
    figureRefs:
      - FP001

  - id: direct-peer-profiles-and-product-scope
    title: "Direct peer profiles: Celcoin, Dock, and Zoop"
    body: >-
      Celcoin is the most obviously broad direct peer in the retained set. Its own materials and Summit Partners' funding
      release show a modular platform spanning banking, payments, and credit, including BaaS, liquidating bank, white-label
      cards, open-insurance and regulatory modules, Pix and ITP functionality, CCB, escrow, commercial notes, and
      payroll-linked credit products. The scale disclosures are also meaningful: more than 6,000 business customers,
      over 400 financial-industry customers, more than 5,000 non-financial companies, US$63M ARR in Q1-2024, and more
      than 200 million monthly Pix transactions.

      Dock competes from a different angle: a larger, older platform emphasizing payment infrastructure, cards, fraud
      prevention, acquiring, and white-label banking. Dock's public pages stress 25-plus years of operating history,
      direct Pix participation, and a very broad payment-plus-cards portfolio. Zoop, now explicitly tied to the iFood
      ecosystem in its public positioning, focuses on unified commerce and embedded payments but also has payment-institution
      licensing, direct Pix / core-banking capability, and notable scale in processed payments, marketplaces, and merchant
      endpoints. Relative to QI Tech, Celcoin looks closest on modular breadth, Dock on enterprise-grade payment and card
      infrastructure, and Zoop on ecosystem / marketplace distribution.
    claimRefs:
      - CP002
      - CP003
      - CP004
      - CP005
      - CP006
      - CP007
      - CP008
      - CP009
      - CP010
      - CP011
      - CP019
      - CP026
    tableRefs:
      - TP001
      - TP002
    figureRefs: []

  - id: adjacent-platforms-pricing-and-build-versus-buy
    title: "Adjacents, pricing signals, and build-versus-buy alternatives"
    body: >-
      Pluggy demonstrates how a narrower competitor can still be strategically relevant. It is positioned around reading
      banking data and moving money in Brazil, is authorized by Banco Central as an ITP, and publicly advertises one of
      the few visible pricing schedules in the set: data products starting at R$2,500 per month and payments products
      starting at R$500 per month. That public price transparency makes Pluggy a useful benchmark for point-solution
      economics, even though its scope is narrower than QI Tech's. Matera and Pismo are different again: both present as
      deep platform layers for banks and large financial institutions, with stronger emphasis on core modernization,
      ledger / wallet performance, and card issuing than on local sponsor-like regulatory packaging.

      For many buyers the real alternative is not one named competitor but a hybrid architecture. A company can combine a
      data connector such as Pluggy, a bank or sponsor arrangement, a payments provider such as Zoop or Dock, and an
      internally built product layer. That keeps optionality high but raises integration, compliance, and vendor-management
      burden. QI Tech's integrated pitch is strongest when the buyer values reduced orchestration complexity more than it
      values picking the cheapest point tool in each category.
    claimRefs:
      - CP012
      - CP013
      - CP014
      - CP015
      - CP016
      - CP017
      - CP018
      - CP021
      - CP022
      - CP023
      - CP024
      - CP031
      - CP032
    tableRefs:
      - TP003
    figureRefs:
      - FP002

  - id: switching-costs-moat-durability-and-competitive-risks
    title: "Switching cost, moat durability, and competitive risk"
    body: >-
      QI Tech's moat is not strongest where the market is most transparent. Public pages make many rivals sound broad,
      modern, and AI- or API-native. The more defensible edge appears where multiple regulated workflows are bundled:
      credit origination, anti-fraud, onboarding, Pix, debt instruments, and post-Singulare custody / administration.
      Once a client runs production flows across several of those layers, switching cost rises because legal, treasury,
      risk, and product teams all need to move in sync. This is especially true in credit and fund-operations contexts,
      where internal controls and regulatory process matter as much as front-end UX.

      The risks are also clear. Breadth can become a commodity if rivals such as Celcoin keep adding modules and if large
      platforms like Matera, Pismo, or Dock convince buyers to treat finance infrastructure as a general platform layer
      rather than a local regulated specialist. Pluggy's public pricing also shows how point-solution categories can turn
      into price-led, transparent software markets faster than integrated stacks do. The core diligence question is not
      whether QI Tech has competitors — it plainly does — but whether its multi-license and custody-linked stack keeps it
      on the short list when buyers want fewer counterparties and deeper local execution.
    claimRefs:
      - CP020
      - CP021
      - CP022
      - CP023
      - CP025
      - CP026
      - CP027
      - CP028
      - CP029
      - CP030
      - CP034
      - CP035
    tableRefs:
      - TP004
    figureRefs:
      - FP003

