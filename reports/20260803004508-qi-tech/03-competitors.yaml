callouts:
  - calloutType: strength
    title: "QI Tech's most credible moat is stack integration, not feature novelty"
    body: >-
      Many rivals now claim modular APIs, Pix, or banking infrastructure. The harder thing to replicate is a local
      production stack that spans credit, anti-fraud, onboarding, payments, and post-Singulare custody under one
      operating model. That is where QI Tech looks strongest in the retained set.
    claimRefs:
      - CP020
      - CP021
      - CP027

  - calloutType: risk
    title: "Public feature lists make breadth look more common than it may be"
    body: >-
      Celcoin, Dock, Zoop, Pluggy, Matera, and Pismo all market modern, scalable, API-led financial infrastructure. If
      buyers increasingly decompose projects into modules, QI Tech's bundling advantage can compress into a pricing and
      implementation contest rather than a moat.
    claimRefs:
      - CP016
      - CP022
      - CP023
      - CP034
      - CP035

  - calloutType: insight
    title: "Pluggy's public pricing is strategically useful even though Pluggy is narrower"
    body: >-
      Pluggy is not a full substitute for QI Tech, but its public price floors reveal how transparent and affordable a
      narrow connector can look compared with custom-priced enterprise stacks. That is a useful reminder that buyers may
      benchmark one module against cheaper specialists even when they ultimately purchase a broader platform.
    claimRefs:
      - CP012
      - CP015
      - CP023
      - CP030

