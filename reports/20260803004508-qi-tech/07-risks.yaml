callouts:
  - calloutType: risk
    title: "The data incident is the single most important adverse proof point"
    body: >-
      The March 2025 incident does not destroy the thesis, but it materially raises the bar for diligence on remediation,
      governance, and enterprise-trust preservation.
    claimRefs: [CR019, CR020, CR023, CR024, CR025]

  - calloutType: insight
    title: "Policy maturity is visible; control effectiveness is the missing layer"
    body: >-
      QI Tech publishes more governance documentation than many peers, but investors still need audit, incident, and
      operational evidence to underwrite whether those controls work at scale.
    claimRefs: [CR010, CR011, CR012, CR013, CR014, CR015, CR016]

