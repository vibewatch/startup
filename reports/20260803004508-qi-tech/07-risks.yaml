company:
  name: "QI Tech"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    QI Tech's risk profile is typical of a fast-scaling, deeply regulated financial-infrastructure company: lower basic
    licensing risk than an unregulated fintech, but materially higher compliance, control, data-governance, and
    execution burden. The public policy stack is relatively mature for a private company—privacy, cybersecurity, AML,
    anti-corruption, ethics, terms of use, transparency portal, and recurring ombudsman reporting are all visible. That
    is a positive signal. The main adverse evidence is the March 2025 data incident involving 25.34 thousand people and
    the mediocre ombudsman satisfaction metrics. Combined with an acquisition-led expansion strategy and evolving Banco
    Central priorities around Pix, fraud prevention, Open Finance, and AI oversight, the result is a balanced but not
    low-risk picture. The key diligence question is not whether controls exist on paper; it is whether they scale cleanly
    across a growing multi-entity platform.

sections:
  - id: regulatory-and-licensing-risk
    title: "Regulatory and licensing risk: advantaged position, heavier burden"
    body: >-
      QI Tech's most important structural risk fact is also one of its advantages: it operates with real regulated
      licenses rather than trying to wrap regulated activity around a lightly supervised software shell. Public materials,
      terms, and investor releases consistently frame the company as the first SCD approved by Banco Central and, after
      Singulare, as a platform spanning additional capital-markets permissions. That lowers the basic risk of sudden
      business-model invalidation relative to unlicensed embedded-finance vendors. But it replaces licensing fragility
      with operating burden. Once the company sits inside a regulated perimeter, every new product, partner, or workflow
      brings conduct, AML, complaints, fraud, prudential, and data-governance obligations.

      This burden is unlikely to shrink. External legal commentary says Banco Central's 2025-2026 agenda includes Open
      Finance changes, virtual-asset rules, AI monitoring, expanded Pix functionality, fraud prevention, and prudential
      reviews. For a company whose product strategy explicitly rides on credit, payments, onboarding, and data workflows,
      that means regulatory change is not background noise; it is part of the roadmap. QI Tech therefore benefits from
      its licensed posture, but it also inherits a recurring implementation tax every time regulation evolves.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
    tableRefs:
      - TR001
      - TR002
    figureRefs:
      - FR001

  - id: control-environment-and-governance-risk
    title: "Control environment and governance risk"
    body: >-
      On paper, QI Tech's control environment is more developed than many startup peers. The retained set shows a privacy
      notice built on LGPD, a cybersecurity policy referencing ISO/IEC 27001, NIST CSF, CMN 4.893/2021 and BCB 85/2021,
      an AML/CFT policy with named governance roles and committees, an anti-corruption policy with public-sector and
      gifts guidance, a code of ethics with whistleblowing posture, and a transparency portal that centralizes the public
      control stack. Those are meaningful positives because they imply governance has been formalized as the company scaled.

      But policy visibility is not control proof. None of the public documents prove operating effectiveness, incident
      response maturity, segregation of duties quality, or audit-closure performance. The strongest charitable read is
      that QI Tech has built the right scaffolding for a regulated platform. The skeptical read is that scaling quickly,
      integrating acquisitions, and broadening product scope can easily outrun the day-to-day quality of execution behind
      the policies. This is the classic fintech-infrastructure risk gap: governance documents can be strong while control
      assurance remains hard to underwrite from public evidence alone.
    claimRefs:
      - CR010
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
      - CR016
      - CR017
      - CR018
    tableRefs:
      - TR003
    figureRefs:
      - FR002

  - id: data-protection-cyber-and-reputation-risk
    title: "Data protection, cyber, and reputation risk"
    body: >-
      The most concrete adverse risk event in the retained set is the March 2025 incident involving 25.34 thousand
      people tied to QI Sociedade de Crédito. Independent coverage and Banco Central's incident page corroborate that a
      real event occurred. For a company selling regulated infrastructure, this matters disproportionately because trust is
      part of the product: customers adopt QI Tech not only for APIs and licenses but also for safe handling of identity,
      payment, and credit data. The privacy notice itself says QI Tech processes data on behalf of partners and their end
      customers, which means the company sits close to high-sensitivity information flows.

      The public record does not support an overreaction. One incident does not prove systemic control failure across the
      platform, and the company also publishes a substantial cyber-governance policy. Still, the right diligence posture
      is to treat the incident as a serious prompt for remediation review. Investors should want postmortems, root-cause
      analysis, compensating controls, notification timelines, and evidence that the event did not materially impair new
      enterprise sales or renewals. The incident is therefore a medium-to-high trust risk, even if it is not yet enough to
      overturn the broader business thesis.
    claimRefs:
      - CR019
      - CR020
      - CR021
      - CR022
      - CR023
      - CR024
      - CR025
      - CR026
      - CR027
    tableRefs:
      - TR004
    figureRefs:
      - FR003

  - id: customer-service-execution-and-strategic-risk
    title: "Customer-service, execution, and strategic risk"
    body: >-
      QI Tech's ombudsman reporting is unusually useful because it exposes lived service quality rather than policy intent.
      The first-half 2025 report shows 3,483 interactions, 4.4 business-day average response time, satisfaction score of
      2.2, and 2,435 external-channel demands. Those are not catastrophic metrics, but they are materially less polished
      than the company's growth narrative. In a B2B infrastructure business, service quality matters for renewals,
      implementation expansion, and referenceability. The public record therefore supports a real operational risk that the
      company could scale logos and AUM faster than it scales support quality.

      Strategic execution risk is the second major layer. Bloomberg Línea and Finextra describe an acquisition-led
      expansion posture after Singulare and the 2025 extension round. That can be value-accretive, but it raises
      integration, control harmonization, and management-focus risks—especially when the company is also pushing new Pix,
      lending, anti-fraud, and fund-administration motions. The final risk verdict is not bearish, but it is clear:
      QI Tech's next-stage failure modes are less about finding product-market fit and more about coordinating regulation,
      controls, incident response, customer operations, and M&A integration without dilution of trust.
    claimRefs:
      - CR028
      - CR029
      - CR030
      - CR031
      - CR032
      - CR033
      - CR034
      - CR035
      - CR036
      - CR037
      - CR038
    tableRefs:
      - TR005
    figureRefs:
      - FR004

