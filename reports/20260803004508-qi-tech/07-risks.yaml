  claims:
    - { id: CR001, statement: "QI Tech's licensed posture lowers basic business-model invalidation risk relative to unlicensed embedded-finance vendors.", type: inferred, topic: licensing, sourceRefs: [SR006, SR015, SR018], confidence: high, freshness: current, answersQuestionRefs: [QR001, QR002] }
    - { id: CR002, statement: "That same licensed posture raises recurring compliance, conduct, AML, reporting, and supervisory burden.", type: inferred, topic: licensing, sourceRefs: [SR004, SR006, SR015, SR017], confidence: high, freshness: current, answersQuestionRefs: [QR001, QR002] }
    - { id: CR003, statement: "Regulatory change is an active roadmap variable for QI Tech rather than passive background context.", type: inferred, topic: regulatory-change, sourceRefs: [SR016, SR017, SR023], confidence: high, freshness: current, answersQuestionRefs: [QR003] }
    - { id: CR004, statement: "Banco Central's 2025-2026 priorities include Open Finance evolution, AI monitoring, Pix expansion, and fraud prevention themes that overlap QI Tech's product surface.", type: third-party-reported, topic: regulatory-change, sourceRefs: [SR016], confidence: medium, freshness: recent, answersQuestionRefs: [QR003] }
    - { id: CR005, statement: "Pix and payments-related regulatory evolution is directly relevant to QI Tech's payment and recurring-collection products.", type: inferred, topic: regulatory-change, sourceRefs: [SR016, SR020], confidence: medium, freshness: current, answersQuestionRefs: [QR003] }
    - { id: CR006, statement: "AI and fraud-governance developments matter because QI Tech markets onboarding, anti-fraud, and credit-decisioning infrastructure.", type: inferred, topic: regulatory-change, sourceRefs: [SR016, SR024], confidence: medium, freshness: current, answersQuestionRefs: [QR003, QR017] }
    - { id: CR007, statement: "The company therefore pays a recurring implementation tax when regulation changes.", type: inferred, topic: regulatory-change, sourceRefs: [SR016, SR017, SR023], confidence: medium, freshness: current, answersQuestionRefs: [QR002, QR003] }
    - { id: CR008, statement: "The Singulare combination likely broadened regulated-entity complexity and integration burden.", type: inferred, topic: integration, sourceRefs: [SR019, SR021], confidence: medium, freshness: recent, answersQuestionRefs: [QR016] }
    - { id: CR009, statement: "Public risk is lower on license scarcity and higher on execution inside the licensed perimeter.", type: inferred, topic: verdict, sourceRefs: [SR006, SR015, SR016, SR019], confidence: medium, freshness: current, answersQuestionRefs: [QR001, QR024] }
    - { id: CR010, statement: "QI Tech publishes a visible stack of governance materials including privacy, cyber, AML, anti-corruption, ethics, terms, and transparency materials.", type: company-claimed, topic: governance, sourceRefs: [SR001, SR002, SR003, SR004, SR005, SR006, SR010], confidence: high, freshness: current, answersQuestionRefs: [QR019] }
    - { id: CR011, statement: "The privacy notice is explicitly grounded in LGPD and names a data-protection contact.", type: company-claimed, topic: privacy, sourceRefs: [SR001], confidence: medium, freshness: current, answersQuestionRefs: [QR004] }
    - { id: CR012, statement: "The privacy notice says QI Tech is hired by partner companies and processes data for partners and their final customers.", type: company-claimed, topic: privacy, sourceRefs: [SR001], confidence: medium, freshness: current, answersQuestionRefs: [QR004, QR020] }
    - { id: CR013, statement: "That partner-centric model creates partner-driven data-quality, consent, and conduct risk in addition to direct platform risk.", type: inferred, topic: privacy, sourceRefs: [SR001, SR006], confidence: medium, freshness: current, answersQuestionRefs: [QR004, QR020] }
    - { id: CR014, statement: "QI Tech's cybersecurity policy references ISO/IEC 27001, NIST CSF, LGPD, CMN 4.893/2021, and BCB 85/2021.", type: company-claimed, topic: cyber, sourceRefs: [SR002], confidence: medium, freshness: recent, answersQuestionRefs: [QR005] }
    - { id: CR015, statement: "The AML/CFT policy describes named roles including a PLD director, committee, head, and technology/security responsibilities.", type: company-claimed, topic: aml, sourceRefs: [SR004], confidence: medium, freshness: current, answersQuestionRefs: [QR006] }
    - { id: CR016, statement: "The anti-corruption policy covers public-sector interaction, gifts, donations, political participation, and communication / whistle channels.", type: company-claimed, topic: conduct, sourceRefs: [SR005], confidence: medium, freshness: current, answersQuestionRefs: [QR007] }
    - { id: CR017, statement: "The code of ethics formalizes integrity, transparency, respect, and client-excellence expectations across the group.", type: company-claimed, topic: ethics, sourceRefs: [SR003], confidence: medium, freshness: current, answersQuestionRefs: [QR008] }
    - { id: CR018, statement: "The public control stack is relatively mature for a private startup, but public evidence still does not prove operating effectiveness.", type: inferred, topic: governance-gap, sourceRefs: [SR002, SR003, SR004, SR005, SR010], confidence: medium, freshness: current, answersQuestionRefs: [QR019, QR023] }
    - { id: CR019, statement: "The strongest public adverse event in the retained set is the March 2025 data incident tied to QI Sociedade de Crédito.", type: third-party-reported, topic: incident, sourceRefs: [SR012, SR013, SR014], confidence: high, freshness: recent, answersQuestionRefs: [QR009, QR010] }
    - { id: CR020, statement: "Independent coverage reported that 25.34 thousand people were affected.", type: third-party-reported, topic: incident, sourceRefs: [SR013], confidence: medium, freshness: recent, answersQuestionRefs: [QR009, QR010] }
    - { id: CR021, statement: "Banco Central and independent news coverage corroborate that the incident was real, not rumor-driven.", type: inferred, topic: incident, sourceRefs: [SR012, SR013, SR014], confidence: high, freshness: recent, answersQuestionRefs: [QR010] }
    - { id: CR022, statement: "The privacy notice confirms that QI Tech operates close to high-sensitivity personal, credit, and identity data flows.", type: company-claimed, topic: incident-relevance, sourceRefs: [SR001], confidence: medium, freshness: current, answersQuestionRefs: [QR012] }
    - { id: CR023, statement: "A data incident is especially material for QI Tech because trust is part of the infrastructure product sold to enterprise customers.", type: inferred, topic: incident-relevance, sourceRefs: [SR001, SR013, SR020, SR025], confidence: medium, freshness: current, answersQuestionRefs: [QR012] }
    - { id: CR024, statement: "The incident does not by itself prove systemic control failure across the whole platform.", type: inferred, topic: incident-balance, sourceRefs: [SR002, SR012, SR013, SR014], confidence: medium, freshness: current, answersQuestionRefs: [QR011] }
    - { id: CR025, statement: "It does, however, justify a serious remediation and postmortem diligence request.", type: inferred, topic: incident-balance, sourceRefs: [SR012, SR013, SR014], confidence: high, freshness: current, answersQuestionRefs: [QR011, QR025] }
    - { id: CR026, statement: "Public adverse evidence is concentrated in the incident and complaint-handling record, which may indicate either isolated issues or limited visibility.", type: inferred, topic: visibility-gap, sourceRefs: [SR007, SR012, SR013, SR014], confidence: medium, freshness: current, answersQuestionRefs: [QR022] }
    - { id: CR027, statement: "Public cyber and privacy documents are positive governance signals but not substitutes for audit or testing evidence.", type: inferred, topic: assurance-gap, sourceRefs: [SR001, SR002], confidence: medium, freshness: current, answersQuestionRefs: [QR005, QR023] }
    - { id: CR028, statement: "The 1H25 ombudsman report shows 3,483 interactions, average response time of 4.4 business days, satisfaction score of 2.2, and 2,435 external-channel demands.", type: company-claimed, topic: support, sourceRefs: [SR007], confidence: medium, freshness: recent, answersQuestionRefs: [QR013] }
    - { id: CR029, statement: "QI Tech has published ombudsman reports across at least 2H23, 1H24, and 1H25, showing an ongoing complaint-monitoring process rather than a one-off disclosure.", type: company-claimed, topic: support, sourceRefs: [SR007, SR008, SR009], confidence: medium, freshness: current, answersQuestionRefs: [QR014] }
    - { id: CR030, statement: "The ombudsman dataset is one of the few public windows into lived customer-service quality.", type: inferred, topic: support, sourceRefs: [SR007, SR008, SR009, SR011], confidence: medium, freshness: current, answersQuestionRefs: [QR013, QR015] }
    - { id: CR031, statement: "Mixed ombudsman metrics create real risk for renewals, upsell, and referenceability in a regulated B2B model.", type: inferred, topic: support, sourceRefs: [SR007, SR025], confidence: medium, freshness: current, answersQuestionRefs: [QR015] }
    - { id: CR032, statement: "Acquisition-led expansion raises integration, control-harmonization, and management-focus risk.", type: inferred, topic: execution, sourceRefs: [SR019, SR021, SR022], confidence: medium, freshness: recent, answersQuestionRefs: [QR016] }
    - { id: CR033, statement: "Product breadth increases coordination risk across compliance, support, fraud, and operational controls.", type: inferred, topic: execution, sourceRefs: [SR002, SR004, SR020, SR024], confidence: medium, freshness: current, answersQuestionRefs: [QR017] }
    - { id: CR034, statement: "The strongest mitigants visible publicly are licensed status, a broad policy stack, and fresh capital to fund scaling. ", type: inferred, topic: mitigants, sourceRefs: [SR002, SR003, SR006, SR018, SR020], confidence: medium, freshness: current, answersQuestionRefs: [QR021] }
    - { id: CR035, statement: "The weakest-underwritten public risk areas are control effectiveness, incident remediation quality, concentration, and top-customer dependency.", type: inferred, topic: gaps, sourceRefs: [SR002, SR007, SR019, SR021], confidence: medium, freshness: current, answersQuestionRefs: [QR018, QR022] }
    - { id: CR036, statement: "The right public-evidence tension is mature governance documentation versus limited operating proof.", type: inferred, topic: tension, sourceRefs: [SR002, SR003, SR004, SR005, SR007], confidence: medium, freshness: current, answersQuestionRefs: [QR023] }
    - { id: CR037, statement: "The balanced risk verdict is medium-high on execution, cyber, and customer-service dimensions; medium on basic licensing legitimacy. ", type: inferred, topic: verdict, sourceRefs: [SR006, SR007, SR012, SR016, SR019, SR021], confidence: medium, freshness: current, answersQuestionRefs: [QR024] }
