  topStrengths:
    - >-
      Rare combination of licensed credit, banking, payments, anti-fraud, fund administration, and capital-markets
      infrastructure in one Brazilian platform.
    - >-
      Strong sponsor support and continuing fundability, including a US$200M Series B followed by two extension rounds
      that lifted valuation to US$2B+.
    - >-
      Meaningful operating scale signals across Pix, credit issuance, fraud protection, assets under administration, and
      fund / FIDC administration.
    - >-
      Enterprise customer proof spans telecom, fintech, asset management, structured credit, and vertical platforms
      rather than a single niche.
    - >-
      Strategic scarcity premium is supported by broader investor appetite for Brazilian financial-infrastructure
      assets.
  topRisks:
    - >-
      Public financial disclosure is still too thin on audited revenue, margins, cash generation, and cap-table terms to
      cleanly underwrite a US$2B+ mark.
    - >-
      Metric drift across English and Portuguese product pages weakens confidence in disclosure hygiene and exact scale
      interpretation.
    - >-
      Singulare integration and wider acquisition ambitions increase operating, governance, and harmonization
      complexity.
    - >-
      Incident and customer-service evidence shows trust and support quality can become real constraints on enterprise
      expansion.
    - Concentration, retention, and customer-level wallet-share quality remain under-disclosed.
  unresolvedGaps:
    - >-
      Audited 2024 and 2025 revenue, segment gross margins, EBITDA, cash flow, and financing terms for the 2025
      extension.
    - >-
      Customer concentration, cohort retention, module attach rates, and renewal outcomes for top enterprise and
      fund-operations accounts.
    - Singulare integration scorecard, control-harmonization status, and board- level audit / remediation dashboards.
    - Full incident postmortem and evidence that remediation preserved sales, renewals, and referenceability.
    - Current headcount and more transparent disclosure on operating efficiency.
