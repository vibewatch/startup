callouts:
  - calloutType: strength
    title: "The docs surface is real and production-oriented"
    body: >-
      Separate sandbox and production hosts, a 65-endpoint playground, webhook guidance, and platform-based integration
      settings are stronger signals than typical marketing-only fintech pages.
    claimRefs:
      - CE015
      - CE016
      - CE017

  - calloutType: risk
    title: "Public product depth is much better than public architecture depth"
    body: >-
      QI Tech proves that customers can integrate. It does not yet prove, from public materials alone, how its internal
      systems are designed, monitored, isolated, or independently audited.
    claimRefs:
      - CE019
      - CE020
      - CE033
      - CE035

  - calloutType: insight
    title: "Differentiation is local workflow depth, not a single headline feature"
    body: >-
      Many peers can claim KYC, Pix, or APIs. QI Tech's more distinctive product story is combining those with local
      instruments such as CCB issuance, escrow, DCM, and FIDC-linked administration in one operating layer.
    claimRefs:
      - CE001
      - CE012
      - CE018
      - CE038

