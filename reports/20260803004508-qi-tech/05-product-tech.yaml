company:
  name: "QI Tech"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    QI Tech delivers a broad regulated infrastructure stack rather than a single application: Risk Solutions
    (onboarding, facial, device, background, anti-fraud, credit engine), Banking / Payments, Lending,
    DCM / securities infrastructure, and fund administration / custody. The strongest public technical evidence is the
    documentation surface itself: separate sandbox and production hosts, JWT-authenticated APIs, webhook management,
    and a 65-endpoint playground. Product breadth is credible, and several modules share repeated operational metrics
    such as 20M+ monthly analyses, 90M+ validated registrations, and 120M-face datasets. The main diligence gap is deep
    architecture transparency: public materials prove integrability and regulatory fit, but not cloud topology, core
    databases, SLO history, incident rates, or third-party security certification.

sections:
  - id: product-surface-and-module-map
    title: "Product surface: a modular one-stop shop spanning risk, banking, credit, and capital-markets workflows"
    body: >-
      QI Tech's product surface is unusually broad for a Brazilian financial-infrastructure provider. Public pages show
      five operating clusters. Risk Solutions includes onboarding, OCR-based document capture, facial recognition and
      liveness, background checks, device registration for Pix, transactional anti-fraud, and a no-code credit engine.
      Banking as a Service includes digital accounts, Pix, TED, boletos, BolePix, white-label banking, card issuance,
      and recurring-payments infrastructure. Lending covers multiple credit workflows such as consignado, FGTS-linked
      flows, CCB issuance, and related formalization. DCM and securities infrastructure cover escrow, escrituração,
      liquidation, custody, and direct integration into Brazilian capital-markets processes. Administration and custody
      adds the post-Singulare fund layer with structuring, fiduciary administration, custody, and controllership.

      The shared product logic is not consumer UX but regulated workflow compression. QI Tech repeatedly presents itself
      as the single counterparty that lets customers avoid stitching together separate KYC, payment, credit,
      documentation, custody, and fund administrators. Customer cases reinforce that framing: Vivo Pay combines credit,
      CCB issuance, and FIDC administration; Wellhub combines fund admin, note escrituração, and digital signature;
      Jeeves uses wallet plus KYC plus commercial-note infrastructure; and Ouro Preto uses white-label manager tooling,
      escrow, and credit documentation. The breadth itself is therefore part of the product thesis. QI Tech is not only
      selling features; it is selling fewer operational handoffs across a regulated stack.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
      - CE013
      - CE014
    tableRefs:
      - TE001
      - TE002
    figureRefs:
      - FE001
      - FE002

  - id: architecture-and-developer-operating-model
    title: "Architecture and developer model: credible integration surface, limited deep-stack disclosure"
    body: >-
      Public developer materials are good enough to prove that QI Tech has a real integration platform. The API
      documentation states that sandbox and production are fully separate, with distinct hosts for BaaS / LaaS,
      CaaS, and CertifiQI-related services. The playground exposes 65 endpoints and automates JWT signing in the
      browser. The webhook documentation shows that integrations are configured through the platform, allows custom
      headers, warns clients not to hard-map webhook schemas too tightly, and sets a 10-second response timeout.
      On the credit-engine page, QI Tech says integrations can connect in up to two days, uses RESTful APIs, and offers
      logs and call-status monitoring via dashboard. Those are all meaningful developer signals.

      What is missing is the internal architecture that larger infrastructure customers usually want to see in diligence.
      Public materials do not disclose cloud provider, region strategy, data-store choices, message bus design,
      multi-tenant isolation model, disaster-recovery RTO / RPO, or observed uptime history. The product pages do prove
      modular coupling: onboarding flows into automated credit decisioning, anti-fraud into payments, DCM into banking,
      and recurring Pix into collections. But that is commercial architecture, not systems architecture. The product-tech
      verdict is therefore asymmetric: the external operating model looks integration-ready and production-oriented,
      while the internal technical stack remains largely opaque.
    claimRefs:
      - CE015
      - CE016
      - CE017
      - CE018
      - CE019
      - CE020
      - CE021
      - CE022
      - CE023
      - CE024
    tableRefs:
      - TE003
    figureRefs: []

  - id: trust-safety-compliance-and-dependencies
    title: "Trust, safety, compliance, and critical dependencies"
    body: >-
      QI Tech's public trust posture is stronger than its deep architecture transparency. The cybersecurity policy says
      the conglomerate aligns to LGPD, CMN Resolution 4.893/2021, BCB Resolution 85/2021, and guidance from ANBIMA and
      CVM, while referencing ISO/IEC 27001 and the NIST Cybersecurity Framework as organizing standards. The
      transparency portal centralizes ethics, tariffs, terms, and policies, and the ombudsman policy describes the
      group-level complaint-handling framework for the SCD and DTVM. Product-level pages add more concrete controls:
      Device Scan is explicitly framed around Resolution 403 and IN 491, including the R$200 / R$1,000 limits for
      unregistered devices; Payment as a Service emphasizes certificate-based authentication, audit logs, and granular
      permissions; and Anti-Fraud claims coverage across Pix, TED, cards, and boletos.

      Still, there is no clean public proof of third-party security certification. The cybersecurity policy references
      ISO 27001 and NIST but does not say QI Tech is certified. Nor do public materials disclose SOC 2, PCI DSS scope,
      independent penetration-test results, or incident-frequency metrics. The 2025 Banco Central-reported data leak
      involving QI Sociedade de Crédito shows why this gap matters: even for a company with substantial compliance
      signaling, controls must be judged by observed outcomes as well as policy language. Product dependencies are also
      visible. QI Tech depends on Banco Central and CVM rule evolution, B3-linked market infrastructure for capital-
      markets workflows, external data sources such as Open Finance / SCR / bureaus, and customer engineering teams
      implementing the APIs correctly. That is manageable, but it means technical risk is partly institutional.
    claimRefs:
      - CE025
      - CE026
      - CE027
      - CE028
      - CE029
      - CE030
      - CE031
      - CE032
      - CE033
      - CE034
      - CE035
    tableRefs:
      - TE004
    figureRefs:
      - FE003

  - id: maturity-roadmap-and-differentiation
    title: "Maturity, roadmap, and differentiation"
    body: >-
      QI Tech's most mature public surfaces appear to be in onboarding / anti-fraud, banking / payments, lending
      infrastructure, and administration / custody. Those areas have repeated claims, multiple adjacent product pages,
      detailed docs, and customer cases using them in production. Newer or less proven lines include insurance-as-a-
      service, foreign exchange infrastructure, recurring Pix features, and DCM expansion from fund operations into the
      broader securities-writing and bank-liquidation stack. The product pages themselves reveal a roadmap posture:
      worker-credit flows are linked to new regulation, Pix Automático is positioned around the market's recurring-
      payments shift, and DCM is clearly trying to move QI Tech from FIDC-specialist adjacency into a larger fixed-income
      operating layer.

      The differentiation is less about secret algorithms than about local workflow depth. QI Tech's public story is not
      that it has the world's best generic KYC or the world's most beautiful bank app; it is that it can combine those
      modules with local licenses, legal instruments, and capital-markets plumbing in one integrated operating model.
      That is a real product distinction in Brazil. But because the public record does not expose uptime history,
      developer adoption metrics beyond the docs surface, or detailed release notes, the maturity judgment should stay
      moderate rather than absolute. Production readiness is well signaled; engineering excellence is suggested, not yet
      fully evidenced.
    claimRefs:
      - CE003
      - CE012
      - CE014
      - CE017
      - CE018
      - CE022
      - CE032
      - CE036
      - CE037
      - CE038
