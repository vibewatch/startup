      - TI004
    figureRefs:
      - FI004

  - id: financial-verdict-and-blockers
    title: "Financial verdict: attractive platform economics are plausible, but the evidence set is still investor-incomplete"
    body: >-
      The positive financial case is straightforward. QI Tech has strong fundraising support, publicly claimed early
      profitability, a broad product stack, visible enterprise traction, and a business model that appears more capital
      efficient than principal-at-risk fintech lenders. The 2024 revenue forecast, the disclosed revenue mix, and the
      2025 operating-scale proxies collectively suggest a company that is already meaningfully scaled and diversifying.
      Customer cases also support the idea that QI Tech sells high-value workflow compression rather than generic payment
      APIs alone: Vivo Pay, Wellhub, Ouro Preto, and LBA all describe QI Tech as an operating layer that bundles credit,
      documentation, custody, escrow, and fund infrastructure into one regulated counterparty.

      The adverse case is equally clear. QI Tech does not publish current audited revenue, gross margin, cash runway,
      customer concentration, or realized pricing. Public scale metrics are also inconsistent: older English pages show
      US$88 billion Pix volume and US$28 billion under administration, 2025 Portuguese pages show +R$494 billion Pix and
      +R$170 billion under administration, and DCM pages claim R$175 billion under administration. Those discrepancies do
      not prove misstatement, but they do show that investors cannot treat public surface metrics as a clean time series.
      The right financial verdict is therefore cautiously positive on business quality and negative on disclosure quality.
      QI Tech may already be a good business; the problem is that public evidence still cannot tell an outside investor
      how good, how profitable, or how cash-generative it really is.
    claimRefs:
      - CI016
      - CI025
