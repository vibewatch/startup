  - id: pricing-sales-motion-and-unit-economics
    title: "Pricing, sales motion, and unit economics: enterprise contracts are visible, realized economics are not"
    body: >-
      QI Tech's public pages strongly imply a consultative enterprise-sales motion rather than transparent self-serve
      pricing. Product pages repeatedly route buyers to specialists, emphasize modular integration, and anchor value in
      faster launch, regulatory coverage, automation, and reduced orchestration burden. The documentation site,
      webhook guides, and playground reinforce that point: this is sold as production infrastructure with sandbox /
      production segregation, JWT-authenticated APIs, webhooks, and a 65-endpoint playground rather than as a low-touch
      SaaS SKU. The strongest explicit implementation-speed signal is on the credit-engine page, which says integrations
      can connect in up to two days. Customer cases consistently frame the value proposition as replacing multiple
      vendors, compressing operational lead times, and turning regulatory complexity into faster go-to-market.

      The unit-economics problem is that public revenue per customer, gross margin, churn, and support-cost data are
      absent. The only price book retained in the public record is the transparency-portal tariff PDF for end-user /
      regulated banking services; that document is useful to show QI Tech's regulated operating perimeter, but it is not
      a good proxy for realized B2B enterprise pricing. Public evidence therefore supports only directional conclusions.
      First, recurring quality should be higher in fund administration, custody, payment rails, and embedded recurring
      flows than in one-off implementation work. Second, margins are likely below pure software benchmarks because QI
      Tech combines regulated operations, customer support, and fiduciary / back-office obligations with software. Third,
      cross-sell probably matters economically: case studies repeatedly show the same customer using multiple modules,
      and the 2024 revenue-mix disclosure explicitly positions custody as a strategic wedge into other infrastructure.
      But until management discloses realized take rates, attach rates, and service-delivery costs, public unit economics
      remain inferential.
    claimRefs:
      - CI017
