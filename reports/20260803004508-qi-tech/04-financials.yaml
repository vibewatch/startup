callouts:
  - calloutType: insight
    title: "The best public financial datapoint is still a 2024 revenue interview"
    body: >-
      Bloomberg Línea's R$680 million 2024 forecast and segment mix remain the most useful public financial anchor.
      Everything later in the public record is mostly scale proxy, capital raised, or product narrative rather than
      audited financial performance.
    claimRefs:
      - CI004
      - CI013
      - CI014
      - CI015

  - calloutType: risk
    title: "Public scale metrics are inconsistent across QI Tech surfaces"
    body: >-
      English product pages, Portuguese product pages, and newer DCM pages cite materially different scale numbers for
      Pix volume and assets under administration. That may reflect date drift or scope drift, but it reduces confidence
      in simple multiple-building from website metrics alone.
    claimRefs:
      - CI002
      - CI003
      - CI032

  - calloutType: strength
    title: "The business looks more capital-efficient than a lender, but less pure than SaaS"
    body: >-
      QI Tech benefits from software-like APIs and recurring workflows while avoiding the most obvious balance-sheet
      credit exposure of principal lenders. At the same time, custody, ombudsman, compliance, and support obligations
      mean margins should not be assumed to look like pure software.
    claimRefs:
      - CI026
      - CI035
      - CI037
      - CI038

