      - number: '2.2'
        title: 规模测算视角：TAM、SAM、SOM 代理指标，以及公开数据无法拆出的部分
        blocks:
          - type: paragraph
            body: >-
              公开市场数据最好被视为一组受约束的观察镜头，而不是单一权威 TAM。保留证据中最干净的第三方自上而下数据点，是 BusinessWire 转载的 Research and Markets databook
              摘要：巴西嵌入式金融市场 2025 年规模为 US$14.16B。这个数字有用，因为它指向嵌入式支付、信贷和银行周围的软件与服务收入池。第二个更窄的视角来自 ezbob / CX Solutions
              的开放金融文章，其中引用巴西另类信贷市场到 2025 年约 US$1.9B。那不是 QI Tech 的完整 TAM，但可作为信贷牵引业务的相关下限。

              第三个视角不用收入，而用基础设施吞吐量。同一篇 ezbob 文章称，Pix 在 2026 年每月处理约 60 亿至 70 亿笔交易、约 R$3T 月交易额；QI Tech 自己的公开材料则宣传 US$88B
              Pix 交易和 US$19B 已发放信贷。这些单位不可比，因此不能压成一个干净的 SAM 或 SOM。不过，它们确实解释了为什么 QI Tech
              有可能把横跨支付、信贷、身份和托管的多轨运营层变现，而不是只卖单一产品类别。正确的市场结论是：宽度存在，但测量模糊；机会很大，公开 take rate 透明度很弱。
