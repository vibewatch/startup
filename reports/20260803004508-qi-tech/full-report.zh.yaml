  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面：模块化一站式服务，横跨风控、银行、信贷与资本市场工作流
        blocks:
          - type: paragraph
            body: >-
              对一家巴西金融基础设施提供商来说，QI Tech 的产品界面异常宽。公开页面显示五个运营集群。Risk Solutions 包括入驻、基于 OCR 的文档采集、人脸识别与活体检测、背景检查、Pix
              设备注册、交易反欺诈和无代码信贷引擎。Banking as a Service 包括数字账户、Pix、TED、boletos、BolePix、白标银行、发卡和 recurring-payments
              基础设施。Lending 覆盖多种信贷工作流，例如 consignado、FGTS 相关流程、CCB 发行和相关 formalization。DCM 和证券基础设施覆盖
              escrow、escrituração、清算、托管，并直接接入巴西资本市场流程。行政管理与托管则加入 Singulare 之后的基金层，包括结构化、信托行政管理、托管和 controllership。

              共同产品逻辑不是消费端 UX，而是受监管工作流压缩。QI Tech 反复把自己呈现为单一交易对手，让客户不用把分散的 KYC、支付、信贷、文档、托管和基金行政管理方拼在一起。客户案例强化了这个叙事：Vivo
              Pay 组合了信贷、CCB 发行和 FIDC 行政管理；Wellhub 组合了基金行政管理、票据 escrituração 和数字签名；Jeeves 使用钱包 + KYC + 商业票据基础设施；Ouro
              Preto 使用白标经理工具、escrow 和信贷文档。因此，产品宽度本身就是产品 thesis 的一部分。QI Tech 不只是卖功能；它卖的是在受监管栈上减少运营交接。
