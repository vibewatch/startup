  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与牌照风险：位置有利，负担更重
        blocks:
          - type: paragraph
            body: >-
              QI Tech 最重要的结构性风险事实，也是它的优势之一：公司持有真正的受监管牌照，而不是把受监管活动套在轻监管软件壳上。公开材料、条款和投资者发布一贯把公司定位为 Banco Central 批准的首家
              SCD；收购 Singulare
              后，又成为覆盖更多资本市场许可的平台。相较无牌嵌入式金融供应商，这降低了商业模式突然失效的基础风险。但牌照脆弱性被替换成运营负担。公司一旦站进受监管边界，每个新产品、合作伙伴或工作流都会带来行为规范、AML、投诉、欺诈、审慎监管和数据治理义务。

              这份负担不太可能变轻。外部法律评论称，Banco Central 的 2025-2026 年议程包括 Open Finance 调整、虚拟资产规则、AI 监测、Pix 功能扩展、欺诈预防和审慎审查。QI Tech
              的产品策略明确押在信贷、支付、开户和数据工作流上，因此监管变化不是背景噪音，而是路线图的一部分。QI Tech 受益于持牌姿态，但每次监管演进也都会继承一笔反复出现的落地税。
