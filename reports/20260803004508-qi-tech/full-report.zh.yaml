      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              保留证据指向四类反复出现的买方。第一类是需要持牌轨道、但想比自建更快、更模块化推进的 fintech
              和银行。第二类是电信、市场平台和生态运营方等非金融企业，它们希望用金融产品变现客户基础。第三类是需要基金行政管理、托管账户、托管或债务工具基础设施的资产管理人和结构化信贷运营方。第四类是全球进入者，它们能在其他市场设计金融产品，但在巴西运营需要本地监管、Pix
              和信贷工具管道。

              在这些细分里，经济买方通常不是终端用户，而是对 P&L 或上线结果负责的
              CFO、资金、风控、产品或金融服务负责人。终端用户是企业自己的客户、商户、合作伙伴或借款人。付款方是企业本身，采用理由通常是更快上市、更低合规负担、新收入线或更好风险控制。Jeeves、Wellhub、Vivo
              和 Bettr 的例子尤其有用，因为每个都对应不同触发点：本地市场进入、合作伙伴网络融资、既有用户变现，以及嵌入式商业信贷。
