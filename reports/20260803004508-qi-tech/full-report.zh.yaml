              保留证据集中，主要反向客户证据来自 QI Tech 自己的申诉专员报告，而不是消费者评价平台。2025 年上半年报告显示 3,483 次服务互动、平均响应时间 4.4 个工作日、满意度得分 2.2、外部渠道诉求
