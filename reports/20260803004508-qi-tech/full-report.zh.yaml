  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与公开规模：多线基础设施变现，只有一个可见收入快照
        blocks:
          - type: paragraph
            body: >-
              QI Tech 的经济模型比单一 BaaS 订阅更宽。公开产品界面显示至少六类变现：Banking as a Service、支付处理、信贷基础设施、风控 / 入驻、基金行政管理与托管，以及 DCM /
              证券基础设施。共同模式是把受监管、API 驱动的能力卖给希望推出或运营金融产品、但不想在本地自建全栈的企业。因此，收入机制很可能混合了实施费、持续平台使用费、交易费、基金行政管理费、文档 /
              发行服务，以及向相邻模块交叉销售的支持。这种宽度有战略吸引力，因为不需要任何单一产品线承担全部商业负担。

              最好的公开收入数据点仍是 Bloomberg Línea 在 Singulare 批准后于 2024 年 7 月的采访。该文称 QI Tech 预计 2024 年收入 R$680 million，其中信贷贡献
              35%，行政管理与托管 30%，银行 25%，合规 10%。文章还报道，公司客户超过 400 家，预计随 Singulare 扩至 750 家、到下一年年底达到 1,000
              家；管理层认为信贷仍将是最大收入线，而托管会对交叉销售产生不成比例的影响。后续 2025 年官方材料没有披露收入，但披露了运营规模代理指标：超过 400 个客户项目、US$25 billion AUM、US$17
              billion FIDC 托管、每月超过 2,000 万次反欺诈分析、超过 9,000 万次已验证注册，以及上线六个月内超过 US$27 million
              保险保费发行。这些代理指标支持持续放大，但无法替代经审计财务报表。
