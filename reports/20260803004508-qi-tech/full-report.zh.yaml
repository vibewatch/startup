      - number: '1.5'
        title: 里程碑、客户证明与负面信号
        blocks:
          - type: paragraph
            body: >-
              公开记录中的客户证明比典型私营 fintech 更广。QI Tech 2024 年独角兽公告称，公司服务超过 400 家客户，包括 Vivo、Unidas、99 和
              QuintoAndar。后续材料和案例研究展示了抽象客户说法如何落到真实工作负载：Vivo Pay 打造的金融垂直业务到 2025 年底已产生超过 R$400M 累计收入；Wellhub 用 QI Tech
              基础设施为健身房和健康合作伙伴推出 R$100M 信贷工具；Jeeves 2024 年进入巴西后用 QI Tech 跑本地钱包 / 入驻和票据发行流程；Bettr / Ant International 与 QI
              Tech 合作，为巴西电商商户和消费者扩大信贷供给。这些例子支持一个判断：QI Tech 卖的是深度嵌入式工作流，而不是一次性点状产品。

              公开记录也包含重要负面信号。2025 年 3 月，与 Banco Central 相关的报道称，QI SCD 有 25,349 个 Pix key 相关数据外泄，但不包括敏感余额或密码。另一篇 2026 年
              Times Brasil 报道把公司名字与一个受调查企业相关的问题 FIDC 组合传闻联系起来；QI Tech 否认存在任何主动谈判。同一文章还提到一项法院裁定，在 Canis Majoris
              集团倒闭相关诉讼中继续冻结 QI Tech 资源。这些事项都还不足以构成已披露的生存性损害，但足以把监管、声誉和法律监控列为持续尽调重点。
