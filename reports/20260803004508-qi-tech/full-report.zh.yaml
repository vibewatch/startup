      - number: '6.2'
        title: 采用轨迹和具名客户证明
        blocks:
          - type: paragraph
            body: >-
              QI Tech 最强的采用信号来自两处：公司层面的客户标识数量，以及信息密度高的案例证据。官方和投资者关联来源称，公司 2024 年有 400+ 个客户，2025 年有 400 多个项目；收购 Singulare
              后，客户数预计跳到约 750 个，并有路径在次年年底达到 1,000 个。这些数字显示覆盖面，但具名客户证据更有信息量，因为它揭示哪些客户真的在生产环境信任 QI Tech。Vivo Pay
              是嵌入式金融企业客户最清晰的证明：案例引用 116 million 个电信访问、85 million 名应用用户、1,800+ 家门店，且金融垂直到 2025 年底累计收入超过 R$400
              million。Wellhub 说明 QI Tech 通过 R$100 million 基金，在全球健康生态内充当基金和文件层。Jeeves 说明 QI Tech 是一家多国金融科技公司在巴西本地启动的伙伴。

              资产管理和结构化信贷案例不是简单重复证明，而是把证据集做深。Suno Asset 称其管理超过 R$3.3 billion 和 230 thousand 名投资者，已有三只基金由 QI Tech 管理。Ouro
              Preto 称基金搭建时间从 60 天降到 30 天。LBA 引用 200+ 笔业务、70+ 名开发者和 150+ 个资金托管账户。Multiplike 引用 R$4 billion
              管理权益。这些客户指标并非完全可比，但合在一起说明，QI Tech 的证明更偏高复杂度、生产级金融工作流，而不是试点阶段的金融科技实验。
