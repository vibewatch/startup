        title: 成熟度、路线图与差异化
        blocks:
          - type: paragraph
            body: >-
              QI Tech 公开界面中最成熟的部分看起来是入驻 / 反欺诈、银行 / 支付、信贷基础设施以及行政管理 / 托管。这些领域有反复出现的
              claims、多组相邻产品页面、详细文档和生产中使用的客户案例。更新或验证较少的线包括 insurance-as-a-service、外汇基础设施、recurring Pix 功能，以及 DCM
              从基金运营扩展到更宽证券登记和银行清算栈。产品页本身透露了路线图姿态：worker-credit 流程与新监管挂钩，Pix Automático 围绕市场 recurring-payments 转变定位，DCM
              明显试图把 QI Tech 从 FIDC 专家相邻位置推向更大的固定收益运营层。

              差异化更多来自本地工作流深度，而不是秘密算法。QI Tech 的公开故事不是它拥有全球最好的通用 KYC，或全球最漂亮的银行
              app；而是它能把这些模块与本地牌照、法律工具和资本市场管道组合进一个集成运营模型。放在巴西，这是一个真实产品差异。但由于公开记录没有暴露 uptime 历史、文档界面之外的开发者采用指标或详细 release
              notes，成熟度判断应保持中等，而不是绝对。生产就绪信号很强；工程卓越性被暗示，但尚未被充分证明。
