  - id: FU001
    title: 客户旅程图
    type: flow
    layout: wide
    summary: 典型客户旅程从一个受监管工作流痛点开始；QI Tech 嵌入后，再扩到相邻模块。
    data:
      nodes:
        - id: need
          label: 客户有受监管工作流痛点
        - id: entry
          label: 入口切入点：入驻、银行、托管或信贷
        - id: implementation
          label: 实施 / 上线
        - id: production
          label: 生产环境使用
        - id: expansion
          label: 相邻模块扩张
      edges:
        - from: need
          to: entry
          label: 选择入口
        - from: entry
          to: implementation
          label: 签约 + 集成
        - from: implementation
          to: production
          label: 上线
        - from: production
          to: expansion
          label: 交叉销售 / 更多工作流
