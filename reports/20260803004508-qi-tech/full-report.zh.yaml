            body: >-
              QI Tech 不应按普通 API 工具估值。巴西金融基础设施资产只要具备牌照或核心处理深度，就能吸引有意义资本和战略兴趣：Summit Partners 称 Celcoin 在 2024 年 Q1 达到
              US$63M ARR，并获得 US$125M 投资；Startups.com.br 称 Zoop 在 2025 自然年产生超过 R$700M 收入，并预计在截至 2026 年 3 月的财年超过
              R$1B；Brazil Journal 报道 Matera 从 Warburg Pincus 融得
              R$500M。合起来看，这些数据点支持一个判断：巴西规模化基础设施公司即便还没有完美的公开盈利披露，也能拿到溢价估值。

              QI Tech 的差异化角度，是在受监管边界内横跨信贷、银行、支付、风险和基金管理。这种组合稀缺。它不能保证估值便宜，但让纯粹低倍数软件可比过于苛刻。正确的语境判断是：QI Tech
              属于战略基础设施资产上层梯队，但仍应因为私有公司不透明、整合风险和未解决的客户质量问题而打折。
            claimRefs:
