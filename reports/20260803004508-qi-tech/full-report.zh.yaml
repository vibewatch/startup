              个已验证注册。这些是公司自称指标，但重要，因为它们展示的是支付、信贷、管理和数据工作流上的规模证据，而不是单一产品桶里的规模。

              Bloomberg Línea 对 2024 年收入的 R$680M 预测，是最具体的变现线索；文章称 Singulare 合并后将占收入约
