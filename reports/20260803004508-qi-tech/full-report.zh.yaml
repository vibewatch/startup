            body: >-
              Pluggy 说明了更窄的竞争者也可能具有战略相关性。它围绕在巴西读取银行数据和转账定位，获得 Banco Central 作为 ITP 的授权，并公开宣传这一组少数可见价格表：数据产品每月 R$2,500
