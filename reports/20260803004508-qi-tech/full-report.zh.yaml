      - number: '1.3'
        title: 融资历史、估值与资本基础
        blocks:
          - type: paragraph
            body: >-
              作为巴西私营基础设施 fintech，QI Tech 的资本形成异常强。2021 年 11 月，公司宣布由 GIC 领投 US$50M Series A，当时称这是拉美最大的 Series A 之一。2023 年
              Series B 随后带来由 General Atlantic 领投的 US$200M（R$1B），Across Capital 将早前仓位翻倍。General Atlantic
              官方公告还给出一个重要质量信号：公司从运营第一年起已实现盈利，尽管支持这一说法的经审计财务报表并未公开。

              2024 年 4 月，QI Tech 宣布由 General Atlantic 和 Across Capital 支持的 US$50M Series B 延展。公司和后续报道称，这次延展把 QI Tech 推到约
              US$1.5B 估值，并正式成为独角兽。2025 年 7 月，公司又宣布 US$63M Series B 延展，仍由 General Atlantic 领投，Across 连续第四次参与。独立报道和官方内容都把
              2025 年延展描述为用于新产品和收购的资本，并把投后估值置于 US$2B 以上。按已披露的 2021、2023、2024 和 2025 年轮次计算，公开一手来源融资总额为 US$363M。
