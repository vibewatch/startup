chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立与监管定位
        blocks:
          - type: paragraph
            body: >-
              QI Tech 是一家巴西私营金融基础设施公司，总部位于 São Paulo。其网站页脚和公司页面展示的公开法律主体包括负责信贷机构的 QI Sociedade de Crédito Direto
              S.A.，以及负责证券经纪交易商业务的 QI CTVM Ltda.，二者都在 Jardim Paulistano 的 Pátio Rebouças 运营。公司称其创立于 2018
              年，定位是为希望嵌入金融产品、但不想自己变成全栈银行的企业提供技术和监管层。

              监管资质是商业模式的核心。QI Tech 称其是 Banco Central do Brasil 批准的首家直接信贷公司（SCD），后来又成为首家同时持有证券分销 / 经纪交易商（DTVM / CTVM）牌照的
              fintech。这些许可让 QI Tech 能把贷款发放、支付流、数字账户能力和资本市场基础设施组合进同一套栈。General Atlantic 2023
              年的投资公告把这描述为一站式服务，将合规、入驻、信贷承保、转账、Pix 和 FIDC 结构化封装进模块化 API；公司官网则把这套供给称为类似 AWS 的受监管金融基础设施公用设施。
