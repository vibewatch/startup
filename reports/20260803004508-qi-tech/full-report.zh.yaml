      - number: '5.2'
        title: 架构与开发者模型：集成界面可信，深层技术栈披露有限
        blocks:
          - type: paragraph
            body: >-
              公开开发者材料足以证明 QI Tech 拥有真实集成平台。API 文档说明 sandbox 和 production 完全分离，BaaS / LaaS、CaaS 和 CertifiQI 相关服务使用不同
              host。playground 暴露 65 个端点，并在浏览器内自动完成 JWT 签名。webhook 文档显示，集成通过平台配置，允许自定义 header，提醒客户不要把 webhook schema
              映射得过死，并设置 10 秒响应超时。在 credit-engine 页面，QI Tech 称集成最快可在两天内接通，使用 RESTful API，并通过 dashboard
              提供日志和调用状态监控。这些都是有意义的开发者信号。

              缺失的是大型基础设施客户尽调时通常想看的内部架构。公开材料没有披露云服务商、区域策略、数据存储选择、消息总线设计、多租户隔离模型、灾难恢复 RTO / RPO 或实际 uptime
              历史。产品页面确实证明了模块耦合：入驻流入自动化信贷决策，反欺诈流入支付，DCM 流入银行，recurring Pix
              流入收款。但那是商业架构，不是系统架构。因此，产品技术结论是不对称的：外部运营模型看起来已准备好集成、面向生产；内部技术栈仍大体不透明。
