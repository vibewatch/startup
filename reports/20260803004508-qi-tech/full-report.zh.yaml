      - number: '6.3'
        title: 留存、扩张与集中度：信号不错，硬披露很少
        blocks:
          - type: paragraph
            body: >-
              公开证据说明扩张真实存在，但没有量化。QI Tech 的案例反复出现同一客户采用多个模块——Vivo 组合放贷文件和 FIDC 工作流；Wellhub 组合基金管理、簿记登记和签署；Jeeves 组合钱包、KYC
              和商业票据信贷；资产管理人案例组合资产托管、资金托管、信贷工具、白标或支付层。该模式强烈指向按模块扩张；客户上线后，客户终身价值应当上行。Singulare
              收购看起来也像客户基础扩张楔子，因为它把数百个新增客户关系带进更大的运营栈。

              但留存指标仍缺失。公开材料没有 GRR、NRR、流失率、客户标识
              留存率、平均合同期限或续约排期。集中度也很难判断。具名客户体量够大，因此少数旗舰关系贡献超额收入或信誉是合理可能，尤其在企业嵌入式金融侧。反过来，大量基金、项目和客户标识又说明买方类型可能有所分散。因此，对客户质量的正确读法是混合的：公开案例支持有意义的扩张潜力和粘性工作流，但投资者还无法量化
              QI Tech 是广泛分散，还是悄悄依赖少数锚定项目。
