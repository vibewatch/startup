  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值历史与公开锚点
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开估值锚点很直接。QI Tech 2024 年 4 月延伸轮把公司估到 US$1.5B，确认独角兽身份。到 2025 年 7 月，独立和官方报道描述了一笔 US$63M 延伸融资，把估值推到
              US$2B+。这意味着约 16 个月内估值增长约三分之一；尽管全球金融科技 情绪收紧，也没有证据显示估值全面重定价崩塌。表面上看，这是强信号：投资者不太把 QI Tech 看成商品化 BaaS
              层，而更像一项稀缺持牌基础设施资产，且拥有多条变现路径。

              但这些锚点有边界。公开材料没有披露精确股权稀释、清算优先权、收入确认政策、EBITDA 或自由现金流。因此，2025
              年估值上台阶，不能简单理解为透明运营指标上的干净按市值重估。更合适的读法是：增长叙事、产品宽度，以及 Singulare 之后的资本市场可选项，共同支撑了一项战略稀缺性估值。
