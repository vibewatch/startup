      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              投资公告披露的创始三人组是 Pedro Mac Dowell、Marcelo Bentivoglio 和 Marcelo Buosi。公开来源持续把 Mac Dowell 标识为创始人兼
              CEO，Bentivoglio 为联合创始人兼 CFO，Buosi 为联合创始人 / 运营高管。2023 年 Series B 通讯称该轮按 pro-rata
              完成，在没有二级出售或股权退出的情况下保留了创始人控制。公开证据还显示，QI Tech 的领导梯队通过收购扩张：此前与 Singulare 相关的 Daniel Doll Lemos
              在收购后通讯中仍然可见，Emílio Moreira 则被称为负责 Singulare 整合的高管。

              相对机构投资者预期，治理可见度仍不完整。公开记录确认 GIC、General Atlantic 和 Across Capital
              等主要股东，但没有披露精确持股比例、董事席位、观察员权利或委员会结构。这造成典型的关键人依赖，核心落在 Mac Dowell 和小型创始团队身上；外部证据尤其把战略方向、融资、M&A 和新产品发布都紧密系在创始人
              CEO 与 CFO 上。
