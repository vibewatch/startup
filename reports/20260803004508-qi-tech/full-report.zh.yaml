      - 机制
      - 公开数值 / 状态
      - 收入质量
      - 尽调追问
    rows:
      - - 信贷基础设施
        - 信贷发放工具、CCB / 票据发行、薪资和结构化信贷工作流
        - 2024 年收入结构中披露最大项：预计收入的 35%
        - 中-高：绑定活跃项目时具备经常性，但可能包含项目收入
        - 按信贷产品拆出经常性平台费、文件发行费和挂钩交易量的经济性
      - - 管理与托管
        - 基金管理、托管、控制服务、结构设计、受托服务
        - 预计 2024 年收入的 30%；英文页面显示 1,100+ 只基金；DCM 页面称管理规模 R$175B
        - 高：基金栈一旦上线，受监管工作流黏性强
        - 披露实际管理 / 托管费率表、单基金平均收入，以及按基金类型拆分的利润率
      - - 银行 / 支付基础设施
        - 账户、Pix、TED、boletos、BolePix、周期性 Pix、白标银行
        - 预计 2024 年收入的 25%；公开页面强调高交易量企业流量
        - 若按使用量计费并嵌入客户运营，质量高
        - 提供各支付通道 take rate、贡献利润率和按产品线拆分的交易量
      - - 风险解决方案
        - 入驻、KYC、反欺诈、信贷引擎、设备扫描、生物识别
        - 预计 2024 年收入的 10%；公司称每月 20M+ 次分析、90M+ 个注册已验证
        - 中-高：类似软件的经常性使用收入，但服务 / 调优负担未知
        - 披露按次分析定价模型、对其他模块的附加率和毛利率
      - - DCM / 证券基础设施
        - 监管账户、escrituração、清算、托管、银行清算服务
        - 公开定位为超出 FIDC 管理的扩张；未披露独立收入
        - 中：可能有黏性，但变现爬坡阶段不清楚
        - 披露销售管线、已上线客户，以及相对传统基金管理业务的收入贡献
      - - 保险 / FX 邻近业务
        - 保险即服务，以及规划中的外汇基础设施
        - 前六个月保险保费超过 US$27M；FX 仍在开发中
        - 低-中：有潜在选择权，但纳入核心假设还太早
        - 拆分 GWP、净收入、伙伴经济性，以及 FX 产品路线图
    notes: Bloomberg Línea 是证据集中唯一保留的公开收入结构来源。后续官方来源提供的是规模代理， 而不是收入。不同页面的指标不一致，保留原貌，不强行归一。
