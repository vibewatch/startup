  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              QI Tech 的相关市场不是泛泛的「fintech」，甚至也不是泛泛的 banking-as-a-service。保留下来的证据指向一个更窄但仍很大的金融基础设施层：受监管 API
              和运营服务，让企业、fintech、银行、市场平台和资产管理人能够推出或运营信贷、数字账户、支付、入驻、反欺诈和基金行政管理工作流。公司网站和 General Atlantic 2023 年公告都把 QI
              Tech 描述为这些工作流的一站式服务商；客户案例则展示了电信驱动的消费金融、跨境 fintech 本地化、健康网络放贷和 marketplace 信贷中的使用场景。

              本章市场视角纳入的是基础设施价值层：合规牵引的银行 API、支付编排、信贷运营、身份 / KYC / 反欺诈轨道、开放金融连接，以及 FIDC
              行政管理和托管等资本市场运营。排除项包括第三方资产负债表上的终端消费者贷款本金、只从轨道经过的商户 GMV，以及 Vivo 或 Wellhub 等仅把 QI Tech
              当后端组件使用的企业全部收入。现状替代方案仍是直接银行关系、传统核心系统提供商、碎片化专业供应商或内部自建；每一种都用更低的集成便利性换取潜在更高控制权。
