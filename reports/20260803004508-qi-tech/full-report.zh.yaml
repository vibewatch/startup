      - number: '5.3'
        title: 信任、安全、合规与关键依赖
        blocks:
          - type: paragraph
            body: >-
              QI Tech 的公开信任姿态强于深层架构透明度。网络安全政策称集团对齐 LGPD、CMN Resolution 4.893/2021、BCB Resolution 85/2021 以及 ANBIMA 和 CVM
              指引，并把 ISO/IEC 27001 和 NIST Cybersecurity Framework 作为组织标准。透明门户集中呈现伦理、资费、条款和政策；ombudsman 政策描述了覆盖 SCD 和 DTVM
              的集团级投诉处理框架。产品层页面补充了更具体控制：Device Scan 明确围绕 Resolution 403 和 IN 491，包括未注册设备的 R$200 / R$1,000 限额；Payment as a
              Service 强调基于证书的认证、审计日志和细粒度权限；Anti-Fraud 声称覆盖 Pix、TED、cards 和 boletos。

              但公开层面没有干净的第三方安全认证证明。网络安全政策引用 ISO 27001 和 NIST，但没有说 QI Tech 已获认证。公开材料也没有披露 SOC 2、PCI DSS
              范围、独立渗透测试结果或事件频率指标。2025 年 Banco Central 报告的 QI Sociedade de Crédito
              数据泄露说明了为什么这个缺口重要：即便一家公司释放出大量合规信号，控制能力也必须同时看实际结果和政策语言。产品依赖同样可见。QI Tech 依赖 Banco Central 和 CVM
              规则演进、资本市场工作流中的 B3 相关市场基础设施、Open Finance / SCR / bureaus 等外部数据来源，以及正确实施 API 的客户工程团队。风险可管理，但意味着技术风险部分来自制度环境。
