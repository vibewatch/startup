      - number: '4.3'
        title: 成本结构、资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              QI Tech 的成本结构看起来介于 SaaS 基础设施和受监管金融运营之间。软件、产品开发、合规、客户成功和集成工作很可能是核心可控费用；不同于放贷机构，QI Tech
              看起来不需要用大量自有资产负债表资金来承接大部分客户信贷量。尽管如此，平台并非经济上没有重量。行政管理与托管、托管账户、证券发行以及 ombudsman / 监管义务都会增加人力、控制和治理成本，纯 API
              网关不需要承担这些负担。例如，2025 年上半年 ombudsman 报告显示 3,483 次服务互动、4.4 个工作日平均响应时间、2,435 次外部渠道需求，这提醒投资者：规模也会带来支持和控制开销。

              从公开数据看，资本充足性方向上较强，但无法完整测量。QI Tech 在 2023 年末融资 US$200 million，随后在 2024 年 4 月追加 US$50 million，主要用于资助
              Singulare 收购，2025 年 7 月又追加 US$63 million，用于资助新解决方案、支持 M&A
              并增强现金头寸。管理层多次把收购描述为长期战略的一部分，而不是一次性事件。资本支持降低了近期生存性融资风险，尤其是 General Atlantic 和 Across
              持续参与，且官方来源称公司从第一年起盈利。但公开记录仍缺少投资者真正需要承销的变量：当前现金、月度 burn、经营现金流、分部利润率、债务 /
              优先股义务，以及收购或新受监管产品发布是否比内部利润补充更快地消耗资本。
