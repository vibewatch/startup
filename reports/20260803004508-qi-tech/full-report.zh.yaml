      - number: '4.2'
        title: 定价、销售动作与单位经济：企业合同可见，实际经济性不可见
        blocks:
          - type: paragraph
            body: >-
              QI Tech 的公开页面强烈暗示它采用咨询式企业销售，而不是透明自助定价。产品页反复把买方导向专家，强调模块化集成，并把价值锚定在更快上线、监管覆盖、自动化和降低编排负担上。文档站、webhook 指南和
              playground 进一步强化这一点：它卖的是生产基础设施，有 sandbox / production 隔离、JWT 认证 API、webhook 和 65 个端点的 playground，而不是低接触
              SaaS SKU。最强的显性实施速度信号来自 credit-engine 页面，称集成最快可在两天内接通。客户案例持续把价值主张表述为替代多个供应商、压缩运营前置时间，并把监管复杂性转化为更快
              go-to-market。

              单位经济问题在于，公开的每客户收入、毛利率、流失率和支持成本数据缺失。公开记录中保留下来的唯一价格手册，是面向终端用户 / 受监管银行服务的透明门户资费 PDF；这份文件有助于展示 QI Tech
              的受监管运营边界，但不能很好代理实际 B2B 企业定价。因此公开证据只能支持方向性结论。第一，基金行政管理、托管、支付轨道和嵌入式 recurring flows
              的经常性质量应高于一次性实施工作。第二，利润率可能低于纯软件基准，因为 QI Tech 把受监管运营、客户支持和信托 /
              后台义务与软件结合在一起。第三，交叉销售大概率有经济意义：案例研究反复显示同一客户使用多个模块，2024 年收入结构披露也明确把托管定位为切入其他基础设施的战略楔子。但在管理层披露实际 take
              rate、attach rate 和服务交付成本之前，公开单位经济仍只能推断。
