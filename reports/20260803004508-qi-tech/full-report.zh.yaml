companyProfile:
  summary: >-
    QI Tech 是一家位于 São Paulo 的巴西后期私营 fintech，成立于 2018 年，把持牌信贷、银行、支付、反欺诈、风控、基金行政管理和资本市场基础设施装进同一个平台。公司早期凭借 Banco Central
    批准的首家 Sociedade de Crédito Direto 建立位置，后来通过 Singulare 扩展成更完整的 DTVM / 行政管理与托管栈。资本支持很强：2021 年 US$50M Series A，2023 年
    US$200M Series B，2024 和 2025 年继续延展，估值从独角兽跃升到 US$2B+。产品和客户证据真实存在，但透明财务披露仍然有限。
