            body: >-
              在保留证据中，Celcoin 是最明显的宽直接同行。其自有材料和 Summit Partners 融资公告显示，它拥有横跨银行、支付和信贷的模块化平台，包括 BaaS、清算银行、白标卡、开放保险和监管模块、Pix
              与 ITP 功能、CCB、托管账户、商业票据和 payroll-linked 信贷产品。规模披露也有意义：超过 6,000 家企业客户、超过 400 家金融行业客户、超过 5,000 家非金融公司、2024 年
              Q1 US$63M ARR，以及每月超过 2 亿笔 Pix 交易。

              Dock 从另一个角度竞争：它是更大、更老的平台，强调支付基础设施、卡、欺诈预防、收单和白标银行。Dock 的公开页面强调 25 年以上运营历史、直接 Pix 参与，以及非常宽的支付加卡组合。Zoop
              现在在公开定位中明确绑定 iFood 生态，聚焦统一商业和嵌入式支付，但也拥有支付机构牌照、直接 Pix / 核心银行能力，以及已处理支付、市场平台和商户端点的可观规模。相对 QI Tech，Celcoin
              在模块宽度上最接近，Dock 更接近企业级支付和卡基础设施，Zoop 更接近生态 / marketplace 分发。
