  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层：企业、金融科技公司、资产管理人和生态运营方
        blocks:
          - type: paragraph
            body: >-
              QI Tech 卖的不是一款面向单一买家的单体产品。公开记录至少支撑五类客户画像。第一类是 Vivo 和 Wellhub 这样的大型企业生态，希望把金融嵌入既有分发基础。第二类是 Jeeves
              等金融科技公司和跨境运营方，需要巴西本地监管和运营基础设施，但不想自己从零搭。第三类是 Suno Asset、Estímulo、Ouro Preto、Ártico Capital、LBA 和 Multiplike
              这类基金管理人和结构化信贷专家，痛点不是零售银行 UI，而是受托管理、资产托管、资金托管和文件流。第四类是 Fintech do Corban 这类银行代理 / 放贷运营方，以及类似的信贷发起合作伙伴。第五类是
              Almah 这样的垂直运营方，需要账户、支付、开户和反欺诈打通。

              这组客户重要，因为它说明买方成熟度高，销售周期大概率偏咨询式。QI Tech
              的客户通常不是在买便宜的点工具；它们是在外包受监管的工作流。公开企业材料也明确，公司卖给那些想以自有品牌打造金融产品的企业。这会抬高单客收入空间，也会增加切换成本和实施摩擦。因此，可见客户面更支持“企业级基础设施”的解读，而不是“自助式金融科技软件”。
