      - - Zoop
        - 直接同业 / 嵌入式支付和商业基础设施
        - 年处理额 +R$35B；440 个市场平台；1.4M 个商户
        - 市场平台、平台方、全渠道商业
        - iFood 生态关系和统一商业切入点
        - 看起来在支付 / 商业最强，在托管 / 基金栈上不如 QI Tech 明确
      - - Pluggy
        - 相邻 / Open Finance 与支付连接器
        - 400+ 个平台；130+ 家机构；公开价格
        - 软件厂商、金融科技公司、金融 App
        - API 驱动的数据与支付连接器，价格透明
        - 覆盖面比全栈受监管基础设施窄
      - - Matera
        - 相邻 / 核心银行和即时支付平台
        - 280+ 个客户；90M+ 个数字账户；每月 600M+ 笔即时支付
        - 银行、大型金融机构、现代化项目
        - 实时银行和 Pix 积累很深
        - 围绕类似赞助银行的信贷 + 托管组合，定位没那么明显
      - - Pismo
        - 相邻 / 全球云原生银行平台
        - Tier-1 银行客户；引用的一个客户案例里管理 46M 张卡
        - 银行、零售商、数字银行、发卡机构
