            body: >-
              QI Tech 不只是单一产品 API 供应商。SCD 牌照、证券分销 / 基金基础设施和宽运营栈结合在一起，让它能把信贷、支付、入驻、反欺诈、托管和嵌入式银行打包成面向企业客户的一段关系。这种宽度解释了为什么
