  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同行、相邻玩家、替代方案与潜在进入者
        blocks:
          - type: paragraph
            body: >-
              相关竞争格局至少有六类。第一类是直接嵌入式金融基础设施同行，销售宽企业栈：Celcoin、Dock 和 Zoop。第二类是相邻数据 / 连接玩家，例如 Pluggy，覆盖更窄但战略上重要的工作流切片。第三类是
              Matera 和 Pismo 这样的核心平台供应商，它们能支撑数字银行、发卡、钱包和实时支付，即便不复制 QI Tech 的监管封装或托管角度。第四类是传统银行和 sponsor-bank
              关系，让企业通过合作而非软件牵引基础设施推出金融产品。第五类是碎片化多供应商架构，买方把 open-finance、KYC、支付和信贷工具从不同供应商拼在一起。第六类是内部自建，尤其适用于有资本和耐心的大企业。

              因此，QI Tech 不是靠单独存在而赢；当买方偏好一个集成、受监管、本地化的栈，而不是 mix-and-match
              架构或全球核心银行平台时，它才会赢。这个差异很关键，因为许多对手能匹配一个模块，但更少能在同一个本地运营伞下同时匹配受监管信贷发放、Pix、反欺诈、入驻和 FIDC / 基金行政管理。
