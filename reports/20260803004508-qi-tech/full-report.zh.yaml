      - number: '8.4'
        title: 情景分析与估值结论
        blocks:
          - type: paragraph
            body: >-
              估值的核心问题不是 QI Tech 好不好——它显然有有意义的市场位置——而是 US$2B+ 是否已经把下一段执行的大部分成果计入价格。乐观情景下，产品宽度转化为持久交叉销售，Singulare
              整合扩大变现，公司的规模指标变成强收入和利润率进展。在这个世界里，溢价私募市场估值可以成立。悲观情景下，公开规模指标夸大变现质量，支持 / 事件问题放慢企业采用，多实体整合让运营模型复杂到收入基础难以支撑。

              基于当前公开证据，最可辩护的立场是建设性但有纪律。QI Tech
              更可能因为披露风险而显得估值偏高，而不是因为战略质量不足。换句话说，公司大概率应该较简单金融科技工具同业享有溢价，但在看到经审计收入、分部毛利率、集中度、队列留存和事件整改证据之前，投资者应要求尽调折扣。建议：战略上正面，估值上保持中度谨慎；在把
              US$2B+ 视为完全证实的公允价值前，必须坚持更深尽调。
