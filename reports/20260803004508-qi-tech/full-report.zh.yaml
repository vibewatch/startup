      - number: '2.4'
        title: 增长驱动、采用约束与保留尽调缺口
        blocks:
          - type: paragraph
            body: >-
              巴西仍是全球受监管金融基础设施最强的结构性市场之一。BCB 2025-2026 年优先事项明确包括 Open Finance 演进、Pix 扩张、eFX 规则评估、AI 监控和 BaaS
              法规落地。Chambers 同样描述了一个信贷市场：fintech 持续扩大信贷可得性，监管则在审慎监督和现代化之间调整平衡。这些驱动因素直接影响 QI
              Tech，因为当客户需求从孤立点解决方案转向集成、监管就绪栈时，拥有牌照、合规能力和多运营模块的公司会受益。

              约束同样真实。合规和信任要求很高；销售周期可能很长，因为预算负责人通常要一起批准 KYC、欺诈、资金和法律风险影响。竞争集合很拥挤：Celcoin、Dock、Zoop、Pluggy、Matera
              和内部银行替代方案都服务栈中的不同切片。公开证据仍无法拆出核心市场指标，例如 take
              rate、每客户净收入，或支付价值与软件收入之间的精确边界。结果是一个明显很大且在扩张的市场，但投资者在把轨道交易量转换成持久股权价值之前，仍需要更深入的自下而上定价和 cohort 数据。
