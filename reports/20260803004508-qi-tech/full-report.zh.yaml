      - number: '1.4'
        title: 规模、产品宽度与运营足迹
        blocks:
          - type: paragraph
            body: >-
              QI Tech 的产品足迹横跨 banking-as-a-service、白标银行、payments-as-a-service、lending-as-a-service、反欺诈、入驻，以及 FIDC 行政管理 /
              托管。官方产品页给出的网站快照规模包括 US$88B Pix 交易、US$19B 已发放信贷、US$18B 反欺诈保护金额，以及 US$28B 在管资产。行政管理与托管页面进一步收窄到平台上超过 1,100
              只基金、超过 700 只 FIDC。这些数字是网站口径，不是经审计披露，但方向上与独立媒体和客户案例中的其他规模信号一致。

              2025 年 Series B 延展材料补充了更丰富的运营指标：每月超过 2,000 万次反欺诈分析、超过 9,000 万次已验证注册，以及每月约 US$13M 潜在欺诈流量被拦截。同一来源称，收购
              Singulare 之后，QI Tech 按 Anbima 2025 年 7 月排名成为巴西领先的 FIDC 托管人，托管资产 US$17B、在管资产 US$25B。另据公司在 Banco Central 批准
              Singulare 交易时的表述，合并平台将管理超过 1,000 只基金和 BRL121B 资产，其中包括超过 650 只 FIDC；该表述使用的是 2024 年 Uqbar
              口径。这些披露并不完全可比，但合在一起显示，公司已从 API 驱动的信贷基础设施供应商，成长为具备明显资本市场规模的多牌照金融运营平台。
