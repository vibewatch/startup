      - number: '4.4'
        title: 财务结论：有吸引力的平台经济性说得通，但证据集对投资者仍不完整
        blocks:
          - type: paragraph
            body: >-
              正向财务案例很直接。QI Tech 有强融资支持、公开声称早期盈利、宽产品栈、可见企业牵引力，以及看起来比本金自担型 fintech 贷款机构更资本高效的商业模式。2024 年收入预测、披露的收入结构和 2025
              年运营规模代理指标共同指向一家已经具备明显规模、且在多元化的公司。客户案例也支持这样的判断：QI Tech 卖的是高价值工作流压缩，而不只是通用支付 API；Vivo Pay、Wellhub、Ouro Preto
              和 LBA 都把 QI Tech 描述为一个运营层，把信贷、文档、托管、托管账户和基金基础设施打包进一个受监管交易对手。

              负面案例同样清楚。QI Tech 不公布当前经审计收入、毛利率、现金 runway、客户集中度或实际定价。公开规模指标也不一致：较早英文页面显示 US$88 billion Pix volume 和 US$28
              billion under administration，2025 年葡萄牙文页面显示 +R$494 billion Pix 和 +R$170 billion under administration，DCM
              页面则声称 R$175 billion under
              administration。这些差异不能证明错报，但确实说明投资者不能把公开表面指标当成干净时间序列。正确财务结论因此是：对业务质量谨慎正面，对披露质量负面。QI Tech
              可能已经是一门好生意；问题是，公开证据仍无法告诉外部投资者它究竟有多好、多赚钱、多能产现金。
