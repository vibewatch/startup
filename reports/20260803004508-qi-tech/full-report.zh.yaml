      - number: '7.2'
        title: 控制环境与治理风险
        blocks:
          - type: paragraph
            body: >-
              纸面上，QI Tech 的控制环境比许多创业公司同业更成熟。保留证据显示，公司有基于 LGPD 的隐私通知；网络安全政策引用 ISO/IEC 27001、NIST CSF、CMN 4.893/2021 和 BCB
              85/2021；AML/CFT 政策列明治理角色和委员会；反腐败政策给出公共部门和礼品指引；道德准则体现举报机制；透明度门户集中展示公开控制栈。这些都是有意义的正面信号，因为它们说明公司扩张时已经把治理正式化。

              但看得见政策，不等于证明控制有效。公开文件没有证明运营有效性、事件响应成熟度、职责隔离质量或审计整改表现。最善意的读法是，QI Tech
              已经为受监管平台搭好了正确脚手架。更怀疑的读法是，快速扩张、整合收购、拓宽产品范围，很容易跑在政策背后日常执行质量之前。这是典型的金融科技
              基础设施风险缺口：治理文件可以很强，但仅凭公开证据仍难判断控制保证能否成立。
