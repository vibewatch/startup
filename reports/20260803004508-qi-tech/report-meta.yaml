  foundingLocation: São Paulo, Brazil
  headquarters: São Paulo, Brazil
  productSummary: >-
    API-driven licensed infrastructure across Lending as a Service, Banking as a
    Service, Payment as a Service, anti-fraud / onboarding / risk tools,
    administration and custody of funds, and capital-markets / DCM workflows.
  customerFocus: >-
    Enterprise customers including fintechs, banks, corporates, asset managers,
    structured-credit operators, correspondents, and vertical platforms that
    want to launch or outsource regulated financial workflows.
  businessModel: >-
    Monetizes through infrastructure fees tied to credit origination, banking and
    payment processing, anti-fraud and onboarding workflows, fund administration
    and custody, and adjacent capital-markets services, with multi-module
    enterprise expansion as a major value driver.
  stage: Late-stage private fintech / post-Series B extensions
  fundingStatus: >-
    US$200M Series B in 2023, US$50M extension in 2024 at roughly US$1.5B, and
    US$63M extension in 2025 at US$2B+.
