companyProfile:
  summary: >-
    QI Tech is a São Paulo-based late-stage private Brazilian fintech founded in
    2018 that combines licensed credit, banking, payments, anti-fraud, risk,
    fund-administration, and capital-markets infrastructure in a single platform.
    The company built its early position as the first Sociedade de Crédito
    Direto approved by Banco Central and later expanded through Singulare into a
    broader DTVM / administration-and-custody stack. Public capital support has
    been strong—from a US$50M Series A in 2021 to a US$200M Series B in 2023 and
    extensions in 2024 and 2025 that pushed valuation from unicorn status to
    US$2B+. Product and customer evidence is real, but transparent financial
    disclosure remains limited.
  foundedDate: '2018-01-01'
  founders:
    - name: Pedro Mac Dowell
      role: Founder and CEO
      background: >-
        Public face of the company across funding, customer, and strategic
        expansion narratives.
      claimRefs: [CO010, CO011]
    - name: Marcelo Bentivoglio
      role: Co-founder and CFO
      background: >-
