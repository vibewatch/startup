  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: unresolved-commercial-backlog
      missingEvidence: Audited revenue breakdown by defense program, non-recurring engineering margin vs production margin, and firm contracted backlog versus option ceilings.
      whyItMatters: Without segmented program backlog, institutional underwriters cannot distinguish one-off prototype revenue from durable recurring production cash flows.
      diligencePath: Request program-level revenue accounting, gross margin schedule by SKU, and option exercise timeline during confirmatory management diligence.
      relatedQuestionRefs:
        - QI008
    - type: missing-source
      severity: material
      topic: unit-economics-and-manufacturing-yield
      missingEvidence: Detailed bill-of-materials cost breakdown for Line Replaceable Amplifier Modules, Gallium Nitride semiconductor packaging yields, and field sustainment overhaul costs.
      whyItMatters: Hardware gross margins depend heavily on solid-state module manufacturing yields and replacement cycles under high-duty field conditions.
      diligencePath: Obtain engineering BOM cost models and historical depot repair records from Fort Sill or Yuma Proving Ground trials.
      relatedQuestionRefs:
        - QI003
        - QI008
    - type: private-evidence-only
      severity: material
      topic: capital-adequacy-and-cash-burn
      missingEvidence: Current cash balance, net monthly cash burn rate, capitalization table preference stack from the March 2025 Series D, and runway length.
      whyItMatters: Given the Army pause on fixed IFPC-HPM procurement, commercial viability hinges on cash runway before mobile prototype or allied FMS awards materialize.
      diligencePath: Review unaudited quarterly balance sheets, trailing twelve-month burn trajectory, and Series D investor rights agreements.
      relatedQuestionRefs:
        - QI004
        - QI008
