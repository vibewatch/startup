callouts:
  - calloutType: risk
    title: Army IFPC-HPM Procurement Divestment
    body: While Epirus successfully secured $127 million across early prototype development, the Army transition to competitive mobile microwave prototyping and lack of FY2027 procurement allocation represents a significant near-term revenue hurdle.
    claimRefs:
      - CI008
      - CI009
  - calloutType: insight
    title: Asymmetric Unit Economics of High-Power Microwaves
    body: Leonidas inverts the unfavorable cost exchange of kinetic missile defense by defeating entire drone swarms with electrical energy, but the $10M-$20M upfront system acquisition cost requires high threat volumes to achieve amortized cost efficiency.
    claimRefs:
      - CI004
      - CI010
      - CI011
