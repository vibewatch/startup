company:
  name: Epirus
chapter:
  number: 4
  title: Financials
  summary: Epirus has secured over $140 million in prototype awards across the U.S. Army and Marine Corps and raised $550 million in venture capital, but faces near-term commercial uncertainty as the Army pivots away from further trailer procurement toward competitive mobile solutions.
sections:
  - id: revenue-model-and-contract-streams
    title: Revenue Model and Defense Contract Streams
    body: Epirus operates as a defense technology hardware developer and systems integrator whose recognized revenue is anchored in federal prototype development awards and cost-plus other transaction agreements. The company secured an initial $66.1 million award from the U.S. Army Rapid Capabilities and Critical Technologies Office in December 2022 to build four first-generation Indirect Fire Protection Capability High-Power Microwave prototypes. This was supplemented in July 2025 by a $43.6 million contract for two second-generation systems, bringing cumulative Army prototype awards to roughly $127 million. In August 2026, the Marine Corps awarded Epirus an $11 million contract for the vehicle-mounted HAVOC system. Most recently in October 2026, the Department of War selected Leonidas as the sole microwave weapon in the JIATF-401 installation defense pilot, validating operational utility across joint military test beds while leaving commercial production commitments unconfirmed.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI014
    tableRefs:
      - TI001
  - id: pricing-and-cost-structure
    title: System Pricing, Unit Economics, and Cost Structure
    body: Pricing for the Leonidas system is structured around high-value capital equipment acquisitions coupled with modular hardware sustainment. Executive commentary places the indicative commercial unit price of a full-scale emplaced Leonidas system between $10 million and $20 million, which aligns with realized prototype package averages when spares and engineering support are factored in. The hardware cost structure is heavily concentrated in high-frequency solid-state power electronics, where banks of roughly 150 Line Replaceable Amplifier Modules account for approximately 65 percent of manufacturing expense. While Epirus positions the marginal cost per engagement as negligible due to continuous electrical generation from a standard 70 kW generator, military evaluators emphasize that defense underwriting must amortize multi-million-dollar capital acquisition and maintenance burdens across realistic engagement volumes rather than focusing solely on fuel consumption.
    claimRefs:
      - CI004
      - CI005
      - CI010
      - CI011
    tableRefs:
      - TI002
      - TI003
  - id: capital-adequacy-and-runway
    title: Capital Adequacy, Financing Structure, and Runway
    body: To capitalize manufacturing scale and advance beyond small prototype batches, Epirus completed an oversubscribed $250 million Series D financing round in March 2025. Co-led by 8VC and Washington Harbour Partners with strategic backing from General Dynamics Land Systems, the round expanded total venture capital raised to more than $550 million. While the company confirmed a post-money valuation exceeding $1 billion, reporting indicated the financing represented a valuation reset below its 2022 Series C benchmark of $1.35 billion. Management directed proceeds toward expanding its 200-person organization, establishing an immersive simulation center at Fort Sill, and scaling Torrance production capacity toward one system per week. However, the private nature of the balance sheet leaves actual monthly cash burn, gross margin realization, and liquidity runway unverified for outside underwriters.
    claimRefs:
      - CI006
      - CI007
      - CI012
    figureRefs:
      - FI001
  - id: financial-verdict-and-underwriting
    title: Financial Verdict and Underwriting Diligence Blockers
    body: The core financial verdict on Epirus reflects a stark tension between operational technical differentiation and defense program-of-record conversion. In April 2026, the Congressional Research Service disclosed that the U.S. Army plans no further procurement of Leonidas trailer systems beyond the delivered prototypes, shifting its fiscal 2027 high-power microwave budget toward competitively sourced mobile platforms. With commercial annual recurring revenue, gross margins, and backlog schedules undisclosed, underwriting Epirus requires treating current revenues as non-recurring developmental funding rather than enterprise software cash flow. Bridging the diligence gap requires verifying international pipeline conversion in allied jurisdictions and auditing the Series D preference stack against forward capital expenditure requirements.
    claimRefs:
      - CI008
      - CI009
      - CI013
