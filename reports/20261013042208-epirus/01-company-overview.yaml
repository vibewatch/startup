company:
  name: Epirus
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Epirus is a Torrance, California-based defense technology firm founded in 2018 that develops software-defined,
    solid-state high-power microwave systems—principally the Leonidas family—to neutralize autonomous drone swarms.
    Following a $250 million Series D co-led by 8VC and Washington Harbour Partners in March 2025 that lifted lifetime
    funding above $550 million, Epirus has fielded initial prototypes across the U.S. Army and Marine Corps while
    navigating an undisclosed down-round valuation reset and transition from rapid prototyping to recurring defense
    production.
sections:
  - id: identity-and-foundations
    title: Company Identity, Origins, and Core Business Model
    body: >-
      Epirus is an American defense technology company founded in 2018 by Silicon Valley entrepreneurs and U.S. military
      veterans, created to address critical national security vulnerabilities arising from the rapid proliferation of
      autonomous unmanned aerial systems. Headquartered in Torrance, California, with administrative and governmental
      liaison offices in Washington, the company operates as a self-described neo-prime contractor that fuses commercial
      venture-backed software development speed with defense-grade hardware engineering. The core of Epirus business
      model centers on developing, manufacturing, and fielding directed energy systems, specifically solid-state
      high-power microwave (HPM) counter-electronics effectors under the Leonidas product brand. Unlike traditional air
      defense platforms that deploy multimillion-dollar kinetic interceptors against low-cost commercial drones, Epirus
      offers an asymmetric cost correction: an unlimited electronic magazine powered by standard electrical generators,
      enabling near-instantaneous defeat of aerial swarms at negligible marginal cost per shot across short-range air
      defense missions.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO010
      - CO014
    tableRefs:
      - TO001
  - id: leadership-and-governance
    title: Leadership Structure, Governance, and Key-Person Exposure
    body: >-
      Epirus is led by Chief Executive Officer Andy Lowery, a defense industry veteran who succeeded Ken Bedingfield
      following initial Army contract prototyping in 2023. Lowery guides the company transition from
      research-and-development prototype delivery to scalable, multi-service defense manufacturing. The technical
      architecture is directed by Chief Technology Officer Michael Hiatt, who oversees the development of gallium
      nitride (GaN) active electronically scanned array antennas and pulse-forming networks that generate the system
      energy-dense microwave waveforms. Executive operations and talent acquisition are reinforced by Chief Operating
      Officer Mark Cuyler and Chief People Officer Mark Horton. At the governance level, co-founder Joe Lonsdale
      (Managing Partner at 8VC) and lead investor Mina Faltas (Founder and Chief Investment Officer at Washington
      Harbour Partners) play decisive roles in strategic capital allocation and Pentagon engagement. Key-person
      dependency remains concentrated in specialized microwave engineering leadership and defense acquisition liaisons
      navigating federal procurement channels.
    claimRefs:
      - CO004
      - CO009
      - CO011
      - CO013
    tableRefs:
      - TO002
  - id: capitalization-and-stakeholders
    title: Capitalization History, Series D Financing, and Down-Round Dynamics
    body: >-
      Since its inception in 2018, Epirus has raised more than $550 million in venture capital across multiple funding
      rounds. After achieving a $1.35 billion valuation during its $200 million Series C financing round in 2022, the
      company completed an oversubscribed $250 million Series D financing round in March 2025. The Series D round was
      co-led by venture capital firm 8VC and private investment firm Washington Harbour Partners LP, with participation
      from strategic corporate investor General Dynamics Land Systems alongside institutional asset managers including
      StepStone Group, funds advised by T. Rowe Price, Oppenheimers Vista VI Fund, and NightDragon. However, Epirus
      faced adverse capitalization pressure during the financing: reporting from Bloomberg and TechCrunch revealed that
      the round was negotiated as a down-round valuation reset relative to its 2022 Series C benchmark. While Epirus
      confirmed to media that its valuation remained above $1 billion, the company declined to disclose its precise
      post-money valuation, common share dilution, or liquidation preference stack, preserving significant valuation
      opacity.
    claimRefs:
      - CO007
      - CO008
      - CO009
      - CO015
    tableRefs:
      - TO003
  - id: operational-scale-and-milestones
    title: Operational Milestones, Field Validation, and Contract Trajectory
    body: >-
      Epirus operational track record is marked by accelerated hardware iteration, major military contract awards, and
      high-visibility field demonstrations. In January 2023, the U.S. Army Rapid Capabilities and Critical Technologies
      Office (RCCTO) awarded Epirus a $66.1 million contract to deliver prototypes of the Leonidas system for the
      Indirect Fire Protection Capability High-Power Microwave (IFPC-HPM) program, delivering the initial system just
      nine months after award. Subsequent awards include a $17 million Army contract in October 2024 and a $43.5 million
      award in July 2025 for IFPC-HPM Generation II systems with doubled range and lethality. In live-fire testing at
      Camp Atterbury in August 2025, Leonidas demonstrated a 100% defeat rate against 61 aerial drones, neutralizing a
      49-drone swarm with a single electromagnetic pulse. In January 2026, Epirus proved the capability of its Leonidas
      VehicleKit to defeat fiber-optic guided FPV drones immune to RF jamming. While the U.S. Army has acquired six
      prototype units and the Marine Corps two, all fielded systems remain prototype evaluations, requiring continued
      diligence regarding formal program-of-record budget line authorization.
    claimRefs:
      - CO005
      - CO006
      - CO011
      - CO012
    figureRefs:
      - FO001
