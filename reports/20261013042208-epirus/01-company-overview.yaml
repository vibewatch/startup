callouts:
  - calloutType: strength
    title: Software-Defined Solid-State Architecture Advantages
    body: >-
      By replacing bulky vacuum tube microwave hardware with modular gallium nitride (GaN) active electronically scanned
      arrays, Epirus achieves a software-defined, unlimited-magazine counter-swarm capability that defeats simultaneous
      threats, including RF-immune fiber-optic drones, at marginal electrical operating cost.
    claimRefs:
      - CO003
      - CO005
  - calloutType: risk
    title: Valuation Reset and Prototype-to-Program Conversion Risk
    body: >-
      Despite raising $250 million in Series D capital, Epirus closed the round with undisclosed valuation terms
      following reports of a down-round from its 2022 peak valuation of $1.35 billion, while its primary Department of
      Defense contracts remain prototype deliveries rather than formally funded production programs of record.
    claimRefs:
      - CO008
      - CO012
