- id: procurement-milestones-and-commercialization-headwinds
  title: Procurement progression, prototype stage gating, and scaling risks
  body: >
    Commercialization progress centers on military procurement contracts, most notably the $66.1 million U.S. Army Rapid Capabilities and Critical Technologies Office contract awarded for Integrated Fires Protection Capability High-Power Microwave prototype systems. Under this effort, Epirus completed delivery of its initial four IFPC-HPM systems in May 2024, followed by additional orders expanding Army prototype acquisition to six systems alongside two systems acquired by the U.S. Marine Corps. Live-fire demonstrations, including an August 2025 event at Camp Atterbury neutralizing a 49-drone swarm with a single pulse, validate the operational efficacy of solid-state gallium-nitride architectures against saturation tactics and fiber-optic-guided drones. Nevertheless, all delivered units currently remain in prototype stages, and field trials across the Indo-Pacific and Middle East have yet to convert into a formalized multi-year program of record, limiting visibility into recurring production revenue and long-term sustainment margins.
  claimRefs:
  - CV006
  - CV007
  - CV008
  - CV009
