callouts:
- calloutType: recommendation
  title: Investment Recommendation Stance
  body: >
    We assign Epirus a track recommendation with a fair valuation stance. While the company has proven the physics of its solid-state high-power microwave effector and demonstrated robust investor backing via its $250 million Series D round, its defense contracts remain in prototype stages. Investors should require verified program-of-record progression and audited financial disclosure before committing growth capital at premium valuations.
  claimRefs:
  - CV001
  - CV002
  - CV007
  - CV009
  - CV013
- calloutType: risk
  title: Prototype Conversion and Competitive Overhang
  body: >
    Epirus faces material operational and competitive risks. All eight U.S. military Leonidas systems (six Army, two Marine Corps) are prototype units rather than serial production awards. Furthermore, traditional defense primes possess deep lobbying presence and existing sensor/effector programs that may compress standalone venture-backed margins if counter-drone architectures favor integrated incumbent platforms.
