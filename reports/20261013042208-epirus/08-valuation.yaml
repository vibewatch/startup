company:
  name: Epirus
chapter:
  number: 8
  title: Valuation & Investment Recommendation
  summary: >
    Epirus's oversubscribed $250M Series D in March 2025 anchored total funding at over $550M, demonstrating sustained capital access and investor commitment to scaling Leonidas high-power microwave manufacturing. However, with systems across the U.S. Army and Marine Corps remaining in prototype testing stages, financial disclosures private, and peer valuations demanding disciplined execution, our recommendation remains track with a fair valuation stance.
sections:
- id: valuation-anchor-and-capital-structure
  title: Financing context, Series D anchor, and capital structure
  body: >
    The primary verifiable anchor for Epirus's valuation and capital position is its oversubscribed $250 million Series D fundraising round closed in March 2025, which expanded cumulative venture financing to more than $550 million. The round was co-led by venture firm 8VC and Washington Harbour Partners, joined by strategic defense partner General Dynamics Land Systems alongside return investors including StepStone Group, Gaingels, and funds advised by T. Rowe Price Investment Management. New institutional participants included Oppenheimer's Private Market Opportunities Vista VI Fund, Manhattan Venture Partners, NightDragon, Centaurus Capital, and Center15 Capital. Capital was earmarked to accelerate manufacturing of the Leonidas high-power microwave product line, build out a warfighter simulation facility in Oklahoma near Fort Sill, and enhance supply chain resiliency. However, explicit post-money valuation marks, liquidation preference stacks, and revenue multiples remain undisclosed in primary sources, requiring investors to underwrite on operational traction rather than headline multiple expansion.
