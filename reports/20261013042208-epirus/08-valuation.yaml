- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Operating assumptions
  - Valuation & return logic
  - Key operational risks
  - Probability signal
  rows:
  - - Bull case
    - IFPC-HPM achieves full program-of-record status with multi-year DoD and allied procurement
    - Significant valuation rerating toward multi-billion tier reflecting mission-critical status
    - Component supply chain bottlenecks and prime contractor lobbying for alternate effectors
    - Moderate — dependent on upcoming Army operational field trials and FMS pipeline conversion
  - - Base case
    - Steady follow-on prototype contracts and niche critical asset protection deployments
    - Capital preservation with moderate appreciation consistent with late-stage venture funding
    - Extended procurement cycle times and delays in international customer adoption
    - High — aligns with current 8-unit military prototype footprint and Series D capitalization
  - - Bear case
    - DoD delays HPM fielding, primes capture layered counter-UAS budgets, cash burn escalates
    - Down-round restructuring or distressed acquisition below cumulative capital invested
    - Excessive cash consumption in manufacturing ramp without corresponding revenue scale
    - Low-to-moderate — mitigated by $250M Series D cash buffer and strategic GDLS alliance
  notes: Scenario models reflect prototype-to-production conversion risk, capital intensity, and defense budget allocation dynamics.
