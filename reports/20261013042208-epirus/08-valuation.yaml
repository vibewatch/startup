- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Core dimension
  - Investment thesis
  - Investment anti-thesis
  - Pivot indicator / diligence trigger
  rows:
  - - Technology & Defensibility
    - Solid-state GaN HPM neutralizes swarms and dark fiber-optic drones at low cost per shot
    - Laser and kinetic systems from prime contractors could squeeze layered air defense budget
    - Head-to-head field evaluation results and deployment of Gen II operational units
  - - Customer Procurement
    - $66.1M Army contract with 6 IFPC-HPM and 2 Marine Corps prototype systems procured
    - All deployed systems remain in prototype evaluation without formalized program of record
    - Transition of IFPC-HPM from prototype contract to multi-year production budget line
  - - Manufacturing & Scale
    - Series D capital funds Oklahoma simulation facility and scaled manufacturing capacity
    - Hardware scaling in defense is capital-intensive with supply chain and yield risks
    - On-time commissioning of Fort Sill simulation facility and disclosed production rate
  - - International & Commercial
    - Export restrictions lifted in 2025 opening allied Indo-Pacific, Middle East, and NATO markets
    - Allied sales require complex FMS approvals, ITAR compliance, and integration testing
    - Announced foreign military sales (FMS) contract awards or signed allied agreements
  notes: Compares the core technology and procurement drivers supporting investment with operational risks and program-of-record dependencies.
