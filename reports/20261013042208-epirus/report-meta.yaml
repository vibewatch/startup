companyProfile:
  summary: >-
    Epirus is a Torrance, California-based defense technology company founded in 2018 that designs and fields Leonidas
    high-power microwave systems to defeat drone swarms and other electronic threats for U.S. military and allied
    defense customers. The company has advanced from rapid prototyping into multi-service evaluation across the Army,
    Marine Corps, and partner-integrated mobile platforms, but it remains a private, capital-intensive business
    transitioning from prototype contracts toward repeatable programs of record.
  founders:
    - name: Joe Lonsdale
      role: Co-Founder & Board Member
      background: Managing Partner at 8VC; co-founder of Palantir, Addepar, and OpenGov.
      claimRefs:
        - CO009
  headquarters: Torrance, California, USA
  productSummary: >-
    Leonidas is a software-defined, solid-state high-power microwave directed-energy system for counter-UAS and other
    counter-electronics missions.
  customerFocus: U.S. Department of Defense buyers, allied ministries of defense, and critical infrastructure protection programs.
  businessModel: >-
