company:
  name: "Epirus"
chapter:
  number: 6
  title: "Customers"
  summary: "Epirus has secured initial prototype adoption across the U.S. Army (six IFPC-HPM units) and U.S. Marine Corps (two vehicle-mounted systems) alongside a strategic integration partnership with General Dynamics Land Systems. However, the Army's decision not to procure additional units beyond early 2026 prototypes and the absence of recurring production programs of record expose Epirus to acute customer concentration and procurement transition risks."

sections:
  - id: "customer-segmentation-and-addressable-demand"
    title: "Customer Segmentation and Defense Demand"
    body: "Customer demand for Epirus' Leonidas high-power microwave (HPM) technology is concentrated across institutional defense buyers facing asymmetric drone swarm saturation. Modern air defense doctrine relies heavily on expensive surface-to-air missiles such as the Patriot or AIM-9X, which create prohibitive economic imbalances when intercepting expendable one-way attack drones. Consequently, Epirus has structured its customer segmentation around military buyers requiring deep electronic magazines and non-kinetic close-in area defense. The primary customer segment comprises U.S. Army short-range air defense programs seeking fixed-site and semi-fixed base protection against small uncrewed aerial systems. A secondary military segment encompasses expeditionary ground and naval forces, spearheaded by the U.S. Marine Corps, which requires vehicle-integrated counter-swarm capabilities. Beyond direct military end-users, defense prime contractors represent a crucial channel segment, embedding Leonidas into established armored and autonomous vehicle lines. Finally, international allied defense ministries represent an expanding pipeline following the lifting of export restrictions, although formal Foreign Military Sales (FMS) contract awards remain unannounced."
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU006"
      - "CU013"
    tableRefs:
      - "TU001"

  - id: "adoption-trajectory-and-operational-testing"
    title: "Adoption Trajectory and Testing Milestones"
    body: "Epirus' customer adoption trajectory has progressed through rapid prototyping and high-visibility live-fire field demonstrations rather than high-rate production contracts. Following an initial $66.1 million contract from the U.S. Army Rapid Capabilities and Critical Technologies Office, Epirus delivered prototype IFPC-HPM systems within nine months. By early 2026, the company had delivered four initial prototypes, with two additional units slated for delivery by March 2026, bringing the Army's total evaluation inventory to six systems. Adoption expanded across services in August 2026 when the U.S. Marine Corps awarded Epirus a contract for two vehicle-mounted microwave counter-swarm weapons. Field testing has validated operational utility in theater environments across the Indo-Pacific and Middle East. Crucially, at a September 2025 live-fire demonstration at Camp Atterbury attended by representatives from the Department of Defense and nine allied nations, Leonidas successfully defeated 61 of 61 drones across five operational flight scenarios, neutralizing an entire 49-drone swarm in a single instant electromagnetic pulse."
    claimRefs:
      - "CU002"
      - "CU004"
      - "CU005"
      - "CU008"
    tableRefs:
      - "TU002"

  - id: "named-deployments-and-partner-channels"
    title: "Named Deployments and Strategic Prime Alliances"
    body: "Confirmed customer proof for Epirus centers on premier Department of Defense research branches and Tier-1 defense prime integrators. The U.S. Army's IFPC Increment 2 program served as Epirus' anchor institutional proof point, validating solid-state gallium nitride phased-array architecture in formal military test ranges. To overcome procurement friction and accelerate vehicle fielding, Epirus forged a key channel partnership with General Dynamics Land Systems (GDLS). In March 2026, Epirus, GDLS, and Kodiak AI unveiled the Leonidas Autonomous Ground Vehicle (AGV) at the AUSA Global Force Symposium. By mounting Leonidas onto a commercial-grade truck chassis equipped with Kodiak's autonomous driving system, GDLS acts as lead system integrator to provide mobile counter-UAS protection for military bases, airfields, and critical infrastructure. This prime contractor alliance broadens Epirus' go-to-market reach without requiring the company to build proprietary vehicle platforms, though it introduces channel margin sharing and integration dependencies."
    claimRefs:
      - "CU007"
      - "CU009"
      - "CU010"
      - "CU012"
    tableRefs:
      - "TU003"

  - id: "retention-concentration-and-procurement-risks"
    title: "Customer Concentration and Program Transition Risks"
    body: "Despite technical milestones, Epirus faces severe customer durability and revenue concentration vulnerabilities. All military acquisitions to date remain developmental prototypes funded through Other Transaction Authority (OTA) mechanisms rather than multi-year procurement programs of record. In April 2026, the Congressional Research Service reported that following delivery of two additional prototypes by March 2026, the U.S. Army planned no further procurement of IFPC-HPM systems and indicated both high-energy laser and microwave variants would not transition to operational fielding, instead being divested as prototype candidates. This procurement cutoff creates a potential 'valley of death' for Epirus' primary revenue source. Because commercial infrastructure buyers have not yet generated significant recurring demand and Marine Corps volumes remain limited to prototype evaluations, Epirus is heavily dependent on converting international interest or winning second-generation counter-swarm requirements to sustain its manufacturing capacity and revenue trajectory."
    claimRefs:
      - "CU011"
      - "CU012"
      - "CU014"
    figureRefs:
      - "FU001"

