callouts:
  - calloutType: "strength"
    title: "Demonstrated Multi-Service and Prime Partner Validation"
    body: "Epirus has expanded its operational footprint from initial U.S. Army prototype contracts ($66.1 million for six IFPC-HPM systems) to include vehicle-mounted awards from the U.S. Marine Corps and a joint development alliance with General Dynamics Land Systems. This multi-stakeholder engagement validates that high-power microwave effectors address urgent operational demands across both stationary installation defense and mobile convoy escort mission sets."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU006"
      - "CU007"

  - calloutType: "risk"
    title: "Army IFPC Divestment and Transition Valley of Death"
    body: "Despite successful live-fire demonstrations defeating 49-drone swarms, Congressional Research Service reporting indicates the U.S. Army plans no further procurement of IFPC-HPM systems beyond the initial six prototypes delivered through March 2026, signaling potential divestment rather than program-of-record fielding. With defense customers accounting for virtually all verified demand, Epirus faces severe customer concentration and the risk of stalling in the developmental OTA transition phase."
    claimRefs:
      - "CU011"
      - "CU012"
      - "CU014"

