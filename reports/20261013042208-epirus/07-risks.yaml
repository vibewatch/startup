callouts:
  - calloutType: risk
    title: Prototype Transition Valley of Death
    body: >-
      While Epirus has successfully deployed six Leonidas IFPC-HPM units with the U.S. Army and two ExDECS units with
      the Marine Corps, all fielded assets remain non-program-of-record prototypes. Defense procurement cycles
      frequently stall between prototype demonstration and full-rate multi-year procurement, creating a multi-year cash
      burn vulnerability if production line awards are delayed.
    claimRefs:
      - CR006
      - CR007
      - CR008
  - calloutType: risk
    title: Valuation Reset and Liquidity Structure
    body: >-
      Epirus' $250M Series D round replenished balance sheet cash reserves to navigate defense procurement cycles, but
      external reports of down-round pricing below its prior $1.35B Series C mark indicate valuation compression.
      Late-stage private capital structures in down rounds often introduce senior liquidation preferences that increase
      downside risk for common equity and earlier investors.
    claimRefs:
      - CR010
      - CR011
      - CR012
