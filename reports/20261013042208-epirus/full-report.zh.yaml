  - id: FM001
    title: 反 UAS 市场规模金字塔：TAM、SAM 与证据约束的 SOM
    type: pyramid
    summary: 展示从 C-UAS 总支出到 Epirus 合同支撑的 HPM SOM 的分层市场规模。
    data:
      items:
        - label: 全球 C-UAS 市场（2025 TAM）
          value: 2008.29
          unit: USD M
          detail: 预计 2025 年全球所有探测和拦截系统的反 UAS 市场总支出。
        - label: 北美 C-UAS 市场（区域 TAM）
          value: 800
          unit: USD M
          detail: 预计北美区域市场份额，代表 Epirus 2025 年的主要作战市场。
        - label: 欧洲与盟友 C-UAS 市场（盟友 TAM）
          value: 450
          unit: USD M
          detail: 欧洲反 UAS 市场，代表 2025 年出口限制放宽后释放的国际拓展机会。
        - label: 美国陆军 IFPC FY2026 预算（相邻 SAM）
          value: 831
          unit: USD M
          detail: 美国陆军 FY2026 对 IFPC Increment 2 发射器、AIM-9X 导弹和弹匣的预算申请。
        - label: Epirus 陆军原型合同累计授予额（受限 SOM）
          value: 109.65
          unit: USD M
          detail: 初始 $66.1M 2023 年陆军合同与 2025 年 7 月 $43.55M Gen II RCCTO 授予额之和，代表已实现的 SOM 获取。
        - label: Epirus 海军 ONR ExDECS 授予额（远征 SOM）
          value: 5.5
          unit: USD M
          detail: 海军研究办公室为海军陆战队远征反蜂群评估提供的原型合同。
    approximationNotes: TAM 和区域数据来自 Market Research Future 2026 年报告；相邻 IFPC SAM 与 Epirus SOM 数值依据官方 CRS 报告 IF12421 和 BDI 合同文件。
