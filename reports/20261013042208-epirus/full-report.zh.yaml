            body: >-
              为扩大制造规模并超越小批量原型阶段，Epirus 于 2025 年 3 月完成超额认购的 2.5 亿美元 D 轮融资。8VC 和 Washington Harbour Partners 共同领投，General
              Dynamics Land Systems 提供战略支持，使累计风险融资超过 5.5 亿美元。公司确认投后估值超过 10 亿美元，但报道称本轮融资估值低于 2022 年 C 轮的 13.5
              亿美元基准。管理层将资金用于扩充 200 人团队、在 Fort Sill 建立沉浸式模拟中心，并将 Torrance
