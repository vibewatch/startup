              Epirus 的客户采用主要靠快速原型开发和高曝光度实弹演示推进，而不是大批量生产合同。美国陆军快速能力与关键技术办公室最初授予 $66.1 million 合同后，Epirus 在 9 个月内交付了
              IFPC-HPM 原型系统。到 2026 年初，公司已交付 4 套初始原型机，另有 2 套计划在 2026 年 3 月前交付，使陆军评估库存达到 6 套。2026 年 8
