  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与运营流程
        blocks:
          - type: paragraph
            body: >-
              Epirus 的防务产品以 Leonidas
              为核心。这是一套能源型高功率微波（HPM）平台，专为在短程防空环境中击退机器人化、非对称的无人机蜂群而设计。传统一对一动能导弹或炮弹拦截弹会迅速耗尽有限弹匣；Leonidas
              则采用一对多架构，通过武器化电磁干扰同时使多个空中威胁失效。该系统封装在模块化 Epirus 点防御框架中，串联起四阶段任务流程：计划（Mission Suite 地形和击杀概率建模）、感知（AI
              驱动的雷达、EO/IR、声学和射频信号多传感器航迹融合）、决策（需要人工授权的互操作指挥控制集成）和效应（由软件管理安全走廊的 HPM
              脉冲）。这套结构让战术操作员能够保护固定军事设施、前沿作战基地、关键工业基础设施和移动战术编队，应对协同饱和攻击。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
