      - number: '1.3'
        title: 资本化历史、D 轮融资与估值下调动态
        blocks:
          - type: paragraph
            body: >-
              自 2018 年成立以来，Epirus 已通过多轮融资筹集超过 $550 million 风险资本。2022 年完成 $200 million C 轮融资时，公司估值达到 $1.35 billion；2025 年
              3 月又完成超额认购的 $250 million D 轮融资。D 轮由风险投资机构 8VC 与私募投资公司 Washington Harbour Partners LP 共同领投，战略企业投资人 General
              Dynamics Land Systems 参与，StepStone Group、T. Rowe Price 顾问基金、Oppenheimers Vista VI Fund 和 NightDragon
              等机构资产管理人也加入。融资期间，公司承受了不利的资本化压力：Bloomberg 和 TechCrunch 报道称，本轮相对于 2022 年 C 轮基准采用了下调估值。Epirus 向媒体确认估值仍高于 $1
              billion，但拒绝披露确切的投后估值、普通股稀释比例或清算优先权结构，估值透明度因此仍然很低。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO015
