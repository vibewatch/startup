      - number: '5.3'
        title: 产品线、模块化变体与部署成熟度
        blocks:
          - type: paragraph
            body: >-
              Epirus 的产品路线覆盖多种形态，均源自模块化 AESA 积木。核心地面 Leonidas 系统已在国防部测试中证明实地有效性；2025 年 8 月在 Camp Atterbury
              的实弹演示中，单次微波脉冲使 49 架无人机蜂群失效，并在 5 个场景中击落飞行的 61 个目标中的 61 个。运营采用已通过原型采购推进，包括美国陆军采购的 6
              套综合火力防护能力高功率微波（IFPC-HPM）系统，以及美国海军陆战队采购的 2 套原型机。在移动机动场景中，Epirus 与 General Dynamics Land
              Systems（GDLS）及自主车辆开发商 Kodiak AI 合作推出 Leonidas AGV，把 Kodiak Driver
              自主驾驶系统装到商用车辆底盘上，提供无人化周界防御。地面变体逐步成熟，但计划中的舰载海上部署仍面临敏感舰载电子设备带来的严重电磁兼容（EMC）障碍；国际部署也受出口管制和实地试验安排限制。
            claimRefs:
              - CE011
