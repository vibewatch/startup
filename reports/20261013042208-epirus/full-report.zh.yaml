      - number: '5.2'
        title: 硬件软件架构与技术差异化
        blocks:
          - type: paragraph
            body: >-
              Leonidas 的核心技术差异化来自固态氮化镓（GaN）半导体积木式设计，这与依赖脆弱、笨重真空管放大器的传统高功率微波平台根本不同。Epirus
              将系统构造成有源电子扫描阵列（AESA），无需机械云台即可实现能量密集型微波波束转向、软件定义波形塑形和模块化扩展。软件控制的波形支持动态击退目标，同时保留操作员划定的低附带损害安全区，避免相邻走廊中的友方电子设备被误伤。此外，固态架构可接入标准战术发电机，形成几乎无限的电子弹匣；相比数百万美元的动能拦截弹齐射，每次交战的增量成本极低。不过，定向能微波的物理特性要求清晰视距传播；面对电磁加固或屏蔽机身时会出现衰减或性能下降，并且需要较大的主电力。
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
