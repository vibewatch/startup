      - number: '6.4'
        title: 客户集中度与项目转化风险
        blocks:
          - type: paragraph
            body: >-
              尽管取得了技术里程碑，Epirus 仍面临严重的客户持续性和收入集中风险。迄今所有军事采购都是通过其他交易授权（OTA）机制资助的开发性原型，而不是多年期正式采购项目。2026 年 4
              月，国会研究服务处报告称，陆军在 2026 年 3 月交付另外 2 套原型机后，不再计划采购 IFPC-HPM 系统，并表示高能激光和微波变体都不会转入作战部署，而会作为原型候选项目被裁撤。采购中止可能让
              Epirus 的主要收入来源掉进“死亡之谷”。商业基础设施买家尚未形成显著经常性需求，海军陆战队采购量也仅限于原型评估，因此 Epirus
              高度依赖国际兴趣转化，或赢得第二代反蜂群需求，才能维持制造产能和收入轨迹。
            claimRefs:
              - CU011
              - CU012
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU007
              - CU010
              - CU011
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 多军种与主承包商伙伴的验证
            body: >-
              Epirus 已将运营足迹从最初的美国陆军原型合同（为 6 套 IFPC-HPM 系统提供 $66.1 million）扩展到美国海军陆战队的车载系统订单，以及与 General Dynamics Land
              Systems 的联合开发联盟。这种多方参与验证了高功率微波效应器能同时满足固定设施防御和移动车队护航两类紧迫运营需求。
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
          - type: callout
            title: 陆军 IFPC 裁撤与转化死亡之谷
            body: >-
              尽管实弹演示成功击退 49 架无人机蜂群，国会研究服务处报告显示，美国陆军在截至 2026 年 3 月交付最初 6 套原型机之外，不再计划采购 IFPC-HPM
              系统；这更像是可能裁撤，而非转入正式项目部署。由于国防客户几乎贡献了全部已验证需求，Epirus 面临严重客户集中风险，也可能卡在开发性 OTA 转化阶段。
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU014
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、出口管制与采购治理
        blocks:
          - type: paragraph
            body: >-
              Epirus 所处的国防科技环境监管密集，受《武器出口管制法》和《国际武器贸易条例》严格监督。Leonidas
              能发射武器化高功率微波、使空中威胁失效，因此其底层软件波形、天线阵列和射频子系统被归类为防务物项，需要获得国务院明确批准。为遵守美国政府出口规定，Epirus
              执行严格的人员安全控制，要求工程和测试人员持有美国公民身份或永久居留权。2025 年以前，严格的法定出口限制阻止国际部署；尽管北约伙伴和乌克兰的盟国兴趣有所增加，双边技术转让许可仍是全球商业化的长期闸门。
            claimRefs:
              - CR001
              - CR002
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
      - number: '7.2'
        title: 运营、制造良率与供应链漏洞
        blocks:
          - type: paragraph
            body: >-
              固态高功率微波阵列的制造会带来复杂的硬件良率、热管理和射频校准风险。Leonidas 不同于依赖笨重真空管的传统微波系统，采用先进氮化镓半导体和有源电子扫描阵列架构。Epirus
              的测试工程团队主动分诊生产硬件良率问题，并验证高容量射频和电力电子模块的自动化测试台。公司通过可更换放大器模块降低单点故障风险，使系统在部分故障时仍能平稳降级。不过，舰载集成试验已遇到严重的电磁环境效应挑战：高功率定向能脉冲可能干扰舰上敏感通信、雷达和航空电子设备。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR013
      - number: '7.3'
        title: 国防部项目依赖与合作方交易对手风险
        blocks:
          - type: paragraph
            body: >-
              Epirus 的收入和项目高度集中于美国国防部，因此容易受到联邦预算优先级变化影响。公司的主要国防业务包括美国陆军 $66.1 million 的间接火力防护能力高功率微波项目合同，以及美国海军陆战队 $5.5
              million 的远征定向能反蜂群项目合同。关键在于，陆军 6 套系统和海军陆战队 2 套系统仍是原型评估单元，而不是获得多年期资金支持的正式项目。为支持车辆集成，Epirus 与 General
              Dynamics Land Systems 保持股权和技术合作；但无法正式转入正式项目，仍是结构性采用障碍。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.4'
        title: 现金消耗、估值重置与下调轮风险
        blocks:
          - type: paragraph
            body: >-
              开发定向能硬件需要大量资本投入、持续研发支出和专业制造基础设施。2025 年 3 月，Epirus 完成超额认购的 2.5 亿美元 D 轮融资，由 8VC 和 Washington Harbour
              Partners 共同领投，使累计融资超过 5.5 亿美元。公司确认估值高于 10 亿美元，但 Bloomberg 报道称，本轮融资估值低于 2022 年 C 轮的 13.5
              亿美元。估值收缩表明公司经历了下调轮重置，可能带来清算优先权负担和大幅普通股稀释；如果采购收入扩张慢于预期，财务脆弱性将进一步上升。
            claimRefs:
              - CR010
              - CR011
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR010
              - CR011
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 原型转化死亡之谷
            body: >-
              Epirus 已向美国陆军部署 6 套 Leonidas IFPC-HPM 系统、向海军陆战队部署 2 套 ExDECS
              系统，但所有已部署资产仍是非正式项目原型。国防采购经常卡在原型演示与全速多年期采购之间；如果量产线订单延迟，公司可能面临多年现金消耗风险。
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR008
          - type: callout
            title: 估值重置与流动性结构
            body: >-
              Epirus 的 2.5 亿美元 D 轮融资补充了资产负债表现金储备，使其能够应对国防采购周期；但外部报告称本轮定价低于此前 13.5 亿美元的 C
              轮基准，显示估值收缩。后期私募资本结构在下调轮中经常引入优先级更高的清算优先权，从而增加普通股和早期投资人的下行风险。
            calloutType: risk
            claimRefs:
              - CR010
              - CR011
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景、D 轮锚点与资本结构
        blocks:
          - type: paragraph
            body: >
              Epirus 估值和资本状况最主要、可核实的锚点，是 2025 年 3 月完成的超额认购 2.5 亿美元 D 轮融资；本轮将累计风险融资扩大到超过 5.5 亿美元。8VC 和 Washington Harbour
              Partners 共同领投，战略防务伙伴 General Dynamics Land Systems 参与，StepStone Group、Gaingels 和 T. Rowe Price Investment
              Management 顾问基金等老股东也继续投资。新的机构参与者包括 Oppenheimer's Private Market Opportunities Vista VI Fund、Manhattan
              Venture Partners、NightDragon、Centaurus Capital 和 Center15 Capital。资金计划用于加快 Leonidas 高功率微波产品线制造、在 Fort Sill
              附近的 Oklahoma 建设作战人员模拟设施，以及增强供应链韧性。不过，主要来源仍未披露明确的投后估值、清算优先权结构和收入倍数，因此投资者需要依据运营进展，而不是账面倍数扩张来评估公司。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV009
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV009
              - CV013
      - number: '8.2'
        title: 采购推进、原型阶段闸门与规模化风险
        blocks:
          - type: paragraph
            body: >
              商业化进展主要依托军方采购合同，其中最重要的是美国陆军快速能力与关键技术办公室授予的 $66.1 million Integrated Fires Protection Capability
              高功率微波原型系统合同。在该项目下，Epirus 于 2024 年 5 月完成首批 4 套 IFPC-HPM 系统交付；随后追加订单将陆军原型采购扩大至 6 套，另有 2 套由美国海军陆战队采购。
              实弹演示也在验证固态氮化镓架构对抗饱和战术和光纤制导无人机的作战效果；例如，2025 年 8 月在 Camp Atterbury 的一次演示中，单脉冲就摧毁了 49
              架无人机组成的蜂群。不过，目前交付的全部设备仍处于 原型阶段，印太和中东的实地试验也尚未转化为正式的多年制式项目，因此经常性生产收入和长期保障利润率 仍缺乏可见度。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV013
      - number: '8.3'
        title: 前沿硬件可比公司、正反论点与建议
        blocks:
          - type: paragraph
            body: >
              跨资产估值对标需要考察正在推进高资本强度硬件扩张的军民两用防务和前沿科技同业。Joby Aviation 等上市前沿 硬件公司截至 2026 年第一季度仍拥有稳健资产负债表，现金、现金等价物及短期投资合计
              $2.5 billion；而 私营防务科技公司的估值分化很大，关键取决于能否拿下制式项目。Epirus 的投资逻辑在于其独特的非对称优势： 它是唯一一家已投入运营的固态 HPM
              供应商，能以无限弹匣实现一对多反蜂群防御。反方论点则指出，公司部署 仍集中于原型系统，可能面临主承包商竞争，且未披露单位经济性。综合乐观、基准和悲观情景，我们给出
              高置信度的跟踪建议；在项目转为正式制式项目、财务透明度改善前，风险评级维持高位，估值判断为合理。
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV009
              - CV010
              - CV012
      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 投资建议立场
            body: >
              我们对 Epirus 给出跟踪建议，估值判断为合理。公司已经证明其固态高功率微波效应器的物理可行性，并通过 $250 million Series D
              融资展现出强劲的投资者支持，但防务合同仍处于原型阶段。在以溢价估值投入成长资本 前，投资者应先要求看到经核实的制式项目推进和经审计的财务披露。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV009
              - CV013
          - type: callout
            title: 原型转化与竞争压力
            body: >
              Epirus 面临重大的运营和竞争风险。美国军方的 8 套 Leonidas 系统（陆军 6 套、海军陆战队 2 套）全部仍是
              原型设备，而非批量生产订单。此外，传统防务主承包商拥有深厚的游说网络和现成的传感器／效应器项目； 如果反无人机架构偏向整合后的 incumbent 平台，这些项目可能压缩风险投资支持的独立供应商利润率。
            calloutType: risk
            claimRefs:
              - CV007
              - CV009
              - CV010
              - CV014
