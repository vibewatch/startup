      - number: '1.2'
        title: 领导层结构、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              Epirus 由首席执行官 Andy Lowery 领导。Lowery 是国防行业老兵，在 2023 年完成最初的陆军合同原型开发后接替 Ken Bedingfield。Lowery
              负责带领公司从研发原型交付转向可规模化、多军种的国防制造。技术架构由首席技术官 Michael Hiatt
              负责；他主管氮化镓（GaN）有源电子扫描阵列天线和脉冲形成网络，这些部件生成能量密度高的微波波形。首席运营官 Mark Cuyler 和首席人事官 Mark Horton
              分别强化运营和人才招募。治理方面，联合创始人 Joe Lonsdale（8VC 管理合伙人）与首席投资人 Mina Faltas（Washington Harbour Partners
              创始人兼首席投资官）主导战略资本配置和五角大楼关系。关键人物依赖集中在专业微波工程领导层，以及负责穿行联邦采购渠道的国防采购联络人。
            claimRefs:
