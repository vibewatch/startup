              - CM011
              - CM015
      - number: '2.4'
        title: 增长驱动、集成现实与采用约束
        blocks:
          - type: paragraph
            body: >
              高功率微波系统的采用速度受到现代无人机战争尖锐的经济和作战不对称性推动。自主无人机蜂群和光纤系留 FPV 无人机会让传统射频干扰失效；用数百万美元的动能导弹攻击廉价无人机，则会迅速耗尽防御弹药储备。固态 HPM
              系统依靠普通发电机供电，提供深厚的电子弹匣容量，每次射击的边际成本极低。不过，关键采用约束会压低估值扩张。国会研究服务处的官方评估显示，截至 2026 年 3 月交付 6 套陆军 IFPC HPM
              原型机后，陆军没有进一步采购计划；国会监督机构正在质疑 IFPC HPM 变体是否会被裁撤，而不是部署到作战部队。此外，投入作战需要与 Operation Jailbreak Falcon Fury
              等指挥控制网络无缝集成，并进行严格的射频去冲突，以免误伤友方电子设备。
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 美国陆军 IFPC HPM 正式项目的结构性采购断崖
            body: >-
              Epirus 已向美国陆军成功交付 4 套高功率微波原型机，并计划依据 RCCTO 合同在 2026 年 3 月前再交付 2 套第二代原型机；但国会研究服务处报告称，陆军不再计划采购 IFPC HPM
              变体。陆军为 2027 财年单独申请 $1.6 billion，用于动能 IFPC 增量 2 拦截弹，并考虑将 HPM 开发限制在原型阶段之外予以裁撤，Epirus 因而面临严峻的正式项目转化障碍。
            calloutType: risk
            claimRefs:
              - CM007
              - CM013
              - CM014
          - type: callout
            title: 不对称经济性与分层架构推动非动能需求
            body: >-
              现代无人机战争让传统防空的成本交换比变得不可持续：用 40 万美元以上的动能导弹攻击 2000 美元的无人机，会耗尽防御弹药。Epirus 通过单次微波脉冲瞬间使 49 架无人机蜂群失效，并在 Operation
              Jailbreak Falcon Fury 期间验证了与开放式 C2 架构的集成，因此将 Leonidas 定位为不可或缺的非动能层，而非独立武器；它能把昂贵拦截弹留给更高层级威胁。
            calloutType: insight
            claimRefs:
              - CM003
              - CM005
              - CM012
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 反无人机系统竞争格局与架构谱系
        blocks:
          - type: paragraph
            body: >-
              敌对无人机系统扩散后，军事防空已从高空导弹拦截转向覆盖国防、关键基础设施和商业设施的复杂低空反无人机作战。现代反无人机方案分为三类主要技术：动能炮弹和导弹拦截弹、射频探测与干扰系统，以及包括高能激光和高功率微波在内的定向能武器。Raytheon
              Technologies、Lockheed Martin、Northrop Grumman 和 General Dynamics
              等传统国防主承包商，凭借成熟的正式项目和与美国国防部及国际盟军的深厚客户关系保持强大的既有地位。然而，面对无人机蜂群，传统防空架构存在严重的结构性漏洞。用 Stinger 或 Coyote
              等高成本动能拦截弹攻击廉价民用和军用无人机，会造成不可持续的经济劣势；电子战射频干扰则完全无法对付不发射无线电信号的自主无人机和光纤制导无人机。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP011
      - number: '3.2'
        title: 核心能力差异化与非动能蜂群击退
        blocks:
          - type: paragraph
            body: >-
              Epirus 的 Leonidas
              平台采用固态氮化镓（GaN）半导体放大器与有源电子扫描阵列（AESA）天线，摆脱了传统高功率微波系统使用的脆弱、笨重磁控管真空管。固态架构可生成软件定义的定向微波波形，瞬间把能量束导向一大片立体空域。高能激光需要持续照射，逐个烧穿无人机机身；Leonidas
              则产生高压电子冲击，使波束路径内所有空中威胁的飞控、马达驱动器和电源电路同时过载。2025 年 8 月在 Camp Atterbury 的实弹演示中，Leonidas 在 5 个作战场景中击退 61 架无人机中的
              61 架，包括用瞬时脉冲击退来袭的 49 架无人机蜂群。软件定义后端还支持精确频率陷波，为友方通信系统划定安全走廊。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
