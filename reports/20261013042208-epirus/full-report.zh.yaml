figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Epirus 从 2018 年成立至 2026 年的组织、财务、运营和技术关键里程碑。
    data:
      items:
        - date: '2018'
          detail: 由硅谷创业者和防务老兵在洛杉矶创立，旨在开创固态 HPM 反无人机防御。
          label: 公司成立
        - date: '2022'
          detail: 以 $1.35B 估值完成 $200M Series C，并通过内部研发开发第一代 Leonidas。
          label: Series C 融资与 Gen 1 Leonidas
        - date: 2023-01
          detail: 获陆军 RCCTO 授予 $66.1M Leonidas IFPC-HPM 系统原型合同。
          label: 美国陆军 RCCTO 合同授予
        - date: 2024-10
          detail: 交付原型并完成实地验证后，获得 $17M 美国陆军合同。
          label: 美国陆军合同授予
        - date: 2025-03
          detail: 由 8VC 和 Washington Harbour Partners 联合领投，完成 $250M Series D，使累计风险投资超过 $550M。
          label: Series D 融资（$250M）
        - date: 2025-04
          detail: 推出 Leonidas H2O 海事变体，并向美国海军交付 ExDECS 原型供海军陆战队测试。
          label: 海事与海军原型推出
        - date: 2025-07
          detail: 获美国陆军授予 $43.5M IFPC-HPM 第二代系统合同，射程和杀伤力翻倍。
          label: 陆军 IFPC-HPM Gen II 授予
        - date: 2025-08
          detail: 在实弹演示中压制 61 架中的 61 架无人机，最终用单个电磁脉冲摧毁由 49 架无人机组成的蜂群。
          label: Camp Atterbury 蜂群击败演示
        - date: 2026-01
          detail: 使用 Leonidas VehicleKit 电磁干扰，首次已知地击败光纤制导 UAS。
          label: 光纤制导无人机击败
        - date: 2026-03
          detail: 与 General Dynamics Land Systems 和 Kodiak AI 合作，发布自主反 UAS HPM 系统。
          label: 自主 HPM 系统发布
    approximationNotes: 里程碑日期依据公告发布日期和公开合同授予时间表。
    claimRefs:
      - CO001
