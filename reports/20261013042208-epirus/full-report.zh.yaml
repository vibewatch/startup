      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 软件定义固态架构的优势
            body: Epirus 用模块化氮化镓（GaN）有源电子扫描阵列替代笨重的真空管微波硬件，打造软件定义、电子弹匣容量近乎无限的反蜂群能力；它能同时击退包括不受射频干扰影响的光纤无人机在内的多重威胁，而边际电力运营成本极低。
            calloutType: strength
            claimRefs:
              - CO003
              - CO005
          - type: callout
            title: 估值重置与从原型转向正式项目的风险
            body: >-
              尽管 Epirus 在 D 轮融资中筹得 2.5 亿美元，但在 2022 年 13.5
              亿美元峰值估值下调的报道之后，公司完成本轮时的估值条款仍未披露；其主要国防部合同也仍是原型交付，而非正式获得资金支持的量产项目。
            calloutType: risk
            claimRefs:
              - CO008
              - CO012
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、细分与结构性支出
        blocks:
          - type: paragraph
            body: >
              反无人机系统（C-UAS）的可服务市场涵盖用于探测、跟踪、识别和拦截无人空中威胁的设备、软件和服务。市场支出在结构上分为传感器探测层，包括雷达、光电/红外（EO/IR）、射频（RF）扫描器和声学系统；以及效应器拦截层，包括电子战干扰、欺骗、定向能（高功率微波和高能激光）及动能拦截弹。Epirus
              将核心产品明确限定在定向能效应器细分市场，即固态高功率微波（HPM）系统。一般基地实体安防、广域防空（例如针对弹道导弹的 Patriot 和 THAAD 导弹连）以及 AIM-9X
              等独立动能导弹拦截弹不属于这一直接边界，尽管 Leonidas 会在集成架构中与它们协同工作。现有替代方案包括传统射频干扰枪、电子信号战和地对空动能弹药。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM015
      - number: '2.2'
        title: 市场规模、增长轨迹与多维可服务性
        blocks:
          - type: paragraph
            body: >
              独立市场分析估计，全球反无人机系统市场规模为 $1.61 billion（2024 年），2025 年增至 $2.01 billion，预计 2035 年达到 $18.29
              billion，复合年增长率（CAGR）为 24.72%。北美是最大的区域市场，预计 2025 年规模为 $800.0 million；其次是欧洲 $450.0 million、亚太 $300.0
              million、中东和非洲 $60.23 million。在技术细分中，电子战和电子系统凭借在活跃冲突战区的广泛采用，占据当前支出的主导地位。不过，要衡量 Epirus
              的可服务市场，需要分层使用多个口径：2025 年总反无人机系统市场（$2.01B）是广义 TAM；军用和国防定向能 / 电子效应器细分市场构成 $1.0B 至 $1.2B 的
              SAM；高功率微波蜂群拦截层则是受证据约束的 SOM，目前仅限于早期原型和运营评估资金。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM009
