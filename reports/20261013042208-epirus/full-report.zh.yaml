      - number: '3.4'
        title: 护城河耐久性、既有厂商反应与不利竞争风险
        blocks:
          - type: paragraph
            body: >-
              尽管技术差异化明显，并得到 General Dynamics Land Systems 等战略投资人及 $250 million D 轮融资中的风险投资伙伴支持，Epirus
              的竞争护城河仍面临实质风险。根基深厚的主承包商拥有广泛的政治影响力、车辆底盘集成权和深厚的分销渠道，能够吸纳新兴技术，或参与定向能原型的竞标。由于陆军仅采购 6 套 IFPC-HPM 原型机、海军陆战队仅采购 2
              套系统用于测试，Epirus
              仍处于正式项目评估前阶段；预算重新分配或试验延迟都可能拖慢收入转化。此外，微波定向能武器还面临作战挑战：可能对附近友方通信阵列、雷达和舰艇电子系统造成电磁干扰。若软件定义的波束约束或频率陷波在作战压力下失效，军方操作员可能在混合部队环境中受到行动限制。
            claimRefs:
              - CP002
              - CP011
              - CP012
              - CP013
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 一对多作战中的立体效应器优势
            body: >-
              Epirus 的核心竞争优势，是把反空防御从单目标抛射物拦截转成覆盖立体空间的电磁饱和攻击。国防主承包商仍在扩展逐个交战的动能导弹和激光系统，而 Leonidas
              能以每次脉冲近乎为零的增量边际成本同时应对无人机蜂群，从根本上反转蜂群战争的成本曲线。
            calloutType: insight
            claimRefs:
              - CP003
              - CP006
              - CP008
          - type: callout
            title: 既有厂商的分销能力与项目转化风险
            body: >-
              尽管技术差异化明显，Epirus 仍面临 Raytheon 和 General Dynamics
              等既有主承包商的挤压。它们掌控车辆平台集成、主要国防部正式项目和既有国防预算科目。由于陆军和海军陆战队的原型部署总数不足 10 套，Epirus 容易受到主承包商支持的微波开发项目和漫长正式项目转化周期影响。
            calloutType: risk
            claimRefs:
              - CP002
