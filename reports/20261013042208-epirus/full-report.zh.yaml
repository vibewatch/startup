            body: >-
              Leonidas 利用电网或发电机电力发射非动能微波能量，从根本上改变了短程防空的经济性。在 Camp Atterbury 的实弹测试中，单次能量脉冲同时使完整的 49
              架无人机蜂群失效，解决了低价无人机饱和攻击下传统动能导弹电池面临的库存耗尽漏洞。
