              - CM008
              - CM014
      - number: '2.3'
        title: 买方细分、预算归属与采购路径
        blocks:
          - type: paragraph
            body: >
              C-UAS 领域的采购权主要掌握在国防机构手中，国土安全、关键基础设施保护机构和盟国国防部也参与其中。在美国，主要预算归属机构包括美国陆军快速能力与关键技术办公室（RCCTO）、导弹与太空项目执行办公室（PEO
              MS）、海军研究办公室（ONR）、海军陆战队作战实验室（MCWL）和联合反小型无人机办公室（JCO）。RCCTO 在 2023 年 1 月向 Epirus 授予 6610 万美元原型开发合同，并在 2025 年
              7 月追加 4355 万美元第二代合同；但商业采购路径仍依赖原型研发、测试与评估（RDT&E）资金，而不是多年期正式项目采购。General Dynamics Land Systems
              等战略工业伙伴作为移动平台的主集成商，而私人安保和商业资产保护买家仍只是有待转化的潜在目标。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM008
