  - id: FI001
    title: Leonidas 反蜂群经济价值转换桥
    type: flow
    summary: 将威胁需求转化为硬件毛利的运营和经济价值链。
    data:
      nodes:
        - id: threat-demand
          label: 威胁需求
          detail: 大规模无人机蜂群压垮传统动能拦截器
        - id: directed-effector
          label: 定向能效应器
          detail: 固态 GaN 阵列产生宽波束电磁脉冲
        - id: shot-economics
          label: 边际射击经济性
          detail: 交战成本仅为电费，而导弹成本达六位数
        - id: hardware-procurement
          label: 系统硬件销售
          detail: 每套设备的资本设备参考定价为 $10M-$20M
        - id: modular-sustainment
          label: 模块化维护
          detail: 可线更换放大器模块占制造成本的 65%
        - id: gross-margin-profile
          label: 毛利率结构
          detail: 高毛利固态电子元件抵消防务合同上限
      edges:
        - from: threat-demand
          to: directed-effector
        - from: directed-effector
          to: shot-economics
        - from: shot-economics
          to: hardware-procurement
        - from: hardware-procurement
          to: modular-sustainment
        - from: modular-sustainment
          to: gross-margin-profile
    approximationNotes: 经济流反映已报道的硬件物料清单占比和参考单价。
    claimRefs:
