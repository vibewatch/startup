      - number: '1.4'
        title: 运营里程碑、实地验证与合同进展
        blocks:
          - type: paragraph
            body: >-
              Epirus 的运营记录由硬件快速迭代、重大军方合同和高曝光度实地演示构成。2023 年 1 月，美国陆军快速能力与关键技术办公室（RCCTO）向 Epirus 授予 $66.1 million
              合同，为间接火力防护能力高功率微波（IFPC-HPM）项目交付 Leonidas 原型机；合同授予仅 9 个月后，公司就交付了首套系统。后续合同包括 2024 年 10 月陆军的 $17 million
              合同，以及 2025 年 7 月为 IFPC-HPM 第二代系统授予的 $43.5 million 合同，后者射程和杀伤力翻倍。2025 年 8 月在 Camp Atterbury 的实弹测试中，Leonidas
              对 61 架空中无人机实现 100% 击毁率，并用单次电磁脉冲使一个 49 架无人机蜂群失效。2026 年 1 月，Epirus 证明 Leonidas VehicleKit 能击退不受射频干扰影响的光纤制导
              FPV 无人机。美国陆军已采购 6 套原型机，海军陆战队采购 2 套，但所有部署系统仍处于原型评估阶段，正式项目预算线是否获批仍需持续核查。
            claimRefs:
              - CO005
              - CO006
              - CO011
              - CO012
