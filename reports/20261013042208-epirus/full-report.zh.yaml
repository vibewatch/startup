  - id: FE001
    title: Leonidas 分层高功率微波技术架构
    type: stack
    summary: Leonidas HPM 系统的功能架构层级，涵盖发电、GaN 固态放大、波束转向和任务控制。
    data:
      layers:
        - label: 任务规划与作战管理层
          detail: 任务套件建模软件计算地形、波束覆盖和多传感器击杀概率。
        - label: 传感器融合与目标获取层
          detail: 多传感器跟踪引擎将雷达、EO/IR、声学和被动 RF 数据流融合为统一航迹。
        - label: 指挥与控制（C2）网关层
          detail: 可互操作的 C2 集成接口，要求发射脉冲前必须获得人工授权。
        - label: 软件定义波形合成层
          detail: 数字信号处理器合成针对威胁定制的频率、脉冲时序和安全隔离区。
        - label: 有源电子扫描阵列（AESA）层
          detail: 氮化镓（GaN）固态半导体放大器执行可转向的高功率微波脉冲。
        - label: 战术主电源与调理层
          detail: 标准战术柴油发电机接口与脉冲储能缓冲器配套，为深弹匣提供电力。
    approximationNotes: 架构层级综合自公开技术披露和固态 AESA 微波平台的专利描述。
    claimRefs:
      - CE004
      - CE006
      - CE007
      - CE008
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从首次实弹演示到主承包商车辆集成及车队部署风险的机构客户采用阶段。
    data:
      nodes:
        - label: 阶段 1：实弹演示
          description: 客户在 Camp Atterbury 等受控靶场评估反蜂群脉冲效果。
          touchpoints:
            - Camp Atterbury multi-drone flight evaluation
            - DoD and allied delegation observation
        - label: 阶段 2：原型 OTA 授予
          description: 政府客户为原型单元签发其他交易授权合同。
          touchpoints:
            - U.S. Army $66.1M contract for IFPC-HPM prototypes
            - Delivery of 4 initial units in 9 months
        - label: 阶段 3：作战测试
          description: 作战人员在实际作战区域测试，以评估电子战耐久性和安全性。
          touchpoints:
            - Indo-Pacific and Middle East test deployments
            - U.S. Marine Corps 2-unit prototype evaluation
        - label: 阶段 4：主承包商伙伴集成
          description: 与防务主承包商合作，将 HPM 发射器集成到机动战术平台。
          touchpoints:
            - General Dynamics Land Systems integration
            - Kodiak AI autonomous driver truck pairing
        - label: 阶段 5：转入正式项目
          description: 关键转折点，要求从试验性 OTA 正式转入有资金支持的生产预算科目。
          touchpoints:
            - Inclusion in service procurement budget
            - Competitive down-select against kinetic and laser alternatives
        - label: 阶段 6：多年车队维护
          description: 通过软件波形更新和维护产生长期经常性收入。
          touchpoints:
            - Software-defined waveform updates
            - Subsystem depot repair and supply chain spares
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU007
      - CU010
      - CU011
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 主要运营向量的严重程度、可能性、缓解措施成熟度和剩余风险评级。
    approximationNotes: 依据 DoD 原型记录、招聘指标和风险投资融资披露进行尽调综合评估。
    data:
      columns:
        - label: 影响
          detail: 对任务能力或财务偿付能力的潜在严重程度
        - label: 可能性
          detail: 24 个月期间发生的概率
        - label: 缓解措施成熟度
          detail: 当前组织和技术反制措施状态
        - label: 剩余严重程度
          detail: 资本提供方仍承担的未缓解暴露
      rows:
        - label: DoD 正式项目转入延迟
          note: 客户集中风险
          values:
            - text: 严重
              tone: risk
              detail: 陆军预算重新分配会阻塞收入管线
            - text: 中
              tone: warning
              detail: 原型测试正在进行，但 PoR 里程碑尚未完成
            - text: 开发中
              tone: neutral
              detail: 印太和中东实地部署正在推进
            - text: 严重
              tone: risk
              detail: 高度依赖美国陆军 IFPC-HPM 收入
        - label: ITAR 与国际出口许可
          note: 监管壁垒
          values:
            - text: 高
              tone: risk
              detail: 国务院出口许可可能阻碍盟友销售
            - text: 高
              tone: risk
              detail: 对定向能弹药严格执行法定要求
            - text: 早期
              tone: warning
              detail: 2025 年启动双边盟友测试
            - text: 高
              tone: risk
              detail: 限制近期海外收入多元化
        - label: Series D 估值压缩与悬置
          note: 资本结构暴露
          values:
            - text: 高
              tone: risk
              detail: 低价轮定价带来清算优先权悬置
            - text: 中
              tone: warning
              detail: 据报道，本轮估值重置到 $1.35B Series C 标记以下
            - text: 成熟
              tone: positive
              detail: $250M 新资本提供多年运营跑道
            - text: 高
              tone: risk
              detail: 普通股稀释和治理重置
        - label: GaN 晶圆厂与硬件良率瓶颈
          note: 运营供应链风险
          values:
            - text: 高
              tone: risk
              detail: 放大器良率下降扰乱交付计划
            - text: 中
              tone: warning
              detail: 专用固态 RF 封装处于生产爬坡期
            - text: 开发中
              tone: neutral
              detail: 自动化测试台和 LRAM 模块化架构
            - text: 中
              tone: warning
              detail: 专用电子元件交付周期脆弱
        - label: 海军平台 EMI 与同址误伤
          note: 技术集成风险
          values:
            - text: 中
              tone: warning
              detail: 电磁脉冲可能干扰友方通信
            - text: 高
              tone: risk
              detail: 兆瓦级微波系统固有的挑战
            - text: 早期
              tone: warning
              detail: NSWC Dahlgren 正在开展测试
            - text: 中等
              tone: warning
              detail: 当前舰载部署范围受限
        - label: Counter-UAS Alternative Effector Competition
          note: 竞争替代风险
          values:
            - text: 中等
              tone: warning
              detail: 动能拦截器或激光系统正在争夺预算
            - text: 低
              tone: positive
              detail: Leonidas 具备独特的一对多蜂群摧毁能力
            - text: 成熟
              tone: positive
              detail: 实弹测试中已展示击落 49 架无人机蜂群
            - text: 低
              tone: positive
              detail: 面对密集蜂群，HPM 仍具差异化优势
    claimRefs:
      - CR001
      - CR003
      - CR006
      - CR010
      - CR011
