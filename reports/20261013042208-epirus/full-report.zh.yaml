          - type: callout
            title: 电磁兼容性与物理对抗措施漏洞
            body: 高功率微波辐射天然存在干扰友方电子设备的风险，对海军水面战斗舰和密集通信节点构成严峻集成挑战。此外，配备法拉第屏蔽、先进加固结构或专门规避轨迹的敌方无人机，可能削弱 HPM 杀伤力，因此需要紧密协同的分层防空。
            calloutType: risk
            claimRefs:
