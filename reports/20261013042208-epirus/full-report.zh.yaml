chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、起源与核心商业模式
        blocks:
          - type: paragraph
            body: >-
              Epirus 是一家美国国防科技公司，由硅谷创业者和美国军人老兵于 2018 年创立，旨在应对自主无人机系统快速扩散带来的关键国家安全漏洞。公司总部位于加州
              Torrance，并在华盛顿设有行政和政府联络办公室；公司自称新型主承包商，把商业风险投资企业的软件开发速度与军工级硬件工程结合起来。Epirus 的核心模式是开发、制造并部署定向能系统，具体是以
              Leonidas 品牌推出的固态高功率微波（HPM）反电子效应器。传统防空平台用数百万美元的动能拦截弹打击低价商用无人机，而 Epirus
              试图纠正这种成本失衡：标准发电机供电的电子弹匣几乎不受容量限制，可在短程防空任务中以接近即时的速度击退无人机蜂群，每次射击的边际成本近乎为零。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO010
              - CO014
