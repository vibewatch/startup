  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与国防需求
        blocks:
          - type: paragraph
            body: >-
              Epirus 的 Leonidas 高功率微波（HPM）技术需求集中在面对不对称无人机蜂群饱和攻击的机构型国防买家。现代防空体系高度依赖 Patriot 或 AIM-9X
              等昂贵的地对空导弹；拦截一次性攻击无人机时，这些导弹会造成难以承受的经济失衡。因此，Epirus
              围绕需要深厚电子弹匣和非动能近程区域防御的军事买家设计客户细分。第一大客户群是美国陆军短程防空项目，寻求保护固定和半固定基地，抵御小型无人机系统。第二大军事客户群是远征地面部队和海军力量，尤其是需要车载反蜂群能力的美国海军陆战队。除直接军事终端用户外，国防主承包商也是关键渠道客户，会把
              Leonidas 嵌入成熟的装甲车和自主车辆产品线。出口限制解除后，国际盟国国防部构成不断扩大的管线，但正式的对外军售（FMS）合同仍未公布。
            claimRefs:
              - CU001
              - CU003
              - CU006
              - CU013
