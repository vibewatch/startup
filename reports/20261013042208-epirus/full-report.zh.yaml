      - number: '3.3'
        title: 采购经济性、平台集成与转换成本
        blocks:
          - type: paragraph
            body: >-
              动能导弹拦截弹与高功率微波系统的经济性比较，代表了国防采购和短程防空姿态的根本转变。导弹系统的全生命周期成本很高，需要数百万美元的雷达制导发射车，以及每枚 $50,000 至 $100,000
              甚至更高的拦截弹；持续应对多波次蜂群攻击时，供应链也极易承压。相比之下，Epirus Leonidas
              从标准战术军用发电机取电，以几乎不受限的电子弹匣容量提供每次射击边际运营成本极低的能力。不过，定向能系统的前期采购是一项重大资本投入，Epirus 早期原型合同——包括美国陆军 RCCTO 的 $66.1
              million 和 $43 million 合同——反映了较高的初始开发与原型集成费用。此外，将系统装车集成到 General Dynamics Stryker
              等平台上会产生显著转换成本，需要专用高输出发电、热管理冷却方案，以及与军方指挥控制战场网络的无缝数字互操作。
            claimRefs:
              - CP003
              - CP009
              - CP010
              - CP011
              - CP014
