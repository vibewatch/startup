  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与国防合同来源
        blocks:
          - type: paragraph
            body: >-
              Epirus 是一家国防科技硬件开发商和系统集成商，确认收入主要来自联邦原型开发合同和成本加成型其他交易协议。2022 年 12 月，公司从美国陆军快速能力与关键技术办公室获得首笔 $66.1 million
              合同，用于制造 4 套第一代间接火力防护能力高功率微波原型机。2025 年 7 月，公司又获得 $43.6 million 合同，用于制造 2 套第二代系统，使陆军原型合同累计金额约为 $127
              million。2026 年 8 月，海军陆战队向 Epirus 授予 $11 million 合同，用于车载 HAVOC 系统。最近，2026 年 10 月，战争部选择 Leonidas 作为
              JIATF-401 设施防御试点中唯一的微波武器，在联合军方测试场中验证了其运营效用，但商业量产承诺仍未确认。
