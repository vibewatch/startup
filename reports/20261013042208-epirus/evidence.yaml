      against small UAS (weighing about 55 pounds or less) swarm attacks. In January 2023, the Army reportedly awarded a
      $66.1 million contract to Epirus to deliver four high-powered microwave prototypes to the Army in FY2024 for
      testing. The Army reports that the initial four prototypes have been delivered and that the Army purchased two
      additional prototypes, with delivery expected by the end of March 2026. After the delivery of those two additional
      prototypes, no further procurement is planned at this time.
