  - id: FE001
    title: Leonidas Layered High-Power Microwave Technology Architecture
    type: stack
    summary: >-
      Functional architectural hierarchy of the Leonidas HPM system spanning power generation, GaN solid-state
      amplification, beam steering, and mission control.
    data:
      layers:
        - label: Mission Planning & Battle Management Layer
          detail: Mission Suite modeling software calculating topography, beam coverage, and multi-sensor kill probabilities.
        - label: Sensor Fusion & Target Acquisition Layer
          detail: Multi-sensor tracking engine fusing radar, EO/IR, acoustic, and passive RF streams into unified tracks.
        - label: Command & Control (C2) Gateway Layer
          detail: Interoperable C2 integration interface enforcing mandatory human authorization before firing pulses.
        - label: Software-Defined Waveform Synthesis Layer
          detail: >-
            Digital signal processors synthesizing threat-tailored frequencies, pulse timings, and safety exclusion
            zones.
        - label: Active Electronically Scanned Array (AESA) Layer
          detail: Gallium nitride (GaN) solid-state semiconductor amplifiers executing steerable high-power microwave pulses.
        - label: Tactical Prime Power & Conditioning Layer
          detail: Standard tactical diesel generator interface paired with pulsed energy storage buffers for deep magazines.
    approximationNotes: >-
      Architectural layers generalized from public technical disclosures and patent descriptions of the solid-state AESA
      microwave platform.
