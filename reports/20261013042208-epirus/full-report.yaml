chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity, Origins, and Core Business Model
        blocks:
          - type: paragraph
            body: >-
              Epirus is an American defense technology company founded in 2018 by Silicon Valley entrepreneurs and U.S.
              military veterans, created to address critical national security vulnerabilities arising from the rapid
              proliferation of autonomous unmanned aerial systems. Headquartered in Torrance, California, with
              administrative and governmental liaison offices in Washington, the company operates as a self-described
              neo-prime contractor that fuses commercial venture-backed software development speed with defense-grade
              hardware engineering. The core of Epirus business model centers on developing, manufacturing, and fielding
              directed energy systems, specifically solid-state high-power microwave (HPM) counter-electronics effectors
              under the Leonidas product brand. Unlike traditional air defense platforms that deploy multimillion-dollar
              kinetic interceptors against low-cost commercial drones, Epirus offers an asymmetric cost correction: an
              unlimited electronic magazine powered by standard electrical generators, enabling near-instantaneous
              defeat of aerial swarms at negligible marginal cost per shot across short-range air defense missions.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO010
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO008
              - CO010
              - CO014
      - number: '1.2'
        title: Leadership Structure, Governance, and Key-Person Exposure
        blocks:
          - type: paragraph
            body: >-
              Epirus is led by Chief Executive Officer Andy Lowery, a defense industry veteran who succeeded Ken
              Bedingfield following initial Army contract prototyping in 2023. Lowery guides the company transition from
              research-and-development prototype delivery to scalable, multi-service defense manufacturing. The
              technical architecture is directed by Chief Technology Officer Michael Hiatt, who oversees the development
              of gallium nitride (GaN) active electronically scanned array antennas and pulse-forming networks that
              generate the system energy-dense microwave waveforms. Executive operations and talent acquisition are
              reinforced by Chief Operating Officer Mark Cuyler and Chief People Officer Mark Horton. At the governance
              level, co-founder Joe Lonsdale (Managing Partner at 8VC) and lead investor Mina Faltas (Founder and Chief
              Investment Officer at Washington Harbour Partners) play decisive roles in strategic capital allocation and
              Pentagon engagement. Key-person dependency remains concentrated in specialized microwave engineering
              leadership and defense acquisition liaisons navigating federal procurement channels.
            claimRefs:
              - CO004
              - CO009
              - CO011
              - CO013
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO009
              - CO011
              - CO013
      - number: '1.3'
        title: Capitalization History, Series D Financing, and Down-Round Dynamics
        blocks:
          - type: paragraph
            body: >-
              Since its inception in 2018, Epirus has raised more than $550 million in venture capital across multiple
              funding rounds. After achieving a $1.35 billion valuation during its $200 million Series C financing round
              in 2022, the company completed an oversubscribed $250 million Series D financing round in March 2025. The
              Series D round was co-led by venture capital firm 8VC and private investment firm Washington Harbour
              Partners LP, with participation from strategic corporate investor General Dynamics Land Systems alongside
              institutional asset managers including StepStone Group, funds advised by T. Rowe Price, Oppenheimers Vista
              VI Fund, and NightDragon. However, Epirus faced adverse capitalization pressure during the financing:
              reporting from Bloomberg and TechCrunch revealed that the round was negotiated as a down-round valuation
              reset relative to its 2022 Series C benchmark. While Epirus confirmed to media that its valuation remained
              above $1 billion, the company declined to disclose its precise post-money valuation, common share
              dilution, or liquidation preference stack, preserving significant valuation opacity.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO015
      - number: '1.4'
        title: Operational Milestones, Field Validation, and Contract Trajectory
        blocks:
          - type: paragraph
            body: >-
              Epirus operational track record is marked by accelerated hardware iteration, major military contract
              awards, and high-visibility field demonstrations. In January 2023, the U.S. Army Rapid Capabilities and
              Critical Technologies Office (RCCTO) awarded Epirus a $66.1 million contract to deliver prototypes of the
              Leonidas system for the Indirect Fire Protection Capability High-Power Microwave (IFPC-HPM) program,
              delivering the initial system just nine months after award. Subsequent awards include a $17 million Army
              contract in October 2024 and a $43.5 million award in July 2025 for IFPC-HPM Generation II systems with
              doubled range and lethality. In live-fire testing at Camp Atterbury in August 2025, Leonidas demonstrated
              a 100% defeat rate against 61 aerial drones, neutralizing a 49-drone swarm with a single electromagnetic
              pulse. In January 2026, Epirus proved the capability of its Leonidas VehicleKit to defeat fiber-optic
              guided FPV drones immune to RF jamming. While the U.S. Army has acquired six prototype units and the
              Marine Corps two, all fielded systems remain prototype evaluations, requiring continued diligence
              regarding formal program-of-record budget line authorization.
            claimRefs:
              - CO005
              - CO006
              - CO011
              - CO012
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO007
              - CO011
              - CO012
              - CO015
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Software-Defined Solid-State Architecture Advantages
            body: >-
              By replacing bulky vacuum tube microwave hardware with modular gallium nitride (GaN) active electronically
              scanned arrays, Epirus achieves a software-defined, unlimited-magazine counter-swarm capability that
              defeats simultaneous threats, including RF-immune fiber-optic drones, at marginal electrical operating
              cost.
            calloutType: strength
            claimRefs:
              - CO003
              - CO005
          - type: callout
            title: Valuation Reset and Prototype-to-Program Conversion Risk
            body: >-
              Despite raising $250 million in Series D capital, Epirus closed the round with undisclosed valuation terms
              following reports of a down-round from its 2022 peak valuation of $1.35 billion, while its primary
              Department of Defense contracts remain prototype deliveries rather than formally funded production
              programs of record.
            calloutType: risk
            claimRefs:
              - CO008
              - CO012
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Segmentation, and Structural Spend
        blocks:
          - type: paragraph
            body: >
              The addressable market for counter-unmanned aerial systems (C-UAS) spans equipment, software, and services
              designed to detect, track, identify, and interdict uncrewed airborne threats. Market spend is structurally
              partitioned across sensor detection layers including radar, electro-optical/infrared (EO/IR),
              radio-frequency (RF) scanners, and acoustic systems, and effector interdiction layers comprising
              electronic warfare jamming, spoofing, directed energy (high-power microwave and high-energy lasers), and
              kinetic interceptors. Epirus bounds its core offering specifically within the directed energy effector
              segment through solid-state high-power microwave (HPM) systems. Excluded from this immediate boundary are
              general base physical security, broad wide-area air defense (such as Patriot and THAAD missile batteries
              aimed at ballistic missiles), and standalone kinetic missile interceptors like AIM-9X, although Leonidas
              operates alongside them within integrated architectures. Status-quo substitutes include traditional RF
              jamming guns, electronic signal warfare, and surface-to-air kinetic munitions.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM015
      - number: '2.2'
        title: Market Sizing, Growth Trajectory, and Multi-Lens Addressability
        blocks:
          - type: paragraph
            body: >
              Independent market analysis estimates the global Counter UAS market at $1.61 billion in 2024, expanding to
              $2.01 billion in 2025 and projected to reach $18.29 billion by 2035, representing a compound annual growth
              rate (CAGR) of 24.72%. North America represents the largest regional market with an estimated $800.0
              million share in 2025, followed by Europe at $450.0 million, Asia-Pacific at $300.0 million, and Middle
              East and Africa at $60.23 million. Within technology segmentation, electronic warfare and electronic
              systems dominate current spend due to widespread adoption across active conflict theaters. However, sizing
              addressability for Epirus requires multi-lens stratification: the total counter-UAS market ($2.01B in
              2025) serves as the broad TAM, the military and defense directed energy / electronic effector segment
              forms the SAM ($1.0B to $1.2B), and the high-power microwave swarm interdiction layer represents an
              evidence-constrained SOM currently limited to early prototype and operational evaluation funding.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM004
              - CM013
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM008
              - CM014
      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Procurement Pathways
        blocks:
          - type: paragraph
            body: >
              Procurement authority in the C-UAS domain resides primarily within institutional defense organizations,
              supplemented by homeland security, critical infrastructure protection, and allied defense ministries. In
              the United States, primary budget ownership is split between the U.S. Army Rapid Capabilities and Critical
              Technologies Office (RCCTO), the Program Executive Office for Missiles and Space (PEO MS), the Office of
              Naval Research (ONR), the Marine Corps Warfighting Laboratory (MCWL), and the Joint C-sUAS Office (JCO).
              While RCCTO awarded Epirus a $66.1 million prototype development contract in January 2023 followed by a
              $43.55 million Generation II contract in July 2025, commercial procurement pathways remain tied to
              prototype research, development, test, and evaluation (RDT&E) funding rather than multi-year programmatic
              procurement of record. Strategic industrial partners such as General Dynamics Land Systems act as prime
              integrators on mobile platforms, while private security and commercial asset protection buyers remain
              aspirational conversion targets.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM008
              - CM010
              - CM011
              - CM015
      - number: '2.4'
        title: Growth Drivers, Integration Realities, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              Adoption velocity for high-power microwave systems is accelerated by the acute economic and operational
              asymmetry of modern uncrewed warfare. Autonomous drone swarms and fiber-optic tethered FPV drones render
              conventional radio-frequency jamming ineffective, while firing multi-million-dollar kinetic missiles at
              inexpensive drones rapidly exhausts defensive magazine depth. Solid-state HPM systems offer deep
              electronic magazines and negligible marginal cost per shot from standard generator power. However,
              critical adoption constraints temper valuation expansion. Official Congressional Research Service
              assessments reveal that following the delivery of six Army IFPC HPM prototypes through March 2026, no
              further procurement is planned by the Army, with congressional oversight actively questioning whether IFPC
              HPM variants will be divested rather than fielded to operational units. Furthermore, operational
              deployment demands seamless integration into command-and-control networks such as Operation Jailbreak
              Falcon Fury and rigorous RF deconfliction to prevent collateral damage to friendly electronics.
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural Procurement Cliff in U.S. Army IFPC HPM Program of Record
            body: >-
              While Epirus has successfully delivered four high-power microwave prototypes to the U.S. Army and is
              scheduled to deliver two additional Generation II prototypes by March 2026 under RCCTO contracts, the
              Congressional Research Service reports that the Army has no further procurement planned for the IFPC HPM
              variant. With the Army requesting $1.6 billion in FY2027 solely for kinetic IFPC Increment 2 interceptors
              and contemplating divesting HPM development beyond prototypes, Epirus faces an acute program-of-record
              transition barrier.
            calloutType: risk
            claimRefs:
              - CM007
              - CM013
              - CM014
          - type: callout
            title: Asymmetric Economics and Layered Architecture Drive Non-Kinetic Mandate
            body: >-
              Modern drone warfare has created an unsustainable cost-exchange ratio for traditional air defense, where
              firing $400,000+ kinetic missiles at $2,000 uncrewed aerial vehicles depletes defensive magazines. By
              demonstrating instant neutralization of a 49-drone swarm with a single microwave pulse and validating
              integration into open C2 architectures during Operation Jailbreak Falcon Fury, Epirus positions Leonidas
              not as a standalone weapon, but as an essential non-kinetic layer that preserves expensive interceptors
              for higher-tier threats.
            calloutType: insight
            claimRefs:
              - CM003
              - CM005
              - CM012
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Counter-UAS Competitive Landscape and Architecture Spectrum
        blocks:
          - type: paragraph
            body: >-
              The proliferation of hostile unmanned aerial systems has transformed military air defense from
              high-altitude missile interception to complex low-altitude counter-UAS operations across defense, critical
              infrastructure, and commercial installations. Modern counter-UAS solutions span three primary technical
              categories: kinetic projectile and missile interceptors, radio frequency detection and jamming systems,
              and directed energy weapons encompassing high-energy lasers and high-power microwaves. Traditional defense
              primes including Raytheon Technologies, Lockheed Martin, Northrop Grumman, and General Dynamics maintain
              formidable incumbency through established programs of record and deep customer relationships across the
              U.S. Department of Defense and international allied militaries. However, conventional air-defense
              architectures face severe structural vulnerabilities against drone swarms. Firing high-cost kinetic
              interceptors like Stinger or Coyote missiles against inexpensive consumer and military drones creates an
              unsustainable economic disadvantage, while electronic warfare radio jamming fails completely against
              autonomous and fiber-optic guided drones that emit no wireless radio signals.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP011
      - number: '3.2'
        title: Core Capability Differentiation and Non-Kinetic Swarm Defeat
        blocks:
          - type: paragraph
            body: >-
              Epirus differentiates its Leonidas platform by employing solid-state gallium nitride (GaN) semiconductor
              amplifiers combined with an active electronically scanned array (AESA) antenna, moving away from the
              fragile, bulky magnetron vacuum tubes that characterized legacy high-power microwave systems. This
              solid-state architecture generates software-defined, directional microwave waveforms that can be steered
              instantaneously to flood a wide volumetric sector of airspace. Unlike high-energy laser systems that
              require continuous dwell time to thermally burn through individual drone airframes one by one, Leonidas
              produces high-voltage electronic surges that overload internal flight controllers, motor drivers, and
              power circuitry across all aerial threats within its beam path simultaneously. Live-fire demonstrations at
              Camp Atterbury in August 2025 validated this multi-target defeat capability by neutralizing 61 of 61
              drones across five operational scenarios, including an instant pulse defeat of an incoming 49-drone swarm.
              The software-defined backend further enables precision frequency notching to designate operator-controlled
              safe corridors for friendly communication systems.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP008
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP012
              - CP013
      - number: '3.3'
        title: Procurement Economics, Platform Integration, and Switching Costs
        blocks:
          - type: paragraph
            body: >-
              The economic comparison between kinetic missile interceptors and high-power microwave systems represents a
              fundamental shift in defense procurement and short-range air defense posture. Missile-based systems impose
              substantial lifecycle costs, requiring multi-million-dollar radar-guided launchers and $50,000 to $100,000
              or more per interceptor missile, creating severe supply chain vulnerabilities during sustained multi-wave
              swarm attacks. In contrast, Epirus Leonidas draws electrical power from standard tactical military
              generators, delivering a virtually unlimited electronic magazine at negligible marginal operating cost per
              shot. However, upfront procurement of directed energy systems represents a major capital investment, with
              early prototype contracts such as Epirus $66.1 million and $43 million U.S. Army RCCTO awards reflecting
              high initial development and prototype integration expenses. Furthermore, vehicle-mounted integration onto
              platforms like General Dynamics Stryker vehicles introduces significant switching costs, requiring
              dedicated high-output power generation, thermal management cooling solutions, and seamless digital
              interoperability with military command and control battle networks.
            claimRefs:
              - CP003
              - CP009
              - CP010
              - CP011
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP005
              - CP007
              - CP010
              - CP014
      - number: '3.4'
        title: Moat Durability, Incumbent Response, and Adverse Competitive Risks
        blocks:
          - type: paragraph
            body: >-
              Despite strong technical differentiation and backing from strategic investors such as General Dynamics
              Land Systems and venture partners in its $250 million Series D financing round, Epirus faces meaningful
              risks to its competitive moat. Entrenched prime contractors retain extensive political influence, vehicle
              chassis integration authority, and deep distribution channels that allow them to co-opt emerging
              technologies or bid competitive directed energy prototypes. With only six Army IFPC-HPM prototype units
              and two Marine Corps systems procured for testing, Epirus remains in the pre-program-of-record evaluation
              phase, where budget reallocation or trial delays could prolong revenue conversion. Additionally, microwave
              directed energy weapons introduce operational challenges regarding collateral electromagnetic interference
              with nearby friendly communication arrays, radars, and naval electronic systems. If software-defined beam
              containment or frequency notching fails under combat stress, military operators may face operational
              constraints in mixed-force environments.
            claimRefs:
              - CP002
              - CP011
              - CP012
              - CP013
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Volumetric Effector Advantage in the One-to-Many Fight
            body: >-
              Epirus primary competitive advantage lies in transforming counter-air defense from single-target
              projectile intercept to volumetric electromagnetic saturation. While defense primes continue to scale
              kinetic missile and laser systems that engage threats sequentially, Leonidas addresses drone swarms
              simultaneously at near-zero incremental marginal cost per pulse, fundamentally inverting the cost curve of
              swarm warfare.
            calloutType: insight
            claimRefs:
              - CP003
              - CP006
              - CP008
          - type: callout
            title: Incumbent Distribution Power and Program Transition Risk
            body: >-
              Despite strong technological differentiation, Epirus faces entrenched incumbent primes like Raytheon and
              General Dynamics who control vehicle platform integration, major DoD programs of record, and established
              defense budget line items. With prototype deployments numbering under ten systems across the Army and
              Marines, Epirus remains vulnerable to prime-backed microwave developments and long program-of-record
              transition cycles.
            calloutType: risk
            claimRefs:
              - CP002
              - CP009
              - CP012
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Defense Contract Streams
        blocks:
          - type: paragraph
            body: >-
              Epirus operates as a defense technology hardware developer and systems integrator whose recognized revenue
              is anchored in federal prototype development awards and cost-plus other transaction agreements. The
              company secured an initial $66.1 million award from the U.S. Army Rapid Capabilities and Critical
              Technologies Office in December 2022 to build four first-generation Indirect Fire Protection Capability
              High-Power Microwave prototypes. This was supplemented in July 2025 by a $43.6 million contract for two
              second-generation systems, bringing cumulative Army prototype awards to roughly $127 million. In August
              2026, the Marine Corps awarded Epirus an $11 million contract for the vehicle-mounted HAVOC system. Most
              recently in October 2026, the Department of War selected Leonidas as the sole microwave weapon in the
              JIATF-401 installation defense pilot, validating operational utility across joint military test beds while
              leaving commercial production commitments unconfirmed.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI014
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI014
      - number: '4.2'
        title: System Pricing, Unit Economics, and Cost Structure
        blocks:
          - type: paragraph
            body: >-
              Pricing for the Leonidas system is structured around high-value capital equipment acquisitions coupled
              with modular hardware sustainment. Executive commentary places the indicative commercial unit price of a
              full-scale emplaced Leonidas system between $10 million and $20 million, which aligns with realized
              prototype package averages when spares and engineering support are factored in. The hardware cost
              structure is heavily concentrated in high-frequency solid-state power electronics, where banks of roughly
              150 Line Replaceable Amplifier Modules account for approximately 65 percent of manufacturing expense.
              While Epirus positions the marginal cost per engagement as negligible due to continuous electrical
              generation from a standard 70 kW generator, military evaluators emphasize that defense underwriting must
              amortize multi-million-dollar capital acquisition and maintenance burdens across realistic engagement
              volumes rather than focusing solely on fuel consumption.
            claimRefs:
              - CI004
              - CI005
              - CI010
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI010
              - CI011
      - number: '4.3'
        title: Capital Adequacy, Financing Structure, and Runway
        blocks:
          - type: paragraph
            body: >-
              To capitalize manufacturing scale and advance beyond small prototype batches, Epirus completed an
              oversubscribed $250 million Series D financing round in March 2025. Co-led by 8VC and Washington Harbour
              Partners with strategic backing from General Dynamics Land Systems, the round expanded total venture
              capital raised to more than $550 million. While the company confirmed a post-money valuation exceeding $1
              billion, reporting indicated the financing represented a valuation reset below its 2022 Series C benchmark
              of $1.35 billion. Management directed proceeds toward expanding its 200-person organization, establishing
              an immersive simulation center at Fort Sill, and scaling Torrance production capacity toward one system
              per week. However, the private nature of the balance sheet leaves actual monthly cash burn, gross margin
              realization, and liquidity runway unverified for outside underwriters.
            claimRefs:
              - CI006
              - CI007
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI004
              - CI005
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Financial Verdict and Underwriting Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              The core financial verdict on Epirus reflects a stark tension between operational technical
              differentiation and defense program-of-record conversion. In April 2026, the Congressional Research
              Service disclosed that the U.S. Army plans no further procurement of Leonidas trailer systems beyond the
              delivered prototypes, shifting its fiscal 2027 high-power microwave budget toward competitively sourced
              mobile platforms. With commercial annual recurring revenue, gross margins, and backlog schedules
              undisclosed, underwriting Epirus requires treating current revenues as non-recurring developmental funding
              rather than enterprise software cash flow. Bridging the diligence gap requires verifying international
              pipeline conversion in allied jurisdictions and auditing the Series D preference stack against forward
              capital expenditure requirements.
            claimRefs:
              - CI008
              - CI009
              - CI013
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Army IFPC-HPM Procurement Divestment
            body: >-
              While Epirus successfully secured $127 million across early prototype development, the Army transition to
              competitive mobile microwave prototyping and lack of FY2027 procurement allocation represents a
              significant near-term revenue hurdle.
            calloutType: risk
            claimRefs:
              - CI008
              - CI009
          - type: callout
            title: Asymmetric Unit Economics of High-Power Microwaves
            body: >-
              Leonidas inverts the unfavorable cost exchange of kinetic missile defense by defeating entire drone swarms
              with electrical energy, but the $10M-$20M upfront system acquisition cost requires high threat volumes to
              achieve amortized cost efficiency.
            calloutType: insight
            claimRefs:
              - CI004
              - CI010
              - CI011
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Operational Workflow
        blocks:
          - type: paragraph
            body: >-
              Epirus centers its defense product capability on Leonidas, an energy-based high-power microwave (HPM)
              platform engineered to defeat robotic, asymmetric drone swarms across short-range air defense
              environments. Rather than relying on traditional one-to-one kinetic missile or projectile interceptors
              that rapidly exhaust finite magazines, Leonidas operates with a one-to-many architecture that neutralizes
              multiple aerial threats simultaneously using weaponized electromagnetic interference. The operational
              system is packaged within the modular Epirus Point Defense framework, which connects a four-stage mission
              workflow: Plan (Mission Suite terrain and kill probability modeling), Sense (AI-enabled multi-sensor track
              fusion across radar, EO/IR, acoustic, and RF signals), Decide (interoperable command-and-control
              integration requiring human authorization), and Effect (HPM pulses with software-governed safety
              corridors). This operational structure allows tactical operators to defend fixed military installations,
              forward operating bases, critical industrial infrastructure, and mobile tactical formations against
              coordinated saturation attacks.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE008
              - CE009
              - CE010
              - CE014
      - number: '5.2'
        title: Hardware-Software Architecture and Technical Differentiation
        blocks:
          - type: paragraph
            body: >-
              The core technical differentiation of Leonidas stems from its solid-state gallium nitride (GaN)
              semiconductor building-block design, departing fundamentally from legacy high-power microwave platforms
              that depended on fragile, bulky vacuum-tube amplifiers. By structuring the system as an Active
              Electronically Scanned Array (AESA), Epirus achieves energy-dense microwave beam steering,
              software-defined waveform shaping, and modular scalability without mechanical gimbals. Software-controlled
              waveforms enable dynamic target defeat while preserving operator-designated low-collateral safety zones,
              preventing friendly electronics in adjacent corridors from taking collateral damage. Furthermore, the
              solid-state architecture couples with standard tactical electrical generators, creating a virtually
              unlimited electronic magazine with negligible incremental cost per engagement compared to
              multimillion-dollar kinetic interceptor salvos. Despite these differentiators, directed-energy microwave
              physics mandates clear line-of-sight propagation, faces attenuation or degradation against
              electromagnetically hardened or shielded airframes, and requires substantial prime electrical power.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE004
              - CE006
              - CE007
              - CE008
      - number: '5.3'
        title: Product Line, Modular Variants, and Deployment Maturity
        blocks:
          - type: paragraph
            body: >-
              Epirus' product roadmap spans several form factors derived from its modular AESA building blocks. The core
              ground-based Leonidas system has demonstrated field validity in Department of Defense testing, culminating
              in an August 2025 live-fire demonstration at Camp Atterbury where a single microwave pulse neutralized a
              49-drone swarm, disabling 61 of 61 total targets flown across five scenarios. Operational adoption has
              progressed through prototype procurement, including six Integrated Fires Protection Capability High-Power
              Microwave (IFPC-HPM) units acquired by the U.S. Army and two prototype units acquired by the U.S. Marine
              Corps. For mobile maneuvers, Epirus partnered with General Dynamics Land Systems (GDLS) and autonomous
              vehicle developer Kodiak AI to unveil the Leonidas AGV, integrating the Kodiak Driver autonomy system on
              commercial vehicle chassis to deliver unmanned perimeter defense. While ground variants mature, planned
              maritime shipboard installations face severe electromagnetic compatibility (EMC) hurdles with sensitive
              vessel electronics, and international deployments remain gated by export controls and field trial
              schedules.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE001
            claimRefs:
              - CE004
              - CE006
              - CE013
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Asymmetric Cost and Swarm Defeat Capability
            body: >-
              Leonidas fundamentally alters short-range air defense economics by utilizing grid or generator electrical
              power to project non-kinetic microwave energy. In live testing at Camp Atterbury, a single energy pulse
              disabled an entire 49-drone swarm simultaneously, solving the inventory depletion vulnerability that
              threatens conventional kinetic missile batteries facing low-cost drone saturation.
            calloutType: strength
            claimRefs:
              - CE002
              - CE008
              - CE012
          - type: callout
            title: Electromagnetic Compatibility and Physical Countermeasure Vulnerabilities
            body: >-
              High-power microwave radiation inherently risks friendly electronics interference, presenting acute
              integration challenges for naval surface combatants and dense communication nodes. Additionally, adversary
              drones incorporating Faraday shielding, advanced hardening, or specialized trajectory evasion could
              diminish HPM lethality, necessitating tightly coupled layered air defense.
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Defense Demand
        blocks:
          - type: paragraph
            body: >-
              Customer demand for Epirus' Leonidas high-power microwave (HPM) technology is concentrated across
              institutional defense buyers facing asymmetric drone swarm saturation. Modern air defense doctrine relies
              heavily on expensive surface-to-air missiles such as the Patriot or AIM-9X, which create prohibitive
              economic imbalances when intercepting expendable one-way attack drones. Consequently, Epirus has
              structured its customer segmentation around military buyers requiring deep electronic magazines and
              non-kinetic close-in area defense. The primary customer segment comprises U.S. Army short-range air
              defense programs seeking fixed-site and semi-fixed base protection against small uncrewed aerial systems.
              A secondary military segment encompasses expeditionary ground and naval forces, spearheaded by the U.S.
              Marine Corps, which requires vehicle-integrated counter-swarm capabilities. Beyond direct military
              end-users, defense prime contractors represent a crucial channel segment, embedding Leonidas into
              established armored and autonomous vehicle lines. Finally, international allied defense ministries
              represent an expanding pipeline following the lifting of export restrictions, although formal Foreign
              Military Sales (FMS) contract awards remain unannounced.
            claimRefs:
              - CU001
              - CU003
              - CU006
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU006
              - CU007
      - number: '6.2'
        title: Adoption Trajectory and Testing Milestones
        blocks:
          - type: paragraph
            body: >-
              Epirus' customer adoption trajectory has progressed through rapid prototyping and high-visibility
              live-fire field demonstrations rather than high-rate production contracts. Following an initial $66.1
              million contract from the U.S. Army Rapid Capabilities and Critical Technologies Office, Epirus delivered
              prototype IFPC-HPM systems within nine months. By early 2026, the company had delivered four initial
              prototypes, with two additional units slated for delivery by March 2026, bringing the Army's total
              evaluation inventory to six systems. Adoption expanded across services in August 2026 when the U.S. Marine
              Corps awarded Epirus a contract for two vehicle-mounted microwave counter-swarm weapons. Field testing has
              validated operational utility in theater environments across the Indo-Pacific and Middle East. Crucially,
              at a September 2025 live-fire demonstration at Camp Atterbury attended by representatives from the
              Department of Defense and nine allied nations, Leonidas successfully defeated 61 of 61 drones across five
              operational flight scenarios, neutralizing an entire 49-drone swarm in a single instant electromagnetic
              pulse.
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU008
      - number: '6.3'
        title: Named Deployments and Strategic Prime Alliances
        blocks:
          - type: paragraph
            body: >-
              Confirmed customer proof for Epirus centers on premier Department of Defense research branches and Tier-1
              defense prime integrators. The U.S. Army's IFPC Increment 2 program served as Epirus' anchor institutional
              proof point, validating solid-state gallium nitride phased-array architecture in formal military test
              ranges. To overcome procurement friction and accelerate vehicle fielding, Epirus forged a key channel
              partnership with General Dynamics Land Systems (GDLS). In March 2026, Epirus, GDLS, and Kodiak AI unveiled
              the Leonidas Autonomous Ground Vehicle (AGV) at the AUSA Global Force Symposium. By mounting Leonidas onto
              a commercial-grade truck chassis equipped with Kodiak's autonomous driving system, GDLS acts as lead
              system integrator to provide mobile counter-UAS protection for military bases, airfields, and critical
              infrastructure. This prime contractor alliance broadens Epirus' go-to-market reach without requiring the
              company to build proprietary vehicle platforms, though it introduces channel margin sharing and
              integration dependencies.
            claimRefs:
              - CU007
              - CU009
              - CU010
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU007
              - CU009
              - CU011
              - CU012
      - number: '6.4'
        title: Customer Concentration and Program Transition Risks
        blocks:
          - type: paragraph
            body: >-
              Despite technical milestones, Epirus faces severe customer durability and revenue concentration
              vulnerabilities. All military acquisitions to date remain developmental prototypes funded through Other
              Transaction Authority (OTA) mechanisms rather than multi-year procurement programs of record. In April
              2026, the Congressional Research Service reported that following delivery of two additional prototypes by
              March 2026, the U.S. Army planned no further procurement of IFPC-HPM systems and indicated both
              high-energy laser and microwave variants would not transition to operational fielding, instead being
              divested as prototype candidates. This procurement cutoff creates a potential 'valley of death' for
              Epirus' primary revenue source. Because commercial infrastructure buyers have not yet generated
              significant recurring demand and Marine Corps volumes remain limited to prototype evaluations, Epirus is
              heavily dependent on converting international interest or winning second-generation counter-swarm
              requirements to sustain its manufacturing capacity and revenue trajectory.
            claimRefs:
              - CU011
              - CU012
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU007
              - CU010
              - CU011
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Demonstrated Multi-Service and Prime Partner Validation
            body: >-
              Epirus has expanded its operational footprint from initial U.S. Army prototype contracts ($66.1 million
              for six IFPC-HPM systems) to include vehicle-mounted awards from the U.S. Marine Corps and a joint
              development alliance with General Dynamics Land Systems. This multi-stakeholder engagement validates that
              high-power microwave effectors address urgent operational demands across both stationary installation
              defense and mobile convoy escort mission sets.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
          - type: callout
            title: Army IFPC Divestment and Transition Valley of Death
            body: >-
              Despite successful live-fire demonstrations defeating 49-drone swarms, Congressional Research Service
              reporting indicates the U.S. Army plans no further procurement of IFPC-HPM systems beyond the initial six
              prototypes delivered through March 2026, signaling potential divestment rather than program-of-record
              fielding. With defense customers accounting for virtually all verified demand, Epirus faces severe
              customer concentration and the risk of stalling in the developmental OTA transition phase.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Export Controls, and Procurement Governance
        blocks:
          - type: paragraph
            body: >-
              Epirus operates within a heavily regulated defense technology environment subject to strict statutory
              oversight under the Arms Export Control Act and International Traffic in Arms Regulations. Because
              Leonidas delivers weaponized high-power microwave energy capable of disabling airborne threats, its
              underlying software waveforms, antenna arrays, and radio-frequency subsystems are classified as defense
              articles requiring explicit State Department approvals. To comply with U.S. government export regulations,
              Epirus enforces strict personnel security controls requiring engineering and testing staff to hold U.S.
              citizenship or permanent residency. Until 2025, stringent statutory export restrictions prevented
              international deployments, and while allied interest from NATO partners and Ukraine has expanded,
              bilateral technology-transfer clearances remain a persistent gating factor for global commercialization.
            claimRefs:
              - CR001
              - CR002
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
      - number: '7.2'
        title: Operational, Manufacturing Yield, and Supply Chain Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Manufacturing solid-state high-power microwave arrays introduces complex hardware yield, thermal
              management, and radio-frequency calibration risks. Unlike legacy microwave systems that rely on bulky
              vacuum tubes, Leonidas uses advanced gallium-nitride semiconductors and an active electronically scanned
              array architecture. Epirus' test engineering organization actively triages production hardware yield
              issues and validates automated test benches across high-volume RF and power electronics modules. The
              company mitigates single-point-of-failure vulnerabilities through Line Replaceable Amplifier Modules that
              enable graceful operational degradation. However, naval shipboard integration trials have encountered
              severe electromagnetic environmental effects challenges, where high-power directed energy pulses risk
              interfering with sensitive onboard communications, radar, and avionics.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR013
      - number: '7.3'
        title: Department of Defense Program Dependence and Partner Counterparty Risk
        blocks:
          - type: paragraph
            body: >-
              Epirus exhibits acute revenue and program concentration within the U.S. Department of Defense, creating
              vulnerability to federal budget prioritization shifts. The company's primary defense footprint consists of
              a $66.1 million contract from the U.S. Army for the Indirect Fire Protection Capability High-Power
              Microwave initiative and a $5.5 million contract with the U.S. Marine Corps for the Expeditionary Directed
              Energy Counter-Swarm program. Crucially, all six Army systems and two Marine Corps systems remain
              prototype evaluation units rather than funded multi-year Programs of Record. To support vehicular
              integration, Epirus maintains an equity and technical partnership with General Dynamics Land Systems, yet
              failure to secure formal transition to a Program of Record represents a structural adoption barrier.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.4'
        title: Financial Burn, Valuation Reset, and Down-Round Exposure
        blocks:
          - type: paragraph
            body: >-
              Developing directed-energy hardware requires substantial capital intensity, continuous research and
              development investment, and specialized manufacturing infrastructure. In March 2025, Epirus closed an
              oversubscribed $250 million Series D financing round co-led by 8VC and Washington Harbour Partners,
              expanding its cumulative funding past $550 million. While the company confirmed a valuation above $1
              billion, reporting from Bloomberg revealed that the round was raised at a valuation lower than its $1.35
              billion Series C mark from 2022. This valuation compression indicates a down-round reset, introducing
              potential liquidation preference overhang and substantial common equity dilution that increases financial
              fragility if procurement revenue scaling takes longer than projected.
            claimRefs:
              - CR010
              - CR011
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR010
              - CR011
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Prototype Transition Valley of Death
            body: >-
              While Epirus has successfully deployed six Leonidas IFPC-HPM units with the U.S. Army and two ExDECS units
              with the Marine Corps, all fielded assets remain non-program-of-record prototypes. Defense procurement
              cycles frequently stall between prototype demonstration and full-rate multi-year procurement, creating a
              multi-year cash burn vulnerability if production line awards are delayed.
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR008
          - type: callout
            title: Valuation Reset and Liquidity Structure
            body: >-
              Epirus' $250M Series D round replenished balance sheet cash reserves to navigate defense procurement
              cycles, but external reports of down-round pricing below its prior $1.35B Series C mark indicate valuation
              compression. Late-stage private capital structures in down rounds often introduce senior liquidation
              preferences that increase downside risk for common equity and earlier investors.
            calloutType: risk
            claimRefs:
              - CR010
              - CR011
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context, Series D anchor, and capital structure
        blocks:
          - type: paragraph
            body: >
              The primary verifiable anchor for Epirus's valuation and capital position is its oversubscribed $250
              million Series D fundraising round closed in March 2025, which expanded cumulative venture financing to
              more than $550 million. The round was co-led by venture firm 8VC and Washington Harbour Partners, joined
              by strategic defense partner General Dynamics Land Systems alongside return investors including StepStone
              Group, Gaingels, and funds advised by T. Rowe Price Investment Management. New institutional participants
              included Oppenheimer's Private Market Opportunities Vista VI Fund, Manhattan Venture Partners,
              NightDragon, Centaurus Capital, and Center15 Capital. Capital was earmarked to accelerate manufacturing of
              the Leonidas high-power microwave product line, build out a warfighter simulation facility in Oklahoma
              near Fort Sill, and enhance supply chain resiliency. However, explicit post-money valuation marks,
              liquidation preference stacks, and revenue multiples remain undisclosed in primary sources, requiring
              investors to underwrite on operational traction rather than headline multiple expansion.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV009
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV009
              - CV013
      - number: '8.2'
        title: Procurement progression, prototype stage gating, and scaling risks
        blocks:
          - type: paragraph
            body: >
              Commercialization progress centers on military procurement contracts, most notably the $66.1 million U.S.
              Army Rapid Capabilities and Critical Technologies Office contract awarded for Integrated Fires Protection
              Capability High-Power Microwave prototype systems. Under this effort, Epirus completed delivery of its
              initial four IFPC-HPM systems in May 2024, followed by additional orders expanding Army prototype
              acquisition to six systems alongside two systems acquired by the U.S. Marine Corps. Live-fire
              demonstrations, including an August 2025 event at Camp Atterbury neutralizing a 49-drone swarm with a
              single pulse, validate the operational efficacy of solid-state gallium-nitride architectures against
              saturation tactics and fiber-optic-guided drones. Nevertheless, all delivered units currently remain in
              prototype stages, and field trials across the Indo-Pacific and Middle East have yet to convert into a
              formalized multi-year program of record, limiting visibility into recurring production revenue and
              long-term sustainment margins.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV013
      - number: '8.3'
        title: Frontier hardware comps, thesis vs. anti-thesis, and recommendation
        blocks:
          - type: paragraph
            body: >
              Cross-asset valuation benchmarking requires evaluating dual-use defense and frontier technology peers
              navigating capital-intensive hardware scaling. While public frontier hardware peers such as Joby Aviation
              maintain strong balance sheets with $2.5 billion in cash, cash equivalents, and short-term investments as
              of Q1 2026, private defense-tech peers trade across wide valuation dispersions based on whether programs
              of record are secured. Epirus's investment thesis rests on its unique asymmetric advantage as the only
              operational solid-state HPM provider capable of unlimited-magazine, one-to-many counter-swarm defense.
              Conversely, the anti-thesis highlights prototype deployment concentration, potential prime contractor
              competition, and lack of disclosed unit economics. Balancing these factors across bull, base, and bear
              scenarios, our recommendation is track with high confidence, accompanied by a high risk rating and fair
              valuation stance until program-of-record conversion and financial transparency improve.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV009
              - CV010
              - CV012
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Investment Recommendation Stance
            body: >
              We assign Epirus a track recommendation with a fair valuation stance. While the company has proven the
              physics of its solid-state high-power microwave effector and demonstrated robust investor backing via its
              $250 million Series D round, its defense contracts remain in prototype stages. Investors should require
              verified program-of-record progression and audited financial disclosure before committing growth capital
              at premium valuations.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV009
              - CV013
          - type: callout
            title: Prototype Conversion and Competitive Overhang
            body: >
              Epirus faces material operational and competitive risks. All eight U.S. military Leonidas systems (six
              Army, two Marine Corps) are prototype units rather than serial production awards. Furthermore, traditional
              defense primes possess deep lobbying presence and existing sensor/effector programs that may compress
              standalone venture-backed margins if counter-drone architectures favor integrated incumbent platforms.
            calloutType: risk
            claimRefs:
              - CV007
              - CV009
              - CV010
              - CV014
