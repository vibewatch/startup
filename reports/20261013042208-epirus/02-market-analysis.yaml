callouts:
  - calloutType: "risk"
    title: "Structural Procurement Cliff in U.S. Army IFPC HPM Program of Record"
    body: "While Epirus has successfully delivered four high-power microwave prototypes to the U.S. Army and is scheduled to deliver two additional Generation II prototypes by March 2026 under RCCTO contracts, the Congressional Research Service reports that the Army has no further procurement planned for the IFPC HPM variant. With the Army requesting $1.6 billion in FY2027 solely for kinetic IFPC Increment 2 interceptors and contemplating divesting HPM development beyond prototypes, Epirus faces an acute program-of-record transition barrier."
    claimRefs:
      - "CM007"
      - "CM013"
      - "CM014"

  - calloutType: "insight"
    title: "Asymmetric Economics and Layered Architecture Drive Non-Kinetic Mandate"
    body: "Modern drone warfare has created an unsustainable cost-exchange ratio for traditional air defense, where firing $400,000+ kinetic missiles at $2,000 uncrewed aerial vehicles depletes defensive magazines. By demonstrating instant neutralization of a 49-drone swarm with a single microwave pulse and validating integration into open C2 architectures during Operation Jailbreak Falcon Fury, Epirus positions Leonidas not as a standalone weapon, but as an essential non-kinetic layer that preserves expensive interceptors for higher-tier threats."
    claimRefs:
      - "CM003"
      - "CM005"
      - "CM012"
      - "CM015"

