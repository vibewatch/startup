callouts:
  - calloutType: insight
    title: Volumetric Effector Advantage in the One-to-Many Fight
    body: Epirus primary competitive advantage lies in transforming counter-air defense from single-target projectile intercept to volumetric electromagnetic saturation. While defense primes continue to scale kinetic missile and laser systems that engage threats sequentially, Leonidas addresses drone swarms simultaneously at near-zero incremental marginal cost per pulse, fundamentally inverting the cost curve of swarm warfare.
    claimRefs:
      - CP003
      - CP006
      - CP008
  - calloutType: risk
    title: Incumbent Distribution Power and Program Transition Risk
    body: Despite strong technological differentiation, Epirus faces entrenched incumbent primes like Raytheon and General Dynamics who control vehicle platform integration, major DoD programs of record, and established defense budget line items. With prototype deployments numbering under ten systems across the Army and Marines, Epirus remains vulnerable to prime-backed microwave developments and long program-of-record transition cycles.
    claimRefs:
      - CP002
      - CP009
      - CP012
      - CP013
