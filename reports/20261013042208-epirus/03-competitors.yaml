  - id: TP003
    title: Pricing / Packaging Comparison
    columns:
      - System Architecture
      - Typical Price / Unit Model
      - Included Capabilities
      - Cost Driver / Unknowns
      - Strategic Implication
    rows:
      - - Missile Kinetic Systems
        - $1M–$3M launcher plus $50k–$100k+ per interceptor
        - Radar guidance and kinetic fragmentation warhead
        - High reload logistics and rapid magazine depletion
        - Economically unsustainable against cheap mass drone waves
      - - Tactical RF Jamming Guns
        - $30k–$100k per man-portable or vehicle unit
        - Directional antenna and RF spoofing/jamming bands
        - Frequency band coverage and zero autonomous defeat
        - Effective only against commercial off-the-shelf radio links
      - - High-Energy Laser Systems
        - $5M–$15M+ per mobile weapon platform
        - High-precision optical tracker and 10–50kW fiber laser
        - Complex thermal cooling and weather beam degradation
        - Limited to sequential engagements of isolated threats
      - - Epirus Leonidas (HPM)
        - Prototype contract pricing ($10M–$20M estimated per unit)
        - Solid-state GaN array, power supply, and C2 software
        - Production-scale unit cost and sustainment lifecycle opaque
        - High upfront capital expenditure offset by near-zero marginal shot cost
    notes: Unit economics and contract structures derived from Army RCCTO contract benchmarks, market research estimates, and prime procurement disclosures.
