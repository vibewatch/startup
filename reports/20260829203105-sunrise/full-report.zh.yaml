            body: >-
              公开证据能较早支持 Sunrise 的战略重要性，但尚不足以支持它已经具备退出准备度。国内同业 IPO 活动证明，中国 AI
              芯片公司存在资本市场路径，政策环境也可能加速这条路径。但这些同业接近公开资本时，也会披露更多经营数据。Sunrise 还没有。因此，仅凭公开材料，很难支撑近期 IPO
              式投资判断。今天更容易成立的是：等更多商业化证据出现后，再参与一轮后续私募、带结构性下行保护的投资，或战略交易。


              终止标准直接来自披露缺口。若 S3 明显延误，若客户证据继续集中在伙伴中介案例，或下一轮融资低于当前估值标记、且附带重保护条款，当前投资逻辑就应下修。反过来，若 Sunrise
              披露复购证据、毛利率结构、客户集中度和中立基准数据，建议可能很快改善。剩余工作很具体，不是哲学问题：拿到分母指标，把令人认可的战略叙事变成可被尽调支撑的估值案例。
