  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >
              分析 Sunrise 时，不应拿整个全球“AI”市场作参照。最有用的市场边界，是推理工作负载反复部署、每 token 成本足以影响采购的基础设施层。 纳入支出因此覆盖加速服务器和 AI
              专用存储、推理优化芯片和系统、集群调度 / 编排，以及公有云提供商、AI MaaS 运营商、国家算力中心和受监管企业为服务推理而购买的私有或云基础设施。 排除支出包括通用企业软件 AI 预算、Sunrise
              设计点之外的纯训练集群经济性、与推理没有关联的延期存储更新，以及一家国产 GPU 厂商现实上很难拿下的大部分海外超大规模云厂商 capex。


              现状替代方案很强。买方可以继续租用 Nvidia 支持的 GPU 云，使用大型国内对手提供的训练加推理平台，或者靠软件编排和 CPU 占比更高的智能体架构降低基础设施成本，而不是更换供应商。 IDC 的 2026
              年 Q1 数据显示，以 AI 为中心的需求已经与 GPU 系统一起落到纯 CPU 推理集群和编排工具上，这意味着 Sunrise 竞争的是工作负载组合， 而不是单一整块芯片预算。
