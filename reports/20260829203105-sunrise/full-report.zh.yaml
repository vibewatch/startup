  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 包含支出
      - 排除支出
      - 买方 / 付款方
      - 对 Sunrise 的重要性
    rows:
      - - AI 推理基础设施
        - 用于模型服务的加速服务器、推理集群、编排层，以及以 AI 为中心的存储和网络
        - 不控制基础设施的通用 SaaS AI 支出或应用层软件预算
        - 云服务商、AI MaaS 运营商、国家算力中心
        - 这是核心采购池，token 成本和部署经济性在这里最容易体现
      - - 国产自主 / 产业算力建设
        - 中国算力网络项目、国家支持的智算中心、运营商相关 AI 部署
        - 中国国产 GPU 厂商不太可能直接供应的海外超大规模云机柜
        - 中央和地方政府支持实体、电信集团、区域运营商
        - 为本地化基础设施创造政策对齐需求
      - - 受监管企业私有部署
        - 金融、电信和工业私有基础设施，数据本地化在这些场景很重要
        - Sunrise 没有直接绑定或合规优势的纯公有云转售
        - 企业 IT、数字化转型和基础设施团队
        - 匹配 Sunrise 围绕私有部署和合规敏感负载的叙事
      - - 仅训练的前沿集群
        - 仅在训练和推理共用硬件或采购路径时有限纳入
        - 为峰值训练吞吐优化的大规模前沿训练项目
        - 超大规模云厂商、研究实验室、模型开发者
        - 大体不在 Sunrise 明确的推理优先设计点内
      - - 通用企业存储更新
        - 仅包括支持推理数据管道或 AI 中心化存储的 AI 相关部分
        - 与模型服务需求无关的常规存储更新
        - 企业 IT 和基础设施团队
        - IDC 明确提醒，不要把广义存储补课与直接加速器 TAM 混淆
      - - 现状替代技术栈
        - GPU 云租用、国产全栈 AI 加速器、CPU 密集型编排、软件优化
        - N/A
        - 评估替代方案的同一买方群体
        - 说明 Sunrise 竞争的不是单一芯片厂商，而是架构和部署模式
    notes: |
      这一定义有意把 Sunrise 的可服务市场收窄到低于头部 AI 或半导体总量。广义 AI 基础设施预测是上限，不是 Sunrise 的 TAM。
