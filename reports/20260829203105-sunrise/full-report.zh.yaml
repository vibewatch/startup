        title: 可比样本与价格纪律
        blocks:
          - type: paragraph
            body: >-
              最有用的可比样本本来就是混合的。Cambricon 是最清晰的中国上市 AI 芯片参照，因为它已经披露收入，也拥有很大的市值；但这个规模让它更像边界标尺，而不是干净的私募市场定价可比。NVIDIA 和 AMD
              在全球范围内扮演同样角色：它们展示的是已经大规模披露的巨头，而不是不透明私有挑战者应自动套用的交易倍数。更有帮助的国内融资参照是 Moore Threads。它的公开市场路径说明，中国可以在公司盈利前积极资助
              GPU 故事，但也说明投资人最终会要求招股书级别的经营披露。


              因此，Sunrise 的 RMB 20B 估值标记要谨慎解读。它显著低于 Moore Threads 的隐含 IPO 市值，也远低于 Cambricon 的公开市值，所以从品类或自主可控逻辑看，价格并不荒谬。但
              Sunrise 披露的信息也比两者少得多。当前可比结论应保持克制，而不是宣传化：Sunrise 值得进入可投资观察名单，但当前估值已经要求投资人在公开商业证据出现前先付钱。
