      - number: '4.2'
        title: 公开进展与财务证据
        blocks:
          - type: paragraph
            body: >-
              Sunrise 的核心财务张力在于，资本市场叙事跑得远快于公开经营数字。最具体的主体层证据来自 Beijing Li'er 2025 年 5 月关于 Shanghai Zhenliang 的文件：2024
              年收入只有 RMB 240,704.88，净亏损 RMB 190.2M；2025 年 Q1 收入为零，季度亏损又达 RMB 22.9M。这些数字早于 Sunrise
              品牌正式推出和后续融资激增，因此不应被视为拆分后业务的完整图景。但它们仍重要，因为它们显示起点基本处在规模化之前。


              后续媒体报道记录了快速产品和融资进展：两代已量产、到 2026 年 1 月交付超过 10,000 片芯片、S1 和 S2 的量产说法，以及 2026 年 8 月 以约 RMB 20B
              估值完成的更大融资。即便如此，Sunrise 仍未公开披露在手订单、确认收入、毛利率、平均售价（ASP）、利用率、应收账款、
              存货周转或客户集中度。这让投资者落入熟悉的半导体陷阱：有技术野心和融资能力的证据，却缺少足够经审计的商业化细节。财务上，
              公司可能正从工程走向早期规模化，但外部可得证据仍更接近“有前景但未验证”，而不是“可承保的增长平台”。
