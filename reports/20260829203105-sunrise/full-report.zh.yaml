  - id: FO003
    title: Sunrise 快照 KPI
    type: kpi
    layout: standard
    summary: 这组 KPI 解释 Sunrise 为什么在叙事上值得投——产品节奏和融资速度——也把最大的剩余验证缺口摆出来。
    data:
