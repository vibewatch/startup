      - number: '4.3'
        title: 成本结构、单位经济性与资本强度
        blocks:
          - type: paragraph
            body: >-
              Sunrise 的成本结构更容易推断，难直接测量。公司是一家 GPU 平台建设者，员工近 500 人，约 80% 在研发，研发中心分布多地，
              持续流片，产品策略已经覆盖加速卡、服务器、集群和软件。仅这一点就意味着，收入规模起来之前，公司要承担高固定工程成本。 产品架构选择可能改善长期经济性：Sunrise 明确围绕 LPDDR6 或 LPDDR5X
              而非 HBM 定位 S3，强调更低 token 成本和更好的供应可得性； 中国媒体和管理层访谈也反复把该架构描述为降低系统 TCO、避开部分 HBM 瓶颈的方式。但 BOM 优势不等于毛利率。若良率、封装、支持、
              折扣、现场工程或客户定制成本偏高，更低内存成本架构仍可能给出偏弱毛利率。


              公开可比公司确认了这一品类的强度。Cambricon 是在达到数十亿人民币规模后才实现强盈利；Omdia 和 IEA 描述的 AI 基础设施环境， 则由巨额
              capex、电力约束以及持续的内存和封装压力定义。Sunrise 在无锡提出的先进封装合作又提供一个线索：即便它提升供应韧性，
              也凸显硬件公司必须在芯片裸片之外投入多少资源。尽调含义很直接。如果推理优先设计确实降低交付 token 成本，Sunrise 可能有明显结构性上行；
              但当前公开证据仍不足以有把握地估计毛利率、获客成本（CAC）、回本周期或营运资本转换。
