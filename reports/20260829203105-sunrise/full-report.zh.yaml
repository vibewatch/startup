      - number: '5.4'
        title: 差异化与信任缺口
        blocks:
          - type: paragraph
            body: >-
              Sunrise 的差异化容易描述，但难以完全验证。公开论据建立在几条相互支撑的逻辑上：推理优先架构、token 成本下降、LPDDR 带来的供应与容量优势、
              零代码或低摩擦迁移、全栈自研，以及垂直行业部署模板。在中国市场，这是一条连贯楔子，因为推理需求、成本敏感度和国产替代都变得更重要。 公司还指向 100+
              项知识产权资产、多次一次流片成功和多城市工程深度，以证明其技术诀窍并不浅。


              但信任缺口仍然实质存在。Sunrise 没有发布主要云软件厂商级别的开放开发者文档；没有披露中立基准套件、正式 SLA 历史、MTBF 统计或广泛公开认证栈；
              数据隔离、迁移便利等信任主张，目前也最好视为公司说法，而不是独立验证的控制。官方新闻索引通过 CAICT 验证和公开工程演讲提供了一些帮助，
              但保留记录仍够不上严格外部技术审计。正确尽调结论因此是平衡的：Sunrise 的产品故事足够具体，值得做严肃技术尽调；但仍太多由公司自述， 不能算完全验证的平台证据。
