      - number: '1.5'
        title: 里程碑、合作伙伴与反向信号
        blocks:
          - type: paragraph
            body: >
              Sunrise 已从 SenseTime 内部隐蔽的芯片项目，走到一家每隔数月就有公开里程碑的基础设施公司。官方新闻页记录了 WAIC 亮相、 FlagOS 2.1 适配、S2 卡通过 CAICT 验证、与
              TileLang 协作、与 4Paradigm 合作、与 Youzu 合作，以及参与 SenseTime“算力商城”生态。 公司还披露了面向 Token
              Factory、制造、金融和电信场景的垂直解决方案页面，合起来显示其野心不只是卖芯片，而是变现完整方案部署。 2026 年 8 月 Eastmoney 报道增加了一项供应链里程碑：Sunrise、Youzu 和
              Kangying 提议在无锡建设 2.5D/3D 先进封装中心。 反向信号在于，商业化叙事仍跑在可独立审计的经营结果前面。公开来源尚不能支撑经审计的年经常性收入（ARR）、客户数、债务融资额度或复购指标；
              2026 年 8 月最大的估值跃升，也来自媒体报道而不是公司一手完整披露。尽调视角下，Sunrise 最强的是战略契合度和技术野心， 最弱的是单位经济性和客户多元化的第三方证据。
