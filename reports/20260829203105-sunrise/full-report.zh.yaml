      - number: '1.4'
        title: 产品、规模信号与封面指标
        blocks:
          - type: paragraph
            body: >
              即便独立收入证据仍稀疏，产品曲线仍然连贯。S1 被描述为面向云边端视觉和多模态推理的芯片，已进入量产；第三方报道称累计出货超过 20,000 片。S2 把 Sunrise 延伸到大模型推理、微调和集群部署，并兼容
              PyTorch、vLLM、SGLang；2025 年中报道提到“万卡级”生产， 当前官方产品页也把它定位为已规模部署。旗舰 S3 于 2026 年 1 月 27
              日发布，是公司估值上台阶的核心。官方和第三方来源在核心规格上基本一致： LPDDR6 并兼容 LPDDR5X、PCIe Gen6、FP16 到 FP4 精度选项，以及面向推理而非训练调优的架构。Sunrise
              称单芯片性能较上一代约高 5x，token 成本低 90%，并给出最终“每百万 tokens 1 cent”的目标。这些指标重要，但仍由公司主导。与此同时，最硬的封面指标缺口在财务上：
              上市投资者文件仍显示，主要披露主体 2024 年收入只有 RMB 240,704.88 且大幅亏损，2025 年 Q1 收入为零。
