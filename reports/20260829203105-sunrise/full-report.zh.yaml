companyProfile:
  summary: >-
    Sunrise 是 2024 年末从 SenseTime 芯片部门拆分出的中国 AI 推理基础设施公司。公开来源支撑了一条连贯的产品叙事： S1 和 S2 推理芯片、2026 年 1 月发布的 S3，以及面向云、MaaS
    和企业部署的 Token Factory 软件。融资动能也强： 公开报道显示，2026 年 1 月公司获得接近 RMB 3B 的战略融资，4 月完成一轮超过 RMB 1B、估值高于 RMB 10B 的融资， 8 月又完成约 RMB
    2B、投后约 RMB 20B 的融资。缺失的是估值分母。本次保留的公开材料仍未充分披露当前收入、毛利率、 客户集中度、复购数据或股权结构表条款，难以支撑按成熟后期基础设施公司来定价。
