chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、阶段与运营布局
        blocks:
          - type: paragraph
            body: >
              Sunrise 给自己的定位不是通用训练芯片厂商，而是中国 AI 推理 GPU 和全栈推理基础设施公司。官网与关于页面把公司描述为 “All-in
              inference”供应商，覆盖芯片、加速卡、服务器、集群、工作站和自研软件栈；目标场景从公有云 Token Factory 到金融、 电信和工业部署。公开报道一直把公司源头指向 SenseTime
              大芯片部门：团队 2020 年在 SenseTime 内部启动 GPU 研发， 2024 年末随 SenseTime“1+X”重组拆分出来。当前公开总部在杭州，另在北京、上海、深圳、成都、珠海设有研发中心。
              各来源对阶段标签并不一致——Pre-A、战略融资，以及后来“B 轮”的简称都出现过——但 2026 年 4 月和 8 月的估值， 已把 Sunrise 在经济意义上推到后期私募独角兽区间，而不是早期创投阶段。
