  - id: FM003
    title: 买方 / 细分市场采用流程
    type: flow
    layout: standard
    summary: Sunrise 的市场路径，要把兼容性和 TCO 说法转化为少数买方类型里的分阶段基础设施部署。
    data:
      nodes:
