      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              Sunrise 的资本形成节奏异常压缩。2025 年 5 月 Beijing Li'er 对 Shanghai Zhenliang 的投资中，披露投资载体采用 RMB 1.5 billion 投前估值，并由
              Beijing Li'er 及其董事长 Zhao Wei 增资 RMB 250 million。到 2025 年 7 月，公开报道称公司完成近 RMB 1 billion 的 Pre-A 轮，投资方包括
              Huaxu Fund、4Paradigm、Youzu、Beijing Li'er、Songhe Capital、Haitong Kaiyuan 等产业和金融投资者。 2026 年 1 月，Sunrise
              宣布一年内累计获得近 RMB 3 billion 战略融资。2026 年 4 月，Caixin、Tencent、Jiemian、Sina 和 China Securities Journal 报道新一轮融资超过
              RMB 1 billion，使累计披露融资约 RMB 4 billion、跨七轮，估值升至 RMB 10 billion 以上。2026 年 8 月 28 日，Caixin 和 Tencent 又报道公司以约
              RMB 20 billion 投后估值完成一轮 RMB 2 billion 融资。 投资人名单从早期战略支持者扩展到国资相关资本、财务投资者和产业公司。重估速度是真实的，但截至抓取时点，最新一轮仍来自媒体报道，
              Sunrise 自有新闻页尚未正式详述。
