  - id: TV005
    title: 打破投资逻辑与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 融资重置
        - 下一轮新股低于当前估值成交，或带厚重保护 / 优先条款
        - 说明叙事价值高于市场出清价
        - 按悲观 / 基准重切估值，放慢或停止新增资金
      - - 客户验证停滞
        - 到下一轮主要融资时，外部生产客户仍未跳出合作伙伴中介案例
        - 削弱当前估值内含的商业化假设
        - 暂缓承销溢价倍数扩张
      - - S3 兑现失误
        - 重大横向扩展滑坡、生产延期，或中立基准证据偏弱
        - 伤及核心推理经济性溢价叙事
        - 将情景推向悲观，并重启技术尽调
      - - 披露仍然单薄
        - 到下一轮融资窗口仍没有收入、毛利率或集中度披露
        - 即便估值上升，信心也无法提高
        - 要求更强权利、更低价格，或直接放弃
      - - 政策 / 供应冲击
        - 出口管制或供应变化实质打乱路线图假设
        - 战略自主顺风转为执行拖累
        - 重估采购、时点和估值折价
      - - 集中度意外
        - 少数客户或关联方渠道主导需求，且没有多元化计划
        - 提高脆弱性，降低收入故事质量
        - 压低估值，并优先尽调集中度
    notes: 否决触发项必须可监控、能影响投资，而不是泛泛的风险标签。
