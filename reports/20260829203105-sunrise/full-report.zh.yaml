  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与推翻投资逻辑的关键风险
        blocks:
          - type: paragraph
            body: >-
              Sunrise 最重要的风险不是彼此独立的，它们会叠加。S3 若在量产上延误，Sunrise
              可能失去客户动能；客户动能若迟迟未被证明，融资成本会上升；融资若收紧，产品路线图执行和生态建设会进一步放慢。因此，最高风险簇是产品执行、客户转化和财务不透明三角。Sunrise 的公开叙事承诺更低 token
              成本、本地控制和系统级交付，但公司仍缺少中立基准、公开客户耐久性数据和公开财务透明度。纯软件公司还能承受这些缺口；GPU 平台更难，因为硬件周期和供应承诺会很快吃掉资本。


              第二层风险来自监管和基础设施。出口管制一方面会强化国产替代需求，另一方面也会让供应链更复杂、合规审查半径更大。国内产业政策支持明确，但也鼓励更多玩家入场，并加快竞争对手融资。最后，Sunrise
              的系统级主张——超节点、Token Factory、液冷、私有部署——意味着电力、封装和可靠性风险会直接传导到客户信任。投资人应把 Sunrise
              看成一家少数可观察里程碑会显著改变风险曲线的公司，而不是一家可以把执行疲弱藏在渐进式经常性增长里的公司。
