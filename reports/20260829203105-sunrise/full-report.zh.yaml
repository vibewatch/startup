      - number: '6.3'
        title: 具名证据、留存与集中度
        blocks:
          - type: paragraph
            body: >-
              公开证据集目前很窄，集中度和留存分析只能先看缺失项。Sunrise 尚未披露客户数、活跃客户数、年经常性收入或复购收入、续约率、头部客户集中度、队列留存，或 NRR/GRR
              式耐久性指标。这对年轻硬件平台并不罕见，但外部人因此无法判断公司使用量是否已经分散，还是少数战略账户主导漏斗。具名合作也容易被过度解读。客户标识、战略 MoU 或适配案例可以验证相关性，却不能证明稳定的年度回款。


              不过，现有具名证据仍有方向性价值。Youzu 的官方公告足够具体，能看出明确的目标工作流，而不是泛泛贴一个标识；但 Youzu 既是投资人也是合作伙伴，关系仍带战略绑定。SenseTime 的算力Mall
              证明生态占位，但 Sunrise 源自 SenseTime，这个信号并非完全独立第三方。Fourth Paradigm 的 ModelHub XC 内容显示 Sunrise 进入了垂直 AI
              解决方案工作流，但这更适合作为合作伙伴牵引的验证，而不是已披露的多年客户收入。因此，Sunrise 有客户证据，但质量不均，最强案例的独立性也混杂。
