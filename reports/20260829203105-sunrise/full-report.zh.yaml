      - number: '3.3'
        title: 能力、封装、价格可见度与切换成本
        blocks:
          - type: paragraph
            body: >-
              这个市场很难比较能力，因为各厂商为不同任务优化，也很少发布中立的头对头价格。Sunrise 强调纯推理设计、LPDDR6 内存策略， 以及对主流框架和服务引擎的兼容。Moore Threads 推广训练、推理和
              HPC 覆盖，支持 FP8 到 FP64，并通过 MUSA 打出近零迁移话术。 Huawei 把硬件与 CANN 绑定。NVIDIA 将芯片、集群和推理软件叠成强大的既有厂商组合。Kunlunxin 主打
              DeepSeek 适配和一键部署。 换句话说，买方比较的不是参数表本身，而是真实工作负载进入生产的难度。


              因此，切换成本与裸芯片性能同样重要。如果 Sunrise 能让 PyTorch、vLLM 和 SGLang 迁移真正低摩擦，那么更窄的架构仍可有效竞争。 如果做不到，客户可以继续租用 Nvidia
              支持的基础设施，采用更宽的国内平台，或在换供应商前先做软件优化。国内芯片的公开价格透明度很低， 所以实际买方决策路径依赖试点、工作负载适配、可服务性和打包经济性。Sunrise 的逻辑在
              token、服务器或集群层级比较时最强， 而不是在宽泛训练平台层级比较时最强。
