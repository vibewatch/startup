  - id: FO002
    title: Sunrise 公司快照逻辑
    type: flow
    layout: standard
    summary: Sunrise 的价值主张把 SenseTime 出身的工程能力、推理专用路线图和垂直解决方案连起来，但最终又绕回资本依赖和商业化验证风险。
    data:
      nodes:
        - id: origin
          label: SenseTime 系芯片团队
          detail: 研发源自 2020 年 SenseTime 内部，2024 年底独立拆出。
          tone: positive
        - id: leadership
          label: Xu Bing / Wang Yong / Wang Zhan 团队
          detail: 领导层把母公司资源、深度芯片执行和商业化经验拼在一起。
          tone: positive
        - id: s1
          label: S1 量产
          detail: 第一代云边推理芯片；第三方称出货超过 20,000 units。
          tone: positive
        - id: s2
          label: S2 规模部署
          detail: 面向大模型推理和集群使用的通用推理 GPGPU、板卡和服务器。
          tone: positive
        - id: s3
          label: S3 推理切口
          detail: LPDDR6、PCIe Gen6、FP4-16、长上下文和 token 经济性定位。
          tone: positive
        - id: solutions
          label: 垂直解决方案
          detail: Token 工厂、金融、制造和电信解决方案拓宽可变现路径。
          tone: positive
        - id: ecosystem
          label: 生态连接
          detail: 新闻页里程碑包括 FlagOS、4Paradigm、TileLang、Youzu 和 SenseTime 算力商城。
          tone: neutral
        - id: capital
          label: 融资节奏加速
          detail: 融资从 2025 年 5 月披露的 RMB 1.5bn 估值升至 2026 年 8 月约 RMB 20bn 投后估值。
          tone: positive
        - id: headcount
          label: 团队扩张
          detail: 公开披露从 2025 年约 150 名技术员工，提升到官网近 500 名总员工。
          tone: neutral
        - id: revenue-gap
          label: 披露缺口
          detail: 最新主要披露实体财务仍显示收入很小、亏损很大。
          tone: negative
        - id: governance-gap
          label: 治理不透明
          detail: 未公开完整董事会名单、优先权、债务或客户集中度披露。
          tone: negative
        - id: thesis
          label: 尽调关键点
          detail: 投资逻辑取决于 S3 交付和 token 经济性能否转化为可复购的外部客户收入。
          tone: warning
      edges:
        - from: origin
          to: leadership
        - from: leadership
          to: s1
        - from: leadership
          to: s2
        - from: leadership
          to: s3
        - from: s1
          to: s2
        - from: s2
          to: s3
        - from: s3
          to: solutions
        - from: solutions
          to: ecosystem
        - from: ecosystem
          to: capital
        - from: capital
          to: headcount
        - from: headcount
          to: revenue-gap
        - from: revenue-gap
          to: thesis
        - from: governance-gap
          to: thesis
        - from: capital
          to: thesis
    approximationNotes: |
      箭头呈现的是 Sunrise 公司故事的分析流，不代表合同因果。负面节点标出可能打破公司概况投资逻辑的具体尽调瓶颈。
