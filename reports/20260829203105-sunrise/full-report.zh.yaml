        title: 工作流、部署与路线图
        blocks:
          - type: paragraph
            body: >-
              Sunrise 的解决方案页面有用，因为它们显示公司预计技术会如何被采用。在 Token Factory 中，工作流从需要可计量、弹性推理容量的基础设施买方开始， 服务于公有云、私有云或 MaaS
              运营。在金融和医疗中，交付路径强调本地部署、数据控制，以及与合作伙伴算法和企业工作流集成的大模型推理。
              在电信和制造中，价值主张转向边缘推理、多模型并发，以及网络条件或延迟预算紧张时的韧性。在娱乐和绿色能源中，Sunrise 把自己定位为内容生成或能耗感知 AI 基础设施的可控计算底座。


              路线图顺序也连贯。S1 和 S2 证明 Sunrise 能流片并量产不止一代产品；S3 把战略延伸到智能体时代推理经济性；SC3-256 和 Token Factory
              推动公司沿价值栈上行到集群交付；官方新闻索引提到 CAICT 验证、FlagOS 适配、TileLang 讨论和 Fourth Paradigm 合作，
              显示公司正尝试围绕核心芯片拓宽集成点。弱点在于，公开路线图证据仍有选择性。Sunrise 提供了里程碑和生态信号，但尚未提供详细发布说明、 公开变更日志、在线率指标或第三方资质数据，还无法消除大部分技术执行疑虑。
