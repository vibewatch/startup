  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 真实融资和产品可信度给了关注理由；但分母指标缺失，结论在当前估值标记上仍落到观察。
    data:
      nodes:
        - id: n1
          label: 真实融资
          detail: 2026 年多轮融资，最终投后估值接近 RMB 20B
        - id: n2
          label: 可信路线图
          detail: S1/S2 量产叙事和 S3 推理定位已公开，且彼此连贯
        - id: n3
          label: 披露缺口
          detail: 没有公开收入、毛利率、复购订单或集中度分母
        - id: n4
          label: 可比组混杂
          detail: 同行和既有巨头证明规模门槛，但不能直接迁移私人市场定价
        - id: n5
          label: 情景中点
          detail: 公开证据的重心略低于最新估值标记
        - id: n6
          label: 观察 / 全面跟进
          detail: 保持跟进，但需要更强证明或更好价格
      edges:
        - from: n1
          to: n2
          label: 支撑关注
        - from: n2
          to: n5
          label: 创造期权价值
        - from: n3
          to: n5
          label: 阻碍精准定价
        - from: n4
          to: n5
          label: 迫使保持纪律
        - from: n5
          to: n6
          label: 界定立场
    approximationNotes: 本图是对本章决策逻辑的压缩，不是因果经营模型。
