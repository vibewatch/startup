  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、估值背景与核心判断
        blocks:
          - type: paragraph
            body: >-
              Sunrise 很容易让人认真对待，但仅凭公开证据，很难有把握地定价。公司是真实存在的：它脱胎于 SenseTime 的芯片业务，S1、S2、S3 的推理 GPU 路线图可见，并在 2026
              年连续获得知名中国资本融资。因此，8 月最新一轮投后约 RMB 20B 的估值并非凭空出现。它之前已有 4 月高于 RMB 10B 的估值标记，也有围绕 S3 和生态建设的更早战略融资。


              问题不在于 Sunrise
              是否存在，或投资人是否关心。问题在分母。保留下来的公开材料仍未披露收入、年经常性收入（ARR）、毛利率、复购行为、客户集中度或股权结构条款。这意味着外部人可以验证一个快速上升的估值故事，却无法测试价格到底便宜、合理，还是已经偏高。基于这些证据，当前最合适的结论是观察：产品和战略自主逻辑可信，尽调应保持推进；但在披露质量改善或价格纪律变好之前，不应把
              RMB 20B 认定为显而易见的价值入口。
