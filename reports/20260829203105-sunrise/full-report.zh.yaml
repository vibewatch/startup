      - number: '4.4'
        title: 资本充足性与尽调结论
        blocks:
          - type: paragraph
            body: >-
              从资本充足性看，Sunrise 比其稀疏财务披露所暗示的状态强得多。公开报道显示，公司在 2025 年中融资约 RMB 1B，2026 年 1 月近 RMB 3B，2026 年 4 月又完成一轮 RMB 10B+
              估值融资，2026 年 8 月再融 RMB 2B；自 2024 年末拆分以来，累计披露融资接近 RMB 6B。管理层和媒体都称，募集资金将用于下一代推理 GPU
              研发、规模化生产和生态建设。相较资金更少的国内初创公司，这应足以支撑公司推进到下一轮产品周期。


              但“资本充足”不等于“资本需求已去风险”。Sunrise 仍处在硬件库存、软件适配、封装、集群交付和客户证明都会在经常性经济性显现之前吸收现金的栈位。
              没有公开现金余额披露、烧钱速度披露、债务到期安排，也没有营运资本桥。因此，正确的财务结论既不是乐观外推，也不是直接否定。Sunrise
              看起来可融资且具战略相关性，但公开记录仍只支持有条件的尽调立场：在管理层能展示收入质量、毛利率进展和可重复客户回款前，假设公司仍依赖持续融资。
              用创投语言说，公司目前大概率已经回答了“能否融资？”的问题，但还没有回答“规模是否能带来持久经济性？”的问题。
