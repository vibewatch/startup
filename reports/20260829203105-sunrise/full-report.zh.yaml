        - id: deploy
          label: 服务器 / 集群部署
          detail: 胜出的供应商会从板卡测试扩展到服务器、集群和调度集成。
          tone: positive
        - id: solution
          label: 方案化 / 托管服务
          detail: 在 Sunrise 的叙事里，Token Factory 运营和垂直套餐把变现边界从裸加速器销售向外拓宽。
          tone: positive
      edges:
