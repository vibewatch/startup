  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 细分市场图谱与买方 / 用户 / 付款方角色
        blocks:
          - type: paragraph
            body: >-
              即便商业证据不完整，Sunrise 官方材料仍把细分市场图谱讲得相当清楚。公司通过 Token Factory 明确瞄准公有云和私有云提供商、 AI MaaS
              运营商，以及国家级或区域算力中心运营商。公司也在金融、电信、制造、娱乐、医疗和绿色能源中营销行业部署。 这些细分标签重要，因为各场景中的买方、用户和付款方并不相同。在云和 MaaS
              场景中，买方很可能是平台或基础设施负责人， 用户是运维或模型服务团队，付款方是围绕利用率和 token 经济性优化的资本预算负责人。在受监管企业场景中，买方更可能是 CIO、
              数字化转型团队或业务线负责人；用户是工作流或 AI 团队，付款方则位于对合规敏感的预算内。


              这种细分说明，Sunrise 追求的不是消费者式获客动作。它走的是设计伙伴和基础设施采用路径，在这条路径上，方案适配、数据控制、
              性能可迁移性和部署服务，与硅本身同样重要。这扩大了潜在市场，但也意味着公司必须在少数复杂买方原型中证明可重复性，而不是面对大量小账户。
