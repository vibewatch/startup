      - number: '2.4'
        title: 增长驱动、约束与剩余市场缺口
        blocks:
          - type: paragraph
            body: >
              需求逻辑很直接。Omdia 和 IDC 都认为，推理正从前沿模型训练，扩展到智能体、复杂推理、编排和行业部署工作负载。 这扩大了需要反复推理、而不只是偶尔训练模型的买方数量。中国政策也通过算力网络投资、面向电信的
              AI 部署指引和互联互通计划支持国内建设。 但这些顺风不会消除执行风险。同一批市场来源强调，电力和电网接入正在拖慢数据中心投产，AI 工厂建设变得高度资本密集， HBM、先进封装和领先制程约束至少持续到 2027
              年。U.S. BIS 规则继续影响中国获取先进半导体的能力，而 Nvidia 继续靠硬件加软件集成压低 token 成本主张。


              对 Sunrise 来说，结果是一个无疑很大、但结构上竞争激烈的市场。未解的问题不是推理需求是否存在，而是 Sunrise 能用国内供给服务其中多少需求， 多少采购份额需要特定的 LPDDR
              中心设计取舍，以及公开证据最终能否显示真实客户预算，而不只是宏观顺风。
