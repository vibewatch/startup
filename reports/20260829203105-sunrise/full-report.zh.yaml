  - id: TV006
    title: 最终尽调要求表
    columns:
      - 议题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 收入和客户组合
        - 当前收入、头部客户占比、产品组合和复购数据
        - 没有分母，估值就无法干净测试
        - 要求数据室提供收入桥和客户集中度明细
      - - 毛利率和 BOM
        - 芯片级和系统级毛利率，内存与封装成本敞口
        - 推理成本主张只有穿过硬件经济性后才有意义
        - 审阅 BOM、毛利率桥和定价瀑布
      - - 股权结构表和优先权堆叠
        - 期权池、清算优先权、参与权，以及近期老股或 409A 标记
        - 没有结构性条款，简单毛回报计算会严重误导
        - 获取当前股权结构表和融资文件
      - - 客户验证
        - 具名外部生产客户、部署规模和复购节奏
        - 区分合作伙伴辅助验证和可持续商业化
        - 开展客户访谈，并确认在线部署参考
      - - S3 技术验证
        - 中立同工作负载基准数据、可用性和部署证据
        - 溢价逻辑取决于真实生产推理经济性
        - 对实际部署开展第三方技术尽调
      - - 供应和政策依赖
        - 晶圆代工、封装、内存和出口管制敏感性地图
        - 如果供应假设脆弱，战略顺风可能反转
        - 梳理关键供应商，并获取法律 / 出口管制备忘录
    notes: 这些要求是从观察姿态进入可投资判断所需的最低包。
