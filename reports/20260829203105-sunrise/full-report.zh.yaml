      - number: '7.2'
        title: 监管、法律与政策风险
        blocks:
          - type: paragraph
            body: >-
              Sunrise 所在赛道无法回避监管暴露。美国围绕先进计算半导体收紧出口管制，仍是中国 AI 基础设施技术栈的活变量；NVIDIA 2025 年 Form 8-K
              说明，许可变化可以多快影响产品可得性、库存和竞争格局。对 Sunrise
              的直接影响并不单一。更严管制会让国产替代更具战略价值，也会改变采购假设、软件移植预期，以及客户拿国产平台与全球龙头比较时采用的标准。MIIT 和 NDRC 的国内政策支持算力网络建设和 AI
              采用，但政策支持不等于收入确定性；它也可能只是把竞争场做大。


              法律和披露风险范围更窄，但仍重要。Sunrise 的公司边界变化很快：从 Shanghai Zhenliang 到 Zhejiang Sunrise，再到杭州运营实体和多个融资载体。Beijing Li’er
              文件和 QCC 注册信息有用，但也说明尽调必须确认 IP、合同、负债和现金到底落在哪个实体。留存的公开信源没有发现 Sunrise 重大诉讼或执法行动，但没有浮出案件不等于完整法律清洁证明。Sunrise
              向受监管、与政府相关的环境销售国产 AI 基础设施，实体清晰度和自由实施尽调仍是必选项。
