  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局边界、竞争者类别与真正比较组
        blocks:
          - type: paragraph
            body: >-
              Sunrise 竞争的不是单一整块“GPU 市场”。现实竞争场是分层的。第一层是能卖进中国推理和主权算力项目的直接国产 AI 芯片同行： Cambricon、Moore
              Threads、Kunlunxin、Huawei Ascend、Biren、MetaX 以及其他新兴加速器。第二层是既有全球平台——首要是
              NVIDIA——即便出口管制限制直接获取，它们仍定义性能、生态预期和现状部署模型。第三层是替代基础设施：租用 GPU 云，以及 vLLM 等软件服务栈，它们让买方可以从现有部署中榨出更多吞吐，从而推迟硬件切换。


              这个边界重要，因为 Sunrise 的差异化并不是试图在训练规模上打败所有对手，而是把任务收窄到推理经济性。其官方材料反复把 token 成本、
              私有化部署和迁移友好工具放在中心。许多对手做得更宽。Cambricon 和 Huawei 销售平台广度。Moore Threads 推广覆盖训练、推理、 渲染和 HPC 的通用 GPU。Baidu 旗下
              Kunlunxin 呈现一套硬件加软件的 AI 计算系统，并已有具名银行项目。Biren 和 MetaX 说明， 其他中国 GPU
              新进入者正在接近资本市场，也会争夺同一批政策偏好的国内需求。因此，正确比较组不是“Sunrise 对比全球 AI 支出”， 而是 Sunrise 对比能解决同一个推理任务的国内平台、全球既有厂商和替代栈组合。
