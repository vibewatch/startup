  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现面
        blocks:
          - type: paragraph
            body: >-
              Sunrise 官方材料描述了多个变现面，但收入模式只有一部分有直接证据。在硬件层，公司销售或部署推理 GPU、加速卡、服务器和集群级系统， 覆盖 S1、S2、S3 以及 SC3-256
              级产品。在软件和系统层，公司把 SIRE、TANG、AIOS 式预装系统和 Token Factory 编排， 作为全栈交付模型的一部分，而不是裸芯片生意。这一点在财务上重要，因为 Sunrise 并不试图靠单一
              SKU 变现。它看起来是在变现一个组合： 硅、封装后的系统、软件兼容、部署工程，以及部分情况下的托管或可计量推理容量。


              最有意思的信号是 Token Factory。官方 Token Factory 页面把推理框定为可服务、可计量的产出——“让 tokens 像水电一样可得”——服务公有云、 私有云、MaaS
              运营商和国家算力中心。用财务语言说，这意味着 Sunrise 可能通过几条渠道挣钱：一次性硬件销售、系统集成收入、软件赋能的方案交付、
              集群部署费，以及可能与合作伙伴绑定的容量制或用量制商业结构。但公开证据仍未披露收入结构、价格实现、合同期限、付款条件，或 Sunrise
              主要把收入记为产品销售、项目交付还是经常性服务费。正确结论是，收入架构足够宽，能支撑上行空间；但若没有客户层数据，其质量仍过于不透明，难以支撑投资判断。
