      - number: '7.4'
        title: 财务、执行与监控计划
        blocks:
          - type: paragraph
            body: >-
              财务模型风险和人事风险构成最后一块拼图。Sunrise
              的融资能力显著降低了近期偿付风险，但也把未来举证门槛抬高。高估值和大额融资会让市场期待公司把工程动能转化为可审计的收入质量、利润率和多元化。公开证据仍未显示这种转化已经发生。同时，Sunrise
              高度依赖一支规模不大的领导班底，尤其是与 Xu Bing、Wang Yong、Wang Zhan 相关的产品、架构、商业化和生态人物。年轻拆分公司
              可以承受一定模糊性，但很难同时承受产品节奏、人才留存和资本市场信用滑坡。


              处理方式不是回避公司，而是按里程碑依赖型投资来监控。投资人应把未来 12 到 18
              个月视为验证窗口。第三方生产基准、更广泛的具名客户、更清晰的实体级披露、复购证据，以及至少部分毛利率可见度，都会实质性降风险。反过来，收入质量持续不透明、监管意外收紧、S3
              无法证明规模化扩展，或早期伙伴没有转化为耐久支出的证据，都应被视为终止投资触发项。只有证据补缺的速度快于野心扩张的速度，Sunrise 才仍具备可投性。
