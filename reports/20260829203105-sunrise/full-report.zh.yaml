        title: 同行画像：规模、产品范围与战略方向
        blocks:
          - type: paragraph
            body: >-
              按公开披露规模看，在严肃竞争者中 Sunrise 可公开验证的证据规模仍是最小的一家。Cambricon 已经报告数十亿人民币收入、利润以及覆盖云、边、集群的广泛布局。 Moore Threads 和 MetaX
              证明，即便品类尚未完全成熟，公开股票市场投资者也会为国产 GPU 叙事提供大额资金；Biren 的香港上市路径和 Kunlunxin
              拟拆分则说明，多个同行能够获得新资本、扩大治理可见度，并为下一轮研发周期融资。Huawei 的竞争方式则不太像单一芯片，更像一个整合了集群、 软件架构和企业触达的平台。


              战略不对称很重要。客户想要更低 token 成本且不需要最宽训练路线图时，Sunrise 更窄的纯推理定位可能成为优势。但这也让 Sunrise 面对预算更宽、一线销售 /
              交付团队更大、软件生态更深、客户案例更可见的公司。Cambricon 的集群系统业务挑战 Sunrise“全栈”的独特性。 Moore Threads 和 Huawei
              凸显了芯片与系统产品、成熟软件层结合后的商业力量。Kunlunxin 的银行项目说明，对手已经可以拿出受监管行业生产级证据。 因此，Sunrise
              的竞争主张不是规模持平，而是更有取舍的推理架构，可能在经济性和部署适配比最宽功能面更重要的地方取胜。
