figures:
  - id: FO001
    title: Sunrise 公司里程碑时间线
    type: timeline
    layout: standard
    summary: 从 SenseTime 孵化，到 2026 年 S3 发布和 RMB 20 billion 估值上台阶，Sunrise 的公开故事是一串密集的资本与产品里程碑。
    data:
      items:
        - date: 2020-05
          label: 芯片业务起步
          detail: 公开资料将 Sunrise 的源头追溯到 SenseTime 芯片部门，以及 2020 年开始披露的 Shanghai Zhenliang 脉络。
          tone: neutral
        - date: 2024-12
          label: 从 SenseTime 拆出
          detail: SenseTime 的 “1+X” 重组将芯片业务外部化，Xu Bing 成为 Sunrise 董事长。
          tone: positive
        - date: 2025-05
          label: Beijing Li'er 投资
          detail: 一家上市产业投资者披露，向 Shanghai Zhenliang 投入 RMB 200 million，关联方另投 RMB 50 million，投前估值 RMB 1.5 billion。
          tone: neutral
