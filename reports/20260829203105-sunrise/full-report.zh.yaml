      - number: '1.2'
        title: 领导层、治理与团队构成
        blocks:
          - type: paragraph
            body: >
              领导层集中度是 Sunrise 故事的核心部分。董事长 Xu Bing 是 SenseTime 联合创始人，也是最常被公开关联到芯片部门从上市母公司剥离的高管。 运营领导由联席 CEO Wang Yong 和
              Wang Zhan 分担。Wang Yong 来自 AMD、Baidu Kunlun 芯片项目和 SenseTime 内部芯片项目， 带来深厚的半导体执行可信度；Wang Zhan 则来自 Baidu
              创始时代的广告与搜索体系，带来商业化和组织经验。公开董事会披露仍薄： 已审阅公开材料识别出董事长和联席 CEO，但没有披露完整独立董事名单、委员会结构或投资者控制条款。团队规模披露也显示公司快速扩张。 2025
              年中报道称其技术核心约 150 人，2026 年 1 月报道称团队超过 300 人；当前官方 About 页面称 Sunrise 已接近 500 名员工， 其中约 80% 从事研发，研究人员近 400
              名。这一路径支撑了加速建设的说法，也提示了有意义的关键人依赖和固定成本依赖。
