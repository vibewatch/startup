            title: 推理需求足够真实，Sunrise 不需要编造宏观顺风
            body: >
              IDC、Omdia 和 IEA 指向同一个方向：AI 基础设施已经从实验走向产业级资本承诺，随着智能体和复杂推理工作负载推高 token 需求， 推理也在扩张。因此，即便 Sunrise
