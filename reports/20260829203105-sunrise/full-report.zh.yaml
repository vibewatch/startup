              Sunrise 没有公开披露传统后期成长模型所需的指标，因此这里的情景分析以里程碑为基础。悲观情景假设 Sunrise 仍具战略相关性，却无法把这种相关性转化为广泛、可由外部验证的商业化。在这种状态下，团队、IP
              和国产技术栈期权仍可能让公司有价值，但市场出清估值很可能滑入明显更低的区间。


              基准情景假设 Sunrise 继续出货，S3
              路线图保持完整，公开客户证据有所改善，但不足以消除收入质量或利润率结构的不确定性。这个情景支持围绕当前估值标记的区间，而不是明确溢价。乐观情景需要更强证据：多个外部客户验证、更透明的单位经济，以及 Sunrise
              能在不破坏 token 成本逻辑的前提下扩展推理部署。在这个视角下，当前估值不是不可能，而是已经偏满。新资金只有在执行把 Sunrise 迅速推向乐观情景证据集时，才可能从 RMB 20B 起点获得强回报。
