      - number: '3.4'
        title: 护城河持久性、监管位置与反向竞争证据
        blocks:
          - type: paragraph
            body: >-
              对 Sunrise 最乐观的解读，是推理经济性正变得足够重要，足以支撑一个专家型赢家。反向解读是，专家通常需要可见客户锁定， 或者难以复制的独特生态边缘，而 Sunrise
              尚未在任一维度披露足够公开证据。监管和资本市场正在塑造这场竞争。出口管制和实体清单压力可能削弱部分中国对手， 但也会强化北京支持的自主替代需求，鼓励更多进入者和更多融资。Moore
              Threads、MetaX、Biren 和 Kunlunxin 显示， Sunrise 不会是唯一一家有钱投入下一轮产品周期的国内平台。


              护城河持久性取决于：买方计入迁移工作、封装约束、支持、基准真实性之后，Sunrise 以 LPDDR 为中心的推理架构在生产中是否仍显著更便宜。 如果 vLLM 等软件替代方案和 NVIDIA Blackwell
              等既有平台缩小经济差距，Sunrise 的楔子会迅速收窄。如果国内企业反而更看重主权部署、 推理总拥有成本（TCO）和较低 HBM 依赖，Sunrise
              仍可能赢得有意义的细分位置。目前，公开证据支持差异化定位，但还不能证明持久护城河。 公司更像拥挤国内赛道里的可信竞争者，而不是横扫品类的赢家。
