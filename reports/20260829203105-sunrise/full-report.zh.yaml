          tone: positive
        - label: 研发人员
          value: ~400 researchers
          detail: 当前官方披露意味着成本结构高度偏工程。
          tone: neutral
        - label: 核心技术经验
          value: ~15 years average
          detail: 官网称核心技术骨干平均行业经验约 15 年。
          tone: positive
        - label: 最新融资
          value: RMB 2bn
          detail: Caixin 和 Tencent 报道 2026 年 8 月 28 日融资的投后估值约 RMB 20bn。
          tone: positive
        - label: 最新估值
          value: ~RMB 20bn post-money
          detail: 当前价格上台阶，使 2026 年 4 月估值在四个月内几乎翻倍。
          tone: warning
        - label: 截至 2026 年 4 月融资
          value: ~RMB 4bn across 7 rounds
          detail: 2026 年 4 月多家媒体收敛于七轮融资、累计约 RMB 4bn。
          tone: positive
        - label: 截至 2026 年 1 月战略融资
          value: ~RMB 3bn within a year
          detail: 1 月公告显示 S3 发布前已有融资动能。
          tone: positive
        - label: S1 出货量
          value: '>20,000 units reported'
          detail: 第三方报道将这一数字归因于公司披露。
          tone: positive
        - label: 2025 年推理 GPU 交付
          value: '>10,000 reported'
          detail: 2026 年发布会和访谈报道显示，2025 年交付超过 10,000 units。
          tone: positive
        - label: S3 性能主张
          value: ~5x prior-gen single-chip performance
          detail: 厂商主导的产品主张，未经独立审计。
          tone: warning
        - label: S3 成本主张
          value: ~90% lower token cost vs prior gen
          detail: 对投资逻辑重要，但仍是公司主导基准。
          tone: warning
        - label: 最新披露的 2024 年收入
          value: RMB 240,704.88
          detail: Beijing Li'er 文件显示，主要披露投资载体收入很小。
          tone: negative
