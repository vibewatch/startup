      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >
              Sunrise 自有页面让买方地图比收入地图更清晰。公司通过 Token Factory 方案明确瞄准公有云和私有云提供商、AI MaaS 运营商以及国家算力中心；
              同时展示金融和电信中的受监管企业部署场景，以及制造业中偏工业边缘和机器人的场景。在这些场景里，买方通常是基础设施或数字化转型预算负责人， 用户是工程、模型服务或运维团队，付款方可能是中央
              IT、云基础设施、电信或受监管业务单元。这个分层重要，因为采用标准并不相同。 云和 MaaS 平台围绕利用率、token
              经济性和多租户优化；受监管企业更重视合规、数据本地化和私有化部署；工业边缘买方重视延迟、韧性和多模型并发。


              采用路径通常从兼容性证明开始，然后进入基准测试或试点，再部署到服务器或集群规模，最后方案化或托管服务化。Sunrise 的官方定位显示， 它希望靠加速卡、服务器、集群和软件工具压缩这条路径，而不是把裸芯片卖进
              DIY 环境。
