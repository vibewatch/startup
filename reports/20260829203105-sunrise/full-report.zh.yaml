  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块图谱
        blocks:
          - type: paragraph
            body: >-
              Sunrise 应被理解为一个可交付的推理平台，而不只是芯片设计公司。其公开产品面包括 S1、S2、S3 三代芯片；PCIe 卡和 OAM 形态模块； 多种服务器和一体机配置；面向大模型推理的 SC3-256
              超级节点封装；SIRE 软件栈；TANG 编程模型；以及面向云和 MaaS 客户的 Token Factory 交付概念。这种宽度重要，因为买方并不会孤立接触某一个部件。Sunrise
              越来越把商业产品呈现为硅、内存架构、 软件兼容性、系统形态和部署工具的组合。


              成熟度本来就不均衡。S1 看起来是最老、也最经过验证的模块，绑定云边端多模态推理和长期运行的 CV 类工作负载。S2 把 Sunrise 延伸到更通用的大模型和高并发推理，
              配有多种卡和服务器形态，并明确支持框架。S3 是最新战略资产：该平台明确针对多模态大模型和智能体推理优化，配备 LPDDR6 或 LPDDR5X、 PCIe
              Gen6、多精度支持，以及超级节点级部署路径。因此，产品宽度是真实的，但各层商业权重仍不均衡：S1 和 S2 更像今天工程成熟度的证明， S3 和 SC3-256 则代表未来逻辑的核心。
