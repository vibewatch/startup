      - number: '1.6'
        title: 要点摘录
        blocks:
          - type: callout
            title: 专注推理是真正的战略选择，不是临时改口的营销标签
            body: >
              Sunrise 的来源呈现出一致模式：S1 和 S2 在 S3 把“All-in inference”推到公司叙事中心之前，已经偏向推理。这种连续性重要。 它说明公司已经花了多个产品世代，学习长上下文、多轮以及
              KV cache 负担重的工作负载会在什么地方打穿通用 GPU 经济性。 如果真实客户部署验证 token 成本主张，Sunrise 可能占住中国 AI 基础设施栈中更窄但非常相关的一段。
            calloutType: strength
            claimRefs:
              - CO013
              - CO015
              - CO017
              - CO019
              - CO020
              - CO021
          - type: callout
            title: 估值加速明显跑赢独立财务披露
            body: >
              当前公开记录里最大的错配不是技术野心，而是披露深度。Sunrise 从 2025 年 5 月披露主体 RMB 1.5 billion 投前估值， 到 2026 年 8 月约 RMB 20 billion
              投后估值；同时，最强的一手财务记录仍显示，披露投资载体 2024 年收入很小且亏损明显。 在 Sunrise
              披露外部客户结构、真实入账收入或经审计的集团财务之前，市场承保的更多是预期战略重要性，而不是已验证的经济性。
            calloutType: risk
            claimRefs:
              - CO027
              - CO028
              - CO032
              - CO038
              - CO039
              - CO040
              - CO041
          - type: callout
            title: 变现野心不止芯片
            body: >
              Sunrise 网站已经把公司框定为基础设施提供商，而不只是芯片供应商。Token Factory 引入了可计量推理服务的表达；产品页延伸到加速卡、
              服务器、集群和超级节点；垂直解决方案页面则暗示咨询、集成和私有化部署经济性。这对尽调重要，因为如果公司执行到位，收入池会变大； 但营运资本、支持和供应链复杂度也会同步上升。
