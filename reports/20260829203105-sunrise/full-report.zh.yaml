      - number: '2.2'
        title: 在证据约束下用多重口径测算规模
        blocks:
          - type: paragraph
            body: >
              Sunrise 的公开市场规模只能通过代理指标观察。IDC 估计，全球 AI 基础设施支出在 2025 年 Q4 约为 $89.9 billion，2025 年全年为 $318 billion，2026 年 Q1
              又约为 $89.7 billion；其 2026 年全年预测为 $497 billion，到 2029 年超过 $1 trillion。Omdia 补充了两个相邻口径：2026 年领先科技企业 AI 基础设施
              capex 超过 $600 billion；AI 数据中心芯片市场从 2024 年 $123 billion 扩至 2025 年 $207 billion，并在 2030 年达到 $286
              billion。这些上限有用，但仍然很宽。它们包含 Sunrise 触达不了的地区和支出池， 也覆盖训练、网络和基础设施中远宽于推理 GPU 的部分。


              最相关的中国口径是政策绑定基础设施。Xinhua 援引 NDRC 称，2026-2030 年中国算力网络可能吸引 RMB 4 trillion 新增直接投资。 这个数字仍太宽，不能直接称为 Sunrise
              的总可用市场（TAM），但它确实确认了一个庞大的主权和产业级建设背景。正确的尽调姿态，是把 Sunrise
              的实际市场视为上述大数中的折价切片，集中在国内推理采购中本地供给、总拥有成本（TCO）和软件可迁移性真正重要的部分。
