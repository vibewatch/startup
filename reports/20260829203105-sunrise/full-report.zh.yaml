      - number: '6.4'
        title: 扩张路径与投资判断
        blocks:
          - type: paragraph
            body: >-
              Sunrise 的潜在扩张路径在概念上已经清楚。如果公司拿下云、MaaS、游戏或受监管企业部署，就可能从板卡供应扩到服务器、集群、迁移工具、垂直优化，最终扩到 Token Factory
              式计量算力。只要真实客户使用存在，这就是很强的先落地再扩张模型。问题在于，公开记录仍看不出这些循环发生得多频繁，早期用户是否复购，Sunrise 赢下的是评估项目，还是更耐久的平台位置。


              投资人现在可以给出的客户结论，是谨慎正面。Sunrise
              似乎已经识别出真实买方群体，也拿到了几个具名生态或客户邻近关系。它也契合中国客户对本地部署、推理经济性和国产技术栈控制的诉求。但客户质量仍是本报告最大的未解问题之一。除非 Sunrise
              披露复购订单、生产级账户数量、头部客户占比，以及合作伙伴转化为付费终端用户的证据，否则它的客户故事应被视为有希望的需求形成，而不是已经充分验证的收入耐久性。
