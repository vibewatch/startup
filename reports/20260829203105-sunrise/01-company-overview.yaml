- id: milestones-partnerships-and-adverse-signals
  title: Milestones, Partnerships, and Adverse Signals
  body: |
    Sunrise has moved from a hidden internal SenseTime chip effort to a visible infrastructure company with public milestones every few months. The official news page logs WAIC appearances, FlagOS 2.1 adaptation, CAICT validation for the S2 card, collaboration with TileLang, partnership with 4Paradigm, cooperation with Youzu, and participation in SenseTime's “compute mall” ecosystem. The company also disclosed vertical solution pages for token-factory, manufacturing, finance, and telecom scenarios, which together imply an ambition to monetize not only chips but full solution deployments. An August 2026 Eastmoney report added a supply-chain milestone: Sunrise, Youzu, and Kangying proposed a 2.5D/3D advanced-packaging center in Wuxi. The adverse signal is that the commercialization narrative still runs ahead of independently auditable operating results. Public sources do not yet support audited ARR, customer count, debt facilities, or repeat-purchase metrics, and the largest valuation jump in August 2026 came through media reports rather than a full primary company disclosure. For diligence, Sunrise therefore looks strongest on strategic fit and technical ambition, and weakest on third-party proof of unit economics and customer diversification.
