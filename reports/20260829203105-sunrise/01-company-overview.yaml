      label: S3 launch
      detail: The company launches Qiwang/启望 S3, SC3-256 supernode, and an inference-cloud plan in Hangzhou.
      tone: positive
    - date: '2026-04-20'
      label: RMB 1bn+ round
      detail: Multiple outlets report a round above RMB 1 billion that takes cumulative funding to about RMB 4 billion and valuation above RMB 10 billion.
      tone: positive
    - date: 2026-04
      label: Unicorn positioning
      detail: Investor-aligned sources begin describing Sunrise as China's first pure-inference GPU unicorn.
      tone: neutral
    - date: '2026-08-12'
      label: Packaging-center plan
      detail: Sunrise, Youzu, and Kangying announce a proposed 2.5D/3D advanced-packaging center in Wuxi.
      tone: neutral
    - date: '2026-08-28'
