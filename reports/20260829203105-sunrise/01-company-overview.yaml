company:
  name: Sunrise
chapter:
  number: 1
  title: Company Overview
  summary: Sunrise (曦望科技) is a Hangzhou-headquartered AI inference GPU company spun out of SenseTime's chip division in late 2024 after years of prior internal R&D. Public sources support a fast-moving capital story—about RMB 4 billion raised by April 2026 and roughly RMB 6 billion by August 2026—alongside mass-produced S1/S2 chips and the January 2026 S3 launch, but independent financial disclosure still trails the valuation narrative, with listed-investor filings showing only RMB 240,704.88 of 2024 revenue and a RMB 190.2 million loss for the main disclosed investment vehicle.
sections:
- id: identity-stage-and-footprint
  title: Identity, Stage, and Operating Footprint
  body: |
    Sunrise positions itself as a Chinese AI inference GPU and full-stack inference infrastructure company rather than a generic training-chip vendor. The official website and about page present the company as an “All-in inference” supplier spanning chips, accelerator cards, servers, clusters, workstations, and a proprietary software stack, with target use cases from public-cloud token factories to finance, telecom, and industrial deployments. Public reporting consistently ties the company's origin to SenseTime's large-chip division: the team began GPU R&D work in 2020 inside SenseTime, then the business was externalized in late 2024 as part of SenseTime's “1+X” restructuring. The current headquarters are publicly listed in Hangzhou, with additional R&D centers in Beijing, Shanghai, Shenzhen, Chengdu, and Zhuhai. Stage labeling is inconsistent across sources—Pre-A, strategic financing, and later “B-round” shorthand all appear—but the April and August 2026 valuations place Sunrise economically in late-stage private-unicorn territory rather than an early venture phase.
