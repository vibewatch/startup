      label: Chip effort begins
      detail: Public sources trace Sunrise's origin to SenseTime's chip division and the disclosed Shanghai Zhenliang lineage starting in 2020.
      tone: neutral
    - date: 2024-12
      label: SenseTime spinout
      detail: SenseTime's “1+X” restructuring externalizes the chip business, with Xu Bing becoming Sunrise chairman.
      tone: positive
    - date: 2025-05
      label: Beijing Li'er investment
      detail: A listed industrial investor discloses RMB 200 million plus related-party RMB 50 million into Shanghai Zhenliang at a RMB 1.5 billion pre-money valuation.
      tone: neutral
    - date: 2025-07
      label: Pre-A round
      detail: Reporting describes nearly RMB 1 billion of new capital for R&D, go-to-market, and team growth.
      tone: positive
    - date: 2025-07
      label: Compute-mall ecosystem
      detail: Sunrise joins SenseTime's heterogeneous compute marketplace at WAIC 2025.
      tone: positive
    - date: '2026-01-22'
      label: Near RMB 3bn strategic financing
      detail: Sunrise says it has completed nearly RMB 3 billion of strategic financing within a year.
      tone: positive
