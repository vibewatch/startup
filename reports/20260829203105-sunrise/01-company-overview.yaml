  evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Full board roster, committee structure, investor-control rights, and preference stack for the post-2026 capital base.
    whyItMatters: Control rights and governance concentration materially affect downside protection and founder/key-person risk.
    diligencePath: Request the latest board list, shareholder agreement, and major investor side-letter summary from management.
    relatedQuestionRefs:
    - QO007
    relatedTableRefs:
    - TO002
    - TO003
  - type: missing-source
    severity: material
    topic: debt-and-liquidity
    missingEvidence: Any debt facilities, vendor financing, government subsidies with conditions, or secondary liquidity executed alongside the equity rounds.
    whyItMatters: Capital structure complexity could materially alter effective dilution, runway, and liquidation outcomes.
    diligencePath: Obtain cap table detail, debt schedule, subsidy agreements, and board approvals for all 2025-2026 financing events.
    relatedQuestionRefs:
    - QO016
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: customer-diversification
    missingEvidence: Named non-investor production customers, purchase quantities, renewal history, and revenue concentration by top customer or partner.
    whyItMatters: The difference between ecosystem publicity and durable external demand is central to underwriting Sunrise as an infrastructure company.
    diligencePath: Request the top-10 customer list, signed production deployments, and cohort history separating pilots, internal parent demand, and recurring external revenue.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO001
  - type: stale
    severity: material
    topic: group-financials
    missingEvidence: Current consolidated 2026 revenue, margin, cash, burn, and working-capital data for the operating group rather than the historical disclosed investee entity.
    whyItMatters: The strongest primary financial evidence is backward-looking and may not represent the current Sunrise perimeter after the spinout and later rounds.
    diligencePath: Request 2025 audited and 2026 year-to-date management accounts for the current operating entities, plus reconciliation to the Beijing Li'er filing perimeter.
    relatedQuestionRefs:
    - QO018
    - QO024
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: minor
    topic: cap-table-reconciliation
    missingEvidence: A clean legal-entity map connecting Shanghai Zhenliang, Hangzhou Xiwang, and the current Zhejiang/Hangzhou operating entities used in 2026 reporting.
    whyItMatters: Entity ambiguity can create confusion around ownership, financial perimeter, and which liabilities or IP rights sit where.
    diligencePath: Collect the legal-entity chart, IP assignment agreements, and post-spinout restructuring documents.
