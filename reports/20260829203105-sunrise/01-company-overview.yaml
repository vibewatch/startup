- id: leadership-governance-and-team
  title: Leadership, Governance, and Team Composition
  body: |
    Leadership concentration is a core part of the Sunrise story. Chairman Xu Bing is a SenseTime co-founder and the executive most visibly linked to the chip division's separation from the listed parent. Operational leadership is split between co-CEOs Wang Yong and Wang Zhan. Wang Yong brings deep semiconductor execution credibility from AMD, Baidu's Kunlun chip effort, and SenseTime's internal chip program, while Wang Zhan brings commercialization and organizational experience from Baidu's founder-era advertising and search stack. Public board disclosure remains thin: the reviewed public materials identify the chairman and co-CEOs, but do not expose a complete independent board roster, committee structure, or investor-control terms. Team-size disclosures also show rapid scaling. Mid-2025 reporting described a roughly 150-person technical core, January 2026 reporting cited a team above 300, and the current official about page says Sunrise now has nearly 500 employees with roughly 80% in R&D and nearly 400 researchers. That trajectory supports the claim of accelerating build-out, but it also signals meaningful key-person and fixed-cost dependence.
