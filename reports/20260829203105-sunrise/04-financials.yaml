- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Current public status
  - Underwriting impact
  - Exact diligence path
  - Priority
  rows:
  - - Recognized revenue by quarter
    - Not publicly disclosed after the 2025 filing
    - Cannot judge scaling velocity or seasonality
    - Request audited quarterly revenue bridge by legal entity and product line
    - Critical
  - - Gross margin by product / solution
    - Not publicly disclosed
    - Cannot test whether LPDDR and token-cost story creates economic value
    - Request BOM, packaging, warranty, and support-cost bridge
    - Critical
  - - Backlog / bookings / pipeline conversion
    - Not publicly disclosed
    - Hardware narrative may overstate monetization if pilots do not convert
    - Request signed backlog, PO conversion, and cancellation data
    - Critical
  - - Cash balance and monthly burn
    - Not publicly disclosed
    - Runway must be inferred from fundraising alone
    - Request current cash, restricted cash, and monthly burn schedule
    - Critical
  - - Inventory and receivables
    - Not publicly disclosed
    - Scale-up could consume cash faster than round headlines imply
    - Request inventory aging and DSO / DPO data
    - High
  - - Customer concentration
    - Not publicly disclosed
    - A few strategic accounts could dominate the business
    - Request top-10 customer share and renewal status
    - High
  - - Warranty / field-service reserves
    - Not publicly disclosed
    - Semiconductor support economics can compress margins after deployment
    - Request reserve policy and historical field-failure data
    - Medium
  - - Software / services mix
    - Not publicly disclosed
    - Valuation multiple depends heavily on recurring or semi-recurring content
    - Request revenue mix by hardware, software, and services
    - High
