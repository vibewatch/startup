- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current public status
  - Quality of proof
  - Diligence ask
  rows:
  - - S1 / S2 / S3 chip and card sales
    - Direct hardware sale into inference deployments
    - Per chip / per card
    - Products are public; S1 and S2 are described as mass produced, S3 launched in 2026
    - 'Medium: hardware availability is evidenced, pricing and booked revenue are not'
    - Provide shipped units by generation, ASP, gross margin, and returns/reserves
  - - Server and appliance sales
    - Bundled servers / all-in-one systems preloaded with software
    - Per server / appliance
    - Official site lists multiple server forms including 2U, 4U, and single-machine DeepSeek systems
    - 'Medium: product forms are public, commercial volume is unknown'
    - Disclose server mix, channel route, and installation revenue recognition
  - - Cluster / supernode delivery
    - SC3-256 and cluster deployment for large-model inference
    - Per rack / supernode / project
    - Official materials position SC3-256 for large-scale MoE inference and turnkey deployment
    - 'Medium: solution exists, but order volume and acceptance criteria are undisclosed'
    - Share signed cluster projects, deployment acceptance milestones, and support obligations
  - - Software stack and migration enablement
    - SIRE, TANG, runtimes, tools, and model adaptation embedded in deals
    - Per deployment or bundled with hardware
    - Official materials stress zero-code migration and framework support
    - 'Low-to-medium: software is clearly part of product, standalone monetization is not disclosed'
    - Clarify whether software is bundled, separately licensed, or monetized through services
  - - Token Factory capacity / MaaS-style delivery
    - Usage-oriented inference capacity with partners for cloud and MaaS operators
    - Per token / capacity commitment / service contract
    - Official Token Factory page suggests metered output and multi-tenant operations
    - 'Low: commercial structure is inferred from positioning rather than disclosed contracts'
    - Provide sample commercial terms, billing basis, and minimum commitments
  - - Vertical solution integration
    - Finance, telecom, manufacturing, entertainment, healthcare, and green-energy deployments with partners
    - Per project / solution package
    - Official industry pages describe complete solution delivery around partner algorithms
    - 'Low-to-medium: demand surface is visible, project economics are not'
    - Show services attachment rate, implementation margin, and repeatability by vertical
  notes: Several streams may be bundled in one contract, so public materials do not reveal how Sunrise separates product, software, and services revenue.
