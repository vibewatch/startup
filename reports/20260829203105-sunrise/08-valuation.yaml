- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: Selected Chinese and global AI-chip references with usable 2025-2026 public valuation, financing, or market-cap data. Coverage is partial because many private domestic peers do not disclose clean revenue denominators or directly comparable valuation terms.
  columns:
  - Comparable
  - Disclosed metric
  - Valuation / status
  - Relevance to Sunrise
  - Limitation
  rows:
  - - Sunrise (subject)
    - 2026 Aug round of ~RMB 2B after Apr round >RMB 1B
    - ~RMB 20B private post-money
    - Direct subject; domestic inference GPU with system-level ambition
    - No public revenue, margin, or concentration denominator
  - - Cambricon
    - 2024 revenue ~RMB 1.174B; 2026-06-30 revenue ~RMB 6.497B
    - ~RMB 659.04B market cap; ~69.18x P/S on 2026-08-28
    - Best public domestic scale fence for AI-chip valuation
    - Much larger, public, and more disclosed than Sunrise
  - - Moore Threads
    - RMB 8B IPO raise target; 2025 9M revenue and loss disclosed
    - Implied pre-debut equity value at least ~RMB 50.7B
    - Closest domestic private-to-public GPU financing pathway
    - Broader GPU scope and materially more prospectus disclosure
  - - NVIDIA
    - Revenue ~US$302.97B and market cap ~US$5.51T
    - Public incumbent scale reference
    - Shows what disclosed commercial leadership looks like in inference compute
    - Not a startup pricing comp
  - - AMD
    - Market cap ~US$778.15B
    - Public incumbent scale reference
    - Useful second incumbent fence for disclosed-scale compute valuation
    - Not a startup pricing comp and business mix is broader
  notes: This table is for price discipline, not mechanical multiple transfer. Sunrise should be compared to these names for disclosure quality, capital access, and scale fences, not treated as if it automatically deserves their valuation logic.
