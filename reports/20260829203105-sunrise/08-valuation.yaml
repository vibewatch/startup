- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Inference positioning
    - 'Sunrise is focused on a real bottleneck: domestic, lower-cost inference deployment'
    - Inference specialization can still lose if customers prefer broader training-plus-inference platforms
    - Show neutral S3 benchmark wins on production workloads
  - - Financing momentum
    - Repeated 2026 rounds signal strong investor belief in the roadmap
    - Fast mark-ups can outrun public operating proof
    - Disclose revenue, margin, and repeat-order metrics
  - - Customer proof
    - Youzu and ecosystem integrations show practical workflow relevance
    - Current proof is still partner-heavy and narrower than valuation-grade commercialization evidence
    - Add multiple named external production customers with deployment depth
  - - Policy tailwind
    - Export controls and domestic compute policy can raise the value of local alternatives
    - The same policy backdrop can increase supply-chain friction and competitor funding
    - Show resilient sourcing and share gains versus peers
  - - Capital-market optionality
    - Peer IPO activity suggests later exit windows exist for domestic GPU stories
    - Peers that tap public markets disclose much more than Sunrise currently does
    - Publish prospectus-grade KPI set or equivalent diligence package
  - - Price discipline
    - RMB 20B is not absurd in category context
    - RMB 20B still looks full versus the current evidence set
    - Either lower the price or improve evidence quality materially
  notes: The anti-thesis is not that Sunrise lacks technical merit. It is that the latest price gets ahead of what the public record can underwrite cleanly.
