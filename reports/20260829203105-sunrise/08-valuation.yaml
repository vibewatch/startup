- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Financing reset
    - Next primary round clears below current mark or with heavy protection/preference terms
    - Shows narrative value is above market-clearing price
    - Re-cut valuation toward bear/base and slow or stop new money
  - - Customer-proof stagnation
    - No broader external production customers beyond partner-mediated examples by next major round
    - Undercuts commercialization assumptions inside the current mark
    - Hold off on underwriting premium multiple expansion
  - - S3 execution miss
    - Material scale-out slip, delayed production, or weak neutral benchmark evidence
    - Damages the core inference-economics premium narrative
    - Move case toward bear and revisit technical diligence
  - - Disclosure remains thin
    - Still no revenue, gross margin, or concentration disclosure through next financing window
    - Prevents confidence from improving despite rising mark
    - Require stronger rights, lower price, or walk away
  - - Policy / supply shock
    - Export-control or supply changes materially disrupt roadmap assumptions
    - Turns strategic-autonomy tailwind into execution drag
    - Re-evaluate sourcing, timing, and valuation haircut
  - - Concentration surprise
    - A few customers or related-party channels dominate demand without diversification plan
    - Raises fragility and lowers quality of the revenue story
    - Discount valuation and prioritize concentration diligence
  notes: Kill triggers are designed to be monitorable and investment-relevant rather than generic risk labels.
  claimRefs:
  - CV038
  - CV039
  - CV040
  - CV043
  - CV044
  - CV045
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue and customer mix
    - Current revenue, top-customer share, product mix, and repeat-order data
    - Without the denominator, valuation cannot be tested cleanly
    - Request data room revenue bridge and customer concentration schedule
  - - Gross margin and BOM
    - Chip-level and system-level gross margin, memory and packaging cost exposure
    - Inference-cost claims matter only if they survive hardware economics
    - Review BOM, gross-margin bridge, and pricing waterfall
  - - Cap table and preference stack
    - Option pool, liquidation preferences, participating rights, and recent secondary or 409A marks
    - Simple gross-return math can be badly misleading without structure terms
    - Obtain current cap table and financing documents
  - - Customer validation
    - Named external production customers, deployment size, and re-order cadence
    - Separates partner-assisted proof from durable commercialization
    - Conduct customer calls and confirm live deployment references
  - - S3 technical proof
    - Neutral same-workload benchmark data, uptime, and deployment evidence
    - The premium thesis depends on real production inference economics
    - Run third-party technical diligence on actual deployments
  - - Supply and policy dependencies
    - Foundry, packaging, memory, and export-control sensitivity map
    - Strategic tailwinds can reverse if supply assumptions are fragile
    - Map critical suppliers and obtain legal/export-control memo
  notes: These asks are the minimum package needed to move from a watch posture to an investable underwriting call.
