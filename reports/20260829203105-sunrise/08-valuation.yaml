- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Proof-state assumption
  - Valuation logic
  - Implied valuation range
  - Probability signal
  - Key trigger
  rows:
  - - Bear
    - S3 scale-out slips, public customer proof remains partner-led, and financing terms reset
    - IP, team, and domestic-stack option value but weaker commercialization confidence
    - RMB 8B-12B
    - 25%
    - Down-round, heavy preferences, or weak benchmark evidence
  - - Base
    - Roadmap stays intact, some named deployments broaden, and financing remains available while metrics stay mostly private
    - Milestone progress supports a band around but not clearly above the current mark
    - RMB 14B-20B
    - 50%
    - Commercial progress without enough disclosure to justify premium expansion
  - - Bull
    - Broader external customer validation, clearer unit economics, and smoother S3 scale deployment
    - Domestic inference leadership narrative becomes more underwritten and less speculative
    - RMB 24B-32B
    - 25%
    - Multiple external production wins and revenue-quality disclosure
  - - Probability-weighted midpoint
    - Blend of the three states above
    - Public-evidence center of gravity
    - RMB 15B-19B
    - 100%
    - Useful discipline check versus the current RMB 20B mark
  notes: These are scenario ranges in RMB billions derived from milestone states, not disclosed company guidance or a formal fairness opinion. Precision is intentionally limited because Sunrise does not publicly disclose the denominator metrics required for tighter valuation math.
