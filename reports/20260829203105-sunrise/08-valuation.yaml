- id: exit-readiness-and-final-diligence
  title: Exit readiness, thesis-breaks, and final diligence asks
  body: 'Public evidence supports Sunrise as strategically important earlier than it supports Sunrise as exit ready. Domestic peer IPO activity proves there is a capital-market pathway for Chinese AI-chip companies, and the policy environment can accelerate that pathway. But those peers also disclose more operating data once they approach public capital. Sunrise does not yet. That makes a near-term IPO-style underwriting case hard to support from public materials alone. A later private round, structured downside protection, or strategic transaction after more commercialization proof is easier to justify today.


    The kill criteria follow directly from that disclosure gap. If S3 slips materially, if customer proof stays concentrated in partner-mediated examples, or if the next financing clears below today’s mark or with heavy protective terms, the current thesis should be re-cut downward. Conversely, if Sunrise discloses repeat-order evidence, gross-margin structure, customer concentration, and neutral benchmark data, the recommendation could improve quickly. The remaining work is therefore concrete, not philosophical: obtain the denominator metrics that turn an admired strategic narrative into an underwritten valuation case.'
