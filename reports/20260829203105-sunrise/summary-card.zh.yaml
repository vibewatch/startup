  topStrengths:
    - Sunrise 已经有 S1、S2、S3 和 Token Factory 等真实产品面，而不只是纯架构故事。
    - 作为年轻的中国推理芯片 spinout，公司融资势能少见，说明投资人兴趣和战略相关性仍在。
    - 国产推理部署、云端服务，以及主权或受监管 AI 基础设施的本土需求，和公司定位高度同频。
    - 公开证据显示，公司围绕芯片、系统和部署流程形成了自洽的全栈定位；如果商业化扩宽，战略价值可以更高。
  topRisks:
    - 没有当前公开收入、毛利率或自由现金流披露，常规后期估值数学还撑不起 RMB 20B。
    - 客户证据仍偏窄且伙伴色彩重，集中度、复购深度和续约质量都未解。
    - 如果 S3 扩展或基准测试不及预期，产品、融资和政策风险可能快速叠加。
    - 股权结构、清算优先权和下行保护未披露，简单回报测算可能误导。
    - 公开可比公司说明中国 GPU 挑战者仍能拿到资本，但也把披露门槛抬得比 Sunrise 目前更高。
  unresolvedGaps:
    - 当前收入、ARR 和分部结构在保留公开来源中未披露。
    - 毛利率、BOM 敏感性、芯片与系统经济性仍未披露。
    - 客户集中度、复购节奏和留存指标公开不可见。
    - 股权结构、清算优先权、期权池，以及近期任何老股或 409A 标记均未公开。
    - 中立同负载 S3 基准测试和生产部署证据仍不完整。
