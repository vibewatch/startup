- calloutType: risk
  title: The biggest Sunrise risk is compounded opacity, not one isolated headline
  body: Sunrise may be right on product direction, but investors still lack the neutral benchmark, repeat-customer, and margin data needed to separate a technically promising platform from a capital-intensive narrative. That opacity compounds other risks because it delays correction until after product, customer, or financing problems become more visible.
  claimRefs:
  - CR004
  - CR005
  - CR006
  - CR031
- calloutType: recommendation
  title: Monitor Sunrise as a milestone-dependent risk curve
  body: 'The next phase of diligence should focus on a small number of de-risking proofs: independent S3 production benchmarks, broader non-affiliate customer wins, repeat-order evidence, clearer entity-level disclosure, and even partial gross-margin transparency. If those arrive, Sunrise’s risk profile can improve quickly; if they do not, the valuation story becomes harder to defend.'
