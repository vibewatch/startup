- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - S3 commercialization delay
    - Shipment / deployment evidence stalls
    - No broader production proof or new named production win by the next financing cycle
    - Re-underwrite execution and reduce valuation tolerance
  - - Customer-proof stagnation
    - Named customers do not expand beyond current small set
    - No second-wave non-affiliate proof and no reorder evidence
    - Treat customer concentration as thesis-breaking
  - - Financial opacity persists
    - Revenue, margin, and burn remain undisclosed despite higher valuation
    - No audited or board-grade disclosure package during diligence
    - Do not underwrite current mark
  - - Regulatory tightening widens
    - New export or compliance rules hit equivalent compute or supply assumptions
    - Meaningful sourcing or deployment constraints emerge
    - Increase discount rate and reassess feasible market
  - - Operational reliability disappoints
    - Field issues, support problems, or benchmark reversals surface
    - Any material production rollback or unresolved reliability failure
    - Pause conviction on system-scale thesis
  - - Down-round or punitive financing signal
    - New financing implies weak leverage despite prior momentum
    - Inside round, punitive terms, or emergency bridge financing
    - Treat as evidence that commercialization is lagging ambition
  notes: These triggers are designed to be monitorable during diligence and subsequent portfolio monitoring, not just descriptive risk labels.
