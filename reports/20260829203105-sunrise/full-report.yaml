      - number: '3.2'
        title: 'Peer Profiles: Scale, Product Scope, and Strategic Direction'
        blocks:
          - type: paragraph
            body: >-
              On publicly disclosed scale, Sunrise is still the smallest proof set among serious contenders. Cambricon
              already reports multibillion-renminbi revenue, profit, and a broad cloud-edge-cluster footprint. Moore
              Threads and MetaX have demonstrated that public-equity investors will fund domestic GPU stories at scale
              even before the category fully matures, while Biren’s Hong Kong listing track and Kunlunxin’s proposed
              spin-off suggest that several peers can access fresh capital, broaden governance visibility, and finance
              the next R&D cycle. Huawei, meanwhile, competes less as a single chip and more as an integrated platform
              combining clusters, software architecture, and enterprise reach.


              The strategic asymmetry is important. Sunrise’s narrower inference-only position can be an advantage where
              customers want lower token cost and do not need the widest training roadmap. But it also leaves Sunrise
              competing against firms with broader budgets, larger field organizations, deeper software ecosystems, and
              more visible customer references. Cambricon’s cluster-system business challenges Sunrise’s “full-stack”
