      - number: '2.4'
        title: Growth Drivers, Constraints, and the Remaining Market Gaps
        blocks:
          - type: paragraph
            body: >
              The demand case is straightforward. Omdia and IDC both argue that inference is broadening beyond
              frontier-model training into agentic, reasoning, orchestration, and industry deployment workloads. That
              expands the number of buyers who need repeated inference rather than occasional model training. China
              policy further supports domestic build-out through compute-network investment, telecom-focused AI
              deployment guidance, and interconnection plans. But these tailwinds do not eliminate execution risk. The
              same market sources emphasize that power and grid access now slow data-center commissioning, AI-factory
              build-outs are becoming heavily capital-intensive, and HBM, advanced packaging, and leading-node
              constraints persist through at least 2027. U.S. BIS rules continue to shape China’s access to advanced
              semiconductors, while Nvidia continues to push down token-cost claims through hardware-plus-software
              integration.


              For Sunrise, the result is a market that is undeniably large but structurally competitive. The unanswered
              questions are not whether inference demand exists, but how much of it Sunrise can serve with domestic
              supply, what share of procurement requires the specific LPDDR-centric design point, and whether public
              evidence will eventually show real customer budgets rather than only macro tailwinds.
