  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, valuation context, and the core call
        blocks:
          - type: paragraph
            body: >-
              Sunrise is easy to take seriously and hard to price with conviction from public evidence alone. The
              company is real: it came out of SenseTime’s chip effort, has a visible inference-GPU roadmap across S1,
              S2, and S3, and has attracted repeated financing in 2026 from recognizable Chinese capital sources. The
              latest August round at roughly RMB 20B post money therefore did not appear out of nowhere. It followed an
              April mark above RMB 10B and earlier strategic financing around the S3 and ecosystem build-out.


              The problem is not whether Sunrise exists or whether investors care. The problem is the denominator. The
              retained public corpus still does not disclose revenue, ARR, gross margin, repeat-order behavior, customer
              concentration, or cap-table terms. That means outsiders can verify a fast-rising valuation story without
              being able to test whether the price is cheap, fair, or already demanding. On that evidence, the right
              present-tense call is watch: keep diligence active because the product and strategic-autonomy thesis are
              credible, but do not underwrite RMB 20B as an obvious value entry until disclosure quality improves or
              price discipline gets better.
