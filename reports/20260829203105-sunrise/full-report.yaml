      - number: '2.2'
        title: Evidence-Constrained Sizing Through Multiple Lenses
        blocks:
          - type: paragraph
            body: >
              Public market sizing for Sunrise exists only through proxies. IDC estimates global AI infrastructure
              spending at about $89.9 billion in Q4 2025, $318 billion for full-year 2025, and roughly $89.7 billion
              again in Q1 2026, with a full-year 2026 forecast of $497 billion and more than $1 trillion by 2029. Omdia
              adds two adjacent lenses: over $600 billion of AI-infrastructure capex from leading technology enterprises
              in 2026, and an AI data-center chip market expanding from $123 billion in 2024 to $207 billion in 2025 and
              $286 billion by 2030. Those are useful upper bounds, but they remain broad. They include regions and
              spending pools Sunrise cannot reach, and they cover training, networking, and infrastructure segments much
              wider than inference GPUs.


              The most relevant China-specific lens is policy-linked infrastructure. Xinhua, citing the NDRC, says
              China’s computing-power networks could attract RMB 4 trillion of new direct investment during 2026-2030.
              That figure is still too broad to call Sunrise’s TAM, but it does confirm a large sovereign and industrial
              build-out backdrop. The right diligence posture is to treat Sunrise’s practical market as a discounted
              slice of those broader figures, concentrated in domestic inference procurement where localized supply,
              TCO, and software portability matter.
