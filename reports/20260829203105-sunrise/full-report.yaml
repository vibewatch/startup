  - id: FO002
    title: Sunrise company snapshot logic
    type: flow
    layout: standard
    summary: >-
      Sunrise's value proposition connects SenseTime-origin engineering, an inference-specific roadmap, and vertical
      solutions, but loops back into capital dependence and commercialization proof risk.
    data:
      nodes:
        - id: origin
          label: SenseTime-origin chip team
          detail: R&D origins inside SenseTime from 2020, with independent spinout in late 2024.
          tone: positive
        - id: leadership
          label: Xu Bing / Wang Yong / Wang Zhan
          detail: Leadership combines parent-company access, deep chip execution, and commercialization experience.
          tone: positive
        - id: s1
          label: S1 mass production
          detail: First-generation cloud-edge inference chip with third-party shipment claims above 20,000 units.
          tone: positive
        - id: s2
          label: S2 scale deployment
          detail: General inference GPGPU plus cards and servers for large-model inference and cluster use.
          tone: positive
        - id: s3
          label: S3 inference wedge
          detail: LPDDR6, PCIe Gen6, FP4-16, long-context and token-economics positioning.
          tone: positive
        - id: solutions
          label: Vertical solutions
          detail: Token factory, finance, manufacturing, and telecom solutions widen addressable monetization paths.
          tone: positive
        - id: ecosystem
          label: Ecosystem links
          detail: News-page milestones include FlagOS, 4Paradigm, TileLang, Youzu, and SenseTime compute mall.
          tone: neutral
        - id: capital
          label: Rapid financing cadence
          detail: Funding rose from RMB 1.5bn disclosed valuation in May 2025 to ~RMB 20bn post-money by Aug 2026.
          tone: positive
        - id: headcount
          label: Team scaling
          detail: Public disclosures moved from ~150 technical staff in 2025 to nearly 500 total staff on the official site.
          tone: neutral
        - id: revenue-gap
          label: Disclosure gap
          detail: Latest primary disclosed-entity financials still show tiny revenue and large losses.
          tone: negative
        - id: governance-gap
          label: Governance opacity
          detail: No full public board roster, preferences, debt, or customer-concentration disclosure.
          tone: negative
        - id: thesis
          label: Diligence hinge
          detail: >-
            Investment case depends on whether S3 delivery and token economics convert into repeat external customer
            revenue.
          tone: warning
      edges:
