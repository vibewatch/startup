companyProfile:
  summary: >-
    Sunrise is a Chinese AI inference infrastructure company spun out of SenseTime's chip division in late 2024. Public
    sources support a coherent product story across the S1 and S2 inference chips, the January 2026 S3 launch, and Token
    Factory software for cloud, MaaS, and enterprise deployment. Financing momentum is also strong: public reporting
    points to strategic financing near RMB 3B in January 2026, an April round above RMB 1B at a valuation above RMB 10B,
    and an August round of roughly RMB 2B at about RMB 20B post money. What remains missing is the valuation
    denominator. The retained public corpus still does not disclose current revenue, gross margin, customer
    concentration, repeat-order data, or cap-table terms clearly enough to underwrite the company like a mature
    late-stage infrastructure business.
