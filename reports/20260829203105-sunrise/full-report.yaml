  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Surfaces
        blocks:
          - type: paragraph
            body: >-
              Sunrise's official materials describe several monetization surfaces, but only part of the revenue model is
              directly evidenced. At the hardware layer the company sells or deploys inference GPUs, accelerator cards,
              servers, and cluster-scale systems spanning S1, S2, S3, and SC3-256-class offerings. At the software and
              systems layer it presents SIRE, TANG, AIOS-style preinstalled systems, and Token Factory orchestration as
              part of a full-stack delivery model rather than as a bare-chip business. That matters financially because
              Sunrise is not trying to monetize one SKU. It appears to monetize a bundle: silicon, packaged systems,
              software compatibility, deployment engineering, and in some cases managed or meterable inference capacity.


              The most interesting signal is Token Factory. The official Token Factory page frames inference as a
              serviceable, metered output—"making tokens as accessible as utilities"—for public cloud, private cloud,
              MaaS operators, and national compute centers. In financial terms, that suggests Sunrise could earn revenue
              through several channels: one-time hardware sales, system integration revenue, software-enabled solution
              delivery, cluster deployment fees, and possibly capacity-based or usage-based commercial structures with
              partners. But public evidence still stops short of disclosing mix, pricing realization, contract duration,
              payment terms, or whether Sunrise books revenue mainly as product sales, project delivery, or recurring
              service fees. The right takeaway is that the revenue architecture is broad enough to support upside, yet
              still too opaque to underwrite quality without customer-level data.
