      - number: '8.2'
        title: Comparable set and price discipline
        blocks:
          - type: paragraph
            body: >-
              The most useful comparable set is mixed by design. Cambricon is the clearest public Chinese AI-chip
              reference because it already discloses revenue and trades at a very large market capitalization, but that
              scale makes it a fence rather than a clean private-market pricing comp. NVIDIA and AMD perform the same
              function globally: they show what enormous disclosed-scale incumbents look like, not what an opaque
              private challenger should automatically trade on. The more helpful domestic financing comparison is Moore
              Threads. Its public-market path demonstrates that China can fund GPU stories aggressively even before
              profitability, but it also demonstrates that investors eventually demand prospectus-grade operating
              disclosure.


              That is why Sunrise’s RMB 20B mark should be read carefully. It is materially below Moore Threads’ implied
              IPO capitalization and far below Cambricon’s public value, so the price is not absurd on category or
              sovereignty logic. But Sunrise also discloses much less than either. The present comp conclusion is
              therefore disciplined rather than promotional: Sunrise deserves a place in the investable watchlist, yet
              its current mark already asks investors to pay ahead of public commercial proof.
