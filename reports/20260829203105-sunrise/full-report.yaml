      - number: '3.3'
        title: Capability, Packaging, Pricing Visibility, and Switching Cost
        blocks:
          - type: paragraph
            body: >-
              Capability comparisons in this market are hard because vendors optimize for different jobs and rarely
              publish neutral head-to-head pricing. Sunrise emphasizes inference-only design, LPDDR6 memory strategy,
              and compatibility with mainstream frameworks and serving engines. Moore Threads markets training,
              inference, and HPC coverage with FP8-through-FP64 support and a near-zero migration message through MUSA.
              Huawei couples hardware with CANN. NVIDIA layers chips, clusters, and inference software into a powerful
              incumbent bundle. Kunlunxin pitches DeepSeek adaptation and one-click deployment. In other words, buyers
              are not comparing a spec sheet alone; they are comparing the difficulty of getting a real workload into
              production.


              That is why switching cost is as important as raw silicon performance. If Sunrise can make PyTorch, vLLM,
              and SGLang migration genuinely low-friction, then its narrower architecture can still compete effectively.
              If not, customers can keep renting Nvidia-backed infrastructure, adopt a broader domestic platform, or
              apply software optimization before changing vendors. Public price transparency is thin across domestic
              chips, so the practical buyer decision path relies on pilots, workload fit, serviceability, and bundle
              economics. Sunrise’s thesis is strongest where those comparisons are made at the token, server, or cluster
              level rather than at the broad training-platform level.
