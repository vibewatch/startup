      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Inference demand is real enough that Sunrise does not need to invent the macro tailwind
            body: >
              IDC, Omdia, and the IEA all point in the same direction: AI infrastructure has moved from experimentation
              to industrial-scale capital commitment, and inference is expanding as agentic and reasoning workloads
              multiply token demand. Sunrise therefore benefits from a real market shift even if its own revenue proof
              is still limited.
            calloutType: strength
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM013
              - CM021
          - type: callout
            title: Headline AI-market numbers are directionally useful but dangerous as Sunrise TAM shortcuts
            body: >
              The broadest numbers—US$497B of 2026 AI infrastructure, US$600B+ of AI-factory capex, or RMB 4T of China
              compute-network investment—are far too wide to call Sunrise's addressable market. They include regions,
              workloads, and infrastructure layers that Sunrise cannot or does not target. Any valuation that multiplies
              Sunrise by those macro totals without heavy filtering is overstating the company's true market capture
              opportunity.
            calloutType: risk
            claimRefs:
              - CM002
              - CM008
              - CM024
              - CM039
          - type: callout
            title: >-
              China policy is a tailwind, but it also means Sunrise sells into procurement-heavy and politically crowded
              markets
            body: >
              China's compute-network and AI-telecom policies validate demand for localized infrastructure, but they do
              not guarantee Sunrise a clear lane. The same policy environment supports state-backed competitors,
              carrier-linked platforms, and regional compute operators, which can intensify pricing pressure even while
              total demand rises.
