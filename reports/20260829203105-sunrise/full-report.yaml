      - number: '4.4'
        title: Capital Adequacy and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              On capital adequacy, Sunrise looks far stronger than its sparse financial disclosure might otherwise
              suggest. Public reporting indicates the company raised around RMB 1B in mid-2025, nearly RMB 3B in January
              2026, another 10B+ valuation round in April 2026, and RMB 2B more in August 2026, bringing cumulative
              disclosed financing close to RMB 6B since the late-2024 spinout. Management and media both say those
              proceeds are earmarked for next-generation inference-GPU R&D, scaled production, and ecosystem build-out.
              That should be enough to keep the company moving through the next product cycle, particularly relative to
              less-funded domestic startups.


              However, "adequate capital" is not the same as "de-risked capital need." Sunrise still sits in a part of
              the stack where hardware inventory, software adaptation, packaging, cluster delivery, and customer proof
              all absorb cash before recurring economics are visible. There is no public cash-balance disclosure, no
              burn-rate disclosure, no debt schedule, and no working-capital bridge. As a result, the right financial
              verdict is neither bullish extrapolation nor dismissal. Sunrise appears financeable and strategically
              relevant, but the public record still supports only a conditional underwriting posture: assume continued
              financing dependency until management can show revenue quality, margin progression, and repeatable
              customer receipts. In venture terms, the company has probably solved the "can it raise?" question for now,
              but not yet the "does scale create durable economics?" question.
