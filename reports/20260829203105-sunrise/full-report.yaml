      - number: '8.3'
        title: Bull, base, and bear valuation ranges
        blocks:
          - type: paragraph
            body: >-
              Because Sunrise does not publicly disclose the metrics needed for a conventional late-stage growth model,
              the scenario work here is milestone based. The bear case assumes Sunrise remains strategically relevant
              but fails to convert that relevance into broad, externally verifiable commercialization. In that state,
              the company could still be valuable for its team, IP, and domestic-stack optionality, but the
              market-clearing valuation would likely drift into a substantially lower band.


              The base case assumes Sunrise continues to ship, the S3 roadmap stays intact, and public customer proof
              improves somewhat, but not enough to erase uncertainty around revenue quality or margin structure. That
              case supports a band around today’s mark rather than a clear premium to it. The bull case requires
              something stronger: multiple external customer validations, more transparent unit economics, and evidence
              that Sunrise can scale inference deployment without undermining its token-cost thesis. Under that lens,
              the current valuation does not look impossible. It looks full. New money can earn strong returns from RMB
              20B only if execution pulls Sunrise quickly toward the bull-state evidence set.
            claimRefs:
