              The next phase of diligence should focus on a small number of de-risking proofs: independent S3 production
              benchmarks, broader non-affiliate customer wins, repeat-order evidence, clearer entity-level disclosure,
              and even partial gross-margin transparency. If those arrive, Sunrise’s risk profile can improve quickly;
              if they do not, the valuation story becomes harder to defend.
