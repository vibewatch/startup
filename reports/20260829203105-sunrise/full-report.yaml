  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape Boundaries, Competitor Classes, and the Real Comparison Set
        blocks:
          - type: paragraph
            body: >-
              Sunrise does not compete against a single monolithic “GPU market.” The realistic competitive field is
              layered. The first layer is direct domestic AI-chip peers that can sell into Chinese inference and
              sovereign-compute programs: Cambricon, Moore Threads, Kunlunxin, Huawei Ascend, Biren, MetaX, and other
              emerging accelerators. The second layer is incumbent global platforms—above all NVIDIA—that still define
              performance, ecosystem expectations, and the status-quo deployment model even when export controls
              constrain direct access. The third layer is substitute infrastructure: rented GPU clouds and software
              serving stacks such as vLLM that let buyers postpone hardware switching by extracting more throughput from
              existing deployments.


              That boundary matters because Sunrise is differentiated less by trying to beat every rival on training
              scale and more by narrowing the job to inference economics. Its official materials repeatedly center token
              cost, private deployment, and migration-friendly tooling. Many rivals do something broader. Cambricon and
              Huawei sell platform breadth. Moore Threads markets a universal GPU spanning training, inference,
              rendering, and HPC. Kunlunxin, under Baidu’s umbrella, presents a full hardware-software AI-computing
              system with named bank wins. Biren and MetaX demonstrate that additional Chinese GPU entrants are reaching
              capital markets and will compete for the same policy-favored domestic demand. The right comparison set is
              therefore not “Sunrise versus global AI spending,” but Sunrise versus the mix of domestic platforms,
              global incumbents, and substitute stacks that can solve the same inference job.
            claimRefs:
              - CP001
              - CP006
              - CP009
              - CP014
              - CP020
              - CP027
              - CP035
