  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segment Map and Buyer / User / Payer Roles
        blocks:
          - type: paragraph
            body: >-
              Sunrise’s official materials make the segment map fairly clear even when the commercial evidence is
              incomplete. The company explicitly targets public and private cloud providers, AI MaaS operators, and
              national or regional compute-center operators through Token Factory. It also markets sector-specific
              deployments in finance, telecom, manufacturing, entertainment, healthcare, and green energy. Those segment
              labels matter because the buyer, user, and payer are not the same across them. In cloud and MaaS settings
              the buyer is likely a platform or infrastructure owner, the user is an operations or model-serving team,
              and the payer is a capital-budget owner optimizing utilization and token economics. In regulated
              enterprise settings the buyer is more likely a CIO, digital-transformation group, or line-of-business
              sponsor, while the user is a workflow or AI team and the payer sits inside a compliance-sensitive budget.


              This segmentation suggests Sunrise is not pursuing a consumer-like customer motion. It is pursuing a
              design-partner and infrastructure-adoption motion where solution fit, data control, performance
              portability, and deployment services matter as much as silicon. That broadens the potential market, but it
              also means the company must prove repeatability across a small number of complex buyer archetypes rather
              than a large number of small accounts.
