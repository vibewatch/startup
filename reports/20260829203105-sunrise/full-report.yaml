            title: The biggest Sunrise risk is compounded opacity, not one isolated headline
            body: >-
              Sunrise may be right on product direction, but investors still lack the neutral benchmark,
              repeat-customer, and margin data needed to separate a technically promising platform from a
              capital-intensive narrative. That opacity compounds other risks because it delays correction until after
              product, customer, or financing problems become more visible.
