  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The recommendation flows from real financing and product credibility through missing denominator metrics to a
      watch stance at the current mark.
    data:
      nodes:
        - id: n1
          label: Real financing
          detail: Multiple 2026 rounds culminating near RMB 20B post-money
        - id: n2
          label: Credible roadmap
          detail: S1/S2 production narrative and S3 inference positioning are public and coherent
        - id: n3
          label: Disclosure gap
          detail: No public revenue, margin, repeat-order, or concentration denominator
        - id: n4
          label: Mixed comp set
          detail: Peers and incumbents prove scale fences, not clean private pricing transfer
        - id: n5
          label: Scenario midpoint
          detail: Public evidence centers slightly below the latest mark
        - id: n6
          label: Watch / full
          detail: Stay engaged, but require better proof or better price
      edges:
        - from: n1
          to: n2
          label: supports attention
        - from: n2
          to: n5
          label: creates option value
        - from: n3
          to: n5
          label: blocks precision
        - from: n4
          to: n5
          label: forces discipline
        - from: n5
          to: n6
          label: defines stance
    approximationNotes: Decision-logic compression of the chapter, not a causal operating model.
    claimRefs:
