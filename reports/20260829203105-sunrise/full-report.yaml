            body: >-
              Public adoption evidence for Sunrise is stronger on deployment readiness than on customer-count
              disclosure. Trade and company-adjacent sources say Sunrise chips had surpassed 10,000 deliveries by early
              2026, S1 and S2 were already mass produced, and the company had moved into larger cluster and supernode
              positioning. That is meaningful because it suggests more than one lab demo. At the same time, delivered
              chips are not the same as active, revenue-generating customers. The public record does not say how many
              organizations those units map to, what proportion are internal ecosystem deployments versus external
              customers, or how much of the footprint has moved from pilot to scaled production.


              The strongest adoption signals therefore come from named relationships rather than aggregate numbers.
              Youzu publicly describes concrete use cases around AIGC content production, real-time inference-engine
              optimization, and private compute clusters for game R&D. SenseTime’s 算力Mall shows Sunrise participating
              inside a broader domestic compute ecosystem. Fourth Paradigm’s ModelHub XC adaptation shows Sunrise
              appearing in a model-adaptation workflow rather than only in raw infrastructure messaging. Those are
              genuine signs of market pull, but they still fall short of a wide public customer base with quantified
              retention or annual spend.
