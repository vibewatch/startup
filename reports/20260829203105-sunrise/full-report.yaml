figures:
  - id: FO001
    title: Sunrise corporate milestone timeline
    type: timeline
    layout: standard
    summary: >-
      From SenseTime incubation to the 2026 S3 launch and RMB 20 billion valuation step-up, Sunrise's public story is a
      sequence of tightly spaced capital and product milestones.
    data:
      items:
        - date: 2020-05
          label: Chip effort begins
          detail: >-
            Public sources trace Sunrise's origin to SenseTime's chip division and the disclosed Shanghai Zhenliang
            lineage starting in 2020.
          tone: neutral
        - date: 2024-12
          label: SenseTime spinout
          detail: SenseTime's “1+X” restructuring externalizes the chip business, with Xu Bing becoming Sunrise chairman.
          tone: positive
        - date: 2025-05
          label: Beijing Li'er investment
          detail: >-
            A listed industrial investor discloses RMB 200 million plus related-party RMB 50 million into Shanghai
            Zhenliang at a RMB 1.5 billion pre-money valuation.
          tone: neutral
        - date: 2025-07
          label: Pre-A round
          detail: Reporting describes nearly RMB 1 billion of new capital for R&D, go-to-market, and team growth.
          tone: positive
        - date: 2025-07
          label: Compute-mall ecosystem
          detail: Sunrise joins SenseTime's heterogeneous compute marketplace at WAIC 2025.
          tone: positive
        - date: '2026-01-22'
          label: Near RMB 3bn strategic financing
          detail: Sunrise says it has completed nearly RMB 3 billion of strategic financing within a year.
          tone: positive
        - date: '2026-01-27'
          label: S3 launch
          detail: The company launches Qiwang/启望 S3, SC3-256 supernode, and an inference-cloud plan in Hangzhou.
          tone: positive
        - date: '2026-04-20'
          label: RMB 1bn+ round
          detail: >-
            Multiple outlets report a round above RMB 1 billion that takes cumulative funding to about RMB 4 billion and
            valuation above RMB 10 billion.
          tone: positive
        - date: 2026-04
          label: Unicorn positioning
          detail: Investor-aligned sources begin describing Sunrise as China's first pure-inference GPU unicorn.
          tone: neutral
        - date: '2026-08-12'
          label: Packaging-center plan
          detail: Sunrise, Youzu, and Kangying announce a proposed 2.5D/3D advanced-packaging center in Wuxi.
          tone: neutral
        - date: '2026-08-28'
          label: RMB 2bn round
          detail: Caixin and Tencent report a new RMB 2 billion financing at roughly RMB 20 billion post-money.
          tone: positive
        - date: 2026-08
          label: Visibility, but not full disclosure
          detail: >-
            Official news items show ecosystem progress, yet public materials still lack audited ARR, customer count,
            and broader governance detail.
          tone: negative
    approximationNotes: >
      Timeline dates mix exact dated articles with month-level public milestones. Financing steps after the May 2025
      Beijing Li'er filing rely on company or media reporting rather than public offering documents.
