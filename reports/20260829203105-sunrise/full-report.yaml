        title: Public Traction Versus Financial Proof
        blocks:
          - type: paragraph
            body: >-
              The central financial tension in Sunrise is that its capital-market narrative has moved much faster than
              its publicly disclosed operating numbers. The most concrete entity-level evidence comes from Beijing
              Li'er's May 2025 filing on Shanghai Zhenliang, which reported only RMB 240,704.88 of 2024 revenue, a net
              loss of RMB 190.2M, and zero Q1 2025 revenue with another RMB 22.9M quarterly loss. Those numbers predate
              the formal Sunrise brand rollout and later financing surge, so they should not be treated as a full
              picture of the post-spinout business. But they are still important because they show the starting point
              was effectively pre-scale.


              Subsequent media coverage documents rapid product and financing progress: two mass-produced generations,
              over 10,000 chips delivered by January 2026, mass-production claims for S1 and S2, and a far larger August
              2026 financing round at a roughly RMB 20B valuation. Even so, Sunrise has not publicly disclosed backlog,
              recognized revenue, gross margin, ASPs, utilization, receivables, inventory turns, or customer
              concentration. That leaves investors in a familiar semiconductor trap: evidence of technical ambition and
              fundraising strength without enough audited commercialization detail. Financially, the company may be
              progressing from engineering to early scale, but the proof available to outsiders remains much closer to
              "promising but unverified" than to "underwritten growth platform."
