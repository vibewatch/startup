          detail: Cards, servers, or clusters go live in a real workflow
        - id: f5
          label: Scaled production
          detail: Account expands compute footprint or workload scope
        - id: f6
          label: Repeat orders / durable usage
          detail: Publicly missing stage that Sunrise still needs to evidence
