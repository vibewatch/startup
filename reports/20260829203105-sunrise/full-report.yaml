      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Inference specialization is a real strategic choice, not a last-minute marketing relabel
            body: >
              Sunrise's sources show a consistent pattern: S1 and S2 were already inference-oriented before S3 made
              “All-in inference” the center of the company story. That continuity matters. It suggests the company has
              spent multiple product generations learning where long-context, multi-round, and KV-cache-heavy workloads
              break generic GPU economics. If real customer deployments validate the token-cost claims, Sunrise could
              own a narrower but very relevant part of the Chinese AI infrastructure stack.
            calloutType: strength
            claimRefs:
              - CO013
              - CO015
              - CO017
              - CO019
              - CO020
              - CO021
          - type: callout
            title: Valuation acceleration materially outruns independent financial disclosure
            body: >
              The biggest mismatch in the current public record is not technical ambition; it is disclosure depth.
              Sunrise moved from a RMB 1.5 billion disclosed-entity pre-money valuation in May 2025 to about RMB 20
              billion post-money by August 2026, while the strongest primary financial record still shows tiny 2024
              revenue and a substantial loss for the disclosed investment vehicle. Until Sunrise discloses external
              customer mix, real booked revenue, or audited group financials, the market is underwriting projected
              strategic importance more than proven economics.
            calloutType: risk
            claimRefs:
              - CO027
              - CO028
              - CO032
              - CO038
              - CO039
              - CO040
              - CO041
          - type: callout
            title: The monetization ambition is broader than chips alone
            body: >
              Sunrise's website already frames the company as an infrastructure provider, not just a chip vendor. Token
              Factory introduces metered inference-service language; the product pages extend into cards, servers,
              clusters, and supernodes; and the vertical-solution pages suggest consulting, integration, and
              private-deployment economics. That matters for diligence because it increases the revenue pool if the
              company executes, but it also increases working-capital, support, and supply-chain complexity.
