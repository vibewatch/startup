  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >
              Sunrise should not be analyzed against the entire global “AI” market. The most useful market boundary is
              the infrastructure layer where inference workloads are deployed repeatedly and cost per token matters
              enough to influence procurement. Included spend therefore covers accelerated servers and AI-centric
              storage, inference-optimized chips and systems, cluster scheduling/orchestration, and the private or cloud
              infrastructure that public-cloud providers, AI MaaS operators, national compute centers, and regulated
              enterprises buy to serve inference. Excluded spend includes generic enterprise software AI budgets,
              training-only cluster economics outside Sunrise’s design point, deferred storage refresh that has no
              inference linkage, and most overseas hyperscaler capex that a domestic Chinese GPU vendor cannot
              realistically win.


              Status-quo substitutes are strong. Buyers can continue renting Nvidia-backed GPU clouds, use broader
              training-plus-inference platforms from large domestic rivals, or reduce infrastructure cost through
              software orchestration and CPU-heavy agent architectures instead of switching vendors. IDC’s Q1 2026 data
              shows AI-centric demand is already landing on CPU-only inference clusters and orchestration tooling
              alongside GPU systems, which means Sunrise is competing for a workload mix rather than a single monolithic
              chip budget.
            claimRefs:
