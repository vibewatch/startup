      - number: '1.3'
        title: Funding History and Capitalization
        blocks:
          - type: paragraph
            body: >
              Sunrise's capital formation has been unusually compressed. A May 2025 Beijing Li'er investment in Shanghai
              Zhenliang used a RMB 1.5 billion pre-money valuation for the disclosed investment vehicle and added RMB
              250 million from Beijing Li'er and its chairman Zhao Wei. By July 2025, public reporting described a
              nearly RMB 1 billion Pre-A round led by industrial and financial investors including Huaxu Fund,
              4Paradigm, Youzu, Beijing Li'er, Songhe Capital, and Haitong Kaiyuan. In January 2026, Sunrise announced
              nearly RMB 3 billion of strategic financing accumulated within a year. In April 2026, Caixin, Tencent,
              Jiemian, Sina, and China Securities Journal reported a new round above RMB 1 billion that brought
              cumulative disclosed funding to roughly RMB 4 billion across seven rounds and pushed valuation above RMB
              10 billion. On August 28, 2026, Caixin and Tencent reported another RMB 2 billion round at roughly RMB 20
              billion post-money. Investor lists broadened from early strategic backers to state-linked capital,
              financial sponsors, and industrial corporates. The speed of that repricing is real, but the latest round
              was media-reported and not yet formally detailed on Sunrise's own news page at fetch time.
