  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Ranking and Top Thesis-Breakers
        blocks:
          - type: paragraph
            body: >-
              The most important Sunrise risks are not independent. They compound. If S3 slips in production, Sunrise
              may lose customer momentum; if customer momentum stays unproven, financing becomes more expensive; if
              financing tightens, product roadmap execution and ecosystem build-out slow further. The top risk cluster
              is therefore a triangle of product execution, customer conversion, and financial opacity. Sunrise’s public
              narrative promises lower token cost, local control, and system-scale delivery, but the company still has
              limited neutral benchmarking, limited public customer durability data, and limited public financial
              transparency. Those gaps would be manageable in a purely software business; in a GPU platform they are
              more acute because hardware cycles and supply commitments consume capital quickly.


              A second tier of risk comes from regulation and infrastructure. Export controls can strengthen demand for
              domestic alternatives while simultaneously complicating supply chains and widening compliance scrutiny.
              Domestic industrial policy is supportive, but it also encourages more entrants and accelerates capital
              formation among competitors. Finally, Sunrise’s system-level pitch—supernodes, Token Factory, liquid
              cooling, private deployment—means power, packaging, and reliability risks can transmit directly into
              customer trust. Investors should therefore treat Sunrise as a company where a few observable milestones
              can dramatically alter the risk curve, rather than as a business that can hide weak execution inside
              gradual recurring growth.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
