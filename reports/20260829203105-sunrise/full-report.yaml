      - number: '6.4'
        title: Expansion Motion and Underwriting View
        blocks:
          - type: paragraph
            body: >-
              Sunrise’s likely expansion path is clear enough conceptually. If the company lands a cloud, MaaS, gaming,
              or regulated-enterprise deployment, it can potentially expand from card-level supply into servers,
              clusters, migration tooling, vertical optimizations, and eventually Token Factory-style metered capacity.
              That is a powerful land-and-expand model if real customer usage exists. The issue is that the public
              record still does not show how often those loops are happening, whether early users reorder, or whether
              Sunrise is mostly winning evaluation projects rather than durable platform positions.


              For investors, the right customer verdict is cautiously constructive. Sunrise appears to have identified
              legitimate buyer segments and has achieved several named ecosystem or customer-adjacent relationships. It
              also looks well aligned with Chinese customers that care about local deployment, inference economics, and
              domestic stack control. But customer quality is still one of the report’s biggest unresolved areas. Until
              Sunrise discloses repeat orders, production-scale account counts, top-customer share, and proof that
              partners convert into paying end users, its customer story should be treated as promising demand formation
              rather than fully underwritten revenue durability.
            claimRefs:
