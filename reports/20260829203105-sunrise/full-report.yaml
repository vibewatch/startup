      - number: '1.4'
        title: Products, Scale Signals, and Cover Metrics
        blocks:
          - type: paragraph
            body: >
              The product arc is coherent even if independent revenue proof remains sparse. S1 is described as a
              cloud-edge visual and multimodal inference chip and is already in mass production; third-party reporting
              says cumulative shipments exceeded 20,000 units. S2 extends Sunrise into large-model inference,
              fine-tuning, and cluster deployments with PyTorch, vLLM, and SGLang compatibility; mid-2025 reporting
              described “10,000-unit-scale” production and the current official product page positions it as already in
              scale deployment. The flagship S3 launched on January 27, 2026 and is central to the company's valuation
              step-up. Official and third-party sources align on the core specifications: LPDDR6 with LPDDR5X
              compatibility, PCIe Gen6, FP16-to-FP4 precision options, and an architecture tuned for inference rather
              than training. Sunrise claims roughly 5x higher single-chip performance and a 90% lower token cost versus
              the previous generation, alongside an eventual “one cent per million tokens” target. Those metrics are
              important, but they remain company-led. Meanwhile, the hardest cover-metric gap is financial:
              listed-investor filings still show only RMB 240,704.88 of 2024 revenue and a large loss for the main
              disclosed entity, with zero Q1 2025 revenue.
