chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Stage, and Operating Footprint
        blocks:
          - type: paragraph
            body: >
              Sunrise positions itself as a Chinese AI inference GPU and full-stack inference infrastructure company
              rather than a generic training-chip vendor. The official website and about page present the company as an
              “All-in inference” supplier spanning chips, accelerator cards, servers, clusters, workstations, and a
              proprietary software stack, with target use cases from public-cloud token factories to finance, telecom,
              and industrial deployments. Public reporting consistently ties the company's origin to SenseTime's
              large-chip division: the team began GPU R&D work in 2020 inside SenseTime, then the business was
              externalized in late 2024 as part of SenseTime's “1+X” restructuring. The current headquarters are
              publicly listed in Hangzhou, with additional R&D centers in Beijing, Shanghai, Shenzhen, Chengdu, and
              Zhuhai. Stage labeling is inconsistent across sources—Pre-A, strategic financing, and later “B-round”
              shorthand all appear—but the April and August 2026 valuations place Sunrise economically in late-stage
              private-unicorn territory rather than an early venture phase.
