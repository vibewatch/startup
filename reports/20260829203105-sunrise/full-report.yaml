        title: Product Definition and Module Map
        blocks:
          - type: paragraph
            body: >-
              Sunrise should be understood as a delivered inference platform, not just a chip design house. Its public
              surface includes the S1, S2, and S3 chip generations; PCIe cards and OAM-style modules; multiple server
              and appliance configurations; SC3-256 supernode packaging for large-model inference; the SIRE software
              stack; the TANG programming model; and the Token Factory delivery concept for cloud and MaaS customers.
              That breadth matters because the buyer does not interact with one component in isolation. Sunrise
              increasingly presents the commercial product as a combination of silicon, memory architecture, software
              compatibility, system form factor, and deployment tooling.


              The maturity profile is uneven by design. S1 appears to be the oldest and most proven module, tied to
              cloud-edge multimodal inference and long-running CV-style workloads. S2 extends Sunrise into more general
              large-model and high-concurrency inference, with multiple card and server forms and explicit framework
              support. S3 is the newest strategic asset: the platform explicitly optimized for multimodal large-model
              and agent inference with LPDDR6 or LPDDR5X, PCIe Gen6, multi-precision support, and a supernode-scale
              deployment path. Product breadth is therefore real, but the commercial weight of each layer remains
              uneven: S1 and S2 look like today’s proof of engineering maturity, whereas S3 and SC3-256 represent the
              core of the future thesis.
