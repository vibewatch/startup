      - number: '7.2'
        title: Regulatory, Legal, and Policy Risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory exposure is unavoidable in Sunrise’s category. U.S. export-control tightening around
              advanced-computing semiconductors remains a live variable for China’s AI-infrastructure stack, and
              NVIDIA’s 2025 Form 8-K illustrates how quickly licensing changes can affect product availability,
              inventory, and competitive dynamics. For Sunrise, the direct effect is mixed. Tighter controls can make
              domestic alternatives more strategically valuable, but they can also change sourcing assumptions,
              software-porting expectations, and the standard by which customers compare domestic platforms with global
              incumbents. Domestic policy from the MIIT and NDRC is supportive of compute-network build-out and AI
              adoption, but supportive policy is not the same as revenue certainty; it may simply enlarge the contested
              field.


              Legal and disclosure risk is narrower but still important. Sunrise’s corporate perimeter evolved quickly
              from Shanghai Zhenliang to Zhejiang Sunrise with a Hangzhou operating entity and multiple fundraising
              vehicles. The Beijing Li’er filing and QCC registry are useful, but they also show why diligence needs to
              confirm exactly where IP, contracts, liabilities, and cash reside. Publicly retained sources did not
              surface a major Sunrise lawsuit or enforcement action, yet the absence of a surfaced case is not the same
              as a complete legal clean bill. For a company selling domestic AI infrastructure into regulated and
              state-linked environments, corporate clarity and freedom-to-operate diligence remain essential.
            claimRefs:
              - CR011
              - CR012
