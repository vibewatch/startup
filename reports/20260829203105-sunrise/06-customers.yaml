figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Sunrise’s public customer journey usually starts with a hard deployment need—locality, cost, or sovereignty—and then moves through adaptation, systemization, and expansion if the workload holds up in production.
  data:
    items:
    - label: Need discovery
      detail: Cloud, enterprise, or industry buyer identifies high-cost or local-control inference workload
      tone: neutral
    - label: Architecture evaluation
      detail: Buyer tests whether Sunrise hardware and memory model fit latency, privacy, or token-cost requirements
      tone: neutral
    - label: Model / workflow adaptation
      detail: SIRE, partner algorithms, or serving engines are adapted to the target workflow
      tone: warning
    - label: System deployment
      detail: Cards, servers, or clusters are installed in local, private-cloud, or supernode form
      tone: positive
    - label: Operational proof
      detail: Production workload must show stability, cost, and supportability
      tone: warning
    - label: Expansion loop
      detail: Account may expand into more nodes, more models, or Token Factory-style services
      tone: positive
  approximationNotes: The map synthesizes official workflow pages and named partner content rather than a disclosed Sunrise sales-process document.
  claimRefs:
  - CU001
  - CU003
  - CU019
  - CU025
  - CU032
