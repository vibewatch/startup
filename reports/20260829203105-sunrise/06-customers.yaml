company:
  name: Sunrise
chapter:
  number: 6
  title: Customers
  summary: Sunrise’s customer story is real but still early and partner-heavy in the public record. The company clearly targets several buyer groups—public and private cloud providers, AI MaaS operators, national compute centers, and regulated or industrial enterprises—and it publishes vertical workflow pages for finance, telecom, manufacturing, entertainment, healthcare, and energy. What public evidence does not yet show is a broad, independently verifiable roster of paying production customers with contract size, renewal, or usage depth. The strongest named proof centers on Youzu Network, which has both invested in Sunrise and publicly announced strategic cooperation around customized GPU cards, distributed architecture, and private game-AI clusters. The next-best proof comes from ecosystem relationships such as SenseTime’s 算力Mall and Fourth Paradigm’s ModelHub XC adaptation, which are useful deployment signals but weaker than a clean third-party customer case study. The underwriting conclusion
    is that Sunrise has credible demand surfaces and some named proof, yet current customer evidence still looks more like an ecosystem and pilot-to-production funnel than a fully de-risked installed base.
sections:
- id: segment-map-and-buyer-roles
  title: Segment Map and Buyer / User / Payer Roles
  body: 'Sunrise’s official materials make the segment map fairly clear even when the commercial evidence is incomplete. The company explicitly targets public and private cloud providers, AI MaaS operators, and national or regional compute-center operators through Token Factory. It also markets sector-specific deployments in finance, telecom, manufacturing, entertainment, healthcare, and green energy. Those segment labels matter because the buyer, user, and payer are not the same across them. In cloud and MaaS settings the buyer is likely a platform or infrastructure owner, the user is an operations or model-serving team, and the payer is a capital-budget owner optimizing utilization and token economics. In regulated enterprise settings the buyer is more likely a CIO, digital-transformation group, or line-of-business sponsor, while the user is a workflow or AI team and the payer sits inside a compliance-sensitive budget.


    This segmentation suggests Sunrise is not pursuing a consumer-like customer motion. It is pursuing a design-partner and infrastructure-adoption motion where solution fit, data control, performance portability, and deployment services matter as much as silicon. That broadens the potential market, but it also means the company must prove repeatability across a small number of complex buyer archetypes rather than a large number of small accounts.'
