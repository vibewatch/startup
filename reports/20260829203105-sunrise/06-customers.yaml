- id: named-proof-retention-and-concentration
  title: Named Proof, Retention, and Concentration
  body: 'The public proof set is currently narrow enough that concentration and retention analysis must begin with what is missing. Sunrise has not disclosed customer count, active customers, annual recurring or repeat revenue, renewal rate, top-customer concentration, cohort retention, or NRR/GRR-style durability measures. That is not unusual for a young hardware platform, but it means outsiders cannot yet tell whether the company has diversified usage or whether a handful of strategic accounts dominate the funnel. It also means named partnerships can be over-read. A customer logo, strategic MoU, or adaptation story may validate relevance without proving durable annual receipts.


    That said, the named proof that does exist is directionally useful. Youzu’s official announcement is detailed enough to show concrete intended workflows rather than a generic logo swap, though the relationship is still strategically entangled because Youzu is both investor and partner. SenseTime’s 算力Mall proves ecosystem placement, but because Sunrise is a SenseTime spinoff the signal is not fully arm’s length. Fourth Paradigm’s ModelHub XC content suggests Sunrise is part of a vertical AI-solution workflow, yet that too is better read as partner-led validation than as disclosed multi-year customer revenue. Sunrise therefore has customer evidence, but the quality is uneven and the independence of the strongest examples is mixed.'
