  topStrengths:
    - >-
      Sunrise has a real product surface across S1, S2, S3, and Token Factory rather than a pure slideware architecture
      story.
    - >-
      Financing momentum is unusually strong for a young Chinese inference-chip spinout, indicating continued investor
      appetite and strategic relevance.
    - >-
      The company is well aligned with domestic demand for local inference deployment, cloud serving, and sovereign or
      regulated AI infrastructure.
    - >-
      Public evidence shows a coherent full-stack positioning across chips, systems, and deployment workflows, which can
      support higher strategic value if commercialization broadens.
  topRisks:
    - >-
      No current public revenue, gross-margin, or free-cash-flow disclosure supports the RMB 20B valuation with
      conventional late-stage math.
    - >-
      Customer proof remains narrow and partner-heavy, leaving concentration, re-order depth, and renewal quality
      unresolved.
    - Product, financing, and policy risks can compound quickly if S3 scale-out or benchmarking disappoints.
    - >-
      Cap-table structure, liquidation preferences, and downside protections are undisclosed, making simple return math
      potentially misleading.
    - >-
      Public comparables show that capital is available for Chinese GPU challengers, but they also set a higher
      disclosure bar than Sunrise currently meets.
  unresolvedGaps:
    - Current revenue, ARR, and segment mix are undisclosed in retained public sources.
    - Gross margin, BOM sensitivity, and chip-versus-system economics remain undisclosed.
    - Customer concentration, repeat-order cadence, and retention metrics are not visible publicly.
    - Cap table, liquidation preferences, option pool, and any recent secondary or 409A marks are not public.
    - Neutral same-workload S3 benchmark and production deployment evidence remain incomplete.
