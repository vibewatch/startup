  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sunrise-tam
    missingEvidence: A clean Sunrise-specific TAM/SAM/SOM model with disclosed workload, geography, and procurement assumptions.
    whyItMatters: Headline AI infrastructure numbers are too broad to support revenue underwriting or market-share assumptions for Sunrise.
    diligencePath: Build a bottom-up market model from target customer categories, average deployment sizes, and domestic procurement budgets rather than from macro AI totals.
    relatedQuestionRefs:
    - QM008
    - QM025
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: buyer-conversion
    missingEvidence: Public conversion rates from pilot to production across Sunrise's named buyer segments.
    whyItMatters: The adoption path looks plausible, but investors need evidence that buyer interest turns into repeat deployments.
    diligencePath: Request pilot-to-production funnel data, sales-cycle timing, and attach rates for cards, servers, and cluster products.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: material
    topic: china-inference-procurement
    missingEvidence: A public estimate isolating how much of China's compute-network build-out is specifically inference-oriented hardware and software procurement.
    whyItMatters: The RMB 4T policy figure is directionally useful but too broad to translate directly into Sunrise demand.
    diligencePath: Triangulate NDRC and MIIT programs with province-level compute-center tenders and carrier AI-capex disclosures.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: customer-budget-fit
    missingEvidence: Real customer budget lines showing what fraction of buyer spend is awarded based on token economics versus software compatibility, compliance, or policy localization.
    whyItMatters: Sunrise's LPDDR and inference-cost thesis matters only if those factors dominate customer buying decisions.
    diligencePath: Collect RFPs, benchmark bake-off criteria, and post-pilot procurement memos from target customer classes.
    relatedQuestionRefs:
    - QM022
    relatedTableRefs:
    - TM004
  - type: missing-source
    severity: minor
    topic: substitute-pricing
