company:
  name: Sunrise
chapter:
  number: 2
  title: Market Analysis
  summary: 'Sunrise sells into a favorable but easy-to-overstate market: public data confirms that AI infrastructure, inference orchestration, and sovereign compute spending are all expanding sharply in 2025-2026, yet most headline forecasts describe the whole AI infrastructure stack rather than the narrower domestic Chinese inference-GPU wedge Sunrise can actually serve. The investable conclusion is that Sunrise benefits from real tailwinds—token-driven inference growth, China compute-network investment, and demand for localized AI infrastructure—but its practical market is a constrained subset where power, memory, packaging, compliance, software migration, and public/private-cloud procurement determine whether spend converts into addressable demand.'
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary, Included Spend, and Status-Quo Substitutes
  body: 'Sunrise should not be analyzed against the entire global “AI” market. The most useful market boundary is the infrastructure layer where inference workloads are deployed repeatedly and cost per token matters enough to influence procurement. Included spend therefore covers accelerated servers and AI-centric storage, inference-optimized chips and systems, cluster scheduling/orchestration, and the private or cloud infrastructure that public-cloud providers, AI MaaS operators, national compute centers, and regulated enterprises buy to serve inference. Excluded spend includes generic enterprise software AI budgets, training-only cluster economics outside Sunrise’s design point, deferred storage refresh that has no inference linkage, and most overseas hyperscaler capex that a domestic Chinese GPU vendor cannot realistically win.


    Status-quo substitutes are strong. Buyers can continue renting Nvidia-backed GPU clouds, use broader training-plus-inference platforms from large domestic rivals, or reduce infrastructure cost through software orchestration and CPU-heavy agent architectures instead of switching vendors. IDC’s Q1 2026 data shows AI-centric demand is already landing on CPU-only inference clusters and orchestration tooling alongside GPU systems, which means Sunrise is competing for a workload mix rather than a single monolithic chip budget.

    '
