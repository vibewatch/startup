- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for Sunrise
  - Diligence ask
  rows:
  - - Inference and reasoning workload growth
    - Positive
    - Now through 2030
    - Broadens demand beyond frontier training into repeated token-serving workloads
    - What percentage of customer budgets is truly inference-specific?
  - - Agentic architectures and longer context
    - Positive
    - 2026 onward
    - Favors memory-capacity, orchestration, and low-latency design points
    - Do Sunrise benchmarks reflect real agent workflows or selected lab cases?
  - - China sovereign / industrial compute investment
    - Positive
    - 2026-2030
    - Creates policy-aligned domestic demand pools
    - How much of the 4T RMB program touches hardware categories Sunrise can actually supply?
  - - Power and grid bottlenecks
    - Negative
    - Immediate
    - Can slow data-center commissioning even when hardware demand is high
    - Which Sunrise customers already have power-secured sites?
  - - HBM and advanced packaging shortages
    - Negative
    - At least through 2027
    - Can raise BOMs for rivals, but also constrain clusters and adjacent supply chains
    - How much does Sunrise actually avoid these bottlenecks with LPDDR-centered architecture?
  - - Export controls and foundry diligence
    - Negative
    - Ongoing
    - Shape access to advanced semis, packaging, and benchmark parity in China
    - Which parts of Sunrise's supply chain remain sensitive to U.S.-controlled tools or IP?
  - - Software migration and orchestration
    - Mixed
    - Ongoing
    - Can help Sunrise if portability is real, but incumbents also improve via software
    - What migration work is required for non-trivial customer workloads?
  - - Incumbent token-cost competition
    - Negative
    - Ongoing
    - Nvidia and large domestic rivals continue narrowing the TCO gap with hardware-plus-software stacks
    - Is Sunrise's advantage durable outside a narrow set of long-context inference workloads?
  notes: 'Rows mix macro demand drivers and conversion constraints because Sunrise''s market question is not whether budgets exist, but which budgets convert into addressable procurements.

    '
