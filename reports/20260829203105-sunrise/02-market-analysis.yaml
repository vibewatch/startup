- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Why it matters to Sunrise
  rows:
  - - AI inference infrastructure
    - Accelerated servers, inference clusters, orchestration layers, AI-centric storage and networking used for model serving
    - Generic SaaS AI spend or application-layer software budgets without infrastructure control
    - Cloud providers, AI MaaS operators, national compute centers
    - This is the core procurement pool where cost per token and deployment economics are visible
  - - Domestic sovereign / industrial compute build-out
    - China compute-network projects, state-backed intelligent-compute centers, carrier-linked AI deployments
    - Overseas hyperscaler racks that a domestic Chinese GPU vendor is unlikely to supply directly
    - Central and local government-backed entities, telecom groups, regional operators
    - Creates policy-aligned demand for localized infrastructure
  - - Regulated enterprise private deployment
    - Finance, telecom, and industrial private infrastructure where data-localization matters
    - Pure public-cloud resale where Sunrise has no direct attach or compliance advantage
    - Enterprise IT, digital-transformation, and infrastructure teams
    - Matches Sunrise messaging around private deployment and compliance-sensitive workloads
  - - Training-only frontier clusters
    - Limited only where training and inference share hardware or procurement path
    - Large-scale frontier training programs optimized for peak training throughput
    - Hyperscalers, research labs, model developers
    - Mostly outside Sunrise's explicit inference-first design point
  - - Generic enterprise storage refresh
    - Only the AI-linked slice that supports inference data pipelines or AI-centric storage
    - Routine storage refresh not tied to model-serving demand
    - Enterprise IT and infrastructure teams
    - IDC explicitly warns not to confuse broad storage catch-up with direct accelerator TAM
  - - Status-quo substitute stack
    - GPU cloud rentals, domestic broad-stack AI accelerators, CPU-heavy orchestration, software optimization
    - N/A
    - Same buyer groups evaluating alternatives
    - Shows Sunrise competes against architectures and deployment models, not just one chip vendor
  notes: 'This boundary deliberately narrows Sunrise''s addressable market below headline AI or semiconductor totals. Broad AI infrastructure forecasts are upper bounds, not Sunrise TAM.

