  - - S3
    - Large-model and agent inference buyer
    - New flagship launched in 2026
    - LPDDR6 or LPDDR5X, PCIe Gen6, FP16-FP4 support, token-cost framing
    - Current production volume and field reliability not public
  - - SC3-256 supernode
    - Large cluster / MaaS operator
    - Early commercial system layer
    - Turnkey supernode for MoE and high-concurrency inference
    - Signed customer deployments and acceptance metrics not public
  - - SIRE software stack
    - Developer / platform engineer
    - Core enabling layer
    - Self-developed runtime, compiler, libraries, and ecosystem layer
    - Public docs and release cadence remain sparse
  - - TANG programming model
    - Developer / migration engineer
    - Supporting software interface
