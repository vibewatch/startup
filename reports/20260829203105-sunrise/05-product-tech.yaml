    - Cloud / MaaS infrastructure buyer
    - Emerging delivery concept
    - Turns inference stack into metered or managed output with partners
    - Commercial contract structure remains opaque
  notes: 'Maturity reflects public evidence at the run date: S1 and S2 are the best-proven modules, while S3/SC3-256 carry the most thesis value but also the most execution uncertainty.'
