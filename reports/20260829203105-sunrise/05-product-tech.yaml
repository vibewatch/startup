- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Inference GPU silicon (S1/S2/S3)
    - Provides the core compute engine
    - Tape-out, yield, packaging, and memory availability
    - Performance claims may not survive production economics
  - - LPDDR6 or LPDDR5X memory strategy
    - Expands memory capacity while targeting lower cost and broader supply
    - JEDEC standard maturation, controller design, and software optimization
    - Bandwidth tradeoffs must be offset by architecture and stack tuning
  - - PCIe Gen6 and high-speed interconnect
    - Links cards, servers, and larger systems
    - Board design, host platform support, and software libraries
    - System bottlenecks can erase silicon advantage
  - - SIRE runtime and compiler layers
    - Expose Sunrise hardware to frameworks and optimized kernels
    - Driver quality, compiler maturity, and operator coverage
    - Sparse public documentation makes maturity harder to verify
  - - Framework and serving support
    - Enables PyTorch, vLLM, SGLang, LightLLM, and model adaptation
    - Ongoing ecosystem compatibility work
    - Migration can fail on edge-case operators or scale patterns
  - - Server and appliance packaging
    - Turns chips into deployable systems
    - Cooling, power, OEM integration, and support engineering
    - Warranty, field reliability, and service obligations are not public
  - - SC3-256 supernode and liquid cooling
    - Extends Sunrise into cluster-scale inference
    - Rack integration, cooling infrastructure, and deployment tooling
    - Customer acceptance and high-availability proof remain sparse
  - - Vertical solution templates
    - Translate infrastructure into domain workflows
    - Partner algorithms, data rights, and enterprise integration
    - Value may depend more on partner execution than on Sunrise alone
  notes: The architecture is specific enough to map, but several of its most important risk-bearing layers still lack neutral benchmark or reliability disclosure.
