- id: customer-scale-and-adoption-trajectory
  title: Customer scale and adoption trajectory
  body: 'The 2026 prospectus provides unusually broad scale disclosures for a private Chinese healthcare platform. Miaoshou Physician averaged about 27 million monthly visits in 2025. Yuanxin Pharmacy operated 201 hospital-adjacent stores across 27 provincial-level regions by 2025-12-31 and collaborated with 537 hospitals, including more than 220 top-tier Class III Grade A hospitals. On the payer side, Yuanxin had served 230 insurance companies and 10 reinsurance companies, managed 246.6 million policies since 2018, and served about 4.8 million people through health-management services. On the pharma side, it had cumulatively served 506 pharmaceutical companies, covering 19 of the top 20 domestic pharma companies in China and 19 of the top 20 global pharma companies by 2024 revenue.


    Those scale metrics should be read carefully. Policy counts are cumulative and not equivalent to active covered lives or revenue per customer. Similarly, 27 million monthly visits are traffic, not paid subscribers. Still, the breadth of adoption across customer classes is notable: relatively few digital-health platforms can point simultaneously to large patient traffic, broad hospital collaboration, wide insurer coverage, and hundreds of pharma-company relationships. The adoption story also appears cumulative rather than viral. Customers are acquired through hospital adjacency, insurer product launches, pharmacy presence, and commercialization partnerships more than through pure direct-to-consumer growth alone.'
