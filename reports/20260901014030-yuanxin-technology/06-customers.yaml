- id: concentration-risk-and-diligence-gaps
  title: Expansion, concentration risk, and diligence gaps
  body: 'Customer diversification is a strength in theory, but it is not the same thing as low concentration risk in practice. Yuanxin discloses hundreds of hospitals, insurers, and pharma companies, yet does not publish segment-level revenue concentration, top-customer exposure, renewal rates, or satisfaction metrics such as NPS. That means investors do not know whether a small number of insurers, pharma programs, or hospital clusters contribute a large share of revenue. Nor do they know how much of the 4.8 million health-management population is active, how often prescriptions repeat, or whether enterprise accounts expand over time.


    There are also category-specific risks. Hospital-origin prescription flow remains a gatekeeper dependency. Insurance-product scale is meaningful, but Yuanxin does not underwrite the products and therefore depends on insurer appetite and partner economics. Pharma customer breadth is impressive, yet the durability of those relationships depends on commercialization ROI and compliance. The filing and official pages show a well-developed customer machine; what they do not show is the quality of those customer cohorts. That is the main diligence gap for this chapter.'
