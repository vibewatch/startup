  title: Expansion and concentration risk table
  columns:
  - Risk area
  - Why it matters
  - Public signal
  - Diligence ask
  rows:
  - - Top insurer concentration
    - A few large carriers could drive economics
    - 230 insurers disclosed but no concentration table
    - Request top-10 insurer revenue and renewal data
  - - Top pharma customer concentration
    - Commercialization revenue may be program-concentrated
    - 506 pharma-company relationships disclosed but no concentration detail
    - Request top-20 pharma revenue and retention
  - - Hospital cluster concentration
    - Prescription flow may be concentrated near specific flagship hospitals
    - 537 hospitals disclosed but no cluster economics
    - Request hospital-level prescription-capture analysis
  - - Patient repeat rate
    - Repeat use is key to long-term economics
    - Chronic-care and refill logic visible but no cohort data
    - Request refill cohorts and 6/12-month retention
  - - Satisfaction / service quality
    - Healthcare trust directly affects repeat usage
    - No NPS or turnaround benchmarks disclosed
    - Request service-level KPIs and patient satisfaction data
  - - Partner underwriting appetite
    - Huibao products are underwritten by insurers, not Yuanxin
    - Partner dependence is explicit in filing
    - Test insurer renewal pipeline and product ROI
  notes: Breadth across customer classes is real, but concentration and quality within each class remain opaque.
