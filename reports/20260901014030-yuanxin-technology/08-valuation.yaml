- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Side
  - Argument
  - Why it matters
  - What would change the view
  rows:
  - - Thesis
    - Real scale across pharmacy, digital, insurer, and pharma workflows
    - 201 pharmacies, 27M monthly visits, 230 insurers, 506 pharma companies, and 537 hospitals imply real ecosystem breadth
    - If partner-retention or cohort data show these relationships are shallow, the moat weakens
  - - Thesis
    - Category leadership in innovative-drug commercialization
    - 'Frost ranks Yuanxin #1 by 2024 full-chain revenue among the comparable set in the filing attachment'
    - If leadership was won mainly through low-margin volume rather than sticky higher-value services, the valuation case weakens
  - - Thesis
    - Large category tailwinds remain intact
    - Innovative-drug and specialty-pharmacy markets are still projected to grow at double-digit CAGRs into 2030
    - If policy or payer changes slow prescription outflow or specialty-drug payment expansion, the growth runway shrinks
  - - Anti-thesis
    - Growth has slowed materially already
    - 2025 revenue grew only about 1.7%, so the business is no longer on a classic hypergrowth curve
    - Faster same-store productivity and partner-led growth would soften this concern
  - - Anti-thesis
    - Economics remain thin for the current scale
    - 2025 gross margin was 9.9% and the company remained loss-making despite improvements
    - Segment disclosure showing higher-margin service lines are becoming more dominant would improve the view
  - - Anti-thesis
    - Public-market proof is still missing
    - Six filings and a 30% valuation haircut suggest the market has not yet validated the old private mark
    - A successful IPO or arm’s-length financing with clean terms would raise confidence
  notes: The thesis is strategic and operationally credible; the anti-thesis is mostly about price, disclosure, and earnings quality.
