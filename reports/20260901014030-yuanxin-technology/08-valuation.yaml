company:
  name: Yuanxin Technology
chapter:
  number: 8
  title: Valuation
  summary: 'Yuanxin is a real-scale Chinese digital-health platform with category leadership in innovative-drug commercialization, but the current public valuation anchor is not obviously cheap. The sixth Hong Kong filing and July 2026 reporting imply a RMB 19.5 billion pre-IPO mark, equal to roughly 1.9x 2025 revenue of RMB 10.377 billion after a 30% haircut from the prior Series F reference point. That sits below software-like health-data multiples such as Medlive or Yidu, but above lower-multiple pharmacy/distribution-style peers like JD Health and Alibaba Health despite Yuanxin''s thin 9.9% gross margin, continued losses, repeated IPO lapses, and still-tight liquidity. Recommendation: track, not buy; confidence: medium; risk rating: high; valuation stance: stretched unless diligence reveals materially stronger cohort economics, renewal quality, and cap-table terms than the public record shows.'
sections:
- id: recommendation-and-entry-discipline
  title: Recommendation and entry discipline
  body: 'Yuanxin deserves active tracking because the business has real operating scale, not just startup storytelling. The 2026 Hong Kong application proof and independent summaries show 2025 revenue of RMB 10.377 billion, 201 pharmacies, roughly 27 million average monthly Miaoshou Doctor visits, 230 insurers plus 10 reinsurers, 506 pharmaceutical-company customers, and 537 hospitals served through medical-technology workflows. That is unusually broad infrastructure for a private Chinese healthtech platform. It is also why the company remains relevant even after multiple failed listing cycles: very few peers combine patient access, specialty pharmacy, insurance enablement, and pharma commercialization services at this scale.


    But valuation discipline matters more than admiration. The July 2026 adverse reporting tied to the latest prospectus says Yuanxin cut its implied valuation by 30% to RMB 19.5 billion. Against 2025 revenue, that implies roughly 1.9x price-to-sales. On a superficial reading that looks lower than many software-style healthtech names. On a harder reading, it is a demanding price for a company with only 1.7% revenue growth in 2025, a 9.9% gross margin, a RMB 400.9 million net loss, sharply lower cash, and an IPO that has still not cleared after six filings. The right public-evidence posture is therefore track: the asset quality is real, but the disclosed price does not yet leave a clear margin of safety.'
