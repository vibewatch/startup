  - CV022
  - CV031
  - CV038
  - CV039
  - CV041
  - CV042
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Cap table and preference stack
    - Post-Series F and pre-IPO preference terms, liquidation stack, board rights, and any ratchets
    - Headline valuation can be misleading if preferences absorb much of the upside
    - Company counsel / financing documents
  - - Same-store pharmacy cohorts
    - Store-level revenue, gross profit, refill, and contribution margins before and after the 2023-2025 store reset
    - Determines whether rationalization created a stronger base or merely shrank the footprint
    - Management data room / site visits
  - - Segment contribution margins
    - Economics split across pharmacy, insurance enablement, marketing, and hospital-tech services
    - Needed to test whether higher-value services are large enough to justify richer multiples
    - Audited management accounts
  - - Partner-renewal quality
    - Insurer, pharma, and hospital renewal rates plus concentration by top counterparties
    - Shows whether ecosystem breadth is sticky or only broad on paper
    - Customer cohort analysis and contract review
  - - Supplier concentration by therapy area
    - Top-supplier exposure split by category and substitution risk
    - Critical for downside risk in a thin-margin drug-access business
    - Procurement diligence and supply-chain review
  - - IPO readiness package
    - Updated listing timeline, regulatory feedback, cornerstone appetite, and 2026-2027 use-of-proceeds plan
    - Needed to judge whether the exit path is real or still aspirational
    - Capital-markets diligence with sponsor and company
  notes: These asks are ranked by how directly they can move the call from track to buy or from track to avoid.
