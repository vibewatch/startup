  - - What would upgrade the call
    - Evidence of cleaner economics at the same or lower price
    - Need cap-table clarity, same-store productivity, insurer/pharma renewal quality, and cleaner cash bridge
    - Upgrade only if diligence improves both quality and price support
  notes: The recommendation is price-sensitive. This is not a negative call on the existence of a business; it is a judgment that current disclosed valuation support is incomplete.
