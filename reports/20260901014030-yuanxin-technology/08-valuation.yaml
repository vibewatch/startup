  enumerationScope:
    coverage: partial
    basis: Covers the most relevant public Chinese digital-health comparables plus private funding references retained for this run, but not every hospital IT, pharmacy retail, or biotech services peer that could influence pricing.
  rows:
  - - JD Health
    - Public online healthcare / pharmacy platform
    - 1.28x sales; EV/sales 0.69x
    - Large-scale, listed Chinese health platform with significant pharmacy exposure
    - Much stronger profitability and balance sheet than Yuanxin
  - - Ping An Healthcare
    - Public online healthcare / managed-care platform
    - 2.20x sales; EV/sales 1.05x
    - Nearest listed mixed-services benchmark with healthcare-service complexity
    - Different product mix and parent ecosystem; still not an exact full-chain innovative-drug comp
  - - Alibaba Health
    - Public e-commerce / healthcare platform
    - 1.28x sales; EV/sales 0.99x
    - Shows where very large listed China healthcare-commerce assets trade
    - Broader ecommerce-driven model and stronger economics than Yuanxin
  - - Fangzhou
    - Public online chronic-disease / pharmacy platform
    - 0.22x sales; EV/sales 0.12x
    - Downside reference for a listed pharmacy-linked digital-health model under market pressure
    - Smaller scale, different mix, and already deeply compressed
  - - Yidu Tech
    - Public health-data / AI platform
    - 4.23x sales; EV/sales 1.78x
    - Shows the multiple premium markets sometimes pay for data/software narratives
    - Much more software-like revenue mix than Yuanxin
  - - Medlive
    - Public physician platform / data services
    - 7.60x sales; EV/sales 3.57x
    - Illustrates that capital-light, data-centric healthcare assets can screen at much richer sales multiples
    - Too asset-light to be a direct comp for Yuanxin
  - - Series F / private funding context
    - Private financing reference
    - Over RMB 1.5B raised in Aug 2021; roughly $933M lifetime funding
    - Helps frame dilution and preference-overhang risk at the current headline valuation
    - Funding amount does not reveal effective common-equity value today
  - - Latest pre-IPO mark
    - Private headline valuation
    - RMB 19.5B after 30% haircut per July 2026 reporting
    - The most current public anchor for Yuanxin itself
    - Headline mark may not equal a clean investable entry price
  notes: Comparable multiples are current public-screen metrics, while private rows are context rather than directly comparable market-clearing values.
