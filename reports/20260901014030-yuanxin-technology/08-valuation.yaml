  rows:
  - - Recommendation
    - Track
    - Real operating scale and market leadership, but the current implied price is not obviously cheap
    - Keep Yuanxin on the watchlist; do not stretch on entry price without new diligence
  - - Confidence
    - Medium
    - The valuation anchor is public, but cap-table terms, segment economics, and partner renewals remain under-disclosed
    - Treat scenario ranges as decision aids rather than point estimates
  - - Risk rating
    - High
    - Losses continue, liquidity stayed tight, regulation is heavy, and six filings show execution risk
