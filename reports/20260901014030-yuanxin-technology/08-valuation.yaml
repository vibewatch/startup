  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-cap-table-and-preference-stack
    missingEvidence: The current liquidation preference stack, anti-dilution protections, board-control rights, and any structured downside protections attached to late private rounds or proposed IPO allocations.
    whyItMatters: Headline valuation is not enough to underwrite common-equity return if investor protections or preference seniority absorb much of the upside.
    diligencePath: Obtain financing documents, updated capitalization table, and counsel memo before forming an entry-price view.
    relatedQuestionRefs:
    - QV016
    - QV024
    - QV027
  - type: private-evidence-only
    severity: material
    topic: same-store-pharmacy-cohort-economics
    missingEvidence: Store-level revenue, gross profit, refill, and contribution-margin cohorts before and after the reduction from 335 to 201 pharmacies.
    whyItMatters: Public evidence shows network rationalization, but not whether the remaining base is truly better or simply smaller.
    diligencePath: Request cohort tables for mature versus new stores and validate them with site visits and sample invoices.
    relatedQuestionRefs:
    - QV021
    - QV024
    - QV029
  - type: enumeration-incomplete
    severity: minor
    topic: partial-comparable-set-for-TV004
    missingEvidence: A wider set of Chinese hospital IT, retail-pharmacy, and commercialization-services peers that could refine the multiple range around Yuanxin.
    whyItMatters: TV004 is intentionally partial because few listed companies match Yuanxin exactly, but a broader peer set could still tighten the range.
    diligencePath: Expand the public comp universe with broker screens and sector mapping before issuing a buy-grade target.
    relatedQuestionRefs:
    - QV009
    - QV030
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: partner-renewal-quality-and-concentration
    missingEvidence: Insurer, pharma, and hospital renewal data, top-customer concentration, and unit economics by major partner cohort.
    whyItMatters: The moat argument depends on durable counterparties, not just large gross counts.
    diligencePath: Review contract cohorts, churn causes, and revenue concentration by top counterparties.
    relatedQuestionRefs:
    - QV006
    - QV021
    - QV024
  - type: stale
    severity: minor
    topic: post-september-2026-market-window
    missingEvidence: Definitive pricing or withdrawal outcome for the 2026 Hong Kong listing attempt after the retained September 2026 evidence window.
    whyItMatters: A priced IPO, delayed process, or fresh financing would immediately change the valuation anchor.
    diligencePath: Refresh capital-markets sources and the HKEX filing trail before making a time-sensitive investment decision.
    relatedQuestionRefs:
    - QV001
    - QV025
