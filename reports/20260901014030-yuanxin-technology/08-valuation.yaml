- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Financing clears below current headline mark
    - New round or IPO pricing materially below RMB 19.5B, or with heavy ratchets/preferences
    - Shows the 2026 filing mark overstated current common-equity value
    - Re-underwrite to the new effective entry price; do not anchor on old headline valuation
  - - Same-store pharmacy economics disappoint
    - Post-rationalization stores fail to show better contribution margins or refill economics
    - Weakens the argument that pruning improved quality of revenue
    - Move stance toward avoid unless price resets
  - - Partner renewal quality weakens
    - Meaningful insurer or pharma program attrition, or hospital-coverage contraction
    - Undercuts the ecosystem-moat argument behind premium valuation
    - Reduce terminal-multiple assumptions and cut scenario range
  - - Liquidity tightens again
    - Cash bridge worsens or operating cash generation reverses before listing
    - Raises the probability of a defensive financing
    - Assume dilution and higher required return
  - - Regulatory tightening hits prescription outflow or digital-health workflows
    - Policy or enforcement changes reduce the ability to capture out-of-hospital innovative-drug demand
    - Damages both growth and margin narratives at once
    - Pause investment case until operational effect is measurable
  notes: Kill triggers focus on measurable events that break the price-sensitive thesis, not merely on missing consensus estimates.
  claimRefs:
