- id: sizing-lenses
  title: TAM, SAM, and practical sizing lenses
  body: 'The highest-quality sizing lens comes from the Frost & Sullivan attachment included with Yuanxin''s 2026 filing. It puts China''s overall pharmaceutical market at RMB 1,629.7 billion in 2024 and RMB 2,129.7 billion in 2030, but the more relevant submarkets are growing faster. China''s innovative-pharmaceutical market grew to RMB 309.9 billion in 2024 and is projected to reach RMB 606.5 billion by 2030, while the specialty-pharmacy market grew to RMB 102.7 billion in 2024 and is projected to reach RMB 219.4 billion by 2030. Frost explicitly ties this acceleration to prescription outflow, broader distribution beyond hospitals, faster reimbursement inclusion, and the first commercial health-insurance innovation-drug list. Within that framing, Yuanxin''s practical SAM sits much closer to innovative-pharma access and specialty pharmacy than to all healthcare or even all digital health.


    Broader analyst estimates show why triangulation is necessary. IMARC says China''s digital-health market reached USD 94.9 billion in 2025 and could reach USD 359.9 billion by 2034 at a 15.48% CAGR, while MRFR sizes China digital healthcare at only USD 16.5 billion in 2024 with a rise to USD 120.67 billion by 2035 at 19.83% CAGR. Those numbers are not directly contradictory so much as differently scoped: they package different mixes of telehealth, medical apps, health IT, wearables, analytics, and services. For Yuanxin, the better bottom-up anchor is the pharmacy-and-innovative-drug stack plus evidence from its own market position. Frost''s ranking table shows Yuanxin at RMB 10.2 billion of 2024 revenue, RMB 4.8 billion of annual innovative-drug delivery value, and 237 self-owned specialty pharmacies, which indicates real share inside the specialty-fulfillment layer even if no public source precisely isolates its serviceable SOM.'
