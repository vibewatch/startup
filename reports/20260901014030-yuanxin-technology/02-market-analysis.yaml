  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Prescription outflow from hospitals
    - positive
    - current and medium-term
    - Expands out-of-hospital specialty-dispensing demand
    - How much hospital-origin Rx flow can Yuanxin lock in?
  - - Faster NRDL inclusion for innovative drugs
    - positive
    - current
    - Improves affordability and accelerates therapy uptake
    - Which categories still need commercial-insurance supplementation?
  - - Commercial insurance innovation-drug list
    - positive
    - 2025-2026 onward
    - Supports products covering drugs outside basic insurance
    - How much premium / claims volume can Yuanxin intermediate?
  - - Aging population and chronic disease burden
    - positive
    - long-term
    - Sustains follow-up and medication-management demand
    - Which cohorts are highest LTV for Yuanxin?
  - - 5G and digital infrastructure
    - positive
    - current
    - Improves feasibility of remote consultations and coordination
    - Does infrastructure meaningfully change monetization or just convenience?
  - - Urban-rural provider imbalance
    - positive
    - long-term
    - Supports telehealth and digital triage demand
    - Can Yuanxin acquire users outside top urban catchments profitably?
  - - First-diagnosis limits in internet medicine
    - negative
    - current
    - Caps purely online care and keeps market tied to physical institutions
    - What percent of volume requires offline diagnosis handoff?
  - - Licensed-institution and pharmacist-review requirements
    - negative
    - current
    - Raises compliance cost and integration complexity
    - How defensible are Yuanxin’s compliance workflows versus peers?
  - - Traffic maturation / consultation commoditization
    - negative
    - current
    - Shifts value from consultations to pharmacy and payment rails
    - Is Miaoshou traffic still efficient to monetize?
  - - Analyst TAM dispersion
    - negative
    - current
    - Makes high-level digital-health multiples unreliable
    - Use bottom-up SAM proxies instead of a single headline TAM
  notes: The strongest tailwinds improve access and reimbursement; the strongest constraints stop the market from becoming a lightly regulated software category.
