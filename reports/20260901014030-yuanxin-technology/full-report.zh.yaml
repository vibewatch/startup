      - number: '3.2'
        title: 规模化平台竞争者：JD Health、Ping An Health、Alibaba Health 和 WeDoctor
        blocks:
          - type: paragraph
            body: >-
              JD Health 是最直观的规模基准。StockAnalysis 2026 年 9 月快照显示，其过去十二个月收入为 RMB 79.04 billion，员工 6,018 人，市值 HKD 116.42
              billion；公司描述则突出在线医疗咨询、转诊、健康检查、互联网医疗、居家护理服务和技术服务。实际竞争中，JD Health 在消费者获客、在线医疗服务、药房商业和广义健康零售上与 Yuanxin
              交锋，但规模大得多，并拥有 JD 生态优势。Alibaba Health 的平台分发能力同样强：StockAnalysis 显示其年度收入 RMB 34.26 billion，员工 1,394 人，市值 HKD
              49.95 billion，进一步说明 Yuanxin 面对的是由大型互联网生态支撑的消费者和零售对手。


              Ping An Health 小于 JD Health，但作为披露质量较高的医疗服务平台，与 Yuanxin 更直接相关。其 2025 年年度业绩公告披露收入 RMB 5.468 billion、调整后净利润
              RMB 414 million；StockAnalysis 显示约 1,586 名员工和 HKD 13.87 billion
              市值。公司描述强调在线诊疗、咨询、健康管理服务、检测和智能设备销售——这是一套更偏服务驱动的数字医疗堆栈，与 Yuanxin 的在线医疗和支付方相邻野心重叠。WeDoctor
              作为中国长期知名的互联网健康品牌，仍具战略相关性；2026 年 GetLatka 资料将其收入放在约 US$423.6 million、累计融资 US$1.5 billion、2022 年估值 US$7
              billion、约 2,000 名员工，总部位于杭州。但与上市同业相比，WeDoctor 可获得的公开证据更薄，也更依赖跟踪网站，精度有限。
