      - number: '2.4'
        title: 增长驱动、采用约束与相互冲突的估算
        blocks:
          - type: paragraph
            body: >-
              结构性顺风很强。2018 年以来，官方政策允许依托实体医疗机构建设互联网医院，允许常见病和慢病在线复诊，以及经药师审核、合格配送的电子处方。Frost 进一步强调，创新药加速纳入
              NRDL、多元化分销渠道兴起、处方外流，以及新的商业保险创新药目录，都是院外专科药生态的催化剂。MarketsandMarkets 又补充了需求侧驱动：人口老龄化、城乡医疗可及性差距、Healthy China
              2030 政策支持，以及 5G 赋能的远程护理基础设施。这些因素都强化了 Yuanxin 的逻辑：治疗可及性会越来越多地跨医院、药房、保险方和数字服务组织起来，而不是锁在单一机构内部。


              约束同样重要。2019 年互联网诊疗规则禁止互联网首诊，并让市场绑定持牌机构，限制了纯线上规模。2026
              年一篇市场评论认为，中国远程医疗如今更像整合故事，而不是绿地流量争夺；存活平台更多靠药品销售而非问诊变现。Yuanxin
              自身经济性也指向同一方向：即便医院和线上足迹很大，医院科技收入仍小，药房和药企相关服务才是主导。最后，分析师市场规模估算差异很大，因此投资人应把宽泛数字医疗 CAGR
              当作背景，而不是可直接用于估值的输入。更可信的论点是，Yuanxin 身处中国医疗中增长更快的子板块之一——创新药可及性和专科履约——但只有监管、支付方整合和履约执行继续协同运转，它才能真正捕捉这部分增长。
