      - number: '7.2'
        title: 运营、质量和安全风险清单
        blocks:
          - type: paragraph
            body: >-
              运营上，圆心同时暴露在药房网络和数字平台两套问题里。招股书和官方页面显示，公司依赖处方审核、专业咨询、 冷链配送、自营门店、患者管理系统、理赔处理和院店联动。任何一层出错，都可能同时影响患者结果和监管信任。
              这比轻量级医疗健康 App 的风险画像更重。平台还要安全处理患者病历、保险数据和用药史——这些恰恰是中国隐私和数据安全执法视为敏感的类别。


              2025-2026 年的财务和运营信号说明了为什么这很重要。圆心门店数从 2023 年的 335 家降至 2025 年的 201 家， 承担了药房关停损失，并且在一个要求线下服务质量的业务里，毛利率仍低于
              10%。公司公开表达了 AI 野心， 但其 AI 落地绑定在受监管的人类工作流里，而不是可替代的消费聊天。因此，数据质量、模型漂移或推荐不准等经典 AI 风险，
              是叠加在医疗、药房和保险执行风险之上，而不是替代后者。一次严重的质量、隐私或物流事故，可能迅速蔓延到多条业务线。
