  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 立场
      - 论点
      - 重要性
      - 改变看法的证据
    rows:
      - - 投资逻辑
        - 药房、数字化、保险公司和药企工作流均已有真实规模
        - 201 家药房、27M 月访问量、230 家保险公司、506 家药企和 537 家医院，意味着生态宽度真实存在
        - 如果合作伙伴留存或队列数据表明关系很浅，护城河就会削弱
      - - 投资逻辑
        - 创新药商业化品类领先
        - Frost 在申报附件可比范围中按 2024 年全链条收入将 Yuanxin 排名第 1
        - 如果领先主要靠低利润率规模取得，而不是粘性更强的高价值服务，估值逻辑就会削弱
      - - 投资逻辑
        - 大品类顺风仍在
        - 创新药和特药药房市场到 2030 年仍预计以双位数 CAGR 增长
        - 如果政策或支付方变化拖慢处方外流或特药支付扩张，增长跑道就会收窄
      - - 反向逻辑
        - 增长已经明显放缓
        - 2025 年收入仅增长约 1.7%，业务已不在典型高速增长曲线上
        - 同店生产率和伙伴带动增长更快，可缓和这一担忧
      - - 反向逻辑
        - 当前规模下经济性仍薄
        - 2025 年毛利率为 9.9%，公司虽有改善但仍亏损
        - 若分部披露显示高利润率服务线占比提高，看法会改善
      - - 反向逻辑
        - 公开市场验证仍缺位
        - 六次递表和 30% 估值折让表明，市场尚未验证旧的私募估值
        - 成功 IPO 或条款干净的独立融资会提高信心
    notes: 投资逻辑在战略和运营上可信；反向逻辑主要落在价格、披露和盈利质量上。
