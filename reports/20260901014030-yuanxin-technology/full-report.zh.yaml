      - number: '3.4'
        title: Yuanxin 的差异化与护城河风险
        blocks:
          - type: paragraph
            body: >-
              Yuanxin 的核心差异化不在于赢下每一个消费者或医生指标，而在于它把几个难复制的接口合到一个运营闭环里。2026 年招股书和 Frost 附件将其定位为按 2024
              年收入计领先的创新药商业化全链条提供商；公司披露，截至 2025 年底拥有 201 家药房、537 家医院合作、230 家保险公司、10 家再保险公司和 506 家药企客户。官网材料和 2025 年 Pfizer
              升级文章强化了同一模式：Yuanxin 想做医院出院、专科配药、患者管理、保险协调和药企商业化之间的连接器。这让它在结构上不同于 Medlive 这样的纯医生媒体公司、DXY 这样的内容网络平台，或 JD
              Health 这样的综合在线健康市场。


              护城河真实存在，但并非不可攻破。JD、Alibaba 和 Ping An 可以用更大生态补贴健康服务，并享有更好的公开市场信用。Medlive 和 DXY 可能在特定流程中掌握更多医生注意力。Fangzhou
              显示，当盈利不确定时，公开市场会大幅折价互联网医院和药房模式。Yuanxin 自己反复递交 IPO，也说明全链条优势尚未转化为无争议的资本市场叙事。实际判断是，Yuanxin
              确实拥有差异化资产——院边药房、保险方整合和药企伙伴关系——但护城河耐久度取决于这些领域的执行，而不是试图在流量上打赢互联网巨头。
