      - number: '7.3'
        title: 合作方、依赖和人 / 执行风险
        blocks:
          - type: paragraph
            body: >-
              圆心的模式依赖它无法完全控制的交易对手。医院端处方是药房和复诊活动的漏斗入口。保险公司承保圆心营销和服务的产品， 因此支付方意愿和理赔经济性很关键。制药企业出资支持商业化和患者支持项目，让圆心暴露在 ROI
              审查、反腐执法和预算转移风险之下。 供应商依赖也在上升：2026 年 7 月的反向报道称，前五大供应商在 2025 年占采购额 53.7%，而 2023 年为 40.4%。
              如果供应商条款收紧、产品可得性变化，或合作项目放缓，圆心的经济性可能很快变弱。


              执行和关键人物风险也不低。何涛仍是战略、资本市场和合作方信任的核心，不同副手分别负责医疗运营、财务和零售执行。 多次递交 IPO 申请说明管理层有韧性，也说明执行有拖累。人员优化和较低研发开支改善了 2025
              年数字， 但在合规负担重的服务业务里，降本若削弱服务质量或拖慢系统开发，可能反噬。Ping An 和 JD 等更强的公开竞争对手存在，
              意味着圆心必须同时在产品、药房、支付方和合作伙伴流程上持续执行；它没有空间走一条简单的单指标反转路径。
