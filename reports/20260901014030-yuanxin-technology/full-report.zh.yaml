  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              Yuanxin
              的可服务市场比远程医疗更宽，但比「整个数字医疗」更窄。相关市场始于中国创新药商业化：在合适场景下，让专科和肿瘤疗法在院外完成处方、报销、履约和支持。这个市场与院边专科药房、互联网复诊、医院互联网医院基础设施、患者管理和商业保险赋能相交；不包括住院医院收入、药物发现、制造经济性或普通消费者健康管理。换句话说，Yuanxin
              变现的是诊断与长期治疗可及性之间的交接，而不是整个医疗支出堆栈。


              这个市场定义很关键，因为宽泛的数字医疗 TAM 数字很容易夸大 Yuanxin 实际能吃到的部分。一般数字医疗报告会统计可穿戴设备、软件、健康分析、医疗器械和消费者 App；Yuanxin
              只能捕捉与处方外流、专科履约、保险方流程和药企商业化相关的部分。现状替代方案仍很强：医院药房、传统批发商、普通电商药房、人工报销流程、线下患者援助项目，以及医院自建互联网门户。Yuanxin
              的优势在于，它试图把这些碎片连接到一个以创新药可及性为中心的单一流程里，而不是只提供一个点状产品。
