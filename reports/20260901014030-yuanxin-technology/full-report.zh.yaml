  - id: TV005
    title: 投资逻辑破裂和终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 融资以低于当前标题估值出清
        - 新一轮融资或 IPO 定价显著低于 RMB 19.5B，或附带重度反稀释 / 优先权
        - 表明 2026 年递表估值高估了当前普通股价值
        - 按新的有效入场价重新承销；不要锚定旧的标题估值
      - - 同店药房经济性不及预期
        - 精简后门店未显示更好的贡献利润率或复购经济性
        - 削弱「瘦身改善收入质量」的论点
        - 除非价格重置，否则立场转向回避
      - - 合作伙伴续约质量走弱
        - 保险公司或药企项目出现实质流失，或医院覆盖收缩
        - 削弱支撑溢价估值的生态护城河论点
        - 下调终局倍数假设，并压缩情景区间
      - - 流动性再次收紧
        - 上市前现金桥恶化，或经营现金生成反转
        - 提高防御性融资概率
        - 假设会发生稀释，并要求更高回报
      - - 监管收紧打击处方外流或数字健康工作流
        - 政策或执法变化削弱公司承接院外创新药需求的能力
        - 同时损害增长和利润率叙事
        - 暂停投资判断，直到运营影响可衡量
    notes: 终止触发因素聚焦可衡量、会打断价格敏感投资逻辑的事件，而不只是低于市场一致预期。
    claimRefs:
      - CV008
      - CV022
      - CV031
      - CV038
      - CV039
      - CV041
      - CV042
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 股权结构表和优先股堆叠
        - Series F 后和 IPO 前优先权条款、清算堆叠、董事会权利，以及任何反稀释条款
        - 如果优先权吸收大量上行，标题估值可能误导
        - 公司律师 / 融资文件
      - - 同店药房队列
        - 2023-2025 年门店重置前后的门店级收入、毛利、复购和贡献利润率
        - 决定精简是打造了更强基础，还是只是缩小了覆盖足迹
        - 管理层资料室 / 实地走访
      - - 分部贡献利润率
        - 药房、保险赋能、营销和医院技术服务的经济性拆分
        - 用来检验高价值服务线是否足够大，能否支撑更高倍数
        - 经审计的管理账
      - - 合作伙伴续约质量
        - 保险公司、药企和医院续约率，以及按头部对手方划分的集中度
        - 显示生态宽度是有粘性，还是只在纸面上宽
        - 客户队列分析和合同审查
      - - 按治疗领域划分的供应商集中度
        - 按品类拆分的头部供应商敞口和替代风险
        - 对薄利润率药品触达业务的下行风险至关重要
        - 采购尽调和供应链审查
      - - IPO 就绪包
        - 更新后的上市时间表、监管反馈、基石投资者兴趣，以及 2026-2027 年募资用途计划
        - 用来判断退出路径是真实存在，还是仍停留在愿景阶段
        - 与保荐人和公司开展资本市场尽调
    notes: 这些要求按其将判断从观察推向买入或从观察推向回避的直接程度排序。
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV038
      - CV039
      - CV041
