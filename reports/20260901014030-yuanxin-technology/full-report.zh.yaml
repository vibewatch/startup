      - number: '4.3'
        title: 流动性与资本充足性
        blocks:
          - type: paragraph
            body: >-
              流动性在一个狭窄维度上改善，在更宽维度上收紧。Yuanxin 在 2023 年消耗 RMB 347.0 million 经营现金后，2024 年产生 RMB 42.7 million、2025 年产生 RMB
              138.2 million 正经营现金流。但 2025 年投资现金流出恶化至 RMB 461.0 million，融资现金流出仍为负，招股书显示 2025 年现金及现金等价物净减少 RMB 402.9
              million。资产负债表流动资产显示，现金及现金等价物从 2023 年底 RMB 909.1 million 降至 2024 年底 RMB 531.0 million、2025 年底 RMB 329.3
              million；同期贸易及票据应付款从 RMB 1.293 billion 升至 RMB 1.880 billion，保证金存款从 RMB 138.4 million 升至 RMB 574.2
              million。申报文件本身警示，现金下降而贸易及票据应付款增加，对流动资产净额造成压力。


              2026 年 7 月独立报道让流动性图景更紧。Shuziqushi 强调，Yuanxin 在 2022 至 2026 年间没有完成新的外部融资，关店帮助门店网络从 2023 年 335 家缩至 2025 年
              201 家，公司还将 IPO 前估值下调 30% 至 RMB 19.5 billion。文章还突出引用现金流量表得出的更低年末现金数字，说明尽调时需要调和现金定义。综合看，Yuanxin
