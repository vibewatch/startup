      - number: '6.4'
        title: 扩张、集中度风险和尽调缺口
        blocks:
          - type: paragraph
            body: >-
              客户多元化在理论上是优势，但实践中不等于集中度风险低。圆心披露了数百家医院、保险公司和药企， 却没有发布分业务收入集中度、头部客户敞口、续约率，或 NPS 等满意度指标。因此，投资者不知道少数保险公司、
              药企项目或医院集群是否贡献了大部分收入；也不知道 480 万健康管理人群中有多少仍然活跃， 处方重复发生的频率有多高，企业账户是否会随时间扩张。


              不同品类还有各自风险。医院端处方流仍是入口层面的守门人。保险产品规模有意义，但圆心不承保产品， 因而依赖保险公司意愿和合作经济性。药企客户覆盖面令人印象深刻，但关系能持续多久，取决于商业化 ROI 和合规。
              监管文件和官方页面呈现出一台成熟的客户机器；它们没有呈现的是这些客户队列的质量。这正是本章最大的尽调缺口。
