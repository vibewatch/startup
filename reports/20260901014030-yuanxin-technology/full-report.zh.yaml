      - number: '8.4'
        title: 退出就绪度和最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              圆心比早期医疗科技创业公司更接近退出就绪，但仍缺少可投资的清晰度。反复递交香港上市申请， 显示管理层有韧性、文档准备也够深；但同样说明，市场还没有按其开价接受这个故事。最大的缺失变量不是业务是否存在，
              而是从今天已经有规模但毛利很薄的模式，通往更有韧性的上市公司自由现金流画像，中间那座盈利桥的质量。 投资者仍需要准确的股权结构表和清算优先权、门店优化后的同店药房队列、保险公司和药企的合同续约质量，
              以及分业务贡献利润率，用来把高价值商业化服务的经济性从低毛利药品流通中拆出来。


              这些问题并不学术。如果未来融资或 IPO 定价低于 RMB 19.5B，或者要求很重的优先权保护， 即使公司继续增长，普通股上行空间也可能被大幅压缩。反过来，如果尽调发现续约率强、利润率真实抬升、治理干净，
              当前头部估值就可能从偏紧走向合理。最终判断是中等信心观察：圆心有足够战略相关性，值得密切跟踪； 但披露的估值支撑还不够，不足以建议追逐当前隐含入场价。
