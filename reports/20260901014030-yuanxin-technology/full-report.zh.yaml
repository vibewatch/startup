  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议和入场纪律
        blocks:
          - type: paragraph
            body: >-
              圆心值得持续跟踪，因为公司确有运营规模，不只是创业叙事。2026 年香港申请文件和独立摘要显示， 2025 年收入为 RMB 10.377B，拥有 201 家药房，妙手医生月均访问量约 2700 万次，合作
              230 家保险公司和 10 家再保险公司，服务 506 家制药企业，并通过医疗科技流程服务 537 家医院。对一家中国民营医疗科技平台来说，
              这是一套少见的广域基础设施。多轮上市周期失败后，公司仍然相关，原因也在这里：很少有同业能在这个规模上同时组合患者入口、 特药药房、保险赋能和药企商业化服务。


              但估值纪律比欣赏更重要。2026 年 7 月围绕最新招股书的反向报道称，圆心将隐含估值下调 30% 至 RMB 19.5B。 对应 2025 年收入，约为 1.9x
              市销率。浅看，这低于许多软件式医疗科技公司。硬看，对一家 2025 年收入仅增长 1.7%、 毛利率 9.9%、净亏损 RMB 400.9M、现金显著下降，且六次递表后 IPO
              仍未过会的公司来说，这个价格并不轻松。 因此，基于公开证据的正确姿态是观察：资产质量真实，但披露价格还没有给出清晰安全边际。
