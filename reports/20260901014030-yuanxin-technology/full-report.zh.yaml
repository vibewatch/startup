  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与价值主张
        blocks:
          - type: paragraph
            body: >-
              Yuanxin
              的客户基础天然是多边的。患者是终端用户，需要获得创新药、专科随访、续药、支付能力支持和用药管理服务。医院是机构客户和流程锚点，因为诊断、处方开具和互联网医院协作都从这里开始。保险公司和再保险公司购买或共同开发药品保障、理赔和健康管理服务。药企购买商业化加速、患者招募、患者管理和真实世界研究支持。医生既是产品用户，也是渠道赋能者。官网很好地概括了这一点：集团向患者、医生、医院、药企和保险公司交付价值，而不是服务单一客户类型。


              价值主张也因分层而不同。对患者，卖点是可及性、便利和财务减负；对医院，是更聪明的流程和长期患者管理；对保险方，是产品设计、定价、理赔和风控；对药企，是商业化、患者招募和随访。这意味着 Yuanxin
              应被理解为一个 B2B2C 平台：消费者流量重要，但经济性高度依赖企业和伙伴关系。因此，客户问题不只是「这个 App 有多少用户」，而是这些相互嵌套的分层能否彼此强化，支撑重复使用和预算续约。
