  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险清单
        blocks:
          - type: paragraph
            body: >-
              圆心所处的是中国数字服务里监管最严的领域之一：在线医疗、处方、特药履约、健康保险流程、医疗数据， 以及面向药企的商业化支持。核心互联网医疗规则本已严格。2018 年国务院意见和 2019 年试行办法允许互联网医院
              以及常见病、慢性病在线复诊，但要求具备医疗机构资质、执业医师、药师审核和可追溯数据； 同时禁止互联网首诊。对圆心而言，这些规则不是背景噪音，而是在塑造产品本身。复诊处方、药品配送或机构准入资格一旦收紧，
              核心流程会被直接击中。


              2026 年，合规面还在扩大。Arnold & Porter、Chambers、ICLG、Global Legal Insights 等机构的法律和政策评论 都指向更强的药企反腐、医保基金欺诈、医疗数据和
              AI/医疗软件治理执法。Cisema 对 2026 年药品监管修订的解读显示， 中国正走向药品和数字供应链全生命周期监管；隐私法评论也强调，敏感健康数据需要同时面对《数据安全法》和《个人信息保护法》
              的严格约束。合在一起，这既提高直接法律风险，也推高运营成本。圆心的整合模式只有在临床、药房、保险方和数据合规义务始终对齐时才跑得通。
