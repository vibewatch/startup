            body: >-
              圆心披露具名合作方时，公开客户证明最强，而不是只给匿名数量。招股书里程碑表显示， 公司 2018 年 12 月与太平人寿合作推出首款医疗保险产品。2025 年 10 月，招股书还称圆心与首都医科大学
              国家医疗保障研究院签订真实世界研究合作协议。2025 年 11 月 Pfizer 文章披露更多细节：圆心是 Pfizer China 的长期生态合作伙伴，双方围绕 DTP
              药房分级、院店联动和患者管理流程进入新一阶段合作。这些具名案例重要， 因为它们说明圆心面对的是保险、研究和药企等真实交易对手，而不只是发布汇总数量。


              重复使用逻辑也嵌在流程里。慢病管理、复诊处方、电子用药史、健康管理服务、理赔协助和患者分组， 都指向持续互动，而不是一次性交易。官方页面明确把妙手定位为诊后管理工具，把惠保定位为持续健康管理和理赔平台，
              把药房网络定位为本地长期用药网络。因此，合适的留存口径不只是传统消费 App 的 DAU/MAU， 而是复诊处方捕获、疗程连续性、保险服务续约和药企项目扩张。遗憾的是，这些更深层的留存指标并未公开。
