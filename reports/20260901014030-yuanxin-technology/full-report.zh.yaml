      - number: '7.4'
        title: 缓释因素和否决条件
        blocks:
          - type: paragraph
            body: >-
              缓释逻辑并非空白。圆心有真实牌照、深度院边位置、保险和药企广度，以及能制造切换摩擦的患者管理架构。 公司也已经证明过一项重要纠偏：降低批发敞口，并在 2025 年实现经营现金流转正。但这些只是缓释因素，
              不是业务已经脱险的证明。合适的承销姿态，是把否决条件定义清楚：如果流动性继续收缩，且 IPO 或融资没有落地；
              如果监管显著压窄电子处方或在线复诊空间；如果同店药房生产率不及预期；如果保险公司、医院或药企续约质量变弱； 或者出现重大数据 / 隐私事件，乐观逻辑就应迅速重估。


              这一点重要，因为圆心的风险传导是跨职能的。政策变化会减少处方流，进而削弱药房吞吐，影响患者可及性， 降低保险公司和药企价值，最终恶化现金生成。反过来，更好的标准化、数据治理和合作方留存可见度，
              可以显著降低资产风险。举证责任在圆心：它需要证明整合模式能在更紧的流动性和更严的监管下保持韧性， 而不只是讲一个大市场增长故事。
