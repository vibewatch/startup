  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 类型
      - 当前倍数 / 估值
      - 相关性
      - 可能误导之处
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most relevant public Chinese digital-health comparables plus private funding references retained for
        this run, but not every hospital IT, pharmacy retail, or biotech services peer that could influence pricing.
    rows:
      - - JD Health
        - 上市在线医疗 / 药房平台
        - 1.28x 销售额；EV/sales 0.69x
        - 大规模上市中国健康平台，药房敞口显著
        - 盈利能力和资产负债表远强于 Yuanxin
      - - Ping An Healthcare
        - 上市在线医疗 / 管理式医疗平台
        - 2.20x 销售额；EV/sales 1.05x
        - 最接近的上市混合服务基准，具备医疗服务复杂度
        - 产品组合和母公司生态不同；仍不是精确的全链条创新药可比公司
      - - Alibaba Health
        - 上市电商 / 医疗健康平台
        - 1.28x 销售额；EV/sales 0.99x
        - 显示超大规模中国上市医疗健康电商资产的交易位置
        - 电商驱动模型更宽，经济性也强于 Yuanxin
      - - Fangzhou
        - 上市在线慢病 / 药房平台
        - 0.22x 销售额；EV/sales 0.12x
        - 市场压力下药房相关数字健康上市模型的下行情景参照
        - 规模更小、组合不同，且估值已深度压缩
      - - Yidu Tech
        - 上市健康数据 / AI 平台
        - 4.23x 销售额；EV/sales 1.78x
        - 显示市场有时会为数据 / 软件叙事支付倍数溢价
        - 收入组合比 Yuanxin 更像软件
      - - Medlive
        - 上市医生平台 / 数据服务
        - 7.60x 销售额；EV/sales 3.57x
        - 说明轻资本、数据中心型医疗资产可筛出更高销售倍数
        - 资产太轻，无法直接作为 Yuanxin 可比公司
      - - Series F / 私募融资背景
        - 私募融资参照
        - 2021 年 8 月融资超过 RMB 1.5B；累计融资约 $933M
        - 帮助界定当前标题估值下的稀释和优先权悬挂风险
        - 融资金额无法揭示今天普通股的有效价值
      - - 最新 IPO 前估值
        - 私募标题估值
        - 据 2026 年 7 月报道，30% 折让后为 RMB 19.5B
        - Yuanxin 自身当前最新的公开锚点
        - 标题估值未必等于干净、可投资的入场价
    notes: 可比公司倍数是当前公开筛选指标，私募行更多是背景信息，而非可直接比较的市场出清价值。
