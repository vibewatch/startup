      - number: '6.2'
        title: 客户规模与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              2026 年招股书披露了少见的规模细节，这在中国民营医疗健康平台里并不多见。 2025 年，妙手医生月均访问量约 2700 万次。截至 2025-12-31，圆心药房在 27 个省级地区经营 201
              家院边店，并与 537 家医院合作，其中包括 220 多家顶级三甲医院。支付方一侧，圆心已服务 230 家保险公司和 10 家再保险公司，自 2018 年以来管理 2.466 亿份保单，并通过健康管理服务覆盖约
              480 万人。药企一侧，公司累计服务 506 家制药企业，覆盖中国收入排名前 20 的本土药企中的 19 家， 以及按 2024 年收入计算全球前 20 药企中的 19 家。


              这些规模指标需要谨慎解读。保单数是累计口径，不等于活跃保障人群，也不能等同于单客户收入。 同样，2700 万月访问量代表流量，不是付费订阅用户。即便如此，公司在各类客户中的渗透广度仍然突出：
              能同时拿出大规模患者流量、广泛医院合作、宽保险公司覆盖和数百家药企关系的数字医疗平台并不多。 这套采用路径也更像长期累积，而不是病毒式扩散。公司获客主要靠院边场景、保险产品上线、药房网点和商业化合作， 纯 DTC
              增长并不是唯一引擎。
