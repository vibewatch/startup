  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品堆栈与模块
        blocks:
          - type: paragraph
            body: >-
              Yuanxin 可见的产品堆栈有四个主要模块。Miaoshou Doctor 是面向消费者和医生的互联网医疗层。官方材料称，该产品 2017
              年上线，持有互联网医院医疗执业许可证，支持在线问诊、复诊处方和慢病管理。Apple App Store
              描述补充了实际用例：添加门诊医生进行一对一随访、预约专家、在线转诊、购药、送药到家、病历管理和快速咨询。这不只是分诊 App，而是诊断后的连续性层，目的在于把患者留在 Yuanxin 的用药和服务闭环内。


              第二个模块是 Yuanxin Pharmacy，即履约层。官方材料称，截至 2025-12-31，集团在 27 个省级地区运营 201
              家院边药房，聚焦专科治疗领域，并由专业用药指导、冷链配送和本地快速履约支撑。第三个模块是 Yuanxin Medical Technology，集团称 2019
              年开发该业务，帮助医院——尤其是顶级医院——数字化运营并支持长期患者管理；截至 2025 年底，它已与 537 家医院合作。第四个模块是 Yuanxin Huibao，即支付和保障层，定位为「保险 + 医疗 +
              医药」平台，提供惠民保险、药品保险、健康管理和理赔调查。合在一起，这套产品堆栈意在控制患者从诊断相邻可及性到报销和续药支持的旅程。
