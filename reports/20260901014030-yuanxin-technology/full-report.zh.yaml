        title: 专门和相邻竞争者：Medlive、DXY、Fangzhou、Yidu Tech
        blocks:
          - type: paragraph
            body: >-
              Medlive 和 DXY 从市场的专业端压迫 Yuanxin。StockAnalysis 将 Medlive
              描述为在线专业医生平台，向药企客户提供精准营销、数字化拜访、数字营销咨询、数字内容创作和软件开发服务。同一来源显示其过去收入为 RMB 645.32 million，员工 724 人，市值 HKD 5.66
              billion，这意味着公开投资人仍给予医生注意力资产显著高于药品履约业务的销售倍数。DXY 则被 World Economic Forum
              描述为中国领先的数字医疗科技平台，连接医院、医生、科研人员、患者、药企和保险方。它声称拥有超过 100 million 公众用户和 5.5 million
              专业用户，覆盖内容、在线学习、在线问诊、电商和线下基层医疗。这让 DXY 深入触达药企营销和医生互动——也是 Yuanxin 出售服务的领域。


              Fangzhou 是互联网医院和慢病侧更接近的交易型同业，但规模更小。StockAnalysis 显示其过去收入 RMB 3.86 billion，员工 494 人，市值仅 HKD 983.67
              million，说明当增长和盈利能力没有清晰确立时，公开投资人会怀疑这类模式。Yidu Tech 与其说是药房对手，不如说是医院数据 / AI 相邻竞争者，年度收入 RMB 819.30 million，员工
              754 人，市值 HKD 3.94 billion。这些专门玩家共同说明 Yuanxin 战场的碎片化：医生心智、医院数据、慢病流程和数字商业化都分别有人争夺，因此 Yuanxin 需要生态深度，而不是只有
              App 流量。
