  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与结构迁移
        blocks:
          - type: paragraph
            body: >-
              Yuanxin 披露的规模远大于大多数数字医疗创业公司，但收入基础仍由实体药品履约主导，而不是软件。2026 年招股书将收入分成三块：商业化履约网络、商业化加速服务和医疗科技服务。总收入从 2023 年 RMB
              9.737 billion 增至 2024 年 RMB 10.205 billion、2025 年 RMB 10.377 billion，增速放缓，意味着 2024 年约增长 4.8%，2025 年仅约增长
              1.7%。关键变化在结构。院外药房和医疗服务从 2023 年 RMB 6.059 billion 增至 2025 年 RMB 8.109 billion，占收入比重从 62.2% 升至
              78.1%；批发药房收入则从 RMB 3.152 billion 降至 RMB 1.636 billion，占比从 32.4% 降至 15.8%。这是申报文件中最重要的财务故事：Yuanxin
              在收缩低利润率批发层，同时更重押院边配药及相关服务。


              在核心业务之下，商业化加速服务仍有意义，但规模仍小。保险服务从 2023 年 RMB 289.1 million 增至 2025 年 RMB 334.9 million，面向药企的营销服务从 RMB 186.5
              million 增至 RMB 214.1 million。医疗科技服务从 RMB 50.5 million 增至 RMB 83.0 million，但仍只贡献 2025 年收入的
              0.8%。官方收入确认说明解释了为什么软件式估值启发式不适用：履约收入在销售或交付时确认，保险收入来自佣金、服务费或与保费管理挂钩的固定费用，医院科技收入则在项目服务完成时确认。这是一张混合医疗服务和分销损益表，不是高毛利纯
              SaaS 模式。
