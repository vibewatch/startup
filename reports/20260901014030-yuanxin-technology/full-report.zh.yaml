      - number: '2.2'
        title: TAM、SAM 与实用测算视角
        blocks:
          - type: paragraph
            body: >-
              最高质量的市场规模视角来自 Yuanxin 2026 年申报文件附带的 Frost & Sullivan 附件。附件将中国整体医药市场规模放在 2024 年 RMB 1,629.7 billion、2030 年
              RMB 2,129.7 billion，但更相关的子市场增长更快。中国创新药市场 2024 年增至 RMB 309.9 billion，预计 2030 年达到 RMB 606.5 billion；专科药房市场
              2024 年增至 RMB 102.7 billion，预计 2030 年达到 RMB 219.4 billion。Frost
              明确把这一加速与处方外流、医院外分销扩张、报销纳入提速，以及首份商业健康险创新药目录联系起来。在这个框架下，Yuanxin 的实际 SAM 更接近创新药可及性和专科药房，而不是全部医疗，甚至也不是全部数字医疗。


              更宽泛的分析师估算说明了为什么必须交叉校准。IMARC 称中国数字医疗市场 2025 年达到 USD 94.9 billion，并可能在 2034 年以 15.48% CAGR 达到 USD 359.9
              billion；MRFR 则仅将 2024 年中国数字医疗规模定为 USD 16.5 billion，并预计 2035 年以 19.83% CAGR 升至 USD 120.67
              billion。这些数字并非直接矛盾，而是口径不同：它们打包了不同组合的远程医疗、医疗 App、医疗 IT、可穿戴设备、分析和服务。对 Yuanxin
              来说，更好的自下而上锚点是药房加创新药堆栈，以及其自身市场位置证据。Frost 排名表显示，Yuanxin 2024 年收入 RMB 10.2 billion、年度创新药交付价值 RMB 4.8
              billion、自有专科药房 237 家；即便没有公开来源精确拆出其可服务 SOM，这也说明它在专科履约层已有真实份额。
