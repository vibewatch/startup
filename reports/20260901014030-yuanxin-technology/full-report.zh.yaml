  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 隐含估值区间
      - 关键风险
      - 概率信号
    rows:
      - - 悲观
        - 市场主要把 Yuanxin 视为低利润率药房触达运营商；增长维持低个位数；融资压力重新出现
        - RMB 10.4B-12.5B（约 2025 年收入的 1.0x-1.2x）
        - 降价轮融资、流动性压力，或门店 / 生产率再度走弱
        - 若 IPO 时间再次滑坡，或上市可比公司估值下修，该情景有现实可能
      - - 基准
        - 规模仍有价值；批发占比维持较低；商业化服务逐渐更重要；没有重大监管冲击
        - RMB 14.5B-19.7B（约 2025 年收入的 1.4x-1.9x）
        - 利润率改善来得较慢；披露仍不完整；市场仍要求折价
        - 公开证据下最站得住的区间
      - - 乐观
        - 同店生产率改善，合作伙伴续约强劲，利润率扩张，IPO 以干净条款跑通
        - RMB 20.8B-27.0B（约 2025 年收入的 2.0x-2.6x）
        - 当前公开证据尚未证明该情景；取决于私下尽调和市场窗口
        - 有可能，但开放来源还不足以承销
    notes: 区间是示意性的股权价值带，不是目标价。它们基于 2025 年收入和可比倍数逻辑，而非折现现金流的精确测算。
