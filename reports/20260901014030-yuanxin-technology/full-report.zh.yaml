      - number: '8.2'
        title: 投资逻辑、反向逻辑和可比视角
        blocks:
          - type: paragraph
            body: >-
              正向逻辑先看结构。Frost & Sullivan 随 HKEX 申请附上的材料显示，按 2024 年总收入计， 圆心在中国全链条创新药商业化服务提供商中排名第一；公司 2024 年收入 RMB 10.2B，拥有
              237 家自有特药药房。 同一批材料还称，特药药房市场将从 2024 年的 RMB 102.7B 增长到 2030 年的 RMB 219.4B； 创新药市场同期将从 RMB 309.9B 增长到 RMB
              606.5B。叠加圆心在保险公司、医院和药企端的广度， 这支撑的是一个真实平台逻辑，而不是单一产品交易。


              反向逻辑在于，引用的 IPO 前估值已经要求投资者穿透几个未解决问题。公开市场同业因业务组合不同，收入倍数差异很大： JD Health 和 Alibaba Health 约为 1.28x 过去 12
              个月收入，Ping An Healthcare 约为 2.20x，Fangzhou 为 0.22x， Yidu 为 4.23x，Medlive 为 7.60x。圆心隐含 1.9x 倍数低于软件和数据类公司，
              但高于许多已上市且已盈利的低毛利药房 / 流通平台。这意味着，公司并不会因为处于私募后期就显得明显低估。 只有投资者相信圆心能把规模转化为更高利润率、更干净披露，并最终获得公开市场信任，这个倍数才成立。
