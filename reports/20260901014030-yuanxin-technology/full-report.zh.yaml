      - number: '8.3'
        title: 乐观、基准和悲观情景逻辑
        blocks:
          - type: paragraph
            body: >-
              圆心当前公开价格锚点是头部 IPO 前估值，而不是已完成融资或市场出清 IPO，因此情景分析应表达为与收入倍数和承销假设绑定的估值区间。 悲观情景按 2025 年收入约 1.0x-1.2x 估值，即约 RMB
              10.4-12.5B。如果增长维持在低个位数、现金继续紧张、 公开市场仍主要把圆心视为低毛利药房入口运营商，或新一轮定价低于当前递表估值，这一结果就说得通。


              基准情景采用约 1.4x-1.9x 收入，即 RMB 14.5-19.7B。这个区间承认圆心的真实规模、创新药商业化品类领导地位， 以及批发收缩后药房组合和保险 /
              药企流程继续改善的可能性。同时，它仍相对软件型公司打折， 因为公开数据还没有证明公司具备持久高毛利经济性。乐观情景需要 2.0x-2.6x 收入，即 RMB 20.8-27.0B；
              只有圆心证明同店药房生产率更好、合作方续约更强、利润率扩张且 IPO 路径干净，这一区间才有正当性。 换句话说，公开证据可以支撑一个可跟踪的基准情景，但还不足以支撑买入级上行情景。
