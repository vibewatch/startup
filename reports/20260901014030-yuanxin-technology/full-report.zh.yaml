      - number: '5.4'
        title: 产品成熟度、路线图与基准压力
        blocks:
          - type: paragraph
            body: >-
              公开路线图是隐含的，而不是完整披露的。最清晰的里程碑包括：2017 年 Miaoshou Doctor 上线，2019 年医院科技扩建，2023 年 11 月 Yuanquan AI 商业化履约网络和
              Huibao 在线保险平台上线，以及 2025 年获评中国 AI 大模型商业化 Top 20 公司。Apple App Store 在 2026-04-30 更新至
              6.4.40，显示核心消费者产品仍在维护；Pfizer 案例则表明，Yuanxin 正试图从简单配药走向标准化、数据密集的患者管理和研究流程。因此，合理的成熟度地图是：App
              和药房运营成熟，保险流程成熟，医院科技能力增长，早期 AI 叠加层用于流程标准化和扩大患者管理触达。


              竞争产品压力在上升。Ping An 公开披露的 2024 年 Medtronic 合作描述了「1-1-3-12」主动健康管理服务体系和全病程慢病管理承诺；2026 年 PRNewswire 新闻稿则将 AI
              医疗赋能框定为持续提升盈利能力的一部分。JD Health 的公开描述也包括居家护理服务、转诊、在线咨询和技术服务。换句话说，Yuanxin 的前端功能并不独特。它的差异化取决于能否比对手更好地把这些前端工具与
              DTP 药房分级、保险方流程和医院—门店联动整合起来。公开可见的路线图缺口仍然明显：没有详细架构披露，没有正常运行时间或集成指标，也没有模块级采用情况披露，因此投资人能看到产品广度，但还看不到产品效率。
