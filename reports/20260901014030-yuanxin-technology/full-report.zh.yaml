      - number: '2.3'
        title: 买方、用户、支付方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Yuanxin 服务的是多边市场，因此用户往往不是预算所有者。患者使用 Miaoshou Doctor 和 Yuanxin
              药房，是因为他们需要便捷获得处方疗法、续药、支付能力支持和随访服务。医院是互联网医院建设和流程数字化的机构买方，通常支付项目制服务费，或在处方外流和随访护理需要延伸到院外时接入
              Yuanxin。药企购买商业化服务，因为创新药放量越来越依赖院外履约、患者教育、依从性支持和真实世界随访，而不只是医院进药。保险公司和再保险公司购买产品设计、理赔、结算和健康管理流程，因为商业保障可以弥合
              NRDL 留下的缺口。


              因此，采用路径要穿过政策允许但运营复杂的流程。患者先在实体机构确诊，通过持牌互联网医疗流程获得随访和电子处方支持，再通过院边药房或协同配送完成履约，随后在相关场景进入保险方或药企赞助的支持项目。当这些角色都想要同一件事——以更低摩擦更快获得创新疗法——Yuanxin
              就受益。但每个利益相关方的购买触发点不同：医院看合规和流程效率，保险方看理赔控制和差异化产品，药企看商业化触达，患者看可及性和支付能力，医生看治疗连续性。这种复杂性提高了切换成本，也拉长销售周期，让市场很难用一个简单的「软件
              TAM」概括。
