      - number: '4.2'
        title: 盈利能力与单位经济
        blocks:
          - type: paragraph
            body: >-
              2025 年的表面盈利趋势明显改善，但仍脆弱。招股书数据显示，毛利润从 2023 年 RMB 911.2 million 到 2024 年 RMB 793.9 million，再到 2025 年 RMB
              1,022.6 million；毛利率从 9.4% 降至 7.8%，再回升至 9.9%。净亏损从 2023 年 RMB 719.0 million 扩大到 2024 年 RMB 1,094.1
              million，2025 年又大幅收窄至 RMB 400.9 million。Non-IFRS 调整后净亏损从 2023 年 RMB 677.2 million 到 2024 年 RMB 939.0
              million，再到 2025 年 RMB 260.2 million；调整后 EBITDA 也从 2024 年负 RMB 696.6 million 改善至 2025 年负 RMB 52.0
              million。这是真实运营修复，不只是财务工程，但公司经营十年后仍未达到盈亏平衡。


              2024 年的恶化同样有信息量。招股书称，其他开支和亏损在 2024 年升至 RMB 270.0 million，主要来自 RMB 175.8 million 无形资产减值、RMB 19.2 million
              药房关停损失，以及 RMB 18.2 million 或有对价公允价值变动。与此同时，2025 年费用纪律可见：销售和分销费用从 2024 年 RMB 1.098 billion 降至 RMB 966.4
              million，行政开支恢复至 RMB 297.3 million，R&D 降至 RMB 114.0 million。负面解读是，Yuanxin 的单位经济仍然结构性偏窄。9.9% 毛利率好于 2024
              年，但仍远低于软件常态，意味着可持续利润靠更紧的 opex 和结构纪律，而不是只靠收入增长。
