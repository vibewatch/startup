      - number: '4.4'
        title: 公开财务缺口与尽调优先级
        blocks:
          - type: paragraph
            body: >-
              最重要的缺口不是收入数字，而是数字下面的经济性。招股书没有公开分部层面毛利率、门店层面贡献利润率、药房回本期、保险客户盈利能力、各业务线销售效率，或主要医院、保险方和药企客户的集中度数据。这意味着投资人能看到公司正在降低批发权重，却还看不清药房履约、保险服务和药企商业化各自到底创造了多少利润率。门店基础也有类似限制：申报文件显示门店数减少和靠近医院，但没有披露同店销售、同店利润率或关店经济性。


              因此，公开市场准备度仍更多依赖叙事，而不是可完全审计的运营架构。后期投资人可以承销方向——批发更少、opex
              控制更好、经营现金流转正、亏损缩小——但在拿到门店队列、队列层面患者经济性、与理赔挂钩的保险方盈利能力和客户集中度之前，应把 2025 年改善视为暂时性。Yuanxin 的财务故事可信到足以支持一次 IPO
              尝试，但仍不完整，关键承销问题仍是利润率耐久性，而不是收入规模。
