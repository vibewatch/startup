        - 经营规模和市场领导地位真实存在，但当前隐含价格并不明显便宜
        - 将 Yuanxin 留在观察名单；没有新增尽调前，不要在入场价上放宽
      - - 信心
        - 中
        - 估值锚点已公开，但股权结构表条款、分部经济性和合作伙伴续约披露仍不足
        - 将情景区间视为决策辅助，而非点估值
      - - 风险评级
        - 高
        - 亏损仍在持续，流动性依旧紧张，监管较重，六次递表显示执行风险
        - 安全边际要求应高于轻资产软件公司
      - - 估值立场
        - 偏高
        - RMB 19.5B 约等于 2025 年收入的 1.9x，高于 JD / Alibaba 类低利润率上市可比公司
        - 不要把「低于软件可比公司」等同于「便宜」
      - - 上调判断所需条件
