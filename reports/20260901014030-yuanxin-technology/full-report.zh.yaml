      - number: '5.3'
        title: 信任、合规与关键依赖
        blocks:
          - type: paragraph
            body: >-
              Yuanxin
              做的是用药、处方和保险，而不是低风险健康管理，因此信任和合规是核心产品属性。应用商店披露明确警示，服务不能替代线下诊断，并要求用户提供准确的随访信息和合适的复诊凭证。官方页面强调平台医疗执业许可证，以及连接「医生、患者和药」的角色。药房产品同样依赖用药安全流程，包括处方审核、专业药师指导、自营门店和冷链完整性。Huibao
              的理赔调查和风控定位表明，保险可信度也是另一层核心信任。


              这些信任层带来真实运营依赖。系统依赖医院整合来完成合规诊断和转诊，依赖药师进行专科药审核和咨询，依赖可靠配送处理对时间和温度敏感的药品，依赖保险方扩大支付，依赖药企伙伴支持可及性和患者支持流程。因此，平台不是轻量软件。一旦监管收紧、医院协作变弱或药房标准化滑坡，产品质量会很快下降。这种依赖有两面：它提高执行风险，也比独立远程医疗
              App 创造了更难复制的产品护城河。
