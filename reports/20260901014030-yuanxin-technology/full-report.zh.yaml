chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、定位与三支柱模式
        blocks:
          - type: paragraph
            body: >-
              Yuanxin Technology 的法律主体是 Beijing Yuanxin Technology Group Co., Ltd.，成立于 2015-03-20，总部位于北京丰台区。2026 年 HKEX
              申请版本是最清晰的身份锚点：文件称，按 2024 年收入和年度交付价值计，集团是中国最大的创新药商业化全链条服务提供商，商业模式连接患者、药企、医疗专业人员、医院和保险方。落到运营层面，公司有三根可见支柱。第一是
              Miaoshou Doctor / Miaoshou Physician，一个在线医疗和随访平台，用在线问诊、续方、慢病支持和送药到家来补充医院服务。第二是 Yuanxin
              Pharmacy，一个院边线下加线上药房网络，集中布局在三级医院附近，面向创新药配药，而不是普通便利零售。第三是 Yuanxin
              Huibao，保险服务和技术部门，设计、营销、管理并结算与创新药可及性和患者支付能力挂钩的商业健康险产品。


              集团官网用医生、医疗科技、药房、Huibao 保险、服务案例和招聘等独立页面进一步验证了这套运营结构；Miaoshou 网站和应用商店页面也显示，2026 年患者端产品仍在活跃。产品架构之所以重要，是因为
              Yuanxin 不只是靠流量竞争的在线问诊
              App。它的主张是一条闭环：医院处方外流、专门化履约、患者管理、支付协调，以及面向药企的商业化支持。这让公司在结构上更接近创新药基础设施平台，而不是单一功能的远程医疗市场。也因此，集团披露对药房、保险方和药企客户的强调，至少不低于终端用户问诊活动。
