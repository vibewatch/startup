      - number: '1.3'
        title: 规模、里程碑与负面背景
        blocks:
          - type: paragraph
            body: >-
              到 2025 年底，Yuanxin 在运营上已达到有意义的规模。药房网络有 201 家门店，其中 183 家位于医院一公里内，SKU 达 42,585 个，并广泛覆盖 2015
              年以来获批的创新肿瘤药和其他创新药。Miaoshou Physician 在 2025 年平均月访问用户约 27 million。保险部门已服务 230 家保险公司和 10 家再保险公司，协助在 180
              多个城市推出普惠型商业健康险产品，管理 246.6 million 份保单，并向约 4.8 million 人提供相关健康管理服务。营销服务业务累计服务 506 家药企，覆盖按 2024 年收入计中国前 20
              大本土药企中的 19 家，以及全球前 20 大药企中的 19 家；医疗科技服务则与 537 家医院合作，其中包括 220 多家三甲医院。


              这些规模指标嵌在一条很长的里程碑序列里。公司 2015 年成立，2015 年底启动院外药房服务，2018 年推出保险服务，2019 年底上线药企营销服务，并在 2019
              年开发医院科技服务。公开市场野心一直持续：Sina 2026 年 4 月回顾称，Yuanxin 曾在 2021 年 10 月递表，2022 年两次递表，2023 年两次递表，2024 年 2 月通过香港聆讯，并在
              2026-04-22 第六次递表，Huatai International 为独家保荐人。负面信号是，持续推进伴随经济条件重置。2026 年 7 月批判性报道提到，估值下调 30% 至 RMB 19.5
              billion，现金余额下降，自有药房从 2023 年 335 家缩至 2025 年 201 家。这并不否定平台的真实规模，但说明从生态广度走向公开市场质量的路径仍未走完。
