  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合与分层
        blocks:
          - type: paragraph
            body: >-
              不应只拿 Yuanxin 对标一种竞争对手。其模式至少与四类竞争集群重叠：JD Health、Ping An Health 等消费者在线健康平台；Medlive、DXY
              等医生内容和药企营销专门平台；Fangzhou 等在线慢病 / 互联网医院商业玩家；以及 Yidu Tech 等医院数据或 AI 相邻公司。WeDoctor
              仍是中国在线健康领域有认知度的品牌，但关于其当前业务的公开来源质量弱于上市同业。Alibaba Health 也重要，因为它结合了更广的消费者流量、电商能力和医疗服务，即便模式与 Yuanxin
              不完全相同，也能压迫药房经济性。


              这种分层很重要，因为 Yuanxin
              与每个竞争对手的重叠都只是局部。它不是最大流量平台，不是最大医生媒体网络，不是最大综合健康零售市场，也不是最清晰的纯软件故事。相反，它靠把处方外流、专科配药、医院协作、保险方赋能和药企商业化缝合在一起竞争。这让一些公开可比公司具备方向性参考价值，但并不完美。因此，投资人应沿着具体购买标准比较
              Yuanxin——专科药房密度、院边位置、保险方整合、药企服务深度和公开市场准备度——而不是把宽泛的「数字医疗」同业简单平均。
