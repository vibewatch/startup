      - number: '1.2'
        title: 管理层、所有权与资本基础
        blocks:
          - type: paragraph
            body: >-
              创始人 He Tao 仍是关键人物。招股书将其列为执行董事、董事长兼首席执行官，并披露其此前在 J1.com/Guoda Jianyiwang 和深圳三九药房运营的管理经历。其余披露的运营班底与 Yuanxin
              的混合模式相匹配：He Weizhuang 负责医疗运营和用户关系，Zhang Huanchang 负责医药零售，He Guofeng 作为董事会秘书覆盖财务和投资者关系，Wen Jing 在 PwC
              长期任职后出任 CFO。Tencent 与 HongShan/Sequoia China 分别通过 Hao Rui 和 Zhou Kui 取得非执行董事代表权，显示战略和财务投资方仍保有治理可见度。2026
              年申报文件称，董事会将由四名执行董事、两名非执行董事和三名独立非执行董事组成。


              按中国数字医疗标准，Yuanxin 的资本形成规模很大。INCE Capital 的官方投资人评论确认，2021 年 8 月 Series F 超过 RMB 1.5 billion，Sequoia、B
              Capital Group、OrbiMed、UOB、INCE Capital 等参与，之前还完成过 D 轮和 E 轮融资。InforCapital、VCBeat 等独立跟踪页面将累计融资放在约 US$971
              million / 约 RMB 5 billion，横跨五轮主要融资，公司处于 IPO 前阶段。这个宽广投资人阵容有两层含义：它验证了机构对 Yuanxin 全链条模式的兴趣，也意味着公司在多年未完成 IPO
              的情况下持续背负私募市场预期。2026 年申请仍呈现一家背靠强投资方、治理可见的公司，但其公开市场转身比融资历史暗示的更难。
