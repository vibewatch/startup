      - number: '5.2'
        title: 运营流程与架构
        blocks:
          - type: paragraph
            body: >-
              平台架构以流程为中心，而不是以功能为中心。在医生侧，Miaoshou
              像云诊室，提供在线问诊、患者分组、医生教育、电子处方和专业药事服务入口。在机构侧，同一系统向医院提供智能处方、在线诊疗和专科科室赋能工具，同时提供面向药企的患者招募和数字营销。在药房侧，Yuanxin
              门店不是简单取药点：它们延伸出处方核验、咨询、冷链配送和按治疗方案定制的服务。在保险侧，Huibao 支持产品设计、定价、理赔调查、风控，以及多学科会诊、视频问诊、基因检测和重疾支持等健康管理服务场景。


              公开资料中最能看到深层运营架构的窗口，是 2025 年 11 月的 Pfizer 文章。文章描述了一套分级 DTP 药房管理体系：基础药房；专业药房使用 Yuanxin Patient Management
              Platform 做记录、随访、电子用药史和自动 DOT 生成；研究型药房连接专病数据库，支持真实世界研究和研究者发起试验。同一文章称，AI
              工具和智能体能力扩大了标准化服务交付和医院—门店协作。软件流程、结构化患者管理数据和实体配药节点的组合，构成平台独特的技术脊梁。也正因如此，业务在运营上很复杂：软件只有与药师、医生、物流和保险方紧密集成，才能在这里真正跑起来。
