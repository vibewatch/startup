  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: A full current pre-IPO cap table with exact ownership percentages for all major investors after all preferred conversions.
    whyItMatters: Ownership concentration, board control, and preference-stack risk affect both governance and valuation interpretation.
    diligencePath: Review the full shareholding appendix in the final IPO prospectus or request a cap-table schedule in management diligence.
    relatedQuestionRefs:
    - QO009
    - QO011
  - type: conflicting-data
    severity: material
    topic: scale-metrics
    missingEvidence: A reconciled company definition for visits, MAU, stores, and ecosystem coverage across filings, trackers, and official marketing pages.
    whyItMatters: Tracker pages and marketing pages sometimes overstate or mix metrics, which can distort scale assessment and later valuation work.
    diligencePath: Use the final HKEX prospectus as canonical and request metric definitions plus historical bridge tables from management.
    relatedQuestionRefs:
    - QO014
    - QO021
    - QO022
  - type: missing-source
    severity: minor
    topic: founding-story
    missingEvidence: Founders’ original narrative on why the company was started and early product iteration choices.
    whyItMatters: The public filing gives hard facts but not a rich founding story, limiting assessment of founder-market fit.
    diligencePath: Pull founder interviews from Chinese media archives or request founder presentation materials.
    relatedQuestionRefs:
