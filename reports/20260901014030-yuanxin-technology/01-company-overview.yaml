company:
  name: Yuanxin Technology
chapter:
  number: 1
  title: Company Overview
  summary: Yuanxin Technology (圆心科技), operating consumer brand Miaoshou Doctor, is a Beijing-headquartered digital-health and innovative-drug commercialization platform founded on 2015-03-20. By end-2025 it operated a 201-store hospital-adjacent pharmacy network, a 27 million average monthly-visit online medical platform, and an insurance enablement arm serving 230 insurers and 10 reinsurers. The 2026 sixth HKEX filing confirms scale and narrowing losses, but recurring IPO attempts, a 30% valuation haircut to RMB 19.5 billion, and shrinking cash reserves frame the company as a late-stage but still execution-sensitive pre-IPO asset.
sections:
- id: identity-and-three-pillar-model
  title: Identity, positioning, and the three-pillar model
  body: 'Yuanxin Technology is legally Beijing Yuanxin Technology Group Co., Ltd., founded on 2015-03-20 and headquartered in Beijing''s Fengtai District. The 2026 HKEX application proof is the cleanest identity anchor: it describes the group as China''s largest full-chain service provider for innovative-drug commercialization by 2024 revenue and annual delivery value, with a business model that connects patients, pharmaceutical companies, healthcare professionals, hospitals, and insurers. In practical operating terms, the company runs three visible pillars. First is Miaoshou Doctor / Miaoshou Physician, an online medical and follow-up platform that complements hospital care with online consultations, repeat prescriptions, chronic-disease support, and home delivery. Second is Yuanxin Pharmacy, a hospital-adjacent offline-plus-online pharmacy network concentrated near tertiary hospitals and oriented toward innovative-drug dispensing rather than general convenience retail. Third is Yuanxin
    Huibao, an insurance-services and technology arm that designs, markets, administers, and settles commercial health-insurance products tied to innovative-drug access and patient affordability.


    The official group site reinforces this operating structure by exposing separate route pages for doctors, medical technology, pharmacy, Huibao insurance, service cases, and careers, while the Miaoshou site and app-store listings show a still-active patient product in 2026. The product architecture matters because Yuanxin is not only an online-consultation app competing for traffic. Its proposition is a closed loop: prescription outflow from hospitals, specialized fulfillment, patient management, payment coordination, and pharma-facing commercialization support. That makes the company structurally closer to an innovative-drug infrastructure platform than to a single-function telemedicine marketplace. It also explains why group disclosures emphasize pharmacies, insurers, and pharma customers at least as much as end-user consultation activity.'
