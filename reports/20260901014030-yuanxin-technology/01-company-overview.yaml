- calloutType: strength
  title: Yuanxin has built a real multi-sided healthcare network
  body: Unlike pure telemedicine apps, Yuanxin has meaningful scale across dispensing, insurer enablement, hospital integration, and pharma commercialization, which gives it more strategic depth than a single traffic-led healthcare marketplace.
  claimRefs:
  - CO007
  - CO014
  - CO016
  - CO017
- calloutType: risk
  title: Scale has not yet translated into a clean public-market story
  body: The sixth HKEX filing, valuation haircut, cash decline, and store-count reduction show that the company is still proving whether ecosystem breadth can turn into durable, efficiently financed profitability.
  claimRefs:
  - CO023
