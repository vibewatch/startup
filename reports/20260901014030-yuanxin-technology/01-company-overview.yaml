- id: scale-milestones-and-adverse-context
  title: Scale, milestones, and adverse context
  body: 'Operationally, Yuanxin reached meaningful scale by end-2025. The pharmacy network stood at 201 stores, 183 of them within one kilometer of hospitals, with 42,585 SKUs and broad coverage of innovative oncology and other innovative drugs approved since 2015. Miaoshou Physician averaged roughly 27 million monthly user visits in 2025. The insurance arm had served 230 insurers and 10 reinsurers, helped launch inclusive commercial health-insurance products in more than 180 cities, managed 246.6 million policies, and delivered related health-management services to about 4.8 million people. The marketing-services business had cumulatively served 506 pharmaceutical companies, covering 19 of China''s top 20 domestic pharma companies and 19 of the top 20 global pharma companies by 2024 revenue, while healthcare-technology services had worked with 537 hospitals including more than 220 top-tier Class III Grade A institutions.


    Those scale markers sit inside a long milestone sequence. The company was founded in 2015, started out-of-hospital pharmacy services in late 2015, rolled out insurance services in 2018, launched pharma-marketing services in late 2019, and developed hospital technology services in 2019. Public-market ambition has been persistent: Sina''s April 2026 recap says Yuanxin filed in October 2021, twice in 2022, twice in 2023, passed a Hong Kong hearing in February 2024, and returned for a sixth filing on 2026-04-22 with Huatai International as sole sponsor. The adverse signal is that persistence has come with reset economics. July 2026 critical coverage reported a 30% valuation haircut to RMB 19.5 billion, a drop in cash balances, and a reduction in self-owned pharmacies from 335 in 2023 to 201 in 2025. That does not negate the platform''s real scale, but it does indicate that the path from ecosystem breadth to public-market quality remains incomplete.'
