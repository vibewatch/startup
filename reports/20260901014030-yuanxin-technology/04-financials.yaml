company:
  name: Yuanxin Technology
chapter:
  number: 4
  title: Financials
  summary: 'Yuanxin is a large but still low-margin healthcare platform whose 2025 results show real improvement without yet proving durable profitability. The 2026 prospectus discloses revenue of RMB 10.377 billion in 2025, gross margin recovery to 9.9%, net loss narrowing to RMB 400.9 million, adjusted net loss narrowing to RMB 260.2 million, and positive operating cash flow of RMB 138.2 million. The quality of that improvement came from business-mix shift: low-margin wholesale pharmacy revenue fell sharply while out-of-hospital pharmacy and medical services grew to 78.1% of revenue. But cash resources tightened, payables rose, store closures and intangible-asset impairment hit 2024, and the company still lacks public disclosure on segment gross margins, store economics, and customer concentration.'
sections:
- id: revenue-model-and-mix-shift
  title: Revenue model and mix shift
  body: 'Yuanxin''s reported scale is much larger than most digital-health startups, but the revenue base is still dominated by physical drug fulfillment rather than software. The 2026 prospectus divides revenue into three blocks: commercialization fulfillment network, commercialization acceleration services, and healthcare technology services. Total revenue increased from RMB 9.737 billion in 2023 to RMB 10.205 billion in 2024 and RMB 10.377 billion in 2025, a decelerating path that implies roughly 4.8% growth in 2024 and only about 1.7% growth in 2025. The key change was mix. Out-of-hospital pharmacy and medical services rose from RMB 6.059 billion in 2023 to RMB 8.109 billion in 2025, growing from 62.2% to 78.1% of revenue, while wholesale pharmacy revenue fell from RMB 3.152 billion to RMB 1.636 billion and dropped from 32.4% to 15.8% of revenue. This is the most important financial story in the filing: Yuanxin is shrinking a low-margin wholesale layer and leaning more heavily into hospital-adjacent
    dispensing and related services.


    Below that core, commercialization acceleration services remained meaningful but still small. Insurance services moved from RMB 289.1 million in 2023 to RMB 334.9 million in 2025, while marketing services to pharmaceutical companies rose from RMB 186.5 million to RMB 214.1 million. Healthcare technology services grew from RMB 50.5 million to RMB 83.0 million, but still contributed only 0.8% of 2025 revenue. The official revenue-recognition notes explain why software-style valuation heuristics fit poorly: fulfillment revenue is recognized at point of sale or delivery, insurance revenue comes from commissions, service fees, or fixed fees tied to premium administration, and hospital-tech revenue is recognized when project services are fulfilled. This is a blended healthcare-services and distribution income statement, not a high-gross-margin pure SaaS model.'
