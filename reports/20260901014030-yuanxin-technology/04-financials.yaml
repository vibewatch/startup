- id: profitability-and-unit-economics
  title: Profitability and unit economics
  body: 'The headline profitability trend improved materially in 2025 but remains fragile. Prospectus data show gross profit of RMB 911.2 million in 2023, RMB 793.9 million in 2024, and RMB 1,022.6 million in 2025, with gross margin moving from 9.4% to 7.8% and then back up to 9.9%. Net loss widened from RMB 719.0 million in 2023 to RMB 1,094.1 million in 2024 before narrowing sharply to RMB 400.9 million in 2025. The non-IFRS adjusted net loss moved from RMB 677.2 million in 2023 to RMB 939.0 million in 2024 and then to RMB 260.2 million in 2025, while adjusted EBITDA improved to negative RMB 52.0 million in 2025 from negative RMB 696.6 million in 2024. That is real operating repair, not just financial engineering, but it still leaves Yuanxin below breakeven after a decade of operating history.


    The 2024 deterioration is also informative. The prospectus says other expenses and losses rose to RMB 270.0 million in 2024 due largely to RMB 175.8 million of intangible-asset impairment, RMB 19.2 million of pharmacy shut-down losses, and RMB 18.2 million of fair-value changes on contingent consideration. At the same time, 2025 expense discipline was visible: selling and distribution fell to RMB 966.4 million from RMB 1.098 billion in 2024, administrative expense normalized back to RMB 297.3 million, and R&D declined to RMB 114.0 million. The adverse reading is that Yuanxin''s unit economics are still structurally narrow. A 9.9% gross margin is better than 2024, but it remains far below software norms, which means sustainable profits depend on tighter opex and mix discipline rather than top-line growth alone.'
