- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Public status
  - Risk if missing
  - Diligence ask
  rows:
  - - Segment gross margins
    - Needed to separate pharmacy, wholesale, insurance, pharma-services, and hospital-tech economics
    - Not publicly disclosed
    - Mix improvement may not equal margin durability
    - Request segment-level gross margin bridge
  - - Store-level contribution margin / payback
    - Needed to assess pharmacy network quality and closure decisions
    - Not publicly disclosed
    - Store-count changes cannot be valued properly
    - Request cohort store P&Ls by opening year and hospital tier
  - - Customer concentration by hospital / insurer / pharma client
    - Needed to assess bargaining power and renewal risk
    - Not publicly disclosed
    - Large-client dependence may be hidden
    - Request top-10 customer concentrations by segment
  - - Same-store sales and same-store margin
    - Needed to judge whether the remaining pharmacy base is strengthening
    - Not publicly disclosed
    - Network optimization may mask weak underlying demand
    - Request same-store data for 2023-2025
  - - Insurer-service profitability
    - Needed to test whether policy management scale creates economic value
    - Not publicly disclosed
    - Large policy counts may overstate monetization quality
    - Request per-policy revenue and claims-service margin
  - - Patient acquisition cost and retention by therapy cohort
    - Needed to test economics of Miaoshou-driven growth
    - Not publicly disclosed
    - Traffic may be expensive or non-durable
    - Request CAC/LTV by disease area and channel
  notes: The missing data are primarily unit-economics and concentration metrics, not headline financial statements.
