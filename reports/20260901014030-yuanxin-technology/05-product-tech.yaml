company:
  name: Yuanxin Technology
chapter:
  number: 5
  title: Product & Technology
  summary: Yuanxin’s product is an operating system for innovative-drug access rather than a single app. Miaoshou Doctor provides licensed online follow-up care, prescriptions, patient management, and medicine ordering; Yuanxin Pharmacy provides hospital-adjacent dispensing, cold-chain delivery, and specialty-pharmacist services; Yuanxin Medical Technology provides internet-hospital and hospital-operations tooling; and Yuanxin Huibao provides insurance product design, claims, and health-management workflows. The 2023 launch of the Yuanquan AI commercialization-fulfillment network and Huibao online insurance platform, together with the 2025 Pfizer upgrade on graded DTP pharmacy management, suggest a real technology layer on top of a labor- and asset-heavy operational base. The core product risk is that this stack depends on regulation, hospital integration, pharmacy execution, and insurer/pharma cooperation, so its moat is architectural but not light-weight.
sections:
- id: product-stack-and-modules
  title: Product stack and modules
  body: 'Yuanxin''s visible product stack has four main modules. Miaoshou Doctor is the consumer and physician-facing internet-medical layer. Official materials say the product launched in 2017, holds an internet-hospital medical-practice license, and supports online consultation, follow-up prescriptions, and chronic-disease management. The Apple App Store description adds practical use cases: adding outpatient doctors for one-to-one follow-up, booking experts, online referral, medicine ordering, home delivery, medical-record management, and fast consultation. This is not just a triage app; it is a post-diagnosis continuity layer designed to keep the patient inside Yuanxin''s medication and service loop.


    The second module is Yuanxin Pharmacy, the fulfillment layer. Official materials say that by 2025-12-31 the group operated 201 hospital-adjacent pharmacies across 27 provincial-level regions, focused on specialty therapeutic areas and supported by professional medication guidance, cold-chain delivery, and rapid local fulfillment. The third module is Yuanxin Medical Technology, which the group says it developed in 2019 to help hospitals — especially top-tier hospitals — digitize operations and support long-term patient management; by end-2025 it had collaborated with 537 hospitals. The fourth module is Yuanxin Huibao, the payment and protection layer, positioned as an ''insurance + medical + medicine'' platform offering 惠民保险, drug insurance, health management, and claims investigation. Taken together, the product stack is designed to control the patient journey from diagnosis-adjacent access through reimbursement and refill support.'
