- id: operating-workflows-and-architecture
  title: Operating workflows and architecture
  body: 'The platform architecture is workflow-centric rather than feature-centric. On the physician side, Miaoshou serves as a cloud clinic with online consultations, patient grouping, physician education, e-prescriptions, and access to professional drug services. On the institutional side, the same system exposes hospital tools for smart prescriptions, online diagnosis, and specialty-department enablement, while also offering pharma-facing patient recruitment and digital marketing. On the pharmacy side, Yuanxin''s stores are not simple pickup points: they extend prescription verification, counseling, cold-chain delivery, and therapy-specific service. On the insurance side, Huibao supports product design, pricing, claims investigation, risk control, and health-management service scenes such as multidisciplinary consultation, video visits, genetic testing, and severe-disease support.


    The best public window into the deeper operating architecture is the Pfizer article from November 2025. It describes a graded DTP-pharmacy management system with basic pharmacies, professional pharmacies using the Yuanxin Patient Management Platform for record-keeping, follow-up, electronic medication histories, and automatic DOT generation, and research pharmacies connected to a specialized-disease database supporting real-world studies and investigator-initiated trials. The same article says AI tools and an intelligent-agent capability expand standardized service delivery and hospital-store collaboration. That combination — software workflows, structured patient-management data, and physical dispensing nodes — is the distinctive technical spine of the platform. It is also why the business is operationally complex: software only works here when it is tightly integrated with pharmacists, physicians, logistics, and insurers.'
