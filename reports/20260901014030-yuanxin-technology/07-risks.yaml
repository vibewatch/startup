- id: partner-dependency-and-people-execution-risk
  title: Partner, dependency, and people / execution risk
  body: 'Yuanxin''s model depends on counterparties it does not fully control. Hospital-origin prescriptions are the top-of-funnel engine for pharmacy and follow-up activity. Insurers underwrite the products Yuanxin markets and services, so payer appetite and claims economics matter. Pharmaceutical companies fund commercialization and patient-support programs, which exposes Yuanxin to ROI scrutiny, anti-corruption enforcement, and the risk of budget shifts. Supplier dependence is also rising: adverse July 2026 coverage said the top five suppliers accounted for 53.7% of purchases in 2025 versus 40.4% in 2023. If supplier terms tighten, product availability changes, or partner programs slow, Yuanxin''s economics can weaken quickly.


    There is also nontrivial execution and key-person risk. He Tao remains central to strategy, capital markets, and partner credibility, while different deputies oversee medical operations, finance, and retail execution. Repeated IPO filings show persistence but also execution drag. Workforce optimization and lower R&D spend helped the 2025 numbers, yet cost-cutting in a compliance-heavy service business can backfire if it weakens service quality or slows system development. The existence of stronger public competitors such as Ping An and JD means Yuanxin must keep executing across product, pharmacy, payer, and partner workflows simultaneously; it does not have room for a simple single-metric turnaround.'
