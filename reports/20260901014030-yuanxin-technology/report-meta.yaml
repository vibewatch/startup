companyProfile:
  summary: Yuanxin Technology is a 2015-founded, Beijing-headquartered healthcare platform built around a full-chain innovative-drug commercialization model that links Miaoshou Doctor, Yuanxin Pharmacy, Yuanxin Huibao, and hospital/medical-technology services. Public filings support meaningful scale across patients, pharmacies, insurers, pharmaceutical companies, and hospitals, which makes Yuanxin more than a telemedicine app. The strongest current public signals are category leadership in innovative-drug commercialization, broad ecosystem reach, and a business mix that can matter strategically to pharma and payers; the biggest caveat is that the company remains late-stage private, thin-margin, and not yet fully validated by the public market.
  foundedDate: '2015-03-20'
  founders:
    - name: He Tao
      role: Founder, chairman, and chief executive officer
      background: Public filings show He Tao remains the central operating and capital-markets leader as Yuanxin continues its multi-cycle Hong Kong IPO process.
      claimRefs: [CO003, CO024]
  foundingLocation: Beijing, China
  headquarters: Beijing, China
  productSummary: Yuanxin sells an integrated healthcare-access stack spanning online consultations and patient traffic through Miaoshou Doctor, specialty-drug dispensing and fulfillment through Yuanxin Pharmacy, insurance/payment enablement through Yuanxin Huibao, and hospital/pharma commercialization support through medical-technology services.
  customerFocus: Patients needing specialty and innovative-drug access, insurance partners, pharmaceutical companies, and hospitals or clinicians participating in out-of-hospital treatment and commercialization workflows.
  businessModel: Yuanxin monetizes pharmacy dispensing and fulfillment, insurer/payment-enablement services, patient-management and commercialization services for pharmaceutical companies, and related healthcare-technology workflows rather than relying on a single telemedicine subscription model.
  stage: late-stage private / pre-IPO
  fundingStatus: Public sources support a large late-stage financing history, including an August 2021 Series F of over RMB 1.5 billion and roughly US$933 million of lifetime funding, while July 2026 reporting tied to the latest filing pegged the current headline pre-IPO mark at RMB 19.5 billion after a 30% haircut.
