- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Hospital-adjacent specialty-pharmacy network
    - JD, Alibaba, or regional chains can subsidize commerce and fulfillment
    - high
    - Measure same-store productivity and prescription capture by hospital cluster
  - - Insurer integration and claims workflows
    - Large insurers or Ping An ecosystem can internalize more of the stack
    - medium-high
    - Review renewal rates and claims-linked product stickiness
  - - Pharma commercialization relationships
    - Medlive, DXY, or direct pharma teams can replicate parts of patient engagement
    - medium
    - Map multi-year pharma contracts and service scope depth
  - - Hospital collaboration footprint
    - Hospitals may multi-home vendors or keep critical workflows in-house
    - medium
    - Assess exclusivity, integration depth, and revenue per hospital
  - - Cross-pillar operating loop
    - Repeated IPO delays suggest complexity can slow capital-markets acceptance
    - high
    - Demand segment-level margin disclosure and evidence of operating leverage
  - - Consumer brand presence
    - JD, Ping An, and Alibaba have stronger consumer acquisition channels
    - high
    - Quantify patient acquisition cost and retention by therapy category
  notes: The central question is not whether Yuanxin has assets, but whether those assets create enough switching cost and margin power to withstand ecosystem rivals.
