  - - Yidu Tech
    - Listed hospital-data / AI platform
    - Annual revenue RMB 819.30M; market cap HKD 3.94B; 754 employees
    - Hospitals, health systems, data/AI buyers
    - Data and AI adjacency to hospital workflows
    - Not a direct specialty-pharmacy competitor
