      - number: '7.2'
        title: Operational, quality, and security risk register
        blocks:
          - type: paragraph
            body: >-
              Operationally, Yuanxin is exposed to the problems of both a pharmacy network and a digital platform. The
              prospectus and official pages show dependencies on prescription review, professional counseling,
              cold-chain delivery, self-operated stores, patient-management systems, claims handling, and hospital-store
              linkage. A failure in any of those layers can affect patient outcomes and regulator trust at the same
              time. This is a more demanding risk profile than a lightweight healthcare app. The platform also depends
              on secure handling of patient medical records, insurance data, and medication histories — precisely the
              categories that Chinese privacy and data-security enforcement treats as sensitive.


              The 2025-2026 financial and operational signals show why this matters. Yuanxin cut store count from 335 in
              2023 to 201 in 2025, incurred pharmacy shut-down losses, and still operated at sub-10% gross margins in a
              business that requires physical service quality. The company has public AI ambitions, but its AI
              deployment is tied to regulated human workflows rather than replaceable consumer chat. That means classic
              AI risks such as data quality, model drift, or inaccurate recommendations are layered on top of medical,
              pharmacy, and insurance execution risks rather than substituting for them. A serious quality, privacy, or
              logistics failure could spread quickly across multiple business lines.
