  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product stack and modules
        blocks:
          - type: paragraph
            body: >-
              Yuanxin's visible product stack has four main modules. Miaoshou Doctor is the consumer and
              physician-facing internet-medical layer. Official materials say the product launched in 2017, holds an
              internet-hospital medical-practice license, and supports online consultation, follow-up prescriptions, and
              chronic-disease management. The Apple App Store description adds practical use cases: adding outpatient
              doctors for one-to-one follow-up, booking experts, online referral, medicine ordering, home delivery,
              medical-record management, and fast consultation. This is not just a triage app; it is a post-diagnosis
              continuity layer designed to keep the patient inside Yuanxin's medication and service loop.


              The second module is Yuanxin Pharmacy, the fulfillment layer. Official materials say that by 2025-12-31
              the group operated 201 hospital-adjacent pharmacies across 27 provincial-level regions, focused on
              specialty therapeutic areas and supported by professional medication guidance, cold-chain delivery, and
              rapid local fulfillment. The third module is Yuanxin Medical Technology, which the group says it developed
              in 2019 to help hospitals — especially top-tier hospitals — digitize operations and support long-term
              patient management; by end-2025 it had collaborated with 537 hospitals. The fourth module is Yuanxin
              Huibao, the payment and protection layer, positioned as an 'insurance + medical + medicine' platform
              offering 惠民保险, drug insurance, health management, and claims investigation. Taken together, the product
              stack is designed to control the patient journey from diagnosis-adjacent access through reimbursement and
              refill support.
