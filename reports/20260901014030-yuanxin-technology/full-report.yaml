  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk register
        blocks:
          - type: paragraph
            body: >-
              Yuanxin operates in one of the most regulated parts of Chinese digital services: online medicine,
              prescriptions, specialty drug fulfillment, health-insurance workflows, medical data, and commercialization
              support for pharmaceuticals. The core internet-medical rules are already restrictive. The 2018 State
              Council opinion and 2019 trial measures allow internet hospitals and online follow-up for common and
              chronic disease, but require licensed medical institutions, registered physicians, pharmacist review, and
              traceable data; they also prohibit first-diagnosis internet treatment. For Yuanxin, these rules are not
              background noise — they shape the product itself. Any tightening on follow-up prescriptions, drug
              delivery, or institution eligibility would hit core workflows directly.


              The compliance surface is widening in 2026. Legal and policy commentary from Arnold & Porter, Chambers,
              ICLG, Global Legal Insights, and others points to stronger enforcement around pharmaceutical
              anti-corruption, insurance-fund fraud, medical data, and AI/medical-software governance. The 2026
              drug-regulation revision described by Cisema frames China as moving toward full-lifecycle oversight of
              drugs and digital supply chains, while privacy-law commentary highlights the strict interaction of the
              Data Security Law and Personal Information Protection Law for sensitive health data. Together, these raise
              both direct legal risk and operational cost. Yuanxin's integrated model only works if it keeps clinical,
              pharmacy, insurer, and data-compliance obligations aligned at all times.
            claimRefs:
              - CR008
              - CR009
              - CR010
