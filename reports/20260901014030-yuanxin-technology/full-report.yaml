      - number: '4.3'
        title: Liquidity and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Liquidity improved in one narrow sense and tightened in a broader one. Yuanxin generated positive
              operating cash flow of RMB 42.7 million in 2024 and RMB 138.2 million in 2025 after burning RMB 347.0
              million in 2023. Yet investing cash outflow worsened to RMB 461.0 million in 2025, financing cash outflow
              remained negative, and the prospectus showed a RMB 402.9 million net decrease in cash and cash equivalents
              in 2025. Balance-sheet current assets show cash and cash equivalents of RMB 909.1 million at end-2023, RMB
              531.0 million at end-2024, and RMB 329.3 million at end-2025, while trade and bills payables rose from RMB
              1.293 billion to RMB 1.880 billion across the same period and deposits for guarantee rose from RMB 138.4
              million to RMB 574.2 million. The filing itself warns that cash declined while trade and bills payable
              increased, contributing to pressure on net current assets.


              Independent July 2026 coverage makes the liquidity picture more acute. Shuziqushi emphasized that Yuanxin
              had not completed new external financing between 2022 and 2026, that store closures helped bring the
              network from 335 stores in 2023 to 201 in 2025, and that the company cut its pre-IPO valuation by 30% to
              RMB 19.5 billion. The article also highlighted a much lower year-end cash figure drawn from the cash-flow
              statement, underlining the need to reconcile cash definitions during diligence. Netting it all out,
              Yuanxin is not in immediate operational collapse — it has large revenue, positive operating cash flow, and
              active IPO plans — but it is operating with materially tighter capital headroom than a casual top-line
              reading might suggest.
