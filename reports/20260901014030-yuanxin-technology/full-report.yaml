      - number: '3.2'
        title: 'Scaled platform competitors: JD Health, Ping An Health, Alibaba Health, and WeDoctor'
        blocks:
          - type: paragraph
            body: >-
              JD Health is the most obvious scale benchmark. StockAnalysis' September 2026 snapshot shows RMB 79.04
              billion of trailing-twelve-month revenue, 6,018 employees, and HKD 116.42 billion of market
              capitalization, while its company description highlights online medical consultation, referrals, health
              check-ups, internet healthcare, home-care services, and technical services. In practice JD Health competes
              with Yuanxin on consumer acquisition, online medical services, pharmacy commerce, and broad healthcare
              retail, but at a much larger scale and with JD ecosystem advantages. Alibaba Health is also formidable on
              platform distribution: StockAnalysis shows RMB 34.26 billion of annual revenue, 1,394 employees, and HKD
              49.95 billion market capitalization, reinforcing that Yuanxin faces consumer and retail rivals backed by
              major internet ecosystems.


              Ping An Health is smaller than JD Health but more directly relevant as a healthcare-service platform with
              public disclosure quality. Its 2025 annual-results announcement reported RMB 5.468 billion of revenue and
              RMB 414 million of adjusted net profit, while StockAnalysis shows about 1,586 employees and HKD 13.87
              billion of market capitalization. The company description emphasizes online diagnosis and treatment,
              consultations, health-management services, tests, and smart-device sales — a more service-led
              digital-health stack that overlaps with Yuanxin's online medical and payer-adjacent ambitions. WeDoctor
              remains strategically relevant as a long-known Chinese internet-health brand; a 2026 GetLatka profile
              places it at about US$423.6 million of revenue, US$1.5 billion total funding, a US$7 billion 2022
              valuation, roughly 2,000 employees, and Hangzhou headquarters. But compared with listed peers, the
              available public evidence on WeDoctor is thinner and more tracker-dependent, which limits precision.
