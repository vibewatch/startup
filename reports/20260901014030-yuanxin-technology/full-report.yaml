  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Yuanxin deserves active tracking because the business has real operating scale, not just startup
              storytelling. The 2026 Hong Kong application proof and independent summaries show 2025 revenue of RMB
              10.377 billion, 201 pharmacies, roughly 27 million average monthly Miaoshou Doctor visits, 230 insurers
              plus 10 reinsurers, 506 pharmaceutical-company customers, and 537 hospitals served through
              medical-technology workflows. That is unusually broad infrastructure for a private Chinese healthtech
              platform. It is also why the company remains relevant even after multiple failed listing cycles: very few
              peers combine patient access, specialty pharmacy, insurance enablement, and pharma commercialization
              services at this scale.


              But valuation discipline matters more than admiration. The July 2026 adverse reporting tied to the latest
              prospectus says Yuanxin cut its implied valuation by 30% to RMB 19.5 billion. Against 2025 revenue, that
              implies roughly 1.9x price-to-sales. On a superficial reading that looks lower than many software-style
              healthtech names. On a harder reading, it is a demanding price for a company with only 1.7% revenue growth
              in 2025, a 9.9% gross margin, a RMB 400.9 million net loss, sharply lower cash, and an IPO that has still
              not cleared after six filings. The right public-evidence posture is therefore track: the asset quality is
              real, but the disclosed price does not yet leave a clear margin of safety.
            claimRefs:
              - CV001
              - CV002
              - CV003
