  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market definition and boundaries
        blocks:
          - type: paragraph
            body: >-
              Yuanxin's addressable market is broader than telemedicine but narrower than 'all of digital health.' The
              relevant market starts with innovative-drug commercialization in China: getting specialty and oncology
              therapies prescribed, reimbursed, fulfilled, and supported outside the hospital when appropriate. That
              market overlaps with hospital-adjacent specialty pharmacy, internet follow-up care, hospital
              internet-hospital infrastructure, patient management, and commercial-insurance enablement. It does not
              include inpatient hospital revenue, drug discovery, manufacturing economics, or general consumer wellness.
              In other words, Yuanxin monetizes the handoff between diagnosis and durable treatment access rather than
              the entire healthcare spend stack.


              This market definition matters because broad digital-health TAM numbers can easily overstate what Yuanxin
              can actually capture. A general digital-health report counts wearables, software, health analytics,
              medical devices, and consumer apps; Yuanxin captures only the portion linked to prescription outflow,
              specialty fulfillment, insurer workflow, and pharma commercialization. Status-quo substitutes are still
              powerful: hospital pharmacies, traditional wholesalers, general e-commerce pharmacies, manual
              reimbursement processes, offline patient-assistance programs, and hospital-built internet portals.
              Yuanxin's edge is that it tries to connect all those fragments in a single workflow centered on
              innovative-drug access rather than offering just one point product.
