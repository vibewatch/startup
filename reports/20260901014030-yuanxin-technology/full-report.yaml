      - number: '4.4'
        title: Public financial gaps and diligence priority
        blocks:
          - type: paragraph
            body: >-
              The most important missing pieces are not the top-line numbers; they are the economics underneath them.
              The prospectus does not publicly provide segment-level gross margins, store-level contribution margins,
              pharmacy payback periods, insurer-customer profitability, sales efficiency by business line, or
              concentration data for major hospital, insurer, and pharmaceutical customers. That means investors can see
              that the company is becoming less wholesale-heavy, but cannot yet see precisely how much margin is created
              by pharmacy fulfillment versus insurance services versus pharma commercialization. A similar limitation
              applies to the store base: the filing shows store-count reduction and hospital proximity, but not
              same-store sales, same-store margin, or closure economics.


              As a result, public-market readiness still rests on narrative more than fully auditable operating
              architecture. Late-stage investors can underwrite the direction of travel — less wholesale, better opex
              control, positive operating cash flow, smaller losses — but should treat the 2025 improvement as
              provisional until they obtain store cohorts, cohort-level patient economics, claims-linked insurer
              profitability, and customer concentration. Yuanxin's financial case is credible enough to justify an IPO
              attempt, yet incomplete enough that the key underwriting question remains margin durability rather than
              revenue scale.
