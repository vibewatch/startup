      - number: '5.3'
        title: Trust, compliance, and critical dependencies
        blocks:
          - type: paragraph
            body: >-
              Trust and compliance are central product attributes because Yuanxin operates in medication, prescriptions,
              and insurance rather than in low-stakes wellness. App-store disclosures explicitly warn that the service
              cannot replace in-person diagnosis and requires users to provide accurate follow-up information and
              appropriate revisit credentials. Official pages emphasize the platform's medical-practice license and its
              role in connecting 'doctor, patient, and medicine.' The pharmacy product similarly depends on
              medication-safety processes such as prescription review, professional pharmacist guidance, self-operated
              stores, and cold-chain integrity. Huibao's claims-investigation and risk-control positioning shows that
              insurance credibility is another core trust layer.


              These trust layers create real operating dependencies. The system relies on hospital integrations for
              compliant diagnosis and referral, pharmacists for specialty-drug review and counseling, reliable delivery
              for time- and temperature-sensitive medicines, insurers for payment expansion, and pharmaceutical partners
              for access and patient-support workflows. The platform is therefore not lightweight software. If
              regulation tightens, hospital collaboration weakens, or pharmacy standardization slips, product quality
              degrades quickly. That dependence cuts both ways: it raises execution risk, but it also creates a
              harder-to-replicate product moat than a standalone telemedicine app.
