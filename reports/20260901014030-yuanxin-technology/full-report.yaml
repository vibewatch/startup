      - number: '3.3'
        title: 'Specialist and adjacent competitors: Medlive, DXY, Fangzhou, Yidu Tech'
        blocks:
          - type: paragraph
            body: >-
              Medlive and DXY pressure Yuanxin from the professional side of the market. StockAnalysis describes Medlive
              as an online professional physician platform offering precision marketing, digital detailing,
              digital-marketing consultation, digital content creation, and software-development services to pharma
              customers. The same source shows RMB 645.32 million of trailing revenue, 724 employees, and HKD 5.66
              billion of market capitalization, which implies that public investors still value physician-attention
              assets at a meaningfully higher sales multiple than drug-fulfillment businesses. DXY, meanwhile, is
              described by the World Economic Forum as a leading digital healthcare technology platform in China
              connecting hospitals, doctors, scientific researchers, patients, pharmaceutical companies, and insurers.
              It claims over 100 million public users and 5.5 million professional users and spans content, e-learning,
              online consultation, e-commerce, and offline primary care. That gives DXY broad reach into pharma
              marketing and physician engagement — areas where Yuanxin also sells services.


              Fangzhou is a closer transactional peer on the internet-hospital and chronic-disease side, though at
              smaller scale. StockAnalysis shows RMB 3.86 billion of trailing revenue, 494 employees, and only HKD
              983.67 million of market capitalization, indicating that public investors are skeptical of this class of
              model when growth and profitability are not clearly established. Yidu Tech is less of a pharmacy rival and
              more of a hospital-data / AI-adjacent competitor, with RMB 819.30 million of annual revenue, 754
              employees, and HKD 3.94 billion of market capitalization. Together these specialists illustrate the
              fragmentation of Yuanxin's battlefield: physician mindshare, hospital data, chronic-disease workflows, and
              digital commercialization are all separately contested, so Yuanxin needs ecosystem depth rather than just
              app traffic to defend itself.
