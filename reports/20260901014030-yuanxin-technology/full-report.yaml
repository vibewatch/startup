      - number: '6.3'
        title: Named customer proof and repeat-usage loops
        blocks:
          - type: paragraph
            body: >-
              Public customer proof is strongest where Yuanxin discloses named partners rather than anonymous counts.
              The prospectus milestone table says the company launched its first medical insurance product in December
              2018 in cooperation with Taiping Life Insurance. In October 2025, the prospectus also says Yuanxin entered
              a real-world research collaboration agreement with the National Healthcare Security Institute of Capital
              Medical University. The November 2025 Pfizer article goes further, describing Yuanxin as a long-term
              ecological partner of Pfizer China and detailing a new phase of cooperation around DTP pharmacy grading,
              hospital-store linkage, and patient-management workflows. These named examples matter because they show
              Yuanxin selling into real counterparties across insurer, research, and pharma categories rather than only
              publishing aggregate counts.


              Repeat-usage logic is also embedded in the workflow. Chronic-disease management, follow-up prescriptions,
              electronic medication histories, health-management services, insurance claims assistance, and patient
              grouping all imply recurring interaction rather than one-off transactions. Official pages explicitly
              present Miaoshou as a post-visit management tool, Huibao as a continuing health-management and claims
              platform, and the pharmacy network as a local medication network for ongoing use. The right retention lens
              therefore is not traditional consumer-app DAU/MAU alone, but repeat prescription capture, therapy-course
              continuity, insurer service renewal, and pharma-program expansion. Unfortunately those deeper retention
              metrics are not public.
