      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Yuanxin is closer to exit readiness than an early-stage healthtech startup, but still short of investable
              clarity. The repeated Hong Kong applications show management persistence and documentation depth, yet they
              also show that the market has not accepted the story on offered terms. The biggest missing variable is not
              the existence of a business; it is the quality of the earnings bridge from today's scaled but thin-margin
              model to a public-company profile with more resilient free cash generation. Investors still need the exact
              cap table and liquidation preferences, same-store pharmacy cohorts after store rationalization,
              contract-renewal quality with insurers and pharma companies, and segment-level contribution margins that
              isolate the economics of higher-value commercialization services from lower-margin drug distribution.


              Those asks are not academic. If a future financing or IPO prices below RMB 19.5 billion, or requires heavy
              preference protection, common-equity upside could compress sharply even if the company keeps growing.
              Conversely, if due diligence reveals strong renewal rates, genuine margin lift, and clean governance, the
              current headline mark could move from stretched toward fair. The final call is therefore track with medium
              confidence: Yuanxin has enough strategic relevance to follow closely, but not enough disclosed valuation
              support to recommend chasing the current implied entry price.
            claimRefs:
