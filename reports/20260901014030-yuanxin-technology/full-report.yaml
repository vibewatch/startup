      - number: '7.4'
        title: Mitigation and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The mitigation case is not empty. Yuanxin has real licenses, deep hospital adjacency, insurer and pharma
              breadth, and a patient-management architecture that can create switching friction. The company has also
              already demonstrated one important corrective action: it reduced wholesale exposure and moved operating
              cash flow positive in 2025. But those are mitigants, not proof that the business is out of danger. The
              right underwriting posture is to define kill criteria clearly: if liquidity keeps shrinking and an IPO or
              financing does not materialize; if regulation materially narrows e-prescription or online follow-up scope;
              if same-store pharmacy productivity disappoints; if insurer, hospital, or pharma renewal quality weakens;
              or if a material data/privacy incident occurs, the bull case should be revisited quickly.


              This matters because Yuanxin's risk transmission is cross-functional. A policy change can reduce
              prescription flow, which weakens pharmacy throughput, which hurts patient access, which lowers insurer and
              pharma value, which worsens cash generation. Conversely, better standardization, data governance, and
              partner-retention visibility could materially de-risk the asset. The burden of proof is on Yuanxin to show
              that its integrated model is resilient under tighter liquidity and tighter regulation, not just that it
              can tell a large-market growth story.
            claimRefs:
              - CR030
