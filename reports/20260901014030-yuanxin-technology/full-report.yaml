      - number: '2.4'
        title: Growth drivers, adoption constraints, and contradictory estimates
        blocks:
          - type: paragraph
            body: >-
              The structural tailwinds are strong. Official policy since 2018 has allowed internet hospitals built on
              physical medical institutions, online follow-up for common and chronic disease, and e-prescriptions with
              pharmacist review and qualified delivery. Frost further highlights accelerated NRDL inclusion for
              innovative drugs, the rise of diversified distribution channels, prescription outflow, and the new
              commercial-insurance innovation-drug list as catalysts for the out-of-hospital specialty-drug ecosystem.
              MarketsandMarkets adds demand-side drivers: aging demographics, the urban-rural healthcare access gap,
              Healthy China 2030 policy support, and 5G-enabled remote care infrastructure. These all reinforce
              Yuanxin's logic that treatment access will increasingly be organized across hospitals, pharmacies,
              insurers, and digital services rather than inside one institution.


              The constraints are just as important. The 2019 internet-diagnosis rules prohibit first-diagnosis internet
              treatment and keep the market tied to licensed institutions, which caps pure online scale. A 2026 market
              commentary argues that telemedicine in China is now more of a consolidation story than a greenfield
              traffic land-grab, with surviving platforms monetizing medicine sales more than consultations. Yuanxin's
              own economics point in the same direction: even with large hospital and online footprints, its
              hospital-tech revenue remains small, while pharmacy and pharma-linked services dominate. Finally, analyst
              market-size estimates vary widely, so investors should treat broad digital-health CAGR numbers as context
              rather than valuation-ready inputs. The more credible thesis is that Yuanxin sits in one of the
              faster-growing subsegments of Chinese healthcare — innovative-drug access and specialty fulfillment — but
              captures that growth only if regulation, payer integration, and fulfillment execution keep working
              together.
