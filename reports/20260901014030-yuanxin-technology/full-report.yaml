          under-disclosed
        - Treat scenario ranges as decision aids rather than point estimates
      - - Risk rating
        - High
        - Losses continue, liquidity stayed tight, regulation is heavy, and six filings show execution risk
        - Require a larger margin of safety than for asset-light software
      - - Valuation stance
        - Stretched
        - RMB 19.5B equals roughly 1.9x 2025 revenue, above JD/Alibaba-style low-margin public comps
        - Avoid equating "below software comps" with "cheap"
      - - What would upgrade the call
        - Evidence of cleaner economics at the same or lower price
        - Need cap-table clarity, same-store productivity, insurer/pharma renewal quality, and cleaner cash bridge
        - Upgrade only if diligence improves both quality and price support
    notes: >-
      The recommendation is price-sensitive. This is not a negative call on the existence of a business; it is a
      judgment that current disclosed valuation support is incomplete.
