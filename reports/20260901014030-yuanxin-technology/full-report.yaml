      - number: '8.2'
        title: Thesis, anti-thesis, and comparable lenses
        blocks:
          - type: paragraph
            body: >-
              The positive thesis starts with structure. Frost & Sullivan's attachment to the HKEX filing ranks Yuanxin
              first among China's full-chain innovative-drug commercialization service providers by 2024 total revenue
              and puts the company at RMB 10.2 billion of 2024 revenue with 237 self-owned specialty pharmacies. The
              same materials frame a specialty-pharmacy market growing from RMB 102.7 billion in 2024 to RMB 219.4
              billion in 2030 and an innovative-pharmaceutical market growing from RMB 309.9 billion to RMB 606.5
              billion over the same period. Combined with Yuanxin's insurer, hospital, and pharma breadth, that supports
              a real platform thesis rather than a single-product trade.


              The anti-thesis is that the quoted pre-IPO mark already asks investors to look through several unresolved
              problems. Public market peers show widely different revenue multiples depending on business mix: JD Health
              and Alibaba Health screen around 1.28x trailing sales, Ping An Healthcare around 2.20x, Fangzhou 0.22x,
              Yidu 4.23x, and Medlive 7.60x. Yuanxin's implied 1.9x multiple sits below software-and-data names, but
              above broader low-margin pharmacy/distribution platforms that are already public and profitable. That
              means the company is not obviously undervalued simply because it is private and later-stage. The multiple
              only works if investors believe Yuanxin can convert scale into better margins, cleaner disclosure, and
              eventually public-market credibility.
