  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set and segmentation
        blocks:
          - type: paragraph
            body: >-
              Yuanxin should not be benchmarked against only one type of rival. Its model overlaps with at least four
              competitive clusters: consumer online-health platforms such as JD Health and Ping An Health;
              physician-content and pharma-marketing specialists such as Medlive and DXY; online chronic-disease /
              internet-hospital commerce players such as Fangzhou; and hospital-data or AI-adjacent companies such as
              Yidu Tech. WeDoctor remains a recognized Chinese online-health brand, but public source quality on its
              current business is weaker than for listed peers. Alibaba Health also matters because it combines broader
              consumer traffic, e-commerce capability, and healthcare services that can pressure pharmacy economics even
              when its model is not identical to Yuanxin's.


              This segmentation matters because Yuanxin's overlap with each competitor is partial. It is not the largest
              traffic platform, not the largest physician-media network, not the largest general health-retail
              marketplace, and not the clearest pure software story. Instead, it competes by stitching together
              prescription outflow, specialty dispensing, hospital collaboration, insurer enablement, and pharma
              commercialization. That makes some public comps directionally useful but imperfect. Investors should
              therefore compare Yuanxin along specific buying criteria — specialty-pharmacy density, hospital adjacency,
              insurer integration, pharma-service depth, and public-market readiness — rather than averaging broad
              'digital health' peers together.
            claimRefs:
