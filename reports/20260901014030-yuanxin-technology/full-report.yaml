      - number: '1.2'
        title: Leadership, ownership, and capital base
        blocks:
          - type: paragraph
            body: >-
              Founder He Tao remains the key person. The prospectus identifies him as executive director, chairman, and
              chief executive officer, with prior leadership experience at J1.com/Guoda Jianyiwang and Shenzhen Sanjiu
              pharmacy operations. The rest of the disclosed operating bench is functionally aligned with Yuanxin's
              hybrid model: He Weizhuang oversees medical operations and user relations, Zhang Huanchang runs
              pharmaceutical retail, He Guofeng covers finance and investor relations as board secretary, and Wen Jing
              serves as CFO after a long PwC career. Non-executive representation from Tencent and HongShan/Sequoia
              China through Hao Rui and Zhou Kui shows that strategic and financial backers retain governance
              visibility. The 2026 filing says the board will comprise four executive, two non-executive, and three
              independent non-executive directors.


              Capital formation has been large by China digital-health standards. Official investor commentary from INCE
              Capital confirms the August 2021 Series F exceeded RMB 1.5 billion and included Sequoia, B Capital Group,
              OrbiMed, UOB, INCE Capital, and others after earlier D and E financings. Independent tracker pages such as
              InforCapital and VCBeat place cumulative funding around US$971 million / roughly RMB 5 billion across five
              major rounds, with the company in a pre-IPO stage. That broad investor set matters in two ways. It
              validates institutional appetite for Yuanxin's full-chain model, but it also means the company has carried
              private-market expectations for several years without completing an IPO. The 2026 application still
              presents a company with strong backers and visible governance, yet one whose public-market transition has
              proved harder than its fundraising history suggested.
