  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Financing clears below current headline mark
        - New round or IPO pricing materially below RMB 19.5B, or with heavy ratchets/preferences
        - Shows the 2026 filing mark overstated current common-equity value
        - Re-underwrite to the new effective entry price; do not anchor on old headline valuation
      - - Same-store pharmacy economics disappoint
        - Post-rationalization stores fail to show better contribution margins or refill economics
        - Weakens the argument that pruning improved quality of revenue
        - Move stance toward avoid unless price resets
      - - Partner renewal quality weakens
        - Meaningful insurer or pharma program attrition, or hospital-coverage contraction
        - Undercuts the ecosystem-moat argument behind premium valuation
        - Reduce terminal-multiple assumptions and cut scenario range
      - - Liquidity tightens again
        - Cash bridge worsens or operating cash generation reverses before listing
        - Raises the probability of a defensive financing
        - Assume dilution and higher required return
      - - Regulatory tightening hits prescription outflow or digital-health workflows
        - Policy or enforcement changes reduce the ability to capture out-of-hospital innovative-drug demand
        - Damages both growth and margin narratives at once
        - Pause investment case until operational effect is measurable
    notes: >-
      Kill triggers focus on measurable events that break the price-sensitive thesis, not merely on missing consensus
      estimates.
    claimRefs:
      - CV008
      - CV022
      - CV031
      - CV038
      - CV039
      - CV041
      - CV042
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Cap table and preference stack
        - Post-Series F and pre-IPO preference terms, liquidation stack, board rights, and any ratchets
        - Headline valuation can be misleading if preferences absorb much of the upside
        - Company counsel / financing documents
      - - Same-store pharmacy cohorts
        - Store-level revenue, gross profit, refill, and contribution margins before and after the 2023-2025 store reset
        - Determines whether rationalization created a stronger base or merely shrank the footprint
        - Management data room / site visits
      - - Segment contribution margins
        - Economics split across pharmacy, insurance enablement, marketing, and hospital-tech services
        - Needed to test whether higher-value services are large enough to justify richer multiples
        - Audited management accounts
      - - Partner-renewal quality
        - Insurer, pharma, and hospital renewal rates plus concentration by top counterparties
        - Shows whether ecosystem breadth is sticky or only broad on paper
        - Customer cohort analysis and contract review
      - - Supplier concentration by therapy area
        - Top-supplier exposure split by category and substitution risk
        - Critical for downside risk in a thin-margin drug-access business
        - Procurement diligence and supply-chain review
      - - IPO readiness package
        - Updated listing timeline, regulatory feedback, cornerstone appetite, and 2026-2027 use-of-proceeds plan
        - Needed to judge whether the exit path is real or still aspirational
        - Capital-markets diligence with sponsor and company
    notes: These asks are ranked by how directly they can move the call from track to buy or from track to avoid.
    claimRefs:
