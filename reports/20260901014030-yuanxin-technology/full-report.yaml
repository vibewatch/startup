  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and value proposition
        blocks:
          - type: paragraph
            body: >-
              Yuanxin's customer base is inherently multi-sided. Patients are the end users who need access to
              innovative drugs, specialist follow-up, refills, affordability support, and medication-management
              services. Hospitals are institutional customers and workflow anchors because diagnoses, prescription
              origination, and internet-hospital collaboration all begin there. Insurers and reinsurers buy or
              co-develop drug-protection, claims, and health-management services. Pharmaceutical companies buy
              commercialization acceleration, patient recruitment, patient-management, and real-world-research support.
              Physicians are both product users and channel enablers. The official site summarizes this well: the group
              delivers value to patients, doctors, hospitals, pharmaceutical companies, and insurance companies rather
              than to a single customer type.


              The value proposition also differs by segment. For patients, the pitch is access, convenience, and
              financial relief; for hospitals, it is smarter workflows and long-term patient management; for insurers,
              it is product design, pricing, claims, and risk control; for pharma companies, it is commercialization,
              patient recruitment, and follow-up. That means Yuanxin should be understood as a B2B2C platform whose
              consumer traffic matters, but whose economics rely heavily on enterprise and partner relationships. The
              customer question is therefore not just 'how many users does the app have?' but whether these interlocking
              segments reinforce each other enough to sustain repeat usage and budget renewals.
            claimRefs:
