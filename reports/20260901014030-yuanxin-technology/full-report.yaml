chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and the three-pillar model
        blocks:
          - type: paragraph
            body: >-
              Yuanxin Technology is legally Beijing Yuanxin Technology Group Co., Ltd., founded on 2015-03-20 and
              headquartered in Beijing's Fengtai District. The 2026 HKEX application proof is the cleanest identity
              anchor: it describes the group as China's largest full-chain service provider for innovative-drug
              commercialization by 2024 revenue and annual delivery value, with a business model that connects patients,
              pharmaceutical companies, healthcare professionals, hospitals, and insurers. In practical operating terms,
              the company runs three visible pillars. First is Miaoshou Doctor / Miaoshou Physician, an online medical
              and follow-up platform that complements hospital care with online consultations, repeat prescriptions,
              chronic-disease support, and home delivery. Second is Yuanxin Pharmacy, a hospital-adjacent
              offline-plus-online pharmacy network concentrated near tertiary hospitals and oriented toward
              innovative-drug dispensing rather than general convenience retail. Third is Yuanxin Huibao, an
              insurance-services and technology arm that designs, markets, administers, and settles commercial
              health-insurance products tied to innovative-drug access and patient affordability.


              The official group site reinforces this operating structure by exposing separate route pages for doctors,
              medical technology, pharmacy, Huibao insurance, service cases, and careers, while the Miaoshou site and
              app-store listings show a still-active patient product in 2026. The product architecture matters because
              Yuanxin is not only an online-consultation app competing for traffic. Its proposition is a closed loop:
              prescription outflow from hospitals, specialized fulfillment, patient management, payment coordination,
              and pharma-facing commercialization support. That makes the company structurally closer to an
              innovative-drug infrastructure platform than to a single-function telemedicine marketplace. It also
              explains why group disclosures emphasize pharmacies, insurers, and pharma customers at least as much as
              end-user consultation activity.
