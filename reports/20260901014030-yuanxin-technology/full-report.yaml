      - number: '8.3'
        title: Bull, base, and bear scenario logic
        blocks:
          - type: paragraph
            body: >-
              Because Yuanxin's current public price anchor is a headline pre-IPO mark rather than a completed financing
              or market-clearing IPO, scenario analysis should be expressed as valuation bands tied to revenue multiples
              and underwriting assumptions. A bear case values the company around 1.0x-1.2x 2025 revenue, or roughly RMB
              10.4-12.5 billion. That outcome would fit a world where growth stays near low single digits, cash remains
              tight, the public market keeps treating Yuanxin primarily as a low-margin pharmacy-access operator, or a
              new round prices below the current filing mark.


              The base case uses roughly 1.4x-1.9x revenue, or RMB 14.5-19.7 billion. That range gives Yuanxin credit
              for true scale, category leadership in innovative-drug commercialization, and the possibility that
              pharmacy mix and insurer/pharma workflows keep improving after the wholesale pullback. It also keeps a
              discount versus software-like names because public data still do not prove durable high-margin economics.
              The bull case requires 2.0x-2.6x revenue, or RMB 20.8-27.0 billion, which would only be justified if
              Yuanxin demonstrates better same-store pharmacy productivity, partner renewals, margin expansion, and a
              clean IPO path. In other words, public evidence can support a trackable base case, but not a buy-grade
              upside case yet.
            claimRefs:
              - CV011
