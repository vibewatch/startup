      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Yuanxin serves a multi-sided market, so the user is often not the budget owner. Patients use Miaoshou
              Doctor and Yuanxin pharmacies because they need convenient access to prescribed therapies, refills,
              affordability support, and follow-up services. Hospitals are institutional buyers for internet-hospital
              construction and workflow digitization, usually paying project-based service fees or integrating Yuanxin
              where prescription outflow and follow-up care need to extend beyond the hospital campus. Pharmaceutical
              companies buy commercialization services because innovative-drug uptake increasingly depends on
              out-of-hospital fulfillment, patient education, adherence support, and real-world follow-up rather than
              hospital stocking alone. Insurers and reinsurers are buyers of product design, claims, settlement, and
              health-management workflows because commercial coverage can bridge gaps left by the NRDL.


              The adoption path therefore moves through policy-enabled but operationally complex workflows. A patient is
              first diagnosed in a physical institution, receives follow-up and e-prescription support through licensed
              internet-medical workflows, fulfills through hospital-adjacent pharmacies or coordinated delivery, and
              then enters insurer or pharma-sponsored support programs where relevant. Yuanxin benefits when these
              actors all want the same thing: faster access to innovative therapy with lower friction. But each
              stakeholder has a different buying trigger. Hospitals care about compliance and workflow efficiency;
              insurers care about claims control and differentiated products; pharma companies care about
              commercialization reach; patients care about access and affordability; and doctors care about continuity
              of treatment. This complexity raises switching costs but also lengthens sales cycles and makes the market
              harder to summarize with one simple 'software TAM.'
