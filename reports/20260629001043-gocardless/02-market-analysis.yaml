    "title": "Market Analysis",
    "summary": "GoCardless' clearest market is not generic fintech or all merchant payments, but bank-account-based payment acceptance and recurring collection spanning direct debit, pay by bank, and emerging recurring open-banking flows. Official UK flow data show real adoption momentum — 13.3 million active open-banking users and 31 million March 2025 payments — but cards and legacy bank rails still dwarf current pay-by-bank activity, so the most defensible sizing lens is constrained workflow migration rather than a single top-down TAM. Public analyst estimates range from roughly $19 billion to $279 billion depending on definition, making buyer fit, regulatory tailwinds, and installed-base conversion more useful than broad category headlines alone."
