      "id": "drivers-constraints-and-gaps",
      "title": "Drivers and constraints: regulation helps, but cards, trust, and missing denominators still matter",
      "body": "The positive case for this market is straightforward. UK and EU policy are both nudging account-to-account payments forward: the FCA says open-banking growth is rapid and commercial VRP rollout continues through 2026, the UK National Payments Vision emphasizes more choice and lower-cost retail infrastructure, and the EU's Instant Payments Regulation pushes always-on instant transfers with equal pricing to ordinary credit transfers. Merchant economics also help. GoCardless' own materials say pay by bank can save up to 48% versus cards, while independent 2026 coverage still describes UK retail as heavily card dominated and expensive for merchants. Capgemini's 2026 merchant research adds that banks still retain trust advantages if they can pair that trust with better onboarding, fraud tooling, and modular APIs.

The constraint case is equally real. The PSR says Mastercard and Visa still do not face effective competition, so cards remain the easier default for many merchants. The Federal Reserve's merchant-payments work warns that pay-by-bank savings claims are not one-size-fits-all, while trust, dispute handling, rewards economics, and access to credit all keep cards sticky. Juniper highlights checkout complexity and fragmentation as merchant pain points, and independent 2026 commentary suggests adoption is steady rather than hockey-stick. The biggest remaining diligence problem is data quality: current official UK merchant denominators are stale or indirect, detailed UK payment-market forecasts are paywalled, and GoCardless does not publicly break out open-banking GMV as a share of total processed volume. Those gaps are why this chapter favors constrained sizing and contradictory-estimate preservation over a false-precision TAM claim.",
