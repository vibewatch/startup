- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk area
  - Current mitigation
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Regulatory / legal
    - Licenses disclosed; privacy and complaints frameworks public.
    - Direct regulatory issue or missing diligence response
    - Any undisclosed regulator action, scheme finding, or unresolved legal escalation.
    - Pause underwriting until management provides documentary remediation evidence.
  - - Reliability
    - Official status surfaces and fallback routing exist.
    - Incident frequency or severity rises
    - Multiple material payout or pay-by-bank incidents inside a quarter or weak MTTR evidence.
    - Raise required return or slow deployment until resilience evidence improves.
  - - Open-banking rail dependency
    - UKPI participation plus Direct Debit fallback.
    - Fallback usage proves structurally high
    - Fallback becomes common enough to damage conversion, cost, or merchant UX.
    - Re-rate pay-by-bank upside and lean more heavily on legacy rail assumptions.
  - - Mollie transaction
    - Continuity commitments and phased integration messaging.
    - Approval or integration slippage
    - Closing slips beyond 2026 or roadmap/accountability becomes unclear.
    - Treat strategic upside as deferred and increase execution discount.
  - - People / execution
    - Leadership additions, new hubs, and cost discipline.
    - Further broad cuts or key-team attrition
    - Another material support, compliance, or engineering reset before service metrics improve.
    - Assume execution risk is rising faster than margin quality.
  - - Customer trust
    - Formal dispute path and some positive product breadth evidence.
    - Persistent complaint or integration-friction signal
    - Trust indicators stay weak or unresolved merchant operational complaints recur.
    - Tighten churn, expansion, and partner-adoption assumptions.
  notes: The goal is to convert visible mitigants into specific monitors so diligence can distinguish manageable risk from thesis-break risk.
