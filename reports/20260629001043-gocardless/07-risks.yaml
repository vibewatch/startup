callouts:
- calloutType: risk
  title: The biggest risk is governance drift, not current distress
  body: GoCardless looks more like a company managing through multiple transitions—new rails, embedded distribution, and a pending owner—than a company in outright operational failure. That makes governance, disclosure depth, and execution discipline the central diligence issues.
  claimRefs:
  - CR011
  - CR029
  - CR038
  - CR045
- calloutType: recommendation
  title: Demand first-party incident, concentration, and approval evidence
  body: The public file is sufficient to rank risks, but not sufficient to close them. Ask management for regulator correspondence, partner concentration, incident MTTR, fraud-loss rates, and Mollie integration governance before underwriting upside from scale or product breadth.
  claimRefs:
  - CR019
  - CR046
  - CR047
  - CR048
