company:
  name: GoCardless
chapter:
  number: 7
  title: Risks
  summary: 'GoCardless has a credible control surface and clear financial improvement, but its risk profile is still materially shaped by regulated multi-entity operations, evolving open-banking scheme governance, visible incident history, partner/embed dependencies, and a pending sale to Mollie. The public file supports a medium-high risk rating rather than a red-flag failure case: mitigants are real, yet several of the most decision-relevant questions—regulatory clean-room status, partner concentration, incident depth, and post-close governance—still require non-public diligence.'
sections:
- id: regulatory-and-legal-risk
  title: Regulatory and Legal Risk
  body: 'GoCardless does not read like a company with a current license-loss event hanging over it, but it does read like a company whose compliance perimeter is wide and getting wider. The public record spans an FCA-regulated UK entity, an ACPR-regulated French entity, and U.S. service delivery that depends on both a sponsor-bank program and money-services-business registration. That matters because payments risk is often less about whether a license exists today and more about whether every product, geography, and partner workflow remains inside the permitted perimeter as the product set expands. Privacy posture adds another layer: GoCardless publicly says it is a data controller, relies on AML and PSD2-related lawful bases, and asks merchants to account for those responsibilities. Its own RFP guidance also reminds buyers that regulatory authorisation, scheme compliance, AML/KYC, safeguarding, and Consumer Duty support are not box-ticking issues. The main residual legal risk is not visible
    enforcement today; it is that a complex multi-jurisdiction compliance surface can create sudden friction, remediation cost, or onboarding slowdown before the public file shows a clear warning.'
  claimRefs:
