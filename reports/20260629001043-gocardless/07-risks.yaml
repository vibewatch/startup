  evidenceGaps:
  - type: missing-source
    severity: material
    topic: regulatory-investigations
    missingEvidence: Direct evidence from management, counsel, or a regulator-linked record confirming whether GoCardless faced any material regulator or ombudsman action in the last three years.
    whyItMatters: Public absence of enforcement evidence is not the same as a clean compliance record, especially for a regulated payments company operating across several jurisdictions.
    diligencePath: Request a legal and compliance memo covering FCA, ACPR, U.S. sponsor-bank, and ombudsman matters, plus any remediation logs or no-action confirmations.
    relatedQuestionRefs:
    - QR006
    relatedTableRefs:
    - TR001
    - TR005
  - type: private-evidence-only
    severity: material
    topic: reliability-and-security-assurance
    missingEvidence: Enterprise SLA attainment, MTTR distributions, incident postmortems, and recent independent penetration-test or assurance summaries.
    whyItMatters: Status pages and external trackers prove that incidents happen, but not whether GoCardless contains them fast enough for mission-critical merchant use cases.
    diligencePath: Request 12-18 months of severity-tagged incident history, root causes, communication timelines, and the latest external assurance package under NDA.
    relatedQuestionRefs:
    - QR011
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: Revenue, payment-volume, pipeline, and retention exposure attributable to embedded or exclusive partner channels.
    whyItMatters: Embedded distribution is strategically attractive, but concentration can quietly convert partner wins into a material single-channel dependency.
    diligencePath: Request partner-level GMV, net revenue, pipeline attribution, contract terms, renewal rights, and technical dependency maps for the top channels.
    relatedQuestionRefs:
    - QR018
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: mollie-close-and-integration
    missingEvidence: A regulator-readiness checklist, approval timeline, integration workstreams, and accountabilities for customer support, roadmap, and product governance after close.
    whyItMatters: The deal could materially improve breadth and financing flexibility, but until approvals and governance are visible it remains both a strategic asset and an execution dependency.
    diligencePath: Request the integration PMO plan, conditions-precedent tracker, customer-communications plan, and any ring-fencing for regulated operations during transition.
    relatedQuestionRefs:
    - QR021
    relatedTableRefs:
    - TR003
    - TR005
