- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Risk
  - Why it matters
  - Likelihood
  - Severity
  - Visible mitigation
  - Diligence ask
  rows:
  - - Multi-jurisdiction licensing perimeter
    - GoCardless operates through UK, French, and U.S. regulatory setups, so product expansion can outgrow one entity's permissions.
    - Medium
    - High
    - Existing FCA and ACPR authorisations plus disclosed U.S. program structure.
    - Confirm which entity and permission set covers each product and geography in scope.
  - - Privacy-controller and lawful-basis burden
    - GoCardless publicly takes controller responsibilities and relies on AML, PSD2, and legitimate-interest bases that merchants must understand.
    - Medium
    - High
    - GDPR programme, ICO registration, and documented privacy/legal materials.
    - Review DPA, controller allocation, data-flow maps, and breach-notification obligations.
  - - Scheme-compliance suspension risk
    - Its own RFP guide says non-compliance with payment regulations or scheme rules can suspend access and disrupt collections immediately.
    - Low-Medium
    - High
    - RFP guidance shows management understands the control stack.
    - Request last three years of regulator or scheme findings and remediation logs.
  - - Complaints and customer-remediation scrutiny
    - Payments businesses can face ombudsman escalation if complaint handling is weak or slow.
    - Medium
    - Medium-High
    - Formal dispute-resolution flow with ombudsman escalation paths.
    - Review complaint volumes, upheld rates, and jurisdiction-by-jurisdiction response times.
  - - Open-banking rulebook still evolving
    - The FCA still plans a long-term framework consultation by end-2026, so economics and governance could shift while product adoption is ramping.
    - High
    - Medium-High
    - UKPI launch plus GoCardless participation gives early influence and product timing.
    - Ask how sensitive pricing, fallback logic, and roadmap assumptions are to rulebook changes.
  notes: Rows are ordered by residual severity and focus on legal or regulatory exposures that could directly impair payment collection, onboarding, or product rollout.
  enumerationScope:
    coverage: partial
    basis: Rows cover the main publicly evidenced legal and regulatory risk buckets for GoCardless as of the 2026-06-29 run date rather than every jurisdictional nuance.
