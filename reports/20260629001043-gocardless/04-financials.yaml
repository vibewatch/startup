- id: TI005
  title: Public financial gaps
  columns:
  - Missing metric
  - Impact on underwriting
  - Exact diligence path
  - Linked questions
  rows:
  - - Current cash balance
    - Cannot verify whether profitability trajectory is backed by adequate liquidity today
    - Request latest bank balances, unrestricted cash, and any trapped cash disclosure
    - QI025
  - - Monthly burn and runway
    - Impossible to size downside funding risk or covenant headroom
    - Request monthly cash-flow bridge, scenario cases, and treasury forecast
    - QI025
  - - Gross margin by product
    - Cannot separate strong unit economics from temporary opex cuts
    - Request gross-margin by Direct Debit, Instant Bank Pay, send-money, and settlement products
    - QI024
  - - CAC, payback, NRR, and churn
    - No public sales-efficiency or retention proof despite growth story
    - Request cohort dashboard by segment, geography, and plan tier
    - QI024
  - - Realized plan mix and discounts
    - Public list pricing may overstate realized yields on enterprise accounts
    - Request top-20 contract pricing, discount ladders, and renewal economics
    - QI026
  - - Failure / chargeback fee incidence
    - Fee mechanics are visible but actual monetization from exceptions is not
    - Request exception-fee revenue, disputed-payment rates, and reserve assumptions
    - QI026
  - - Debt facility terms behind HSBC charge
    - A charge exists, but the economics and constraints are hidden
    - Request facility agreement, covenant schedule, and lender consent rights
    - QI019
  - - FY25 geographic and product revenue mix
    - Volume doubled but mix quality remains unclear
    - Request FY25 revenue bridge by geography, channel, and product
    - QI023
  - - Contribution margin for new products
    - Cannot tell whether Same Day Settlement+, Outbound Payments, and Pipe are strategic or financially material
    - Request product P&Ls, attach rates, and adoption by customer cohort
    - QI022
  notes: These are the material public-data gaps that still block a full underwriting view even after clear progress on growth and profitability trajectory.
