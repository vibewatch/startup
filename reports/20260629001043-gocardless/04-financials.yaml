tables:
- id: TI001
  title: Revenue streams
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Direct Debit processing
    - Percentage fee plus fixed fee deducted from payment flows
    - Per submitted transaction
    - Standard 1%+20p capped £4; Advanced 1.25%+20p capped £5; Pro 1.4%+20p capped £5.60
    - High for list pricing, low for realized net take rate
    - Request plan mix, realized take rates, and enterprise discount schedules
  - - Instant Bank Pay / open-banking collections
    - One-off bank-to-bank payments with instant confirmation
    - Per transaction
    - Marketed as 49% cheaper than cards with 99% payment success; explicit fee schedule not broken out separately
    - Medium; marketing economics not realized economics
    - Request product-level fee card, margins, and adoption by customer segment
  - - International collections
    - Cross-border bank debit with Wise FX conversion
    - Per submitted transaction
    - 2.0%/2.25%/2.4% + 20p by plan; uncapped internationally
    - High for list pricing, low for actual FX revenue mix
    - Request revenue split and effective take rate by corridor
  - - Advanced / Pro feature bundles
    - Higher plan pricing tied to Success+, Verified Mandates, and Protect+
    - Per account / plan tier
    - Upsell visible through higher list pricing but not as separate revenue line
    - Medium
    - Request attach rates, upgrade conversion, and churn by plan
  - - Same Day Settlement+
    - Liquidity enhancement for recurring collections
    - Product enhancement / likely premium feature
    - Select rollout; 96% same-day payout on successful collections; pricing undisclosed
    - Medium
    - Request pricing, attach rate, and gross-margin contribution
  - - Outbound Payments / Nuapay send capability
    - Adds disbursements and send-money flows alongside collections
    - Per payout / account-to-account flow
    - Capability expanded materially after September 2024 Nuapay close; revenue model undisclosed
    - Medium
    - Request volume, pricing, and margin by send-money workflow
  - - Capital powered by Pipe
    - Embedded working-capital referral inside GoCardless platform
    - Referral / receivables-finance economics
    - £13.3m advanced to 844 merchants in pilot; GoCardless economics undisclosed
    - Medium
    - Request referral revenue share, merchant uptake, and any credit or recourse exposure
  notes: List pricing is public, but stream-level realized revenue, margins, and attach rates are mostly undisclosed.
