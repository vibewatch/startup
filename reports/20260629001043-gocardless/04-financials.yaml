company:
  name: GoCardless
chapter:
  number: 4
  title: Financials
  summary: GoCardless now discloses enough to show a clearer profitability arc—FY24 revenue reached £126.8m, FY25 group turnover reached £160.9m, and the company reported its first adjusted EBITDA-positive quarter in Q4 FY25—but public underwriting is still constrained by missing cash, gross-margin, burn, and realized take-rate disclosure. The financial story is a recurring-payments platform monetized through transaction fees, higher-tier recovery/fraud bundles, and adjacent bank-payment products, with operating leverage improving faster than transparency.
sections:
- id: revenue-model-and-pricing
  title: Revenue model and pricing stack
  body: 'GoCardless remains a transaction-led bank-payments business. The core monetization engine is Direct Debit processing priced as a percentage fee plus a fixed fee, with higher tiers charging more in exchange for failure-reduction, verification, and fraud tooling. Support documentation shows that fees are deducted at source for standard plans, while custom plans are invoiced, which means the platform monetizes payment flow before merchant payout rather than via a pure software subscription. That matters for revenue quality: headline pricing is visible, but realized take rate still depends on plan mix, enterprise discounts, failure-fee incidence, and product attach.


    The product stack widens that monetization base. Instant Bank Pay extends GoCardless into one-off open-banking payments; Same Day Settlement+ improves payout timing and could justify premium pricing for liquidity-sensitive merchants; and the Nuapay acquisition added send-money capability, allowing GoCardless to pitch a broader bank-payments operating system rather than only collections. Public materials also point to ancillary monetization levers such as add-ons, charity pricing, partner/embedded channels, and merchant financing referrals through Pipe. The visible list pricing is strong evidence that GoCardless can monetize multiple workflow layers, but public disclosures still stop short of showing product-level revenue mix or gross profit by stream.'
