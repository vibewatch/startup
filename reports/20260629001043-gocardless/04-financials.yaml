  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: A monthly cash balance, cash-flow statement, and board-level runway view for the most recent quarter.
    whyItMatters: Without cash and burn data, capital adequacy can only be inferred from management commentary and trajectory claims.
    diligencePath: Request latest management accounts, 13-week cash forecast, and covenant-compliance reporting from finance leadership.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-cac
    missingEvidence: Gross margin by product line, bank-scheme cost pass-through, CAC, payback, retention, and NRR by cohort.
    whyItMatters: The profitability path cannot be underwritten without knowing whether operating leverage comes from structural margin improvement or temporary cost cuts.
    diligencePath: Request cohort KPIs, product-level COGS, and sales-efficiency dashboards used by management and the board.
    relatedQuestionRefs:
    - QI013
    - QI024
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-mix
    missingEvidence: Net take rate by plan, enterprise discount schedules, failure-fee incidence, and revenue mix by Direct Debit, Instant Bank Pay, Same Day Settlement+, embed, and financing referral.
    whyItMatters: Visible list pricing is not enough to test revenue quality or confirm whether the lower revenue-to-volume ratio is mix-driven or discount-driven.
    diligencePath: Request FY24-FY25 revenue bridge by stream, plan mix, and top-20 enterprise contract terms.
    relatedQuestionRefs:
    - QI023
    - QI026
    relatedTableRefs:
    - TI001
    - TI002
  - type: missing-source
    severity: material
    topic: debt-facility-terms
    missingEvidence: Facility size, pricing, maturity, and covenant package behind the HSBC Innovation Banking charge.
    whyItMatters: A registered charge proves secured obligations exist, but not whether they constrain liquidity, additional borrowing, or change-of-control flexibility.
    diligencePath: Obtain the underlying facility agreement, borrowing-base mechanics if any, and any covenant-waiver correspondence.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: product-level-disclosure
    missingEvidence: Contribution margin, customer adoption, and revenue contribution for Same Day Settlement+, Outbound Payments, and merchant financing.
    whyItMatters: These products may improve ARPU and cash-flow stickiness, but public sources do not quantify how meaningful they are financially.
    diligencePath: Request product P&Ls, attach-rate data, and customer cohort adoption by segment for all non-core products.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI001
    - TI005
