- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy and financing dependency
  body: 'On publicly available evidence, GoCardless looks much closer to self-funding than it did two years ago, but the capital-adequacy case is still indirect. CNBC quoted management in February 2025 saying the company had no need for external capital and no near-term IPO plans, and FStech later reported directors expected the business to become cash generative by June 2026. Those are encouraging signals when paired with the move to adjusted EBITDA positivity, yet they are still management claims rather than a full cash bridge. Public sources do not disclose the current cash balance, monthly burn, or runway.


    There are still visible financing signals. Companies House shows GoCardless filed FY25 accounts on 12 April 2026, and the filing history also includes an August 2024 MR01 in favor of HSBC Innovation Banking that contains fixed charges and a negative pledge. That suggests external facility infrastructure exists even though the public pack does not show facility size, pricing, maturity, or covenants. Separately, the pending Mollie acquisition—signed in December 2025 and expected to close in mid-2026—could reduce standalone financing dependency if completed, but until regulatory approval lands GoCardless should still be underwritten as a standalone business with incomplete cash disclosure. Merchant financing through Pipe supports customers, not corporate liquidity, so it is not a substitute for balance-sheet transparency.'
  claimRefs:
  - CI018
  - CI019
