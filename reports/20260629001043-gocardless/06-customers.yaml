    {
      "id": "durability-satisfaction-and-procurement",
      "title": "Durability, satisfaction, and procurement friction",
      "body": "Public durability evidence is usable but incomplete. There is one encouraging signal in the FY25 disclosure: management explicitly attributes some growth to renewals and expansions, so at least part of the customer book is sticking and deepening. Review-market evidence also shows a real installed base; Softwarereviews, GetApp, Capterra, and the Xero marketplace all have enough activity to suggest the product is widely deployed. But none of those surfaces substitutes for true NRR, GRR, or churn data, and no retained source discloses cohort behavior by segment. Procurement looks bifurcated. Self-serve customers can stay on rolling monthly terms, which keeps entry friction low, while custom pricing introduces a 12-month minimum and, according to Vendr, annual or multi-year structures at larger scale. Review evidence adds a cautionary note: the same public corpus that praises recurring-payment automation also describes verification lockouts, support delays, payout confusion, and reconciliation edge cases. That does not negate the product fit, but it does suggest that customer success quality is less uniform than the flagship case studies imply.",
