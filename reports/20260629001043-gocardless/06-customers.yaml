    {
      "id": "adoption-trajectory-and-production-proof",
      "title": "Adoption trajectory and named production proof",
      "body": "The adoption proof is materially better than logo slides. The FY25 update still links growth to new signings, renewals, and expansions, while the named proof set shows production deployments with concrete outcomes. Octopus Energy is the clearest large-enterprise anchor: millions of migrated accounts, faster refunds, billions of pounds in annual payment flow, and explicit quotes from both sides that describe an operating system already in use. Plum and Bike Club show that the product also works in high-frequency recurring contexts where payment failure reduction, fraud control, and lower admin costs matter to unit economics. JustGiving adds nonprofit and open-banking proof by showing GoCardless across both recurring donations and instant one-off gifts. The newer 2026 partner launches with AccountsIQ, Sequence, and Intelligent Billing extend that proof into embedded workflows, where GoCardless is no longer just a standalone tool but the bank-collection layer inside another software product. The result is a customer story with real breadth across direct merchant accounts, enterprise anchors, and partner-mediated distribution.",
