    {
      "id": "expansion-concentration-and-partner-dependence",
      "title": "Expansion, concentration, and partner dependence",
      "body": "GoCardless appears to have multiple expansion vectors, but they come with different risk profiles. Inside existing accounts, the clearest motion is cross-selling more capability around the core bank-collection engine: open banking, instant pay-by-bank, retry intelligence, fraud tooling, and deeper automation. Outside existing accounts, the bigger 2026 story is partner-led distribution. AccountsIQ, Sequence, and Intelligent Billing all show GoCardless embedding into software that already owns the billing or finance workflow, and the partner program itself advertises 400+ partners across 36 countries. That is strategically attractive because it lowers direct-sales burden and places GoCardless closer to daily operating workflows. It also introduces dependence: accounting or billing partners can shape onboarding, reconciliation quality, and support expectations before the customer ever experiences GoCardless directly. Concentration remains the biggest disclosure gap. Octopus proves enterprise capability, but there is no public top-customer share, no top-10 revenue mix, and no direct-vs-channel volume split. The customer base is probably diversified in logo count, but open sources do not show whether economic concentration is equally diversified.",
      "claimRefs": [
