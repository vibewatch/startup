    "number": 6,
    "title": "Customers",
    "summary": "GoCardless has credible, current customer proof across recurring invoice collection, fintech recurring payments, nonprofit donations, and partner-embedded finance software. The best proof is production-grade rather than logo-only: Octopus, Plum, Bike Club, and JustGiving all disclose quantified outcomes, while 2026 launches with AccountsIQ, Sequence, and Intelligent Billing show a growing embedded-distribution motion. The main underwritten gaps are classic diligence gaps, not adoption gaps: no public NRR/GRR, no top-customer concentration data, and meaningful review-site complaints around verification, reconciliation, payout timing, and support for some long-tail merchants."
  },
  "sections": [
    {
      "id": "segmentation-and-customer-jobs",
      "title": "Segmentation and customer jobs",
      "body": "GoCardless's customer base is broad in count but narrow in workflow shape. The strongest public evidence points to businesses that want to pull money directly from bank accounts on a recurring or invoice-linked basis: SMBs collecting invoices through Xero or QuickBooks, subscription businesses such as Bike Club, fintechs such as Plum, charities such as JustGiving, and increasingly software platforms that embed payments inside their own billing stack. That mix matters because the buyer is often a finance or operations team, while the end user may be a merchant, donor, subscriber, or app customer completing a bank authorisation journey. Official 2026 materials still anchor on over 100,000 businesses and 30+ countries, but the visible proof set is more specific about recurring collection, reconciliation, and bank-payment cost savings than about generalized checkout acceptance. In other words, GoCardless is not winning by being a universal PSP; it is winning where bank-account collection, predictable cash flow, and lower admin burden are more important than maximizing payment-method breadth.",
