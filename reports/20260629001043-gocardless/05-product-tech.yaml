callouts:
- calloutType: strength
  title: GoCardless now looks like a multi-rail bank-payments orchestration layer
  body: The strongest public evidence is not just that GoCardless can collect direct debits, but that it can sequence immediate open-banking payments, recurring mandates, retries, fraud controls, and partner reconciliation around the same customer workflow.
  claimRefs:
  - CE001
  - CE006
  - CE022
  - CE027
  - CE045
- calloutType: insight
  title: Embedded finance distribution is a real product advantage
  body: Xero, QuickBooks, and AccountsIQ proof points suggest GoCardless wins when the buyer wants collections to disappear into finance software rather than run as a separate payment operation.
  claimRefs:
  - CE032
  - CE033
  - CE035
  - CE045
- calloutType: risk
  title: Public trust signals are good, but enterprise-grade assurance still needs private diligence
  body: Status pages, FCA/ISO messaging, and incident disclosure help, yet the retrieved public materials still do not expose enough SLA, RCA, or control-design detail to underwrite operational or security risk on marketing evidence alone.
