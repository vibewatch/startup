figures:
- id: FE001
  title: Product architecture map
  type: stack
  layout: standard
  summary: Public evidence points to a layered architecture that starts with merchant surfaces, centers on Billing Requests and event flows, and extends into rails, data access, and intelligence add-ons.
  data:
    layers:
    - label: Merchant surface layer
      detail: Dashboard, hosted payment pages, secure links, partner apps, and no-code onboarding for SMB operators
    - label: Control plane layer
      detail: Billing Requests, API objects, webhooks, and developer tooling such as Postman, OpenAPI, and maintained SDKs
    - label: Payment rail layer
      detail: Direct debit for recurring pulls, Instant Bank Pay for one-off A2A, and Recurring Pay by Bank for emerging recurring open-banking flows
    - label: Data and intelligence layer
      detail: Bank Account Data AIS, verification states, Success+ retry intelligence, Protect+ fraud controls, and MCP-assisted interaction
    - label: Trust and operations layer
      detail: Security controls, status pages, institution monitoring, and partner-embedded reconciliation workflows
  approximationNotes: The stack reconstructs public operating layers from retrieved docs and status pages; internal microservice boundaries, queues, and persistence tiers are not disclosed.
  claimRefs:
  - CE003
  - CE006
  - CE013
  - CE018
  - CE028
  - CE030
  - CE037
  - CE043
- id: FE002
  title: Customer workflow / operating flow
  type: flow
  layout: wide
  summary: The core operating flow moves from merchant setup to payer authorisation, immediate or scheduled collection, post-payment automation, and optional retry or fraud handling.
  data:
    nodes:
    - id: n1
      label: Choose integration path
      detail: Merchant starts in dashboard, hosted page, partner app, or custom API flow
      tone: neutral
    - id: n2
      label: Create Billing Request
      detail: GoCardless packages customer, authorisation, bank details, and payment intent into one object
      tone: positive
    - id: n3
      label: Payer authorises
      detail: User signs a direct-debit mandate or approves an open-banking payment inside the bank app
      tone: positive
    - id: n4
      label: Collect now or schedule later
      detail: Instant Bank Pay confirms immediately; direct debit schedules recurring or invoice-linked pulls
      tone: positive
    - id: n5
      label: Webhook and partner updates
      detail: Events feed accounting tools, ERP flows, or automation scenarios for reconciliation and follow-up
      tone: neutral
    - id: n6
      label: Retry or fraud response
      detail: Success+ can retry failures and Protect+ can screen or challenge risky payers
      tone: warning
    - id: n7
      label: Optional bank-data insight
      detail: Bank Account Data can supply balances or transaction history through a consented AIS journey
      tone: neutral
    edges:
    - from: n1
      to: n2
      label: Initialize flow
    - from: n2
      to: n3
      label: Request authorisation
    - from: n3
      to: n4
      label: Payment becomes executable
