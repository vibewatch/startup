tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / surface
  - Primary user job
  - Rail / data base
  - Public maturity / status
  - Differentiation signal
  - Diligence gap
  rows:
  - - Direct Debit collections
    - Recurring billing and invoice pull collection
    - Bacs / SEPA / ACH-style debit rails
    - Mature, core product
    - Flexible mandate-based recurring collection with scheme support across multiple markets
    - No public product-level SLA or take-rate disclosure by scheme
  - - Instant Bank Pay
    - Immediate one-off account-to-account payment
    - Open banking payment initiation
    - Scaled and customer-facing since 2021
    - Fast confirmation without a recurring mandate
    - Coverage by institution and country is not published in one underwriting-grade export
  - - Instant + Direct Debit
    - Take an upfront payment and set up recurring billing in one session
    - Open banking plus direct debit
    - Documented in official product overview
    - Bridges acquisition and recurring monetisation in one flow
    - No public conversion-rate disclosure for combined flow
  - - Recurring Pay by Bank
    - Recurring open-banking payments for flexible schedules
    - UKPI recurring open banking
    - New in 2026
    - Extends pay-by-bank into a recurring rail instead of only one-off checkout
    - Public evidence is still early-stage and sector availability detail is thin
  - - Success+
    - Recover failed payments automatically
    - Payment-intelligence / retry engine
    - Mature add-on with public case metrics
    - Retry timing is data-driven instead of manual chase workflows
    - Model inputs, false negatives, and cohort-level performance are not public
  - - Protect+
    - Screen and challenge risky payers
    - Fraud intelligence and monitoring
    - Mature add-on with explicit anti-fraud positioning
    - Bank-payment-specific fraud tooling layered directly into collections flow
    - No public precision / recall, rule coverage, or chargeback-loss benchmark
  - - Bank Account Data API
    - Retrieve account, balance, and transaction data
    - AIS / PSD2 connectivity
    - Production technical docs and quickstart available
    - Extends stack from payment initiation into financial-data access
    - Product-level bank coverage and pricing gates are not fully public
  - - Accounting / ERP integrations
    - Embed collection and reconciliation in finance tools
    - Partner apps and APIs
    - Strong public proof in Xero, QuickBooks, and AccountsIQ
    - Reduces operator friction by meeting finance teams inside existing systems
    - Integration depth varies by partner and public docs do not normalize the support burden
  - - MCP developer interface
    - Use LLMs for implementation guidance and operational queries
    - Natural-language control surface over GoCardless context
    - New in February 2026
    - Expands the platform from API-only access to AI-assisted platform interaction
    - Security, permissioning, and production usage controls are not publicly detailed
  notes: Rows reflect the publicly disclosed product family as of 2026-06-29; partner-specific packaging and geo availability still need diligence.
