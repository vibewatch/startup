- id: deployment-and-ecosystem
  title: Deployment, integrations, and support motion
  body: 'Deployment flexibility is one of the clearest strengths in the public evidence set. Merchants can start through hosted pages or dashboards, embed parts of the flow with JavaScript, or build full API-led experiences. For finance teams, the more important proof is in partner software: Xero, QuickBooks, and AccountsIQ all frame GoCardless as a collection and reconciliation layer that sits inside the accounting workflow instead of forcing users to operate a separate payments back office. The AccountsIQ announcement is especially telling because it highlights webhooks, branded mandate emails, fee capture, and invoice matching, which suggests GoCardless is selling control and automation rather than just a payment button. Developer tooling reinforces the same point: official Postman assets, OpenAPI documentation, and maintained SDKs make the product easier for platforms, ERP vendors, and implementation teams to operationalize without inventing every primitive themselves.'
  claimRefs:
  - CE004
  - CE018
  - CE019
  - CE020
  - CE032
  - CE033
  - CE035
  - CE036
  - CE045
  tableRefs:
  - TE005
- id: trust-and-reliability
  title: Trust, security, reliability, and operational controls
  body: 'The trust stack is stronger at the control-summary level than at the audit-detail level. GoCardless’s security pages explicitly claim FCA authorisation, ISO27001 certification since 2016, GDPR-aligned data-risk management, safeguarded client-money accounts, strong encryption, and Direct Debit Guarantee coverage. On reliability, the company is unusually willing to publish live status surfaces: there is a core status page, a dedicated bank-data status page, and a separate Instant Bank Pay institution-status page. That is a positive signal because it exposes the product as a set of components and dependencies rather than a monolith. At the same time, the evidence set also shows real incidents and maintenance windows, including a public dashboard blank-screen event and recent third-party reports of delivery, integration, and event/API issues. The gap is depth: public pages show current health and some incidents, but they do not supply enough SLA or postmortem detail for enterprise-grade
    operational underwriting.'
  claimRefs:
  - CE024
  - CE025
  - CE034
  - CE037
  - CE038
  - CE039
  - CE040
  - CE041
  - CE042
  - CE043
