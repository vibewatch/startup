  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: coverage-granularity
    missingEvidence: A current product-by-product supported-bank export showing country, institution, rail, and fallback behavior for Instant Bank Pay, Recurring Pay by Bank, Bank Account Data, and verification.
    whyItMatters: High-level coverage claims do not tell an investor whether a target merchant’s bank mix supports each GoCardless module at launch or after fallback.
    diligencePath: Ask solutions engineering for the current supported-bank extracts by module and market, plus any exclusions for recurring open-banking or verification use cases.
    relatedQuestionRefs:
    - QE008
    relatedTableRefs:
    - TE001
    - TE003
  - type: missing-source
    severity: material
    topic: public-security-assurance
    missingEvidence: Publicly shareable security pack items such as certificate scope documents, penetration-test summaries, webhook-signing details, key-management descriptions, and a customer shared-responsibility matrix.
    whyItMatters: The public security page is helpful for trust signaling but too high level to evaluate control design, merchant obligations, or residual fraud and data-protection exposure.
    diligencePath: Request the enterprise security questionnaire, latest certificate scope, incident-response commitments, and product-level control mapping during diligence.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: access-blocked
    severity: material
    topic: reliability-sla-detail
    missingEvidence: Historical uptime exports, customer SLA terms, and postmortems for dashboard, webhook, partner-app, and bank-data incidents in 2026.
    whyItMatters: Public status pages prove transparency but do not expose enough historical RCA detail to price operational risk, support obligations, or service-credit exposure.
    diligencePath: Request enterprise SLA schedules, incident writeups, and component-level uptime history from customer success or platform operations.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE003
    - TE004
