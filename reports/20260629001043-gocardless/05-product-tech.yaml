company:
  name: GoCardless
chapter:
  number: 5
  title: Product & Technology
  summary: GoCardless has evolved from a direct-debit specialist into a broader bank-payments control layer spanning recurring debit, instant pay-by-bank, Bank Account Data, retry/fraud add-ons, and partner-embedded finance workflows. Public evidence is strongest on workflow orchestration, developer tooling, and accounting integrations, while backend architecture, institution-level coverage by module, and enterprise SLA detail remain meaningfully under-disclosed.
sections:
- id: product-surface
  title: Product surface and customer jobs
  body: GoCardless’s product surface is best understood as a bank-payment control layer, not a single direct-debit API. The official product and developer materials show a ladder of payment types that starts with classic mandate-based direct debit, extends into one-off Instant Bank Pay, and then combines both through an upfront instant payment plus a direct-debit setup for future recurring charges. That matters because the user job is not simply “collect a debit”; it is to let a merchant decide when it needs immediate confirmation, when it wants a reusable mandate, and when it wants both in the same onboarding flow. The public materials also show adjacent modules around retry recovery, fraud prevention, account-information access, and partner-embedded finance workflows, which means GoCardless has moved beyond a narrow recurring-payments narrative into a broader bank-payments operations stack.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE006
  - CE013
  - CE021
  - CE022
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE002
- id: architecture-and-data-flow
  title: Architecture and operating model
  body: 'The most visible architectural center of gravity is Billing Requests, which GoCardless documents as the object that brings customer identity, authorisation, bank details, and payment details together. Around that control plane, the public stack splits into several layers: merchant-facing setup surfaces, partner and API integration layers, the direct-debit and open-banking rails, and optional data or intelligence services. The Bank Account Data documentation adds a second operating model beside payments: merchants initiate a user journey, GoCardless hosts consent, banks host authentication, and the resulting access tokens let the platform retrieve balances or transaction history subject to PSD2 constraints and bank-side rate limits. This is a practical, integration-led architecture rather than a deeply disclosed backend topology; GoCardless publishes enough to explain how users and developers move through the system, but not enough to reconstruct service boundaries, throughput design,
    or internal failover logic.'
  claimRefs:
  - CE003
  - CE004
  - CE013
  - CE014
  - CE015
