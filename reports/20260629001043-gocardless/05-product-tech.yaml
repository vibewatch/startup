      to: n5
      label: Post payment events
    - from: n4
      to: n6
      label: If payment fails or payer looks risky
    - from: n2
      to: n7
      label: If data access is also required
    - from: n7
      to: n5
      label: Feed downstream systems
  approximationNotes: The workflow abstracts over scheme-specific timelines and emphasizes customer-visible operating stages rather than internal service calls.
