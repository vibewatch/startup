- id: differentiation-and-roadmap
  title: Differentiation, AI/retry tooling, and roadmap direction
  body: GoCardless looks most differentiated where merchants need a bank-payment specialist that can orchestrate multiple rails instead of simply exposing one scheme. The 2026 open-banking adoption disclosures argue that the company has already made pay-by-bank accessible to SMBs through no-code onboarding and fallback routing, while the partner evidence shows it can disappear into finance software instead of demanding separate operator behavior. The product roadmap extends that same logic. Recurring Pay by Bank tries to turn today’s one-off open-banking gains into a reusable recurring rail, while MCP aims to lower the cost of implementation and operational analysis by letting users query the platform in natural language. The common thread is control-surface expansion around the core payment engine. The biggest caveat is that some of the boldest claims—coverage breadth by module, AI efficacy outside headline case studies, and enterprise reliability commitments—still rely on company framing
    rather than richly auditable public evidence.
  claimRefs:
