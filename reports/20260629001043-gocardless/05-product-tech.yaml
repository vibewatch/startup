- id: TE002
  title: Workflow / use-case table
  columns:
  - Workflow
  - Current pain
  - GoCardless path
  - Publicly claimed benefit
  - Key limitation
  rows:
  - - Recurring SaaS or membership billing
    - Manual chasing and late card retries
    - Direct Debit mandate plus scheduled pulls
    - Predictable cash flow and reduced admin
    - DD settlement remains slower than instant pay-by-bank
  - - Invoice collection
    - Manual bank transfer reconciliation
    - Invoice-linked direct debit or partner integration
    - Automatic reconciliation in accounting tools
    - Partner experience varies by software and region
  - - Checkout with immediate activation plus future recurring charges
    - Need payment now and recurring authority later
    - Instant payment plus direct-debit setup in one flow
    - Immediate confirmation plus future billing reuse
    - Public conversion and drop-off data is undisclosed
  - - Failed-payment recovery
    - Generic retry rules and involuntary churn
    - Success+ intelligent retries
    - Up to 70% failed-payment recovery and higher success rates
    - Headline metrics are company-claimed rather than independently audited
  - - Fraud-sensitive mandate or payer onboarding
    - Chargeback exposure and low-quality signups
    - Protect+ plus verification checks
    - Lower fraud friction without manual screening of every payer
    - Public model-performance detail is unavailable
  - - Finance-team reconciliation
    - Separate payments console and spreadsheet matching
    - QuickBooks, Xero, or AccountsIQ embedded workflows
    - Mandate setup, collections, and invoice matching inside finance systems
    - Not every ERP or CRM integration is equally deep
  - - Bank-data verification and insight
    - Multiple bank connections or screen-scraping complexity
    - Bank Account Data API with consented access
    - Single-integration access to balances and transaction history
    - Coverage, limits, and verification options vary by bank and market
  notes: Benefits come from public product and partner materials; measurable outcomes are unevenly disclosed across workflow types.
  enumerationScope:
    coverage: exhaustive
    basis: Publicly evidenced core merchant workflows repeatedly described across official product pages, developer docs, and partner integration materials.
