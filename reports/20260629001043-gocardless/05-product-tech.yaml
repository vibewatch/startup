  claims:
  - id: CE001
    statement: GoCardless publicly positions itself as a bank-payments platform that supports recurring and one-off collections rather than as a single-use direct-debit tool.
    type: company-claimed
    topic: product-surface
    sourceRefs:
    - SE001
    - SE002
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QE001
    - QE002
  - id: CE002
    statement: The core public payment types are one-off Direct Debit, subscriptions, instalments, Instant Bank Pay, Instant plus Direct Debit, and variable recurring payments.
    type: company-claimed
    topic: payment-types
    sourceRefs:
    - SE001
    - SE002
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QE001
    - QE002
    - QE006
  - id: CE003
    statement: Billing Requests are documented as the primary object that combines customer identity, authorisation, bank details, and payment instructions.
    type: observed
    topic: billing-requests
    sourceRefs:
    - SE001
    - SE002
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QE003
    - QE005
  - id: CE004
    statement: 'GoCardless documents three main integration patterns for collections: hosted payment pages, an embedded JavaScript drop-in flow, and fully custom API-led payment pages.'
    type: observed
    topic: integration-patterns
    sourceRefs:
    - SE001
    - SE002
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QE004
  - id: CE005
    statement: Direct debit setup still depends on payer authorisation, advance notice, and scheme submission rules, so settlement is slower than open-banking payment initiation.
    type: observed
    topic: direct-debit-workflow
    sourceRefs:
    - SE002
    - SE007
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QE003
    - QE006
  - id: CE006
    statement: Instant Bank Pay is a faster one-off path while direct debit remains the mandate-based recurring rail, giving GoCardless a dual-rail workflow that can support immediate payment and later recurring collection.
    type: inferred
    topic: dual-rail-workflow
    sourceRefs:
    - SE001
    - SE002
    - SE006
    confidence: high
    freshness: current
    answersQuestionRefs:
