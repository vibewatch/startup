- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role in the stack
  - Key dependency
  - Why it matters
  - Main public risk / gap
  rows:
  - - Merchant dashboard and hosted pages
    - No-code setup, payment pages, links, and day-to-day operations
    - GoCardless web UI and partner connectors
    - Lets SMBs deploy without in-house engineering
    - No public architecture or uptime SLA detail for operator-facing surfaces
  - - Billing Requests / API control plane
    - Combines customer, authorisation, bank details, and payment instructions
    - API availability and object consistency
    - Acts as the abstraction layer across multiple payment types
    - Internal service decomposition and failover are not public
  - - Direct-debit schemes
    - Execute recurring pulls after mandate setup
    - Bacs and other scheme operators
    - Provides the durable recurring rail
    - Settlement remains slower and scheme-timed
  - - Open-banking payment initiation
    - Powers Instant Bank Pay and recurring pay-by-bank evolution
    - Bank API connectivity and UKPI / open-banking rails
    - Adds real-time confirmation and reduces card dependence
    - Institution coverage and uptime vary by bank
  - - Bank Account Data / AIS
    - Supplies balances, transactions, and account information
    - PSD2 banks, consent journey, and token lifecycle
    - Extends product from payment collection into financial-data workflows
    - Bank rate limits and product-level coverage detail constrain predictability
  - - Webhooks and partner app events
    - Push real-time state changes into accounting or workflow tools
    - Event delivery, partner app mappings, and merchant consumption logic
    - Critical for reconciliation and automation
    - Public docs do not expose queueing, retry, or durability targets
  - - Payment-intelligence services
    - Drive retries, fraud detection, and emerging AI-assisted workflows
    - Historical transaction data and model governance
    - Differentiates GoCardless beyond raw payment rails
    - Model quality and false-positive tradeoffs are not publicly benchmarked
  - - Status and institution monitoring surfaces
    - Expose health for core components, bank data, and IBP institutions
    - Operational telemetry and third-party bank availability
    - Improves transparency and troubleshooting
    - Public pages stop short of enterprise-grade SLA and RCA disclosure
  notes: This table reconstructs the public operating model from developer, status, and partner materials; backend service topology remains partially undisclosed.
