  topStrengths:
    - >-
      Product position is unusually strong for a private European payments company: GoCardless spans direct debit,
      instant pay-by-bank, recurring pay-by-bank, bank-account data, and recovery/fraud add-ons inside one bank-payments
      control layer.
    - >-
      Financial trajectory is clearly improving: FY25 turnover reached £160.9m, payment volume doubled to £79.2bn, and
      the company recorded its first adjusted EBITDA-positive quarter in Q4 FY25.
    - >-
      Customer proof is concrete rather than logo-only, with Octopus, Plum, Bike Club, and JustGiving all disclosing
      production metrics, while AccountsIQ, Sequence, and Intelligent Billing extend partner-led distribution.
    - >-
      A signed Mollie transaction provides real strategic validation and a plausible long-term cross-sell and
      payment-method-breadth upside if integration executes cleanly.
  topRisks:
    - >-
      Official sources still do not disclose the deal price, minority-holder treatment, or share-versus-cash mix, while
      the only retained public price marker sits well below the 2022 $2.1B round valuation.
    - >-
      The transaction was still pending regulatory approvals and mid-2026 close as of 2026-06-29, and public sources do
      not resolve post-close governance or integration sequencing.
    - >-
      Public disclosure remains incomplete on cash, gross margin, NRR, CAC/payback, direct-versus-channel mix, and exact
      current headcount, limiting full underwriting despite better top-line visibility.
    - >-
      Incident history, support and reconciliation complaints, and dependence on schemes, banks, and software partners
      create non-trivial execution and trust risk in a regulated payments stack.
  unresolvedGaps:
    - >-
      Official transaction price, waterfall economics, minority-holder treatment, and cash-versus-share mix for the
      Mollie sale.
    - Confirmed regulatory approvals, legal close date, and post-close board or governance structure.
    - >-
      FY26 cash generation, gross margin, NRR/churn, and customer or partner concentration by revenue and payment
      volume.
    - Exact current headcount, enterprise SLA/MTTR disclosure, and deeper incident root-cause evidence.
