evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-governance
    missingEvidence: >-
      A current board roster, committee structure, and governance page for GoCardless after the 2025 director changes
      and before or after the Mollie close.
    whyItMatters: >-
      Without a reconciled governance record, later chapters cannot cleanly assign oversight for strategy, risk,
      finance, or post-close integration decisions.
    diligencePath: >-
      Obtain the latest board pack, Companies House group-structure summary, and management-confirmed list of current
      directors and observers.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capital-raised
    missingEvidence: >-
      A cap table or investor summary that reconciles lifetime capital raised, current ownership, preference stack, and
      the role of GoCardless Holdings (UK) Limited.
    whyItMatters: >-
      Funding-history judgments are incomplete without knowing how much capital remains in the structure and how the
      signed Mollie deal reprices existing holders.
    diligencePath: >-
      Request the latest cap table, financing history schedule, and shareholder agreement summary from management or
      counsel.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: An exact run-date employee count after the 2025 layoffs and any later hiring or reorganization activity.
    whyItMatters: >-
      Current headcount is a key efficiency and operating-leverage metric, especially when profitability progress may
      depend on staffing discipline.
    diligencePath: >-
      Pull the latest HR headcount report or post-FY25 accounts disclosure and reconcile it against location-level staff
      counts.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
  - type: access-blocked
    severity: minor
    topic: fca-permissions
    missingEvidence: >-
      A directly readable FCA register extract showing current permissions, status wording, and any limits for firm
      reference 597190.
    whyItMatters: >-
      The company's legal page states FCA authorisation, but regulator-side verification of exact permissions is weaker
      when the live register page cannot be read directly.
    diligencePath: >-
      Use an FCA export, screenshot, or alternative regulator endpoint that exposes the firm record without the
      JavaScript shell.
    relatedQuestionRefs:
      - QO026
  - type: stale
    severity: material
    topic: mollie-close-status
    missingEvidence: >-
      A post-signing closing announcement or regulatory-approval update confirming whether the Mollie acquisition
      completed by or after late June 2026.
    whyItMatters: >-
      Deal-close status affects ownership, integration, valuation interpretation, and whether GoCardless should still be
      modeled as a standalone company.
    diligencePath: >-
      Check both companies' newsrooms, merger-control filings, and management communications for a close notice or
      revised timeline.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: uk-merchant-denominator
    missingEvidence: >-
      A current public count of UK online merchants, subscription billers, or recurring-collection businesses that maps
      directly onto GoCardless' target market.
    whyItMatters: >-
      Without a current denominator, UK SAM and penetration claims cannot move beyond proxy-based sizing using rail
      volumes and broad business-population counts.
    diligencePath: >-
      Acquire a current paid UK Payment Markets segment table, merchant-acquiring dataset, or sector-specific biller
      census and reconcile it against ONS and DBT releases.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: gocardless-open-banking-gmv
    missingEvidence: >-
      A company-level breakout of open-banking GMV, active merchant count, take rate, and share of total processed
      volume within GoCardless' $130bn+ annual payments base.
    whyItMatters: >-
      Installed-base adoption is visible, but investors cannot translate that adoption into revenue, margin, or rail-mix
      impact without an open-banking volume split.
    diligencePath: >-
      Request management cohort data showing open-banking GMV, active merchants, conversion, and contribution margin by
      segment and geography.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: access-blocked
    severity: material
    topic: uk-payment-forecasts
    missingEvidence: >-
      The detailed UK Payment Markets forecast tables and segment commentary through 2034 that sit behind the public
      landing page.
    whyItMatters: >-
      Those tables could provide a better public bridge between current rail activity and future method-mix assumptions
      for UK SAM construction.
    diligencePath: >-
      Purchase or otherwise access the full UK Payment Markets 2025 report and test whether its forecast categories
      align with GoCardless' target workflows.
    relatedQuestionRefs:
      - QM024
      - QM026
    relatedTableRefs:
      - TM002
      - TM004
  - type: missing-source
    severity: material
    topic: vrp-live-adoption
    missingEvidence: >-
      Public recurring-pay-by-bank or commercial-VRP live volume, merchant count, and vertical-by-vertical conversion
      data after UKPI launch.
    whyItMatters: >-
      The strategic case for GoCardless depends partly on recurring A2A adoption, but retained public sources still show
      roadmap and early-rollout signals more clearly than scaled commercial usage.
    diligencePath: >-
      Track UKPI reporting, merchant case studies, and GoCardless cohort disclosures for live recurring-pay-by-bank
      volumes and retention by vertical.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM003
      - TM004
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing-opacity
    missingEvidence: >-
      Current quote cards, minimums, and SLA-linked rate schedules for TrueLayer, Trustly, Tink, and Adyen enterprise
      bank-payment deals.
    whyItMatters: >-
      Public list pricing is not enough to model whether GoCardless wins or loses on unit economics in larger accounts
      where bank methods are negotiated inside wider payment bundles.
    diligencePath: >-
      Request recent signed quote sheets or anonymized customer proposals from management and benchmark them against a
      live Stripe, Adyen, and Mollie comparison set.
    relatedQuestionRefs:
      - QP025
  - type: missing-source
    severity: material
    topic: ukpi-wave-2-commercial-model
    missingEvidence: >-
      A finalized Wave 2 e-commerce cVRP fee schedule, liability model, and consumer-protection framework after the June
      2026 UKPI launch.
    whyItMatters: >-
      Recurring pay by bank can only scale into broader ecommerce if merchants can underwrite the economics, refunds,
      and protections of the new scheme rather than treating it as an early-sector pilot.
    diligencePath: >-
      Monitor UKPI, FCA, OBL, and UK Finance publications and ask management whether any live Wave 2 merchant pilots are
      already operating under non-public commercial terms.
    relatedQuestionRefs:
      - QP026
  - type: private-evidence-only
    severity: minor
    topic: win-loss-and-multi-homing-data
    missingEvidence: >-
      Segmented win-loss data showing when GoCardless displaces Stripe, Adyen, or specialist networks and when merchants
      simply multi-home instead.
    whyItMatters: >-
      The public corpus proves bundle pressure and add-a-method adoption paths exist, but it does not quantify how often
      they actually stop GoCardless from expanding inside existing accounts.
    diligencePath: >-
      Ask management for churn, competitive-displacement, and expansion data by segment, especially where pay by bank
      was added after cards were already live.
    relatedQuestionRefs:
      - QP013
      - QP022
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: A monthly cash balance, cash-flow statement, and board-level runway view for the most recent quarter.
    whyItMatters: >-
      Without cash and burn data, capital adequacy can only be inferred from management commentary and trajectory
