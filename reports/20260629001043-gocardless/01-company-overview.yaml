  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "GoCardless enters mid-2026 as a London-anchored UK fintech whose public materials now describe a global bank-payment network serving 100,000+ businesses and processing $130bn+ annually, while statutory and official evidence also supports FY25 group turnover of £160.9m and processed volume of £79.2bn. The company remains private, signed a sale to Mollie in December 2025 that was still described as pending mid-2026 close in retained sources, and was simultaneously tightening costs after roughly 20% staff cuts reported in early 2025. Identity, funding, and recent operating momentum are well evidenced; lifetime capital raised, exact current headcount, and a full current governance roster remain only partially disclosed."
  },
  "sections": [
    {
      "id": "identity-product-and-footprint",
      "title": "Identity, product scope, and geographic footprint",
      "body": "GoCardless' most stable identity anchors come from Companies House and the company's own current product pages. Companies House shows GoCardless Ltd as an active private limited company incorporated on 17 January 2011, with a registered office at Sutton Yard on Goswell Road in London. Current official site copy positions the company as building the world's bank payment network rather than as a generic PSP, with recurring bank debit, one-off bank payments, real-time payments, open banking, and AI-assisted payment recovery all presented as parts of one operating stack. That framing matters because it ties the business model to bank-account-based collection economics, not to card acquiring.\n\nThe geographic story is slightly less crisp than the legal one. Official 2025-2026 releases repeatedly say GoCardless is headquartered in the UK and operates across 30+ countries, while independent 2025-2026 coverage and the Companies House registered office point back to London as the practical HQ anchor. Scale disclosures have also moved upward over time: older fact sheets cited 75,000 to 85,000 businesses and roughly $30bn to $35bn of annual processing, whereas current official materials cite more than 100,000 businesses and $130bn+ of annual payments. The safest reuse rule for later chapters is therefore: treat incorporation, London registered office, bank-payment positioning, and current 100,000+ / $130bn+ official scale claims as the newest canonical baseline, while preserving older figures as stale historical snapshots rather than contradictions.",
