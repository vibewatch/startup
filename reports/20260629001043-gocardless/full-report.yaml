      - number: '1.4'
        title: Milestones, regulatory anchor, and adverse context
        blocks:
          - type: paragraph
            body: >-
              The 2025-2026 public record shows both product momentum and cost pressure. On the product side, GoCardless
              announced the first recurring Pay by Bank transaction with Jellyfish Energy in March 2025, launched
              Recurring Pay by Bank with the UK Payments Initiative scheme in June 2026, and continued adding
              partner-led distribution through integrations such as Sequence and Intelligent Billing. Those items matter
              for this chapter because they show the company actively extending its account-to-account thesis beyond
              traditional direct debit into open-banking-based recurring flows and embedded billing channels. The FY25
              release also ties recent growth to new customer and partner signings, renewals, and the Nuapay
              integration.


              The adverse context is that the path to profitability has not been painless. UKTN and PYMNTS both reported
              that GoCardless cut about 20% of staff, with headcount falling from 764 to just over 600 since 2023, while
              management simultaneously emphasized cost discipline and a route to profitability. Regulatory disclosure
              is partly solid and partly frustrating: GoCardless' own regulatory-information page clearly says the UK
              entity is authorised by the FCA under the Payment Services Regulations 2017 with registration number
              597190, but the fetched FCA register page itself rendered only a JavaScript loading shell during this run.
              As a result, later chapters can confidently reuse the existence of FCA-regulated status, but should keep
              permissions detail, exact current headcount, and post-signing acquisition-close status as still-open
              diligence items rather than settled facts.
