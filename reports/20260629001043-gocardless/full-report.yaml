        - Direct peer / recurring bank specialist
        - 100,000+ businesses; 15 years in recurring payments
        - Recurring billers, finance teams, SaaS, utilities, membership and invoice flows
        - Recurring pay by bank plus direct-debit fallback, retries, balance checks, bank guess
        - No public evidence of card-acquiring breadth or bundled platform distribution on Stripe/Adyen scale
      - - Stripe
        - Integrated PSP / card-centric suite
        - Global payments platform; bank methods sit beside Checkout, Connect, Billing, and Financial Connections
        - Developers, platforms, SMB to enterprise merchants wanting one stack
        - Broadest product bundle and strong bank or platform distribution
        - Pay by Bank is single-use; recurring bank payments still rely on ACH or SEPA debit
      - - Adyen
        - Integrated PSP / enterprise tender competitor
        - Enterprise pricing motion and recent GOV.UK Pay win covering around 1,000 services
        - Large merchants, public sector, marketplaces, omnichannel enterprises
        - Enterprise procurement credibility, mixed card plus bank tender fit
        - Less transparent SMB packaging; public recurring-bank-specialist story is weaker than GoCardless'
      - - TrueLayer
        - Open-banking specialist
        - 20 million users; 1 million+ user adds per month; live in 22 countries
        - Consumer checkout, travel, ecommerce, fintech, merchants wanting native pay by bank and payouts
        - Instant pay-by-bank network, payouts, verification, VRP, ecommerce plugins
        - No retained public evidence of a full card stack or transparent enterprise transaction pricing
      - - Trustly
        - Consumer pay-by-bank network
        - 120 million users; 9,000+ merchants; 12,000 banks; nearly $100 billion processed in 2025
        - Gaming, ecommerce, telecom, public-sector and high-conversion consumer flows
        - Large consumer network, payouts, guaranteed payments, gaming focus
