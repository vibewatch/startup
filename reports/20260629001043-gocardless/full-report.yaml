      - number: '3.2'
        title: 'Capability and pricing: specialization helps GoCardless, but transparency is uneven'
        blocks:
          - type: paragraph
            body: >-
              GoCardless is one of the clearer public price setters in this set. Its plan ladder is explicit, and the
              delta between Standard, Advanced, and Pro is tied to payment-failure recovery, fraud tooling, and
              customization. Stripe is also transparent, but its disclosed economics reflect a much wider platform that
              spans cards, Billing, Checkout, Connect, and bank-account tooling. Operationally, Stripe's bank-debit
              story is split: ACH and SEPA direct debit are recurring and reusable but slow and dispute-prone, while Pay
              by Bank is fast, card-like, and low chargeback risk but explicitly single-use. Adyen publishes some
              direct-debit rates and stronger enterprise process detail, yet still looks more sales-led than self-serve,
              with pay by bank flowing through ACH and Plaid in the US rather than through a recurring-bank specialist
              narrative.


              Among European overlaps, Mollie is the clearest SMB packaging threat because it combines transparent
              cards-plus-bank pricing with recurring included and a pay-by-bank-first path into later SEPA direct debit.
              Trustly, TrueLayer, and Tink are much less transparent on committed enterprise take rates, but their
              product surfaces still reveal where they compete: TrueLayer on native pay-by-bank checkout, payouts, and
              VRP; Trustly on conversion-heavy consumer flows and recurring overlays; Tink on infrastructure embedded
              through PSPs. For diligence, the right conclusion is not that GoCardless is cheapest everywhere, but that
              it is easier to underwrite economically than the quote-based specialists while still more
              bank-rail-specific than the bundled PSPs.
