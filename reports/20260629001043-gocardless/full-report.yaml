      - number: '7.3'
        title: Partner, Rail, and Platform Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              GoCardless’s growth narrative increasingly depends on systems it does not fully control. Recurring Pay by
              Bank is strategically attractive because it lowers card dependence, but the June 2026 launch also makes
              clear that the product rides on UKPI scheme governance, open-banking availability, and bank participation
              that are still evolving. GoCardless has built an intelligent-routing fallback into Direct Debit, which
              reduces some failure risk, yet fallback is itself evidence that the primary rail is not universally
              dependable. The partner layer adds a second dependency stack. GoCardless is embedding directly into
              Sequence and serving as the exclusive integrated payment provider for Intelligent Billing, which is
              commercially powerful but increases exposure to partner API changes, exclusivity shifts, or partner
              concentration that is not publicly quantified. On top of that, the signed Mollie transaction could become
              a major strategic upside or an execution drag. The deal diversifies product breadth and market access, but
              until regulatory approvals land and integration governance is clearer, dependency risk remains elevated
              rather than resolved.
