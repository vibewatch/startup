  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - - Recurring bank debit collection
        - Merchant and biller collection over direct debit and related bank-debit rails
        - Card-on-file subscriptions and invoice software that never selects the payment rail
        - Finance ops / revenue ops buyer; merchant pays fees; merchant's customer pays invoice or bill
        - Core historical GoCardless workflow and the base from which open-banking fallback expands
      - - One-off pay by bank / instant bank pay
        - Checkout, invoice, top-up, or deposit payments initiated over open-banking or instant bank-transfer rails
        - Generic card acquiring TAM and non-payment data-sharing use cases
        - Payments / product / finance buyer; merchant pays fees; end payer authorises bank transfer
        - Key expansion vector into faster settlement and lower-cost acceptance
      - - Recurring pay by bank / commercial VRP
        - >-
          Future recurring, flexible bank-authorised payment flows for utilities, charities, government, and financial
          services
        - Pure mandate-management software or banking-core modernization spend outside payment workflow adoption
        - Treasury, billing, or product buyer; merchant pays; end payer authorises ongoing bank-based pull
        - Emerging but strategically important bridge between direct debit and open-banking initiation
      - - Bank-rail optimization layer
        - Routing, fallback, fraud, success-rate, and reconciliation tooling attached to bank payments
        - Standalone AR, ERP, or analytics budgets without live payment initiation or collection
        - Ops / product / finance buyer; merchant budget owner
        - Explains why uptime, bank coverage, and routing matter as much as price
      - - Adjacent but excluded categories
        - null
        - Consumer PFM only, lending, card rewards, interchange pools, and general fintech software
        - Varies
        - Important to exclude so GoCardless is not valued against irrelevant software or card-economics categories
    notes: >-
      Included and excluded categories are synthesized from GoCardless product positioning plus official and independent
      descriptions of open-banking merchant payment workflows.
