      - number: '7.2'
        title: Operational, Security, and Reliability Risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, GoCardless has credible controls but also obvious blast radius. The company publicly
              highlights ISO 27001, encryption, safeguarded client monies, privacy-by-design processes, and a bug-bounty
              workflow; those are real mitigants for a business sitting in the middle of payment collection and payout
              flows. Still, the public record also shows why controls are not the same thing as low residual risk. The
              core status page was green on the run date, yet the bank-account-data surface was simultaneously carrying
              a named institution maintenance event. Independent outage tracking recorded several recent incidents
              across payouts, dashboard access, events APIs, and instant-bank-payment flows, while user reports linked
              at least one issue to reconciliation friction with QuickBooks. For a payments infrastructure vendor, that
              pattern matters because merchant pain often comes from partial failure rather than complete downtime. The
              biggest remaining gap is verification depth: public materials do not show MTTR distributions, SLA
              attainment, or recent external testing detail at the level an enterprise underwriter would want.
