      - number: '7.4'
        title: People, Execution, and Financial-Model Risk
        blocks:
          - type: paragraph
            body: >-
              The financial picture is improving, but it is not yet simple enough to underwrite without execution
              caveats. FY25 turnover growth, doubled payment volume, and the first adjusted EBITDA-positive quarter all
              suggest a business that found operating leverage faster than many fintech peers. At the same time, the
              public file shows why management had to work hard to get there: losses persisted, restructuring costs
              rose, a redundancy provision covered about 90 roles, and the company previously cut cost base and
              headcount materially to accelerate profitability. Those moves may have been rational, but they create
              their own risk because payments businesses still need deep compliance, support, engineering, and
              partner-management capacity while product scope expands. Leadership additions around people and M&A help,
              and the filing history shows active ownership and governance changes rather than a static corporate
              structure. The residual question is whether GoCardless can keep service quality, documentation, and
              partner execution strong while finishing the path from improved unit economics to sustainably lower-risk
              profitability.
