      - number: '3.3'
        title: Distribution, regulatory posture, and switching cost
        blocks:
          - type: paragraph
            body: >-
              Distribution is where the integrated PSPs and infrastructure specialists become more dangerous than simple
              feature checklists imply. Stripe has a bank-distribution route through Lloyds Accept, while Adyen just won
              a public-sector contract that replaces Stripe for many GOV.UK Pay services and adds pay by bank to the
              stack. Tink's merchant reach is explicitly partnership-led via PSPs such as Adyen, and TrueLayer's public
              merchant stories show it landing inside high-volume consumer checkout journeys such as Ryanair. Trustly's
              evidence points in a different but still relevant direction: large consumer network scale, gaming-specific
              conversion, and payout familiarity. Each of those routes lowers the incremental commercial work a rival
              must do to get onto the merchant's shortlist.


              Switching costs are therefore asymmetric. Ripping out recurring debit infrastructure can be painful, which
              helps GoCardless. But adding a new pay-by-bank method inside an existing PSP, dashboard, or tokenization
              flow is much easier, which weakens the moat when the buyer is only testing bank payments. Internal build
              is not free either: Pay.UK's Bacs participation rules reserve direct scheme access for regulated
              institutions and otherwise push firms toward service providers, so the substitute is usually not a clean
              build-versus-buy fork. The practical outcome is multi-homing. Merchants can keep cards and incumbent
              processors while selectively layering bank-payment methods, which means GoCardless must win on
              workflow-specific outcomes rather than expecting infrastructure inertia to do the selling for it.
            claimRefs:
              - CP006
              - CP014
              - CP021
              - CP023
