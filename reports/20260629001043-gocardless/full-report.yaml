          National Payments Vision, UKPI, FCA support, and EU instant-payments rules all improve the regulatory backdrop
          for A2A growth.
        - Map which policies materially change GoCardless' product economics versus simply expanding category awareness.
      - - Merchant demand for lower-cost, real-time acceptance
        - driver
        - current
        - Pay by bank offers real-time confirmation and can reduce card-fee leakage where bank rails are acceptable.
        - Request cohort-level proof of merchant savings, recovery rates, and conversion uplift by segment.
      - - Trust advantage of bank-backed providers
        - driver
        - current
        - >-
          Capgemini's 2026 research suggests banks still hold trust with merchants, which can help bank-rail adoption if
          execution improves.
        - Clarify whether GoCardless wins as a fintech layer over banks or as a direct bank-network abstraction.
      - - Fallback routing and service reliability
        - driver
        - current
        - Intelligent routing, payer coverage, and uptime reduce the practical risk of adding bank-rail options.
        - Ask for conversion and payment-success deltas with and without fallback to Direct Debit.
      - - Card incumbency and scheme power
        - constraint
        - current
        - >-
          Cards still dominate transaction volume and the PSR says Visa and Mastercard remain insufficiently constrained
          competitively.
        - Measure how much of GoCardless demand comes from net-new workflows versus card displacement.
      - - Consumer trust, liability, and dispute ambiguity
        - constraint
        - current
        - >-
          Security concerns and unclear recourse can suppress payer adoption even when merchant economics are
          attractive.
        - Review refund, chargeback-equivalent, and dispute-resolution policies by rail and geography.
      - - Integration and market-fragmentation complexity
        - constraint
        - current
