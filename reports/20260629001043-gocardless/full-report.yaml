      - - Tink
        - Infrastructure / PSP-embedded specialist
        - 10,000 merchants and €100 million single-day PIS peak via PSP partnerships
        - PSPs, partner-led merchants, account-to-account checkout use cases
        - Embedded distribution through PSPs such as Adyen; licence-flexibility posture
        - Public product and pricing detail for merchants is sparse and sales-led
      - - Mollie
        - European SMB PSP overlap
        - Transparent pay-per-success pricing and volume tiers above €100k monthly
        - European SMBs and mid-market merchants wanting simple cards plus bank methods
        - Transparent packaging, recurring included, pay-by-bank-first setup into SEPA debit
        - Pay by Bank itself is non-recurring and geography is narrower than global PSPs
