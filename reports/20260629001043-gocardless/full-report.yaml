      - number: '2.2'
        title: 'Sizing lenses: official rail activity is real, but public TAMs conflict'
        blocks:
          - type: paragraph
            body: >-
              The strongest sizing evidence comes from payment-rail activity, not from analyst market headlines. Open
              Banking Limited's official 2025 impact report said the UK had 13.3 million active users by March 2025, 31
              million open-banking payments that month, and open-banking payments equal to 7.9% of all Faster Payments;
              its January 2026 milestone update pointed to 33 million monthly payments in November 2025 and 16.5 million
              monthly user connections. Those are meaningful adoption signals, but they still sit beside a much larger
              incumbent base: Pay.UK reported 1.29 billion Bacs Direct Debit payments in Q4 2025 alone, and UK Finance
              still recorded 2.14 billion debit-and-credit card transactions in the UK during March 2026.

              That mix implies a big reachable bank-payments opportunity but not a market that has already tipped away
              from cards or legacy rails. The further complication is that public top-down market estimates are wildly
              inconsistent. Retained analyst pages range from Business Research Insights' $19.4 billion 2025 headline to
              Mordor's $29.78 billion 2026 forecast, 360iResearch's $47.28 billion 2026 forecast, and BlueWeave's
              $278.57 billion 2026 figure. Those numbers are not directly comparable because they appear to mix API
              software, payment initiation, data-sharing infrastructure, and broader embedded-finance activity. For
              GoCardless, the safer framing is a constrained sizing stack: a large recurring and account-to-account
              workflow pool, an early but scaling open-banking usage base, and a much smaller current SOM already
              visible through GoCardless' own merchant adoption.
