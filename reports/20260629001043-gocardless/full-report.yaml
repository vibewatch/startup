companyProfile:
  summary: >-
    GoCardless is a London-founded private fintech founded in 2011 by Hiroki Takeuchi, Tom Blomfield, and Matt Robinson.
    The company sells bank-account-based payments infrastructure spanning direct debit, instant pay-by-bank, recurring
    pay-by-bank, bank-account data, and recovery/fraud add-ons, increasingly embedded inside finance software and
    billing workflows. Official materials say GoCardless serves more than 100,000 businesses across 30+ countries and
    processes US$130bn+ annually. FY25 group turnover reached £160.9m, payment volume reached £79.2bn, and the business
    reported its first adjusted EBITDA-positive quarter in Q4 FY25. GoCardless signed a sale to Mollie in December 2025,
    but as of 2026-06-29 open sources still did not confirm close or fully disclose transaction economics and post-close
    governance.
