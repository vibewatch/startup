      - number: '8.3'
        title: Bull, Base, and Bear Ranges
        blocks:
          - type: paragraph
            body: >-
              The base case is that the rumored sale level is roughly fair. It captures a company that is meaningfully
              healthier than it looked in FY24, but still not clean enough to deserve a premium public-software
              multiple. In that base view, GoCardless deserves something like 5.5x to 6.0x revenue because improving
              profitability, recurring payment depth, and strategic fit offset price opacity and support-risk scars.
              That range roughly triangulates to the reported strategic consideration and explains why the
              recommendation is track instead of avoid.


              The bull case needs more than generic fintech multiple rebound. It needs operating proof that recurring
              Pay by Bank adoption, Mollie cross-sell, and lower payment failures can move GoCardless closer to
              Adyen-like quality on growth durability and margin confidence. If that happened, 6.5x to 7.7x revenue
              becomes defendable. The bear case is simpler: if regulatory timing slips, integration distracts
              management, or customer-trust issues persist, the market will re-rate GoCardless toward the lower-quality
              public PSP cohort. In other words, upside requires execution plus evidence, while downside can arrive from
              any break in deal certainty, trust, or profitability conversion.
            claimRefs:
              - CV013
