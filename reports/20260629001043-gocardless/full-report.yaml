        title: Product surface and customer jobs
        blocks:
          - type: paragraph
            body: >-
              GoCardless’s product surface is best understood as a bank-payment control layer, not a single direct-debit
              API. The official product and developer materials show a ladder of payment types that starts with classic
              mandate-based direct debit, extends into one-off Instant Bank Pay, and then combines both through an
              upfront instant payment plus a direct-debit setup for future recurring charges. That matters because the
              user job is not simply “collect a debit”; it is to let a merchant decide when it needs immediate
              confirmation, when it wants a reusable mandate, and when it wants both in the same onboarding flow. The
              public materials also show adjacent modules around retry recovery, fraud prevention, account-information
              access, and partner-embedded finance workflows, which means GoCardless has moved beyond a narrow
              recurring-payments narrative into a broader bank-payments operations stack.
