  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      The customer journey is built around bank-authorisation, recurring collection, reconciliation, and expansion into
      additional rails or partner-embedded workflows.
    data:
      nodes:
        - id: n1
          label: Discover recurring bank-payment fit
          description: >-
            A finance, billing, or operations team decides recurring bank debit is a better fit than card-first
            collection for invoices, subscriptions, or donations.
        - id: n2
          label: Choose direct or partner-led onboarding
          description: >-
            Customers can start through GoCardless directly or through Xero, QuickBooks, AccountsIQ, Sequence, or
            another embedded platform.
        - id: n3
          label: Collect one-time bank authorisation
          description: >-
            The end customer authorises Direct Debit or an instant bank payment, creating a reusable bank-payment
            relationship.
        - id: n4
          label: Automate collection and reconciliation
          description: >-
            Payments run against invoices, subscriptions, or donations and are pushed back into billing or accounting
            systems.
        - id: n5
          label: Improve outcomes with add-ons
          description: >-
            Customers adopt Success+, open-banking flows, or faster refund / payout paths where those improve failure
            rates or cash flow.
        - id: n6
          label: Renew, expand, or escalate support
          description: >-
            Healthy accounts renew or deepen usage; weaker experiences show up through verification, support, or
            reconciliation complaints on review platforms.
    approximationNotes: >-
      Stages summarize the common operating pattern visible across official stories, app marketplaces, and review
      evidence rather than a single documented funnel.
