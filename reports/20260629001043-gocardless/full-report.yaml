        blocks:
          - type: paragraph
            body: >-
              Founder identity is reasonably clear even though GoCardless does not publish a detailed founder-history
              page in the retained corpus. Business Matters and Payment Institutions both identify Hiroki Takeuchi, Tom
              Blomfield, and Matt Robinson as the founding trio, and official GoCardless releases still present Takeuchi
              as co-founder and CEO. Public leadership visibility beyond him is narrower but not absent. Companies House
              shows Catherine Birkett as an active director; 2025-2026 company and trade-press materials name Shaun
              Puckrin as Chief Product Officer, Pat Phelan as Chief Revenue Officer, and Tom Metcalfe as Director of
              Global Partnerships. That is enough to show some bench depth across product, revenue, and partnerships,
              but it is not a substitute for a current board roster or governance page.


              Governance evidence is therefore mixed rather than strong. The 2022 Series G announcement explicitly said
              Michael Rouse and Koen Köppen were joining the board, and Companies House later recorded the termination
              of Paul Stoddart as a director in April 2025 as well as Matt Robinson's departure from the board in August
              2023. What is still missing is a single public source that cleanly reconciles the current board,
              committees, and ownership-control map after those changes. That gap raises a real key-person and
              governance diligence issue: open sources consistently surface Takeuchi, but they do not provide a
              filing-grade picture of how oversight is structured as the business approaches a strategic sale and
              possible control transition to Mollie.
