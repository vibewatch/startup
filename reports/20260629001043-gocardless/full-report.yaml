              The most visible architectural center of gravity is Billing Requests, which GoCardless documents as the
              object that brings customer identity, authorisation, bank details, and payment details together. Around
              that control plane, the public stack splits into several layers: merchant-facing setup surfaces, partner
              and API integration layers, the direct-debit and open-banking rails, and optional data or intelligence
              services. The Bank Account Data documentation adds a second operating model beside payments: merchants
              initiate a user journey, GoCardless hosts consent, banks host authentication, and the resulting access
              tokens let the platform retrieve balances or transaction history subject to PSD2 constraints and bank-side
              rate limits. This is a practical, integration-led architecture rather than a deeply disclosed backend
              topology; GoCardless publishes enough to explain how users and developers move through the system, but not
