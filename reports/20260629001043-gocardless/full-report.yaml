      - number: '7.5'
        title: Mitigations, Monitoring, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              GoCardless does have a credible mitigation stack. The company is regulated, discloses security controls,
              keeps fallback routing for open-banking failures, and if the Mollie transaction closes it should benefit
              from broader payment-method coverage and financing optionality. Those mitigants justify staying
              constructive rather than defaulting to a high-risk avoidance view. But they do not remove the need for
              tight monitoring. The most important thesis-break triggers are observable: delayed or failed regulatory
              approval on the Mollie deal, a visible increase in payout or open-banking incidents, further broad cost
              cutting that weakens support or compliance capacity, evidence that partner-led channels are more
              concentrated than expected, or customer trust indicators that keep deteriorating despite product breadth
              gains. The diligence ask is therefore straightforward: do not accept the current public control surface as
              sufficient. Ask for first-party incident data, partner concentration, fraud and loss metrics, approval
              readiness, and post-close integration governance before treating current momentum as durable.
