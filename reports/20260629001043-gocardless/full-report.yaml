            body: >-
              The adoption proof is materially better than logo slides. The FY25 update still links growth to new
              signings, renewals, and expansions, while the named proof set shows production deployments with concrete
              outcomes. Octopus Energy is the clearest large-enterprise anchor: millions of migrated accounts, faster
