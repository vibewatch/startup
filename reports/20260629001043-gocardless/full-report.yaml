      - number: '1.3'
        title: Capital history, current scale, and financial trajectory
        blocks:
          - type: paragraph
            body: >-
              The latest fully supported standalone financing marker remains the February 2022 Series G. GoCardless
              announced a $312m round at a $2.1bn valuation, led by Permira with BlackRock Private Equity Partners
              joining and Balderton continuing to back the company. Public ownership evidence after that point becomes
              less transparent: Companies House later logged GoCardless Holdings (UK) Limited as a person with
              significant control from July 2025, and the company signed a sale to Mollie in December 2025. Together
              those facts imply that the company should be analyzed as a private fintech in strategic-transition mode,
              not as a business still optimizing for another classic late-stage venture round. However, the open-source
              corpus in this run still does not reconcile lifetime capital raised, current share ownership, or the exact
              standalone valuation implied by the signed sale.


              Operating disclosure is stronger. GoCardless' April 2026 FY25 release says group turnover rose 22% year
              over year to £160.9m, with £155.5m attributed to GoCardless Ltd's UK and European operations. The same
              release says processed volume doubled to £79.2bn, partly because Nuapay closed in September 2024, and says
              net losses continued to narrow, with the business reaching its first adjusted EBITDA-positive quarter in
              Q4 FY25 and targeting an adjusted EBITDA-positive FY26. These results sit alongside newer official scale
              claims of 100,000+ businesses and $130bn+ annual payments. The combination is directionally attractive:
              GoCardless appears larger, more diversified, and closer to profitability than older public profiles
              suggested, even though the pending Mollie close now matters more to ownership and valuation interpretation
              than the stale 2022 unicorn marker alone.
