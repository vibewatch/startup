        title: Segmentation and customer jobs
        blocks:
          - type: paragraph
            body: >-
              GoCardless's customer base is broad in count but narrow in workflow shape. The strongest public evidence
              points to businesses that want to pull money directly from bank accounts on a recurring or invoice-linked
              basis: SMBs collecting invoices through Xero or QuickBooks, subscription businesses such as Bike Club,
              fintechs such as Plum, charities such as JustGiving, and increasingly software platforms that embed
              payments inside their own billing stack. That mix matters because the buyer is often a finance or
              operations team, while the end user may be a merchant, donor, subscriber, or app customer completing a
              bank authorisation journey. Official 2026 materials still anchor on over 100,000 businesses and 30+
              countries, but the visible proof set is more specific about recurring collection, reconciliation, and
              bank-payment cost savings than about generalized checkout acceptance. In other words, GoCardless is not
              winning by being a universal PSP; it is winning where bank-account collection, predictable cash flow, and
              lower admin burden are more important than maximizing payment-method breadth.
