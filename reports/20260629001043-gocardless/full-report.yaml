      - number: '4.2'
        title: Public traction, growth, and operating leverage
        blocks:
          - type: paragraph
            body: >-
              The public traction line improved materially between FY24 and FY25. Official FY24 disclosure showed
              £126.8m of group revenue, £39.6bn of processed volume, and more than 94,000 organizations using the
              platform. FY25 disclosure then lifted group turnover to £160.9m and processed volume to £79.2bn, with
              GoCardless attributing part of that acceleration to Nuapay. Revenue therefore continued to grow, but
              payment volume grew even faster, which suggests the mix shifted toward lower-yield or newly-added flows,
              or that scale benefits were passed through in pricing. That does not make the model weak; it does mean
              public investors still lack the split needed to distinguish healthy mix expansion from simple volume
              dilution.


              The profitability arc is nevertheless real. FY24 net loss fell 55% to £35.1m, helped by earlier cost
              actions and lower salary expense. FY25 then delivered another year of loss improvement, with the company
              and follow-on coverage highlighting narrower losses, tighter cost control, and the first adjusted
              EBITDA-positive quarter in Q4 FY25. Same Day Settlement+ also shows how GoCardless is trying to convert
              product innovation into better merchant cash-flow outcomes, not just lower payment friction. The missing
              piece is classic private-company unit economics: there is no public gross margin, CAC, payback, NRR, or
              churn disclosure, so the improvement story is credible but not yet fully underwritten.
