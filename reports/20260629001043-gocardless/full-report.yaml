          tone: positive
        - id: a2
          label: Direct merchant deployment
          detail: Plum, Bike Club, and JustGiving run bank-payment workflows in production
          tone: positive
        - id: a3
          label: Enterprise anchor
          detail: Octopus proves multi-million-account migration and refund automation at scale
          tone: positive
        - id: a4
          label: Embedded platform channel
          detail: AccountsIQ, Sequence, and Intelligent Billing own the billing UX while GoCardless powers collection
          tone: neutral
        - id: a5
          label: Cross-sell and expand
          detail: Open banking, Success+, and adjacent automation deepen value inside existing accounts
          tone: positive
        - id: a6
          label: Friction and support risk
