  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: bank-payment workflow, not generic PSP spend'
        blocks:
          - type: paragraph
            body: >-
              GoCardless should be framed around bank-account-based payment workflows rather than around all
              merchant-payments or broad fintech software spend. The company's 2026 product-positioning materials and
              independent coverage consistently describe a stack that combines direct debit, instant pay by bank, and
              recurring pay by bank instead of a card-acquiring or lending platform. That boundary matters because the
              relevant customer job is collecting or sending money over bank rails with lower failure rates, faster
              confirmation, or lower acceptance costs — especially for recurring billers — not winning every payment
              method a merchant might expose at checkout. Within scope are recurring bank debit, one-off
              account-to-account acceptance, open-banking payment initiation, and the routing logic that bridges those
              flows.

              Out of scope are card-scheme revenue pools, consumer-only personal-finance-data use cases, and
              software-only treasury or accounts-receivable tooling that does not determine which rail actually moves
              the money. The status-quo substitutes are therefore not just cards, but also manual bank transfer,
              standing orders, and legacy direct-debit-only setups that lack instant initiation or fallback logic. This
              boundary also explains why GoCardless can be meaningful in a large market without needing to displace
              every card transaction: the practical wedge is specific merchant workflows where bank rails are already
              acceptable, trusted, or cheaper.
            claimRefs:
