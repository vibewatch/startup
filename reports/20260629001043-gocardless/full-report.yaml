chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and geographic footprint
        blocks:
          - type: paragraph
            body: >-
              GoCardless' most stable identity anchors come from Companies House and the company's own current product
              pages. Companies House shows GoCardless Ltd as an active private limited company incorporated on 17
              January 2011, with a registered office at Sutton Yard on Goswell Road in London. Current official site
              copy positions the company as building the world's bank payment network rather than as a generic PSP, with
              recurring bank debit, one-off bank payments, real-time payments, open banking, and AI-assisted payment
              recovery all presented as parts of one operating stack. That framing matters because it ties the business
              model to bank-account-based collection economics, not to card acquiring.


              The geographic story is slightly less crisp than the legal one. Official 2025-2026 releases repeatedly say
              GoCardless is headquartered in the UK and operates across 30+ countries, while independent 2025-2026
              coverage and the Companies House registered office point back to London as the practical HQ anchor. Scale
              disclosures have also moved upward over time: older fact sheets cited 75,000 to 85,000 businesses and
              roughly $30bn to $35bn of annual processing, whereas current official materials cite more than 100,000
              businesses and $130bn+ of annual payments. The safest reuse rule for later chapters is therefore: treat
              incorporation, London registered office, bank-payment positioning, and current 100,000+ / $130bn+ official
              scale claims as the newest canonical baseline, while preserving older figures as stale historical
              snapshots rather than contradictions.
