  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              GoCardless does not read like a company with a current license-loss event hanging over it, but it does
              read like a company whose compliance perimeter is wide and getting wider. The public record spans an
              FCA-regulated UK entity, an ACPR-regulated French entity, and U.S. service delivery that depends on both a
              sponsor-bank program and money-services-business registration. That matters because payments risk is often
              less about whether a license exists today and more about whether every product, geography, and partner
              workflow remains inside the permitted perimeter as the product set expands. Privacy posture adds another
              layer: GoCardless publicly says it is a data controller, relies on AML and PSD2-related lawful bases, and
              asks merchants to account for those responsibilities. Its own RFP guidance also reminds buyers that
              regulatory authorisation, scheme compliance, AML/KYC, safeguarding, and Consumer Duty support are not
              box-ticking issues. The main residual legal risk is not visible enforcement today; it is that a complex
              multi-jurisdiction compliance surface can create sudden friction, remediation cost, or onboarding slowdown
              before the public file shows a clear warning.
            claimRefs:
