  topStrengths:
    - >-
      Product position is unusually strong for a private European payments company: GoCardless spans direct debit,
      instant pay-by-bank, recurring pay-by-bank, bank-account data, and recovery/fraud add-ons inside one
      bank-payments control layer.
    - >-
      Financial trajectory is clearly improving: FY25 turnover reached £160.9m, payment volume doubled to
