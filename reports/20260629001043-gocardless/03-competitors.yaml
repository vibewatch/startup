    {
      "id": "moat-durability-and-adverse-evidence",
      "title": "Moat durability: durable in recurring-bank workflows, vulnerable in bundled procurement",
      "body": "The bullish case is that GoCardless still occupies a specific and defensible operating niche. Its strongest public claims cluster around recurring-bank-payment control: same-day recurring pay by bank, automatic retries, balance checks, and fallback between pay by bank and direct debit. That is a sharper product story than the one-off initiation narratives on many rival pages. When the buyer is a finance or billing team that cares about mandate durability, failed-payment recovery, and bank-rail continuity, GoCardless still looks more purpose-built than Stripe, Adyen, Trustly, or Tink.\n\nThe adverse evidence is equally real. Card incumbents still extract significant economics from merchants, and the merchant's simplest response is often to keep buying a broader PSP bundle rather than adopt a specialist. UKPI and cVRP are directionally favorable for GoCardless, but their commercial model and wave expansion are still evolving, so the open-banking side of the moat is not fully institutionalized yet. Meanwhile integrated PSPs already prove they can displace each other in tenders and specialist networks keep expanding through distribution partners. The moat therefore looks durable but narrow: strong in recurring bank-payment workflows, weaker wherever the decision is led by suite consolidation, bank-channel distribution, or consumer-checkout conversion rather than debit-control economics.",
