    "number": 3,
    "title": "Competitors",
    "summary": "The competitor set around GoCardless is bifurcated between integrated PSPs that bundle bank payments into broader card or platform suites and open-banking specialists that optimize consumer checkout, payouts, or PSP distribution. GoCardless still looks most differentiated where recurring bank-payment control, failure recovery, and fallback between pay by bank and direct debit matter most, but adverse evidence shows incumbents still own powerful procurement and channel positions. Public pricing is clearest for GoCardless, Stripe, and Mollie; enterprise economics for specialists remain only partially disclosed."
  },
  "sections": [
    {
      "id": "landscape-and-boundary",
      "title": "Landscape: direct peers, integrated PSPs, specialists, and substitutes",
      "body": "GoCardless does not face one clean peer set. The closest direct overlap is with vendors that can manage recurring bank collection with some combination of direct debit, pay by bank, routing, and failure recovery. On that narrow job, GoCardless still looks unusually specialized: it publicly ties recurring pay by bank to same-day settlement, no chargebacks, balance checks, retries, and fallback between pay by bank and direct debit. But the buyer rarely shops the category that narrowly. Procurement teams can also satisfy the same underlying payment job through integrated PSPs such as Stripe, Adyen, and Mollie; through open-banking specialists such as TrueLayer, Trustly, and Tink; or through the status quo of cards, Bacs service providers, and internal orchestration over larger processors.\n\nThat broader boundary matters because each class competes on a different axis. Integrated PSPs sell breadth and channel leverage, not just bank rails. Open-banking specialists bias toward fast account-to-account conversion, payouts, or PSP distribution. Scheme-led substitutes remind buyers that direct participation and compliance overhead still exist if they try to internalize the stack. The result is a layered landscape rather than a single winner-take-all market: GoCardless is strongest when the merchant values recurring bank-payment control as a system, but it is evaluated against bundled suites and add-a-method alternatives much more often than its product pages alone would suggest.",
