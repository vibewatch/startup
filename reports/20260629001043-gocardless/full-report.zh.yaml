      - number: '5.2'
        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              最可见的架构重心是 Billing Requests。GoCardless 文档把它描述为把客户身份、授权、银行信息和支付信息聚合起来的对象。围绕这个控制平面，公开栈分成几层：面向商户的设置表面、合作伙伴和
              API 集成层、直接借记与开放银行轨道，以及可选的数据或智能服务。Bank Account Data 文档在支付之外又增加了第二个运营模型：商户发起用户旅程，GoCardless
              托管同意流程，银行托管认证，由此产生的 access tokens 让平台在 PSD2 约束和银行侧 rate limits
              下检索余额或交易历史。这是实用、集成驱动的架构，而不是深度披露的后端拓扑；GoCardless 发布的信息足以解释用户和开发者如何穿过系统，但不足以重建服务边界、吞吐设计或内部 failover 逻辑。
