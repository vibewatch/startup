      - number: '8.2'
        title: 融资背景与公开可比公司组
        blocks:
          - type: paragraph
            body: >-
              资本历史重要，因为估值锚点已经从风险投资狂热转向战略整合。2022 年，GoCardless 以 USD2.1 billion 估值融资 USD312 million；到 2025 年末，公司同意把自己出售给
              Mollie，独立媒体称交易价值约 €1.1 billion，且主要为股票对价。这个转变不只是「估值下降」。它意味着现在应从战略效用看这家公司，而不是从另一轮后期风险融资或近期 IPO
              可选性看它。备案也强化了这个判断：GoCardless Holdings (UK) Limited 在 2025 年 7 月成为 PSC，而公开记录仍未解释少数股东经济权益。


              相对估值支持中间立场。按报道出售价值看，GoCardless 的筛选倍数高于 PayPal、Worldline 等成熟 PSP，但低于 Adyen 强得多的利润率和质量画像。Finro 的 2026 年 Q1
              支付可比公司组以 3.6x 中位数和 7.7x 平均 EV/revenue 为中心，这让传闻中的 GoCardless 倍数落在合理区间内，而不是明显便宜。Tink 和 Plaid
              说明账户到账户基础设施仍能获得战略价值，但也说明 2021 年高峰估值不是 2026 年承销的正确参照。
