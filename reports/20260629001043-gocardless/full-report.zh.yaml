companyProfile:
  summary: >-
    GoCardless 是一家创立于伦敦的私营 fintech 公司，2011 年由 Hiroki Takeuchi、Tom Blomfield 和 Matt Robinson
    创办。公司销售基于银行账户的支付基础设施，覆盖直接借记、即时 Pay by Bank、循环 Pay by Bank、银行账户数据，以及回收 / 反欺诈附加模块，并越来越多嵌入财务软件和账单工作流。官方资料称，GoCardless
    服务 30+ 个国家的 100,000 多家企业，每年处理 US$130bn+。FY25 集团营业额达到 £160.9m，支付量达到 £79.2bn，业务在 FY25 Q4 首次实现调整后 EBITDA
    单季度转正。GoCardless 于 2025 年 12 月签署出售给 Mollie 的协议，但截至 2026-06-29，公开资料仍未确认交割，也未完整披露交易经济安排和交割后治理。
