      - number: '1.4'
        title: 里程碑、监管锚点与负面背景
        blocks:
          - type: paragraph
            body: >-
              2025-2026 年公开记录同时显示产品动能和成本压力。产品侧，GoCardless 于 2025 年 3 月宣布与 Jellyfish Energy 完成首笔循环 Pay by Bank 交易，2026 年
              6 月随 UK Payments Initiative 方案推出 Recurring Pay by Bank，并继续通过 Sequence、Intelligent Billing
              等集成增加合作伙伴驱动分发。这些事项对本章重要，因为它们显示公司正在主动把账户到账户 thesis 从传统直接借记扩展到基于开放银行的循环支付流和嵌入式账单渠道。FY25
              发布也把近期增长与新客户和合作伙伴签约、续约，以及 Nuapay 集成联系起来。


              负面背景是，盈利路径并不轻松。UKTN 和 PYMNTS 都报道 GoCardless 裁员约 20%，员工数自 2023 年以来从 764 人降至略高于 600
              人；管理层同时强调成本纪律和盈利路径。监管披露一半扎实、一半令人沮丧：GoCardless 自己的监管信息页面明确称英国实体受 FCA 按 Payment Services Regulations 2017
              授权，注册号 597190；但本轮抓取的 FCA register 页面本身只渲染出 JavaScript 加载壳。因此，后续章节可以有信心复用 FCA
              监管身份存在这一点，但权限细节、当前准确员工数和签约后收购交割状态，仍应作为未关闭的尽调事项，而不是已确定事实。
