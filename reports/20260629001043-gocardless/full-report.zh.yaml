      - CE035
  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层级 / 组件
      - 在技术栈中的作用
      - 关键依赖
      - 重要性
      - 主要公开风险 / 缺口
    rows:
      - - 商户仪表盘和托管页面
        - 无代码设置、支付页面、链接和日常运营
        - GoCardless 网页 UI 和合作伙伴连接器
        - SMB 不用自建工程团队也能部署
        - 面向运营人员的界面没有公开架构或可用性 SLA 细节
      - - Billing Requests / API 控制平面
        - 组合客户、授权、银行详情和支付指令
        - API 可用性和对象一致性
        - 充当多种支付类型之上的抽象层
        - 内部服务拆分和故障切换未公开
      - - Direct Debit 计划
        - 授权设置后执行周期性扣款
        - Bacs 和其他计划运营方
        - 提供耐用的周期性支付轨道
        - 结算仍较慢，并受计划时间表约束
      - - 开放银行支付发起
        - 支撑 Instant Bank Pay 和周期性 pay-by-bank 演进
        - 银行 API 连接和 UKPI / 开放银行轨道
        - 增加实时确认，降低对银行卡的依赖
        - 机构覆盖和可用性随银行而变
      - - Bank Account Data / AIS
        - 提供余额、交易和账户信息
        - PSD2 银行、同意流程和 token 生命周期
        - 产品从收款延伸到金融数据工作流
        - 银行速率限制和产品级覆盖细节压低可预测性
      - - Webhook 和合作伙伴应用事件
        - 把实时状态变化推送到会计或工作流工具
        - 事件投递、合作伙伴应用映射和商户消费逻辑
        - 对对账和自动化至关重要
        - 公开文档没有披露排队、重试或持久性目标
      - - 支付智能服务
        - 驱动重试、欺诈检测和新兴 AI 辅助工作流
        - 历史交易数据和模型治理
        - 让 GoCardless 不只是一条支付轨道
        - 模型质量和误报取舍没有公开基准
      - - 状态和机构监控界面
        - 展示核心组件、银行数据和 IBP 机构健康度
        - 运营遥测和第三方银行可用性
        - 提高透明度，方便排障
        - 公开页面未达到企业级 SLA 和 RCA 披露深度
    notes: 本表基于开发者、状态页和合作伙伴材料还原公开运营模型；后端服务拓扑仍有部分未披露。
    enumerationScope:
