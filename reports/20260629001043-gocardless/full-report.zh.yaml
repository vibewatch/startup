      - number: '5.4'
        title: 信任、安全、可靠性与运营控制
        blocks:
          - type: paragraph
            body: >-
              信任栈在控制摘要层面强于审计细节层面。GoCardless 的安全页面明确声称 FCA 授权、2016 年以来 ISO27001 认证、符合 GDPR 的数据风险管理、受保护的客户资金账户、强加密，以及
              Direct Debit Guarantee 覆盖。可靠性方面，公司少见地愿意发布实时状态表面：有核心状态页、专门的银行数据状态页，以及独立的 Instant Bank Pay
              机构状态页。这是正面信号，因为它把产品暴露为一组组件和依赖，而不是一个单体。同时，证据集也显示真实事件和维护窗口，包括公开仪表盘 blank-screen 事件，以及近期第三方报告的投递、集成和事件 / API
              问题。缺口在深度：公开页面显示当前健康状况和部分事件，但没有提供足够 SLA 或事后复盘细节，无法做企业级运营承销。
