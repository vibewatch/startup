      - number: '1.2'
        title: 创始人、领导层可见度与治理边界
        blocks:
          - type: paragraph
            body: >-
              虽然 GoCardless 没有在保留语料中发布详尽的创始历史页面，创始人身份仍较清楚。Business Matters 和 Payment Institutions 都将 Hiroki Takeuchi、Tom
              Blomfield、Matt Robinson 识别为创始三人组，GoCardless 官方发布仍把 Takeuchi 称为联合创始人兼 CEO。除他以外，公开领导层可见度较窄，但并非空白。Companies
              House 显示 Catherine Birkett 为在任董事；2025-2026 年公司和行业媒体资料提到 Shaun Puckrin 为首席产品官、Pat Phelan 为首席营收官、Tom
              Metcalfe 为全球合作伙伴总监。这足以显示产品、营收和合作伙伴侧有一定梯队，但不能替代当前董事会名单或治理页面。


              因此，治理证据是混合的，不算强。2022 年 Series G 公告明确称 Michael Rouse 和 Koen Köppen 将加入董事会；Companies House 后续记录了 Paul
              Stoddart 于 2025 年 4 月卸任董事，以及 Matt Robinson 于 2023 年 8
              月离开董事会。仍然缺的是一个公开来源，能干净对齐当前董事会、委员会和所有权控制图谱。这一缺口带来真实的关键人和治理尽调问题：公开资料持续露出
              Takeuchi，却没有给出接近备案级别的监督架构图，无法判断公司在走向战略出售、并可能向 Mollie 发生控制权过渡时由谁监督。
