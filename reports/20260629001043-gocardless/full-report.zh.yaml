  - id: TM004
    title: 增长驱动因素与制约因素表
    columns:
      - 驱动因素 / 制约因素
      - 方向
      - 时间
      - 含义
      - 尽调问题
    rows:
      - - UK 和 EU 政策支持更快的银行支付
        - 驱动因素
        - 2025-2027
        - National Payments Vision、UKPI、FCA 支持和 EU 即时支付规则，都改善了 A2A 增长的监管背景。
        - 梳理哪些政策实质改变 GoCardless 的产品经济性，哪些只是扩大品类认知。
      - - 商户需要更低成本、实时确认的受理方式
        - 驱动因素
        - 当前
        - pay by bank 提供实时确认；在银行轨道可接受的场景里，它能减少银行卡手续费流失。
        - 要求按 cohort 证明商户节省、回收率和转化提升，并按细分市场拆分。
      - - 银行背书服务商的信任优势
        - 驱动因素
        - 当前
        - Capgemini 2026 年研究显示，银行在商户中仍有信任基础；只要执行改善，这会帮助银行轨道被采用。
        - 厘清 GoCardless 的胜点，是银行之上的 fintech 层，还是直接抽象银行网络。
      - - 回退路由和服务可靠性
        - 驱动因素
        - 当前
        - 智能路由、付款方覆盖和正常运行时间，能降低新增银行轨道选项的实际风险。
        - 询问有无 Direct Debit 回退时，转化率和支付成功率差异。
      - - 银行卡惯性和卡组织力量
        - 制约因素
        - 当前
        - 银行卡仍主导交易量；PSR 称 Visa 和 Mastercard 在竞争上仍未受到足够约束。
        - 衡量 GoCardless 需求中，多少来自全新工作流，多少来自替代银行卡。
      - - 消费者信任、责任和争议处理不清
        - 制约因素
        - 当前
        - 即便商户经济性有吸引力，安全担忧和追索不清也会压制付款方采用。
        - 按支付轨道和地区审查退款、类拒付和争议解决政策。
      - - 集成和市场碎片化复杂度
        - 制约因素
        - 当前
        - 商户跨市场仍要处理结账复杂度、本地支付方式碎片化和集成开销。
        - 测试不同实施路径下的上线时间、工程投入和转化。
      - - 公开分母缺失，市场预测付费墙阻隔
        - 制约因素
        - 当前
        - 公开来源没有单独拆出 GoCardless 目标账单商户和商户群体；更丰富的预测表又在付费墙后。
        - 在把 TAM 精度当成可投资证据之前，先取得私有 cohort 数据或购买行业表。
    notes: 方向指该因素在未来一到三年里，对 GoCardless 银行支付市场主要起扩张作用还是约束作用。
