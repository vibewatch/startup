  - id: TV002
    title: 正反投资逻辑表
    columns:
      - 视角
      - 有证据支撑的论点
      - 什么会改变判断
    rows:
      - - 正方逻辑
        - FY25 营业额、支付量和调整后 EBITDA 轨迹显示，经营底座比 FY24 表象更健康。
        - FY26 盈利能力未达预期，或续约质量转弱，会削弱这一判断。
      - - 正方逻辑
        - 已签署的 Mollie 出售交易，验证了市场对经常性银行支付基础设施的战略需求。
        - 如果交割延迟或失败，战略溢价会消失，公司必须回到独立估值重置。
      - - 正方逻辑
        - Recurring Pay by Bank 和银行支付工作流深度，解决了经常性收入商户的真实痛点。
        - 如果证明采用率低或支持摩擦上升，产品驱动的倍数支撑会下降。
      - - 反方逻辑
        - 官方来源没有披露交易价值、少数股权经济条款或清算瀑布条款。
        - 一级出售文件或董事会材料可以迅速补上这个缺口。
      - - 反方逻辑
        - 公开商户情绪信号足够弱，已能质疑其是否拥有高溢价质量的客户喜爱度。
        - 流失、NRR、支持解决率和投诉分群数据，可以证明问题是否可控。
      - - 反方逻辑
        - 公司已经进入战略转型模式，新资本的独立上行空间受限。
        - 入场价明显更低，或交易破裂但增长保持完整，才可能重新打开上行空间。
    notes: 每行把最强的看多和看空论点，与最能改变判断的一项证据配对。
