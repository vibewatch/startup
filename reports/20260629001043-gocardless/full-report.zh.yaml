      - number: '7.2'
        title: 运营、安全与可靠性风险
        blocks:
          - type: paragraph
            body: >-
              运营上，GoCardless 有可信控制，也有明显冲击半径。公司公开强调 ISO
              27001、加密、客户资金保障、隐私内嵌流程和漏洞赏金工作流；一家站在支付收款和打款流程中间的企业，确实需要这些缓释。但公开记录也说明，控制不等于剩余风险低。运行日核心状态页是绿色，可银行账户数据界面同时挂着一个具名机构维护事件。独立宕机跟踪记录了近期多起事件，涉及打款、仪表盘访问、事件
              API 和即时银行支付流程；用户报告还把至少一个问题连到 QuickBooks
              对账摩擦。对支付基础设施供应商来说，这种模式重要，因为商户痛点常来自局部失效，而不是完全停机。最大剩余缺口是验证深度：公开材料没有展示 MTTR 分布、SLA 达成率，也没有企业承销人会要求的近期外部测试细节。
