  - id: TV005
    title: 投资逻辑破裂和否决触发因素表
    columns:
      - 触发因素
      - 门槛 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 监管交割延误
        - Mollie 交易未按更新后可信时间表交割
        - 战略溢价变弱，独立可比估值开始主导。
        - 暂停任何溢价承销，按熊市情景重新定价。
      - - 盈利能力倒退
        - FY26 无法保持 EBITDA 转正或经营现金流为正
        - 经营杠杆逻辑变得可疑。
        - 下调至回避，除非价格明显下修。
      - - 信任受损
        - 支持、出款或评价信号进一步恶化
        - 高质量客户假设破裂。
        - 重新接触前，要求提供流失、投诉和支持分群数据。
      - - 瀑布条款劣势
        - 新信息显示少数股东排在惩罚性优先权或展期安排之后
        - 账面价值无法转成可投资收益。
        - 放弃任何类似定价下的少数股权或二级入场。
      - - 交叉销售 / 产品失手
        - Recurring Pay by Bank 或 Mollie 交叉销售未能转化
        - 牛市溢价消失。
        - 坚持跟踪立场，拒绝倍数扩张。
    notes: 这是一小组可观察事件；一旦发生，就应硬性改变建议，而不是小幅调整估计。
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV043
      - CV044
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 出售机制
        - Mollie 交易中现金、股票、展期、债务和托管安排的精确处理
        - 这决定公开估值锚点能否真正兑现到每一类持有人。
        - 交易律师、银行家材料或已签署交易摘要。
      - - 股权结构和优先权
        - 当前所有权、优先权栈、期权池和少数股东保护
        - 没有这些信息，回报计算只能靠猜。
        - CFO 数据室或股东协议审查。
      - - FY26 经营桥
        - FY25 结账后，月度收入、EBITDA 和经营现金流桥
        - 需要检验盈利能力是否可持续，还是主要由重组驱动。
        - 管理账和董事会材料包。
      - - 客户质量
        - 流失、NRR、投诉率、支持 SLA 和出款冻结分群
        - 需要判断外部评价偏弱是否真是估值折价因素。
        - 客户成功和风险运营审查。
      - - 整合治理
        - 监管工作计划、Day-1/Day-100 里程碑，以及与 Mollie 的产品归属拆分
        - 上行情景现在取决于整合执行。
        - 整合 PMO 和合规负责人访谈。
      - - 产能和人员
        - 当前按职能划分的员工数，以及 2025 年裁员后任何新增招聘的理由
        - 需要判断服务和合规产能是否匹配增长野心。
        - HR 看板和职能预算审查。
    notes: 这些问题有意保持少而高确信度：每一项都可能实质改变建议或价格纪律。
    claimRefs:
      - CV025
      - CV028
      - CV029
      - CV040
      - CV041
      - CV042
