chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与地理足迹
        blocks:
          - type: paragraph
            body: >-
              GoCardless 最稳固的身份锚点来自 Companies House 和公司当前产品页面。Companies House 显示，GoCardless Ltd 是一家仍在运营的私营有限公司，2011 年 1
              月 17 日成立，注册办公室位于伦敦 Goswell Road 的 Sutton Yard。当前官网文案把公司定位为建设全球银行支付网络，而不是通用 PSP；循环银行借记、一次性银行支付、实时支付、开放银行和
              AI 辅助支付回收，都被放进同一套运营栈。这个表述很关键，因为它把商业模式系在基于银行账户的收款经济性上，而不是银行卡收单。


              地理叙事没有法律身份那么利落。2025-2026 年官方发布反复称 GoCardless 总部在英国、业务覆盖 30+ 个国家；独立 2025-2026 年报道和 Companies House
              注册办公室也都指向伦敦这个实际总部锚点。规模披露也随时间上调：较早的资料页称有 75,000 至 85,000 家企业、年处理量约 $30bn 至 $35bn；当前官方资料则称企业数超过 100,000
              家、年度支付额 $130bn+。后续章节最稳妥的复用规则是：把成立信息、伦敦注册办公室、银行支付定位，以及当前 100,000+ / $130bn+
              的官方规模口径视为最新基准；较早数字保留为过时的历史快照，而不是矛盾。
