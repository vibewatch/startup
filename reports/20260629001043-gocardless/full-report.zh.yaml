              Pay by Bank 带给 SMB；合作伙伴证据则显示，它可以消失在财务软件里，而不是要求运营人员另起行为。产品路线图延续同一逻辑。Recurring Pay by Bank
              试图把今天一次性开放银行收益变成可复用循环轨道；MCP 则希望让用户用自然语言查询平台，降低实施和运营分析成本。共同主线是围绕核心支付引擎扩展控制表面。最大 caveat
