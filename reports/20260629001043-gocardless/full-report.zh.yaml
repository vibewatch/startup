      - number: '2.4'
        title: 驱动因素与约束：监管有帮助，但银行卡、信任和缺失分母仍然重要
        blocks:
          - type: paragraph
            body: >-
              这个市场的正向逻辑很直接。英国和欧盟政策都在推动账户到账户支付前进：FCA 称开放银行增长迅速，商业 VRP 推出会延续到 2026 年；英国 National Payments Vision
              强调更多选择和更低成本的零售基础设施；欧盟 Instant Payments Regulation 推动全天候即时转账，并要求其与普通贷记转账同价。商户经济性也有帮助。GoCardless 自身资料称 Pay
              by Bank 相比银行卡最多可节省 48%，而独立 2026 年报道仍描述英国零售高度依赖银行卡、商户成本高。Capgemini 2026 年商户研究补充说，如果银行能把信任优势与更好的
              onboarding、反欺诈工具和模块化 API 结合起来，信任优势仍在银行手里。

              约束同样真实。PSR 称 Mastercard 和 Visa 仍未面对有效竞争，因此银行卡仍是许多商户更容易采用的默认项。Federal Reserve 的商户支付研究提醒，Pay by Bank
              节省成本的说法并非一刀切；信任、争议处理、奖励经济性和信用可得性都会让银行卡保持黏性。Juniper 强调结账复杂度和碎片化是商户痛点，独立 2026 年评论也显示采用是稳步推进，而非
              hockey-stick。剩下最大的尽调问题是数据质量：当前官方英国商户分母过时或间接，详细英国支付市场预测在付费墙后，GoCardless 也没有公开拆分开放银行 GMV
              占总处理量的比例。这些缺口解释了为什么本章偏向受约束的规模测算、保留互相矛盾的估算，而不是给出虚假精确的 TAM 结论。
