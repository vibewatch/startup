      - number: '4.4'
        title: 财务结论与剩余尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              财务结论方向上正面，但仅靠公开数据还不足以投资。GoCardless 已证明循环支付核心能够变现，银行支付产品集比一年前更宽，并且有多个证据显示亏损在增长和成本纪律共同作用下收窄。作为私营
              fintech，公司发布套餐价格、上限、附加模块和部分合同机制，定价可见度高于平均。这有助于判断收入质量。


              阻碍在于，同一组公开资料仍缺少最重要的承销控制项：当前现金、真实 burn、毛利率、按产品划分的单位贡献、实际企业定价、留存和债务条款。由此形成的画面不是困境，而是业绩在改善、但披露不足以钉住可持续 EBITDA
              转化或准确资本需求。对尽调流程而言，这意味着 GoCardless 已从「故事股」跨入「可信经营杠杆候选」，但最终判断仍取决于管理层级别财务数据，而不是公开新闻稿和备案元数据。
