  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - 经常性银行借记收款
        - 商户和账单方通过 Direct Debit 及相关银行借记轨道收款
        - Card-on-file 订阅，以及从不选择支付轨道的发票软件
        - Finance ops / revenue ops 买方；商户支付费用；商户客户支付发票或账单
        - GoCardless 的核心历史工作流，也是开放银行兜底扩张的基础
      - - 一次性 pay by bank / 即时银行支付
        - 通过开放银行或即时银行转账轨道发起的结账、发票、充值或押金支付
        - 通用银行卡收单 TAM 和非支付数据共享用例
        - 支付 / 产品 / 财务买方；商户支付费用；终端付款人授权银行转账
        - 切入更快结算和更低成本受理的关键扩张向量
      - - 经常性 pay by bank / 商业 VRP
        - 面向公用事业、慈善、政府和金融服务的未来经常性、灵活银行授权支付流程
        - 纯 mandate 管理软件，或支付工作流采用之外的银行核心现代化支出
        - 财资、账单或产品买方；商户支付；终端付款人授权持续银行拉款
        - Direct Debit 与开放银行发起之间仍在萌芽但战略重要的桥梁
      - - 银行轨道优化层
        - 附着在银行支付上的路由、兜底、欺诈、成功率和对账工具
        - 没有实时支付发起或收款的独立 AR、ERP 或分析预算
        - 运营 / 产品 / 财务买方；商户预算所有者
        - 解释为什么 uptime、银行覆盖和路由与价格同样重要
      - - 相邻但排除的类别
        - null
        - 仅消费者 PFM、贷款、卡返利、交换费池和通用 fintech 软件
        - 因情况而异
        - 排除这些类别很重要，避免用无关软件或卡经济类别给 GoCardless 估值
    notes: 纳入和排除类别综合自 GoCardless 产品定位，以及官方和独立来源对开放银行商户支付工作流的描述。
    claimRefs:
