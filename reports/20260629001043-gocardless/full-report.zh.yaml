      - number: '3.3'
        title: 分发、监管姿态与切换成本
        blocks:
          - type: paragraph
            body: >-
              分发层面，集成 PSP 和基础设施专业厂商比简单功能清单显示的更危险。Stripe 通过 Lloyds Accept 拿到银行分发路径，Adyen 刚赢得一份公共部门合同，将在许多 GOV.UK Pay
              服务中替代 Stripe，并把 Pay by Bank 加入这套栈。Tink 的商户触达明确由合作伙伴驱动，通过 Adyen 等 PSP；TrueLayer 的公开商户故事显示它进入了 Ryanair
              这类高交易量消费者结账旅程。Trustly 的证据指向不同但仍相关的方向：大型消费者网络规模、游戏场景转化和付款熟悉度。这些路径都会降低竞争对手进入商户候选名单所需的增量商业工作。


              因此，切换成本是不对称的。拆掉循环借记基础设施会很痛苦，这有利于 GoCardless。但在现有 PSP、仪表盘或 tokenization 流程里增加一种新的 Pay by Bank
              方法要容易得多；当买方只是测试银行支付时，护城河会被削弱。内部自建也不是免费选项：Pay.UK 的 Bacs 参与规则把直接 scheme
              接入保留给受监管机构，否则就把企业推向服务商，所以替代方案通常不是干净的自建与购买二选一。实际结果是多归属。商户可以保留银行卡和既有处理商，同时选择性叠加银行支付方式，这意味着 GoCardless
              必须靠特定工作流结果取胜，而不能指望基础设施惯性替它完成销售。
