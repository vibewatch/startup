  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 细分与客户任务
        blocks:
          - type: paragraph
            body: >-
              GoCardless 的客户基础在数量上很宽，但工作流形态较窄。最强公开证据指向那些希望按循环或发票关联方式直接从银行账户扣款的企业：通过 Xero 或 QuickBooks 收发票款的 SMB、Bike
              Club 这类订阅业务、Plum 这类 fintech、JustGiving
              这类慈善机构，以及越来越多把支付嵌入自身账单栈的软件平台。这个组合很重要，因为买方往往是财务或运营团队，而最终用户可能是完成银行授权旅程的商户、捐赠者、订阅者或 app 客户。官方 2026 年资料仍锚定
              100,000 多家企业和 30+ 个国家，但可见验证集对循环收款、对账和银行支付成本节省更具体，对泛化结账受理则较少。换句话说，GoCardless 不是靠成为 universal PSP
              取胜；它赢在银行账户收款、可预测现金流和更低管理负担比最大化支付方式广度更重要的场景。
