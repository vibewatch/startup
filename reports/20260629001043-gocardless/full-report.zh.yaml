  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 概率信号
      - 关键下行触发因素
    rows:
      - - 牛市
        - Recurring Pay by Bank 采用加速，Mollie 交叉销售跑通，且 FY26 盈利能力证明可持续。
        - 6.5x-7.7x 收入，或约 £1.05bn-£1.24bn 企业价值；只有入场价低于传闻收购价时才有上行。
        - 需要监管交割干净落地，并有强劲的交割后采用证据。
        - 整合分散产品执行，或交叉销售不及预期。
      - - 基准
        - 已签署出售交易大体按计划交割，公司继续把增长转成盈利。
        - 5.5x-6.0x 收入，或约 £0.88bn-£0.97bn，接近报道中的战略锚点，也符合公允立场。
        - 最贴合当前证据，因为它在动能和披露缺口之间取平衡。
        - 即使经营继续改善，公开经济条款不透明仍会压住上行。
      - - 熊市
        - 交易时间表延后，客户信任问题持续，或管理层聚焦整合导致增长放慢。
        - 3.5x-4.0x 收入，或约 £0.56bn-£0.64bn，叙事转向成熟 PSP 或承压支付公司的倍数。
        - 如果审批延误，或 FY26 盈利能力无法守住，概率会上升。
        - 监管延迟、流失率上升，或再次出现服务质量冲击。
    notes: 企业价值区间以 FY25 营业额作为最新硬收入底座，并套用有来源支撑的倍数区间，而不是制造伪精确的 DCF。
