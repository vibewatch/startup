  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块 / 界面
      - 主要用户任务
      - 支付轨道 / 数据基础
      - 公开成熟度 / 状态
      - 差异化信号
      - 尽调缺口
    rows:
      - - Direct Debit 收款
        - 经常性账单和发票拉款
        - Bacs / SEPA / ACH 式扣款轨道
        - 成熟，核心产品
        - 基于授权的经常性收款灵活，并由多市场清算体系支撑
        - 未按清算体系公开产品级 SLA 或抽成率
      - - Instant Bank Pay
        - 即时一次性账户到账户付款
        - 开放银行支付发起
        - 2021 年以来已规模化并面向客户
        - 无需经常性授权也能快速确认
        - 未以承销级导出文件公开按机构和国家划分的覆盖范围
      - - Instant + Direct Debit
        - 在一次会话中收取首笔付款并设置经常性账单
        - 开放银行加直接借记
        - 官方产品概览已有文档
        - 在一条流程里打通获客和经常性变现
        - 未公开组合流程的转化率
      - - Recurring Pay by Bank（经常性银行支付）
        - 面向灵活排期的经常性开放银行付款
        - UKPI 经常性开放银行
        - 2026 年新推出
        - 把 pay-by-bank 从一次性结账延展为经常性轨道
        - 公开证据仍处早期，行业可用性细节不足
      - - Success+
        - 自动回收失败付款
        - 支付智能 / 重试引擎
        - 成熟附加项，有公开案例指标
        - 重试时点由数据驱动，而不是人工催收流程
        - 模型输入、假阴性和 cohort 级表现未公开
      - - Protect+
        - 筛查并挑战高风险付款人
        - 欺诈智能与监控
        - 成熟附加项，反欺诈定位明确
        - 面向银行支付的欺诈工具直接叠加到收款流程
        - 未公开精确率 / 召回率、规则覆盖或拒付损失基准
      - - Bank Account Data API
        - 拉取账户、余额和交易数据
        - AIS / PSD2 连接
        - 已有生产级技术文档和 quickstart
        - 将技术栈从支付发起延伸到金融数据访问
        - 产品级银行覆盖和定价门槛未完全公开
      - - Accounting / ERP 集成
        - 将收款和对账嵌入财务工具
        - 合作伙伴应用和 API
        - Xero、QuickBooks 和 AccountsIQ 提供了强公开证明
        - 进入财务团队既有系统，降低操作摩擦
        - 集成深度因合作伙伴而异，公开文档未标准化支持负担
      - - MCP 开发者界面
        - 用 LLM 获取实施指引和运营查询
        - 覆盖 GoCardless 上下文的自然语言控制界面
        - 2026 年 2 月新推出
        - 把平台从纯 API 接入扩到 AI 辅助的平台交互
        - 安全、权限和生产使用控制尚未公开细节
    notes: 行内容反映截至 2026-06-29 公开披露的产品家族；面向特定合作伙伴的打包方式和地域可用性仍需尽调。
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly disclosed GoCardless modules and add-ons visible in retrieved official, developer, and partner
        materials as of 2026-06-29.
