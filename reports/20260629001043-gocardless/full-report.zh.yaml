  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同业、集成 PSP、专业厂商和替代品
        blocks:
          - type: paragraph
            body: >-
              GoCardless 面对的不是一组干净的同业。最接近的直接重叠，是能用直接借记、Pay by Bank、路由和失败回收的某种组合来管理循环银行收款的供应商。在这个窄任务上，GoCardless
              仍显得异常专注：它公开把循环 Pay by Bank 与当日结算、无拒付、余额检查、重试，以及 Pay by Bank 和直接借记之间的兜底联系起来。但买方很少按这么窄的品类采购。采购团队也可以通过
              Stripe、Adyen、Mollie 等集成 PSP，通过 TrueLayer、Trustly、Tink 等开放银行专业厂商，或通过银行卡、Bacs 服务商和在更大处理商之上的内部编排，完成同一个底层支付任务。


              更宽的边界很重要，因为每一类竞争者都在不同轴线上竞争。集成 PSP 卖的是广度和渠道杠杆，不只是银行轨道。开放银行专业厂商偏向快速账户到账户转化、付款或 PSP 分发。由 scheme
              主导的替代品提醒买方，如果试图把这套栈内化，直接参与和合规开销仍然存在。结果是一个分层格局，而不是单一赢者通吃市场：当商户把循环银行支付控制视为一个系统时，GoCardless
              最强；但它被拿来和打包套件、加一种支付方式的替代方案比较的频率，远高于单看产品页面所暗示的水平。
