      - number: '6.4'
        title: 扩张、集中度与伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              GoCardless 看起来有多条扩张路径，但风险画像各不相同。在存量账户里，最清晰的动作是围绕核心银行收款引擎交叉销售更多能力：开放银行、即时
              pay-by-bank、重试智能、反欺诈工具和更深的自动化。在存量账户之外，2026 年更大的故事是伙伴驱动分销。AccountsIQ、Sequence 和 Intelligent Billing
              都显示，GoCardless 正嵌入已经掌握账单或财务工作流的软件；伙伴计划本身也宣传覆盖 36 个国家、超过 400 个伙伴。这在战略上有吸引力，因为它降低了直销负担，也让 GoCardless
              更靠近日常运营工作流。但它也带来依赖：客户直接体验 GoCardless 之前，会计或账单伙伴就可能先塑造上手流程、对账质量和支持预期。集中度仍是最大的披露缺口。Octopus
