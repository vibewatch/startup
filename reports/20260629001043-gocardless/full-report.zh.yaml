      - number: '1.3'
        title: 资本历史、当前规模与财务轨迹
        blocks:
          - type: paragraph
            body: >-
              最新、可完整支撑的独立融资标记仍是 2022 年 2 月 Series G。GoCardless 宣布以 $2.1bn 估值融资 $312m，由 Permira 领投，BlackRock Private
              Equity Partners 参投，Balderton 继续支持。此后，公开所有权证据变得不那么透明：Companies House 后来记录 GoCardless Holdings (UK) Limited
              自 2025 年 7 月起成为具有重大控制权的人士；公司又在 2025 年 12 月签署出售给 Mollie 的协议。合在一起，这些事实意味着公司应被视为处在战略转型期的私营
              fintech，而不是仍在为下一轮典型后期风险融资优化的企业。不过，本轮开源语料仍未核清累计融资额、当前股权归属，或已签署出售所隐含的准确独立估值。


              经营披露更强。GoCardless 2026 年 4 月 FY25 发布称，集团营业额同比增长 22% 至 £160.9m，其中 £155.5m 来自 GoCardless Ltd
              的英国和欧洲业务。同一发布称，处理量翻倍至 £79.2bn，部分因为 Nuapay 于 2024 年 9 月并表；净亏损继续收窄，公司在 FY25 Q4 首次实现调整后 EBITDA 单季度转正，并以 FY26
              全年调整后 EBITDA 转正为目标。这些结果与更新的官方规模口径并列：100,000+ 家企业、年度支付额 $130bn+。组合起来方向上有吸引力：GoCardless
              看起来比旧公开画像更大、更多元，也更接近盈利；只是待完成的 Mollie 交割现在对所有权和估值解读的影响，已经超过单看过时的 2022 年独角兽标记。
