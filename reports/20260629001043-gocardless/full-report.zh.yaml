      - number: '4.2'
        title: 公开牵引、增长与经营杠杆
        blocks:
          - type: paragraph
            body: >-
              FY24 到 FY25，公开牵引线明显改善。官方 FY24 披露显示集团收入 £126.8m、处理量 £39.6bn，超过 94,000 个组织使用平台。FY25 披露随后把集团营业额推高至
              £160.9m、处理量推高至 £79.2bn，GoCardless 将部分加速归因于
              Nuapay。因此收入继续增长，但支付量增长更快，说明组合可能转向更低收益或新增流，也可能是规模收益通过定价传导给客户。这不意味着模型弱；但确实意味着公开投资者仍缺少必要拆分，无法区分健康的组合扩张和单纯的体量稀释。


              盈利弧线仍然真实。FY24 净亏损下降 55% 至 £35.1m，受此前成本措施和薪酬费用下降帮助。FY25 又实现亏损改善，公司和后续报道强调亏损收窄、成本控制更严，以及 FY25 Q4 首次实现调整后
              EBITDA 单季度转正。Same Day Settlement+ 也显示 GoCardless
              试图把产品创新转化为更好的商户现金流结果，而不只是降低支付摩擦。缺失的一块是经典私营公司单位经济性：没有公开毛利率、CAC、回本期、NRR 或流失披露，因此改善故事可信，但尚未被完整承销。
