  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              GoCardless 读起来不像一家正被吊销牌照事件压着的公司，但它的合规边界很宽，而且还在变宽。公开记录覆盖受 FCA 监管的英国实体、受 ACPR
              监管的法国实体，以及依赖赞助银行计划和货币服务业务注册的美国服务交付。支付风险的关键往往不在于今天有没有牌照，而在于产品范围扩大时，每个产品、地区和伙伴工作流是否仍留在获准边界内。隐私姿态又加了一层：GoCardless
              公开称自己是数据控制者，依赖 AML 和 PSD2 相关合法基础，并要求商户承担这些责任。它自己的 RFP 指引也提醒买方，监管授权、清算网络合规、AML/KYC、资金保障和 Consumer Duty
              支持都不是勾框事项。主要剩余法律风险不是今天可见的执法，而是复杂的多司法辖区合规界面可能在公开档案出现明确预警前，就突然制造摩擦、整改成本或上手放慢。
