      - number: '2.3'
        title: 买方、用户和付款方图谱：边缘是 SMB 自助，中间是企业财务运营
        blocks:
          - type: paragraph
            body: >-
              GoCardless 的市场划分，与其说按行业
              buzzword，不如说按谁拥有工作流、谁能承受集成工作。小企业边缘，买方可以是财务负责人或创始人，用户往往也是同一个人，吸引力在于无需深度技术投入，就能通过仪表盘立刻使用 Pay by
              Bank。中型市场和企业买方不同：财务运营、支付、treasury 或营收团队通常掌握预算，产品或工程团队帮助把流程接入结账或账单旅程，最终付款方仍是商户自己的客户。GoCardless 的 bank-guess
              功能、智能路由和直接借记兜底，在这个中间层最重要，因为它们降低了银行覆盖不完整带来的真实运营风险。

              保留用例也显示，GoCardless
              不是在销售一个单一的商户故事。官方和第三方资料把已上线或正在出现的需求放在电商、旅行、信用卡还款、储蓄存款、公用事业、政府、慈善和金融服务中。这个组合使买方-用户-付款方图谱成为尽调重点：慈善捐赠流、公用事业账单方和软件平台可能都使用银行轨道，但它们购买时看重的付款方触达、对账速度、结账摩擦和循环支付控制组合各不相同。因此，GoCardless
              当前开放银行足迹——37,323 家企业、超过三分之一客户基础——最好解读为：银行支付采用已足够广，能够支撑多个细分市场；但也仍足够早，分发设计和兜底逻辑仍是决定性因素。
