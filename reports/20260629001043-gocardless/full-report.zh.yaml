  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 工作流
      - 当前痛点
      - GoCardless 路径
      - 公开宣称的收益
      - 关键限制
    rows:
      - - SaaS 或会员周期性计费
        - 人工催收和逾期卡扣重试
        - Direct Debit 授权加定时扣款
        - 现金流更可预测，行政工作减少
        - DD 结算仍慢于即时 pay-by-bank
      - - 发票收款
        - 人工核对银行转账
        - 绑定发票的 Direct Debit 或合作伙伴集成
        - 会计工具内自动对账
        - 合作伙伴体验随软件和地区而变
      - - 结账后立即开通，并保留未来周期扣款
        - 现在要收款，之后还要周期性授权
        - 一个流程内完成即时支付和 Direct Debit 设置
        - 即时确认，并可复用未来计费
        - 公开转化率和流失数据未披露
      - - 失败支付追回
        - 通用重试规则和非自愿流失
        - Success+ 智能重试
        - 失败支付追回率最高 70%，成功率更高
        - 头部指标来自公司口径，并非独立审计
      - - 对欺诈敏感的授权或付款人入驻
        - 拒付敞口和低质量注册
        - Protect+ 加验证检查
        - 不必人工筛查每个付款人，也能降低欺诈摩擦
        - 公开材料没有模型表现细节
      - - 财务团队对账
        - 支付控制台和表格匹配彼此割裂
        - 嵌入 QuickBooks、Xero 或 AccountsIQ 的工作流
        - 在财务系统内完成授权设置、收款和发票匹配
        - 并非所有 ERP 或 CRM 集成都同样深入
      - - 银行数据验证与洞察
        - 多个银行连接或抓屏带来复杂度
        - 经同意访问的 Bank Account Data API
        - 一次集成即可访问余额和交易历史
        - 覆盖范围、限额和验证选项随银行和市场而变
    notes: 收益来自公开产品和合作伙伴材料；不同工作流披露的可量化结果并不均衡。
    enumerationScope:
