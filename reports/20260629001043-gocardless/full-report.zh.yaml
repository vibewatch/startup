  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面与客户任务
        blocks:
          - type: paragraph
            body: >-
              GoCardless 的产品表面最好理解为一个银行支付控制层，而不是单一 direct-debit API。官方产品和开发者资料显示，其支付类型阶梯从经典的基于 mandate 的直接借记开始，延伸到一次性
              Instant Bank Pay，再把两者结合为前置即时支付加直接借记设置，用于未来循环收费。关键在于，用户任务并不是简单「收一笔借记」；而是让商户决定何时需要即时确认、何时需要可复用
              mandate、何时要在同一个 onboarding 流程里同时实现两者。公开资料还展示了围绕重试回收、欺诈预防、账户信息访问和合作伙伴嵌入式财务工作流的相邻模块，这意味着 GoCardless
              已从狭窄的循环支付叙事，进入更宽的银行支付运营栈。
