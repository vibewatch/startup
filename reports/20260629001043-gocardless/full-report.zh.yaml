            body: >-
              公开耐久性证据可用但不完整。FY25
              披露有一个鼓舞信号：管理层明确把部分增长归因于续约和扩张，因此至少一部分客户书在留存并加深。评论市场证据也显示真实安装基础；Softwarereviews、GetApp、Capterra 和 Xero
              marketplace 都有足够活动，说明产品被广泛部署。但这些表面都不能替代真实 NRR、GRR 或流失数据，保留来源也没有披露按细分市场划分的 cohort
