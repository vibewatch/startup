      - number: '7.5'
        title: 缓释、监控与论断失效触发器
        blocks:
          - type: paragraph
            body: >-
              GoCardless 确实有一套可信缓释。公司受监管，披露安全控制，为开放银行失败保留兜底路由；如果 Mollie
              交易完成，还应受益于更广的支付方式覆盖和融资可选性。这些缓释足以支持继续建设性观察，而不是默认高风险回避。但它们不能取消严密监控的必要。最重要的论断失效触发器都可观察：Mollie
              交易监管批准延迟或失败；打款或开放银行事件明显增加；进一步大幅降本削弱支持或合规能力；有证据显示伙伴驱动渠道比预期更集中；或者客户信任指标在产品广度提升后仍继续恶化。因此，尽调要求很直接：不要把当前公开控制界面视为充分。把当前动能当成可持续之前，先要一手事件数据、伙伴集中度、欺诈和损失指标、审批准备度，以及交割后整合治理。
