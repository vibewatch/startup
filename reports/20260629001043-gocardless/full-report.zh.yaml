              财务图景在改善，但还没有简单到可以不带执行附注地承销。FY25 营业额增长、支付量翻倍和首个调整后 EBITDA 为正的季度，都说明这家公司比许多 fintech
              同行更快找到经营杠杆。与此同时，公开档案也说明管理层为何必须费力走到这里：亏损持续、重组成本上升、裁员准备覆盖约 90
              个岗位，公司此前还大幅削减成本基础和员工人数以加速盈利。这些动作也许理性，但会带来自己的风险，因为产品范围扩大时，支付企业仍需要深厚的合规、支持、工程和伙伴管理能力。围绕人员和 M&A
