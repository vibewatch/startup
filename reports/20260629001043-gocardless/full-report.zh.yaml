      - number: '3.2'
        title: 能力与定价：专业化帮助 GoCardless，但透明度不均
        blocks:
          - type: paragraph
            body: >-
              GoCardless 是这组公司里公开价格最清晰的定价者之一。它的套餐阶梯明确，Standard、Advanced 和 Pro 之间的差异与支付失败回收、反欺诈工具和定制化绑定。Stripe
              也透明，但其披露经济性反映的是一个更宽的平台，横跨银行卡、Billing、Checkout、Connect 和银行账户工具。运营上，Stripe 的银行借记故事是分裂的：ACH 和 SEPA direct
              debit 可循环、可复用，但速度慢、易产生争议；Pay by Bank 很快、像银行卡、拒付风险低，却明确是一次性使用。Adyen 发布了一些直接借记费率和更强的企业流程细节，但仍更像销售驱动而非自助，其美国
              Pay by Bank 通过 ACH 和 Plaid 流转，而不是通过循环银行专业厂商叙事。


              在欧洲重叠区，Mollie 是最清晰的 SMB 包装威胁，因为它把透明的银行卡加银行定价、内含循环支付，以及先 Pay by Bank 再进入 SEPA direct debit
              的路径组合在一起。Trustly、TrueLayer 和 Tink 在承诺企业 take rate 上透明度低得多，但它们的产品表面仍暴露竞争位置：TrueLayer 押注原生 Pay by Bank
              结账、付款和 VRP；Trustly 押注转化密集的消费者流程和循环 overlay；Tink 押注通过 PSP 嵌入的基础设施。尽调的正确结论不是 GoCardless
              到处最便宜，而是它比报价型专业厂商更容易进行经济性承销，同时仍比打包 PSP 更专注于银行轨道。
