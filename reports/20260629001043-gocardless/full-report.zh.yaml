    summary: GoCardless 同时依赖监管机构、方案运营方、伙伴平台、银行支付轨，以及待定买方的整合选择。
    data:
      nodes:
        - id: reg
          label: 监管机构
          detail: FCA、ACPR、美国州级 / 联邦边界
        - id: ukpi
          label: UKPI 规则手册
          detail: 面向经常性 A2A 的共享方案治理
        - id: banks
          label: 银行 / 金融机构提供方
          detail: 机构正常运行时间和付款依赖
        - id: partners
          label: 嵌入式计费伙伴
          detail: Sequence 与 Intelligent Billing
        - id: mollie
          label: 待定 Mollie 买方
          detail: 批准和分阶段整合路径
        - id: gc
          label: GoCardless 核心平台
          detail: 直接借记、付款、数据、开放银行
        - id: customers
          label: 商户 / 终端用户
          detail: 信任、采用和留存
      edges:
        - from: reg
          to: gc
          label: 约束
        - from: ukpi
          to: gc
          label: 治理
        - from: banks
          to: gc
          label: 支撑
        - from: partners
          to: gc
          label: 分销
        - from: mollie
          to: gc
          label: 将重塑
        - from: gc
          to: customers
          label: 服务
    claimRefs:
      - CR001
      - CR012
      - CR026
      - CR029
      - CR041
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 基本面改善和战略验证支撑继续跟踪，但建议仍偏谨慎。
    data:
      nodes:
        - id: fundamentals
          label: 基本面改善
          detail: FY25 营业额 +22%，交易量翻倍，首次录得调整后 EBITDA 为正的季度
        - id: product_fit
          label: 经常性银行支付契合
          detail: 定价和产品深度契合经常性收入商户
        - id: strategic_validation
          label: Mollie 交易已签署
          detail: 战略验证叠加更广分销潜力
        - id: price_opacity
          label: 价格和清算瀑布不透明
          detail: 官方来源未披露交易价值和少数股东经济权益
        - id: trust_risk
          label: 信任和整合风险
          detail: 评价摩擦、裁员和监管交割仍然关键
        - id: recommendation
          label: 跟踪 / 合理 / 高风险
          detail: 保持接触；没有新披露前，不应高于公开锚点出价
      edges:
        - from: fundamentals
          to: strategic_validation
        - from: product_fit
          to: strategic_validation
        - from: strategic_validation
          to: recommendation
        - from: price_opacity
          to: recommendation
        - from: trust_risk
          to: recommendation
    approximationNotes: 这是定性投资委员会逻辑链，不是法律交易步骤的流程图。
    claimRefs:
      - CV004
      - CV008
      - CV010
      - CV011
      - CV031
      - CV046
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 展示按不同支付可比公司收入倍数标记 GoCardless 时，企业价值如何变化。
    data:
      items:
        - label: 4.0x 收入
          value: 643.6
          unit: £m
          detail: 低端水平，但仍高于部分承压上市 PSP 的底部
        - label: 5.0x 收入
          value: 804.5
          unit: £m
          detail: 低于报道中的战略锚点
        - label: 5.7x 收入
          value: 917.1
          unit: £m
          detail: 根据报道出售价值推算的近似公开锚点
        - label: 6.5x 收入
          value: 1045.9
          unit: £m
          detail: 类 Adyen 的 EV/Sales 参考点
        - label: 7.7x 收入
          value: 1238.9
          unit: £m
          detail: Finro 支付与转账可比公司平均水平
    approximationNotes: 使用 FY25 营业额 £160.9m 和四舍五入后的收入倍数；这是敏感性视角，不是管理层预测。
    claimRefs:
      - CV013
      - CV014
      - CV017
      - CV036
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 根据留存证据，映射公开的悲观 / 基准 / 乐观企业价值区间。
    data:
      items:
        - label: 悲观
          low: 560
          base: 602
          high: 644
          unit: £m
        - label: 基准
          low: 885
          base: 926
          high: 966
          unit: £m
        - label: 乐观
          low: 1046
          base: 1143
          high: 1239
          unit: £m
    approximationNotes: 区间是由公开倍数证据推导出的情景锚点，不是折现现金流输出。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV046
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 用投资委员会式评分视角，审视本次估值判断最关键的驱动因素。
    data:
      items:
        - label: 增长 / 证据
          value: 7
          max: 10
          detail: FY25 增长、规模和盈利拐点都是真实的。
        - label: 产品 / 止痛药契合
          value: 7
          max: 10
          detail: 经常性银行支付和失败率降低，解决了明确的商户痛点。
        - label: 战略验证
          value: 8
          max: 10
          detail: 已签署买方验证了效用和退出性。
        - label: 公开估值支撑
          value: 5
          max: 10
          detail: 报道中的出售水平说得通，但仍是二手信息。
        - label: 治理 / 经济权益清晰度
          value: 3
          max: 10
          detail: 股权结构和清算瀑布披露仍弱。
        - label: 客户信任质量
          value: 4
          max: 10
          detail: 公开评论面弱于高端同业。
        - label: 当前整体可投性
          value: 5
          max: 10
          detail: 先跟踪，不买入，直到价格或证据改善。
    approximationNotes: 评分是综合留存证据得出的定性投资委员会判断，不是公式化评分表。
    claimRefs:
      - CV004
      - CV008
      - CV031
      - CV041
      - CV046
