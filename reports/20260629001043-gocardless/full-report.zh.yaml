      - number: '2.2'
        title: 规模视角：官方轨道活动真实存在，但公开 TAM 互相冲突
        blocks:
          - type: paragraph
            body: >-
              最强的规模证据来自支付轨道活动，而不是分析师市场标题。Open Banking Limited 官方 2025 年影响报告称，英国截至 2025 年 3 月有 13.3 million 活跃用户，当月开放银行支付
              31 million 笔，开放银行支付相当于全部 Faster Payments 的 7.9%；其 2026 年 1 月里程碑更新指向 2025 年 11 月 33 million 笔月度支付和 16.5
              million 个每月用户连接。这些是有意义的采用信号，但它们仍与大得多的既有基础并存：Pay.UK 报告仅 2025 年 Q4 就有 1.29 billion 笔 Bacs Direct Debit 支付，UK
              Finance 仍记录 2026 年 3 月英国有 2.14 billion 笔借记卡和信用卡交易。

              这组数据意味着可触达的银行支付机会很大，但市场还没有从银行卡或传统轨道整体倒向新轨道。更复杂的是，公开自上而下市场估算极不一致。保留的分析师页面从 Business Research Insights 的
              2025 年 $19.4 billion 标题，到 Mordor 的 2026 年 $29.78 billion 预测、360iResearch 的 2026 年 $47.28 billion 预测，再到
              BlueWeave 的 2026 年 $278.57 billion 数字。它们并不直接可比，因为看起来混合了 API 软件、支付发起、数据共享基础设施和更广泛的嵌入式金融活动。对 GoCardless
              来说，更稳妥的框架是受约束的规模栈：大型循环和账户到账户工作流池、早期但在扩张的开放银行使用基础，以及一个已通过 GoCardless 自身商户采用可见、但当前更小的 SOM。
