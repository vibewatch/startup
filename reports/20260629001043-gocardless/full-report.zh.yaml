  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：银行支付工作流，而非通用 PSP 支出
        blocks:
          - type: paragraph
            body: >-
              GoCardless 应围绕基于银行账户的支付工作流来界定，而不是纳入全部商户支付或宽泛 fintech 软件支出。公司 2026 年产品定位材料和独立报道都一致描述一套栈：把直接借记、即时 Pay by
              Bank 和循环 Pay by Bank
              组合起来，而不是做银行卡收单或借贷平台。这个边界很关键，因为客户真正要完成的任务，是通过银行轨道以更低失败率、更快确认或更低受理成本收付款——尤其是循环账单方——而不是赢下商户可能在结账页暴露的每一种支付方式。范围内包括循环银行借记、一次性账户到账户受理、开放银行支付发起，以及衔接这些流的路由逻辑。

              范围外则是卡组织收入池、仅面向消费者的个人财务数据用例，以及不决定实际走哪条轨道转钱的纯软件 treasury 或应收账款工具。因此，现状替代品不只是银行卡，也包括手工银行转账、standing
              orders，以及缺少即时发起或兜底逻辑的传统仅直接借记设置。这个边界也解释了为什么 GoCardless
              可以在大市场里有意义，而不必替代每一笔银行卡交易：实际切入口是银行轨道已经可接受、可信或更便宜的特定商户工作流。
