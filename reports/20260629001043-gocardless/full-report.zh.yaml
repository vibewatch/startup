      - number: '8.4'
        title: 退出就绪度、最终尽调问题与论断失效触发器
        blocks:
          - type: paragraph
            body: >-
              GoCardless
              在一个狭窄但重要的意义上已经退出就绪：它已经签下一个战略结果，买方清楚理解经常性支付用例，也愿意分阶段整合，而不是强行立即平台切换。这有利于连续性，也说明资产确实有用。但这并不等于它已经准备好接受新的少数股权融资。面对这种用例，公开档案仍缺少最重要的经济项：完整
              cap table、优先权栈、交易瀑布、精确的股权与现金组合，以及清晰的交割后治理图。


              因此，最终尽调清单短而尖锐。拿到交易机制，验证 FY26 盈利是否转化为现金生成，检查支持和流失数据以判断低外部评价信号是边缘个案还是更深问题，并弄清上行情形有多少依赖 Mollie
              整合里程碑，而这些里程碑已不再由管理层单独控制。如果审批停滞、盈利倒退，或客户信任继续侵蚀，论断就失效。在这些问题得到回答前，正确动作是保持接触，但保持纪律。
