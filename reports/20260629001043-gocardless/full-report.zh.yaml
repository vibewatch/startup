      - number: '3.4'
        title: 护城河耐久度：在循环银行工作流中耐久，在打包采购中脆弱
        blocks:
          - type: paragraph
            body: >-
              乐观观点是，GoCardless 仍占据一个具体且可防守的运营利基。它最强的公开主张集中在循环银行支付控制：当日循环 Pay by Bank、自动重试、余额检查，以及 Pay by Bank
              与直接借记之间的兜底。这比许多竞争对手页面上的一次性发起叙事更锋利。当买方是关心授权耐久性、失败支付回收和银行轨道连续性的财务或账单团队时，GoCardless 仍比 Stripe、Adyen、Trustly 或
              Tink 更像为此目的打造。


              负面证据同样真实。银行卡既有玩家仍从商户身上抽取可观经济收益，而商户最简单的反应往往是继续购买更宽的 PSP 套件，而不是引入专业厂商。UKPI 和 cVRP 对 GoCardless
              方向上有利，但其商业模式和波次扩张仍在演化，因此开放银行侧的护城河尚未完全制度化。同时，集成 PSP
              已证明它们能在招标中相互替代，专业网络也持续通过分发伙伴扩张。因此，护城河看起来耐久但狭窄：在循环银行支付工作流中强；当决策由套件整合、银行渠道分发或消费者结账转化主导，而不是由借记控制经济性主导时，就更弱。
