- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric anchor
  - Multiple / valuation / status
  - Why it is relevant
  - Main limitation
  rows:
  - - GoCardless (press-reported sale)
    - FY25 turnover £160.9m
    - €1.1bn / £920m reported value; ~5.7x FY25 turnover
    - Best public anchor for the actual asset today.
    - Price is not confirmed in retained primary sources.
  - - Adyen
    - LTM revenue €2.38bn
    - EV / Sales 6.5x; P / Sales 10.95x
    - Premium European payments comp with superior margin quality.
    - Much larger, more profitable, and publicly seasoned.
  - - PayPal
    - LTM revenue $33.73bn
    - EV / Sales 1.23x; P / Sales 1.16x
    - Useful floor for scaled but slower-growing payment processing.
    - Consumer-wallet mix and global scale differ materially.
  - - Worldline
    - LTM revenue €4.03bn
    - EV / Sales 0.90x; P / Sales 0.15x
    - Useful downside comp for stressed European payments infrastructure.
    - Leverage, losses, and market distrust are much more severe.
  - - Tink
    - Strategic open-banking precedent
    - Visa agreed €1.8bn acquisition in 2021
    - Shows strategic willingness to pay for European A2A infrastructure.
    - Older cycle and no retained revenue multiple in this run.
  - - Plaid
    - Private-market liquidity mark
    - $8bn employee-share-sale valuation in Feb 2026; still 40% below 2021 peak
    - Shows that even strong fintech infrastructure names remain reset from peak marks.
    - US-centric data-linking model is not a direct recurring-debit analog.
  notes: This is a representative comparable set spanning strategic M&A, premium public payments, mature PSPs, and private-market reset markers.
  enumerationScope:
    coverage: partial
    basis: The table covers the most decision-relevant public comparable anchors retained in this run, not every private European payments transaction.
