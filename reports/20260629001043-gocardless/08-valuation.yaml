- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Evidence-backed argument
  - What would change the view
  rows:
  - - Thesis
    - FY25 turnover, payment volume, and adjusted EBITDA trajectory show a healthier operating base than FY24 optics suggested.
    - Missed FY26 profitability or weaker renewal quality would weaken the case.
  - - Thesis
    - The signed Mollie sale validates strategic demand for recurring bank-payment infrastructure.
    - A delayed or failed close would remove the strategic premium and force a standalone reset.
  - - Thesis
    - Recurring Pay by Bank and bank-payment workflow depth solve a real pain point for recurring-revenue merchants.
    - Proof of low adoption or rising support friction would reduce product-led multiple support.
  - - Anti-thesis
    - Official sources do not disclose transaction value, minority economics, or waterfall terms.
    - Primary-sale documents or board materials could clear this gap quickly.
  - - Anti-thesis
    - Public merchant-sentiment signals are weak enough to question premium-quality customer love.
    - Churn, NRR, support-resolution, and complaint-cohort data could prove the issue is containable.
  - - Anti-thesis
    - The company has already moved into strategic-transition mode, limiting standalone upside for new capital.
    - A materially lower entry price or a broken deal with intact growth could reopen upside.
  notes: Rows pair the strongest bullish and bearish arguments with the single piece of evidence that would most change the call.
