- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Regulatory close slippage
    - Mollie deal not closed on an updated credible timetable
    - Strategic premium weakens and standalone comp math takes over.
    - Pause any premium underwriting and reprice toward the bear case.
  - - Profitability regression
    - FY26 fails to stay EBITDA-positive or cash generative
    - The operating-leverage thesis becomes suspect.
    - Downgrade to avoid unless price resets materially lower.
  - - Trust erosion
    - Support, payouts, or review signals deteriorate further
    - Premium-quality customer assumptions break.
    - Demand churn, complaint, and support-cohort data before re-engaging.
  - - Waterfall disadvantage
    - New information shows minority holders sit behind punitive preferences or rollovers
    - Headline value stops translating into investable proceeds.
    - Walk away from any minority or secondary entry at similar pricing.
  - - Cross-sell / product miss
    - Recurring Pay by Bank or Mollie cross-sell fails to convert
    - The bull-case premium disappears.
    - Hold the line at track and refuse multiple expansion.
  notes: These are the small set of observable events that would force a hard change in recommendation rather than a minor estimate tweak.
  claimRefs:
