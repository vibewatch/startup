  evidenceGaps:
  - type: missing-source
    severity: material
    topic: official-sale-economics
    missingEvidence: A signed-transaction source disclosing exact consideration mix, debt treatment, and exchange mechanics for the Mollie deal.
    whyItMatters: Without a primary-source price and mechanics, any return model is anchored to press reporting rather than contractual economics.
    diligencePath: Request the SPA summary, banker deck, or board materials that show cash, stock, rollover, and debt assumptions.
    relatedQuestionRefs:
    - QV003
    - QV021
  - type: private-evidence-only
    severity: material
    topic: cap-table-waterfall
    missingEvidence: Current cap table, preference stack, option pool, and minority-holder protections after the holdings-layer change.
    whyItMatters: These items determine whether the same headline valuation translates into acceptable proceeds for any new or minority investor.
    diligencePath: Obtain the full cap table, shareholder agreement, preference schedule, and waterfall outputs from counsel or the CFO.
    relatedQuestionRefs:
    - QV005
    - QV021
    relatedTableRefs:
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: private-comparable-coverage
    missingEvidence: A broader set of private European bank-payments and open-banking transaction multiples with revenue and margin context.
    whyItMatters: The comparable table is directionally useful, but public data still under-represents private minority and strategic transactions that look most like GoCardless.
    diligencePath: Ask advisers for sealed precedent transaction comparables or data-room-quality private market marks.
    relatedQuestionRefs:
    - QV019
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: minor
    topic: current-headcount-and-cash-bridge
    missingEvidence: A June 2026 headcount, hiring, and monthly cash-generation bridge after the FY25 restructuring.
    whyItMatters: Capacity and cash conversion matter to whether the profitability story is durable or merely a short-term cost action.
    diligencePath: Request monthly headcount by function plus management accounts that bridge EBITDA to operating cash flow.
    relatedQuestionRefs:
    - QV026
    relatedTableRefs:
    - TV006
