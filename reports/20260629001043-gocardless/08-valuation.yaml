- id: financing-context-and-public-comparables
  title: Financing Context and Public Comparable Set
  body: 'The capital history matters because the valuation anchor has moved from venture exuberance to strategic consolidation. In 2022 GoCardless raised USD312 million at a USD2.1 billion valuation; by late 2025 the company agreed to sell itself to Mollie, with independent press citing roughly €1.1 billion of value and mostly stock consideration. That shift says more than “valuation down.” It says the company should now be viewed through the lens of strategic utility, not through the lens of another late-stage venture round or near-term IPO optionality. Filings reinforce that view: GoCardless Holdings (UK) Limited became the PSC in July 2025, and the public record still does not explain minority economics.


    Relative valuation supports a middle-ground stance. At the reported sale value, GoCardless screens above mature PSPs like PayPal and Worldline but below Adyen’s much stronger margin and quality profile. Finro’s Q1 2026 payments comp set centers around 3.6x median and 7.7x average EV/revenue, which places the rumored GoCardless multiple inside the plausible range rather than at an obvious bargain. Tink and Plaid show that account-to-account infrastructure can still command strategic value, but also that 2021 peak marks are the wrong reference point for 2026 underwriting.'
