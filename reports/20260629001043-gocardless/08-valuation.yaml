- id: exit-readiness-diligence-asks-and-thesis-breakers
  title: Exit Readiness, Final Diligence Asks, and Thesis-break Triggers
  body: 'GoCardless is exit-ready in one narrow but important sense: it has already signed a strategic outcome with a buyer that clearly understands the recurring-payments use case and is willing to integrate in phases rather than force an immediate platform cutover. That is good for continuity and suggests the asset is genuinely useful. It is not, however, the same thing as being ready for a fresh minority financing. For that use case, the public file is still missing the most important economics: full cap table, preference stack, transaction waterfall, exact share-versus-cash mix, and a clean post-close governance map.


    That is why the final diligence list is short and pointed. Get the transaction mechanics, verify whether FY26 profitability is translating into cash generation, inspect support and churn data to see whether low external review signals are an edge case or a deeper issue, and understand how much of the upside case depends on Mollie integration milestones that management no longer controls alone. The thesis breaks if approvals stall, if profitability regresses, or if customer trust keeps eroding. Until those asks are answered, the right action is to stay engaged but disciplined.'
