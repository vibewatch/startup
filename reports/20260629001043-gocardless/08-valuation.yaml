company:
  name: GoCardless
chapter:
  number: 8
  title: Valuation
  summary: 'GoCardless looks like a fair but not obviously cheap strategic asset: FY25 turnover reached £160.9m, the company recorded its first adjusted EBITDA-positive quarter, and the signed Mollie sale gives real strategic validation, but official sources still omit the transaction price and minority economics. Public evidence supports a track recommendation with medium confidence, a high risk rating, and a fair valuation stance rather than a buy at or above the press-reported sale level.'
sections:
- id: recommendation-thesis-and-anti-thesis
  title: Recommendation, Thesis, and Anti-thesis
  body: 'The public file supports a track call, not a buy call. GoCardless is clearly better than the stale “late-stage fintech with old unicorn optics” label: FY25 turnover reached £160.9 million, payment volume doubled to £79.2 billion, and the company reported its first adjusted EBITDA-positive quarter. Those are real operating signals, and the signed Mollie transaction is real strategic validation that recurring bank payments still matter inside European payments infrastructure. The bull part of the thesis is therefore straightforward: GoCardless has moved from niche direct-debit tool toward a broader bank-payments control layer with visible profitability progress and credible strategic relevance.


    The anti-thesis is just as important. The strongest public price anchor in this run is not a primary disclosed financing mark but a press-reported sale value that official releases never confirm. The filings also show a holdings-layer control structure without giving the preference stack, minority treatment, or waterfall that a new investor would need to underwrite proceeds cleanly. On top of that, the merchant-sentiment surface is not premium-quality. The right conclusion is that GoCardless is a fair strategic asset with real strengths, but current public evidence does not justify paying above the rumored takeout level or treating it like an Adyen-quality premium compounder.'
