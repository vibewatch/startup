  - CV039
  - CV040
  - CV043
  - CV044
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Sale mechanics
    - Exact cash, stock, rollover, debt, and escrow treatment in the Mollie transaction
    - This determines whether the public valuation anchor is actually realizable for each holder class.
    - Deal counsel, banker deck, or signed-transaction summary.
  - - Cap table and preferences
    - Current ownership, preference stack, option pool, and minority protections
    - Without this, return math is guesswork.
    - CFO data room or shareholder agreement review.
  - - FY26 operating bridge
    - Monthly revenue, EBITDA, and operating cash-flow bridge after FY25 close
    - Needed to test whether profitability is durable or mostly restructuring-driven.
    - Management accounts and board pack.
  - - Customer quality
    - Churn, NRR, complaint rates, support SLAs, and payout-hold cohorts
    - Needed to decide whether weak external review signals are a true valuation discount factor.
    - Customer success and risk operations review.
  - - Integration governance
    - Regulatory workplan, Day-1/Day-100 milestones, and product ownership split with Mollie
    - The upside case now depends on integration execution.
    - Integration PMO and compliance leadership sessions.
  - - Capacity and headcount
    - Current headcount by function and the rationale for any new hiring after the 2025 cuts
    - Needed to judge whether service and compliance capacity match growth ambitions.
    - HR dashboard and functional budget review.
  notes: 'These asks are intentionally few and high-conviction: each one could move the recommendation or the price discipline materially.'
