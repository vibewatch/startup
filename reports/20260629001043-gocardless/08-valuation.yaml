- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Key assumptions
  - Valuation / return logic
  - Probability signal
  - Key downside trigger
  rows:
  - - Bull
    - Recurring Pay by Bank adoption accelerates, Mollie cross-sell works, and FY26 profitability proves durable.
    - 6.5x-7.7x revenue or roughly £1.05bn-£1.24bn enterprise value, implying upside only if entry is below the rumored takeout level.
    - Needs clean regulatory close plus strong post-close adoption evidence.
    - Integration distracts product execution or cross-sell disappoints.
  - - Base
    - Signed sale closes broadly on plan and the business keeps converting growth into profitability.
    - 5.5x-6.0x revenue or roughly £0.88bn-£0.97bn, close to the reported strategic anchor and consistent with a fair stance.
    - Best matched to current evidence because it balances momentum against disclosure gaps.
    - Public economics stay opaque and cap upside even if operating progress continues.
  - - Bear
    - Deal timing slips, customer-trust issues linger, or growth slows as management focuses on integration.
    - 3.5x-4.0x revenue or roughly £0.56bn-£0.64bn, moving the story toward mature PSP or stressed-payment multiples.
    - Becomes more likely if approvals slip or FY26 profitability fails to hold.
    - Regulatory delay, higher churn, or another service-quality hit.
  notes: Enterprise-value ranges use FY25 turnover as the latest hard revenue base and apply source-backed multiple bands rather than faux DCF precision.
