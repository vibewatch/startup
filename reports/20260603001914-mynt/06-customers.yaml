  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: active-usage-denominators
    missingEvidence: MAU, DAU, active-merchant counts, and active-corridor denominators behind the registered-user and merchant headlines.
    whyItMatters: Without active denominators, the customer story shows reach but not frequency, depth, or monetization quality.
    diligencePath: Request MAU/DAU, transacting-wallet rates, active-merchant counts, and active-remittance-corridor dashboards.
    relatedTableRefs:
    - TU001
    - TU002
  - type: private-evidence-only
    severity: material
    topic: retention-cohorts
    missingEvidence: Consumer, merchant, borrower, and partner retention, churn, repeat usage, and renewal cohorts.
    whyItMatters: Reach-heavy platforms can still have weak durability if activation is shallow or complaints drive silent churn.
    diligencePath: Request cohort curves, repeat-borrow data, support-resolution trends, and merchant reactivation rates.
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-metrics
    missingEvidence: Top-customer, top-merchant, top-partner, and top-corridor concentration tables, plus revenue exposure by channel.
    whyItMatters: Channel and partner dependence cannot be sized without knowing what share of usage is concentrated in a few nodes.
    diligencePath: Request top-10 concentration tables and corridor or partner GMV / revenue shares.
    relatedTableRefs:
    - TU003
    - TU005
  - type: private-evidence-only
    severity: minor
    topic: support-kpis
    missingEvidence: Median response times, first-contact resolution, app crash rates, dispute turnaround times, and complaint trending.
    whyItMatters: Public complaints are visible, but the committee cannot tell whether the support function is improving or degrading.
    diligencePath: Request monthly support dashboards, crash analytics, and app-store complaint response analyses.
    relatedTableRefs:
    - TU004
    - TU006
