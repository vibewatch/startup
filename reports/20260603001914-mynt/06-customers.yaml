- id: adoption-surfaces-and-customer-proof
  title: Adoption Surfaces and Customer Proof
  body: 'The strongest adoption evidence in public sources comes from concrete usage surfaces rather than abstract “engagement” language. Official help materials show that remittances can be claimed through Cash In > Global Banks and Partners and can appear instantly in-wallet once details are confirmed, while the official remittance-partner directory enumerates a large and geographically diverse set of senders such as Western Union, MoneyGram, Remitly, RIA, Thunes, and Xendit. Transportation is another real-world use surface: the transport help page says all MRT-3 stations accepted GCash from July 25, 2025 across Scan to Pay, Commute by GCash, Tap to Pay, and GCash Card. Globe’s Lucena public-market pilot then shows how the company is trying to reduce the infrastructure friction behind cashless market transactions by pairing GFiber public WiFi with GCash acceptance for vendors and suki. Rappler’s Paleng-QR coverage adds micro-merchant and tricycle-driver usage, which matters because those
    are high-frequency, low-ticket use cases that can create habit if they work consistently.


    Named customer proof exists, but it is uneven in quality. Newsbytes reports that café chain Frank & Dean used PocketPay in its corporate branches and reduced cash handling. Pine Labs’ 2026 press release says GCash for Business is its first Philippine payments partner and that the tie-up will power the next phase of merchant acquisition while supporting card and QR acceptance. Glean’s customer story is an internal enterprise-use proof rather than a paying end-customer proof, but it is still valuable: GCash says Glean saves staff two to three hours per week and has reached more than 90% adoption in some departments. Sponsored coverage from BusinessWorld and Philstar also shows a customer expansion path into freelancers through the Virtual US Account. These proofs are enough to establish real production usage across merchants, commuters, market vendors, and internal teams, but not enough to quantify retention, gross merchandise value per cohort, or customer lifetime value.'
