- id: TU006
  title: Customer complaint / support friction table
  columns:
  - Complaint theme
  - Who is affected
  - Evidence
  - Implication
  - Current public mitigation
  rows:
  - - Sluggish app performance
    - Retail users
    - App Store reviews
    - Reduces checkout confidence and repeat use
    - Troubleshooting guide says update app and switch network
  - - QR scan failures
    - Retail users in checkout queue
    - App Store reviews
    - Embarrassing failed payments can drive multi-homing
    - No public reliability metric; only generic troubleshooting
  - - Verification delays
    - New or re-onboarding users, including minors
    - App Store reviews
    - Onboarding friction can suppress activation and trust
    - Help Center explains account types and verification steps
  - - Restricted account disputes
    - Existing funded users
    - App Store reviews
    - Perceived fund insecurity and support frustration
    - Ticket-status workflow exists but no SLA dashboard
  - - Spammy or excessive notifications
    - Retail users
    - App Store reviews
    - Can increase opt-out or app fatigue
    - No explicit notification-governance evidence surfaced
  - - Phishing / leak fears
    - All users
    - GMA + official support warnings
    - Can depress willingness to keep balances in wallet
    - Users told to monitor accounts and never share OTP/MPIN
  notes: This table captures public friction themes rather than statistically representative complaint rates. It is useful as adverse evidence, not as a quantified churn model.
