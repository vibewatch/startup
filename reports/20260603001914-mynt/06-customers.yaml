    - Named merchant quote says cash handling was reduced
    - Only one named merchant surfaced; no transaction volume disclosed
  - - Lucena Public Market vendors and suki
    - Public-market micro-merchants and shoppers
    - GCash acceptance supported by public WiFi / GFiber pilot
    - Production pilot
