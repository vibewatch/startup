- id: TU003
  title: Named customer proof table
  enumerationScope:
    coverage: partial
    basis: This table lists publicly named merchant, enterprise, public-market, and internal customer proofs surfaced in official pages, customer stories, or cited coverage as of runDate; it is not a complete GCash client list.
  columns:
