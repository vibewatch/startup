tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale
  - Revenue / strategic value
  - Gap
  rows:
  - - Regular adult wallet users
    - Buyer=user=payer
    - Daily payments, bills, transfers, load, shopping
    - 94M registered users headline
    - Core transaction habit and cross-sell entry point
    - No MAU/DAU or transaction-frequency disclosure
  - - Savers / growers
    - Buyer=user=payer
    - GSave, GFunds, GStocks, GCrypto, GBonds
    - 9M+ GSave users; feature pages list more modules
    - Deepens balances and long-term value
    - No AUM, active-user, or retention metrics by product
  - - Borrowers
    - Buyer=user=payer
    - GCredit, GGives, GLoan
    - 3M+ borrowers on official About page
    - Higher-yield monetization path inside same app
    - No repeat-borrow, default, or vintage data
  - - Teen users and parents
    - Parent may pay; teen user spends
    - GCash Jr for shopping, load, student deals, and Visa card
    - Up to 5 linked junior accounts per parent
    - Early-life onboarding and household capture
    - No disclosed active-account or parental-control usage data
  - - Overseas Filipinos / remittance-linked households
    - OFW funds; household receives / uses
    - Foreign-SIM onboarding, remittance cash-in, PH bank transfer, bills, load
    - Official overseas service and partner roster spans many countries
    - Adds inflow corridor and diaspora stickiness
    - No corridor GMV or active-user counts
  - - MSME merchants / social sellers
    - Merchant buyer; end-customer user
    - QR acceptance, wallet receipts, payouts, PocketPay, SoundPay
    - 6M merchants and social sellers headline
    - Anchors network density and merchant-side expansion
    - No active-merchant denominator or tier distribution
  - - Enterprise / brand partners
    - Business buyer; customer may be end-user
    - Partner Solutions, Pine Labs, Glean, marketing, identity solutions
    - Named deployments and case studies, but no full client list
    - Adds B2B expansion loop beyond consumer wallet
    - No contracted revenue or renewal metrics
  - - Commuters / public-market shoppers
    - Buyer=user
    - MRT-3, public markets, tricycles, QR and tap flows
    - Named live deployments in transport and markets
    - Habitual low-ticket frequency can drive retention
    - No transaction counts or repeat-rate disclosure
  notes: Scale mixes official registered-user, merchant, and product-user counts. Rows distinguish who buys, who uses, and who ultimately funds the transaction path.
