- id: durability-satisfaction-and-concentration
  title: Durability, Satisfaction, and Concentration
  body: 'Public durability evidence is far weaker than public reach evidence. The most direct customer-sentiment source is the iOS App Store reviews page, which showed a 3.0-out-of-5 score from 149,000 ratings at access time and highlighted complaints about sluggish performance, QR-reader failures, spammy notifications, verification delays, restricted accounts, and unresolved disputes. Those complaints matter because they go to the heart of a payments platform’s retention loop: the product must work instantly when a user is in a checkout line, boarding transit, or trying to access salary or remittance funds. Official support surfaces partly confirm that product friction is non-trivial: GCash publicly documents update, network-switching, cache-clearing, Help Center search, and ticket-status workflows rather than presenting a clean reliability dashboard or published resolution SLAs.


    Concentration risk is also harder to judge than topline penetration. Public sources do not disclose MAU or DAU against the 94 million registered-user figure, do not disclose the active-merchant denominator against the 6 million merchant headline, and do not disclose top merchant, top corridor, or top partner concentration. Yet the existing evidence still shows areas of channel dependence. Remittance flows rely on a very large partner roster. Merchant-acquiring expansion increasingly leans on Pine Labs for next-phase infrastructure. Palengke and transport rollouts depend on local government and public-sector programs. And at the corporate level, Globe’s 1Q2026 filing shows Mynt contributing 30% of Globe pretax income, which underlines just how strategically central GCash has become to a single parent sponsor. The result is a customer base that appears broad and sticky in narrative terms, but still lacks the cohort data needed to prove durability rigorously.'
