- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Partner Solutions (ads, promos, identity)
    - Value creation may depend on a few large brands or campaigns
    - Can deepen land-and-expand but may be cyclical
    - Request top-10 partner revenue and renewal by solution
  - - Remittance channels
    - Heavy dependence on third-party remittance partners and corridor coverage
    - Partner outage or pricing changes can affect OFW experience
    - Request corridor GMV and partner concentration table
  - - Pine Labs merchant stack
    - Merchant-acquiring build-out increasingly relies on external merchant-infrastructure partner
    - Could accelerate merchant adoption but adds partner dependency
    - Request contract scope, exclusivity, and contingency plans
  - - Transport and public-market programs
    - Usage depends on local government / transit rollout and supporting infrastructure
    - Can create daily habit if scaled, but rollout risk remains externalized
    - Request live station, LGU, and transaction counts
  - - Globe parent sponsorship
    - Mynt remains strategically tied to a single corporate parent
    - Parent priorities can shape capital allocation and go-to-market sequencing
    - Request governance rights and related-party operating dependencies
  - - Trust / support reputation
    - User complaints can impair repeat usage even at high top-line reach
    - Poor support or app performance can raise silent churn
    - Request support KPI and complaint trend dashboards
  notes: This table focuses on where expansion loops and concentration risks overlap. Several risks are channel- or partner-driven rather than traditional top-customer concentration.
