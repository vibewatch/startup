    {
      "id": "mitigations-monitoring-and-thesis-breakers",
      "title": "Mitigations, monitoring, and thesis-breakers",
      "body": "The mitigation case is real but incomplete. GCash has published terms, privacy notices, a separate acceptable-use policy, a Help Center and hotline structure, a Customer Protect dispute program, named complaint channels to BSP and SEC for lending, and public anti-fraud disclosures that point to active blocking and regulator coordination. Sponsor support also matters: Globe’s filings show Mynt is already a meaningful earnings driver rather than a speculative side bet. But the retained record still leaves several gating diligence asks unresolved. Investors need documentary closure or current status on the NPC-led alleged breach probe, quantified service and reimbursement performance, the true incidence of false-positive restrictions or support backlog, lending vintages and charge-offs, and the financial exposure of GLife’s regulator-forced gaming suspension. Until those materials are produced, Mynt’s risk posture remains investable only with explicit kill criteria: adverse privacy enforcement, sustained trust deterioration, materially weak credit-loss data, or an IPO process that slips or reprices hard enough to break the current growth-support narrative.",
