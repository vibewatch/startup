    {
      "id": "credit-model-and-dependency-risk",
      "title": "Credit, partner, and dependency risk",
      "body": "Mynt’s downside risk is amplified by the fact that GCash is not only a wallet but also an increasingly important lending and partner-distribution platform. GLoan legal terms authorize verification against CIC, Bankers Association of the Philippines, TransUnion, Trusting Social, and other counterparties, and allow automatic deduction, default reporting, and third-party collections. Public sources are explicit on scale: retained coverage says Fuse had disbursed roughly P287 billion to 9.5 million borrowers by mid-2025, while Google Play discloses consumer lending APRs of up to 89.9% and processing fees up to 7.5%. That gives public visibility into growth and pricing, but not into asset quality. At the same time, the app’s product surface depends on numerous external parties: CIMB for GCredit, partner banks for savings rails, GLife merchants for embedded commerce, and multiple third-party offerings across wealth, insurance, and lifestyle services. The result is a compounded risk profile in which policy change, partner failure, collections stress, or credit-model drift can spill into both revenue and trust.",
