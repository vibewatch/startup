      "id": "fraud-trust-and-service-friction",
      "title": "Fraud, trust, and service-friction risk",
      "body": "The most visible current risk to the GCash franchise is not a single catastrophic outage but a constant pressure on trust from scams, impersonation, disputed transactions, and support friction. Multiple 2026 articles say GCash blocked more than 4,900 fraudulent merchants tied to quishing, while BusinessMirror says the company has taken down more than 57,000 phishing sites since 2023 and reported 916 illegal online gaming sites. Those statistics are mitigating signals, but they are also evidence that the attack surface is large enough to need industrial-scale enforcement. Customer-proof sources point the same way. The App Store review page showed 149k ratings and a 3.0 score at fetch time, with recent reviews describing sluggish QR payments, failed logins, pending verification, unresolved restricted-account cases, and unauthorized-transaction disputes. Official advisories confirm at least episodic payment-surface disruption, while live outage trackers showed no acute fetch-date crisis. The residual issue is therefore chronic trust erosion: even when the platform is not visibly down, scam burden and poor service recovery can still weaken transaction confidence and brand resilience.",
