    "number": 7,
    "title": "Risks",
    "summary": "Mynt / GCash’s main downside is not license absence but a compounding mix of fraud and privacy scrutiny, support and trust erosion, and opaque credit exposure layered onto partner and IPO dependence. Public mitigations exist, but the retained record still lacks regulator-closure, lending-loss, and service-quality evidence strong enough to underwrite residual risk with high confidence."
  },
  "sections": [
    {
      "id": "regulatory-legal-and-consumer-protection",
      "title": "Regulatory, legal, and consumer-protection risk",
      "body": "GCash’s legal surface is not a question of whether it is licensed; the sharper issue is how a mass-market e-money wallet, partner marketplace, and lending funnel allocate responsibility when something goes wrong. GCash says it is BSP-regulated, but its own terms also make the wallet non-deposit, non-PDIC-insured e-money and place meaningful responsibility on users through presumptions around MPIN-, PIN-, and OTP-authorized transactions. The same terms impose a short dispute window, limit liability absent direct gross negligence, and keep venue in Taguig. The privacy posture is similarly broad rather than narrow: GCash says it collects KYC, financial, device, and employment data and shares data with affiliates, service providers, financial institutions, fraud-prevention partners, and regulators. The strongest external legal signal is the NPC’s October 2025 statement on an alleged data leak, which escalated to a Notice to Explain and clarificatory conference while public closure remained absent in the retained record. Separately, BSP policy already forced a GLife gaming suspension, proving that platform-scope changes can be regulator-driven rather than purely product-driven.",
