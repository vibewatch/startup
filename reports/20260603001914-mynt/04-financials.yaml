- id: TI002
  title: Pricing / monetization table
  columns:
  - Product / rail
  - Published price or fee
  - List vs realized
  - Why it matters
  - Source basis
  - Open issue
  rows:
  - - Send Money
    - No fee
    - List
    - Keeps core wallet habit high but monetizes indirectly
    - Official fee schedule
    - Need evidence on how free transfers convert into paid rails
  - - Bank Transfer
    - ₱15 per transaction
    - List
    - Direct wallet monetization benchmark
    - Official fee schedule
    - Need monthly transfer volume and net take after rail costs
  - - Offline cash in / cash out
    - Free up to ₱8,000 monthly then 2%; cash-out 2% or ₱18 via RCBC
    - List
    - Monetizes cash conversion but may hurt low-income usage beyond threshold
    - Official fee schedule and help article
    - Need elasticity after threshold and share of OTC users above free band
  - - Outbound international transfer
    - 2% of amount; ₱130 min, ₱1,200 max
    - List
    - High-margin candidate if corridor usage is meaningful
    - Official fee schedule
    - Need corridor mix, transaction count, and fraud-loss rate
  - - GLoan
    - ₱500-₱150,000 principal; 1.59%-6.99% monthly interest
    - List
    - Most visible credit-yield anchor in public sources
    - Official help article
    - Need realized APR, repeat-borrow rate, and net credit loss
  - - GSave
    - 0.0925%-4.0% annual partner yields
    - List partner offers
    - Shows wallet-to-deposit funnel but not Mynt’s retained revenue
    - Official help article
    - Need partner revenue share and deposit balances
  - - GFunds
    - No transaction fee; 0.50%-1.75% annual trust fee embedded in NAVPU
    - List fund economics
    - Shows wealth distribution economics without explicit user-facing charges
    - Official help article and services page
    - Need AUM and Mynt revenue share per fund
  - - Merchant QR / wallet acquiring
    - 'Conflicting external estimates: 2.5% + ₱3 vs 1.0%-2.0% MDR'
    - Conflicting external estimates
    - Merchant take rate determines profitability of payments acceptance
    - Independent merchant guides
    - Need official MDR card and realized blended merchant margin
  notes: This table intentionally distinguishes official list pricing from realized economics. The merchant-MDR row preserves the conflict across independent sources instead of forcing a false consensus.
