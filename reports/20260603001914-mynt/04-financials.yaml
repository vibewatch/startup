- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Current public substitute
  - Why the gap matters
  - Exact diligence path
  - Severity
  rows:
  - - Standalone audited revenue and EBITDA
    - Globe equity earnings and IPO/valuation reporting
    - Without audited revenue and EBITDA, valuation and margin quality cannot be underwritten
    - Obtain FY2024-FY2025 audited consolidated Mynt statements and management discussion
    - blocking
  - - Cash balance, monthly burn, and runway
    - Globe free-cash-flow and leverage disclosures
    - Capital adequacy cannot be tested without entity-level liquidity
    - Request monthly treasury cash bridge and 12-month funding plan
    - material
  - - Segment revenue split across payments, lending, wealth, and insurance
    - Product breadth counts and list pricing
    - Impossible to know what actually drives revenue concentration and margin
    - Request board pack or IPO draft with segment revenue and gross margin
    - material
  - - Credit-quality metrics (NPL, roll rates, charge-offs, provisioning)
    - Loan-book growth and borrower counts
    - High loan growth can destroy value if credit cost overwhelms yield
    - Obtain vintage curves, delinquency buckets, write-offs, and provisioning policy
    - material
  - - Realized merchant MDR / take rate
    - Conflicting external MDR estimates and official onboarding pages
    - Merchant-acquiring profitability depends on net take after rails and incentives
    - Obtain merchant pricing card, realized MDR by cohort, and incentive spend
    - material
  - - Loan-processing-fee accounting bridge
    - 4Q25 Globe filing notes a revenue-recognition policy change
    - Accounting-policy shifts can alter trend comparability around IPO marketing
    - Request policy memo, before/after revenue bridge, and auditor review
    - material
  notes: This table is intentionally gap-centric. Every row is a missing disclosure that prevents a clean public-market-style underwriting exercise today.
