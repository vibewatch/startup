- id: financial-verdict-and-diligence-asks
  title: Financial Verdict and Diligence Asks
  body: 'The financial verdict is stronger than a typical private fintech but still short of IPO-grade diligence. Mynt has three genuine financial positives: it is already a major profit contributor to Globe, it is scaling a very large lending book with visible borrower adoption, and it has attracted both blue-chip equity capital and development-finance lending. These signals suggest commercial validity rather than venture-only subsidy. The structural downside is that almost every metric needed for underwriting remains private. Without standalone revenue, segment mix, credit losses, cash balance, and realized merchant take rates, an investor cannot test whether the jump from a $5 billion 2024 private valuation to an $8 billion IPO target is supported by revenue quality or merely by strategic scarcity and market positioning.


    Accordingly, the committee should treat Mynt as financially promising but still disclosure-constrained. The minimum package before underwriting should include: audited standalone FY2024-FY2025 financials; segment revenue and gross margin by payments, lending, wealth, and insurance; monthly or quarterly credit-quality metrics for Fuse; realized merchant MDR by acquisition product; and a cash, liquidity, and capital-adequacy bridge through the contemplated listing. Until those items are available, the public evidence supports monitoring and preparation, not valuation conviction.'
