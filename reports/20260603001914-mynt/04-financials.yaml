callouts:
- calloutType: strength
  title: Mynt is already an earnings engine, not just an IPO story
  body: 'Globe’s filings make Mynt economically tangible: ₱6.1 billion of FY2025 equity earnings and ₱1.9 billion in 1Q2026. That level of earnings contribution is unusually visible for a private fintech and materially de-risks the “is there a business here?” question.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
- calloutType: risk
  title: Merchant take-rate and credit-loss economics are still opaque
  body: Public sources reveal list pricing and loan-book scale, but not realized merchant MDR, net interest margin after losses, or segment gross margin. The external merchant-MDR conflict shows how easily private-fintech unit economics can be misread without internal pricing cards.
  claimRefs:
  - CI037
  - CI038
  - CI040
  - CI058
- calloutType: recommendation
  title: Require audited standalone financials before underwriting the IPO target
  body: The minimum diligence package should include audited FY2024-FY2025 Mynt financials, segment revenue and margin splits, Fuse credit-quality tables, realized merchant MDR by cohort, and an entity-level cash and runway bridge. Without those items, valuation work is still inference-heavy.
  claimRefs:
  - CI011
  - CI043
  - CI055
  - CI058
