- id: financial-disclosure-gaps-and-earnings-quality
  title: Financial Disclosure Gaps and Earnings Quality
  body: 'Financial disclosure quality remains the central underwriting blocker. Across the reviewed Globe filings, Ayala disclosure, IPO coverage, product pages, and partner announcements, public sources consistently disclose valuation anchors, Globe equity earnings, loan disbursements, borrower counts, and list pricing—but not standalone audited Mynt revenue, EBITDA, cash balance, burn, runway, segment revenue mix, gross margin, or credit-loss metrics. Even where momentum is clear, the evidence stops short of a full underwriting pack. For instance, the public record supports fast CreditTech growth and broad cross-sell into wealth and insurance, but it does not show what share of profit comes from payments versus lending, what loss rates absorb credit yield, or what part of reported growth is volume-led versus fee-led.


    Quarter quality also needs interpretation. Globe’s 4Q25 disclosure says Mynt’s quarter was affected by a change in accounting policy for loan-processing-fee revenue recognition, a regulatory change affecting licensed online gaming, and seasonally higher spending. That does not negate the full-year earnings trajectory, but it does show how sensitive quarter-to-quarter earnings can be to accounting policy, regulatory change, and promotional intensity. Investors therefore should treat the available financial story as directionally positive but still non-auditable: Mynt clearly matters, but the public evidence does not yet support a clean view of revenue quality, normalized margin, loss-adjusted lending profitability, or forward cash needs.'
