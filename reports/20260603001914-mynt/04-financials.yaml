- id: capital-adequacy-and-financing-dependency
  title: Capital Adequacy and Financing Dependency
  body: 'The 2024 Ayala/MUFG transactions and the 2026 IPO reporting frame Mynt’s capital story. Ayala disclosed that its August 2024 secondary purchase of roughly 8% of Mynt for ₱22.4 billion valued the company at approximately ₱286.4 billion, or about $5 billion, and raised Ayala’s stake to roughly 13%. Reuters-sourced reporting in May 2026 says Mynt is targeting an IPO valuation of at least $8 billion, could raise around $1 billion, and may file as early as July 2026, with Citi, Jefferies, and UBS already working on the process. At the same time, Globe CFO Juan Carlo Puno has explicitly said there is no official decision on timing and that the company remains open to various capital solutions, which means the IPO still functions as an option, not a committed financing event.


    The nearer-term capital signal is the February 2026 ADB facility to Fuse. ADB signed a $30 million loan (about ₱1.75 billion) to support MSME lending, with 60% earmarked for women-owned enterprises, up to $125,000 of technical assistance, and a $150,000 Mastercard Impact Fund incentive. That facility is economically modest relative to Mynt’s implied valuation, but strategically important: it validates underwriting quality, lowers funding concentration risk for part of the lending book, and shows that Mynt can attract mission-driven debt capital before listing. Parent support also matters. Globe reported positive free cash flow in FY2025, capex of ₱46.2 billion under its sub-$1 billion guidance, and debt metrics within covenants at both FY2025 and 1Q2026. That does not prove Globe will fund Mynt indefinitely, but it does indicate that Mynt is backed by a sponsor with continuing balance-sheet capacity while the IPO window remains optional.'
