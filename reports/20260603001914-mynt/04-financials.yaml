  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: standalone-audited-financials
    missingEvidence: Standalone audited FY2024-FY2025 Mynt income statement, balance sheet, cash-flow statement, and segment notes.
    whyItMatters: The current public record proves profit contribution to Globe but does not allow revenue-quality, margin, or cash-conversion underwriting at the Mynt entity level.
    diligencePath: Request the latest audited financial statements or near-final IPO draft financial section from management or bookrunners.
    relatedTableRefs:
    - TI004
    - TI005
  - type: conflicting-data
    severity: material
    topic: merchant-mdr
    missingEvidence: A canonical official merchant pricing card showing QR Ph, wallet, card, settlement, and any volume-tier discounts.
    whyItMatters: The external spread between 1.0% MDR and 2.5% + ₱3 materially changes wallet and merchant-acquiring unit economics.
    diligencePath: Obtain the current merchant contract template, pricing schedule, and realized blended MDR by merchant cohort.
    relatedQuestionRefs:
    - QI014
    relatedTableRefs:
    - TI002
    - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-balance-runway
    missingEvidence: Entity-level cash balance, monthly burn or generation, regulatory capital buffers, and 12-month runway forecast.
    whyItMatters: Capital adequacy cannot be judged from sponsor-level leverage alone, especially for a lending-heavy fintech approaching IPO.
    diligencePath: Request treasury dashboards, board liquidity packs, and regulated-entity capital summaries for GXI and Fuse.
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: credit-quality-metrics
    missingEvidence: Public or private vintage curves, NPLs, roll rates, provisioning policy, charge-offs, and funding-cost bridge for Fuse.
    whyItMatters: A rapidly growing loan book can still destroy value if credit losses or funding costs absorb the advertised interest yield.
    diligencePath: Request quarterly credit-risk reporting packs and auditor-reviewed provisioning memos for the lending portfolio.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: segment-revenue-mix
    missingEvidence: Revenue and gross margin split across payments, lending, wealth, insurance, and any other operating segments.
    whyItMatters: Without segment mix, investors cannot determine whether Mynt’s earnings are driven by scalable high-quality revenue or by concentrated, riskier rails.
    diligencePath: Request IPO draft segment note, management accounts, or board deck showing segment revenue, gross margin, and growth rates.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI001
    - TI005
