tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Public pricing anchor
  - Current scale / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Wallet transfers and cash services
    - Bank transfers, cash-in/out, remittance and outbound transfer fees
    - ₱15 bank transfer; 2% offline cash-out; 2% outbound transfer
    - Official fee schedule current as of runDate
    - High frequency but partly fee-free; realized mix undisclosed
    - Monthly transactions, total fee revenue, and share of active users paying fees
  - - Merchant payments / QR acquiring
    - QR acceptance, wallet acceptance, Scan to Pay, business settlement services
    - Official onboarding disclosed, but merchant MDR not published in one canonical official table
    - Business merchant program active nationwide
    - Potentially sticky, but take rate and merchant retention undisclosed
    - Official MDR table by product and merchant cohort
  - - Lending / CreditTech
    - Interest income, processing fees, and ancillary credit charges on GLoan and related products
    - GLoan 1.59%-6.99% monthly interest; principal ₱500-₱150,000
    - ₱362B 2025 disbursements; 10.5M borrowers
    - Likely highest-yield revenue rail, but loss-adjusted margin unknown
    - Vintage curves, NPLs, charge-offs, provisioning, funding cost
  - - Savings / deposits distribution
    - Partner-bank savings acquisition and deposit distribution via GSave
    - Headline annual yields from 0.0925% to 4.0% depending on partner product
    - Multiple bank partners live in-app
    - Likely low direct revenue per peso without disclosed partner economics
    - Revenue-share terms, balances, and active-account counts by bank partner
  - - Wealth / investments
    - Distribution of funds and trading products through GFunds and GStocks
    - No transaction fee on GFunds; 0.50%-1.75% embedded trust fees
    - 1.7M GStocks registered users in 2025; GFunds active
    - Attractive fee pool if balances are large, but AUM/revenue undisclosed
    - AUM, net inflows, and Mynt’s retained economics per product
  - - Insurance distribution
    - Embedded and marketplace insurance distribution through GInsure
    - Products start as low as ₱10 per month
    - 132.6M policies sold in 2025
    - Potentially high-volume distribution revenue, but commission take undisclosed
    - Commission rates, premium mix, claims ratios, and renewal behavior
  notes: List pricing and product availability are publicly observable, but realized revenue mix and contribution margins are not. Rows separate visible pricing rails from the undisclosed retained economics behind each rail.
