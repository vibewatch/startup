- id: moat-durability-and-adverse-evidence
  title: Moat Durability and Adverse Evidence
  body: |-
    The durability question is whether GCash's scale advantage can keep compounding now that rivals increasingly own bank licenses and can capture balance-sheet economics directly. On that point, the most material structural gap is that Maya, GoTyme, and Tonik all compete with owned digital-bank products, while GCash's strongest public differentiators remain network scale, payments ubiquity, and breadth of embedded finance rather than a native BSP digital-bank license. If the category's center of gravity keeps shifting toward deposit monetization, underwriting, and interest-bearing balances, that asymmetry becomes more important. Regulation reinforces the point: the BSP has capped digital-bank licences at ten, which means scarce bank permissions can themselves function as a long-duration competitive asset.

    Adverse evidence also matters because trust is inseparable from fintech usage. The October 2025 NPC probe into an alleged GCash data leak did not prove that GCash systems were the source, but it still created a real confidence shock around data custody and response readiness. Separate reporting that BSP views cybersecurity as the main barrier to broader digital-payment adoption means security performance is not just a compliance burden; it is a competitive variable that can change user willingness to store balances or route higher-value activity through one platform. Public evidence does not yet prove that challengers have structurally dislodged GCash, but it does show a more credible challenger set than in prior years and leaves core underwriting questions unresolved because operator-level transaction volume, loan quality, and standalone profitability remain mostly private across the field.
