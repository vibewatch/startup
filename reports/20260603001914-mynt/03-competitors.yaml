sections:
- id: competitive-landscape-overview
  title: Competitive Landscape Overview
  body: |-
    Philippine digital finance is no longer a simple wallet land-grab. By June 2026, the competitive field clusters into at least three visible tiers: super-app wallets with adjacent DFS layers, licensed digital banks trying to own deposits and credit economics, and adjacent checkout or crypto-led apps that compete for specific payment moments without matching full product breadth. GCash still sits at the top of the field on user scale and merchant ubiquity, with 94 million registered users and a large merchant footprint, but the market is no longer defined by onboarding alone. Maya has paired its wallet with an owned digital-bank stack, GoTyme has used a branch-lite kiosk model to accelerate onboarding, Coins.ph remains relevant in crypto-linked payments, and Tonik competes by using high-yield deposits to attract wallet-adjacent balances.

    The regulatory backdrop explains why the chapter matters. BSP has six active digital-bank licensees and reopened the licensing window in 2024 while capping the market at ten licensees, which means the most credible challengers now have room to combine payment rails with deposit, lending, and savings economics. At the same time, BSP's own e-payments report shows that digital payments already account for most Philippine retail-payment volume and value, with QR Ph merchant growth still compounding quickly. That combination pushes the contest away from pure QR acceptance and toward who can monetize balances, underwrite credit, retain remittance flows, and sustain trust as the category scales.
