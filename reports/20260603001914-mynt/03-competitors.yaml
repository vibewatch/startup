- id: TP004
  title: Moat and Competitive Risk Register
  columns:
  - Moat / Risk Factor
  - Durability Assessment
  - GCash Position
  - Key Challenge
  - Recommended Diligence Step
  rows:
  - - User-network scale
    - High but not permanent
    - Category leader by registered users and habit
    - Challengers can subsidize acquisition and target high-value cohorts
    - Request cohort-level MAU, transacting-user, and wallet-balance retention data
  - - Merchant QR infrastructure
    - Medium
    - Strong acceptance footprint and merchant familiarity
    - QR Ph interoperability reduces exclusivity of acceptance rails
    - Measure merchant actives, share of QR volume, and churn by cohort
  - - Banking licence gap
    - Material structural risk
    - No owned digital-bank licence in public evidence set
    - Maya, GoTyme, and Tonik can own deposit economics directly
    - Clarify long-term banking strategy, partnerships, and economics of partner-bank products
  - - Credit-history data moat
    - Potentially strong
    - Large installed base can create repayment and underwriting data loops
    - Data portability is low, but rivals with banks can build their own loops quickly
    - Request approval-rate, repeat-loan, and loss-rate cohorts by product
  - - Trust and security risk
    - Material
    - Brand scale helps, but scrutiny raises downside if trust slips
    - NPC probe and category-wide cyber-risk warnings can depress balance storage and usage
    - Review incident logs, fraud-loss trends, customer redress metrics, and regulator correspondence
  notes: Durability assessments are qualitative judgments derived from public evidence and regulatory signals as of June 2026; not a substitute for management due diligence.
