  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: competitor-financial-comparison
    missingEvidence: Maya Bank's standalone P&L, loan book quality, and net interest margin are not publicly disclosed.
    whyItMatters: Without unit-level profitability and credit-quality data, the market cannot tell whether Maya balance-sheet strategy is economically superior or simply more visible.
    diligencePath: Request audited standalone financials, loan-book vintage curves, NPL ratios, and margin bridges for Maya Bank and any comparable Mynt banking entities.
    relatedQuestionRefs:
    - QP012
    - QP021
  - type: missing-source
    severity: material
    topic: market-share-quantification
    missingEvidence: No publicly available GTV or transaction-volume breakdown by wallet operator; GCash market share cannot be precisely quantified.
    whyItMatters: The competitive thesis depends on whether GCash user lead translates into transaction dominance and monetizable wallet balances, but public market-share math is incomplete.
    diligencePath: Request operator-level TPV, active-user, and merchant-volume disclosure directly from management and cross-check it against BSP rail-level data.
    relatedQuestionRefs:
    - QP009
    - QP021
  - type: enumeration-incomplete
    severity: material
    topic: competitor-enumeration
    missingEvidence: GrabPay and ShopeePay user counts for the Philippines are not publicly disclosed; their inclusion in TP001 relies on company-level figures rather than Philippines-specific counts.
    whyItMatters: The absence of country-specific user counts makes substitute-platform benchmarking incomplete and may understate or overstate adjacent checkout pressure.
    diligencePath: Seek Philippines-specific MAU, merchant, and checkout-penetration data for GrabPay and ShopeePay from company disclosures or industry data vendors.
    relatedQuestionRefs:
    - QP001
    relatedTableRefs:
    - TP001
  - type: stale
    severity: minor
    topic: freshness
    missingEvidence: Competitive positioning data (user counts, savings rates) changes frequently; all figures should be refreshed at due-diligence time against the most recent company disclosures.
    whyItMatters: Fast-changing customer and pricing data can change the ordering of challengers even when structural conclusions stay intact.
    diligencePath: Re-check official rate cards, customer milestones, and BSP licensing status immediately before an investment committee decision.
    relatedQuestionRefs:
    - QP022
    - QP023
    - QP024
  - type: missing-source
    severity: material
    topic: unauthorized-deduction-incident
    missingEvidence: The retained source pack for this chapter does not include a confirmed direct article on the earlier unauthorized-deduction incident referenced in prior workups.
    whyItMatters: Trust incidents can alter stored-balance behavior, but without a retained direct source the incident cannot be analyzed to the same standard as the NPC probe.
    diligencePath: Pull the directly sourced incident article or regulator notice into the next refresh and map refund timing, user impact, and recurrence.
    relatedQuestionRefs:
    - QP020
