- id: feature-pricing-distribution-comparison
  title: Feature, Pricing, and Distribution Comparison
  body: |-
    The product comparison is best understood as a trade-off among breadth, ownership, and distribution. GCash and Maya both compete as broad consumer finance apps, but they reach that breadth in different ways. Maya controls more of the deposit stack through its bank, while GCash still relies more heavily on partner-bank wrappers for savings even as it retains stronger payment ubiquity. GoTyme and Tonik, by contrast, own licensed bank products but do not yet appear to match GCash on domestic merchant reach or wallet habit. Coins.ph is differentiated by crypto functionality and wallet activity, not by a full retail-banking menu. Once QR rails are interoperable, buyers and users care more about what sits around the payment button: savings yield, credit eligibility, cash-in friction, debit-card utility, and the breadth of adjacent financial services.

    Pricing reflects that same shift. Tonik has leaned visibly into savings and time-deposit rates, Maya has used headline savings promotions to drive wallet-to-bank migration, and GoTyme has emphasized simple savings plus debit-card utility. GCash's pricing posture is harder to compare cleanly because GSave rates depend on partner products rather than one native balance-sheet offer. Distribution also differs structurally. GCash benefits from installed scale and habit, Maya benefits from telco and enterprise trust inherited from PLDT and Smart, and GoTyme's kiosk model lowers onboarding friction in physical retail venues. Those differences matter because they shape not just acquisition cost, but how easily a user can shift balances, discover adjacent products, and turn a wallet relationship into a primary financial account.
