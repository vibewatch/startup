chapter:
  number: 3
  title: Competitive Landscape
  summary: GCash still leads Philippine digital finance on user scale and merchant reach, but the field is tightening as Maya, GoTyme, and Tonik compete with owned digital-bank economics and more explicit savings monetization. Public evidence suggests the real contest is shifting away from wallet onboarding toward deposits, credit, trust, and distribution, with QR interoperability reducing closed-loop payment exclusivity. GCash remains advantaged, yet banking-licence asymmetry and security-related trust risk are now the most material competitive durability questions.
