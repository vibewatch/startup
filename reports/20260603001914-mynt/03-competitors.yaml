- id: switching-costs-and-network-effects
  title: Switching Costs and Network Effects
  body: |-
    GCash's strongest competitive defense is still network-based rather than purely regulatory. A wallet with the broadest merchant acceptance, the most familiar consumer interface, and the largest installed user base becomes the default way to request payment, split bills, and keep day-to-day stored value. That is why GCash's merchant footprint matters so much: each new merchant makes the app more useful to consumers, and each new user makes the merchant decision to accept GCash more rational. This dynamic extends beyond QR counters into online checkout, micro-merchant collections, and in-app commerce surfaces. It also helps explain why challenger apps often need either a subsidy, a higher deposit yield, or a distinct physical-distribution angle to break habit.

    Still, not all switching costs are permanent. QR Ph interoperability reduces closed-loop acceptance advantage by making GCash and Maya codes cross-readable, so pure QR exclusivity is weaker than it once was. The more durable lock-in may come from data and workflow: repayment history that influences future credit access, wallet balances tied to recurring bills, remittance flows routed to a household's default app, and merchant integrations that connect one payment profile to a broader commerce journey. GoTyme's kiosk model lowers initial onboarding friction and makes multi-homing easier, but it does not automatically replicate GCash's embedded usage loops. In practice, users can add a second app, yet still keep one platform as their primary default if that platform owns the daily payment habit, the best-known contacts, and the financial history that matters for future product eligibility.
  claimRefs:
  - CP031
  - CP032
  - CP033
  - CP034
  - CP035
