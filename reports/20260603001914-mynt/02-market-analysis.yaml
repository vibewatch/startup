  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: GCash-market-share
    missingEvidence: "GCash gross transaction value (GTV) by year, monthly active users (MAU)
      distinct from registered users, and take-rate by product line (payments, lending, wealth, insurance)"
    whyItMatters: "Without GTV or MAU, the SOM in the TAM/SAM/SOM analysis is unquantified;
      valuation multiples applied to market size are speculative without knowing GCash's actual
      share of the market it operates in"
    diligencePath: "Request management data room during IPO roadshow; alternatively, model using
      Globe equity income from Mynt and an estimated EBIT margin to back-solve a revenue/GTV figure"
    relatedQuestionRefs:
    - QM026

  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: "Detailed methodology notes from e-Conomy SEA 2025 explaining the base
      population, FX assumptions, and instrument scope that produce the USD 125B GTV vs. BSP's
      USD 136B value figure for 2024"
    whyItMatters: "The USD 11B discrepancy (9% of the smaller figure) means the two most credible
      market size sources cannot be combined without an adjustment factor, reducing confidence in
      any single-point market size estimate"
    diligencePath: "Request full e-Conomy methodology appendix from Google/Bain; compare with BSP
      annual payment report footnotes on scope and currency conversion"
    relatedQuestionRefs:
    - QM025

  - type: stale
    severity: material
    topic: financial-inclusion
    missingEvidence: "BSP's own Financial Inclusion Survey results for 2024 and 2025, which were
      not yet published as of the June 2026 run date; the World Bank Findex figure of 50.2% is
      the most recent public measure"
    whyItMatters: "The dip from 51.4% to 50.2% in account ownership may have reversed since
      2024 given ongoing GCash acquisition programs, but confirmation requires BSP's survey"
    diligencePath: "Monitor BSP Financial Inclusion Report publication schedule; use BSP quarterly
      e-money data releases as interim proxy for mobile wallet issuance trends"

  - type: enumeration-incomplete
    severity: minor
    topic: GCash-market-share
    missingEvidence: "Full enumeration of Philippine e-wallet providers with transaction volume
      or GTV share, which would allow derivation of GCash's market share as a residual"
    whyItMatters: "GCash is assumed to be the market leader but competitors (Maya, ShopeePay,
      WeChat Pay, bank super-apps) are growing; market share could be eroding without a
      complete competitor GTV breakdown"
    diligencePath: "Search BSP e-money outstanding balances by issuer data published quarterly;
      cross-check with app download and usage data from Sensor Tower or App Annie"
