  summary: "Transaction-based funnel showing the progression from total retail payment volume
    to digitized and sub-channel adoption in 2024."
  data:
    items:
    - label: "Total Philippine monthly retail transactions (2024, millions)"
      value: 483
    - label: "Digital channel transactions (57.4% of total, millions/month)"
      value: 277
    - label: "Merchant-facing (P2M) payments (66.4% of digital, millions/month)"
      value: 184
    - label: "P2P transfers (InstaPay + e-wallet; 20.6% of digital, millions/month)"
      value: 57
    - label: "InstaPay daily-volume run-rate (Jan 2026, millions/month est.)"
      value: 22
  approximationNotes: "Values in millions of transactions per month. BSP 2024 Report cites 5.8 billion
    total retail transactions for the full year 2024 (÷12 = ~483M/month). Sub-channel shares applied from
    BSP volume breakdown: merchant P2M 66.4%, P2P 20.6%, B2B 6.2%. InstaPay Jan 2026 run-rate of 678M
    transactions/month is divided by 30 and converted to monthly scale by multiplying daily ×30 again;
    shown here as approximate daily-equivalent for funnel comparison context only. QR Ph merchant growth
    of +148.7% is an annual rate applicable to the acceptance network, not to transaction volume."
