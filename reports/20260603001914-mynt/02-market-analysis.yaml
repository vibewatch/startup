callouts:
- calloutType: risk
  title: The 94M User Paradox — Registration vs. Active Use
  body: "GCash's reported 94 million registered users sits in uncomfortable tension with the World
    Bank Findex 2025 estimate that only about 10.5 million Filipino adults hold mobile wallet accounts
    (28.8% of the 36.6 million with any financial account). The 9:1 ratio almost certainly reflects
    dormant accounts, registrations by individuals under 15, and definitional gaps — but the chasm
    is large enough to matter for active-user-based valuation. Without a disclosed monthly active user
    (MAU) figure, the SOM and engagement-depth assumptions in any GCash financial model are inherently
    speculative."
  claimRefs:
  - CM021
  - CM023
  - CM018
  - CM041

- calloutType: insight
  title: "Market Shape: Digital Payments Are Already Mass-Market, DFS Adjacencies Are Not"
  body: "The BSP data confirms that digital payments themselves are no longer a niche: 57.4% volume
    share in 2024, government transactions at 97.2%, individual transactions at 72.2%. The scarcity
    premium for GCash now comes from the DFS adjacencies — credit, savings, wealth, insurance — where
    digital penetration is still low (USD 4B lending, USD 2B wealth AUM vs. a USD 150B payments market).
    This creates a barbell opportunity: payments provide distribution scale; DFS products provide margin."
  claimRefs:
  - CM001
  - CM014
  - CM015
  - CM038
  - CM039

- calloutType: risk
  title: Connectivity Gap Limits TAM Realization
  body: "72% of Filipino households lacking fixed broadband as of 2023 is not merely an infrastructure
    footnote — it directly caps the conversion of the 49.8% unbanked adult population into active digital
    payers. Mobile data fallback helps but is unreliable and expensive in rural areas. The World Bank
    DPL explicitly targets connectivity as the first use-case block. Until broadband coverage meaningfully
    improves, any market projection that models rural adoption on current urban trajectories will overstate
    the near-term TAM."
  claimRefs:
  - CM029
  - CM021
  - CM028

- calloutType: assumption
  title: BSP 2028 Target as the Policy-Bound Ceiling
  body: "The analysis treats the BSP 60–70% digital payment share target for 2028 as the regulatory
    ceiling for the medium-term adoption trajectory. This is an assumption: regulators can accelerate
    with enforcement (e.g., mandatory digital payroll, government e-payments mandates) or the target
    could be revised upward if adoption exceeds expectations. Investors should model both a base case
    (gradual linear improvement from 57.4% to 65%) and an upside case (regulatory push reaches 70%
    by 2027), as the gap between these scenarios drives meaningful differences in GCash GTV forecasts."
  claimRefs:
  - CM026
  - CM001

