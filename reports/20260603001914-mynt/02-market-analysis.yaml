- id: sizing-gaps-and-diligence-asks
  title: Sizing Diligence Gaps and Contradictory Estimates Preserved
  body: "Three categories of sizing gap constrain the precision of any GCash market analysis.\
    \ First, GCash's own GTV is not publicly disclosed. Globe's quarterly reports reference\
    \ Mynt's earnings contribution and user growth but do not break out gross transaction\
    \ value, take-rate by vertical, or active monthly users versus registered users. The 94\
    \ million registered user figure, if taken at face value against the World Bank Findex\
    \ estimate that only ~10.5 million Filipino adults hold mobile wallets (28.8% of 36.6\
    \ million account holders), implies a 9:1 gap between GCash's registration count and\
    \ the Findex's adult mobile wallet population — almost certainly reflecting dormant\
    \ accounts, underage users, or definitional differences. Without active user data, SOM\
    \ estimation is speculative.\n\nSecond, the BSP digital payments share (57.4% of volume,\
    \ 59.0% of value) and the e-Conomy SEA GTV estimates (USD 125B for 2024 vs USD 136B per\
    \ BSP) diverge by USD 11 billion. The methodological notes in e-Conomy acknowledge that\
    \ their GTV includes credit and debit card transactions in addition to A2A/e-wallet flows,\
    \ whereas BSP may use a different base for 'retail payments.' This incompatibility means\
    \ that combining both sources without adjustment will overstate or understate market size\
    \ depending on which figure is used as the base.\n\nThird, the January 2026 BSP monthly\
    \ figure (P2.58 trillion) annualizes to roughly USD 540 billion, which is 3–4x the\
    \ e-Conomy GTV estimate for the full year 2025. January is seasonally elevated due to\
    \ post-holiday remittance settlement and year-start salary payments. A full 2025 annualized\
    \ BSP data set would resolve this conflict, but it is not yet published as of the June\
    \ 2026 run date. Investors and analysts should therefore preserve these contradictions\
    \ as evidence of a rapidly evolving market with immature public data infrastructure,\
    \ rather than resolving them by picking a single 'consensus' number."
  claimRefs:
  - CM041
  - CM042
  - CM043
  - CM017
  - CM022

