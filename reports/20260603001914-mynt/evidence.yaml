evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-disclosure
    missingEvidence: A current Mynt board roster, committee structure, and disclosure of any independent directors or succession plan.
    whyItMatters: >-
      IPO readiness and governance quality cannot be judged confidently without knowing who actually controls the board
      and key committees.
    diligencePath: >-
      Obtain corporate secretary records, a draft prospectus, or board materials from management and compare them with
      shareholder-rights documents.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: standalone-financials
    missingEvidence: Standalone Mynt revenue, EBITDA, payments TPV, loan-book quality, and audited segment margins.
    whyItMatters: >-
      Public evidence proves strategic importance but not the full economics of payments versus lending versus wealth
      products, which are necessary for valuation and risk work.
    diligencePath: >-
      Request audited management accounts, lending-cohort data, and a bridge from Globe equity earnings to Mynt
      standalone financial statements.
    relatedQuestionRefs:
      - QO013
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: user-activity-definition
    missingEvidence: >-
      A reconciled breakdown of registered users, monthly active users, active merchants, and overseas-active cohorts,
      including metric definitions.
    whyItMatters: >-
      The 94M figure is powerful but can overstate engagement if the market confuses registrations with active
      monetizable users.
    diligencePath: >-
      Request internal KPI definitions and cohort tables from management, then reconcile them to any future IPO filing
      or analyst briefings.
    relatedQuestionRefs:
      - QO014
      - QO025
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-secondaries
    missingEvidence: >-
      The exact post-MUFG cap table, employee option pool, residual private-equity stakes, and any secondary
      transactions.
    whyItMatters: >-
      Residual ownership and secondary overhang can materially affect IPO float, governance control, and post-listing
      selling pressure.
    diligencePath: >-
      Obtain the shareholder register, latest capitalization table, and transaction history for any secondary transfers
      since the 2021 and 2024 rounds.
    relatedQuestionRefs:
      - QO010
      - QO025
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: blocking
    topic: GCash-market-share
    missingEvidence: >-
      GCash gross transaction value (GTV) by year, monthly active users (MAU) distinct from registered users, and
      take-rate by product line (payments, lending, wealth, insurance)
    whyItMatters: >-
      Without GTV or MAU, the SOM in the TAM/SAM/SOM analysis is unquantified; valuation multiples applied to market
      size are speculative without knowing GCash's actual share of the market it operates in
    diligencePath: >-
      Request management data room during IPO roadshow; alternatively, model using Globe equity income from Mynt and an
      estimated EBIT margin to back-solve a revenue/GTV figure
    relatedQuestionRefs:
      - QM026
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: >-
      Detailed methodology notes from e-Conomy SEA 2025 explaining the base population, FX assumptions, and instrument
      scope that produce the USD 125B GTV vs. BSP's USD 136B value figure for 2024
    whyItMatters: >-
      The USD 11B discrepancy (9% of the smaller figure) means the two most credible market size sources cannot be
      combined without an adjustment factor, reducing confidence in any single-point market size estimate
    diligencePath: >-
      Request full e-Conomy methodology appendix from Google/Bain; compare with BSP annual payment report footnotes on
      scope and currency conversion
    relatedQuestionRefs:
      - QM025
  - type: stale
    severity: material
    topic: financial-inclusion
    missingEvidence: >-
      BSP's own Financial Inclusion Survey results for 2024 and 2025, which were not yet published as of the June 2026
      run date; the World Bank Findex figure of 50.2% is the most recent public measure
    whyItMatters: >-
      The dip from 51.4% to 50.2% in account ownership may have reversed since 2024 given ongoing GCash acquisition
      programs, but confirmation requires BSP's survey
    diligencePath: >-
      Monitor BSP Financial Inclusion Report publication schedule; use BSP quarterly e-money data releases as interim
      proxy for mobile wallet issuance trends
  - type: enumeration-incomplete
    severity: minor
    topic: GCash-market-share
    missingEvidence: >-
      Full enumeration of Philippine e-wallet providers with transaction volume or GTV share, which would allow
      derivation of GCash's market share as a residual
    whyItMatters: >-
      GCash is assumed to be the market leader but competitors (Maya, ShopeePay, WeChat Pay, bank super-apps) are
      growing; market share could be eroding without a complete competitor GTV breakdown
    diligencePath: >-
      Search BSP e-money outstanding balances by issuer data published quarterly; cross-check with app download and
      usage data from Sensor Tower or App Annie
  - type: private-evidence-only
    severity: material
    topic: competitor-financial-comparison
    missingEvidence: Maya Bank's standalone P&L, loan book quality, and net interest margin are not publicly disclosed.
    whyItMatters: >-
      Without unit-level profitability and credit-quality data, the market cannot tell whether Maya balance-sheet
      strategy is economically superior or simply more visible.
    diligencePath: >-
      Request audited standalone financials, loan-book vintage curves, NPL ratios, and margin bridges for Maya Bank and
      any comparable Mynt banking entities.
    relatedQuestionRefs:
      - QP012
      - QP021
  - type: missing-source
    severity: material
    topic: market-share-quantification
    missingEvidence: >-
      No publicly available GTV or transaction-volume breakdown by wallet operator; GCash market share cannot be
      precisely quantified.
    whyItMatters: >-
      The competitive thesis depends on whether GCash user lead translates into transaction dominance and monetizable
      wallet balances, but public market-share math is incomplete.
    diligencePath: >-
      Request operator-level TPV, active-user, and merchant-volume disclosure directly from management and cross-check
      it against BSP rail-level data.
    relatedQuestionRefs:
      - QP009
      - QP021
  - type: enumeration-incomplete
    severity: material
    topic: competitor-enumeration
    missingEvidence: >-
      GrabPay and ShopeePay user counts for the Philippines are not publicly disclosed; their inclusion in TP001 relies
      on company-level figures rather than Philippines-specific counts.
    whyItMatters: >-
      The absence of country-specific user counts makes substitute-platform benchmarking incomplete and may understate
      or overstate adjacent checkout pressure.
    diligencePath: >-
      Seek Philippines-specific MAU, merchant, and checkout-penetration data for GrabPay and ShopeePay from company
      disclosures or industry data vendors.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: stale
    severity: minor
    topic: freshness
    missingEvidence: >-
      Competitive positioning data (user counts, savings rates) changes frequently; all figures should be refreshed at
      due-diligence time against the most recent company disclosures.
    whyItMatters: >-
      Fast-changing customer and pricing data can change the ordering of challengers even when structural conclusions
      stay intact.
    diligencePath: >-
      Re-check official rate cards, customer milestones, and BSP licensing status immediately before an investment
      committee decision.
    relatedQuestionRefs:
      - QP022
      - QP023
      - QP024
  - type: missing-source
    severity: material
    topic: unauthorized-deduction-incident
    missingEvidence: >-
      The retained source pack for this chapter does not include a confirmed direct article on the earlier
      unauthorized-deduction incident referenced in prior workups.
    whyItMatters: >-
      Trust incidents can alter stored-balance behavior, but without a retained direct source the incident cannot be
      analyzed to the same standard as the NPC probe.
    diligencePath: >-
      Pull the directly sourced incident article or regulator notice into the next refresh and map refund timing, user
      impact, and recurrence.
    relatedQuestionRefs:
      - QP020
  - type: private-evidence-only
    severity: blocking
    topic: standalone-audited-financials
    missingEvidence: Standalone audited FY2024-FY2025 Mynt income statement, balance sheet, cash-flow statement, and segment notes.
    whyItMatters: >-
      The current public record proves profit contribution to Globe but does not allow revenue-quality, margin, or
      cash-conversion underwriting at the Mynt entity level.
    diligencePath: >-
      Request the latest audited financial statements or near-final IPO draft financial section from management or
      bookrunners.
    relatedTableRefs:
      - TI004
      - TI005
  - type: conflicting-data
    severity: material
    topic: merchant-mdr
