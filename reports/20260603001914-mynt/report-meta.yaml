companyProfile:
  summary: >-
    Mynt is the holding company behind GCash, the Philippines’ largest finance super-app.
    Built through Globe Telecom, Ant Group, Ayala, and later MUFG backing, the company
    now sits at the center of Philippine consumer fintech with a broad surface spanning
    wallet payments, QR and transport use cases, youth and overseas onboarding, savings,
    lending, investments, insurance, merchant acceptance, and partner APIs. Globe’s
    disclosures show Mynt is already economically material rather than purely aspirational,
    but the company still withholds the standalone financial detail needed for full
    public-market underwriting.
