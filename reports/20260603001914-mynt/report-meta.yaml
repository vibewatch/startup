  productSummary: >-
    A finance super-app that combines wallet payments, transfers, bill pay, QR and tap-to-pay,
    consumer credit, savings, investments, insurance, merchant tools such as PocketPay and
    SoundPay, overseas remittance-linked workflows, and partner integration surfaces.
  customerFocus: >-
    Mass-market Filipino consumers, teens via GCash Jr, overseas Filipinos and remittance-linked
    households, public-market shoppers and commuters, MSME merchants and social sellers,
    and brands or enterprises using partner, identity, and merchant solutions.
  businessModel: >-
    Multi-rail fintech monetization built on wallet usage, merchant acceptance, credit products,
    savings and wealth distribution, insurance distribution, and partner or business services.
    Public sources reveal list pricing and product breadth but not the full realized revenue mix
    or segment gross margin.
  stage: Late-stage private / pre-IPO
