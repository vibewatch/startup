summary:
  headline: 继续研究：Mynt / GCash 是菲律宾具有系统重要性的 fintech，已经贡献真实利润，用户触达密集、产品线也宽；但在招股书级披露补上财务、信贷和留存缺口前，市场传闻的 IPO 估值区间偏高。
