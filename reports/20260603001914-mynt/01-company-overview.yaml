callouts:
- calloutType: strength
  title: Mynt is already strategically material to Globe, not an optional side bet
  body: 'The strongest evidence in the chapter is not the headline valuation but the earnings contribution: Globe says Mynt represented roughly 22% of pre-tax income in FY2025 and 30% in 1Q2026. That level of contribution means the franchise has already crossed from strategic experiment to earnings-critical platform.'
  claimRefs:
  - CO022
  - CO023
  - CO024
- calloutType: risk
  title: IPO ambitions now exceed public disclosure depth
  body: Mynt has a credible IPO-preparation trail — push-button-readiness language, a stock split, and Reuters-sourced filing plans — but the market still lacks a standalone P&L, current cap-table detail, full board disclosure, and headcount data. That gap can narrow once a prospectus is filed, but it remains a diligence handicap today.
  claimRefs:
  - CO013
  - CO014
  - CO032
  - CO033
  - CO034
  - CO040
- calloutType: risk
  title: Trust incidents matter more for a national finance super-app than for a pure software platform
  body: The 2024 refund incident, 2025 privacy probe, and 2026 anti-quishing campaign show that Mynt must keep earning trust under intense scrutiny. None of these incidents has yet proven franchise-breaking, but they reinforce that operational resilience and fraud controls are core diligence items, not hygiene details.
