  evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-disclosure
    missingEvidence: A current Mynt board roster, committee structure, and disclosure of any independent directors or succession plan.
    whyItMatters: IPO readiness and governance quality cannot be judged confidently without knowing who actually controls the board and key committees.
    diligencePath: Obtain corporate secretary records, a draft prospectus, or board materials from management and compare them with shareholder-rights documents.
    relatedQuestionRefs:
    - QO007
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: standalone-financials
    missingEvidence: Standalone Mynt revenue, EBITDA, payments TPV, loan-book quality, and audited segment margins.
    whyItMatters: Public evidence proves strategic importance but not the full economics of payments versus lending versus wealth products, which are necessary for valuation and risk work.
    diligencePath: Request audited management accounts, lending-cohort data, and a bridge from Globe equity earnings to Mynt standalone financial statements.
    relatedQuestionRefs:
    - QO013
    - QO025
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: user-activity-definition
    missingEvidence: A reconciled breakdown of registered users, monthly active users, active merchants, and overseas-active cohorts, including metric definitions.
    whyItMatters: The 94M figure is powerful but can overstate engagement if the market confuses registrations with active monetizable users.
    diligencePath: Request internal KPI definitions and cohort tables from management, then reconcile them to any future IPO filing or analyst briefings.
    relatedQuestionRefs:
    - QO014
    - QO025
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-secondaries
    missingEvidence: The exact post-MUFG cap table, employee option pool, residual private-equity stakes, and any secondary transactions.
    whyItMatters: Residual ownership and secondary overhang can materially affect IPO float, governance control, and post-listing selling pressure.
    diligencePath: Obtain the shareholder register, latest capitalization table, and transaction history for any secondary transfers since the 2021 and 2024 rounds.
    relatedQuestionRefs:
    - QO010
    - QO025
    relatedTableRefs:
    - TO003
