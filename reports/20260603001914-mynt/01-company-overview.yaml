- id: funding-ownership-profitability
  title: Funding, Ownership, and Earnings Significance
  body: 'The most important capital event in recent history is the August 2024 funding round that repriced Mynt to $5 billion. Ayala’s filing states that AC Ventures bought an additional ~8% stake for PHP22.4 billion, lifting Ayala’s ownership to ~13% and implying a PHP286.4 billion valuation; Reuters reported the same transaction at roughly $393 million and said MUFG would separately invest another $393 million for 8%. By February 2025, Inquirer and Fintech News Philippines reported that MUFG had completed its acquisition, cementing the $5 billion valuation. Reuters also reported the resulting ownership mix at roughly Globe 35%, Ant Group 34%, Ayala 13%, and MUFG 8%, with older private investors remaining in the residual.


    The strategic importance of Mynt inside Globe is also unusually visible for a private fintech. Globe’s filings show Mynt contributed PHP1.8 billion of equity earnings in 1Q2025, or 22% of Globe’s pre-tax income, rose to PHP6.1 billion for FY2025 while still representing about 22% of pre-tax income, and then reached 30% of pre-tax income in 1Q2026. That is a critical diligence point: Mynt is not just a strategic adjacency; it is already a major profit contributor to its largest corporate parent. Reuters further said Mynt broke even in 2H2021 and analysts expected it to supply about one-fifth of Globe’s 2024 earnings, which aligns directionally with the later Globe disclosures. The core tension is that Mynt is obviously profitable and strategically important, but the market still lacks a standalone public P&L, full cap table, or detailed economics for the lending and payments businesses.'
