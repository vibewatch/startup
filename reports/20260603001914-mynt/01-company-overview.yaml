- id: scale-product-breadth
  title: Scale, Product Breadth, and Distribution Reach
  body: 'Public disclosures show scale that is rare even by regional-fintech standards. BusinessWorld reported 94 million registered users across at least 16 markets in late 2025, while Globe’s 1Q2025 release said GCash had built a network of more than 6 million online and offline merchants and social sellers plus more than 1,000 merchant partners inside GLife. Globe’s 2025 and 2026 disclosures also show GCash’s international expansion: payments acceptance in more than 220 countries and territories and GCash Overseas access in 145 countries. Together these datapoints support the conclusion that GCash has both domestic ubiquity and meaningful cross-border utility, especially for overseas Filipinos.


    Product breadth is similarly wide. Globe’s filings and GCash’s own service pages confirm that CreditTech now includes GCredit, GLoan, GGives, and nano-credit products, while WealthTech includes GSave, GFunds/GInvest, GStocks, GCrypto, and GBonds; insurance is distributed through GInsure. Globe additionally says Mynt has already extended credit to millions of borrowers, most from lower socio-economic classes. This breadth strengthens the super-app thesis and partially explains why Mynt’s economics matter so much to Globe. The open diligence question is not whether the products exist; it is how profitable, sticky, and loss-efficient each layer is, because public sources still do not break out revenue, take-rate, loan losses, or active-user mix by product line.'
