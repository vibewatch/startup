summary:
  headline: >-
    Research more: Mynt / GCash is a systemically important Philippine fintech with real earnings contribution, dense
    customer reach, and broad product breadth, but the marketed IPO range is stretched until prospectus-grade disclosure
    closes the main financial, credit, and retention gaps.
