  topStrengths:
    - >-
      National-scale finance super-app with 94 million users, 6 million merchants and social sellers, and visible reach
      into payments, savings, credit, and merchant workflows.
    - >-
      Globe filings prove Mynt is already economically material, contributing about 22% of Globe pretax income in FY2025
      and about 30% in 1Q2026.
    - >-
      Product breadth extends beyond the wallet into youth, overseas, transport, public-market, merchant, and
      partner-API use cases, increasing habit and cross-sell potential.
    - >-
      Lending scale is real, with public evidence of PHP 362 billion of 2025 disbursements and third-party
      development-finance validation via ADB’s 2026 facility to Fuse.
  topRisks:
    - >-
      Standalone audited Mynt revenue, EBITDA, cash, and segment-margin disclosure are still absent, making valuation
      confidence materially lower than the IPO narrative implies.
    - >-
      Trust and support risk is persistent: public complaint channels cite lag, QR failures, verification delays,
      disputes, and scam-related anxiety, while no public status page or uptime SLA surfaced.
    - >-
      Credit-quality risk remains opaque despite lending scale because public sources do not disclose NPLs, charge-offs,
      provisioning, or funding-cost detail for Fuse.
    - >-
      Customer durability is denominator-poor: MAU, active merchants, churn, cohort retention, and top-customer or
      top-corridor concentration are not publicly disclosed.
    - >-
      The rumored IPO target of at least $8 billion materially exceeds the last closed $5 billion mark and therefore
      requires much stronger prospectus-grade evidence than is currently public.
  unresolvedGaps:
    - >-
      Audited FY2024-FY2025 standalone Mynt financial statements, including revenue, EBITDA, cash flow, and cash
      balance.
    - 'Fuse credit-quality pack: NPLs, charge-offs, provisioning policy, funding cost, and repeat-borrow cohorts.'
    - Active-user and active-merchant denominators behind the 94 million users and 6 million merchant headlines.
    - Top-10 concentration tables for merchants, partners, remittance corridors, and major customer channels.
    - Prospectus-grade cap-table, float, and preference disclosure for any eventual IPO process.
