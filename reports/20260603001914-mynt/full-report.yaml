      - number: '8.4'
        title: Scenario ranges, recommendation, and diligence thresholds
        blocks:
          - type: paragraph
            body: >-
              The practical investment question is not whether Mynt is a good company in the abstract, but whether the
              available public evidence is good enough to pay the rumored IPO price. On that test, the answer is no — at
              least not yet. The base case should stay anchored nearer the last observable $5 billion mark and only
              expand modestly for the stronger 2025–2026 earnings signals that Globe disclosed. A reasonable
              public-evidence band today is about $5.0 billion to $6.5 billion. The bull case of $8.0 billion to $9.0
              billion is real, but only if a prospectus shows strong standalone revenue scale, healthy credit quality,
              and durable profitability that can withstand public-market scrutiny. The bear case moves toward $4.0
              billion to $5.0 billion if timing slips, demand stays soft, or disclosed lending metrics disappoint.


              Accordingly, the chapter call is research-more at the marketed $8 billion valuation, with medium
              confidence and a stretched stance. If a transaction were available closer to the 2024 $5 billion anchor,
              the stance improves toward fair, but still not to a blind buy, because the biggest underwriting gaps
              remain unresolved: exact revenue and EBITDA, lending losses and funding costs, and the cap-table or
              preference position of new money. Investors should therefore treat IPO float-rule changes and bank
              mandates as logistics, not valuation proof, and make any decision contingent on prospectus-grade
              disclosure and clear thesis-break triggers.
            claimRefs:
