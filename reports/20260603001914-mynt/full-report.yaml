  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Earnings Contribution and Revenue Model
        blocks:
          - type: paragraph
            body: >-
              The strongest public financial anchor for Mynt is not a standalone income statement but its
              equity-accounted contribution to Globe Telecom. Globe disclosed that Mynt delivered ₱6.1 billion of equity
              earnings in FY2025, up 64% year on year and worth about 22% of Globe pretax income. In 1Q2026, Globe said
              Mynt contributed ₱1.9 billion, or roughly 30% of Globe pretax income, versus ₱1.8 billion and 22% a year
              earlier. Those figures make two points clear. First, Mynt is already a meaningful earnings engine inside
              the Globe group rather than a purely strategic optionality bet. Second, the market still sees that
              earnings power only through Globe’s equity share, not through a full Mynt P&L, which means investors still
              cannot observe consolidated revenue, margin, or cash conversion directly.


              Public product and fee disclosures imply a multi-rail monetization model. GCash monetizes wallet usage
              through bank-transfer, cash-in, cash-out, international-transfer, and merchant-payment rails; monetizes
              lending through GLoan and other credit products; and monetizes wealth and insurance indirectly through
              GFunds trust-fee economics and GInsure distribution partnerships. Independent news coverage adds scale
              context: Fuse disbursed ₱362 billion of loans in 2025 to more than 10.5 million unique borrowers, while
              GStocks PH reached 1.7 million registered users and GInsure sold 132.6 million policies. That product
              breadth supports the super-app thesis, but because realized take rates and segment revenue splits are
              undisclosed, the available evidence supports only a structural revenue map, not a clean revenue-mix
              forecast.
