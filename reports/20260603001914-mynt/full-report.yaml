  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The market GCash competes in is the Philippine retail digital payments and consumer digital financial
              services (DFS) ecosystem. The BSP tracks this using a narrow definition: monthly retail payment
              transactions originating from digital channels — predominantly e-wallets, account-to-account (A2A)
              transfers via InstaPay and PESONet, and QR-coded merchant payments (QR Ph). By this measure, digital
              transactions represented 57.4% of total monthly retail payment volume in 2024 and 59.0% by value, up from
              52.8% and 55.3% in 2023. The BSP 2024 Report records 5.8 billion total retail transactions in the year.
              Digital payment value as reported reached USD 136 billion, constituting 59.0% of the total retail payment
              value pool of approximately USD 230 billion.


              Included within this market boundary are: consumer peer-to-peer (P2P) transfers, person-to-merchant (P2M)
              payments, business-to-business (B2B) supplier payments, government-to-person and government-to-business
              disbursements, OFW remittance inflows converted into digital wallets, and adjacent digital financial
              products (credit, savings, wealth management, insurance) that ride the payments infrastructure. The three
              largest use cases — merchant payments (66.4% of digital volume), P2P transfers (20.6%), and B2B payments
              (6.2%) — together represent 93.2% of digital transaction volume. Government disbursements, while 97.2%
              digital in 2024, account for a modest share of total volume but are strategically important because they
              anchor mass adoption among beneficiaries.


              Excluded from the core market definition are traditional point-of-sale card swipes, paper checks, and ATM
              cash withdrawals — these three channels remain the principal status-quo substitutes. Cash dependency
              persists because 72% of Filipino households lacked fixed broadband in 2023, limiting reliable digital
              access. Physical remittance centers and pawnshops also serve as incumbent substitutes for OFW remittance
              corridors and micro-merchant credit. Adjacent markets include cross-border international remittance
              corridors ($38 billion in 2024), digital lending (USD 4 billion loan book in 2024), digital wealth
              management (USD 2 billion AUM), and nascent digital insurance (USD 0.1 billion annual premium).
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM036
