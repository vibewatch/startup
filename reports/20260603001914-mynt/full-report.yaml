chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Operating Structure, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Mynt is the Philippines-based fintech platform behind GCash and was formed in 2015 as a strategic
              partnership among Globe Telecom, Ayala Corporation, and Ant Financial/Ant Group. Rather than being a
              founder-led startup with a single product, Mynt is best understood as an embedded financial-services
              platform built atop Globe’s distribution and Ant’s fintech infrastructure. Globe’s 2026 disclosures
              describe Mynt as a financial-inclusion platform spanning payments, transfers, and digital financial
              services, while GCash’s own consumer surfaces show the app now bundles payments, savings, credit,
              investments, and insurance in one interface.


              Operationally, Mynt runs its core businesses through G-Xchange, Inc. (the regulated mobile-wallet operator
              behind GCash) and Fuse Financing Inc. (the lending arm), with recent Reuters-sourced IPO reports also
              mentioning Ryse as a wealth-technology business. This structure matters for diligence because the consumer
              brand is GCash, but the earnings, ownership, and IPO optionality sit at the Mynt holding-company level.
              Public materials consistently support the thesis that GCash is no longer just a wallet: it is a super-app
              with deep domestic payments ubiquity and an expanding menu of credit, wealth, and insurance products,
              which is why Mynt now functions as a national digital-finance platform rather than a single-feature app.
            claimRefs:
              - CO001
              - CO002
              - CO003
