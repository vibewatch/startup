      - number: '5.3'
        title: Integration Surface and Public Architecture
        blocks:
          - type: paragraph
            body: >-
              GCash does not publish a full internal runtime diagram, but it does expose enough public surface to infer
              the shape of its partner-facing architecture. The clearest evidence is the API Portal FAQ, which describes
              a centralized platform where partners discover, subscribe to, and manage API products with documentation,
              analytics, production and nonproduction environments, team ownership, and role-based access. That is more
              sophisticated than a static developer page: it implies cataloged products, approval states, credential
              issuance, and multi-organization access management. The Mini Program platform adds a second extensibility
              layer, saying developers create AXML, ACSS, and JS files that are compiled, packaged, signed, and served.
              Even without internal microservice details, those two surfaces confirm that GCash operates both API-based
              partner integration and in-app extensibility mechanisms.


              External gateway documentation makes the integration model more concrete. Adyen’s GCash docs require
              redirect-capable API-only flows and describe recurring payments through shopper tokens. 2C2P’s SDK docs
              show GCash as a distinct digital payment channel using token creation, payment requests, and redirect or
              external-app authentication responses. A public developer-signal proxy also exists: at a February 2025
              Java User Group Philippines meetup hosted at GCash, GCash engineers described using WireMock for
              performance testing and OpenAPI/schema-first automation for API development. The picture is specific
              enough to say GCash has real partner-integration tooling and disciplined API practices, but still
              incomplete on runtime stack, cloud topology, deployment cadence, and API adoption volumes.
