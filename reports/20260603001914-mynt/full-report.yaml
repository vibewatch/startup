        title: Exhibits
        blocks:
          - type: callout
            title: Mynt is already strategically material to Globe, not an optional side bet
            body: >-
              The strongest evidence in the chapter is not the headline valuation but the earnings contribution: Globe
              says Mynt represented roughly 22% of pre-tax income in FY2025 and 30% in 1Q2026. That level of
