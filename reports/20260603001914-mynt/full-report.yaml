      - number: '2.2'
        title: Market Sizing — Multiple Lenses and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >-
              Sizing the Philippine digital payments market requires reconciling at least two distinct methodologies
              that produce materially different numbers. The BSP 2024 Report pegs the digital payment value at USD 136
              billion (the 59.0% share of total retail payment value). The Google/Bain e-Conomy SEA 2025 report, using
              gross transaction value (GTV) including credit, debit, prepaid card, A2A, and e-wallet transactions,
              estimates the 2024 Philippine digital payments GTV at USD 125 billion. The same report projects USD 150
              billion for 2025 and USD 200–300 billion by 2030. The 2024 gap between the BSP figure (USD 136B) and
              e-Conomy (USD 125B) likely reflects definitional differences: BSP counts the retail subset of digital
              transactions within BSP-supervised financial institutions and electronic money issuers, while e-Conomy
              applies a GTV lens that may use different base populations or exchange-rate assumptions. Both figures
              confirm the market is large and growing; neither fully resolves the SAM boundary for an e-wallet operator
              like GCash.


              A third data point from Fintech Alliance/BSP for January 2026 shows P2.58 trillion (~USD 44 billion) in
              digital payments in a single month — up 43.1% year-on-year — with InstaPay at P1.24 trillion (+65.5%) and
              PESONet at P1.34 trillion (+27.1%). Annualizing January 2026 at P31 trillion per year (~USD 540 billion)
              dramatically exceeds both annual estimates above, which confirms that January is not representative
              (holiday spending, remittance flows, and year-start patterns inflate the month) and that annualizing a
              single month is an unreliable sizing lens.


              The broader digital financial services opportunity includes digital lending (USD 4B loan book, 2024),
              digital wealth/AUM (USD 2B, 2024), and digital insurance (USD 0.1B APE, 2024). Projecting to 2030,
              e-Conomy estimates lending reaches USD 10–12B, wealth reaches USD 20B, and the overall digital economy GMV
              reaches USD 70B (from USD 31B in 2024). These adjacencies represent additional monetization vectors for a
              super-app like GCash beyond pure payment GTV.
            claimRefs:
