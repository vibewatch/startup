  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Suite and User Segmentation
        blocks:
          - type: paragraph
            body: >-
              Official GCash surfaces present the product as a true finance super-app organized around six top-level
              pillars: Send, Pay, Borrow, Grow, Enjoy, and More. Under those pillars, the app exposes a far broader
              module map than a basic wallet competitor: Tap to Pay, Pay QR, Global Pay, Commute, Watch Pay, GCredit,
              GGives, GLoan, GSave, GInsure, GFunds, GStocks PH, GBonds, and GCrypto all appear in the public
              navigation. The About page adds scale signals that matter for product maturity: 94 million Filipinos have
              used GCash, more than 9 million have savings via GSave, 6 million merchants and social sellers operate on
              the app, and more than 3 million borrowers use GLoan, GGives, and GCredit. That breadth is meaningful
              because it lets the app move users from basic payment habit into credit, savings, and distribution
              products without leaving the ecosystem.


              The official onboarding surfaces also show deliberate segmentation rather than one-size-fits-all wallet
              design. GCash distinguishes among regular adult accounts, GCash Jr accounts for ages 7 to 17, and GCash
              Overseas for Filipinos using eligible foreign SIMs. Basic profiles start with a ₱10,000 wallet limit while
              fully verified users move to a ₱100,000 wallet limit after ID and selfie verification. GCash Jr extends
              the app to teens with shopping, load purchase, student deals, and a Visa card, while parents can link up
              to five junior accounts. GCash Overseas extends onboarding to 16 countries and supports international-SIM
              registration with a Philippine ID, plus free bills, load, and PH money transfers. The product definition
              is therefore not simply “wallet plus extras”; it is a family of profile-based workflows sharing a common
              app shell.
