  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Observable pricing anchors and IPO context
        blocks:
          - type: paragraph
            body: >-
              The cleanest public valuation anchor for Mynt remains the August 2024 Ayala transaction, not the 2026 IPO
              rumor mill. Ayala’s own filing said it bought an additional ~8% for about ₱22.4 billion, implying a
              company value of about ₱286.4 billion, or roughly $5 billion. That is important because it was a
              negotiated transaction between sophisticated parties and therefore a real arm’s-length price, even if it
              was not a public-market clearing event. In contrast, the 2026 IPO narrative is still indicative.
              Reuters-sourced Philippine coverage says Mynt is targeting at least an $8 billion valuation and around a
              $1 billion raise, with Citi, Jefferies, and UBS working on the process, but the same coverage also says
              timing, size, and valuation remain subject to market conditions and regulatory approvals.


              The public-float rule changes matter for feasibility, not intrinsic value. SEC rule changes lowered the
              minimum float for mega-listings, and Philippine commentary argues this helps Mynt avoid excessive
              dilution. Yet those same sources also warn that a traditional 20% float would have required a very large
              offering that local liquidity may not absorb well. That cuts both ways: lower float makes an IPO more
              mechanically feasible, but it does not prove that public investors will endorse an $8 billion price. In
              valuation terms, the rule change is contextual plumbing, not fair-value evidence.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV037
              - CV038
              - CV039
