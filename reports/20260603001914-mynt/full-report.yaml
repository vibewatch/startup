      - number: '6.4'
        title: Customer Verdict and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The customer verdict is positive on reach and use-case breadth, but only moderate on retention quality.
              Public sources make it hard to deny that GCash is deeply embedded in Philippine daily life: mass consumer
              payments, bill pay, market-vendor usage, transit, OFW remittance, youth wallets, MSME acceptance, and
              freelancer USD receipts are all visible. Customer-proof sources are real, not fabricated logos: Frank &
              Dean is named for PocketPay, Pine Labs is publicly integrated into merchant expansion, and Glean documents
              internal enterprise adoption. That is enough to conclude that GCash has many real customers and many real
              usage surfaces.


              What remains open is the committee-grade proof of durability: MAU, merchant actives, repeat-borrow rates,
              retention or churn by segment, top-customer concentration, remittance-corridor concentration, and
              support-resolution performance. Without those, the customer story remains reach-rich but denominator-poor.
              Before underwriting Mynt at any IPO valuation, the committee should demand active-user cohorts,
              active-merchant cohorts, support KPI trends, and partner/corridor concentration tables.
