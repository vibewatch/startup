      - number: '4.2'
        title: Pricing Architecture and Unit-Economics Proxies
        blocks:
          - type: paragraph
            body: >-
              GCash publishes far more list pricing than most private fintechs, but list pricing is not the same as
              realized monetization. The official fee schedule shows free peer-to-peer send money, ₱15 bank transfers,
              free offline cash-in up to ₱8,000 per month with a 2% fee above that threshold, 2% offline cash-out with
              most partners, 1% cash-in and 2% cash-out through GCash Pera Outlet, and 2% outbound international
              transfers subject to a ₱130 minimum and ₱1,200 maximum. On the credit side, GLoan advertises principal
              sizes from ₱500 to ₱150,000 and monthly interest of 1.59% to 6.99%. On the treasury side, GSave partner
              products span from 0.0925% annual interest at the low end to 4.0% for selected CIMB users, while GFunds
              charges no transaction fees but embeds annual trust fees of 0.50% to 1.75% into NAVPU. GInsure advertises
              entry pricing as low as ₱10 per month.


              Those disclosures make the consumer-side menu legible, but not necessarily the underlying unit economics.
              The public record still does not show realized merchant discount rates by segment, blended payment take
              rate, loan-loss-adjusted lending yield, or the economics Mynt retains from savings, insurance, and wealth
              distribution after partner sharing. Merchant pricing is the clearest example of the remaining uncertainty.
              The official business pages disclose onboarding requirements and service-level timelines, but not a single
              canonical official MDR table. Independent merchant guides conflict: one reports GCash Business QR Ph at
              2.5% plus ₱3 per transaction, while another reports QR Ph at 1.0% MDR and wallet acceptance at 1.0% to
              2.0%. That discrepancy is material, because even a 150-basis-point spread changes the gross-profit math of
              merchant acquiring.
