  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / signal
      - Transmission to thesis
      - Action implication
    rows:
      - - IPO timing slips materially
        - No definitive filing path after the expected 2026 window or repeated pushouts into 2027.
        - Weakens scarcity narrative and signals either market-demand or disclosure-readiness problems.
        - Do not pay a premium to the last observed private mark.
      - - Revenue support misses the implied hurdle
        - Prospectus revenue sits materially below what is needed to justify the marketed range on peer multiples.
        - Breaks the core case for paying $8B.
        - Reprice toward the base or bear range.
      - - Credit metrics disappoint
        - Prospectus or diligence shows weak NPLs, charge-offs, reserves, or funding costs in Fuse.
        - Undercuts the profitability bridge from Globe’s equity-share disclosures.
        - Treat lending as a discount, not a premium.
      - - Preference or dilution overhang is heavy
        - New investors or common holders sit behind a materially adverse preference stack or secondary-heavy structure.
        - Reduces real upside even if the headline valuation holds.
        - Model to proceeds-to-common before any participation.
      - - IPO demand is weak at the marketed price
        - Bookbuilding needs aggressive concessions, cornerstone dependence, or poor aftermarket support.
        - Shows that feasibility and fair value have diverged.
        - Wait for repricing or secondary-market price discovery.
    notes: >-
      Triggers are deliberately observable and price-sensitive; they focus on what would invalidate the current
      base-case valuation framework rather than on generic operating noise.
    claimRefs:
      - CV006
      - CV008
      - CV035
      - CV042
      - CV043
      - CV047
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Standalone audited financials
        - Exact FY2025 and 1Q26 revenue, EBITDA, net income, cash, and capital data.
        - This is the minimum package needed to test whether $5B or $8B is the right anchor.
        - Require prospectus draft or management data room with audited statements.
      - - Lending asset quality
        - NPLs, charge-offs, vintage curves, provisioning, recoveries, and funding costs for Fuse.
        - Lending can add or destroy value quickly depending on loss-adjusted returns.
        - Require credit tape, cohort analysis, and funding-stack disclosure.
      - - Segment economics
        - Revenue and gross or contribution margin split across payments, lending, wealth, and insurance.
        - A super-app valuation depends on which products generate the economics, not just on user breadth.
        - Request segment bridge in prospectus or banker deck.
      - - Cap table and preferences
        - Fully diluted ownership, primary vs secondary mix, preference stack, and any special rights.
        - Headline valuation can misstate upside if new money sits behind a complex stack.
        - Require legal cap-table summary and waterfall model.
      - - IPO demand and float assumptions
        - Cornerstone demand, expected free float, index-eligibility implications, and aftermarket stabilization plan.
        - Rule changes make the deal feasible, but the book must still clear.
        - Request syndicate feedback and bookbuilding framework.
      - - Regulatory exposure economics
        - Quantified impact of privacy, gaming-policy, and other compliance changes on growth and earnings.
        - Marketed valuation assumes regulation is manageable; that needs evidence, not hope.
        - Request management disclosure on affected revenue and remediation cost.
    notes: >-
      These asks are ordered by impact on fair-value confidence. Without the first four, the committee is still
      underwriting through a fog rather than through evidence.
    claimRefs:
      - CV046
      - CV047
      - CV048
      - CV049
      - CV050
