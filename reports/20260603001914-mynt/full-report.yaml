  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base and Segmentation
        blocks:
          - type: paragraph
            body: >-
              The official GCash customer base is unusually broad for a private fintech. The About page says 94 million
              Filipinos have used GCash, more than 9 million have savings via GSave, 6 million merchants and social
              sellers sit on the platform, and more than 3 million borrowers use GLoan, GGives, and GCredit. Those
              figures describe multiple different customer relationships rather than one homogeneous base: end users who
              pay and transfer, borrowers, savers, merchants, social sellers, and business partners. GCash also segments
              onboarding explicitly. Get Started docs separate regular adult users, GCash Jr users ages 7 to 17, and
              GCash Overseas users on eligible foreign SIMs. That matters because buyer, user, and payer roles differ
              across each path: a parent may sponsor a GCash Jr user, an OFW may fund a household wallet from abroad,
              and a sari-sari merchant may use GCash both to accept payment and to cash in or out.


              The platform’s geography and channel mix reinforce that segmentation. Official surfaces emphasize 200-plus
              countries and territories of usage, while Overseas pages and help docs show a more operational customer
              journey around foreign-SIM registration, PayPal or Payoneer cash-in, global remittance partners, bank
              transfer to Philippine banks, and free bill pay or load for the Philippines. Google Play’s customer-facing
              feature list also shows why GCash functions as a daily-use platform rather than a one-off remittance tool:
              400-plus billers, 70,000-plus QR or QRPh merchants, and broad wallet-to-credit-to-wealth cross-sell. The
              main segmentation gap is activity depth. Public sources prove reach, but not how many of the 94 million
              registered users are monthly actives, how many merchants are transacting regularly, or what share of usage
              is concentrated in a few corridors or categories.
