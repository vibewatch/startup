      - number: '2.3'
        title: Buyer and User Segmentation
        blocks:
          - type: paragraph
            body: >-
              The Philippine digital payments market encompasses at least five structurally distinct buyer segments,
              each with different budget ownership, adoption triggers, and switching costs. The Mass Urban Consumer —
              working-age adults in Metro Manila and secondary cities — is the incumbent GCash power user, drawn by
              app-native convenience for P2P transfers, online shopping checkout, and bills payment. This segment
              exhibits high stickiness because GCash balances serve as informal savings vehicles and GCredit provides
              instant revolving credit without a bank card.


              The Rural and Unbanked User segment is strategically important: 50.2% of Filipino adults aged 15 and above
              owned a formal financial account as of 2024, significantly below the BSP's own 70% target and the East
              Asia-Pacific average of 83.3%. Notably, account ownership actually declined by 1.2 percentage points
              between 2021 and 2024, suggesting that the post-pandemic registration surge has not converted to sustained
              habitual use. Among account holders, 28.8% hold mobile wallets and 32.7% hold digitally enabled accounts,
              showing that GCash's category is already the dominant account type among the newly included. Cash
              constraints and limited digital literacy remain adoption barriers in rural areas.


              Micro and small merchants represent a critical demand-side expansion: QR Ph merchant count grew 148.7% in
              2024, and the Paleng-QR Ph program had formally onboarded at least 180 LGUs nationwide by July 2025,
              covering public market vendors, sari-sari stores, and tricycle operators. GCash already serves over 6
              million merchants. The Overseas Filipino Worker (OFW) segment is distinct because they are payers, not
              receivers: GCash Overseas covers 145 countries, and the Philippines received USD 38 billion in remittances
              in 2024. MSMEs — employing over 60% of the Philippine workforce — represent the B2B and lending adjacency,
              where GCash can offer payroll disbursement, collections, and working capital through its Fuse Financing
              lending arm.
            claimRefs:
              - CM018
              - CM019
              - CM020
              - CM021
              - CM022
              - CM025
