  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Chain from observable price anchors, sponsor earnings evidence, disclosure gaps, and comp ranges to the current
      recommendation.
    data:
      nodes:
        - id: n1
          label: |-
            Last observable mark
            ~$5B strategic transaction
          type: strength
        - id: n2
          label: |-
            Globe earnings significance
            22% of FY2025 / 30% of 1Q26 pretax
          type: strength
        - id: n3
          label: |-
            Standalone financial opacity
            No exact public FY2025/1Q26 revenue or EBITDA
          type: risk
        - id: n4
          label: |-
            Credit opacity
            No exact public NPL, loss, or funding-cost data
          type: risk
        - id: n5
          label: |-
            Comp screen median
            ~3.3x market-cap / revenue
          type: neutral
        - id: n6
          label: |-
            IPO context
            Float rules help feasibility, not fair value
          type: neutral
        - id: n7
          label: |-
            Marketed price
            $8B–$9B requires stronger proof
          type: risk
        - id: n8
          label: |-
            Recommendation
            Research-more | Medium confidence | Stretched at $8B
          type: conclusion
    approximationNotes: >-
      This is a qualitative decision chain rather than a weighted scoring model. It isolates why observable positives
      are still outweighed by disclosure-dependent valuation risk.
