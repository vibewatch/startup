      - number: '1.5'
        title: IPO Readiness, Milestones, and Adverse Events
        blocks:
          - type: paragraph
            body: >-
              The evidence for IPO preparation is stronger than rumor but weaker than a filed prospectus. Globe’s
              January 2025 clarification letter said GCash wanted to be "push-button ready" for an IPO but had no
              material information to disclose regarding bank appointments. By October 2025, Mynt had obtained SEC
              approval for a stock split that increased common shares from 2.1 billion to 71.66 billion at a lower par
              value; both BusinessWorld and InsiderPH framed the move as a conventional pre-listing step, and Martha
              Sazon explicitly said the company had not yet filed anything. In May 2026, Reuters-sourced reports in
              BusinessWorld and Manila Times said Mynt was preparing to file as early as July 2026, was targeting at
              least an $8 billion valuation, and could raise about $1 billion. The picture, therefore, is of a company
              structurally preparing for listing while preserving timing flexibility.


              Against that positive optionality, GCash has also had to manage real operational and regulatory scrutiny.
              BSP said the November 2024 unauthorized-deduction incident was reported by G-Xchange as a system error and
              ordered refunds plus regular updates. In October 2025, the National Privacy Commission opened a probe into
              alleged leaked GCash data, while later statements cited by BusinessWorld and GCash said the exposed
              dataset did not appear to come from GCash systems. Philstar also reported a May 2026 anti-quishing
              crackdown on fake sites. None of these incidents invalidates the franchise, but they do remind investors
              that scaling a national finance super-app means sustaining trust under scrutiny, not just adding users or
              products.
