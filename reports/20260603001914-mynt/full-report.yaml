      - number: '3.4'
        title: Switching Costs and Network Effects
        blocks:
          - type: paragraph
            body: >-
              GCash's strongest competitive defense is still network-based rather than purely regulatory. A wallet with
              the broadest merchant acceptance, the most familiar consumer interface, and the largest installed user
              base becomes the default way to request payment, split bills, and keep day-to-day stored value. That is
              why GCash's merchant footprint matters so much: each new merchant makes the app more useful to consumers,
              and each new user makes the merchant decision to accept GCash more rational. This dynamic extends beyond
              QR counters into online checkout, micro-merchant collections, and in-app commerce surfaces. It also helps
              explain why challenger apps often need either a subsidy, a higher deposit yield, or a distinct
              physical-distribution angle to break habit.


              Still, not all switching costs are permanent. QR Ph interoperability reduces closed-loop acceptance
              advantage by making GCash and Maya codes cross-readable, so pure QR exclusivity is weaker than it once
              was. The more durable lock-in may come from data and workflow: repayment history that influences future
              credit access, wallet balances tied to recurring bills, remittance flows routed to a household's default
              app, and merchant integrations that connect one payment profile to a broader commerce journey. GoTyme's
              kiosk model lowers initial onboarding friction and makes multi-homing easier, but it does not
              automatically replicate GCash's embedded usage loops. In practice, users can add a second app, yet still
              keep one platform as their primary default if that platform owns the daily payment habit, the best-known
              contacts, and the financial history that matters for future product eligibility.
            claimRefs:
              - CP031
              - CP032
              - CP033
              - CP034
              - CP035
              - CP036
      - number: '3.5'
        title: Moat Durability and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              The durability question is whether GCash's scale advantage can keep compounding now that rivals
              increasingly own bank licenses and can capture balance-sheet economics directly. On that point, the most
              material structural gap is that Maya, GoTyme, and Tonik all compete with owned digital-bank products,
              while GCash's strongest public differentiators remain network scale, payments ubiquity, and breadth of
              embedded finance rather than a native BSP digital-bank license. If the category's center of gravity keeps
              shifting toward deposit monetization, underwriting, and interest-bearing balances, that asymmetry becomes
              more important. Regulation reinforces the point: the BSP has capped digital-bank licences at ten, which
              means scarce bank permissions can themselves function as a long-duration competitive asset.


              Adverse evidence also matters because trust is inseparable from fintech usage. The October 2025 NPC probe
              into an alleged GCash data leak did not prove that GCash systems were the source, but it still created a
              real confidence shock around data custody and response readiness. Separate reporting that BSP views
              cybersecurity as the main barrier to broader digital-payment adoption means security performance is not
              just a compliance burden; it is a competitive variable that can change user willingness to store balances
              or route higher-value activity through one platform. Public evidence does not yet prove that challengers
              have structurally dislodged GCash, but it does show a more credible challenger set than in prior years and
              leaves core underwriting questions unresolved because operator-level transaction volume, loan quality, and
              standalone profitability remain mostly private across the field.
            claimRefs:
