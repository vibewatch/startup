      - number: '1.2'
        title: Leadership, Governance, and Key-Person Dependence
        blocks:
          - type: paragraph
            body: >-
              The clearest public leadership signal is Martha Sazon’s role as President and CEO of Mynt. In 2024 and
              2025 disclosures around valuation and IPO preparation, Sazon framed management’s agenda around regulatory
              compliance, market-readiness, and operational readiness for capital markets. Reuters also identified
              Ernest Cu, then Globe Telecom CEO, as chair of Mynt during the company’s earlier IPO discussions,
              confirming that Globe remains deeply involved at the governance level rather than behaving as a purely
              passive shareholder. A November 2025 BusinessWorld spotlight also identifies Ren-Ren Reyes as President
              and CEO of G-Xchange, showing that the operating wallet business has a distinct executive lead beneath the
              holdco.


              What is notably absent is a full public board roster, disclosure on independent directors, or a current
              holdco-level executive bench beyond the top names surfaced in press coverage. For a company pursuing an
              IPO and claiming national-scale financial-inclusion importance, that governance opacity is material.
              Diligence should therefore treat management depth and board independence as open items rather than solved
              facts. The public evidence supports a capable and visible top layer, but it does not yet support a
              complete picture of succession depth, committee structure, or which shareholders dominate board control in
              practice.
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO042
