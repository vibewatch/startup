      - number: '3.2'
        title: Major Competitor Profiles
        blocks:
          - type: paragraph
            body: >-
              Maya is the most important direct rival because it already combines mass wallet distribution, a
              recognizable consumer brand, and an owned digital-bank balance sheet under one umbrella. Public reporting
              ties Maya Bank to rising deposits, an explicit path to profitability in 2026, and a depositor base that
              management still expects to expand materially. That makes Maya the clearest competitor for the thesis that
              Philippine wallet leaders should monetize payments through deposits, credit, and savings rather than
              payment fees alone. GoTyme is smaller in absolute scale, but its Gokongwei-Tyme partnership,
              kiosk-assisted onboarding, and retail-mall footprint give it a differentiated path into mainstream
              customers who may prefer a physical assist for account opening and card issuance.


              Coins.ph and Tonik matter for narrower but still important reasons. Coins.ph is not the broadest
              retail-finance super-app, yet it retains real relevance because it pairs a large registered base with
              crypto and digital-asset functionality that most banking-led rivals do not offer. Tonik is even more
              specialized: it is positioned as the first BSP digital bank and competes on savings economics instead of
              merchant reach. ShopeePay, now nested inside Sea's global Monee branding, remains strategically relevant
              as a checkout substitute inside a powerful commerce ecosystem, even though retained public evidence does
              not disclose Philippine user scale with enough precision to benchmark it against GCash or Maya. The
              practical takeaway is that Mynt does not face one monolithic rival; it faces a portfolio of challengers
              attacking different pieces of the value stack.
