      - number: '2.5'
        title: Sizing Diligence Gaps and Contradictory Estimates Preserved
        blocks:
          - type: paragraph
            body: >-
              Three categories of sizing gap constrain the precision of any GCash market analysis. First, GCash's own
              GTV is not publicly disclosed. Globe's quarterly reports reference Mynt's earnings contribution and user
              growth but do not break out gross transaction value, take-rate by vertical, or active monthly users versus
              registered users. The 94 million registered user figure, if taken at face value against the World Bank
              Findex estimate that only ~10.5 million Filipino adults hold mobile wallets (28.8% of 36.6 million account
              holders), implies a 9:1 gap between GCash's registration count and the Findex's adult mobile wallet
              population — almost certainly reflecting dormant accounts, underage users, or definitional differences.
              Without active user data, SOM estimation is speculative.


              Second, the BSP digital payments share (57.4% of volume, 59.0% of value) and the e-Conomy SEA GTV
              estimates (USD 125B for 2024 vs USD 136B per BSP) diverge by USD 11 billion. The methodological notes in
              e-Conomy acknowledge that their GTV includes credit and debit card transactions in addition to
              A2A/e-wallet flows, whereas BSP may use a different base for 'retail payments.' This incompatibility means
              that combining both sources without adjustment will overstate or understate market size depending on which
              figure is used as the base.


              Third, the January 2026 BSP monthly figure (P2.58 trillion) annualizes to roughly USD 540 billion, which
              is 3–4x the e-Conomy GTV estimate for the full year 2025. January is seasonally elevated due to
              post-holiday remittance settlement and year-start salary payments. A full 2025 annualized BSP data set
              would resolve this conflict, but it is not yet published as of the June 2026 run date. Investors and
              analysts should therefore preserve these contradictions as evidence of a rapidly evolving market with
              immature public data infrastructure, rather than resolving them by picking a single 'consensus' number.
            claimRefs:
              - CM041
              - CM042
              - CM043
              - CM017
              - CM022
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The 94M User Paradox — Registration vs. Active Use
            body: >-
              GCash's reported 94 million registered users sits in uncomfortable tension with the World Bank Findex 2025
              estimate that only about 10.5 million Filipino adults hold mobile wallet accounts (28.8% of the 36.6
              million with any financial account). The 9:1 ratio almost certainly reflects dormant accounts,
              registrations by individuals under 15, and definitional gaps — but the chasm is large enough to matter for
              active-user-based valuation. Without a disclosed monthly active user (MAU) figure, the SOM and
              engagement-depth assumptions in any GCash financial model are inherently speculative.
            calloutType: risk
            claimRefs:
              - CM021
              - CM023
              - CM018
              - CM041
          - type: callout
            title: 'Market Shape: Digital Payments Are Already Mass-Market, DFS Adjacencies Are Not'
            body: >-
              The BSP data confirms that digital payments themselves are no longer a niche: 57.4% volume share in 2024,
              government transactions at 97.2%, individual transactions at 72.2%. The scarcity premium for GCash now
              comes from the DFS adjacencies — credit, savings, wealth, insurance — where digital penetration is still
              low (USD 4B lending, USD 2B wealth AUM vs. a USD 150B payments market). This creates a barbell
              opportunity: payments provide distribution scale; DFS products provide margin.
            calloutType: insight
            claimRefs:
              - CM001
              - CM014
              - CM015
              - CM038
              - CM039
          - type: callout
            title: Connectivity Gap Limits TAM Realization
            body: >-
              72% of Filipino households lacking fixed broadband as of 2023 is not merely an infrastructure footnote —
              it directly caps the conversion of the 49.8% unbanked adult population into active digital payers. Mobile
              data fallback helps but is unreliable and expensive in rural areas. The World Bank DPL explicitly targets
              connectivity as the first use-case block. Until broadband coverage meaningfully improves, any market
              projection that models rural adoption on current urban trajectories will overstate the near-term TAM.
            calloutType: risk
            claimRefs:
              - CM029
              - CM021
              - CM028
          - type: callout
            title: BSP 2028 Target as the Policy-Bound Ceiling
            body: >-
              The analysis treats the BSP 60–70% digital payment share target for 2028 as the regulatory ceiling for the
              medium-term adoption trajectory. This is an assumption: regulators can accelerate with enforcement (e.g.,
              mandatory digital payroll, government e-payments mandates) or the target could be revised upward if
              adoption exceeds expectations. Investors should model both a base case (gradual linear improvement from
              57.4% to 65%) and an upside case (regulatory push reaches 70% by 2027), as the gap between these scenarios
              drives meaningful differences in GCash GTV forecasts.
            calloutType: assumption
            claimRefs:
              - CM026
              - CM001
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Philippine digital finance is no longer a simple wallet land-grab. By June 2026, the competitive field
              clusters into at least three visible tiers: super-app wallets with adjacent DFS layers, licensed digital
              banks trying to own deposits and credit economics, and adjacent checkout or crypto-led apps that compete
              for specific payment moments without matching full product breadth. GCash still sits at the top of the
              field on user scale and merchant ubiquity, with 94 million registered users and a large merchant
              footprint, but the market is no longer defined by onboarding alone. Maya has paired its wallet with an
              owned digital-bank stack, GoTyme has used a branch-lite kiosk model to accelerate onboarding, Coins.ph
              remains relevant in crypto-linked payments, and Tonik competes by using high-yield deposits to attract
              wallet-adjacent balances.


              The regulatory backdrop explains why the chapter matters. BSP has six active digital-bank licensees and
              reopened the licensing window in 2024 while capping the market at ten licensees, which means the most
              credible challengers now have room to combine payment rails with deposit, lending, and savings economics.
              At the same time, BSP's own e-payments report shows that digital payments already account for most
              Philippine retail-payment volume and value, with QR Ph merchant growth still compounding quickly. That
              combination pushes the contest away from pure QR acceptance and toward who can monetize balances,
              underwrite credit, retain remittance flows, and sustain trust as the category scales.
            claimRefs:
              - CP001
              - CP002
              - CP003
