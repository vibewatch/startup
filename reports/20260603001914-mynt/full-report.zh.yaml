      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              2024 年 Ayala / MUFG 交易和 2026 年 IPO 报道，共同勾勒 Mynt 的资本故事。Ayala 披露，其 2024 年 8 月以 ₱22.4 billion 二级购买 Mynt 约 8%
              股权，把公司估值定在约 ₱286.4 billion，约 $5 billion，并把 Ayala 持股提升至约 13%。2026 年 5 月 Reuters 来源报道称，Mynt 目标 IPO 估值至少 $8
              billion，可能募资约 $1 billion，最早 2026 年 7 月提交申请，Citi、Jefferies 和 UBS 已参与推进。与此同时，Globe CFO Juan Carlo Puno
              明确表示，时间安排尚无官方决定，公司仍对多种资本方案保持开放；这意味着 IPO 仍是一个选项，而非已承诺的融资事件。


              更近端的资本信号是 2026 年 2 月 ADB 向 Fuse 提供的贷款额度。ADB 签署 $30 million 贷款（约 ₱1.75 billion）支持 MSME 放贷，其中 60%
              指定用于女性拥有企业，还提供最高 $125,000 技术援助和 $150,000 Mastercard Impact Fund 激励。相对于 Mynt
              隐含估值，这笔额度经济规模不大，但战略意义重要：它验证承销质量，降低部分贷款簿的资金集中风险，也说明 Mynt 能在上市前吸引使命驱动型债务资本。母公司支持也重要。Globe 报告 FY2025
              自由现金流为正，capex 为 ₱46.2 billion，低于其低于 $1 billion 的指引；FY2025 和 1Q2026 债务指标均在契约范围内。这不能证明 Globe 会无限期资助
              Mynt，但确实表明，在 IPO 窗口仍属可选时，Mynt 背后有一个仍具资产负债表能力的支持方。
