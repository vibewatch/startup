      - number: '8.2'
        title: Globe 经济性证明了什么，又没有证明什么
        blocks:
          - type: paragraph
            body: >-
              Globe 披露确实证明 Mynt 在经济上是真实的。Globe 报告 FY2025 来自 Mynt 的权益收益为 ₱6.1 billion，相当于税前收入约 22%；1Q26 为 ₱1.9
              billion，相当于税前收入约 30%。这比单纯用户增长叙事强得多：Mynt 已大到能影响上市母公司的盈利结构。后续报道还显示，外部分析师越来越把 GCash 视为 Globe
              估值中有意义的一部分，而不是旁注。这支持了一个投资逻辑：特许经营权具备真实利润能力，2024 年 $5 billion 标记并非明显幻想定价。


              但同一证据不应被过度解读。Globe 只报告其权益份额，没有报告 Mynt 完整经审计利润表、资产负债表或贷款账簿质量。公开来源仍未披露准确的 FY2025 或 1Q26 独立收入和 EBITDA，也未披露为
              Fuse 估值所需的当前 NPL、核销、资金成本和资本指标。因此，权益份额经济性验证的是重要性，不是充分性。它告诉委员会 Mynt 值得认真看；它没有告诉委员会公开市场投资人到底应该为它支付什么倍数。
