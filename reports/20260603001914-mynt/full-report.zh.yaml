  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 独立审计财务
        - 准确的 FY2025 和 1Q26 收入、EBITDA、净利润、现金和资本数据。
        - 这是判断 $5B 还是 $8B 更适合作为锚点的最低资料包。
        - 要求提供招股书草案，或含审计报表的管理层数据室。
      - - 贷款资产质量
        - Fuse 的 NPL、核销、贷款批次曲线、拨备、回收和资金成本。
        - 贷款业务会快速增值或毁值，取决于经损失调整后的回报。
        - 要求提供信贷明细、队列分析和资金堆叠披露。
      - - 分部经济性
        - 支付、贷款、财富和保险的收入及毛利率或贡献利润率拆分。
        - 超级应用估值取决于哪些产品贡献经济性，而不只是用户覆盖广度。
        - 要求招股书或银行家材料提供分部桥接。
      - - 股权结构表与优先权
        - 完全摊薄持股、新股与老股组合、优先股堆叠和任何特殊权利。
        - 如果新资金排在复杂堆叠之后，名义估值会误报上行。
        - 要求提供法律版股权结构摘要和瀑布模型。
      - - IPO 需求和流通股假设
        - 基石需求、预期自由流通股、指数纳入影响和上市后稳定计划。
        - 规则变化让交易可行，但订单簿仍必须清盘。
        - 要求承销团反馈和簿记框架。
      - - 监管敞口经济性
        - 隐私、游戏政策和其他合规变化对增长和盈利的量化影响。
        - 营销估值假设监管可控；这需要证据，不是希望。
        - 要求管理层披露受影响收入和整改成本。
    notes: 这些要求按对公允价值信心的影响排序。没有前四项，委员会仍是在雾中承销，而不是基于证据承销。
