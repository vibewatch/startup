      - number: '5.2'
        title: 商户与企业工作流
        blocks:
          - type: paragraph
            body: >-
              GCash 的企业产品集不只是简单的商户 QR 收款。官方企业页面面向企业、MSME、公共部门和 sari-sari 小店用户，MSME 套餐页展示了三层升级路径：Starter（最高 ₱250,000
              钱包）、Premium（最高 ₱5 million）和 Pro（无限钱包）。这套餐结构说明，Mynt
              不只按收款能力产品化商户，也按交易规模、报表和出款复杂度分层。公开文案承诺，接收客户无现金付款时无钱包限额，向供应商无现金付款时不收交易费；如果按文案落地，小商户从非正式现金处理迁移时的流程摩擦会降低。


              近期设备和工作流发布延伸了这套运营模式。PocketPay 把 Android 智能手机变成可收卡的 NFC POS 设备，SoundPay 则提供带语音确认的便携 QR 收款。发布报道一贯把 PocketPay
              定位给移动卖家、快闪商户和难以承担传统硬件的 MSME。BusinessWorld 和 Philstar 的赞助报道还显示，公司正通过 Virtual US Account
              把业务从国内商户收单推向自由职业者和跨境收款工作流；该账户由 Meridian1 提供支持，仅限完全认证用户，且明确不受存款保险保障。这些发布说明，产品组织越来越以工作流为原生设计：消费者钱包、青少年钱包、OFW
              钱包、商户 POS 和自由职业者应收款，是相邻但不同的用户旅程。
