      - number: '5.3'
        title: 集成界面与公开架构
        blocks:
          - type: paragraph
            body: >-
              GCash 没有发布完整内部运行时架构图，但公开界面足够推断其面向合作伙伴的架构形态。最清晰的证据是 API Portal FAQ：它描述了一个集中式平台，合作伙伴可在其中发现、订阅和管理 API
              产品，并使用文档、分析、生产和非生产环境、团队归属及基于角色的访问控制。这比静态开发者页面更复杂，意味着产品目录、审批状态、凭证发放和多组织访问管理。Mini Program
              平台增加了第二层可扩展性，称开发者创建的 AXML、ACSS 和 JS 文件会被编译、打包、签名和分发。即便没有内部微服务细节，这两个界面也确认 GCash 同时运营基于 API
              的合作伙伴集成，以及应用内扩展机制。


              外部网关文档让集成模型更具体。Adyen 的 GCash 文档要求仅 API 流程具备重定向能力，并描述通过 shopper token 实现循环付款。2C2P 的 SDK 文档把 GCash
              列为独立数字支付渠道，使用 token 创建、付款请求，以及重定向或外部应用认证响应。公开的开发者信号也存在：在 2025 年 2 月由 GCash 主办的 Java User Group Philippines
              meetup 上，GCash 工程师介绍了用 WireMock 做性能测试，以及用 OpenAPI/schema-first 自动化做 API 开发。现有图景已经具体到可以判断 GCash
              拥有真实的合作伙伴集成工具和有纪律的 API 实践，但在运行时技术栈、云拓扑、部署节奏和 API 采用量上仍不完整。
