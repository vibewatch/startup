        blocks:
          - type: paragraph
            body: >-
              GCash 最强的竞争防线仍来自网络，而不是纯监管。一个拥有最广商户受理、最熟悉消费者界面和最大装机用户基础的钱包，会成为请求付款、分摊账单和保存日常余额的默认方式。因此，GCash
              的商户足迹极其重要：每新增一个商户，App 对消费者更有用；每新增一个用户，商户接受 GCash 的决定更理性。这种动态不止发生在 QR 柜台，也延伸到线上结账、微商户收款和 App
              内商业界面。它也解释了为什么挑战者 App 往往需要补贴、更高存款收益，或独特线下分销角度，才能打破习惯。


              但并非所有转换成本都永久存在。QR Ph 互操作让 GCash 和 Maya 码可以交叉读取，降低了闭环受理优势，纯 QR
              独占性已经弱于过去。更耐久的锁定可能来自数据和工作流：影响未来信贷准入的还款历史、绑定经常性账单的钱包余额、进入家庭默认 App 的汇款流，以及把一个支付画像接到更广商业旅程的商户集成。GoTyme
              的自助终端模式降低初始开户摩擦，也让多 App 并用更容易，但它不会自动复制 GCash 嵌入式使用循环。现实中，用户可以加第二个
              App；但如果一个平台掌握日常支付习惯、最熟悉联系人和影响未来产品资格的金融历史，用户仍会保留它作为主要默认平台。
            claimRefs:
              - CP031
              - CP032
              - CP033
              - CP034
              - CP035
              - CP036
      - number: '3.5'
        title: 护城河耐久性与反向证据
        blocks:
          - type: paragraph
            body: >-
              耐久性问题在于：当竞争者越来越多拥有银行牌照、能直接捕获资产负债表经济性时，GCash 的规模优势能否继续复合。在这一点上，最关键的结构缺口是 Maya、GoTyme 和 Tonik 都用自有数字银行产品竞争；而
              GCash 最强的公开差异点仍是网络规模、支付普及度和嵌入式金融宽度，不是原生 BSP 数字银行牌照。如果品类重心继续转向存款变现、承销和付息余额，这种不对称会更重要。监管进一步强化了这一点：BSP
              把数字银行牌照上限设为 10 张，稀缺银行许可本身就能成为长周期竞争资产。


              反向证据同样重要，因为信任与金融科技使用不可分割。2025 年 10 月 NPC 对 GCash 数据疑似泄露展开调查，虽未证明 GCash
              系统是来源，但仍围绕数据托管和响应准备造成真实信心冲击。另有报道显示，BSP
              把网络安全视为数字支付更广泛采用的主要障碍；这意味着安全表现不只是合规负担，而是竞争变量，会改变用户把余额存放在某个平台、或把更高价值活动经由某个平台完成的意愿。公开证据尚未证明挑战者已经结构性撼动
              GCash，但确实显示挑战者阵容比往年更可信；同时，运营商层面的交易量、贷款质量和独立盈利能力在整个领域大多仍是私有信息，核心承销问题仍未解决。
