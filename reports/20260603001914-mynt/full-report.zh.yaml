              - CM039
          - type: callout
            title: 连接缺口限制 TAM 兑现
            body: >-
              截至 2023 年，72% 菲律宾家庭缺少固定宽带，这不只是基础设施脚注——它直接限制 49.8% 未开户成年人转化为活跃数字支付者。移动数据兜底有帮助，但在农村地区不可靠且昂贵。World Bank DPL
              明确把连接性列为第一个用例堵点。宽带覆盖显著改善之前，任何把农村采用按当前城市轨迹建模的市场预测，都会高估近期 TAM。
            calloutType: risk
            claimRefs:
              - CM029
              - CM021
              - CM028
          - type: callout
            title: BSP 2028 目标是政策约束下的天花板
            body: >-
              本分析把 BSP 2028 年 60–70%
              数字支付占比目标，视为中期采用轨迹的监管天花板。这是一个假设：监管方可以通过强制执行加速（例如强制数字工资、政府电子支付授权），也可能在采用超预期时上调目标。投资者应同时建模基准情景（从 57.4%
              逐步线性改善到 65%）和上行情景（监管推动到 2027 年达到 70%），因为两种情景之间的差距会显著改变 GCash GTV 预测。
            calloutType: assumption
            claimRefs:
              - CM026
              - CM001
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              菲律宾数字金融已不再是简单的钱包圈地战。到 2026 年 6 月，竞争场至少聚成三个可见层级：带 DFS 邻近层的超级 App
              钱包、试图掌握存款和信贷经济性的持牌数字银行，以及在特定支付时刻竞争但产品宽度不足的结账或加密资产主导型 App。GCash 仍凭用户规模和商户普及度处在前列，拥有 94 million
              注册用户和庞大商户足迹；但市场已不再只由开户定义。Maya 把钱包与自有数字银行栈配在一起，GoTyme 用轻网点自助终端模式加速开户，Coins.ph 仍在加密资产支付中保持存在感，Tonik
              则用高收益存款吸引钱包邻近余额。


              监管背景解释了本章为何重要。BSP 现有六家活跃数字银行持牌机构，并在 2024 年重开牌照窗口，同时把市场上限设为 10
              家持牌机构。这意味着最可信的挑战者现在有空间把支付轨道与存款、借贷和储蓄经济性结合起来。与此同时，BSP 自身电子支付报告显示，数字支付已占菲律宾零售支付交易量和金额的大多数，QR Ph
              商户增长仍在快速复合。这个组合把竞争从单纯 QR 受理推向更深的问题：谁能变现余额、承销信贷、留住汇款流，并在品类扩张时守住信任。
