  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 当前判断依据
      - 什么会改变判断
    rows:
      - - 建议
        - 继续研究
        - 公开证据支持 Mynt 是真实盈利资产，但还不足以承销 $8B IPO。
        - 达到招股书级别的独立收入、EBITDA、信用质量和股权结构条款披露。
      - - 信心
        - 中
        - 可观察锚点已经存在，但关键价值驱动仍只通过 Globe 和市场评论间接披露。
        - 经审计的独立 FY2025 和 1Q26 财务数据，以及更清晰的 IPO 结构。
      - - 风险评级
        - 高
        - 主要风险不是业务无关紧要，而是在披露不完整时估值冲得过高。
        - 公开申报文件显示收入规模、亏损水平可控和稀释可控。
      - - 估值立场
        - $8B 偏高；接近 $5B 更接近合理
        - 2024 年 $5B 标记可观察；2026 年 $8B 说法仍有条件，也尚未定价。
        - 已提交的招股书能证明同业倍数所需的收入和利润水平。
      - - 决策含义
        - 基于当前公开证据，不要按高于营销区间的价格承销
        - 可行性和流通股规则放宽，不能替代公允价值支撑。
        - 只在硬披露落地后介入，或等定价更接近上一次公平交易标记。
    notes: 该评估明确对价格敏感：它区分上一次可观察的 2024 年战略投资标记和仍未定价的 2026 年 IPO 目标，并把可行性变化与公允价值证明分开处理。
