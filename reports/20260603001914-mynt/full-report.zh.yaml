chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、运营结构与商业模式
        blocks:
          - type: paragraph
            body: >-
              Mynt 是总部位于菲律宾的金融科技平台，承载 GCash，2015 年由 Globe Telecom、Ayala Corporation 和 Ant Financial/Ant Group
              战略合作成立。它不是单一产品、创始人主导的创业公司；更准确地说，Mynt 是嵌在 Globe 渠道和 Ant 金融科技基础设施之上的金融服务平台。Globe 2026 年披露把 Mynt
              描述为覆盖支付、转账和数字金融服务的普惠金融平台；GCash 自身消费端界面也显示，App 已把支付、储蓄、信贷、投资和保险装进同一入口。


              运营上，Mynt 通过 G-Xchange, Inc.（GCash 背后的受监管移动钱包运营方）和 Fuse Financing Inc.（放贷主体）承载核心业务；近期 Reuters 来源的 IPO 报道还提到
              Ryse 作为财富科技业务。这套结构很关键：消费者品牌是 GCash，但收益、股权和 IPO 可选性在 Mynt 控股公司层面。公开材料一致支撑一个判断：GCash 已不只是钱包，而是一个超级
              App，国内支付渗透很深，信贷、财富和保险菜单仍在扩张。因此，Mynt 现在更像国家级数字金融平台，而不是单功能 App。
