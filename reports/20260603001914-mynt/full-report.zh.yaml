      - number: '1.3'
        title: 融资、所有权与盈利重要性
        blocks:
          - type: paragraph
            body: >-
              近期最重要的资本事件，是 2024 年 8 月融资轮把 Mynt 重新定价到 $5 billion。Ayala 文件称，AC Ventures 以 PHP22.4 billion 追加买入约 8% 股权，把
              Ayala 持股提升至约 13%，隐含 PHP286.4 billion 估值；Reuters 报道同一交易约为 $393 million，并称 MUFG 将另行投资 $393 million 取得 8%。到
              2025 年 2 月，Inquirer 和 Fintech News Philippines 报道 MUFG 已完成收购，锁定 $5 billion 估值。Reuters 还报道，交易后股权结构约为 Globe
              35%、Ant Group 34%、Ayala 13%、MUFG 8%，较早期私募投资者持有剩余部分。


              Mynt 在 Globe 内部的战略重要性，对一家私营金融科技公司来说也异常清楚。Globe 文件显示，Mynt 在 1Q2025 贡献 PHP1.8 billion 权益收益，相当于 Globe 税前利润的
              22%；FY2025 升至 PHP6.1 billion，仍约占税前利润 22%；1Q2026 又达到税前利润 30%。这是关键尽调点：Mynt
              不只是战略邻近业务，而是最大企业母公司已经离不开的主要利润贡献者。Reuters 还称，Mynt 在 2H2021 实现盈亏平衡，分析师预期其贡献约五分之一的 Globe 2024 年收益，这与后续 Globe
              披露方向一致。核心张力在于：Mynt 显然已盈利且战略重要，但市场仍看不到独立公开 P&L、完整股权结构表，或放贷和支付业务的详细经济模型。
