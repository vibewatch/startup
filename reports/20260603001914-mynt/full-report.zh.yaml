      - 因素
      - 方向
      - 时间
      - 机制
      - 尽调问题
    rows:
      - - BSP 2028 目标（数字化占比 60–70%）
        - 驱动
        - 2024–2028
        - 监管目标带来政策顺风；BSP 工具包括互操作规则、申诉救济标准、Paleng-QR
        - 哪些 BSP 增量执行工具会加速采用？
      - - QR Ph 商户铺开（2024 年 +148.7%）
        - 驱动
        - 当前 / 持续
        - 商户侧受理堵住现金回退路径；Paleng-QR 增加 180 个 LGU 市场
        - 核验 QR Ph 活跃交易量与被动受理点数量的差距
      - - World Bank USD 750M DPL（Nov 2024，政策贷款）
        - 驱动
        - 2025–2027
        - 贷款支持宽带扩张、安全 DFS 基础设施和电商信任建设；降低结构性障碍
        - 跟踪拨款里程碑和连接覆盖改善
      - - 数字银行竞争（上限提高至 10 家）
        - 驱动 + 约束
        - 2024–2026
        - 新进入者扩大市场，也挤压 GCash 定价和功能差异化
        - 跟踪新牌照申请，以及新银行瞄准哪些客群
      - - 72% 家庭缺乏固定宽带
        - 约束
        - 持续存在
        - 农村数字交易可靠性低；移动数据兜底成本高且覆盖不稳
        - 按地区看 PSA 互联网渗透率数据，并与 GCash 农村交易占比对比
      - - 网络安全和欺诈风险（BSP 已提示）
        - 约束
        - 持续
        - 消费者信任是最常被提到的障碍；诈骗事件削弱习惯性采用；RA 12010 作出回应，但合规成本上升
        - 衡量退款 / 争议解决时长与 BSP Circular 1195 要求的差距
      - - 金融账户拥有率下滑（50.2%，−1.2pp）
        - 约束
        - 2021–2024
        - 注册不等于活跃使用；经济压力和非正规就业妨碍持续使用
        - 索取 GCash 月活用户数据；与 94M 注册用户对比，估算流失和休眠
      - - 缺失直接借记基础设施
        - 约束
        - 近期缺口
        - 经常性付款（保险、贷款还款、订阅）需要直接借记，但该能力尚未上线
        - BSP 直接借记设施上线时间表；对 GCash 贷款和保险产品粘性的影响
    notes: >-
      方向标签：驱动 = 推动采用；约束 = 放慢采用；驱动 + 约束 = 两种作用同时存在。时间按来源日期近似判断。尽调问题是研究层面的问题，不是已验证事实。BSP Circular 1195 合规成本由
      BusinessWorld（Dec 2024）做定性报道。
