      - number: '6.4'
        title: 客户结论与尽调要求
        blocks:
          - type: paragraph
            body: >-
              客户结论是：覆盖面和使用场景广度为正面，留存质量只能算中等。公开来源让人很难否认 GCash 已深度嵌入菲律宾日常生活：大众消费者支付、缴费、市场摊贩使用、交通、OFW 汇款、青少年钱包、MSME
              收单和自由职业者美元收款都可见。客户证明也是真实的，而不是拼出来的 logo：Frank & Dean 与 PocketPay 具名关联，Pine Labs 公开接入商户扩张，Glean
              记录了内部企业采用。这足以得出结论：GCash 有大量真实客户和大量真实使用场景。


              仍未解决的是委员会级别的持久性证明：MAU、活跃商户、重复借款率、按分部划分的留存或流失、头部客户集中度、汇款走廊集中度，以及支持解决表现。缺少这些，客户故事依然是覆盖面丰富、分母贫乏。在以任何 IPO 估值承销
              Mynt 前，委员会应要求活跃用户队列、活跃商户队列、支持 KPI 趋势，以及合作伙伴 / 走廊集中度表。
