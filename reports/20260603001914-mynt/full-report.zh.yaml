      - number: '8.4'
        title: 情景区间、建议与尽调门槛
        blocks:
          - type: paragraph
            body: >-
              实际投资问题不是抽象地判断 Mynt 是不是好公司，而是现有公开证据是否足以支付传闻中的 IPO 价格。按这个检验，答案是否定的——至少目前不是。基准情景应继续锚定在最后可观察的 $5 billion
              标记附近，并只因 Globe 披露的 2025–2026 年更强盈利信号而适度上调。今天基于公开证据的合理区间约为 $5.0 billion 至 $6.5 billion。$8.0 billion 至 $9.0
              billion 的乐观情景是真实存在的，但前提是招股书显示强劲的独立收入规模、健康信贷质量和能经受公开市场审视的持久盈利能力。如果时间推迟、需求偏软，或披露的贷款指标令人失望，悲观情景会走向 $4.0
              billion 至 $5.0 billion。


              因此，本章结论是在营销中的 $8 billion 估值下继续研究（research-more），置信度为中，估值姿态为偏高。如果交易价格能接近 2024 年 $5 billion
              锚点，姿态会改善到合理，但仍不能盲买，因为最大的承销缺口仍未解决：准确收入和 EBITDA、贷款损失和资金成本，以及新资金在股权结构表或优先权中的位置。投资人应把 IPO
              公众持股规则变化和银行委任视为流程安排，而不是估值证明，并让任何决策都取决于招股书级披露和清晰的投资逻辑破裂触发点。
