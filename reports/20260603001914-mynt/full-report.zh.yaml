      - number: '2.5'
        title: 规模测算尽调缺口与保留矛盾估计
        blocks:
          - type: paragraph
            body: >-
              三类规模测算缺口限制了任何 GCash 市场分析的精度。第一，GCash 自身 GTV 没有公开披露。Globe 季报提到 Mynt
              的盈利贡献和用户增长，但没有拆分总交易额、各垂直抽成率，或月活用户与注册用户的差异。如果把 94 million 注册用户数字直接与 World Bank Findex 估计对比——只有约 10.5
              million 菲律宾成年人持有移动钱包（36.6 million 金融账户持有人中的 28.8%）——就会得到 GCash 注册数与 Findex 成人移动钱包人群之间 9:1
              的差距。这几乎肯定反映了休眠账户、15 岁以下用户注册或定义差异。没有活跃用户数据，SOM 估算就是猜测。


              第二，BSP 数字支付占比（交易量 57.4%、金额 59.0%）和 e-Conomy SEA GTV 估计（2024 年 USD 125B，而 BSP 为 USD 136B）相差 USD 11
              billion。e-Conomy 方法说明承认，其 GTV 除 A2A / 电子钱包流量外，还包括信用卡和借记卡交易；BSP 可能对 “retail payments”
              使用不同基数。这种不兼容意味着，未经调整就合并两个来源，会因选择哪一个数字作基数而高估或低估市场规模。


              第三，BSP 2026 年 1 月单月数字（P2.58 trillion）年化后约为 USD 540 billion，是 e-Conomy 2025 全年 GTV 估计的 3–4 倍。1
              月因假日后汇款结算和年初工资支付而季节性偏高。完整 2025 年年化 BSP 数据集可以解决这一冲突，但截至 2026 年 6
              月运行日尚未发布。因此，投资者和分析师应保留这些矛盾，把它们视为市场快速演进且公共数据基础设施尚不成熟的证据，而不是挑一个所谓“共识” 数字来消解矛盾。
            claimRefs:
              - CM041
              - CM042
              - CM043
              - CM017
              - CM022
      - number: '2.6'
        title: 图表与要点
        blocks:
          - type: callout
            title: 9400 万用户悖论——注册与活跃使用
            body: >-
              GCash 报告的 94 million 注册用户，与 World Bank Findex 2025 估计形成不舒服的张力：只有约 10.5 million 菲律宾成年人持有移动钱包账户（36.6 million
              金融账户持有人中的 28.8%）。9:1 比率几乎肯定反映休眠账户、15 岁以下个人注册和定义缺口；但鸿沟已经大到足以影响基于活跃用户的估值。若没有披露月活用户（MAU）数字，任何 GCash 财务模型中的
              SOM 和参与深度假设都天然带有猜测。
            calloutType: risk
            claimRefs:
