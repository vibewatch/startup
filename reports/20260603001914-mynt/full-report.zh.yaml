  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 盈利贡献与收入模型
        blocks:
          - type: paragraph
            body: >-
              Mynt 最强的公开财务锚点不是独立损益表，而是对 Globe Telecom 的权益法贡献。Globe 披露，Mynt 在 FY2025 贡献 ₱6.1 billion 权益收益，同比增长 64%，约占
              Globe 税前利润 22%。1Q2026，Globe 称 Mynt 贡献 ₱1.9 billion，约占 Globe 税前利润 30%；一年前为 ₱1.8 billion 和
              22%。这些数字说明两点。第一，Mynt 已是 Globe 集团内部有意义的盈利引擎，而不是纯战略可选性赌注。第二，市场仍只能通过 Globe 的权益份额看到这种盈利能力，而不是完整 Mynt
              P&L；因此投资者仍无法直接观察合并收入、利润率或现金转化。


              公开产品和费率披露指向多轨变现模型。GCash 通过银行转账、入金、出金、国际转账和商户支付轨道变现钱包使用；通过 GLoan 和其他信贷产品变现借贷；又通过 GFunds 信托费经济性和 GInsure
              分销伙伴关系，间接变现财富和保险。独立新闻报道补充了规模背景：Fuse 2025 年向超过 10.5 million 名独立借款人放款 ₱362 billion，GStocks PH 达到 1.7 million
              注册用户，GInsure 售出 132.6 million 份保单。产品宽度支撑超级 App 论点；但实际抽成率和分部收入拆分没有披露，现有证据只能支撑结构性收入地图，不能支撑清晰的收入结构预测。
