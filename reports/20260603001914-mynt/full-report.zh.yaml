  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 可观察定价锚与 IPO 背景
        blocks:
          - type: paragraph
            body: >-
              Mynt 最干净的公开估值锚点仍是 Ayala 2024 年 8 月交易，而不是 2026 年 IPO 传闻。Ayala 自身文件称，其以约 ₱22.4 billion 增持约 8%，隐含公司价值约 ₱286.4
              billion，约合 $5 billion。这一点重要，因为交易发生在成熟参与方之间，是真实的公平交易价格，尽管它不是公开市场清算事件。相比之下，2026 年 IPO 叙事仍只是指示性。Reuters
              来源的菲律宾报道称，Mynt 目标估值至少 $8 billion，并计划募资约 $1 billion，Citi、Jefferies 和 UBS
              参与推进，但同一报道也称，时间、规模和估值仍取决于市场条件和监管批准。


              公众持股规则变化影响的是可行性，不是内在价值。SEC 规则变化降低了超大型上市的最低公众持股比例，菲律宾评论认为这有助于 Mynt 避免过度稀释。但这些来源也提醒，传统 20%
              公众持股要求会带来一笔很大的发行，本地流动性未必能很好吸收。这有两面性：较低公众持股比例让 IPO 在机制上更可行，但不能证明公开市场投资人会认可 $8 billion
              价格。放在估值语境里，规则变化是背景管线，不是公允价值证据。
