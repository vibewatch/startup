      - number: '4.4'
        title: 财务披露缺口与盈利质量
        blocks:
          - type: paragraph
            body: >-
              财务披露质量仍是核心承销堵点。梳理 Globe 文件、Ayala 披露、IPO 报道、产品页面和伙伴公告后，公开来源一致披露估值锚点、Globe 权益收益、放款额、借款人数量和标价——但没有独立经审计的 Mynt
              收入、EBITDA、现金余额、烧钱、现金跑道、分部收入结构、毛利率或信贷损失指标。即便动能清楚，证据仍够不上完整承销包。例如，公开记录支持 CreditTech
              快速增长，也支持向财富和保险广泛交叉销售；但它没有说明利润中多少来自支付、多少来自借贷，损失率吞掉多少信贷收益，或报告增长中多少由交易量驱动、多少由费率驱动。


              单季质量也需要解读。Globe 的 4Q25 披露称，Mynt
              当季受到贷款处理费收入确认会计政策变化、影响持牌线上游戏的监管变化，以及季节性更高支出的影响。这不否定全年盈利轨迹，但说明单季收益对会计政策、监管变化和促销强度有多敏感。因此，投资者应把现有财务故事视为方向积极但仍不可审计：Mynt
              显然重要，但公开证据尚不足以给出收入质量、正常化利润率、损失调整后借贷盈利能力或未来现金需求的干净视图。
