      - number: '4.5'
        title: 财务结论与尽调事项
        blocks:
          - type: paragraph
            body: >-
              财务结论比典型私营金融科技公司更强，但还没有达到 IPO 级尽调所需的扎实程度。Mynt 有三项真实财务亮点：它已经是 Globe
              的重要利润来源，正把一块规模很大的贷款账簿做大且借款人采用度清晰，还拿到了蓝筹股权资本和发展金融贷款。这些信号指向商业有效性，而不只是靠风投资助续命。结构性短板在于，几乎所有承销所需指标仍未公开。缺少独立收入、分部结构、信用损失、现金余额和实际商户抽成率，投资人无法判断
              2024 年 $5 billion 私募估值跳到 $8 billion IPO 目标，是由收入质量支撑，还是只靠战略稀缺性和市场定位撑起。


              因此，委员会应把 Mynt 视为财务前景不错、但仍受披露约束的标的。承销前的最低资料包应包括：经审计的 FY2024-FY2025 独立财务报表；支付、贷款、财富和保险分部的收入与毛利率；Fuse
              的月度或季度信用质量指标；按收单产品划分的实际商户 MDR；以及覆盖拟上市路径的现金、流动性和资本充足率桥表。在这些资料到位之前，公开证据支持继续跟踪和准备，而不是形成估值确信。
