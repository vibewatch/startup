      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开领导信号是 Martha Sazon 担任 Mynt 总裁兼 CEO。2024 和 2025 年围绕估值与 IPO 准备的披露中，Sazon
              将管理层议程聚焦于监管合规、市场就绪和资本市场运营准备。Reuters 也把当时的 Globe Telecom CEO Ernest Cu 列为 Mynt 董事长，确认 Globe
              在治理层面深度参与，而不是纯被动股东。2025 年 11 月 BusinessWorld 专访还显示，Ren-Ren Reyes 担任 G-Xchange 总裁兼
              CEO，说明控股公司之下的钱包运营业务有单独高管负责人。


              明显缺失的是完整公开董事会名单、独立董事披露，或除媒体报道中几个最高层姓名之外的当前控股公司级高管梯队。Mynt 一边冲刺
              IPO，一边强调国家级普惠金融重要性，这种治理不透明很关键。尽调应把管理层厚度和董事会独立性视为开放项，而非既定事实。公开证据支持其顶层团队有能力且可见，但还拼不出接班梯队、委员会结构，或哪些股东在实操中主导董事会控制权的完整图景。
