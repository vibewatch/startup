              - CM041
          - type: callout
            title: 市场形态：数字支付已是大众市场，DFS 邻近业务还不是
            body: >-
              BSP 数据确认，数字支付本身已不再是小众：2024 年交易量占比 57.4%，政府交易 97.2%，个人交易 72.2%。GCash 现在的稀缺性溢价来自 DFS
              邻近业务——信贷、储蓄、财富、保险——这些领域数字渗透率仍低（USD 4B 借贷、USD 2B 财富 AUM，对比 USD 150B 支付市场）。这形成杠铃式机会：支付提供分销规模，DFS 产品提供利润率。
            calloutType: insight
            claimRefs:
              - CM001
              - CM014
              - CM015
