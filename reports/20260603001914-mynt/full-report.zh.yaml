      - number: '3.3'
        title: 功能、定价与分销对比
        blocks:
          - type: paragraph
            body: >-
              产品对比最好理解为宽度、所有权和分销之间的取舍。GCash 和 Maya 都以宽口径消费者金融 App 竞争，但二者抵达宽度的路径不同。Maya 通过旗下银行控制更多存款栈，GCash
              在储蓄上仍更依赖伙伴银行包装，但保留更强支付普及度。相较之下，GoTyme 和 Tonik 拥有持牌银行产品，但在国内商户触达或钱包习惯上尚未显得能匹配 GCash。Coins.ph
              靠加密资产功能和钱包活跃度差异化，而不是完整零售银行菜单。QR 轨道一旦互操作，买方和用户更在意支付按钮周围有什么：储蓄收益、信贷资格、入金摩擦、借记卡效用，以及邻近金融服务宽度。


              定价也反映同一转向。Tonik 明显押注储蓄和定期存款利率，Maya 用头部储蓄促销推动钱包到银行迁移，GoTyme 则强调简单储蓄加借记卡效用。GCash 的定价姿态更难干净对比，因为 GSave
              利率取决于伙伴产品，而不是一个原生资产负债表报价。分销也有结构差异。GCash 受益于既有规模和习惯，Maya 受益于从 PLDT 和 Smart 继承的电信与企业信任，GoTyme 的自助终端
              模式降低实体零售场景中的开户摩擦。这些差异重要，因为它们塑造的不只是获客成本，还决定用户多容易迁移余额、发现邻近产品，并把钱包关系转成主要金融账户。
