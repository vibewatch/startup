  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与用户分层
        blocks:
          - type: paragraph
            body: >-
              官方 GCash 页面把产品呈现为一款真正的金融超级应用，围绕六个一级支柱组织：Send、Pay、Borrow、Grow、Enjoy 和 More。在这些支柱下，应用公开导航里的模块远多于基础钱包竞争对手：Tap
              to Pay、Pay QR、Global Pay、Commute、Watch Pay、GCredit、GGives、GLoan、GSave、GInsure、GFunds、GStocks PH、GBonds 和
              GCrypto。About 页面还给出与产品成熟度有关的规模信号：94 million 菲律宾人用过 GCash，超过 9 million 人通过 GSave 储蓄，6 million
              商户和社交卖家在应用上经营，超过 3 million 借款人使用 GLoan、GGives 和 GCredit。这种广度有意义，因为应用可以把用户从基础支付习惯推进到信贷、储蓄和分销产品，而不需要离开生态。


              官方开户页面也显示，GCash 有意分层，而不是把所有用户塞进同一种钱包设计。GCash 区分普通成人账户、面向 7 至 17 岁用户的 GCash Jr 账户，以及面向使用合格境外 SIM 的菲律宾人的
              GCash Overseas。基础资料账户的钱包限额为 ₱10,000，用户完成身份证件和自拍验证后，完全认证账户限额升至 ₱100,000。GCash Jr 把应用延伸到青少年，覆盖购物、话费充值、学生优惠和
              Visa 卡，家长最多可绑定五个青少年账户。GCash Overseas 把开户注册扩展到 16 个国家，支持用菲律宾身份证和国际 SIM
              注册，并提供免费的账单、充值和菲律宾境内转账。因此，这个产品定义不只是“钱包加附加功能”，而是一组基于用户画像的工作流，共用同一个应用外壳。
