        - 招股书显示独立收入基础大、信用指标扎实、盈利能力可持续；尽管规模不小，订单簿需求仍强。
        - 8.0–9.0
        - 15–25%
        - 审计数字必须支撑同业高端倍数，并在不拖弱上市后表现的情况下吸收流通盘。
      - - 基准
        - 与 Globe 相关的盈利强度真实存在，但披露仍只部分充分，公开市场投资者会保守定价。
        - 5.0–6.5
