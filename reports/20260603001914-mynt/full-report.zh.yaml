      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              BSP Digital Payments Transformation Roadmap 给出坚实的量化锚点：到 2028 年把 60–70% 零售支付交易量数字化。菲律宾 2024 年已达到 57.4%，超过
              2024 年 52–54% 目标；下一段增量需要同时扩展首次采用者和用例深度。供给侧，BSP 在 2024 年 8 月取消数字银行牌照暂停，并把上限扩大到 10 家持牌机构（已有六家持牌：GOTyme、Maya
              Bank、OFBank、Tonik、UNObank 和 UnionDigital）；新进入者会在定价、功能和农村触达上增加竞争压力，也会扩大总市场。World Bank 于 2024 年 11 月批准的 USD
              750 million Second Digital Transformation DPL，将资金指定用于连接性、数字金融普惠和电商信任——这些都是结构性顺风。


              需求侧，QR Ph 商户铺开（2024 年 +148.7%）和 Paleng-QR 的 180 个 LGU 覆盖，表明商户受理正在追上消费者数字支付意愿。2024 年个人数字支付占比 72.2%（政府为
              97.2%，企业更低）确认，消费者数字采用已经领先其他部门。早在 2020 年，InstaPay 就在交易量和金额上超过 ATM 取现，说明只要渠道方便、低成本且可互操作，习惯迁移确实会发生。


              关键约束会压住这种乐观。第一，连接性：72% 家庭缺少固定宽带，限制农村地区数字交易可靠性。第二，信任与欺诈：BSP 明确把网络安全列为更广泛采用的主要障碍，并出台 Anti-Financial Account
              Scamming Act（RA 12010）应对。消费者救济标准（BSP Circular 1195）现在要求 InstaPay 失败后 1 小时内、PESONet 失败后 2
              小时内退回资金，抬高运营合规成本。第三，金融普惠悖论：数字浪潮之下账户拥有率仍下降 1.2pp，说明注册不等于活跃使用——BSP
              更深层的挑战是习惯养成，不只是开户。第四，当前支付轨道缺少直接扣款，限制保险、订阅和还贷等经常性支付用例；BSP 已宣布这一功能将上线，但时间不确定。跨境扩张（InstaPay–DuitNow、UPI–QR
              Ph）带来增长可选性，也引入监管协调复杂度。
