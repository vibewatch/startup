  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代品
        blocks:
          - type: paragraph
            body: >-
              GCash 所竞争的市场，是菲律宾零售数字支付和消费者数字金融服务（DFS）生态。BSP 采用较窄口径追踪：每月从数字渠道发起的零售支付交易——主要是电子钱包、经 InstaPay 和 PESONet
              的账户到账户（A2A）转账，以及 QR 编码商户支付（QR Ph）。按该口径，2024 年数字交易占每月零售支付总量 57.4%、支付金额 59.0%，高于 2023 年的 52.8% 和 55.3%。BSP
              2024 Report 记录全年零售交易总量 5.8 billion。其报告的数字支付金额达到 USD 136 billion，占约 USD 230 billion 零售支付总金额池的 59.0%。


              纳入这一市场边界的包括：消费者点对点（P2P）转账、个人对商户（P2M）支付、企业对企业（B2B）供应商支付、政府对个人和政府对企业拨付、转入数字钱包的 OFW
              汇款流入，以及搭在支付基础设施上的邻近数字金融产品（信贷、储蓄、财富管理、保险）。三大用例——商户支付（占数字交易量 66.4%）、P2P 转账（20.6%）和 B2B 支付（6.2%）——合计占数字交易量
              93.2%。政府拨付在 2024 年已 97.2% 数字化，虽然占总交易量不大，但战略价值高，因为它把受益人群的大众采用锚定住。


              核心市场定义不包括传统 POS 刷卡、纸质支票和 ATM 取现——这三条渠道仍是主要现状替代品。现金依赖仍在，因为 2023 年 72% 的菲律宾家庭没有固定宽带，可靠数字访问受限。实体汇款中心和当铺也仍是
              OFW 汇款走廊和微商户信贷的在位替代品。邻近市场包括跨境国际汇款走廊（2024 年 $38 billion）、数字借贷（2024 年 USD 4 billion 贷款簿）、数字财富管理（USD 2
              billion AUM），以及早期数字保险（USD 0.1 billion 年化保费）。
