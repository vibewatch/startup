      - number: '8.3'
        title: 公开可比公司筛选与隐含收入门槛
        blocks:
          - type: paragraph
            body: >-
              由于 Mynt 仍不披露独立经审计收入和贷款质量数据，公开可比公司筛选更适合用来设边界，而不是追求精确。这里的可比组合覆盖区域超级应用、数字银行、SME
              金融科技、商户收单机构和规模化支付平台：Grab、Nu、Block、PayPal、Sea、StoneCo、Paytm 和 Adyen。它们 2026 年 6 月的市值 / 收入倍数约在 1.1x 至 10.5x
              之间，样本中位数约 3.3x。PayPal 和 StoneCo 这类低端公司交易在约 1x–1.2x 收入，Grab 和 Nu 等区域增长或溢价平台约 4x–5.5x，Paytm 或 Adyen
              明显更高。因此，这组筛选支持两个结论。


              第一，$8 billion 在抽象倍数空间里并非不可能，但需要证据。按 3x 收入，Mynt 需要约 $2.67 billion 年收入；按 4x，约 $2.0 billion；按 5x，约 $1.6
              billion。这些门槛可能达到，也可能达不到，但公开来源目前没有披露可用来检验的准确收入基数。第二，最后可观察的 $5 billion 标记更容易解释：按 3x 收入，对应约 $1.67 billion；按
              4x，对应约 $1.25 billion。在招股书出现之前，可比公司组合提示的是纪律，而不是自动按营销中的 IPO 价格承销。
