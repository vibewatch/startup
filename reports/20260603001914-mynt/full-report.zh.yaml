      - number: '7.2'
        title: 欺诈、信任与服务摩擦风险
        blocks:
          - type: paragraph
            body: >-
              GCash 特许经营权当前最可见的风险，不是单次灾难性宕机，而是诈骗、冒名、争议交易和支持摩擦持续挤压信任。多篇 2026 年文章称，GCash 拦截了超过 4,900 个与 quishing
              相关的欺诈商户；BusinessMirror 称，公司自 2023 年以来下架了超过 57,000 个钓鱼网站，并举报 916
              个非法在线博彩网站。这些统计是缓释信号，但也说明攻击面已经大到需要工业级执法。客户证明来源也指向同一方向。App Store 评论页在抓取时显示 149k 个评分、总分 3.0，近期评论提到 QR
              支付迟缓、登录失败、验证待处理、受限账户案件未解决，以及未授权交易争议。官方公告确认支付界面至少出现过阶段性中断，而实时故障追踪器没有显示抓取日存在急性危机。因此，剩余问题是慢性信任侵蚀：即使平台没有明显宕机，诈骗负担和服务恢复不佳仍可能削弱交易信心和品牌韧性。
