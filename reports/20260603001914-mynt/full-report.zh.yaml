      - number: '3.2'
        title: 主要竞争者画像
        blocks:
          - type: paragraph
            body: >-
              Maya 是最重要的直接对手，因为它已经把大众钱包分销、可识别的消费者品牌和自有数字银行资产负债表放在同一伞下。公开报道把 Maya Bank 与增长中的存款、2026
              年明确盈利路径，以及管理层仍预期显著扩大的存款客户基础联系起来。这使 Maya 成为最清晰的竞争者，挑战“菲律宾钱包龙头应靠存款、信贷和储蓄变现支付，而不只靠支付费”的论点。GoTyme 绝对规模更小，但
              Gokongwei-Tyme 伙伴关系、自助终端辅助开户和零售商场足迹，让它能以不同路径切入主流客户，尤其是偏好线下协助开户和发卡的人群。


              Coins.ph 和 Tonik 的理由更窄，但仍重要。Coins.ph 不是最宽的零售金融超级 App，但它把庞大注册基础与多数银行主导型对手不提供的加密资产
              和数字资产功能放在一起，因此仍有真实价值。Tonik 更专门：它定位为首家 BSP 数字银行，靠储蓄经济性而不是商户触达竞争。ShopeePay 现在嵌在 Sea 全球 Monee
              品牌之下，作为强大电商生态中的结账替代品，仍有战略意义；只是保留下来的公开证据没有足够精确披露菲律宾用户规模，无法与 GCash 或 Maya 对标。实际结论是，Mynt
              面对的不是单一巨型对手，而是一组挑战者，分别攻击价值栈的不同部分。
