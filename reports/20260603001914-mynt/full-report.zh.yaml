      - number: '4.2'
        title: 定价架构与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              相比多数私营金融科技公司，GCash 披露了更多标价；但标价不等于实际变现。官方费率表显示，点对点转账免费，银行转账 ₱15，每月 ₱8,000 以内线下入金免费、超过阈值收 2%，多数伙伴线下出金收 2%，通过
              GCash Pera Outlet 入金收 1%、出金收 2%，对外国际转账收 2%，最低 ₱130、最高 ₱1,200。信贷侧，GLoan 宣传本金规模为 ₱500 至 ₱150,000，月利率 1.59% 至
              6.99%。资金侧，GSave 伙伴产品年利率从低端 0.0925% 到特定 CIMB 用户 4.0%；GFunds 不收交易费，但把 0.50% 至 1.75% 的年度信托费嵌入 NAVPU。GInsure
              宣传入门价格低至每月 ₱10。


              这些披露让消费者侧菜单可读，但不一定揭示底层单位经济。公开记录仍没有显示分客群实际商户折扣率、混合支付抽成率、贷款损失调整后的借贷收益率，或伙伴分成后 Mynt
              在储蓄、保险和财富分销中留存的经济性。商户定价是剩余不确定性中最清楚的例子。官方企业页面披露开户要求和服务水平时间线，但没有一张权威官方 MDR 表。独立商户指南互相冲突：一份称 GCash Business
              QR Ph 每笔 2.5% 加 ₱3，另一份称 QR Ph 为 1.0% MDR、钱包受理为 1.0% 至 2.0%。这种差异很关键，因为哪怕 150 个基点的差距，也会改变商户收单的毛利计算。
