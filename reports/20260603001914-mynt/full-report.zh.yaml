      - number: '6.2'
        title: 采用界面与客户证明
        blocks:
          - type: paragraph
            body: >-
              公开来源中最强的采用证据，来自具体使用场景，而不是抽象的“参与度”话术。官方帮助材料显示，汇款可通过 Cash In > Global Banks and Partners
              领取，明细确认后可即时入钱包；官方汇款伙伴目录列出一组规模大且地域多元的汇款方，包括 Western Union、MoneyGram、Remitly、RIA、Thunes 和
              Xendit。交通是另一个现实使用场景：交通帮助页称，2025 年 7 月 25 日起，所有 MRT-3 车站都接受 GCash，覆盖 Scan to Pay、Commute by GCash、Tap to
              Pay 和 GCash Card。Globe 的 Lucena 公共市场试点进一步显示，公司试图把 GFiber 公共 WiFi 与面向摊贩和 suki 的 GCash
              收款结合，降低无现金市场交易背后的基础设施摩擦。Rappler 对 Paleng-QR 的报道增加了微商户和三轮车司机使用场景；这些高频低客单场景只要稳定运行，就能形成习惯。


              具名客户证明存在，但质量不均。Newsbytes 报道称，咖啡连锁 Frank & Dean 在其公司门店使用 PocketPay，并减少了现金处理。Pine Labs 2026 年新闻稿称，GCash for
              Business 是其首个菲律宾支付合作伙伴，该合作将推动下一阶段商户获取，并支持银行卡和 QR 收款。Glean 的客户故事是内部企业使用证明，不是付费终端客户证明，但仍有价值：GCash 称 Glean
              每周为员工节省两到三个小时，并在部分部门达到超过 90% 采用率。BusinessWorld 和 Philstar 的赞助报道还显示，通过 Virtual US
              Account，公司有一条向自由职业者扩展客户的路径。这些证明足以确认商户、通勤者、市场摊贩和内部团队都有真实生产使用，但不足以量化留存、各队列商品交易总额或客户终身价值（LTV）。
