      - number: '2.2'
        title: 市场规模测算——多重口径与矛盾估计
        blocks:
          - type: paragraph
            body: >-
              测算菲律宾数字支付市场，至少要调和两套明显不同的方法，且它们给出的数字差异很大。BSP 2024 Report 将数字支付金额定为 USD 136 billion（占零售支付总金额
              59.0%）。Google/Bain e-Conomy SEA 2025 报告使用总交易额（GTV）口径，纳入信用卡、借记卡、预付卡、A2A 和电子钱包交易，估算 2024 年菲律宾数字支付 GTV 为 USD
              125 billion。同一报告预计 2025 年为 USD 150 billion，到 2030 年为 USD 200–300 billion。2024 年 BSP 数字（USD 136B）与
              e-Conomy（USD 125B）的缺口，可能来自定义差异：BSP 统计 BSP 监管金融机构和电子货币发行方内数字交易的零售子集，而 e-Conomy 使用 GTV
              视角，基数人群或汇率假设可能不同。两个数字都确认市场大且在增长；但二者都没有完全界定 GCash 这类电子钱包运营商的 SAM 边界。


              Fintech Alliance/BSP 提供的第三个数据点显示，2026 年 1 月单月数字支付达到 P2.58 trillion（约 USD 44 billion），同比增长 43.1%；其中
              InstaPay 为 P1.24 trillion（+65.5%），PESONet 为 P1.34 trillion（+27.1%）。把 2026 年 1 月年化，相当于每年 P31 trillion（约 USD
              540 billion），显著高于上述两个年度估计。这确认了 1 月并不具代表性（假日消费、汇款流和年初模式抬高了月份数据），也说明把单月年化是不可靠的规模测算口径。


              更广义的数字金融服务机会包括数字借贷（2024 年 USD 4B 贷款簿）、数字财富 / AUM（2024 年 USD 2B）和数字保险（2024 年 USD 0.1B APE）。展望 2030
              年，e-Conomy 估计借贷达到 USD 10–12B，财富达到 USD 20B，整体数字经济 GMV 从 2024 年的 USD 31B 达到 USD 70B。对 GCash 这样的超级 App
              来说，这些邻近业务是纯支付 GTV 之外的额外变现向量。
