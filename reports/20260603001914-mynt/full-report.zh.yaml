      - CV045
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 主题
      - 投资逻辑
      - 反向逻辑
      - 什么会改变判断
    rows:
      - - 最近可观察价格
        - 2024 年，一笔真实战略交易按约 $5B 完成。
        - 该交易已经滞后，可能无法反映当前公开市场纪律。
        - 最新招股书披露能说明 2024 年以来的增长是否支撑溢价。
      - - 盈利重要性
        - Globe 的 2025 年和 1Q26 披露显示，Mynt 已经影响股东盈利。
        - 权益法收益不是独立 P&L，也不能展示经损失调整后的贷款质量。
        - 独立审计收入、EBITDA 和信用成本披露。
      - - IPO 机制
        - 更低的流通股规则让本地 IPO 在机制上更可行。
        - 机制上可行，不等于定价公平，也不等于流动性足以支撑溢价。
        - 强劲簿记需求和上市后支持的证据。
      - - 同业支撑
        - 公开可比公司显示，成长平台可按收入 4x 以上交易。
        - 同一组筛选也显示，许多规模化支付公司只在收入 1x–2.5x 附近。
        - 证据证明 Mynt 应归入更高质量成长同业，而不是成熟或低回报同业。
      - - 披露质量
        - 公司可能仍在补齐 IPO 级别披露。
        - 目前，缺少审计收入、信用指标和股权结构细节，直接卡住估值。
        - 已提交的招股书和达到贷款机构尽调质量的数据包。
    notes: 本表把公司质量和价格支撑拆开：投资逻辑最强的是战略相关性，最弱的是当前披露充分性。
