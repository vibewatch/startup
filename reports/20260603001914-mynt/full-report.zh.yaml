      - number: '6.3'
        title: 持久性、满意度与集中度
        blocks:
          - type: paragraph
            body: >-
              公开持久性证据远弱于公开覆盖证据。最直接的客户情绪来源是 iOS App Store 评论页；访问时页面显示 149,000 个评分、总分 3.0/5，并突出性能迟缓、QR
              扫描失败、垃圾通知、验证延迟、账户受限和争议未解决等投诉。这些投诉很重要，因为它们击中支付平台留存循环的核心：用户排队结账、乘坐交通工具或试图动用工资和汇款资金时，产品必须即时可用。官方支持页面部分确认产品摩擦并不轻：GCash
              公开说明更新应用、切换网络、清除缓存、Help Center 搜索和工单状态流程，而不是给出清晰的可靠性仪表盘或已发布的解决 SLA。


              集中度风险也比表层渗透率更难判断。公开来源没有披露 94 million 注册用户对应的 MAU 或 DAU，没有披露 6 million
              商户标题背后的活跃商户分母，也没有披露头部商户、头部走廊或头部合作伙伴集中度。不过现有证据仍显示出若干渠道依赖。汇款流量依赖一张非常大的合作伙伴名单。商户收单扩张越来越依赖 Pine Labs
              提供下一阶段基础设施。Palengke 和交通推广依赖地方政府和公共部门项目。公司层面，Globe 1Q2026 文件显示 Mynt 贡献 Globe 税前收入的 30%，这凸显 GCash
              对单一母公司赞助方已具有很强战略重要性。结果是：客户基础在叙事上显得广且粘，但仍缺少严格证明持久性所需的队列数据。
