      - number: '1.4'
        title: 规模、产品宽度与分销触达
        blocks:
          - type: paragraph
            body: >-
              公开披露显示的规模，即使放在区域金融科技公司中也罕见。BusinessWorld 报道，2025 年底注册用户达 94 million，覆盖至少 16 个市场；Globe 1Q2025 发布稿称，GCash
              已建成超过 6 million 线上线下商户和社交卖家网络，并在 GLife 内拥有超过 1,000 家商户伙伴。Globe 2025 和 2026 年披露还显示 GCash 国际扩张：支付受理覆盖 220
              多个国家和地区，GCash Overseas 触达 145 个国家。这些数据共同支撑一个结论：GCash 既有国内普及度，也有实质跨境用途，尤其面向海外菲律宾人。


              产品宽度同样很大。Globe 文件和 GCash 自身服务页面确认，CreditTech 现包括 GCredit、GLoan、GGives 和纳米信贷产品，WealthTech 包括
              GSave、GFunds/GInvest、GStocks、GCrypto 和 GBonds；保险通过 GInsure 分销。Globe 还称，Mynt
              已向数百万借款人发放信贷，多数来自较低社会经济阶层。这种宽度强化了超级 App 论点，也部分解释了为什么 Mynt 经济模型对 Globe
              如此重要。开放的尽调问题不是产品是否存在，而是每一层有多赚钱、黏性多强、损失效率如何；公开来源仍未按产品线拆分收入、抽成率、贷款损失或活跃用户结构。
