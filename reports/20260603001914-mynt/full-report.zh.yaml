  - id: TV005
    title: 投资逻辑破裂与终止触发项表
    columns:
      - 触发项
      - 阈值 / 信号
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - IPO 时间明显后移
        - 预期 2026 年窗口之后仍没有明确申报路径，或反复推迟到 2027 年。
        - 削弱稀缺性叙事，并提示市场需求或披露准备度存在问题。
        - 不要相对上一次可观察私募标记支付溢价。
      - - 收入支撑低于隐含门槛
        - 招股书收入明显低于按同业倍数支撑营销区间所需水平。
        - 打破支付 $8B 的核心依据。
        - 向基准或悲观区间重定价。
      - - 信用指标不及预期
        - 招股书或尽调显示 Fuse 的 NPL、核销、拨备或资金成本偏弱。
        - 削弱从 Globe 权益法披露推导盈利能力的桥梁。
        - 把贷款视为折价项，而不是溢价项。
      - - 优先权或稀释包袱沉重
        - 新投资者或普通股持有人排在明显不利的优先股堆叠或老股占比高的结构之后。
        - 即便名义估值不变，真实上行也会减少。
        - 参与前先按普通股可得收益建模。
      - - 营销价格下 IPO 需求疲弱
        - 簿记需要大幅让步、依赖基石投资者，或上市后支撑差。
        - 说明可行性已经偏离公允价值。
        - 等待重新定价或二级市场价格发现。
    notes: 触发项刻意设为可观察且对价格敏感；重点是哪些因素会推翻当前基准估值框架，而不是泛泛的经营噪音。
