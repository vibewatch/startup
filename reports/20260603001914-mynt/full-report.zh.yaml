      - number: '5.4'
        title: 信任、安全、隐私与支持
        blocks:
          - type: paragraph
            body: >-
              公开信任控制比内部架构更可见。GCash 的隐私通知对其为何收集 KYC 信息、如何监测可疑交易、行为数据如何进入
              GScore，以及不同数据类别保留多久，写得异常详细。它披露，身份和金融数据在最后一笔交易或账户关闭后保留五年，设备和应用使用信息保留 90 天至三年。iOS App Store
              隐私标签进一步说明，应用会把联系信息、标识符等敏感类别关联到用户，并可能把使用数据用于追踪，直接揭示个性化与隐私之间的取舍。支持流程也公开：GCash 要求用户更新应用、切换网络、清除缓存，并使用 Help
              Center 搜索和工单状态，同时提醒用户绝不要分享 OTP 或 MPIN。


              监管和外部信任信号利弊并存。正面看，NPC 2025 年 3 月的 MOA 允许 GCash 把隐私教育和 NPC Registration Portal 集成进应用；BSI 案例研究称，GCash 在服务超过
              94 million 注册客户的云和敏捷运营环境中推进 ISO/IEC 27001:2022 与 ISO/IEC 27701:2019。风险侧，2025 年 10 月暗网数据集指控仍触发 NPC
              正式调查和公开用户警示，尽管 NPC 最终认为没有充分依据认定发生泄露，并且在展示期间没有发现未经授权的访问尝试。剩余缺口是可靠性透明度：在消费者、支持、企业和 API 页面中，没有看到公开 uptime
              SLA、事故指标仪表盘或状态页。
