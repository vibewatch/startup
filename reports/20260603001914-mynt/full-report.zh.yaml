  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              对一家私营金融科技公司来说，官方 GCash 客户基础异常广。About 页面称，94 million 菲律宾人用过 GCash，超过 9 million 人通过 GSave 储蓄，6 million
              商户和社交卖家在平台上经营，超过 3 million 借款人使用 GLoan、GGives 和
              GCredit。这些数字描述的不是单一同质客群，而是多种不同客户关系：支付和转账的终端用户、借款人、储户、商户、社交卖家和企业合作伙伴。GCash 也明确分层开户。Get Started 文档把普通成人用户、7
              至 17 岁的 GCash Jr 用户，以及使用合格境外 SIM 的 GCash Overseas 用户分开。这一点重要，因为每条路径上的买方、用户和付款方角色都不同：家长可能资助 GCash Jr 用户，OFW
              可能从海外给家庭钱包打款，sari-sari 商户可能既用 GCash 收款，也用它入金或出金。


              平台的地理覆盖和渠道组合进一步强化了这种分层。官方页面强调可在 200 多个国家和地区使用，Overseas 页面和帮助文档则展示了围绕境外 SIM 注册、PayPal 或 Payoneer
              入金、全球汇款伙伴、转账到菲律宾银行，以及菲律宾免费缴费或充值的更可操作客户旅程。Google Play 面向客户的功能清单也解释了为什么 GCash 是日常使用平台，而不是一次性汇款工具：400
              多个账单机构、70,000 多个 QR 或 QRPh 商户，以及从钱包到信贷再到财富管理的广泛交叉销售。主要分层缺口在活跃深度。公开来源证明了覆盖面，但没有说明 94 million
              注册用户中有多少是月活，多少商户在定期交易，使用量又有多大比例集中在少数走廊或类别。
