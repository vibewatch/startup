      - number: '1.5'
        title: IPO 准备、里程碑与负面事件
        blocks:
          - type: paragraph
            body: >-
              IPO 准备的证据强于传闻，但弱于已提交招股书。Globe 2025 年 1 月澄清函称，GCash 希望为 IPO 达到“按键即发”状态，但没有关于银行任命的重大信息可披露。到 2025 年 10 月，Mynt
              已获 SEC 批准拆股，普通股从 2.1 billion 增至 71.66 billion，面值降低；BusinessWorld 和 InsiderPH 都把这一步解读为常规上市前步骤，Martha Sazon
              也明确表示公司尚未提交任何文件。2026 年 5 月，BusinessWorld 和 Manila Times 中的 Reuters 来源报道称，Mynt 最早准备在 2026 年 7 月提交申请，目标估值至少
              $8 billion，可能募资约 $1 billion。因此，图景是：公司在结构上为上市做准备，同时保留时间灵活性。


              在正向可选性之外，GCash 也必须处理真实的运营和监管审视。BSP 称，G-Xchange 报告 2024 年 11 月未授权扣款事件源于系统错误，并要求退款和定期更新。2025 年 10 月，National
              Privacy Commission 开始调查 GCash 数据疑似泄露；但 BusinessWorld 和 GCash 后续引用的声明称，曝光数据集似乎并非来自 GCash 系统。Philstar 还报道了
              2026 年 5 月针对假冒网站的反 QR 钓鱼打击行动。这些事件没有推翻业务根基，但提醒投资者：扩张国家级金融超级 App，关键不只是增加用户或产品，还要在审视下持续守住信任。
