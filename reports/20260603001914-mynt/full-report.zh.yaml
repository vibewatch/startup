      - number: '2.3'
        title: 买方与用户分层
        blocks:
          - type: paragraph
            body: >-
              菲律宾数字支付市场至少包含五类结构不同的买方群体，每类的预算归属、采用触发点和转换成本都不同。大众城市消费者——Metro Manila 和二线城市的工作年龄成年人——是 GCash 的既有重度用户，吸引力来自
              P2P 转账、网购结账和账单支付的 App 原生便利性。这个群体黏性高，因为 GCash 余额充当非正式储蓄工具，GCredit 又在没有银行卡时提供即时循环信用。


              农村和未开户用户群体具备战略重要性：截至 2024 年，15 岁及以上菲律宾成年人中，只有 50.2% 拥有正式金融账户，明显低于 BSP 自身 70% 目标，也低于东亚太平洋 83.3%
              平均水平。值得注意的是，2021 至 2024 年间，账户拥有率反而下降 1.2 个百分点，说明疫情后注册潮没有转化为持续习惯使用。在账户持有人中，28.8% 持有移动钱包，32.7% 持有数字化账户，显示
              GCash 所在品类已经是新增纳入人群中的主导账户类型。现金约束和数字素养有限，仍是农村地区采用障碍。


              微型和小型商户是需求侧扩张的关键：2024 年 QR Ph 商户数量增长 148.7%；到 2025 年 7 月，Paleng-QR Ph 项目已在全国正式纳入至少 180 个
              LGU，覆盖公共市场摊贩、sari-sari 小店和三轮车运营者。GCash 已服务超过 6 million 商户。海外菲律宾劳工（OFW）群体不同，因为他们是付款方，而不是收款方：GCash Overseas
              覆盖 145 个国家，菲律宾在 2024 年收到 USD 38 billion 汇款。MSME 雇用了菲律宾超过 60% 的劳动力，代表 B2B 和借贷邻近机会；GCash 可以通过 Fuse Financing
              放贷主体提供工资拨付、收款和营运资金。
