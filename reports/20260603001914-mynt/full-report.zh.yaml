    title: 缓释与终止标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 隐私与执法风险
        - 监管结案或升级
        - NPC/BSP/CICC 确认数据泄露、实施执法，或要求大范围整改 / 用户通知
        - 在事件范围、整改成本和留存影响量化之前，暂停正向承销假设。
      - - 诈骗与信任侵蚀
        - 未授权交易和投诉模式
        - 反欺诈信息持续发布，但负面评价证据持续存在，或缺少赔付 / 争议胜诉披露
        - 在承销持续交易增长前，要求提供事件、争议和赔付资料包。
      - - 运营可靠性与支持
        - 官方公告加服务指标
        - 支付场景反复出现公告，或私下 SLA 数据显示排队或关闭表现恶化
        - 下调交易耐久性和客户留存假设。
      - - 信用模型与资金风险
        - 损失或资金状况恶化
        - 负面的贷款批次 / 核销数据、催收反弹，或授信额度承压
        - 以明显更低的信心重新承销贷款上行、拨备和贡献利润率。
      - - IPO 与股东依赖
        - 资本市场或披露重置
        - 申报延迟、估值低于预期，或股东释放 IPO 准备度下滑信号
        - 降低来自可选性的估值支撑，重估退出时间和股东一致性。
    notes: 触发项设计成可从监管动作、公司披露或私下尽调资料包中监控，而不是只靠直觉。
