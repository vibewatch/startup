  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与消费者保护风险
        blocks:
          - type: paragraph
            body: >-
              GCash 的法律面并不在于是否持牌；更尖锐的问题是，当大众电子货币钱包、合作伙伴市场和贷款漏斗出错时，责任如何分配。GCash 称其受 BSP 监管，但自身条款也把钱包定义为非存款、非 PDIC
              保险的电子货币，并通过围绕 MPIN、PIN 和 OTP 授权交易的推定，把相当责任放到用户身上。同一条款设置较短争议窗口，在没有直接重大过失时限制责任，并把管辖地留在
              Taguig。隐私姿态同样偏宽而非偏窄：GCash 称其收集 KYC、金融、设备和雇佣数据，并与关联方、服务提供商、金融机构、反欺诈合作伙伴和监管机构共享数据。最强外部法律信号是 NPC 2025 年 10
              月关于疑似数据泄露的声明，该事件升级到 Notice to Explain 和澄清会议，而保留记录中未见公开结案。另一个独立信号是，BSP 政策已经迫使 GLife
              暂停游戏业务，证明平台范围变化可能由监管驱动，而不只是产品驱动。
