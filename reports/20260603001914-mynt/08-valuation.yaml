    "number": 8,
    "title": "Valuation",
    "summary": "The last arm’s-length public mark for Mynt is the 2024 strategic transaction at about $5 billion, while the 2026 IPO narrative at $8 billion to $9 billion remains conditional on market conditions, float-rule changes, and still-missing prospectus data. Globe’s 2025–2026 equity-share disclosures prove Mynt is already economically material, but the absence of standalone audited revenue, EBITDA, credit-quality, and cap-table detail keeps the marketed IPO range in stretched territory. Recommendation: research-more at the marketed price; closer to fair only nearer the last $5 billion anchor and after prospectus-grade disclosure closes the main gaps."
  },
  "sections": [
    {
      "id": "observable-pricing-anchors",
      "title": "Observable pricing anchors and IPO context",
      "body": "The cleanest public valuation anchor for Mynt remains the August 2024 Ayala transaction, not the 2026 IPO rumor mill. Ayala’s own filing said it bought an additional ~8% for about ₱22.4 billion, implying a company value of about ₱286.4 billion, or roughly $5 billion. That is important because it was a negotiated transaction between sophisticated parties and therefore a real arm’s-length price, even if it was not a public-market clearing event. In contrast, the 2026 IPO narrative is still indicative. Reuters-sourced Philippine coverage says Mynt is targeting at least an $8 billion valuation and around a $1 billion raise, with Citi, Jefferies, and UBS working on the process, but the same coverage also says timing, size, and valuation remain subject to market conditions and regulatory approvals.\n\nThe public-float rule changes matter for feasibility, not intrinsic value. SEC rule changes lowered the minimum float for mega-listings, and Philippine commentary argues this helps Mynt avoid excessive dilution. Yet those same sources also warn that a traditional 20% float would have required a very large offering that local liquidity may not absorb well. That cuts both ways: lower float makes an IPO more mechanically feasible, but it does not prove that public investors will endorse an $8 billion price. In valuation terms, the rule change is contextual plumbing, not fair-value evidence.",
