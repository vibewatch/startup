    {
      "id": "equity-share-economics-versus-standalone-underwriting",
      "title": "What Globe economics prove — and what they do not",
      "body": "Globe’s disclosures do show that Mynt is economically real. Globe reported ₱6.1 billion of equity earnings from Mynt in FY2025, equal to about 22% of pretax income, and ₱1.9 billion in 1Q26, equal to about 30% of pretax income. That is much stronger evidence than a pure user-growth narrative: Mynt is already large enough to move a listed parent’s earnings profile. Follow-on coverage also shows outside analysts increasingly treat GCash as a meaningful part of Globe’s valuation rather than a side bet. That supports the thesis that the franchise has genuine profit power and that the 2024 $5 billion mark was not obviously fantasy pricing.\n\nBut that same evidence should not be over-interpreted. Globe reports only its equity share, not Mynt’s full audited income statement, balance sheet, or loan book quality. Public sources still do not disclose exact standalone FY2025 or 1Q26 revenue and EBITDA, nor the current NPL, charge-off, funding-cost, and capital metrics needed to value Fuse as a lender. Equity-share economics therefore validate significance, not sufficiency. They tell the committee that Mynt is worth taking seriously; they do not tell the committee exactly what multiple public investors should pay for it.",
