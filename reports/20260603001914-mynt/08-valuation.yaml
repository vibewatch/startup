    {
      "id": "public-comparable-screen-and-implied-thresholds",
      "title": "Public comp screen and implied revenue thresholds",
      "body": "Because Mynt still withholds standalone audited revenue and lending-quality data, a public comparable screen is more useful as a boundary-setting exercise than as a precision tool. The comp set here spans regional super-apps, digital banks, SME fintechs, merchant acquirers, and scaled payment platforms: Grab, Nu, Block, PayPal, Sea, StoneCo, Paytm, and Adyen. Their June 2026 market-cap-to-revenue multiples range from roughly 1.1x to 10.5x, with a sample median around 3.3x. Low-end names such as PayPal and StoneCo trade near 1x–1.2x revenue, while regional growth or premium platforms like Grab and Nu trade around 4x–5.5x, and Paytm or Adyen sit materially higher. The screen therefore supports two conclusions.\n\nFirst, $8 billion is not impossible in abstract multiple space, but it requires proof. At 3x revenue, Mynt would need about $2.67 billion of annual revenue; at 4x, about $2.0 billion; at 5x, about $1.6 billion. Those thresholds may or may not be reachable, but public sources do not currently disclose the exact revenue base needed to test them. Second, the last observed $5 billion mark is much easier to rationalize: at 3x revenue it implies about $1.67 billion; at 4x, about $1.25 billion. With no prospectus yet, the comp set argues for discipline, not for auto-underwriting the marketed IPO price.",
