- id: trust-security-privacy-and-support
  title: Trust, Security, Privacy, and Support
  body: 'Public trust controls are more visible than the internal architecture. GCash’s privacy notice is unusually detailed on why it collects KYC information, how it monitors transactions for suspicious activity, how behavioral data feeds GScore, and how long different data classes are retained. It discloses five-year retention windows for identification and financial data after the last transaction or account closure, and 90-day to three-year retention windows for device and app-use information. The iOS App Store privacy label reinforces that the app links sensitive categories such as contact info and identifiers to users and may use usage data for tracking, making the trade-off between personalization and privacy explicit. Support flows are also public: GCash tells users to update the app, switch networks, clear cache, and use Help Center search and ticket status, while warning them never to share OTP or MPIN.


    Regulatory and external trust signals cut both ways. On the positive side, NPC’s March 2025 MOA lets GCash integrate privacy education and the NPC Registration Portal into the app, while BSI’s case study says GCash pursued ISO/IEC 27001:2022 and ISO/IEC 27701:2019 in a cloud-and-agile operating environment serving over 94 million registered customers. On the risk side, the October 2025 dark-web dataset allegation still triggered a formal NPC investigation and public user warnings, even though NPC ultimately concluded there was no sufficient basis to conclude a breach and found no unauthorized access attempts in the demonstrated period. The remaining gap is reliability transparency: across consumer, support, business, and API pages, no public uptime SLA, incident metrics dashboard, or status page surfaced.'
