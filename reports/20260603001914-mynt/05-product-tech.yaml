tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Core wallet (Send / Pay / Bills)
    - Retail users
    - Mature / core
    - Unified wallet with P2P, bill pay, transfers, QR, and card-linked use cases
    - Need MAU/DAU and payment-volume mix by rail
  - - Borrow stack (GCredit, GGives, GLoan)
    - Retail borrowers
    - Mature / scaled
    - Embedded credit across revolving, installment, and loan products inside same app
    - Need credit losses, approval rates, and repeat-borrow behavior
  - - Grow stack (GSave, GFunds, GStocks PH, GCrypto, GBonds)
    - Retail savers / investors
    - Mature but partner-heavy
    - Single wallet entry point into deposits, funds, equities, crypto, and bonds
    - Need AUM, partner revenue share, and active-user counts by product
  - - GInsure
    - Retail users
    - Mature distribution layer
    - Insurance embedded next to payments and savings with low advertised entry price
    - Need premium mix, renewal rate, and commission economics
  - - GCash Jr
    - Teens and parents
    - Launched / scaled consumer extension
    - Youth profile with parental linking and teen-friendly payments workflow
    - Need active-account count and control surface for parents
  - - GCash Overseas
    - OFWs and overseas Filipinos
    - Operational
    - Foreign-SIM registration and remittance-linked use cases for Filipinos abroad
    - Need corridor-level activity and monetization data
  - - Tap to Pay
    - Android users / travelers / commuters
    - Rolling out
    - NFC phone-as-wallet acceptance at terminals without separate card
    - Need live merchant coverage, success rates, and Apple timeline
  - - GCash for Business tiers
    - MSMEs / enterprises / public sector
    - Operational
    - Plan-based merchant progression from Starter to unlimited-wallet Pro
    - Need customer counts by tier and realized ARPU
  - - PocketPay / SoundPay
    - SMEs, mobile sellers, pop-ups
    - Newly launched
    - Low-hardware merchant acceptance devices for card and QR use cases
    - Need post-promo pricing, activation rate, and churn
  - - Virtual US Account
    - Freelancers / cross-border earners
    - Newly launched
    - USD earnings collection inside GCash wallet without separate US bank account
    - Need FX spread, fee card, and settlement times
  notes: Status and differentiation are based on official pages plus launch coverage as of runDate. The matrix distinguishes broadly available modules from recently launched business tools whose operating KPIs remain private.
