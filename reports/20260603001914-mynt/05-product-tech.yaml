  body: The official navigation, scale stats, business surfaces, and partner APIs collectively show a broad operating platform covering consumer finance, merchant acceptance, and partner integrations.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE021
  - CE028
- calloutType: risk
  title: Public reliability evidence is materially thinner than product breadth evidence
  body: The iOS rating is mediocre, help docs emphasize troubleshooting and scam prevention, and no public status page or uptime SLA surfaced. The product may be robust internally, but public observability is still weak.
  claimRefs:
  - CE038
  - CE040
  - CE041
  - CE049
  - CE051
- calloutType: recommendation
  title: Request internal platform telemetry before underwriting GCash as a full-stack fintech platform
  body: 'Minimum asks are: runtime architecture review, incident history, uptime SLA, API and Mini Program adoption dashboards, and post-launch KPIs for Tap to Pay, PocketPay, SoundPay, and Virtual US Account.'
  claimRefs:
  - CE021
  - CE031
  - CE034
  - CE051
  - CE052
  - CE053
