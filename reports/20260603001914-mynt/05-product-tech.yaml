- id: merchant-and-business-workflows
  title: Merchant and Business Workflows
  body: 'GCash’s business product set is broader than a simple merchant QR offer. Official business pages target enterprise, MSME, public-sector, and sari-sari-store users, while the MSME plan page shows a three-tier progression from Starter (up to ₱250,000 wallet), to Premium (up to ₱5 million), to Pro (unlimited wallet). That plan structure suggests Mynt is productizing merchants not only by payment acceptance but also by transaction scale, reporting, and payout complexity. Public copy promises no wallet limit when receiving customer cashless payments and no transaction fee for supplier cashless payments, which, if implemented as advertised, reduces workflow friction for small merchants migrating from informal cash handling.


    Recent device and workflow launches extend that operating model. PocketPay turns an Android smartphone into an NFC point-of-sale device for card acceptance, while SoundPay adds portable QR acceptance with audio confirmation. Launch coverage consistently positions PocketPay around mobile sellers, pop-up merchants, and MSMEs that cannot justify traditional hardware. Sponsored coverage from BusinessWorld and Philstar also shows the company pushing beyond domestic merchant acceptance into freelancer and cross-border earnings workflows through the Virtual US Account, which is powered by Meridian1, limited to fully verified users, and explicitly not deposit-insured. These releases show a product organization that is increasingly workflow-native: consumer wallet, teen wallet, OFW wallet, merchant POS, and freelancer receivables are being designed as adjacent but distinct journeys.'
