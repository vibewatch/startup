  evidenceGaps:
  - type: missing-source
    severity: material
    topic: uptime-sla
    missingEvidence: Public or private uptime SLA, status-page history, and incident metrics for consumer and merchant surfaces.
    whyItMatters: A platform this broad should be judged on operational reliability, not just feature breadth, but public observability is currently absent.
    diligencePath: Request status-page exports, monthly incident reports, and internal service-level objectives for core payment rails.
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: runtime-architecture
    missingEvidence: Comprehensive runtime architecture covering cloud topology, failover design, fraud controls, and observability stack.
    whyItMatters: Public evidence confirms partner APIs and mini-program packaging but not the resilience of the underlying platform.
    diligencePath: Request architecture review, reliability design documents, and disaster-recovery runbooks.
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: api-adoption-metrics
    missingEvidence: Counts for active API consumers, subscription approvals, Mini Program developers, and production traffic.
    whyItMatters: Without adoption metrics, it is difficult to assess whether GCash’s partner surfaces are strategic differentiators or lightly used infrastructure.
    diligencePath: Request API Portal dashboards, Mini Program traffic stats, and partner GMV contribution by integration channel.
    relatedTableRefs:
    - TE003
    - TE005
  - type: missing-source
    severity: minor
    topic: customer-support-metrics
    missingEvidence: Ticket-resolution times, first-contact resolution, app crash rates, and support-volume trends.
    whyItMatters: Public troubleshooting guidance is visible, but there is no quantified evidence on whether support quality is improving or deteriorating.
    diligencePath: Request monthly support KPI dashboards and app-store complaint trend analyses.
    relatedTableRefs:
    - TE002
    - TE004
