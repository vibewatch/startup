- id: product-verdict-and-diligence-asks
  title: Product Verdict and Diligence Asks
  body: 'The product verdict is strong on breadth and reasonable on public implementation detail. GCash clearly has a mature multi-module consumer surface, genuine merchant tooling, and credible partner-facing API infrastructure. It also has more public developer-signal than most consumer fintechs in the region thanks to the API Portal, Mini Program platform, and community engineering talks. Those are not superficial marketing signals; they show that Mynt is willing to expose at least some of its partner integration model and engineering workflow.


    The main product-tech risk is not product breadth but observability. The App Store rating is mediocre, official help pages spend real estate on troubleshooting common failures, and there is still no public status page or uptime SLA to anchor reliability. Likewise, the public architecture record remains partial: enough to confirm partner APIs, Mini Programs, redirects, tokenization, and schema-first engineering, but not enough to evaluate runtime concentration risk, cloud failover design, fraud controls at the infrastructure layer, or the scale of API and Mini Program adoption. Before underwriting Mynt as a platform company rather than just a wallet, the committee should request internal architecture reviews, API adoption dashboards, incident history, and formal reliability metrics.'
