chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Parloa operates at the intersection of three overlapping market layers: enterprise contact center AI software
    ($4.89 billion in 2026 per Precedence Research), the broader conversational AI platform market ($13–17 billion),
    and the enormous legacy contact center labor pool ($80 billion in annual agent costs targeted by AI automation).
    Buyer evidence confirms demand is concentrated in large enterprises in financial services, insurance, retail, telecom,
    and utilities. Growth is structurally driven by agent attrition, labor cost pressure, and generative AI capability
    improvements, while adoption constraints center on legacy system integration, EU regulatory compliance, and customer
    trust gaps. Analyst estimates diverge sharply—Precedence Research puts 2026 call center AI at $4.89 billion while
    Fortune Business Insights estimates $2.98 billion—making SAM and SOM isolation speculative without proprietary data.
sections:
  - id: market-boundary
    title: Market Boundary and Included Spend
    body: >-
      Parloa's relevant market is enterprise contact center AI: software platforms and AI agents that automate or
      augment inbound and outbound voice, chat, and messaging interactions handled by large organizations. The company's
      own product surface covers voice-first phone automation, live-agent assist, digital chat, WhatsApp, and Microsoft
      Teams—all anchored to the contact center workflow rather than back-office or analytics functions. This boundary
      explicitly excludes generic productivity AI (copilots for internal tasks), CRM seat licenses, cloud telephony
      infrastructure, and outsourced business process operations that do not purchase AI software.

      The most relevant market layer is the call center AI software segment, which multiple analyst firms estimate at
      $3–5 billion in 2026, growing at 20–27% CAGR. The adjacent CCaaS (Contact Center as a Service) platform market
      sits at roughly $9.4 billion in 2026 and partially overlaps Parloa's addressable market because CCaaS incumbents
      (Genesys, NICE, Five9) are both distribution partners and substitute vendors. Legacy IVR systems represent the
      primary status-quo substitute Parloa displaces, while outsourced BPO agents represent the largest adjacent labor
      pool whose productivity Parloa's platform claims to augment or replace. Parloa's platform is described by the
      company as operating against a $500+ billion global contact center market, but that headline figure includes
      labor, non-AI technology, and outsourcing not directly monetized by an AI software vendor.
