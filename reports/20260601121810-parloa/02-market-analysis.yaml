  - id: TM004
    title: Growth Drivers and Adoption Constraints
    columns:
      - Factor
      - Direction
      - Timing
      - Implication for Parloa
      - Diligence Ask
    rows:
      - - Agent labor cost differential ($6–15 human vs $0.50–0.70 AI per interaction)
        - Driver
        - Current / ongoing
        - Creates compelling ROI case for any enterprise with high call volume
        - Verify Parloa's actual per-interaction cost in production deployments
      - - High agent attrition (30–45% annually) creating perpetual recruiting cost
        - Driver
        - Current / ongoing
        - Automation de-risks dependency on unstable human labor supply
        - Assess whether Parloa's ACM reduces headcount or only augments productivity
      - - 62% of contact centers report agent shortages post-COVID
        - Driver
        - Current
        - Immediate pain point that AI automation can address
        - Validate whether shortage is in automation-friendly simple-query roles vs complex roles
      - - Generative AI NLP capability improvements (LLM accuracy, latency, multilinguality)
        - Driver
        - Current / accelerating
        - Enables higher-fidelity, lower-latency voice automation at lower cost
        - Track model update cadence and dependency on third-party LLM providers
      - - 'Gartner: 56% of customer support interactions to involve agentic AI by mid-2026 (Cisco)'
        - Driver
        - Near-term (2026)
        - Macro tailwind validates category investment; supports enterprise urgency
        - Distinguish agentic AI (Parloa) from simpler chatbot AI in enterprise procurement
      - - EU AI Act mandatory disclosure and human oversight requirements (in force 2026)
        - Constraint
        - Current / ongoing
        - Adds compliance overhead; also opportunity for compliant-by-design platforms
        - Validate that Parloa's platform generates required audit logs and disclosure flows
      - - GDPR data processing restrictions on customer conversation data
        - Constraint
        - Current / ongoing
        - European deployments require data residency and processing controls
        - Confirm Parloa's data processing agreements and EU server locations
      - - FCC proposed AI disclosure rules for contact center calls (US)
        - Constraint
        - Near-term regulatory risk
        - North American deployments may face additional compliance costs
        - Monitor FCC rulemaking timeline and assess Parloa's US disclosure feature readiness
      - - Legacy IVR and CCaaS integration complexity
        - Constraint
        - Current / medium-term
        - Each enterprise deployment requires custom integration work; extends sales cycles
        - Ask for average implementation timelines and integration failure rates
      - - Customer skepticism and public concern about AI replacing human service
        - Constraint
        - Current / growing
        - Some enterprises face reputational risk from deploying voice AI without human escalation
        - Review Parloa's human-fallback design and accessibility commitments
      - - Only 25% of contact centers have fully integrated AI into daily workflows
        - Constraint
        - Current
        - Large majority of enterprises remain in pilot or partial-deployment stage
        - Identify what share of Parloa's revenue comes from recurring vs implementation-only contracts
    notes: >-
      Factors are drawn from Gartner analyst projections, FreJun's Q1 2026 contact center AI report, Voiceflow's 2026
