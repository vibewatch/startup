  - id: buyer-segmentation
    title: Buyer, User, and Payer Segmentation
    body: >-
      Parloa's buyer profile is consistently enterprise: large organizations with significant inbound call or chat
      volume, an existing contact center infrastructure, and a need for AI automation that integrates with CRM,
      telephony, and back-end systems. Verticals evidenced by public case studies include financial services (banking,
      insurance), retail and eCommerce, telecommunications, utilities, healthcare, and information technology. The
      company's own website lists financial services, utilities, eCommerce and retail, healthcare, media and
      entertainment, and IT as target industries.

      Budget ownership in enterprise contact center AI typically involves joint sponsorship between the VP of Customer
      Experience or Chief Customer Officer and the IT or digital transformation function. The vendor selection process
      generally begins with the customer experience team identifying automation requirements, passes through IT for
      security and integration review, and requires procurement sign-off for multi-year platform contracts. Parloa's
      enterprise contract sizes (reportedly $400,000–$2 million annually) imply procurement-level approvals and
      typically 6–18 month sales cycles.

      The adoption trigger is nearly always measurable: rising call volumes without commensurate headcount, high agent
      attrition forcing automation, a mandate to reduce cost per interaction, or a CX transformation initiative
      following competitive pressure. Containment rate—the percentage of interactions resolved without a human agent—
      is the primary KPI for enterprise buyers and is reported at 40–95% depending on integration depth and use case
      complexity in Parloa deployments. SMB and mid-market buyers are not Parloa's primary segment; the platform's
      implementation requirements and pricing structure favor large enterprises with dedicated CX technology teams.
