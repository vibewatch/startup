  - id: market-sizing
    title: Market Sizing — TAM, SAM, and Sizing Constraints
    body: >-
      Public market estimates for the call center AI segment range from $2.98 billion (Fortune Business Insights) to
      $4.89 billion (Precedence Research) in 2026, with CAGR estimates of 20–27% through 2030–2035. FreJun and Grand
      View Research use a narrower base ($1.99 billion in 2024) growing to $7.08 billion by 2030 at 23.8%. The
      divergence reflects genuine methodology differences: definitions vary between "call center AI software" and
      "conversational AI platforms," geographic scopes differ, and some estimates include professional services and
      maintenance while others cover only software licenses. These contradictory estimates cannot be resolved with
      public evidence alone and should be treated as a range bracket, not a single number.

      The broader conversational AI market—which encompasses all automated dialogue systems including chatbots,
      voice assistants, and enterprise copilots—is estimated at $13.6–17.1 billion in 2026, growing at 19–26% CAGR.
      Ringly.io, citing multiple analysts, places the voice AI segment specifically at $22 billion in 2026 across all
      verticals. Gartner's most cited market quantification is an operational metric rather than a software-spend figure:
      conversational AI will reduce contact center agent labor costs by $80 billion globally in 2026, illustrating the
      scale of economic value at stake for buyers even if the software TAM is a small fraction of that number.

      A bottom-up SAM estimate for Parloa is difficult to isolate from public evidence. The company targets enterprises
      with large contact centers (typically 100+ agents) willing to pay $300,000–$2 million annually for platform
      licensing. If the global enterprise contact center agent population is approximately 5–7 million agents in
      organizations that qualify (large enterprises with digital transformation budgets), and Parloa's implied deal
      size is $400,000+ per enterprise, the addressable revenue pool is in the low billions—consistent with the
      analyst range but not independently verifiable from public sources.
