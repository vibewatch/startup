  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: market sizing
      missingEvidence: >-
        Verified SAM and SOM figures for the enterprise contact center AI platform segment, excluding BPO labor,
        CCaaS, and non-AI software spend, from a primary source such as an industry filing or regulatory disclosure.
      whyItMatters: >-
        Without a verified SAM, the $2.98B–$4.89B analyst bracket cannot be attributed to Parloa's specific
        addressable slice, making revenue multiple analysis speculative and valuation sensitivity analysis unreliable.
      diligencePath: >-
        Request Parloa's internal market sizing model and segment revenue breakdown; cross-check against Gartner
        Magic Quadrant for CCaaS and Gartner Market Guide for Conversational AI Platforms for enterprise segment
        decomposition.
      relatedQuestionRefs:
        - QM007
    - type: conflicting-data
      severity: material
      topic: market sizing
      missingEvidence: >-
        Independent resolution of the $2.98B (Fortune Business Insights) versus $4.89B (Precedence Research)
        call center AI market size discrepancy for 2026, including access to methodology notes.
      whyItMatters: >-
        A 60%+ divergence between leading analyst estimates means CAGR-based growth projections are unreliable
        as a single reference and should be treated as a range bracket, not a consensus estimate. Investors
        anchoring on either figure alone will over- or under-estimate Parloa's addressable growth opportunity.
      diligencePath: >-
        Purchase the primary Precedence Research and Fortune Business Insights reports to compare boundary
        definitions and methodologies. Cross-reference with Gartner or IDC proprietary contact center AI reports
        (available by subscription) for independent triangulation.
      relatedQuestionRefs:
        - QM002
        - QM023
    - type: private-evidence-only
      severity: material
      topic: buyer segmentation
      missingEvidence: >-
        Quantitative segment-level AI adoption readiness data comparing financial services, insurance, retail,
        telecom, and healthcare contact centers from an independent industry survey or benchmark study.
      whyItMatters: >-
        Without quantified segment penetration data, the assertion that financial services and insurance are
        Parloa's strongest near-term segments rests on qualitative case study evidence and cannot be used to
        estimate market penetration rates or segment-specific revenue upside.
      diligencePath: >-
        Obtain Gartner's annual Customer Service and Support Leader Survey or Forrester's CX automation survey
        for quantified segment-level AI adoption benchmarks. Request Parloa's internal segment revenue breakdown
        as part of due diligence data room access.
      relatedQuestionRefs:
        - QM024
        - QM010
