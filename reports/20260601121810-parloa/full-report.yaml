chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Business Model
        blocks:
          - type: paragraph
            body: >
              Parloa was founded in 2018 in Berlin, Germany, by Malte Kosub and Stefan Ostwald with the belief that
              every great conversation is the start of a lasting relationship. Today the company identifies as the
              industry-leading AI agent management platform built for enterprise customer service. Parloa's flagship
              offering is the AI Agent Management Platform (AMP), which enables enterprises to design, test, deploy, and
              continuously improve fleets of AI agents that handle customer interactions across voice, chat, and
              messaging channels without extensive coding. The platform orchestrates the full AI agent lifecycle—from
              Parloa Studio design and pre-built skills through rigorous simulation testing, omnichannel deployment, and
              real-time monitoring via insights dashboards. Parloa differentiates by managing entire fleets of
              autonomous agents rather than isolated bots, providing enterprises with a single control plane for agentic
              AI at scale. The company's approach was voice-first from inception, imposing tighter technical constraints
              around latency, real-time reasoning, accent recognition, and emotional sensitivity—capabilities that now
              underpin its multi-channel product. AMP supports 130-plus languages, integrates with CCaaS, CRM, and ERP
              systems, and meets enterprise compliance standards including GDPR, SOC 2, ISO 27001, HIPAA, and PCI DSS.
              Parloa's business model is a SaaS subscription to AMP, targeting large enterprises in financial services,
              e-commerce and retail, travel and hospitality, utilities, healthcare, and information technology. The
              company is headquartered in Berlin, with its US operations anchored at midtown Manhattan in New York, plus
              offices in Munich and London as of April 2026, and planned expansion into San Francisco and Madrid. A
              Global Partner Program launched in late 2025 includes over 100 partner organizations such as Accenture,
              Deloitte, PwC Germany, Microsoft, NTT, and Verint, extending Parloa's distribution and delivery reach.
