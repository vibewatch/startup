      - number: '6.3'
        title: Retention, Durability, and Expansion Economics
        blocks:
          - type: paragraph
            body: >
              Parloa's most striking retention signal is a disclosed 150% net revenue retention (NRR) for full-year
              2025, meaning the revenue base from each cohort grew by 50% in the following year through expansions— new
              channels, additional languages, more agents, or new geographies—after accounting for any churn. This
              figure, confirmed by the company's official December 2025 announcement and cross-referenced by Sacra and
              Latka, is elite by enterprise SaaS standards where best-in-class NRR typically ranges 105–130%. The 150%
              NRR is consistent with Swiss Life expanding from one pilot division to all four sales divisions and SAP
              extending Parloa from an IT pilot to production workforce support. However, Parloa has not disclosed gross
              revenue retention (GRR), logo churn rates, or cohort-level attrition, which are critical for assessing
              customer durability independent of expansion noise. Contract length is similarly opaque: enterprises
              deploying at $300K+ ACV are presumed to operate under multi-year agreements standard for this price band,
              but average tenure, renewal rates, and early-termination provisions are unknown. Customer satisfaction
              data—where available—is positive: Swiss Life reported 73% of callers rating the AI agent 4–5 out of 5, and
              Berlin Brandenburg Airport's Berry agent achieved 85% CSAT. At the platform level, FeaturedCustomers
              records a 4.8/5.0 composite score across 841 rating events. The absence of GRR disclosure is the primary
              durability gap: a 150% NRR with 80% GRR is qualitatively different from one with 95% GRR, and the
              difference matters substantially for cohort terminal value modeling.
            claimRefs:
