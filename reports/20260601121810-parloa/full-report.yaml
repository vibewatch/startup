      with comparable NRR profiles. Actual GRR could deviate materially. Do not use for financial modeling without
      confirmation from Parloa's CFO.
    claimRefs:
      - CU028
      - CU030
      - CU031
  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Probability, impact, mitigation maturity, and residual severity for Parloa’s highest-risk clusters as of June
      2026.
    data:
      columns:
        - Probability
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Hyperscaler distribution pressure
          values:
            - label: high
              tone: negative
              detail: Amazon and Google already own budget and cloud relationships.
            - label: high
              tone: negative
              detail: Win-rate pressure can affect growth and pricing simultaneously.
            - label: medium
              tone: warning
              detail: Partner program and SAP channel help, but not symmetrically.
            - label: high
              tone: negative
              detail: This is the dominant strategic risk cluster.
        - label: EU AI Act / privacy execution
          values:
            - label: high
              tone: negative
              detail: Phased obligations continue through 2027.
            - label: high
              tone: negative
              detail: Compliance failures would hit trust and sales velocity.
            - label: medium
              tone: warning
              detail: Governance pitch exists, but public proof remains limited.
            - label: medium-high
              tone: warning
              detail: Manageable, but expensive and persistent.
        - label: Cognigy / NICE direct competition
          values:
            - label: medium-high
              tone: warning
              detail: Overlap is strongest in European enterprise CX.
            - label: high
              tone: warning
              detail: Direct peer losses can reset category narrative.
            - label: medium
              tone: warning
              detail: Parloa retains room to differentiate in regulated voice workflows.
            - label: medium-high
              tone: warning
              detail: A credible but not fatal threat.
        - label: DACH concentration
          values:
            - label: medium
              tone: warning
              detail: Public proof is skewed to German-speaking insurance and service logos.
            - label: medium-high
              tone: warning
              detail: Limited disclosed breadth caps TAM narrative.
            - label: medium
              tone: warning
              detail: Expansion is possible but execution-heavy.
            - label: medium
              tone: warning
              detail: Moat and ceiling at the same time.
        - label: LLM commoditization / cost pressure
          values:
            - label: medium-high
              tone: warning
              detail: Baseline features diffuse quickly in AI CX.
            - label: medium-high
              tone: warning
              detail: Can compress price and margin over time.
            - label: low-medium
              tone: warning
              detail: Requires stronger proof on workflow, governance, and economics.
            - label: medium-high
              tone: warning
              detail: Longer-term but real structural risk.
    approximationNotes: Ordinal ratings are analytical assessments based on the cited sources, not actuarial probabilities.
    claimRefs:
      - CR003
      - CR008
      - CR011
      - CR015
      - CR026
      - CR034
      - CR035
      - CR036
      - CR037
      - CR038
      - CR044
