  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Anchor and Recommendation
        blocks:
          - type: paragraph
            body: >-
              The primary public underwriting anchor for Parloa is now the January 15, 2026 Series D: $350 million of
              new capital at a $3 billion valuation. That round tripled the company's price in roughly eight months from
              the May 2025 $1 billion Series C and is therefore far more relevant than earlier rumor-driven step-ups.
              Using roughly $52 million of full-year 2025 ARR implies an ARR multiple of about 58x. That is dramatically
              above mature public CCaaS levels such as Five9 at roughly 1.7x and well above the closest direct strategic
              exit marker, Cognigy's roughly $955 million sale, even if US AI-native peers such as Sierra and Decagon
              currently trade at richer narrative-heavy marks. At 58x, Parloa is being priced into continued hypergrowth
              and margin expansion with little cushion for execution misses. General Catalyst leading the round at board
              level, plus continued participation from EQT Ventures, Altimeter Capital, Durable Capital Partners, and
              Mosaic Ventures, are meaningful signals that informed investors support the price. But disclosure gaps,
              the persistent Europe discount, and intense competition mean confidence should stay medium. The right
              conclusion is Research More rather than Buy: the premium is now very high and requires both continued
              growth and much better validation of margins, GRR, and revenue quality.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
