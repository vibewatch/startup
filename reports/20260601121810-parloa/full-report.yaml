  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Compliance Risk
        blocks:
          - type: paragraph
            body: >-
              Parloa’s sharpest exogenous risk is that enterprise customer-service AI in Europe is moving from a
              low-friction innovation category into a governed software category. The EU AI Act does not ban mainstream
              customer-service automation, but it does force deployers to think in terms of transparency, oversight,
              supplier allocation of responsibilities, and staged implementation deadlines rather than feature shipping
              alone. For a vendor like Parloa, that matters twice: first because banks and insurers already buy with
              legal and privacy teams in the room, and second because the product itself is sold as a trusted
              orchestration layer for voice and chat. The AI Act therefore increases pre-sales burden, audit work,
              documentation overhead, and procurement scrutiny. EDPB guidance also makes clear that AI-specific
              obligations do not replace GDPR duties, so call recording, identity data, complaint handling, and any
              emotion-adjacent inference create compliance workstreams that remain real even when product accuracy is
              strong. In practice, the regulatory risk is not existential, but it raises cost-to-serve and can slow
              deployment velocity in the exact verticals where Parloa has its deepest traction.
            claimRefs:
