      - number: '6.4'
        title: Concentration Risks and Procurement Dynamics
        blocks:
          - type: paragraph
            body: >
              Parloa's revenue is vertically concentrated: insurance, banking, retail, and telecom collectively account
              for more than 70% of ARR, so a macro downturn in any single vertical—particularly the insurance sector,
              which has the deepest named-reference density—would disproportionately affect pipeline and churn
              simultaneously. Customer concentration by account is also material: with approximately 150 enterprise
              customers and an estimated average contract value near $333K, the top five accounts likely represent a
              high single-digit to low double-digit share of total ARR, and the multi-million dollar Teleperformance and
              HealthEquity deals announced in 2025 are large enough to be individually meaningful. To address this,
              Parloa formally launched its Global Partner Program in September 2025, enrolling more than 100
              organizations including Accenture, Deloitte, PwC Germany, Microsoft, NTT, and Verint to enable partner-led
              co-selling, implementation, and managed services. SAP's strategic investment and the planned SAP Endorsed
              App certification in the SAP Store create an additional channel into SAP's installed base of hundreds of
              thousands of enterprises. From a procurement-friction standpoint, Parloa's pricing model is custom-quoted
              with a reported minimum annual commitment of approximately $300,000—with no published pricing and no free
              trial—creating a high evaluation threshold that extends sales cycles and excludes smaller pilots.
              Third-party competitive reviews have flagged this as a consistent friction point. The combination of high
              ACV, long sales cycles, and concentrated vertical exposure means Parloa's near-term growth trajectory is
              sensitive to the performance of a small number of large, complex deals.
