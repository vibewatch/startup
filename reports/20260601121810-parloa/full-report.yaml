  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: Bear, base, and bull value ranges for Parloa using public evidence as of the June 2026 run date.
    data:
      items:
        - label: Bear case
          low: 1200
          mid: 1600
          high: 2000
          displayValue: $1.2B-$2.0B
          detail: Slower growth, sharper competition, and heavy multiple compression.
          tone: negative
        - label: Base case
          low: 2500
          mid: 3000
          high: 3500
          displayValue: $2.5B-$3.5B
          detail: Public evidence supports a fair-value band only if Parloa grows into the mark.
          tone: warning
        - label: Bull case
          low: 4500
          mid: 5250
          high: 6000
          displayValue: $4.5B-$6.0B
          detail: Requires sustained hypergrowth plus successful international scaling.
          tone: positive
    approximationNotes: >-
      Ranges are scenario outputs expressed in USD millions and anchored to the public ARR range plus multiple
      assumptions.
