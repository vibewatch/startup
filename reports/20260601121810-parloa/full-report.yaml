  - id: FM001
    title: Market Sizing Lens — TAM to Addressable Software Layer
    type: pyramid
    layout: standard
    summary: >-
      The economic value pool from contact center labor dwarfs the current software market; Parloa operates in the AI
      software layer that is expanding rapidly as a share of that addressable pool.
    data:
      nodes:
        - label: 'Total contact center labor cost addressable by AI: ~$80B in 2026'
          detail: >-
            Gartner projection of global agent labor cost savings from conversational AI by 2026; represents the
            economic ceiling for AI software capture, not actual software spend.
          tone: neutral
        - label: 'Global contact center market (all tech + labor): ~$480–496B by 2026–2027'
          detail: >-
            Ringly.io citing PR Newswire market research; includes BPO labor, CCaaS, IVR, and non-AI technology; far
            exceeds the AI software TAM.
          tone: neutral
        - label: 'CCaaS (cloud contact center platform) market: ~$9.4B in 2026'
          detail: >-
            Adjacent platform layer where CCaaS incumbents are building AI capabilities; overlaps Parloa's distribution
            channels and competitive surface.
          tone: neutral
        - label: 'Call Center AI software market: $2.98B–$4.89B in 2026'
          detail: >-
            Range from Fortune Business Insights ($2.98B) to Precedence Research ($4.89B); Parloa's direct market
            segment growing at 20–27% CAGR.
          tone: positive
    approximationNotes: >-
      This pyramid is a conceptual sizing lens, not a strict financial cascade; layers are drawn from different analyst
      sources with different scope definitions and cannot be summed or directly compared. USD values are as published;
      midpoints are not computed.
    claimRefs:
