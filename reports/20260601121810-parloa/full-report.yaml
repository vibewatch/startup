  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Customer Workflows
        blocks:
          - type: paragraph
            body: >
              Parloa's core product is the AI Agent Management Platform (AMP), a software layer that allows large
              enterprises to build, test, deploy, and continuously improve AI agents handling customer conversations at
              scale. Rather than a standalone chatbot or IVR, AMP positions itself as a full-lifecycle orchestration
              system: enterprise teams design agent personas, integrate them with backend systems, simulate real
              conversations at scale, deploy across every channel, and monitor outcomes through observability
              dashboards.

              In practice, a Parloa deployment sits in the path of every inbound customer contact — phone, web chat,
              WhatsApp, Microsoft Teams, or click-to-call. The AI agent interprets natural-language intent,
              authenticates the caller, queries the relevant enterprise record system (CRM, ERP, or knowledge base), and
              executes the required action — scheduling, refund, routing, information delivery — before closing the loop
              or handing off to a human agent with full context. The voice-first orientation means the platform is
              optimized around telephone audio quality, low end-to-end latency (typically 700–900 ms), and seamless
              escalation paths rather than web-centric chatbot paradigms.

              Key customer workflow benefits cited in third-party and partner documentation include 97% routing
              accuracy, 75% order conversion rate uplift, and 60% faster call resolution. The BarmeniaGothaer deployment
              ("Mina") reduced switchboard workload by 90% and improved NPS by 169%. These outcomes depend on tight
              integration with back-end systems and high-quality training data, both of which constitute ongoing
              implementation requirements rather than out-of-box defaults.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE012
              - CE016
          - type: table
            tableRef: TE002
            claimRefs:
              - CE016
              - CE028
