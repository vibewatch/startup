      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The evidence is good enough to respect the mark, not to treat it as cheap
            body: >-
              The $3B Series D was a real financing led by General Catalyst with prior investors re-upping, and Parloa
              still has real enterprise proof. That keeps the case constructive even though the valuation premium is now
              much higher than it was at Series C.
            calloutType: strength
            claimRefs:
              - CV018
