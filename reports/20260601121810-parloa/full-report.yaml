          - type: callout
            title: 58x ARR leaves little room for underwriting error
            body: >-
              At roughly 58x ARR on about $52M of 2025 ARR, the round price already assumes continued hypergrowth and
              strong software economics. Without public GRR, gross margin, and regional-mix data, even a modest
              execution miss could create severe downside.
            calloutType: risk
            claimRefs:
              - CV023
              - CV024
              - CV037
              - CV039
          - type: callout
            title: Research More before underwriting the $3B entry
            body: >-
              Parloa may yet grow into the price, but investors should require audited ARR quality, margin evidence, and
              retention data before upgrading the stance. General Catalyst''s conviction helps, but it is not a
              substitute for operating proof.
            calloutType: recommendation
            claimRefs:
