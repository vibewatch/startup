      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              Parloa was co-founded by Malte Kosub, who serves as CEO, and Stefan Ostwald, who serves as Chief AI
              Officer (CAIO). Kosub brings prior experience building voice and conversational AI systems and advising
              enterprises on spoken-interface strategy; he is the primary public spokesperson and strategic driver.
              Ostwald leads AI research and platform architecture, having credited Parloa's voice-first origins with
              forcing early solutions to the hardest problems—latency, emotion, interruptions, real-time
              orchestration—that now provide durable technical advantage. The two founders sit atop a concentrated
              leadership structure representing meaningful key-person risk. The C-suite has expanded significantly since
              the Series C raise. Latané Conant joined as Parloa's first-ever Chief Marketing Officer following the
              unicorn milestone, bringing enterprise marketing experience from prior leadership roles. Chris Silver was
              appointed Chief Revenue Officer to scale the go-to-market function. Csaba Tamas serves as Chief Product
              Officer and Tino Mittelmeier as Chief Financial Officer. Governance is structured under a German-style
              two-tier system. Jens Rassloff chairs the Supervisory Board. Following the January 2026 Series D, General
              Catalyst CEO Hemant Taneja and President and Managing Director Jeannette zu Fürstenberg were both added to
              the Supervisory Board, elevating investor representation and signaling General Catalyst's deep conviction
              in the company's direction. Beyond the Supervisory Board, specific investor board rights,
              independent-director composition, and cap-table governance terms are not publicly disclosed—a diligence
              gap for later review. Angel investors from Stripe, Databricks, Microsoft, Celonis, Datadog, and Personio
              are also on the cap table alongside notable German football personalities Mario Götze and Bastian
              Schweinsteiger.
