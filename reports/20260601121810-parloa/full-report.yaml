              Swiss Life Germany, where Parloa's AI agent is now active across all four sales divisions after a
              successful pilot, cutting call resolution time by 60% and achieving 96% routing accuracy (73% of callers
              rated the agent 4 or 5 out of 5); ATU automotive services, where Parloa eliminated peak-season
              understaffing—achieving 100% phone availability and reducing employee telephone workload by 60%, with the
              AI agent autonomously handling approximately 60% of inquiries; Medien Hub Bremen-Nordwest, which went live
              in just six weeks and automated 30% of standard complaint calls while reducing agent authentication burden
              by 70%; and Berlin Brandenburg Airport, whose "Berry" AI voice agent powered by Parloa won the 2025 Future
              Travel Experience award for Most Innovative Airport Initiative and achieved 85% customer satisfaction.
              HealthEquity began a phased rollout of Parloa's agentic AI for voice, mobile-app, and web-based member
