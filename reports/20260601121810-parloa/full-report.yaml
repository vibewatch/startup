            title: Elite NRR Signals Durable Land-and-Expand
            body: >
              A disclosed 150% NRR is a standout retention metric that places Parloa in the top tier of enterprise SaaS
              vendors globally. Swiss Life's full-division rollout after a single-division pilot and SAP's deepening
              from IT concierge to strategic investment are live examples of the expansion dynamic. When combined with
