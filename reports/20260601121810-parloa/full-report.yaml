  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              Parloa enters 2026 in a competitive landscape that divides into four overlapping rings: direct agentic AI
              peers (Cognigy/NICE, PolyAI, Uniphore), incumbent CCaaS platform leaders (Genesys Cloud CX, NICE CXone,
              Five9), adjacent platform substitutes (Microsoft Copilot Studio, Salesforce Agentforce), and the implicit
