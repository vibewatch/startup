  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Enterprise-value-style sensitivity using ARR assumptions and 2026 AI-software multiple bands.
    data:
      items:
        - label: $52M ARR @ 40x
          value: 2080
          detail: USD millions; base-relevant level if Parloa remains premium but not peak-valued.
          tone: warning
        - label: $52M ARR @ 58x
          value: 3016
          detail: USD millions; approximately the January 2026 Series D mark.
          tone: neutral
        - label: $75M ARR @ 40x
          value: 3000
          detail: USD millions; base-case outcome if ARR expands and the multiple normalizes.
          tone: positive
        - label: $100M ARR @ 45x
          value: 4500
          detail: USD millions; bull case requiring both scale and premium durability.
          tone: positive
        - label: $60M ARR @ 25x
          value: 1500
          detail: USD millions; bear case if growth slows and multiples compress hard.
          tone: negative
    approximationNotes: Values are simple multiple bridges, not discounted cash flow outputs.
