  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      How growth, customer proof, benchmark discipline, and data gaps combine into a Research More recommendation with
      medium confidence.
    data:
      nodes:
        - id: growth
          label: 117% growth + 150% NRR
          detail: Growth quality still supports a premium to mature CCaaS comps.
          tone: positive
        - id: proof
          label: Enterprise customer proof
          detail: Named customers and real deployment depth reduce product-market-fit doubt.
          tone: positive
        - id: price
          label: $3B Series D entry
          detail: ~58x ARR on ~$52M; aggressive even for hypergrowth AI-native software.
          tone: warning
        - id: discount
          label: Europe / private discount
          detail: Geography and opacity argue for discipline versus the richest US AI multiples.
          tone: warning
        - id: gaps
          label: Disclosure gaps
          detail: GRR, gross margin, and regional mix remain private.
          tone: warning
        - id: output
          label: Research More / stretched / medium confidence
          detail: Constructive, but only after diligence confirms the business can grow into the mark.
          tone: neutral
      edges:
        - from: growth
          to: price
        - from: proof
          to: price
        - from: discount
          to: output
        - from: gaps
          to: output
        - from: price
          to: output
    approximationNotes: null
