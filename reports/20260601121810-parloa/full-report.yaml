  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation
        blocks:
          - type: paragraph
            body: >
              Parloa operates as a pure-play B2B SaaS vendor serving large enterprises and Mittelstand firms that handle
              high volumes of inbound customer interactions. Insurance, banking, retail, and telecommunications
              collectively account for more than 70% of Parloa's revenue, based on third-party market analysis. The
              company's marquee insurance customers include Swiss Life Germany, Allianz Partners, HealthEquity,
              Sedgwick, BarmeniaGothaer, Münchener Verein, and Helvetia, making financial services the deepest vertical
              concentration by named reference count. Retail is anchored by IKEA (Ingka Group), Decathlon, HSE, ATU, and
              Nord-Ostsee Automobile. Travel and hospitality clients include Booking.com and Berlin Brandenburg Airport.
              Enterprise technology is represented by SAP and TeamViewer, and media/publishing adds Medien Hub
              Bremen-Nordwest. The typical Parloa customer operates a contact center with 500-plus agents and targets
              automating 40–60% of routine voice and chat interactions to reduce cost-per-contact and raise NPS.
              Decision authority lies with CIOs, Heads of Customer Experience, and Digital Transformation leaders aged
              35–55, whose KPIs prioritize SLA adherence, multilingual coverage, and measurable ROI. Geographically,
              Parloa's installed base is weighted toward the DACH region, with rapid expansion underway in North America
              following the May 2025 Series C and the establishment of a US headquarters in midtown Manhattan. Emerging
              verticals—public sector and healthcare—have grown faster than the core since 2024, driven by AI-enabled
              citizen services and the high-profile HealthEquity deployment covering 17 million HSA members.
