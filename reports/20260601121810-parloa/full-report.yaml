            body: >
              Parloa surpassed $50 million in annual recurring revenue (ARR) by December 2025—confirmed in official
              company announcements—representing approximately 117% year-over-year growth from an estimated $24 million
              at end-2024, according to independent research firm Sacra. The company's WAVE 2025 summit in Berlin
              attracted more than 600 customers, partners, and enthusiasts from around the world, with speakers from
              IKEA, Allianz Partners, and Booking.com presenting live. FeaturedCustomers aggregates 22 testimonials, 16
