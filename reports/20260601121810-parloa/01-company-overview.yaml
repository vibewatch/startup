  - id: milestones-partnerships-risks
    title: Milestones, Partnerships, and Adverse Signals
    body: >
      Parloa has accumulated a dense sequence of financing, product, and partnership milestones across
      its eight-year history. The founding in 2018 was followed by an undisclosed Series A (believed
      2023), the $66M Series B in April 2024, and the launch of AMP—described as the industry's first
      agentic AI platform built specifically for enterprise contact centers—in the 12 months prior to
      the May 2025 Series C. By late 2025, Parloa had achieved unicorn status, surpassed $50M ARR,
      posted 150% NRR, and launched a Global Partner Program with 100-plus member organizations.
      The January 2026 Series D tripled its valuation to $3B. In April 2026, Parloa published the
      "State of Agentic CX in 2026" report, a large-scale benchmark in which AI agents mystery-shopped
      10,000 enterprise websites and conducted nearly 4,000 chat interactions across 800 companies.
      The report found that 43.3% of Global 2000 websites lacked any visible customer support phone
      number or chat, and fewer than 1 in 11 chat interactions resolved the customer's stated goal—
      positioning Parloa as a credible industry voice while simultaneously validating its TAM thesis.
      In May 2026, Parloa deepened its partnership with SAP, integrating Parloa AI agents into SAP
      Service Cloud, with SAP also becoming a direct enterprise customer using the platform for
      internal IT concierge support. On the adverse side, third-party analysis from BuiltIn characterizes
      Parloa as "not the undisputed global leader" with "intense, well-funded rivals" and notes that
      "parts of the platform's agent management and testing workflows are still maturing." TechCrunch
      observed that Parloa's $50M ARR is "not meaningfully ahead" of PolyAI's $40M or Decagon's
      estimated revenue, raising questions about whether the 3x valuation jump from Series C to Series D
      is fully justified by commercial differentiation. The Klarna episode—in which the Swedish
      buy-now-pay-later company aggressively cut human support roles, then walked back those decisions—
      serves as a category-wide caution that enterprise AI automation rollouts can stall or reverse.
      Parloa's rapid headcount growth from 380 to a targeted 600 employees by end-2026, combined with
      still-evolving US brand presence, adds execution risk to the otherwise strong growth narrative.
