  - calloutType: risk
    title: "ARR Parity With Well-Funded Rivals Questions Valuation Premium"
    body: >
      Parloa's $50M ARR is comparable to PolyAI's projected $40M and Decagon's estimated $30M+,
      while Parloa's $3B valuation is substantially above PolyAI's $750M and below Sierra's $10B.
      The implied 60× ARR multiple is achievable only if Parloa can sustain hypergrowth while
      building a durable advantage beyond capital scale. Independent analysis flags that parts of
      the AMP platform's agent management and testing workflows are still maturing.
    claimRefs:
      - CO042
      - CO043
      - CO044
      - CO045

