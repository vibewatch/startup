  - id: scale-metrics
    title: Scale, Traction, and Key Metrics
    body: >
      Parloa's most recent public financial metrics position it as a fast-growing enterprise SaaS
      company within the agentic AI space. The company reported ARR exceeding $50M by late 2025, ahead
      of the January 2026 Series D announcement. Revenue quadrupled between the April 2024 Series B
      and the May 2025 Series C—a 12-month period that coincided with the launch of AMP, the company's
      flagship enterprise platform. Parloa's newsroom has cited 150% net revenue retention as of late
      2025, a figure that, if accurate, indicates strong expansion revenue within its enterprise
      customer base. Headcount has grown rapidly: approximately 250 people at Series B (April 2024),
      approximately 300 at Series C (May 2025), 380 at the time of the Series D (January 2026), and
      approximately 430 by April 2026. The company has publicly targeted 600 employees by end of 2026,
      with hiring focused on engineering and sales. Named enterprise customers include Allianz,
      Booking.com, HealthEquity, SAP, Sedgwick, Swiss Life, TeamViewer, and IKEA, with Parloa
      describing its customer base as including multiple Fortune 200 companies. Exact customer count,
      gross margin, and profitability figures are not publicly disclosed. The total addressable workforce
      Parloa is targeting—contact center agents—is estimated by Gartner at 17 million globally,
      underpinning the scale of the market opportunity. Independent commentary suggests Parloa's $50M
      ARR, while meaningful, is not dramatically ahead of competitors: PolyAI reported expected 2025
      ARR of $40M and Decagon "significantly more" than $30M ARR, while Sierra's $10B valuation
      implies a much larger ARR or premium multiple. The implied ARR multiple on Parloa's $3B
      valuation is approximately 60x—reflecting both growth rate expectations and competitive
      positioning premium rather than near-term profitability.
