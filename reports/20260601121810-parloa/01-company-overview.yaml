      Parloa tripled its valuation from $1B to $3B in just eight months between the Series C
      (May 2025) and Series D (January 2026), driven by ARR surpassing $50M and 150% NRR.
      General Catalyst CEO Hemant Taneja's participation on the Supervisory Board—a top-10
      Forbes Midas List investor—adds board-level strategic credibility rarely seen at this stage.
    claimRefs:
