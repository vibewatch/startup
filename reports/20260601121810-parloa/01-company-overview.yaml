  - id: funding-capital
    title: Funding History and Investor Landscape
    body: >
      Parloa has raised over $560M in primary venture capital across four disclosed rounds in less than
      four years. The company raised $66M in its Series B in April 2024, led by Altimeter Capital,
      with participation from EQT Ventures, Newion, Senovo, Mosaic Ventures, and La Famiglia Growth.
      Twelve months later, in May 2025, Parloa raised $120M in its Series C at a $1B valuation, led
      by Durable Capital Partners, Altimeter Capital, and General Catalyst, with further participation
      from EQT Ventures, RPT Capital, Senovo, and Mosaic Ventures—making Parloa the first German AI
      unicorn of 2025. Just seven months after the Series C, on January 15, 2026, Parloa closed a
      $350M Series D at a $3B valuation, led by General Catalyst with returning support from EQT
      Ventures, Altimeter Capital, Durable Capital Partners, and Mosaic Ventures. The $3B valuation
      represented a 3x increase over the Series C price in less than eight months. In connection with
      the Series D, SAP made a strategic investment in Parloa, subsequently deepening a commercial
      partnership integrating Parloa's agents into SAP Service Cloud. There is no public evidence of
      debt facilities, convertible instruments, or secondary transactions. The investor base spans
      leading growth-stage funds from the US and Europe, providing both capital depth and distribution
      network access across the DACH region and North America. EQT Ventures, Altimeter Capital, and
      Mosaic Ventures have participated in three consecutive rounds, signaling strong insider
      conviction. General Catalyst—whose CEO Hemant Taneja has top-10 Forbes Midas List standing—
      joined at Series C and led the Series D, adding Supervisory Board representation.
