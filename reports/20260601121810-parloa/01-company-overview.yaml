  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financials
      missingEvidence: Audited financial statements including gross margin, operating loss, EBITDA, and cash burn rate.
      whyItMatters: Without profitability metrics, assessing sustainable growth and path to break-even is speculative; the implied 60x ARR multiple at $3B valuation depends heavily on assumptions about margin expansion.
      diligencePath: Request audited financials via direct company contact or obtain Series D investor deck with unredacted financials.
      relatedQuestionRefs:
        - QO008
      relatedTableRefs:
        - TO001

    - type: private-evidence-only
      severity: material
      topic: customer-count
      missingEvidence: Total number of paying enterprise customers and average contract value (ACV).
      whyItMatters: Customer concentration risk is undetermined; if a small number of large accounts drive $50M ARR, churn of one or two logos would be material.
      diligencePath: Request commercial metrics (customer count, ACV, logo churn) via company or Series D data room.
      relatedQuestionRefs:
        - QO019
      relatedTableRefs:
        - TO001

    - type: missing-source
      severity: minor
      topic: regulatory-legal
      missingEvidence: Comprehensive regulatory check for any EU AI Act obligations, GDPR enforcement actions, lawsuits, or employee disputes involving Parloa.
      whyItMatters: As an AI company handling sensitive customer conversations for insurers and financial institutions, any regulatory adverse action would affect enterprise sales cycles.
      diligencePath: Search EU AI Act notified body registers, German data protection authority (BfDI) records, and Bundesanzeiger filings; request legal representation letter from company counsel.
      relatedQuestionRefs:
        - QO026

    - type: missing-source
      severity: minor
      topic: revenue-retention
      missingEvidence: Independent third-party verification of the reported 150% net revenue retention figure.
      whyItMatters: NRR is a critical SaaS quality metric; a company-only disclosure cannot be relied upon without auditor or investor corroboration.
      diligencePath: Request NRR calculation methodology and cohort data from the company; cross-reference with investor statements in annual LP communications.
      relatedQuestionRefs:
        - QO020
        - QO027
      relatedTableRefs:
        - TO001

    - type: enumeration-incomplete
      severity: minor
      topic: board-governance
      missingEvidence: Full Supervisory Board member roster beyond Jens Rassloff (Chairman), Hemant Taneja, and Jeannette zu Fürstenberg; investor board rights and independent director representation.
      whyItMatters: German GmbH or AG governance structures grant specific investor rights; full board composition is required to assess independence and potential conflicts.
      diligencePath: Request official Supervisory Board resolution or commercial register excerpt (Handelsregister) from the company.
      relatedQuestionRefs:
        - QO006
      relatedTableRefs:
        - TO002

    - type: private-evidence-only
      severity: material
      topic: cap-table
      missingEvidence: Equity ownership percentages, investor governance rights, liquidation preferences, and pro-rata rights for each investor in the cap table.
      whyItMatters: Without cap table details, it is impossible to determine economic return scenarios, control dynamics, or alignment between founders and financial investors.
      diligencePath: Request capitalization table and investor rights agreement from company counsel or Series D data room.
      relatedQuestionRefs:
        - QO007
      relatedTableRefs:
        - TO003

    - type: missing-source
      severity: minor
      topic: first-mover-claim
      missingEvidence: Independent corroboration that Parloa's AMP was truly the first agentic AI platform purpose-built for enterprise contact centers, distinguishing it from earlier AI assistant or bot platforms.
      whyItMatters: The "industry's first" claim is a central positioning statement; if credible competitors launched similar enterprise agentic orchestration platforms before or contemporaneously with AMP, the differentiation narrative weakens.
      diligencePath: Survey analyst reports (Gartner MQ for Conversational AI, Forrester Wave for Intelligent Automation) from 2023-2024 and compare product release dates of Sierra, PolyAI, Kore.ai, and Genesys AI.
      relatedQuestionRefs:
        - QO012

    - type: enumeration-incomplete
      severity: minor
      topic: early-milestones
      missingEvidence: Documented milestones from Parloa's founding year (2018) through the Series A (~2023), including product releases, initial customer wins, team building events, and any pivots.
      whyItMatters: The pre-Series B operating history is largely undocumented in public sources, making it difficult to assess founding team's execution track record and how the voice-first strategy evolved.
      diligencePath: Review German startup press coverage from 2018-2023, LinkedIn founding team profiles, and request company timeline documentation.
      relatedTableRefs:
        - TO004

