  - id: adoption-trajectory-and-named-proof
    title: Adoption Trajectory and Named Customer Proof
    body: >
      Parloa surpassed $50 million in annual recurring revenue (ARR) by December 2025—confirmed in
      official company announcements—representing approximately 117% year-over-year growth from an estimated
      $24 million at end-2024, according to independent research firm Sacra. The company's WAVE 2025 summit
      in Berlin attracted more than 600 customers, partners, and enthusiasts from around the world, with
      speakers from IKEA, Allianz Partners, and Booking.com presenting live. FeaturedCustomers aggregates 22
      testimonials, 16 case studies, and a 4.8/5.0 composite rating across 841 reference ratings for
      Parloa's platform, underscoring broad commercial adoption. Named production deployments with
      quantified outcomes include: Swiss Life Germany, where Parloa's AI agent is now active across all four
      sales divisions after a successful pilot, cutting call resolution time by 60% and achieving 96%
      routing accuracy (73% of callers rated the agent 4 or 5 out of 5); ATU automotive services, where
      Parloa eliminated peak-season understaffing—achieving 100% phone availability and reducing employee
      telephone workload by 60%, with the AI agent autonomously handling approximately 60% of inquiries;
      Medien Hub Bremen-Nordwest, which went live in just six weeks and automated 30% of standard
      complaint calls while reducing agent authentication burden by 70%; and Berlin Brandenburg Airport,
      whose "Berry" AI voice agent powered by Parloa won the 2025 Future Travel Experience award for Most
      Innovative Airport Initiative and achieved 85% customer satisfaction. HealthEquity began a phased
      rollout of Parloa's agentic AI for voice, mobile-app, and web-based member support in November 2025,
      expanding through 2026. SAP is both a strategic investor and an enterprise customer, having deployed
      Parloa AMP for internal IT concierge support for its global workforce. A multi-million dollar contract
      with Teleperformance (TP) was announced as a 2025 win alongside HealthEquity, and Booking.com and
      Parloa jointly earned a bronze at the 2025 European Contact Centre and Customer Service Awards for
      greatest impact of a single AI solution.
