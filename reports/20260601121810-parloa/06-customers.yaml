  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: grr-gap
      missingEvidence: >
        Gross revenue retention (GRR), logo churn rate, and cohort-level attrition data by vintage year.
      whyItMatters: >
        The 150% NRR headline is compelling but does not reveal whether gross churn is 85% or 95%.
        At a $3B valuation, the difference between 85% and 95% GRR meaningfully affects cohort terminal
        value, payback assumptions, and the sustainability of the growth rate. Without GRR, durability
        of the customer base cannot be independently assessed.
      diligencePath: >
        Request quarterly GRR, logo churn by cohort vintage, and top-10 customer revenue share
        (anonymized) from the CFO dataroom during due diligence.
      relatedQuestionRefs:
        - QU022

    - type: private-evidence-only
      severity: material
      topic: account-concentration
      missingEvidence: >
        Top-5 and top-10 customer revenue concentration as a percentage of total ARR, along with
        individual contract values for Teleperformance, HealthEquity, and SAP.
      whyItMatters: >
        If the top 5 accounts represent 25-35% of ARR, churn or negotiation leverage from any single
        large customer significantly impacts revenue trajectory. This risk is unquantifiable without
        concentration disclosure.
      diligencePath: >
        Request anonymized top-10 customer revenue share from CFO; cross-reference against disclosed
        multi-million dollar deal announcements to triangulate minimum exposure.
      relatedQuestionRefs:
        - QU020

    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof-table
      missingEvidence: >
        Full enumeration of all ~150 enterprise customers; Parloa has not published a complete customer
        list and public sources cover only 15-20 named accounts.
      whyItMatters: >
        The publicly named accounts are predominantly flagship logos with positive outcomes. The unnamed
        majority of the base may include smaller deployments, mixed-outcome installations, or churn
        candidates that are not visible from external evidence.
      diligencePath: >
        Request a customer list (anonymized by sector, ARR band, and deployment stage) or a NPS/CSAT
        distribution across the full base during due diligence.
      relatedQuestionRefs: []
      relatedTableRefs:
        - TU003

    - type: stale
      severity: minor
      topic: arr-growth
      missingEvidence: >
        A post-December 2025 ARR or revenue update that reflects the trajectory following the January
        2026 Series D and the May 2026 SAP partnership announcement.
      whyItMatters: >
        The most recent public ARR figure ($52M, Sacra) is anchored to end-2025. A meaningful portion
        of growth following the Series D capital deployment and the SAP distribution partnership may
        already be in-flight but not publicly confirmed.
      diligencePath: >
        Request Q1 and Q2 2026 ARR and new bookings from the CFO; alternatively, seek a Sacra or
        similar analyst update post-SAP partnership announcement.
      relatedQuestionRefs:
        - QU026

    - type: missing-source
      severity: minor
      topic: partner-program-impact
      missingEvidence: >
        Partner-sourced ARR as a percentage of total bookings, number of joint customer wins closed
        through the Global Partner Program since September 2025, and partner pipeline contribution.
      whyItMatters: >
        The partner program is central to Parloa's stated concentration-risk mitigation strategy.
        Without data on partner-sourced deal flow, it is impossible to evaluate whether the channel is
        materially diversifying revenue or remains primarily a brand and delivery supplement to direct sales.
      diligencePath: >
        Request partner-sourced ARR percentage for 2025 and the first half of 2026; compare against
        direct sales bookings to assess channel contribution trajectory.
      relatedQuestionRefs:
        - QU024

