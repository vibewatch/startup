  - id: TU005
    title: Expansion and Concentration Risk Table
    columns:
      - Driver / Risk
      - Type
      - Impact Assessment
      - Mitigation / Current Status
      - Diligence Path
    rows:
      - - "NRR 150%: land-and-expand within accounts"
        - Expansion driver
        - Upsell to new channels, languages, and geographies is primary ARR engine
        - Confirmed by official Dec 2025 announcement; consistent with Swiss Life all-division rollout
        - Obtain expansion ARR vs. new logo ARR split; cohort expansion trajectories
      - - "Vertical concentration: Insurance+Banking+Retail+Telecom > 70% of revenue"
        - Concentration risk
        - Adverse macro in one vertical (e.g. insurance IT freeze) compresses pipeline and churn simultaneously
        - Expanding into healthcare and public sector; growing US enterprise in tech vertical
        - Request vertical revenue breakdown (anonymized); model worst-case single-vertical downturn
      - - "Top-account concentration: TP, HealthEquity, SAP at multi-million dollar ACV"
        - Concentration risk
        - A handful of accounts likely represent high single-digit percent of ARR each
        - Partner program and SAP Store reduce single-customer dependency over time
        - Identify top-5 customer revenue share (anonymized); assess renewal risk per account
      - - "Channel partner program (100+ partners: Accenture, Deloitte, PwC, Microsoft, NTT, Verint)"
        - Expansion driver
        - Partner co-selling broadens reach without proportional direct headcount cost
        - Formalized September 2025; partner-sourced deal contribution not yet disclosed
        - Track partner-sourced vs. direct-sourced ARR; certify partner delivery quality
      - - "High minimum ACV (~$300K) with no public pricing or free trial"
        - Procurement friction
        - Long enterprise sales cycles; excludes SMB and pilot-scale experiments; competitor vulnerability
        - No stated plans to introduce a lower-entry tier as of June 2026
        - Confirm average sales cycle length and win rate by segment; model revenue impact of a PLG tier
    notes: >
      Top-account revenue concentration is inferred from $52M ARR across ~150 customers (~$333K avg ACV)
