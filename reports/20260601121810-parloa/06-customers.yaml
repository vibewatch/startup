callouts:
  - calloutType: strength
    title: Elite NRR Signals Durable Land-and-Expand
    body: >
      A disclosed 150% NRR is a standout retention metric that places Parloa in the top tier of
      enterprise SaaS vendors globally. Swiss Life's full-division rollout after a single-division
      pilot and SAP's deepening from IT concierge to strategic investment are live examples of the
      expansion dynamic. When combined with the quantified containment and efficiency gains at ATU
      and Medien Hub, the evidence supports that Parloa's ROI case is strong enough to drive
      meaningful upsell within existing accounts.
    claimRefs:
      - CU013
      - CU028
      - CU029

  - calloutType: risk
    title: GRR and Logo Churn Gaps Limit Durability Assessment
    body: >
      Despite strong NRR, the absence of any disclosed gross revenue retention, logo churn, or
      cohort-level attrition data means that the 150% NRR could mask elevated gross churn being
      offset by exceptional expansion from a smaller number of fast-growing accounts. This is a
      standard diligence gap for pre-IPO SaaS companies, but it represents a meaningful blind spot
      at a $3B valuation. Until Parloa discloses GRR or cohort renewal data, assigning high
      confidence to customer durability remains premature.
    claimRefs:
      - CU030
      - CU032
      - CU040

  - calloutType: risk
    title: Vertical Concentration and High-ACV Procurement Create Pipeline Risk
    body: >
      With insurance, banking, retail, and telecom accounting for more than 70% of ARR and minimum
      contracts reportedly near $300,000 per year, Parloa's near-term pipeline is sensitive to both
      macro conditions in those verticals and enterprise IT budget cycles. The absence of a
      transparent entry-tier product or free trial limits addressable market breadth. Competitor
      platforms with lower entry points and faster deployment (as noted in third-party reviews) can
      win evaluations that Parloa's sales process cannot reach, widening concentration risk over time
      if the partner program does not successfully diversify deal sourcing.
    claimRefs:
      - CU034
      - CU037
      - CU039

