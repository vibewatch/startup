callouts:
  - calloutType: strength
    title: "150% NRR: Top-Decile Land-and-Expand Economics"
    body: >
      Net revenue retention of 150% means Parloa's installed base alone would grow ARR by 50% per year
      even without signing a single new customer — driven by expansion as enterprises deploy more AI agents
      across languages, channels, and use cases. In enterprise SaaS, 120%+ NRR is considered excellent;
      150% places Parloa in the top decile. This metric is the strongest financial proof point in the
      public record and is the primary justification for the premium valuation multiple.
    claimRefs:
      - CI013
      - CI030

  - calloutType: risk
    title: "~58x ARR Valuation Multiple Demands Sustained Triple-Digit Growth"
    body: >
      The $3B January 2026 valuation at approximately 58x trailing ARR requires Parloa to sustain
      triple-digit revenue growth for multiple years to justify the multiple. Any growth deceleration,
      margin surprise, or change in market sentiment would expose significant valuation overhang.
      Klarna's public admission in 2024 that it over-deployed AI automation — cutting jobs, dropping
      vendors, and walking back AI-generated campaigns — is a direct precedent demonstrating that
      enterprise AI adoption can contract. Industry observers explicitly flagged valuation bubble risk
      in the AI contact center sector as of late 2025.
    claimRefs:
      - CI032
      - CI033
      - CI034
      - CI035

  - calloutType: recommendation
    title: "Diligence Blockers: Gross Margin, Burn, and CAC Must Be Confirmed Before Underwriting"
    body: >
      Three critical financial metrics — gross margin (and COGS breakdown), monthly burn rate (gross and
      net), and CAC payback by channel — are not publicly available. Without these, capital efficiency,
      margin trajectory, and sustainable growth rates cannot be assessed. Financial diligence must include
      audited P&L (itemized COGS), a 13-week rolling cash forecast, and cohort-level unit economics
      showing gross churn, expansion, and CAC payback before any underwriting at or near the current
      $3B valuation.
    claimRefs:
      - CI025
      - CI029
      - CI031
      - CI035

