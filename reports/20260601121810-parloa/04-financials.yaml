  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: "gross margin"
      missingEvidence: "Audited P&L with COGS broken down by category: LLM API inference costs, cloud infrastructure, professional services delivery, and other cost of revenue"
      whyItMatters: "Without gross margin, path to profitability and LLM cost exposure cannot be assessed; a 70% vs 80% gross margin changes the investment thesis materially at $52M ARR scale"
      diligencePath: "Request audited financial statements (IFRS or US GAAP) for FY2024–2025; require itemized COGS breakdown and gross margin by product line in the dataroom"
      relatedQuestionRefs: [QI008]

    - type: private-evidence-only
      severity: blocking
      topic: "burn"
      missingEvidence: "Actual gross and net monthly burn rate, current cash-on-hand balance, and a CFO-prepared 13-week rolling cash flow forecast"
      whyItMatters: "Without confirmed burn, runway cannot be validated; the $350M raise provides a nominal cushion but actual capital efficiency of growth investment is unknown"
      diligencePath: "Request monthly management accounts, bank reconciliations, and an 18-month financial model with scenario analysis from the CFO"
      relatedQuestionRefs: [QI019]

    - type: private-evidence-only
      severity: material
      topic: "valuation defensibility"
      missingEvidence: "Peer-comparable ARR multiples for private AI-native SaaS companies at similar growth rates to contextualize the 58x ARR valuation"
      whyItMatters: "The $3B valuation at ~58x ARR exceeds historical SaaS norms even for high-growth companies; any growth deceleration would expose mark-to-market risk and down-round vulnerability"
      diligencePath: "Commission a private company comparable analysis using Pitchbook/CB Insights for AI agent platform peers; request investor rights agreement to assess governance protections at this valuation"
      relatedQuestionRefs: [QI018]
      relatedTableRefs: [TI003]

    - type: private-evidence-only
      severity: material
      topic: "unit economics"
      missingEvidence: "Customer-level CAC, CAC payback period, LTV, gross churn rate, ACV distribution across the install base, and top-customer revenue concentration"
      whyItMatters: "150% NRR is the only confirmed unit economic metric; without gross churn, CAC, or concentration data, revenue quality and customer base durability cannot be underwritten"
      diligencePath: "Request cohort ARR by vintage, top-10 customer revenue share (anonymized), gross vs. net churn by quarter, and deal-level CAC attribution from the CFO dataroom"
      relatedQuestionRefs: [QI025]
      relatedTableRefs: [TI005]

    - type: private-evidence-only
      severity: minor
      topic: "pricing realization"
      missingEvidence: "Realized average contract value versus quoted pricing; volume discount structure; professional services as percentage of total revenue"
      whyItMatters: "Enterprise SaaS typically involves significant discounting from list; realized ACV determines true revenue quality and signals pricing power trajectory"
      diligencePath: "Request top-20 contract terms (anonymized); ask for ACV distribution, discount history, and deal-level pricing components"
      relatedQuestionRefs: [QI015]

