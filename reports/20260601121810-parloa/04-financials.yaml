  name: Parloa
chapter:
  number: 4
  title: Financials
  summary: >
    Parloa's financial profile is defined by explosive top-line growth — surpassing $52M ARR in 2025 at
    117% YoY — anchored by 150% net revenue retention and a land-and-expand motion across 150+ enterprise
    customers. The company operates a B2B SaaS platform with per-minute consumption pricing, has raised
    $560M+ across four rounds, and carries a $3B Series D valuation implying an aggressive ~58x ARR
    multiple. Gross margin, burn rate, and CAC remain private, representing material underwriting gaps
    that require dataroom disclosure to assess capital efficiency.

sections:
  - id: revenue-model-and-pricing
    title: Revenue Model and Pricing
    body: >
      Parloa generates revenue through enterprise B2B SaaS subscriptions for its AI Agent Management
      Platform (AMP), supplemented by a usage-based consumption layer tied to AI agent call minutes.
      Unlike competitors pursuing outcome-based revenue-share pricing — where the vendor takes a
      percentage of efficiency gains — Parloa uses transparent per-minute pricing: customers pay for
      AI agent minutes consumed, not outcomes achieved. This design is intentional: as AI handles calls
      faster, the customer retains the efficiency gains while Parloa earns on volume growth. The company
      explicitly positions this as anti-fragile alignment between vendor and customer incentives.

      No public pricing table exists. All deals are enterprise-quote-based, reflecting multi-year
      contracts with multi-million-dollar annual contract values. Revenue recognition follows standard
      SaaS patterns — subscription recognized ratably, usage recognized on consumption — with no
      disclosed deferred-revenue or complex recognition issues. The SAP partnership embeds Parloa agents
      into SAP Service Cloud, extending the distribution reach into SAP's existing enterprise procurement
      infrastructure. The BPO channel — anchored by a multi-million-dollar deal with Teleperformance (TP),
      the world's largest business-process outsourcer — shifts a portion of customer acquisition costs
      from direct sales to partner enablement and opens the mid-market via outsourced deployments.
    claimRefs:
      - CI001
