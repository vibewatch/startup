  - id: capital-adequacy-and-financing
    title: Capital Adequacy and Financing
    body: >
      Parloa completed its $350M Series D in January 2026 at a $3B valuation, bringing total raised
      capital to over $560M since founding in 2018. General Catalyst led the round with continued
      participation from EQT Ventures, Altimeter Capital, Durable Capital Partners, and Mosaic Ventures.
      In conjunction with the Series D, General Catalyst CEO Hemant Taneja and Managing Director
      Jeannette zu Fürstenberg joined Parloa's Supervisory Board. Disclosed use of funds covers U.S.
      and European market expansion (new offices in San Francisco and Madrid), headcount growth from
      approximately 380 to 600 by end of 2026, AMP platform enhancement, and the Parloa Promise
      reliability initiative.

      Burn rate and cash-on-hand are not publicly disclosed. At the company's stage — $52M ARR, 117%
      growth, 380+ employees — a reasonable industry proxy for gross monthly burn would be in the range
      of $10–$25M, implying roughly 14–35 months of runway from the $350M Series D raise alone. The
      prior $120M Series C closed in May 2025 just 12 months after the $66M Series B, indicating an
      aggressive capital deployment pace consistent with a growth-stage company investing ahead of
      revenue. Parloa GmbH is registered at the District Court of Charlottenburg (Berlin), HRB 187494 B.
      No debt facilities or project-finance obligations have been disclosed. For the full round-by-round
      funding chronology, see the Company Overview chapter; this chapter focuses on forward capital
      adequacy and use-of-funds.
