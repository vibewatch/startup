  - id: public-traction-and-growth
    title: Public Traction and Growth Metrics
    body: >
      Parloa announced it surpassed $50M ARR in December 2025, six months after achieving unicorn status
      with its $120M Series C. Sacra independently estimates the figure at $52M for full-year 2025, up
      117% YoY from $24M at the end of 2024. The company's earlier revenue trajectory — $2.7M in 2022,
      $16M in 2024, $50M+ in 2025 — implies roughly a 20x revenue increase over three years, a CAGR
      of approximately 157%. Parloa also publicly confirmed a 4x revenue increase in the 12 months
      between its Series B (April 2024) and its Series C (May 2025).

      Net revenue retention of 150% is the single most significant disclosed traction indicator. An NRR
      of 150% means the installed base alone would grow ARR by 50% per year without signing a single new
      customer, driven by land-and-expand as enterprises deploy more AI agents across use cases, channels,
      and geographies. The customer base spans 150+ enterprise clients including Allianz, Booking.com,
      HealthEquity, SAP, Swiss Life, Deutsche Telekom, Decathlon, IKEA, and Berlin Brandenburg Airport.
      The HealthEquity win — the largest U.S. Health Savings Account administrator — signals the
      company's ability to close regulated-industry enterprise deals in the U.S. market. A multi-million-
      dollar deal with Teleperformance (TP) validates the BPO channel strategy as both a revenue event
      and a distribution multiplier.
