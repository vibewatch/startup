  - id: cost-structure-and-unit-economics
    title: Cost Structure and Unit Economics
    body: >
      Parloa's primary cost categories are: (1) LLM inference and compute costs as cost of revenue,
      since the platform orchestrates multiple model providers (OpenAI GPT, Anthropic Claude, Google
      Gemini, open-source models) on every customer interaction; (2) engineering and R&D headcount;
      (3) enterprise sales and marketing; and (4) professional services and implementation. As an
      AI-native platform that embeds third-party LLM APIs into every conversation, Parloa's gross
      margin is directly affected by per-token API pricing — a structural difference from traditional
      SaaS that does not consume third-party inference at scale. Enterprise AI agent platforms in this
      segment typically target gross margins of 70–80%, below the 80–85% seen in traditional SaaS,
      reflecting the LLM layer in cost of goods sold. Declining LLM pricing is a potential tailwind,
      but market volatility in model pricing remains a risk.

      Unit economics are largely private. The 150% NRR is the single most consequential disclosed
      metric, confirming strong land-and-expand dynamics where expansion revenue exceeds churn within
      the installed base. However, absolute CAC, CAC payback period, LTV, and gross margin are not
      publicly disclosed. With multi-million-dollar enterprise ACV deals and typical 3–6-month sales
      cycles, CAC is likely substantial in absolute terms but can be rationalized by long contract
      durations and strong NRR. Industry benchmarks for AI customer-service resolutions run $0.99–$2.00
      per AI-handled interaction versus $6–$12 for human agents, providing a basis for customer ROI
      modeling. Quantification of Parloa-specific unit economics requires dataroom access.
    claimRefs:
