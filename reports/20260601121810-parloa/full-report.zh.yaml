      - number: '5.2'
        title: 平台架构与技术底座
        blocks:
          - type: paragraph
            body: >
              Parloa 的技术栈云原生，运行在 Microsoft Azure 上，用 Azure Kubernetes Service（AKS）做容器规模编排，用 Azure Cosmos DB 做有状态会话存储。AI
              层依赖 Azure OpenAI（当前为 GPT-5.4）处理对话推理和自然语言生成，Azure Cognitive Services 负责针对电话音频优化的
              语音转文本（STT）和文本转语音（TTS），Azure AI Content Safety 做实时内容审核。公司 GitHub 组织中的 Azure Redis Cache 和 Azure Storage
              Account 分叉 Terraform 模块，也印证其 Azure 基础设施即代码。

              一个突出的架构选择是多智能体 Subtask Agents 层：它把复杂用户意图拆成子问题，路由给专门智能体，再在返回来电者前重组答案。这不同于单 LLM 逐轮对话方式，Parloa Labs 在 May
              2026 发布的研究中已有记录。Parloa 也支持 Retrieval-Augmented
              Generation（RAG）流水线，面向大型企业知识库；智能体无需重训基础模型，就能动态查询政策文件、产品目录和支持知识。

              Parloa 的 Bring Your Own（BYO）模型允许企业用自己的 STT、TTS 或 LLM 替换 Azure 默认项，为已有 AI 投入或数据驻留要求的组织提供灵活性。托管在
              parloa.github.io 的 TextchatV2 公开 OpenAPI 规范记录了 /dialoghook 端点、Bearer token 认证方案以及会话 /
              交易管理，确认了面向聊天渠道集成商的成文集成契约。parloa/directives-examples 仓库（April 2026 已归档）展示了智能体运行时的自定义响应指令能力。
