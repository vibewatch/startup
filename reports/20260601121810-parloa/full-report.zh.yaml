  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >
              Parloa 的收入来自 AI Agent Management Platform（AMP）的企业 B2B SaaS 订阅，并叠加与 AI
              智能体通话分钟数挂钩的用量消耗层。不同于追求结果分成定价的竞争者——供应商抽取效率收益的一部分——Parloa 使用透明的按分钟定价：客户为消耗的 AI
              智能体分钟付费，而不是为达成的结果付费。这个设计是有意为之：AI 越快处理通话，客户保留效率收益，Parloa 则从用量增长中获益。公司明确把这定位为供应商与客户激励之间的反脆弱对齐。

              公开定价表不存在。所有交易都基于企业报价，反映多年期合同和数百万美元年度合同价值。收入确认遵循标准 SaaS 模式——订阅按期确认，用量按消耗确认——未披露递延收入或复杂确认问题。SAP 合作把 Parloa
              智能体嵌入 SAP Service Cloud，延伸进 SAP 既有企业采购基础设施。BPO 渠道——由与全球最大业务流程外包商
              Teleperformance（TP）的一笔数百万美元交易锚定——把一部分获客成本从直销转向合作伙伴赋能，并通过外包部署打开中端市场。
