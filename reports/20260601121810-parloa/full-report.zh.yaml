      - number: '6.4'
        title: 集中风险与采购动态
        blocks:
          - type: paragraph
            body: >
              Parloa 收入在垂直行业上集中：保险、银行、零售和电信合计贡献超过 70% ARR，因此任何单一垂直的宏观下行——尤其是具名案例密度最高的保险业——都会同时对
              销售管线和流失造成不成比例影响。按账户看，客户集中也有实质意义：Parloa 约有 150 个企业客户，估计平均合同额接近 $333K，前五大账户很可能贡献高个位数到低双位数的总 ARR 份额；2025 宣布的
              Teleperformance 与 HealthEquity 数百万美元交易，单笔规模足以重要。为应对这一点，Parloa 于 September 2025 正式推出 Global Partner
              Program，吸纳 100 多家组织，包括 Accenture、Deloitte、PwC Germany、Microsoft、NTT 和 Verint，以支持伙伴主导的联合销售、实施和托管服务。SAP
              的战略投资，以及计划在 SAP Store 取得 SAP Endorsed App 认证，给 SAP 数十万企业安装基础打开了另一条渠道。从采购摩擦看，Parloa 采用定制报价模式，据报道最低年度承诺约
              $300,000；没有公开定价，也没有免费试用，评估门槛高，销售周期被拉长，小型试点被排除在外。第三方竞争评测持续把这一点列为摩擦点。高 ACV、长销售周期和垂直集中三者叠加，意味着 Parloa
              近期增长轨迹对少数大型复杂交易的表现敏感。
