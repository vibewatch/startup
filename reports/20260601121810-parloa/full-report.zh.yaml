            body: >
              截至 December 2025，Parloa 年经常性收入（ARR）超过 $50 million——官方公司公告已确认——较独立研究公司 Sacra 估计的 2024 年末 $24 million 大约同比增长
              117%。公司在 Berlin 举办的 WAVE 2025 峰会吸引来自全球的 600 多名客户、合作伙伴和爱好者，IKEA、Allianz Partners 和 Booking.com
              的演讲者现场分享。FeaturedCustomers 汇总了 Parloa 平台的 22 条客户证言、16 个案例研究，以及 841 条参考评分下的 4.8/5.0
              综合评分，凸显广泛商业采用。具名生产部署及量化结果包括：Swiss Life Germany，Parloa 的 AI 智能体在试点成功后已覆盖全部四个销售部门，将通话解决时间缩短 60%，路由准确率达到
              96%（73% 来电者给智能体 4 或 5 分，满分 5 分）；ATU 汽车服务，Parloa 消除了旺季人手不足，实现 100% 电话可用性，并将员工电话工作量降低 60%，AI 智能体自主处理约 60%
              咨询；Medien Hub Bremen-Nordwest，仅六周上线，自动化 30% 标准投诉电话，同时把座席认证负担降低 70%；Berlin Brandenburg Airport 的 “Berry” AI
              语音智能体由 Parloa 驱动，赢得 2025 Future Travel Experience 最具创新机场倡议奖，客户满意度达到 85%。HealthEquity 于 November 2025
              开始分阶段推出 Parloa 的智能体 AI，用于语音、移动应用和网页会员支持，并贯穿 2026 扩大范围。SAP 既是战略投资方，也是企业客户，已部署 Parloa AMP 为全球员工提供内部 IT
              礼宾支持。Teleperformance（TP）的数百万美元合同与 HealthEquity 一起被宣布为 2025 年赢单；Booking.com 与 Parloa 还共同获得 2025 European
              Contact Centre and Customer Service Awards 单项 AI 解决方案最大影响力铜奖。
