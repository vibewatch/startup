      - number: '2.2'
        title: 市场规模——TAM、SAM 与测算约束
        blocks:
          - type: paragraph
            body: >-
              公开市场估算显示，呼叫中心 AI 细分市场 2026 年规模从 Fortune Business Insights 的 $2.98 billion 到 Precedence Research 的 $4.89
              billion 不等，2030–2035 年 CAGR 估计为 20–27%。FreJun 和 Grand View Research 使用更窄基数（2024 年 $1.99 billion），预计到 2030
              年增至 $7.08 billion，CAGR 为 23.8%。差异反映真实的方法论分歧：定义在“呼叫中心 AI 软件”和“对话式 AI
              平台”之间摇摆，地理范围不同，有些估算包含专业服务和维护，有些只覆盖软件许可证。这些相互矛盾的估算无法仅靠公开证据消解，应视为区间括号，而不是单一数字。

              更广义的对话式 AI 市场——涵盖聊天机器人、语音助手、企业 copilots 等所有自动化对话系统——2026 年估计为 $13.6–17.1 billion，CAGR 为 19–26%。Ringly.io
              援引多家分析机构，把所有垂直行业的语音 AI 细分市场放在 2026 年 $22 billion。Gartner 最常被引用的市场量化不是软件支出，而是运营指标：到 2026 年，对话式 AI 将在全球减少
              $80 billion 联系中心坐席劳动力成本。即便软件 TAM 只占其中一小部分，这也展示了买方面临的经济价值规模。

              很难仅用公开证据自下而上拆出 Parloa 的 SAM。公司瞄准拥有大型联系中心（通常 100+ 坐席）、愿意每年支付 $300,000–$2 million
              平台许可费的企业。若全球企业联系中心坐席人群中，符合条件的组织（拥有数字化转型预算的大型企业）约有 5–7 million 名坐席，而 Parloa 隐含单企业合同规模为
              $400,000+，可服务收入池就在低个位数十亿美元——与分析师区间一致，但无法由公开来源独立验证。
