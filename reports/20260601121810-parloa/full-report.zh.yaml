  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >
              Parloa 是纯 B2B SaaS 供应商，服务处理大量入站客户互动的大型企业和德国 Mittelstand 企业。基于第三方市场分析，保险、银行、零售和电信合计贡献 Parloa 超过 70%
              的收入。公司的标杆保险客户包括 Swiss Life Germany、Allianz Partners、HealthEquity、Sedgwick、BarmeniaGothaer、Münchener Verein
              和 Helvetia；按具名案例数量看，金融服务是最深的垂直集中。零售由 IKEA（Ingka Group）、Decathlon、HSE、ATU 和 Nord-Ostsee Automobile
              支撑。旅游和酒店客户包括 Booking.com 与 Berlin Brandenburg Airport。企业技术由 SAP 和 TeamViewer 代表，媒体 / 出版则有 Medien Hub
              Bremen-Nordwest。典型 Parloa 客户运营 500 名以上座席的联络中心，目标是自动化 40–60% 常规语音和聊天互动，以降低单次联系成本并提升 NPS。决策权掌握在 CIO、客户体验负责人和
              35–55 岁的数字化转型负责人手中；他们的 KPI 优先关注 SLA 遵守、多语言覆盖和可衡量 ROI。地域上，Parloa 已安装客户群偏重 DACH 地区；May 2025 Series C
              后，公司在曼哈顿中城设立美国总部，北美扩张正在提速。新兴垂直——公共部门和医疗保健——自 2024 以来增长快于核心业务，动力来自 AI 驱动的公民服务，以及覆盖 1700 万 HSA 会员的
              HealthEquity 高知名度部署。
