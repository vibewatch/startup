  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Parloa 的依赖网络横跨合作伙伴、上游 AI / 模型供应商、云运行层和监管方。
    data:
      nodes:
        - id: parloa
          label: Parloa 核心平台
          detail: 企业 AI 智能体的编排层。
          tone: neutral
        - id: sap
          label: SAP 生态
          detail: 渠道和企业集成杠杆。
          tone: positive
        - id: sis
          label: SI / 合作伙伴网络
          detail: 联合销售和实施产能。
          tone: warning
        - id: models
          label: 上游模型
          detail: 模型治理和成本暴露。
          tone: warning
        - id: cloud
          label: 云 / 电话运行时
          detail: 对话运营交付层。
          tone: warning
        - id: reg
          label: EU 监管机构 / 隐私监管方
          detail: 解释与执法环境。
          tone: negative
        - id: buyers
          label: 受监管企业买方
          detail: 保险、银行和服务运营商。
          tone: neutral
      edges:
        - from: parloa
          to: sap
        - from: parloa
          to: sis
        - from: parloa
          to: models
        - from: parloa
          to: cloud
        - from: reg
          to: parloa
        - from: sap
          to: buyers
        - from: sis
          to: buyers
        - from: parloa
          to: buyers
    approximationNotes: 该图是概念图而非架构图；它强调哪些外部关系最直接影响商业结果。
    claimRefs:
      - CR004
      - CR016
      - CR017
      - CR018
      - CR032
      - CR033
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 增长、客户证据、基准纪律和数据缺口如何共同导向中等信心的继续研究建议。
    data:
      nodes:
        - id: growth
          label: 117% 增长 + 150% NRR
          detail: 增长质量仍支撑其相对成熟 CCaaS 可比公司的溢价。
          tone: positive
        - id: proof
          label: 企业客户证据
          detail: 具名客户和真实部署深度降低产品市场契合度疑问。
          tone: positive
        - id: price
          label: $3B Series D 入场
          detail: 基于约 $52M ARR，约 58x ARR；即便按超高增长 AI 原生软件也很激进。
          tone: warning
        - id: discount
          label: 欧洲 / 私有公司折价
          detail: 地理位置和不透明度要求估值相对最贵的美国 AI 倍数保持纪律。
          tone: warning
        - id: gaps
          label: 披露缺口
          detail: GRR、毛利率和区域结构仍未公开。
          tone: warning
        - id: output
          label: 继续研究 / 偏高 / 中等信心
          detail: 立场建设性，但只有尽调确认业务能长进这个估值后才成立。
          tone: neutral
      edges:
        - from: growth
          to: price
        - from: proof
          to: price
        - from: discount
          to: output
        - from: gaps
          to: output
        - from: price
          to: output
    approximationNotes: null
    claimRefs:
      - CV005
      - CV016
      - CV018
      - CV022
      - CV023
      - CV037
      - CV038
      - CV039
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 基于 ARR 假设和 2026 年 AI 软件倍数区间的企业价值式敏感性分析。
    data:
      items:
        - label: 基准：$52M ARR @ 40x
          value: 2080
          detail: 单位：百万美元；若 Parloa 仍享受溢价但不处在峰值估值，这是与基准情景相关的水平。
          tone: warning
        - label: 本轮：$52M ARR @ 58x
          value: 3016
          detail: 单位：百万美元；大致对应 2026 年 1 月 Series D 轮估值。
          tone: neutral
        - label: 扩张：$75M ARR @ 40x
          value: 3000
          detail: 单位：百万美元；ARR 扩张且倍数正常化时的基准情景结果。
          tone: positive
        - label: 乐观：$100M ARR @ 45x
          value: 4500
          detail: 单位：百万美元；乐观情景，需要规模扩大且溢价具备持续性。
          tone: positive
        - label: 悲观：$60M ARR @ 25x
          value: 1500
          detail: 单位：百万美元；悲观情景，增长放缓且倍数大幅压缩。
          tone: negative
    approximationNotes: 数值只是简单的倍数桥，不是贴现现金流结果。
    claimRefs:
      - CV005
      - CV021
      - CV022
      - CV030
      - CV037
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 基于截至 2026 年 6 月运行日的公开证据，给出 Parloa 的悲观、基准和乐观价值区间。
    data:
      items:
        - label: 悲观情景
          low: 1200
          mid: 1600
          high: 2000
          displayValue: $1.2B-$2.0B
          detail: 增长放慢、竞争加剧，并且倍数大幅压缩。
          tone: negative
        - label: 基准情景
          low: 2500
          mid: 3000
          high: 3500
          displayValue: $2.5B-$3.5B
          detail: 只有 Parloa 能长进这个估值，公开证据才支撑公允价值区间。
          tone: warning
        - label: 乐观情景
          low: 4500
          mid: 5250
          high: 6000
          displayValue: $4.5B-$6.0B
          detail: 需要持续超高增长，并成功推进国际化扩张。
          tone: positive
    approximationNotes: 区间是以百万美元计的情景输出，并锚定公开 ARR 区间和倍数假设。
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
      - CV037
