  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 监管、平台和集中度风险如何传导到签约额、毛利率和估值。
    data:
      nodes:
        - id: ai-act
          label: AI Act / GDPR 负担
          detail: 增加文档、法律审查和买方审视。
          tone: negative
        - id: hyperscalers
          label: Amazon / Google 分销
          detail: 捆绑式 AI 和更便捷采购会挤压胜率。
          tone: negative
        - id: cognigy
          label: Cognigy 直接竞争
          detail: 欧洲企业市场重叠，且有分析师可见度。
          tone: warning
        - id: dach
          label: DACH 集中度
          detail: 本土市场密度可能压住公开披露的 TAM。
          tone: warning
        - id: bookings
          label: 签约转化
          detail: 销售周期长度和胜率驱动增长。
          tone: warning
        - id: margin
          label: 毛利率
          detail: 价格压力和模型成本塑造经济性。
          tone: warning
        - id: valuation
          label: 估值支撑
          detail: 溢价倍数靠可持续增长和信任支撑。
          tone: warning
      edges:
        - from: ai-act
          to: bookings
        - from: ai-act
          to: margin
        - from: hyperscalers
          to: bookings
        - from: hyperscalers
          to: margin
        - from: cognigy
          to: bookings
        - from: dach
          to: bookings
        - from: bookings
          to: valuation
        - from: margin
          to: valuation
