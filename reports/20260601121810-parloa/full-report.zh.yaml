      - number: '5.4'
        title: 集成生态、部署与路线图
        blocks:
          - type: paragraph
            body: >
              Parloa 集成 100 多个企业系统连接器，包括 CCaaS 平台（Five9、Genesys、NICE、Avaya）、CRM 系统（Salesforce、Microsoft Dynamics）、ERP
              平台（SAP）、ITSM 工具（ServiceNow、Zendesk）和协作渠道（WhatsApp Business API、Microsoft Teams）。Five9 CX Marketplace
              列表和集成文档确认，SIP 域路由和 Call Attached Variables（CAV）是主要语音渠道集成机制。May 2026 的 SAP 合作把 Parloa 加入 SAP Endorsed
              App，并上架 SAP Store；它接入 SAP Service Cloud，用 SAP 业务数据支撑面向客户的互动。Epic 集成（2026 宣布）把触达扩展到医疗保健，提供符合 HIPAA 的病历访问。

              标准集成通常需要一到三个月；对更简单的单渠道部署，Parloa 对外宣传数周即可上线。平台的可扩展性主张是基于 Azure 基础设施支持无限并发对话，但公司没有公开 SLA
              或正常运行时间记录。可靠性工具包括版本化智能体发布、审计日志、基于仿真的回归测试和分阶段部署模型。Parloa 文档门户（docs.parloa.com）包含 AMP
              文档、发布说明，以及面向合格合作伙伴和客户白名单开放的 RBA/RTT 文档。

              2026 路线图（见 Series D 进展新闻稿和 Parloa Innovation 门户）优先事项包括：Agent
              Composition（一次构建，跨渠道部署）、扩大合作伙伴生态（SAP、OpenAI、BPO 合作伙伴 Teleperformance 和 Concentrix）、发布 Consumer Patience
              Index 研究（June 2026）、新增面向对话质量和解决有效性的 CX 衡量能力，以及在欧洲和北美扩大全球办公室。
