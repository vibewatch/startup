  - id: FM001
    title: 市场规模视角 — TAM 到可触达软件层
    type: pyramid
    layout: standard
    summary: 联络中心人工成本构成的经济价值池远大于当前软件市场；Parloa 所处的 AI 软件层正在迅速扩大，占可触达价值池的份额提升。
    data:
      nodes:
        - label: AI 可触达的联络中心人工总成本：2026 年约 $80B
          detail: Gartner 预测，到 2026 年，对话式 AI 可节省全球客服坐席人工成本；这代表 AI 软件可捕获的经济上限，不是实际软件支出。
          tone: neutral
        - label: 全球联络中心市场（所有技术 + 人工）：2026–2027 年约 $480–496B
          detail: Ringly.io 引用 PR Newswire 市场研究；包括 BPO 人工、CCaaS、IVR 和非 AI 技术；远高于 AI 软件 TAM。
          tone: neutral
        - label: CCaaS（云联络中心平台）市场：2026 年约 $9.4B
          detail: 相邻平台层，CCaaS 既有厂商正在加入 AI 能力；与 Parloa 的分销渠道和竞争战场重叠。
          tone: neutral
        - label: 呼叫中心 AI 软件市场：2026 年 $2.98B–$4.89B
          detail: 区间来自 Fortune Business Insights（$2.98B）到 Precedence Research（$4.89B）；Parloa 的直接市场细分以 20–27% CAGR 增长。
          tone: positive
    approximationNotes: 这个金字塔是概念性的规模测算视角，不是严格的财务瀑布；各层来自不同分析机构，口径不同，不能相加或直接比较。美元数值均按发布值保留；未计算中点。
