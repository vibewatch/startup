      - number: '6.3'
        title: 留存、持久性与扩张经济性
        blocks:
          - type: paragraph
            body: >
              Parloa 最突出的留存信号，是披露 2025 全年 150% 净留存率（NRR）：也就是说，在扣除任何流失后，每个队列的收入基数在下一年仍通过扩张增长
              50%——新渠道、更多语言、更多智能体或新地域。这一数字由公司 December 2025 官方公告确认，并由 Sacra 和 Latka 交叉引用；按企业 SaaS 标准属于顶尖水平，因为一流 NRR 通常在
              105–130%。150% NRR 与 Swiss Life 从一个试点部门扩到全部四个销售部门、SAP 从 IT 试点扩到生产级员工支持相一致。不过，Parloa
              尚未披露总收入留存率（GRR）、客户数流失率或队列级流失；这些指标对剥离扩张噪音、评估客户持久性至关重要。合同期限同样不透明：以 $300K+ ACV
              部署的企业客户，推测会采用该价位常见的多年协议，但平均年限、续约率和提前终止条款未知。可获得的客户满意度数据偏正面：Swiss Life 报告称 73% 来电者给 AI 智能体 4–5 分（满分 5
              分），Berlin Brandenburg Airport 的 Berry 智能体达到 85% CSAT。平台层面，FeaturedCustomers 记录了 841 次评分事件下的 4.8/5.0
              综合分。未披露 GRR 是主要持久性缺口：150% NRR 若搭配 80% GRR，与搭配 95% GRR，在质量上完全不同；这种差异会显著影响队列终值模型。
