chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品和商业模式
        blocks:
          - type: paragraph
            body: >
              Parloa 于 2018 年在德国柏林创立，创始人为 Malte Kosub 和 Stefan Ostwald，出发点是相信每一次好的对话都是长期关系的开端。今天，Parloa
              将自己定位为面向企业客服的行业领先 AI 智能体管理平台。旗舰产品 AI Agent Management Platform（AMP）让企业几乎不用大量编码，就能设计、测试、部署并持续优化 AI
              智能体群，在语音、聊天和消息渠道处理客户互动。平台编排 AI 智能体的完整生命周期：从 Parloa Studio 设计、预置技能，到严格的仿真测试、全渠道部署，再到借助洞察仪表盘做实时监控。Parloa
              的差异点不在单个机器人，而在管理整支自主智能体群，为企业规模化落地智能体 AI
              提供一个统一控制平面。公司一开始就走语音优先路线，延迟、实时推理、口音识别、情绪敏感度都被提前拉到更高技术约束下；这些能力如今支撑其多渠道产品。AMP 支持 130 多种语言，接入 CCaaS、CRM 和 ERP
              系统，并满足 GDPR、SOC 2、ISO 27001、HIPAA、PCI DSS 等企业合规标准。Parloa 的商业模式是 AMP SaaS
              订阅，目标客户是金融服务、电商和零售、旅游和酒店、公用事业、医疗健康、信息技术等行业的大型企业。公司总部在柏林，美国业务以纽约曼哈顿中城为锚点；截至 2026 年 4
              月，另在慕尼黑和伦敦设办公室，并计划扩张到旧金山和马德里。2025 年末启动的 Global Partner Program 已纳入 Accenture、Deloitte、PwC
              Germany、Microsoft、NTT、Verint 等 100 多家合作伙伴，拉长 Parloa 的分销和交付半径。
