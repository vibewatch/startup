      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              Parloa 由 Malte Kosub 和 Stefan Ostwald 共同创立，Kosub 任 CEO，Ostwald 任 Chief AI Officer（CAIO）。Kosub 曾搭建语音和对话式 AI
              系统，也为企业提供语音界面战略咨询；他是主要公开发言人，也是战略推动者。Ostwald 负责 AI 研究和平台架构。他曾把 Parloa
              的语音优先起点归因于一个好处：公司很早就被迫解决最难的问题——延迟、情绪、中断、实时编排——这些能力现在构成更持久的技术优势。两位创始人位于高度集中的领导结构顶端，带来显著关键人风险。Series C
              之后，C-suite 明显扩容。Latané Conant 在公司达到独角兽里程碑后加入，成为 Parloa 首任 Chief Marketing Officer，带来此前领导岗位上的企业营销经验。Chris
              Silver 被任命为 Chief Revenue Officer，负责放大 go-to-market 职能。Csaba Tamas 任 Chief Product Officer，Tino
              Mittelmeier 任 Chief Financial Officer。治理采用德国式双层架构。Jens Rassloff 担任监事会主席。2026 年 1 月 Series D 之后，General
              Catalyst CEO Hemant Taneja 以及 President and Managing Director Jeannette zu Fürstenberg 均加入监事会，提升投资人代表性，也释放
              General Catalyst
              对公司方向的高信念。监事会之外，具体投资人董事会权利、独立董事构成、股权结构治理条款均未公开披露——这是后续尽调缺口。Stripe、Databricks、Microsoft、Celonis、Datadog、Personio
              的天使投资人也在股权结构表中，德国足球名人 Mario Götze 和 Bastian Schweinsteiger 亦在其中。
