        title: 退出逻辑、尽调路径与投资逻辑破坏触发器
        blocks:
          - type: paragraph
            body: >-
              投资逻辑仍可使用，但必须带着明确的后续追问。核心未解问题不是 Parloa 是否有产品市场契合，而是增长叙事背后的经济性，能否在更长周期和更广地域中支撑 $3 billion 标记。投资者需要经审计
              ARR、队列扩张、毛利率和区域结构，才能从知道轮次价格，走向对公允价值的信念。退出逻辑仍然真实。拥有现有企业分销的战略买家，可能有理由支付高于公开市场可比公司的价格，尤其是在 Parloa
              继续在受监管垂直行业累积客户证明的情况下。但这种可选性应被视为上行，而不是基准情景。投资逻辑破坏条件很直接：增长放缓到支撑溢价所需水平以下，新的财务披露显示毛利率偏弱或留存平庸，或者超大规模云厂商和直接同行在核心账户中的胜利开始累积。在此之前，正确姿态是建设性但设门槛。Parloa
              已经赢得一个高溢价机构估值；它还没有证明，$3 billion 重估能给新投资者提供有吸引力的入场点。
