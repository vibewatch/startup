  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              进入 2026 年，Parloa 面对的竞争格局可分为四个相互重叠的圈层：直接智能体 AI 同业（Cognigy/NICE、PolyAI、Uniphore）、既有 CCaaS 平台龙头（Genesys Cloud
              CX、NICE CXone、Five9）、相邻平台替代品（Microsoft Copilot Studio、Salesforce Agentforce），以及用 GPT-4 级 LLM
              自建的隐性现状选项。企业智能体和对话式 AI 整体市场正在吸引密集资本：语音 AI VC 融资从 2022 年的 $315 million 增至 2024 年的 $2.1
              billion，压缩先发者维持差异化的窗口。NICE 以 $955 million 收购 Cognigy，把直接同业集合整合进一个由上市 CCaaS 巨头背书、拥有全球分销基础设施的实体。面对 Genesys
              的规模（$2.6 billion Cloud ARR、7,000 多家客户）以及 Salesforce、Microsoft 等平台巨头替代品，Parloa
              的有效竞争场景收窄到大型企业买家：语音复杂度、合规深度和多年平台承诺足以支撑其估计每年约 $300,000 的最低合同规模。更小或更快的部署仍可由 CCaaS 既有玩家和 API
              优先语音供应商触达；中端市场买家也能评估每用户每月 $110-229 的按席位 CCaaS 方案，无需合作伙伴主导实施。Kore.ai、Yellow.ai 和 IBM watsonx Orchestrate
              也构成额外的企业对话式 AI 平台竞争者，争夺同一笔联系中心自动化预算；内部自建选项——用开源 LLM 和电话 API 拼装联系中心 AI——则是拥有足够 ML 工程能力企业的最低成本替代品。
