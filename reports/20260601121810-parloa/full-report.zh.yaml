              detail: 分阶段义务会持续到 2027 年。
            - label: 高
              tone: negative
              detail: 合规失误会打击信任和销售速度。
            - label: 中
              tone: warning
              detail: 治理叙事已经有了，但公开证据仍有限。
            - label: 中高
              tone: warning
              detail: 可管理，但成本高且会长期存在。
        - label: Cognigy / NICE 直接竞争
          values:
            - label: 中高
              tone: warning
              detail: 重叠最强的是欧洲企业 CX。
            - label: 高
              tone: warning
              detail: 输给直接同业可能重置品类叙事。
            - label: 中
              tone: warning
              detail: Parloa 在受监管语音工作流里仍有差异化空间。
            - label: 中高
              tone: warning
              detail: 威胁可信，但不致命。
        - label: DACH 集中度
          values:
            - label: 中
              tone: warning
              detail: 公开证据偏向德语区保险和服务业客户名单。
            - label: 中高
              tone: warning
              detail: 披露广度有限，压住 TAM 叙事。
            - label: 中
              tone: warning
              detail: 可以扩张，但执行负担重。
            - label: 中
              tone: warning
              detail: 同时是护城河，也是天花板。
        - label: LLM 商品化 / 成本压力
          values:
            - label: 中高
              tone: warning
              detail: AI CX 里的基础功能扩散很快。
            - label: 中高
              tone: warning
              detail: 长期会压缩价格和利润率。
            - label: 中低
              tone: warning
              detail: 需要拿出更强的工作流、治理和经济性证据。
            - label: 中高
              tone: warning
              detail: 偏长期，但是真实的结构性风险。
    approximationNotes: 序数评级是基于所引来源的分析判断，并非精算概率。
