      - number: '3.6'
        title: 图表
        blocks:
          - type: callout
            title: 语音优先平台深度形成持久的近期护城河
            body: >
              Parloa 用八年时间打造运营商级语音 AI——低延迟实时推理、口音和情绪识别、中断处理——CCaaS 既有玩家无法靠一层通用 LLM 一夜复制。叠加五项企业合规认证和 130
              多种语言引擎，这种技术深度是受监管欧洲企业选择 Parloa、而非 CCaaS 既有玩家的主要原因。报告的 150% NRR 和深度工作流集成带来具体切换成本，拉长客户终身价值。护城河真实存在，但随着 LLM
              商品化，仍需要持续自研模型投入来防守。
