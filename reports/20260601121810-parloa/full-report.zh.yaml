      - number: '1.3'
        title: 融资历史与投资人格局
        blocks:
          - type: paragraph
            body: >
              Parloa 在不到四年里通过四轮已披露融资筹集了超过 $560M 新股风险资本。公司于 2024 年 4 月完成 $66M Series B 轮，由 Altimeter Capital 领投，EQT
              Ventures、Newion、Senovo、Mosaic Ventures、La Famiglia Growth 参投。12 个月后，2025 年 5 月，Parloa 以 $1B 估值完成 $120M
              Series C 轮，Durable Capital Partners、Altimeter Capital、General Catalyst 领投，EQT Ventures、RPT
              Capital、Senovo、Mosaic Ventures 继续参投——Parloa 因此成为 2025 年首家德国 AI 独角兽。Series C 仅七个月后，2026 年 1 月 15 日，Parloa
              完成 $350M Series D 轮，估值 $3B，由 General Catalyst 领投，EQT Ventures、Altimeter Capital、Durable Capital
              Partners、Mosaic Ventures 跟投。$3B 估值意味着不到八个月内较 Series C 价格提升 3x。Series D 相关交易中，SAP 对 Parloa
              进行了战略投资，之后双方进一步深化商业合作，将 Parloa 智能体集成进 SAP Service
              Cloud。公开证据中未见债务融资、可转债工具或老股交易。投资人基础横跨美国和欧洲一线成长基金，既提供资本深度，也打开 DACH 地区与北美的分销网络。EQT Ventures、Altimeter
              Capital、Mosaic Ventures 连续三轮参投，显示强烈内部人信念。General Catalyst——其 CEO Hemant Taneja 位列 Forbes Midas List 前
              10——在 Series C 进入，Series D 领投，并取得监事会席位。
