      - number: '5.3'
        title: 产品模块与能力地图
        blocks:
          - type: paragraph
            body: >
              AMP 围绕五个平台子界面构建：Design、Test、Scale、Optimize（Monitor）和 Secure；这些都出现在 parloa.com 的导航中，也写入 Parloa 文档门户。Parloa
              Studio（Design）是低代码可视化构建器，支持自然语言智能体简报、预置技能（路由、知识检索、支付处理、认证）和自定义 API 动作触发器。Test 界面提供仿真环境，可在上线前用 100+
              语言画像和边缘案例跑数千次合成对话。Scale 界面管理全渠道部署和并发通话容量。Optimize 界面提供仪表盘、对话分析和反馈闭环，用于持续打磨。

              两个能力模块在核心智能体自动化之外增加差异化价值：（1）Agent Assist，为处理升级电话的人工座席提供实时翻译、下一步最佳行动建议和上下文知识浮现；（2）2026 推出的 Agent
              Composition 功能（“一次构建，处处部署”），让同一个训练好的智能体无需重建，就能同时部署到不同渠道、区域和语言。Parloa Labs 在 May 2026 的洞察中记录的 Subtask
              Agents 模块，把多智能体编排从简单主管路由向前推进：它会保持面向语音优化的响应重组，这是实时语音里的差异化工程路径。

              Parloa Labs 研究部门（labs.parloa.com）覆盖四个 R&D 领域：语音基础设施、智能体架构、智能体能力，以及可观测性与优化。May 2026 的洞察提到，Parloa 生产代码中 95%
              现在由 AI 编写（“Claude Kitchen” 项目），这代表一次值得注意的内部工程转向。
