  - id: FM004
    title: 企业采用漏斗 — 从试点到生产规模
    type: funnel
    layout: standard
    summary: 企业联络中心采用 AI 的路径，从识别痛点开始，经过试点、集成、治理审批，再走向生产规模；使用 AI 的联络中心中，只有 25% 已实现全面集成。
    data:
      items:
        - label: 痛点识别和供应商评估
          value: 100
          detail: 坐席流失、成本压力或 CX 指令触发项目。VP CX 或联络中心总监推动；IT 和采购加入评估团队。团队确定 RFP 或概念验证范围。
          tone: neutral
        - label: 概念验证部署
          value: 80
          detail: 在有限呼叫队列上落地窄用例（如呼叫路由、FAQ 自动化）。衡量拦截率、CSAT 影响和集成工作量。典型 POC 周期为 4–12 周。
          tone: neutral
        - label: 安全、集成和合规审查
          value: 60
          detail: IT 安全审查平台（SOC 2、ISO 27001、GDPR 处理方）。团队界定与 CRM、电话系统和后端系统的集成范围。法务审查 EU AI Act 或 FCC 规则下的 AI 披露义务。
          tone: warning
        - label: 商业案例和采购审批
          value: 45
          detail: ROI 模型基于拦截率、单通电话成本节省和避免增员搭建。企业合同（$300K–$2M+/年）需要高管和采购签字。平均销售周期 6–18 个月。
          tone: neutral
        - label: 分阶段生产上线
          value: 30
          detail: 从一个呼叫队列扩展到多个用例和渠道。需要持续做对话设计、坐席辅导和质量监控。全企业铺开通常需要 12–24 个月。
          tone: positive
        - label: 优化和全面集成
          value: 25
          detail: 借助分析、LLM 更新和知识库扩展，持续提升 AI 智能体表现。FreJun 数据显示，截至 2026 年 Q1，使用 AI 的联络中心中只有 25% 达到这一阶段。
          tone: positive
    approximationNotes: null
    claimRefs:
