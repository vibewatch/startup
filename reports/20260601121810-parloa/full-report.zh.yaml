      - number: '7.3'
        title: 进入市场、集中度与模型风险
        blocks:
          - type: paragraph
            body: >-
              Parloa 的公开证据集显示，公司在 DACH 很强，尤其擅长保险占比高的德语企业账户。这种集中是资产，因为它给 Parloa
              带来难度很高的受监管工作流中的可复用参考；但如果公司不能把本土市场密度转化为更广泛的欧洲和北美份额，它也会变成天花板。定价模型在这里增加摩擦。Parloa 不是低风险自助软件，而是定制化、高
              ACV、伙伴赋能的平台投资。这意味着射门次数更少，采购周期更长，对每一个大型企业订单的依赖更高。与此同时，底层 AI 栈正在变得不那么稀缺。语音 AI 资本形成仍然很重，AI
              客服功能越来越被视为产品标配，买家可以把 Parloa 同专业竞争对手和更广的平台套件同时比较。久而久之，差异化会从原始模型新颖性，转向工作流数据、实施能力、合作伙伴表现和可衡量单位经济性。如果 Parloa
              不能在守住利润率、抵御商品化的同时增长非 DACH ARR，当前投资逻辑的上行空间会迅速收窄。
