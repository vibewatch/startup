      - number: '7.2'
        title: 平台、合作伙伴与分销风险
        blocks:
          - type: paragraph
            body: >-
              Parloa 的核心战略风险不是企业不再需要 AI 客服，而是分销转向预算更厚、已掌握采购入口的平台。Amazon Connect 可以用按量计费先落地，再借 AWS 原生关系扩张。Google 的 CCAI 和
              Gemini Enterprise for Customer Experience 也能把 AI 卖给已经标准化在 Google Cloud 和相邻 CX 工具上的客户。Cognigy
              的威胁形态不同：它是德国起家的直接对话式 AI 竞争对手，融资真实、分析师可见度高，还接入 Amazon Connect，可以搭上超大规模云厂商的分销，而不是正面硬拼。Parloa
              的缓释路径，是通过伙伴主导实施和 SAP 生态建立自己的制衡力量；但这个缓释并不完美，因为它依赖第三方赋能质量和共同激励。结果是战场结构性不对称：Parloa 仍可能在语音质量、治理和受监管工作流设计上胜出，但
              Google、Amazon 和 Cognigy 往往能让最初购买决定更容易。这种不对称比原始功能清单更重要，也是竞争威胁应被视为中高而非常规的主要原因。
