    Platform（AMP）帮助大型企业在语音、聊天和消息渠道部署 AI 智能体。2026 年 1 月，公司完成由 General Catalyst 领投的 $350M Series D 轮，估值 $3B——较 2025 年 5 月
    Series C 轮的价格在八个月内翻了三倍。本轮后累计融资约 $560M。
