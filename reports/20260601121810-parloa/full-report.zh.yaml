      - number: '1.5'
        title: 里程碑、合作伙伴与反向信号
        blocks:
          - type: paragraph
            body: >
              Parloa 八年历史里密集堆叠了融资、产品和合作伙伴里程碑。2018 年创立后，公司经历未披露 Series A（据信为 2023 年）、2024 年 4 月 $66M Series B，并在 2025 年 5
              月 Series C 前 12 个月发布 AMP——公司称这是行业首个专为企业联系中心打造的智能体 AI 平台。到 2025 年末，Parloa 已达到独角兽地位，ARR 超过 $50M，NRR 达到
              150%，并推出拥有 100 多家成员组织的 Global Partner Program。2026 年 1 月 Series D 将其估值推高至 $3B，较前轮翻三倍。2026 年 4 月，Parloa
              发布《State of Agentic CX in 2026》报告，这是一次大规模基准测试：AI 智能体神秘访客访问 10,000 个企业网站，并在 800 家公司完成近 4,000
              次聊天互动。报告发现，43.3% 的 Global 2000 网站没有任何可见客服电话或聊天入口，聊天互动中不到 1/11 能解决客户陈述的目标——这既让 Parloa 成为可信行业声音，也同步验证其 TAM
              逻辑。2026 年 5 月，Parloa 加深与 SAP 的合作，将 Parloa AI 智能体集成进 SAP Service Cloud；SAP 也成为直接企业客户，用该平台做内部 IT concierge
              支持。反向方面，BuiltIn 的第三方分析称 Parloa “并非无可争议的全球领导者”，面临“激烈且资金充足的对手”，并指出“平台部分智能体管理和测试工作流仍在成熟”。TechCrunch
              观察到，Parloa 的 $50M ARR “并未实质性领先” PolyAI 的 $40M 或 Decagon 的估计收入，因此 Series C 到 Series D 的 3x
              估值跃升是否完全由商业差异化支撑，仍有疑问。Klarna 事件——这家瑞典先买后付公司激进削减人工客服岗位，随后又回撤这些决定——是整个品类的警示：企业 AI 自动化上线可能停滞或逆转。Parloa 员工数从
              380 快速增长到 2026 年底目标 600，加上美国品牌存在感仍在形成，也给强劲增长叙事增加执行风险。
