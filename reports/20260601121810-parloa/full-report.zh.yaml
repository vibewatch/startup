      - number: '8.2'
        title: 可比公司与倍数桥
        blocks:
          - type: paragraph
            body: >-
              公开和私有可比标的现在把 Parloa 框定为定价激进，而不只是有溢价。最简单的公开锚仍是 Five9：过去收入约 $1.17 billion，市值约 $1.95 billion，隐含收入比约
              1.7x。Genesys 仍说明，当分销和产品宽度得到验证后，规模化 CX 平台可以获得大体量估值。Cognigy 约 $955 million 的退出仍是最接近的直接同行战略标尺。对照这些锚点，Parloa
              January 2026 Series D 在约 $52 million ARR 上隐含约 58x ARR，而 May 2025 Series C 约为 20x。美国 AI
              原生同行解释了为什么成熟投资者仍可能加价：Sierra 估值被引用在约 $10 billion，Decagon 在 $30 million+ ARR 上的口径约 $4 billion，PolyAI 在约 $40
              million ARR 上约 $750 million。因此，Parloa 明显高于公开 CCaaS 和成熟私有 CX 可比公司，但仍低于估值最高的美国 AI 原生同行。即便如此，58x ARR
              已按持续超高速增长和利润率扩张定价，下行缓冲有限，欧洲折价也只能部分抵消这一对比。
