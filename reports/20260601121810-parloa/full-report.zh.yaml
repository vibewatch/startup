      - number: '3.3'
        title: 既有 CCaaS 与平台巨头
        blocks:
          - type: paragraph
            body: >
              Genesys Cloud CX 是 Parloa 面前最强的规模型既有玩家。公司报告 2026 财年 Q4（截至 2026 年 1 月 31 日）Cloud ARR 接近 $2.6 billion，同比增长
              35%，公司总收入接近 $3 billion。2025 年 7 月，Genesys 获得 Salesforce 和 ServiceNow 共 $1.5 billion 投资（各 $750
              million），加深与两大企业软件生态的集成管线，也释放出 Parloa 合作伙伴计划无法以同等深度复制的结构性分销优势。Genesys 服务 7,000 多家全球客户，其中 500 多家企业客户合同超过 $1
              million ARR；其净收入留存率连续 12 个季度保持在 120% 以上——与 Parloa 自身引用的 NRR 基准相当。到 FY26 Q2，Genesys Cloud AI ARR 超过 $250
              million，增长速度约为整体 Cloud ARR 的两倍；AI 驱动对话同比翻倍以上；AI 已占新业务 ACV 的 20%。其 2025 年推出的 Agent Copilot 直接瞄准 Parloa AMP
              命题核心的坐席辅助和自动化细分。NICE CXone 在 2025 年收购 Cognigy 后叠加智能体 AI，在金融服务、保险和欧洲企业细分市场直接与 Parloa 竞争，把 NICE
              的劳动力管理和合规基础设施与 Cognigy 的低代码 AI 智能体构建器结合起来。Five9 企业 Optimum 档每用户每月 $229，Genesys 约每用户每月 $155，为无法支撑 Parloa
              最低合作规模的中端市场买家提供可获得的按席位定价底线；Five9 也以公开透明定价瞄准云原生迁移，而 Parloa 明确不匹配这种模式。
