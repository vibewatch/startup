  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >-
              Parloa 的相关市场是企业联系中心 AI：软件平台和 AI
              智能体，用于自动化或增强大型组织处理的入站、出站语音、聊天和消息互动。公司自身产品面覆盖语音优先的电话自动化、真人坐席辅助、数字聊天、WhatsApp 和 Microsoft
              Teams；这些都锚定联系中心工作流，而不是后台或分析职能。该边界明确排除通用生产力 AI（内部任务 copilots）、CRM 座席许可证、云电话基础设施，以及不采购 AI 软件的外包业务流程运营。

              最相关的市场层是呼叫中心 AI 软件细分市场，多家分析机构估计其 2026 年规模为 $3–5 billion，CAGR 为 20–27%。相邻的 CCaaS（Contact Center as a
              Service）平台市场 2026 年约为 $9.4 billion，并与 Parloa 的可服务市场部分重叠，因为 CCaaS 既有玩家（Genesys、NICE、Five9）既是分销伙伴，也是替代供应商。传统
              IVR 系统是 Parloa 置换的主要现状替代品；外包 BPO 坐席则代表最大的相邻劳动力池，Parloa 平台声称可提升其生产力或替代其工作。Parloa 称其平台面对的是 $500+ billion
              全球联系中心市场，但这个头部数字包含劳动力、非 AI 技术和外包，并不能被 AI 软件供应商直接变现。
