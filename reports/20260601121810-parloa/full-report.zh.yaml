      - number: '4.3'
        title: 成本结构与单位经济
        blocks:
          - type: paragraph
            body: >
              Parloa 的主要成本类别包括：（1）作为收入成本的 LLM 推理和算力成本，因为平台在每次客户互动中都会编排多个模型供应商（OpenAI GPT、Anthropic Claude、Google
              Gemini、开源模型）；（2）工程和研发员工；（3）企业销售和市场；（4）专业服务与实施。作为 AI 原生平台，Parloa 把第三方 LLM API 嵌入每次对话，毛利率直接受每 token API
              定价影响——这与不会大规模消耗第三方推理的传统 SaaS 有结构性差异。该细分中的企业 AI 智能体平台通常把毛利率目标放在 70–80%，低于传统 SaaS 的 80–85%，反映 LLM 层进入
              COGS。LLM 定价下降可能带来顺风，但模型定价的市场波动仍是风险。

              单位经济大多不公开。150% NRR 是已披露指标中最关键的一项，确认了强 land-and-expand 动态：存量客户内扩张收入超过流失。不过，绝对 CAC、CAC 回本周期、LTV
              和毛利率均未公开披露。考虑到数百万美元企业 ACV 交易和典型 3–6 个月销售周期，CAC 绝对值可能很高，但可由较长合同期限和强 NRR 消化。AI 客服解决方案的行业基准显示，AI 处理一次互动成本为
              $0.99–$2.00，对比人工坐席 $6–$12，为客户 ROI 建模提供基础。要量化 Parloa 具体单位经济，需要 dataroom 访问。
