      - number: '3.2'
        title: 直接同业——智能体 AI 与语音专精平台
        blocks:
          - type: paragraph
            body: >
              Cognigy 在 2025 年 7 月宣布的 $955 million 收购完成后，成为 NICE 的全资子公司，是 Parloa 最接近的直接同业，也是交易完成后结构上最具威胁的竞争者。收购前，Cognigy
              于 2024 年 6 月完成 $100 million Series C 轮，由 Eurazeo Growth 领投，Insight Partners 和 DTCP 参投，累计风险融资约 $165
              million。NICE 给出的交易理由是，通过把 Cognigy 的智能体 AI 与 NICE CXone 的 CCaaS 基础设施结合，切入 $30 billion+ AI 客户体验市场。Cognigy 的
              AI 智能体支持 100 多种语言，服务 Mercedes-Benz、Nestlé、Lufthansa、Toyota 等大型企业；其低代码可视化构建器让客户内部迭代比 Parloa 的合作伙伴主导部署模式更快。在
              Gartner Peer Insights 上，Cognigy/NICE 来自 139 条评论的评分为 4.8/5，而 Parloa 44 条评论为 4.5——这是更深企业渗透的信号。SaaStr
              对这笔退出的分析指出，$955 million 价格约为 2024 年 trailing revenue 的 10x，并质疑买方支付的是不是实质 AI 能力溢价，还是战略集成溢价。PolyAI
              是一家伦敦语音专精公司，2025 年 12 月完成 $86 million Series D 轮（Georgian、Hedosophia、Khosla Ventures 共同领投，NVIDIA 和 Zendesk
              Ventures 参投），累计融资超过 $200 million，并在 45 种语言中驱动 2,000 多个企业实时部署。独立 Forrester 研究称，PolyAI 客户实现 391%
              ROI，单次部署平均节省 $10.3 million。PolyAI 在规模化入站语音分流上与 Parloa 直接竞争，但缺少 Parloa 的多渠道编排、智能体群管理生命周期和合作伙伴生态深度。Uniphore
              是更广义的企业 AI 平台公司，2025 年 10 月以 $2.5 billion 投后估值完成 $260 million Series F 轮，累计融资达到 $961
              million；其平台面向跨行业的智能体层和模型层，而不是专注联系中心原生部署。
