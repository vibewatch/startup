      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              情景分析现在最有用的用途，是检验 Parloa 能否长进 $3 billion Series D 入场价。乐观情景假设 ARR 在 18 至 24 个月内达到约 $100 million，同时高溢价 AI
              软件倍数保持韧性；这支持约 $4.5 billion 至 $6.0 billion 的价值区间。基准情景假设 ARR 达到约 $75 million 至 $80
              million，随着增长正常化出现一定倍数压缩，支持约 $2.5 billion 至 $3.5 billion 价值——相对当前标记持平到仅小幅正向。悲观情景假设增长降至约 80% 同比以下，来自
              Sierra、Decagon 和其他 AI 客户体验供应商的竞争加剧，投资者采用更低倍数；这将只隐含约 $1.2 billion 至 $2.0
              billion。区间很宽，是因为公开数据集仍然偏薄，不是因为业务缺乏牵引。关键投资测算结论是，只有 Parloa 长进这个价格，$3 billion 入场才会成为合理价值。
