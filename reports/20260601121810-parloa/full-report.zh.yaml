  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >
              Parloa 的核心产品是 AI Agent Management Platform（AMP），这是一层软件，帮助大型企业构建、测试、部署并持续改进大规模处理客户对话的 AI 智能体。AMP 不是单点聊天机器人或
              IVR，而把自己定位成全生命周期编排系统：企业团队设计智能体人设，接入后端系统，大规模模拟真实对话，在各渠道上线，再通过可观测性仪表盘监控结果。

              实际部署中，Parloa 会进入每一次入站客户触点的路径——电话、网页聊天、WhatsApp、Microsoft Teams 或点击呼叫。AI
              智能体理解自然语言意图，验证来电者身份，查询对应的企业记录系统（CRM、ERP
              或知识库），执行排期、退款、路由、信息交付等动作，最后闭环，或带着完整上下文转接给人工座席。语音优先意味着平台围绕电话音质、低端到端延迟（通常 700–900
              ms）和顺滑升级路径做优化，而不是沿用以网页为中心的聊天机器人范式。

              第三方和合作伙伴文档引用的关键客户工作流收益包括：路由准确率 97%、订单转化率提升 75%、通话解决速度加快 60%。BarmeniaGothaer 部署（“Mina”）把总机工作量降低 90%，NPS 提升
              169%。这些结果依赖后端系统深度集成和高质量训练数据，二者都是持续实施要求，不是开箱默认能力。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE012
              - CE016
