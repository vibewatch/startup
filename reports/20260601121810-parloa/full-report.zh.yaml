      - number: '1.4'
        title: 规模、牵引力与关键指标
        blocks:
          - type: paragraph
            body: >
              Parloa 最新公开财务指标显示，它是智能体 AI 领域一家快速增长的企业 SaaS 公司。公司称截至 2025 年末 ARR 已超过 $50M，早于 2026 年 1 月 Series D 公告。2024 年
              4 月 Series B 到 2025 年 5 月 Series C 之间，收入翻了四倍；这 12 个月恰逢 AMP 这个旗舰企业平台发布。Parloa 新闻室披露，截至 2025 年末净收入留存率为
              150%；若数据准确，说明其企业客户群内扩张收入很强。员工数增长很快：Series B 时约 250 人（2024 年 4 月），Series C 时约 300 人（2025 年 5 月），Series D 时
              380 人（2026 年 1 月），到 2026 年 4 月约 430 人。公司公开目标是在 2026 年底达到 600 名员工，招聘重点放在工程和销售。具名企业客户包括
              Allianz、Booking.com、HealthEquity、SAP、Sedgwick、Swiss Life、TeamViewer 和 IKEA；Parloa 称其客户基础包括多家 Fortune 200
              公司。确切客户数、毛利率和盈利数据未公开披露。Parloa 瞄准的总可触达人群——联系中心坐席——据 Gartner 估计全球有 1700 万人，支撑市场机会规模。独立评论显示，Parloa 的 $50M ARR
              虽然有分量，但并未显著领先竞争对手：PolyAI 报告其预计 2025 年 ARR 为 $40M，Decagon ARR “显著高于” $30M，而 Sierra 的 $10B 估值暗示其 ARR
              更大或享有更高溢价倍数。Parloa $3B 估值隐含 ARR 倍数约 60x——反映的是增长率预期和竞争定位溢价，而非近期盈利能力。
