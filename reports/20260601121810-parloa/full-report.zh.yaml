      - number: '2.3'
        title: 买方、用户和付款方分层
        blocks:
          - type: paragraph
            body: >-
              Parloa 的买方画像始终是企业级：大型组织，拥有显著入站电话或聊天量、既有联系中心基础设施，并需要能接入 CRM、电话和后端系统的 AI
              自动化。公开案例研究支撑的垂直行业包括金融服务（银行、保险）、零售和电商、电信、公用事业、医疗健康和信息技术。公司官网列出的目标行业包括金融服务、公用事业、电商和零售、医疗健康、媒体和娱乐、IT。

              企业联系中心 AI 的预算所有权通常由 VP of Customer Experience 或 Chief Customer Officer 与 IT /
              数字化转型职能共同发起。供应商选择流程通常由客户体验团队先识别自动化需求，再经过 IT 做安全和集成审查，最后由采购签批多年期平台合同。Parloa 的企业合同规模（据报道每年 $400,000–$2
              million）意味着需要采购层级审批，销售周期通常为 6–18 个月。

              采用触发点几乎总是可量化的：通话量上升但员工数没有同步增加、坐席流失率高而迫使自动化、降低单次互动成本的任务，或竞争压力之后启动的 CX 转型。拦截率——无需人工坐席即可解决的互动占比——是企业买家的核心
              KPI；Parloa 部署中该指标据称为 40–95%，取决于集成深度和用例复杂度。SMB 和中端市场买家不是 Parloa 的主线客群；平台的实施要求和定价结构更适合拥有专门 CX 技术团队的大型企业。
