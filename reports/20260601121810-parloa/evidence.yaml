evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Audited financial statements including gross margin, operating loss, EBITDA, and cash burn rate.
    whyItMatters: >-
      Without profitability metrics, assessing sustainable growth and path to break-even is speculative; the implied 60x
      ARR multiple at $3B valuation depends heavily on assumptions about margin expansion.
    diligencePath: Request audited financials via direct company contact or obtain Series D investor deck with unredacted financials.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: customer-count
    missingEvidence: Total number of paying enterprise customers and average contract value (ACV).
    whyItMatters: >-
      Customer concentration risk is undetermined; if a small number of large accounts drive $50M ARR, churn of one or
      two logos would be material.
    diligencePath: Request commercial metrics (customer count, ACV, logo churn) via company or Series D data room.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: regulatory-legal
    missingEvidence: >-
      Comprehensive regulatory check for any EU AI Act obligations, GDPR enforcement actions, lawsuits, or employee
      disputes involving Parloa.
    whyItMatters: >-
      As an AI company handling sensitive customer conversations for insurers and financial institutions, any regulatory
      adverse action would affect enterprise sales cycles.
    diligencePath: >-
      Search EU AI Act notified body registers, German data protection authority (BfDI) records, and Bundesanzeiger
      filings; request legal representation letter from company counsel.
    relatedQuestionRefs:
      - QO026
  - type: missing-source
    severity: minor
    topic: revenue-retention
    missingEvidence: Independent third-party verification of the reported 150% net revenue retention figure.
    whyItMatters: >-
      NRR is a critical SaaS quality metric; a company-only disclosure cannot be relied upon without auditor or investor
      corroboration.
    diligencePath: >-
      Request NRR calculation methodology and cohort data from the company; cross-reference with investor statements in
      annual LP communications.
    relatedQuestionRefs:
      - QO020
      - QO027
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: board-governance
    missingEvidence: >-
      Full Supervisory Board member roster beyond Jens Rassloff (Chairman), Hemant Taneja, and Jeannette zu Fürstenberg;
      investor board rights and independent director representation.
    whyItMatters: >-
      German GmbH or AG governance structures grant specific investor rights; full board composition is required to
      assess independence and potential conflicts.
    diligencePath: Request official Supervisory Board resolution or commercial register excerpt (Handelsregister) from the company.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: >-
      Equity ownership percentages, investor governance rights, liquidation preferences, and pro-rata rights for each
      investor in the cap table.
    whyItMatters: >-
      Without cap table details, it is impossible to determine economic return scenarios, control dynamics, or alignment
      between founders and financial investors.
    diligencePath: Request capitalization table and investor rights agreement from company counsel or Series D data room.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: first-mover-claim
    missingEvidence: >-
      Independent corroboration that Parloa's AMP was truly the first agentic AI platform purpose-built for enterprise
      contact centers, distinguishing it from earlier AI assistant or bot platforms.
    whyItMatters: >-
      The "industry's first" claim is a central positioning statement; if credible competitors launched similar
      enterprise agentic orchestration platforms before or contemporaneously with AMP, the differentiation narrative
      weakens.
    diligencePath: >-
      Survey analyst reports (Gartner MQ for Conversational AI, Forrester Wave for Intelligent Automation) from
      2023-2024 and compare product release dates of Sierra, PolyAI, Kore.ai, and Genesys AI.
    relatedQuestionRefs:
      - QO012
  - type: enumeration-incomplete
    severity: minor
    topic: early-milestones
    missingEvidence: >-
      Documented milestones from Parloa's founding year (2018) through the Series A (~2023), including product releases,
      initial customer wins, team building events, and any pivots.
    whyItMatters: >-
      The pre-Series B operating history is largely undocumented in public sources, making it difficult to assess
      founding team's execution track record and how the voice-first strategy evolved.
    diligencePath: >-
      Review German startup press coverage from 2018-2023, LinkedIn founding team profiles, and request company timeline
      documentation.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: market sizing
    missingEvidence: >-
      Verified SAM and SOM figures for the enterprise contact center AI platform segment, excluding BPO labor, CCaaS,
      and non-AI software spend, from a primary source such as an industry filing or regulatory disclosure.
    whyItMatters: >-
      Without a verified SAM, the $2.98B–$4.89B analyst bracket cannot be attributed to Parloa's specific addressable
      slice, making revenue multiple analysis speculative and valuation sensitivity analysis unreliable.
    diligencePath: >-
      Request Parloa's internal market sizing model and segment revenue breakdown; cross-check against Gartner Magic
      Quadrant for CCaaS and Gartner Market Guide for Conversational AI Platforms for enterprise segment decomposition.
    relatedQuestionRefs:
      - QM007
  - type: conflicting-data
    severity: material
    topic: market sizing
    missingEvidence: >-
      Independent resolution of the $2.98B (Fortune Business Insights) versus $4.89B (Precedence Research) call center
      AI market size discrepancy for 2026, including access to methodology notes.
    whyItMatters: >-
      A 60%+ divergence between leading analyst estimates means CAGR-based growth projections are unreliable as a single
      reference and should be treated as a range bracket, not a consensus estimate. Investors anchoring on either figure
      alone will over- or under-estimate Parloa's addressable growth opportunity.
    diligencePath: >-
      Purchase the primary Precedence Research and Fortune Business Insights reports to compare boundary definitions and
      methodologies. Cross-reference with Gartner or IDC proprietary contact center AI reports (available by
      subscription) for independent triangulation.
    relatedQuestionRefs:
      - QM002
      - QM023
  - type: private-evidence-only
    severity: material
    topic: buyer segmentation
    missingEvidence: >-
      Quantitative segment-level AI adoption readiness data comparing financial services, insurance, retail, telecom,
      and healthcare contact centers from an independent industry survey or benchmark study.
    whyItMatters: >-
      Without quantified segment penetration data, the assertion that financial services and insurance are Parloa's
      strongest near-term segments rests on qualitative case study evidence and cannot be used to estimate market
      penetration rates or segment-specific revenue upside.
    diligencePath: >-
      Obtain Gartner's annual Customer Service and Support Leader Survey or Forrester's CX automation survey for
      quantified segment-level AI adoption benchmarks. Request Parloa's internal segment revenue breakdown as part of
      due diligence data room access.
    relatedQuestionRefs:
      - QM024
      - QM010
  - type: private-evidence-only
    severity: material
    topic: Parloa-NRR
    missingEvidence: >-
      Independent corroboration of Parloa's 150% NRR figure from customer references, audited financials, or third-party
      analyst confirmation
    whyItMatters: >-
      NRR is the primary quantitative evidence for switching-cost depth; a company-disclosed figure without
      corroboration cannot anchor moat durability conclusions
    diligencePath: >-
      Request customer references for multi-year contracts; ask investors for audited ARR and NRR data in data room;
      compare to Genesys's independently reported 120%+ NRR as benchmark
    relatedQuestionRefs:
      - QP012
  - type: missing-source
    severity: minor
    topic: NICE-Cognigy-pricing
    missingEvidence: >-
      Published or independently verified pricing for the combined NICE CXone and Cognigy agentic AI bundle
      post-acquisition
    whyItMatters: >-
      Integrated pricing will determine whether NICE/Cognigy competes with Parloa on a single-bundle price point or
      positions Cognigy as a standalone add-on, affecting Parloa's competitive positioning in the enterprise
    diligencePath: >-
      Monitor NICE Systems quarterly earnings calls and pricing announcements in H2 2026; engage NICE sales team for
      enterprise quote comparison
    relatedQuestionRefs:
      - QP028
  - type: private-evidence-only
    severity: minor
    topic: compliance-comparison
    missingEvidence: >-
      Side-by-side compliance certification audit comparing Parloa's five frameworks against NICE/Cognigy and Genesys
      Cloud post-2025 certifications
    whyItMatters: >-
      If NICE/Cognigy achieves equivalent compliance, this removes one of Parloa's primary enterprise differentiators,
      particularly in GDPR-regulated European markets
    diligencePath: >-
      Request current SOC2 Type II, ISO 27001, HIPAA, and PCI DSS audit reports from Parloa; compare publicly available
      compliance pages of Genesys and NICE/Cognigy for gap analysis
    relatedQuestionRefs:
      - QP015
  - type: missing-source
    severity: material
    topic: Parloa-Azure-TAM-exclusion
    missingEvidence: >-
      Quantified evidence of enterprise deals lost or not pursued due to Parloa's Azure-centric infrastructure
      requirement, including AWS and GCP customer base exclusion rate
    whyItMatters: >-
      The scale of TAM excluded by Azure-only deployment directly affects Parloa's long-term growth ceiling and
      competitive exposure to multi-cloud incumbents
    diligencePath: >-
      Request pipeline data segmented by cloud infrastructure preference; interview lost-deal customers; assess
      multi-cloud roadmap with committed delivery dates
  - type: private-evidence-only
    severity: blocking
    topic: gross margin
    missingEvidence: >-
      Audited P&L with COGS broken down by category: LLM API inference costs, cloud infrastructure, professional
      services delivery, and other cost of revenue
    whyItMatters: >-
      Without gross margin, path to profitability and LLM cost exposure cannot be assessed; a 70% vs 80% gross margin
      changes the investment thesis materially at $52M ARR scale
    diligencePath: >-
      Request audited financial statements (IFRS or US GAAP) for FY2024–2025; require itemized COGS breakdown and gross
      margin by product line in the dataroom
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: blocking
    topic: burn
    missingEvidence: >-
      Actual gross and net monthly burn rate, current cash-on-hand balance, and a CFO-prepared 13-week rolling cash flow
      forecast
    whyItMatters: >-
      Without confirmed burn, runway cannot be validated; the $350M raise provides a nominal cushion but actual capital
