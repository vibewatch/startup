  - id: direct-peers
    title: Direct Peers — Agentic AI and Voice-Specialist Platforms
    body: >
      Cognigy, now a wholly owned subsidiary of NICE following the $955 million acquisition announced in July 2025,
      is Parloa's closest direct peer and the most structurally threatening competitor following the deal's close.
      Prior to the acquisition, Cognigy raised $100 million in its Series C (June 2024, led by Eurazeo Growth with
      participation from Insight Partners and DTCP), reaching approximately $165 million in cumulative venture
      funding. NICE's stated rationale targets the $30 billion-plus AI customer experience market by combining
      Cognigy's agentic AI with NICE CXone's CCaaS infrastructure. Cognigy's AI agents support 100-plus languages
      and serve major enterprises including Mercedes-Benz, Nestlé, Lufthansa, and Toyota, with a low-code visual
      builder that enables faster in-house iteration than Parloa's partner-led deployment model. On Gartner Peer
      Insights, Cognigy/NICE is rated 4.8 out of 5 from 139 reviews versus Parloa's 4.5 from 44 reviews — a signal
      of deeper enterprise penetration. SaaStr analysis of the exit noted the $955 million price represented roughly
      10x 2024 trailing revenue, questioning whether buyers paid a genuine AI capability premium or a strategic
      integration premium. PolyAI, a London-based voice specialist, raised $86 million in its Series D in December
      2025 (co-led by Georgian, Hedosophia, and Khosla Ventures, with NVIDIA and Zendesk Ventures participating),
      bringing total funding to over $200 million and powering more than 2,000 live enterprise deployments in 45
      languages. An independent Forrester study cited PolyAI customers achieving 391 percent ROI and average savings
      of $10.3 million per deployment. PolyAI competes directly with Parloa on inbound voice deflection at scale but
      lacks Parloa's multi-channel orchestration, agentic fleet management lifecycle, and partner-ecosystem depth.
      Uniphore, a broader enterprise AI platform company, raised $260 million in its Series F in October 2025 at a
      $2.5 billion post-money valuation, bringing total funding to $961 million; its platform targets agentic and
      model layers across industries rather than focusing on contact-center-native deployment.
    claimRefs:
