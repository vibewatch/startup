  - id: incumbent-ccaas
    title: Incumbent CCaaS and Platform Giants
    body: >
      Genesys Cloud CX is the most formidable scale incumbent facing Parloa. The company reported Cloud ARR of nearly
      $2.6 billion in Q4 fiscal year 2026 (ended January 31, 2026), up 35 percent year-over-year, with total company
      revenue approaching $3 billion. In July 2025, Genesys secured a $1.5 billion investment from Salesforce and
      ServiceNow ($750 million each), deepening integration pipelines with the two largest enterprise software
      ecosystems and signaling structural distribution advantages that Parloa's partner program cannot replicate at
      comparable depth. Genesys serves 7,000-plus global customers with more than 500 enterprise clients holding
      contracts exceeding $1 million ARR, and its net revenue retention held above 120 percent for 12 consecutive
      quarters — comparable to the NRR benchmark Parloa itself cites. Genesys Cloud AI ARR surpassed $250 million
      by Q2 FY26, growing at roughly twice the rate of overall Cloud ARR; AI-powered conversations more than doubled
      year-over-year; and AI now accounts for 20 percent of new business ACV. Its Agent Copilot, launched in 2025,
      directly targets the agent-assist and automation segment central to Parloa's AMP proposition. NICE CXone,
      now augmented with Cognigy's agentic AI following the 2025 acquisition, competes directly against Parloa in
      financial services, insurance, and European enterprise segments, combining NICE's workforce management and
      compliance infrastructure with Cognigy's low-code AI agent builder. Five9's enterprise Optimum tier at
      $229 per user per month and Genesys's approximately $155 per user per month create a per-seat pricing floor
      accessible to mid-market buyers who cannot justify Parloa's minimum engagement size, while Five9 targets
      cloud-native migration with public, transparent pricing that Parloa explicitly does not match.
    claimRefs:
