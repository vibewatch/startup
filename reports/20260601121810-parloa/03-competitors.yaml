callouts:
  - calloutType: strength
    title: Voice-First Platform Depth Creates Durable Near-Term Moat
    body: >
      Parloa's eight-year head start building carrier-grade voice AI — with low-latency real-time reasoning, accent
      and emotion recognition, and interruption handling — cannot be replicated by a CCaaS incumbent adding a generic
      LLM layer overnight. Combined with five enterprise compliance certifications and a 130-plus language engine,
      this technical depth is the primary reason regulated European enterprises choose Parloa over CCaaS incumbents.
      The 150 percent reported NRR and deep workflow integration create concrete switching costs that extend customer
      lifetime value. The moat is real but requires continued proprietary model investment to defend as LLMs commoditize.
    claimRefs:
      - CP025
      - CP027
      - CP032

  - calloutType: risk
    title: NICE-Cognigy Combined Entity Is the Most Immediate Competitive Threat
    body: >
      NICE's $955 million acquisition of Cognigy integrates the highest-rated agentic AI platform (4.8/5 on
      Gartner Peer Insights vs. Parloa's 4.5/5) into NICE's established CCaaS distribution, workforce management,
      and enterprise sales infrastructure. The combined entity competes against Parloa's full stack in financial
      services, insurance, and European enterprise segments with superior SI-channel depth, CCaaS native integration,
      and an expanding AI agent roadmap. Parloa must now compete on two fronts: winning net-new enterprise logos
      against Cognigy/NICE's integrated offering, and retaining existing customers as NICE's migration and
      cross-sell motion reaches into Parloa's European installed base.
    claimRefs:
      - CP002
      - CP004
      - CP036

  - calloutType: risk
    title: Genesys Scale and Salesforce Structural Investment Create Long-Term Displacement Risk
    body: >
      With $2.6 billion in Cloud ARR, 7,000-plus customers, NRR above 120 percent for 12 consecutive quarters,
      and a $1.5 billion investment from Salesforce and ServiceNow deepening integration into the two largest
      enterprise software ecosystems, Genesys possesses structural distribution and customer-success advantages
      that Parloa's 100-plus partner program cannot replicate at equivalent depth. Genesys AI ARR growing at
      twice the overall Cloud ARR rate, combined with Agent Copilot targeting Parloa's core agent-assist
      proposition, signals that the capability gap is narrowing faster than Parloa's head start implies.
    claimRefs:
      - CP008
      - CP009
      - CP033

