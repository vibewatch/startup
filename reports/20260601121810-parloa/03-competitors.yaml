company:
  name: Parloa
chapter:
  number: 3
  title: Competitors
  summary: >
    Parloa competes at the intersection of enterprise agentic voice AI and broader CCaaS automation, facing direct
    peers including the NICE-Cognigy combined entity (NICE acquired Cognigy for $955 million, announced July 2025)
    and PolyAI ($86 million Series D, December 2025), plus CCaaS incumbents anchored by Genesys Cloud ($2.6 billion
    ARR in fiscal 2026, backed by $1.5 billion from Salesforce and ServiceNow), NICE CXone, and Five9. Substitution
    risk from internal LLM build and platform-native tools (Microsoft Copilot Studio, Salesforce Agentforce) is real
    and growing as voice-AI frameworks commoditize. Parloa's moat rests on voice-first technical depth, five enterprise
    compliance frameworks, 130-plus language support, 150 percent reported net revenue retention, and a 100-plus
    partner ecosystem — but Azure-centric deployment, a partner-only implementation model, and a minimum deal size
    estimated at $300K-plus per year structurally limit its addressable market and expose it to displacement by
    cloud-agnostic incumbents with far greater distribution reach.

sections:
  - id: landscape-overview
    title: Competitive Landscape Overview
    body: >
      Parloa enters 2026 in a competitive landscape that divides into four overlapping rings: direct agentic AI peers
      (Cognigy/NICE, PolyAI, Uniphore), incumbent CCaaS platform leaders (Genesys Cloud CX, NICE CXone, Five9),
      adjacent platform substitutes (Microsoft Copilot Studio, Salesforce Agentforce), and the implicit status-quo
      of internal build using GPT-4-class LLMs. The overall market for enterprise agentic and conversational AI is
      attracting intense capital: voice AI VC funding grew from $315 million in 2022 to $2.1 billion in 2024,
      compressing the window in which first-movers can sustain differentiation. The NICE acquisition of Cognigy for
      $955 million consolidates the direct-peer set into an entity backed by a publicly traded CCaaS giant with global
      distribution infrastructure. Against Genesys's scale ($2.6 billion Cloud ARR, 7,000-plus customers) and
      platform-giant substitutes from Salesforce and Microsoft, Parloa's effective competitive set narrows to
      large-enterprise buyers where voice complexity, compliance depth, and multi-year platform commitment justify its
      estimated minimum deal size of approximately $300,000 per year. Smaller or faster deployments remain accessible
      to CCaaS incumbents and API-first voice vendors, while mid-market buyers can evaluate per-seat CCaaS alternatives
      at $110-229 per user per month without requiring a partner-led implementation. Kore.ai, Yellow.ai, and IBM
      watsonx Orchestrate round out the competitor landscape as additional enterprise conversational AI platforms
      competing for the same contact-center automation budget, while the internal-build option — assembling contact
      center AI from open-source LLMs and telephony APIs — represents the lowest-cost substitute for enterprises
      with sufficient ML engineering capacity.
    claimRefs:
      - CP001
      - CP028
      - CP030
      - CP031
      - CP040
    tableRefs:
      - TP001
    figureRefs:
