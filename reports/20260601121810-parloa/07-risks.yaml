  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: AI Act readiness
    missingEvidence: A buyer-ready AI governance package showing controls, audits, escalation flows, and supplier allocation under the EU AI Act.
    whyItMatters: Without external evidence, investors cannot separate marketing-grade governance language from operational readiness.
    diligencePath: Request the current governance pack, DPIA examples, and signed enterprise compliance questionnaires.
  - type: private-evidence-only
    severity: material
    topic: sales cycles
    missingEvidence: Median sales-cycle length, stage conversion, and implementation duration by region and vertical.
    whyItMatters: Competitive and concentration risks transmit through bookings timing, so sales-cycle evidence is central to underwriting.
    diligencePath: Obtain CRM funnel data and cohort-level implementation timelines for the last four quarters.
  - type: private-evidence-only
    severity: material
    topic: geographic mix
    missingEvidence: ARR share by DACH, rest of Europe, and North America plus top-customer concentration.
    whyItMatters: Public proof suggests DACH concentration, but only internal mix data can quantify how large that risk really is.
    diligencePath: Request regional ARR, top-10 customer share, and non-DACH pipeline contribution.
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: Gross-margin bridge showing model, telephony, partner-services, and support costs by deployment type.
    whyItMatters: Commoditization and pricing risk ultimately matter through gross margin and payback.
    diligencePath: Request product-level gross margin and cost-to-serve by customer cohort.
  - type: private-evidence-only
    severity: minor
    topic: win-loss analysis
    missingEvidence: Named win-loss outcomes against Amazon Connect, Google CCAI, and Cognigy in the last twelve months.
    whyItMatters: Competitive risk ranking is much stronger when matched to actual loss patterns rather than category inference.
    diligencePath: Review formal win-loss summaries with reasons, region, ACV band, and incumbent stack.
  - type: incomplete-coverage
    severity: material
    topic: Regulatory-risk register completeness (TR001)
    missingEvidence: Comprehensive public disclosure of Parloa's internal compliance roadmap, including GDPR processor agreements, AI Act conformity-assessment schedule, and data-residency controls per jurisdiction.
    whyItMatters: TR001 maps regulatory obligations at a framework level; without evidence of internal controls the coverage remains partial and investor-level verification is not possible.
    diligencePath: Request the compliance roadmap, signed DPAs, and DPIA summaries for top-five enterprise deployments.
    relatedTableRefs:
    - TR001
