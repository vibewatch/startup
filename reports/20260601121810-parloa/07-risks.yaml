callouts:
- calloutType: risk
  title: Hyperscaler distribution is the most dangerous threat vector
  body: Parloa can still outperform on workflow depth and regulated use cases, but Amazon and Google can make the buying process easier before a detailed technical bake-off even begins. That asymmetry matters more than raw feature checklists.
  claimRefs:
  - CR008
  - CR011
  - CR034
- calloutType: risk
  title: Compliance becomes recurring operating expense, not one-time legal work
  body: The AI Act and GDPR do not make Parloa uninvestable, but they do create recurring documentation, governance, and audit obligations that can lengthen sales cycles and raise cost-to-serve in the company’s strongest verticals.
  claimRefs:
  - CR003
  - CR005
  - CR006
  - CR036
- calloutType: insight
  title: DACH density is simultaneously moat and ceiling
  body: The public customer set proves Parloa wins hard regulated workflows in its home region. The same evidence also shows why investors need clearer proof of repeatability outside German-speaking Europe before underwriting a much larger TAM story.
  claimRefs:
  - CR026
  - CR030
  - CR037
