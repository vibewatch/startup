- id: platform-and-distribution
  title: Platform, Partner, and Distribution Risk
  body: 'Parloa’s core strategic risk is not that enterprises stop wanting AI customer service, but that distribution shifts toward platforms with broader budgets and pre-existing procurement control. Amazon Connect can land with usage-based pricing and then expand through native AWS relationships. Google’s CCAI and Gemini Enterprise for Customer Experience similarly let Google sell AI into customers already standardized on Google Cloud and adjacent CX tooling. Cognigy adds a different threat shape: it is a direct German-rooted conversational-AI competitor with real funding, analyst visibility, and an Amazon Connect integration that lets it piggyback on hyperscaler distribution instead of fighting it. Parloa’s mitigation is to build its own counterweight through partner-led implementation and the SAP ecosystem, but that mitigation is imperfect because it relies on third-party enablement quality and shared incentives. The net result is a structurally asymmetric battlefield: Parloa may still
    win on voice quality, governance, and regulated-workflow design, but Google, Amazon, and Cognigy can often make the initial buying decision easier. That asymmetry is the main reason the competitive threat should be treated as medium-high rather than routine.'
