chapter:
  number: 5
  title: "Product & Technology"
  summary: >
    Parloa's AI Agent Management Platform (AMP) is a voice-first, enterprise-grade orchestration layer
    that manages the full lifecycle of AI agents across phone, chat, and messaging channels. Built on
    Microsoft Azure and powered by GPT-5.4 via Azure OpenAI, the platform integrates custom telephony,
    RAG knowledge pipelines, multi-agent Subtask orchestration, and a low-code builder (Parloa Studio)
    into a single governed workflow. Certifications including ISO 27001:2022, SOC 2 Type 2, HIPAA,
    PCI DSS, and DORA underpin its positioning in regulated verticals; the primary technical gap is
    a dependence on Azure for core AI services, with limited public evidence of on-premise deployment options.

sections:
  - id: product-definition
    title: "Product Definition and Customer Workflows"
    body: >
      Parloa's core product is the AI Agent Management Platform (AMP), a software layer that allows
      large enterprises to build, test, deploy, and continuously improve AI agents handling customer
      conversations at scale. Rather than a standalone chatbot or IVR, AMP positions itself as a
      full-lifecycle orchestration system: enterprise teams design agent personas, integrate them with
      backend systems, simulate real conversations at scale, deploy across every channel, and monitor
      outcomes through observability dashboards.

      In practice, a Parloa deployment sits in the path of every inbound customer contact — phone,
      web chat, WhatsApp, Microsoft Teams, or click-to-call. The AI agent interprets natural-language
      intent, authenticates the caller, queries the relevant enterprise record system (CRM, ERP, or
      knowledge base), and executes the required action — scheduling, refund, routing, information
      delivery — before closing the loop or handing off to a human agent with full context. The
      voice-first orientation means the platform is optimized around telephone audio quality, low
      end-to-end latency (typically 700–900 ms), and seamless escalation paths rather than web-centric
      chatbot paradigms.

      Key customer workflow benefits cited in third-party and partner documentation include 97% routing
      accuracy, 75% order conversion rate uplift, and 60% faster call resolution. The BarmeniaGothaer
      deployment ("Mina") reduced switchboard workload by 90% and improved NPS by 169%. These outcomes
      depend on tight integration with back-end systems and high-quality training data, both of which
      constitute ongoing implementation requirements rather than out-of-box defaults.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE012
      - CE016
