  - id: product-modules
    title: "Product Modules and Capability Map"
    body: >
      AMP is structured around five platform sub-surfaces: Design, Test, Scale, Optimize (Monitor),
      and Secure, each surfaced in the navigation of parloa.com and documented in the Parloa docs
      portal. Parloa Studio (Design) is the low-code visual builder that accepts natural-language
      agent briefings, pre-built skills (routing, knowledge retrieval, payment processing,
      authentication), and custom API action triggers. The Test surface provides simulation
      environments that run thousands of synthetic conversations across 100+ language profiles
      and edge cases before go-live. The Scale surface manages omnichannel deployment and
      concurrent-call capacity. The Optimize surface exposes dashboards, conversation analytics,
      and feedback loops for ongoing refinement.

      Two capability modules add differentiated value beyond core agent automation: (1) Agent Assist,
      which provides real-time translation, next-best-action suggestions, and contextual knowledge
      surfacing for human agents handling escalated calls; and (2) the Agent Composition feature
      ("build once, deploy anywhere") introduced in 2026, enabling a single trained agent to be
      deployed simultaneously across channels, regions, and languages without rebuilding. The
      Subtask Agents module, documented in Parloa Labs' May 2026 insights, extends multi-agent
      orchestration beyond simple supervisor routing by maintaining voice-optimized response
      reassembly — a differentiated engineering approach for real-time voice.

      The Parloa Labs research division (labs.parloa.com) covers four R&D domains: voice
      infrastructure, agent architecture, agent capabilities, and observability & optimization.
      The May 2026 insight noting that 95% of Parloa's production code is now written by AI
      (the "Claude Kitchen" program) represents a notable internal engineering shift.
