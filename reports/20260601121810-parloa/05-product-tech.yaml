      - TE002
    figureRefs:
      - FE002

  - id: platform-architecture
    title: "Platform Architecture and Technical Foundation"
    body: >
      Parloa's technical stack is cloud-native on Microsoft Azure, using Azure Kubernetes Service
      (AKS) for container-scale orchestration and Azure Cosmos DB for stateful session storage.
      The AI layer relies on Azure OpenAI (currently GPT-5.4) for conversational reasoning and
      natural-language generation, Azure Cognitive Services for speech-to-text (STT) and
      text-to-speech (TTS) optimized for phone audio, and Azure AI Content Safety for real-time
      content moderation. The company's GitHub organization confirms Azure infrastructure-as-code
      via forked Terraform modules for Azure Redis Cache and Azure Storage Account.

      A distinguishing architectural decision is the multi-agent Subtask Agents layer, which
      decomposes complex user intents into sub-problems routed to specialized agents and reassembles
      responses before returning to the caller. This contrasts with single-LLM turn-by-turn
      approaches and is documented in Parloa Labs research published in May 2026. Parloa also
      supports Retrieval-Augmented Generation (RAG) pipelines for large enterprise knowledge bases,
      enabling agents to dynamically query policy documents, product catalogues, and support
      knowledge without retraining the base model.

      Parloa's Bring Your Own (BYO) model allows enterprises to substitute their own STT, TTS,
      or LLM in place of Azure defaults, providing flexibility for organizations with existing
      AI investments or data-residency requirements. The TextchatV2 public OpenAPI specification
      hosted at parloa.github.io documents the /dialoghook endpoint, Bearer token authentication
      scheme, and session/transaction management, confirming a documented integration contract for
      chat-channel integrators. The parloa/directives-examples repository (archived April 2026)
      demonstrates custom response directive capabilities in the agent runtime.
