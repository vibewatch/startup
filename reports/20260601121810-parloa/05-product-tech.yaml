  - id: integration-deployment-roadmap
    title: "Integration Ecosystem, Deployment, and Roadmap"
    body: >
      Parloa integrates with over 100 enterprise system connectors including CCaaS platforms
      (Five9, Genesys, NICE, Avaya), CRM systems (Salesforce, Microsoft Dynamics), ERP platforms
      (SAP), ITSM tools (ServiceNow, Zendesk), and collaboration channels (WhatsApp Business API,
      Microsoft Teams). The Five9 CX Marketplace listing and integration documentation confirm
      SIP domain routing and Call Attached Variables (CAV) as the primary voice-channel
      integration mechanism. The May 2026 SAP partnership added Parloa as an SAP Endorsed App
      available on the SAP Store, with integration into SAP Service Cloud for customer-facing
      interactions backed by SAP business data. The Epic integration (announced 2026) extends
      healthcare reach with HIPAA-compliant access to patient records.

      Typical deployment timelines run one to three months for standard integrations; Parloa
      markets go-live in weeks for simpler single-channel deployments. The platform's scalability
      claim is unlimited concurrent conversations on Azure infrastructure, though no public SLA
      or uptime track record is published. Reliability tooling includes versioned agent rollouts,
      audit logs, simulation-based regression testing, and a staged deployment model. The Parloa
      documentation portal (docs.parloa.com) includes AMP Documentation, Release Notes, and
      whitelisted RBA/RTT documentation for qualified partners and customers.

      The 2026 roadmap (as surfaced in the Series D momentum press release and Parloa Innovation
      portal) prioritizes: Agent Composition (build-once cross-channel), expansion of the partner
      ecosystem (SAP, OpenAI, BPO partners Teleperformance and Concentrix), a Consumer Patience
      Index research publication (June 2026), new CX measurement capabilities for conversation
      quality and resolution effectiveness, and global office expansion across Europe and North America.
    claimRefs:
