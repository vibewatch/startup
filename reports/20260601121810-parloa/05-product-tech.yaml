callouts:
  - calloutType: strength
    title: "Voice-First Architecture is a Durable Differentiator"
    body: >
      Parloa's purpose-built telephony stack — custom acoustic models, 700–900 ms latency optimization,
      and voice-safe multi-agent orchestration — represents a genuine engineering moat against
      competitors that added voice to existing web chatbot platforms. The one-billion-interaction
      training footprint and multi-year partnerships with Microsoft and SAP reinforce this advantage.
    claimRefs:
      - CE003
      - CE010
      - CE036

  - calloutType: risk
    title: "Azure Single-Cloud Concentration Is the Primary Infrastructure Risk"
    body: >
      Parloa's core AI services — LLM inference, STT/TTS, content safety, and container
      orchestration — all depend on Microsoft Azure. No public documentation describes an
      on-premise deployment path, multi-cloud fallback, or Azure region failover SLA.
      Enterprise buyers with multi-cloud mandates, data-sovereignty restrictions beyond GDPR,
      or government procurement requirements will need to assess this concentration directly
      with Parloa.
    claimRefs:
      - CE007
      - CE008
      - CE041
      - CE042

  - calloutType: insight
    title: "Developer Surface Is Thin: API Spec Public, SDK and CLI Not"
    body: >
      Parloa publishes a TextchatV2 OpenAPI specification on GitHub Pages and maintains an
      Azure infrastructure-as-code repository, but the broader developer ecosystem (SDK, CLI,
      native developer portal, public community forum) is not evident from public signals.
      The Hacker News search results for Parloa are dominated by Series D coverage rather than
      developer adoption threads, indicating low developer-community surface versus product depth.
    claimRefs:
      - CE020
      - CE022
      - CE023

