  - id: trust-security-compliance
    title: "Trust, Safety, Security, and Compliance"
    body: >
      Parloa's security posture is enterprise-grade and independently certified across the major
      frameworks relevant to regulated industries. ISO 27001:2022 (information security management),
      SOC 2 Type 2 (security, availability, confidentiality), PCI DSS (payment card data), HIPAA
      (US healthcare), GDPR (EU data protection), and DORA (EU digital operational resilience) are
      all listed on the Parloa homepage and confirmed on the platform/secure sub-page. The company
      explicitly calls out external penetration testing, role-based access control, PII redaction
      with configurable retention policies, and end-to-end encryption for all interactions at rest
      and in transit.

      Responsible AI controls include human-in-the-loop workflows for sensitive interactions,
      version control and full audit logs for every AI agent update, transparent evaluation
      processes, and Azure AI Content Safety integration for content moderation (blocking hate
      speech, violence, sexual content, and self-harm). The platform's observability design makes
      AI performance traceable and accountable — a requirement in regulated verticals where
      unexplainable AI decisions carry legal risk.

      The Five9 integration documentation and Microsoft Marketplace listing both confirm compliance
      posture in enterprise procurement contexts. The SAP Endorsed App certification adds in-depth
      testing and cloud operations best-practice assessment. The outstanding compliance gap is the
      absence of publicly documented on-premise deployment options, which could be material for
      EU-based organizations with strict data-sovereignty requirements beyond GDPR or DORA,
      and for government-sector buyers.
    claimRefs:
      - CE017
      - CE024
      - CE025
      - CE026
      - CE027
      - CE028
      - CE029
      - CE030
      - CE031
