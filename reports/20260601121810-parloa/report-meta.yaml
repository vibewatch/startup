companyProfile:
  summary: >-
    Parloa is a Berlin-based enterprise AI platform for customer service automation. Founded in 2018 by
    Malte Kosub (CEO) and Sebastian Dowski (CTO), Parloa's AI Agent Management Platform (AMP) enables
    large enterprises to deploy AI agents across voice, chat, and messaging channels. In January 2026 the
    company raised a $350M Series D led by General Catalyst at a $3B valuation—tripling its price in
    eight months from the May 2025 Series C. The round brings total capital raised to roughly $560M.
  foundedDate: '2018-01-01'
  founders:
    - name: Malte Kosub
      role: CEO
      background: Serial entrepreneur in conversational AI
    - name: Sebastian Dowski
      role: CTO
      background: Technical co-founder with deep NLP/conversational AI background
  foundingLocation: Berlin, Germany
  headquarters: Berlin, Germany
  productSummary: >-
    AI Agent Management Platform (AMP): an LLM-agnostic orchestration layer for enterprise AI agents in
    customer service. Supports voice and chat, is GDPR-compliant and multilingual, and includes QA,
    analytics, and pre-built integrations to SAP, Salesforce, and ServiceNow.
  customerFocus: Large enterprises in financial services, insurance, retail, telecom, and travel; DACH-led with US expansion underway
  businessModel: Platform licensing plus per-minute consumption fees under enterprise multi-year contracts
  stage: Series D
  fundingStatus: >-
    $350M Series D at $3B (January 2026) led by General Catalyst; prior rounds include $120M Series C at
    $1B (May 2025) with Durable Capital, Altimeter, EQT Ventures, and Mosaic Ventures. Total raised ~$560M.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO017, CO018, CI009, CI017, CV001]
summary:
  headline: >-
    Parloa's 150% NRR, 117% ARR growth, and blue-chip enterprise proof justify a premium, but the
    January 2026 Series D prices the company at ~58x ARR—a stretched multiple that leaves limited
    cushion for execution misses. Prudent stance is Research More until gross margin, GRR, and
    forward-growth evidence catch up to the $3B mark.
  overallScore: 6.5
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
