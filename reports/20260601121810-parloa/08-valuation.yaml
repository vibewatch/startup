- id: comparables-and-multiple-bridge
  title: Comparables and Multiple Bridge
  body: 'Public and private comparables now frame Parloa as aggressively priced rather than merely premium. The simplest public anchor remains Five9: about $1.17 billion of trailing revenue and roughly $1.95 billion of market capitalization, implying about a 1.7x revenue ratio. Genesys still shows that scaled CX platforms can command large values when distribution and product breadth are proven. Cognigy’s roughly $955 million exit remains the closest direct-peer strategic marker. Against those anchors, Parloa’s January 2026 Series D implies roughly 58x ARR on about $52 million of ARR, versus roughly 20x at the May 2025 Series C. US AI-native peers help explain why sophisticated investors may still pay up: Sierra is cited around a $10 billion valuation, Decagon around a $4 billion talk-track on $30 million-plus ARR, and PolyAI around $750 million on roughly $40 million of ARR. So Parloa is clearly above public CCaaS and mature private-CX comps, yet still below the richest US AI-native peer marks. Even so, at 58x ARR the company is priced for continued hypergrowth and margin expansion with limited downside cushion, and the Europe discount only partially offsets that comparison.'
