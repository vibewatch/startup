- id: scenario-analysis
  title: Bull, Base, and Bear Scenarios
  body: 'Scenario analysis is now most useful as a test of whether Parloa can grow into the $3 billion Series D entry. The bull case assumes ARR reaches roughly $100 million within 18 to 24 months while premium AI-software multiples remain durable; that supports a value range of about $4.5 billion to $6.0 billion. The base case assumes ARR reaches roughly $75 million to $80 million with some multiple compression as growth normalizes, supporting about $2.5 billion to $3.5 billion of value—flat to only modestly positive versus the current mark. The bear case assumes growth decelerates below roughly 80% year over year, competition from Sierra, Decagon, and other AI customer-experience vendors intensifies, and investors apply lower multiples; that would imply only about $1.2 billion to $2.0 billion. The spread is wide because the public dataset is still thin, not because the business lacks traction. The key underwriting conclusion is that the $3 billion entry becomes fair value only if Parloa grows into it.'
