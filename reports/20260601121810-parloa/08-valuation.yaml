- id: diligence-path-and-thesis-breaks
  title: Exit Logic, Diligence Path, and Thesis-Break Triggers
  body: 'The investment case remains usable, but only with explicit follow-up asks. The central unresolved question is not whether Parloa has product-market fit; it is whether the economics behind the growth narrative can support a $3 billion mark through a longer cycle and wider geography. Investors need audited ARR, cohort expansion, gross margin, and regional mix before they can move from round-price awareness to fair-value conviction. Exit logic remains real. A strategic acquirer with existing enterprise distribution could justify paying more than public-market comps alone, especially if Parloa continues to compound customer proof in regulated verticals. But that optionality should be treated as upside, not as the base case. Thesis-break conditions are straightforward: growth slows below the level required to support a premium, new financial disclosure reveals weak gross margin or mediocre retention, or hyperscaler and direct-peer losses start to accumulate in core accounts.
    Until then, the right stance is constructive but gated. Parloa has won a premium institutional valuation; it has not yet proved that the $3 billion rerating offers an attractive entry for a new investor.'
