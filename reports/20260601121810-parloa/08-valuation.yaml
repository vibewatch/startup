  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ARR quality and comparable-table completeness
    missingEvidence: Audited ARR, MRR, and cohort expansion/churn data for 2025 and 2026.
    whyItMatters: The premium multiple is only defensible if the revenue base is both real and durable, and TV003 remains only a sample without full internal metrics.
    diligencePath: Request audited financials or board-pack revenue cohort data.
    relatedTableRefs:
    - TV003
  - type: private-evidence-only
    severity: material
    topic: gross margin
    missingEvidence: Gross-margin bridge by customer cohort and deployment type.
    whyItMatters: Margin quality determines whether AI-software premiums can persist beyond a financing event.
    diligencePath: Review FP&A materials and model/telephony cost allocations.
  - type: private-evidence-only
    severity: material
    topic: regional mix
    missingEvidence: ARR split across DACH, broader Europe, and North America.
    whyItMatters: Geographic concentration is a direct input into multiple selection and TAM confidence.
    diligencePath: Request regional ARR and top-customer concentration data.
  - type: private-evidence-only
    severity: minor
    topic: win-loss
    missingEvidence: Formal win-loss data against Amazon, Google, and Cognigy.
    whyItMatters: Competitive outcomes influence how much premium above public CCaaS is justified.
    diligencePath: Review sales-ops win-loss reports by region and ACV band.
  - type: private-evidence-only
    severity: material
    topic: round price versus fair-value assumptions
    missingEvidence: At ~58x ARR, the $3B valuation implies growth and margin assumptions that are not yet publicly verified.
    whyItMatters: A gap exists between the round price (public fact) and the economic assumptions (gross margin, forward ARR, GRR) that would need to be true for the round price to represent fair value.
    diligencePath: Validate gross margin, forward ARR, and GRR in management materials before treating the Series D mark as fair value.
