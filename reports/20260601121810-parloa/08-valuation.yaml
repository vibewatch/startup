  title: Thesis / Anti-Thesis Table
  columns:
  - Side
  - Argument
  - What would change the view
  rows:
  - - Thesis
    - ~$52M ARR with 150% NRR and 117% growth can justify a premium to public CCaaS, but not 58x without further proof.
    - Audited evidence of sustained >100% growth plus strong gross margin would strengthen the thesis
  - - Thesis
    - General Catalyst's board-level conviction plus all prior investors re-upping signals informed institutional backing for the $3B mark.
    - Evidence that the round was highly competitive rather than fundamentally underwritten would weaken the signal
  - - Anti-thesis
    - At 58x ARR, the valuation is at the top end of enterprise software multiples; any growth deceleration creates severe downside.
    - Proof that Parloa can double ARR quickly while keeping premium margins would soften this concern
  - - Anti-thesis
    - Europe/private-company discount plus DACH concentration should limit upside multiple expansion.
    - Broader non-DACH mix and strategic-customer wins would improve the case
  notes: This table separates what is true today from what still requires validation.
