  title: Thesis-Break Trigger Table
  columns:
  - Trigger
  - Why it matters
  - Action implication
  rows:
  - - Growth slows below premium-software thresholds
    - The valuation case depends on sustained above-market growth
    - Re-underwrite using lower private-market multiples
  - - Gross margin or retention disappoints
    - Would show weaker economics than the headline growth narrative implies
    - Move from research-more to avoid or pause depending on severity
  - - Repeated losses to hyperscalers or direct peers
    - Would challenge moat and pricing power assumptions
    - Reduce strategic-premium component in valuation
  - - International expansion stalls
    - Would keep Parloa tied to a narrower DACH-led TAM narrative
    - Cap upside and treat the current mark as full valuation
