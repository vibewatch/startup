chapter:
  number: 5
  title: Product & Technology
  summary: 'Antares’ R1 architecture is unusually concrete for an early microreactor company: TRISO HALEU in a prismatic
    graphite core, passive sodium heat pipes, fin-and-tube heat exchange, recuperated nitrogen Brayton conversion,
    integrated shielding, and microgrid PMAD. The main diligence issue is maturity: Mark-0 validated zero-power
    reactor physics, but full-power heat removal, Brayton coupling, HALEU supply scale, factory QA, and 2028 deployment
    remain unproven.'
sections:
- id: r1-product-definition
  title: R1 product definition and customer workflow
  body: 'Antares is not selling a conventional grid generator or a licensing-only reactor concept; the public R1
    narrative is a factory-produced, transportable microreactor that delivers strategic power where fuel logistics,
    grid dependence, and outage exposure are mission problems. The customer workflow is clearest for defense installations
    and space-adjacent missions: move a shielded sealed unit to a host site, operate for six or more years without
    on-site refueling, condition electricity through the power-management node, and connect it to local installation
    microgrids. Public sources put the product envelope at 100 kWe to 1 MWe, which is small compared with utility
    SMRs but well matched to resilient base loads, remote sites, and critical facilities. The diligence caution
    is that this is still a product definition rather than a field-proven service model: JBSA and other defense
    paths provide named deployment channels, but public sources do not yet disclose installation one-line diagrams,
    uptime guarantees, operating staffing, or lifecycle support economics.'
