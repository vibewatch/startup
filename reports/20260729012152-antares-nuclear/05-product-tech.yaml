- id: TE005
  title: Risk / qualification status table
  columns:
  - risk area
  - current public status
  - why it matters
  - near-term proof point
  - residual gap
  rows:
  - - Zero-power-only criticality
    - Mark-0 achieved criticality with essentially no measurable energy output
    - Avoids overstating the milestone as electricity generation
    - Mark-1 full-power operation
    - No full-power public nuclear data yet
  - - Heat-pipe qualification
    - Company says final qualification remains in 2026 conditions-setting work
    - Primary passive safety and heat transport depend on it
    - EDU v2.0 and Mark-1 thermal data
    - No public long-duration nuclear heat-pipe dataset
  - - Brayton-cycle coupling
    - Mark-0 did not include power conversion or heat removal
    - R1 value proposition is electricity, not only neutronics
    - Coupled Mark-1 reactor/Brayton run
    - No published efficiency or availability curves
  - - HALEU supply
    - BWXT/government material now; Urenco contract later
    - Fuel availability controls production scale
    - Urenco AFF progress and U.S. HALEU supply
    - 2031 timing and political/export risk
  - - Regulatory pathway
    - DOE test path now; ANPI Army-regulated track; NRC still relevant commercially
    - Defense deployment can differ from civilian commercialization
    - PDSA/DSA/readiness decisions and JBSA environmental review
    - Civil NRC pathway not complete
  - - Factory scale-up
    - Antares Prime and Torrance mass-production ambitions public
    - Factory-sealed model depends on repeatable production and QA
    - First sealed units and acceptance tests
    - No public yield/cost or reliability fleet data
  notes: Risk status reflects evidence available by the run date; several items should be refreshed after Mark-1
    or ANPI filings.
