- id: TE002
  title: Subsystem / component breakdown of the seven public R1 subsystems
  columns:
  - '#'
  - subsystem
  - role
  - dependency
  - risk or open diligence point
  rows:
  - - 1
    - Integrated shielding & transport cradle
    - Packages shielding and transport support for deployment
    - Shielding analysis, logistics handling, site constraints
    - No public site-specific dose or transport package analysis in chapter sources
  - - 2
    - Reactivity controls
    - Graphite/boron carbide control drums with independent actuators
    - Control-drum worth, actuator reliability, controls software
    - Mark-0 validates physics but not long-duration power operation
  - - 3
    - TRISO prismatic graphite core
    - Sustains fission with HALEU TRISO compacts
    - BWXT fuel, graphite machining, DOE/NNSA feedstock
    - HALEU supply and fuel qualification remain gating dependencies
  - - 4
    - Sodium heat pipes
    - Move heat passively from core toward exchanger
    - Heat-pipe fabrication, sodium compatibility, thermal testing
    - Qualification completion still pending in 2026 sources
  - - 5
    - Primary heat exchanger
    - Transfers heat through fin-and-tube exchanger
    - Materials, fouling/corrosion controls, thermal margins
    - No public full-power nuclear heat-transfer data
  - - 6
    - Nitrogen Brayton cycle
    - Converts heat to electricity below 300 psi
    - Turbomachinery, recuperator, seals, controls
    - Not coupled to Mark-0; Mark-1 must prove integration
  - - 7
    - Power management & distribution
    - Conditions power and connects to installation microgrids
    - Power electronics, protection, host microgrid interface
    - JBSA integration details and support model not public
  notes: Enumeration is exhaustive for the seven numbered R1 subsystems on the company site, but not a full bill
