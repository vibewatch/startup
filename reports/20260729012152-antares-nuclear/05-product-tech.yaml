- id: development-roadmap-and-readiness
  title: Development roadmap and readiness assessment
  body: 'The maturity story is best read as rapid, staged risk retirement rather than commercial readiness. Antares
    reports CDR, NSDA, PDSA submission, Antares Prime, first EDU testing, HALEU allocation, and fuel fabrication
    in 2025. The June 4, 2026 Mark-0 criticality is a real technical milestone because it exercised reactor physics
    and reactivity-control behavior under DOE authorization at INL. However, INL Director John Wagner’s distinction
    matters for diligence: zero-power criticality is not electricity generation, not full-power operation, and not
    thermal performance evidence. Antares’ own roadmap therefore makes Mark-1 the decisive next milestone. The 2027
    Mark-1 plan must prove coupled core feedback, heat removal, Brayton conversion, controls, and sustained electricity
    production. Until then, a practical TRL read-through is mixed: reactor-physics proof is ahead of most startup
    peers, while product-level performance, reliability, maintainability, and dispatch data remain pre-commercial.'
