- id: regulatory-trust-and-open-risks
  title: Regulatory-technical pathway, trust controls, and open risks
  body: Antares’ near-term regulatory-technical pathway is not the same as ordinary civilian NRC commercialization.
    Mark-0 advanced through DOE authorization under the Reactor Pilot Program, using safety-basis artifacts such
    as NSDA and PDSA work plus categorical exclusions around INL activities. ANPI and Joint Base San Antonio create
    a separate military installation pathway that is expected to involve siting, licensing, construction, operation,
    decommissioning, environmental review, and military regulatory approvals. NRC pre-application material still
    matters for later non-defense commercialization, but the company’s first proof points are DOE and defense led.
    For diligence, this makes trust evidence uneven. Public sources support reactor-physics validation, fuel-chain
    progress, and a named customer track. They do not yet support full-power reliability, completed heat-pipe and
    Brayton qualification, civilian license readiness, or repeatable sealed-unit production. The adverse interpretation
    is not that R1 is implausible; it is that Antares has compressed several first-of-a-kind risks into a 2027–2028
    window.
