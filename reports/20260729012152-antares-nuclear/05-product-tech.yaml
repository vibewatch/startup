  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Full-power operating data
    missingEvidence: No public full-power nuclear operating data, electricity output curve, capacity factor, or
      availability dataset was found for R1 or Mark-1 as of the run date.
    whyItMatters: The investable product claim depends on sustained electricity production, not only zero-power
      criticality.
    diligencePath: Request Mark-1 test plan, acceptance criteria, post-test operating logs, power-conversion data,
      and independent review after the 2027 campaign.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: Heat-pipe and Brayton qualification
    missingEvidence: Public sources say heat pipes, heat exchanger, and power-conversion qualification remain on
      the roadmap, but do not publish final qualification reports.
    whyItMatters: These subsystems carry the passive-safety and electricity-production differentiation of the R1.
    diligencePath: Request EDU v2.0 qualification results, thermal cycling data, Brayton test results, failure modes,
      and material inspection reports.
    relatedQuestionRefs:
    - QE024
    - QE027
    relatedTableRefs:
    - TE002
    - TE005
  - type: missing-source
    severity: material
    topic: HALEU supply continuity
    missingEvidence: Public sources do not prove enough commercial HALEU availability for repeated 2028-era deployments
      beyond government material and future Urenco capacity.
    whyItMatters: Fuel availability can cap production regardless of reactor technical maturity.
    diligencePath: Request contracted quantities, delivery schedule, enrichment licenses, export-control assumptions,
      and contingency supply options.
    relatedQuestionRefs:
    - QE019
    - QE020
    - QE027
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: Factory quality and cost
    missingEvidence: No public yield, unit-cost, QA escape-rate, first-article acceptance, or sealed-unit manufacturing
      audit data was found.
    whyItMatters: The factory-sealed thesis depends on repeatability as much as on reactor design.
    diligencePath: Request manufacturing readiness level evidence, QA manuals, supplier quality metrics, and costed
      production learning curves.
    relatedQuestionRefs:
    - QE010
    - QE011
    - QE027
    relatedTableRefs:
    - TE004
    - TE005
  - type: enumeration-incomplete
    severity: minor
    topic: Subsystem / component breakdown TE002
    missingEvidence: TE002 is exhaustive only for the seven public R1 subsystems, not for internal components, supplier
      names, instruments, valves, sensors, or detailed controls.
    whyItMatters: A full bill of materials would be needed to underwrite reliability, supplier concentration, and
      manufacturability.
    diligencePath: Request controlled BOM, supplier map, component qualification matrix, and safety-classification
      basis.
    relatedQuestionRefs:
    - QE003
    relatedTableRefs:
    - TE002
  - type: missing-source
    severity: minor
    topic: Civil NRC commercialization path
    missingEvidence: NRC pre-application presence is public, but a completed civilian license application or approval
      for R1 was not found.
    whyItMatters: Defense and DOE test authorization may not translate directly to broad civilian markets.
    diligencePath: Review NRC ADAMS submissions, planned Part 50/52/53 pathway, and correspondence after additional
      pre-application meetings.
    relatedQuestionRefs:
    - QE021
    - QE022
    relatedTableRefs:
    - TE005
