      - QP026
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: Pricing and contract terms
    missingEvidence: >-
      No retained public source discloses comparable turnkey prices, O&M scope, fuel-service terms, gross margins, or
      discounting for Antares and direct rivals.
    whyItMatters: Without contract economics, competitive advantage cannot be translated into margin or win-rate confidence.
    diligencePath: >-
      Request Antares bids, ANPI pricing assumptions, fuel-service agreements, and win-loss analysis versus Radiant and
      Westinghouse.
    relatedQuestionRefs:
