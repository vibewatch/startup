      contract model, or funding for a full apples-to-apples comparison.
    whyItMatters: >-
      These peers reached criticality milestones and could pressure Antares timelines even if product comparability is
      unclear.
    diligencePath: >-
      Collect DOE pilot filings, safety-basis summaries, investor materials, and customer announcements from Aalo and
