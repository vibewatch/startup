evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Revenue and run-rate are not publicly disclosed
    missingEvidence: Recognized revenue, contracted backlog conversion, revenue run-rate, and payment schedules by program.
    whyItMatters: Funding and government milestones cannot substitute for commercial economics in valuation and financial diligence.
    diligencePath: Request management financials, customer contracts, invoices, backlog bridge, and revenue-recognition memo.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: Customer count and orderbook are not publicly quantified
    missingEvidence: >-
      Exact active customer count, signed reactor orders, committed orderbook value, and cancellation or contingency
      terms.
    whyItMatters: ANPI and agency references show traction but do not reveal how many paying customers exist.
    diligencePath: Request CRM export, signed contract list, government award pipeline, and orderbook reconciliation.
    relatedQuestionRefs:
      - QO014
      - QO027
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: Exact current headcount is absent from retained public sources
    missingEvidence: Current employee count, functional split, open roles, attrition, and nuclear-qualified staff count.
    whyItMatters: Manufacturing and regulatory execution depend on scarce nuclear and aerospace talent.
    diligencePath: Request HR headcount report, recruiting plan, attrition data, and critical-role vacancy list.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: Julia DeWahl founder status is third-party-reported but not official-current
    missingEvidence: Founder agreement, current employment or board status, and company-confirmed leadership-change timeline.
    whyItMatters: Founder attribution affects governance history, key-person risk, and public narrative accuracy.
    diligencePath: Ask management to confirm all founders, current roles, departures, board seats, and public bio changes.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: Board and investor-control map is not public
    missingEvidence: >-
      Board roster, observer rights, investor rights agreement, voting thresholds, liquidation preferences, and side
      letters.
    whyItMatters: The Series C capital stack may carry governance rights that materially affect exit and financing outcomes.
    diligencePath: Request cap table, charter, investor-rights agreement, side letters, and current board minutes.
    relatedQuestionRefs:
      - QO007
      - QO026
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: Milestone table omits private internal gates and contract signatures
    missingEvidence: >-
      Internal design reviews, private board approvals, full contract-signature chronology, and deployment down-select
      records.
    whyItMatters: The public chronology is adequate for overview but should not be mistaken for a full operating history.
    diligencePath: Request management milestone tracker, program plan, and signed contract timeline.
    relatedQuestionRefs:
      - QO028
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: Fuel-supply dependency cannot be fully underwritten from public sources
    missingEvidence: HALEU volumes, delivery schedules, contingency suppliers, DOE allocation terms, and Urenco contract conditions.
    whyItMatters: HALEU timing is a known advanced-nuclear bottleneck and can delay deployment even if reactor design progresses.
    diligencePath: Review fuel-supply agreements, DOE allocation letters, BWXT fabrication schedule, and alternate supply plan.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: Antares-specific SOM
    missingEvidence: >-
      Public sources do not disclose Antares’ qualified pipeline, priced backlog, expected unit deliveries by segment,
      or win-share assumptions.
    whyItMatters: >-
      Without bottom-up customer and deployment evidence, broad SMR or data-center TAM estimates can dramatically
      overstate near-term revenue.
    diligencePath: >-
      Request data-room pipeline by customer, site, regulatory path, expected COD, unit price, and probability-weighted
      conversion.
    relatedQuestionRefs:
      - QM007
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: Defense budget ownership
    missingEvidence: >-
      ANPI and Janus identify program channels but do not disclose exact budget line, acquisition owner, award value, or
      base-level approval chain for Antares.
    whyItMatters: Sales timing and price tolerance depend on which federal office controls procurement and sustainment funding.
    diligencePath: >-
      Obtain solicitations, OT award documents, base siting records, and management interviews covering acquisition
      authority.
    relatedQuestionRefs:
      - QM012
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: SMR market sizing spread
    missingEvidence: >-
      Market publishers disagree on SMR revenue forecasts and WoodMac reports pipeline investment rather than comparable
      annual revenue.
    whyItMatters: The spread changes TAM assumptions and can lead to false precision in valuation models.
    diligencePath: >-
      Normalize estimates by reactor size, geography, application, revenue versus capex, and probability-adjusted
      deployment.
    relatedQuestionRefs:
      - QM021
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: HALEU delivery timing and allocation
    missingEvidence: >-
      Public evidence does not verify Antares’ exact HALEU delivery schedule, quantity, enrichment source, or
      contingency plan for commercial units.
    whyItMatters: >-
      Fuel availability can become the binding constraint even if customer demand and regulatory authorization are
      present.
    diligencePath: Review fuel supply contracts, DOE allocations, fabrication schedule, and alternative fuel-provider commitments.
    relatedQuestionRefs:
      - QM015
      - QM026
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: Civilian customer willingness to pay
    missingEvidence: >-
      Public sources do not provide data-center, industrial, or remote-site willingness-to-pay evidence for Antares’
      delivered cost.
    whyItMatters: Lazard’s SMR cost context suggests non-defense segments may be slower unless customers pay a resilience premium.
    diligencePath: Request LOIs, PPAs, customer interviews, delivered-cost stack, and substitute comparisons by segment.
    relatedQuestionRefs:
      - QM016
      - QM022
      - QM027
    relatedTableRefs:
      - TM003
      - TM004
  - type: enumeration-incomplete
    severity: minor
    topic: Competitor profile table
    missingEvidence: >-
      The table covers representative direct and adjacent competitors but cannot be exhaustive because emerging DOE
      pilot participants and stealth fuel-cycle entrants change quickly.
    whyItMatters: A new entrant with DOD sponsorship or HALEU control could alter the competitive set before deployment.
    diligencePath: Refresh DOE pilot rosters, DOD OTA awards, and competitor financing releases before investment committee.
    relatedQuestionRefs:
      - QP001
