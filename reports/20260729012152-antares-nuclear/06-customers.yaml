  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Revenue and retention
    missingEvidence: No public source disclosed Antares reactor revenue, recognized customer revenue, NRR, GRR, churn, renewal
      rates, or customer satisfaction metrics.
    whyItMatters: Without these metrics, the chapter can validate procurement traction but cannot underwrite durable customer
      economics.
    diligencePath: Request customer-level revenue, milestone payments, renewal terms, cancellation rights, and retention/cohort
      reporting from management.
    relatedQuestionRefs:
    - QU013
    - QU014
    - QU028
    relatedTableRefs:
    - TU006
  - type: private-evidence-only
    severity: material
    topic: Committed orderbook
    missingEvidence: CEO-described firm contracts and committed orderbook are not broken out by counterparty, reactor count,
      dollar value, deposits, or delivery schedule.
    whyItMatters: Orderbook quality is central to valuation and production planning, but public evidence cannot distinguish
      firm funded backlog from conditional program awards.
    diligencePath: Request signed contracts, award documents, offtake schedules, termination provisions, and backlog aging
      by government agency.
    relatedQuestionRefs:
    - QU016
    - QU017
    relatedTableRefs:
    - TU002
  - type: enumeration-incomplete
    severity: minor
    topic: Named customer proof table
    missingEvidence: The table enumerates public government, host, contract, and partner proof but likely omits confidential
      customers or NDA-stage government opportunities.
    whyItMatters: A defense-first startup may have classified or procurement-sensitive customer evidence that cannot be validated
      from public sources.
    diligencePath: Request a sanitized pipeline export that separates signed, awarded, shortlisted, proposed, and speculative
      opportunities.
    relatedQuestionRefs:
    - QU001
    - QU027
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: Civilian commercial customers
    missingEvidence: No named non-defense utility, data-center, mining, remote-industrial, or civilian commercial customer
      was found in retained public sources.
    whyItMatters: Commercial diversification is necessary to reduce dependency on U.S. government policy and procurement cycles.
    diligencePath: Ask management for signed civilian LOIs, NRC licensing customer plans, and segmentation of defense versus
      non-defense backlog.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU001
    - TU006
  - type: missing-source
    severity: minor
    topic: NASA customer status
    missingEvidence: Retained sources mention NASA in the space customer ecosystem but do not show a direct NASA award to
      Antares.
    whyItMatters: Overstating NASA as a customer would inflate the perceived breadth of the space segment.
    diligencePath: Search FPDS/USAspending and NASA procurement portals for Antares awards and request management confirmation.
    relatedQuestionRefs:
    - QU018
    relatedTableRefs:
    - TU001
