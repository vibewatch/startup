- id: s602
  title: ANPI and JBSA are the clearest named customer proof, but the milestone remains pre-deployment
  body: 'The best named-customer proof is the ANPI/JBSA lane. Official Air Force, Space Force, JBSA, DIU, and Antares announcements
    establish that Antares was selected for proposed deployment of an R1 prototype at Joint Base San Antonio, with site-specific
    and NEPA work ahead and a program objective of at least one DAF reactor operating by 2030 or sooner. That is materially
    stronger than a logo: JBSA is a named installation, the role is a proposed microreactor deployment, and the government
    has described the use case as resilient, uninterrupted power for national-security missions. It is still not a live customer
    reference. The public record does not show a completed reactor, signed electricity offtake price, recognized revenue,
    or a final site permit. The diligence distinction is therefore precise: ANPI proves procurement traction and installation
    pairing; it does not yet prove operating performance or repeatable base rollout economics.'
