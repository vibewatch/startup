- id: s604
  title: Durability, retention, and concentration remain private-evidence questions
  body: 'No reviewed public source discloses Antares revenue, customer count, retention, contract length, renewal structure,
    top-customer concentration, or the monetary value of the CEO-described committed orderbook beyond the AFRL contract. Washington
    Technology and other coverage report management claims of firm contracts to build reactors and a committed orderbook,
    but the counterparties, quantities, milestone payments, cancellation rights, and delivery dates are not public. The current
    customer story is therefore best read as a concentrated launch wedge: the U.S. government is a demanding, price-insensitive,
    strategically aligned first customer, and its programs can validate Antares faster than civilian markets. The same wedge
    creates single-buyer risk. If ANPI, Janus, AFRL space-power work, or nuclear executive orders slow or reverse, Antares
    has not yet shown civilian utilities, data centers, mines, or remote industrial sites that can absorb the plan. The remaining
    proof must come from executed deliveries.'
