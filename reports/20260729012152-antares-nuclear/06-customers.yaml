- id: TU006
  title: Customer concentration and durability risk table
  columns:
  - risk
  - public evidence
  - impact
  - mitigant
  - diligence path
  rows:
  - - Single-buyer concentration
    - Visible demand is overwhelmingly U.S. government / DoD / DOW
    - Budget or administration shifts can change demand
    - Multiple agencies and programs reduce but do not eliminate dependency
    - Request booked backlog by agency and appropriation source
  - - No revenue-generating deployments yet
    - ANPI and Janus are pre-operation; Mark-0 was not a power customer
    - Customer proof can be overstated before live power delivery
    - JBSA named site and AFRL contract improve credibility
    - Request recognized revenue and paid milestone history
  - - Orderbook opacity
    - CEO claims firm contracts and committed orderbook, but details are undisclosed
    - Valuation may rest on unverified demand
    - Government awards provide partial external validation
    - Request orderbook value, units, deposits, and cancellation rights
  - - Competition for same DoD dollars
    - Radiant, Westinghouse, BWXT/Pele and other suppliers pursue military microreactors
    - Antares may not capture first or largest deployments
    - Antares JBSA pairing is differentiated if executed
    - Track winner by first criticality, first electricity, first base operation
  - - Procurement-cycle and NEPA risk
    - Official sources describe siting and environmental review still ahead
    - Timelines can slip despite policy urgency
    - EO 14299 creates deadline pressure
    - Request schedule risk register and NEPA status
  - - Civilian customer gap
    - No public utility, data-center, mining, or remote-industrial buyer found
    - Commercial TAM remains prospective
    - Defense-first wedge can create reference assets
    - Request non-defense LOIs and NRC licensing customer path
  notes: Null revenue/retention metrics are omitted from cells and captured as evidence gaps because public sources do not
