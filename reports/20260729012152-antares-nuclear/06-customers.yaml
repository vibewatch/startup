  rows:
  - - Department of the Air Force
    - ANPI
    - Mission customer and installation sponsor; contractor owns/operates reactor
    - Antares paired with JBSA; Radiant and Westinghouse paired with other bases
    - Strongest named deployment lane, still pre-operation
  - - Defense Innovation Unit
    - ANPI OT pathway
    - Procurement accelerator and transition partner
    - Eight suppliers deemed eligible in 2025; narrowed deployment pairings in 2026
    - Creates faster OT channel but not guaranteed fleet adoption
  - - Joint Base San Antonio
    - ANPI site
    - Host installation and power user
    - JBSA public page describes Antares as selected technology partner
    - Named site raises proof quality and local scrutiny
  - - U.S. Air Force Research Laboratory
    - NEPADSO
    - R&D contracting customer for spacecraft nuclear electric propulsion
    - USAspending/federal contract records show $4.2M award
    - Small contract, strategic space-power beachhead
  - - U.S. Army / Department of War
    - Project Janus / EO 14299
    - Executive agent and base-energy market maker
    - Army announced Janus for next-generation nuclear energy at bases
    - Policy-backed demand with political and budget risk
  - - U.S. Space Force
    - ANPI / space-power stakeholder
    - Base user at Buckley and space mission stakeholder
    - Space Force published ANPI updates; ExLabs coverage references Space Force contracts
    - Supports space segment but Antares base pairing is JBSA, not Buckley
  - - NASA
    - Space nuclear context
    - Potential science / exploration stakeholder, not a disclosed Antares buyer
    - Media describes NASA in customer network; NASA public nuclear propulsion programs show category demand
    - Treat as ecosystem signal until direct Antares award appears
  notes: Segments distinguish named government hosts and channels from broader ecosystem stakeholders; NASA is not treated
    as a disclosed revenue customer.
