chapter:
  number: 3
  title: Competitors
  summary: Antares competes most directly with Radiant and Westinghouse in defense microreactors, while DOE pilot
    peers and larger SMR platforms pressure its timeline, credibility, and fuel access. The company has a real defense-first
    wedge, but better-capitalized incumbents, zero-power-only proof, and HALEU/BWXT dependence keep the moat unproven.
sections:
- id: landscape-overview
  title: Competitive landscape overview
  body: 'Antares competes in a layered advanced-nuclear market, not a simple list of identical R1 clones. The tightest
    direct rivals are Radiant and Westinghouse because the Air Force/DIU ANPI process selected that trio for potential
    defense-installation microreactors by 2030 or sooner. A second layer is DOE Reactor Pilot Program peers such
    as Aalo and Valar, whose criticality milestones create timeline pressure even when their public product detail
    is thinner. A third layer includes Oklo, NuScale, X-energy, Last Energy, Kairos, TerraPower, Standard Nuclear,
    and BWXT/Project Pele: some are larger SMRs or fuel/supply-chain players, but they compete for customer trust,
    fuel access, regulatory attention, and nuclear talent. Antares’ positioning is therefore defense-first and speed-first.
    The risk is that buyers can choose larger incumbents, public-market comparables, or status quo resilience solutions
    if Antares fails to convert zero-power criticality into electricity and deployable units.'
