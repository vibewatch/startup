  evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: Competitor profile table
    missingEvidence: The table covers representative direct and adjacent competitors but cannot be exhaustive because
      emerging DOE pilot participants and stealth fuel-cycle entrants change quickly.
    whyItMatters: A new entrant with DOD sponsorship or HALEU control could alter the competitive set before deployment.
    diligencePath: Refresh DOE pilot rosters, DOD OTA awards, and competitor financing releases before investment
      committee.
    relatedQuestionRefs:
    - QP001
    - QP002
    - QP003
    - QP026
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: blocking
    topic: Pricing and contract terms
    missingEvidence: No retained public source discloses comparable turnkey prices, O&M scope, fuel-service terms,
      gross margins, or discounting for Antares and direct rivals.
    whyItMatters: Without contract economics, competitive advantage cannot be translated into margin or win-rate
      confidence.
    diligencePath: Request Antares bids, ANPI pricing assumptions, fuel-service agreements, and win-loss analysis
      versus Radiant and Westinghouse.
    relatedQuestionRefs:
    - QP014
    - QP015
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: Aalo and Valar detailed specifications
    missingEvidence: Retained official pages and coverage do not provide enough normalized public detail on power
      rating, coolant, contract model, or funding for a full apples-to-apples comparison.
    whyItMatters: These peers reached criticality milestones and could pressure Antares timelines even if product
      comparability is unclear.
    diligencePath: Collect DOE pilot filings, safety-basis summaries, investor materials, and customer announcements
      from Aalo and Valar.
    relatedQuestionRefs:
    - QP007
    - QP010
    relatedTableRefs:
    - TP001
    - TP002
  - type: conflicting-data
    severity: material
    topic: Cost competitiveness versus defense willingness to pay
    missingEvidence: Adverse cost sources suggest SMR economics remain difficult, while defense programs may value
      resilience enough to tolerate higher prices.
    whyItMatters: The same reactor can look attractive for DOD resilience and unattractive for civilian merchant
      power.
    diligencePath: Separate defense-base economics from civilian data-center and grid-use cases in management diligence.
    relatedQuestionRefs:
    - QP020
    - QP022
    - QP024
    relatedTableRefs:
    - TP004
