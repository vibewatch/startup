- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Fast Mark-0 criticality proves execution speed
    - Milestone was zero-power and does not prove electricity generation
    - high
    - Verify Mark-1 integrated power-conversion test plan and schedule margin
  - - Defense-first wedge narrows the buyer and regulator problem
    - Government concentration and policy/budget reversal risk
    - high
    - Review ANPI/Project Janus contract terms, termination rights, and budget line visibility
  - - Sodium heat-pipe R1 packaging is differentiated
    - Westinghouse eVinci also claims heat-pipe simplicity with stronger brand
    - high
    - Benchmark thermal performance, maintainability, and safety case against eVinci
  - - TRISO/HALEU fuel strategy is credible
    - HALEU supply scarcity and BWXT/Urenco dependency
    - high
    - Audit fuel allocations, supplier contracts, enrichment timelines, and alternate suppliers
  - - Large Series C gives runway
    - X-energy, Westinghouse, BWXT, and public peers can outspend over long nuclear timelines
    - medium
    - Compare burn, milestone financing, and follow-on capital needs
  - - Factory production up to 10 units/year could create learning curve
    - Microreactor cost reductions may take a decade and no startup has proven scale manufacturing
    - high
    - Request production yield, BOM, and learning-curve evidence
  - - DOD sites create switching costs after selection
    - Portfolio buyers can multi-home across bases and reactor vendors
    - medium
    - Ask for exclusivity, expansion rights, and base-by-base pipeline
  - - BWXT fuel relationship validates supply chain
    - BWXT Project Pele also provides DOD a non-startup benchmark
    - medium
    - Map coopetition boundaries and IP/control over fuel specification
  notes: Risk severity is an analyst ordinal based on retained evidence, not a quantified probability of failure.
