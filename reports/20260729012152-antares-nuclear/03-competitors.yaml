- id: direct-peer-profiles
  title: Direct peer profiles and relative maturity
  body: 'Radiant is the closest startup product analog: Kaleidos is publicized as a roughly 1 MWe portable, helium-cooled,
    TRISO-fueled unit, and the company has DOME testing, HALEU allocation, and production-through-2030 messaging.
    Westinghouse is the incumbent analog: eVinci also uses heat-pipe and TRISO language, but it carries decades
    of Westinghouse credibility into the same ANPI lane. Aalo and Valar matter because DOE pilot criticality makes
    them hard to dismiss, particularly for investors benchmarking Antares’ 2026 Mark-0 milestone. Oklo, NuScale,
    X-energy, Last Energy, Kairos, TerraPower, and Standard Nuclear are less direct on size, but they stretch the
    comparison set toward public-company credibility, data-center power, industrial steam, and fuel-cycle control.
    Antares’ advantage is a precise defense wedge; its disadvantage is that several peers can tell a broader, better-capitalized,
    or more incumbent-trusted story.'
