            body: >-
              最强的公开买方证据首先来自防务。Department of the Air Force 在 ANPI 中同时选择 Antares、Radiant 和 Westinghouse；Army 的 Janus
              项目明确采用 DIU
              式里程碑合同，把商用微反应堆交付给作战人员。在这个分层中，买方和付款方是联邦项目办公室或设施能源主管部门，用户则是需要韧性供电的基地或任务运营方。远程工业用户和数据中心是合理邻近市场，但公开证据没那么直接：它们可能是用户，所有权和采购则由公用事业、项目开发商或超大规模云厂商决定。空间是战略邻近方向，而不是公开证据中已估算的市场。采用路径大概率从授权和测试临界，走向场址选择、安全论证、燃料分配、试点运行，再进入可重复的机组采购。
