      - number: '7.4'
        title: 监管、安全、责任和废料风险仍因路径不同而分化
        blocks:
          - type: paragraph
            body: >-
              Antares 的近期路径受益于 DOE 和军方授权渠道，但投资人不应把 DOE 和军方渠道误认为民用核许可已经跑通。NRC 将 Antares 列入预申请沟通，Part 53
              也给先进反应堆提供了技术中性的框架，但商业部署仍要满足安全、安保、环境、应急规划和运营要求。 责任和公众赔付也需要在 Price-Anderson 式结构下明确承保。安全风险不止事故概率：HALEU
              带来保障监督和防扩散尽调， 分布式微反应堆带来安保和选址问题，乏燃料或废料处置在 Antares 的公开证据里没有闭环。缓释因素在于核电已有成熟监管机构
              和责任框架，而不是上述问题会消失。剩余风险仍然重大，因为首个部署路径可能绕开 NRC，但更大的市场大概率绕不开。
