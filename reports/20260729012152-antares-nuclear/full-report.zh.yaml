      - - 航天与国防航天器
        - NASA、Space Force、AFRL、主承包商
        - 航天器或任务载荷项目
        - 联邦航天研发和任务预算
        - 研发合同、资质验证、飞行或地面示范
        - 任务工程 / 国防研发
        - 战略任务所需的高密度电源
      - - 工业与偏远矿业
        - 矿山、工业业主或开发商
        - 偏远工业运营
        - 项目资本开支或能源服务合同
        - 可行性、购电 / 承购、许可、燃料物流
        - 场址能源或基础设施团队
        - 偏远燃料成本和脱碳
