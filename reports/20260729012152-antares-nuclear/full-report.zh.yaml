              公开来源支持多种估算视角，但不能给出干净的 Antares 特定 SAM 或 SOM。广义市场报告把当前全球 SMR 收入池放在个位数十亿美元，Precedence 预测 2026 年为 USD 8.16
              billion、2035 年达到 USD 17.37 billion，Grand View 则给出更低的 USD 7.69 billion 2030 年估算。Wood Mackenzie
              增加了项目管线视角：已宣布 SMR 装机 47 GW，配套投资约 USD 360 billion，数据中心正在扩大这条管线。上述数字是 TAM 指标，不是 Antares 可直接触达的收入。可服务市场更窄：DOD
              设施、DOE 授权示范、远程微电网，以及后续重视韧性清洁稳定电力的数据中心。可获得市场仍未披露，因为公开来源没有揭示 Antares 的已定价积压订单、单位经济性或赢单份额。
