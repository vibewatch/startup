            body: >-
              Antares 不披露收入、毛利、订单积压价值、生产成本、ASP 或已签订单经济性，估值就必须写成有条件的区间，而不是一个点估计。 牛市情景要求 Antares 赢得 ANPI，或从中获得实质收益；2027 年在
