  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Antares 竞争的是分层的先进核能市场，不是一张简单的 R1 克隆清单。最贴身的直接对手是 Radiant 和 Westinghouse，因为 Air Force/DIU 的 ANPI
              流程选择了这三家公司，作为 2030 年或更早在防务设施部署微反应堆的候选。第二层是 Aalo 和 Valar 等 DOE Reactor Pilot Program
              同行；即便公开产品细节更薄，它们的临界里程碑也会制造时间线压力。第三层包括 Oklo、NuScale、X-energy、Last Energy、Kairos、TerraPower、Standard Nuclear
              和 BWXT/Project Pele：有些是更大的 SMR 或燃料 / 供应链玩家，但它们同样争夺客户信任、燃料获取、监管注意力和核能人才。因此，Antares 的定位是防务优先、速度优先。风险在于，如果
              Antares 不能把零功率临界转化为发电和可部署机组，买方可以转向更大的老牌厂商、公开市场可比公司，或维持现状的韧性方案。
