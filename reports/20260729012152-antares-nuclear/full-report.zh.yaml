            body: >-
              一旦某个具体场址已经启动环境审查、安全规划、燃料物流、应急规划、微电网集成和操作员培训，切换成本大概率很高。但组合层面的锁定更弱：Department of
              Defense、数据中心买方和工业客户可以在不同基地、园区或设施多点下注。一个买方可以在一个场址测试 Antares，在另一个场址测试 Radiant 或 Westinghouse，再把更大的 SMR
              用于数据中心集群。因此，分发能力与反应堆物理同样重要。Westinghouse 有老牌厂商 信任；X-energy 和 NuScale 有更宽的工业或公用事业叙事；BWXT
              给政府提供了防务核供应商基准。燃料既是护城河，也是脆弱点。Antares 受益于 BWXT 制造能力和 TRISO/HALEU 可信度，但 HALEU 可得性是共同瓶颈，伙伴依赖也限制了 Antares
