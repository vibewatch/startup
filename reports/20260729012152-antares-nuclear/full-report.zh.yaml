              功能对比说明，Antares 不能只按功率输出打分。R1 处于 100 kWe 至 1 MWe 区间，低于 Last Energy 的 20 MWe、NuScale 模块规模和 X-energy 的 80 MWe
              Xe-100。它的被动钠热管架构更接近 Westinghouse 的热管叙事，而不是 Radiant 或 X-energy 的氦气、Kairos 的熔盐、TerraPower 的钠快堆储能，或 NuScale
              的轻水。这形成了清晰的封装论点，但经济性并不透明。公开页面和报道披露功率范围、燃料、冷却剂和里程碑；没有披露可比交钥匙价格、燃料服务条款、O&M 范围、折扣，或已实现基地 /
