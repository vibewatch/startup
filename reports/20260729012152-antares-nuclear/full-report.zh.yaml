      - number: '8.2'
        title: 这笔 $1.3B 标记估值真正承销的是什么
        blocks:
          - type: paragraph
            body: >-
              当前估值买的不是传统财务表现，而是里程碑稀缺性。公开来源显示 Antares 还没有收入，所以 DCF 或收入倍数只会制造虚假精确。 更可辩护的方法，是围绕技术里程碑、客户授权和资本强度做情景框架。正向桥梁从
              Mark-0 临界结果开始，接上 2027 年计划中的 Mark-1 发电反应堆，再依赖 2028 年初始国防部署。估值里也包含太空核电推进，以及最终数据中心或商业微电网需求的期权，
              尽管近期切口是价格敏感度更低的美国军方。负向桥梁同样重要：$100 million 债务已经进入 Series C 结构，HALEU 供应仍是闸门， Lazard 和批评 SMR 的来源也警告，SMR
              相比多数新增电力替代方案还不具备成本竞争力。
