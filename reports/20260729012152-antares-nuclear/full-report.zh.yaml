      - number: '2.4'
        title: 增长驱动、政策顺风和瓶颈
        blocks:
          - type: paragraph
            body: >-
              对一家年轻核能公司来说，驱动因素栈异常强。AI 数据中心用电需求、电气化、电网脆弱性、军事能源韧性和脱碳，都抬高了稳定清洁电力的价值。IEA、McKinsey、S&P Global 和 Wood
              Mackenzie 展示了需求冲击；EO 14301、EO 14299、DOE Reactor Pilot Program、ANPI 和 Project Janus
              则为示范建立了政府背书路径。约束同样实质。HALEU 是许多先进反应堆设计的行业级瓶颈；Antares 一旦走出 DOE 或 DOD 路径，NRC 准备度就很重要；Lazard 给出的 SMR
              成本背景相对许多替代方案偏高；承诺中的工厂学习曲线依赖连续制造，而美国初创公司尚未证明这一点。上述因素让防务市场有吸引力，因为韧性可以压过商品能源成本。
