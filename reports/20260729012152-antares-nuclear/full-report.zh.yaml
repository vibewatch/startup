  - id: TO003
    title: 利益方或投资人地图
    columns:
      - 利益方
      - 角色
      - 控制权或经济重要性
      - 尽调问题
    rows:
      - - Jordan Bramble / 管理层
        - 创始人主导的管理层
        - 围绕 CEO 和执行叙事的关键人物集中度。
        - 确认创始人持股、雇佣条款、继任计划和董事会权限。
      - - Paradigm
        - Series C 联合领投方
        - 锚定 Series C 的 $370M 股权部分。
        - 确认董事席位、持股比例；若存在 crypto/AI 战略理由，也需确认。
      - - Caffeinated Capital
        - Series C 联合领投方
        - 公开融资报道点名的复投硬科技投资人。
        - 确认 pro-rata 权利和治理保护。
      - - Point72 Ventures
        - Series C 参与方
        - 增加成长轮和跨界资本背书。
        - 确认储备能力和信息权。
      - - Shine Capital
        - Series B 领投 / Series C 参与方
        - 公开报道显示其领投 $71M 股权 Series B，并在 Series C 回归。
        - 确认剩余持股、董事会角色和债股附带条款。
      - - Industrious Ventures
        - 投资人 / Series C 参与方
        - 行业投资人公开发布了投资论点。
        - 厘清商业引荐和任何战略权利。
      - - AFRL / 美国政府
        - 合同客户 / 赞助方
        - USAspending 记录 $4.2M 核电推进合同。
        - 审阅工作说明书、付款时间表和 IP 权利。
      - - DAF / DIU / JBSA
        - 项目赞助方和部署路径
        - ANPI 入选可能成为首条军事基地反应堆路径。
        - 核验入选状态、环境审查、许可路径和筛选机制。
      - - Urenco / HALEU 供应链
        - 燃料供应伙伴
        - 长期 HALEU 协议缓解瓶颈，但依赖未来产能。
        - 审阅合同量、时间、应急权利和替代供应。
    notes: 本表不是 cap table；公开来源点名了具名利益方，但没有给出持股比例或清算优先权。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the public investors, government stakeholders, and fuel-supply parties most relevant to company
        overview diligence.
    claimRefs:
      - CO010
      - CO024
      - CO026
      - CO027
      - CO028
      - CO035
      - CO036
      - CO044
      - CO046
      - CO047
      - CO051
