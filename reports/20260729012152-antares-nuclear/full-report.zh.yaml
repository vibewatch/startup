        title: 建议：标记估值偏高，里程碑可信，但公开证据下仍不宜买入
        blocks:
          - type: paragraph
            body: >-
              Antares 更适合作为可跟踪但高风险的估值故事，而不是按最新标记估值直接买入。公开记录支撑了几项核心输入： 2026 年 7 月 27 日宣布的 $470 million Series C，其中 $370
              million 为股权、$100 million 为债务， 投后估值约 $1.3 billion，累计融资 $604 million。由此估算，估值 / 累计融资约 2.1x；放在稀缺的国防核能平台上不算极端，
              但公司未披露收入、没有公开单位经济性，且只有零功率临界而非发电，这个价格仍偏贵。因此建议必须看价格： 若二级市场入场价明显低于 Series C，可能值得研究；接近一级发行价的入场，则应等到 Mark-1
              发电、ANPI 获胜项目经济性， 以及债务 / 优先权披露后再说。
