        blocks:
          - type: paragraph
            body: >-
              财务结论是：资本获取积极，运营证明仍弱。Antares 已筹到足够私募资本来推进一条快速核硬件路径，政府合同轨迹也提供了许多先进反应堆初创公司缺少的验证。同样的证据也抬高了尽调负担：$604 million
              资本基础、$1.3 billion
              投后估值和已披露债务，都要求公司拿出把防务需求转成正毛利机组的真实计划。公开来源没有提供已确认收入、ARR、现金、现金消耗、现金续航、债务条款、定价、毛利率或收入确认政策。因此，公司可以被承销为一家资金充足、具战略意义、尚无收入的核制造商，而不是一家已证明经济性的企业。下一份尽调材料应要求最新资产负债表、月度现金消耗、债务明细、按交易对手拆分的订单簿、单位
              ASP、资本开支预算、制造良率、质保准备金和项目级毛利桥。决定性问题不是公司缺少需求信号，而是每个主要公开美元数字都描述融资或奖项，而不是运营表现。上述不对称让管理层私下材料成为定价一级或二级投资前的必要条件。
