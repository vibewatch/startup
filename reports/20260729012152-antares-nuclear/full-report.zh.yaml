      - number: '7.3'
        title: 战略紧迫性掩盖了商业与客户风险
        blocks:
          - type: paragraph
            body: >-
              客户叙事最有力的部分，恰恰落在价格敏感度最低的场景：美国军事基地、战略韧性、太空以及政府背书的试点项目。 这是微反应堆创业公司的合理切口，但也是集中度风险。ANPI 并不是 Antares
              单独拿到的奖项；公开的美国空军材料和 POWER 报道把 Radiant、Westinghouse 放在同一条竞争路径上。DIU 资格和 Project Janus 同样打开的是渠道和选项，
              而不是已披露价格、毛利、取消条款或部署经济性的订单积压。独立市场证据又压上一层：Lazard 的 2026 年 SMR 成本估算 和 IEEFA 对 SMR
              的负面研究意味着，除非可靠性、交付成本、融资和监管执行大幅改善，民用客户未必会很快采用。 风险因此不是没有需求，而是 Antares 证明可重复交付电力之前，需求组合可能很窄、很政治化，服务成本也很高。
