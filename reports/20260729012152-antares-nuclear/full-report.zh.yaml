  - id: FV004
    title: 投资 KPI 评分
    type: kpi
    layout: standard
    summary: Antares 在里程碑稀缺性和国防需求上得分最高，在经济性可见度和流动性上最低。
    data:
      items:
        - label: 里程碑稀缺性
          score: 8.5
          detail: 私营先进反应堆达到零功率临界很少见。
        - label: 国防需求验证
          score: 8
          detail: ANPI 和国防合同支撑近期客户拉动。
        - label: 资本获取能力
          score: 8
          detail: 已融资 $604M，其中包括大额 Series C 轮。
        - label: 可比标的稀缺性
          score: 7
          detail: 公开核能可比标的市值达到数十亿美元。
        - label: 经济性可见度
          score: 2
          detail: 收入、利润率、ASP 或订单簿价值均未披露。
        - label: 燃料 / 监管风险
          score: 4
          detail: HALEU 和监管许可仍是重要关口。
        - label: 估值纪律
          score: 4
          detail: 发电前估值 $1.3B 偏高。
        - label: 流动性 / 条款清晰度
          score: 3
          detail: 二级转让可得性和清算优先权结构需要私下尽调。
    approximationNotes: 评分为 0-10 序数值，是投委会基于留存证据给出的判断。
