    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围和布局
        blocks:
          - type: paragraph
            body: >-
              Antares Nuclear 更像一家年轻的私营先进核能微反应堆公司，而不是传统公用事业或软件公司。保留下来的公开记录支持其法定名称 Antares Nuclear, Inc.、Antares 品牌、加州
              Torrance 总部以及 2023 年成立时间。公司一句话产品是面向远程、军事、空间和水下场景战略能源需求的工厂化裂变微反应堆。公开报道把 R1 平台描述为可运输、处于 100 kWe 至 1 MWe
              级别、无需换料即可多年运行，并用于电网接入不可得或战略上脆弱的地点。最强的布局证据是 Torrance 的 Antares Prime，以及第三方对 Idaho Falls 和 Aiken
              办公室的提及。传统封面指标更薄：收入、客户数和确切员工数仍未披露，本报告将其视为 null，而不是从招聘页面或媒体形容词中估算。
