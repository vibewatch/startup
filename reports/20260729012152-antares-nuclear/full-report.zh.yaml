        - 财务负责人
        - 官方领导层名单。
        - Series C 之后掌控硬科技资本规划。
        - 中
      - - Christian Kalin
        - 运营负责人
        - 官方领导层名单。
        - 支撑设施、供应链和执行节奏的规模化。
        - 中
