            body: >-
              可比组不支持简单结论。Antares 的 $1.3 billion 标记估值远低于 Oklo 约 $6.89 billion 市值、NuScale 约 $3.0 billion
              等公开核能股，但上述公司给公开市场投资人提供流动性，也披露了不同的信息包。该估值也高于最显眼的私营微反应堆融资锚点： Radiant 报告在 $100 million Series C 后累计风险融资 $160
              million，Aalo 称已融资超过 $300 million。Valar 据报 $2 billion 估值，以及围绕 $6 billion 估值的讨论，显示 AI 牵动的核能叙事膨胀得多快。X-energy
              的 $1 billion IPO 募资、 TerraPower 获政府支持的 Natrium 项目、Kairos、Last Energy 和 Standard Nuclear，都指向同一点：市场热情真实存在，
              但公开可比性很弱，里程碑时间比同业中位数更重要。
