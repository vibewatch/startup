  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 首要风险：Antares 真实存在，但尚未完成发电验证
        blocks:
          - type: paragraph
            body: >-
              Antares 已跨过一个有意义的核物理里程碑，但核心风险在于，投资人、客户或政策制定者把零功率临界事件当成商业发电已经去风险。证据不支持如此跳跃。Mark-0 在 DOE 授权下于 INL
              达到临界，但保留下来的记录仍是零功率反应堆实验，而不是满功率、能发电、能现场运行的产品。下一批里程碑要求集成热传输、换热、电力转换、控制、屏蔽、运营和场址程序作为一个系统跑通。因此，即便在 2026 年 6
              月公告之后，剩余技术风险仍然高。缓释不只是更多资本，而是独立见证的 Mark-1 满功率运行、已披露测试时长、异常工况表现、维护历史，以及一条把物理验证与可交付电力分开的证据链。在那之前，Mark-0
              应被认可为真实一步，也应被折价为狭窄一步。
