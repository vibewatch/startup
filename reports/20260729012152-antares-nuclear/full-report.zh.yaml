      - number: '5.4'
        title: 燃料供应、可制造性和技术依赖
        blocks:
          - type: paragraph
            body: >-
              燃料供应既是差异化，也是约束。近期故事可信，因为 BWXT 使用 DOE 分配的 HALEU 在 Lynchburg 制造了 TRISO 压实体，燃料基础借用了 Project Pele / Advanced
              Gas Reactor 传承，而不是全新的燃料形态。这帮助 Antares 把 Mark-0 聚焦在控制系统和反应堆物理上。长期故事没那么确定。政府持有材料可以衔接示范，但可重复的工厂产出需要可靠的 HALEU
              供应。Urenco 的 2026 年多年协议给 Antares 一条可信商业浓缩路径，但 Capenhurst Advanced Fuels Facility 约 2031 年的时间点，与 2028
              年部署野心并不匹配。制造又增加第二层依赖。Antares Prime、内部石墨加工、硬件在环数字孪生，以及 Torrance 每年最多生产 10 台的公开模型，都支持工厂密封论点，但公开来源尚未披露良率、QA
              逃逸率、单位成本或首件验收数据。
