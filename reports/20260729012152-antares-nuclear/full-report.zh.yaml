            body: >-
              下一份尽调包应聚焦 Series C 价格能否成为通向 IPO、战略出售，或国防背书项目融资平台的合理桥梁。公开可比公司说明，
              市场愿意为先进核能稀缺性出钱，但公开市场流动性也会在里程碑滑坡或成本不及预期时迅速重估。Antares 因此需要拿出干净的 Mark-1
              发电结果、客户特定部署经济性、具约束力的订单金额、股权结构和优先权条款、债务契约、HALEU 交付时间，以及可信的生产成本曲线。 最强退出路径可能是运行中的国防反应堆之后
              IPO，或从数据中心、航空航天、国防、核能在位者手中拿到战略融资。在此之前， 投资委员会应保留选择权，避免在流动性差的二级市场为一级轮热情买单，并把未披露收入、毛利、订单簿价值和优先权视为重大未解缺口。
