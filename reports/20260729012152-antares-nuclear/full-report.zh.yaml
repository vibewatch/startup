        - 累计融资 +$604M；估值 / 融资额约 2.1x
        - TechCrunch / PitchBook 分析和公司融资报道。
        - 说明投资人买的是技术验证，而非收入规模。
      - - 技术里程碑
        - 正向稀缺溢价
        - Mark-0 于 2026 年 6 月达到零功率临界。
        - 支撑其相对更早期实验室阶段同行的溢价。
      - - 国防订单储备
        - 正向但未量化
        - 公司称已有确定合同 / 主要客户，但合同金额未披露。
        - 支撑期权价值，但无法换算成收入倍数。
      - - 成本 / 燃料 / 债务压制
        - 负向调整
        - SMR 成本、HALEU 和 $100M 债务带来下行压力。
        - 按一级轮定价难以形成有吸引力的买入判断。
    notes: 该表是定性桥接，不是 DCF；每个估计信号都已标注，未解决输入被列为证据缺口。
    claimRefs:
      - CV001
      - CV002
