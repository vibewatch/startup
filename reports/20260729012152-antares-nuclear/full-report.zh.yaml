  - id: TV007
    title: 论点破裂与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - Mark-1 延迟
        - 2027 年没有 Mark-1 发电结果，或安全审批出现重大重置
        - 削弱从临界到部署的里程碑桥接。
        - 除非入场价格大幅重置，否则从跟踪转为回避。
      - - ANPI 出局或延迟
        - Antares 失去入围势头，或部署时间大幅推迟到 2028-2030 年之后
        - 削弱确定性市场叙事。
        - 在承保上行前，要求商业客户证据。
      - - HALEU 瓶颈
        - 燃料交付无法支撑首批部署或年产 10 台目标
        - 没有燃料，工厂模式无法放大。
        - 下调估值，并要求燃料交付证明。
      - - 成本证据不及预期
        - 单位经济性显示，除军事用途外，SMR 电力成本仍远高于替代方案
        - 将 TAM 收窄到价格不敏感的国防利基。
        - 将上行空间限制在国防利基价值内。
      - - 融资条款恶化
        - 出现新债务、参与型优先权或下轮融资保护
        - 即便运营推进，也会稀释普通股 / 二级投资人收益。
        - 除非有深度折价且清晰优先级作为补偿，否则回避。
    notes: 这些触发因素用于 IC 监控；它们把可观察事件映射到估值动作。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV014
      - CV015
      - CV017
      - CV018
      - CV020
      - CV039
      - CV044
  - id: TV008
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 股权结构与优先权
        - Series C 条款清单、清算顺位、期权池刷新、契约条款和债务优先级
        - 回报分配可能偏离名义投后估值。
        - 向公司律师或领投方索取融资文件。
      - - 收入与订单储备
        - 合同金额、取消权、交付计划和客户付款里程碑
        - 无法公开计算每份承诺订单对应的估值。
        - 在 NDA 下审阅已签客户协议。
      - - 单位经济性
        - 物料清单、HALEU 成本、工厂人工、保修准备金、安装成本和目标毛利率
        - 决定国防部署能否转化为可规模化的商业价值。
        - 审阅 Mark-1 / EDU 成本模型和供应商报价。
      - - 燃料与监管路径
        - HALEU 交付计划、DOE / DOD 授权里程碑、环境审查和 NRC 商业路径
        - 燃料和授权延迟可能摧毁基于时间窗口的价值。
        - 交叉核对 BWXT、Urenco、DOE、DOD 和 NRC 文件。
      - - 二级市场定价
        - Forge / 其他交易市场买卖报价、交易量、转让限制和 409A 标记
        - 缺乏流动性的二级标记可能不等于可执行入场价。
        - 索取交易市场意向价和公司转让审批历史。
    notes: 在从跟踪 / 继续研究转向买入前，这些要求构成最低证据包。
    claimRefs:
      - CV005
      - CV007
      - CV012
      - CV015
      - CV020
      - CV041
      - CV043
      - CV045
      - CV046
