  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和对照组
        blocks:
          - type: paragraph
            body: >-
              Antares 应按面向韧性、可运输、任务关键供电的先进核能微反应堆市场来估算，而不是按全部核电市场来估算。广义 SMR 品类可作为外层 TAM，因为它捕捉了投资人和政策对工厂建造核系统的偏好；但 Antares
              的 R1
              更小，定位于防务基地、远程或离网负荷、关键基础设施、数据中心邻近场景、空间以及需要无电网依赖安全基荷电力的工业用户。纳入支出应覆盖反应堆机组、场址集成、燃料、运营和服务，用来替代脆弱燃料物流或薄弱电网连接。排除支出应包括大型反应堆资本开支、普通电网发电，以及买方不需要核级韧性的可再生能源或储能项目。可替代方案包括柴油、燃气轮机、电网升级、常规核电增容、可再生能源加储能，以及非核长时储能。
