      - number: '2.5'
        title: 反向观点和尽调含义
        blocks:
          - type: paragraph
            body: >-
              怀疑论并不是说需求不存在，而是广义需求变现可能晚于风险投资叙事暗示。市场估算彼此冲突，数据中心可能要到 2030 年之后才大规模依赖 SMR，第一波 SMR 在 Lazard 框架下显得昂贵。GAO
              指向燃料和安全挑战；即便防务路径推进更快，NRC 准备度工作对民用市场仍然重要。Antares 的 Mark-0 临界是真实的市场信号，但它不能证明可重复的满功率部署、客户经济性，或年产最多 10
              台机组的能力。因此，投资人应先承销一个价格不敏感的防务切入点，把远程工业和数据中心需求当作期权价值；在把 TAM 转成收入之前，要求提供自下而上的管线、燃料分配、场址授权和客户支付意愿证据。
