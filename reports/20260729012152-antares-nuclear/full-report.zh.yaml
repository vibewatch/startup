            body: >-
              公开单位经济性文件仍主要是一场负空间练习。Antares 披露了产品架构、目标应用，以及每年最多制造 10
              台密封机组的野心，但没有披露资本开支、工装成本、良率、库存、供应商预付款、现场服务负担或已实现毛利率。因此，外部基准很重要。Lazard 的电力成本工作和 ANS
              微反应堆成本分析都强化同一条警示：首创型和早期工厂机组，在重复制造、成熟供应链和学习曲线效果到来之前，不太可能展现标准化生产承诺的成本收益。军事买方可能容忍较高早期成本，因为韧性和物流比商品电价更重要，但这种客户组合也把收入集中在联邦项目上。在
              Antares 披露 ASP、物料清单、质保假设、服务成本和项目融资敞口之前，诚实的公开模型应把收入、利润率、现金消耗和现金续航填为 null，而不是制造虚假精确度。
