    columns:
      - 人员
      - 职务
      - 背景
      - 创始人-市场匹配 / 职能覆盖
      - 关键人物依赖
    rows:
      - - Jordan Bramble
        - CEO 兼联合创始人
        - 系统工程、物理、统计；公司材料称曾任职 OMB。
        - 融资、政府叙事和执行节奏的核心公开面孔。
        - 高
      - - Rian Bahran
        - 首席核能官
        - 官方领导层名单。
        - 负责把核能可信度和安全论证讲清楚。
        - 高
      - - Mark Massie
        - 总工程师
        - 官方领导层名单。
        - 把反应堆架构接到可制造产品上。
        - 高
      - - Will Madsen
        - 任务工程负责人
        - 官方领导层名单。
        - 让微反应堆产品对齐军事和太空任务。
