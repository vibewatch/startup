companyProfile:
  summary: >-
    Antares Nuclear 是一家位于加州 Torrance 的先进核能公司，成立于 2023 年，目标是为美国防务和战略能源客户量产工厂密封、采用 TRISO 燃料的微反应堆。2026 年 6 月，它的 Mark-0
    示范反应堆在 DOE Reactor Pilot Program 下于 Idaho National Laboratory 达到零功率临界；2026 年 7 月，公司以约 $1.3 billion 投后估值完成 $470
    million Series C。公司尚无收入，订单簿由政府需求锚定，路线图激进：2027 年发电，2028 年军事部署。
  foundedDate: '2023-01-01'
  founders:
    - name: Jordan Bramble
      role: CEO 兼联合创始人
      background: 具备系统工程和物理背景（George Mason 与 Georgetown）；曾在 White House Office of Management and Budget 工作；是战略、融资和政府关系的核心人物。
      claimRefs:
        - CO010
        - CO037
    - name: Julia DeWahl
      role: 联合创始人（据称；当前官方领导团队页面未列出）
      background: 第三方资料将其标识为 Antares 联合创始人或总裁，但截至 2026 年，官方领导团队页面未列出她；其状态作为未解决缺口处理。
      claimRefs:
        - CO023
  foundingLocation: Torrance, California, USA
  headquarters: Torrance, California, USA
  productSummary: 工厂建造的裂变微反应堆（R1），采用 TRISO 涂层颗粒燃料、棱柱石墨堆芯、被动钠热管和闭式氮气 Brayton 发电循环，输出 100 kWe 至 1 MWe，可在无需换料的情况下运行六年以上，并随一体化屏蔽与运输托架交付。
  customerFocus: >-
    面向美国军事和政府客户（空军、Space Force、Army / Department of War、Defense Innovation Unit、NASA），用于基地能源韧性和离网供电，未来延伸至空间推进以及商业 /
    远程场景。
  businessModel: 销售工厂密封微反应堆这类资本设备，并叠加长期燃料和服务合同；目前由政府合同、SBIR/OT 奖项和防务项目入选来锚定。
  stage: Series C
