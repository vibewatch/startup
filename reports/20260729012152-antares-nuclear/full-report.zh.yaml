  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层以防务为先，美国政府同时扮演买方、监管方、托管方和造市者
        blocks:
          - type: paragraph
            body: >-
              Antares 可见客户基础不是一张宽商业客户名单，而是一个政府任务网络。最强公开分层是 Department of the Air Force 设施供电；在这一分层中，Air Force 和 DIU 通过
              ANPI 将 Antares 与 Joint Base San Antonio 配对，同时 Radiant 和 Westinghouse 分别与 Colorado 和 Montana
              基地配对。第二个分层是空间和航天器电力，由 AFRL $4.2 million NEPADSO R&D 合同，以及公司 / 媒体对 Air Force、Space Force、NASA 和 DIU
              关系的描述锚定。第三个分层是 Army/DOW 通过 Project Janus 和 EO 14299
              推动的本土基地能源韧性，政策组合为陆军监管反应堆创造了买方环境。防务分层有吸引力，因为防务客户看重可靠电力多过商品电价；但它也意味着买方、托管方、监管方和政治赞助方高度重叠。客户尽调因此很关键，因为每个可见里程碑都必须映射到不同证明层级：合格供应商、入选场址伙伴、R&D
              获奖方、运营供应商和重复客户不能互换。拆开这些阶段，才能避免把政策背书管线误认为已部署收入。
