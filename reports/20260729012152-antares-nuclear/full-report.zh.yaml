      - number: '7.2'
        title: 燃料和供应链风险可能卡住本来成功的工程
        blocks:
          - type: paragraph
            body: >-
              燃料故事既是优势，也是瓶颈。Antares 受益于具体燃料伙伴：BWXT 为 Mark-0 制造了 TRISO 燃料，Urenco 宣布先进燃料供应协议，DOE 来源解释了 HALEU
              对先进反应堆为何重要。但同一批证据也指向依赖风险。HALEU 是 5% 至 20% U-235
              的专用材料，美国商业规模供应仍是行业约束；微反应堆部署还依赖运输、安全、保障监督和合格制造。因此，近期燃料链不是普通采购职能，而是关键路径。HALEU 可得性、TRISO
              压实体、质量文件或进出口许可一旦延迟，即便反应堆设计成立，也可能拖慢 Mark-1 和部署里程碑。具名交易对手和政府优先级提供了缓释，但剩余风险仍为中高，因为来源多元性、库存缓冲和长期商业条款在公开层面不可见。
