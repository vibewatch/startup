  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: R1 产品定义和客户工作流
        blocks:
          - type: paragraph
            body: >-
              Antares 卖的不是传统电网发电机，也不是只授权的反应堆概念；公开 R1
              叙事是一台工厂制造、可运输的微反应堆，在燃料物流、电网依赖和停电暴露构成任务问题的地方提供战略电力。客户工作流在防务设施和空间邻近任务中最清晰：把屏蔽密封机组运到托管场址，现场无需换料运行六年以上，通过电力管理节点调节电力，再接入本地设施微电网。公开来源把产品包络放在
              100 kWe 至 1 MWe，相比公用事业 SMR 很小，但与韧性基地负荷、远程场址和关键设施匹配。尽调警示在于，这仍是产品定义，而不是经过现场验证的服务模型：JBSA
              和其他防务路径提供具名部署渠道，但公开来源尚未披露设施单线图、正常运行时间保证、运营人员配置或全生命周期支持经济性。
