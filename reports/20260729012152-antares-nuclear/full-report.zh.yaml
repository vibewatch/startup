      - number: '7.5'
        title: 财务和组织风险会放大执行难度
        blocks:
          - type: paragraph
            body: >-
              2026 年 7 月 Series C 大幅提高了 Antares 到达下一里程碑的概率，但没有消除硬件公司的融资风险。公司仍为私营，
              收入和定价未披露，烧钱速度和现金续航期不公开，已披露的债务组成还需要关注契约、还款节奏和未来稀释。组织上，
              公司年轻、推进很快，并依赖一支领导和技术团队，把核能、航空航天、国防采购、制造和监管学科拧在一起。官方领导层页面 确认 Jordan Bramble 担任 CEO，但没有核验二手来源里流传的所有创始人 /
              领导层说法，包括 Julia DeWahl 的现任状态。 实际尽调含义很直接：把 Mark-1 发电、HALEU 交付、ANPI 筛选、NRC 沟通和现金续航期作为联动风险跟踪。
