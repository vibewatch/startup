      - 明确假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - Antares 拿下重要 ANPI 路径，2027 年实现发电，2028 年部署，产能爬向每年 10 台，并从国防延伸到数据中心或太空。
        - 估算 / 推断可走向数十亿美元级结果；如果后续公开可比公司奖励运营稀缺性，$1.3B 入场价仍可成立。
        - 执行、HALEU、安全授权、工厂良率和客户集中。
        - 估计概率 25%；里程碑势头支撑该判断，但剩余关口很多。
      - - 基准
        - 国防细分市场逐步发展；Mark-1 跑通，但部署延误或小批量落地，且持续需要资本。
        - 若稀释受控，估算 / 推断公允价值区间约为 $1.3B 至 $2.5B。
        - 收入转化较慢、结构化资本、商业 TAM 证明有限。
        - 估计概率 45%；最符合当前公开证据。
      - - 悲观
        - ANPI 势头走弱，Mark-1 延误，HALEU 或成本问题开始反噬，或核能创业融资热潮退去后估值重置。
        - 估算 / 推断降价轮区间为 $0.4B 至 $0.8B；现有投资者可能被稀释，或依靠优先权保护。
        - 流动性差、债务优先级、无收入基线，以及板块倍数压缩。
        - 估计概率 30%，因为零功率临界不等于商业化。
    notes: 情景区间和概率是作者估计，不是公司指引；列出这些情景，是因为 DCF 和收入倍数目前还没有意义。
