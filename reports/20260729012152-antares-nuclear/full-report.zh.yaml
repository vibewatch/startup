      - number: '5.2'
        title: 架构、被动安全和电力转换
        blocks:
          - type: paragraph
            body: >-
              对一家年轻私营反应堆公司来说，公开架构异常具体。Antares 列出七个可见 R1 子系统：一体化屏蔽与运输托架、反应性控制、堆芯、钠热管、主换热器、氮气 Brayton
              循环，以及电力管理与分配。堆芯在棱柱石墨中使用 HALEU TRISO 颗粒，并由石墨和碳化硼控制鼓提供反应性控制。热量通过被动钠热管离开堆芯，再经翅片管主换热器进入低于 300 psi 运行的回热闭式氮气
              Brayton 循环。该架构解释了公司的可制造性主张：它避开泵送一次冷却剂回路，把电站框定为紧凑、密封、低维护系统。风险恰恰位于差异化所在。Mark-0
              验证了零功率反应堆物理，但没有包含排热或电力转换；热管、换热器、Brayton 和控制耦合行为仍是 Mark-1 与 EDU 资格验证负担。
