        title: 开发路线图和成熟度评估
        blocks:
          - type: paragraph
            body: >-
              成熟度故事更适合解读为快速、分阶段消除风险，而不是商业就绪。Antares 报告了 2025 年的 CDR、NSDA、PDSA 提交、Antares Prime、首次 EDU 测试、HALEU
              分配和燃料制造。2026 年 6 月 4 日 Mark-0 临界是真实技术里程碑，因为它在 DOE 授权下于 INL 演练了反应堆物理和反应性控制行为。不过，INL Director John Wagner
              的区分对尽调很关键：零功率临界不是发电，不是满功率运行，也不是热性能证据。因此，Antares 自己的路线图把 Mark-1 设为决定性下一里程碑。2027 年 Mark-1
              计划必须证明堆芯反馈耦合、排热、Brayton 转换、控制和持续发电。在那之前，务实的 TRL 读数是混合的：反应堆物理证明领先于多数初创同行，但产品级性能、可靠性、可维护性和调度数据仍处于商业化前。
