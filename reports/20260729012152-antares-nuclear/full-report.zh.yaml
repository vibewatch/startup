              保留下来的证据支持 Antares 拥有可信切入点，但护城河尚未定型。优势真实存在：防务优先的产品定义、快速的 Mark-0 临界里程碑、大额私募融资，以及与 DOD/DOE
              路径对齐。脆弱点同样实质。Mark-0 只是零功率；Antares 是一家 2023 年成立的年轻公司；HALEU/TRISO 供应依赖外部交易对手；第一次发电步骤还在前方。反向成本证据也重要：SMR
              和微反应堆仍面对不确定的成本曲线，制造收益可能要多年才能证明。资本更厚的老牌厂商或公开可比公司更容易熬过延误。2026 年的正确结论是，Antares 已在防务微反应堆中拿到一线位置，但竞争耐久性取决于
              Mark-1 发电、燃料保障、基地部署转化，以及在面向数据中心的更大平台吸走资本和注意力之前，市场是否会奖励 sub-MWe 防务系统。
