              Antares 近期监管技术路径不同于普通民用 NRC 商业化。Mark-0 在 DOE Reactor Pilot Program 下通过 DOE 授权推进，使用 NSDA 和 PDSA 等安全基准材料，并围绕
              INL 活动取得类别排除。ANPI 和 Joint Base San Antonio 创造出一条单独的军事设施路径，预计涉及选址、许可、建设、运营、退役、环境审查和军事监管批准。NRC
              预申请材料对后续非防务商业化仍然重要，但公司最早的证明点由 DOE 和防务主导。尽调上，信任证据因此不均衡。公开来源支持反应堆物理验证、燃料链进展和具名客户路径。它们尚未支持满功率可靠性、已完成热管和
              Brayton 资格验证、民用许可准备度，或可重复的密封机组生产。反向解读不是 R1 不可信，而是 Antares 把数个首创型风险压进了 2027–2028 年窗口。
