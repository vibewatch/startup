  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 重要性
    rows:
      - - 国防设施
        - 微反应堆机组、场址工程、燃料、运营、安保和微电网集成
        - 没有反应堆部署的普通基地能效升级
        - DOD、空军、陆军、DIU 关联项目办公室
        - 近期核心切口
      - - 远程 / 离网关键基础设施
        - 面向偏远社区、灾害响应、港口或战略场址的可运输清洁稳定电力
        - 并网便宜且可靠的普通电网供电
        - 联邦、州、公共事业或场址业主预算
        - 相邻 / 韧性驱动
      - - AI 数据中心
        - 未来专用稳定低碳发电，以及可能的用户侧 SMR 供应
        - 与核部署无关的常规 PPA 或电网升级
        - 超大规模云厂商、公用事业公司、开发商、托管数据中心运营商
        - TAM 大，但时点更晚
      - - 航天与国防航天器
        - 核电推进，或高密度电源研发与专用任务系统
        - 没有航天用途的地面基荷项目
        - NASA、Space Force、AFRL、国防主承包商
        - 战略期权价值
      - - 工业供热与偏远矿业
        - 燃料物流成本高的离网电力或热能
        - 已有更便宜替代品的并网商品电力
        - 矿山、工业业主或项目开发商
        - 有潜力，但证据较少
    notes: 市场边界受证据约束，仅覆盖韧性、物流或清洁稳定电力足以支撑微反应堆成本的用例。
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM020
      - CM034
      - CM035
      - CM037
