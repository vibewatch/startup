              Radiant 是最接近的初创产品类比：Kaleidos 对外宣传为约 1 MWe 的可移动、氦冷、TRISO 燃料机组，公司还拥有 DOME 测试、HALEU 分配和生产覆盖至 2030
              年的信息。Westinghouse 是老牌厂商类比：eVinci 同样使用热管和 TRISO 叙事，但带着 Westinghouse 数十年可信度进入同一条 ANPI 赛道。Aalo 和 Valar 重要，是因为
              DOE 试点临界让它们难以被忽视，尤其是投资人在对标 Antares 的 2026 年 Mark-0 里程碑时。Oklo、NuScale、X-energy、Last
              Energy、Kairos、TerraPower 和 Standard Nuclear 在尺寸上没有那么直接，但它们把对照组拉向公开公司可信度、数据中心电力、工业蒸汽和燃料循环控制。Antares
              的优势是防务切入点清晰；劣势是若干同行能讲出更宽、更有资本支撑或更有老牌厂商背书的故事。
