- id: unit-economics-and-capital-intensity
  title: Unit economics, cost structure and capital intensity
  body: 'The public unit-economics file is still mostly a negative-space exercise. Antares discloses a product architecture,
    target applications and a manufacturing ambition of up to 10 sealed units per year, but not capex, tooling cost, yield,
    inventory, supplier prepayments, field-service burden or realized gross margin. External benchmarks therefore matter.
    Lazard’s power-cost work and ANS microreactor cost analysis both reinforce the same caution: first-of-a-kind and early
    factory units are unlikely to show the cost benefits promised by standardized production until repeated manufacturing,
    a mature supply chain and learning-curve effects arrive. Military buyers may tolerate higher early costs because resilience
    and logistics matter more than commodity power price, but that customer mix also concentrates revenue in federal programs.
    Until Antares discloses ASP, bill of materials, warranty assumptions, service cost and project-finance exposure, the honest
    public model uses nulls for revenue, margin, burn and runway rather than false precision.'
