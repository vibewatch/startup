- id: government-and-revenue-signals
  title: Government revenue and orderbook signals
  body: The non-dilutive record is real but still small relative to the balance-sheet ambition. USAspending, HigherGov and
    Federal Compass identify a $4.2 million AFRL firm-fixed-price contract for NEPADSO nuclear electric propulsion work, while
    SBIR.gov lists 2024 Phase I and Phase II Air Force awards around deployable microreactors and high-power space applications.
    Those records validate government willingness to fund technical work and give Antares a stronger demand signal than a
    purely speculative reactor developer. They do not, however, prove commercial revenue quality. Public articles and company-linked
    announcements describe firm military contracts, committed orderbook language and ANPI selection for a proposed Joint Base
    San Antonio deployment, but the values, deposits, cancellation rights, recognition milestones and gross-margin structure
    remain undisclosed. For a financial model, those items should be classified as government-backed demand proof, not bankable
    backlog.
