- id: financial-verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: 'The financial verdict is constructive on capital access and still weak on operating proof. Antares has raised enough
    private capital to pursue a rapid nuclear hardware path, and the government-contract trail creates validation that many
    advanced-reactor startups lack. The same evidence also makes the diligence burden heavier: a $604 million capital base,
    a $1.3 billion post-money valuation and disclosed debt require a real plan for converting defense demand into margin-positive
    units. Public sources do not provide recognized revenue, ARR, cash, burn, runway, debt terms, pricing, gross margin or
    revenue-recognition policy. That means the company can be underwritten as a well-financed, strategically relevant, pre-revenue
    nuclear manufacturer, not as a business with proven economics. The next diligence package should request latest balance
    sheet, monthly cash burn, debt schedule, orderbook by counterparty, unit ASP, capex budget, manufacturing yield, warranty
    reserve, and project-level gross-margin bridge. The decisive point is not that the company lacks demand signals; it is
    that every major public dollar figure describes financing or awards rather than operating performance. That asymmetry
    makes private management materials essential before pricing a primary or secondary investment.'
