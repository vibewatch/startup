chapter:
  number: 4
  title: Financials
  summary: 'Antares is now a well-financed, defense-led nuclear hardware startup: $604 million raised, a roughly $1.3 billion
    post-money valuation, and visible government awards. The public financial file still lacks revenue, burn, runway, pricing,
    margin and debt-term disclosure, so the financial verdict is capital-adequate but operating-economics opaque.'
sections:
- id: funding-capital-structure
  title: Funding history and capital structure
  body: 'Antares’ financial story is unusually capital-rich for a company that still does not disclose operating financials.
    The public chronology now shows a $30 million Series A in 2024, a $96 million Series B in December 2025 split between
    $71 million of equity and $25 million of debt, and a $470 million Series C announced on July 27, 2026 split between $370
    million of equity and $100 million of debt. That brings canonical total capital raised to $604 million and places the
    company around a $1.3 billion post-money valuation. The round quality is credible: Paradigm and Caffeinated Capital co-led,
    with Point72 Ventures, Shine Capital and Industrious Ventures in the syndicate. The underwriting caution is the debt stack.
    At least $125 million of disclosed debt now sits in the capital structure before public revenue disclosure, making covenants,
    collateral, maturity and project-recourse detail first-order diligence items rather than footnotes.'
