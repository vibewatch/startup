  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: Antares recognized revenue and ARR
    missingEvidence: No reviewed public source disclosed recognized commercial revenue, ARR, revenue run-rate or revenue mix
      for Antares.
    whyItMatters: Without revenue, signed demand cannot be converted into quality-of-revenue or growth analysis.
    diligencePath: Request audited or board-level revenue by contract, recognition policy, deferred revenue and remaining
      performance obligations.
    relatedQuestionRefs:
    - QI016
    relatedTableRefs:
    - TI004
    - TI006
  - type: private-evidence-only
    severity: blocking
    topic: Antares pricing and orderbook value
    missingEvidence: Public sources do not disclose R1 ASP, orderbook value, deposits, cancellation rights or delivery-by-year
      backlog.
    whyItMatters: Orderbook and firm-contract language cannot be valued without price, timing and enforceability.
    diligencePath: Request signed backlog schedule by counterparty with contract value, payment milestones, termination rights
      and expected delivery date.
    relatedQuestionRefs:
    - QI012
    - QI017
    relatedTableRefs:
    - TI002
    - TI004
    - TI006
  - type: private-evidence-only
    severity: blocking
    topic: Antares cash burn and runway
    missingEvidence: No reviewed source disclosed unrestricted cash, monthly burn, runway months or cash-flow statement.
    whyItMatters: Capital adequacy cannot be tested despite the large round because nuclear hardware development can consume
      cash rapidly.
    diligencePath: Request latest balance sheet, restricted cash schedule, trailing monthly burn and 2026-2028 operating plan.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI003
    - TI006
  - type: private-evidence-only
    severity: material
    topic: Antares debt terms
    missingEvidence: The public record discloses $125 million of debt components but not interest, maturity, covenants, collateral
      or recourse.
    whyItMatters: Debt terms can materially change downside value and operating flexibility for a pre-revenue company.
    diligencePath: Request executed debt agreements, covenant model, collateral package, maturity schedule and any project-finance
      side letters.
    relatedQuestionRefs:
    - QI005
    - QI025
    relatedTableRefs:
    - TI001
    - TI003
    - TI006
  - type: private-evidence-only
    severity: material
    topic: Antares manufacturing unit economics
    missingEvidence: No public source discloses factory capex, unit bill of materials, yield, warranty reserve, inventory
      needs or project gross margin.
    whyItMatters: The core financial question is whether microreactors can be manufactured and serviced at margin-positive
      cost.
    diligencePath: Request FOAK and NOAK cost curves, capex budget, supplier prepayment plan, warranty reserve and gross-margin
      bridge.
    relatedQuestionRefs:
    - QI019
    - QI020
    relatedTableRefs:
    - TI005
  - type: enumeration-incomplete
    severity: material
    topic: Government contracts and orderbook enumeration
    missingEvidence: Public portals verify selected awards, but undisclosed firm contracts and committed orderbook details
      are not fully enumerable.
    whyItMatters: A partial government-contract table may understate or overstate real demand if undisclosed awards are material.
    diligencePath: Request management’s complete contract register and reconcile it to USAspending, SAM.gov, SBIR and customer
      program records.
    relatedQuestionRefs:
    - QI011
    - QI012
    relatedTableRefs:
    - TI002
