  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Burn, runway, pricing, and unit economics
    missingEvidence: Public sources do not disclose Antares revenue, burn rate, runway, R1 pricing, gross margin, or delivered
      cost per MWh.
    whyItMatters: Financial resilience and commercial competitiveness cannot be underwritten without knowing how much capital
      is required after Mark-1 and first deployments.
    diligencePath: Request current cash, monthly burn, debt covenants, board-approved budget, unit cost model, target price,
      and sensitivity cases.
    relatedQuestionRefs:
    - QR011
    - QR021
    relatedTableRefs:
    - TR005
    - TR006
  - type: private-evidence-only
    severity: material
    topic: Mark-1 integrated full-power qualification
    missingEvidence: No public test report demonstrates integrated nuclear full-power operation, power conversion, heat rejection,
      reliability, or off-normal performance for Mark-1.
    whyItMatters: Mark-0 cannot prove deployable electricity economics or field reliability without the next integrated demonstration.
    diligencePath: Obtain Mark-1 test plan, acceptance criteria, independent witness reports, runtime history, and incident
      logs when available.
    relatedQuestionRefs:
    - QR003
    - QR004
    - QR030
    relatedTableRefs:
    - TR002
    - TR006
  - type: enumeration-incomplete
    severity: material
    topic: TR001 regulatory and legal register coverage
    missingEvidence: The regulatory register is limited to public federal and general legal sources; site-specific permits,
      base agreements, insurance policies, and private safety-basis documents are not public.
    whyItMatters: Nuclear licensing and liability risk can hinge on terms that are not visible from press releases or public
      framework pages.
    diligencePath: Request site-by-site licensing matrix, NEPA reviews, insurance documents, emergency planning zones, and
      decommissioning plans.
    relatedQuestionRefs:
    - QR015
    - QR016
    - QR028
    relatedTableRefs:
    - TR001
  - type: enumeration-incomplete
    severity: material
    topic: TR006 integrated risk register coverage
    missingEvidence: The integrated register enumerates material public risks but cannot exhaust private supplier contracts,
      customer contracts, internal test failures, or financing covenants.
    whyItMatters: Unseen contractual or technical facts could change likelihood, impact, mitigation maturity, and residual
      ratings.
    diligencePath: Conduct management diligence across supplier contracts, customer MOUs, test nonconformance logs, cap table,
      debt documents, and board materials.
    relatedQuestionRefs:
    - QR001
    - QR026
    - QR027
    relatedTableRefs:
    - TR006
  - type: conflicting-data
    severity: minor
    topic: Julia DeWahl leadership and co-founder status
    missingEvidence: Some third-party sources reportedly identify Julia DeWahl as a co-founder or president, but the official
      Antares leadership page fetched for this chapter does not list her.
    whyItMatters: Founder departures or title discrepancies can matter for key-person risk, vesting, governance, and narrative
      consistency.
    diligencePath: Ask the company to confirm founder list, current employment status, equity vesting, board/advisor role,
      and departure terms if applicable.
    relatedQuestionRefs:
    - QR023
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: Customer orderbook and civilian demand
    missingEvidence: Public sources name ANPI, DIU, Army, Air Force, and proposed deployments but do not disclose firm order
      quantities, pricing, margins, cancellation rights, or civilian backlog.
    whyItMatters: Government eligibility and strategic interest do not prove repeatable commercial demand or unit economics.
    diligencePath: Request signed contracts, OTA terms, backlog bridge, option structure, customer concentration, cancellation
      clauses, and civilian pipeline detail.
    relatedQuestionRefs:
    - QR012
