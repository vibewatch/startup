company:
  name: Antares Nuclear
chapter:
  number: 7
  title: Risks
  summary: Antares has real momentum after Mark-0 zero-power criticality and a large 2026 Series C, but the residual risk
    profile remains high. The core risks are zero-power milestone overstatement, full-power execution, HALEU and TRISO supply,
    military-customer concentration, NRC/civilian licensing, nuclear safety and safeguards, undisclosed unit economics, and
    first-of-kind manufacturing scale-up.
sections:
- id: s701
  title: 'Top risk: Antares is real but not yet power-proven'
  body: Antares has crossed a meaningful nuclear physics milestone, but the central risk is that investors, customers, or
    policymakers treat a zero-power criticality event as if it de-risked commercial power generation. The evidence does not
    support that leap. Mark-0 reached criticality at INL under DOE authority, yet the retained record is still a zero-power
    reactor experiment rather than a full-power, electricity-producing, field-operating product. The next milestones require
    integrated heat transport, heat exchange, power conversion, controls, shielding, operations, and site procedures to work
    as a system. That is why the residual technology risk stays high even after the June 2026 announcement. The mitigation
    is not merely more capital; it is independently witnessed Mark-1 full-power operation, disclosed test duration, off-normal
    performance, maintenance history, and an evidence trail that separates physics validation from deliverable electricity.
    Until then, Mark-0 should be credited as a real step and haircut as a narrow one.
  claimRefs:
  - CR003
  - CR004
  - CR005
  - CR006
  - CR039
  - CR040
  - CR046
  tableRefs:
