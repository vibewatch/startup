- id: s702
  title: Fuel and supply chain risk can gate otherwise successful engineering
  body: 'The fuel story is both a strength and a bottleneck. Antares benefits from concrete fuel partners: BWXT fabricated
    TRISO fuel for Mark-0, Urenco announced an advanced-fuel supply agreement, and DOE sources explain why HALEU matters for
    advanced reactors. But that same evidence points to dependency risk. HALEU is a specialized 5% to 20% U-235 material,
    U.S. commercial-scale supply remains a sector constraint, and microreactor deployment depends on transport, security,
    safeguards, and qualified fabrication. The near-term fuel chain is therefore not a generic procurement function; it is
    a critical path. A delay in HALEU availability, TRISO compacts, quality documentation, or export/import permissions could
    slip Mark-1 and deployment milestones even if the reactor design is sound. Mitigation exists in named counterparties and
    government prioritization, but the residual risk remains medium-high because source diversity, inventory buffers, and
    long-run commercial terms are not publicly visible.'
  claimRefs:
  - CR007
  - CR008
  - CR009
  - CR010
