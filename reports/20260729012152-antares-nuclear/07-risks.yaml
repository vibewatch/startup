- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Mark-1 power proof
    - INL full-power milestone
    - No credible electricity-producing Mark-1 evidence during 2027
    - Downgrade technology readiness and extend all deployment timing
  - - HALEU and TRISO supply
    - Fuel delivery and QA milestones
    - Fuel delivery, fabrication, or safeguards approvals slip materially
    - Treat schedule as supply-chain gated even if reactor engineering progresses
  - - ANPI competition
    - Downselect / award status
    - Radiant or Westinghouse gains primary JBSA or first-base position
    - Lower government-customer conversion assumptions
  - - Unit economics
    - Delivered price or LCOE disclosure
    - Pricing remains undisclosed or above plausible customer thresholds after Mark-1
    - Limit civilian TAM and haircut valuation multiples
  - - NRC licensing
    - Pre-application to application progression
    - No public NRC path, topical reports, or Part 53 strategy after pilot progress
    - Keep non-military commercialization outside base case
  - - Capital runway
    - Financing or debt covenant signals
    - Bridge financing, down round, covenant stress, or undisclosed debt escalation appears
    - Assume further dilution and re-underwrite runway
  - - Safety / safeguards
    - Incident, material-control issue, or adverse regulator signal
    - Any public nuclear safety, security, or safeguards incident
    - Pause investment case until independent root-cause closure
  - - Leadership and execution
    - Key-person or senior technical departures
    - CEO, CNO, chief engineer, or regulatory lead departs before Mark-1
    - Raise execution risk and require revised accountability plan
  notes: Kill criteria are intentionally observable from public milestones or diligence requests so the risk view can be refreshed
    monthly.
