callouts:
- calloutType: strength
  title: Defense-first is the right early segment
  body: Antares has a clearer public route through ANPI, Janus, and DOE-authorized demonstrations than through merchant
    civilian power markets. That matters because defense buyers can value resilience and fuel logistics above commodity
    LCOE.
  claimRefs:
  - CM016
  - CM018
  - CM019
  - CM034
  - CM038
- calloutType: risk
  title: Broad TAM can overstate reachable demand
  body: Global SMR forecasts, data-center load growth, and pipeline capex are not Antares revenue. HALEU supply,
    NRC pathways, first-unit cost, and manufacturing maturity can delay conversion of TAM into deployable units.
  claimRefs:
  - CM015
  - CM027
  - CM028
  - CM030
  - CM039
- calloutType: assumption
  title: Model the first revenue wedge as price-insensitive
  body: Until Antares discloses backlog and unit economics, the conservative underwriting assumption is defense
    pilots and prototypes first, with data centers and remote industrial customers treated as option value.
  claimRefs:
  - CM014
  - CM015
  - CM036
  - CM038
  - CM042
