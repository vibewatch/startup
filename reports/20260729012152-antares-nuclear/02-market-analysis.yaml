- id: segments-and-buying-motion
  title: Buyer segmentation and adoption path
  body: 'The strongest public buyer evidence is defense-first. The Department of the Air Force selected Antares
    alongside Radiant and Westinghouse for ANPI, and the Army’s Janus program explicitly uses DIU-style milestone
    contracting to deliver commercial microreactors to the warfighter. In that segment, the buyer and payer are
    federal program offices or installation-energy authorities, while the user is the base or mission operator that
    needs resilient power. Remote industrial users and data centers are plausible adjacencies, but public evidence
    is less direct: they may be users while utilities, project developers, or hyperscalers decide ownership and
    procurement. Space is a strategic adjacency rather than a sized market in public evidence. Adoption likely moves
    from authorization and test criticality to site selection, safety case, fuel allocation, pilot operation, and
    then repeatable unit procurement.'
