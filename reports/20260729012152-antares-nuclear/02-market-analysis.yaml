  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Antares-specific SOM
    missingEvidence: Public sources do not disclose Antares’ qualified pipeline, priced backlog, expected unit deliveries
      by segment, or win-share assumptions.
    whyItMatters: Without bottom-up customer and deployment evidence, broad SMR or data-center TAM estimates can
      dramatically overstate near-term revenue.
    diligencePath: Request data-room pipeline by customer, site, regulatory path, expected COD, unit price, and
      probability-weighted conversion.
    relatedQuestionRefs:
    - QM007
    - QM025
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: Defense budget ownership
    missingEvidence: ANPI and Janus identify program channels but do not disclose exact budget line, acquisition
      owner, award value, or base-level approval chain for Antares.
    whyItMatters: Sales timing and price tolerance depend on which federal office controls procurement and sustainment
      funding.
    diligencePath: Obtain solicitations, OT award documents, base siting records, and management interviews covering
      acquisition authority.
    relatedQuestionRefs:
    - QM012
    relatedTableRefs:
    - TM003
  - type: conflicting-data
    severity: material
    topic: SMR market sizing spread
    missingEvidence: Market publishers disagree on SMR revenue forecasts and WoodMac reports pipeline investment
      rather than comparable annual revenue.
    whyItMatters: The spread changes TAM assumptions and can lead to false precision in valuation models.
    diligencePath: Normalize estimates by reactor size, geography, application, revenue versus capex, and probability-adjusted
      deployment.
    relatedQuestionRefs:
    - QM021
    - QM025
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: HALEU delivery timing and allocation
    missingEvidence: Public evidence does not verify Antares’ exact HALEU delivery schedule, quantity, enrichment
      source, or contingency plan for commercial units.
    whyItMatters: Fuel availability can become the binding constraint even if customer demand and regulatory authorization
      are present.
    diligencePath: Review fuel supply contracts, DOE allocations, fabrication schedule, and alternative fuel-provider
      commitments.
    relatedQuestionRefs:
    - QM015
    - QM026
    relatedTableRefs:
    - TM004
  - type: private-evidence-only
    severity: material
    topic: Civilian customer willingness to pay
    missingEvidence: Public sources do not provide data-center, industrial, or remote-site willingness-to-pay evidence
      for Antares’ delivered cost.
    whyItMatters: Lazard’s SMR cost context suggests non-defense segments may be slower unless customers pay a resilience
      premium.
    diligencePath: Request LOIs, PPAs, customer interviews, delivered-cost stack, and substitute comparisons by
      segment.
    relatedQuestionRefs:
    - QM016
    - QM022
    - QM027
    relatedTableRefs:
    - TM003
    - TM004
