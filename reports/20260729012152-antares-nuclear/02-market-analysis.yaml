tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Defense installations
    - Microreactor unit, site works, fuel, operations, security and microgrid integration
    - Generic base energy-efficiency upgrades with no reactor deployment
    - DOD, Air Force, Army, DIU-linked program offices
    - Core near-term wedge
  - - Remote/off-grid critical infrastructure
    - Transportable clean firm power for remote communities, disaster response, ports, or strategic sites
    - Ordinary grid supply where interconnection is cheap and reliable
    - Federal, state, utility, or site owner budgets
    - Adjacent / resilience-led
  - - AI data centers
    - Future dedicated firm low-carbon generation and possible behind-the-meter SMR supply
    - Conventional PPAs or grid upgrades not tied to nuclear deployment
    - Hyperscalers, utilities, developers, colocation operators
    - Large TAM, later timing
  - - Space and defense spacecraft
    - Nuclear electric propulsion or high-density power R&D and specialized mission systems
    - Terrestrial baseload projects with no aerospace use
    - NASA, Space Force, AFRL, defense primes
    - Strategic option value
  - - Industrial heat and remote mining
    - Off-grid electric or thermal energy where fuel logistics are costly
    - Grid-connected commodity power with cheaper substitutes
    - Mine, industrial owner, or project developer
    - Potential but less evidenced
  notes: Market boundary is evidence-constrained to use cases where resilience, logistics, or clean firm power justify
    microreactor cost.
