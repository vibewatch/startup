- id: drivers-constraints
  title: Growth drivers, policy tailwinds, and bottlenecks
  body: The driver stack is unusually strong for a young nuclear company. AI data-center electricity demand, electrification,
    grid vulnerability, military energy resilience, and decarbonization all increase the value of firm clean power.
    IEA, McKinsey, S&P Global, and Wood Mackenzie show the demand shock, while EO 14301, EO 14299, DOE’s Reactor
    Pilot Program, ANPI, and Project Janus create a government-backed path for demonstrations. The constraints are
    equally material. HALEU is a sector-wide bottleneck for many advanced reactor designs; NRC readiness matters
    once Antares moves beyond DOE or DOD pathways; Lazard’s SMR cost context is high versus many alternatives; and
    the promised factory-learning curve depends on serial manufacturing that no U.S. startup has yet proven. These
    factors make defense attractive because resilience can outweigh commodity-energy cost.
  claimRefs:
