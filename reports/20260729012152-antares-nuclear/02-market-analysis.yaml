- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - AI and data-center electricity load
    - driver
    - Current through post-2030
    - Creates large clean firm power need, but SMR contribution is later-dated
    - Request customer LOIs, PPA economics, and interconnection assumptions
  - - Military energy resilience
    - driver
    - 2025-2028
    - Defense demand can tolerate higher cost for mission assurance
    - Verify funded program awards, site authority, and budget lines
  - - EO 14301 and DOE Reactor Pilot Program
    - driver
    - 2025-2026
    - Accelerates demonstration authorization and criticality milestones
    - Map which authorizations transfer to full-power operation
  - - EO 14299, ANPI, and Project Janus
    - driver
    - 2025-2030
    - Creates defense installation pathway outside ordinary civilian procurement
    - Verify schedule, environmental review, and award structure
  - - HALEU supply
    - constraint
    - Current through early 2030s
    - Can limit number and timing of deployable reactors
    - Audit fuel contracts, allocations, enrichment schedule, and contingency supply
  - - SMR LCOE and FOAK economics
    - constraint
    - Current
    - Civilian buyers may reject high cost without resilience premium
    - Benchmark delivered cost versus diesel, gas, grid upgrades, and PPAs
  - - NRC licensing readiness
    - constraint
    - Civilian scale-up
    - DOE/DOD path does not remove NRC gate for broad commercial markets
    - Review Part 53 or microreactor licensing strategy
  - - Manufacturing scale and learning curve
    - constraint
    - Late 2020s-2030s
    - Factory cost benefits require repeat units and supply-chain maturity
    - Request unit-cost curve, suppliers, QA plan, and delivery capacity
  notes: The table mixes demand pull and adoption friction because both govern the reachable SAM/SOM, not just headline
    TAM.
