  topStrengths:
    - >-
      Mark-0 reached zero-power criticality at INL in June 2026 — the first advanced reactor to do so under the DOE
      Reactor Pilot Program — giving Antares a rare, verifiable hardware milestone ahead of most SMR peers.
    - >-
      A defense-first strategy backed by executive orders (EO 14299/14301), ANPI/JBSA selection, DIU eligibility, and an
      AFRL propulsion contract creates a largely guaranteed, price-insensitive government demand base.
    - >-
      Well-capitalized after a $470M Series C at a ~$1.3B valuation, with a vertically integrated Torrance factory
      targeting up to 10 factory-sealed units per year and a proven BWXT/Project Pele TRISO fuel spec.
  topRisks:
    - >-
      The company is pre-revenue at a unicorn valuation, and Mark-0 was zero-power criticality only — no electricity,
      full-power operation, heat-pipe/Brayton qualification, or commercial deployment is yet proven.
    - >-
      Revenue is concentrated on US government/DoD demand exposed to budget, administration, and executive-order
      reversal risk, while ANPI remains a three-way competition against Radiant and Westinghouse.
    - >-
      SMR cost uncompetitiveness (Lazard ~$214/MWh), an immature US HALEU/TRISO supply chain, and an aggressive 2027
      electricity / 2028 deployment timeline create material execution and dilution risk.
  unresolvedGaps:
    - Recognized revenue, gross margin, burn rate, runway, and the precise value of the "committed orderbook."
    - Exact current headcount, precise post-money mechanics (price per share, preference stack), and cap-table detail.
    - Julia DeWahl's current co-founder/leadership status and the full board/governance and control-rights map.
    - Full-power operational performance, heat-pipe/Brayton qualification results, and secured long-term HALEU supply.
