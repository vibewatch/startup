- id: section-5
  title: Diligence interpretation and carry-forward gaps
  body: For company-overview purposes, Antares clears the basic existence, identity, leadership, capital, and milestone
    gates; the remaining diligence problem is not whether the company is real, but how much execution and governance
    risk should be attached to the speed of the plan. The public record supports a Series C private company with
    a large defense-oriented financing, official leadership roster, government program references, Mark-0 validation,
    and a specific JBSA pathway. It does not support precise revenue, exact current customer count, exact headcount,
    complete board structure, ownership percentages, or a verified current role for Julia DeWahl. Those gaps matter
    because a nuclear hardware startup can look more mature through funding and government milestones than through
    commercial operations. Later chapters should therefore reuse the canonical funding and milestone facts while
    treating customer economics, regulatory pathway, fuel supply, and governance controls as open underwriting workstreams.
