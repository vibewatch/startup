  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Revenue and run-rate are not publicly disclosed
    missingEvidence: Recognized revenue, contracted backlog conversion, revenue run-rate, and payment schedules
      by program.
    whyItMatters: Funding and government milestones cannot substitute for commercial economics in valuation and
      financial diligence.
    diligencePath: Request management financials, customer contracts, invoices, backlog bridge, and revenue-recognition
      memo.
    relatedQuestionRefs:
    - QO013
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: Customer count and orderbook are not publicly quantified
    missingEvidence: Exact active customer count, signed reactor orders, committed orderbook value, and cancellation
      or contingency terms.
    whyItMatters: ANPI and agency references show traction but do not reveal how many paying customers exist.
    diligencePath: Request CRM export, signed contract list, government award pipeline, and orderbook reconciliation.
    relatedQuestionRefs:
    - QO014
    - QO027
    relatedTableRefs:
    - TO001
    - TO003
  - type: missing-source
    severity: material
    topic: Exact current headcount is absent from retained public sources
    missingEvidence: Current employee count, functional split, open roles, attrition, and nuclear-qualified staff
      count.
    whyItMatters: Manufacturing and regulatory execution depend on scarce nuclear and aerospace talent.
    diligencePath: Request HR headcount report, recruiting plan, attrition data, and critical-role vacancy list.
    relatedQuestionRefs:
    - QO015
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: material
    topic: Julia DeWahl founder status is third-party-reported but not official-current
    missingEvidence: Founder agreement, current employment or board status, and company-confirmed leadership-change
      timeline.
    whyItMatters: Founder attribution affects governance history, key-person risk, and public narrative accuracy.
    diligencePath: Ask management to confirm all founders, current roles, departures, board seats, and public bio
      changes.
    relatedQuestionRefs:
    - QO006
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: material
    topic: Board and investor-control map is not public
    missingEvidence: Board roster, observer rights, investor rights agreement, voting thresholds, liquidation preferences,
      and side letters.
    whyItMatters: The Series C capital stack may carry governance rights that materially affect exit and financing
      outcomes.
    diligencePath: Request cap table, charter, investor-rights agreement, side letters, and current board minutes.
    relatedQuestionRefs:
    - QO007
    - QO026
    relatedTableRefs:
    - TO002
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: Milestone table omits private internal gates and contract signatures
    missingEvidence: Internal design reviews, private board approvals, full contract-signature chronology, and deployment
      down-select records.
    whyItMatters: The public chronology is adequate for overview but should not be mistaken for a full operating
      history.
    diligencePath: Request management milestone tracker, program plan, and signed contract timeline.
    relatedQuestionRefs:
    - QO028
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: material
    topic: Fuel-supply dependency cannot be fully underwritten from public sources
    missingEvidence: HALEU volumes, delivery schedules, contingency suppliers, DOE allocation terms, and Urenco
      contract conditions.
    whyItMatters: HALEU timing is a known advanced-nuclear bottleneck and can delay deployment even if reactor design
      progresses.
    diligencePath: Review fuel-supply agreements, DOE allocation letters, BWXT fabrication schedule, and alternate
      supply plan.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO004
