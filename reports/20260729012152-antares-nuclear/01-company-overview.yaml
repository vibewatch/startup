- id: section-3
  title: Capital formation, investors, and public/private funding mix
  body: Antares' capital history now looks like a late-stage hard-tech financing stack built before commercial deployment,
    not a revenue-backed growth story. The canonical public sequence is a $30 million Series A in 2024, a $96 million
    Series B in December 2025 split between $71 million of equity and $25 million of debt, and a $470 million Series
    C announced on July 27, 2026 that included $370 million of equity and $100 million of debt. Paradigm and Caffeinated
    Capital co-led the Series C, with Point72 Ventures, Shine Capital, and Industrious Ventures participating. Public
    sources support $604 million of total capital raised and about a $1.3 billion post-money valuation. Separate
    from equity, USAspending and HigherGov show a $4.2 million AFRL contract, while ANPI and DOE activity indicate
    government-program traction rather than ordinary customer revenue disclosure.
  claimRefs:
  - CO025
  - CO026
  - CO027
  - CO028
  - CO029
  - CO030
  - CO035
  - CO036
  - CO051
  - CO052
