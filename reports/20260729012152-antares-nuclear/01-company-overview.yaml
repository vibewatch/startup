  - TO003
- id: section-4
  title: Milestones, government programs, and technical readiness boundaries
  body: The dated record shows rapid milestone accumulation, but each milestone should be underwritten at the right
    level. The sequence runs from 2023 formation, through Series A and Series B financing, 2025 Antares Prime and
    NSDA progress, January 2026 PDSA approval and graphite-core machining, April 2026 ANPI/JBSA selection, May 2026
    Urenco HALEU supply contracting, June 4, 2026 Mark-0 zero-power criticality at INL, and the July 2026 Series
    C. The Mark-0 event is real and important because DOE, Army, industry, and company sources all corroborate a
    criticality milestone under the Reactor Pilot Program. It is not the same as an electricity-producing reactor;
    independent nuclear coverage explicitly frames it as zero-power physics validation. Similarly, ANPI selection
    places Antares on a credible defense deployment path, but POWER's finalist coverage shows a competitive field
    including Radiant and Westinghouse.
