- id: section-2
  title: Leadership, founders, and governance visibility
  body: 'Leadership disclosure is useful at the operating level and weak at the governance level. Antares'' official
    leadership-team page names Jordan Bramble as CEO and co-founder and then enumerates the nuclear, engineering,
    mission, talent, policy, finance, operations, manufacturing, hardware, regulatory, and nuclear-affairs leads
    who form the current visible bench. That roster is unusually relevant because Antares is trying to compress
    nuclear development, fuel procurement, manufacturing, and government deployment into a short window. Founder
    attribution needs a caveat: third-party sources and Julia DeWahl''s own public profile describe her as connected
    to Antares'' founding story, but the official leadership page reviewed here does not list her as current leadership.
    Public sources also do not expose a complete board, committee structure, investor veto rights, or founder ownership,
    so governance and key-person dependence around Bramble remain material diligence gaps.'
