companyProfile:
  summary: >-
    Antares Nuclear is a Torrance, California advanced-nuclear company founded in 2023 to mass-produce factory-sealed
    TRISO-fueled microreactors for US defense and strategic-energy customers. In June 2026 its Mark-0 demonstration
    reactor achieved zero-power criticality at Idaho National Laboratory under the DOE Reactor Pilot Program, and in
    July 2026 it raised a $470 million Series C at roughly a $1.3 billion post-money valuation. The company is
    pre-revenue, with a government-anchored orderbook and an aggressive roadmap to electricity in 2027 and military
    deployment in 2028.
  foundedDate: '2023-01-01'
  founders:
    - name: Jordan Bramble
      role: CEO and Co-Founder
      background: >-
        Systems-engineering and physics background (George Mason and Georgetown); prior work at the White House Office
        of Management and Budget; central strategy, fundraising, and government-relations figure.
      claimRefs: [CO010, CO037]
    - name: Julia DeWahl
      role: Co-Founder (reported; not on current official leadership page)
      background: >-
        Identified by third-party profiles as an Antares co-founder or president, but not listed on the official
        leadership-team page as of 2026; status carried as an unresolved gap.
      claimRefs: [CO023]
  foundingLocation: Torrance, California, USA
  headquarters: Torrance, California, USA
  productSummary: >-
    Factory-built fission microreactors (the R1) using TRISO-coated particle fuel in a prismatic graphite core with
    passive sodium heat pipes and a closed nitrogen Brayton power-conversion cycle, delivering 100 kWe to 1 MWe for
    six or more years without refueling and shipped in an integrated shielding and transport cradle.
  customerFocus: >-
    US military and government customers (Air Force, Space Force, Army/Department of War, Defense Innovation Unit,
    NASA) for on-base energy resilience and off-grid power, with future space-propulsion and commercial/remote
    applications.
  businessModel: >-
    Capital-equipment sales of factory-sealed microreactors plus long-term fuel and service contracts, currently
    anchored by government contracts, SBIR/OT awards, and defense program selections.
  stage: Series C
  fundingStatus: >-
    Private; $470M Series C (July 2026, $370M equity + $100M debt) at ~$1.3B post-money, bringing total disclosed
    capital raised to approximately $604M across Series A (2024), Series B (December 2025), and Series C.
  disclosureProfile: private-undisclosed
  claimRefs: [CO002, CO003, CO010, CO027, CO029, CO030, CI001, CI006, CI007, CE002, CE005]
summary:
  headline: >-
    Antares has delivered a rare hardware milestone and a government-anchored orderbook, but a ~$1.3B pre-revenue
    valuation prices in flawless execution against nuclear's long history of delay.
