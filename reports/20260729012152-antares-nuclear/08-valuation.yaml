company:
  name: Antares Nuclear
chapter:
  number: 8
  title: Valuation
  summary: 'Antares'' $1.3 billion post-money Series C mark is stretched for a pre-revenue nuclear hardware company, but it
    is not irrational given $604 million raised, a first zero-power criticality milestone, defense-backed demand signals,
    and scarce advanced-nuclear public comparables. The right stance is track/research-more rather than buy: underwrite the
    mark only if ANPI, 2027 electricity, 2028 deployment, HALEU supply, and cap-table terms de-risk on schedule.'
sections:
- id: valuation-recommendation
  title: 'Recommendation: stretched mark, credible milestone, still not a buy on public evidence'
  body: 'Antares should be treated as a trackable but high-risk valuation story rather than a clean buy at the latest mark.
    The public record supports the headline inputs: a $470 million Series C announced on July 27, 2026, split between $370
    million of equity and $100 million of debt, a roughly $1.3 billion post-money valuation, and $604 million of total capital
    raised. That implies an estimated valuation-to-total-raised ratio of about 2.1x, which is not extreme for a scarce defense-nuclear
    platform but is rich for a company with no disclosed revenue, no public unit economics, and only zero-power criticality
    rather than electricity production. The recommendation is therefore price-sensitive: a secondary entry materially below
    the Series C could be interesting, while a primary-like entry should wait for Mark-1 electricity, ANPI winner economics,
    and debt/preference disclosure.'
