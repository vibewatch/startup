- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - explicit assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - bull
    - Antares wins a major ANPI path, achieves 2027 electricity, deploys in 2028, scales toward 10 units/year, and extends
      from defense to data centers or space.
    - Estimated/inferred multi-billion outcome; $1.3B entry can work if later public comps reward operating scarcity.
    - Execution, HALEU, safety authorization, factory yield, and customer concentration.
    - Estimated 25% probability based on milestone momentum but many remaining gates.
  - - base
    - Defense niche develops gradually; Mark-1 works but deployments slip or arrive in small batches with continuing capital
      needs.
    - Estimated/inferred fair-value band around the current $1.3B to $2.5B if dilution is controlled.
    - Slower revenue conversion, structured capital, and limited commercial TAM proof.
    - Estimated 45% probability; best matches public evidence today.
  - - bear
    - ANPI momentum weakens, Mark-1 slips, HALEU or cost issues bite, or nuclear-startup funding resets after hype.
    - Estimated/inferred down-round band of $0.4B to $0.8B; existing investors may be diluted or preference-protected.
    - Illiquidity, debt seniority, no revenue base, and sector multiple compression.
    - Estimated 30% probability because zero-power criticality is not commercialization.
  notes: Scenario ranges and probabilities are author estimates, not company guidance; they are included because DCF and revenue
    multiples are not meaningful yet.
