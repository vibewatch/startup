- id: scenario-underwriting
  title: Scenario underwriting is the only honest valuation method today
  body: 'Because Antares does not disclose revenue, gross margin, backlog value, production cost, ASP, or signed order economics,
    valuation must be expressed as conditional ranges rather than a point estimate. The bull case requires Antares to win
    or materially benefit from ANPI, generate electricity at INL in 2027, field defense systems in 2028, scale factory output
    toward 10 sealed units per year, and convert military credibility into data-center or space opportunities. The base case
    is a narrower defense niche with gradual deployments and repeated financing needs. The bear case is severe: timeline slippage,
    loss of ANPI momentum, HALEU bottlenecks, SMR cost uncompetitiveness, or a broader nuclear-funding reset could force dilution
    or a down round even if the technology remains promising. Public evidence supports tracking these scenarios, not assigning
    a precise present value.'
