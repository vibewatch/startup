- id: TV008
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner / diligence path
  rows:
  - - Cap table and preferences
    - Series C term sheet, liquidation stack, option-pool refresh, covenants, and debt seniority
    - Return distribution can differ from headline post-money valuation.
    - Request financing documents from company counsel or lead investors.
  - - Revenue and orderbook
    - Contract values, cancellation rights, delivery schedule, and customer payment milestones
    - Valuation per committed order cannot be computed publicly.
    - Review signed customer agreements under NDA.
  - - Unit economics
    - Bill of materials, HALEU cost, factory labor, warranty reserve, installed cost, and target gross margin
    - Determines whether defense deployment can become scalable business value.
    - Review Mark-1/EDU cost model and supplier quotes.
  - - Fuel and regulatory path
    - HALEU delivery schedule, DOE/DOD authorization milestones, environmental review, and NRC commercial pathway
    - Fuel and authorization delays can destroy timing-based value.
    - Cross-check BWXT, Urenco, DOE, DOD, and NRC documentation.
  - - Secondary pricing
    - Forge/other marketplace bid-ask, transaction volume, transfer restrictions, and 409A marks
    - Illiquid secondary marks may not equal executable entry price.
    - Request marketplace indications and company transfer approval history.
  notes: These asks are the minimum evidence package needed before moving from track/research-more toward buy.
