  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: Series C preference stack and debt seniority
    missingEvidence: Series C term sheet, liquidation preferences, participation rights, debt covenants, option-pool refresh,
      and seniority waterfall.
    whyItMatters: Headline post-money valuation can overstate common-equity return potential when structured terms or debt
      sit ahead of new investors.
    diligencePath: Request financing documents, charter amendments, debt agreements, and investor-rights summaries from management
      or lead counsel.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV008
  - type: private-evidence-only
    severity: blocking
    topic: Orderbook value and contract economics
    missingEvidence: Signed order values, customer payment milestones, cancellation terms, delivery schedule, and conversion
      from contracts to revenue.
    whyItMatters: A valuation per committed order cannot be computed without the dollar value and enforceability of the orderbook.
    diligencePath: Review customer contracts and program documents under NDA with finance and legal teams.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV008
  - type: private-evidence-only
    severity: blocking
    topic: Unit economics and gross margin
    missingEvidence: Reactor bill of materials, HALEU cost, factory labor, warranty reserve, installed cost, ASP, and target
      gross margin by deployment year.
    whyItMatters: The company can hit technical milestones yet still fail to justify the valuation if unit economics do not
      improve.
    diligencePath: Request Mark-1 cost model, EDU test cost data, supplier quotes, manufacturing yield plan, and deployment
      margin bridge.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV005
    - TV008
  - type: enumeration-incomplete
    severity: material
    topic: Comparable valuation table private-market coverage
    missingEvidence: Full private post-money valuations, secondary marks, cap structures, and recent financing terms for Radiant,
      Aalo, Last Energy, Kairos, TerraPower, Standard Nuclear, and X-energy.
    whyItMatters: The public comparable table must mix market caps, funding markers, and nulls because private nuclear peers
      rarely disclose identical valuation metrics.
    diligencePath: Supplement public sources with PitchBook, Forge, Carta/Hiive secondary marks, banker materials, and direct
      investor references under NDA.
    relatedQuestionRefs:
    - QV012
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: Fuel and regulatory timing proof
    missingEvidence: Binding HALEU delivery schedule, DOD/DOE authorization milestones, environmental review status, and NRC
      strategy for any commercial non-defense market.
    whyItMatters: Fuel and authorization timing can move valuation even when reactor engineering progresses.
    diligencePath: Cross-check Urenco, BWXT, DOE, DOD, NRC, and customer deployment documents; request management milestone
      tracker.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV007
    - TV008
