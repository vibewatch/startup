- id: comparable-context
  title: Comps show scarcity value, but not proof that Antares is cheap
  body: 'The comparable set argues against a simplistic conclusion. Antares'' $1.3 billion mark sits far below public nuclear
    equities such as Oklo at about $6.89 billion market cap and NuScale at about $3.0 billion, but those companies give public
    investors liquidity and a different disclosure package. It also sits above the most visible private microreactor funding
    markers: Radiant reported $160 million of total venture funding after a $100 million Series C, and Aalo says it has raised
    more than $300 million. Valar''s reported $2 billion valuation and discussions around a $6 billion valuation show how
    quickly AI-linked nuclear narratives can inflate. X-energy''s $1 billion IPO proceeds, TerraPower''s government-backed
    Natrium program, Kairos, Last Energy, and Standard Nuclear all reinforce the same point: market enthusiasm is real, but
    disclosed comparability is weak and milestone timing matters more than a peer median.'
