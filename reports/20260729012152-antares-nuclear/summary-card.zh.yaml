  topStrengths:
    - >-
      Mark-0 于 2026 年 6 月在 INL 达到零功率临界，是 DOE Reactor Pilot Program 下首个做到这一步的先进反应堆；Antares 因此拿到一个罕见、可核验的硬件里程碑，领先多数 SMR
      同行。
    - 国防优先打法由行政令（EO 14299/14301）、ANPI/JBSA 入选、DIU 资格和 AFRL 推进合同托底，拼出一批基本确定、对价格不敏感的政府需求。
    - $470M Series C 之后估值约 $1.3B，资金弹药充足；Torrance 垂直整合工厂目标年产最多 10 台工厂密封机组，并沿用已验证的 BWXT/Project Pele TRISO 燃料规格。
  topRisks:
    - 公司仍未产生收入，却已按独角兽估值定价；Mark-0 也只是零功率临界，发电、满功率运行、热管 / Brayton 验证和商业部署都还没有跑通。
    - 收入集中押注美国政府 / DoD 需求，预算、政府换届和行政令反转都会带来风险；ANPI 也仍是与 Radiant、Westinghouse 的三方竞争。
    - SMR 成本缺乏竞争力（Lazard 约 $214/MWh）、美国 HALEU/TRISO 供应链尚不成熟，再叠加 2027 年发电 / 2028 年部署的激进时间表，执行和稀释风险都很重。
  unresolvedGaps:
    - 已确认收入、毛利率、烧钱速度、现金跑道，以及“已承诺订单储备”的精确金额。
    - 当前准确员工数、投后估值机制（每股价格、优先股堆叠），以及股权结构表细节。
    - Julia DeWahl 当前的联合创始人 / 管理层身份，以及完整董事会、治理和控制权地图。
    - 满功率运行表现、热管 / Brayton 验证结果，以及已锁定的长期 HALEU 供应。
