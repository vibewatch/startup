            body: >-
              Switching costs are likely high at a specific site once environmental review, security planning, fuel
              logistics, emergency planning, microgrid integration, and operator training are underway. But
              portfolio-level lock-in is weaker: the Department of Defense, data-center buyers, and industrial customers
              can multi-home across different bases, campuses, or facilities. A buyer could test Antares at one site,
              Radiant or Westinghouse at another, and larger SMRs for data-center clusters. Distribution power therefore
              matters as much as reactor physics. Westinghouse has incumbent trust; X-energy and NuScale have broader
              industrial or utility narratives; BWXT gives the government a defense nuclear supplier benchmark. Fuel is
              both moat and vulnerability. Antares benefits from BWXT fabrication and TRISO/HALEU credibility, yet HALEU
