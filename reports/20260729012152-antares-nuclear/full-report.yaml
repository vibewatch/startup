      - number: '5.2'
        title: Architecture, passive safety, and power conversion
        blocks:
          - type: paragraph
            body: >-
              The public architecture is unusually specific for a young private reactor company. Antares lists seven
              visible R1 subsystems: integrated shielding and transport cradle, reactivity controls, core, sodium heat
              pipes, primary heat exchanger, nitrogen Brayton cycle, and power management and distribution. The core
              uses HALEU TRISO particles in prismatic graphite, with graphite and boron carbide control drums providing
              reactivity control. Heat leaves the core through passive sodium heat pipes, then moves through a
              fin-and-tube primary heat exchanger into a recuperated closed nitrogen Brayton cycle operating below 300
              psi. This architecture explains the company’s manufacturability claim: it avoids pumped primary coolant
              loops and frames the plant as a compact, sealed, low-maintenance system. The risk is exactly where the
              differentiation sits. Mark-0 validated zero-power reactor physics, but it did not include heat removal or
              power conversion; the coupled heat-pipe, exchanger, Brayton, and control behavior remains a Mark-1 and EDU
              qualification burden.
