      - number: '6.3'
        title: Demand drivers are policy-backed and urgent, but they depend on government execution cycles
        blocks:
          - type: paragraph
            body: >-
              Demand for Antares is being pulled by policy and mission risk as much as by conventional power markets. EO
              14299 directs the Army to begin operating an advanced reactor at a domestic military base by September 30,
              2028, and EO 14301 accelerates DOE reactor testing. Army announcements for Janus describe a commercially
              owned and operated model for next-generation nuclear energy at bases, while industry and defense reporting
              frame the need around grid vulnerability, growing base loads, and resilience for critical missions. That
              creates a government-backed market where Antares can sell reliability, autonomy, and schedule certainty
              rather than lowest-cost electrons. The drawback is that procurement is programmatic: schedules can slip
              through NEPA review, safety authorization, appropriations, administration priorities, or competition for
              the same DoD dollars. The market is real, but the conversion path is institutional, not self-serve
