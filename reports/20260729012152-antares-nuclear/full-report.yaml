      - number: '2.5'
        title: Adverse view and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The skeptical case is not that demand is absent; it is that broad demand may monetize later than venture
              narratives imply. Market estimates conflict, data centers may not rely on SMRs at scale until after 2030,
              and first-wave SMRs look expensive in Lazard’s framework. GAO points to fuel and security challenges, and
              NRC-readiness work remains relevant for civilian markets even if defense pathways move faster. Antares’
              Mark-0 criticality is a real market signal, but it does not prove repeatable full-power deployment,
              customer economics, or the ability to manufacture up to ten units annually. Investors should therefore
              underwrite a price-insensitive defense wedge first, treat remote industrial and data-center demand as
              option value, and request bottom-up pipeline, fuel allocation, site authorization, and customer
              willingness-to-pay evidence before translating TAM into revenue.
