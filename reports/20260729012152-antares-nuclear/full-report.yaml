      - number: '7.4'
        title: Regulatory, safety, liability, and waste risks remain split by pathway
        blocks:
          - type: paragraph
            body: >-
              Antares’ near-term path benefits from DOE and military authorization channels, but investors should not
              confuse those channels with a solved civilian nuclear licensing thesis. The NRC lists Antares in
              pre-application engagement, and Part 53 gives advanced reactors a technology-inclusive framework, yet
              commercial deployment still has to satisfy safety, security, environmental, emergency-planning, and
              operating requirements. Liability and public compensation also need explicit underwriting under
              Price-Anderson-style structures. Safety risks are broader than accident probability alone: HALEU creates
              safeguards and proliferation diligence, distributed microreactors create security and siting questions,
              and spent-fuel or waste disposition is not closed in Antares-specific public evidence. The mitigant is
              that nuclear has established regulators and liability frameworks, not that these issues disappear.
              Residual risk remains material because the first deployment pathway may bypass NRC while the larger market
              likely cannot.
