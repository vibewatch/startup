        title: Identity, product scope, and footprint
        blocks:
          - type: paragraph
            body: >-
              Antares Nuclear is best characterized as a young, private advanced-nuclear microreactor company rather
              than as a conventional utility or software business. The retained public record supports the legal name
              Antares Nuclear, Inc., the Antares brand, Torrance, California as headquarters, and a 2023 founding date.
              Its one-line product is a factory-produced fission microreactor for strategic energy in remote, military,
              space, and underwater use cases. Public coverage describes the R1 platform as transportable, in the 100
              kWe to 1 MWe class, capable of multi-year operation without refueling, and intended for sites where grid
              interconnection is unavailable or strategically fragile. The strongest footprint evidence is Antares Prime
              in Torrance, plus third-party references to Idaho Falls and Aiken offices. Classic cover metrics are
              thinner: revenue, customer count, and exact headcount remain undisclosed and are treated as nulls rather
              than estimated from hiring pages or media adjectives.
