  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: >-
          Customer segmentation is defense-first, with the U.S. government acting as buyer, regulator, host, and market
          maker
        blocks:
          - type: paragraph
            body: >-
              Antares’ visible customer base is not a broad commercial roster; it is a government mission network. The
              strongest public segment is Department of the Air Force installation power, where the Air Force and DIU
              paired Antares with Joint Base San Antonio under ANPI while Radiant and Westinghouse were paired with
              Colorado and Montana bases. A second segment is space and spacecraft power, anchored by AFRL’s $4.2
              million NEPADSO R&D contract and company/media descriptions of Air Force, Space Force, NASA, and DIU
              relationships. A third segment is Army/DOW domestic-base energy resilience through Project Janus and EO
              14299, which create a policy-backed buyer environment for Army-regulated reactors. This segmentation is
              attractive because defense customers value assured power more than commodity electricity prices, but it
              also means buyer, host, regulator, and political sponsor overlap heavily. This matters for customer
              diligence because each visible milestone must be mapped to a different level of proof: eligible supplier,
              selected site partner, R&D awardee, operating vendor, and repeat customer are not interchangeable.
              Treating those stages separately prevents a policy-backed pipeline from being mistaken for deployed
              revenue.
