  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: stretched mark, credible milestone, still not a buy on public evidence'
        blocks:
          - type: paragraph
            body: >-
              Antares should be treated as a trackable but high-risk valuation story rather than a clean buy at the
              latest mark. The public record supports the headline inputs: a $470 million Series C announced on July 27,
              2026, split between $370 million of equity and $100 million of debt, a roughly $1.3 billion post-money
              valuation, and $604 million of total capital raised. That implies an estimated valuation-to-total-raised
              ratio of about 2.1x, which is not extreme for a scarce defense-nuclear platform but is rich for a company
              with no disclosed revenue, no public unit economics, and only zero-power criticality rather than
              electricity production. The recommendation is therefore price-sensitive: a secondary entry materially
              below the Series C could be interesting, while a primary-like entry should wait for Mark-1 electricity,
              ANPI winner economics, and debt/preference disclosure.
