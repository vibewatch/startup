      - number: '7.5'
        title: Financial and organizational risk is the execution amplifier
        blocks:
          - type: paragraph
            body: >-
              The July 2026 Series C materially improves Antares’ odds of reaching the next milestone, but it does not
              eliminate hardware-company financing risk. The company remains private, revenue and pricing are
              undisclosed, burn and runway are not public, and disclosed debt components require attention to covenants,
              repayment timing, and future dilution. Organizationally, the company is young, moving quickly, and
              dependent on a leadership and technical team that must integrate nuclear, aerospace, defense procurement,
              manufacturing, and regulatory disciplines. The official leadership page verifies Jordan Bramble’s CEO role
              but does not verify every third-party founder/leadership claim circulating in secondary sources, including
              Julia DeWahl’s current status. The practical diligence implication is straightforward: monitor Mark-1
              power production, HALEU delivery, ANPI downselects, NRC engagement, and cash runway as linked risks. Any
              one can slip without killing the thesis; two or three together would change the investment case.
