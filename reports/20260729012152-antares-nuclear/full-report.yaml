        title: Milestones, government programs, and technical readiness boundaries
        blocks:
          - type: paragraph
            body: >-
              The dated record shows rapid milestone accumulation, but each milestone should be underwritten at the
              right level. The sequence runs from 2023 formation, through Series A and Series B financing, 2025 Antares
              Prime and NSDA progress, January 2026 PDSA approval and graphite-core machining, April 2026 ANPI/JBSA
