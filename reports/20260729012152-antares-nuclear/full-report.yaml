              The next diligence package should focus on whether the Series C price is a defensible bridge to an IPO,
              strategic sale, or defense-backed project-finance platform. Public comps show that the market will fund
              advanced nuclear scarcity, but public-market liquidity can also reprice sharply when milestones slip or
              costs disappoint. Antares therefore needs to show a clean Mark-1 power result, customer-specific
              deployment economics, binding order values, cap-table and preference terms, debt covenants, HALEU delivery
              timing, and credible production-cost curves. The strongest exit path is likely an IPO after an operating
              defense reactor or a strategic financing by a data-center, aerospace, defense, or nuclear incumbent. Until
              then, the investment committee should preserve optionality, avoid paying primary-round enthusiasm in an
              illiquid secondary, and treat undisclosed revenue, margin, orderbook value, and preferences as material
