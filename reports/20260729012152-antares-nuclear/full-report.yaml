            body: >-
              Fuel supply is both a differentiator and a constraint. The near-term story is credible because BWXT
              fabricated TRISO compacts in Lynchburg using DOE-allocated HALEU, and the fuel basis leverages Project
              Pele / Advanced Gas Reactor heritage rather than a wholly novel fuel form. That helped Antares focus
              Mark-0 on control systems and reactor physics. The longer-term story is less settled. Government-held
              material can bridge demonstrations, but repeat factory output requires reliable HALEU supply. Urenco’s
              2026 multi-year agreement gives Antares a credible commercial enrichment path, yet the Capenhurst Advanced
              Fuels Facility timing around 2031 creates a mismatch with 2028 deployment ambitions. Manufacturing adds a
              second dependency. Antares Prime, in-house graphite machining, hardware-in-the-loop digital twins, and a
              stated up-to-10-units-per-year Torrance production model all support the factory-sealed thesis, but public
