      - number: '1.3'
        title: Capital formation, investors, and public/private funding mix
        blocks:
          - type: paragraph
            body: >-
              Antares' capital history now looks like a late-stage hard-tech financing stack built before commercial
              deployment, not a revenue-backed growth story. The canonical public sequence is a $30 million Series A in
              2024, a $96 million Series B in December 2025 split between $71 million of equity and $25 million of debt,
