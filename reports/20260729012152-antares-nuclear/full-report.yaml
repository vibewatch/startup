      - number: '3.3'
        title: Capability, pricing, and regulatory posture
        blocks:
          - type: paragraph
            body: >-
              The feature comparison shows why Antares cannot be scored on power output alone. R1 sits in the 100 kWe to
              1 MWe band, below Last Energy’s 20 MWe, NuScale’s module scale, and X-energy’s 80 MWe Xe-100. Its passive
              sodium heat-pipe architecture is closer to Westinghouse’s heat-pipe story than to Radiant or X-energy
              helium gas, Kairos molten salt, TerraPower sodium fast-reactor storage, or NuScale light water. That
              creates a clear packaging thesis, but not transparent economics. Public pages and coverage disclose power
              ranges, fuels, coolants, and milestones; they do not disclose comparable turnkey prices, fuel-service
              terms, O&M scope, discounting, or realized base/customer contract economics. Regulatory posture is
              similarly bifurcated: Antares benefits from DOE/DOD pathways for defense demonstrations, while broader
              civilian deployments would still need to confront licensing and acceptance hurdles.
