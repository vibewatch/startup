  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and comparison set
        blocks:
          - type: paragraph
            body: >-
              Antares should be sized against the advanced nuclear microreactor market for resilient, transportable,
              mission-critical power, not against all nuclear generation. The broad SMR category is useful as an outer
              TAM because it captures investor and policy appetite for factory-built nuclear systems, but Antares’ R1 is
              smaller and positioned around defense bases, remote or off-grid loads, critical infrastructure,
              data-center adjacency, space, and industrial users that need secure baseload power without grid
              dependence. Included spend should cover reactor units, site integration, fuel, operations, and services
              that displace vulnerable fuel logistics or weak grid connections. Excluded spend should be large-reactor
              capex, ordinary grid generation, and renewable or storage projects whose buyer does not need nuclear-grade
              resilience. The relevant substitutes are diesel, gas turbines, grid upgrades, conventional nuclear
              uprates, renewables plus storage, and non-nuclear long-duration storage.
            claimRefs:
