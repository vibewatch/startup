              reports CDR, NSDA, PDSA submission, Antares Prime, first EDU testing, HALEU allocation, and fuel
              fabrication in 2025. The June 4, 2026 Mark-0 criticality is a real technical milestone because it
              exercised reactor physics and reactivity-control behavior under DOE authorization at INL. However, INL
