            body: >-
              The retained evidence supports a credible Antares wedge, but not a settled moat. Strengths are real: a
              defense-first product definition, a fast Mark-0 criticality milestone, large private financing, and
              alignment with DOD/DOE pathways. Vulnerabilities are equally material. Mark-0 was zero-power only; Antares
              is a young 2023 company; HALEU/TRISO supply depends on external counterparties; and the first
              electricity-producing step remains ahead. Adverse cost evidence also matters: SMRs and microreactors still
              face uncertain cost curves, and manufacturing benefits may take years to prove. Better-capitalized
              incumbents or public comparables can survive delays more easily. The right 2026 conclusion is that Antares
              has earned a top-tier position in defense microreactors, but its competitive durability depends on Mark-1
