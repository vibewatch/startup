        title: What the $1.3B mark is really underwriting
        blocks:
          - type: paragraph
            body: >-
              The current valuation is underwriting milestone scarcity more than conventional financial performance.
              Antares is pre-revenue in public sources, so a DCF or revenue multiple would create false precision; the
              defensible approach is a scenario frame around technical milestones, customer authorization, and capital
              intensity. The positive bridge begins with the Mark-0 criticality result, continues through a planned
              Mark-1 electricity-producing reactor in 2027, and depends on initial defense deployments in 2028. It also
              prices optionality around space nuclear electric propulsion and eventual data-center or commercial
              microgrid demand, even though the near-term wedge is the more price-insensitive U.S. military. The
              negative bridge is just as important: $100 million of debt is already in the Series C stack, HALEU supply
              remains a gating item, and Lazard/critical sources warn that SMRs are not yet cost-competitive versus most
              new power alternatives.
