  - id: TV007
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - Mark-1 slip
        - No electricity-producing Mark-1 result in 2027 or material safety-authority reset
        - Undercuts the milestone bridge from criticality to deployment.
        - Move from track to avoid unless entry price resets materially.
      - - ANPI loss or delay
        - Antares loses finalist momentum or deployment timing moves materially past 2028-2030
        - Weakens the guaranteed-market narrative.
        - Require commercial customer evidence before underwriting upside.
      - - HALEU bottleneck
        - Fuel delivery cannot support first deployments or 10-unit/year ambition
        - Factory model cannot scale without fuel.
        - Discount valuation and require fuel delivery proof.
      - - Cost evidence disappoints
        - Unit economics imply SMR power remains far above alternatives outside military use
        - Narrows TAM to price-insensitive defense niches.
        - Cap upside at defense niche values.
      - - Financing terms worsen
        - New debt, participating preferences, or down-round protections appear
        - Dilutes common/secondary investors even if operations progress.
        - Avoid unless compensated by deep discount and clean seniority.
    notes: Triggers are designed for IC monitoring; they map observable events to valuation action.
