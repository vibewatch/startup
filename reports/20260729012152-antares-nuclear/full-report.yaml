        title: Commercial and customer risk is masked by strategic urgency
        blocks:
          - type: paragraph
            body: >-
              The customer narrative is strongest where price sensitivity is weakest: U.S. military installations,
              strategic resilience, space, and government-backed pilot programs. That is a rational wedge for a
              microreactor startup, but it is also a concentration risk. ANPI is not a solitary Antares award; public
              Air Force and POWER coverage describe Radiant and Westinghouse in the same competitive pathway. DIU
              eligibility and Project Janus similarly create channels and options, not a disclosed backlog with price,
              margin, cancellation terms, or deployment economics. Independent market evidence adds a second pressure
              point: Lazard’s 2026 SMR cost estimate and IEEFA’s adverse SMR work imply that civilian customers may not
              adopt quickly unless reliability, delivered cost, financing, and regulatory execution improve
              dramatically. The resulting risk is not absence of demand; it is a demand mix that may be narrow,
              political, and expensive to serve until Antares proves repeatable delivered power.
