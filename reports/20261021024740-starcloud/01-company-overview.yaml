slug: starcloud
runDate: "2026-10-21"
company:
  name: Starcloud
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Starcloud is a Redmond-based orbital-compute startup founded in 2024 that has
    progressed from a November 2025 H100 demonstration satellite to a planned
    commercial Starcloud-2 mission. Its August 2026 financing extension raised
    $250 million at a reported $2.3 billion valuation, while revenue, customer
    count, governance, and financing terms remain undisclosed.
sections:
  - id: identity-and-operating-snapshot
    title: Identity and operating snapshot
    body: >-
      Starcloud designs satellites intended to provide GPU compute, persistent
      storage, and orbital data-center services. The company is headquartered in
      Redmond, Washington, and an independent trade publication dates its founding
      to 2024. The operating sequence is tangible but early: Starcloud-1 put an
      NVIDIA H100 in orbit in November 2025, while Starcloud-2 is described as the
      first commercial mission and is planned to be operational in 2027. Public
      disclosure does not yet support current revenue, ARR, customer count, or
      contract-value metrics. Tech Insider reported no disclosed commercial
      revenue as of April 2026, but that dated observation is not evidence of
      Starcloud's October 2026 revenue position.
    claimRefs: [CO001, CO002, CO012, CO014, CO016]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, founder fit, and governance
    body: >-
      The disclosed founding team combines commercial strategy, spacecraft
      engineering, and large-scale software infrastructure. Philip Johnston is
      co-founder and CEO, with prior satellite-project work and finance and policy
      training; Ezra Feilden is co-founder and CTO, with deployable-space-structure
      experience; and Adi Oltean is co-founder and chief engineer, with prior
      Starlink-related and production GPU-cluster work. This is strong founder-
      market fit for the stated mission, but it also concentrates external
      financing, spacecraft architecture, and systems execution in three named
      founders. The assigned evidence does not disclose a complete executive bench,
      board composition, succession plan, ownership, or founder voting control, so
      governance resilience cannot yet be assessed.
    claimRefs: [CO003, CO004, CO005]
    tableRefs: [TO002]
  - id: capital-and-stakeholders
    title: Capital formation and stakeholder structure
    body: >-
      Starcloud's financing repriced rapidly during 2026. Multiple publications
      reported a $170 million Series A at a $1.1 billion valuation in March, with
      more than $200 million raised at that point. TechCrunch then reported a
      $250 million extension in August that valued the company at $2.3 billion.
      The extension was led by Manhattan West Ventures and included NVIDIA and
      Cisco, while earlier disclosed investors included Benchmark, EQT Ventures,
      NFX, 776 Ventures, Y Combinator, and others. These amounts are funding raised,
      not cash available or runway. The public record reviewed here does not
      disclose tranche terms, liquidation preferences, debt, secondaries, current
      cash, burn, or pro forma ownership.
    claimRefs: [CO006, CO007, CO008, CO009]
    tableRefs: [TO003]
  - id: milestones-and-execution-dependencies
    title: Milestones and execution dependencies
    body: >-
      Starcloud has crossed a meaningful technical threshold: its first satellite
      launched in November 2025 with an NVIDIA H100, then ran a version of Gemini
      and trained a nanoGPT model in December. The next step is materially harder.
      Starcloud-2 is intended to serve commercial and government workloads with a
      GPU cluster, storage, and continuous access, while the company is expanding
      into a 100,000-square-foot Woodinville facility and reported 25 employees in
      August 2026. At constellation scale, TechCrunch and Via Satellite report an
      FCC request covering up to 88,000 spacecraft. The funding milestone therefore
      precedes proof of repeatable manufacturing, launch access, regulatory
      authorization, customer economics, and reliable commercial operations.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
