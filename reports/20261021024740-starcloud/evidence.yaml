evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: Current audited revenue, ARR, customer count, contract value, renewal, concentration, burn, cash, and runway.
    whyItMatters: >-
      These metrics are required to compare the $2.3 billion reported valuation with commercial traction and financing
      durability.
    diligencePath: >-
      Request monthly management accounts, bank statements, signed contract schedules, backlog reconciliation, and a
      customer-cohort export.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-founder-table
    missingEvidence: >-
      Complete executive roster, reporting lines, succession coverage, recent departures, and senior technical and
      commercial bench.
    whyItMatters: >-
      The public team disclosure concentrates critical functions in three founders and does not establish organizational
      redundancy.
    diligencePath: >-
      Obtain the current organization chart, leadership biographies, hiring plan, regretted-attrition log, and
      succession plan.
    relatedQuestionRefs:
      - QO002
      - QO010
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: governance-and-investor-map
    missingEvidence: >-
      Board composition, voting control, cap table, liquidation preferences, debt, secondaries, protective provisions,
      and investor information rights.
    whyItMatters: Named investors do not reveal decision rights, dilution, downside allocation, or future-financing constraints.
    diligencePath: >-
      Review the fully diluted cap table, charter, voting agreement, investor-rights agreement, debt schedule, and all
      financing side letters.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An original independent market model with category definition, geography, forecast period, assumptions, and
      revenue basis.
    whyItMatters: Without a reproducible model, the reported 2030–2035 ranges cannot support a valuation-grade TAM, SAM, or SOM.
    diligencePath: >-
      Obtain the original Introl forecast and at least one independent industry or government dataset, then reconcile
      category and geography.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-adoption
    missingEvidence: Customer names by segment, contract values, workload volumes, renewal terms, and paid-versus-pilot status.
    whyItMatters: >-
      Public product positioning does not establish willingness to pay, budget ownership, repeat demand, or achievable
      market share.
    diligencePath: >-
      Review redacted contracts and invoices, interview reference customers, and reconcile bookings with capacity and
      launch schedules.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Delivered cost per usable compute unit including launch, insurance, communications, thermal systems, replacement,
      and downtime.
    whyItMatters: >-
      The serviceable market and adoption timing depend on total delivered economics rather than solar-energy cost
      alone.
    diligencePath: >-
      Build a milestone-linked cost model from launch contracts, spacecraft bills of materials, telemetry, and customer
      pricing.
    relatedQuestionRefs:
      - QM005
      - QM007
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure
    missingEvidence: >-
      Comparable list and realized pricing, contract units, reserved-capacity terms, service levels, discounts, renewal
      provisions, and partner economics.
    whyItMatters: >-
      Without normalized commercial terms, diligence cannot test whether orbital differentiation offsets switching cost
      or whether distribution partners capture the economics.
    diligencePath: >-
      Request redacted customer contracts, the Starcloud-2 rate card, partner revenue-share schedules, pipeline by
      workload, and terrestrial total-cost comparisons.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: enterprise-trust
    missingEvidence: >-
      Independent security, regulatory, data-residency, insurance, reliability, and enterprise-control evidence for
      Starcloud and named alternatives.
    whyItMatters: >-
      Trust and regulatory posture may determine procurement in sovereign, defense, and enterprise workloads before raw
      compute economics converge.
    diligencePath: >-
      Obtain security architecture, third-party audits, licenses, insurance terms, debris and spectrum filings, uptime
      targets, and buyer security-review outcomes.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: pricing disclosure
    missingEvidence: >-
      List and realized prices, billing units, contract duration, minimum commitments, discounts, and
      revenue-recognition terms.
    whyItMatters: >-
      Without contract economics, the analysis cannot distinguish premium commercial demand from experimental or
      partner-supported workloads.
    diligencePath: Request a contract-level pricing schedule and anonymized invoices or executed statements of work for each service.
    relatedQuestionRefs:
      - QI002
      - QI004
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: sales efficiency
    missingEvidence: Pipeline conversion, sales-cycle duration, CAC, payback, channel fees, and renewal evidence.
    whyItMatters: >-
      The scalability and financing burden of the go-to-market motion cannot be assessed without acquisition and
      retention economics.
    diligencePath: Review CRM exports, cohort bookings, channel agreements, and customer-level acquisition costs.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: >-
      Fully loaded cost per compute unit, utilization, gross margin, replacement rate, launch and insurance cost, and
      contribution margin.
    whyItMatters: A power-cost target alone cannot establish attractive gross margins or returns on capital.
    diligencePath: >-
      Obtain the mission-level cost model and reconcile it to actual supplier, launch, insurance, network, and
      operations contracts.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital adequacy
    missingEvidence: >-
      Cash balance, monthly burn, committed capex, debt or project-finance obligations, runway, and the next financing
      trigger.
    whyItMatters: Capital raised does not reveal liquidity or dilution risk for a manufacturing- and launch-intensive plan.
    diligencePath: >-
      Review bank statements, monthly management accounts, capex commitments, debt documents, and the board-approved
      financing plan.
    relatedQuestionRefs:
      - QI006
      - QI007
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue disclosure
    missingEvidence: >-
      Recognized revenue, ARR if applicable, bookings, backlog, paid utilization, customer count, and concentration by
      product.
    whyItMatters: Public product and partner evidence does not establish revenue quality or the scale of commercial traction.
    diligencePath: >-
      Reconcile customer contracts and invoices to audited or management financial statements and a customer
      concentration schedule.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: >-
      Mission telemetry, radiation-event logs, thermal margins, fault-recovery results, and sustained workload records
      for Starcloud-1 and qualification evidence for Starcloud-2.
    whyItMatters: >-
      Without measured reliability evidence, a successful demonstration cannot establish repeatable commercial
      availability or hardware life.
    diligencePath: >-
      Review raw mission telemetry, component qualification reports, environmental test results, incident logs, and the
      acceptance criteria for Starcloud-2.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: security-compliance
    missingEvidence: >-
      Security architecture, encryption and key-management design, tenant-isolation controls, privacy governance, audit
      reports, and applicable certifications.
    whyItMatters: >-
      Sovereign storage and critical-data positioning requires verifiable controls and jurisdictional analysis rather
      than physical-location claims alone.
    diligencePath: >-
      Obtain the security white paper, threat model, penetration-test results, control mappings, data-flow diagrams, and
      customer contractual requirements.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: integration-roadmap
    missingEvidence: >-
      Partner-issued confirmation and test evidence for AWS Outposts and laser interoperability with named satellite
      constellations.
    whyItMatters: >-
      The commercial workflow depends on network and cloud integrations that are currently supported only by company or
      secondary descriptions.
    diligencePath: >-
      Request signed partner statements, interface-control documents, integration schedules, and end-to-end link-test
      results.
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      A public engineering repository, package, API documentation set, technical forum, or higher-quality practitioner
      community discussing Starcloud implementations.
    whyItMatters: >-
      The retained practitioner source surfaces risks but does not provide a credible developer adoption or
      implementation signal.
    diligencePath: >-
      Ask Starcloud for API documentation and integration forums, then interview named satellite engineers or customers
      who have tested the platform.
  - type: private-evidence-only
    severity: material
    topic: retention-concentration-gap
    missingEvidence: >-
      Customer-level revenue, contract start and end dates, renewals, churn, expansion, backlog, and top-customer
      concentration by segment.
    whyItMatters: >-
      Without cohort and contract data, durability, expansion, and dependency on a small number of counterparties cannot
      be underwritten.
    diligencePath: >-
      Obtain the customer ledger, signed contracts, invoices, backlog schedule, and quarterly cohort bridge directly
      from management and reconcile them to bank statements and the general ledger.
    relatedQuestionRefs:
      - QU004
      - QU005
  - type: enumeration-incomplete
    severity: material
    topic: named-relationships
    missingEvidence: >-
      Primary confirmation of each named organization's role, commercial terms, workload scope, production status, and
      payment obligations.
    whyItMatters: >-
      Partner engineering activity can validate technology without establishing a customer, recognized revenue, or
      repeatable demand.
    diligencePath: >-
      Request executed agreements and obtain reference calls with procurement owners at NVIDIA, AWS, Google Cloud, and
      Crusoe.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: customer-outcomes
    missingEvidence: >-
      Independent customer proof showing a production workload, utilization, service level, measurable outcome, and
      renewal decision.
    whyItMatters: The current record establishes technical demonstrations and planned integrations, not repeatable customer value.
    diligencePath: >-
      Secure at least two named customer references and validate workload logs, invoices, outcome baselines, and
      post-mission renewal intent.
    relatedQuestionRefs:
      - QU002
      - QU003
      - QU008
  - type: missing-source
    severity: material
    topic: regulatory scale
    missingEvidence: >-
      Primary FCC filings, license status, spectrum coordination, debris mitigation, insurance, and
      jurisdiction-by-jurisdiction data obligations.
    whyItMatters: The constellation and sovereign-cloud thesis cannot be underwritten from secondary descriptions of an application.
    diligencePath: >-
      Obtain the FCC docket and amendments, counsel's licensing matrix, ITU coordination record, debris plan, and
      approval milestone schedule.
    relatedQuestionRefs:
      - QR003
      - QR006
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: reliability disclosure
    missingEvidence: >-
      Independent telemetry covering thermal margins, radiation errors, uptime, recovery events, component
      qualification, and workload performance.
    whyItMatters: >-
      A single demonstration does not establish availability or maintainability at commercial power and mission
      duration.
    diligencePath: >-
      Commission a technical data-room review of Starcloud-1 telemetry and Starcloud-2 qualification, acceptance, and
      failure-recovery evidence.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: financial model risk
    missingEvidence: >-
      Cash balance, monthly burn, restricted cash, launch deposits, committed capex, milestone payments, and downside
      runway.
    whyItMatters: Funding raised does not establish liquidity available to reach the next technical or commercial milestone.
    diligencePath: >-
      Reconcile bank statements and the cap table to a monthly cash bridge and milestone-based financing plan through
      Starcloud-2 operations.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: security assurance
    missingEvidence: >-
      Security architecture, encryption and key-custody design, access controls, audit evidence, DPA terms,
