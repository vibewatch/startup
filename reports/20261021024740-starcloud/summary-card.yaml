  topStrengths:
    - >-
      Starcloud-1 placed an NVIDIA H100 in orbit and ran reported AI workloads, moving the company beyond a paper
      concept.
    - >-
      The company has raised substantial capital and attracted strategic participation from infrastructure partners and
      investors.
    - >-
      Starcloud-2 defines a concrete commercial product spanning orbital processing, persistent storage, and sovereign
      compute.
  topRisks:
    - >-
      Paying customers, current revenue, pricing, retention, utilization, and customer concentration are not publicly
      established.
    - >-
      Commercial scale depends on unproven thermal and reliability performance, lower launch costs, launch-provider
      availability, and regulatory approval.
    - >-
      The $2.3 billion post-money mark rose rapidly without disclosed scaled economics, while cash, burn, ownership, and
      preference terms remain private.
  unresolvedGaps:
    - Customer contracts, invoices, workload utilization, outcomes, renewals, backlog, and concentration by segment.
    - >-
      Independently reviewable mission telemetry covering uptime, thermal margins, radiation errors, recovery behavior,
      and workload performance.
    - Primary FCC records, spectrum and debris plans, approval status, and the jurisdictional data-governance path.
    - >-
      Current revenue, pricing, gross margin, launch and insurance costs, cash, burn, committed capital expenditure, and
      runway.
    - Fully diluted cap table, liquidation preferences, debt, board rights, and future financing requirements.
    - >-
      Security architecture, certifications, key custody, audit evidence, and incident-response readiness for sovereign
      workloads.
