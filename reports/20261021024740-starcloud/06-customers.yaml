schemaVersion: "report-v2"
artifact: customers
slug: starcloud
runDate: 2026-10-21
company:
  name: Starcloud
chapter:
  number: 6
  title: Customers
  summary: >-
    Starcloud has credible evidence of a technical ecosystem and a defined set of
    prospective user segments, but the assigned public evidence does not establish
    a paying customer base. The strongest current proof is Starcloud-1's orbital
    demonstration, NVIDIA's partner support, and a single secondary report naming
    planned Starcloud-2 collaborators; customer count, contracts, outcomes,
    retention, and concentration remain undisclosed.
sections:
  - id: customer-segments
    title: Buyer map is plausible, but remains prospective
    body: >-
      Starcloud's public positioning separates two prospective demand pools. For
      in-space users, Starcloud-2 is presented as an on-orbit processing platform
      for spacecraft and space-station data, particularly Earth-observation
      workloads that would otherwise require large downlinks. For terrestrial
      users, the company pitches sovereign compute, resilient storage, and backup
      independent of terrestrial infrastructure. These propositions imply
      different buyers, procurement paths, and willingness to pay: satellite
      operators value latency and bandwidth avoidance, while governments and
      enterprises would buy resilience or sovereignty. NVIDIA is better classified
      as a technology partner and investor than as customer proof. The public
      sources contain no segment-level customer count, contracted capacity,
      pricing, or revenue contribution, so market fit by segment is still a
      diligence hypothesis rather than an observed commercial result.
    claimRefs: [CU001, CU002, CU003, CU007, CU008, CU013]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-named-proof
    title: Technical adoption precedes commercial proof
    body: >-
      The adoption sequence has advanced from a demonstration asset toward a
      planned commercial platform. Starcloud says Starcloud-1 launched in November
      2025 with an H100 and subsequently ran models in orbit; NVIDIA independently
      described the mission hardware and its Inception support, while GeekWire
      later reported the NanoGPT milestone. Starcloud calls Starcloud-2 its first
      commercial mission and says it will provide a GPU cluster, persistent
      storage, and continuous access by 2027. However, the only assigned source
      naming AWS, Google Cloud, NVIDIA, and Crusoe as Starcloud-2 workload
      participants is Tech Insider. That is useful lead evidence, not sufficient
      proof of signed contracts, payment, production deployment, or measurable
      customer outcomes. The launch and on-orbit operating milestones therefore
      validate product readiness before they validate repeatable demand.
    claimRefs: [CU004, CU005, CU006, CU010, CU011, CU012]
    tableRefs: [TU002, TU003]
  - id: durability-and-concentration
    title: Durability and concentration cannot yet be measured
    body: >-
      No retained source reports gross or net revenue retention, churn, renewal
      rates, contract duration, cohort behavior, customer satisfaction, backlog,
      top-customer share, or channel concentration. The reviewed official pages
      mostly invite suppliers and customers to make contact, which is evidence of
      active market development but not of closed demand. Tech Insider reported no
      disclosed commercial revenue as of April 2026 and identified launch or
      on-orbit failure as the largest near-term risk; its separate claim that
      Starcloud-2 was effectively sold out lacks contract-level corroboration in
      the assigned pool. Until management supplies a customer ledger and contract
      evidence, diligence should treat expansion as unproven and concentration as
      unknown rather than low. The decisive next proof is paid workloads that
      renew after a successful mission, with capacity, revenue, and customer
      dependency disclosed by segment.
    claimRefs: [CU009, CU010, CU013, CU014, CU015]
callouts:
  - calloutType: risk
    title: Partner visibility is not customer validation
    body: >-
      NVIDIA's technical and investment relationship strengthens execution
      credibility, but public evidence does not show that NVIDIA or the other
      named collaborators are paying customers. Require contracts, invoices,
      workload utilization, and renewal terms before underwriting commercial
      traction.
    claimRefs: [CU007, CU008, CU010, CU013, CU014]
tables:
  - id: TU001
    title: Customer segmentation and proof maturity
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Public scale evidence
      - Revenue or strategic value
      - Principal gap
    rows:
      - - In-space data operators
        - Satellite operator buys; mission and analytics teams use
        - Process Earth-observation and spacecraft data before downlink
        - Company describes terabytes of raw data generated daily, without a customer denominator
        - Potentially reduces latency and raw-data transmission
        - No named operator deployment, workload volume, price, or outcome
      - - Sovereign and resilient compute
        - Government or enterprise buyer; security and IT teams use
        - Independent storage, backup, and premium sovereign cloud compute
        - Product capability claimed for Starcloud-2; no customer count
        - Strategic resilience could support premium pricing
        - No procurement record, certification, contract, or paid deployment
      - - Cloud and AI infrastructure collaborators
        - Cloud platform or infrastructure R&D organization
        - Test orbital servers, accelerators, and inference workloads
        - One secondary source names AWS, Google Cloud, NVIDIA, and Crusoe
        - Engineering participation can validate integrations
        - Commercial terms and payer status are not corroborated
      - - AI researchers and model developers
        - Research or ML team; payer remains unidentified
        - Train or run AI models in orbit
        - Starcloud-1 demonstrated model execution and NanoGPT training
        - Demonstration lowers technical adoption risk
        - No evidence of a paid third-party workload
      - - NVIDIA ecosystem relationship
        - NVIDIA acts as supplier, investor, and technical partner
        - GPU flight validation and access to NVIDIA expertise
        - H100 flew on Starcloud-1; future satellites are planned around Space-1
        - Improves hardware access and technical credibility
        - Relationship is not evidence of customer revenue
    notes: >-
      Segments are derived from Starcloud and partner descriptions as of 2026-10-21;
      public scale statements are company claims, and null commercial metrics are
      not treated as zero.
    claimRefs: [CU001, CU002, CU003, CU005, CU006, CU007, CU008, CU010, CU013]
  - id: TU002
    title: Customer-relevant adoption trajectory
    columns:
      - Metric or milestone
      - Value
      - Date or period
      - Source attribution
      - Confidence
      - Implication
      - Missing denominator or qualification
    rows:
      - - Data-center GPU flown
        - One NVIDIA H100 on Starcloud-1
        - November 2025
        - Starcloud, NVIDIA, and GeekWire
        - Medium
        - Establishes technical demonstration credibility
        - Does not measure users, paid workloads, or repeat use
      - - In-orbit model milestone
        - NanoGPT training and other model execution reported
        - December 2025 milestone
        - Starcloud and GeekWire
        - Medium
        - Demonstrates that a workload can run on the orbital asset
        - No external customer, workload duration, utilization, or outcome
      - - Commercial platform availability
        - Starcloud-2 described as fully operational in sun-synchronous orbit
        - By 2027, company target
        - Starcloud
        - Low
        - Defines the earliest public production-service milestone
        - Forward-looking; launch success, capacity, and service levels are unknown
      - - Named Starcloud-2 collaborators
        - "Four organizations reported: AWS, Google Cloud, NVIDIA, and Crusoe"
        - April 2026 report
        - Tech Insider
        - Low
        - Suggests integration interest around the commercial mission
        - Single-source report; payer status, contracts, and workload scope are unverified
    notes: >-
      Milestones mix completed demonstrations and forward-looking company targets;
      they are not a comparable customer funnel and do not establish conversion or
      revenue.
    claimRefs: [CU004, CU005, CU006, CU010, CU012]
  - id: TU003
    title: Named customer proof table
    columns:
      - Organization
      - Segment
      - Reported deployment or use case
      - Proof stage
      - Reported outcome
      - Limitation
    rows:
      - - NVIDIA
        - Technology supplier and investor
        - H100 on Starcloud-1 and future Space-1 module collaboration
        - Demonstrated technical partnership
        - H100 operated in orbit and supported model training
        - No evidence that NVIDIA is a paying customer
      - - AWS
        - Cloud infrastructure collaborator
        - Server blade or software workload reportedly planned for Starcloud-2
        - Reported pre-launch integration
        - None publicly measured
        - Named only by one retained secondary source; contract and payment unverified
      - - Google Cloud
        - Cloud infrastructure collaborator
        - Workloads reportedly planned for Starcloud-2
        - Reported pre-launch integration
        - None publicly measured
        - Named only by one retained secondary source; contract and payment unverified
      - - Crusoe
        - AI cloud collaborator
        - Edge-inference workload reportedly planned for Starcloud-2
        - Reported pre-launch integration
        - None publicly measured
        - Named only by one retained secondary source; contract and payment unverified
    notes: >-
      Partial enumeration limited to organizations named in the assigned fetched
      sources; "collaborator" does not mean customer, production deployment, or
      recognized revenue.
    enumerationScope:
      coverage: partial
      basis: >-
        Organizations publicly named in the assigned fetched source set through
        2026-10-21, excluding unnamed pipeline prospects.
    claimRefs: [CU005, CU006, CU007, CU008, CU010]
figures:
  - id: FU001
    title: Evidence-based path from use-case interest to durable revenue
    type: journey-map
    summary: >-
      Starcloud has crossed technical demonstration milestones, while paid
      production use, renewal, and expansion remain unverified stages.
    data:
      nodes:
        - id: need-trigger
          label: Workload need
          detail: In-space processing, sovereign compute, resilience, or backup
          touchpoints:
            - Starcloud-2 use-case pages
        - id: technical-evaluation
          label: Technical evaluation
          detail: Assess GPU cluster, persistent storage, thermal design, and continuous access
          touchpoints:
            - Product review
            - Integration planning
        - id: demonstration
          label: Orbital demonstration
          detail: Starcloud-1 flew an H100 and ran AI workloads in orbit
          touchpoints:
            - Starcloud-1
            - NVIDIA support
        - id: partner-integration
          label: Partner integration
          detail: Secondary reporting names four organizations around Starcloud-2
          touchpoints:
            - Hardware integration
            - Workload preparation
        - id: production-use
          label: Paid production use
          detail: No contract, utilization, service-level, or outcome evidence is public
          touchpoints:
            - Contract diligence required
        - id: renewal-expansion
          label: Renewal and expansion
          detail: No retention, renewal, cohort, or concentration metrics are public
          touchpoints:
            - Customer ledger required
            - Cohort analysis required
    approximationNotes: >-
      Stage order is analytical and does not imply conversion rates, elapsed time,
      or a shared customer population.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU010, CU014]
