    - type: private-evidence-only
      severity: material
      topic: retention-concentration-gap
      missingEvidence: >-
        Customer-level revenue, contract start and end dates, renewals, churn,
        expansion, backlog, and top-customer concentration by segment.
      whyItMatters: >-
        Without cohort and contract data, durability, expansion, and dependency on
        a small number of counterparties cannot be underwritten.
      diligencePath: >-
        Obtain the customer ledger, signed contracts, invoices, backlog schedule,
        and quarterly cohort bridge directly from management and reconcile them to
        bank statements and the general ledger.
      relatedQuestionRefs: [QU004, QU005]
    - type: enumeration-incomplete
      severity: material
      topic: named-relationships
      missingEvidence: >-
        Primary confirmation of each named organization's role, commercial terms,
        workload scope, production status, and payment obligations.
      whyItMatters: >-
        Partner engineering activity can validate technology without establishing
