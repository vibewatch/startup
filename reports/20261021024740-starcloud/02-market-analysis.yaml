figures:
  - id: FM001
    title: Orbital-compute market evidence pyramid
    type: pyramid
    summary: "The evidence narrows from broad scenarios to the smaller set of demonstrated or near-term commercial capabilities."
    data:
      nodes:
        - label: "Broad aggressive scenario"
          value: "$50–100B by 2035"
          detail: "Secondary scenario assuming lower launch cost and hyperscaler migration; methodology not disclosed."
        - label: "Attributed market forecast"
          value: "$39.09B by 2035"
          detail: "Tech Insider attribution to Introl, from $1.77B in 2029 at 67.4% CAGR; original forecast unavailable."
        - label: "Specialty-market scenario"
          value: "$3–5B by 2030"
          detail: "Secondary range for edge-inference and defense use cases without an underlying model."
        - label: "Planned commercial demonstrator"
          value: "Starcloud-2 in 2027"
          detail: "Company plans GPU compute, persistent storage, and 24/7 access in sun-synchronous orbit."
        - label: "Current product proof"
          value: "1 H100 mission"
          detail: "Starcloud-1 launched in November 2025 and ran AI workloads in orbit."
        - label: "Verified serviceable market"
          value: "Not yet quantified"
          detail: "Pricing, contracted capacity, renewal, uptime, and delivered-cost evidence remain unavailable."
    approximationNotes: "The levels are ordered by breadth of claim, not to scale; forecast values are not comparable with mission counts."
    claimRefs: [CM001, CM003, CM012, CM014, CM015]
callouts:
  - calloutType: recommendation
    title: Underwrite milestones, not the headline TAM
    body: >-
      Use paid repeat workloads, thermal and uptime telemetry, launch commitments,
      pricing, and delivered cost per usable compute unit as valuation gates before
      assigning material probability to broad 2030–2035 market scenarios.
    claimRefs: [CM008, CM009, CM013, CM014]
