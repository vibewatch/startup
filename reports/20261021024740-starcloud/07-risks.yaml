    claimRefs: [CR001, CR002, CR003, CR008, CR010, CR012, CR013, CR014, CR015, CR016]
callouts:
  - calloutType: "risk"
    title: "Primary kill criterion"
    body: >-
      A failed Starcloud-2 mission, inability to demonstrate sustained thermal and workload reliability,
      or launch economics remaining materially above the modeled threshold would break the near-term scale thesis.
    claimRefs: [CR001, CR002, CR006, CR007, CR012, CR015, CR016]
  - calloutType: "recommendation"
    title: "Diligence gate before underwriting scale"
    body: >-
      Require primary licensing records, independently reviewable mission telemetry, security-control evidence,
      launch commitments, and a cash-to-milestone plan before crediting constellation-scale economics.
    claimRefs: [CR008, CR013, CR014, CR015, CR016]
