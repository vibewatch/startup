company:
  name: "Starcloud"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    Starcloud has demonstrated orbital GPU operation, but its investment case remains exposed to
    launch-cost compression, thermal and reliability scaling, regulatory approval scope, concentrated
    infrastructure dependencies, and undisclosed runway. The highest-consequence risks are not disproved
    by the successful Starcloud-1 demonstration because commercial-scale operations and economics remain
    tied to future missions, launch systems, and approvals.
sections:
  - id: "operational-and-technical-exposure"
    title: "Operational and technical exposure"
    body: >-
      The first mission materially reduces feasibility risk but does not establish production reliability.
      Starcloud and CNBC report that Starcloud-1 carried an NVIDIA H100 and ran inference and training
      workloads in orbit, while Data Center Frontier describes the mission as a test of operation through
      vacuum, radiation, and thermal cycling. Commercial scale adds a different risk envelope. Control
      Plane estimates that rejecting one megawatt of waste heat would require roughly 1,200 square meters
      of radiator area, and CNBC cites analyst concerns about radiation, maintenance, debris, data
      governance, and space traffic. Starcloud-2 is still presented by the company as a future commercial
      mission with a GPU cluster, storage, and proprietary thermal and power systems. The residual
      exposure is therefore high until independently reviewed telemetry shows sustained thermal margins,
      error rates, uptime, recovery behavior, and workload performance rather than a successful
      demonstration alone.
    claimRefs: [CR002, CR003, CR004, CR005, CR006, CR007, CR015, CR016]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: "regulatory-and-legal-exposure"
    title: "Regulatory and legal exposure"
    body: >-
      The public evidence establishes regulatory ambition, not regulatory clearance. Wikipedia and
      GeekWire report an FCC application covering as many as 88,000 orbital data-center satellites, but
      the assigned source set does not include the underlying docket, license conditions, spectrum
      coordination record, debris plan, or approval status. CNBC separately reports data-governance and
      space-traffic concerns identified by Morgan Stanley analysts. A historical legal challenge also
      matters as evidence of execution friction: Wikipedia reports that the company changed its former
      Lumen Orbit name to Starcloud after a challenge from Lumen Technologies, without disclosing the
      case terms in the retained text. These are not proof of enforcement or denial. They are diligence
      gaps that require primary regulator and legal records before treating constellation scale,
      jurisdictional data claims, or freedom to operate as de-risked.
    claimRefs: [CR003, CR008, CR009, CR014, CR016]
    tableRefs: [TR001]
  - id: "dependencies-financing-and-kill-criteria"
    title: "Dependencies, financing, and thesis-break triggers"
    body: >-
      Launch economics are the clearest external dependency. Control Plane reports that Falcon 9 delivery
      costs about $3,600 per kilogram while Starcloud-3 economics require roughly $500 per kilogram, and
      that frequent commercial Starship service is not yet available. The same source notes a Falcon 9
      fallback for smaller missions, but that fallback does not close the cost gap. Financing provides
      capacity to pursue the roadmap rather than evidence that the roadmap is funded through breakeven:
      March reporting described a $170 million round at a $1.1 billion valuation, while August reporting
      described another $250 million and $450 million total raised at a $2.3 billion post-money valuation.
      None of those figures discloses cash available, burn, committed launch obligations, or runway.
      Thesis-break triggers should therefore include a failed or materially delayed Starcloud-2 mission,
      thermal performance below design needs, inability to secure required approvals, Starship economics
      remaining far above the modeled threshold, or financing that cannot bridge the commercial ramp.
    claimRefs: [CR001, CR007, CR010, CR011, CR012, CR013, CR015, CR016]
    tableRefs: [TR003]
