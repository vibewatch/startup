    notes: >-
      Severity and likelihood are analyst assessments anchored to the cited mission evidence and disclosed
      risk mechanisms; absence of public telemetry, incidents, or control documentation is recorded as an
      evidence gap and is not treated as proof that a failure has or has not occurred.
    claimRefs: [CR002, CR003, CR004, CR005, CR006, CR007, CR014, CR015, CR016]
