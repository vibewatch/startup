      - ["GPU platform and space qualification", "NVIDIA and associated hardware ecosystem", "Core compute hardware for demonstrated and planned missions", "High", "Supply, qualification, or roadmap changes delay commercial payloads", "High", "H100 operation in orbit provides initial technical proof", "Medium to high until multi-GPU reliability is independently measured"]
      - ["External capital and launch commitments", "Existing and future investors and launch providers", "Funds manufacturing, engineering, and future launch procurement", "High", "Cash burn or committed obligations exhaust available capital before commercial scale", "Critical", "Reported 2026 financings expand resources", "High because cash, burn, obligations, and runway remain undisclosed"]
    notes: >-
      Dependency concentration and residual exposure are analytical judgments based on disclosed architecture,
      launch economics, and financing uses; reported funding raised is not treated as cash available or runway.
    claimRefs: [CR001, CR004, CR005, CR010, CR011, CR012, CR013, CR016]
