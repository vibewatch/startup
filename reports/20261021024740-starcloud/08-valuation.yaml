schemaVersion: "report-v2"
artifact: valuation
slug: starcloud
runDate: 2026-10-21
company:
  name: Starcloud
chapter:
  number: 8
  title: Valuation
  summary: >-
    Starcloud's latest disclosed financing set a $2.3 billion post-money valuation after a
    rapid step-up from the March 2026 $1.1 billion mark, but the retained public evidence
    does not establish current commercial revenue, scaled economics, or preference terms.
    The supportable stance is therefore research-more at high risk, with the current price
    treated as expensive until commercial and technical milestones are independently verified.
sections:
  - id: investment-decision
    title: Investment decision and price discipline
    body: >-
      The latest disclosed price is a $2.3 billion post-money valuation from an August 2026
      $250 million Series A extension, compared with the $1.1 billion valuation reported for
      the March financing. That roughly 2.1x mark-up occurred while the strongest retained
      public revenue statement still said no commercial revenue had been disclosed as of
      April. The financing shows investor demand and adds capital raised, but it does not
      establish cash currently available, ARR, or a defensible revenue multiple. The
      recommendation is research-more, confidence is medium, risk is high, and the valuation
      stance is expensive. Entry should wait for independently reviewable operating evidence
      or materially better terms; a generic enthusiasm discount is not an adequate substitute.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV010, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-antithesis
    title: Thesis, anti-thesis, and proof burden
    body: >-
      The investable thesis is that Starcloud has moved beyond a paper concept: Starcloud-1
      carried an NVIDIA H100, and both company and independent reporting describe in-orbit AI
      workload demonstrations. The anti-thesis is that a demonstration satellite is not a
      commercial data center. Starcloud now says Starcloud-2 will be operational in 2027,
      while an independent tracker records a slip from the earlier October 2026 target and
      says the spacecraft is not yet in orbit. The same tracker argues that Starcloud-1's
      actual inclination did not test the near-continuous-solar assumption central to the
      economic pitch. Microsoft leadership's public caution supplies a useful demand-side
      counterweight to company forecasts.
    claimRefs: [CV006, CV007, CV008, CV009, CV011, CV012, CV013, CV014]
    tableRefs: [TV002]
  - id: scenarios-and-method
    title: Scenario method and valuation boundaries
    body: >-
      A milestone method is more appropriate than a revenue multiple because the retained
      evidence does not provide current revenue, margin, contracted backlog, utilization, or
      audited unit economics. The bull case requires Starcloud-2 to reach the stated orbit,
      run paid workloads reliably, and produce evidence that launch, thermal, radiation, and
      communications costs can support attractive gross margins. The base case assumes
      continued technical progress but delayed commercial proof, leaving the current mark
      unsupported by a public operating model. The bear case combines another schedule slip,
      weak paid utilization, or failure of the continuous-solar premise. No probability-weighted
      fair-value range is supportable from this pool; qualitative signals and explicit triggers
      are more honest than false precision.
    claimRefs: [CV005, CV007, CV008, CV009, CV010, CV015, CV016]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness, diligence asks, and thesis-break triggers
    body: >-
      Exit readiness is low because the evidence base shows financing and technical milestones,
      not a repeatable commercial model. Before pricing an investment, diligence should obtain
      the cap table, liquidation preferences, debt and project-finance obligations, current
      cash, monthly burn, customer contracts, backlog, workload utilization, gross-margin
      bridge, launch insurance, and satellite-level telemetry. The principal thesis-break
      triggers are a further Starcloud-2 delay without a credible remediation plan, failure to
      secure the stated orbit, inability to publish reliable thermal and radiation performance,
      or commercial usage that remains promotional rather than paid. A positive re-rating
      requires third-party evidence of paid workloads and economics, not another financing
      announcement alone.
    claimRefs: [CV001, CV002, CV007, CV008, CV009, CV010, CV014, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, Research more, "Technical proof exists, but current commercial evidence is incomplete.", "Do not underwrite a purchase at the disclosed mark without primary diligence."]
      - [Confidence, Medium, "The financing marks and mission claims are documented, while revenue and terms remain private.", "Treat the conclusion as conditional rather than a quantified fair-value opinion."]
      - [Risk rating, High, "Launch timing, orbital assumptions, scaled economics, and commercialization remain unresolved.", "Require milestone-based financing or equivalent downside protection."]
      - [Valuation stance, Expensive, "The August post-money mark is about 2.1x the March valuation without a disclosed current revenue base.", "Wait for operating proof or materially improved entry terms."]
    notes: "Assessments are analytical judgments based on public financing marks and incomplete operating disclosure; funding raised is not treated as cash available."
    claimRefs: [CV001, CV003, CV005, CV008, CV009, CV010, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Lens, Evidence-backed argument, What would change the view]
    rows:
      - [Thesis, "Starcloud-1 placed an H100 in orbit and company materials report AI workloads in space.", "Independent telemetry confirming sustained performance and reliability would strengthen the thesis."]
      - [Thesis, "The latest round included strategic infrastructure investors and increased total capital raised.", "A clear use-of-proceeds bridge to contracted commercial capacity would connect funding to value creation."]
      - [Anti-thesis, "Starcloud-2 is not yet in orbit and its public schedule moved to 2027.", "A successful launch into the required orbit followed by paid operations would reduce execution risk."]
      - [Anti-thesis, "The retained evidence does not disclose current commercial revenue or validate scaled unit economics.", "Audited revenue, utilization, gross margin, and launch-cost sensitivity would permit a model-based valuation."]
    notes: "This is a selective decision framework rather than an exhaustive risk register; each row states the evidence needed to change the investment view."
    claimRefs: [CV001, CV002, CV006, CV007, CV008, CV009, CV010, CV012, CV015]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Assumptions, Valuation and return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Starcloud-2 launches into the required orbit, runs paid workloads reliably, and demonstrates credible scaled economics.", "A premium could become supportable only after contracted revenue and margin evidence enable a model; no public range is presently defensible.", "Thermal performance, launch cost, customer conversion, and follow-on capital.", "Unquantified; requires multiple independent milestone confirmations."]
      - [Base, "Technical progress continues, but commercial proof and Starcloud-3 economics remain delayed or private.", "The $2.3B financing mark remains a transaction reference rather than demonstrated fair value; defer entry.", "Dilution, schedule slippage, preference overhang, and prolonged pre-scale burn.", "Most consistent with the currently retained evidence."]
      - [Bear, "Another material delay, wrong-orbit deployment, weak paid utilization, or failed cost assumptions.", "Downside could fall below the March $1.1B financing reference, but the pool cannot support a precise floor or recovery value.", "Mission loss, capital scarcity, technical failure, and strategic buyers building internally.", "Trigger-based rather than numerically estimated."]
    notes: "Scenario values are deliberately not probability-weighted because current revenue, cash, burn, ownership, preferences, and comparable transaction data are unavailable."
    claimRefs: [CV001, CV003, CV007, CV008, CV009, CV010, CV011, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: "The current financing mark clears only the funding step; technical, commercial, economic, and terms proof remain prerequisites to invest."
    data:
      nodes:
        - id: disclosed-price
          label: "$2.3B post-money financing mark"
          detail: "Observed August 2026 transaction reference, not a public-market valuation model."
        - id: technical-proof
          label: "Demonstration proof"
          detail: "Starcloud-1 carried an H100 and ran reported AI workloads in orbit."
        - id: schedule-proof
          label: "Commercial satellite pending"
          detail: "Starcloud-2 is now described as operational in 2027 and is not yet in orbit."
        - id: commercial-proof
          label: "Revenue proof missing"
          detail: "Current revenue, utilization, backlog, and customer economics are not disclosed in the retained evidence."
        - id: economics-and-terms
          label: "Economics and terms missing"
          detail: "Scaled cost, cash, burn, cap-table, dilution, and preference inputs require diligence."
        - id: recommendation
          label: "Research more; expensive"
          detail: "Invest only after milestone proof or at materially improved risk-adjusted terms."
      edges:
        - from: disclosed-price
          to: technical-proof
        - from: technical-proof
          to: schedule-proof
        - from: schedule-proof
          to: commercial-proof
        - from: commercial-proof
          to: economics-and-terms
        - from: economics-and-terms
          to: recommendation
    approximationNotes: "The flow is a qualitative decision sequence; it does not imply numerical conversion rates or probabilities."
    claimRefs: [CV004, CV005, CV006, CV008, CV010, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Price-sensitive recommendation
    body: >-
      Research more. The company has meaningful technical and financing signals, but the
      $2.3 billion post-money mark is not supported by enough public commercial or unit-economic
      evidence to justify a buy recommendation.
    claimRefs: [CV001, CV005, CV010, CV016]
  - calloutType: risk
    title: Do not confuse capital raised with cash available
    body: >-
      The reported $450 million total capital raised does not disclose current cash, burn,
      restricted capital, debt obligations, or liquidation preferences.
    claimRefs: [CV002, CV016]
