companyProfile:
  summary: >-
    Founded in 2024 and headquartered in Redmond, Starcloud is developing satellite-based data centers for orbital
    processing, persistent storage, and sovereign or resilient cloud workloads. Starcloud-1 demonstrated an NVIDIA H100
    in orbit; Starcloud-2 is presented as the first commercial mission, with an operational target in 2027.
  founders:
    - name: Philip Johnston
      role: Co-founder and CEO
      background: >-
        Former McKinsey satellite-project contributor with graduate training in national security, business,
        mathematics, and finance.
      claimRefs:
        - CO003
    - name: Ezra Feilden
      role: Co-founder and CTO
      background: >-
        Satellite engineer focused on deployable solar arrays and structures, with prior Airbus Defence & Space and
        Oxford Space Systems experience.
      claimRefs:
        - CO004
    - name: Adi Oltean
      role: Co-founder and Chief Engineer
      background: Former SpaceX principal engineer with Microsoft production GPU-cluster experience.
      claimRefs:
        - CO005
  foundingLocation: Redmond, Washington, USA
  headquarters: Redmond, Washington, USA
  productSummary: >-
    Starcloud builds orbital computing satellites combining GPUs, storage, communications, thermal management, and power
    systems. Its planned services include in-orbit data processing, persistent storage, backup, and sovereign cloud
    capacity.
  customerFocus: >-
    Spacecraft and space-station operators, governments, and enterprises seeking low-latency orbital processing or
    resilient and sovereign compute and storage.
  businessModel: >-
    Sell premium near-term orbital processing, storage, and sovereign-cloud capacity, then pursue broader data-center
    workloads if launch and scaled system economics become competitive.
  stage: Series A
  fundingStatus: >-
