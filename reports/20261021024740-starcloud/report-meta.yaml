summary:
  headline: >-
    Starcloud merits continued diligence after credible orbital-compute proof, but its $2.3 billion financing mark is
    expensive relative to still-missing commercial, reliability, regulatory, and unit-economic evidence.
  overallScore: 5.6
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: expensive
