company:
  name: "Starcloud"
chapter:
  number: 4
  title: "Financials"
  summary: "Starcloud has raised substantial capital and describes a two-stage revenue model, but public evidence still does not disclose revenue, realized pricing, gross margin, burn, cash, runway, or customer economics. The underwriting case therefore rests on whether premium near-term orbital services can bridge the company to launch-cost-dependent infrastructure economics."
sections:
  - id: "revenue-model"
    title: "Revenue model: premium orbital services before infrastructure scale"
    body: >-
      Starcloud describes two monetization horizons rather than a mature, disclosed revenue mix. The near-term model is to sell on-orbit processing, persistent storage, and sovereign cloud capacity to spacecraft operators and terrestrial users; the longer-term model is to compete for broader data-center workloads once launch economics permit much larger systems. Starcloud-2 is presented as the first commercial mission, with a GPU cluster, storage, continuous access, and separate propositions for in-space analytics and terrestrial sovereign compute. These product surfaces establish plausible billable services, but they do not disclose contract structure, committed capacity, utilization, recognized revenue, or gross profit. The revenue bridge is therefore a mechanism map, not a forecast.
    claimRefs: ["CI008", "CI010", "CI011", "CI012"]
    tableRefs: ["TI001"]
    figureRefs: ["FI001"]
  - id: "pricing-and-traction"
    title: "Pricing and traction remain private"
    body: >-
      Public materials do not provide list prices, realized prices, minimum commitments, discount schedules, or contract duration. The official mission pages repeatedly route prospective suppliers and customers to contact forms, while the independent April analysis reported no disclosed commercial revenue at that time. Starcloud-1 supplies technical proof that a terrestrial H100-class GPU operated in orbit, and CNN independently described the company as developing orbital data centers, but neither item demonstrates recurring revenue, paid utilization, retention, or customer concentration. As a result, revenue quality cannot yet be separated into contracted, usage-based, milestone, or experimental partner activity, and sales-cycle and channel-economics claims remain unavailable.
    claimRefs: ["CI009", "CI013", "CI014"]
    tableRefs: ["TI002"]
  - id: "unit-economics"
    title: "Unit economics are conditional on launch cadence and system utilization"
    body: >-
      The most concrete public economic target is management's expectation of roughly $0.05 per kilowatt-hour for a future Starcloud-3-class system, explicitly conditional on commercial launch costs near $500 per kilogram. Management also acknowledged that orbital energy costs will not be competitive until Starship is flying frequently, leaving current economics dependent on smaller missions and premium use cases. This is a power-cost target, not gross margin: it excludes disclosed evidence for spacecraft manufacturing, launch and insurance, replacement cadence, communications, ground operations, depreciation, failure losses, support, and idle capacity. Without those inputs, CAC, payback, contribution margin, gross margin, and return on invested capital cannot be responsibly calculated.
    claimRefs: ["CI006", "CI007", "CI016"]
    tableRefs: ["TI003"]
  - id: "capital-adequacy"
    title: "Capital adequacy: well funded, but runway cannot be underwritten"
    body: >-
      In August 2026 Starcloud announced a $250 million Series A extension at a $2.3 billion post-money valuation, bringing company-reported capital raised since 2024 to $450 million. The company said the new money would expand manufacturing, fund engineering with NVIDIA, and procure launch allocation. That capital is meaningful, yet funding raised is not cash available: the announcement does not disclose cash on hand, monthly burn, working-capital commitments, debt, launch deposits, insurance obligations, or runway. The financial verdict is therefore mixed. Starcloud has financing capacity and a credible service concept, but revenue quality, margin path, capital intensity, and the trigger for another round remain material diligence blockers.
    claimRefs: ["CI001", "CI002", "CI003", "CI015"]
tables:
  - id: "TI001"
    title: "Revenue streams and evidence status"
    columns: ["Stream", "Mechanism", "Billing unit", "Current public status", "Revenue quality", "Diligence ask"]
    rows:
      - ["In-space data processing", "Process spacecraft and station data before downlink", null, "Offered for Starcloud-2; revenue not disclosed", "Potentially usage or reserved capacity", "Provide signed contracts, utilization, price per workload, and recognition policy"]
      - ["Persistent orbital storage", "Store data on Starcloud-2", null, "Product capability disclosed; revenue not disclosed", "Potentially recurring capacity", "Provide contracted capacity, duration, redundancy SLA, and renewal data"]
      - ["Sovereign cloud computing", "Premium compute and backup independent of terrestrial infrastructure", null, "Product proposition disclosed; revenue not disclosed", "Potential premium enterprise or government service", "Provide buyer pipeline, security requirements, contract value, and delivery milestones"]
      - ["Future terrestrial-workload infrastructure", "Sell larger-scale compute after launch costs decline", null, "Longer-term management thesis", "Launch-cost- and utilization-dependent", "Provide capacity plan, customer commitments, launch assumptions, and phased capex schedule"]
    notes: "Public descriptions establish service mechanisms only; billing units, realized prices, utilization, revenue, and revenue mix are unavailable."
    claimRefs: ["CI008", "CI010", "CI011", "CI012"]
  - id: "TI002"
    title: "Pricing and monetization disclosure"
    columns: ["Offer", "List price", "Realized price", "Contract model", "Public evidence", "Underwriting implication"]
    rows:
      - ["Starcloud-2 compute", null, null, "Not disclosed", "Official page solicits direct contact", "No basis for revenue-per-GPU or utilization estimates"]
      - ["Persistent storage", null, null, "Not disclosed", "Capability disclosed without a price or unit", "Cannot compare with terrestrial or space-storage alternatives"]
      - ["Sovereign cloud and backup", null, null, "Not disclosed", "Positioned as a premium service", "Premium willingness-to-pay and service costs are unverified"]
      - ["Future large-scale compute", null, null, "Not disclosed", "Management discusses power-cost parity conditions", "Power-cost target does not establish customer price or gross margin"]
    notes: "Null means no public list or realized price was found in the assigned prefetched evidence as of 2026-10-21."
    claimRefs: ["CI006", "CI009", "CI014"]
  - id: "TI003"
    title: "Unit economics and capital adequacy"
    columns: ["Metric", "Public value", "Confidence", "Why it matters", "Diligence ask"]
    rows:
      - ["Future orbital power-cost target", "$0.05 per kWh", "Medium; management target reported by TechCrunch", "A key input to eventual cost parity, not a complete cost stack", "Reconcile energy target to fully loaded cost per compute unit"]
      - ["Launch-cost assumption", "$500 per kg", "Medium; explicit condition in management's model", "Economics are sensitive to an externally controlled launch market", "Provide sensitivity at current and delayed Starship cadence"]
      - ["Commercial revenue", null, "Low; no public amount", "Prevents assessment of traction and revenue quality", "Provide monthly revenue by product, recognized versus contracted"]
      - ["Gross margin", null, "Low; no public amount", "Cannot test whether premium services absorb launch and hardware costs", "Provide COGS bridge including launch, hardware, communications, insurance, and operations"]
      - ["Cash, burn, and runway", null, "Low; financing disclosed but liquidity is not", "Determines timing and dilution risk of the next round", "Provide cash balance, monthly burn, committed spend, debt, and runway"]
      - ["CAC, payback, and sales cycle", null, "Low; no public data", "Determines scalability of the commercial motion", "Provide pipeline conversion, sales-cycle length, CAC, contract duration, and payback"]
    notes: "Only the power and launch-cost figures are public management assumptions; all nulls are evidence gaps rather than zero values."
    claimRefs: ["CI006", "CI007", "CI009", "CI015", "CI016"]
