      - Diligence gap
    rows:
      - [Starcloud-1, Technical demonstrator users, "Launched November 2025; company-reported demonstrations", "First NVIDIA H100 in orbit and in-orbit model work", "Mission telemetry, workload duration, and error rates"]
      - [Starcloud-2 in-space compute, Spacecraft and station operators, "First commercial mission; operation targeted by 2027", "Processes high-volume raw data before downlink", "Booked capacity, integration tests, and measured link availability"]
      - [Starcloud-2 terrestrial cloud, Sovereign and critical-data users, "Company-described future service", "Storage and compute independent of terrestrial facilities", "Security controls, tenant isolation, recovery objectives, and service levels"]
      - [Starcloud-4, Not publicly specified, "Named official page without a technical specification", "Not supportable from retained evidence", "Configuration, timing, customer, and qualification plan"]
    notes: "Status and differentiation are limited to the retained public evidence as of 2026-10-21; null or unspecified items are diligence gaps, not zero capability."
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE016]
  - id: TE002
    title: Workflow and use-case evidence
    columns:
      - User job
      - Current bottleneck
      - Starcloud solution
      - Publicly supportable benefit
      - Limitation
    rows:
      - ["Analyze spacecraft sensor data", "Raw-data downlink volume and transmission windows", "Run GPU analysis in orbit", "Downlink selected insights rather than all raw data", "No retained measured throughput, latency, or accuracy"]
      - ["Store critical terrestrial data", "Dependence on terrestrial infrastructure", "Persistent orbital storage with continuous access", "Physically remote storage location", "No disclosed recovery objective, security audit, or availability record"]
      - ["Run high-performance cloud workloads", "Terrestrial power, cooling, and permitting constraints", "GPU cluster supported by orbital power and thermal systems", "A demonstrator reportedly operated an H100 workload in orbit", "Commercial-scale economics and repeatable reliability remain unverified"]
    notes: "Benefits are company-claimed or analytically bounded by the cited sources; no row establishes a contracted service level or production customer outcome."
    claimRefs: [CE001, CE003, CE004, CE005, CE011, CE015]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or component
      - Role
      - Dependency
      - Principal risk
    rows:
      - ["Terrestrial GPU compute", "Inference, training, and data processing", "Standard chips adapted for orbit", "Radiation errors and inability to service hardware"]
      - ["Radiation tolerance", "Protect and recover compute state", "Shielding plus software fault tolerance", "No public upset-rate or recovery-test evidence"]
      - ["Thermal rejection", "Move board heat to space", "Conductive liquid and deployable radiators", "Mass, deployment, leakage, and heat-rejection margins undisclosed"]
      - ["Optical connectivity", "Connect orbital compute to users and networks", "Laser terminal and third-party constellation backbone", "Interoperability and sustained availability are not independently confirmed"]
    notes: "Architecture descriptions come primarily from a founder interview; implementation details and performance figures are not independently verified."
    claimRefs: [CE009, CE010, CE011, CE012, CE013, CE015]
figures:
  - id: FE001
    title: Claimed Starcloud product architecture
    type: stack
    summary: Six evidence-bounded layers connect workload intake to delivered orbital compute outputs.
    data:
      layers:
        - label: Workload intake
          detail: Spacecraft data or terrestrial storage and compute request
          modules:
            - Spacecraft sensors
            - Terrestrial users
          outputs:
            - Raw data or workload request
        - label: Orbital connectivity
          detail: Claimed high-throughput access to constellation backbones
          modules:
            - Laser terminal
            - Third-party satellite network
          outputs:
            - Data ingress and egress
        - label: Compute and storage
          detail: Commercial GPU hardware and persistent storage
          modules:
            - NVIDIA H100 or planned GPU cluster
            - Persistent storage
          outputs:
            - Inference, training, or stored data
        - label: Radiation reliability
          detail: Company-described protection for terrestrial electronics
          modules:
            - Shielding
            - Software fault tolerance
          outputs:
            - Claimed error resilience
        - label: Thermal and power
          detail: Supporting spacecraft infrastructure
          modules:
            - Conductive-liquid board cooling
            - Deployable radiators
            - Orbital power system
          outputs:
            - Heat rejection and electrical power
        - label: Service delivery
          detail: Outputs differ for in-space and terrestrial users
          modules:
            - In-orbit analytics
            - Sovereign storage and cloud
          outputs:
            - Selected insights or remote data access
    approximationNotes: "This is a synthesis of company-described components, not an as-built topology or verified performance model."
    claimRefs: [CE004, CE005, CE009, CE010, CE011, CE013]
callouts:
  - calloutType: strength
    title: Functional proof has crossed the concept threshold
    body: >-
      The company reports that Starcloud-1 carried an H100, ran Gemini, and
      trained nanoGPT in orbit. That is narrower than production reliability,
      but materially stronger than a paper-only architecture.
    claimRefs: [CE001, CE002]
  - calloutType: risk
    title: Commercial readiness is not yet evidenced
    body: >-
      No retained source provides Starcloud mission telemetry, availability,
      thermal margins, radiation-error rates, security audits, or contractual
      service levels for the commercial product.
    claimRefs: [CE003, CE005, CE015, CE016]
