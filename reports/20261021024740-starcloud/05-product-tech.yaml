schemaVersion: "report-v2"
artifact: product-tech
slug: starcloud
runDate: 2026-10-21
company:
  name: Starcloud
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Starcloud has moved beyond a purely conceptual product through Starcloud-1's
    company-reported H100, Gemini, and nanoGPT demonstrations, while Starcloud-2
    is positioned as the first commercial compute-and-storage mission. The core
    investment uncertainty is no longer whether some GPU work can occur in orbit,
    but whether the claimed thermal, radiation, networking, security, and service
    architecture can deliver repeatable commercial reliability.
sections:
  - id: product-and-maturity
    title: Product definition and maturity
    body: >-
      Starcloud's product is best understood as a staged orbital compute service
      rather than one finished data-center SKU. Starcloud-1 is the demonstrator:
      the company says it launched with an NVIDIA H100 in November 2025, ran a
      version of Gemini, and trained a nanoGPT model in orbit. Those events are
      meaningful functional proof, but the cited material does not provide
      workload duration, error rates, thermal telemetry, utilization, or
      customer acceptance criteria. Starcloud-2 is the commercial step. Its
      official page specifies a GPU cluster, persistent storage, continuous
      access, and proprietary power and thermal systems, with operation in a
      sun-synchronous orbit targeted by 2027. The proposed workflow serves two
      distinct jobs: process spacecraft data before downlink, or provide
      terrestrial users with remote storage and sovereign cloud capacity. The
      public Starcloud-4 page is not yet a product specification, so later
      generations remain roadmap placeholders rather than underwritable assets.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE016]
    tableRefs: [TE001]
  - id: architecture-and-workflow
    title: Architecture and operating workflow
    body: >-
      The architecture joins ordinary GPU workloads to unusually demanding
      spacecraft infrastructure. Starcloud describes standard terrestrial chips
      behind a laser-linked access layer, persistent storage, software-assisted
      radiation fault tolerance, immersion-style board cooling, deployable
      radiators, and orbital power systems. The customer-facing flow is more
      concrete for in-space users: ingest high-volume sensor data, run inference
      or filtering near the source, and downlink selected insights rather than
      all raw data. The terrestrial sovereign-cloud proposition is less mature
      because the available evidence does not establish ground access topology,
      recovery objectives, tenant isolation, key management, or enforceable
      service levels. A founder interview gives claimed network targets of
      hundreds of gigabits per second and latency as low as 50 milliseconds, but
      those are design assertions rather than observed Starcloud-2 performance.
      The figure therefore maps claimed components and outputs; it should not be
      read as a verified production architecture.
    claimRefs: [CE003, CE004, CE005, CE009, CE010, CE011, CE012]
    tableRefs: [TE002]
    figureRefs: [FE001]
  - id: differentiation-and-dependencies
    title: Differentiation and critical dependencies
    body: >-
      Starcloud's differentiation thesis combines in-orbit proximity to
      spacecraft data with adaptations intended to make commercial terrestrial
      GPUs viable in space. The reported H100 demonstration gives that thesis
      more credibility than a paper design, while the Redmond payload facility
      indicates some internal build capability. However, much of the supposed
      moat still sits in unverified implementation details: shielding geometry,
      software recovery behavior, full-board liquid thermal transport,
      deployable radiator mass, optical-link availability, and integration with
      other constellations. The company says its current architecture is not
      modular and expects modularity only beyond a much larger single-satellite
      scale. That sequencing concentrates early technical and operational risk
      in each spacecraft. Independent coverage also describes proposed
      Blackwell hardware, AWS Outposts, and laser interoperability, but no
      retained primary technical document or partner-issued confirmation
      establishes those integrations. The product moat should therefore be
      evaluated as demonstrated compute plus claimed systems know-how, not yet
      as a proven orbital cloud platform.
    claimRefs: [CE001, CE007, CE009, CE010, CE011, CE012, CE013, CE014]
    tableRefs: [TE003]
  - id: trust-reliability-and-roadmap
    title: Trust, reliability, and roadmap risks
    body: >-
      Public evidence is weakest where enterprise and sovereign buyers will
      impose the hardest requirements. The retained official pages do not
      disclose availability history, radiation-event behavior, thermal margins,
      redundancy design, incident response, encryption controls, certifications,
      privacy governance, data residency interpretation, or end-of-life recovery.
      Starcloud markets independence from Earth and a highly redundant
      environment, but those are product claims rather than audited controls.
      A low-reputation practitioner discussion usefully identifies launch cost,
      radiation, debris, and upgrade constraints as unresolved economic and
      operational risks; it is a risk prompt, not a benchmark. Likewise, an
      official promotional page described a near-term larger and profitable
      follow-on mission without supplying economics or qualification data.
      Diligence should require mission telemetry, component qualification,
      failure-mode testing, security architecture, third-party integration
      confirmations, and contractual service objectives before treating
      Starcloud-2 as commercial-grade infrastructure.
    claimRefs: [CE005, CE006, CE008, CE009, CE015, CE016]
