  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: reliability
      missingEvidence: Mission telemetry, radiation-event logs, thermal margins, fault-recovery results, and sustained workload records for Starcloud-1 and qualification evidence for Starcloud-2.
      whyItMatters: Without measured reliability evidence, a successful demonstration cannot establish repeatable commercial availability or hardware life.
      diligencePath: Review raw mission telemetry, component qualification reports, environmental test results, incident logs, and the acceptance criteria for Starcloud-2.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: material
      topic: security-compliance
      missingEvidence: Security architecture, encryption and key-management design, tenant-isolation controls, privacy governance, audit reports, and applicable certifications.
      whyItMatters: Sovereign storage and critical-data positioning requires verifiable controls and jurisdictional analysis rather than physical-location claims alone.
      diligencePath: Obtain the security white paper, threat model, penetration-test results, control mappings, data-flow diagrams, and customer contractual requirements.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: material
      topic: integration-roadmap
      missingEvidence: Partner-issued confirmation and test evidence for AWS Outposts and laser interoperability with named satellite constellations.
      whyItMatters: The commercial workflow depends on network and cloud integrations that are currently supported only by company or secondary descriptions.
      diligencePath: Request signed partner statements, interface-control documents, integration schedules, and end-to-end link-test results.
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: A public engineering repository, package, API documentation set, technical forum, or higher-quality practitioner community discussing Starcloud implementations.
      whyItMatters: The retained practitioner source surfaces risks but does not provide a credible developer adoption or implementation signal.
      diligencePath: Ask Starcloud for API documentation and integration forums, then interview named satellite engineers or customers who have tested the platform.
