      - ["Terrestrial GPU-cloud substitutes", "Not retained for this chapter", "General AI infrastructure from CoreWeave, Crusoe, and Lambda", "Not retained", "They remain the status quo and can be used while orbital systems are tested"]
      - ["Vertically integrated space platforms", "Not disclosed for orbital compute", "Launch, communications, hosting, or edge-compute bundles", "Not disclosed", "Bundling can pressure a pure-play provider even without a directly comparable list price"]
    notes: "No retained source provides normalized list or realized pricing; every missing value is a diligence gap rather than a zero."
    claimRefs: [CP004, CP005, CP006, CP015, CP016]
