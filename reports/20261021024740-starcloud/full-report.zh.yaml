  - id: FR001
    title: 风险热力图：影响、可能性与缓释成熟度
    type: matrix
    summary: 按分析判断对六个最重大的风险簇排序；标签反映有证据支持的判断，未知可能性或未经验证的缓释措施会明确标示。
