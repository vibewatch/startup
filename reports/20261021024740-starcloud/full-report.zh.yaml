    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营概况
        blocks:
          - type: paragraph
            body: >-
              Starcloud 设计卫星，目标是提供 GPU 计算、持久存储和轨道数据中心服务。公司总部位于 Washington 州 Redmond，一家独立行业媒体将其成立时间追溯至 2024
              年。运营进展虽已落地，但仍处早期：Starcloud-1 于 2025 年 11 月将 NVIDIA H100 送入轨道；Starcloud-2 被描述为首次商业任务，计划于 2027
              年投入运行。公开披露尚不足以支持当前收入、ARR、客户数或合同金额数据。Tech Insider 报道截至 2026 年 4 月未披露商业收入，但这一有明确日期的观察不能证明 Starcloud 在 2026 年
              10 月的收入状况。
