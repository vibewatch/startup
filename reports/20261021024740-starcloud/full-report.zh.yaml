              - CP012
              - CP013
      - number: '3.3'
        title: 定价证据不足以证明切换价值
        blocks:
          - type: paragraph
            body: >-
              保留的证据没有披露 Starcloud 商业容量的公开标价、合同计价单位、服务级别承诺或折扣表。产品页面描述能力并邀请潜在客户联系；Sacra 将业务定性为商业化前阶段，并将有意义的经常性计算收入指向 2027
              年。因此，买方无法在全成本口径下比较轨道容量与地面 GPU 小时。切换成本也不对称：把空间原生数据处理移到更靠近传感器的位置，可能减少下传负担；但通用 AI
              买方可以保留地面容量，只把轨道计算用于特定工作负载。Starcloud
              可能通过航天器集成、数据本地性或容量预留形成锁定，但保留的公开证据尚未证明其中任何一项。因此，定价尽调需要已签合同、工作负载层面的经济性、续约机制，以及通过云合作伙伴接入不会让 Starcloud
              沦为其分销渠道附属品的证据。
            claimRefs:
              - CP004
              - CP006
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP015
              - CP016
      - number: '3.4'
        title: 护城河依赖执行，也容易被捆绑
        blocks:
          - type: paragraph
            body: >-
              Starcloud 的竞争论点暴露在同一条吸引入场者的成本曲线上。Reuters 报道发射成本仍是挑战，管理层预计轨道系统要到 2028 或 2029 年左右才具备成本竞争力。Data Center
              Dynamics 另称，早先宣称以 $8.2 million 部署 40 MW 的假设可能过于乐观。若发射成本下降，Starcloud 会受益，但 SpaceX
              和其他发射平台也会更像可信的整合型竞争者；若成本维持高位，地面云则保留经济优势。CIO Business Views
              将发射经济性、基础设施可扩展性、网络安全和运营可靠性列为成功条件，而非已经解决的优势。Starcloud 确实在飞行 GPU
              验证上领先，但可防守资产不只是概念。持久优势需要商业正常运行时间、制造节奏、信任控制，以及能经受现有巨头捆绑或超大规模云厂商自建的合作条款。
            claimRefs:
              - CP003
              - CP011
              - CP013
              - CP014
              - CP016
      - number: '3.5'
        title: 图表
        blocks:
          - type: callout
            title: 合作伙伴转为竞争者的风险居中
            body: AWS、Google、Nvidia、Crusoe 和发射服务商可以验证 Starcloud 所在市场，同时保留将需求导向其他地方、内部自建或捆绑竞争性轨道基础设施的战略选项。
            calloutType: risk
            claimRefs:
              - CP002
              - CP004
