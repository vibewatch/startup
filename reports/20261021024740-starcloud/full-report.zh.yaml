      - number: '5.2'
        title: 架构与运营工作流
        blocks:
          - type: paragraph
            body: >-
              该架构把普通 GPU 工作负载接入要求极高的航天器基础设施。Starcloud
              描述了位于激光链路接入层后的标准地面芯片、持久存储、软件辅助的辐射容错、浸没式板级冷却、可展开散热器和轨道电力系统。面向客户的流程对在太空用户更具体：摄取高容量传感器数据，在源头附近运行推理或过滤，只下传选定洞见，而不是全部原始数据。地面主权云方案成熟度更低，因为现有证据无法确认地面接入拓扑、恢复目标、租户隔离、密钥管理或可执行的服务级别。创始人访谈给出每秒数百吉比特的网络目标和低至
              50 毫秒的延迟，但这些是设计主张，而非观察到的 Starcloud-2 性能。因此，图示映射的是声称的组件和输出，不应视为已验证的生产架构。
