        title: 定价与牵引力仍属私有信息
        blocks:
          - type: paragraph
            body: >-
              公开材料没有提供标价、实际成交价、最低承诺、折扣表或合同期限。官方任务页面反复引导潜在供应商和客户填写联系表；独立的 4 月分析则称当时没有披露商业收入。Starcloud-1 证明地面 H100 级 GPU
              能在轨运行，CNN
              也独立描述公司正在开发轨道数据中心，但两者都不能证明经常性收入、付费利用率、留存或客户集中度。因此，收入质量尚无法拆分为合同型、按使用量计费、里程碑型或合作伙伴试验活动；销售周期和渠道经济性也仍无公开依据。
