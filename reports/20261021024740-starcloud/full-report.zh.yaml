            body: Starcloud-2 任务失败、无法证明持续的热性能与工作负载可靠性，或发射经济性持续明显高于模型阈值，都会击穿近期规模化论点。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR007
              - CR012
              - CR015
              - CR016
          - type: callout
            title: 评估规模化前的尽调关口
            body: 在认可星座规模经济性前，应要求监管许可一手记录、可独立审阅的任务遥测、安全控制证据、发射承诺以及现金到里程碑的资金计划。
            calloutType: recommendation
            claimRefs:
              - CR008
              - CR013
              - CR014
              - CR015
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资决策与价格纪律
        blocks:
          - type: paragraph
            body: >-
              最新披露的价格是 2026 年 8 月 $250 million A 轮追加融资对应的 $2.3 billion 投后估值；3 月融资据报道估值为 $1.1 billion。约 2.1
              倍的加价发生在最有力的保留公开收入表述仍称截至 4 月未披露商业收入之时。融资显示投资者需求，也增加了筹资额，但不能证明当前可用现金、ARR
              或站得住脚的收入倍数。建议为继续研究，信心中等，风险高，估值判断偏贵。应等待可独立审阅的运营证据或明显更好的条款再入场；泛泛的热情折价不是充分替代。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV010
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV008
              - CV009
              - CV010
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV010
              - CV015
              - CV016
      - number: '8.2'
        title: 论点、反论点与证明负担
        blocks:
          - type: paragraph
            body: >-
              可投资论点是 Starcloud 已超越纸面概念：Starcloud-1 搭载 NVIDIA H100，公司和独立报道都描述了在轨 AI 工作负载演示。反论点是，演示卫星不等于商业数据中心。Starcloud
              现在称 Starcloud-2 将于 2027 年运行；一名独立跟踪者记录其较早的 2026 年 10 月目标已推迟，并称航天器尚未入轨。同一跟踪者认为，Starcloud-1
              的实际轨道倾角没有检验经济叙事核心的近乎持续日照假设。Microsoft 管理层公开表达的谨慎，为公司的预测提供了有用的需求侧制衡。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV015
      - number: '8.3'
        title: 情景方法与估值边界
        blocks:
          - type: paragraph
            body: >-
              里程碑方法比收入倍数更合适，因为保留证据没有提供当前收入、利润率、签约积压、利用率或经审计的单位经济性。乐观情景要求 Starcloud-2
              到达目标轨道、可靠运行付费工作负载，并证明发射、热管理、辐射和通信成本能够支撑有吸引力的毛利率。基准情景假设技术继续进步，但商业验证延迟，使当前估值缺乏公开运营模型支撑。悲观情景则叠加再次延期、付费利用率疲弱或持续日照前提失效。资料池无法支持概率加权的公允价值区间；相比虚假的精确度，定性信号和明确触发条件更诚实。
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备度、尽调要求与论点失效触发因素
        blocks:
          - type: paragraph
            body: >-
              退出准备度低，因为证据基础显示的是融资和技术里程碑，而不是可重复的商业模型。在给投资定价前，尽调应取得 cap
              股权结构表、清算优先权、债务和项目融资义务、当前现金、月度烧钱、客户合同、积压、工作负载利用率、毛利桥接、发射保险及卫星级遥测。主要论点失效触发因素包括 Starcloud-2
              再次延期且没有可信补救计划、无法进入目标轨道、无法发布可靠的热性能和辐射表现，或商业使用仍停留在宣传而非付费。正面重估需要第三方对付费工作负载和经济性的证据，而不是又一份融资公告。
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 对价格敏感的建议
            body: 继续研究。公司拥有有意义的技术和融资信号，但 $2.3 billion 投后估值缺乏足够的公开商业或单位经济性证据，不能支持买入建议。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV010
              - CV016
          - type: callout
            title: 不要把累计融资额误当成可用现金
            body: 据报道的 $450 million 累计融资额没有披露当前现金、烧钱速度、受限资金、债务义务或清算优先权。
            calloutType: risk
            claimRefs:
              - CV002
              - CV016
