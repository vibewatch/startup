      - number: '4.3'
        title: 单位经济性取决于发射节奏与系统利用率
        blocks:
          - type: paragraph
            body: >-
              最具体的公开经济目标是管理层预计未来 Starcloud-3 级系统的电价约为 $0.05/千瓦时，但明确以商业发射成本接近 $500/公斤 为前提。管理层还承认，轨道能源成本要等 Starship
              频繁飞行后才具备竞争力，因此当前经济性依赖更小的任务和高溢价用例。这是电力成本目标，不是毛利率：其中没有纳入航天器制造、发射与保险、更换节奏、通信、地面运营、折旧、故障损失、支持和闲置容量的公开证据。缺少这些输入，CAC、回本期、贡献利润率、毛利率和投入资本回报率都无法负责任地计算。
            claimRefs:
