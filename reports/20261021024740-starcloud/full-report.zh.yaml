  - id: TV001
    title: 建议摘要
    columns:
      - 维度
      - 评估
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 技术验证已经存在，但当前商业证据不完整。
        - 在完成主要尽调前，不要基于已披露估值做买入判断。
      - - 置信度
        - 中
        - 融资估值和任务主张均有记录，而收入和条款仍属私有信息。
        - 将结论视为有条件判断，而不是量化的公允价值意见。
      - - 风险评级
        - 高
        - 发射时点、轨道假设、规模化经济性和商业化仍未解决。
        - 要求按里程碑融资，或提供同等的下行保护。
      - - 估值态度
        - 昂贵
        - 8 月的投后估值约为 3 月估值的 2.1 倍，但公司未披露当前收入基数。
        - 等待经营证明，或等到入场条款明显改善。
    notes: 这些判断是基于公开融资估值和不完整经营披露作出的分析性判断；融资额不等同于可用现金。
