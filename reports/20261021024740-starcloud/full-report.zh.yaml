    title: 轨道计算市场证据金字塔
    type: pyramid
    summary: 证据从宽泛情景逐步收窄到已展示或近期可商业化的较小能力集合。
    data:
      nodes:
        - label: 激进宽泛情景
          value: $50–100B by 2035
