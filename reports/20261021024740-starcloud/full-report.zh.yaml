  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型：基础设施规模化前先做高溢价轨道服务
        blocks:
          - type: paragraph
            body: >-
              Starcloud
              描述的是两个变现阶段，而不是成熟且已披露的收入结构。近期模型是向航天器运营商和地面用户销售在轨处理、持久存储和主权云容量；长期模型则是在发射经济性允许更大系统后，争夺更广泛的数据中心工作负载。Starcloud-2
              被定位为首次商业任务，具备 GPU
              集群、存储和持续访问，并分别面向在太空分析和地面主权计算提出服务方案。这些产品形态构成了合理的可收费服务，但没有披露合同结构、承诺容量、利用率、确认收入或毛利。因此，收入桥接是机制图，而不是预测。
