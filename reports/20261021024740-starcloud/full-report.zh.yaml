  - id: TV002
    title: 正论与反论
    columns:
      - 视角
      - 有证据支持的论点
      - 哪些变化会改变判断
    rows:
      - - 正论
        - Starcloud-1 已将一块 H100 送入轨道，公司材料称其已在太空运行 AI 负载。
        - 独立遥测若能确认持续性能和可靠性，将强化这一论点。
      - - 正论
        - 最近一轮融资引入了战略基础设施投资者，并提高了累计融资额。
        - 若能清楚说明募集资金如何转化为已签约商业容量，就能把融资与价值创造连起来。
      - - 反论
        - Starcloud-2 尚未入轨，公开时间表已推迟至 2027 年。
        - 成功进入所需轨道并随后开展付费运营，将降低执行风险。
      - - 反论
        - 留存证据没有披露当前商业收入，也未验证规模化单位经济性。
        - 经审计的收入、利用率、毛利率和发射成本敏感性数据，才足以支持模型化估值。
    notes: 这是一套有选择性的决策框架，而非穷尽所有风险的清单；每一行都说明哪些证据足以改变投资判断。
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV012
      - CV015
  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 假设
      - 估值与回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - Starcloud-2 进入所需轨道，可靠地运行付费负载，并证明可信的规模化经济性。
        - 只有在已签约收入和利润率证据足以建立模型后，溢价才可能站得住脚；目前没有公开区间可供合理辩护。
        - 热性能、发射成本、客户转化和后续融资。
        - 未量化；需要多个相互独立的里程碑得到确认。
      - - 基准
        - 技术进展延续，但商业证明和 Starcloud-3 的经济性仍然延迟披露，或仍属非公开信息。
        - $2.3B 融资估值仍只是交易参考，而非已证明的公允价值；推迟入场。
        - 稀释、进度拖延、优先权压力，以及规模化前长期烧钱。
        - 与目前留存证据最一致。
      - - 悲观
        - 再次出现重大延误、部署到错误轨道、付费利用率疲弱，或成本假设落空。
        - 下行空间可能跌破 3 月 $1.1B 的融资参考值，但现有资料不足以支持精确的底价或回收价值。
        - 任务失败、资本稀缺、技术故障，以及战略买家转而自建。
        - 由触发条件决定，而非数值估算。
    notes: 这些情景没有刻意按概率加权，因为当前收入、现金、烧钱速度、持股、优先权和可比交易数据都不可得。
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV015
      - CV016
