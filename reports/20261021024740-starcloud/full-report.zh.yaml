  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 当前融资估值只跨过了融资这一步；技术、商业、经济性和条款证明仍是投资前提。
    data:
      nodes:
        - id: disclosed-price
          label: $2.3B 投后融资估值
          detail: 观察到的 2026 年 8 月交易参考值，不是公开市场估值模型。
        - id: technical-proof
          label: 演示证明
          detail: Starcloud-1 搭载 H100，并在轨道运行据报的 AI 负载。
        - id: schedule-proof
          label: 商业卫星待交付
          detail: Starcloud-2 目前被描述为计划于 2027 年运行，尚未入轨。
        - id: commercial-proof
          label: 收入证明缺失
          detail: 留存证据未披露当前收入、利用率、积压订单和客户经济性。
        - id: economics-and-terms
          label: 经济性与条款缺失
          detail: 规模化成本、现金、烧钱速度、股权表、稀释和优先权输入仍需尽调。
        - id: recommendation
          label: 继续研究；估值昂贵
          detail: 只有在里程碑得到证明，或风险调整后条款明显改善时才投资。
      edges:
        - from: disclosed-price
          to: technical-proof
        - from: technical-proof
          to: schedule-proof
        - from: schedule-proof
          to: commercial-proof
        - from: commercial-proof
          to: economics-and-terms
        - from: economics-and-terms
          to: recommendation
    approximationNotes: 该流程是定性的决策顺序，不代表数值转化率或概率。
