        - label: 有归属的市场预测
          value: $39.09B by 2035
          detail: Tech Insider 将预测归因于 Introl：2029 年 $1.77B，复合年增长率 67.4%；原始预测不可得。
        - label: 专业市场情景
          value: $3–5B by 2030
          detail: 面向边缘推理和国防用例的二手区间，底层模型未披露。
        - label: 计划中的商业演示器
