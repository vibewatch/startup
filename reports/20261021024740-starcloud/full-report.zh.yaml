        title: 资本形成与利益相关方结构
        blocks:
          - type: paragraph
            body: >-
              Starcloud 在 2026 年融资估值迅速重定价。多家媒体报道，公司 3 月以 $1.1 billion 估值完成 $170 million A 轮融资，当时累计融资超过 $200 million。随后
              TechCrunch 报道，公司 8 月完成 $250 million 追加融资，估值达到 $2.3 billion。追加融资由 Manhattan West Ventures 领投，NVIDIA 和 Cisco
              参与；此前披露的投资方还包括 Benchmark、EQT Ventures、NFX、776 Ventures、Y Combinator
              等。这些金额是已筹资金，不等于可用现金或资金续航。本文审阅的公开记录没有披露各批次条款、清算优先权、债务、老股转让、当前现金、烧钱速度或备考所有权结构。
