  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与成熟度
        blocks:
          - type: paragraph
            body: >-
              Starcloud 的产品更适合被理解为分阶段推进的轨道计算服务，而不是一个完成度高的单一数据中心 SKU。Starcloud-1 是验证器：公司称其于 2025 年 11 月搭载 NVIDIA H100
              发射，在轨运行 Gemini 的一个版本并训练 nanoGPT 模型。这些事件构成有意义的功能验证，但引用材料没有提供工作负载持续时间、错误率、热遥测、利用率或客户验收标准。Starcloud-2
              是商业化步骤。官方页面规定其搭载 GPU 集群、持久存储、持续访问及专有电力和热管理系统，目标是在 2027
              年于太阳同步轨道运行。计划中的工作流服务两类任务：在下传前处理航天器数据，或为地面用户提供远程存储和主权云容量。公开的 Starcloud-4
              页面尚不是产品规格，因此后续代际仍是路线图占位符，而不是可据此承保的资产。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE016
