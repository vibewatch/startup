        title: 资本充足性：资金充裕，但无法评估资金续航
        blocks:
          - type: paragraph
            body: >-
              2026 年 8 月，Starcloud 宣布完成 $250 million A 轮追加融资，投后估值为 $2.3 billion，使公司披露的自 2024 年以来累计融资达到 $450
              million。公司称新资金将用于扩充制造、与 NVIDIA
              开展工程合作以及采购发射额度。这笔资本规模可观，但已筹资金不等于可用现金：公告没有披露手头现金、月度烧钱、营运资金承诺、债务、发射订金、保险义务或资金续航。因此财务结论是混合的。Starcloud
              具备融资能力，也有可信的服务概念，但收入质量、利润率路径、资本密集度及下一轮融资触发点仍是重大尽调阻碍。
