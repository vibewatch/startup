        title: 管理层、创始团队匹配度与治理
        blocks:
          - type: paragraph
            body: >-
              已披露的创始团队覆盖商业战略、航天器工程和大规模软件基础设施。Philip Johnston 是联合创始人兼 CEO，曾参与卫星项目并接受金融与政策培训；Ezra Feilden 是联合创始人兼
              CTO，拥有可展开空间结构经验；Adi Oltean 是联合创始人兼首席工程师，曾参与 Starlink 相关工作并负责生产环境 GPU
              集群。这一组合与既定任务高度匹配，但也把外部融资、航天器架构和系统执行集中在三位明确的创始人身上。现有证据没有披露完整的高管梯队、董事会构成、继任计划、所有权或创始人投票控制权，因此治理韧性尚无法评估。
