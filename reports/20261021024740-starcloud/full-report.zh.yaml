        title: 里程碑与执行依赖
        blocks:
          - type: paragraph
            body: >-
              Starcloud 已跨过重要技术门槛：首颗卫星于 2025 年 11 月搭载 NVIDIA H100 发射，并在 12 月运行 Gemini 的一个版本、训练 nanoGPT
