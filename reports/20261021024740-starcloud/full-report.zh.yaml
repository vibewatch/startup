      - number: '5.4'
        title: 信任、可靠性与路线图风险
        blocks:
          - type: paragraph
            body: >-
              企业和主权买方要求最严苛的地方，公开证据反而最薄弱。保留的官方页面没有披露可用性历史、辐射事件表现、热裕量、冗余设计、事件响应、加密控制、认证、隐私治理、数据驻留解释或生命周期终止恢复。Starcloud
              宣传其独立于地球、处于高度冗余环境，但这些是产品主张，不是经审计的控制。一篇信誉较低的从业者讨论有用地指出发射成本、辐射、碎片和升级约束仍是未解决的经济与运营风险；它是风险提示，不是基准。同样，官方宣传页描述了近期更大且盈利的后续任务，却没有提供经济性或鉴定数据。在把
              Starcloud-2 视为商业级基础设施前，尽调应要求任务遥测、部件鉴定、失效模式测试、安全架构、第三方集成确认和合同服务目标。
