      - number: '5.3'
        title: 差异化与关键依赖
        blocks:
          - type: paragraph
            body: >-
              Starcloud 的差异化在于：既利用航天器数据在轨处理的近场优势，又让商业地面 GPU 适应太空运行。已报道的 H100 验证比纸面设计更能支撑这一点，Redmond
              载荷设施也显示出一定的内部制造能力。但所谓护城河很大一部分仍停留在未经验证的实现细节上：屏蔽几何、软件恢复行为、整板液冷传热、可展开散热器质量、光链路可用性以及与其他星座的集成。公司称当前架构并不模块化，只有在单星规模大得多之后才会模块化。这种节奏把早期技术和运营风险集中到每艘航天器上。独立报道还提到拟采用
              Blackwell 硬件、AWS Outposts 和激光互操作性，但保留的主要技术文件或合作伙伴确认均未证明这些集成。                           
              产品护城河因此应被评估为已验证的计算能力加上公司声称的系统专业能力，目前尚不是已证明的轨道云平台。
            claimRefs:
              - CE001
