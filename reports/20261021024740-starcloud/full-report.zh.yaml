  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场应限定为轨道计算和存储服务，而不是整个地面数据中心市场。Starcloud
              已披露的近期用例包括在下传前处理航天器生成的数据、持久存储、主权备份及部分高性能工作负载。因此，计入的支出应包括托管式轨道计算、在轨数据处理、韧性存储和任务专用基础设施溢价。地面超大规模云厂商、地面边缘站点、直接下传至地球、客户自有航天器处理器和传统备份仍是替代方案，不能自动视为
              Starcloud 可捕获的收入。比特币挖矿更适合作为早期硬件的利用率过渡，而不是广泛云需求的证明。只有当轨道系统在商业规模上证明交付成本、可靠性和可用数据传输具备竞争力时，边界才会扩大。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
      - number: '2.2'
        title: 避免虚假精确的市场测算
        blocks:
          - type: paragraph
            body: >-
              现有证据不足以支持严谨的 TAM/SAM/SOM 测算。一篇二手文章给出 2030 年 $3–5 billion 的细分市场区间、将 2029 年 $1.77 billion 推至 2035 年 $39.09
              billion 的据引述预测，以及激进的 2035 年 $50–100 billion
              情景。文章没有提供底层模型、地理范围、收入定义或一手预测原文，因此这些只是情景标记，并非经过独立验证的市场规模。Starcloud 自有公开材料给出的是产品和容量目标，而不是可审计的收入桥接。可投资的 SAM
              应限定为能够承担发射、热管理、通信、保险和更换成本的高溢价工作负载子集。在价格、签约容量、正常运行时间和发射节奏披露前，SOM 无法负责任地量化。
            claimRefs:
              - CM007
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM014
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM012
              - CM014
              - CM015
      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              当前可见两类买方体系。航天器和空间站运营商可能用轨道处理减少原始数据下传、缩短获得洞见的时间；任务运营和载荷团队是用户，项目所有方或政府任务预算可能是付款方。地面买方可能看重主权存储和韧性备份；安全、业务连续性和基础设施团队会使用该服务，采购预算可能来自云、国防或灾备。由于资料池没有公开价格、采购记录或合同金额，这些预算归属仍只是假设。采用路径应是先付费演示，再在
              Starcloud-2 上重复运行工作负载，最后只有在独立证明在轨热性能、可用性、数据传输经济性和合规性后，才进入规模化承诺。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
              - CM009
      - number: '2.4'
        title: 驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              最强驱动因素包括地面电力和许可压力、下传前处理传感器数据的价值、对主权韧性的需求，以及对非地面基础设施的战略兴趣。约束更为直接：辐射冷却必须持续有效，芯片可靠性不能吞掉节能收益，发射运力稀缺，成本持平路线又依赖
              Starship 变得常态化。独立跟踪分析还认为，Starcloud-1 的轨道使其每次绕行约有 38%
              时间处于地球阴影中，因此近乎持续日照的前提在商业功率水平上仍未验证。随着星座规模扩大，监管和碎片风险会急剧上升。因此估值应按里程碑加权：经验证的付费利用率、热性能和正常运行时间遥测、发射合同及交付单位成本，应比宽泛市场预测或远期吉瓦级愿景占据更大权重。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM013
              - CM016
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 评估里程碑，不要押注醒目的 TAM
            body: 在给 2030–2035 年宽泛市场情景赋予实质概率前，应先把付费重复工作负载、热性能和正常运行时间遥测、发射承诺、价格以及每个可用计算单位的交付成本作为估值关口。
            calloutType: recommendation
            claimRefs:
              - CM008
              - CM009
              - CM013
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争范围覆盖轨道、发射平台与地面云
        blocks:
          - type: paragraph
            body: >-
              竞争格局比其他轨道数据中心初创公司更广。SpaceX 和 Blue Origin 可以在一次采购路径中整合发射、通信、托管和计算；Lonestar 与 Axiom 则覆盖月球存储或托管式轨道计算等相邻用例。地面
              GPU 云仍是现实中的主流，因为它们已经销售 AI 基础设施，不受发射、辐射或在轨维护约束。Sacra 将 CoreWeave、Crusoe 和 Lambda 视为争夺同一 AI
              基础设施支出的替代方案；Reuters 报道 SpaceX 和 Blue Origin 已披露轨道数据中心雄心。超大规模云厂商自建也具有可信度，因为 Starcloud 点名的生态伙伴包括 AWS、Google
              和 Nvidia，这些组织拥有自行开发系统所需的资金和技术能力。因此，竞争边界包括直接同行、可能转为入场者的赋能伙伴、现有巨头以及持续的地面部署。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP012
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP009
              - CP012
              - CP013
      - number: '3.2'
        title: 飞行验证形成差异化，但分销并不独占
        blocks:
          - type: paragraph
            body: >-
              Starcloud 当前最强的差异化在于可见的技术验证：官方 Starcloud-1 页面称，2025 年 11 月任务搭载 Nvidia H100，随后在轨运行 Gemini 并训练 nanoGPT
              模型。计划中的商业系统还将加入 GPU 集群、持久存储、持续访问以及专有热管理和电力系统。这些证据让 Starcloud 区别于只有概念的入场者，但不能证明规模化可靠性、独家供应或持久客户锁定。Reuters
              描述了 Starcloud 与 Nvidia 以及 Amazon、Google
              云业务的关系，但这些关系既能扩大分销，也会让架构暴露给有能力的未来竞争者。多云并用在结构上可行，因为买方可以继续使用地面计算，同时测试轨道工作负载；而对发射的依赖又赋予垂直整合供应商议价能力。因此，护城河必须从一次性“首个”转移到运营遥测、可重复制造、预留容量和整合式客户工作流。
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP008
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
              - CP012
              - CP013
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
