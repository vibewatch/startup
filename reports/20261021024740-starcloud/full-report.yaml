      items:
        - date: '2024'
          label: Company founded
          detail: Via Satellite reports that Starcloud was founded in 2024 in Redmond, Washington.
          tone: neutral
          claimRefs:
            - CO002
        - date: 2025-11
          label: Starcloud-1 launched
          detail: The company says Starcloud-1 launched with the first NVIDIA H100 GPU in space.
          tone: positive
          claimRefs:
            - CO012
