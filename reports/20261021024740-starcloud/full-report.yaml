              - CU002
              - CU003
              - CU004
              - CU005
              - CU010
              - CU014
      - number: '6.2'
        title: Technical adoption precedes commercial proof
        blocks:
          - type: paragraph
            body: >-
              The adoption sequence has advanced from a demonstration asset toward a planned commercial platform.
              Starcloud says Starcloud-1 launched in November 2025 with an H100 and subsequently ran models in orbit;
              NVIDIA independently described the mission hardware and its Inception support, while GeekWire later
              reported the NanoGPT milestone. Starcloud calls Starcloud-2 its first commercial mission and says it will
              provide a GPU cluster, persistent storage, and continuous access by 2027. However, the only assigned
              source naming AWS, Google Cloud, NVIDIA, and Crusoe as Starcloud-2 workload participants is Tech Insider.
              That is useful lead evidence, not sufficient proof of signed contracts, payment, production deployment, or
              measurable customer outcomes. The launch and on-orbit operating milestones therefore validate product
              readiness before they validate repeatable demand.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU010
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU010
      - number: '6.3'
        title: Durability and concentration cannot yet be measured
        blocks:
          - type: paragraph
            body: >-
              No retained source reports gross or net revenue retention, churn, renewal rates, contract duration, cohort
              behavior, customer satisfaction, backlog, top-customer share, or channel concentration. The reviewed
              official pages mostly invite suppliers and customers to make contact, which is evidence of active market
              development but not of closed demand. Tech Insider reported no disclosed commercial revenue as of April
              2026 and identified launch or on-orbit failure as the largest near-term risk; its separate claim that
              Starcloud-2 was effectively sold out lacks contract-level corroboration in the assigned pool. Until
              management supplies a customer ledger and contract evidence, diligence should treat expansion as unproven
              and concentration as unknown rather than low. The decisive next proof is paid workloads that renew after a
              successful mission, with capacity, revenue, and customer dependency disclosed by segment.
            claimRefs:
              - CU009
              - CU010
              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Partner visibility is not customer validation
            body: >-
              NVIDIA's technical and investment relationship strengthens execution credibility, but public evidence does
              not show that NVIDIA or the other named collaborators are paying customers. Require contracts, invoices,
              workload utilization, and renewal terms before underwriting commercial traction.
            calloutType: risk
            claimRefs:
              - CU007
              - CU008
              - CU010
