chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating snapshot
        blocks:
          - type: paragraph
            body: >-
              Starcloud designs satellites intended to provide GPU compute, persistent storage, and orbital data-center
              services. The company is headquartered in Redmond, Washington, and an independent trade publication dates
              its founding to 2024. The operating sequence is tangible but early: Starcloud-1 put an NVIDIA H100 in
              orbit in November 2025, while Starcloud-2 is described as the first commercial mission and is planned to
              be operational in 2027. Public disclosure does not yet support current revenue, ARR, customer count, or
              contract-value metrics. Tech Insider reported no disclosed commercial revenue as of April 2026, but that
              dated observation is not evidence of Starcloud's October 2026 revenue position.
            claimRefs:
              - CO001
              - CO002
              - CO012
              - CO014
              - CO016
