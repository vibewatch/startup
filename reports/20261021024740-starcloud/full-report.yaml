              - CO007
              - CO008
              - CO009
      - number: '1.4'
        title: Milestones and execution dependencies
        blocks:
          - type: paragraph
            body: >-
              Starcloud has crossed a meaningful technical threshold: its first satellite launched in November 2025 with
              an NVIDIA H100, then ran a version of Gemini and trained a nanoGPT model in December. The next step is
              materially harder. Starcloud-2 is intended to serve commercial and government workloads with a GPU
              cluster, storage, and continuous access, while the company is expanding into a 100,000-square-foot
              Woodinville facility and reported 25 employees in August 2026. At constellation scale, TechCrunch and Via
              Satellite report an FCC request covering up to 88,000 spacecraft. The funding milestone therefore precedes
              proof of repeatable manufacturing, launch access, regulatory authorization, customer economics, and
              reliable commercial operations.
