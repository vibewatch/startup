      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The public evidence establishes regulatory ambition, not regulatory clearance. Wikipedia and GeekWire
              report an FCC application covering as many as 88,000 orbital data-center satellites, but the assigned
              source set does not include the underlying docket, license conditions, spectrum coordination record,
              debris plan, or approval status. CNBC separately reports data-governance and space-traffic concerns
              identified by Morgan Stanley analysts. A historical legal challenge also matters as evidence of execution
              friction: Wikipedia reports that the company changed its former Lumen Orbit name to Starcloud after a
              challenge from Lumen Technologies, without disclosing the case terms in the retained text. These are not
              proof of enforcement or denial. They are diligence gaps that require primary regulator and legal records
              before treating constellation scale, jurisdictional data claims, or freedom to operate as de-risked.
            claimRefs:
              - CR003
              - CR008
              - CR009
              - CR014
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR008
              - CR009
              - CR014
              - CR016
      - number: '7.3'
        title: Dependencies, financing, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Launch economics are the clearest external dependency. Control Plane reports that Falcon 9 delivery costs
              about $3,600 per kilogram while Starcloud-3 economics require roughly $500 per kilogram, and that frequent
              commercial Starship service is not yet available. The same source notes a Falcon 9 fallback for smaller
              missions, but that fallback does not close the cost gap. Financing provides capacity to pursue the roadmap
              rather than evidence that the roadmap is funded through breakeven: March reporting described a $170
              million round at a $1.1 billion valuation, while August reporting described another $250 million and $450
              million total raised at a $2.3 billion post-money valuation. None of those figures discloses cash
              available, burn, committed launch obligations, or runway. Thesis-break triggers should therefore include a
              failed or materially delayed Starcloud-2 mission, thermal performance below design needs, inability to
              secure required approvals, Starship economics remaining far above the modeled threshold, or financing that
              cannot bridge the commercial ramp.
            claimRefs:
              - CR001
              - CR007
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR010
              - CR011
              - CR012
              - CR013
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary kill criterion
            body: >-
              A failed Starcloud-2 mission, inability to demonstrate sustained thermal and workload reliability, or
              launch economics remaining materially above the modeled threshold would break the near-term scale thesis.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR007
              - CR012
              - CR015
              - CR016
          - type: callout
            title: Diligence gate before underwriting scale
            body: >-
              Require primary licensing records, independently reviewable mission telemetry, security-control evidence,
              launch commitments, and a cash-to-milestone plan before crediting constellation-scale economics.
            calloutType: recommendation
            claimRefs:
              - CR008
              - CR013
              - CR014
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment decision and price discipline
        blocks:
          - type: paragraph
            body: >-
              The latest disclosed price is a $2.3 billion post-money valuation from an August 2026 $250 million Series
              A extension, compared with the $1.1 billion valuation reported for the March financing. That roughly 2.1x
              mark-up occurred while the strongest retained public revenue statement still said no commercial revenue
              had been disclosed as of April. The financing shows investor demand and adds capital raised, but it does
              not establish cash currently available, ARR, or a defensible revenue multiple. The recommendation is
              research-more, confidence is medium, risk is high, and the valuation stance is expensive. Entry should
              wait for independently reviewable operating evidence or materially better terms; a generic enthusiasm
              discount is not an adequate substitute.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV010
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV008
              - CV009
              - CV010
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV010
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and proof burden
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is that Starcloud has moved beyond a paper concept: Starcloud-1 carried an NVIDIA
              H100, and both company and independent reporting describe in-orbit AI workload demonstrations. The
              anti-thesis is that a demonstration satellite is not a commercial data center. Starcloud now says
              Starcloud-2 will be operational in 2027, while an independent tracker records a slip from the earlier
              October 2026 target and says the spacecraft is not yet in orbit. The same tracker argues that
              Starcloud-1's actual inclination did not test the near-continuous-solar assumption central to the economic
              pitch. Microsoft leadership's public caution supplies a useful demand-side counterweight to company
              forecasts.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV015
      - number: '8.3'
        title: Scenario method and valuation boundaries
        blocks:
          - type: paragraph
            body: >-
              A milestone method is more appropriate than a revenue multiple because the retained evidence does not
              provide current revenue, margin, contracted backlog, utilization, or audited unit economics. The bull case
              requires Starcloud-2 to reach the stated orbit, run paid workloads reliably, and produce evidence that
              launch, thermal, radiation, and communications costs can support attractive gross margins. The base case
              assumes continued technical progress but delayed commercial proof, leaving the current mark unsupported by
              a public operating model. The bear case combines another schedule slip, weak paid utilization, or failure
              of the continuous-solar premise. No probability-weighted fair-value range is supportable from this pool;
              qualitative signals and explicit triggers are more honest than false precision.
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is low because the evidence base shows financing and technical milestones, not a repeatable
              commercial model. Before pricing an investment, diligence should obtain the cap table, liquidation
              preferences, debt and project-finance obligations, current cash, monthly burn, customer contracts,
              backlog, workload utilization, gross-margin bridge, launch insurance, and satellite-level telemetry. The
              principal thesis-break triggers are a further Starcloud-2 delay without a credible remediation plan,
              failure to secure the stated orbit, inability to publish reliable thermal and radiation performance, or
              commercial usage that remains promotional rather than paid. A positive re-rating requires third-party
              evidence of paid workloads and economics, not another financing announcement alone.
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive recommendation
            body: >-
              Research more. The company has meaningful technical and financing signals, but the $2.3 billion post-money
              mark is not supported by enough public commercial or unit-economic evidence to justify a buy
              recommendation.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV010
              - CV016
          - type: callout
            title: Do not confuse capital raised with cash available
            body: >-
              The reported $450 million total capital raised does not disclose current cash, burn, restricted capital,
              debt obligations, or liquidation preferences.
            calloutType: risk
            claimRefs:
              - CV002
              - CV016
