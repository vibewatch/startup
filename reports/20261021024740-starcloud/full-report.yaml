      - number: '1.3'
        title: Capital formation and stakeholder structure
        blocks:
          - type: paragraph
            body: >-
              Starcloud's financing repriced rapidly during 2026. Multiple publications reported a $170 million Series A
              at a $1.1 billion valuation in March, with more than $200 million raised at that point. TechCrunch then
              reported a $250 million extension in August that valued the company at $2.3 billion. The extension was led
              by Manhattan West Ventures and included NVIDIA and Cisco, while earlier disclosed investors included
              Benchmark, EQT Ventures, NFX, 776 Ventures, Y Combinator, and others. These amounts are funding raised,
              not cash available or runway. The public record reviewed here does not disclose tranche terms, liquidation
              preferences, debt, secondaries, current cash, burn, or pro forma ownership.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO003
            claimRefs:
