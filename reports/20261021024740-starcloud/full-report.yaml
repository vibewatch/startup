              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Operational and technical exposure
        blocks:
          - type: paragraph
            body: >-
              The first mission materially reduces feasibility risk but does not establish production reliability.
              Starcloud and CNBC report that Starcloud-1 carried an NVIDIA H100 and ran inference and training workloads
              in orbit, while Data Center Frontier describes the mission as a test of operation through vacuum,
              radiation, and thermal cycling. Commercial scale adds a different risk envelope. Control Plane estimates
              that rejecting one megawatt of waste heat would require roughly 1,200 square meters of radiator area, and
              CNBC cites analyst concerns about radiation, maintenance, debris, data governance, and space traffic.
              Starcloud-2 is still presented by the company as a future commercial mission with a GPU cluster, storage,
              and proprietary thermal and power systems. The residual exposure is therefore high until independently
              reviewed telemetry shows sustained thermal margins, error rates, uptime, recovery behavior, and workload
              performance rather than a successful demonstration alone.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR015
              - CR016
