      - number: '1.2'
        title: Leadership, founder fit, and governance
        blocks:
          - type: paragraph
            body: >-
              The disclosed founding team combines commercial strategy, spacecraft engineering, and large-scale software
              infrastructure. Philip Johnston is co-founder and CEO, with prior satellite-project work and finance and
              policy training; Ezra Feilden is co-founder and CTO, with deployable-space-structure experience; and Adi
              Oltean is co-founder and chief engineer, with prior Starlink-related and production GPU-cluster work. This
              is strong founder- market fit for the stated mission, but it also concentrates external financing,
              spacecraft architecture, and systems execution in three named founders. The assigned evidence does not
              disclose a complete executive bench, board composition, succession plan, ownership, or founder voting
              control, so governance resilience cannot yet be assessed.
