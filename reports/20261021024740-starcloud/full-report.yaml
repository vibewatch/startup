          label: On-orbit AI demonstrations
          detail: Starcloud reports that Starcloud-1 ran a Gemini version and trained a nanoGPT model.
          tone: positive
          claimRefs:
            - CO013
        - date: '2026-03-30'
          label: $170 million Series A announced
          detail: Independent reporting placed the round at a $1.1 billion valuation.
          tone: positive
          claimRefs:
            - CO006
        - date: '2026-04-02'
          label: Total capital reported above $200 million
          detail: Futurum and Via Satellite reported more than $200 million raised after the Series A.
          tone: neutral
          claimRefs:
            - CO007
        - date: '2026-04-24'
          label: Commercial disclosure gap persisted
          detail: Tech Insider reported no disclosed commercial revenue as of April 2026.
          tone: risk
          claimRefs:
            - CO016
        - date: '2026-08-21'
