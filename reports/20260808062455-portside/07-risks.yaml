  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Portside\u2019s risk profile is manageable but materially under-documented in public. The most important risks are cyber-regulatory burden, acquisition integration, financial opacity, and dependency on complex enterprise deployments. None is a thesis-killer by itself; together they demand disciplined diligence because they can all transmit into retention, margin, and valuation at the same time. Public evidence shows real mitigations\u2014security controls, sponsor backing, and integration-aware leadership\u2014but the missing proof set is still large. Investors should treat Portside as a promising platform with several risks that are solvable only if management can document operational rigor, current compliance readiness, and economic resilience."
  },
  "sections": [
    {
      "id": "severity-ranked-risk-overview",
      "title": "Severity-Ranked Risk Overview",
      "body": "Portside\u2019s risk profile is not dominated by a single existential red flag; it is defined by several medium-to-high severity issues that can reinforce one another. The most important are regulatory cybersecurity burden, acquisition-led integration complexity, financial opacity, and dependency on mission-critical customer deployments. Those categories matter because Portside is attempting to become a broad operating system for aviation rather than a narrow tool. That strategy can create scale and stickiness, but it also increases the blast radius when governance, reliability, or integration quality slips. The public record supports a constructive but disciplined interpretation: Portside appears to have meaningful mitigations and strong market relevance, yet too many material risks still require private evidence rather than public trust. That stacked nature is why this chapter focuses on transmission paths, not isolated one-off concerns.",
      "claimRefs": [
        "CR001",
        "CR034",
        "CR040"
      ],
      "figureRefs": [
        "FR001"
      ]
    },
    {
      "id": "regulatory-legal-and-security-risks",
      "title": "Regulatory, Legal, and Security Risks",
      "body": "The heaviest externally anchored risk is regulatory cybersecurity pressure. EASA\u2019s Part-IS regime now forces affected aviation organizations to implement structured information-security management, and the EASA FAQ makes clear that applicability, reporting, competencies, supplier interaction, and integration into existing management systems are non-trivial workstreams. GAO\u2019s 2026 review reinforces the broader point from the U.S. side: aviation cybersecurity oversight is still tightening, not stabilizing. Portside\u2019s own public trust surface is credible in outline but weak in freshness. The security policy documents useful controls such as AWS hosting, encryption, audit logs, and two-factor authentication, but the policy itself dates to 2018 and is not backed publicly by current third-party attestations. The privacy policy confirms that Portside handles sensitive operational, crew, maintenance, and financial data. The terms of service also remind investors that the website surface is provided as-is and that actual product contracts remain private. In other words, Portside\u2019s legal and security posture is not obviously broken, but its public proof package trails the regulatory direction of travel. The delta between documented controls and current external proof is therefore a real diligence item.",
      "claimRefs": [
