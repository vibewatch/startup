  topStrengths:
    - >-
      Real platform ambition in a fragmented aviation-software market, spanning ops, owner workflows, billing,
      safety/compliance, and adjacent airline/leasing workflows
    - >-
      Strong public customer proof at the top end, especially Clay Lacy and a broad operator/customer logo base across
      40+ countries
    - >-
      Sponsor-backed momentum with Vista and Insight plus a 2026 leadership transition explicitly oriented around
      platform integration and go-to-market scale
    - 'Clear land-and-expand logic: Portside can sell multiple workflows into the same operator account'
    - Aviation-specific software breadth is differentiated versus point-solution peers
  topRisks:
    - 'Public economics are too thin: no clean ARR, margin, burn, retention, or concentration disclosure'
    - 2024 and 2026 Vista transaction terms are undisclosed, so price and preference-stack risk remain unresolved
    - Acquisition-led expansion raises integration, support, and billing-process complexity risk
    - >-
      Public trust surface is dated relative to rising aviation cybersecurity expectations, especially for regulated
      operators
    - >-
      A single detailed billing complaint is not conclusive, but it is enough to justify diligence on service quality
      and post-acquisition operational controls
  unresolvedGaps:
    - Current ARR, revenue mix, gross margin, NRR/GRR, churn, and cash burn
    - Signed terms and cap-table impact of the 2024 and 2026 Vista transactions
    - Top-customer concentration and module penetration by account
    - Current security attestations, audit reports, uptime history, and regulated-customer compliance materials
    - Evidence that acquisition integration is improving quality rather than obscuring it
