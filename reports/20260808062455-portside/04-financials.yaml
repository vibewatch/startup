      "id": "capital-history-and-adequacy",
      "title": "Capital History and Adequacy",
      "body": "The disclosed financing chronology is clear only through early 2023. Portside publicly sized its 2021 Series A at $17 million and its February 2023 Series B at $50 million, with press coverage stating that total disclosed capital raised had exceeded $70 million at that point. The two strategically most important financings\u2014the Vista minority investment in 2024 and the follow-on Vista-led 2026 deal\u2014left both check size and valuation undisclosed. That matters because the 2026 transaction appears to have changed control dynamics and funded a new operating phase, yet outside investors still cannot tell whether the economics were sponsor-friendly, common-equity-friendly, or valuation-stretched. Public statements at least reveal intended use of funds. The 2024 investment was tied to product and customer expansion, while the 2026 investment explicitly targeted platform integration, AI-enabled roadmap work, and go-to-market scale. Portside\u2019s acquisition cadence, especially around Takeflite and LeaseWorks, also suggests that the capital plan is not just about organic SaaS growth; it is about funding integration, adjacency expansion, and enterprise platform consolidation. What public evidence does not reveal is just as important: there is no retained disclosure of cash balance, burn, runway, debt, or working-capital needs.",
