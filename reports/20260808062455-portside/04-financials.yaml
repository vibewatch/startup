    {
      "id": "traction-and-comparable-lenses",
      "title": "Traction and Comparable Lenses",
      "body": "Portside\u2019s public traction evidence is operational rather than financial. Official and trade-press sources support 1,300+ enterprise customers, 40+ countries, 330+ employees, and 15,000 aircraft on the platform, but they stop short of disclosing revenue quality. Low-confidence data providers add rough estimates\u2014Usearch suggests around $31.5 million of revenue and Tracxn still frames the company as a minicorn\u2014but those figures are not sufficiently reliable for underwriting. Public comparables are more transparent. Sabre offers a low-multiple travel-tech reference point, with stockanalysis showing about $2.77 billion of FY2025 revenue and a very depressed price-to-sales ratio. VSE offers an aviation-services and distribution reference point with about $1.11 billion of 2025 revenue and a far healthier market-cap profile. Honeywell and Amadeus show what larger, more diversified aviation-tech platforms look like at scale. The spread across these comps is the point: Portside can be a strategically attractive platform without public evidence being good enough to slot it confidently into any one multiple band.",
