    {
      "id": "exit-readiness-and-final-diligence",
      "title": "Exit Readiness and Final Diligence",
      "body": "Portside has enough strategic logic to be exit-relevant. Sponsor backing, category consolidation, customer breadth, and a platform narrative all matter to future buyers or public-market preparation. But exit readiness is not the same as exit timing. The company still needs to prove economic quality, integration execution, and compliance maturity in a way that outside investors can underwrite. That is why the final diligence asks are tightly valuation-linked. Investors need ARR, gross margin, net retention, concentration, cash burn, cap table, preference rights, and evidence that integration is improving product quality rather than obscuring it. The evidence that would move the recommendation up is concrete and knowable; the evidence that would move it down is equally clear. Until those asks are answered, Portside should remain on the active diligence track rather than in the priced-conviction bucket. Until then, return math is too assumption-heavy for a cleaner call.",
