    {
      "id": "scenario-ranges-and-comparables",
      "title": "Scenario Ranges and Comparables",
      "body": "Given the data gaps, scenario valuation is more credible than point valuation. Public comps clearly show dispersion. Sabre sits in a lower-multiple travel-tech regime. VSE is a transparent aviation-related operating company but not a pure SaaS analogue. Honeywell and Amadeus demonstrate that strong aviation platforms can support much better valuation support when quality, scale, and disclosure are stronger. The right takeaway is not to average them mechanically; it is to use them as guardrails. A bear case should assume that Portside is closer to the low-confidence public revenue estimate and that acquisition-driven complexity weighs on quality. A base case can support a mid-hundreds-of-millions enterprise value only as a conditional scenario. A bull case can reach unicorn territory only if private data proves materially stronger revenue, retention, and software-quality metrics than public evidence currently supports. In short, unicorn is an outcome that requires proof, not an assumption the current record earns. That is why the scenario ranges remain deliberately wide.",
