        "FV004"
      ]
    },
    {
      "id": "financing-context-and-thesis-balance",
      "title": "Financing Context and Thesis Balance",
      "body": "The financing context is unusually important because the current deal terms are exactly what public sources do not reveal. Portside disclosed the $50 million Series B in 2023, but neither the 2024 Vista investment nor the March 2026 follow-on Vista transaction disclosed amount or valuation. That alone makes any hard valuation claim suspect. The retained evidence also does not validate the user-supplied unicorn framing. In fact, a low-confidence secondary source still labels Portside a minicorn in August 2026. The thesis side of the ledger is still meaningful: Portside is consolidating a fragmented category, has real customer proof, and continues to attract software-savvy capital. The anti-thesis is just as real: economics, retention, preference structure, and sponsor terms are opaque. In valuation work, the anti-thesis matters disproportionately because missing economic evidence can destroy confidence faster than product quality can restore it. In other words, thesis strength cannot outrun financing opacity forever.",
      "claimRefs": [
        "CV003",
        "CV004",
