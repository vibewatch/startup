    {
      "id": "architecture-integrations-and-deployment",
      "title": "Architecture, Integrations, and Deployment",
      "body": "Public architecture evidence is incomplete but directionally useful. Horizon is explicitly described as 100% cloud-based, modular, configurable, and integration-ready, while the integrations page shows a long list of connections across scheduling, charter marketplaces, accounting, maintenance, and expense-management tools. That combination implies an architecture built around data movement and workflow orchestration rather than local desktop software. Optimizer is one of the few pages with operational specifics; it says Portside can optimize around aircraft and crew availability, maintenance, training, relocation cost, and risk, and usually returns results in under ten minutes while still allowing dispatchers to keep human control. Just as important, large-scale deployment proof exists. Clay Lacy\u2019s Avianis implementation is described as complex and enterprise-grade, and CJI reports Horizon had already been deployed at a large U.S. operator, though the customer is unnamed. Taken together, the strongest public technical message is not that Portside has exposed deep engineering detail; it is that the company has enough integration and implementation depth to support demanding flight departments.",
