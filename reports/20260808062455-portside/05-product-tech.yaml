    {
      "id": "trust-security-and-compliance",
      "title": "Trust, Security, and Compliance",
      "body": "Portside\u2019s trust posture is partially documented but not fully modernized in public. The security policy is detailed in operational terms: it says the stack runs on AWS, user passwords are hashed, browser-server traffic uses TLS 1.2/1.3, data at rest is encrypted with 256-bit AES, employee and user access is logged through AWS CloudTrail, and two-factor authentication is enforced for AWS and GitHub access. It also says backups support 30-day point-in-time restore and that annual third-party penetration testing is conducted. Those are credible controls, but the main weakness is age. The published policy is dated November 2018 and does not advertise current third-party attestations such as SOC 2 or ISO 27001 for Portside itself. That gap matters more in aviation now than it did in 2018. EASA\u2019s Part-IS regime and the GAO\u2019s 2026 review both point to a rising baseline for aviation cybersecurity governance, supplier oversight, and incident readiness. Portside likely feels that pressure as it sells software into operators handling safety-critical and regulated workflows.",
