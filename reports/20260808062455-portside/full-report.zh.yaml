            body: >-
              Portside 的公开牵引力证据是运营性的，而不是财务性的。官方和行业媒体来源支持 1,300 多家企业客户、40 多个国家、330 多名员工，以及平台上 15,000
              架飞机，但没有披露收入质量。低置信度数据提供商给出粗略估计——Usearch 称收入约 $31.5 million，Tracxn
              仍把公司归为迷你独角兽——但这些数字不够可靠，不能用于承销。公开可比公司透明得多。Sabre 提供了低倍数旅游科技参考点，stockanalysis 显示其 FY2025 收入约 $2.77
              billion，市销率非常低迷。VSE 提供航空服务和分销参考点，2025 年收入约 $1.11 billion，市值表现健康得多。Honeywell 和 Amadeus
              展示了更大、更多元的航空科技平台在规模化后的样子。这些可比之间的跨度本身就是重点：Portside 可以是一个有战略吸引力的平台，但公开证据还不足以把它有把握地放进某一个倍数区间。
