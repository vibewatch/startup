  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Portside
              的风险画像并非由单一生死级红旗主导，而是由几个中高严重度问题共同定义，这些问题还能相互强化。最重要的是监管网络安全负担、收购驱动的整合复杂度、财务不透明，以及对任务关键型客户部署的依赖。这些类别重要，因为
              Portside 试图成为航空领域的广义操作系统，而不是窄工具。这一策略可以创造规模和粘性，但当治理、可靠性或整合质量滑坡时，也会放大冲击半径。公开记录支持一个建设性但有纪律的解读：Portside
              看起来有实质缓释手段，也有强市场意义，但太多重要风险仍需要私下证据，而不能靠公开信任。正因为风险会堆叠，本章聚焦传导路径，而不是孤立的一次性担忧。
            claimRefs:
              - CR001
              - CR034
              - CR040
