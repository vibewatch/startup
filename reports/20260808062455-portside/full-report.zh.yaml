  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Portside
              的公开界面支持一个清晰定位：它想做商务航空操作系统，而不只是单点方案。产品、平台和解决方案页面显示，公司呈现的是一套统一栈，触及排班、签派、机主沟通、报表、计费、手册、人员配置、安全和相邻工作流需求。这很重要，因为航空软件中的买方价值，往往不来自某个单一模块，而是来自把碎片化日常工作缝进同一个运营环境。Horizon
              强化了这个定位。Portside 把 Horizon
              描述为面向更大、更复杂运营商的云端飞行管理系统，包括分时产权和喷气机卡项目；外部报道称，它旨在减少用户在多个平台之间来回切换。产品宽度也从核心运营向外延伸：客户获取和人员配置工具显示公司对需求生成和劳动力工作流有兴趣；报表、机主门户和计费则扩展了财务与服务层。结果是一张宽
              SKU 地图，能够支撑账户扩张，但也意味着公司必须让许多模块在差异很大的运营商类型之间保持连贯。
