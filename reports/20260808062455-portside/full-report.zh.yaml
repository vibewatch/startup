        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              Portside
              的客户故事首先是宽度。官方客户和解决方案页面显示，公司服务的不是单一买方画像；它覆盖管理公司、企业飞行部门、包机运营商、分时产权和喷气机卡项目、财务团队，甚至政府或军事机队。这种宽度有战略意义，因为它契合公司的平台叙事：Portside
              想坐在商务航空运营的中心，而不是某个边缘。地理范围也看起来有意义。官方材料支持 30 多个国家，2026 年 Vista 公告把数字提高到 40 多个国家。客户数量故事同样强，但不精确。公开披露从关于页面的
              1,000 多名客户，到 2026 年 3 月公告中的 1,300 多家企业客户不等；Corporate Jet Investor 则报道 1,200 多名客户和 15,000
              架飞机。这些差异更像时间点或计量口径不同，而不是真正矛盾，但仍意味着公开承销应依赖方向，而不是虚假的精确。面向排班人员、安全经理、财务团队和政府机队的补充解决方案页面进一步说明，Portside
              既按运营商类型分层，也按工作流角色分层；这对账户级扩张思路是有用信号。
