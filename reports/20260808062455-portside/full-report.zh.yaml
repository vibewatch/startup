            body: >-
              公开架构证据不完整，但方向上有用。Horizon 被明确描述为 100%
              云端、模块化、可配置、可集成；集成页面则展示了横跨排班、包机市场、会计、维修和费用管理工具的长连接清单。这种组合意味着架构围绕数据流动和工作流编排，而不是本地桌面软件。Optimizer
              是少数给出运营细节的页面之一；它称 Portside 可以围绕飞机和机组可用性、维修、培训、调机成本和风险做优化，通常在十分钟内返回结果，同时仍允许签派员保留人工控制。同样重要的是，大规模部署证明存在。Clay
              Lacy 的 Avianis 实施被描述为复杂且企业级；CJI 报道称 Horizon 已经部署在一家大型美国运营商，但客户未具名。放在一起看，最强的公开技术信息不是 Portside
              暴露了深层工程细节，而是公司有足够的集成和实施深度，能支撑要求很高的飞行部门。
