      - number: '2.2'
        title: 规模测算视角与需求背景
        blocks:
          - type: paragraph
            body: >-
              留存的规模测算来源支持这样一个判断：Portside 可寻址品类在金额上有意义，但它们不支持虚假的精确。窄口径下，Fortune Business Insights 估计航空 MRO 软件市场 2025 年约
              $8.14 billion、2026 年 $8.67 billion；Research and Markets 的估计略小，2025 年 $7.15 billion、2026 年 $7.48
              billion。这些数字有用，因为 Portside 触及连接维修的工作流，也竞争通常靠近维修、安全和运营团队的预算。宽口径下，Grand View Research
              把航空软件定义为覆盖飞行运营、MRO、机组和劳动力工具、安全 / 合规、分析、旅客系统和设计软件的品类——足以显示结构性需求，但过宽，不能直接当作 Portside 的 TAM。Honeywell 的 2025
              年商务航空展望，是最有决策价值的自上而下需求来源。它预测未来十年将交付 8,500 架新喷气机、价值 $283 billion；预计 2026 年交付量比 2025 年增长 5%；并报告 91% 的受访运营商预计
              2026 年飞行量持平或更多。Portside 已经瞄准的细分市场需求尤其有韧性：分时产权机队自 2019 年以来增长超过 65%，Part 135 运营商的订购意向也处于高位。
