      claimRefs: []
  foundingLocation: San Francisco, California, USA
  headquarters: San Francisco, California, USA
  productSummary: >-
    一体化航空软件平台，覆盖排班和运营（包括 Horizon 和 Avianis 界面）、机主沟通、分析、托管计费、安全 / 合规、疲劳风险管理、人员配置，以及差旅和相邻运营工作流。技术栈优先云端、重集成，并受到
    Baldwin、Takeflite、LeaseWorks 等收购塑形。
  customerFocus: 商务和企业航空运营商、管理公司、包机和托管机队、分时产权和喷气机卡运营商、政府机队，以及部分区域商业航空 / 租赁工作流。公开客户证明在 Clay Lacy 等大型运营商和客户页面上有引用支持的案例中最强；留存和集中度仍未披露。
