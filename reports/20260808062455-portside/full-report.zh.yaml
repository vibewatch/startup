  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >-
              Portside 的市场定义要足够窄，才对决策有用；也要足够宽，才能反映公司的真实销售方式。最窄的可信边界是商务航空运营软件：为飞行部门、包机运营商、分时产权运营商、FBO
              相邻工作流和部分政府机队提供排班、签派、机组协调、连接维修的可视性、安全 /
              合规工作流、机主沟通、计费和分析。这个范围明显小于大型分析机构口中的「航空软件」，后者还可能包括机场旅客系统、空中交通管理、设计与仿真软件，以及 Portside 今天并不直接服务的其他品类。它也比 MRO
              软件等单点品类更宽，因为 Portside 自身方案横跨运营、财务和客户面对面的工作流。相邻生态重要，是因为 Portside 接入它们，而不是完全替代它们：Avinode
              等包机市场、CAMP、CORRIDOR、Veryon 等维修系统，以及 Leon、Avianis 等飞行业务同行，都会影响 Portside
              能拿到的钱包份额。因此，正确边界不是一个单一的庞大市场桶，而是一层一体化航空运营软件，并向租赁、维修和市场数据有实质相邻延伸。
