      - number: '7.2'
        title: 监管、法律与安全风险
        blocks:
          - type: paragraph
            body: >-
              外部锚定最重的风险是监管网络安全压力。EASA 的 Part-IS 制度如今要求受影响航空组织实施结构化信息安全管理；EASA FAQ
              清楚表明，适用性、报告、能力、供应商互动，以及接入现有管理系统，都是不轻的工作流。GAO 2026 年审查从美国侧强化了更广的判断：航空网络安全监督仍在收紧，而不是稳定下来。Portside
              自身公开信任界面在轮廓上可信，但新鲜度不足。安全政策记录了 AWS 托管、加密、审计日志和双因素认证等有用控制，但政策本身日期为 2018 年，公开层面没有当前第三方认证背书。隐私政策确认 Portside
              处理敏感的运营、机组、维修和财务数据。服务条款也提醒投资人，网站界面按原样提供，真实产品合同仍是私下的。换句话说，Portside
              的法律和安全姿态并不明显破裂，但公开证明包落后于监管走向。因此，已记录控制与当前外部证明之间的差距，是一个真实尽调项。
