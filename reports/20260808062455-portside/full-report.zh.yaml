      - number: '2.4'
        title: 增长驱动、约束与待问问题
        blocks:
          - type: paragraph
            body: >-
              Portside
              所在市场的增长逻辑并不难讲清。商务航空需求保持健康，包机和分时产权活动仍有支撑，运营商越来越需要把碎片化旧工具中的数据打通。安全和网络安全义务也在上升，这有利于能提供运营可审计性和可重复工作流的软件层。Portside
              自身材料正是围绕这些驱动展开：模块化集成、跨系统报表、复杂运营商支持，以及最近的 AI
              赋能路线图。更难的是采用节奏和可服务市场的精度。任务关键型系统的切换成本很高，因为飞行排班、维修、财务和合规数据深嵌在日常运营中。买方往往需要定制规则、混合部署和渐进式集成，而不是快速撕掉重换。监管负担能加速支出，但如果客户要求安全、可审计性或地理托管控制证明，也会放慢供应商选择。这种张力解释了为什么广义
              TAM 数字容易找到，而 Portside 特定的 SAM 或 SOM
              数字并不好找。剩下最有价值的尽调问题都很实际：按运营商类型拆分收入结构、不同模块组合的典型合同价值、云端与定制环境的部署拆分，以及租赁、安全或维修相邻领域的附加率。
            claimRefs:
              - CM025
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
