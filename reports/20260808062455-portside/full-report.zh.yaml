      - number: '4.4'
        title: 财务判断与阻碍
        blocks:
          - type: paragraph
            body: >-
              因此，公开财务判断是混合的，但并不含糊。Portside
              有真实商业牵引力、蓝筹投资人和足够宽的平台，能够支撑一个有意义的企业软件结果。但它没有给出形成有把握定价投资观点所需的经济性披露。缺失指标是根本性的，不是装饰性的：ARR、毛利率、服务收入占比、NRR、流失率、现金、烧钱、跑道、债务和合同结构。公开证据确实同时提示上行和风险。上行侧，Vista
              2024 年参与意味着这家软件业务很可能至少跨过了一个不低的 ARR 底线，2026 年交易则显示赞助方信心延续。风险侧，公司的重收购策略很可能带来真实整合成本；一条 Trustpilot
              计费投诉则围绕收购后开票纪律提出了一个小但非零的收入质量问题。正确的投资人姿态不是假设公司弱，而是坚持看证据。在 Portside
              披露更多收入质量、单位经济性和资本充足性之前，公开可比可以框定思考，但无法完成承销案例。
