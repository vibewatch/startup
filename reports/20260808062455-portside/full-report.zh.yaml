      - number: '1.3'
        title: 资本历史与所有权背景
        blocks:
          - type: paragraph
            body: >-
              Portside 到 2023 年为止的披露融资历史异常清晰，此后则明显不透明。2021 年 Series A 融资 $17 million，投资人中包括 Tiger Global 和
              Dragoneer。2023 年 2 月 Series B 增加 $50 million，由 Insight Partners 领投，将已披露累计融资推高至 $70 million
              以上。接下来的两次融资在战略上更重要，但经济性更不透明。2024 年 5 月，Vista 的 Endeavor Fund 领投少数股权成长投资，Insight 也参与，Ben Benson 加入董事会。2026
              年 3 月，Vista 通过一笔新投资加深持仓，并与 Brandon Holden 接任 CEO 同步发生；官方新闻稿称 Insight 仍是重要股东。留存的 2024 年或 2026
              年融资来源均未披露支票规模、持股比例、债务条款或估值。最具体的经济线索是间接的：Vista 称其 Endeavor Fund 投向经常性收入至少达到 $10 million 的高增长软件企业，意味着
              Portside 很可能在 Vista 首次投资时已跨过该门槛。但这并不等同于收入披露，公开投资人仍无法获得足够信息，去确认估值纪律、稀释，或当前所有权结构中是否存在清算优先权悬顶。
