      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              留存来源集指向 Alek Vernitsky 和 Alek Strygin 是 Portside 的联合创始人，最强的公开创立年份证据集中在 2017 年，而不是无来源背景笔记中偶尔出现的 2014-2015
              年区间。2026 年 3 月 Vista 交易，是 Portside 公开历史中最清晰的治理拐点。Brandon Holden 出任 CEO；此前他曾领导 Eptura，并在
              LogicMonitor、Accruent 和 Forcepoint 担任高级职位。Vernitsky 没有完全退出业务，而是继续以董事和战略顾问身份参与，重点放在产品愿景、AI
              和大客户互动。同一公开记录也显示，Vista 在治理中的位置越来越核心：Ben Benson 随 2024 年少数股权投资加入董事会，Vista 对 2026
              年的表述则把公司定位为从纪律化的早期增长，转向更广的运营整合和 AI 赋能扩张。因此，创始人和投资人层面的治理连续性相当强，但关键人依赖仍然明显，因为 2026
              年交接把日常领导权从创始人手中移开，同时产品可信度和复杂企业关系仍要依赖他。
