      - number: '2.3'
        title: 买方地图与采用路径
        blocks:
          - type: paragraph
            body: >-
              Portside
              的买方地图是多层的。最清晰的核心细分包括企业飞行部门、包机和托管机队、政府或军事式运营。各细分都需要排班、可视性和合规，但价值驱动和部署摩擦不同。企业飞行部门看重运营控制、预算可视性、机主报告和维修可视性。包机和分时产权运营商更直接看重报价、签派、机主支付结构、开票和收入吞吐。政府和安全敏感客户看重安全纪律、排班优化、部署控制和定制工作流，有时还包括私有云或本地部署要求。每类客户的日常用户都远不止一个签派员：排班人员、飞行员、维修人员、会计、管理层和机主都会读取或更新数据。预算归属同样分散；视机队类型而定，可能在航空总监、COO、CFO
              或机主服务负责人手里。这点很重要，因为 Portside 通常不是轻量级部门工具。采用往往从一个紧迫工作流开始——排班、报表或安全——只有在平台证明自己能接入旧
              OPS、会计、市场和维修系统且不打断运营后，才会扩张。
