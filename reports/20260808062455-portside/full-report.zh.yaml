  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与替代方案集合
        blocks:
          - type: paragraph
            body: >-
              Portside 的竞争场不是简单的一对一对决。直接同行集中在 Avianis 和 Leon
              这类一体化飞行运营平台，两者都围绕排班、签派、机组、报价和配套记录销售端到端能力。核心之外还有一圈相邻专业厂商：Avinode 做包机市场流动性和工作流，CAMP 和 CORRIDOR
              做以维修为中心的运营，Veryon
              做云端维修智能。实际替代集合还要更宽。许多运营商继续运行多个系统，靠电子表格、手工报表或内部数据工作把它们接起来；一些更大或安全敏感的账户也有能力内部自建或做高度定制部署。Portside
              自己强调集成、定制方案和私有云 / 本地部署选项，本质上也承认了这种现实。结果是，客户经常用一堆工具完成同一个任务，而不是只靠一家供应商。这有利于能共存并扩张的平台，但也让品类份额更难锁定。
