      - number: '1.4'
        title: 里程碑、战略与未解缺口
        blocks:
          - type: paragraph
            body: >-
              Portside 的公开里程碑记录读起来不像单一产品 SaaS 公司，更像商务航空软件里的品类整合策略。2022 年收购 PFM 和 SeaGil/BART，扩大了排班和签派覆盖。2023 年 Baldwin
              加入安全和合规能力。2024 年 Takeflite 扩大了对商业和商务航空运营的触达。2024 年 LeaseWorks 把平台延伸到飞机租赁和金融，公司明确把它称为新的相邻领域。2025 年 Horizon
              发布后，Portside 又被重新包装成面向更大、更复杂运营的广义云原生飞行管理平台。Clay Lacy 2025 年 10 月采用 Avianis，为 Portside
              能部署进大规模、高运营要求机队这一主张提供了真实客户证明。但正向轨迹不是全部。2025 年一条 Trustpilot 评论指称，与 BART 迁移有关的发票周期混乱和过度计费；Portside
              公开发布的安全和条款政策仍停留在 2018 年。这些信号并不否定公司的增长叙事，但说明面向公众的控制和披露没有跟上产品与所有权复杂度的变化。最大的未解缺口仍是估值：2026 年 3 月 Vista
              交易显然改变了控制权动态，但公开证据仍无法确认价格、独角兽估值，或投资人形成有把握承销观点所需的详细资本结构。
