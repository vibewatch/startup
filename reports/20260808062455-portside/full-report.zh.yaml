      - - 安全 / 合规领导力
        - 需要匹配运营方不断上升的预期
        - 中
        - 高
        - 已记录现有控制
        - 审查安全组织架构和责任归属
    notes: 执行风险集中在组织变化与产品广度交叉处。
    claimRefs:
      - CR027
      - CR028
      - CR029
      - CR035
  - id: TR005
    title: 缓释与终止标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 集成质量
        - 上线问题或产品碎片化证据
        - 两个或以上大客户访谈提到延迟或破裂的集成
        - 暂停或重定价估值假设
      - - 网络合规准备度
        - 缺少当前审计证据
        - 管理层无法提供现代证明或准备资料包
        - 升级尽调；潜在投资逻辑破裂
      - - 计费 / 服务质量
        - 与开票或支持缺口相关的重复投诉
        - 模式超出孤立投诉
        - 下调留存和利润率假设
      - - 资本充足性不透明
        - 管理层不提供核心指标
        - 尽调中没有 ARR、烧钱、现金跑道或集中度披露
        - 不承销增长倍数
      - - 领导层执行
        - 新 CEO 没有可衡量的整合进展
        - 6-12 个月内没有具体平台统一里程碑
        - 提高执行风险折扣
    notes: 这些触发因素把定性担忧转化为可投资的监测规则。
    claimRefs:
      - CR037
      - CR038
      - CR039
      - CR040
  - id: TV001
    title: 投资建议摘要表
    columns:
      - 投资建议
      - 置信度
      - 风险评级
      - 估值立场
      - 决策含义
    rows:
      - - 继续研究 / 观察
        - 中
        - 高
        - 不要仅凭公开证据承销高溢价价格
        - 只有在价格纪律和完整私有尽调下才继续推进
    notes: 投资建议反映证据充分性，而不是怀疑 Portside 的战略相关性。
    claimRefs:
      - CV001
      - CV002
      - CV039
      - CV040
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 什么会改变看法
    rows:
      - - Portside 正在打造拥有真实客户和赞助方支持的广义航空软件平台
        - 若私有指标显示强 ARR 增长、留存和利润率质量，则上调
      - - 当前融资背景过于不透明，无法支持定价 conviction 判断
        - 若披露且有吸引力的 2024/2026 年条款和股权结构表，则上调
      - - 集成可以创造护城河和钱包份额
        - 若管理层展示清晰的平台统一里程碑，则上调
      - - 集成和服务复杂度也可能摧毁质量
        - 若投诉、流失或实施延迟扩大，则下调
    notes: 表格两侧都对证据敏感，也对价格敏感。
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV018
      - CV037
      - CV038
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 悲观
        - $25M-$40M 收入区间；服务占比较重；留存可见度弱；低个位数销售倍数
        - ~$150M-$300M EV；从当前未知价格看上行有限
        - 计费 / 集成问题、倍数压缩、赞助方条款悬置
        - 公开证据无需激进假设即可支撑该情景
      - - 基准
        - $35M-$60M 收入区间；集成混合但在改善；软件质量中等；中个位数到高个位数倍数
        - ~$300M-$600M EV；只有入场有纪律才有吸引力
        - 仍需证明 NRR、利润率和集中度
        - 要求私有指标至少扎实
      - - 乐观
        - $60M-$90M+ 收入；强 NRR；软件占比高的利润率；整合成功；高端平台倍数
        - ~$700M-$1.1B EV；独角兽可能，但取决于证明
        - 执行失误或经济性偏弱会快速压垮溢价
        - 今天保留的公开证据不支持
    notes: 情景区间是有条件的建模带，不是推断出的当前价值。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Exhaustive set of the public comparable references retained for this chapter: Sabre, VSE, Honeywell, and
        Amadeus.
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Sabre
        - 公开旅游科技收入和市值
        - 低倍数公开市场参考
        - 有用的保守低倍数锚
        - 增长质量和资本结构不同
      - - VSE
        - 具备 SEC 透明度的航空相关公开运营公司
        - 市值 / 收入画像高于 Sabre
        - 有用的执行和披露可比对象
        - 不是纯航空 SaaS 公司
      - - Honeywell
        - 大型多元化航空航天 / 工业平台
        - 规模巨大，投资者信心更健康
        - 展示质量和规模能获得什么定价
        - 过于多元化且成熟，不能直接映射
      - - Amadeus
        - 大型旅游科技平台
        - 披露和平台经济性强于 Portside 公开提供的信息
        - 有用的质量上限参考
        - 市场组合不同，规模大得多
    notes: 这些可比公司是纪律工具，不是直接相似对象。
    claimRefs:
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
  - id: TV005
    title: 投资逻辑破裂和终止触发器表
    columns:
      - 触发器
      - 阈值
      - 向投资逻辑的传导
      - 行动含义
    rows:
      - - 无披露的高溢价价格
        - 卖方期待类似独角兽价格，但仍不提供关键指标
        - 打破价格纪律，放大信息风险
        - 退出或重分类为观察名单
      - - 私有留存 / 利润率数据偏弱
        - NRR、流失或毛利率显著低于软件质量预期
        - 削弱平台质量逻辑
        - 下调情景区间
      - - 集成表现不佳
        - 管理层无法展示可信的统一里程碑
        - 削弱护城河并增加成本负担
        - 提高执行折扣或停止流程
      - - 网络 / 合规证明缺口
        - 面向受监管客户没有当前审计或准备资料包
        - 抬高客户信任和企业销售风险
        - 等待修复后再投资
    notes: 终止触发器设计成可在尽调中监测，而不是哲学判断。
    claimRefs:
      - CV028
      - CV029
      - CV032
      - CV038
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 当前 ARR 和收入结构
        - 细分和模块层面的经常性收入
        - 估值的主要规模锚点
        - 管理层 / 财务尽调
      - - 毛利率和服务负担
        - 纯软件和混合毛利率
        - 区分真实 SaaS 质量和服务重型增长
        - 财务尽调
      - - 留存和集中度
        - NRR、GRR、流失、头部客户暴露
        - 决定耐久性和下行风险
        - 收入运营 / 客户成功尽调
      - - 资本堆栈
        - 2024 和 2026 年条款、股权结构表、优先权
        - 改变有效入场价格和回报
        - 法律 + 赞助方尽调
      - - 集成路线图
        - 里程碑、客户迁移、支持指标
        - 决定平台逻辑是否生效
        - 产品 / 运营尽调
      - - 安全和合规资料包
        - 当前审计、问卷、事件历史
        - 评估企业和受监管客户信任所必需
        - 安全尽调
    notes: 这些问题是从叙事走向承销所需的最低资料包。
    claimRefs:
      - CV035
      - CV037
      - CV040
