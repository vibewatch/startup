      - number: '8.2'
        title: 融资背景与投资逻辑平衡
        blocks:
          - type: paragraph
            body: >-
              融资背景格外重要，因为当前交易条款恰恰是公开来源没有透露的部分。Portside 披露了 2023 年 $50M 的 Series B，但 2024 年 Vista 投资和 2026 年 3 月 Vista
              追加交易都没有披露金额或估值。仅凭这一点，任何硬估值判断都值得怀疑。保留下来的证据也无法验证用户给出的独角兽叙事。事实上，一个低置信度二级来源在 2026 年 8 月仍把 Portside
              标成迷你独角兽。投资逻辑一侧仍然有分量：Portside
              正在整合一个碎片化品类，有真实客户证明，也持续吸引懂软件的资本。反向逻辑同样真实：经济性、留存、优先权结构和赞助方条款都不透明。做估值时，反向逻辑权重更高，因为缺失经济证据会比产品质量修复信心的速度更快地摧毁信心。换句话说，投资逻辑再强，也不可能永远跑赢融资不透明。
            claimRefs:
              - CV003
