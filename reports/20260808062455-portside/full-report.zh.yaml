  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              Portside
              的公开产品界面支持一个直接的高层模型：向需要排班、报表、机主服务、计费、安全和相邻工作流覆盖的运营商销售多模块航空软件。最可能的收入引擎是经常性订阅软件。话虽如此，同一批产品和交易材料也强烈暗示，公司还有不可忽视的实施和集成收入，因为
              Portside 反复强调复杂部署、定制方案、集成工作和售后客户成功投入。这不是消费者式自助产品。它更像企业级或高端中端市场航空 SaaS
              销售动作：软件订阅可能承载长期价值，但服务、上线和变更管理工作对获客和交付同样重要。公开定价透明度几乎不存在。留存的 Portside 页面没有列出标价，更广品类也把精确定价藏在演示销售流程背后。因此，对
              Portside 变现的最佳公开解读是结构性的，而不是数字性的：经常性软件收入高度可能，专业服务很可能有实质占比，而实际价格 / 折扣行为完全未披露。
