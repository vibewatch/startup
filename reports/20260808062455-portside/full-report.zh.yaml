              运营上，Portside 最大的风险是复杂度。公司如今横跨排班、机主支持、计费、安全、疲劳管理、人员配置、差旅服务，以及通过 Takeflite
              和其他收购进入的航空公司导向软件。管理层声明的战略是把这些界面统一成更宽的平台，但同样的野心也提高了整合延迟、支持不一致和跨系统故障的概率。Trustpilot
