      - number: '8.4'
        title: 退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              Portside
              的战略逻辑足以让它具备退出相关性。赞助方支持、品类整合、客户广度和平台叙事，都会影响未来买家或公开市场准备。但退出准备度不等于退出时点。公司仍需以外部投资者能够承销的方式，证明经济质量、整合执行力和合规成熟度。这也是最终尽调问题与估值紧密绑定的原因。投资者需要
              ARR、毛利率、净留存、集中度、现金消耗、股权结构表、优先权，以及整合是在提升产品质量而不是遮蔽质量的证据。能上调投资建议的证据具体且可知；会下调建议的证据也同样清楚。在这些问题得到回答之前，Portside
              应留在主动尽调轨道，而不是进入已定价的高 conviction 桶。在此之前，回报数学对假设依赖太重，难以给出更干净的判断。
