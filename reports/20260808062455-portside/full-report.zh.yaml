      - number: '4.2'
        title: 资本历史与充足性
        blocks:
          - type: paragraph
            body: >-
              已披露融资时间线只到 2023 年初还算清楚。Portside 公开披露 2021 年 Series A 为 $17 million、2023 年 2 月 Series B 为 $50
              million；新闻报道称当时已披露累计融资超过 $70 million。战略上最重要的两笔融资——2024 年 Vista 少数股权投资，以及 2026 年 Vista
              领投的跟投交易——都没有披露支票规模和估值。这很关键，因为 2026
              年交易似乎改变了控制权动态，并为新的运营阶段提供资金，但外部投资人仍看不出经济性是更有利于赞助方、普通股，还是估值已经拉伸。公开表述至少透露了资金用途。2024 年投资绑定产品和客户扩张；2026
              年投资则明确瞄准平台整合、AI 赋能路线图和商业化扩张。Portside 的收购节奏，尤其是 Takeflite 和 LeaseWorks，也说明资本计划不只是支持有机 SaaS
              增长；它是在为整合、相邻扩张和企业平台整合提供资金。公开证据没有透露的部分同样重要：留存披露中没有现金余额、烧钱、跑道、债务或营运资本需求。
