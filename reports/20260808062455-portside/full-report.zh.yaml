      - number: '8.3'
        title: 情景区间与可比公司
        blocks:
          - type: paragraph
            body: >-
              数据缺口这么多，情景估值比点估值更可信。公开可比公司清楚显示分化。Sabre 处在较低倍数的旅游科技区间。VSE 是透明的航空相关运营公司，但不是纯 SaaS 对标。Honeywell 和 Amadeus
              说明，质量、规模和披露更强时，强航空平台可以获得更好的估值支撑。正确结论不是机械取平均，而是把它们当护栏。悲观情景应假设 Portside
              更接近低置信度公开收入估计，且收购驱动的复杂度拖累质量。基准情景只能有条件地支撑数亿美元中段的企业价值。乐观情景只有在私有数据证明收入、留存和软件质量指标明显强于当前公开证据时，才可能达到独角兽区间。简言之，独角兽是一种需要证明的结果，不是当前记录已经赢得的假设。因此，情景区间刻意保持较宽。
