  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Portside
              的公司质量和投资准备度不是一回事。保留下来的证据支持这样一家公司：业务真实，平台野心不小，赞助方强，客户触达广，产品深度也足以产生影响。但在估值未披露的情况下，这些证据不足以支持有把握的定价建议。这里的判断就落在这个区别上：Portside
              是继续研究 /
              观察标的，不是基于公开证据即可买入的标的。实际操作中，投资者应明确对价格敏感。若公司以有纪律的入场估值出售，并提供干净的私有经济指标，底层业务值得认真接触。若要价已经假设了高端软件倍数或独角兽级价格，公开记录不支持为此加价。因此，这是一项关于证据充分性和入场纪律的建议，并非否定公司的战略潜力。本章也把纪律本身视为资产，因为避免买贵就是回报逻辑的一部分。
            claimRefs:
              - CV001
              - CV002
              - CV028
              - CV039
              - CV040
