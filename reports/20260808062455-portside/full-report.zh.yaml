chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、规模与足迹
        blocks:
          - type: paragraph
            body: >-
              Portside 留存下来的公开材料一贯把公司定位成云端软件提供商，服务的是航空运营后台，而不是单点工具。产品叙事覆盖排班、安全和合规、机主支持、报表、开票、人员配置，以及 2024
              年收购之后的租赁工作流。地点信号最充分的是 San Francisco：2023 年 Series B 新闻稿、2024 年 Vista 公告和 2026 年投资新闻稿都称 Portside 总部位于 San
              Francisco。与此同时，Portside 隐私政策列出 North Carolina 州 Durham 的邮寄地址，关于页面描述团队分布在 California、Texas、North
              Carolina、Ukraine 和 Kazakhstan，这更像分布式运营足迹，而不是单办公室公司。公开规模声明随时间抬升。2023 年 Series B 新闻稿称覆盖 30 多个国家的 700
              多家运营商。当前关于页面称拥有 1,000 多名客户和 10,000 多架飞机。2026 年 3 月 Vista 公告把口径提升到 1,300 多家企业客户、40 多个国家和 330
              多名专业人员。Corporate Jet Investor 的第三方行业报道在客户规模方向上相符，但飞机数量更高，称 2026 年达到 15,000
              架。这些指标能说明品类存在感，但仍是管理层报告的数据，而非独立审计的运营统计。
