companyProfile:
  summary: >-
    Portside 是一家由赞助方支持的航空软件公司，起步于商务航空报表和机主工作流，随后扩展成更宽的操作系统，覆盖排班、签派、计费、安全 / 合规、优化、人员配置、区域商业航空软件以及租赁和金融相邻工作流。留存的公开证据支持
    1,300 多家企业客户、覆盖 40 多个国家，以及 2026 年在 Vista 追加资本支持下的领导层交接。公司的战略强项是能在碎片化品类里提供足够宽的平台；公开证据的弱项是经济性不透明，尤其是当前收入、留存、利润率，以及
    2024 年和 2026 年 Vista 交易未披露的条款。
  foundedDate: '2017-01-01'
  founders:
    - name: Alek Vernitsky
      role: 联合创始人兼前 CEO
      background: 带领 Portside 完成早期产品扩张，并在 2026 年 CEO 交接后继续以战略顾问和董事身份参与公司。
      claimRefs: []
    - name: Alek Strygin
      role: 联合创始人
