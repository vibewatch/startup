      - number: '5.3'
        title: 信任、安全与合规
        blocks:
          - type: paragraph
            body: >-
              Portside 的信任姿态有部分文档支撑，但公开层面没有完全现代化。安全政策在运营术语上相当详细：称技术栈运行在 AWS 上，用户密码经过哈希处理，浏览器和服务器之间的流量使用 TLS
              1.2/1.3，静态数据用 256-bit AES 加密，员工和用户访问通过 AWS CloudTrail 记录，并对 AWS 和 GitHub 访问强制双因素认证。它还称备份支持 30
              天时间点恢复，并每年进行第三方渗透测试。这些控制可信，但主要弱点是年代太久。已发布政策日期为 2018 年 11 月，并没有为 Portside 自身展示当前第三方认证，例如 SOC 2 或 ISO
              27001。这个缺口在今天的航空业比 2018 年更重要。EASA 的 Part-IS 制度和 GAO 2026
              年审查都指向一个正在上升的基线：航空网络安全治理、供应商监督和事件准备度要求越来越高。Portside 向处理安全关键和受监管工作流的运营商销售软件，很可能感受到这种压力。
