              风险画像里，人员和资本端可控，但并不轻。Portside 在 2026 年 3 月更换 CEO，同时又把平台整合、AI
              路线图和市场扩张都列为当前重点。这样的节点可能让成熟操盘手大幅提升执行力，也可能在整合复杂度超过领导层带宽后停滞。Brandon Holden
