  topStrengths:
    - 航空软件市场高度碎片化，Portside 的平台化野心真实存在，覆盖运营、机主工作流、计费、安全 / 合规，以及相邻的航空公司 / 租赁工作流
    - 高端客户公开证据很强，尤其是 Clay Lacy，以及覆盖 40+ 个国家的广泛运营商 / 客户 logo 基础
    - Vista 和 Insight 支持带来动能，2026 年领导层交接也明确围绕平台整合和 go-to-market 扩张展开
    - 落地后扩张逻辑清楚：Portside 能向同一个运营商账户销售多个工作流
    - 相比点状解决方案同业，航空专用软件宽度更有差异化
  topRisks:
    - 公开经济数据太薄：没有干净的 ARR、利润率、烧钱速度、留存或集中度披露
    - 2024 年和 2026 年 Vista 交易条款未披露，因此价格和优先股堆叠风险仍未解决
    - 靠收购扩张会抬高整合、支持和计费流程复杂度风险
    - 航空网络安全预期持续上升，尤其是受监管运营商；Portside 的公开信任披露显得偏旧
    - 一条详细计费投诉并不能定论，但足以支持继续尽调服务质量和收购后运营控制
  unresolvedGaps:
    - 当前 ARR、收入结构、毛利率、NRR/GRR、流失率和现金消耗
    - 2024 年和 2026 年 Vista 交易的已签条款及其对股权结构表的影响
    - 头部客户集中度，以及按账户划分的模块渗透率
    - 当前安全认证、审计报告、正常运行时间历史和受监管客户合规材料
    - 证明收购整合正在提升质量、而不是掩盖问题的证据
