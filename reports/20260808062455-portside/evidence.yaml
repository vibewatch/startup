evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: identity-conflict
    missingEvidence: Authoritative corporate record or management-confirmed statement on the current headquarters and founding date.
    whyItMatters: >-
      Identity facts anchor every later chapter and conflicting HQ or founding-year assumptions can distort market
      history and governance analysis.
    diligencePath: >-
      Request secretary-of-state filings, cap-table package, and an investor deck that states incorporation date and
      principal office.
    relatedQuestionRefs:
      - QO002
      - QO003
      - QO019
  - type: private-evidence-only
    severity: material
    topic: valuation-disclosure
    missingEvidence: >-
      March 2026 valuation, check size, ownership percentages, and any liquidation preferences or debt tied to Vista’s
      investment.
    whyItMatters: >-
      Without price and structure, investors cannot determine whether Portside actually crossed a unicorn threshold or
      whether current entry terms are investable.
    diligencePath: >-
      Obtain the 2026 term sheet, board consent package, updated capitalization table, and any related financing or
      refinancing schedules.
    relatedQuestionRefs:
      - QO013
      - QO015
      - QO024
      - QO025
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-coverage
    missingEvidence: Full executive roster and board composition as of the post-March 2026 organization.
    whyItMatters: A fuller org chart would sharpen key-person dependence, succession resilience, and governance analysis.
    diligencePath: Request an updated org chart and board list from management or investor materials.
    relatedQuestionRefs:
      - QO007
      - QO008
      - QO010
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
