      ]
    },
    {
      "id": "expansion-and-concentration-view",
      "title": "Expansion and Concentration View",
      "body": "Portside\u2019s expansion case is easier to support than its concentration case. The product set spans owner experience, reporting, billing, scheduling, safety, staffing, and analytics, so an operator that lands with one workflow can plausibly expand into several others. Horizon\u2019s move upmarket into larger and more complex operators reinforces that land-and-expand story. Concentration is the opposite. The broad logo wall and multi-segment reach suggest diversification, but there is no public revenue breakdown by customer, no top-account disclosure, and no module-penetration data. This means investors should not assume concentration is low simply because logos are numerous. The most honest public reading is that Portside appears to have real breadth and credible account-expansion vectors, while concentration and durability remain unresolved without private customer data. Travel-adjacent tools such as hotel and car reservations also suggest Portside wants to widen its share of the operational wallet once it is embedded.",
