    {
      "id": "named-customer-proof-and-adoption-quality",
      "title": "Named Customer Proof and Adoption Quality",
      "body": "The official customer page provides real but uneven evidence. Airshare, Mayo Aviation, and Wing Aviation appear with quote-backed testimonials, which is stronger than logos alone because the quotes describe the jobs being done: owner transparency, clearer billing, and better information sharing. Clay Lacy is the strongest named proof in the retained set because three sources\u2014Portside, Clay Lacy itself, and Corporate Jet Investor\u2014describe the Avianis deployment and its intended workflow scope. That matters because it demonstrates production use at a large, operationally complex customer. Beyond those top references, however, Portside\u2019s large logo wall becomes harder to audit. The company clearly has many named relationships, but most of them lack public module detail, go-live dates, or measurable outcomes. As a result, Portside\u2019s adoption proof is strongest at the high end of named customers and weaker across the long tail.",
      "claimRefs": [
        "CU007",
        "CU008",
        "CU009",
        "CU010",
        "CU011",
        "CU012",
        "CU026"
      ],
      "tableRefs": [
