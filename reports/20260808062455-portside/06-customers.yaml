  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Portside\u2019s public customer story is convincing on breadth and existence, and only partly convincing on durability. Official materials support a multi-segment, international installed base, while named references such as Clay Lacy, Airshare, Mayo Aviation, and Wing Aviation provide useful production-style proof. But the public record becomes much thinner once diligence moves from \u201cwho uses it?\u201d to \u201chow sticky and profitable are those relationships?\u201d There is no public NRR, churn, contract-term, or concentration disclosure. The result is a positive but incomplete customer case: Portside appears to have real adoption and plausible land-and-expand economics, yet durability and concentration still require private evidence."
  },
  "sections": [
    {
      "id": "customer-base-and-segmentation",
      "title": "Customer Base and Segmentation",
      "body": "Portside\u2019s customer story starts with breadth. The official customer and solution pages show that the company is not serving a single buyer archetype; it addresses management companies, corporate flight departments, charter operators, fractional and jet-card programs, finance teams, and even government or military fleets. That breadth is strategically important because it aligns with the company\u2019s platform narrative: Portside is trying to sit at the center of business-aviation operations, not at one edge of it. Geographic range also appears meaningful. Official materials support 30+ countries, while the 2026 Vista announcement increases that to 40+ countries. The customer-count story is similarly strong but imprecise. Public disclosures range from 1,000+ customers on the about page to 1,300+ enterprise customers in the March 2026 announcement, with Corporate Jet Investor reporting 1,200+ customers and 15,000 aircraft. Those differences look more like timing or measurement differences than actual inconsistency, but they still mean public underwriting should rely on direction rather than false precision. The additional solution pages for schedulers, safety managers, finance teams, and government fleets reinforce that Portside is segmenting by workflow role as well as by operator type, which is a useful sign of account-level expansion thinking.",
      "claimRefs": [
        "CU001",
        "CU002",
        "CU003",
