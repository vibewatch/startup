    },
    {
      "id": "durability-satisfaction-and-gaps",
      "title": "Durability, Satisfaction, and Gaps",
      "body": "Public retention evidence is weak. No retained source provides NRR, GRR, churn, renewal rate, or average contract duration. That absence is more important than any single positive quote because it limits any defensible view on durability. Review surfaces offer mixed and low-confidence proxies. FeaturedCustomers is directionally positive, showing a 4.8/5.0 rating based on 816 reference ratings and six testimonials, but its page is partially locked and should not be treated as a rigorous benchmark. Trustpilot is directionally negative: one April 2025 complaint alleges deceptive billing practices following BART-related invoicing changes. It is only a single review, but it does raise a plausible integration-era service or revenue-quality issue. G2, meanwhile, was not cleanly accessible in the retained fetch. Put differently, there is enough public evidence to say customers exist and some appear satisfied; there is not enough to say renewal quality is strong.",
      "claimRefs": [
        "CU017",
        "CU018",
        "CU019",
        "CU020",
        "CU021",
        "CU022",
        "CU023",
        "CU024"
      ],
