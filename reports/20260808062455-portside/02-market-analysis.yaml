  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Portside sells into a large but messy aviation-operations software market anchored in business-aviation workflows, not the whole aviation-software universe. Demand signals are favorable in 2026\u2014Honeywell still sees growth in deliveries and flying activity, especially for charter and fractional operators\u2014but the investable market is fragmented across scheduling, maintenance, safety, finance, and leasing workflows. The main market judgment is therefore positive on direction but cautious on precision: broad TAM is easy to prove, Portside-specific SAM is not."
  },
  "sections": [
    {
      "id": "market-boundary-and-scope",
      "title": "Market Boundary and Scope",
      "body": "Portside\u2019s market should be defined narrowly enough to be decision-useful and broadly enough to reflect how the company actually sells. The narrowest credible boundary is business-aviation operations software: scheduling, dispatch, crew coordination, maintenance-connected visibility, safety/compliance workflows, owner communications, billing, and analytics for flight departments, charter operators, fractional operators, FBO-adjacent workflows, and selected government fleets. That is meaningfully smaller than \u201caviation software\u201d as used by broad analyst houses, which can also include airport passenger systems, air traffic management, design and simulation software, and other categories Portside does not directly serve today. It is also broader than a single point category such as MRO software because Portside\u2019s own solutions span operational, financial, and customer-facing workflows. Adjacent ecosystems matter because Portside integrates into them rather than wholly replacing them: charter marketplaces such as Avinode, maintenance systems such as CAMP, CORRIDOR, and Veryon, and flight-ops peers such as Leon and Avianis all shape the wallet share Portside can capture. The right boundary is therefore an integrated aviation-operations software layer with meaningful adjacency into leasing, maintenance, and marketplace data rather than a single monolithic market bucket.",
