      - number: '4.4'
        title: Financial Verdict and Blockers
        blocks:
          - type: paragraph
            body: >-
              The public financial verdict is therefore mixed but not ambiguous. Portside has real commercial traction,
              blue-chip investors, and enough breadth to support a meaningful enterprise-software outcome. It does not,
              however, provide the economic disclosure needed for a confident priced investment view. The missing
              metrics are fundamental rather than cosmetic: ARR, gross margin, services mix, NRR, churn, cash, burn,
              runway, debt, and contract structure. Public evidence does hint at both upside and risk. On the upside,
              Vista’s 2024 participation implies a software business that had likely crossed at least a modest ARR
              floor, and the 2026 deal suggests continued sponsor confidence. On the risk side, the company’s
              acquisition-heavy strategy likely carries real integration cost, and a Trustpilot billing complaint raises
              a small but non-zero revenue-quality question around post-acquisition invoicing discipline. The right
              investor posture is not to assume weakness; it is to insist on evidence. Until Portside discloses more
              about revenue quality, unit economics, and capital adequacy, public comps can bound thinking but not
              complete the underwriting case.
