      - number: '7.2'
        title: Regulatory, Legal, and Security Risks
        blocks:
          - type: paragraph
            body: >-
              The heaviest externally anchored risk is regulatory cybersecurity pressure. EASA’s Part-IS regime now
              forces affected aviation organizations to implement structured information-security management, and the
              EASA FAQ makes clear that applicability, reporting, competencies, supplier interaction, and integration
              into existing management systems are non-trivial workstreams. GAO’s 2026 review reinforces the broader
              point from the U.S. side: aviation cybersecurity oversight is still tightening, not stabilizing.
              Portside’s own public trust surface is credible in outline but weak in freshness. The security policy
              documents useful controls such as AWS hosting, encryption, audit logs, and two-factor authentication, but
              the policy itself dates to 2018 and is not backed publicly by current third-party attestations. The
              privacy policy confirms that Portside handles sensitive operational, crew, maintenance, and financial
              data. The terms of service also remind investors that the website surface is provided as-is and that
              actual product contracts remain private. In other words, Portside’s legal and security posture is not
              obviously broken, but its public proof package trails the regulatory direction of travel. The delta
              between documented controls and current external proof is therefore a real diligence item.
            claimRefs:
