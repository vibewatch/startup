      - number: '2.2'
        title: Sizing Lenses and Demand Context
        blocks:
          - type: paragraph
            body: >-
              Retained sizing sources support the idea that Portside’s addressable category is meaningful in dollar
              terms, but they do not support false precision. On the narrower side, Fortune Business Insights estimates
              the aviation MRO software market at roughly $8.14 billion in 2025 and $8.67 billion in 2026, while
              Research and Markets estimates a somewhat smaller $7.15 billion in 2025 and $7.48 billion in 2026. Those
              figures are useful because Portside touches maintenance-connected workflows and competes for budgets that
              often sit near maintenance, safety, and operations teams. On the broader side, Grand View Research frames
              aviation software as a category spanning flight operations, MRO, crew and workforce tools,
              safety/compliance, analytics, passenger systems, and design software—large enough to show structural
              demand, but too broad to use directly as Portside’s TAM. Honeywell’s 2025 business aviation outlook is the
              most decision-relevant top-down demand source. It forecasts 8,500 new jets worth $283 billion over the
              next decade, sees 2026 deliveries rising 5% over 2025, and reports that 91% of surveyed operators expect
              to fly the same or more in 2026. Demand is especially resilient in segments Portside already targets, with
              fractional fleets up more than 65% since 2019 and Part 135 operators showing elevated ordering intent.
