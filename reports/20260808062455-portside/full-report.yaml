              - CR040
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The main risk is stacked complexity
            body: >-
              Portside is simultaneously integrating acquisitions, expanding upmarket, handling sensitive aviation
              workflows, and facing a tighter cyber-regulatory environment.
            calloutType: risk
            claimRefs:
              - CR001
              - CR017
              - CR018
              - CR027
          - type: callout
            title: Mitigations exist, but public proof is thin
            body: >-
              The company documents real controls and has sponsor-backed leadership, yet still lacks the current audit,
              uptime, and economics package needed to compress risk confidently.
            calloutType: insight
            claimRefs:
