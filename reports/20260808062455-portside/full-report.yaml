  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization
        blocks:
          - type: paragraph
            body: >-
              Portside’s public product surface supports a straightforward high-level model: multi-module aviation
              software sold to operators that need scheduling, reporting, owner-service, billing, safety, and adjacent
              workflow coverage. The likely revenue engine is recurring subscription software. That said, the same
              product and deal materials strongly imply non-trivial implementation and integration revenue as well,
              because Portside repeatedly emphasizes complex deployments, custom solutions, integration work, and
              post-sale customer success investment. This is not a consumer-style self-serve product. It looks more like
              an enterprise or upper-midmarket aviation SaaS motion where software subscriptions may carry the long-term
              value but services, onboarding, and change-management work matter meaningfully to customer acquisition and
              delivery. Public pricing transparency is nearly nonexistent. No retained Portside surface exposes list
              prices, and the broader category also hides exact pricing behind demo motions. That means the best public
              reading of Portside’s monetization is structural rather than numeric: recurring software revenue is highly
              likely, professional services are probably material, and realized price / discount behavior remains fully
              undisclosed.
