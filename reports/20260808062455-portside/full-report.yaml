  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Overview
        blocks:
          - type: paragraph
            body: >-
              Portside’s risk profile is not dominated by a single existential red flag; it is defined by several
              medium-to-high severity issues that can reinforce one another. The most important are regulatory
              cybersecurity burden, acquisition-led integration complexity, financial opacity, and dependency on
              mission-critical customer deployments. Those categories matter because Portside is attempting to become a
              broad operating system for aviation rather than a narrow tool. That strategy can create scale and
              stickiness, but it also increases the blast radius when governance, reliability, or integration quality
              slips. The public record supports a constructive but disciplined interpretation: Portside appears to have
              meaningful mitigations and strong market relevance, yet too many material risks still require private
              evidence rather than public trust. That stacked nature is why this chapter focuses on transmission paths,
              not isolated one-off concerns.
            claimRefs:
