            body: >-
              Portside’s customer story starts with breadth. The official customer and solution pages show that the
              company is not serving a single buyer archetype; it addresses management companies, corporate flight
              departments, charter operators, fractional and jet-card programs, finance teams, and even government or
              military fleets. That breadth is strategically important because it aligns with the company’s platform
              narrative: Portside is trying to sit at the center of business-aviation operations, not at one edge of it.
              Geographic range also appears meaningful. Official materials support 30+ countries, while the 2026 Vista
              announcement increases that to 40+ countries. The customer-count story is similarly strong but imprecise.
              Public disclosures range from 1,000+ customers on the about page to 1,300+ enterprise customers in the
              March 2026 announcement, with Corporate Jet Investor reporting 1,200+ customers and 15,000 aircraft. Those
              differences look more like timing or measurement differences than actual inconsistency, but they still
              mean public underwriting should rely on direction rather than false precision. The additional solution
              pages for schedulers, safety managers, finance teams, and government fleets reinforce that Portside is
              segmenting by workflow role as well as by operator type, which is a useful sign of account-level expansion
