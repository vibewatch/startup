  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Module Map
        blocks:
          - type: paragraph
            body: >-
              Portside’s public surface supports a clear framing: it is trying to be a business-aviation operating
              system, not just a point solution. Across the products, platform, and solution pages, the company presents
              a unified stack that touches scheduling, dispatch, owner communications, reporting, billing, manuals,
              staffing, safety, and adjacent workflow needs. This matters because buyer value in aviation software often
              comes less from any single module and more from stitching fragmented daily work into one operating
              environment. Horizon sharpens that positioning. Portside describes Horizon as a cloud-based
              flight-management system for larger and more complex operators, including fractional and jet-card
              programs, and external coverage says it is designed to reduce the need to jump between multiple platforms.
              The product breadth also extends outward from core ops: customer-acquisition and staffing tools show
              interest in demand generation and labor workflows, while reporting, owner portal, and billing expand the
              finance-and-service layer. The result is a broad SKU map that can support account expansion, but it also
              means the company has to keep many modules coherent across very different operator types.
