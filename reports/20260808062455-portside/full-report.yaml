companyProfile:
  summary: >-
    Portside is a sponsor-backed aviation software company that has expanded from business-aviation reporting and owner
    workflows into a broader operating system spanning scheduling, dispatch, billing, safety/compliance, optimization,
    staffing, regional commercial airline software, and leasing/finance-adjacent workflows. Retained public evidence
    supports more than 1,300 enterprise customers, operations across 40+ countries, and a 2026 leadership transition
    backed by additional Vista capital. The company’s strategic strength is platform breadth in a fragmented category;
    its public-evidence weakness is economic opacity, especially around current revenue, retention, margins, and the
    undisclosed terms of the 2024 and 2026 Vista transactions.
