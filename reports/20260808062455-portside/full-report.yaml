      - number: '3.4'
        title: Moat Durability and Competitive Risks
        blocks:
          - type: paragraph
            body: >-
              Portside’s moat is most credible where customers want one platform to connect operations, finance, owner
              service, safety, and adjacent aviation workflows that were previously scattered across multiple tools. The
              company’s customer logos, Clay Lacy deployment, and 2024-2026 sponsor-backed narrative support the idea
              that it can win complex accounts. Review and trust evidence are more mixed. FeaturedCustomers supplies a
              positive testimonial surface but relatively thin case-study depth, G2 could not be meaningfully inspected
              in the retained fetch, and Trustpilot carries a negative billing complaint that shows process trust can
              break even when the product vision is strong. The biggest strategic risk is not a single rival but a
              combination of forces: direct peers making core ops features table stakes, specialist incumbents staying
              embedded in high-value modules, and larger aviation-software players becoming more relevant as Portside
              reaches toward airlines, leasing, and enterprise segments. The next diligence step is therefore less about
              who is on the list and more about where Portside has actually displaced those competitors in live
              accounts, how long those sales cycles took, and what retention looks like after multi-product expansion.
            claimRefs:
