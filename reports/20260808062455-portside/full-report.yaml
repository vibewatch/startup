chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Scale, and Footprint
        blocks:
          - type: paragraph
            body: >-
              Portside’s retained public materials consistently position the company as a cloud-based software provider
              serving the operational back office of aviation rather than a point tool. The product narrative spans
              scheduling, safety and compliance, owner support, reporting, invoicing, staffing, and, after 2024
              acquisitions, leasing workflows. The best-supported location signal is San Francisco: the 2023 Series B
              release, the 2024 Vista announcement, and the 2026 investment press release all present Portside as San
              Francisco-based. At the same time, Portside’s privacy policy lists a Durham, North Carolina mailing
              address and the about page describes teams in California, Texas, North Carolina, Ukraine, and Kazakhstan,
              which is more consistent with a distributed operating footprint than a single-office company. Public scale
              claims stepped up over time. The 2023 Series B release cited more than 700 operators in 30+ countries. The
              current about page says 1,000+ customers and 10,000+ aircraft. The March 2026 Vista announcement raises
              that to 1,300+ enterprise customers, 40+ countries, and 330+ professionals. Third-party industry coverage
              from Corporate Jet Investor is directionally consistent on customer scale but higher on aircraft count,
              citing 15,000 aircraft in 2026. These metrics are useful for signaling category relevance, but they remain
              management-reported rather than independently audited operating statistics.
