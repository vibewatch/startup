        - Go-live problems or product-fragmentation evidence
        - Two or more large customer references cite delayed or broken integrations
        - Pause or reprice valuation assumptions
      - - Cyber-compliance readiness
        - Lack of current audit evidence
        - Management cannot provide modern attestation or readiness package
        - Escalate diligence; potential thesis break
      - - Billing / service quality
        - Repeated complaints tied to invoicing or support gaps
        - Pattern extends beyond isolated complaint
        - Discount retention and margin assumptions
      - - Capital adequacy opacity
        - Management withholds core metrics
        - No ARR, burn, runway, or concentration disclosure in diligence
        - Do not underwrite growth multiple
      - - Leadership execution
        - New CEO lacks measurable integration progress
        - No concrete platform-unification milestones in 6-12 months
        - Increase execution-risk discount
