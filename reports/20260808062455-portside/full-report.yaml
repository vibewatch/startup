  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Substitute Set
        blocks:
          - type: paragraph
            body: >-
              Portside’s competitive field is not a simple head-to-head matchup. The direct peer set is concentrated in
              integrated flight-operations platforms such as Avianis and Leon, both of which market end-to-end
              capabilities around scheduling, dispatch, crew, quoting, and related records. Around that core sits a ring
              of adjacent specialists: Avinode in charter marketplace liquidity and workflow, CAMP and CORRIDOR in
              maintenance-centered operations, and Veryon in cloud maintenance intelligence. The practical substitute
              set is broader still. Many operators continue to run multiple systems tied together by spreadsheets,
              manual reporting, or internal data work, and some larger or security-sensitive accounts are capable of
              internal buildouts or highly customized deployments. Portside itself implicitly acknowledges this reality
              by emphasizing integrations, custom solutions, and private-cloud/on-prem options. The result is a
              landscape in which customers often solve the same job through a stack of tools rather than a single
              vendor. That favors platforms that can coexist and expand, but it also makes category share harder to lock
              down.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
