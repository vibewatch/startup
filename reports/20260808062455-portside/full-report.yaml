  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope
        blocks:
          - type: paragraph
            body: >-
              Portside’s market should be defined narrowly enough to be decision-useful and broadly enough to reflect
              how the company actually sells. The narrowest credible boundary is business-aviation operations software:
              scheduling, dispatch, crew coordination, maintenance-connected visibility, safety/compliance workflows,
              owner communications, billing, and analytics for flight departments, charter operators, fractional
              operators, FBO-adjacent workflows, and selected government fleets. That is meaningfully smaller than
              “aviation software” as used by broad analyst houses, which can also include airport passenger systems, air
              traffic management, design and simulation software, and other categories Portside does not directly serve
              today. It is also broader than a single point category such as MRO software because Portside’s own
              solutions span operational, financial, and customer-facing workflows. Adjacent ecosystems matter because
              Portside integrates into them rather than wholly replacing them: charter marketplaces such as Avinode,
              maintenance systems such as CAMP, CORRIDOR, and Veryon, and flight-ops peers such as Leon and Avianis all
              shape the wallet share Portside can capture. The right boundary is therefore an integrated
              aviation-operations software layer with meaningful adjacency into leasing, maintenance, and marketplace
              data rather than a single monolithic market bucket.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM008
