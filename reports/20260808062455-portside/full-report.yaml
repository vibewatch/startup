      - number: '1.3'
        title: Capital History and Ownership Context
        blocks:
          - type: paragraph
            body: >-
              Portside’s disclosed financing history is unusually clear through 2023 and notably opaque thereafter. The
              2021 Series A brought in $17 million and named Tiger Global and Dragoneer among the investors. The
              February 2023 Series B added $50 million led by Insight Partners and pushed disclosed capital raised to
              more than $70 million. The next two financing events are strategically more important but economically
              less transparent. In May 2024, Vista’s Endeavor Fund led a minority growth investment, with Insight also
              participating and Ben Benson joining the board. In March 2026, Vista deepened its position through a new
              investment that coincided with the CEO transition to Brandon Holden; official releases say Insight
              remained a significant shareholder. None of the retained 2024 or 2026 financing sources disclose check
              size, ownership percentages, debt terms, or valuation. The most concrete economic clue is indirect: Vista
              said its Endeavor Fund backs high-growth software businesses that have reached at least $10 million in
              recurring revenue, implying Portside likely had crossed that threshold by the time Vista first invested.
              That is not the same as revenue disclosure, however, and it leaves public investors without enough
              information to confirm valuation discipline, dilution, or any liquidation preference overhang in the
              current ownership stack.
