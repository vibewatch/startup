      - number: '3.2'
        title: Direct Peers and Specialist Depth
        blocks:
          - type: paragraph
            body: >-
              Avianis and Leon are the clearest direct competitors because they present themselves as broad
              flight-operations systems rather than pure point solutions. Avianis markets an all-in-one enterprise
              flight-management product with quoting, scheduling, invoicing, maintenance tracking, reporting, and a
              mobile app. Leon markets schedules, sales, dispatch, crew, maintenance, and reporting in a highly
              configurable system and is unusually transparent on scale, claiming 566 customers, 5,386 aircraft, and
              50,400 users. Portside can reasonably claim broader cross-functional breadth than either when owner
              reporting, integrated billing, staffing, safety/compliance, and newer leasing exposure are included. But
              that same breadth implies a tradeoff: specialists often appear deeper within their own lane. CAMP’s
              positioning is tightly centered on aircraft health management and expert analyst support. CORRIDOR is
              explicitly designed for MROs, repair stations, FBOs, operators, and component workflows. Veryon emphasizes
              maintenance intelligence, ISO-certified systems, APIs, and AI. For buyers whose pain centers on a specific
              maintenance or records problem, these vendors can be harder to dislodge than a generalist platform.
            claimRefs:
