              Portside’s public traction evidence is operational rather than financial. Official and trade-press sources
              support 1,300+ enterprise customers, 40+ countries, 330+ employees, and 15,000 aircraft on the platform,
              but they stop short of disclosing revenue quality. Low-confidence data providers add rough
              estimates—Usearch suggests around $31.5 million of revenue and Tracxn still frames the company as a
              minicorn—but those figures are not sufficiently reliable for underwriting. Public comparables are more
