              - CV037
              - CV040
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not confuse company quality with price support
            body: >-
              Portside may be a high-quality platform in the making, but public evidence still does not support a firm
              premium-priced call.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV028
