        title: People, Capital, and Thesis-Break Risks
        blocks:
          - type: paragraph
            body: >-
              The people and capital side of the risk profile is manageable but material. Portside changed CEOs in March
              2026 while also signaling that platform integration, AI roadmap work, and go-to-market expansion are all
              active priorities. That is the kind of moment where execution can improve dramatically under a seasoned
              operator—or stall if integration complexity outpaces leadership bandwidth. The transition is partially
              mitigated by Brandon Holden’s prior integration background, but not eliminated. More fundamentally,
              financial-model risk remains stubbornly unresolved because Portside still does not publicly disclose key
              metrics such as ARR, gross margin, burn, runway, customer concentration, or retention. Investors therefore
              have to assess several execution risks without a clean read on the company’s economic shock absorbers. The
              right public stance is to define thesis-break triggers clearly: evidence of worsening billing or service
              quality, failure to demonstrate cyber-compliance readiness, or visible inability to unify acquired
              products should all change the investment posture quickly.
            claimRefs:
              - CR026
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
              - CR033
              - CR035
              - CR036
              - CR037
              - CR038
              - CR039
              - CR040
          - type: table
            tableRef: TR004
            claimRefs:
