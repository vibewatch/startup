            title: The market is broad enough, but Portside’s true serviceable slice is still the key diligence question
            body: >-
              Top-down reports and operator outlooks make it easy to argue for a large category, but only detailed
              segment mix and pricing data will reveal how much of that spend Portside can win without overextending
              beyond business-aviation operations software.
