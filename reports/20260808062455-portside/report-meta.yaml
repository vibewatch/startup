companyProfile:
  summary: "Portside is a sponsor-backed aviation software company that has expanded from business-aviation reporting and owner workflows into a broader operating system spanning scheduling, dispatch, billing, safety/compliance, optimization, staffing, regional commercial airline software, and leasing/finance-adjacent workflows. Retained public evidence supports more than 1,300 enterprise customers, operations across 40+ countries, and a 2026 leadership transition backed by additional Vista capital. The company’s strategic strength is platform breadth in a fragmented category; its public-evidence weakness is economic opacity, especially around current revenue, retention, margins, and the undisclosed terms of the 2024 and 2026 Vista transactions."
  foundedDate: "2017-01-01"
  founders:
    - name: "Alek Vernitsky"
      role: "Co-founder and former CEO"
      background: "Led Portside through early product expansion and remained involved as strategic advisor and board member after the 2026 CEO transition."
      claimRefs: []
    - name: "Alek Strygin"
      role: "Co-founder"
      background: "Co-built the company and remains associated with product vision and platform development in public company materials."
      claimRefs: []
  foundingLocation: "San Francisco, California, USA"
  headquarters: "San Francisco, California, USA"
  productSummary: "Integrated aviation software platform covering scheduling and operations (including Horizon and Avianis surfaces), owner communications, analytics, managed billing, safety/compliance, fatigue-risk management, staffing, and travel/adjacent operating workflows. The stack is cloud-first, integration-heavy, and shaped by acquisitions including Baldwin, Takeflite, and LeaseWorks."
  customerFocus: "Business and corporate aviation operators, management companies, charter and managed fleets, fractional and jet-card operators, government fleets, and selected regional commercial airline / leasing workflows. Public customer proof is strongest with large operators such as Clay Lacy and quote-backed references on the customer page; retention and concentration remain undisclosed."
  businessModel: "Enterprise aviation SaaS platform with likely recurring subscription revenue plus implementation/integration and services components. Multi-module expansion across owner, ops, finance, safety, and adjacent workflows is the core account-growth logic."
  stage: "late-stage / sponsor-backed growth"
  fundingStatus: "2021 Series A ($17M disclosed), 2023 Series B ($50M disclosed), 2024 Vista investment (terms undisclosed), 2026 Vista follow-on investment with CEO transition (terms undisclosed)."
  disclosureProfile: "private-undisclosed"
  claimRefs: []

