    {
      "id": "founders-leadership-and-governance",
      "title": "Founders, Leadership, and Governance",
      "body": "The retained source set points to Alek Vernitsky and Alek Strygin as Portside\u2019s co-founders, with the strongest public founding-year evidence clustering around 2017 rather than the 2014-2015 range that occasionally appears in unsourced background notes. The March 2026 Vista transaction marked the clearest governance inflection in Portside\u2019s public history. Brandon Holden became CEO after previously leading Eptura and holding senior roles at LogicMonitor, Accruent, and Forcepoint. Vernitsky remained strategically involved as a board member and strategic advisor focused on product vision, AI, and large-customer engagement rather than fully exiting the business. The same public record also shows Vista becoming more central to governance over time: Ben Benson joined the board with the 2024 minority investment, and Vista\u2019s 2026 commentary frames the company as moving from disciplined early growth toward broader operational integration and AI-enabled expansion. Governance continuity is therefore reasonably strong at the founder-investor level, but key-person dependence remains meaningful because the 2026 transition shifted day-to-day leadership away from the founder while still relying on him for product credibility and complex enterprise relationships.",
