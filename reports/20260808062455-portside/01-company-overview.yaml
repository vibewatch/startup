  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Portside is a San Francisco-centered aviation-operations software roll-up founded in 2017 by Alek Vernitsky and Alek Strygin. Public evidence supports strong product breadth, a minority Vista investment in 2024 followed by a deeper March 2026 transaction and CEO transition to Brandon Holden, but not a disclosed 2026 valuation or cap-table view. The company\u2019s strongest public traction claims are 1,300+ enterprise customers, 40+ countries, and 330+ employees, while legal, policy, and billing-surface evidence still leaves diligence gaps."
  },
  "sections": [
    {
      "id": "identity-scale-and-footprint",
      "title": "Identity, Scale, and Footprint",
      "body": "Portside\u2019s retained public materials consistently position the company as a cloud-based software provider serving the operational back office of aviation rather than a point tool. The product narrative spans scheduling, safety and compliance, owner support, reporting, invoicing, staffing, and, after 2024 acquisitions, leasing workflows. The best-supported location signal is San Francisco: the 2023 Series B release, the 2024 Vista announcement, and the 2026 investment press release all present Portside as San Francisco-based. At the same time, Portside\u2019s privacy policy lists a Durham, North Carolina mailing address and the about page describes teams in California, Texas, North Carolina, Ukraine, and Kazakhstan, which is more consistent with a distributed operating footprint than a single-office company. Public scale claims stepped up over time. The 2023 Series B release cited more than 700 operators in 30+ countries. The current about page says 1,000+ customers and 10,000+ aircraft. The March 2026 Vista announcement raises that to 1,300+ enterprise customers, 40+ countries, and 330+ professionals. Third-party industry coverage from Corporate Jet Investor is directionally consistent on customer scale but higher on aircraft count, citing 15,000 aircraft in 2026. These metrics are useful for signaling category relevance, but they remain management-reported rather than independently audited operating statistics.",
