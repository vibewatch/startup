    {
      "id": "milestones-strategy-and-open-gaps",
      "title": "Milestones, Strategy, and Open Gaps",
      "body": "Portside\u2019s public milestone record reads less like a single-product SaaS company and more like a category-consolidation strategy in business aviation software. The 2022 PFM and SeaGil/BART acquisitions expanded scheduling and dispatch coverage. Baldwin in 2023 added safety and compliance. Takeflite in 2024 widened exposure to commercial and business airline operations. LeaseWorks in 2024 extended the platform into aircraft leasing and finance, which the company explicitly presented as a new adjacency. Horizon\u2019s 2025 launch then reframed Portside as a broader cloud-native flight-management platform for larger and more complex operations. Clay Lacy\u2019s October 2025 Avianis adoption lends real customer proof to the claim that Portside can deploy into scaled, operationally demanding fleets. That positive trajectory is not the whole story. A 2025 Trustpilot review alleged invoice-cycle confusion and overbilling tied to the BART transition, and Portside\u2019s publicly posted security and terms policies are still dated 2018. Those signals do not negate the company\u2019s growth narrative, but they do suggest that public-facing controls and disclosure have not been modernized at the same pace as product and ownership complexity. The biggest unresolved gap remains valuation: the March 2026 Vista deal clearly changed control dynamics, yet public evidence still does not confirm a price, a unicorn valuation, or the detailed capital structure an investor would need for a conviction underwriting view.",
