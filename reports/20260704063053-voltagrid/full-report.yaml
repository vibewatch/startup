      - number: '6.7'
        title: Adverse and Regulatory Signals at Customer Sites
        blocks:
          - type: paragraph
            body: >-
              The clearest adverse signal in this chapter sits at VoltaGrid's newest named data-center site. In June
              2026, the Southern Environmental Law Center, Sustainable Newton, and Altamaha Riverkeeper filed an
              enforcement request alleging VoltaGrid had begun constructing 8 of a planned 33 methane-gas engines at the
              Covington, Georgia Serverfarm site before securing the Clean Air Act preconstruction permit that Georgia
              law requires (CU033). The same filing alleges Serverfarm, VoltaGrid's customer at that site, had
              separately installed 36 of 37 diesel backup generators without a permit, meaning the compliance risk
              extends to the customer's own infrastructure and not solely to VoltaGrid's generation assets (CU034).
              Atlanta Journal-Constitution reporting adds independent expert pushback: a Georgia Tech engineering
              professor disputed VoltaGrid's "environmentally friendly" marketing characterization, and a Southern
              Environmental Law Center attorney raised local air-quality concerns tied to NOx, formaldehyde, and
              particulate emissions near a residential area, a water reservoir, and a nature preserve (CU035). As of the
              July 2026 research date, Georgia's Environmental Protection Division had confirmed it would investigate
              the allegations but had neither issued a final permit nor ordered a construction stop-work, leaving the
              ultimate compliance outcome for VoltaGrid's customer site unresolved (CU036). Sustainable Newton's founder
              published a first-person account describing exhaust stacks visible from a public road and warning that
              "money is no object and corners are routinely cut" in AI-driven data-center buildouts, a pointed adverse
              framing that names both VoltaGrid and its Serverfarm customer directly (CU037). A separate, unrelated 2025
              Forbes report frames VoltaGrid's mobile-turbine deployments generally, including at xAI, as a "quick and
              dirty" stopgap rather than a durable production solution, an adverse characterization of deployment
              quality that predates and is independent of the Georgia dispute (CU038). By contrast, no adverse or
              complaint record was located for VoltaGrid's oilfield e-frac sites in the Haynesville or Marcellus basins,
              and the Texas/Tennessee sites carry only the earlier-resolved xAI non-road-engine exemption issue rather
              than an active enforcement filing, so the compliance risk profile is concentrated in the newest,
              least-mature customer site rather than spread evenly across the customer base (CU046).
