            body: >-
              VoltaGrid's data-center offering layers fuel supply, prime generation, grid stabilization, and AI-driven
              dispatch into one operating system. The Oracle deployment's Energy Transfer pipeline fuel supply and the
              associated Texas manufacturing and operations job creation illustrate how the fuel and workforce layers
              connect to a single named contract (CE013, CE014). Deployed sites are monitored from an on-site Command
              Center paired with a 24/7 Remote Operations Center (CE015). Several engineering choices recur across
              company materials: QPac's heat-rejection system vents vertically above data-center HVAC systems to limit
              cooling interference and land use (CE016); units target roughly 65 dBA at 33 feet to meet siting noise
              limits (CE017); and the platform is marketed as upgradeable to 100% hydrogen, though no operational
              hydrogen deployment has been documented (CE018). VoltaGrid also discloses a greater-than-99.9% projected
              plant-reliability figure that is company marketing rather than an independently audited operating
              statistic (CE019), a distinction that matters because multi-GW, multi-year customer contracts are being
              underwritten against it.
