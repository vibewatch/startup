  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid's bull case rests on three pillars: a genuine, named-customer contracted backlog (Oracle's 2.3
              GW deal reportedly pays VoltaGrid more than $1 billion a year for a single Texas site alone, per Bloomberg
              reporting), tier-1 financial and strategic sponsor validation (Blackstone Tactical Opportunities,
              Halliburton, and CPP Investments have all committed capital), and a vertical-integration move -- the
              Propell Energy acquisition -- explicitly designed to de-risk the manufacturing supply chain behind a
              roughly 7.5 GW total order book. The anti-thesis is equally concrete: VoltaGrid discloses no audited
              revenue, EBITDA, cash position, or the Propell purchase price, so the entire $1.1 billion 2028 EBITDA
              target that anchors the greater-than-$10 billion valuation is a company- and Fitch Ratings-sourced
              projection rather than a verified figure. Layered on top are an active Georgia Clean Air Act enforcement
              request, a heavily concentrated customer base (Oracle and Vantage together represent the large majority of
              disclosed gigawatt commitments), and no disclosed natural-gas hedging policy against fixed-price,
              multi-year power contracts. Each anti-thesis point has a specific, monitorable event that would restore
              the thesis -- audited financials, a favorable EPD ruling, disclosed customer diversification -- which is
              the organizing logic for the thesis/anti-thesis table below.
            claimRefs:
              - CV007
              - CV010
              - CV044
              - CV011
              - CV037
              - CV042
              - CV034
          - type: table
            tableRef: TV002
            claimRefs:
