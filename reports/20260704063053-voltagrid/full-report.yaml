      - number: '8.2'
        title: Current Financing and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid's valuation history is a rapid escalation: a $73 million 2020 seed round, roughly $100-210
              million of follow-on equity through 2023, a $550 million term loan in March 2024, a $5.0 billion
              comprehensive debt package in November 2025 ($2.0 billion of senior secured second-lien notes plus a $3.0
              billion asset-based facility), and a $1.0 billion Series D in May 2026 from Blackstone Tactical
              Opportunities and Halliburton, split $775 million of primary capital and $225 million of secondary
              purchases from existing shareholders. That secondary component means some early investors partially cashed
              out at the new mark rather than the raise being purely primary growth capital -- a data point for dilution
              and entry-discipline analysis. Aggregated funding trackers place cumulative capitalization near $7.1
              billion (about $1.5 billion equity, $5.5 billion debt). Bloomberg reporting in February 2026 indicated
              VoltaGrid was separately exploring an IPO and had held sale discussions with private equity firms
              including Blackstone and BlackRock, with any transaction seen valuing the company above $10 billion --
              meaning the May 2026 strategic round and the exit-process valuation chatter are mutually reinforcing but
              not independently verified against audited numbers. No source reviewed discloses current-year revenue,
              EBITDA, cash-on-hand, or the Propell purchase price, so public evidence alone cannot underwrite whether
              the price is fair.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV012
              - CV011
              - CV043
      - number: '8.3'
        title: Comparable Company and Precedent Transaction Analysis
        blocks:
          - type: paragraph
            body: >-
              Two private comparables anchor the growth-stage end of the range: Crusoe Energy raised $1.375 billion in
              October 2025 at a valuation exceeding $10 billion as a vertically integrated AI-data-center-and-power
              developer, and Enchanted Rock (ERock) targeted a $5 billion 2026 IPO valuation against $183.1 million of
              2025 revenue -- an approximately 27x EV/Revenue multiple that shows the private/pre-IPO market is willing
              to underwrite similar growth premiums sector-wide, not uniquely for VoltaGrid. On the public side, current
              (July 2026) figures from stockanalysis.com and each company's FY2025 Form 10-K show a wide 10x-33x
              EV/EBITDA band: Vistra at 10.34x, NRG at 23.04x EV/EBITDA and 1.61x EV/Sales, Cummins at 19.26x EV/EBITDA
              (a separate provider shows 15.9x on a forward basis) and 2.84x EV/Sales, Generac at 30.33x EV/EBITDA and
              3.70x EV/Sales, Caterpillar at 33.22x EV/EBITDA and 6.83x EV/Sales, and Bloom Energy at 31.65x EV/Sales
              (its 334.71x EV/EBITDA is not meaningful given a thin GAAP earnings base). Applying VoltaGrid's >$10
              billion equity value to its $1.1 billion 2028E EBITDA target implies roughly 9x equity-value/EBITDA, or
              about 13-14x forward EV/EBITDA once an estimated $5.5 billion of net debt is added -- below the
              equipment-maker multiples but above Vistra's, so the entry price is not obviously rich against today's
              frothy comps, provided the EBITDA target is real and gets audited.
