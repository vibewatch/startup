  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Framework and Ranked Overview of Exposures
        blocks:
          - type: paragraph
            body: >-
              This chapter ranks VoltaGrid's risk across five categories -- regulatory/legal, operational/manufacturing,
              partner/dependency, people/execution, and financial/commodity, plus a cross-cutting ESG/political
              dimension -- using likelihood, severity, mitigation maturity, and residual exposure as the common scoring
              lens, then closes with monitorable kill criteria. Regulatory/legal risk ranks highest today: an active
              Southern Environmental Law Center enforcement request over unpermitted construction at VoltaGrid's
              Covington, Georgia site sits alongside a second, still-pending Texas Commission on Environmental Quality
              major-source permit fight for the roughly 2,582 MW ABI-1 expansion (CR001, CR009, CR010).
              Financial/commodity risk ranks close behind: a $5.0 billion secured debt package sits beneath a
              greater-than-$10 billion implied valuation with no disclosed natural-gas hedging program (CR037, CR039).
              Partner/dependency risk is elevated by sole-sourced OEM relationships with INNIO Jenbacher and ABB and by
              Halliburton's simultaneous roles as equity investor, two-seat board member, and operating partner (CR027,
              CR028, CR031). Operational/manufacturing risk centers on an unproven post-Propell manufacturing ramp and
              unverified reliability and emissions claims (CR019, CR020, CR023). People/execution risk is comparatively
              lower likelihood but high severity given reliance on a single, publicly identifiable founder-CEO. The risk
              heatmap below (FR001) summarizes these rankings across likelihood, severity, mitigation maturity, and
              residual exposure; the detailed registers and sourcing for each category follow in the sections below.
            claimRefs:
              - CR001
              - CR009
              - CR019
              - CR027
              - CR031
              - CR037
