      - number: '4.2'
        title: Public Traction Proxies Versus Private Financial Gaps
        blocks:
          - type: paragraph
            body: >-
              In the absence of disclosed revenue or ARR, the most defensible public traction proxies are
              contracted-capacity figures rather than dollar metrics. VoltaGrid's headline order book is approximately
              7.5 GW of data-center power delivery through 2030 (CI010), while its November 2025 debt-financing
              announcement anchors a more conservative near-term figure of 4.3 GW of contracted capacity through 2028
              (CI011) -- the gap between the two numbers itself signals that "order book" and "contracted backlog" are
              not interchangeable in VoltaGrid's own disclosure. No retained source discloses current annual revenue,
              run-rate, or ARR (CI012), nor a discrete active-customer or energized-site count; public disclosure
              instead stops at named marquee contracts and aggregate GW totals (CI013). Using only those public GW
              figures, Oracle's 2.3 GW and Vantage's 1+ GW contracts together represent roughly 45% of the disclosed 7.5
              GW order book, a concentration estimate that itself cannot be converted into revenue-share terms without
              disclosed per-contract economics (CI014). Because VoltaGrid has not filed public financial statements, the
              revenue, EBITDA, margin, and cash-flow inputs an underwriter would need to test the greater-than-$10
              billion valuation must be sourced from investor press materials and third-party estimates rather than
              audited disclosure (CI015), a structural gap this chapter treats as a diligence blocker rather than a
              modeling assumption.
