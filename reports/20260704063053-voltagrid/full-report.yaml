  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing Mechanism, and Revenue Mix
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid monetizes behind-the-meter (BTM) natural-gas generation as a long-term, capacity-based service
              rather than a one-time equipment sale or a spot-priced commodity: it deploys, owns, and operates modular
              reciprocating-engine power plants under multi-year agreements with data-center, industrial, and
              oil-and-gas customers (CI001, CI002). The clearest disclosed revenue-mix evidence is a handful of named,
              gigawatt-scale contracts rather than a published per-vertical split -- the 2.3 GW Oracle Cloud
              Infrastructure deployment supplied with Energy Transfer gas (CI003), the 1+ GW Vantage Data Centers
              multi-site partnership (CI004), and an October 2025 collaboration with Halliburton targeting an initial
              Middle East roll-out that extends VoltaGrid's revenue geography beyond North America (CI005). No retained
              source, however, discloses a VoltaGrid-specific per-MW-month or per-MWh contract price, so the widely
              circulated $70-100/MWh industry benchmark for BTM gas power cannot be checked against VoltaGrid's actual
              deals (CI006); OEM partners ABB and INNIO likewise disclose order scope (35 synchronous condensers; 300
              Jenbacher engines totaling 1.5 GW) without price (CI007, CI008). Because VoltaGrid's revenue depends on
              converting its order book into billed, energized capacity over 2026-2030 rather than immediate spot
              billing, recognition itself is execution-dependent (CI009).
