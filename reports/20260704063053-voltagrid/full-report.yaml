      - number: '8.6'
        title: Thesis-Break Triggers and Monitoring
        blocks:
          - type: paragraph
            body: >-
              Six monitorable triggers would meaningfully move this call. A Georgia EPD stop-work order, material fine,
              or forced retrofit at the Covington site would signal that regulatory risk could recur across VoltaGrid's
              broader site portfolio and should pause new capital commitments. A similarly adverse Texas TCEQ outcome on
              the larger ABI-1 expansion would threaten the single largest disclosed expansion site. Any confirmed
              cancellation, delay, or repricing by Oracle or Vantage -- the two named anchor customers -- would remove
              the majority of disclosed order-book revenue visibility and should trigger an immediate re-underwrite. A
              sustained natural-gas price spike, absent any disclosed hedging or pass-through mechanism, would test
              whether VoltaGrid or its customers actually bear commodity risk on fixed-price contracts. The release of
              audited or lender-verified 2025/2026 financials would be the single highest-value event, converting the
              entire valuation debate from estimated to verified in either direction. Finally, the outcome of
              VoltaGrid's own IPO or sale exploration -- whether a public filing or announced transaction prices the
              company materially above or below the >$10 billion May 2026 mark -- would crystallize whether that private
              mark was fair, rich, or cheap, and should directly inform entry discipline on any follow-on or secondary
              purchase.
            claimRefs:
              - CV037
