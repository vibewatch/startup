  - id: TM001
    title: 'Market definition: segments, spend boundaries, and buyers'
    columns:
      - Segment / Category
      - Included Spend
      - Excluded Spend
      - Buyer / Payer
      - Relevance to VoltaGrid
    rows:
      - - Behind-the-meter (BTM) modular natural-gas prime power for hyperscale/AI data centres
        - >-
          Onsite gas-fired generation dedicated to a single data-centre campus, owned or contracted as a service, plus
          associated switchgear/controls
        - Grid-purchased utility power, renewable-only PPAs, nuclear SMRs, and diesel backup-only gensets
        - Hyperscaler / AI infrastructure operator (Oracle, Vantage, xAI, etc.)
        - VoltaGrid's core addressable segment
      - - Grid-tied utility & IPP large-load power supply
        - Long-term PPAs and interconnection-based service from utilities/IPPs (NRG, LS Power, Constellation, Talen)
        - Onsite/behind-the-meter generation not connected to the transmission grid
        - Utility ratepayer base plus data-centre operator (via PPA)
        - Status-quo substitute and competing delivery model, not VoltaGrid's segment
      - - Backup/standby diesel and gas generator market (traditional data-centre backup)
        - Emergency backup gensets sized for outage ride-through, not continuous prime power
        - Continuous/prime power generation and fuel-cell primary power
        - Data-centre facilities/engineering budget
        - Adjacent, overlapping analyst category, but a different buying decision than prime BTM power
      - - Fuel-cell primary power for data centres (e.g., Bloom Energy)
        - Onsite solid-oxide or other fuel-cell primary power installations
        - Combustion-turbine or reciprocating-engine BTM gas power
        - Hyperscaler / AI infrastructure operator
        - Adjacent substitute/competing BTM technology, same buyer budget
      - - Oilfield and industrial electrification microgrids (legacy)
        - Mobile/modular gas power for electric hydraulic fracturing, remote mining, and distributed generation
        - Data-centre-specific BTM contracts
        - Oilfield operators and industrial sites
        - VoltaGrid's original, smaller legacy segment, separate from the AI data-centre pivot
      - - Renewable-plus-storage power for data centres
        - Solar/wind/battery hybrid onsite generation
        - Fossil-fuel prime power
        - Hyperscaler ESG/sustainability budget
        - Status-quo/ESG-preferred substitute, but rarely dispatchable enough alone for gigawatt AI loads today
    notes: >-
      VoltaGrid's core addressable segment is row 1; rows 2-6 are the substitutes, adjacencies, and status-quo
      alternatives a data-centre operator's power-sourcing budget could choose instead, drawn from the market/regulatory
      sources cited across this chapter rather than a single unified market taxonomy.
    claimRefs:
      - CM047
      - CM048
      - CM049
