              contract/ownership model, fuel flexibility, and disclosed emissions positioning; the capability matrix
              below scores each competitor class on an evidence-based 0-3 ordinal scale rather than inventing precision
              the public record does not support. VoltaGrid and Enchanted Rock both compete on off-grid, BTM-native
              deployment, but at very different unit scale. Bloom Energy deploys behind-the-meter too, with sub-90-day
              site timelines reported at Oracle, though its combined capacity is aggregated across many smaller
              installations (100+ MW across 19-plus sites at Equinix) rather than concentrated in single large blocks.
