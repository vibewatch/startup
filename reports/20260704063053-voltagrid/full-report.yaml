    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, founding, and one-line business model
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid LLC presents itself, across its own site and independent financing coverage, as a leading
              provider of modular, behind-the-meter (BTM) natural gas power solutions for hyperscale data centers,
              industrial sites, and the energy sector, headquartered at 10800 Telge Road, Houston, Texas 77095. The
              company's own materials date its founding to 2020, when it began deploying turnkey natural gas microgrids
              for electric hydraulic fracturing (e-frac), remote mining, and utility/distributed-generation customers;
              that 2020 founding date is corroborated independently by EY's Entrepreneur of the Year materials and by
              POWER magazine's trade coverage, though one S&P Global Commodity Insights podcast description instead
              references VoltaGrid's capacity "since its founding in 2021," a minor but unresolved discrepancy.
              VoltaGrid's flagship offering is a patent-pending hybrid platform combining fast-ramping natural gas
              generators (rated load in 32 seconds), large-scale portable energy storage, and an AI-enabled Access
              Innovation Portal for real-time monitoring of power demand, fuel consumption, and emissions; the company
              claims a 28-40% reduction in criterion greenhouse-gas emissions versus dual-fuel or combustion-turbine
              alternatives. Since 2025 this platform, marketed under the QPac and StabilAI names, has been repositioned
              specifically for gigawatt-scale AI data-center loads.
