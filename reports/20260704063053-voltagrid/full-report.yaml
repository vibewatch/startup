      - number: '4.5'
        title: Capital Adequacy, Debt Load, and Project Finance
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid has raised substantial cumulative capital since its 2020 founding -- a chronology detailed in
              this report's Company Overview chapter -- and this chapter's own local evidence confirms that capital
              access continued through two large 2025-2026 packages: a $5.0 billion comprehensive debt financing in
              November 2025 comprising $2.0 billion of senior secured second-lien notes and a $3.0 billion asset-based
              loan facility (CI031), and a $1.0 billion strategic equity investment in May 2026 from Blackstone Tactical
              Opportunities and Halliburton, split into $775 million of primary capital and a $225 million secondary
              purchase, with primary proceeds earmarked for "growth and acquisition of Propell" (CI032). Neither
              VoltaGrid's current cash-on-hand balance nor a monthly burn rate is disclosed anywhere in retained
              sources, so runway cannot be computed (CI033, CI034). The debt stack layers a March 2024 $500 million
              five-year term loan (plus a $50 million accordion and up to a $150 million revolver) beneath the 2025
              notes/ABL package, and no retained source confirms whether the 2024 facility was refinanced or remains
              outstanding alongside the newer debt (CI035). VoltaGrid has not disclosed the purchase price for the
              pending Propell acquisition, so it is unclear how much of the $775 million primary raise funds that deal
              versus organic manufacturing capex (CI036); as of the most recent 2026 reporting, the acquisition had not
              yet formally closed (CI037). With $5.5 billion-plus of disclosed debt and no disclosed EBITDA against
              which to compute leverage, VoltaGrid's effective next-round trigger is continued external financing of its
              300 MW/month manufacturing ramp and 7.5 GW backlog conversion rather than confirmed self-funding from
              operating cash flow (CI038).
