      - CE037
      - CE023
      - CE024
  - id: FU001
    title: Customer Journey Map — Segments, Adoption Surfaces, and Expansion Loops
    type: journey-map
    layout: standard
    summary: >-
      Maps named and case-study customers onto a shared discovery-to-expansion journey, showing how far each segment has
      actually progressed.
    data:
      nodes:
        - id: discovery
          label: Discovery & direct engagement (no reseller/channel identified)
        - id: contract
          label: Contract / Power Delivery Agreement signed
          detail: Oracle (2.3 GW, signed Oct 2025); Vantage (1+ GW, signed Feb 2025)
        - id: build
          label: OEM manufacturing & site construction
          detail: Serverfarm/Covington GA — under construction, disputed permits, not yet operating
        - id: commission
          label: Commissioning & first units live
          detail: Oracle — first units targeted 2026; Vantage — deployments started 2025
        - id: production
          label: Full production operation
          detail: xAI Colossus (live since mid-2024); Aethon Energy / Chesapeake Energy (live since 2021)
        - id: expansion
          label: 'Expansion: repeat OEM orders, new sites, vertical integration'
          detail: INNIO and ABB repeat orders; Propell manufacturing acquisition (May 2026)
