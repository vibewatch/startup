      - number: '7.3'
        title: Operational, Manufacturing, and Quality Risk
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid's May 2026 acquisition of Propell Energy Technology is explicitly framed by the company as
              reducing execution risk on its 7.5 GW order book by bringing manufacturing in-house and expanding
              Granbury, Texas output to roughly 300 MW per month (CR019), but an independent valuation-risk analysis
              notes the two next-generation automated plants underpinning that target were not yet built as of the
              announcement, making the ramp aspirational rather than demonstrated (CR020). The same vertical-integration
              move concentrates disclosed reciprocating-engine manufacturing primarily in one Texas location, creating
              single-site operational risk for a company executing a multi-gigawatt, multi-year backlog (CR021); AInvest
              frames the resulting valuation as 'priced for flawless execution' with little tolerance for cancellation,
              price slippage, or ramp delay (CR022). On the product side, no source reviewed provides independent,
              third-party-audited data behind VoltaGrid's marketed reliability (greater than 99.9% uptime) or
              emissions-reduction (28-40% GHG reduction) figures; all performance claims trace back to company or
              OEM-partner materials (CR023, CR024). The EPA's closure of the mobile non-road-engine exemption, layered
              on top of the active Georgia and Texas permitting disputes, signals growing regulatory scrutiny of the
              minor-source and non-road pathways VoltaGrid has used to accelerate site buildout, raising the odds that
              future sites face costlier, slower major-source review (CR025). Finally, no OSHA incident-rate,
              safety-citation, or union-status data is publicly available for VoltaGrid's oilfield or data-center field
              workforce, leaving labor and workplace-safety exposure for a rapidly scaling operation effectively
              undocumented (CR026).
