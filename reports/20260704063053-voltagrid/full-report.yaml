              VoltaGrid closed a $5.0 billion debt package in November 2025 and a $1.0 billion strategic equity
              investment from Blackstone and Halliburton in May 2026, both from credible, diligence-capable
              institutional counterparties. This repeated capital-market access is itself evidence against near-term
              insolvency risk, even though it does not resolve the underlying operating-metric opacity.
            calloutType: strength
            claimRefs:
              - CI031
              - CI032
              - CI039
          - type: callout
            title: Priority Diligence Requests Before Underwriting VoltaGrid's Economics
            body: >-
              Before treating VoltaGrid's valuation or margin trajectory as underwritten, a diligence process should
              request, at minimum, audited or lender-verified revenue and EBITDA, the Propell acquisition purchase price
              and its funding source, the debt covenant package and consolidated leverage ratio, and confirmation of any
              natural-gas hedging or pass-through mechanism in customer contracts.
            calloutType: recommendation
            claimRefs:
