  - id: FE001
    title: Product Architecture Map
    type: stack
    layout: wide
    summary: >-
      VoltaGrid's platform layers fuel supply, prime generation, grid stabilization, AI dispatch, remote operations, and
      siting into one operating system.
    data:
      layers:
        - label: Fuel Supply & Conditioning
          detail: >-
            Pipeline gas (e.g., Energy Transfer for the Oracle Texas fleet), CNG/LNG trucking, and a patent-pending
            mobile refrigeration/booster compression unit condition field gas to generator-ready spec.
          items:
            - label: Energy Transfer pipeline supply
              detail: Firm natural gas for the Oracle Texas deployment.
            - label: Mobile Refrigeration Unit (MRU)
              detail: Patent-pending single-trailer conditioning, up to 4.2 MMSCF/day.
        - label: Prime Power Generation (QPac)
          detail: >-
            Modular INNIO Jenbacher reciprocating-engine nodes, up to 20-25 MW each, combinable to 200 MW per site under
            one minor-source air permit.
          items:
            - label: QPac node
              detail: 20-25 MW reciprocating-engine unit.
            - label: Multi-node site
              detail: Up to 200 MW combined under one permit.
        - label: Grid Stabilization (StabilAI / ABB)
          detail: >-
            ABB synchronous condensers with flywheel plus prefabricated eHouses hold voltage/frequency swings within
            +/-5%/+/-2% for AI load transients without batteries.
          items:
            - label: Synchronous condensers
              detail: 27 initial units, plus 35 more agreed at CERAWeek 2026.
        - label: AI Monitoring & Dispatch (Access Innovation Portal)
          detail: Near-real-time visibility into demand, emissions, and billing, with AI-driven load forecasting and dispatch.
          items:
            - label: Dispatch software
              detail: In-house software team; no public technical documentation identified.
        - label: Command Center & Field Operations
          detail: >-
            On-site Command Center plus a 24/7 Remote Operations Center (ROC) monitor plant health and dispatch across
            the fleet.
        - label: Site, Permitting & Interconnect
          detail: >-
            Behind-the-meter siting, minor-source air permitting, and optional grid-parallel interconnect (e.g., ERCOT);
            one site (Covington, GA) faces an active permitting enforcement dispute.
