      - number: '2.2'
        title: 'Sizing the market: multiple constrained lenses instead of one TAM'
        blocks:
          - type: paragraph
            body: >-
              No retained source publishes a single TAM, SAM, or SOM figure specifically for behind-the-meter modular
              natural-gas prime power sold to data centres, so this chapter uses several constrained, partially
              overlapping proxies instead of one headline number. The closest dollar-denominated proxy is the global
              data-centre generator market, which four analyst firms size very differently for 2030: Grand View
              Research's base case reaches $12.98 billion, Mordor Intelligence puts the 2026 market at $7.88 billion,
              Precedence Research projects $17.33 billion by 2034, and Arizton's AI-weighted bull case reaches $19.66
              billion by 2030 -- a spread of more than 50% among the 2030-specific figures alone, and this chapter
              preserves that contradiction (Table TM002, Figure FM002) rather than picking a winner. A second,
              GW-denominated proxy comes from the adjacent fuel-cell BTM lane, where providers signed $7.65 billion in
              binding AI data-centre deals between October 2025 and January 2026 and Goldman Sachs projects 8-20 GW of
              fuel-cell capacity by 2030. A third proxy is Cleanview's bottom-up tracker of 59 US data centres with
              roughly 90 GW of announced BTM capacity, 92% of it announced since 2025. Finally, VoltaGrid's own
              disclosed ~7.2 GW generation pipeline for 2027-2029 -- about 8% of Cleanview's tracked base -- offers a
              company-specific anchor, though it is a conference disclosure rather than an audited backlog and carries
              no public per-MW pricing, so it cannot be converted into a dollar figure without an unverified assumption.
              Figure FM001 stacks these proxies as constrained layers rather than a strict TAM-to-SOM waterfall,
              explicitly flagging the unit mismatch between dollars and gigawatts.
