      - number: '8.5'
        title: Recommendation, Confidence, and Risk Rating
        blocks:
          - type: paragraph
            body: >-
              This chapter's recommendation is track (research-more) rather than buy or avoid. Confidence is medium: the
              underlying financing facts (round sizes, dates, investors, debt structure) are corroborated across
              multiple independent sources and are high-confidence, but the valuation call itself is only as good as an
              unaudited, company- and Fitch-sourced 2028 EBITDA target, which keeps overall confidence from rising to
              high. Risk rating is high, driven by the active Georgia Clean Air Act enforcement request, roughly $5.5
              billion of secured debt against an unverified earnings base, undisclosed gas-price hedging on fixed-price
              contracts, and concentration in two named hyperscale customers. Valuation stance is stretched: the implied
              ~9x equity-value/2028E-EBITDA (~13-14x forward EV/EBITDA) is not extreme against current public
              comparables, but those comparables trade on audited numbers while VoltaGrid's do not, so the multiple's
              apparent reasonableness is conditional on inputs this chapter cannot independently verify. The quality bar
              for this chapter explicitly disfavors false precision when valuation inputs are missing, which is why the
              call is track rather than a numbered price target: existing holders have real, sponsor-validated
              collateral to point to, but new capital should wait for audited financials, the Propell purchase price,
              and the Georgia EPD outcome before underwriting the price with higher confidence.
