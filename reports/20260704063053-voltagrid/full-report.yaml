      - number: '2.6'
        title: Diligence gaps, contradictory estimates, and what remains unresolved
        blocks:
          - type: paragraph
            body: >-
              Three items remain genuinely unresolved rather than merely under-detailed, and this chapter preserves them
              as open gaps instead of forcing a single answer. First, no retained source discloses VoltaGrid's actual
              per-MWh or per-MW-month contract pricing, so the widely circulated $70-100/MWh industry range cannot be
              verified against VoltaGrid's specific deals with Oracle, Vantage, xAI, or the Halliburton Eastern
              Hemisphere commitment; this blocks any bottom-up revenue estimate from the disclosed 7.2 GW pipeline.
              Second, every analyst sizing lens in Table TM002 blends backup and prime power and mixes diesel with gas,
              so no publisher isolates the specific share of the $8-20 billion generator-market estimates attributable
              to modular BTM natural-gas prime power; using the blended totals as VoltaGrid's addressable market would
              overstate the true opportunity, and the 50%-plus spread between Grand View Research's and Arizton's 2030
              figures (Figure FM002) is preserved here as a genuine contradiction rather than averaged away. Third,
              whether ERCOT, MISO, or SPP will eventually mirror FERC's PJM-specific co-location and BTM-netting
              overhaul is unresolved; if they do, VoltaGrid's core Texas market could eventually face the same
              constraint currently limited to PJM territory. Each of these three gaps is logged with a concrete
              diligence path in localEvidence.evidenceGaps rather than closed with an invented figure, consistent with
              this chapter's evidence-constrained approach to sizing and adoption.
            claimRefs:
              - CM020
              - CM024
              - CM030
