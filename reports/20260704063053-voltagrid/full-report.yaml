      - number: '3.4'
        title: Switching Costs, Lock-In, Multi-Homing, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              Behind-the-meter power contracts are structurally sticky. Legal analysis of BTM arrangements describes
              5-15 year take-or-pay terms with exit fees for early grid transition, meaning a data-center operator that
              signs with VoltaGrid, Enchanted Rock, Bloom, or any comparable provider accepts multi-year lock-in rather
              than an easily reversible vendor choice; this raises the cost of switching but also means the market
              largely competes for new capacity commitments rather than displacing installed incumbents. Distribution
              power is asymmetric across competitor classes: LS Power retained roughly 10 GW of generation plus its LS
              Power Grid transmission platform (780-plus miles in service, 350-plus more under construction) even after
              selling 13 GW plus the CPower virtual-power-plant platform to NRG for about $12 billion, preserving a
              physical-infrastructure advantage that asset-light BTM entrants like VoltaGrid do not hold. FERC's new PJM
              co-location rule imposes a 50 MW threshold above which BTM netting benefits disappear for new
              arrangements, a region-specific constraint that does not bind VoltaGrid's current ERCOT-centered fleet but
              would raise the cost of any competitor, VoltaGrid included, expanding BTM capacity inside PJM territory.
              Whether hyperscalers can multi-home across BTM providers on a single campus, diversifying supply the way
              they multi-source cloud infrastructure, is not established in the public record and remains an open
              diligence question.
            claimRefs:
              - CP022
              - CP038
              - CP039
      - number: '3.5'
        title: Moat Durability, Displacement Risk, and Adverse Competitor Evidence
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid's stated moat rests on speed-to-power via modular reciprocating engines, a newly vertically
              integrated manufacturing base (the Propell acquisition, targeting 300 MW/month), and a contracted 7.5 GW
              backlog through 2030. None of these is unique in the current cycle: Enchanted Rock/ERock, Bloom Energy,
              Caterpillar, and Generac all report AI-data-center-driven backlog or order growth over the same 2025-2026
              window, indicating the entire sector is riding the same demand surge rather than VoltaGrid capturing a
              disproportionate share. Commoditization risk is real at the margin - Generac's overall revenue actually
              fell 2% in 2025 even as its data-center-linked C&I segment grew, showing that data-center exposure alone
              does not guarantee financial outperformance - and displacement risk exists at the technology layer if
              ESG-sensitive hyperscalers shift toward Vistra-style nuclear PPAs or Bloom-style fuel cells away from
              combustion-based gas. Adverse evidence reinforces this: the NAACP and Southern Environmental Law Center's
              2025 Notice of Intent to Sue xAI over unpermitted Memphis turbines, and RealClearEnergy's critique of
              Meta's Entergy gas deal as inconsistent with "100% clean" claims, show that permitting and greenwashing
              scrutiny apply to gas-fired BTM broadly, not to VoltaGrid alone. Separately, Goldman Sachs has flagged
              that AI data-center capacity growth (projected to roughly 92 GW by 2027) could outrun actual AI
              monetization, a macro risk that would compress order books across every competitor profiled here,
              including VoltaGrid.
            claimRefs:
              - CP017
