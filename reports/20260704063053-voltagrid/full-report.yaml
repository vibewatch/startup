  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Regulatory, operational, partner, people, financial, and ESG/political risks converge on a small number of
      financial outcomes: revenue/backlog conversion, gross margin, financing cost and access, customer retention, and
      equity valuation.
    data:
      nodes:
        - id: reg
          label: Regulatory / Legal Risk
          detail: Georgia enforcement, Texas major-source permitting, federal methane and FERC/PJM rulemaking.
          tone: negative
        - id: ops
          label: Operational / Manufacturing Risk
          detail: Granbury ramp shortfall, single-site concentration, unverified reliability/emissions claims.
          tone: warning
        - id: partner
          label: Partner / OEM Dependency Risk
          detail: INNIO, ABB, Energy Transfer, Halliburton, Oracle/Vantage concentration.
          tone: warning
        - id: people
          label: People / Governance Risk
          detail: Key-person reliance on Nathan Ough; Halliburton board representation.
          tone: warning
        - id: fin
          label: Financial / Commodity Risk
          detail: $5.0B debt load, undisclosed gas hedging, rising Henry Hub forecasts.
          tone: negative
        - id: esg
          label: ESG / Political Risk
          detail: Emissions backlash, investor ESG scrutiny, electricity-price political salience.
          tone: warning
        - id: revenue
          label: Revenue / Backlog Conversion
          tone: neutral
        - id: margin
          label: Gross Margin
          tone: neutral
        - id: financing
          label: Financing Cost / Access
          tone: neutral
        - id: customers
          label: Customer Retention / Concentration
          tone: neutral
        - id: valuation
          label: Equity Valuation
          tone: neutral
      edges:
        - from: reg
          to: revenue
          label: permit delay/stop-work
        - from: reg
          to: margin
          label: retrofit/compliance cost
        - from: ops
          to: revenue
          label: manufacturing ramp delay
        - from: ops
          to: margin
          label: reliability/warranty exposure
        - from: partner
          to: revenue
          label: OEM/fuel delivery delay
        - from: partner
          to: customers
          label: concentrated anchor accounts
        - from: people
          to: financing
          label: governance/related-party discount
        - from: fin
          to: margin
          label: commodity/fuel-cost pass-through gap
        - from: fin
          to: financing
          label: covenant/refinancing risk
        - from: esg
          to: customers
          label: hyperscaler net-zero pressure
        - from: esg
          to: financing
          label: investor ESG scrutiny
        - from: revenue
          to: valuation
        - from: margin
          to: valuation
        - from: financing
          to: valuation
        - from: customers
          to: valuation
    approximationNotes: >-
      Edges represent the author's inferred transmission channels linking each risk category to financial outcomes; they
      are not a VoltaGrid-disclosed causal model.
