            body: >-
              VoltaGrid's go-to-market motion is direct enterprise sales to hyperscale and colocation data-center
              operators and industrial accounts, not a channel, reseller, or self-serve model, consistent with its named
              VP of Sales role for oil & gas/mining and separate data-center/microgrid development lead (CI027). The
              clearest public sales-cycle proxy is deployment speed rather than a disclosed CAC or payback figure:
              VoltaGrid's generators reportedly arrived at xAI's Memphis Colossus site in June 2024 and were powering
              the facility within about 122 days, an early proof point for a fast site-to-revenue cycle (CI028). A
              second efficiency proxy is the pace at which OEM partners book incremental orders on VoltaGrid's behalf --
              INNIO's 1.5 GW February 2026 order and ABB's March 2026 extension to 35 synchronous condensers both
              followed within months of the October 2025 Oracle deal, suggesting the sales motion is converting new
              anchor contracts into supplier-side backlog quickly even though VoltaGrid's own booking-to-revenue
              timeline is not disclosed (CI029). This vendor-order cadence is a useful, if indirect, sales-efficiency
              signal: it corroborates commercial momentum through a third party's own disclosure discipline, partially
              offsetting the absence of VoltaGrid-reported deal metrics, but it cannot substitute for an actual CAC,
              sales-cycle length, or channel-economics figure that a diligence process would need to size
              customer-acquisition efficiency (CI030).
            claimRefs:
              - CI027
              - CI028
              - CI029
