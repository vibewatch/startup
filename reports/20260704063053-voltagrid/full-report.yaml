      - number: '8.4'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              In the bull case, the 7.5 GW order book converts on schedule, the Propell-driven Granbury manufacturing
              ramp reaches its targeted ~300 MW/month, 2028 EBITDA meets or exceeds the $1.1 billion target, and the
              multiple re-rates toward the equipment-comparable premium (18-20x forward EV/EBITDA), implying an
              enterprise value near $18-22 billion by 2028 -- roughly double the May 2026 mark. The base case assumes
              modest execution slippage and cost pressure from Propell integration and permitting friction, landing 2028
              EBITDA between $700 million and $1.0 billion with the multiple holding near the ~13-14x already implied in
              the May 2026 raise, leaving enterprise value roughly flat to modestly up -- consistent with AInvest's
              framing that the valuation is 'priced for flawless execution' rather than priced for upside surprise. The
              bear case combines an escalating Georgia and/or Texas enforcement outcome, a natural-gas price spike
              against undisclosed hedging, and a slowdown or repricing from the concentrated Oracle/Vantage customer
              base, compressing 2028 EBITDA to $500-700 million and the multiple toward Vistra/NRG-like 9-11x, implying
              an enterprise value near $5-8 billion -- a markdown from today's mark that would also strain debt service
              on the roughly $5.5 billion of secured leverage. None of the three scenarios can be assigned a precise
              probability from public evidence; the base case is treated as the modal outcome because it requires the
              fewest simultaneous adverse events.
