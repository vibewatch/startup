  - id: FV004
    title: Investment KPI scorecard
    type: kpi
    layout: standard
    summary: IC-ready 0-10 scoring across market, proof, moat, economics, risk, valuation entry, and evidence quality.
    data:
      items:
        - label: Market timing / demand
          value: 8
          note: AI data-center power scarcity is real and well-documented, though cyclicality risk exists
        - label: Commercial proof
          value: 7
          note: Oracle/Vantage contracts and the reported >$1B/yr single-site payment are strong but concentrated
        - label: Competitive moat
          value: 5
          note: QPac/StabilAI differentiate on deployment speed, but INNIO/ABB OEM dependency limits defensibility
        - label: Unit economics / margin visibility
          value: 3
          note: No audited revenue, EBITDA, or margin disclosure exists
        - label: Financial risk / leverage
          value: 4
          note: ~$5.5B of secured debt sits against an unaudited EBITDA base
        - label: Regulatory / legal risk
          value: 3
          note: Active Georgia enforcement request and a pending Texas permit review
        - label: Evidence quality
          value: 4
          note: Valuation math rests on company-guided, Fitch-sourced projections rather than audited filings
    approximationNotes: >-
      Scores are author judgment calibrated against the evidence in this chapter, not a third-party or model-generated
      rating.
    claimRefs:
      - CV010
      - CV007
      - CV044
      - CV011
      - CV003
      - CV037
