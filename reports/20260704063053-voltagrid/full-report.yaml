      - number: '6.2'
        title: 'Adoption Trajectory: Contracted Backlog vs. Delivered Capacity'
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid's disclosed adoption trajectory is best read as order-book growth rather than usage growth,
              since the company does not publish deployed-megawatt, active-account, or utilization figures. Independent
              trade analysis put VoltaGrid's cumulative contracted behind-the-meter capacity at more than 4,350 MW as of
              its October 2025 Oracle announcement, up from the 1+ GW Vantage commitment signed only eight months
              earlier in February 2025 (CU006). The Oracle contract itself illustrates the gap between signing and
              delivery: it was announced October 15, 2025, with first units targeted for roughly April 2026 and full 2.3
              GW build-out phased through 2028, a multi-year delivery curve rather than an immediate go-live (CU007).
              VoltaGrid's EY Entrepreneur of the Year citation separately credits the company with "a sixfold increase"
              in scale since founding, but this narrative figure has no disclosed revenue, customer-count, or MW
              denominator attached to it (CU008). Independent reporting also shows real limits on outside verification:
              Data Center Dynamics stated it had contacted VoltaGrid to confirm which specific product line (QPac or
              another) would power the Vantage sites and had not received a confirming answer as of publication (CU009).
              Absent a disclosed customer register, the only visible adoption proxies are repeat OEM order growth with
              INNIO and ABB and Vantage's own disclosure that it separately operates 1,263 MW of U.S. data-center
              capacity, which provides an independent scale yardstick against which VoltaGrid's >1 GW commitment can be
              sized (CU010, CU041). The Oracle-linked Texas site is also tied to Project Stargate, the
              OpenAI/SoftBank/Oracle AI-infrastructure consortium announced in January 2025, meaning the ultimate demand
              signal behind VoltaGrid's largest contract runs through a multi-party initiative rather than Oracle alone
              (CU042).
