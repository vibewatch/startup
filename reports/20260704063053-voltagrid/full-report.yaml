              The table below profiles VoltaGrid's most relevant comparators on scale, funding, target segment,
              differentiation, and limitation, each grounded in a company disclosure or independent report dated
              2025-2026. Enchanted Rock/ERock filed for a U.S. IPO targeting a roughly $5 billion valuation, disclosing
              a $1.3 billion contracted backlog across about 400 sites; its "Resiliency-as-a-Service" billing removes
              customer upfront capital but caps single-site scale well below VoltaGrid's 20-200+ MW blocks. Bloom
              Energy's fuel-cell backlog reached roughly $20 billion on 2025 revenue of $2.02 billion (up 37.3%),
              anchored by a Brookfield commitment of up to $5 billion; its differentiation is fuel flexibility and a
              quieter, combustion-free footprint, at a cost and power-density penalty versus reciprocating engines.
              Caterpillar's Power Generation segment sales grew 44% in Q4 2025 against a company-wide $51 billion
              backlog (up 71%), and Cummins posted record Power Systems performance behind an 8-11% 2026 revenue
