  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition in Customer Workflow Terms
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid sells behind-the-meter natural-gas power as a managed service rather than as standalone
              generation hardware: under a Power Delivery Agreement (PDA), VoltaGrid installs, owns, and operates
              on-site generation while the customer pays a pre-set rate for delivered power over the contract term
              (CE001). The company positions the same underlying platform two ways in customer workflow terms: as a
              short-term bridge that covers a data center through a delayed utility interconnection, and as a long-term
              or permanent on-site prime-power source once a site is built out (CE002). The product line began in
              electric hydraulic fracturing, where pressure-pumping loads swing from over 16 MWe to under 0.75 MWe
              within an hour, a duty-cycle problem VoltaGrid's original mobile generator-and-storage platform was
              purpose-built to absorb (CE003). Independent trade coverage frames VoltaGrid's core value proposition as
              installation speed in power-constrained markets rather than lowest-cost generation, a positioning that
              recurs across every named customer contract discussed later in this chapter (CE004).
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
      - number: '5.2'
        title: Module, Platform, and Asset Map
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid's product portfolio spans four distinct modules. QPac is the flagship data-center platform:
              modular reciprocating-engine nodes of up to 20-25 MW each, built on INNIO Jenbacher engines and combinable
              up to 200 MW per site under a single minor-source air permit (CE005, CE006). StabilAI is the companion
              grid-stabilization layer, pairing ABB synchronous condensers and flywheel inertia with prefabricated
              eHouses to hold voltage within +/-5% and frequency within +/-2% during AI/GPU load swings, without battery
              storage (CE007). The Access Innovation Portal is the AI-enabled monitoring and dispatch software that
              gives near-real-time visibility into demand, emissions, and billing across the fleet (CE008). The original
              hybrid oilfield platform, portable generation, storage, an optional grid tie, and the same Access
              Innovation Portal, remains in service for E-frac customers (CE009), supported by a patent-pending mobile
              refrigeration unit and booster compression system that conditions field, CNG, LNG, or renewable gas at up
              to 4.2 MMSCF/day per trailer and strips out natural gas liquids for resale (CE010, CE011). VoltaGrid does
              not disclose in-house manufacturing of the engines or condensers underlying either module (CE012).
            claimRefs:
