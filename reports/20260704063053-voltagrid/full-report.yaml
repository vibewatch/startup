      - number: '7.4'
        title: 'Partner and Dependency Risk: OEMs, Fuel Supply, and the Halliburton Relationship'
        blocks:
          - type: paragraph
            body: >-
              INNIO Jenbacher is VoltaGrid's sole disclosed reciprocating-engine OEM, and INNIO's own release describes
              VoltaGrid's October 2025, 92-unit, 2.3 GW order as the largest by power delivery in INNIO's corporate
              history -- concentrating close to a third of VoltaGrid's 7.5 GW order book on a single supplier's
              production schedule (CR027). ABB is similarly the sole disclosed automation and grid-stabilization OEM
              behind the StabilAI layer (CR028), and independent trade coverage confirms Energy Transfer as the sole
              named gas-pipeline counterparty feeding VoltaGrid's flagship Oracle Texas fleet (CR029). The most
              structurally unusual dependency, however, is Halliburton, which simultaneously holds a May 2026 equity
              stake, a December 2025 400 MW Eastern Hemisphere power commitment, and a multi-year Aethon Energy
              electric-fracturing contract dating to 2024 (CR030, CR033); VoltaGrid's own board-of-directors page
              confirms that two Halliburton executives -- CFO Eric Carre and Treasurer Tim McKeon -- both sit as
              VoltaGrid directors (CR031), a concentration that raises governance and related-party-transaction risk
              given that board decisions on Halliburton-linked capital, supply, or pricing terms are not reviewed by a
              fully independent board (CR032). On the demand side, Oracle and Vantage Data Centers are VoltaGrid's two
              primary named gigawatt-scale customers, meaning contract cancellation or delay at either account would
              materially affect backlog conversion (CR020). Finally, CB Insights and InforCapital both track VoltaGrid
              only as a partially disclosed private company, so independent analysts cannot fully verify VoltaGrid's own
              investor-facing revenue or customer-count claims against third-party data (CR035). The concentration and
              counterparty exposure map (FR003) traces how these dependencies converge on the platform.
