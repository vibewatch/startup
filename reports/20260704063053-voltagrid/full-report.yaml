  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation Across Two Distinct Buyer Bases
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid's named customer relationships split into two structurally different segments rather than one
              homogeneous buyer base (CU001). The AI data-center segment (Oracle Cloud Infrastructure, Vantage Data
              Centers, Serverfarm) buys, uses, and pays through the same corporate entity at gigawatt scale under
              multi-year, phased-delivery agreements, while the legacy oilfield electric-hydraulic-fracturing segment
              (Aethon Energy, Chesapeake Energy) operates at site-level tens-of-megawatts scale but has been live since
              2021 (CU002). Geographically the data-center segment concentrates in Texas (Oracle's Shackelford County /
              Stargate-linked site), Georgia (Serverfarm's Covington campus), and Tennessee (xAI's Memphis Colossus
              site), while the oilfield segment concentrates in the Haynesville and Marcellus shale basins (CU003).
              VoltaGrid's own anonymized case studies point to at least three further sub-segments beyond its marquee
              logos: an unnamed Southwest U.S. data-center operator, an unnamed New Mexico oil-and-gas producer using
              flare-gas-to-power conversion, and an unnamed Gulf Coast utility that used VoltaGrid for storm-recovery
              power (CU004). The company's own Propell acquisition release also frames its target customer set
              aspirationally as "data centers, AI infrastructure, utilities, and industrial customers across North
              America," signaling intent to broaden beyond the named logos already under contract (CU005). Across every
              named contract reviewed, VoltaGrid appears to sell directly to the end operator rather than through a
              reseller, systems integrator, or distribution channel, and no channel-partner network was identified in
              any source reviewed for this chapter (CU044, CU045).
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU044
              - CU045
