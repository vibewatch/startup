      - number: '5.5'
        title: 'Differentiation: Technology, IP, and Supply Access'
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid's most defensible differentiation is speed: independent coverage credits the company with
              installing capacity "within months" against multi-year data-center interconnection queues (CE046),
              reinforced by its no-battery StabilAI design, which the company positions as a simpler, faster-to-deploy
              alternative to gas-plus-battery competitors (CE047). Formal IP backs some of this: VoltaGrid holds granted
              U.S. patent US12500423B2, a continuation of application US20220140614A1, for a mobile hybrid microgrid,
              naming CEO Nathan Ough and engineer Leslie Michael Wise as inventors (CE048), and its Justia
              patent-assignee record shows continued filing activity, including a modular gas-processing system
              published in 2026 and a synchronous-condenser power-generation patent granted in 2025 (CE049).
              Structurally, though, VoltaGrid's differentiation rests on being the systems integrator rather than the
              manufacturer: it packages third-party INNIO engines and ABB condensers rather than building its own, and
              both OEMs describe their VoltaGrid orders as among the largest in their respective corporate histories, a
              sign of prioritized supplier access that smaller rivals may not obtain, but also a single-source
              concentration risk (CE012, CE050).
