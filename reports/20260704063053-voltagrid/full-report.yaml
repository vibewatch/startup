      - number: '4.6'
        title: 'Financial Verdict: Revenue Quality, Margin Path, and Diligence Blockers'
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid's financial profile combines strong, repeatedly demonstrated access to institutional capital
              with near-total opacity on the operating metrics that would let a diligence process independently
              underwrite its economics. The company has closed roughly $6.5 billion of disclosed debt and equity since
              2024 alone (CI039), backed by credible counterparties (Blackstone, Halliburton, a syndicated bank group),
              which is a genuine signal of institutional confidence in the contracted-capacity thesis. Set against that,
              revenue, EBITDA, gross margin, cash position, burn rate, fuel-hedging policy, and the Propell purchase
              price are all undisclosed, and the company-guided ~$1.1 billion 2028 EBITDA target implies roughly a 5-6x
              increase from an analyst-implied 2024 baseline of ~$180-220 million with "little room for error,"
              according to at least one valuation-risk analysis (CI040). Public comparables suggest the margin path is
              plausible in principle (17-38% gross/EBITDA range) but cannot confirm it applies to VoltaGrid specifically
              (CI041). An active Georgia Clean Air Act enforcement matter adds a live, unquantified cost and
              reputational tail risk on top of that financial opacity (CI042). The verdict this chapter reaches is that
              VoltaGrid's revenue quality and margin trajectory are directionally credible given its contracted order
              book and comparable-company benchmarks, but they are not independently verifiable from public evidence,
              and the capital-adequacy picture depends on continued external financing rather than confirmed
              self-funding.
