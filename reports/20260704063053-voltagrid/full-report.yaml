        title: Cost Structure, Gross Margin Drivers, and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid's cost structure is shifting toward vertical integration: its pending acquisition of long-time
              supplier Propell Energy Technology brings roughly 1,000 US and Canadian manufacturing employees in-house
              and is intended to reduce supply-chain execution risk on the order book rather than to disclose a specific
              cost-per-unit saving (CI016), while two new automated Granbury, Texas plants target a combined ~300
              MW/month of reciprocating-engine and turbine output (CI017). No retained source discloses VoltaGrid's cost
              of revenue, gross margin, or per-project unit economics (CI018). Public comparable-company filings offer
              the best available benchmark: Generac's FY2025 Form 10-K reports a 38.3% gross margin and $715.5 million
              of total Adjusted EBITDA (about 17.0% of net sales) (CI019); Bloom Energy's FY2025 10-K shows total
              revenue up 37.3% to roughly $2.02 billion with a gross margin near 29% (CI020); Cummins' Power Systems
              segment sales grew 16% in FY2025 on data-center-driven power-generation demand (CI021); and Caterpillar's
              Power & Energy segment reports 2025 sales growth in large reciprocating engines "primarily data center
              applications" (CI022). Together these suggest a plausible 17-38% gross/EBITDA margin band for a scaled
              power-generation business (CI023), but no source discloses whether VoltaGrid hedges natural-gas fuel
              costs, leaving margin exposure to gas-price volatility unconfirmed either way (CI024). A June 2026 Clean
              Air Act enforcement request against a VoltaGrid site in Covington, Georgia adds an unquantified retrofit,
              fine, or shutdown cost risk on top of that opacity (CI025, CI026).
