  - id: FR003
    title: Concentration and counterparty exposure map
    type: dag
    layout: wide
    summary: >-
      VoltaGrid's execution depends on a small set of concentrated counterparties -- two OEMs, one named fuel-pipeline
      partner, a multi-role investor, two anchor customers, two active regulators, and one lending syndicate.
    data:
      nodes:
        - id: vg
          label: VoltaGrid
          detail: Behind-the-meter QPac/StabilAI platform executing a 7.5 GW order book.
          tone: neutral
        - id: innio
          label: INNIO Jenbacher
          detail: Sole reciprocating-engine OEM; single 2.3 GW order was INNIO's largest ever.
          tone: warning
        - id: abb
          label: ABB
          detail: Sole synchronous-condenser / eHouse OEM for StabilAI.
          tone: warning
        - id: et
          label: Energy Transfer
          detail: Sole named gas-pipeline supplier for the Oracle Texas fleet.
          tone: warning
        - id: hal
          label: Halliburton
          detail: Equity investor, two board seats, 400 MW partner, and Aethon E-frac partner simultaneously.
          tone: negative
        - id: lenders
          label: Goldman Sachs / JPMorgan lender syndicate
          detail: $5.0B senior notes and ABL facility arranged November 2025.
          tone: neutral
        - id: gaepd
          label: Georgia EPD
          detail: Active Clean Air Act enforcement request pending at the Covington site.
          tone: negative
        - id: tceq
          label: TCEQ
          detail: Pending major-source permit review for the ABI-1 Texas expansion.
          tone: negative
        - id: oracle
          label: Oracle
          detail: Anchor data-center customer, 2.3 GW contracted.
          tone: warning
        - id: vantage
          label: Vantage Data Centers
          detail: Anchor data-center customer, 1+ GW contracted.
          tone: warning
      edges:
        - from: innio
          to: vg
          label: engine supply concentration
        - from: abb
          to: vg
          label: automation supply concentration
        - from: et
          to: vg
          label: fuel supply concentration
        - from: hal
          to: vg
          label: equity + board + operating partner
        - from: lenders
          to: vg
          label: $5.0B secured financing
        - from: gaepd
          to: vg
          label: active enforcement request
        - from: tceq
          to: vg
          label: pending major-source permit
        - from: vg
          to: oracle
          label: largest named contract
        - from: vg
          to: vantage
          label: second-largest named contract
        - from: hal
          to: oracle
          label: no disclosed overlap
    approximationNotes: >-
      This map isolates counterparty concentration and regulatory exposure as a distinct risk lens; it is not a
      restatement of the product-architecture dependency map presented elsewhere in this report.
    claimRefs:
      - CR027
      - CR028
      - CR029
      - CR030
      - CR031
      - CR001
      - CR009
  - id: FV001
    title: Recommendation logic chain
    type: flow
    layout: standard
    summary: How scale, proof, sponsor validation, and risk combine into the valuation call and final recommendation.
    data:
      nodes:
        - id: scale
          label: 'Scale: ~7.5 GW order book / ~4.3 GW contracted through 2028'
        - id: proof
          label: 'Proof: Oracle, Vantage live contracts; >$1B/yr single-site Oracle payment reported'
        - id: sponsors
          label: 'Sponsor validation: Blackstone, Halliburton, CPP Investments'
        - id: risk
          label: 'Risk: GA/TX enforcement, leverage, customer concentration, no audited financials'
        - id: valuation
          label: 'Valuation: >$10B mark implies ~9x equity/2028E EBITDA (~13-14x forward EV/EBITDA)'
        - id: recommendation
          label: 'Recommendation: Track -- re-underwrite once audited financials and the EPD outcome are known'
      edges:
        - from: scale
          to: valuation
        - from: proof
          to: valuation
        - from: sponsors
          to: valuation
        - from: risk
          to: recommendation
        - from: valuation
          to: recommendation
    approximationNotes: A qualitative logic chain, not a weighted scoring model.
    claimRefs:
      - CV010
      - CV007
      - CV001
      - CV037
      - CV032
      - CV049
