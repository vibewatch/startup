  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: what VoltaGrid''s addressable market is and is not'
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid's addressable market is best defined narrowly, not broadly: behind-the-meter (BTM) modular
              natural-gas prime power sold or contracted directly to hyperscale and AI-native data-centre operators,
              rather than the entire universe of data-centre power spending. That boundary matters because global
              data-centre electricity demand is itself surging -- up 17% in 2025 against roughly 3% overall grid growth,
              with the five largest technology companies' capital expenditure exceeding $400 billion in 2025 and set to
              rise a further 75% in 2026 -- but only a fraction of that broader demand converts into BTM gas contracts
              of the kind VoltaGrid sells. Excluded from VoltaGrid's core segment are grid-purchased utility power,
              renewable-only power-purchase agreements, nuclear small modular reactors, and diesel-only backup
              generation, each of which is a real substitute a data-centre operator's budget could fund instead. The
              closest adjacent substitute is fuel-cell primary power (led by Bloom Energy), which competes for the same
              hyperscaler capital within the same behind-the-meter budget line rather than sitting in a wholly separate
              category. VoltaGrid's own legacy oilfield-electrification and industrial-microgrid business is a smaller,
              earlier segment that remains distinct from its newer gigawatt-scale AI data-centre pivot. Table TM001 lays
              out this boundary segment by segment, including included and excluded spend, so later sizing and buyer
              analysis in this chapter are anchored to a defined market rather than treated as coextensive with the
              entire AI power buildout.
            claimRefs:
              - CM047
              - CM048
              - CM049
              - CM001
              - CM002
