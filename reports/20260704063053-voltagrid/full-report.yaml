      - number: '2.3'
        title: Buyer, user, and payer segmentation across the value chain
        blocks:
          - type: paragraph
            body: >-
              Five distinct segments buy, use, or pay for gas-fired behind-the-meter power, and their budget ownership
              and adoption triggers differ meaningfully (Table TM003, Figure FM003). Hyperscale cloud/AI operators are
              the segment most often cited for gigawatt-scale contracts -- Barclays analysts specifically point to
              VoltaGrid's 2.3 GW Oracle agreement as the leading example of developers paying directly, through their
              own infrastructure and energy-procurement teams, to bypass multi-year grid interconnection delays.
              Colocation and multi-tenant developers such as Vantage Data Centers form a second segment, buying BTM
              power on behalf of tenants to de-risk pre-leased delivery dates across a multi-site portfolio, a distinct
              capital-budget path from hyperscalers that typically self-develop and self-finance their own campuses.
              AI-native infrastructure owner-operators (xAI, Crusoe, and OpenAI/Stargate-linked developers) form a third
              segment defined by extreme speed-to-power urgency tied to compute-constrained AI training races. A fourth
              segment, utilities and independent power producers such as NRG Energy (which is acquiring LS Power's 13 GW
              gas fleet plus a 6 GW virtual-power-plant platform for roughly $12 billion), competes with BTM entrants
              for the same large-load hyperscaler contracts rather than ceding the segment. Across these segments, legal
              commentary indicates the power provider commonly retains capital-budget ownership and operational risk for
              the generation asset itself, while the data-centre customer typically bears curtailment and reliability
              risk under the contract -- an allocation pattern diligence should confirm deal by deal rather than assume
              uniformly.
