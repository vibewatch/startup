  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Peers, Incumbents, Adjacents, Substitutes, and Status Quo'
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid competes in a landscape structured less by a single product category than by how quickly and
              reliably a buyer can get incremental power onto an AI data-center campus. Four broad classes exist. Direct
              peers sell managed behind-the-meter (BTM) power as a service on multi-year contracts: Enchanted Rock
              (rebranding as ERock ahead of a 2026 IPO) and Bloom Energy are VoltaGrid's closest business-model analogs,
              though Enchanted Rock's microgrid modules run far smaller (500 kW-3.5 MW) and Bloom's fuel cells trade
              power density for a cleaner emissions profile. Incumbent OEM suppliers - Caterpillar, Cummins, Generac,
              and GE Vernova - sell generation equipment or turbines rather than a turnkey service, and in most
              disclosed deals the customer or an integrator, not the OEM, owns operating risk. Adjacent grid-connected
              incumbents, NRG (post its roughly $12 billion LS Power asset purchase) and Vistra, offer utility-style
              PPAs and nuclear/gas capacity that substitute for BTM power where interconnection queues are shorter.
              Finally, status-quo and internal-build alternatives - hyperscalers self-installing turbines (xAI),
              vertically integrated AI-infrastructure developers (Crusoe), and independent data-center developers
              sourcing gas directly (CloudBurst) - show that some buyers bypass a third-party power vendor altogether.
              Likely near-term entrants include additional OEMs expanding into managed-service models as new
              manufacturing capacity comes online in 2026.
            claimRefs:
              - CP001
              - CP002
              - CP009
              - CP013
