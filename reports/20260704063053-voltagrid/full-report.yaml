      - number: '6.3'
        title: 'Named Customer Proof: Production, Pilot, and Under-Construction Status'
        blocks:
          - type: paragraph
            body: >-
              Distinguishing production from pilot status is the single most important diligence lens on VoltaGrid's
              customer base, because logos alone conflate very different levels of real deployment. Oracle Cloud
              Infrastructure's 2.3 GW contract and Vantage Data Centers' 1+ GW contract are both real, named, and
              quoted-on-the-record commitments, but both remain in the contracted/executing phase rather than fully live
              as of the July 2026 research date (CU011, CU012). By contrast, VoltaGrid's mobile generators helped xAI
              stand up its Memphis Colossus data center in roughly 122 days beginning around mid-2024, making it the
              clearest fully operational, independently reported AI data-center deployment in the portfolio (CU013). The
              oilfield segment provides VoltaGrid's longest continuously live named relationships: Aethon Energy's
              Haynesville electric-frac operation, running on Halliburton Zeus e-pumps and VoltaGrid power, has operated
              since a 2021 multi-year contract announcement, and Chesapeake Energy's Marcellus e-frac operation is cited
              in the same trade coverage as a second live account, though neither discloses deployed megawattage (CU014,
              CU015). Serverfarm's Covington, Georgia site sits at the opposite end of the maturity spectrum: as of July
              2026 only 8 of a planned 33 gas engines had been installed and no final state air permit had been issued,
              making it a pilot/under-construction project rather than a production deployment despite being publicly
              named alongside VoltaGrid's largest contracts (CU016). VoltaGrid's own case studies documenting a
              Southwest data-center CNG conversion and a Gulf Coast utility storm-recovery microgrid are real, confirmed
              deployments by company account, but both remain anonymized and therefore outside independent verification
              (CU017, CU018).
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
