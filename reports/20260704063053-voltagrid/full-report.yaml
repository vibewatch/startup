              detail: Data Center Dynamics and Natural Gas Intelligence.
            - label: Reference deployment over 1+ year
              tone: positive
              detail: 14 to roughly 35 generators tracked over time.
            - label: Sector regulatory scrutiny
              tone: warning
              detail: EPA non-road-engine reclassification followed this deployment category.
