      - number: '5.6'
        title: Trust, Safety, and Compliance Controls
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid's compliance record is mixed. On one active site, the Southern Environmental Law Center's June
              2026 enforcement request alleges VoltaGrid began constructing 8 of a planned 33 methane-gas engines at a
              Covington, Georgia data-center project before securing required Clean Air Act preconstruction air permits,
              with adjacent customer Serverfarm alleged to have installed 36 of 37 diesel units under the same gap
              (CE039); the Atlanta Journal-Constitution's July 2026 reporting corroborates the unpermitted-construction
              allegation and frames it as Georgia's first off-grid "pop-up" power plant serving a data center (CE040).
              At a sector level, the EPA's closure of a "non-road engine" exemption now subjects mobile turbines like
              those VoltaGrid supplies to Clean Air Act stationary-source permitting, a reclassification that follows
              earlier scrutiny of the xAI Memphis site (CE041, CE042). VoltaGrid's own emissions claim, a 28-40% GHG
              reduction versus dual-fuel/turbine alternatives, is company-disclosed without an identified independent
              verification source (CE043). The careers page shows a dedicated HSE function (CE044), but no ISO, UL, or
              comparable third-party certification for QPac or StabilAI was found in any source reviewed for this
              chapter.
