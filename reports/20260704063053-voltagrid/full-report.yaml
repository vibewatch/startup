      - number: '6.4'
        title: Retention, Durability, and Satisfaction Gaps
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid discloses no net revenue retention, gross revenue retention, or churn figure for any customer
              segment, and no evidence located during this research pass closes that gap (CU019). The best available
              durability proxy is negative evidence: the Aethon Energy relationship has continued without a publicly
              reported renewal or termination announcement since its 2021 contract, which is consistent with, but does
              not prove, multi-year durability (CU020). VoltaGrid's data-center contracts with Oracle and Vantage are
              described in company materials as Power Delivery Agreements spanning multiple years, but neither company
              has disclosed contract length, minimum-volume commitments, termination rights, or pricing, leaving the
              durability of even the largest named contracts unverifiable from public sources (CU021). No third-party
              customer review, satisfaction score, or Net Promoter Score could be located on G2, Capterra, Gartner Peer
              Insights, or comparable platforms, a gap that is unsurprising for an industrial infrastructure provider
              but that nonetheless means there is no independent satisfaction signal at all (CU022). The single
              quantified customer outcome located in this research pass is the $38 million cost saving versus diesel
              generators cited in VoltaGrid's anonymized Southwest data-center case study — a real outcome metric, but
              an isolated one rather than a repeatable, audited benchmark across the customer base (CU023).
            claimRefs:
              - CU019
              - CU020
              - CU021
              - CU022
              - CU023
          - type: table
            tableRef: TU004
            claimRefs:
              - CU019
              - CU020
              - CU021
              - CU022
              - CU023
      - number: '6.5'
        title: 'Expansion Loops: OEM Order Growth and Vertical Integration'
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid's expansion motion looks structurally different from a typical software land-and-expand loop:
              instead of upsell within an existing account, expansion shows up as repeat ordering with hardware OEMs and
              as vertical-integration M&A layered on top of a fixed set of named customer wins. ABB's order book with
              VoltaGrid grew from an initial 2025 synchronous-condenser partnership to a further 35-unit order announced
              at CERAWeek in March 2026, and INNIO itself has publicly described its VoltaGrid order as the largest in
              INNIO's corporate history before adding a further 1.5 GW order months later (CU024, CU027). In May 2026,
              VoltaGrid announced the acquisition of manufacturer Propell Energy Technologies, with CEO Nathan Ough
              framing the deal as extending "proven engineering and integration capabilities" to support continued
              scaling, an expansion move aimed at converting backlog into delivered megawatts faster rather than at
              winning new named accounts (CU025). Propell's Granbury, Texas facilities are being expanded toward roughly
              300 MW per month of production capacity, and the acquisition also adds manufacturing and engineering
              operations in Rosedale, British Columbia and Calgary, Alberta, extending VoltaGrid's industrial footprint
              into Canada for the first time in the sources reviewed (CU026, CU039). None of these expansion signals is
              usage-based or customer-initiated in the way a typical net-revenue-retention metric would capture; they
              are supply-side moves that increase VoltaGrid's capacity to fulfill the contracts it already holds.
            claimRefs:
              - CU024
              - CU025
              - CU026
              - CU027
              - CU039
      - number: '6.6'
        title: Concentration and Channel Dependence
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid's two largest publicly disclosed data-center commitments, Oracle (2.3 GW) and Vantage (1+ GW),
              together represent more contracted capacity than every other named customer combined, which means the
              loss, delay, or renegotiation of either relationship would materially change the company's growth
              narrative (CU028). That customer-side concentration sits on top of matching upstream concentration:
              VoltaGrid depends on just two hardware OEMs, INNIO for reciprocating engines and ABB for synchronous
              condensers, to fulfill essentially all of its data-center contracts, so a shortfall at either supplier
              would directly limit delivery to Oracle, Vantage, or any other customer (CU029). The Oracle Texas fleet
              also depends on a single named natural-gas pipeline partner, Energy Transfer, for firm fuel supply, and
              independent analysis at mgrid.org explicitly frames the resulting off-grid design as creating "a
              single-vendor reliability dependency where a VoltaGrid operational failure has no utility grid backup" for
              that site (CU030, CU043). Halliburton adds a further, more unusual concentration: it is simultaneously an
              operating partner on the Aethon e-frac contract and the Eastern Hemisphere 400 MW commitment, and, since
              May 2026, a strategic equity investor and board member, a dual role that mixes commercial counterparty and
              governance-oversight interests (CU031). No public procurement or competitive-tender record was located
              showing VoltaGrid winning business through a formal RFP process; every disclosed customer relationship in
              the sources reviewed originates from direct commercial negotiation or jointly announced partnerships, and
              because VoltaGrid remains a private company with no SEC filings, every scale figure in this chapter is
              sourced from company, partner, or trade-press disclosure rather than an audited filing (CU032, CU040).
            claimRefs:
