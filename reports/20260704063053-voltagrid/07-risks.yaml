- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold / Event
  - Action Implication
  rows:
  - - Georgia enforcement (Covington)
    - Georgia EPD ruling
    - Stop-work order, penalty assessment, or retroactive permit grant
    - Downgrade the thesis on a stop-work order or penalty; reassess favorably on a clean permit resolution
  - - Texas ABI-1 permitting
    - TCEQ permit decision
    - Title V major-source designation vs. an approved phased minor-source build
    - Reassess the Texas buildout timeline and associated capital-expenditure schedule
  - - Natural-gas commodity exposure
    - Henry Hub natural-gas spot/forward price
    - Sustained move materially above the ~$3.00-4.30/MMBtu range analysts model for 2025-2026 without a customer pass-through
    - Reassess margin assumptions on any contract lacking disclosed fuel-cost pass-through
  - - Debt refinancing and credit quality
    - Credit-rating action or covenant status on the $5.0B financing package
    - Downgrade, covenant breach, or a failed refinancing of the 2030-maturity second-lien notes
    - Reassess capital-structure risk and the probability of dilutive future equity raises
  - - Customer concentration
    - Oracle or Vantage contract status
    - Public cancellation, delay, or material downsizing of a gigawatt-scale contract
    - Trigger an immediate backlog-conversion and revenue-thesis reassessment
  - - AI data-center demand environment
    - Data-center occupancy / utilization data
    - Goldman Sachs Research's 'AI Downside' scenario (~80% occupancy) materializing
    - Reassess order-book conversion timelines across the entire BTM gas-generation sector
  - - Governance concentration
    - Board composition and Halliburton representation
    - A further increase in Halliburton-affiliated board seats, or CEO Nathan Ough's departure
    - Reassess governance independence and key-person risk
  notes: Thresholds combine VoltaGrid-specific disclosures with independent analyst benchmarks (Goldman Sachs, Moody's/AOGR, Forbes); none are VoltaGrid-published kill-criteria and all are the author's synthesis for monitoring purposes.
