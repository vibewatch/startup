- id: regulatory-legal-risk
  title: 'Regulatory and Legal Risk: Georgia Enforcement, Texas Permitting, and Federal Rulemaking'
  body: VoltaGrid's most material near-term risk is the Southern Environmental Law Center's June 25, 2026 formal enforcement request asking Georgia's EPD to halt and penalize unpermitted construction of a roughly 90 MW, 33-engine methane-gas plant at a Covington data-center site, where 8 of 33 engines and 36 of 37 diesel generators at an adjacent facility were already installed before permits were secured (CR001, CR002). The site sits within roughly three miles of homes, a drinking-water reservoir, and a nature preserve, with formaldehyde cited as a primary health concern (CR003), and the Atlanta Journal-Constitution independently corroborated the allegation on July 1, 2026 (CR004); as of the research date, Georgia's EPD had issued neither a stop-work order nor a final determination (CR005). A second, geographically distinct exposure is building in Texas, where VoltaGrid's July 2025 and December 2025 TCEQ filings for its ABI-1 'Frontier Campus' site could expand to 620 generators and roughly 2,582 MW, a scale independent trackers estimate would emit over 10 million tons of GHGs annually and likely require slower Title V major-source review (CR009, CR010, CR011). These VoltaGrid-specific matters sit against an industry backdrop in which the EPA closed the 'non-road engine' exemption and the NAACP/SELC sued xAI over unpermitted Memphis turbines -- a precedent involving different equipment than VoltaGrid's, per a documented Shift Action correction, but indicative of tightening enforcement appetite (CR006, CR007, CR008). Federal methane rulemaking (CR012, CR013) and FERC's December 2025 PJM co-location order (CR014, CR015) add further, though currently lower-probability, regulatory-reversal and expansion-constraint risk, while data-center siting and insurance-liability commentary flags compounding legal exposure at the site level (CR016, CR017).
