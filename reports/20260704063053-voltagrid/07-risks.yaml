callouts:
- calloutType: risk
  title: Georgia enforcement is the single clearest near-term thesis-break trigger
  body: An active, name-checked Southern Environmental Law Center enforcement request over unpermitted construction at VoltaGrid's Covington site remains unresolved as of the research date; a stop-work order or penalty would be a direct, observable downgrade signal, while a clean permit resolution would meaningfully de-risk the company's regulatory posture.
  claimRefs:
  - CR001
  - CR005
  - CR055
- calloutType: risk
  title: Halliburton's overlapping roles concentrate governance risk in one counterparty
  body: Halliburton is simultaneously a VoltaGrid equity investor, the employer of two sitting VoltaGrid board members, a 400 MW international power-delivery partner, and a multi-year E-frac customer -- a level of counterparty concentration that reduces effective board independence over related-party decisions.
  claimRefs:
  - CR030
  - CR031
  - CR032
- calloutType: recommendation
  title: Prioritize four diligence requests before the next refresh
  body: 'Diligence teams should prioritize: (1) VoltaGrid''s natural-gas hedging or fuel-cost pass-through terms, (2) the Georgia EPD''s enforcement outcome and TCEQ''s ABI-1 permit decision, (3) independent verification of QPac/StabilAI reliability and emissions claims, and (4) full board and related-party-transaction disclosure given Halliburton''s multi-role concentration.'
  claimRefs:
  - CR039
