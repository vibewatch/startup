chapter:
  number: 7
  title: Risks
  summary: VoltaGrid's single largest near-term thesis-break risk is an active, name-checked Georgia Clean Air Act enforcement request over unpermitted construction at its Covington data-center site, compounded by a second pending Texas TCEQ permit fight, a $5.0 billion secured debt load layered under a greater-than-$10 billion valuation, undisclosed natural-gas hedging, concentrated OEM and customer dependencies, and a Halliburton governance overlap that spans equity investor, board seats, and operating partner roles.
sections:
- id: risk-framework-overview
  title: Risk Framework and Ranked Overview of Exposures
  body: 'This chapter ranks VoltaGrid''s risk across five categories -- regulatory/legal, operational/manufacturing, partner/dependency, people/execution, and financial/commodity, plus a cross-cutting ESG/political dimension -- using likelihood, severity, mitigation maturity, and residual exposure as the common scoring lens, then closes with monitorable kill criteria. Regulatory/legal risk ranks highest today: an active Southern Environmental Law Center enforcement request over unpermitted construction at VoltaGrid''s Covington, Georgia site sits alongside a second, still-pending Texas Commission on Environmental Quality major-source permit fight for the roughly 2,582 MW ABI-1 expansion (CR001, CR009, CR010). Financial/commodity risk ranks close behind: a $5.0 billion secured debt package sits beneath a greater-than-$10 billion implied valuation with no disclosed natural-gas hedging program (CR037, CR039). Partner/dependency risk is elevated by sole-sourced OEM relationships with INNIO Jenbacher and ABB and by Halliburton''s simultaneous roles as equity investor, two-seat board member, and operating partner (CR027, CR028, CR031). Operational/manufacturing risk centers on an unproven post-Propell manufacturing ramp and unverified reliability and emissions claims (CR019, CR020, CR023). People/execution risk is comparatively lower likelihood but high severity given reliance on a single, publicly identifiable founder-CEO. The risk heatmap below (FR001) summarizes these rankings across likelihood, severity, mitigation maturity, and residual exposure; the detailed registers and sourcing for each category follow in the sections below.'
