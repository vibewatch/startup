- id: mitigation-monitoring-kill-criteria
  title: Mitigations, Monitoring Indicators, and Thesis-Break Triggers
  body: 'VoltaGrid''s own disclosed mitigation for manufacturing and supply-chain risk is the Propell acquisition itself, which management explicitly frames as reducing execution risk through vertical integration, even though the same move concentrates production at one site and leaves VoltaGrid still dependent on INNIO and ABB for the underlying engine and grid-stabilization components (CR053, CR054). For legal and regulatory risk, the clearest near-term monitorable trigger is Georgia''s EPD ruling: a stop-work order or penalty would set a costly enforcement precedent likely to be replicated elsewhere, while a retroactive permit or negotiated consent order would meaningfully de-risk the company''s posture (CR055); a parallel trigger sits in Texas, where a Title V major-source designation for the full ABI-1 expansion would lengthen the buildout timeline relative to a phased minor-source approach (CR056). On the financial side, a sustained Henry Hub move materially above the roughly $3.00-4.30/MMBtu range modeled for 2025-2026 would compress margins on any undisclosed-hedge contract (CR057), and a credit downgrade, covenant breach, or failed refinancing of the 2030-maturity notes would signal that backlog conversion is falling short of the assumptions underlying VoltaGrid''s capital structure (CR058). On the demand side, a public cancellation or material downsizing of the Oracle or Vantage contracts is the single most direct, monitorable thesis-break trigger given VoltaGrid''s customer concentration (CR059), while Goldman Sachs Research''s ''AI Downside'' occupancy scenario functions as an external, sector-wide leading indicator for the same risk (CR060). Finally, on governance, any further increase in Halliburton-affiliated board representation, or the departure of CEO Nathan Ough, are directly observable monitoring indicators diligence teams can track between refresh cycles (CR061). Taken together, these five categories -- the Georgia enforcement matter, Texas permitting exposure, undisclosed commodity hedging, concentrated OEM/customer dependencies, and Halliburton''s overlapping roles -- represent the chapter''s highest-severity, least-mitigated risks as of the 2026 research date (CR062).'
