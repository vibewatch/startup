  claims:
  - id: CR001
    statement: On June 25, 2026 the Southern Environmental Law Center, Sustainable Newton, and the Altamaha Riverkeeper filed a formal enforcement request asking Georgia's Environmental Protection Division to investigate and halt VoltaGrid's construction of a roughly 90 MW, 33-engine methane-gas plant in Covington, Newton County, alleging the work began without required Clean Air Act preconstruction air permits.
    type: third-party-reported
    topic: georgia-enforcement
    sourceRefs:
    - SR001
    - SR002
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR001
    - QR011
  - id: CR002
    statement: As of the SELC filing, 8 of the 33 planned methane-gas engines at VoltaGrid's Covington site and 36 of 37 diesel generators at the adjacent Serverfarm facility had already been physically installed without the required permits.
    type: third-party-reported
    topic: georgia-enforcement
    sourceRefs:
    - SR002
    confidence: medium
    freshness: current
  - id: CR003
    statement: VoltaGrid's Covington site sits within roughly three miles of residential neighborhoods, a Newton County drinking-water reservoir, and a nature preserve, and public opposition specifically cites formaldehyde, a known carcinogen from reciprocating-engine combustion, as a primary health concern.
    type: third-party-reported
    topic: georgia-enforcement
    sourceRefs:
    - SR001
    - SR004
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR003
  - id: CR004
    statement: The Atlanta Journal-Constitution's July 1, 2026 reporting independently corroborated the SELC's unpermitted-construction allegation and characterized the Covington project as Georgia's first off-grid 'pop-up' power plant built specifically to serve a data center.
    type: third-party-reported
    topic: georgia-enforcement
    sourceRefs:
    - SR003
    - SR001
    confidence: high
    freshness: current
  - id: CR005
    statement: As of the 2026 research date, Georgia's EPD had issued neither a stop-work order nor a final permit or penalty determination for the Covington site, leaving the enforcement outcome -- ranging from retroactive permit approval to a mandated shutdown -- unresolved.
    type: observed
    topic: georgia-enforcement
    sourceRefs:
    - SR001
    - SR003
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR002
    - QR032
    - QR034
