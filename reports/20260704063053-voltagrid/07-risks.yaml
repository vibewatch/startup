- id: people-execution-risk
  title: People and Execution Risk
  body: 'VoltaGrid''s public narrative concentrates founder-level credit in CEO Nathan Ough, who EY''s Entrepreneur of the Year materials credit with personally raising $100 million in 100 days to launch the company in 2020 and with driving a more than sixfold revenue increase since founding (CR034 context via SR042); S&P Global''s Energy Cents podcast gives him similar sole-founder visibility. VoltaGrid''s current executive-team page lists a Chief Financial Officer, Chief Legal Officer, Chief Technology Officer, Chief Administrative Officer, Chief Operating Officer, and an Executive Vice President, but does not list co-founder Jared Oehring in any operating role, consistent with earlier reporting that he no longer holds a current operating position (CR034). Governance concentration compounds key-person risk: two Halliburton executives occupy VoltaGrid board seats alongside Halliburton''s equity stake and commercial relationships, reducing the practical independence of board oversight even though an outside Chair, Doug Wonnacott, also sits on the board (CR031, CR032). VoltaGrid''s post-Propell integration will also need to absorb roughly 1,000 additional employees into existing operations, a scale of workforce integration that itself carries execution risk even though the company frames the deal as reducing, not increasing, overall risk (CR019). The board and executive-team pages VoltaGrid publishes are, in the absence of independent governance disclosure, the primary monitoring surface diligence teams have today; any further increase in Halliburton-affiliated board seats, or the departure of Ough himself, would be directly observable signals worth tracking going forward (CR061).'
  claimRefs:
