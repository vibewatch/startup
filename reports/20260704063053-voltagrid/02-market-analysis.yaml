  title: Regulatory exposure is asymmetric by grid territory
  body: FERC's PJM-specific behind-the-meter overhaul and its proposed 50 MW netting threshold do not directly apply to VoltaGrid's ERCOT-territory Texas deployments today, but the xAI Memphis unpermitted-turbine enforcement case shows permitting risk is real and precedent-setting regardless of grid territory.
  claimRefs:
  - CM029
  - CM030
  - CM031
  - CM032
- calloutType: strength
  title: Deployment speed is the structural tailwind
  body: With US interconnection queues holding 2,060+ GW and PJM waits stretching to eight years, modular gas and fuel-cell BTM power's 90-day-to-12-month deployment window is repeatedly cited as the deciding purchase criterion over grid-tied alternatives.
  claimRefs:
  - CM036
  - CM037
  - CM009
- calloutType: assumption
  title: VoltaGrid pricing and true BTM-gas market share remain undisclosed
  body: This chapter assumes VoltaGrid's ~7.2 GW pipeline and roughly 8% share of Cleanview's tracked ~90 GW BTM base are directionally representative, but neither VoltaGrid's per-MW pricing nor an audited backlog schedule is publicly available to confirm the assumption.
  claimRefs:
  - CM024
  - CM023
