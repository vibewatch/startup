- id: TM003
  title: Segment, buyer, user, payer, and adoption path
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow / Deployment Path
  - Budget Owner
  - Adoption Trigger
  rows:
  - - Hyperscale cloud/AI operators
    - Oracle Cloud Infrastructure, Microsoft, Google, Meta, Amazon
    - Internal AI/cloud compute workloads
    - Hyperscaler itself (direct capex or long-term PPA)
    - Site selection -> interconnection-queue assessment -> BTM RFP -> engineering/procurement -> commissioning
    - Hyperscaler infrastructure/energy procurement team
    - Grid interconnection delay of 3+ years threatens a committed AI campus go-live date
  - - Colocation / multi-tenant developers
    - Vantage Data Centers and peers
    - Multiple enterprise/hyperscaler tenants
    - Colocation developer, recovered via tenant lease/power pass-through
    - Portfolio-level power strategy -> BTM vendor selection -> phased rollout across sites
    - Colocation developer's capital-projects group
    - Need to de-risk pre-leased delivery dates across a multi-site portfolio
  - - AI-native infrastructure owner-operators
    - xAI, Crusoe, OpenAI/Stargate-linked developers
    - Owner's own GPU training/inference clusters
    - Owner-operator, often backed by strategic or venture capital
    - Rapid site build -> mobile/modular generator delivery -> phased capacity additions
    - Owner-operator's own energy/infrastructure team
    - Extreme speed-to-power requirement in a compute-constrained AI training race
  - - Utilities and independent power producers
    - NRG Energy, LS Power, and similar grid-adjacent IPPs
    - Same hyperscaler/AI large-load customers as BTM entrants
    - Utility ratepayer base plus large-load customer via PPA
    - Asset acquisition -> grid-adjacent siting -> long-term PPA negotiation
    - Utility/IPP corporate development and generation-investment teams
    - Desire to retain large-load customers who might otherwise defect to pure BTM providers
  - - Industrial / oilfield electrification (legacy)
    - E&P operators, remote/mining sites
    - Field operations equipment (e-frac, drilling)
    - Oilfield operator's operating budget
    - Mobile microgrid rental -> deployment at wellsite -> redeployment as the field moves
    - Field operations / completions budget
    - Diesel-to-gas fuel-cost and emissions-reduction economics, not AI-driven demand
  notes: Buyer/user/payer roles are drawn from public deal announcements and legal/advisory commentary rather than a single unified survey; the industrial/oilfield row reflects a legacy segment shown for contrast with the newer hyperscale AI focus and is not itself sized in this chapter.
