- id: growth-drivers
  title: 'Growth drivers: grid mismatch, deployment speed, and hyperscaler capex'
  body: 'The structural driver behind BTM gas adoption is a widening mismatch between data-centre construction timelines and grid delivery timelines. Lawrence Berkeley National Laboratory finds more than 2,060 GW of generation and storage capacity sitting in US interconnection queues at the end of 2025 -- roughly double total installed US capacity -- and that most queued projects are ultimately withdrawn while those that proceed take longer on average to reach commercial operation. Advisory-firm commentary puts PJM''s queue wait times at up to eight years and datacenterHawk cites 3-to-7-year interconnection timelines across US markets generally, against 18-to-24-month typical data-centre construction schedules. Against that backdrop, modular gas reciprocating engines and solid-oxide fuel cells can both be deployed in roughly 90 days to about 12 months, a speed advantage over 3-to-15-year timelines for new transmission, gas peaker plants, or nuclear small modular reactors that multiple sources
    cite as the primary purchase criterion for BTM buyers. Demand-side capital reinforces the driver: capital expenditure by the five largest technology companies exceeded $400 billion in 2025 and is projected to rise a further 75% in 2026, and North American data-centre capacity absorption reached nearly 15,600 MW in 2025 alone -- more than 130 times the volume absorbed a decade earlier. Cleanview''s tracker shows Meta, Microsoft, Amazon, and Oracle all pursuing behind-the-meter projects directly or through partners, indicating the driver is broad-based across hyperscalers rather than concentrated in a single buyer.'
  claimRefs:
  - CM036
  - CM037
  - CM008
  - CM009
  - CM014
  - CM002
  - CM038
- id: adoption-constraints-and-regulation
  title: 'Adoption constraints: regulation, permitting, and grid rules'
  body: 'Regulatory and permitting risk is the clearest counterweight to the growth drivers above, and it is uneven across VoltaGrid''s footprint (Table TM004). On December 18, 2025, FERC ruled that PJM''s existing co-location and behind-the-meter tariff rules were ''unjust and unreasonable'' and ordered an overhaul; PJM responded in February 2026 with a proposal to cap BTM load-netting benefits at a 50 MW threshold, phased in over three years, meaning new arrangements above that size would lose the netting benefit that currently offsets transmission costs. That overhaul applies narrowly to the 13-state PJM territory and does not directly govern VoltaGrid''s current ERCOT-territory Texas deployments, though it plausibly previews rules other grid operators could adopt. Texas Senate Bill 6 separately imposes new flexibility and demand-response participation requirements on large loads over 75 MW connecting to ERCOT, a distinct state-level constraint inside VoltaGrid''s core market. Permitting
    risk is concrete, not theoretical: xAI operated at least 35 methane gas turbines without required federal air permits at its Memphis Colossus site, with potential NOx emissions exceeding 2,000 tons per year, prompting a Clean Air Act enforcement notice from the Southern Environmental Law Center on behalf of the NAACP -- a precedent relevant to any gas BTM operator sharing similar site-development speed. Working the other direction, the US EPA proposed in mid-2026 to loosen construction-permitting rules so non-polluting construction could begin before air-emissions permits are issued, which could shorten timelines if finalized, even as advocacy groups continue to argue that methane-heavy BTM buildouts undermine hyperscalers'' climate commitments and risk stranding assets if demand forecasts prove overstated.'
  claimRefs:
  - CM028
