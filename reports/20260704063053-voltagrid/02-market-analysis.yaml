- id: TM004
  title: Growth drivers and adoption constraints
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication
  - Diligence Ask
  rows:
  - - AI/hyperscaler capex surge (>$400B in 2025, +75% forecast in 2026)
    - Driver
    - Now - 2026+
    - Expands the pool of committed AI campuses needing fast power
    - Verify how much of VoltaGrid's backlog ties to committed vs. speculative hyperscaler capex plans
  - - Grid interconnection backlog (2,060+ GW queued; 3-8+ year waits)
    - Driver
    - Now - 2030
    - Structurally favors BTM/self-generation over waiting for grid connection
    - Track queue-clearance rates specifically in VoltaGrid's core ERCOT market
  - - Deployment-speed advantage of modular gas/fuel cells (90 days-12 months) vs. grid/nuclear (3-15+ years)
    - Driver
    - Now - 2028
    - Reinforces BTM as the default choice for time-constrained AI buildouts
    - Confirm VoltaGrid's actual site-to-power timeline track record beyond the single xAI Memphis case
  - - FERC/PJM behind-the-meter rule overhaul (50 MW netting threshold)
    - Constraint
    - 2026-2029 (3-year transition)
    - Could make new BTM arrangements over 50 MW less economical in PJM territory
    - Confirm whether VoltaGrid has, or plans, any PJM-territory projects exposed to this rule
  - - Texas Senate Bill 6 large-load flexibility requirements (>75 MW)
    - Constraint
    - Current
    - Adds compliance/flexibility obligations in VoltaGrid's core ERCOT market
    - Assess how SB6 compliance costs affect VoltaGrid's Texas project economics
  - - Air-permitting / Clean Air Act enforcement risk (xAI Memphis precedent)
    - Constraint
    - Current - ongoing
    - Raises legal/regulatory risk and potential construction delay for unpermitted gas BTM sites
    - Confirm the permitting status of every active VoltaGrid site, not only the disclosed Georgia matter
  - - Equipment/manufacturing lead times (record turbine and fuel-cell order backlogs)
    - Constraint
    - Now - 2027
    - Could delay delivery even where siting and permits are secured
    - Confirm VoltaGrid/Propell combined manufacturing capacity against the 7.2 GW pipeline
  - - EPA proposed permitting deregulation (2026)
    - Driver
    - 2026+ (pending 45-day comment period)
    - Could shorten construction timelines for gas BTM projects if finalized
    - Track the finalization timeline and litigation risk of the EPA proposal
  - - ESG/greenwashing and ratepayer-cost scrutiny (Ratepayer Protection Pledge, methane critiques)
    - Constraint
    - Current - ongoing
    - Could raise reputational and political cost of gas-heavy BTM strategies
    - Assess whether customers' ESG commitments create contract-cancellation risk
  - - Natural-gas supply/pipeline buildout (250+ GW of new US gas capacity proposed)
    - Driver
    - Now - 2030
    - Supports fuel availability for gas BTM growth broadly, though single-pipeline dependency remains a site-level risk
    - Verify VoltaGrid's gas-supply contracts beyond the disclosed Energy Transfer/Oracle arrangement
  notes: Direction reflects each factor's net effect on demand for VoltaGrid-style gas BTM power specifically, not on the data-centre market broadly; several constraints (SB6, permitting risk) coexist with drivers pointing the same overall direction toward more BTM building, so the direction and timing columns should be read together.
