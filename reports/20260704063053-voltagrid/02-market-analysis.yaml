company:
  name: VoltaGrid
chapter:
  number: 2
  title: Market Analysis
  summary: VoltaGrid competes in a narrowly defined but fast-growing market -- behind-the-meter modular natural-gas prime power for hyperscale AI data centres -- for which no single publisher discloses a dollar TAM; the closest analyst proxy (the global data-centre generator market) spans $12.98B-$19.66B for 2030 across four firms, while VoltaGrid's own disclosed ~7.2 GW pipeline represents roughly 8% of Cleanview's tracked ~90 GW US behind-the-meter base. Grid interconnection delays of 3-8+ years and 90-day-to-12-month BTM deployment speed are the dominant growth drivers, while FERC/PJM's new 50 MW BTM-netting threshold, Texas Senate Bill 6, and the xAI Memphis unpermitted-turbine enforcement case are the clearest adoption constraints, with per-MW pricing and a gas-only market-share breakdown remaining unresolved diligence gaps.
sections:
- id: market-boundary-and-definition
  title: 'Market boundary: what VoltaGrid''s addressable market is and is not'
  body: 'VoltaGrid''s addressable market is best defined narrowly, not broadly: behind-the-meter (BTM) modular natural-gas prime power sold or contracted directly to hyperscale and AI-native data-centre operators, rather than the entire universe of data-centre power spending. That boundary matters because global data-centre electricity demand is itself surging -- up 17% in 2025 against roughly 3% overall grid growth, with the five largest technology companies'' capital expenditure exceeding $400 billion in 2025 and set to rise a further 75% in 2026 -- but only a fraction of that broader demand converts into BTM gas contracts of the kind VoltaGrid sells. Excluded from VoltaGrid''s core segment are grid-purchased utility power, renewable-only power-purchase agreements, nuclear small modular reactors, and diesel-only backup generation, each of which is a real substitute a data-centre operator''s budget could fund instead. The closest adjacent substitute is fuel-cell primary power (led by Bloom
    Energy), which competes for the same hyperscaler capital within the same behind-the-meter budget line rather than sitting in a wholly separate category. VoltaGrid''s own legacy oilfield-electrification and industrial-microgrid business is a smaller, earlier segment that remains distinct from its newer gigawatt-scale AI data-centre pivot. Table TM001 lays out this boundary segment by segment, including included and excluded spend, so later sizing and buyer analysis in this chapter are anchored to a defined market rather than treated as coextensive with the entire AI power buildout.'
  claimRefs:
  - CM047
  - CM048
  - CM049
  - CM001
  - CM002
  tableRefs:
  - TM001
- id: sizing-tam-sam-som-multiple-lenses
  title: 'Sizing the market: multiple constrained lenses instead of one TAM'
  body: 'No retained source publishes a single TAM, SAM, or SOM figure specifically for behind-the-meter modular natural-gas prime power sold to data centres, so this chapter uses several constrained, partially overlapping proxies instead of one headline number. The closest dollar-denominated proxy is the global data-centre generator market, which four analyst firms size very differently for 2030: Grand View Research''s base case reaches $12.98 billion, Mordor Intelligence puts the 2026 market at $7.88 billion, Precedence Research projects $17.33 billion by 2034, and Arizton''s AI-weighted bull case reaches $19.66 billion by 2030 -- a spread of more than 50% among the 2030-specific figures alone, and this chapter preserves that contradiction (Table TM002, Figure FM002) rather than picking a winner. A second, GW-denominated proxy comes from the adjacent fuel-cell BTM lane, where providers signed $7.65 billion in binding AI data-centre deals between October 2025 and January 2026 and Goldman
    Sachs projects 8-20 GW of fuel-cell capacity by 2030. A third proxy is Cleanview''s bottom-up tracker of 59 US data centres with roughly 90 GW of announced BTM capacity, 92% of it announced since 2025. Finally, VoltaGrid''s own disclosed ~7.2 GW generation pipeline for 2027-2029 -- about 8% of Cleanview''s tracked base -- offers a company-specific anchor, though it is a conference disclosure rather than an audited backlog and carries no public per-MW pricing, so it cannot be converted into a dollar figure without an unverified assumption. Figure FM001 stacks these proxies as constrained layers rather than a strict TAM-to-SOM waterfall, explicitly flagging the unit mismatch between dollars and gigawatts.'
