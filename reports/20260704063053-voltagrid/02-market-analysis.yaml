- id: diligence-gaps-and-contradictions
  title: Diligence gaps, contradictory estimates, and what remains unresolved
  body: Three items remain genuinely unresolved rather than merely under-detailed, and this chapter preserves them as open gaps instead of forcing a single answer. First, no retained source discloses VoltaGrid's actual per-MWh or per-MW-month contract pricing, so the widely circulated $70-100/MWh industry range cannot be verified against VoltaGrid's specific deals with Oracle, Vantage, xAI, or the Halliburton Eastern Hemisphere commitment; this blocks any bottom-up revenue estimate from the disclosed 7.2 GW pipeline. Second, every analyst sizing lens in Table TM002 blends backup and prime power and mixes diesel with gas, so no publisher isolates the specific share of the $8-20 billion generator-market estimates attributable to modular BTM natural-gas prime power; using the blended totals as VoltaGrid's addressable market would overstate the true opportunity, and the 50%-plus spread between Grand View Research's and Arizton's 2030 figures (Figure FM002) is preserved here as a genuine contradiction
    rather than averaged away. Third, whether ERCOT, MISO, or SPP will eventually mirror FERC's PJM-specific co-location and BTM-netting overhaul is unresolved; if they do, VoltaGrid's core Texas market could eventually face the same constraint currently limited to PJM territory. Each of these three gaps is logged with a concrete diligence path in localEvidence.evidenceGaps rather than closed with an invented figure, consistent with this chapter's evidence-constrained approach to sizing and adoption.
  claimRefs:
  - CM020
  - CM024
  - CM030
tables:
- id: TM001
  title: 'Market definition: segments, spend boundaries, and buyers'
  columns:
  - Segment / Category
  - Included Spend
  - Excluded Spend
  - Buyer / Payer
  - Relevance to VoltaGrid
  rows:
  - - Behind-the-meter (BTM) modular natural-gas prime power for hyperscale/AI data centres
    - Onsite gas-fired generation dedicated to a single data-centre campus, owned or contracted as a service, plus associated switchgear/controls
    - Grid-purchased utility power, renewable-only PPAs, nuclear SMRs, and diesel backup-only gensets
    - Hyperscaler / AI infrastructure operator (Oracle, Vantage, xAI, etc.)
    - VoltaGrid's core addressable segment
  - - Grid-tied utility & IPP large-load power supply
    - Long-term PPAs and interconnection-based service from utilities/IPPs (NRG, LS Power, Constellation, Talen)
    - Onsite/behind-the-meter generation not connected to the transmission grid
    - Utility ratepayer base plus data-centre operator (via PPA)
    - Status-quo substitute and competing delivery model, not VoltaGrid's segment
  - - Backup/standby diesel and gas generator market (traditional data-centre backup)
    - Emergency backup gensets sized for outage ride-through, not continuous prime power
    - Continuous/prime power generation and fuel-cell primary power
    - Data-centre facilities/engineering budget
    - Adjacent, overlapping analyst category, but a different buying decision than prime BTM power
  - - Fuel-cell primary power for data centres (e.g., Bloom Energy)
    - Onsite solid-oxide or other fuel-cell primary power installations
    - Combustion-turbine or reciprocating-engine BTM gas power
    - Hyperscaler / AI infrastructure operator
    - Adjacent substitute/competing BTM technology, same buyer budget
  - - Oilfield and industrial electrification microgrids (legacy)
    - Mobile/modular gas power for electric hydraulic fracturing, remote mining, and distributed generation
    - Data-centre-specific BTM contracts
    - Oilfield operators and industrial sites
    - VoltaGrid's original, smaller legacy segment, separate from the AI data-centre pivot
  - - Renewable-plus-storage power for data centres
    - Solar/wind/battery hybrid onsite generation
    - Fossil-fuel prime power
    - Hyperscaler ESG/sustainability budget
    - Status-quo/ESG-preferred substitute, but rarely dispatchable enough alone for gigawatt AI loads today
  notes: VoltaGrid's core addressable segment is row 1; rows 2-6 are the substitutes, adjacencies, and status-quo alternatives a data-centre operator's power-sourcing budget could choose instead, drawn from the market/regulatory sources cited across this chapter rather than a single unified market taxonomy.
