  topStrengths:
    - Oracle 和 Vantage 的具名多吉瓦订单积压证明客户需求真实，不只是概念阶段兴趣。
    - 公司主打快速供电，切中 AI 数据中心眼下的瓶颈：电网接入周期太慢。
    - Blackstone、Halliburton、CPP Investments、INNIO 和 ABB 一起给出少见的强赞助方与生态背书。
    - 如果爬坡跑通，把 Propell 纳入内部可加强制造控制和供应保障。
  topRisks:
    - Georgia 现有许可争议和 Texas 待决许可争议可能拖慢项目、迫使改造，或削弱快速部署许可模式。
    - 超过 $10 billion 的估值押在未经审计的收入和 EBITDA 目标上，缺少公开财报来锚定下行。
    - Oracle 和 Vantage 周围的客户集中度较高，订单积压转化容易受延迟、重新定价或取消影响。
    - 约 $5.5 billion 债务且未披露天然气套保政策，使公司对成本通胀和执行失误更敏感。
    - Propell 整合以及对少数 OEM 和董事会关联交易方的依赖，抬高运营和治理风险。
  unresolvedGaps:
    - 经审计的 2025/2026 年收入、EBITDA、现金和毛利率数据。
    - Propell 收购价、整合里程碑和已实现制造产能。
    - 长期合同中的天然气套保条款或客户成本转嫁机制。
    - 客户层面的收入集中度、合同期限和续约 / 取消权。
    - Georgia 和 Texas 的最终监管结果，以及其他站点是否存在类似许可问题。
