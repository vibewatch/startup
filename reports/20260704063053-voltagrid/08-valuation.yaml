- id: TV005
  title: Thesis-break and kill triggers
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Georgia EPD enforcement outcome
    - Stop-work order, material fine, or forced retrofit at the Covington site
    - Signals regulatory risk could recur at other sites, delaying backlog conversion
    - Pause new capital commitments pending resolution
  - - Texas TCEQ ABI-1 permit outcome
    - Major-source Title V review required, or permit denied/delayed
    - Could slow or block the largest single disclosed expansion site
    - Track the permit docket; discount near-term GW conversion if delayed
  - - Oracle or Vantage contract renegotiation/cancellation
    - Either anchor customer reduces contracted GW or exits
    - Removes the majority of disclosed order-book revenue visibility
    - Immediate re-underwrite of the valuation and thesis
  - - Natural-gas price spike without disclosed hedging
    - Sustained Henry Hub move that compresses fixed-price contract margins
    - Tests whether VoltaGrid or its customers bear commodity risk
    - Request hedging/pass-through contract terms before adding capital
  - - 2025/2026 audited financial disclosure
    - Lender or rating-agency EBITDA reconciliation becomes available
    - Converts the entire valuation debate from estimated to verified
    - Re-run the comparable analysis against audited figures
  - - IPO or sale process outcome
    - Public filing or transaction announcement values VoltaGrid materially above or below >$10B
    - Crystallizes whether the private mark was fair, rich, or cheap
    - Reassess entry discipline for any follow-on or secondary purchase
  notes: Triggers are monitorable public events, not internally modeled probabilities; several overlap with the risk chapter's regulatory register and are restated here through a valuation-transmission lens.
  claimRefs:
