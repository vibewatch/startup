- id: TV003
  title: Bull / base / bear scenarios
  columns:
  - Scenario
  - Key assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - 7.5 GW order book converts on schedule; Propell ramp hits ~300 MW/month; 2028 EBITDA reaches or exceeds $1.1B; multiple re-rates toward the equipment-comp premium (18-20x forward EV/EBITDA)
    - Implied enterprise value ~$18-22B by 2028, roughly double the May 2026 >$10B entry mark
    - Requires flawless multi-year execution with no permitting, customer, or gas-price shocks
    - Low-moderate -- consistent with the disclosed plan but not yet demonstrated
  - - Base
    - Backlog converts with modest delays/cost slippage; 2028 EBITDA lands $700M-$1.0B; multiple holds near the ~13-14x forward EV/EBITDA already implied in the May 2026 raise
    - Enterprise value roughly flat to modestly up from the >$10B entry mark
    - Execution slippage, gas-price volatility, and Propell integration costs absorb some of the growth premium
    - Moderate -- the 'priced for flawless execution' framing implies the base case sits close to today's mark
  - - Bear
    - Georgia/Texas enforcement actions escalate; gas prices spike; Oracle/Vantage concentration triggers a slowdown or repricing; 2028 EBITDA falls to $500-700M
    - Multiple compresses toward Vistra/NRG-like 9-11x forward EV/EBITDA on a smaller EBITDA base, implying enterprise value near $5-8B
    - Debt service on ~$5.5B of secured leverage becomes a binding constraint if EBITDA disappoints
    - Moderate -- several independently identified live triggers (EPD, TCEQ, gas prices, concentration) could each compress the multiple
  notes: Scenario dollar ranges are author estimates built from the comparable-multiple band and the company-guided 2028 EBITDA target; they are illustrative, not a formal DCF or model output.
