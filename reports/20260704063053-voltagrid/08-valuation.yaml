- id: TV002
  title: Thesis / anti-thesis
  columns:
  - Argument
  - Supporting evidence
  - What would change the view
  rows:
  - - 'Thesis: contracted, multi-year GW-scale backlog from credible hyperscale customers'
    - Oracle 2.3 GW+ and Vantage 1 GW+ deals; Oracle reportedly pays >$1B/yr for a single Texas site
    - Confirmed cancellation or material repricing of the Oracle or Vantage contracts
  - - 'Thesis: tier-1 financial and strategic sponsor validation'
    - Blackstone Tactical Opportunities, Halliburton, and CPP Investments have all committed capital
    - Any sponsor writing down or fully exiting its stake
  - - 'Thesis: vertical integration (Propell) should reduce supply-chain execution risk'
    - Manufacturing brought in-house; Granbury, TX expansion targeted at ~300 MW/month
    - Propell integration missing the 300 MW/month target or its purchase price revealing overpayment
  - - 'Anti-thesis: no audited revenue, EBITDA, or cash-flow disclosure exists'
    - The $1.1B 2028 EBITDA target is company- and Fitch-sourced, not audited
    - Audited or lender-verified 2025/2026 financials confirming the trajectory
  - - 'Anti-thesis: active Clean Air Act enforcement risk at the Covington, GA site'
    - SELC formal enforcement request, independently corroborated by the Atlanta Journal-Constitution
    - Georgia EPD grants retroactive permits with immaterial penalties
  - - 'Anti-thesis: customer concentration in two named hyperscale accounts'
    - Oracle and Vantage together represent the large majority of disclosed GW commitments
    - Disclosed diversification across four or more named anchor customers
  - - 'Anti-thesis: sector-wide AI-power demand skepticism'
    - Goldman Sachs models occupancy falling toward ~80% by decade-end in its AI-downside scenario
    - Sustained hyperscaler capex growth and utilization data through 2027-2028
  notes: Rows pair each thesis or anti-thesis argument with the specific evidence and the concrete event that would move the view; not a probability-weighted scorecard.
