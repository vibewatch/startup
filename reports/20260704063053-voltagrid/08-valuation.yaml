- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric basis
  - Multiple / valuation / status
  - Relevance to VoltaGrid
  - Limitation
  rows:
  - - VoltaGrid (subject)
    - '>$10B equity value vs. ~$1.1B 2028E EBITDA (company-guided)'
    - ~9x equity/EBITDA; ~13-14x forward EV/EBITDA assuming ~$5.5B net debt
    - Subject company - anchor row for comparison
    - 2028 EBITDA is unaudited and company-guided
  - - Crusoe Energy (private)
    - Oct 2025 Series E round size vs. reported valuation
    - '>$10B valuation on a $1.375B raise'
    - Closest AI-power-infrastructure private peer
    - No disclosed revenue/EBITDA multiple; more capital-intensive vertically-integrated model, not directly comparable on unit economics
  - - Enchanted Rock / ERock (private, IPO-track)
    - 2025 revenue of $183.1M vs. targeted IPO valuation
    - Targeting a $5B IPO valuation, ~27x EV/Revenue
    - Direct behind-the-meter microgrid-as-a-service peer
    - Much smaller revenue base; multiple reflects an early-stage growth premium
  - - Bloom Energy (BE, public)
    - FY2025 EV/Sales and EV/EBITDA (current)
    - EV ~$77.51B; 31.65x EV/Sales; EV/EBITDA of 334.71x is not meaningful on a thin GAAP earnings base
    - Closest public 'clean' distributed-power comp riding the same AI-power theme
    - Fuel-cell technology and margin profile differ materially from VoltaGrid gas-reciprocating model
  - - Generac Holdings (GNRC, public)
    - FY2025 EV/EBITDA and EV/Sales (current)
    - EV ~$16.00B; 30.33x EV/EBITDA; 3.70x EV/Sales
    - Closest public generator-equipment comp with disclosed data-center growth
    - Consolidated company multiple; segment-level data-center economics are not disclosed
  - - Cummins Inc. (CMI, public)
    - FY2025 EV/EBITDA and EV/Sales (current, trailing and forward)
    - EV ~$96.37B; 19.26x EV/EBITDA trailing (15.9x forward per a second provider); 2.84x EV/Sales
    - Closest public reciprocating-engine / power-systems technology comp
    - Multiple diversified end markets outside data-center power dilute the read-through
  - - Caterpillar Inc. (CAT, public)
    - FY2025 EV/EBITDA and EV/Sales (current)
    - EV ~$483.54B; 33.22x EV/EBITDA; 6.83x EV/Sales
    - Direct competitor in large generator sets with a disclosed data-center demand tailwind
    - Overwhelmingly non-data-center industrial revenue; scale dwarfs VoltaGrid
  - - Vistra Corp (VST, public)
    - FY2025 EV/EBITDA (current)
    - EV ~$70.20B; 10.34x EV/EBITDA
    - Merchant IPP comp with disclosed hyperscale nuclear PPAs
    - Regulated/merchant generation economics differ from VoltaGrid's contracted BTM model
  - - NRG Energy (NRG, public)
    - Current EV/EBITDA and EV/Sales
    - 23.04x EV/EBITDA; 1.61x EV/Sales
    - Merchant IPP comp actively acquiring gas generation for data-center demand
    - Diversified retail/generation mix; not a pure data-center-power play
  notes: Public-company figures are current as of the July 2026 research date (stockanalysis.com live data cross-checked against each FY2025 Form 10-K); private valuations are the latest publicly reported round or IPO-filing target, not audited marks.
  enumerationScope:
    coverage: sample
    basis: Representative set of the largest publicly disclosed private AI-power-infrastructure rounds and the most frequently cited public power-generation/IPP comparables as of the July 2026 research date; not an exhaustive list of every possible comparable.
