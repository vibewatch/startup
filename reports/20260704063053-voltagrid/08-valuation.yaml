company:
  name: VoltaGrid
chapter:
  number: 8
  title: Valuation
  summary: VoltaGrid's May 2026 Series D from Blackstone and Halliburton implied a post-money valuation exceeding $10 billion against a company-guided, unaudited 2028 EBITDA target of roughly $1.1 billion -- an implied multiple that is not extreme against current public power-generation comparables (10x-33x EV/EBITDA), but rests entirely on backlog conversion, a Propell manufacturing ramp not yet built at the time of the raise, and zero audited financial disclosure. Given real contracted-backlog and tier-1 sponsor support set against live Clean Air Act enforcement risk, ~$5.5 billion of secured leverage, and customer concentration, this chapter recommends track/research-more rather than buy at the current mark.
sections:
- id: investment-thesis-and-anti-thesis
  title: Investment Thesis and Anti-Thesis
  body: 'VoltaGrid''s bull case rests on three pillars: a genuine, named-customer contracted backlog (Oracle''s 2.3 GW deal reportedly pays VoltaGrid more than $1 billion a year for a single Texas site alone, per Bloomberg reporting), tier-1 financial and strategic sponsor validation (Blackstone Tactical Opportunities, Halliburton, and CPP Investments have all committed capital), and a vertical-integration move -- the Propell Energy acquisition -- explicitly designed to de-risk the manufacturing supply chain behind a roughly 7.5 GW total order book. The anti-thesis is equally concrete: VoltaGrid discloses no audited revenue, EBITDA, cash position, or the Propell purchase price, so the entire $1.1 billion 2028 EBITDA target that anchors the greater-than-$10 billion valuation is a company- and Fitch Ratings-sourced projection rather than a verified figure. Layered on top are an active Georgia Clean Air Act enforcement request, a heavily concentrated customer base (Oracle and Vantage together represent the large majority of disclosed gigawatt commitments), and no disclosed natural-gas hedging policy against fixed-price, multi-year power contracts. Each anti-thesis point has a specific, monitorable event that would restore the thesis -- audited financials, a favorable EPD ruling, disclosed customer diversification -- which is the organizing logic for the thesis/anti-thesis table below.'
