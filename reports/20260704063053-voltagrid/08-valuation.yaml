callouts:
- calloutType: strength
  title: Real backlog, real sponsors
  body: Oracle reportedly pays VoltaGrid more than $1 billion a year for a single Texas site, and the May 2026 round brought in Blackstone Tactical Opportunities and Halliburton alongside existing investor CPP Investments -- concrete, corroborated commercial and financial-sponsor validation that is unusual for a six-year-old company.
  claimRefs:
  - CV007
  - CV001
  - CV002
- calloutType: risk
  title: Valuation math without audited inputs
  body: The entire >$10 billion valuation reduces to a single company- and Fitch-sourced 2028 EBITDA projection of about $1.1 billion; no audited revenue, EBITDA, or cash figures exist anywhere in the sources reviewed for this chapter.
  claimRefs:
  - CV008
  - CV011
  - CV009
- calloutType: recommendation
  title: Track, do not chase
  body: Given real strengths offset by an unaudited valuation anchor, live Georgia enforcement risk, and customer concentration, this chapter recommends holding/monitoring for existing exposure and withholding new capital until audited financials, the Propell purchase price, and the EPD outcome are known.
  claimRefs:
  - CV049
  - CV037
  - CV043
