- id: TV006
  title: Final diligence asks
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited 2025 revenue and EBITDA
    - No public P&L; all figures are company- or Fitch-sourced estimates
    - Cannot verify the growth trajectory underpinning the >$10B valuation
    - Request via NDA, or via lender/rating-agency credit materials from the Nov 2025 financing
  - - Propell Energy acquisition purchase price
    - Not publicly disclosed
    - Unclear how much of the $775M primary raise funds M&A versus organic growth
    - Request the purchase agreement or merger-consideration disclosure
  - - Series D cap table and liquidation-preference terms
    - Not publicly disclosed
    - Determines downside protection and dilution for common/earlier holders
    - Request the cap table and preferred-stock term sheet
  - - Natural-gas hedging / fuel pass-through policy
    - No disclosed hedging program found in any source reviewed
    - Determines who bears commodity-price risk on fixed-price contracts
    - Request customer contracts' fuel-adjustment clauses
  - - Georgia EPD and Texas TCEQ enforcement resolution
    - Both proceedings open as of the research date
    - Could trigger fines, retrofits, or delays affecting backlog conversion
    - Monitor the EPD/TCEQ dockets; request VoltaGrid's compliance remediation plan
  - - Independent corroboration of the Oracle >$1B/yr single-site payment
    - Single-sourced to Bloomberg reporting
    - A large, uncorroborated revenue anchor materially affects any per-GW revenue model
    - Seek a second independent source or direct contract confirmation
  - - Customer-level revenue concentration
    - Only GW figures disclosed, not revenue share
    - GW share is a proxy, not a confirmed revenue-concentration metric
    - Request a revenue-by-customer breakdown under NDA
  notes: Ranked roughly by expected impact on this chapter's confidence rating if closed; several items overlap with open questions flagged in the financials and risks chapters.
