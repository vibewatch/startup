- id: financing-and-valuation-context
  title: Current Financing and Valuation Context
  body: 'VoltaGrid''s valuation history is a rapid escalation: a $73 million 2020 seed round, roughly $100-210 million of follow-on equity through 2023, a $550 million term loan in March 2024, a $5.0 billion comprehensive debt package in November 2025 ($2.0 billion of senior secured second-lien notes plus a $3.0 billion asset-based facility), and a $1.0 billion Series D in May 2026 from Blackstone Tactical Opportunities and Halliburton, split $775 million of primary capital and $225 million of secondary purchases from existing shareholders. That secondary component means some early investors partially cashed out at the new mark rather than the raise being purely primary growth capital -- a data point for dilution and entry-discipline analysis. Aggregated funding trackers place cumulative capitalization near $7.1 billion (about $1.5 billion equity, $5.5 billion debt). Bloomberg reporting in February 2026 indicated VoltaGrid was separately exploring an IPO and had held sale discussions with private equity firms including Blackstone and BlackRock, with any transaction seen valuing the company above $10 billion -- meaning the May 2026 strategic round and the exit-process valuation chatter are mutually reinforcing but not independently verified against audited numbers. No source reviewed discloses current-year revenue, EBITDA, cash-on-hand, or the Propell purchase price, so public evidence alone cannot underwrite whether the price is fair.'
  claimRefs:
  - CV001
  - CV002
