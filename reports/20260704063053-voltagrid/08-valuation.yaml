  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: audited-financials
    missingEvidence: VoltaGrid's audited or lender-verified 2025 (and, once available, 2026) revenue, EBITDA, gross margin, and cash-flow statements.
    whyItMatters: The entire greater-than-$10 billion valuation reduces to a single unaudited, company- and Fitch-sourced 2028 EBITDA projection; without audited numbers the valuation cannot be underwritten with confidence.
    diligencePath: Request audited financials or the lender/rating-agency credit package underlying the November 2025 debt financing, under NDA if necessary.
    relatedQuestionRefs:
    - QV007
  - type: private-evidence-only
    severity: material
    topic: propell-acquisition-economics
    missingEvidence: The purchase price VoltaGrid paid for Propell Energy Technology and the resulting pro forma balance sheet.
    whyItMatters: Without the purchase price, it is impossible to know how much of the $775 million primary raise is consumed by M&A versus organic growth capital expenditure, or whether the deal was accretive or dilutive to the implied multiple.
    diligencePath: Request the purchase agreement or merger-consideration disclosure directly from VoltaGrid or its advisors (Goldman Sachs, Kirkland & Ellis, Sidley Austin).
    relatedQuestionRefs:
    - QV030
  - type: missing-source
    severity: material
    topic: cap-table-and-preference-terms
    missingEvidence: VoltaGrid's Series D cap table, liquidation preference stack, and whether Blackstone/Halliburton hold preferred or common equity.
    whyItMatters: Preference terms determine how downside risk and proceeds are actually allocated across investor classes in a sale or IPO, and materially affect what common or earlier-round holders would realize in a bear-case outcome.
    diligencePath: Request the cap table and preferred-stock term sheet directly from VoltaGrid or its counsel as part of any follow-on diligence process.
    relatedQuestionRefs:
    - QV031
  - type: conflicting-data
    severity: minor
    topic: customer-revenue
    missingEvidence: A second, independent source corroborating Bloomberg's reported figure that Oracle pays VoltaGrid more than $1 billion per year for a single Texas site.
    whyItMatters: This is the single largest disclosed per-site revenue data point in the sources reviewed, and it is currently single-sourced; if inaccurate, it would materially change any per-GW revenue model built on VoltaGrid's order book.
    diligencePath: Seek a second independent report, an Oracle-side disclosure, or direct contract confirmation of the per-site payment figure.
    relatedQuestionRefs:
    - QV036
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table-coverage
    missingEvidence: A fully exhaustive set of every possible public and private power-generation, IPP, and AI-data-center-power comparable (e.g., Aggreko, Wartsila, additional pre-IPO microgrid peers) beyond the nine-row sample in TV004 (Comparable valuation table).
    whyItMatters: A broader comparable set could shift the implied multiple band further, though the nine names already reviewed span the private/public and equipment/merchant-generator spectrum most frequently cited by analysts.
    diligencePath: Commission a banker- or analyst-built comparable-company set (e.g., from Goldman Sachs or another underwriter) covering the full peer universe before finalizing any valuation model.
    relatedTableRefs:
    - TV004
