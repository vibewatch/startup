- id: exit-readiness-and-final-diligence-asks
  title: Exit Readiness and Final Diligence Asks
  body: 'VoltaGrid appears exit-ready in narrative terms -- management and existing investors were reportedly evaluating both an IPO and a private-equity sale as of February 2026, and the comparable ERock IPO filing shows a plausible near-term public-listing path exists for this business model -- but exit readiness in a governance and disclosure sense is unproven, since no public source describes VoltaGrid''s audit history, internal controls maturity, or registration-ready financial statements. Before any new capital is committed or an existing position is added to, seven diligence items should be closed: audited 2025 revenue and EBITDA; the Propell Energy acquisition purchase price; Series D cap-table and liquidation-preference terms; the natural-gas hedging or fuel-pass-through policy; the Georgia EPD and Texas TCEQ enforcement resolutions; independent corroboration of the reported >$1 billion per year single-site Oracle payment, which is currently single-sourced to Bloomberg; and a customer-level revenue concentration breakdown rather than the GW-share proxy currently available. Closing even half of this list would materially raise this chapter''s confidence rating from medium toward high in either direction.'
