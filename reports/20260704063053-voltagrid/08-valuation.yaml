- id: comparable-company-and-precedent-analysis
  title: Comparable Company and Precedent Transaction Analysis
  body: 'Two private comparables anchor the growth-stage end of the range: Crusoe Energy raised $1.375 billion in October 2025 at a valuation exceeding $10 billion as a vertically integrated AI-data-center-and-power developer, and Enchanted Rock (ERock) targeted a $5 billion 2026 IPO valuation against $183.1 million of 2025 revenue -- an approximately 27x EV/Revenue multiple that shows the private/pre-IPO market is willing to underwrite similar growth premiums sector-wide, not uniquely for VoltaGrid. On the public side, current (July 2026) figures from stockanalysis.com and each company''s FY2025 Form 10-K show a wide 10x-33x EV/EBITDA band: Vistra at 10.34x, NRG at 23.04x EV/EBITDA and 1.61x EV/Sales, Cummins at 19.26x EV/EBITDA (a separate provider shows 15.9x on a forward basis) and 2.84x EV/Sales, Generac at 30.33x EV/EBITDA and 3.70x EV/Sales, Caterpillar at 33.22x EV/EBITDA and 6.83x EV/Sales, and Bloom Energy at 31.65x EV/Sales (its 334.71x EV/EBITDA is not meaningful given a thin GAAP earnings base). Applying VoltaGrid''s >$10 billion equity value to its $1.1 billion 2028E EBITDA target implies roughly 9x equity-value/EBITDA, or about 13-14x forward EV/EBITDA once an estimated $5.5 billion of net debt is added -- below the equipment-maker multiples but above Vistra''s, so the entry price is not obviously rich against today''s frothy comps, provided the EBITDA target is real and gets audited.'
