evidenceGaps:
  - type: missing-source
    severity: material
    topic: Propell Energy Technology acquisition price
    missingEvidence: The disclosed purchase price / consideration structure for the Propell acquisition.
    whyItMatters: >-
      Acquisition price materially affects how much of the May 2026 $775M primary raise funds organic growth versus M&A,
      and is needed to assess capital efficiency.
    diligencePath: >-
      Request the acquisition purchase agreement or an SEC/debt-covenant disclosure that states consideration once the
      deal closes.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: blocking
    topic: VoltaGrid revenue and ARR
    missingEvidence: Audited or management-prepared financial statements showing revenue, ARR, or run rate.
    whyItMatters: >-
      Revenue/ARR is a required cover metric and the key input for valuation and growth-rate analysis in later chapters,
      but no retained public source discloses it.
    diligencePath: >-
      Request management accounts, audited financials, or a data room revenue schedule from VoltaGrid as part of
      diligence.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: VoltaGrid/Propell manufacturing footprint
    missingEvidence: A complete list of manufacturing plants and active project/deployment sites.
    whyItMatters: >-
