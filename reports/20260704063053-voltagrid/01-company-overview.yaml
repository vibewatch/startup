- id: founders-leadership-governance
  title: Founders, leadership, board governance, and key-person dependence
  body: >-
    VoltaGrid's official team materials name Nathan Ough as Co-Founder and President & CEO, and no other individual is listed on the company's 2026 team or leadership
    pages in an active founder role, which concentrates public founder-market fit and key-person dependence in a single executive. Ough previously co-founded Certarus
    Ltd., a North American mobile natural gas infrastructure company, and worked in Macquarie Capital's Global Energy Investment Banking group; he was named a winner
    of the EY Entrepreneur Of The Year 2025 Gulf South Award, an independent recognition of that track record. Beneath Ough, VoltaGrid discloses a functionally complete
    executive bench: Chris Atchley (EVP), Micah Foster (CFO), Les Wise (COO), Daniel Ro-Trock (Chief Legal Officer), Luke Saladyga (CTO), and Kate Saltzman (Chief
    Administrative Officer), plus a management layer covering data center development, sales, engineering, HSQ&ED, people operations, and general counsel. Governance
    sits with a three-member disclosed board: Chair Doug Wonnacott (a 35-year chemical-industry executive and former Canexus President/CEO), Tyson Birchall (Managing
    Director of long-tenured investor Longbow Capital), and Eric Carre (Halliburton's EVP & CFO, who joined the board following Halliburton's May 2026 strategic investment),
    tying board composition directly to VoltaGrid's investor base.
  claimRefs:
