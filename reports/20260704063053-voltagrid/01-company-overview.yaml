- id: funding-valuation-investors-debt
  title: Funding history, valuation, total raised, investors, and debt/credit
  body: >-
    VoltaGrid's disclosed capital history runs from a $100 million ($127.2 million CAD) equity raise in December 2021 backed by CPP Investments, Longbow Capital,
    Pilot Company, and Walter Ventures, through a $210 million follow-on equity raise in the third quarter of 2023, to a $1.0 billion strategic equity investment
    announced May 11, 2026 from Blackstone Tactical Opportunities (roughly 90% of the capital) and Halliburton Company ($775 million primary plus a $225 million secondary
    purchase), which financial-press reporting says implied a valuation above $10 billion. Summing the individually announced equity rounds yields roughly $1.085
    billion in disclosed primary/follow-on equity, yet Tracxn's independently tracked total shows only about $875 million across four rounds -- a reconciliation gap
    this chapter treats as an open, conflicting data point rather than a single resolved figure. Debt has scaled alongside equity: a $500 million five-year term loan
    plus $50 million accordion and a $100-150 million revolver closed in March 2024 (Kennedy Lewis, Blue Torch Capital, CPPIB Credit Investments, and a bank syndicate),
    followed by a $5.0 billion comprehensive package in November 2025 ($2.0 billion of senior secured second-lien notes plus a $3.0 billion asset-based facility,
    led by Goldman Sachs). The May 2026 raise also funded a definitive agreement to acquire supplier Propell Energy Technology Ltd., whose purchase price remains
    undisclosed.
