- id: cover-metrics-snapshot
  title: 'Cover metrics: valuation, capital raised, revenue, customers, headcount, and locations'
  body: >-
    Assembling a cover-metric snapshot from retained sources shows strong disclosure on capital and scale alongside clear gaps on operating financials. Valuation
    is supported at "more than $10 billion" following the May 2026 investment, and total capital raised is estimable at roughly $1.085 billion of disclosed equity
    plus roughly $5.65 billion of arranged credit facilities (2024's $550 million package and 2025's $5.0 billion package), though the equity figure conflicts with
    Tracxn's lower aggregate. Headcount is disclosed only as "over 900 employees" in CEO Nathan Ough's biography page; if the pending Propell acquisition closes,
    combining that with financial-press reporting of an approximately 800-person Propell workforce implies a combined headcount approaching 1,700, though no consolidated
    figure has been published. Customer-side scale is anchored by a company-stated ~7.5 GW contracted order book through 2030 and a 4.3+ GW fully contracted deployment
    plan through 2028, driven chiefly by the Oracle Cloud Infrastructure (2.3 GW) and Vantage Data Centers (1+ GW) partnerships. By contrast, VoltaGrid discloses
    no revenue, ARR, or run-rate figure in any source retained here, and no source enumerates its full manufacturing or project-site footprint beyond the Houston
    headquarters and Propell's Granbury, Texas plants -- both are treated as explicit null/gap items rather than estimated numbers.
