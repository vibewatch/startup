- id: milestones-founding-to-adverse
  title: 'Milestones: founding, financing, product, scale, regulatory, partnership, and adverse events'
  body: >-
    VoltaGrid's chronology moves from a 2020 Houston founding in oilfield electrification through a steady financing cadence (2021, 2023, 2024, 2025, 2026) into a
    run of large data-center partnerships: Vantage Data Centers (February 2025, 1+ GW), Oracle Cloud Infrastructure (October 2025, 2.3 GW, with INNIO Group calling
    its associated 92-unit order the largest in its own company history), Halliburton's 400 MW Eastern Hemisphere commitment (December 2025), a further 1.5 GW INNIO
    order and an extended ABB collaboration (February-March 2026), and finally the May 2026 Blackstone/Halliburton investment paired with the Propell acquisition
    and Eric Carre's board appointment. That growth narrative is now shadowed by an active adverse chapter: on June 25, 2026 the Southern Environmental Law Center,
    Sustainable Newton, and the Altamaha Riverkeeper asked Georgia's Environmental Protection Division to investigate and enforce against VoltaGrid for building at
    least eight of 33 planned methane-gas engines at a Covington, Georgia site without required air permits, within roughly three miles of homes, a drinking-water
    reservoir, and a nature preserve; the Atlanta Journal-Constitution amplified the dispute on July 1, 2026, the same day Reuters (via US News) reported an Environmental
    Integrity Project analysis estimating 74 similar gas plants nationally could emit 662 million tons of CO2 per year, and advocacy group Shift Action has separately
    named VoltaGrid, as a CPP Investments-backed company, in fossil-fuel-exposure criticism of its long-standing investor.
