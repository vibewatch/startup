callouts:
- calloutType: strength
  title: VoltaGrid has converted its natural-gas microgrid platform into gigawatt-scale, named hyperscaler commitments backed by top-tier capital
  body: >-
    Within roughly 18 months, VoltaGrid moved from a single 1GW+ Vantage partnership to a 2.3GW Oracle collaboration, INNIO's largest-ever order, a $5.0B debt package,
    and a $1.0B Blackstone/Halliburton equity investment implying a >$10B valuation, evidencing rapid commercial and capital-markets traction in the AI data-center
    power niche.
  claimRefs:
  - CO024
  - CO026
  - CO035
  - CO036
  - CO034
  - CO022
- calloutType: risk
  title: An active Georgia enforcement request creates near-term regulatory and reputational exposure
  body: >-
    A formal enforcement request alleges VoltaGrid built most of a 90MW power plant near homes, a reservoir, and a nature preserve without required air permits, and
    mainstream press has since amplified the dispute. The outcome is unresolved as of the run date and could affect VoltaGrid's ability to replicate its behind-the-meter
    siting model elsewhere.
  claimRefs:
  - CO044
  - CO045
  - CO046
  - CO047
  - CO052
- calloutType: assumption
  title: Cover metrics on revenue, precise headcount, and total capital raised should be treated as gaps, not settled figures
  body: >-
    No retained source discloses VoltaGrid's revenue or ARR, Tracxn's independently tracked total funding is materially lower than the sum of VoltaGrid's announced
    equity rounds, and combined post-acquisition headcount with Propell is an inference rather than a disclosed figure. Later chapters should treat these as explicit
    nulls pending management disclosure rather than approximate them further.
  claimRefs:
  - CO031
  - CO041
  - CO042
  - CO043
