callouts:
  - calloutType: risk
    title: Undisclosed Revenue and Cash Position Block Independent Underwriting
    body: >-
      VoltaGrid discloses no revenue, ARR, EBITDA, cash-on-hand, or burn-rate figures anywhere in retained public
      sources. Runway cannot be computed, and the ~$1.1 billion 2028 EBITDA target rests on unaudited company
      guidance rather than verifiable financial statements, making it impossible to independently size the
      greater-than-$10 billion valuation from public evidence alone.
    claimRefs: [CI012, CI015, CI033, CI034, CI040]
  - calloutType: risk
    title: Unhedged Natural-Gas Exposure Sits Behind Undisclosed Contract Pricing
    body: >-
      No retained source discloses whether VoltaGrid hedges natural-gas fuel costs or passes them through to
      customers, and no source discloses VoltaGrid's own contract pricing to test against the industry BTM-gas
      benchmark. Combined with $5.5 billion-plus of disclosed debt, this leaves margin and debt-service coverage
      exposed to gas-price volatility in a way this chapter cannot quantify.
    claimRefs: [CI006, CI024, CI035]
  - calloutType: strength
    title: Institutional Capital Access De-Risks Near-Term Financing
    body: >-
      VoltaGrid closed a $5.0 billion debt package in November 2025 and a $1.0 billion strategic equity investment
      from Blackstone and Halliburton in May 2026, both from credible, diligence-capable institutional counterparties.
      This repeated capital-market access is itself evidence against near-term insolvency risk, even though it does
      not resolve the underlying operating-metric opacity.
    claimRefs: [CI031, CI032, CI039]
  - calloutType: recommendation
    title: Priority Diligence Requests Before Underwriting VoltaGrid's Economics
    body: >-
      Before treating VoltaGrid's valuation or margin trajectory as underwritten, a diligence process should request,
      at minimum, audited or lender-verified revenue and EBITDA, the Propell acquisition purchase price and its
      funding source, the debt covenant package and consolidated leverage ratio, and confirmation of any natural-gas
      hedging or pass-through mechanism in customer contracts.
    claimRefs: [CI036, CI040, CI041, CI042]
