      - ["Propell acquisition purchase price", "Unclear how much of the $775M primary raise is consumed by M&A versus organic capex", "Request the purchase agreement or merger-consideration disclosure"]
      - ["Debt covenants and consolidated leverage ratio", "Cannot assess default risk or covenant headroom given $5.5B-plus of combined debt", "Request the term-loan and notes indenture covenant package"]
    notes: Each row records a metric no retained source discloses; impact and diligence-path columns describe why the gap matters and how to close it, not an estimate of the missing value.
    claimRefs: [CI012, CI015, CI036, CI040]
