schemaVersion: "report-v2"
artifact: financials
slug: voltagrid
runDate: 2026-07-04
company:
  name: VoltaGrid
chapter:
  number: 4
  title: Financials
  summary: >-
    VoltaGrid has demonstrated strong access to institutional capital -- a $1.0 billion May 2026 Blackstone/Halliburton
    strategic equity investment and a $5.0 billion November 2025 debt package -- and a roughly 7.5 GW disclosed order
    book, but it has released no public revenue, EBITDA, gross margin, cash-on-hand, or burn-rate figures, so its
    unit economics and the durability of its greater-than-$10 billion valuation cannot be underwritten from public
    sources alone. Public-company comparables (Generac, Bloom Energy, Cummins) suggest a plausible 17-38% gross/EBITDA
    margin band for scaled power-generation businesses, but VoltaGrid's own fuel-cost hedging, Propell acquisition
    price, and debt covenants remain undisclosed, and an active Georgia Clean Air Act enforcement matter adds an
    unquantified cost-and-delay risk on top of that opacity.
sections:
  - id: revenue-model-pricing
    title: Revenue Model, Pricing Mechanism, and Revenue Mix
    body: >-
      VoltaGrid monetizes behind-the-meter (BTM) natural-gas generation as a long-term, capacity-based service rather
      than a one-time equipment sale or a spot-priced commodity: it deploys, owns, and operates modular reciprocating-engine
      power plants under multi-year agreements with data-center, industrial, and oil-and-gas customers (CI001, CI002).
      The clearest disclosed revenue-mix evidence is a handful of named, gigawatt-scale contracts rather than a published
      per-vertical split -- the 2.3 GW Oracle Cloud Infrastructure deployment supplied with Energy Transfer gas (CI003),
      the 1+ GW Vantage Data Centers multi-site partnership (CI004), and an October 2025 collaboration with Halliburton
      targeting an initial Middle East roll-out that extends VoltaGrid's revenue geography beyond North America (CI005).
      No retained source, however, discloses a VoltaGrid-specific per-MW-month or per-MWh contract price, so the
      widely circulated $70-100/MWh industry benchmark for BTM gas power cannot be checked against VoltaGrid's actual
      deals (CI006); OEM partners ABB and INNIO likewise disclose order scope (35 synchronous condensers; 300 Jenbacher
      engines totaling 1.5 GW) without price (CI007, CI008). Because VoltaGrid's revenue depends on converting its
      order book into billed, energized capacity over 2026-2030 rather than immediate spot billing, recognition itself
      is execution-dependent (CI009).
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI008, CI009]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-proxies-public-gaps
    title: Public Traction Proxies Versus Private Financial Gaps
    body: >-
      In the absence of disclosed revenue or ARR, the most defensible public traction proxies are contracted-capacity
      figures rather than dollar metrics. VoltaGrid's headline order book is approximately 7.5 GW of data-center power
      delivery through 2030 (CI010), while its November 2025 debt-financing announcement anchors a more conservative
      near-term figure of 4.3 GW of contracted capacity through 2028 (CI011) -- the gap between the two numbers itself
      signals that "order book" and "contracted backlog" are not interchangeable in VoltaGrid's own disclosure. No
      retained source discloses current annual revenue, run-rate, or ARR (CI012), nor a discrete active-customer or
      energized-site count; public disclosure instead stops at named marquee contracts and aggregate GW totals (CI013).
      Using only those public GW figures, Oracle's 2.3 GW and Vantage's 1+ GW contracts together represent roughly
      45% of the disclosed 7.5 GW order book, a concentration estimate that itself cannot be converted into revenue-share
      terms without disclosed per-contract economics (CI014). Because VoltaGrid has not filed public financial statements,
      the revenue, EBITDA, margin, and cash-flow inputs an underwriter would need to test the greater-than-$10 billion
      valuation must be sourced from investor press materials and third-party estimates rather than audited disclosure
      (CI015), a structural gap this chapter treats as a diligence blocker rather than a modeling assumption.
    claimRefs: [CI010, CI011, CI012, CI013, CI014, CI015]
    tableRefs: [TI005]
  - id: cost-structure-margin-drivers
    title: Cost Structure, Gross Margin Drivers, and Capital Intensity
    body: >-
      VoltaGrid's cost structure is shifting toward vertical integration: its pending acquisition of long-time supplier
      Propell Energy Technology brings roughly 1,000 US and Canadian manufacturing employees in-house and is intended
      to reduce supply-chain execution risk on the order book rather than to disclose a specific cost-per-unit saving
      (CI016), while two new automated Granbury, Texas plants target a combined ~300 MW/month of reciprocating-engine
      and turbine output (CI017). No retained source discloses VoltaGrid's cost of revenue, gross margin, or per-project
      unit economics (CI018). Public comparable-company filings offer the best available benchmark: Generac's FY2025
      Form 10-K reports a 38.3% gross margin and $715.5 million of total Adjusted EBITDA (about 17.0% of net sales)
      (CI019); Bloom Energy's FY2025 10-K shows total revenue up 37.3% to roughly $2.02 billion with a gross margin
      near 29% (CI020); Cummins' Power Systems segment sales grew 16% in FY2025 on data-center-driven power-generation
      demand (CI021); and Caterpillar's Power & Energy segment reports 2025 sales growth in large reciprocating engines
      "primarily data center applications" (CI022). Together these suggest a plausible 17-38% gross/EBITDA margin
      band for a scaled power-generation business (CI023), but no source discloses whether VoltaGrid hedges natural-gas
      fuel costs, leaving margin exposure to gas-price volatility unconfirmed either way (CI024). A June 2026 Clean
      Air Act enforcement request against a VoltaGrid site in Covington, Georgia adds an unquantified retrofit, fine,
      or shutdown cost risk on top of that opacity (CI025, CI026).
    claimRefs: [CI016, CI017, CI018, CI019, CI020, CI021, CI022, CI023, CI024, CI025, CI026]
    tableRefs: [TI003]
    figureRefs: [FI002]
  - id: gtm-sales-efficiency
    title: Go-to-Market Motion and Sales-Efficiency Proxies
    body: >-
      VoltaGrid's go-to-market motion is direct enterprise sales to hyperscale and colocation data-center operators
      and industrial accounts, not a channel, reseller, or self-serve model, consistent with its named VP of Sales
      role for oil & gas/mining and separate data-center/microgrid development lead (CI027). The clearest public
      sales-cycle proxy is deployment speed rather than a disclosed CAC or payback figure: VoltaGrid's generators
      reportedly arrived at xAI's Memphis Colossus site in June 2024 and were powering the facility within about
      122 days, an early proof point for a fast site-to-revenue cycle (CI028). A second efficiency proxy is the pace
      at which OEM partners book incremental orders on VoltaGrid's behalf -- INNIO's 1.5 GW February 2026 order and
      ABB's March 2026 extension to 35 synchronous condensers both followed within months of the October 2025 Oracle
      deal, suggesting the sales motion is converting new anchor contracts into supplier-side backlog quickly even
      though VoltaGrid's own booking-to-revenue timeline is not disclosed (CI029). This vendor-order cadence is a
      useful, if indirect, sales-efficiency signal: it corroborates commercial momentum through a third party's own
      disclosure discipline, partially offsetting the absence of VoltaGrid-reported deal metrics, but it cannot
      substitute for an actual CAC, sales-cycle length, or channel-economics figure that a diligence process would
      need to size customer-acquisition efficiency (CI030).
    claimRefs: [CI027, CI028, CI029, CI030]
  - id: capital-adequacy-debt-project-finance
    title: Capital Adequacy, Debt Load, and Project Finance
    body: >-
      VoltaGrid has raised substantial cumulative capital since its 2020 founding -- a chronology detailed in this
      report's Company Overview chapter -- and this chapter's own local evidence confirms that capital access continued
      through two large 2025-2026 packages: a $5.0 billion comprehensive debt financing in November 2025 comprising
      $2.0 billion of senior secured second-lien notes and a $3.0 billion asset-based loan facility (CI031), and a
      $1.0 billion strategic equity investment in May 2026 from Blackstone Tactical Opportunities and Halliburton,
      split into $775 million of primary capital and a $225 million secondary purchase, with primary proceeds earmarked
      for "growth and acquisition of Propell" (CI032). Neither VoltaGrid's current cash-on-hand balance nor a monthly
      burn rate is disclosed anywhere in retained sources, so runway cannot be computed (CI033, CI034). The debt stack
      layers a March 2024 $500 million five-year term loan (plus a $50 million accordion and up to a $150 million
      revolver) beneath the 2025 notes/ABL package, and no retained source confirms whether the 2024 facility was
      refinanced or remains outstanding alongside the newer debt (CI035). VoltaGrid has not disclosed the purchase
      price for the pending Propell acquisition, so it is unclear how much of the $775 million primary raise funds
      that deal versus organic manufacturing capex (CI036); as of the most recent 2026 reporting, the acquisition
      had not yet formally closed (CI037). With $5.5 billion-plus of disclosed debt and no disclosed EBITDA against
      which to compute leverage, VoltaGrid's effective next-round trigger is continued external financing of its
      300 MW/month manufacturing ramp and 7.5 GW backlog conversion rather than confirmed self-funding from operating
      cash flow (CI038).
    claimRefs: [CI031, CI032, CI033, CI034, CI035, CI036, CI037, CI038]
    tableRefs: [TI004]
    figureRefs: [FI004]
  - id: financial-verdict
    title: 'Financial Verdict: Revenue Quality, Margin Path, and Diligence Blockers'
    body: >-
      VoltaGrid's financial profile combines strong, repeatedly demonstrated access to institutional capital with
      near-total opacity on the operating metrics that would let a diligence process independently underwrite its
      economics. The company has closed roughly $6.5 billion of disclosed debt and equity since 2024 alone (CI039),
      backed by credible counterparties (Blackstone, Halliburton, a syndicated bank group), which is a genuine signal
      of institutional confidence in the contracted-capacity thesis. Set against that, revenue, EBITDA, gross margin,
      cash position, burn rate, fuel-hedging policy, and the Propell purchase price are all undisclosed, and the
      company-guided ~$1.1 billion 2028 EBITDA target implies roughly a 5-6x increase from an analyst-implied 2024
      baseline of ~$180-220 million with "little room for error," according to at least one valuation-risk analysis
      (CI040). Public comparables suggest the margin path is plausible in principle (17-38% gross/EBITDA range) but
      cannot confirm it applies to VoltaGrid specifically (CI041). An active Georgia Clean Air Act enforcement matter
      adds a live, unquantified cost and reputational tail risk on top of that financial opacity (CI042). The verdict
      this chapter reaches is that VoltaGrid's revenue quality and margin trajectory are directionally credible given
      its contracted order book and comparable-company benchmarks, but they are not independently verifiable from
      public evidence, and the capital-adequacy picture depends on continued external financing rather than confirmed
      self-funding.
    claimRefs: [CI039, CI040, CI041, CI042]
    figureRefs: [FI003]
