  topStrengths:
    - >-
      Named multi-gigawatt backlog with Oracle and Vantage demonstrates real customer demand, not just concept-stage
      interest.
    - >-
      The company's speed-to-power offering addresses a pressing AI data-center bottleneck where grid timelines are too
      slow.
    - >-
      Blackstone, Halliburton, CPP Investments, INNIO, and ABB together provide unusually strong sponsor and ecosystem
      validation.
    - >-
      Bringing Propell in-house could improve manufacturing control and supply assurance if the ramp is executed
      successfully.
  topRisks:
    - >-
      Active Georgia and pending Texas permitting disputes could slow projects, force retrofits, or undermine the
      fast-deploy permitting model.
    - >-
      The >$10 billion valuation depends on unaudited revenue and EBITDA targets, with no public financial statements to
      anchor downside.
    - >-
      Customer concentration around Oracle and Vantage makes backlog conversion vulnerable to delays, repricing, or
      cancellations.
    - >-
      Roughly $5.5 billion of debt and no disclosed gas-hedging policy create sensitivity to cost inflation and
      execution misses.
    - >-
      Propell integration and reliance on a small set of OEM and board-linked counterparties raise operational and
      governance risk.
  unresolvedGaps:
    - Audited 2025/2026 revenue, EBITDA, cash, and gross-margin data.
    - Propell acquisition purchase price, integration milestones, and realized manufacturing throughput.
    - Natural-gas hedging terms or customer pass-through mechanisms on long-term contracts.
    - Customer-level revenue concentration, contract durations, and renewal/cancellation rights.
    - Final regulatory outcomes in Georgia and Texas and whether similar permitting issues exist at other sites.
