  evidenceGaps:
    - type: missing-source
      severity: material
      topic: "BTM/fuel-cell pricing benchmarking"
      missingEvidence: "Verified per-MW or per-MWh pricing terms for VoltaGrid versus Bloom Energy fuel-cell service contracts."
      whyItMatters: "Without comparable unit pricing, it is not possible to confirm whether Bloom's 'clean' premium is large enough to offset VoltaGrid's likely cost advantage on pure $/MWh, which materially affects competitive-displacement risk."
      diligencePath: "Request customer-side contract term sheets, regulatory rate filings, or a paid market-intelligence subscription (e.g., Wood Mackenzie, S&P Global) with disaggregated BTM pricing benchmarks."
      relatedQuestionRefs: [QP014]
    - type: enumeration-incomplete
      severity: material
      topic: "hyperscaler multi-homing practice"
      missingEvidence: "A confirmed case where a single data-center campus contracts BTM power from more than one provider simultaneously."
      whyItMatters: "Determines whether switching costs create durable single-vendor lock-in for VoltaGrid's contracted capacity, or whether hyperscalers diversify power suppliers the way they multi-source cloud infrastructure, which would weaken the backlog-as-moat argument."
      diligencePath: "Interview data-center developers (Vantage, CloudBurst, Oracle) or review procurement RFPs for multi-sourcing clauses across BTM providers."
      relatedQuestionRefs: [QP020]
    - type: private-evidence-only
      severity: minor
      topic: "Aggreko and Wartsila competitive scale"
      missingEvidence: "Public financial disclosure for Aggreko and Wartsila's data-center-specific BTM/rental power revenue."
      whyItMatters: "Both are frequently cited as VoltaGrid-adjacent peers in rental/temporary power but lack public segment data to size their AI data-center exposure directly, leaving a gap in the competitor set."
      diligencePath: "Request private company filings or subscribe to a paid research provider (e.g., PitchBook, CB Insights) for segment-level detail on Aggreko and Wartsila."
    - type: stale
      severity: minor
      topic: "Cummins Power Systems segment-level backlog disclosure"
      missingEvidence: "Cummins does not break out a data-center-specific order backlog figure directly comparable to Caterpillar's consolidated $51 billion backlog."
      whyItMatters: "Without a segment backlog figure, growth-rate comparisons across OEM competitors rely on revenue growth rates alone and are only approximately comparable."
      diligencePath: "Track Cummins' quarterly 10-Q segment disclosures for backlog detail if the company begins reporting it separately."
