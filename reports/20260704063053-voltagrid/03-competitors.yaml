callouts:
  - calloutType: risk
    title: Sector-wide backlog growth undercuts a clean-differentiation narrative
    body: >-
      Enchanted Rock/ERock ($1.3B backlog), Bloom Energy (~$20B backlog), and Caterpillar ($51B
      order backlog, +71%) are all reporting AI-data-center-driven growth over the same window as
      VoltaGrid's 7.5 GW backlog, which suggests the category is riding one shared demand surge
      rather than VoltaGrid capturing disproportionate share.
    claimRefs: [CP003, CP008, CP011]
  - calloutType: risk
    title: Gas-fired BTM power faces shared permitting and greenwashing exposure
    body: >-
      The NAACP/SELC enforcement action against xAI's unpermitted Memphis turbines and
      RealClearEnergy's critique of Meta's "100% clean" gas-power framing both show that
      regulatory and reputational risk attaches to gas-fired behind-the-meter power broadly, a
      risk VoltaGrid shares with Caterpillar-, Cummins-, and Enchanted Rock-supplied projects
      alike.
    claimRefs: [CP033, CP034]
  - calloutType: insight
    title: VoltaGrid's ERCOT focus currently sidesteps FERC's new PJM constraint
    body: >-
      FERC's 50 MW BTM co-location netting threshold for PJM does not bind VoltaGrid's current
      ERCOT-centered fleet, but it would raise the cost of expansion into PJM territory for
      VoltaGrid and every other BTM competitor profiled here.
    claimRefs: [CP038]
