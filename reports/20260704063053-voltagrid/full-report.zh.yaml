      - number: '4.2'
        title: 公开牵引代理指标与私营财务缺口
        blocks:
          - type: paragraph
            body: >-
              在收入或 ARR 未披露的情况下，最稳妥的公开牵引代理是已签约容量，而不是美元指标。VoltaGrid 的标志性订单簿约为截至 2030 年 7.5 GW 数据中心供电（CI010），而 2025 年 11
              月债务融资公告锚定了更保守的近期数字：截至 2028 年 4.3 GW 已签约容量（CI011）——两个数字之间的差距本身说明，在 VoltaGrid
              自身披露中，“订单簿”和“签约积压订单”不可互换。留存来源均未披露当前年收入、运行率或 ARR（CI012），也没有披露离散的活跃客户数或已通电站点数；公开披露止步于具名旗舰合同和汇总 GW
              总量（CI013）。仅使用这些公开 GW 数字，Oracle 2.3 GW 和 Vantage 1+ GW 两份合同合计约占已披露 7.5 GW 订单簿的
              45%；但若没有披露每份合同经济性，这一集中度估算本身无法转换为收入份额（CI014）。由于 VoltaGrid 未提交公开财务报表，承销方测试超过 $10 billion
              估值所需的收入、EBITDA、利润率和现金流输入，只能来自投资方新闻材料和第三方估计，而非经审计披露（CI015）；本章把这一结构性缺口视为尽调阻塞点，而不是建模假设。
