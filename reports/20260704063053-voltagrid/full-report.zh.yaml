  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 两个不同买方群体下的客户分层
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid 的具名客户关系不是一个同质买方群体，而是分成两个结构不同的细分市场 (CU001)。AI 数据中心细分市场（Oracle Cloud Infrastructure、Vantage Data
              Centers、Serverfarm）由同一企业实体购买、使用并付款，规模达到 GW 级，合同为跨多年、分阶段交付；传统油田电动水力压裂细分市场（Aethon Energy、Chesapeake
              Energy）则以单站点数十 MW 规模运行，但自 2021 年以来已经上线 (CU002)。地理上，数据中心细分市场集中在 Texas（Oracle 的 Shackelford County /
              Stargate 关联站点）、Georgia（Serverfarm 的 Covington 园区）和 Tennessee（xAI 的 Memphis Colossus 站点）；油田细分市场集中在
              Haynesville 和 Marcellus 页岩盆地 (CU003)。VoltaGrid
              自身匿名案例研究还指向至少三个标志性客户之外的子细分：一位未具名的美国西南部数据中心运营商、一位使用放空气发电转换的未具名 New Mexico 油气生产商，以及一家使用 VoltaGrid
              做风暴恢复供电的未具名 Gulf Coast 公用事业公司 (CU004)。公司自己的 Propell 收购新闻稿也把目标客户集愿景式地描述为“北美的数据中心、AI
              基础设施、公用事业和工业客户”，说明其意图超出已经签约的具名 logo (CU005)。在审阅的每个具名合同中，VoltaGrid
              看起来都是直接卖给终端运营方，而不是通过转售商、系统集成商或分销渠道；本章审阅的任何来源中也未识别出渠道合作伙伴网络 (CU044, CU045)。
