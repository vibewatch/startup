              >4,350 MW 的累计订单簿和 2.3 GW Oracle 合同都是真实存在的，但两者都分阶段延续到 2028 年，而不是今天已经交付；VoltaGrid
              自己最新的具名站点（Serverfarm，Covington）仍在建设，只安装了计划中少量发动机，且没有最终许可，凸显积压订单标题与在役容量之间持续存在缺口。
