  - id: TV003
    title: 乐观 / 基准 / 悲观情景
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 7.5 GW 订单簿按期转化；Propell 爬坡达到约 300 MW/month；2028 EBITDA 达到或超过 $1.1B；倍数向设备可比公司溢价重估（18-20x 远期 EV/EBITDA）
        - 到 2028，隐含企业价值约 $18-22B，约为 May 2026 >$10B 入场估值的两倍
        - 需要多年执行零失误，且没有许可、客户或天然气价格冲击
        - 低至中等——与已披露计划一致，但尚未验证
      - - 基准
        - 积压订单转化伴随适度延迟 / 成本滑坡；2028 EBITDA 落在 $700M-$1.0B；倍数维持在 May 2026 融资已隐含的约 13-14x 远期 EV/EBITDA 附近
        - 企业价值相对 >$10B 入场估值大致持平至小幅上升
        - 执行滑坡、天然气价格波动和 Propell 整合成本吃掉部分增长溢价
        - 中等——「按完美执行定价」的框架意味着基准情景接近今天的估值
      - - 悲观
        - Georgia/Texas 执法行动升级；天然气价格飙升；Oracle/Vantage 集中引发放缓或重新定价；2028 EBITDA 降至 $500-700M
        - 倍数向 Vistra/NRG 类 9-11x 远期 EV/EBITDA 压缩，且 EBITDA 基数更小，隐含企业价值约 $5-8B
        - 若 EBITDA 不达预期，约 $5.5B 有担保杠杆的债务服务会成为硬约束
        - 中等——多个独立识别到的实时触发因素（EPD、TCEQ、天然气价格、客户集中）都可能压缩倍数
    notes: 情景中的美元区间是作者基于可比倍数带和公司指引的 2028 EBITDA 目标估算得出；仅作说明，不是正式 DCF 或模型输出。
