      - number: '3.4'
        title: 切换成本、锁定效应、多供应商并用与分销权力
        blocks:
          - type: paragraph
            body: >-
              表后电力合同在结构上很粘。BTM 安排的法律分析描述了 5-15 年 take-or-pay 条款，以及提前转向电网时需支付的退出费用；这意味着与 VoltaGrid、Enchanted Rock、Bloom
              或任何类似供应商签约的数据中心运营商，接受的是多年锁定，而不是容易逆转的供应商选择。这提高了切换成本，也意味着市场主要争夺新增容量承诺，而不是替换已安装的既有供应商。分销权力在竞争者类别之间并不对称：LS
              Power 即使以约 $12 billion 向 NRG 出售 13 GW 加 CPower 虚拟电厂平台后，仍保留约 10 GW 发电资产和 LS Power Grid 输电平台（已投运 780 多英里，另有
              350 多英里在建），保住了 VoltaGrid 这类轻资产 BTM 进入者不具备的实体基础设施优势。FERC 新 PJM 共址规则设置 50 MW 门槛，超过后新安排将失去 BTM
              净额结算优惠；这一地区性约束不限制 VoltaGrid 当前以 ERCOT 为中心的机队，但若任何竞争者——包括 VoltaGrid——在 PJM 区域扩张 BTM
              容量，成本都会上升。超大规模云厂商能否像多源采购云基础设施那样，在单一园区内跨 BTM 供应商多供应商并用，公开记录尚未证实，仍是开放尽调问题。
            claimRefs:
              - CP022
              - CP038
              - CP039
      - number: '3.5'
        title: 护城河耐久性、替代风险与竞争者负面证据
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid 声称的护城河建立在几件事上：通过模块化往复式发动机实现更快通电，新近垂直整合的制造基地（Propell 收购，目标 300 MW/月），以及截至 2030 年已签约 7.5 GW
              积压订单。但在当前周期，这些都不独特：Enchanted Rock/ERock、Bloom Energy、Caterpillar 和 Generac 都在 2025-2026 年同一窗口报告 AI
              数据中心驱动的积压订单或订单增长，说明整个行业都在搭乘同一轮需求浪潮，而不是 VoltaGrid 获得了不成比例的份额。边际上的商品化风险是真实的——Generac 2025 年整体收入实际下降
              2%，即便其与数据中心相关的 C&I 板块增长，显示仅有数据中心敞口并不保证财务表现优于同业；技术层面也存在替代风险，若重视 ESG 的超大规模云厂商从燃烧式天然气转向 Vistra 式核能 PPA 或
              Bloom 式燃料电池，VoltaGrid 会受到挤压。负面证据进一步强化这一点：NAACP 和 Southern Environmental Law Center 2025 年就 xAI 未许可 Memphis
              燃气轮机发出的起诉意向通知，以及 RealClearEnergy 批评 Meta 的 Entergy 燃气交易与 “100% clean” 说法不一致，都显示许可和漂绿审查适用于整个燃气 BTM，而不只针对
              VoltaGrid。另一个独立风险是，Goldman Sachs 已提示 AI 数据中心容量增长（预计到 2027 年约 92 GW）可能跑在 AI 变现之前；这一宏观风险会压缩此处所有竞争者的订单簿，包括
              VoltaGrid。
