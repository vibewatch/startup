      - number: '4.4'
        title: 进入市场动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid 的进入市场动作是面向超大规模和托管数据中心运营商以及工业账户的直接企业销售，而不是渠道、经销商或自助模式；这一点与其为油气 / 采矿设置 VP of Sales、另设数据中心 /
              微电网开发负责人相一致（CI027）。最清晰的公开销售周期代理是部署速度，而不是已披露 CAC 或回本周期：据报道，VoltaGrid 发电机于 2024 年 6 月抵达 xAI 的 Memphis
              Colossus 场地，并在约 122 天内为设施供电，这是快速从场地到收入的早期证明点（CI028）。第二个效率代理是 OEM 合作伙伴代表 VoltaGrid 记录增量订单的速度——INNIO 2026 年
              2 月 1.5 GW 订单和 ABB 2026 年 3 月把合作延长到 35 台同步调相机，都在 2025 年 10 月 Oracle
              交易后数月内发生，表明销售动作正在快速把新的锚定合同转化为供应商侧积压订单，尽管 VoltaGrid
              自身从预订到收入的时间线未披露（CI029）。这种供应商订单节奏是有用但间接的销售效率信号：它通过第三方自身披露纪律佐证商业动能，部分抵消 VoltaGrid
              未报告交易指标的问题，但无法替代尽调衡量获客效率所需的实际 CAC、销售周期长度或渠道经济性数字（CI030）。
            claimRefs:
              - CI027
              - CI028
              - CI029
              - CI030
      - number: '4.5'
        title: 资本充足性、债务负担与项目融资
        blocks:
          - type: paragraph
            body: >-
              自 2020 年创立以来，VoltaGrid 已募集大量累计资本——时间线详见本报告公司概况章节——而本章本地证据也确认，资本获取在 2025-2026 年两笔大型融资包中继续推进：2025 年 11 月
              $5.0 billion 综合债务融资，包括 $2.0 billion 高级有担保第二留置权票据和 $3.0 billion 资产支持贷款工具（CI031）；2026 年 5 月来自 Blackstone
              Tactical Opportunities 和 Halliburton 的 $1.0 billion 战略股权投资，拆分为 $775 million 新股资本和 $225 million
              老股购买，新股所得款项指定用于“增长和收购 Propell”（CI032）。留存来源均未披露 VoltaGrid 当前账面现金余额或月度烧钱速度，因此无法计算现金跑道（CI033、CI034）。债务栈在 2025
              年票据 / ABL 融资包之下，还叠加了 2024 年 3 月 $500 million 五年期定期贷款（另有 $50 million accordion 和最高 $150 million
              循环信贷），且留存来源没有确认 2024 年融资是否已再融资，或仍与新债并存（CI035）。VoltaGrid 尚未披露待完成 Propell 收购的购买价格，因此不清楚 $775 million
              新股融资中有多少用于该交易，又有多少用于有机制造资本开支（CI036）；截至最近的 2026 年报道，收购尚未正式交割（CI037）。在已披露债务超过 $5.5 billion、且没有已披露 EBITDA
              可用于计算杠杆的情况下，VoltaGrid 实际下一轮触发因素不是已确认由经营现金流自我供血，而是继续为 300 MW/月制造爬坡和 7.5 GW 积压订单转化寻求外部融资（CI038）。
