        title: 创始人、领导层、董事会治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid 官方团队材料列明 Nathan Ough 为联合创始人兼总裁 & CEO；公司 2026
              年团队或领导层页面未列出其他仍以创始人身份任职的人，因此公开可见的创始人市场契合度和关键人物依赖集中在单一高管身上。Ough 此前联合创办北美移动天然气基础设施公司 Certarus Ltd.，并任职于
              Macquarie Capital 的 Global Energy Investment Banking 团队；他获评 EY Entrepreneur Of The Year 2025 Gulf South
              Award，第三方奖项对这段履历给出了独立背书。Ough 之下，VoltaGrid 披露了一套职能完整的高管班子：Chris Atchley（EVP）、Micah Foster（CFO）、Les
              Wise（COO）、Daniel Ro-Trock（首席法务官）、Luke Saladyga（CTO）和 Kate
              Saltzman（首席行政官），另有覆盖数据中心开发、销售、工程、HSQ&ED、人力运营和总法律顾问的管理层。治理层面披露的董事会有三名成员：董事长 Doug Wonnacott（35 年化工行业高管、前
              Canexus 总裁 / CEO）、Tyson Birchall（长期投资方 Longbow Capital 的 Managing Director）以及 Eric Carre（Halliburton EVP &
              CFO，在 Halliburton 2026 年 5 月战略投资后加入董事会），董事会构成与 VoltaGrid 的投资方基础直接绑定。
