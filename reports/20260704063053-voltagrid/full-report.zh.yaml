      - number: '6.3'
        title: 具名客户证据：生产、试点与在建状态
        blocks:
          - type: paragraph
            body: >-
              区分生产状态和试点状态，是看 VoltaGrid 客户基础最重要的尽调镜头，因为 logo 本身会把真实部署程度相差很大的项目混在一起。Oracle Cloud Infrastructure 的 2.3 GW
              合同和 Vantage Data Centers 的 1+ GW 合同都是真实、具名且有公开引述的承诺，但截至 2026 年 7 月研究日期，两者都仍处于已签约 / 执行阶段，而不是全面上线 (CU011,
              CU012)。相比之下，VoltaGrid 的移动发电机从 2024 年年中左右开始，帮助 xAI 在约 122 天内撑起 Memphis Colossus 数据中心，这是组合中最清晰、已全面运营且有独立报道的
              AI 数据中心部署 (CU013)。油田细分市场提供了 VoltaGrid 持续时间最长的具名在线关系：Aethon Energy 的 Haynesville 电动压裂作业使用 Halliburton Zeus
              e-pump 和 VoltaGrid 电力，自 2021 年宣布跨多年合同以来一直运行；Chesapeake Energy 的 Marcellus e-frac
              作业也在同一行业报道中被列为第二个在线账户，尽管两者都未披露已部署 MW (CU014, CU015)。Serverfarm 的 Covington, Georgia 站点则位于成熟度光谱另一端：截至 2026
              年 7 月，计划建设的 33 台燃气发动机只安装了 8 台，州级最终空气许可尚未发放。因此，尽管该项目与 VoltaGrid 最大合同并列被公开具名，它仍是试点 / 在建项目，而非生产部署
              (CU016)。VoltaGrid 自己的案例研究记录了一个美国西南部数据中心 CNG 转换项目和一个 Gulf Coast
              公用事业风暴恢复微电网；按公司表述，两者都是真实、已确认部署，但仍匿名，因此无法被独立验证 (CU017, CU018)。
            claimRefs:
