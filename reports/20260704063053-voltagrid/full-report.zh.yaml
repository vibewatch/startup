      - number: '6.2'
        title: 采用轨迹：签约积压 vs. 已交付容量
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid 已披露的采用轨迹，更适合解读为订单簿增长，而不是使用量增长，因为公司不发布已部署 MW、活跃账户或利用率数据。独立行业分析显示，截至 2025 年 10 月 Oracle
              公告时，VoltaGrid 累计签约表后容量已超过 4,350 MW；而仅八个月前的 2025 年 2 月，公司才签下 Vantage 的 1+ GW 承诺 (CU006)。Oracle
              合同本身说明了签约与交付之间的差距：合同于 2025 年 10 月 15 日宣布，首批机组目标约在 2026 年 4 月交付，完整 2.3 GW 建设分阶段延续到 2028
              年，这是跨多年的交付曲线，而不是立即上线 (CU007)。VoltaGrid 的 EY Entrepreneur of the Year
              表彰另称，公司自成立以来规模“增长六倍”，但这个叙事数字没有披露收入、客户数或 MW 分母 (CU008)。独立报道也显示，外部验证有现实限制：Data Center Dynamics 表示，它曾联系
              VoltaGrid 确认 Vantage 站点将由哪条具体产品线（QPac 或其他）供电，但截至发稿仍未收到确认答复 (CU009)。在没有披露客户名册的情况下，唯一可见的采用代理，是 INNIO 和 ABB
              的重复 OEM 订单增长，以及 Vantage 自身披露其另行运营 1,263 MW 美国数据中心容量；后者提供了一个独立规模标尺，可用来衡量 VoltaGrid 的 >1 GW 承诺 (CU010,
              CU041)。Oracle 关联的 Texas 站点还绑定 Project Stargate，即 2025 年 1 月宣布的 OpenAI/SoftBank/Oracle AI 基础设施联盟，这意味着
              VoltaGrid 最大合同背后的终端需求信号，来自一个多方项目，而不只是 Oracle 单独需求 (CU042)。
