      - number: '7.4'
        title: 伙伴与依赖风险：OEM、燃料供应和 Halliburton 关系
        blocks:
          - type: paragraph
            body: >-
              INNIO Jenbacher 是 VoltaGrid 唯一披露的往复式发动机 OEM；INNIO 自己的新闻稿称，VoltaGrid 2025 年 10 月的 92 台、2.3 GW 订单，是 INNIO
              公司历史上按供电规模计最大的订单——这把 VoltaGrid 7.5 GW 订单簿中接近三分之一集中到单一供应商的生产排期上 (CR027)。ABB 同样是 StabilAI 层背后唯一披露的自动化和电网稳定
              OEM (CR028)；独立行业报道确认，Energy Transfer 是 VoltaGrid 旗舰 Oracle Texas 机组唯一具名的天然气管道交易对手 (CR029)。不过，结构上最不寻常的依赖是
              Halliburton：它同时持有 2026 年 5 月的股权权益、2025 年 12 月的 400 MW Eastern Hemisphere 电力承诺，以及可追溯到 2024 年的跨多年 Aethon
              Energy 电动压裂合同 (CR030, CR033)。VoltaGrid 自己的董事会页面确认，两名 Halliburton 高管——CFO Eric Carre 和 Treasurer Tim
              McKeon——都担任 VoltaGrid 董事 (CR031)；考虑到 Halliburton 相关的资本、供应或定价条款并不会由完全独立的董事会审查，这种集中带来治理和关联交易风险
              (CR032)。需求侧，Oracle 和 Vantage Data Centers 是 VoltaGrid 两个主要具名 GW 级客户，任一账户取消或延迟合同，都会实质影响积压订单转化 (CR020)。最后，CB
              Insights 和 InforCapital 都只能把 VoltaGrid 作为部分披露的私人公司追踪，因此独立分析师无法用第三方数据完整验证 VoltaGrid 自己面向投资人的收入或客户数声明
              (CR035)。集中度和交易对手敞口图 (FR003) 展示了这些依赖如何汇聚到平台上。
