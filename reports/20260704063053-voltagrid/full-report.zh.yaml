  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价机制与收入结构
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid
              将表后（BTM）天然气发电视为长期、基于容量的服务来变现，而不是一次性设备销售或现货定价商品：公司在与数据中心、工业及油气客户签订的多年协议下部署、持有并运营模块化往复式发动机电厂（CI001、CI002）。最清晰的收入结构证据不是已发布的垂直行业拆分，而是少数具名的吉瓦级合同——由
              Energy Transfer 天然气供应的 2.3 GW Oracle Cloud Infrastructure 部署（CI003）、1+ GW Vantage Data Centers
              多站点合作（CI004），以及 2025 年 10 月与 Halliburton 达成、目标为中东首批落地的合作，该合作把 VoltaGrid 的收入地域延伸到北美之外（CI005）。但留存来源均未披露
              VoltaGrid 特定的每 MW-month 或每 MWh 合同价格，因此广泛流传的 BTM 天然气电力 $70-100/MWh 行业基准，无法与 VoltaGrid 实际交易核对（CI006）；OEM
              合作伙伴 ABB 和 INNIO 同样只披露订单范围（35 台同步调相机；300 台 Jenbacher 发动机，合计 1.5 GW），不披露价格（CI007、CI008）。VoltaGrid 的收入取决于
              2026-2030 年间把订单簿转化为已计费、已通电容量，而不是即时现货计费，因此收入确认本身依赖执行（CI009）。
