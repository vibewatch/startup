  - id: FR003
    title: 集中度与交易对手敞口图
    type: dag
    layout: wide
    summary: VoltaGrid 的执行依赖少数高度集中的交易对手——两家 OEM、一家具名燃气管道伙伴、一家多重角色投资者、两个锚定客户、 两个活跃监管方和一个贷款银团。
    data:
      nodes:
        - id: vg
          label: VoltaGrid
          detail: 表后 QPac/StabilAI 平台，执行 7.5 GW 订单簿。
          tone: neutral
        - id: innio
          label: INNIO Jenbacher
          detail: 唯一往复式发动机 OEM；单笔 2.3 GW 订单是 INNIO 史上最大订单。
          tone: warning
        - id: abb
          label: ABB
          detail: StabilAI 唯一同步调相机 / eHouse OEM。
          tone: warning
        - id: et
          label: Energy Transfer
          detail: Oracle Texas 机群唯一具名燃气管道供应商。
          tone: warning
        - id: hal
          label: Halliburton
          detail: 同时是股权投资者、拥有两个董事会席位、400 MW 伙伴，并是 Aethon E-frac 伙伴。
          tone: negative
        - id: lenders
          label: Goldman Sachs / JPMorgan 贷款人银团
          detail: $5.0B 优先票据和 ABL 融资安排于 2025 年 11 月完成。
          tone: neutral
        - id: gaepd
          label: Georgia EPD
          detail: Covington 站点有待处理的 Clean Air Act 执法请求。
          tone: negative
        - id: tceq
          label: TCEQ
          detail: ABI-1 Texas 扩建的重大排放源许可审查待定。
          tone: negative
        - id: oracle
          label: Oracle
          detail: 锚定数据中心客户，已签约 2.3 GW。
          tone: warning
        - id: vantage
          label: Vantage Data Centers
          detail: 锚定数据中心客户，已签约 1+ GW。
          tone: warning
      edges:
        - from: innio
          to: vg
          label: 发动机供应集中
        - from: abb
          to: vg
          label: 自动化供应集中
        - from: et
          to: vg
          label: 燃料供应集中
        - from: hal
          to: vg
          label: 股权 + 董事会 + 运营伙伴
        - from: lenders
          to: vg
          label: $5.0B 担保融资
        - from: gaepd
          to: vg
          label: 活跃执法请求
        - from: tceq
          to: vg
          label: 待定重大排放源许可
        - from: vg
          to: oracle
          label: 最大具名合同
        - from: vg
          to: vantage
          label: 第二大具名合同
        - from: hal
          to: oracle
          label: 未披露重叠
    approximationNotes: 这张图把交易对手集中和监管敞口作为独立风险视角拆出；它不是对本报告其他位置产品架构依赖图的复述。
    claimRefs:
      - CR027
      - CR028
      - CR029
      - CR030
      - CR031
      - CR001
      - CR009
  - id: FV001
    title: 建议逻辑链
    type: flow
    layout: standard
    summary: 规模、验证、资方背书和风险如何共同支撑估值判断与最终建议。
    data:
      nodes:
        - id: scale
          label: 规模：约 7.5 GW 订单簿 / 到 2028 年约 4.3 GW 已签约
        - id: proof
          label: 验证：Oracle、Vantage 已生效合同；据报道 Oracle 单站点付款 >$1B/年
        - id: sponsors
          label: 资方背书：Blackstone、Halliburton、CPP Investments
        - id: risk
          label: 风险：GA/TX 执法、杠杆、客户集中、无审计财务
        - id: valuation
          label: 估值：>$10B 估值标记意味着股权 / 2028E EBITDA 约 9x（远期 EV/EBITDA 约 13-14x）
        - id: recommendation
          label: 建议：观察 —— 待审计财务和 EPD 结果明确后重新做投资测算
      edges:
        - from: scale
          to: valuation
        - from: proof
          to: valuation
        - from: sponsors
          to: valuation
        - from: risk
          to: recommendation
        - from: valuation
          to: recommendation
    approximationNotes: 定性逻辑链，不是加权评分模型。
    claimRefs:
      - CV010
      - CV007
      - CV001
      - CV037
      - CV032
      - CV049
  - id: FV002
    title: 远期 EV/EBITDA 倍数的估值敏感性
    type: bar
    layout: standard
    summary: 在可比倍数区间内，以 $1.1B 2028E EBITDA 目标推算的企业价值（$B）。
    data:
      items:
        - label: 8x 倍数
          value: 8.8
        - label: 10x 倍数（类似 Vistra）
          value: 11
        - label: 12x 倍数
          value: 13.2
        - label: 14x 倍数（>$10B 融资隐含）
          value: 15.4
        - label: 18x 倍数（类似 Cummins/Generac）
          value: 19.8
        - label: 23x 倍数（类似 NRG）
          value: 25.3
    approximationNotes: 企业价值 = 倍数 x $1.1B 2028E EBITDA 目标；该目标本身未经审计，来自公司 / Fitch，因此所有输出都是示意性敏感性，不是预测。
    claimRefs:
      - CV032
      - CV033
      - CV021
      - CV023
      - CV028
      - CV030
  - id: FV003
    title: 按情景划分的估值 / 回报区间
    type: range
    layout: standard
    summary: 悲观、基准和乐观情景下的隐含股权价值（$B）低高区间，并与 2026 年 5 月进入估值标记对比。
    data:
      items:
        - label: 悲观情景 2028 年股权价值
          low: 5
          high: 8
        - label: 基准情景 2028 年股权价值
          low: 9
          high: 13
        - label: 乐观情景 2028 年股权价值
          low: 16
          high: 22
        - label: 2026 年 5 月进入估值标记（参考）
          low: 10
          high: 10
    approximationNotes: 区间是作者基于 TV003 情景假设和 TV004 可比倍数区间推导的估计，不是正式 DCF 输出。
    claimRefs:
      - CV002
      - CV032
      - CV033
  - id: FV004
    title: 投资 KPI 记分卡
    type: kpi
    layout: standard
    summary: 面向 IC 的 0-10 评分，覆盖市场、验证、护城河、经济性、风险、估值进入点和证据质量。
    data:
      items:
        - label: 市场时点 / 需求
          value: 8
          note: AI 数据中心电力短缺真实且证据充分，但存在周期性风险
        - label: 商业验证
          value: 7
          note: Oracle/Vantage 合同以及据报道单站点付款 >$1B/年，信号很强，但集中度高
        - label: 竞争护城河
          value: 5
          note: QPac/StabilAI 在部署速度上有差异化，但 INNIO/ABB OEM 依赖限制防御性
        - label: 单位经济 / 毛利可见度
          value: 3
          note: 没有审计后的收入、EBITDA 或毛利率披露
        - label: 财务风险 / 杠杆
          value: 4
          note: 约 $5.5B 有担保债务对应一个未经审计的 EBITDA 基数
        - label: 监管 / 法律风险
          value: 3
          note: Georgia 有活跃执法请求，Texas 有待定许可审查
        - label: 证据质量
          value: 4
          note: 估值计算建立在公司指引、Fitch 来源的预测上，而不是审计文件
    approximationNotes: 评分是作者基于本章证据校准后的判断，不是第三方或模型生成评级。
    claimRefs:
      - CV010
      - CV007
      - CV044
      - CV011
      - CV003
      - CV037
      - CV008
