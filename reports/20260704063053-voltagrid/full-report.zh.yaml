      - number: '4.3'
        title: 成本结构、毛利率驱动与资本密集度
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid 的成本结构正在转向垂直整合：待完成的长期供应商 Propell Energy Technology 收购，将把约 1,000
              名美国和加拿大制造员工纳入内部，目的在于降低订单簿执行中的供应链风险，而不是披露具体单位成本节省（CI016）；同时，位于 Granbury, Texas 的两座新自动化工厂目标是合计约 300
              MW/月的往复式发动机和燃气轮机产出（CI017）。留存来源均未披露 VoltaGrid 的收入成本、毛利率或单项目单位经济性（CI018）。公开可比公司文件提供了最佳可得基准：Generac FY2025
              Form 10-K 报告毛利率 38.3%，总 Adjusted EBITDA 为 $715.5 million（约占净销售额 17.0%）（CI019）；Bloom Energy FY2025 10-K
              显示总收入增长 37.3% 至约 $2.02 billion，毛利率接近 29%（CI020）；Cummins Power Systems 板块 FY2025 销售额在数据中心驱动的发电需求下增长
              16%（CI021）；Caterpillar Power & Energy 板块报告 2025 年大型往复式发动机销售增长“主要来自数据中心应用”（CI022）。合在一起，这些数据提示，规模化发电业务可能落在
              17-38% 毛利 / EBITDA 利润率区间（CI023），但没有来源披露 VoltaGrid 是否对天然气燃料成本套保，因此利润率对天然气价格波动的敞口无法在任一方向确认（CI024）。2026 年 6
              月针对 VoltaGrid 位于 Covington, Georgia 场地的 Clean Air Act 执法请求，又在这种不透明度之上增加了无法量化的改造、罚款或停运成本风险（CI025、CI026）。
