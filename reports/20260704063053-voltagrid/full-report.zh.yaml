      - number: '6.4'
        title: 留存、耐久性与满意度缺口
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid 未披露任何客户细分的净收入留存率、总收入留存率或流失率，本轮研究也未找到能补上这一缺口的证据 (CU019)。目前最好的耐久性代理是反面证据：Aethon Energy 关系自 2021
              年合同以来持续存在，期间没有公开报道续约或终止公告；这与跨多年耐久性相符，但不能证明它 (CU020)。VoltaGrid 与 Oracle 和 Vantage 的数据中心合同，在公司材料中被描述为跨多年的
              Power Delivery Agreement，但两家公司都未披露合同期限、最低量承诺、终止权或定价；即便最大具名合同，其耐久性也无法通过公开来源验证 (CU021)。在 G2、Capterra、Gartner
              Peer Insights 或类似平台上，未找到第三方客户评价、满意度评分或净推荐值（NPS）；对于工业基础设施提供商，这个缺口并不意外，但仍意味着完全没有独立满意度信号
              (CU022)。本轮研究找到的唯一量化客户结果，是 VoltaGrid 匿名 Southwest 数据中心案例研究中提到，相比柴油发电机节省 $38 million
              成本——这是一个真实结果指标，但只是孤立案例，不是覆盖客户基础的可重复、经审计基准 (CU023)。
            claimRefs:
              - CU019
              - CU020
              - CU021
              - CU022
              - CU023
