            body: >-
              VoltaGrid 没有披露任何细分市场的流失或留存指标，两大数据中心合同合计规模远超其他所有具名账户，最新客户站点又面临活跃的 Clean Air Act
              执法请求——这意味着客户基础的耐久性、集中度和监管风险同时未解决。
