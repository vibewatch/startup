      - number: '2.3'
        title: 价值链中的买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              五类不同细分会购买、使用或支付燃气表后电力，其预算归属和采用触发因素差异明显（表 TM003、图 FM003）。超大规模云 / AI 运营商是最常被引用的吉瓦级合同客户——Barclays 分析师特别把
              VoltaGrid 的 2.3 GW Oracle 协议列为开发商通过自身基础设施和能源采购团队直接付款、绕过多年电网互联延迟的代表案例。Vantage Data Centers
              等托管和多租户开发商构成第二类，它们代表租户采购 BTM 电力，在多站点组合中降低预租交付日期风险；这条资本预算路径不同于通常自建、自融资园区的超大规模云厂商。AI 原生基础设施业主运营商（xAI、Crusoe
              以及与 OpenAI/Stargate 相关的开发商）构成第三类，其定义特征是 AI 训练竞赛受到算力约束后，对通电速度极端紧迫。第四类是公用事业公司和独立发电商，例如 NRG Energy（正以约 $12
              billion 收购 LS Power 的 13 GW 燃气资产组合和 6 GW 虚拟电厂平台），它们并未让出这一细分，而是与 BTM
              进入者争夺同一批大型负载超大规模云合同。跨这些细分看，法律评论显示，电力供应商通常保留发电资产本身的资本预算所有权和运营风险，而数据中心客户通常在合同中承担限电和可靠性风险——尽调应逐笔确认这种分配，而不是假设其在所有交易中一致。
            claimRefs:
              - CM039
