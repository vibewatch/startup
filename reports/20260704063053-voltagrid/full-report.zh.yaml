      - number: '2.6'
        title: 尽调缺口、相互矛盾的估算与仍未解决的问题
        blocks:
          - type: paragraph
            body: >-
              三个问题是真正未解决，而不只是细节不足；本章把它们保留为开放缺口，而不是强行给出单一答案。第一，留存来源没有披露 VoltaGrid 实际每 MWh 或每 MW-month 合同价格，因此广泛流传的
              $70-100/MWh 行业区间无法与 VoltaGrid 和 Oracle、Vantage、xAI 或 Halliburton Eastern Hemisphere 承诺的具体交易对照验证；这阻断了从披露的
              7.2 GW 管线出发自下而上估算收入。第二，表 TM002 中每一种分析师规模测算口径都把备用和主用电力混在一起，也把柴油和天然气混在一起，因此没有发布方拆出 $8-20 billion
              发电机市场估算中归属于模块化 BTM 天然气主用电力的具体份额；若把混合总额用作 VoltaGrid 的可服务市场，会高估真实机会，而 Grand View Research 与 Arizton 2030
              年数字之间超过 50% 的差距（图 FM002）在此被保留为真实矛盾，而不是用平均值抹平。第三，ERCOT、MISO 或 SPP 最终是否会仿照 FERC 仅针对 PJM 的共址和 BTM
              净额结算修订，仍未解决；若仿照，VoltaGrid 核心 Texas 市场最终也可能面对目前只限于 PJM 区域的同类约束。这三个缺口都在 localEvidence.evidenceGaps
              中记录了具体尽调路径，而不是用编造数字关闭，符合本章在证据约束下处理规模测算和采用分析的方法。
            claimRefs:
              - CM020
              - CM024
              - CM030
