      - number: '2.4'
        title: 增长驱动：电网错配、部署速度与超大规模云资本开支
        blocks:
          - type: paragraph
            body: >-
              BTM 天然气采用背后的结构性驱动，是数据中心建设时间表和电网交付时间表之间的错配持续扩大。Lawrence Berkeley National Laboratory 发现，截至 2025
              年底，美国互联队列中有超过 2,060 GW 发电和储能容量——约为美国总装机容量的两倍——且多数排队项目最终会撤回，真正推进的项目平均达到商业运营也更慢。咨询机构评论称 PJM
              队列等待时间最长可达八年，datacenterHawk 引用美国市场普遍 3 至 7 年的互联周期，而典型数据中心建设周期仅 18 至 24
              个月。在这一背景下，模块化天然气往复式发动机和固体氧化物燃料电池都可在约 90 天到约 12 个月内部署；多个来源将这种速度优势列为 BTM 买方相对新输电、燃气调峰电厂或核能小型模块化反应堆等 3 至 15
              年周期方案的首要采购标准。需求侧资本进一步强化了这一驱动：五大科技公司资本开支在 2025 年超过 $400 billion，预计 2026 年再增长 75%；仅 2025 年，北美数据中心容量吸纳量就接近
              15,600 MW——超过十年前吸纳量的 130 倍。Cleanview 跟踪器显示，Meta、Microsoft、Amazon 和 Oracle
              都在直接或通过合作伙伴推进表后项目，表明驱动因素覆盖多家超大规模云厂商，而非集中在单一买方。
            claimRefs:
              - CM036
              - CM037
              - CM008
              - CM009
              - CM014
              - CM002
              - CM038
      - number: '2.5'
        title: 采用约束：监管、许可与电网规则
        blocks:
          - type: paragraph
            body: >-
              监管和许可风险是上述增长驱动最清晰的制衡因素，并且在 VoltaGrid 布局内并不均匀（表 TM004）。2025 年 12 月 18 日，FERC 裁定 PJM
              现有共址和表后电价规则“不公正且不合理”，并要求全面修订；PJM 于 2026 年 2 月回应，提议把 BTM 负载净额结算优惠限制在 50 MW
              门槛内，并在三年内分阶段实施，意味着超过该规模的新安排将失去当前可抵消输电成本的净额结算优惠。这项修订仅适用于 13 州 PJM 区域，不直接管辖 VoltaGrid 当前位于 ERCOT 区域的 Texas
              部署，但它有可能预示其他电网运营商会采用类似规则。Texas Senate Bill 6 另行对接入 ERCOT、超过 75 MW 的大型负载施加新的灵活性和需求响应参与要求，这是 VoltaGrid
              核心市场内另一项州层面约束。许可风险不是理论问题，而是已经具体化：xAI 在 Memphis Colossus 场地运行至少 35 台甲烷燃气轮机却未取得所需联邦空气许可，潜在 NOx 排放超过每年 2,000
              tons，促使 Southern Environmental Law Center 代表 NAACP 发出 Clean Air Act 执法通知；这一先例与任何采用类似场地开发速度的燃气 BTM
              运营商相关。反方向上，美国 EPA 在 2026 年中提议放宽建设许可规则，允许非污染性施工在空气排放许可发放前启动；若最终落地，可能缩短时间线。与此同时，倡议组织继续主张，以甲烷为重的 BTM
              建设会削弱超大规模云厂商的气候承诺，并在需求预测被高估时带来资产搁浅风险。
            claimRefs:
