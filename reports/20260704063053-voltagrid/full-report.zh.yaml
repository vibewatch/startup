      - number: '7.3'
        title: 运营、制造与质量风险
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid 2026 年 5 月收购 Propell Energy Technology，公司明确称这是为了把制造纳入内部，并把 Granbury, Texas 产量扩到约每月 300 MW，从而降低
              7.5 GW 订单簿的执行风险 (CR019)。但一份独立估值风险分析指出，支撑该目标的两座下一代自动化工厂在公告时尚未建成，因此这段爬坡更像愿景，而不是已证明能力
              (CR020)。同一垂直整合动作，也把已披露的往复式发动机制造主要集中在一个 Texas 地点；对于一家正在执行多 GW、跨多年积压订单的公司，这形成单站点运营风险 (CR021)。AInvest
              将其估值描述为“按完美执行定价”，对取消、价格滑坡或爬坡延误几乎没有容错 (CR022)。产品侧，本章审阅的来源中，没有任何独立第三方审计数据支持 VoltaGrid 营销的可靠性（高于 99.9%
              正常运行时间）或减排（28-40% GHG 减少）数字；所有性能声明都追溯到公司或 OEM 伙伴材料 (CR023, CR024)。EPA 关闭移动 non-road-engine 豁免，又叠加 Georgia
              和 Texas 的活跃许可争议，说明 VoltaGrid 用来加速站点建设的小型污染源和 non-road 路径正受到更强监管审视；未来站点面对成本更高、速度更慢的大型污染源审查的概率上升
              (CR025)。最后，VoltaGrid 油田或数据中心现场劳动力的 OSHA 事故率、安全处罚或工会状态数据均未公开；对一个快速扩张的运营体系来说，劳工和工作场所安全敞口实际上没有文档可查 (CR026)。
            claimRefs:
