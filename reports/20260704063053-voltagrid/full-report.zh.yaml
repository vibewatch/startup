      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景下，7.5 GW 订单储备按期转化，Propell 驱动的 Granbury 制造爬坡达到 ~300 MW/月目标，2028 年 EBITDA 达到或超过 $1.1 billion
              目标，倍数向设备可比公司的溢价重估（18-20x 远期 EV/EBITDA），对应 2028 年企业价值接近 $18-22 billion——约为 2026 年 5
              月估值标记的两倍。基准情景假设执行小幅延误，Propell 整合和许可摩擦带来成本压力，2028 年 EBITDA 落在 $700 million 到 $1.0 billion 之间，倍数维持在 2026 年 5
              月融资已隐含的 ~13-14x 附近，企业价值大致持平到小幅上升；这与 AInvest 的说法一致，即估值已经“按完美执行定价”，而不是为超预期上行定价。悲观情景把 Georgia 和 / 或 Texas
              执法结果升级、未披露套保下天然气价格飙升、以及 Oracle/Vantage 集中客户基础放缓或重新定价放在一起，2028 年 EBITDA 被压到 $500-700 million，倍数向 Vistra/NRG
              类似的 9-11x 收缩，企业价值接近 $5-8 billion；相比今天估值标记下调，也会挤压约 $5.5 billion
              有担保杠杆的债务偿付能力。公开证据无法给三个情景分配精确概率；基准情景被视作众数结果，因为它需要同时发生的负面事件最少。
