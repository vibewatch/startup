              - CU022
              - CU023
      - number: '6.5'
        title: 扩张循环：OEM 订单增长与垂直整合
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid 的扩张动作，与典型软件公司的“先落地再扩张”循环结构不同：扩张不是发生在现有账户内的增购，而是体现为向硬件 OEM 重复下单，以及在固定的具名客户胜利之上叠加垂直整合并购。ABB 与
              VoltaGrid 的订单簿，从 2025 年最初的同步调相机合作，增长到 2026 年 3 月 CERAWeek 宣布的额外 35 台订单；INNIO 也公开称其 VoltaGrid 订单是 INNIO
              公司历史上最大订单，几个月后又追加 1.5 GW 订单 (CU024, CU027)。2026 年 5 月，VoltaGrid 宣布收购制造商 Propell Energy Technologies；CEO
              Nathan Ough 将该交易描述为延展“已经验证的工程和集成能力”，以支持持续规模化。这个扩张动作的目的，是更快把积压订单转成已交付 MW，而不是赢下新的具名账户 (CU025)。Propell 位于
              Granbury, Texas 的工厂正扩张到约每月 300 MW 产能；收购还新增 British Columbia Rosedale 和 Alberta Calgary 的制造与工程业务，使
              VoltaGrid 在本轮审阅来源中首次把工业足迹延伸到 Canada (CU026, CU039)。这些扩张信号都不是典型净收入留存率会捕捉的那种使用量驱动或客户发起；它们是供给侧动作，提高 VoltaGrid
              履行既有合同的能力。
            claimRefs:
              - CU024
              - CU025
              - CU026
              - CU027
              - CU039
      - number: '6.6'
        title: 集中度与渠道依赖
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid 公开披露的两大数据中心承诺——Oracle（2.3 GW）和 Vantage（1+ GW）——合计签约容量超过其他所有具名客户之和；任何一段关系的流失、延误或重谈，都会实质改变公司的增长叙事
              (CU028)。客户侧集中之上，又叠加了匹配的上游集中：VoltaGrid 几乎所有数据中心合同都依赖两家硬件 OEM 履行，INNIO 供应往复式发动机，ABB 供应同步调相机；任一供应商短缺，都会直接限制向
              Oracle、Vantage 或其他客户交付 (CU029)。Oracle Texas 机组还依赖单一具名天然气管道合作方 Energy Transfer 提供确定性燃料供应；mgrid.org
              的独立分析明确称，这种离网设计为该站点制造了“单一供应商可靠性依赖，一旦 VoltaGrid 运营故障，该站点没有公用电网备份” (CU030, CU043)。Halliburton
              又增加了一层更不寻常的集中：它同时是 Aethon e-frac 合同和 Eastern Hemisphere 400 MW 承诺的运营伙伴，并且自 2026 年 5
              月起成为战略股权投资方和董事会成员；这种双重角色混合了商业交易对手和治理监督利益 (CU031)。没有找到任何公开采购或竞争性招标记录，显示 VoltaGrid 通过正式 RFP
              流程赢得业务；审阅来源中披露的每一段客户关系，都来自直接商业谈判或联合公告合作。由于 VoltaGrid 仍是没有 SEC 文件的私人公司，本章每个规模数字都来自公司、合作伙伴或行业媒体披露，而不是经审计文件
              (CU032, CU040)。
