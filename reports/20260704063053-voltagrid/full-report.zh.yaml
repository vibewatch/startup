      - number: '8.7'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              从叙事上看，VoltaGrid 已接近退出准备状态：截至 2026 年 2 月，据报道管理层和现有投资人同时在评估 IPO 与私募股权出售；可比的 ERock IPO
              备案也显示，这种商业模式存在可行的近期上市路径。但从治理和披露角度看，退出准备度仍未证实，因为没有公开来源描述 VoltaGrid
              的审计历史、内控成熟度或可用于注册申报的财务报表。在投入任何新资本或追加现有仓位之前，应完成七项尽调：经审计的 2025 年收入和 EBITDA；Propell Energy 收购价；Series D
              股权结构表和清算优先权条款；天然气套保或燃料转嫁政策；Georgia EPD 和 Texas TCEQ 执法解决结果；独立印证据称 Oracle 单一场址每年支付超过 $1 billion
              的说法，目前该说法仅来自 Bloomberg；以及客户级收入集中度拆分，而不是当前可用的 GW 占比代理指标。哪怕只完成这份清单的一半，也会让本章置信度从中显著接近高，无论结论方向如何。
