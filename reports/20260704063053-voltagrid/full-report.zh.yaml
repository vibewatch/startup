            body: >-
              下表按照规模、融资、目标细分、差异化和局限性刻画 VoltaGrid 最相关的对照公司，每一项都锚定在 2025-2026 年的公司披露或独立报告中。Enchanted Rock/ERock 已提交美国 IPO
              文件，目标估值约 $5 billion，并披露约 400 个站点、$1.3 billion 签约积压订单；其 “Resiliency-as-a-Service”
              计费模式免除了客户前期资本开支，但单站规模上限远低于 VoltaGrid 的 20-200+ MW 区块。Bloom Energy 的燃料电池积压订单约 $20 billion，2025 年收入 $2.02
              billion（增长 37.3%），并由 Brookfield 最高 $5 billion
              承诺支撑；其差异化在于燃料灵活性和更安静、无燃烧的占地形态，代价是相较往复式发动机的成本和功率密度劣势。Caterpillar Power Generation 板块销售额在 2025 年第四季度增长
              44%，公司整体积压订单为 $51 billion（增长 71%）；Cummins 则在 Power Systems 创纪录表现背后上调 2026 年收入指引 8-11%——两者仍是设备销售商，而非 BTM
              运营商。NRG 以约 $12 billion 收购 LS Power 的 13 GW 燃气资产组合和 6 GW CPower 虚拟电厂平台后，容量翻倍至 25 GW；Vistra 与 AWS、Meta 签署的
              20 年核能 PPA 则提供并网、长周期替代方案。Crusoe（估值约 $10 billion、已签约 AI 基础设施容量约 5 GW）和 CloudBurst（1.2 GW 自采 BTM
              天然气园区）展示了垂直整合和自建路径，完全绕过第三方供应商。
