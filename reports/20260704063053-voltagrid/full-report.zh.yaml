  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: VoltaGrid 平台把燃料供应、主供发电、电网稳定、AI 调度、远程运营和选址许可叠成一个操作系统。
    data:
      layers:
        - label: 燃料供应与处理
          detail: 管道燃气（如 Oracle Texas 机组的 Energy Transfer 供应）、CNG/LNG 卡车运输，以及正在申请专利的移动制冷 / 增压压缩单元，把现场燃气处理到可供发电机使用的规格。
          items:
            - label: Energy Transfer 管道供应
              detail: 为 Oracle Texas 部署提供稳定天然气供应。
            - label: 移动制冷单元（MRU）
              detail: 正在申请专利的单拖车处理设备，最高 4.2 MMSCF/day。
        - label: 主供发电（QPac）
          detail: 模块化 INNIO Jenbacher 往复式发动机节点，每个最高 20-25 MW，可在一个小源空气许可下组合到每场址 200 MW。
          items:
            - label: QPac 节点
              detail: 20-25 MW 往复式发动机单元。
            - label: 多节点场址
              detail: 在一个许可下最高合计 200 MW。
        - label: 电网稳定（StabilAI / ABB）
          detail: ABB 同步调相机配飞轮，再加预制 eHouse，在没有电池的情况下，把 AI 负载瞬变的电压 / 频率波动压在 +/-5%/+/-2% 以内。
          items:
            - label: 同步调相机
              detail: 初始 27 台，另有 35 台在 CERAWeek 2026 达成协议。
        - label: AI 监测与调度（Access Innovation Portal）
          detail: 近实时查看需求、排放和计费，并用 AI 驱动负载预测与调度。
          items:
            - label: 调度软件
              detail: 内部软件团队；未发现公开技术文档。
        - label: 指挥中心与现场运营
          detail: 现场指挥中心加 24/7 远程运营中心（ROC），跨机组监测电厂健康状况和调度。
        - label: 场址、许可与互联
          detail: 表后选址、小源空气许可，以及可选并网并行互联（如 ERCOT）；一个场址（Covington, GA）面临正在进行的许可执法争议。
