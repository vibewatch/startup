      - number: '6.7'
        title: 客户站点的反向和监管信号
        blocks:
          - type: paragraph
            body: >-
              本章最清晰的反向信号，出现在 VoltaGrid 最新的具名数据中心站点。2026 年 6 月，Southern Environmental Law Center、Sustainable Newton 和
              Altamaha Riverkeeper 提交执法请求，称 VoltaGrid 在 Covington, Georgia 的 Serverfarm 站点尚未取得 Georgia 法律要求的 Clean Air
              Act 开工前许可，就已经开始建设计划中 33 台甲烷燃气发动机里的 8 台 (CU033)。同一文件还称，Serverfarm 作为 VoltaGrid 在该站点的客户，另行安装了 37 台柴油备用发电机中的
              36 台，同样没有许可；这意味着合规风险延伸到客户自有基础设施，而不只限于 VoltaGrid 的发电资产 (CU034)。Atlanta Journal-Constitution 的报道加入了独立专家反驳：一位
              Georgia Tech 工程教授质疑 VoltaGrid “环境友好”的营销表述，Southern Environmental Law Center 律师则提出，靠近居民区、水库和自然保护区的
              NOx、甲醛和颗粒物排放会带来当地空气质量担忧 (CU035)。截至 2026 年 7 月研究日期，Georgia Environmental Protection Division
              已确认会调查这些指控，但既未发放最终许可，也未下达停工令，VoltaGrid 客户站点的最终合规结果仍未解决 (CU036)。Sustainable Newton
              创始人发表第一人称叙述，称从公共道路上可以看到排气烟囱，并警告在 AI 驱动的数据中心建设中“钱不是问题，偷工减料司空见惯”；这是一种尖锐的反向表述，直接点名 VoltaGrid 及其客户 Serverfarm
              (CU037)。另一篇无关的 2025 年 Forbes 报道，则把 VoltaGrid 包括 xAI 在内的移动涡轮部署总体描述为“又快又脏”的权宜之计，而不是耐久的生产方案；这是对部署质量的反向定性，早于
              Georgia 争议，也独立于该争议 (CU038)。相比之下，没有找到 VoltaGrid 在 Haynesville 或 Marcellus 盆地油田 e-frac
              站点的反向或投诉记录；Texas/Tennessee 站点只涉及此前已解决的 xAI non-road-engine
              豁免问题，而不是活跃执法文件。因此，合规风险集中在最新、成熟度最低的客户站点，而不是均匀分布在客户基础中 (CU046)。
            claimRefs:
              - CU033
              - CU034
              - CU035
              - CU036
              - CU037
              - CU038
              - CU046
