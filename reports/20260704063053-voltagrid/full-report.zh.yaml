    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部、创立时间与一句话商业模式
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid LLC 在自有网站和独立融资报道中都把自己定位为领先的模块化表后（BTM）天然气电力解决方案提供商，服务超大规模数据中心、工业场地和能源行业，总部位于 10800 Telge Road,
              Houston, Texas 77095。公司自有材料把创立时间写为 2020 年，当时开始为电动水力压裂（e-frac）、远程采矿以及公用事业 / 分布式发电客户部署交钥匙天然气微电网；EY
              Entrepreneur of the Year 材料和 POWER magazine 的行业报道均独立佐证了 2020 年创立时间，但一则 S&P Global Commodity Insights
              播客说明却提到 VoltaGrid “自 2021 年创立以来”的容量，这是一个小但尚未解决的差异。VoltaGrid 的旗舰产品是一套正在申请专利的混合平台，把快速爬坡天然气发电机（32
              秒达到额定负载）、大规模便携式储能，以及支持 AI 的 Access Innovation Portal
              组合起来，实时监控电力需求、燃料消耗和排放；公司称，相比双燃料或燃气轮机方案，常规污染物和温室气体排放可降低 28-40%。自 2025 年以来，这套以 QPac 和 StabilAI
              名义销售的平台被明确重新定位，用于吉瓦级 AI 数据中心负载。
