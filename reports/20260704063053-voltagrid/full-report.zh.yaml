  - id: TM001
    title: 市场定义：细分市场、支出边界与买方
    columns:
      - 细分市场 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 与 VoltaGrid 的相关性
    rows:
      - - 面向超大规模 / AI 数据中心的表后（BTM）模块化天然气主电源
        - 为单一数据中心园区专用的现场燃气发电，既可以自有，也可以按服务合同采购，外加配套开关设备 / 控制系统
        - 购自电网的公用事业电力、纯可再生能源 PPA、核能 SMR，以及仅作柴油备用的发电机组
        - 超大规模云厂商 / AI 基础设施运营商（Oracle、Vantage、xAI 等）
        - VoltaGrid 的核心可服务细分市场
      - - 并网公用事业与 IPP 大负荷供电
        - 来自公用事业公司 / IPP（NRG、LS Power、Constellation、Talen）的长期 PPA 和基于并网的服务
        - 未连接输电网的现场 / 表后发电
        - 公用事业费率缴费群体加数据中心运营商（通过 PPA）
        - 现状替代方案和竞争性交付模式，不是 VoltaGrid 的细分市场
      - - 备用 / 待命柴油和燃气发电机市场（传统数据中心备用）
        - 按停电穿越需求配置的应急备用发电机组，不是连续主电源
        - 连续 / 主电源发电和燃料电池主电源
        - 数据中心设施 / 工程预算
        - 相邻且与分析师分类重叠，但购买决策不同于主用 BTM 电力
      - - 面向数据中心的燃料电池主电源（例如 Bloom Energy）
        - 现场固体氧化物或其他燃料电池主电源安装
        - 燃烧涡轮或往复式发动机 BTM 燃气发电
        - 超大规模云厂商 / AI 基础设施运营商
        - 相邻替代 / 竞争性 BTM 技术，使用同一买方预算
      - - 油田和工业电气化微电网（传统业务）
        - 面向电动水力压裂、远程采矿和分布式发电的移动 / 模块化燃气电力
        - 数据中心专用 BTM 合同
        - 油田运营商和工业场址
        - VoltaGrid 原有且规模较小的传统细分市场，独立于 AI 数据中心转向
      - - 面向数据中心的可再生能源加储能供电
        - 太阳能 / 风能 / 电池混合现场发电
        - 化石燃料主电源
        - 超大规模云厂商 ESG / 可持续发展预算
        - 现状 / ESG 偏好的替代方案，但今天单独支撑 GW 级 AI 负载时通常还不够可调度
    notes: VoltaGrid 的核心可服务细分市场是第 1 行；第 2-6 行是数据中心运营商电力采购预算也可选择的替代、相邻和现状方案，来自本章引用的市场 / 监管来源，而不是单一统一市场分类法。
