      - number: '5.6'
        title: 信任、安全与合规控制
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid 的合规记录好坏参半。在一个活跃站点上，Southern Environmental Law Center 2026 年 6 月的执法请求称，VoltaGrid 在 Covington,
              Georgia 一个数据中心项目中，计划建设 33 台甲烷燃气发动机，已开始建设其中 8 台，但尚未取得 Clean Air Act 要求的开工前空气许可；相邻客户 Serverfarm
              也被指在同一许可缺口下安装了 37 台柴油机组中的 36 台 (CE039)。Atlanta Journal-Constitution 2026 年 7 月的报道佐证了未获许可先施工的指控，并将其描述为
              Georgia 首个服务数据中心的离网“快闪式”电厂 (CE040)。行业层面，EPA 关闭“non-road engine”豁免后，VoltaGrid 供应的这类移动涡轮机如今受 Clean Air Act
              固定源许可约束；这一重新归类接续了此前对 xAI Memphis 站点的审查 (CE041, CE042)。VoltaGrid 自身宣称，相较双燃料 / 涡轮方案可减少 28-40%
              GHG，但该数字由公司披露，未标明独立验证来源 (CE043)。招聘页显示公司设有专门 HSE 职能 (CE044)，但本章审阅的任何来源中，都未找到 QPac 或 StabilAI 的 ISO、UL
              或类似第三方认证。
