              董事任命。增长叙事现在受到正在进行的负面事件遮蔽：2026 年 6 月 25 日，Southern Environmental Law Center、Sustainable Newton 和 Altamaha
              Riverkeeper 要求 Georgia Environmental Protection Division 调查并执法，指称 VoltaGrid 在 Georgia 州 Covington
              一处场地未取得所需空气许可，就建设计划中 33 台甲烷燃气发动机里的至少 8 台，地点距离住宅、饮用水水库和自然保护区约三英里以内；Atlanta Journal-Constitution 于 2026 年 7
              月 1 日放大了这场争议，同日 Reuters（经 US News）报道 Environmental Integrity Project 的一项分析，估计全美 74 座类似燃气电厂每年可能排放 662
              million tons CO2；倡议组织 Shift Action 也单独点名 VoltaGrid 作为 CPP Investments 支持的公司，批评这家长期投资方的化石燃料敞口。
