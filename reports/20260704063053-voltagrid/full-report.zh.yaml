        - '>$10B 股权价值，对比约 $1.1B 2028E EBITDA（公司指引）'
        - 约 9x 股权 / EBITDA；假设约 $5.5B 净债务，远期 EV/EBITDA 约 13-14x
        - 主体公司——比较锚点行
        - 2028 EBITDA 未经审计，且由公司指引
      - - Crusoe Energy（私营）
        - Oct 2025 Series E 轮规模，对比报道估值
        - '>$10B 估值，对应 $1.375B 融资'
        - 最接近的 AI 电力基础设施私营同业
        - 未披露收入 / EBITDA 倍数；资本更重、垂直整合程度更高的模式，无法直接按单位经济性比较
      - - Enchanted Rock / ERock（私营，IPO 路径）
        - 2025 年收入 $183.1M 对比目标 IPO 估值
        - 目标 IPO 估值 $5B，约 27x EV/Revenue
        - 表后微电网即服务的直接可比公司
        - 收入基数小得多；倍数反映早期成长溢价
      - - Bloom Energy（BE，上市公司）
        - FY2025 EV/Sales 与 EV/EBITDA（当前）
        - EV 约 $77.51B；31.65x EV/Sales；GAAP 盈利基数很薄，334.71x EV/EBITDA 意义不大
        - 最接近的上市「清洁」分布式电力可比公司，同样受益于 AI 电力主题
        - 燃料电池技术和利润率结构与 VoltaGrid 的燃气往复式模型差异很大
      - - Generac Holdings（GNRC，上市公司）
        - FY2025 EV/EBITDA 与 EV/Sales（当前）
        - EV 约 $16.00B；30.33x EV/EBITDA；3.70x EV/Sales
        - 最接近的上市发电机设备可比公司，已披露数据中心增长
        - 公司整体倍数；未披露数据中心分部经济性
      - - Cummins Inc.（CMI，上市公司）
        - FY2025 EV/EBITDA 与 EV/Sales（当前、过去 12 个月和前瞻）
        - EV 约 $96.37B；过去 12 个月 EV/EBITDA 19.26x（第二家数据商给出的前瞻倍数为 15.9x）；2.84x EV/Sales
        - 最接近的上市往复式发动机 / 电力系统技术可比公司
        - 数据中心电力之外还有多个多元终端市场，削弱可比参考性
      - - Caterpillar Inc.（CAT，上市公司）
        - FY2025 EV/EBITDA 与 EV/Sales（当前）
        - EV 约 $483.54B；33.22x EV/EBITDA；6.83x EV/Sales
        - 大型发电机组直接竞争对手，已披露数据中心需求顺风
        - 收入绝大多数来自非数据中心工业业务；规模远大于 VoltaGrid
      - - Vistra Corp（VST，上市公司）
        - FY2025 EV/EBITDA（当前）
        - EV 约 $70.20B；10.34x EV/EBITDA
        - 商业化 IPP 可比公司，已披露面向超大规模客户的核电 PPA
        - 受监管 / 商业化发电经济性与 VoltaGrid 的合约型 BTM 模型不同
      - - NRG Energy（NRG，上市公司）
        - 当前 EV/EBITDA 与 EV/Sales
        - 23.04x EV/EBITDA；1.61x EV/Sales（倍数）
        - 商业化 IPP 可比公司，正为数据中心需求主动收购燃气发电资产
        - 零售 / 发电业务多元；不是纯数据中心电力标的
    notes: 上市公司数据截至 2026 年 7 月研究日（stockanalysis.com 实时数据，并与各自 FY2025 Form 10-K 交叉核对）；私有公司估值采用最新公开报道轮次或 IPO 申报目标，不是经审计估值。
