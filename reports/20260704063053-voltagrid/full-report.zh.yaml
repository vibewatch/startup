              Hemisphere 和 Middle East 的合作，延续了同一模式 (CE032, CE033, CE034, CE035, CE036)。相比之下，VoltaGrid 面向 Aethon Energy
              的油田 E-frac 业务自 2021 年起运行，面向 Chesapeake 的业务也是跨多年、正在运营 (CE037)；Serverfarm 的 Georgia 站点虽有许可争议，但仍处于活跃施工状态
