      - number: '7.7'
        title: 缓释措施、监测指标与投资逻辑破裂触发条件
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid 自己披露的制造和供应链风险缓释手段，就是收购 Propell。管理层明确把这笔交易定义为通过纵向整合降低执行风险；但同一动作也把生产集中到单一基地，并让 VoltaGrid 仍依赖 INNIO
              和 ABB 提供底层发动机与电网稳定组件（CR053、CR054）。法律和监管风险上，近期最清晰、可监测的触发点是 Georgia EPD
              的裁定：若下达停工令或罚款，将形成成本高昂的执法先例，且很可能在其他地点复制；若追溯发放许可证或达成协商同意令，则会显著降低公司的监管风险（CR055）。Texas 还有一个平行触发点：若完整 ABI-1
              扩建被认定为 Title V 主要污染源，相比按阶段的小污染源路径，建设周期会被拉长（CR056）。财务侧，Henry Hub 若持续显著高于 2025-2026 年模型采用的大约
              $3.00-4.30/MMBtu 区间，会压缩任何未披露套保合约的利润率（CR057）；若 2030 年到期票据被降级、触发契约违约或再融资失败，则说明订单储备转收入低于支撑 VoltaGrid
              资本结构的假设（CR058）。需求侧，鉴于 VoltaGrid 客户集中度高，Oracle 或 Vantage 合同公开取消或实质缩减，是最直接、可监测的投资逻辑破裂触发点（CR059）；Goldman
              Sachs Research 的「AI Downside」入住率情景，则是同一风险的外部、行业级领先指标（CR060）。最后在治理上，Halliburton 关联董事席位进一步增加，或 CEO Nathan
              Ough 离职，都是尽调团队可在两次刷新之间直接观察的监测指标（CR061）。合在一起，Georgia 执法事项、Texas 许可敞口、未披露的大宗商品套保、集中的 OEM / 客户依赖，以及
              Halliburton 的重叠角色，构成本章截至 2026 年研究日期的最高严重度、缓释最少的风险（CR062）。
