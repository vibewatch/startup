      - number: '8.6'
        title: 投资逻辑破裂触发点与监测
        blocks:
          - type: paragraph
            body: >-
              六个可监测触发点会显著改变本章判断。若 Georgia EPD 对 Covington 场址下达停工令、重大罚款或强制改造，说明监管风险可能在 VoltaGrid 更广泛的场址组合中复现，新资本承诺应暂停。若
              Texas TCEQ 对更大的 ABI-1 扩建给出类似不利结果，则会威胁已披露的最大单一扩建场址。Oracle 或 Vantage
              这两个具名锚定客户只要确认取消、延期或重新定价，就会移除已披露订单储备收入可见性的大多数，必须立刻重新承销。若天然气价格持续飙升，而公司没有披露任何套保或成本转嫁机制，就会检验固定价格合同下究竟是
              VoltaGrid 还是客户承担大宗商品风险。发布经审计或贷款方验证的 2025/2026 财务，是单一价值最高的事件，会把整场估值争论从估计转为验证，无论方向如何。最后，VoltaGrid 自己探索 IPO
              或出售的结果——无论是公开申报还是已公告交易，若定价显著高于或低于 2026 年 5 月超过 $10 billion
              的估值标记——都会明确该私募估值到底合理、偏高还是偏低，并应直接指导任何后续投资或老股购买的入场纪律。
            claimRefs:
              - CV037
              - CV042
              - CV041
              - CV011
              - CV045
          - type: table
            tableRef: TV005
            claimRefs:
