      - number: '5.3'
        title: 架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid 的数据中心方案把燃料供应、主发电、电网稳定和 AI 驱动调度叠成一个运营系统。Oracle 部署中，Energy Transfer 管道供气，以及关联的 Texas
              制造和运营岗位创造，说明燃料层和劳动力层如何接到一个具名合同上 (CE013, CE014)。已部署站点由现场 Command Center 配合 24/7 Remote Operations Center 监控
              (CE015)。公司材料中反复出现几项工程选择：QPac 的排热系统在数据中心 HVAC 系统上方向上排风，以减少对冷却和土地使用的干扰 (CE016)；机组目标是在 33 feet 处约 65
              dBA，以满足选址噪声限制 (CE017)；平台被营销为可升级到 100% hydrogen，尽管尚无已记录的运营中氢气部署 (CE018)。VoltaGrid 还披露了高于 99.9%
              的预计电厂可靠性数字，但这是公司营销口径，而不是独立审计后的运营统计 (CE019)；这一差别很重要，因为多 GW、跨多年客户合同正是以它作为验证前提。
