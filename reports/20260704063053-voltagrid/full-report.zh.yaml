  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 按客户工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid 卖的不是独立发电硬件，而是表后天然气电力托管服务：在 Power Delivery Agreement（PDA）下，VoltaGrid
              在现场安装、持有并运营发电资产，客户在合同期内按预设费率为已交付电力付费
              (CE001)。放到客户工作流里，同一底层平台有两种定位：一种是在公用电网并网延迟时，为数据中心提供短期过桥电力；另一种是在场地建成后，作为长期或永久现场主电源
              (CE002)。这条产品线起步于电动水力压裂，压裂泵负载可在一小时内从超过 16 MWe 摆动到低于 0.75 MWe，VoltaGrid 最早的移动发电加储能平台正是为吸收这种工况周期而设计
              (CE003)。独立行业报道把 VoltaGrid 的核心价值主张概括为：在电力受限市场里更快安装，而不是最低成本发电；这种定位贯穿本章后文讨论的每一个具名客户合同 (CE004)。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
      - number: '5.2'
        title: 模块、平台与资产图谱
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid 的产品组合横跨四个不同模块。QPac 是旗舰数据中心平台：每个模块化往复式发动机节点最高 20-25 MW，基于 INNIO Jenbacher
              发动机，可在单个小型污染源空气许可下组合到每站最高 200 MW (CE005, CE006)。StabilAI 是配套电网稳定层，把 ABB 同步调相机、飞轮惯量和预制 eHouse 组合起来，在 AI/GPU
              负载波动中把电压控制在 +/-5%、频率控制在 +/-2%，且不使用电池储能 (CE007)。Access Innovation Portal 是一套 AI
              监测和调度软件，让车队层面的需求、排放和计费接近实时可见 (CE008)。最初的混合油田平台仍服务 E-frac 客户，配置便携式发电、储能、可选并网和同一套 Access Innovation Portal
              (CE009)；配套的移动制冷单元和增压压缩系统正在申请专利，可按每台拖车最高 4.2 MMSCF/day 处理现场气、CNG、LNG 或可再生气，并分离天然气液体用于转售 (CE010,
              CE011)。VoltaGrid 没有披露其在内部制造任一模块底层的发动机或调相机 (CE012)。
