      - number: '8.3'
        title: 可比公司与先例交易分析
        blocks:
          - type: paragraph
            body: >-
              两家私营可比公司锚定区间的成长阶段端：Crusoe Energy 2025 年 10 月以超过 $10 billion 的估值融资 $1.375 billion，定位为纵向整合的 AI
              数据中心与电力开发商；Enchanted Rock（ERock）则以 $183.1 million 的 2025 年收入冲刺 $5 billion 的 2026 年 IPO 估值，对应约 27x
              EV/Revenue，说明私募 / IPO 前市场愿意给整个行业类似成长溢价，并非 VoltaGrid 独享。公开市场一侧，stockanalysis.com 的当前（2026 年 7 月）数据与各公司
              FY2025 Form 10-K 显示，EV/EBITDA 区间很宽，约 10x-33x：Vistra 为 10.34x，NRG 为 23.04x EV/EBITDA、1.61x EV/Sales，Cummins
              为 19.26x EV/EBITDA（另一家数据商给出的远期口径为 15.9x）和 2.84x EV/Sales，Generac 为 30.33x EV/EBITDA 和 3.70x
              EV/Sales，Caterpillar 为 33.22x EV/EBITDA 和 6.83x EV/Sales，Bloom Energy 为 31.65x EV/Sales（其 334.71x
              EV/EBITDA 因 GAAP 盈利基数很薄而意义不大）。把 VoltaGrid 超过 $10 billion 的股权价值套到 $1.1 billion 的 2028E EBITDA 目标上，隐含约 9x
              股权价值 / EBITDA；若再加上估计 $5.5 billion 净债务，远期 EV/EBITDA 约 13-14x——低于设备制造商倍数，但高于 Vistra。因此，只要 EBITDA
              目标真实并经过审计，在今天偏热的可比公司环境下，入场价格并不显得明显昂贵。
