            title: 两个在线、跨多年参考客户支撑采用故事
            body: >-
              尽管 VoltaGrid 高度依赖近期签署、仍在执行中的 GW 级合同，它确实拥有两个真正在线、跨多年的具名参考客户——Aethon Energy 油田 e-frac 关系（自 2021 年起）和 xAI
              Memphis Colossus 部署（自 2024 年年中起）——且独立行业媒体佐证它们处于运营状态，而不只是已签约。
            calloutType: strength
