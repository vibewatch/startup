              在保留的公开来源中，VoltaGrid 没有披露任何收入、年经常性收入（ARR）、EBITDA、账面现金或烧钱速度。现金跑道无法计算；2028 年 ~$1.1 billion 的 EBITDA
              目标基于未经审计的公司指引，而不是可核验的财务报表，因此仅凭公开证据无法独立衡量其高于 $10 billion 的估值。
