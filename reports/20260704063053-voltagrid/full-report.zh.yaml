      - number: '7.2'
        title: 监管与法律风险：Georgia 执法、Texas 许可和联邦规则制定
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid 最重要的近期风险，是 Southern Environmental Law Center 2026 年 6 月 25 日的正式执法请求。该请求要求 Georgia EPD 停止并处罚
              Covington 数据中心站点一个约 90 MW、33 台发动机甲烷燃气电厂的未许可施工；在取得许可前，该站点已安装 33 台发动机中的 8 台，相邻设施也已安装 37 台柴油发电机中的 36 台
              (CR001, CR002)。站点距离住宅、饮用水水库和自然保护区约 three miles 范围内，甲醛被列为主要健康担忧 (CR003)；Atlanta Journal-Constitution 于 2026
              年 7 月 1 日独立佐证了这一指控 (CR004)。截至研究日期，Georgia EPD 既未发出停工令，也未作出最终裁定 (CR005)。第二个地理上不同的敞口正在 Texas 形成：VoltaGrid
              2025 年 7 月和 12 月向 TCEQ 提交的 ABI-1 “Frontier Campus”站点文件，可能扩张到 620 台发电机和约 2,582 MW；独立追踪方估计，该规模每年将排放超过 10
              million tons GHG，并很可能需要更慢的 Title V 大型污染源审查 (CR009, CR010, CR011)。这些 VoltaGrid 特定事项，叠加在一个行业背景上：EPA
              关闭了“non-road engine”豁免，NAACP/SELC 又因 Memphis 未许可涡轮机起诉 xAI——根据 Shift Action 有记录的更正，该先例涉及的设备不同于
              VoltaGrid，但它显示执法意愿正在收紧 (CR006, CR007, CR008)。联邦甲烷规则制定 (CR012, CR013) 和 FERC 2025 年 12 月的 PJM 共址命令 (CR014,
              CR015) 进一步增加了监管反转和扩张约束风险，尽管当前概率较低；数据中心选址和保险责任评论也提示，站点层面的法律敞口会相互叠加 (CR016, CR017)。
