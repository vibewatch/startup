companyProfile:
  summary: >-
    VoltaGrid 是一家总部位于 Houston 的私营能源基础设施公司，成立于 2020 年，由联合创始人兼 CEO Nathan Ough 领导。公司起步于油田电气化和便携式天然气微电网，随后把 QPac 和 StabilAI
    平台转向面向超大规模与托管 AI 数据中心的表后供电。公开披露的里程碑包括 2.3 GW Oracle 合同、1+ GW Vantage 合作、2025 年 $5.0 billion 债务融资包，以及 2026 年 5 月
    Blackstone Tactical Opportunities 和 Halliburton 参与的 $1.0 billion 战略股权融资，隐含估值超过 $10
    billion。核心承销难点在于，规模叙事确有真实基础，但仍建立在稀疏的经审计财务披露和正在进行的许可风险之上。
