  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：同行、既有企业、相邻玩家、替代方案与现状路径
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid 所处竞争格局并不主要按单一产品类别划分，而是取决于买方能多快、多可靠地把新增电力接入 AI
              数据中心园区。市场大致有四类。直接同行以多年期合同销售托管式表后（BTM）电力即服务：Enchanted Rock（2026 年 IPO 前更名为 ERock）和 Bloom Energy 是与
              VoltaGrid 商业模式最接近的类比对象，但 Enchanted Rock 的微电网模块小得多（500 kW-3.5 MW），Bloom 的燃料电池则以功率密度换取更清洁的排放画像。既有 OEM
              供应商——Caterpillar、Cummins、Generac 和 GE Vernova——销售发电设备或燃气轮机，而不是交钥匙服务；在多数披露交易中，承担运营风险的是客户或集成商，而非
              OEM。相邻的并网既有企业 NRG（完成约 $12 billion LS Power 资产收购后）和 Vistra 提供公用事业式 PPA 及核能 / 燃气容量，在互联队列较短的地区替代 BTM
              电力。最后，现状路径和内部自建替代方案——超大规模云厂商自行安装燃气轮机（xAI）、垂直整合的 AI
              基础设施开发商（Crusoe）、直接采购天然气的独立数据中心开发商（CloudBurst）——显示部分买方会完全绕过第三方电力供应商。近期可能进入者包括更多 OEM；随着 2026
              年新增制造产能上线，它们可能扩展到托管服务模式。
