      - number: '5.5'
        title: 差异化：技术、IP 和供应准入
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid 最能防守的差异化是速度：独立报道认可公司能在数据中心多年并网排队面前“数月内”装上容量 (CE046)；公司又用无电池 StabilAI
              设计强化这一点，把它定位为比天然气加电池竞争方案更简单、部署更快的替代方案 (CE047)。部分正式 IP 支撑了这一点：VoltaGrid 持有已授权美国专利 US12500423B2，该专利是申请
              US20220140614A1 的继续申请，覆盖移动混合微电网，发明人包括 CEO Nathan Ough 和工程师 Leslie Michael Wise (CE048)；Justia
              专利受让人记录还显示公司持续提交申请，包括 2026 年公布的模块化气体处理系统，以及 2025 年授权的同步调相机发电专利 (CE049)。但从结构上看，VoltaGrid
              的差异化来自系统集成商身份，而不是制造商身份：它封装第三方 INNIO 发动机和 ABB 调相机，而不是自己造。两家 OEM 都把 VoltaGrid
              订单称为各自公司历史上规模最大的订单之一，这说明供应商可能优先供货，较小对手未必拿得到；同时也带来单一来源集中风险 (CE012, CE050)。
