              较低的汇总值冲突。员工数仅在 CEO Nathan Ough 的简介页披露为“超过 900 名员工”；若待完成的 Propell 收购交割，再结合财经媒体称 Propell 员工约 800 人，合并员工数将接近
              1,700，但公司尚未发布合并口径数字。客户侧规模由公司披露的截至 2030 年约 7.5 GW 已签约订单簿，以及截至 2028 年 4.3+ GW 全签约部署计划支撑，主要由 Oracle Cloud
