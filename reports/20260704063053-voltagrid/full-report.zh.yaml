  - id: TM003
    title: 细分市场、买方、用户、付款方与采用路径
    columns:
      - 细分市场
      - 买方
      - 用户
      - 付款方
      - 工作流 / 部署路径
      - 预算负责人
      - 采用触发因素
    rows:
      - - 超大规模云 / AI 运营商
        - Oracle Cloud Infrastructure、Microsoft、Google、Meta 与 Amazon
        - 内部 AI / 云计算负载
        - 超大规模云厂商自身（直接资本开支或长期 PPA）
        - 选址 -> 并网队列评估 -> BTM RFP -> 工程 / 采购 -> 投运
        - 超大规模云厂商基础设施 / 能源采购团队
        - 电网并网延迟 3 年以上，威胁已承诺 AI 园区上线日期
      - - 托管 / 多租户开发商
        - Vantage Data Centers 及同业
        - 多个企业 / 超大规模云厂商租户
        - 托管开发商付款，并通过租户租约 / 电费转嫁回收
        - 组合层面电力策略 -> BTM 供应商选择 -> 跨站点分阶段铺开
        - 托管开发商资本项目团队
        - 需要为多站点组合中已预租项目的交付日期降风险
      - - AI 原生基础设施业主运营商
        - xAI、Crusoe、OpenAI/Stargate 关联开发商
        - 业主自有 GPU 训练 / 推理集群
        - 业主运营商付款，背后往往有战略资本或风投资金
        - 快速建站 -> 移动式 / 模块化发电机交付 -> 分阶段增加容量
        - 业主运营商自有能源 / 基础设施团队
        - 算力受限的 AI 训练竞赛里，对接电速度要求极高
      - - 公用事业公司与独立电力生产商
        - NRG Energy、LS Power 及类似邻近电网的 IPP
        - 与 BTM 新进入者相同的超大规模云 / AI 大负荷客户
        - 公用事业费率缴纳者基础 + 通过 PPA 付款的大负荷客户
        - 资产收购 -> 邻近电网选址 -> 长期 PPA 谈判
        - 公用事业 / IPP 公司发展及发电投资团队
        - 希望留住可能转向纯 BTM 供应商的大负荷客户
      - - 工业 / 油田电气化（传统业务）
        - E&P 运营商、偏远 / 矿山站点
        - 现场作业设备（e-frac、钻井）
        - 油田运营商运营预算
        - 移动微电网租赁 -> 井场部署 -> 随油田迁移重新部署
        - 现场作业 / 完井预算
        - 柴油转燃气带来的燃料成本与减排经济性，而非 AI 驱动需求
    notes: 买方 / 用户 / 付款方角色来自公开交易公告和法律 / 顾问评论，而非单一统一调查；工业 / 油田行反映传统细分市场，用来对照更新的超大规模 AI 重点，其本身未在本章测算规模。
    claimRefs:
      - CM039
      - CM040
      - CM041
      - CM042
  - id: TM004
    title: 增长驱动因素与采用约束
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调核查
    rows:
      - - AI / 超大规模云 capex 激增（2025 年 >$400B，2026 年预测 +75%）
        - 驱动
        - 当前 - 2026+
        - 扩大需要快速供电的已承诺 AI 园区池
        - 核实 VoltaGrid 订单储备中有多少绑定已承诺、而非投机性超大规模云 capex 计划
      - - 电网并网积压（排队 2,060+ GW；等待 3-8+ 年）
        - 驱动
        - 当前 - 2030
        - 相比等待并网，结构性利好 BTM / 自发电
        - 专门跟踪 VoltaGrid 核心 ERCOT 市场的队列清理速度
      - - 模块化燃气 / 燃料电池相对电网 / 核电的部署速度优势（90 天 - 12 个月 vs. 3-15+ 年）
        - 驱动
        - 当前 - 2028
        - 强化 BTM 在时间受限 AI 建设中的默认选择地位
        - 除单个 xAI Memphis 案例外，核实 VoltaGrid 从选址到供电的实际周期记录
      - - FERC / PJM 表后规则改革（50 MW 净额门槛）
        - 约束
        - 2026-2029（3 年过渡期）
        - 可能削弱 PJM 区域内 50 MW 以上新 BTM 安排的经济性
        - 核实 VoltaGrid 是否已有或计划推进会受该规则影响的 PJM 区域项目
      - - Texas Senate Bill 6 大负荷灵活性要求（>75 MW）
        - 约束
        - 当前
        - 在 VoltaGrid 核心 ERCOT 市场增加合规 / 灵活性义务
        - 评估 SB6 合规成本如何影响 VoltaGrid Texas 项目经济性
      - - 空气许可 / Clean Air Act 执法风险（xAI Memphis 先例）
        - 约束
        - 当前 - 持续
        - 未获许可的燃气 BTM 站点，法律 / 监管风险和潜在施工延迟上升
        - 核实每个进行中的 VoltaGrid 站点许可状态，而不只是已披露的 Georgia 事项
      - - 设备 / 制造交期（涡轮与燃料电池订单储备创纪录）
        - 约束
        - 当前 - 2027
        - 即使选址和许可已锁定，交付仍可能延迟
        - 对照 7.2 GW 项目管线，核实 VoltaGrid / Propell 合并制造能力
      - - EPA 拟议许可放松监管（2026 年）
        - 驱动
        - 2026+（45 天意见征询期待完成）
        - 若最终落地，可能缩短燃气 BTM 项目施工周期
        - 跟踪 EPA 提案最终落地时间表和诉讼风险
      - - ESG / 漂绿与费率缴纳者成本审查（Ratepayer Protection Pledge、甲烷批评）
        - 约束
        - 当前 - 持续
        - 可能抬高重燃气 BTM 策略的声誉和政治成本
        - 评估客户 ESG 承诺是否带来合同取消风险
      - - 天然气供应 / 管道建设（美国拟新增 250+ GW 燃气容量）
        - 驱动
        - 当前 - 2030
        - 整体支撑燃气 BTM 增长所需燃料可得性，但单一管道依赖仍是站点级风险
        - 核实 VoltaGrid 除已披露 Energy Transfer / Oracle 安排之外的天然气供应合同
    notes: 方向反映每个因素对 VoltaGrid 式燃气 BTM 电力需求的净影响，而不是对数据中心市场整体的 影响；若干约束（SB6、许可风险）与指向更多 BTM 建设的驱动因素并存，因此方向和时间 两列需要合并阅读。
    claimRefs:
