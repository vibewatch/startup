              VoltaGrid 在 2025 年 11 月完成 $5.0 billion 债务包，又在 2026 年 5 月获得 Blackstone 和 Halliburton 的 $1.0 billion
              战略股权投资，交易对手均具备可信的尽调能力。反复打通资本市场，本身就是反驳近期偿付风险的证据，尽管它没有解决底层运营指标不透明的问题。
