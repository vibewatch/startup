            title: 真实订单储备，真实赞助方
            body: >-
              据报道，Oracle 为 Texas 单一场址每年向 VoltaGrid 支付超过 $1 billion；2026 年 5 月融资则引入 Blackstone Tactical Opportunities 和
              Halliburton，并有现有投资人 CPP Investments 参与。一家成立六年的公司，很少能拿到这种具体且相互印证的商业和财务资方背书。
