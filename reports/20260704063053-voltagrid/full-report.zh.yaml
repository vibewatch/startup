  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险框架与敞口排序概览
        blocks:
          - type: paragraph
            body: >-
              本章按五类风险给 VoltaGrid 排序——监管 / 法律、运营 / 制造、伙伴 / 依赖、人员 / 执行、财务 / 大宗商品，并加入一个横跨各类的 ESG /
              政治维度——共同评分镜头是发生概率、严重性、缓释成熟度和剩余敞口，最后给出可监测的否决标准。监管 / 法律风险目前排第一：VoltaGrid 的 Covington, Georgia 站点因未获许可施工面临
              Southern Environmental Law Center 的活跃执法请求；与此同时，Texas Commission on Environmental Quality 针对约 2,582 MW
              ABI-1 扩建的大型污染源许可争议仍在待决 (CR001, CR009, CR010)。财务 / 大宗商品风险紧随其后：$5.0 billion 有担保债务包叠在高于 $10 billion
              的隐含估值之下，同时没有披露天然气对冲计划 (CR037, CR039)。伙伴 / 依赖风险被 INNIO Jenbacher 和 ABB 的单一来源 OEM 关系抬高，也被 Halliburton
              同时作为股权投资方、拥有两个董事席位并担任运营伙伴的角色抬高 (CR027, CR028, CR031)。运营 / 制造风险集中在收购 Propell 后尚未验证的制造爬坡，以及未经验证的可靠性和排放声明
              (CR019, CR020, CR023)。人员 / 执行风险发生概率相对更低，但严重性高，因为公司依赖一位公开可识别的创始人 CEO。下方风险热力图 (FR001)
              按发生概率、严重性、缓释成熟度和剩余敞口概括这些排序；各类别的详细登记表和来源见后续章节。
            claimRefs:
              - CR001
              - CR009
              - CR019
              - CR027
              - CR031
              - CR037
              - CR039
              - CR062
