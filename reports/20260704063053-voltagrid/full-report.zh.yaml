      - number: '8.2'
        title: 当前融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid 的估值历史快速抬升：2020 年 $73 million 种子轮；到 2023 年约 $100-210 million 后续股权融资；2024 年 3 月 $550 million
              定期贷款；2025 年 11 月 $5.0 billion 综合债务包（$2.0 billion 优先有担保二留置权票据，加 $3.0 billion 资产基础贷款）；以及 2026 年 5 月
              Blackstone Tactical Opportunities 和 Halliburton 投入的 $1.0 billion Series D，其中 $775 million 为新股资本、$225
              million 为向现有股东购买的老股。老股部分意味着部分早期投资人在新估值下做了部分退出，而不是整轮融资全用于一手增长资本；这是分析稀释和入场纪律时必须记下的数据点。融资追踪平台加总后显示，累计资本化接近
              $7.1 billion（约 $1.5 billion 股权、$5.5 billion 债务）。Bloomberg 2026 年 2 月报道，VoltaGrid 还在单独探索 IPO，并曾与包括
              Blackstone 和 BlackRock 在内的私募股权机构讨论出售；任何交易都被认为会让公司估值超过 $10 billion。也就是说，2026 年 5
              月的战略轮和退出流程里的估值传言相互强化，但没有经审计数字独立验证。本章审阅的来源没有披露当年收入、EBITDA、账面现金或 Propell 收购价，单靠公开证据无法支撑价格是否合理的判断。
