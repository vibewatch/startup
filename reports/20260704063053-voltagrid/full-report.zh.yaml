      - number: '7.5'
        title: 人员与执行风险
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid 的公开叙事把创始人层面的功劳集中在 CEO Nathan Ough 身上：EY Entrepreneur of the Year 材料称，他在 2020 年为创办公司亲自在 100 天内募集
              $100 million，并推动公司成立以来收入增长超过六倍 (CR034 context via SR042)；S&P Global 的 Energy Cents
              播客也给了他类似的单一创始人曝光。VoltaGrid 当前高管团队页面列出了首席财务官、首席法务官、首席技术官、首席行政官、首席运营官和执行副总裁，但没有把联合创始人 Jared Oehring
              列入任何运营角色；这与早前关于他不再担任当前运营职位的报道一致 (CR034)。治理集中进一步放大关键人风险：两名 Halliburton 高管占据 VoltaGrid 董事席位，叠加 Halliburton
              的股权和商业关系，削弱了董事会监督的实际独立性，尽管外部董事长 Doug Wonnacott 也在董事会任职 (CR031, CR032)。VoltaGrid 收购 Propell 后还需要把约 1,000
              名新增员工吸收到既有运营中；这种规模的劳动力整合本身就带来执行风险，即便公司把交易表述为降低而不是增加整体风险 (CR019)。在缺少独立治理披露的情况下，VoltaGrid
              发布的董事会和高管团队页面，是尽调团队今天拥有的主要监测界面；Halliburton 关联董事席位进一步增加，或 Ough 本人离任，都将是未来值得直接追踪的可见信号 (CR061)。
