      - number: '3.3'
        title: 能力、定价与进入市场方式对比
        blocks:
          - type: paragraph
            body: >-
              买方真正关心的能力差异集中在部署速度、可达到的单站规模、合同 / 所有权模式、燃料灵活性，以及已披露排放定位；下方能力矩阵采用基于证据的 0-3 序数评分，而不是编造公开记录无法支持的精确度。VoltaGrid
              和 Enchanted Rock 都主打离网、BTM 原生部署，但单元规模差异很大。Bloom Energy 也部署表后项目，Oracle 场地曾报道低于 90
              天的站点周期，但其合计容量分散在许多较小安装中（Equinix 19 个以上站点合计 100+ MW），而不是集中在单个大型区块。OEM 设备销售商（Caterpillar、Cummins）和并网
              IPP（NRG/LS Power、Vistra）在离网 / BTM 准备度上得分较低，因为其核心商业模式要么是设备销售，要么是并网供电。定价方面，包括 VoltaGrid 在内的所有画像竞争者都没有公开披露每
              MW 或每 MWh 费率；下方定价表在数据无法独立验证处一律标注单位经济性“未知”，转而比较合同期限、所有权和纳入范围，因为这些才是买方签约前实际能尽调的维度。分析师评论认为，Bloom 的燃料电池服务因 ESG
              属性相对燃气 BTM 收取溢价；Enchanted Rock 无前期资本开支的 RaaS 模式，面对更小、以韧性为核心的负载时，可能比面对吉瓦级主用电力时更具价格竞争力。
