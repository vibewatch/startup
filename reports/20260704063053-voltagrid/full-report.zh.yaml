  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：VoltaGrid 的可服务市场是什么、不是哪些
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid 的可服务市场最好从窄口径定义，而非宽口径：直接销售或签约给超大规模和 AI
              原生数据中心运营商的表后（BTM）模块化天然气主用电力，而不是整个数据中心电力支出宇宙。这个边界很重要，因为全球数据中心用电需求本身正在飙升——2025 年增长 17%，同期整体电网增长约
              3%；五大科技公司的资本开支在 2025 年超过 $400 billion，并预计在 2026 年再增长 75%——但更大范围需求中只有一部分会转化为 VoltaGrid 所售类型的 BTM
              天然气合同。VoltaGrid
              核心细分之外包括从电网购买的公用事业电力、纯可再生能源购电协议、核能小型模块化反应堆，以及纯柴油备用发电；这些都是真实替代项，数据中心运营商的预算可以转向其中任何一类。最接近的相邻替代是燃料电池主用电力（由
              Bloom Energy 领跑），它与 BTM 天然气争夺同一批超大规模云客户资本，也处在同一条表后预算线，而不是完全独立的类别。VoltaGrid
              原有的油田电气化和工业微电网业务规模更小、阶段更早，与其新近转向的吉瓦级 AI 数据中心业务仍然不同。表 TM001
              按细分列出这条边界，包括纳入和排除的支出，使本章后续规模测算和买方分析锚定在明确定义的市场，而不是等同于整个 AI 电力建设周期。
