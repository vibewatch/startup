      - CM049
  - id: TM002
    title: 规模测算视角：分析师、跟踪器和公司披露代理指标
    columns:
      - 发布方
      - 年份
      - 地域
      - 数值
      - 年复合增长率（CAGR）
      - 方法 / 依据
      - 置信度
      - 局限
    rows:
      - - Grand View Research
        - 2022 -> 2030
        - 全球
        - $7.49B (2022) -> $12.98B (2030)
        - 7.3%
        - 自下而上的发电设备收入市场模型
        - 中
        - 包含柴油备用发电机组（约占 2022 年收入的 73%）；不只是纯燃气主电源
      - - Mordor Intelligence
        - '2026'
        - 全球
        - $7.88B (2026)
        - 未披露
        - 订阅制市场研究模型，研究窗口为 2020-2031
        - 中
        - 单年快照数据；底层年复合增长率（CAGR） / 方法未公开
      - - Arizton
        - 2024 -> 2030
        - 全球
        - $8.43B (2024) -> $19.66B (2030)
        - 15.15%
        - 乐观情景模型，明确给 AI 超大规模主电源加权，不只是备用电源
        - 中
        - 四个估算中最高；可能重复计入燃料电池 / 涡轮 OEM 收入
      - - Precedence Research
        - 2024 -> 2034
        - 全球
        - $8.61B (2024) -> $17.33B (2034)
        - ~7.25%（隐含）
        - 市场研究模型；引用北美约 38% 份额
        - 中
        - 预测窗口 10 年，长于同业，直接比较年复合增长率（CAGR）更难
      - - Introl / Goldman Sachs（燃料电池代理指标）
        - 2025 年 10 月 - 2026 年 1 月交易；2030 年容量预测
        - 全球（美国权重更高）
        - 已绑定交易 $7.65B；到 2030 年容量 8-20 GW
        - 不适用
        - 交易流跟踪 + Goldman Sachs 容量预测
        - 中
        - 燃料电池是相邻但不完全相同的 BTM 技术；口径是 GW，不是以美元计的总可用市场（TAM）
      - - Cleanview BTM 追踪器
        - 2025-2026
        - 美国
        - 59 个项目宣布的 BTM 容量约 90 GW
        - 不适用
        - 自下而上的项目级追踪器，覆盖已宣布 / 在建 BTM 交易
        - 中
        - 容量（GW），不是收入；包含所有 BTM 燃料，不只是燃气
      - - VoltaGrid 披露的项目管线（公司代理指标）
        - 2027-2029
        - 北美（Texas 权重更高）
        - 约 7.2 GW 项目管线
        - 不适用
        - 公司在会议访谈中披露，不是经审计的订单储备明细
        - 低
        - 没有公开的每 MW 定价；若不加入未经验证的定价假设，无法换算成以美元计的总可用市场（TAM）
    notes: >-
      所有数值都来自分析师或追踪器估算，不是经审计的公司财务。表中混合了美元市场规模估算 （第 1-4 行）、美元 + GW 的相邻技术交易流代理指标（第 5 行），以及仅按 GW 计的容量 追踪器（第 6-7
