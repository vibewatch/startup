      - number: '5.4'
        title: 部署、集成、可靠性与路线图
        blocks:
          - type: paragraph
            body: >-
              公司案例研究记录了具体部署：一个 70+ MW 多站点油田微电网，配套 15 miles 输电线和三个 CNG 站 (CE020)；以及 Gulf Coast 飓风损坏七条输电线后的 30+ MW
              公用事业恢复供电 (CE021)。独立行业媒体给出了营销页不会披露的颗粒度：Texas Midland 的微电网通过定制移动变电站，把 70 MW 分到一条 40 MW ESP 生产线和一条 30 MW
              e-frac 线 (CE022)；VoltaGrid 的移动发电机帮助 xAI 在约 122 天内撑起 Memphis Colossus 数据中心，2024 年 8 月先上 14 x 2.5 MW
              机组，之后扩到约 35 台，直到电网变电站允许部分退役 (CE023, CE024, CE025)。一位 VoltaGrid 高管曾把 Texas 21 天完成 200 MW 空气许可周转作为部署速度基准
              (CE026)。路线图从 2024 年 12 月与 Diamondback Energy 和 Halliburton 的 Permian e-frac 扩张 (CE027)，延伸到 2025 年 1 月
              INNIO QPac 发布 (CE028)，再到排期至 2028 年的 INNIO 和 ABB 订单增长 (CE051, CE052)，以及与 Halliburton 的 400 MW Eastern
              Hemisphere 承诺 (CE053)。
