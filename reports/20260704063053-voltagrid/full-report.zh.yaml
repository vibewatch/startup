        - Energy Transfer 为 San Marcos, TX 园区最高 1.2 GW BTM 电力提供 10 年天然气供应
        - 独立 AI / 超大规模数据中心开发商
        - 直接向中游供应商自采 BTM 燃气供应，而不是签约电力即服务供应商
        - 需求侧信号，说明聘用 VoltaGrid 之外还有内部自建替代路径；是否会向第三方转售电力尚不清楚
