      - number: '1.3'
        title: 融资历史、估值、累计融资、投资方与债务 / 信贷
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid 披露的资本历史从 2021 年 12 月由 CPP Investments、Longbow Capital、Pilot Company 和 Walter Ventures 支持的 $100
              million（$127.2 million CAD）股权融资开始，经 2023 年第三季度 $210 million 后续股权融资，延伸到 2026 年 5 月 11 日宣布的 $1.0 billion
              战略股权投资；该轮来自 Blackstone Tactical Opportunities（约占资本 90%）和 Halliburton Company（$775 million 新股加 $225 million
              老股购买），财经媒体报道称其隐含估值超过 $10 billion。逐项相加，已公告的股权轮次对应约 $1.085 billion 已披露新股 / 后续股权融资，但 Tracxn 独立跟踪的总额仅显示四轮约
              $875 million——本章把这个调和缺口视为未解决的冲突数据点，而不是强行给出单一数字。债务与股权同步放大：2024 年 3 月完成 $500 million 五年期定期贷款，另有 $50 million
              accordion 和 $100-150 million 循环信贷（Kennedy Lewis、Blue Torch Capital、CPPIB Credit Investments 及银行银团），随后 2025
              年 11 月完成 $5.0 billion 综合融资包（$2.0 billion 高级有担保第二留置权票据加 $3.0 billion 资产支持融资，由 Goldman Sachs 牵头）。2026 年 5
              月融资还为收购供应商 Propell Energy Technology Ltd. 的最终协议提供资金；收购价格仍未披露。
