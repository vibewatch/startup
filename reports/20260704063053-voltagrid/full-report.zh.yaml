      - number: '8.5'
        title: 建议、置信度与风险评级
        blocks:
          - type: paragraph
            body: >-
              本章建议是观察（research-more），而不是买入或回避。置信度为中：底层融资事实（轮次规模、日期、投资人、债务结构）在多个独立来源之间相互印证，置信度高；但估值判断本身取决于一个未经审计、来自公司和
              Fitch 的 2028 年 EBITDA 目标，因此整体置信度无法升到高。风险评级为高，驱动因素包括仍在推进的 Georgia Clean Air Act 执法请求、约 $5.5 billion
              有担保债务对着未验证的盈利基数、固定价格合同上未披露的天然气价格套保，以及两个具名超大规模客户的集中度。估值立场偏高：隐含 ~9x 股权价值 / 2028E EBITDA（~13-14x 远期
              EV/EBITDA）相对当前公开可比公司并不极端，但那些可比公司基于经审计数字交易，VoltaGrid
              不是。因此，倍数看似合理，前提是本章无法独立验证的输入成立。本章的质量标准明确反对在估值输入缺失时制造虚假的精确感，所以结论是观察，而不是给出数字价格目标：现有持有人确实有经过资方背书的真实抵押物可指向，但新资本应等到经审计财务、Propell
              收购价和 Georgia EPD 结果出来后，再以更高置信度承销这个价格。
            claimRefs:
              - CV002
              - CV008
              - CV032
              - CV011
