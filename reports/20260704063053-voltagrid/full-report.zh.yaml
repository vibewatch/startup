  - id: TP001
    title: 竞争对手概况表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资（2025-2026）
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - VoltaGrid（参照）
        - 直接 BTM 主电源供应商
        - 2026 年 5 月投后股权估值 $10B；截至 2030 年签约订单储备 7.5 GW
        - 超大规模 AI 园区，ERCOT / Gulf Coast
        - 垂直整合的模块化往复式发动机 BTM 机队，按 20-200+ MW 区块部署
        - 单一燃料（燃气）且区域集中
      - - Enchanted Rock / ERock
        - 直接 BTM 同业（微电网 RaaS）
        - 目标 IPO 估值约 $5B；签约订单储备约 $1.3B；约 400 个站点（2026 年）
        - SMB / 中端市场 + 并网过渡型数据中心
        - 韧性即服务，无客户前期资本开支，500 kW-3.5 MW 模块
        - 模块规模小于 VoltaGrid 的 20-200+ MW 区块
      - - Bloom Energy
        - 直接 BTM 同业（燃料电池）
        - FY2025 收入 $2.02B（+37.3%）；总订单储备约 $20B；Brookfield 承诺 $5B
        - ESG 敏感的超大规模云厂商（Oracle、Equinix、Google）
        - 燃料灵活的固体氧化物燃料电池；部署少于 90 天；现场无燃烧
        - 每 MW 成本高于往复式发动机，功率密度更低
      - - Caterpillar
        - 既有 OEM（设备）
        - Power Generation 销售额同比 +44%（2025 年 Q4）；总订单储备 $51B（+71%）
        - 数据中心发电机组的设备买方、经销商和总包商
        - 经销商网络深；大型发电机组产品线丰富（如 G3520K）；拿下 Monarch Compute Campus 合同
        - 卖设备，不提供托管式电力即服务；客户承担 O&M 和融资
      - - Cummins
        - 既有 OEM（设备）
        - Power Systems 业绩创纪录；2026 年 Q1 公司收入 $8.4B；FY2026 指引上调至 +8-11%
        - 设备买方，包括超大规模云厂商（如 Naver 数据中心）
        - 柴油 / 燃气 / HVO 发电机组产品线广；正在开发微电网和电池储能系统
        - 仅设备模式；未披露长期 BTM 电力即服务合同
      - - Generac
        - 既有 OEM（设备，规模较小）
        - FY2025 C&I 销售额 +5% 至 $1.46B，尽管公司总销售额下降 2% 至 $4.21B
        - 商业 / 工业客户，以及新出现的超大规模数据中心订单
        - 扩大大兆瓦级发电机组产能，包括 Wisconsin 新工厂
        - 公司仍依赖周期性住宅备用发电机需求；数据中心收入未单独披露
      - - GE Vernova
        - 既有 OEM（燃气轮机）
        - Crusoe 的 29 台 LM2500XPRESS 涡轮订单（约 1 GW）；数十亿美元 capex 扩张
        - 公用事业公司和 AI 基础设施开发商（Crusoe、Duke、AWS 合作伙伴）
        - 航改燃气轮机，配 SCR 排放控制，可达 GW 规模
        - 销售对象是超大规模云 / AI 基础设施开发商和公用事业公司；自身不是 BTM 服务竞争者
      - - NRG Energy / LS Power
        - 相邻既有 IPP
        - 企业价值约 $12B 的收购：13 GW 燃气资产 + 6 GW CPower VPP，预计 2026 年 Q1 交割，使 NRG 翻倍至 25 GW
        - 公用事业级 / 并网型超大规模云和 C&I 负荷
        - 并网发电 + 虚拟电厂聚合；LS Power 保留约 10 GW 及其 LSPG 输电平台
        - 主要是并网供电，不是离网模块化 BTM；规模化需要公用事业式资本和并网
      - - Vistra
        - 相邻既有 IPP（核电 / 燃气）
