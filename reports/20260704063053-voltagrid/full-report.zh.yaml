      - number: '2.2'
        title: 市场规模：用多组受约束视角，而不是一个 TAM
        blocks:
          - type: paragraph
            body: >-
              留存来源没有发布专门针对数据中心表后模块化天然气主用电力的单一 TAM、SAM 或 SOM
              数字，因此本章不用一个标题数字，而是使用多组受约束、部分重叠的代理指标。最接近的美元口径代理是全球数据中心发电机市场，四家分析机构给出的 2030 年规模差异很大：Grand View Research
              的基准情景为 $12.98 billion，Mordor Intelligence 认为 2026 年市场为 $7.88 billion，Precedence Research 预计到 2034 年为
              $17.33 billion，Arizton 的 AI 加权乐观情景到 2030 年达到 $19.66 billion——仅 2030 年特定数字之间的差距就超过 50%，本章保留这一矛盾（表 TM002、图
              FM002），而不是挑选赢家。第二组以 GW 计的代理来自相邻燃料电池 BTM 通道，供应商在 2025 年 10 月至 2026 年 1 月期间签署了 $7.65 billion 具约束力的 AI
              数据中心交易，Goldman Sachs 预计到 2030 年燃料电池容量为 8-20 GW。第三组代理是 Cleanview 自下而上跟踪的 59 个美国数据中心，已公告 BTM 容量约 90 GW，其中
              92% 自 2025 年以来公告。最后，VoltaGrid 自身披露的 2027-2029 年约 7.2 GW 发电管线——约占 Cleanview 跟踪基数的
              8%——提供了公司特定锚点，但这是会议披露而非经审计积压订单，也没有公开每 MW 定价，因此若无未经验证的假设，无法转换成美元数字。图 FM001 把这些代理指标作为受约束层级堆叠，而不是严格 TAM 到 SOM
              瀑布，并明确标注美元与吉瓦之间的单位错配。
