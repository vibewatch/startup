callouts:
  - calloutType: strength
    title: Two Live, Multi-Year References Anchor the Adoption Story
    body: Despite heavy reliance on recently signed, still-executing GW-scale contracts, VoltaGrid does have two genuinely live, multi-year named references — the Aethon Energy oilfield e-frac relationship (since 2021) and the xAI Memphis Colossus deployment (since mid-2024) — that independent trade press corroborates as operating rather than merely contracted.
    claimRefs: [CU013, CU014, CU020]
  - calloutType: risk
    title: Contracted Backlog Runs Far Ahead of Confirmed Live Capacity
    body: The >4,350 MW cumulative order book and the 2.3 GW Oracle contract are both real, but both are phased through 2028 rather than delivered today, and VoltaGrid's own newest named site (Serverfarm, Covington) is under construction with only a fraction of its planned engines installed and no final permit, underscoring a persistent gap between backlog headlines and in-service capacity.
    claimRefs: [CU006, CU007, CU016, CU028]
  - calloutType: risk
    title: Retention, Concentration, and Compliance Are Simultaneously Opaque and Contested
    body: VoltaGrid discloses no churn or retention metric for any segment, its two largest data-center contracts together dwarf every other named account, and its newest customer site is the subject of an active Clean Air Act enforcement request — meaning the durability, concentration, and regulatory risk of the customer base are all unresolved at the same time.
    claimRefs: [CU019, CU028, CU033, CU036]
  - calloutType: insight
