  evidenceGaps:
    - type: missing-source
      severity: material
      topic: customer-count
      missingEvidence: An audited or company-disclosed count of active named customers/accounts across the data-center and oilfield segments.
      whyItMatters: Without a customer count, growth claims like the "sixfold increase since founding" narrative cannot be normalized against a denominator, making the underlying unit economics and concentration ratio impossible to verify.
      diligencePath: Request a customer/account register (even anonymized by segment) directly from VoltaGrid or from investor data-room materials during diligence.
      relatedQuestionRefs: [QU008]
    - type: missing-source
      severity: blocking
      topic: retention-durability
      missingEvidence: Net revenue retention, gross revenue retention, or churn figures for any customer segment.
      whyItMatters: Retention data is essential to distinguish a durable, growing customer base from one dependent on a small number of large, recently signed contracts that could churn.
      diligencePath: Request cohort-level NRR/GRR and any churned-account history from the company or from investors with data-room access.
      relatedQuestionRefs: [QU015]
    - type: missing-source
      severity: minor
      topic: retention-durability
      missingEvidence: Any third-party customer review, satisfaction survey, or NPS score for VoltaGrid.
      whyItMatters: The absence of any independent satisfaction signal means diligence must rely entirely on company-selected case studies and partner press releases for qualitative outcome evidence.
      diligencePath: Periodically monitor G2, Capterra, and Gartner Peer Insights, and request internal satisfaction survey data if available; a hit is unlikely given VoltaGrid's industrial B2B model.
      relatedQuestionRefs: [QU016]
    - type: missing-source
      severity: minor
      topic: concentration-channel
      missingEvidence: Public procurement or competitive-tender records showing VoltaGrid winning a formal RFP-based contract.
      whyItMatters: Confirms whether VoltaGrid can win business through formal procurement channels versus only direct relationship-based deals, which affects the durability and repeatability of its sales motion.
      diligencePath: Search state and federal procurement databases and utility/co-op RFP archives for VoltaGrid as an awarded bidder.
      relatedQuestionRefs: [QU023]
    - type: private-evidence-only
      severity: material
      topic: adoption-trajectory
      missingEvidence: Disclosed contract length, pricing, and minimum-volume commitments for the Oracle and Vantage Power Delivery Agreements.
      whyItMatters: Without contract economics, it is impossible to assess the revenue durability or termination risk behind VoltaGrid's two largest named commitments.
      diligencePath: Request underlying PDA terms (redacted if necessary) during a data-room review or via investor-side due diligence.
      relatedQuestionRefs: [QU007]
    - type: enumeration-incomplete
      severity: material
      topic: named customer proof table coverage
      missingEvidence: Confirmation of the exact current MW operating at the xAI Memphis site and the deployed-vs-contracted MW split at the Oracle and Vantage sites.
      whyItMatters: Named customer proof table rows for the largest contracts currently rely on announcement-stage disclosures rather than confirmed in-service capacity, which could overstate real, live adoption if left unchecked.
      diligencePath: Request site-level commissioning records or utility/ERCOT interconnection filings (where applicable) to confirm in-service megawatts per named site.
      relatedTableRefs: [TU003]
      relatedQuestionRefs: [QU013]
