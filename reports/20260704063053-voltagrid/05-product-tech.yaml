company:
  name: VoltaGrid
chapter:
  number: 5
  title: Product & Technology
  summary: VoltaGrid packages third-party INNIO Jenbacher engines and ABB synchronous condensers into a proprietary QPac/StabilAI natural-gas microgrid platform that is genuinely differentiated on deployment speed and now underpins multi-gigawatt Oracle and Vantage data-center contracts, but company-disclosed reliability and emissions figures remain unverified and one active site faces a 2026 Clean Air Act enforcement request.
sections:
- id: product-definition
  title: Product Definition in Customer Workflow Terms
  body: 'VoltaGrid sells behind-the-meter natural-gas power as a managed service rather than as standalone generation hardware: under a Power Delivery Agreement (PDA), VoltaGrid installs, owns, and operates on-site generation while the customer pays a pre-set rate for delivered power over the contract term (CE001). The company positions the same underlying platform two ways in customer workflow terms: as a short-term bridge that covers a data center through a delayed utility interconnection, and as a long-term or permanent on-site prime-power source once a site is built out (CE002). The product line began in electric hydraulic fracturing, where pressure-pumping loads swing from over 16 MWe to under 0.75 MWe within an hour, a duty-cycle problem VoltaGrid''s original mobile generator-and-storage platform was purpose-built to absorb (CE003). Independent trade coverage frames VoltaGrid''s core value proposition as installation speed in power-constrained markets rather than lowest-cost generation,
    a positioning that recurs across every named customer contract discussed later in this chapter (CE004).'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
- id: module-asset-map
  title: Module, Platform, and Asset Map
  body: 'VoltaGrid''s product portfolio spans four distinct modules. QPac is the flagship data-center platform: modular reciprocating-engine nodes of up to 20-25 MW each, built on INNIO Jenbacher engines and combinable up to 200 MW per site under a single minor-source air permit (CE005, CE006). StabilAI is the companion grid-stabilization layer, pairing ABB synchronous condensers and flywheel inertia with prefabricated eHouses to hold voltage within +/-5% and frequency within +/-2% during AI/GPU load swings, without battery storage (CE007). The Access Innovation Portal is the AI-enabled monitoring and dispatch software that gives near-real-time visibility into demand, emissions, and billing across the fleet (CE008). The original hybrid oilfield platform, portable generation, storage, an optional grid tie, and the same Access Innovation Portal, remains in service for E-frac customers (CE009), supported by a patent-pending mobile refrigeration unit and booster compression system that conditions
    field, CNG, LNG, or renewable gas at up to 4.2 MMSCF/day per trailer and strips out natural gas liquids for resale (CE010, CE011). VoltaGrid does not disclose in-house manufacturing of the engines or condensers underlying either module (CE012).'
  claimRefs:
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  - CE010
  - CE011
  - CE012
  tableRefs:
  - TE001
- id: architecture-operating-model
  title: Architecture and Operating Model
  body: 'VoltaGrid''s data-center offering layers fuel supply, prime generation, grid stabilization, and AI-driven dispatch into one operating system. The Oracle deployment''s Energy Transfer pipeline fuel supply and the associated Texas manufacturing and operations job creation illustrate how the fuel and workforce layers connect to a single named contract (CE013, CE014). Deployed sites are monitored from an on-site Command Center paired with a 24/7 Remote Operations Center (CE015). Several engineering choices recur across company materials: QPac''s heat-rejection system vents vertically above data-center HVAC systems to limit cooling interference and land use (CE016); units target roughly 65 dBA at 33 feet to meet siting noise limits (CE017); and the platform is marketed as upgradeable to 100% hydrogen, though no operational hydrogen deployment has been documented (CE018). VoltaGrid also discloses a greater-than-99.9% projected plant-reliability figure that is company marketing rather
    than an independently audited operating statistic (CE019), a distinction that matters because multi-GW, multi-year customer contracts are being underwritten against it.'
  claimRefs:
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
  - CE019
