- id: deployment-integration-reliability-roadmap
  title: Deployment, Integration, Reliability, and Roadmap
  body: 'Company case studies document concrete deployments: a 70+ MW multi-site oilfield microgrid with 15 miles of power line and three CNG stations (CE020), and a 30+ MW Gulf Coast utility restoration after hurricane damage to seven transmission lines (CE021). Independent trade press adds granularity a marketing page would not: a Midland, Texas microgrid splits 70 MW across a 40 MW ESP production line and a 30 MW e-frac line through custom mobile substations (CE022), and VoltaGrid''s mobile generators helped xAI stand up its Memphis Colossus data center in about 122 days, starting with 14 x 2.5 MW units in August 2024 and later growing to roughly 35 units before a grid substation allowed partial retirement (CE023, CE024, CE025). A VoltaGrid executive has cited a 21-day, 200 MW Texas air-permit turnaround as a deployment-speed benchmark (CE026). The roadmap runs from a December 2024 Permian e-frac expansion with Diamondback Energy and Halliburton (CE027) through the January 2025 INNIO
    QPac launch (CE028) to INNIO and ABB order growth scheduled through 2028 (CE051, CE052) and a 400 MW Eastern Hemisphere commitment with Halliburton (CE053).'
  claimRefs:
