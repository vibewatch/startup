    - Staffing scale-up risk as the fleet grows from GW to multi-GW
  - - Site, permitting & interconnect
    - Secures air permits and behind-the-meter or grid-parallel siting
    - State/local air regulators (TCEQ, Georgia EPD) and ERCOT/FERC-PJM rules
    - Active enforcement dispute in Georgia; PJM's new 50 MW BTM netting threshold could constrain future East Coast siting
