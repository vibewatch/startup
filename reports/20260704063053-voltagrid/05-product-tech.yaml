- id: TE005
  title: Workflow / Use-Case Table
  columns:
  - User Job
  - Current Workflow
  - VoltaGrid Solution
  - Measurable Benefit
  - Limitation
  rows:
  - - Data-center developer facing a delayed utility interconnection
    - Wait multiple years for a grid connection before energizing IT load
    - Short-term bridge BTM microgrid under a Power Delivery Agreement
    - Installed "within months"; avoids revenue-delaying grid queue
    - Bridge role ends once utility interconnection completes; no guarantee of continued use
  - - Hyperscale data-center operator needing permanent on-site prime power
    - Build or lease grid capacity in constrained markets such as ERCOT queues
    - Long-term/permanent QPac BTM deployment (Oracle, Vantage)
    - Multi-GW contracted capacity without waiting on utility buildout
    - Full contracted capacity is not yet fully energized; delivery phased through 2028
  - - AI/GPU cluster operator with volatile 40-70% load swings
    - Risk voltage/frequency excursions that can trip sensitive compute hardware
    - StabilAI synchronous-condenser stabilization layer
    - +/-5% voltage and +/-2% frequency deviation without batteries
    - No named independent power-quality test validating the tolerance claims in production
  - - Oilfield operator running electric hydraulic fracturing
    - Diesel-fueled generation with high emissions and fuel-logistics cost
    - Mobile hybrid gas generator plus storage and MRU gas conditioning
    - Multi-year live contracts (Aethon, Chesapeake) since 2021
    - Deployed/utilized capacity per site not independently disclosed
  - - Utility facing storm-damaged transmission/generation assets
    - Risk rolling blackouts to hospitals and schools during restoration
    - Rapid-mobilization microgrid (30+ MW case study)
    - Restored power to critical infrastructure during Gulf Coast hurricane recovery
    - Single anonymized case study; scale/frequency of this use case undisclosed
  - - Remote multi-site oil & gas operator
    - String temporary power lines and generators across scattered well sites
    - Central microgrid with up to 15-mile power lines plus CNG trucking stations
    - 70+ MW delivered across multiple remote sites in one documented case
    - Case-study customer and exact site count not named
  notes: Case-study rows (rows 4-6) draw on anonymized or single-customer company case studies; measurable-benefit figures are company-reported unless otherwise cross-checked against independent trade coverage.
