callouts:
- calloutType: strength
  title: Demonstrated speed-to-power, not just a pitch deck
  body: 'Independent trade press and a named executive quote corroborate rapid deployment: a 122-day xAI data-center build and a 21-day, 200 MW Texas air permit are concrete, if narrowly sourced, evidence that VoltaGrid''s core differentiator is operational rather than aspirational.'
  claimRefs:
  - CE025
  - CE026
  - CE046
- calloutType: risk
  title: Unverified reliability and emissions figures sit next to an active enforcement action
  body: VoltaGrid's greater-than-99.9% reliability and 28-40% GHG-reduction figures are both company-disclosed marketing claims without an identified independent verification source, and one customer site is simultaneously the subject of a June 2026 Clean Air Act enforcement request, a combination that raises the diligence bar on every other unverified technical claim in this chapter.
  claimRefs:
  - CE019
  - CE043
  - CE039
- calloutType: insight
  title: VoltaGrid is a systems integrator, not a hardware manufacturer
  body: Both of VoltaGrid's core hardware layers, INNIO Jenbacher engines and ABB synchronous condensers, are third-party OEM technology that VoltaGrid packages into QPac and StabilAI; the company's edge is integration, software dispatch, and deployment speed rather than proprietary heavy-equipment manufacturing, which concentrates single-source supply risk with two named OEM partners.
  claimRefs:
  - CE012
  - CE050
- calloutType: assumption
  title: Treat company-only reliability and emissions figures as unverified until diligence confirms them
  body: Absent an identified independent audit, model VoltaGrid's plant reliability and emissions-reduction percentages as marketing assumptions rather than underwritten technical facts when assessing multi-GW, multi-year contract risk.
  claimRefs:
  - CE019
  - CE043
