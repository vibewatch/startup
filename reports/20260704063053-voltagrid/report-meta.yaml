companyProfile:
  summary: >-
    VoltaGrid is a Houston-based private energy-infrastructure company founded in 2020 and led by co-founder and CEO
    Nathan Ough. The company started in oilfield electrification and portable natural-gas microgrids, then pivoted its
    QPac and StabilAI platform toward behind-the-meter power for hyperscale and colocation AI data centers. Publicly
    disclosed milestones include a 2.3 GW Oracle contract, a 1+ GW Vantage partnership, a $5.0 billion 2025 debt
    package, and a $1.0 billion May 2026 strategic equity raise from Blackstone Tactical Opportunities and Halliburton
    that implied a valuation above $10 billion. The core underwriting challenge is that this scale narrative is real
    but still sits on sparse audited financial disclosure and live permitting risk.
  foundedDate: '2020-01-01'
  founders:
    - name: Nathan Ough
      role: Co-founder and President & CEO
      background: >-
        Previously co-founded Certarus and worked in Macquarie Capital's Global Energy Investment Banking group before
        starting VoltaGrid.
      claimRefs: [CO010, CO011]
  foundingLocation: Houston, Texas, USA
  headquarters: Houston, Texas, USA
  productSummary: >-
    VoltaGrid sells modular behind-the-meter power systems built around natural-gas reciprocating engines, portable
    energy-storage elements, monitoring software, and grid-stability hardware for AI data centers, industrial sites,
    and oilfield electrification.
  customerFocus: >-
    Hyperscale and colocation data-center operators, large industrial sites, oilfield and mining operators, and other
    customers needing fast-deploy, dispatchable off-grid or grid-parallel power.
  businessModel: >-
    Multi-year power-as-a-service and infrastructure contracts for modular generation capacity, plus related deployment,
    operations, and fuel/logistics support.
  stage: Late-stage private / Series D
  fundingStatus: >-
    Raised a $1.0 billion strategic equity round in May 2026 ($775M primary plus $225M secondary) at an implied
    valuation above $10 billion, after closing a $5.0 billion secured debt package in November 2025.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO010, CO024, CO022, CV002, CV010, CV037]
