  title: Cost-driver and operational-burden table
  columns:
  - Cost driver
  - Evidence
  - Why it matters financially
  - Likely impact
  rows:
  - - Product rejection and counterfeit screening
    - 1.4M+ products rejected; 370K rejected in 2024
    - Shows labor and infrastructure burden of trust
    - Higher operating cost but potentially lower dispute rate
  - - Pre-purchase bad-ask blocking
    - 500K+ bad asks blocked in 2024
    - Fraud prevention starts before order creation
    - Improves trust but requires tooling and monitoring spend
  - - CT scanning and RFID
    - Nearly all electronics orders CT scanned; ~10M RFID tags since 2022
    - Category-specific trust controls raise per-order handling cost
    - Especially relevant for electronics and high-risk goods
  - - Global support / restructuring
    - Repeated layoffs including 40 roles in 2024
    - Signals active pressure to control opex while scaling
    - Could improve efficiency or strain execution
  notes: Trust-heavy marketplaces should be analyzed like operational businesses, not just like software products.
