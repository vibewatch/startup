- id: revenue-model-and-monetization
  title: Revenue Model and Monetization
  body: 'StockX monetizes transactions in more than one way now, and the newer fee structure matters. The legacy Verified Marketplace still depends on transaction and payment-processing fees that vary by item, price, and geography. Listings introduces a different approach: a 3% processing fee, a $3.95 minimum fee, optional $12.50 verification, and at launch no seller fees. That mix makes strategic sense if management is trying to acquire more supply in used and vintage goods, but it also means the public model is harder to normalize into one marketplace take-rate assumption. The monetization design is increasingly portfolio-based rather than singular. On top of that, product features such as AI photo analysis, auto-matching, pricing guidance, and mobile inventory management show that fees are tied to workflow as much as to checkout. The open diligence question is whether these newer modes improve contribution margin or simply widen volume while compressing economics.'
  claimRefs:
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  - CI021
  - CI028
  - CI029
  tableRefs:
  - TI002
  figureRefs:
  - FI003
- id: trust-infrastructure-and-cost-burden
  title: Trust Infrastructure and Cost Burden
  body: 'StockX’s trust layer is operationally impressive, but it is almost certainly expensive. The company says it has rejected more than 1.4 million products worth over $400 million, and its 2025 trust report says 370,000 products were rejected in 2024 while more than 500,000 bad asks were blocked before purchase. It also says nearly all electronics orders undergo CT scanning and that almost 10 million RFID tags have been scanned since 2022. Those statements support the core bull case for authenticity, but they also imply a cost base that includes specialized labor, facilities, imaging, routing, brand-protection work, and support. Modern Retail’s report of repeated layoffs adds a complementary signal: management has been forced to keep tightening the organization even while expanding product scope. The strongest financial interpretation is that trust is not a low-cost software moat here; it is a live operating system whose cost has to be justified by conversion, take rate, and dispute
    avoidance.'
  claimRefs:
  - CI015
  - CI016
  - CI017
  - CI018
  - CI019
  - CI023
  - CI030
  - CI032
  tableRefs:
  - TI003
  figureRefs:
  - FI002
- id: what-publics-do-not-disclose
  title: What Publics Do Not Disclose
  body: The biggest financial problem is not the lack of numbers altogether; it is the lack of underwriteable numbers. Public sources are enough to show that StockX is a scaled marketplace with real traffic, meaningful transaction value, and multiple monetization paths. They are not enough to show gross margin, EBITDA, operating cash flow, fraud-loss rates, cash runway, or preference-stack risk. Even basic comparability is hard because public GMV estimates, revenue estimates, and fee disclosures all come from different lenses. The RealReal’s public filing demonstrates how much more transparent an authenticated-resale operator can be, including gross-margin disclosure, while StockX’s surfaces stay focused on growth, trust, and culture. That gap is the reason financial diligence remains incomplete. Until the company shares current audited statements and category-level economics, StockX’s scale can support interest and market relevance, but not a high-confidence investment conclusion on financial
    quality alone.
  claimRefs:
  - CI024
  - CI025
  - CI026
  - CI027
  - CI031
  - CI033
  - CI034
  - CI035
