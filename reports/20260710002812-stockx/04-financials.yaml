  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: gross margin and ebitda
    missingEvidence: Current gross margin, EBITDA, and operating cash flow by year or quarter.
    whyItMatters: Scale without margin disclosure cannot support valuation or downside underwriting.
    diligencePath: Request audited 2024-2026 financial statements and management accounts.
    relatedQuestionRefs:
    - QI021
  - type: private-evidence-only
    severity: material
    topic: take rate
    missingEvidence: Legacy Verified Marketplace take rate and all-in fee burden by category and geography.
    whyItMatters: GMV only matters if monetization quality is durable and competitive.
    diligencePath: Request GMV, net revenue, and fee yield by category.
    relatedQuestionRefs:
    - QI022
  - type: private-evidence-only
    severity: material
    topic: cash and runway
    missingEvidence: Cash balance, debt, burn, and covenant or preference obligations after the 2021 financing.
    whyItMatters: Late-stage private valuation risk depends heavily on capital adequacy and preference stack.
    diligencePath: Request balance sheet, cap table, debt schedule, and preference waterfall.
    relatedQuestionRefs:
    - QI023
  - type: missing-source
    severity: minor
    topic: fraud loss rate
    missingEvidence: Refund, chargeback, and counterfeit-loss rates as a percent of GMV.
    whyItMatters: Trust costs may be manageable or severe; public data does not resolve that.
    diligencePath: Request fraud-loss bridge and dispute-rate reporting.
    relatedQuestionRefs:
    - QI024
  - type: private-evidence-only
    severity: minor
    topic: category profitability
    missingEvidence: Contribution margin by sneakers, apparel, electronics, collectibles, and listings.
    whyItMatters: Diversification can either improve the model or dilute economics depending on handling cost.
    diligencePath: Request category P&L and variable-cost allocation.
    relatedQuestionRefs:
    - QI025
