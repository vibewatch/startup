- id: TI004
  title: Disclosure gap table
  columns:
  - Missing item
  - Why it matters
  - What public file says now
  - Priority diligence ask
  rows:
  - - Gross margin and EBITDA
    - Needed to judge model quality and downside resilience
    - Not publicly disclosed in reviewed sources
    - Request audited financial statements and margin bridge
  - - Take rate by marketplace mode
    - Needed to compare GMV with revenue quality
    - Verified Marketplace take rate not disclosed
    - Request GMV-to-revenue waterfall by mode and category
  - - Cash balance and runway
    - Needed to assess financing risk and preference pressure
    - Not publicly disclosed in reviewed sources
    - Request balance sheet, debt, and cash runway analysis
  - - Fraud-loss and chargeback rates
    - Needed to quantify trust-cost burden
    - Only activity metrics are public, not loss ratios
    - Request fraud-loss and dispute-reserve data
  - - Category profitability
    - Needed to know whether diversification helps or hurts economics
    - No category P&L is public
    - Request contribution margin by category and geography
  notes: The missing disclosures are exactly the items an investor would need to underwrite value rather than just marketplace relevance.
