chapter:
  number: 4
  title: Financials
  summary: Public evidence supports the view that StockX operates at material marketplace scale, but almost all of the current financial picture is indirect. The company’s last clean official price anchor remains the 2021 $3.8 billion financing, while more recent revenue, traffic, and GMV clues come from trade publications, analytics providers, and product-surface disclosures rather than audited statements.
sections:
- id: historical-anchors-and-scale
  title: Historical Anchors and Scale
  body: 'The cleanest public financial anchor for StockX is still the April 2021 financing. StockX, CNBC, Reuters, and other outlets agree that the company executed a $195 million secondary tender alongside $60 million of fresh primary capital, implying a roughly $3.8 billion valuation. That same company announcement also gave the last clearly attributable operating snapshot from management: more than $400 million of revenue, about $1.8 billion of GMV, and more than 7.5 million trades in 2020. Since then, outsiders have had to rely on indirect signals. Digital Commerce 360 projected roughly $8.04 billion of GMV for 2024, and Grips Intelligence estimated around $1.4 billion of online revenue for 2025. Those later numbers are useful, but they are not audited company financials. The financial question is therefore not whether StockX has real scale; it clearly does. The question is how much of that scale converts into durable margin, cash generation, and controllable risk. That distinction between
    visible scale and invisible quality is the central financial tension in the public file.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI020
  tableRefs:
  - TI001
