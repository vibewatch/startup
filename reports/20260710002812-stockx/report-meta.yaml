  productSummary: Authenticated marketplace experiences across the Verified Marketplace, Listings Marketplace, and emerging live or discovery surfaces, supported by market-pricing data, app-based alerts, verification workflows, and category-specific anti-counterfeit tools.
  customerFocus: Consumer buyers and sellers of premium or culturally relevant goods, including collectors, sneaker and fashion buyers, resellers, and newer used-vintage or collectibles cohorts.
  businessModel: Transaction-fee marketplace model with dynamic fee logic, optional verification on some Listings flows, and monetization tied to price discovery, trust services, and two-sided liquidity.
