  topStrengths:
  - StockX still looks large and relevant, with 20M+ lifetime buyers, 30M+ monthly visitors, and 65M+ lifetime trades in current public claims.
  - The marketplace has expanded beyond sneakers into electronics, trading cards, collectibles, and used-vintage listings, reducing single-category dependence.
  - Public trust disclosures show a serious anti-counterfeit and verification operation rather than a superficial trust-and-safety layer.
  - A roughly $1.4B third-party 2025 revenue estimate suggests real scale even without audited statements.
  topRisks:
  - The best-known valuation mark is still the 2021 $3.8B round, so current fair value remains highly uncertain.
  - Public evidence still does not disclose audited gross margin, EBITDA, fraud-loss reserves, or cap-table mechanics.
  - Legal and trust risks are real, including the Nike litigation docket and repeated complaint patterns around support or dispute handling.
  - Newer product modes may widen the funnel while also increasing condition ambiguity, optional-verification complexity, and support burden.
  - Large competitors such as eBay, GOAT, Whatnot, and Fanatics Collect continue to pressure pricing, trust expectations, and discovery behavior.
  unresolvedGaps:
  - Audited 2025-2026 financial statements, especially gross margin, EBITDA, cash flow, and balance-sheet cash.
  - Current cap table, liquidation preferences, secondaries, and investor-rights structure.
  - Fraud-loss, reserve, dispute, and refund metrics by category and marketplace mode.
  - Cohort retention, seller concentration, repeat purchase, and category-level contribution margin.
  - Hard evidence on whether newer categories and Listings improve or dilute unit economics.
disclaimer: This report is a public-information diligence snapshot prepared as of 2026-07-10. It is not investment advice. Several underwriting-critical inputs remain undisclosed by StockX, especially audited current financials, cap-table mechanics, fraud-loss reserves, and retention data, so any investment decision should be conditioned on direct management diligence and a fuller private data room.
