companyProfile:
  summary: StockX is a private Detroit-based marketplace that started in sneakers and now spans a broader current-culture commerce stack across apparel, accessories, collectibles, trading cards, electronics, and newer used-vintage listings. Public evidence supports a large two-sided network, substantial trust infrastructure, and meaningful category expansion, but disclosure depth still looks late-stage-private rather than public-market ready.
  foundedDate: '2016-01-01'
