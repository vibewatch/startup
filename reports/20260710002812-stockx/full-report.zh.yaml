            body: >-
              简单情景分析比假装知道一个精确当前标记更有信息量。使用第三方 $1.4 billion 收入估计，1.5x 收入倍数意味着约 $2.1 billion 价值，2.0x 意味着约 $2.8 billion，2.7x
              回到大致 2021 年锚点，3.0x 意味着约 $4.2 billion。更高的 4.5x 倍数可到约 $6.3 billion，但在没有经审计利润率，也没有清晰证明 StockX
              这种重信任模式值得接近更强公开平台可比公司的溢价时，这个情景开始显得激进。因此，正确问题不是 2021
              年价格是否「错了」。问题是，此后披露的信息是否足以支撑今天相同或更高的倍数。被审阅的公开记录提示谨慎：信任控制真实存在，增长叙事也可信，但财务质量披露仍过薄，无法消除因不确定性带来的大幅折价。
