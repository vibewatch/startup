  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律和监管风险
        blocks:
          - type: paragraph
            body: >-
              法律风险真实且可见。法院记录显示 Nike 起诉 StockX，这意味着公司的商标、商品呈现和品牌定位选择已经在高关注度场域受到检验，而不只是理论担忧。这很重要，因为 StockX
              的业务依赖品牌信任，也依赖与权利持有人的关系，而这些权利持有人的产品主导平台需求。长期未结的案卷还意味着，即便最终责任可控，管理层注意力和法律成本也可能多年维持高位。公开文件没有披露准备金、保险或和解姿态，所以外部人无法量化完整下行。但一个仍在进行且知名度高的案卷，已经足以把
              IP 和消费者保护风险视为核心尽调领域。投资者不应假设强劲平台增长会让公司免受权利持有人压力，尤其是在平台扩展到新产品模式、并继续积极营销自身信任保证时。
            claimRefs:
              - CR001
