              执行风险偏高，因为 StockX 一边拓宽品类和格式，一边面对仍在移动的竞争场。Modern Retail 的裁员报道和 Crain’s 对 CEO 交接的报道都显示，自 2024
              年以来，组织一直在变化和更紧纪律之间找平衡。与此同时，竞争者从多个方向施压：GOAT 押注转售信任，eBay 押注规模，Fanatics Collect 押注卡牌，Whatnot
              押注直播和社区驱动发现。这很重要，因为 StockX 用来增长的品类，往往也正是竞争者仍在积极创新的品类。如果新产品模式增加
              GMV，却稀释抽成率、增加争议量或压垮支持，公司可能正以错误方式增长。因此，正确的尽调镜头不只是「StockX 能不能扩张？」，而是「StockX 能否在不削弱信任、经济性或组织焦点的前提下扩张？」
