      - number: '7.2'
        title: 运营和信任风险
        blocks:
          - type: paragraph
            body: >-
              StockX 的公开信任指标既让人安心，也让人警惕。安心之处在于，它们显示出严肃的反欺诈控制：数十万个不良挂单被拦截、数十万件商品被拒收、电子产品 CT 扫描、大规模 RFID
              使用。警惕之处在于，同一组披露也证明假货和欺诈威胁仍非常活跃。这不是一个欺诈已被解决、只需维护的业务。它是一门欺诈仍是日常运营战役的生意。Listings
              和可选鉴真通过增加品相模糊性和模式专属预期，让运营图景更复杂。支持和政策页面从另一个方向强化同一点：卖家计划、支付、发货和买家承诺流程都很重要，因为边缘案例处理就是核心产品的一部分。最大未解运营问题是，信任栈只是昂贵，还是足够准确、高效，足以证明其成本和摩擦合理。
