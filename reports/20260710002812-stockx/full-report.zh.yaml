        title: 产品界面和用户流程
        blocks:
          - type: paragraph
            body: >-
              产品已经不再是一条单体球鞋流程。公开材料现在描述的是一组体验：Verified Marketplace 承接核心鉴真交易，Listings Marketplace
              承接二手或独特商品，路线图还包含直播购物语言和更灵活的供给侧参与。Listings 尤其重要，因为它改变了原本的 StockX
              产品边界。公司不再强迫每笔交易进入同一个全新未穿加集中鉴真的格式，而是支持获批卖家的二手商品、可选鉴真和 AI 辅助商品上架。这让平台更容易服务持有非标准库存的卖家，也更容易触达寻找低价位的买家。移动 App
              文案进一步说明，StockX 本质上仍是叠在物流之上的软件产品：价格提醒、市场定价、历史销售数据和库存管理仍是日常界面。运营结论是，StockX 正试图把一个旗舰交易类型，变成同一信任品牌下的一组相关消费体验。
