              公开市场规模应被看作一组镜头，而不是一个精确答案。IntelMarketResearch 估计相关市场价值在 2025 年约 $3.6 billion、2026 年约 $4.6 billion；Measure
              Protocol 则把全球球鞋转售市场放在 $10 billion 以上，并认为仅美国 2025 年就接近 $6
              billion。这些数字不能直接相加，因为市场定义不同，但合在一起说明这个品类已经很大，而且仍在扩张。需求也在多元化。StockX 自己的 2026 Current Culture Index 称，2025
              年有近 200 个品牌创下年度销售纪录；Big Facts 报告则突出交易卡和电子产品的强劲增长。这种模式说明，最初的球鞋套利周期降温时，公司可触达市场仍在变宽。最强结论不是某个精确 TAM
              数字，而是鉴真转售已经成为横跨多个相邻品类的持久消费行为。
