  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和品类范围
        blocks:
          - type: paragraph
            body: >-
              StockX 的相关市场比「球鞋转售」更宽，但比泛电商更窄。公司 2026 年材料一贯把自己放在更大的当代潮流消费世界里：球鞋、服饰、配饰、收藏品、交易卡、电子产品，并通过 Listings
              覆盖二手和复古商品。独立来源也强化了这点的重要性。PLOTT DATA 称 StockX 和 GOAT 是最像市场的转售平台，因为买卖双方通过买卖报价模式清算价格；IntelMarketResearch
              则把同一场域定义为稀缺时尚和收藏品的跨品类市场，而不是仅限鞋履的小众市场。这个区别对尽调很重要，因为相邻品类不只是边上的货架；它们是平台在纯球鞋炒卖成熟后仍能增长的原因之一。因此，边界应定义为高需求文化商品的鉴真二级交易，而不是简单的「线上鞋类销售」或「所有二手零售」。这也解释了为什么不能把整体二手
              GMV 直接当作 StockX 的代理指标：平台只捕捉那部分需求，也就是价格发现和真实性对购买信心至关重要的需求。
