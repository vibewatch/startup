            body: >-
              客户满意度明显分化。官方评价界面偏正面，但独立评价聚合器呈现的是另一种更两极的画面。Trustindex 报告 3,804 条评价的平均分为 3.0，且 1
              星反馈占比很大。Reviews.io、SmartCustomer、Sitejabber 和 RealReviews
              都浮现出同类投诉的不同版本：空箱交付、鉴真失败后订单取消、优惠券失效、疑似假货和令人沮丧的客服互动。Trustpilot 过滤结果显示强正面评价也存在，这正是一个 StockX
              这种规模平台会出现的情况。重要的尽调洞察不是公开评价普遍糟糕，而是负面体验在出问题时集中到支持和争议处理上。这意味着客户信任不只取决于鉴真成功，也取决于公司在鉴真或交付失败之后如何表现。公开轶事噪音很大，但多个评价界面上的模式过于一致，不能忽视。该模式重要，因为平台信任积累缓慢，却可能被少数令人印象深刻的失败案例毁掉。
