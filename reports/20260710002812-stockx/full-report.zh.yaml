            body: >-
              基于公开信息，最站得住脚的结论是继续研究。已有证据足以把 StockX
              视为已具规模、具战略意义的交易市场，也足以借助可比公司和情景数据搭出合理估值区间；但披露还不够，无法把该区间变成高置信度的投资判断。若管理层拿出经审计的当前收入质量、可接受的欺诈与客服损失经济性，以及核心球鞋客群之外持久的品类留存，投资论点会明显改善。反过来，若欺诈损失、客服失败或新品类经济性比公开叙事更差，就连旧有
              $3.8B
              锚点也可能偏高。因此，估值和尽调设计无法拆开。投资人把任何新的估值观点用于决策前，应先拿到股权结构表明细、经审计财务、准备金明细表和分群经济性，再明确测试会击穿投资论点的红线条件。这也是建议明确由流程驱动的原因：决定区间上移还是下移的，应是下一版尽调资料包，而不是当前叙事。
