  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分群和规模
        blocks:
          - type: paragraph
            body: >-
              公开客户图景很宽、移动化明显，并且清楚是双边的。StockX 的 App Store 描述称累计买家超过 20 million、累计卖家超过 2 million、月访问者超过 30 million、累计交易超过
              60 million。这些指标由公司提供，但第三方流量估计和多个平台上的评价量，从方向上强化了它们。Measure Protocol 又提供了有用的分群覆盖：千禧一代和 Gen Z
              主导平台交易量，女性是增长最快的买家群体，可持续性现在也是许多转售用户的主要购买因素。组合起来看，StockX 已不再是服务狭窄球鞋发烧友的小众
              App。它是一个广泛的消费交易平台，客户群包括收藏者、风格导向买家、转售商，以及通过相邻品类或低价上架商品进入的新价值型用户。应把这门生意理解为有规模的消费网络，而不是专业爱好者论坛。
