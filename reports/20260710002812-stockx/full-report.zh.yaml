  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接同业和相邻模式
        blocks:
          - type: paragraph
            body: >-
              StockX 的竞争集合不再是一个篮子。最接近的直接同业仍是 GOAT，后者把自己营销为经过鉴真的文化商品可信目的地，并且仍在球鞋、服饰和配饰上最直接竞争。但更宽的战场现在还包括 eBay
              这样的横向市场、Stadium Goods 这样的精选专门平台、The RealReal 这样的托管型奢侈品转售玩家，以及 Whatnot 和 Fanatics Collect
              这样的直播电商或收藏品专门平台。这些对手的重要性不同。GOAT 争的是品牌重叠和买家意图。eBay 争的是规模、费率和不断扩大的鉴真覆盖。The RealReal 争的是高端配饰和奢侈品信任。Stadium
              Goods 争的是精选球鞋库存。Whatnot 和 Fanatics Collect 争的是收藏者注意力和更新的交易格式。因此，清晰的尽调视角必须比较模式，而不只是比较标识，因为 StockX
              正越来越多地与为不同购物行为而生的平台共享客户和卖家。
