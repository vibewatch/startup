      - number: '8.2'
        title: 公开可比公司框架
        blocks:
          - type: paragraph
            body: >-
              最好的公开区间集合仍是一边看 eBay，另一边看 The RealReal。eBay 提供规模和质量基准：庞大买家基础、巨大挂牌深度、强收入和更高的公开市场倍数。The RealReal
              提供规模较小、但运营负担更重的鉴真转售基准。两者都不能完美匹配 StockX，但合在一起，比泛电商可比公司更好地框定相关空间。eBay 的费率、品类和市值披露显示，投资者如何为多元化、高规模平台付费。The
              RealReal 的公开文件显示，投资者如何为更重运营、以信任为核心的转售模式付费。StockX
              的估值方法大概应落在两极之间，但在确定性上更接近低端，因为当前盈利能力、准备金和资产负债表仍不透明。因此，公开可比公司适合用来搭区间，而不能直接替代私募价值的逐日盯市。
