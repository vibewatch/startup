            body: >-
              需求似乎由不止一种行为支撑。App Store 描述强调市场定价、价格提醒、历史销售数据和卖家库存管理，这些都指向重复参与和价格发现用途，而不是一次性购物。Listings
              通过增加二手和复古库存以及更低价格点，进一步扩大需求基础；StockX 2026
              年洞察页面也显示，客户已经在电子产品、交易卡、足球相关产品和其他爆款品类中活跃。这一点重要，因为它改变了客户扩张的含义。增长不再只是说服更多球鞋买家使用
              StockX；它还要拓宽现有用户回来的理由。不过，公开参与信号应谨慎解读。会话、访问和宽泛 App 描述能说明触达和漏斗顶部兴趣，却不能说明这些用户是否反复转化，也不能说明相邻品类的留存是否和核心市场一样好。
