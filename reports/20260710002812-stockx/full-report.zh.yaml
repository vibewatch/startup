              StockX 的信任层在运营上令人印象深刻，但几乎肯定成本不低。公司称已拒收超过 1.4 million 件、价值超过 $400 million 的商品；2025 年信任报告称，2024 年拒收 370,000
              件商品，并在购买前拦截超过 500,000 个不良挂单。公司还称几乎所有电子产品订单都会接受 CT 扫描，自 2022 年以来已扫描近 10 million 个 RFID
              标签。这些表述支撑真实性的核心乐观逻辑，但也暗示成本底座包括专业人力、设施、影像、路由、品牌保护工作和支持。Modern Retail
              关于多轮裁员的报道给出互补信号：管理层一边扩展产品范围，一边被迫持续收紧组织。最强的财务解读是，这里的信任不是低成本软件护城河；它是一套实时运行的运营系统，其成本必须靠转化、抽成率和争议避免来证明合理。
