  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点及其含义
        blocks:
          - type: paragraph
            body: >-
              公开记录中最干净的估值事实仍然陈旧。StockX 最后一个被广泛报道的价格锚点，仍是 2021 年 4 月、约 $3.8 billion
              的融资，由公司和主要新闻报道共同支持。这个锚点有用，因为它具体，并且与真实资本形成绑定；但它也已经过时，因为它早于当前的品类扩张、信任披露，以及后期私营科技宏观估值正常化阶段。公司 2021
              年公告还包含最后一组由管理层提供的清晰经营快照；后来的 GMV 和收入证据大多来自行业出版物和分析提供商。这意味着，2021
              年估值最好被当作历史参照点，而不是当前答案。好的尽调流程应追问：今天的收入质量、信任负担和品类组合，能否支撑接近旧锚点的价值，还是低于它，或——可能性较小——高于它。
