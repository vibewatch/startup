  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 历史锚点和规模
        blocks:
          - type: paragraph
            body: >-
              StockX 最干净的公开财务锚点仍是 2021 年 4 月融资。StockX、CNBC、Reuters 和其他媒体一致认为，公司在 $60 million 新股资本之外执行了 $195 million
              老股要约交易，隐含估值约 $3.8 billion。同一份公司公告还给出了最后一组可清晰归因于管理层的经营快照：2020 年收入超过 $400 million、GMV 约 $1.8 billion、交易超过
              7.5 million。此后，外部人只能依赖间接信号。Digital Commerce 360 预计 2024 年 GMV 约 $8.04 billion；Grips Intelligence 估计 2025
              年线上收入约 $1.4 billion。这些后续数字有用，但不是经审计公司财务。因此，财务问题不是 StockX
              是否真的有规模；它显然有。问题是这些规模有多少能转化为耐久利润率、现金生成和可控风险。可见规模和不可见质量之间的区别，是公开文件中的核心财务张力。
