            body: >-
              最大客户不确定性是耐久性。公开来源对受众规模、产品宽度和投诉轶事说了很多，却几乎不谈留存。被审阅的来源没有披露复购率、卖家集中度、客户终身价值、地区组合、队列曲线或争议驱动流失。这很重要，因为一个平台可以看起来很大、很相关，同时仍依赖一小群高价值卖家或一次性事件驱动买家。两极化评价也可能只是规模带来的正常副产品，也可能指向更深的支持和信任问题；这一点同样重要。没有内部队列报告，两种解释都仍然可能。正确的尽调动作很直接：索取留存和集中度数据，把它与争议结果和品类组合绑定，再测试来自二手、复古、卡牌和电子产品的新客户队列，是否像传统球鞋基础一样耐久。
