            body: >-
              公开记录中支撑最充分的资本标记仍是 2021 年 4 月交易。StockX 官方材料、CNBC、Reuters 和 Front Office Sports 均一致显示，公司完成 $195 million
              老股要约交易和 $60 million Series E-1 新股，隐含价格约 $3.8 billion。同一批来源也锚定了 2022 年之前的经营跃升：StockX 称其 2020 年收入超过 $400
              million、GMV 为 $1.8 billion、交易超过 7.5 million。更近的公开规模证据没有这么直接。Digital Commerce 360 预计 2024 年 GMV 约 $8.04
              billion，而 2026 年官方界面强调的是品类宽度、平均月访问量 30 million、累计买家 20 million、累计卖家 2
              million，而不是经审计损益表项目。这种模式在后期私营平台公司中常见：公司给出足够数据证明规模，却不足以完整评估利润率韧性、现金生成或价格纪律。尽调上，缺少当前经审计收入和盈利能力，是最大剩余空白。
