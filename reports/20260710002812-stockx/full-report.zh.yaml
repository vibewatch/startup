              最大财务问题不是完全没有数字，而是缺少可承销的数字。公开来源足以说明 StockX
              是有规模的平台，拥有真实流量、有意义交易价值和多条变现路径。它们不足以说明毛利率、EBITDA、经营现金流、欺诈损失率、现金跑道或优先股堆叠风险。即便做基础可比也很难，因为公开 GMV
              估计、收入估计和费率披露来自不同镜头。The RealReal 的公开文件展示了鉴真转售运营商可以有多透明，包括毛利率披露；而 StockX
              的公开界面仍聚焦增长、信任和文化。这一差距正是财务尽调仍不完整的原因。除非公司分享当前经审计报表和品类级经济性，StockX 的规模可以支撑兴趣和市场相关性，却不能单靠财务质量得出高置信度投资结论。
