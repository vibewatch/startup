      - number: '2.4'
        title: 增长驱动和约束
        blocks:
          - type: paragraph
            body: >-
              最清晰的增长驱动是稀缺性、信任、品类扩张和转售优先的消费行为。StockX 自己的 2026 年评论反复强调稀缺性、叙事和社区；IntelMarketResearch 与 Measure Protocol
              又把可持续消费和另类资产行为列为额外需求驱动。但市场也有明显约束。Measure Protocol 认为轻松套利时代已经结束，高于零售价交易的发售减少，利润率远低于 2020-2021
              年高点。IntelMarketResearch 另行指出，假货风险、交易成本和监管复杂性是结构性拖累。竞争行为让这些约束更重要，而不是更不重要：eBay 正在给更多品类做鉴真，GOAT
              持续投入信任基础设施，Whatnot 等直播电商玩家正在训练买家期待更快、更社交化的发现。对 StockX
              来说，增长不太可能来自又一轮爆发式球鞋周期，更可能来自长期执行一组更难的动作：品类扩张、费率纪律和信任守住。
