      - number: '3.2'
        title: 定价、信任和服务模式差异
        blocks:
          - type: paragraph
            body: >-
              鉴真如今已是入场券，但具体机制仍有实质差异。GOAT 称其结合数字审核、机器学习和实物检查，同时也承认并非每件商品都会被实物检查。eBay
              将符合条件的商品送到第三方鉴真设施，并宣传相对较快的检查窗口。Stadium Goods 采用更精选、更像寄售的呈现方式；The RealReal 则押注托管式奢侈品鉴真和服务。Fanatics Collect
              更聚焦卡牌和收藏品，并整合保险库和评级；Whatnot 依赖直播社区发现，而不是 StockX 式的延迟鉴真流程。定价也不同。eBay 披露的运动鞋费率结构通常比用户认为 StockX
              需要承担的全包摩擦更简单、更低。Fanatics Collect 明确从卖家费率上攻击既有玩家。实际含义是，StockX 不能再把「我们做鉴真」当作足够护城河；它需要让信任既更好，也在经济上说得通。
