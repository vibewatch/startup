    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、商业模式和当前规模
        blocks:
          - type: paragraph
            body: >-
              StockX 仍把自己定位为「当代潮流文化的交易平台」，但 2026 年可见的公开界面，已经比最初的球鞋转售故事更宽，也更成熟。当前公司页面、App Store
              描述和信任文案指向同一套核心机制：买家出价或立即购买，卖家挂卖价或立即出售，StockX
              在高需求消费品交易中居中处理价格发现、鉴真和履约。品类版图也明显不止球鞋和街头服饰。官方文案反复提到服饰、配饰、电子产品、收藏品、交易卡，并通过 Listings
              覆盖二手和复古商品。公开规模标记同样有分量，尽管仍是公司自报而非审计数据。StockX 当前宣称累计交易超过 65 million、平均月访问量约 30 million、商品超过 200,000 件、团队约
              1,000 人。组合起来看，公司已经从小众转售工具跨进大型消费交易平台，拥有真实品牌、数据和物流基础设施。
