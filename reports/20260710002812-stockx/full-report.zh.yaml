figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: StockX 的公开故事从 Detroit 市场平台上线，走到创始人主导的交接和多体验扩张。
    data:
      items:
        - date: '2016-01-01'
          label: Detroit 上线
          detail: 公司以潮流文化转售市场平台身份起步。
        - date: '2019-06-01'
          label: Cutler 时代开启
          detail: Scott Cutler 出任 CEO，带公司进入规模化阶段。
        - date: '2021-04-08'
          label: 2021 年融资
          detail: 要约收购加一级市场融资，定下广为引用的 $3.8B 价格锚点。
        - date: '2024-01-01'
          label: 重组
          detail: 公司裁员凸显执行压力和成本纪律。
        - date: '2024-11-08'
          label: 创始人回任 CEO
          detail: 董事会任命 Greg Schwartz 为首席执行官，2025 年生效。
        - date: '2025-06-05'
          label: 信任报告
          detail: StockX 披露大规模商品拒收和反欺诈控制。
        - date: '2026-06-17'
