        title: 买家、用户、付费方和采用路径
        blocks:
          - type: paragraph
            body: >-
              买家地图是双边的，而且高度移动化。需求侧，Measure Protocol 称千禧一代和 Gen Z
              占据大部分平台交易量，女性是增长最快的买家群体，可持续性也越来越成为重要购买因素。供给侧，卖家不再只是兴趣型倒卖者；市场越来越奖励有库存入口、更快物流和声誉的规模卖家。官方产品文案还补充了一个有用的运营细节：StockX
              的买家流程现在分为传统 Verified Marketplace 和更新的 Listings
              Marketplace，后者引入固定处理费、可选鉴真，以及价格更低的二手或复古商品。这显著拓宽了采用路径。买家可以从不同价格带进入，卖家也能上架不适合传统全新未穿格式的商品。换句话说，StockX
              正试图从单一交易原型，转向一组交易原型组合；这应能改善买家获取，但也会让信任和运营更复杂。
