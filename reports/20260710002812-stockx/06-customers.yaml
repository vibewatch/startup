- calloutType: strength
  title: The audience is clearly large and broad
  body: 'StockX’s public customer footprint is large enough to support a serious marketplace thesis: tens of millions of buyers and visitors, multiple category reasons to visit, and clear mobile engagement mechanics.'
  claimRefs:
