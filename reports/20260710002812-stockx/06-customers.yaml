chapter:
  number: 6
  title: Customers
  summary: StockX’s public customer story in 2026 is a mix of undeniable scale and uneven support execution. The company appears to serve a large, mobile, two-sided audience across sneakers and newer categories, but independent review surfaces repeatedly show that trust is won or lost in dispute handling, refunds, and post-purchase support rather than in discovery alone.
sections:
- id: customer-segments-and-scale
  title: Customer Segments and Scale
  body: 'The public customer picture is broad, mobile, and clearly two-sided. StockX’s App Store description claims more than 20 million lifetime buyers, more than 2 million lifetime sellers, more than 30 million monthly visitors, and more than 60 million lifetime trades. Those metrics are company-provided, but they are directionally reinforced by third-party traffic estimates and by the sheer volume of review activity across multiple platforms. Measure Protocol adds a useful segmentation overlay: Millennials and Gen Z dominate platform volume, women are the fastest-growing buyer segment, and sustainability is now a primary purchase factor for many resale users. That combination suggests StockX is no longer a niche app for a narrow sneakerhead cohort. It is a broad consumer marketplace whose customer base includes collectors, style-led shoppers, resellers, and newer value-seeking users entering through adjacent categories or lower-priced listings. The business should be understood as a scaled
    consumer network, not as a specialized enthusiast forum.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU017
  - CU020
  - CU027
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: engagement-demand-and-expansion
  title: Engagement, Demand, and Expansion
  body: Demand appears to be sustained by more than one behavior. The app-store descriptions emphasize market pricing, price alerts, historical sales data, and seller inventory management, which all point toward repeat engagement and price-discovery usage rather than one-time shopping. Listings expands the demand base further by adding used and vintage inventory plus lower price points, while StockX’s 2026 insight pages indicate that customers are now engaging with electronics, trading cards, soccer-related products, and other breakout categories. That matters because it changes what customer expansion means. Growth is no longer only about convincing more sneaker buyers to use StockX; it is also about widening the number of reasons an existing user returns. Still, public engagement signals should be interpreted carefully. Sessions, visits, and broad app descriptions show reach and top-of-funnel interest, but they do not show whether those users convert repeatedly or whether adjacent categories
    retain as well as the core marketplace.
  claimRefs:
  - CU013
  - CU014
  - CU015
  - CU016
  - CU018
  - CU021
  - CU029
  - CU031
  - CU032
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: customer-satisfaction-and-support-execution
  title: Customer Satisfaction and Support Execution
  body: 'Customer satisfaction is clearly mixed. Official review surfaces are positive, but independent review aggregators show a different and more polarized picture. Trustindex reports a 3.0 average across 3,804 reviews, with a very large share of 1-star feedback. Reviews.io, SmartCustomer, Sitejabber, and RealReviews all surface variations on the same complaints: empty-box deliveries, orders cancelled after failed verification, broken vouchers, alleged fake items, and frustrating support interactions. Trustpilot filters show that strong positive reviews also exist, which is exactly what one would expect from a marketplace at StockX’s scale. The important diligence insight is not that public reviews are universally bad; it is that negative experiences cluster around support and dispute handling when things go wrong. That means customer trust depends not just on verification success but on how the company performs after a verification or delivery failure. Public anecdotes are noisy, but
    the pattern across multiple review surfaces is too consistent to dismiss. The pattern matters because marketplace trust compounds slowly but can be destroyed by a few memorable failure cases.'
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
  - CU019
  - CU023
  - CU026
  - CU030
  - CU034
