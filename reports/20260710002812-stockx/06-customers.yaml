- id: TU003
  title: Customer support and complaint themes
  columns:
  - Theme
  - Representative evidence
  - Implication
  - Diligence follow-up
  rows:
  - - Empty-box or delivery disputes
    - Trustindex and Reviews.io examples
    - Support outcome can erase trust quickly
    - Request claim-resolution and refund metrics
  - - Cancelled orders after failed verification
    - Reviews.io examples
    - Verification protects trust but can damage customer satisfaction
    - Request failed-verification recovery flow metrics
  - - Alleged fake or defective products
    - Trustindex / SmartCustomer / Sitejabber anecdotes
    - Counterfeit or quality allegations remain reputation-sensitive
    - Request dispute outcomes and authenticity appeals data
  - - Voucher / live-chat frustration
    - Reviews.io complaints
    - Remediation workflow may feel inconsistent to users
    - Request support response time and escalation metrics
  - - Positive resolution stories
    - Official reviews page, Trustpilot 5-star filter, some Reviews.io entries
    - Not all experiences are negative; issue is consistency
    - Request NPS/CSAT split by dispute type
  notes: Public reviews are anecdotal, but the same complaint clusters appear often enough to be useful as support-risk signals.
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
