  - CU026
- id: TU004
  title: Customer diligence gap table
  columns:
  - Missing metric
  - Why it matters
  - Public status
  - Next request
  rows:
  - - Repeat purchase rate
    - Distinguishes reach from durable behavior
    - Not publicly disclosed
    - Request cohort retention by category and region
  - - Seller concentration
    - Shows whether liquidity depends on a narrow supplier base
    - Not publicly disclosed
    - Request top-seller GMV share and churn
  - - Dispute-driven churn
    - Connects support failures to long-term value loss
    - Not publicly disclosed
    - Request churn and repeat-rate impact after disputes
  - - Geographic customer mix
    - Affects shipping friction and unit economics
    - Not publicly disclosed
    - Request buyer/seller share by region
  - - Segment-level LTV
    - Tests whether new cohorts are economically attractive
    - Not publicly disclosed
    - Request LTV/CAC and repeat frequency by segment
  notes: The unresolved customer questions are mostly about durability and concentration rather than about surface-level awareness.
  claimRefs:
  - CU024
  - CU025
  - CU028
  - CU033
  - CU035
- id: TU005
  title: Named customer proof table
  columns:
  - Named example
  - Source
  - Signal
  - Takeaway
  rows:
  - - Patrick (RealReviews, seller)
    - RealReviews
    - Easy listing, delayed verification queue, payout arrived as promised
    - Seller tooling can work well even when speed lags
  - - Tommy (RealReviews, buyer)
    - RealReviews
    - Bid matched, authentication passed, pristine delivery
    - Core buyer flow can produce high-confidence positive outcomes
  - - Anonymous empty-box complaint
    - Trustindex / Reviews.io
    - Received empty box and felt Buyer Promise did not help
    - Support failures can overwhelm the core trust promise
  - - Adn H. fake-shoe allegation
    - Trustindex
    - Claimed counterfeit KD17s and poor support response
    - Authenticity disputes remain the most reputation-sensitive failure mode
  notes: Coverage is partial because public review surfaces contain thousands of anecdotes; rows were selected to show the main positive and negative experience patterns visible across reviewed sources.
  enumerationScope:
    coverage: partial
    basis: Rows highlight representative buyer and seller narratives from reviewed public customer-review surfaces rather than an exhaustive sample of all public reviews.
