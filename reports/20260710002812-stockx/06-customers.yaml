  - - Seller / reseller
    - Liquidity and payout reliability
    - 2M+ sellers claim; seller features in app copy
    - Supply quality and depth drive the marketplace
  - - Collector / hobby buyer
    - Access to cards, collectibles, and niche goods
    - Category expansion pages and app descriptions
    - Important adjacency for non-footwear growth
  - - Value / used-vintage buyer
    - Lower price points and unique inventory
    - Listings launch materials
    - Potentially incremental rather than cannibalistic cohort
  - - Female and sustainability-minded shopper
    - Style and value with resale-first mindset
    - Measure Protocol demographic signals
    - Likely one of the key growth cohorts
  notes: The customer base is broader than the legacy sneakerhead narrative and now spans several motivations and budget profiles.
