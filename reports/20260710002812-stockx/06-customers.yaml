  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention cohorts
    missingEvidence: Buyer and seller retention by cohort, category, and region.
    whyItMatters: Traffic scale alone cannot prove durable customer value.
    diligencePath: Request cohort dashboards and repeat-purchase curves.
    relatedQuestionRefs:
    - QU021
  - type: private-evidence-only
    severity: material
    topic: seller concentration
    missingEvidence: Share of supply and GMV from top sellers and top categories.
    whyItMatters: A two-sided marketplace can look broad while depending heavily on concentrated inventory sources.
    diligencePath: Request seller concentration and churn analysis.
    relatedQuestionRefs:
    - QU022
  - type: private-evidence-only
    severity: minor
    topic: nps and support quality
    missingEvidence: Internal NPS/CSAT, ticket backlog, first-response time, and dispute-resolution metrics.
    whyItMatters: Public reviews are noisy proxies for support execution.
    diligencePath: Request CX scorecards and ticket performance data.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: geographic mix
    missingEvidence: Verified buyer and seller distribution by country or region.
    whyItMatters: Cross-border friction can materially affect experience and unit economics.
    diligencePath: Request top-market customer metrics.
    relatedQuestionRefs:
    - QU024
  - type: private-evidence-only
    severity: material
    topic: repeat purchase economics
    missingEvidence: Repeat order frequency, segment LTV, and dispute-driven churn by category.
    whyItMatters: The most important customer question is not reach but durability of behavior.
    diligencePath: Request retention and LTV/CAC analysis by category and cohort.
    relatedQuestionRefs:
    - QU025
