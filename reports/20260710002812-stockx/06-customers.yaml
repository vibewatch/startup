    - 20M+ buyers; 2M+ sellers
    - Large two-sided installed base
    - Company-app copy rather than audit
  - - Monthly visitors
    - 30M+ visitors
    - Broad top-of-funnel reach
    - Does not equal high-frequency repeat
  - - Market-pricing features
    - Alerts, historical sales, market pricing
    - Users likely revisit for discovery and timing
    - No public engagement curve
  - - Listings expansion
    - Used/vintage inventory and optional verification
    - Can widen budget and style reach
    - Still early and gated by approved sellers
  - - Category expansion
    - Electronics, cards, soccer, breakout goods
    - More reasons to visit beyond sneakers
    - No category retention data
  notes: Public demand signals show reach and breadth, but not cohort durability.
