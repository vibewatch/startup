    - Primary retail sneaker sales and unverified local resale
    - Collectors, enthusiasts, fashion buyers, flippers
    - Core category and trust anchor
  - - Streetwear / apparel resale
    - Limited-release apparel, accessories, and brand-led drops
    - Generic mass apparel resale without scarcity premium
    - Style-led shoppers and brand-community buyers
    - Important adjacency with overlap to sneakers
  - - Collectibles / trading cards
    - Authenticated collectible and trading-card transactions with market pricing
    - Card-shop retail and unverified peer swaps
    - Collectors, hobbyists, gift buyers, speculators
    - Fast-growing cultural adjacency
  - - Electronics / used-vintage listings
    - High-demand electronics plus newer used and vintage listings
    - General secondhand marketplaces without StockX trust layer
    - Value seekers, creators, nostalgia buyers
    - Shows why the boundary is broader than deadstock shoes
  notes: Rows define the market around authenticated current-culture resale rather than all used retail or all ecommerce.
