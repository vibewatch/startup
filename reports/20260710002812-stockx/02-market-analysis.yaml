    - Request category-level premium and conversion data by release type
  - - Sustainability and value-seeking
    - driver
    - current
    - Expand resale-first behavior beyond collectors into mainstream shoppers
    - Request first-time vs repeat buyer mix by value segment
  - - Category expansion into cards, electronics, and used goods
    - driver
    - current to medium term
    - Broadens basket and lowers dependence on new-sneaker cycles
    - Request GMV and take rate by new category
  - - Counterfeit risk and authentication cost
    - constraint
    - current
    - Raises trust burden and can slow fulfillment or compress margins
    - Request false-positive and false-negative verification rates
  - - Margin compression after sneaker hype peak
    - constraint
    - current
    - Reduces reseller enthusiasm and makes fee structure more visible
    - Request current seller profit proxies and inventory-turn data
  - - Horizontal and live-commerce competition
    - constraint
    - current to medium term
    - Forces StockX to compete on both trust and discovery speed
    - Benchmark acquisition and retention against eBay, GOAT, and Whatnot
  notes: The same category can still grow while becoming structurally harder to monetize; that is the key market tension for StockX.
