  evidenceGaps:
  - type: missing-source
    severity: material
    topic: trading card tam
    missingEvidence: A standalone 2026 trading-card resale market estimate specific to authenticated secondary marketplaces.
    whyItMatters: Trading cards are a stated growth category, but public sizing is still embedded inside broader collectibles commentary.
    diligencePath: Request internal category GMV history or paid third-party category estimates.
    relatedQuestionRefs:
    - QM021
  - type: private-evidence-only
    severity: material
    topic: category mix
    missingEvidence: StockX GMV or revenue mix by sneakers, apparel, electronics, collectibles, and trading cards.
    whyItMatters: A broad market looks attractive, but the real upside depends on which categories contribute volume and margin.
    diligencePath: Request category-level GMV, take rate, and contribution margin by year.
    relatedQuestionRefs:
    - QM022
  - type: missing-source
    severity: minor
    topic: geographic segmentation
    missingEvidence: A verified breakdown of StockX demand by country or region for 2025-2026.
    whyItMatters: Geography affects shipping cost, trust friction, and which adjacencies matter most.
    diligencePath: Request top-market GMV, buyers, and sellers by region.
    relatedQuestionRefs:
    - QM023
  - type: conflicting-data
    severity: material
    topic: market sizing
    missingEvidence: A clean reconciled TAM/SAM/SOM methodology rather than stitched-together platform and sector estimates.
    whyItMatters: Current public lenses bracket the market but do not create a single investor-grade addressable-market model.
    diligencePath: Rebuild sizing from internal category GMV and peer category sell-through.
    relatedQuestionRefs:
    - QM024
  - type: private-evidence-only
    severity: minor
    topic: buyer adoption path
    missingEvidence: Conversion by channel, repeat-order cadence, and cart or bid-to-purchase rates by category.
    whyItMatters: Adoption-path economics determine whether adjacent categories are improving or diluting marketplace efficiency.
    diligencePath: Request cohort and funnel reporting by major category.
    relatedQuestionRefs:
    - QM025
