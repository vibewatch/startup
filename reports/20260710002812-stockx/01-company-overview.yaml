  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ownership
    missingEvidence: Current cap table, security terms, and liquidation preferences after the 2021 financing anchor.
    whyItMatters: Board control and preference overhang affect governance and valuation interpretation.
    diligencePath: Request the current cap table, stock ledgers, and board materials.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: current financial scale
    missingEvidence: Audited 2025-2026 revenue, EBITDA, take rate, and free cash flow.
    whyItMatters: Company overview claims can size the marketplace, but not underwrite earning power.
    diligencePath: Request audited financial statements and management KPI packs.
    relatedQuestionRefs:
    - QO022
  - type: missing-source
    severity: material
    topic: locations
    missingEvidence: A complete list of current verification centers and office sites by region.
    whyItMatters: Physical footprint affects delivery speed, fraud control, and fixed-cost intensity.
    diligencePath: Request current facilities list with headcount and throughput by site.
    relatedQuestionRefs:
    - QO023
  - type: private-evidence-only
    severity: minor
    topic: board governance
    missingEvidence: Board committee charters, reserved matters, and director independence map.
    whyItMatters: The public board roster does not show how governance actually works.
    diligencePath: Request board committee composition and governance policies.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO002
  - type: stale
    severity: material
    topic: valuation anchor
    missingEvidence: A newer primary financing or tender data point after the 2021 price anchor.
    whyItMatters: The last widely reported financing predates the current 2026 market environment.
    diligencePath: Request the most recent 409A, financing memo, or secondary pricing evidence.
    relatedQuestionRefs:
    - QO025
