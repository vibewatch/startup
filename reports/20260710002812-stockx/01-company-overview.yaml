company:
  name: StockX
chapter:
  number: 1
  title: Company Overview
  summary: StockX remains a scaled, Detroit-rooted resale marketplace whose public 2026 story combines deep category breadth, a founder-led CEO transition, and meaningful anti-counterfeit investment. The strongest verified facts still point back to the April 2021 financing at about $3.8 billion and to self-reported platform scale, while governance depth and current financial disclosure remain materially incomplete for underwriting.
sections:
- id: identity-business-model-and-scale
  title: Identity, Business Model, and Current Scale
  body: 'StockX still presents itself as the “marketplace of current culture,” but the reviewed 2026 surface is broader and more operationally mature than the original sneaker-resale story. The current company page, app-store descriptions, and trust copy all converge on the same core mechanics: buyers bid or buy now, sellers set asks or sell now, and StockX intermediates price discovery, verification, and fulfillment around high-demand consumer goods. The category footprint is now clearly wider than sneakers and streetwear. Official copy repeatedly includes apparel, accessories, electronics, collectibles, trading cards, and, through Listings, used and vintage items. Public scale markers are also meaningful even if they remain self-reported rather than audited. StockX currently advertises more than 65 million lifetime trades, roughly 30 million average monthly visitors, more than 200,000 products, and roughly 1,000 team members. The combination suggests a company that has already crossed
    from niche resale utility into a large consumer marketplace with real brand, data, and logistics infrastructure.'
  claimRefs:
  - CO001
  - CO002
  - CO008
  - CO009
  - CO010
  - CO020
  - CO021
  - CO028
  figureRefs:
  - FO002
- id: leadership-governance-and-control-points
  title: Leadership, Governance, and Control Points
  body: Leadership is the most important verified governance change in the recent file. StockX announced in November 2024 that co-founder Greg Schwartz would replace Scott Cutler as CEO on January 1, 2025, with Cutler staying on as an advisor. The announcement matters because it returned the company to a founder-led structure after a five-year operating stretch under an experienced marketplace executive. Public materials also show a named board roster rather than a single-founder structure, including Stacy Brown-Philpot, David Krane, Roger Lee, and Hans Tung. That gives investors evidence of institutional oversight, but only to a point. The public file still does not show committee structure, voting controls, reserved matters, or post-2021 ownership concentration. As a result, the board list is useful as a reference map but not enough to underwrite governance quality on its own. Key-person dependence remains significant because Greg Schwartz is simultaneously the clearest public operator,
    co-founder, and current strategic voice.
  claimRefs:
  - CO003
  - CO004
  - CO005
  - CO006
  - CO007
  - CO031
  - CO034
  tableRefs:
  - TO002
  - TO003
- id: funding-history-and-public-metrics
  title: Funding History and Public Metrics
  body: 'The best-supported capital marker in the public record remains the April 2021 transaction. Official StockX materials, CNBC, Reuters, and Front Office Sports all align that the company completed a $195 million secondary tender and $60 million of new Series E-1 primary shares, implying a roughly $3.8 billion price. Those same sources also anchor the pre-2022 operating step-up: StockX said it generated more than $400 million of 2020 revenue, $1.8 billion of GMV, and more than 7.5 million trades. More recent public scale evidence is less direct. Digital Commerce 360 projected roughly $8.04 billion of GMV for 2024, while official 2026 surfaces emphasize category breadth, 30 million average monthly visitors, 20 million lifetime buyers, and 2 million lifetime sellers rather than audited income statement line items. That pattern is common in late-stage private marketplaces: the company gives enough data to signal size, but not enough to fully assess margin durability, cash generation, or
    price discipline. For diligence, the absence of current audited revenue and profitability is the biggest remaining hole.'
  claimRefs:
  - CO011
  - CO012
  - CO013
  - CO015
  - CO020
  - CO030
  - CO032
  tableRefs:
  - TO001
  figureRefs:
  - FO003
- id: milestones-evolution-and-risk-signals
  title: Milestones, Evolution, and Risk Signals
  body: StockX’s recent milestones show a company trying to grow beyond its original new-sneaker core without surrendering the trust layer that made the marketplace distinctive. The 2026 Current Culture Index and the Big Facts report point to broad activity across apparel, trading cards, collectibles, and electronics, while the Listings launch adds a second-hand and vintage pathway that materially changes both the seller experience and the company’s risk profile. That evolution is strategically sensible because it widens supply and buyer entry points, but it also raises operational and reputational complexity. Public reporting confirms a 2024 restructuring that removed about 40 corporate roles, and customer-review surfaces still show complaints around order failures, refund friction, and allegations of authenticity misses. At the same time, StockX’s 2025 trust report shows real investment in fraud controls, including CT scanning for electronics, RFID checks, high-risk routing, and aggressive
    blocking of suspicious asks and accounts. The net picture is a scaled marketplace that has meaningful defensive infrastructure, but still has to prove that category expansion will not dilute trust.
  claimRefs:
