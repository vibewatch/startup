chapter:
  number: 8
  title: Valuation
  summary: StockX’s public valuation case in 2026 can be bracketed, but not cleanly underwritten, because the last precise price anchor is the 2021 $3.8 billion financing while the current operating picture is mostly inferred from third-party revenue and GMV estimates. A cautious scenario range built from public comps and estimated revenue suggests meaningful upside and downside around the old anchor, but disclosure opacity keeps the recommendation at research-more rather than conviction buy.
sections:
- id: valuation-anchor-and-what-it-means
  title: Valuation Anchor and What It Means
  body: The cleanest valuation fact in the public record is still old. StockX’s last widely reported price anchor remains the April 2021 financing at roughly $3.8 billion, backed by both the company and major news coverage. That anchor is helpful because it is concrete and tied to real capital formation, but it is also stale because it predates the current phase of category expansion, trust disclosures, and macro normalization in late-stage private tech. The company’s own 2021 announcement also contained the last clear management-provided operating snapshot, while later evidence on GMV and revenue comes mostly from trade publishers and analytics providers. That means the 2021 valuation is best treated as an historical reference point rather than as a current answer. A good diligence process should ask whether today’s revenue quality, trust burden, and category mix justify a value near that old anchor, below it, or—less likely—above it.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
  - CV027
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: public-comp-framework
  title: Public-Comp Framework
  body: 'The best public bracketing set is still eBay on one side and The RealReal on the other. eBay provides the scale-and-quality benchmark: large buyer base, enormous listing depth, strong revenue, and a richer public-market multiple. The RealReal provides a smaller authenticated-resale benchmark with more operational burden and lower scale. Neither matches StockX perfectly, but together they bracket the relevant space better than generic ecommerce comps. eBay’s fee, category, and market-cap disclosures show what investors pay for a diversified, highly scaled marketplace. The RealReal’s public filings show what investors pay for a more operationally heavy trust-led resale model. StockX’s valuation should probably sit somewhere between those poles in methodology, but closer to the lower end on certainty because its current profitability, reserves, and balance sheet remain opaque. Public comps are therefore useful as a range-building tool, not as a direct mark-to-market substitute for
    private value.'
  claimRefs:
  - CV008
  - CV009
  - CV010
  - CV011
  - CV012
  - CV013
  - CV014
  - CV015
  - CV028
  tableRefs:
