- id: scenario-range-and-discounts
  title: Scenario Range and Discounts
  body: 'Simple scenario work is more informative than pretending to know a precise current mark. Using the third-party $1.4 billion revenue estimate, a 1.5x sales multiple implies about $2.1 billion of value, 2.0x implies about $2.8 billion, 2.7x gets back to roughly the 2021 anchor, and 3.0x implies about $4.2 billion. A richer 4.5x multiple reaches about $6.3 billion, but that case starts to look aggressive without audited margins or clear proof that StockX’s trust-heavy model deserves a premium close to stronger public marketplace comps. The right question is therefore not whether the 2021 price was “wrong.” It is whether enough has been disclosed since then to deserve the same or a higher multiple today. The reviewed public record suggests caution: trust controls are real, growth narratives are plausible, but financial-quality disclosure is still too thin to eliminate a sizable discount for uncertainty.'
  claimRefs:
  - CV021
  - CV022
  - CV023
  - CV024
  - CV025
  - CV026
  - CV030
  - CV031
  - CV039
  - CV040
