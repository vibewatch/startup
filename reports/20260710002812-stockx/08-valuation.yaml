    - Needed to replace indirect traffic/revenue estimates
    - Supports higher-confidence range setting
    - Keeps recommendation at research-more
  - - Fraud-loss and reserve data
    - Directly affects valuation discount
    - Could narrow discount if manageable
    - Could force downside case if severe
  - - Cap table and preferences
    - Determines common-equity value vs headline private mark
    - Clarifies true ownership value
    - Can make old price anchor misleading
  - - Retention and category economics
    - Tests durability of newer growth cohorts
    - Supports bull or base case if strong
    - Supports bear case if shallow or concentrated
  notes: The recommendation changes mostly when these blockers are resolved, not when another anecdotal news story appears.
