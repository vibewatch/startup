    - Replaces indirect revenue and margin estimates
    - Could justify movement toward or above anchor if quality is strong
  - - Fraud-loss and reserve transparency
    - Clarifies trust-cost burden
    - Could narrow discount if losses are controlled
  - - Cap-table and preference detail
    - Separates headline enterprise value from common-equity value
    - Could materially change effective value to common holders
  - - Retention and category-cohort data
    - Tests whether newer growth is durable
    - Could support base/bull case if repeat behavior is strong
  notes: The valuation recommendation should only move materially when one of these information blockers is resolved.
