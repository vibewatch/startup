  - TV004
  figureRefs:
  - FV003
- id: recommendation-and-thesis-breakers
  title: Recommendation and Thesis Breakers
  body: 'The most defensible public conclusion is research-more. There is enough evidence to treat StockX as a scaled and strategically relevant marketplace, and enough peer and scenario data to build a reasonable valuation range, but not enough disclosure to convert that range into a high-confidence underwriting decision. The thesis can improve materially if management shows audited current revenue quality, acceptable fraud and support-loss economics, and durable category-level retention beyond the core sneaker base. The thesis worsens if the opposite is true: if fraud losses, support failures, or new-category economics are worse than the public story suggests, even the old $3.8 billion anchor may prove generous. In that sense, valuation is inseparable from diligence design. Before any fresh valuation opinion is treated as decision-useful, the investor should obtain cap-table detail, audited financials, reserve schedules, and cohort economics, then explicitly test the red-line conditions
    that would break the thesis. That is why the recommendation is explicitly process-driven: the next diligence packet, not the current narrative, should determine whether the range moves higher or lower.'
  claimRefs:
  - CV032
  - CV033
  - CV034
  - CV035
  - CV036
