callouts:
- calloutType: insight
  title: The 2021 price is an anchor, not an answer
  body: The best public price mark for StockX is still the 2021 financing, but too much has changed—and too little has been disclosed since— to treat that old value as current fair value without scenario adjustment.
  claimRefs:
  - CV001
  - CV002
  - CV027
- calloutType: risk
  title: Disclosure opacity deserves a valuation discount
  body: The lack of audited current financials, reserves, and cap-table detail is the single biggest reason public comp math should be treated as a range-building exercise rather than as a precise mark.
