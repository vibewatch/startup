  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited current financials
    missingEvidence: Audited 2025-2026 revenue, gross margin, EBITDA, cash flow, and balance-sheet data.
    whyItMatters: Valuation cannot be underwritten confidently on traffic and revenue estimates alone.
    diligencePath: Request audited statements and management accounts.
    relatedQuestionRefs:
    - QV025
  - type: private-evidence-only
    severity: material
    topic: cap table and preferences
    missingEvidence: Current cap table, liquidation preferences, secondaries, and investor rights.
    whyItMatters: Private-market headline value can differ sharply from common-equity value.
    diligencePath: Request cap table, preference waterfall, and investor agreements.
    relatedQuestionRefs:
    - QV026
  - type: private-evidence-only
    severity: material
    topic: fraud-loss reserves
    missingEvidence: Refund, chargeback, counterfeit-loss, and reserve data by category.
    whyItMatters: Trust-cost burden is a direct multiple driver for an authenticated marketplace.
    diligencePath: Request reserve schedule and fraud-loss bridge.
    relatedQuestionRefs:
    - QV027
  - type: private-evidence-only
    severity: minor
    topic: retention economics
    missingEvidence: Repeat purchase, cohort retention, and seller concentration by category and geography.
    whyItMatters: Marketplace durability matters as much as raw top-line estimates.
    diligencePath: Request cohort and concentration analytics.
    relatedQuestionRefs:
    - QV028
  - type: private-evidence-only
    severity: material
    topic: valuation kill criteria
    missingEvidence: Management-approved red lines for margins, fraud rates, liquidity, and growth by new category.
    whyItMatters: Scenario work needs explicit downside gates, not only narrative judgment.
    diligencePath: Define red-line metrics during diligence and monitor monthly.
    relatedQuestionRefs:
    - QV029
    - QV030
