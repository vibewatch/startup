chapter:
  number: 3
  title: Competitors
  summary: StockX still sits in the front rank of authenticated resale platforms, but its direct and adjacent competitive field is much broader in 2026 than in its early years. GOAT remains the closest brand peer, eBay and The RealReal provide public bracketing comps, and Whatnot plus Fanatics Collect show how category-focused or live-community models can pressure StockX’s moat from the sides.
sections:
- id: direct-peers-and-adjacent-models
  title: Direct Peers and Adjacent Models
  body: StockX’s competitive set is no longer one bucket. The closest direct peer remains GOAT, which markets itself as a trusted destination for authenticated cultural goods and still competes most directly in sneakers, apparel, and accessories. But the wider field now includes horizontal marketplaces such as eBay, curated specialists such as Stadium Goods, managed luxury resale players such as The RealReal, and live-commerce or collectibles specialists such as Whatnot and Fanatics Collect. Those rivals matter for different reasons. GOAT competes on brand overlap and buyer intent. eBay competes on scale, fees, and expanding authentication coverage. The RealReal competes for premium accessories and luxury trust. Stadium Goods competes for curated sneaker inventory. Whatnot and Fanatics Collect compete for collector attention and newer transaction formats. A clean diligence view therefore has to compare models, not just logos, because StockX increasingly shares customers and sellers with
    platforms built for different shopping behaviors.
  claimRefs:
  - CP001
  - CP004
  - CP010
  - CP015
  - CP019
  - CP021
  - CP025
  tableRefs:
  - TP001
  figureRefs:
