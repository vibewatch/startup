- id: TP004
  title: Moat comparison table
  columns:
  - Dimension
  - StockX advantage
  - Where rivals caught up
  - What to measure next
  rows:
  - - Market data / price discovery
    - Bid-ask heritage and resale-price reference brand
    - eBay and Whatnot still shape discovery in adjacent categories
    - Category-level conversion when users see recent-sale data
  - - Authentication / trust
    - Heavy operational verification stack
    - GOAT, eBay, and The RealReal all market trust aggressively
    - False-positive/negative rates and dispute outcomes
  - - Category breadth
    - Sneakers plus expanding adjacent categories
    - eBay and Whatnot already span wider long-tail inventory
    - Share of GMV from non-sneaker categories
  - - Seller economics
    - Brand appeal and liquidity in key categories
    - eBay and Fanatics can undercut on disclosed seller fees
    - Seller retention and multi-homing across platforms
  - - Brand positioning
    - Strong resale-native identity
    - Curated luxury, live community, and card-native brands each own different use cases
    - Net promoter and repeat rates by customer segment
  notes: The moat question in 2026 is execution quality, not just feature existence.
