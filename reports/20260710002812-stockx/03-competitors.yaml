- id: TP002
  title: Pricing and authentication model table
  columns:
  - Platform
  - Authentication design
  - Inspection flow
  - Fee signal
  - Operational implication
  rows:
  - - GOAT
    - Hybrid digital + in-hand + ML
    - Not every item physically inspected
    - Not disclosed in reviewed source set
    - Potentially lower handling cost, but more variability by seller/order type
  - - eBay
    - Third-party category-specific auth
    - Typically about two business days at facility
    - 8% fee on eligible athletic shoes at $150+
    - Balances trust with relatively simple seller economics
  - - StockX
    - Centralized verification plus verified sellers and category-specific controls
    - Routes many orders through StockX facilities; adds CT/RFID in some categories
    - Buyer and seller friction depends on product and marketplace path
    - Operationally heavier but potentially stronger brand-control layer
  - - Fanatics Collect
    - Collectibles-focused trading, grading, vaulting
    - Specialized category workflow
    - 6% qualifying Buy Now seller fee
    - Targets card sellers with fee simplicity and hobby-native tooling
  notes: The competitive wedge is not “authentication vs no authentication”; it is the cost, speed, and credibility of each platform’s trust system.
