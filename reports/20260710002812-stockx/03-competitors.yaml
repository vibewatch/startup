- id: public-comp-scale-and-bracketing
  title: Public-Comp Scale and Bracketing
  body: 'The cleanest public comparables are eBay and The RealReal, but they should be used as brackets rather than as direct twins. eBay is vastly larger: 136 million active buyers, 2.5 billion live listings, $22.2 billion of quarterly GMV, and about $3.1 billion of quarterly revenue. It also carries public-market value around $52 billion and trades at mid-single-digit sales multiples. The RealReal is much smaller, but it offers a useful authenticated-resale comp with first-quarter 2026 GMV of $606 million, revenue of $190 million, and a public valuation a little above $1 billion. Those two endpoints show what investors currently pay for marketplace scale, disclosure, and operating model. StockX likely falls somewhere between them on business-model complexity and brand positioning, but public data does not yet let an outsider determine where it falls on margin quality or liquidity efficiency. That limitation matters because valuation is easier to anchor than competitive quality.'
  claimRefs:
  - CP007
  - CP008
  - CP009
  - CP011
  - CP012
