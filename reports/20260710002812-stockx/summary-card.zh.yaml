  topStrengths:
    - StockX 规模和相关性仍在；当前公开口径称其有 20M+ 累计买家、30M+ 月访问者和 65M+ 累计交易。
    - 市场已经从球鞋扩到电子产品、球星卡、收藏品和二手复古 listings，降低了单一品类依赖。
    - 公开信任披露显示，其反假货和鉴定运营是实打实的能力，而不是表层信任与安全包装。
    - 第三方估计 2025 年收入约 $1.4B，即使没有经审计报表，也说明规模真实存在。
  topRisks:
    - 最广为人知的估值标记仍是 2021 年 $3.8B 轮，当前公允价值仍高度不确定。
    - 公开证据仍未披露经审计毛利率、EBITDA、欺诈损失准备金或股权结构机制。
    - 法律和信任风险真实存在，包括 Nike 诉讼案卷，以及围绕客服或争议处理反复出现的投诉模式。
    - 新产品模式可能扩大漏斗，同时也会增加成色模糊性、可选鉴定复杂度和客服负担。
    - eBay、GOAT、Whatnot 和 Fanatics Collect 等大型竞争者持续挤压定价、信任预期和发现行为。
  unresolvedGaps:
    - 经审计的 2025-2026 年财务报表，尤其是毛利率、EBITDA、现金流和资产负债表现金。
    - 当前股权结构、清算优先权、老股交易和投资者权利结构。
    - 按品类和市场模式拆分的欺诈损失、准备金、争议和退款指标。
    - 队列留存、卖家集中度、复购和品类级贡献利润率。
    - 新品类和 Listings 究竟改善还是稀释单位经济性的硬证据。
