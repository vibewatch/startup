- id: authentication-and-trust-stack
  title: Authentication and Trust Stack
  body: Trust is the heart of the product story, and StockX’s current disclosures make that explicit. The company says it has rejected more than 1.4 million products worth over $400 million, while its 2025 trust report says 370,000 products were rejected in 2024, more than 500,000 bad asks were blocked, and about 90,000 suspicious accounts were stopped. Electronics orders often go through CT scanning, and RFID has become part of the verification stack. That combination of routing, screening, and physical inspection is much more operationally dense than a typical ecommerce trust-and-safety system. It is also no longer unique as a concept. GOAT, eBay, and The RealReal all frame authentication as a core product promise, which means StockX’s advantage depends on the quality and consistency of execution rather than on owning the idea of verification. Public sources prove activity and seriousness; they do not prove accuracy rates or customer-level outcomes by category.
  claimRefs:
  - CE006
  - CE007
  - CE008
  - CE009
  - CE010
  - CE011
  - CE018
  - CE021
