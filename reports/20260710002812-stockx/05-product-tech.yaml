- id: workflow-policy-and-technology-claims
  title: Workflow, Policy, and Technology Claims
  body: A notable product feature of StockX in 2026 is configurability. Fee logic changes by marketplace path, optional verification can be attached on Listings, seller programs shape who can participate in newer supply modes, and shipping or verification timing remains a live part of the user experience. AI photo analysis and pricing guidance show that the company is using software to reduce seller friction, but the help surfaces make clear that policy and logistics still matter just as much. That tension is important. StockX is not a pure SaaS marketplace where code alone determines user success; it is a marketplace where software, operations, and policy constantly interact. The product may feel simple on the front end, but the back end is layered with decisions about risk, seller quality, geography, and delivery timing. From a diligence perspective, that increases the importance of operational ownership, escalation paths, and mode-specific metrics that the public file does not provide.
  claimRefs:
  - CE012
  - CE013
  - CE014
  - CE019
  - CE023
  - CE024
  - CE025
  - CE027
  - CE032
