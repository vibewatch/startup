  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: verification accuracy
    missingEvidence: False-positive and false-negative authentication rates by category and marketplace path.
    whyItMatters: The trust stack is central to the product thesis, but public sources quantify activity rather than accuracy.
    diligencePath: Request QA metrics, appeals data, and dispute outcomes by category.
    relatedQuestionRefs:
    - QE021
  - type: private-evidence-only
    severity: material
    topic: product architecture
    missingEvidence: Internal system architecture, data-pipeline ownership, ML model details, and uptime/SLO reporting.
    whyItMatters: Operationally heavy trust products can break in ways that pure software surfaces do not show.
    diligencePath: Request architecture review and incident history.
    relatedQuestionRefs:
    - QE022
  - type: private-evidence-only
    severity: minor
    topic: listings rollout
    missingEvidence: Geographic and platform roadmap for Listings and Live.
    whyItMatters: Expansion pace determines whether newer product modes can compound or distract.
    diligencePath: Request roadmap and KPI owners by new product line.
    relatedQuestionRefs:
    - QE023
  - type: missing-source
    severity: minor
    topic: security posture
    missingEvidence: Published privacy/security certifications or penetration-test disclosures.
    whyItMatters: Marketplace trust extends beyond counterfeit detection to data and account security.
    diligencePath: Request security compliance package.
    relatedQuestionRefs:
    - QE024
  - type: private-evidence-only
    severity: material
    topic: optional verification economics
    missingEvidence: Attach rate, incremental cost, and margin contribution for optional verification on Listings.
    whyItMatters: Optional trust services may be strategically attractive but economically unclear.
    diligencePath: Request mode-level P&L and conversion impact.
    relatedQuestionRefs:
    - QE025
