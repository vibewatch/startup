chapter:
  number: 5
  title: Product & Tech
  summary: StockX’s product stack in 2026 is materially broader than its original sneaker-authentication flow. Public materials show a platform that now spans Verified Marketplace, Listings, app-led price discovery, and category-specific trust controls such as CT scanning and RFID, but they also show that the company’s product moat remains deeply tied to operational execution rather than to software alone.
sections:
- id: product-surfaces-and-user-flows
  title: Product Surfaces and User Flows
  body: 'The product is no longer one monolithic sneaker flow. Public materials now describe a family of experiences: the Verified Marketplace for core authenticated transactions, Listings Marketplace for used or unique goods, and a broader roadmap that includes live shopping language and more flexible supply-side participation. Listings is especially important because it changes the original StockX product boundary. Instead of forcing every transaction into the same deadstock-and-central-verification format, the company now supports approved-seller used goods, optional verification, and AI-assisted listing creation. That makes the platform more accessible to sellers with non-standard inventory and to buyers seeking lower price points. The mobile app copy reinforces that this is still fundamentally a software product layered on top of logistics: price alerts, market pricing, historical sales data, and inventory management remain the daily interface. The operating conclusion is that StockX
    is trying to turn one flagship transaction type into a suite of related commerce experiences under one trust brand.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE015
  - CE016
  - CE033
  tableRefs:
  - TE001
