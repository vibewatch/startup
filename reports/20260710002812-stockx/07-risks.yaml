  title: Regulatory / legal risk register
  columns:
  - Risk
  - Evidence
  - Potential impact
  - What to request
  rows:
  - - Trademark / IP litigation
    - Nike v. StockX docket on CourtListener
    - Legal cost, settlement, injunction, reputational damage
    - Outside-counsel memo, reserve analysis, and case-status update
  - - Consumer protection / dispute handling
    - Buyer Promise plus public complaint patterns
    - Refund and chargeback exposure, trust deterioration
    - Dispute-rate and refund-policy metrics
  - - Marketing / representation risk
    - Strong authenticity claims across the product surface
    - If product claims overreach, exposure can widen
    - Review legal approvals for trust messaging
  - - Cross-border operational obligations
    - Shipping and payments support topics
    - Regional compliance, VAT, customs, and support complexity
    - Request top-market policy exceptions and complaint mix
  notes: These are the main externally visible legal or quasi-regulatory risk channels in the current public file.
  enumerationScope:
    coverage: exhaustive
    basis: Rows cover the principal legal and regulatory-style risk vectors surfaced in reviewed public sources for the current run.
