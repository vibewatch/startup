chapter:
  number: 7
  title: Risks
  summary: 'StockX’s public downside surface in 2026 is concentrated around trust: legal exposure, counterfeit controls, customer-support execution, and the organizational strain of expanding product modes while keeping the marketplace credible. The business is clearly real, but so are the failure modes, and most of them would hit buyers and sellers simultaneously if they worsened.'
sections:
- id: legal-and-regulatory-risk
  title: Legal and Regulatory Risk
  body: The legal risk is real and visible. Court records show Nike sued StockX, which means the company’s trademark, product-representation, and brand-positioning choices have already been tested in a high-profile forum rather than remaining theoretical concerns. That matters because StockX’s business depends on brand trust and on its relationship to rights holders whose products dominate marketplace demand. A long-lived docket also implies that even if ultimate liability is manageable, management attention and legal cost can stay elevated for years. The public file does not disclose reserves, insurance, or settlement posture, so outsiders cannot quantify the full downside. But the presence of a live, well-known docket is enough to treat IP and consumer-protection risk as a core diligence area. Investors should not assume that strong marketplace growth immunizes the company from rights-holder pressure, especially as the platform expands into new product modes and continues to market its
    own trust guarantees aggressively.
  claimRefs:
  - CR001
  - CR002
  - CR021
  - CR030
  - CR033
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational-and-trust-risk
  title: Operational and Trust Risk
  body: 'StockX’s public trust metrics are both reassuring and alarming. They are reassuring because they show serious anti-fraud controls: hundreds of thousands of bad asks blocked, hundreds of thousands of products rejected, CT scanning for electronics, and large-scale RFID usage. They are alarming because those same disclosures prove how active the counterfeit and fraud threat still is. This is not a business where fraud was solved and moved to maintenance mode. It is a business where fraud remains a daily operating battle. Listings and optional verification make the operating picture more complex by adding condition ambiguity and mode-specific expectations. Support and policy pages reinforce the same point from another direction: seller programs, payments, shipping, and buyer-promise processes all matter because edge-case handling is part of the core product. The biggest unanswered operational question is whether the trust stack is merely expensive or whether it is sufficiently accurate
    and efficient to justify the cost and friction it imposes.'
  claimRefs:
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR012
  - CR013
  - CR020
  - CR022
