- id: TR002
  title: Operational trust-risk table
  columns:
  - Risk driver
  - Public evidence
  - Why it matters
  - Open question
  rows:
  - - Counterfeit volume
    - 370K products rejected; 500K bad asks blocked; 30K suspected fake pairs
    - Fraud remains a live operating battle
    - What are false-positive and false-negative rates?
  - - Category-specific tooling
    - CT scanning for electronics; RFID scale since 2022
    - Controls are costly and category-specific
    - Which categories are most expensive to verify?
  - - Optional verification / used goods
    - Listings and optional trust path
    - May widen funnel but complicate expectations
    - What is dispute rate by marketplace mode?
  - - Policy-heavy operations
    - Seller program, shipping, payments topics
    - Trust depends on processes, not just software
    - How often do policy edge cases create churn?
  notes: Operational risk comes from the combination of fraud pressure, expensive controls, and customer-visible edge cases.
