- id: TR005
  title: Kill criteria table
  columns:
  - Red-line question
  - Why it matters
  - What would fail the thesis
  rows:
  - - Are fraud losses materially worse than implied?
    - Trust is the core product promise
    - Evidence of high counterfeit escapes or costly false positives
  - - Is legal exposure likely to impair operations or valuation?
    - Litigation and brand disputes can spread beyond one case
    - Large reserve need, injunction risk, or adverse rulings
  - - Are support failures causing durable churn?
    - Support is the recovery path when trust breaks
    - High dispute-driven repeat loss or unresolved backlog
  - - Do new product modes dilute economics or trust?
    - Expansion can add GMV but hurt quality
    - Listings/live categories grow but worsen take rate or complaints
  notes: These are the explicit downside gates that should be tested before any positive investment recommendation.
