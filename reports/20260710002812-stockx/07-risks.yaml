- id: reputation-and-customer-risk
  title: Reputation and Customer Risk
  body: The most visible reputation risk is not abstract social-media chatter; it is repeatable complaint patterns across several public review surfaces. Reviews.io, Trustindex, SmartCustomer, Sitejabber, and BBB all surface stories about empty boxes, alleged fake items, broken refund or voucher processes, and frustrating support loops. At StockX’s scale, some volume of unhappy anecdotes is inevitable. The risk signal comes from the consistency of the themes, not from the mere existence of complaints. In other words, the public evidence suggests that when the system works, customers can be happy, but when it breaks, remediation quality becomes the decisive factor. That makes Buyer Promise execution strategically important. If users begin to believe that the company’s post-failure support does not match its pre-purchase trust marketing, the damage can spread quickly across both buyers and sellers. Public review noise should not drive the entire thesis, but it is too correlated to ignore as
    a real risk channel.
  claimRefs:
  - CR010
  - CR011
  - CR023
  - CR030
  - CR035
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: competitive-and-execution-risk
  title: Competitive and Execution Risk
  body: 'Execution risk is elevated because StockX is trying to broaden categories and formats while the competitive field is still moving. Modern Retail’s layoff coverage and Crain’s reporting on the CEO transition both suggest the organization has been balancing change with tighter discipline since 2024. At the same time, competitors are pressing from several directions: GOAT on resale trust, eBay on scale, Fanatics Collect on cards, and Whatnot on live, community-led discovery. This matters because the categories StockX is using for growth are often the same categories where competitors are still innovating aggressively. If new product modes add gross merchandise volume but dilute take rate, increase dispute volume, or overwhelm support, the company could find itself growing in exactly the wrong way. That is why the right diligence lens is not just “can StockX expand?” but “can StockX expand without degrading trust, economics, or organizational focus?”'
