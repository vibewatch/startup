- calloutType: risk
  title: Trust is the entire downside surface
  body: 'Most of StockX’s meaningful risks flow through the same channel: if legal, counterfeit, logistics, or support failures cause users to doubt the trust brand, both sides of the marketplace can weaken at once.'
  claimRefs:
