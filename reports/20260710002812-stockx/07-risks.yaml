  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: authentication error rates
    missingEvidence: False-positive, false-negative, and appeal outcomes by category and marketplace mode.
    whyItMatters: Fraud-control quality is central to the risk thesis but not publicly quantified.
    diligencePath: Request QA metrics and appeals logs.
    relatedQuestionRefs:
    - QR021
  - type: private-evidence-only
    severity: material
    topic: legal reserves
    missingEvidence: Insurance, legal-loss reserves, indemnities, and settlement exposure.
    whyItMatters: IP and consumer disputes can impair value beyond headline press coverage.
    diligencePath: Request legal-reserve memo and outside-counsel summary.
    relatedQuestionRefs:
    - QR022
  - type: private-evidence-only
    severity: material
    topic: verification center economics
    missingEvidence: Fixed cost, utilization, and per-order cost of verification and anti-fraud controls.
    whyItMatters: Trust strength may be economically sound or margin-destructive; public data cannot tell.
    diligencePath: Request ops cost model and unit-cost bridge.
    relatedQuestionRefs:
    - QR023
  - type: private-evidence-only
    severity: minor
    topic: support quality
    missingEvidence: Internal response time, refund, and dispute-resolution performance by issue type.
    whyItMatters: Public anecdotes suggest risk, but internal support metrics are required to quantify it.
    diligencePath: Request CX scorecards and escalation metrics.
    relatedQuestionRefs:
    - QR024
  - type: private-evidence-only
    severity: material
    topic: kill criteria
    missingEvidence: Management thresholds for acceptable fraud loss, dispute rate, and legal exposure by category.
    whyItMatters: Without explicit thresholds, downside scenarios remain too narrative-driven.
    diligencePath: Define red-line metrics during diligence and require monthly reporting.
    relatedQuestionRefs:
    - QR025
    - QR030
