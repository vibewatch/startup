evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ownership
    missingEvidence: Current cap table, security terms, and liquidation preferences after the 2021 financing anchor.
    whyItMatters: Board control and preference overhang affect governance and valuation interpretation.
    diligencePath: Request the current cap table, stock ledgers, and board materials.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: current financial scale
    missingEvidence: Audited 2025-2026 revenue, EBITDA, take rate, and free cash flow.
    whyItMatters: Company overview claims can size the marketplace, but not underwrite earning power.
    diligencePath: Request audited financial statements and management KPI packs.
    relatedQuestionRefs:
      - QO022
  - type: missing-source
    severity: material
    topic: locations
    missingEvidence: A complete list of current verification centers and office sites by region.
    whyItMatters: Physical footprint affects delivery speed, fraud control, and fixed-cost intensity.
    diligencePath: Request current facilities list with headcount and throughput by site.
    relatedQuestionRefs:
      - QO023
  - type: private-evidence-only
    severity: minor
    topic: board governance
    missingEvidence: Board committee charters, reserved matters, and director independence map.
    whyItMatters: The public board roster does not show how governance actually works.
    diligencePath: Request board committee composition and governance policies.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
  - type: stale
    severity: material
    topic: valuation anchor
    missingEvidence: A newer primary financing or tender data point after the 2021 price anchor.
    whyItMatters: The last widely reported financing predates the current 2026 market environment.
    diligencePath: Request the most recent 409A, financing memo, or secondary pricing evidence.
    relatedQuestionRefs:
      - QO025
  - type: missing-source
    severity: material
    topic: trading card tam
    missingEvidence: A standalone 2026 trading-card resale market estimate specific to authenticated secondary marketplaces.
    whyItMatters: >-
      Trading cards are a stated growth category, but public sizing is still embedded inside broader collectibles
      commentary.
    diligencePath: Request internal category GMV history or paid third-party category estimates.
    relatedQuestionRefs:
      - QM021
  - type: private-evidence-only
    severity: material
    topic: category mix
    missingEvidence: StockX GMV or revenue mix by sneakers, apparel, electronics, collectibles, and trading cards.
    whyItMatters: A broad market looks attractive, but the real upside depends on which categories contribute volume and margin.
    diligencePath: Request category-level GMV, take rate, and contribution margin by year.
    relatedQuestionRefs:
      - QM022
  - type: missing-source
    severity: minor
    topic: geographic segmentation
    missingEvidence: A verified breakdown of StockX demand by country or region for 2025-2026.
    whyItMatters: Geography affects shipping cost, trust friction, and which adjacencies matter most.
    diligencePath: Request top-market GMV, buyers, and sellers by region.
    relatedQuestionRefs:
      - QM023
  - type: conflicting-data
    severity: material
    topic: market sizing
    missingEvidence: A clean reconciled TAM/SAM/SOM methodology rather than stitched-together platform and sector estimates.
    whyItMatters: Current public lenses bracket the market but do not create a single investor-grade addressable-market model.
    diligencePath: Rebuild sizing from internal category GMV and peer category sell-through.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: minor
    topic: buyer adoption path
    missingEvidence: Conversion by channel, repeat-order cadence, and cart or bid-to-purchase rates by category.
    whyItMatters: Adoption-path economics determine whether adjacent categories are improving or diluting marketplace efficiency.
    diligencePath: Request cohort and funnel reporting by major category.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: goat share and performance
    missingEvidence: Current GOAT GMV, revenue, and funding disclosures from 2025-2026.
    whyItMatters: GOAT is the closest branded direct peer, so share and economics matter more than qualitative positioning alone.
    diligencePath: Request current GOAT operating metrics from management or paid datasets.
    relatedQuestionRefs:
      - QP021
  - type: private-evidence-only
    severity: material
    topic: stadium goods performance
    missingEvidence: Standalone current GMV, margin, and traffic data for Stadium Goods.
    whyItMatters: Curated sneaker resale competes for premium inventory even if its model differs from StockX.
    diligencePath: Request third-party traffic panel data or ownership-level segment disclosure.
    relatedQuestionRefs:
      - QP022
  - type: missing-source
    severity: minor
    topic: collectibles share
    missingEvidence: Clean market-share splits among StockX, eBay, Fanatics Collect, and Whatnot inside trading cards and collectibles.
    whyItMatters: That category is a key adjacency, but public share data remains patchy.
    diligencePath: Request internal category benchmarking or paid specialist research.
    relatedQuestionRefs:
      - QP023
  - type: private-evidence-only
    severity: material
    topic: seller multi-homing
    missingEvidence: How many high-value sellers list simultaneously across StockX, eBay, GOAT, Fanatics Collect, and Whatnot.
    whyItMatters: Multi-homing determines whether StockX has true liquidity advantages or only temporary brand preference.
    diligencePath: Request seller overlap and churn analysis.
    relatedQuestionRefs:
      - QP024
  - type: missing-source
    severity: minor
    topic: relative acquisition cost
    missingEvidence: Comparable CAC, take rate, and support-cost benchmarks across direct peers.
