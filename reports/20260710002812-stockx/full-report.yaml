      - number: '4.2'
        title: Revenue Model and Monetization
        blocks:
          - type: paragraph
            body: >-
              StockX monetizes transactions in more than one way now, and the newer fee structure matters. The legacy
              Verified Marketplace still depends on transaction and payment-processing fees that vary by item, price,
              and geography. Listings introduces a different approach: a 3% processing fee, a $3.95 minimum fee,
              optional $12.50 verification, and at launch no seller fees. That mix makes strategic sense if management
              is trying to acquire more supply in used and vintage goods, but it also means the public model is harder
              to normalize into one marketplace take-rate assumption. The monetization design is increasingly
              portfolio-based rather than singular. On top of that, product features such as AI photo analysis,
              auto-matching, pricing guidance, and mobile inventory management show that fees are tied to workflow as
              much as to checkout. The open diligence question is whether these newer modes improve contribution margin
