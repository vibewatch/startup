      - number: '2.2'
        title: Sizing Lenses and Demand Shape
        blocks:
          - type: paragraph
            body: >-
              Public sizing must be treated as a set of lenses, not a single precise answer. IntelMarketResearch
              estimates roughly $3.6 billion of relevant market value in 2025 and $4.6 billion in 2026, while Measure
              Protocol puts the global sneaker resale market above $10 billion and the U.S. alone near $6 billion in
              2025. Those numbers are not directly additive because they define the market differently, but together
              they show a category that is already large and still expanding. Demand is also diversifying. StockX’s own
              2026 Current Culture Index says nearly 200 brands hit record annual sales in 2025, while the Big Facts
              report highlights strong trading-card and electronics growth. That pattern suggests the company’s
              addressable market is widening even as the original sneaker-arbitrage cycle cools. The strongest
              conclusion is not an exact TAM figure; it is that authenticated resale has become a durable spending
              behavior across several adjacent product classes.
