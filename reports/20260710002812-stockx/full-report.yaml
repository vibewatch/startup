        title: Customer Satisfaction and Support Execution
        blocks:
          - type: paragraph
            body: >-
              Customer satisfaction is clearly mixed. Official review surfaces are positive, but independent review
              aggregators show a different and more polarized picture. Trustindex reports a 3.0 average across 3,804
              reviews, with a very large share of 1-star feedback. Reviews.io, SmartCustomer, Sitejabber, and
              RealReviews all surface variations on the same complaints: empty-box deliveries, orders cancelled after
              failed verification, broken vouchers, alleged fake items, and frustrating support interactions. Trustpilot
              filters show that strong positive reviews also exist, which is exactly what one would expect from a
              marketplace at StockX’s scale. The important diligence insight is not that public reviews are universally
              bad; it is that negative experiences cluster around support and dispute handling when things go wrong.
              That means customer trust depends not just on verification success but on how the company performs after a
              verification or delivery failure. Public anecdotes are noisy, but the pattern across multiple review
              surfaces is too consistent to dismiss. The pattern matters because marketplace trust compounds slowly but
              can be destroyed by a few memorable failure cases.
