            body: >-
              The biggest customer uncertainty is durability. Public sources say a lot about audience size, product
              breadth, and complaint anecdotes, but very little about retention. No reviewed source discloses
              repeat-purchase rate, seller concentration, customer lifetime value, geography mix, cohort curves, or
              dispute-driven churn. That matters because a marketplace can look large and relevant while still depending
              on a small group of high-value sellers or one-time event-driven buyers. It also matters because polarized
              reviews can either be a normal artifact of scale or a sign of deeper support and trust issues. Without
              internal cohort reporting, both interpretations remain plausible. The correct diligence move is therefore
              straightforward: request retention and concentration data, tie it to dispute outcomes and category mix,
              and then test whether newer customer cohorts from used, vintage, cards, and electronics behave as durably
