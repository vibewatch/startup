      - number: '8.2'
        title: Public-Comp Framework
        blocks:
          - type: paragraph
            body: >-
              The best public bracketing set is still eBay on one side and The RealReal on the other. eBay provides the
              scale-and-quality benchmark: large buyer base, enormous listing depth, strong revenue, and a richer
              public-market multiple. The RealReal provides a smaller authenticated-resale benchmark with more
              operational burden and lower scale. Neither matches StockX perfectly, but together they bracket the
              relevant space better than generic ecommerce comps. eBay’s fee, category, and market-cap disclosures show
              what investors pay for a diversified, highly scaled marketplace. The RealReal’s public filings show what
              investors pay for a more operationally heavy trust-led resale model. StockX’s valuation should probably
              sit somewhere between those poles in methodology, but closer to the lower end on certainty because its
              current profitability, reserves, and balance sheet remain opaque. Public comps are therefore useful as a
              range-building tool, not as a direct mark-to-market substitute for private value.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
