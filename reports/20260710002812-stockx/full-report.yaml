  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct Peers and Adjacent Models
        blocks:
          - type: paragraph
            body: >-
              StockX’s competitive set is no longer one bucket. The closest direct peer remains GOAT, which markets
              itself as a trusted destination for authenticated cultural goods and still competes most directly in
              sneakers, apparel, and accessories. But the wider field now includes horizontal marketplaces such as eBay,
              curated specialists such as Stadium Goods, managed luxury resale players such as The RealReal, and
              live-commerce or collectibles specialists such as Whatnot and Fanatics Collect. Those rivals matter for
              different reasons. GOAT competes on brand overlap and buyer intent. eBay competes on scale, fees, and
              expanding authentication coverage. The RealReal competes for premium accessories and luxury trust. Stadium
              Goods competes for curated sneaker inventory. Whatnot and Fanatics Collect compete for collector attention
              and newer transaction formats. A clean diligence view therefore has to compare models, not just logos,
              because StockX increasingly shares customers and sellers with platforms built for different shopping
              behaviors.
            claimRefs:
