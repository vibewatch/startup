  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Category Scope
        blocks:
          - type: paragraph
            body: >-
              StockX’s relevant market is broader than “sneaker resale,” but it is narrower than general ecommerce. The
              company’s own 2026 materials consistently place it inside the larger world of current-culture commerce:
              sneakers, apparel, accessories, collectibles, trading cards, electronics, and, through Listings, used and
              vintage products. Independent sources reinforce why that matters. PLOTT DATA describes StockX and GOAT as
              the most market-like resale platforms because buyers and sellers clear price through a bid-ask model,
              while IntelMarketResearch sizes the same arena as a cross-category market for scarce fashion and
              collectible goods rather than a footwear-only niche. That distinction is important for diligence because
              the adjacent categories are not just side shelves; they are part of the reason the platform can keep
              growing even as pure sneaker flipping matures. The boundary should therefore be defined as authenticated
              secondary commerce for high-demand culture goods, not simply “online shoe sales” or “all used retail.”
              This is also why general secondhand GMV should not be used as a direct proxy for StockX: the platform only
              captures the subset of demand where price discovery and authenticity are essential to purchase confidence.
            claimRefs:
              - CM003
              - CM013
              - CM014
              - CM021
              - CM023
