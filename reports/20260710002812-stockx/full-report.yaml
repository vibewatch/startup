      - number: '1.4'
        title: Milestones, Evolution, and Risk Signals
        blocks:
          - type: paragraph
            body: >-
              StockX’s recent milestones show a company trying to grow beyond its original new-sneaker core without
              surrendering the trust layer that made the marketplace distinctive. The 2026 Current Culture Index and the
              Big Facts report point to broad activity across apparel, trading cards, collectibles, and electronics,
              while the Listings launch adds a second-hand and vintage pathway that materially changes both the seller
              experience and the company’s risk profile. That evolution is strategically sensible because it widens
              supply and buyer entry points, but it also raises operational and reputational complexity. Public
              reporting confirms a 2024 restructuring that removed about 40 corporate roles, and customer-review
              surfaces still show complaints around order failures, refund friction, and allegations of authenticity
              misses. At the same time, StockX’s 2025 trust report shows real investment in fraud controls, including CT
              scanning for electronics, RFID checks, high-risk routing, and aggressive blocking of suspicious asks and
              accounts. The net picture is a scaled marketplace that has meaningful defensive infrastructure, but still
              has to prove that category expansion will not dilute trust.
