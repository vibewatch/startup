chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Business Model, and Current Scale
        blocks:
          - type: paragraph
            body: >-
              StockX still presents itself as the “marketplace of current culture,” but the reviewed 2026 surface is
              broader and more operationally mature than the original sneaker-resale story. The current company page,
              app-store descriptions, and trust copy all converge on the same core mechanics: buyers bid or buy now,
              sellers set asks or sell now, and StockX intermediates price discovery, verification, and fulfillment
              around high-demand consumer goods. The category footprint is now clearly wider than sneakers and
              streetwear. Official copy repeatedly includes apparel, accessories, electronics, collectibles, trading
              cards, and, through Listings, used and vintage items. Public scale markers are also meaningful even if
              they remain self-reported rather than audited. StockX currently advertises more than 65 million lifetime
              trades, roughly 30 million average monthly visitors, more than 200,000 products, and roughly 1,000 team
              members. The combination suggests a company that has already crossed from niche resale utility into a
              large consumer marketplace with real brand, data, and logistics infrastructure.
