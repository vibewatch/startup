      - number: '2.3'
        title: Buyers, Users, Payers, and the Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is two-sided and highly mobile. On the demand side, Measure Protocol says Millennials and
              Gen Z account for most platform volume, with women as the fastest-growing buyer cohort and sustainability
              as an increasingly important purchase factor. On the supply side, sellers are no longer just hobbyist
              flippers; the market increasingly rewards volume sellers with inventory access, faster logistics, and
              reputation. Official product copy adds a useful operating detail: StockX’s buyer flow now splits between
              the traditional Verified Marketplace and the newer Listings Marketplace, which introduces flat-rate
              processing fees, optional verification, and lower-priced used or vintage goods. That materially broadens
              the adoption path. Buyers can enter at different price points, while sellers can list products that did
              not fit the legacy deadstock format. Put differently, StockX is trying to move from a single transaction
              archetype to a portfolio of transaction archetypes, which should improve buyer acquisition but also
              complicates trust and operations.
