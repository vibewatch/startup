            body: >-
              StockX’s public trust metrics are both reassuring and alarming. They are reassuring because they show
              serious anti-fraud controls: hundreds of thousands of bad asks blocked, hundreds of thousands of products
              rejected, CT scanning for electronics, and large-scale RFID usage. They are alarming because those same
              disclosures prove how active the counterfeit and fraud threat still is. This is not a business where fraud
