      - number: '2.4'
        title: Growth Drivers and Constraints
        blocks:
          - type: paragraph
            body: >-
              The clearest growth drivers are scarcity, trust, category expansion, and resale-first consumer behavior.
              StockX’s own 2026 commentary repeatedly emphasizes scarcity, storytelling, and community, while
              IntelMarketResearch and Measure Protocol add sustainable consumption and alternative-asset behavior as
              additional demand drivers. But the market has obvious constraints. Measure Protocol argues the
              easy-arbitrage era has ended, with fewer releases trading above retail and margins far below the 2020-2021
              peak. IntelMarketResearch separately flags counterfeit risk, transaction costs, and regulatory complexity
              as structural drags. Competitive behavior makes those constraints more important, not less: eBay is
              authenticating more categories, GOAT keeps investing in trust infrastructure, and live-commerce players
              like Whatnot are training buyers to expect faster, more social discovery. For StockX, that means growth is
              less likely to come from one explosive sneaker cycle and more likely to come from executing a harder mix
              of category expansion, fee discipline, and trust preservation over time.
