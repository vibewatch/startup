              The biggest financial problem is not the lack of numbers altogether; it is the lack of underwriteable
              numbers. Public sources are enough to show that StockX is a scaled marketplace with real traffic,
              meaningful transaction value, and multiple monetization paths. They are not enough to show gross margin,
              EBITDA, operating cash flow, fraud-loss rates, cash runway, or preference-stack risk. Even basic
              comparability is hard because public GMV estimates, revenue estimates, and fee disclosures all come from
              different lenses. The RealReal’s public filing demonstrates how much more transparent an
              authenticated-resale operator can be, including gross-margin disclosure, while StockX’s surfaces stay
