  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and Regulatory Risk
        blocks:
          - type: paragraph
            body: >-
              The legal risk is real and visible. Court records show Nike sued StockX, which means the company’s
              trademark, product-representation, and brand-positioning choices have already been tested in a
              high-profile forum rather than remaining theoretical concerns. That matters because StockX’s business
              depends on brand trust and on its relationship to rights holders whose products dominate marketplace
              demand. A long-lived docket also implies that even if ultimate liability is manageable, management
              attention and legal cost can stay elevated for years. The public file does not disclose reserves,
              insurance, or settlement posture, so outsiders cannot quantify the full downside. But the presence of a
              live, well-known docket is enough to treat IP and consumer-protection risk as a core diligence area.
              Investors should not assume that strong marketplace growth immunizes the company from rights-holder
              pressure, especially as the platform expands into new product modes and continues to market its own trust
              guarantees aggressively.
