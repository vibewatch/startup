              Listings and optional verification make the operating picture more complex by adding condition ambiguity
              and mode-specific expectations. Support and policy pages reinforce the same point from another direction:
              seller programs, payments, shipping, and buyer-promise processes all matter because edge-case handling is
              part of the core product. The biggest unanswered operational question is whether the trust stack is merely
