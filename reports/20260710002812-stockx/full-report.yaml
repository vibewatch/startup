      - number: '3.2'
        title: Pricing, Trust, and Service-Model Differences
        blocks:
          - type: paragraph
            body: >-
              Authentication is now table stakes, but the mechanics still differ materially. GOAT says it mixes digital
              review, machine learning, and in-hand checks, while also admitting that not every item is physically
              inspected. eBay routes eligible items through a third-party authentication facility and advertises a
              relatively fast inspection window. Stadium Goods uses a more curated and consignment-like presentation,
              and The RealReal leans into managed luxury authentication and service. Fanatics Collect focuses more
              narrowly on cards and collectibles with integrated vaulting and grading, while Whatnot relies on live
              community discovery rather than a StockX-style delayed verification flow. Pricing also differs. eBay’s
              disclosed fee structure for athletic shoes is often simpler and lower than the all-in friction users
              associate with StockX. Fanatics Collect is explicitly attacking incumbents on seller fees. The practical
              implication is that StockX can no longer rely on “we authenticate” as a sufficient moat; it needs trust to
              be both better and economically justified.
            claimRefs:
