  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments and Scale
        blocks:
          - type: paragraph
            body: >-
              The public customer picture is broad, mobile, and clearly two-sided. StockX’s App Store description claims
              more than 20 million lifetime buyers, more than 2 million lifetime sellers, more than 30 million monthly
              visitors, and more than 60 million lifetime trades. Those metrics are company-provided, but they are
              directionally reinforced by third-party traffic estimates and by the sheer volume of review activity
              across multiple platforms. Measure Protocol adds a useful segmentation overlay: Millennials and Gen Z
              dominate platform volume, women are the fastest-growing buyer segment, and sustainability is now a primary
              purchase factor for many resale users. That combination suggests StockX is no longer a niche app for a
              narrow sneakerhead cohort. It is a broad consumer marketplace whose customer base includes collectors,
              style-led shoppers, resellers, and newer value-seeking users entering through adjacent categories or
              lower-priced listings. The business should be understood as a scaled consumer network, not as a
              specialized enthusiast forum.
