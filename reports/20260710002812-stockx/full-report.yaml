        title: Trust Infrastructure and Cost Burden
        blocks:
          - type: paragraph
            body: >-
              StockX’s trust layer is operationally impressive, but it is almost certainly expensive. The company says
              it has rejected more than 1.4 million products worth over $400 million, and its 2025 trust report says
              370,000 products were rejected in 2024 while more than 500,000 bad asks were blocked before purchase. It
              also says nearly all electronics orders undergo CT scanning and that almost 10 million RFID tags have been
              scanned since 2022. Those statements support the core bull case for authenticity, but they also imply a
              cost base that includes specialized labor, facilities, imaging, routing, brand-protection work, and
              support. Modern Retail’s report of repeated layoffs adds a complementary signal: management has been
              forced to keep tightening the organization even while expanding product scope. The strongest financial
              interpretation is that trust is not a low-cost software moat here; it is a live operating system whose
              cost has to be justified by conversion, take rate, and dispute avoidance.
