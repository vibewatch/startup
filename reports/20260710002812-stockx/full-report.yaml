              remains the April 2021 financing at roughly $3.8 billion, backed by both the company and major news
              coverage. That anchor is helpful because it is concrete and tied to real capital formation, but it is also
              stale because it predates the current phase of category expansion, trust disclosures, and macro
              normalization in late-stage private tech. The company’s own 2021 announcement also contained the last
              clear management-provided operating snapshot, while later evidence on GMV and revenue comes mostly from
              trade publishers and analytics providers. That means the 2021 valuation is best treated as an historical
              reference point rather than as a current answer. A good diligence process should ask whether today’s
              revenue quality, trust burden, and category mix justify a value near that old anchor, below it, or—less
              likely—above it.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV027
