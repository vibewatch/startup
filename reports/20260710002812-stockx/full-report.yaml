      - number: '1.3'
        title: Funding History and Public Metrics
        blocks:
          - type: paragraph
            body: >-
              The best-supported capital marker in the public record remains the April 2021 transaction. Official StockX
              materials, CNBC, Reuters, and Front Office Sports all align that the company completed a $195 million
              secondary tender and $60 million of new Series E-1 primary shares, implying a roughly $3.8 billion price.
              Those same sources also anchor the pre-2022 operating step-up: StockX said it generated more than $400
              million of 2020 revenue, $1.8 billion of GMV, and more than 7.5 million trades. More recent public scale
              evidence is less direct. Digital Commerce 360 projected roughly $8.04 billion of GMV for 2024, while
              official 2026 surfaces emphasize category breadth, 30 million average monthly visitors, 20 million
              lifetime buyers, and 2 million lifetime sellers rather than audited income statement line items. That
              pattern is common in late-stage private marketplaces: the company gives enough data to signal size, but
              not enough to fully assess margin durability, cash generation, or price discipline. For diligence, the
              absence of current audited revenue and profitability is the biggest remaining hole.
