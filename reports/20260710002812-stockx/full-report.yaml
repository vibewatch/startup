            body: >-
              Demand appears to be sustained by more than one behavior. The app-store descriptions emphasize market
              pricing, price alerts, historical sales data, and seller inventory management, which all point toward
              repeat engagement and price-discovery usage rather than one-time shopping. Listings expands the demand
              base further by adding used and vintage inventory plus lower price points, while StockX’s 2026 insight
