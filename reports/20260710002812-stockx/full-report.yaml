      - number: '1.2'
        title: Leadership, Governance, and Control Points
        blocks:
          - type: paragraph
            body: >-
              Leadership is the most important verified governance change in the recent file. StockX announced in
              November 2024 that co-founder Greg Schwartz would replace Scott Cutler as CEO on January 1, 2025, with
              Cutler staying on as an advisor. The announcement matters because it returned the company to a founder-led
              structure after a five-year operating stretch under an experienced marketplace executive. Public materials
              also show a named board roster rather than a single-founder structure, including Stacy Brown-Philpot,
              David Krane, Roger Lee, and Hans Tung. That gives investors evidence of institutional oversight, but only
              to a point. The public file still does not show committee structure, voting controls, reserved matters, or
              post-2021 ownership concentration. As a result, the board list is useful as a reference map but not enough
              to underwrite governance quality on its own. Key-person dependence remains significant because Greg
              Schwartz is simultaneously the clearest public operator, co-founder, and current strategic voice.
