      - number: '4.2'
        title: Unit Economics, Cost Structure, and Operational Margins
        blocks:
          - type: paragraph
            body: >-
              The MicroGEO economic thesis relies on dramatic unit-level manufacturing and deployment cost reductions
              achieved through standardized bus architectures, proprietary Software Defined Radios (SDR), and dedicated
              assembly lines at Historic Pier 70 in San Francisco. Building ~400 kg spacecraft in months rather than
              five or more years compresses capital cycle times. However, full unit economics remain largely obscured
              from public disclosure. Core cost-of-goods-sold components include space-grade components, propulsion
              systems, launch integration via commercial ride-share or dedicated medium-lift vehicles, and orbital
              launch insurance. While hardware manufacturing labor costs are partially visible through technical
              recruiting compensation benchmarks (such as engineering integration associates at $1,925 per week), actual
              bill-of-materials costs, launch vehicle manifest pricing, and post-launch orbital operations expenses are
              unstated. Furthermore, on-orbit component anomalies—such as solar array drive mechanism failures on
              earlier spacecraft—create unhedged warranty or capacity replacement expenses that directly pressure
              realized gross margins.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI004
              - CI007
              - CI010
              - CI011
          - type: figure
            figureRef: FI001
