      - number: '4.3'
        title: Capital Adequacy, Debt Obligations, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Astranis exhibits substantial external financing dependency driven by the high capital intensity of space
              hardware development, orbital deployment cadence, and scaling towards its target of 100 MicroGEO
              satellites by 2030. Cumulative capital raised exceeds $1.2 billion, anchored by a May 2026 financing
              package comprising a $300 million Series E equity round at a $2.8 billion valuation and a $155 million
              delayed-draw credit facility from Trinity Capital. While this financing extends cash runway for
              manufacturing and next-generation Omega platform scaling, debt service on credit facilities and delayed
              milestone payments introduce significant liquidity risk. Disconfirming market evidence underscores
              vulnerability: in June 2026, the US Space Force awarded major protected tactical satcom production orders
              totaling $437.7 million to established legacy primes Viasat and Intelsat rather than Astranis.
              Consequently, underwriting Astranis requires institutional access to non-public audited financials, cash
              burn rates, debt covenants, and satellite delivery yield.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Contracted Multi-Year Commercial Backlog
            body: >-
              Astranis has accumulated more than $1 billion in contracted satellite services backlog across sovereign
              governments, commercial telecoms, and defense primes, establishing validated commercial demand for
              dedicated small-GEO communications capacity.
            calloutType: strength
            claimRefs:
              - CI003
              - CI005
          - type: callout
            title: Government Prime Competition and Defense Procurement Loss
            body: >-
              Despite qualifying for early development phases of military programs of record, Astranis saw the first
              major US Space Force Protected Tactical Satcom production awards worth $437.7 million go to incumbents
              Viasat and Intelsat in June 2026, demonstrating persistent barriers to unseating defense primes.
            calloutType: risk
            claimRefs:
              - CI013
