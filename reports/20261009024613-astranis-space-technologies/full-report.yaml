      - number: '2.3'
        title: Buyer, User, Payer, and Procurement Paths
        blocks:
          - type: paragraph
            body: >-
              The buyer set spans sovereign governments, national or regional telecom operators, enterprises with
              critical-network requirements, U.S. government program offices, and mobility-connectivity operators. End
              users differ from payers: citizens, enterprise sites, warfighters, or passengers consume connectivity,
              while a ministry, agency, carrier, or service operator controls the budget. Preqin describes the
              commercial model as business-to-business fixed contracts under which clients pay for deployment and
              operation over a specified term. This supports a programmatic procurement path rather than direct consumer
              acquisition.


              Budget ownership is only partly public. Sovereign and defense purchases likely sit in infrastructure or
              appropriations budgets, while telecom and mobility purchases likely sit in network capital or long-term
              service budgets; these are analytical inferences, not disclosed customer accounting. An independent
              executive directory identifies a dedicated U.S. Government Programs role, consistent with a separate
              government go-to-market motion. The pool does not disclose procurement calendars, milestone payments,
              cancellation rights, customer ROI, or switching costs, so those inputs require contract and
              customer-reference diligence.
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM016
      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Timing
        blocks:
          - type: paragraph
            body: >-
              Demand is driven by the desire for dedicated control, geographic customization, security, and resilience.
              Astranis says customers are moving away from aging shared GEO systems toward networks they control, and
              its May 2026 financing earmarked up to $155 million of delayed-draw credit for added manufacturing
              capacity. These are company claims, but together with reported contracts they indicate that production
              capacity and customer demand are developing in parallel. Export-controlled staffing is another gating
              input: an Astranis assembly, integration, and test posting requires eligibility under U.S. government
              space-technology rules.


              Adoption timing is constrained by delivery and flight reliability. Astranis reports five satellites on
              orbit, whereas Space Bandits reports only two in commercial service and says Arcturus operates six to
              twelve hours daily after solar-array-drive failures. Space Intel Report's archive also previews an
              Astranis UtilitySat as appearing stalled, although the prefetched excerpt is too limited to quantify
              schedule or customer impact. These signals do not prove fleet-wide reliability, but they make launch
              cadence, insurance, acceptance testing, service-level performance, and contract conversion central
              diligence items before backlog is treated as durable market penetration.
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Bookings Are a Demand Floor, Not a Market Size
            body: >-
              More than $1 billion of satellite services sold and more than 10 contracted satellites demonstrate
              customer demand, but neither metric is revenue, ARR, cash, TAM, SAM, or SOM. Underwriting should preserve
              those denominators and require contract-level conversion evidence.
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
              - CM008
          - type: callout
            title: Delivery Reliability Can Delay Adoption
            body: >-
              The difference between five company-reported satellites on orbit and two independently reported in
              commercial service makes operational acceptance a material adoption filter. Arcturus's reported limited
              daily service further raises the importance of insurance, testing, and customer SLA evidence.
            calloutType: risk
            claimRefs:
