chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Astranis Space Technologies is a private aerospace company founded in 2015 and headquartered in San
              Francisco. Its operating model combines spacecraft design, manufacturing, testing, deployment, and
              operation rather than selling only a satellite bus or only bandwidth. The core commercial proposition is a
              dedicated small-satellite network in GEO: one customer receives controlled capacity over a defined region,
              while the same high-orbit platform is also marketed for government communications, science, and
              positioning, navigation, and timing missions. This positioning is supported by company materials and an
              independent private-markets profile, but product performance, contract economics, and customer-level
              service outcomes require separate diligence. Astranis is at the Series E stage; that label indicates
              financing maturity, not profitability or operational scale by itself.
