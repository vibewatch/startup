  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              Astranis's core market is dedicated high-orbit communications infrastructure: spacecraft, mission
              integration, and operated satellite capacity procured for a defined geography or mission. The company
              identifies large enterprises, sovereign governments, and the U.S. military as customers, while third-party
              coverage adds countries, internet providers, and airline-connectivity operators to the buyer set. Included
              spend should therefore be limited to dedicated satellite hardware and contracted deployment or operations.
              Launch vehicles, user terminals, retail broadband, terrestrial fiber, shared transponder leases, and broad
              defense or space budgets are adjacent or substitute spend rather than Astranis-addressable revenue.


              The relevant status quo is not only another small-GEO spacecraft. Buyers can lease shared GEO capacity,
              procure capacity from LEO or MEO networks, extend terrestrial networks, or defer a sovereign asset
              entirely. A third-party compiler reports MicroGEO unit costs of $15 million to $30 million against $300
              million to $500 million for traditional GEO spacecraft and reports a build-time contrast of months versus
              more than five years. Those figures are useful category benchmarks, not audited pricing or evidence that
              all legacy spend can migrate to Astranis.
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM016
      - number: '2.2'
        title: Evidence-Constrained Market Sizing
        blocks:
          - type: paragraph
            body: >-
              The available pool supports several sizing anchors, but none is a clean TAM. Astranis states that more
              than $15 billion of satellites are launched to GEO annually; that is a broad supply-flow claim covering
              spacecraft outside the company's product and customer boundary. The company also reports more than $1
              billion of satellite services sold and more than 10 satellites under contract. Those figures are
              company-reported bookings or contracted-demand proxies, not recognized revenue, ARR, cash, or market size.
              They nevertheless demonstrate a demand floor that is more relevant than a generic space-economy estimate.


              The unit-cost benchmarks provide a second lens: reported MicroGEO prices of $15 million to $30 million
              versus $300 million to $500 million for traditional GEO spacecraft indicate why a dedicated asset may fit
              smaller sovereign or operator budgets. They do not establish contract price, margin, annual unit demand,
              or win rate. Public evidence in the assigned pool lacks an independent market forecast, CAGR, buyer count,
              replacement schedule, and qualified pipeline conversion. A defensible SAM or SOM therefore remains a
              diligence gap rather than a modeled point estimate.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
