  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument Type
      - Core Thesis / Anti-Thesis Point
      - Supporting Evidence
      - What Would Change the View
    rows:
      - - Thesis
        - MicroGEO cost and deployment speed disrupt legacy GEO satellite manufacturing.
        - ~400 kg satellites built in months at $15M–$30M vs legacy $300M–$500M multi-ton GEO satellites.
        - Failure of small-GEO economics or sustained cost overruns on next-generation Omega platform.
      - - Thesis
        - Strong commercial demand for sovereign dedicated orbital connectivity.
        - Contracted commercial backlog exceeding $1B across multiple international customers and operators.
        - Customer churn, sovereign contract cancellations, or inability to convert backlog into recognized revenue.
      - - Thesis
        - Elite institutional and strategic investor syndicate provides robust runway.
        - >-
          Over $1.2B in cumulative capital raised, including $300M Series E equity and $155M credit facility in May
          2026.
        - Liquidity exhaustion driven by delayed satellite deployments and heavy manufacturing capital expenditure.
      - - Thesis
        - Sovereign telecom partnerships validate regional satellite demand.
        - Strategic agreements with Chunghwa Telecom (Taiwan), MB Group (Oman), and stc group (Saudi Arabia).
        - Geopolitical realignments or national budget constraints prompting sovereign partner disengagement.
      - - Anti-Thesis
        - On-orbit operational anomalies challenge micro-satellite reliability thesis.
        - Arcturus solar array drive failure limiting active operational hours and stranded orbital transfer spares.
        - Demonstrated multi-year anomaly-free operational flight records across full fleet deployments.
      - - Anti-Thesis
        - Defense prime competition and contract allocation risk.
        - >-
          First Space Force Protected Tactical SATCOM production orders ($437.7M) awarded to legacy primes Viasat and
          Intelsat in June 2026.
        - Direct prime production awards under major Space Force programs of record such as PTS-G or Resilient GPS.
    notes: Synthesizes primary operational catalysts against documented technical and market headwinds as of October 2026.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV007
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key Assumptions
      - Implied Valuation Logic
      - Key Risks
      - Probability Signal
    rows:
      - - Bull
        - >-
          Flawless deployment of 10+ satellites on contract; Omega platform achieves >50 Gbps throughput; commercial
          backlog scales past $1.5B; prime defense awards expand.
        - >-
          Expansion to $4.5B–$6.0B valuation based on high-margin satellite operating cash flow and 10x–12x revenue
          multiples on recognized revenue.
        - Manufacturing bottlenecks, supply chain disruption, and launch provider delays.
        - 25% — Dependent on near-term anomaly-free launches and successful commissioning.
      - - Base
        - >-
          Gradual fleet expansion with 5–8 active operational satellites; steady conversion of $1B backlog; modest
          defense R&D awards; manageable anomaly rates.
        - $2.5B–$3.2B valuation range, supporting the May 2026 Series E entry valuation mark of $2.8B.
        - >-
          Moderate launch schedule slippage, delayed revenue recognition, and margin compression from dual-propulsion
          integration.
        - 50% — Supported by current commercial partnerships and capital runway.
      - - Bear
        - >-
          Further on-orbit payload or power anomalies; customer contract cancellations; defense programs bypass
          MicroGEO; severe dilution from debt and liquidation overhang.
        - >-
          Valuation compression to $1.0B–$1.5B down-round territory, or distressed restructuring under senior credit
          facility covenants.
        - Uninsured on-orbit total loss, customer litigation, and inability to access subsequent equity rounds.
        - 25% — Heightened by small operating fleet size and documented historical anomaly occurrences.
    notes: >-
      Scenario analysis evaluates Astranis equity value distribution relative to the $2.8B Series E post-money
      benchmark.
