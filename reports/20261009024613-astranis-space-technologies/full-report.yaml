        title: Scale and capital position
        blocks:
          - type: paragraph
            body: >-
              The strongest current scale indicators are operating and contracted assets rather than audited financials.
              Astranis says it has five satellites on orbit, more than 10 satellites on contract, and more than $1
              billion of satellite services sold. In May 2026 it announced $450 million of new capital, described as a
              $300 million Series E plus a delayed-draw credit facility of up to $155 million, and said total capital
              raised exceeded $1.2 billion. These are financing and backlog-like signals: total raised is not cash
              available, a credit facility is not necessarily drawn, and services sold are not recognized revenue. A
              third-party registry reports a $2.8 billion post-money valuation, while public revenue remains undisclosed
              and one sales-intelligence estimate should not be treated as audited revenue.
