callouts:
  - calloutType: insight
    title: The Small-GEO Wedge vs LEO and Heavy GEO
    body: Astranis avoids head-to-head collision with SpaceX Starlink on consumer broadband latency and with legacy primes on raw aggregate throughput by focusing on the 'sovereign small-GEO' wedge. By providing dedicated 100% customer-controlled orbital hardware for $15M-$30M, Astranis captures regional telecom and national defense buyers unwilling to share multi-tenant LEO networks or finance $400M traditional satellites.
    claimRefs:
      - CP001
      - CP002
      - CP007

  - calloutType: risk
    title: Flight Heritage Deficit and Incumbent Defense Lock
    body: Despite commercial momentum, Astranis's competitive differentiation is constrained by its orbital track record. With two major on-orbit anomalies across its initial deployments and the loss of the first $437.7M Space Force PTS-G production orders to Viasat and Intelsat, Astranis must prove sustained MicroGEO operational reliability to displace entrenched aerospace incumbents in mission-critical defense and tier-1 carrier applications.
    claimRefs:
      - CP010
      - CP011
      - CP013

