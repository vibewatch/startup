  - id: switching-costs-and-moat-durability
    title: Switching Dynamics, Lock-In, and Moat Durability
    body: >
      Customer switching costs and moat durability in space communications depend on hardware ground interfaces, regulatory orbital slot filings, and orbital flight heritage. Ground segment compatibility represents a defensive asset for Astranis: because its satellites reside in geostationary orbit, end users utilize standard fixed satellite dishes without expensive active electronically steered antennas (AESA) necessary for LEO constellations. When regional telecommunications operators such as Pacific Dataport in Alaska, Chunghwa Telecom in Taiwan, or MB Group in Oman deploy Astranis capacity, they integrate the spacecraft into existing Ku/Ka-band ground terminals, reducing customer transition capital expenditure. Long-term multi-year service contracts and dedicated sovereign ownership create substantial customer lock-in once a satellite is positioned at a designated orbital slot.


      Conversely, Astranis's competitive moat faces significant risks stemming from orbital reliability track records and supply chain dependencies. In-orbit anomalies on initial missions—specifically the Arcturus spacecraft experiencing solar array drive assembly malfunctions restricting operations to partial daily service, and a spare satellite becoming stranded in a transfer orbit during orbit raising—highlight the operational fragility of small-scale GEO hardware. Entrenched incumbents leverage their flight heritage to win mission-critical enterprise and defense procurements. Furthermore, Astranis relies on external commercial launch providers, primarily SpaceX Falcon 9, creating an asymmetric dependence on a company whose own Starlink subsidiary competes directly for enterprise connectivity spend.
    claimRefs:
      - CP011
      - CP012
      - CP013
      - CP014
      - CP015
    tableRefs:
      - TP003

