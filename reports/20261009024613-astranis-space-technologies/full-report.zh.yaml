      - number: '3.2'
        title: 能力、成本与架构比较
        blocks:
          - type: paragraph
            body: >
              不同架构选择决定了 Astranis 与竞争性空间通信供应商之间的能力取舍。Viasat、Intelsat、SES 和 Eutelsat 等运营商部署的传统 GEO 卫星，可提供巨大的聚合容量（单颗通常为 100
              Gbps 至 1,000 Gbps），但区域电信商和主权实体只能在长期多租户协议下租用共享转发器容量。传统主承包商还会定制建造一次性航天器，工程周期较长。Astranis 的 MicroGEO
              平台采用专有软件定义无线电（SDR）和数字信道化器，可在 Ku-band 和 Ka-band 频段动态重新分配在轨波束，让单一主权客户控制全部容量。


              不过，Astranis 的架构取舍也带来明显限制。MicroGEO 卫星的总聚合吞吐量较低（单颗 10+ Gbps），不及 ViaSat-3 等现代高通量卫星（HTS），要满足高密度流量需求，就需要多颗
              MicroGEO 航天器，或即将推出、目标达到 50+ Gbps 的更高容量 Omega 平台。在国防应用中，Astranis 虽已为 Space Force 的 Protected Tactical
              Satcom-Global（PTS-G）和 Resilient GPS（R-GPS）等项目拿到初步研究及阶段性合同，但 Viasat 和 Intelsat 等成熟国防主承包商仍拥有深厚的项目优势，并在 2026
              年 6 月拿下首批 $437.7M 的 PTS-G 生产订单。老牌企业拥有数十年的航天飞行经验、覆盖全球的地面站网络，以及完善的 ITAR/安全认证，新航天企业必须追赶。
