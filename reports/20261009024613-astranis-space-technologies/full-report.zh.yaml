      - number: '3.3'
        title: 转换动态、锁定效应与护城河持续性
        blocks:
          - type: paragraph
            body: >
              客户切换成本和护城河持久性取决于地面硬件接口、监管轨道槽位申报和在轨飞行记录。地面段兼容性是 Astranis 的防御性资产：其卫星位于地球同步轨道，终端用户无需 LEO
              星座所需的昂贵有源电子扫描天线（AESA），即可使用标准固定卫星天线。Pacific Dataport（Alaska）、Chunghwa Telecom（Taiwan）和 MB
              Group（Oman）等区域电信运营商部署 Astranis 容量时，可将航天器接入现有 Ku/Ka-band
              地面终端，降低客户切换资本开支。多年期服务合同和专用主权所有权会在卫星进入指定轨道槽位后形成较强的客户锁定。


              反过来，Astranis 的竞争护城河也面临在轨可靠性记录和供应链依赖带来的重大风险。早期任务出现过在轨异常：Arcturus
              航天器的太阳能阵列驱动组件故障，将运营限制为每天部分时段；一颗备用卫星在轨道抬升期间滞留于转移轨道。这些事件凸显了小型 GEO 硬件的运营脆弱性。老牌企业凭借飞行记录赢得关键任务的企业和国防采购。Astranis
              还依赖外部商业发射服务商，主要是 SpaceX Falcon 9，从而对一家旗下 Starlink 子公司直接争夺企业连接支出的公司形成不对称依赖。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
