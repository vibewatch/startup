      - number: '4.2'
        title: 单位经济性、成本结构与运营利润率
        blocks:
          - type: paragraph
            body: >-
              MicroGEO 的经济性论点建立在显著降低单颗卫星制造和部署成本之上，具体依靠标准化卫星平台架构、专有软件定义无线电（SDR）以及 San Francisco Historic Pier 70
              的专用装配线。航天器约 400
              kg，几个月即可建成，而不是耗时五年或更久，从而压缩资本周转周期。不过，完整单位经济性仍大多未在公开披露中呈现。核心销货成本包括航天级部件、推进系统、通过商业拼车或专用中型运载器完成的发射集成，以及在轨发射保险。硬件制造人工成本可从技术招聘薪酬基准中部分观察到（例如工程集成助理每周
              $1,925），但实际物料清单成本、运载器发射排期价格和发射后的在轨运营费用均未披露。此外，在轨部件异常——例如早期航天器的太阳能阵列驱动机构故障——会带来未对冲的保修或容量替换费用，直接挤压实现的毛利率。
