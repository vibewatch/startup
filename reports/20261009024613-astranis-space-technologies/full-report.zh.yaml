        title: 买方、用户、付款方与采购路径
        blocks:
          - type: paragraph
            body: >-
              买方包括主权政府、国家或区域电信运营商、具有关键网络需求的企业、美国政府项目办公室，以及移动连接运营商。最终用户与付款方并不相同：公民、企业站点、作战人员或乘客消费连接服务，而政府部门、机构、运营商或服务商掌握预算。Preqin
              将其商业模式描述为 B2B 固定合同，客户按约定期限支付部署和运营费用。这支持项目制采购路径，而不是直接获取消费者。


              预算归属只有部分公开信息。主权和国防采购可能列入基础设施或拨款预算，电信和移动连接采购则可能列入网络资本支出或长期服务预算；这些都是分析推断，不是披露的客户会计数据。独立高管目录列出专门负责美国政府项目的职位，与单独的政府市场拓展路径相符。现有资料未披露采购日程、里程碑付款、取消权、客户
