              Historic Pier 70 运营一座 153,000
              平方英尺的垂直整合制造与装配总部。公司在该设施完成印刷电路板表面贴装、线束制造、精密加工和全面环境筛选，包括热真空（TVAC）舱循环与振动台鉴定。这一垂直制造模式支撑 Astranis
