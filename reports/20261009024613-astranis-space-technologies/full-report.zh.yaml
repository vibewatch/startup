        blocks:
          - type: paragraph
            body: >-
              要让小型卫星在地球同步轨道可靠运行，必须克服过去只有大型航天器才能承受的严酷环境和物理约束。Astranis 通过抗辐射部件、选择性结构屏蔽和自主飞行软件恢复程序应对 GEO
              的强辐射带。卫星平台集成先进的制导、导航与控制（GNC）子系统，包括星敏感器、反作用轮和高精度指向执行机构，以维持目标区域上空的精细波束稳定性。航天器定点和重新定位采用双模推进架构：高效电离子推进器以极低燃料消耗维持多年任务期间的定点，化学单组元推进器则负责快速入轨和多级轨道转移。子系统由可展开的砷化镓太阳能阵列供电，并配备航天级锂离子电池模块，确保载荷在每年两次地球同步轨道日蚀期持续运行。工程团队由
              400 至 500 名电力电子、FPGA 开发和机械集成专家组成，在所有装配运营中严格执行美国出口管制和航天硬件质量保证标准。
