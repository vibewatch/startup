  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价机制与合同结构
        blocks:
          - type: paragraph
            body: >-
              Astranis Space Technologies 运营专用地球同步轨道通信业务，向主权政府、国家电信运营商和国防客户提供小型地球同步轨道（MicroGEO）航天器（~400
              kg）。传统地球同步轨道卫星运营商靠多租户载荷出售共享转发器容量，Astranis 则按特定区域签下整颗专用航天器，或提供专用的多年期托管带宽服务。每颗卫星的商业合同通常为 $15 million 至 $30
              million；传统 6,000+ kg GEO 卫星每颗成本 $300 million 至 $500 million，相比之下，Astranis 的资本开支折让约 10x。公司披露，商业和政府项目的合同积压超过
              $1 billion，其中包括与 Chunghwa Telecom、Oman 的 MB Group
              签订的商业协议，以及国防主合同。不过，公开披露并未将这笔积压拆分为年经常性收入（ARR）、已确认收入、按里程碑确认的进度款或客户预付款，因此收入转化时点仍是首要尽调问题。
