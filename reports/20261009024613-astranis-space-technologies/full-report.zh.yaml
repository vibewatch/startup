  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Astranis
              的核心市场是专用高轨通信基础设施：航天器、任务集成，以及为特定地区或任务采购的卫星运营容量。公司将大型企业、主权政府和美国军方列为客户，第三方报道还将国家、互联网服务商和航空连接运营商纳入买方范围。因此，纳入的支出应限于专用卫星硬件以及签约部署或运营。发射运载器、用户终端、零售宽带、地面光纤、共享转发器租赁，以及宽泛的国防或航天预算，都是相邻或替代性支出，不属于
              Astranis 可触达的收入。

              现状替代方案不只是另一颗小型 GEO 航天器。买方可以租用共享 GEO 容量、从 LEO 或 MEO 网络采购容量、扩展地面网络，或完全推迟建设主权资产。第三方汇编资料称，MicroGEO 单位成本为 $15
              million 至 $30 million，而传统 GEO 航天器为 $300 million 至 $500
              million，建造周期为数月，而传统航天器超过五年。这些数字可作为品类基准，但不是经审计的定价，也不能证明所有传统支出都能转移给 Astranis。
