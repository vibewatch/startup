            body: >-
              Astranis 的技术护城河核心是以 Octane 软件定义无线电（SDR）为中心的专有数字信号处理引擎。传统弯管式转发器在发射前就用固定模拟滤波器锁定频率规划，而 Astranis 的 SDR
