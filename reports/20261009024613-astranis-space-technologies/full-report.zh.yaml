      - number: '3.4'
        title: 图表与要点
        blocks:
          - type: callout
            title: 小型 GEO 相对 LEO 与重型 GEO 的切入点
            body: >-
              Astranis 不在消费者宽带时延上与 SpaceX Starlink 正面竞争，也不在原始聚合吞吐量上与传统主承包商硬碰硬，而是聚焦“主权小型 GEO”这一细分切口。公司以 $15M-$30M 提供 100%
              由客户控制的专用在轨硬件，吸引不愿共享多租户 LEO 网络、也不愿为传统 $400M 卫星融资的区域电信和国防买方。
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP007
          - type: callout
            title: 飞行履历不足与老牌企业的国防锁定
            body: >-
              尽管商业势头不错，Astranis 的竞争差异化仍受在轨记录限制：早期部署出现两起重大在轨异常，首批 $437.7M Space Force PTS-G 生产订单也流向 Viasat 和
              Intelsat。Astranis 必须证明 MicroGEO 能长期稳定运营，才能在关键国防任务和一级运营商应用中取代根深蒂固的老牌航天企业。
            calloutType: risk
            claimRefs:
