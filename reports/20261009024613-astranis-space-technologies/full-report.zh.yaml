            body: >-
              Astranis 对外部融资依赖较强，原因在于航天硬件开发资本密集、轨道部署节奏快，并计划在 2030 年前扩张至 100 颗 MicroGEO 卫星。累计融资额超过 $1.2 billion，其中 2026 年
              5 月的融资方案包括 $300 million Series E 股权轮（估值 $2.8 billion）和 Trinity Capital 提供的 $155 million
              延迟提款信贷额度。虽然这笔融资为制造和下一代 Omega 平台扩张延长了现金跑道，但信贷额度的债务偿付和延迟里程碑付款带来显著流动性风险。反向市场证据也凸显其脆弱性：2026 年 6 月，美国太空军将总额
              $437.7 million 的重大受保护战术卫星通信生产订单授予 Viasat 和 Intelsat，而非 Astranis。因此，评估 Astranis
              需要机构层面取得非公开经审计财务报表、现金消耗率、债务契约和卫星交付良率。
