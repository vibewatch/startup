              Astranis Space Technologies 是一家 2015 年成立、总部位于 San Francisco
              的私人航天公司。其运营模式覆盖航天器设计、制造、测试、部署和运营，而不是只销售卫星平台或带宽。核心商业方案是在 GEO
              部署专用小型卫星网络：单一客户获得指定区域内的受控容量，同一高轨平台也面向政府通信、科学以及定位、导航与授时任务。公司材料和独立私募市场资料支持这一定位，但产品性能、合同经济性和客户层面的服务结果仍需单独尽调。Astranis
              目前处于 Series E 阶段；这只代表融资成熟度，不代表公司已经盈利或达到相应运营规模。
