  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代方案
        blocks:
          - type: paragraph
            body: >
              卫星通信和主权空间连接市场覆盖不同的架构路线与轨道体系。评估通信基础设施的买方主要考虑 5
              条替代路径：传统地球同步轨道（GEO）卫星主承包商、低地球轨道（LEO）巨型星座、小型卫星与子系统专业厂商、区域卫星运营商，以及地面基础设施替代方案。Boeing、Lockheed Martin、Airbus
              Defence and Space 和 Maxar 等传统航天主承包商，建造单颗重 3,000 kg 至 6,500 kg 的多用户 GEO 通信卫星，单颗成本 $300M 至 $500M，从采购到入轨运营需要
              五年或更久。相比之下，Astranis 开发约 400 kg 的专用 GEO 航天器，重量约为传统卫星的二十分之一，制造和发射标价为 $15M 至 $30M，并向单一区域运营商或主权政府提供 10+ Gbps
              的专用、可重构吞吐量。


              与此同时，SpaceX 的 Starlink 和 Amazon 计划中的 Project Kuiper 领衔的低地球轨道星座，代表了强大的替代架构。SpaceX 运营数千颗批量制造的 LEO
              卫星，直接向消费者、海事、航空和政府用户提供低延迟全球宽带。LEO 星座虽然能提供更低延迟（往返 25–40 ms，相比 GEO 的约 ~500–600 ms），但需要复杂的相控阵跟踪用户终端，并因 5 年
              轨道寿命持续补充星座；共享的多租户波束分配也使国家政府或区域电信商无法拥有主权轨道频谱和实体航天器。Astranis 面向需要专用、非共享区域带宽、主权运营控制权，以及地面标准低成本固定抛物面天线的买方。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
