      - number: '2.4'
        title: 增长驱动、采用约束与时间窗口
        blocks:
          - type: paragraph
            body: >-
              需求来自对专用控制、地理定制、安全性和韧性的追求。Astranis 称客户正从老化的共享 GEO 系统转向由自身控制的网络；公司 2026 年 5 月的融资也指定最高 $155 million
              的延迟提款信贷，用于增加制造产能。这些属于公司口径，但结合已报道的合同，说明生产能力与客户需求正在同步发展。受出口管制限制的人员配置是另一项门槛：Astranis
              的装配、集成和测试岗位要求符合美国政府航天技术规则。


              采用时点受交付和飞行可靠性限制。Astranis 报告称有 5 颗卫星在轨，而 Space Bandits 仅报告其中 2 颗处于商业服务，并称 Arcturus 因太阳能阵列驱动故障每天只能运行 6 至 12
              小时。Space Intel Report 的档案预告也称一颗 Astranis UtilitySat
              似乎停滞不前，但预取摘录过于有限，无法量化进度或客户影响。这些信号不能证明全编队可靠性，但在把积压订单视为持久的市场渗透之前，发射节奏、保险、验收测试、服务水平表现和合同转化都应列为核心尽调事项。
