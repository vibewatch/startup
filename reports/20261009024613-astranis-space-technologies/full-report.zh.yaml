  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 论点类型
      - 核心正方 / 反方观点
      - 支持证据
      - 改变判断的因素
    rows:
      - - 正方
        - MicroGEO 以成本和部署速度冲击传统 GEO 卫星制造。
        - 约 400 kg 的卫星可在数月内建成，成本为 $15M–$30M；传统数吨级 GEO 卫星则为 $300M–$500M。
        - 小型 GEO 经济性失败，或下一代 Omega 平台持续超支。
      - - 正方
        - 主权专用轨道连接需求强劲。
        - 多个国际客户和运营商的商业签约积压订单超过 $1B。
        - 客户流失、主权合同取消，或无法将积压订单转化为已确认收入。
      - - 正方
        - 顶级机构和战略投资者联合体提供充足资金续航。
        - 累计融资超过 $1.2B，包括 $300M Series E 股权和 2026 年 5 月的 $155M 信贷额度。
        - 卫星部署延迟和高额制造资本支出导致流动性耗尽。
      - - 正方
        - 主权电信合作验证了区域卫星需求。
        - 与 Chunghwa Telecom（台湾）、MB Group（阿曼）和 stc group（沙特阿拉伯）达成战略协议。
        - 地缘政治重组或国家预算约束可能促使主权合作伙伴退出。
      - - 反方
        - 在轨运行异常削弱微型卫星可靠性论据。
        - Arcturus 太阳能阵列驱动器故障限制有效运营时长，并使轨道转移备件闲置。
        - 完整星队的部署记录均显示多年无异常飞行运行。
      - - 反方
        - 国防主承包商竞争与合同分配风险。
        - 首批 Space Force Protected Tactical SATCOM 生产订单（$437.7M）于 2026 年 6 月授予传统主承包商 Viasat 和 Intelsat。
        - 在 PTS-G 或 Resilient GPS 等 Space Force 主要正式项目下直接获得主承包商生产订单。
    notes: 汇总截至 2026 年 10 月的主要运营催化因素，以及已有记录的技术和市场逆风。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV007
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 隐含估值逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 已签约的 10+ 颗卫星顺利部署；Omega 平台吞吐量达到 >50 Gbps；商业积压订单扩大至超过 $1.5B；国防主承包商订单增加。
        - 基于高利润率卫星运营现金流及已确认收入 10x–12x 的收入倍数，估值扩大至 $4.5B–$6.0B。
        - 制造瓶颈、供应链中断和发射服务商延迟。
        - 25% —— 取决于近期发射无异常并成功完成调试。
      - - 基准
        - 卫星队伍逐步扩大至 5–8 颗在役运营卫星；$1B 积压订单稳定转化；获得适度国防研发订单；异常率可控。
        - $2.5B–$3.2B 估值区间，与 2026 年 5 月 Series E 的 $2.8B 入场估值相符。
        - 发射计划适度延误、收入确认推迟，以及双推进系统集成造成利润率压缩。
        - 50% —— 当前商业合作和资金储备为其提供支撑。
      - - 悲观
        - 在轨载荷或电力异常进一步发生；客户取消合同；国防项目绕开 MicroGEO；债务和清算悬顶造成严重稀释。
        - 估值压缩至 $1.0B–$1.5B 下轮融资区间，或在优先信贷额度契约下进行困境重组。
        - 在轨全损且未投保、客户诉讼，以及无法进入后续股权轮次。
        - 25% —— 运营卫星队伍规模小，且已有历史异常记录，推高了这一概率。
    notes: 情景分析评估 Astranis 股权价值相对于 $2.8B Series E 投后估值基准的分布。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV006
      - CV007
      - CV013
