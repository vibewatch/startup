  - id: FE001
    title: 产品架构图
    type: stack
    summary: Astranis 小型 GEO 航天器的六层架构，涵盖太空硬件、软件定义载荷和地面集成。
    approximationNotes: 架构层级依据公开技术披露和工程规格进行功能拆分；内部总线接口和专有 FPGA 流水线阶段已作概括。
    claimRefs:
      - CE003
      - CE004
      - CE006
      - CE007
      - CE014
    data:
      layers:
        - label: 地面段与战术用户终端
          detail: 为用户连接和遥测上行提供接口的客户终端层
          items:
            - 用于车辆和单兵背负部署的 Kymeta 移动电子扫描阵列（ESAS）终端
            - 用于偏远企业站点的 Satcube 平板固定卫星终端
            - Persistent Systems MPU5 手持宽带 MANET 网状电台
            - Astranis 专用地面站网络和安全网络运营中心（NOC）
        - label: 射频通信与天线子系统
          detail: 由双反射器高增益孔径和多频段馈线链路组成的天线层
          items:
            - 用于客户专用覆盖的 Ka 波段可转向点波束抛物面反射器
            - 部署于下一代 Omega 航天器上的 Q/V 波段高频馈线链路喇叭天线
            - 用于国防通信的军用 Ka 波段和 X 波段专用任务阵列
            - 用于遥测、跟踪与指令（TT&C）的交叉偶极子和贴片天线
        - label: 软件定义无线电（SDR）数字处理载荷
          detail: 专有数字信道化器与软件可重构转发器核心
          items:
            - Astranis Octane 软件定义无线电处理引擎
            - 覆盖 7 至 9 GHz 同时频谱的高吞吐 FPGA 数字信道化器
            - 动态在轨波束成形、带宽整形和功率分配算法
            - 支持安全主权通信和战术通信的加密隔离分区
        - label: 航电、制导、导航与控制（GNC）
          detail: 自主飞行控制计算机与高精度轨道姿态确定系统
          items:
            - 运行确定性实时控制软件的抗辐射飞行计算机
            - 星敏感器、太阳传感器与惯性测量单元（IMUs），实现角秒级指向精度
            - 反作用轮与磁力矩器，用于管理地球静止轨道中的动量
            - 自主安全保持模式逻辑，以及自动定点保持与漂移修正
        - label: 电源系统与热管理
          detail: 高效太阳能发电、储能及被动 / 主动散热
          items:
            - 可展开的双翼式砷化镓（GaAs）太阳能电池阵列
            - 航天级锂离子电池模块，在 GEO 日食期间持续供电
            - 直接键合铜热管与散热器面板，用于高功率 SDR 放大器散热
            - 主动式多区域工作加热器，防止航电系统在轨道日食期间冻结
        - label: 箱体结构与双模式推进
          detail: 主承力结构与双模式轨道机动推进系统
          items:
            - 超轻铝蜂窝与碳纤维主结构总线（湿质量约 400 kg）
            - 采用惰性气体推进剂的电推离子发动机，用于高比冲定点保持
            - 提供高推力轨道转移 delta-V 的化学单组元推进系统
            - 标准化多载荷运载火箭分离环（兼容 ESPA 级）
