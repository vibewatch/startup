figures:
  - id: FE001
    title: Product Architecture Map
    type: stack
    summary: Six-layer architectural stack of Astranis small-GEO spacecraft spanning space hardware, software-defined payload, and ground integration.
    approximationNotes: Architectural hierarchy reflects functional decomposition from public technical disclosures and engineering specifications; internal bus interfaces and proprietary FPGA pipeline stages are generalized.
    claimRefs:
      - CE003
      - CE004
      - CE006
      - CE007
      - CE014
    data:
      layers:
        - label: Ground Segment & Tactical User Terminals
          detail: Customer terminal interface layer providing user connectivity and telemetry uplinks
          items:
            - Kymeta mobile electronically steered array (ESAS) terminals for vehicle and manpack deployment
            - Satcube flat-panel stationary satellite terminals for remote enterprise sites
            - Persistent Systems MPU5 handheld broadband MANET mesh radios
            - Astranis dedicated ground station network and secure network operations center (NOC)
        - label: RF Communications & Antenna Subsystems
          detail: Dual-reflector high-gain aperture and multi-band feeder link antennas
          items:
            - Ka-band steerable spot-beam parabolic reflectors for dedicated customer coverage
            - Q/V-band high-frequency feeder link horns deployed on next-generation Omega spacecraft
            - Military Ka-band and X-band dedicated mission arrays for defense communications
            - Cross-dipole and patch antennas for telemetry, tracking, and command (TT&C)
        - label: Software-Defined Radio (SDR) Digital Processing Payload
          detail: Proprietary digital channelizer and software-reconfigurable transponder core
          items:
            - Astranis Octane software-defined radio processing engine
            - High-throughput FPGA-based digital channelizer spanning 7 to 9 GHz simultaneous spectrum
            - Dynamic on-orbit beamforming, bandwidth shaping, and power allocation algorithms
            - Cryptographic isolation partition supporting secure sovereign and tactical communications
        - label: Avionics, Guidance, Navigation & Control (GNC)
          detail: Autonomous flight control computer and high-precision orbital attitude determination
          items:
            - Radiation-hardened flight computers running deterministic real-time control software
            - Star trackers, sun sensors, and inertial measurement units (IMUs) for arcsecond pointing accuracy
            - Reaction wheels and magnetic torque rods for momentum management in geostationary orbit
            - Autonomous safe-hold mode logic and automated stationkeeping station-drift correction
        - label: Electrical Power System & Thermal Management
          detail: High-efficiency solar generation, energy storage, and passive/active heat dissipation
          items:
            - Deployable dual-wing gallium arsenide (GaAs) solar cell arrays
            - Space-rated lithium-ion battery modules providing eclipse power continuity in GEO
            - Direct-bond copper heat pipes and radiator panels for high-power SDR amplifier thermal rejection
            - Active multi-zone operational heaters preventing avionics freezing during orbital eclipse
        - label: Chassis Structure & Dual-Mode Propulsion
          detail: Primary load-bearing structure and dual-mode orbital maneuvering propulsion
          items:
            - Ultralight aluminum-honeycomb and carbon-fiber primary structural bus (~400 kg wet mass)
            - Electric ion thrusters utilizing noble-gas propellant for high-specific-impulse stationkeeping
            - Chemical monopropellant propulsion system providing high-thrust orbital relocation delta-V
            - Standardized multi-payload launch vehicle separation rings (ESPA-class compatible)
callouts:
  - calloutType: insight
    title: Software-Defined RF Architecture Decouples Payload Flexibility from Orbit Mass
    body: By implementing a digital signal processing architecture that covers 7 to 9 GHz of simultaneous bandwidth, Astranis eliminates legacy bent-pipe analog transponders. This enables software-driven on-orbit beam reconfiguration and frequency reallocation while keeping wet spacecraft mass around 400 kg.
    claimRefs:
      - CE001
      - CE004
  - calloutType: risk
    title: Manufacturing Precision and Component Reliability Overhang
    body: While in-house manufacturing at Historic Pier 70 provides rapid iteration across PCBA, propulsion, and avionics, component reliability and thermal-vacuum qualification remain primary technical risk vectors for scaling production across commercial and defense backlogs.
    claimRefs:
      - CE005
      - CE011
      - CE016
