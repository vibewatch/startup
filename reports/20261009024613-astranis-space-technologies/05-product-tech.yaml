company:
  name: Astranis Space Technologies
chapter:
  number: 5
  title: Product & Technology
  summary: Astranis designs, manufactures, and operates small geostationary telecommunications satellites (~400 kg MicroGEO and ~650 kg next-generation Omega) powered by proprietary software-defined radios operating across 7 to 9 GHz of bandwidth. The vertically integrated hardware-software architecture combines in-house manufacturing at Historic Pier 70 with radiation-hardened digital signal processing, enabling dedicated regional broadband coverage, multi-mission orbital redeployment, and specialized defense capabilities.
sections:
  - id: product-overview-and-asset-lines
    title: Dedicated High-Orbit Small-GEO Spacecraft Portfolio
    body: Astranis Space Technologies designs and manufactures a dedicated portfolio of small geostationary (small-GEO) communications satellites that fundamentally redefine the orbital economics of sovereign and regional telecommunications. Departing from the multi-ton, shared-fleet architectures of legacy aerospace primes, Astranis manufactures spacecraft with wet masses ranging from approximately 400 kg for its first-generation MicroGEO platform up to 650 kg for its next-generation Omega platform. Each spacecraft is dedicated entirely to a single commercial customer, national government, or defense operator, providing guaranteed private bandwidth over a fixed geographic beam rather than forcing users to compete for shared transponder capacity. The company's commercial operations are anchored by five operational satellites deployed in orbit, with commercial backlogs exceeding $1 billion across international telecoms and sovereign operators. Alongside its core MicroGEO broadband satellites, Astranis has diversified its portfolio into specialized orbital configurations, including the multi-mission UtilitySat platform capable of over thirty orbital relocations, the Omega high-throughput platform delivering over 50 Gbps in Ka-band, and the Nexus satellite variant selected by the U.S. Space Force for the LEAP Resilient GPS program.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE008
      - CE009
      - CE010
    tableRefs:
      - TE001
  - id: customer-workflows-and-tactical-use-cases
    title: Customer Workflows, Sovereign Bandwidth, and Tactical MANET Operations
    body: The operational workflow for Astranis customers eliminates the complexity and capital barriers inherent in traditional satellite communications procurement. In the commercial telecom segment, regional service providers such as Pacific Dataport in Alaska and international partners in the Pacific and Middle East bypass the multi-year leasing of shared megasatellite transponders by acquiring dedicated MicroGEO spacecraft at unit production profiles of $15 million to $30 million, compared to $300 million to $500 million for legacy 6,000 kg satellites. In the tactical and government defense domain, Astranis introduced Vanguard in November 2025 as an integrated beyond-line-of-sight (BLOS) mobile ad-hoc network (MANET) solution. Vanguard pairs an operational Astranis GEO satellite payload with Persistent Systems MPU5 broadband tactical radios and Kymeta or Satcube flat-panel steerable terminals. This architecture creates an air-gapped, hubless peer-to-peer mesh covering a 2,250 km beam diameter. Dismounted military teams and remote disaster response personnel can establish voice, real-time drone video streams, and command-and-control links without routing sensitive telemetry across the public internet or depending on vulnerable local ground infrastructure.
    claimRefs:
      - CE001
      - CE006
      - CE007
      - CE008
      - CE010
      - CE013
    tableRefs:
      - TE002
  - id: spacecraft-architecture-and-subsystems
    title: Spacecraft Hardware Subsystems and Operating Architecture
    body: "Operating reliable small satellites in geostationary orbit requires overcoming harsh environmental and physical constraints that have historically restricted high orbits to massive spacecraft. Astranis addresses the intense radiation belts of GEO by combining radiation-hardened components with selective structural shielding and autonomous flight software recovery routines. The satellite bus integrates an advanced guidance, navigation, and control (GNC) subsystem comprising star trackers, reaction wheels, and high-precision pointing actuators capable of maintaining fine beam stability over target territories. Spacecraft stationkeeping and repositioning rely on a dual-mode propulsion architecture: high-efficiency electric ion thrusters maintain stationkeeping over multi-year missions with minimal fuel consumption, while chemical monopropellant thrusters provide rapid orbital insertion and multi-degree orbit relocations. Subsystem power is supplied by deployable gallium arsenide solar arrays coupled with space-grade lithium-ion battery modules engineered to sustain uninterrupted payload operations through biannual geostationary eclipse seasons. The engineering team, comprising over 400 to 500 specialists across power electronics, FPGA development, and mechanical integration, enforces strict U.S. export controls and space hardware quality assurance standards across all assembly operations."
    claimRefs:
      - CE004
      - CE005
      - CE011
      - CE014
      - CE015
      - CE016
    tableRefs:
      - TE003
  - id: software-defined-payload-and-manufacturing
    title: Software-Defined Radio Payload and Vertically Integrated Manufacturing
    body: The technological core of Astranis's competitive moat is its proprietary digital signal processing engine, centered on the Octane software-defined radio (SDR). Unlike conventional bent-pipe transponders that lock frequency plans into fixed analog filters prior to launch, the Astranis SDR processes up to 7 to 9 GHz of simultaneous bandwidth directly in digital circuitry. This digital channelization enables satellite operators to dynamically shape beams, adjust frequency allocations, and rebalance power outputs across active links in real time to match shifting ground demand. To support rapid production and control subsystem quality, Astranis operates a vertically integrated 153,000 sq ft manufacturing and assembly headquarters at Historic Pier 70 in San Francisco. Within this facility, the company executes printed circuit board surface-mount assembly, wire harness manufacturing, precision machining, and comprehensive environmental screening, including thermal-vacuum (TVAC) chamber cycling and vibration table qualification. This vertical manufacturing model underpins Astranis's selection as a prime contractor on major U.S. Department of War programs of record, including Protected Tactical Satcom-Global (PTS-G), Resilient GPS (R-GPS), and the Andromeda space domain awareness initiative.
    claimRefs:
      - CE003
