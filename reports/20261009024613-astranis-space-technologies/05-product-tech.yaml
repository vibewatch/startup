  - id: TE003
    title: Technology / Operating Architecture Table
    columns:
      - Architecture Layer / Component
      - Functional Role
      - Critical Dependency
      - Key Technical / Diligence Risk
    rows:
      - - Software-Defined Radio (SDR) Payload
        - Digital signal processing engine enabling on-the-fly channelization across 7–9 GHz spectrum
        - Radiation-tolerant FPGA processing fabric and proprietary RF front-end modules
        - Single-event upsets (SEU) from solar particle events and proprietary IP freedom-to-operate overhang
      - - Bus Structure & Radiation Shielding
        - Structural chassis (~400 kg wet mass) housing avionics, power electronics, and reaction wheels
        - Space-grade composite machining and specialized radiation shielding enclosures
        - Mass budget creep on high-capacity variants and structural fatigue under launch vibration
      - - Propulsion & Stationkeeping
        - Dual chemical monopropellant and electric ion thrusters for orbital insertion and lifetime stationkeeping
        - High-purity propellant supply chain and high-voltage power processing units
        - Thruster valve anomalies or propellant leakage restricting multi-year operational lifetime in GEO
      - - Avionics & Flight Software
        - Autonomous guidance, navigation, control (GNC), thermal regulation, and telemetry handling
        - Radiation-hardened onboard flight computers executing deterministic control software
        - Software concurrency defects under anomalous operating modes and ITAR-restricted component sourcing
      - - Vertically Integrated Manufacturing
        - In-house machining, PCBA surface-mount technology (SMT), wire harness fabrication, and TVAC testing at Pier 70
        - 153,000 sq ft production facility, specialized technician staffing, and environmental test chambers
        - Facility throughput bottlenecks and manufacturing defect escape rates under accelerated delivery schedules
    notes: Subsystem architecture synthesized from Astranis engineering recruiting specifications, NewSpace Market documentation, and satellite manufacturing disclosures.
