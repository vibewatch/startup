  - id: TE002
    title: Workflow / Use-Case Table
    columns:
      - User Job / Use Case
      - Current Legacy Workflow
      - Astranis Solution
      - Measurable Benefit
      - Technical Limitation
    rows:
      - - Dedicated Regional Broadband
        - Leasing shared transponder capacity on 6,000+ kg legacy GEO satellites at high recurring cost
        - Dedicated MicroGEO satellite delivering unshared 7.5–10+ Gbps capacity directly to regional operator
        - 10x lower capital cost ($15M–$30M vs $300M–$500M) and custom beam footprint over target territory
        - Fixed beam footprint cannot serve global transit routes outside designated coverage zone
      - - Tactical BLOS MANET Communications
        - Deploying bulky satellite ground stations or relaying tactical data over public terrestrial networks
        - Vanguard integrated GEO-MANET linking dismounted teams with MPU5 radios and flat-panel terminals
        - Air-gapped peer-to-peer mesh over 2,250 km beam diameter with zero public internet traversal
        - Requires unobstructed line-of-sight to equatorial geostationary orbital slot from terminal
      - - Sovereign Communications Resilience
        - Relying on multi-tenant commercial satellite fleets vulnerable to prioritization and foreign control
        - Sovereign-owned MicroGEO spacecraft operated under dedicated customer command authority
        - Full operational control of orbital asset and independent cryptographic partitioning
        - Customer assumes dedicated orbital slot coordination and ITU frequency registration requirements
      - - Resilient Military Positioning (R-GPS)
        - Exclusively dependent on core MEO GPS constellation subject to hostile jamming and ASAT threats
        - Proliferated high-orbit Nexus satellites broadcasting all GPS signals including military M-Code
        - Enhanced PNT signal diversity, localized power boosting, and rapid tactical constellation replenishment
        - Requires specialized ground receiver modernization to track hybrid GEO/MEO PNT signals
    notes: Operational performance parameters reflect published customer architectures and partner integration disclosures; tactical throughput varies by terminal aperture and atmospheric attenuation.
    claimRefs:
