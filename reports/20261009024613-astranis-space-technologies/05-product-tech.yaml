    rows:
      - - MicroGEO (Prime)
        - Commercial telecoms, regional ISPs, sovereign states
        - Operational; 5 satellites deployed on orbit
        - Dedicated single-customer GEO beam; ~400 kg wet mass; 7.5–8.5 Gbps Ka-band capacity
        - Detailed component-level bill of materials and single-supplier dependencies
      - - Omega Platform
        - Enterprise broadband, sovereign government networks
        - In development; funded via Series D/E for 2026+ launches
        - Over 50 Gbps throughput; 650 kg wet mass; Q/V-band feeder links and military Ka/X-band
        - Full-scale thermal vacuum test verification and flight-ready payload yield
      - - UtilitySat
        - Multi-mission commercial operators, contingency capacity
        - Operational demonstration; multi-band payload
        - Dual chemical/electric propulsion supporting >30 orbital relocations; Ku/Ka/QV coverage
        - Long-term stationkeeping propellant margin under frequent orbital maneuvers
      - - Nexus (R-GPS)
        - U.S. Space Force, defense navigation users
        - Under prime development contract (LEAP R-GPS)
        - Dedicated PNT payload using Octane SDR; broadcasts all GPS signals including M-Code with Xona
        - Firm-fixed-price vs cost-plus margin structure and flight-demonstration schedule
      - - Vanguard
        - Tactical military units, disaster response teams
        - Commercial release (announced Nov 2025)
        - Satellite-integrated air-gapped MANET mesh; Persistent Systems MPU5 and flat-panel terminals
        - Over-the-air throughput benchmarks and field electronic warfare jamming vulnerability
