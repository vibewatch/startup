figures:
  - id: FU001
    title: Customer journey and evidence checkpoints
    type: journey-map
    summary: >-
      The disclosed journey moves from direct institutional procurement to deployment,
      while renewal and expansion evidence remains unavailable.
    data:
      nodes:
        - id: need
          label: Define sovereign or network need
          detail: "Buyer seeks dedicated, secure, visible, or customized high-orbit connectivity."
          touchpoints: ["Direct commercial engagement", "Government program engagement"]
        - id: contract
          label: Contract dedicated capacity
          detail: "Public profiles describe fixed agreements for deployment and operation over a specified term."
          touchpoints: ["Program scope", "Satellite and service agreement"]
        - id: manufacture
          label: Build against backlog
          detail: "Contracted orders enter a capital-intensive manufacturing and launch pipeline."
          touchpoints: ["Production", "Mission integration"]
        - id: launch
          label: Launch and commission
          detail: "Orders become adoption only after launch, orbital transfer, testing, and customer acceptance."
          touchpoints: ["Launch", "Orbit raising", "Commissioning"]
        - id: service
          label: Operate customer network
          detail: "Anuvu provides a named in-service example; reliability failures show the delivery risk."
          touchpoints: ["Network operations", "Capacity delivery", "Support"]
        - id: renewal
          label: Renew or expand
          detail: "Renewal, repeat-order, and expansion conversion rates are not publicly disclosed in the assigned evidence."
          touchpoints: ["Renewal decision", "Follow-on satellite", "Geographic or mission expansion"]
    approximationNotes: "Conceptual workflow based on disclosed contract and deployment evidence; it does not imply published conversion rates or stage durations."
    claimRefs: [CU012, CU015]
callouts:
  - calloutType: risk
    title: Contracted demand does not eliminate delivery risk
    body: >-
      Arcturus's shortened working life and UtilitySat's transfer-orbit propulsion
      failure show that a signed customer program can still fail to produce durable
      service; insurance, remedies, acceptance, and replacement obligations are not
      disclosed in the assigned evidence.
    claimRefs: [CU009, CU010]
