company:
  name: Astranis Space Technologies
chapter:
  number: 6
  title: Customers
  summary: >-
    Astranis reports a mixed customer base spanning commercial network operators,
    sovereign buyers, large enterprises, and the US military, with five satellites
    on orbit and more than 10 under contract. Named deployment evidence exists, but
    retention, renewal, contract concentration, and backlog conversion remain
    undisclosed and are the central customer-quality diligence gaps.
sections:
  - id: customer-segments-and-buyers
    title: Customer segments and buying motion
    body: >-
      Astranis addresses a concentrated set of institutional buyers rather than a
      mass-market subscriber base. Its own materials identify large enterprises,
      sovereign governments, and the US military, while independent reporting also
      describes telecommunications operators and government agencies as direct-control
      buyers. The commercial proposition is a dedicated satellite over a defined
      region, which makes the economic buyer the network owner or government sponsor
      and the end users the populations, enterprises, or military units using that
      network. A directory profile also identifies separate senior commercial and
      government-program leadership, consistent with a direct, procurement-heavy
      enterprise and public-sector sales motion rather than a reseller-led channel.
    claimRefs: [CU003, CU006, CU014, CU015]
    tableRefs: [TU001]
  - id: adoption-and-contracted-demand
    title: Adoption and contracted demand
    body: >-
      The strongest disclosed scale indicators are physical and contractual, not
      recurring-revenue metrics. Astranis states that five satellites are in orbit
      and more than 10 are under contract, representing more than $1 billion of
      satellite services sold; it separately describes a commercial backlog above
      $1 billion. Washington Technology independently reported five launches by May
      2026 and noted a company objective of 100 active satellites by 2030. The
      current footprint therefore demonstrates deployment and order intake, while
      the 2030 figure remains a target. Neither services sold nor backlog should be
      treated as recognized revenue, annual recurring revenue, or cash collections.
    claimRefs: [CU001, CU002, CU007, CU013]
    tableRefs: [TU002]
  - id: named-deployments-and-delivery-risk
    title: Named deployments and delivery risk
    body: >-
      Named proof is uneven across production and future delivery. Independent
      reporting says Anuvu's two satellites entered service in August 2025, providing
      the clearest production reference in the assigned evidence. Arcturus flew for
      Pacific Dataport and reached 8.5 Gbps, but a solar-array-drive fault ended its
      working life; UtilitySat also suffered an electric-propulsion failure during
      transfer. Astranis announced Chunghwa Telecom and MB Group projects expected
      to launch later in 2026, while independent reporting lists additional later
      orders. These records show real buyer commitments, but future orders and launch
      plans do not yet establish active service, outcomes, renewal, or realized
      customer economics.
    claimRefs: [CU004, CU008, CU009, CU010, CU011]
    tableRefs: [TU003]
  - id: durability-expansion-and-concentration
    title: Durability, expansion, and concentration
    body: >-
      Preqin characterizes Astranis customer arrangements as fixed contracts covering
      satellite deployment and operation over specified terms. That structure can
      support multi-year revenue visibility, but the assigned evidence does not
      disclose contract length, termination rights, renewal rates, NRR, GRR, churn,
      backlog conversion, or customer-level revenue. The one-customer, one-region
      delivery model may deepen account value while also making satellite reliability
      and individual program execution material to customer durability. Expansion is
      visible through additional countries and mission types, yet there is no
      disclosed denominator for repeat buyers or proof that initial deployments
      systematically convert into follow-on orders.
    claimRefs: [CU012, CU014]
    figureRefs: [FU001]
