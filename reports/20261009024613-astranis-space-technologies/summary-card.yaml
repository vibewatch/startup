  topStrengths:
    - Dedicated small-GEO product with differentiated regional capacity control
    - Named customers, on-orbit deployments, and more than $1 billion of reported services sold
    - Strong institutional financing support and continued capital access
  topRisks:
    - On-orbit reliability and delivery execution remain imperfectly disclosed
    - Contract economics, renewal behavior, and customer-level economics are opaque
