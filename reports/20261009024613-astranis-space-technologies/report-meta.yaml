companyProfile:
  summary: >-
    Astranis Space Technologies is a private aerospace company founded in 2015 and headquartered in San Francisco. It
    designs, builds, launches, and operates dedicated small satellites for GEO and other high orbits, selling capacity
    and services to commercial operators, sovereign buyers, enterprises, and US government programs. The company reports
    five satellites on orbit, more than 10 satellites under contract, more than $1 billion of satellite services sold,
    and more than $1.2 billion of cumulative capital raised.
