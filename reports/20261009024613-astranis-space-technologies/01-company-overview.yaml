slug: astranis-space-technologies
runDate: 2026-10-09
company:
  name: Astranis Space Technologies
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Astranis is a 2015-founded, San Francisco-based Series E company building and
    operating dedicated small satellites for GEO and other high orbits. The company
    reports five satellites on orbit, more than 10 under contract, more than $1 billion
    of satellite services sold, and more than $1.2 billion raised, but public evidence
    does not establish audited revenue, cash availability, a complete cap table, or a
    complete governance roster.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Astranis Space Technologies is a private aerospace company founded in 2015 and
      headquartered in San Francisco. Its operating model combines spacecraft design,
      manufacturing, testing, deployment, and operation rather than selling only a
      satellite bus or only bandwidth. The core commercial proposition is a dedicated
      small-satellite network in GEO: one customer receives controlled capacity over a
      defined region, while the same high-orbit platform is also marketed for government
      communications, science, and positioning, navigation, and timing missions. This
      positioning is supported by company materials and an independent private-markets
      profile, but product performance, contract economics, and customer-level service
      outcomes require separate diligence. Astranis is at the Series E stage; that label
      indicates financing maturity, not profitability or operational scale by itself.
    claimRefs: [CO001, CO002, CO015, CO016]
    tableRefs: [TO001]
  - id: scale-and-capital
    title: Scale and capital position
    body: >-
      The strongest current scale indicators are operating and contracted assets rather
      than audited financials. Astranis says it has five satellites on orbit, more than
      10 satellites on contract, and more than $1 billion of satellite services sold.
      In May 2026 it announced $450 million of new capital, described as a $300 million
      Series E plus a delayed-draw credit facility of up to $155 million, and said total
      capital raised exceeded $1.2 billion. These are financing and backlog-like signals:
      total raised is not cash available, a credit facility is not necessarily drawn,
      and services sold are not recognized revenue. A third-party registry reports a
      $2.8 billion post-money valuation, while public revenue remains undisclosed and one
      sales-intelligence estimate should not be treated as audited revenue.
    claimRefs: [CO003, CO004, CO005, CO006, CO007, CO008, CO013, CO014]
    tableRefs: [TO003]
  - id: leadership-and-governance
    title: Leadership, functional coverage, and governance
    body: >-
      Public profiles consistently identify John Gedmark as cofounder and chief
      executive and Ryan McLinko as cofounder and chief technology officer. Directory
      evidence also indicates functional leadership across commercial, spacecraft
      engineering, production and supply chain, business operations, and government
      programs, which is directionally appropriate for a vertically integrated
      satellite company. General John E. Hyten joined as chair of a new strategic
      advisory board in March 2026, strengthening visible national-security counsel but
      not substituting for disclosure of the legal board of directors. No assigned
      source provides a complete board roster, voting control, founder ownership,
      succession plan, or liquidation-preference stack. The resulting key-person and
      governance assessment remains provisional pending primary corporate records.
    claimRefs: [CO009, CO010, CO011]
    tableRefs: [TO002]
  - id: milestones-and-execution-signals
    title: Milestones and execution signals
    body: >-
      The public milestone sequence shows a decade-long progression from the 2015
      founding through seed and successive institutional rounds to a May 2026 Series E.
      It also shows a shift from a single commercial connectivity proposition toward a
      broader high-orbit platform serving commercial and government missions. Capital
      formation has accelerated alongside stated production ambitions, but the assigned
      evidence is materially stronger on financing events than on delivery quality,
      manufacturing yield, or on-orbit reliability. An independent trade-news archive
      teaser said a new UtilitySat appeared stalled in orbit, yet the fetched text did
      not expose enough article detail to establish cause, duration, or outcome. That
      signal warrants follow-up rather than a conclusion that the fleet has a systemic
      reliability problem.
    claimRefs: [CO001, CO004, CO011, CO012, CO015]
    figureRefs: [FO001]
