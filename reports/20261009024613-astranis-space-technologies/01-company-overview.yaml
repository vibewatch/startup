callouts:
  - calloutType: insight
    title: Scale is better evidenced by assets and contracts than by revenue
    body: >-
      Five satellites on orbit, more than 10 under contract, and more than $1 billion of
      services sold are the clearest public scale markers, but none is a substitute for
      recognized revenue, cash collection, or margin disclosure.
    claimRefs: [CO003, CO014]
  - calloutType: risk
    title: Governance and execution evidence is incomplete
    body: >-
      The public record does not resolve board control, founder ownership, preference
      terms, succession, manufacturing yield, or the context behind the reported
      UtilitySat stall signal.
    claimRefs: [CO012]
