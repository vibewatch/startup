callouts:
  - calloutType: "recommendation"
    title: "Investment Stance: Research-More"
    body: "Astranis represents one of the most innovative space telecommunications platforms globally, but its current $2.8B post-money Series E valuation leaves little margin of safety for recurring flight anomalies. Investors should condition capital deployment on verified on-orbit insurance coverage and proof of repeatable manufacturing yield."
    claimRefs:
      - "CV001"
      - "CV004"
      - "CV012"
      - "CV013"
  - calloutType: "risk"
    title: "On-Orbit Reliability as the Pivotal Valuation Lever"
    body: "Because Astranis sells dedicated satellites to individual sovereign and enterprise clients, an anomaly on a single spacecraft directly imperils the underlying customer relationship and revenue realization. Until a multi-satellite operational track record is established without degradation, valuation upside will remain capped."
    claimRefs:
      - "CV004"
      - "CV007"
      - "CV014"
