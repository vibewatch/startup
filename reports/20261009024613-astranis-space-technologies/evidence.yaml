      drive assemblies shortly after commissioning and manages only six to twelve hours of service a day. A spare from
      the December 2024 quadruple launch failed during orbit raising and was left stranded in a transfer orbit. That is
      two significant failures in a very small fleet, in a business whose entire premise is that small and cheap need
      not mean unreliable. The five-satellite mission promised for 2025 had not flown by August 2026. And the largest
      defence programme Astranis qualified for went elsewhere: the first production orders under the Space Force's
      protected tactical satcom programme, worth $437.7 million, went to Viasat and Intelsat in June 2026.
