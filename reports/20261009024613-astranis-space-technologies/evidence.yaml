evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current legal board roster, voting agreements, founder ownership, option pool, liquidation preferences, investor
      consent rights, and succession plan.
    whyItMatters: >-
      Control, downside protection, dilution, and key-person risk cannot be assessed from advisory-board and investor
      announcements.
    diligencePath: >-
      Obtain the charter, bylaws, capitalization table, financing documents, board minutes, voting agreements, and
      management succession materials in the data room.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: >-
      Complete current executive roster, statutory board membership, reporting lines, tenure, turnover, and retention
      arrangements.
    whyItMatters: >-
      Public directories can show functional coverage but cannot establish decision rights, vacancies, or key-person
      concentration.
    diligencePath: Reconcile an HRIS organization chart and board register against employment, retention, and separation records.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: ownership
    missingEvidence: >-
      Exhaustive shareholder list, ownership percentages, security classes, debt draws, covenants, security interests,
      and control rights.
    whyItMatters: Named financing participants do not reveal economic seniority, governance control, or available liquidity.
    diligencePath: >-
      Review the fully diluted cap table, stock ledger, Series E term sheet, credit agreement, borrowing base, covenant
      certificates, and payoff schedule.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: >-
      Audited revenue, bookings-to-revenue conversion, cash collections, gross margin, contract liabilities,
      cancellation rights, and customer concentration.
    whyItMatters: >-
      Services sold, external estimates, capital raised, and credit capacity cannot establish revenue quality or unit
      economics.
    diligencePath: >-
      Obtain audited financial statements, monthly revenue recognition schedules, contract-level backlog, invoices,
      collections, and margin bridges.
  - type: missing-source
    severity: material
    topic: execution-risk
    missingEvidence: >-
      Full independent reporting, telemetry, operator disclosure, and remediation status for the UtilitySat stall signal
      and any other on-orbit anomalies.
    whyItMatters: >-
      A truncated archive teaser is enough to identify a diligence lead but not enough to establish severity, fleet-wide
      relevance, or recovery.
    diligencePath: >-
      Obtain the full article through an authorized channel and reconcile it with customer reports, anomaly reviews,
      insurance notices, and mission telemetry.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: material
    topic: bottom-up-market-sizing
    missingEvidence: >-
      Comparable buyer counts, annual budgets, replacement cadence, qualified-pipeline value, win rates, and delivery
      capacity needed to calculate a bounded SAM and SOM.
    whyItMatters: >-
      Without common denominators, the $15B GEO flow, $1B services sold, contracted units, and unit-cost benchmarks
      cannot be converted into a defensible addressable or obtainable market.
    diligencePath: >-
      Request the qualified pipeline by buyer class and geography, contracted versus optional units, delivery calendar,
      historical win rates, and independent satellite replacement data.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: independent-market-growth
    missingEvidence: >-
      An independent market forecast and CAGR using a boundary comparable to dedicated small high-orbit communications
      infrastructure.
    whyItMatters: >-
      A broad GEO launch-value claim does not establish growth of Astranis's specific category or the pace at which
      buyers will shift from substitutes.
    diligencePath: >-
      Obtain a current independent forecast with segment definitions, historical series, geography, units, and
      methodology, then reconcile it to Astranis's product boundary.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Customer budgets, procurement calendars, milestone-payment schedules, cancellation rights, switching costs, and
      realized ROI by segment.
    whyItMatters: >-
      These inputs determine budget ownership, sales-cycle duration, backlog quality, and whether dedicated satellite
      economics outperform shared GEO, LEO, or terrestrial alternatives.
    diligencePath: >-
      Review anonymized contracts and pipeline records, then interview telecom, sovereign, defense, enterprise, and
      mobility customers using a consistent ROI and procurement template.
  - type: missing-source
    severity: minor
    topic: utilitysat-status
    missingEvidence: >-
      Full independent reporting or primary mission data explaining the UtilitySat status, timing, cause, and customer
      impact.
    whyItMatters: >-
      The assigned prefetched archive exposes only a short adverse preview, so it cannot support a quantified delay or
      loss estimate.
    diligencePath: Obtain the full article or primary orbital and customer documentation in a later authorized research pass.
    relatedQuestionRefs:
      - QM007
  - type: private-evidence-only
    severity: material
    topic: pricing-contract-terms
    missingEvidence: >-
      Exact contractual lease pricing, payment milestones, and bandwidth SLA penalties across commercial agreements with
      Chunghwa Telecom, Anuvu, and MB Group.
    whyItMatters: >-
      Without granular contract disclosures, realized revenue per gigabit cannot be independently audited against stated
      list prices of $15M-$30M per spacecraft.
    diligencePath: Review redacted customer lease contracts and billing schedules during confidential technical diligence.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: manufacturing-defect-rates
    missingEvidence: >-
      Independent third-party manufacturing audit data verifying component defect rates and root-cause fixes following
      the Arcturus solar array drive failure.
    whyItMatters: >-
      Disconfirming evidence of two on-orbit anomalies indicates manufacturing or component qualification risks that
      could affect customer adoption and mission insurance rates.
    diligencePath: Request Space Force and commercial mission anomaly review board summaries and corrective action documentation.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: financial-gaps
    missingEvidence: >-
      Audited financial statements detailing gross profit margins, satellite manufacturing costs of goods sold, and
      operating cash burn rate.
    whyItMatters: >-
      Without audited margins and cash burn, underwriting models cannot verify whether the $15M-$30M unit pricing yields
      sustainable operating profitability.
    diligencePath: >-
      Request trailing 24 months audited GAAP income statements and cash flow statements in a formal management data
      room.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: debt-covenants
    missingEvidence: >-
      Loan agreement terms, interest rate margins, and liquidity covenants governing the $155 million Trinity Capital
      delayed-draw credit facility.
    whyItMatters: >-
      Venture debt covenants can trigger mandatory prepayments or dilution if satellite milestone deployment deadlines
      slip.
    diligencePath: Review credit agreement, debt amortization schedules, and collateral pledge documents.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: on-orbit-radiation-hardening-reliability
    missingEvidence: >-
      Empirical telemetry, component radiation test reports, and accelerated life testing data for the proprietary
      Octane SDR payload and commercial off-the-shelf electronics operating under continuous high-radiation GEO
      conditions.
    whyItMatters: >-
      Long-term revenue durability and sovereign mission uptime depend on the SDR payload surviving multi-year cosmic
      radiation and solar particle events without catastrophic digital processing failures.
    diligencePath: >-
      Request on-orbit telemetry logs from deployed satellites, total ionizing dose (TID) test reports, and single-event
      upset (SEU) mitigation architecture documentation during technical diligence.
    relatedQuestionRefs:
      - QE010
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Customer-level contract terms, renewal history, NRR, GRR, churn, service availability, and satisfaction or outcome
      data.
    whyItMatters: >-
      Without retention and service-quality evidence, backlog and deployments do not establish durable recurring
      customer economics.
    diligencePath: >-
      Request the contract cohort schedule, renewal and churn bridge, SLA performance, credits, customer references, and
      repeat-order history.
    relatedQuestionRefs:
      - QU009
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Bookings, backlog, recognized revenue, receivables, and launch obligations by top customer and program.
    whyItMatters: >-
      A small number of bespoke satellite programs could dominate value while exposing Astranis to cancellation, delay,
      and acceptance risk.
    diligencePath: >-
      Obtain top-10 customer concentration tables, backlog aging and conversion, termination rights, milestone billing,
      acceptance status, and counterparty credit.
    relatedQuestionRefs:
      - QU010
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: A complete customer roster with contract status, launch date, in-service date, outcome, and renewal status.
    whyItMatters: The public examples are a partial sample and cannot support a complete production-customer count or success rate.
    diligencePath: >-
      Reconcile the board-approved customer and contract register to launches, commissioning records, invoices, and
      customer references.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: on-orbit-anomalies
    missingEvidence: >-
      Public technical root-cause investigation findings and insurance claim recovery totals for the Arcturus solar
      array drive failures.
    whyItMatters: >-
      Without root-cause confirmation and insurance settlement figures, investors cannot determine whether Astranis
      absorbed total asset write-downs or resolved mechanical design flaws.
    diligencePath: >-
      Request underwriter loss reports, satellite insurance certificates, and Spacecraft Review Board corrective action
      documentation.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR002
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-risk-coverage
    missingEvidence: >-
      Complete historical registry of host-nation telecom landing licenses and bilateral spectrum frequency coordination
      agreements across all international customer territories.
    whyItMatters: >-
      Partial coverage of sovereign approvals obscures whether customer deployment delays stem from local telecom
      regulatory bottlenecks.
    diligencePath: >-
      Audit national spectrum authority dockets in target deployment jurisdictions including Taiwan, Saudi Arabia, and
      the Philippines.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: on-orbit insurance coverage
    missingEvidence: >-
      Verification of on-orbit insurance policies, coverage terms, and casualty loss recovery terms for launched
      MicroGEO satellites.
    whyItMatters: >-
      Uninsured or underinsured satellite total-loss events directly expose equity holders to catastrophic balance sheet
      write-downs.
    diligencePath: >-
      Request proof of on-orbit insurance certificates and broker placement documentation during confirmatory management
      diligence.
