callouts:
  - calloutType: "risk"
    title: "The MicroGEO Paradox: Component Cheapness vs Flight Heritage"
    body: "Astranis's central commercial thesis rests on building small GEO satellites for $15M to $30M in months rather than years. However, orbital performance data reveals that two out of five satellites launched have encountered crippling hardware failures—Arcturus experiencing solar drive failures and a 2024 spare becoming stranded in transfer orbit [CR001]. If low manufacturing costs come at the expense of on-orbit survivability, commercial and sovereign buyers will face unacceptable uptime liabilities."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR004"
  - calloutType: "insight"
    title: "Government Defense Program Dual-Edged Sword"
    body: "While Astranis highlights prime contractor status on US Space Force programs like PTS-G, the Space Force's decision in June 2026 to award $437.7 million in production contracts to legacy primes Viasat and Intelsat proves that study contracts do not automatically translate into scalable production revenue [CR001, CR003]. Investors must monitor whether Astranis can win follow-on production delivery orders or remains relegated to experimental prototyping."
    claimRefs:
      - "CR001"
      - "CR003"
