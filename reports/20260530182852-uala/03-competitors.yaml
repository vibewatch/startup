- id: country-level-dynamics
  title: 'Country-level dynamics: distribution and licensing change the real rival set'
  body: 'Country detail changes the judgment. In Argentina, Ualá still looks like a broad consumer-finance app, but it competes inside a concentrated field where Brubank and Naranja X already have scale and Mercado Pago has stronger merchant gravity. In Mexico, the market is more explicitly segmented by license and by distribution engine: Ualá has bank status and deposit protection, Nu has category-leading scale, Mercado Pago has a merchant ecosystem, Klar competes aggressively on yield-plus-credit, and Spin by OXXO translates convenience-store reach into a cash-to-digital moat. Colombia is different again. Nequi and Daviplata already sit inside the country’s highest-volume wallet habits, Mercado Pago has upgraded into a financing-company proposition, and RappiPay uses the super-app funnel to cross-sell finance. The result is that Ualá’s relative strength is not uniform. Its public proposition is strongest where bank trust plus savings yield are visible, and weaker where local incumbents
    or embedded ecosystems already control the highest-frequency payment loops.'
