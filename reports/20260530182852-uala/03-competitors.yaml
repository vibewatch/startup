  evidenceGaps:
  - type: missing-source
    severity: material
    topic: country-level-monetization
    missingEvidence: Country-level active users, deposit balances, merchant TPV, and product-level take rates for Ualá and the main peer set.
    whyItMatters: Without country-level monetization data, public analysis can rank breadth and distribution but not prove which platform has the strongest unit economics.
    diligencePath: Request cohort-level country dashboards or board materials showing active users, balances, TPV, take rate, and revenue mix by Argentina, Mexico, and Colombia.
    relatedQuestionRefs:
    - QP024
  - type: conflicting-data
    severity: minor
    topic: peer-scale-comparability
    missingEvidence: A normalized definition set distinguishing customers, monthly active users, merchants, and enterprise clients across peers.
    whyItMatters: Several public sources cite scale with different denominators, which can overstate or understate Ualá’s true relative position.
    diligencePath: Standardize peer KPIs to monthly active consumers, active merchants, and funded accounts before using public user counts in valuation work.
    relatedQuestionRefs:
    - QP025
  - type: private-evidence-only
    severity: material
    topic: credit-unit-economics
    missingEvidence: Country-level loss curves, funding cost, and contribution margin for Ualá’s credit products versus peer products.
    whyItMatters: The strongest long-run competitive advantage may come from underwriting and funding, but public sources do not show enough detail to compare credit economics rigorously.
    diligencePath: Request vintage tables, funding-cost disclosures, and margin bridges for each country to compare economics against Nu, Mercado Pago, and local incumbents.
    relatedQuestionRefs:
    - QP026
