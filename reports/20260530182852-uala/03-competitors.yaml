callouts:
- calloutType: risk
  title: Merchant and cash distribution are the clearest comparative weaknesses
  body: 'The strongest adverse angle is not that Ualá lacks features. It is that key rivals pair similar features with stronger acquisition loops: Mercado Pago with merchants and marketplace traffic, Spin by OXXO with cash-friendly retail distribution, and Nequi or Daviplata with embedded local wallet habits. If Ualá cannot prove that its merchant tools and repeat payment behavior are deepening by country, breadth alone may not translate into the best unit economics.'
  claimRefs:
  - CP032
  - CP033
  - CP036
  - CP039
  - CP040
  - CP041
  - CP043
- calloutType: insight
  title: Shared rails make local execution more important than QR capability
  body: Because Argentina, Mexico, and Colombia all now run interoperable or common instant-payment infrastructure, simple QR acceptance is closer to table stakes than to a lasting moat. The winners should increasingly be the apps that convert those rails into trusted primary-account behavior, cash-handling convenience, or merchant density. That favors incumbents and ecosystem players unless Ualá can show better local retention and monetization data.
  claimRefs:
  - CP004
  - CP005
  - CP037
  - CP043
