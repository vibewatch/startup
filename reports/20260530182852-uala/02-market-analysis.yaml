- id: sizing-and-penetration
  title: Sizing lenses and penetration signals
  body: 'The cleanest way to size Ualá''s addressable opportunity is to preserve multiple lenses instead of forcing one headline TAM. A regional analyst lens places Latin American neo-banking at $17.0 billion in 2025, growing to $420.9 billion by 2034, but that broad figure is too abstract on its own. The country operating lens is more useful. In Argentina, the BCRA counted 37.8 million people with bank and/or payment accounts by December 2025, 29.5 million electronic-payment users in the last quarter of 2025, and 61.7 million payment accounts in the system. In Mexico, 76.5% of adults aged 18-70 already had at least one formal financial product in 2024, yet formal credit penetration was only 37.3%, which implies remaining room for cross-sell and deepening. On the payments side, SPEI already processed 5.4 billion sent transfers in 2024. In Colombia, 36.1 million adults had at least one formal product in 2023, 27.5 million held low-value deposit products associated with digital wallets, and
    Bre-B reached more than 33 million clients and 2.8 million merchants within months of launch.


    Contradictions also matter. Argentina''s ecosystem is described as 432 fintech companies in a 2024 U.S. trade note, but 939 direct financial-service providers or 1,027 ecosystem companies in 2025-2026 chamber-backed sources. The right conclusion is not that one number is wrong; it is that the boundary shifts between direct providers and broader ecosystem participants. That same discipline applies to Ualá''s market sizing: there is a large opportunity, but public evidence supports a penetration-based and rails-based lens more cleanly than a precise public SAM or SOM.'
