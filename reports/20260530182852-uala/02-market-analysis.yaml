tables:
- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - relevance
  rows:
  - - Consumer transaction accounts and wallets
    - Account opening, stored value, P2P transfers, salary receipt, bill pay, QR-linked checkout, debit card usage
    - Corporate cash management, treasury, wholesale payments
    - Individual consumer funding the account with income, transfers, or remittances
    - Core daily-entry product in all three markets; usage depth determines later cross-sell
  - - Interoperable transfer and QR payments
    - Immediate bank-to-wallet and wallet-to-wallet transfers, interoperable QR checkout, merchant settlement
    - Closed-loop store credit, card-only enterprise acquiring, proprietary non-interoperable schemes
    - Consumer and micro-merchant
    - Critical for replacing cash and making the account/wallet the payment habit
  - - Small-ticket unsecured digital credit
    - Personal loans, revolving lines, installment credit, emergency liquidity, thin-file underwriting
    - Mortgages, auto finance, large SME loans, project finance
    - Consumer borrower repaying from wages, sales, or transfers
    - Most valuable monetization layer after account usage is established
  - - Low-friction savings and yield balances
    - Interest-bearing balances, money-market funds, low-value deposits, simple investments tied to the account
    - Private banking, advisory-led wealth management, institutional asset management
    - Consumer saver using operating balances or surplus cash
    - Important because wallet/account economics improve when balances stay on platform
  - - Remittance-adjacent and cross-border consumer flows
    - Inbound remittances, cross-border personal transfers, FX-linked consumer value storage
    - Trade finance, corporate FX hedging, exporter treasury products
    - Household receiving money from abroad or moving consumer funds
    - Especially relevant in Mexico and useful for broadening account primacy beyond domestic P2P
  - - Micro-merchant acceptance and settlement
    - QR acceptance, instant transfer collection, low-ticket merchant settlement, working-capital-triggering payment history
    - Full enterprise POS bundles, omnichannel commerce software, ERP/payroll SaaS
    - Merchant owner or sole proprietor
    - Important because many Ualá-market users are both consumers and sellers in informal or micro-business settings
  notes: The direct market is the consumer and micro-merchant finance stack that can be distributed through a mobile account or wallet; broader banking and enterprise software categories are explicitly excluded.
