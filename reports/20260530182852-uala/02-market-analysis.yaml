  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Ualá country-level customer and transaction mix
    missingEvidence: No public source breaks out Ualá active customers, balances, payment volume, or credit users by Argentina, Mexico, and Colombia.
    whyItMatters: Without country-level operating metrics, public evidence can support why the markets matter but not how much of each market Ualá is actually capturing.
    diligencePath: Request monthly active users, funded accounts, payment TPV, and credit vintages by country from the company data room.
    relatedQuestionRefs:
    - QM024
    - QM025
  - type: missing-source
    severity: material
    topic: Country-level SAM and take-rate benchmarks
    missingEvidence: Public sources provide market penetration and rail-throughput signals, but not a clean consumer-finance SAM or take-rate benchmark that matches Ualá’s exact product mix in each country.
    whyItMatters: A broad TAM can overstate value if merchant economics, credit spread, and balance monetization differ materially by country.
    diligencePath: Obtain internal market planning or commission country-level consumer-finance sizing with separate assumptions for accounts, payments, credit, and savings monetization.
    relatedQuestionRefs:
    - QM004
    - QM024
  - type: missing-source
    severity: material
    topic: Cross-country credit quality benchmark
    missingEvidence: There is no clean public benchmark comparing digital-credit default curves across Ualá’s three core markets on a like-for-like basis.
    whyItMatters: Credit can be the most valuable layer in the stack, but only if cohort losses stay below spread and fee income.
    diligencePath: Request country-level delinquency, charge-off, and repeat-borrow curves for Ualá and benchmark against local peers.
    relatedQuestionRefs:
    - QM020
    - QM021
    - QM022
  - type: stale
    severity: minor
    topic: Colombia and Mexico official survey timing
    missingEvidence: The strongest official inclusion stock data for Colombia is full-year 2023 and the strongest official Mexico inclusion detail available through fetched sources is ENIF 2024 summarized in secondary reporting.
    whyItMatters: Recent operating momentum is clear, but lagged survey cycles mean some current-period penetration judgments still rely on older inclusion snapshots.
    diligencePath: Refresh this chapter when newer official inclusion surveys or supervisory dashboards publish.
    relatedQuestionRefs:
    - QM006
    - QM007
