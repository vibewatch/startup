- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Argentina wallet-transfer intensity
    - driver
    - current
    - High engagement lowers activation friction for Ualá-like products but pushes competition toward monetization quality
    - Request cohort-level repeat-transfer and balance-retention data by country
  - - Mexico SPEI scale and QR policy push
    - driver
    - current-to-near-term
    - Large payment rail volume can support account primacy if users shift from cash and incumbent apps
    - Test Ualá conversion from first transfer to recurring spend or savings behavior in Mexico
  - - Colombia Bre-B interoperability
    - driver
    - current-to-near-term
    - Common rules reduce cross-wallet and cross-bank friction, helping challenger distribution
    - Measure whether Bre-B lowers customer acquisition cost or raises merchant acceptance for Ualá
  - - Smartphone-led access
    - driver
    - structural
    - High mobile usage makes software distribution viable across all three markets
    - Check activation and retention by device quality, OS, and connectivity quality
  - - Underbanked and thin-file credit gap
    - driver
    - structural
    - Large populations still need small-ticket formal credit and everyday money tools
    - Request approval-rate, loss-rate, and repeat-borrow data by risk bucket
  - - Open finance and regulatory modernization
    - driver
    - near-term
    - Better data sharing and lower acceptance cost could improve underwriting and payment economics
    - Track implementation timelines for Argentina open finance and Mexico open-finance rules
  - - Cash persistence in Mexico and Colombia
    - constraint
    - current
    - Cash slows digital monetization even when users are already onboarded
    - Measure active monthly transactors rather than registered accounts
  - - Argentina inflation and labor informality
    - constraint
    - current
    - Can accelerate wallet usage but destabilize credit quality and deposits
    - Stress-test repayment and balance retention under inflation and income volatility scenarios
  - - Mexico regulatory ladder by license type
    - constraint
    - current
    - Different licenses dictate product scope, insurance, and economics
    - Clarify Ualá Mexico roadmap, permissions, and capital needs by licence path
  - - Colombia rural and low-income usage gaps
    - constraint
    - current
    - Wallet ownership does not guarantee universal merchant or income-flow digitization
    - Request geographic usage, merchant density, and cash-out behavior
  - - Credit risk concentration
    - constraint
    - current
    - Digital credit is valuable only if losses stay below spread and fee income
    - Obtain vintage curves and delinquency by product and country
  - - Market-boundary ambiguity
    - constraint
    - ongoing
    - Broad fintech or neobank TAM numbers can overstate what Ualá can truly capture
    - Maintain penetration-based sizing until country-level take-rate data is available
  notes: Tailwinds and risks are intentionally separated by direction; the same country can score high on both adoption opportunity and monetization risk.
