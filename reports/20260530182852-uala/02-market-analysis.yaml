- id: TM005
  title: Regional dynamics and why Ualá’s markets matter
  columns:
  - country
  - market signal
  - dominant tailwind
  - dominant risk
  - why it matters to Ualá
  rows:
  - - Argentina
    - 37.8M account holders; 666.3M monthly push transfers; 81.5% virtual-wallet usage cited in 2023
    - Wallet intensity, interoperability, and daily engagement
    - Inflation, informality, and rising PNFC irregularity
    - Best proof-point for engagement depth and cross-sell velocity, but the toughest place to underwrite durable credit economics
  - - Mexico
    - 76.5% formal-product ownership; 5.418B SPEI sends in 2024; 100.2M internet users
    - Largest scale, strong rails, and remittance-linked flows
    - Cash persistence, rural divide, and licence-driven economics
    - Most important scale market if Ualá can convert usage from occasional transfers into primary-account behavior
  - - Colombia
    - 94.6% adult financial-product access; 27.5M wallet-linked low-value deposits; Bre-B scaled quickly
    - Interoperability and high digital-channel depth
    - Cash and low-income usage frictions still limit full monetization
    - Shows how shared rails can accelerate everyday usage and merchant relevance once the market is interoperable
  notes: The three countries are complementary rather than redundant. Argentina supplies intensity, Mexico supplies scale, and Colombia supplies interoperability momentum.
