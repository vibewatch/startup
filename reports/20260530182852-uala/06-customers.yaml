- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration or durability risk
  - Impact
  - Diligence path
  rows:
  - - Consumer-to-merchant cross-sell via Ualá Bis
    - Merchant count, TPV, and repeat-merchant retention are undisclosed
    - Cross-sell narrative may overstate monetization quality
    - Request merchant-book size, TPV, take rate, and cohort retention by country
  - - Mexico growth engine narrative
    - 7% MoM growth lacks a disclosed active-customer base or CAC context
    - Hard to judge how scalable or efficient current Mexico growth really is
    - Request monthly active customers, funded accounts, CAC, and payback in Mexico
  - - Colombia promo-and-alliance usage
    - Promo usage may not equal durable primary-bank behavior
    - High headline engagement could fade when discounts normalize
    - Request repeat-transaction frequency and non-promo spend share
  - - Regional one-brand trust story
    - Insurance and consumer-protection wrappers differ by country
    - Customer trust and churn risk may differ even under one app brand
    - Request country-level complaint, fraud-loss, and support-resolution metrics
  - - Public scale disclosures from >7m to >11m
    - Definitions are not reconciled between sign-ups, customers, and actives
    - Investors can overread top-line growth if definitions drift
    - 'Request one reconciled user waterfall: registered, KYCed, funded, active, revenue-generating'
  - - Merchant concentration
    - No public disclosure of top merchants, partners, or channel concentration
    - Could hide reliance on a few merchant channels or alliance programs
    - Request top-20 merchant and partner concentration with contract duration
  notes: This table separates obvious expansion vectors from the concentration and durability disclosures still missing from the public record.
