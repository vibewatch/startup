- id: FU002
  title: Adoption / deployment funnel
  type: flow
  layout: standard
  summary: The visible funnel runs from mobile discovery to onboarding, first funding, repeated payment behavior, then merchant or credit expansion.
  data:
    nodes:
    - id: discover
      label: Discover Ualá
      detail: User or merchant sees a country-specific app-store listing, homepage offer, or merchant portal.
    - id: onboard
      label: Complete local KYC
      detail: Registration uses DNI, INE/IFE, cédula, residence card, or PPT depending on market.
    - id: fund
      label: Fund the account
      detail: Users load money via transfer, payroll portability, Efecty cash-in, or initial card usage.
    - id: transact
      label: Run first core jobs
      detail: Transfers, PSE, card purchases, QR, payment links, and bill payments create the first habit.
    - id: repeat
      label: Repeat or deepen usage
      detail: Yield balances, promotions, alliances, and debit-card spending create repeat behavior proxies.
    - id: expand
      label: Expand into higher-value products
      detail: Consumers move into loans or investments; merchants move into POS Pro, QR, or online checkout.
    edges:
    - from: discover
      to: onboard
      label: Eligibility and local-document rules gate entry
    - from: onboard
      to: fund
      label: Account needs first balance or card activation
    - from: fund
      to: transact
      label: User proves value through purchases, transfers, or merchant collection
    - from: transact
      to: repeat
      label: Promotions, alliances, and low-friction payments drive repeat touches
    - from: repeat
      to: expand
      label: Cross-sell into lending, investing, or merchant acquiring
  claimRefs:
