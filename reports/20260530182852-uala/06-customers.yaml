- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Public eligibility or geography
  - Core jobs
  - Strategic value
  - Gap
  rows:
  - - Argentina consumers and teens
    - Individual user and payer
    - Argentina; age 13+ with DNI; foreign residents can use DNI + CUIL
    - Remunerated account, official-dollar purchases, investments, loans, card spend, promos
    - Deepest public product surface and likely anchor installed base
    - No Argentina MAU, funded-account count, or product-penetration split
  - - Mexico adult consumers and payroll switchers
    - Individual user and payer
    - Mexico; age 18+ with INE/IFE or residence card
    - Credit and debit, payroll portability, reserve products, yield, personal loans, SME credit
    - Shows cross-sell from entry account into credit and payroll
    - No disclosed active Mexico customer count or product attach rates
  - - Colombia adults and PPT-documented migrants
    - Individual user and payer
    - Colombia; age 18+ with cédula, cédula de extranjería, or PPT
    - Low-monto account, PSE, Efecty cash-in, transfers, card spend, yield
    - Strongest public inclusion proof and hardest country-level usage metrics
    - No disclosed balances, revenue per user, or retained cohorts
  - - Argentina merchants via Ualá Bis
    - Merchant owner / SME buyer; merchant operations user
    - Argentina; QR, links, readers, API and e-commerce integrations
    - Accept cards, QR, installments, links, POS, online checkout
    - Consumer-to-merchant monetization loop inside same ecosystem
    - No merchant count, TPV, or repeat-merchant data
  - - Mexico merchants and high-volume businesses
    - Merchant owner / legal entity
    - Mexico; POS Pro and acquiring portal
    - Instant settlement, card acceptance, POS Pro, lower commissions
    - Adds SMB and higher-volume acquiring monetization path
    - No disclosed merchant penetration, fraud loss, or retention
  - - Colombia entrepreneurs, tenderos, and companies
    - Merchant owner / seller buyer
    - Colombia; Ualá Bis, links, PSE, mobile datáfono
    - Receive remote and in-person payments, settle into Ualá account
    - Ties inclusion thesis to merchant acceptance and local commerce
    - No cohort, TPV, or concentration disclosure
  notes: Rows reflect the public-facing segment boundaries and user jobs visible on retained product surfaces; they do not imply equal scale or economics across segments.
