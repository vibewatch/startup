  rows:
  - - Google Play main app
    - 4.5 rating, 747k reviews, 10M+ downloads
    - Large Android reach and deep review volume
    - Review feed still captures prior malfunctions and credit bugs
    - Best visible mass-market customer-proof surface, but not a retention cohort
  - - App Store Argentina
    - 4.6 rating, 63k ratings
    - Strong local iOS rating base
    - No disclosed rating trend or active-user denominator
    - Supports Argentina usage breadth
  - - App Store Mexico
    - 4.5 rating, 26k ratings
    - Credible local iOS footprint
    - Shared listing blurs how much of the audience is truly Mexico-specific
    - Shows Mexico relevance but not funded-account depth
  - - App Store Colombia
    - 4.7 rating, 7.2k ratings
    - Positive early iOS sentiment in the newest market
    - Rating base is much smaller than Colombia’s headline user count
    - Supports reach but not habit formation
  - - Google Play user proof
    - Positive December 2024 review
    - User says PSE, cash deposit, payments, and virtual card work well
    - Single anecdote, not statistically representative
    - Real user-job proof for the core transaction loop
  - - Complaint and reliability surfaces
    - Negative 2023 credit complaint plus Downdetector issue categories
    - No current live incident on Downdetector at fetch time
    - Complaint surfaces still show credit-module frustration and track transfer/login/payment issues
    - Useful cautionary UX proof even without a contemporaneous outage
  notes: This table treats app-store ratings as customer-proof signals, not proof of retention or monetization. Review anecdotes are illustrative and should not be generalized into headline customer-satisfaction metrics.
