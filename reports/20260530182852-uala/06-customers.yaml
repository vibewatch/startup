- id: durability-complaints-and-key-customer-economics-gaps
  title: Durability, complaints, and key customer-economics gaps
  body: 'The public customer evidence is good enough to prove real adoption, but not good enough to prove durable economics. Scale claims conflict badly: partner and media surfaces still cite more than seven million, more than eight million, nine million, more than 10 million, and more than 11 million users or customers depending on the page and date. Neobanks Guide makes the ambiguity explicit by saying its approximate nine-million figure reflects cumulative sign-ups rather than monthly active users. That matters because no retained source discloses MAU, DAU-to-MAU, NRR, GRR, churn, contract duration, top-merchant concentration, or NPS. Complaint evidence is also mixed rather than catastrophic. Google Play includes a March 2026 review saying stability improved after a late-2023 malfunction, but it also contains an older complaint about a bugged credit module. Downdetector showed no live incident on the run date, yet its taxonomy still centers on transfer, login, payment, and app-access
    issues. The main diligence caveat is therefore clear: Ualá’s public set proves acquisition and breadth much more convincingly than retention, concentration, or customer quality.'
