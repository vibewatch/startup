  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: user-count-definition
    missingEvidence: A reconciled waterfall from registered users to KYC-complete, funded, active, and revenue-generating customers by country.
    whyItMatters: Public totals range from >7 million to >11 million and appear to mix sign-ups, clients, and customers, which can distort growth and retention conclusions.
    diligencePath: Request a board-grade user definitions pack with monthly counts for registered, funded, transacting, and revenue-generating users in each country.
    relatedQuestionRefs:
    - QU010
    - QU021
    - QU022
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: MAU, DAU-to-MAU, cohort retention, NRR, GRR, logo churn, renewal rates, and NPS / CSAT time series for both consumers and merchants.
    whyItMatters: The public set proves reach and transaction activity, but without cohort metrics it is impossible to know whether Ualá is becoming a primary account or just a promotional secondary wallet.
    diligencePath: Request monthly cohort dashboards by product and country, plus the last eight quarters of NPS / CSAT with sample sizes and methodology.
    relatedQuestionRefs:
    - QU019
    - QU023
    - QU024
  - type: private-evidence-only
    severity: material
    topic: merchant-book-and-concentration
    missingEvidence: Merchant count, TPV, repeat-merchant retention, take rate, top-20 merchant concentration, and partner-channel mix by country.
    whyItMatters: Ualá Bis is clearly part of the expansion story, but the public record does not show whether merchant acquiring is diversified, sticky, or concentrated in a few partners or promotions.
    diligencePath: Request merchant cohorts, TPV bridges, and a concentration schedule covering top merchants, top channels, and contract terms.
    relatedQuestionRefs:
    - QU016
    - QU017
    - QU025
    relatedTableRefs:
    - TU003
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: public-customer-proof-sample
    missingEvidence: A broader public reference set showing more named merchants, customer cohorts, or user testimonials beyond the limited sample retained here.
    whyItMatters: Mass-market fintechs naturally publish fewer named customers than enterprise software companies, but the current public proof still leaves uncertainty about how representative the visible sample is.
    diligencePath: Ask management for a fuller reference pack covering merchant cohorts, public testimonials, and country-level adoption case studies.
    relatedQuestionRefs:
    - QU015
    - QU016
    relatedTableRefs:
    - TU003
