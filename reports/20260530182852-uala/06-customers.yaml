chapter:
  number: 6
  title: Customers
  summary: Public evidence supports a very broad retail footprint across Argentina, Mexico, and Colombia plus a real merchant-acquiring push through Ualá Bis, with the strongest hard usage proof coming from Colombia and app-store signals. The main caveat is that Ualá’s public user counts conflict across sources and dates, while no retained source discloses MAU, retention, NPS, or merchant concentration metrics.
sections:
- id: regional-customer-mix-and-onboarding-boundaries
  title: Regional customer mix and onboarding boundaries
  body: 'Ualá’s public customer story is broad, but it is not one homogeneous user base. The company is clearly targeting mass-market retail consumers across Argentina, Mexico, and Colombia, yet the eligibility rules and product surfaces differ materially by country. Argentina’s public listing is the widest: the app store says users can onboard from age 13 with an Argentine DNI, and the homepage layers remunerated balances, official-dollar purchases, loans, investments, insurance, and promotions on top of the basic card and transfer loop. Mexico is adult-only and more bank-and-credit oriented, with public emphasis on 10% cashback, payroll portability, loans, and a 16% yield headline. Colombia is also adult-only but adds a more explicit inclusion angle through PSE, Efecty cash-in, and PPT-document onboarding. The same app-store shell markets these local variants together, so Ualá looks more like a regional brand with country-specific operating surfaces than a single standardized product.
    That matters for diligence because a public claim about “Ualá users” may hide very different customer economics, trust wrappers, and conversion requirements by market.'
