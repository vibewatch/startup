- id: funding-history-and-stakeholder-map
  title: Funding History, Valuation Progression, and Stakeholder Map
  body: 'The public capital record shows a business that kept attracting major backers even as its disclosure quality remained uneven. Ualá’s 2021 Series D brought in $350 million at a $2.45 billion valuation and, according to TechCrunch, lifted total capital raised to $544 million. After that, the company announced a $300 million Series E first close in November 2024 at a $2.75 billion valuation, then an additional $66 million in March 2025 to bring that round to $366 million. The March 2026 financing release says another $197 million arrived at a $3.2 billion valuation, led by Allianz X with support from several existing and new investors. The caveat is important: Ualá’s own /fundinground page title says USD 195 million, and independent 2026 trade coverage repeated the lower number. For chapter-one purposes, valuation can be anchored at $3.2 billion, but exact cumulative capital raised should be presented as an estimate of roughly $1.107 billion rather than a final audited total. Stakeholder
    mapping is still worthwhile because Allianz X, Tencent, SoftBank, Stone Ridge, Soros, TelevisaUnivision, Mastercard, and the ABC Capital acquisition all shape strategic direction even without a public cap-table waterfall.'
  claimRefs:
  - CO017
