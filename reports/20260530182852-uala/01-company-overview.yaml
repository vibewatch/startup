  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: governance-map
    missingEvidence: A full holding-company board package, committee list, shareholder agreement summary, and current ownership table.
    whyItMatters: Chapter one can name the founder and the disclosed Ualá Bank authorities, but it cannot yet convert that into a complete group-governance or control model.
    diligencePath: Request the latest board deck, board/committee roster, shareholder cap table, and director biographies for the parent and each regulated entity.
    relatedQuestionRefs:
    - QO007
    - QO015
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: material
    topic: latest-round-size
    missingEvidence: Primary financing documents or a reconciled company statement confirming whether the March 2026 round was $195M or $197M and how it should roll into cumulative capital raised.
    whyItMatters: The exact amount affects the cumulative funding figure and weakens precision in the capital-history narrative if left unresolved.
    diligencePath: Obtain the executed financing summary, investor closing memo, or an updated company funding page that reconciles the March 2026 amount across official surfaces.
    relatedQuestionRefs:
    - QO014
    - QO016
    relatedTableRefs:
    - TO001
    - TO003
  - type: stale
    severity: material
    topic: current-headcount
    missingEvidence: A current consolidated employee count by market and entity, plus office footprint and remote-work distribution.
    whyItMatters: Historical staffing disclosures exist, but they are not current enough to use as a live operating KPI or efficiency denominator.
    diligencePath: Request HR headcount by entity and geography as of 2026-05-30, plus a reconciliation to 2024 office disclosures.
    relatedQuestionRefs:
    - QO020
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: debt-capital-structure
    missingEvidence: Any current corporate debt facilities, warehouse lines, preference stack, or other non-equity obligations.
    whyItMatters: Valuation and downside analysis require knowing whether dilution or leverage sits above common equity, and public funding releases do not answer that question.
    diligencePath: Request the latest cap-table waterfall, debt schedule, and financing legal summary from management or counsel.
    relatedQuestionRefs:
    - QO017
  - type: stale
    severity: minor
    topic: user-metric-vintage
    missingEvidence: A synchronized public metrics page that aligns users, customers, loans, and investment-client counts across official surfaces.
    whyItMatters: The chapter can handle 8M, 9M, and 11M metrics by date, but unsynchronized pages make it harder to present one canonical current number without explanation.
    diligencePath: Ask management for a current metrics sheet and a changelog for pages that still display older numbers.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO001
