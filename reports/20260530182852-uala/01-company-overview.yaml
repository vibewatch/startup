company:
  name: Ualá
chapter:
  number: 1
  title: Company Overview
  summary: 'Ualá is a Buenos Aires-headquartered Latin American neobank founded by Pierpaolo Barbieri in 2017 that now spans cards, payments, lending, investments, insurance, and merchant acquiring across Argentina, Mexico, and Colombia. Public evidence supports meaningful scale and repeated investor backing, but chapter-one ground truth still carries two material caveats: governance disclosure is much clearer at subsidiary level than at the consolidated group, and official 2026 funding surfaces conflict on whether the latest round was $195M or $197M.'
sections:
- id: identity-headquarters-and-model
  title: Identity, Headquarters, and Business Model
  body: 'Ualá should be anchored in chapter one as a Latin American neobank and financial-products ecosystem, not as a single prepaid-card app. The company’s own about pages describe a technology business offering cards, payments, lending, investments, insurance, and merchant acquiring across Argentina, Mexico, and Colombia. That breadth matters because later market, product, and valuation work depends on treating Ualá as a multi-entity regulated platform with several monetization vectors. Headquarters also needs nuance. The clearest high-level operating signal is the September 2024 announcement that Ualá’s new Palermo office in Buenos Aires serves as the regional headquarters. At the same time, bank and non-bank legal disclosures use Coronel Marcelino Freyre 3650 in CABA for regulated customer-service functions. The right chapter-one conclusion is therefore Buenos Aires, Argentina as headquarters, while noting that legal addresses vary by entity. Public scale numbers are directionally strong
    but not perfectly synchronized: older official pages still say more than 8 million users, whereas the March 2026 financing release says more than 11 million customers. That is better treated as current-versus-stale page timing than as a clean contradiction in core identity.'
