  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding-round-size
    missingEvidence: A definitive closing memorandum or cap-table summary confirming whether the March 2026 equity round closed at US$197 million or US$195 million.
    whyItMatters: The discrepancy is small in percentage terms but signals that even a headline financing fact is not fully harmonized across public materials.
    diligencePath: Ask management for the signed financing summary, investor list, and exact gross versus net proceeds figure used in board materials.
    relatedQuestionRefs:
    - QR014
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: country-loss-metrics
    missingEvidence: Country-by-country delinquency, charge-off, recovery, fraud-loss, and complaint-volume data after 4Q24, especially outside Mexico bank disclosures.
    whyItMatters: Residual downside depends on whether losses and fraud are concentrated, improving, or spreading across markets, and the public pack does not show that.
    diligencePath: Request monthly risk dashboards by market and product, including fraud losses, dispute rates, complaints, and collections performance.
    relatedQuestionRefs:
    - QR017
    - QR031
    relatedTableRefs:
    - TR002
    - TR003
  - type: missing-source
    severity: material
    topic: parent-governance
    missingEvidence: Parent-level board composition, committee structure, control-function reporting lines, and shareholder-rights documentation for the consolidated group.
    whyItMatters: Subsidiary pages do not answer who oversees risk, disclosure control, and capital allocation across the whole regional platform.
    diligencePath: Request the parent board deck, committee charters, delegated-authority matrix, and latest governance org chart.
    relatedQuestionRefs:
    - QR029
    - QR030
    relatedTableRefs:
    - TR004
  - type: enumeration-incomplete
    severity: material
    topic: merchant-channel-concentration
    missingEvidence: Merchant TPV, take rate, chargeback frequency, reserve policy, and the share of Ualá Bis online volume that depends on Tiendanube or other external channels.
    whyItMatters: Instant settlement and low-fee promises are only attractive if the fraud, reserve, and partner-concentration economics remain manageable.
    diligencePath: Request merchant TPV by channel, chargeback trend, reserve coverage, and partner concentration for ecommerce integrations.
    relatedQuestionRefs:
    - QR025
    - QR026
    relatedTableRefs:
    - TR002
    - TR003
  - type: missing-source
    severity: material
    topic: conduct-history
    missingEvidence: Direct regulator-exported complaint, sanction, abusive-clause, and consumer-defense history specific to Ualá across Mexico, Argentina, and Colombia.
    whyItMatters: Public pages describe where complaints go, but not whether complaint incidence is low, improving, or deteriorating.
    diligencePath: Pull Ualá-specific regulator records from CONDUSEF, BCRA consumer channels, and the Colombian supervisor or ombudsman before investment committee review.
    relatedQuestionRefs:
    - QR008
    - QR024
    - QR031
    relatedTableRefs:
    - TR001
    - TR002
  - type: private-evidence-only
    severity: material
    topic: profitability-bridge
    missingEvidence: A country-level profitability and cash-burn bridge showing how quickly Mexico can offset its disclosed losses and whether Argentina and Colombia remain self-funding.
    whyItMatters: Management has made Mexico central to the growth case, but the public pack still cannot reconcile that ambition to consolidated cash needs.
    diligencePath: Request monthly country P&Ls, regulatory capital plans, and group cash runway under base and stressed credit-loss scenarios.
    relatedQuestionRefs:
    - QR016
    - QR028
    - QR032
    relatedTableRefs:
    - TR003
    - TR005
