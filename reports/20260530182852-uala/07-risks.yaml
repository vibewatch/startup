        tone: warning
        detail: Local bank governance is partially visible, but parent-level visibility remains thin.
      - label: high
        tone: warning
        detail: Opaque loss, fraud, and complaint data make downside hard to underwrite.
      - label: low-medium
        tone: warning
        detail: Some subsidiary governance pages exist, but they do not close parent-level gaps.
      - label: medium-high
        tone: warning
        detail: Opacity is manageable only if private diligence fills the remaining holes.
