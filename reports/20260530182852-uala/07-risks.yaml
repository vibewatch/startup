  title: Risk heatmap
  type: matrix
  layout: wide
  summary: Mexico credit execution, cross-country regulatory mismatch, and Argentina macro spillover carry the highest residual severity because they connect directly to funding need, trust, and downside underwriting.
  data:
    columns:
    - Probability
    - Impact
    - Mitigation maturity
    - Residual severity
    rows:
    - label: Mexico credit quality + funding dependence
      values:
      - label: high
        tone: negative
        detail: Mexico is the key growth engine but the only hard public filing still shows losses and elevated stage-3 credit.
      - label: critical
        tone: negative
        detail: If losses persist, fresh capital can be consumed before scale turns self-funding.
      - label: medium
        tone: warning
        detail: Fresh equity and bank-level buffers exist, but consolidated loss-absorption is undisclosed.
      - label: high
        tone: negative
        detail: Residual exposure stays high until Mexico proves durable profitability after losses.
    - label: Cross-country regulatory perimeter mismatch
      values:
      - label: high
        tone: negative
        detail: Argentina, Mexico, and Colombia operate under visibly different legal perimeters.
      - label: high
        tone: negative
        detail: Misaligned marketing or servicing can create conduct and trust failures across one brand.
      - label: low-medium
        tone: warning
        detail: Public legal pages exist, but entity-by-entity control evidence is thin.
      - label: high
        tone: negative
        detail: Residual exposure remains high because customer protections are not uniform.
    - label: Argentina macro and household-default spillover
      values:
      - label: medium-high
        tone: warning
        detail: Official and independent 2026 sources still flag delinquency, inflation, and FX fragility.
      - label: high
        tone: negative
        detail: A macro wobble would pressure repayment behavior and risk appetite for consumer finance.
      - label: low
        tone: warning
        detail: No public hedge is visible beyond portfolio management and pricing discipline.
      - label: high
        tone: negative
        detail: The macro path is improving, but the buffer remains narrow.
    - label: Customer trust / fraud / complaint escalation
      values:
      - label: medium
        tone: warning
        detail: Independent review signals are mixed and formal dispute workflows already exist.
      - label: high
        tone: negative
        detail: A visible fraud or servicing event would hit deposits, spending, and brand trust quickly.
      - label: medium
        tone: warning
        detail: Security guidance is visible, but public fraud-loss and complaint data are absent.
      - label: medium-high
        tone: warning
        detail: Current ratings are acceptable, but trust is not robustly disclosed.
    - label: Competition from Mercado Pago and Nubank
      values:
      - label: high
        tone: negative
        detail: Both incumbents already operate at materially larger scale and one is profitable in Mexico.
      - label: high
        tone: negative
        detail: Competition can compress take rate, acquisition efficiency, and funding optionality.
      - label: medium
        tone: warning
        detail: Bank licenses and product breadth help, but Mexico still has to execute.
      - label: high
        tone: negative
        detail: Residual severity stays high until Ualá proves differentiated profitable growth.
    - label: Governance and disclosure opacity
