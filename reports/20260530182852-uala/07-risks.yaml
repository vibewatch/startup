- id: regulation-and-licensing
  title: Regulation, licensing, and conduct risk by jurisdiction
  body: 'Public legal pages make clear that Ualá is not one regulatory object across Latin America. In Argentina, Alau Tecnología is registered for payments, lending, and interoperable-wallet activity, but it explicitly says it is not a bank and that wallet balances are not protected as bank deposits. That matters because the brand can market a broad financial experience while some consumer protections depend on which local entity actually books the product. Mexico is the opposite extreme: Ualá''s current pages identify a bank, highlight IPAB coverage up to 400,000 UDIs, and point users to UNE and CONDUSEF if something goes wrong. Colombia sits in a third perimeter, where privacy and legal pages identify a finance company and expose separate rules for low-value deposits, payment reversals, and Bre-B terms. These are not cosmetic differences. They raise conduct risk, make cross-country product communication harder, and force diligence to verify that marketing, disclosures, and complaint handling
    stay aligned with the entity behind each feature. The Mexican Buró page is especially telling because it foregrounds complaints, sanctions, and abusive clauses as comparison points for financial users; that is the right public frame for a company that wants to scale from low-ticket onboarding into deeper credit and deposit relationships.'
