- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Mexico credit-quality drag
    - Public or private data show stage-3 / NPL deterioration without matching reserve or pricing improvement
    - Mexico credit quality worsens from the already elevated 22.7% disclosed stage-3 baseline
    - Move stance toward avoid unless management can prove unit economics after losses.
  - - Mexico profitability miss
    - Management cannot demonstrate a credible path to self-funding after prioritizing Mexico for scale
    - Mexico still requires new capital before clear operating leverage is visible
    - Treat valuation upside as speculative and push for a lower-entry or no-go.
  - - Argentina household-stress spillover
    - BCRA household irregularity and independent delinquency indicators continue rising materially
    - Household irregularity rises beyond the current 11.2% official level and independent delinquency keeps worsening
    - Assume tighter collections, lower approval, and weaker growth until macro stabilizes.
  - - Conduct / complaint escalation
    - Complaint, sanction, fraud, or abusive-clause metrics appear in regulator or company datasets
    - Any verified step-change in CONDUSEF, consumer-defense, or fraud metrics
    - Escalate diligence on servicing, dispute handling, and marketing controls immediately.
  - - Competitive gap widens
    - Mercado Pago and Nubank keep scaling while Ualá misses Mexico milestones
    - Ualá user, merchant, or credit growth lags materially with no profitability bridge
    - Cut growth assumptions and re-underwrite the company as a niche rather than regional leader.
  - - Disclosure remains too thin
    - Management declines to share country-level losses, complaint data, fraud losses, and cash needs in diligence
    - No hard data beyond the current public pack
    - Do not underwrite the business at growth-equity pricing.
  notes: The thresholds are intentionally directional because the public pack is too thin to set precise numerical covenants beyond the disclosed Mexico and Argentina baselines.
