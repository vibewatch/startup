- id: competition-governance-and-disclosure
  title: Competition, governance, and unresolved disclosure gaps
  body: 'Execution risk is highest where Ualá''s ambition meets the incumbents'' scale. IProUP frames the regional contest around Mercado Pago and Nubank, and the hard numbers support that framing: MercadoLibre reported 83 million fintech MAUs and a US$14.6 billion credit portfolio in Q1 2026, while Nu reported more than 135 million customers globally and said Mexico had already reached break-even and become the third-largest financial institution in that market by customers. Against that backdrop, Ualá is still asking investors to believe that Mexico can scale from a loss-making bank disclosure into a profitable regional engine. Governance is mixed rather than absent. Mexico''s bank-level page does name a board, including founder Pierpaolo Barberi and independent directors, but the broader public pack remains much thinner at parent level, where growth and fundraising releases dominate over committee, control, and risk-reporting detail. The missing pieces are material: public sources in
    this chapter still do not disclose consolidated revenue, fraud-loss rates, complaint volumes, or country-by-country loss performance. That does not make the thesis invalid, but it does mean diligence cannot underwrite residual risk from brand momentum alone. The core question is whether Ualá can prove that Mexico scales faster than risk costs while the cross-country control environment stays coherent under one brand.'
