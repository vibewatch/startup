  topStrengths:
    - >-
      Real regional scale with more than 11 million customers across Argentina, Mexico, and Colombia and full banking
      licences across the footprint.
    - >-
      Broad financial ecosystem spanning cards, payments, lending, investments, insurance, and merchant acquiring rather
      than a single-wallet product.
    - >-
      Continued fundability through a $300M Series E in 2024, a $66M second close in 2025, and another roughly $195-197M
      round in 2026.
    - >-
      Meaningful operating footprint anchored by Buenos Aires as regional HQ and more than 1,500 collaborators disclosed
      in September 2024.
    - >-
      Multiple monetization levers across spreads, interchange, merchant MDRs, FX, and lending give the model more
      upside paths than a pure payments app.
  topRisks:
    - >-
      Public materials still do not disclose consolidated revenue, gross margin, retention, or group profitability,
      making the $3.2B mark hard to benchmark cleanly.
    - >-
      Mexico is the clearest public financial window and still showed elevated stage-3 loans, losses, and reliance on
      capital injections.
    - >-
      The 2026 round amount conflicts across official and trade surfaces ($195M versus $197M), while cap-table and
      preference-stack terms remain undisclosed.
    - One brand spans materially different legal and regulatory perimeters across Argentina, Mexico, and Colombia.
    - >-
      Customer scale is clearer than customer quality because no retained source discloses MAU, cohort retention, NRR,
      merchant concentration, or complaint volumes.
  unresolvedGaps:
    - Consolidated revenue or ARR, gross margin, and group profitability / cash-flow disclosure.
    - Country-level contribution margins, Mexico credit-vintage loss curves, and fraud / complaint data.
    - >-
      Cap table and preference stack above common in the 2026 round, including whether any structure-heavy protections
      were required.
    - >-
      Current consolidated headcount; the latest retained people figure is more than 1,500 collaborators from September
      2024.
    - Active / funded customer metrics, primary-account behavior, and merchant retention / concentration data.
