callouts:
- calloutType: strength
  title: The public surface is materially broader than a plain wallet
  body: Cards, remunerated deposits, loans, investments, merchant acquiring, and now embedded insurance are all directly evidenced in retained sources. That breadth matters because it changes the underwriting frame from single-product wallet economics to ecosystem cross-sell and regulatory execution.
  claimRefs:
  - CE007
  - CE016
  - CE018
  - CE030
  - CE040
  - CE041
  - CE050
- calloutType: insight
  title: Merchant checkout is the clearest technical proof point
  body: Ualá's best public technology evidence is not on the consumer banking side but on the merchant side. The checkout docs, validation logic, explicit error handling, and official NodeJS/PHP SDKs show a real integration surface that goes beyond static marketing copy.
  claimRefs:
  - CE020
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
- calloutType: risk
  title: Public resilience and security evidence is still thin
  body: The retained source set does not reveal cloud vendors, core-ledger design, uptime targets, public incident reporting, or named certifications such as SOC 2 or ISO 27001. That makes product breadth visible, but technology-risk underwriting incomplete.
  claimRefs:
  - CE046
  - CE047
  - CE048
- calloutType: recommendation
  title: Request architecture, security, and insurance packs before underwriting product risk
  body: A serious diligence process should ask for a current system diagram, third-party certifications, payment / webhook SLA metrics, insurance policy wording, and module-level usage by country. Those items are the main blockers between a convincing public product story and a fully underwritten technology view.
  claimRefs:
  - CE023
  - CE041
  - CE047
  - CE048
  - CE049
