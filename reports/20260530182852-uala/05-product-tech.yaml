  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: architecture-gap
    missingEvidence: A current system architecture diagram naming core ledger, cloud / hosting providers, major data stores, authentication controls, and disaster-recovery design.
    whyItMatters: Product breadth is visible, but resilience, vendor concentration, and incident blast radius cannot be underwritten from the public pack.
    diligencePath: Request CTO / platform-lead materials, current architecture diagrams, DR runbooks, and postmortem samples.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: security-gap
    missingEvidence: Public or private evidence of named security certifications, external audits, penetration-test cadence, fraud-loss metrics, and uptime / status reporting.
    whyItMatters: Financial apps and merchant checkouts carry trust-sensitive workloads; without assurance evidence, operational and compliance risk remain harder to score.
    diligencePath: Request SOC / ISO / PCI materials, fraud dashboards, webhook SLA metrics, and any public-status or incident-history archive.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: embedded-insurance
    missingEvidence: Official product pages or policy wording for the 2026 life and personal-accident products, including coverage exclusions, carrier economics, claims flow, and SLA.
    whyItMatters: The release proves launch intent and quoting activity, but not product economics, underwriting ownership, or customer experience after issuance.
    diligencePath: Request policy documents, partner agreements, attach rates, quote-to-bind conversion, and claims metrics by cohort.
    relatedQuestionRefs:
    - QE016
    relatedTableRefs:
    - TE001
    - TE005
  - type: private-evidence-only
    severity: material
    topic: merchant-developer-surface
    missingEvidence: Operational data for API Checkout such as live merchants, order volume, failure rates, webhook retry behavior, versioning policy, and deprecation schedule.
    whyItMatters: Developer docs and SDKs show intent and surface area, but not production reliability or commercial traction.
    diligencePath: Request merchant-platform KPIs, API monitoring, sandbox / production documentation, and the roadmap for authentication and versioning.
    relatedQuestionRefs:
    - QE007
    - QE008
    relatedTableRefs:
    - TE003
    - TE005
  - type: missing-source
    severity: minor
    topic: mexico-products
    missingEvidence: A complete official Mexico contract / fee pack matching the rates and features described in the app-store listing.
    whyItMatters: The retained Mexico evidence proves the bank wrapper and broad consumer proposition, but leaves some product detail dependent on app-store copy rather than a full official disclosure pack.
    diligencePath: Request current product sheets, commission schedules, and customer agreements directly from Ualá Mexico.
    relatedQuestionRefs:
    - QE009
    - QE010
    relatedTableRefs:
    - TE001
    - TE004
