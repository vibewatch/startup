tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - module / product line
  - primary user
  - status / maturity
  - differentiation signal
  - diligence gap
  rows:
  - - Argentina savings + card app
    - Retail consumer
    - Live on current public pages
    - Free bank-account wrapper, remunerated balances, prepaid/credit surfaces, Google Pay and Apple Pay support, and Ualá+ rewards in one app family
    - Need active-account split, card activation rate, and credit-card approval funnel
  - - Argentina investing + FX
    - Retail saver / investor
    - Live on current public pages
    - Official dollar and MEP trading, FCIs, term deposits, stocks, bonds, and CEDEARs sit inside the same app flow
    - Need AUC, trade frequency, and revenue-share economics by product
  - - Argentina personal loans
    - Borrower
    - Live, but underwriting opaque
    - Instant disbursement plus disclosed TNA/TEA/CFT ranges show a real lending workflow rather than teaser copy
    - Need bank-vs-Alau origination split, approval rates, and loss metrics
  - - Merchant POS Pro
    - SMB / merchant
    - Live and mature enough for collaborator controls
    - All-card acceptance, collaborator permissions, and reseller program suggest a fuller operating tool, not just a dongle
    - Need installed base, merchant churn, and terminal uptime / replacement data
  - - Merchant QR / Tap / API checkout
    - SMB / online merchant
    - Live and technically open on checkout
    - QR, softPOS-style Tap en tu celu, and public checkout docs/SDKs give multiple collection modes
    - Need TPV mix, fraud / chargeback metrics, and API adoption counts
  - - Mexico bank products
    - Mexico retail consumer
    - Live, with thin official surface detail
    - Licensed bank wrapper plus credit card, yield tiers, and term reserve from app-store copy broaden the regional stack
    - Need official fee schedules, contract PDFs, and realized balances by cohort
  - - Colombia account, payments, and transfers
    - Colombia retail consumer
    - Live on current product pages
    - Depósito de bajo monto + debit card + PSE + service payments + Bre-B create a broader usage loop than pure wallet storage
    - Need active users, balance mix, PSE / Bre-B transaction share, and fraud rates
  - - Embedded insurance
    - Argentina consumer
    - Recent 2026 launch with limited retained detail
    - Insurance sits inside the same mobile-first ecosystem and is positioned as instant-issue embedded protection
    - Need policy wording, carrier economics, claims SLA, and attach-rate by cohort
  notes: Rows reflect modules directly evidenced in retained public sources; they do not imply equal revenue contribution or common backend architecture.
  enumerationScope:
    coverage: partial
    basis: Enumeration covers the main consumer and merchant modules directly evidenced on retained public pages across Argentina, Mexico, and Colombia, but not every hidden in-app feature or internal product experiment.
