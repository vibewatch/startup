  - limitation
  rows:
  - - Store paycheck / daily balance in Argentina
    - Open account in app, receive transfers or salary, leave money in remunerated balance
    - Free savings-account wrapper tied to daily yield and card access
    - Public page advertises no maintenance fee and up to 26% TNA with usage triggers
    - Realized balances, churn, and cost of funds are undisclosed
  - - Spend online or in store
    - Use in-app card credentials or mobile wallet
    - Credit-card surface with Google Pay / Apple Pay and Ualá+ rewards
    - Double points and no maintenance fee are explicit user-facing hooks
    - Approval rules and cross-sell conversion are undisclosed
  - - Borrow in-app
    - Request loan, see individualized offer, accept in app, receive funds instantly
    - Personal-loan workflow with disclosed TNA / TEA / CFT bands
    - Instant disbursement and pre-acceptance pricing are explicitly described
    - Portfolio quality and entity split remain opaque
  - - Invest pesos or dollars
    - Choose official dollar / MEP, FCI, stocks, bonds, CEDEARs, or term deposit inside app
    - CNV-regulated investing and FX menu inside one flow
    - One-app convenience across multiple asset types is directly evidenced
    - AUC, turnover, and take-rate economics are undisclosed
  - - Collect payments as a merchant
    - Choose POS Pro, QR, Tap on phone, or API checkout
    - In-person, QR, softPOS, and ecommerce collection stack
    - Current MDRs and developer docs show real operating depth
    - No public SLA, webhook reliability, or merchant-success metrics
  - - Move money and pay bills in Colombia
    - Fund account, pay via PSE, pay services, or transfer by Bre-B
    - Low-value deposit account with integrated payments and instant transfers
    - 24/7 no-cost Bre-B transfers and 24,000+ PSE merchants broaden utility
    - Public economics and fraud outcomes are not disclosed
  notes: Benefits are limited to values explicitly stated on retained pages; they should not be read as realized economics or retention proof.
