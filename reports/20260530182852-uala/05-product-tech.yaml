chapter:
  number: 5
  title: Product & Technology
  summary: 'Public evidence shows Ualá is a multi-product financial ecosystem rather than a plain wallet: Argentina exposes cards, deposits, investing, loans, and merchant acquiring; Mexico adds a licensed bank wrapper with card and yield propositions; Colombia adds PSE and Bre-B-enabled payments. The clearest technical openness sits on the merchant side, where Ualá Bis publishes checkout documentation and official NodeJS/PHP SDKs, while backend architecture, uptime, and security-certification evidence remain largely undisclosed.'
sections:
- id: product-surface-and-user-jobs
  title: Product surface and customer jobs
  body: 'The directly evidenced product surface is much broader than a typical stored-value wallet. In Argentina, current Ualá pages show a free savings-account wrapper, remunerated balances, a credit card with Google Pay and Apple Pay support, personal loans, and a full in-app investing menu spanning dollars, FCIs, bonds, stocks, CEDEARs, and term deposits. The merchant surface is equally material: Ualá Bis is not just a generic QR page, but a live family of POS Pro, QR, Tap to Pay, and online-checkout tools with publicly disclosed pricing. Mexico and Colombia matter because they show the regional operating template rather than one-market marketing copy. Mexico is presented as a bank-operated product with IPAB protection and app-store-disclosed yield, card, and term-reserve features; Colombia shows a low-value deposit product linked to a Mastercard debit card plus PSE, service payments, and Bre-B transfers. The key judgment is therefore evidence-based: Ualá publicly looks like an ecosystem app that crosses spending, saving, borrowing, investing, and merchant collection, not a single-function wallet.'
