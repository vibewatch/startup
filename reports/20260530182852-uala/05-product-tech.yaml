- id: trust-privacy-and-diligence-limits
  title: Trust, privacy, compliance, and diligence limits
  body: Trust and compliance evidence is real but uneven across modules. Argentina's bank pages publish deposit-guarantee language and formal complaint-handling channels; Mexico's main page states that products are bank-operated and IPAB-insured; Colombia's legal hub names the low-value-deposit rulebook, app terms, payment-reversal rules, and Bre-B terms. On the product side, Mastercard's partner release highlights infoless card presentation and instant notifications, while the App Store privacy label gives unusually concrete data-handling clues by separating identifiers/usage tracking, identity-linked data, and non-linked diagnostics. The weak point is public assurance depth. The retained pack does not show a public uptime page, named security certifications, or detailed technical controls beyond the merchant-checkout UX. It also does not provide public policy wording for the new insurance product despite the 2026 launch claim. For diligence, that means Ualá can be credited for visible product breadth and regulatory wrappers, but not for backend resilience or security maturity that has not been publicly evidenced.
