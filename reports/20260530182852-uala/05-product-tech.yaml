- id: operating-model-and-integrations
  title: Operating model, integrations, and directly evidenced architecture
  body: 'Public evidence is strong on operating model and weak on backend internals, so the analysis should stay at that boundary. What is directly visible is a layered model: consumer distribution through the mobile app and app stores; local legal wrappers such as Ualá Bank, Ualá México''s banking entity, and Colombia''s depósito de bajo monto; product modules for cards, deposits, investing, loans, and merchant collection; and external rails such as Mastercard, Google Pay, Apple Pay, PSE, Bre-B, and the ABC Capital/CoDi-SPEI environment in Mexico. Merchant technology is the most concrete technical surface. Ualá Bis publishes checkout documentation, describes input validation and denial-recovery flows, and maintains official NodeJS and PHP SDKs on GitHub. That is meaningful because it proves some programmable surface and merchant-integration intent. What is not public is equally important: the retained sources do not reveal cloud vendors, core-ledger choices, service topology, uptime architecture, or a public status page. The chapter therefore treats infrastructure and resilience claims conservatively and avoids inventing backend detail from marketing prose.'
