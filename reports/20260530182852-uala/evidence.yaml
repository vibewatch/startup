evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: governance-map
    missingEvidence: A full holding-company board package, committee list, shareholder agreement summary, and current ownership table.
    whyItMatters: >-
      Chapter one can name the founder and the disclosed Ualá Bank authorities, but it cannot yet convert that into a
      complete group-governance or control model.
    diligencePath: >-
      Request the latest board deck, board/committee roster, shareholder cap table, and director biographies for the
      parent and each regulated entity.
    relatedQuestionRefs:
      - QO007
      - QO015
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: latest-round-size
    missingEvidence: >-
      Primary financing documents or a reconciled company statement confirming whether the March 2026 round was $195M or
      $197M and how it should roll into cumulative capital raised.
    whyItMatters: >-
      The exact amount affects the cumulative funding figure and weakens precision in the capital-history narrative if
      left unresolved.
    diligencePath: >-
      Obtain the executed financing summary, investor closing memo, or an updated company funding page that reconciles
      the March 2026 amount across official surfaces.
    relatedQuestionRefs:
      - QO014
      - QO016
    relatedTableRefs:
      - TO001
      - TO003
  - type: stale
    severity: material
    topic: current-headcount
    missingEvidence: A current consolidated employee count by market and entity, plus office footprint and remote-work distribution.
    whyItMatters: >-
      Historical staffing disclosures exist, but they are not current enough to use as a live operating KPI or
      efficiency denominator.
    diligencePath: Request HR headcount by entity and geography as of 2026-05-30, plus a reconciliation to 2024 office disclosures.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: debt-capital-structure
    missingEvidence: Any current corporate debt facilities, warehouse lines, preference stack, or other non-equity obligations.
    whyItMatters: >-
      Valuation and downside analysis require knowing whether dilution or leverage sits above common equity, and public
      funding releases do not answer that question.
    diligencePath: Request the latest cap-table waterfall, debt schedule, and financing legal summary from management or counsel.
    relatedQuestionRefs:
      - QO017
  - type: stale
    severity: minor
    topic: user-metric-vintage
    missingEvidence: >-
      A synchronized public metrics page that aligns users, customers, loans, and investment-client counts across
      official surfaces.
    whyItMatters: >-
      The chapter can handle 8M, 9M, and 11M metrics by date, but unsynchronized pages make it harder to present one
      canonical current number without explanation.
    diligencePath: Ask management for a current metrics sheet and a changelog for pages that still display older numbers.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: Ualá country-level customer and transaction mix
    missingEvidence: >-
      No public source breaks out Ualá active customers, balances, payment volume, or credit users by Argentina, Mexico,
      and Colombia.
    whyItMatters: >-
      Without country-level operating metrics, public evidence can support why the markets matter but not how much of
      each market Ualá is actually capturing.
    diligencePath: >-
      Request monthly active users, funded accounts, payment TPV, and credit vintages by country from the company data
      room.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: missing-source
    severity: material
    topic: Country-level SAM and take-rate benchmarks
    missingEvidence: >-
      Public sources provide market penetration and rail-throughput signals, but not a clean consumer-finance SAM or
      take-rate benchmark that matches Ualá’s exact product mix in each country.
    whyItMatters: >-
      A broad TAM can overstate value if merchant economics, credit spread, and balance monetization differ materially
      by country.
    diligencePath: >-
      Obtain internal market planning or commission country-level consumer-finance sizing with separate assumptions for
      accounts, payments, credit, and savings monetization.
    relatedQuestionRefs:
      - QM004
      - QM024
  - type: missing-source
    severity: material
    topic: Cross-country credit quality benchmark
    missingEvidence: >-
      There is no clean public benchmark comparing digital-credit default curves across Ualá’s three core markets on a
      like-for-like basis.
    whyItMatters: Credit can be the most valuable layer in the stack, but only if cohort losses stay below spread and fee income.
    diligencePath: >-
      Request country-level delinquency, charge-off, and repeat-borrow curves for Ualá and benchmark against local
      peers.
    relatedQuestionRefs:
      - QM020
      - QM021
      - QM022
  - type: stale
    severity: minor
    topic: Colombia and Mexico official survey timing
    missingEvidence: >-
      The strongest official inclusion stock data for Colombia is full-year 2023 and the strongest official Mexico
      inclusion detail available through fetched sources is ENIF 2024 summarized in secondary reporting.
    whyItMatters: >-
      Recent operating momentum is clear, but lagged survey cycles mean some current-period penetration judgments still
      rely on older inclusion snapshots.
    diligencePath: Refresh this chapter when newer official inclusion surveys or supervisory dashboards publish.
    relatedQuestionRefs:
      - QM006
      - QM007
  - type: missing-source
    severity: material
    topic: country-level-monetization
    missingEvidence: >-
      Country-level active users, deposit balances, merchant TPV, and product-level take rates for Ualá and the main
      peer set.
    whyItMatters: >-
      Without country-level monetization data, public analysis can rank breadth and distribution but not prove which
      platform has the strongest unit economics.
    diligencePath: >-
      Request cohort-level country dashboards or board materials showing active users, balances, TPV, take rate, and
      revenue mix by Argentina, Mexico, and Colombia.
    relatedQuestionRefs:
      - QP024
  - type: conflicting-data
    severity: minor
    topic: peer-scale-comparability
    missingEvidence: >-
      A normalized definition set distinguishing customers, monthly active users, merchants, and enterprise clients
      across peers.
    whyItMatters: >-
      Several public sources cite scale with different denominators, which can overstate or understate Ualá’s true
      relative position.
    diligencePath: >-
      Standardize peer KPIs to monthly active consumers, active merchants, and funded accounts before using public user
      counts in valuation work.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: material
    topic: credit-unit-economics
    missingEvidence: Country-level loss curves, funding cost, and contribution margin for Ualá’s credit products versus peer products.
    whyItMatters: >-
      The strongest long-run competitive advantage may come from underwriting and funding, but public sources do not
      show enough detail to compare credit economics rigorously.
    diligencePath: >-
      Request vintage tables, funding-cost disclosures, and margin bridges for each country to compare economics against
      Nu, Mercado Pago, and local incumbents.
    relatedQuestionRefs:
      - QP026
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A primary financing document or reconciled company statement that resolves whether the March 2026 round was $195M
      or $197M and how it rolls into cumulative capital raised.
    whyItMatters: >-
      Exact recent equity proceeds affect dilution, runway interpretation, and whether public valuation math is being
      applied to the right capital base.
    diligencePath: >-
      Request the March 2026 term sheet, cap-table bridge, or board-approved financing memo and reconcile it against
      both the company release and trade coverage.
    relatedQuestionRefs:
      - QI015
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: Consolidated revenue, country revenue mix, GMV, merchant TPV, and take-rate disclosure by major product line.
    whyItMatters: >-
      Without topline and mix, the investor cannot judge revenue quality, concentration, or how much monetization comes
      from higher-risk lending versus stickier deposits and payments.
    diligencePath: >-
      Obtain the latest management reporting pack with monthly revenue by country and by product, plus payment volume
      and merchant take-rate bridges.
    relatedTableRefs:
      - TI001
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: margin-disclosure
    missingEvidence: >-
      Gross margin and contribution margin by product, including interchange pass-through, funding cost, credit
      provisions, and servicing expense.
    whyItMatters: >-
      Visible list pricing does not reveal whether deposits, merchant acquiring, insurance, or lending are profitable
      after funding, fraud, and loss costs.
    diligencePath: >-
      Request product-level P&L contribution bridges for deposits, cards, merchant acquiring, lending, investments, FX,
      and insurance for the last twelve months.
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-runway
    missingEvidence: Current group cash balance, monthly burn, debt obligations, and base-case runway by legal entity.
    whyItMatters: >-
      Fresh equity capital does not by itself prove liquidity sufficiency, especially when the only public filing window
      is still loss-making.
    diligencePath: >-
      Request treasury cash reports, legal-entity cash waterfalls, debt schedules, and board runway scenarios covering
      the next 18 months.
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, and sales-cycle metrics for consumers, merchants, and cross-sold financial products.
    whyItMatters: >-
      Public growth metrics do not show whether Ualá is buying growth inefficiently or whether the merchant stack has
      attractive acquisition economics.
    diligencePath: >-
      Request cohort-based acquisition cost, activation, and payback data by channel and geography for both retail and
      merchant products.
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: credit-vintages
    missingEvidence: Cohort delinquency, net charge-off, recovery, and vintage performance data outside the single Mexico bank filing.
    whyItMatters: >-
      A 22.7% stage-3 ratio in the disclosed Mexico book and elevated Argentine market delinquency make loss performance
      central to any margin view.
    diligencePath: >-
      Request vintage tables, risk-score migration data, and provision policy by market and product, including
      secured-card, personal-loan, and merchant-credit exposure.
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: insurance-and-investments
    missingEvidence: >-
      Revenue contribution, attach rate, and margin contribution from insurance, brokerage, and fund-distribution
      activities.
    whyItMatters: >-
      These cross-sell products may improve revenue quality relative to unsecured lending, but public sources only show
      activity or product presence, not economic contribution.
    diligencePath: >-
      Request product-attach-rate dashboards and fee-income splits for insurance, FCI distribution, FX, and brokerage
      activity by market.
    relatedTableRefs:
      - TI001
      - TI005
  - type: private-evidence-only
    severity: material
    topic: architecture-gap
    missingEvidence: >-
      A current system architecture diagram naming core ledger, cloud / hosting providers, major data stores,
      authentication controls, and disaster-recovery design.
    whyItMatters: >-
      Product breadth is visible, but resilience, vendor concentration, and incident blast radius cannot be underwritten
      from the public pack.
    diligencePath: Request CTO / platform-lead materials, current architecture diagrams, DR runbooks, and postmortem samples.
    relatedQuestionRefs:
