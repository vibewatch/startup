    severity: material
    topic: funding
    missingEvidence: A primary financing document or reconciled company statement that resolves whether the March 2026 round was $195M or $197M and how it rolls into cumulative capital raised.
    whyItMatters: Exact recent equity proceeds affect dilution, runway interpretation, and whether public valuation math is being applied to the right capital base.
