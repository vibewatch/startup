  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: Consolidated revenue, country revenue mix, GMV, merchant TPV, and take-rate disclosure by major product line.
    whyItMatters: Without topline and mix, the investor cannot judge revenue quality, concentration, or how much monetization comes from higher-risk lending versus stickier deposits and payments.
    diligencePath: Obtain the latest management reporting pack with monthly revenue by country and by product, plus payment volume and merchant take-rate bridges.
