      - label: Bank + IPAB cover
        tone: positive
        detail: Bank deposit product under Ualá, S.A. with IPAB coverage up to 400k UDI.
      - label: Low-value wallet deposit
        tone: neutral
        detail: Depósito de bajo monto with rendimientos and thinner public protection detail in the retained pack.
