callouts:
- calloutType: risk
  title: Mexico is scaling, but the only hard P&L window is still loss-making
  body: The Mexico bank filing is encouraging on deposits, credit growth, capital, and liquidity, but it still shows a large net loss, a thin net interest margin, and a high stage-3 loan ratio. Public investors therefore have evidence of growth, not yet evidence of clean profitability.
  claimRefs:
  - CI028
  - CI029
  - CI032
  - CI035
  - CI036
  - CI061
- calloutType: insight
  title: Cross-sell is the visible monetization engine
  body: The clearest public economic pattern is that Ualá wants the same user to hold balances, transact frequently, borrow, invest, insure, and—if a merchant—collect payments inside the same app family. That is strategically attractive, but it also means no single public price point explains the model by itself.
  claimRefs:
  - CI001
  - CI003
  - CI004
  - CI014
  - CI015
  - CI058
  - CI063
  - CI064
- calloutType: recommendation
  title: Do not underwrite runway or valuation from public materials alone
  body: Public evidence is good enough to map the business model and identify the risk centers, but not good enough to underwrite consolidated revenue quality, cash runway, or downside protection. A private operating pack and financing bridge are mandatory before using the $3.2bn mark as an investable anchor.
  claimRefs:
  - CI039
  - CI040
  - CI059
  - CI062
  - CI066
  - CI067
  - CI068
