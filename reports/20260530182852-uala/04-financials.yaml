  - type: private-evidence-only
    severity: blocking
    topic: margin-disclosure
    missingEvidence: Gross margin and contribution margin by product, including interchange pass-through, funding cost, credit provisions, and servicing expense.
    whyItMatters: Visible list pricing does not reveal whether deposits, merchant acquiring, insurance, or lending are profitable after funding, fraud, and loss costs.
    diligencePath: Request product-level P&L contribution bridges for deposits, cards, merchant acquiring, lending, investments, FX, and insurance for the last twelve months.
