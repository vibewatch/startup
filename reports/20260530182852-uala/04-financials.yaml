- id: TI001
  title: Revenue streams table
  columns:
  - stream
  - mechanism
  - unit
  - current value / status
  - quality / caveat
  - diligence ask
  rows:
  - - Argentina remunerated account
    - Deposit spread plus activity-triggered retention/cross-sell
    - TNA on bank balances
    - 20% base; 23% at ARS250k qualifying activity; 26% at ARS500k; only ARS10k-1m earns
    - Visible list pricing, but spread capture and hedge cost are undisclosed
    - Request monthly average remunerated balances, funding cost, and balance-churn by tier
  - - Argentina term deposits
    - Bank spread on fixed-tenor deposits
    - TNA by tenor
    - 20%-28% TNA across 30-365 days
    - List rate is public, realized volume mix is not
    - Request term-deposit balances, repricing cadence, and margin contribution by tenor
  - - Argentina FX and dollar investing
    - FX conversion plus fund distribution / trading economics
    - Commission / yield
    - Official-dollar trades advertised with no commission; MEP commission embedded; dollar FCI pitched around 6% annual
    - Product presence is visible, but fee split and spread economics are not
    - Request FX spread capture, MEP commission rates, and dollar-fund fee economics
  - - Argentina investments / brokerage
    - Fund distribution, brokerage activity, and custody economics
    - Products and account fees
    - 6 peso FCIs, 1 dollar FCI, stocks, bonds, CEDEARs; account opening and maintenance free
    - Activity is visible, revenue share is not
    - Request assets under custody, fee take rates, and monthly active investors
  - - Argentina consumer lending
    - Interest income and ancillary fees booked in non-bank affiliate
    - Loan pricing disclosed pre-offer
    - TNA/TEA/CFT vary by borrower and are shown only before acceptance
    - Reveals monetization path but not actual yield, losses, or approval funnel
    - Request portfolio APR distribution, charge-offs, and approval / decline rates
  - - Argentina merchant acquiring
    - Merchant discount rate and related transaction services
    - MDR
    - POS Pro 4.9%+IVA credit/prepaid and 2.9%+IVA debit; QR 0.8%-4.9%; Tiendanube gateway 4.9%+IVA instant settlement
    - List MDR is clear, but realized take rate and fraud / servicing costs are not
    - Request TPV, blended MDR, chargeback/fraud loss, and settlement-float economics
  - - Mexico bank products
    - Net interest income, interchange, and lending inside bank entity
    - Bank P&L and balance-sheet lines
    - 2024 filing shows interest income, fee income, deposit growth, credit growth, and loss-making operations
    - Best hard public financial window, but only for one legal entity
    - Request management bridge from Mexico bank P&L to consolidated group revenue and EBITDA
  - - Colombia low-value deposit wallet
    - Likely interchange, balance-spread, and service-fee economics
    - Wallet / deposit product
    - Remunerated depósito de bajo monto with fee categories disclosed publicly
    - Public disclosures show the rulebook but not enough granular economics
    - Request active users, interchange yield, fee incidence, and contribution margin by product
  notes: Public pricing reveals mechanisms, not realized revenue mix. Argentina has the densest public monetization data; Mexico is strongest on regulated financial statements; Colombia remains the thinnest economic disclosure surface.
