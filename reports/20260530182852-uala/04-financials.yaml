- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - current public substitute
  - why it matters
  - underwriting impact
  - exact diligence path
  rows:
  - - Consolidated revenue
    - Customer, loan, and investing-account counts
    - Scale does not equal topline quality
    - Cannot test valuation against revenue multiple or growth durability
    - Request monthly revenue by country and product
  - - Country revenue mix
    - Country product pages and license footprints
    - Different entities and products imply very different margin quality
    - Cannot tell whether growth is coming from higher-risk or higher-quality streams
    - Request country-level P&L and revenue bridges
  - - Merchant TPV and blended take rate
    - Public list MDRs and instant-settlement claims
    - List pricing does not reveal realized economics
    - Cannot value the merchant business or test payment-margin durability
    - Request TPV, active merchants, and realized MDR / chargeback data
  - - Gross margin by product
    - Mexico bank NIM, fee income, and loss data
    - Needed to judge whether payments, deposits, lending, or insurance deserve more weight
    - Margin path remains unproven
    - Request product-level gross margin and contribution view
  - - CAC / payback / sales cycle
    - One historical merchant-growth datapoint from a 2023 PR
    - Growth efficiency determines whether scale can outrun burn
    - Public evidence cannot test acquisition economics
    - Request cohort CAC and payback by channel and market
  - - Current cash / burn / runway
    - Recent equity round plus bank capital ratios
    - Capital raised is not cash-on-hand
    - Runway cannot be underwritten publicly
    - Request treasury reports and base / downside runway plans
  - - Credit vintages / NCOs outside Mexico
    - Mexico stage-3 ratio plus Argentina market-delinquency indicators
    - Loss curves drive lending margin and capital needs
    - Public evidence overstates uncertainty on credit quality
    - Request vintage, NCO, recovery, and roll-rate data by market
  - - Insurance and investments revenue contribution
    - 300k insurance quotes and product pages showing FCIs / brokerage
    - Cross-sell quality could materially improve revenue mix
    - No way to size non-lending monetization today
    - Request attach rates, fee income, and product contribution from insurance and investing
  notes: These are the core public-data blockers. None can be solved by more website scraping alone; they require company disclosure, confidential reporting, or primary financing documents.
