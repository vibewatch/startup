        tone: warning
        detail: Alau discloses pricing only pre-acceptance and sits outside the bank disclosure page.
      - label: Bank-book credit risk
        tone: warning
        detail: The filing shows cards and personal loans with a 22.7% stage-3 ratio.
      - label: Opaque in public pack
        tone: warning
        detail: No retained public filing gives Ualá Colombia credit economics.
    - label: Explicit public price points
