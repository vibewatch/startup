    - Spread economics exist but are still small relative to operating cost
    - Request monthly NIM bridge by deposit and lending product
  - - Mexico 2024 fee income
    - MXN32m
    - Medium
    - Reveals whether card and transaction activity is monetizing through fees
    - Interchange is real, but still small versus expenses
    - Request fee-income split across interchange, service fees, and merchant products
  - - Mexico 2024 net loss
    - MXN1,170m
    - Medium
    - Best public proxy for current operating leverage
    - Scale is not yet converting into profitability
    - Request 2025 YTD P&L and EBITDA bridge
  - - Mexico stage-3 ratio
    - 22.7% of book
    - Medium
    - Credit quality is central for a consumer-lending model
    - Loss burden remains material even after improvement versus 2023
    - Request vintage curves, NCOs, and recovery data
  - - Mexico traditional funding
    - MXN6,044m
    - Medium
    - Funding base underpins lending and payment economics
    - Deposit gathering is working faster than topline disclosure suggests
    - Request average balance, cost of funds, and deposit mix
  - - Argentina average fintech ticket
    - ARS541,394 vs >ARS4.1m bank average
    - Medium
    - Shows why high unit volume does not equal large credit dollars
    - Fintechs can scale count faster than balance-sheet dollars
    - Request Ualá-specific ticket size and repeat-borrower share
  - - Merchant acquiring MDR
    - 0.8%-4.9% public range
    - Medium
    - Directly shapes take rate for payment volume
    - Headline pricing is visible; blended take rate is not
    - Request TPV, blended MDR, and fraud / chargeback cost
