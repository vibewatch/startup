- id: capital-adequacy-and-risk
  title: Capital adequacy, funding dependence, and adverse risk
  body: 'Capital adequacy looks strongest in Mexico at the regulated-entity level, while consolidated funding dependence remains material at the group level. The Mexico filing shows a 55.8% capital ratio and 1,816% liquidity coverage ratio at 4Q24, plus MXN2.79bn of shareholder capital injected since 2022. Those metrics imply the bank is not running out of regulatory buffers immediately, even with a 22.7% stage-3 loan ratio and a deeply negative ROE. But they do not answer the more important consolidated question: how much cash the group holds, how quickly it burns capital outside the bank, or how much future growth depends on another equity round. On that front, public evidence cuts both ways. Ualá did raise fresh capital in March 2026, but official and trade sources still disagree on whether the round was $197m or $195m, even while agreeing on the $3.2bn valuation. The company also warns that forward-looking use-of-funds statements are not promises. The Argentine external environment adds
    another caution. BCRA and industry sources show a fast-growing fintech-credit market with double-digit irregularity, and independent reporting on wallet lending describes record delinquency and very high total borrowing costs. Put differently, capital access is real, but so are credit-risk and funding-cost pressures.'
