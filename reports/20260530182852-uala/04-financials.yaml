- id: TI004
  title: Capital adequacy table
  columns:
  - item
  - public value / status
  - why it matters
  - capital-structure implication
  - forward trigger / risk
  - diligence ask
  rows:
  - - March 2026 equity round amount
    - $197m official / $195m trade coverage
    - Recent capital injection is the clearest public buffer signal
    - Supportive, but the exact proceeds still need reconciliation
    - Conflicting round amount clouds cumulative-capital math
    - Request the signed financing bridge or closing memo
  - - Post-money valuation
    - $3.2bn
    - Current valuation anchor for underwriting context
    - Investors still back the platform despite disclosure opacity
    - Valuation does not prove revenue quality or runway
    - Request the board deck used for the 2026 financing
  - - Mexico cumulative shareholder injections
    - MXN2,790m since Jan 2022
    - Shows the bank has required repeated equity support
    - Capitalization is meaningful but not self-funding proof
    - Equity support may remain necessary if losses persist
    - Request legal-entity capital plan for 2026-2027
  - - Mexico regulatory buffers
    - ICAP 55.8%; LCR 1,816%
    - Signals the regulated entity is not immediately capital constrained
    - Bank solvency is not the same thing as group liquidity sufficiency
    - Consumer-credit stress could still absorb capital over time
    - Request stress-test outputs and internal risk limits
  - - Mexico annual profitability
    - MXN1,170m net loss in 2024
    - Losses determine how quickly capital is consumed
    - Capital adequacy must be read alongside continuing burn at the entity level
    - Operating leverage is unproven
    - Request 2025 YTD profitability and monthly burn by entity
  - - Parent support caveat
    - Official Argentina bank footer says no support beyond integrated foreign-shareholder capital
    - Limits assumptions about an implicit parent or foreign-shareholder backstop
    - Capital support should be treated as explicit, not automatic
    - Stress scenario could expose ring-fencing and entity separation
    - Request intragroup funding agreements and capital-support commitments
  - - Cash on hand
    - Not disclosed publicly
    - Most direct runway input
    - Public market cannot judge liquidity sufficiency
    - Potential hidden dependency on another round or on bank-entity cash
    - Request treasury cash balances and restricted-cash schedule
  - - Monthly burn / runway / next-round trigger
    - Not disclosed publicly
    - Needed to tie valuation, losses, and capital raise into a timing view
    - Runway is not underwritable from public materials
    - Growth spend or credit losses could accelerate funding needs
    - Request board runway scenarios and next-round assumptions
  notes: The table mixes hard regulatory-capital data from Mexico with softer group-level funding signals. It should not be read as a consolidated liquidity schedule because cash and runway remain undisclosed.
