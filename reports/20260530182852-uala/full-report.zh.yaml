        - 当时墨西哥客户超过 1.4M
        - 墨西哥消费信贷 / 私募市场的可用参照点。
        - 估值来自 2022 年，产品范围也更窄。
      - - Neon
        - 私募公司
        - 2022 年 Series D 轮约 US$300M
        - 发布时有 15M 客户、月交易额 R$5.8B
        - 巴西消费金融科技规模的可用标记。
        - 公告披露的是融资规模和运营规模，不是明确投后估值。
      - - Creditas
        - 私募公司
        - 2022 年 Series F 轮，估值 $4.8B
        - 2021 年 Q3 收入 $46.8M；2021 年年化收入约 $200M
