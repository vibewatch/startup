        - 衡量月活交易用户，而不是注册账户
      - - 阿根廷通胀和劳动非正规化
        - 约束
        - 当前
        - 可能加速钱包使用，但会扰动信贷质量和存款
        - 在通胀和收入波动情景下压力测试还款与余额留存
      - - 墨西哥按牌照类型划分的监管阶梯
        - 约束
        - 当前
        - 不同牌照决定产品范围、保险和经济性
        - 按牌照路径厘清 Ualá 墨西哥路线图、许可和资本需求
      - - 哥伦比亚农村和低收入使用缺口
        - 约束
        - 当前
        - 拥有钱包不等于商户和收入流会全面数字化
        - 索取地域使用、商户密度和提现行为数据
      - - 信贷风险集中
        - 约束
        - 当前
