      - number: '8.5'
        title: 建议、退出准备度和尽调闸门
        blocks:
          - type: paragraph
            body: >-
              当前轮价格下，投资建议综合结论是观察，中等信心，高剩余风险。新投资者不应只因为 Ualá
              又完成一轮上行轮就抬价进入；公司仍需要证明公开可比公司每个季度已经展示的东西：收入质量、利润率结构，以及扣除信贷成本后的增长韧性。这个故事的最佳版本仍有吸引力。Ualá
              拥有客户规模、区域牌照、产品广度和资助方支持，这些是大多数拉美金融科技公司想要的资产。但从这里走到买入，需要尽调，而不是热情。管理层必须披露合并收入或
              ARR、毛利率、国家层面贡献利润率、客户激活和主账户行为、墨西哥贷款分批损失曲线，以及普通股之上的优先股堆叠。在此之前，退出准备度更像另一轮私募融资或战略老股交易，而不是公开市场重估。如果公司无法补上这些缺口，或下一轮需要重结构条款，投资逻辑应从观察转向回避，而不是从观察转向买入。
