  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、替代品，以及这些市场为何重要
        blocks:
          - type: paragraph
            body: >-
              对 Ualá 而言，相关市场边界是阿根廷、墨西哥和哥伦比亚大众用户的消费金融操作系统：交易账户和钱包、借记卡关联和转账驱动的支付、小额无抵押信贷，以及依附在同一日常账户上的储蓄或投资余额。它不是全部银行收入、
              企业资金管理、房贷、高净值财富管理或企业软件。现状替代品因国家而异，但轮廓清楚：现金、传统银行账户、银行卡主导的收单，以及非正式或非银行信贷。在阿根廷，钱包与银行的界限已经模糊， 因为 CVU
              能与银行账户互通，而且多数即时转账已经触达支付账户。在墨西哥，关键替代品仍是现金加传统轨道；数字钱包和数字银行争夺的是主账户关系，而不是偶尔叠加的一层。在哥伦比亚，
              钱包对许多用户来说已经和储蓄账户一样常见，但现金和农村摩擦仍决定实际支付行为。


              这些市场放在一起重要，是因为每个国家都验证了区域数字银行投资逻辑的不同部分。阿根廷展示数字支付和钱包余额的高频参与强度；墨西哥提供最大规模池，且拥有深厚的汇款和支付引擎；哥伦比亚说明，
              一旦共同规则到位，互操作性能压低摩擦并加快钱包主导的使用。Ualá 的机会因此不是一个同质化的拉美 TAM，而是一个三国组合：同一套产品栈可以解决传统消费金融的不同失灵点。
