  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与剩余风险排序
        blocks:
          - type: paragraph
            body: >-
              Ualá 的风险不是一个孤立问题，而是一条传导链。第一环是墨西哥的信贷和融资执行：唯一一份公开且具约束力的银行监管文件仍显示全年大额亏损，stage-3 比率为
              22.7%；与此同时，管理层还把墨西哥定义为必须扩张并实现可持续盈利的市场。第二环是阿根廷的宏观和家庭部门压力。2026
              年官方与独立来源仍指出，家庭信贷异常率处于高位、逾期压力达到两位数，货币框架一旦再次遭遇汇率波动仍很脆弱。第三环是国家之间的监管不对称。客户看到的是一个品牌，但公开页面显示的法律边界差异很大：阿根廷仍是 PSP
              和非银行放款机构，墨西哥是有 IPAB 保障和 CONDUSEF 申诉渠道的银行，哥伦比亚则是金融公司。除此之外，应用评论投诉和正式扣款争议流程带来信任与反欺诈处理风险；Mercado Pago 和 Nubank
              施加竞争压力，而集团层面披露仍缺少国家亏损、欺诈和投诉统计。下方热力图和传导图把这些排为本章最高的剩余风险暴露，而不是孤立的标题风险。
