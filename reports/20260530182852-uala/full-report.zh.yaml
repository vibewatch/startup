  - id: TV005
    title: 打破投资逻辑的触发项和否决线表
    columns:
      - 触发项
      - 阈值 / 事件
      - 为什么重要
      - 行动含义
    rows:
      - - 墨西哥信贷未恢复正常
        - Stage-3 贷款或类似坏账指标持续高企，且看不到可信下降路径
        - 最大变现市场仍在消耗资本，而不是证明经营杠杆。
        - 除非价格大幅下修，否则从「观察」转为「回避」。
      - - 新一轮融资以重结构或折价条款完成
        - 融资依赖优先权、重置条款，或较 2026 年估值标记显著折价
        - 说明既有投资方支持是在掩盖估值问题，而不是解决问题。
        - 对新股进入而言，应把最新 $3.2B 估值标记视为偏高。
      - - 集团层面收入质量仍不披露
        - 管理层在尽调中仍无法拿出收入、毛利率或留存数据
        - 没有分母，投资人押注的是声誉，不是经济性。
        - 不应按最新估值标记往上付价。
      - - 信任和客服摩擦恶化
        - 独立投诉和评价信号恶化，客服仍然薄弱
        - 交叉销售和存款粘性靠信任支撑，高毛利产品尤其如此。
        - 下调乐观情景，并缩短观察名单时间表。
      - - 看不到类公开市场退出路径
        - 仍没有经审计集团材料、清晰老股交易流程或公开市场准备信号
        - 流动性选项受限，估值继续锚在私募投资方胃口上。
        - 维持「观察 / 继续研究」立场。
    notes: 这些触发项是 IC 实用红灯，不是完整风险清单；每一项都直接指向估值传导，而不是泛泛的公司质量问题。
    claimRefs:
      - CV011
      - CV012
      - CV014
      - CV020
      - CV041
