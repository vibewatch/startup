      - number: '7.2'
        title: 各司法辖区的监管、牌照和行为合规风险
        blocks:
          - type: paragraph
            body: >-
              公开法律页面说明，Ualá 在拉丁美洲并不是同一个监管对象。阿根廷的 Alau Tecnología
              注册了支付、放贷和互操作钱包业务，但明确声明自己不是银行，钱包余额不受银行存款保护。要害在于，品牌可以营销一套完整金融体验，但部分消费者保护取决于到底是哪一家本地实体承接产品。墨西哥走向相反一端：Ualá
              当前页面列出一家银行，强调最高 400,000 UDIs 的 IPAB 保障，并在出问题时把用户引向 UNE 和
              CONDUSEF。哥伦比亚处在第三种边界里，隐私和法律页面列出一家金融公司，并给出低额存款、支付撤销和 Bre-B
              条款的单独规则。这些差异不是装饰。它们抬高行为合规风险，让跨国产品沟通更难，也迫使尽调核验营销、披露和投诉处理是否始终与每项功能背后的实体一致。墨西哥 Buró
              页面尤其有说明力，因为它把投诉、处罚和滥用条款放到金融用户比较的前台；一家想从低客单获客扩张到更深信贷和存款关系的公司，正该在这个公共框架下接受检验。
