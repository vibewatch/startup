      - number: '1.1'
        title: 身份、总部和商业模式
        blocks:
          - type: paragraph
            body: >-
              第一章应把 Ualá 定位为拉美数字银行和金融产品生态，而不是单一预付卡应用。公司自己的介绍页面显示，它是一家技术企业，在阿根廷、墨西哥和哥伦比亚提供卡、支付、信贷、投资、保险和商户收单。
              这点很关键，因为后续市场、产品和估值分析都要把 Ualá 当作一个多实体的受监管平台，拥有多条变现路径。总部也需要细分看。最清晰的高层经营信号是 September 2024 公告：Ualá 位于 Buenos
              Aires Palermo 的新办公室承担区域总部功能。与此同时，银行和非银行法律披露把 CABA 的 Coronel Marcelino Freyre 3650 用于受监管客户服务职能。因此第一章的正确结论是：
              总部在阿根廷 Buenos Aires，同时说明法律地址会随实体而变。公开规模数字方向上很强，但并非完全同步：较旧的官方页面仍称用户超过 8 million，March 2026 融资公告则称客户超过 11
              million。这更应被视为当前页面与过时页面的时间差，而不是核心身份上的明确矛盾。
