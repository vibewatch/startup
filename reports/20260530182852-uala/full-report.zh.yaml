            - label: 自主决策
              tone: neutral
              detail: 借款人自己决策，但家庭压力推高紧迫性。
            - label: 中
              tone: neutral
              detail: 只要承保摩擦保持低位，数字化路径就能跑通。
            - label: 高但有风险
