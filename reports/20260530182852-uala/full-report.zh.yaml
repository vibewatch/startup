      - number: '3.2'
        title: 国家层面动态：分发和牌照改变真实对手集合
        blocks:
          - type: paragraph
            body: >-
              国家细节会改变判断。在阿根廷，Ualá 仍像一个宽口径消费金融应用，但它身处集中度较高的赛场：Brubank 和 Naranja X 已有规模，Mercado Pago 的商户引力更强。在墨西哥，
              市场更明确地按牌照和分发引擎切分：Ualá 有银行身份和存款保护，Nu 有品类领先规模，Mercado Pago 有商户生态，Klar 在收益加信贷上进攻积极，Spin by OXXO
              则把便利店触达转化成现金到数字的护城河。 哥伦比亚又不同。Nequi 和 Daviplata 已经嵌在该国最高频的钱包习惯里，Mercado Pago 升级成融资公司主张，RappiPay
              借超级应用漏斗交叉销售金融。结果是 Ualá 的相对强项并不均匀。 在银行信任加储蓄收益可见的地方，它的公开主张最强；在本地传统机构或嵌入式生态已经控制最高频支付回路的地方，它更弱。
