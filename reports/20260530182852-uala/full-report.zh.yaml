  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议框架与投资逻辑张力
        blocks:
          - type: paragraph
            body: >-
              Ualá 现在有的是新的私募市场标记，而不是疫情时期的旧数字。2026 年 3 月融资给公司定了 $3.2 billion 的投后估值，把融资路径从 2021 年 $2.45 billion 推高到 2024 年
              $2.75 billion 后继续延伸，也让 Allianz X 领投的新一轮再次纳入重复出资的蓝筹支持方。这值得尊重：与许多拉美金融科技公司不同，Ualá 在更紧的市场里仍完成了上行轮，同时声称拥有超过 11
              million 客户，并在经营版图内拿到完整银行牌照。反向逻辑是，这个估值仍主要由资助方信念托住，而不是由上市公司式披露支撑。公开可比公司的区间很宽，从 PagSeguro 的 0.68x 过去销售额到 Nu 的
              8.41x；但 Ualá 仍不披露合并收入、毛利率、留存或集团盈利能力。Fitch
              也仍把墨西哥描述为一项正在整合、信贷损失偏高且依赖资本注入的业务。因此，当前价格下的结论是观察：质量和战略支持都真实存在，但证据还不够厚，不能把 $3.2 billion 视为显然便宜。
