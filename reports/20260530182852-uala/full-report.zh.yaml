              - CV041
      - number: '8.3'
        title: 公开市场和私募市场参考点
        blocks:
          - type: paragraph
            body: >-
              公开可比公司给出一个很宽但仍有用的区间。Nu 是拉美数字银行的高溢价基准，市值约 $63.8 billion、过去销售额倍数 8.41x；SoFi 约 $23.4
              billion、5.98x；MercadoLibre 是生态上限，市值 $86.0 billion、2.70x；dLocal 是规模更接近的支付处理商，约 $3.5 billion、2.87x；PagSeguro
              是低倍数成熟基准，约 $2.6 billion、0.68x。没有一家是完美类比：dLocal 以商户处理为先，MercadoLibre 把金融科技业务嵌在更大的电商机器里，Nu 和 SoFi
              的披露远充分得多。私募参考点噪音更大。Stori 2022 年达到 $1.2 billion，Neon 在达到 15 million 客户后于 2022 年募得 US$300 million，Creditas
              2022 年达到 $4.8 billion，并给出异常透明的收入评论。这些标记说明投资者曾为拉美消费者金融科技规模支付数十亿美元价格，但它们大多停留在 2022 年周期，因此只能部分支撑 2026
              年价格。最干净的结论是，Ualá 落在合理的区域可比区间内，但公开证据仍无法判断它应在区间内的哪个位置成交。
