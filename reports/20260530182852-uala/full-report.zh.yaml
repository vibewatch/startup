      - - 阿根廷消费者贷款
        - 利息收入和附加费用计入非银行关联公司
        - 放款前披露贷款定价
        - TNA/TEA/CFT 因借款人而异，仅在接受前显示
        - 揭示变现路径，但不揭示实际收益率、损失或审批漏斗
        - 要求提供贷款组合 APR 分布、核销和批准 / 拒绝率
