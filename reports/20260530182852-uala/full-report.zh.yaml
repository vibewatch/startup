      rows:
        - label: 领薪人群 / 首个账户寻求者
          values:
            - label: 日常资金流转
              tone: positive
              detail: 工资入账、账单支付和基础转账占主导。
            - label: 自主决策
              tone: neutral
              detail: 个人通常决定工资和支出放在哪个账户。
            - label: 中到高
              tone: positive
              detail: 在墨西哥和阿根廷，用 App 管钱已经主流化。
            - label: 中
              tone: neutral
              detail: 储蓄以及由卡或转账带动的支付，通常先于信贷出现。
        - label: 非正规劳动者 / 零工收入者
          values:
            - label: 流动性和转账可得性
              tone: positive
              detail: 他们需要没有网点摩擦的资金流转。
            - label: 家庭现金管理者
              tone: neutral
              detail: 预算决策通常在个人或家庭层面完成。
            - label: 中
              tone: neutral
              detail: 入门流程必须扛住现金使用重、连接不稳定的行为模式。
            - label: 高
              tone: positive
              detail: 一旦收入可见，信贷和储蓄交叉销售就有意义。
