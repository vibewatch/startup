      - number: '2.2'
        title: 规模测算视角和渗透信号
        blocks:
          - type: paragraph
            body: >-
              测算 Ualá 可服务机会，最干净的方法不是强行给一个 TAM 标题，而是保留多重视角。区域分析师视角把拉美数字银行市场放在 2025 的 $17.0 billion，并预计到 2034 增至 $420.9
              billion；但这个大数本身过于抽象。国家运营视角更有用。在阿根廷，BCRA 统计到 December 2025 有 37.8 million 人拥有银行和 / 或支付账户，2025 最后一季度有 29.5
              million 名电子支付用户，体系内有 61.7 million 个支付账户。在墨西哥，2024 年 18-70 岁成年人中已有 76.5% 至少拥有一种正规金融产品，但正规信贷渗透率只有
              37.3%，意味着交叉销售和深化仍有空间。支付侧，SPEI 在 2024 已处理 5.4 billion 笔发起转账。在哥伦比亚，2023 有 36.1 million 名成年人至少拥有一种正规产品， 27.5
              million 人持有与数字钱包相关的低额存款产品；Bre-B 上线数月内触达超过 33 million 名客户和 2.8 million 家商户。


              矛盾也重要。阿根廷生态在一份 2024 美国贸易说明中被描述为 432 家金融科技公司，但由行业商会支持的 2025-2026 来源则写成 939 家直接金融服务提供商，或 1,027 家生态公司。
              正确结论不是其中一个数字错了，而是边界在直接提供商和更宽生态参与者之间切换。同样的纪律也适用于 Ualá 的市场规模测算：机会很大，但公开证据更能支撑基于渗透率和支付轨道的视角， 而不是精确的公开 SAM 或
              SOM。
