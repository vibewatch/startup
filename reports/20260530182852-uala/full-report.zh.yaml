companyProfile:
  summary: >-
    Ualá 是一家后期私有拉美数字银行，Pierpaolo Barbieri 于 October 2017 在阿根廷创立。公司从卡片和钱包起步，已经扩成更宽的金融生态：卡、支付、个人信贷、投资、保险和商户收单，
    覆盖阿根廷、墨西哥和哥伦比亚，并以 Buenos Aires 作为区域总部锚点。官方 March 2026 材料称，Ualá 服务超过 11 million 名客户，并在各市场持有完整银行牌照；最新一轮由 Allianz X
    领投的融资把公司估值推至 $3.2 billion。产品和融资的公开可见度较强，但合并收入、利润率和盈利能力披露仍有限。
