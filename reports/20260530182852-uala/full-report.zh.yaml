      - number: '2.4'
        title: 增长驱动、监管顺风和区域动态
        blocks:
          - type: paragraph
            body: >-
              最强顺风因国家而异。阿根廷的顺风是强度：钱包使用率很高，即时转账快速增长，CVU 可互操作，支付账户余额也越来越多地连接货币市场产品。墨西哥的顺风是规模加轨道：庞大的成年人基数已经拥有正规产品， SPEI
              量级巨大，基于应用的账户管理上升，政策也持续推动消费者和商户从现金转向 QR、开放金融和更便宜的数字受理。哥伦比亚的顺风是互操作性：钱包已经深入消费者行为，Bre-B 给市场提供了新的共同层，
              可降低银行、钱包、合作社和商户之间的摩擦。


              区域背景放大了这些国家动态。IMARC 的区域数字银行预测，以及 GSMA 关于移动技术将在 2025 为拉美 GDP 贡献 $600 billion 的判断，都指向同一方向：该地区消费金融正在更数字化、
              更移动化，也更愿意接受软件优先分发。但 Ualá 的三个国家并不可互换。阿根廷是日常参与度最快的证明点，墨西哥是能够奖励平台宽度的规模市场，哥伦比亚则是能够奖励日常转账和钱包主导金融行为中清晰执行的互操作市场。
