        - 钱包 / 存款产品
        - 计息 depósito de bajo monto，费用类别公开披露
        - 公开披露给出规则书，但颗粒度经济性不够
        - 要求提供活跃用户、交换费收益率、费用发生率和按产品划分的贡献利润率
    notes: 公开定价揭示机制，不揭示已实现收入组合。阿根廷公开变现数据最密；墨西哥在受监管财务报表上最强；哥伦比亚仍是经济披露最薄的一面。
