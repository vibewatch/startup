  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: standard
    summary: 可见漏斗从移动端发现开始，经过开户、首次入金、重复支付行为，再到商户或信贷扩张。
    data:
      nodes:
        - id: discover
          label: 发现 Ualá
          detail: 用户或商户看到特定国家的应用商店列表、主页优惠或商户门户。
        - id: onboard
          label: 完成本地 KYC
          detail: 注册使用 DNI、INE/IFE、cédula、居留卡或 PPT，取决于市场。
        - id: fund
          label: 为账户入金
          detail: 用户通过转账、工资转入、Efecty 现金充值或首次用卡加载资金。
        - id: transact
          label: 跑通第一批核心任务
