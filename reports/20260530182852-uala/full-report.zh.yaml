        - 私人银行、顾问主导财富管理、机构资产管理
        - 使用运营余额或闲置现金的消费者储蓄者
        - 重要，因为余额留在平台上时，钱包 / 账户经济性改善
      - - 汇款相邻和跨境消费者资金流
        - 入境汇款、跨境个人转账、与 FX 相关的消费者价值储存
        - 贸易融资、企业 FX 对冲、出口商财资产品
        - 从海外收款或移动消费者资金的家庭
        - 在墨西哥尤其重要，也有助于把账户主用性从国内 P2P 扩展开
      - - 微商户受理和结算
        - QR 受理、即时转账收款、低客单商户结算、能触发营运资本的支付历史
        - 全套企业 POS 套件、全渠道商务软件、ERP/薪资 SaaS
        - 商户业主或个体经营者
        - 重要，因为许多 Ualá 市场用户既是消费者，也是非正式或微型生意里的卖家
    notes: 直接市场是消费者和微商户金融栈，可以通过移动账户或钱包分发；更广泛的银行和企业软件类别被明确排除。
