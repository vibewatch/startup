        - id: repeat
          label: 重复或加深使用
          detail: 收益余额、促销、联盟和借记卡消费构成重复行为代理指标。
        - id: expand
          label: 扩展到更高价值产品
          detail: 消费者转向贷款或投资；商户转向 POS Pro、QR 或在线结账。
      edges:
        - from: discover
