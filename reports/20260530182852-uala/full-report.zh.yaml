      - number: '7.3'
        title: 信贷、融资和宏观传导风险
        blocks:
          - type: paragraph
            body: >-
              新资本不会消除授信风险。Ualá 2026 年 3 月官方发布确认了由 Allianz X 领投的新股权融资和 US$3.2 billion 估值，但行业报道仍无法统一支票规模是 US$197 million
              还是 US$195 million。更重要的是，公开材料透露了什么、又没有透露什么。已披露的墨西哥银行报告仍显示 MXN1.17 billion 全年亏损、22.7% stage-3
              比率，并且贷款账本只有一个公开法人口径。高资本和流动性比率有帮助，但回答不了该银行之外还有多少合并亏损吸收能力，也回答不了如果增长继续快过回款，墨西哥还需要多少增量资本。阿根廷构成第二个压力点。BCRA 2026
              年 2 月银行报告称家庭信贷异常率达到 11.2%，La Nación 和 SIISA 也描述家庭逾期恶化、信贷依赖上升。BCRA、PIIE 和 Allianz 仍把 2026
              年定义为通胀降温推进、但储备、通胀和汇率脆弱性持续的一年。落到经营上，Ualá 面临双重暴露：墨西哥可能通过信贷损失吃掉资本；如果宏观波动回归，阿根廷可能拖累还款行为或融资意愿。
