        - 索取 TPV、活跃商户和实际 MDR / 拒付数据
      - - 按产品划分的毛利率
        - 墨西哥银行 NIM、手续费收入和亏损数据
        - 用于判断支付、存款、贷款或保险哪个应获得更高权重
