  - id: FR001
    title: 风险热图
    type: matrix
    layout: wide
    summary: 墨西哥信贷执行、跨国监管边界错配和阿根廷宏观外溢的剩余严重性最高，因为它们直接连到融资需求、信任和下行风险承保。
    data:
      columns:
        - 概率
        - 影响
        - 缓释成熟度
        - 剩余严重性
      rows:
        - label: 墨西哥信贷质量 + 融资依赖
          values:
            - label: 高
              tone: negative
              detail: 墨西哥是关键增长引擎，但唯一硬公开文件仍显示亏损和高企的第三阶段信贷。
            - label: 严重
              tone: negative
              detail: 如果亏损持续，新资本可能在规模转为自我供血前被消耗掉。
            - label: 中
              tone: warning
              detail: 新股权和银行层面缓冲存在，但合并吸收亏损能力未披露。
            - label: 高
              tone: negative
              detail: 在墨西哥证明亏损后能保持持续盈利前，剩余敞口仍高。
        - label: 跨国监管边界错配
          values:
            - label: 高
              tone: negative
              detail: 阿根廷、墨西哥和哥伦比亚在明显不同的法律边界下运营。
            - label: 高
              tone: negative
              detail: 营销或服务一旦错位，可能在同一品牌下触发行为合规和信任失效。
            - label: 中低
              tone: warning
              detail: 公开法律页面存在，但逐实体控制证据很薄。
            - label: 高
              tone: negative
              detail: 客户保护并不统一，因此剩余敞口仍高。
        - label: 阿根廷宏观与家庭违约外溢
          values:
            - label: 中高
              tone: warning
              detail: 官方和独立 2026 年来源仍指出拖欠、通胀和外汇脆弱性。
            - label: 高
              tone: negative
              detail: 宏观波动会压低还款行为和消费金融风险偏好。
            - label: 低
              tone: warning
              detail: 除组合管理和定价纪律外，看不到公开对冲。
            - label: 高
              tone: negative
              detail: 宏观路径在改善，但缓冲仍窄。
        - label: 客户信任 / 欺诈 / 投诉升级
          values:
            - label: 中
              tone: warning
              detail: 独立评论信号不一，正式争议处理流程已经存在。
            - label: 高
              tone: negative
              detail: 可见的欺诈或服务事件会迅速打击存款、支出和品牌信任。
            - label: 中
              tone: warning
              detail: 安全指南可见，但公开欺诈损失和投诉数据缺失。
            - label: 中高
              tone: warning
              detail: 当前评分可以接受，但信任基础披露不够扎实。
        - label: Mercado Pago 与 Nubank 竞争
          values:
            - label: 高
              tone: negative
              detail: 两家既有玩家规模都大得多，其中一家在墨西哥已经盈利。
            - label: 高
              tone: negative
              detail: 竞争会压低抽佣率、获客效率和融资选择空间。
            - label: 中
              tone: warning
              detail: 银行牌照和产品宽度有帮助，但墨西哥业务仍要跑出来。
            - label: 高
              tone: negative
              detail: 在 Ualá 证明差异化且可盈利的增长之前，残余严重性仍然偏高。
        - label: 治理与披露不透明
          values:
            - label: 中
              tone: warning
              detail: 本地银行治理有部分可见度，但母公司层面仍然很薄。
            - label: 高
              tone: warning
              detail: 亏损、欺诈和投诉数据不透明，下行风险难以定价。
            - label: 中低
              tone: warning
              detail: 部分子公司有治理页面，但补不上母公司层面的空白。
            - label: 中高
              tone: warning
              detail: 只有私募尽调补齐剩余缺口，不透明度才可控。
    approximationNotes: 概率、影响、缓释成熟度和残余严重性是基于引用证据的定序判断，而不是建模概率。
    claimRefs:
      - CR029
      - CR039
      - CR042
      - CR045
      - CR050
      - CR051
      - CR052
      - CR054
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 主要下行路径从宏观和监管传导到信用损失、信任受损，最终推高再融资需求或估值压力。
    data:
      nodes:
