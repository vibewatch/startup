      - number: '2.3'
        title: 买方分层、预算归属和采用路径
        blocks:
          - type: paragraph
            body: >-
              Ualá 市场中的主要买方、用户和付费方通常是同一个人：消费者选择把价值存在哪里、在哪里收款、转账，并偶尔借款。但大众市场仍可拆成不同运营分层。领薪者和第一账户用户需要低费率、
              应用便利的工资或日常资金流转。非正式工作者和零工重视现金存取灵活性、即时转账，以及不依赖完整传统银行关系也能运作。征信薄用户买的不是抽象的“信贷”，而是应急流动性和进入正规金融的路径。
              微商户不太关心钱包品牌，更关心转账是否快速结算、QR
              收款是否互通，以及能否在现金占比高的环境里继续经营。在墨西哥，汇款相关用户又增加了一条重要走廊，因为支付账户可以成为国际资金、国内转账以及后续储蓄或信贷的落点。


              这种分层重要，因为采用很少是一步到位的银行切换。典型路径从一个即时触发点开始，例如工资发放、政府福利、熟人转账、汇款或商户 QR 收款。随后使用加深到余额留存、重复 P2P 转账、账单支付或短期储蓄产品。
              只有到了这一层，无抵押信贷或相邻产品才更有经济意义。换句话说，Ualá 的买方地图重点不是赢得一次开户，而是压缩从第一笔交易到习惯性金融行为的时间。
