        - 估值不能证明收入质量或现金跑道
        - 索取用于 2026 融资的董事会材料
      - - 墨西哥累计股东注资
        - 自 Jan 2022 以来 MXN2,790m
        - 说明该银行需要多次股权支持
        - 资本化有分量，但不能证明能自我供血
        - 如果亏损延续，可能仍需股权支持
        - 索取 2026-2027 法人口径资本计划
      - - 墨西哥监管缓冲
        - ICAP 55.8%; LCR 1,816%
        - 说明受监管实体短期没有资本约束
        - 银行偿付能力不等于集团流动性充足
        - 消费信贷压力仍可能持续消耗资本
        - 索取压力测试结果和内部风险限额
      - - 墨西哥年度盈利能力
        - 2024 年净亏损 MXN1,170m
        - 亏损决定资本消耗速度
        - 资本充足性必须结合实体层面的持续烧钱速度来看
        - 经营杠杆尚未被证明
        - 索取 2025 YTD 盈利能力和分实体月度烧钱速度
      - - 母公司支持限制
        - 阿根廷银行官方页脚称，除已整合的外资股东资本外没有其他支持
        - 限制对母公司或外资股东隐性兜底的假设
        - 资本支持应视为显性承诺，而非自动兜底
        - 压力情景可能暴露隔离安排和实体分割
        - 索取集团内融资协议和资本支持承诺
      - - 手头现金
        - 公开未披露
        - 现金跑道最直接的输入
        - 公开市场无法判断流动性是否充足
        - 可能隐性依赖下一轮融资或银行实体现金
        - 索取司库现金余额和受限现金明细
      - - 月度烧钱速度 / 现金跑道 / 下一轮触发点
        - 公开未披露
        - 用于把估值、亏损和融资串成时间判断
        - 仅凭公开材料无法研判现金跑道
        - 增长投入或信贷损失可能加快融资需求
        - 索取董事会现金跑道情景和下一轮融资假设
    notes: 该表把墨西哥监管资本硬数据与集团层面较软的融资信号放在一起。不能把它当作合并流动性明细表，因为现金和现金跑道仍未披露。
