      - - 投资逻辑
        - 保险、贷款、投资和商户收单扩大收入面
        - 如果交叉销售真实存在，多产品能支撑相对纯支付处理商的溢价。
        - 需要附加率、队列留存和单位经济性证据。
      - - 反向逻辑
        - 没有公开合并收入、利润率或留存披露
        - 缺少关键分母，投资者无法检验 $3.2B 到底便宜还是贵。
