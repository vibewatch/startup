        title: 区域客户结构和开户边界
        blocks:
          - type: paragraph
            body: >-
              Ualá 的公开客户故事很宽，但不是一个同质用户群。公司显然面向阿根廷、墨西哥和哥伦比亚的大众零售消费者，但各国资格规则和产品表面差异很大。阿根廷的公开列表最宽：应用商店称用户可从 13 岁起用阿根廷 DNI
              开户，首页在基础卡和转账循环之上叠加有息余额、官方美元购买、贷款、投资、保险和促销。墨西哥仅限成年人，且更偏银行和信贷，公开强调 10% 返现、工资可携带、贷款和 16% 收益标题。 哥伦比亚也仅限成年人，但通过
              PSE、Efecty 现金存入和 PPT 文件开户，加入更明确的普惠角度。同一个应用商店外壳把这些本地变体一起营销，因此 Ualá 更像一个拥有国家特定运营表面的区域品牌，
