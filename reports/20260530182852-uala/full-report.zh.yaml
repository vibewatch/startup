      - number: '2.5'
        title: 宏观风险、采用约束和受证据限制的缺口
        blocks:
          - type: paragraph
            body: >-
              这些带来上行空间的市场，也带来不同变现风险。阿根廷 43.3% 的非正式就业和 16.2% 的 PNFC 异常率说明，交易参与度不会自动转化为可持续的信贷经济性；通胀和劳动不稳定既能把用户拉进数字金融，
              也会削弱还款韧性。墨西哥的核心风险不是缺少数字化潜力，而是迁移不完整：现金仍主导小额购买，农村地区互联网接入明显更弱，牌照类型也仍决定谁能提供什么。哥伦比亚的风险更细。
              该国数字渠道使用强，又有新的互操作即时支付骨干，但现金在低收入和农村分层仍有黏性，因此收入上行取决于加深重复使用，而不只是数已开户用户。


              因此，公开证据足以支撑强市场机会逻辑，但不足以声称清晰的逐国 SAM、抽佣率曲线或 Ualá 市占路径。这个缺口必须保留。正确的尽调问题不是“找一张更大的 TAM 幻灯片”，
              而是拿到按国家拆分的活跃客户数、存款结构、重复支付队列、信贷 vintage 表现，以及按产品拆分的抽佣率。在那之前，本章可以解释这些市场为何重要，但不能给出精确变现预测。
