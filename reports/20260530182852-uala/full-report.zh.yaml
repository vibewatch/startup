            body: >-
              硬财务披露比产品披露窄得多。最清楚的资产负债表和 P&L 窗口是 Ualá Mexico 的 4Q24 文件：这家公司正在扩大资金和消费信贷规模，但尚未把规模转化为利润。传统资金同比增长 81.8% 至
              MXN6.0bn，信贷增长 74% 至 MXN571m，佣金主要由借记卡和信用卡交换费驱动。但 2024 净息差只有 MXN36m，拨备为 MXN129m，运营费用为 MXN1.1bn， 年度净亏损达到
              MXN1.17bn。这个模式比原始亏损数字更重要：它说明 Ualá 能吸收余额、发放卡和贷款、产生卡费收入，但当前单位经济性仍被资金成本、信贷准备金，以及沉重的市场拓展和技术支出拖累。 March 2026
              股权公告中的公开进展指标指向规模——超过 11 million 名客户、已发放 9.2 million 笔贷款、3 million 名投资客户——但它们不能解决风控问题，因为这些是活动计数，
              不是收入、毛利或队列数据。阿根廷产品页提供了变现线索，例如 20-26% 的有息账户区间、20-28% 的定期存款利率，以及年化收益约 6% 的美元
              FCI，但仍没有披露各产品的利差捕获、费用分成或扣除损失后的贡献。
