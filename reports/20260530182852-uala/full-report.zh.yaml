  - id: TR005
    title: 缓释措施与否决标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 墨西哥信用质量拖累
        - 公开或私有数据显示 stage-3 / NPL 恶化，但准备金或定价没有同步改善
        - 墨西哥信用质量从已披露的 22.7% stage-3 高基线继续恶化
        - 若管理层无法证明扣除损失后的单位经济性，立场转向回避。
      - - 墨西哥盈利不及预期
        - 管理层在把墨西哥作为规模优先市场后，仍无法证明可信的自我供血路径
        - 在清晰经营杠杆出现前，墨西哥仍需要新资本
        - 把估值上行视为投机，并推动更低入场价或直接放弃。
      - - 阿根廷家庭压力外溢
        - BCRA 家庭不规则率和独立逾期指标继续显著上升
        - 家庭不规则率超过当前官方 11.2% 水平，且独立逾期继续恶化
        - 在宏观稳定前，假设催收更紧、审批更低、增长更弱。
      - - 行为规范 / 投诉升级
        - 监管或公司数据集中出现投诉、处罚、欺诈或滥用条款指标
        - CONDUSEF、消费者保护或欺诈指标出现任何经证实的阶跃变化
        - 立即升级对服务、争议处理和营销控制的尽调。
      - - 竞争差距扩大
        - Mercado Pago 和 Nubank 继续扩张，而 Ualá 错过墨西哥里程碑
        - Ualá 用户、商户或信贷增长明显落后，且没有盈利桥
        - 下调增长假设，把公司按细分玩家而非区域领导者重新承销。
      - - 披露仍然过薄
        - 管理层在尽调中拒绝分享国家级亏损、投诉数据、欺诈损失和现金需求
        - 除当前公开资料包外没有硬数据
        - 不要按成长股权定价承销该业务。
    notes: 这些阈值刻意保持方向性，因为公开资料过薄，除了已披露的墨西哥和阿根廷基线，无法设定精确数字约束。
