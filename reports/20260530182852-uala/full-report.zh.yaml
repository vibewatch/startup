      - number: '4.4'
        title: 财务结论和仍未披露的内容
        blocks:
          - type: paragraph
            body: >-
              从财务上看，Ualá 像一家真实的生态业务，而不是单一产品钱包；这是本章的主要正面结论。公司在存款和收益、消费信贷、商户收单、卡交换费、投资、外汇以及现在的嵌入式保险上都有可见变现钩子。
              主要负面不是缺少宽度，而是缺少合并披露。公开证据没有给出集团收入、国家收入结构、商户 TPV、抽佣率、毛利率、CAC、回本周期、烧钱速度或现金跑道。保留包中唯一完整财报来自墨西哥银行，
              有用但不完整，因为阿根廷似乎仍是最丰富的变现表面，一些放贷和券商经济性也在非银行关联公司中。因此承保立场应保持谨慎：收入质量看起来可行，利润率路径未被证明，信贷损失可能继续波动，
              外部资本重要到仅凭公开材料无法承保现金跑道。严肃投资流程应把公开证据视为足以描绘模型，但在没有私有运营包之前，不足以承保估值或下行。
