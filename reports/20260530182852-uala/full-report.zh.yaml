  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型和变现机制
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个宽但异质的变现栈。在阿根廷，Ualá 明确给存款侧收益、外汇、代销投资、消费信贷和商户收单定价；March 2026 融资公告还把保险加入生态。关键机制是：
              一部分收益不是被动余额经济学。最高有息账户档位要求用户每月在卡、QR、服务、外汇、投资或 Ualá Bis 收款中有活动，因此交易频率被同时用于加深余额和交叉销售。商户定价也足够具体，值得纳入。 Ualá Bis
              目前显示，刷卡到场 MDR 为信用 / 预付 4.9%+IVA、借记 2.9%+IVA；账户余额支付的 QR 定价低至 0.8%；通过自有 QR 流程和 Tiendanube 网关都能即时结算。
              这些有助于理解收入机制，但不能推断实际抽佣率或利润率：官方定价是标价，结算是即时的，管理层也曾调整 MDR。哥伦比亚和墨西哥扩大了版图，但公开表面更薄。哥伦比亚营销带费用披露和法律规则书的有息低额存款，
              墨西哥则更强调持牌银行包装和 IPAB 覆盖，而不是细颗粒的公开费率表。结果是一个多元的费用加利差模型，但披露密度集中在阿根廷。
