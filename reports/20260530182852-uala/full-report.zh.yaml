      - number: '4.3'
        title: 资本充足、融资依赖和反向风险
        blocks:
          - type: paragraph
            body: >-
              从受监管实体层面看，资本充足率在墨西哥最强；从集团层面看，合并融资依赖仍然重要。墨西哥文件显示，4Q24 资本充足率为 55.8%，流动性覆盖率为 1,816%，且自 2022 以来注入股东资本
              MXN2.79bn。即便 stage-3 贷款率为 22.7%、ROE 深度为负，这些指标也意味着该银行不会马上耗尽监管缓冲。但它们没有回答更重要的合并问题：集团持有多少现金、银行外资本消耗有多快，
              以及未来增长多大程度上依赖下一轮股权融资。在这一点上，公开证据两面都有。Ualá 确实在 March 2026 融到新资本，但官方和行业来源仍不同意该轮是 $197m 还是 $195m， 尽管都认可 $3.2bn
              估值。公司也提醒，前瞻性资金用途表述不是承诺。阿根廷外部环境又增加了一层谨慎。BCRA 和行业来源显示，金融科技信贷市场快速增长但异常率为双位数；独立报道对钱包放贷的描述则指向创纪录逾期和很高的综合借款成本。
              换句话说，资本可得性是真的，信贷风险和资金成本压力也是真的。
