        - 标价 MDR 清楚，但实际抽佣率和欺诈 / 服务成本不清楚
        - 要求提供 TPV、混合 MDR、拒付 / 欺诈损失和结算沉淀资金经济性
      - - 墨西哥银行产品
        - 银行实体内的净利息收入、交换费和放贷
        - 银行损益表和资产负债表科目
        - 2024 年文件显示利息收入、手续费收入、存款增长、信贷增长和亏损运营
        - 最硬的公开财务窗口，但只覆盖一个法律实体
