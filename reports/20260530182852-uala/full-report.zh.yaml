            body: >-
              Ualá 不只想赢得消费者钱包；它也想把消费者信任转化为商户收单量，并把普惠叙事转为实际使用。Ualá Bis Argentina 承诺即时结算、QR、支付链接、分期计划，以及与 Empretienda、
              Tiendanube、Magento 和 WooCommerce 的集成。POS Pro 上线把这套栈推向中大型商户，并给出明确佣金定价和垂直行业目标。墨西哥商户网站沿用同一模式，强调即时打款、更低佣金和高交易量
              POS Pro 故事； 哥伦比亚则增加链接、PSE、移动 datáfono，并明确支持创业者和社区零售商。普惠角度也异常具体：哥伦比亚官方发布称 90,000 名用户持有 PPT 文件，F6S
