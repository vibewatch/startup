        - 按产品和国家获取 vintage 曲线和逾期数据
      - - 市场边界模糊
        - 约束
        - 持续
        - 宽口径金融科技或数字银行总可用市场（TAM）数字可能夸大 Ualá 真正可获取的市场
        - 在拿到国家级 take-rate 数据前，继续用渗透率做市场测算
    notes: 顺风和风险按方向刻意拆开；同一个国家既可能有很高采用机会，也可能有很高变现风险。
