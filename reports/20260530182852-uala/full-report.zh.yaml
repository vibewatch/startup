        - 驱动
        - 近期
        - 数据共享改善、受理成本下降，可能改善授信和支付经济性
        - 跟踪阿根廷开放金融和墨西哥开放金融规则的落地时间表
      - - 墨西哥和哥伦比亚现金黏性
        - 约束
