      - number: '7.5'
        title: 竞争、治理和未解决披露缺口
        blocks:
          - type: paragraph
            body: >-
              执行风险在 Ualá 的野心撞上在位者规模时最高。IProUP 把区域竞争框在 Mercado Pago 和 Nubank 周围，硬数据也支持这个框架：MercadoLibre 2026 年 Q1 披露 83
              million 金融科技月活跃用户（MAU）和 US$14.6 billion 信贷组合；Nu 披露全球客户超过 135
              million，并称墨西哥已达到盈亏平衡，按客户数成为该市场第三大金融机构。在这个背景下，Ualá
              仍在要求投资者相信，墨西哥可以从一家披露亏损的银行扩张成有利润的区域引擎。治理不是缺位，而是参差不齐。墨西哥银行层面页面确实列出董事会，包括创始人 Pierpaolo Barberi
              和独立董事，但更广泛的公开材料在母公司层面仍薄得多；增长和融资新闻远多于委员会、控制和风险报告细节。缺失项很关键：本章公开来源仍未披露合并收入、欺诈损失率、投诉量或逐国亏损表现。这不会让投资逻辑失效，但意味着尽调不能只靠品牌势能承销剩余风险。核心问题是，Ualá
              能否证明墨西哥扩张速度快过风险成本，同时跨国控制环境在一个品牌下仍然自洽。
