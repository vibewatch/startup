  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 区域竞争集：Ualá 在每个国家面对不同龙头
        blocks:
          - type: paragraph
            body: >-
              Ualá 面对的不是单一拉美标杆。在阿根廷，最接近日常资金场景的对手是 Mercado Pago、Brubank、Naranja X，以及围绕 MODO 的传统银行联盟。在墨西哥，竞争转向 Nu、 Mercado
              Pago、Klar、Spin by OXXO，以及 BBVA 这类已经复制核心数字银行任务的强势传统银行应用。在哥伦比亚，实际可比集合是 Nequi、Daviplata、Mercado Pago 和
              RappiPay， 现金对许多小额交易仍是有意义的替代品。共享支付轨道很关键，因为它把曾经属于专有钱包的优势压缩成共同基线。阿根廷的 Transferencias 3.0、墨西哥的 CoDi 和 SPEI、
              哥伦比亚的 Bre-B，都让 QR 或即时转账能力更容易被复制，因此竞争转向品牌信任、分发、信贷风控和商户密度，而不只是 QR 受理。这一框架让 Ualá 看起来具备区域相关性， 但还不是区域主导者。
