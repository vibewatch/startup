        - 索取产品级毛利率和贡献视图
      - - CAC / 回本周期 / 销售周期
        - 来自 2023 PR 的一个历史商户增长数据点
        - 增长效率决定规模能否跑赢烧钱速度
        - 公开证据无法检验获客经济性
        - 索取按渠道和市场划分的队列 CAC 与回本周期
      - - 当前现金 / 烧钱速度 / 现金跑道
        - 近期股权融资加银行资本比率
        - 融资额不等于手头现金
        - 公开信息无法支撑现金跑道判断
        - 索取司库报告，以及基准 / 下行情景现金跑道计划
      - - 墨西哥以外信贷 vintage / NCO
        - 墨西哥 stage-3 比率加阿根廷市场逾期指标
        - 损失曲线决定贷款利润率和资本需求
        - 公开证据会放大对信贷质量的不确定性
        - 索取按市场划分的 vintage、NCO、回收率和滚动率数据
      - - 保险和投资收入贡献
