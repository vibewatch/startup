      - number: '7.4'
        title: 产品、欺诈和客户信任风险
        blocks:
          - type: paragraph
            body: >-
              Ualá
              自己的运营页面说明，欺诈、凭证盗用和争议处理不是边缘问题。阿根廷安全指引要求用户不要分享凭证或卡片照片，并明确警告公司不会在官方应用之外索取凭证，也不会要求用户安装软件。哥伦比亚围绕密码、六位交易密钥、PIN
              重置和账户找回发布了类似操作指引。墨西哥更进一步，公布了未识别扣款的专门流程，并重复 UNE 和 CONDUSEF 升级路径。这些控制必要，但无法抹平信任风险，因为独立评论界面仍呈现混合体验。JustUseApp
              基于 1,672 条评论给 Ualá 50.4/100 的中等安全评分，尽管应用商店平均分仍然扎实；Apple App Store 和 Google Play 都显示庞大安装基数和可接受的综合评分，但
              Google Play 近期用户评论仍提到过往故障。这种模式并非灾难性，但如果欺诈事件、服务中断或争议延迟变得更公开，它正是会放大客户信任流失的信号。商户端，Ualá Bis
              承诺即时结算、低费率和计息余额，这些都是有吸引力的获客杠杆，但也意味着在服务失败或拒付激增把经济性打痛之前，缓冲空间不大。
