        - 美国信贷与资金结构不能直接套到拉美。
      - - MercadoLibre
        - 上市公司
        - 市值约 $85.96B；PS 2.70x
        - LTM 收入 $31.80B；利润 $1.92B
        - 区域生态平台的估值天花板，也提醒主导型拉美平台能拿到的估值。
        - 金融科技只是更大商业生态的一部分。
      - - Stori
        - 私募公司
