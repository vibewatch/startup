      - number: '8.4'
        title: 乐观、基准和悲观区间
        blocks:
          - type: paragraph
            body: >-
              因为合并收入和利润率数据仍未披露，情景框架只能保持启发式，不能假装是干净的倍数模型。基准情景约为 $2.8 billion 到 $3.4 billion。这个区间框住 2024 年 11 月 $2.75
              billion 标记和 2026 年 3 月 $3.2 billion 上行轮，同时考虑到融资市场比 2021 年 Ualá 面对的环境更挑剔。乐观情景约为 $4.0 billion 到 $5.0
              billion，但前提是管理层能证明 11 million 客户版图能转化为更高质量收入、墨西哥信贷指标继续正常化，并且披露开始接近上市同业。悲观情景约为 $1.8 billion 到 $2.6
              billion：如果墨西哥亏损保持高位、信任摩擦恶化，或下一轮融资必须在 2025-2026 区域融资数据所描述的谨慎市场中成交。最重要的敏感性驱动因素是披露质量、墨西哥风险成本正常化，以及 Ualá
              能否证明有利可图的变现，而不只是客户触达。
