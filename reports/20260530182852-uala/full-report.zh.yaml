            body: >-
              反向比较角度很直接：Ualá 拥有可信的多国消费者主张，但它似乎没有在三个市场中任何一个拥有最强分发护城河。商户受理和电商流量重要时，Mercado Pago 位置更好；现金接入和物理触达仍塑造获客时， Spin
              by OXXO 位置更好；本地钱包习惯已经达到全国规模时，Nequi 和 Daviplata 位置更好；规模本身改善数据、信贷和品牌信任时，Nu Mexico 位置更好。这不意味着 Ualá 不能赢。
              但这意味着它的护城河更依赖执行，而不是依赖生态。最大的未解公开数据缺口不是 Ualá 是否有竞争对手——显然有——而是按国家拆分的活跃用户、存款结构、商户 TPV 和信贷 vintage 如何与这些同行相比。
