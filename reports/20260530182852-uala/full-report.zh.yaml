      - number: '8.2'
        title: 上一轮背景，以及估值标记没有证明什么
        blocks:
          - type: paragraph
            body: >-
              融资历史现在比旧估值叙事更重要。Ualá 2021 年完成 $350 million Series D，估值 $2.45 billion；2024 年 11 月完成 $300 million Series
              E，估值 $2.75 billion；2025 年 3 月又完成 $66 million 第二次交割；最后在 2026 年 3 月以 $3.2 billion 估值再募大约 $195-197
              million。这条时间线降低了即时下行轮压力，也表明公司仍是少数能大规模募集新股资本的拉美金融科技公司。但同一历史并不消除新投资者的价格风险。FinTech Global 的 2025-2026
              行业数据说明市场紧了很多：区域金融科技融资在 2025 年下降 27%，超过 $100 million 的交易下降 42%，2025 年 Q4 融资同比下降 55%。换句话说，Ualá
              证明了自己能融资，而不是自动等同于公开市场。没有二级定价、清算优先权细节，也没有清晰说明最新一轮到底是普通股经济实质还是带结构的工具，外部投资者仍需要入场纪律。
            claimRefs:
              - CV001
