        - 产品存在可见，但费用拆分和利差经济性不可见
        - 要求提供外汇利差获取、MEP 佣金率和美元基金费用经济性
      - - 阿根廷投资 / 券商业务
        - 基金分销、券商交易和托管经济性
        - 产品和账户费用
        - 6 只比索 FCI、1 只美元 FCI、股票、债券、CEDEARs；开户和维护免费
        - 活动可见，收入分成不可见
