      - CV046
      - CV048
      - CV054
  - id: TV006
    title: 最终尽调请求表
    columns:
      - 议题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 集团收入质量
        - 合并收入或 ARR、毛利率、抽佣率结构，以及任何留存 / NRR 披露
        - 这是所有公开可比讨论缺失的分母。
        - CFO 尽调包，加上经审计或管理层认证的桥表。
      - - 各国贡献利润率
        - 阿根廷 / 墨西哥 / 哥伦比亚的贡献利润率、固定成本分摊和各市场烧钱速度
        - 让投资人判断墨西哥是在盈利性扩张，还是只是在吸收新增股权资金。
        - 管理账和董事会材料包审阅。
      - - 墨西哥信贷放款批次
        - 4Q24 Fitch 数据点之后的放款批次损失曲线、迁徙率、核销和拨备方法
        - 需要据此判断 22.7% Stage-3 是遗留问题，还是结构性承保问题。
        - 信贷委员会材料和贷款簿分层。
      - - 主账户行为
        - 月活用户、工资直存占比、卡活动、商户活动和产品绑定率
        - 只有客户数，证明不了变现或防御性。
        - 增长分析审阅，附队列表。
      - - 股权结构表和优先股堆叠
        - 清算优先权、反稀释权、员工期权刷新义务，以及任何老股定价
        - 新股回报可能与标题投后估值大幅背离。
        - 法务 / 财务股权结构表尽调。
      - - 退出路径就绪度
        - 经审计集团财务、债权人 / IPO 准备度，以及任何老股流动性流程
        - 决定 $3.2B 能否真正兑现，还是只是纸面标记。
        - 董事会材料、审计师工作计划和投行沟通。
    notes: 这些请求是最低材料包，足以把投资方背书的私募估值标记转成可投资的承保案例。
    claimRefs:
      - CV046
      - CV054
