      - number: '8.2'
        title: Last-round context and what the mark does not prove
        blocks:
          - type: paragraph
            body: >-
              The financing history now matters more than the old valuation narrative. Ualá moved from a $350 million
              Series D at $2.45 billion in 2021 to a $300 million Series E at $2.75 billion in November 2024, then added
              a $66 million second close in March 2025, and finally raised another roughly $195-197 million in March
              2026 at $3.2 billion. That chronology reduces immediate down-round pressure and signals that the company
              is still one of the few Latin American fintechs able to raise primary capital at scale. But the same
              history does not eliminate price risk for a new investor. FinTech Global's 2025-2026 sector data shows a
              much tighter market: regional fintech funding fell 27% in 2025, deals above $100 million fell 42%, and Q4
              2025 funding was down 55% year over year. In other words, Ualá has demonstrated fundability, not automatic
              public-market equivalence. Without secondary pricing, liquidation-preference detail, or a clean view on
              whether the latest round is common-equity economics rather than structure, outside investors still need
              entry discipline.
            claimRefs:
              - CV001
