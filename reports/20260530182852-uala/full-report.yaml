      - number: '2.4'
        title: Growth drivers, regulatory tailwinds, and regional dynamics
        blocks:
          - type: paragraph
            body: >-
              The strongest tailwinds differ by country. Argentina's tailwind is intensity: very high wallet usage,
              rapid growth in immediate transfers, interoperable CVUs, and payment-account balances that are
              increasingly linked to money-market products. Mexico's tailwind is scale plus rails: a large adult base
              with formal products, massive SPEI volumes, rising app-based account management, and ongoing policy
              pressure to move consumers and merchants from cash to QR, open-finance, and cheaper digital acceptance.
              Colombia's tailwind is interoperability: wallets already sit deep in consumer behavior, and Bre-B gives
              the market a new common layer that can lower friction between banks, wallets, cooperatives, and merchants.


              The regional context amplifies those country dynamics. IMARC's regional neo-banking forecast and GSMA's
              view of mobile technology contributing $600 billion to Latin American GDP in 2025 both point in the same
              direction: consumer finance in the region is becoming more digital, more mobile, and more open to
              software-first distribution. But Ualá's three countries are not interchangeable. Argentina is the fastest
              proof-point for daily engagement, Mexico is the scale market that can reward platform breadth, and
              Colombia is the interoperability market that can reward clean execution on everyday transfers and
              wallet-led financial behavior.
