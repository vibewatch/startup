      - number: '8.4'
        title: Bull, base, and bear ranges
        blocks:
          - type: paragraph
            body: >-
              Because consolidated revenue and margin data remain undisclosed, the scenario frame has to stay heuristic
              rather than pretending to be a clean multiple model. The base case is roughly $2.8 billion to $3.4
              billion. That range brackets the November 2024 $2.75 billion mark and the March 2026 $3.2 billion up-round
              while allowing for a more selective funding market than Ualá faced in 2021. The bull case is about $4.0
              billion to $5.0 billion, but only if management can show that the 11 million-customer footprint converts
              into higher-quality revenue, that Mexico credit metrics keep normalising, and that disclosure starts to
              look more like listed peers. The bear case is roughly $1.8 billion to $2.6 billion if Mexico losses stay
              high, trust friction worsens, or the next financing has to clear in the same cautious market described by
              2025-2026 regional funding data. The most important sensitivity drivers are disclosure quality, Mexico
              risk-cost normalisation, and whether Ualá can demonstrate profitable monetisation rather than just
              customer reach.
