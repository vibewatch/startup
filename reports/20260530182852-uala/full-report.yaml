      - number: '4.4'
        title: Financial verdict and what is still undisclosed
        blocks:
          - type: paragraph
            body: >-
              Financially, Ualá looks like a real ecosystem business rather than a single-product wallet, and that is
              the chapter's main positive. The company has visible monetization hooks across deposits and yield,
              consumer lending, merchant acquiring, card interchange, investments, FX, and now embedded insurance. The
              main negative is not lack of breadth but lack of consolidated disclosure. Public evidence does not reveal
              group revenue, country revenue mix, merchant TPV, take rates, gross margins, CAC, payback, burn or runway.
              The only full financial statements in the retained pack are for the Mexican bank, which is useful but
              incomplete because Argentina still appears to be the richest monetization surface and some lending and
              brokerage economics sit in non-bank affiliates. That leaves the underwriting stance cautious: revenue
              quality is plausible, margin path is unproven, credit losses could stay volatile, and external capital has
              mattered enough that runway cannot be underwritten from public material alone. A serious investment
              process should therefore treat public evidence as sufficient to map the model, but insufficient to
