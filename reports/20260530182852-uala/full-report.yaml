      - number: '6.3'
        title: Merchant adoption and financial inclusion loop
        blocks:
          - type: paragraph
            body: >-
              Ualá is not just trying to win a consumer wallet; it is also trying to convert consumer trust into
              merchant acquiring volume and to turn inclusion narratives into tangible usage. Ualá Bis Argentina
              promises instant settlement, QR, payment links, installment plans, and integrations with Empretienda,
              Tiendanube, Magento, and WooCommerce. The POS Pro launch expanded that stack toward medium and large
              merchants with explicit commission pricing and vertical targeting. Mexico’s merchant site follows the same
              pattern with instant payouts, lower commissions, and a high-volume POS Pro story, while Colombia adds
              links, PSE, a mobile datáfono, and explicit support for entrepreneurs and neighborhood retailers. The
              inclusion angle is also unusually concrete: Colombia’s official release says 90,000 users have PPT
              documents, and F6S says the Argentine free universal account includes social-aid-payment users. The net
              effect is a broad funnel that can start with a first debit-card transaction and expand into merchant
              acceptance, lending, payroll, or yield balances. What the public record does not show is how many
              merchants stay, transact repeatedly, or become material revenue contributors.
