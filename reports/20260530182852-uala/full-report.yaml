        title: Founder Control, Governance Visibility, and Key-Person Dependence
        blocks:
          - type: paragraph
            body: >-
              Founder continuity is unusually clear. Across the newsroom, founder profile, and 2026 financing release,
              Pierpaolo Barbieri remains the central public executive and strategic narrator for Ualá. The regulated
              Argentine bank subsidiary reinforces that visibility by listing him as president and director, alongside a
              disclosed set of directors, a gerente general, and statutory auditors. That is useful, but it is not the
              same thing as a full holding-company governance package. The public record reviewed for this chapter does
              not expose a broader group board, board committees, ownership percentages, or reserved-matters
              architecture. Accordingly, governance transparency is adequate at the subsidiary disclosure layer and
              incomplete at the consolidated group layer. The practical diligence implication is key-person risk: the
              company is still strongly identified with its founder in fundraising, market expansion, and product
              messaging. The retained source pack did not reveal a non-founder CEO transition or other major leadership
              reset, but that absence should be read as limited public visibility rather than as proof that no executive
              changes occurred below the top role.
