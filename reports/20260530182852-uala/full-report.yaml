  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization mechanics
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a broad but heterogeneous monetization stack. In Argentina, Ualá explicitly
              prices deposit-side yield, FX, brokered investments, consumer lending and merchant acquiring, while its
              March 2026 financing release also adds insurance to the ecosystem. The key mechanical point is that some
              yield is not passive-balance economics: the highest remunerated-account tiers require monthly activity in
              cards, QR, services, FX, investments or Ualá Bis collections, so transaction frequency is being used to
              deepen balances and cross-sell at once. Merchant pricing is also concrete enough to matter. Ualá Bis
              currently shows card-present MDRs of 4.9%+IVA on credit/prepaid and 2.9%+IVA on debit, QR pricing as low
              as 0.8% for account-balance payments, and instant settlement through both its own QR flow and the
              Tiendanube gateway. That is useful for understanding revenue mechanics, but not for inferring realized
              take rate or margin: official pricing is list pricing, settlement is immediate, and management has changed
              MDRs over time. Colombia and Mexico broaden the footprint, yet their public surfaces are thinner. Colombia
              markets a remunerated low-value deposit with fee disclosures and legal rulebooks, while Mexico emphasizes
              the licensed bank wrapper and IPAB coverage more than a granular public fee sheet. The result is a
              diversified fee-and-spread model, but with disclosure density concentrated in Argentina.
