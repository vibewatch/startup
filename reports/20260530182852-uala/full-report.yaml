  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Why it matters
      - Action implication
    rows:
      - - Mexico credit does not normalize
        - Stage-3 loans or comparable bad-book indicators stay stubbornly elevated with no credible path down
        - The biggest monetisation market would still be consuming capital rather than proving operating leverage.
        - Shift from TRACK to AVOID unless price resets materially lower.
      - - Another capital raise clears on structure-heavy or discounted terms
        - Round relies on preferences, resets, or a material discount to the 2026 mark
        - Would imply sponsor support is masking rather than solving the valuation problem.
        - Treat the latest $3.2B mark as overstated for new-money entry.
      - - No group-level revenue quality disclosure
        - Management still cannot show revenue, gross margin, or retention in diligence
        - Without the denominator, investors are underwriting reputation rather than economics.
        - Do not pay through the latest mark.
      - - Trust and support friction worsens
        - Independent complaint and review signals deteriorate while support remains weak
        - Cross-sell and deposit stickiness depend on trust, especially for higher-margin products.
        - Discount the bull case and shorten any watchlist timeline.
      - - No public-like exit path emerges
        - Still no audited group materials, clean secondary process, or public-market preparation markers
        - Limits liquidity options and keeps valuation pinned to private sponsor appetite.
        - Keep the stance at TRACK / RESEARCH-MORE.
    notes: >-
      Triggers are practical IC stop signs rather than exhaustive risks; each one links directly to valuation
      transmission rather than generic company quality concerns.
    claimRefs:
      - CV011
