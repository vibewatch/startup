  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Regional competitive set: Ualá faces different leaders in each country'
        blocks:
          - type: paragraph
            body: >-
              Ualá does not face a single Latin American benchmark. In Argentina, the closest daily-money rivals are
              Mercado Pago, Brubank, Naranja X, and the incumbent-bank coalition around MODO. In Mexico, the competition
              shifts toward Nu, Mercado Pago, Klar, Spin by OXXO, and strong incumbent apps such as BBVA that now
              replicate core neobank tasks. In Colombia, the practical comparison set is Nequi, Daviplata, Mercado Pago,
              and RappiPay, with cash still acting as a meaningful substitute for many low-ticket transactions. Shared
              payment rails matter because they compress what used to be proprietary wallet advantages into a common
              baseline. Transferencias 3.0 in Argentina, CoDi and SPEI in Mexico, and Bre-B in Colombia all make QR or
              instant-transfer capability easier to match, so the fight moves toward brand trust, distribution, credit
              underwriting, and merchant density rather than QR acceptance alone. That framing makes Ualá look
              regionally relevant, but not regionally dominant.
