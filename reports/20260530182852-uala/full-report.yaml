      - number: '3.3'
        title: Merchant platforms, bank-app overlays, and category substitutes matter as much as neobanks
        blocks:
          - type: paragraph
            body: >-
              The relevant substitutes for Ualá are broader than other digital banks. Mercado Pago competes as both a
              wallet and a merchant network; MODO competes as a bank-app overlay that keeps users inside incumbent
              relationships; Clip and Spin show that offline acceptance, financing, and cash handling can be more
              defensible than the consumer account itself; and Nequi Negocios or Daviplata enterprise flows show how
              wallet brands can push from consumer payments into payroll, supplier payments, and merchant collection.
              These are not edge cases. They matter because Ualá also needs merchant and payment activity to deepen
              account primacy and support monetization. A consumer who keeps a Ualá account but still pays through MODO,
              cashes in through OXXO, accepts payments through Mercado Pago, or runs a small business through Nequi
              Negocios is only partially captured. Public packaging evidence reinforces that view: several peers now
              compete directly on yield, payment convenience, or merchant collection, which lowers the odds that simple
              account opening creates durable loyalty by itself.
