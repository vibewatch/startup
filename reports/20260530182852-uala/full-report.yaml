      - number: '8.3'
        title: Public-market and private-market reference points
        blocks:
          - type: paragraph
            body: >-
              The public comp set gives a wide but still useful bracket. Nu is the premium Latin American digital-bank
              benchmark at roughly $63.8 billion of market value and 8.41x trailing sales; SoFi trades around $23.4
              billion and 5.98x; MercadoLibre is the ecosystem ceiling at $86.0 billion and 2.70x; dLocal is a
              closer-scale payments processor at roughly $3.5 billion and 2.87x; and PagSeguro is the lower-multiple
              mature benchmark at about $2.6 billion and 0.68x. None is a perfect analog: dLocal is
              merchant-processing-first, MercadoLibre embeds fintech inside a much larger commerce machine, and Nu and
              SoFi are far more disclosed. The private reference points are even noisier. Stori hit $1.2 billion in
              2022, Neon raised US$300 million in 2022 after reaching 15 million customers, and Creditas hit $4.8
              billion in 2022 with unusually transparent revenue commentary. Those marks show that investors have paid
              multi-billion-dollar prices for Latin American consumer fintech scale, but they are mostly 2022-vintage
              and therefore only partial support for a 2026 price. The cleanest takeaway is that Ualá sits inside the
              plausible regional comp range, but public evidence still cannot say where inside that range it should
              clear.
