  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The decision chain starts with fresh sponsor support and customer scale, but it flows through Mexico credit risk
      and disclosure gaps before landing on a TRACK recommendation at the latest price.
    data:
      nodes:
        - id: fresh-mark
          label: Fresh sponsor mark
          detail: Ualá cleared a 2026 up-round at $3.2B.
        - id: scale
          label: Scale and licences
          detail: 11M+ customers and full banking licences support strategic upside.
        - id: credit
          label: Mexico credit drag
          detail: Fitch still flags high stage-3 loans, losses, and capital-injection dependence.
        - id: disclosure
          label: Disclosure gap
          detail: No public consolidated revenue, margin, or retention bridge to public comps.
        - id: decision
          label: TRACK at $3.2B
          detail: Price can work only if diligence closes the missing economics and cap-table data.
      edges:
        - from: fresh-mark
          to: decision
          label: supports
        - from: scale
          to: decision
          label: supports
        - from: credit
          to: decision
          label: constrains
        - from: disclosure
          to: decision
          label: limits
        - from: fresh-mark
          to: disclosure
          label: still needs proof
    approximationNotes: This flow chart expresses causal logic rather than probabilities.
    claimRefs:
      - CV001
      - CV003
      - CV041
      - CV044
      - CV048
      - CV053
