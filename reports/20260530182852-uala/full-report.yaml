      - number: '2.3'
        title: Buyer segmentation, budget ownership, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The primary buyer, user, and payer in Ualá's market is usually the same person: a consumer choosing where
              to store value, receive income, make transfers, and occasionally borrow. But the mass market still breaks
              into distinct operating segments. Salary earners and first-account seekers need payroll or daily money
              movement with low fees and app convenience. Informal workers and gig earners value cash-in and cash-out
              flexibility, instant transfers, and the ability to operate without a full traditional bank relationship.
              Thin-file borrowers are not buying 'credit' in the abstract; they are buying emergency liquidity and a
              path into formal finance. Micro-merchants care less about the brand of the wallet and more about whether
              transfers settle quickly, QR acceptance is interoperable, and the merchant can keep operating in a
              cash-heavy environment. In Mexico, remittance-linked users add another important corridor because the
              payment account can become the landing zone for international money, domestic transfers, and later savings
              or credit.


              That segmentation matters because adoption is rarely a one-step banking switch. The typical path starts
              with an immediate trigger such as a salary payment, a government benefit, a peer transfer, a remittance,
              or merchant QR acceptance. Usage then deepens into stored balances, repeated P2P transfers, bill payments,
              or short-duration savings products. Only after that does unsecured credit or adjacent products become
              economically sensible. In other words, Ualá's buyer map is less about winning a one-time account opening
              and more about compressing the time from first transaction to habitual financial behavior.
            claimRefs:
