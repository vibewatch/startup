        title: Product surface and customer jobs
        blocks:
          - type: paragraph
            body: >-
              The directly evidenced product surface is much broader than a typical stored-value wallet. In Argentina,
              current Ualá pages show a free savings-account wrapper, remunerated balances, a credit card with Google
              Pay and Apple Pay support, personal loans, and a full in-app investing menu spanning dollars, FCIs, bonds,
              stocks, CEDEARs, and term deposits. The merchant surface is equally material: Ualá Bis is not just a
              generic QR page, but a live family of POS Pro, QR, Tap to Pay, and online-checkout tools with publicly
              disclosed pricing. Mexico and Colombia matter because they show the regional operating template rather
              than one-market marketing copy. Mexico is presented as a bank-operated product with IPAB protection and
              app-store-disclosed yield, card, and term-reserve features; Colombia shows a low-value deposit product
              linked to a Mastercard debit card plus PSE, service payments, and Bre-B transfers. The key judgment is
              therefore evidence-based: Ualá publicly looks like an ecosystem app that crosses spending, saving,
              borrowing, investing, and merchant collection, not a single-function wallet.
