      - number: '6.2'
        title: Adoption signals and observed customer behavior
        blocks:
          - type: paragraph
            body: >-
              The strongest public behavior evidence comes from two places: Colombia’s official snapshot and the app
              stores. Colombia is the only market where Ualá publicly discloses a hard country number set in retained
              evidence: more than 400,000 users, 90,000 PPT-document users, more than one million purchases, and more
              than 270,000 transfers after two years in market. The same release adds that more than 40% of users used
              at least one of Ualá’s alliances, and Yahoo’s interview coverage says 160,000 of the 400,000 users bought
              with allied merchants such as Grupo Éxito. On the consumer side, Google Play showed 10M+ downloads,
              roughly 747,000 reviews, and a 4.5 rating on the run date, while Apple’s local listings showed 4.6 in
              Argentina, 4.5 in Mexico, and 4.7 in Colombia. Those are credible reach and sentiment signals, but they do
              not resolve the core diligence question: whether Ualá’s large registered base is active, funded, or
              profitable. Public breadth is clear; public cohort quality is not.
