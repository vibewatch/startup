  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk overview and residual ranking
        blocks:
          - type: paragraph
            body: >-
              Ualá's risk stack is led by one transmission chain rather than one isolated issue. The first leg is Mexico
              credit and funding execution: the only hard public bank filing still shows a large annual loss and a 22.7%
              stage-3 ratio even as management keeps framing Mexico as the market that must scale and become sustainably
              profitable. The second leg is Argentina macro and household stress, where official and independent 2026
              sources still describe elevated household irregularity, double-digit delinquency pressure, and a monetary
              framework that remains vulnerable to renewed exchange-rate volatility. The third leg is regulatory
              asymmetry across countries. Customers see one brand, but public pages show very different legal
              perimeters: Argentina remains a PSP and non-bank lender, Mexico is a bank with IPAB coverage and CONDUSEF
              recourse, and Colombia is a finance company. On top of that sit trust and fraud-handling risk from
              app-review complaints and formal charge-dispute workflows, plus competitive pressure from Mercado Pago and
              Nubank while group-level disclosure still omits country loss, fraud, and complaint statistics. The heatmap
              and transmission map below rank these as the chapter's highest residual exposures rather than standalone
              headline risks.
