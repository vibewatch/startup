      - number: '2.5'
        title: Macro risks, adoption constraints, and evidence-constrained gaps
        blocks:
          - type: paragraph
            body: >-
              The same markets that create upside also create different monetization risks. Argentina's combination of
              43.3% informal employment and 16.2% PNFC irregularity shows why transaction engagement does not
              automatically convert into durable credit economics; inflation and labor precarity can both pull users
              into digital finance and weaken their repayment resilience. Mexico's core risk is not lack of digital
              potential but incomplete migration: cash still dominates small-ticket purchases, internet access remains
              materially weaker in rural areas, and license type still determines who can offer what. Colombia's risk is
              subtler. The country has strong digital-channel usage and a new interoperable instant-payments backbone,
              but cash remains sticky in lower-income and rural segments, so revenue upside depends on deepening
              recurring use rather than merely counting onboarded users.


              Public evidence is therefore good enough to support a strong market-opportunity thesis, but not enough to
              claim a clean country-by-country SAM, take-rate curve, or Ualá market-share path. That gap should be
              preserved. The right diligence ask is not 'find a bigger TAM slide', but obtain country-level active
              customer counts, deposit mix, repeat-payment cohorts, credit vintage performance, and take-rate by
              product. Until then, this chapter can support why the markets matter, but not an exact monetization
              forecast.
            claimRefs:
