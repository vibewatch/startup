  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, substitutes, and why these markets matter
        blocks:
          - type: paragraph
            body: >-
              For Ualá, the relevant market boundary is the consumer financial operating system for mass-market users in
              Argentina, Mexico, and Colombia: transaction accounts and wallets, debit-linked and transfer-based
              payments, small-ticket unsecured credit, and adjacent savings or investment balances that ride on the same
              daily-use account. It is not the whole of banking revenue, corporate treasury, mortgages, affluent wealth
              management, or enterprise software. The status quo substitutes are country-specific but recognizable:
              cash, incumbent bank accounts, card-led acquiring, and informal or non-bank credit. In Argentina, the
              wallet-versus-bank distinction has already blurred because CVUs interoperate with bank accounts and
              because a majority of immediate transfers already touch payment accounts. In Mexico, the key substitute is
              still cash plus incumbent rails, with digital wallets and neobanks competing to become the primary account
              relationship rather than an occasional overlay. In Colombia, wallets have become as common as savings
              accounts for many users, but cash and rural frictions still shape actual payment behavior.


              These markets matter together because each solves a different part of the regional neobank thesis.
              Argentina shows unusually high engagement intensity in digital payments and wallet balances; Mexico offers
              the largest scale pool with a deep remittance and payments engine; Colombia demonstrates how
              interoperability can compress friction and accelerate wallet-led usage once common rules are in place. The
              opportunity for Ualá is therefore not a single homogeneous LatAm TAM, but a three-country portfolio where
              the same product stack can address different failure points in incumbent consumer finance.
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM012
              - CM013
