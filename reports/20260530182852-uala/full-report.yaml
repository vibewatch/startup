      - number: '3.4'
        title: Where Ualá is weaker or more exposed
        blocks:
          - type: paragraph
            body: >-
              The adverse comparison angle is straightforward: Ualá has a credible multi-country consumer proposition,
              but it does not appear to own the strongest distribution moat in any of the three markets. Mercado Pago is
              better positioned where merchant acceptance and commerce traffic matter; Spin by OXXO is better positioned
              where cash access and physical reach still shape onboarding; Nequi and Daviplata are better positioned
              where local wallet habits already sit at national scale; and Nu Mexico is better positioned where scale
              itself improves data, credit, and brand trust. That does not mean Ualá cannot win. It does mean its moat
              is more execution-dependent than ecosystem-dependent. The biggest unresolved public-data gap is not
              whether Ualá has competitors—it plainly does—but how country-level active users, deposit mix, merchant
              TPV, and credit vintages compare against those peers. Without that, public evidence supports a qualified
              judgment: Ualá is credible on breadth, but more exposed on local distribution density, merchant flywheel,
              and proof of country-by-country monetization depth.
