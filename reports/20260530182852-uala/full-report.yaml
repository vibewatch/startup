      - number: '7.3'
        title: Credit, funding, and macro transmission risk
        blocks:
          - type: paragraph
            body: >-
              Fresh capital does not eliminate underwriting risk. Ualá's official March 2026 release confirms a new
              Allianz X-led equity round and a US$3.2 billion valuation, but trade reporting still disagrees on whether
              the check was US$197 million or US$195 million. The more important point is what the public pack does and
              does not reveal. The disclosed Mexico bank report still shows a MXN1.17 billion annual loss, a 22.7%
              stage-3 ratio, and only one public legal-entity view into the loan book. High capital and liquidity ratios
              are helpful, but they do not answer how much consolidated loss absorption sits outside that bank or how
              much incremental capital Mexico will need if growth keeps outpacing collections. Argentina adds a second
              pressure point. BCRA's February 2026 banking report says household irregularity reached 11.2%, while La
              Nación and SIISA describe deteriorating household delinquency and rising credit dependence. BCRA, PIIE,
              and Allianz all still frame 2026 as a year of disinflation progress but persistent reserve, inflation, and
              exchange-rate fragility. In practice that means Ualá faces a double exposure: Mexico can consume capital
              through credit losses, and Argentina can worsen repayment behavior or funding appetite if macro volatility
              returns.
