  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Regional customer mix and onboarding boundaries
        blocks:
          - type: paragraph
            body: >-
              Ualá’s public customer story is broad, but it is not one homogeneous user base. The company is clearly
              targeting mass-market retail consumers across Argentina, Mexico, and Colombia, yet the eligibility rules
              and product surfaces differ materially by country. Argentina’s public listing is the widest: the app store
              says users can onboard from age 13 with an Argentine DNI, and the homepage layers remunerated balances,
              official-dollar purchases, loans, investments, insurance, and promotions on top of the basic card and
              transfer loop. Mexico is adult-only and more bank-and-credit oriented, with public emphasis on 10%
              cashback, payroll portability, loans, and a 16% yield headline. Colombia is also adult-only but adds a
              more explicit inclusion angle through PSE, Efecty cash-in, and PPT-document onboarding. The same app-store
              shell markets these local variants together, so Ualá looks more like a regional brand with
              country-specific operating surfaces than a single standardized product. That matters for diligence because
              a public claim about “Ualá users” may hide very different customer economics, trust wrappers, and
              conversion requirements by market.
            claimRefs:
