            - label: high
              tone: negative
              detail: Misaligned marketing or servicing can create conduct and trust failures across one brand.
            - label: low-medium
              tone: warning
              detail: Public legal pages exist, but entity-by-entity control evidence is thin.
            - label: high
              tone: negative
              detail: Residual exposure remains high because customer protections are not uniform.
        - label: Argentina macro and household-default spillover
          values:
            - label: medium-high
              tone: warning
              detail: Official and independent 2026 sources still flag delinquency, inflation, and FX fragility.
            - label: high
              tone: negative
              detail: A macro wobble would pressure repayment behavior and risk appetite for consumer finance.
            - label: low
              tone: warning
              detail: No public hedge is visible beyond portfolio management and pricing discipline.
            - label: high
              tone: negative
              detail: The macro path is improving, but the buffer remains narrow.
        - label: Customer trust / fraud / complaint escalation
          values:
            - label: medium
              tone: warning
              detail: Independent review signals are mixed and formal dispute workflows already exist.
            - label: high
              tone: negative
              detail: A visible fraud or servicing event would hit deposits, spending, and brand trust quickly.
            - label: medium
              tone: warning
              detail: Security guidance is visible, but public fraud-loss and complaint data are absent.
            - label: medium-high
              tone: warning
              detail: Current ratings are acceptable, but trust is not robustly disclosed.
        - label: Competition from Mercado Pago and Nubank
          values:
            - label: high
              tone: negative
              detail: Both incumbents already operate at materially larger scale and one is profitable in Mexico.
            - label: high
              tone: negative
              detail: Competition can compress take rate, acquisition efficiency, and funding optionality.
            - label: medium
              tone: warning
              detail: Bank licenses and product breadth help, but Mexico still has to execute.
            - label: high
              tone: negative
              detail: Residual severity stays high until Ualá proves differentiated profitable growth.
        - label: Governance and disclosure opacity
          values:
            - label: medium
              tone: warning
              detail: Local bank governance is partially visible, but parent-level visibility remains thin.
            - label: high
              tone: warning
              detail: Opaque loss, fraud, and complaint data make downside hard to underwrite.
            - label: low-medium
              tone: warning
              detail: Some subsidiary governance pages exist, but they do not close parent-level gaps.
            - label: medium-high
              tone: warning
              detail: Opacity is manageable only if private diligence fills the remaining holes.
    approximationNotes: >-
      Probability, impact, mitigation maturity, and residual severity are ordinal judgments anchored to cited evidence
      rather than modelled probabilities.
    claimRefs:
      - CR029
      - CR039
      - CR042
      - CR045
      - CR050
      - CR051
      - CR052
      - CR054
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      The main downside routes run from macro and regulation into credit losses, trust erosion, and ultimately renewed
      funding need or valuation pressure.
    data:
      nodes:
        - id: arg-macro
          label: Argentina macro volatility
          detail: Inflation, FX, and reserves remain explicit policy risk areas in 2026.
          tone: negative
        - id: household-stress
          label: Household credit stress
          detail: Official and independent 2026 sources still show elevated irregularity and delinquency.
          tone: negative
        - id: mexico-credit
          label: Mexico credit losses
          detail: The disclosed bank report still shows high stage-3 credit and a large annual loss.
          tone: negative
        - id: funding-need
          label: Funding need
          detail: Persistent losses or slower operating leverage can consume fresh equity.
          tone: negative
        - id: reg-mismatch
          label: Cross-country regulatory mismatch
          detail: Argentina, Mexico, and Colombia expose different legal protections under one brand.
          tone: warning
        - id: complaints
          label: Complaint / conduct escalation
          detail: Formal complaint routes and public review surfaces can amplify service failures.
          tone: warning
        - id: trust
          label: Customer trust erosion
          detail: Trust shocks would pressure balances, card use, and word of mouth.
          tone: negative
        - id: mexico-scale
          label: Slower Mexico scale
          detail: Execution in Mexico matters more because management has prioritized that market.
          tone: warning
        - id: competition
          label: Mercado Pago / Nubank pressure
          detail: Much larger rivals can keep investing while Ualá still proves unit economics.
          tone: negative
        - id: valuation
          label: Valuation downside
          detail: Any combination of losses, slower growth, or opacity can impair financing terms.
          tone: negative
      edges:
        - from: arg-macro
          to: household-stress
          label: strains repayment capacity
          tone: negative
        - from: household-stress
          to: mexico-credit
          label: raises caution on consumer-finance assumptions
          tone: warning
        - from: mexico-credit
          to: funding-need
          label: absorbs capital
          tone: negative
        - from: funding-need
          to: mexico-scale
          label: forces slower investment or tougher pricing
          tone: negative
        - from: reg-mismatch
          to: complaints
          label: creates conduct and disclosure slippage risk
          tone: negative
        - from: complaints
          to: trust
          label: amplifies negative customer perception
          tone: negative
        - from: trust
          to: mexico-scale
          label: hurts acquisition and retention
          tone: negative
        - from: competition
          to: mexico-scale
          label: compresses economics and attention
          tone: negative
        - from: mexico-scale
          to: valuation
          label: undermines growth case
          tone: negative
        - from: funding-need
          to: valuation
          label: raises dilution risk
          tone: negative
        - from: trust
          to: valuation
          label: weakens brand premium
          tone: warning
        - from: competition
          to: valuation
          label: limits exit multiple and share assumptions
          tone: warning
