      - number: '1.4'
        title: Milestones, Regulatory Expansion, Partnerships, and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              The milestone picture is coherent even if some metrics remain approximate. Ualá launched in Mexico in
              2020, entered Colombia in 2022 with a financing-company license, and secured Mexican approval to acquire
              ABC Capital in 2023. Those moves support management’s repeated argument that regulated local
              infrastructure is essential to expansion, especially in Mexico. Product breadth also widened through Ualá
              Bis, the separately regulated investment entity, and the 2024 Mastercard partnership that turned a
              payments card into a marketing and loyalty surface. By early 2026 the Allianz relationship had expanded
              beyond financing into digital life and personal accident insurance, with more than 300,000 quotes
              generated shortly after launch. The main negative signal in the retained pack is operational rather than
              existential: in May 2025, users publicly complained about phantom dollar balances and account blocks, and
              the company acknowledged momentary instabilities. That episode does not prove a balance-sheet issue, but
              it does show that control failures, customer-service responsiveness, and disclosure consistency deserve
              direct testing in later diligence. It also reinforces a broader chapter-one pattern: Ualá’s strategic
              story is strong, yet several important facts still depend on company-issued materials rather than
              independently audited disclosure.
