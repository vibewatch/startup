      - number: '4.2'
        title: Disclosed financials and unit-economics clues
        blocks:
          - type: paragraph
            body: >-
              Hard financial disclosure is much narrower than product disclosure. The clearest balance-sheet and P&L
              window is the 4Q24 filing for Ualá Mexico, which shows a business that is scaling funding and consumer
              credit, but not yet translating that scale into profit. Traditional funding rose 81.8% year over year to
              MXN6.0bn, credit grew 74% to MXN571m, and commissions were driven mainly by debit and credit-card
              interchange. Yet net interest margin for 2024 was only MXN36m, provisions were MXN129m, operating expenses
              were MXN1.1bn, and annual net loss reached MXN1.17bn. That pattern matters more than the raw loss number:
              it suggests Ualá can gather balances, originate cards and loans, and generate card-fee revenue, but
              current unit economics are still burdened by funding cost, credit reserves and heavy go-to-market and
              technology spend. Public traction metrics from the March 2026 equity announcement point to scale—more than
              11 million customers, 9.2 million loans granted and 3 million investing clients—but they do not solve the
              underwriting problem because they are activity counts, not revenue, gross profit or cohort data.
              Argentina's product pages add monetization clues such as a 20-26% remunerated-account band, 20-28%
              term-deposit rates and a dollar FCI pitched around 6% annual return, but they still do not disclose the
              spread capture, fee split, or loss-adjusted contribution by product.
