companyProfile:
  summary: >-
    Ualá is a late-stage private Latin American neobank founded in Argentina in October 2017 by Pierpaolo Barbieri. From
    a card-and-wallet origin it has expanded into a broader financial ecosystem spanning cards, payments, personal
    lending, investments, insurance, and merchant acquiring across Argentina, Mexico, and Colombia, with Buenos Aires as
    the regional headquarters anchor. Official March 2026 materials say Ualá serves more than 11 million customers and
    holds full banking licences across its markets, while the latest Allianz X-led financing valued the company at $3.2
    billion. Public visibility on products and funding is strong, but consolidated revenue, margin, and profitability
    disclosure remains limited.
