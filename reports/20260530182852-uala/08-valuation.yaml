    - Needs multiple positive proofs, not just another private mark
    - Management discloses revenue quality, Mexico losses normalize, cross-sell lifts monetisation, and disclosure closes toward public-peer standards.
    - Upside of about 25%-56% from the latest mark before dilution.
    - Confirmed by cleaner vintages, better disclosures, and a credible public/secondary path.
