- id: diligence-gates-and-exit-readiness
  title: Recommendation, exit readiness, and diligence gates
  body: 'The recommendation-quality synthesis is TRACK with medium confidence and high residual risk at the current round price. A new investor should not pay up simply because Ualá managed another up-round; the company still needs to prove what public comparables already show every quarter: revenue quality, margin structure, and the durability of growth after credit costs. The best version of the story is still attractive. Ualá has customer scale, regional licences, product breadth, and sponsor support that most Latin American fintechs would like to have. But the path from here to BUY needs diligence, not enthusiasm. Management has to disclose consolidated revenue or ARR, gross margin, country-level contribution margin, customer activation and primary-account behaviour, vintage loss curves in Mexico, and the preference stack above common. Until then, exit readiness looks more like another private round or strategic secondary than a public-market re-rating. If the company cannot close those
    gaps, or if a next round needs structure-heavy terms, the thesis should move from track to avoid rather than from track to buy.'
