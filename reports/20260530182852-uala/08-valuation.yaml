company:
  name: Ualá
chapter:
  number: 8
  title: Valuation
  summary: A fresh March 2026 round resets Ualá's valuation anchor at $3.2 billion, which is meaningfully stronger than the stale-late-2021 picture but still not fully underwritten by public financial disclosure. Public comparables and private reference points show that the price is plausible for a scarce regional fintech winner, yet Mexico credit losses, disclosure gaps, and a tighter 2025-2026 funding market keep the stance at TRACK rather than BUY.
sections:
- id: recommendation-frame
  title: Recommendation frame and thesis tension
  body: 'Ualá now has a fresh private-market mark, not a stale pandemic-era number. The March 2026 financing put a $3.2 billion post-money valuation on the company, extended a funding path that already stepped up from $2.45 billion in 2021 to $2.75 billion in 2024, and brought repeat blue-chip backers into another round led by Allianz X. That deserves respect: unlike many Latin American fintechs, Ualá still cleared an up-round in a tighter market while claiming more than 11 million customers and full banking licences across its operating footprint. The anti-thesis is that the mark is still being carried by sponsor conviction rather than by public-company-style disclosure. Public comparables run from PagSeguro at 0.68x trailing sales to Nu at 8.41x, but Ualá still does not disclose consolidated revenue, gross margin, retention, or group profitability. Fitch also still frames Mexico as a business in consolidation with elevated credit losses and a reliance on capital injections. The result
    is a TRACK call at the current price: quality and strategic backing are real, but the evidence is not yet rich enough to treat $3.2 billion as obviously cheap.'
  claimRefs:
