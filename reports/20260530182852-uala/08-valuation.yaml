- id: TV004
  title: Comparable valuation table
  columns:
  - Reference
  - Type
  - Current / last disclosed valuation marker
  - Scale marker
  - Why relevant
  - Key limitation
  rows:
  - - Nu Holdings
    - Public
    - ~$63.8B market cap; 8.41x PS
    - LTM revenue $7.59B; profits $3.18B
    - Best premium regional neobank benchmark for what scaled LatAm consumer finance can command.
    - Far larger and already highly disclosed, so it is an upside ceiling rather than a clean direct comp.
  - - dLocal
    - Public
    - ~$3.48B market cap; 2.87x PS; 2.21x EV/Sales
    - LTM revenue $1.21B; merchant TPV-sensitive model
    - Closer in equity value than Nu and useful as a lower-multiple payments reference.
    - Merchant-processing-first model is not a like-for-like consumer neobank.
  - - PagSeguro
    - Public
    - ~$2.59B market cap; 0.68x PS
    - LTM revenue $3.80B; profits $410M
    - Shows where a mature Brazilian digital-finance platform can trade when growth and sentiment cool.
    - Business mix and geography differ, and public-market profitability still exceeds Ualá disclosure.
  - - SoFi
    - Public
    - ~$23.37B market cap; 5.98x PS
    - LTM revenue $3.91B; profits $577M
    - Useful disclosed consumer-finance benchmark for how markets price broader banking plus lending platforms.
    - US credit and funding structures are not directly portable to Latin America.
  - - MercadoLibre
    - Public
    - ~$85.96B market cap; 2.70x PS
    - LTM revenue $31.80B; profits $1.92B
    - Regional ecosystem ceiling and a reminder of the valuation available to dominant LatAm platforms.
    - Fintech is embedded inside a much larger commerce ecosystem.
  - - Stori
    - Private
    - 2022 round at $1.2B
    - 1.4M+ customers in Mexico at the time
    - Relevant Mexico consumer-credit/private-market reference point.
    - Mark is 2022-vintage and from a narrower product set.
  - - Neon
    - Private
    - 2022 Series D of ~US$300M
    - 15M customers and R$5.8B monthly transactions at announcement
    - Relevant Brazilian consumer-fintech scale marker.
    - The announcement disclosed round size and scale, not a clean post-money valuation.
  - - Creditas
    - Private
    - 2022 Series F at $4.8B
    - Q3 2021 revenue $46.8M; 2021 annualized revenue about $200M
    - Relevant disclosed LatAm credit-fintech mark with better revenue transparency than most private peers.
    - Again a 2022 mark, in a different financing market and a collateralized-credit-heavy model.
  notes: Sample of the public and private references most relevant to Ualá's consumer-fintech, payments, and LatAm scale debate as of runDate; public rows use late-May-2026 market data, while private rows are the latest public marks we retained.
