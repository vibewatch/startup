- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Group revenue quality
    - Consolidated revenue or ARR, gross margin, take-rate mix, and any retention / NRR disclosure
    - This is the missing denominator for every public-comp discussion.
    - CFO diligence pack plus audited or management-certified bridge.
  - - Country contribution margins
    - Argentina / Mexico / Colombia contribution margin, fixed-cost allocation, and burn by market
    - Lets investors tell whether Mexico is scaling profitably or simply absorbing new equity.
    - Management accounts and board pack review.
  - - Mexico credit vintages
    - Vintage loss curves, roll rates, charge-offs, and reserve methodology after 4Q24 Fitch datapoints
    - Needed to decide whether 22.7% stage-3 was a remnant or a structural underwriting problem.
    - Credit committee deck and loan-book stratification.
  - - Primary-account behavior
    - Monthly active users, salary-direct-deposit share, card activity, merchant activity, and product attach rates
    - Customer count alone does not prove monetisation or defensibility.
    - Growth analytics review with cohort tables.
  - - Cap table and preference stack
    - Liquidation preferences, anti-dilution rights, employee refresh obligations, and any secondary pricing
    - New-money returns can diverge sharply from a headline post-money valuation.
    - Legal / finance cap-table diligence.
  - - Exit path readiness
    - Audited group financials, lender / IPO readiness, and any secondary liquidity process
    - Determines whether $3.2B can ever be realised or is only a paper mark.
    - Board materials, auditor workplan, and banker discussions.
  notes: These asks are the minimum package required to turn a sponsor-backed private mark into an investable underwriting case.
