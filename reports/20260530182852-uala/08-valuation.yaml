  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: group-revenue-quality
    missingEvidence: Consolidated revenue or ARR, gross margin, retention / NRR, and revenue-mix disclosure.
    whyItMatters: Without the denominator, investors cannot test whether the 2026 mark is cheap, fair, or stretched against public comps.
    diligencePath: Request audited or management-certified group financials and a quarterly bridge by product and geography.
    relatedQuestionRefs:
    - QV028
  - type: private-evidence-only
    severity: material
    topic: cap-table-overhang
    missingEvidence: Liquidation preferences, anti-dilution terms, employee refresh obligations, and any recent secondary-clearing price.
    whyItMatters: Headline post-money valuation can differ materially from the economics available to new common-equity capital.
    diligencePath: Review the cap table, latest financing documents, and any secondary process materials.
    relatedQuestionRefs:
    - QV029
  - type: private-evidence-only
    severity: material
    topic: mexico-cohort-economics
    missingEvidence: Vintage loss curves, cohort CAC / payback, and market-level contribution margin for Mexico.
    whyItMatters: Mexico is the main upside market and the clearest downside driver at the same time.
    diligencePath: Request country-level management accounts plus vintage loss and acquisition cohorts from the lending and growth teams.
    relatedQuestionRefs:
    - QV027
    - QV030
  - type: enumeration-incomplete
    severity: material
    topic: comparable-set
    missingEvidence: A broader 2024-2026 set of directly comparable private LatAm fintech marks, including any secondary discounts or structured round terms.
    whyItMatters: Most retained private references are 2022-vintage and therefore only partial evidence for a 2026 underwriting case.
    diligencePath: Supplement public references with venture databases, banker color, or diligence-room secondaries and add them to the comparable table.
    relatedQuestionRefs:
    - QV024
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: Audited group statements, bankers' preparedness materials, or a documented secondary / IPO readiness process.
    whyItMatters: A private mark is harder to monetise if there is no visible path to a public rerating or orderly liquidity event.
    diligencePath: Review board materials, auditor timetable, and any capital-markets or secondary-sale workstreams.
    relatedQuestionRefs:
    - QV030
