- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Side
  - Evidence
  - Why it matters
  - What would change the view
  rows:
  - - Thesis
    - Fresh $3.2B round with repeat blue-chip backers after a $366M Series E
    - Shows Ualá remains fundable while much of the region faces selective capital.
    - A failed or discounted next raise would weaken this support signal.
  - - Thesis
    - 11M+ customers plus full banking licences across markets
    - Scale and regulatory perimeter create room to monetise beyond a wallet use case.
    - Need proof that those customers are primary accounts, not low-ARPU registrations.
  - - Thesis
    - Insurance, lending, investments, and merchant acquiring broaden revenue surface
    - Multiple products can justify a premium to pure payments processors if cross-sell is real.
    - Need attach-rate, cohort retention, and unit-economics evidence.
  - - Anti-thesis
    - No public consolidated revenue, margin, or retention disclosure
    - Without the key denominator, investors cannot test whether $3.2B is cheap or rich.
    - Audited or diligence-grade financial disclosure would narrow the uncertainty.
  - - Anti-thesis
    - Fitch still flags Mexico losses, 22.7% stage-3 loans, and capital-injection reliance
    - The most important monetisation market is also the clearest source of valuation discount.
    - A sustained reduction in losses and risk costs would materially improve the case.
  - - Anti-thesis
    - Regional funding markets stayed tight in 2025-2026
    - Even strong companies may have to accept tougher terms if markets do not reopen.
    - A looser capital market or successful secondary/IPO prep would offset this pressure.
  notes: Each row distils the core argument and the specific fact pattern needed to upgrade or downgrade the stance.
