- id: round-history-and-price-anchor
  title: Last-round context and what the mark does not prove
  body: 'The financing history now matters more than the old valuation narrative. Ualá moved from a $350 million Series D at $2.45 billion in 2021 to a $300 million Series E at $2.75 billion in November 2024, then added a $66 million second close in March 2025, and finally raised another roughly $195-197 million in March 2026 at $3.2 billion. That chronology reduces immediate down-round pressure and signals that the company is still one of the few Latin American fintechs able to raise primary capital at scale. But the same history does not eliminate price risk for a new investor. FinTech Global''s 2025-2026 sector data shows a much tighter market: regional fintech funding fell 27% in 2025, deals above $100 million fell 42%, and Q4 2025 funding was down 55% year over year. In other words, Ualá has demonstrated fundability, not automatic public-market equivalence. Without secondary pricing, liquidation-preference detail, or a clean view on whether the latest round is common-equity economics
    rather than structure, outside investors still need entry discipline.'
  claimRefs:
  - CV001
  - CV004
  - CV005
  - CV017
  - CV018
  - CV019
  - CV040
  - CV041
- id: public-and-private-reference-points
  title: Public-market and private-market reference points
  body: 'The public comp set gives a wide but still useful bracket. Nu is the premium Latin American digital-bank benchmark at roughly $63.8 billion of market value and 8.41x trailing sales; SoFi trades around $23.4 billion and 5.98x; MercadoLibre is the ecosystem ceiling at $86.0 billion and 2.70x; dLocal is a closer-scale payments processor at roughly $3.5 billion and 2.87x; and PagSeguro is the lower-multiple mature benchmark at about $2.6 billion and 0.68x. None is a perfect analog: dLocal is merchant-processing-first, MercadoLibre embeds fintech inside a much larger commerce machine, and Nu and SoFi are far more disclosed. The private reference points are even noisier. Stori hit $1.2 billion in 2022, Neon raised US$300 million in 2022 after reaching 15 million customers, and Creditas hit $4.8 billion in 2022 with unusually transparent revenue commentary. Those marks show that investors have paid multi-billion-dollar prices for Latin American consumer fintech scale, but they are mostly
    2022-vintage and therefore only partial support for a 2026 price. The cleanest takeaway is that Ualá sits inside the plausible regional comp range, but public evidence still cannot say where inside that range it should clear.'
