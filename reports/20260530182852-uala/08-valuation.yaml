- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Value
  - Decision implication
  rows:
  - - Recommendation
    - TRACK
    - Respect the fresh mark but do not chase it without deeper diligence.
  - - Confidence
    - MEDIUM
    - Sponsor support is real, but public underwriting evidence is incomplete.
  - - Risk rating
    - HIGH
    - Mexico credit losses, disclosure opacity, and a tighter capital market keep downside material.
  - - Valuation stance
    - FAIR-TO-STRETCHED at $3.2B
    - The mark is defendable as a private sponsor price, not yet as an obviously cheap public-equivalent entry.
  - - Most attractive entry setup
    - Discount to the 2026 round or a diligence-backed reaffirmation
    - Either price has to improve or disclosure has to improve.
  - - Upside path
    - Disclosed monetisation plus cleaner Mexico credit
    - That combination could support a move into the $4B+ bull range.
  - - Immediate no-go signal
    - Structure-heavy new round or no visibility on unit economics
    - That would mean price is being protected more by terms than by proof.
  notes: Judgment table synthesising sourced facts, public-comp markers, and evidence gaps; not a company guidance document.
