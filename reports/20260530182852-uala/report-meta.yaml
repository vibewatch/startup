companyProfile:
  summary: >-
    Ualá is a late-stage private Latin American neobank founded in Argentina in
    October 2017 by Pierpaolo Barbieri. From a card-and-wallet origin it has
    expanded into a broader financial ecosystem spanning cards, payments,
    personal lending, investments, insurance, and merchant acquiring across
    Argentina, Mexico, and Colombia, with Buenos Aires as the regional
    headquarters anchor. Official March 2026 materials say Ualá serves more
    than 11 million customers and holds full banking licences across its
    markets, while the latest Allianz X-led financing valued the company at
    $3.2 billion. Public visibility on products and funding is strong, but
    consolidated revenue, margin, and profitability disclosure remains limited.
  foundedDate: '2017-10-01'
  founders:
    - name: Pierpaolo Barbieri
      role: Founder and CEO
      background: >-
        Argentine entrepreneur who remains Ualá's founder, CEO, and public
        strategic voice across the company's funding, expansion, and product
        narratives.
      claimRefs: [CO010, CO016]
  foundingLocation: Argentina
  headquarters: Buenos Aires, Argentina
  productSummary: >-
    Consumer and merchant financial products including cards, payments,
    personal lending, investments, insurance, and merchant-acquiring / checkout
    tools offered across Argentina, Mexico, and Colombia.
  customerFocus: >-
    Mass-market retail consumers plus merchants and SMBs using Ualá Bis and
    related acquiring tools across Argentina, Mexico, and Colombia.
  businessModel: >-
    Monetizes through payment and card fees, consumer-lending spreads,
    remunerated-balance and investment cross-sell, FX / insurance distribution,
    and merchant acquiring / checkout pricing.
  stage: Late-stage private / post-Series E and 2026 primary financing
  fundingStatus: >-
    March 2026 Allianz X-led equity round of about $195-197M at a $3.2B
    post-money valuation, following a $300M Series E in November 2024 and a
    $66M second close in March 2025 ($366M total).
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO004, CO007, CO010, CO023, CO026, CI060, CI066, CI067, CV001, CV046]
summary:
  headline: >-
    Ualá has real regional scale, product breadth, and continuing sponsor
    support, but limited consolidated disclosure and Mexico credit risk keep
    the case at TRACK with high residual risk and a fair, price-sensitive
    current valuation.
  overallScore: 6.9
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: fair
