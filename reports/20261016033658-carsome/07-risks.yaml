figures:
  - id: "FR001"
    title: "Risk heatmap"
    type: "matrix"
    summary: "Carsome's current risk load clusters in medium-to-high likelihood exposures with high or critical impact if the integrated model stops compounding."
    data:
      columns:
        - label: "Lower likelihood"
          note: "Would require a new external shock or a specific partner failure."
        - label: "Medium likelihood"
          note: "Visible exposure, but not yet clearly deteriorating."
        - label: "Higher likelihood"
          note: "Already visible in the retained 2026 operating evidence."
      rows:
        - label: "Critical impact"
          note: "Could materially impair the investment case."
          values:
            - label: "—"
            - label: "Financing/compliance opacity"
              tone: "critical"
              note: "Cross-border financing, underwriting, and complaint data remain undisclosed."
            - label: "Capital intensity / funding dependence"
              tone: "critical"
              note: "Fresh March 2026 equity plus prior debt facilities imply residual external-capital reliance."
        - label: "High impact"
          note: "Could weaken margins, growth, or exit readiness."
          values:
            - label: "Cloud / cyber concentration"
              tone: "medium"
              note: "Google Cloud consolidation is strategically sensible but adds vendor and control dependency."
            - label: "Partner withdrawal"
              tone: "high"
              note: "Financing partners and ecosystem assets are important to conversion and traffic."
            - label: "Indonesia / Thailand credit softness"
              tone: "high"
              note: "Management updates already flag a cautious credit backdrop in both markets."
        - label: "Moderate impact"
          note: "Manageable individually, but cumulative with other failures."
          values:
            - label: "M&A integration drag"
              tone: "medium"
              note: "The hybrid C2B2C model depends on consolidation working as intended."
            - label: "Cost-discipline strain"
              tone: "medium"
              note: "Past layoffs show execution pressure during the path to profitability."
            - label: "Retail process complexity"
              tone: "high"
              note: "Inspection, refurbishment, transfer, and warranty promises require consistent service quality."
        - label: "Contained-but-material impact"
          note: "Likely manageable, but still important to diligence."
          values:
            - label: "Showroom / center expansion discipline"
              tone: "medium"
              note: "New physical locations can dilute utilization if demand softens."
            - label: "Traffic-asset conversion"
              tone: "medium"
              note: "Acquired or affiliated audiences still have to convert into profitable transactions."
            - label: "Talent retention after cost actions"
              tone: "medium"
              note: "Layoffs can simplify the cost base but create local execution discontinuity."
        - label: "Monitoring impact"
          note: "Important because it can compound into larger failures."
          values:
            - label: "Warranty / after-sales consistency"
              tone: "medium"
              note: "Retail trust depends on consistent delivery of ownership and support promises."
            - label: "Data / AI execution payoff"
              tone: "medium"
              note: "AI and technology collaboration should improve operations rather than add complexity."
            - label: "Cross-border governance maturity"
              tone: "medium"
              note: "A larger regional footprint raises reporting and control expectations ahead of any listing."
        - label: "Background impact"
          note: "Less acute alone, but relevant to cumulative operating complexity."
          values:
            - label: "Brand-extension sprawl"
              tone: "medium"
              note: "Multiple brands and training / capital adjacencies broaden management scope."
            - label: "Market-fragmentation persistence"
              tone: "medium"
              note: "Used-car trust problems can reappear if standards weaken in any market."
            - label: "Physical-footprint fixed costs"
              tone: "medium"
              note: "Regional centers and showrooms create cost commitments that need steady throughput."
    approximationNotes: "This heatmap is a synthesis of retained evidence, not a statistically estimated loss model."
    claimRefs: [CR002, CR004, CR006, CR007, CR008, CR009, CR010, CR011, CR012]
