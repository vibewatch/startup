schemaVersion: report-v2
artifact: company-overview
slug: carsome
runDate: 2026-10-16
company:
  name: Carsome
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Carsome remains a Malaysia-based late-stage private used-car platform whose
    official surfaces still emphasize regional scale, integrated ownership
    services, and continued profitability momentum into 2026. The assigned
    evidence supports Carsome's identity, operating footprint, leadership
    lineup, and major funding milestones, but exact board composition,
    cap-table control, reconciled lifetime funding, and precise current
    headcount remain unresolved.
sections:
  - id: identity-and-footprint
    title: Identity, footprint, and operating model
    body: >-
      Carsome presents itself as Southeast Asia's largest integrated car
      e-commerce platform, focused on digitizing the used-car transaction and
      ownership journey across Malaysia, Indonesia, Thailand, and Singapore.
      The official company pages consistently describe an end-to-end model that
      combines inspection, ownership transfer, financing, and retail buying
      flows rather than a narrow classifieds marketplace. Scale disclosures are
      meaningful but still selective: the official about-us page says Carsome
      now operates 80+ centers across 50+ cities and serves a 13,000+ dealer
      network, while current headcount remains imprecise because the assigned
      pool only includes a broad third-party range rather than a
      management-disclosed employee count.
    claimRefs: [CO001, CO002, CO008, CO009, CO010]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Founders, leadership, and governance visibility
    body: >-
      The public leadership picture remains founder-centered. Carsome's
      newsroom identifies co-founder Eric Cheng as chairman and group CEO,
      while Teoh Jiun Ee remains attached to the platform through Carsome
      Academy and Eric Chan now runs regional operations as president and COO.
      That supports the view that the company's operating identity still
      depends materially on a relatively concentrated senior team around the
      founders and a small number of named executives. Governance visibility is
      thinner than operating visibility, however: the assigned pool supports
      current management titles and a notable 2024 finance-leadership
      transition, but it does not provide a current board roster, ownership
      percentages, or explicit independent-director structure.
    claimRefs: [CO003, CO012, CO013, CO014]
    tableRefs: [TO002]
  - id: funding-scale-and-stage
    title: Funding history, scale signals, and current stage
    body: >-
      Carsome's financing history shows a company that has repeatedly raised
      capital to expand its regional footprint and deepen its integrated
      services. The official 2021 Series D2 announcement documented US$170
      million of equity plus US$30 million of credit facilities and attached a
      US$1.3 billion valuation to that round, while the official company
      timeline later recorded a US$290 million Series E in 2022 and a US$1.7
      billion valuation mark. The 2026 evidence also shows continued capital
      access rather than a new public listing: a March 2026
      company-distributed announcement said Carsome raised more than US$30
      million from HKIC, Gobi Partners, Asia Partners, and other backers.
      Operationally, third-party reporting indicates Carsome returned to
      year-on-year growth in Q1 2026, suggesting the company is still managing
      for profitability and expansion at the same time.
    claimRefs: [CO004, CO005, CO006, CO007, CO011, CO015, CO016]
    tableRefs: [TO003]
  - id: milestone-arc-and-diligence-gaps
    title: Milestones and unresolved diligence gaps
    body: >-
      The milestone arc is coherent: Carsome moved from founding in 2015, to
      regional expansion in 2016-2017, to platform broadening through Carsome
      Capital and buy-car retail, and then to profitability milestones in
      2023-2024 with further funding and partnership activity in 2025-2026.
      The weakest parts of the chapter are not identity or product-market
      positioning, but disclosure quality around governance and financing
      detail. The assigned sources do not reconcile lifetime capital raised, do
      not give a current exact employee count, and do not disclose board
      composition or control rights. There is also a real adverse datapoint in
      the historical record: third-party coverage summarized layoffs in 2022
      and 2023 as Carsome pushed toward profitability and possible IPO
      readiness.
    claimRefs: [CO004, CO005, CO006, CO007, CO010, CO011, CO014, CO015, CO016]
    figureRefs: [FO001]
tables:
  - id: TO001
    title: Snapshot KPI table
    columns:
      - Metric
      - Value/status
      - Date
      - Confidence
      - Gap
    rows:
      - [Headquarters, "Malaysia-based; third-party profile places it in Selangor, Malaysia", "2026 profile / undated official pages", low, "Exact headquarters address and board seat location not disclosed in assigned pool"]
      - [Stage, "Late-stage private company still raising private capital", "2026", medium, "No IPO filing or public-listing timeline in assigned pool"]
      - [Latest valuation, "US$1.7 billion", "2022", medium, "Most recent explicit valuation mark in assigned pool is historical rather than a fresh 2026 priced round"]
      - [Latest financing, ">US$30 million strategic investment round", "2026-03-17", medium, "No post-round ownership or valuation disclosure in assigned pool"]
      - [Total raised, null, "2025-10 / 2026-08 third-party references", low, "Conflicting third-party totals of US$710 million versus over US$808 million need management reconciliation"]
      - [Revenue / run-rate, null, "2021 historical / 2026 quarterly profitability", low, "Assigned pool supports profitability momentum but not a current revenue run-rate disclosure"]
      - [Headcount, "1001-5000 employees (third-party range only)", "2026 profile", low, "Exact current employee count not disclosed in assigned pool"]
      - [Operating footprint, "80+ centers across 50+ cities; 13,000+ dealers", "undated current official page", medium, "No country-by-country split in assigned pool"]
    notes: Assigned pool mixes official disclosures with weaker third-party profile data; null means the metric is not cleanly supportable from the worker's prefetched evidence.
    claimRefs: [CO006, CO007, CO008, CO009, CO015, CO016]
  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Role
      - Background / coverage
      - Founder-market fit or functional coverage
      - Key-person dependency
    rows:
      - [Eric Cheng, "Co-founder, Chairman and Group CEO", "Public face of strategy, fundraising, and regional operating direction", "Founder continuity and external capital access", "High - leadership narrative and funding milestones remain closely associated with him"]
      - [Teoh Jiun Ee, "Co-founder; CEO of Carsome Academy", "Original builder of dealer-network and operating-capability functions", "Founder continuity and workforce capability development", "Medium - no evidence he still runs day-to-day group operations"]
      - [Eric Chan, "Group President and COO", "Named official operator for regional execution; third-party source says appointed in March 2024", "Operating scale, inspection, and supply-chain execution", "Medium - important execution owner but less founder-central than Cheng"]
      - [Aaron Kee, "Group Chief Business Officer", "Named on newsroom leadership roster as commercial executive", "Commercial and ecosystem coverage", "Medium - current remit is visible, but detailed track record is not in assigned pool"]
      - [Juliet Zhu, "Former Group President and CFO; adviser after March 2024", "Third-party source ties her to fundraising and profitability transition", "Capital planning and finance transition context", "Medium - departure from an operating finance seat raises diligence questions on current finance leadership depth"]
    notes: Roles come from official newsroom and company pages; background and transition context use the assigned third-party profile where available, and the pool does not disclose the full board roster.
    enumerationScope:
      coverage: partial
      basis: This table covers named founders and senior executives visible in the assigned official newsroom roster plus one material former finance leader from the assigned third-party profile.
    claimRefs: [CO003, CO012, CO013, CO014]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control or economic importance
      - Diligence ask
    rows:
      - ["Founders and management", "Strategic and operating control nucleus", "Founders still anchor brand, strategy, and operating continuity, but current ownership percentages are undisclosed", "Request current cap table, voting rights, and board-seat allocation"]
      - ["Gobi Partners", "Repeat equity backer", "Named in the 2021 Series D2 syndicate and again in the 2026 strategic investment round", "Confirm ownership percentage, pro rata rights, and board / observer status"]
      - ["Asia Partners", "Growth investor", "Participated in 2021 Series D2 and was named again in the 2026 strategic round", "Clarify economics, governance rights, and exit expectations"]
      - ["Catcha Group", "Strategic investor and ecosystem partner", "Named in the 2021 funding syndicate and tied to iCar Asia ecosystem expansion in third-party coverage", "Confirm whether strategic rights extend beyond economic ownership"]
      - ["HKIC", "New 2026 strategic investor", "Named in the March 2026 round that emphasized Greater China links, sourcing, and AI collaboration", "Request round documents, use-of-proceeds detail, and any strategic-side agreements"]
    notes: This is a partial map of named capital providers and control stakeholders from the assigned pool; ownership percentages, liquidation preferences, debt covenants, and board rights are not disclosed here.
    enumerationScope:
      coverage: partial
      basis: This map includes stakeholders explicitly named in the assigned 2021, 2022, and 2026 financing evidence and excludes undisclosed holders whose economics cannot be verified from the worker pool.
    claimRefs: [CO005, CO006, CO007, CO015, CO016]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Carsome's milestone path runs from 2015 founding and regional expansion into post-2023 profitability and fresh 2026 financing.
    data:
      items:
        - date: "2015"
          label: Founded in Malaysia
          detail: Carsome was founded in Malaysia with US$350,000 seed funding.
          tone: neutral
        - date: "2016"
          label: Singapore launch and Series A
          detail: Carsome entered Singapore and raised US$2 million in Series A funding.
          tone: positive
        - date: "2017"
          label: Indonesia and Thailand expansion
          detail: Regional operations expanded into Indonesia and Thailand.
          tone: positive
        - date: "2019"
          label: Carsome Capital and Series C
          detail: Carsome Capital was established and the company raised US$50 million in Series C funding.
          tone: positive
        - date: "2020"
          label: Buy-car retail launch
          detail: Carsome launched its buy-car service, The New Way of Buying Cars, in Malaysia.
          tone: positive
        - date: "2021-09-01"
          label: Series D2 and unicorn valuation
          detail: Series D2 closed with US$170 million of equity plus US$30 million of credit facilities, taking valuation to US$1.3 billion.
          tone: positive
        - date: "2022"
          label: Series E and US$1.7 billion valuation
          detail: Carsome raised US$290 million in Series E financing and said the group reached a US$1.7 billion valuation.
          tone: positive
        - date: "2023"
          label: First operational profitability milestone
          detail: The official timeline says Carsome hit its first operational profitability milestone in Q1 2023.
          tone: positive
        - date: "2024"
          label: First full-year profitability
          detail: Carsome said it achieved its first full-year profitability with EBITDA of US$10.5 million and crossed 500,000 cars sold since inception.
          tone: positive
        - date: "2026"
          label: Fresh capital and Q1 growth
          detail: Carsome announced a strategic investment round of more than US$30 million and independent reporting said Q1 2026 returned to year-on-year growth.
          tone: risk
    approximationNotes: Dates use year-level markers when the assigned evidence provides milestone timing but not a precise day.
    claimRefs: [CO003, CO004, CO005, CO006, CO007, CO010, CO011]
callouts:
  - calloutType: risk
    title: Governance disclosure lags operating disclosure
    body: >-
      The assigned evidence names several senior operators and documents major
      funding events, but it does not disclose a current board roster,
      ownership concentrations, or a reconciled lifetime funding bridge. That
      leaves real control-risk work outstanding even though the business
      identity and operating scale are relatively well evidenced.
    claimRefs: [CO009, CO012, CO013, CO015, CO016]
