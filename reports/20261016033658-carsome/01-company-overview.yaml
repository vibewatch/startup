  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: governance-disclosure
      missingEvidence: Current board roster, independent-director structure, cap-table ownership percentages, and any voting-control summary.
      whyItMatters: Governance concentration and control rights affect key-person risk, investor protections, and exit-readiness assessment.
      diligencePath: Request the latest board list, shareholder register, and any board-rights or shareholder-agreement summary from management.
      relatedQuestionRefs: [QO002]
      relatedTableRefs: [TO002, TO003]
    - type: conflicting-data
      severity: material
      topic: total-raised
      missingEvidence: A reconciled round-by-round financing bridge that explains whether debt facilities are included in lifetime funding totals.
      whyItMatters: Conflicting lifetime funding numbers distort dilution, leverage, and investor-ownership analysis.
      diligencePath: Request a financing ledger listing each equity and debt round, date, amount, instrument, and post-money valuation.
