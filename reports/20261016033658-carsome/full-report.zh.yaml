      - number: '2.3'
        title: 买方、用户、付款方与预算归属
        blocks:
          - type: paragraph
            body: >-
              该平台在同一市场中服务多个经济参与者。私人卖家是流程起点的供给侧用户，使用 Carsome
              进行检测、估值并更快出售；买家使用零售层获得信任、保修和融资；经销商则使用批发渠道补充库存，无需独立检查每辆车。因此付款方会随步骤变化：家庭承担购车预算，经销商为库存采购提供资金，贷款方则在嵌入式信贷报价弥合支付能力缺口时为转化提供融资。2026
              年管理层评论明确强调了融资的重要性，将机构融资额度与 Carsome 支持区域买家和经销商交易的能力联系起来。
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM013
      - number: '2.4'
        title: 采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              指定资料中最一致的采用驱动因素是可负担性、便利性和信任。Carsome 的 2026
              年评论认为，当消费者更加审慎时，二手车需求仍具韧性；一体化流程则减少文书摩擦和对车辆状况的不确定性。一个较新的增长方向是二手电动车供应预期增加；如果车辆状况评估和转售信心随之改善，可寻址库存池可能扩大。主要约束在于各市场的需求条件并不统一：Carsome
              特别指出，印度尼西亚和泰国受宏观压力及谨慎的消费者信贷条件影响，波动更大。因此融资可得性和信贷质量是门槛变量，而不仅是有益的附加项。
            claimRefs:
              - CM004
              - CM011
              - CM012
              - CM013
              - CM016
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 市场边界以工作流为先，而非以媒体为先
            body: Carsome 的相关市场涵盖采购、检测、转移、融资以及零售/批发转化，因此估值应以多步骤交易控制为锚，而不是仅依据获客流量。
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM007
          - type: callout
            title: 公开 SAM 的精确度仍然较弱
            body: 公开记录提供了广泛的区域需求视角和若干公司运营视角，但仍未披露清晰的国家级收入拆分或按细分市场划分的预算持有人模型，这限制了评估市场份额假设时的精确度。
            calloutType: risk
            claimRefs:
              - CM008
              - CM009
              - CM010
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与替代方案集合
        blocks:
          - type: paragraph
            body: >-
              Carsome 的竞争对象并不只有另一家线上二手车市场。指定证据支持一种分层格局，包括区域直接同行
              Carro、仍掌握本地库存和关系的既有二手车经销商、由买卖双方自行承担检测和文书工作的消费者分类信息或自行销售，以及可能将需求吸引到品牌分销体系中的相邻 OEM
              或电动车渠道。这种广度很重要，因为相对于其试图组织的市场，Carsome 披露的区域规模仍处于早期；因此竞争压力既来自规模化数字同行，也来自其试图取代的分散现状。
