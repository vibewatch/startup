      - number: '3.2'
        title: 通过能力、产品组合与分销实现差异化
        blocks:
          - type: paragraph
            body: >-
              Carsome
              的差异化不在于单一信息发布界面，而在于将多个利润池缝合进一个工作流。官方页面和管理层访谈描述了一种端到端方案，涵盖检测、所有权转移、融资、认证零售、附属服务，以及在交易开始前获取客户的媒体资产。这使其与传统经销商或分类信息平台的比较具有不对称性：这些替代方案仍可能在本地供给或价格上竞争，但指定证据没有显示它们具备同样的获客、翻新、经销商拍卖和售后服务组合。结果是更强的分销和转化引擎，而不只是更好的市场用户体验。
