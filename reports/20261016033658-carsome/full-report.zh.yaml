        title: 一体化范围覆盖交易双方
        blocks:
          - type: paragraph
            body: >-
              Carsome 仍首先将产品呈现为一体化二手车商业平台，而非单薄的分类信息界面。印度尼西亚和泰国官方页面、公司关于我们页面及投资者材料都描述了相同的广泛范围：Carsome
              通过内容和自有品牌获取流量，通过检测和定价转化卖家，通过竞价服务经销商，并从零售、融资及相关附属服务中变现。这很重要，因为核心差异化在于运营深度，而不只是获客。65 Equity
              的合作伙伴视角也强调，Carsome 保留检测、翻新和销售的线下层，同时以数字方式连接用户。因此，该产品最好被理解为二手车所有权转移的区域操作系统，不同模块服务消费者、经销商和内部运营。
            claimRefs:
              - CE001
