          note: 大多数供给由卖家直接向 Carsome 发起。
          claimRefs:
            - CI003
        - id: inspection
          label: 检测与定价
          displayValue: 175-point inspection
          note: 检测和定价决定 Carsome 是买入、拍卖，还是将车辆转至其他渠道。
          claimRefs:
            - CI001
            - CI003
        - id: wholesale
          label: 经销商拍卖 / 批发
          displayValue: 20,000+ dealers
          note: Carsome 可以通过经销商竞价和快速批发周转变现。
          claimRefs:
            - CI002
