        - 这套模式似乎借助更快的库存周转、整合融资和生态广度创造了运营杠杆。
        - 经验证的 FY25/FY26 单位经济和融资账簿质量将支持更窄的估值区间。
      - - 反论点
        - 当前价格发现不透明：2026 年融资披露了金额和投资者，却没有披露估值或优先权条款。
        - 如果披露估值、清晰的股份类别和适度的优先股堆叠，这一担忧会减弱。
      - - 反论点
