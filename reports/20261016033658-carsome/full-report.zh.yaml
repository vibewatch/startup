  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Carsome
              处于二手车交易和所有权流程之中，而非某个单一分类信息细分市场。公司和第三方简介始终描述一种一体化服务栈，为消费者和二手车经销商结合发现、检测、估值、所有权转移、融资及附属服务。这个边界很重要，因为核心替代方案并非某一家软件供应商，而是由非正式经销商网络、手工文书和分类信息组成的分散线下市场，在那里价格发现和车辆状况信任仍然薄弱。换言之，Carsome
              试图在一个序列中将多个相互关联的任务数字化，因此相关比较对象是多步骤交易旅程，而不只是广告支持的获客市场。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM007
      - number: '2.2'
        title: 受证据约束的市场规模视角
        blocks:
          - type: paragraph
            body: >-
              指定证据不足以支持精确的 TAM/SAM/SOM 体系，因此最稳妥的方法是将广义市场视角与 Carsome 特有的变现视角分开。DollarsAndSense 引用东南亚二手车市场规模为 1,310
              亿美元，并预计 2023E 至 2025E 增长 10.6%，这支持存在巨大需求池，但没有披露其原始方法或国家构成。其余公开证据属于公司规模指标：2022 年收入 15 亿美元、截至 2022 年 8
              月年化交易额超过 17 亿美元，以及通过毛利润和 GPU 扩张体现出的更强 2026 年单位经济性。这些数据点表明 Carsome 已建立有意义的运营覆盖，但不应将其误认为清晰的可服务市场估算。
