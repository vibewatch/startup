chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、覆盖范围与运营模式
        blocks:
          - type: paragraph
            body: >-
              Carsome
              将自身定位为东南亚最大的一体化汽车电商平台，专注于将马来西亚、印度尼西亚、泰国和新加坡的二手车交易及所有权流程数字化。公司官方页面始终描述一种端到端模式，将检测、所有权转移、融资和零售购车流程结合起来，而非局限于分类信息市场。规模披露颇有价值但仍具选择性：官方关于我们页面称
              Carsome 目前在 50 多个城市运营 80 多个中心，服务 13,000 多家经销商；但当前员工人数仍不精确，因为指定资料仅包含宽泛的第三方区间，而非管理层披露的员工数。
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO009
              - CO010
