        title: 创始人、领导层与治理透明度
        blocks:
          - type: paragraph
            body: >-
              公开领导层格局仍以创始人为中心。Carsome 新闻室确认联合创始人 Eric Cheng 为董事长兼集团首席执行官；Teoh Jiun Ee 通过 Carsome Academy 继续与平台保持联系，Eric
              Chan
              则以总裁兼首席运营官身份负责区域运营。这支持了这样的判断：公司的运营身份仍在很大程度上依赖围绕创始人、由少数指定高管组成的相对集中的高级团队。然而，治理透明度低于运营透明度：指定资料支持当前管理职务以及值得注意的
              2024 年财务领导层交接，但没有提供当前董事会名单、持股比例或明确的独立董事结构。
