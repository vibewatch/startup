        title: 公开牵引力与单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              指定资料提供了足够的公开数据来显示运营规模，但不足以完整评估收入质量。2023 年现场报告称 Carsome 每月销售超过 18,000 辆 Carsome Certified 车辆、2022 年收入 15
              亿美元、每月吸引 1,500 万独立访客；2026 年一家公司简介聚合平台另称该业务每年交易约 100,000 辆汽车。最有用的营运资本代理指标是库存周转速度：同一份 2023
              年现场报告援引管理层称，零售库存持有约 20 天、批发库存约 7 天，而行业超过 30 天。这些是鼓舞人心的公开信号，但不能替代按批次披露的毛利率、单位整备成本、实际抽成率或地域及细分组合。
