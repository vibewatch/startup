            body: >-
              财务故事正在朝改善方向发展：公开材料支持比简单佣金更广泛的收入栈，部分证据显示库存周转快于传统经销商，且当前募资发生在公司宣称实现盈利之后。投资评估的难点在于披露深度。第三方聚合平台的公开融资统计已经分歧：一份摘要统计
              8 轮共 7.59 亿美元，另一份称 Carsome 包括债务融资在内已通过 16 轮筹得超过 8.08 亿美元；Grokipedia 还报道其在迈向盈利期间于 2022 年和 2023
              年裁员。在尽调获得管理层认证的现金、债务、毛利率和放贷账本数据之前，正确的判断是：Carsome 的财务成熟度高于不惜一切代价增长的市场平台，但仍无法仅凭公开来源完成充分评估。
