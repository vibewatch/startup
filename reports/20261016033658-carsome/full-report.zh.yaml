              公开证据中确实存在产品化技术工作流，但证明并不均衡。最清晰的披露来自 Carsome 数据负责人发布的 AWS 客座文章：其描述了使用 SageMaker Batch Transform 加 Airflow
              编排的图像处理工作流，用于模糊检测照片中的车牌，并明确定位为隐私和检测员效率工具。Carsome 还称，该工作流将每辆车的遮盖时间从至少 1 分钟缩短至 2.4
              秒，说明团队已经能把机器学习落到检测栈内部，而不只是用于面向消费者的推荐。公开路线图语言仍是方向性雄心，而非深入架构：Carsome 表示希望将智能嵌入各项运营，提到实时经销商拍卖推荐引擎，并将 2026
              年融资与 AI、数据和下一代移动服务联系起来。这支持一种技术赋能的运营模式，但不代表核心平台架构已完整披露。
