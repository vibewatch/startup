  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - FY24-FY25 盈利证明具备持续性，2026 年融资定价不高于 2022 年峰值估值，且优先股堆叠较轻。
        - 在不高于最近一次公开峰值估值的水平上纪律性入场，可能保留通往 IPO 或战略流动性窗口的上行空间。
        - 需要经审计的后续表现以及已披露的清晰条款。
        - 定价高于 2022 年估值且没有审计支持，会破坏这一情景。
      - - 基准
        - Carsome 仍然盈利，但当前估值处于 2021 年 13 亿美元和 2022 年 17 亿美元两个锚点之间的某处。
        - 这支持列入观察名单，而非立即形成强信心，因为回报计算取决于未披露的优先级和稀释程度。
        - 与今天的证据组合最一致：运营改善，但条款可见性不完整。
        - 现金转化疲弱或融资损失扩大，会使情景进一步下移。
      - - 悲观
        - 最近一轮融资包含隐藏的估值抬升、较重的优先股堆叠，或掩盖市场需求走弱的类过桥结构。
        - 即使业务不错，如果下行保护偏向内部人，或下一次估值下调，后期入场也可能带来糟糕回报。
        - 2026 年定价、证券类型和持股未披露，因此这一情景仍然成立。
        - 下轮融资降价、IPO 延迟或盈利恶化将确认这一情景。
    notes: 情景区间使用已披露的里程碑参考，而不是可比公司倍数，因为指定证据池没有独立的当前可比公司集合，也没有披露 2026 年条款清单。
    claimRefs:
      - CV003
      - CV006
      - CV008
      - CV010
      - CV011
      - CV012
      - CV016
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Carsome 的里程碑从 2015 年成立和区域扩张，走向 2023 年后的盈利以及 2026 年新一轮融资。
    data:
      items:
        - date: '2015'
          label: 在马来西亚成立
          detail: Carsome 在马来西亚成立，获得 350,000 美元种子资金。
          tone: neutral
        - date: '2016'
          label: 新加坡启动及 A 轮融资
          detail: Carsome 进入新加坡，并完成 200 万美元 A 轮融资。
          tone: positive
        - date: '2017'
          label: 扩张至印度尼西亚和泰国
          detail: 区域业务扩展至印度尼西亚和泰国。
          tone: positive
        - date: '2019'
          label: Carsome Capital 及 C 轮融资
          detail: Carsome Capital 成立，公司完成 5,000 万美元 C 轮融资。
          tone: positive
        - date: '2020'
          label: 买车零售业务启动
          detail: Carsome 在马来西亚推出买车服务 The New Way of Buying Cars。
          tone: positive
        - date: '2021-09-01'
          label: D2 轮及独角兽估值
          detail: D2 轮完成 1.7 亿美元股权融资及 3,000 万美元信贷额度，使估值达到 13 亿美元。
          tone: positive
        - date: '2022'
          label: E 轮及 17 亿美元估值
          detail: Carsome 完成 2.9 亿美元 E 轮融资，并称集团估值达到 17 亿美元。
          tone: positive
        - date: '2023'
          label: 首个运营盈利里程碑
          detail: 官方时间线称，Carsome 在 2023 年第一季度实现首个运营盈利里程碑。
          tone: positive
        - date: '2024'
          label: 首个全年盈利
          detail: Carsome 称，公司首次实现全年盈利，EBITDA 为 1,050 万美元，成立以来售出的汽车超过 500,000 辆。
          tone: positive
        - date: '2026'
          label: 新资本及第一季度增长
          detail: Carsome 宣布一轮超过 3,000 万美元的战略投资，独立报道称其 2026 年第一季度恢复同比增长。
          tone: risk
    approximationNotes: 指定证据仅提供里程碑时间而非精确日期，因此日期采用年份标记。
    claimRefs:
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO010
      - CO011
  - id: FM001
    title: 从市场到变现的规模化视角
    type: pyramid
    summary: 最好的公开证据不是一套清晰的公开 TAM/SAM/SOM，而是从宽泛的区域二手车市场视角，逐步收窄到 Carsome 的供给、渠道和变现指标。
    data:
      items:
        - label: 区域二手车需求
          value: 131
          displayValue: US$131b
          unit: market value
          note: 独立的 2023 年视角；据引述，2023E-2025E 增长 10.6%。
          claimRefs:
            - CM008
        - label: 消费者来源库存
          value: 90
          displayValue: ~90%
          unit: of inventory
          note: Carsome 称，大多数供给直接来自消费者。
          claimRefs:
            - CM006
        - label: 经销商网络覆盖
          value: 20000
          displayValue: '>20,000'
          unit: dealers
          note: 卖家选择竞价时即可使用该网络。
          claimRefs:
            - CM007
        - label: 年化交易价值
          value: 1.7
          displayValue: '>US$1.7b'
          unit: annualized value
          note: 合作伙伴支持的 2022 年运营视角，并非经审计收入。
          claimRefs:
            - CM010
        - label: 2022 年收入
          value: 1.5
          displayValue: US$1.5b
          unit: revenue
          note: 2022 年公司画像中的公司规模收入视角。
          claimRefs:
            - CM009
        - label: 2026 年第一季度 GPU
          value: 5300
          displayValue: RM5,300
