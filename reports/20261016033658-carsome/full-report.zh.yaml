          note: 来自 2026 年第一季度业绩的当前单位经济视角。
          claimRefs:
            - CM015
    approximationNotes: 各层从宽泛需求背景移向 Carsome 的运营和变现视角。它们按分析逻辑排序，并非数学嵌套的 TAM/SAM/SOM 模型；由于公开证据没有呈现清晰的 SAM，指标有意混合了市场价值、参与度和单位经济。
    claimRefs:
      - CM006
      - CM007
      - CM008
