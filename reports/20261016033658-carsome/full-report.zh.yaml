      - number: '7.3'
        title: 执行依赖与否决标准
        blocks:
          - type: paragraph
            body: >
              Carsome 选择了比纯信息发布市场更难的运营模式。Momentum Works 认为，Carsome 从产品和人才投资转向整合，包括收购 iCar Asia 及其他服务层投资，因为混合 C2B2C
              模式需要更高的资本效率和流量支持。独立摘要还提供了过往裁员、庞大经销商及中心覆盖，以及围绕 Google Cloud
              的技术整合证据；这些都指向一家能够创造杠杆、但必须同时协调实体运营、软件、融资伙伴和收购受众的企业。


              如果这种协调不再产生复合效应，投资论点就会失效。最可监测的触发因素包括再次大规模削减成本、在运营没有同步改善的情况下再次进行外部融资、核心市场融资渗透率或伙伴支持减弱，以及任何影响 Carsome
              Capital、检测标准或所有权转移的监管或消费者保护挑战。因此下一步尽调应测试 Carsome 能否在承担多国运营复杂性的同时维持盈利，而不只是能否在有利的马来西亚和新加坡环境中继续增加毛利润。
            claimRefs:
              - CR002
              - CR006
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
