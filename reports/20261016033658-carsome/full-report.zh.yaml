        title: 持久性、转换摩擦与替代风险
        blocks:
          - type: paragraph
            body: >-
              护城河看起来有意义但并非不可攻破。Carsome
              似乎凭借翻新基础设施、内容漏斗和附属服务形成了真实的运营优势；对于重视透明度、融资和一站式售后支持的消费者及经销商，这些能力应会提高转换摩擦。但指定证据也说明不应夸大其持久性：Forbes 强调了来自 Carro
              的直接竞争，管理层自身披露的市场份额仍然有限，而直接库存模式比纯经纪或信息发布模式需要更严格的资本纪律。如果 OEM 关联或电动车渠道扩大品牌分销，Carsome
              的一体化模式可能面临供应控制更强的参与者带来的新竞争。
