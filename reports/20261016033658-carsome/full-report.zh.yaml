  - id: FE001
    title: 产品架构图
    type: stack
    summary: Carsome 的公开产品堆栈围绕一套一体化二手车工作流，叠加需求生成、检测、翻新、软件自动化和所有权服务。
    data:
      layers:
        - label: 需求与入口界面
          detail: 在整个二手车旅程中同时获取卖家和买家的意向。
          modules:
            - 卖车预约流程
            - 买车门店
            - 内容品牌和汽车媒体界面
          outputs:
            - 预约
            - 列表流量
            - 获客
        - label: 检测与估值
          detail: 建立首个信任检查点，并将库存导向报价、竞价或零售。
          modules:
            - 175 项检测
            - 车况报告
            - 现场报价或经销商竞价
            - 通过 CARSOME Academy 培训检测员
          outputs:
            - 车辆评估
            - 卖家定价路径
            - 可供经销商采购的库存
        - label: 翻新与认证
          detail: 将选定车辆升级为可零售库存，并设置受控的质量检查闸门。
          modules:
            - Certified Lab 翻新
            - 车载诊断
            - 钣金和喷漆流程
            - 最终质检和试驾
          outputs:
            - Carsome Certified 库存
            - 翻新报告
            - 安全 / 舒适度放行决定
        - label: 数据与自动化
          detail: 使用软件和 ML 降低高交易量运营环节的摩擦。
          modules:
            - 车牌遮挡 ML 工作流
            - Airflow 编排的批处理
            - 经销商拍卖推荐引擎
            - 数据卓越中心
          outputs:
            - 隐私保护媒体
            - 更高的检测员生产率
            - 运营决策支持
        - label: 人才与控制能力建设
          detail: 通过培训和标准化运营实践建立可重复性。
          modules:
            - CARSOME Academy
            - JPK RPA 认证
            - 检测员和技术员技能培养链
          outputs:
            - 受训检测团队
            - 标准化运营纪律
        - label: 交易、融资与所有权服务
          detail: 完成交易，并将变现延伸至所有权生命周期服务。
          modules:
            - 所有权转移
            - 通过 CARSOME Capital / 合作伙伴融资
            - 试驾、取车或交付
            - 售后 / 服务中心层
          outputs:
            - 批发销售
            - 零售销售
            - 贷款附加
            - 购后服务
    claimRefs:
      - CE002
      - CE003
      - CE008
      - CE011
      - CE014
      - CE016
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Carsome 的客户闭环从卖家获客开始，经过经销商或库存接入，再借助零售融资和售后服务扩展，而不是一次性交易。
    data:
      items:
        - label: 发现并信任品牌
          actor: 消费者卖家和零售买家
          touchpoints:
            - 品牌认知、市场浏览和内容发现
            - 历史上的早期摩擦主要集中在信任和低认知度
          note: 转化前仍必须先建立认知和信任。
          tone: risk
        - label: 检测并评估车辆
          actor: 消费者卖家
          touchpoints:
            - 卖车流程
            - 检测中心
            - 报价或竞价分流
          note: 直接向消费者采购是 Carsome 库存飞轮的起点。
          tone: neutral
        - label: 经销商竞价或 Carsome 买入
          actor: 经销商和 Carsome 库存团队
          touchpoints:
            - 经销商网络
            - 所有权转移
            - 物流交接
          note: 即使 Carsome 不留存车辆，经销商也能提供流动性。
          tone: neutral
        - label: 翻新并包装库存
          actor: Carsome 运营团队
          touchpoints:
            - Certified Lab
            - 175 项检测
            - 面向展厅的商品化
          note: 翻新支持从批发向更高毛利零售升级。
          tone: positive
        - label: 零售浏览、试驾和购买
          actor: 零售买家
          touchpoints:
            - 体验中心和 Automall
            - 试驾
            - 交付或取车
          note: 公开客户评价显示，多地展厅都有活跃交易。
          tone: positive
        - label: 延伸至融资、服务和重复持有
          actor: 零售买家和服务用户
          touchpoints:
            - 融资
            - 保险续期
            - 服务中心
          note: 扩张潜力明确，但已公布的留存率和附加销售率数据尚未披露。
          tone: opportunity
    approximationNotes: 该顺序根据官方产品界面和第三方渠道描述推断，展示的是渠道流向，而非实测转化率。
    claimRefs:
      - CU001
      - CU004
      - CU009
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: Carsome 当前的风险负荷集中在中高概率敞口；如果一体化模式停止复利，这些风险的影响将达到高或严重。
    data:
      columns:
        - label: 较低概率
          note: 需要新的外部冲击或特定合作伙伴失效。
        - label: 中等概率
          note: 敞口可见，但尚未明确恶化。
        - label: 较高概率
          note: 在保留的 2026 年运营证据中已经可见。
      rows:
        - label: 严重影响
          note: 可能实质损害投资逻辑。
          values:
            - label: —
            - label: 融资 / 合规不透明
              tone: critical
              note: 跨境融资、承保和投诉数据仍未披露。
            - label: 资本密集度 / 融资依赖
              tone: critical
              note: 2026 年 3 月新增股权融资加上此前的债务额度，意味着仍依赖外部资本。
        - label: 高影响
          note: 可能削弱利润率、增长或退出准备度。
          values:
            - label: 云 / 网络安全集中度
              tone: medium
              note: 整合 Google Cloud 在战略上合理，但增加了供应商和控制依赖。
            - label: 合作伙伴退出
              tone: high
              note: 融资伙伴和生态资产对转化和流量都很重要。
            - label: 印度尼西亚 / 泰国信贷走弱
              tone: high
              note: 管理层更新已提示两地信贷环境谨慎。
        - label: 中等影响
          note: 单独可管理，但可能与其他失效累积。
          values:
            - label: 并购整合拖累
              tone: medium
              note: 混合 C2B2C 模式依赖整合按预期奏效。
            - label: 成本纪律压力
              tone: medium
              note: 过往裁员显示，公司走向盈利时面临执行压力。
            - label: 零售流程复杂度
              tone: high
              note: 检测、翻新、过户和保修承诺都要求服务质量稳定。
        - label: 可控但重要影响
          note: 可能可以管理，但仍值得尽调。
          values:
            - label: 展厅 / 中心扩张纪律
              tone: medium
              note: 如果需求走弱，新增实体网点可能稀释利用率。
            - label: 流量资产转化
              tone: medium
              note: 收购或关联的受众仍需转化为盈利交易。
            - label: 成本行动后的留才
              tone: medium
              note: 裁员可以简化成本基础，但也会造成当地执行断层。
        - label: 监控影响
          note: 重要，因为它可能累积成更大失效。
          values:
            - label: 保修 / 售后一致性
              tone: medium
              note: 零售信任取决于所有权和支持承诺能否稳定兑现。
            - label: 数据 / AI 执行回报
              tone: medium
              note: AI 和技术合作应改善运营，而不是增加复杂度。
            - label: 跨境治理成熟度
              tone: medium
              note: 区域版图扩大后，在上市前会提高报告和控制要求。
        - label: 背景影响
          note: 单独看不紧迫，但与运营复杂度累积有关。
          values:
            - label: 品牌延伸过度
              tone: medium
              note: 多个品牌以及培训 / 资本周边业务扩大了管理范围。
            - label: 市场碎片化持续
              tone: medium
              note: 如果任何市场的标准变弱，二手车信任问题可能重现。
            - label: 实体布局固定成本
              tone: medium
              note: 区域中心和展厅形成需要稳定吞吐量支撑的成本承诺。
    approximationNotes: 该热力图综合保留证据，并非统计估算的损失模型。
    claimRefs:
      - CR002
      - CR004
      - CR006
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
      - CR012
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 规模和盈利改善支持继续尽调，但 2026 年定价未披露，因此判断仍是跟踪 / 继续研究。
    data:
      nodes:
        - id: scale
          label: 规模化平台
          detail: 2021 年已披露年化交易量超过 100,000 辆、收入约 10 亿美元。
          claimRefs:
            - CV005
        - id: economics
          label: 经济性改善
          detail: 公开来源描述了 2024 年盈利以及 2025 年 EBITDA 动能增强。
          claimRefs:
            - CV011
            - CV012
        - id: moat
          label: 一体化生态
          detail: Carsome 覆盖内容、检测、过户、融资和周边服务。
          claimRefs:
            - CV013
        - id: risk
          label: 仍然资本密集
          detail: 独立评论仍提示运营复杂度、竞争和规模化风险。
          claimRefs:
            - CV016
        - id: price
          label: 当前条款未披露
          detail: 2026 年融资披露了金额和投资者，但没有披露估值或优先权。
          claimRefs:
            - CV006
            - CV007
        - id: decision
          label: 跟踪 / 继续研究
          detail: 在将买入纳入投资判断前，等待当前价格支撑、股权结构表清晰度和经审计证明。
          claimRefs:
            - CV007
            - CV010
    approximationNotes: 有序流程总结决策链，不是估值模型，也不会根据缺失的当前轮次条款推导数值目标。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV011
      - CV012
      - CV013
      - CV016
