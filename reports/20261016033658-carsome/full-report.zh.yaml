              - CV007
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.2'
        title: 评估业务，而非当前价格
        blocks:
          - type: paragraph
            body: >-
              公开证据确实支持将该业务视为真实的规模化平台，而非故事型股票。截至 2021 年 9 月，路透社和 Carsome 自己的公告都称其年化交易超过 100,000 辆汽车、收入约 10
              亿美元；后续运营快照显示每月销售 18,000 辆认证车辆，库存周转显著快于典型经销商。Carsome
              对汽车旅程的控制也超过简单信息发布网站，涵盖内容、检测、转移、融资和附属服务。这些事实支持护城河和退出选择，但如果没有更新的经审计证据和当前轮次条款，本身仍不足以证明应支付高于最近清晰公开估值的价格。
            claimRefs:
              - CV005
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV006
              - CV008
              - CV010
              - CV011
              - CV012
              - CV016
      - number: '8.3'
        title: 情景框架使用里程碑参照，而非同行倍数
        blocks:
          - type: paragraph
            body: >-
              指定资料池不包含独立的 2026 年同行倍数集合或已披露的条款清单，因此本章使用里程碑参照，避免虚假的精确度。乐观情景是 Carsome 2024 至 2025 年的盈利信号真实，2026 年融资是通向更清晰
              IPO 或战略融资窗口的桥梁，公司可以证明在 2022 年 17 亿美元峰值估值或以下进入是合理的。基准情景是，只有当当前估值处于 2021 年和 2022 年公开锚点之间且高级优先权较轻时，Carsome
              才仍具投资价值。悲观情景是，隐藏的升值条款、沉重的优先股堆叠或较弱的现金转化会让下一次外部估值即使在运营进步后仍然下压。
            claimRefs:
              - CV003
              - CV006
              - CV008
              - CV010
              - CV011
              - CV012
              - CV016
      - number: '8.4'
        title: 最终尽调要求与论点破坏因素
        blocks:
          - type: paragraph
            body: >-
              最终尽调清单很具体。第一，取得 2026
              年轮次价格、工具类型、清算优先权结构以及创始人/投资者持股变化；没有这些，公开证据无法支持买入判断。第二，测试盈利叙事是否转化为经审计现金生成和有韧性的信贷表现，而非调整后 EBITDA 表象。第三，明确 IPO
              准备情况：上市地点、时间表、治理升级，以及市场应预期新的一级资本还是以二级交易为主的流动性事件。如果新投资者在条款不透明的情况下仍支付高于 2022
              年峰值估值的价格、融资账本质量恶化，或盈利在经审计披露改善前停滞，投资论点就会失效。
            claimRefs:
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 公开证据支持尽调，而非支持按价买入
            body: Carsome 目前有足够运营证明维持投资资格，但公开证据仍未披露支持立即买入判断所需的当前估值、清算优先权结构或稀释。
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV007
              - CV010
          - type: callout
            title: 最大下行风险是条款不透明，而非缺乏活动
            body: 关键风险是在最新融资公告遗漏当前价格和持股的情况下，按隐藏的优先股堆叠或过时估值支付价格。
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV016
