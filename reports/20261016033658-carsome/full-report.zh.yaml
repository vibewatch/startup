      - number: '7.2'
        title: 监管与财务敞口
        blocks:
          - type: paragraph
            body: >
              监管和财务敞口集中于 Carsome 由融资支持的零售模式。公司材料和独立报道都显示，融资渗透是当前增长杠杆，与金融机构的战略合作是持续的缓释措施，JACCS 是活跃的跨境融资伙伴。同时，TechNode 和
              The Sun 都报道，印度尼西亚和泰国在 2026 年第一季度仍暴露于更谨慎的消费信贷环境，说明 Carsome 运营最强的市场并不能完全代表整个区域覆盖。


              关键尽调问题不是该资料池存在当前执法行动证据，而是缺乏关于各司法辖区牌照、承保结构、投诉和信贷损失表现的一手级公开披露。由于 Carsome
              的价值主张如今包含融资、保险相邻服务和所有权转移支持，牌照、承保质量或合作伙伴连续性的任何弱点都可能同时打击转化、利润率和声誉。在管理层提供国家级合规和组合数据之前，尽管公司可以指出盈利改善和伙伴支持，剩余敞口仍然很高。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
