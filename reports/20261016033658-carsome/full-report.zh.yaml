      - number: '4.3'
        title: 资本充足性、放贷敞口与融资依赖
        blocks:
          - type: paragraph
            body: >-
              指定证据中最清晰的当前资本数据点是 Carsome 于 2026 年 3 月宣布获得超过 30m 美元的战略轮融资，投资方包括 HKIC、Gobi Partners 和 Asia
              Partners，资金用于支持盈利增长以及 AI 和供应链合作。较早的公开证据还显示，自成立以来 Carsome Capital 已发放 US$240m，并截至 2023 年 5 月持有约 US$90m
              融资账本；据报道批发不良贷款率为 0%，零售不良贷款率低于 1%。Carsome
              不只是交易中介，也通过库存和放贷承担资产负债表敞口。但指定公开材料没有披露当前现金、消耗速度、资金可支撑时间、债务到期日、契约余量或 2023 年后的信贷表现。
