  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 这是基于本证据池保留内容，以能力广度和分销或供给控制力为两轴的序数图。
    data:
      xAxis:
        label: 能力广度
        min: 1
        max: 5
        low: 狭窄工作流
        high: 一体化所有权堆栈
        description: Ordinal score from source-backed product and service breadth
        scale: ordinal
      yAxis:
        label: 分销 / 供给控制力
        min: 1
        max: 5
        low: 碎片化获取
        high: 规模化漏斗和供给网络
        description: Ordinal score from evidence-backed demand, dealer, and physical-footprint signals
        scale: ordinal
      points:
        - label: Carsome
          x: 5
          'y': 5
          tone: positive
          detail: 覆盖核心东南亚市场的内容、检测、拍卖、融资、认证零售和售后服务一体化组合。
        - label: Carro
          x: 4
          'y': 4
          tone: medium
          detail: 直接区域同行，二手车市场范围相近，但指定证据池对其周边业务广度的支持更薄弱。
        - label: 传统经销商
          x: 2
          'y': 3
          tone: warning
          detail: 线下库存和成交仍然重要，但在指定证据中，透明度和数字化工作流显得更弱。
        - label: 经销商拍卖现状
          x: 2
          'y': 4
          tone: warning
          detail: 即使供给深，也可能没有面向消费者的所有权服务组合，或 Carsome 式的一体化获客。
        - label: 消费者分类信息 / DIY 卖车
          x: 1
          'y': 1
          tone: adverse
          detail: 低中介化的发现选项，但买卖双方仍要自行承担检测、文书和信任成本。
        - label: OEM / EV 新进入者
          x: 3
          'y': 2
          tone: medium
          detail: 如果制造商推动品牌渠道和融资，EV 分销与服务可能扩大相邻竞争。
    approximationNotes: 序数坐标综合保留的定性证据所反映的相对范围和分销控制力，并非声称来源提供了基准分数。
    claimRefs:
      - CP002
      - CP004
      - CP009
      - CP011
      - CP013
      - CP014
  - id: FI001
    title: 收入模式桥接图
    type: flow
