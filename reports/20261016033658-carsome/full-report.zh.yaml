            body: >-
              客户工作流始于在线预约和免费 175 点检测，官方市场页面称该检测约需 30 分钟。随后 Carsome 将库存分流至经销商竞价或自营零售路径；在零售路径中，信息页展示 360 度图像、瑕疵和整备报告。独立的
