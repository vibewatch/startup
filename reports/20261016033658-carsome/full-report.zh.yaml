  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序图景
        blocks:
          - type: paragraph
            body: >
              最高确定性的风险并非 Carsome
              缺乏运营势头，而是其一体化模式如今需要在多个东南亚市场同时控制融资、所有权转移、检测、翻新、库存和附属服务。官方公司材料描述了涵盖内容、检测、转移、融资和培训的端到端服务栈，而 2026
              年运营更新显示，盈利能力通过更强融资渗透和更严格库存执行得到改善。这种组合具有战略价值，但也意味着监管松懈、合作伙伴不稳定或执行错误可能同时传导至多个收入驱动因素，而不是局限于单一市场功能。


              第二大风险是，报告的盈利是真实的，但相对于 Carsome 的规模和资本需求仍处于早期。2025 财年 EBITDA 翻倍以上至 23m 美元，2026 年第一季度 EBITDA 达到 29m
              马来西亚林吉特，但公司仍于 2026 年 3 月筹得超过 30m
              美元，历史摘要也指向持续的债务额度和运营放贷。这种模式表明业务正进入更具韧性的阶段，但尚未证明在信贷周期走弱时，增长、营运资本需求和融资能力仍可自我供资。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR007
              - CR012
