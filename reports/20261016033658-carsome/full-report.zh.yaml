      - number: '7.4'
        title: 图表
        blocks:
          - type: callout
            title: 最重要的剩余风险
            body: Carsome 的一体化服务栈只有在融资、检测、转移、翻新和伙伴流量能够跨市场协同运作时才是护城河；同一体化也会放大任何合规或执行失败。
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR006
              - CR009
          - type: callout
            title: 必须持续成立的条件
            body: 盈利增长叙事要求融资伙伴持续可用，印度尼西亚和泰国的信贷条件不再进一步恶化，且库存/翻新效率提升继续抵消区域实体基础设施成本。
            calloutType: assumption
            claimRefs:
              - CR003
              - CR004
              - CR006
          - type: callout
            title: 最高优先级尽调要求
            body: 在将融资驱动增长视为持久增长之前，要求提供 Carsome Capital 及任何保险附属业务的司法辖区级牌照、承保伙伴、违约率和投诉数据。
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              本章的估值判断是跟踪/进一步研究，而非买入，因为 Carsome 的运营状况如今看起来比其公开价格发现更成熟。公司披露了持久规模、历史上 13 亿美元的独角兽估值，以及表明投资者持续支持的 2026
              年战略轮融资，但保留的 2026
              年来源均未披露估值、清算优先权或最新融资中包含的稀释。最新公告也未对证券分类或当前持股进行披露，削弱了任何无依据资本结构叙事的可信度。在这种情况下，投资问题与其说是“Carsome
              好不好”，不如说是“投资者能否以合理价格和清晰条款进入”。
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV016
