      - number: '1.3'
        title: 融资历史、规模信号与当前阶段
        blocks:
          - type: paragraph
            body: >-
              Carsome 的融资历史显示，公司曾反复筹资以扩大区域覆盖并深化一体化服务。官方 2021 年 D2 系列公告记录了 1.7 亿美元股权融资及 3,000 万美元信贷额度，并为该轮融资赋予 13
              亿美元估值；官方公司时间线随后记录了 2022 年 2.9 亿美元 E 轮融资及 17 亿美元估值。2026 年证据也显示其仍能获得资本，而非实现新的公开上市：公司于 2026 年 3
              月发布的公告称，Carsome 从 HKIC、Gobi Partners、Asia Partners 及其他支持者处筹得超过 3,000 万美元。运营层面，第三方报道显示 Carsome 在 2026
              年第一季度恢复同比增长，说明公司仍在同时追求盈利和扩张。
            claimRefs:
