        title: 里程碑与未解决的尽调缺口
        blocks:
          - type: paragraph
            body: >-
              里程碑轨迹是连贯的：Carsome 于 2015 年成立，2016 至 2017 年进行区域扩张，通过 Carsome Capital 和购车零售拓宽平台，随后在 2023 至 2024 年实现盈利里程碑，并在
              2025 至 2026
              年继续开展融资和合作活动。本章最薄弱的部分不是身份或产品市场定位，而是治理和融资细节的披露质量。指定来源没有核对累计融资总额，没有给出当前确切员工人数，也没有披露董事会构成或控制权。历史记录中还存在一个真实的不利数据点：第三方报道总结称，Carsome
              在迈向盈利和可能的 IPO 准备过程中，于 2022 年和 2023 年进行了裁员。
