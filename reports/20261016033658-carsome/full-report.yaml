  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Integrated scope spans both transaction sides
        blocks:
          - type: paragraph
            body: >-
              Carsome still presents the product first as an integrated used-car commerce platform rather than a thin
              classifieds surface. Official pages in Indonesia and Thailand, the corporate About page, and investor
              materials all describe the same broad scope: Carsome acquires traffic via content and owned brands,
              converts sellers through inspection and pricing, serves dealers through bidding, and monetizes retail,
              financing, and related ancillary services. That matters because the core differentiation is operational
              depth, not just lead generation. The partner view from 65 Equity reinforces the same thesis by
              highlighting that Carsome keeps an offline layer for inspection, refurbishment, and sales while connecting
              users digitally. The product is therefore best understood as a regional operating system for used-car
              ownership transitions, with different modules serving consumers, dealers, and internal operations.
            claimRefs:
              - CE001
              - CE002
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
