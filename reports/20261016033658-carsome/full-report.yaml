      - number: '5.2'
        title: Workflow control is built around inspection, refurbishment, and QC
        blocks:
          - type: paragraph
            body: >-
              The customer workflow starts with an online booking and a free 175-point inspection that official market
              pages say takes about 30 minutes. Carsome then branches inventory into dealer bidding or into its own
              retail path, where listings expose 360-degree imagery, imperfections, and reconditioning reports.
              Independent 2023 reporting adds operational detail that the current official pages omit: cars moving into
              the Certified Lab went through pre-inspection, mechanical work, body and paint, detailing, and a final QC
              plus test drive, with proprietary onboard diagnostics checking electronic and safety systems. That process
              design is central to the value proposition because Carsome is trying to standardize trust in a category
              where condition uncertainty usually blocks conversion.
            claimRefs:
              - CE003
              - CE004
              - CE008
              - CE009
              - CE010
