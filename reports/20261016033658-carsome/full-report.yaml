              - CP009
              - CP011
              - CP013
              - CP014
      - number: '3.3'
        title: Durability, switching friction, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat looks meaningful but not impregnable. Carsome appears to have real operational advantages from
              its refurbishment infrastructure, content funnel, and ancillary attachments, and those capabilities should
              raise switching friction for both consumers and dealers that value transparency, financing, and
              after-sales support inside one journey. But the assigned evidence also shows why durability should not be
              overstated: Forbes highlights direct competition from Carro, management's own market-share disclosure
              remains modest, and the direct-inventory model requires more capital discipline than a pure broker or
              listings model. If OEM-linked or EV-led channels scale branded distribution, Carsome's integrated model
              could face new competition from players with stronger supply control.
            claimRefs:
              - CP004
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated ownership stack raises buyer and dealer switching friction
            body: >-
              Carsome combines content, inspection, dealer auctions, financing, certified retail, and after-sales
              support in one journey, so it can capture value before, during, and after the vehicle transaction in a way
              single-lot dealers or classifieds substitutes do not match in the assigned evidence.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP011
          - type: callout
            title: Direct-peer pressure is real because regional penetration is still low
            body: >-
              Forbes described head-to-head competition from Carro while Carsome's own interviews framed roughly 150,000
              annual transactions as only about 3% of the regional market, implying fragmentation is still an
              opportunity but also leaves room for rivals to contest share and margins.
            calloutType: risk
            claimRefs:
