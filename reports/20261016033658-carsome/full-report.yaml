        - Requires audited follow-through plus disclosed clean terms.
        - A priced round above the 2022 mark without audited support breaks the case.
      - - Base
        - >-
          Carsome remains profitable but the current mark sits somewhere between the 2021 US$1.3 billion and 2022 US$1.7
          billion anchors.
        - >-
          This supports watch-list status rather than immediate conviction because return math depends on undisclosed
          seniority and dilution.
        - 'Most consistent with today''s evidence mix: improving operations, incomplete term visibility.'
        - Weak cash conversion or widening financing losses would push the case lower.
      - - Bear
        - >-
          The latest financing embeds a hidden step-up, heavy preferences, or a bridge-like structure masking weaker
          market demand.
        - >-
          Even a good business can be a poor late-stage entry if downside protection favors insiders or if the next mark
          resets lower.
        - Undisclosed 2026 pricing, security type, and ownership keep this scenario live.
        - A down-round, delayed IPO, or deterioration in profitability would confirm it.
    notes: >-
      Scenario bands use disclosed milestone references rather than peer multiples because the assigned evidence pool
      does not contain an independent current comparable set or a disclosed 2026 term sheet.
    claimRefs:
      - CV003
      - CV006
      - CV008
      - CV010
      - CV011
      - CV012
      - CV016
