              - CE017
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Operational depth is the product moat
            body: >-
              Carsome's public materials and third-party reporting converge on the same picture: inspection,
              refurbishment, auction, retail presentation, and financing are designed as one controlled workflow rather
              than stitched together from partner handoffs.
            calloutType: strength
            claimRefs:
              - CE001
              - CE008
              - CE014
          - type: callout
            title: Consistency risk grows with every local operating surface
            body: >-
              The same offline-heavy model that creates trust also raises execution burden, because policy localization,
              refurbishment throughput, training, and software controls all have to stay aligned across markets.
            calloutType: risk
            claimRefs:
              - CE006
              - CE007
              - CE017
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and the operating journey
        blocks:
          - type: paragraph
            body: >-
              Carsome's publicly visible customer model spans several linked user groups rather than a single buyer
              persona. The official site and newsroom show separate acquisition and service flows for consumer sellers,
              retail buyers, used-car dealers, and customers who later use financing, insurance, and aftersales
              services. Third-party reporting adds the seller-side and dealer mechanics: most inventory is sourced
              directly from consumers, while dealers still matter as a large auction liquidity pool. This creates a
              durable operating advantage if Carsome can keep conversion high across each step, but it also means
              customer health cannot be judged from one topline count alone because the company does not publish
              segment-level retention or revenue contribution by user cohort.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU009
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU009
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU004
              - CU009
              - CU013
      - number: '6.2'
        title: Adoption signals point to scale, but denominators remain thin
        blocks:
          - type: paragraph
            body: >-
              The available evidence suggests Carsome is well beyond pilot stage. Across 2020 to 2026 sources, public
              metrics move from 70,000 annualized transactions and US$600 million in value to 260,000 completed
              transactions, more than 18,000 cars sold per month, large dealer coverage, and continued showroom
              expansion in 2026. That said, the sources do not use a single audited denominator: visitor counts differ
              across sources, some growth statistics are company or partner statements, and the company does not
              disclose how many active retail buyers, repeat sellers, or financed customers sit behind these numbers.
              The result is clear adoption breadth but only partial visibility into customer quality and durability.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU013
      - number: '6.3'
        title: Public proof of real retail usage is strongest at showroom/test-drive level
        blocks:
          - type: paragraph
            body: >-
              Named customer proof in this pool is concentrated in Carsome-controlled evidence, especially the current
              homepage's dated retail testimonials across multiple Malaysian showrooms. Those reviews, plus independent
              reporting on PJ Automall pickup and test-drive behavior, are enough to support production consumer usage
              rather than a purely promotional logo wall. They are less persuasive on renewal and advocacy: the proof is
              recent and geographically broad, but it is not independently sampled, does not disclose order volume per
              showroom, and does not show whether satisfied buyers later use financing, aftersales, or trade-in loops.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU015
      - number: '6.4'
        title: Durability is the biggest public evidence gap
        blocks:
          - type: paragraph
            body: >-
              Carsome has enough evidence to show demand and operational reach, but not enough to prove customer
              durability at investor diligence depth. No retained source gives NRR, GRR, churn, renewal rate,
              repeat-purchase frequency, cohort retention, or top-customer/top-dealer concentration. The adverse
              evidence in this pool is indirect rather than customer-led: early brand-trust barriers were meaningful,
              and later layoffs suggest management prioritized profitability discipline, but there is still no clear
              public record of whether customer economics improved through higher retention, better acquisition
              efficiency, or just cost control. That leaves concentration and retention as open diligence items before
              strong conclusions on expansion durability.
            claimRefs:
              - CU011
              - CU012
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Multi-sided customer mix lowers reliance on a single acquisition motion
            body: >-
              Carsome is not relying on one buyer segment: public evidence shows consumer sourcing, dealer liquidity,
              retail buyers, and post-sale finance or service surfaces all feeding the same operating system.
            calloutType: strength
            claimRefs:
              - CU001
              - CU004
              - CU009
          - type: callout
            title: Public demand proof is stronger than public durability proof
            body: >-
              Scale and channel breadth are visible, but the retained evidence still does not disclose churn, cohorts,
              repeat purchase, renewal behavior, or top-customer concentration, which limits confidence in expansion
              quality.
            calloutType: risk
            claimRefs:
              - CU013
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >
              The highest-conviction risk is not that Carsome lacks operating momentum, but that its integrated model
              now requires simultaneous control of financing, ownership transfer, inspection, refurbishment, inventory,
              and ancillary services across several Southeast Asian markets. Official company materials describe an
              end-to-end stack spanning content, inspection, transfer, financing, and training, while 2026 operating
              updates show profitability improving through stronger financing penetration and tighter inventory
              execution. That combination is strategically valuable, but it also means that regulatory slippage, partner
              instability, or execution mistakes can propagate across multiple revenue drivers at once rather than
              remaining isolated to a single marketplace function.


              The second major risk is that reported profitability is real but still early relative to Carsome's scale
              and capital needs. FY2025 EBITDA more than doubled to USD 23 million and Q1 2026 EBITDA reached MYR 29
              million, yet the company still raised more than USD 30 million in March 2026 and historical summaries
              point to continued debt facilities and operational lending. That pattern suggests the business is moving
              into a more resilient phase without yet proving that growth, working-capital needs, and financing capacity
              can remain self-funding through a weaker credit cycle.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR007
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.2'
        title: Regulatory and financial exposure
        blocks:
          - type: paragraph
            body: >
              Regulatory and financial exposure is concentrated around Carsome's financing-enabled retail model.
              Company-issued materials and independent coverage both show financing penetration as a current growth
              lever, strategic partnerships with financial institutions as a recurring mitigation, and JACCS as an
              active cross-border financing partner. At the same time, TechNode and The Sun both reported that Indonesia
              and Thailand remained exposed to a more cautious consumer-credit backdrop in Q1 2026, indicating that
              Carsome's strongest operating markets are not fully representative of the entire regional footprint.


              The key diligence problem is not evidence of a current enforcement action in this source pool; it is the
              absence of primary-tier public disclosure on licenses, underwriting structure, complaints, and credit-loss
              performance by jurisdiction. Because Carsome's value proposition now includes financing,
              insurance-adjacent services, and ownership-transfer support, any weakness in licensing, underwriting
              quality, or partner continuity could hit conversion, margins, and reputation together. Until management
              provides country-level compliance and portfolio data, the residual exposure remains high even though the
              company can point to improving profitability and partner support.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR012
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR007
              - CR012
              - CR014
      - number: '7.3'
        title: Execution dependencies and kill criteria
        blocks:
          - type: paragraph
            body: >
              Operationally, Carsome has chosen a harder model than a pure listing marketplace. Momentum Works argued
              that Carsome moved from product and talent investment into consolidation, including the iCar Asia
              acquisition and other service-layer investments, because the hybrid C2B2C model needed better capital
              efficiency and traffic support. Independent summaries add evidence of past layoffs, substantial dealer and
              center footprints, and technology consolidation around Google Cloud, all of which point to a business that
              can create leverage but must coordinate physical operations, software, financing partners, and acquired
              audiences at the same time.


              The investment thesis breaks if that orchestration stops compounding. The most monitorable triggers are
              renewed large-scale cost cuts, another external capital raise without parallel operating improvement,
              weakening financing penetration or partner support in core markets, and any regulatory or
              consumer-protection challenge affecting Carsome Capital, inspection standards, or ownership transfer. The
              next diligence step should therefore be to test whether Carsome can sustain profitability while carrying
              multi-country operating complexity, not simply whether it can keep growing gross profit in supportive
              Malaysian and Singaporean conditions.
            claimRefs:
              - CR002
              - CR006
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR008
              - CR010
              - CR011
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Most important residual risk
            body: >-
              Carsome's integrated stack is a moat only if financing, inspection, transfer, refurbishment, and partner
              traffic keep working together across markets; the same integration amplifies any compliance or execution
              failure.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR006
              - CR009
          - type: callout
            title: What must remain true
            body: >-
              The profitable-growth narrative requires financing partnerships to stay available, Indonesia and Thailand
              credit conditions not to deteriorate further, and inventory/refurbishment efficiency gains to continue
              offsetting the cost of regional physical infrastructure.
            calloutType: assumption
            claimRefs:
              - CR003
              - CR004
              - CR006
          - type: callout
            title: Highest-priority diligence ask
            body: >-
              Request jurisdiction-level licensing, underwriting-partner, default-rate, and complaint data for Carsome
              Capital and any insurance attachments before treating financing-led growth as durable.
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The chapter's valuation call is track / research-more, not buy, because Carsome's operating profile now
              looks more mature than its public price discovery. The company has disclosed durable scale, a historical
              US$1.3 billion unicorn mark, and a 2026 strategic round that signaled continuing investor support, but
              none of the retained 2026 sources disclose the valuation, liquidation preferences, or dilution embedded in
              the latest capital raised. The newest announcement also does not classify the security or disclose current
              ownership, which weakens confidence in any unsupported cap-table narrative. In this setup, the investment
              question is less "is Carsome good?" than "can an investor still enter at a sensible price with clean
              terms?"
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV008
              - CV010
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV007
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.2'
        title: Underwriting the business, not the current price
        blocks:
          - type: paragraph
            body: >-
              Public evidence does support the business as a real scaled platform rather than a story stock. By
              September 2021, Reuters and Carsome's own release both described more than 100,000 cars transacted on an
              annualized basis and around US$1 billion of revenue, and later operating snapshots pointed to 18,000
              certified-car sales per month, materially faster inventory turns than typical dealers. Carsome also
              controls more of the automotive journey than a simple listings site, spanning content, inspections,
              transfer, financing, and ancillary services. Those facts support moat and exit optionality, but they still
              do not by themselves justify paying above the last clean public marks without updated audited proof and
              current-round terms.
            claimRefs:
              - CV005
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV006
              - CV008
              - CV010
              - CV011
              - CV012
              - CV016
      - number: '8.3'
        title: Scenario framing uses milestone references, not peer multiples
        blocks:
          - type: paragraph
            body: >-
              The assigned source pool does not contain an independent 2026 peer-multiple set or a disclosed term sheet,
              so the chapter uses milestone references instead of false precision. The bullish case is that Carsome's
              2024-2025 profitability signals are real, the 2026 raise is a bridge into a cleaner IPO or strategic
              financing window, and the company can justify an entry at or below the 2022 US$1.7 billion peak mark. The
              base case is that Carsome remains investable only if the current mark sits between the 2021 and 2022
              public anchors with light senior preferences. The bear case is that a hidden step-up, heavy preferences,
              or weak cash conversion means the next outside mark compresses despite operational progress.
            claimRefs:
              - CV003
              - CV006
              - CV008
              - CV010
              - CV011
              - CV012
              - CV016
      - number: '8.4'
        title: Final diligence asks and thesis breakers
        blocks:
          - type: paragraph
            body: >-
              The final diligence list is specific. First, obtain the 2026 round price, instrument type, liquidation
              stack, and founder / investor ownership changes; without those, public evidence cannot support a buy
              call.       Second, test whether the profitability narrative converts into audited cash generation and
              resilient credit performance rather than adjusted EBITDA optics. Third, clarify IPO readiness: listing
              venue, timeline, governance upgrades, and whether the market should expect fresh primary capital or a
              secondary-led liquidity event. The thesis breaks if a new investor still pays above the 2022 peak mark
              despite opaque terms, if financing-book quality deteriorates, or if profitability stalls before audited
              disclosure improves.
            claimRefs:
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence supports diligence, not a priced buy
            body: >-
              Carsome now has enough operating proof to stay investable, but public evidence still does not disclose the
              current mark, liquidation stack, or dilution needed to support an immediate buy call.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV007
              - CV010
          - type: callout
            title: The biggest downside is term opacity, not lack of activity
            body: >-
              The critical risk is paying through a hidden preference stack or a stale mark while the latest financing
              announcement omits current price and ownership.
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV016
