      - number: '1.2'
        title: Founders, leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The public leadership picture remains founder-centered. Carsome's newsroom identifies co-founder Eric
              Cheng as chairman and group CEO, while Teoh Jiun Ee remains attached to the platform through Carsome
              Academy and Eric Chan now runs regional operations as president and COO. That supports the view that the
              company's operating identity still depends materially on a relatively concentrated senior team around the
              founders and a small number of named executives. Governance visibility is thinner than operating
              visibility, however: the assigned pool supports current management titles and a notable 2024
              finance-leadership transition, but it does not provide a current board roster, ownership percentages, or
              explicit independent-director structure.
