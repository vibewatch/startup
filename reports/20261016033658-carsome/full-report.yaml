chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and operating model
        blocks:
          - type: paragraph
            body: >-
              Carsome presents itself as Southeast Asia's largest integrated car e-commerce platform, focused on
              digitizing the used-car transaction and ownership journey across Malaysia, Indonesia, Thailand, and
              Singapore. The official company pages consistently describe an end-to-end model that combines inspection,
              ownership transfer, financing, and retail buying flows rather than a narrow classifieds marketplace. Scale
              disclosures are meaningful but still selective: the official about-us page says Carsome now operates 80+
              centers across 50+ cities and serves a 13,000+ dealer network, while current headcount remains imprecise
              because the assigned pool only includes a broad third-party range rather than a management-disclosed
              employee count.
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO009
              - CO010
