  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Carsome's public product stack layers demand generation, inspection, refurbishment, software automation, and
      ownership services around one integrated used-car workflow.
    data:
      layers:
        - label: Demand and entry surfaces
          detail: Acquire both seller and buyer intent across the used-car journey.
          modules:
            - Sell-car booking flow
            - Buy-car storefront
            - Content brands and automotive media surfaces
          outputs:
            - Appointments
            - Listings traffic
            - Lead generation
        - label: Inspection and valuation
          detail: Create the first trust checkpoint and route inventory into offer, bidding, or retail.
          modules:
            - 175-point inspection
            - Condition report
            - On-the-spot offer or dealer bidding
            - Inspector training via CARSOME Academy
          outputs:
            - Vehicle assessment
            - Seller price path
            - Dealer-ready inventory
        - label: Refurbishment and certification
          detail: Upgrade selected cars into retail-ready stock with controlled QA gates.
          modules:
            - Certified Lab refurbishment
            - Onboard diagnostics
            - Body and paint process
            - Final QC and test drive
          outputs:
            - Carsome Certified inventory
            - Reconditioning report
            - Safety/comfort release decision
        - label: Data and automation
          detail: Use software and ML to reduce friction in high-volume operational steps.
          modules:
            - Plate-masking ML workflow
            - Airflow-orchestrated batch processing
            - Dealer auction recommendation engine
            - Data Center of Excellence
          outputs:
            - Privacy-protected media
            - Higher inspector productivity
            - Operational decision support
        - label: Talent and control enablement
          detail: Build repeatability through training and standardized operating practices.
          modules:
            - CARSOME Academy
            - JPK RPA accreditation
            - Inspector and technician skill pipeline
          outputs:
            - Trained inspection workforce
            - Standardized operating discipline
        - label: Transaction, financing, and ownership services
          detail: Close the transaction and extend monetization into ownership lifecycle services.
          modules:
            - Ownership transfer
            - Financing via CARSOME Capital / partners
            - Test drive, pickup, or delivery
            - Aftersales / service-centre layer
          outputs:
            - Wholesale sale
            - Retail sale
            - Loan attachment
            - Post-purchase service
    claimRefs:
      - CE002
      - CE003
      - CE008
      - CE011
      - CE014
      - CE016
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Carsome's customer loop starts with seller acquisition, flows through dealer or inventory intake, and expands via
      retail financing and aftersales rather than a single one-time transaction.
    data:
      items:
        - label: Discover and trust the brand
          actor: Consumer seller and retail buyer
          touchpoints:
            - Brand awareness, marketplace browsing, and content discovery
            - Early friction historically centered on trust and low awareness
          note: Awareness and trust building remain prerequisite steps before conversion.
          tone: risk
        - label: Inspect and value the vehicle
          actor: Consumer seller
          touchpoints:
            - Sell-car flow
            - Inspection centres
            - Offer or bid routing
          note: Direct consumer sourcing is the start of Carsome's inventory flywheel.
          tone: neutral
        - label: Dealer bidding or Carsome purchase
          actor: Dealers and Carsome inventory team
          touchpoints:
            - Dealer network
            - Ownership transfer
            - Logistics handoff
          note: Dealers provide liquidity even when Carsome does not keep the vehicle.
          tone: neutral
        - label: Recondition and merchandise inventory
          actor: Carsome operations
          touchpoints:
            - Certified Lab
            - 175-point inspection
            - Showroom-ready merchandising
          note: Reconditioning supports the step-up from wholesale to higher-margin retail.
