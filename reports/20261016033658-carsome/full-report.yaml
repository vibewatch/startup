              - CP014
      - number: '3.2'
        title: Differentiation by capability, packaging, and distribution
        blocks:
          - type: paragraph
            body: >-
              Carsome's differentiation is less about a single listing surface and more about stitching multiple profit
              pools into one workflow. Official pages and management interviews describe an end-to-end proposition
              spanning inspection, ownership transfer, financing, certified retail, ancillary services, and the media
              properties that capture customers before the transaction starts. That makes the comparison with
              traditional dealers or classifieds asymmetric because those alternatives may still compete on local supply
              or price, but they do not appear in the assigned evidence with the same combination of lead generation,
              refurbishment, dealer auctions, and post-sale services. The result is a stronger distribution and
              conversion engine, not merely a better marketplace UX.
            claimRefs:
              - CP002
              - CP005
