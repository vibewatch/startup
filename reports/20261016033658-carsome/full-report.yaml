        title: Milestones and unresolved diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The milestone arc is coherent: Carsome moved from founding in 2015, to regional expansion in 2016-2017, to
              platform broadening through Carsome Capital and buy-car retail, and then to profitability milestones in
              2023-2024 with further funding and partnership activity in 2025-2026. The weakest parts of the chapter are
