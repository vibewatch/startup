              The assigned sources do not reconcile lifetime capital raised, do not give a current exact employee count,
              and do not disclose board composition or control rights. There is also a real adverse datapoint in the
              historical record: third-party coverage summarized layoffs in 2022 and 2023 as Carsome pushed toward
