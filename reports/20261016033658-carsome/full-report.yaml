            body: >-
              Public evidence consistently points to a stack that spans sourcing, inspection, wholesale, retail,
              financing, and aftersales, which can support higher lifetime monetization than a pure classifieds model
              but also makes margin quality more balance-sheet sensitive.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI010
              - CI011
          - type: callout
            title: Profitability messaging is ahead of public disclosure depth
            body: >-
              Carsome's current public story emphasizes profitable growth and a fresh 2026 capital raise, but the
              assigned evidence still lacks audited current cash, burn, debt-maturity, segment-mix, and up-to-date
              credit-performance data needed for clean underwriting.
            calloutType: risk
            claimRefs:
