      - number: '4.2'
        title: Public traction and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              The assigned pool offers enough public data to show operational scale, but not enough to fully underwrite
              revenue quality. A 2023 field report said Carsome was selling over 18,000 Carsome Certified cars per
              month, generated US$1.5 billion of revenue in 2022, and drew 15 million monthly unique visitors; a 2026
              company-profile aggregator separately described the business as transacting around 100,000 cars annually.
              The most useful working-capital proxy is inventory velocity: the same 2023 field report quoted management
              as holding retail inventory for around 20 days and wholesale inventory for around 7 days, versus more than
              30 days for the industry. Those are encouraging public signals, but they are not substitutes for cohort
              gross-margin disclosure, reconditioning cost per unit, realized take rates, or geography and segment mix.
            claimRefs:
