  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Carsome sits inside the used-car transaction and ownership workflow rather than in a single classifieds
              niche. The company and third-party profiles consistently describe an integrated stack that combines
              discovery, inspection, valuation, ownership transfer, financing, and ancillary services for both consumers
              and used-car dealers. That boundary matters because the core substitute is not one software vendor; it is
              the fragmented offline market of informal dealer networks, manual paperwork, and classified listings where
              price discovery and vehicle-condition trust remain weak. In other words, Carsome is trying to digitize
              several linked jobs in one sequence, which makes the relevant comparison a multi-step transaction journey
              instead of an ad-supported lead-generation market alone.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM007
      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not justify a precise TAM/SAM/SOM stack, so the most defensible approach is to
              separate a broad market lens from Carsome-specific monetization lenses. DollarsAndSense cites a US$131
              billion Southeast Asian used-car market growing 10.6% over 2023E-2025E, which supports the existence of a
              large demand pool but does not disclose its original methodology or country mix. The rest of the public
              evidence is company-scale: 2022 revenue of US$1.5 billion, more than US$1.7 billion of annualized
              transaction value by August 2022, and stronger 2026 unit economics via gross profit and GPU expansion.
              Those data points show that Carsome has built a meaningful operating footprint, but they should not be
              mistaken for a clean serviceable market estimate.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM014
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM015
      - number: '2.3'
        title: Buyer, user, payer, and budget ownership
        blocks:
          - type: paragraph
            body: >-
              The platform serves multiple economic actors in the same marketplace. Private sellers are the supply-side
              user at the start of the workflow, using Carsome for inspection, valuation, and a faster sale path; buyers
              use the retail layer for trust, warranty, and financing; and dealers use the wholesale channel to
              replenish inventory without independently inspecting every vehicle. The payer therefore changes by step:
              households absorb the car-purchase budget, dealerships fund inventory purchases, and lenders finance
              conversion when the embedded credit offer closes affordability gaps. The importance of financing is
              explicit in 2026 management commentary, which tied institutional facilities to Carsome's ability to
              support buyer and dealer transactions across the region.
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM013
      - number: '2.4'
        title: Adoption drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              The most consistent adoption drivers in the assigned pool are affordability, convenience, and trust.
              Carsome's 2026 commentary argues that used-car demand stays resilient when consumers become more
              deliberate, while the integrated workflow reduces paperwork friction and uncertainty over vehicle
              condition. A newer growth vector is the expected increase in used EV supply, which could expand the
              addressable inventory pool if condition assessment and resale confidence improve with it. The main
              constraint is that demand conditions are not uniform across markets: Carsome specifically flagged
              Indonesia and Thailand as more variable because of macro pressure and cautious consumer credit conditions.
              That makes financing availability and credit quality a gating variable, not just a helpful add-on.
            claimRefs:
              - CM004
              - CM011
              - CM012
              - CM013
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The market boundary is workflow-first, not media-first
            body: >-
              Carsome's relevant market spans sourcing, inspection, transfer, financing, and retail/wholesale
              conversion, so valuation should be anchored on multi-step transaction control rather than on
              lead-generation traffic alone.
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM007
          - type: callout
            title: Public SAM precision is still weak
            body: >-
              The public record offers a broad regional demand lens and several company operating lenses, but it still
              does not expose a clean country-level revenue split or budget-owner-by-segment model, which limits
              precision when underwriting market share assumptions.
            calloutType: risk
            claimRefs:
              - CM008
              - CM009
              - CM010
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitute set
        blocks:
          - type: paragraph
            body: >-
              Carsome is not competing only with another online used-car marketplace. The assigned evidence supports a
              layered landscape that includes a direct regional peer in Carro, incumbent used-car dealers that still own
              local inventory and relationships, consumer classifieds or self-managed sales that keep inspection and
              paperwork with the buyer and seller, and adjacent OEM or EV-led channels that can pull demand into branded
              distribution. That breadth matters because Carsome's disclosed regional scale is still early relative to
              the market it is trying to organize, so competitive pressure comes both from scaled digital peers and from
              the fragmented status quo it is trying to replace.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP006
              - CP010
              - CP013
          - type: table
            tableRef: TP001
