      - number: '1.3'
        title: Funding history, scale signals, and current stage
        blocks:
          - type: paragraph
            body: >-
              Carsome's financing history shows a company that has repeatedly raised capital to expand its regional
              footprint and deepen its integrated services. The official 2021 Series D2 announcement documented US$170
              million of equity plus US$30 million of credit facilities and attached a US$1.3 billion valuation to that
              round, while the official company timeline later recorded a US$290 million Series E in 2022 and a US$1.7
              billion valuation mark. The 2026 evidence also shows continued capital access rather than a new public
              listing: a March 2026 company-distributed announcement said Carsome raised more than US$30 million from
              HKIC, Gobi Partners, Asia Partners, and other backers. Operationally, third-party reporting indicates
              Carsome returned to year-on-year growth in Q1 2026, suggesting the company is still managing for
              profitability and expansion at the same time.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO011
