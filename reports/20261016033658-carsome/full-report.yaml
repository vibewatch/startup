  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization mix
        blocks:
          - type: paragraph
            body: >-
              Carsome's official surfaces position the company as an integrated automotive commerce stack rather than a
              pure classifieds marketplace, spanning car content, inspection, ownership transfer, financing, and other
              ancillary services across Malaysia, Indonesia, Thailand, and Singapore. Public operating descriptions
              indicate that the core monetization engine starts with consumer-sourced inventory, then splits between
              dealer-auction turnover and retail resale through Carsome Certified, with financing, aftersales, and
              media/lead-generation adjacencies layered on top. That matters for underwriting because gross-profit
              quality will depend on the mix between lower-capital marketplace fees and higher-touch inventory,
              refurbishment, and lending activities rather than on one simple SaaS-like revenue stream.
