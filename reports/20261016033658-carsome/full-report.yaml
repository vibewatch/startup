      - number: '5.3'
        title: Technology proof is tangible but selectively disclosed
        blocks:
          - type: paragraph
            body: >-
              Carsome does have productized technical workflows in public evidence, but the proof is uneven. The
              clearest disclosure is the AWS guest post from Carsome data leaders describing an image-processing
              workflow that uses SageMaker Batch Transform plus Airflow orchestration to blur license plates in
              inspection photos, framed explicitly as a privacy and inspector productivity tool. Carsome also said the
              workflow cut masking time from at least one minute per car to 2.4 seconds, which suggests the team can
              operationalize ML inside the inspection stack rather than only in consumer-facing recommendations. Public
              roadmap language remains directionally ambitious instead of architecture-deep: Carsome says it wants
              intelligence embedded across operations, mentions a live dealer auction recommendation engine, and tied
              its 2026 fundraise to AI, data, and next-generation mobility services. That supports a technology-enabled
              operating model, but not a fully disclosed core platform architecture.
            claimRefs:
              - CE011
              - CE012
              - CE015
              - CE016
      - number: '5.4'
        title: Trust controls are visible; control-surface disclosure is not
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows Carsome invests heavily in trust and process control: inspections are standardized,
              certified cars carry explicit retail assurances, more than half of candidate cars were reportedly rejected
              after first inspection, and the Academy plus accredited training infrastructure suggest talent development
              is treated as part of product delivery rather than back-office HR. The same evidence also highlights the
              main product risk: the differentiation depends on operating physical infrastructure and maintaining
              consistent policies across markets. Official market pages already show different retail warranty and
              return terms, and the assigned pool does not verify security certifications, uptime/service levels, or an
              external developer/practitioner signal. For diligence, that means Carsome's quality system is more visible
              than its software-control stack, and the gap is meaningful because scale consistency depends on both.
            claimRefs:
              - CE005
              - CE006
