      - number: '4.3'
        title: Capital adequacy, lending exposure, and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The clearest current capital datapoint in the assigned evidence is Carsome's March 2026 announcement of a
              strategic round of more than USD 30 million from HKIC, Gobi Partners, and Asia Partners, framed as fuel
              for profitable growth plus AI and supply-chain collaboration. Older public evidence also shows Carsome
              Capital had already disbursed US$240 million since inception and carried an approximately US$90 million
              financing book as of May 2023, with reported wholesale NPLs at 0% and retail NPLs below 1%. That
              combination suggests Carsome is not just a transaction intermediary; it also carries balance-sheet
              exposure through inventory and lending. However, the assigned public materials do not disclose current
              cash on hand, burn, runway, debt maturities, covenant headroom, or post-2023 credit performance.
            claimRefs:
              - CI004
              - CI005
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial story is directionally improving: public materials support a broader revenue stack than
              simple commissions, some evidence of faster inventory turns than traditional dealers, and a current
              fundraising event that followed a company-claimed profitability narrative. The underwriting problem is
              disclosure depth. Public funding tallies already diverge across third-party aggregators because one
              summary counts US$759.0 million across 8 rounds while another says Carsome had secured over US$808 million
              across 16 rounds including debt financings, and Grokipedia also reports layoffs in 2022 and 2023 during
              the path to profitability. Until diligence receives management-certified cash, debt, gross-margin, and
              lending-book data, the correct view is that Carsome looks financially more mature than a
              growth-at-all-costs marketplace, but still cannot be fully underwritten from public sources.
            claimRefs:
              - CI012
              - CI014
              - CI015
