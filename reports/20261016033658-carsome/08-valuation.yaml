artifact: valuation
slug: carsome
runDate: 2026-10-16
company:
  name: Carsome
chapter:
  number: 8
  title: Valuation
  summary: >-
    Carsome has enough public operating proof to merit continued diligence, but
    the current entry price is still not underwritten by public evidence. The
    strongest valuation anchors in the assigned pool are the historical
    US$1.3 billion mark from 2021, the US$1.7 billion peak mark cited for 2022,
    and a small disclosed >US$30 million strategic round in 2026 that did not
    publish price or preference terms.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The chapter's valuation call is track / research-more, not buy, because
      Carsome's operating profile now looks more mature than its public price
      discovery. The company has disclosed durable scale, a historical
      US$1.3 billion unicorn mark, and a 2026 strategic round that signaled
      continuing investor support, but none of the retained 2026 sources disclose
      the valuation, liquidation preferences, or dilution embedded in the latest
      capital raised. The newest announcement also does not classify the
      security or disclose current ownership, which weakens confidence in any
      unsupported cap-table narrative. In this setup, the investment question
      is less "is Carsome good?" than "can an
      investor still enter at a sensible price with clean terms?"
    claimRefs: [CV003, CV006, CV007, CV008, CV009, CV010, CV016]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: underwriting-the-business-not-the-current-price
    title: Underwriting the business, not the current price
    body: >-
      Public evidence does support the business as a real scaled platform rather
      than a story stock. By September 2021, Reuters and Carsome's own release
      both described more than 100,000 cars transacted on an annualized basis
      and around US$1 billion of revenue, and later operating snapshots pointed
      to 18,000 certified-car sales per month, materially faster inventory turns
      than typical dealers. Carsome also
      controls more of the automotive journey than a simple listings site,
      spanning content, inspections, transfer, financing, and ancillary
      services. Those facts support moat and exit optionality, but they still do
      not by themselves justify paying above the last clean public marks without
      updated audited proof and current-round terms.
    claimRefs: [CV005, CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV003]
  - id: scenario-framing-uses-milestone-references
    title: Scenario framing uses milestone references, not peer multiples
    body: >-
      The assigned source pool does not contain an independent 2026 peer-multiple
      set or a disclosed term sheet, so the chapter uses milestone references
      instead of false precision. The bullish case is that Carsome's 2024-2025
      profitability signals are real, the 2026 raise is a bridge into a cleaner
      IPO or strategic financing window, and the company can justify an entry at
      or below the 2022 US$1.7 billion peak mark. The base case is that Carsome
      remains investable only if the current mark sits between the 2021 and 2022
      public anchors with light senior preferences. The bear case is that a
      hidden step-up, heavy preferences, or weak cash conversion means the next
      outside mark compresses despite operational progress.
    claimRefs: [CV003, CV006, CV008, CV010, CV011, CV012, CV016]
  - id: final-diligence-asks-and-thesis-breakers
    title: Final diligence asks and thesis breakers
    body: >-
      The final diligence list is specific. First, obtain the 2026 round price,
      instrument type, liquidation stack, and founder / investor ownership
      changes; without those, public evidence cannot support a buy call.       Second, test whether the profitability narrative converts into audited
      cash generation and resilient credit performance rather than adjusted
      EBITDA optics. Third, clarify IPO readiness: listing venue, timeline, governance
      upgrades, and whether the market should expect fresh primary capital or a
      secondary-led liquidity event. The thesis breaks if a new investor still
      pays above the 2022 peak mark despite opaque terms, if financing-book
      quality deteriorates, or if profitability stalls before audited disclosure
      improves.
    claimRefs: [CV007, CV009, CV010, CV011, CV012, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Decision element
      - Current view
      - Decision implication
    rows:
      - ["Recommendation", "Track / research-more", "Continue diligence, but do not underwrite a buy until current pricing and terms are disclosed."]
      - ["Confidence", "Medium", "Business quality is supported better than the current entry price."]
      - ["Risk rating", "Medium-high", "Execution is improving, but valuation opacity and capital intensity still dominate downside."]
      - ["Valuation stance", "Public price support is insufficient", "Historical marks help frame entry discipline, but they do not prove the 2026 round was fair."]
      - ["Entry discipline", "Only lean constructive at or below the last clean public mark with light preferences", "A hidden step-up or heavy liquidation stack would move the call toward pass."]
    notes: >-
      Decision rows use only retained public milestone references; the assigned
      pool does not disclose the 2026 round valuation, preference stack, or
      secondary terms.
    claimRefs: [CV003, CV006, CV007, CV008, CV010, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Argument
      - What would change the view
    rows:
      - ["Thesis", "Scale proof exists: Carsome disclosed >100,000 annualized cars and around US$1 billion revenue by September 2021.", "Sustained audited growth and cash conversion would strengthen underwriting confidence."]
      - ["Thesis", "The model appears to create operational leverage via faster inventory turns, integrated financing, and ecosystem breadth.", "Verified FY25/FY26 unit economics and financing-book quality would justify tighter valuation bands."]
      - ["Anti-thesis", "Current price discovery is opaque: the 2026 raise disclosed amount and investors, but not valuation or preference terms.", "A disclosed valuation, clean share class, and modest preference stack would reduce this concern."]
      - ["Anti-thesis", "Current pricing and ownership remain undisclosed, while independent commentary still flags capital intensity and profitability risk.", "A complete cap table plus audited profitability would narrow the discount for uncertainty."]
    notes: >-
      Thesis and anti-thesis rows intentionally separate business quality from
      price support; the chapter's gating issue is current entry clarity, not
      whether Carsome has built a meaningful business.
    claimRefs: [CV005, CV007, CV009, CV010, CV013, CV014, CV015, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - ["Bull", "FY24-FY25 profitability proves durable, the 2026 round was priced at or below the 2022 peak mark, and preferences are light.", "A disciplined entry at or below the last public peak could preserve upside into an IPO or strategic-liquidity window.", "Requires audited follow-through plus disclosed clean terms.", "A priced round above the 2022 mark without audited support breaks the case."]
      - ["Base", "Carsome remains profitable but the current mark sits somewhere between the 2021 US$1.3 billion and 2022 US$1.7 billion anchors.", "This supports watch-list status rather than immediate conviction because return math depends on undisclosed seniority and dilution.", "Most consistent with today's evidence mix: improving operations, incomplete term visibility.", "Weak cash conversion or widening financing losses would push the case lower."]
      - ["Bear", "The latest financing embeds a hidden step-up, heavy preferences, or a bridge-like structure masking weaker market demand.", "Even a good business can be a poor late-stage entry if downside protection favors insiders or if the next mark resets lower.", "Undisclosed 2026 pricing, security type, and ownership keep this scenario live.", "A down-round, delayed IPO, or deterioration in profitability would confirm it."]
    notes: >-
      Scenario bands use disclosed milestone references rather than peer
      multiples because the assigned evidence pool does not contain an
      independent current comparable set or a disclosed 2026 term sheet.
    claimRefs: [CV003, CV006, CV008, CV010, CV011, CV012, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Scale and improving profitability support diligence, but undisclosed 2026
      pricing keeps the call at track / research-more.
    data:
      nodes:
        - id: scale
          label: "Scaled platform"
          detail: ">100,000 annualized cars and around US$1 billion revenue were already disclosed in 2021."
          claimRefs: [CV005]
        - id: economics
          label: "Economics improving"
          detail: "Public sources describe 2024 profitability and stronger 2025 EBITDA momentum."
          claimRefs: [CV011, CV012]
        - id: moat
          label: "Integrated ecosystem"
          detail: "Carsome spans content, inspection, transfer, financing, and ancillary services."
          claimRefs: [CV013]
        - id: risk
          label: "Still capital intensive"
          detail: "Independent commentary still flags operational complexity, competition, and scaling risk."
          claimRefs: [CV016]
        - id: price
          label: "Current terms undisclosed"
          detail: "The 2026 raise disclosed amount and investors, but not valuation or preferences."
          claimRefs: [CV006, CV007]
        - id: decision
          label: "Track / research-more"
          detail: "Wait for current price support, cap-table clarity, and audited proof before underwriting a buy."
          claimRefs: [CV007, CV010]
    approximationNotes: >-
      Ordered flow summarizes the decision chain; it is not a valuation model
      and does not infer a numerical target from missing current-round terms.
    claimRefs: [CV005, CV006, CV007, CV011, CV012, CV013, CV016]
callouts:
  - calloutType: recommendation
    title: Public evidence supports diligence, not a priced buy
    body: >-
      Carsome now has enough operating proof to stay investable, but public
      evidence still does not disclose the current mark, liquidation stack, or
      dilution needed to support an immediate buy call.
    claimRefs: [CV006, CV007, CV010]
  - calloutType: risk
    title: The biggest downside is term opacity, not lack of activity
    body: >-
      The critical risk is paying through a hidden preference stack or a stale
      mark while the latest financing announcement omits current price and ownership.
    claimRefs: [CV006, CV007, CV016]
