  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: competitor-pricing-transparency
      missingEvidence: Public price sheets, commission schedules, or discount disclosures for Carro and large incumbent dealer channels by market and product line.
      whyItMatters: Without comparable pricing or take-rate disclosure, the chapter can compare packaging and workflow design but cannot prove sustainable price leadership or undercutting.
      diligencePath: Request current dealer fee cards, consumer quote samples, and market-by-market price books from Carsome and at least one direct peer, then reconcile them against retail and wholesale attachment rates.
      relatedQuestionRefs: [QP008]
      relatedTableRefs: [TP003]
