company:
  name: "Carsome"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Carsome delivers an unusually integrated used-car stack that combines
    inspection, refurbishment, dealer auction, retail merchandising, financing,
    and training across four Southeast Asian markets. Public evidence supports
    the offline-heavy quality system and at least one production ML workflow
    inside inspections, but current disclosure is still thin on security
    certifications, developer-signal proxies, and market-by-market service-term
    harmonization.
sections:
  - id: "integrated-product-scope"
    title: "Integrated scope spans both transaction sides"
    body: >-
      Carsome still presents the product first as an integrated used-car
      commerce platform rather than a thin classifieds surface. Official pages
      in Indonesia and Thailand, the corporate About page, and investor
      materials all describe the same broad scope: Carsome acquires traffic via
      content and owned brands, converts sellers through inspection and pricing,
      serves dealers through bidding, and monetizes retail, financing, and
      related ancillary services. That matters because the core differentiation
      is operational depth, not just lead generation. The partner view from 65
      Equity reinforces the same thesis by highlighting that Carsome keeps an
      offline layer for inspection, refurbishment, and sales while connecting
      users digitally. The product is therefore best understood as a regional
      operating system for used-car ownership transitions, with different
      modules serving consumers, dealers, and internal operations.
    claimRefs: ["CE001", "CE002", "CE014"]
    tableRefs: ["TE001", "TE002"]
  - id: "workflow-and-quality-architecture"
    title: "Workflow control is built around inspection, refurbishment, and QC"
    body: >-
      The customer workflow starts with an online booking and a free
      175-point inspection that official market pages say takes about
      30 minutes. Carsome then branches inventory into dealer bidding or into
      its own retail path, where listings expose 360-degree imagery,
      imperfections, and reconditioning reports. Independent 2023 reporting
      adds operational detail that the current official pages omit: cars moving
      into the Certified Lab went through pre-inspection, mechanical work, body
      and paint, detailing, and a final QC plus test drive, with proprietary
      onboard diagnostics checking electronic and safety systems. That process
      design is central to the value proposition because Carsome is trying to
      standardize trust in a category where condition uncertainty usually blocks
      conversion.
    claimRefs: ["CE003", "CE004", "CE008", "CE009", "CE010"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "technology-maturity-and-differentiation"
    title: "Technology proof is tangible but selectively disclosed"
    body: >-
      Carsome does have productized technical workflows in public evidence, but
      the proof is uneven. The clearest disclosure is the AWS guest post from
      Carsome data leaders describing an image-processing workflow that uses
      SageMaker Batch Transform plus Airflow orchestration to blur license
      plates in inspection photos, framed explicitly as a privacy and inspector
      productivity tool. Carsome also said the workflow cut masking time from
      at least one minute per car to 2.4 seconds, which suggests the team can
      operationalize ML inside the inspection stack rather than only in
      consumer-facing recommendations. Public roadmap language remains
      directionally ambitious instead of architecture-deep:
      Carsome says it wants intelligence embedded across operations, mentions a
      live dealer auction recommendation engine, and tied its 2026 fundraise to
      AI, data, and next-generation mobility services. That supports a
      technology-enabled operating model, but not a fully disclosed core
      platform architecture.
    claimRefs: ["CE011", "CE012", "CE015", "CE016"]
  - id: "trust-controls-dependencies-and-risks"
    title: "Trust controls are visible; control-surface disclosure is not"
    body: >-
      Public evidence shows Carsome invests heavily in trust and process
      control: inspections are standardized, certified cars carry explicit
      retail assurances, more than half of candidate cars were reportedly
      rejected after first inspection, and the Academy plus accredited training
      infrastructure suggest talent development is treated as part of product
      delivery rather than back-office HR. The same evidence also highlights the
      main product risk: the differentiation depends on operating physical
      infrastructure and maintaining consistent policies across markets. Official
      market pages already show different retail warranty and return terms, and
      the assigned pool does not verify security certifications, uptime/service
      levels, or an external developer/practitioner signal. For diligence, that
      means Carsome's quality system is more visible than its software-control
      stack, and the gap is meaningful because scale consistency depends on both.
    claimRefs: ["CE005", "CE006", "CE007", "CE010", "CE014", "CE017"]
callouts:
  - calloutType: "strength"
    title: "Operational depth is the product moat"
    body: >-
      Carsome's public materials and third-party reporting converge on the same
      picture: inspection, refurbishment, auction, retail presentation, and
      financing are designed as one controlled workflow rather than stitched
      together from partner handoffs.
    claimRefs: ["CE001", "CE008", "CE014"]
  - calloutType: "risk"
    title: "Consistency risk grows with every local operating surface"
    body: >-
      The same offline-heavy model that creates trust also raises execution
      burden, because policy localization, refurbishment throughput, training,
      and software controls all have to stay aligned across markets.
    claimRefs: ["CE006", "CE007", "CE017"]
tables:
  - id: "TE001"
    title: "Product module / asset matrix"
    columns:
      ["Module / asset", "Primary user", "Status / maturity", "Differentiation", "Diligence gap"]
    rows:
      - ["Sell-car intake and inspection", "Individual vehicle sellers", "Core live workflow across markets", "Online booking plus free 175-point inspection and condition reporting compress a traditionally opaque sale flow", "No current funnel-conversion disclosure by market or channel"]
      - ["Dealer bidding / wholesale channel", "Used-car dealers", "Core live workflow", "Carsome can route inspected supply into bidding instead of only principal inventory, broadening monetization and price discovery", "No public take-rate, dealer retention, or auction-liquidity metrics in assigned evidence"]
      - ["CARSOME Certified retail", "Retail buyers", "Scaled live workflow", "Listings add 360-degree imagery, imperfections, reconditioning reports, fixed pricing, warranty, and return promises to mimic new-car confidence", "Retail assurance terms differ across market pages and are not normalized in one public matrix"]
      - ["Refurbishment and QA infrastructure", "Internal operations / retail buyers", "Scaled but selectively disclosed", "Independent reporting shows a large certified lab, proprietary diagnostics, final QC, and test-drive release gates", "Current official sources do not refresh lab throughput, reject-rate, or utilization"]
      - ["Financing, aftersales, and training adjacencies", "Retail buyers, dealers, and technicians", "Expanding ecosystem layer", "Capital, Academy, and service-centre additions extend Carsome beyond one-time transaction brokerage", "Public evidence does not separate attachment rates or profitability by adjacency"]
    notes: >-
      Mixes 2026 official pages with older independent reporting; maturity labels
      describe evidence visibility, not audited revenue contribution.
    claimRefs: ["CE001", "CE002", "CE003", "CE004", "CE008", "CE010", "CE014"]
  - id: "TE002"
    title: "Workflow / use-case table"
    columns:
      ["User job", "Current workflow", "Carsome solution", "Measurable benefit", "Limitation"]
    rows:
      - ["Sell a used car quickly", "Book inspection, receive condition report, accept offer or bidding outcome, complete paperwork", "Free 175-point inspection plus ownership-transfer handling", "Official pages say inspection takes about 30 minutes; Seedly reported seller payment could occur within 24 hours", "No current cancellation-rate, conversion-rate, or NPS disclosure"]
      - ["Source inspected inventory as a dealer", "Bid on inspected cars rather than source entirely offline", "Dealer network attached to Carsome's inspection and auction flow", "Thailand page cites 13,000+ dealers and 18,000,000+ total bids", "No market-level liquidity or average sell-through timing disclosed"]
      - ["Buy a pre-owned car with lower trust friction", "Browse online, inspect rich listing content, book test drive or delivery, rely on warranty/return promise", "CARSOME Certified retail flow with 360 views, reconditioning report, fixed price, and aftersales adjacency", "Public listings surface imperfections and reconditioning detail before the visit", "Warranty and money-back terms vary across market pages"]
      - ["Run inspections without exposing personal data", "Inspector captures vehicle photos during inspection", "ML-driven plate masking workflow preserves privacy before images are reused", "Carsome reported ~29x faster masking time in its AWS case study", "No independent benchmark or rollout coverage by market disclosed"]
    notes: >-
      Benefits combine current official statements with dated case-study and
      media observations; unsupported denominators remain diligence asks.
    claimRefs: ["CE003", "CE004", "CE011", "CE012", "CE015"]
  - id: "TE003"
    title: "Technology / operating architecture table"
    columns:
      ["Layer / process / component", "Role", "Dependency", "Risk"]
    rows:
      - ["Demand capture and content surfaces", "Generate seller and buyer intent through brand, content, and owned marketplaces", "Traffic acquisition and cross-brand coordination", "Public evidence does not show CAC efficiency, SEO dependence, or mix by owned brand"]
      - ["Inspection-center layer", "Standardize intake, valuation, and seller trust with a free 175-point check", "Inspector training, center footprint, and workflow software", "Throughput and staffing utilization are not externally disclosed"]
      - ["Certified-lab refurbishment layer", "Upgrade selected cars into retail-ready inventory with mechanical, body, paint, detailing, and QC steps", "Parts sourcing, skilled labor, and working capital", "Offline-heavy model can create consistency and capacity bottlenecks as regions expand"]
      - ["Data and automation layer", "Support pricing, dealer recommendation, photo privacy, and operational productivity", "ML engineering talent, cloud tooling, and usable inspection data", "Only isolated workflows are public; broader stack depth, resilience, and governance remain under-disclosed"]
      - ["Trust and assurance layer", "Convert trust-sensitive used-car demand through warranties, return rights, reports, diagnostics, and tests", "Policy enforcement and market-level service operations", "Retail-assurance terms differ by market and no public SLA/security-certification set is visible in the pool"]
    notes: >-
      Architecture is a synthesized operating-model view from public evidence,
      not a disclosed end-to-end system diagram from Carsome.
    claimRefs: ["CE002", "CE003", "CE008", "CE009", "CE011", "CE014", "CE017"]
