evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: >-
      Current board roster, independent-director structure, cap-table ownership percentages, and any voting-control
      summary.
    whyItMatters: >-
      Governance concentration and control rights affect key-person risk, investor protections, and exit-readiness
      assessment.
    diligencePath: >-
      Request the latest board list, shareholder register, and any board-rights or shareholder-agreement summary from
      management.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: total-raised
    missingEvidence: >-
      A reconciled round-by-round financing bridge that explains whether debt facilities are included in lifetime
      funding totals.
    whyItMatters: Conflicting lifetime funding numbers distort dilution, leverage, and investor-ownership analysis.
    diligencePath: Request a financing ledger listing each equity and debt round, date, amount, instrument, and post-money valuation.
  - type: missing-source
    severity: material
    topic: exact-headcount
    missingEvidence: Management-disclosed current employee count by geography or function.
    whyItMatters: >-
      A wide third-party range is not enough to assess operating leverage, restructuring risk, or country-level
      execution intensity.
    diligencePath: Request a current HR headcount snapshot or management KPI pack.
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-stakeholders
    missingEvidence: Full leadership roster and investor / lender map with board-rights detail.
    whyItMatters: >-
      The chapter can frame control-risk diligence, but it cannot claim exhaustive coverage of every relevant executive
      or capital provider.
    diligencePath: Expand the chapter with a verified roster and cap-table package when management materials are available.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sam-country-split
    missingEvidence: >-
      Public country-level revenue, unit, or active-buyer disclosure that isolates Carsome's serviceable market by
      Malaysia, Indonesia, Thailand, and Singapore.
    whyItMatters: >-
      Without geographic revenue or demand contribution, SAM and share assumptions rely on broad regional narratives
      rather than observed market penetration.
    diligencePath: >-
      Request board-pack or management-accounts cuts showing revenue, units, and financing penetration by country and
      channel for the last eight quarters.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: market-sizing-methodology
    missingEvidence: >-
      An independent market study with transparent methodology for Southeast Asian used-car demand, including channel
      boundary and country weights.
    whyItMatters: >-
      The current external market-size citation establishes scale but not enough methodological detail to underwrite a
      clean TAM/SAM/SOM bridge.
    diligencePath: >-
      Source a paid analyst report or trade-association dataset that discloses how used-car volume, value, and channel
      definitions were constructed.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing-transparency
    missingEvidence: >-
      Public price sheets, commission schedules, or discount disclosures for Carro and large incumbent dealer channels
      by market and product line.
    whyItMatters: >-
      Without comparable pricing or take-rate disclosure, the chapter can compare packaging and workflow design but
      cannot prove sustainable price leadership or undercutting.
    diligencePath: >-
      Request current dealer fee cards, consumer quote samples, and market-by-market price books from Carsome and at
      least one direct peer, then reconcile them against retail and wholesale attachment rates.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-disclosure
    missingEvidence: Current cash balance, monthly burn, runway, debt maturities, covenant headroom, and facility availability.
    whyItMatters: >-
      These are the core inputs for capital-adequacy underwriting and determine whether the 2026 raise solved a
      short-term liquidity need or funded optional expansion.
    diligencePath: >-
      Request the latest board cash bridge, debt schedule, covenant package, and 12-month base/upside/downside liquidity
      forecast.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-margin
    missingEvidence: >-
      Realized take rates, retail GPU bridge, refurbishment cost per unit, warranty reserve, and geography / channel
      revenue mix.
    whyItMatters: >-
      Public list propositions do not show whether Carsome's integrated model is structurally higher margin or just
      higher working-capital intensity.
    diligencePath: >-
      Request segment P&Ls for wholesale, retail, financing, and aftersales plus a cohort GPU waterfall for certified
      retail units.
    relatedQuestionRefs:
      - QI002
      - QI004
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: stale
    severity: material
    topic: lending-book-vintage
    missingEvidence: >-
      Updated Carsome Capital book size, funding cost, delinquency vintages, write-offs, and reserve policy after May
      2023.
    whyItMatters: >-
      Historical low NPLs do not prove current credit quality, especially if macro conditions or underwriting standards
      have changed.
    diligencePath: Request monthly loan-book and delinquency tables by cohort, product, country, and funding partner for 2024-2026.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: total-funding
    missingEvidence: >-
      A management-certified financing ledger that reconciles every equity round, venture debt facility, and
      asset-backed line.
    whyItMatters: >-
      Divergent public funding tallies make it hard to assess dilution, debt dependence, and how much external capital
      the model has truly consumed.
    diligencePath: >-
      Request the cap table, round-by-round proceeds ledger, debt facility schedule, and use-of-funds bridge through the
      latest quarter.
    relatedQuestionRefs:
      - QI005
      - QI007
      - QI008
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A public developer or practitioner-community proxy for Carsome's software stack, APIs, data tooling, or
      engineering adoption.
    whyItMatters: >-
      Without an external developer-signal proxy, this chapter cannot independently test whether Carsome's technology
      depth is visible outside company-controlled narratives.
    diligencePath: >-
      Request product/API documentation, engineering talks, public package activity, or partner-implementation case
      studies that expose real technical usage.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: material
    topic: security-and-reliability-controls
    missingEvidence: >-
      Public evidence for security certifications, status/uptime history, incident disclosure, vulnerability-handling
      process, or formal service-level commitments.
    whyItMatters: >-
      Carsome's trust proposition depends on software and operations controls, but the assigned evidence pool proves
      only selected privacy and QA workflows, not broader control maturity.
    diligencePath: >-
      Request the security/compliance pack, status history, vendor-risk documentation, and any internal control matrix
      used for data, application, and operations governance.
    relatedQuestionRefs:
      - QE007
      - QE008
  - type: conflicting-data
    severity: minor
    topic: retail-assurance-localization
    missingEvidence: >-
      One market-by-market source of truth for warranty duration, return window, and eligibility conditions across
      Carsome's retail markets.
    whyItMatters: >-
      Official Indonesia and Thailand pages show different assurance terms, so investors cannot assume a single regional
      service promise without local policy evidence.
    diligencePath: >-
      Obtain Carsome's country-level policy matrix for CARSOME Certified warranties, return rights, exclusions, and
      claims handling.
    relatedQuestionRefs:
      - QE007
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention-and-renewal
    missingEvidence: >-
      Public NRR, GRR, churn, renewal, repeat-purchase, and cohort retention metrics for retail buyers, consumer
      sellers, and dealers.
    whyItMatters: >-
      Without durability metrics, the chapter can show demand and footprint but cannot prove that Carsome's expansion is
      efficient or sticky.
    diligencePath: >-
      Request cohort tables for repeat sellers, repeat retail buyers, financing attach by cohort, and dealer
      reactivation or churn by market.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: Top-customer, top-dealer, and country-segment concentration by GMV, revenue, or financing exposure.
    whyItMatters: >-
      Concentration can change the durability of Carsome's dealer liquidity, retail demand, and financing attachment
      even when aggregate volume looks strong.
    diligencePath: >-
      Request top-10 dealer share, top showroom contribution, retail versus wholesale GMV by country, and customer
      concentration in Carsome Capital.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
