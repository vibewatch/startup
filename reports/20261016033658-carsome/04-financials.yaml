schemaVersion: "report-v2"
artifact: financials
slug: carsome
runDate: 2026-10-16
company:
  name: Carsome
chapter:
  number: 4
  title: Financials
  summary: >-
    Carsome's public financial narrative is a multi-stream used-car marketplace that says it has
    reached profitability while still raising fresh capital, most recently a disclosed >USD 30
    million strategic round in March 2026. Public proxies suggest relatively fast inventory turns,
    meaningful retail and financing contributions, and continuing operational scale, but audited
    revenue quality, current cash/runway, and up-to-date lending-book performance remain
    underwriting gaps.
sections:
  - id: revenue-model
    title: Revenue model and monetization mix
    body: >-
      Carsome's official surfaces position the company as an integrated automotive commerce stack
      rather than a pure classifieds marketplace, spanning car content, inspection, ownership
      transfer, financing, and other ancillary services across Malaysia, Indonesia, Thailand, and
      Singapore. Public operating descriptions indicate that the core monetization engine starts
      with consumer-sourced inventory, then splits between dealer-auction turnover and retail
      resale through Carsome Certified, with financing, aftersales, and media/lead-generation
      adjacencies layered on top. That matters for underwriting because gross-profit quality will
      depend on the mix between lower-capital marketplace fees and higher-touch inventory,
      refurbishment, and lending activities rather than on one simple SaaS-like revenue stream.
    claimRefs: [CI001, CI002, CI003]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-unit-economics
    title: Public traction and unit-economics proxies
    body: >-
      The assigned pool offers enough public data to show operational scale, but not enough to
      fully underwrite revenue quality. A 2023 field report said Carsome was selling over 18,000
      Carsome Certified cars per month, generated US$1.5 billion of revenue in 2022, and drew 15
      million monthly unique visitors; a 2026 company-profile aggregator separately described the
      business as transacting around 100,000 cars annually. The most useful working-capital proxy is
      inventory velocity: the same 2023 field report quoted management as holding retail inventory
      for around 20 days and wholesale inventory for around 7 days, versus more than 30 days for
      the industry. Those are encouraging public signals, but they are not substitutes for cohort
      gross-margin disclosure, reconditioning cost per unit, realized take rates, or geography and
      segment mix.
    claimRefs: [CI006, CI007, CI008, CI009, CI016]
    tableRefs: [TI003]
  - id: capital-and-liquidity
    title: Capital adequacy, lending exposure, and financing dependency
    body: >-
      The clearest current capital datapoint in the assigned evidence is Carsome's March 2026
      announcement of a strategic round of more than USD 30 million from HKIC, Gobi Partners, and
      Asia Partners, framed as fuel for profitable growth plus AI and supply-chain collaboration.
      Older public evidence also shows Carsome Capital had already disbursed US$240 million since
      inception and carried an approximately US$90 million financing book as of May 2023, with
      reported wholesale NPLs at 0% and retail NPLs below 1%. That combination suggests Carsome is
      not just a transaction intermediary; it also carries balance-sheet exposure through inventory
      and lending. However, the assigned public materials do not disclose current cash on hand,
      burn, runway, debt maturities, covenant headroom, or post-2023 credit performance.
    claimRefs: [CI004, CI005, CI010, CI011, CI012]
  - id: verdict-and-blockers
    title: Financial verdict and diligence blockers
    body: >-
      The financial story is directionally improving: public materials support a broader revenue
      stack than simple commissions, some evidence of faster inventory turns than traditional
      dealers, and a current fundraising event that followed a company-claimed profitability
      narrative. The underwriting problem is disclosure depth. Public funding tallies already diverge
      across third-party aggregators because one summary counts US$759.0 million across 8 rounds
      while another says Carsome had secured over US$808 million across 16 rounds including debt
      financings, and Grokipedia also reports layoffs in 2022 and 2023 during the path to
      profitability. Until diligence receives management-certified cash, debt, gross-margin, and
      lending-book data, the correct view is that Carsome looks financially more mature than a
      growth-at-all-costs marketplace, but still cannot be fully underwritten from public sources.
    claimRefs: [CI012, CI014, CI015]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Wholesale / dealer-auction transactions
        - Consumer-sourced cars are inspected, listed, and sold through dealer bidding or direct dealer turnover.
        - Per vehicle transaction / commission economics not publicly disclosed
        - Core operating stream is clearly described, but public take-rate disclosure is absent.
        - Medium
        - Provide gross merchandise value, take rate, and dealer-fee economics by market.
      - - Carsome Certified retail
        - Carsome acquires, refurbishes, and resells selected vehicles directly to consumers.
        - Per vehicle retail gross profit
        - Public sources say the retail line is material and higher touch, but do not provide current realized gross margin.
        - Medium
        - Share retail revenue mix, GPU bridge, reconditioning cost per unit, and return / warranty cost.
      - - Financing and insurance
        - Carsome Capital and partner financing attach loans and related ancillary products to transactions.
        - Loan book yield / take-up / loss rate
        - Public sources show lending activity and historical NPL claims, but not current yield, funding cost, or vintage performance.
        - Medium
        - Provide financing penetration, net interest margin, funding cost, and vintage delinquency tables.
      - - Aftersales / service centres
        - Service centres monetize maintenance and repair after the vehicle sale.
        - Service job / visit economics
        - Public evidence confirms the service-centre launch, but no revenue contribution or margin disclosure is public.
        - Low
        - Provide service-centre volumes, attach rates, contribution margin, and payback.
      - - Media / lead generation / training adjacencies
        - Acquired automotive media brands and Carsome Academy support lead generation and talent supply.
        - Advertising / referral / training economics
        - Strategically relevant, but public revenue split and profitability are undisclosed.
        - Low
        - Break out media and academy revenue, margin, and customer-acquisition contribution.
    notes: >-
      Public sources describe monetization layers and some historical mix proxies, but realized
      pricing, take rates, and current segment P&L are mostly unavailable; null-equivalent narrative
      cells indicate undisclosed economics rather than zero contribution.
    claimRefs: [CI001, CI002, CI003, CI007, CI010, CI011]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Surface
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Seller transaction
        - Car valuation after inspection; seller can accept Carsome's offer or open dealer bidding.
        - Realized take rate is not public.
        - No public disclosure of inspection fees, seller fees, or acceptance-rate economics.
        - SI003
      - - Retail buyer offer
        - Fixed-price certified used car with 1-year warranty and 5-day money-back guarantee.
        - Public sources show customer-facing terms, not realized GPU.
        - No public view of discounting, warranty reserve, or refurbishment cost absorption.
        - SI006
      - - Financing product
        - Retail and wholesale financing via Carsome Capital and partners.
        - Public list terms are not disclosed as loan APR / fee schedules.
        - Current funding cost, loss assumptions, and partner revenue-share are undisclosed.
        - SI011
      - - Aftersales / maintenance
        - Service-centre maintenance and repair offering.
        - No public pricing pack in assigned sources.
        - Revenue model exists, but current ticket size and utilization are not public.
        - SI001
    notes: >-
      This table separates publicly visible customer propositions from undisclosed realized pricing;
      cited source IDs point to the claims summarizing the evidence, not to row-level hidden price
      sheets that are unavailable in the assigned pool.
    claimRefs: [CI003, CI009, CI010, CI011]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Retail inventory turnover
        - Around 20 days
        - Medium
        - Faster turns reduce working-capital lockup and depreciation risk for owned inventory.
        - Provide current monthly turns by market and by vehicle age bucket.
      - - Wholesale inventory turnover
        - Around 7 days
        - Medium
        - Very fast wholesale turns can offset the capital intensity of taking title to inventory.
        - Provide current turns and auction-to-cash timing by country.
      - - Consumer-sourced inventory mix
        - Around 90% of inventory sourced directly from consumers
        - Medium
        - Direct sourcing can support margin capture and pricing-data advantages over brokered channels.
        - Provide current sourcing mix and acquisition cost per car.
      - - Carsome Capital financing book
        - About US$90 million as of May 2023
        - Medium
        - The finance arm adds revenue and balance-sheet exposure that affects capital needs and risk.
        - Provide latest book size, funding mix, cost of funds, and delinquency vintages.
      - - Carsome Capital credit quality
        - 0% wholesale NPL and less than 1% retail NPL as of May 2023
        - Medium
        - Loss performance drives whether financing is accretive or a hidden drag on equity value.
        - Provide post-2023 NPL / write-off history and reserve policy.
    notes: >-
      Values are public proxies from historical reporting rather than a current management KPI pack;
      they are useful directional indicators but should not be treated as a substitute for audited
      unit-economics disclosure.
    claimRefs: [CI003, CI009, CI011, CI012]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Consumer-sourced inventory feeds multiple monetization layers rather than a single fee stream.
    data:
      nodes:
        - id: source
          label: Consumer-sourced inventory
          displayValue: "~90% of inventory"
          note: Sellers originate the majority of supply directly with Carsome.
          claimRefs: [CI003]
        - id: inspection
          label: Inspection and pricing
          displayValue: "175-point inspection"
          note: Inspection and pricing determine whether Carsome buys, auctions, or routes vehicles elsewhere.
          claimRefs: [CI001, CI003]
        - id: wholesale
          label: Dealer auction / wholesale
          displayValue: "20,000+ dealers"
          note: Carsome can monetize through dealer bidding and rapid wholesale turnover.
          claimRefs: [CI002, CI003]
        - id: retail
          label: Carsome Certified retail
          displayValue: "18,000+ cars / month"
          note: Selected inventory is refurbished and resold with warranty-backed consumer promises.
          claimRefs: [CI002, CI006]
        - id: finance
          label: Financing and insurance
          displayValue: "US$240M disbursed since inception"
          note: Carsome Capital deepens take rate but adds credit and funding exposure.
          claimRefs: [CI001, CI010, CI011, CI012]
        - id: aftersales
          label: Aftersales, media, and training adjacencies
          displayValue: "Multiple ancillary layers"
          note: Service centres, media properties, and academy assets extend monetization beyond the core transaction.
          claimRefs: [CI001, CI002]
      edges:
        - from: source
          to: inspection
          label: Supply intake
          claimRefs: [CI003]
        - from: inspection
          to: wholesale
          label: Auction / wholesale path
          claimRefs: [CI002, CI003]
        - from: wholesale
          to: retail
          label: Selective inventory retention
          claimRefs: [CI002]
        - from: retail
          to: finance
          label: Transaction attach
          claimRefs: [CI001, CI010, CI011]
        - from: finance
          to: aftersales
          label: Ownership lifecycle monetization
          claimRefs: [CI001, CI002]
    approximationNotes: >-
      This is a revenue-mechanism flow, not a quantitative waterfall; public sources describe the
      sequence and attachments but do not provide a reconciled segment P&L.
    claimRefs: [CI001, CI002, CI003, CI006, CI010, CI011]
callouts:
  - calloutType: insight
    title: Carsome monetizes the full ownership funnel, not just a listing fee
    body: >-
      Public evidence consistently points to a stack that spans sourcing, inspection, wholesale,
      retail, financing, and aftersales, which can support higher lifetime monetization than a pure
      classifieds model but also makes margin quality more balance-sheet sensitive.
    claimRefs: [CI001, CI002, CI003, CI010, CI011]
  - calloutType: risk
    title: Profitability messaging is ahead of public disclosure depth
    body: >-
      Carsome's current public story emphasizes profitable growth and a fresh 2026 capital raise,
      but the assigned evidence still lacks audited current cash, burn, debt-maturity, segment-mix,
      and up-to-date credit-performance data needed for clean underwriting.
    claimRefs: [CI004, CI005, CI011, CI012, CI014, CI015]
