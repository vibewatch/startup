companyProfile:
  summary: >-
    Carsome is a late-stage private used-car platform that remains the regional category leader across Malaysia,
    Indonesia, Thailand, and Singapore. The company sells an integrated service stack spanning inspection, ownership
    transfer, financing, retail, and adjacent ecosystem services, and it continues to attract capital while showing
    profitability momentum. The 2026 refresh still leaves the current round price, current ownership, and audited
    financial disclosure unresolved, so the company is best understood as a scaled operator with improving execution but
    limited price transparency.
