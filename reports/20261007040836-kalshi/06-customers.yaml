chapter:
  number: 6
  title: "Customers"
  summary: "Kalshi's customer base spans two contrasting segments: a high-volume retail cohort that generates rapid speculative trading activity, and an emerging institutional tier comprising quantitative market makers, brokerages, and corporate compliance clients. While consumer onboarding is accelerated through brokerage integrations and major sporting events, independent studies highlight severe retail loss asymmetry, positioning institutional hedging and embedded infrastructure partnerships as the primary path to durable enterprise expansion."
sections:
  - id: "customer-segmentation-and-buyer-profiles"
    title: "Customer Segmentation and Buyer Profiles"
    body: "Kalshi's customer ecosystem is fundamentally bifurcated into direct retail traders and institutional market participants. Retail consumers interact primarily through mobile and web applications to trade binary event contracts on politics, economic releases, cultural milestones, and sports fixtures [CU001, CU002]. Within the retail segment, trading behavior varies between casual event bettors reacting to media cycles and systematic discretionary traders seeking statistical edges against public sentiment [CU008]. On the enterprise side, Kalshi categorizes institutional users into quantitative hedge funds, passive liquidity providers, corporate hedging entities, and distribution partners [CU005, CU007]. Corporate treasury and risk management teams utilize event contracts to hedge specific operational exposures, such as headline inflation benchmarks or interest rate decisions, directly rather than relying on imperfect traditional proxies [CU007]. Institutional adoption is supported by compliance monitoring integrations, such as partnerships with Comply and StarCompliance, which allow enterprise employers to track employee activity and enforce insider trading prohibitions across prediction markets and perpetual futures [CU004]. This institutional infrastructure reflects Kalshi's strategic evolution from a retail-centric venue to a regulated derivatives exchange serving corporate and financial entities."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
      - "CU005"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory-and-usage-scale"
    title: "Adoption Trajectory and Usage Scale"
    body: "Kalshi has experienced exponential top-line volume acceleration across 2025 and 2026, driven by election cycle engagement, professional sports markets, and perpetual futures expansion [CU002, CU006, CU007]. Kalshi and Polymarket combined saw trading volume expand from $1.8 billion to $24.2 billion in April 2026, with the broader event-contract industry projected to reach $1 trillion in annual trading volume by 2030 [CU002]. Kalshi's institutional portal reports over 1,000 institutional clients, $500 billion in annualized platform volume, peak single-day trading volume exceeding $3.3 billion, and more than 1 billion annual trades across 8,000 live markets [CU007]. However, platform liquidity displays sharp market-level skew: flagship political and macro series—such as the 2028 Democratic presidential nominee ($233.2M volume) and Super Bowl champion ($165.1M volume)—command the majority of capital, while specialized policy or legislative contracts frequently trade under $500,000 in lifetime volume [CU001]. This structural volume concentration indicates that platform utilization remains highly event-dependent, requiring continuous headline catalysts to sustain high active participation rates."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU002"
  - id: "named-deployments-and-partner-integrations"
    title: "Named Deployments and Partner Integrations"
    body: "To deepen customer acquisition and embed its order book across third-party user interfaces, Kalshi has pursued strategic distribution partnerships with consumer brokerages, global sports brands, and compliance technology vendors [CU003, CU004, CU009]. Public launched AI Agents for Prediction Markets in September 2026, enabling its brokerage members to trade Kalshi event contracts natively and utilize Kalshi's real-time market probabilities as automated trading signals across equities and fixed income [CU009]. In consumer sports, Kalshi formed a strategic marketing and product agreement with ADI Predictstreet, the Official Prediction Market Partner of the 2026 FIFA World Cup, deploying co-branded stadium and digital activations alongside planned international market expansion [CU003]. To overcome enterprise friction, Kalshi integrated its trade data feeds into Comply's regulatory software, allowing over 5,000 compliance client firms to police employee trades on prediction contracts and crypto perpetual futures [CU004]. These production relationships establish diversified distribution channels that reduce direct customer acquisition costs, although partner dependency introduces platform governance and alignment risks."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU009"
    tableRefs:
      - "TU003"
  - id: "retention-mechanics-and-retail-asymmetry"
    title: "Retention Mechanics and Retail Loss Asymmetry"
    body: "Kalshi's customer durability faces significant headwinds stemming from structural performance disparities between retail participants and institutional liquidity providers [CU002, CU008]. An empirical study conducted by the Roosevelt Institute revealed that ordinary users lost more than $500 million on Kalshi between its July 2021 launch and May 2026, with losses predominantly concentrated in sports betting contracts [CU002]. Retail traders on prediction platforms systematically underperform sophisticated market makers who deploy automated pricing algorithms and rapid latency infrastructure to harvest execution spreads and mispricings [CU002, CU008]. While systematic macro traders can achieve consistent double-digit quarterly returns by exploiting sentiment discrepancies against economic benchmarks, discretionary retail participants frequently experience negative net returns [CU008]. If retail capital erosion leads to rapid churn among casual event traders, Kalshi will need to continually replenish its retail customer base through external distribution partnerships or pivot platform volume toward institutional risk hedging."
    claimRefs:
      - "CU002"
      - "CU008"
callouts:
  - calloutType: "risk"
    title: "Retail Trader Loss Concentration and Churn Dynamics"
    body: "Independent data analysis reveals that retail participants on Kalshi incurred over half a billion dollars in cumulative net losses between July 2021 and May 2026, primarily across sports contracts. Because trading profits concentrate heavily in the hands of sophisticated high-volume algorithms, casual consumer retention represents a major structural vulnerability that requires continuous marketing and partner-led top-of-funnel customer acquisition."
    claimRefs:
      - "CU002"
  - calloutType: "strength"
    title: "Embedded Brokerage Distribution via Public"
    body: "Kalshi's integration with Public enables external retail investors to trade event contracts through an established brokerage interface while utilizing Kalshi's market-implied probabilities as automated decision signals for traditional asset classes, significantly lowering retail user acquisition friction."
    claimRefs:
      - "CU009"
