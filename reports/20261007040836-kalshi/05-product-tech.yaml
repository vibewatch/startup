  title: "Product & Technology"
  summary: "Kalshi operates a CFTC-regulated institutional-grade exchange and clearinghouse architecture combining centralized off-chain CLOB matching with automated binary event contract settlement and newly launched crypto perpetual futures. The technological moat rests on regulatory-cleared clearing infrastructure, REST/WebSocket/FIX connectivity, and traditional banking integration, while facing technical latency constraints against microsecond HFT venues and state-level regulatory enforcement challenges."
sections:
  - id: "core-exchange-architecture"
    title: "Core Trading Architecture and Matching Engine"
    body: "Kalshi's trading platform is architected as a centralized, CFTC-regulated derivatives exchange and clearinghouse, distinguishing it fundamentally from decentralized automated market maker (AMM) or hybrid peer-to-peer protocols. At its computational core, Kalshi operates a fully off-chain Central Limit Order Book (CLOB) matching engine where binary event contracts are structured such that complementary positions strictly satisfy YES + NO = $1.00. The platform matches limit orders and market orders off-chain with deterministic single-digit millisecond latency, providing real-time price discovery and tight bid-ask spreads without exposure to blockchain transaction fees, miner-extractable value (MEV), or block finality delays. Kalshi operates two distinct CFTC-regulated legal and technical entities: a Designated Contract Market (DCM) executing order matching and an internal Derivatives Clearing Organization (DCO) managing margining, collateral custody, and settlement. The exchange infrastructure is engineered on Amazon Web Services (AWS) using Kubernetes, Terraform, and Apache Kafka for event-driven message distribution, supporting real-time market data broadcasting and audit logging. While off-chain execution provides sub-15ms position state updates and reliable trade execution for retail and algorithmic market makers, it remains bounded by centralized cloud throughput and does not reach the sub-microsecond latency tiers characteristic of dedicated collocated high-frequency equities or futures execution venues."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "product-expansion-and-api-surface"
    title: "Product Lines, Perpetual Futures, and Developer Surfaces"
    body: "Kalshi's product catalog has expanded beyond discrete binary event contracts into continuous derivatives through the launch of American onshore perpetual futures contracts. While event contracts cover binary outcomes across economics, politics, financials, culture, and sports organized in a strict hierarchy of series, events, and markets, perpetual futures introduce continuous non-expiring margin contracts with eight-hour funding rates. This product expansion transforms Kalshi from an episodic prediction venue into a full-service derivatives exchange. To support programmatic market participants, institutional liquidity providers, and third-party interface builders, Kalshi exposes an institutional developer surface encompassing REST, WebSocket, and Financial Information eXchange (FIX) protocols. For retail and fintech integrations, REST endpoints facilitate catalog browsing, portfolio inspection, and order lifecycle management authenticated via RSA-PSS signatures and API key tokens. High-throughput market data streaming is delivered via WebSockets, while institutional algorithmic desks utilize the industry-standard FIX protocol for lowest-latency order submission and execution confirmations. Kalshi also maintains sandbox demo environments and OpenAPI/AsyncAPI specifications, allowing external developers and fintech brokerage partners to embed event-contract order books into their own consumer applications."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE002"
  - id: "settlement-institutional-connectivity-and-compliance"
    title: "Settlement Mechanics, Institutional Workflow, and Compliance Controls"
    body: "Clearing and settlement on Kalshi run off-chain using fiat USD payment rails connected directly to domestic commercial banking systems via Automated Clearing House (ACH) transfers and wire transactions. Upon contractual market resolution governed by predetermined settlement rules and self-certified outcome feeds, the internal clearinghouse automatically computes payouts and credits winning account balances instantaneously, enabling immediate capital redeployment without the smart-contract redemption steps or token-merging friction inherent in crypto-native alternatives. At the institutional tier, Kalshi connects with external Execution Management Systems (EMS) and Portfolio Management Systems (PMS) such as Elwood Technologies, enabling digital asset quant desks, macro hedge funds, and prime brokers to model binary event risk, carry premium funded at prevailing interest rates, and route programmatic orders through pre-trade risk controls and whitelists. However, operating as a federally regulated DCM creates rigid operational boundaries: mandatory Know Your Customer (KYC) and Anti-Money Laundering (AML) identity verification is enforced across all accounts, and access has historically been restricted across eight U.S. states. Furthermore, state-level legal challenges—exemplified by enforcement actions from the New York Attorney General alleging unlicensed gambling and youth exposure—threaten the continuity of retail access in key jurisdictions and impose rigorous technical geofencing and compliance-monitoring obligations on Kalshi's infrastructure."
    claimRefs:
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
      - "CE016"
    tableRefs:
      - "TE003"
