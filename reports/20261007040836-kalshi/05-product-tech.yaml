callouts:
  - calloutType: "insight"
    title: "Architectural Divergence Between Centralized and Decentralized Prediction Venues"
    body: "Kalshi's architectural choice to operate a centralized off-chain CLOB rather than an automated market maker (AMM) or on-chain smart contract protocol yields substantial performance advantages, including single-digit millisecond order matching, zero gas overhead, and instant fiat capital recycling. However, this model concentrates settlement and custody risk within Kalshi's internal clearinghouse, requiring participants to place absolute trust in the platform's proprietary resolution mechanisms and regulatory compliance perimeter."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE005"
      - "CE012"
  - calloutType: "risk"
    title: "Regulatory Vulnerability of State-Level Geofencing and Retail Compliance"
    body: "While Kalshi's federal DCM designation provides national legal standing under the Commodity Exchange Act, state-level legal enforcement actions—such as the lawsuit by the New York Attorney General alleging unlicensed gambling and youth access—expose significant operational friction. Kalshi must maintain robust geographic fencing and age-verification mechanisms, as adverse state court rulings or injunctions can force sudden jurisdictional access cutoffs, impairing regional market liquidity."
    claimRefs:
      - "CE015"
      - "CE016"
