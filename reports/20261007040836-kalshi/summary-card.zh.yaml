  topStrengths:
    - 受 CFTC 监管的交易所架构及指定合约市场身份，构成了有分量的监管护城河。
    - 收入和交易活跃度快速放大，公开来源称其收入运行率已达 $4B。
    - 借助数据、合规和经纪业务合作伙伴，机构分销网络正在扩宽。
