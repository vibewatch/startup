evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Complete executive and board rosters, committee charters, voting-control terms, succession plans, and material
      leadership changes.
    whyItMatters: >-
      Founder dependence, board independence, regulatory oversight capacity, and continuity cannot be evaluated from the
      partial public roster.
    diligencePath: >-
      Request the board book, organization chart, governance documents, key-person provisions, and executive departure
      log from management.
    relatedQuestionRefs:
      - QO004
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: capitalization
    missingEvidence: >-
      Cumulative primary capital, secondary proceeds, debt or credit facilities, fully diluted ownership, liquidation
      preferences, and board or observer rights.
    whyItMatters: >-
      The latest financing does not establish cash available, total funding, preference overhang, dilution, or investor
      control.
    diligencePath: Obtain the capitalization table, financing closing sets, debt schedule, cash reconciliation, and waterfall model.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-scale
    missingEvidence: >-
      Audited revenue, total users, active and funded users, headcount, cash, burn, runway, and a complete
      operating-location list.
    whyItMatters: >-
      Annualized rates and marketing metrics cannot establish realized financial performance, workforce efficiency,
      liquidity, or geographic exposure.
    diligencePath: >-
      Request audited financials, monthly management accounts, KPI definitions and cohorts, payroll census, cash and
      debt statements, and the legal-entity and office register.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholders
    missingEvidence: A complete investor, debt-holder, regulator, commercial-partner, and governance-rights register.
    whyItMatters: >-
      The public map identifies material actors but cannot establish the full control, preference, and dependency
      structure.
    diligencePath: >-
      Reconcile the capitalization table, debt schedule, material-contract register, licenses, and board consents
      against the public map.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: platform-scale
    missingEvidence: >-
      A reconciled monthly series defining product scope, geography, averaging window, and counterparty treatment for
      the $500B annualized, $100B annual, and $1B weekly volume figures.
    whyItMatters: >-
      The disclosed activity metrics cannot be compared or converted into market share until their periods and
      denominators align.
    diligencePath: >-
      Request exchange-produced monthly volume by product and geography, then reconcile it to the definitions used in
      each public disclosure.
    relatedQuestionRefs:
      - QM002
      - QM005
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: sam-som
    missingEvidence: >-
      Product- and state-level customer capital at risk, unique funded active accounts, fee schedules, realized net
      fees, and retention cohorts.
    whyItMatters: >-
      These denominators are required to calculate addressable spend, current monetized market share, and the revenue
      impact of state access restrictions.
    diligencePath: >-
      Obtain management accounts and exchange telemetry segmented by product, state, retail versus institution, and
      maker versus taker.
    relatedQuestionRefs:
      - QM006
      - QM008
    relatedTableRefs:
      - TM001
      - TM002
  - type: private-evidence-only
    severity: material
    topic: institutional-adoption
    missingEvidence: >-
      Institutional client activity distribution, contract value, retention, and documented budget ownership behind the
      1,000-plus client claim.
    whyItMatters: >-
      A client count without usage or economics cannot establish durable enterprise demand or a separate institutional
      SAM.
    diligencePath: >-
      Review anonymized client cohorts, executed commercial terms, usage concentration, and reference calls across
      hedging, trading, and data use cases.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: institutional-market-share
    missingEvidence: >-
      Audited institutional trading volume breakdown comparing Kalshi's institutional API volume against crypto-native
      OTC venues.
    whyItMatters: >-
      Determines whether Kalshi's regulated DCM status creates a durable institutional liquidity moat beyond retail
      sports and political speculation.
    diligencePath: >-
      Request institutional trade reporting data, clearinghouse settlement figures, and partner broker volume splits
      during management meetings.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: profitability-and-cost-structure
    missingEvidence: >-
      Audited GAAP financial statements covering FY2025 and 1H 2026, detailing cost of goods sold, cloud infrastructure
      costs, customer acquisition costs, and EBITDA.
    whyItMatters: >-
      Without audited operating expenses, it is impossible to verify whether Kalshi is operating cash-flow positive or
      burning venture reserves on user acquisition and compliance litigation.
    diligencePath: >-
      Request historical audited income statements, management accounts, and unit-level contribution margin schedules
      during management meetings.
  - id: GI001
    type: missing-source
    severity: material
    topic: channel-economics
    missingEvidence: >-
      Detailed revenue-share and exclusivity agreements between Kalshi and distribution partners (Robinhood, Webull,
      PrizePicks).
    whyItMatters: >-
      Clarifies distribution margin compression and the exact notice periods or minimum commitments governing
      Robinhood's potential migration to MIAXdx.
    diligencePath: Review commercial distribution contracts and partnership termination triggers in the virtual data room.
  - type: private-evidence-only
    severity: material
    topic: matching-engine-benchmarks
    missingEvidence: >-
      Third-party deterministic benchmark audit reporting 99th and 99.9th percentile order matching latencies and peak
      message throughput per second under stressed market conditions.
    whyItMatters: >-
      Independent latency distribution data is required to verify whether Kalshi can reliably support institutional
      market makers and prevent order queue congestion during extreme breaking news events.
    diligencePath: >-
      Request production performance telemetry, stress-testing audit reports, and historical matching engine SLA metrics
      from Kalshi's technical operations team.
    relatedQuestionRefs:
      - QE003
    relatedTableRefs:
      - TE001
  - id: GE002
    type: missing-source
    severity: material
    topic: perpetual-futures-liquidation-mechanics
    missingEvidence: >-
      Detailed technical specification of the automated margin liquidation engine, insurance fund capitalization, and
      ADL (auto-deleveraging) cascade rules for perpetual futures.
    whyItMatters: >-
      Without public margin liquidation documentation, the risk of exchange bad debt accumulation during extreme crypto
      market flash crashes cannot be assessed.
    diligencePath: >-
      Review full product documentation, margin rules, and clearinghouse risk models for Kalshi Perps directly with
