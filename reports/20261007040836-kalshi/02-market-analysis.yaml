callouts:
  - calloutType: "risk"
    title: "Notional volume is not economic spend"
    body: "Matched trades can count entries, exits, and repeated turnover. The available public figures therefore cannot be converted into customer handle, revenue, or TAM without product-level fees, unique funded accounts, and capital-at-risk data."
    claimRefs:
      - "CM011"
      - "CM012"
      - "CM016"
  - calloutType: "insight"
    title: "Liquidity is both driver and diligence target"
    body: "A larger venue can attract more participants and improve execution, but aggregate volume does not reveal concentration by market makers, products, or jurisdictions. Durable network effects require evidence on active counterparties and retention."
    claimRefs:
      - "CM008"
      - "CM011"
      - "CM016"
