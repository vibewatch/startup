chapter:
  number: 2
  title: "Market Analysis"
  summary: "Kalshi spans CFTC-regulated event contracts and a planned move into U.S. perpetual futures, but the available evidence supports activity lenses rather than a spend- or revenue-based TAM/SAM/SOM. Rapid company-reported scale and liquidity-network effects are offset by volume-versus-handle comparability problems, negative participant returns, and state enforcement that can remove geographic access."
sections:
  - id: "market-boundary"
    title: "Market Boundary and Adjacencies"
    body: "The defensible core market is exchange-traded binary event contracts, not the sum of gambling and derivatives markets. CEPR describes a quote-driven order book with Yes and No contracts priced from 1 to 99 cents and a $1 settlement to the correct side; it also notes that U.S. regulation historically limited event scope and stake size [CM001, CM002]. Kalshi's institutional materials broaden the buyer job set to hedging, price discovery, trading, market making, arbitrage, and data [CM006]. Perpetual futures are an adjacency rather than current event-contract TAM: Kalshi announced planned U.S. crypto perpetuals subject to regulatory review and explicitly excluded agricultural commodity perpetuals [CM007]. Sportsbooks, surveys, and proxy derivatives remain substitutes, but the assigned evidence does not quantify substitution or customer spend [CM016]."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM006"
      - "CM007"
      - "CM016"
    tableRefs:
      - "TM001"
  - id: "evidence-constrained-sizing"
    title: "Evidence-Constrained Sizing"
    body: "The public metrics are not directly comparable. Kalshi claims more than $500 billion of annualized platform volume and 20-fold year-over-year growth [CM003], while CryptoRank reports $100 billion of annual volume and 400% growth [CM010], and VNTR reports more than $1 billion of weekly volume and 1,000% year-over-year growth [CM009]. The sources do not align product scope, measurement date, or averaging window. More importantly, trading volume is not customer handle, spend, or revenue: a competitor-authored industry analysis says every matched trade adds notional volume, including exits and repeated trading [CM011]. Its Masters example converts $87 million of volume into only $4 million to $17 million of estimated customer risk using Sporttrade's 5%-20% golf range [CM012]. That event-specific range cannot be extrapolated into Kalshi-wide SAM or SOM [CM016]."
    claimRefs:
      - "CM003"
      - "CM009"
      - "CM010"
      - "CM011"
      - "CM012"
      - "CM016"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyers-and-adoption"
    title: "Buyer Segments and Adoption Mechanics"
    body: "Kalshi claims more than 1,000 institutional clients, 8,000 live markets, and one billion annual trades [CM004, CM005]. Its institutional positioning identifies several distinct users: risk owners seeking a direct event hedge, traders expressing directional views, market makers supplying liquidity, arbitrageurs trading dislocations, and analysts consuming market-implied probabilities [CM006]. These jobs imply different payers and budget owners, so a single consumer-betting TAM would be misleading. VNTR argues that liquidity can create a winner-take-most network effect because a venue becomes more attractive as participation improves [CM008]. Yet CEPR's analysis of more than 300,000 contracts finds favorite-longshot bias and materially negative average returns, especially for takers, creating a trust and retention constraint alongside the liquidity benefit [CM013]."
    claimRefs:
      - "CM004"
      - "CM005"
      - "CM006"
      - "CM008"
      - "CM013"
    tableRefs:
      - "TM003"
  - id: "adoption-constraints"
    title: "Regulatory and Measurement Constraints"
    body: "Federal exchange status does not eliminate state-level adoption risk. New York sued Kalshi in July 2026, alleging an unlicensed gambling operation and seeking an operating stop, forfeiture, restitution, and penalties [CM014]. Michigan then obtained a preliminary injunction requiring geofencing of sports contracts, with a stated $500,000-per-day penalty for violations [CM015]. These actions can reduce reachable users and liquidity by jurisdiction even before final merits decisions. They also make an undifferentiated national SOM inappropriate. The decisive missing inputs are product- and state-level volume, unique funded accounts, net fees, institutional contract value, and retention. Without those denominators, the chapter can compare activity signals and constraints but cannot convert funding narratives or gross notional turnover into addressable spend, revenue, or cash generation [CM016]."
    claimRefs:
      - "CM014"
      - "CM015"
      - "CM016"
