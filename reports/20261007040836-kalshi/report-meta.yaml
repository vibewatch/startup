companyProfile:
  summary: >-
    Kalshi is a late-stage private, founder-led exchange that lets users trade yes/no contracts on real-world events and
    has expanded into institutional distribution, data licensing, and crypto perpetual futures. Public evidence supports
    a reported $22B Series F valuation and rapid revenue growth, but the company still withholds audited financials, a
    full capitalization waterfall, and complete governance disclosures while state-law challenges continue to threaten
    sports-market revenue.
