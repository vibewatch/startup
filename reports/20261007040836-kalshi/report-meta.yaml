  topStrengths:
    - CFTC-regulated exchange structure and designated-contract-market status provide a meaningful regulatory moat.
    - Revenue and trading activity have scaled quickly, with public sources citing a $4B annualized revenue run-rate.
    - Institutional distribution is broadening through data, compliance, and brokerage partnerships.
  topRisks:
    - Sports-market revenue is highly concentrated and exposed to ongoing state gaming enforcement and injunctions.
    - Audited financials, a full cap table, and the liquidation preference waterfall remain undisclosed.
    - A $22B valuation and reported $40B follow-on discussions already price in favorable legal outcomes.
  unresolvedGaps:
    - No audited FY2025 financials or Q1 2026 management accounts are publicly available.
    - The preference stack, liquidation waterfall, and common-equity value by share class remain undisclosed.
    - Robinhood partnership economics, exclusivity, and termination triggers are still not public.
    - Sports-contract revenue geography by state and contract type is not disclosed.
    - Federal preemption over state gaming laws is still being litigated and could reshape the core business.
