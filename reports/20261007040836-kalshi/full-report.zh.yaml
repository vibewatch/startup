        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公司依然明显由创始人主导。Tarek Mansour 是联合创始人兼 CEO，Luana Lopes Lara 是联合创始人兼
              COO。这一组合让产品、监管和运营决策保持连续性；两位创始人在创办公司前都被描述为金融分析师。与此同时，关键人物集中度可能较高：指定来源没有披露完整高管名单、董事会成员、独立董事占比、委员会结构、投票控制权、继任计划或重要领导层离职。缺少这些记录不等于治理控制薄弱，而是意味着仅凭这组证据无法评估治理质量和创始人控制风险，需要直接向公司索取尽调材料。
