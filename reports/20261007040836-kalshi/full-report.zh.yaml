  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻市场
        blocks:
          - type: paragraph
            body: >-
              可辩护的核心市场是交易所交易的二元事件合约，而不是赌博市场和衍生品市场的总和。CEPR 描述了一种报价驱动的订单簿：是和否合约价格为 1 至 99 美分，正确一方以 $1
              结算；它还指出，美国监管历史上限制了事件范围和下注金额 [CM001, CM002]。Kalshi 的机构材料把买方任务扩展到对冲、价格发现、交易、做市、套利和数据
              [CM006]。永续期货属于相邻市场，而不是当前事件合约 TAM：Kalshi 宣布计划推出受监管审查的美国加密货币永续合约，并明确排除农产品永续合约
              [CM007]。体育博彩、调查和代理衍生品仍是替代品，但指定证据没有量化替代程度或客户支出 [CM016]。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM016
