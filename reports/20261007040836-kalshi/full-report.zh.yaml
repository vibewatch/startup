  - id: FE001
    title: Kalshi 平台架构与执行栈
    type: stack
    summary: 分层架构图，展示客户端连接、交易所执行、清算机构结算和基础设施托管。
    data:
      layers:
        - label: 客户端与分销层
          detail: 面向零售用户、机构交易台和第三方算法开发者的外部接口
          items:
            - label: 消费者接口
              detail: 提供市场发现、下单和投资组合监控的网页应用及原生 iOS/Android 移动应用
            - label: 机构连接
              detail: Elwood US EMS/PMS 集成、直连 FIX 4.2/4.4 协议网关及机构托管清算账户
            - label: 开发者 API 与 SDK
              detail: REST API、WebSocket 事件流、Python 和 TypeScript SDK，以及 OpenAPI 和 AsyncAPI 模式定义
        - label: 交易所与执行核心层
          detail: 受 CFTC 监管的指定合约市场（DCM）撮合与市场管理系统
          items:
            - label: CLOB 撮合引擎
              detail: 中央限价订单簿在链下撮合限价单和市价单，延迟为个位数毫秒
            - label: 二元事件结构
              detail: 严格维持系列、事件及单个市场合约的 YES + NO = $1.00 平价不变量
            - label: 永续期货引擎
              detail: 持续执行无到期日的期货，并每 8 小时动态重算资金费率、管理保证金
        - label: 清算与结算层
          detail: 受 CFTC 监管的衍生品清算组织（DCO），管理抵押品、托管和结算
          items:
            - label: 账本与余额
              detail: 链下内部复式记账，跟踪用户美元余额、持仓和保证金分配
            - label: 结果裁定与预言机引擎
              detail: 依据预先认证的公开数据源和结算规则，自动及人工核验结果
            - label: 银行通道
              detail: 商业银行集成，支持 ACH 转账及当日电汇存取款
        - label: 基础设施与安全底座层
          detail: 云托管、分布式事件消息传递和监管合规监控
          items:
            - label: 云与容器基础设施
              detail: 通过 Terraform 配置 Amazon Web Services（AWS）基础设施，并在 Kubernetes 集群间编排
            - label: 分布式消息传递
              detail: Apache Kafka 事件总线，驱动实时市场数据广播和审计日志
            - label: 合规与安全控制
              detail: 自动化 KYC/AML 核验、按州实施的 IP/地理位置围栏，以及 SOC 2 安全保障
        - label: 网络与网关层
          detail: 公共 API 网关上的边缘路由、DDoS 缓解和入口负载均衡
          items:
            - label: API 网关与入口
              detail: 反向代理终止 TLS 连接，并将流量导向微服务
            - label: 速率限制器与配额
              detail: 令牌桶限流，保护撮合集群免受大流量洪泛
        - label: 数据持久化与审计层
          detail: 关系型状态存储、时间序列市场历史和不可篡改的审计日志
          items:
            - label: 关系型数据库集群
              detail: AWS RDS PostgreSQL 集群，管理交易账户、持仓和用户凭据
            - label: 合规档案库
              detail: 符合 CFTC 要求的不可篡改审计存储，保留订单生命周期和交易执行记录
    approximationNotes: 架构组件综合自 Kalshi 官方 API 规范、工程岗位描述和合作伙伴技术集成指南。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE007
      - CE008
      - CE012
  - id: FU001
    title: 零售与机构层级客户旅程图
    type: journey-map
    summary: 梳理 Kalshi 零售消费者和机构企业两个客群的入驻、激活、交易执行与留存触点。
    data:
      items:
        - label: 阶段 1：获客与发现
          stage: 获客
          touchpoints:
            - 零售：Public 券商内嵌提示、世界杯联合品牌活动和选举媒体报道
            - 机构：企业直销触达，并通过 Comply 集成合规技术
        - label: 阶段 2：入驻与 KYC
          stage: 入驻
          touchpoints:
            - 零售：移动应用 KYC 核验、ACH 账户入金和市场浏览
            - 机构：机构入驻、CFTC 监管文件和 API 密钥配置
        - label: 阶段 3：市场发现与规模判断
          stage: 发现
          touchpoints:
            - 零售：浏览热门政治、体育和文化事件合约
            - 机构：消费实时概率数据流，并用历史 API 回测
        - label: 阶段 4：订单执行与交易
          stage: 交易与执行
          touchpoints:
            - 零售：围绕体育、政治和宏观系列自主下 YES/NO 订单
            - 机构：低延迟算法做市、永续期货对冲和大宗订单
        - label: 阶段 5：投资组合集成与信号
          stage: 集成
          touchpoints:
            - 零售：AI 代理在 Public 上自动触发投资组合操作，并监控市场概率
            - 机构：针对通胀、降息和监管事件进行跨资产风险对冲
        - label: 阶段 6：扩张与留存
          stage: 扩张与留存
          touchpoints:
            - 零售：通过突发新闻提醒和新的季节性体育/选举赛程重新激活用户
            - 机构：扩展直接事件对冲，消费定制数据并开展合规监控
    approximationNotes: 旅程阶段刻画合作伙伴新闻稿、机构门户规范和交易所用户文档所记录的定性工作流机制。
    claimRefs:
      - CU004
      - CU007
      - CU008
      - CU009
