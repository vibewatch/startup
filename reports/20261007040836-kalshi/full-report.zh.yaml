            body: >-
              Kalshi 的客户持续性面临重大逆风，原因是零售参与者与机构流动性提供者之间存在结构性表现差异 [CU002, CU008]。Roosevelt Institute 的实证研究显示，从 2021 年 7
              月上线到 2026 年 5 月，普通用户在 Kalshi 上亏损超过 $500M，亏损主要集中于体育博彩合约
              [CU002]。预测平台上的零售交易者系统性跑输成熟做市商；后者使用自动定价算法和低延迟基础设施，攫取执行价差和错价收益 [CU002,
              CU008]。系统化宏观交易者可以利用相对经济基准的情绪偏差，实现稳定的两位数季度回报；自主零售参与者则经常获得负净回报 [CU008]。如果零售资本损耗导致休闲事件交易者快速流失，Kalshi
              就必须依靠外部分销合作伙伴持续补充零售客户，或把平台交易量转向机构风险对冲。
            claimRefs:
              - CU002
              - CU008
      - number: '6.5'
        title: 图表与要点
        blocks:
          - type: callout
            title: 零售交易者亏损集中与流失动态
            body: >-
              独立数据分析显示，2021 年 7 月至 2026 年 5 月，Kalshi 零售参与者累计净亏损超过
              五亿美元，主要发生在体育合约上。由于交易利润高度集中于成熟的高频算法手中，休闲消费者留存成为重大结构性脆弱点，需要持续营销和合作伙伴主导的漏斗顶部获客。
            calloutType: risk
            claimRefs:
              - CU002
          - type: callout
            title: 通过 Public 实现的嵌入式券商分销
            body: Kalshi 与 Public 的集成让外部零售投资者可以通过成熟券商界面交易事件合约，同时利用 Kalshi 的市场隐含概率作为传统资产类别的自动决策信号，显著降低零售用户获客摩擦。
            calloutType: strength
            claimRefs:
              - CU009
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律优先管辖权风险
        blocks:
          - type: paragraph
            body: >-
              Kalshi
              持有商品期货交易委员会授予的指定合约市场牌照，并主张所有二元事件合约均属于《商品交易法》下联邦专属监管管辖。然而，州博彩委员会、检察长和主权部落国家强烈反驳联邦优先管辖权，认为它不能保护零售体育预测市场免受州赌博禁令约束。超过
              19 起联邦诉讼及多起州法院案件正在审理体育事件合约究竟是可许可的金融衍生品还是非法无牌体育博彩。尽管 Kalshi
              在明尼苏达州联邦法院获得初步禁令，阻止执行州预测市场禁令，其他辖区仍施加限制性制裁。最关键的是，纽约州检察长于 2026 年 7
              月提起执法行动，要求没收全部利润、向消费者赔偿并处三倍法定罚金，金额可能达到数百亿美元。在密歇根已强制设置州级地理围栏、每天面临 50 万美元罚款，华盛顿又执行法院命令的禁用措施之际，Kalshi
              面临可能瓦解全国零售运营模式的生存性法律割裂。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR010
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
      - number: '7.2'
        title: 运营完整性与市场机制
        blocks:
          - type: paragraph
            body: >-
              除辖区诉讼外，Kalshi 还面临合约结算机制、市场完整性执法和客户开户合规方面的重大运营风险。与易变的地缘政治或体育事件挂钩的二元事件合约，经常考验结算条款的边界。2026 年初，伊朗最高领袖 Ali
              Khamenei 去世后，语法含混的合约规格引发广泛争议，Kalshi 被迫冻结五千四百万美元的交易量，并向用户退还
              2.2M。市场监控和内幕交易防范也带来结构性挑战：联邦监管机构指控一名军人利用机密政府情报在政治预测市场进行内幕交易；多名高知名度公众人物则因试图操纵合约结算结果而被封禁和处罚。同时，激进的获客举措——包括历史上针对
              18–20 岁大学生的校园大使活动——受到州消费者保护法的严格审查，带来声誉风险和更高合规成本。
            claimRefs:
              - CR008
              - CR012
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR008
              - CR012
              - CR014
              - CR015
      - number: '7.3'
        title: 合作伙伴集中度与收入持续性
        blocks:
          - type: paragraph
            body: >-
              Kalshi 的产品组合、分销管线和流动性架构存在严重战略集中。体育结果合约约占全部交易活动的九成，并贡献 2025 年平台总收入的
              八成九，使公司现金流极易受到州级体育博彩禁令或《商品交易法》下不利上诉先例的冲击。在分销侧，Kalshi 高度依赖其作为 Robinhood Markets
              预测市场中心后端执行基础设施的集成，以驱动零售获客和订单流。如果 Robinhood 因监管压力限制访问或拆分预测市场，Kalshi 的交易速度将大幅下降。此外，平台市场深度依赖机构流动性提供和与
              Susquehanna 等量化交易公司的做市协议，覆盖数千个活跃市场。Kalshi 已开始向受 CFTC
              监管的加密货币永续期货进行战略多元化，以进入主流机构衍生品市场，但相较成熟离岸场所，永续合约的商业势头仍处于早期且尚未验证。
            claimRefs:
              - CR007
              - CR009
              - CR010
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR007
              - CR010
              - CR013
      - number: '7.4'
        title: 风险综合、终止条件与热力图
        blocks:
          - type: paragraph
            body: >-
              评估 Kalshi
              的完整风险画像，可以看到一个不对称的风险回报方程：股权上行完全取决于联邦优先管辖权得到法律确认。在我们的分析框架下，首要投资逻辑破坏触发点，是巡回法院出现明确分歧或最高法院裁定体育事件合约依据州法属于非法博彩；这会立即消灭当前绝大部分交易收入。次级终止条件包括把地理围栏要求扩展到加利福尼亚或得克萨斯等高交易量州、Robinhood
              单方面终止零售分销渠道，或足以危及公司偿付能力的惩罚性监管赔偿令。潜在投资者的确认性尽调必须绕开顶线交易量这一虚荣指标，严格关注逐州净收入贡献、法律准备金充足度，以及非体育产品线上的机构流动性承诺。
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR008
              - CR009
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR008
              - CR009
              - CR012
              - CR013
      - number: '7.5'
        title: 图表与要点
        blocks:
          - type: callout
            title: 二元优先管辖权悬崖
            body: >-
              Kalshi 的商业模式高度依赖体育合约，这些合约贡献约九成的交易活动。如果联邦上诉法院或最高法院裁定体育事件合约属于非法博彩而非受联邦优先管辖保护的衍生品，Kalshi
              将立即失去收入规模，并在多个辖区面临严重法定损害赔偿。
            calloutType: risk
            claimRefs:
              - CR002
              - CR007
          - type: callout
            title: 永续期货作为战略对冲
            body: Kalshi 于 2026 年 5 月扩展到受 CFTC 监管的加密货币永续期货，直接尝试把产品交易量从脆弱的二元体育合约分散到传统衍生品资产类别。
            calloutType: insight
            claimRefs:
              - CR009
              - CR010
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Kalshi 的核心投资逻辑建立在其独特监管地位之上：它是首个也是领先的受 CFTC 监管、专为零售事件合约打造的指定合约市场。Kalshi
              把现实世界预测构造成在联邦监管下清算的二元衍生品，由此建立机构和零售合法性，推动年化交易量从 $52B 增至 $178B，并达到估计 $4B 的年化收入运行率，毛利率约 90%。与 Robinhood
              等零售券商的分销合作证明了前所未有的消费者需求，把月度交易量推向 $17B。除此之外，联邦储备研究人员的同行评审分析确认，Kalshi 事件市场能产生传统金融调查无法复制、分布信息丰富且高频的宏观经济基准。


              反向逻辑则集中于极端法律脆弱性和收入集中。Kalshi 把自己定位为联邦衍生品场所，但其顶线快速扩张很大程度由零售体育合约和串关式组合推动。州监管机构和检察长拒绝联邦优先管辖权论点，指控 Kalshi
              经营无牌赌博场所。2026 年 9 月，密歇根获得初步禁令，要求对 Kalshi 体育投注严格设置地理围栏，违规每天罚款
              $500,000；纽约州检察长则起诉要求完全停止运营并赔偿。如果联邦法院裁定事件合约不优先于州博彩法规，Kalshi 可能失去交易速度最高的零售辖区，引发交易量和估值倍数严重收缩。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV008
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV010
      - number: '8.2'
        title: 融资历史与资本结构背景
        blocks:
          - type: paragraph
            body: >-
              Kalshi 的融资轨迹是现代金融科技领域最陡峭的上升曲线之一。公司于 2025 年 12 月完成由 Paradigm 领投、估值 $11B 的 $1B E 轮融资，随后在 2026 年 5 月迅速完成由
              Coatue Management 领投、估值 $22B 的 $1B F 轮融资，使已披露机构轮次的累计股权融资约达 $2.8B。 2026 年年中近期报道显示，Kalshi 正在积极敲定另一轮融资，预计 IPO
              前估值约 $40B；Sequoia Capital 和 Wellington Management 等一线投资方参与其中。


              然而，这种快速重估也带来显著的结构复杂性和估值悬置。累计约 $2.8B 的优先股堆叠意味着后期投资者持有大量清算优先权和结构性保护，而初级股权和普通股股东并不享有同等权利。私募估值从 2025 年年中 $2B
              依次升至 $11B、$22B，并可能达到 $40B，意味着股权价格已计入监管顺利解决、交易量持续扩张等近乎完美的情景。由于无法公开取得经审计的 FY2025
              财务数据或股权结构表的股份类别条款，投资者无法核实普通股每股内在价值或下轮融资转换比例。
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV007
              - CV008
              - CV010
              - CV011
      - number: '8.3'
        title: 情景分析与尽调关口
        blocks:
          - type: paragraph
            body: >-
              为评估 Kalshi 经风险调整后的回报画像，我们围绕 2026—2028 年构建乐观、基准和悲观估值情景。乐观情景下，联邦法院确认 CFTC
              对州级博彩执法具有监管优先权；机构对宏观和大宗商品对冲合约的采用加速；Kalshi 成功以 $45B—$60B 估值 IPO，对应远期净收入 12x—15x 的溢价交易所倍数。基准情景下，各州诉讼持续拉锯，迫使
              Kalshi 对数个关键司法辖区实施地理围栏；增长放缓至交易所平均水平，Kalshi 的合理估值为 $20B—$24B（远期年化运行率 5x—6x），大致相当于其 F 轮基准。


              悲观情景下，密歇根、纽约或联邦上诉巡回法院作出不利裁决，剥夺 Kalshi 在体育赛事合约上的州法优先权，迫使公司大范围设置地理围栏并面临法定罚款。届时交易量将大幅收缩，零售经纪分销放缓，倍数压缩把企业价值降至
              $8B—$10B，并严重稀释后期普通股。鉴于法律结果的二元分化，我们给出“继续研究”的总体建议，并评定风险高、估值偏紧；在投入成长资本前，必须明确核实股权结构表的分配瀑布和法律催化剂。
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV010
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV007
              - CV008
              - CV010
              - CV012
              - CV015
      - number: '8.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 二元监管风险威胁估值倍数
            body: >-
              Kalshi 私募市场估值大幅升至 $22B，且据报道 IPO 前讨论估值为 $40B，这一估值假设 CFTC
              管辖下全国零售体育博彩顺畅开展。若州博彩法被认定不受联邦法优先适用，密歇根和纽约州法院的禁令将对交易量运行率构成生死攸关的威胁。
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV010
          - type: callout
            title: 资本配置指引
            body: 机构投资者应继续对 Kalshi 普通股和二级股权保持“继续研究”态度。资本投入应以州博彩监管优先权获得司法澄清，以及完整披露 E/F 轮清算分配瀑布为前提。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV011
              - CV015
