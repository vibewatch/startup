      - number: '2.2'
        title: 受证据约束的市场规模测算
        blocks:
          - type: paragraph
            body: >-
              公开指标不能直接比较。Kalshi 声称平台年化交易量超过 $500B、同比增长 20 倍 [CM003]；CryptoRank 报告年交易量 $100B、增长 400% [CM010]；VNTR
              报告周交易量超过 $1B、同比增长 1,000%
              [CM009]。这些来源在产品范围、计量日期和平均窗口上并不一致。更重要的是，交易量不等于客户下注额、支出或收入：一份竞争者撰写的行业分析指出，每笔撮合交易都会增加名义交易量，包括退出和重复交易
              [CM011]。其 Masters 示例把 $87M 交易量换算为仅 $4M 至 $17M 的估计客户风险敞口，采用 Sporttrade 高尔夫 5%–20% 区间 [CM012]。这一区域性事件区间不能外推为
              Kalshi 全公司的 SAM 或 SOM [CM016]。
            claimRefs:
              - CM003
