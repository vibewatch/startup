      - number: '3.3'
        title: 定价经济学、分销渠道与监管风险
        blocks:
          - type: paragraph
            body: >-
              交易摩擦和分销合作伙伴关系会显著影响场所选择与用户留存。Kalshi 采用按概率加权的费率表：接受者费用按合约价格乘以其反向价格计算，基准为 7 美分，50/50 合约最高达 1.75%；做市商费用为接受者费用的
              25%，在特定活跃交易层级下的挂单限价单则为 0%。Polymarket 按资产类别动态收取接受者费用：加密货币市场最高 1.80%，体育市场
              0.75%，地缘政治和世界事件合约不收费。相比之下，PredictIt 从毛利润中抽取 10%，提现再收 5%，对盈利交易形成超过 14% 的严重结构性拖累。


              分销能力是竞争持久性的关键决定因素。Kalshi 与 Robinhood 的嵌入式合作让事件合约触达 Robinhood 的注资券商账户，带来纯预测应用难以独立复制的分销规模。然而，Kalshi
              的商业模式正面临州级严重不利法律逆风。CFTC 依据《商品交易法》（CEA）主张联邦优先管辖权，且获第三巡回法院关于新泽西州案件的裁决支持；但州检察长和博彩委员会已发起积极执法。2026 年 7
              月，纽约州检察长与州长 Hochul 起诉 Kalshi，指控其经营非法、无牌体育博彩平台，要求赔偿并处三倍罚款。同样在 2026 年 9 月，密歇根州检察长 Dana Nessel
              获得初步禁令，要求设置地理围栏，阻止密歇根居民参与 Kalshi 体育投注，违规每天罚款 $500,000。由于体育合约占零售交易需求和费用收入的绝大多数，这些州级禁令带来重大运营不确定性，并可能割裂
              Kalshi 的国内可服务市场。
