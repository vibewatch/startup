      - number: '2.3'
        title: 买方分层与采用机制
        blocks:
          - type: paragraph
            body: >-
              Kalshi 声称拥有超过 1,000 家机构客户、8,000 个活跃市场和 10 亿笔年交易 [CM004,
              CM005]。其机构定位列出多类不同用户：寻找直接事件对冲的风险负责人、表达方向观点的交易者、提供流动性的做市商、交易错价的套利者，以及消费市场隐含概率的分析师
              [CM006]。这些任务对应不同付款方和预算负责人，因此用单一消费者博彩 TAM 会产生误导。VNTR 认为，随着参与度提升，场所更具吸引力，流动性可能形成赢家通吃的网络效应 [CM008]。但 CEPR 对超过
              300,000 份合约的分析发现，存在热门—冷门偏差，平均回报显著为负，接受者尤其如此；这在流动性收益之外又形成了信任和留存约束 [CM013]。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM011
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: 监管与衡量约束
        blocks:
          - type: paragraph
            body: >-
              联邦交易所地位并不能消除州级采用风险。纽约州于 2026 年 7 月起诉 Kalshi，指控其经营无牌赌博，并寻求停止运营、没收、赔偿和罚金
              [CM014]。随后密歇根州获得初步禁令，要求对体育合约设置地理围栏，违规每天罚款 $500,000 [CM015]。即使最终实体裁决尚未作出，这些行动也会按辖区减少可触达用户和流动性，并使未经区分的全国 SOM
              不再合适。关键缺失输入包括产品和州级交易量、独立注资账户数、净费用、机构合约价值和留存率。没有这些分母，本章只能比较活动信号和约束，不能把融资叙事或毛名义周转额换算成可服务支出、收入或现金创造 [CM016]。
            claimRefs:
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 图表与要点
        blocks:
          - type: callout
            title: 名义交易量不是经济支出
            body: 撮合交易可能同时计入入场、退出和重复周转。因此，没有产品级费率、独立注资账户和风险资本数据，现有公开数字不能换算成客户下注额、收入或 TAM。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM016
          - type: callout
            title: 流动性既是增长驱动，也是尽调对象
            body: 更大的场所可以吸引更多参与者并改善执行，但总交易量无法显示做市商、产品或辖区的集中度。要证明网络效应持久，需要活跃交易对手和留存证据。
            calloutType: insight
            claimRefs:
              - CM008
              - CM011
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与市场结构
        blocks:
          - type: paragraph
            body: >-
              预测市场和事件合约行业在 2025 和 2026 年大幅扩张：2025 年总交易量超过 $50B，月度交易量在 2026 年 1 月升至 $20B 以上。商业市场高度集中，Kalshi 与 Polymarket
              合计约占总交易量的 97.5%。在这对双寡头之外，竞争格局还包括 PredictIt 等在受限监管豁免下运营的传统政治预测网站、Manifold Markets 等虚拟货币预测平台，以及 Metaculus
              等依靠声誉的预测平台。此外，受监管新进入者不断涌入，包括 Robinhood 这样的零售券商事件合约界面，以及 FanDuel Predicts、DraftKings 等探索事件预测模式的商业体育博彩平台。


              Kalshi 的战略差异化来自其商品期货交易委员会（CFTC）指定合约市场（DCM）地位：通过受监管清算所基础设施，以美元清算交易。这让 Kalshi 能通过 ACH
              和电汇直接服务美国国内零售参与者，为机构对冲者和做市商提供 API 集成，并向 Robinhood 等零售券商分销合约。相比之下，Polymarket 的国际产品在 Polygon 区块链上运行，以 USDC
              作为抵押品；其美国国内产品要求严格身份验证，并通过获批中介以美元清算。PredictIt 等传统平台受法定投资上限和高额利润佣金约束，使商业流动性集中在 Kalshi 与 Polymarket。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
      - number: '3.2'
        title: 竞争者画像、规模与监管态势
        blocks:
          - type: paragraph
            body: >-
              对市场参与者的比较显示，各家的监管基础、产品范围和目标人群差异明显。Polymarket 于 2020 年上线，交易量从 2023 年的 $73M 增至 2024 年的
              $9B，覆盖政治、宏观经济、加密货币和文化市场，并保持最大的国际流动性池。其国际平台在 Polygon 区块链上使用中心限价订单簿（CLOB）；美国产品则在 CFTC 监管框架下运营并以美元结算。Kalshi 自
              2021 年上线，报告 2025 年名义交易量 $23.8B，并扩展到机构对冲和永续期货合约，机构客户超过 1,000 家，年化交易量指标达 $500B。


              二级竞争者服务于更专门的场景。PredictIt 自 2014 年起依据 CFTC 不采取行动函运营，几乎专注政治结果；但每份合约限额 $3,500，已实现利润收取 10% 高额费用，提现另收
              5%。非货币平台服务预测和研究，而非金融风险管理：Manifold Markets 提供社区创建、以虚拟游戏币 Mana 结算的市场；Metaculus 则为政策机构和研究团体汇总专家连续概率估计。
