chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Kalshi 于 2018 年由 Tarek Mansour 和 Luana Lopes Lara 创立，总部位于纽约市曼哈顿。其公开平台于 2021 年 7
              月上线。公司的核心不是做赌局对手方，而是运营交易所：参与者以点对点方式交易与现实事件是 / 否结果挂钩的合约。Kalshi 表示，其交易所和清算所实体受 CFTC
              监管；当前产品页面显示，业务范围已不止政治预测，还包括短期限外汇合约、上市公司 KPI
              预测、机构事件合约和永续期货。这种广度支持其交易所平台定位，但公司控制的页面只能证明产品可用，不能证明需求、盈利能力或监管持久性。
