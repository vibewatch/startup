            body: >-
              Kalshi 的发展轨迹把融资、产品扩张和机构分销结合起来，但法律依赖是公司概况的核心变量。Dealroom 报告称，体育业务占 2025 年收入近 90%；马萨诸塞州下级法院于 2026 年 1
