  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心交易架构与撮合引擎
        blocks:
          - type: paragraph
            body: >-
              Kalshi 的交易平台是中心化、受 CFTC
              监管的衍生品交易所和清算所，与去中心化自动做市商（AMM）或混合点对点协议有根本区别。计算核心是完全链下的中心限价订单簿（CLOB）撮合引擎，二元事件合约的互补头寸严格满足 YES + NO =
              $1.00。平台在链下撮合限价单和市价单，延迟为个位数毫秒，实现实时价格发现和紧密买卖价差，同时不承担区块链交易费、矿工可提取价值（MEV）或区块最终性延迟。Kalshi 运营两个不同的 CFTC
              监管法律和技术实体：负责撮合的指定合约市场（DCM），以及管理保证金、抵押品托管和结算的内部衍生品清算组织（DCO）。交易所基础设施构建在 Amazon Web Services（AWS）上，使用
              Kubernetes、Terraform 和 Apache Kafka 进行事件驱动的消息分发，并支持实时市场数据广播和审计日志。链下执行可为零售和算法做市商提供低于 15
              毫秒的头寸状态更新和可靠成交，但仍受中心化云吞吐量约束，达不到专用共址高频股票或期货交易场所的亚微秒延迟层级。
