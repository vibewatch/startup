      - - 交易量与规模化
        - 年化交易量达到 $178B，周交易量超过 $1B，显示零售和机构产品获得大规模采用。
        - 体育博彩和零售经纪商的交易量高度集中；若州级地理围栏成为强制要求，平台将容易受损。
        - 非体育的宏观、经济和企业事件合约交易量持续扩大，超过平台总交易量的 50%。
      - - 财务模型与利润率
