chapter:
  number: 7
  title: "Risks"
  summary: "Kalshi faces substantial downside exposure from multi-front state gambling enforcement actions challenging federal Commodity Exchange Act preemption over retail sports contracts. While federal courts have granted preliminary injunctive relief in select jurisdictions such as Minnesota, adverse state court rulings and mandatory geofencing orders in Washington and Michigan threaten to curtail the sports contracts that generate approximately ninety percent of platform volume and eighty-nine percent of revenue."
sections:
  - id: "regulatory-and-legal-preemption-exposure"
    title: "Regulatory and Legal Preemption Exposure"
    body: "Kalshi operates under a Designated Contract Market license granted by the Commodity Futures Trading Commission, asserting that all binary event contracts fall within exclusive federal regulatory jurisdiction under the Commodity Exchange Act. However, state gaming commissions, attorneys general, and sovereign tribal nations vigorously dispute that federal preemption shields retail sports prediction markets from state gambling prohibitions. Over nineteen federal lawsuits and multiple state court actions are actively litigating whether sports-based event contracts constitute permissible financial derivatives or illegal unlicensed sports betting. While Kalshi secured a preliminary injunction in Minnesota federal court preventing enforcement of a state prediction market ban, other jurisdictions have imposed restrictive sanctions. Most critically, the New York State Attorney General filed an enforcement action in July 2026 seeking complete profit forfeiture, consumer restitution, and treble statutory penalties that could total tens of billions of dollars. With state-level geofencing already mandated in Michigan under threat of daily half-million-dollar fines and court-ordered blackouts enforced in Washington, Kalshi confronts existential legal fragmentation that could dismantle its nationwide retail operating model."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR010"
      - "CR011"
    tableRefs:
      - "TR001"
  - id: "operational-integrity-and-market-mechanics"
    title: "Operational Integrity and Market Mechanics"
    body: "Beyond jurisdictional litigation, Kalshi encounters material operational risks in contract resolution mechanics, market integrity enforcement, and customer onboarding compliance. Binary event contracts tied to volatile geopolitical or sporting developments frequently test the boundaries of contract settlement terms. In early 2026, Kalshi was forced to freeze fifty-four million dollars in trading volume and issue 2.2 million dollars in user reimbursements after grammatically ambiguous contract specifications sparked widespread controversy following the death of Iranian supreme leader Ali Khamenei. Market surveillance and insider trading prevention present additional structural challenges: federal regulators charged a military servicemember with insider trading on political prediction markets using classified government intelligence, while high-profile public figures have been banned and penalized for attempting to manipulate contract settlement outcomes. Concurrently, aggressive customer acquisition initiatives—including historical campus ambassador campaigns targeting eighteen-to-twenty-year-old college students—have drawn intense regulatory scrutiny under state consumer protection statutes, creating reputational exposure and heightened compliance overhead."
    claimRefs:
      - "CR008"
      - "CR012"
      - "CR014"
      - "CR015"
    tableRefs:
      - "TR002"
  - id: "partner-concentration-and-revenue-durability"
    title: "Partner Concentration and Revenue Durability"
    body: "Kalshi exhibits severe strategic concentration in its product mix, distribution pipeline, and liquidity architecture. Event contracts tied to sporting outcomes represent roughly ninety percent of all trading activity and eighty-nine percent of total platform revenue in 2025, leaving corporate cash flows exceptionally vulnerable to state-level sports betting injunctions or an unfavorable appellate precedent under the Commodity Exchange Act. On the distribution side, Kalshi relies heavily on its integration as the backend execution infrastructure for Robinhood Markets' Prediction Markets Hub to drive retail user acquisition and order flow. Should Robinhood restrict access or unbundle prediction markets due to regulatory pressure, Kalshi's trading velocity would contract sharply. Furthermore, platform market depth depends on institutional liquidity provisioning and market-making agreements with quantitative trading firms like Susquehanna across thousands of live markets. While Kalshi has initiated strategic diversification into CFTC-regulated cryptocurrency perpetual futures to enter mainstream institutional derivatives, commercial traction in perpetual contracts remains early and unproven relative to established offshore venues."
    claimRefs:
      - "CR007"
      - "CR009"
      - "CR010"
      - "CR013"
    tableRefs:
      - "TR003"
  - id: "risk-synthesis-and-investment-implications"
    title: "Risk Synthesis, Kill Criteria, and Heatmap"
    body: "Evaluating Kalshi's comprehensive risk profile reveals an asymmetrical risk-reward equation where equity upside is contingent on total legal vindication of federal preemption. Under our analytical framework, the primary thesis-break trigger is a definitive circuit split or Supreme Court ruling determining that sports event contracts constitute unlawful gaming under state laws, which would immediately eliminate the vast majority of current transaction revenue. Secondary kill criteria include expanding geofencing mandates to high-volume states such as California or Texas, unilateral termination of the Robinhood retail distribution channel, or punitive regulatory restitution orders that jeopardize corporate solvency. For prospective investors, confirmatory diligence must bypass top-line trading volume vanity metrics and focus rigorously on state-by-state net revenue contributions, legal reserve adequacy, and institutional liquidity commitments across non-sports product lines."
    claimRefs:
      - "CR002"
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR013"
    figureRefs:
      - "FR001"
