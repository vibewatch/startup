  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Adjacencies
        blocks:
          - type: paragraph
            body: >-
              The defensible core market is exchange-traded binary event contracts, not the sum of gambling and
              derivatives markets. CEPR describes a quote-driven order book with Yes and No contracts priced from 1 to
              99 cents and a $1 settlement to the correct side; it also notes that U.S. regulation historically limited
              event scope and stake size [CM001, CM002]. Kalshi's institutional materials broaden the buyer job set to
              hedging, price discovery, trading, market making, arbitrage, and data [CM006]. Perpetual futures are an
              adjacency rather than current event-contract TAM: Kalshi announced planned U.S. crypto perpetuals subject
              to regulatory review and explicitly excluded agricultural commodity perpetuals [CM007]. Sportsbooks,
              surveys, and proxy derivatives remain substitutes, but the assigned evidence does not quantify
              substitution or customer spend [CM016].
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
