  - id: FE001
    title: Kalshi Platform Architecture and Execution Stack
    type: stack
    summary: >-
      Layered architecture map depicting client connectivity, exchange execution, clearinghouse settlement, and
      infrastructure hosting.
    data:
      layers:
        - label: Client & Distribution Layer
          detail: External interfaces for retail users, institutional desks, and third-party algorithmic developers
          items:
            - label: Consumer Interfaces
              detail: >-
                Web application and native iOS/Android mobile apps providing discovery, order placement, and portfolio
                monitoring
            - label: Institutional Connectivity
              detail: >-
                Elwood US EMS/PMS integration, direct FIX 4.2/4.4 protocol gateways, and institutional custody clearing
                accounts
            - label: Developer APIs & SDKs
              detail: REST API, WebSocket event streams, Python and TypeScript SDKs, OpenAPI and AsyncAPI schemas
        - label: Exchange & Execution Core Layer
          detail: CFTC-regulated Designated Contract Market (DCM) matching and market management systems
          items:
            - label: CLOB Matching Engine
              detail: >-
                Central limit order book matching limit and market orders off-chain with single-digit millisecond
                latency
            - label: Binary Event Structuring
              detail: >-
                Maintains strict parity invariant YES + NO = $1.00 across series, events, and individual market
                contracts
            - label: Perpetual Futures Engine
              detail: >-
                Continuous non-expiring futures execution with 8-hour dynamic funding rate recalculation and margin
                controls
        - label: Clearing & Settlement Layer
          detail: CFTC-regulated Derivatives Clearing Organization (DCO) managing collateral, custody, and settlement
          items:
            - label: Ledger & Balances
              detail: Off-chain internal double-entry accounting tracking user USD balances, positions, and margin allocations
            - label: Resolution & Oracle Engine
              detail: >-
                Automated and manual resolution verification based on pre-certified public data sources and settlement
                rules
            - label: Banking Rails
              detail: Commercial banking integrations facilitating ACH transfers and same-day wire deposits and withdrawals
        - label: Infrastructure & Security Foundation Layer
          detail: Cloud hosting, distributed event messaging, and regulatory compliance monitoring
          items:
            - label: Cloud & Container Fabric
              detail: >-
                Amazon Web Services (AWS) infrastructure provisioned via Terraform and orchestrated across Kubernetes
                clusters
            - label: Distributed Messaging
              detail: Apache Kafka event bus powering real-time market data broadcasting and audit logging
            - label: Compliance & Security Controls
              detail: >-
                Automated KYC/AML verification, geographic state-level IP/geolocation fencing, and SOC 2 security
                safeguards
        - label: Network & Gateway Layer
          detail: Edge routing, DDoS mitigation, and ingress load balancing across public API gateways
          items:
            - label: API Gateway & Ingress
              detail: Reverse proxy terminating TLS connections and directing traffic to microservices
            - label: Rate Limiter & Quotas
              detail: Token-bucket throttling protecting matching clusters from volumetric flooding
        - label: Data Persistence & Audit Tier
          detail: Relational state storage, time-series market histories, and immutable audit logging
          items:
            - label: Relational Database Cluster
              detail: AWS RDS PostgreSQL clusters managing transactional accounts, positions, and user credentials
            - label: Compliance Archive
              detail: CFTC-compliant immutable audit store retaining order lifecycles and trade executions
    approximationNotes: >-
      Architectural components synthesized from official Kalshi API specifications, engineering job descriptions, and
      partner technical integration guides.
