            title: Distribution Channel Dependency on Robinhood
            body: >-
              Robinhood users have driven more than 50% of Kalshi's platform volume during peak trading cycles. With
              Robinhood having acquired CFTC-licensed exchange and clearinghouse MIAXdx, Kalshi faces the structural
              threat of customer migration to a competing in-house venue, which would compress distribution margins and
              trading velocity.
            calloutType: insight
            claimRefs:
