        title: Hyper-Scaling Trading Velocity, Sports Skew, and Distribution Economics
        blocks:
          - type: paragraph
            body: >-
              Kalshi's reported commercial traction has expanded rapidly from tens of millions in 2024 to hundreds of
              millions in net revenue in 2025, reaching multibillion-dollar annualized run-rate claims during
              event-heavy peaks in 2026. However, top-line growth is overwhelmingly driven by sports event contracts,
