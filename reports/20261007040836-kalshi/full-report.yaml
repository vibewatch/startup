              - CM014
              - CM015
              - CM016
      - number: '2.2'
        title: Evidence-Constrained Sizing
        blocks:
          - type: paragraph
            body: >-
              The public metrics are not directly comparable. Kalshi claims more than $500 billion of annualized
              platform volume and 20-fold year-over-year growth [CM003], while CryptoRank reports $100 billion of annual
              volume and 400% growth [CM010], and VNTR reports more than $1 billion of weekly volume and 1,000%
              year-over-year growth [CM009]. The sources do not align product scope, measurement date, or averaging
              window. More importantly, trading volume is not customer handle, spend, or revenue: a competitor-authored
              industry analysis says every matched trade adds notional volume, including exits and repeated trading
              [CM011]. Its Masters example converts $87 million of volume into only $4 million to $17 million of
              estimated customer risk using Sporttrade's 5%-20% golf range [CM012]. That event-specific range cannot be
              extrapolated into Kalshi-wide SAM or SOM [CM016].
