      - number: '5.2'
        title: Product Lines, Perpetual Futures, and Developer Surfaces
        blocks:
          - type: paragraph
            body: >-
              Kalshi's product catalog has expanded beyond discrete binary event contracts into continuous derivatives
              through the launch of American onshore perpetual futures contracts. While event contracts cover binary
              outcomes across economics, politics, financials, culture, and sports organized in a strict hierarchy of
              series, events, and markets, perpetual futures introduce continuous non-expiring margin contracts with
              eight-hour funding rates. This product expansion transforms Kalshi from an episodic prediction venue into
              a full-service derivatives exchange. To support programmatic market participants, institutional liquidity
              providers, and third-party interface builders, Kalshi exposes an institutional developer surface
              encompassing REST, WebSocket, and Financial Information eXchange (FIX) protocols. For retail and fintech
              integrations, REST endpoints facilitate catalog browsing, portfolio inspection, and order lifecycle
              management authenticated via RSA-PSS signatures and API key tokens. High-throughput market data streaming
              is delivered via WebSockets, while institutional algorithmic desks utilize the industry-standard FIX
              protocol for lowest-latency order submission and execution confirmations. Kalshi also maintains sandbox
              demo environments and OpenAPI/AsyncAPI specifications, allowing external developers and fintech brokerage
              partners to embed event-contract order books into their own consumer applications.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE007
              - CE008
              - CE009
              - CE011
              - CE013
      - number: '5.3'
        title: Settlement Mechanics, Institutional Workflow, and Compliance Controls
        blocks:
          - type: paragraph
            body: >-
              Clearing and settlement on Kalshi run off-chain using fiat USD payment rails connected directly to
              domestic commercial banking systems via Automated Clearing House (ACH) transfers and wire transactions.
              Upon contractual market resolution governed by predetermined settlement rules and self-certified outcome
              feeds, the internal clearinghouse automatically computes payouts and credits winning account balances
              instantaneously, enabling immediate capital redeployment without the smart-contract redemption steps or
              token-merging friction inherent in crypto-native alternatives. At the institutional tier, Kalshi connects
              with external Execution Management Systems (EMS) and Portfolio Management Systems (PMS) such as Elwood
              Technologies, enabling digital asset quant desks, macro hedge funds, and prime brokers to model binary
              event risk, carry premium funded at prevailing interest rates, and route programmatic orders through
              pre-trade risk controls and whitelists. However, operating as a federally regulated DCM creates rigid
              operational boundaries: mandatory Know Your Customer (KYC) and Anti-Money Laundering (AML) identity
              verification is enforced across all accounts, and access has historically been restricted across eight
              U.S. states. Furthermore, state-level legal challenges—exemplified by enforcement actions from the New
              York Attorney General alleging unlicensed gambling and youth exposure—threaten the continuity of retail
              access in key jurisdictions and impose rigorous technical geofencing and compliance-monitoring obligations
              on Kalshi's infrastructure.
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE005
              - CE010
              - CE012
              - CE014
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Architectural Divergence Between Centralized and Decentralized Prediction Venues
            body: >-
              Kalshi's architectural choice to operate a centralized off-chain CLOB rather than an automated market
              maker (AMM) or on-chain smart contract protocol yields substantial performance advantages, including
              single-digit millisecond order matching, zero gas overhead, and instant fiat capital recycling. However,
              this model concentrates settlement and custody risk within Kalshi's internal clearinghouse, requiring
              participants to place absolute trust in the platform's proprietary resolution mechanisms and regulatory
              compliance perimeter.
            calloutType: insight
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE012
          - type: callout
            title: Regulatory Vulnerability of State-Level Geofencing and Retail Compliance
            body: >-
              While Kalshi's federal DCM designation provides national legal standing under the Commodity Exchange Act,
              state-level legal enforcement actions—such as the lawsuit by the New York Attorney General alleging
              unlicensed gambling and youth access—expose significant operational friction. Kalshi must maintain robust
              geographic fencing and age-verification mechanisms, as adverse state court rulings or injunctions can
              force sudden jurisdictional access cutoffs, impairing regional market liquidity.
            calloutType: risk
            claimRefs:
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Buyer Profiles
        blocks:
          - type: paragraph
            body: >-
              Kalshi's customer ecosystem is fundamentally bifurcated into direct retail traders and institutional
              market participants. Retail consumers interact primarily through mobile and web applications to trade
              binary event contracts on politics, economic releases, cultural milestones, and sports fixtures [CU001,
              CU002]. Within the retail segment, trading behavior varies between casual event bettors reacting to media
              cycles and systematic discretionary traders seeking statistical edges against public sentiment [CU008]. On
              the enterprise side, Kalshi categorizes institutional users into quantitative hedge funds, passive
              liquidity providers, corporate hedging entities, and distribution partners [CU005, CU007]. Corporate
              treasury and risk management teams utilize event contracts to hedge specific operational exposures, such
              as headline inflation benchmarks or interest rate decisions, directly rather than relying on imperfect
              traditional proxies [CU007]. Institutional adoption is supported by compliance monitoring integrations,
              such as partnerships with Comply and StarCompliance, which allow enterprise employers to track employee
              activity and enforce insider trading prohibitions across prediction markets and perpetual futures [CU004].
              This institutional infrastructure reflects Kalshi's strategic evolution from a retail-centric venue to a
              regulated derivatives exchange serving corporate and financial entities.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU007
              - CU008
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU004
              - CU007
              - CU008
              - CU009
          - type: figure
            figureRef: FU001
