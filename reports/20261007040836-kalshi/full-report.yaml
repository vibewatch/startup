        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              The business remains visibly founder-led. Tarek Mansour is identified as co-founder and CEO, while Luana
              Lopes Lara is identified as co-founder and COO. This pairing supplies continuity across product,
              regulatory, and operating decisions, and both founders were described as financial analysts before
              establishing the company. It also creates potential key-person concentration: the assigned sources do not
              disclose a complete executive roster, board membership, independent-director representation, committee
              structure, voting control, succession plan, or material leadership departures. The absence of those
              records is not evidence that governance controls are weak; it means governance quality and founder-control
              risk cannot be underwritten from this evidence set and require a direct company diligence package.
