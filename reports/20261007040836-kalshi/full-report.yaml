      - number: '4.3'
        title: Operating Cost Structure, Capital Runway, and Regulatory Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Kalshi maintains an asset-light exchange model with near-zero marginal cost per incremental contract
              cleared, reinforced by bringing clearing in-house through its CFTC-approved clearinghouse Kalshi Klear
              LLC. Nevertheless, fixed overhead has increased substantially following rapid workforce expansion toward
              490 employees and intensive consumer marketing during major cultural and sporting tournaments. Total
              lifetime financing raised across equity rounds and credit facilities approaches $2.8B to $3.3B, with the
              latest primary Series F valuation priced at $22 billion in April-May 2026. Despite substantial capital
              reserves, Kalshi provides no audited income statements, GAAP gross margins, or cash burn figures. Most
              critically, because the vast majority of fee revenue derives from sports contracts that face severe legal
              injunctions and criminal or civil enforcement across multiple state gaming authorities, forward cash-flow
              underwriting remains blocked by regulatory litigation risk.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Extensive Revenue Concentration in State-Contested Sports Contracts
            body: >-
              Between 75% and 87% of Kalshi's fee-generating volume derives from sports event wagering. Because state
              gaming regulators in New York, Michigan, Washington, and elsewhere have secured or sought injunctions
              alleging sports event contracts constitute unlicensed gambling under state law, a definitive adverse
              judicial ruling could eliminate up to three-quarters of the platform's revenue base.
            calloutType: risk
            claimRefs:
              - CI008
              - CI012
              - CI013
