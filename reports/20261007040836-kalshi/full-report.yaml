chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Kalshi was founded in 2018 by Tarek Mansour and Luana Lopes Lara and is headquartered in Manhattan, New
              York City. Its public platform launched in July 2021. The operating proposition is an exchange rather than
              a house taking the other side of wagers: participants trade peer-to-peer contracts tied to yes-or-no
              outcomes of real-world events. Kalshi says its exchange and clearinghouse entities are CFTC-regulated,
              while current product pages show a broader surface than political prediction alone, including
              short-duration foreign-exchange contracts, public-company KPI forecasts, institutional event contracts,
              and perpetual futures. That breadth supports an exchange-platform identity, but company-controlled pages
              establish availability rather than demand, profitability, or regulatory durability.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO006
              - CO016
