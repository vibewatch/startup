  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Trading Architecture and Matching Engine
        blocks:
          - type: paragraph
            body: >-
              Kalshi's trading platform is architected as a centralized, CFTC-regulated derivatives exchange and
              clearinghouse, distinguishing it fundamentally from decentralized automated market maker (AMM) or hybrid
              peer-to-peer protocols. At its computational core, Kalshi operates a fully off-chain Central Limit Order
              Book (CLOB) matching engine where binary event contracts are structured such that complementary positions
              strictly satisfy YES + NO = $1.00. The platform matches limit orders and market orders off-chain with
              deterministic single-digit millisecond latency, providing real-time price discovery and tight bid-ask
              spreads without exposure to blockchain transaction fees, miner-extractable value (MEV), or block finality
              delays. Kalshi operates two distinct CFTC-regulated legal and technical entities: a Designated Contract
              Market (DCM) executing order matching and an internal Derivatives Clearing Organization (DCO) managing
              margining, collateral custody, and settlement. The exchange infrastructure is engineered on Amazon Web
              Services (AWS) using Kubernetes, Terraform, and Apache Kafka for event-driven message distribution,
              supporting real-time market data broadcasting and audit logging. While off-chain execution provides
              sub-15ms position state updates and reliable trade execution for retail and algorithmic market makers, it
              remains bounded by centralized cloud throughput and does not reach the sub-microsecond latency tiers
              characteristic of dedicated collocated high-frequency equities or futures execution venues.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
