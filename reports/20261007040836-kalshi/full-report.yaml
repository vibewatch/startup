      - number: '2.4'
        title: Regulatory and Measurement Constraints
        blocks:
          - type: paragraph
            body: >-
              Federal exchange status does not eliminate state-level adoption risk. New York sued Kalshi in July 2026,
              alleging an unlicensed gambling operation and seeking an operating stop, forfeiture, restitution, and
              penalties [CM014]. Michigan then obtained a preliminary injunction requiring geofencing of sports
              contracts, with a stated $500,000-per-day penalty for violations [CM015]. These actions can reduce
              reachable users and liquidity by jurisdiction even before final merits decisions. They also make an
              undifferentiated national SOM inappropriate. The decisive missing inputs are product- and state-level
              volume, unique funded accounts, net fees, institutional contract value, and retention. Without those
              denominators, the chapter can compare activity signals and constraints but cannot convert funding
              narratives or gross notional turnover into addressable spend, revenue, or cash generation [CM016].
            claimRefs:
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Notional volume is not economic spend
            body: >-
              Matched trades can count entries, exits, and repeated turnover. The available public figures therefore
              cannot be converted into customer handle, revenue, or TAM without product-level fees, unique funded
              accounts, and capital-at-risk data.
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM016
          - type: callout
            title: Liquidity is both driver and diligence target
            body: >-
              A larger venue can attract more participants and improve execution, but aggregate volume does not reveal
              concentration by market makers, products, or jurisdictions. Durable network effects require evidence on
              active counterparties and retention.
