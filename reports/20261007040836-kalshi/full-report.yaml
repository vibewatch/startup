  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Market Structure
        blocks:
          - type: paragraph
            body: >
              The prediction market and event-contract sector experienced massive expansion through 2025 and 2026,
              reaching over $50 billion in total trading volume in 2025 with monthly transaction volume climbing above
              $20 billion by January 2026. The commercial market is heavily concentrated, with Kalshi and Polymarket
              collectively capturing approximately 97.5% of total volume. Beyond this duopoly, the broader competitive
              landscape encompasses legacy political prediction sites operating under restricted regulatory relief such
              as PredictIt, play-money forecasting platforms like Manifold Markets, and reputation-based forecasting
              platforms like Metaculus. Furthermore, the market is experiencing an influx of regulated entrants,
              including retail brokerage event-contract interfaces such as Robinhood and commercial sportsbooks
              exploring event prediction models such as FanDuel Predicts and DraftKings.


              Kalshi's strategic differentiation rests on its status as a Commodity Futures Trading Commission (CFTC)
              designated contract market (DCM), clearing trades in U.S. dollars through regulated clearinghouse
              infrastructure. This allows Kalshi to serve domestic retail participants via direct ACH and wire
              transfers, offer API integrations for institutional hedgers and market makers, and distribute contracts to
              retail brokerages like Robinhood. In contrast, Polymarket's international product operates on the Polygon
              blockchain using USDC collateral, while its domestic U.S. offering requires strict identity verification
              and clears in USD via approved intermediaries. Legacy platforms like PredictIt remain constrained by
              statutory investment caps and high profit commissions, leaving commercial liquidity concentrated on Kalshi
              and Polymarket.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
      - number: '3.2'
        title: Competitor Profiles, Scale, and Regulatory Posture
        blocks:
          - type: paragraph
            body: >
              A comparative evaluation of market participants demonstrates divergent regulatory foundations, product
              scopes, and target demographics. Polymarket, launched in 2020, expanded from $73 million in trading volume
              in 2023 to $9 billion in 2024, maintaining the largest international liquidity pool across politics,
              macroeconomics, crypto, and cultural markets. Polymarket's international platform utilizes a central limit
              order book (CLOB) on the Polygon blockchain, while its U.S. offering operates under a CFTC-regulated
              framework with USD settlement. Kalshi, live since 2021, reported $23.8 billion in nominal volume in 2025
              and has expanded into institutional hedging and perpetual futures contracts, scaling to over 1,000
              institutional clients and $500 billion in annualized volume metrics.


              Secondary competitors cater to specialized use cases. PredictIt has operated since 2014 under a CFTC
              no-action letter, focusing almost exclusively on political outcomes; however, it imposes restrictive
              limits of $3,500 per contract and a heavy 10% fee on realized profits alongside a 5% withdrawal fee.
              Non-monetary platforms serve forecasting and research functions rather than financial risk management:
              Manifold Markets provides community-created markets settled in virtual play-money (Mana), while Metaculus
              aggregates expert continuous probability estimates for policy institutions and research groups.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP004
              - CP007
              - CP008
              - CP009
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP008
      - number: '3.3'
        title: Pricing Economics, Distribution Channels, and Regulatory Risks
        blocks:
          - type: paragraph
            body: >
              Trading friction and distribution partnerships heavily influence venue selection and user retention.
              Kalshi employs a probability-weighted fee schedule where the taker fee scales according to the formula 7
              cents multiplied by the contract price and the inverse price, peaking at 1.75% for 50/50 contracts, while
              maker fees are set at 25% of the taker fee (or 0% for resting limit orders under specific active trading
              tiers). Polymarket applies dynamic taker fees varying by asset class, charging up to 1.80% on crypto
              markets, 0.75% on sports, and zero fees on geopolitical and world event contracts. In comparison,
              PredictIt extracts 10% of gross profits plus a 5% fee on withdrawals, representing a severe structural
              drag exceeding 14% on profitable trades.


              Distribution power is a vital determinant of competitive durability. Kalshi's embedded partnership with
              Robinhood exposes its event contracts to Robinhood's funded brokerage accounts, providing distribution
              scale that pure-play prediction apps struggle to replicate independently. However, Kalshi's business model
              faces severe adverse legal headwinds at the state level. While the CFTC has asserted federal preemption
              under the Commodity Exchange Act (CEA)—supported by a Third Circuit ruling regarding New Jersey—state
              attorneys general and gaming commissions have initiated aggressive enforcement actions. In July 2026, the
              New York Attorney General and Governor Hochul sued Kalshi for operating an illegal, unlicensed sports
              gambling platform, seeking restitution and triple fines. Similarly, in September 2026, Michigan Attorney
              General Dana Nessel secured a preliminary injunction requiring geofencing to block Michigan residents from
              Kalshi's sports wagers under threat of a $500,000 per day fine. Because sports contracts have represented
              the overwhelming majority of retail trading demand and fee revenue, these state-level injunctions create
              material operational uncertainty and risk fragmenting Kalshi's domestic addressable market.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Duopoly Dominance Masking Divergent Regulatory Foundations
            body: >
              While Kalshi and Polymarket together capture roughly 97.5% of the $50 billion prediction market ecosystem,
              their moats are built on fundamentally different pillars. Polymarket relies on global decentralized
              liquidity and zero-fee geopolitical trading, whereas Kalshi relies on its federal CFTC DCM license and
              institutional bank rails. However, Kalshi's reliance on sports event contracts exposes it to state-level
              gambling litigation that offshore and non-commercial peers avoid.
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP013
              - CP014
          - type: callout
            title: State Regulatory Injunctions Threaten Retail Sports Franchise
            body: >
              Legal actions by state attorneys general in New York and Michigan directly threaten Kalshi's primary
              retail trading category. With Michigan securing an injunction enforcing $500,000 per day fines for
              non-compliance and New York pursuing treble-gain penalties, state-level friction could force geographic
              market fragmentation or eliminate sports contract revenues if federal preemption is not definitively
              affirmed by appellate courts or the Supreme Court.
            calloutType: risk
            claimRefs:
              - CP013
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Exchange Fee Mechanics, Monopolistic Float, and Emerging Data Feeds
        blocks:
          - type: paragraph
            body: >-
              Kalshi operates a CFTC-regulated designated contract market that generates revenue primarily by charging
              variable transaction fees on trading volume rather than taking underwriting positions against its users.
              The exchange implements a maker-taker pricing architecture in which liquidity-providing maker limit orders
              incur no trading fees, whereas taker market orders that immediately execute against available depth pay
              variable fees scaled by contract probability. Beyond core trading transaction fees, Kalshi collects float
              income by retaining interest yields on customer cash balances held in segregated accounts under CFTC
              rules, while offering tiered cash yields to depositors. Supplemental commercial streams include
              programmatic API access fees, historical and real-time market data licensing to institutional trading
              desks and media organizations, and white-glove institutional access tiers.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
