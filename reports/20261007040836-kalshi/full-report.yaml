      - number: '2.3'
        title: Buyer Segments and Adoption Mechanics
        blocks:
          - type: paragraph
            body: >-
              Kalshi claims more than 1,000 institutional clients, 8,000 live markets, and one billion annual trades
              [CM004, CM005]. Its institutional positioning identifies several distinct users: risk owners seeking a
              direct event hedge, traders expressing directional views, market makers supplying liquidity, arbitrageurs
              trading dislocations, and analysts consuming market-implied probabilities [CM006]. These jobs imply
              different payers and budget owners, so a single consumer-betting TAM would be misleading. VNTR argues that
              liquidity can create a winner-take-most network effect because a venue becomes more attractive as
              participation improves [CM008]. Yet CEPR's analysis of more than 300,000 contracts finds favorite-longshot
              bias and materially negative average returns, especially for takers, creating a trust and retention
              constraint alongside the liquidity benefit [CM013].
            claimRefs:
              - CM004
