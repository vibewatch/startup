      - number: '6.2'
        title: Adoption Trajectory and Usage Scale
        blocks:
          - type: paragraph
            body: >-
              Kalshi has experienced exponential top-line volume acceleration across 2025 and 2026, driven by election
              cycle engagement, professional sports markets, and perpetual futures expansion [CU002, CU006, CU007].
              Kalshi and Polymarket combined saw trading volume expand from $1.8 billion to $24.2 billion in April 2026,
              with the broader event-contract industry projected to reach $1 trillion in annual trading volume by 2030
              [CU002]. Kalshi's institutional portal reports over 1,000 institutional clients, $500 billion in
              annualized platform volume, peak single-day trading volume exceeding $3.3 billion, and more than 1 billion
              annual trades across 8,000 live markets [CU007]. However, platform liquidity displays sharp market-level
              skew: flagship political and macro series—such as the 2028 Democratic presidential nominee ($233.2M
              volume) and Super Bowl champion ($165.1M volume)—command the majority of capital, while specialized policy
              or legislative contracts frequently trade under $500,000 in lifetime volume [CU001]. This structural
              volume concentration indicates that platform utilization remains highly event-dependent, requiring
              continuous headline catalysts to sustain high active participation rates.
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU007
      - number: '6.3'
        title: Named Deployments and Partner Integrations
        blocks:
          - type: paragraph
            body: >-
              To deepen customer acquisition and embed its order book across third-party user interfaces, Kalshi has
              pursued strategic distribution partnerships with consumer brokerages, global sports brands, and compliance
              technology vendors [CU003, CU004, CU009]. Public launched AI Agents for Prediction Markets in September
              2026, enabling its brokerage members to trade Kalshi event contracts natively and utilize Kalshi's
              real-time market probabilities as automated trading signals across equities and fixed income [CU009]. In
              consumer sports, Kalshi formed a strategic marketing and product agreement with ADI Predictstreet, the
              Official Prediction Market Partner of the 2026 FIFA World Cup, deploying co-branded stadium and digital
              activations alongside planned international market expansion [CU003]. To overcome enterprise friction,
              Kalshi integrated its trade data feeds into Comply's regulatory software, allowing over 5,000 compliance
              client firms to police employee trades on prediction contracts and crypto perpetual futures [CU004]. These
              production relationships establish diversified distribution channels that reduce direct customer
              acquisition costs, although partner dependency introduces platform governance and alignment risks.
            claimRefs:
              - CU003
              - CU004
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU009
      - number: '6.4'
        title: Retention Mechanics and Retail Loss Asymmetry
        blocks:
          - type: paragraph
            body: >-
              Kalshi's customer durability faces significant headwinds stemming from structural performance disparities
              between retail participants and institutional liquidity providers [CU002, CU008]. An empirical study
              conducted by the Roosevelt Institute revealed that ordinary users lost more than $500 million on Kalshi
              between its July 2021 launch and May 2026, with losses predominantly concentrated in sports betting
              contracts [CU002]. Retail traders on prediction platforms systematically underperform sophisticated market
              makers who deploy automated pricing algorithms and rapid latency infrastructure to harvest execution
              spreads and mispricings [CU002, CU008]. While systematic macro traders can achieve consistent double-digit
              quarterly returns by exploiting sentiment discrepancies against economic benchmarks, discretionary retail
              participants frequently experience negative net returns [CU008]. If retail capital erosion leads to rapid
              churn among casual event traders, Kalshi will need to continually replenish its retail customer base
              through external distribution partnerships or pivot platform volume toward institutional risk hedging.
            claimRefs:
              - CU002
              - CU008
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Retail Trader Loss Concentration and Churn Dynamics
            body: >-
              Independent data analysis reveals that retail participants on Kalshi incurred over half a billion dollars
              in cumulative net losses between July 2021 and May 2026, primarily across sports contracts. Because
              trading profits concentrate heavily in the hands of sophisticated high-volume algorithms, casual consumer
              retention represents a major structural vulnerability that requires continuous marketing and partner-led
              top-of-funnel customer acquisition.
            calloutType: risk
            claimRefs:
              - CU002
          - type: callout
            title: Embedded Brokerage Distribution via Public
            body: >-
              Kalshi's integration with Public enables external retail investors to trade event contracts through an
              established brokerage interface while utilizing Kalshi's market-implied probabilities as automated
              decision signals for traditional asset classes, significantly lowering retail user acquisition friction.
            calloutType: strength
            claimRefs:
              - CU009
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Preemption Exposure
        blocks:
          - type: paragraph
            body: >-
              Kalshi operates under a Designated Contract Market license granted by the Commodity Futures Trading
              Commission, asserting that all binary event contracts fall within exclusive federal regulatory
              jurisdiction under the Commodity Exchange Act. However, state gaming commissions, attorneys general, and
              sovereign tribal nations vigorously dispute that federal preemption shields retail sports prediction
              markets from state gambling prohibitions. Over nineteen federal lawsuits and multiple state court actions
              are actively litigating whether sports-based event contracts constitute permissible financial derivatives
              or illegal unlicensed sports betting. While Kalshi secured a preliminary injunction in Minnesota federal
              court preventing enforcement of a state prediction market ban, other jurisdictions have imposed
              restrictive sanctions. Most critically, the New York State Attorney General filed an enforcement action in
              July 2026 seeking complete profit forfeiture, consumer restitution, and treble statutory penalties that
              could total tens of billions of dollars. With state-level geofencing already mandated in Michigan under
              threat of daily half-million-dollar fines and court-ordered blackouts enforced in Washington, Kalshi
              confronts existential legal fragmentation that could dismantle its nationwide retail operating model.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR010
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
      - number: '7.2'
        title: Operational Integrity and Market Mechanics
        blocks:
          - type: paragraph
            body: >-
              Beyond jurisdictional litigation, Kalshi encounters material operational risks in contract resolution
              mechanics, market integrity enforcement, and customer onboarding compliance. Binary event contracts tied
              to volatile geopolitical or sporting developments frequently test the boundaries of contract settlement
              terms. In early 2026, Kalshi was forced to freeze fifty-four million dollars in trading volume and issue
              2.2 million dollars in user reimbursements after grammatically ambiguous contract specifications sparked
              widespread controversy following the death of Iranian supreme leader Ali Khamenei. Market surveillance and
              insider trading prevention present additional structural challenges: federal regulators charged a military
              servicemember with insider trading on political prediction markets using classified government
              intelligence, while high-profile public figures have been banned and penalized for attempting to
              manipulate contract settlement outcomes. Concurrently, aggressive customer acquisition
              initiatives—including historical campus ambassador campaigns targeting eighteen-to-twenty-year-old college
              students—have drawn intense regulatory scrutiny under state consumer protection statutes, creating
              reputational exposure and heightened compliance overhead.
            claimRefs:
              - CR008
              - CR012
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR008
              - CR012
              - CR014
              - CR015
      - number: '7.3'
        title: Partner Concentration and Revenue Durability
        blocks:
          - type: paragraph
            body: >-
              Kalshi exhibits severe strategic concentration in its product mix, distribution pipeline, and liquidity
              architecture. Event contracts tied to sporting outcomes represent roughly ninety percent of all trading
              activity and eighty-nine percent of total platform revenue in 2025, leaving corporate cash flows
              exceptionally vulnerable to state-level sports betting injunctions or an unfavorable appellate precedent
              under the Commodity Exchange Act. On the distribution side, Kalshi relies heavily on its integration as
              the backend execution infrastructure for Robinhood Markets' Prediction Markets Hub to drive retail user
              acquisition and order flow. Should Robinhood restrict access or unbundle prediction markets due to
              regulatory pressure, Kalshi's trading velocity would contract sharply. Furthermore, platform market depth
              depends on institutional liquidity provisioning and market-making agreements with quantitative trading
              firms like Susquehanna across thousands of live markets. While Kalshi has initiated strategic
              diversification into CFTC-regulated cryptocurrency perpetual futures to enter mainstream institutional
              derivatives, commercial traction in perpetual contracts remains early and unproven relative to established
              offshore venues.
            claimRefs:
              - CR007
              - CR009
              - CR010
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR007
              - CR010
              - CR013
      - number: '7.4'
        title: Risk Synthesis, Kill Criteria, and Heatmap
        blocks:
          - type: paragraph
            body: >-
              Evaluating Kalshi's comprehensive risk profile reveals an asymmetrical risk-reward equation where equity
              upside is contingent on total legal vindication of federal preemption. Under our analytical framework, the
              primary thesis-break trigger is a definitive circuit split or Supreme Court ruling determining that sports
              event contracts constitute unlawful gaming under state laws, which would immediately eliminate the vast
              majority of current transaction revenue. Secondary kill criteria include expanding geofencing mandates to
              high-volume states such as California or Texas, unilateral termination of the Robinhood retail
              distribution channel, or punitive regulatory restitution orders that jeopardize corporate solvency. For
              prospective investors, confirmatory diligence must bypass top-line trading volume vanity metrics and focus
              rigorously on state-by-state net revenue contributions, legal reserve adequacy, and institutional
              liquidity commitments across non-sports product lines.
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR008
              - CR009
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR008
              - CR009
              - CR012
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Binary Preemption Cliff
            body: >-
              Kalshi's commercial model depends overwhelmingly on sports contracts that generate approximately ninety
              percent of trading activity. If federal appellate courts or the Supreme Court rule that sports event
              contracts constitute unlawful gaming rather than preempted derivatives, Kalshi faces immediate loss of
              revenue scale and severe statutory damages across multiple jurisdictions.
            calloutType: risk
            claimRefs:
              - CR002
              - CR007
          - type: callout
            title: Perpetual Futures as a Strategic Hedge
            body: >-
              Kalshi's May 2026 expansion into CFTC-regulated cryptocurrency perpetual futures represents a direct
              attempt to diversify product volume away from vulnerable binary sports contracts into traditional
              derivative asset classes.
            calloutType: insight
            claimRefs:
              - CR009
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Kalshi's core investment thesis rests on its unique regulatory position as the first and premier
              CFTC-regulated Designated Contract Market purpose-built for retail event contracts. By structuring
              real-world predictions as binary derivatives cleared under federal oversight, Kalshi has established
              institutional and retail legitimacy, driving annualized trading volume from $52 billion to $178 billion
              and reaching an estimated $4 billion annualized revenue run-rate with approximately 90% gross margins.
              Distribution partnerships, notably with retail brokerages such as Robinhood, have demonstrated
              unprecedented consumer appetite, scaling monthly volume toward $17 billion. Furthermore, peer-reviewed
              analysis by Federal Reserve researchers confirms that Kalshi's event markets yield distributionally rich,
              high-frequency macroeconomic benchmarks that traditional financial surveys cannot replicate.


              Conversely, the anti-thesis centers on extreme legal vulnerability and revenue concentration. While Kalshi
              markets itself as a federal derivatives venue, its rapid top-line expansion has been heavily fueled by
              retail sports contracts and parlay-style combos. State regulatory authorities and attorneys general have
              rejected federal preemption arguments, alleging Kalshi operates unlicensed gambling venues. In September
              2026, Michigan secured a preliminary injunction mandating strict geofencing against Kalshi sports wagering
              under threat of $500,000 daily fines, while the New York Attorney General filed suit seeking complete
              cessation of operations and restitution. If federal courts rule that event contracts do not preempt state
              gaming statutes, Kalshi risks losing its highest-velocity retail trading jurisdictions, triggering severe
              volume and multiple contraction.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV008
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV010
      - number: '8.2'
        title: Financing History and Capitalization Context
        blocks:
          - type: paragraph
            body: >-
              Kalshi's financing trajectory represents one of the steepest ascents in modern financial technology. The
              company completed a $1 billion Series E round in December 2025 led by Paradigm at an $11 billion
              valuation, swiftly followed in May 2026 by a $1 billion Series F led by Coatue Management at a $22 billion
              valuation, bringing cumulative equity financing to approximately $2.8 billion across disclosed
              institutional rounds. Recent reports in mid-2026 indicate Kalshi is actively finalizing another financing
              round that would value the company at approximately $40 billion ahead of an anticipated initial public
              offering, supported by tier-one sponsors including Sequoia Capital and Wellington Management.


              However, this rapid re-rating creates substantial structural complexity and valuation overhang. The
              cumulative preference stack of approximately $2.8 billion means that late-stage investors hold substantial
              liquidation preferences and structural protections that junior equity and common shareholders do not
              share. With the private valuation multiplying from $2 billion in mid-2025 to $11 billion, $22 billion, and
              potentially $40 billion, the equity price discounts flawless regulatory resolution and uninterrupted
              volume expansion. Without public access to audited FY2025 financials or cap table share-class terms,
              investors cannot verify common per-share intrinsic value or down-round conversion ratios.
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV007
              - CV008
              - CV010
              - CV011
      - number: '8.3'
        title: Scenario Analysis and Diligence Gateways
        blocks:
          - type: paragraph
            body: >-
              To evaluate Kalshi's risk-adjusted return profile, we construct bull, base, and bear valuation scenarios
              across 2026-2028 horizons. In the bull case, federal courts affirm CFTC regulatory preemption over state
              gaming enforcement, institutional adoption of macro and commodity hedging contracts accelerates, and
              Kalshi successfully executes an initial public offering at a $45 billion to $60 billion valuation,
              yielding premium exchange multiples of 12x to 15x forward net revenue. In the base case, state-by-state
              litigation remains protracted, forcing Kalshi to geofence several key jurisdictions; growth moderates to
              exchange averages, and Kalshi trades at a fair valuation of $20 billion to $24 billion (5x to 6x forward
              run-rate), approximately matching its Series F benchmark.


              In the bear scenario, adverse judicial rulings in Michigan, New York, or federal appellate circuits strip
              Kalshi of state-law preemption for sports event contracts, forcing widespread geofencing and exposing the
              firm to statutory fines. Under this outcome, trading volumes contract sharply, retail brokerage
              distribution slows, and multiple compression reduces enterprise value to $8 billion to $10 billion,
              triggering severe dilution for late-stage common equity. Given this binary legal dispersion, we assign an
              overall recommendation of research-more with high risk and a stretched valuation stance, requiring
              explicit verification of cap-table waterfalls and legal catalysts before committing growth capital.
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV010
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV007
              - CV008
              - CV010
              - CV012
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Binary Regulatory Risk Threatens Valuation Multiples
            body: >-
              Kalshi's steep private market appreciation to $22B and reported $40B pre-IPO discussions assumes unimpeded
              nationwide retail sports wagering under CFTC jurisdiction. State court injunctions in Michigan and New
              York present existential threats to volume run-rates if state gaming laws are found not to be preempted.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV010
          - type: callout
            title: Capital Allocation Guidance
            body: >-
              Institutional investors should maintain a research-more posture on Kalshi common and secondary equity.
              Capital commitments should remain conditional on judicial clarity regarding state gaming preemption and
              full disclosure of the Series E/F liquidation waterfall.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV011
              - CV015
