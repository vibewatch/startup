chapter:
  number: 4
  title: "Financials"
  summary: "Kalshi monetizes through an exchange-style maker-taker fee schedule and idle customer float rather than taking balance-sheet underwriting risk. While annualized revenue run-rates surged into billions driven by sports wagering volume, the private exchange discloses no audited cost structure, leaving operating profitability, marketing acquisition efficiency, and legal overhang as major diligence gaps."
sections:
  - id: "revenue-model-and-monetization-streams"
    title: "Exchange Fee Mechanics, Monopolistic Float, and Emerging Data Feeds"
    body: "Kalshi operates a CFTC-regulated designated contract market that generates revenue primarily by charging variable transaction fees on trading volume rather than taking underwriting positions against its users. The exchange implements a maker-taker pricing architecture in which liquidity-providing maker limit orders incur no trading fees, whereas taker market orders that immediately execute against available depth pay variable fees scaled by contract probability. Beyond core trading transaction fees, Kalshi collects float income by retaining interest yields on customer cash balances held in segregated accounts under CFTC rules, while offering tiered cash yields to depositors. Supplemental commercial streams include programmatic API access fees, historical and real-time market data licensing to institutional trading desks and media organizations, and white-glove institutional access tiers."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "commercial-traction-and-distribution-proxies"
    title: "Hyper-Scaling Trading Velocity, Sports Skew, and Distribution Economics"
    body: "Kalshi's reported commercial traction has expanded rapidly from tens of millions in 2024 to hundreds of millions in net revenue in 2025, reaching multibillion-dollar annualized run-rate claims during event-heavy peaks in 2026. However, top-line growth is overwhelmingly driven by sports event contracts, which have accounted for 75% to 87% of fee-generating trading volume. To scale retail liquidity, Kalshi relies heavily on retail embedded distribution channels, most notably a strategic integration with Robinhood where user trading volume generated more than half of Kalshi's activity during peak periods under a per-contract fee-sharing agreement. While this embedded distribution lowers organic acquisition burden, Robinhood's acquisition of MIAXdx introduces significant channel disintermediation risk if flow is migrated to a proprietary venue."
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
    tableRefs:
      - "TI003"
  - id: "cost-structure-capital-adequacy-and-diligence-blockers"
    title: "Operating Cost Structure, Capital Runway, and Regulatory Diligence Blockers"
    body: "Kalshi maintains an asset-light exchange model with near-zero marginal cost per incremental contract cleared, reinforced by bringing clearing in-house through its CFTC-approved clearinghouse Kalshi Klear LLC. Nevertheless, fixed overhead has increased substantially following rapid workforce expansion toward 490 employees and intensive consumer marketing during major cultural and sporting tournaments. Total lifetime financing raised across equity rounds and credit facilities approaches $2.8B to $3.3B, with the latest primary Series F valuation priced at $22 billion in April-May 2026. Despite substantial capital reserves, Kalshi provides no audited income statements, GAAP gross margins, or cash burn figures. Most critically, because the vast majority of fee revenue derives from sports contracts that face severe legal injunctions and criminal or civil enforcement across multiple state gaming authorities, forward cash-flow underwriting remains blocked by regulatory litigation risk."
    claimRefs:
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
