callouts:
  - calloutType: "risk"
    title: "Extensive Revenue Concentration in State-Contested Sports Contracts"
    body: "Between 75% and 87% of Kalshi's fee-generating volume derives from sports event wagering. Because state gaming regulators in New York, Michigan, Washington, and elsewhere have secured or sought injunctions alleging sports event contracts constitute unlicensed gambling under state law, a definitive adverse judicial ruling could eliminate up to three-quarters of the platform's revenue base."
    claimRefs:
      - "CI008"
      - "CI012"
      - "CI013"
  - calloutType: "insight"
    title: "Distribution Channel Dependency on Robinhood"
    body: "Robinhood users have driven more than 50% of Kalshi's platform volume during peak trading cycles. With Robinhood having acquired CFTC-licensed exchange and clearinghouse MIAXdx, Kalshi faces the structural threat of customer migration to a competing in-house venue, which would compress distribution margins and trading velocity."
    claimRefs:
      - "CI007"
      - "CI010"
