    title: "Institutional positioning is becoming tangible"
    body: >-
      Tradeweb's live pricing integration and minority investment provide
      partner-issued evidence that Kalshi data is entering established institutional
      workflows, beyond Kalshi's own institutional marketing claims.
    claimRefs: ["CO014"]
  - calloutType: "risk"
    title: "Reported run rate depends on an unsettled legal classification"
    body: >-
      A source reporting nearly 90% sports revenue also reports an active
      Massachusetts injunction and unresolved appeal, so the $22 billion private
      valuation embeds legal durability that cannot yet be treated as settled.
    claimRefs: ["CO008", "CO011", "CO012"]
