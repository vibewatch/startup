company:
  name: "Kalshi"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Kalshi is a founder-led, New York-based private exchange that has expanded from
    event contracts into perpetual futures while reporting rapid financing and
    annualized-revenue growth. The same evidence shows concentration in sports
    markets and unresolved state-law exposure, while total capital raised,
    headcount, cash, debt, and board composition remain public-evidence gaps.
sections:
  - id: "identity-and-business-model"
    title: "Identity and business model"
    body: >-
      Kalshi was founded in 2018 by Tarek Mansour and Luana Lopes Lara and is
      headquartered in Manhattan, New York City. Its public platform launched in
      July 2021. The operating proposition is an exchange rather than a house taking
      the other side of wagers: participants trade peer-to-peer contracts tied to
      yes-or-no outcomes of real-world events. Kalshi says its exchange and
      clearinghouse entities are CFTC-regulated, while current product pages show a
      broader surface than political prediction alone, including short-duration
      foreign-exchange contracts, public-company KPI forecasts, institutional event
      contracts, and perpetual futures. That breadth supports an exchange-platform
      identity, but company-controlled pages establish availability rather than
      demand, profitability, or regulatory durability.
    claimRefs: ["CO001", "CO002", "CO004", "CO005", "CO006", "CO016"]
    tableRefs: ["TO001"]
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: >-
      The business remains visibly founder-led. Tarek Mansour is identified as
      co-founder and CEO, while Luana Lopes Lara is identified as co-founder and COO.
      This pairing supplies continuity across product, regulatory, and operating
      decisions, and both founders were described as financial analysts before
      establishing the company. It also creates potential key-person concentration:
      the assigned sources do not disclose a complete executive roster, board
      membership, independent-director representation, committee structure, voting
      control, succession plan, or material leadership departures. The absence of
      those records is not evidence that governance controls are weak; it means
      governance quality and founder-control risk cannot be underwritten from this
      evidence set and require a direct company diligence package.
    claimRefs: ["CO001", "CO003"]
    tableRefs: ["TO002"]
  - id: "capital-scale-and-stakeholders"
    title: "Capital, scale, and stakeholders"
    body: >-
      Independent reports describe a Series F of more than $1 billion led by Coatue
      at a $22 billion valuation, with participation from Sequoia Capital, Andreessen
      Horowitz, IVP, Paradigm, Morgan Stanley, and ARK Invest. One report says the
      valuation doubled from $11 billion in December 2025. Operating scale is
      directionally large but must be labeled carefully: Dealroom reported more than
      $1.5 billion of annualized revenue and $178 billion of annualized trading
      volume in May 2026, while Bitcoin Magazine reported annualized revenue above
      $2 billion in June. These are dated annualized rates, not audited revenue and
      not ARR. Kalshi separately claims more than 1,000 institutional clients and
      $500 billion of annualized volume; the denominator, methodology, and
      reconciliation to the earlier volume report are not provided.
    claimRefs: ["CO007", "CO008", "CO009", "CO010", "CO015"]
    tableRefs: ["TO003"]
  - id: "milestones-and-risk-adjusted-ground-truth"
    title: "Milestones and risk-adjusted ground truth"
    body: >-
      Kalshi's trajectory combines financing, product expansion, and institutional
      distribution with a legal dependency central to the company overview.
      Dealroom reported that sports generated nearly 90% of 2025 revenue and that a
      Massachusetts lower court enjoined sports markets in January 2026; the appeal
      was still pending after a May hearing. That makes the state-versus-federal
      classification question material to the durability of the reported run rate.
      Subsequent milestones—perpetual futures announced in May, early IPO
      conversations reported in June, and a Tradeweb data integration launched in
      June—show a push toward a broader financial-exchange and institutional
      narrative. They do not resolve the sports concentration or substitute for
      audited financials, a capitalization table, or legal outcomes.
    claimRefs: ["CO011", "CO012", "CO013", "CO014", "CO015"]
    figureRefs: ["FO001"]
