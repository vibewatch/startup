callouts:
  - calloutType: insight
    title: Duopoly Dominance Masking Divergent Regulatory Foundations
    body: >
      While Kalshi and Polymarket together capture roughly 97.5% of the $50 billion prediction market ecosystem, their moats are built on fundamentally different pillars. Polymarket relies on global decentralized liquidity and zero-fee geopolitical trading, whereas Kalshi relies on its federal CFTC DCM license and institutional bank rails. However, Kalshi's reliance on sports event contracts exposes it to state-level gambling litigation that offshore and non-commercial peers avoid.
    claimRefs:
      - CP001
      - CP002
      - CP013
      - CP014
  - calloutType: risk
    title: State Regulatory Injunctions Threaten Retail Sports Franchise
    body: >
      Legal actions by state attorneys general in New York and Michigan directly threaten Kalshi's primary retail trading category. With Michigan securing an injunction enforcing $500,000 per day fines for non-compliance and New York pursuing treble-gain penalties, state-level friction could force geographic market fragmentation or eliminate sports contract revenues if federal preemption is not definitively affirmed by appellate courts or the Supreme Court.
    claimRefs:
      - CP013
      - CP014
      - CP015
