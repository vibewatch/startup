callouts:
  - calloutType: strength
    title: Relevant autonomy and operating pedigree
    body: >-
      The founding team combines former Waymo autonomy leaders with engineering
      and freight-operating experience, a credible fit for deploying
      safety-critical systems on active construction sites.
    claimRefs: [CO008, CO009]
  - calloutType: risk
    title: Capital evidence is ahead of economic evidence
    body: >-
      The US$1.75 billion valuation is public, but the assigned evidence does
      not disclose revenue, margin, customer count, retention, or cash
      availability, preventing a grounded scale or valuation multiple.
    claimRefs: [CO006, CO007]
