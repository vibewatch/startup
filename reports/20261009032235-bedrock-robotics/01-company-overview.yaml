company:
  name: Bedrock Robotics
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Bedrock Robotics is a San Francisco construction-autonomy company founded in
    May 2024 that raised a $270 million Series B at a reported $1.75 billion
    valuation in February 2026, taking disclosed funding above $350 million.
    Public evidence shows experienced autonomy leadership and expanding field
    deployments, but does not disclose revenue, customer count, headcount,
    board composition, or financing terms needed to judge scale and governance.
sections:
  - id: identity-and-business
    title: Identity and business model
    body: >-
      Bedrock Robotics was founded in May 2024 and is headquartered in San
      Francisco. Its product is an autonomy layer for heavy construction
      equipment: public materials describe reversible hardware and software
      installations on existing excavators, bulldozers, and loaders rather than
      a requirement to replace an installed fleet. That retrofit position may
      reduce a contractor's initial equipment-switching burden, but the
      allocated evidence does not disclose pricing, contract duration, service
      obligations, or recognized revenue. The company's own website frames the
      outcome as autonomous fleets that expand construction capacity; that is a
      product ambition, not evidence that fleet-level autonomy is already
      generally available. The clearest public operating stage is therefore a
      Series B company moving from supervised field work toward a targeted
      operator-less deployment.
    claimRefs: [CO001, CO002, CO003, CO005, CO012]
    tableRefs: [TO001]
  - id: capital-and-field-scale
    title: Capitalization and field scale
    body: >-
      The financing record accelerated quickly: Bedrock emerged from stealth in
      July 2025 with $80 million across Seed and Series A rounds, then announced
      a $270 million Series B on February 4, 2026. The company-issued release
      and an independent summary both put total funding above $350 million and
      the valuation at $1.75 billion, although neither states whether that value
      is pre-money or post-money. Operating evidence remains less standardized.
      Sources describe a supervised mass-excavation deployment on a 130-acre
      site, machines at active customer sites in three states, field testing in
      Texas and California, and an investor claim of more than 40 machines
      across five states. These are useful proof points, but they use different
      dates and denominators and should not be combined into a single current
      deployment count.
    claimRefs: [CO004, CO005, CO006, CO007, CO011, CO013, CO014, CO015, CO016]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Four founders occupy the CEO, CTO, and two VP Engineering roles. Three are
      described as former Waymo engineering leaders, while the fourth previously
      worked on Segment's engineering systems. This is strong founder-market fit
      for safety-critical autonomy, but it also concentrates technical and
      product continuity in the founding group. Laurent Hautefeuille adds
      freight operating experience as COO, and the February 2026 announcement
      added evaluation and people leaders with Meta and Waymo backgrounds.
      Publicly allocated sources do not identify directors, board observers,
      voting arrangements, founder ownership, or succession plans. Accordingly,
      governance quality cannot be inferred from the operating biographies, and
      investor participation should not be treated as evidence of independent
      board oversight.
    claimRefs: [CO008, CO009, CO010]
    tableRefs: [TO002]
  - id: diligence-boundaries
    title: What remains unverified
    body: >-
      The public record establishes corporate identity, named leadership,
      financing announcements, and selected deployment milestones, but it does
      not establish commercial scale. Revenue, ARR, gross margin, customer
      count, contracted backlog, headcount, retention, and customer
      concentration are absent from the assigned evidence. Funding raised is
      not cash available, and the cited valuation is not a substitute for
      operating performance. The assigned adverse search returned no result
      URLs, which is a search outcome rather than proof that Bedrock has had no
      lawsuit, regulatory matter, safety incident, outage, layoff, or leadership
      dispute. Diligence should therefore reconcile the capitalization table
      and board records, inspect deployment cohorts and safety logs, and obtain
      audited financial and customer schedules before using the public funding
      narrative as a measure of enterprise maturity.
    claimRefs: [CO006, CO007, CO010, CO011, CO012, CO013, CO014, CO015, CO016]
