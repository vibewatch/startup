companyProfile:
  summary: >-
    Bedrock Robotics is a San Francisco-based Series B company building reversible autonomy retrofit kits for heavy
    construction equipment, starting with excavators. The public record shows a strong autonomy pedigree, active field
    deployments, and expanding leadership, but it still does not disclose revenue, customer counts, retention,
    headcount, or contract economics.
