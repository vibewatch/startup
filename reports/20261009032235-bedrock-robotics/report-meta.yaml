      background: Former Waymo autonomy leader.
    - name: Ajay Gummalla
      role: Co-founder and VP Engineering
      background: Former Waymo engineering leader.
    - name: Tom Eliaz
      role: Co-founder and VP Engineering
      background: Former Segment engineering leader.
  foundingLocation: San Francisco, California, USA
  headquarters: San Francisco, California, USA
  productSummary: >-
    Bedrock sells an autonomy retrofit platform that converts contractor-owned excavators and other heavy equipment into
    autonomous earthmoving assets using sensors, edge compute, and autonomy software.
  customerFocus: Large general contractors, heavy-civil builders, site-preparation specialists, and infrastructure operators.
  businessModel: Retrofit installation plus recurring autonomy software and support tied to autonomous machine operation.
  stage: Series B
  fundingStatus: >-
