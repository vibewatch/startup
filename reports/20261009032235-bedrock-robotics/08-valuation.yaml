callouts:
  - calloutType: "recommendation"
    title: "Entry Discipline on Late-Stage Private Robotics"
    body: "Bedrock Robotics has demonstrated compelling engineering and contractor interest, but the $1.75 billion Series B valuation sets an extremely high performance bar. Until the company provides verifiable cohort data demonstrating autonomous machine utilization and repeatable software revenue, growth investors should resist paying upward secondary prices or ungrounded round markups."
    claimRefs:
      - "CV001"
      - "CV005"
      - "CV007"
      - "CV014"
  - calloutType: "risk"
    title: "Liquidation Preference and Multiple Compression Vulnerability"
    body: "With over $350 million in cumulative preferred equity raised across Seed, Series A, and Series B rounds, any material operational delays in transitioning to unassisted commercial operations could force down-round financings that impair junior and common stakeholders under strict 1.0x senior preference structures."
    claimRefs:
      - "CV001"
      - "CV006"
      - "CV007"
      - "CV012"
