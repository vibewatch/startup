callouts:
  - calloutType: "insight"
    title: "The Strategic Advantage of Aftermarket Retrofit Versus Custom Machinery"
    body: "By packaging its autonomy technology into reversible, same-day retrofit kits for standard 20-to-80-ton excavators, Bedrock avoids the capital intensity, manufacturing overhead, and dealer distribution friction of building new equipment. This asset-light approach allows civil contractors to automate existing machinery while preserving their existing capital investments and maintenance ecosystems."
    claimRefs:
      - "CE002"
      - "CE003"
  - calloutType: "risk"
    title: "The Supervised-to-Unsupervised Operational Chasm in Heavy Autonomy"
    body: "While Bedrock has demonstrated successful supervised mass excavation on customer jobsites, transitioning to fully operator-less deployment in 2026 presents steep technical and liability hurdles. In heavy excavation, false negatives in obstacle detection, unmodeled subsurface obstacles, or sensor blinding from dense dust plumes carry catastrophic mechanical and safety risks, necessitating rigorous fail-safe architectures."
    claimRefs:
      - "CE013"
      - "CE014"
      - "CE015"
