chapter:
  number: 5
  title: "Product & Technology"
  summary: "Bedrock Robotics develops modular retrofit autonomy kits that convert conventional 20-to-80-ton hydraulic excavators into autonomous earthmoving assets using multimodal sensor suites, edge computing, and ML-driven motion planning. The platform targets mass excavation and site prep workflows to address chronic labor deficits, with commercial pilots underway across multiple states and a target of initial fully operator-less field deployments in 2026."
sections:
  - id: "product-definition-and-modular-retrofit-architecture"
    title: "Product Definition and Modular Retrofit Architecture"
    body: "Bedrock Robotics provides an end-to-end industrial autonomy platform centered on the Bedrock Operator, a hardware and software retrofit system engineered specifically for heavy construction equipment [CE001]. Rather than manufacturing proprietary heavy machinery from scratch, the company equips existing customer fleets—principally starting with standard 20-to-80-ton hydraulic excavators—with same-day, reversible retrofit kits [CE002]. This aftermarket conversion strategy avoids the multi-year capital cycles and prohibitive replacement expenditures required to replace heavy machinery, establishing an accessible modernization pathway for commercial general contractors [CE003]. The physical retrofit integrates high-resolution sensor enclosures, ruggedized automotive-grade compute units, and electronic control unit (ECU) actuation harnesses that interface directly with heavy machinery hydraulic controllers [CE004]. By coupling directly with heavy machinery CAN bus and J1939 communication protocols, the system translates high-level algorithmic pathing into millimetric hydraulic valve modulations without compromising baseline vehicle safety architectures [CE005]."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "perception-motion-planning-and-site-workflows"
    title: "Perception, Motion Planning, and Jobsite Workflows"
    body: "Autonomous excavation requires solving complex physical interaction dynamics where machines must not merely navigate terrain, but actively deform and sculpt earth with centimetric precision [CE006]. Bedrock's perception suite fuses multi-modal sensor inputs—including solid-state LiDAR, optical stereoscopic cameras, and precision inertial measurement units (IMUs)—to construct high-fidelity 3D volumetric topological maps of active work zones in real time [CE007]. Proprietary machine learning algorithms and neural motion planners interpret raw volumetric point clouds to optimize bucket trajectory, dig vectors, and shovel fill factors [CE008]. This enables continuous mass excavation, automated trenching, and soil redistribution cycles while dynamically compensating for shifting terrain, soil resistance, and mechanical vibrations [CE009]. In live field operations, the platform coordinates machine actions to maintain uniform load-time consistency for haul trucks, mitigating operator fatigue and sustaining operational tempos across extended operational shifts [CE010]."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
    tableRefs:
      - "TE002"
  - id: "deployment-reliability-and-safety-governance"
    title: "Deployment Maturity, Operational Constraints, and Safety Controls"
    body: "Bedrock has advanced its autonomy capabilities across commercial customer sites in California, Arizona, Texas, and Arkansas, including a verified deployment executing supervised mass excavation across a 130-acre manufacturing facility in late 2025 [CE011]. Industrial construction contractors such as Sundt Construction and Champion Site Prep utilize the platform to complement existing jobsite crews, increasing daily asset utilization on critical infrastructure, industrial campuses, and data center developments [CE012]. Despite these operational milestones, the technology currently operates primarily under supervised autonomy regimes where human safety drivers or site monitors oversee machine actions [CE013]. Commercial progression toward fully operator-less excavation, targeted for customer deployment in 2026, requires resolving severe technical edge cases in extreme dust, adverse precipitation, and unmapped underground utility strikes [CE014]. Furthermore, because heavy machinery lacks standardized drive-by-wire interfaces across legacy OEM variants, fleet-wide scaling entails significant calibration overhead and custom ECU bridging across heterogeneous machine vintages [CE015]."
    claimRefs:
      - "CE011"
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
    tableRefs:
      - "TE003"
