callouts:
  - calloutType: "insight"
    title: "Retrofit Fleet Flexibility Versus OEM Dealer Lock-In"
    body: "Bedrock's core strategic wedge is fleet agnosticism. Civil contractors rarely run homogeneous single-brand fleets; by offering a reversible retrofit compatible with 20-to-80 ton excavators across multiple manufacturers, Bedrock bypasses the high capital hurdle of purchasing new autonomous machinery while avoiding OEM vendor lock-in."
    claimRefs:
      - "CP001"
      - "CP005"
      - "CP009"
  - calloutType: "risk"
    title: "The Earth-Shaping Autonomy Hurdle"
    body: "Autonomous haulage from point A to B is relatively structured, but autonomous mass excavation requires continuous real-time perception of varying soil densities, moisture, and dynamic bucket resistance. Demonstrating reliable operator-less performance without human intervention remains the critical technical barrier to displacing veteran operators."
    claimRefs:
      - "CP006"
      - "CP007"
      - "CP013"
