evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Revenue, ARR, gross margin, backlog, exact customer count, customer concentration, retention, headcount, and
      deployment-cohort economics.
    whyItMatters: >-
      Financing and named deployments cannot establish commercial scale, capital efficiency, or a defensible valuation
      multiple.
    diligencePath: >-
      Obtain audited financials, monthly management accounts, the customer master, deployment cohorts, signed contracts,
      and renewal schedules.
    relatedQuestionRefs:
      - QO005
      - QO007
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: governance-and-stakeholders
    missingEvidence: >-
      Complete executive and board rosters, capitalization table, voting rights, option pool, debt or credit facilities,
      and secondary sales.
    whyItMatters: >-
      Public biographies and investor announcements do not reveal control, dilution, governance protections, or
      succession readiness.
    diligencePath: >-
      Review the charter, bylaws, board minutes, cap table, financing documents, side letters, debt schedules, and
      succession plan.
    relatedQuestionRefs:
      - QO002
      - QO003
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Independent legal, regulatory, safety-incident, outage, layoff, and leadership-churn records; the assigned adverse
      query returned no URLs.
    whyItMatters: >-
      No result in the assigned search set is not evidence that no adverse event occurred, particularly for private
      field deployments.
    diligencePath: >-
      Run jurisdiction-specific court, OSHA, regulator, insurance-claim, and customer-reference checks when additional
      evidence access is authorized.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: minor
    topic: milestone-chronology
    missingEvidence: >-
      Exact dates for founding, leadership appointments, machine-count measurement, and the planned operator-less
      customer deployment.
    whyItMatters: Month-only and year-only disclosures limit sequencing and prevent a precise assessment of execution velocity.
    diligencePath: >-
      Request the corporate milestone log, dated board materials, deployment acceptance records, and leadership
      appointment documentation.
    relatedQuestionRefs:
      - QO006
  - type: private-evidence-only
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      Eligible machine counts by class and geography, retrofit pricing, annual contract value, deployment capacity,
      utilization, sales-cycle conversion, and win rates.
    whyItMatters: >-
      Without these inputs, broad construction spend and labor figures cannot be converted into a defensible TAM, SAM,
      SOM, or revenue forecast.
    diligencePath: >-
      Obtain management's market model and reconcile it to fleet-registration data, signed contracts, deployment
      cohorts, pricing schedules, and installation capacity.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: customer-economics
    missingEvidence: >-
      Customer-level labor savings, uptime, intervention rates, insurance terms, fully loaded deployment cost, payback
      period, retention, and expansion by cohort.
    whyItMatters: >-
      Field activity proves feasibility but not repeatable economic value or conversion from pilot budgets to scaled
      fleet contracts.
    diligencePath: >-
      Review anonymized pilot scorecards, renewal and expansion records, incident logs, insurance binders, and reference
      calls with budget owners and equipment crews.
    relatedQuestionRefs:
      - QM004
      - QM006
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: benchmark-verification
    missingEvidence: >-
      Independent third-party production benchmarks comparing autonomous cycle times, fuel consumption, and volumetric
      excavation accuracy against human equipment operators across standardized soil conditions.
    whyItMatters: >-
      Without independent benchmarking, contractors and investors must rely on vendor-reported pilot claims, obscuring
      real-world productivity differentials.
    diligencePath: >-
      Request unredacted customer pilot telematics logs and side-by-side production reports from active deployments with
      Sundt or Champion Site Prep.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: pricing-models
    missingEvidence: >-
      Standard commercial rate cards, software-as-a-service subscription pricing, and hardware retrofit kit fee
      schedules.
    whyItMatters: >-
      Prevents independent validation of unit economics, contractor payback periods, and software gross margins relative
      to human labor costs.
    diligencePath: Review executed customer master service agreements and equipment lease addenda across current pilot partners.
    relatedQuestionRefs:
      - QP006
  - type: private-evidence-only
    severity: material
    topic: retention-and-cac
    missingEvidence: >-
      Audited retention data, net revenue retention (NRR), customer lifetime value (LTV), and realized customer
      acquisition costs across contractor cohorts.
    whyItMatters: >-
      Without retention and payback metrics, long-term customer economics cannot be validated against the company's
      $1.75B valuation.
    diligencePath: >-
      Request customer cohort retention schedules, contract renewal terms, and customer acquisition cost ledgers under
      an NDA diligence process.
    relatedQuestionRefs:
      - QI009
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Machine-level BOM costs for LiDAR/compute retrofit kits, installation labor hours, and ongoing teleoperation
      supervision staffing ratios.
    whyItMatters: >-
      Direct gross margins depend critically on hardware bill of materials and the ratio of remote human supervisors
      required per active machine.
    diligencePath: >-
      Inspect audited cost of goods sold breakdown, hardware component bills of materials, and teleoperation center
      staffing rosters.
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: Monthly cash burn, net operating cash flow, and detailed forward capital expenditure plans.
    whyItMatters: >-
      Validating whether the $270M Series B provides runway through commercial operator-less scaling or requires
      follow-on project financing.
    diligencePath: Request board-approved forward budget, monthly cash runway forecast, and capital expenditure breakdown.
  - type: missing-source
    severity: material
    topic: verified-productivity-metrics
    missingEvidence: >-
      Third-party audited productivity benchmarking comparing autonomous excavator cycle times and volume throughput
      against experienced human operators across soil conditions.
    whyItMatters: >-
      Contractor adoption and unit economic payback models depend on verified throughput metrics rather than qualitative
      statements of consistent load times.
    diligencePath: >-
      Request customer pilot telemetry data, cycle time distributions, and cubic-yard-per-hour logs directly from
      partner trials.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: unattended-safety-case
    missingEvidence: >-
      Formal safety-case documentation, failure modes and effects analysis (FMEA), and emergency shutdown latency
      validations for operator-less 2026 operations.
    whyItMatters: >-
      Deploying multi-ton autonomous machinery without in-cab operators introduces severe casualty and liability risks
      if fail-safe stop systems fail.
    diligencePath: >-
      Review internal system safety architecture, ISO 13849/ISO 19014 functional safety compliance audits, and insurer
      underwriting requirements.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: commercial-durability
    missingEvidence: >-
      Customer-level contract dates, paid pilot conversion, renewal and churn cohorts, NRR or GRR, pricing, deployment
      revenue, expansion revenue, and top-customer concentration.
    whyItMatters: >-
      Without these denominators, public field activity cannot establish durable recurring demand, expansion economics,
      or concentration risk.
    diligencePath: >-
      Request anonymized customer cohorts, executed contracts, invoices, renewal schedules, deployment and support logs,
      and top-customer revenue shares under NDA.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU001
      - TU002
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A complete customer roster separating paid production deployments, supervised pilots, development partners, and
      logo-only relationships.
    whyItMatters: >-
      The public partner list mixes relationship stages and cannot establish customer count, conversion, or production
      breadth.
    diligencePath: >-
      Reconcile CRM and contract records to every public partner, then obtain customer references for at least one
      production deployment and one non-renewed pilot.
    relatedQuestionRefs:
      - QU003
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: operator-out-maturity
    missingEvidence: >-
      Current customer or third-party confirmation that a fully operator-out deployment was completed after the February
      2026 target statement.
    whyItMatters: >-
      Operator-out acceptance is the key maturity step separating supervised field testing from the intended autonomous
      operating model.
    diligencePath: >-
      Request dated acceptance records, safety-case documentation, operating-hour logs, and an interview with the site
      owner for the first operator-out deployment.
    relatedQuestionRefs:
      - QU004
      - QU006
  - type: missing-source
    severity: material
    topic: commercial-insurance-and-indemnity
    missingEvidence: >-
      Publicly disclosed commercial insurance policies, product liability underwriting standards, and customer
      indemnification frameworks for unattended autonomous excavator operation.
    whyItMatters: >-
      Autonomous 50-ton equipment introduces catastrophic bodily injury and property damage exposures that cannot be
      underwritten by standard contractor commercial general liability without explicit robotics endorsements.
    diligencePath: >-
      Request contractor Master Services Agreements (MSAs), certificate of insurance (COI) schedules, and underwriter
      warranty terms during technical diligence.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: customer-contract-unit-economics
    missingEvidence: >-
      Customer-level contract terms, software subscription pricing, hardware retrofit margin contribution, and fleet
      utilization metrics across pilot partners.
    whyItMatters: >-
      Without verified contract ARR and gross margins, Bedrock's $1.75 billion valuation cannot be validated against
      hardware-enabled robotics peer multiples.
    diligencePath: Review audited customer contracts, billing schedules, and unit contribution accounting with financial leadership.
    relatedQuestionRefs: []
