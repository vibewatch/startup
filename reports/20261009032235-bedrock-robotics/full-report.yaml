      - number: '6.2'
        title: Deployment proof and named references
        blocks:
          - type: paragraph
            body: >-
              The strongest public customer proof is Sundt's supervised mass-excavation test at a 130-acre manufacturing
              site in Phoenix. Equipment World reported that more than 65,000 cubic yards had been moved, with
              autonomous excavators loading human-operated articulated dump trucks through the same basic workflow as
              manual operations. That is meaningful field evidence, but the source explicitly characterizes the program
              as supervised autonomy rather than operator-out production. Separate reporting in August 2026 said Bedrock
              machines were doing work on real jobsites for Sundt and Zachry. Champion Site Prep is tied to a central
              Texas manufacturing-campus deployment, while Austin Bridge & Road and three other contractors are publicly
              identified at the partner or exploration stage without disclosed throughput.
            claimRefs:
              - CU004
              - CU005
              - CU007
              - CU008
              - CU009
              - CU016
