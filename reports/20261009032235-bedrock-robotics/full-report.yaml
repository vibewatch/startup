        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Four founders occupy the CEO, CTO, and two VP Engineering roles. Three are described as former Waymo
              engineering leaders, while the fourth previously worked on Segment's engineering systems. This is strong
              founder-market fit for safety-critical autonomy, but it also concentrates technical and product continuity
              in the founding group. Laurent Hautefeuille adds freight operating experience as COO, and the February
