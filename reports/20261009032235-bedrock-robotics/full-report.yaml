            body: >-
              The financing record accelerated quickly: Bedrock emerged from stealth in July 2025 with $80 million
              across Seed and Series A rounds, then announced a $270 million Series B on February 4, 2026. The
              company-issued release and an independent summary both put total funding above $350 million and the
              valuation at $1.75 billion, although neither states whether that value is pre-money or post-money.
              Operating evidence remains less standardized. Sources describe a supervised mass-excavation deployment on
              a 130-acre site, machines at active customer sites in three states, field testing in Texas and California,
              and an investor claim of more than 40 machines across five states. These are useful proof points, but they
              use different dates and denominators and should not be combined into a single current deployment count.
