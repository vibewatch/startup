  - id: TV001
    title: Recommendation Summary
    columns:
      - Dimension
      - Stance / Rating
      - Analytical Basis
      - Decision Implication
    rows:
      - - Recommendation
        - research-more
        - High autonomy software promise balanced against unproven recurring commercial unit economics.
        - Defer growth capital allocations pending verified fleet utilization and revenue metrics.
      - - Confidence
        - medium
        - Financing marks and field milestones are confirmed, but customer retention and margins are opaque.
        - Conduct proprietary reference checks with active contractors before setting bid prices.
      - - Risk Rating
        - high
        - Capital-intensive hardware retrofits, jobsite safety exposure, and severe downside multiple sensitivity.
        - Demand structural liquidation preferences and protective covenant governance.
      - - Valuation Stance
        - stretched
        - Priced at $1.75B post-money valuation in Series B; implies premium multiples on unverified top-line revenue.
        - Reject premium secondary offerings above primary round preferred share price marks.
    notes: >-
      Ratings synthesized from Series B financing documents, contractor pilot disclosures, and private secondary market
      tracking.
    claimRefs:
      - CV001
      - CV005
      - CV009
      - CV014
  - id: TV002
    title: Investment Thesis and Anti-Thesis Breakdown
    columns:
      - Perspective
      - Core Argument
      - Supporting Evidence
      - What Would Change the View
    rows:
      - - Bull Thesis
        - Massive structural construction labor shortage unlocked by low-friction fleet retrofits.
        - Reversible same-day hardware kit mounts on excavators with no permanent machine modifications.
        - Persistent field installation delays or high contractor churn following initial pilot stages.
      - - Bull Thesis
        - Demonstrated heavy earthmoving capability on active large-scale civil infrastructure sites.
        - Completed 65,000+ cubic yards mass excavation loading articulated haul trucks with Sundt Construction.
        - Failure to transition from human-supervised trials to true unassisted operator-less field work.
      - - Anti-Thesis
        - Top-line commercial revenue and unit profitability remain completely undisclosed and unverified.
        - ZoomInfo estimate of $54.3M revenue is unverified; company has not publicly disclosed financial metrics.
        - Audited financial reporting demonstrating software-like gross margins exceeding 60%.
      - - Anti-Thesis
        - Substantial preference capital overhang accumulates ahead of early equity and employee holdings.
        - Over $350M in senior liquidation preference capital established across Seed, Series A, and Series B rounds.
        - Substantial clean common equity participation and sustained positive operational free cash flow.
    notes: Synthesizes competitive operational proof against structural valuation and capitalization risks.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV008
      - CV013
  - id: TV003
    title: Valuation Scenario Analysis
    columns:
      - Scenario
      - Implied Valuation Range
      - Key Operational Assumptions
      - Critical Downside / Execution Risks
      - Probability Signal
    rows:
      - - Bull Case
        - $3.5B - $4.5B
        - Successful 2026 operator-less rollout, rapid contractor adoption, high-margin software subscriptions.
        - Hardware supply chain bottlenecks and unexpected regulatory jobsite safety restrictions.
        - Low (20%)
      - - Base Case
        - $1.4B - $1.8B
        - Steady expansion across Sunbelt regional earthmoving contractors with supervised autonomy.
        - Extended pilot validation cycles and hardware maintenance overhead compressing gross margins.
        - Medium (55%)
      - - Bear Case
        - $600M - $900M
        - Field safety incidents, slow operator-less transition, and aggressive OEM machine-control integration.
        - Severe multiple compression leading to down-round restructuring and senior preference dilution.
        - Moderate (25%)
    notes: >-
      Scenario ranges reflect 36-month horizon multiples on estimated fleet scale, autonomy reliability, and commercial
      traction.
    claimRefs:
      - CV001
      - CV010
      - CV011
      - CV012
      - CV015
      - CV016
