      - number: '6.4'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              The public record supports an expansion thesis, not proof of durable expansion. Bedrock has described a
              path from individual autonomous machines toward connected fleet orchestration, and Champion Site Prep's
              president discussed the potential to coordinate an entire fleet, reduce idle time, and free skilled people
              for supervision. Those statements describe intended value rather than measured renewal or upsell. None of
              the assigned evidence discloses contract length, paid conversion, gross or net revenue retention, churn,
              pricing, customer revenue, top-customer share, machine utilization, or support burden. The disclosed
              65,000-cubic-yard Sundt project therefore demonstrates operating exposure but cannot establish recurring
              economics. Customer concentration and procurement friction remain material diligence gaps, especially
              while the most detailed proof rests on one quantified supervised deployment.
            claimRefs:
              - CU004
              - CU009
