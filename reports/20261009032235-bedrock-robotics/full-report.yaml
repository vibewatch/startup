  - id: FU001
    title: Evidence-based customer adoption journey
    type: journey-map
    summary: >-
      The public path runs from workflow selection to supervised field proof; operator-out production and fleet
      expansion remain unverified.
    data:
      items:
        - label: 1. Select repetitive earthmoving
          detail: Mass excavation and truck loading are the clearest disclosed workflows.
          touchpoints:
            - Fleet operations
            - Project management
        - label: 2. Form a development partnership
          detail: Contractors supply active-site context; partner status alone does not establish payment.
          touchpoints:
            - Operations leadership
            - Safety team
        - label: 3. Retrofit an existing excavator
          detail: The system is described as reversible and installable without permanent machine modification.
          touchpoints:
            - Fleet shop
            - Field engineering
        - label: 4. Run supervised autonomy
          detail: The strongest quantified proof is Sundt's supervised Phoenix deployment.
          touchpoints:
            - Autonomous excavator
            - Human-operated haul trucks
        - label: 5. Validate operator-out operation
          detail: This was still a targeted milestone in February 2026, not a completed public proof point.
          touchpoints:
            - Safety case
            - Customer acceptance
        - label: 6. Expand to connected fleets
          detail: Fleet orchestration is an announced direction without disclosed retention or expansion metrics.
          touchpoints:
            - Multi-machine coordination
            - Renewal and expansion
    approximationNotes: >-
      The stages synthesize disclosed workflow and roadmap evidence; they are not a measured conversion funnel and imply
