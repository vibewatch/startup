chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Bedrock Robotics was founded in May 2024 and is headquartered in San Francisco. Its product is an autonomy
              layer for heavy construction equipment: public materials describe reversible hardware and software
              installations on existing excavators, bulldozers, and loaders rather than a requirement to replace an
              installed fleet. That retrofit position may reduce a contractor's initial equipment-switching burden, but
              the allocated evidence does not disclose pricing, contract duration, service obligations, or recognized
              revenue. The company's own website frames the outcome as autonomous fleets that expand construction
              capacity; that is a product ambition, not evidence that fleet-level autonomy is already generally
              available. The clearest public operating stage is therefore a Series B company moving from supervised
              field work toward a targeted operator-less deployment.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
              - CO012
