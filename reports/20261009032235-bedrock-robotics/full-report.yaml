      - number: '5.2'
        title: Perception, Motion Planning, and Jobsite Workflows
        blocks:
          - type: paragraph
            body: >-
              Autonomous excavation requires solving complex physical interaction dynamics where machines must not
              merely navigate terrain, but actively deform and sculpt earth with centimetric precision [CE006].
              Bedrock's perception suite fuses multi-modal sensor inputs—including solid-state LiDAR, optical
              stereoscopic cameras, and precision inertial measurement units (IMUs)—to construct high-fidelity 3D
              volumetric topological maps of active work zones in real time [CE007]. Proprietary machine learning
              algorithms and neural motion planners interpret raw volumetric point clouds to optimize bucket trajectory,
              dig vectors, and shovel fill factors [CE008]. This enables continuous mass excavation, automated
              trenching, and soil redistribution cycles while dynamically compensating for shifting terrain, soil
              resistance, and mechanical vibrations [CE009]. In live field operations, the platform coordinates machine
              actions to maintain uniform load-time consistency for haul trucks, mitigating operator fatigue and
              sustaining operational tempos across extended operational shifts [CE010].
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE006
              - CE008
              - CE009
              - CE010
              - CE012
      - number: '5.3'
        title: Deployment Maturity, Operational Constraints, and Safety Controls
        blocks:
          - type: paragraph
            body: >-
              Bedrock has advanced its autonomy capabilities across commercial customer sites in California, Arizona,
              Texas, and Arkansas, including a verified deployment executing supervised mass excavation across a
              130-acre manufacturing facility in late 2025 [CE011]. Industrial construction contractors such as Sundt
              Construction and Champion Site Prep utilize the platform to complement existing jobsite crews, increasing
              daily asset utilization on critical infrastructure, industrial campuses, and data center developments
              [CE012]. Despite these operational milestones, the technology currently operates primarily under
              supervised autonomy regimes where human safety drivers or site monitors oversee machine actions [CE013].
              Commercial progression toward fully operator-less excavation, targeted for customer deployment in 2026,
              requires resolving severe technical edge cases in extreme dust, adverse precipitation, and unmapped
              underground utility strikes [CE014]. Furthermore, because heavy machinery lacks standardized drive-by-wire
              interfaces across legacy OEM variants, fleet-wide scaling entails significant calibration overhead and
              custom ECU bridging across heterogeneous machine vintages [CE015].
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE005
              - CE007
              - CE008
              - CE014
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Strategic Advantage of Aftermarket Retrofit Versus Custom Machinery
            body: >-
              By packaging its autonomy technology into reversible, same-day retrofit kits for standard 20-to-80-ton
              excavators, Bedrock avoids the capital intensity, manufacturing overhead, and dealer distribution friction
              of building new equipment. This asset-light approach allows civil contractors to automate existing
              machinery while preserving their existing capital investments and maintenance ecosystems.
            calloutType: insight
            claimRefs:
              - CE002
              - CE003
          - type: callout
            title: The Supervised-to-Unsupervised Operational Chasm in Heavy Autonomy
            body: >-
              While Bedrock has demonstrated successful supervised mass excavation on customer jobsites, transitioning
              to fully operator-less deployment in 2026 presents steep technical and liability hurdles. In heavy
              excavation, false negatives in obstacle detection, unmodeled subsurface obstacles, or sensor blinding from
              dense dust plumes carry catastrophic mechanical and safety risks, necessitating rigorous fail-safe
              architectures.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segments and buying center
        blocks:
          - type: paragraph
            body: >-
              Bedrock's disclosed customer set clusters around general contractors, heavy-civil builders,
              site-preparation specialists, and materials operators that already own excavator fleets. The buyer is
              likely fleet or operations leadership, while operators, project managers, and safety teams are the daily
              users; the public sources do not identify the contractual payer or procurement owner. The retrofit model
              is relevant because it is described as a reversible, same-day installation on existing equipment rather
              than a requirement to replace the fleet. Public partner names span Sundt Construction, Zachry
              Construction, Champion Site Prep, Austin Bridge & Road, Maverick Constructors, Haydon Companies, and
              Capitol Aggregates, but being named in a partner program is not equivalent to a paid production
              deployment.
            claimRefs:
              - CU001
              - CU002
              - CU008
          - type: table
