      - number: '6.3'
        title: Adoption trajectory and maturity
        blocks:
          - type: paragraph
            body: >-
              Bedrock's disclosed trajectory moved from active customer sites in Arizona, Texas, and Arkansas in July
              2025 to a large supervised Sundt test by December 2025 and named real-jobsite activity by August 2026. The
              evidence does not show that the company completed its planned operator-out transition: in February 2026
              the CEO said the system remained in development and testing, with the first fully operator-out deployments
              targeted for later that year. Broader construction demand is encouraging but not a Bedrock conversion
              metric. Construction Dive reported that some use of robotics among surveyed contractors grew 45% year over
              year and that the pilot-only group nearly tripled, while also describing robotics as early-stage and
              highlighting poor project data as an implementation obstacle.
            claimRefs:
              - CU003
