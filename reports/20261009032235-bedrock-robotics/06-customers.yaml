company:
  name: "Bedrock Robotics"
chapter:
  number: 6
  title: "Customers"
  summary: "Bedrock has credible but still early customer proof: supervised excavators moved more than 65,000 cubic yards on a Sundt site, and public sources name several contractor partners. The available evidence does not establish operator-out production, retention, commercial pricing, expansion economics, or customer concentration."
sections:
  - id: "segments-and-buying-center"
    title: "Segments and buying center"
    body: >-
      Bedrock's disclosed customer set clusters around general contractors, heavy-civil builders,
      site-preparation specialists, and materials operators that already own excavator fleets.
      The buyer is likely fleet or operations leadership, while operators, project managers, and
      safety teams are the daily users; the public sources do not identify the contractual payer
      or procurement owner. The retrofit model is relevant because it is described as a reversible,
      same-day installation on existing equipment rather than a requirement to replace the fleet.
      Public partner names span Sundt Construction, Zachry Construction, Champion Site Prep,
      Austin Bridge & Road, Maverick Constructors, Haydon Companies, and Capitol Aggregates, but
      being named in a partner program is not equivalent to a paid production deployment.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU008"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "deployment-proof"
    title: "Deployment proof and named references"
    body: >-
      The strongest public customer proof is Sundt's supervised mass-excavation test at a 130-acre
      manufacturing site in Phoenix. Equipment World reported that more than 65,000 cubic yards
      had been moved, with autonomous excavators loading human-operated articulated dump trucks
      through the same basic workflow as manual operations. That is meaningful field evidence,
      but the source explicitly characterizes the program as supervised autonomy rather than
      operator-out production. Separate reporting in August 2026 said Bedrock machines were doing
      work on real jobsites for Sundt and Zachry. Champion Site Prep is tied to a central Texas
      manufacturing-campus deployment, while Austin Bridge & Road and three other contractors
      are publicly identified at the partner or exploration stage without disclosed throughput.
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU016"
    tableRefs:
      - "TU003"
  - id: "adoption-trajectory"
    title: "Adoption trajectory and maturity"
    body: >-
      Bedrock's disclosed trajectory moved from active customer sites in Arizona, Texas, and
      Arkansas in July 2025 to a large supervised Sundt test by December 2025 and named real-jobsite
      activity by August 2026. The evidence does not show that the company completed its planned
      operator-out transition: in February 2026 the CEO said the system remained in development
      and testing, with the first fully operator-out deployments targeted for later that year.
      Broader construction demand is encouraging but not a Bedrock conversion metric. Construction
      Dive reported that some use of robotics among surveyed contractors grew 45% year over year
      and that the pilot-only group nearly tripled, while also describing robotics as early-stage
      and highlighting poor project data as an implementation obstacle.
    claimRefs:
      - "CU003"
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU015"
    tableRefs:
      - "TU002"
  - id: "durability-expansion-and-concentration"
    title: "Durability, expansion, and concentration"
    body: >-
      The public record supports an expansion thesis, not proof of durable expansion. Bedrock has
      described a path from individual autonomous machines toward connected fleet orchestration,
      and Champion Site Prep's president discussed the potential to coordinate an entire fleet,
      reduce idle time, and free skilled people for supervision. Those statements describe intended
      value rather than measured renewal or upsell. None of the assigned evidence discloses contract
      length, paid conversion, gross or net revenue retention, churn, pricing, customer revenue,
      top-customer share, machine utilization, or support burden. The disclosed 65,000-cubic-yard
      Sundt project therefore demonstrates operating exposure but cannot establish recurring
      economics. Customer concentration and procurement friction remain material diligence gaps,
      especially while the most detailed proof rests on one quantified supervised deployment.
    claimRefs:
      - "CU004"
      - "CU009"
      - "CU013"
      - "CU014"
