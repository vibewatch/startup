    title: "A quantified supervised reference"
    body: "Sundt's Phoenix test provides the clearest public proof because it combines an identified customer, an active jobsite, a defined workflow, and more than 65,000 cubic yards moved. It is still a supervised test, so it validates field exposure rather than operator-out production or recurring economics."
    claimRefs:
