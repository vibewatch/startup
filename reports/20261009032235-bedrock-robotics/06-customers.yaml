  - calloutType: "risk"
    title: "Commercial durability is not observable"
    body: "The assigned evidence does not disclose retention, churn, contract length, pricing, revenue concentration, utilization, or pilot-to-production conversion. These missing denominators prevent a defensible conclusion about customer durability or land-and-expand performance."
    claimRefs:
