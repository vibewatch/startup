            body: >-
              Bedrock 已在加州、亚利桑那、得州和阿肯色州的商业客户现场推进自动驾驶能力，包括 2025 年末在一处 130 英亩制造设施完成受监督大规模挖掘的经验证部署 [CE011]。Sundt
              Construction 和 Champion Site Prep 等工业建设承包商利用该平台补充现有工地团队，提高关键基础设施、工业园区和数据中心项目的日常资产利用率
              [CE012]。尽管取得这些运营里程碑，技术目前主要仍处于受监督自动驾驶模式，由人工安全驾驶员或现场监控员监督机器动作 [CE013]。面向 2026
              年客户部署的完全无人挖掘，要解决严重的技术边界问题，包括极端粉尘、恶劣降水和未测绘地下管线碰撞 [CE014]。此外，重型机械在不同旧款 OEM
              之间缺乏标准化线控接口，因此车队规模化需要大量校准工作，并为不同机器年代定制 ECU 桥接 [CE015]。
