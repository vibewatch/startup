            title: 量化的受监督参考案例
            body: >-
              Sundt 的 Phoenix 测试提供了最清晰的公开证明，因为它同时具备明确客户、活跃工地、定义清晰的工作流，以及超过 6.5
              万立方码的搬运量。它仍是受监督测试，因此验证的是现场接触，而非无人生产或经常性经济性。
            calloutType: strength
            claimRefs:
              - CU004
              - CU005
          - type: callout
            title: 商业持久性无法观察
            body: 分配证据没有披露留存率、流失率、合同期限、定价、收入集中度、利用率或从试点到生产的转化。这些缺失的分母使人无法有理有据地判断客户持久性或土地与扩展表现。
            calloutType: risk
            claimRefs:
              - CU013
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险格局与监管治理
        blocks:
          - type: paragraph
            body: >-
              重型建筑挖掘涉及 50 吨级机器在动态、非结构化物理环境中作业，机械或感知错误可能造成灾难性结构损坏、设备毁坏或工地致命伤害。Bedrock Robotics
              采用当天完成、可逆的售后改装，把现有承包商车队改造成自动化机器，而不是制造定制原始设备。然而，联邦和州层面对无人越野土方设备的整体监管框架仍大体没有成文。联邦 OSHA 依据 29 CFR 1926
              规定了一般义务和机械安全要求，但没有明确的自动化认证规程或正式偏离机制。因此，商业部署目前依赖承包商监督的运营边界和现场风险审批；随着自动化重型车队跨司法辖区扩张，这使 Bedrock
              面临停工干预或州监管立场变化的风险。
            claimRefs:
              - CR001
              - CR002
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR013
      - number: '7.2'
        title: 运营安全与工地执行
        blocks:
          - type: paragraph
            body: >-
              活跃商业工地的物理安全既是 Bedrock 的首要运营风险，也是其核心价值主张。Bedrock Operator 自动驾驶套件集成了提供完整 360
              度周界视野的摄像头，以及旨在消除导致致命工地事故的传统盲区的厘米级 LiDAR 传感器。内置失效保护机制在传感器置信度下降或出现未经批准的现场条件时，强制自动零延迟停车。在包括与 Sundt
              Construction 合作的国内制造业园区，以及与 Zachry Construction 合作的土木场地作业中，Bedrock 已展示受监督的大规模挖掘，在 20 至 80 吨挖掘机级别上搬运超过 6.5
              万立方码土方。尽管有这些防护，严酷环境下的长期运营韧性——例如强沙尘暴、传感器失明、泥浆飞溅和液压阀磨损——仍需持续用实证验证。
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR011
      - number: '7.3'
        title: 云基础设施与合作伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              Bedrock 的核心机器学习训练、视频处理和场景分类基础设施，高度依赖外部云平台和托管编排层。公司的多模态机器人流水线依赖 Anyscale 托管、跨多个 AWS 云区域部署的 Ray 集群。为了在 12
              个月内将计算量从 20,000 扩张 85 倍至 1.7m vCPU 小时，Bedrock 约 80% 的计算车队运行在 AWS Spot 实例上（约七成至八成）。仅 2025 年第四季度，Anyscale
              的自动调度器就在 9.4 万计算小时内处理了 1.5 万次 Spot 中断。此外，商业客户采用明显集中于早期重型土木承包商群体，尤其是 Sundt Construction、Zachry Construction
              和 Champion Site Prep；它们是否持续支持，对建立商业可信度至关重要。
            claimRefs:
              - CR006
              - CR007
              - CR010
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR010
      - number: '7.4'
        title: 财务资本密集度与模型风险
        blocks:
          - type: paragraph
            body: >-
              Bedrock Robotics 的财务风险画像，是高强度上游研发资本需求与尚未证明的软件加改装单位经济性叠加的结果。公司在 2026 年 2 月完成 2.7 亿美元 B 轮融资后，投后估值达到 17.5
              亿美元，累计融资超过 3.5 亿美元。虽然这些资本资源提供了充足运营跑道，但计算消耗和分布式工程团队的快速扩张持续带来现金消耗压力。关键是，公司尚未公开披露
              ARR、毛利率、硬件改装成本或无人操作期间的机器损失率。如果计算 Spot 市场价格上涨，或主要基础设施供应商的云容量供应收紧，毛利率可能在公司实现车队级运营杠杆前大幅收缩。
            claimRefs:
              - CR008
              - CR009
              - CR014
      - number: '7.5'
        title: 风险综合、监控触发器与尽调要求
        blocks:
          - type: paragraph
            body: >-
              综合 Bedrock 的风险格局，可以看出物理工程执行与商业估值现实之间存在明显分歧。美国建筑劳动力面临人口压力：约 41% 的在岗工人预计将在 2031
              年前退休，这为土方自动化创造了强劲的宏观需求。然而，早期承包商集中度、跨多个办公枢纽快速扩张的企业 IT
              基础设施，以及未披露的责任承保条款，都构成明确的论点破坏触发器。关键监控里程碑包括任何导致监管停工令的灾难性现场碰撞、改装挖掘机的 OEM
              保修争议，或核心参考承包商退出。在确认后期估值基准前，投资人必须优先完成商业赔偿安排、功能安全审计报告和合同核实的客户续约率等技术尽调。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR009
              - CR010
              - CR013
      - number: '7.6'
        title: 展示项
        blocks:
          - type: callout
            title: Spot 计算与云基础设施脆弱性
            body: >-
              Bedrock 依赖运行在最高 80% AWS Spot 实例上的 Anyscale 托管 Ray 集群，使其核心 AI 训练循环暴露于云容量波动。虽然自动处理 Spot 中断在 2025
              年末节省了大量工程时间，但随着模型复杂度上升，Spot 价格突然上涨或区域 GPU/vCPU 容量紧张，都构成未对冲的运营风险。
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR008
          - type: callout
            title: 安全防护作为商业推动力
            body: >-
              与在公共道路上运行的乘用车自动驾驶不同，越野自动挖掘机在受控、地理围栏环境中运行，保守的 360
              度入侵停车机制可以立即降低风险。承包商表示，消除盲区并让操作员离开危险的摆动驾驶室，提供了有说服力的安全理由，足以超过早期试点的怀疑。
            calloutType: insight
            claimRefs:
              - CR002
              - CR003
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Bedrock Robotics 的核心乐观论点，在于解决基础设施、数据中心和先进制造领域严重且长期的建筑劳动力短缺与积压压力。Bedrock 通过可逆的 Bedrock Operator
              套件改装承包商现有的挖掘机、推土机和装载机，而不是制造定制黄色铁器，从而实现当天部署且不永久改动车架。在大型民用项目上的现场验证——例如在 Sundt Construction 一处 130
              英亩工业场地通过受监督自动驾驶搬运超过 6.5 万立方码土方——证明了重型土方作业的技术可行性。此外，CapitalG、Valor Equity Partners、Eclipse、8VC 和 NVIDIA
              NVentures 的支持，确认了机构投资人对 Bedrock
              运营履历的信心。反方论点则强调，高毛利工业机器人估值需要可重复的商业客户扩展，而公开申报尚未验证这一点。没有可验证的自动化作业时长、车队单位经济性或硬件保修负担披露，私募投资者可能会为一家实际上是资本密集型硬件改装服务的公司，支付市场顶端的生成式
              AI 倍数。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV013
      - number: '8.2'
        title: 建议、置信度与估值立场
        blocks:
          - type: paragraph
            body: >-
              我们的战术投资建议为继续研究，置信度中等，整体风险较高，估值立场则被归为偏高。Bedrock 于 2026 年 2 月完成 B 轮融资，在 B 轮和 B-1 轮合计募资 $270 million 后，投后估值达到
              $1.75 billion，累计实缴资本超过 $350 million。尽管公司估值较 2025 年 7 月 A 轮 $360.66 million
              的投后估值增长逾四倍，核心收入和利润率披露仍完全不公开。未经验证的数据聚合机构估算收入为 $54.3 million，意味着收入倍数超过
              32x；相比之下，公开市场的工业自动化和机器人可比公司在正常环境下交易于个位数至十几倍。通过 Forge Global
              等私募市场追踪的二级交易显示流动性有限，尚未形成独立且稳定的撮合清算价，也反映出机构入场仍较谨慎。在 Bedrock 证明签约 ARR
              规模、在多个区域承包商中验证净收入留存，并明确安全责任赔偿之前，我们建议机构配置者暂缓新增后期股权资本。
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV009
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV009
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV010
              - CV014
      - number: '8.3'
        title: 情景建模、下行触发因素与尽调要求
        blocks:
          - type: paragraph
            body: >-
              我们以 36 个月投资期为框架，评估 Bedrock Robotics 的三种运营情景。乐观情景下，Bedrock
              成功从有人监督的现场试验转向无需操作员的商业部署，在头部一级民用承包商中加速车队软件变现，从而支撑 $3.5 billion 至 $4.5 billion
              的估值结果。基准情景下，部署稳步增长，但承包商漫长的预算周期、硬件维护开销和持续的人身安全监管要求会压低增速，合理价值区间约为 $1.4 billion 至 $1.8
              billion。悲观情景下，现场安全脱离事件、天气造成的自主能力限制，或宏观经济导致建筑业放缓，都会推迟无操作员采用，触发严重的估值倍数压缩，并将融资重组压向 $600 million 至 $900
              million。核心论点可能被打破的触发因素包括重大工地安全事故、Sundt 或 Champion Site Prep
              等旗舰承包商客户流失，或原始设备制造商积极进入市场并推出原生自动挖掘机。当前最紧迫的尽调重点是客户层面的账单安排、硬件套件制造的单位经济性，以及正式的商业损失赔偿保障。
            claimRefs:
              - CV003
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 后期私人机器人项目的入场纪律
            body: >-
              Bedrock Robotics 已展现出有吸引力的工程能力和承包商兴趣，但 $1.75 billion 的 B
              轮估值设定了极高的业绩门槛。在公司提供可验证的队列数据，证明自主机器利用率和可重复的软件收入之前，成长型投资者应避免追逐上行的二级价格或缺乏依据的轮次估值上调。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV014
          - type: callout
            title: 清算优先权与倍数压缩风险
            body: Seed、A 轮和 B 轮累计募得超过 $350 million 的优先股资本。若转向无需操作员的商业运营出现重大延误，可能被迫进行下轮融资；在严格的 1.0x 高级优先权结构下，这会损害初级和普通股股东的利益。
            calloutType: risk
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV012
