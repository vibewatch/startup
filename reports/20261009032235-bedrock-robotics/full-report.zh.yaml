      - number: '4.2'
        title: 市场进入、现场部署与客户试点
        blocks:
          - type: paragraph
            body: >-
              Bedrock
              的商业市场进入策略面向大型总承包商、土方分包商和基础设施建设方，解决他们长期面临的重型设备操作员短缺。公司强调当天完成、可逆的硬件安装，让客户机器在不自动运行时仍保留标准操作员能力，从而降低初始采用门槛。商业部署已通过多州现场试验推进；公开记录显示，亚利桑那、得州和阿肯色州的工业设施、数据中心园区和公路项目都有受监督的活跃机器运行。与
              Sundt Construction 和 Champion Site Prep 等成熟建设方的战略现场合作，为运营验证提供了重要场景。值得注意的是，2025 年 11 月，Bedrock 与 Sundt
              合作，在一处 130 英亩制造业场地展示了受监督的自动化大规模挖掘。在投资者端，UpMarket 和 EquityZen 等经纪交易平台提供 IPO 前股份机会，隐含 B 轮估值为 17.5 亿美元，最低承诺额为
              5 万美元。尽管有这些商业验证里程碑，客户合同期限、销售周期、获客成本和扩展经济性仍是严格保密的私有数据。
