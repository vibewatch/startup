            body: >-
              Bedrock Robotics 在 2026 年 2 月 4 日宣布完成 $270m B 轮融资后，短期资产负债表流动性非常充足。本轮由 Alphabet 的成长基金 CapitalG 和 Valor
              Atreides AI Fund 共同领投，Nvidia 的 NVentures、Eclipse Ventures、8VC、Emergence Capital 以及 MIT 等机构捐赠基金参与，使累计股权融资超过
              $350m，投后估值达到 $1.75b 至 $1.8b。充足的现金缓冲让 Bedrock 有数年跑道，可投入高强度机器人研发、安全验证和商业团队扩张。截至 2026 年 8 月，公司估计拥有 160
              名员工，运营费用率较高，但在当前现金储备内仍可管理。然而，潜在投资人的财务判断仍应谨慎：Bedrock
              数十亿美元估值已经计入无瑕疵的商业执行和软件毛利率快速兑现。由于机器部署数量、客户群留存率、现金消耗速度和毛利率都未披露，机构投资判断不能只依赖公开数据。重大资本承诺需要对商业合同、单位贡献经济性和无人操作安全验证时间表进行审计核实。
