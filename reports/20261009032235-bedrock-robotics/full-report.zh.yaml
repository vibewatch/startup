      - number: '4.3'
        title: 成本结构、毛利率动态与单位经济性
        blocks:
          - type: paragraph
            body: >-
              Bedrock 自动驾驶改装模式的经济可行性取决于硬件组件单位成本和持续交付服务的间接费用。每套改装的物料清单包括加固 LiDAR
              传感器、光学摄像头、惯性测量单元、计算机外壳，以及能在剧烈振动施工环境中生存的线控执行接口。除初始硬件组装和安装人工外，交付服务成本还包括传感器重新校准、地图更新和远程操控监督。在 Bedrock
              达到完全无人现场部署目标之前，现场人工安全操作员或远程操控中心将构成重要的可变运营成本，压低初期部署毛利率。在公开可比市场中，成熟的施工机械和自动化工程承包商的企业价值 / 收入倍数在 0.2x 至 3.4x
              之间（例如 Wacker Neuson 为 0.8x，Harbin Boshi Automation 为 3.4x），凸显 Bedrock
              当前私有估值中包含的溢价倍数。完整尽调必须检查机器层面的贡献利润、安装人工小时数、远程操作员与机器的监督比例，以及硬件保修准备金，以确认可持续的单位盈利能力。
