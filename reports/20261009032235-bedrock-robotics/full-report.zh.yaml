      - number: '5.2'
        title: 感知、运动规划与工地工作流
        blocks:
          - type: paragraph
            body: >-
              自动挖掘需要解决复杂的物理交互动态：机器不仅要在地形中导航，还要以厘米级精度主动改变和塑造土体 [CE006]。Bedrock 的感知套件融合多模态传感器输入，包括固态
              LiDAR、光学立体摄像头和精密惯性测量单元（IMU），实时构建活跃工作区的高保真三维体积拓扑地图 [CE007]。专有机器学习算法和神经运动规划器解读原始体积点云，以优化铲斗轨迹、挖掘向量和铲斗装载系数
              [CE008]。这使系统能够持续进行大规模挖掘、自动开沟和土壤转移循环，并动态补偿地形变化、土壤阻力和机械振动
              [CE009]。在现场作业中，平台协调机器动作，保持运输卡车装载时间的一致性，减轻操作员疲劳，并在长时间轮班中维持作业节奏 [CE010]。
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
