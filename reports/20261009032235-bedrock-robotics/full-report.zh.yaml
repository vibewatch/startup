chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Bedrock Robotics 成立于 2024 年 5
              月，总部位于旧金山。其产品是重型工程设备的自动驾驶层：公开材料描述的是在现有挖掘机、推土机和装载机上安装可逆的硬件与软件，而不是要求客户更换现有设备。改装模式可能降低承包商初始切换设备的负担，但已分配证据未披露定价、合同期限、服务义务或确认收入。公司官网将结果描述为扩大施工能力的自动化车队；这属于产品愿景，并不能证明车队级自动驾驶已经普遍可用。因此，最清晰的公开运营阶段是：公司处于
              B 轮，从受监督现场作业走向目标中的无人操作部署。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
              - CO012
