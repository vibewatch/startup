        - 硬件套件可在挖掘机上当日可逆安装，不对机器做永久改动。
        - 初始试点阶段后，现场安装持续延迟或承包商流失率很高。
      - - 乐观论点
        - 已在运行中的大型土木基础设施场地证明重型土方作业能力。
        - 与 Sundt Construction 合作完成 65,000+ 立方码的大规模挖掘，并为铰接式运输卡车装料。
