  - id: FE001
    title: Bedrock 自主挖掘系统架构
    type: stack
    summary: 多层技术栈展示物理车辆集成、边缘感知、算法运动规划和车队运营如何协同交付自主土方作业。
    data:
      layers:
        - label: 车队编排与工地运营
          modules:
            - 云端任务调度器
            - 数字 CAD/BIM 场地模型导入器
            - 作业区地理围栏安全监控器
          outputs:
            - 挖填进度报告
            - 车队健康遥测
        - label: 场地通信与数据中继
          modules:
            - 场地网状网络
            - 低延迟远程操控桥接
            - 边缘遥测上传器
          outputs:
            - 远程实时状态链路
            - 加密安全心跳
        - label: 自主规划与运动控制
          modules:
            - 3D 体积地形映射器
            - 动态挖掘与回转轨迹优化器
            - 土壤阻力与负载补偿器
          outputs:
            - 毫秒级液压执行指令
            - 碰撞规避向量
        - label: 感知与边缘计算
          modules:
            - 高清固态 LiDAR
            - 双目摄像头障碍物检测
            - 惯性测量与实时动态定位
          outputs:
            - 融合体积点云
            - 360 度危险包络
        - label: 车辆接口与液压执行
          modules:
            - J1939 / CAN 总线协议桥
            - 电液阀接口
            - 硬件紧急停止（E-Stop）继电器
          outputs:
            - 动臂、斗杆和铲斗比例阀驱动
            - 故障安全液压卸载
        - label: 挖掘机实体基础平台
          modules:
            - 20-to-80 吨挖掘机底盘
            - 主液压先导歧管
            - 辅助稳压电源
          outputs:
            - 液压油流向执行器
            - 履带与回转运动
    approximationNotes: 这是基于系统披露、工程岗位招聘信息和技术拆解分析整理出的逻辑架构示意。
    claimRefs:
      - CE004
      - CE005
      - CE007
      - CE008
  - id: FU001
    title: 基于证据的客户采用路径
    type: journey-map
    summary: 公开路径从工作流选择走到有人监督的现场验证；脱离操作员的生产运行和车队扩张仍未得到验证。
    data:
      items:
        - label: 1. 选择重复性土方作业
          detail: 大规模挖掘和卡车装载是披露最清楚的工作流。
          touchpoints:
            - 车队运营
            - 项目管理
        - label: 2. 建立开发合作关系
          detail: 承包商提供真实工地场景；仅凭合作伙伴身份，不能证明已经付费。
          touchpoints:
            - 运营管理层
            - 安全团队
        - label: 3. 改装现有挖掘机
          detail: 披露称，该系统可逆，安装时无需对机器做永久性改造。
          touchpoints:
            - 车队维修车间
            - 现场工程
        - label: 4. 运行有人监督的自动化系统
          detail: 目前最有力的量化证据，是 Sundt 在 Phoenix 的有人监督部署。
          touchpoints:
            - 自动驾驶挖掘机
            - 人工驾驶的运输卡车
        - label: 5. 验证脱离操作员的运行
          detail: 这在 2026 年 2 月仍只是目标里程碑，并非已经完成的公开验证点。
          touchpoints:
            - 安全论证
            - 客户验收
        - label: 6. 扩展到联网车队
          detail: 车队编排只是已宣布的方向，尚未披露留存或扩张指标。
          touchpoints:
            - 多机协同
            - 续约与扩张
    approximationNotes: 这些阶段综合了已披露的工作流和路线图证据；它们不是经过测量的转化漏斗，也不代表任何转化率。
    claimRefs:
      - CU002
      - CU005
      - CU006
      - CU010
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 该矩阵评估关键风险类别的发生可能性、影响严重程度、缓释措施成熟度和剩余风险水平。
    data:
      columns:
        - 可能性
        - 影响严重程度
        - 缓释成熟度
        - 剩余风险
      rows:
        - label: 灾难性工地碰撞
          values:
            - 低
            - 严重
            - 先进
            - 低
        - label: 监管认证延迟
          values:
            - 中
            - 高
            - 早期
            - 高
        - label: 即时算力中断与成本
          values:
            - 高
            - 中
            - 成熟中
            - 中
        - label: 早期承包商集中度
          values:
            - 高
            - 高
            - 成熟中
            - 高
        - label: OEM 保修与服务冲突
          values:
            - 中
            - 高
            - 早期
            - 高
        - label: B 轮估值下调
          values:
            - 高
            - 高
            - 未缓释
            - 高
    approximationNotes: 剩余风险水平是对已发布工程安全措施、商业披露和合作伙伴集中度数据的定性综合判断。
    claimRefs:
      - CR002
      - CR006
      - CR007
      - CR009
      - CR010
      - CR013
  - id: FV001
    title: 建议决策逻辑
    type: flow
    summary: 这条逻辑决策路径把技术自动化验证、估值倍数和尽调要求串联起来，导向“继续研究”的建议。
    data:
      nodes:
        - label: 现场验证
          description: Sundt 的 130 英亩工业项目已完成超过 65,000 立方码的有人监督土方作业。
        - label: 资本流入
          description: 公司完成 $270M B 轮融资，投后估值 $1.75B，由 CapitalG 和 Valor Atreides 联合领投。
        - label: 数据不透明
          description: 核心 ARR 跑速、客户留存队列和单位利润率均完全未披露。
        - label: 资本压顶
          description: 在次级股权和普通股之前，已累计超过 $350M+、享有 1.0x 优先清算权的优先资本。
        - label: 估值立场
          description: 在营收表现尚未验证的情况下，目前 $1.75B 的估值显得偏高。
        - label: 战术判断
          description: 建议：继续研究；要求提供经核实的客户账单队列和负债条款。
      edges:
        - - Field Proof
          - Capital Inflow
        - - Capital Inflow
          - Data Opacity
        - - Data Opacity
          - Capital Overhang
        - - Capital Overhang
          - Valuation Stance
        - - Valuation Stance
          - Tactical Call
    approximationNotes: 流程图展示了把现场证据与资本配置决策连接起来的定性门槛评估。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV007
      - CV010
      - CV014
