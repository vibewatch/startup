  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场应围绕承包商自有或控制的重型设备自动驾驶改装来界定，而不是覆盖整个建筑业。Bedrock
              称其为日常设备配置自动驾驶能力，第三方报道则描述了在现有车队上进行可逆、当天完成的安装，并指出公司初期聚焦挖掘机。这个定义包括与土方作业相关的改装硬件、自动驾驶软件、部署、监控和支持；不包括挖掘机购买价、通用建筑软件、垂直建筑工种，以及无法使用自动化重型机械的全部建筑支出。现状是每台机器由人工操作，并辅以设备租赁、加班、分包和工期缓冲。新型自动化机器和承包商内部自动化项目是相邻替代方案，但分配证据没有量化它们的支出或
              Bedrock 的份额。
            claimRefs:
              - CM001
              - CM009
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM013
      - number: '2.2'
        title: 避免虚假精确的市场测算
        blocks:
          - type: paragraph
            body: >-
              现有数字只是市场背景，并不能组成连贯的 TAM/SAM/SOM 分层。独立报道引用了 $13t 的全球建筑业、2024 年美国制造业厂房投资 $238b，以及重型设备每年 1.25b
              亿小时的运行时间。这些指标的地域、期间、单位和分母都不同，没有一个能识别可购买自动驾驶改装的部分。劳动力压力方向一致，但数值也不一致：来源分别提到 50 万工人短缺、2025 年需要 43.9
              万名工人，以及两年内短缺 80 万人。差异可能源于定义和预测窗口不同，因此不应取平均值。可信的 SAM 需要按设备类别统计符合条件的机器数量、年度改装定价、利用率门槛和目标地域；SOM
              还需要部署能力、销售周期和赢单率证据。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM015
      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              最可能的直接经济买方是控制设备和劳动力预算的承包商、土方分包商或车队运营商；现场主管和设备操作员是日常用户，项目业主则通过工期和成本结果间接受益。亚利桑那、得州和阿肯色州客户现场有设备运行，支持以试点为先的采用路径，而非广泛商业渗透。买方可以先在一台挖掘机上试用可逆改装，验证安全性、生产率和工作流匹配度，再按项目或车队扩展。相较于更换设备，改装兼容性降低了资本门槛，但不会消除采购摩擦：买方仍需新增预算科目、接入工地流程、培训监督人员、获得保险认可，并证明实际节省超过部署和支持成本。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM012
              - CM013
              - CM016
      - number: '2.4'
        title: 驱动因素、约束与估值关联
        blocks:
          - type: paragraph
            body: >-
              再工业化、制造业和数据中心建设、劳动力稀缺，以及庞大的存量设备，都构成可信的采用驱动因素。被分配资料池中最有力的现场数据点是一篇报道：两台改装挖掘机在公路项目的首月完成了 4
              万立方码土方，包括夜班作业且没有生产率损失。这证明了可行性，但不是全车队 ROI
              基准。采用风险依然不小：行业评论称机器人融资正在上升而采用率却在下降，并认为产品可能需要实现数量级的成果才能争取预算。Bedrock 据报道与监管机构合作，并设定了 2026
              年无人操作目标，但这些都不能证明已获监管批准、保险接受、规模化可用或具备可重复的单位经济性。在公司提供部署群组、定价、留存和回本期数据前，不应把全行业数字转成收入假设，也不应用来支撑当前估值。
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM008
              - CM011
              - CM012
              - CM014
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 改装是采用切入口
            body: 在现有设备上进行可逆安装，可以减少更换设备的资本开支，让承包商先在一个项目上验证自动驾驶后再扩展，但公开来源尚未显示从试点转为车队部署。
            calloutType: insight
            claimRefs:
              - CM009
              - CM010
              - CM013
          - type: callout
            title: 行业规模不等于公司 TAM
            body: 13 万亿美元建筑业数字仅是背景。没有符合条件的车队数量、定价、利用率、部署能力和赢单率，把它转成 Bedrock 收入就是虚假精确。
            calloutType: risk
            claimRefs:
              - CM002
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与同业分类
        blocks:
          - type: paragraph
            body: >-
              自动化施工周边的竞争场域，除根深蒂固的人工操作基线外，可分为三类架构：工厂集成式原始设备制造商（OEM）自动驾驶、第三方远程操控改装，以及自动化土方作业平台。Caterpillar 和 Komatsu
              等重型设备厂商拥有主导分销网络、成熟的现场服务基础设施和长期客户关系，但其技术路线主要强调封闭生态的工厂自动化，以及严格绑定自有机器的远程引导，导致多品牌土木承包商车队服务不足。与此同时，远程操控竞争者把工人从危险驾驶室移到场外控制台，解决了人身安全问题，却无法缓解紧迫的劳动力容量约束，因为每台运行中的机器仍需专人持续关注。Bedrock
              Robotics 在这一市场结构中瞄准了差异化切入口：为 20 至 80 吨、跨品牌的挖掘机提供可逆、当天完成的改装，重点解决土壤交互自动驾驶智能，使重复性大规模挖掘不再需要操作员持续介入。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP008
      - number: '3.2'
        title: 功能差异与塑形自动驾驶
        blocks:
          - type: paragraph
            body: >-
              点到点越野运输与主动大规模挖掘之间存在根本的技术和功能差异。多家自动卡车运输和采矿机器人新进入者把工程资源集中在自动运输上——沿结构化、可预测的路径，在固定装载点和卸料点之间运输散装材料。相比之下，大规模土方作业需要复杂感知、动态轨迹调整和持续闭环控制，以应对不同土质、含水量变化、掩埋障碍物和地面压实度变化，并控制铲斗切入。Bedrock
              有意为 20 至 80 吨挖掘机构建机器学习和运动控制模型，处理体积土方塑形和开沟。活跃基础设施现场的部署，尤其是在 Sundt Construction 参与的 130 英亩制造业项目中搬运超过 7
              万立方码土方，证明其运营牵引力已超越纯仿真。然而，从安全人员监控机器表现的受监督试点，转向面向 2026 年的商业化全无人部署，仍是严峻的安全验证门槛；这正是生产级自动驾驶与受控工业机器人演示的差别。
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP012
              - CP013
      - number: '3.3'
        title: 商业包装、切换成本与锁定效应
        blocks:
          - type: paragraph
            body: >-
              民用建筑的商业采购深受车队资本周期、资产利用率和熟练工种劳动力经济性的影响。现有 OEM
              将引导技术捆绑在新设备购买或资本租赁中，每台设备往往超过数十万美元，对中型承包商造成明显的资产负债表压力。远程操控厂商通常收取硬件安装费并叠加月度软件订阅，但承包商节省的劳动力有限，因为人工工资开支大体不变。Bedrock
              将方案包装成售后改装，直接对准持续的劳动力短缺和不断上升的含福利操作员工资。在多品牌车队中，总承包商有很强的结构性动机避免供应商锁定；采用开放平台自动驾驶，可以在 Caterpillar、Komatsu
              和其他挖掘机品牌之间多栖运行，同时保留车队互操作性。不过，Bedrock 的商业定价结构在双边试点协议下仍完全保密，因此前置改装硬件费与持续运营软件许可费的具体划分，仍是未解的投资判断变量。
            claimRefs:
              - CP003
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP008
              - CP010
      - number: '3.4'
        title: 护城河持久性与现有厂商反应路径
        blocks:
          - type: paragraph
            body: >-
              Bedrock 获得的 3.5 亿美元融资和来自 Waymo 的高管自动驾驶履历，为商业发展提供了充足跑道，但其长期竞争护城河面临现有 OEM
              分销实力和供应链复杂性的结构性风险。重型设备经销商拥有独家区域、数十年的承包商信任、认证现场服务技师和保修监督能力。如果主要 OEM
              限制第三方远程信息处理接入，或因未经授权的液压与电气改装而使机器保修失效，承包商采用摩擦会迅速上升。此外，在剧烈振动、磨蚀性粉尘和极端温度环境中维持硬件可靠性，需要专用计算设备、高耐久
              LiDAR、摄像头和加固线束。Bedrock
              正在招聘全球供应管理负责人并建立双来源零部件采购，这凸显了全球供应中断期间扩展专用机器人硬件的脆弱性。最后，缺乏独立第三方基准评估来验证与经验丰富的人类操作员相比，持续的循环时间和体积生产率是否相当，使平台最终的效率优势仍待客户验证。
            claimRefs:
              - CP008
              - CP011
              - CP012
              - CP014
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 改装车队灵活性与 OEM 经销商锁定
            body: >-
              Bedrock 的核心战略切入口是车队无关性。土木承包商很少运营单一品牌的同质车队；通过提供兼容多家制造商、适用于 20 至 80 吨挖掘机的可逆改装，Bedrock
              绕开了购买新型自动化机器的高资本门槛，同时避免 OEM 供应商锁定。
            calloutType: insight
            claimRefs:
              - CP001
              - CP005
              - CP009
          - type: callout
            title: 塑形自动驾驶的挑战
            body: 从 A 点到 B 点的自动运输相对结构化，但自动化大规模挖掘要求持续实时感知不同土壤密度、含水量和动态铲斗阻力。要在没有人工干预的情况下证明可靠的无人操作性能，仍是取代资深操作员的关键技术障碍。
            calloutType: risk
            claimRefs:
              - CP006
              - CP007
              - CP013
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价结构与商业化
        blocks:
          - type: paragraph
            body: >-
              Bedrock Robotics 将自己定位为重型土木工程和基础设施的自动驾驶技术供应商，而不是重型机械原始设备制造商。公司不制造定制推土机或挖掘机，而是为现有承包商车队加装传感器套件、边缘计算硬件和专有的
              Bedrock Operator 软件平台。这种轻资产改装架构塑造了公司正在形成的变现策略：将前期或摊销的硬件安装套餐与持续软件许可结合起来。虽然 Bedrock
              尚未公开标准化商业价目表或分层定价，行业惯例和二级市场挂牌信息表明，承包商会为硬件改装支付集成费，并另行支付自动驾驶软件栈的持续订阅费或按使用量计费。UpMarket 的 IPO 前二级交易数据给出了 2025
              年收入 5430 万美元的估算；但该估算使用了私有数据库中的模型化可比公司，而非经审计的 GAAP 财务报表。软件与服务的收入组合、多年维护承诺和硬件毛利率等关键收入确认细节，仍是需要直接审计的未验证私有指标。
