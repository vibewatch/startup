  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块化改装架构
        blocks:
          - type: paragraph
            body: >-
              Bedrock Robotics 提供端到端工业自动驾驶平台，核心是 Bedrock Operator——专为重型工程设备设计的硬件与软件改装系统
              [CE001]。公司不从零制造专有重型机械，而是为现有客户车队（主要从标准 20 至 80 吨液压挖掘机开始）加装当天完成、可逆的改装套件
              [CE002]。这种售后改装策略避开了更换重型机械所需的多年资本周期和高昂替换支出，为商业总承包商建立了可负担的现代化路径
              [CE003]。实体改装整合高分辨率传感器外壳、加固汽车级计算单元和电子控制单元（ECU）执行线束，直接连接重型机械液压控制器 [CE004]。通过直接接入重型机械 CAN 总线和 J1939
              通信协议，系统能把高层算法路径转成毫米级液压阀调节，同时不破坏车辆原有安全架构 [CE005]。
            claimRefs:
