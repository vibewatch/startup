        - 硬件供应链瓶颈和意外的监管工地安全限制。
        - 低（20%）
      - - 基准情景
        - $1.4B - $1.8B
        - 依靠监督式自主，在 Sunbelt 地区土方承包商中稳步扩张。
        - 试点验证周期拉长、硬件维护开销挤压毛利率。
        - 中（55%）
      - - 悲观情景
        - $600M - $900M
        - 现场安全事故、无人操作转型缓慢，以及 OEM 激进整合机器控制。
        - 估值倍数严重压缩，导致折价融资重组和高级优先权被稀释。
        - 中等（25%）
    notes: 情景区间反映以预计车队规模、自主可靠性和商业进展为基础的 36 个月期限倍数。
    claimRefs:
      - CV001
      - CV010
      - CV011
      - CV012
      - CV015
      - CV016
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Bedrock 在不到两年内从成立走到大额增长融资，但全面无人操作部署仍是未来目标。
    data:
      items:
        - date: 2024-05
          label: 公司成立
          detail: C4 Ventures 称 Bedrock 于 2024 年 5 月成立。
          tone: neutral
          claimRefs:
            - CO001
        - date: 2025-07
          label: 结束隐身状态
          detail: Bedrock 披露 Seed 轮和 Series A 轮合计融资 US$80 million。
          tone: positive
          claimRefs:
            - CO004
        - date: 2025-07
          label: 据报道已在多州运营活跃场地
          detail: 一家行业出版物报道称，机器正在 Arizona、Texas 和 Arkansas 的客户场地运行。
          tone: neutral
          claimRefs:
            - CO013
        - date: 2025-11
          label: 监督式大规模挖掘部署
          detail: 公司称已在一处 130 英亩的制造场地完成监督式自主作业。
          tone: positive
          claimRefs:
            - CO011
        - date: '2026-02-04'
          label: 宣布 Series B
          detail: Bedrock 宣布由 CapitalG 和 Valor Atreides AI Fund 共同领投的 US$270 million Series B。
          tone: positive
          claimRefs:
            - CO005
        - date: '2026-02-04'
          label: 披露估值和融资总额
          detail: 公告称估值为 US$1.75 billion，累计融资超过 US$350 million。
          tone: positive
          claimRefs:
            - CO006
            - CO007
        - date: 2026-02
          label: 扩充职能领导团队
          detail: Vincent Gonguet 和 John Chu 被宣布任命为评估和人员负责人。
          tone: neutral
          claimRefs:
            - CO010
        - date: '2026'
          label: 无人操作部署目标
          detail: 首批完全无人操作的客户挖掘机部署仍是公司目标，并非已完成的里程碑。
          tone: warning
          claimRefs:
            - CO012
    approximationNotes: 仅有月份或仅有年份的日期反映来源精度；重复日期用于区分融资、估值和领导层披露，不代表不同的运营事件。
