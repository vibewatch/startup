        title: 资本化与现场规模
        blocks:
          - type: paragraph
            body: >-
              融资进展非常快：Bedrock 于 2025 年 7 月结束隐身状态，Seed 和 A 轮合计融资 $80m，随后在 2026 年 2 月 4 日宣布完成 $270m B
              轮。公司发布的公告和一份独立摘要都将累计融资额置于 $350m 以上，并将估值定为 $1.75b，但都没有说明这是投前还是投后估值。运营证据则缺乏统一口径。来源提到一处 130
              英亩场地上的受监督大规模挖掘部署、三州活跃客户现场的设备、得州和加州的现场测试，以及一位投资者称五州共有 40 多台设备。这些都是有用的证明点，但日期和分母各不相同，不应合并成单一的当前部署数量。
