callouts:
  - calloutType: risk
    title: "Spot Compute and Cloud Infrastructure Fragility"
    body: "Bedrock's reliance on Anyscale-managed Ray clusters running on up to 80% AWS spot instances exposes its core AI training loop to cloud capacity volatility. While automated spot interruption handling saved significant engineering time in late 2025, sudden spot price spikes or regional GPU/vCPU capacity crunches represent an unhedged operational risk as model complexity expands."
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR008"
  - calloutType: insight
    title: "Safety Safeguards as Commercial Enabler"
    body: "Unlike passenger autonomous vehicles operating on public roads, off-road autonomous excavators operate in controlled, geo-fenced environments where a conservative 360-degree intrusion stop mechanism provides immediate risk mitigation. Contractors report that eliminating blind spots and taking operators out of hazardous swinging cabs provides a compelling safety justification that outweighs initial pilot skepticism."
    claimRefs:
      - "CR002"
      - "CR003"
      - "CR012"
