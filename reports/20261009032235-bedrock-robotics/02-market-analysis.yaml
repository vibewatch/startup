          detail: "Demand context; facility capex is not autonomy spend."
        - label: "Heavy-equipment operation"
          value: 1.25
          unit: "billion hours annually"
          detail: "Activity denominator lacks eligible share and price per hour."
        - label: "Reported construction shortage"
          value: 500000
          unit: "workers"
          detail: "Forecast window is not fully specified in the fetched article."
        - label: "Workers needed"
          value: 439000
          unit: "workers in 2025"
          detail: "Not directly comparable with shortage estimates."
        - label: "Consultancy shortage estimate"
          value: 800000
          unit: "workers over two years"
          detail: "Underlying methodology is not disclosed in fetched text."
    approximationNotes: >-
      The pyramid is a hierarchy of analytical distance from Bedrock revenue, not proportional area. Values
      preserve their original units and must not be added, divided, or interpreted as TAM, SAM, or SOM.
    claimRefs: [CM002, CM003, CM004, CM005, CM006, CM015]
callouts:
  - calloutType: "insight"
    title: "Retrofit is the adoption wedge"
    body: >-
      Reversible installation on existing equipment can reduce replacement capex and let contractors validate
      autonomy on a project before expanding, but public sources do not yet show conversion from pilot to fleet.
    claimRefs: [CM009, CM010, CM013]
  - calloutType: "risk"
    title: "Industry scale is not company TAM"
    body: >-
      The $13 trillion construction figure is contextual only. Without eligible fleet counts, pricing,
      utilization, deployment capacity, and win rates, turning it into Bedrock revenue would be false precision.
    claimRefs: [CM002, CM014, CM015]
