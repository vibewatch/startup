artifact: "market-analysis"
slug: "bedrock-robotics"
runDate: "2026-10-09"
company:
  name: "Bedrock Robotics"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Bedrock addresses a narrow but potentially large wedge inside construction: retrofit autonomy for existing
    heavy equipment, beginning with excavators. Public evidence establishes strong labor and infrastructure
    pressure, but it does not disclose pricing, eligible fleet counts, or realized customer economics, so a
    dollar SAM or SOM is not yet defensible.
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: >-
      The investable market should be bounded around autonomy retrofits for contractor-owned or controlled
      heavy equipment rather than the entire construction industry. Bedrock says it equips everyday machines
      for autonomous operation, while third-party coverage describes reversible, same-day installations on
      existing fleets and an initial focus on excavators. That definition includes retrofit hardware, autonomy
      software, deployment, monitoring, and support tied to earthmoving workflows. It excludes the purchase
      price of excavators, general construction software, vertical building trades, and all construction spend
      that cannot use autonomous heavy machinery. The status quo is a human operator in each machine, supported
      by equipment rental, overtime, subcontracting, and schedule buffers. New autonomous machines and internal
      contractor automation programs are adjacent alternatives, but the assigned evidence does not quantify
      their spend or Bedrock's share.
    claimRefs: [CM001, CM009, CM013]
    tableRefs: [TM001]
  - id: "sizing-without-false-precision"
    title: "Sizing without false precision"
    body: >-
      Available figures are market context, not a coherent TAM/SAM/SOM stack. Independent coverage cites a
      $13 trillion global construction industry, $238 billion of 2024 US manufacturing-facility investment,
      and 1.25 billion annual hours operating heavy equipment. Those measures use different geographies,
      periods, units, and denominators; none identifies what portion can buy an autonomy retrofit. Workforce
      pressure is also directionally consistent but numerically inconsistent: sources cite a 500,000-worker
      shortage, 439,000 workers needed in 2025, and an 800,000-worker shortage over two years. The differences
      may reflect distinct definitions and forecast windows, so they should not be averaged. A defensible SAM
      requires eligible-machine counts by class, annual retrofit pricing, utilization thresholds, and target
      geographies; SOM additionally requires deployment capacity, sales-cycle, and win-rate evidence.
    claimRefs: [CM002, CM003, CM004, CM005, CM006, CM015]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: "buyers-and-adoption-path"
    title: "Buyer, user, payer, and adoption path"
    body: >-
      The direct economic buyer is most plausibly the contractor, earthworks subcontractor, or fleet operator
      controlling equipment and labor budgets; site superintendents and equipment operators are the daily
      users, while project owners benefit indirectly through schedule and cost outcomes. Evidence of machines
      running on customer sites in Arizona, Texas, and Arkansas supports a pilot-led adoption path rather than
      broad commercial penetration. A buyer can trial a reversible retrofit on one excavator, validate safety,
      productivity, and workflow fit, and then expand by project or fleet. Retrofit compatibility lowers the
      capital barrier relative to replacing equipment, but it does not eliminate procurement friction: buyers
      still need a new budget line, integration with jobsite processes, trained oversight, insurance acceptance,
      and proof that realized savings exceed deployment and support costs.
    claimRefs: [CM008, CM009, CM010, CM012, CM013]
    tableRefs: [TM003]
  - id: "drivers-constraints-and-valuation"
    title: "Drivers, constraints, and valuation relevance"
    body: >-
      Reindustrialization, manufacturing and data-center construction, labor scarcity, and the large stock of
      existing machinery create credible adoption drivers. The strongest field datapoint in the assigned pool
      is a report that two retrofitted excavators moved 40,000 cubic yards in their first month on a highway
      project, including overnight shifts without lost productivity. That is useful proof of feasibility, not
      a fleet-wide ROI benchmark. Adoption risk remains material: industry commentary says robotics funding was
      rising while adoption rates were falling and argues that products may need order-of-magnitude outcomes
      to win budgets. Bedrock's reported work with regulators and its 2026 operator-less target do not establish
      regulatory approval, insurance acceptance, scaled availability, or repeatable unit economics. Until the
      company supplies cohort deployment, pricing, retention, and payback data, broad-industry figures should
      not be converted into revenue assumptions or used to justify the current valuation.
    claimRefs: [CM004, CM005, CM007, CM008, CM011, CM012, CM014, CM016]
