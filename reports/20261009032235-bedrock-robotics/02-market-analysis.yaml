      - ["Intelligent Build.tech", "2024", "US manufacturing-facility investment", "$238 billion", "Reported annual investment; medium confidence", "Facility capex is not addressable autonomy revenue"]
      - ["Intelligent Build.tech", "Annual, period unspecified", "Heavy-equipment operating time", "1.25 billion hours", "Reported activity measure; medium confidence", "No price per eligible machine-hour or eligible share"]
      - ["Intelligent Build.tech", "Forecast window not fully specified", "US construction workforce shortage", "500,000 workers; 40% expected to retire within a decade", "Reported workforce pressure; medium confidence", "Different denominator and horizon from other shortage estimates"]
      - ["Bricks & Bytes", "2025", "Construction workers needed in 2025", "439,000 workers", "Industry commentary; medium confidence", "Need is not equivalent to current shortage or automation demand"]
      - ["The AI Consulting Network", "Next two years from 2026 article", "Construction worker shortage", "800,000 workers", "Consultancy commentary; low confidence", "Underlying source and denominator are not disclosed in fetched text"]
    notes: >-
      Values retain source periods, units, and denominators. They are neither additive nor a TAM/SAM/SOM
      calculation; pricing, eligible fleet, geography, adoption, and deployment-capacity inputs remain missing.
    claimRefs: [CM002, CM003, CM004, CM005, CM006]
  - id: "TM003"
    title: "Segment and buyer map"
    columns: ["Segment", "Economic buyer", "Primary user", "Budget owner", "Adoption trigger", "Unresolved proof"]
    rows:
      - ["Heavy civil and highway earthmoving", "General contractor or earthworks subcontractor", "Superintendent, fleet manager, and equipment crew", "Project operations or equipment budget", "Labor recovery, night operation, and schedule pressure", "Repeat-project productivity and fully loaded payback"]
      - ["Industrial and manufacturing sites", "Site-prep contractor", "Earthmoving crew and project manager", "Sitework package owner", "Large earthmoving scope and schedule certainty", "Scaled deployments beyond disclosed pilots"]
      - ["Data-center development", "Site-prep or civil contractor; owner benefits indirectly", "Contractor field operations", "Contractor equipment and labor budgets", "Capacity buildout and time-to-service pressure", "Customer-specific savings, pricing, and insurance terms"]
      - ["Aggregates and materials sites", "Quarry or materials operator", "Fleet manager and operators", "Operations and equipment budget", "Repetitive material handling and extended utilization", "Supported workflows, safety case, and retention"]
    notes: >-
      Buyer roles are inferred from reported deployments and the retrofit workflow; public evidence does not
      disclose contracts, procurement authority, pricing, or customer-level return on investment.
    claimRefs: [CM008, CM009, CM010, CM012, CM013, CM016]
