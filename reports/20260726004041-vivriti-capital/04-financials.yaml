- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Why it matters
  - Exact diligence path
  rows:
  - - Cost of funds by borrowing channel
    - High
    - Needed to assess NIM durability as the book scales
    - Request lender-wise funding cost, tenor, and covenants
  - - Realized pricing by product
    - High
    - Determines revenue quality and competitive pricing power
    - Request recent deal tape by product and borrower type
  - - CAC / payback by channel
    - Medium
    - Necessary to judge origination efficiency and branch-expansion ROI
    - Request acquisition source and cohort payback analysis
  - - Free-cash-flow conversion
    - High
    - Profitable PAT does not reveal cash conversion or liquidity stress
    - Request cash-flow statement and working-capital bridge
  - - Provisioning by co-lending segment
    - High
    - ICRA flags one-time provisions, but public severity is unclear
    - Request provisioning policy and partner-level stress data
  - - Post-restructuring entity reconciliation
    - Medium
    - 2026 scheme changes scope and comparability
    - Request pre/post transfer entity mapping and financial restatement
  notes: Each gap is specific enough to support diligence rather than generic “need more data” language.
