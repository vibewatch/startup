company:
  name: Vivriti Capital
chapter:
  number: 4
  title: Financials
  summary: Public financial evidence supports Vivriti as a profitable, debt-funded mid-market lender rather than a pre-revenue fintech story. Group FY25 revenue reached ₹1,429.1 crore with ₹219.2 crore PAT, while standalone rating materials show roughly ₹1,364 crore of FY25 income, ₹220 crore PAT, and capital adequacy around 21%. The strongest positives are profitable scale, meaningful debt-market access, and real operating-efficiency proxies from Leegality and Databricks; the main negatives are asset-quality creep, thin public price disclosure, and the inability to inspect official FY25 annual-report files because Vivriti’s own report surfaces returned CloudFront 403 during this run.
sections:
- id: revenue-model-and-scope-discipline
  title: Revenue model and scope discipline
  body: Vivriti’s revenue model should be understood as lending and spread economics across multiple channels rather than as one visible tariff sheet. The company’s product profile spans enterprise lending, supply-chain finance, receivables-backed products, co-lending, and securitisation-linked activity, so revenue likely comes from interest spreads, structured fees, and partner-channel economics rather than from a single standardized schedule. Public evidence can support that broad description, but it cannot map realized pricing with precision because official rate-card disclosure for Vivriti’s core products was not retained in accessible official pages. Scope discipline is also essential. The group-level FY25 release shows ₹13,181 crore AUM, ₹1,429.1 crore revenue, and ₹219.2 crore PAT, while CARE’s standalone NBFC note reports ₹1,364 crore total income, ₹220 crore PAT, and a smaller AUM base. Those are not interchangeable numbers. Any underwriting must keep group, standalone, and post-restructuring
    metrics separate rather than forcing them into one narrative.
  claimRefs:
