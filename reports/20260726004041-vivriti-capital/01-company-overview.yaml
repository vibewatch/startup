- id: milestones-scale-signals-and-open-questions
  title: Milestones, Scale Signals, and Open Questions
  body: 'Several milestone signals are strong enough to carry into later chapters. Official FY25 commentary and the ADB climate-finance documents support a multi-product lender with 495-plus enterprise clients across 55-plus sectors and 20-plus states, more than one million retail borrowers via co-lending channels, and 975-plus MSMEs sourced through supply-chain anchors. Rating reports add that the company had more than 50 lender relationships by late 2025 and a loan book increasingly diversified across term lending, co-lending, and specialty structures. At the same time, the overview chapter should preserve open questions rather than smooth them away. Public employee counts vary meaningfully across Tracxn, Company Check, and other trackers, suggesting entity-scope differences between group, legal-entity, and establishment-level counts. Governance sources also diverge on the full board roster because some official disclosures are only partially accessible. Finally, the 2026 reorganisation
    makes backward comparisons harder: some figures refer to the old Vivriti Capital structure, while others refer to the reconstituted Vivriti Next group. Those caveats do not undermine the core investment story, but they do mean later chapters must distinguish group, NBFC, and post-restructuring metrics rather than treat them as interchangeable.'
