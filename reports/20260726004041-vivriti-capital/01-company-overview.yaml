company:
  name: Vivriti Capital
chapter:
  number: 1
  title: Company Overview
  summary: Vivriti Capital is a Chennai-based RBI-registered NBFC-ND-SI founded in 2017 to finance India's underserved mid-market through structured debt, co-lending, and related credit products. Independent rating reports and official FY25 disclosures support rapid scale, profitable FY25 operations, and a broad client footprint, while also flagging concentration, unsecured-loan, and seasoning risks that matter for later chapters. The 2026 Vivriti Next reorganisation expands the platform beyond lending, but it also complicates entity-level comparisons and makes governance and capital-structure tracking more important.
sections:
- id: identity-and-core-business
  title: Identity and Core Business
  body: 'Vivriti Capital should be understood first as a regulated lending platform rather than as a generic fintech brand. Rating reports from ICRA and CARE, company-registry data, and third-party company profiles line up on the core identity: Vivriti Capital Limited was incorporated on 22 June 2017 in Chennai, obtained its NBFC licence in January 2018, and operates as a non-deposit-taking systemically important NBFC focused on debt financing for India''s mid-market. The company''s stated problem definition is consistent across sources: these borrowers are too large for microfinance but too small, too unrated, or too bespoke for conventional bank and bond-market processes. Product descriptions from external profiles and rating reports show a broad debt toolkit rather than a single-loan product, including term loans, working-capital demand loans, supply-chain finance, co-lending, securitisation, factoring, leasing, and non-convertible debentures. That breadth matters because it explains
    why the company can appear simultaneously in enterprise lending, retail co-lending, structured finance, and climate-finance conversations without those references being contradictory.'
