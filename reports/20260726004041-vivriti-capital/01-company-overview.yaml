- id: capital-base-and-financial-scale
  title: Capital Base and Financial Scale
  body: 'The strongest verified company-scale facts come from official FY25 disclosures, ADB materials, and rating reports. Vivriti Group reported FY25 AUM of Rs 13,181 crore, revenue of Rs 1,429.1 crore, and PAT of Rs 219.2 crore, while maintaining core gross NPA of 0.24% and capital adequacy of roughly 21%. At the regulated-entity level, CARE and ICRA show the standalone NBFC closing FY25 with about Rs 1,364 crore of total income, about Rs 220 crore of profit after tax, gross stage-3 assets near 1.89%, and CAR of 21.02%. Those two lenses are not interchangeable: group disclosures include Vivriti Asset Management, while rating reports isolate the lending entity. Funding history is likewise layered. Tracxn and rating reports show about Rs 1,399-1,400 crore of cumulative equity raised before the 2026 founder infusion, with Creation Investments, Lightrock, and TVS Capital Funds as recurring backers. The best-supported primary-equity valuation mark is the November 2023 Series D round, which
    Tracxn records at $1.7 billion post-money. The 2024 ADB climate bond added $25 million of debt capital tied to green-finance deployment rather than equity repricing.'
