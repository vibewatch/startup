company:
  name: Vivriti Capital
chapter:
  number: 7
  title: Risks
  summary: Vivriti’s master risk is not existence or early-stage burn; it is the interaction of concentration, partner-originated unsecured exposure, and a moving regulatory perimeter inside a leveraged NBFC model. CARE and ICRA repeatedly flag concentration, seasoning, unsecured co-lending exposure, and the need to maintain asset quality while growing, while the 2026 restructuring adds entity-mapping and disclosure complexity at exactly the time investors need cleaner comparability. Capital adequacy and funding diversification are real mitigants, but the thesis still breaks fastest if GNPA / stage-3 metrics drift higher, partner-vintage losses rise, or the group’s increasingly broad platform narrative outruns direct evidence on controls, concentration, and post-demerger governance.
sections:
- id: regulatory-and-legal-risk
  title: Regulatory and legal risk
  body: >-
    Vivriti is a regulated NBFC-ND-SI operating in a policy environment that has already turned
    less forgiving for unsecured retail and partner-originated lending. CARE explicitly notes that
    the unsecured co-lending book attracted higher risk weights under RBI rules and that one-time
    provisions rose after RBI guidance around FLDG and co-lending norms. The 2026 demerger adds a
    second legal-compliance layer because investors must now map historical VCL disclosures against
    the transferred NBFC business in Hari and Company Investments Madras Private Limited. CARE says
    the transfer should not materially impair credit quality, but the rating withdrawal itself shows
    that legal-entity continuity, security documentation, and reporting comparability matter. Public
    diligence quality is also reduced by the fact that Vivriti-controlled notices, media, and policy
    surfaces returned CloudFront blocks during this run.
  claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR007, CR008, CR009, CR010]
  tableRefs: [TR001]
  figureRefs: [FR001]
- id: credit-capital-and-funding-risk
  title: Credit, capital, and funding risk
  body: >-
    The core financial-model risk is that Vivriti remains a capital-intensive lender growing through
    products that can reprice risk quickly. CARE’s 2025 and 2026 notes show concentration risk,
    significant unsecured exposure through co-lending, and a need to preserve capital adequacy while
    expanding the book. The company still looks well capitalized on public evidence, but the margin
    for error is not infinite: CARE’s own negative sensitivities include sustained GNPA above 2.5%,
    weaker profitability, or gearing above 4.25x. Cost of funds also rose year over year, and the
    liability stack still depends on continued access to banks, bond markets, and institutional debt.
    If underwriting or partner-vintage performance weakens before new equity arrives, the same scale
    narrative that helps valuation can become a transmission channel into returns and solvency. The
    public filing record also shows why investors should watch liquidity and debt-market access closely:
    listed-debt disclosures, security-cover obligations, and capital-adequacy reporting create a more
    transparent perimeter than many private fintechs have, but they also mean deterioration should be
    judged against hard numbers rather than narratives. A lender that relies on term loans, NCDs, and
    institutional capital cannot assume funding will stay available at the same price through a credit
    cycle. That makes earnings resilience, not just AUM growth, a critical risk lens for underwriting.
  claimRefs: [CR011, CR012, CR013, CR014, CR015, CR016, CR017, CR018, CR019, CR020, CR021, CR022]
  tableRefs: [TR002]
  figureRefs: [FR002]
- id: partner-operational-and-technology-dependency
  title: Partner, operational, and technology dependency
  body: >-
    Vivriti’s operating model is structurally dependent on parties and systems it does not fully
    control: co-lending partners, supply-chain anchors, lenders, trustees, rating agencies,
    documentation vendors, and data platforms all sit in the execution path. Databricks documents a
    high-volume B2B2C environment where real-time APIs govern borrower identification, underwriting,
    fraud checks, partner reconciliation, and reporting; Leegality proves document-flow compression;
    CARE and ADB prove that partners and anchors are material channels to end borrowers. That model
    creates speed and reach, but it also imports operational, compliance, and concentration risk from
    upstream and downstream counterparties. The public file is weakest on cyber assurance, incident
    reporting, and third-party control documentation because no accessible trust-center or detailed
    security-policy surface was retained in this run.
  claimRefs: [CR023, CR024, CR025, CR026, CR027, CR028, CR029, CR030, CR031, CR032]
  tableRefs: [TR003, TR004]
  figureRefs: [FR003]
- id: mitigants-and-thesis-breakers
  title: Mitigants and thesis-breakers
  body: >-
    The mitigating case is real. CARE and ICRA still rate the business in investment-grade territory;
    capital adequacy remains around 20-21%; the lender base is diversified; and ADB’s climate-bond
    participation signals external comfort with governance and use-of-proceeds controls. But these are
    mitigants, not immunity. The committee should watch a short list of thesis-breakers: sustained
    GNPA or stage-3 drift above rating thresholds, partner-driven loss spikes in co-lending,
    deterioration in capital adequacy, evidence that post-demerger reporting obscures rather than
    clarifies the NBFC’s economics, or failure to show cleaner concentration disclosure as the platform
    expands into advisory and technology narratives. Another important point is sequencing: a lender
    can remain current on ratings and capital while still accumulating fragility in partner vintages or
    disclosure quality. Investors therefore need monthly rather than annual monitoring on stage-3
    trends, partner behavior, and reporting continuity. Vivriti looks manageable today, but not de-risked yet publicly today.
  claimRefs: [CR033, CR034, CR035, CR036, CR037, CR038, CR039, CR040, CR041, CR042]
  tableRefs: [TR005]
  figureRefs: []
