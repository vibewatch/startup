  claims:
  - {id: CR001, statement: 'Vivriti’s most material regulatory risk sits in unsecured and partner-originated lending rather than in license survival.', type: inferred, topic: regulatory, sourceRefs: [SR002, SR003, SR006, SR007], confidence: high, freshness: current, answersQuestionRefs: [QR001, QR002]}
  - {id: CR002, statement: 'CARE and ICRA both show that provisions and risk weights moved in response to regulatory treatment of co-lending / unsecured exposure.', type: inferred, topic: regulatory, sourceRefs: [SR002, SR004, SR006, SR007], confidence: medium, freshness: recent, answersQuestionRefs: [QR002, QR009]}
  - {id: CR003, statement: 'The 2026 scheme of arrangement materially changes the reporting and legal-entity context for investors even if it does not by itself prove credit deterioration.', type: inferred, topic: demerger, sourceRefs: [SR001, SR018, SR020, SR021], confidence: high, freshness: recent, answersQuestionRefs: [QR003, QR004]}
  - {id: CR004, statement: 'CARE said the transfer of facilities to HAC followed implementation of the scheme of arrangement effective April 1 2026.', type: third-party-reported, topic: demerger, sourceRefs: [SR001], confidence: medium, freshness: recent, answersQuestionRefs: [QR003]}
  - {id: CR005, statement: 'CARE’s 2025 note said the proposed restructuring was unlikely to have a material negative impact on credit profile.', type: third-party-reported, topic: demerger, sourceRefs: [SR002], confidence: medium, freshness: recent, answersQuestionRefs: [QR004]}
  - {id: CR006, statement: 'Debt-investor diligence still needs a bridge between historical VCL disclosures and the post-transfer NBFC entity.', type: inferred, topic: demerger, sourceRefs: [SR001, SR018, SR019], confidence: medium, freshness: current, answersQuestionRefs: [QR003, QR028]}
  - {id: CR007, statement: 'Several Vivriti-controlled legal and disclosure surfaces were inaccessible during this run, creating a genuine diligence-quality risk.', type: inferred, topic: legal-visibility, sourceRefs: [SR010, SR011, SR012, SR014, SR022], confidence: medium, freshness: current, answersQuestionRefs: [QR005, QR026]}
  - {id: CR008, statement: 'The official notices page, privacy-policy URL, and RPT-policy URL each returned blocked responses during this run.', type: third-party-reported, topic: legal-visibility, sourceRefs: [SR010, SR011, SR012], confidence: medium, freshness: current, answersQuestionRefs: [QR005, QR026]}
  - {id: CR009, statement: 'Company Check still shows the entity as active and compliant, which offsets but does not eliminate the policy-visibility concern.', type: third-party-reported, topic: legal-visibility, sourceRefs: [SR013, SR030], confidence: medium, freshness: current, answersQuestionRefs: [QR005, QR006]}
  - {id: CR010, statement: 'Vivriti remains an RBI-registered NBFC-ND-SI operating under debt-listing disclosure obligations rather than an unregulated fintech perimeter.', type: third-party-reported, topic: regulatory-perimeter, sourceRefs: [SR005, SR018, SR019], confidence: high, freshness: current, answersQuestionRefs: [QR006, QR028]}
  - {id: CR011, statement: 'CARE repeatedly flags concentration risk and a high share of unsecured loans as key constraints on the credit profile.', type: third-party-reported, topic: credit-risk, sourceRefs: [SR002, SR003, SR023], confidence: high, freshness: recent, answersQuestionRefs: [QR007]}
  - {id: CR012, statement: 'The main model risk is credit-loss transmission from partner and unsecured cohorts into provisions, capital, and growth.', type: inferred, topic: credit-risk, sourceRefs: [SR002, SR004, SR006], confidence: medium, freshness: current, answersQuestionRefs: [QR007, QR023]}
  - {id: CR013, statement: 'As of March 31 2025, CARE described enterprise loans at 50% of AUM, co-lending at 38%, supply-chain finance at 5%, direct assignment at 5%, and other products at 2%.', type: third-party-reported, topic: portfolio-mix, sourceRefs: [SR001, SR002], confidence: high, freshness: recent, answersQuestionRefs: [QR007]}
  - {id: CR014, statement: 'CARE said unsecured loans through co-lending were about 33% of AUM as of March 31 2025.', type: third-party-reported, topic: unsecured-risk, sourceRefs: [SR002], confidence: medium, freshness: recent, answersQuestionRefs: [QR007, QR012]}
  - {id: CR015, statement: 'CARE’s negative triggers include sustained GNPA above 2.5%, weaker profitability, and gearing above 4.25x.', type: third-party-reported, topic: thresholds, sourceRefs: [SR002], confidence: medium, freshness: recent, answersQuestionRefs: [QR008, QR011, QR022]}
  - {id: CR016, statement: 'Regulation 52 and CARE lenses around December 2025 show stage-3 / GNPA pressure remained manageable but not trivial.', type: inferred, topic: asset-quality, sourceRefs: [SR001, SR018, SR029], confidence: medium, freshness: recent, answersQuestionRefs: [QR008]}
  - {id: CR017, statement: 'Public evidence shows capital adequacy stayed around 20-21% through FY25 and 9MFY26.', type: third-party-reported, topic: capital, sourceRefs: [SR001, SR002, SR018], confidence: high, freshness: recent, answersQuestionRefs: [QR010]}
  - {id: CR018, statement: 'Funding dependence is diversified but still fundamental because the business grows by levering external debt into loan assets.', type: inferred, topic: funding, sourceRefs: [SR002, SR018, SR030], confidence: medium, freshness: current, answersQuestionRefs: [QR012, QR013]}
  - {id: CR019, statement: 'CARE reported over 45 lender relationships and a resource profile increasingly diversified beyond banks and NBFCs.', type: third-party-reported, topic: funding, sourceRefs: [SR002], confidence: medium, freshness: recent, answersQuestionRefs: [QR013]}
  - {id: CR020, statement: 'Rising cost of funds increases sensitivity to yield discipline and credit losses even when nominal book growth remains strong.', type: inferred, topic: funding, sourceRefs: [SR002, SR004], confidence: medium, freshness: current, answersQuestionRefs: [QR012]}
  - {id: CR021, statement: 'If losses or funding costs rise before fresh capital arrives, capital adequacy can become the immediate constraint on growth.', type: inferred, topic: capital, sourceRefs: [SR002, SR017, SR020], confidence: medium, freshness: current, answersQuestionRefs: [QR010, QR023]}
  - {id: CR022, statement: 'The risk chapter should therefore treat capital as a buffer, not as proof that downside has disappeared.', type: inferred, topic: capital, sourceRefs: [SR017, SR018, SR019], confidence: medium, freshness: current, answersQuestionRefs: [QR024]}
  - {id: CR023, statement: 'Databricks shows Vivriti’s operating model depends on real-time APIs for identification, underwriting, fraud checks, reporting, and partner reconciliation.', type: third-party-reported, topic: operational, sourceRefs: [SR015], confidence: medium, freshness: recent, answersQuestionRefs: [QR015, QR018]}
  - {id: CR024, statement: 'This creates a meaningful operational dependency on data-platform uptime, pipeline quality, and governance controls.', type: inferred, topic: operational, sourceRefs: [SR015], confidence: medium, freshness: current, answersQuestionRefs: [QR015, QR018]}
  - {id: CR025, statement: 'Leegality shows that digital documentation is embedded in the lending workflow, making third-party workflow reliability operationally important.', type: third-party-reported, topic: operational, sourceRefs: [SR016], confidence: medium, freshness: recent, answersQuestionRefs: [QR016]}
  - {id: CR026, statement: 'Public sources do not disclose a full cyber-assurance or trust-center pack for the current operating setup.', type: inferred, topic: cyber, sourceRefs: [SR011, SR014, SR022], confidence: medium, freshness: current, answersQuestionRefs: [QR017, QR026]}
  - {id: CR027, statement: 'ADB and CARE prove that co-lending partners, supply-chain anchors, and thematic funding partners are integral to the model rather than peripheral.', type: inferred, topic: dependency, sourceRefs: [SR001, SR017, SR024], confidence: medium, freshness: current, answersQuestionRefs: [QR014, QR025]}
  - {id: CR028, statement: 'That dependence increases counterparty and compliance spillover risk because weak partner behavior can affect Vivriti economics and disclosures.', type: inferred, topic: dependency, sourceRefs: [SR001, SR007, SR015], confidence: medium, freshness: current, answersQuestionRefs: [QR014, QR018]}
  - {id: CR029, statement: 'Public evidence does not disclose top-partner or top-anchor concentration, which is itself a risk signal.', type: inferred, topic: dependency, sourceRefs: [SR001, SR017, SR019], confidence: medium, freshness: current, answersQuestionRefs: [QR019]}
  - {id: CR030, statement: 'The public file is weakest on incident history, SLA misses, and control exceptions outside rating-agency commentary.', type: inferred, topic: operational-visibility, sourceRefs: [SR010, SR011, SR014, SR022], confidence: medium, freshness: current, answersQuestionRefs: [QR017, QR029]}
  - {id: CR031, statement: 'Operational risk is therefore real but under-documented rather than obviously broken.', type: inferred, topic: operational-visibility, sourceRefs: [SR015, SR016, SR030], confidence: medium, freshness: current, answersQuestionRefs: [QR024, QR029]}
  - {id: CR032, statement: 'Execution risk also sits in maintaining control quality while broadening the platform narrative beyond core lending.', type: inferred, topic: execution, sourceRefs: [SR020, SR021, SR028], confidence: medium, freshness: current, answersQuestionRefs: [QR020]}
  - {id: CR033, statement: 'Investment-grade rating coverage and current capital ratios are real mitigants against immediate downside.', type: inferred, topic: mitigants, sourceRefs: [SR001, SR002, SR004], confidence: high, freshness: recent, answersQuestionRefs: [QR024]}
  - {id: CR034, statement: 'ADB participation in the climate bond provides external validation around governance and use-of-proceeds discipline, but only for a slice of the business.', type: inferred, topic: mitigants, sourceRefs: [SR017, SR024, SR025], confidence: medium, freshness: recent, answersQuestionRefs: [QR025]}
  - {id: CR035, statement: 'The 2026 Rs 200 crore founder capital infusion is supportive but does not by itself solve book-quality or disclosure risks.', type: inferred, topic: mitigants, sourceRefs: [SR020, SR021], confidence: medium, freshness: recent, answersQuestionRefs: [QR020, QR024]}
  - {id: CR036, statement: 'A diversified lender base lowers single-funder dependency risk but does not prevent overall cost-of-capital pressure.', type: inferred, topic: mitigants, sourceRefs: [SR002, SR019], confidence: medium, freshness: current, answersQuestionRefs: [QR013, QR024]}
  - {id: CR037, statement: 'The key missing diligence item is cleaner post-demerger governance, reporting, and allocation transparency.', type: inferred, topic: mitigants, sourceRefs: [SR001, SR018, SR020], confidence: medium, freshness: current, answersQuestionRefs: [QR026, QR028]}
  - {id: CR038, statement: 'Sustained GNPA above 2.5% would be an explicit thesis-break warning because it matches CARE’s stated downgrade trigger.', type: third-party-reported, topic: kill-criteria, sourceRefs: [SR002], confidence: medium, freshness: recent, answersQuestionRefs: [QR021, QR022]}
  - {id: CR039, statement: 'Gearing above 4.25x would be another explicit thesis-break warning on the public record.', type: third-party-reported, topic: kill-criteria, sourceRefs: [SR002], confidence: medium, freshness: recent, answersQuestionRefs: [QR021, QR022]}
  - {id: CR040, statement: 'Failure to reconcile VCL and HAC economics clearly after the restructuring should reduce confidence even if short-term performance looks stable.', type: inferred, topic: kill-criteria, sourceRefs: [SR001, SR018, SR019], confidence: medium, freshness: current, answersQuestionRefs: [QR021, QR030]}
  - {id: CR041, statement: 'A confirmed control or cyber incident would be disproportionately damaging because the platform narrative rests on governed, technology-enabled lending.', type: inferred, topic: kill-criteria, sourceRefs: [SR015, SR026, SR030], confidence: medium, freshness: current, answersQuestionRefs: [QR021, QR029]}
  - {id: CR042, statement: 'Overall, Vivriti’s risk posture is manageable but clearly not de-risked; the investment case remains highly sensitive to concentration, partner-quality, and disclosure clarity.', type: inferred, topic: conclusion, sourceRefs: [SR001, SR002, SR003, SR015, SR020], confidence: medium, freshness: current, answersQuestionRefs: [QR024, QR030]}
  evidenceGaps:
  - id: EGR001
    question: Is there any live litigation, enforcement, or court-ordered action material enough to affect underwriting?
    impact: The reviewed file did not surface a clean litigation ledger, so latent legal risk could be under-scoped.
    diligenceAction: Request litigation schedule, enforcement correspondence, and legal-compliance certificate for VCL and HAC.
    relatedQuestionRefs: [QR027]
    relatedTableRefs: [TR001]
    priority: high
  - id: EGR002
    question: How concentrated are the book and partner network across top borrowers, anchors, and co-lending relationships?
    impact: Concentration could be materially worse than the broad customer counts imply.
    diligenceAction: Request top-10 and top-20 exposure tables with vintage loss and delinquency detail.
    relatedQuestionRefs: [QR019, QR021, QR024]
    relatedTableRefs: [TR002, TR003, TR005]
    priority: high
  - id: EGR003
    question: What official cyber, privacy, and third-party risk policies govern the live operating stack?
    impact: The public file is too thin to verify control maturity independently.
    diligenceAction: Obtain unblocked policy documents, audit reports, certifications, and incident summaries.
    relatedQuestionRefs: [QR017, QR026, QR029]
    relatedTableRefs: [TR001, TR002, TR003]
    priority: high
