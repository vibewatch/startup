- id: TM005
  title: Status-quo substitute map
  columns:
  - Alternative
  - What it offers
  - Why borrowers still choose it
  - Why borrowers switch away
  - Implication for Vivriti
  rows:
  - - Public and private sector banks
    - Lower-cost vanilla credit
    - Pricing and existing relationships
    - Slow process, collateral rigidity, sector limits, documentation burden
    - Vivriti wins where speed or structure matters more than lowest rate
  - - Large incumbent NBFCs
    - Specialty lending with established processes
    - Category familiarity and broader branch reach
    - Less flexibility for bespoke mid-market cases
    - Vivriti must prove better structuring and underwriting fit
  - - Private-credit funds / AIFs
    - Bespoke structured capital for complex situations
    - Can underwrite special situations or acquisition finance
    - Often higher cost and narrower repeat-operating relationships
    - Both competitor and capital-market partner
  - - Supply-chain / invoice-finance platforms
    - Digitised working-capital programmes
    - Fast onboarding for specific invoice flows
    - Limited scope outside programmatic receivables use cases
    - Vivriti can extend beyond one workflow into broader debt stack
  - - Promoter equity or internal accruals
    - No lender covenant burden
    - Control and flexibility
    - Finite capacity and high opportunity cost
    - External debt wins when growth or refinancing need exceeds internal capacity
  notes: Borrowers usually compare financing alternatives on speed, structure, collateral, and certainty of execution more than on branding.
