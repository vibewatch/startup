chapter:
  number: 2
  title: Market Analysis
  summary: 'Vivriti Capital operates in a large but easy-to-overstate part of Indian credit: the intersection of mid-market enterprise lending, structured private credit, supply-chain and receivables finance, and a growing climate-finance adjacency. Public market evidence supports strong structural demand, a meaningful formal-credit gap, and rising relevance for NBFC and private-credit channels, but it also shows that the attractive top-line opportunity is uneven. Bank funding constraints, regulatory recalibration, asset-quality divergence between secured and unsecured segments, and the absence of a clean public SAM or SOM all matter as much as macro growth when evaluating adoption and valuation.'
sections:
- id: market-boundary
  title: Market boundary and status-quo substitutes
  body: 'Vivriti''s market should not be described lazily as either "Indian fintech" or "all MSME lending." The narrower and more decision-useful boundary is mid-market enterprise credit where borrowers need debt capital but do not fit neatly into low-ticket retail underwriting or the large-company bank-and-bond lane. Accessible rating reports, company profiles, and Vivriti AMC commentary converge on that logic: the company aims at structured finance problems for businesses that are too bespoke, too lightly rated, or too operationally complex for standard bank processes. That boundary includes term loans, receivables-backed lending, supply-chain finance, co-lending structures, and some capital-markets intermediation. It excludes pure microfinance, unsecured consumer credit, and broad public-capital-market activity. The status quo is therefore not one incumbent competitor but a set of alternatives: banks for lower-risk plain-vanilla borrowers, large NBFCs for standardized specialty finance,
    private-credit funds for complex bespoke transactions, invoice-finance and supply-chain platforms for working-capital programmes, and internal promoter capital when external debt is too slow or too restrictive.'
