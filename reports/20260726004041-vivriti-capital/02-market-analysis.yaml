- id: sizing-lenses
  title: Sizing lenses, not one inflated TAM
  body: 'The public record supports a large opportunity, but only when multiple sizing lenses are kept separate. At the broad end, SIDBI''s May 2025 MSME Pulse puts commercial credit exposure to the MSME sector at Rs 35.2 lakh crore and IBEF cites a NITI/IFC finding that only 19% of MSME credit demand was met by FY21. RBI adds another lens: NBFC credit equaled 13.6% of GDP in 2023-24 and 24.5% of outstanding SCB credit at end-March 2024, showing how central non-banks have become in last-mile credit delivery. A third lens is private credit itself: EY reports $9 billion of investment in H1 2025, up 53% year on year, while S&P calls India one of the strongest private-credit growth markets in Asia-Pacific. A fourth adjacency is climate-aligned debt, where Climate Bonds reports USD55.9 billion of cumulative aligned GSS+ issuance by December 2024. These lenses are all real, but they do not reconcile into one precise Vivriti TAM because they measure different denominators, time windows, and capital
    channels.'
