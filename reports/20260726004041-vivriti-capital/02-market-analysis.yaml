- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Persistent formal-credit gap for MSMEs
    - Driver
    - Structural
    - Keeps borrower demand high even when rates are not low
    - What share of originations come from first-time formal-credit upgrades?
  - - Private-credit capital inflows rising fast
    - Driver
    - Current
    - Expands lender and partner pool for complex transactions
    - How much of Vivriti demand is bank-displaced versus private-credit-enabled?
  - - Banks facing deposit and funding pressure
    - Driver
    - Current
    - Creates room for non-bank lenders to win bespoke and faster deals
    - What spread premium is needed to offset higher NBFC funding cost?
  - - Securitisation and co-lending rails expanding
    - Driver
    - Current to 2026
    - Improves capital recycling and distribution capacity
    - How dependent is Vivriti on partner funding versus own balance sheet?
  - - 2023-2025 regulatory recalibration on NBFC exposure
    - Constraint
    - Current
    - Can compress growth in riskier channels or weaker-rated lenders
    - How sensitive is origination to bank risk-weight changes?
  - - Unsecured and supply-chain asset-quality deterioration
    - Constraint
    - Current
    - Not every fast-growing pocket is attractive on a risk-adjusted basis
    - What share of book growth comes from higher-stress segments?
  - - Co-lending share falling as compliance tightens
    - Constraint
    - Current
    - Operational complexity can reduce channel velocity
    - What are churn and renewal rates among co-lending partners?
  - - Regional concentration in southern states
    - Constraint
    - Current
    - Geographic depth helps sourcing but can concentrate macro shocks
    - How diversified is the live book by state, sector, and anchor?
  notes: The same structural forces that create demand can also worsen capital intensity or portfolio risk if underwriting discipline slips.
