  - - Supply-chain finance
    - Anchor-led supplier or distributor financing
    - Standalone retail merchant cash advance
    - Anchor treasury plus supplier CFOs; funded SME pays
    - Important workflow-led segment
  - - Co-lending and partnership channels
    - Joint origination / capital-sharing structures
    - Pure off-balance-sheet lead generation
    - Partner bank or NBFC plus end borrower
    - Capital-efficiency and distribution lever
  - - Private-credit / bespoke debt
    - Complex refinancings, acquisition finance, structured capital
    - Public equity, venture equity, broad bond-market issuance
    - CFO / promoter; enterprise borrower
    - Alternative-capital substitute and partner set
  - - Climate and sustainable debt
    - Solar, wind, EV, waste-management and other qualified use-of-proceeds loans
    - Generic ESG branding without debt underwriting
    - Borrower CFO plus compliance / project sponsors
    - Growing adjacency, not the whole market
  notes: The table defines the market by financing problem and buyer behaviour rather than by fintech branding.
