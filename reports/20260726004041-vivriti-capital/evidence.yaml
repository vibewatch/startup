evidenceGaps:
  - type: access-blocked
    severity: material
    topic: official-governance-documents
    missingEvidence: Readable access to the official board and notices pages plus the June 2025 director PDF.
    whyItMatters: >-
      A cleaner official read would let the report distinguish current directors, committee roles, and board changes
      without depending on secondary summaries.
    diligencePath: >-
      Re-run fetch-url from a network or profile that can pass the company's CloudFront block, or obtain the PDF
      directly from investor relations.
    relatedQuestionRefs:
      - QO009
      - QO025
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: employee-count-scope
    missingEvidence: A management-confirmed current headcount split across legal entity, group, and establishments.
    whyItMatters: >-
      Public trackers cite materially different counts, which affects operating-scale interpretation and productivity
      ratios.
    diligencePath: Request latest consolidated and entity-level headcount from management or a fresh annual-report footnote.
    relatedQuestionRefs:
      - QO018
  - type: private-evidence-only
    severity: minor
    topic: post-restructure-cap-table
    missingEvidence: A full post-April-2026 cap table for Vivriti Next showing exact shareholder percentages and rights.
    whyItMatters: Current sources confirm broad investors and founder infusion but not precise refreshed ownership economics.
    diligencePath: Obtain latest shareholder register, board deck, or financing memo from management or data-room materials.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO003
  - type: stale
    severity: minor
    topic: official-website-availability
    missingEvidence: A current accessible copy of annual reports and press pages from the official domain.
    whyItMatters: The blocked site weakens direct-source verification even when secondary and mirrored sources align.
    diligencePath: Retry official URLs with a different delivery path or ask the company for downloadable investor materials.
    relatedQuestionRefs:
      - QO009
      - QO025
  - type: private-evidence-only
    severity: minor
    topic: board-committee-structure
    missingEvidence: Committee-level composition for audit, risk, and nomination structures after the 2026 reorganisation.
    whyItMatters: Committee design matters for governance quality and risk oversight, especially for a fast-scaling lender.
    diligencePath: Collect latest annual-report governance annexures or debenture trustee disclosures once accessible.
    relatedQuestionRefs:
      - QO009
      - QO025
    relatedTableRefs:
      - TO004
