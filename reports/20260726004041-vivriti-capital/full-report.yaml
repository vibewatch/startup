      - number: '3.4'
        title: Durability and adverse competitive read
        blocks:
          - type: paragraph
            body: >-
              The bullish and bearish reads are both straightforward. The bullish case is that Vivriti occupies a
              narrower, more structured slice of Indian credit than standardized unsecured-loan players do; that it can
              win on underwriting judgment, bespoke structures, and capital-partner access; and that the private-credit
              market tailwind expands the financing gap it knows best. The bearish case is that none of those advantages
              are unassailable. Digital origination claims are copyable, large incumbents can publicize faster approvals
              and clearer tariffs, borrowers can multi-home, and better-capitalized firms may arbitrage the same
              opportunity set as private-credit deployment rises. CARE also continues to flag concentration and
              unsecured-book risk inside Vivriti itself, which is a reminder that competitive pressure is amplified when
              underwriting needs to stay selective. The prudent conclusion is that Vivriti has a real but conditional
              moat: more durable than a pure UX story, less durable than a regulated monopoly or a network with
              overwhelming distribution power.
            claimRefs:
