      - number: '4.4'
        title: Disclosure gaps and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The central underwriting problem is not whether Vivriti has financial activity; it is whether public
              disclosure is good enough to bridge from activity to full unit economics. The annual-reports page and the
              direct FY25 annual-report PDF both returned CloudFront 403 during this run, so filing-grade documents
              likely exist but could not be directly inspected. That forces reliance on rating reports, third-party
              coverage, and partner case studies. As a result, some metrics remain unavailable from the public record:
              cost of funds, NIM, CAC, payback, segment take rate, free-cash-flow conversion, and clean runway math.
              Even so, a bounded verdict is possible. Vivriti appears profitable, adequately capitalized, and well
              connected to debt capital, with technology investments that plausibly support scale. But the absence of
              directly inspected audited filings and the lack of a public unit-economics bridge mean investors should
              treat the financial story as investable to diligence rather than fully underwritten from public evidence
              alone. That boundary matters especially because debt-led scale can look healthier than it is if cash
              conversion, funding tenor, and pricing discipline are not examined alongside reported PAT.
