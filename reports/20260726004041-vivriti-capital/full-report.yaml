              The mitigating case is real. CARE and ICRA still rate the business in investment-grade territory; capital
              adequacy remains around 20-21%; the lender base is diversified; and ADB’s climate-bond participation
              signals external comfort with governance and use-of-proceeds controls. But these are mitigants, not
              immunity. The committee should watch a short list of thesis-breakers: sustained GNPA or stage-3 drift
