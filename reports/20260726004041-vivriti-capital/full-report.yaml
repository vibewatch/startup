              underwriting, fraud detection, reporting, and partner reconciliation. That is not generic analytics
              language; it is an operating-model statement. The same source shows a migration away from Redshift and an
              in-house open-source stack toward governed tables, lineage, time travel, Databricks SQL, and API-based
