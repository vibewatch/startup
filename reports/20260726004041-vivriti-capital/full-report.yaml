      - number: '3.3'
        title: Switching costs, scale, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Borrower switching costs in this market are real but conditional. Credit is episodic and contractual, so
              firms can multi-home across banks, NBFCs, and private-credit providers more easily than software buyers
              can rip and replace a workflow platform. That keeps pure lock-in relatively low. What raises switching
              cost is repeat financing, syndication support, sector familiarity, and the ability to finance ecosystem
              players as clients grow. Northern Arc’s page explicitly talks about repeat business, ecosystem financing,
              and investor-partner syndication, which is exactly the kind of relationship depth that can harden a lender
              position over time. Scale and distribution still matter, though. Hero FinCorp discloses relationships with
              2,000+ high-growth companies and a national footprint; Northern Arc Investments shows 100+ portfolio
              companies and 300+ originator partners; Tata Capital and banks carry their own brand trust. Against that,
              Vivriti’s 495+ financed mid-market companies show credible traction but not insurmountable scale.
