          - type: paragraph
            body: >-
              The public record supports Vineet Sukumar and Gaurav Kumar as the founding operators, with Sukumar
              remaining the key executive face as managing director. Governance visibility is directionally good but
              still imperfect because the most complete official board documents are hosted on the company's blocked
              investor site, while accessible secondary sources only partially reproduce them. Even so, multiple
              accessible sources confirm a board and investor-governance structure shaped by institutional capital,
              including directors associated with Creation, Lightrock, and other investors. This is important because
              Vivriti has never been a founder-only balance-sheet story; outside capital and nominee representation have
              been central to its scale-up. Platform evolution also matters. Earlier group structure tied the NBFC, the
              asset-management arm, and the CredAvenue/Yubi association together. By 2026, management had reorganised
              these pieces under Vivriti Next, a new operating and holding structure designed to expand into advisory,
              capital-markets access, ratings, ESG, and technology solutions in addition to lending. That move broadens
              the story from lender to financial-solutions platform, but it also means analysts have to separate
              old-entity, group, and post-reorganisation metrics carefully.
