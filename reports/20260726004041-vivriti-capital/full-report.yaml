            body: >-
              The product-tech story is credible, but trust visibility is incomplete. Databricks and ICRA support
              auditability, digital collections, and low-comingling servicing processes, which are meaningful control
              signals for a regulated lender. Yet the accessible public file still lacks a direct status page,
              security-certification pack, or official trust center that could be independently inspected. Even more
              importantly, several Vivriti-controlled pages that should have provided the cleanest product
              evidence—media and case-study surfaces, job openings, the careers page, and a supply-chain-finance
              case-study PDF—were blocked by CloudFront during this run. Those broken surfaces do not prove poor
              controls, but they do increase evidentiary uncertainty. Investors should therefore treat product maturity
              as real but under-documented, and push for direct access to official architecture, workflow, and control
              documents before assigning premium weight to the technology story. That distinction matters because
              regulated lenders can look technologically sophisticated in partner case studies while still leaving
