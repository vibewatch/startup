            body: >-
              The strongest current financial evidence sits in rating notes and the CFO interview. CARE shows capital
              adequacy around 21% in FY25 and slightly above 20% in 9MFY26, while ETCFO says about 60% of capital
              structure comes from banks, 7-8% from exchange-traded commercial deposits, and roughly 30% from NCDs. ADB
              adds another important financing layer through the $25 million climate bond, which is debt capital tied to
              green-lending use rather than new equity. The same rating note provides traction proof: 300+ enterprise
              clients, 14 lakh+ retail clients through co-lending, and continued book expansion into 9MFY26. Yet these
              positives come with caveats. Asset quality worsened from 1.89% stage-3 assets in FY25 to 2.44% in 9MFY26,
