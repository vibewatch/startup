            body: >-
              Vivriti’s differentiation looks hybrid: technology plus product structuring. Public sources do not support
              a story that technology alone is the moat, but they do show that specialized technology is important to
              speed, underwriting, monitoring, and portfolio management. Job-market proxies strengthen that
              interpretation. Foundit highlights React, Typescript, Redux, micro frontends, and GIT skills; Naukri
              mentions Github, Jira, B2B SaaS applications, debt collection, and loan origination; Uplers emphasizes
              specialized technology and high retention. These are imperfect signals, yet they still point to active
              product and data-platform investment. The stronger strategic reading is that Vivriti’s edge comes from
              combining software-enabled workflow compression with a differentiated debt-product set and analytics-led
              control layer. That makes it harder to copy than a simple digital-loan UX, but easier to question than a
              public platform with deep developer-network effects or clearly documented release surfaces. It also
