      - number: '7.2'
        title: Credit, capital, and funding risk
        blocks:
          - type: paragraph
            body: >-
              The core financial-model risk is that Vivriti remains a capital-intensive lender growing through products
              that can reprice risk quickly. CARE’s 2025 and 2026 notes show concentration risk, significant unsecured
              exposure through co-lending, and a need to preserve capital adequacy while expanding the book. The company
              still looks well capitalized on public evidence, but the margin for error is not infinite: CARE’s own
              negative sensitivities include sustained GNPA above 2.5%, weaker profitability, or gearing above 4.25x.
              Cost of funds also rose year over year, and the liability stack still depends on continued access to
              banks, bond markets, and institutional debt. If underwriting or partner-vintage performance weakens before
              new equity arrives, the same scale narrative that helps valuation can become a transmission channel into
              returns and solvency. The public filing record also shows why investors should watch liquidity and
              debt-market access closely: listed-debt disclosures, security-cover obligations, and capital-adequacy
              reporting create a more transparent perimeter than many private fintechs have, but they also mean
              deterioration should be judged against hard numbers rather than narratives. A lender that relies on term
              loans, NCDs, and institutional capital cannot assume funding will stay available at the same price through
              a credit cycle. That makes earnings resilience, not just AUM growth, a critical risk lens for
              underwriting.
