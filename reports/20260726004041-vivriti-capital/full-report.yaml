      - number: '8.4'
        title: Scenarios, ranges, and diligence
        blocks:
          - type: paragraph
            body: >-
              The practical output is a valuation range, not false precision. If investors treat the 2023 round as a
              credible upper-mid anchor and the 2025 unicorn-report mark as a lower public-reference anchor, then the
              most defensible base range today is approximately $1.3-1.7 billion, with the center of gravity closer to
              the higher end only if customer concentration, post-demerger clarity, and asset-quality durability
              continue to hold. A bull case above that range needs evidence that Vivriti Next meaningfully improves
              wallet share or public-market readiness without sacrificing risk discipline. A bear case below the low end
              follows if partner-vintage losses rise, capital adequacy weakens, or the disclosure pack remains too thin
              for late-stage pricing. The diligence work that moves the recommendation is concrete: entity
              reconciliation, top-exposure tables, product-level economics, and round-term detail. Without those, even a
              solid operating year can leave the committee paying for a story it cannot fully audit.
