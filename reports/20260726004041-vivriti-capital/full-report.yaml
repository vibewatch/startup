              Vivriti’s revenue model should be understood as lending and spread economics across multiple channels
              rather than as one visible tariff sheet. The company’s product profile spans enterprise lending,
              supply-chain finance, receivables-backed products, co-lending, and securitisation-linked activity, so
              revenue likely comes from interest spreads, structured fees, and partner-channel economics rather than
              from a single standardized schedule. Public evidence can support that broad description, but it cannot map
              realized pricing with precision because official rate-card disclosure for Vivriti’s core products was not
              retained in accessible official pages. Scope discipline is also essential. The group-level FY25 release
              shows ₹13,181 crore AUM, ₹1,429.1 crore revenue, and ₹219.2 crore PAT, while CARE’s standalone NBFC note
              reports ₹1,364 crore total income, ₹220 crore PAT, and a smaller AUM base. Those are not interchangeable
              numbers. Any underwriting must keep group, standalone, and post-restructuring metrics separate rather than
