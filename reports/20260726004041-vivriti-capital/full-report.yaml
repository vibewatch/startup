        title: Observable anchor and current call
        blocks:
          - type: paragraph
            body: >-
              The best public pricing anchor is Vivriti’s late-2023 Series D / growth-round valuation rather than any
              clean public multiple. Multiple secondary sources place that round around a $1.7 billion valuation, while
              the 2025 ASK Private Wealth / Hurun coverage places Vivriti among the year’s Indian unicorns at roughly
              $1.3 billion in its report lens. That spread matters. It tells investors the company is already valued as
              a scaled winner, but also that even public reference points do not fully converge on one number. Operating
              proof is real enough to keep the valuation discussion serious: FY25 group revenue, PAT, and AUM are large
              enough to move Vivriti out of the “promising fintech” bucket and into the “credit platform whose
              balance-sheet quality matters” bucket. The recommendation therefore cannot be a generic quality score.
              Price discipline matters a great deal here. It has to be price- and disclosure-sensitive. On today’s
              public evidence, the right call is track with a fair stance for now.
