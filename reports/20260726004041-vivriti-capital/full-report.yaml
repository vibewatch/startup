              reports isolate the lending entity. Funding history is likewise layered. Tracxn and rating reports show
              about Rs 1,399-1,400 crore of cumulative equity raised before the 2026 founder infusion, with Creation
              Investments, Lightrock, and TVS Capital Funds as recurring backers. The best-supported primary-equity
              valuation mark is the November 2023 Series D round, which Tracxn records at $1.7 billion post-money. The
              2024 ADB climate bond added $25 million of debt capital tied to green-finance deployment rather than
              equity repricing.
