  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and peer classes
        blocks:
          - type: paragraph
            body: >-
              Vivriti should not be benchmarked only against one digital lender or one private-credit fund. The
              competitive field breaks into at least four classes. First are direct mid-market and structured-credit
              peers such as Northern Arc that also speak the language of working capital, capex, NCDs, trade
              receivables, and lifecycle financing for underbanked companies. Second are broader MSME and business-loan
              incumbents like Tata Capital, Hero FinCorp, UGRO Capital, and Lendingkart that may not structure the same
              way but can still intercept many borrowers with simpler, faster credit products. Third are banks and
              supply-chain-finance incumbents such as Axis Bank that remain the status quo for corporate borrowers with
              enough collateral, documentation, or anchor relationships. Fourth are adjacent capital-market or
              marketplace players such as Yubi, which are relevant to debt distribution and borrower access even if they
              are not like-for-like balance-sheet lenders. This matters because Vivriti is not trying to outcompete one
              reference app. It is trying to win a narrower class of financing problems that sit between standardized
              MSME credit and the large-company bank-and-bond lane.
