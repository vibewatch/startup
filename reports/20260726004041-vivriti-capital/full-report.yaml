        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Vivriti is a regulated NBFC-ND-SI operating in a policy environment that has already turned less forgiving
              for unsecured retail and partner-originated lending. CARE explicitly notes that the unsecured co-lending
              book attracted higher risk weights under RBI rules and that one-time provisions rose after RBI guidance
              around FLDG and co-lending norms. The 2026 demerger adds a second legal-compliance layer because investors
              must now map historical VCL disclosures against the transferred NBFC business in Hari and Company
              Investments Madras Private Limited. CARE says the transfer should not materially impair credit quality,
              but the rating withdrawal itself shows that legal-entity continuity, security documentation, and reporting
              comparability matter. Public diligence quality is also reduced by the fact that Vivriti-controlled
