            body: >-
              The anti-thesis is mostly about risk translation and disclosure quality, not about business reality.
              Vivriti is still a leveraged lender with concentration, unsecured co-lending exposure, rising funding-cost
              sensitivity, and only partial public visibility into borrower concentration, repeat usage, and
              post-demerger economics. Public references to $1.3 billion and $1.7 billion already imply that a
              substantial amount of future execution is priced in. That would be easier to accept if investors had
              listed-company depth on segment margins, concentration, and round terms. They do not. The result is a
              company that may be good, but not obviously mispriced upward on the current public file. Another way to
              frame the problem is that Vivriti is already beyond seed or Series A ambiguity but still short of
              public-market crispness: too large to forgive uncertainty casually, not transparent enough to price with
