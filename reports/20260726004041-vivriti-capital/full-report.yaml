      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer in this market is usually not a procurement manager or a software administrator. It is
              the founder-promoter, CFO, or finance head who is trying to solve a funding problem: refinance maturing
              debt, add working capital, unlock receivables, finance a growth project, or diversify away from a single
              bank line. The day-to-day user is typically the finance or treasury team that compiles information,
              negotiates documentation, responds to due diligence, manages covenant reporting, and supports collections
              or payment flows after disbursal. The payer is the borrowing entity itself through interest, fees, and
              collateral economics. Adoption also varies by product. Supply-chain finance introduces anchor corporates
              whose programme design can shape supplier participation. Co-lending adds partner banks or NBFCs as
              channel-level counterparties. Climate-finance programmes create additional segmentation because the
              underlying borrower must meet both credit and use-of-proceeds criteria. For Vivriti, this means adoption
              is driven by real balance-sheet need and execution speed rather than by discretionary technology budget
              alone.
