      - number: '2.4'
        title: Growth drivers, constraints, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              Several forces are expanding the category. Banks still face deposit competition and funding gaps,
              private-credit capital is growing quickly, and policymakers increasingly treat NBFCs, securitisation, and
              co-lending as durable components of India's credit architecture rather than temporary workarounds. At the
              same time, this is not a frictionless market. Risk-weight changes in 2023 slowed bank credit to NBFCs, and
              even after recalibration the regulatory message remains clear: growth cannot come by hiding risk in weaker
              channels. Northern Arc's FY25 MSME NBFC review reinforces that point by showing better performance in
              secured MSME books than in unsecured and supply-chain segments, co-lending share falling as firms focus on
              quality, and profitability pressure as credit costs rise. CARE applies similar caution directly to Vivriti
              by continuing to flag concentration and unsecured-book exposure. The implication is that the market
              opportunity is real, but not every rupee of theoretical demand is equally financeable or equally valuable.
              Underwriting quality, capital access, regional depth, and product mix determine the investable portion of
              the market far more than macro growth slogans do.
