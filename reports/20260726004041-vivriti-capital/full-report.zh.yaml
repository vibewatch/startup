      - number: '3.2'
        title: 产品、定价与替代逻辑
        blocks:
          - type: paragraph
            body: >-
              产品比较的核心不是谁能打出最低的简单企业贷款价格，而是谁能解决复杂借款人处境。Northern Arc 官方中端市场页面明确列出定期贷款、结构化营运资金线、NCD 和应收账款投资，是 Vivriti
              的近似产品对标。相比之下，Lendingkart、Tata Capital 和 Hero FinCorp 更突出无担保贷款额度、速度和低文件要求。UGRO
              强调客户体验和数字便利性。这些替代并不微不足道：只要融资需求足够标准化、能放进它们的授信框架，借款人就可能选择它们。定价透明度在各类玩家之间也差异很大。Tata Capital
              公布利率、费用和提前还款条款；Hero FinCorp 和 Lendingkart 发布快速放款和低摩擦开户的主张；Vivriti
              的公开文件对标价披露薄得多。这说明竞争常常取决于关系定价、执行确定性和结构质量，而不是一张可见的 APR 表。
