            body: >-
              采纳故事在 Vivriti
              产品嵌入真实运营工作流时最强，而不是停留在泛泛品牌语言里。评级报告显示，账簿规模很大，分布在企业贷款、联合放贷、供应链金融、直接转让、租赁和保理之间，说明获客发生在多个信贷任务中，而不是一个单一承销引擎。具名证明有限，但有意义。Source.One
              2024 年供应链金融公告描述了一笔 Rs 40 crore 额度，用于支持聚合物贸易中的 6,000+ 买家和 300+ 供应商。BusinessLine 对 Infra.Market
              的报道显示，Vivriti 与其他贷款方一起通过不可转换债券参与 Rs 150 crore 债务轮。在医疗金融科技领域，2025 年 3 月两篇报道称 Care.fi 从 Vivriti 获得 Rs 7.5
              crore 债务，用于扩张 RevNow；借款人称其覆盖 300+ 医院、审计 50,000+ 理赔，并处理 Rs 800 crore 理赔。这些不是穷尽式客户披露，但证明了真实借款人和可识别用例中的实际部署。
