      - 判断
      - 当前观点为何成立
      - 改变观点的证据
    rows:
      - - 建议
        - 跟踪
        - 业务真实且已有规模，但披露仍太薄，不足以支撑强买入判断
        - 更清楚的集中度和分拆后证据
      - - 信心
        - 中
