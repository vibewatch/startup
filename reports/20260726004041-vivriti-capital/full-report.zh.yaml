      - number: '8.2'
        title: 公允判断的支撑
        blocks:
          - type: paragraph
            body: >-
              运营证据足够多，能把 Vivriti 留在一个可支撑的私募市场区间内。集团 FY25 指标显示有意义且盈利的规模，CARE 和 2026 年新闻报道也显示 NBFC 账簿、资本充足率和客户基础持续扩张至 2025
              年 12 月。公司还受益于结构性位置：印度中端市场信贷缺口很大，银行仍有选择性，Vivriti 已在企业贷款、联合放贷、供应链金融和气候相关债务之间建立差异化触达。投资人质量也有帮助。股权结构和伙伴名单包括
              Creation、Lightrock、TVS Capital，以及 ADB
              相关融资支持。公开融资历史还显示，早期机构验证并非一轮幸运融资；在判断上一轮估值是一次性事件还是多轮模式的一部分时，这一点很重要。这些都不能证明股票便宜，但确实说明，这项 业务根基值得认真估值，而不是自动怀疑。
