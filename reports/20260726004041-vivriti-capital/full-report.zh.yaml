  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与口径纪律
        blocks:
          - type: paragraph
            body: >-
              Vivriti
              的收入模式应理解为多渠道放贷和利差经济，而不是一张可见费率表。公司的产品画像覆盖企业贷款、供应链金融、应收账款支持产品、联合放贷和证券化相关活动，因此收入可能来自利息利差、结构化费用和合作渠道经济性，而不是单一标准化价目表。公开证据能支持这一宽口径描述，但无法精确映射已实现定价，因为
              Vivriti 核心产品的官方费率卡披露没有保留在可访问官方页面中。口径纪律也很关键。集团层面的 FY25 公告显示 AUM 为 ₹13,181 crore、营收 ₹1,429.1 crore、PAT
              ₹219.2 crore，而 CARE 的单体 NBFC 说明报告总收入 ₹1,364 crore、PAT ₹220 crore，且 AUM
              基数更小。这些数字不能互换。任何承销都必须区分集团、单体和重组后指标，而不是强行塞进同一个叙事。
