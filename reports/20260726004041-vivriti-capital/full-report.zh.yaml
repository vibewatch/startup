  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Vivriti 的市场不应偷懒地写成「印度金融科技」或「全部 MSME 贷款」。更窄也更适合决策的边界，是中端市场企业信贷：借款人需要债务资本，却无法顺利落入低客单价零售授信或大型公司银行 /
              债券通道。可访问的评级报告、公司画像和 Vivriti AMC
              评论都指向这一逻辑：公司瞄准的是标准银行流程难以处理的结构化融资问题，原因可能是企业太定制化、评级太浅，或运营复杂度太高。该边界包括定期贷款、应收账款支持贷款、供应链金融、联合放贷结构，以及部分资本市场中介。它不包括纯小额金融、无担保消费信贷和宽泛的公开资本市场活动。因此，现状不是某一家既有竞争者，而是一组替代方案：低风险标准化借款人找银行；大型
              NBFC 处理标准化专项金融；复杂定制交易找私募信贷基金；营运资金项目找发票金融和供应链平台；外部债务太慢或限制太多时，则动用创始人 / 控股股东内部资本。
