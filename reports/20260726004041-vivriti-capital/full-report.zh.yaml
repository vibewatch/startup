  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与同业类别
        blocks:
          - type: paragraph
            body: >-
              Vivriti 不应只拿来对标某一家数字贷款机构或某一只私募信贷基金。竞争场域至少分成四类。第一类是直接中端市场和结构化信贷同业，例如 Northern
              Arc，同样围绕营运资金、资本开支、NCD、贸易应收账款，以及面向欠服务企业的生命周期融资展开。第二类是更宽的 MSME 和企业贷款既有玩家，如 Tata Capital、Hero FinCorp、UGRO
              Capital 和 Lendingkart；它们未必用同样方式做结构化，但仍可能用更简单、更快的信贷产品截走许多借款人。第三类是银行和供应链金融既有玩家，例如 Axis
              Bank；只要企业借款人有足够抵押、文件或核心企业关系，它们仍是现状选择。第四类是相邻的资本市场或市场平台，例如 Yubi；即便它们不是一一对应的资产负债表贷款机构，在债务分销和借款人触达上仍相关。这很关键，因为
              Vivriti 不是在试图击败某个参照应用。它要赢的是标准化 MSME 信贷与大型公司银行 / 债券通道之间那一类更窄的融资问题。
