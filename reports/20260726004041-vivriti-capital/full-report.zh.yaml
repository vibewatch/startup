  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品栈与客户任务
        blocks:
          - type: paragraph
            body: >-
              公开文件里的 Vivriti 不像单一贷款产品，更像一组债务产品和交付工作流，面向不同融资任务：直接企业贷款、联合放贷、供应链和应收账款金融、证券化相关资产池，以及气候金融用例。PrivateCircle
              和其他画像用精细组合的产品、专业技术和多层级承销来描述它，进一步强化了这种宽度；ADB 的气候金融项目则证明，同一家贷款机构可以为太阳能、风电、EV
              和废弃物管理借款人配置贷款产品。因此，正确的客户工作流框架不是「在线申请贷款」，而是「为服务不足的中端市场和合作伙伴发起借款人，结构化、承销、制作文件、放款、监控并回收复杂债务产品」。这一定义比标准化无担保贷款
              应用使用的产品定义更偏运营。
