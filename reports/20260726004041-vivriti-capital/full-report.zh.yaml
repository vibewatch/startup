      - number: '2.3'
        title: 买方、用户、付款方与采纳路径
        blocks:
          - type: paragraph
            body: >-
              这个市场里的经济买方通常不是采购经理或软件管理员，而是创始人控股股东、CFO
              或财务负责人，他们要解决的是融资问题：再融资到期债务、补充营运资金、盘活应收账款、为增长项目融资，或摆脱单一银行授信。日常用户通常是财务或资金团队，负责汇总资料、谈判文件、响应尽调、管理 契约条款
              报告，并在放款后支持催收或支付流。付款方是借款实体本身，通过利息、费用和抵押品经济性付费。采纳路径也因产品而异。供应链金融引入核心企业，其项目设计会影响供应商参与。联合放贷加入合作银行或 NBFC
              作为渠道级交易对手。气候金融项目带来额外分层，因为底层借款人既要满足信贷标准，也要满足资金用途标准。对 Vivriti 来说，采纳由真实资产负债表需求和执行速度驱动，而不是仅靠可自由支配的技术预算。
