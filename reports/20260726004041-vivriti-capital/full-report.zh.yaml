      - 参考价值
      - 局限
    rows:
      - - Vivriti 上一轮私募锚点
        - 2023 年末融资轮
        - ~$1.7B 私募估值标记
        - 当前承保判断的直接锚点
        - 条款和优先权未披露
      - - ASK / Hurun 2025 参考
