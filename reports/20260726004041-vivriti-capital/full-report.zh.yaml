              Databricks 给出了本次研究中最清晰的产品技术证据。它把 Vivriti 描述为高交易量 B2B2C 贷款模型：毫秒级响应很重要，实时 API
              调用驱动身份识别、承销、欺诈检测、报告和合作伙伴对账。这不是泛泛的分析语言，而是运营模型陈述。同一来源还显示，Vivriti 从 Redshift 和内部开源栈迁移到受治理表、数据血缘、time travel
              功能、Databricks SQL，以及基于 API 的摄取，用于自动检查和报告。Leegality 和 ICRA
              从借款人文件流中的数字化执行、至少一个证券化资产池中的全数字催收两侧补充了架构故事。合在一起，可访问记录支持一条从获客、文件、放款、分析到服务的贯通工作流。它没有揭示每个组件，但确实显示 Vivriti
              的贷款运营真正由软件中介完成。因此，现有证据支持其拥有真实生产基础设施，并对借款人、伙伴和监管者的工作流产生实质影响。
