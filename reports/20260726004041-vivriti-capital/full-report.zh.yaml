      - number: '2.2'
        title: 多重测算视角，而不是膨胀的单一 TAM
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一个大机会，但前提是把多重测算视角分开。最宽口径下，SIDBI 2025 年 5 月 MSME Pulse 把 MSME 板块的商业信贷敞口测算为 Rs 35.2 lakh crore，IBEF 引述
              NITI/IFC 发现称，FY21 仅 19% 的 MSME 信贷需求得到满足。RBI 又给出另一层视角：2023-24 年 NBFC 信贷相当于 GDP 的 13.6%，到 2024 年 3 月末相当于 SCB
              未偿信贷的 24.5%，说明非银在最后一公里信贷交付中已经很核心。第三个视角是私募信贷本身：EY 报告 2025 年上半年投资额为 $9 billion，同比增长 53%；S&P
              称印度是亚太私募信贷增长最强的市场之一。第四个相邻机会是气候相关债务，Climate Bonds 报告截至 2024 年 12 月，累计符合口径的 GSS+ 发行量为 USD55.9
              billion。这些视角都真实存在，但不能拼成一个精确的 Vivriti TAM，因为它们衡量的分母、时间窗口和资本通道各不相同。
