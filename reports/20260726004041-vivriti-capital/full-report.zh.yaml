      - number: '1.2'
        title: 创始人、治理与平台演进
        blocks:
          - type: paragraph
            body: >-
              公开记录支持 Vineet Sukumar 和 Gaurav Kumar 是创始运营者，Sukumar
              仍以董事总经理身份充当关键高管面孔。治理可见度方向上不错，但仍不完整：最完整的官方董事会文件托管在公司被拦截的投资人网站上，可访问的二级来源只部分转载。即便如此，多份可访问来源仍确认，董事会和投资人治理结构由机构资本塑造，包括与
              Creation、Lightrock 及其他投资方有关的董事。这一点重要，因为 Vivriti 从来不是只有创始人资产负债表的故事；外部资本和提名董事代表一直是其规模化的核心。平台演进同样重要。早期集团结构把
              NBFC、资产管理部门以及 CredAvenue/Yubi 的关系绑在一起。到 2026 年，管理层已把这些部分重组到 Vivriti Next
              之下，这是新的运营与控股架构，旨在除放贷外扩展到咨询、资本市场准入、评级、ESG 和技术解决方案。该动作把叙事从贷款机构拓宽为金融解决方案平台，但也意味着分析师必须仔细区分旧实体、集团和重组后的指标。
