      - number: '6.3'
        title: 耐久性与留存可见度
        blocks:
          - type: paragraph
            body: >-
              公开耐久性证据远弱于客户数量证据。Vivriti 在本次研究可访问的任何来源中，都没有披露 NRR、GRR、客户标识流失、合同期限、续约率或群组 曲线。最佳可用代理指标是间接的。CARE
              描述了多元化贷款组合，以及负债端超过 45 家贷款方关系，但这更多说明融资韧性，而不是借款人留存。低 GNPA 有帮助，却衡量的是信贷质量，而非明确续借或重复借款行为。Vivriti 在数年间从纯 NBFC /
              金融板块敞口扩展到中端市场企业、联合放贷、供应链和气候金融板块，据此可以推断一部分客户耐久性，但公开来源仍没有说明多少借款人会第二次融资、内部再融资，或从一个产品家族扩展到另一个。因此，投资人应把耐久性视为合理但披露不足。
