  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Vivriti 是受监管的 NBFC-ND-SI，所处政策环境已经对无担保零售和伙伴发起贷款更不宽容。CARE 明确指出，无担保联合放贷账簿在 RBI 规则下面临更高风险权重，且 RBI 围绕 FLDG
              和联合放贷规范的指引发布后，一次性拨备上升。2026 年分拆又增加了第二层法律合规问题，因为投资人现在必须把历史 VCL 披露与转入 Hari and Company Investments Madras
              Private Limited 的 NBFC 业务对应起来。CARE 称该转移不应实质削弱信用质量，但评级撤回本身说明，法律实体连续性、担保文件和报告可比性很重要。本次运行中，Vivriti
              控制的通知、媒体和政策页面返回 CloudFront 拦截，也降低了公开尽调质量。
            claimRefs:
              - CR001
