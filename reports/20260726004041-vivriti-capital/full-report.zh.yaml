  - id: TR005
    title: 缓释和否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 资产质量
        - GNPA / stage-3 走高
        - 持续高于 2.5%，或合作伙伴放款批次明显恶化
        - 向高风险下行情景重估
      - - 资本充足率
        - CAR 恶化
        - 在没有可信资本计划时，降至接近或低于 20%
        - 暂停正向承保判断
      - - 杠杆
        - 杠杆率抬升
        - 持续高于 4.25x
        - 视为打破论点的预警
      - - 披露清晰度
        - 分拆后报告不透明
        - 未能清楚勾稽 VCL 与 HAC 经济账
        - 提高尽调强度并下调信心
      - - 合作伙伴集中度
        - 暴露重大隐性集中度
