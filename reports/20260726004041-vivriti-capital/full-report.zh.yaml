    title: 打破论点与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 资产质量
        - GNPA / stage-3 持续恶化
        - 削弱合理情景和融资信心
        - 转向悲观情景
      - - 资本充足率
        - 明显向低于 20% 下滑，且没有补充资本抵消
        - 降低增长能力
        - 下调估值区间
      - - 披露清晰度
        - 未能勾稽 VCL / HAC 经济账
        - 损害承保信心
        - 维持或下调至回避
      - - 集中度
        - 头部借款人或合作伙伴敞口意外偏高
