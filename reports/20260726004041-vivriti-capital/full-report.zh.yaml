      - number: '8.4'
        title: 情景、区间与尽调
        blocks:
          - type: paragraph
            body: >-
              实际输出应是估值区间，而不是虚假的精确。如果投资人把 2023 年轮次视为可信的中高位锚点，把 2025 年独角兽报告标记视为较低的公开参考锚点，那么今天最可辩护的基准区间约为 $1.3-1.7
              billion；只有在客户集中度、分拆后清晰度和资产质量耐久性继续站得住时，重心才更接近高端。高于该区间的看多情景需要证据证明，Vivriti Next 在不牺牲风险纪律的前提下，能显著提升钱包份额
              或公开市场准备度。低于下端的看空情景则会在伙伴批次
              损失上升、资本充足率走弱，或披露包薄到无法支撑后期定价时出现。能推动建议变化的尽调工作很具体：实体对账、最大敞口表、产品级经济性和轮次条款细节。没有这些，即便运营年份扎实，委员会也可能是在为一个无法完全审计的故事买单。
