        - 公开锚点约 $1.3B-$1.7B，看起来站得住，但不算明显便宜
        - 更低入场价或更强披露
      - - 决策含义
        - 不追高
        - 证据更支持有纪律地跟踪，而不是急于出手
        - 只有证据改善快于价格时才上调
    notes: 快照对价格敏感，刻意概括投委会判断，而不是完整模型。
