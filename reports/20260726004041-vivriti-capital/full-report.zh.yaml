              当前最强财务证据来自评级说明和 CFO 访谈。CARE 显示 FY25 资本充足率约 21%，9MFY26 略高于 20%；ETCFO 称资本结构中约 60% 来自银行，7-8% 来自交易所交易商业存款，约
              30% 来自 NCD。ADB 通过 $25 million 气候债券增加了另一层重要融资；这是绑定绿色放贷用途的债务资本，不是新股权。同一评级说明还给出 进展证明：300+ 企业客户、通过联合放贷触达 14
              lakh+ 零售客户，并且账簿持续扩张到 9MFY26。但这些正面信号带有保留。资产质量从 FY25 的 1.89% 第三阶段资产恶化到 9MFY26 的 2.44%，AUM
