      - number: '3.3'
        title: 切换成本、规模与分销能力
        blocks:
          - type: paragraph
            body: >-
              这个市场的借款人切换成本真实存在，但带条件。信贷是间歇性、合同化的，企业可以在银行、NBFC
              和私募信贷提供方之间多栖，比软件买方替换工作流平台更容易。这让纯粹锁定相对较低。真正抬高切换成本的是重复融资、银团支持、行业熟悉度，以及在客户成长时为生态内企业提供融资的能力。Northern Arc
              页面明确谈到重复业务、生态融资和投资人伙伴银团，这正是能随时间强化贷款机构位置的关系深度。尽管如此，规模和分销仍然重要。Hero FinCorp 披露与 2,000+
              高增长公司建立关系并拥有全国覆盖；Northern Arc Investments 显示 100+ 被投企业和 300+ 资产发起伙伴；Tata Capital 和银行自带品牌信任。相比之下，Vivriti 的
              495+ 已融资中端市场公司显示可信进展，但并非不可逾越的规模。
