    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与核心业务
        blocks:
          - type: paragraph
            body: >-
              首先，Vivriti Capital 应被理解为一家受监管的贷款平台，而不是泛泛的金融科技品牌。ICRA 和 CARE 的评级报告、公司注册数据以及第三方公司画像，在核心身份上能够对齐：Vivriti
              Capital Limited 于 2017 年 6 月 22 日在 Chennai 注册成立，2018 年 1 月取得 NBFC 牌照，作为非吸收存款、系统重要性的 NBFC
              运营，聚焦印度中端市场的债务融资。公司对问题的定义在各类来源中一致：这些借款人比小额金融的客群更大，但对传统银行和债券市场流程而言，又太小、评级不足，或融资结构太定制化。外部画像和评级报告的产品描述显示，Vivriti
              提供的是一套宽口径债务工具，而不是单一贷款产品，包括定期贷款、营运资金需求贷款、供应链金融、联合放贷、证券化、保理、租赁和不可转换债券。这种宽度很关键，因为它解释了为什么公司会同时出现在企业贷款、零售联合放贷、结构化金融和气候金融语境里，而且并不矛盾。
