      - number: '2.4'
        title: 增长驱动、约束与反向信号
        blocks:
          - type: paragraph
            body: >-
              多股力量正在扩张这个类别。银行仍面临存款竞争和资金缺口，私募信贷资本增长很快，政策制定者也越来越把 NBFC、证券化和联合放贷视为印度信贷架构的长期组件，而不是临时绕路。但这个市场并非没有摩擦。2023
              年风险权重调整放慢了银行对 NBFC 的信贷投放；即使重新校准后，监管信息仍很清楚：增长不能靠把风险藏进更弱的渠道。Northern Arc 的 FY25 MSME NBFC 回顾强化了这一点：有担保 MSME
              账簿表现好于无担保和供应链板块；企业聚焦质量后，联合放贷占比下降；信贷成本上行压缩盈利。CARE 对 Vivriti
              也给出类似谨慎，持续提示集中度和无担保账簿敞口。结论是，市场机会真实存在，但理论需求里的每一卢比并不都同样可融资、同样有价值。决定可投资市场的，远不是宏观增长口号，而是承销质量、资本可得性、区域深度和产品组合。
