      - number: '4.4'
        title: 披露缺口与财务判断
        blocks:
          - type: paragraph
            body: >-
              核心承销问题不是 Vivriti 有没有财务活动，而是公开披露是否足够把活动桥接到完整单位经济性。年报页面和直接 FY25 年报 PDF 在本次运行中都返回 CloudFront
              403，因此申报级文件很可能存在，却无法直接检查。这迫使分析依赖评级报告、第三方报道和合作伙伴案例研究。结果是，部分指标仍无法从公开记录获得：资金成本、NIM、CAC、回本期、分部
              抽成率、自由现金流转化，以及清晰的续航期计算。即便如此，仍可以给出有边界的判断。Vivriti
              看起来盈利、资本充足，并且与债务资本连接良好；技术投入也有理由支撑规模。但缺少可直接检查的审计文件，且没有公开单位经济性桥接，意味着投资人应把财务故事视为值得进入尽调，而不是仅靠公开证据就已完整承销。这个边界尤其重要，因为如果不把现金转化、融资期限和定价纪律同披露
              PAT 放在一起检查，以债务驱动的规模会显得比实际更健康。
