      - number: '6.4'
        title: 扩张循环与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Vivriti
              的扩张路径似乎来自现有客户或伙伴关系周边的相邻融资任务：中端市场企业可以从定期贷款走向供应链或应收账款结构；联合放贷伙伴可以加入更多终端借款人和贷款产品；气候金融授权可以引入新的借款人群组，而无需改变整体承销能力。官方
              2026 年表述更进一步，称客户越来越需要资本市场准入、资产负债表结构化、ESG 支持和技术驱动效率，这也是 Vivriti Next
              围绕更广集团推出的原因。这给先落地再扩张带来上行，但也提出集中度和执行问题。公开证据仍未披露最大借款人集中度、最大核心企业集中度、产品交叉销售率，或最大联合放贷伙伴贡献。CARE
              明确警示集中度风险和较大无担保贷款占比；客户章节无法仅靠公开证据补上这个缺口。结果是，客户基础看起来真实且宽，但集中度和重复使用质量仍比表面客户数更难承销。
