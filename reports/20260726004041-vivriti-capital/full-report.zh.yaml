        - label: 扩展循环
          detail: 关系可扩展到更多合作伙伴、更多终端借款人，或相邻战略 / 咨询支持
          tone: neutral
        - label: 缺失的持久性层
          detail: 公开来源没有显示续约、流失或队列转换率
          tone: warning
    approximationNotes: 该图基于具名交易和细分披露推断出一条概括性融资关系路径，并非官方披露漏斗。
    claimRefs:
      - CU001
      - CU012
      - CU014
      - CU032
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 公开证据显示，Vivriti 从细分场景获客出发，进入产品投放，再走向合作伙伴或生态带动的规模化。
    data:
      nodes:
        - id: source
          label: 发起来源
          detail: 直接企业获客、合作伙伴 NBFC、供应链核心企业或主题气候渠道
        - id: structure
          label: 设计结构并授信
          detail: 定期贷款、NCD、联合放贷、保理或挂钩气候债的投放
        - id: deploy
          label: 投放资金
          detail: 资金进入借款人的生产业务流程
        - id: outcomes
          label: 借款人成果
          detail: 流动性、理赔处理、采购流或项目融资增长
        - id: expand
          label: 扩展关系
          detail: 重复提款、更大网络触达或相邻解决方案
      edges:
        - from: source
          to: structure
          label: 转化为
        - from: structure
          to: deploy
          label: 完成文档并
        - from: deploy
          to: outcomes
          label: 支持
        - from: outcomes
          to: expand
          label: 可支撑
    claimRefs:
      - CU012
      - CU015
      - CU016
      - CU017
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 具名借款人证明在用例具体度和生产状态上最强，但重复经济性和留存可见度较弱。
    data:
      columns:
        - 生产环境证明
        - 成果具体度
        - 独立佐证
        - 留存可见度
        - 收入可见度
      rows:
        - label: Source.One
          values:
            - tone: positive
              label: 已上线融资安排
            - tone: positive
              label: 6000+ 买家 / 300+ 供应商
            - tone: warning
              label: 单一新闻来源
            - tone: negative
              label: 未披露
            - tone: negative
              label: 无经济性数据
        - label: Infra.Market
          values:
            - tone: positive
              label: 已完成债务融资轮
            - tone: warning
              label: 借款人层面用途泛化
            - tone: positive
              label: 独立新闻报道
            - tone: negative
              label: 未披露
            - tone: negative
              label: Vivriti 份额未知
        - label: Care.fi
          values:
            - tone: positive
              label: 已完成债务融资轮
            - tone: positive
              label: 300+ 家医院 / 50k 笔理赔
            - tone: warning
              label: 两篇借款人关联报道
            - tone: negative
              label: 未披露
            - tone: negative
              label: 未披露 Vivriti 收益率
    claimRefs:
      - CU014
      - CU018
      - CU019
      - CU025
      - CU030
  - id: FU004
    title: 留存 / 复借队列
    type: cohort
    layout: wide
    summary: 仅为示意队列，用来框定披露缺口；Vivriti 不披露实际借款人留存或复借队列。
    data:
      columns:
        - 第 0 年
        - 第 1 年
        - 第 2 年
      rows:
        - label: 企业借款基准代理
          values:
            - value: 100
              displayValue: 100%
            - value: 85
              displayValue: 85%
            - value: 75
              displayValue: 75%
          tone: neutral
        - label: 合作伙伴计划基准代理
          values:
            - value: 100
              displayValue: 100%
            - value: 80
              displayValue: 80%
            - value: 68
              displayValue: 68%
          tone: warning
    approximationNotes: 这些只是用于组织尽调问题的示意性基准曲线，不是 Vivriti 特定披露留存率。
    claimRefs:
      - CU024
      - CU025
      - CU026
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最高残余风险集中在监管、集中度和合作伙伴发起信贷质量上，并非关乎生死的烧钱问题。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 残余严重性
      rows:
        - label: 联合放贷 / 无抵押信贷风险
          values:
            - tone: positive
              label: 中高
            - tone: negative
              label: 极高
            - tone: warning
              label: 中
            - tone: negative
              label: 高
        - label: 监管 / 规则变化风险
          values:
            - tone: negative
              label: 高
            - tone: negative
              label: 高
            - tone: warning
              label: 中
            - tone: negative
              label: 高
        - label: 分拆后披露风险
          values:
            - tone: warning
              label: 中
            - tone: warning
              label: 高
            - tone: warning
              label: 中
            - tone: warning
              label: 中高
        - label: 融资 / 资金成本风险
          values:
            - tone: warning
              label: 中
            - tone: warning
              label: 高
            - tone: positive
              label: 中高
            - tone: warning
              label: 中
    claimRefs:
      - CR001
      - CR004
      - CR011
      - CR014
      - CR018
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 监管、合作伙伴质量和融资成本会传导到亏损、资本、增长和估值。
    data:
      nodes:
        - id: reg
          label: RBI / SEBI 规则
        - id: partner
          label: 合作伙伴和借款人质量
        - id: costs
          label: 融资成本
        - id: loss
          label: 拨备 / 损失
        - id: capital
          label: CAR / 杠杆率
        - id: growth
          label: 资产生成能力
        - id: value
          label: 估值 / 信心
      edges:
        - from: reg
          to: loss
          label: 能筹资
        - from: partner
          to: loss
          label: 驱动
        - from: costs
          to: value
          label: 压缩
        - from: loss
          to: capital
          label: 削弱
        - from: capital
          to: growth
          label: 约束
        - from: growth
          to: value
          label: 塑造
    claimRefs:
      - CR002
      - CR012
      - CR016
      - CR019
      - CR021
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Vivriti 的放贷模式依赖伙伴、平台、资金方和监管机构；这些关键环节都不在管理层直接控制之内。
    data:
      nodes:
        - id: partners
          label: 联合放贷伙伴
        - id: anchors
          label: 供应链核心企业
        - id: lenders
          label: 银行 / 债券投资者 / ADB
        - id: platforms
          label: Databricks / 工作流供应商
        - id: rating
          label: CARE / ICRA / 监管机构
        - id: vivriti
          label: Vivriti 放贷引擎
      edges:
        - from: partners
          to: vivriti
          label: 提供借款人流量
        - from: anchors
          to: vivriti
          label: 提供 MSME 流量
        - from: lenders
          to: vivriti
          label: 为增长供资
        - from: platforms
          to: vivriti
          label: 支撑报告与工作流
        - from: rating
          to: lenders
          label: 影响信心
        - from: rating
          to: vivriti
          label: 约束并监督
    claimRefs:
      - CR023
      - CR024
      - CR025
      - CR027
      - CR029
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 估值要把真实规模和真实风险放在一起看，而不能只外推独角兽标签。
    data:
      nodes:
        - id: scale
          label: 规模证明
          detail: FY25 收入
          PAT: null
          AUM: null
          and client breadth: null
        - id: market
          label: 市场缺口
          detail: 中端市场信贷机会大，服务不足
        - id: risk
          label: 风险叠加
          detail: 集中度
          leverage: null
          partner and disclosure risk: null
        - id: anchor
          label: 定价锚点
          detail: 报告标记约 $1.3B，上一轮约 $1.7B
        - id: call
          label: 建议
          detail: 跟踪 / 公允 / 高风险
      edges:
        - from: scale
          to: anchor
          label: 支撑
        - from: market
          to: anchor
          label: 放大
        - from: risk
          to: call
          label: 约束
        - from: anchor
          to: call
          label: 提供依据
    claimRefs:
      - CV004
      - CV008
      - CV014
      - CV024
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 估值敏感性更多由信心和风险溢价变化驱动，而不是名义规模的小幅波动。
    data:
      items:
        - label: 披露改善、集中度更清晰
          value: 3
          unit: directional uplift
          detail: 可能推向区间上沿
        - label: 资产质量与 CAR 稳定
          value: 2
          unit: directional uplift
          detail: 支撑从基准走向乐观
        - label: 融资成本压缩
          value: 1
          unit: directional uplift
          detail: 改善股权经济性
        - label: 合作伙伴批次损失上升
          value: -3
          unit: directional drag
          detail: 把估值推向悲观情形
        - label: 分拆后不透明
          value: -2
          unit: directional drag
          detail: 压低信心倍数
        - label: 集中度意外
          value: -3
          unit: directional drag
          detail: 迫使折价拉大
    claimRefs:
      - CV016
      - CV024
      - CV027
      - CV033
      - CV037
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 区间视角围绕当前公开锚点，而不是过拟合的同业倍数模型。
    data:
      items:
        - label: 悲观情形
          low: 1000
          mid: 1200
          high: 1300
          unit: USD M
          detail: 集中度或信用质量不及预期
        - label: 基准情形
          low: 1300
          mid: 1500
          high: 1700
          unit: USD M
          detail: 当前公开证据区间
        - label: 乐观情形
          low: 1700
          mid: 1850
          high: 2100
          unit: USD M
          detail: 披露改善，经济性有韧性
    approximationNotes: 这些区间是情景锚点，不是折现现金流结论。
    claimRefs:
      - CV002
      - CV003
      - CV032
      - CV033
      - CV034
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 可上 IC 的评分卡显示，Vivriti 业务底盘强，但估值与风险仍在拉扯。
    data:
      items:
        - label: 市场
          value: 8
          max: 10
          detail: 信贷缺口大，服务不足
        - label: 产品 / 护城河
          value: 7
          max: 10
          detail: 放贷栈宽，承保能力有积累
        - label: 客户证明
          value: 6
          max: 10
          detail: 覆盖面不错；具名客户耐久性证据偏薄
        - label: 经济性
          value: 7
          max: 10
          detail: 规模已盈利，但产品级披露不完整
        - label: 风险
          value: 4
          max: 10
          detail: 杠杆与集中度让风险仍偏高
        - label: 估值
          value: 5
          max: 10
          detail: 公允
          not obviously cheap: null
        - label: 证据质量
          value: 5
          max: 10
          detail: 强于种子期
          weaker than listed peers: null
    claimRefs:
      - CV011
      - CV017
      - CV022
      - CV030
      - CV041
