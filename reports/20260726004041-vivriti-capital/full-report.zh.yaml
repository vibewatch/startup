      - number: '3.4'
        title: 耐久性与反向竞争解读
        blocks:
          - type: paragraph
            body: >-
              看多和看空逻辑都很直接。看多理由是，Vivriti
              占据的印度信贷切片比标准化无担保贷款玩家更窄、更结构化；它可以靠承销判断、定制结构和资本伙伴触达取胜；私募信贷市场顺风也在扩大它最熟悉的融资缺口。看空理由是，这些优势没有一个牢不可破。数字化获客主张可复制，大型既有玩家可以公开更快审批和更清晰费率，借款人可以多栖；随着私募信贷投放上升，资本更充足的公司也可能套利同一机会集。CARE
              还持续提示 Vivriti 内部的集中度和无担保账簿风险，提醒投资人：当承销必须保持选择性时，竞争压力会被放大。审慎结论是，Vivriti 有真实但有条件的护城河：比纯 UX
              故事更耐久，但弱于受监管垄断或拥有压倒性分销能力的网络。
