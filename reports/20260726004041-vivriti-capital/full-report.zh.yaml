      - number: '8.3'
        title: 为什么判断不上调到买入
        blocks:
          - type: paragraph
            body: >-
              反命题主要关乎风险如何转化和披露质量，而不是业务真实性。Vivriti
              仍是一家加杠杆的贷款机构，存在集中度、无担保联合放贷敞口、资金成本敏感性上升，以及对借款人集中度、重复使用和分拆后经济性只有部分公开可见度。公开提到的 $1.3 billion 和 $1.7 billion
              已经意味着大量未来执行被计入价格。如果投资人能拿到上市公司级别的分部利润率、集中度和轮次条款深度，这个价格会更容易接受。但他们没有。结果是，公司可能不错，但从当前公开文件看，并不明显存在向上错价。另一种说法是，Vivriti
              已经越过 seed 或 Series A 的模糊阶段，但还没有达到公开市场的清晰度：规模太大，不能轻易原谅不确定性；透明度又不足，无法按上市公司精度定价。因此，判断停留在 跟踪，而不是买入或回避。
