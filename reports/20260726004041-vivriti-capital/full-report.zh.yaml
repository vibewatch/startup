      - - 私募信贷基金 / AIFs
        - 面向复杂场景的定制结构化资本
        - 能承接特殊情境或收购融资
        - 成本通常更高，重复经营关系更窄
        - 既是竞争者，也是资本市场伙伴
      - - 供应链 / 发票融资平台
        - 数字化营运资金方案
        - 特定发票流程可快速接入
        - 程序化应收账款场景之外覆盖有限
        - Vivriti 可从单一流程延伸到更宽的债务栈
