      - number: '7.3'
        title: 伙伴、运营与技术依赖
        blocks:
          - type: paragraph
            body: >-
              Vivriti 的运营模型在结构上依赖它无法完全控制的主体和系统：联合放贷伙伴、供应链核心企业、贷款方、受托人、评级机构、文件供应商和数据平台都位于执行路径上。Databricks 记录了一个高交易量 B2B2C
              环境，实时 API 负责借款人识别、承销、欺诈检查、伙伴对账和报告；Leegality 证明文件流被压缩；CARE 和 ADB
              证明伙伴和核心企业是触达终端借款人的重要渠道。该模型带来速度和触达，但也从上下游交易对手引入运营、合规和集中度风险。公开文件在网络安全保证、事件报告和第三方控制文档上最弱，因为本次运行没有保留任何可访问的
