      - number: '7.2'
        title: 信贷、资本与融资风险
        blocks:
          - type: paragraph
            body: >-
              核心财务模型风险在于，Vivriti 仍是一家资本密集型贷款机构，并通过可快速重定价风险的产品增长。CARE 2025 和 2026 年评级说明
              显示，集中度风险、通过联合放贷形成的显著无担保敞口，以及在扩表同时维持资本充足率的需求。公开证据显示公司资本仍充足，但容错空间不是无限的：CARE 自身的负面敏感性包括 GNPA 持续高于
              2.5%、盈利能力走弱或杠杆率高于 4.25x。资金成本也同比上升，负债栈仍依赖持续接入银行、债券市场和机构债务。如果新股权到位前承销或合作伙伴批次
              表现走弱，支撑估值的同一套规模叙事就可能变成传导至回报和偿付能力的通道。公开申报记录也说明投资人为什么要密切关注流动性和债务市场准入：上市债披露、担保覆盖义务和资本充足率报告，创造了比许多私营 金融科技
              更透明的边界，但也意味着一旦恶化，就应拿硬数字而不是叙事来判断。依赖定期贷款、NCD 和机构资本的贷款机构，不能假设融资在一个信贷周期里始终能以同样价格获得。因此，承销时，盈利韧性而不只是 AUM
              增长，才是关键风险视角。
