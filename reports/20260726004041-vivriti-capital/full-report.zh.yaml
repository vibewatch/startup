      - number: '7.4'
        title: 缓释因素与推翻投资论点的触发项
        blocks:
          - type: paragraph
            body: >-
              缓释因素真实存在。CARE 和 ICRA 仍把该业务评在投资级区间；资本充足率保持在约 20-21%；贷款方基础多元；ADB
              参与气候债券，也释放了对治理和资金用途控制的外部舒适度信号。但这些是缓释，不是免疫。委员会应盯住一小组 推翻投资论点的触发项：GNPA
              或第三阶段指标持续漂移到评级阈值之上、联合放贷中伙伴驱动的亏损尖峰、资本充足率恶化、分拆后报告模糊而不是澄清 NBFC
              经济性，或平台扩展到咨询和技术叙事后仍无法给出更清晰的集中度披露。另一个要点是顺序：贷款机构可以在评级和资本上仍然保持正常，但同时在伙伴 批次
              或披露质量中积累脆弱性。因此，投资人需要按月而不是按年监控第三阶段趋势、伙伴行为和报告连续性。Vivriti 今天看起来可管理，但公开层面还没有完成去风险。
