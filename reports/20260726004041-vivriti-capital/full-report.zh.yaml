  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 可观察锚点与当前判断
        blocks:
          - type: paragraph
            body: >-
              最好的公开定价锚点是 Vivriti 2023 年末 Series D / 成长轮 估值，而不是任何干净的公开倍数。多家二级来源把该轮估值放在约 $1.7 billion，2025 年 ASK Private
              Wealth / Hurun 报道则在其报告口径中把 Vivriti 列为当年印度独角兽，估值约 $1.3
              billion。这个区间很重要。它告诉投资人，公司已经按规模化赢家定价；但也说明，即便公开参考点也没有完全收敛到一个数字。运营证据足以让估值讨论保持严肃：FY25 集团营收、PAT 和 AUM 已经足够大，把
              Vivriti 从「有前景的金融科技」桶里推到「资产负债表质量很关键的信贷平台」桶里。因此，建议不能是泛泛质量分。价格纪律在这里非常重要，必须对价格和披露敏感。基于今天的公开证据，正确判断是暂时跟踪，并保持
              公允立场。
