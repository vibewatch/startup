      - number: '1.4'
        title: 里程碑、规模信号与开放问题
        blocks:
          - type: paragraph
            body: >-
              若干里程碑信号足够强，可以带入后续章节。官方 FY25 评论和 ADB 气候金融文件支持这样一家多产品贷款机构：拥有 495+ 企业客户，覆盖 55+ 行业和 20+ 邦；通过联合放贷渠道触达超过 100
              万零售借款人；并通过供应链核心企业获客 975+ MSME。评级报告补充称，截至 2025 年末，公司拥有超过 50
              家贷款方关系，贷款账簿在定期贷款、联合放贷和专项结构之间日益多元。与此同时，概览章节应保留开放问题，而不是抹平。Tracxn、Company Check
              和其他追踪器的公开员工数差异很大，说明集团、法律实体和机构层级口径可能不同。治理来源也在完整董事会名单上不一致，因为部分官方披露只能访问到局部。最后，2026 年重组让向后对比更难：部分数字指向旧的
              Vivriti Capital 结构，另一些指向重组后的 Vivriti Next 集团。这些保留意见不削弱核心投资故事，但确实意味着后续章节必须区分集团、NBFC 和重组后指标，而不能把它们视为同一口径。
