      - number: '1.3'
        title: 资本基础与财务规模
        blocks:
          - type: paragraph
            body: >-
              最强的已验证公司规模事实来自官方 FY25 披露、ADB 材料和评级报告。Vivriti Group 披露 FY25 AUM 为 Rs 13,181 crore、营收 Rs 1,429.1 crore、PAT
              Rs 219.2 crore，同时核心毛 NPA 保持在 0.24%，资本充足率约 21%。在受监管实体层面，CARE 和 ICRA 显示，单体 NBFC 在 FY25 期末总收入约 Rs 1,364
              crore、税后利润约 Rs 220 crore、第三阶段资产约 1.89%、CAR 为 21.02%。这两个视角不能互换：集团披露包括 Vivriti Asset
              Management，而评级报告隔离了贷款实体。融资历史同样分层。Tracxn 和评级报告显示，在 2026 年创始人注资前，累计股权融资约 Rs 1,399-1,400 crore，Creation
              Investments、Lightrock 和 TVS Capital Funds 是反复出现的支持方。最有支撑的一级股权估值标记是 2023 年 11 月 Series D 轮，Tracxn 记录其投后估值为
              $1.7 billion。2024 年 ADB 气候债券新增了 $25 million 债务资本，绑定绿色金融投放，而不是股权重估。
