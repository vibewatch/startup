- id: architecture-and-operating-workflow
  title: Architecture and operating workflow
  body: Databricks gives the clearest product-tech evidence in the run. It describes Vivriti as a high-volume B2B2C lending model where milliseconds matter and where real-time API calls power identification, underwriting, fraud detection, reporting, and partner reconciliation. That is not generic analytics language; it is an operating-model statement. The same source shows a migration away from Redshift and an in-house open-source stack toward governed tables, lineage, time travel, Databricks SQL, and API-based ingestion for automated checks and reporting. Leegality and ICRA complement that architecture story by showing digital execution in the borrower document flow and fully digital collections in at least one securitised pool. Put together, the accessible record supports a connected workflow from origination through documentation, disbursal, analytics, and servicing. It does not reveal every component, but it does show that Vivriti’s lending operations are genuinely software-mediated.
    The available evidence therefore supports genuine production infrastructure with meaningful workflow consequences for borrowers, partners, and regulators.
