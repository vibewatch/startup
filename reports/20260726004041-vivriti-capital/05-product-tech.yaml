chapter:
  number: 5
  title: Product & Technology
  summary: Vivriti’s product is best understood as a tech-enabled regulated lending workflow spanning origination, underwriting, digital documentation, disbursal, reporting, and collections across enterprise, co-lending, supply-chain, and climate-finance products. The clearest architecture evidence comes from Databricks, which documents a high-volume, API-driven lending environment with governed analytics, lineage, and real-time checks, while Leegality and ICRA show digitally executed documentation and collections. The product-tech posture looks meaningfully real, but official visibility is still limited because many Vivriti-controlled product, careers, and case-study pages returned CloudFront 403 during this run.
sections:
- id: product-stack-and-customer-jobs
  title: Product stack and customer jobs
  body: 'Vivriti does not look like a single-loan product in the public file. Instead it looks like a stack of debt products and delivery workflows aimed at different financing jobs: direct enterprise lending, co-lending, supply-chain and receivables finance, securitisation-linked pools, and climate-finance use cases. PrivateCircle and other profiles reinforce that breadth by describing curated products, specialized technology, and multi-level underwriting, while ADB’s climate-finance project proves that the same lender can configure credit products for solar, wind, EV, and waste-management borrowers. The right customer-workflow framing is therefore not “apply for a loan online.” It is “structure, underwrite, document, disburse, monitor, and collect on complex debt products for underbanked mid-market and partner-originated borrowers.” That is a much more operational product definition than the one used by standardized unsecured-loan apps.'
