company:
  name: Vivriti Capital
chapter:
  number: 3
  title: Competitors
  summary: Vivriti Capital competes in a crowded but differentiated slice of Indian credit where the closest peers are other mid-market or institutional-credit specialists such as Northern Arc, while the largest volume pressure comes from broader MSME and unsecured-business-loan incumbents like Tata Capital, Hero FinCorp, UGRO Capital, and Lendingkart. Public evidence suggests Vivriti’s best defense is not lowest advertised price but a narrower competency in structured debt, receivables, supply-chain, and capital-partner access. That edge looks real, but it is conditional because borrowers can multi-home, larger lenders disclose faster standardized credit promises, and private-credit capital is expanding into the same opportunity set.
sections:
- id: landscape-and-peer-classes
  title: Landscape and peer classes
  body: Vivriti should not be benchmarked only against one digital lender or one private-credit fund. The competitive field breaks into at least four classes. First are direct mid-market and structured-credit peers such as Northern Arc that also speak the language of working capital, capex, NCDs, trade receivables, and lifecycle financing for underbanked companies. Second are broader MSME and business-loan incumbents like Tata Capital, Hero FinCorp, UGRO Capital, and Lendingkart that may not structure the same way but can still intercept many borrowers with simpler, faster credit products. Third are banks and supply-chain-finance incumbents such as Axis Bank that remain the status quo for corporate borrowers with enough collateral, documentation, or anchor relationships. Fourth are adjacent capital-market or marketplace players such as Yubi, which are relevant to debt distribution and borrower access even if they are not like-for-like balance-sheet lenders. This matters because Vivriti is
    not trying to outcompete one reference app. It is trying to win a narrower class of financing problems that sit between standardized MSME credit and the large-company bank-and-bond lane.
