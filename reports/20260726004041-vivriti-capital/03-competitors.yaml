    - Retained official proof is stronger on UX than on complex structures
  - - Lendingkart
    - Unsecured SME lender
    - Public unsecured-loan proposition
    - Smaller businesses seeking quick unsecured credit
    - No collateral and simplified onboarding
    - Less evidence of bespoke structured-debt capability
  - - Tata Capital
    - Incumbent NBFC substitute
    - Large branded NBFC with published rates and fees
    - SMEs and businesses seeking standardized loans
    - Transparent pricing and high-trust brand
    - More standardized product framing than Vivriti
  - - Hero FinCorp
    - Incumbent NBFC substitute
    - 2,000+ corporate clients disclosed on about page
    - Businesses needing quick term credit
    - Scale, geography, and 48-hour disbursal message
    - Broader credit posture may be less tailored to structured mid-market cases
  - - Axis Bank / banks
    - Status quo incumbent
    - Corporate-banking and supply-chain finance depth
    - Borrowers able to fit bank processes
    - Balance-sheet cost and trust
    - Slower or less flexible for bespoke mid-market deals
  - - Yubi
    - Adjacent platform
    - Separate platform surface after spinout
    - Debt distribution and marketplace participants
    - Capital-market adjacency and borrower/investor matching
    - Not a like-for-like balance-sheet lender to compare one-for-one
  notes: The profile table separates direct structured-credit peers from incumbents and adjacents so that substitute pressure is not mistaken for perfect product parity.
