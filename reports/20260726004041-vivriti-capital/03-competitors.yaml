  - - Northern Arc
    - Direct structured-credit peer
    - Rs 6,500 cr+ commitments; 100+ portfolio companies; 300+ originator partners
    - Mid-market companies and under-served credit channels
    - Working capital, capex, NCDs, receivables, syndication, fund management
