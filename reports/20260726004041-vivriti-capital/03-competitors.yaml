- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Structured-credit expertise
    - Large incumbents and private-credit funds also expand into bespoke deals
    - High
    - Test repeat-borrower share and win rates in complex transactions
  - - Digital origination and service responsiveness
    - UGRO, Lendingkart, Hero, and Tata can copy fast-digital loan UX
    - Medium
    - Ask what proportion of value creation comes from structure rather than onboarding UX
  - - Capital-partner and syndication access
    - Better-capitalized peers may offer similar distribution plus lower funding cost
    - High
    - Review lender and investor network depth by deal size and sector
  - - Mid-market brand and niche focus
    - Borrowers can multi-home and do not face high switching costs
    - High
    - Measure cross-sell, repeat financing, and relationship tenure
  - - Private disclosure flexibility
    - Low public transparency can weaken trust versus incumbents with clear tariffs or broader governance surfaces
    - Medium
    - Collect realized pricing, complaints, and response-time evidence before treating disclosure opacity as harmless
  notes: The biggest durability questions are about funding access and repeat relationship depth, not brochure-level feature comparison.
