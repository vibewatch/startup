  - id: EGP001
    question: What are Vivriti’s actual competitive win rates against Northern Arc, Tata Capital, and digital MSME lenders by product and ticket size?
    impact: Without this, the moat claim remains qualitative and could overstate repeat-borrower strength.
    diligenceAction: Request pipeline, win/loss, and repeat-borrower data segmented by product, sector, and ticket size.
    relatedQuestionRefs:
    - QP001
    - QP019
    - QP025
    relatedTableRefs:
    - TP001
    - TP004
    priority: high
  - id: EGP002
    question: How does realized pricing compare with public or relationship-led alternatives across banks, NBFCs, and private-credit funds?
    impact: Pricing discipline affects both market share and unit economics, but public tariff transparency is weak in the structured-credit cohort.
    diligenceAction: Request recent deal-level pricing, fees, collateral terms, and turnaround benchmarks versus top competitors.
    relatedQuestionRefs:
    - QP013
    - QP014
    - QP025
    relatedTableRefs:
    - TP003
    priority: high
