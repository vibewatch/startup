- id: product-pricing-and-substitute-logic
  title: Product, pricing, and substitute logic
  body: 'The product comparison is less about who can advertise the lowest simple-business-loan price and more about who can solve complex borrower situations. Northern Arc’s official mid-market page explicitly lists term loans, structured working-capital lines, NCDs, and receivables investment, making it a close product analogue to Vivriti. By contrast, Lendingkart, Tata Capital, and Hero FinCorp foreground unsecured-loan size, speed, and minimal paperwork. UGRO emphasizes customer experience and digital convenience. Those are not trivial substitutes: a borrower may choose them whenever the financing need is standardized enough to fit their credit box. Pricing transparency also differs sharply across the field. Tata Capital publishes rates, fees, and prepayment terms; Hero FinCorp and Lendingkart publish rapid disbursal and low-friction onboarding claims; Vivriti’s public file is much thinner on list pricing. That suggests competition often turns on relationship pricing, certainty of execution,
    and structure quality rather than on a visible APR table.'
