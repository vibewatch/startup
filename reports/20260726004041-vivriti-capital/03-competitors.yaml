- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Company
  - Public pricing / package signal
  - What is disclosed
  - Implication
  rows:
  - - Vivriti Capital
    - Relationship-led, largely undisclosed
    - Public pages and profiles describe product set more than tariff schedule
    - Competes on structure and fit, but public price advantage is hard to prove
  - - Northern Arc
    - Relationship-led, largely undisclosed
    - Official page lists structures and borrower types, not list rates
    - Competes on flexible capital and investor network rather than visible APR
  - - Lendingkart
    - Standardized unsecured package
    - No collateral, up to Rs 50 lakh, digital KYC emphasis
    - Strong for smaller-ticket quick-credit substitution
  - - Tata Capital
    - Transparent standardized package
    - Up to Rs 90 lakh, starting rate 12%, published fees and penalties
    - Incumbent substitute with credible tariff transparency
  - - Hero FinCorp
    - Fast disbursal standardized package
    - 48-hour disbursal, collateral-free SME framing, competitive-rate messaging
    - Substitute when borrowers prioritize speed over bespoke structure
  - - UGRO Capital
    - Service and UX-led package
    - Testimonials stress digital convenience and support more than tariffs
    - Competes on customer experience in MSME lending
  - - Banks
    - Relationship priced
    - Often product-specific and negotiated
    - Win where cost of capital and bank trust dominate
  notes: For most enterprise lenders, package structure and approval speed are more observable than realized price.
