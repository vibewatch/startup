tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale signal
  - Revenue / strategic value
  - Gap
  rows:
  - - Mid-market corporates
    - Borrower CFO / promoter is buyer and payer; ops team is end-user of capital
    - Growth, working capital, structured debt, refinancing, project finance
    - 475+ to 550+ enterprises across 50+ / 55+ sectors and 20+ states in 2025-2026 disclosures
    - Core direct-lending franchise and the clearest proof of brand-market fit
    - No public split of repeat vs first-time borrowers
  - - Smaller NBFCs and financial institutions
    - Treasury / management team is buyer and payer
    - Wholesale debt, securitisation-linked structures, financing lines
    - ICRA and early-history sources show the segment as a foundation customer class
    - Helped Vivriti scale before the broader mid-market pivot
    - Current segment share is not separately disclosed in detail
  - - Retail borrowers via co-lending partners
    - Partner lender sources borrower demand; end borrower repays; Vivriti co-funds
    - Consumer and micro-business loans through partner NBFCs and fintechs
    - 1 million+ retail borrowers through 35+ partners in 2024; 14 lakh+ retail clients through co-lending by Dec 2025 in ADB/CARE lenses
    - Expands reach beyond direct origination and adds granularity to the book
    - Public sources do not disclose repeat-borrowing or delinquencies by partner cohort
  - - MSMEs through supply-chain anchors
    - Anchors and ecosystem operators coordinate usage; suppliers / distributors use liquidity
    - Vendor factoring, receivables, trade flow support
    - 975+ MSMEs through 45+ supply-chain anchors in ADB coverage; named Source.One deal supports live usage
    - Creates workflow-backed customer acquisition outside plain term lending
    - No public top-anchor concentration table
  - - Climate-finance borrowers
    - Borrower management teams are buyers and payers
    - EV, charging, battery swapping, solar, wind, waste-management financing
    - ADB climate bond earmarks at least 30% to EV financing and names climate sectors
    - Supports thematic expansion and differentiated capital access
    - No borrower roster or segment loss history disclosed
  notes: Customer categories reflect how Vivriti acquires and services financing demand rather than forcing a single-logo SaaS taxonomy.
