- id: TU003
  title: Named customer proof table
  columns:
  - Customer
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome
  - Limitation
  rows:
  - - Source.One
    - Supply-chain platform / polymer trade ecosystem
    - Rs 40 crore supply-chain finance facility supporting Source.One procurement and liquidity flows
    - Live production
    - NRI News says the facility supports 6,000+ buyers and 300+ suppliers and improves liquidity across the network
