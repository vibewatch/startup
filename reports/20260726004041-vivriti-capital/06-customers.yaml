- id: TU004
  title: Retention / repeat usage / satisfaction table
  columns:
  - Metric
  - Public value
  - Segment
  - Confidence
  - Diligence ask
  rows:
  - - Net revenue retention / borrower expansion rate
    - null
    - All direct-borrower segments
    - Low
    - Request cohort-level repeat-borrowing and wallet-share data by enterprise, co-lending, and supply-chain segments
  - - Gross retention / logo churn
    - null
    - Enterprise borrowers and partners
    - Low
    - Request annual borrower churn, prepayment, and refinance-out metrics
  - - Contract length / renewal cadence
    - null
    - Structured debt and partner programs
    - Low
    - Request average tenor, renewal rates, and follow-on facility conversion rates
  - - Credit-quality proxy
    - GNPA 0.24% group March 2025; gross stage-3 / GNPA 1.89%-2.44% in CARE standalone lenses
    - Book-level proxy, not retention data
    - Medium
    - Separate asset quality from customer satisfaction and repeat intent
  - - Partner-network durability proxy
    - 35+ to 45+ retail partners; 45+ lender relationships
    - Ecosystem proxy
    - Medium
    - Request active-partner retention, onboarding pace, and inactive-partner counts
  - - Named outcome proxy
    - Source.One / Care.fi provide workflow and scale outcomes
    - Borrower case-study proxy
    - Medium
    - Ask for repeat disbursal history and post-deal performance by named borrower
  notes: Null means the reviewed source set does not disclose the metric. Proxy rows help frame diligence but are not substitutes for true retention reporting.
