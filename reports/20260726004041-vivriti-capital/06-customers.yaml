- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Add products around existing mid-market enterprise relationships
    - Public sources do not disclose top-borrower exposure or follow-on share
    - Upside from cross-sell is real but difficult to underwrite
    - Request top-20 borrower exposure, repeat facility rates, and product penetration by cohort
  - - Scale co-lending with more partners and end-borrowers
    - Partner concentration and first-loss / regulation sensitivity can transmit into customer economics
    - Can accelerate reach but also import underwriting and compliance volatility
    - Request partner concentration, FLDG exposure, and vintage performance by partner
  - - Grow supply-chain anchors and MSME access
    - Anchor concentration and sector concentration are not disclosed publicly
    - Strong workflow moat if diversified; fragility if a few anchors dominate
    - Request anchor-level exposure, sectors, and delinquency trends
  - - Expand climate-finance book
    - Public borrower list and performance by climate sub-sector are absent
    - Could improve differentiation and funding access
    - Request borrower roster, use-of-proceeds verification, and climate-book loss history
  - - Broaden into advisory / tech-led solutions via Vivriti Next
    - Cross-sell thesis may outrun current proof of monetization
    - Could deepen customer lifetime value beyond lending
    - Request revenue contribution and client adoption of non-lending services
  notes: The chapter can see credible expansion loops, but not enough public evidence to clear concentration and attach-rate risks.
