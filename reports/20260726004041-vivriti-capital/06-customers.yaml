company:
  name: Vivriti Capital
chapter:
  number: 6
  title: Customers
  summary: Vivriti’s customer proof is strongest on breadth of mid-market borrower coverage and a small number of named production financings rather than on SaaS-style retention disclosure. Across official, rating, and multilateral sources, the customer base spans mid-market corporates, NBFCs, retail borrowers through co-lending partners, and MSMEs reached via supply-chain anchors, with scale lenses ranging from 400+ to 550+ enterprise clients, 20+ states, 35-45+ retail partners, and 975+ MSMEs sourced through 45+ anchors. The clearest named borrower proofs in this run are Source.One, Infra.Market, and Care.fi. The biggest open gaps are customer concentration, renewal durability, and exact cohort economics by segment.
sections:
- id: customer-base-and-segmentation
  title: Customer base and segmentation
  body: >-
    Vivriti is not serving one customer type. The accessible record shows four economically
    different customer groups: mid-market corporates borrowing directly from the NBFC or
    group, smaller financial institutions and NBFCs funded through enterprise-style debt,
    retail borrowers reached through co-lending partners, and MSMEs / distributors funded
    through supply-chain structures. This matters because adoption proof has to be read
    segment by segment. CARE and ICRA anchor the lender’s direct book in enterprise,
    co-lending, and supply-chain products, while ADB and climate-bond coverage widen the
    lens to climate-finance borrowers in EV, renewable, and waste-management sectors. The
    strongest scale statements come from Vivriti’s own FY25 and 2026 disclosures, which
    variously cite 475+, 495+, and 550+ mid-market enterprises across 50+ or 55+ sectors
    and 20+ states. Those figures are directionally consistent about breadth, but they are
    not one harmonized denominator and should not be treated as a single point estimate.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
  tableRefs:
