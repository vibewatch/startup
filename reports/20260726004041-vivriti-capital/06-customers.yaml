  - TU002
  figureRefs:
  - FU001
- id: adoption-trajectory-and-named-proof
  title: Adoption trajectory and named proof
  body: >-
    The adoption story is strongest where Vivriti’s products are embedded in real operating
    workflows rather than described in generic brand language. Rating reports show a large
    book split across enterprise loans, co-lending, supply-chain finance, direct assignment,
    leasing, and factoring, suggesting that customer acquisition is happening across multiple
    credit jobs rather than a single underwriting engine. Named proofs are limited but
    meaningful. Source.One’s 2024 supply-chain finance announcement describes a Rs 40 crore
    facility designed to support 6,000+ buyers and 300+ suppliers in polymer trade.
    BusinessLine’s Infra.Market coverage shows Vivriti participating in a Rs 150 crore debt
    round alongside other lenders through non-convertible debentures. In healthcare fintech,
    two March 2025 reports say Care.fi raised Rs 7.5 crore in debt from Vivriti to expand
    RevNow, with the borrower claiming 300+ hospitals, 50,000+ claims audited, and Rs 800
    crore of claims processed. These are not exhaustive customer disclosures, but they do
    prove live deployment with real borrowers and identifiable use cases.
  claimRefs:
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  tableRefs:
  - TU003
  figureRefs:
  - FU002
  - FU003
- id: durability-and-retention-visibility
  title: Durability and retention visibility
  body: >-
    Public durability evidence is much weaker than customer-count evidence. Vivriti does not
    disclose NRR, GRR, logo churn, contract length, renewal rates, or cohort curves in any
    accessible source reviewed in this run. The best available proxies are indirect. CARE
    describes a diversified loan portfolio and over 45 lender relationships on the liability
    side, but that says more about funding resilience than borrower retention. Low GNPA
    figures are helpful, yet they measure credit quality rather than explicit renewal or
    repeat-borrowing behavior. Some customer durability can be inferred from the fact that
    Vivriti has expanded from pure NBFC / financial-sector exposure into mid-market
    corporates, co-lending, supply-chain, and climate-finance segments over several years,
    but public sources still do not identify how many borrowers return for a second facility,
    refinance internally, or expand from one product family into another. Investors should
    therefore treat durability as plausible but under-disclosed.
  claimRefs:
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
  - CU030
  - CU031
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-loops-and-concentration-risk
  title: Expansion loops and concentration risk
  body: >-
    Vivriti’s expansion path appears to come from adjacent financing jobs around an existing
    customer or partner relationship: a mid-market corporate can move from term lending into
    supply-chain or receivables structures, a co-lending partner can add more end-borrowers
    and loan products, and climate-finance mandates can introduce new borrower cohorts
    without changing the overall underwriting franchise. Official 2026 language goes even
    further, saying clients increasingly need capital-market access, balance-sheet
    structuring, ESG support, and technology-led efficiency, which is why Vivriti Next was
    launched around the broader group. That creates upside for land-and-expand, but it also
    raises concentration and execution questions. Public evidence still does not disclose
    top-borrower concentration, top-anchor concentration, product attach rates, or
    contribution by the largest co-lending partners. CARE explicitly warns about
    concentration risk and a sizeable unsecured-loan share, and the customer chapter cannot
    close that gap from public evidence alone. The result is a customer base that looks real
    and broad, but still harder to underwrite for concentration and repeat-usage quality than
    the headline client counts suggest.
  claimRefs:
  - CU032
  - CU033
  - CU034
  - CU035
  - CU036
  - CU037
