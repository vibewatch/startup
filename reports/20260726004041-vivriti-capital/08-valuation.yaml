  claims:
  - {id: CV001, statement: 'The cleanest public valuation anchor is the late-2023 round rather than any synchronized public-peer multiple.', type: inferred, topic: anchor, sourceRefs: [SV001, SV003, SV004], confidence: medium, freshness: current, answersQuestionRefs: [QV001, QV002]}
  - {id: CV002, statement: 'Public secondary sources place Vivriti’s late-2023 valuation around $1.7 billion.', type: third-party-reported, topic: anchor, sourceRefs: [SV003, SV004], confidence: medium, freshness: recent, answersQuestionRefs: [QV002]}
  - {id: CV003, statement: 'ASK Private Wealth / Hurun 2025 coverage provides an additional public reference point around $1.3 billion.', type: third-party-reported, topic: anchor, sourceRefs: [SV002, SV003], confidence: medium, freshness: recent, answersQuestionRefs: [QV003]}
  - {id: CV004, statement: 'The $1.3 billion and $1.7 billion references do not fully converge, so valuation should be treated as a range problem.', type: inferred, topic: anchor, sourceRefs: [SV002, SV003, SV004], confidence: medium, freshness: current, answersQuestionRefs: [QV004]}
  - {id: CV005, statement: 'A recommendation on Vivriti must be price-sensitive and disclosure-sensitive rather than a generic franchise-quality score.', type: inferred, topic: recommendation, sourceRefs: [SV002, SV006, SV011, SV012], confidence: medium, freshness: current, answersQuestionRefs: [QV005, QV006]}
  - {id: CV006, statement: 'Public evidence supports a track recommendation rather than buy, avoid, or research-more.', type: inferred, topic: recommendation, sourceRefs: [SV006, SV007, SV011, SV012], confidence: medium, freshness: current, answersQuestionRefs: [QV005, QV006]}
  - {id: CV007, statement: 'The current confidence level is best set at medium because meaningful operating evidence exists but listed-like transparency does not.', type: inferred, topic: recommendation, sourceRefs: [SV006, SV010, SV028, SV029], confidence: medium, freshness: current, answersQuestionRefs: [QV005, QV025]}
  - {id: CV008, statement: 'Risk should stay high because leverage, concentration, and partner-originated exposure can reprice the story faster than growth metrics imply.', type: inferred, topic: recommendation, sourceRefs: [SV011, SV012, SV013], confidence: medium, freshness: current, answersQuestionRefs: [QV006, QV013]}
  - {id: CV009, statement: 'Valuation stance is fair rather than cheap because current public anchors already assume substantial franchise quality.', type: inferred, topic: recommendation, sourceRefs: [SV002, SV003, SV006], confidence: medium, freshness: current, answersQuestionRefs: [QV006]}
  - {id: CV010, statement: 'The right near-term decision implication is to monitor rather than stretch above current anchors on incomplete evidence.', type: inferred, topic: recommendation, sourceRefs: [SV004, SV005, SV028], confidence: medium, freshness: current, answersQuestionRefs: [QV005, QV030]}
  - {id: CV011, statement: 'FY25 group results show meaningful profitable scale with revenue of ₹1,429.1 crore, PAT of ₹219.2 crore, and AUM of ₹13,181 crore.', type: company-claimed, topic: operating-proof, sourceRefs: [SV006, SV027], confidence: high, freshness: recent, answersQuestionRefs: [QV007, QV008]}
  - {id: CV012, statement: 'CARE’s April 2026 lens shows VCL AUM of ₹10,848 crore and 300+ enterprise clients plus 14 lakh+ retail clients as of December 31 2025.', type: third-party-reported, topic: operating-proof, sourceRefs: [SV007, SV010], confidence: high, freshness: recent, answersQuestionRefs: [QV008, QV009]}
  - {id: CV013, statement: 'Mint and TOI show the broader group still expanding into 2026, with roughly ₹15,333 crore AUM by December 2025.', type: third-party-reported, topic: operating-proof, sourceRefs: [SV008, SV009], confidence: high, freshness: recent, answersQuestionRefs: [QV009]}
  - {id: CV014, statement: 'The company has moved beyond startup-scale into a late-growth credit platform whose balance-sheet quality matters to valuation.', type: inferred, topic: operating-proof, sourceRefs: [SV006, SV007, SV010], confidence: medium, freshness: current, answersQuestionRefs: [QV007, QV008]}
  - {id: CV015, statement: 'Customer and product proof spans direct enterprise lending, co-lending, supply-chain finance, and climate-linked debt.', type: inferred, topic: franchise, sourceRefs: [SV006, SV015, SV021, SV022], confidence: medium, freshness: current, answersQuestionRefs: [QV010]}
  - {id: CV016, statement: 'India’s mid-market credit gap remains a credible structural support for the fair case.', type: inferred, topic: market, sourceRefs: [SV006, SV030], confidence: medium, freshness: current, answersQuestionRefs: [QV010]}
  - {id: CV017, statement: 'Investor quality is meaningful because the company is backed by Creation, Lightrock, TVS Capital, and external institutional debt providers.', type: inferred, topic: investor-quality, sourceRefs: [SV001, SV004, SV021, SV022, SV031], confidence: medium, freshness: current, answersQuestionRefs: [QV011]}
  - {id: CV018, statement: 'ADB climate-bond participation is an external confidence signal, though only for part of the broader group story.', type: inferred, topic: investor-quality, sourceRefs: [SV021, SV022, SV023], confidence: medium, freshness: current, answersQuestionRefs: [QV011]}
  - {id: CV019, statement: 'Northern Arc is a relevant structural comparable because it provides a public-market reference for Indian institutional credit models.', type: inferred, topic: comparables, sourceRefs: [SV016, SV017], confidence: medium, freshness: current, answersQuestionRefs: [QV019, QV020]}
  - {id: CV020, statement: 'UGRO is a relevant public-market lender comp because it serves underserved business borrowers, though its segment mix differs.', type: inferred, topic: comparables, sourceRefs: [SV018, SV019], confidence: medium, freshness: current, answersQuestionRefs: [QV019, QV021]}
  - {id: CV021, statement: 'Yubi is only an adjacent comparable because it is not a like-for-like balance-sheet lender in the same sense as Vivriti.', type: inferred, topic: comparables, sourceRefs: [SV020, SV030], confidence: medium, freshness: current, answersQuestionRefs: [QV019, QV022]}
  - {id: CV022, statement: 'The main blocker to a buy call is not business existence but the combination of leverage, concentration, and incomplete disclosure.', type: inferred, topic: anti-thesis, sourceRefs: [SV011, SV012, SV013, SV028], confidence: medium, freshness: current, answersQuestionRefs: [QV012]}
  - {id: CV023, statement: 'A leveraged NBFC should not trade on narrative alone when public segment and concentration data remain incomplete.', type: inferred, topic: anti-thesis, sourceRefs: [SV010, SV011, SV029], confidence: medium, freshness: current, answersQuestionRefs: [QV012, QV013]}
  - {id: CV024, statement: 'Post-demerger reporting opacity is a genuine valuation discount factor until entity-level economics are reconciled cleanly.', type: inferred, topic: anti-thesis, sourceRefs: [SV007, SV010, SV028], confidence: medium, freshness: current, answersQuestionRefs: [QV014, QV023]}
  - {id: CV025, statement: 'Rating-agency downside triggers such as GNPA and gearing thresholds matter directly to valuation confidence.', type: inferred, topic: anti-thesis, sourceRefs: [SV011, SV012], confidence: medium, freshness: current, answersQuestionRefs: [QV015]}
  - {id: CV026, statement: 'The unicorn label should be read as evidence of market recognition, not as proof that the current mark is still cheap.', type: inferred, topic: anti-thesis, sourceRefs: [SV002, SV005], confidence: medium, freshness: current, answersQuestionRefs: [QV026, QV027]}
  - {id: CV027, statement: 'Unlisted-share pages are more useful as sentiment checks than as institutional valuation evidence.', type: inferred, topic: anti-thesis, sourceRefs: [SV005, SV029], confidence: medium, freshness: current, answersQuestionRefs: [QV027]}
  - {id: CV028, statement: 'Current public disclosures are stronger than early-stage private-company norms but weaker than listed peer investor-relations standards.', type: inferred, topic: anti-thesis, sourceRefs: [SV010, SV028, SV029], confidence: medium, freshness: current, answersQuestionRefs: [QV023, QV028]}
  - {id: CV029, statement: 'Customer breadth is real, but public repeat-borrowing and concentration proof remains too thin to justify a premium narrative by itself.', type: inferred, topic: anti-thesis, sourceRefs: [SV007, SV015, SV030], confidence: medium, freshness: current, answersQuestionRefs: [QV010, QV012]}
  - {id: CV030, statement: 'The most decision-useful diligence asks are entity reconciliation, exposure concentration, product economics, and round-term detail.', type: inferred, topic: diligence, sourceRefs: [SV010, SV028, SV029], confidence: medium, freshness: current, answersQuestionRefs: [QV029]}
  - {id: CV031, statement: 'Public-market readiness still needs clearer governance and reporting cadence before a strong late-stage premium is easy to defend.', type: inferred, topic: diligence, sourceRefs: [SV008, SV028, SV029], confidence: medium, freshness: current, answersQuestionRefs: [QV028, QV029]}
  - {id: CV032, statement: 'The most defensible current base range is approximately $1.3-1.7 billion, bounded by the Hurun reference and the prior round mark.', type: inferred, topic: range, sourceRefs: [SV002, SV003], confidence: medium, freshness: current, answersQuestionRefs: [QV016]}
  - {id: CV033, statement: 'A bull case above the prior round requires better disclosure plus continued asset-quality and capital resilience.', type: inferred, topic: range, sourceRefs: [SV011, SV012, SV028], confidence: medium, freshness: current, answersQuestionRefs: [QV017]}
  - {id: CV034, statement: 'A bear case below the current public anchors follows if asset quality, concentration, or post-demerger clarity deteriorate.', type: inferred, topic: range, sourceRefs: [SV011, SV012, SV013], confidence: medium, freshness: current, answersQuestionRefs: [QV018]}
  - {id: CV035, statement: 'Because the public file does not support a clean peer-multiple pack, scenario ranges are safer than precision valuation claims.', type: inferred, topic: range, sourceRefs: [SV016, SV018, SV020], confidence: medium, freshness: current, answersQuestionRefs: [QV016, QV019]}
  - {id: CV036, statement: 'The comparable set is structural and qualitative rather than numeric because the reviewed file lacks synchronized public-market multiple data.', type: inferred, topic: comparables, sourceRefs: [SV016, SV018, SV020], confidence: medium, freshness: current, answersQuestionRefs: [QV019]}
  - {id: CV037, statement: 'Concentration and funding-cost surprises are more likely than market-size disappointment to move the valuation down quickly.', type: inferred, topic: range, sourceRefs: [SV011, SV012, SV013], confidence: medium, freshness: current, answersQuestionRefs: [QV018]}
  - {id: CV038, statement: 'Debt-investor filings strengthen credibility but do not fully solve the private-company transparency discount.', type: inferred, topic: filing, sourceRefs: [SV010, SV028], confidence: medium, freshness: current, answersQuestionRefs: [QV023, QV028]}
  - {id: CV039, statement: 'Failure to reconcile VCL and HAC clearly should itself trigger a lower confidence multiple.', type: inferred, topic: filing, sourceRefs: [SV007, SV010, SV028], confidence: medium, freshness: current, answersQuestionRefs: [QV014, QV024]}
  - {id: CV040, statement: 'A premium underwriting decision needs better proof on repeat borrowing, top exposures, and product-level margin quality.', type: inferred, topic: diligence, sourceRefs: [SV007, SV011, SV029], confidence: medium, freshness: current, answersQuestionRefs: [QV024, QV029]}
  - {id: CV041, statement: 'Overall, Vivriti looks like a real scaled franchise priced in a fair but still risk-sensitive late-stage band.', type: inferred, topic: conclusion, sourceRefs: [SV006, SV011, SV028, SV030], confidence: medium, freshness: current, answersQuestionRefs: [QV025, QV030]}
  evidenceGaps:
  - id: EGV001
    question: What were the exact economic terms of the late-2023 round, including preferences, secondary mix, and liquidation rights?
    impact: Headline valuation may overstate or understate true economic entry.
    diligenceAction: Request full financing documents and cap-table waterfall.
    relatedQuestionRefs: [QV001, QV002, QV024]
    relatedTableRefs: [TV001, TV003, TV004, TV006]
    priority: high
  - id: EGV002
    question: How concentrated are the current exposures and how much repeat borrowing exists by cohort?
    impact: Range confidence is limited until breadth converts into measurable durability.
    diligenceAction: Request top exposure tables and cohort repeat-borrowing metrics.
    relatedQuestionRefs: [QV010, QV013, QV029]
    relatedTableRefs: [TV002, TV005, TV006]
    priority: high
  - id: EGV003
    question: How should VCL historicals be reconciled to HAC and the broader Vivriti Next structure?
    impact: Without this, investors may anchor to numbers with inconsistent scope.
    diligenceAction: Request management reconciliation from pre-scheme VCL to post-scheme entities.
    relatedQuestionRefs: [QV014, QV023, QV028]
    relatedTableRefs: [TV001, TV005, TV006]
    priority: high
