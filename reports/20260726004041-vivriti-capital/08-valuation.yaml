- id: FV002
  title: Valuation sensitivity
  type: bar
  layout: wide
  summary: Sensitivity is driven more by confidence and risk-premium shifts than by tiny moves in headline scale.
  data:
    items:
    - {label: Better disclosure and concentration clarity, value: 3, unit: directional uplift, detail: Could move toward upper end of range}
    - {label: Stable asset quality and CAR, value: 2, unit: directional uplift, detail: Supports base-to-bull transition}
    - {label: Funding-cost compression, value: 1, unit: directional uplift, detail: Helps equity economics}
    - {label: Higher partner-vintage losses, value: -3, unit: directional drag, detail: Pushes valuation toward bear case}
    - {label: Post-demerger opacity, value: -2, unit: directional drag, detail: Reduces confidence multiple}
    - {label: Concentration surprise, value: -3, unit: directional drag, detail: Forces wider discount}
  claimRefs: [CV016, CV024, CV027, CV033, CV037]
- id: FV003
  title: Valuation / return range
  type: range
  layout: standard
  summary: The range view centers on current public anchors rather than on an overfit peer-multiple model.
  data:
    items:
    - {label: Bear case, low: 1000, mid: 1200, high: 1300, unit: USD M, detail: Concentration or credit-quality disappointment}
    - {label: Base case, low: 1300, mid: 1500, high: 1700, unit: USD M, detail: Current public evidence band}
    - {label: Bull case, low: 1700, mid: 1850, high: 2100, unit: USD M, detail: Better disclosure and resilient economics}
  approximationNotes: Ranges are scenario anchors, not a discounted-cash-flow claim.
  claimRefs: [CV002, CV003, CV032, CV033, CV034]
