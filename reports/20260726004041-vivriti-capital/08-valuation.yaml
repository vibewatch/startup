company:
  name: Vivriti Capital
chapter:
  number: 8
  title: Valuation
  summary: The cleanest public anchor for Vivriti is the late-2023 growth-round mark rather than a public-market comp set with full financial comparability. Public evidence since then supports a real and growing franchise—FY25 group revenue of ₹1,429.1 crore, PAT of ₹219.2 crore, AUM of ₹13,181 crore, and continued expansion into 2026—but the company remains a leveraged, still-partly opaque NBFC whose post-demerger reporting and customer-concentration visibility are thinner than the headline unicorn narrative implies. That supports a track recommendation with medium confidence, high risk, and a fair rather than cheap valuation stance.
sections:
- id: observable-anchor-and-current-call
  title: Observable anchor and current call
  body: >-
    The best public pricing anchor is Vivriti’s late-2023 Series D / growth-round valuation rather
    than any clean public multiple. Multiple secondary sources place that round around a $1.7
    billion valuation, while the 2025 ASK Private Wealth / Hurun coverage places Vivriti among the
    year’s Indian unicorns at roughly $1.3 billion in its report lens. That spread matters. It tells
    investors the company is already valued as a scaled winner, but also that even public reference
    points do not fully converge on one number. Operating proof is real enough to keep the valuation
    discussion serious: FY25 group revenue, PAT, and AUM are large enough to move Vivriti out of the
    “promising fintech” bucket and into the “credit platform whose balance-sheet quality matters”
    bucket. The recommendation therefore cannot be a generic quality score. Price discipline matters a great deal here. It has to be price- and
    disclosure-sensitive. On today’s public evidence, the right call is track with a fair stance for now.
  claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV008, CV009, CV010]
  tableRefs: [TV001]
  figureRefs: [FV001]
- id: what-supports-the-fair-case
  title: What supports the fair case
  body: >-
    There is enough operating evidence to keep Vivriti within a supportable private-market band.
    Group FY25 metrics show meaningful profitable scale, while CARE and 2026 press coverage show the
    NBFC book, capital adequacy, and client base continuing to expand into December 2025. The company
    also benefits from structural positioning: India’s mid-market credit gap is large, banks remain
    selective, and Vivriti has built differentiated reach across enterprise lending, co-lending,
    supply-chain finance, and climate-linked debt. Investor quality also helps. The cap table and
    partner list include Creation, Lightrock, TVS Capital, and ADB-linked financing support. Public
    financing history also shows earlier institutional validation rather than one lucky round, which
    matters when deciding whether the last mark was a one-off or part of a multi-round pattern. None
    of this proves the stock is cheap, but it does argue that the franchise deserves serious valuation
    attention rather than automatic skepticism.
  claimRefs: [CV011, CV012, CV013, CV014, CV015, CV016, CV017, CV018, CV019, CV020, CV021]
  tableRefs: [TV002, TV004]
  figureRefs: [FV002]
- id: why-the-call-does-not-upgrade
  title: Why the call does not upgrade to buy
  body: >-
    The anti-thesis is mostly about risk translation and disclosure quality, not about business
    reality. Vivriti is still a leveraged lender with concentration, unsecured co-lending exposure,
    rising funding-cost sensitivity, and only partial public visibility into borrower concentration,
    repeat usage, and post-demerger economics. Public references to $1.3 billion and $1.7 billion
    already imply that a substantial amount of future execution is priced in. That would be easier to
    accept if investors had listed-company depth on segment margins, concentration, and round terms.
    They do not. The result is a company that may be good, but not obviously mispriced upward on the
    current public file. Another way to frame the problem is that Vivriti is already beyond seed or
    Series A ambiguity but still short of public-market crispness: too large to forgive uncertainty
    casually, not transparent enough to price with listed precision. The call therefore stays at
    track rather than buy or avoid.
  claimRefs: [CV022, CV023, CV024, CV025, CV026, CV027, CV028, CV029, CV030, CV031]
  tableRefs: [TV003, TV005]
  figureRefs: [FV003]
- id: scenarios-ranges-and-diligence
  title: Scenarios, ranges, and diligence
  body: >-
    The practical output is a valuation range, not false precision. If investors treat the 2023 round
    as a credible upper-mid anchor and the 2025 unicorn-report mark as a lower public-reference
    anchor, then the most defensible base range today is approximately $1.3-1.7 billion, with the
    center of gravity closer to the higher end only if customer concentration, post-demerger clarity,
    and asset-quality durability continue to hold. A bull case above that range needs evidence that
    Vivriti Next meaningfully improves wallet share or public-market readiness without sacrificing
    risk discipline. A bear case below the low end follows if partner-vintage losses rise, capital
    adequacy weakens, or the disclosure pack remains too thin for late-stage pricing. The diligence
    work that moves the recommendation is concrete: entity reconciliation, top-exposure tables,
    product-level economics, and round-term detail. Without those, even a solid operating year can
    leave the committee paying for a story it cannot fully audit.
  claimRefs: [CV032, CV033, CV034, CV035, CV036, CV037, CV038, CV039, CV040, CV041]
  tableRefs: [TV006]
  figureRefs: [FV004]
tables:
- id: TV001
  title: Recommendation summary table
  columns: [Dimension, Assessment, Why this is the current view, What would change the view]
  rows:
  - [Recommendation, track, The business is real and scaled but disclosure is still too thin for a strong buy call, Cleaner concentration and post-demerger evidence]
  - [Confidence, medium, Public evidence covers funding anchors and operating scale but not full economics, Audited segment and exposure disclosure]
  - [Risk rating, high, Leverage plus concentration and partner-originated exposure can reprice the story quickly, Another year of stable losses and capital with better transparency]
  - [Valuation stance, fair, Public anchors around $1.3B-$1.7B look supportable but not clearly cheap, A lower entry point or stronger disclosure]
  - [Decision implication, Do not chase, Evidence supports monitoring discipline more than urgency, Upgrade only if proof improves faster than price]
  notes: Snapshot is price-sensitive and intentionally summarizes the committee call rather than a full model.
  claimRefs: [CV001, CV002, CV005, CV010, CV022, CV032]
- id: TV002
  title: Thesis / anti-thesis table
  columns: [Argument, Current read, What would change the view]
  rows:
  - [Market gap, Strong, Banks still underserve mid-market borrowers and Vivriti has real product breadth]
  - [Operating proof, Strong enough, FY25 revenue / PAT / AUM plus 2026 continuation support reality]
  - [Moat, Moderate, Product and underwriting breadth look real but public tech / data moat proof is partial]
  - [Customer durability, Incomplete, Need repeat-borrowing and concentration tables]
  - [Risk discipline, Mixed, Low GNPA helps but unsecured / partner exposure remains material]
  - [Disclosure quality, Weak relative to price, Need listed-like clarity on entity scope and round terms]
  notes: Each row mixes proven facts with judgment about what is still missing from the file.
  claimRefs: [CV011, CV013, CV017, CV022, CV025, CV029]
- id: TV003
  title: Bull / base / bear scenario table
  columns: [Scenario, Core assumptions, Valuation / return logic, Key risks, Probability signal]
  rows:
  - [Bull, Asset quality stays controlled and Vivriti Next improves cross-sell plus funding access, Above $1.7B and possibly premium to last round, Execution and disclosure both must improve, Medium-Low]
  - [Base, Business continues compounding with no major credit surprise but disclosure remains partial, About $1.3B-$1.7B remains defensible, Risk stays manageable not absent, Medium]
  - [Bear, Losses rise or concentration and post-demerger opacity worsen, Below $1.3B or at a discount to prior round, Funding and confidence compress quickly, Medium]
  notes: Scenario probabilities are directional because the public file lacks a full peer and term-sheet model.
  claimRefs: [CV002, CV003, CV032, CV033, CV034, CV035]
- id: TV004
  title: Comparable valuation table
  columns: [Comparable, Metric, Multiple / valuation / status, Relevance, Limitation]
  rows:
  - [Vivriti last private anchor, Late-2023 round, ~$1.7B private mark, Direct anchor for current underwriting, Terms and preferences are undisclosed]
  - [ASK / Hurun 2025 reference, Unicorn-report mark, ~$1.3B report lens, Independent public valuation reference, Methodology differs from a priced round]
  - [Northern Arc Capital, Listed / public-market NBFC comp, Public-market benchmark only, Similar structured-credit orientation and institutional debt DNA, Different listing status and disclosure depth]
  - [UGRO Capital, Listed MSME-focused lender, Public-market benchmark only, Useful for lender-risk and funding context, Different customer segment and product mix]
  - [Yubi, Adjacent private platform, Strategic adjacency not direct multiple comp, Frames marketplace / platform optionality, Not a like-for-like balance-sheet lender]
  notes: This table is qualitative because the reviewed public file does not provide a clean, synchronized peer-multiple dataset.
  enumerationScope:
    coverage: partial
    basis: The reviewed file yields a defensible set of structural comparables, but not a full standardized peer-multiple pack.
  claimRefs: [CV001, CV002, CV018, CV019, CV026, CV036]
- id: TV005
  title: Thesis-break and kill triggers table
  columns: [Trigger, Threshold, Transmission to thesis, Action implication]
  rows:
  - [Asset quality, Sustained GNPA / stage-3 deterioration, Weakens fair-case and funding confidence, Move toward bear case]
  - [Capital adequacy, Material decline toward sub-20% without offsetting capital, Reduces growth capacity, Lower valuation range]
  - [Disclosure clarity, Failure to reconcile VCL / HAC economics, Damages confidence in underwriting, Keep or downgrade to avoid]
  - [Concentration, Unexpectedly high top-borrower or partner exposure, Increases fragility of earnings, Apply larger discount]
  - [Platform expansion, Vivriti Next adds narrative but no economics, Lowers confidence in premium multiple, Hold track stance]
  - [Funding cost, Persistent cost increase without yield offset, Compresses returns on equity, Lower range and confidence]
  notes: Triggers are designed for investment committee monitoring rather than statutory covenant definitions.
  claimRefs: [CV024, CV027, CV028, CV033, CV037, CV039]
- id: TV006
  title: Final diligence asks table
  columns: [Topic, Missing evidence, Why it matters, Owner / diligence path]
  rows:
  - ['Entity reconciliation', 'VCL versus HAC economic bridge', 'Needed for clean historical trend analysis', 'Management and auditors']
  - ['Exposure concentration', 'Top borrowers, anchors, and partners', 'Needed to test downside fragility', 'CRO / risk team']
  - ['Product economics', 'Yield, cost of funds, and credit cost by line', 'Needed to support premium valuation', 'CFO']
  - ['Customer durability', 'Repeat borrowing and renewal data', 'Needed to convert breadth into lifetime value', 'Business heads']
  - ['Round terms', 'Preference stack and secondary mix', 'Needed to compare headline valuation with true economic entry', 'Investors / counsel']
  - ['Readiness for public market', 'Governance and reporting cadence', 'Needed to justify late-stage premium', 'Board / finance']
  notes: The diligence asks focus on evidence most likely to move valuation, not on generic information requests.
  claimRefs: [CV030, CV031, CV038, CV040, CV041]
