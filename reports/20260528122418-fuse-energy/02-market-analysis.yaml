  evidenceGaps:
  - type: missing-source
    severity: material
    topic: green-tariff-switching
    missingEvidence: A supplier- or tariff-level split between total domestic electricity switches and
      switches specifically into renewable or green propositions.
    whyItMatters: Fuse’s narrative is partly about cheaper clean power, but public UK statistics do not
      cleanly show how many switchers choose renewable positioning versus pure price.
    diligencePath: Request tariff-level switching cohorts from suppliers, comparison sites, or Ofgem-backed
      research rather than relying on total switching volumes alone.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM005
  - type: private-evidence-only
    severity: material
    topic: bilateral-ppa-pricing
    missingEvidence: Market-wide UK bilateral renewable PPA volume, pricing, tenor, and margin data for
      retail or SME-relevant procurement.
    whyItMatters: Renewable procurement belongs inside the strategic boundary, but public sources are
      far better at CfD and generation data than at bilateral PPA economics.
    diligencePath: Use broker, developer, buyer, or consultant data-room material to triangulate bilateral
      PPA volumes and economics.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
    - TM005
  - type: access-blocked
    severity: minor
    topic: domestic-battery-installed-base
    missingEvidence: A headline installed-base total from the 2025 or 2026 domestic battery workbook rather
      than only the landing page plus third-party MCS commentary.
    whyItMatters: Battery attach rate is central to the DER orchestration thesis, but the easiest public
      path does not surface the latest count directly in readable HTML.
    diligencePath: Open the official workbook or request the underlying data series from DESNZ or MCS.
    relatedQuestionRefs:
    - QM015
    relatedTableRefs:
    - TM002
    - TM005
