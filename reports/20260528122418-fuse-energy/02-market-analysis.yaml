- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Type
  - Direction
  - Timing
  - Implication for Fuse
  - Diligence ask
  rows:
  - - Price-cap volatility and gas-linked power prices
    - Driver
    - ↑ retail switching and tariff shopping
    - Immediate / recurring
    - Fuse can win attention with cheaper tariffs and time-of-use offers
    - Validate actual retention after cap resets, not just acquisition
  - - Renewables now >50% of UK electricity
    - Driver
    - ↑ low-cost clean supply availability
    - Current
    - Supports Fuse narrative that cheaper clean power can feed retail and DER products
    - Clarify how much of Fuse supply is owned, contracted, or certificate-backed
  - - Solar installed-base growth
    - Driver
    - ↑ attach opportunity for export, batteries, and monitoring
    - Current to medium term
    - More rooftops create more potential software and export users
    - Measure attach rates from supply customers into solar / battery products
  - - Flexibility roadmap + market facilitator + digitalisation
    - Driver
    - ↑ formalisation of VPP / DER revenue rails
    - 2025-2030
    - Improves the odds that customer assets can become dispatchable market assets
    - Check actual market access, settlement economics, and participant payment levels
  - - Smart-meter and time-of-use adoption
    - Driver
    - ↑ software-led tariff optimisation
    - Current
    - Makes Fuse-style EV, multi-rate, and automation experiences more valuable
    - Assess smart-meter quality and whether half-hourly settlement expands offers quickly enough
  - - Supplier profit compression
    - Constraint
    - ↓ margin headroom
    - Current
    - Cheap acquisition is not enough if debt, hedging, and service costs absorb economics
    - Underwrite working capital, debt exposure, and hedge policy
  - - Energy debt and consumer trust friction
    - Constraint
    - ↓ conversion quality and repayment certainty
    - Current
    - Retail energy still requires service quality and collections capability, not just lower unit rates
    - Review complaints, bad debt, and vulnerable-customer performance
  - - Concentrated market structure
    - Constraint
    - ↓ easy share gain
    - Current
    - Even with fewer than 20 active suppliers, six players still dominate share and brand awareness
    - Benchmark CAC and churn versus incumbents and fast-growth challengers
  - - Installation and grid-connection complexity
    - Constraint
    - ↓ speed of DER expansion
    - Current to medium term
    - Solar, batteries, and demand assets require hardware, installers, and queue clearance
    - Quantify installer channel access and queue-related delays
  - - Opaque PPA / green-switching data
    - Constraint
    - ↓ precision of SAM / SOM math
    - Current
    - Public evidence is strong on proxies, weak on direct revenue pools
    - Request supplier cohort data, installer data, or private consultant market files
  notes: The timing column distinguishes what is already observable in 2025-2026 data from policy or infrastructure
    developments that matter more over the next few years. The last row is a real diligence constraint,
    not a formatting caveat.
