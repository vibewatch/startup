company:
  name: Fuse Energy
chapter:
  number: 2
  title: Market Analysis
  summary: Fuse Energy's public surface spans UK household electricity supply, renewable generation, home
    solar and battery economics, and flexibility software, but the most defensible near-term market is
    still a concentrated UK residential electricity market anchored by about 29.0 million households and
    roughly £31.0 billion of annual electricity spend. Growth drivers are real—price volatility, >50%
    renewable generation, 2.0 million-plus solar installations, and policy support for 51-66 GW of flexibility
    by 2030—but retail margins, debt, regulatory complexity, connection queues, and incomplete public
    PPA / green-switching data materially narrow the realistically serviceable opportunity.
sections:
- id: market-boundary
  title: Market Boundary, Included Spend, and Adjacencies
  body: 'Fuse''s public product surface is unusually broad for a young retail supplier. The homepage and
    business page show home electricity supply, business energy, EV tariffs, multi-rate tariffs, solar
    and battery export tracking, and smart-device control; the mission page adds a company narrative around
    deploying low-cost solar and storage, then coordinating customers to ease grid pressure; and the projects
    page adds owned or developed renewable assets, green hydrogen, and engineering services. For this
    chapter, the included market is therefore four linked layers: UK retail electricity supply to homes
    (and near-adjacent small businesses), renewable generation and contracted low-carbon procurement that
    can feed those tariffs, home solar-plus-storage kits and export economics, and the grid-flexibility
    / VPP / DER orchestration layer that sits on top of customer devices.


    The chapter excludes several things even though Fuse mentions them publicly. It does not size UK gas
    spend, general business-energy procurement, grid ownership, hydrogen fuels, or fusion as part of Fuse''s
    near-term TAM, because the public sales surface and the regulatory data available today are still
    overwhelmingly UK household-electricity-led. Likewise, Ireland, Spain, and the US are best treated
    as strategic adjacency rather than current addressable market. The status-quo substitute is still
    the incumbent or legacy supplier on a standard variable or fixed tariff; the next substitutes are
    solar installers that stop at hardware, and households that self-consume without participating in
    export or flexibility markets.'
