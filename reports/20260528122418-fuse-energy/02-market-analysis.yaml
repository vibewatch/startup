- id: buyers-and-adoption
  title: Buyer, User, Payer Segments and Adoption Path
  body: 'Fuse does not face one buyer; it faces a ladder of buyers. The first rung is the household bill
    payer who wants an easier switch and a lower monthly electricity bill than the price cap or a legacy
    supplier offers. Within that rung, EV owners and time-of-use users are especially valuable because
    the tariff itself changes behavior, not just supplier brand. The second rung is the household or landlord
    who has already installed rooftop solar, battery storage, or both and now cares about export monetisation,
    device visibility, and automation. The third rung is the multi-site property owner or small business
    buyer who values consolidated billing, faster switching, and eventually site-level optimisation. The
    fourth rung is not a consumer at all: it is the grid or market counterparty—supplier trading, Elexon-enabled
    market infrastructure, NESO, or DNO-linked flexibility programs—that pays for aggregated behavior
    once enough devices are connected.


    That segmentation matters because the adoption path is staged. The customer usually enters through
    price-led retail switching, then upgrades into a more tailored tariff (fixed, EV, or multi-rate),
    then attaches rooftop solar/export or battery economics, and only after that becomes meaningfully
    orchestratable as a flexible asset. This sequencing is why the retail market remains the practical
    acquisition funnel even if flexibility economics eventually become more valuable. It is also why Fuse''s
    mission-page rhetoric about millions of coordinated customers is directionally coherent: the company
    can only sell orchestration at scale after it first wins trust and billing permission at the household
    edge. The buyer map therefore combines consumer budgets, installer economics, software and data infrastructure,
    and power-market settlement rather than fitting neatly into a single commodity-energy category.'
  claimRefs:
  - CM001
  - CM007
