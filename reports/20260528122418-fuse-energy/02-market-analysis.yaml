- id: market-sizing
  title: Addressable Market Sizing Through Multiple Evidence Lenses
  body: 'The cleanest bottom-up lens is UK households multiplied by the electricity wallet they already
    pay. ONS reports 29.0 million households in 2025, and DESNZ estimates the average standard electricity
    bill at £1,069 for 2025. That implies an evidence-constrained residential electricity wallet of about
    £31.0 billion per year before any premium for hardware, export monetisation, or flexibility services.
    A narrower serviceable pool is the price-cap-sensitive switching base: Energy UK says 60% of customers
    remained on the cap in April 2026, implying about 17.4 million households still directly exposed to
    cap-driven savings messaging. Ofgem simultaneously reports meaningful tariff spread—£1,505 for the
    cheapest tariff in February 2026 versus a £1,758 large-supplier SVT benchmark—so the switcher pool
    remains economically live even after the post-crisis recovery in fixed deals.


    Other lenses widen the opportunity but are less revenue-direct. On the supply side, renewables already
    generated 52.5% of UK electricity in 2025, with wind at 87.1 TWh and solar at 20 TWh; this matters
    because Fuse''s strategy depends on cheap renewable generation feeding retail and flexibility products.
    On the asset side, UK solar reached 22.1 GW and 2.003 million installations by March 2026, while MCS
    said certified battery installations had reached 59,000 by September 2025. On the orchestration side,
    government policy is not publishing a simple VPP TAM, but it is explicit that Britain needs roughly
    51-66 GW of clean flexibility by 2030 and that more than 2.5 million consumers have already participated
    in the Demand Flexibility Service. The right conclusion is not one heroic TAM number; it is that Fuse
    sits at the intersection of a large retail wallet, a large and growing installed DER base, and an
    early but increasingly formal flexibility market. The main missing numbers are bilateral PPA value,
    exact renewable-tariff switching share, and an easily readable official 2026 battery installed-base
    total.'
