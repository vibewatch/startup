tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / user / payer
  - Relevance to Fuse
  rows:
  - - UK household electricity supply
    - Retail electricity revenue, switching acquisition, tariff margin, service and billing software for
      home customers
    - Gas-only spend, broad household services not tied to electricity, and generic utility software
    - Buyer and payer = household bill payer; user = household occupants
    - Current visible entry point; Fuse homepage leads with tariffs, switching, and support
  - - Renewable generation and low-carbon procurement
    - Owned or developed solar and wind output plus contracted low-carbon power that can support retail
      propositions
    - Transmission ownership, pure wholesale trading, and generation unrelated to Fuse-facing supply or
      procurement
    - Buyer = supplier / offtaker; user = retail book or power customer; payer = supplier, corporate buyer,
      or market counterparty
    - Important supply-side cost advantage and credibility layer, but not a standalone retail TAM
  - - Home solar + export + battery kits
    - Residential or small-business rooftop PV, batteries, export monetisation, and monitoring software
    - Utility-scale solar farm capex and storage projects not sold through the customer edge
    - Buyer and payer = homeowner, landlord, or SME; user = site occupier / device owner
    - Natural attach market once a retail customer wants lower bills and export value
  - - Grid flexibility / VPP / DER orchestration
    - Aggregation software, asset registration, flexible tariffs, export optimisation, and payments for
      shifting demand or injecting power
    - Broad utility software with no link to DER participation, or wholesale trading disconnected from
      customer assets
    - Buyer = supplier, aggregator, DNO/NESO-linked program, or flex trader; user = household / SME asset
      owner; payer = market or network counterparty
    - Higher-margin layer if Fuse can convert customers and devices into dispatchable assets
  - - Business-energy adjacency
    - SME and multi-site tariff management visible on Fuse business page
    - Large industrial procurement and complex enterprise energy management
    - Buyer = operations or finance owner; user = site manager; payer = business account
    - Publicly visible but still adjacent to the household-led thesis
  - - International, hydrogen, and fusion adjacency
    - Possible future markets described on mission / project pages
    - Current UK TAM for this chapter
    - Future strategic buyer sets not yet visible as near-term customers
    - Should inform upside narrative, not current market sizing
  notes: Included spend is defined by Fuse's current public sales surface and the evidence available from
    UK retail, DER, and flexibility sources. Gas, industrial procurement, hydrogen, and fusion are treated
    as adjacency rather than current market boundary.
