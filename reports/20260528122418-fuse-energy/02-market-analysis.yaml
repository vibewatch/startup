callouts:
- calloutType: strength
  title: Fuse is attacking both customer acquisition and supply cost, not just tariff comparison
  body: Most challenger suppliers only market cheaper billing. Fuse's public materials instead connect
    retail tariffs, solar and storage deployment, and customer-side orchestration into one stack. If real,
    that creates a path from low-margin supply acquisition toward higher-margin software and flexibility
    monetisation.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM033
- calloutType: insight
  title: The chapter does not need a heroic TAM to justify relevance
  body: A £31.0 billion residential electricity wallet, 2.0 million-plus solar installations, and a formal
    51-66 GW flexibility buildout are already large enough to matter. The real debate is not whether the
    UK market is sizable; it is how much of it Fuse can actually capture before retail margins and installation
    friction bite.
  claimRefs:
  - CM006
  - CM016
  - CM020
  - CM037
- calloutType: risk
  title: Retail energy remains a trust, debt, and capital business before it becomes a software business
  body: Ofgem's own data show falling supplier profits, £4.48 billion of customer debt, and continued
    concentration among the largest suppliers. That means Fuse cannot assume the retail layer is just
    a cheap acquisition channel; it must survive collections, hedging, compliance, and service quality
    long enough to reach the DER and flexibility upside.
  claimRefs:
  - CM010
  - CM025
  - CM026
  - CM039
  - CM040
- calloutType: assumption
