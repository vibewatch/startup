- id: TM002
  title: TAM / SAM / SOM or sizing lens table
  columns:
  - Lens
  - Geography / unit
  - Value
  - Publisher / methodology
  - Confidence
  - Limitation
  rows:
  - - UK households
    - UK households
    - 29.0M households (2025)
    - ONS families and households bulletin (SM026)
    - High on count
    - Households are not the same as supplier accounts or switchable addresses
  - - Residential electricity wallet
    - UK annual spend
    - ≈ £31.0B
    - 29.0M households × £1,069 average standard electricity bill (SM026 + SM009/SM010)
    - Medium
    - Bill is an average standard electricity bill, not Fuse revenue or gross margin
  - - Price-cap-sensitive switching pool
    - UK households / annual spend proxy
    - ≈ 17.4M households; ≈ £18.6B wallet proxy
    - Energy UK says 60% of customers remained on the cap in April 2026; multiplied by average electricity
      bill
    - Medium-Low
    - Proxy assumes cap-exposed households resemble average electricity spend
  - - Observed switching flow
    - GB monthly switches
    - 256,169 electricity switches in Jan 2026 (~3.1M annualised if steady)
    - Ofgem retail market indicators + GOV.UK switching series (SM005 + SM011)
    - Medium
    - Monthly annualisation is illustrative; switching volumes are volatile around cap windows
  - - Renewable supply backdrop
    - UK electricity generation
    - 52.5% renewable share; 152.5 TWh clean power in 2025
    - DESNZ Energy Trends corroborated by RenewableUK (SM017 + SM023)
    - High
    - Generation share is a supply-side backdrop, not direct customer revenue
  - - Rooftop / distributed solar installed base
    - UK installations / capacity
    - 2.003M installations; 22.1 GW by Mar 2026
    - DESNZ deployment data via pv magazine and official update pages (SM028 + SM012 + SM014)
    - Medium
    - Includes all UK solar, not only customers reachable by Fuse or only residential systems
  - - Battery adoption proxy
    - UK certified installations
    - 59,000 certified batteries by Sep 2025; 122% YoY growth
    - MCS article, with official 2025/26 battery series now live (SM015 + SM013)
    - Medium-Low
    - Readable public HTML for the official 2025/26 series does not expose a current headline count
  - - Flexibility / VPP readiness
    - GB flexibility capacity / consumer participation
    - 51-66 GW needed by 2030; >2.5M DFS participants
    - Clean Flexibility Roadmap + Clean Power targets briefing (SM018 + SM022)
    - Medium-High
    - Policy requirement and participation count do not directly translate to supplier revenue
  - - Fuse visible supply-side footprint
    - Development pipeline
    - 450 MW pipeline
    - Fuse projects page (SM003)
    - Low-Medium
    - Company-claimed and global, not purely UK or fully operational
  notes: This table intentionally mixes retail-spend, installed-base, and policy-capacity lenses because
    no single public source sizes Fuse's combined retail-plus-DER-plus-flexibility market. Bilateral PPA
    value, green-tariff switching share, and a clean 2026 battery installed-base headline remain under-disclosed.
