- id: TM005
  title: Sizing gaps and contradictory public lenses
  columns:
  - Topic
  - Best public proxy
  - What public data says
  - What remains missing
  - Diligence path
  rows:
  - - Green / renewable tariff switching
    - Ofgem switching counts
    - Public sources show overall electricity switching and price-led motivation
    - No reliable public split for switches specifically into renewable or green propositions
    - Ask suppliers or comparison sites for tariff-level switching cohorts
  - - Bilateral renewable PPAs
    - LCCC / CfD datasets and clean-power briefings
    - Public data show CfD-backed assets, official renewables output, and auction volumes
    - Private bilateral PPA value, tenor, and margin are not transparently published as a UK market total
    - Use broker, developer, buyer, or consultant data room material
  - - 2026 domestic battery installed base
    - DESNZ battery stats landing page plus MCS article
    - Official series exists and was updated on 28 May 2026; MCS gives a 59k certified snapshot for Sep
      2025
    - Readable public HTML does not expose the latest headline installed-base count
    - Open the workbook or request the underlying series directly
  - - Households versus customer accounts
    - ONS households + Ofgem supplier accounts / active suppliers
    - Households and supplier/account statistics are both useful but not identical
    - No single public series converts households directly into unique switchable electricity accounts
      for Fuse-like products
    - Reconcile MPAN/account definitions in supplier data
  - - International adjacency
    - Fuse mission / project pages
    - Hydrogen, engineering, and other future geographies appear in company messaging
    - No public evidence yet shows those geographies as current commercial demand for the core product
      set
    - Treat as adjacency until country-specific customer evidence appears
  notes: 'This table is deliberate: the chapter is stronger when it separates well-supported UK household
    / DER facts from the revenue pools that remain structurally opaque in public data.'
  claimRefs:
