- id: drivers-and-constraints
  title: Growth Drivers, Constraints, and What Public Data Still Cannot Resolve
  body: 'The demand drivers are unusually aligned. Retail electricity remains highly price-sensitive;
    Ofgem and Energy UK both show customers still reacting to cap changes and the cheapest tariffs remaining
    visibly below standard variable tariffs. At the same time, the supply stack is getting cleaner: renewables
    now provide a majority of UK electricity, solar installations are still growing fast, and government
    policy is pushing smart meters, half-hourly settlement, better asset visibility, and formal local-plus-national
    flexibility-market standards. In plain English, Britain is building both the physical DER base and
    the software and market rails that a vertically integrated retail-plus-flexibility company needs.


    The constraints are just as real. Ofgem''s own market review shows thin and falling domestic profits,
    £4.48 billion of customer debt, 3.6 million customers in debt, and a domestic market where the six
    largest suppliers still control 92% share. That means challengers still need capital to fund hedging,
    customer service, and working capital before flexibility upside appears. Installation and connection
    frictions also matter: rooftop solar or batteries require homeowner action and installers, while storage
    and demand projects still face queue and infrastructure delays. Finally, public data quality is uneven.
    Official statistics are strong on bills, households, switching, solar updates, and battery-series
    existence, but they are weak on green-tariff switching share, bilateral PPA spend, and a one-stop
    revenue view for behind-the-meter storage. Those gaps should not be papered over: they narrow confidence
    in SAM / SOM arithmetic even when the top-level demand story is compelling.'
