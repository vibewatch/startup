- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow / adoption trigger
  - Budget owner
  rows:
  - - Price-cap household switcher
    - Household bill payer
    - Residents using standard supply
    - Household current account / direct debit
    - Triggered by visible savings vs price cap or poor legacy service
    - Household utilities budget
  - - EV / multi-rate home
    - Driver or tech-forward household
    - EV charger, smart meter, home devices
    - Household electricity budget
    - Triggered by off-peak charging economics and tariff optimisation
    - Household transport + utilities budget
  - - Solar / export / battery home
    - Homeowner or landlord
    - PV system, battery, export meter, app user
    - Property owner or landlord
    - Triggered once the customer wants self-consumption visibility and export value
    - Home improvement / energy capex budget
  - - Landlord / multi-property operator
    - Portfolio owner or manager
    - Tenants plus property operations
    - Owner / portfolio SPV
    - Triggered by centralised billing, void management, and repeatable hardware/software stack
    - Property operations or capex budget
  - - SME or multi-site business
    - Operations or finance lead
    - Site managers and loads across locations
    - Business current account
    - Triggered by tariff simplification, faster switching, and cross-site management
    - Facilities / finance budget
  - - Flexibility market counterparty
    - Supplier trading desk, aggregator, DNO, or NESO-linked program
    - Registered household / SME devices
    - Flexibility market, supplier P&L, or network program budget
    - Triggered after enough devices are enrolled and assets can be standardised and dispatched
    - Trading, balancing, or network-services budget
  notes: 'Fuse''s buyer map is layered rather than linear: retail acquisition usually starts with the
    household bill payer, while monetisation can later expand toward hardware, export, and flexibility-market
    counterparties.'
