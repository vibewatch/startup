            body: >-
              The growth evidence is meaningful but not cleanly audited. Tech Funding News and BusinessCloud both
              reported in September 2025 that Fuse had passed 150,000 households after a rapid summer jump from 50,000
              to 100,000 and then beyond 150,000. By late 2025 and early 2026, Tech Funding News, EU-Startups, and
