      - number: '4.4'
        title: Margin Evidence, Adverse Signals, and Underwriting Gaps
        blocks:
          - type: paragraph
            body: >-
              The public record is materially better at showing Fuse's pricing ambition than its actual unit economics.

              Official and third-party sources consistently say the company aims to beat the Ofgem cap, to save
              households up

              to roughly £200 per year, and to operate around 10% cheaper than incumbents through vertical integration.
              Yet

              the economically decisive variables remain undisclosed: gross margin after wholesale procurement, bad-debt
              and

              refund leakage, cost to serve by channel, customer acquisition cost, churn, and the percentage of supplied
              power

              actually hedged by owned generation. Even the renewable-footprint evidence is mixed rather than clean. The

              official fuel-mix page shows 18.9 GWh of generation from owned sites and a disclosed mix of 16.12% solar,

              1.39% wind, and 82.49% grid for one period, while Which? reports only 0.2% renewable electricity sold
              under its

              own sustainability methodology. That is not necessarily a contradiction—certificate treatment matters—but
              it is

              a warning that retail-margin quality should not be inferred from green branding alone.


              The adverse evidence path is therefore less about insolvency and more about economic opacity and service

              friction. Which? reports that 16% of surveyed Fuse customers made a formal complaint in the prior year,
              with

              refund problems, estimated readings, and incorrect credit balances all appearing at meaningful rates. It
              also

              scores the supplier poorly on support for vulnerable customers and price-change communications. If those
              issues

              persist at scale, they can directly inflate customer-service cost, working-capital volatility, and
              regulatory

              scrutiny. Combined with incomplete disclosure around realized tariff margins and unrestricted cash, the
              financial

              verdict is clear: Fuse looks operationally ambitious and well-financed for now, but public evidence still
              does

              not let an investor underwrite revenue quality, margin path, or liquidity adequacy with high confidence.
