    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Positioning, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Fuse Energy presents itself as a vertically integrated UK energy supplier built to attack household bills
              by owning more of the energy stack than incumbent retailers. Official materials and investor coverage
              describe a source-to-socket model spanning renewable site construction, power generation, trading, retail
              supply, installations, EV charging, and consumer hardware. The current consumer surface is already broader
              than a plain utility tariff: the homepage sells gas and electricity supply, EV charging optimisation,
              solar-and-battery export tracking, and digital account management, while product pages and recent
              financing coverage point toward a home energy operating system and plug-and-play solar-battery hardware.
              Strategically, that means the company is not just underwriting customer acquisition economics for a retail
              tariff; it is trying to create a software-and-hardware layer on top of supply that can use generation,
              trading, and demand flexibility to lower delivered cost. The strongest public evidence for this story is
              still company-authored or investor-authored rather than independently audited, but the identity is
              unusually coherent across official pages, investor announcements, and sector reporting.
