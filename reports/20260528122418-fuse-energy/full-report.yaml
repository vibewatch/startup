      - number: '3.4'
        title: 'Moat durability: what is real, what is weak, and what can be copied'
        blocks:
          - type: paragraph
            body: >-
              Fuse does have a plausible competitive story, but most of it is still pre-moat rather than post-moat. The
              credible parts are speed, product simplicity, and willingness to align retail supply with owned
              generation, EV charging, smart-device control, and export tracking from one account. Those are useful
              product decisions for acquisition. The problem is that better-funded rivals can copy nearly all of them.
              Octopus already pairs retail supply with the deepest software moat in the market via Kraken, and Kraken is
              so strong that competitors including EDF, Good Energy, and E.ON use it too. OVO has the same logic on a
              smaller but still meaningful scale through Kaluza. Good Energy and Ecotricity weaken Fuse’s
              green-differentiation claim because each already offers a more established clean-energy narrative. The
              sharpest adverse lens is that Which reports Fuse sold only a tiny share of renewable electricity from its
              own assets and still lacks mature customer-support infrastructure. In other words, Fuse’s moat is not yet
              cheap energy, green branding, or hardware adjacency on their own; it would have to become execution speed
              plus customer trust plus demonstrable orchestration performance before the bigger utilities can absorb the
              idea.
