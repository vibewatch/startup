              Fuse does not publicly disclose churn, renewal, active-account tenure, or any cohort retention metric that
              would let an investor underwrite customer durability directly. The substitutes are mixed. On the positive
              side, Trustpilot and app-store scores are high, review counts are non-trivial, and the product keeps
              widening—from gas to EV tariffs, smart chargers, multi-property management, and energy-shifting
              rewards—which suggests real opportunities to deepen household value after the initial switch. On the
              cautionary side, Which? still records a 16% formal-complaint incidence, weak
              support-for-vulnerable-customer scoring, and recurring issues around refunds, estimated readings, and
