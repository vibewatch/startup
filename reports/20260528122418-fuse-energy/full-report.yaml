      - number: '6.2'
        title: 'The core switching proposition is simple: cheaper tariffs, fast signup, and visible billing control'
        blocks:
          - type: paragraph
            body: >-
              Fuse’s customer acquisition pitch is unusually consistent across its homepage, app listings, and 2026
              explainer posts. The message is that customers can switch in under three minutes, optionally upload an old
              bill, and let Fuse handle the supplier transfer. Official materials also promise real-time or half-hourly
              billing visibility, 24/7 human support, and tariff structures aimed at beating the Ofgem cap or rewarding
              off-peak use. The proposition becomes more differentiated for EV and smart-meter households, where Fuse
              says it can apply cheap overnight rates to the entire home and automate charging schedules. Independent
              review pages broadly corroborate the commercial story rather than disproving it: Which?, Uswitch,
              Energy-Review, and SwitchInsights all describe Fuse as a low-price, digital-first challenger with stronger
              app and tariff mechanics than the average supplier. What they do not fully corroborate is the operational
              edge case. Signup may be fast, but full switching still happens inside the UK’s normal market process, and
              advanced tariffs still depend on compatible meters, chargers, and customer tolerance for app-first
              service.
