        title: Revenue Model and Pricing Mechanics
        blocks:
          - type: paragraph
            body: >-
              Fuse Energy's publicly visible monetization stack is broader than a conventional electricity-supply
              tariff, but

              the only clearly evidenced current cash engine is retail energy supply. Official surfaces show fixed,

              variable, multi-rate, and EV tariffs for households, plus business-energy offers, EV charging, and
              multi-site

              account management. The March 2026 tariff explainer is useful on mechanics: Fuse prices bills as a
              standing

              charge plus unit rate, updates variable tariffs quarterly, uses 00:30-07:30 for off-peak fixed periods,
              and

              applies an EV off-peak window from 00:00-05:00 across the entire household. Independent comparison sites
              then

              corroborate the commercial framing—below-cap variable positioning, fixed terms, multi-rate options, and
              gas

              rollout by postcode—without resolving the key underwriting question of realized margin.


              The second important distinction is between revenue streams and marketing adjacencies. Official pages and
              the

              blog show Fuse is trying to monetize not only household electricity, but also domestic gas, business
              supply,

              EV charger installation, smart charging, and future home-energy products such as solar, batteries,
              heat-pump,

              and boiler journeys. That supports a thesis of higher lifetime value per household, especially if cheaper

              off-peak charging and business accounts improve retention. But there is no public breakdown of how much
              current

              revenue comes from electricity supply versus gas, installations, charger sales, or still-emerging
              products.

              Price transparency is also incomplete: Fuse explains tariff mechanics clearly, yet actual regional list
              prices,

              discounts, and exit-fee rules are still mostly visible through comparison sites rather than a durable
              official

              tariff sheet.
