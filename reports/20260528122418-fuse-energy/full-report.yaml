              - CV035
              - CV036
              - CV037
              - CV041
      - number: '8.4'
        title: Recommendation, confidence, thesis-break triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The recommendation at the current price is research-more, not because Fuse lacks ambition, but because the
              public evidence does not yet support paying for a fully formed software-plus-energy platform. Medium
              confidence is appropriate: the overvaluation signal is strong directionally, but the missing denominator
              details mean public evidence alone cannot determine whether the right multiple is a sub-1x retail band, a
              low-single-digit hybrid band, or something much richer. The risk rating is high because the downside can
              arrive through several channels at once: a future round resetting below $5 billion, retail margin
              compression, customer-service and regulatory deterioration, or unfriendly preference terms hidden in the
              private cap table. Exit readiness is early. Public sources show a private company still expanding across
              countries and products, not a near-term public-market candidate with filings-grade disclosures. The
              practical response is simple. Investors should require an audited ARR-to-revenue bridge, contribution and
              gross-margin waterfall, current cap table and preference stack, customer-retention and complaint trend
              data, and evidence that higher-margin hardware or software products are attaching at scale. Without those
              items, the current round looks more like a narrative mark than an underwritten entry.
            claimRefs:
              - CV032
              - CV038
              - CV039
              - CV040
              - CV041
              - CV042
              - CV043
              - CV044
          - type: table
            tableRef: TV005
            claimRefs:
              - CV033
              - CV040
              - CV041
              - CV044
          - type: table
            tableRef: TV006
            claimRefs:
              - CV032
              - CV042
              - CV043
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Current price already assumes software upside
            body: >-
              Fuse may eventually deserve a premium multiple, but the retained evidence set does not yet prove that the
              reported $400 million denominator has Kraken-like quality. At $5 billion, investors are paying for a
              future-state platform before the public record shows platform economics.
            calloutType: recommendation
            claimRefs:
              - CV016
              - CV025
              - CV031
              - CV041
          - type: callout
            title: This is not a zero-traction story
            body: >-
              The company has real investor support, real customer acquisition momentum, and a coherent integrated
              product story. The issue is not whether Fuse exists or matters; it is whether public evidence supports
              paying the current round price with discipline.
            calloutType: strength
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
          - type: callout
            title: Retail economics can crush narrative valuation quickly
            body: >-
              Complaint incidence, weak vulnerable-customer support, trust-held cash, and related-party funding are all
              reminders that energy supply is an operationally and financially demanding business. If Fuse's economics
              remain utility-like, the downside from a $5 billion mark is very large.
            calloutType: risk
            claimRefs:
              - CV008
              - CV012
              - CV013
              - CV033
              - CV037
          - type: callout
            title: The bull case requires attachment, not just switching
            body: >-
              The public case only works at the current valuation if Fuse can convert cheap tariff acquisition into
              higher-margin generation, EV, export, hardware, or software monetization. Without that attach, the best
              retained comparables are public retailers, not utility software platforms.
            calloutType: assumption
            claimRefs:
              - CV017
              - CV029
              - CV031
              - CV035
