      - number: '8.3'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              The right way to frame valuation is as a scenario range rather than a false-precision mark. In the bull
              case, Fuse proves that the reported ARR is not just gross retail throughput but a strong quality
              denominator with expanding contribution margins, meaningful hardware or software attach rates, and a
              credible path to utility-OS economics. In that outcome, the current $5 billion price can be defended as a
              premium growth asset and could even compound if software-like monetisation emerges. The base case is
              materially lower. It assumes Fuse remains a fast-growing hybrid energy business that deserves a premium to
              listed retailers because of growth, owned generation, and product breadth, but not a Kraken-like software
              multiple. The bear case is starker: if growth quality proves utility-like, complaints and regulatory
              friction persist, and capital intensity stays visible, then public retail-energy comps imply a valuation
              far below the 2025 round. The comparable set makes the asymmetry clear. Good Energy's 2025 take-private EV
              implied roughly 0.38x revenue, Yahoo's public statistics put Genie at 0.73x sales, UGI at 1.06x, and
              Centrica at 0.48x, while Kraken stands out above 17x because it is explicitly sold as a software platform.
              Fuse's current price already sits near the bull edge of that spectrum.
