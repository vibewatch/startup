  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Adjacencies
        blocks:
          - type: paragraph
            body: >-
              Fuse's public product surface is unusually broad for a young retail supplier. The homepage and business
              page show home electricity supply, business energy, EV tariffs, multi-rate tariffs, solar and battery
              export tracking, and smart-device control; the mission page adds a company narrative around deploying
              low-cost solar and storage, then coordinating customers to ease grid pressure; and the projects page adds
              owned or developed renewable assets, green hydrogen, and engineering services. For this chapter, the
              included market is therefore four linked layers: UK retail electricity supply to homes (and near-adjacent
              small businesses), renewable generation and contracted low-carbon procurement that can feed those tariffs,
              home solar-plus-storage kits and export economics, and the grid-flexibility / VPP / DER orchestration
              layer that sits on top of customer devices.


              The chapter excludes several things even though Fuse mentions them publicly. It does not size UK gas
              spend, general business-energy procurement, grid ownership, hydrogen fuels, or fusion as part of Fuse's
              near-term TAM, because the public sales surface and the regulatory data available today are still
              overwhelmingly UK household-electricity-led. Likewise, Ireland, Spain, and the US are best treated as
              strategic adjacency rather than current addressable market. The status-quo substitute is still the
              incumbent or legacy supplier on a standard variable or fixed tariff; the next substitutes are solar
              installers that stop at hardware, and households that self-consume without participating in export or
              flexibility markets.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM032
              - CM033
              - CM036
