  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Why it lands here
      - What would change it
    rows:
      - - Recommendation
        - research-more
        - Public evidence does not cleanly support paying $5bn today.
        - Audited denominator quality or a materially lower entry price.
      - - Confidence
        - medium
        - The overvaluation signal is strong, but key private-company inputs remain undisclosed.
        - Management shares audited KPI bridges and financing terms.
      - - Risk rating
        - high
        - Retail margin, complaints, regulation, and round terms can all move value sharply.
        - Show stable service metrics, margin durability, and simple preferred terms.
      - - Valuation stance
        - stretched
        - The implied 12.5x multiple is far above public retail-energy comparables.
        - Prove Kraken-like software economics or accept a lower price.
      - - Hold / exit posture
        - multi-year private hold only
        - No public evidence supports near-term exit readiness.
        - Publish a clearer liquidity path and public-company-style disclosure cadence.
      - - Primary diligence gate
        - ARR bridge + margin waterfall + cap table
        - Those three items determine whether the round is growth-quality or narrative-quality.
        - Deliver audited-like reporting and executed term documents.
