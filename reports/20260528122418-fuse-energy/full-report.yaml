      - number: '1.2'
        title: Founders, Entity History, and Governance Signals
        blocks:
          - type: paragraph
            body: >-
              The public founder story is straightforward: Balderton, Sifted, EU-Startups, TFN, BusinessCloud, and The
              Energyst all describe Fuse as a 2022 venture started by former Revolut executives Alan Chang and Charles
              Orr. The legal-entity story is more complicated. Companies House shows that Fuse Energy Supply Limited,
              the regulated UK supply entity, is an active company incorporated in April 2013 and previously called
              Paddington Power Limited, while Which? says Fuse launched to consumers in 2023 as the first new UK
              supplier to enter the market after the energy crisis. Taken together, the evidence suggests the current
              startup and management team were assembled in 2022 and then scaled a pre-existing licensed or licensable
              corporate shell into the consumer-facing Fuse business. That is not inherently negative, but it matters
              for diligence because investors will want to understand exactly which assets, licences, liabilities, and
              historical obligations sit inside the inherited supply entity. Public leadership disclosure is still thin
              beyond Chang and Orr, so key-person dependence remains concentrated and the board, voting rights, and
              investor control provisions are not visible in the public record reviewed here.
