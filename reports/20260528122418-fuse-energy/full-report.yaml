      - number: '3.3'
        title: Brand trust, service quality, and switching friction
        blocks:
          - type: paragraph
            body: >-
              Price alone rarely wins for long in UK energy because suppliers still have to earn enough trust for a
              household to switch bank details, meter reads, and support expectations. Citizens Advice and Which both
              show that trust is unevenly distributed. Ecotricity tops the Citizens Advice table, Octopus and E.ON Next
              sit in the better-performing cohort, while EDF and British Gas trail. Which scores Fuse better than OVO on
              customer sentiment, but it also flags Fuse’s weak support for vulnerable users, lack of traditional phone
              support, and mixed communications. OVO illustrates the opposite trade-off: it has much broader product and
              support infrastructure than Fuse, yet Which still rates it poorly for value and service from the customer
              side. Smart tariffs also create a new kind of switching friction. Once a customer has a compatible
              charger, app workflow, half-hourly smart-meter reads, and perhaps a bundled battery or heat-pump tariff,
              changing supplier is no longer as simple as replacing one commodity bill with another. That benefits
              larger platforms today more than it benefits Fuse, because the bigger players already have the installed
              hardware, specialist apps, and support teams in place.
