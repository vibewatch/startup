  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Stack Breadth: retail supply, generation, installations, and home-energy add-ons'
        blocks:
          - type: paragraph
            body: >-
              Fuse’s public product surface is broader than a normal UK retail supplier. The homepage presents one brand
              spanning household supply, business energy, EV charging, a hardware and installation store, owned
              projects, and app signup. The store then makes the downstream hardware layer explicit: customers can
              request a home EV charger, home solar, home battery, heat pump, gas boiler, and accessories. Upstream, the
              projects surface shows a build-to-own renewables strategy with completed wind and solar sites plus a much
              larger development pipeline. The careers page ties those layers together most directly, describing a fully
              integrated company covering solar, wind and hydrogen project development, real-time power trading,
              distributed energy installations, and direct-to-consumer supply.


              That breadth is the chapter’s main product takeaway. Fuse is not just selling a tariff or a
              comparison-site switch; it is trying to own customer acquisition, retail billing, device attach, installer
              workflow, generation hedging, and selected flexibility economics inside one operating stack. The evidence
              is strongest for the supply, EV, project, and installation surfaces that are already on the website or app
              stores. The home solar / home battery layer is directionally real because it appears in the store, the
              homepage promises export tracking, and the rewards terms contemplate rooftop DER participation. But public
              documentation is still thinner than for the tariff and EV products, so the solar-battery offer should be
              treated as a live sales motion with incomplete public product detail rather than a fully documented
              turnkey kit.
