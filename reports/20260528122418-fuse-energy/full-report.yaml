  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The public financing record is straightforward on the headline and thin on the denominator. Multiple
              retained sources repeat the same December 2025 message: Fuse raised $70 million, was marked at $5 billion,
              served roughly 200,000 UK households, claimed about $400 million of ARR, and said it had become cash-flow
              positive while growing 8x year on year. That is enough to conclude that the company had real investor
              demand and real commercial traction by late 2025. It is not enough to conclude that the price is
              supported. Using the company-reported $400 million figure as the denominator already implies about 12.5x
              ARR. Public sources do not show whether that figure is audited revenue, gross profit, contribution margin,
              or a broader gross-billing proxy tied to retail energy supply. That gap is decisive because public market
              utilities and suppliers usually trade on far lower revenue multiples, while only software-heavy utility
              platforms such as Kraken approach or exceed this kind of ratio. Entry discipline therefore has to start
              with a simple rule: do not underwrite the current round as if Fuse is already a proven software platform
              unless the company can produce audited evidence that the denominator has software-like quality.
