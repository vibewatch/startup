  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Why it matters
      - Action implication
    rows:
      - - Down-round or heavily discounted secondary
        - Any credible financing materially below $5bn before economics are proven
        - Would show that private-market price discovery has already rejected the 2025 mark.
        - Move to avoid / do not add.
      - - Revenue-quality miss
        - Audited bridge shows ARR is mostly low-margin gross billing with weak contribution margin
        - Breaks the software-upside case that current pricing requires.
        - Rebase toward retail-energy multiples.
      - - Service / regulatory deterioration
        - Complaint rates, vulnerable-customer support, or Ofgem scrutiny worsen materially
        - Directly pressures cost to serve, brand, and future regulatory latitude.
        - Put position on watch and reduce expected value.
      - - Cap-table overhang
        - Preferences, participation, or secondary-heavy structures are materially worse than expected
        - Private return math can fail even with solid operating execution.
        - Do not invest without full downside modeling.
      - - Product attach miss
        - EV, hardware, export, or software products fail to generate measurable higher-margin attachment
        - Leaves the business looking like a supplier rather than a platform.
        - Treat bull case as broken.
    notes: >-
      The register focuses on events that would invalidate the current premium price support, not generic operating
      noise.
    claimRefs:
      - CV033
      - CV040
      - CV041
      - CV044
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - ARR / revenue bridge
        - Audited reconciliation from reported ARR to GAAP or statutory revenue, gross profit, and contribution margin
        - The current valuation lives or dies on denominator quality.
        - CFO / finance diligence room; audit support.
      - - Cap table and terms
        - Current share count, security type, liquidation preferences, participation, and any secondary split
        - Return math cannot be modeled without knowing what investors actually bought.
        - Legal diligence plus executed round documents.
      - - Cohort economics
        - Churn, retention, CAC payback, complaint cost, and bad-debt profile by tariff cohort
        - >-
          Price-led customer growth can look impressive while still destroying enterprise value if service and margin
          quality are weak.
        - Commercial finance and customer-ops pack.
      - - Product attach and software monetization
        - >-
          Attach rates, ARPU uplift, and gross margin for EV, export, smart-home, hardware, and any software-like
          revenues
        - Needed to justify valuing Fuse as more than a supplier.
        - Product analytics, billing, and unit-economics review.
      - - Liquidity and working capital
        - Unrestricted cash, hedge policy, regulatory capital position, and intercompany funding dependence
        - Public filings already show trust-held cash and related-party funding.
        - Treasury and board reporting review.
      - - Exit readiness
        - Expected liquidity path, next-round milestones, and disclosure plan for public-market readiness
        - Investors should not pay a premium without a realistic path to realizing it.
        - CEO / board discussion and financing roadmap.
    notes: >-
      These asks are the minimum dataset needed to convert the current public-evidence view into a priceable
      underwriting case.
    claimRefs:
      - CV032
      - CV042
      - CV043
