      - number: '1.5'
        title: Adverse Evidence, Regulatory Context, and Open Questions
        blocks:
          - type: paragraph
            body: >-
              The adverse picture is not one of acute regulatory distress, but it is not risk-free either. The official
              sources reviewed here show no major Ofgem enforcement action or SEC sanction against Fuse; if anything,
              the regulatory record includes a November 2024 gas-supply licence grant from Ofgem and a November 2025 SEC
              no-action letter for Fuse Crypto Limited's token structure. The caution instead comes from execution,
              disclosure, and consumer-service channels. Which? gives Fuse a 66% total score in its first year in the
              rankings, with lower marks for communications about energy costs and other policy-side criteria, while
              Resolver says the most common complaint types are billing/payment and smart meter installation. Those are
              normal startup-utility friction points rather than existential events, but they matter because Fuse is
              scaling very quickly while also adding hardware, grid services, and new geographies. The bigger diligence
              issue is still transparency: board composition, rights terms, independently verified revenue, independent
              customer counts, and the precise relationship between the 2022 startup and the 2013 supply entity remain
              unresolved. That combination supports a high-growth narrative, but not a fully closed underwriting case.
            claimRefs:
              - CO011
