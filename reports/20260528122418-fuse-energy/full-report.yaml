      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case is not imaginary. Fuse has assembled a credible integrated narrative that links customer
              acquisition, supply, generation, EV charging, smart-home control, export, and a broader operating-system
              ambition for the household. Official pages and investor coverage support the idea that the company is
              trying to move beyond commodity retail supply and build a richer customer relationship over time. The
              problem is that public evidence today still looks more like a fast-scaling supplier with option value than
              a proven utility software platform. Which?'s review is the sharpest adverse lens: customer survey scores
              are decent, but complaint incidence, weak vulnerable-customer support, limited phone access, and a
              sustainability methodology that credits only 0.2% renewable electricity sold all challenge the notion that
              retail execution quality is already elite. The statutory picture is similarly mixed. Companies House
              filings show real cash, real assets, related-party funding, and a satisfied JPMorgan charge, but they do
              not give a clean read on unrestricted liquidity or durable standalone profitability. In other words, the
              thesis is vertical integration plus cross-sell plus software optionality; the anti-thesis is that public
              proof still looks like low-price retail acquisition with unfinished operating and disclosure discipline.
