  - id: TV004
    title: Comparable valuation table
    columns:
      - Company / reference
      - Status
      - Current denominator or scale signal
      - Multiple / valuation
      - Relevance
      - Key limitation
    rows:
      - - Fuse Energy
        - Private
        - Reported $400m ARR, 200k households, early integrated product stack
        - $5bn headline value; ~12.5x on reported ARR
        - Subject company; frames the underwriting problem directly.
        - No audited public bridge from ARR to revenue, gross profit, or free cash flow.
      - - Good Energy
        - Public-to-private UK green supplier
        - £180.1m 2024 revenue; £6.6m PBT; installation and energy-as-a-service mix
        - ~£67.8m implied EV; ~0.38x EV/revenue
        - Closest UK retail-energy and home-electrification reference in retained sources.
        - Smaller scale and slower growth than Fuse's reported 2025 trajectory.
      - - Genie Energy
        - Public
        - $507.48m trailing revenue
        - $370.44m market cap; 0.73x sales; 0.35x EV/revenue
        - Useful listed retail-energy multiple anchor.
        - US business mix and geography differ from UK retail energy.
      - - UGI
        - Public
        - $7.36bn trailing revenue
        - $7.54bn market cap; 1.06x sales; 1.91x EV/revenue
        - Shows what a larger energy distributor can command in public markets.
        - Broader propane and infrastructure exposure make it only a distant comp.
      - - Centrica
        - Public
        - £19.49bn trailing revenue
        - £8.83bn market cap; 0.48x sales; 0.38x EV/revenue
        - Large UK retail-energy anchor for where mature supply businesses trade.
        - Incumbent scale and diversification make it a downside anchor, not a growth peer.
      - - Octopus Energy
        - Private
        - 7.7m households in May 2024; later official materials cite 11m customers globally
        - $9bn valuation in May 2024
        - Best retained private benchmark for an integrated energy-plus-tech player.
        - Valuation is not paired with a retained official revenue denominator here.
      - - Kraken
        - Private utility software
        - $500m+ contracted annual revenue; 70m+ accounts supported
        - $8.65bn implied valuation; >17x revenue
        - Strongest retained upside comp for software-like utility economics.
        - Pure software infrastructure is a fundamentally better denominator than retail supply.
      - - Kaluza
        - Private utility software
        - Prior $500m valuation for 20% stake; new deal reportedly could seek >$1bn
        - $1bn-$2.5bn discussion range tied to ARR narrative
        - Shows that investors can pay premium multiples for utility software optionality.
        - Reported range is indicative and profitability remains questioned.
    notes: >-
      The set intentionally mixes public retailers, public distributors, and private utility-software businesses. Fuse's
      current price only looks reasonable at the software-heavy end of the range.
    enumerationScope:
      coverage: partial
      basis: >-
