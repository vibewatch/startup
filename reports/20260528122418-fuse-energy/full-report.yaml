            body: >-
              Fuse’s public product surface already looks more like a small integrated utility-and-home-electrification
              platform than a narrow retail tariff business. The company sells home energy, business energy, EV
              charging, expert installations, and a store that spans chargers, solar, batteries, heat pumps, and
              boilers, while also operating renewable sites and advertising a 450 MW project pipeline. That creates real
              upside, but it also multiplies the number of ways execution can fail. Billing quality and smart-meter
              dependence are already visible pain points in public customer evidence, and the supply terms explicitly
              permit estimated billing, deposits, prepayments, collections actions, switching objections, and
              disconnection pathways. Hardware and installation broaden the failure surface from digital service errors
              into physical safety, warranty, callback, and installer-capacity issues. The dependency map is similarly
              wide: DNOs and meter operators matter for supply delivery, installers and OEMs matter for product quality,
