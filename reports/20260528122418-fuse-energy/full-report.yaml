      - number: '1.4'
        title: Products, Renewable Asset Base, and Expansion Roadmap
        blocks:
          - type: paragraph
            body: >-
              Public materials show Fuse already operating a broader energy platform than a new entrant supplier, even
              if many product ambitions are still forward-looking. Which? says the company already operates 18MW of UK
              solar and wind sites, while Fuse's own project pages disclose a 0.8MW wind turbine at Balnamoon plus 12MW
              and 5.2MW solar sites at Bullous Park and Netley North, matching that tens-of-megawatts footprint.
              Official disclosures also say Fuse generated 18.9 GWh from its solar and wind farms during the 2024-04-01
              to 2025-03-31 fuel-mix period and has a 450MW global development pipeline, while the careers page
              stretches the ambition further to a terawatt-scale build-out. On the customer side, the live product
              surface includes retail gas and electricity, EV charging optimisation, digital onboarding, and
              solar-and-battery export tracking, with smart-device rewards and grid-balancing tools positioned as the
              next layer. Renewables Now says the Series B will fund US, Ireland, and Spain supply launches, a
              plug-and-play solar-battery kit, and an intelligent home energy operating system. The May 2026 acquisition
              of the 20MW Cwm Ifor solar farm gives a concrete proof point that international and hardware ambitions are
              being paired with real asset accumulation, not just software marketing.
