  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Probability signal
      - Core assumption
      - Multiple / value logic
      - Implied value band
      - What must be true
    rows:
      - - Bear
        - Credible downside
        - Reported ARR is mostly low-margin supply revenue and service/regulatory friction persists.
        - Public retail-energy bands around 0.4x-0.8x on a $400m-like denominator.
        - $0.3B-$0.8B
        - Margin quality remains utility-like and next-round terms worsen.
      - - Base
        - Most balanced public-evidence case
        - Fuse becomes a fast-growing hybrid supplier with real option value, but not a software pure-play.
        - Premium to public retailers, but still well below Kraken-like utility software.
        - $1.0B-$2.2B
        - Higher-margin products attach, complaints stabilize, and cash conversion improves.
      - - Bull
        - Requires premium proof
        - The denominator behaves more like recurring gross profit or utility-OS revenue than simple supply revenue.
        - Current round can be defended only if software-like economics become visible.
        - $4.0B-$6.0B
        - Audited bridges, strong attach rates, and cap-table simplicity support a premium.
      - - Current round
        - Market price today
        - Investors accepted the software-upside case before it is publicly proven.
        - $5.0B headline post-money.
        - $5.0B
        - Future evidence must catch up with the price rather than the other way around.
    notes: >-
      These scenarios are valuation bands anchored on retained public and private comparables plus explicit
      denominator-quality assumptions; they are not a substitute for a data room.
