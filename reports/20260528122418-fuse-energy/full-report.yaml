      - number: '1.3'
        title: Funding History, Investor Syndicate, and Scale Claims
        blocks:
          - type: paragraph
            body: >-
              Fuse's financing narrative is the headline that later chapters must inherit carefully. Balderton and
              Goodwin both say an additional $70 million round in late 2025 took the company to a $5 billion valuation,
              while Sifted, EU-Startups, and Renewables Now name a syndicate that includes Lowercarbon Capital,
              QuantumLight, Ribbit Capital, Lakestar, Latitude, and Rosberg Ventures. That is strong corroboration for
              the valuation event and for the investor roster. The operating-scale numbers are weaker. Sifted and BaeHQ
              repeat that Fuse supplied more than 200,000 UK households and reached $400 million ARR by December 2025,
              but both attribute those numbers to the company. Earlier 2025 coverage from The Energyst and BusinessCloud
              documented the trajectory to 150,000 households and roughly $300 million ARR, which supports rapid growth
              but still does not substitute for audited disclosure. A second tension is total funding: Fuse's careers
              page says the company has raised $170 million, yet the readily visible round history in accessible
              coverage only itemises a prior $78 million seed plus the new $70 million Series B. That mismatch does not
              invalidate the business, but it does leave missing detail on interim capital, secondaries, or other
              financing instruments.
