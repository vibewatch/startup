    {
      "id": "retention-proxies-expansion-and-trust",
      "title": "Retention looks promising by proxy, but churn durability is still the chapter’s main underwriting gap",
      "body": "Fuse does not publicly disclose churn, renewal, active-account tenure, or any cohort retention metric that would let an investor underwrite customer durability directly. The substitutes are mixed. On the positive side, Trustpilot and app-store scores are high, review counts are non-trivial, and the product keeps widening—from gas to EV tariffs, smart chargers, multi-property management, and energy-shifting rewards—which suggests real opportunities to deepen household value after the initial switch. On the cautionary side, Which? still records a 16% formal-complaint incidence, weak support-for-vulnerable-customer scoring, and recurring issues around refunds, estimated readings, and incorrect balances. SwitchInsights likewise flags no phone support and variable direct-debit friction as the biggest limitations. Concentration risk is therefore not about a single customer representing too much revenue; it is about the model over-indexing toward digitally confident direct-debit households while leaving less-digital, prepayment, or phone-first users relatively underserved. Netting that out, retention is probably better than the absence of disclosure would imply, but not strong enough to call proven.",
