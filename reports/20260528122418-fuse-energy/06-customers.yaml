    "number": 6,
    "title": "Customers",
    "summary": "Fuse Energy’s customer proposition is strongest for digital-first UK households that care about low tariffs, app-led onboarding, and EV or smart-meter features. Public evidence makes a 200k+ household base directionally plausible—late-2025 growth reporting, thousands of Trustpilot reviews, and sizable app-store ratings all point to real adoption—but the exact figure is still company-originated rather than independently audited. Service quality looks better than legacy-supplier stereotypes on price and ease of switching, yet complaint channels and Which? survey data show trust can weaken around refunds, billing, smart-meter setup, and the lack of phone-first support."
  },
