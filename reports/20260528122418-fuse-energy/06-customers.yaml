      "id": "household-segments-and-fit",
      "title": "Fuse is selling to digitally comfortable, price-sensitive households rather than the full UK mass market",
      "body": "Fuse Energy’s public customer surface is consumer-household first, not enterprise first. The strongest official evidence is the product menu itself: household electricity and gas, EV charging optimisation, smart-meter-enabled usage tracking, multiple-property management, and an app-led account model. That mix implies a buyer who is usually also the user and payer, with the best fit in households willing to manage energy digitally, pay by direct debit, and interact through chat or app rather than by phone. EV owners and multi-property users appear especially attractive because Fuse repeatedly markets off-peak charging, charger installation, and multi-property controls as reasons to join or deepen usage. The flipside is equally important for diligence. Which?, Energy-Review, and other review pages all suggest Fuse is less suitable for customers who need prepayment, prefer telephone service, or expect a traditional high-touch supplier relationship. In other words, the customer base may be broad in absolute household count, but it is still segmented around digital willingness, tariff flexibility, and trust in app-mediated service.",
      "claimRefs": ["CU001", "CU002", "CU009", "CU026", "CU029", "CU039"],
      "tableRefs": ["TU001"],
      "figureRefs": ["FU001"]
