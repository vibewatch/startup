    {
      "id": "pricing-switching-and-onboarding",
      "title": "The core switching proposition is simple: cheaper tariffs, fast signup, and visible billing control",
      "body": "Fuse’s customer acquisition pitch is unusually consistent across its homepage, app listings, and 2026 explainer posts. The message is that customers can switch in under three minutes, optionally upload an old bill, and let Fuse handle the supplier transfer. Official materials also promise real-time or half-hourly billing visibility, 24/7 human support, and tariff structures aimed at beating the Ofgem cap or rewarding off-peak use. The proposition becomes more differentiated for EV and smart-meter households, where Fuse says it can apply cheap overnight rates to the entire home and automate charging schedules. Independent review pages broadly corroborate the commercial story rather than disproving it: Which?, Uswitch, Energy-Review, and SwitchInsights all describe Fuse as a low-price, digital-first challenger with stronger app and tariff mechanics than the average supplier. What they do not fully corroborate is the operational edge case. Signup may be fast, but full switching still happens inside the UK’s normal market process, and advanced tariffs still depend on compatible meters, chargers, and customer tolerance for app-first service.",
      "claimRefs": ["CU003", "CU004", "CU005", "CU006", "CU007", "CU008", "CU009", "CU010", "CU020", "CU021", "CU030", "CU031"],
      "tableRefs": ["TU002"],
      "figureRefs": ["FU002"]
    },
    {
      "id": "scale-evidence-and-200k-supportability",
      "title": "A large household base is plausible, but 200k+ should still be treated as a company-reported scale point",
      "body": "The growth evidence is meaningful but not cleanly audited. Tech Funding News and BusinessCloud both reported in September 2025 that Fuse had passed 150,000 households after a rapid summer jump from 50,000 to 100,000 and then beyond 150,000. By late 2025 and early 2026, Tech Funding News, EU-Startups, and SwitchInsights were all repeating that the UK base had crossed 200,000 households while ARR reached about $400 million. That gives the claim repetition across several domains and over multiple months, which matters. But the sourcing chain still appears to run back to company and investor statements rather than an independently verifiable regulatory ledger of active households, meter points, or billed accounts. The best outside sanity checks are review-volume proxies: a January 2026 Trustpilot snapshot citing 3,223 customers, an App Store page showing 500 ratings, and Which? surveying 112 customers. Those signals are directionally inconsistent with a tiny customer base, but they do not prove 200,000 exactly. The prudent reading is that Fuse clearly achieved real national consumer scale, while the exact household count remains only moderately supported in public evidence.",
      "claimRefs": ["CU017", "CU018", "CU023", "CU024", "CU025", "CU027"],
      "tableRefs": ["TU003"]
    },
    {
      "id": "customer-proof-and-service-quality",
      "title": "Public customer proof is real but anecdotal, and service quality looks good until something unusual goes wrong",
      "body": "Fuse does have customer-proof, just not in the polished B2B case-study format. The usable public evidence comes from consumer reviews, survey excerpts, complaint platforms, and app-store ratings. Which? quotes one satisfied customer praising fair pricing, transparent billing, and the intuitive app, while another complains that the lack of phone support makes communication difficult. Resolver then adds more specific edge cases: one user says a missing bill issue was resolved quickly, while another says credit from a previous provider only arrived after repeated chasing. Trustpilot’s January 2026 snapshot is directionally positive overall, highlighting switching ease, competitive pricing, and staff helpfulness. App-store surfaces are more one-directionally positive, with strong ratings and repeated emphasis on real-time billing and convenience. The synthesis is important: Fuse seems able to delight digitally fluent customers during normal operation, but the adverse proof is concentrated in situations involving handoffs, billing exceptions, refunds, or installation friction. That is a trust pattern investors should treat as operationally meaningful, not just anecdotal noise.",
