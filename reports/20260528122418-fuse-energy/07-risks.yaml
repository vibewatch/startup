  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: hedging-opacity
    missingEvidence: Commodity hedge policy, procurement committee materials, collateral requirements, bad-debt roll-forward, and monthly gross-margin bridge by tariff.
    whyItMatters: The biggest residual risk is retail-energy margin shock, and public sources do not show whether Fuse's price claims are supported by robust trading and credit controls.
    diligencePath: Request the board-approved risk policy, hedge ratio reports, collateral waterfalls, debt-aging packs, and at least six months of tariff-level margin reporting.
    relatedQuestionRefs:
    - QR010
    - QR026
    - QR029
  - type: private-evidence-only
    severity: material
    topic: complaints-trend
    missingEvidence: Monthly complaint volumes, deadlock letters, Ombudsman referrals, uphold rates, average resolution times, and vulnerable-customer case handling metrics.
    whyItMatters: Public review evidence already shows service friction; underwriting needs to know whether the issue is isolated launch noise or a scaling-control problem.
    diligencePath: Obtain board and compliance dashboards for complaints, Ombudsman cases, smart-meter tickets, refund backlogs, and any regulator correspondence.
    relatedQuestionRefs:
    - QR005
    - QR006
    - QR007
    - QR026
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: installation-quality
    missingEvidence: Installer roster, accreditation pack, defect rates, warranty reserves, incident logs, insurance schedule, and NPS or cancellation data for hardware jobs.
    whyItMatters: Fuse is extending from retail supply into physical installation categories where quality failures can create safety, cost, and reputational cascades.
    diligencePath: Review installer contracts, OEM warranties, health-and-safety reporting, and the last twelve months of callbacks, refunds, and failed installs by product line.
    relatedQuestionRefs:
    - QR012
    - QR027
    - QR029
  - type: missing-source
    severity: material
    topic: uk-crypto-perimeter
    missingEvidence: A current UK counsel memo mapping $ENERGY rewards, wallet flows, exchange trading, and marketing copy to FCA perimeter and promotions requirements.
    whyItMatters: The SEC no-action letter is helpful but not portable; UK FCA exposure could still force product redesign, approver dependence, or launch restrictions.
    diligencePath: Request UK legal advice, any s.21 approver relationship, geo-fencing policy, exchange-listing governance, and consumer-promotion approval workflows.
    relatedQuestionRefs:
    - QR017
    - QR018
    - QR019
  - type: private-evidence-only
    severity: material
    topic: org-bench
    missingEvidence: Current org chart, named leaders for compliance, trading, customer operations, installations, privacy, and each launch geography.
    whyItMatters: Fuse is running a wide execution surface, but public evidence remains concentrated on the two founders, limiting confidence in operating redundancy.
    diligencePath: Request org chart, hiring plan, span-of-control summary, succession plans, and incentive structures for the leaders of regulated and field-heavy functions.
    relatedQuestionRefs:
    - QR028
    - QR029
  - type: missing-source
    severity: minor
    topic: litigation-completeness
    missingEvidence: A complete UK, Jersey, and US litigation and enforcement search pack covering civil claims, small-claims patterns, and historic regulatory correspondence.
    whyItMatters: Public primary sources did not show a material enforcement event, but the absence of a retained case file is not the same as a complete clearance.
    diligencePath: Run external counsel docket searches, regulatory correspondence review, and founder or entity litigation checks before investment committee sign-off.
    relatedQuestionRefs:
    - QR030
