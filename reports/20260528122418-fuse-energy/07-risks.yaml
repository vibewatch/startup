company:
  name: Fuse Energy
chapter:
  number: 7
  title: Risks
  summary: Fuse's highest residual risks are not a visible current enforcement action but a three-way interaction between UK retail-supply compliance, opaque margin and hedging controls, and rapid scope expansion into hardware, installations, and tokenised rewards. Public mitigants are real — live licences, formal terms, a working redress path, fresh funding, and an existing asset base — but the adverse evidence on complaints, support for vulnerable users, and disclosure gaps means the underwriting case still depends heavily on private diligence.
sections:
- id: severity-ranked-overview
  title: Severity-Ranked Risk Overview
  body: 'Fuse’s risk profile is less about a single visible legal blow-up and more about three compounding exposures that can move quickly together. First, Fuse is a regulated retail supplier with already-visible customer-service friction. Ofgem has granted a live gas licence and the company publishes formal supply, privacy, promotion, and rewards terms, but independent evidence is materially less flattering on service readiness: Which? scores Fuse at 66% overall and 56% on supplier assessment, reports 16% formal complaint incidence, and flags weak performance on vulnerable-customer support and communications. Second, the retail-energy economic core remains publicly opaque. Management and investors repeatedly describe a vertically integrated trading-plus-supply model that can price around 10% below incumbents, yet the retained record does not disclose hedge ratios, bad-debt loss rates, collateral requirements, or the share of customer load covered by owned generation. Third, $ENERGY adds
    a new regulatory layer before the UK perimeter is settled. The SEC no-action result helps, but Fuse’s own rewards terms reference exchange trading, market-priced redemption, and self-custody wallets, all while the FCA is still defining the future regime.'
  claimRefs:
