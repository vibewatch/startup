- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold / Event
  - Action Implication
  rows:
  - - Customer-service / regulatory breach
    - Formal complaint rate and Ombudsman referrals
    - If formal complaints stay above peer-small-supplier levels or Ombudsman referrals / deadlock letters trend upward for two consecutive quarters
    - Pause aggressive acquisition, fund service remediation first, and treat the retail thesis as impaired until metrics normalize
  - - Retail-margin opacity / hedging failure
    - Gross margin after procurement, collateral usage, and bad-debt losses
    - If requested diligence cannot show stable positive gross margin and controlled collateral by tariff cohort
    - Do not underwrite current growth narrative at valuation; reframe as research-more or require downside protection
  - - $ENERGY UK perimeter risk
    - UK counsel conclusion and any FCA / s.21 approver requirements
    - If UK counsel cannot support current rewards design or requires major marketing, exchange, or wallet restrictions
    - Assume delayed rollout, higher compliance cost, and lower optionality from token-enabled engagement
  - - Privacy / PECR compliance
    - Cookie audit, DPIA findings, and data-rights complaint procedure readiness
    - If non-essential cookies are firing before consent or the June 2026 complaints-procedure readiness is incomplete
    - Require privacy remediation before scaling paid acquisition or advanced personalization features
  - - Installation quality / safety
    - Callback rate, warranty claims, serious incidents, and installer churn
    - If physical product defect or callback rates exceed internal hurdle or any serious safety incident occurs
    - Slow hardware rollout, tighten vendor roster, and reserve extra capital for warranty and insurance
  - - Working-capital / collections stress
    - Security deposits, prepayment usage, churn from collections, and credit-balance volatility
    - If collections tools become a major growth lever or cash conversion deteriorates despite customer growth
    - Treat growth as increasingly credit-led and pressure-test solvency and customer-acquisition assumptions
  - - Execution stretch
    - New-country launches, product GA dates, and org-bench build-out
    - If multiple launches slip simultaneously or key control roles remain unfilled after fundraising
    - Reduce modeled scope to the core UK retail and project base until execution catches up
  - - Supplier-failure category risk
    - Wholesale volatility versus available financing and Ofgem resilience requirements
    - If wholesale volatility spikes while Fuse cannot evidence hedge or capital discipline
    - Assume downside scenario similar to prior small-supplier failures even if SoLR protects end customers
  notes: These are investor-oriented kill criteria rather than management KPIs. Every trigger is meant to be monitorable during diligence or quarterly portfolio review.
