- id: regulatory-legal-and-customer-protection
  title: Regulatory, Legal, and Customer-Protection Risk
  body: 'The core regulatory stack is real, current, and investment-relevant. On the energy side, Fuse must keep its supply permissions in good standing and comply with Ofgem complaint-handling expectations, including escalation to a free and independent redress route when complaints are unresolved. Public evidence shows the right framework exists — Ofgem’s eight-week resolution standard, the 2008 complaint-handling regulations, and a live Fuse Energy Supply Ombudsman path — but the same public evidence also shows enough customer friction to make compliance a live operating issue rather than a box-tick. On the data side, Fuse’s privacy policy openly contemplates smart-meter usage data, vulnerability data, AI-assisted processing, and sharing with DNOs, debt collectors, ad-tech and analytics providers; that widens the blast radius of any privacy or consent failure just as the ICO says DUAA implementation and tougher PECR penalties are expanding. The token layer is the most legally asymmetric
    part of the stack: Fuse has helpful SEC relief in the United States, yet the UK FCA perimeter is still moving and its promotions regime already requires qualifying-cryptoasset promotions to be fair, clear, and not misleading. That leaves a meaningful chance of UK redesign or geo-fencing even without a current enforcement action.'
