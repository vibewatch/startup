- id: financing-and-execution-risk
  title: Financing and Execution Risk
  body: 'Fresh capital is a mitigant, not a cure-all. The late-2025 round clearly strengthened Fuse’s balance-sheet flexibility and validated investor demand, and Companies House no longer shows an outstanding JPMorgan charge. But the same funding materials also widen the execution burden: launch new supply operations in the US, Ireland, and Spain, push a home-energy operating system, build or acquire far more generation, ship plug-and-play hardware, and layer tokenised rewards into customer behaviour. Public proof of bench strength has not kept pace with that scope. The available record remains founder-heavy, while the most important control functions for this strategy — wholesale risk management, country-by-country regulatory leadership, installation operations, privacy governance, and crypto/compliance oversight — are not publicly visible. The older 2013 legal shell under the current regulated entity is not itself disqualifying, but it reinforces the need to diligence historical liabilities
    and intra-group asset allocation. The underwriting posture therefore should be: credit the live licences, customer traction, fresh financing, and transparent legal terms, but do not underwrite the full scope at face value without private evidence on margins, complaints, installations, and organisational depth.'
