- id: TR004
  title: People / execution risk register
  columns:
  - Role / Function
  - Dependency or Gap
  - Likelihood
  - Severity
  - Mitigation
  - Diligence Path
  rows:
  - - Founder and senior leadership bench
    - Public narrative remains concentrated on the founders while the operating surface now spans supply, trading, installations, hardware, privacy, and token rewards
    - Medium
    - High
    - Fresh capital can fund bench build-out and the company publishes formal terms across multiple products
    - Request current org chart, executive bios, spans of control, and succession plan
  - - Wholesale risk and treasury leadership
    - No public disclosure of who owns hedging, credit, collateral, or bad-debt governance
    - High
    - Critical
    - Scope reduction and tighter product sequencing could contain risk if controls are immature
    - Review risk committee materials, named trading leaders, and treasury controls
  - - Customer operations and complaints leadership
    - Public service friction is visible, but accountable operator depth is not
    - Medium-High
    - High
    - Digital support tooling and app-centric service can scale if operational metrics improve
    - Request complaint dashboards, staffing model, QA scorecards, and vulnerable-customer playbooks
  - - Installation and field-operations leadership
    - Physical installs require safety, scheduling, subcontractor, and warranty management that is not yet publicly evidenced
    - Medium
    - High
    - Accredited products and expert-install claims are positive but insufficient alone
    - Review installer management structure, H&S owner, warranty reserve policy, and regional launch plan
  - - Crypto, legal, and privacy control ownership
    - Rewards, wallets, promotions, and privacy obligations create a cross-functional compliance burden with no public UK control map
    - Medium
    - High
    - Separate legal documents exist and SEC relief narrows one branch of risk
    - Obtain named owners for UK legal, privacy, promotions approval, and token-operations governance
