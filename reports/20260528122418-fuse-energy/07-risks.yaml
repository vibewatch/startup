- id: TR003
  title: Partner / dependency risk register
  columns:
  - Dependency
  - Counterparty / System
  - Role
  - Concentration
  - Failure Scenario
  - Severity
  - Mitigation
  - Residual Exposure
  rows:
  - - Retail-supply licensing and complaint oversight
    - Ofgem / Energy Ombudsman
    - Keeps Fuse authorised and exposes unresolved service failures to formal redress
    - High
    - Complaint backlog, vulnerable-customer failures, or poor signposting trigger escalating scrutiny and remediation cost
    - Critical
    - Dedicated compliance function, evidence packs, redress readiness, proactive complaint remediation
    - High until complaint trend data is produced privately
  - - Distribution and metering operations
    - DNOs, meter operators, smart-meter infrastructure
    - Supply delivery, readings, installations, and service data flows
    - High
    - Meter or network issues drive estimated billing, slower fixes, and customer dissatisfaction
    - High
    - Multiple channel support, better meter-data QA, clearer customer communication
    - Material because Fuse's public service record is still young
  - - Hardware installation and OEM chain
    - Installers plus charger, solar, battery, heat-pump, and boiler vendors
    - Enables physical product expansion and warranty performance
    - High
    - Installer shortage, OEM defect, or poor job quality produces refunds, reputational damage, or safety claims
    - High
    - Accreditation, QA checklists, insurance, and vendor diversification
    - High until defect and incident metrics are disclosed
  - - Token wallet and blockchain infrastructure
    - Privy, blockchain rails, external exchanges
    - Holds and moves Energy Dollars for rewards and redemptions
    - Medium
    - Wallet outage, user key loss, irreversible transfer mistake, or exchange issue disrupts rewards and creates customer harm
    - High
    - Clear disclosures, geo-fencing, wallet support, and constrained rollout
    - Material because consumer support burden remains unclear
  - - Data, marketing, and credit-control vendors
    - Meta, Google Ads, Spotify, analytics providers, CRAs, debt collectors
    - Drive acquisition, attribution, credit checks, and collections
    - Medium
    - Consent error, vendor breach, or inaccurate credit/collections workflow creates privacy or consumer-protection issue
    - Medium-High
    - Vendor contracts, lawful-basis review, cookie controls, and audit rights
    - Material given breadth of personal data described in privacy terms
  - - Expansion capital and investor backing
    - Balderton, Lowercarbon, other capital providers
    - Funds new geographies, hardware, and platform build-out
    - Medium
    - Capital tightens or milestones slip before new products prove unit economics
    - High
    - Preserve cash, phase launches, and sequence new products against clear hurdle rates
    - Material because public ambition still exceeds publicly evidenced control depth
  notes: Dependencies are ordered by how quickly failure can transmit into customer harm, margin pressure, or regulatory scrutiny. Concentration is directional because no private vendor allocation data is public.
