tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Rule / License / Case
  - Jurisdiction
  - Status
  - Likelihood
  - Severity
  - Mitigation
  - Residual Exposure
  - Diligence Path
  rows:
  - - UK retail-supply licence, complaint handling, and consumer-treatment obligations
    - Great Britain / Ofgem
    - Live supply permissions and complaint-handling rules apply now
    - Medium
    - Critical
    - Live licence, published terms, Ombudsman route, digital support surfaces, formal privacy notice
    - Material — public complaint evidence already exists, so control failure would be visible quickly
    - Review Ofgem correspondence, monthly complaint dashboards, deadlock-letter volumes, and any remediation plans for vulnerable-customer support
  - - Complaint-redress signposting and Ombudsman escalation compliance
    - Great Britain / CHS Regulations / Energy Ombudsman
    - Regulation 6 and Ombudsman process are active
    - Medium
    - High
    - Published complaint process, eight-week rule, free external redress, app and email support
    - Material — missed signposting or backlog patterns can turn service issues into formal regulatory problems
    - Test live complaint journeys, sample deadlock notices, and compare internal SLAs against Ombudsman referral timing
  - - $ENERGY rewards perimeter, promotions, and UK authorisation risk
    - United Kingdom / FCA
    - Future regime evolving; promotions regime already active
    - Medium
    - Critical
    - SEC no-action context, consumptive-use drafting, separate rewards terms, potential geo-fencing or approver use
    - High — UK product or marketing redesign may still be required
    - Obtain UK counsel memo, s.21 approver analysis, launch checklist, exchange-listing governance, and customer-facing promotion approvals
  - - Privacy, AI, cookies, and PECR enforcement risk
    - United Kingdom / ICO
    - Current obligations plus DUAA and PECR penalty expansion in 2026
    - Medium
    - High
    - Privacy policy, DPO contact, contractual safeguards, cookie controls, AI governance statements
    - Material — smart-meter, vulnerability, and ad-tech data enlarge any breach or consent failure
    - Run cookie audit, DPIA pack, vendor map, AI governance review, and complaint-procedure readiness check before 19 Jun 2026
  - - Promotion and referral marketing compliance
    - United Kingdom / consumer law and FCA perimeter where applicable
    - Automatic-entry promotions terms live
    - Medium
    - Medium
    - Written promotion terms, opt-out path, prize conditions, privacy cross-reference
    - Moderate — marketing copy and data use can attract scrutiny if not balanced or clearly explained
    - Review all current referral and rewards copy for fairness, disclosures, and lawful-basis mapping
  - - Legacy entity and intra-group liability allocation
    - United Kingdom / corporate and contractual
    - Operating entity predates the 2022 startup narrative
    - Low-Medium
    - Medium
    - Active Companies House filings and named operating entity
    - Moderate — inherited liabilities, contracts, or historical obligations may sit in the licensed shell
    - Trace historical liabilities, intercompany agreements, and any legacy claims or warranties into the current cap table and operating perimeter
  notes: Rows are ordered by residual severity. The biggest legal risk is not a known live enforcement action but the chance that existing retail-supply and token obligations outrun current controls as the scope widens.
  enumerationScope:
    coverage: partial
    basis: Publicly retained UK regulatory, legal, ombudsman, and company-term sources directly relevant to Fuse's retail supply, complaint handling, token rewards, privacy, and corporate shell as of 2026-05-28.
