- id: deployment-friction-hardware-and-controls
  title: 'Deployment friction: hardware dependencies, installation constraints, and service quality'
  body: |-
    Fuse’s newer products are not pure software features; they import real hardware and field-execution dependencies. The store and guides name third-party equipment rather than proprietary devices, notably Easee for home EV charging and Vaillant for heat-pump and boiler equipment. The installation guides also show why deployment can slow. EV charging requires electrical capacity checks, dedicated circuits, compliance with BS 7671, and in many cases DNO notification. Commercial solar adds site surveys, planning issues, and G99 grid-connection approval. Heat-pump installation depends on property suitability, outdoor space, radiator or underfloor compatibility, EPC status, and MCS-certified installers if the customer wants grant support.

    These dependencies make the installer workflow strategically important and create obvious service-risk surfaces. Fuse pushes support through the app and support email, while the engineer app suggests some internal tooling for coordinating field work. But public evidence also shows friction. Resolver’s complaint categories include billing/payment and smart meter installation, and a MoneySavingExpert thread shows that tariff and switching decisions are actively debated by UK consumers. None of that proves structural product failure, yet it does mean Fuse’s differentiation cannot rest on app polish alone. The company has to execute consistently across OEM hardware, installer availability, customer communication, smart-meter data quality, and regulated supply obligations. In product terms, the harder part of the stack is not selling the vision; it is delivering physical installs and support at scale.
