  title: Product architecture map
  type: stack
  layout: wide
  summary: Fuse's stack runs from owned assets and third-party hardware through installer operations into an app-led retail and flexibility control plane.
  data:
    layers:
    - label: Physical assets and devices
      description: Wind and solar sites plus customer-side EV charger, solar, battery, heat-pump and boiler equipment
      detail: Fuse owns generation assets but relies on third-party OEM hardware for many home installs
    - label: Field operations layer
      description: Quote intake, surveys, schedule/pay flow, install tracking, engineer dispatch
      detail: Fuse Engineer app suggests a dedicated internal workflow for installations
    - label: Retail account layer
      description: Switching, gas/electric supply, tariff management, multi-property account handling
      detail: Customer-facing mobile app is the main operating surface
    - label: Control and data layer
      description: 30-minute bill forecasts, real-time billing updates, EV scheduling, support routing
      detail: Most visibly evidenced live software capability
    - label: Flexibility and rewards layer
      description: Off-peak rewards, DER participation logic, export tracking, smart-home features
      detail: Partly live, partly emerging; public retail pages still label some features coming soon
    - label: Market and asset layer
      description: Owned generation, development pipeline, real-time power trading, engineering services
      detail: This is where Fuse argues vertical integration lowers cost and expands optionality
  approximationNotes: The stack is architectural, not a network diagram. It separates clearly evidenced live product surfaces from emerging flexibility/reward layers that still have thinner public proof.
