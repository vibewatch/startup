- id: energy-network-roadmap-and-uncertainty
  title: 'Roadmap and uncertainty: Energy Network, $ENERGY, and how much is live'
  body: |-
    Fuse’s most distinctive roadmap element is the Energy Network / $ENERGY layer, but it should be treated as a sub-feature of a broader flexibility platform rather than as the company’s identity. The strongest official documents retained here are not homepage product pages; they are the careers page and the $ENERGY rewards terms. Together they say users can earn Energy Dollars for off-peak shifting, rooftop-solar deployment, and making DERs available to a wider network, while the careers copy describes a decentralised smart-device platform that helps balance the grid. A November 2025 SEC no-action letter for Fuse Crypto Limited adds regulatory support for token issuance under described conditions. Independent crypto outlets go further and say the network uses a Solana-based token.

    However, the mainstream retail surfaces are more cautious. The homepage still labels smart-home rewards and the Plugs assistant as “Coming soon,” and the retained customer-product pages reviewed here do not themselves foreground Solana or a live consumer crypto workflow. That gap matters. It suggests the blockchain/token layer is better understood today as an emerging flexibility and incentive program attached to the energy platform, not as the already-proven center of the customer experience. In contrast, the roadmap around devices and installs is easier to verify: new 2026 guides cover EV chargers, solar installers, heat pumps, and micro storage, while the EV page advertises a waitlist for on-the-go charging. The practical roadmap is therefore credible, but the DePIN / token narrative remains only partly evidenced on core retail surfaces.
