  rows:
  - - Retail energy supply app
    - Household energy customer
    - Live and scaled
    - App-led switching, billing visibility, multi-property support, gas add-on
    - Need churn, active-account and smart-meter attach metrics
  - - EV charging + tariff orchestration
    - EV-owning household
    - Live for home charging; public charging waitlist still early
    - Autopilot charging into cheapest tariff window plus off-peak rewards
    - Need linked-charger count, supported charger list and public reliability data
  - - Home installations store
    - Household considering electrification
    - Live quote / install sales motion
    - Single storefront spanning charger, solar, battery, heat pump and boiler
