- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Fuse solution
  - Measurable benefit
  - Limitation
  rows:
  - - Switch household supply fast
    - Compare tariff, submit details, wait for supplier handoff
    - Homepage/app-led signup with old-bill upload and automated switching
    - Quoted signup in under 3 minutes; billing forecasts every 30 mins
    - No public retention or switch-success-rate disclosure
  - - Run one account across several homes
    - Track separate bills across multiple logins or suppliers
    - Consumer app and homepage both advertise multiple-property management
    - Fewer manual account handoffs and one login surface
    - No public evidence on how many users actually use multi-property
  - - Charge EV at cheapest times
    - Manually watch tariff windows and plug in overnight
    - Fuse EV schedules charging into cheapest tariff period and rewards off-peak shifting
    - Lower charging cost and less manual intervention
    - Public charger compatibility list and reliability metrics are missing
  - - Order and fulfil home electrification kit
    - Find installer, compare OEMs, coordinate quotes and diaries
    - Fuse store, quote flow, and engineer workflow app coordinate install jobs
    - Single-vendor purchase-to-install path
    - Install bottlenecks still depend on surveys, electricians and OEM supply
  - - Monetise home solar/battery flexibility
    - Export manually with limited visibility
    - Homepage promises export tracking and rewards terms contemplate DER participation
    - Potential extra export / flexibility value on top of supply contract
    - Dedicated public export product page, pricing and screenshots were not retained
  - - Coordinate field operations
    - Engineer schedules and paperwork across email/spreadsheets
    - Fuse Engineer app tracks jobs, manages installs and streamlines workflows
    - Shorter dispatch/admin loop if adopted internally
    - Public scale of engineer usage and job throughput is unknown
  notes: Benefits are directional and based on disclosed product mechanics rather than audited savings data. Limitations name the biggest missing public proof points for each workflow.
