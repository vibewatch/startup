- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Consumer mobile app
    - Switching, billing, gas, multi-property management, support entry point
    - Mobile app store distribution, smart-meter/account back end
    - High customer reliance on app UX, data quality and uptime
  - - Billing / forecasting engine
    - Updates forecasts every 30 mins and app billing 48x/day
    - Meter data, tariff logic, account ledger
    - No public error-rate or reconciliation metrics
  - - EV orchestration logic
    - Schedules charging into cheapest/off-peak windows and manages charger-linked workflows
    - Compatible charger hardware, tariff windows, smart-meter/device connectivity
    - Compatibility, control failures or stale schedules could erode trust
  - - Installer operations workflow
    - Tracks jobs, manages installs and coordinates field execution
    - Engineer workforce, internal mobile tooling, surveys and diaries
    - Internal tool scale is not public; install volume may outgrow workflow capacity
  - - Generation / trading operations
    - Owned assets plus claimed real-time power trading inform hedge and supply economics
    - Projects pipeline, asset uptime, market access, regulatory permissions
    - Public evidence for live trading performance is still mostly career-page level
  - - Rewards / DER logic
    - Calculates Energy Dollars for off-peak shifting and DER participation
    - Fuse Crypto rules, user opt-in, smart-device telemetry
    - Live customer adoption and transparent formulas are not yet visible in product pages
  - - External API / integration surface
    - Supports app authentication and data access according to community reverse engineering
    - Unofficial community knowledge of api.fuseenergy.com endpoints
    - No official API docs, SDKs, compatibility list or public support commitment
  - - Support / compliance layer
    - Routes users to app/email support and governs regulated supply + token terms
    - Support staff, Ofgem licence, legal terms, app store privacy disclosures
    - Complaints around billing or installs can quickly damage the whole stack
  notes: This table mixes observed product surfaces with inferred operating layers. Fuse clearly runs an app-centric stack, but public technical detail drops sharply once the analysis moves from visible UX into back-end integrations or trading systems.
