  evidenceGaps:
  - type: missing-source
    severity: material
    topic: export-docs
    missingEvidence: A dedicated public export or home-battery page with pricing, screenshots, supported hardware and installation scope.
    whyItMatters: The solar-battery layer is central to Fuse's home-energy expansion thesis, but current public evidence is mostly promotional copy rather than operational product documentation.
    diligencePath: Request live product walkthroughs, customer-facing pricing sheets, supported hardware list, and installer SOPs for export / home-battery journeys.
    relatedQuestionRefs:
    - QE007
    - QE027
    relatedTableRefs:
    - TE001
    - TE005
  - type: private-evidence-only
    severity: material
    topic: control-plane-metrics
    missingEvidence: Installed-base counts for linked chargers, solar/battery customers, multi-property accounts, engineer jobs completed, and support SLA metrics.
    whyItMatters: Public product surfaces show functionality, but without usage and service metrics an investor cannot tell whether the control plane is a niche feature set or a scaled operational moat.
    diligencePath: Ask management for monthly active accounts, linked-device counts, install throughput, first-response times, complaint rates, and attach-rate cohorts by product module.
    relatedQuestionRefs:
    - QE005
    - QE016
    - QE026
    relatedTableRefs:
    - TE003
    - TE004
  - type: private-evidence-only
    severity: material
    topic: energy-network-live-state
    missingEvidence: Whitepaper, in-app screenshots, active-user counts, formula details, and any live on-chain or program-usage metrics for the Energy Network / Energy Dollars layer.
    whyItMatters: The tokenised flexibility narrative is Fuse's most unconventional differentiator, but public evidence still does not show how central or widely used it is inside the mainstream customer product.
    diligencePath: Request the current whitepaper, wallet / rewards UX screenshots, active participants, DER types enabled, geography limits, and proof of any live reward redemptions or grid-service revenues.
    relatedQuestionRefs:
    - QE019
    - QE021
    relatedTableRefs:
    - TE001
    - TE005
  - type: missing-source
    severity: minor
    topic: developer-surface-docs
    missingEvidence: Official API docs, compatibility lists, device integration references, or a partner / developer portal.
    whyItMatters: A deeper public technical surface would strengthen claims that Fuse's control plane can become a platform rather than a closed app experience dependent on internal operations.
    diligencePath: Ask for official API or webhook docs, charger / inverter compatibility matrices, installer-facing manuals, and any third-party integration case studies.
    relatedQuestionRefs:
    - QE017
    - QE025
    - QE026
    relatedTableRefs:
    - TE003
