- id: software-control-plane-and-operations
  title: 'Software control plane: switching, billing, device orchestration, and field operations'
  body: |-
    The software/control layer is more concrete than the newest marketing expansions. On the consumer side, the homepage says Fuse can forecast bills every 30 minutes, switch a user in under three minutes, manage multiple homes from one account, and coordinate smart devices for savings and rewards. The Google Play listing adds a stronger maturity signal: 100K+ downloads, a May 2026 update, gas support, multi-property management, and real-time billing updated 48 times per day. The EV page shows an actual control loop rather than a generic tariff promise: Fuse says it can automatically schedule charging into the cheapest period of a customer’s tariff and reward off-peak shifting.

    Operationally, Fuse also appears to have built internal workflow software around installs. A separate Fuse Engineer app on Google Play is explicitly for employees and says it tracks jobs, manages installs, and streamlines workflows. That matters because the company’s downstream model depends on quoting, surveying, scheduling, installing, and supporting physical devices, not just sending monthly bills. The developer signal is still thin and mostly indirect: the only retained community code surface is an unofficial GitHub repository reverse-engineering `api.fuseenergy.com` OTP and token flows. That supports the existence of an app/API back end, but it is not a substitute for official developer docs, compatibility matrices, or integration references. So the control plane looks real, but externally exposed technical documentation remains sparse.
