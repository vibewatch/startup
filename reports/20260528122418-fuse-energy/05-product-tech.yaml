  - - Owned generation assets
    - Retail book and wholesale desk
    - Live at three disclosed UK sites
    - Can hedge some supply economics and support vertical-integration story
    - Need generation-to-supply hedge ratio and asset economics
  - - Development pipeline + engineering services
    - Landowners, grid partners, commercial counterparties
    - Live pipeline claim; engineering services marketed
    - Fuse says it builds to operate with no third parties
    - Need project-stage breakdown, EPC status and services revenue visibility
