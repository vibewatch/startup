company:
  name: Fuse Energy
chapter:
  number: 1
  title: Company Overview
  summary: Fuse Energy is a London-based UK renewable energy supplier founded in 2022 by former Revolut executives Alan Chang and Charles Orr that is trying to own the stack from generation and trading to retail supply, EV charging, home energy hardware, and grid-flexibility software. Public financing coverage says a December 2025 $70 million Series B led by Balderton Capital and Lowercarbon Capital lifted the company to a $5 billion valuation, while household and ARR scale points remained company-originated numbers repeated by third-party media. The main caveats are that those scale metrics are not independently audited, the publicly visible funding history does not fully reconcile to the $170 million total raised claimed on Fuse's careers page, and the regulated UK supply entity predates the 2022 startup narrative.
sections:
  - id: identity-and-business-model
    title: Identity, Positioning, and Business Model
    body: 'Fuse Energy presents itself as a vertically integrated UK energy supplier built to attack household bills by owning more of the energy stack than incumbent retailers. Official materials and investor coverage describe a source-to-socket model spanning renewable site construction, power generation, trading, retail supply, installations, EV charging, and consumer hardware. The current consumer surface is already broader than a plain utility tariff: the homepage sells gas and electricity supply, EV charging optimisation, solar-and-battery export tracking, and digital account management, while product pages and recent financing coverage point toward a home energy operating system and plug-and-play solar-battery hardware. Strategically, that means the company is not just underwriting customer acquisition economics for a retail tariff; it is trying to create a software-and-hardware layer on top of supply that can use generation, trading, and demand flexibility to lower delivered cost. The strongest public evidence for this story is still company-authored or investor-authored rather than independently audited, but the identity is unusually coherent across official pages, investor announcements, and sector reporting.'
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO005
      - CO013
      - CO016
      - CO024
      - CO025
      - CO034
      - CO043
