  - id: TI005
    title: Public Financial Gaps Table
    columns:
      - Missing private metric
      - Impact on judgment
      - Exact diligence path
    rows:
      - - Audited 2025 revenue bridge from billing to ARR
        - Prevents conversion of the headline $400m / £300m claim into underwritable revenue quality
        - Request audited 2025 consolidated income statement plus monthly billed revenue bridge by product and geography
      - - Gross margin by electricity, gas, installations, and hardware
        - Without it, price leadership cannot be distinguished from subsidy or procurement luck
        - Request product-level gross margin waterfall including wholesale cost, network cost, bad debt, and service cost
      - - Burn, runway, and unrestricted cash
        - Current solvency and financing dependency cannot be evaluated from public sources
        - Request treasury schedule showing unrestricted cash, escrow/trust balances, burn, and next financing trigger
      - - Revenue mix by line of business
        - Hard to judge resilience if electricity supply is still overwhelmingly dominant
        - Request split of revenue across electricity, gas, business, chargers, installations, generation, and newer products
      - - CAC, churn, retention, and refund cost
        - Unit economics and complaint rates cannot be converted into payback without cohort data
        - Request acquisition-channel CAC, gross and net churn, complaint resolution cost, and retention by tariff family
      - - Debt / project-finance obligations and covenant package
        - The satisfied JPMorgan charge suggests financing history, but current obligations are not public
        - Request current facilities list, covenant package, collateral, and project-level SPV financing structure
    notes: >-
      These are not cosmetic gaps: each missing metric blocks a different part of the underwriting case, from revenue quality and margins to liquidity and customer economics.
    enumerationScope:
      coverage: exhaustive
      basis: This table enumerates the material public-data gaps that remained after reviewing all retained official, filing, news, review, and regulatory sources for the chapter.
    claimRefs:
      - CI034
      - CI044
      - CI045
      - CI046
      - CI047

