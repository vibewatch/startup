        - Medium; large visible scale but realized gross margin undisclosed
        - Break out billed revenue, procurement cost, bad debt, and gross profit by tariff family
      - - Domestic gas supply
        - Postcode-based gas rollout alongside electricity accounts
        - Per household / kWh
