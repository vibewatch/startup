  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue-gap
      missingEvidence: Audited 2025 consolidated revenue and a bridge from billed energy sales to the repeated ARR claim.
      whyItMatters: Without this bridge, investors cannot judge whether the headline top-line KPI is comparable to ordinary supplier revenue or masks procurement-heavy low-margin throughput.
      diligencePath: Request audited 2025 group financial statements plus monthly billing and revenue-recognition bridge by product line.
      relatedQuestionRefs: [QI006, QI009, QI024]
      relatedTableRefs: [TI003, TI005]
    - type: private-evidence-only
      severity: blocking
      topic: margin-gap
      missingEvidence: Gross margin, supply margin, and contribution margin by electricity, gas, business accounts, chargers, and hardware.
      whyItMatters: Margin is the core underwriting variable for a below-cap retail supplier and is required to test whether vertical integration is truly advantaged.
      diligencePath: Request product-level gross-margin waterfall including procurement cost, network cost, bad debt, refund expense, and service cost.
      relatedQuestionRefs: [QI014, QI023]
      relatedTableRefs: [TI003, TI005]
    - type: private-evidence-only
      severity: blocking
      topic: liquidity-gap
      missingEvidence: Current unrestricted cash, monthly burn, covenant headroom, and runway.
      whyItMatters: Public filings show material balances and intercompany funding, but they do not show how long Fuse can fund growth or absorb a margin shock without new capital.
      diligencePath: Request treasury pack showing unrestricted cash, escrow/trust balances, debt facilities, monthly burn, and base / downside runway.
      relatedQuestionRefs: [QI013, QI015]
      relatedTableRefs: [TI004, TI005]
    - type: private-evidence-only
      severity: material
      topic: funding-dependency
      missingEvidence: Current intercompany loan terms, settlement mechanics, and any new secured or project-finance facilities after the satisfied JPMorgan charge.
      whyItMatters: Parent funding may be stabilizing retail operations today, but it also changes the true independence and cash conversion of the operating entity.
      diligencePath: Request current intercompany debt schedule, facilities list, collateral package, and covenant summary.
      relatedQuestionRefs: [QI011, QI021]
      relatedTableRefs: [TI004, TI005]
    - type: private-evidence-only
      severity: material
      topic: customer-friction
      missingEvidence: CAC, churn, retention by tariff type, refund reserve, and complaint-resolution cost.
      whyItMatters: Cheap tariffs only create durable value if customer acquisition and service economics remain attractive after refunds, communications failures, and support costs.
      diligencePath: Request cohort analysis by tariff family including acquisition channel, CAC, retention, complaint rate, and refund cost.
      relatedQuestionRefs: [QI018, QI019]
      relatedTableRefs: [TI002, TI005]
    - type: missing-source
      severity: material
      topic: generation-hedge
      missingEvidence: A public bridge from owned generation and project assets to the percentage of customer supply volume they actually hedge.
      whyItMatters: Vertical integration can improve margin only if owned generation is material relative to power sold, and current public sources do not quantify that hedge ratio cleanly.
      diligencePath: Request asset-level generation output, internal transfer pricing, and percentage of supplied kWh hedged by owned assets.
      relatedQuestionRefs: [QI005, QI020, QI023]
      relatedTableRefs: [TI001, TI003]
