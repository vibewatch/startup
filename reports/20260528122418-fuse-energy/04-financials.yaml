  - id: TI004
    title: Capital Adequacy Table
    columns:
      - Item
      - Public value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Publicly disclosed equity raised in retained open sources
        - "$148m minimum ($78m in 2022 plus $70m in Dec 2025)"
        - medium
        - Sets the minimum corroborated capital base available from open reporting
        - Confirm whether additional open or undisclosed financings lift the total above $148m
      - - Latest disclosed valuation
        - "$5bn (Dec 2025 round)"
        - high
        - Determines tolerance for future dilution and investor expectations
        - Provide post-money cap table and any subsequent secondary or primary pricing
      - - 2023 cash at bank in Fuse Energy Supply Ltd
        - £45.9m
        - medium
        - Material liquidity figure, but not equivalent to unrestricted group cash
        - Break out unrestricted operating cash versus trust / nominee balances
      - - 2023 working-capital position in supplyco
        - £50.1m current assets vs £48.1m current liabilities; £2.0m net current assets
        - medium
        - Shows retail operations are balance-sheet active rather than asset-light
        - Provide 2024 and 2025 current-asset/current-liability bridge at group level
      - - Related-party current payables (2023)
        - £46.5m
        - medium
        - Implies dependence on intra-group funding and settlement flows
        - Explain settlement terms, maturities, and whether balances are permanent working capital
      - - Long-term parent loans (2023)
        - £9.7m plus £0.46m accrued interest
        - medium
        - Evidence of parent-funded liquidity rather than fully self-funding retail economics
        - Provide current intercompany debt schedule and interest terms
      - - Registered charges
        - 1 JPMorgan charge created May 2023, satisfied Oct 2024; 0 outstanding charges on register
        - high
        - Suggests prior secured financing existed, but no currently registered charge is outstanding
        - Confirm whether project finance, supplier credit lines, or off-balance-sheet facilities now exist
      - - Burn / runway / next-round trigger
        - null
        - low
        - Critical for underwriting solvency and expansion pace
        - Provide monthly burn, covenant headroom, and runway under base / stress cases
    notes: >-
      The most concrete capital-adequacy evidence comes from 2023 statutory accounts and Companies House charges data. Public news coverage explains equity financing, but not unrestricted cash, burn, or covenants.
