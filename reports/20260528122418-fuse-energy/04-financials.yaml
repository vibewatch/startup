  - id: TI002
    title: Pricing / Monetization Table
    columns:
      - Offer
      - Price / contract mechanic
      - List vs realized pricing
      - Discounts / unknowns
      - Source
      - Implication
    rows:
      - - Variable single-rate tariff
        - Standing charge plus unit rate; rates usually change quarterly with market conditions / price-cap resets
        - Official mechanics clear; region-specific live rates not retained here
        - No exit fee in official tariff explainer; realized margin unknown
        - Official tariff explainer + comparison sites
        - Good for acquisition and flexibility, but underwriting requires net supply margin after procurement
      - - Fixed single-rate tariff
        - Unit rate and standing charge fixed for 12-15 months depending listing
        - Comparison sites show terms; official site does not retain a durable tariff card in reviewed pages
        - Several external sources show ~£50/fuel exit fee, but some low-quality pages say no exit fee
        - Uswitch / MoneySuperMarket / Energy Review / MSE forum
        - Price transparency exists, but exit-fee disclosure is noisy and needs customer-contract confirmation
      - - Off-peak fixed tariff
        - Multiple unit rates with off-peak window 00:30-07:30 GMT
        - Official mechanics clear; realized customer savings depend on shifted load
        - Smart-meter compatibility and usage profile determine economics
        - Official tariff explainer
        - Time-of-use structure can deepen retention without proving margin quality
      - - EV tariff
        - Cheap 00:00-05:00 household-wide off-peak window for compatible EV / charger / smart meter users
        - Product mechanics public; live p/kWh depends on region and term
        - Economics rely on demand shifting and charger integration; no disclosed attach-rate economics
        - Official tariff explainer + EV page
        - Supports customer LTV if charger and supply are bundled successfully
      - - Business tariffs
        - Quote-based pricing for business accounts with multi-site management
        - No public list pricing retained in reviewed sources
        - Realized pricing, contract length, and discounts not public
        - Official business-energy page
        - Potentially attractive higher-usage accounts, but underwriting is impossible without win-rate and gross-margin data
      - - Example comparison-site snapshot (mid-2025)
        - Public editorial pages showed standing charges around 59-60p/day and unit rates in the low-20p/kWh range
        - Snapshot only; not a binding tariff sheet
        - Region, meter type, and timing can move rates materially
        - FreePriceCompare / Ofgem context
        - Useful for framing price position, not for modeling realized revenue
    notes: >-
      The pricing picture is strongest on mechanics and weakest on durable public list prices. Independent editorial sources are useful for framing fixed terms and exit fees, but they should not be treated as realized commercial economics.
    enumerationScope:
      coverage: partial
      basis: Rows reflect the distinct tariff and monetization structures evidenced in official pages and independent comparisons through May 2026, not every regional tariff variant.
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI005
      - CI031
