  - id: traction-claims-corroboration
    title: 2025 ARR Claims, Growth, and Public Corroboration
    body: |-
      Fuse's late-2025 financial narrative is largely company-supplied and then repeated by investors and trade
      press. Sifted, TechFundingNews, EU-Startups, and BusinessCloud all carry the same cluster of claims: a
      December 2025 round of $70 million at a $5 billion valuation, approximately 200,000 households supplied,
      annual recurring revenue around $400 million (rendered as €341 million or roughly £300 million in localised
      write-ups), 8x year-on-year growth, and cash-flow positivity before the company enters its fourth year. That
      consistency is useful because it suggests the message was deliberate and central to the round, but it does not
      turn the KPI into audited revenue. None of the accessible public materials reviewed here explains how "ARR"
      maps onto actual billed electricity and gas revenue, whether the figure is gross or net of energy procurement,
      or whether it includes still-small installation, business, or hardware lines.

      Independent corroboration is therefore asymmetric. The market does corroborate that Fuse is a real and rapidly
      expanding retail supplier with aggressive pricing: comparison sites describe it as one of the cheapest offers
      in market during 2025, and Which? places it mid-pack on customer satisfaction while confirming 18 MW of owned
      solar and wind assets. Companies House also confirms that Fuse Energy Supply Limited is an active private
      electricity-trading company that filed 2024 group accounts in December 2025. But the public record still lacks
      the audited bridge investors would need: no accessible revenue recognition policy for the $400 million claim,
      no gross profit disclosure, no cohort churn economics, and no public explanation of how much of the business
      is commodity retail supply versus asset-led or hardware-led monetization. The result is a chapter where top-line
      scale is visible, but revenue quality remains only partially underwritten.
    claimRefs:
      - CI011
      - CI012
