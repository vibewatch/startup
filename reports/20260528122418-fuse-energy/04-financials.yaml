          values:
            - Recurring but operationally working-capital heavy
            - Visible only through entity balance-sheet snapshots, not daily cash cycles
            - Retail liquidity can tighten quickly without disclosure on debtor aging and refunds
        - label: Parent-company balances
          values:
            - Related-party payables and loans already visible in 2023 accounts
            - Well evidenced in filings
            - Suggests support exists, but also that supplyco is not obviously stand-alone self-funded
        - label: External equity financing
          values:
            - Discrete, milestone-driven injections
            - Strong public evidence for 2022 and Dec 2025 rounds
            - Buys growth time, but does not prove steady-state margin
        - label: Prior secured financing
          values:
            - JPMorgan charge created 2023 and satisfied 2024
            - Well evidenced in Companies House charges register
            - Indicates financing sophistication, but current facilities remain undisclosed
        - label: Renewable asset capex
          values:
            - Upfront, long-duration investment cycle
            - Partial evidence via 2023 acquisitions and 450 MW pipeline claim
            - Raises capital intensity beyond a pure app-led supplier model
        - label: Group runway / covenant headroom
          values:
            - Immediate underwriting variable
            - Material disclosure gap
            - Biggest blocker to assessing financing dependency and next-round timing
    approximationNotes: >-
      Matrix cells synthesize filings, official pages, and funding coverage into an operating map. They are analytical judgments, not company-disclosed metrics.
    claimRefs:
      - CI013
      - CI015
      - CI017
      - CI018
      - CI019
      - CI021
      - CI024
      - CI045

callouts:
  - calloutType: risk
    title: ARR is the headline KPI, but not an audited revenue bridge
    body: >-
      Multiple late-2025 outlets repeat the same company-supplied ARR, growth, and cash-flow-positive narrative,
      which is helpful for triangulating what management told the market. But none of the accessible public sources
      reviewed here converts that KPI into audited billed revenue, gross profit, or segment mix. Until management
      provides that bridge, the top-line number should be treated as traction context rather than fully underwritten
      revenue quality.
    claimRefs:
      - CI026
      - CI027
      - CI046
      - CI047

  - calloutType: risk
    title: Supplyco liquidity is visible, but much of it is not clearly unrestricted
    body: >-
      Fuse Energy Supply Limited's 2023 accounts show substantial cash, yet the notes say most of that balance was
      held on trust for the ultimate parent while related-party payables and parent loans were also material. That
      means public filings demonstrate real financial activity, but they do not show a clean pool of unrestricted cash
      available to absorb retail margin shocks, refund spikes, or asset-build overruns.
    claimRefs:
      - CI014
      - CI017
      - CI018
      - CI019

  - calloutType: insight
    title: Vertical integration may support cheaper tariffs, but its margin advantage is still unproven publicly
    body: >-
      Fuse likely does have more levers than a plain reseller: owned generation, project development, EV charging,
      business accounts, and future hardware could all improve customer lifetime value and procurement flexibility.
      The public evidence, however, still implies that grid-sourced energy and operating execution dominate near-term
      economics. Owned generation is real but currently small relative to supply scale, and complaints around refunds,
      readings, and communication suggest service frictions could offset some of the supposed cost advantage.
    claimRefs:
      - CI008
      - CI028
      - CI029
      - CI036
      - CI048

