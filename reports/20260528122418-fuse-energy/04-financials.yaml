  - id: capital-structure-working-capital
    title: Capital Structure, Working Capital, and Financing Dependency
    body: |-
      Publicly accessible financing evidence supports a meaningful but not fully transparent capital base. The open
      round chronology available in retained news sources is straightforward: a $78 million 2022 raise and a $70
      million December 2025 raise, implying at least $148 million of publicly disclosed equity capital reviewed here.
      Mercom, Sifted, UK Tech News, and EU-Startups all corroborate the latest round and its $5 billion valuation.
      That is enough to conclude Fuse is well-backed for a young supplier, but not enough to conclude the group is
      self-funding or lightly capitalized. The strategy itself—own generation, project development, supply,
      installations, hardware, and international expansion—suggests more capital intensity than a pure software-led
      retail utility challenger.

      The strongest balance-sheet evidence comes from Fuse Energy Supply Limited's 2023 statutory accounts rather than
      from the fundraising coverage. Those accounts show £50.1 million of current assets against £48.1 million of
      current liabilities, £45.9 million of cash at bank, £10.1 million of long-term creditors, £46.5 million of
      related-party payables falling due within a year, and £9.7 million of long-term borrowings from the ultimate
      parent. Crucially, the notes state that £45.7 million of the cash was held on trust for the ultimate parent,
      which means the headline cash number should not be read as unrestricted liquidity available to underwrite retail
      losses or capex. The same filing also shows £14.0 million spent acquiring two solar subsidiaries plus an earlier
      £0.54 million renewables acquisition, while the current Companies House charges register shows one JPMorgan
      charge created in 2023 and satisfied in October 2024 with no outstanding charges remaining. Put together,
      those data points imply real working-capital management, prior secured financing, and ongoing parent support—yet
      still no public burn, runway, or covenant disclosure.
    claimRefs:
