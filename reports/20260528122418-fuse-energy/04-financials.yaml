slug: fuse-energy
runDate: "2026-05-28"
company:
  name: Fuse Energy

chapter:
  number: 4
  title: Financials
  summary: >-
    Fuse Energy's public financial story is unusually top-line heavy: late-2025 coverage repeats a company-supplied
    ARR figure around $400 million / £300 million, 8x growth, cash-flow positivity, and 200,000 supplied households,
    but no accessible public source reviewed here bridges those claims to audited revenue, gross margin, burn, or
    unrestricted cash. Public filings instead show a retail-energy entity with meaningful working-capital balances,
    related-party funding, solar-project investments, and no outstanding registered charge after a JPMorgan facility
    was satisfied in 2024, implying a vertically integrated model with real capital needs but opaque economics.

sections:
  - id: revenue-model-pricing
    title: Revenue Model and Pricing Mechanics
    body: |-
      Fuse Energy's publicly visible monetization stack is broader than a conventional electricity-supply tariff, but
      the only clearly evidenced current cash engine is retail energy supply. Official surfaces show fixed,
      variable, multi-rate, and EV tariffs for households, plus business-energy offers, EV charging, and multi-site
      account management. The March 2026 tariff explainer is useful on mechanics: Fuse prices bills as a standing
      charge plus unit rate, updates variable tariffs quarterly, uses 00:30-07:30 for off-peak fixed periods, and
      applies an EV off-peak window from 00:00-05:00 across the entire household. Independent comparison sites then
      corroborate the commercial framing—below-cap variable positioning, fixed terms, multi-rate options, and gas
      rollout by postcode—without resolving the key underwriting question of realized margin.

      The second important distinction is between revenue streams and marketing adjacencies. Official pages and the
      blog show Fuse is trying to monetize not only household electricity, but also domestic gas, business supply,
      EV charger installation, smart charging, and future home-energy products such as solar, batteries, heat-pump,
      and boiler journeys. That supports a thesis of higher lifetime value per household, especially if cheaper
      off-peak charging and business accounts improve retention. But there is no public breakdown of how much current
      revenue comes from electricity supply versus gas, installations, charger sales, or still-emerging products.
      Price transparency is also incomplete: Fuse explains tariff mechanics clearly, yet actual regional list prices,
      discounts, and exit-fee rules are still mostly visible through comparison sites rather than a durable official
      tariff sheet.
