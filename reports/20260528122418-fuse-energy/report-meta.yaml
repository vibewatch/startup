summary:
  headline: >-
    Fuse Energy is a founder-led, vertically integrated UK energy challenger
    with credible traction and product breadth, but the reported $5 billion
    valuation is hard to underwrite from public evidence because ARR quality,
    margins, liquidity, and private-round terms remain opaque.
