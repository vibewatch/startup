companyProfile:
  summary: >-
    Fuse Energy is a London-based UK energy startup founded in 2022 by former
    Revolut executives Alan Chang and Charles Orr. The company is building a
    vertically integrated model spanning renewable generation, trading, retail
    supply, EV charging, home electrification, and an emerging flexibility /
    rewards layer. Publicly retained sources support that Fuse reached real
    national household scale by late 2025 and raised a $70 million Series B at
    a reported $5 billion valuation, but the most important operating and
    underwriting KPIs — especially customer count quality, ARR quality, margins,
    liquidity, and cap-table terms — remain only partially visible in public.
