summary:
  headline: Fuse Energy 是一家创始人主导、纵向整合的英国能源挑战者，牵引可信、产品面也宽；但公开证据难以支撑据报 $5B 估值，因为 ARR 质量、利润率、流动性和私募轮条款仍不透明。
