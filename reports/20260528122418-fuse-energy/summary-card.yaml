  topStrengths:
    - >-
      Coherent vertical-integration thesis spanning generation, trading, regulated supply, EV charging, installations,
      and home-energy software / rewards.
    - >-
      Real late-2025 commercial traction is directionally supported by repeated third-party coverage of 200,000+
      households and roughly $400 million ARR, even if those KPIs still route back to company disclosure.
    - >-
      Strong investor validation: Balderton Capital and Lowercarbon Capital led a reported $70 million Series B at a $5
      billion mark in the company's third year.
    - >-
      Tangible physical footprint with 18 MW of operating UK wind/solar assets, 18.9 GWh disclosed generation, a 450 MW
      development pipeline, and a May 2026 acquisition of the 20 MW Cwm Ifor solar farm.
    - >-
      Digital-first customer proposition appears competitive on onboarding, pricing, and app experience, with strong
      public app-store and Trustpilot signals.
  topRisks:
    - >-
      The current price implies roughly 12.5x reported ARR, far above public retail-energy comparables and only
      defensible if the denominator behaves more like software or utility-OS revenue.
    - >-
      Public evidence does not provide an audited bridge from ARR to statutory revenue, gross profit, contribution
      margin, or cash conversion, leaving margin quality and liquidity opaque.
    - >-
      Customer-service and regulatory execution risk is already visible in public evidence, including 16% formal
      complaint incidence, weak support for vulnerable customers, and recurring billing / refund friction.
    - >-
      Current cap table, security type, liquidation preferences, and primary-versus-secondary mix of the December 2025
      round are undisclosed, so downside protection cannot be modeled responsibly.
    - >-
      Scope expansion across new geographies, physical installs, hardware, and tokenized rewards stretches operating
      controls and compliance far beyond a simple retail tariff business.
  unresolvedGaps:
    - Audited bridge from reported ARR to statutory revenue, gross profit, contribution margin, and cash conversion.
    - >-
      Current cap table, security type, liquidation preferences, and primary-versus-secondary split for the December
      2025 round.
    - Current unrestricted cash, runway, collateral / hedging policy, and product-level margin waterfall.
    - >-
      Churn, cohort retention, CAC payback, complaint cost, and attach rates for EV, hardware, and software-like
      products.
    - >-
      2026 complaints, Ombudsman / Ofgem interactions, and org depth across trading, compliance, customer operations,
      and installations.
