  rows:
  - - Fuse Energy
    - Challenger supplier + emerging DER stack
    - Launched 2023; £52.4m raised; 18MW owned wind/solar
    - Retail supply, EV charging, smart-device control, solar / battery export tracking
    - Clean app-first UX plus early vertical-integration narrative
    - Support maturity and software scale remain unproven
  - - Octopus / Kraken
    - Scaled retail supplier + utility software platform
    - Largest electricity supplier in GB; Kraken serves 90m+ accounts
    - Retail supply, EV tariffs, heat pumps, solar, batteries, export, utility OS
    - Best full-stack blend of price, installation, and orchestration
    - Retail price alone is still copyable
  - - OVO / Kaluza
    - Scaled supplier + energy-intelligence platform
    - 3.6m+ homes; Kaluza has 400+ integrations
    - Retail plans, Charge Anytime, solar, batteries, heat pumps, V2G / flexibility
    - Strong app, EV bundle, and software adjacency
    - Weak Which customer scores dilute brand advantage
  - - Good Energy
    - Green premium supplier
    - B Corp; 3,000+ independent generators; 88% half-hour match
    - Retail supply, export tariffs, solar, batteries, EV chargers, heat-pump partner installs
    - Highest renewable-sourcing credibility among mainstream green peers
    - Less software depth and less scale than Octopus / OVO / incumbents
  - - Ecotricity
    - Generation-led green supplier
    - 30 years; 24 wind parks, 74 windmills, and 16.5MW newer sun parks
    - Retail supply, EV tariff, own-generation story, storage investment
    - Strongest green-identity moat and top Citizens Advice score
    - Green Variable tariff sits outside the cap and can look expensive
  - - E.ON Next
    - Incumbent retail supplier with smart-tariff stack
    - 5m+ customers; 146k+ five-star reviews
    - Retail supply, EV tariff, heat-pump tariff, AI battery tariff, solar
    - Mainstream scale with concrete smart-tariff packaging
    - Green brand less distinctive than Good Energy or Ecotricity
  - - EDF
    - Incumbent retail supplier
    - Large incumbent brand; EV and demand-response products
    - Retail supply, EV tariff, Sunday Saver flexibility, solar / battery economics
    - Can cross-sell competitive EV pricing inside a large balance sheet
    - Service ratings lag better-performing challengers
  - - British Gas / Hive
    - Incumbent supplier + smart-home adjacency
    - Hive says 2m customers
    - Retail supply, EV-linked Power+, smart-home devices, thermostat / plug ecosystem
    - Installed-home presence and cross-sell reach
    - Weaker utility-software moat than Kraken or Kaluza
  - - Status quo / mix-and-match
    - Substitute
    - Default option for most households
    - Cap-linked tariff plus separate charger, solar, or heat-pump vendors
    - Lowest cognitive load for cautious buyers
    - Fragmented experience and no unified optimisation layer
  notes: Rows mix direct suppliers, integrated climate-tech peers, and the status-quo substitute because buyers can solve the same home-energy job in multiple ways.
