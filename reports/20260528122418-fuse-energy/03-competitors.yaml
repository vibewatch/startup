company:
  name: Fuse Energy
chapter:
  number: 3
  title: Competitors
  summary: Fuse Energy competes less against one single startup than against a ladder of UK retail-energy and home-electrification peers. Octopus sets the toughest full-stack benchmark because it combines below-cap retail pricing, hardware installation, and Kraken-scale flexibility software, while OVO/Kaluza, E.ON Next, EDF, British Gas/Hive, Good Energy, and Ecotricity each attack parts of the same customer job. Fuse’s current edge is a clean challenger proposition that bundles low-cost supply with early EV, smart-home, and export tooling, but its moats remain thin where customer support, renewable-sourcing credibility, and software scale can be copied or outspent.
sections:
- id: landscape-and-benchmarks
  title: 'Landscape: direct suppliers, climate-tech peers, and the status quo'
  body: 'Fuse is not just competing against another digital tariff startup. The real landscape spans (1) scaled retail suppliers such as Octopus, OVO, E.ON Next, EDF, British Gas, Good Energy, and Ecotricity, (2) climate-tech software layers such as Kraken and Kaluza that make those suppliers smarter, and (3) the status-quo alternative of staying on a cap-linked tariff while buying EV, solar, battery, or heat-pump products separately. Ofgem says six large companies still control 91% of the domestic market, and Octopus is already the largest electricity supplier and the second-largest gas supplier in Great Britain. That matters because Fuse is trying to break into a market where distribution, customer trust, and tariff experimentation are already concentrated. Fuse’s positioning is clear: app-first switching, low headline prices, early vertical integration into generation and smart-home control, and a promise to make the household account feel simpler than the incumbent bundle. But the benchmark
    is already high, especially once software, installation, and service depth are taken seriously rather than treating supply as a pure commodity.'
