- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Supplier
  - Default-supply stance
  - Smart / off-peak proposition
  - Hardware or export hook
  - Implication
  rows:
  - - Fuse
    - Markets itself as below-cap and cheap on fixed deals
    - Claims up to 90% EV charging savings
    - Exports via solar / battery tracking; charger install
    - Strong acquisition messaging, but exact postcode-normalised quotes remain hard to compare
  - - Octopus
    - Says standard prices have stayed below the cap
    - Go gives cheap 00:30-05:30 charging; Intelligent Go claims 68% savings
    - Heat pumps, solar, batteries, Flux / Outgoing / SEG
    - Most complete retail-to-home-electrification price ladder
  - - OVO
    - SVT has no exit fee and tracks cap / wholesale moves
    - Charge Anytime at 14p/kWh pay-as-you-go or monthly bundles
    - Solar+battery, EV charging, Greener Electricity upgrade
    - Compelling EV packaging, but general value perception is weaker
  - - Good Energy
    - Green premium rather than cheapest-default stance
    - Markets overnight EV charging for less
    - Solar, batteries, EV chargers, export tariffs, heat-pump partners
    - Competes on green credibility more than on absolute price
  - - Ecotricity
    - Green Variable is explicitly cap-derogated
    - 1 Year Fixed EV for smart-meter users
    - Generation-led green narrative and storage build-out
    - Ethical pricing is differentiated but can price above mass-market leaders
  - - E.ON Next
    - Mainstream retail pricing with smart-tariff overlays
    - 8p/kWh whole-home EV off-peak and AI battery / heat-pump tariffs
    - Solar packages from £4,995; SEG and battery options
    - Shows large suppliers can still be innovative on price mechanics
  - - EDF
    - SVT based on price cap
    - EV tariffs at 6.49-6.99p/kWh for 7 hours; Sunday Saver challenges
    - Solar / battery bundle assumptions and export tariff
    - Aggressive EV pricing, but proposition leans more offer-led than brand-led
  - - British Gas / Hive
    - Mainstream incumbent tariff positioning
    - Power+ only with a British Gas electricity tariff
    - Hive smart-home ecosystem and EV scheduling
    - Installed-base cross-sell matters more than pure tariff novelty
  notes: Public pricing signals are not fully comparable because unit rates still vary by region, payment method, meter type, and quote path even where products are clearly marketed.
