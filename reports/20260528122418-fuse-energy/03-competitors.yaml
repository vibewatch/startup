callouts:
- calloutType: strength
  title: Fuse does have a credible acquisition wedge
  body: 'Fuse’s pitch is understandable to a retail household: switch quickly, pay less, charge your EV cheaply, and manage more of the home from one app. That is a real competitive advantage at the top of the funnel even if it is not yet a durable moat.'
  claimRefs:
  - CP003
  - CP004
  - CP043
- calloutType: risk
  title: The most defensible moat belongs to software layers, not retail tariffs
  body: Kraken and Kaluza matter more than another few pence on a variable tariff because they determine how fast suppliers can launch smart products, control devices, and lower cost to serve. Fuse is directionally moving that way, but public proof remains far thinner than for those platforms.
  claimRefs:
  - CP015
  - CP023
  - CP040
  - CP042
- calloutType: insight
  title: Green branding cuts both ways for Fuse
  body: Owned generation helps the story, but Good Energy and Ecotricity already have stronger public credentials in renewable matching or own-generation identity, and Which’s sustainability assessment leaves Fuse open to criticism until the company can show a materially higher share of customer demand covered by its own clean power.
  claimRefs:
  - CP009
  - CP024
  - CP027
  - CP041
