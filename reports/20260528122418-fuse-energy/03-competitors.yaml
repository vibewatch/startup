- id: pricing-product-and-installation
  title: Pricing, product breadth, and the installation layer
  body: 'The most important competitive lesson is that headline retail pricing is not where durable differentiation lives. Ofgem’s cap still compresses standard variable tariffs, so suppliers now fight for attention through off-peak EV charging, export tariffs, solar-and-battery bundles, and heat-pump-specific plans. Fuse’s claim that it beats the price cap and can save up to 90% on EV charging is strong acquisition messaging, but Octopus, OVO, EDF, and E.ON Next already publish concrete smart-tariff propositions with defined off-peak windows and hardware eligibility. Octopus stretches furthest across the stack: Go for EV charging, Cosy for heat pumps, Flux and Outgoing for solar and export, plus in-house installation. OVO combines fixed or variable retail plans with Charge Anytime, solar-and-battery packages, and Kaluza-linked intelligence. E.ON Next and EDF show that incumbents can also productize EV, heat-pump, solar, and battery economics inside mainstream retail brands. Good Energy
    and Ecotricity are less software-deep, but both have credible green-home installation stories. That makes Fuse’s commercial wedge real but not exclusive: the customer already has multiple ways to buy a smart, greener home-energy bundle from suppliers with bigger installed bases.'
