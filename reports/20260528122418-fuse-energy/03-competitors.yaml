  evidenceGaps:
  - type: missing-source
    severity: material
    topic: postcode-normalised-pricing
    missingEvidence: Side-by-side live quotes for the same postcode, annual consumption, payment method, and meter type across Fuse, Octopus, OVO, Good Energy, Ecotricity, British Gas, EDF, and E.ON Next.
    whyItMatters: Public marketing pages describe headline rate mechanics but still do not support a clean like-for-like total annual bill comparison.
    diligencePath: Run live quote collection for a fixed postcode and usage pack, then archive tariff information labels or screenshots from the same day.
    relatedQuestionRefs:
    - QP019
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: installation-unit-economics
    missingEvidence: Hardware attach rates, installed-system gross margins, installer productivity, and CAC/payback for EV, solar, battery, and heat-pump sales across Fuse and peers.
    whyItMatters: Without unit economics, it is impossible to know whether a broader home-energy stack improves lifetime value or simply adds operational complexity.
    diligencePath: Request cohort economics by product line, attach rate by acquired supply customer, and installation margin bridge for each attached product.
    relatedQuestionRefs:
    - QP020
    relatedTableRefs:
    - TP002
    - TP004
  - type: private-evidence-only
    severity: material
    topic: fuse-flexibility-scale
    missingEvidence: Active smart-device count, exported kWh, battery dispatch volumes, customer savings, and churn outcomes for Fuse’s orchestration layer.
    whyItMatters: Fuse’s long-term moat likely depends on proving real operating-system value rather than just marketing a future smart-home feature set.
    diligencePath: Ask for monthly active orchestrated homes, connected devices by class, dispatched energy volumes, and gross margin uplift versus supply-only customers.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP004
