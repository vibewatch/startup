- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Fuse moat claim
  - Evidence today
  - Copy / displacement threat
  - Severity
  - Mitigation or diligence ask
  rows:
  - - Low-cost digital retail acquisition
    - Below-cap and cheap-fixed messaging; app-first signup
    - Octopus, OVO, and E.ON already market digital self-service and smart tariffs at larger scale
    - High
    - Request postcode-normalised win-rate data and switching conversion by channel
  - - Vertical integration into generation + supply
    - 18MW owned wind / solar and reinvestment narrative
    - Ecotricity and Good Energy have stronger renewable-credibility stories already
    - Medium-High
    - Request plan, timing, and economics for additional owned generation
  - - EV-led home-energy wedge
    - Fuse EV and charger installation claims
    - Octopus, OVO, EDF, and E.ON already publish harder EV tariffs and bundles
    - High
    - Request active EV users, charger install volume, and net retention of EV households
  - - Smart-home orchestration
    - Fuse markets smart-device management and export tracking
    - Kraken and Kaluza operate at much larger device and utility scale
    - Very high
    - Request live-device count, dispatch MWh, and customer savings proof
  - - Green brand
    - Eco-focused messaging and owned assets
    - Which says only 0.2% of renewable electricity sold came from its own portfolio data set
    - High
    - Clarify fuel-mix methodology and current matched-clean-power metrics
  - - Customer-experience simplicity
    - App-led account management and 3-minute switching promise
    - Which flags no phone support and weak vulnerable-customer support
    - High
    - Show complaint trend, contact resolution time, and PSR / vulnerability roadmap
  - - New-category freshness
    - First new supplier after the crisis can feel novel to customers
    - Novelty fades once large rivals copy messaging and bundles
    - Medium
    - Prove brand recall and CAC advantage before copycats normalize the pitch
  - - Potential status-quo disruption
    - One-account proposition is cleaner than mix-and-match home-energy shopping
    - Many buyers may still prefer a standard tariff plus separate installers
    - Medium
    - Test willingness to buy multi-product bundles rather than single-product adoption only
  notes: This register focuses on durability, not just differentiation; several Fuse strengths matter for acquisition but are still vulnerable to copy by better-funded software or retail platforms.
