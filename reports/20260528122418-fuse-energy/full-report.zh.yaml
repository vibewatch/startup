      - number: '5.2'
        title: 软件控制平面：切换、账单、设备编排与现场运营
        blocks:
          - type: paragraph
            body: >-
              软件 / 控制层比最新的营销扩张更具体。消费者侧，首页称 Fuse 可每 30 分钟预测账单、在三分钟内帮用户切换、用一个账户管理多套住房，并协调智能设备以实现节省和奖励。Google Play
              条目提供了更强成熟度信号：100K+ 下载、2026 年 5 月更新、支持天然气、多房产管理，以及每天更新 48 次的实时账单。EV 页面展示的是真实控制回路，而不是泛泛的资费承诺：Fuse
              称可自动把充电安排到客户资费中最便宜的时段，并奖励离峰转移。


              运营上，Fuse 似乎也围绕安装搭建了内部工作流软件。Google Play 上另有一款 Fuse Engineer
              app，明确面向员工，称可跟踪任务、管理安装并简化工作流。这很重要，因为公司的下游模式依赖报价、勘察、排期、安装和支持实体设备，而不只是发送月度账单。开发者信号仍薄且大多间接：留存的唯一社区代码界面，是一个非官方
              GitHub 仓库，对 `api.fuseenergy.com` 的 OTP 和 token 流程进行逆向工程。它支持 app/API
              后端存在，但不能替代官方开发者文档、兼容性矩阵或集成参考。因此，控制平面看起来真实，但对外暴露的技术文档仍稀疏。
