      - number: '6.3'
        title: 庞大家庭客户基数可信，但 200k+ 仍应视为公司披露的规模点
        blocks:
          - type: paragraph
            body: >-
              增长证据有意义，但没有经过清晰审计。Tech Funding News 和 BusinessCloud 均在 2025 年 9 月报道，Fuse 在夏季从 50,000 户快速跃升至 100,000 户、再超过
              150,000 户后，家庭客户数已突破 150,000。到 2025 年底和 2026 年初，Tech Funding News、EU-Startups 和 SwitchInsights
              都在重复英国客户基数已跨过 200,000 户、ARR 达到约 $400
              million。这个说法跨多个领域、持续数月被重复，值得重视。但信源链条看起来仍回到公司和投资方表述，而不是可独立核验的活跃家庭、电表点位或已开票账户监管台账。最好的外部合理性检查来自评论量代理指标：2026 年
              1 月 Trustpilot 快照引用 3,223 位客户，App Store 页面显示 500 条评分，Which? 调研 112 位客户。这些信号方向上不支持一个很小的客户基数，但不能精确证明
              200,000。审慎解读是：Fuse 显然已达成真实的全国消费者规模，但确切家庭数在公开证据中只有中等支撑。
