      - number: '7.4'
        title: 融资与执行风险
        blocks:
          - type: paragraph
            body: >-
              新资本是缓释因素，不是万能药。2025 年底轮次显然增强了 Fuse 的资产负债表灵活性，也验证了投资者需求；Companies House 也不再显示未清偿的 JPMorgan
              抵押登记。但同一批融资材料也放大了执行负担：在美国、爱尔兰和西班牙推出新的供能运营，推动家庭能源操作系统，建设或收购更多发电资产，交付即插即用硬件，并把代币化奖励嵌入客户行为。公开层面对团队厚度的证明没有跟上这个范围。可用记录仍然创始人色彩很重，而这一战略最重要的控制职能——批发风险管理、逐国监管负责人、安装运营、隐私治理和加密
              / 合规监督——公开层面并不可见。当前受监管实体下较老的 2013
              年法律壳本身并不构成否决项，但它强化了尽调历史负债和集团内资产分配的必要性。因此，承销姿态应是：认可现行牌照、客户牵引、新融资和透明法律条款，但如果没有关于利润率、投诉、安装和组织深度的私有证据，不要按表面价值承销全部范围。
