  - id: FR001
    title: 风险热图 — Fuse Energy 风险版图按可能性和影响划分
    type: matrix
    layout: standard
    summary: 在纳入许可、条款、资本和产品设计方面可见的公开缓释因素后，按发生可能性和业务影响映射 Fuse 优先级最高的风险。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 关键影响
          values:
            - 旧壳负债意外暴露
            - $ENERGY 英国监管边界失守；批发利润率冲击
            - 零售服务 / 投诉管控失灵
        - label: 高影响
          values:
            - 隐私 / PECR 罚款或同意机制失效
            - 安装质量 / 安全事件；营运资金压力
            - 账单 / 智能电表质量故障
        - label: 中等影响
          values:
            - ''
            - 钱包 / 交易所链条依赖宕机
            - 多国、多产品扩张拉扯执行力
    approximationNotes: 可能性和影响是基于留存公开记录的分析判断；Fuse 没有发布完整企业风险登记册。
