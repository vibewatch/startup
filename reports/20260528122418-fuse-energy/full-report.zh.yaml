  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: Fuse 的公开证明栈在定价和 app 易用性上最强；在披露留存、弱势客户支持和经独立验证的客户数证据上更弱。
    data:
      columns:
