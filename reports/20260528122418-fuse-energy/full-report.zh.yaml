      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 当前价格已经假设软件上行
            body: >-
              Fuse 未来也许配得上溢价倍数，但保留证据集尚未证明报告的 $400 million 分母具有 Kraken 式质量。在 $5 billion
              估值上，投资者是在公开记录显示平台经济性之前，就为未来状态平台付费。
            calloutType: recommendation
            claimRefs:
              - CV016
              - CV025
              - CV031
              - CV041
          - type: callout
            title: 这不是一个零牵引故事
            body: 公司有真实投资者支持、真实获客动能，以及连贯的一体化产品故事。问题不是 Fuse 是否存在或是否重要，而是公开证据是否足以支撑有纪律地支付当前轮次价格。
            calloutType: strength
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
          - type: callout
            title: 零售经济性可以很快压垮叙事估值
            body: 投诉发生率、弱势客户支持偏弱、信托持有现金和关联方资金都在提醒：能源供给是一门运营和财务要求都很高的生意。如果 Fuse 的经济性仍像公用事业，从 $5 billion 标记向下的空间会非常大。
            calloutType: risk
            claimRefs:
              - CV008
              - CV012
              - CV013
              - CV033
              - CV037
          - type: callout
            title: 乐观情景需要附加销售，而不只是换约
            body: 只有当 Fuse 能把低价资费获客转化为更高毛利的发电、EV、出口、硬件或软件变现时，公开逻辑才能支撑当前估值。没有这种附加销售，最好的保留可比公司是公开零售商，而不是公用事业软件平台。
            calloutType: assumption
            claimRefs:
              - CV017
              - CV029
              - CV031
              - CV035
