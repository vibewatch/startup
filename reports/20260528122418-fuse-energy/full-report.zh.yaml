      - number: '2.4'
        title: 增长驱动、约束与公开数据仍无法回答的问题
        blocks:
          - type: paragraph
            body: >-
              需求驱动异常一致。零售电力仍高度价格敏感；Ofgem 和 Energy UK
              都显示客户仍会对价格上限变化作出反应，最便宜资费仍明显低于标准浮动资费。与此同时，供给堆栈正在变清洁：可再生能源已供应英国大部分电力，太阳能安装仍在快速增长，政府政策也在推动智能电表、半小时结算、更好的资产可视化，以及正式的地方加全国灵活性市场标准。直白地说，英国正在建设一家垂直整合的零售加灵活性公司所需的实体
              DER 基础，以及软件和市场轨道。


              约束同样真实。Ofgem 自己的市场回顾显示，家庭业务利润很薄且在下滑，客户债务达 £4.48 billion，3.6 million 客户负债，国内市场中六大供应商仍控制 92%
              份额。这意味着，在灵活性上行出现之前，挑战者仍需要资本去支撑对冲、客服和营运资金。安装和并网摩擦也重要：屋顶太阳能或电池需要业主行动和安装商；储能与需求项目仍面临排队和基础设施延误。最后，公开数据质量不均。官方统计在账单、家庭数、切换、太阳能更新和电池序列存在性上很强，但在绿色资费切换份额、双边
              PPA 支出，以及表后储能一站式收入视图上较弱。这些缺口不应被掩盖：即便顶层需求故事有吸引力，它们也会压低 SAM / SOM 算术的置信度。
