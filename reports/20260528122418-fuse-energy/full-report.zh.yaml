  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 驱动 / 约束
      - 类型
      - 方向
      - 时点
      - 对 Fuse 的影响
      - 尽调需核实
    rows:
      - - 价格上限波动和与燃气挂钩的电价
        - 驱动
        - ↑ 零售切换和电价比价
        - 立即 / 反复出现
        - Fuse 可用更便宜的电价和分时电价吸引注意力
        - 验证价格上限重置后的实际留存，而不只是获客
      - - 可再生能源已占英国电力 >50%
        - 驱动
        - ↑ 低成本清洁供给可得性
        - 当前
        - 支撑 Fuse 的叙事：更便宜的清洁电力可供给零售和 DER 产品
        - 厘清 Fuse 供给中多少来自自有资产、合约采购或证书背书
      - - 太阳能装机基础增长
        - 驱动
        - ↑ 上网、电池和监控的挂载机会
        - 当前到中期
        - 更多屋顶带来更多潜在软件用户和上网电量用户
        - 衡量供电客户转化到太阳能 / 电池产品的挂载率
      - - 灵活性路线图 + 市场促进者 + 数字化
        - 驱动
        - ↑ VPP / DER 收入轨道正式化
        - 2025-2030
        - 提高客户资产变成可调度市场资产的概率
        - 核实实际市场准入、结算经济性和参与者付款水平
      - - 智能电表和分时电价采用
        - 驱动
        - ↑ 软件驱动的电价优化
        - 当前
        - 让 Fuse 式 EV、多费率和自动化体验更有价值
        - 评估智能电表质量，以及半小时结算是否足够快地扩大供给
      - - 供应商利润压缩
        - 约束
        - ↓ 利润空间
        - 当前
        - 若债务、对冲和服务成本吃掉经济性，便宜获客还不够
        - 评估营运资本、债务敞口和对冲政策
      - - 能源债务和消费者信任摩擦
        - 约束
        - ↓ 转化质量和还款确定性
        - 当前
        - 零售能源仍需要服务质量和催收能力，不只是更低单位电价
        - 审查投诉、坏账和脆弱客户表现
      - - 集中的市场结构
        - 约束
        - ↓ 轻松拿份额
        - 当前
        - 即便活跃供应商少于 20 家，六大玩家仍主导份额和品牌认知
        - 对标既有供应商和高增长挑战者的 CAC 与流失
      - - 安装和并网复杂度
        - 约束
        - ↓ DER 扩张速度
        - 当前到中期
        - 太阳能、电池和需求资产需要硬件、安装商和并网排队出清
        - 量化安装商渠道准入和排队相关延误
      - - PPA / 绿色切换数据不透明
        - 约束
        - ↓ SAM / SOM 测算精度
        - 当前
        - 公开证据对代理指标支撑强，对直接收入池支撑弱
        - 索取供应商队列数据、安装商数据或私人顾问市场文件
    notes: 时点列区分 2025-2026 年数据中已经可观察的事项，以及未来几年更关键的政策或基础设施进展。 最后一行是真正的尽调约束，不是格式提示。
