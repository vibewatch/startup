  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标
      - 对判断的影响
      - 具体尽调路径
    rows:
      - - 2025 年经审计的账单收入至年经常性收入（ARR）桥表
        - 无法把 $400m / £300m 的头部口径转成可承保的收入质量判断
        - 索取 2025 年经审计合并损益表，并按产品和地区拆分月度账单收入桥表
      - - 电力、燃气、安装和硬件分项毛利率
        - 缺少该项，无法判断低价领先靠的是补贴，还是采购运气
        - 索取产品级毛利率瀑布表，纳入批发成本、网络成本、坏账和服务成本
      - - 烧钱速度、现金跑道和不受限现金
        - 公开资料无法评估当前偿债能力和对融资的依赖
        - 索取资金明细表，列示不受限现金、托管 / 信托余额、烧钱速度和下一次融资触发点
      - - 按业务线拆分收入结构
        - 如果电力供应仍占绝对主导，韧性很难判断
        - 索取电力、燃气、商业业务、充电桩、安装、发电和较新产品的收入拆分
      - - CAC、流失率、留存率和退款成本
        - 缺少队列数据，单位经济性和投诉率无法转成回本周期
        - 索取按获客渠道拆分的 CAC、总流失率和净流失率、投诉解决成本，以及按资费系列拆分的留存率
      - - 债务 / 项目融资义务和契约包
        - 已清偿的 JPMorgan 押记说明有融资历史，但当前义务并未公开
        - 索取当前授信清单、契约包、抵押品，以及项目级 SPV 融资结构
    notes: 这些不是装饰性缺口：从收入质量、利润率到流动性和客户经济性，每个缺失指标都会卡住承保案例的不同环节。
