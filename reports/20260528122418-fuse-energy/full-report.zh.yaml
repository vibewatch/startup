      - number: '4.2'
        title: 2025 年 ARR 口径、增长与公开印证
        blocks:
          - type: paragraph
            body: >-
              Fuse 在 2025 年底的财务叙事很大程度上由公司提供，再被投资人和行业媒体复述。Sifted、TechFundingNews、EU-Startups 和 BusinessCloud
              都带着同一组口径：2025 年 12 月一轮 $70 million 融资，估值 $5 billion；供给约 200,000 户家庭；年经常性收入（ARR）约 $400 million（在本地化报道中写作
              €341 million 或约 £300 million）；同比增长 8x；公司进入第四年前已实现现金流为正。口径一致有价值，因为它说明这套信息是有意设计、并是该轮融资的核心；但一致性不能把 KPI
              变成审计收入。本文审阅的可获取公开材料中，没有任何资料解释“ARR”如何映射到实际开票的电力和天然气收入、该数字是总额还是扣除能源采购后的净额、是否包含仍很小的安装、商业或硬件业务线。


              因此，独立印证是不对称的。市场确实印证了 Fuse 是一家真实且快速扩张的零售供应商，并且定价激进：比价网站称它是 2025 年市场上最便宜的报价之一；Which? 在确认其拥有 18 MW
              自有太阳能和风电资产的同时，把它放在客户满意度中游。Companies House 也确认，Fuse Energy Supply Limited 是一家活跃的私营电力交易公司，并在 2025 年 12 月提交了
              2024 年集团账目。但公开记录仍缺少投资人需要的审计桥接：没有可获取的 $400 million
              口径收入确认政策，没有毛利披露，没有队列流失经济性，也没有公开解释业务有多少是商品零售供能，多少是资产驱动或硬件驱动变现。结果是，收入规模可见，但收入质量仍只得到部分核验。
