        - $5.0B 名义投后估值。
        - $5.0B
        - 未来证据必须追上价格，而不是反过来。
    notes: 这些情景是估值区间，锚定保留的公开和私有可比公司，以及明确的分母质量假设；它们不能替代数据室。
