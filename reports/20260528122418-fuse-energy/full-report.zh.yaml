        title: 护城河耐久性：哪些真实、哪些薄弱、哪些可复制
        blocks:
          - type: paragraph
            body: >-
              Fuse 确实有一个合理的竞争故事，但大多仍是护城河之前，而非护城河之后。可信部分是速度、产品简洁，以及愿意把零售供能与自有发电、EV
              充电、智能设备控制和回售跟踪放进同一个账户。这些都是有利获客的产品决策。问题在于，资金更充足的对手几乎都能复制。Octopus 已经通过 Kraken 把零售供能与市场上最深的软件护城河连在一起；Kraken
              强到 EDF、Good Energy 和 E.ON 等竞争者也在使用。OVO 通过 Kaluza 在规模较小但仍有意义的层面走同一逻辑。Good Energy 和 Ecotricity 削弱了 Fuse
              的绿色差异化主张，因为两者已有更成熟的清洁能源叙事。最尖锐的反向视角是，Which 报告称 Fuse 只销售了极小比例来自自有资产的可再生电力，且客户支持基础设施仍不成熟。换句话说，Fuse
