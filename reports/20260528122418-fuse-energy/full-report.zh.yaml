      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              乐观逻辑并非凭空想象。Fuse 已经拼出一个可信的一体化叙事，把获客、供能、发电、EV
              充电、智能家居控制、出口以及面向家庭的更广泛操作系统野心连在一起。官方页面和投资者报道支持一个判断：公司正试图跳出商品化零售供能，随着时间推移建立更深的客户关系。问题在于，今天的公开证据仍更像一家快速扩张且带有期权价值的供应商，而不是已被验证的公用事业软件平台。Which?
              的评论是最尖锐的反向镜头：客户调研分数不错，但投诉发生率、弱势客户支持偏弱、电话入口有限，以及只把 0.2%
              可再生电力销售计入认可的可持续性方法，都挑战了零售执行质量已经顶尖的说法。法定图景同样混合。Companies House 文件显示真实现金、真实资产、关联方资金和已清偿 JPMorgan
              抵押登记，但无法清晰读出无限制流动性或可持续的独立盈利能力。换句话说，投资逻辑是垂直整合加交叉销售加软件期权；反向逻辑是，公开证明仍像低价零售获客，运营和披露纪律尚未完成。
