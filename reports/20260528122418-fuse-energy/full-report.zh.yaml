  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Fuse 的技术栈从自有资产和第三方硬件出发，经由安装运营，延伸到以 app 为入口的零售和灵活性控制平面。
    data:
      layers:
        - label: 物理资产和设备
          description: 风电、太阳能站点，以及客户侧 EV 充电桩、太阳能、电池、热泵和锅炉设备
          detail: Fuse 持有发电资产，但许多家庭安装依赖第三方 OEM 硬件
        - label: 现场运营层
          description: 报价受理、勘测、排期 / 支付流程、安装跟踪、工程师派单
          detail: Fuse Engineer app 显示，安装有一套专门的内部工作流
        - label: 零售账户层
          description: 切换供应商、燃气 / 电力供应、费率管理、多物业账户处理
          detail: 面向客户的移动 app 是主要操作界面
        - label: 控制与数据层
          description: 30 分钟账单预测、实时账单更新、EV 排程、支持分流
          detail: 公开证据中最清晰的实时软件能力
        - label: 灵活性与奖励层
          description: 离峰奖励、DER 参与逻辑、回售跟踪、智能家居功能
          detail: 一部分已上线，一部分仍在成形；公开零售页面仍把部分功能标为即将推出
        - label: 市场与资产层
          description: 自有发电、开发管线、实时电力交易、工程服务
          detail: Fuse 用这一层证明，垂直整合能降成本、扩大可选路径
    approximationNotes: 这张栈图是架构图，不是网络图。它区分了已有清晰证据的上线产品界面，以及公开证据仍偏薄的灵活性 / 奖励层。
