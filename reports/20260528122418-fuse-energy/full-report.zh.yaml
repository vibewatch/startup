      - number: '5.4'
        title: 路线图与不确定性：Energy Network、$ENERGY，以及哪些已经上线
        blocks:
          - type: paragraph
            body: >-
              Fuse 路线图中最独特的元素是 Energy Network / $ENERGY 层，但应把它视作更大灵活性平台的子功能，而不是公司的身份本身。本文留存的最强官方文件不是首页产品页，而是招聘页和 $ENERGY
              奖励条款。两者合起来表示，用户可通过离峰转移、部署屋顶太阳能、把 DER 提供给更大网络来赚取 Energy Dollars；招聘文案则描述一个去中心化智能设备平台，帮助平衡电网。SEC 在 2025 年 11
              月为 Fuse Crypto Limited 出具的不采取行动函，为所述条件下的代币发行增加了监管支持。独立加密媒体走得更远，称该网络使用基于 Solana 的代币。


              但主流零售界面更谨慎。首页仍把智能家居奖励和 Plugs assistant 标为“即将推出”，本文审阅的留存客户产品页本身也没有突出 Solana
              或已上线消费者加密流程。这个缺口重要。它说明，今天更适合把区块链 / 代币层理解为附着在能源平台上的新兴灵活性和激励计划，而不是已经得到验证的客户体验中心。相比之下，设备和安装路线图更容易验证：2026
              年新指南覆盖 EV 充电器、太阳能安装商、热泵和微型储能；EV 页面还为在途充电做等待名单广告。因此，实际路线图可信，但 DePIN / 代币叙事在核心零售界面上的证据仍只露出一部分。
