companyProfile:
  summary: >-
    Fuse Energy 是一家位于伦敦的英国能源初创公司，由前 Revolut 高管 Alan Chang 和 Charles Orr 于 2022 年创立。公司在打造垂直整合模式，覆盖可再生发电、交易、零售供能、EV
    充电、家庭电气化，以及正在成形的灵活性 / 奖励层。公开留存来源支持 Fuse 到 2025 年底已达到真实的全国性家庭规模，并以据称 $5 billion 估值完成 $70 million Series
    B；但最关键的运营和投资核验 KPI——尤其是客户数质量、ARR 质量、利润率、流动性和股权结构条款——在公开资料中仍只露出一部分。
