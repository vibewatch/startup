  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Fuse 最清晰的家庭用户旅程，是先用价格驱动发现，再快速数字化切换，随后激活电表 / 数据、用 app 管理；之后要么交叉销售，要么因账单异常磨损信任。
    data:
      nodes:
        - id: discover
          label: 发现更低账单切入点
          description: 家庭看到低于价格上限或低价固定套餐信息，开始把 Fuse 与传统供应商或其他挑战者比较。
        - id: quote
          label: 获取报价 / 注册
          description: 客户输入邮编，可上传旧账单，并被告知切换可在不到三分钟内启动。
        - id: switch
          label: 切换与电表设置
          description: Fuse 处理原供应商交接；客户要么使用现有智能电表数据，要么在设置完成前提交手工 / 照片读数。
        - id: manage
          label: 在 app 中管理
          description: 家庭可在 app 或网页账户里跟踪半小时用电、预测、账单、支持聊天，也可能管理多套物业。
        - id: expand
          label: 扩展到 EV / 燃气 / 设备
          description: 价值更高的家庭会增加燃气、EV 费率、充电桩安装或其他智能家居参与，加深关系。
        - id: outcome
          label: 推荐或信任破裂
          description: 日常服务顺畅会带来高评分和推荐；账单、退款或安装问题则会很快伤害信任。
    approximationNotes: 这些阶段综合自官方入门文案和独立评论渠道，不来自公司披露的管理漏斗。
    claimRefs:
      - CU001
      - CU003
      - CU005
      - CU006
      - CU009
      - CU026
      - CU031
      - CU038
      - CU040
  - id: FU002
    title: 采用 / 部署流程
    type: flow
    layout: wide
    summary: 公开获客证据显示，Fuse 的漏斗以价格驱动发现，注册摩擦低，之后进入运营设置、日常 app 管理，再走向更深的家庭渗透或由投诉触发的流失风险。
    data:
      nodes:
        - id: n1
          label: 价格或费率不满
          type: input
          detail: 客户想要比传统供应商更便宜的供电、更好的 EV 定价或更透明的账单。
        - id: n2
          label: 比价与报价
          type: process
          detail: Fuse 以低于价格上限的浮动套餐主张、低价固定费率和 app 便利性竞争。
        - id: n3
          label: 开始切换
          type: process
          detail: 官方页面承诺不到三分钟即可注册，并会处理旧供应商流程。
        - id: n4
          label: 激活电表与账单
          type: process
          detail: 手工读数、智能电表连接和半小时数据，决定客户实际能拿到多少产品体验。
        - id: n5
          label: 使用支持并优化用电
          type: process
          detail: 客户依赖 app / 聊天支持、查看预测，并可能把负荷移到离峰时段。
        - id: n6
          label: 扩展或投诉
          type: output
          detail: 满意用户会推荐他人并增加燃气或 EV 服务；遇到退款、账单摩擦或无电话服务限制的客户可能脱离。
      edges:
