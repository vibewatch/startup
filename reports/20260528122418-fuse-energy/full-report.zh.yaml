      - number: '4.4'
        title: 利润率证据、反向信号与投资核验缺口
        blocks:
          - type: paragraph
            body: >-
              公开记录更擅长展示 Fuse 的定价野心，而不是实际单位经济性。官方和第三方来源一致称，公司目标是低于 Ofgem 价格上限、为家庭每年节省最高约 £200，并通过垂直整合比传统供应商便宜约
              10%。但真正决定经济性的变量仍未披露：批发采购后的毛利率、坏账和退款漏损、分渠道服务成本、获客成本、流失率，以及供给电力中真正由自有发电对冲的比例。就连可再生足迹证据也不是干净正向。官方燃料结构页显示，自有站点发电
              18.9 GWh，并披露某一期间的组合为 16.12% 太阳能、1.39% 风电和 82.49% 电网；Which? 则按其自有可持续性方法报告，Fuse 销售的可再生电力中只有 0.2%
              来自自有资产。这不一定矛盾——证书处理很重要——但足以警示：不能仅凭绿色品牌推断零售利润率质量。


              因此，反向证据路径不是破产风险，而是经济性不透明和服务摩擦。Which? 报告称，受访 Fuse 客户中 16%
              在此前一年提出正式投诉，退款问题、估算读数和错误贷方余额都以有意义比例出现。它还在弱势客户支持和价格变动沟通上给出低分。若这些问题在规模化后持续，会直接推高客服成本、营运资金波动和监管审视。再叠加已实现资费利润率和不受限现金披露不完整，财务结论很清楚：Fuse
              目前看起来运营野心强、融资基础也好，但公开证据仍不足以让投资人以高置信度核验收入质量、利润率路径或流动性充足度。
