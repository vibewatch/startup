  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Fuse 的风险画像不太像单一可见法律爆雷，更像三类会快速相互叠加的风险暴露。第一，Fuse 是受监管的零售供应商，客户服务摩擦已经可见。Ofgem
              已授予现行天然气牌照，公司也发布了正式供能、隐私、促销和奖励条款，但独立证据对服务准备度明显没那么友好：Which? 给 Fuse 总分 66%、供应商评估 56%，报告 16%
              的正式投诉发生率，并指出弱势客户支持和沟通表现偏弱。第二，零售能源经济内核在公开层面仍不透明。管理层和投资者反复描述一个垂直整合的交易加供能模式，称可比既有供应商低约 10%
              定价，但保留记录没有披露对冲比例、坏账损失率、抵押品要求，或自有发电覆盖客户负荷的比例。第三，$ENERGY 在英国边界落定前又加了一层监管。SEC 不采取行动结果有帮助，但 Fuse
              自身奖励条款提到交易所交易、按市场价格赎回和自托管钱包，而 FCA 仍在定义未来制度。
