      - number: '3.3'
        title: 品牌信任、服务质量与切换摩擦
        blocks:
          - type: paragraph
            body: >-
              在英国能源市场，单靠价格很难长期胜出，因为供应商仍必须赢得足够信任，才会让一个家庭切换银行信息、电表读数和服务预期。Citizens Advice 和 Which 都显示信任分布并不均匀。Ecotricity
              位居 Citizens Advice 榜首，Octopus 和 E.ON Next 落在表现较好的队列，EDF 和 British Gas 落后。Which 给 Fuse 的客户情绪分高于 OVO，但也指出
              Fuse 对弱势用户支持弱、缺少传统电话支持、沟通表现混合。OVO 则展示了相反取舍：它的产品和支持基础设施远比 Fuse 宽，但 Which
              仍从客户侧给其价值和服务较低评价。智能资费还制造了一种新切换摩擦。客户一旦拥有兼容充电器、app
              工作流、半小时智能电表读数，甚至绑定电池或热泵资费，更换供应商就不再像把一张商品账单换成另一张那么简单。这今天更利好大平台，而非 Fuse，因为更大玩家已拥有已安装硬件、专业 app 和支持团队。
