    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              Fuse Energy
              把自己定位成一家垂直整合的英国能源供应商，目标是比传统零售商控制更多能源堆栈，从而压低家庭账单。官方材料和投资人报道描述的模式是从电源到插座：覆盖可再生站点建设、发电、交易、零售供能、安装、EV
              充电和消费硬件。当前的消费者界面已经不只是普通公用事业资费：首页销售天然气和电力供应、EV
              充电优化、太阳能与电池回售跟踪和数字账户管理；产品页和近期融资报道则指向家庭能源操作系统，以及即插即用的太阳能电池硬件。战略上，公司投资核验的不只是零售资费的获客经济性；它想在供能之上做出一个软硬件层，利用发电、交易和需求灵活性降低交付成本。支撑这个故事的最强公开证据仍来自公司或投资人，而非独立审计；但在官方页面、投资人公告和行业报道之间，Fuse
              的身份叙事异常一致。
