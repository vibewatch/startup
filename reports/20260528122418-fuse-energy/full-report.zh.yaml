  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 资本信号
      - 产品范围
      - 差异化
      - 关键局限
    rows:
      - - Fuse Energy
        - 挑战者供应商 + 新兴 DER 产品栈
        - 2023 推出；已融资 £52.4m；18MW 自有风电 / 太阳能资产
        - 零售供电、EV 充电、智能设备控制、太阳能 / 电池上网跟踪
        - 清爽的 App 优先用户体验，加上早期垂直整合叙事
        - 支持成熟度和软件规模仍未证明
      - - Octopus / Kraken
        - 规模化零售供应商 + 公用事业软件平台
        - GB 最大电力供应商；Kraken 服务 90m+ 账户
        - 零售供电、EV 电价、热泵、太阳能、电池、上网、公用事业 OS
        - 价格、安装和编排的全栈组合最好
        - 单靠零售价格仍容易被复制
      - - OVO / Kaluza
        - 规模化供应商 + 能源智能平台
        - 3.6m+ 家庭；Kaluza 有 400+ 集成
        - 零售套餐、Charge Anytime、太阳能、电池、热泵、V2G / 灵活性
        - App、EV 捆绑和软件相邻能力强
        - Which 客户评分偏弱，削弱品牌优势
      - - Good Energy
        - 绿色溢价供应商
        - B Corp；3,000+ 独立发电商；88% 半小时匹配
        - 零售供电、上网电价、太阳能、电池、EV 充电器、热泵伙伴安装
        - 主流绿色同行中可再生采购可信度最高
        - 软件深度和规模不及 Octopus / OVO / 既有供应商
      - - Ecotricity
        - 发电驱动的绿色供应商
        - 30 年；24 个风电场、74 台风机，以及 16.5MW 较新太阳能电场
        - 零售供电、EV 电价、自发电叙事、储能投资
        - 绿色身份护城河最强，Citizens Advice 评分最高
        - Green Variable 电价处在价格上限之外，可能显得贵
      - - E.ON Next
        - 带智能电价栈的既有零售供应商
        - 5m+ 客户；146k+ 五星评价
        - 零售供电、EV 电价、热泵电价、AI 电池电价、太阳能
        - 主流规模加上具体智能电价包装
        - 绿色品牌不如 Good Energy 或 Ecotricity 鲜明
      - - EDF
        - 既有零售供应商
        - 大型既有品牌；EV 和需求响应产品
        - 零售供电、EV 电价、Sunday Saver 灵活性、太阳能 / 电池经济性
        - 可在大资产负债表内交叉销售有竞争力的 EV 定价
