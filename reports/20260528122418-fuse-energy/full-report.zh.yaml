      - number: '2.2'
        title: 多重证据视角下的可触达市场测算
        blocks:
          - type: paragraph
            body: >-
              最干净的自下而上视角，是英国家庭数乘以它们已经支付的电力钱包。ONS 报告 2025 年英国家庭数为 29.0 million；DESNZ 估计 2025 年平均标准电费为
              £1,069。这意味着，在不计硬件、回售变现或灵活性服务溢价之前，居民电力钱包约为每年 £31.0 billion。更窄的可服务池，是对价格上限敏感的切换用户基础：Energy UK 称 2026 年 4 月仍有
              60% 客户留在价格上限内，意味着约 17.4 million 户家庭仍直接暴露在由上限驱动的省钱叙事中。Ofgem 同时报告资费差距仍有意义——2026 年 2 月最便宜资费为 £1,505，而大型供应商
              SVT 基准为 £1,758——因此，即便固定价格方案在危机后恢复，切换用户池仍有经济动机。


              其他视角会放大机会，但与收入的直接性更弱。供给侧，可再生能源在 2025 年已贡献英国 52.5% 的电力，风电 87.1 TWh、太阳能 20 TWh；这一点重要，因为 Fuse
              战略依赖低成本可再生发电去支撑零售和灵活性产品。资产侧，截至 2026 年 3 月，英国太阳能达到 22.1 GW、2.003 million 个安装；MCS 称认证电池安装到 2025 年 9 月已达到
              59,000。编排侧，政府政策没有发布简单的 VPP TAM，但明确表示英国到 2030 年大约需要 51-66 GW 清洁灵活性，且已有超过 2.5 million 名消费者参与 Demand
              Flexibility Service。正确结论不是押一个宏大的 TAM 数字；而是 Fuse 位于大型零售钱包、庞大且增长中的已安装 DER 基础，以及早期但越来越正式的灵活性市场交汇处。主要缺失数字是双边
              PPA 价值、可再生资费切换的准确份额，以及易读的官方 2026 年电池已安装总量。
