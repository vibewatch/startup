        - 分母表现更像经常性毛利或公用事业 OS 收入，而不是简单供能收入。
        - 只有当软件式经济性变得可见，当前轮次才守得住。
        - $4.0B-$6.0B
        - 经审计的桥、强附加率和简单股权结构支撑溢价。
