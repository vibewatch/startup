  - id: TR005
    title: 缓释和终止标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 客户服务 / 监管违规
        - 正式投诉率和 Ombudsman 转介
        - 如果正式投诉持续高于小型供应商同业水平，或 Ombudsman 转介 / 僵局函连续两个季度上行
        - 暂停激进获客，先投入服务修复；指标正常前，把零售投资逻辑视为受损
      - - 零售利润率不透明 / 套保失败
        - 扣除采购、抵押品使用和坏账损失后的毛利率
        - 如果所要求的尽调无法按电价队列证明稳定正毛利和受控抵押品
        - 不按估值承销当前增长叙事；改写为继续研究，或要求下行保护
      - - $ENERGY 英国边界风险
        - 英国律师结论，以及任何 FCA / s.21 审批人要求
        - 如果英国律师无法支持当前奖励设计，或要求对营销、交易所或钱包作重大限制
        - 假设推出延迟、合规成本更高，且代币驱动互动的可选性下降
      - - 隐私 / PECR 合规
        - Cookie 审计、DPIA 发现和数据权利投诉程序准备度
        - 如果非必要 Cookie 在同意前已触发，或 2026 年 6 月投诉程序准备尚未完成
        - 扩大付费获客或高级个性化功能前，先要求完成隐私整改
      - - 安装质量 / 安全
        - 返修率、保修索赔、严重事故和安装商流失
        - 如果实体产品缺陷或返修率超过内部门槛，或发生任何严重安全事故
        - 放慢硬件推出，收紧供应商名单，并为保修和保险预留额外资本
      - - 营运资本 / 催收压力
        - 保证金、预付费使用、催收导致的流失，以及信用余额波动
        - 如果催收工具成为主要增长杠杆，或在客户增长下现金转换仍恶化
        - 将增长视为越来越受信用驱动，并压力测试偿付能力和获客假设
      - - 执行拉伸
        - 新国家发布、产品 GA 日期和组织梯队建设
        - 如果多个发布同时延误，或融资后关键控制岗位仍空缺
        - 将建模范围降至核心英国零售和项目基础，直到执行追上来
      - - 供应商失败类别风险
        - 批发波动相对可用融资和 Ofgem 韧性要求
        - 如果批发波动飙升，而 Fuse 无法证明套保或资本纪律
        - 即使 SoLR 保护终端客户，也要假设类似过往小型供应商倒闭的下行情景
    notes: 这些是投资人视角的终止标准，不是管理层 KPI。每个触发项都应能在尽调或季度组合复盘中监测。
