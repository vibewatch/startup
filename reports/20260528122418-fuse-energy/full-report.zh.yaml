      - number: '6.2'
        title: 核心换约主张很简单：更便宜的资费、快速注册、看得见的账单控制
        blocks:
          - type: paragraph
            body: >-
              Fuse 的获客话术在首页、app 上架页和 2026 年解释文章中异常一致。它告诉客户：不到三分钟就能换约，可以选择上传旧账单，供应商迁移由 Fuse 处理。官方材料还承诺实时或半小时级账单可见性、24/7
              人工支持，以及旨在低于 Ofgem 上限或奖励低谷用能的资费结构。对 EV 和智能电表家庭来说，这个主张更有差异化；Fuse
              称可以把便宜的夜间电价覆盖到全屋，并自动排充电时段。独立评论页大体印证了这个商业故事，而不是推翻它：Which?、Uswitch、Energy-Review 和 SwitchInsights 都把 Fuse
              描述为低价、数字优先的挑战者，app 和资费机制强于平均供应商。它们没有完全印证的是运营边界情形。注册也许很快，但完整换约仍发生在英国正常市场流程内，高阶资费仍依赖兼容电表、充电桩，以及客户对 app
              优先服务的容忍度。
