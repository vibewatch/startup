  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入口径与相邻市场
        blocks:
          - type: paragraph
            body: >-
              对一家年轻零售供能商来说，Fuse 的公开产品界面异常宽。首页和商业页面展示了家庭电力供应、商业能源、EV
              资费、多费率资费、太阳能和电池回售跟踪、智能设备控制；使命页补上公司叙事：部署低成本太阳能和储能，再协调客户缓解电网压力；项目页则加入自有或开发中的可再生资产、绿色氢能和工程服务。因此，本章纳入的市场是四个相互连接的层次：英国居民用电零售供应（以及近邻的小企业）、能够支撑这些资费的可再生发电与签约低碳采购、家庭太阳能加储能套件和回售经济性，以及搭在客户设备之上的电网灵活性
              / VPP / DER 编排层。


              Fuse 虽公开提及若干领域，本章仍予以排除。本章不把英国天然气支出、一般商业能源采购、电网所有权、氢燃料或核聚变纳入 Fuse
              近期总可用市场（TAM），因为今天可见的公开销售界面和监管数据仍以英国家庭电力为绝对主线。同样，爱尔兰、西班牙和美国最好视作战略相邻市场，而非当前可触达市场。现状替代品仍是标准浮动或固定资费下的传统供应商；下一层替代品是只做到硬件安装的太阳能安装商，以及自发自用但不参与回售或灵活性市场的家庭。
