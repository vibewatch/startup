      - number: '4.3'
        title: 资本结构、营运资金与融资依赖
        blocks:
          - type: paragraph
            body: >-
              公开可获取的融资证据支持一个有意义、但并不完全透明的资本基础。留存新闻来源里的公开轮次时间线很直接：2022 年融资 $78 million，2025 年 12 月融资 $70
              million，意味着本文审阅的公开披露股权资本至少为 $148 million。Mercom、Sifted、UK Tech News 和 EU-Startups 都印证了最近一轮及其 $5 billion
              估值。这足以判断 Fuse
              对一家年轻供应商而言有不错背书，但不足以判断集团可自我供血或资本强度低。战略本身——自有发电、项目开发、供能、安装、硬件和国际扩张——指向的资本密集度高于纯软件驱动的零售公用事业挑战者。


              最强的资产负债表证据来自 Fuse Energy Supply Limited 的 2023 年法定账目，而不是融资报道。这些账目显示，公司流动资产 £50.1 million，流动负债 £48.1
              million，银行现金 £45.9 million，长期债权人 £10.1 million，一年内到期的关联方应付款 £46.5 million，以及来自最终母公司的长期借款 £9.7
              million。关键在于，附注称现金中 £45.7 million 由信托持有，受益人为最终母公司；这意味着账面现金数字不应被理解为可用于承接零售亏损或资本开支的不受限流动性。同一份备案还显示，公司花费
              £14.0 million 收购两个太阳能子公司，另有早前 £0.54 million 的可再生能源收购；当前 Companies House 押记登记则显示，2023 年设立的一项 JPMorgan 押记已于
              2024 年 10 月清偿，目前没有未清偿押记。合在一起，这些数据点意味着真实的营运资金管理、此前有担保融资和持续母公司支持，但仍没有公开烧钱速度、现金跑道或契约披露。
