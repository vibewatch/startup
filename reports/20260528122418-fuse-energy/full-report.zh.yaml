  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 用户 / 付款方
      - 与 Fuse 的相关性
    rows:
      - - 英国家庭电力供应
        - 家庭客户的零售电力收入、换约获客、资费毛利、服务和账单软件
        - 仅天然气支出、与电力无关的广义家庭服务，以及通用公用事业软件
        - 买方和付款方 = 家庭账单支付者；用户 = 家庭成员
        - 当前可见切入点；Fuse 首页主打资费、换约和支持
      - - 可再生发电与低碳采购
        - 自有或开发的太阳能、风电产出，加上可支撑零售主张的签约低碳电力
        - 输电所有权、纯批发交易，以及与 Fuse 面向客户的供能或采购无关的发电
        - 买方 = 供应商 / 购电方；用户 = 零售账户或电力客户；付款方 = 供应商、企业买方或市场交易对手
        - 重要的供给侧成本优势和可信度层，但不是独立零售 TAM
      - - 家用太阳能 + 出口 + 电池套件
        - 住宅或小企业屋顶 PV、电池、出口变现和监控软件
        - 不通过客户边缘销售的公用事业级太阳能电站资本开支和储能项目
        - 买方和付款方 = 房主、房东或 SME；用户 = 场址占用者 / 设备所有者
        - 零售客户想降低账单并获得出口价值之后的自然附加销售市场
      - - 电网灵活性 / VPP / DER 编排
        - 聚合软件、资产登记、灵活资费、出口优化，以及通过移峰需求或注入电力获得的付款
        - 与 DER 参与无关的广义公用事业软件，或脱离客户资产的批发交易
        - 买方 = 供应商、聚合商、DNO/NESO 相关项目或灵活性交易商；用户 = 家庭 / SME 资产所有者；付款方 = 市场或网络交易对手
        - 如果 Fuse 能把客户和设备转化为可调度资产，这会成为更高毛利层
      - - 商业能源邻近市场
        - Fuse 商业页面可见的 SME 和多场址资费管理
        - 大型工业采购和复杂企业能源管理
        - 买方 = 运营或财务负责人；用户 = 场址经理；付款方 = 企业账户
        - 公开可见，但仍只是家庭主导逻辑的邻近市场
      - - 国际、氢能与核聚变邻近市场
        - 使命 / 项目页面描述的潜在未来市场
        - 本章当前英国 TAM
        - 尚未作为近端客户可见的未来战略买方集合
        - 应影响上行叙事，而不是当前市场规模测算
    notes: 纳入支出由 Fuse 当前公开销售界面以及来自英国零售、DER 和灵活性来源的可用证据定义。天然气、工业采购、氢能和核聚变被视为邻近市场，而不是当前市场边界。
