  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: Fuse 卖给熟悉数字服务、价格敏感的家庭，而不是整个英国大众市场
        blocks:
          - type: paragraph
            body: >-
              Fuse Energy 的公开客户界面先面向消费者家庭，而不是企业。最强的官方证据就是产品菜单本身：家庭电力和天然气、EV 充电优化、智能电表驱动的用量追踪、多物业管理，以及 app
              主导的账户模式。这个组合说明，买方通常也是用户和付款方；最匹配的是愿意用数字方式管理能源、通过直接借记付款、用聊天或 app 而不是电话互动的家庭。EV 车主和多物业用户尤其有吸引力，因为 Fuse
              反复把低谷充电、充电桩安装和多物业控制作为加入或加深使用的理由。尽调时反面同样重要。Which?、Energy-Review 和其他评论页都显示，Fuse
              不太适合需要预付费、偏好电话客服，或期待传统高触达供应商关系的客户。换句话说，客户基数按家庭绝对数量可能很宽，但仍围绕数字意愿、资费灵活性和对 app 中介服务的信任分层。
