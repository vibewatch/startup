  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价机制
        blocks:
          - type: paragraph
            body: >-
              Fuse Energy 公开可见的变现堆栈比传统电力供应资费更宽，但当前唯一有清楚证据的现金引擎是零售能源供应。官方界面展示了面向家庭的固定、浮动、多费率和 EV 资费，也有商业能源报价、EV
              充电和多站点账户管理。2026 年 3 月资费解释对机制有帮助：Fuse 将账单定价为固定日费加单位费率，按季度更新浮动资费，固定离峰时段使用 00:30-07:30，并把 EV 离峰窗口 00:00-05:00
              应用于整个家庭。独立比价网站随后印证了商业框架——低于价格上限的浮动定位、固定期限、多费率选项，以及按邮编推出天然气——但没有解决最关键的投资核验问题：实际利润率。


              第二个重要区分，是收入流与营销相邻项。官方页面和博客显示，Fuse 试图变现的不只是家庭电力，还包括家用天然气、商业供能、EV
              充电器安装、智能充电，以及太阳能、电池、热泵和锅炉等未来家庭能源产品。这支持更高单户终身价值的投资逻辑，尤其是低价离峰充电和商业账户若能提升留存。但公开资料没有拆分当前收入有多少来自电力供应，多少来自天然气、安装、充电器销售或仍在成形的产品。价格透明度也不完整：Fuse
              对资费机制解释清楚，但实际区域标价、折扣和退出费规则，大多仍通过比价网站可见，而不是来自稳定的官方资费表。
