      - - 信心
        - 中
        - 估值过高信号很强，但关键私营公司输入仍未披露。
        - 管理层分享经审计的 KPI 桥和融资条款。
      - - 风险评级
        - 高
        - 零售利润率、投诉、监管和轮次条款都可能大幅移动价值。
        - 证明服务指标稳定、利润率耐久，且优先股条款简单。
      - - 估值立场
        - 偏高
        - 隐含 12.5x 倍数远高于公开零售能源可比公司。
        - 证明 Kraken 式软件经济性，或接受更低价格。
      - - 持有 / 退出姿态
        - 只能多年私有持有
        - 没有公开证据支持近期退出准备度。
        - 发布更清晰的流动性路径和接近上市公司的披露节奏。
      - - 主要尽调关口
        - ARR 桥 + 利润率瀑布 + 股权结构表
        - 这三项决定本轮是高质量增长，还是叙事质量增长。
        - 交付接近审计标准的报告和已签署条款文件。
