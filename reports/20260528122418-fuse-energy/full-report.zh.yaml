  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 堆栈宽度：零售供能、发电、安装与家庭能源附加项
        blocks:
          - type: paragraph
            body: >-
              Fuse 的公开产品界面比普通英国零售供能商更宽。首页呈现一个品牌，横跨家庭供能、商业能源、EV 充电、硬件与安装商店、自有项目和 app 注册。商店进一步把下游硬件层说清楚：客户可以申请家用 EV
              充电器、家用太阳能、家用电池、热泵、燃气锅炉和配件。上游项目界面展示了自建自持的可再生能源策略，已有完工风电和太阳能站点，以及更大的开发管线。招聘页最直接地把这些层连起来，把公司描述为一家全整合企业，覆盖太阳能、风电和氢能项目开发、实时电力交易、分布式能源安装以及直接面向消费者的供能。


              这种宽度是本章最主要的产品结论。Fuse
              不只是在卖资费或比价网站切换；它试图把获客、零售账单、设备挂载、安装商工作流、发电对冲和部分灵活性经济性放进一个运营堆栈。证据最强的是已经出现在网站或应用商店里的供能、EV、项目和安装界面。家庭太阳能 /
              家用电池层在方向上真实，因为它出现在商店里，首页承诺回售跟踪，奖励条款也设想了屋顶 DER 参与。但公开文档仍比资费和 EV
              产品更薄，因此太阳能电池报价应被视为一个正在销售、但公开产品细节不完整的动作，而不是已完整记录的交钥匙套件。
