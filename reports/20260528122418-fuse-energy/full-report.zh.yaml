            body: >-
              反向图景不是急性监管困境，但也并非无风险。本文审阅的官方来源没有显示 Ofgem 对 Fuse 采取重大执法行动，也没有 SEC 制裁；相反，监管记录包括 Ofgem 在 2024 年 11
              月授予天然气供应牌照，以及 SEC 在 2025 年 11 月就 Fuse Crypto Limited 代币结构出具不采取行动函。警示主要来自执行、披露和消费者服务渠道。Which? 在 Fuse
              进入排名的第一年给出 66% 总分，并在能源成本沟通和其他政策侧指标上给出较低评分；Resolver 称最常见投诉类型是账单 / 付款和智能电表安装。这些是初创公用事业公司常见摩擦点，不是生死事件；但 Fuse
              正在高速扩张，同时叠加硬件、电网服务和新地区，因此这些摩擦重要。更大的尽调问题仍是透明度：董事会构成、权利条款、经独立验证的收入、独立客户数，以及 2022 年初创公司与 2013
