    rows:
      - - 可变单一费率电价
        - 固定日费加单位费率；费率通常随市场条件 / 价格上限重置按季度变化
        - 官方机制清楚；此处未保留分地区实时费率
        - 官方电价说明称无退出费；实际利润率未知
        - 官方电价说明 + 比价网站
        - 有利于获客和灵活性，但承保需要扣除采购后的净供能利润率
      - - 固定单一费率电价
        - 单位费率和固定日费固定 12-15 个月，视列表而定
        - 比价网站显示条款；官方站点在审阅页面中未保留持久电价卡
        - 多个外部来源显示约 £50/燃料退出费，但部分低质量页面称无退出费
        - Uswitch / MoneySuperMarket / Energy Review / MSE forum 评价来源
        - 存在价格透明度，但退出费披露嘈杂，需要客户合同确认
      - - 离峰固定电价
        - 多个单位费率，离峰窗口 00:30-07:30 GMT
        - 官方机制清楚；实际客户节省取决于转移负荷
        - 智能电表兼容性和用电画像决定经济性
        - 官方电价说明
        - 分时结构可以加深留存，但不能证明利润率质量
      - - EV 电价
        - 00:00-05:00 低价全屋离峰窗口，面向兼容 EV / 充电桩 / 智能电表用户
        - 产品机制公开；实时 p/kWh 取决于地区和期限
        - 经济性依赖需求转移和充电桩集成；未披露绑定率经济性
        - 官方电价说明 + EV 页面
        - 如果充电桩和供能成功捆绑，可支撑客户 LTV
      - - 商业电价
        - 面向商业账户的报价式定价，带多站点管理
        - 审阅来源未保留公开标价
        - 实际定价、合同长度和折扣未公开
        - 官方商业能源页面
        - 用量更高的账户可能有吸引力，但没有获胜率和毛利数据，无法承保
      - - 比价网站示例快照（2025 年中）
        - 公开编辑页面显示固定日费约 59-60p/day，单位费率在低 20p/kWh 区间
        - 仅为快照；不是有约束力的电价表
        - 地区、电表类型和时间点都可能显著影响费率
        - FreePriceCompare / Ofgem 背景
        - 可用于框定价格位置，不能用于建模实际收入
    notes: 定价图景在机制上最强，在持久公开标价上最弱。独立编辑来源有助于框定固定期限和退出费，但不应当作实际商业经济性。
