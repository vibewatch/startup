      - number: '7.3'
        title: 零售能源、运营与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Fuse 的公开产品界面已经更像一个小型一体化公用事业加家庭电气化平台，而不是狭窄的零售资费业务。公司销售家庭能源、商业能源、EV
              充电、专家安装，以及覆盖充电桩、太阳能、电池、热泵和锅炉的商店，同时还运营可再生能源站点，并宣传 450 MW
              项目管线。这带来真实上行空间，也让执行失败的路径成倍增加。账单质量和智能电表依赖已经在公开客户证据中成为可见痛点，供能条款还明确允许估算账单、押金、预付款、催收行动、换约异议和断供路径。硬件和安装把失败面从数字服务错误扩展到物理安全、质保、回访和安装商产能问题。依赖图谱同样很宽：DNO
              和电表运营商影响供能交付，安装商和 OEM 影响产品质量，Privy、交易所和区块链轨道影响奖励运营。即便是 Fuse
              的绿色叙事也有运营复杂性，而不是简单故事：尽管有自有可再生发电，公司受监管燃料结构仍显示对电网依赖很重，这意味着零售表现仍对采购和调度纪律敏感，而不是自动被当前资产基础对冲。
