        blocks:
          - type: paragraph
            body: >-
              公开创始人故事很清楚：Balderton、Sifted、EU-Startups、TFN、BusinessCloud 和 The Energyst 都把 Fuse 描述为前 Revolut 高管 Alan
              Chang 与 Charles Orr 在 2022 年创办的企业。法律实体故事更复杂。Companies House 显示，受监管的英国供能实体 Fuse Energy Supply Limited
              是一家活跃公司，2013 年 4 月成立，前身名为 Paddington Power Limited；Which? 则称 Fuse 在 2023
              年面向消费者上线，是能源危机后进入英国市场的第一家新供应商。合在一起看，证据指向一种结构：当前初创公司和管理团队在 2022 年组建，随后把一个已有牌照或可获牌照的公司壳扩张成面向消费者的 Fuse
              业务。这本身不是负面信号，但尽调必须弄清楚继承的供能实体里究竟有哪些资产、牌照、负债和历史义务。公开领导层披露在 Chang 和 Orr
              之外仍很薄，关键人依赖集中，董事会、投票权和投资人控制条款在本文审阅的公开记录中不可见。
