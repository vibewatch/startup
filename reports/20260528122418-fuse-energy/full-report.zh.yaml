  - id: TM005
    title: 测算缺口与相互矛盾的公开视角
    columns:
      - 主题
      - 最佳公开代理指标
      - 公开数据说明
      - 仍缺什么
      - 尽调路径
    rows:
      - - 绿色 / 可再生电价切换
        - Ofgem 切换次数
        - 公开来源显示整体电力切换量和价格驱动动机
        - 没有可靠公开拆分，能显示具体切换到可再生或绿色方案的用户
        - 向供应商或比价网站索取电价层级切换队列
      - - 双边可再生 PPA
        - LCCC / CfD 数据集和清洁电力简报
        - 公开数据显示 CfD 支持资产、官方可再生发电量和拍卖量
        - 私人双边 PPA 的价值、期限和利润率没有作为英国市场总量透明发布
        - 使用经纪商、开发商、买方或顾问数据室材料
      - - 2026 家庭电池装机基础
        - DESNZ 电池统计入口页加 MCS 文章
        - 官方序列存在，并于 28 May 2026 更新；MCS 给出 Sep 2025 59k 套认证快照
        - 可读公开 HTML 未披露最新头部装机基础数量
        - 打开工作簿，或直接索取底层序列
      - - 家庭户数 vs 客户账户
        - ONS 家庭户数 + Ofgem 供应商账户 / 活跃供应商
        - 家庭户数和供应商 / 账户统计都有用，但并不相同
        - 没有单一公开序列能把家庭户数直接转换为 Fuse 这类产品可切换的唯一电力账户
        - 在供应商数据中对齐 MPAN / 账户定义
      - - 国际相邻市场
        - Fuse 使命 / 项目页面
        - 公司信息中出现氢能、工程和其他未来地理市场
        - 还没有公开证据显示这些地理市场是核心产品组合的当前商业需求
        - 在出现具体国家客户证据前，先按相邻市场处理
    notes: 这张表有意这样拆分：把支撑充分的英国家庭 / DER 事实，与公开数据中仍结构性不透明的收入池分开， 本章结论才更扎实。
