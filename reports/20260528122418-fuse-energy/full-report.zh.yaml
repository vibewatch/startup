        title: 定价、产品宽度与安装层
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争启示是，持久差异化不在表面零售价格里。Ofgem 的价格上限仍压缩标准浮动资费，因此供应商现在靠离峰 EV 充电、回售资费、太阳能电池组合和热泵专属计划争夺注意力。Fuse 宣称可低于价格上限、EV
              充电最高省 90%，这是很强的获客话术；但 Octopus、OVO、EDF 和 E.ON Next 已经发布了具体智能资费主张，明确离峰窗口和硬件资格。Octopus 的堆栈拉得最远：EV 充电用 Go，热泵用
              Cosy，太阳能和回售用 Flux 与 Outgoing，再加自有安装。OVO 把固定或浮动零售方案与 Charge Anytime、太阳能电池包和 Kaluza 相关智能能力结合。E.ON Next 和 EDF
              显示，传统供应商也能把 EV、热泵、太阳能和电池经济性产品化，塞进主流零售品牌。Good Energy 和 Ecotricity 的软件深度较浅，但两者都有可信的绿色家庭安装故事。因此，Fuse
              的商业切口真实存在，却不是独占；客户已经有多条路径，从装机基础更大的供应商那里购买智能、更绿色的家庭能源组合。
