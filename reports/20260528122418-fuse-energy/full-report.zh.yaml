  - id: TV004
    title: 可比估值表
    columns:
      - 公司 / 参考
      - 状态
      - 当前分母或规模信号
      - 倍数 / 估值
      - 相关性
      - 关键限制
    rows:
      - - Fuse Energy
        - 私有
        - 报道的 $400m ARR、200k 户家庭、早期一体化产品栈
        - $5bn 名义估值；按报道 ARR 约 12.5x
        - 标的公司；直接界定承销问题。
        - 没有从 ARR 到收入、毛利或自由现金流的经审计公开桥。
      - - Good Energy
        - 退市私有化的英国绿色供应商
        - 2024 年收入 £180.1m；PBT £6.6m；安装和能源即服务组合
        - 隐含 EV 约 £67.8m；EV/revenue 约 0.38x
        - 保留来源中最接近的英国零售能源和家庭电气化参考。
        - 规模小于 Fuse 报道的 2025 轨迹，增速也更慢。
      - - Genie Energy
        - 公开
        - 过去十二个月收入 $507.48m
        - 市值 $370.44m；销售额倍数 0.73x；EV/revenue 0.35x
        - 有用的上市零售能源倍数锚。
        - 美国业务组合和地域不同于英国零售能源。
      - - UGI
        - 公开
        - 过去十二个月收入 $7.36bn
        - 市值 $7.54bn；销售额倍数 1.06x；EV/revenue 1.91x
        - 显示更大型能源分销商在公开市场可拿到的估值。
        - 更广的丙烷和基础设施敞口，使它只能作远端可比。
      - - Centrica
        - 公开
        - 过去十二个月收入 £19.49bn
        - 市值 £8.83bn；销售额倍数 0.48x；EV/revenue 0.38x
        - 大型英国零售能源锚，展示成熟供应业务的交易位置。
        - 现有规模和多元化让它更像下行锚，而不是成长同业。
      - - Octopus Energy
        - 私有
        - 2024 年 5 月 7.7m 户家庭；后续官方材料称全球 11m 客户
        - 2024 年 5 月估值 $9bn
        - 一体化能源 + 科技玩家中，保留的最佳私有基准。
        - 这里保留的官方收入分母没有与估值配对。
      - - Kraken
        - 私有公用事业软件
        - $500m+ 已签合同年度收入；支持 70m+ 账户
        - 隐含估值 $8.65bn；收入倍数 >17x
        - 保留材料中最强的软件式公用事业经济性上行可比。
        - 纯软件基础设施的分母，根本上优于零售供能。
      - - Kaluza
        - 私有公用事业软件
        - 此前 20% 股权对应 $500m 估值；据报道新交易可能寻求 >$1bn
        - 与 ARR 叙事绑定的 $1bn-$2.5bn 讨论区间
        - 说明投资人会为公用事业软件期权支付溢价倍数。
        - 报道区间只是指示性，盈利能力仍受质疑。
    notes: 这组可比有意混合了公开零售商、公开分销商和私有公用事业软件公司。Fuse 当前价格只有落在软件权重更高的一端才显得合理。
