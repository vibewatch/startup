  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接供应商、气候科技同行与现状替代
        blocks:
          - type: paragraph
            body: >-
              Fuse 不只是在和另一家数字资费初创公司竞争。真实格局横跨三类：（1）Octopus、OVO、E.ON Next、EDF、British Gas、Good Energy、Ecotricity
              等规模化零售供应商；（2）Kraken、Kaluza 等让这些供应商更聪明的气候科技软件层；（3）留在与价格上限挂钩的资费上，同时分别购买 EV、太阳能、电池或热泵产品的现状替代。Ofgem
              称六家大公司仍控制国内市场 91% 份额，Octopus 已是英国最大的电力供应商和第二大天然气供应商。这很关键，因为 Fuse 要切入的市场里，分销、客户信任和资费试验已经高度集中。Fuse 的定位清楚：app
              优先切换、低对外价格、早期向发电和智能家居控制垂直整合，并承诺让家庭账户比传统组合更简单。但标杆已经很高，尤其是认真纳入软件、安装和服务深度，而不是把供能当成纯商品时。
