      - number: '7.2'
        title: 监管、法律与客户保护风险
        blocks:
          - type: paragraph
            body: >-
              核心监管栈真实、当前有效，也与投资相关。能源侧，Fuse 必须保持供能许可状态良好，并遵守 Ofgem 的投诉处理要求，包括投诉未解决时升级至免费且独立的救济路径。公开证据显示正确框架已经存在——Ofgem
              的八周解决标准、2008 年投诉处理法规，以及一条现行 Fuse Energy Supply Ombudsman
              路径——但同一批公开证据也显示客户摩擦足够多，合规是一个活的运营问题，而不是打勾项。数据侧，Fuse 隐私政策明确设想使用智能电表用量数据、弱势状态数据、AI 辅助处理，并与
              DNO、催收机构、广告技术和分析供应商共享；当 ICO 称 DUAA 实施和更严 PECR 处罚正在扩大时，任何隐私或同意失误的影响半径也会变大。代币层是整个栈里法律不对称性最强的一段：Fuse
              在美国获得有帮助的 SEC 救济，但英国 FCA 边界仍在移动，其促销制度已经要求 qualifying-cryptoasset 促销公平、清晰且不误导。即使当前没有执法行动，英国重设计或地理围栏的概率仍有意义。
