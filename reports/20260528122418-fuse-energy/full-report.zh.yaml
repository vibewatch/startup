      - number: '1.4'
        title: 产品、可再生资产基础与扩张路线图
        blocks:
          - type: paragraph
            body: >-
              公开材料显示，Fuse 已在运营一个比新进入供能商更宽的能源平台，即便许多产品野心仍偏前瞻。Which? 称公司已运营 18MW 英国太阳能和风电站点；Fuse 自有项目页披露 Balnamoon 的 0.8MW
              风机，以及 Bullous Park 和 Netley North 的 12MW、5.2MW 太阳能站点，与几十兆瓦的足迹相匹配。官方披露还称，Fuse 在 2024-04-01 至 2025-03-31
              燃料结构期间，从太阳能和风电场发电 18.9 GWh，并拥有 450MW 全球开发管线；招聘页则把野心进一步拉到太瓦级建设。客户侧，线上产品界面包括零售天然气和电力、EV
              充电优化、数字开户、太阳能与电池回售跟踪；智能设备奖励和电网平衡工具被放在下一层。Renewables Now 称 Series B
              将支持美国、爱尔兰和西班牙供能业务上线、即插即用太阳能电池套件，以及智能家庭能源操作系统。2026 年 5 月收购 20MW Cwm Ifor
              太阳能电站，是一个具体证据点：国际化和硬件野心正配合真实资产积累，而不只是软件营销。
