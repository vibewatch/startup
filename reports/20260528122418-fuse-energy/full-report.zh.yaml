  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 投资逻辑
      - 反向逻辑
      - 什么会改变判断
    rows:
      - - 垂直整合
        - 发电、供能、EV、电力回输和智能家居控制，可以抬高客户终身价值，并打开更多利润率选项。
        - 公开证据看起来仍像一家年轻低价供应商，带有期权价值，而不是已证明的公用事业 OS。
        - 展示附加率、产品级毛利和软件收入组合。
      - - 获客
        - 公司有清晰的省钱叙事，看起来正在快速扩张。
        - 英国能源市场的价格驱动获客，可能掩盖低价差和高服务成本。
        - 按电价队列披露毛利率和服务成本。
      - - 可再生可信度
        - 自有发电和项目管线支撑真实资产叙事。
        - Which? 的方法只认定售出电力中 0.2% 为可再生电力，挑战了这个故事。
        - 对齐自有发电量、证书和客户层面的可再生交付。
      - - 执行质量
        - 对一家年轻供应商而言，客户调查分数尚可，产品体验也显得现代。
        - 投诉发生率、脆弱用户支持和缺少电话支持都会制造摩擦。
        - 证明投诉率改善、解决速度更快，并强化脆弱客户政策。
      - - 资本位置
        - 本轮规模和此前融资说明公司能拿到大额资本。
        - 公开文件显示关联方资金、信托持有现金，且没有清晰的独立流动性图景。
        - 披露资产负债表桥和不受限现金来源。
      - - 估值溢价
        - 如果 Fuse 成为规模化混合平台，溢价可以被证明合理。
        - 今天的 $5bn 已经提前计入了很大一部分成功。
        - 要么降低入场价，要么迅速证明软件式经济性。
    notes: 反向逻辑聚焦估值质量和运营证明质量，不是在质疑 Fuse 的市场是否真实。
