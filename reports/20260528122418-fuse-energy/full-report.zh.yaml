      - number: '2.3'
        title: 买方、用户、付款方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              Fuse 面对的不是单一买方，而是一架买方阶梯。第一层是家庭账单付款人，他们想更容易切换，也想获得比价格上限或传统供应商更低的月度电费。在这一层里，EV
              车主和分时电价用户尤其有价值，因为资费本身改变行为，而不只是替换供应商品牌。第二层是已经安装屋顶太阳能、电池储能或两者兼有的家庭或房东，他们关心回售变现、设备可视化和自动化。第三层是多站点房产业主或小企业买方，他们重视统一账单、更快切换，以及未来的站点级优化。第四层根本不是消费者：它是电网或市场交易对手——供应商交易、由
              Elexon 支撑的市场基础设施、NESO，或 DNO 相关的灵活性项目——当足够多设备接入后，它们为聚合行为付费。


              这种分层重要，因为采用路径分阶段。客户通常先因价格进入零售切换，再升级到更定制的资费（固定、EV 或多费率），随后挂上屋顶太阳能 /
              回售或电池经济性，最后才真正成为可编排的灵活资产。正因这个顺序，哪怕灵活性经济性最终更值钱，零售市场仍是实际获客漏斗。也正因如此，Fuse
              使命页关于协调数百万客户的表述在方向上说得通：公司只有先在家庭边缘赢得信任和账单授权，才能规模化销售编排。买方地图因此结合了消费者预算、安装商经济性、软件和数据基础设施以及电力市场结算，而不是整齐地落进单一商品能源类别。
