      - number: '5.3'
        title: 部署摩擦：硬件依赖、安装约束与服务质量
        blocks:
          - type: paragraph
            body: >-
              Fuse 的新产品不是纯软件功能；它们带来了真实硬件和现场执行依赖。商店和指南列出的是第三方设备，而非自有设备，尤其是家用 EV 充电的 Easee，以及热泵和锅炉设备的
              Vaillant。安装指南也说明了部署为何会慢。EV 充电需要检查电气容量、专用回路、符合 BS 7671，许多情况下还要通知 DNO。商业太阳能还涉及站点勘察、规划问题和 G99
              并网批准。热泵安装取决于物业适配度、室外空间、散热器或地暖兼容性、EPC 状态；如果客户希望获得补贴，还需要 MCS 认证安装商。


              这些依赖让安装商工作流具有战略意义，也制造了明显的服务风险界面。Fuse 通过 app 和支持邮箱提供支持，工程师 app 则暗示公司有一些内部工具协调现场工作。但公开证据也显示摩擦。Resolver
              的投诉类别包括账单 / 付款和智能电表安装；MoneySavingExpert 讨论串显示，英国消费者会积极讨论资费和切换决定。这些都不能证明结构性产品失败，却意味着 Fuse 的差异化不能只靠 app
              打磨。公司必须在 OEM 硬件、安装商可用性、客户沟通、智能电表数据质量和受监管供能义务之间稳定执行。从产品角度看，这个堆栈最难的部分不是销售愿景，而是规模化交付实体安装和支持。
