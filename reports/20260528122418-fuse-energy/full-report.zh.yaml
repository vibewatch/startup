        - 家庭活期账户 / 直接借记
        - 相较价格上限能看见省钱，或既有服务糟糕时触发
        - 家庭公用事业预算
      - - EV / 多费率家庭
        - 司机或技术敏感型家庭
        - EV 充电器、智能电表、家用设备
        - 家庭电力预算
        - 离峰充电经济性和电价优化触发
        - 家庭交通 + 公用事业预算
      - - 太阳能 / 上网 / 电池家庭
        - 房主或房东
        - PV 系统、电池、上网电表、App 用户
        - 房产所有者或房东
        - 客户开始想看清自发自用并获得上网价值时触发
        - 家装 / 能源资本开支预算
      - - 房东 / 多物业运营方
        - 组合所有者或管理人
        - 租户加物业运营
        - 所有者 / 组合 SPV
        - 集中计费、空置管理和可复制软硬件栈触发
        - 物业运营或资本开支预算
      - - SME 或多站点企业
        - 运营或财务负责人
        - 各地点的站点经理和负载
        - 企业活期账户
        - 电价简化、更快切换和跨站点管理触发
        - 设施 / 财务预算
      - - 灵活性市场交易对手方
        - 供应商交易台、聚合商、DNO 或 NESO 关联项目
        - 已注册的家庭 / SME 设备
        - 灵活性市场、供应商损益或电网项目预算
        - 设备接入足够多、资产可标准化并可调度后触发
        - 交易、平衡或电网服务预算
    notes: Fuse 的买方地图是分层的，不是线性漏斗：零售获客通常始于家庭账单支付人，变现之后可扩展到 硬件、上网电量和灵活性市场交易对手方。
