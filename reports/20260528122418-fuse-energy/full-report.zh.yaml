  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开融资记录在标题数字上很直接，在分母上很薄。多家保留信源重复同一条 2025 年 12 月信息：Fuse 融资 $70 million，估值标在 $5 billion，服务约 200,000 个英国家庭，声称
              ARR 约 $400 million，并称在同比增长 8x 的同时已经现金流转正。这足以说明到 2025 年底，公司拥有真实投资者需求和真实商业牵引。但还不足以说明价格有支撑。即使用公司披露的 $400
              million 作为分母，也已经意味着约 12.5x
              ARR。公开来源没有说明这个数字是审计收入、毛利润、贡献利润，还是与零售供能相关的更宽泛总账单额代理。这个缺口具有决定性，因为公用事业和供应商公开市场通常以远低得多的收入倍数交易，只有 Kraken
              这类软件权重很高的公用事业平台才接近或超过这类倍数。因此，入场纪律必须从一条简单规则开始：除非公司能拿出审计证据证明分母具有软件式质量，否则不要把当前轮次当作 Fuse 已是成熟软件平台来承销。
