      - number: '8.4'
        title: 建议、置信度、投资逻辑失效触发点与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              当前价格下的建议是继续研究，不是因为 Fuse
              缺少野心，而是因为公开证据尚不足以支持按一个已经成型的软件加能源平台付费。中等置信度是合适的：估值过高信号在方向上很强，但分母细节缺失意味着仅靠公开证据无法判断正确倍数应落在低于 1x
              的零售区间、低个位数倍的混合业务区间，还是更高很多。风险评级为高，因为下行可以通过几条渠道同时到来：未来轮次把估值重设到 $5 billion
              以下、零售利润率受压、客户服务和监管状况恶化，或私有股权结构表中隐藏不友好的优先权条款。退出准备度仍早。公开来源显示，这仍是一家跨国家和产品扩张的私营公司，而不是拥有申报级披露的近端公开市场候选。实际应对很简单。投资者应要求经审计的
              ARR 到收入桥、贡献利润和毛利率瀑布、当前股权结构表和优先股堆叠、客户留存和投诉趋势数据，以及更高毛利的硬件或软件产品正在规模化附加销售的证据。没有这些材料，当前轮次更像叙事估值，而不是已被承销的入场价格。
            claimRefs:
