      - number: '6.5'
        title: 留存代理指标看起来有希望，但流失韧性仍是本章主要承销缺口
        blocks:
          - type: paragraph
            body: >-
              Fuse 没有公开披露流失率、续约、活跃账户年限，或任何能让投资者直接承销客户耐久度的队列留存指标。替代指标喜忧参半。积极一面是，Trustpilot
              和应用商店分数高，评论数量不低，产品还在不断拓宽——从天然气到 EV 资费、智能充电桩、多物业管理和移峰用能奖励——说明初始换约之后，家庭价值仍有真实加深机会。谨慎一面是，Which? 仍记录了 16%
              的正式投诉发生率、弱势客户支持得分偏弱，以及围绕退款、估读和错误余额的反复问题。SwitchInsights
              同样把没有电话客服和直接借记摩擦不稳定列为最大限制。因此，集中风险不在于某一个客户贡献过多收入，而在于模型过度偏向数字自信的直接借记家庭，同时让数字能力较弱、预付费或电话优先用户相对服务不足。综合看，留存大概率好于披露缺失所暗示的水平，但还不足以称为已被验证。
