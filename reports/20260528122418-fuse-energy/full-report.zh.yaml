  - id: TM002
    title: TAM / SAM / SOM 或规模测算视角表
    columns:
      - 视角
      - 地域 / 单位
      - 数值
      - 发布方 / 方法
      - 置信度
      - 局限
    rows:
      - - 英国家庭
        - 英国家庭
        - 29.0M 家庭（2025）
        - ONS families and households 公报（SM026）
        - 户数口径可信度高
        - 家庭户数不等同于供应商账户，也不等同于可切换地址
      - - 住宅用电支出池
        - 英国年度支出
        - ≈ £31.0B
        - 29.0M 户家庭 × £1,069 平均标准电费账单（SM026 + SM009/SM010）
        - 中
        - 账单是平均标准电费账单，不是 Fuse 收入或毛利
      - - 受价格上限影响的可切换池
        - 英国家庭 / 年度支出代理指标
        - ≈ 17.4M 户家庭；≈ £18.6B 支出池代理指标
        - Energy UK 称 April 2026 仍有 60% 客户处在价格上限内；再乘以平均电费账单
        - 中-低
        - 代理指标假设受价格上限影响的家庭接近平均用电支出
      - - 已观察到的切换流量
        - GB 月度换供应商量
        - Jan 2026 有 256,169 次电力供应商切换（若保持稳定，年化约 3.1M 次）
        - Ofgem 零售市场指标 + GOV.UK 切换序列（SM005 + SM011）
        - 中
        - 月度年化仅作示意；切换量会围绕价格上限窗口波动
      - - 可再生供给背景
        - 英国发电量
        - 可再生占比 52.5%；2025 清洁电力 152.5 TWh
        - DESNZ Energy Trends 与 RenewableUK 相互印证（SM017 + SM023）
        - 高
        - 发电占比是供给侧背景，不是直接客户收入
      - - 屋顶 / 分布式太阳能装机基础
        - 英国安装量 / 容量
        - 截至 Mar 2026，2.003M 套安装；22.1 GW
        - pv magazine 与官方更新页面引用的 DESNZ 部署数据（SM028 + SM012 + SM014）
        - 中
        - 包含英国全部太阳能，不只包含 Fuse 可触达客户或住宅系统
      - - 电池采用代理指标
        - 英国认证安装量
        - 截至 Sep 2025，59,000 套认证电池；同比增长 122%
        - MCS 文章，官方 2025/26 电池序列现已上线（SM015 + SM013）
        - 中-低
        - 官方 2025/26 序列的可读公开 HTML 未披露当前头部安装量
      - - 灵活性 / VPP 准备度
        - GB 灵活性容量 / 消费者参与
        - 2030 前需要 51-66 GW；DFS 参与者 >2.5M
        - Clean Flexibility Roadmap + Clean Power 目标简报（SM018 + SM022）
        - 中-高
        - 政策需求和参与人数不能直接转化为供应商收入
      - - Fuse 可见供给侧足迹
        - 开发管线
        - 450 MW 管线
        - Fuse 项目页面（SM003）
        - 低-中
        - 公司披露口径且覆盖全球，不纯是英国，也不一定已全部运营
    notes: >-
      这张表刻意把零售支出、装机基础和政策容量三种视角放在一起，因为没有单一公开来源能测算 Fuse“零售 + DER + 灵活性”组合市场的规模。双边 PPA 价值、绿色电价切换占比，以及清晰的 2026
      电池装机基础头部数据，仍披露不足。
