      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              估值的正确框架是一组情景区间，而不是一个貌似精确的标记。乐观情景下，Fuse 证明报告 ARR 不只是零售总流水，而是一个质量很强的分母，伴随扩大的贡献利润率、有意义的硬件或软件附加率，以及通往公用事业 OS
              经济性的可信路径。在这个结果里，当前 $5 billion 价格可被辩护为高溢价成长资产；如果软件式变现浮现，甚至还能继续复合。基准情景明显更低。它假设 Fuse
              仍是一家快速增长的混合能源业务，因增长、自有发电和产品宽度而应相对上市零售商享有溢价，但不应享受 Kraken
              式软件倍数。悲观情景更尖锐：如果增长质量被证明更像公用事业，投诉和监管摩擦持续，资本强度仍可见，那么公开零售能源可比公司暗示的估值会远低于 2025 轮。可比集合让这种不对称很清楚。Good Energy
              2025 年私有化交易 EV 隐含约 0.38x 收入，Yahoo 公开统计显示 Genie 为 0.73x 销售额、UGI 为 1.06x、Centrica 为 0.48x；Kraken 高于
              17x，是因为它被明确作为软件平台出售。Fuse 当前价格已经贴近这个光谱的乐观边缘。
