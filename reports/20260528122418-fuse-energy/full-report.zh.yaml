  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 投资判断的核心，是真实牵引力与薄弱公开证据之间错配：现有公开材料还不能证明公司披露的分母配得上软件型倍数。
    data:
      nodes:
        - id: n1
          label: 真实牵引力
          detail: $70m 轮次、$5bn 估值、200k 家庭用户以及据报 $400m ARR，都说明需求真实存在。
        - id: n2
          label: 分母质量缺口
          detail: 公开来源没有说明 ARR 是经审计收入、毛利还是其他 KPI。
        - id: n3
          label: 公开可比锚
          detail: 零售能源同行的销售倍数约 0.4x-1.1x，远低于 Fuse 隐含的 12.5x。
        - id: n4
          label: 软件可选性
          detail: 只有类似 Kraken 的公用事业软件倍数，才接近当前 Fuse 比率。
        - id: n5
          label: 建议
          detail: 在经审计经济性和股权结构条款披露前，$5bn 估值下继续研究。
      edges:
        - from: n1
          to: n5
          label: 牵引力真实
        - from: n2
          to: n5
          label: 但分母质量未证实
        - from: n3
          to: n5
          label: 公开市场支撑偏弱
        - from: n4
          to: n5
          label: 牛市情景取决于软件证据
    approximationNotes: 该图映射决策逻辑，而不是模型。每个节点都扎根于留存来源，但节点之间的权重是分析判断。
    claimRefs:
      - CV001
      - CV016
      - CV027
      - CV029
      - CV038
      - CV041
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 当前价值支撑会随投资者把零售能源倍数还是软件型倍数套到 Fuse 披露分母上而大幅变化。
    data:
      items:
        - label: Good Energy 企业价值 / 收入
          value: 0.38
          description: £67.8m 企业价值对应 £180.1m 收入，隐含约 0.38x。
        - label: Centrica 市值 / 销售额
          value: 0.48
          description: Yahoo 2026 年 5 月市值和过去十二个月收入，隐含约 0.48x 销售额。
        - label: Genie 市值 / 销售额
          value: 0.73
          description: Yahoo 2026 年 5 月市值和过去十二个月收入，隐含约 0.73x 销售额。
        - label: UGI 市值 / 销售额
          value: 1.06
          description: Yahoo 2026 年 5 月市值和过去十二个月收入，隐含约 1.06x 销售额。
        - label: Fuse 隐含头条倍数
          value: 12.5
          description: $5bn 估值除以公司披露的 $400m ARR。
        - label: Kraken 隐含收入倍数
          value: 17.3
          description: $8.65bn 估值对应 $500m+ 合同年收入。
    approximationNotes: 这些倍数混用了 EV / 收入、价格 / 销售额和私募估值 / 收入参照，因为公开记录不足以为 Fuse 搭出更干净的同口径框架。
    claimRefs:
      - CV016
      - CV020
      - CV021
      - CV022
      - CV023
      - CV025
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 在留存来源假设下，当前 $5 billion 轮次更接近牛市情景低端，而不是基准情景中心。
    data:
      items:
        - id: bear
          label: 熊市情景
          low: 0.3
          value: 0.5
          high: 0.8
          unit: $B equity value
        - id: base
          label: 基准情景
          low: 1
          value: 1.5
          high: 2.2
          unit: $B equity value
        - id: bull
          label: 牛市情景
          low: 4
          value: 5
          high: 6
          unit: $B equity value
    approximationNotes: 这些区间是锚定留存可比倍数和明确分母质量假设的判断区间。它们不是 DCF，也不应被视为正式估值标记。
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV041
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: IC 可用快照：按据报 2025 轮次价格，对 Fuse 的当前判断。
    data:
      items:
        - label: 建议
          value: Research-more
          note: 公司本身比当前公开投资论证更有说服力。
        - label: 信心
          value: Medium
          note: 方向上观点较强，但分母质量仍不完整。
        - label: 风险评级
          value: High
          note: 下轮降估、利润率、服务和条款结构风险都很重要。
        - label: 估值立场
          value: Stretched
          note: $5bn 已经假设结果处于高端，或具备软件型质量。
        - label: 公开分母质量
          value: Weak
          note: 没有从披露 ARR 到收入、毛利或自由现金流的审计桥接。
        - label: 期权价值
          value: Real
          note: 发电、硬件、EV 和操作系统雄心若能货币化，就能增加价值。
        - label: 最佳可比视角
          value: Hybrid
          note: 公开零售商锚定下行；Kraken 式软件锚定上行。
    approximationNotes: KPI 标签是基于留存证据集形成的投资判断，不是公司披露的指标。
    claimRefs:
      - CV017
      - CV029
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
