  - id: TV005
    title: 投资逻辑击穿和终止触发项表
    columns:
      - 触发项
      - 阈值或事件
      - 为什么重要
      - 行动含义
    rows:
      - - 下轮融资降价或大幅折价老股交易
        - 经济性被证明前，任何可信融资显著低于 $5bn
        - 这会说明私募市场价格发现已经否定 2025 年估值标记。
        - 转向回避 / 不加仓。
      - - 收入质量落空
        - 经审计桥显示 ARR 大多是低利润率总账单，贡献利润率弱
        - 击穿当前定价所需的软件上行故事。
        - 向零售能源倍数重估。
      - - 服务 / 监管恶化
        - 投诉率、脆弱客户支持或 Ofgem 审查显著恶化
        - 直接压高服务成本、损害品牌，并压缩未来监管空间。
        - 将持仓列入观察，并下调预期价值。
      - - 股权结构悬置风险
        - 优先权、参与权或老股占比高的结构显著差于预期
        - 即使经营执行扎实，私募回报数学也可能失效。
        - 没有完整下行建模前不投资。
      - - 产品附加落空
        - EV、硬件、电力回输或软件产品未能产生可衡量的更高利润率附加
        - 公司会更像供应商，而不是平台。
        - 将乐观情景视为破裂。
    notes: 这份登记表聚焦会推翻当前溢价支撑的事件，而不是泛泛的运营噪音。
    claimRefs:
      - CV033
      - CV040
      - CV041
      - CV044
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - ARR / 收入桥
        - 经审计对账：从报道 ARR 到 GAAP 或法定收入、毛利和贡献利润率
        - 当前估值成败取决于分母质量。
        - CFO / 财务尽调室；审计支持。
      - - 股权结构表和条款
        - 当前股数、证券类型、清算优先权、参与权，以及任何老股拆分
        - 不知道投资人实际买到什么，就无法建模回报数学。
        - 法律尽调加已签署轮次文件。
      - - 队列经济性
        - 按电价队列拆分流失、留存、CAC 回本、投诉成本和坏账画像
        - 如果服务和利润率质量弱，价格驱动的客户增长可以看起来亮眼，却仍在毁掉企业价值。
        - 商业财务和客户运营资料包。
      - - 产品附加和软件变现
        - EV、电力回输、智能家居、硬件及任何软件式收入的附加率、ARPU 提升和毛利率
        - 这是把 Fuse 估成不只是供应商所必需的。
        - 产品分析、计费和单位经济审查。
      - - 流动性和营运资本
        - 不受限现金、套保政策、监管资本位置和集团内资金依赖
        - 公开文件已经显示信托持有现金和关联方资金。
        - 资金管理和董事会报告审查。
      - - 退出准备度
        - 预期流动性路径、下一轮融资里程碑，以及面向公开市场准备度的信息披露计划
        - 如果没有可兑现溢价的现实路径，投资人不应支付溢价。
        - CEO / 董事会讨论和融资路线图。
    notes: 这些需补充项是最低数据集；只有拿到它们，当前基于公开证据的判断才能转成可定价的承销案例。
    claimRefs:
      - CV032
      - CV042
      - CV043
