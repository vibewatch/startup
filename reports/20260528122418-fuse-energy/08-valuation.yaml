          detail: Public sources do not show whether ARR is audited revenue, gross profit, or another KPI.
        - id: n3
          label: Public comp anchor
          detail: Retail-energy peers screen around 0.4x-1.1x sales, far below Fuse's implied 12.5x.
        - id: n4
          label: Software optionality
          detail: Only Kraken-like utility software multiples approach the current Fuse ratio.
        - id: n5
