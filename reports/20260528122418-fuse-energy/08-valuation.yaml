    tableRefs:
      - TV002
    figureRefs:
      - FV002
  - id: scenario-range-and-comps
    title: Bull, base, and bear scenarios
    body: >-
      The right way to frame valuation is as a scenario range rather than a false-precision mark. In the bull
      case, Fuse proves that the reported ARR is not just gross retail throughput but a strong quality
      denominator with expanding contribution margins, meaningful hardware or software attach rates, and a
      credible path to utility-OS economics. In that outcome, the current $5 billion price can be defended as
      a premium growth asset and could even compound if software-like monetisation emerges. The base case is
      materially lower. It assumes Fuse remains a fast-growing hybrid energy business that deserves a premium to
      listed retailers because of growth, owned generation, and product breadth, but not a Kraken-like
      software multiple. The bear case is starker: if growth quality proves utility-like, complaints and
      regulatory friction persist, and capital intensity stays visible, then public retail-energy comps imply a
      valuation far below the 2025 round. The comparable set makes the asymmetry clear. Good Energy's 2025
      take-private EV implied roughly 0.38x revenue, Yahoo's public statistics put Genie at 0.73x sales,
      UGI at 1.06x, and Centrica at 0.48x, while Kraken stands out above 17x because it is explicitly sold as
      a software platform. Fuse's current price already sits near the bull edge of that spectrum.
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV035
      - CV036
      - CV037
    tableRefs:
      - TV003
    figureRefs:
      - FV003
  - id: recommendation-and-diligence
    title: Recommendation, confidence, thesis-break triggers, and final diligence asks
    body: >-
      The recommendation at the current price is research-more, not because Fuse lacks ambition, but because
      the public evidence does not yet support paying for a fully formed software-plus-energy platform. Medium
      confidence is appropriate: the overvaluation signal is strong directionally, but the missing denominator
      details mean public evidence alone cannot determine whether the right multiple is a sub-1x retail band, a
      low-single-digit hybrid band, or something much richer. The risk rating is high because the downside can
      arrive through several channels at once: a future round resetting below $5 billion, retail margin
      compression, customer-service and regulatory deterioration, or unfriendly preference terms hidden in the
      private cap table. Exit readiness is early. Public sources show a private company still expanding across
      countries and products, not a near-term public-market candidate with filings-grade disclosures. The
      practical response is simple. Investors should require an audited ARR-to-revenue bridge, contribution and
      gross-margin waterfall, current cap table and preference stack, customer-retention and complaint trend
      data, and evidence that higher-margin hardware or software products are attaching at scale. Without those
      items, the current round looks more like a narrative mark than an underwritten entry.
    claimRefs:
      - CV032
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
    tableRefs:
      - TV005
      - TV006
