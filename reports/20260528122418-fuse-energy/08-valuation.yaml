  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Vertical integration
        - Generation, supply, EV, export, and smart-home control can raise lifetime value and margin options.
        - Public evidence still looks like a young low-price supplier with option value, not a proven utility OS.
        - Show attach rates, product-level gross profit, and software revenue mix.
      - - Customer acquisition
        - The company has a sharp saving-led message and appears to be scaling quickly.
        - Price-led acquisition in UK energy can hide low spread and high service cost.
        - Disclose gross margin by tariff cohort and cost to serve.
      - - Renewable credibility
        - Owned generation and project pipeline support a real asset narrative.
        - Which?'s methodology credits only 0.2% renewable electricity sold, challenging the story.
        - Reconcile own-generation output, certificates, and customer-level renewable delivery.
      - - Execution quality
        - Customer survey scores are decent for a young supplier and the product feels modern.
        - Complaint incidence, support for vulnerable users, and lack of phone support create friction.
        - Show improving complaint rates, faster resolution, and stronger vulnerable-customer policies.
      - - Capital position
        - The round size and prior financing indicate access to serious capital.
        - Public filings show related-party funding, trust-held cash, and no clear stand-alone liquidity picture.
        - Open the balance-sheet bridge and sources of unrestricted cash.
      - - Valuation premium
        - A premium can be justified if Fuse becomes a scaled hybrid platform.
        - Today's $5bn already prices in a large share of that success.
        - Either lower the entry or prove software-like economics quickly.
    notes: >-
      The anti-thesis focuses on valuation quality and operating-proof quality, not on whether Fuse's market is real.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
      - CV010
      - CV012
      - CV017
      - CV031
      - CV032
