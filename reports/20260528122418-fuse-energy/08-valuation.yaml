company:
  name: Fuse Energy
chapter:
  number: 8
  title: Valuation
  summary: >-
    Fuse Energy's reported $5 billion valuation rests on a real growth story but a weak public underwriting bridge.
    The headline implies roughly 12.5x on company-reported $400 million ARR, well above public retail-energy
    peers and only supportable if a meaningful share of the denominator behaves like high-margin software or
    utility-OS revenue rather than thin-margin energy supply. Public evidence therefore supports a
    research-more recommendation, medium confidence, a high risk rating, and a stretched valuation stance at
    the current price.
sections:
  - id: valuation-context-and-entry-discipline
    title: Valuation context and entry discipline
    body: >-
      The public financing record is straightforward on the headline and thin on the denominator. Multiple
      retained sources repeat the same December 2025 message: Fuse raised $70 million, was marked at $5
      billion, served roughly 200,000 UK households, claimed about $400 million of ARR, and said it had
      become cash-flow positive while growing 8x year on year. That is enough to conclude that the company
      had real investor demand and real commercial traction by late 2025. It is not enough to conclude that
      the price is supported. Using the company-reported $400 million figure as the denominator already
      implies about 12.5x ARR. Public sources do not show whether that figure is audited revenue, gross
      profit, contribution margin, or a broader gross-billing proxy tied to retail energy supply. That gap is
      decisive because public market utilities and suppliers usually trade on far lower revenue multiples,
      while only software-heavy utility platforms such as Kraken approach or exceed this kind of ratio. Entry
      discipline therefore has to start with a simple rule: do not underwrite the current round as if Fuse is
      already a proven software platform unless the company can produce audited evidence that the denominator
      has software-like quality.
    claimRefs:
      - CV001
      - CV003
      - CV015
      - CV016
      - CV017
      - CV024
      - CV025
      - CV027
      - CV028
      - CV029
