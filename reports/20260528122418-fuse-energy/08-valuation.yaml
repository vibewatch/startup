  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: cap-table-opacity
      missingEvidence: Current cap table, security type, liquidation preferences, and primary-versus-secondary split for the December 2025 round.
      whyItMatters: Private-round return math and downside protection cannot be modeled from the current public record.
      diligencePath: Request executed financing documents, closing memo, and latest fully diluted cap table from company counsel.
      relatedQuestionRefs:
        - QV009
      relatedTableRefs:
        - TV006
    - type: missing-source
      severity: blocking
      topic: denominator-quality
      missingEvidence: Audited bridge from reported ARR to statutory revenue, gross profit, contribution margin, and cash conversion.
      whyItMatters: The headline price is impossible to underwrite responsibly without knowing what the reported denominator actually measures.
      diligencePath: Obtain audit-backed KPI reconciliation plus monthly management accounts for 2025 and Q1 2026.
      relatedQuestionRefs:
        - QV005
        - QV018
      relatedTableRefs:
        - TV006
    - type: private-evidence-only
      severity: material
      topic: cohort-economics
      missingEvidence: Churn, NRR, CAC payback, complaint cost, bad debt, and gross margin by customer cohort and tariff type.
      whyItMatters: Price-led growth can look impressive while still destroying enterprise value if service and margin quality are weak.
      diligencePath: Review board KPI pack, cohort tables, complaint-cost analysis, and gross-margin bridge by product line.
      relatedQuestionRefs:
        - QV025
        - QV029
      relatedTableRefs:
        - TV006
    - type: missing-source
      severity: material
      topic: software-optionality
      missingEvidence: Verified attach rates and gross-margin contribution for EV, export, smart-home, hardware, and any software-like revenues.
      whyItMatters: The bull case depends on Fuse monetizing more than retail supply economics.
      diligencePath: Request product-level revenue, gross margin, active-user, and attach-rate reporting for non-core supply products.
      relatedQuestionRefs:
        - QV018
        - QV019
      relatedTableRefs:
        - TV003
        - TV004
        - TV006
    - type: stale
      severity: material
      topic: service-and-regulatory-trend
      missingEvidence: Current 2026 complaint trend, Ombudsman or Ofgem interactions, vulnerable-customer remediation progress, and any capital-adequacy discussions.
      whyItMatters: Service and regulatory execution can compress retail multiples quickly and invalidate the premium narrative.
      diligencePath: Request 2026 monthly complaints dashboard, any Ofgem correspondence, and customer-service improvement plan.
      relatedQuestionRefs:
        - QV029
        - QV026
      relatedTableRefs:
        - TV005
    - type: missing-source
      severity: minor
      topic: exit-readiness
      missingEvidence: Management's expected liquidity path, next financing milestones, and any timetable for public-company-style reporting.
      whyItMatters: Investors paying a premium need a plausible route to realizing that premium over time.
      diligencePath: Ask management and lead investors for expected financing cadence, secondary plans, and disclosure roadmap.
      relatedQuestionRefs:
        - QV027
        - QV030
      relatedTableRefs:
        - TV001
        - TV006
