evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current board composition, observer rights, control provisions, and any founder-vs-investor voting arrangements.
    whyItMatters: >-
      A $5 billion private valuation with a rapidly expanding product and regulatory footprint cannot be underwritten
      cleanly without understanding who controls financing, risk, and strategic decisions.
    diligencePath: Request the latest board list, shareholder agreement summary, and lead-investor rights memo from company counsel.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: funding-reconciliation
    missingEvidence: >-
      A full round-by-round capital history that reconciles the careers-page $170 million total raised to the publicly
      itemised prior $78 million seed and later $70 million Series B.
    whyItMatters: >-
      Without a reconciled financing ledger, investors cannot tell whether the gap reflects undisclosed interim rounds,
      debt, secondaries, SAFEs, or simple marketing shorthand.
    diligencePath: >-
      Request a dated financing table with each round, instrument type, gross proceeds, secondaries, and post-money
      valuation.
    relatedQuestionRefs:
      - QO014
      - QO015
    relatedTableRefs:
      - TO003
      - TO004
  - type: private-evidence-only
    severity: material
    topic: scale-verification
    missingEvidence: Independent audit support or regulated disclosure for the 200,000-household and $400 million ARR claims.
    whyItMatters: >-
      These are the headline metrics supporting Fuse's valuation, but the accessible public record still routes them
      back to company-originated disclosure.
    diligencePath: >-
      Request audited management accounts, regulatory customer files, cohort reporting, and a monthly active-meter count
      tied to revenue recognition.
    relatedQuestionRefs:
      - QO016
      - QO017
      - QO018
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: entity-history
    missingEvidence: >-
      Documentation explaining how the 2013-incorporated Fuse Energy Supply Limited entity relates to the 2022-founded
      startup and when or how the Paddington Power name was repurposed.
    whyItMatters: >-
      Entity history affects licence continuity, hidden liabilities, and whether public traction sits inside the same
      legal perimeter as the current fundraising story.
    diligencePath: >-
      Obtain incorporation-history documents, any share purchase or renaming documentation, and the current legal-entity
      structure chart.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
      - TO004
