company:
  name: TymeBank
chapter:
  number: 1
  title: Company Overview
  summary: Tyme Group is a Singapore-headquartered digital banking group that built TymeBank in South Africa and GoTyme Bank in the Philippines through a hybrid model that combines mobile banking with retail distribution. Public disclosures show the company crossed into profitability at the South African bank in December 2023, raised a $250 million Series D at a $1.5 billion valuation in December 2024, and reported more than 17 million customers across its portfolio by June 2025. The core watchpoints are incomplete public cap-table disclosure, a still-evolving South African rebrand to GoTyme, and regulatory or cost shocks that could raise the cost of serving low-income customers.
sections:
- id: identity-structure-and-footprint
  title: Identity, Structure, and Operating Footprint
  body: Tyme Group describes itself as a multi-country digital banking group focused on emerging markets and organized around a high-tech, high-touch banking model that is embedded into physical retail ecosystems. The current public corporate website is tyme.com, not the parked tymegroup.com domain supplied in the task brief, and the official site positions Singapore as the group headquarters while highlighting major operating footprints in South Africa, the Philippines, and a technology hub in Vietnam. On the South African side, TymeBank launched in February 2019 and, by May 2026, its consumer-facing site redirected to gotyme.co.za, indicating that the South African franchise is in the middle of a broader GoTyme brand alignment. In the Philippines, GoTyme launched in October 2022 with the Gokongwei Group and uses the same retail-led onboarding logic via kiosks, debit cards, and app-first account opening. The group-level website reports more than 15 million customers and 1,500-plus employees,
    while later 2025 company communications place the customer base above 17 million as Tyme adds new markets such as Indonesia and Hong Kong lending. The operating picture is therefore not a single-country neobank but a repeatable bank-building platform with one mature South African asset, one fast-scaling Philippine joint venture, and early adjacent market expansion.
