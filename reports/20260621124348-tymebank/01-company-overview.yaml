- id: leadership-governance-and-organization
  title: Leadership, Governance, and Organization
  body: 'Tyme''s public leadership materials and bank disclosures show a layered governance structure spanning the group holding company, the South African bank, the Philippine bank, and the Vietnam product-and-engineering unit. The official Tyme site identifies Coenraad Jonker as Executive Chairman and co-founder of Tyme, David Pfaff as Chief Executive Officer and director of the group, Nate Clarke as president and CEO of GoTyme Philippines, and Dieter Botha as CEO of TymeX. South African statutory filings add more detail on leadership transition at the banking entity: Tyme Bank Limited''s 2024 annual financial statements record Coenraad Jonker''s resignation as a director effective 30 September 2024 and Karl Westvig''s appointment from 1 October 2024, while the South African Reserve Bank''s April 2026 registered-banks list names Cheslyn Jacobs as chief executive officer of GoTyme Bank Limited. That sequence matters because it shows the founding team moving upward into group-level strategy
    while the operating bank professionalizes around a new executive bench. The same evidence also suggests that the most visible governance disclosures remain stronger at the regulated bank level than at the group-holding-company level. Public materials clearly identify founders and executives, but they do not publish a fully detailed group board, committee map, or post-Series D cap-table governance rights.'
