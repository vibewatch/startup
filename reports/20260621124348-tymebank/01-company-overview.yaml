callouts:
- calloutType: strength
  title: Tyme has already proven one core bank can reach profitability at scale
  body: The South African bank reached its first profitable month in December 2023, less than five years after launch, while still serving millions of lower-income customers through a branchless retail-partner model. That operational proof sharply differentiates Tyme from many digital-bank peers that are still growth-only stories.
  claimRefs:
  - CO014
  - CO015
  - CO016
- calloutType: insight
  title: The real asset is the bank-building platform, not only TymeBank South Africa
  body: Tyme's disclosures show the group is exporting the same model — technology buildout, retail distribution, and regulated balance-sheet products — from South Africa to the Philippines and now toward Indonesia and Hong Kong lending. That makes Tyme better understood as an operating platform for digital-bank replication in emerging markets.
  claimRefs:
  - CO004
  - CO006
  - CO009
  - CO037
- calloutType: risk
  title: Brand transition and low-income onboarding economics remain key execution watchpoints
  body: The South African franchise is in the middle of a GoTyme rebrand while also pushing back against higher state identity-verification fees. Because Tyme competes on mass-market affordability and retail-assisted onboarding, any misstep in brand migration or KYC-cost inflation can directly affect acquisition economics and customer trust.
  claimRefs:
  - CO028
  - CO029
  - CO040
