- id: funding-shareholders-and-capital-formation
  title: Funding, Shareholders, and Capital Formation
  body: 'Tyme''s capital history shows a progression from South African bank-builder to emerging-markets unicorn. The company''s May 2023 pre-Series C announcement said shareholders invested a total of $77.8 million, with Norrsken22 and Blue Earth Capital joining as new investors and proceeds earmarked for South Africa and Philippines growth, Southeast Asia expansion, and a partial share buyback. The same release disclosed a revenue run rate above $100 million and onboarding above 300,000 customers per month, giving investors a scale narrative before full profitability. By December 2024, TechCrunch reported that Tyme had closed a $250 million Series D at a $1.5 billion valuation, led by Nubank with a $150 million check for 10% of the business, alongside a $50 million investment from M&G Catalyst and $50 million from existing shareholders. TechCrunch also reported total capital raised of nearly $600 million and African Rainbow Capital retaining roughly 40% ownership. Supporting partner sources
    broaden the investor roster: British International Investment, Blue Earth, Apis, Tencent, the Gokongwei Group, and Norrsken22 all appear in official or shareholder communications. What remains undisclosed is the exact post-Series D ownership split outside the ARC and Nubank data points, meaning investors can trace capital quality and strategic fit but not reconstruct a full diluted cap table from public evidence alone.'
