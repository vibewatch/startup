  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Peer Set
        blocks:
          - type: paragraph
            body: >-
              Tyme does not compete against one tidy peer set. In South Africa, it fights on three fronts: Capitec as
              the closest mass-market digital benchmark, Discovery as a higher-income digital-and-rewards challenger,
              and the large incumbent banks that still dominate balance-sheet depth, branches, cash infrastructure, and
              SME funding. PwC's March 2026 major-banks review makes clear that the major South African banks remain
              well capitalized and intensely focused on digital growth, even as challenger banks start to reshape the
              next cycle. In the Philippines, the relevant substitutes are broader than licensed digital banks alone.
              GCash already owns everyday payment ubiquity at national scale, Maya is turning payments into a
              high-growth deposit-and-credit engine, and incumbent universal banks still control important payroll,
              trust, and multi-product relationships. The practical implication is that Tyme is competing for
              primary-account usage and transaction frequency, not merely for first account opening.
            claimRefs:
              - CP001
              - CP002
              - CP012
              - CP013
              - CP019
              - CP021
              - CP038
              - CP041
