    rows:
      - - Open a primary South African bank account
        - Download an app or visit a retail point, complete KYC, wait for activation, then obtain a card
        - GoTyme combines app onboarding, kiosk/customer-hub identity verification, and rapid card issuance
        - Branchless account opening and faster time-to-first-transaction
        - Model depends on retail footprint and affordable third-party identity verification
      - - Build liquid savings in South Africa
        - Keep surplus funds in a low-yield current account or move cash manually into savings
        - GoalSave pockets plus fixed deposits move saving into the same app experience
        - Higher headline rates and simpler in-app savings management
        - Bonus-rate rules and term structures are product-specific and not fully transparent on economics
      - - Take an unsecured consumer loan in South Africa
        - Collect documents, submit them manually, and wait for branch or lender review
        - GoTyme advertises a fully digital application with document submission and instant payout after approval
        - Lower paperwork burden and quicker disbursement
        - No public evidence on realized APRs, approvals, or default performance
      - - Fund and run a small business in South Africa
        - Use separate providers for working-capital lending, POS acceptance, and entrepreneur community support
        - GoTyme for Business packages funding, payments, and founder support under one surface
        - Potentially lower coordination cost and faster access to capital and payouts
        - Payments economics rely heavily on iKhokha-linked infrastructure rather than a fully disclosed in-house stack
      - - Open and activate a Philippine account
        - Visit a branch, wait for card production, and configure transfers later
        - GoTyme Philippines offers app or kiosk onboarding and instant Visa card issuance in about five minutes
        - Faster activation and earlier payment-card usage
        - Acquisition still depends on the kiosk and retail partner footprint
      - - Send, spend, and earn rewards in the Philippines
        - Use multiple apps or rails for transfers, bills, QR, debit-card spend, and loyalty points
        - GoTyme combines free internal transfers, InstaPay, QRPh, Visa, virtual card, and Go Rewards points in one app
        - One wallet can cover payments, transfers, and loyalty redemption
        - Transfer allowances, partner reward rates, and some fees remain rail-dependent
