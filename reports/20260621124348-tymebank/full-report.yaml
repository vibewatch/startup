            body: >-
              The visible product line already spans more than a simple checking account in both markets. South Africa's
              consumer menu now includes current-account banking, GoalSave, fixed deposits, personal loans, cards,
              instant payments, and human support, while the business surface adds working-capital funding, entrepreneur
              community features, and iKhokha-linked payment acceptance. In the Philippines, the app covers everyday
