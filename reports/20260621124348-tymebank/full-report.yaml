      - number: '2.3'
        title: Buyer, User, Payer Segments, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The buyer, user, and payer are often the same person in Tyme's markets, but the adoption path is still
              mediated by ecosystems, employers, merchants, and government rails. The most important customer groups are
              salaried mass-market adults who need low-cost primary accounts; cash-reliant households that want safer
              storage and low-friction payments; micro-merchants and MSMEs that need working capital and payment
              acceptance; and ecosystem partners that provide the physical surfaces where onboarding happens. In South
              Africa, retailer-assisted onboarding matters because digital access is broad but affordability, trust, and
              physical cash behavior still shape usage. In the Philippines, account ownership is lower but digital
              familiarity is already high thanks to smartphones, e-money, and rapid retail-payment digitization. That
              means the product journey often starts with payments and deposits before expanding into savings,
              salary-linked or personal credit, and merchant finance. The payer logic also differs by use case:
              households self-fund, merchants pay through fees or finance spreads, and ecosystem partners effectively
              subsidize customer acquisition by embedding kiosks, cards, and rewards into existing footfall. Tyme's
              market entry logic therefore depends on aligning product sequence with customer readiness: payments and
              account opening first, active usage second, and lending depth only after transaction data and trust
              accumulate.
