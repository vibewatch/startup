    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - - TymeX reusable asset layer
        - Supplies reusable product, engineering, and operating assets for multiple country banks
        - TymeX engineering teams and proprietary internal assets
        - Public sources do not reveal whether TymeX owns the full core ledger stack end to end
      - - Cloud infrastructure
        - Hosts core workloads and provides the elasticity behind multi-country operations
        - AWS cloud availability, cost controls, and FinOps governance
        - High concentration on one cloud provider increases vendor and outage exposure
      - - Application architecture
        - Runs banking services through microservices, containerisation, continuous deployments, and automated testing
        - Internal platform engineering discipline and DevOps quality controls
        - No public uptime targets, latency metrics, or post-incident disclosures were found
      - - AI engineering tooling
        - Improves developer productivity through CodeWhisperer, Amazon Q, and the internal Tymee chatbot
        - AWS generative-AI services and internal security/compliance governance
        - Public case studies emphasize productivity but not customer-facing release-quality outcomes
      - - Retail-assisted distribution layer
        - Connects apps, kiosks, tills, and customer hubs to physical acquisition and support
        - Retail partner footprint and KYC/identity rails
        - Partner-store changes or KYC fee shocks can raise acquisition cost
      - - Payment and network integrations
        - Enables card spend, transfers, rewards, cash-out, merchant acceptance, and cross-border flows
        - Visa, BancNet, QRPh, SWIFT, iKhokha, and local banking rails
        - Fee changes, partner negotiations, or network outages can affect margin and service quality
      - - Security and identity controls
        - Applies biometrics, MFA, encryption, fraud monitoring, card locks, and risk checks across customer flows
