      - number: '8.3'
        title: Comparable Set and Multiples Benchmarking
        blocks:
          - type: paragraph
            body: >-
              Constructing a comparable set for Tyme requires distinguishing between public-market benchmarks (which set
              ceiling and floor multiples), private-round benchmarks (which calibrate peer pricing at similar stages),
              and emerging-market-specific references (which adjust for geographic risk premium). The most direct public
              comparable is Nu Holdings (NYSE: NU), the parent company of Nubank. As of May 2026, Yahoo Finance data
              shows Nu Holdings traded at a market capitalization of approximately $59.75 billion with a trailing P/E of
              18.9×, serving over 110 million customers across Brazil, Mexico, and Colombia. Nu's 20-F filed with the
              SEC in April 2026 confirms full-year 2025 profitability and continued revenue growth. At Nubank's scale,
              the price-per-customer implied by its market cap was approximately $543 per customer — substantially above
              Tyme's $100 implied at the Series D.


              For private-round peers, Revolut is instructive as a high-end reference: Wikipedia reports Revolut was
              valued at $75 billion in November 2025, implying multiples well above what Tyme currently carries.
              Moniepoint, a closer African fintech peer, raised its Series C at a $1.0 billion valuation in October 2024
              with a strong Nigeria payments base — a direct comp in geography and stage, though with a different
              product mix. In the Philippines, Maya Bank (formerly PayMaya) reported PHP1.7 billion net income in 2025,
              while the overall Philippine digital bank deposit pool reached PHP139 billion by 2025, indicating that the
              competitive environment remains fragmented and growth-rich. GSMA's 2024 State of the Industry report on
              mobile money provides the macro anchor: 1.75 billion registered mobile money accounts globally and $1.68
              trillion in transactions in 2023, with the fastest growth in Sub-Saharan Africa and Southeast Asia.


              The practical implication for Tyme's valuation is a price-per-customer multiple convergence story: if Tyme
              can grow to 35–40 million customers by IPO and demonstrate group profitability, the per-customer implied
              value at a $4–7 billion IPO market cap would be $100–200, still below Nubank's mature-market $543 but
              reasonable for an emerging-market early-stage premium. The key sensitivity is the growth rate, not the
              current multiple.
            claimRefs:
