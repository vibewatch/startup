    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Structure, and Operating Footprint
        blocks:
          - type: paragraph
            body: >-
              Tyme Group describes itself as a multi-country digital banking group focused on emerging markets and
              organized around a high-tech, high-touch banking model that is embedded into physical retail ecosystems.
              The current public corporate website is tyme.com, not the parked tymegroup.com domain supplied in the task
              brief, and the official site positions Singapore as the group headquarters while highlighting major
              operating footprints in South Africa, the Philippines, and a technology hub in Vietnam. On the South
              African side, TymeBank launched in February 2019 and, by May 2026, its consumer-facing site redirected to
              gotyme.co.za, indicating that the South African franchise is in the middle of a broader GoTyme brand
              alignment. In the Philippines, GoTyme launched in October 2022 with the Gokongwei Group and uses the same
              retail-led onboarding logic via kiosks, debit cards, and app-first account opening. The group-level
              website reports more than 15 million customers and 1,500-plus employees, while later 2025 company
              communications place the customer base above 17 million as Tyme adds new markets such as Indonesia and
              Hong Kong lending. The operating picture is therefore not a single-country neobank but a repeatable
              bank-building platform with one mature South African asset, one fast-scaling Philippine joint venture, and
              early adjacent market expansion.
