      - number: '2.2'
        title: Country Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              South Africa and the Philippines need different sizing logic. In South Africa, the broad market is not an
              'unbanked-only' story: World Bank evidence shows 85% of adults already have an account, and GSMA reports
              mobile internet usage equivalent to 74% of the adult population. The key remaining monetizable gap is
              depth, not first access — low-fee everyday banking, digitally assisted onboarding, cash displacement, and
              SME credit for a heavily informal small-business base. That same GSMA report says 86% of MSMEs are
              informal and 79% of informal MSMEs have never borrowed, showing why lending, merchant acquisition, and
              deposit primacy matter more than simply counting accounts. In the Philippines, the market is more
              obviously still in inclusion-build mode: the BSP's 2025 CFIS shows only 50% of adults have a formal
              account, but 85% of households have at least one account, 62% of households already transact financially
              through electronic devices, smartphone ownership is 86%, and internet use is 89%. Meanwhile BSP's 2024
              status report shows digital retail payments at 57.4% of volume and 59.0% of value, suggesting the payment
              rail is maturing faster than full primary-bank ownership. For Tyme, that means South Africa's SAM is
              driven by underserved economics within a largely banked population, while the Philippines offers both
              inclusion expansion and product deepening from a lower account-ownership base.
