      - number: '8.5'
        title: Recommendation, Risk Rating, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The synthesis of market evidence, comparable set, scenario analysis, and identified gaps produces a
              conditional recommendation. Tyme Group is a structurally credible investment at $1.5 billion for investors
              with a 5–7 year horizon and tolerance for emerging-market execution risk. The combination of TymeBank SA's
              demonstrated profitability, Nubank's strategic endorsement, and a realistic 2028 IPO path creates a
              differentiated opportunity relative to generic emerging-market fintech exposure. However, the absence of
              consolidated group audited financials, unconfirmed Philippine profitability timeline, and partial cap
              table disclosure create information asymmetry that prevents a high-confidence buy recommendation on
              publicly available evidence alone.


              The recommended posture is a speculative buy with high risk rating, contingent on receipt of (1) group
              investor update or management accounts covering FY2025 and H1-2026 at the group level, (2) GoTyme
              Philippines quarterly P&L showing a credible break-even path, (3) post-Series D fully diluted cap table
              with liquidation preference details, and (4) due diligence on ARC's voting rights and governance
              provisions.


              Thesis-break triggers that would cause a re-evaluation to neutral or sell include: GoTyme Philippines
              failing to reach break-even by end 2027 (indicating structural unit economics issues, not just timing),
              ARC or Nubank conducting a secondary sale at a material discount to the $1.5 billion mark, TymeBank SA
              losing top-3 customer-count position in South Africa to an established challenger, or Tyme publicly
              deferring the IPO beyond 2030 without a strategic explanation. IFC's digital finance work and the broader
              development-finance investment in the segment confirm the macro tailwinds but do not remove
              company-specific execution risk. The final investment decision requires data not publicly available.
            claimRefs:
              - CV043
              - CV044
              - CV045
