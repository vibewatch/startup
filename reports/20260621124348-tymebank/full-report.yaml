      - number: '4.4'
        title: Unit Economics Proxies and Cost Structure
        blocks:
          - type: paragraph
            body: >-
              Tyme Group does not publicly disclose customer acquisition cost (CAC), lifetime value (LTV), ARPU, or net
              revenue retention metrics for TymeBank SA or GoTyme Philippines. Proxy estimates can be derived from
              public disclosures. Revenue per total registered customer is approximately R267/year (R3.11B / 11.6M
              customers), or R838/year per active customer (3.7M active per Pillar III). Operating expense per total
              customer is approximately R155/year (R1.80B opex / 11.6M customers), implying positive operating
              contribution per customer before credit impairment. The credit impairment charge of R534M, if allocated
              across the 3.7M active customer base, represents R144/active customer, bringing the all-in operating loss
              to approximately R59/active customer per year — a substantial improvement from the R94/active customer
              loss estimated for FY2024. No monthly fee means TymeBank deliberately forgoes fee income at acquisition,
              relying on cross-sell of high-margin products (fixed deposits, MoreTyme BNPL, merchant cash advances) for
              unit economics improvement over time. TymeBank transaction costs are confirmed by Solidarity research to
              be 30-50% below those of major SA banks, supporting the value proposition but compressing fee income per
              transaction. The JV with Sanlam Personal Loans to originate and administer unsecured loans secured against
              SPL's R6B book is a step toward higher-margin credit income.
