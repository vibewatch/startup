        title: SME Lending and GoTyme Philippines Financial Contribution
        blocks:
          - type: paragraph
            body: >-
              TymeBank's SME division, Retail Capital (acquired December 2022), has deployed R9.5B in merchant cash
              advances to over 50,000 SA businesses. GoTyme Business Advance offers SA business customers loans up to
              R5M with no collateral requirement. The SME lending vertical represents a higher-margin credit product
              category that supplements the retail lending book and deepens merchant relationships. Internationally,
              GoTyme Philippines has grown rapidly: the bank surpassed 5.1M registered customers by December 2024,
              having signed up 3.6M customers in its first 18 months following its October 2022 launch. GoTyme PH is a
              joint venture with JG Summit Holdings and Robinson's Retail. Its financial results are not consolidated
              into TymeBank SA's IFRS statements; rather, both entities roll up to Tyme Group Pte Ltd (Singapore), whose
              group-level P&L is not publicly disclosed. TechCrunch has reported that the combined group had over $400M
              in customer deposits and $600M in SME financing across both markets at Series D, consistent with the SA
              regulatory data. No breakeven disclosure has been made for GoTyme Philippines specifically, and the bank's
              operating cost structure in the Philippines (higher CAC due to rapid growth) is unknown.
