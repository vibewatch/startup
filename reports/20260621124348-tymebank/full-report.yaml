  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Risk / trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - GoTyme Philippines fails break-even
        - GoTyme Philippines reports negative EBITDA in all four quarters of 2027
        - Undermines dual-geography model thesis and 2028 IPO readiness narrative
        - Downgrade to hold; reassess $1.5B entry valuation; evaluate strategic options
      - - ARC or Nubank secondary sale at discount
        - Either shareholder transacts secondary at implied group valuation below $1.2B
        - Primary market signal that lead investors do not expect recovery to $1.5B+
        - Immediate reassessment; potential exit at market; down-round scenario
      - - TymeBank SA loses top-3 ranking
        - Capitec, FNB, or another challenger overtakes TymeBank SA in customer count per SARB data
        - Core asset deteriorates; group thesis built on SA anchor weakens
        - Request management explanation; watch for six months; potential reduction
      - - IPO deferred beyond 2030
        - Management publicly announces IPO target moves post-2030 without strategic rationale
        - Liquidity event horizon extends; return profile deteriorates; capital locked for 8+ years from Series D
        - Escalate to governance review; evaluate secondary market liquidity options
      - - Regulatory cost shock exceeds 20% acquisition cost increase
        - Home Affairs fee implementation or BSP digital banking policy raises KYC costs above modeled levels
        - Unit economics deteriorate; payback period extends; customer acquisition slows
        - Model revised economics; assess mitigation; seek management commentary
    notes: >-
      Kill triggers are binary signals. The financial and operating thesis assumes that none of these events materialize
      in the base case; any single event warrants a formal re-review.
