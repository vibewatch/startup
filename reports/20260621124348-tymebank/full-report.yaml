        - Request investor update pack or management accounts from Tyme Group CFO
      - - Post-Series D cap table
        - >-
          Fully diluted cap table with ownership percentages, liquidation preferences, anti-dilution provisions, and
          drag-along rights
        - Cannot assess preference overhang, return waterfall, or downside protection without cap-table terms
        - Request from Tyme CFO or transaction counsel; review subscription agreements
      - - GoTyme Philippines profitability timeline
        - Quarterly P&L trajectory for GoTyme Bank Philippines through 2026; confirmed break-even date and path
        - Base case scenario depends on 2026 PH break-even; any slip materially changes valuation
        - Request from GoTyme Philippines CEO; review BSP regulatory disclosures
      - - ARC governance rights post-Series D
        - Voting rights, board seat allocation, consent rights, and pre-emption rights held by ARC at group holdco level
        - 40% ARC ownership concentration is a governance risk; cannot assess investor rights without holdco terms
        - Request from ARC investor relations or from Tyme Group legal counsel
      - - BII exit and implications
        - Confirmation of BII exit mechanics, exit price, and whether exit was at or below $1.5B
        - BII exit signals that a development-finance investor who entered earlier decided not to roll forward
        - Request from Tyme IR; cross-reference BII investment page records
    notes: >-
      These five diligence asks are necessary before a final IC recommendation. Items 1 and 2 (group financials and cap
      table) are blocking diligence items for any commitment decision.
