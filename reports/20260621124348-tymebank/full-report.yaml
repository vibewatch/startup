      - number: '4.3'
        title: Capital Adequacy and Balance Sheet Resilience
        blocks:
          - type: paragraph
            body: >-
              TymeBank's balance sheet grew 66% to R11.09B in total assets at 30 June 2025, up from R6.67B at June 2024.
              Customer deposits reached R7.66B, providing a stable low-cost funding base. Net advances (loans) totalled
              R2.25B (+17%), while financial assets (largely government bonds held for liquidity) stood at R5.13B.
              Risk-weighted assets grew 46% to R5.36B, reflecting rapid loan book expansion. Despite this growth,
              regulatory capital ratios remain well above minimums: CET1 at 21.29% (regulatory minimum ~11%), total
              capital ratio 21.73%, and leverage ratio 11.23%. The bank's Basel Pillar III disclosure attributes
              accumulated Group losses of R7.72B on the equity side, reflecting the cumulative investment since 2015,
              partially offset by R2.09B in Group equity at June 2025. The going concern note in the FY2025 AFS states
              that Tyme Group has confirmed capital support until 31 October 2026, but beyond that date 'material
              uncertainty' exists, contingent on the completion of the planned NYSE IPO, additional capital raises, or
              continued shareholder support. Nubank's $150M Series D investment in December 2024 has substantially
              reinforced the capital position.
