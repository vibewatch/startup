  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition in Customer Workflow Terms
        blocks:
          - type: paragraph
            body: >-
              Tyme's public materials describe a banking workflow built around convenience, assisted trust, and
              low-friction onboarding rather than around a branch-centric account opening process. In South Africa,
              GoTyme markets free everyday banking, savings, cards, and support that can be accessed through the app,
              kiosks, and customer hubs. Independent reporting explains why that matters operationally: kiosk users can
              be verified with fingerprint-based identity checks, get approved on the spot, print a card, and start
              transacting without a branch visit. In the Philippines, GoTyme's home and about pages describe a similar
              path that is localized around Gokongwei retail distribution and Go Rewards. Customers can start in the app
              or at a kiosk, receive a Visa debit card in minutes, then move immediately into savings, transfers, QR
              payments, and rewards redemption. The product definition is therefore best understood as a high-tech,
              high-touch workflow that acquires customers in physical retail, activates them digitally, and then expands
              wallet share through adjacent savings and payment tools.
