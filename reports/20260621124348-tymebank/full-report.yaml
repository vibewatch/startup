      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: South Africa is a depth market, not a pure first-access market
            body: >-
              With 85% adult account ownership already achieved, Tyme's upside in South Africa comes from cheaper
              primary-account usage, cash displacement, and credit depth for underserved households and SMEs — not from
              assuming tens of millions of adults have never used formal finance.
            calloutType: insight
            claimRefs:
              - CM003
              - CM008
              - CM009
              - CM038
          - type: callout
            title: The Philippines combines strong digital behavior with incomplete individual bank ownership
            body: >-
              The BSP reports that digital retail payments already account for 57.4% of volume while only 50% of adults
              hold formal accounts. That combination creates a favorable setup for a digital bank that can convert
              payment familiarity and household-level access into primary-bank relationships.
            calloutType: strength
            claimRefs:
              - CM022
              - CM024
              - CM025
              - CM045
          - type: callout
            title: Digital adoption does not automatically translate into profitable lending depth
            body: >-
              Market evidence from Africa and both operating countries shows that payment rails can scale faster than
              credit rails. Thin-file SMEs, informal borrowing, trust concerns, and onboarding costs are the bottlenecks
              that decide whether customer growth converts into durable net interest income and retention.
            calloutType: risk
            claimRefs:
              - CM018
