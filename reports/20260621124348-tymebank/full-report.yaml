      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Information asymmetry is the dominant risk
            body: >-
              The single greatest risk to the investment recommendation is the absence of consolidated group-level
              audited financials. All scenario analysis in this chapter rests on TymeBank SA statutory filings plus
              extrapolations from management statements. The gap between SA entity economics and group economics is
              unknown and could be material.
            calloutType: risk
            claimRefs:
              - CV043
          - type: callout
            title: Nubank's $150M entry is the most credible external valuation signal
            body: >-
              Nu Holdings is a public company with its own shareholders, SEC filings, and reputational accountability.
              Its decision to price at $1.5 billion after independent diligence is the most defensible third-party
              anchor available in public evidence. The strategic rationale (emerging-market pattern transfer) is
              coherent and documented.
            calloutType: strength
            claimRefs:
              - CV002
              - CV019
          - type: callout
            title: Five diligence items are blocking for any commitment
            body: >-
              Group audited financials, post-Series D cap table, GoTyme PH P&L trajectory, ARC governance rights, and
              BII exit terms are all missing. None of these can be inferred from public sources. A final IC
              recommendation should not be issued until all five are received and reviewed.
            calloutType: recommendation
            claimRefs:
              - CV043
              - CV044
              - CV047
