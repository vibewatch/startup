      - number: '8.2'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis for Tyme Group rests on five interlocking claims. First, Tyme has validated a
              repeatable bank-building model in South Africa — TymeBank's profitability in December 2023 and FY2025
              revenue of R3.11 billion (~$170 million at period exchange rates) demonstrate that the high-tech,
              high-touch retail distribution model can generate sustainable economics at scale. Second, the Philippine
              franchise is at an earlier but similar stage: GoTyme had 5.1 million customers and PHP24 billion in
              deposits by December 2024, targeting profitability by end of 2026. Third, the strategic partnership with
              Nubank provides both capital and access to a playbook that scaled a similar model to 110 million customers
              in Latin America, compressing Tyme's learning curve. Fourth, the TAM in South Africa and the Philippines
              remains structurally large — GSMA data shows that the majority of mobile money growth is concentrated in
              Sub-Saharan Africa and Southeast Asia, precisely where Tyme is operating. Fifth, a credible 2028 NYSE IPO
              path creates a defined liquidity event horizon for investors, with TechCentral and financial press
              reporting management's stated intention.


              The anti-thesis is equally important. The $1.5 billion valuation at 15 million customers implies roughly
              $100 per customer — a premium that requires the Philippine franchise and any new markets (Vietnam,
              Indonesia) to contribute meaningful revenue within the IPO window. The group does not publish consolidated
              audited financials beyond TymeBank SA, making it impossible to verify whether the group as a whole is
              approaching profitability or whether losses at GoTyme Philippines or TymeX are consuming the South African
              bank's surplus. Multiple compression is also a live risk: if public fintech multiples contract between
              2024 and 2028, a 10× revenue multiple at IPO could shrink to 5-7×, materially reducing exit value for
              Series D investors. Finally, regulatory cost shocks — such as the proposed Home Affairs
              identity-verification fee increases that Tyme threatened legal action over in 2025 — could erode the
              low-cost onboarding economics that underpin the business model.
