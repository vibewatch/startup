      - number: '1.4'
        title: Milestones, Rebrand, and External Dependencies
        blocks:
          - type: paragraph
            body: >-
              Tyme's milestone record is unusually legible for a private fintech. Independent reporting traces the
              business back to a 2012 mobile-money and financial-services project created by Coenraad Jonker and Tjaart
              van der Walt, followed by Commonwealth Bank of Australia's 2015 acquisition of the technology platform, a
              South African banking licence process completed in 2017, African Rainbow Capital's 2018 acquisition of
              TymeDigital, and TymeBank's commercial launch in February 2019. Since then the operating model has been
              defined by physical distribution partnerships — especially Pick n Pay, Boxer, TFG, and the wider Gokongwei
              ecosystem — alongside product additions such as SME lending, buy-now-pay-later, and salary-linked credit.
              The next major milestone is brand convergence: the South African bank's live site already runs on
              gotyme.co.za and TechCentral reported that management intends to complete the GoTyme rebrand in the first
              half of 2026. The adverse side of the milestone record is that Tyme remains exposed to policy decisions
              that affect low-income onboarding economics. In June 2025, Tyme management said it was considering legal
              action over proposed Home Affairs identity-verification fee increases, arguing they would raise
              acquisition costs and undermine financial inclusion. That dispute is strategically important because
              Tyme's branchless, mass-market model depends on low-cost KYC, retailer-assisted onboarding, and a
              regulatory environment that keeps serving underbanked customers economically viable.
