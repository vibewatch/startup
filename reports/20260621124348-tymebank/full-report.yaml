  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Architecture and Monetisation Model
        blocks:
          - type: paragraph
            body: >-
              TymeBank's revenue model is built on two primary streams: net interest income (NII) from its
              deposit-funded balance sheet and net fee and commission income from daily transaction activity. The bank
              charges no monthly maintenance fee, instead relying on the spread between deposit rates (low-cost current
              accounts, GoalSave, and fixed deposits at 11% pa) and lending rates on its R2.25B net advances book, plus
              fee income from card interchange, MoreTyme buy-now-pay-later (BNPL) origination, and merchant services.
              For the year ended 30 June 2025, NII totalled R1.24B (+18% YoY) and gross fee income totalled R1.55B (+38%
              YoY), though fee expenses of R662M reduced net fee income to R886M. Other operating gains of R45M (FX and
              miscellaneous) round out the top line. Retail Capital, TymeBank's SME lending division, has deployed R9.5B
              in merchant cash advances, generating additional credit spread. GoTyme Philippines contributes group
              customer growth but its separate financial results are not publicly consolidated at the Group level. The
              no-fee acquisition strategy suppresses fee income per customer but drives deposit accumulation, which
              funds the interest-generating book at low cost.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI028
