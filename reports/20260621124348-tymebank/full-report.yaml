      - number: '7.4'
        title: Competitive and Strategic Risk
        blocks:
          - type: paragraph
            body: >-
              In South Africa, Capitec remains the dominant challenger-bank competitor and has actively positioned
              itself on the opposite side of the Home Affairs fee dispute, publicly supporting the DHA's planned fee
              hike. This signals that Capitec views the fee structure as a potential competitive tool against fintechs
              more reliant on real-time FICA verification. Capitec reported a 23% profit increase in FY2026, widening
              the unit-economics gap relative to TymeBank which is still reporting net losses. Discovery Bank's growth
              to one million clients demonstrates that the premium segment is already contested. TymeBank's target of
              reaching top-3 SA bank status by 2028 requires sustained deposit share gains from a current sub-2% market
              share, a multi-year journey with meaningful execution risk. In the Philippines, GoTyme faces GCash (Mynt)
              — which had IPO speculation as recently as 2026 — and Maya Bank, which reported PHP 1.7 billion in net
              income in 2025. Philippine digital bank deposits reached PHP 139 billion in 2025; GoTyme's PHP 40 billion
              share is meaningful but leaves significant ground to cover relative to the GCash ecosystem. GoTyme
              Philippines' Q1 2025 profitability milestone is encouraging, but competitive pressure from
              well-capitalised rivals means that maintaining customer acquisition momentum requires continued marketing
              and product investment. The strategic risk at group level is the NYSE IPO execution: a successful IPO at
              or above the $1.5 billion Series D valuation would validate the thesis, but an adverse market environment
              or missed financial milestones could force a below-Series-D offering or a delay that strains the October
              2026 capital commitment window.
            claimRefs:
              - CR031
              - CR032
              - CR033
              - CR034
              - CR035
              - CR036
      - number: '7.5'
        title: Governance, Country, and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              African Rainbow Capital retains approximately 40% of Tyme Group following the December 2024 Series D,
              making it the dominant shareholder by a substantial margin. While ARC's stake provides funding certainty
              and alignment with South African market development, it also creates governance concentration: ARC's own
              financial position affects its capacity and willingness to provide further capital support, and any ARC
              strategic reorientation could constrain Tyme's options. Nubank holds approximately 10%, providing
              strategic partnership and brand credibility, but also a second large shareholder with its own
              Brazil-centric strategic agenda. The full post-Series D cap table has never been published, making
              governance-rights assessment from public evidence alone impossible. Tyme Group Pte Ltd is incorporated in
              Singapore, with operating banks in South Africa and the Philippines, a tech entity in Vietnam, and a group
              CEO based in the Netherlands — a multi-jurisdictional holding structure that adds complexity to
              cross-entity capital flows, intercompany pricing, and regulatory-reporting obligations. In South Africa,
              structural economic headwinds include unemployment above 30%, fiscal pressure limiting government support
              for digital inclusion programmes, and residual electricity infrastructure constraints that intermittently
              affect kiosk and connectivity uptime. IMF and World Bank country assessments for South Africa highlight
              sovereign debt trajectory and fiscal consolidation risk as medium-term concerns. In the Philippines, GDP
              growth remains positive but BSP regulatory evolution — including potential increases in digital bank
              capital requirements — could require additional capital contributions from JV partners. The going-concern
              disclosure, combined with the multi-jurisdictional holding structure and limited public cap-table
              transparency, means that external investors have less line-of-sight than would typically be expected for a
              company at a $1.5 billion valuation preparing for a major exchange listing.
