      - number: '7.3'
        title: Operational, Technology, and Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              TymeBank runs mission-critical services on Amazon Web Services (ECS and EKS), via a cloud migration that
              TymeX leadership described as foundational to the group's serial bank-building model. This creates a
              single-provider concentration risk: an AWS outage in the Africa or Asia-Pacific regions would affect both
              TymeBank SA and GoTyme Philippines simultaneously, with no publicly disclosed SLA, recovery time objective
              (RTO), or disaster-recovery topology. The group has not named its core banking vendor or ledger technology
              stack in any public disclosure, which limits external assessment of vendor lock-in, migration risk, or any
              single-point-of-failure in the transaction processing layer. The South African rebrand from TymeBank to
              GoTyme — with the GoTyme app rolling out from January 2026 under a phased migration — introduces near-term
              operational risk around customer communication failures, card migration errors, and product-feature
              parity. TymeBank GitHub's absence of public repositories means there is no public developer signal on
              security hygiene, dependency management, or code cadence. The single largest operational risk after cloud
              concentration is the KYC rail: TymeBank's branchless model depends on real-time FICA identity verification
              against the Home Affairs National Population Register, and the proposed R10/query fee would increase
              acquisition costs by an estimated R40 per new customer opened at kiosks — materially higher than the
              current cost structure. Retail Capital's SME merchant cash advance model adds credit operational risk from
              SME default cycles that can move faster than annual credit review cycles.
            claimRefs:
