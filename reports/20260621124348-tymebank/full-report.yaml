      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The market drivers are real and measurable. BCG argues that Africa is the fastest-growing fintech region
              globally, with revenues potentially expanding 13x to roughly $65 billion by 2030, and notes that more than
              half of African fintech firms operate in payments and lending — exactly the categories that matter most to
              Tyme. In the Philippines, the regulator has already pushed digital retail payments beyond the roadmap
              target, creating a favorable infrastructure base for digital-bank acquisition. Yet structural friction
              remains substantial. In South Africa, GSMA highlights device affordability, electricity costs,
              infrastructure crime, regulatory uncertainty, and digital-skills gaps as practical barriers to deeper
              digital adoption. BIS and SARB also note that South Africa still relies heavily on cash and that new rails
              like PayShap, while promising, are not yet a full substitute for cash at mass-market scale. Across Africa
              more broadly, BCG argues that thin-file SMEs, weak credit bureaus, high capital costs, and data
              fragmentation still constrain risk-based lending depth. In the Philippines, formal account access improved
              at the household level even as individual ownership slipped, showing that account access alone does not
              guarantee deep product usage. For Tyme, the investable conclusion is that digital-account and payment
              growth is structurally strong, but profitable market capture still depends on solving trust, KYC, data,
              and credit-depth bottlenecks country by country.
