            body: >-
              Production evidence for GoTyme Group's customer base spans four distinct deployment archetypes. First, the
              South African retail consumer franchise is in full production, having crossed 8.5 million customers by
              January 2024 and achieved bank-level profitability in December 2023 — the first digital bank in Africa to
              do so. Second, the SME and micro-merchant segment is evidenced by Retail Capital's more than 50,000 active
              merchant borrowers and R9.5 billion in deployed working capital at a ~30% annual portfolio growth rate, as
