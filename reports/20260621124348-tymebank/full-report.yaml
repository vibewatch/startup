  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Credit, Capital, and Financial-Model Risk
        blocks:
          - type: paragraph
            body: >-
              TymeBank's FY2025 Annual Financial Statements, audited by PricewaterhouseCoopers, carry a going-concern
              disclosure stating that Tyme Group has confirmed capital support for GoTyme Bank Limited only until 31
              October 2026, and that beyond that date material uncertainty exists contingent on the planned NYSE IPO,
              additional capital raises, or continued shareholder support. This is the most material near-term risk in
              the report. Capital adequacy ratios are robust in isolation — CET1 of 21.29% sits nearly twice the SARB
              minimum of approximately 11% — but the CET1 metric captures the South African operating entity, not
              consolidated group liquidity. The Series D in December 2024, with Nubank leading a $150 million check, has
              extended the runway, but total accumulated losses now stand at R7.72 billion on TymeBank's balance sheet,
              reflecting the cumulative investment since 2015. On the credit side, the impairment charge grew 51% to
              R534 million in FY2025, driven by rapid loan-book expansion rather than deteriorating vintage quality, but
              the absence of public NPL ratios, vintage curves, or provision coverage metrics makes independent credit
              risk underwriting impossible from public disclosures alone. Retail Capital's R9.5 billion in annual
              merchant cash advances to SME customers adds further off-balance-sheet credit concentration.
              Per-active-customer impairment of approximately R144 per year compares favourably to peers but is rising
              on a per-unit basis as Tyme scales the lending book faster than it seasons. The key thesis-break signal
              for financial risk is whether Group management secures IPO or equity commitments before October 2026;
              failure to do so would require emergency bridge funding at potentially adverse terms.
