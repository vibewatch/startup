- id: verdict-and-gaps
  title: Financial Verdict and Outstanding Diligence Gaps
  body: TymeBank's financial trajectory is credible and improving. Revenue of R3.11B at 83% cost-to-income, with a path to breakeven on a full-year IFRS basis, positions the bank as one of the few neobanks globally to approach this milestone. The $250M Series D at $1.5B Group valuation (December 2024), led by Nubank, validates the growth story. However, several material gaps prevent a complete financial assessment. First, Tyme Group Pte Ltd does not publish a consolidated income statement, making group-level profitability, intercompany fee flows, and the allocation of Group holding costs opaque. Second, the going concern qualification in TymeBank's FY2025 AFS indicates that shareholder support is only confirmed until October 2026; continued operation depends on the planned 2028 NYSE IPO, a further capital raise, or ongoing shareholder funding. Third, GoTyme Philippines financials are not publicly disclosed, creating uncertainty about capital drag from the international expansion. Fourth,
    credit impairment costs are rising faster than revenue in proportional terms, requiring close monitoring as the loan book matures. ARC's ~40% stake and the Nubank relationship provide institutional endorsement, but private-market investors and the planned IPO will ultimately test the valuation assumption.
