  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Consolidated Tyme Group Pte Ltd (Singapore) income statement, balance sheet, and cash flow statement for FY2025
    whyItMatters: Without group-level financials it is impossible to assess the profitability impact of Singapore holding costs, intercompany technology licence fees paid by TymeBank to Tyme Limited, Philippines capital consumption, and net group cash position
    diligencePath: Request Tyme Group Pte Ltd audited consolidated financial statements from management as part of VDD process
    relatedQuestionRefs:
    - QI022
    - QI026
  - type: private-evidence-only
    severity: material
    topic: gotyme-philippines-financials
    missingEvidence: GoTyme Bank Philippines standalone audited financial statements for FY2025 (BSP regulatory filing)
    whyItMatters: Philippines unit economics, CAC, loss rate, and path to breakeven are entirely unknown from public sources; this affects the group risk profile
    diligencePath: Request GoTyme Bank (Philippines) BSP annual report or management accounts; cross-reference against BusinessWorld deposit figures
    relatedQuestionRefs:
    - QI018
  - type: missing-source
    severity: blocking
    topic: going-concern
    missingEvidence: Confirmed capital commitment or financing plan for Tyme Group beyond 31 October 2026, including IPO documentation or shareholder agreement
    whyItMatters: The AFS going concern disclosure creates a hard time-bound risk; if the NYSE IPO is delayed or a new raise is not completed, the bank requires additional shareholder support — which is currently unconfirmed beyond October 2026
    diligencePath: Obtain written shareholder commitment or IPO timeline documentation from Tyme Group management; review S-1 filing if filed before diligence closes
    relatedQuestionRefs:
    - QI022
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Customer acquisition cost (CAC), cohort lifetime value (LTV), and churn rates by customer segment for TymeBank SA
    whyItMatters: The no-fee model requires strong LTV/CAC ratios to justify the cost of customer acquisition through kiosk networks and retail partnerships; without these metrics the unit economics cannot be validated
    diligencePath: Request cohort analysis and CAC/LTV data from management; compare with publicly disclosed Nubank unit economics as a neobank reference point
  - type: missing-source
    severity: minor
    topic: peer-comparison
    missingEvidence: Publicly comparable per-customer revenue and cost-to-income data for Nubank, Capitec, and other neobank peers that would enable precise financial benchmarking
    whyItMatters: Without comparable peer disclosures, cost-to-income and unit economics comparisons are directional only; investors cannot precisely size TymeBank's relative efficiency
    diligencePath: Cross-reference Nubank's annual public filings (Nubank is publicly listed on NYSE); obtain Capitec annual report for ZA-specific benchmarks
    relatedQuestionRefs:
    - QI023
    - QI024
