callouts:
- calloutType: strength
  title: Revenue Scale and Efficiency Inflection
  body: TymeBank has reached R3.1B in annual revenue with an 83% cost-to-income ratio, approaching the efficiency levels of established SA banks. Revenue has grown at a compound rate of over 70% pa since FY2022, and the loss before tax has narrowed by 76% in two years. The bank's no-fee acquisition model has successfully accumulated a R7.7B deposit base at low cost, funding a growing lending book.
  claimRefs:
  - CI001
  - CI007
  - CI009
  - CI013
- calloutType: risk
  title: 'Going Concern Qualification: Capital Support Confirmed Only to October 2026'
  body: TymeBank's FY2025 Annual Financial Statements (October 2025, audited by PwC) include a going concern disclosure stating that Tyme Group has confirmed capital support only until 31 October 2026. Beyond that date, continued operation depends on securing shareholder support, additional capital raises, or the completion of the planned 2028 NYSE IPO. This is a material uncertainty that any investor must assess against the IPO timeline.
  claimRefs:
  - CI036
  - CI026
- calloutType: risk
  title: Credit Impairment Rising Faster than Revenue
  body: Credit impairment charges grew 51% YoY in FY2025 to R534M, outpacing revenue growth of 29%. Impairment now represents 17% of gross revenue. While the growing loan book inherently requires higher provisions, the rate of impairment growth warrants close monitoring as the loan portfolio matures.
  claimRefs:
  - CI010
  - CI011
- calloutType: insight
  title: No Consolidated Group P&L Available
  body: Tyme Group Pte Ltd (Singapore), the ultimate group holding company, does not publish consolidated financial statements. TymeBank SA's audited IFRS accounts are available; GoTyme Philippines financials are not. This limits full assessment of group-level economics, intercompany technology licence flows, and the capital drag from Philippines expansion.
  claimRefs:
  - CI039
