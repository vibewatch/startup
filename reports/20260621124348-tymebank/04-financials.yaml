company:
  name: TymeBank
chapter:
  number: 4
  title: Financials
  summary: TymeBank Limited (the SA operating entity of Tyme Group) generated R3.11B in revenue for the year ended 30 June 2025, a 29% increase over FY2024, driven by net interest income of R1.24B and gross fee income of R1.55B. The total comprehensive loss narrowed 34% to R219M (loss before tax R226M), with cost-to-income improving from 99% in FY2024 to 83% in FY2025. Capital adequacy remains strong (CET1 21.29%), but the 2025 AFS carries a going concern disclosure beyond October 2026, and no consolidated Tyme Group Pte Ltd income statement is publicly available.
sections:
- id: revenue-architecture
  title: Revenue Architecture and Monetisation Model
  body: 'TymeBank''s revenue model is built on two primary streams: net interest income (NII) from its deposit-funded balance sheet and net fee and commission income from daily transaction activity. The bank charges no monthly maintenance fee, instead relying on the spread between deposit rates (low-cost current accounts, GoalSave, and fixed deposits at 11% pa) and lending rates on its R2.25B net advances book, plus fee income from card interchange, MoreTyme buy-now-pay-later (BNPL) origination, and merchant services. For the year ended 30 June 2025, NII totalled R1.24B (+18% YoY) and gross fee income totalled R1.55B (+38% YoY), though fee expenses of R662M reduced net fee income to R886M. Other operating gains of R45M (FX and miscellaneous) round out the top line. Retail Capital, TymeBank''s SME lending division, has deployed R9.5B in merchant cash advances, generating additional credit spread. GoTyme Philippines contributes group customer growth but its separate financial results are not
    publicly consolidated at the Group level. The no-fee acquisition strategy suppresses fee income per customer but drives deposit accumulation, which funds the interest-generating book at low cost.'
