- id: financial-performance
  title: Financial Performance and Path to Profitability
  body: TymeBank's income statement has improved dramatically over three years. Total revenue grew from R570M in FY2022 to R1.41B in FY2023, R2.41B in FY2024, and R3.11B in FY2025. Simultaneously, the loss before tax narrowed from R951M (FY2023) to R330M (FY2024) and R226M (FY2025), a 76% reduction in two years. The cost-to-income ratio improved from 169% in FY2023 to 99% in FY2024 and 83% in FY2025, approaching the level of established SA banks. The single largest drag is the credit impairment charge (loan loss provisions), which rose 51% to R534M in FY2025 as the loan book scaled rapidly. A one-off R56M write-off of intangible assets in FY2025 further impacted the bottom line but is non-recurring. TymeBank announced in January 2024 that it had achieved its first profitable calendar month in December 2023, becoming the first SA digital bank to reach monthly breakeven. However, the full IFRS annual statements for both FY2024 and FY2025 still report net losses, reflecting high credit provision
    requirements on a rapidly growing loan book. The trajectory is clearly positive, and the bank's auditors (PricewaterhouseCoopers) have not issued a qualification on the accounts themselves, though going concern disclosures are present.
