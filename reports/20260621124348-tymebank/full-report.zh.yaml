      - number: '8.2'
        title: 投资逻辑与反逻辑
        blocks:
          - type: paragraph
            body: >-
              Tyme Group 的投资逻辑建立在五个相互咬合的主张上。第一，Tyme 已在南非验证可复制的建银行模型——TymeBank 2023 年 12 月盈利、FY2025 收入 R3.11
              billion（按期内汇率约 $170 million），证明高科技、高接触的零售分销模型可以在规模化后跑出可持续经济性。第二，菲律宾业务阶段更早但路径相似：GoTyme 到 2024 年 12 月已有 510
              万客户和 PHP24 billion 存款，目标是在 2026 年底盈利。第三，与 Nubank 的战略合作同时带来资本和打法：Nubank 在拉美把相似模型扩至 1.1 亿客户，可压缩 Tyme
              的学习曲线。第四，南非和菲律宾的 TAM 结构性庞大——GSMA 数据显示，移动货币增长的大头集中在撒哈拉以南非洲和东南亚，正是 Tyme 运营的区域。第五，可信的 2028 年 NYSE IPO
              路径，为投资者提供明确的流动性事件窗口；TechCentral 和财经媒体均报道了管理层的公开意图。


              反逻辑同样重要。1500 万客户对应 $1.5 billion 估值，隐含每客户约 $100——这是溢价，要求菲律宾业务以及任何新市场（Vietnam、Indonesia）在 IPO
              窗口内贡献有意义收入。集团未公布 TymeBank SA 之外的合并审计财务，无法验证集团整体是否接近盈利，或 GoTyme Philippines、TymeX
              的亏损是否正在消耗南非银行盈余。倍数压缩也是现实风险：如果 2024 至 2028 年间公开 fintech 倍数收缩，IPO 时 10× 收入倍数可能缩至 5–7×，显著降低 Series D
              投资者退出价值。最后，监管成本冲击——例如 Tyme 在 2025 年威胁采取法律行动的 Home Affairs 身份验证涨费——可能侵蚀支撑商业模式的低成本开户经济性。
