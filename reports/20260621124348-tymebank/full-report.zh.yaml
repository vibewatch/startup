      - number: '6.6'
        title: 图表与证据
        blocks:
          - type: callout
            title: 32% 激活率需要解释
            body: >-
              TymeBank/GoTyme SA 的 2025 年 6 月 Pillar III 文件披露 1160 万注册客户，但只有 370 万活跃，意味着 68% 的注册账户不活跃或休眠。这个缺口重大：它影响 ARPU
              测算、CAC 回收期以及已报告客户基础质量。管理层未公开解释「活跃」定义，也未提供不活跃账户池的分客群拆分。
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
          - type: callout
            title: GoTyme PH 在菲律宾拿下 Visa 借记卡第一
            body: >-
              Visa 2026 年 2 月官方新闻稿确认，GoTyme Bank Philippines 按活跃使用量成为菲律宾第一大 Visa 借记卡发行方；其超过 800 万 Visa 借记卡用户和 P43
              billion 存款，是采用质量和留存深度的强第三方验证信号，在这一指标上超过菲律宾所有传统银行。
            calloutType: strength
