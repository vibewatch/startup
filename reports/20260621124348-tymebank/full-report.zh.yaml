      - number: '8.5'
        title: 建议、风险评级与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              综合市场证据、可比组、情景分析和已识别缺口，可得出有条件建议。对能接受新兴市场执行风险、投资期 5–7 年的投资者，Tyme Group 在 $1.5 billion 估值下是结构上可信的投资。TymeBank
              SA 已证明盈利、Nubank 提供战略背书、2028 年 IPO 路径现实，这三者组合让它区别于泛化的新兴市场 fintech
              敞口。不过，缺少集团合并审计财务、菲律宾盈利时间线未确认、股权结构表披露不完整，造成信息不对称；仅凭公开证据，无法给出高置信度买入建议。


              建议姿态是高风险评级下的投机性买入，前提是拿到：（1）覆盖 FY2025 和 H1-2026 的集团层面投资者更新或管理账；（2）显示可信盈亏平衡路径的 GoTyme Philippines 季度
              P&L；（3）Series D 后完全摊薄股权结构表及清算优先权细节；（4）对 ARC 投票权和治理条款的尽调。


              触发重新评估为中性或卖出的破题信号包括：GoTyme Philippines 到 2027 年底仍未达到盈亏平衡（说明结构性单位经济问题，而不只是时点问题）；ARC 或 Nubank 以显著低于 $1.5
              billion 标记的折价进行二级出售；TymeBank SA 在南非客户数排名前三的位置输给既有挑战者；或 Tyme 公开将 IPO 延后至 2030 年之后且没有战略解释。IFC
              的数字金融工作和该赛道更广泛的开发金融投资确认了宏观顺风，但不能消除公司特定执行风险。最终投资决策需要公开渠道之外的数据。
