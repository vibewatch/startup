        title: 格局与可比公司集合
        blocks:
          - type: paragraph
            body: >-
              Tyme 面对的不是一个整齐的同行集合。在南非，它同时打三条战线：Capitec 是最接近的大众市场数字标杆；Discovery
              是更高收入客群的数字加奖励挑战者；大型传统银行仍主导资产负债表深度、网点、现金基础设施和 SME 融资。PwC 2026 年 3
              月主要银行评述明确指出，南非大型银行资本仍然充足，并高度聚焦数字增长，尽管挑战者银行已开始重塑下一个周期。在菲律宾，相关替代方案也不止持牌数字银行。 GCash 已在全国规模上掌握日常支付普及度，Maya
              正把支付转成高增长的存款与信贷引擎，传统全能银行仍控制重要的薪资、信任和多产品关系。实际含义是，Tyme 争夺的是主账户使用和交易频率，而不只是首次开户。
