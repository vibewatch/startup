        - 南非数字挑战者银行
        - 100 万客户、200 万+ 活跃账户
        - 高收入或深度使用生态的消费者
        - 共享价值奖励，并接入 Discovery 产品
        - 与 Capitec 相比，不是那么直接的大众市场对标
      - - 南非主要传统银行
        - Standard Bank / FirstRand / Nedbank / Absa（传统银行）
        - PwC 评述中，行业核心收益为 R152.5B，合并 ROE 为 20%
        - 覆盖零售、SME 和企业银行全谱系
        - 资产负债表实力、网点、咨询和现金基础设施
        - 合并成一行，因为公开开源披露无法在产品层面直接标准化
      - - GCash
        - 菲律宾电子钱包和金融科技平台
        - 9400 万用户、600 万商户、900 万储户、300 万+ 借款人
        - 日常支付、转账、储蓄和嵌入式金融
        - 覆盖无处不在，商户接受度高
        - 不是纯银行主导模式，因此部分银行产品比较只能间接完成
      - - Maya
        - 菲律宾数字银行 + 支付平台
        - 截至 2025 年 Q2，820 万银行客户、210 万借款人、P50B 存款
        - 数字优先消费者和 MSME
        - 支付、存款和信贷一体化，替代数据风控较强
        - 促销和奖励竞争很重，可能挤压经济性
      - - 菲律宾全能银行
        - UnionBank 及其他传统银行
        - 传统薪资和信托关系；数字银行 + 传统银行主导 Forbes PH 排名
        - 零售消费者、薪资账户用户、SME 和企业
        - 网点历史、薪资账户锁定和宽产品线
        - 合并成一行，因为开源产品层面的比较并不均衡
      - - 其他菲律宾数字银行
        - Tonik / UnionDigital / UNO / MariBank
        - 2025 年全行业数字银行存款 P138.5B、账户 3390 万
        - 数字原生储户、借款人和细分客群
        - 带来促销压力和细分试验
        - 各运营方公开业绩披露仍不均衡
