      - number: '7.3'
        title: 运营、技术与集中度风险
        blocks:
          - type: paragraph
            body: >-
              TymeBank 在 Amazon Web Services（ECS 和 EKS）上运行关键任务服务；TymeX 管理层称这次云迁移是集团连续建银行模型的基础。由此产生单一供应商集中风险：非洲或亚太区域的 AWS
              宕机会同时影响 TymeBank SA 和 GoTyme Philippines，而公开信息未披露
              SLA、恢复时间目标（RTO）或灾备拓扑。集团未在任何公开披露中点名核心银行供应商或账本技术栈，外部难以评估供应商锁定、迁移风险，或交易处理层的单点故障。南非从 TymeBank 更名为
              GoTyme——GoTyme App 自 2026 年 1 月起分阶段迁移——带来近期运营风险，包括客户沟通失败、银行卡迁移错误和产品功能一致性。TymeBank GitHub
              没有公开仓库，意味着安全卫生、依赖管理或代码节奏没有公开开发者信号。云集中度之后，最大的单项运营风险是 KYC 通道：TymeBank 的无网点模型依赖基于 Home Affairs National
              Population Register 的实时 FICA 身份验证，而拟议 R10/次查询费将使自助机每个新开户客户成本估计增加 R40，显著高于当前成本结构。Retail Capital 的 SME
              商户现金垫款模型又增加了信贷运营风险，因为 SME 违约周期可能快于年度信贷审查周期。
