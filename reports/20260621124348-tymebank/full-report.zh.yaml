      - number: '2.3'
        title: 买方、用户、付款方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              在 Tyme 的市场里，买方、用户和付款方往往是同一个人，但采用路径仍由生态系统、雇主、商户和政府 rails
              牵引。最重要的客户群包括需要低成本主账户的受薪大众成年人；想要更安全存放资金、低摩擦支付的现金依赖家庭；需要营运资金和收款能力的微型商户与
              MSME；以及提供实体获客场景的生态伙伴。在南非，零售商辅助开户之所以重要，是因为数字接入已经广泛，但可负担性、信任和实体现金行为仍决定使用。在菲律宾，账户拥有率较低，但智能手机、电子货币和零售支付快速数字化已经让数字熟悉度很高。这意味着产品旅程往往从支付和存款开始，再扩展到储蓄、工资挂钩或个人信贷，以及商户金融。付款逻辑也按用例不同而变化：家庭自付，商户通过费用或融资利差付款，生态伙伴则通过把
              自助终端、卡和奖励嵌入既有客流，实际上补贴获客。Tyme 的市场进入逻辑因此取决于让产品顺序匹配客户准备度：先支付和开户，再活跃使用，最后在交易数据和信任积累后加深贷款。
