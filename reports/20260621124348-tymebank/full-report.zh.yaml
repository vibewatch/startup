            title: 持续经营限定：资本支持仅确认至 2026 年 10 月
            body: >-
              TymeBank FY2025 年度财务报表（2025 年 10 月，PwC 审计）包含持续经营披露，称 Tyme Group 仅确认资本支持至 2026 年 10 月 31
              日。此后，持续运营取决于取得股东支持、额外融资，或完成计划中的 2028 年 NYSE IPO。这是任何投资者都必须对照 IPO 时间表评估的重大不确定性。
