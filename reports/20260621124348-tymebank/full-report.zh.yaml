      - 限制
    rows:
      - - 开立南非主银行账户
        - 下载 App 或前往零售网点，完成 KYC，等待激活，再拿到卡
        - GoTyme 把 App 开户、自助机 / 客户服务点身份验证和快速发卡合在一起
        - 无网点开户，首次交易更快发生
        - 模型依赖零售网点和成本可控的第三方身份验证
      - - 在南非积累流动储蓄
        - 把闲置资金放在低收益活期账户，或手动转入储蓄
        - GoalSave 储蓄罐加固定存款，把储蓄搬进同一个 App 体验
        - 标称利率更高，App 内储蓄管理更简单
        - 奖励利率规则和期限结构按产品而异，经济性并不完全透明
      - - 在南非借一笔无担保消费贷款
        - 收集文件，手工提交，等待分行或贷款机构审核
        - GoTyme 宣传全数字化申请，提交文件后获批即即时放款
        - 纸面流程更轻，放款更快
        - 未公开披露实际 APR、审批或违约表现
      - - 在南非给小企业融资并经营
        - 分别使用营运资金贷款、POS 收单和创业者社区支持服务
        - GoTyme for Business 把融资、支付和创业者支持打包到一个界面
        - 协调成本可能更低，获取资金和到账更快
        - 支付经济高度依赖 iKhokha 挂钩基础设施，而不是完全披露的自有技术栈
      - - 开立并激活菲律宾账户
        - 前往分行，等待制卡，之后再配置转账
        - GoTyme Philippines 提供 App 或自助机开户，约五分钟即可即时发 Visa 卡
        - 激活更快，支付卡更早开始使用
        - 获客仍依赖自助机和零售伙伴网点
      - - 在菲律宾转账、消费并赚取奖励
        - 用多个 App 或支付轨道处理转账、账单、QR、借记卡消费和忠诚积分
        - GoTyme 把免费内部转账、InstaPay、QRPh、Visa、虚拟卡和 Go Rewards 积分放进一个 App
        - 一个钱包即可覆盖支付、转账和忠诚度兑换
        - 转账额度、合作伙伴奖励率和部分费用仍取决于具体支付轨道
    notes: 收益依据公司产品流程，以及第三方对自助机 / 发卡流程的描述。该表比较的是待完成任务逻辑，而不是声称已有经审计的转化率、NPS 或节省时间指标。
