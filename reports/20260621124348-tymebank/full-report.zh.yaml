            body: >-
              GoTyme SA 每月约 150,000 名新增客户高度依赖 Pick n Pay、Boxer、TFG 门店的自助机网络。GoTyme PH 的线上线下融合增长同样嵌入 Gokongwei
              集团零售。两项业务都尚未证明能大规模纯数字获客，因此伙伴集中度是首要客户增长风险。
