            body: >-
              Tyme 的公开领导层材料和银行披露显示，其治理结构分层覆盖集团控股公司、南非银行、菲律宾银行和越南产品工程单元。Tyme 官网列出 Coenraad Jonker 为 Tyme
              执行董事长兼联合创始人，David Pfaff 为集团首席执行官兼董事，Nate Clarke 为 GoTyme Philippines 总裁兼 CEO，Dieter Botha 为 TymeX
              CEO。南非法定备案进一步补充了银行实体的领导层交接：Tyme Bank Limited 2024 年度财务报表记录，Coenraad Jonker 于 2024 年 9 月 30 日辞任董事，Karl
              Westvig 自 2024 年 10 月 1 日起获任；South African Reserve Bank 2026 年 4 月注册银行名单则列 Cheslyn Jacobs 为 GoTyme Bank
              Limited
              首席执行官。这一顺序很关键：创始团队正在上移到集团战略层面，运营银行则围绕新的高管班底走向专业化。同一组证据也显示，最清晰的治理披露仍集中在受监管银行层面，而不是集团控股公司层面。公开材料明确列出创始人与高管，但没有披露完整集团董事会、委员会图谱或
              Series D 后资本结构治理权利。
