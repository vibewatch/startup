      - number: '5.5'
        title: 信任、安全、合规与产品风险
        blocks:
          - type: paragraph
            body: >-
              相比硬可靠性指标，公开信任控制更可见。南非方面，GoTyme 安全页面列出生物识别、端到端加密、多因素认证、全天候欺诈监控、卡锁定控制和定期安全审计；应用商店页面
              强调安全开户、凭证卫生，以及与安全性和稳定性绑定的产品更新。菲律宾方面，产品页面强调 BSP 监管、PDIC 存款保险，并通过 VASP 许可、闭环资金保护，以及明确提示加密资产
              不是存款产品，为加密资产加上额外风险框架。信任图景的反向一面是结构性，而非灾难性。TechCentral 关于 Home Affairs 身份验证费的报道显示，Tyme 辅助开户模型仍依赖外部 KYC rails
              保持可负担。公开开发者信号也很薄：TymeBank GitHub 组织没有公开仓库，公开材料仍不点名 core-banking 供应商，也不发布 uptime/SLA
              目标。因此，就控制和牌照而言，信任姿态足以支撑公开尽调初稿；但若要做深度技术承保，仍需要管理层侧披露。
