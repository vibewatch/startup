      - 关键假设
      - 退出估值 / 逻辑
      - 概率信号
      - 关键风险
    rows:
      - - 牛市（25% 概率）
        - 2028 年 NYSE IPO；3000 万以上客户；GoTyme PH 2026 年盈利；越南 / 印尼开始贡献；集团收入 $600-700M；5-8× 收入倍数
        - IPO 时市值 $3.0–5.6B；以 $1.5B 入场，稀释前 2–4×
        - Nubank 轨迹对标；南非盈利已证明；战略背书已确认
        - 菲律宾利润率不达预期；宏观外汇逆风；IPO 市场窗口关闭
      - - 基准（50% 概率）
        - 2028-2029 年 IPO；2200-2500 万客户；GoTyme PH 2027 年盈亏平衡；无新市场；收入 $400-500M；4-6× 倍数
        - $1.6–3.0B；入场价 1–2×；4-5 年年化 IRR 8–15%
        - 管理层 IPO 指引；南非 / 菲律宾增长合理外推
        - 倍数压缩；菲律宾盈利延后；新增监管成本
      - - 熊市（25% 概率）
        - IPO 推迟至 2030 年之后；GoTyme PH 到 2027 年仍未盈亏平衡；收入 $200-300M；2-3× 倍数
        - $400M–$900M；入场价 0.3–0.6×；Series D 投资人资本受损
        - 倍数压缩先例（2022-23）；菲律宾监管摩擦；信息缺口
        - 结构性输给 GCash/Maya；南非监管冲击；需要下轮降价融资
    notes: 概率信号是基于新兴市场金融科技可比结果给出的定性方向估计，不是模型化分布。实际概率需要专有财务模型。
