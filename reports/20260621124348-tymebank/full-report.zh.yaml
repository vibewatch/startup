        title: 产品线地图与能力成熟度
        blocks:
          - type: paragraph
            body: >-
              两个市场的可见产品线都已不止一个简单支票账户。南非消费者菜单现包括活期账户银行、GoalSave、定期存款、个人贷款、卡、即时支付和人工支持；企业端则增加营运资金融资、创业者社区功能和与 iKhokha
              关联的收款能力。菲律宾应用覆盖日常银行、Go Save、多币种定期存款、转账、QRPh 支付、Visa
              卡支付、奖励、加密资产，以及已披露的先买后付通信流程。成熟度画像是有意不均衡的。核心开户、卡、储蓄和转账功能看起来成熟，因为这些功能跨两国存在，并嵌入开户体验。更新或更本地化的模块，如加密资产、BNPL
              和南非更名阶段的钱包升级，显然仍处于更早阶段，并依赖本地监管批准、伙伴生态和分阶段功能发布。因此，模块地图支持把 Tyme 看成带有国别包装和附加模块 的可复用平台，而不是完全相同的跨境产品。
