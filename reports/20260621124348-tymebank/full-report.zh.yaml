  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚与 Series D 背景
        blocks:
          - type: paragraph
            body: >-
              Tyme Group 最近且最权威的估值锚，是 2024 年 12 月 Series D：融资 $250 million 后，投后估值为 $1.5 billion。Tyme Group 官方新闻稿确认，该轮由
              Nubank 领投，投资 $150 million，约占 10% 股权，意味着 Nubank 入股时按投后 $1.5 billion 给公司定价。TechCrunch 独立报道了相同条款，并指出 Tyme
              成立以来累计融资约 $600 million。该轮结构增加了可信度：Nubank 这种级别的战略投资方——自身是在 NYSE 上市、市值 $60 billion 的公众公司——经过独立尽调并按 $1.5
              billion 定价，是有意义的第三方锚，而不是仅由赞助方给出的账面标记。


              Series D 之前，早期轮次显示出清晰递进。2023 年 5 月的 pre-Series C 融资从 Norrsken22 和 Blue Earth Capital 获得 $77.8 million；Tyme
              官方新闻稿披露收入运行率年化超过 $100 million，每月新增 300,000 名客户。2021 年 Series B 融资 $180 million，投资方包括 Tencent 和 CDC（现
              British International Investment）。African Rainbow Capital 在 Series D 后仍保留约 40% 所有权，意味着单一南非锚定股东在治理上权重很大。


              估值背景有两个重要限制。第一，TymeBank 的法定申报文件（AFS 2025、Pillar III 2025）包含南非实体数据，但不公布合并集团经济数据，因此 $1.5 billion 估值无法用集团 P&L
              独立验证。第二，BII 投资页面显示 Tyme Bank 投资截至 2025 年 12 月已退出，降低了开发金融机构投资者基础的广度。尽管有这些限制，Series D 价格仍是第 8
              章情景构建中最有防御力的公开基准。
