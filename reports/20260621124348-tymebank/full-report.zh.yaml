  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构与变现模型
        blocks:
          - type: paragraph
            body: >-
              TymeBank 的收入模型建立在两条主线之上：来自存款支持资产负债表的净利息收入（NII），以及来自日常交易活动的净手续费和佣金收入。银行不收月度维护费，而是依靠存款利率（低成本活期账户、GoalSave 和
              11% pa 定期存款）与 R2.25B 净垫款账本贷款利率之间的利差，加上卡组织交换费、MoreTyme buy-now-pay-later（BNPL）发起和商户服务带来的费用收入。截至 2025 年 6 月
              30 日止年度，NII 合计 R1.24B（同比 +18%），总手续费收入 R1.55B（同比 +38%），但 R662M 费用支出把净手续费收入压到 R886M。其他经营收益
              R45M（外汇及杂项）补足收入线。Retail Capital 是 TymeBank 的 SME 贷款部门，已投放 R9.5B 商户现金垫款，带来额外信用利差。GoTyme Philippines
              贡献集团客户增长，但其独立财务结果没有在集团层面公开合并。无费用获客策略压低单客手续费收入，但推动存款沉淀，以低成本支持生息资产账本。
