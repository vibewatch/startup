  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Tyme 的相关市场比抽象意义上的“银行业”更窄。公司争夺的是南非和菲律宾银行服务不足消费者与 SME
              的日常金融生活：交易账户、工资和账单流、储蓄余额、商户与个人信贷，以及相邻数字支付活动。这不同于企业司库、投资银行、财富管理或纯保险支出，后几类都不在 Tyme
              零售嵌入模式的实际采用路径内。南非和菲律宾的公共政策文件也强化了这一界定。South African Reserve Bank 的数字支付路线图将竞争、互操作性和普惠直接绑定到低成本交易流；BSP
              路线图则把支付和交易账户描述为进入正规金融普惠的入口。因此，最强的现状替代不是高端全服务银行组合，而是现有零售银行账户、现金、e-wallet、工资挂钩借款，以及非正式或半正式 SME
              融资。在两个国家，大众市场机会的关键，不是说服已经富裕的多银行客户切换，而是把重度现金、但数字可触达的成年人和商户转化为活跃的账户、支付和信贷用户。正是这一区别，让 Tyme
              的零售商辅助数字模式即便在正规账户拥有率已经相对较高的市场也具备经济相关性。
