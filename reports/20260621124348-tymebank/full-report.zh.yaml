              FY2025 AFS 的持续经营披露，是外部投资者面临的单一最大风险：Tyme Group 仅确认对南非银行的资本支持至 2026 年 10 月 31 日，条件是完成 NYSE
              IPO、筹集额外股本或获得股东继续支持。ARC 或其他股东尚未公开承诺在该日期之后继续支持。如果 IPO 延迟或撤回，可能需要以不利条款安排紧急过桥融资。
