              截至 2025 年 6 月 30 日，TymeBank 资产负债表总资产增至 R11.09B，较 2024 年 6 月的 R6.67B 增长 66%。客户存款达到
              R7.66B，提供稳定低成本资金基础。净垫款（贷款）合计 R2.25B（+17%），金融资产（主要为流动性持有的政府债）为 R5.13B。风险加权资产增长 46% 至
              R5.36B，反映贷款账本快速扩张。尽管增长很快，监管资本率仍明显高于最低要求：CET1 为 21.29%（监管最低约 11%）、总资本率 21.73%、杠杆率 11.23%。银行的 Basel Pillar
              III 披露将股本侧 R7.72B 累计集团亏损列示出来，反映自 2015 年以来的累计投入，并由 2025 年 6 月 R2.09B 集团权益部分抵消。FY2025 AFS 持续经营附注称，Tyme Group
              已确认资本支持至 2026 年 10 月 31 日，但此后存在“重大不确定性”，取决于计划中的 NYSE IPO 完成、额外融资或持续股东支持。Nubank 2024 年 12 月的 $150M Series D
