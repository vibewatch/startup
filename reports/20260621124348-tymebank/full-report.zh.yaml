      - number: '6.5'
        title: 扩张动力与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Tyme Group 的扩张策略遵循产品落地后扩张逻辑：先用免费活期账户和银行卡获客，再交叉销售储蓄（GoalSave）、BNPL（MoreTyme）、信贷（个人贷款、Retail Capital
              垫款），以及越来越多的加密服务（GoTyme PH 持有 VASP 牌照）。GoTyme SA Business Advance 产品（最高 R5 million、无需抵押）把 SME 客群从 Retail
              Capital 既有商户现金垫款账本进一步外延。在菲律宾，GoTyme PH 推出 MoreTyme、整合 Google Wallet/Google
              Pay、提供加密服务，反映了同一条上售路径。集中度风险重大：南非业务依赖 Pick n Pay、Boxer、TFG
              分销合作，用低成本自助机驱动获客；该网络若出现重大中断，新增客户成本会升高，现有获客速度也可能受扰动。在菲律宾，GoTyme PH 结构性嵌入 Gokongwei 集团零售生态，利益一致，但也带来风险：银行在
              Gokongwei 网络之外的增长尚未得到充分检验。SME 层面，Retail Capital 的 R9.5 billion
              组合集中在商户现金垫款，这类产品天然对商户收入波动敏感。公开信息未披露头部客户集中度数据。Tyme Group 的第三市场策略（Vietnam 或 Indonesia）旨在降低国家集中度，但截至 2026 年 5
              月运行日，第三市场尚未报告已上线银行客户。
