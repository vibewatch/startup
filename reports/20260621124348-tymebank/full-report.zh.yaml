  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 信贷、资本与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              TymeBank FY2025 年度财务报表由 PricewaterhouseCoopers 审计，其中持续经营披露称，Tyme Group 对 GoTyme Bank Limited 的资本支持仅确认至
              2026 年 10 月 31 日；此后是否持续，取决于计划中的 NYSE IPO、额外融资或股东继续支持，存在重大不确定性。这是本报告最重大的近期风险。单看资本充足率，指标强劲——CET1 为 21.29%，接近
              SARB 约 11% 最低要求的两倍——但 CET1 衡量的是南非经营实体，而非合并集团流动性。2024 年 12 月 Series D 由 Nubank 领投 $150 million，延长了资金续航期，但
              TymeBank 资产负债表上的累计亏损已达 R7.72 billion，反映 2015 年以来的累计投入。信贷端，FY2025 减值费用增长 51% 至 R534
              million，主要由贷款账本快速扩张驱动，而非 vintage 质量恶化；但公开披露没有 NPL 比率、vintage 曲线或拨备覆盖指标，仅凭公开资料无法独立承销信贷风险。Retail Capital 面向
              SME 客户的年度 R9.5 billion 商户现金垫款，进一步增加表外信贷集中度。每活跃客户年减值约 R144，相比同业有利，但随着 Tyme
              贷款账本扩张快于成熟，单位减值正在上升。财务风险的关键破题信号，是集团管理层能否在 2026 年 10 月前拿到 IPO 或股权承诺；若失败，可能需要以不利条款安排紧急过桥融资。
