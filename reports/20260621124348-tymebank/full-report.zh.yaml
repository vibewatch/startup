chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、架构与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Tyme Group 将自己定位为面向新兴市场的多国数字银行集团，围绕嵌入实体零售生态的高科技、高触达银行模式组织业务。当前公开公司官网是 tyme.com，而不是任务简报中提供的停放域名
              tymegroup.com；官网将新加坡列为集团总部，并突出南非、菲律宾和越南技术中心等主要运营足迹。南非方面，TymeBank 2019 年 2 月上线，到 2026 年 5 月，其面向消费者的网站已重定向至
              gotyme.co.za，显示南非业务正在推进更广泛的 GoTyme 品牌统一。菲律宾方面，GoTyme 2022 年 10 月与 Gokongwei Group
              一起上线，通过自助终端、借记卡和应用优先开户，沿用同样由零售驱动的获客逻辑。集团官网披露客户超过 1,500 万、员工超过 1,500 人；而 2025 年较晚的公司沟通已将客户数放在 1,700 万以上，原因是
              Tyme 增加了 Indonesia、Hong Kong lending 等新市场。因此，Tyme
              不是单一国家的新型数字银行，而是一套可复制的银行搭建平台：一个成熟的南非资产、一个快速扩张的菲律宾合资公司，以及早期相邻市场扩张。
