        title: 融资、股东与资本形成
        blocks:
          - type: paragraph
            body: >-
              Tyme 的资本史从南非银行搭建者一路走向新兴市场独角兽。公司 2023 年 5 月 pre-Series C 公告称，股东合计投资 $77.8 million，Norrsken22 和 Blue Earth
              Capital 作为新投资方加入，资金用于南非和菲律宾增长、东南亚扩张以及部分股份回购。同一公告披露收入运行率超过 $100 million、每月获客超过 300,000
              人，在全面盈利前先给投资者讲清规模叙事。到 2024 年 12 月，TechCrunch 报道 Tyme 以 $1.5 billion 估值完成 $250 million Series D，由 Nubank 以
