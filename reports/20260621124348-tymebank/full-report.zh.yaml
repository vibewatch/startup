      - number: '8.6'
        title: 图表与证据
        blocks:
          - type: callout
            title: 信息不对称是主导风险
            body: 投资建议面临的单一最大风险，是缺少集团层面合并审计财务。本章所有情景分析都建立在 TymeBank SA 法定申报文件和管理层表述外推之上。南非实体经济性与集团经济性之间的缺口未知，且可能重大。
            calloutType: risk
            claimRefs:
              - CV043
          - type: callout
            title: Nubank 的 $150M 入股是最可信的外部估值信号
            body: Nu Holdings 是公众公司，有自己的股东、SEC 文件和声誉责任。它在独立尽调后按 $1.5 billion 定价，是公开证据中最有防御力的第三方锚。其战略理由（新兴市场模式迁移）连贯且有记录。
            calloutType: strength
            claimRefs:
              - CV002
              - CV019
          - type: callout
            title: 五项尽调事项阻碍任何投资承诺
            body: 集团审计财务、Series D 后股权结构表、GoTyme PH P&L 轨迹、ARC 治理权利和 BII 退出条款均缺失。这些都无法从公开来源推断。五项全部收到并审阅之前，不应出具最终投委会建议。
