      - number: '4.2'
        title: 财务表现与盈利路径
        blocks:
          - type: paragraph
            body: >-
              TymeBank 的利润表三年来大幅改善。总收入从 FY2022 的 R570M 增至 FY2023 的 R1.41B、FY2024 的 R2.41B、FY2025 的 R3.11B。与此同时，税前亏损从
              R951M（FY2023）收窄至 R330M（FY2024）和 R226M（FY2025），两年下降 76%。成本收入比从 FY2023 的 169% 改善至 FY2024 的 99%、FY2025 的
              83%，接近南非成熟银行水平。最大拖累项是信用减值费用（贷款损失准备），随着贷款账本快速扩张，FY2025 上升 51% 至 R534M。FY2025 一次性核销 R56M
              无形资产进一步影响底线，但该项不可重复。TymeBank 2024 年 1 月宣布，其已在 2023 年 12 月实现首个盈利自然月，成为南非第一家达到月度盈亏平衡的数字银行。不过，FY2024 和 FY2025
              的完整 IFRS 年报仍报告净亏损，反映快速增长贷款账本上的高信用拨备要求。轨迹明显向好，银行审计师 PricewaterhouseCoopers 未对报表本身出具保留意见，尽管存在持续经营披露。
