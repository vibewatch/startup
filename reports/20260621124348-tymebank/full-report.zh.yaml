      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              市场驱动因素真实且可量化。BCG 认为，Africa 是全球增长最快的金融科技地区，收入到 2030 年可能扩大 13 倍至约 $65 billion，并指出超过一半的 African 金融科技
              公司运营在支付和贷款领域——这正是对 Tyme 最重要的品类。在菲律宾，监管方已经把数字零售支付推到路线图目标以上，为数字银行获客打下有利基础。但结构性摩擦仍然很重。在南非，GSMA
              将设备可负担性、电力成本、基础设施犯罪、监管不确定性和数字技能缺口列为深化数字采用的现实障碍。BIS 和 SARB 也指出，南非仍高度依赖现金，PayShap 这类新 rails
              虽有潜力，但还不能在大众市场规模上完全替代现金。放到整个 Africa，BCG 认为信用资料薄的
              SME、薄弱征信局、高资本成本和数据碎片化仍限制基于风险定价的贷款深度。菲律宾方面，正规账户接入在家庭层面改善，而个人拥有率下滑，说明账户接入本身并不保证深度产品使用。对 Tyme
              的可投资结论是：数字账户和支付增长具备结构性强度，但要实现有利润的市场获取，仍必须逐国解决信任、KYC、数据和信贷深度瓶颈。
