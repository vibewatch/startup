            body: >-
              GoTyme Group 客户基础的生产证据覆盖四种不同部署原型。第一，南非零售消费者业务已全面投产，2024 年 1 月客户数突破 850 万，并在 2023 年 12
              月实现银行层面盈利——非洲首家做到这一点的数字银行。第二，SME 和微型商户客群由 Retail Capital 超过 50,000 名活跃商户借款人、R9.5 billion 已投放营运资金以及约 30%
              的年度组合增长率证明，时间点为 2024 年 1 月新闻稿。第三，GoTyme Bank Philippines 的消费者部署由 Visa 确认：超过 800 万活跃 Visa 借记卡持卡人、存款 P43
              billion。第四，社会救助金客群有记录：截至 2024 年 1 月公告，Grant Advance 客户中 78% 是照护者，13% 是老年救助金领取者，10%
              是残障救助金领取者，显示其有意瞄准金融包容。第五种原型——使用 TymePOS 的乡镇微型商户——仍处早期推出，公开记录只有与 Khona La Local Stores 的试点合作。Forbes
              菲律宾最佳数字银行奖（GoTyme PH，连续两年）和 Visa 借记卡第一排名，为消费者业务质量提供独立第三方验证，不过 Forbes 奖项背后的底层数据并未公开。Robinsons Retail 合作于
              2022 年 11 月 GoTyme PH 上线时正式确立，把该行嵌入菲律宾主要零售链，成为带有 Go Rewards 忠诚度整合的线上线下融合获客渠道。
