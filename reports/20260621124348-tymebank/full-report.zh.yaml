  - id: TV005
    title: 论点失效与终止触发表
    columns:
      - 风险 / 触发项
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - GoTyme Philippines 未能盈亏平衡
        - GoTyme Philippines 2027 年四个季度 EBITDA 全部为负
        - 削弱双地域模型论点和 2028 年 IPO 准备叙事
        - 下调至持有；重估 $1.5B 入场估值；评估战略选项
      - - ARC 或 Nubank 折价二级出售
        - 任一股东按低于 $1.2B 的隐含集团估值进行二级交易
        - 一级市场信号显示领投方不预期估值回到 $1.5B+
        - 立即重估；可能按市场价格退出；降价融资情景
      - - TymeBank 南非跌出前三
        - 按 SARB 数据，Capitec、FNB 或另一挑战者在客户数上超过 TymeBank 南非
        - 核心资产恶化；建立在南非锚点上的集团论点转弱
        - 要求管理层解释；观察六个月；可能减仓
      - - IPO 推迟到 2030 年之后
        - 管理层公开宣布 IPO 目标推迟至 2030 年之后，且没有战略理由
        - 流动性事件被拉远；回报画像恶化；Series D 起资本锁定 8 年以上
        - 升级至治理复盘；评估二级市场流动性选项
      - - 监管成本冲击使获客成本上升超过 20%
        - Home Affairs 收费落地，或 BSP 数字银行政策把 KYC 成本抬高到模型以上
        - 单位经济恶化；回收期拉长；获客放缓
        - 重做经济模型；评估缓释措施；寻求管理层评论
    notes: 终止触发项是二元信号。财务和运营论点假设基准情景下这些事件均不发生；任何单一事件都应触发正式复盘。
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV045
      - CV046
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 集团层面审计财务
        - FY2025 和 H1-2026 集团合并 P&L、资产负债表和现金流，包含 TymeX 和 GoTyme PH
        - 无法验证集团盈利能力或亏损合并情况；仅南非银行 P&L 不足以支撑 $1.5B 集团估值
        - 向 Tyme Group CFO 要求投资人更新包或管理账
      - - Series D 后股权结构
        - 完全稀释股权结构，包含持股比例、清算优先权、反稀释条款和强制随售权
        - 没有股权结构条款，就无法评估优先权悬挂、回报瀑布或下行保护
        - 向 Tyme CFO 或交易律师索取；审查认购协议
      - - GoTyme Philippines 盈利时间线
        - GoTyme Bank Philippines 到 2026 年的季度 P&L 轨迹；已确认的盈亏平衡日期和路径
        - 基准情景依赖 2026 年菲律宾盈亏平衡；任何延误都会显著改变估值
        - 向 GoTyme Philippines CEO 索取；审查 BSP 监管披露
      - - Series D 后 ARC 治理权利
        - ARC 在集团控股公司层面的投票权、董事会席位分配、同意权和优先认购权
        - ARC 持股 40% 集中是治理风险；没有控股公司条款就无法评估投资人权利
        - 向 ARC 投资者关系或 Tyme Group 法律顾问索取
      - - BII 退出及影响
        - 确认 BII 退出机制、退出价格，以及退出价是否等于或低于 $1.5B
        - BII 退出说明这家更早进入的发展金融投资人决定不继续跟进
        - 向 Tyme IR 索取；交叉核对 BII 投资页面记录
    notes: 这五项尽调要求是给出最终 IC 建议前的必要条件。第 1 和第 2 项（集团财务和股权结构）是任何投资承诺的阻断性尽调事项。
    claimRefs:
      - CV043
      - CV044
      - CV047
      - CV048
