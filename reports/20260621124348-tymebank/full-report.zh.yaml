            body: >-
              TymeBank 年收入已达 R3.1B，成本收入比为 83%，接近南非成熟银行效率水平。自 FY2022 以来，收入年复合增长率超过 70% pa，税前亏损两年收窄 76%。银行的无费用获客模型已低成本沉淀
              R7.7B 存款基础，为不断增长的贷款账本提供资金。
