  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 阶段 / 类型
      - 估值 / 市值
      - 关键指标
      - 与 Tyme 的相关性
      - 局限
    rows:
      - - Nu Holdings（Nubank）
        - 上市（NYSE:NU）；成熟数字银行
        - 约 $59.75B 市值（2026 年 5 月）；P/E TTM 约 19×
        - 1.1 亿客户；2023 年收入 $8B+；2026 年提交 20-F
        - Series D 领投方；新兴市场直接运营对标
        - 规模成熟；拉美市场；货币和监管画像与南非 / 菲律宾差异很大
      - - Revolut
        - 私营；后期；泛欧洲 / 全球
        - $75B（2025 年 11 月私募轮）
        - 全球 4000 万以上客户；金融科技产品线广
        - 高端估值基准；显示私募市场对数字银行仍有胃口
        - 欧洲监管结构；竞争环境差异很大；仅为 IPO 前公司
      - - Moniepoint
        - 私营；Series C；非洲金融科技
        - 约 $1B（2024 年 10 月 Series C）
        - 商业支付驱动；聚焦尼日利亚
        - 相邻阶段的直接非洲金融科技同业；确认新兴市场独角兽需求
        - 支付占比高，对比 Tyme 的存款驱动模型；尼日利亚市场不同于南非；公开财务有限
      - - Maya Bank（Philippines）
        - 私营；数字银行
        - 未公开披露；菲律宾实体已盈利
        - 2025 年净利润 PHP1.7B；PLDT Group 子公司
        - 直接菲律宾市场可比；确认菲律宾数字银行经济模型可跑通
        - PLDT 财团支持；所有权结构不同；独立可比数据有限
      - - GoTyme Philippines 同业池（BSP 持牌）
        - 私营；菲律宾数字银行群体
        - BSP：2025 年菲律宾数字银行存款 PHP139B
        - 多家持牌数字银行；BSP 监管
        - 显示 GoTyme 所在市场在增长但竞争激烈
        - 群体汇总，不是单家公司；GoTyme 份额未公开披露
      - - TymeBank 南非隐含入场价（Series D）
        - 私营；IPO 前；南非持牌数字银行
        - $1.5B 集团投后估值（2024 年 12 月）
        - 2024 年 6 月约 960 万客户；仅 TymeBank；到 2025 年 6 月集团客户数 1700 万以上
        - 所有情景的自参照锚点
        - 集团估值包含 GoTyme PH 和 TymeX；单看南非银行会更低
    enumerationScope:
      coverage: partial
      basis: >-
        Comparable set covers the four most relevant public and private digital banking peers identified from SEC
        filings, Wikipedia sources, Yahoo Finance data, Nubank investor materials, GSMA industry report, and Philippine
