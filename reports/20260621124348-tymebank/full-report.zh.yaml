    notes: 关键人员数据来自公司公开页面、SARB 注册银行名单和新闻来源；缺口反映私营公司披露有限。
  - id: TR005
    title: 缓释监控与终止标准
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 持续经营 / 资本
        - 2026 年 10 月前的集团资本公告
        - 2026 年 Q3 前没有启动 NYSE IPO 路演，也没有股权承诺
        - 退出持仓；按困境信号处理
      - - 信贷质量
        - 年度减值支出和 NPL 比率
        - 减值 > R800M/年或 NPL > 贷款账簿 20%
        - 下调至回避；召集信贷风险复盘
      - - 监管 — SARB
        - SARB Prudential Authority 执法通知
        - SARB 对 GoTyme Bank Limited 发起任何正式执法
        - 立即标记风险；召集合规复盘
      - - KYC 成本冲击（Home Affairs）
        - 最终法院裁决或收费生效日
        - 征收 R10/次查询费且没有法律救济
        - 重置 CAC 模型；重新核保单位经济
      - - 竞争 — 南非存款
        - TymeBank 月度存款市场份额数据（通过 SARB 统计）
        - 到 2027 年 12 月，南非存款份额低于 1.5%
        - 重估竞争护城河假设
      - - AWS 集中度
        - 报道中的 TymeBank / GoTyme 服务中断
        - 中断 > 6 小时并影响客户交易
        - 上调技术风险；要求披露 DR 架构
      - - IPO 执行风险
        - NYSE IPO 定价相对 Series D 的水平
        - IPO 定价低于 $1.5B 估值，或延迟到 2028 年之后
        - 投资者信心负面信号；重估退出时间线
    notes: 终止标准是指示性的投资决策触发项，不是银行运营阈值。阈值只给方向；需按投资人的持有期和风险承受力校准。
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 支持证据
      - 置信度
    rows:
      - - 建议
        - 投机性买入，前提是完成集团财务尽调
        - Series D $1.5B 锚定估值、Nubank 背书、南非已证明盈利
        - 中
      - - 风险评级
        - 高 — 执行、监管、倍数压缩和信息缺口风险
        - 缺少集团 P&L，菲律宾盈利尚未确认，股权结构未披露
        - 高
      - - 估值立场
        - Series D 价格站得住，但依赖牛市情景落地
        - Nubank 以 10% 持股进入意味着市场验证；PwC 和 BCG 确认行业吸引力
        - 中
      - - 回报目标（牛市）
        - 2028 年 NYSE IPO 隐含市值 $3–5.6B，对应 2–4× 回报
        - Nubank 轨迹对标、3000 万以上客户情景、5–8× 收入倍数
        - 低-中
    notes: 建议取决于能否收到集团投资人更新、GoTyme Philippines 盈利确认和 Series D 后股权结构。没有这些材料，IC 不应承诺投资。
