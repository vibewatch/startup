      - number: '6.4'
        title: 留存、满意度与耐久性证据
        blocks:
          - type: paragraph
            body: >-
              Tyme Group 的公开留存证据有限，未披露 NRR、GRR 或 cohort 数据。最强的耐久性信号来自三个代理指标：（1）TymeBank 的 NPS，根据 2021 年 Kantar
              研究，在南非低收入和中等收入客群中位居零售银行前列；（2）2025 年 6 月 Pillar III 文件披露的 32% 活跃 /
              注册比，这是需要管理层澄清的警示数字——可能反映早期大规模获客活动留下的休眠账户，也可能是零摩擦、低门槛开户模型的产物；（3）GoTyme PH 的存款增长轨迹（从 2024 年 12 月 P24 billion
              到 2026 年 2 月 P43 billion）意味着显著的净留存和余额累积，而不只是一次性开户。TymeBank（现 GoTyme SA）的 GoalSave 产品对锁定储蓄提供最高 10%
              年化收益，是储蓄客群的粘性机制。MoreTyme BNPL 截至 2024 年 1 月新闻稿已部署在 5,500+ 家实体店和 1,200+
              个电商网站，创造重复交易参与，应能支撑零售消费者客群留存。HelloPeter 是南非主要消费者投诉平台，列有可搜索的 GoTyme/TymeBank 实体，但内容需要 JavaScript
              渲染，本次审阅无法取得具体评分数据。GoTyme Philippines 未公开披露净推荐值或 CSAT 指标。
