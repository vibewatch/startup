  - id: TU005
    title: 扩张驱动因素与集中度风险表
    columns:
      - 扩张驱动因素
      - 集中度风险
      - 潜在影响
      - 尽调路径
    rows:
      - - 落地后交叉销售：往来账户 → 储蓄 → BNPL → 信贷 → crypto / 投资
        - 南非依赖单一零售分发网络（Pick n Pay、Boxer、TFG 自助终端），它是主要低成本获客引擎
        - 若零售合作协议丢失或重谈，CAC 会显著上升，净新增客户会放缓
        - 确认锚定零售合作伙伴的合同条款、排他性安排和收入分成；评估替代分发的兜底方案
      - - 菲律宾嵌入 Gokongwei 生态：Go Rewards 忠诚度 + Robinsons 零售网络
        - GoTyme PH 的线上线下融合增长在结构上绑定 Gokongwei Group 的零售足迹；网络外获客验证较少
        - Gokongwei 集团业务转向或战略分歧可能减少自助终端接入，拉低获客速度
        - 审阅 JV 协议治理条款；评估 GoTyme PH 来自非 Gokongwei 获客渠道的表现
      - - SME 扩张借助 Retail Capital — GoTyme Business Advance 最高 R5M
        - Retail Capital 的商户现金垫款组合集中在单一信贷产品；宏观或行业压力会让违约集中爆发
        - R9.5B+ MCA 账簿；若进入 10% 违约周期，将产生约 R950M 损失，单靠手续费收入难以抵消
        - 向 Retail Capital 索取逐 vintage 违约曲线、行业拆分和最大单一借款人敞口
      - - 进入第三市场（越南、印度尼西亚）以降低国家集中度
        - 当前收入只在两个市场之间二分；任何南非监管冲击或盈利反转都会影响集团大部分收入
        - 南非若出现 SARB 执法行动或资本成本冲击，将打击集团最成熟的利润中心
        - 跟踪印度尼西亚 / 越南数字银行牌照的监管时间表；评估第三市场何时贡献实质收入
    notes: 扩张驱动因素和风险分析由公开商业模式描述和新闻稿推导；没有内部风险披露。Retail Capital 组合规模来自 2024 年 1 月新闻稿，可能已经变化。Retail Capital 的头部客户或头部商户集中度未公开披露。
