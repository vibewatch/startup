      - number: '1.4'
        title: 里程碑、品牌重塑与外部依赖
        blocks:
          - type: paragraph
            body: >-
              作为一家私有金融科技公司，Tyme 的里程碑记录异常清晰。独立报道可追溯到 2012 年由 Coenraad Jonker 和 Tjaart van der Walt 创建的移动货币与金融服务项目；随后
              Commonwealth Bank of Australia 于 2015 年收购技术平台，南非银行牌照流程在 2017 年完成，African Rainbow Capital 于 2018 年收购
              TymeDigital，TymeBank 则在 2019 年 2 月商业化上线。之后，运营模式由实体分销伙伴定义——尤其是 Pick n Pay、Boxer、TFG 以及更广泛的 Gokongwei
              生态——并加入 SME 贷款、先买后付和工资挂钩信贷等产品。下一项重大里程碑是品牌统一：南非银行的实时网站已运行在 gotyme.co.za 上，TechCentral 报道管理层计划在 2026 年上半年完成
              GoTyme 更名。里程碑的反向一面是，Tyme 仍暴露于会影响低收入人群开户经济性的政策决策。2025 年 6 月，Tyme 管理层称正在考虑就 Home Affairs
              拟提高身份验证费采取法律行动，理由是费用上涨会推高获客成本并削弱金融普惠。该争议具备战略重要性，因为 Tyme 的无网点大众市场模型依赖低成本
              KYC、零售商辅助开户，以及一个让服务银行不足客户在经济上可行的监管环境。
