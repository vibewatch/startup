  productSummary: >-
    Tyme Group 的核心产品是一套可复制的银行搭建平台，包括：（1）移动优先银行应用（储蓄、支付、借贷、保险），采用 API-first 架构；（2）自有自助终端 硬件，可在合作零售门店内即时发放借记卡并开户（南非 Pick n
    Pay、Boxer；菲律宾 Robinsons）；（3）TymeX——建在越南的共享工程平台，支撑核心银行、风控和合规；以及 （4）Retail Capital，一个商户现金垫款贷款业务（南非 MCA 组合
    R9.5B）。GoTyme PH 提供储蓄账户、Visa 借记卡、QR 支付和小额贷款。
  customerFocus: 南非和菲律宾的大众消费者，尤其是银行服务不足人群和首次开户用户，通过店内自助终端网络完成开户。次级客群包括 Retail Capital MCA 产品服务的 SME，以及通过合作渠道触达的企业客户。
  businessModel: 零售银行：净利息收入（贷款和储蓄利差）、手续费和佣金收入（交易费、卡组织交换费、保险佣金），以及商户现金垫款费用（Retail Capital）。收入按运营银行实体报告。没有技术授权或 SaaS 收入流；变现来自受监管银行的损益表。
  stage: Late-stage private unicorn targeting IPO readiness around 2028
