      - number: '4.5'
        title: SME 贷款与 GoTyme Philippines 财务贡献
        blocks:
          - type: paragraph
            body: >-
              TymeBank 的 SME 部门 Retail Capital（2022 年 12 月收购）已向超过 50,000 家南非企业投放 R9.5B 商户现金垫款。GoTyme Business Advance
              向南非企业客户提供最高 R5M、无需抵押的贷款。SME 贷款垂直是一类更高毛利的信贷产品，补充零售贷款账本，并加深商户关系。国际上，GoTyme Philippines 增长迅速：截至 2024 年 12
              月，银行注册客户超过 510 万，在 2022 年 10 月上线后的前 18 个月签下 360 万客户。GoTyme PH 是与 JG Summit Holdings 和 Robinson's Retail
              的合资公司。其财务结果不并入 TymeBank SA 的 IFRS 报表；两个实体都上卷至 Tyme Group Pte Ltd（新加坡），后者不公开集团层面 P&L。TechCrunch 报道，Series D
              时合并集团在两个市场拥有超过 $400M 客户存款和 $600M SME 融资，与南非监管数据一致。GoTyme Philippines 本身尚未披露盈亏平衡，银行在菲律宾的运营成本结构（因快速增长导致更高
              CAC）仍未知。
            claimRefs:
              - CI031
              - CI032
              - CI033
              - CI034
              - CI035
              - CI039
      - number: '4.6'
        title: 财务结论与未解决尽调缺口
        blocks:
          - type: paragraph
            body: >-
              TymeBank 的财务轨迹可信且持续改善。              R3.11B 收入、83% 成本收入比，以及走向全年 IFRS 盈亏平衡的路径，使该行成为全球少数接近这一里程碑的新型数字银行之一。由
              Nubank 领投、2024 年 12 月完成的 $250M Series D、集团估值 $1.5B，验证了增长故事。不过，几项重大缺口阻止形成完整财务评估。第一，Tyme Group Pte Ltd
              不发布合并利润表，使集团层面盈利能力、公司间费用流和集团控股成本分摊不透明。第二，TymeBank FY2025 AFS 中的持续经营限定显示，股东支持只确认到 2026 年 10 月；持续运营取决于计划中的
              2028 年 NYSE IPO、进一步融资或持续股东出资。第三，GoTyme Philippines
              财务未公开披露，导致国际扩张的资本拖累存在不确定性。第四，信用减值成本按比例增长快于收入，贷款账本成熟时需要密切监测。ARC 约 40% 持股和 Nubank 关系提供机构背书，但私募市场投资者和计划中的 IPO
              最终会检验估值假设。
            claimRefs:
