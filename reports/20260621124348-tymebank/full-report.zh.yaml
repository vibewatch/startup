      - number: '7.4'
        title: 竞争与战略风险
        blocks:
          - type: paragraph
            body: >-
              在南非，Capitec 仍是主导型挑战者银行竞争对手，并在 Home Affairs 费用争议中公开支持 DHA 拟议涨价，站在 TymeBank 的对立面。这表明 Capitec 将该费用结构视为打击更依赖实时
              FICA 验证 fintech 的潜在竞争工具。Capitec FY2026 利润增长 23%，相对仍报告净亏损的 TymeBank，单位经济差距进一步拉大。Discovery Bank 增至 100
              万客户，说明高端客群已进入竞争。TymeBank 到 2028 年进入南非银行前三的目标，需要从当前低于 2% 的市场份额持续提升存款份额，这是多年执行旅程，风险不低。在菲律宾，GoTyme 面对
              GCash（Mynt）和 Maya Bank；前者截至 2026 年仍有 IPO 猜测，后者 2025 年报告净收入 PHP 1.7 billion。菲律宾数字银行存款在 2025 年达到 PHP 139
              billion；GoTyme 的 PHP 40 billion 份额有意义，但相对 GCash 生态仍有明显差距。GoTyme Philippines 2025 年 Q1
              盈利里程碑令人鼓舞，但资本充足的竞争对手施压，意味着维持获客动能需要继续投入营销和产品。集团层面的战略风险是 NYSE IPO 执行：如果 IPO 成功且定价达到或高于 $1.5 billion Series D
              估值，将验证投资逻辑；但若市场环境不利或财务里程碑落空，可能迫使公司以低于 Series D 的价格上市，或推迟上市并挤压 2026 年 10 月资本承诺窗口。
            claimRefs:
              - CR031
              - CR032
              - CR033
              - CR034
              - CR035
              - CR036
      - number: '7.5'
        title: 治理、国家与执行风险
        blocks:
          - type: paragraph
            body: >-
              2024 年 12 月 Series D 后，African Rainbow Capital 仍持有 Tyme Group 约 40%，以相当大的差距成为主导股东。ARC
              的持股带来融资确定性，并与南非市场发展保持一致，但也造成治理集中：ARC 自身财务状况会影响其继续提供资本支持的能力和意愿，任何 ARC 战略转向都可能限制 Tyme 的选项。Nubank 持有约
              10%，提供战略合作和品牌可信度，但也是第二大股东，且有自身以巴西为中心的战略议程。完整的 Series D 后股权结构表从未公布，仅凭公开证据无法评估治理权利。Tyme Group Pte Ltd
              注册于新加坡，运营银行在南非和菲律宾，技术实体在越南，集团 CEO 驻荷兰——这种多司法辖区控股结构增加了跨实体资本流动、关联公司定价和监管报告义务的复杂度。在南非，结构性经济逆风包括失业率高于
              30%、财政压力限制政府对数字包容项目的支持，以及电力基础设施约束残留，间歇性影响自助机和连接可用性。IMF 和 World Bank 对南非的国家评估，将主权债务轨迹和财政整顿风险列为中期担忧。在菲律宾，GDP
              增长仍为正，但 BSP 监管演进——包括数字银行资本要求可能上调——可能要求 JV 伙伴追加资本。持续经营披露叠加多司法辖区控股结构和有限公开股权结构表透明度，意味着外部投资者的可见度低于一家估值 $1.5
              billion、准备主要交易所上市的公司通常应有水平。
