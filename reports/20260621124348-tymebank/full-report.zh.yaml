      - number: '8.3'
        title: 可比公司组与倍数基准
        blocks:
          - type: paragraph
            body: >-
              为 Tyme 构建可比组，需要区分公开市场基准（设定倍数天花板和地板）、私募轮基准（校准相似阶段同业定价）以及新兴市场特定参照（调整地理风险溢价）。最直接的公开可比是 Nu Holdings（NYSE:
              NU），即 Nubank 母公司。截至 2026 年 5 月，Yahoo Finance 数据显示 Nu Holdings 市值约 $59.75 billion，trailing P/E 为
              18.9×，服务巴西、墨西哥、哥伦比亚超过 1.1 亿客户。Nu 于 2026 年 4 月向 SEC 提交的 20-F 确认 2025 全年盈利并持续收入增长。按 Nubank 规模，其市值隐含每客户价格约
              $543，显著高于 Tyme 在 Series D 隐含的 $100。


              私募轮同业中，Revolut 可作为高端参照：Wikipedia 报道 Revolut 2025 年 11 月估值 $75 billion，隐含倍数远高于 Tyme 当前水平。Moniepoint 是更接近的非洲
              fintech 同业，2024 年 10 月以 $1.0 billion 估值完成 Series C，拥有强劲的尼日利亚支付基础——地理和阶段上是直接可比，尽管产品组合不同。在菲律宾，Maya Bank（原
              PayMaya）2025 年报告净收入 PHP1.7 billion，而菲律宾数字银行总存款池到 2025 年达到 PHP139 billion，说明竞争环境仍然分散且增长充足。GSMA 2024
              年移动货币行业报告提供宏观锚：全球 17.5 亿个注册移动货币账户、2023 年交易额 $1.68 trillion，增速最快的区域是撒哈拉以南非洲和东南亚。


              对 Tyme 估值的实际含义，是一条每客户价格倍数收敛故事：如果 Tyme 能在 IPO 前增长到 3500–4000 万客户，并证明集团盈利，按 $4–7 billion IPO 市值隐含的每客户价值为
              $100–200，仍低于 Nubank 成熟市场的 $543，但对新兴市场早期溢价而言合理。关键敏感项是增长率，而非当前倍数。
