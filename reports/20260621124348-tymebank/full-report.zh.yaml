      - number: '2.2'
        title: 国家维度的规模测算逻辑
        blocks:
          - type: paragraph
            body: >-
              南非和菲律宾需要不同的规模测算逻辑。在南非，大市场不是单纯“未开户”故事：World Bank 证据显示 85% 成年人已有账户，GSMA 报告的移动互联网使用量相当于成年人口的
              74%。剩下可变现的关键缺口是深度，而不是首次接入——低费用日常银行、数字辅助开户、现金替代，以及面向高度非正规小企业群体的 SME 信贷。同一份 GSMA 报告称，86% MSME 属于非正规，79% 非正规
              MSME 从未借款，说明贷款、商户获取和存款主账户地位比简单数账户更重要。菲律宾则更明显仍处在普惠建设阶段：BSP 2025 CFIS 显示只有 50% 成年人拥有正规账户，但 85% 家庭至少有一个账户，62%
              家庭已通过电子设备开展金融交易，智能手机拥有率为 86%，互联网使用率为 89%。与此同时，BSP 2024 状态报告显示，数字零售支付占交易量 57.4%、交易额
              59.0%，说明支付轨道成熟速度快于完整主银行账户拥有率。对 Tyme 来说，南非的 SAM 由大体已开户人群中的服务不足经济性驱动，而菲律宾同时提供普惠扩张和从较低账户拥有基数出发的产品深化。
