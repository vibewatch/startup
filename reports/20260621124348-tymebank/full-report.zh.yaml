      - number: '7.2'
        title: 监管、法律与 AML/KYC 风险
        blocks:
          - type: paragraph
            body: >-
              TymeBank South Africa（更名后以 GoTyme Bank Limited 运营）受 South African Reserve Bank 的 Prudential Authority
              监管银行审慎标准，受 Financial Sector Conduct Authority（FSCA）依据 Financial Sector Regulation Act（No. 9 of
              2017）监管市场行为，并受 National Credit Regulator（NCR）依据 National Credit Act 监管消费者贷款。2026 年 4 月 SARB 注册银行名单列出
              Cheslyn Jacobs 为 GoTyme Bank Limited CEO，确认牌照仍有效。在菲律宾，Bangko Sentral ng Pilipinas（BSP）于 2022 年 7 月 29 日向
              GoTyme Bank Corporation 颁发授权证书，确认其符合 Bank Secrecy Act、Anti-Money Laundering Act、Customer Protection Act 和
              Data Protection Act，并验证其 IT Risk Management Framework 稳健。南非在 2023 年 10 月退出 Financial Action Task Force
              灰名单，此前其 AML/CFT 国家框架已有改进；但 2021 年 FATF Mutual Evaluation 曾给南非多项 Partially Compliant 评级，包括客户尽调和新技术，说明
              TymeBank 所处系统性风险环境。最急迫的法律风险，是 Home Affairs 拟依据 FICA 将实时身份验证查询费从 15 cents 提高到 R10。Tyme CEO Coen Jonker
              称这次涨价是「对金融包容的沉重打击」，公开报道也确认 TymeBank 正考虑法律行动。若 R10 费率落地且没有减免，TymeBank 的 KYC
              获客成本将大幅上升；相比更依赖隔夜批量验证的传统银行，它的无网点大众开户模型会受到不成比例的冲击。Competition Commission of South Africa 和 POPIA（Protection
              of Personal Information Act）义务又增加了合规层级，不过公开记录未发现针对 TymeBank 的执法行动。
