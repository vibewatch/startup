        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              最清楚的公开架构披露来自 TymeX 和 AWS 背书材料，而不是深度技术白皮书。Tyme 称 TymeX 是集团的多国技术与产品开发引擎，并搭建可按国家本地化的可复用自有资产。TymeX
              页面进一步明确列出运营模式：微服务架构、容器化服务、持续代码部署、自动化测试、异步消息，以及完全云托管基础设施。第三方 AWS 相关报道补充了更多细节，称 TymeBank 上线时把大部分基础设施迁移到
              AWS，并在 Amazon ECS 和 Amazon EKS 上运行任务关键服务；TymeX
              领导层则把集团描述为依赖云经济性获得速度和灵活性的连续银行搭建者。技术上真正有差异的不是云使用本身——这已很常见——而是可复用银行平台与零售商生态实体分销的组合。仍未披露的是核心栈最深部分：公开资料仍未点名
