              15,000 个零售点的零售伙伴足迹；这种差异化存在，但产品宽度比最大传统银行窄。菲律宾方面，GoTyme 的线上线下融合模式扩张很快，14 个月达到 230 万客户、约 500
              台自助终端，但面对的是更大的消费者平台。GCash 称 9,400 万菲律宾人用过该应用；Maya 报告到 2025 年二季度有 820 万银行客户、210 万借款人和 P50 billion 存款。这意味着
