      - number: '8.4'
        title: 情景分析：牛市、基准与熊市
        blocks:
          - type: paragraph
            body: >-
              三个情景覆盖以 $1.5 billion 进入 Series D 的合理投资结果。牛市情景中，Tyme 按期执行 2028 年 NYSE IPO，集团客户超过 3000 万，GoTyme Philippines
              按目标在 2026 年盈利，新市场（Vietnam、Indonesia）贡献增量收入。在这一路径下，对估计集团收入 $600–700 million 给予 5–8× 收入倍数，意味着 IPO 估值 $3–5.6
              billion；在潜在追加融资摊薄前，Series D 价格可获得 2–4× 回报。Nubank 对比方向上支持这一点：Nubank 从 IPO 前 $25 billion 估值时约 1000 万客户，四年增长至
              1.1 亿客户、市值 $60 billion。


              基准情景假设执行中等：GoTyme Philippines 达到盈亏平衡，但盈利推迟到 2027 年；新市场进入延后到 2029 年；集团到 2028 年达到 2200–2500 万客户。按 $400–500
              million 集团收入给予 4–6× 收入倍数，意味着 $1.6–3.0 billion 估值。在区间低端，Series D 投资者在摊薄前接近或达到盈亏平衡。Nubank 以 10%
              优先股位置定价，如果能代表整体股权结构表，意味着后续股权层相对企业价值的清算优先权积压可能有限——但公开证据无法确认。


              熊市情景由倍数压缩和执行失误驱动。如果全球 fintech P/S 倍数从 2024 年高点收缩至 2028 年的 2× 收入，而集团收入仅达到 $300 million（因菲律宾监管摩擦或 GCash、Maya
              竞争上升导致增长不及预期），隐含估值 $600 million，相当于 Series D 价格损失 60%。尾部风险是 IPO 结构性推迟到 2030 年之后，这会拉长持有期并进一步压缩年化回报。南非 Home
              Affairs 身份验证费用争议带来的监管风险，又提供一个下行情景：获客成本可能上升 20–30%，压缩单位经济。
