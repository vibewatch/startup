      - number: '6.2'
        title: 采用轨迹与增长里程碑
        blocks:
          - type: paragraph
            body: >-
              自 2019 年 2 月上线以来，GoTyme Bank SA 的采用曲线陡峭：到 2024 年 1 月宣布盈利时达到 850 万客户，并根据 Basel Pillar III 披露，到 2025 年 6 月达到
              1160 万注册客户。2024 年初，该行每月新增约 150,000 名客户，这一速度显示现有零售网络带来的低边际 CAC 支撑了显著的自然增长。但 Pillar III 文件也显示，在 1160
              万注册客户中只有 370 万活跃客户，激活率为 32%。这一缺口重大，管理层尚未公开解释，也让人质疑大多数注册客户的参与深度。在菲律宾，GoTyme Bank Philippines 从 2022 年 10
              月上线扩张到 2024 年 12 月的 510 万客户（据 BusinessWorld CEO 访谈），并根据 Visa 官方新闻稿，到 2026 年 2 月超过 800 万 Visa 借记卡用户、客户存款达
              P43 billion。Visa 认定 GoTyme PH 是该国活跃 Visa 借记卡发行量第一的机构，且 2025 年支付额同比增长超过 150%，印证了存款和银行卡数据。GoTyme Bank PH CEO
              Nate Clarke 将加速归因于服务不足的年轻市场、线上线下融合自助机模式，以及 Gokongwei 零售网络。集团层面，Tyme Group 在 2025 年中报告两地合计客户超过 1700 万。
