companyProfile:
  summary: >-
    TymeBank 是 Tyme Group 旗下南非旗舰银行。Tyme Group 注册于新加坡，是面向银行服务不足的新兴市场搭建并运营新型数字银行的数字银行平台，模式是移动优先
    应用配合零售门店自助终端开户。集团目前运营两家银行：TymeBank（南非，正在更名为 GoTyme Bank SA）和 GoTyme Bank（菲律宾，与 Gokongwei Group 合资）。第三个品牌 TymeX
    从越南工程中心提供集团共享技术平台。TymeBank SA 于 2023 年 12 月实现首个盈利自然月，FY2025 总收入 R3.11B（同比增长 29%），但实体层面仍亏损，FY2025 综合亏损总额为
    R219M。GoTyme Philippines 于 2022 年 10 月上线，到 2026 年 5 月客户数已超过 900 万，并按活跃使用量成为菲律宾第一大 Visa 借记卡发行方。2024 年 12 月，Tyme Group
    完成 $250 million Series D，估值 $1.5 billion，由 Nubank 领投（$150M 换取 10%），M&G Catalyst（$50M）和原有股东跟投。African Rainbow Capital
    持有集团约 40%。累计融资约 $600 million。集团在各市场服务超过 1,700 万客户，全球员工超过 1,500 人。
  foundedDate: '2019-02-01'
