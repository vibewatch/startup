      - number: '4.4'
        title: 单位经济代理指标与成本结构
        blocks:
          - type: paragraph
            body: >-
              Tyme Group 没有公开披露 TymeBank SA 或 GoTyme Philippines 的获客成本（CAC）、生命周期价值（LTV）、ARPU
              或净收入留存指标。公开披露可推导代理估计。按总注册客户计算，年收入约 R267/人（R3.11B / 11.6M 客户）；按活跃客户计算，约 R838/人/年（Pillar III 披露 3.7M
              活跃）。按总客户计算，运营费用约 R155/人/年（R1.80B opex / 11.6M 客户），意味着信用减值前单客运营贡献为正。若把 R534M 信用减值费用分摊到 3.7M 活跃客户，约为
              R144/活跃客户，使全口径运营亏损约 R59/活跃客户/年——较 FY2024 估算的 R94/活跃客户亏损明显改善。无月费意味着 TymeBank
              在获客时有意放弃费用收入，依靠高毛利产品（定期存款、MoreTyme BNPL、商户现金垫款）交叉销售，随时间改善单位经济。Solidarity research 确认 TymeBank 交易成本比南非主要银行低
              30-50%，支撑价值主张，但压缩每笔交易手续费收入。与 Sanlam Personal Loans 设立 JV、在 SPL 的 R6B 账本上发起并管理无抵押贷款，是迈向更高毛利信贷收入的一步。
