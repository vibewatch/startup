          to: recommendation
        - from: comps
          to: recommendation
        - from: risks
          to: recommendation
        - from: gaps
          to: recommendation
    approximationNotes: 该流程展示推荐的逻辑输入，不是量化模型。每个节点都是本章完整章节或表格的摘要。
  - id: FV002
    title: 估值敏感性
    type: bar
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV017
      - CV021
    data:
      items:
        - label: 熊市（2× 收入，$250M 收入）
          value: 500
          unit: USD million
          tone: negative
          detail: $250M 集团收入按 2× 收入计，隐含估值 $500M
        - label: 基准低位（4× 收入，$400M 收入）
          value: 1600
          unit: USD million
          tone: neutral
          detail: $400M 按 4× 收入计为 $1.6B；接近 Series D 入场价
        - label: 基准中位（5× 收入，$450M 收入）
          value: 2250
          unit: USD million
          tone: neutral
          detail: $450M 按 5× 收入计为 $2.25B；较入场价温和上行
        - label: 牛市（6× 收入，$600M 收入）
          value: 3600
          unit: USD million
          tone: positive
          detail: $600M 按 6× 收入计为 $3.6B；相对 $1.5B 入场价为 2.4×
        - label: 牛市高位（8× 收入，$700M 收入）
          value: 5600
          unit: USD million
          tone: positive
          detail: $700M 按 8× 收入计为 $5.6B；相对 $1.5B 入场价为 3.7×——需要 Nubank 式加速
    approximationNotes: 收入和倍数假设仅作示意。集团合并收入未公开披露；数字从 TymeBank SA（FY2025 R3.11B）加估算 GoTyme PH 贡献外推。倍数参照 Nubank P/S 和同业组分析。
  - id: FV003
    title: 估值 / 回报区间
    type: range
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV037
    data:
      items:
        - label: 熊市退出估值
          low: 400
          mid: 650
          high: 900
          unit: USD million
          detail: 下轮降估或低迷 IPO；相对 $1.5B Series D 入场价为 0.3–0.6×
        - label: 基准退出估值
          low: 1600
          mid: 2200
          high: 3000
          unit: USD million
          detail: 温和 IPO；相对 Series D 入场价为 1–2×；取决于 2028 年窗口
        - label: 牛市退出估值
          low: 3000
          mid: 4200
          high: 5600
          unit: USD million
          detail: 上行 IPO；相对 Series D 入场价为 2–4×；需要 Philippines 市场成功和新市场
    approximationNotes: 区间反映情景带，而非建模分布。中点是各情景下分析师的中心估计。IPO 前潜在后续融资轮带来的摊薄未建模。
  - id: FV004
    title: 投资 KPI
    type: kpi
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV017
      - CV043
      - CV044
      - CV047
    data:
      items:
        - label: 市场证据质量
          value: Medium
          period: May 2026
          tone: neutral
          detail: Series D 价格由 Nubank 入场锚定；无集团审计 P&L
        - label: 规模验证
          value: High
          period: Jun 2025
          tone: positive
          detail: 17M+ 客户；SA 已盈利；GoTyme PH 有 5.1M 客户和存款
        - label: 护城河强度
          value: Medium
          period: May 2026
          tone: neutral
          detail: 零售 kiosk 分销有差异化；现有机构可用 capex 复制
        - label: 单位经济质量
          value: Medium-low
          period: FY2025
          tone: neutral
          detail: SA 按申报数据看强；PH 和集团未确认；只披露 SA 收入
        - label: 估值纪律
          value: Medium
          period: Dec 2024
          tone: neutral
          detail: $1.5B 相对 Nubank 可比公司可支撑，但要有牛市执行，回报才有意义
        - label: 退出准备度
          value: Medium
          period: 2028 target
          tone: neutral
          detail: 公司指引 2028 年 NYSE IPO；SA 盈利确认；PH 和集团盈亏平衡未确认
        - label: 信息完整性
          value: Low-medium
          period: May 2026
          tone: warning
          detail: 5 项阻塞性尽调事项；无集团 P&L；股权结构未披露；BII 退出未验证
    approximationNotes: KPI 判断仅基于公开证据。可供 IC 使用的评分只是建议，不能替代已完成的尽职调查。
