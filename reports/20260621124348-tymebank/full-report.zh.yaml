  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与市场触达
        blocks:
          - type: paragraph
            body: >-
              Tyme Group 运营两家已上线的银行业务——南非的 GoTyme Bank SA（原 TymeBank，2025–2026 年更名）和 GoTyme Bank Philippines；截至 2025
              年中，两地合计报告客户数超过 1700 万。南非业务服务四类可识别客群：（1）大众零售消费者，看重零月费、可在 Pick n Pay、Boxer、TFG 自助机即时开户，以及高收益 GoalSave
              储蓄；（2）社会救助金领取者，依靠 Grant Advance 产品提前、免手续费获得政府发放款；（3） SME 商户，通过 Retail Capital 部门获得营运资金；（4）微型商户和 spaza
              店主，通过 TymePOS 接受无现金支付。在菲律宾，GoTyme Bank 的核心客群是嵌入 Gokongwei 零售生态的大众数字优先消费者——Robinsons 商场及相关零售商的购物者，受益于 Go
              Rewards 忠诚度整合和店内自助机即时开户。TymeBank（现 GoTyme SA）引用的 Kantar 2021 年研究确认，客户加入主要因为无银行收费、App 易用、零售便利、包容性、Smart
              Shopper 积分以及高于市场的储蓄利率。南非月收入 R25,000–R40,000 消费者的吸引力上升，说明客群正从最初的低收入基础向上漂移。GoTyme SA 的 Flex for Business 社区
              App 也吸引了超过 50,000 名南非创业者，成为核心银行业务之外的品牌延伸留存工具。
