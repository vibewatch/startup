            body: >-
              Tyme
              的护城河真实存在，但很窄。零售伙伴开户、自助终端发卡，以及跨南非和菲律宾共享技术，可以相较逐国搭建的挑战者降低获客和建设成本。这些优势对银行服务不足或心存怀疑、需要线下信任线索的用户最重要。但竞争从开户转向存款主账户地位、奖励深度和交易数据承保时，护城河会变弱。
