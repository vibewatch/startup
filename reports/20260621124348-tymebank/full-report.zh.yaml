  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 按客户流程定义产品
        blocks:
          - type: paragraph
            body: >-
              Tyme 的公开材料描述的银行流程，围绕便利、辅助信任和低摩擦开户展开，而不是围绕网点中心的开户流程。南非方面，GoTyme 推广免费日常银行、储蓄、卡和支持，用户可通过应用、自助终端
              和客户中心访问。独立报道解释了这一点在运营上为何重要：自助终端用户可以通过指纹身份检查完成验证，当场获批，打印卡片，并在无需到访网点的情况下开始交易。菲律宾方面，GoTyme 首页和 about
              页面描述了类似路径，只是围绕 Gokongwei 零售分销和 Go Rewards 做本地化。客户可从应用或自助终端开始，几分钟内拿到 Visa 借记卡，随后立即进入储蓄、转账、QR
              支付和奖励兑换。因此，产品定义最适合理解为一套高科技、高触达流程：在实体零售获客，数字化激活，再通过相邻储蓄和支付工具扩大钱包份额。
