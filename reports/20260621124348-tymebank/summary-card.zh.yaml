  topStrengths:
    - TymeBank SA 在 2023 年 12 月实现首个盈利自然月，成为非洲首家在规模化状态下实现月度盈利的数字银行，验证了「自助亭 + App」混合模型。
    - Nubank 以 $150M 入股并取得 10% 股权，是最可信的外部估值信号：一家提交 SEC 文件的上市公司按 $1.5B 标记投入资本，给了独立定价确认。
    - 'GoTyme Philippines 运营不到三年，就按活跃使用量成为 #1 Visa 借记卡发行方，说明模型能迁移到其他新兴市场。'
    - TymeBank SA FY2025 收入同比增长 29% 至 R3.11B，成本收入比快速改善，显示南非单体层面正接近盈亏平衡。
    - African Rainbow Capital 约 40% 的锚定持股和已确认的资本支持，为集团迈向 2028 年 IPO 的扩张期提供了近期流动性托底。
  topRisks:
    - 持续经营保留意见：TymeBank SA 的 FY2025 审计财务包含持续经营披露；ARC 的资本支持只确认到 2026 年 10 月，形成硬性的融资截止点。
    - 集团层面的合并审计财务没有公开；南非单体经济性与集团经济性之间的差距，包括菲律宾亏损和控股公司成本，仍未知且影响重大。
    - FY2025 信用减值费用同比增长 51% 至 R534M，高于收入 29% 的增速；贷款账簿放大后，信用风险管理能力需要被重新验证。
    - Home Affairs 身份验证费若从每次查询 15c 提高到 R10，可能把 TymeBank SA 的获客成本抬高 20–50%，并在落地后触发法律风险。
    - 零售伙伴集中：GoTyme SA 的自助亭开户高度依赖 Pick n Pay 和 Boxer；零售合作一旦收缩，获客会直接受损。
  unresolvedGaps:
    - Tyme Group Pte Ltd（新加坡控股公司）FY2025 合并审计 P&L、资产负债表和现金流没有公开；集团盈利能力和现金消耗无法评估。
    - Series D 后完全稀释股权结构表，包括所有股东持股比例、清算优先权堆叠、治理权以及 ARC/Nubank 投票安排，均未公开披露。
    - GoTyme Philippines FY2025 独立审计财务报表和已确认的盈亏平衡路径没有公开；菲律宾盈利时间线无法验证。
    - Tyme Group 在 2026 年 10 月 31 日之后的有约束力资本承诺或融资计划，包括 IPO 时间表、pre-IPO 过桥条款或 ARC 后续出资承诺函。
    - 按客群拆分的获客成本（CAC）、队列客户终身价值（LTV）和流失率仍属私有数据；单体经济性只能从已披露的汇总数据推断。
