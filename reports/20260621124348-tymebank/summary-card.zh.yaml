summary:
  headline: >-
    TymeBank 是结构上可信的新兴市场 neobank，南非单体经济性已跑通，也拿到 Nubank
    战略背书；但信息不对称仍重——没有集团合并审计财务、菲律宾盈利未经确认、股权结构披露不完整——仅凭公开证据还不足以下高置信买入结论，应先观察，并在承诺前索取集团财务。
