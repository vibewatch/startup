  headquarters: 'Johannesburg, South Africa (group HQ: Singapore)'
  productSummary: 'Tyme Group''s core product is a repeatable bank-building platform comprising: (1) a mobile-first banking app (savings, payments, lending, insurance) with API-first architecture; (2) proprietary kiosk hardware for instant-issue debit card and account opening inside partner retail stores (Pick n Pay, Boxer SA; Robinsons PH); (3) TymeX — a shared engineering platform for core banking, risk, and compliance built in Vietnam; and (4) Retail Capital, a merchant cash advance lending arm (R9.5B South African MCA portfolio). GoTyme PH provides savings accounts, debit Visa cards, QR payments, and micro-lending.'
  customerFocus: Mass-market consumers in South Africa and the Philippines, particularly the underbanked and first-time account holders who are onboarded through in-store kiosk networks. Secondary segments include SMEs served through the Retail Capital MCA product and corporate clients via partnership channels.
  businessModel: 'Retail banking: net interest income (lending and savings spreads), fee and commission income (transaction fees, card interchange, insurance commissions), and merchant cash advance fees (Retail Capital). Revenue is reported at the operating bank entity level. No technology licensing or SaaS revenue stream exists; monetization is through the regulated bank P&L.'
  stage: Late-stage private unicorn targeting IPO readiness around 2028
  fundingStatus: 'Total raised: approximately $600 million. Key rounds: pre-Series C (May 2023) — $77.8M from Norrsken22, Blue Earth Capital, and others; Series D (December 2024) — $250M at $1.5B valuation led by Nubank ($150M for ~10%), M&G Catalyst ($50M), and existing shareholders. Additional investors include African Rainbow Capital (~40%), British International Investment, Apis, Tencent, and the Gokongwei Group. Going-concern capital support from ARC confirmed only through October 2026; next capital event required.'
