companyProfile:
  summary: 'TymeBank is the South African flagship bank within Tyme Group, a Singapore-incorporated digital banking platform that builds and operates neobanks in underbanked emerging markets using a hybrid model that pairs a mobile-first app with retail kiosk onboarding. The group''s two operating banks are TymeBank (South Africa, rebranding to GoTyme Bank SA) and GoTyme Bank (Philippines, JV with the Gokongwei Group). A third brand, TymeX, provides the group''s shared technology platform from a Vietnam engineering hub. TymeBank SA reached its first profitable calendar month in December 2023 and generated R3.11B in total revenue for FY2025 (29% YoY growth), though it remained loss-making at the entity level with a FY2025 total comprehensive loss of R219M. GoTyme Philippines, launched in October 2022, had crossed 9 million customers by May 2026 and became the Philippines'' #1 Visa debit card issuer by active usage. In December 2024, Tyme Group closed a $250 million Series D at a $1.5 billion
    valuation led by Nubank ($150M for 10%), alongside M&G Catalyst ($50M) and existing shareholders. African Rainbow Capital holds approximately 40% of the group. Total capital raised stands at approximately $600 million. The group serves 17 million-plus customers across its markets and employs 1,500-plus people worldwide.'
  foundedDate: '2019-02-01'
  founders:
  - name: Coenraad Jonker
    role: Executive Chairman and Co-founder
    background: South African entrepreneur and co-founder; stepped down as TymeBank SA director in September 2024 to focus on group strategy as Executive Chairman.
