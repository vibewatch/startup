callouts:
  - calloutType: recommendation
    title: Research-More Stance Dictated by Valuation Opacity
    body: While Carbon demonstrates genuine production-scale additive manufacturing capabilities and tier-one investor support, committing capital at or near its $2.4B historical valuation anchor without verified revenue, gross margins, and liquidation preference terms represents unacceptable underwriting risk. Investors should maintain a disciplined research-more posture until full financial statements and unit economics are audited.
    claimRefs:
      - CV001
      - CV003
      - CV008
      - CV014
  - calloutType: risk
    title: Downside Vulnerability from AM Multiple Compression
    body: Public additive manufacturing peers have experienced severe equity derating following macroeconomic headwinds and failed industry consolidations. If Carbon is forced to pursue a liquidity event or external growth round in the current environment, it faces substantial multiple compression and liquidation preference overhang that could heavily dilute common and early preferred shareholders.
    claimRefs:
      - CV002
      - CV008
      - CV010
