callouts:
  - calloutType: strength
    title: Industrial Production Scale and Sustained Insider Support
    body: >-
      Carbon has proven that additive manufacturing can transition from prototyping into multi-million unit commercial
      production, evidenced by long-term athletic footwear manufacturing for adidas and head protection systems for
      Riddell. Existing tier-one institutional and corporate backers including Sequoia Capital, Silver Lake, and Baillie
      Gifford reaffirmed support with a $60 million injection in late 2025.
    claimRefs:
      - CO001
      - CO003
      - CO009
      - CO010
  - calloutType: risk
    title: Proprietary Ecosystem Lock-In and Capital Intensity
    body: >-
      While Carbon DLS delivers high-resolution isotropic mechanical properties, third-party manufacturing evaluations
      highlight that printer hardware remains capital-intensive for iterative prototyping. Furthermore, platform
      customers face sole-source dependency on Carbon proprietary liquid resin catalog, creating adoption and
      unit-economic constraints compared to open commodity polymer markets.
    claimRefs:
      - CO012
      - CO014
