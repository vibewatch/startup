company:
  name: Carbon
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Carbon, Inc. is a Redwood City–based digital manufacturing enterprise that commercializes proprietary Digital Light
    Synthesis technology for production-scale polymer parts. Backed by over $740 million in equity capital, including a
    $60 million late-stage round in November 2025 to reach cash-flow breakeven, the company demonstrates verified
    production volume with adidas and Riddell while managing ongoing material ecosystem lock-in and undisclosed current
    valuation terms.
sections:
  - id: corporate-identity-and-mission
    title: Corporate Identity, Founding, and Foundational Technology
    tableRefs:
      - TO001
    figureRefs: []
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO007
      - CO011
    body: >-
      Founded in 2013 and headquartered in Redwood City, California, Carbon, Inc. is a late-stage digital manufacturing
      enterprise that pioneered Continuous Liquid Interface Production (CLIP) to commercialize Digital Light Synthesis
      (DLS). Unlike traditional layer-by-layer stereolithography or fused deposition modeling, Carbon proprietary
      process balances ultraviolet digital light projection with oxygen-permeable optics to maintain an uncured liquid
      dead zone above the build window. This continuous photochemical interface eliminates mechanical peeling forces and
      enables high-speed fabrication of isotropic polymeric components with injection-molding surface quality. The
      company operates across 14 countries, delivering an integrated hardware, software, and materials platform designed
      to shift industrial additive manufacturing from rapid prototyping into high-throughput production lines.
  - id: governance-and-leadership
    title: Executive Leadership, Governance, and Key-Person Continuity
    tableRefs:
      - TO002
    figureRefs: []
    claimRefs:
      - CO001
      - CO005
      - CO008
      - CO011
    body: >-
      Carbon was created by a interdisciplinary founding team combining advanced polymer chemistry and applied physics,
      including Dr. Joseph M. DeSimone, Alexander Ermoshkin, Nikita Ermoshkin, and Edward T. Samulski. The company has
      evolved its corporate governance through distinct growth stages, drawing seasoned industrial executives such as
      former DuPont Chairman and CEO Ellen Kullman and Madrone Capital General Partner Greg Penner to its board of
      directors. Operating leadership currently centers on the Office of the CEO, where co-founder Phil DeSimone guides
      strategic partnerships, customer deployments, and commercial execution. This management structure preserves
      technical founding continuity while maintaining industrial relationships across global manufacturing supply
      chains, though clarifying unitary chief executive succession remains an active diligence topic.
  - id: capitalization-and-investors
    title: Capitalization History, Late-Stage Financing, and Investor Syndicate
    tableRefs:
      - TO003
    figureRefs:
      - FO001
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO008
      - CO009
      - CO010
      - CO011
      - CO013
    body: >-
      Carbon capitalization history reflects sustained backing from elite venture capital, growth equity, and corporate
      strategic investors. The company raised over $260 million in June 2019 in a growth round co-led by Madrone Capital
      Partners and Baillie Gifford, pushing cumulative equity financing past $680 million and establishing a $2.4
      billion private valuation anchor. In November 2025, Carbon secured an additional $60 million financing round
      supported entirely by existing stakeholders, including Sequoia Capital, Silver Lake, adidas, Baillie Gifford,
      Madrone, and Northgate. This capital infusion is explicitly targeted at achieving cash-flow positive operations.
      However, specific pricing metrics, post-money valuation, and preference seniority terms for the 2025 round remain
      undisclosed, creating a material diligence gap relative to the 2019 valuation benchmark.
  - id: commercial-traction-and-constraints
    title: Commercial Scaling, Customer Proof, and Structural Constraints
    tableRefs: []
    figureRefs: []
    claimRefs:
      - CO007
      - CO009
      - CO010
      - CO012
      - CO014
    body: >-
      Carbon has established verifiable production-scale adoption through marquee enterprise relationships across
      consumer, medical, and industrial sectors. In athletic footwear, Carbon multi-year partnership with adidas has
      produced millions of 3D-printed lattice midsoles, culminating in the Climacool footwear franchise. In sports
      protection, Carbon custom lattice helmet pads developed with Riddell have led NFL and NFLPA safety testing for six
      consecutive years. In addition, healthcare leaders such as Becton Dickinson and dental laboratories generate
      high-volume end-use parts using Carbon biocompatible resin portfolio. Simultaneously, independent manufacturing
      evaluations indicate that Carbon platform faces adoption friction due to substantial equipment investment costs
      and sole-source dependence on proprietary resins, which limits cost-effective deployment for low-volume
      prototyping.
