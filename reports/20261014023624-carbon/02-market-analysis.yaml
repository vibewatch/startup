figures:
  - id: FM001
    title: Addressable Digital Manufacturing Sizing Layers
    type: pyramid
    summary: Hierarchical progression from broad industrial polymer manufacturing down to Carbon's qualified production DLS serviceable market.
    approximationNotes: Values illustrate industry boundary constraints from macro polymer manufacturing to DLS-qualified end-use part production.
    claimRefs:
      - CM002
      - CM005
      - CM008
      - CM012
    data:
      items:
        - label: Global Polymer & Plastics Manufacturing
          value: Macro industrial spend across commodity injection molding, extrusion, and thermoforming ($600B+ TAM).
          detail: Encompasses total global plastic component fabrication dominated by high-volume metal-tool injection molding.
        - label: Industrial Additive Manufacturing Market
          value: Total hardware, materials, and service bureau spend across polymer and metal 3D printing ($15B-$20B).
          detail: Includes rapid prototyping, tooling, jigs/fixtures, and low-volume serial production across all additive modalities.
        - label: Production-Grade Polymer Additive Manufacturing (SAM)
          value: Direct end-use polymer parts fabricated via industrial photopolymer and powder-bed systems ($3B-$5B).
          detail: High-throughput polymer additive systems capable of repeatable dimensional tolerance and surface finish.
        - label: High-Throughput Photopolymer & DLS Segment
          value: Resin-based continuous digital light synthesis and high-speed vat photopolymerization ($1.0B-$1.5B).
          detail: Addresses high-resolution isotropic elastomeric and rigid parts requiring smooth surface quality.
        - label: Carbon Addressable Vertical Vertices (Target SOM)
          value: Footwear midsoles, dental models/dentures, sports protection, and custom cycling saddles ($400M-$600M).
          detail: Application niches where Carbon has proven scaled commercial traction (adidas, Riddell, Fizik, dental labs).
        - label: Current Carbon Platform Penetration
          value: Commercial fleet install base and proprietary resin attach across certified production partners ($100M+ run rate).
          detail: Captures printer subscription leases, software licensing, and specialized resin volume attach.
callouts:
  - calloutType: insight
    title: Serial Production Economics Differentiate DLS from Prototyping Bureaus
    body: Carbon's market expansion relies on shifting customer perceptions from rapid prototyping cost-per-part to serial manufacturing total cost of ownership. The ability to produce isotropic, end-use parts directly from photopolymer resin bypasses tooling lead times, enabling custom product lines such as Riddell helmet liners and adidas footwear.
    claimRefs:
      - CM001
      - CM002
      - CM005
      - CM006
  - calloutType: risk
    title: Material Economics and Secondary Processing Limit High-Volume Scalability
    body: While Carbon delivers unmatched speed and surface finish for complex lattice geometries, high resin costs and the operational overhead of forced-circulation thermal baking restrict broader displacement of commodity thermoplastic injection molding above medium-volume thresholds.
    claimRefs:
      - CM002
      - CM012
      - CM013
