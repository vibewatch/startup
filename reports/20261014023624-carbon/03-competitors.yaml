    rows:
      - - HP Multi Jet Fusion (MJF)
        - Direct Additive Peer
        - Public (HP Inc. Enterprise Scale)
        - Industrial, automotive, consumer functional parts
        - High-throughput nylon powder-bed fusion with no support structures
        - Limited elastomeric material range compared to photopolymers
      - - Formlabs / 3D Systems SLA
        - Direct Additive Peer
        - Venture-backed / Public ($100M+ scale)
        - Prototyping, dental labs, low-volume models
        - Broad material portfolio and lower hardware acquisition cost
        - Layer peeling forces induce z-axis weakness and slower build speeds
      - - Traditional Injection Molding
        - Incumbent Manufacturing
        - Global mature manufacturing base
        - High-volume serialized polymer components (>10k units)
        - Lowest marginal cost per part and established regulatory history
        - High upfront tooling expense ($10k-$100k+) and zero lattice design flexibility
      - - Urethane Casting (Silicon Tooling)
        - Bridge Substitute
        - Global prototype bureau network
        - Low-volume bridge production (20-500 parts)
        - Low upfront mold cost with polyurethane resin properties
        - Slow manual cycle times and short silicone mold lifespans (15-25 shots)
    notes: >-
