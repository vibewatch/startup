  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Platform / Process
      - Commercial Model
      - Pricing / Unit Economics
      - Included Capabilities
      - Unknowns / Tradeoffs
      - Buyer Implication
    rows:
      - - Carbon DLS (Direct Subscription)
        - Annual printer subscription + proprietary consumables
        - High subscription tier ($25k-$50k+/yr) + $150-$300/L resin
        - Hardware, software updates, maintenance, service support
        - Realized resin utilization and lease cancellation penalties
        - Favors high-utilization continuous production facilities
      - - Carbon DLS via Service Bureaus (Xometry/TTH)
        - On-demand transactional part pricing
        - Per-part quote based on bounding box and resin volume
        - Zero capital expenditure, instant capacity scaling
        - Bureaus pass high resin markups into part pricing
        - Optimal for low-volume bridge runs and custom design validation
      - - Open-Material Industrial DLP
        - Capital equipment purchase + open third-party resin
        - Capital cost ($20k-$80k outright) + $60-$120/L resin
        - Printer ownership, flexible material qualification
        - Lack of dual-cure thermal chemistry and lattice software
        - Lower operating expenditure but requires internal process tuning
      - - Custom Injection Tooling
        - Upfront tooling NRE + commodity pellet pricing
        - Tooling ($5k-$50k+) + $2-$8/kg raw resin pellet cost
        - Full mold ownership and extreme high-volume scaling
        - Design lock-in and multi-week steel tooling lead times
        - Dominates once production exceeds break-even crossover volumes
    notes: >-
      Commercial and operational trade-offs compiled from service bureau production terms, Carbon platform
