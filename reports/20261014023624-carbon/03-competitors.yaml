      - Traditional Injection Molding
    rows:
      - - Mechanical Isotropy
        - High (Dual-cure chemical cross-linking)
        - Low to Moderate (Layer peel boundaries)
        - Moderate to High (Sintered powder fusion)
        - High (Homogeneous molded polymer)
      - - Complex Lattice Production
        - Industry Leading (Design Engine + EPU resins)
        - Limited (Brittle resins, peeling failures)
        - Moderate (Unfused powder trapped in closed cells)
        - Impossible without multi-part assembly
      - - Build Speed & Throughput
        - High (Continuous CLIP dead zone, no peel cycle)
        - Low to Moderate (Intermittent mechanical peeling)
        - High (Full bed multi-part packing)
        - Extreme (Seconds per cycle post-tooling)
      - - Post-Processing Requirements
        - Mandatory solvent wash + thermal oven baking
        - Solvent wash + UV post-curing
        - Powder de-caking, bead blasting, dyeing
        - Minimal (Gate trimming / deflashing)
    notes: >-
