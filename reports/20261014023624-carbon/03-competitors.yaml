callouts:
  - calloutType: insight
    title: Continuous Photopolymerization vs. Intermittent Separation Stress
    body: >-
      Carbon's primary technical moat in vat photopolymerization is the oxygen-inhibited 'dead zone' in its CLIP
      technology. By eliminating mechanical peeling forces at the vat window, Carbon enables faster build cycles and
      isotropic polymer performance. However, because engineering-grade properties require mandatory secondary thermal
      baking in circulation ovens, the platform entails operational footprints beyond standalone desktop 3D printers.
    claimRefs:
      - CP001
      - CP003
