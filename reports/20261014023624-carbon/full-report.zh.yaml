      - number: '2.2'
        title: 市场规模视角：从全球聚合物制造到数字光合成
        blocks:
          - type: paragraph
            body: >-
              评估 Carbon 的总可服务市场，需要把自上而下的增材设备预测与可服务的连续聚合物零件制造拆开。全球工业聚合物制造每年支出达数千亿美元，而增材制造约为 150 亿至 200
              亿美元，其中光聚合物生产系统可服务的部分约为 30 亿至 50 亿美元。在这一边界内，Carbon 的机会集中于功能晶格和快速设计迭代足以支撑高价光聚合物树脂的专业垂直领域。公司已在运动鞋领域通过与 adidas
              合作生产数百万个部件，在牙科制造领域每周生产数百万个零件，并与领先头盔制造商合作生产运动防护装备，证明了商业规模。但要把这些标杆项目转化为更广泛的可获取市场，仍取决于客户是否愿意承担机器租赁承诺和专有树脂溢价，而不是采用传统热塑性颗粒。
            claimRefs:
