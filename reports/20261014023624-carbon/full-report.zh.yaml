      - number: '3.3'
        title: 商业封装、定价模式与转换壁垒
        blocks:
          - type: paragraph
            body: >-
              Carbon 采用垂直整合的订阅和耗材模式商业化技术，而不是直接销售资本设备。客户通过多年期硬件订阅使用 M-Series 和 L-Series 生产打印机，订阅打包固件、技术支持和 Carbon Design
              Engine 软件更新。该订阅模式降低了合同制造商和企业设计中心的初始资本支出门槛，但也形成持续的运营费用承诺，收益取决于机器能否保持较高利用率。此外，Carbon
              通过封闭生态销售专有树脂，要求客户以每升溢价购买品牌液态光聚合物，包括 Rigid Polyurethane（RPU）、Elastomeric Polyurethane（EPU）和 Epoxy（EPX）。

              企业一旦为连续终端零件验证某种 Carbon 材料配方，这些商业条款就会形成显著的转换壁垒。医疗器械审批、消费鞋类测试和汽车认证都把机械性能绑定在 Carbon
              的特定双固化化学体系和打印参数上，因此更换打印机供应商需要付出高昂的重新认证成本。不过，Xometry、Protolabs 和 TTH 等第三方按需制造网络，通过按件交易同时提供 Carbon DLS
              零件、MJF 和聚氨酯浇注等竞争工艺，减轻了 OEM 层面的买方锁定。这一双重分销渠道也让 Carbon 面临多平台采购：企业买方会动态比较增材和减材供应商的零件成本。
            claimRefs:
              - CP005
              - CP009
              - CP011
              - CP012
