        title: 收入模式与平台变现
        blocks:
          - type: paragraph
            body: >-
              Carbon 采用一体化数字制造变现架构，与传统资本设备销售模式明显不同。公司不单独销售未打包的 3D 打印机，而是通过结合硬件订阅租赁、经常性专有光聚合物树脂销售和云软件服务的混合平台模式，商业化其 DLS
              技术（CI001）。硬件使用围绕 M 系列生产系统（M1、M2、M3、M3 Max）的年度订阅协议展开，也包括专为大规模制造环境设计的高通量 L1 生产系统（CI002）。这些机器始终连接 Carbon
              云基础设施，可实现自动切片、远程遥测、全机队工艺优化、预测性维护以及参数持续空中更新（CI002）。除了打印系统，Carbon 还提供 Smart Part Washer
              等专用后处理硬件，为生产零件自动完成清洗、序列化和制造追踪（CI004）。这种架构的商业吸引力在于消除传统模具成本，让企业客户无需昂贵模具或数月的模具交付周期，就能快速迭代设计并启动本地化生产（CI003）。
