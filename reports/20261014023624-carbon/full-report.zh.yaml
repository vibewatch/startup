              Carbon 的市场扩张依赖于改变客户认知：从快速原型的单件成本，转向连续制造的总拥有成本。直接用光聚合物树脂生产各向同性终端零件，可以绕过模具交付周期，为 Riddell 头盔衬垫和 adidas
