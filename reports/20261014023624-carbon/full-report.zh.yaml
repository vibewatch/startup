      - number: '7.2'
        title: 运营、良率与后处理脆弱性
        blocks:
          - type: paragraph
            body: >-
              Carbon 硬件和工艺流程的核心是由 Continuous Liquid Interface Production（CLIP）驱动的 Digital Light Synthesis（DLS）。CLIP
              通过在盒式窗口正上方维持薄薄的含氧死区，避开机械剥离力，但打印的物理过程仍会带来严重的运营故障模式。在每层切片的上泵阶段，强吸力作用于构建平台，将绿色状态部件从平台上拉开，导致粘附不足或部件脱落；大截面、不对称设计或柔性弹性晶格尤其容易出现这一问题。此外，CAD
              几何中未设置排气的体积会产生局部压力真空，引发爆裂、毛边、真空线和树脂供应不足。快速光聚合过程中的热量积累会形成放热梯度，迫使软件打印计划降低实心截面的构建速度。更关键的是，工程级机械性能需要大量二次后处理：双组分树脂必须在强制循环烘箱中长时间烘焙，由单体质量损失和热收缩造成
              0.3% 或更高的收缩；单组分树脂则需要二次紫外照射。在服务商和企业内部工厂的生产环境中，清洗洁净度、烘箱均匀性或树脂分配的偏差，都会直接造成不合规格的批次和更高的报废率。
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.3'
        title: 生态锁定、材料定价与商业集中度
        blocks:
          - type: paragraph
            body: >-
              Carbon 的制造平台要扩大商业采用，卡在商业模式锁定和合作伙伴依赖上。独立制造网络分析指出两项根本性结构短板：与传统模具相比，Carbon 的硬件和迭代打样仍然昂贵；客户又被严格限定只能使用 Carbon
              独家配方并供应的专有树脂。这种封闭耗材模式让 Fast Radius、SyBridge Technologies、ERPRO Group
              等企业客户和服务商暴露于单一来源树脂供应风险、材料定价权以及树脂利润率上抬的压力下。同时，Carbon 的标志性产量高度集中于少数消费品合作项目，尤其是为 Adidas
              生产晶格鞋中底，另有若干汽车和牙科专业客户。终端消费需求放缓、设计转向非晶格中底，或签约服务商的利润承压，都会直接打击 Carbon 的耗材树脂使用率和订阅收入。
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: 展品
        blocks:
          - type: callout
            title: 封闭树脂的双刃剑
            body: >-
              向客户销售专有树脂，为 Carbon 带来高毛利、可重复的耗材收入，却也成了成本敏感型制造商采用平台的一道高墙。独立服务商称，与开放平台的 SLA 和 DLP 竞品相比，Carbon
              的封闭材料生态让迭代打样和大批量零件替代都更贵。
            calloutType: risk
            claimRefs:
              - CR012
              - CR013
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资主论点与战略反论点
        blocks:
          - type: paragraph
            body: >-
              评估对 Carbon 的投资，既要看其有吸引力的核心技术，也要正视严峻的商业和市场逆风。正面主论点是 Carbon
              的专有数字光合成（DLS）平台：它以连续液面生产（CLIP）为基础，借助充氧死区消除机械剥离力，实现真正的生产级吞吐。不同于传统打样型 3D 打印机，Carbon
              能生产各向同性、可直接终端使用的弹性和刚性聚氨酯部件，已用于 Adidas 鞋中底、Riddell 运动防护头盔等标志性消费项目。此外，全球 Carbon 生产网络（CPN）覆盖 35
              家以上经核实的生产设施，形成外包制造生态，降低企业客户的资本门槛。反论点则在于结构性的商业摩擦：Carbon
              的封闭材料策略迫使客户购买昂贵的专有树脂，限制大规模替代。旗舰鞋类客户带来的收入高度集中，加上二次固化的热收缩复杂性，也形成了威胁耗材持续使用的运营依赖。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV008
              - CV011
      - number: '8.2'
        title: 融资历史、估值锚点与优先权悬空
        blocks:
          - type: paragraph
            body: >-
              Carbon 的资本结构已是成熟后期创投公司的典型样貌：历史上吸收了大量资本，估值锚点却已过时。2025 年 11 月，公司完成一轮 $60 million 融资，全部由现有内部投资人支持，包括 Sequoia
              Capital、Silver Lake、Baillie Gifford、Madrone 和
              Adidas。管理层将其定位为扩产并实现持续现金流转正的增长资本，但在没有新的外部领投方加入的情况下，内部人参与更像是在防守性延长资金跑道，而不是通过独立交易抬升估值。此前，公司于 2019 年完成 $260
              million E 轮融资，累计股权融资超过 $680 million。市场仍以 Carbon 2019 年达到峰值的 $2.4 billion
              标称估值为参照，但这一数字形成于增材制造的宏观景气高点。在私营财务数据严格不披露的情况下，用 $60 million 新资本支撑 $2.4 billion
              锚点，会造成显著的清算优先权悬空，并给次级和普通股股东带来较大下行风险。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV009
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV014
      - number: '8.3'
        title: 估值情景与市场倍数
        blocks:
          - type: paragraph
            body: >-
              要为 Carbon 建立客观估值框架，需要把历史创投估值与当前公开市场倍数、不同经营路径下的情景放在一起校准。3D Systems、Stratasys、Desktop Metal
              等公开增材制造可比公司经历了大幅重估，企业价值 / 过去收入倍数已从历史高点 5.0x 以上压缩到当前 1.0x–2.5x。基准情景假设 Carbon 稳定后的年化收入为 $350 million–$450
              million，并有温和经营利润；按 2.0x–2.5x 收入倍数，预估内在估值区间为 $750 million–$1.1 billion。乐观情景下，若牙科树脂和大批量消费鞋类业务加速，上市前内在估值可能恢复到
              $1.8 billion–$2.4 billion。反之，若鞋类需求萎缩且现金消耗重新上升，悲观情景会导致稀释性资本重组或以 $350 million–$500 million
              进行困境出售，次级股权持有人大部分价值将被抹去。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV010
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV010
              - CV013
      - number: '8.4'
        title: 建议框架与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              综合技术差异化、资本结构成熟度和严重的估值不透明问题，我们对 Carbon 的最终建议是「继续研究」，置信度中等、风险评级高，且认为估值偏高。Carbon 虽然拥有经核实的生产级硬件和一线商业合作关系，但在
              $2.4 billion
              历史锚点附近承销增长资本或购买老股，将违背基本估值纪律。在关键私有数据尚未解锁前，决策流程要求资本配置者暂缓承销股权。考虑任何投资前，尽调团队必须完成三项不可妥协的核验：第一，查看经审计的 GAAP
              资本表，评估高级清算优先权倍数和参与权条款；第二，审阅细分财务报表，确认过去订阅 ARR、树脂毛利率和实际月度现金消耗；第三，分析客户群续约表，核实锚定客户是在扩张而非停滞。
            claimRefs:
              - CV001
              - CV008
              - CV012
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV008
              - CV014
      - number: '8.5'
        title: 展品
        blocks:
          - type: callout
            title: 估值不透明决定继续研究立场
            body: >-
              Carbon 确实展现了生产级增材制造能力，也得到一线投资人支持；但在收入、毛利率和清算优先权条款尚未核实前，以接近 $2.4B
              历史估值锚点的价格投入资本，属于不可接受的投资判断风险。完整财务报表和单位经济模型完成审计前，投资者应保持克制，继续研究。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV014
          - type: callout
            title: 增材制造倍数压缩带来的下行脆弱性
            body: 宏观逆风和行业整合失败后，公开增材制造同行的股权估值已大幅下调。如果 Carbon 被迫在当前环境下寻求流动性事件或外部增长轮融资，将面临倍数大幅压缩和清算优先权悬空，普通股及早期优先股股东可能被严重稀释。
            calloutType: risk
            claimRefs:
              - CV002
              - CV008
              - CV010
