      - number: '4.3'
        title: 成本结构、单位经济性与利润率驱动因素
        blocks:
          - type: paragraph
            body: >-
              Carbon 数字制造平台的经济可行性依赖经典的剃须刀与刀片模式：打印机部署必须带来经常性、高毛利率的光聚合物耗材销售，以覆盖获客成本和硬件折旧。但独立技术评估指出，材料单位经济性存在摩擦。Dassault
              Systèmes 的基准测试特别强调，DLS 技术价格明显偏高，在需要多次迭代构建的原型和初步设计阶段形成显著成本壁垒（CI008）。此外，客户受单一供应商材料依赖约束，因为 DLS 硬件只能运行 Carbon
              直接配方并销售的专有工程树脂（CI009）。对潜在投资判断而言，Carbon 的单位经济性根本不透明：公司保持非公开披露状态，也不公布实际
              ARR、毛利率、打印机租约流失率或净收入留存率（CI013）。因此，在计入专有树脂加价和持续订阅费用后，高产量客户能否实现正运营利润，仍是关键尽调缺口。
            claimRefs:
