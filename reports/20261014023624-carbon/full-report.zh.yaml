  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立与基础技术
        blocks:
          - type: paragraph
            body: >-
              Carbon, Inc. 成立于 2013 年，总部位于加利福尼亚州 Redwood City，是一家后期阶段的数字制造企业，率先将 Continuous Liquid Interface
              Production（CLIP）用于商业化 Digital Light Synthesis（DLS）。不同于传统的逐层立体光刻或熔融沉积成型，Carbon
              的专有工艺将紫外数字光投影与透氧光学元件结合，在成型窗口上方维持未固化的液态死区。这一连续光化学界面消除了机械剥离力，使公司能够高速制造各向同性聚合物部件，并达到注塑件的表面质量。公司业务覆盖 14
              个国家，提供一体化硬件、软件和材料平台，推动工业增材制造从快速原型走向高通量生产线。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
