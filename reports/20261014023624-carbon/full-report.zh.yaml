            title: 材料经济性与二次处理限制高产量扩张
            body: Carbon 在复杂晶格几何上拥有出色的速度和表面光洁度，但高昂的树脂成本和强制循环热烘焙的运营负担，限制了其在超过中等产量门槛后进一步替代通用热塑性注塑。
            calloutType: risk
