            body: >-
              Carbon 的市场进入执行瞄准两类部署：与全球原始设备制造商（OEM）直接建立企业生产合作，以及通过认证生产伙伴搭建分散式商业合同制造网络。Carbon 企业 OEM 模式最突出的验证，是 2017 年建立的
              Adidas 多年合作，已为 4DFWD 和 Climacool 等运动鞋产品线生产数百万个 3D 打印晶格中底（CI011）。在运动用品安全领域，Riddell 使用 Carbon DLS
