  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与生产硬件平台
        blocks:
          - type: paragraph
            body: >-
              Carbon 商业化提供以专有 Digital Light Synthesis（DLS）技术为核心的一体化数字制造平台。Carbon
              并不只把系统定位为快速原型设备，而是专门为终端工业和消费品生产设计硬件与软件流程。公司的硬件产品覆盖多代连续光聚合打印机，包括中等产量的 M-Series（M1、M2，以及当前支持 4K 的 M3 和 M3
              Max）和大幅面 L1 平台。M3 系列引入闭环控制和红外树脂加热，吞吐量最高可达到前代的两倍半。L1 将构建空间扩展到 400 mm × 250 mm × 460 mm，构建面积是早期设备的五倍，可为
              Adidas 和 Ford 等企业提供连续生产。硬件部署还配有外围自动化设备，尤其是 Smart Part Washer，可标准化树脂去除流程，将打印后清洗时间至少缩短一半，最高可达 75%。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
      - number: '5.2'
        title: 数字光合成与连续液态界面架构
        blocks:
          - type: paragraph
            body: >-
              Carbon 平台的技术基础是 Continuous Liquid Interface Production（CLIP），这让 DLS
              有别于传统逐层立体光刻和数字光处理（DLP）。在传统槽式光聚合中，每层新固化的树脂都会直接粘在槽底窗口上，需要机械分离循环，带来应力、降低打印速度，并留下可见层界。Carbon
              使用透氧窗口光学元件克服这一限制，建立约 20 微米厚的连续未固化死区。环境氧气会抑制紫外光介导的光聚合，靠近窗口的树脂保持液态，而从下方投射的紫外光则固化死区上方的部件。构建平台沿 Z
              轴持续上升时，新鲜树脂不断流入其下方，不会中断。这一连续工艺制造出坚实、机械各向同性的部件，表面光滑，所有空间轴向的结构完整性一致。
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE007
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE010
              - CE011
              - CE012
      - number: '5.3'
        title: 双固化材料化学与后处理操作
        blocks:
          - type: paragraph
            body: >-
              要达到注塑件的机械性能，仅靠传统单固化光聚合物并不够，因为这类材料通常易脆，长期环境耐久性差。Carbon 通过专有双固化液态树脂解决这一问题。在初始 DLS
              打印阶段，数字紫外光激活光敏光引发剂，使部件固化为定义几何形状的中间绿色状态。Smart Part Washer
              自动清洗、去除未固化表面树脂后，部件必须在强制循环烘箱中进行二次热固化。热烘焙会激活休眠的环氧或聚氨酯等化学成分，形成互联分子基体，赋予材料高拉伸强度、抗冲击韧性和耐热性。EPX 82 等生产树脂的拉伸强度可达
              84 MPa，与玻纤热塑性材料相当；EPU 46 等弹性聚氨酯的延伸率可达 330%，适合运动装备和防护设备中的高回弹晶格缓冲。
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE005
              - CE006
      - number: '5.4'
        title: 运营架构、集成与技术风险
        blocks:
          - type: paragraph
            body: >-
              Carbon 以 Carbon Design Engine
              软件补充硬件和材料，这是一个可自动生成贴合型、面向性能的晶格结构的算法生成式设计套件。工程师可以在毫米级分辨率调节机械刚度和减重，制造传统注塑或减材数控铣削无法实现的产品。但尽调也揭示了若干材料和经济边界。DLS
              制造经济性高度依赖零件几何形状：由于耗材树脂定价和热循环时间，尺寸超过标准口袋大小后，成本优势会迅速减弱。此外，运营依赖专用透氧窗口膜，窗口老化或机械撕裂都会使生产停摆。最后，强制二次热烘焙会带来周期延迟、批次排程约束和热变形风险，必须在生产批次中严格实证验证。
            claimRefs:
              - CE009
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE007
              - CE008
              - CE009
      - number: '5.5'
        title: 展示案例
        blocks:
          - type: callout
            title: 连续打印消除分层弱点
            body: 20 微米死区阻止材料与槽窗发生机械粘连，使打印机可以持续垂直运动，获得真正的各向同性拉伸强度，可与热塑性注塑件相比。
            calloutType: insight
            claimRefs:
              - CE007
              - CE010
          - type: callout
            title: 依赖二次热固化
            body: 双固化化学体系要求清洗后必须进行烘箱热烘焙，以触发潜伏环氧或聚氨酯交联，因此带来周期延迟和严格的烘箱编程约束。
            calloutType: risk
            claimRefs:
              - CE008
              - CE014
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与多垂直领域商业覆盖
        blocks:
          - type: paragraph
            body: >-
              Carbon 在四类客户中商业化其 DLS
              增材制造平台：消费级性能产品、汽车与工业制造、医疗器械与临床牙科，以及合同服务商。企业买方既包括寻求差异化晶格缓冲的品牌研发负责人，也包括试图在短期过渡生产中摆脱昂贵注塑模具的制造工程师。公开披露的企业案例表明，数百家全球企业曾在原型和终端生产阶段使用
              Carbon 平台。运动鞋、自行车坐垫和防护头盔中的知名品牌部署，凸显 Carbon 制造传统工艺无法实现的功能性弹性晶格的能力。同时，工业设备制造商使用 RPU 70
              等刚性聚氨酯树脂生产机械外壳、推入式铆钉等功能部件。在医疗领域，专业牙科实验室和医疗器械公司使用 Carbon
              硬件及生物相容性光聚合物树脂，制造患者定制的矫治器模型和外科器械。尽管覆盖多个垂直领域，客户采用仍明显分化为高产量消费旗舰产品线和低产量过渡制造应用。
            claimRefs:
