  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与替代制造方法
        blocks:
          - type: paragraph
            body: >-
              Carbon 位于数字增材制造与聚合物连续生产的交叉点。评估其竞争壁垒时，相关格局不只包括其他光聚合物 3D
              打印设备供应商，还包括依赖模具的注塑、聚氨酯浇注和减材数控加工等更广泛的工业制造方法。传统立体光刻（SLA）和标准数字光处理（DLP）系统过去主要服务快速原型流程，受限于 z
              轴方向的部件各向异性弱点和可见的分层。Carbon 将 DLS 定位为连接功能原型与中小型聚合物部件连续生产的技术。

              除了槽式光聚合同行，粉末床熔融技术，尤其是选择性激光烧结（SLS）和 HP Multi Jet Fusion（MJF），是功能性终端聚合物最强的生产级增材替代方案。同时，传统注塑仍是连续制造中根深蒂固的
              incumbent 和经济基准；它虽然需要高额前期模具投入及数周钢模交付周期，但在产量超过 1 万件后，单件成本会降至几美分。Carbon
              的可服务甜蜜点在于低至中等产量的过渡制造、大规模定制，以及无法从实体模具脱模的复杂有机晶格几何。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP010
      - number: '3.2'
        title: 技术架构与直接能力比较
        blocks:
          - type: paragraph
            body: >-
              Carbon 与传统槽式光聚合平台之间最根本的技术壁垒，是其专有的 Continuous Liquid Interface Production（CLIP）架构。在标准 DLP 和 SLA 3D
              打印机中，每层新固化的树脂都会直接粘在树脂槽底部的光学窗口上。逐层机械分离需要间歇性的剥离动作，会对精细结构施加严重剪切应力，拖慢构建周期，还可能撕裂槽窗膜。Carbon
              则让紫外光透过透氧光学窗口投射，从而绕过这一机械瓶颈。氧气会在窗口正上方约 20 微米厚的微小“死区”内抑制光聚合，维持连续液态边界，让构建升降台可以不间断上升。

              这一连续光聚合工艺带来各向同性的机械密度，消除了分层增材部件常见的方向性剪切弱点。此外，Carbon
              将光聚合与双固化化学配方结合：光学打印后，部件还要在强制循环烘箱中进行二次热烘焙。二次固化会促使聚氨酯和环氧分子链交联，带来机械韧性、拉伸强度和抗冲击性，可与 ABS、玻纤尼龙等注塑热塑性材料竞争。不过，工业
              DLP 供应商和粉末床熔融系统仍在缩小生产率差距，尤其是在无需烘焙的部件或开放树脂来源能降低总拥有成本的场景。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP014
