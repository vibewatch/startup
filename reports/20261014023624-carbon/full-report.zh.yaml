            body: >-
              Carbon
              的商业采用覆盖三类客户：商业牙科实验室、全球消费品牌和工业合同制造商。商业牙科实验室中，实验室所有者和生产经理从运营设备预算采购高通量系统，用于快速制造牙模、隐形矫治器和假牙。相比之下，adidas、Riddell
              和 Fizik 等企业消费客户通过先进创新团队和产品工程预算参与，先在 Carbon 软件环境中设计定制晶格结构，再交由认证生产网络伙伴制造。Fast Radius
              等合同制造服务商是第三类关键买方，它们购买打印机机队，为不同工业客户按需生产零件，无需购置专用模具。
