  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 端到端转化桥接图，展示客户工作流活动如何转化为持续性打印机订阅、耗材树脂用量和毛利率。
    data:
      nodes:
        - id: N1
          label: 应用与部件设计
          description: 客户使用 Carbon 软件或 CAD 工具设计终端部件，并加入晶格拓扑
        - id: N2
          label: 硬件部署
          description: 客户按年订阅 M 系列或 L1 生产打印机设备群
        - id: N3
          label: 软件平台访问
          description: 持续性云订阅提供切片、设备群监控和无线更新
        - id: N4
          label: 专有树脂消耗
          description: 高毛利光聚合物耗材树脂采购随制造量增长
        - id: N5
          label: 后处理与清洗机操作
          description: 部件在 Smart Part Washer 中清洗，再经热烘焙获得各向同性强度
        - id: N6
          label: 毛利与现金生成
          description: 高毛利耗材配套销售和持续性打印机租赁推动经营现金流
      edges:
        - from: N1
          to: N2
          label: 部件认证带来打印机租赁
        - from: N2
          to: N3
          label: 硬件安装激活云平台
        - from: N3
          to: N4
          label: 生产吞吐量触发耗材补货
        - from: N4
          to: N5
          label: 打印出的生坯部件进入清洗和热固化
        - from: N5
          to: N6
          label: 规模化部件产量带来持续性毛利
    approximationNotes: 流程关系反映定性的商业机制；确切的单位转化率和利润率属于未公开的私有指标。
    claimRefs:
      - CI001
      - CI003
      - CI007
      - CI009
      - CI011
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 支撑 Carbon 连续数字光合成生产的六层物理与数字技术架构。
    data:
      layers:
        - label: 设计与计算几何层
          detail: Carbon Design Engine 软件用于自动生成晶格并以算法优化部件。
          items:
            - Carbon Design Engine
            - 共形晶格生成器
            - FEA 集成 API
        - label: 打印机设备群智能与云操作系统
          detail: 云连接打印机管理平台，提供无线固件更新和实时遥测。
          items:
            - Carbon OS
            - 实时遥测监控器
            - 设备群作业调度器
        - label: 光学投影与光引擎
          detail: 高分辨率 4K 数字 UV 光投影穿过透氧光学件固化截面。
          items:
            - 4K 数字 UV 投影仪
            - 红外树脂加热
            - 闭环辐射测量
        - label: 连续界面与料槽机械结构
          detail: 透氧窗口形成 20 微米死区，让树脂连续补充且不发生粘附。
          items:
            - 透氧窗口
            - 20 微米死区
            - 连续运动 Z 轴平台
        - label: 双重固化光聚合物树脂
          detail: 可编程液态树脂，将 UV 光聚合与潜热激活的热固性材料结合。
          items:
            - EPX 环氧树脂系列
            - EPU 弹性体系列
            - RPU 刚性聚氨酯
            - DB 牙科树脂
        - label: 自动后处理与热固化
          detail: 自动溶剂清洗后，在强制循环烘箱中进行二次热烘焙。
          items:
            - Smart Part Washer
            - 自动离心旋转器
            - 强制循环烘箱
    approximationNotes: 架构栈模拟从 CAD 输入到成品各向同性聚合物部件的端到端连续制造流程。
    claimRefs:
      - CE010
      - CE011
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从初始算法设计原型到全设备群生产和树脂补充的端到端客户采用历程。
    data:
      items:
        - label: 设计与生成式晶格
          stage: 阶段 1：探索
          description: 工程团队评估部件几何形状，并使用 Carbon Design Engine 生成共形晶格。
          touchpoints:
            - CAD 模型导入
            - 云软件评估
            - 晶格机械性能调校
        - label: 原型制作与材料筛选
          stage: 阶段 2：材料选择
          description: 用户使用 RPU 70、EPU 40 或 EPX 82 等工程树脂打印测试部件，评估表面光洁度和公差。
          touchpoints:
            - 材料样品套件
            - 原型部件制造
            - 机械拉伸测试
        - label: 应用验证与工艺调校
          stage: 阶段 3：验证
          description: 客户利用力反馈校准和二次热烘焙，验证部件的各向同性和可重复性。
          touchpoints:
            - 二次固化烘箱参数分析
            - 打印计划调整
            - 尺寸公差验证
        - label: 服务机构过渡生产
          stage: 阶段 4：小批量生产
          description: 客户通过 Agile Manufacturing 和 Aprios 等认证生产网络合作伙伴完成首批生产（1 至 50,000 件）。
          touchpoints:
            - 生产合作伙伴询价
            - 过渡制造批次
            - 取消工装评估
        - label: 内部设备群租赁部署
          stage: 阶段 5：设备群安装
          description: 大批量客户通过年度订阅租赁部署专用 M 系列或 L1 打印机，并配套 Smart Part Washer 自动化。
          touchpoints:
            - 本地设备租赁
            - 工厂溶剂安全配置
            - 操作员培训认证
        - label: 生产补给与产品线扩张
          stage: 阶段 6：规模化与补充
          description: 持续补充光聚合物树脂、续订软件订阅，并在相邻产品系列中扩展 SKU 产品线。
          touchpoints:
            - 自动订购树脂
            - 设备群软件遥测
            - 多部件 SKU 扩展
    approximationNotes: 采用旅程阶段综合自合作伙伴工作流、公开技术文档和商业设备租赁结构。
    claimRefs:
      - CU006
      - CU010
      - CU011
