      - number: '6.2'
        title: 采用轨迹与具名企业生产证据
        blocks:
          - type: paragraph
            body: >-
              评估 Carbon 的真实商业牵引力，需要把早期探索性原型与规模化经常性生产部署区分开来。可验证的生产证据在消费运动和体育用品领域最强：与 adidas、Specialized 和 fizik
              等全球品牌的合作，已将数百万个终端晶格部件交付市场。Adidas 不仅是 Carbon Futurecraft 4D 中底最受关注的客户，也是直接股权投资人，参与了 Carbon 2025 年 11 月的
              6,000 万美元成长轮。在汽车领域，Ford Motor Company 已部署 Carbon DLS 技术制造功能性售后零件和内饰部件，无需等待硬化模具即可快速迭代设计。同样，办公家具制造商
              Steelcase 与服务商 Fast Radius 合作商业化一款定制高端办公椅，将产品开发周期缩短 90%。运动防护制造商 VICIS 也共同开发了吸收冲击的晶格头盔衬垫，并取得顶级安全评级。装机基础由
              Fast Radius 等大型合同生产服务商支撑；Fast Radius 拥有北美最大的 Carbon 设备公开装机量，Agile Manufacturing 则支持最多 50,000
              个各向同性部件的批次生产。为缩小原型制作与连续工厂生产之间的资格认证差距，Carbon 在 M3 和 L1 代打印机中引入力反馈技术，动态测量吸力，稳定良率并减少客户机队中的打印缺陷。
