      - number: '6.3'
        title: 留存持久性、伙伴网络动态与渠道集中度
        blocks:
          - type: paragraph
            body: >-
              Carbon 的市场进入架构高度依赖双轨模式：一方面是直接部署在客户现场的硬件订阅，另一方面是由合同制造服务商组成的授权 Production Network。Aprios 和 Agile
              Manufacturing 等服务商是关键获客渠道，为缺乏资本或产量、不足以支撑专用现场打印机租赁的企业提供更容易进入的方式。客户可利用 Carbon Design Engine 等云工具，直接从 CAD
              几何生成贴合型晶格，跳过手工支柱建模，加快进入实体生产。不过，这种由伙伴中介的模式也带来显著采购摩擦和渠道集中风险。伙伴层面的瓶颈和硬件访问限制过去曾迫使 Sculpteo 等服务商为 Carbon
              打印机时段建立客户等待名单，并主动把急于生产的客户引向 Polyjet 树脂等竞争增材技术。此外，由于 Carbon 的财务模式依赖经常性光聚合物树脂拉动和订阅费，公司收入高度集中在少数 Adidas
              等标志性消费客户周围。如果主要鞋类或自行车项目放缓生产计划，或重新谈判树脂供应条款，平台整体经济性会立即承压。
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU006
              - CU012
      - number: '6.4'
        title: 客户尽调评估与战略性证据缺口
        blocks:
          - type: paragraph
            body: >-
              从投资尽调角度看，Carbon
              已建立真实的技术验证和大规模制造可信度，超过多数风险投资支持的增材制造同行。其各向同性聚合物部件的生产耐久性，得到严格工业测试和多年持续消费品产品线的共同印证。然而，公司客户披露仍有关键投资判断缺口。公开材料没有披露经审计的留存指标、净收入留存率（NRR）、毛收入留存率（GRR）或客户群流失率。仅凭公开记录，无法核验公司营销中提到的“数百家全球组织”中，有多少是当前活跃的经常性订阅客户，有多少只是完成过一次性原型项目的历史试用账户。此外，树脂附着率、机器利用小时数以及各客户层级毛利率的确切经济数据仍属严格保密的私有数据。潜在投资者必须以直接获取客户群明细为前提评估估值，并检视打印机租约续签和耗材树脂订单是否能够稳定超越运动鞋与体育用品核心锚定客户。
            claimRefs:
              - CU001
              - CU004
              - CU012
              - CU015
      - number: '6.5'
        title: 展示案例
        blocks:
          - type: callout
            title: 生产扩张摩擦与渠道产能约束
            body: >-
              Carbon 的 Production Network
              让企业可以绕过直接租赁硬件的成本，但伙伴等待名单和专门的运营要求会阻碍快速扩张。当生产服务商面临分配积压或复杂材料切换时，有时限的客户发布计划可能被引导至竞争增材平台或传统模具。
            calloutType: risk
            claimRefs:
              - CU006
              - CU012
          - type: callout
            title: 客户股权支持带来的战略协同
            body: Adidas 等主要商业客户参与 Carbon 融资，为投资逻辑提供关键验证，并保证最低生产量承诺。但这一关系也把商业风险集中在标志性运动鞋产品线上，使更广泛的工业采用仍取决于降低光聚合物树脂成本。
            calloutType: insight
            claimRefs:
              - CU002
              - CU003
              - CU004
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 管理层风险分类与资本结构敞口
        blocks:
          - type: paragraph
            body: >-
              评估 Carbon 的风险状况，需要分析增材制造（AM）宏观情绪、资本结构韧性和运营单位经济性如何汇合。联合创始人 Phil DeSimone 承认，2023
              年整个增材制造行业失败的并购严重削弱了投资者信心；他将外界对行业的看法形容为混乱，并指出重建财务信任势在必行。尽管 Carbon 在 2025 年末获得由 Sequoia Capital 和战略客户 Adidas
              等老股东支持的 6,000 万美元融资，公司仍是私有企业，历史上还锚定在 2019 年建立的 24 亿美元最高估值。管理层的目标是在 12 至 24
              个月内完成首次公开募股（IPO），前提是维持现金流盈亏平衡运营。然而，公开市场对资本密集型硬件即服务和专有增材制造商业模式已表现出严重怀疑；如果正现金流无法持续，Carbon
              将面临大幅下轮融资或估值倍数压缩风险。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
