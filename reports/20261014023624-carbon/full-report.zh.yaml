        - 内部人主导的追加融资表明，在当前估值下外部增长资本意愿不足
        - 12-18 个月内未能实现自我维持的经营现金流
      - - 市场倍数
        - 生产级增材制造的领先地位带来溢价战略平台价值
        - 公开市场增材制造同行的收入倍数已压缩至 1x-2.5x
        - 公开申报或二级交易将股权估值确立在 $600M 以下
    notes: 对关键投资论点与可能证伪它们的运营触发点进行结构化对照。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV008
      - CV011
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 经营假设
      - 估值 / 回报逻辑
      - 主要风险与失效触发点
      - 概率信号
    rows:
      - - 乐观情景
        - 牙科和医疗树脂快速扩张；Adidas Climacool 放量；2026 年经营现金流为正
        - 估值恢复至 $1.8B-$2.4B；按 4x-5x 收入倍数走向可行上市
        - 牙科自动化执行不及预期；更广泛的工业资本开支放缓
        - 20%
      - - 基准情景
        - 生产合作伙伴利用率稳定；收入温和增长；达到现金流盈亏平衡
        - $750M-$1.1B 内在估值；按 2.0x-2.5x 倍数完成现实的并购或重估增长轮
        - 增材制造市场折价持续；客户集中带来摩擦；硬件升级缓慢
        - 55%
      - - 悲观情景
        - 核心鞋类 / 运动需求走弱；高现金消耗延续；下轮融资或资本重组
        - $350M-$500M 困境清算，或进行稀释性资本重组并承受严重优先权压力
        - 初级普通股被清零；服务机构破产；客户抗拒专有树脂价格
        - 25%
    notes: 情景模型基于历史融资额、内部人过桥融资和可比市场倍数估算。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV008
      - CV010
      - CV013
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Carbon 从 2013 年成立到 2025 年末融资的运营与资本化里程碑时间线。
    data:
      items:
        - date: '2013'
          label: 在硅谷成立
          detail: Carbon 在硅谷成立，开发用于聚合物部件的连续液体界面生产技术。
          tone: neutral
          claimRefs:
            - CO001
        - date: 2014-02
          label: 基础专利提交
          detail: Joseph DeSimone、Alexander Ermoshkin、Nikita Ermoshkin 和 Edward Samulski 提交首批 CLIP 专利申请。
          tone: positive
          claimRefs:
            - CO011
        - date: 2015-03
          label: 在 TED 公开亮相
          detail: Joseph DeSimone 在 TED 大会上演示了用液态树脂快速连续打印 3D 部件，耗时 10 分钟。
          tone: positive
          claimRefs:
            - CO011
        - date: '2016'
          label: 商用 M1 硬件
          detail: Carbon 将 M1 打印机商业化，并推出用于工业流程的 Smart Part Washer 硬件。
          tone: positive
          claimRefs:
            - CO012
        - date: '2017'
          label: adidas 鞋类合作
          detail: Carbon 与 adidas 合作，扩大 3D 打印运动鞋中底的商业化生产。
          tone: positive
          claimRefs:
            - CO009
        - date: 2019-01
          label: Ford 量产汽车部件
          detail: Ford 将数字制造的聚合物部件装配到包括 F-150 和 Mustang 在内的量产车型上。
          tone: positive
          claimRefs:
            - CO010
        - date: 2019-02
          label: L1 打印机与 Riddell 头盔
          detail: Carbon 发布大幅面 L1 打印机，并与 Riddell 合作定制橄榄球头盔衬垫。
          tone: positive
          claimRefs:
            - CO010
            - CO013
        - date: 2019-06
          label: $260M E 轮增长融资
          detail: Madrone 与 Baillie Gifford 联合领投 $260M 融资，使累计融资额超过 $680M。
          tone: positive
          claimRefs:
            - CO002
        - date: 2025-11
          label: $60M 后续融资
          detail: 现有支持者注入 $60M，加速 Carbon 走向经营现金流为正。
          tone: positive
          claimRefs:
            - CO003
        - date: 2026-10
          label: 尽调画像评估
          detail: 尽调显示，Carbon 已验证鞋类业务规模，但仍受制于专有树脂依赖和设备成本壁垒。
          tone: warning
          claimRefs:
            - CO014
    approximationNotes: 日期代表公司正式公告日期和专利登记记录。
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
  - id: FM001
    title: 数字制造可服务市场规模分层
    type: pyramid
    summary: 从广泛的工业聚合物制造，逐层收窄至 Carbon 已具备资质的 DLS 生产可服务市场。
    approximationNotes: 数值展示了从宏观聚合物制造到符合 DLS 资质的终端部件生产之间的行业边界约束。
    claimRefs:
      - CM002
      - CM005
      - CM008
      - CM012
    data:
      items:
        - label: 全球聚合物与塑料制造
          value: Macro industrial spend across commodity injection molding, extrusion, and thermoforming ($600B+ TAM).
          detail: 覆盖全球塑料部件制造总量，其中大部分由金属模具的大批量注塑主导。
        - label: 工业增材制造市场
          value: Total hardware, materials, and service bureau spend across polymer and metal 3D printing ($15B-$20B).
          detail: 包括快速原型、工装、夹具以及所有增材制造方式下的小批量连续生产。
        - label: 生产级聚合物增材制造（SAM）
          value: Direct end-use polymer parts fabricated via industrial photopolymer and powder-bed systems ($3B-$5B).
          detail: 能够稳定实现尺寸公差和表面光洁度的高吞吐量聚合物增材系统。
        - label: 高吞吐量光聚合物与 DLS 领域
          value: Resin-based continuous digital light synthesis and high-speed vat photopolymerization ($1.0B-$1.5B).
          detail: 面向需要平滑表面质量的高分辨率各向同性弹性体和刚性部件。
        - label: Carbon 可服务的垂直领域顶点（目标 SOM）
          value: Footwear midsoles, dental models/dentures, sports protection, and custom cycling saddles ($400M-$600M).
          detail: Carbon 已验证具备规模化商业牵引力的应用细分领域（adidas、Riddell、Fizik、牙科实验室）。
        - label: Carbon 当前平台渗透
          value: >-
            Commercial fleet install base and proprietary resin attach across certified production partners ($100M+ run
            rate).
          detail: 包括打印机订阅租赁、软件许可和专用树脂的配套销量。
