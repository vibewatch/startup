  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、计入支出与工业邻接领域
        blocks:
          - type: paragraph
            body: >-
              Carbon
              对可服务市场的定义并不是快速原型设备的泛化边界，而是以数字化聚合物连续生产替代传统注塑和聚氨酯浇注为核心。核心机会在于生产级弹性体和刚性部件：数字光合成无需硬模具成本，就能提供各向同性机械性能。计入支出包括光聚合物
              3D 打印设备订阅、专有工程树脂、自动清洗和固化硬件，以及计算晶格设计软件。相反，消费级通用塑料、大型结构性热塑性板材，以及模具摊销接近于零的高产量包装，都不在 Carbon
              的实际覆盖范围内。工业邻接领域包括选择性激光烧结、多射流熔融和数控加工，它们分别在功能原型和标准几何形状上守住既有成本优势。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
