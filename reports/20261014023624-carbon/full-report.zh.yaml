      - number: '2.4'
        title: 采用驱动因素、资本约束与资格认证瓶颈
        blocks:
          - type: paragraph
            body: >-
              Carbon 数字光合成平台的采用动能主要来自设计自由度、大规模定制能力，以及将原型周期最多压缩九成的产品开发速度。NFL 和 NFLPA
              评估中的顶级安全测试排名，也在运动防护装备领域带来持久需求，因为晶格缓冲性能无法用模切泡沫复制。不过，采用约束仍然明显。强制循环烘箱中的二次热烘焙环节不可省略，相比连续成型工艺会带来批次周期瓶颈。此外，专有光聚合物树脂每公斤成本仍是通用注塑树脂的数倍，使其大批量渗透受限于高利润容忍度或必须采用复杂几何形状的应用。
            claimRefs:
              - CM002
              - CM004
              - CM010
              - CM012
              - CM013
