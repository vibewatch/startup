      - number: '3.4'
        title: 壁垒持久性、商品化压力与替代风险
        blocks:
          - type: paragraph
            body: >-
              Carbon 的长期竞争持久性取决于能否保护专有材料化学和计算设计软件，抵御商品化。尽管 Carbon 已与 Adidas、Ford 和 Becton Dickinson
              等全球企业验证了高知名度的连续生产合作，但其估值倍数正受到增材制造结构性变化的压力。日趋成熟的光聚合物专利和更低成本的开放材料 DLP
              平台，可能侵蚀硬件订阅利润，尤其是在机械各向同性并非关键要求的牙模制造和工业原型场景。

              此外，HP MJF 和 EOS SLS 等粉末床熔融平台对刚性功能零件构成了显著压力，因为它们使用通用热塑性粉末，不需要二次化学烘箱烘焙或去除支撑结构。Carbon 最难被替代的阵地仍是弹性晶格生成：Carbon
              Design Engine 软件、双固化 EPU 树脂和连续 DLS 光学系统结合后，可以制造传统模具或粉末床方法无法实现的复杂缓冲和能量回弹结构。要守住这一优势，Carbon
              必须继续提升材料性能，同时扩大其全球伙伴网络中的第三方合同制造采用。
            claimRefs:
              - CP008
              - CP010
              - CP013
              - CP014
      - number: '3.5'
        title: 展示案例
        blocks:
          - type: callout
            title: 连续光聚合与间歇分离应力
            body: >-
              Carbon 在槽式光聚合中的首要技术壁垒，是 CLIP 技术中由氧气抑制形成的“死区”。消除槽窗处的机械剥离力后，Carbon
              能够缩短构建周期并提供各向同性聚合物性能。但工程级性能必须依赖强制循环烘箱中的二次热烘焙，因此平台的运营占地和配套要求高于独立桌面 3D 打印机。
            calloutType: insight
