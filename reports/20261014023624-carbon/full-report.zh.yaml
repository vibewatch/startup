            body: >-
              Carbon 由一支跨学科创始团队创立，成员兼具先进聚合物化学和应用物理背景，包括 Dr. Joseph M. DeSimone、Alexander Ermoshkin、Nikita Ermoshkin 和
              Edward T. Samulski。公司在不同增长阶段持续调整治理结构，并吸纳前 DuPont 董事长兼 CEO Ellen Kullman、Madrone Capital General Partner
              Greg Penner 等资深工业界人士加入董事会。目前运营领导集中在 CEO 办公室，由联合创始人 Phil DeSimone
              负责战略合作、客户部署和商业执行。这一管理结构延续了创始团队的技术连续性，也维系着全球制造供应链中的工业关系；但单一首席执行官的继任安排仍是当前尽调议题。
