              在牙科实验室和口腔健康行业也实现了可观商业产量，认证牙科实验室每周生产数百万个定制 3D 打印夹板、模型和假牙部件（CI012）。这些已经跑通的生产案例表明，Carbon
              已从快速原型跨入经常性制造产量，但企业合同条款和批量定价表仍是高度保密的商业信息。
