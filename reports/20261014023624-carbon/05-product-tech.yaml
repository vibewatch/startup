callouts:
  - calloutType: insight
    title: Continuous Printing Eliminates Layer Weakness
    body: The 20-micrometer dead zone prevents mechanical adhesion to the vat window, allowing continuous vertical motion that yields true isotropic tensile strength comparable to thermoplastic injection molding.
    claimRefs:
      - CE007
      - CE010
  - calloutType: risk
    title: Secondary Thermal Cure Dependency
    body: Dual-cure chemistry requires mandatory thermal oven baking post-wash to trigger latent epoxy or polyurethane crosslinking, introducing cycle-time latency and strict oven programming constraints.
    claimRefs:
      - CE008
      - CE014
