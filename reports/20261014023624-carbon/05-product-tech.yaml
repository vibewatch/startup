  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / Operating Component
      - Functional Role
      - Key Technical Dependency
      - Primary Operational Risk
    rows:
      - - Continuous Dead Zone Interface
        - Inhibits UV polymerization within 20 um of window to prevent part adhesion
        - Oxygen permeability of specialized PDMS vat window optics
        - Window tear or optical degradation requiring tray replacement and interrupting builds
      - - Digital UV Projection Engine
        - Projects high-resolution cross-sectional UV slices at high frame rates
        - Calibrated 4K DLP projector and optical intensity uniformity
        - Thermal drift in optical alignment causing dimensional tolerance errors
      - - Dual-Cure Material System
        - Combines initial UV shape curing with latent heat-activated epoxy/urethane crosslinking
        - Precise resin mixing, dispension control, and shelf-life stability
        - Part warping or off-gassing during forced-circulation thermal oven baking
      - - Cloud OS & Fleet Intelligence
        - Monitors printer sensors, applies OTA firmware updates, and optimizes slice files
        - Reliable outbound cloud telemetry connectivity and secure APIs
        - Production line dependency on cloud availability and proprietary data protocols
    notes: Architecture parameters sourced from Carbon DLS engineering specifications and independent manufacturing technical evaluations.
    claimRefs:
      - CE007
      - CE008
      - CE009
