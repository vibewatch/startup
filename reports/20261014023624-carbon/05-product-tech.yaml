    title: Workflow / use-case table
    columns:
      - User Job / Workflow Stage
      - Traditional Workflow
      - Carbon DLS Solution
      - Measurable Benefit
      - Technical Limitation
    rows:
      - - Functional Polymer Prototyping
        - Machining or selective laser sintering (SLS)
        - Single-build DLS with engineering resins
        - Days to delivery with 84 MPa tensile strength in EPX 82
        - Restricted build envelope requiring manual review above 4x4x6 inches
      - - Elastomeric Cushioning Production
        - Foam cutting and polyurethane injection molding
        - Computational lattice generation with EPU 46
        - 330% elongation with tunable localized compression response
        - Dual-cure thermal oven bake required to finalize polymer crosslinking
      - - Dental Appliance Fabrication
        - Manual plaster casting and vacuum thermoforming
        - Direct digital light synthesis on DB/M2d platforms
        - Sub-100 um feature resolution and isotropic mechanical integrity
        - High consumable resin cost compared to bulk acrylic dental supplies
      - - Low-Volume End-Use Production
        - Expensive hard tooling and steel injection molds
        - Tool-less additive manufacturing direct from CAD
        - Zero upfront tooling cost and rapid design modification
        - Cost-effective production envelope primarily concentrated in pocket-sized parts
