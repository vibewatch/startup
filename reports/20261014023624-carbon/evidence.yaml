    diligencePath: Request customer concentration revenue schedule by customer account and resin volume under confidential diligence.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: >-
