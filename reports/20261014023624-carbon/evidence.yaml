evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: 2025 Financing Terms and Cap Table
    missingEvidence: >-
      Official pricing, valuation per share, liquidation preference seniority, and cap table breakdown for the November
      2025 $60 million financing round.
    whyItMatters: >-
      Without current pricing or share structure, investors cannot determine whether the round was an up-round, flat
      round, or structured down-round relative to the 2019 $2.4B valuation anchor.
    diligencePath: >-
      Request the latest certificate of incorporation, series term sheets, and 409A valuation summary during formal
      investor diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: Executive Leadership Roster and Office of the CEO Consolidation
    missingEvidence: >-
      Comprehensive current executive roster and clarification on whether the Office of the CEO structure has
      consolidated into a unitary Chief Executive Officer title.
    whyItMatters: >-
      Governance structure and reporting lines affect operational decision velocity, executive accountability, and
      key-person risk.
    diligencePath: Review organizational governance documents, board minutes, and management org charts from corporate disclosures.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: market-sizing-transparency
    missingEvidence: >-
      Independent third-party econometric sizing validating the exact production-grade photopolymer additive
      manufacturing addressable market and unit volume ceilings across dental, automotive, and consumer footwear.
    whyItMatters: >-
      Public sizing figures conflate low-cost prototyping SLA hardware with high-throughput production DLS polymer
      systems, obscuring Carbon's addressable slice of end-use part spend.
    diligencePath: >-
      Request customer resin consumption figures and machine utilization logs under NDA from production network partners
      to derive bottom-up SOM.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: commodity-dlp-pricing-and-open-materials
    missingEvidence: >-
      Direct third-party head-to-head operational cost benchmarks and resin pricing schedules comparing Carbon DLS
      against open-architecture industrial DLP systems.
    whyItMatters: >-
      Assessing the long-term durability of Carbon's proprietary materials margin requires audited pricing and resin
      consumption data across competing hardware platforms.
    diligencePath: >-
      Request customer resin invoice histories and cross-platform production cost audits under NDA during technical due
      diligence.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Audited financial statements confirming current revenue run-rate, ARR, gross margin percentage, and cash burn
      rate.
    whyItMatters: >-
      Without audited revenue and margin disclosures, valuation multiples and unit-level gross profitability cannot be
      rigorously underwritten.
    diligencePath: >-
      Request confidential disclosure of GAAP financial statements and trailing twelve-month management accounts under
      NDA.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Detailed breakdown of printer lease renewal rates, resin attach volume per installed machine, and gross margins on
      proprietary resins versus hardware subscriptions.
    whyItMatters: >-
      High consumable resin attach and high gross margins on recurring resin sales are essential to justify capital
      investment given high hardware depreciation.
    diligencePath: >-
      Request cohort-level printer utilization and consumable resin consumption data across industrial, dental, and
      consumer accounts.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: technical-risks
    missingEvidence: >-
      Independent audited data on printer operating utilization, consumable resin attach rates per installed printer,
      and hardware maintenance frequency across production deployments.
    whyItMatters: >-
      Without empirical telemetry on fleet duty cycles and resin consumption, long-term machine productivity and
      consumable margin durability cannot be validated.
    diligencePath: >-
      Request customer fleet operating logs, historical resin reorder frequency by machine serial number, and mean time
      between failure (MTBF) warranty records.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: Customer retention and net revenue retention
    missingEvidence: >-
      Audited cohort retention rates, net revenue retention (NRR), gross revenue retention (GRR), and churn figures for
      Carbon's printer subscription fleet.
    whyItMatters: >-
      Without retention and renewal data, investors cannot verify whether printer installations generate durable
      recurring software and resin revenue or experience churn after initial pilot runs.
    diligencePath: >-
      Request confidential historical cohort retention schedules, subscription renewal rates, and resin consumption
      trends by customer cohort during management diligence.
    relatedQuestionRefs:
      - QU004
  - type: enumeration-incomplete
    severity: material
    topic: Named customer proof production verification
    missingEvidence: >-
      Comprehensive audit of all commercial customer accounts categorized by annual resin consumption and production
      versus prototype status.
    whyItMatters: >-
      Public case studies highlight successful high-profile marquee brand collaborations but obscure the proportion of
      customers that fail to advance beyond initial prototyping into recurring volume production.
    diligencePath: >-
      Audit Carbon's top 50 customer accounts by revenue, examining contract duration, printer utilization, and resin
      order frequency.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: Customer concentration in athletic footwear
    missingEvidence: >-
      Breakdown of annual revenue and resin volume derived from top enterprise accounts, particularly Adidas and
      Specialized.
    whyItMatters: >-
      High customer concentration in athletic footwear and sporting goods exposes Carbon to severe top-line volatility
      if lead partners adjust inventory or shift production technologies.
    diligencePath: >-
      Obtain customer concentration schedules showing percentage of annual revenue and resin attach rates accounted for
      by the top 5 and top 10 customers.
    relatedQuestionRefs:
      - QU005
      - QU009
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Audited percentage breakdown of total consumables resin revenue generated by top-5 customers (Adidas, Riddell,
      Specialized, etc.).
    whyItMatters: >-
