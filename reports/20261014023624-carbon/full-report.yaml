    title: Addressable Digital Manufacturing Sizing Layers
    type: pyramid
    summary: >-
      Hierarchical progression from broad industrial polymer manufacturing down to Carbon's qualified production DLS
      serviceable market.
    approximationNotes: >-
      Values illustrate industry boundary constraints from macro polymer manufacturing to DLS-qualified end-use part
      production.
