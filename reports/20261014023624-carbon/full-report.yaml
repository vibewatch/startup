  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Production Hardware Platforms
        blocks:
          - type: paragraph
            body: >-
              Carbon commercializes an integrated digital manufacturing platform centered on its proprietary Digital
              Light Synthesis (DLS) technology. Rather than positioning its systems solely for rapid prototyping, Carbon
              designs hardware and software workflows specifically for end-use industrial and consumer production. The
              company's hardware portfolio spans multiple generations of continuous photopolymer printers, anchored by
              the mid-volume M-Series (including the M1, M2, and current 4K-enabled M3 and M3 Max systems) and the
              large-format L1 platform. The M3 series introduces closed-loop control and infrared resin heating,
              expanding throughput up to 2.5 times over previous generations. The L1 system expands the build envelope
              to 400 mm by 250 mm by 460 mm, providing five times the build area of earlier machines for serial
              production at enterprises like Adidas and Ford. Hardware deployments are supported by peripheral
              automation, notably the Smart Part Washer, which standardizes resin removal and cuts post-print washing
              time by 50 to 75 percent.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
      - number: '5.2'
        title: Digital Light Synthesis and Continuous Liquid Interface Architecture
        blocks:
          - type: paragraph
            body: >-
              The technical foundation of Carbon's platform is Continuous Liquid Interface Production (CLIP), which
              differentiates DLS from conventional layer-by-layer stereolithography and digital light processing (DLP).
              In traditional vat photopolymerization, each newly cured layer adheres directly to the bottom window of
              the vat, requiring mechanical separation cycles that introduce stress, slow print speeds, and leave
              visible layer boundaries. Carbon overcomes this constraint using an oxygen-permeable window optic that
              establishes a continuous, uncured dead zone approximately 20 micrometers thick. Because ambient oxygen
              inhibits UV-mediated photopolymerization, resin adjacent to the window remains liquid while UV light
              projected from below cures the part above the dead zone. As the build platform continuously ascends along
              the Z-axis, fresh resin flows beneath without interruption. This continuous process produces solid,
              mechanically isotropic components with smooth surface finishes and structural integrity identical across
              all spatial axes.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE007
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE010
              - CE011
              - CE012
      - number: '5.3'
        title: Dual-Cure Material Chemistry and Post-Processing Operations
        blocks:
          - type: paragraph
            body: >-
              Achieving injection-molding mechanical performance requires more than conventional single-cure
              photopolymers, which typically exhibit brittleness and poor environmental durability over time. Carbon
              addresses this challenge through proprietary dual-cure liquid resins. During the initial DLS printing
              stage, digital UV light activates light-sensitive photoinitiators, solidifying the part into an
              intermediate green state that defines its geometry. Following automated washing in the Smart Part Washer
              to clear uncured surface resin, components undergo a mandatory secondary thermal cure in a
              forced-circulation oven. This thermal baking cycle activates latent chemical agents—such as dormant
              epoxies or polyurethanes—forming an interconnected molecular matrix that imparts high tensile strength,
              impact toughness, and thermal resistance. Production resins like EPX 82 achieve 84 MPa tensile strength
              comparable to glass-filled thermoplastics, while elastomeric polyurethanes like EPU 46 deliver 330 percent
              elongation for high-resilience lattice cushioning in athletic gear and protective equipment.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE005
              - CE006
      - number: '5.4'
        title: Operating Architecture, Integration, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              Carbon complements its hardware and materials with Carbon Design Engine software, an algorithmic
              generative design suite that automates the creation of conformal, performance-oriented lattice structures.
              The software enables engineers to tune mechanical stiffness and weight reduction at millimeter resolution,
              creating products that cannot be manufactured through traditional injection molding or subtractive CNC
              milling. However, diligence highlights several material technical and economic boundaries. DLS
              manufacturing economics are highly sensitive to part geometry; production cost advantages diminish rapidly
              for components larger than standard pocket-sized dimensions due to consumable resin pricing and thermal
              cycle times. Furthermore, the operational reliance on specialized oxygen-permeable window films creates
              maintenance dependencies, where window degradation or mechanical tears halt production. Finally, mandatory
              secondary thermal baking introduces cycle-time latency, batch-scheduling constraints, and thermal
              distortion risks that require rigorous empirical validation across production runs.
            claimRefs:
              - CE009
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE007
              - CE008
              - CE009
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Continuous Printing Eliminates Layer Weakness
            body: >-
              The 20-micrometer dead zone prevents mechanical adhesion to the vat window, allowing continuous vertical
              motion that yields true isotropic tensile strength comparable to thermoplastic injection molding.
            calloutType: insight
            claimRefs:
              - CE007
              - CE010
          - type: callout
            title: Secondary Thermal Cure Dependency
            body: >-
              Dual-cure chemistry requires mandatory thermal oven baking post-wash to trigger latent epoxy or
              polyurethane crosslinking, introducing cycle-time latency and strict oven programming constraints.
            calloutType: risk
            claimRefs:
              - CE008
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation & Multi-Vertical Commercial Footprint
        blocks:
          - type: paragraph
            body: >-
              Carbon commercializes its Digital Light Synthesis (DLS) additive manufacturing platform across four
              distinct customer segments: consumer performance products, automotive and industrial manufacturing,
              medical devices and clinical dental, and contract service bureaus. Enterprise buyers range from brand R&D
              directors seeking differentiated lattice cushioning to manufacturing engineers attempting to eliminate
              expensive injection tooling for short bridge production runs. Disclosed corporate references demonstrate
              that hundreds of global enterprises have engaged with the Carbon platform across prototyping and end-use
              production. High-profile brand deployments in athletic footwear, cycling saddles, and protective helmets
              highlight Carbon's ability to deliver functional elastomeric lattices that cannot be fabricated via
              conventional manufacturing methods. Meanwhile, industrial equipment manufacturers utilize rigid
              polyurethane resins such as RPU 70 for functional components like machinery housings and push-in rivets.
              In the healthcare sector, specialized dental laboratories and medical device companies utilize Carbon
              hardware and biocompatible photopolymer resins for patient-specific aligner models and custom surgical
              instrumentation. Despite this multi-vertical reach, customer adoption remains heavily bifurcated between
              high-volume consumer flagship lines and lower-volume bridge manufacturing applications.
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU009
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
