        title: Commercial Scaling, Customer Proof, and Structural Constraints
        blocks:
          - type: paragraph
            body: >-
              Carbon has established verifiable production-scale adoption through marquee enterprise relationships
              across consumer, medical, and industrial sectors. In athletic footwear, Carbon multi-year partnership with
