  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries, Included Spend, and Industrial Adjacencies
        blocks:
          - type: paragraph
            body: >-
              Carbon defines its addressable market not by the generic boundaries of rapid prototyping equipment, but by
              the displacement of conventional injection molding and urethane casting in serial polymer manufacturing.
              The core market opportunity centers on production-grade elastomeric and rigid components where digital
              light synthesis delivers isotropic mechanical properties without hard tooling expenses. Included spend
              spans photopolymer 3D printing equipment subscriptions, proprietary engineering resins, automated wash and
              cure hardware, and computational lattice design software. Conversely, commodity consumer plastics, large
              structural thermoplastic sheets, and high-volume packaging where tooling amortization approaches zero
              remain excluded from Carbon's operational footprint. Industrial adjacencies include selective laser
              sintering, multi-jet fusion, and computer numerical control machining, each defending entrenched cost
              positions in functional prototyping and standard geometries.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
