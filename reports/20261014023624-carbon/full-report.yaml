      - number: '2.4'
        title: Adoption Drivers, Capital Constraints, and Qualification Bottlenecks
        blocks:
          - type: paragraph
            body: >-
              Adoption momentum for Carbon's digital light synthesis platform is primarily driven by design freedom,
              mass customization capabilities, and compressed product development schedules that cut prototyping cycles
              by up to ninety percent. Furthermore, top safety testing rankings in NFL and NFLPA evaluations have
              created durable demand in protective sporting equipment where lattice damping cannot be replicated by
              die-cut foam. Nevertheless, substantial adoption constraints persist. The necessity of a secondary thermal
              baking stage in forced-circulation ovens introduces batch cycle time bottlenecks compared to continuous
              molding processes. Additionally, proprietary photopolymer resin costs remain multiple times higher per
              kilogram than commodity injection-molded resins, restricting high-volume penetration to applications with
              high margin tolerance or mandated geometric complexity.
