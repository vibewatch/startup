      - number: '6.3'
        title: Retention Durability, Partner Network Dynamics & Channel Concentration
        blocks:
          - type: paragraph
            body: >-
              Carbon's go-to-market architecture relies heavily on a dual-track model combining direct on-premise
              hardware subscriptions with an authorized Production Network of contract manufacturing bureaus. Service
              bureaus like Aprios and Agile Manufacturing act as critical customer acquisition channels, providing
              accessible entry points for companies that lack the capital or volume to justify dedicated on-site printer
              leases. Customers utilize cloud tools like Carbon Design Engine to generate conformal lattices directly
              from CAD geometries, bypassing manual strut modeling and accelerating transition into physical production.
              However, this partner-mediated model introduces significant procurement friction and channel concentration
              vulnerabilities. Partner-level bottlenecks and hardware access constraints have historically forced
              service bureaus like Sculpteo to establish customer waiting lists for Carbon printer time, actively
              steering impatient accounts toward competing additive technologies such as Polyjet resins. Furthermore,
              because Carbon's financial model depends on recurring photopolymer resin pull-through alongside hardware
              subscription fees, the company faces substantial revenue concentration around a handful of marquee
              consumer accounts like Adidas. If major footwear or cycling programs slow production schedules or
              renegotiate resin supply terms, overall platform economics face immediate downward pressure.
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU006
              - CU012
      - number: '6.4'
        title: Customer Diligence Assessment & Strategic Evidence Gaps
        blocks:
          - type: paragraph
            body: >-
              From an investment diligence perspective, Carbon has established genuine technical validation and
              high-volume manufacturing credibility that outclasses most venture-backed additive manufacturing peers.
              The production durability of its isotropic polymer parts is corroborated by rigorous industrial testing
              and sustained consumer product lines across multi-year commercial relationships. Nevertheless, critical
              underwriting gaps remain unresolved in the company's customer disclosure. Public materials do not disclose
              audited retention metrics, net revenue retention (NRR), gross revenue retention (GRR), or customer cohort
              churn. It remains impossible to verify from public records how many of the 'hundreds of global
              organizations' cited in corporate marketing represent active recurring subscription customers versus
              legacy trial accounts that completed one-off prototyping runs. Additionally, the exact economics of resin
              attach rates, machine utilization hours, and gross margins per customer tier remain closely held private
              data. Prospective investors must condition valuation underwriting on direct access to customer cohort
              schedules, examining whether printer lease renewals and consumable resin orders expand predictably beyond
              the core athletic footwear and sporting goods anchor accounts.
            claimRefs:
              - CU001
              - CU004
              - CU012
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Production Scaling Friction and Channel Capacity Constraints
            body: >-
              While Carbon's Production Network allows enterprises to bypass direct hardware leasing costs, partner
              waitlists and specialized operational requirements create friction for rapid scaling. When production
              bureaus face allocation backlogs or complex material changeovers, customers with time-sensitive release
              schedules risk being directed toward rival additive platforms or conventional tooling.
            calloutType: risk
            claimRefs:
              - CU006
              - CU012
          - type: callout
            title: Strategic Alignment via Customer Equity Backing
            body: >-
              The participation of major commercial customers such as Adidas in Carbon's financing rounds provides
              critical thesis validation and guarantees minimum production volume commitments. However, this dynamic
              also concentrates commercial risk around marquee athletic footwear lines, leaving broader industrial
              adoption dependent on lowering photopolymer resin costs.
            calloutType: insight
            claimRefs:
              - CU002
              - CU003
              - CU004
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Executive Risk Taxonomy and Capital Structure Exposure
        blocks:
          - type: paragraph
            body: >-
              Evaluating Carbon's risk profile requires analyzing the convergence of macroeconomic sentiment across
              additive manufacturing (AM), capital structure durability, and operating unit economics. Co-founder Phil
              DeSimone acknowledged that failed mergers and acquisitions across the additive manufacturing sector
              throughout 2023 severely impaired investor confidence, characterizing the external perception of the
              sector as chaotic and noting the imperative to rebuild financial trust. Although Carbon secured a $60
              million financing round in late 2025 backed by existing insiders including Sequoia Capital and strategic
              customer Adidas, the company remains private and historically anchored to a peak $2.4 billion valuation
              established in 2019. Management has targeted an initial public offering (IPO) within a 12 to 24 month
              window predicated on maintaining cash-flow breakeven operations. However, public markets have demonstrated
              severe skepticism toward capital-intensive hardware-as-a-service and proprietary additive manufacturing
              business models, leaving Carbon exposed to substantial down-round or multiple compression risk if positive
              cash flows are not sustained.
            claimRefs:
              - CR001
