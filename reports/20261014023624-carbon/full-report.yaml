  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      End-to-end customer adoption progression from initial algorithmic design prototyping to full-fleet production and
      resin replenishment.
    data:
      items:
        - label: Design & Generative Latticing
          stage: 'Stage 1: Exploration'
          description: Engineering teams evaluate part geometry and generate conformal lattices using Carbon Design Engine.
          touchpoints:
            - CAD model import
            - Cloud software evaluation
            - Lattice mechanical tuning
        - label: Prototyping & Material Screening
          stage: 'Stage 2: Material Selection'
          description: >-
            Users print test components using engineering resins such as RPU 70, EPU 40, or EPX 82 to assess surface
            finish and tolerances.
          touchpoints:
            - Material sample kits
            - Prototype part fabrication
            - Mechanical pull-testing
        - label: Application Validation & Process Tuning
          stage: 'Stage 3: Validation'
          description: >-
            Customers utilize force feedback calibration and secondary thermal baking to validate part isotropy and
            repeatability.
          touchpoints:
            - Secondary cure oven profiling
            - Print plan adjustments
            - Dimensional tolerance verification
        - label: Bureau Bridge Production
          stage: 'Stage 4: Low-Volume Production'
          description: >-
            Customers route initial production runs (1 to 50,000 units) through certified Production Network partners
            like Agile Manufacturing and Aprios.
          touchpoints:
            - Production partner RFQ
            - Bridge manufacturing runs
            - Tooling elimination assessment
        - label: In-House Fleet Lease Deployment
          stage: 'Stage 5: Fleet Installation'
          description: >-
            High-volume customers deploy dedicated M-series or L1 printers under annual subscription leases with Smart
            Part Washer automation.
          touchpoints:
            - On-premise machine lease
            - Facility solvent safety setup
            - Operator training certification
        - label: Production Resupply & Line Expansion
          stage: 'Stage 6: Scale & Replenishment'
          description: >-
            Ongoing recurring photopolymer resin replenishment, software subscription renewals, and SKU line expansion
            across adjacent product families.
          touchpoints:
            - Automated resin ordering
            - Fleet software telemetry
            - Multi-part SKU expansion
    approximationNotes: >-
      Adoption journey stages synthesized from partner workflows, published technical documentation, and commercial
      equipment lease structures.
    claimRefs:
      - CU006
      - CU010
      - CU011
