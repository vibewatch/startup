  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Evidence & Basis
      - Decision Implication
    rows:
      - - Recommendation
        - research-more
        - Stale $2.4B valuation anchor vs $60M insider bridge
        - Maintain holding pattern; do not underwrite at peak mark
      - - Confidence
        - medium
        - Verified $60M capital injection and partner proof against opaque operating metrics
        - Sufficient for risk posture but incomplete for capital allocation
      - - Risk Rating
        - high
        - Liquidation preference overhang, customer concentration, and AM multiple compression
        - Require downside protection and strict liquidation seniority in any structure
      - - Valuation Stance
        - stretched
        - Current estimated intrinsic value ($750M-$1.1B) sits far below $2.4B historical mark
        - Demand marked-down entry valuation reflecting prevailing market multiples
    notes: >-
      Summary synthesis of investment decision parameters derived from capital structure analysis and diligence
      evidence.
    claimRefs:
      - CV001
      - CV003
      - CV008
      - CV014
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Investment Thesis
      - Anti-Thesis Counterpoint
      - View-Breaker Trigger
    rows:
      - - Technology & IP
        - Proprietary DLS/CLIP process delivers isotropic functional parts at true mass production throughput
        - Secondary thermal bake cycle introduces shrinkage and process complexity across bureaus
        - Independent benchmark demonstrating open-vat SLA/DLP matching mechanical properties at lower cost
      - - Commercial Ecosystem
        - Over 35 certified global production partners and marquee consumer brands validate production adoption
        - High materials and printer pricing create vendor lock-in and limit mid-market penetration
        - Contract defection or insourcing by anchor partners such as Adidas or Riddell
      - - Capital & Runway
        - Recent $60M round backed by Sequoia and Silver Lake bridges company toward cash-flow positive operations
        - Insider-dominated extension signals lack of external growth capital appetite at current valuation
        - Failure to reach self-sustaining operating cash flows within 12-18 months
      - - Market Multiples
        - Leading position in production-scale additive manufacturing commands premium strategic platform value
        - Public additive manufacturing peers trade at compressed 1x-2.5x revenue multiples
        - Public filing or secondary transaction establishing equity mark below $600M
    notes: Structured contrast of key investment arguments and disconfirming operational triggers.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV008
      - CV011
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating Assumptions
      - Valuation / Return Logic
      - Key Risks & Failure Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - Rapid expansion of dental and medical resins; Adidas Climacool scales; cash-flow positive in 2026
        - $1.8B-$2.4B valuation recovery; path to viable public listing at 4x-5x revenue multiple
        - Execution slips in dental automation; broader industrial capex slowdown
        - 20%
      - - Base Case
        - Steady production partner utilization; modest revenue growth; achieves cash-flow breakeven
        - $750M-$1.1B intrinsic valuation; realistic M&A or repriced growth round at 2.0x-2.5x multiple
        - Persistent AM market discount; customer concentration friction; slow hardware upgrades
        - 55%
      - - Bear Case
        - Anchor footwear/sports demand softens; elevated cash burn continues; down-round or recapitalized
        - $350M-$500M distressed liquidation or dilutive recapitalization with severe preference overhang
        - Junior common equity wipeout; service bureau insolvencies; proprietary resin price resistance
        - 25%
    notes: >-
      Scenario model estimates based on historical capital raised, insider bridge financing, and comparative market
      multiples.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV008
      - CV010
      - CV013
