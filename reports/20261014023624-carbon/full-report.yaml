        - Midsole platform obsolescence, volume cutback, or vendor dual-sourcing
        - Critical
        - Moderate (diversification into dental and industrial saddles)
        - High resin revenue vulnerability if flagship volume drops
      - - Consumables Single-Sourcing
        - Carbon Proprietary Chemical Supply
        - Customers restricted strictly to Carbon-manufactured resins
        - Supply chain interruption at chemical blending facility or raw monomer allocation failure
        - High
        - Early (captive closed-loop distribution model)
        - Customers unable to substitute third-party photopolymer materials
      - - Production Network Partners
        - Service bureaus (Fast Radius, SyBridge, ERPRO Group)
        - Substantial portion of installed machine base operated by external bureaus
        - Bureau insolvency, commercial restructuring, or migration to competing open resin platforms
        - High
        - Moderate (direct enterprise leasing and co-marketing agreements)
        - Fleet utilization compression and secondary printer market overhang
