      - number: '7.2'
        title: Operational, Yield, and Post-Processing Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              At the core of Carbon's hardware and process workflow is Digital Light Synthesis (DLS), governed by
              Continuous Liquid Interface Production (CLIP). While CLIP avoids mechanical peel forces by maintaining a
              thin oxygenated dead zone directly above the cassette window, the physical dynamics of printing introduce
              severe operational failure modes. During the pump-up stage of each layer slice, strong suction forces act
              against the build platform, pulling green-state parts away from the platform and causing under-adhesion or
              part detachment, particularly for large cross sections, asymmetrical designs, or pliable elastomeric
              lattices. Furthermore, unvented volumes in CAD geometries generate localized pressure vacuums that induce
              blowouts, fringing, vacuum lines, and resin starvation. Thermal accumulation during rapid
              photopolymerization creates exothermic gradients that force software print plans to slow build speeds for
              solid cross sections. Crucially, engineering-grade mechanical properties require extensive secondary
              post-processing: two-part resins mandate prolonged baking cycles in forced-circulation ovens, introducing
              0.3% or greater shrinkage from monomer mass loss and thermal contraction, while one-part resins require
              secondary ultraviolet exposure. In production environments across service bureaus and internal enterprise
              factories, deviations in wash cleanliness, oven uniformity, or resin dispensing directly cause out-of-spec
              batches and elevated scrap rates.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.3'
        title: Ecosystem Lock-In, Materials Pricing, and Commercial Concentration
        blocks:
          - type: paragraph
            body: >-
              Commercial adoption of Carbon's manufacturing platform is constrained by business model lock-in and
              partner dependencies. Independent manufacturing network analyses highlight two fundamental structural
              drawbacks: Carbon's hardware and iterative prototyping remain pricey compared to conventional tooling, and
              customers are strictly restricted to proprietary resins formulated and supplied exclusively by Carbon.
              This closed consumables model exposes enterprise customers and service bureaus such as Fast Radius,
              SyBridge Technologies, and ERPRO Group to sole-source resin supply risk, material pricing power, and resin
              margin inflation. Simultaneously, Carbon's marquee production volumes exhibit severe customer
              concentration around flagship consumer collaborations, most notably Adidas for lattice footwear midsoles,
              alongside specialized automotive and dental accounts. A slowdown in end-market consumer demand, design
              transitions away from lattice midsoles, or margin pressure among contracted service bureaus would directly
              undermine Carbon's consumable resin utilization rates and subscription revenues.
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Closed-Resin Double-Edged Sword
            body: >-
              While selling proprietary resins provides Carbon with high-margin recurring consumables revenue, it acts
              as a significant adoption barrier for cost-conscious manufacturers. Independent bureaus report that
              Carbon's closed material ecosystem makes iterative prototyping and high-volume part substitution expensive
              compared to open-platform SLA and DLP competitors.
            calloutType: risk
            claimRefs:
              - CR012
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Strategic Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Underwriting an investment in Carbon requires weighing a compelling core technology against severe
              commercial and market headwinds. The positive thesis centers on Carbon's proprietary Digital Light
              Synthesis (DLS) platform, powered by Continuous Liquid Interface Production (CLIP), which eliminates
              mechanical peel forces through an oxygenated dead zone to achieve true production-scale throughput. Unlike
              conventional prototyping 3D printers, Carbon produces isotropic, end-use elastomeric and rigid
              polyurethane components adopted across marquee consumer programs, notably Adidas footwear midsoles and
              Riddell athletic protection helmets. Furthermore, the global Carbon Production Network (CPN) encompasses
              more than 35 verified production facilities, creating an outsourced manufacturing ecosystem that lowers
              capital hurdles for enterprise customers. Conversely, the anti-thesis highlights structural commercial
              friction: Carbon's closed material strategy forces customers into expensive proprietary resins, limiting
              mass-market substitution. Additionally, heavy revenue concentration around flagship footwear accounts and
              secondary cure thermal shrinkage complexities create operational dependencies that threaten recurring
              consumable utilization.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV008
              - CV011
      - number: '8.2'
        title: Financing History, Valuation Anchor, and Preference Overhang
        blocks:
          - type: paragraph
            body: >-
              Carbon's capital structure reflects a mature, late-stage venture profile characterized by substantial
              historical capital absorption and an outdated valuation anchor. In November 2025, the company secured a
              $60 million financing round supported entirely by existing insider sponsors, including Sequoia Capital,
              Silver Lake, Baillie Gifford, Madrone, and Adidas. While management framed the round as growth capital to
              expand production capacity and reach sustained cash-flow positive operations, insider participation
              without new external lead investors strongly signals defensive runway extension rather than an arms-length
              valuation step-up. The financing follows a $260 million Series E round completed in 2019, bringing
              lifetime raised equity capital to over $680 million. The market continues to reference Carbon's peak 2019
              headline valuation of $2.4 billion, yet this figure was established during a peak macroeconomic cycle for
              additive manufacturing. With private financials strictly undisclosed, carrying a $2.4 billion anchor
              against only $60 million in fresh capital creates significant liquidation preference overhang and
              substantial downside risk for junior and common shareholders.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV009
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV014
      - number: '8.3'
        title: Valuation Scenarios and Market Multiples
        blocks:
          - type: paragraph
            body: >-
              Developing an objective valuation framework for Carbon requires triangulating historical venture marks
              against current public market multiples and scenario-based operating paths. Public additive manufacturing
              comparables, including 3D Systems, Stratasys, and Desktop Metal, have experienced steep equity repricing,
              with enterprise value to trailing revenue multiples contracting from historical highs above 5.0x to
              prevailing bands between 1.0x and 2.5x. Under a base-case scenario assuming Carbon generates stabilized
              annualized revenues between $350 million and $450 million with modest operating profitability, an
              appropriate 2.0x to 2.5x revenue multiple yields an estimated intrinsic valuation range of $750 million to
              $1.1 billion. In an optimistic bull case where dental resins and high-volume consumer footwear accelerate,
              intrinsic valuation could recover toward $1.8 billion to $2.4 billion ahead of a public listing.
              Conversely, a bear scenario involving footwear demand attrition and renewed cash burn would trigger a
              dilutive recapitalization or distressed sale at $350 million to $500 million, largely wiping out junior
              equity holders.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV010
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV010
              - CV013
      - number: '8.4'
        title: Recommendation Framework and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Based on the synthesis of technological differentiation, capital structure maturity, and acute valuation
              opacity, our final recommendation for Carbon is research-more with medium confidence, a high risk rating,
              and a stretched valuation stance. While Carbon possesses verified production-scale hardware and blue-chip
              commercial relationships, underwriting growth capital or secondary shares at or near the $2.4 billion
              historical anchor would violate fundamental valuation discipline. The decision chain mandates that capital
              allocators refrain from underwriting equity until critical private data is unlocked. Prior to considering
              any investment, diligence teams must execute three non-negotiable verification steps: first, inspect the
              audited GAAP capitalization table to evaluate senior liquidation preference multiples and participation
              covenants; second, review granular financial statements to confirm trailing subscription ARR, resin gross
              margins, and actual monthly cash burn; and third, analyze customer cohort renewal tables to verify that
              anchor accounts are expanding rather than plateauing.
            claimRefs:
              - CV001
              - CV008
              - CV012
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV008
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-More Stance Dictated by Valuation Opacity
            body: >-
              While Carbon demonstrates genuine production-scale additive manufacturing capabilities and tier-one
              investor support, committing capital at or near its $2.4B historical valuation anchor without verified
              revenue, gross margins, and liquidation preference terms represents unacceptable underwriting risk.
              Investors should maintain a disciplined research-more posture until full financial statements and unit
              economics are audited.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV014
          - type: callout
            title: Downside Vulnerability from AM Multiple Compression
            body: >-
              Public additive manufacturing peers have experienced severe equity derating following macroeconomic
              headwinds and failed industry consolidations. If Carbon is forced to pursue a liquidity event or external
              growth round in the current environment, it faces substantial multiple compression and liquidation
              preference overhang that could heavily dilute common and early preferred shareholders.
            calloutType: risk
            claimRefs:
              - CV002
              - CV008
              - CV010
