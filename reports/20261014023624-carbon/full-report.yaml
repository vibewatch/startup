        title: 'Market Sizing Lenses: Global Polymer Manufacturing to Digital Light Synthesis'
        blocks:
          - type: paragraph
            body: >-
              Evaluating Carbon's total addressable market requires decoupling top-down additive equipment projections
              from addressable serial polymer part manufacturing. While global industrial polymer fabrication represents
              hundreds of billions in annual spend, additive manufacturing represents roughly fifteen to twenty billion,
              with photopolymer production systems comprising a three to five billion serviceable slice. Within this
              boundary, Carbon's addressable opportunity concentrates in specialized verticals where functional lattices
              and rapid design cycles justify premium photopolymer resin costs. The company has demonstrated commercial
              scale in athletic footwear through millions of components produced with adidas, dental manufacturing
              producing millions of parts weekly, and sports protective gear with leading helmet manufacturers. However,
              converting these flagship wins into broader obtainable market expansion depends on customer willingness to
              absorb machine lease commitments and proprietary resin premiums over conventional thermoplastic pellets.
