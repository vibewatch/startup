chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding, and Foundational Technology
        blocks:
          - type: paragraph
            body: >-
              Founded in 2013 and headquartered in Redwood City, California, Carbon, Inc. is a late-stage digital
              manufacturing enterprise that pioneered Continuous Liquid Interface Production (CLIP) to commercialize
              Digital Light Synthesis (DLS). Unlike traditional layer-by-layer stereolithography or fused deposition
              modeling, Carbon proprietary process balances ultraviolet digital light projection with oxygen-permeable
              optics to maintain an uncured liquid dead zone above the build window. This continuous photochemical
              interface eliminates mechanical peeling forces and enables high-speed fabrication of isotropic polymeric
              components with injection-molding surface quality. The company operates across 14 countries, delivering an
              integrated hardware, software, and materials platform designed to shift industrial additive manufacturing
              from rapid prototyping into high-throughput production lines.
            claimRefs:
              - CO001
              - CO002
