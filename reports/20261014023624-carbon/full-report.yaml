      - number: '6.2'
        title: Adoption Trajectory & Named Enterprise Production Proof
        blocks:
          - type: paragraph
            body: >-
              Evaluating Carbon's true commercial traction requires distinguishing early exploratory prototypes from
              recurring production deployments at scale. Verifiable production proof is strongest in consumer athletic
              and sporting goods, where partnerships with global brands including adidas, Specialized, and fizik have
              delivered millions of end-use latticed parts to market. Adidas stands out not merely as Carbon's most
              visible customer for its Futurecraft 4D midsoles, but also as a direct equity investor participating in
              Carbon's $60 million growth round in November 2025. In the automotive vertical, Ford Motor Company has
              deployed Carbon DLS technology for functional service parts and interior components, allowing rapid design
              iterations without the lead times of hardened tooling. Similarly, office furniture manufacturer Steelcase
              partnered with service bureau Fast Radius to commercialize a customized high-end office chair, cutting
              product development cycle time by 90%. Furthermore, athletic protection manufacturer VICIS co-developed
              impact-absorbing latticed helmet padding that achieved top safety ratings. The installation base is
              anchored by large contract production bureaus such as Fast Radius, which operates North America's largest
              public install-base of Carbon equipment, and Agile Manufacturing, which supports batch runs up to 50,000
              isotropic units. To bridge the qualification gap between prototyping and continuous factory production,
              Carbon introduced force feedback technology in M3 and L1 generation printers, dynamically measuring
              suction forces to stabilize yields and reduce print defects across customer fleets.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU007
              - CU008
