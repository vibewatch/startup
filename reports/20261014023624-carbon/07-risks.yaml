chapter:
  number: 7
  title: "Risks"
  summary: "Carbon faces pronounced macro, operational, and customer concentration risks as it attempts to bridge to sustained cash-flow breakeven and an anticipated public listing. While its proprietary Digital Light Synthesis (DLS) photopolymerization technology offers distinct isotropic mechanical properties and high throughput, customer adoption remains exposed to high materials and machine pricing, post-processing secondary cure complexities, and dependence on anchor production partners."
sections:
  - id: "risk-taxonomy-overview"
    title: "Executive Risk Taxonomy and Capital Structure Exposure"
    body: "Evaluating Carbon's risk profile requires analyzing the convergence of macroeconomic sentiment across additive manufacturing (AM), capital structure durability, and operating unit economics. Co-founder Phil DeSimone acknowledged that failed mergers and acquisitions across the additive manufacturing sector throughout 2023 severely impaired investor confidence, characterizing the external perception of the sector as chaotic and noting the imperative to rebuild financial trust. Although Carbon secured a $60 million financing round in late 2025 backed by existing insiders including Sequoia Capital and strategic customer Adidas, the company remains private and historically anchored to a peak $2.4 billion valuation established in 2019. Management has targeted an initial public offering (IPO) within a 12 to 24 month window predicated on maintaining cash-flow breakeven operations. However, public markets have demonstrated severe skepticism toward capital-intensive hardware-as-a-service and proprietary additive manufacturing business models, leaving Carbon exposed to substantial down-round or multiple compression risk if positive cash flows are not sustained."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
    tableRefs:
      - "TR001"
    figureRefs:
      - "FR001"
  - id: "operational-technology-failure-modes"
    title: "Operational, Yield, and Post-Processing Vulnerabilities"
    body: "At the core of Carbon's hardware and process workflow is Digital Light Synthesis (DLS), governed by Continuous Liquid Interface Production (CLIP). While CLIP avoids mechanical peel forces by maintaining a thin oxygenated dead zone directly above the cassette window, the physical dynamics of printing introduce severe operational failure modes. During the pump-up stage of each layer slice, strong suction forces act against the build platform, pulling green-state parts away from the platform and causing under-adhesion or part detachment, particularly for large cross sections, asymmetrical designs, or pliable elastomeric lattices. Furthermore, unvented volumes in CAD geometries generate localized pressure vacuums that induce blowouts, fringing, vacuum lines, and resin starvation. Thermal accumulation during rapid photopolymerization creates exothermic gradients that force software print plans to slow build speeds for solid cross sections. Crucially, engineering-grade mechanical properties require extensive secondary post-processing: two-part resins mandate prolonged baking cycles in forced-circulation ovens, introducing 0.3% or greater shrinkage from monomer mass loss and thermal contraction, while one-part resins require secondary ultraviolet exposure. In production environments across service bureaus and internal enterprise factories, deviations in wash cleanliness, oven uniformity, or resin dispensing directly cause out-of-spec batches and elevated scrap rates."
    claimRefs:
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
    tableRefs:
      - "TR002"
  - id: "partner-customer-ecosystem-risks"
    title: "Ecosystem Lock-In, Materials Pricing, and Commercial Concentration"
    body: "Commercial adoption of Carbon's manufacturing platform is constrained by business model lock-in and partner dependencies. Independent manufacturing network analyses highlight two fundamental structural drawbacks: Carbon's hardware and iterative prototyping remain pricey compared to conventional tooling, and customers are strictly restricted to proprietary resins formulated and supplied exclusively by Carbon. This closed consumables model exposes enterprise customers and service bureaus such as Fast Radius, SyBridge Technologies, and ERPRO Group to sole-source resin supply risk, material pricing power, and resin margin inflation. Simultaneously, Carbon's marquee production volumes exhibit severe customer concentration around flagship consumer collaborations, most notably Adidas for lattice footwear midsoles, alongside specialized automotive and dental accounts. A slowdown in end-market consumer demand, design transitions away from lattice midsoles, or margin pressure among contracted service bureaus would directly undermine Carbon's consumable resin utilization rates and subscription revenues."
    claimRefs:
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR003"
