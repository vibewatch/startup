company:
  name: Carbon
chapter:
  number: 4
  title: Financials
  summary: Carbon operates a hybrid additive manufacturing monetization model pairing hardware subscriptions with proprietary liquid resins and cloud design software, supported by a November 2025 insider-led $60M Series E extension aimed at reaching cash-flow positive operations amid continuing opacity around core revenue, margins, and printer payback economics.
sections:
  - id: revenue-model-and-monetization
    title: Revenue Model and Platform Monetization
    body: Carbon operates an integrated digital manufacturing monetization architecture that diverges sharply from traditional capital-equipment machine sales. Instead of selling standalone 3D printers on an unbundled basis, the company commercializes its Digital Light Synthesis (DLS) technology through a hybrid platform model combining hardware subscription leases, recurring proprietary photopolymer resin sales, and cloud software services (CI001). Hardware access is structured around annual subscription agreements for its M-series production systems (M1, M2, M3, M3 Max) as well as the high-throughput L1 production system designed specifically for large-scale manufacturing environments (CI002). These machines are permanently connected to Carbon cloud infrastructure, facilitating automated slicing, remote telemetry, fleet-wide process optimization, predictive maintenance, and continuous over-the-air parameter updates (CI002). In addition to printing systems, Carbon provides specialized post-processing hardware, such as the Smart Part Washer, which automates cleaning, serialization, and manufacturing traceability for production parts (CI004). The commercial appeal of this architecture rests on eliminating conventional tooling costs, allowing enterprise clients to iterate designs rapidly and initiate localized production without expensive molds or multi-month tooling lead times (CI003).
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
    tableRefs:
      - TI001
    figureRefs:
      - FI001
  - id: gtm-and-commercial-traction
    title: Go-to-Market Execution and Production Traction
    body: 'Carbon go-to-market execution targets two primary deployment archetypes: direct enterprise production partnerships with global original equipment manufacturers (OEMs) and decentralized commercial contract manufacturing networks through certified production partners. The most prominent validation of Carbon enterprise OEM model is its multi-year collaboration with Adidas, established in 2017, which has successfully produced millions of 3D-printed lattice midsoles for performance athletic footwear franchises including the 4DFWD and Climacool product lines (CI011). Similarly, in sporting goods safety, Riddell utilizes Carbon DLS lattice technology to manufacture custom and standardized football helmet liners that have consistently achieved top laboratory safety ratings in NFL and NFLPA head impact testing across six consecutive years (CI014). Beyond consumer products, Carbon has achieved notable commercial volume in the dental laboratory and oral health industry, where certified dental laboratories produce millions of custom 3D-printed splints, models, and denture components every week (CI012). These proven production use cases demonstrate that Carbon has transcended rapid prototyping to capture recurring manufacturing volume, although enterprise contract terms and volume pricing schedules remain closely guarded commercial secrets.'
    claimRefs:
      - CI011
      - CI012
      - CI014
    tableRefs:
      - TI002
  - id: cost-structure-and-unit-economics
    title: Cost Structure, Unit Economics, and Margin Drivers
    body: 'The economic viability of Carbon digital manufacturing platform depends on a classic razor-and-blade dynamic: printer placements must generate recurring, high-margin consumable photopolymer resin sales to offset customer acquisition costs and hardware depreciation. However, independent technical evaluations highlight material unit-economic friction. Specifically, benchmarking from Dassault Systèmes emphasizes that DLS technology is noticeably expensive, creating significant cost barriers during iterative prototyping and preliminary design cycles where multiple revision builds are required (CI008). Furthermore, customers are constrained by single-vendor material dependencies, as DLS hardware is engineered to run exclusively on proprietary engineering resins formulated and sold directly by Carbon (CI009). For prospective underwriting, Carbon unit economics remain fundamentally opaque because the company maintains private disclosure posture and does not publish realized annual recurring revenue (ARR), gross profit margins, printer lease churn, or net revenue retention (CI013). Consequently, assessing whether high-volume accounts achieve positive operating margins after factoring in proprietary resin markups and continuous subscription fees remains an essential diligence gap.'
    claimRefs:
      - CI008
      - CI009
      - CI013
    tableRefs:
      - TI003
  - id: capital-adequacy-and-diligence-verdict
    title: Capital Adequacy and Diligence Underwriting Verdict
    body: 'From a balance sheet and capital adequacy perspective, Carbon has demonstrated enduring access to insider growth equity across multiple venture cycles. In November 2025, the company secured a $60 million Series E extension round headlined by key existing institutional investors, including Sequoia Capital, Silver Lake, adidas, Baillie Gifford, Madrone, and Northgate (CI005). This injection expanded Carbon cumulative equity capital to $742 million across eight lifetime financing rounds (CI006). Company disclosures indicated that the primary objective of this $60 million financing is to bridge operational funding needs, expand manufacturing capacity, and steer the business into cash-flow positive operations (CI007). This capital infusion is particularly notable given that Carbon last major external valuation anchor dates back to its June 2019 Series E financing, which valued the company at a post-money valuation of $2.4 billion (CI010). Underwriting Carbon today requires balancing its genuine production-scale footprint against substantial financial opacity: while insider backing provides near-term runway, the absence of verified revenue, gross margin, and burn data makes underwriting the business at its peak historical valuation unjustified without audited management disclosures (CI007, CI010, CI013).'
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI010
      - CI013
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Revenue Stream
      - Monetization Mechanism
      - Unit / Contract Model
      - Current Status / Disclosure
      - Revenue Quality
      - Diligence Underwriting Ask
    rows:
      - - Hardware Subscription & Machine Leases
        - Annual subscription/lease for M-series (M1, M2, M3, M3 Max) and L1 production printers
        - Per-printer annual subscription including support and service
        - Commercial; list pricing historical, current terms confidential
        - High (recurring subscription revenue)
        - Confirm active installed base, lease renewal rates, and hardware churn
      - - Proprietary Resin & Consumables
        - Direct sale of proprietary photopolymer liquid resins (EPX, EPU, RPU, MPU, dental resins)
        - Per-liter / per-cartridge consumable pricing
        - Commercial; millions of parts produced weekly across dental/footwear
        - High (high-margin consumable attach)
        - Verify average resin consumption per machine-year and gross margin by resin SKU
      - - Software & Cloud Automation Licenses
        - SaaS subscription for design engine, cloud-connected slicing, and automation tools
        - Annual software license / platform access fee
        - Bundled or add-on software for lattice design and predictive maintenance
        - High (software gross margins)
        - Confirm standalone software billing vs hardware bundle allocation
      - - Customer Success & Extended Services
        - Technical onboarding, qualification support, and custom material validation
        - Fixed fee or time-and-materials services contract
        - Commercial for enterprise production partners (e.g., Adidas, Riddell)
        - Medium (services gross margins lower than software/resin)
        - Review professional service margins and post-processing qualification commitments
    notes: Revenue streams reflect Carbon hybrid platform model combining hardware subscription, proprietary consumables, and software; exact revenue mix percentages remain confidential private disclosures.
    claimRefs:
      - CI001
      - CI003
      - CI007
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offering / Asset
      - List Pricing / Contract Model
      - Realized Pricing Dynamic
      - Discounts, Subsidies & Unknowns
      - Source & Verification Level
    rows:
      - - M-Series Production Printers (M2/M3)
        - Annual subscription model including software and maintenance
        - Subject to enterprise volume discounts and multi-year lease commitments
        - Actual realized lease rates per unit and multi-machine discounts are undisclosed
        - Carbon official docs & Wikipedia (SI001, SI003)
      - - L1 High-Volume Production Printer
        - High-throughput printer subscription for mass production
        - Custom negotiated contracts for enterprise accounts (e.g., Adidas footwear)
        - Tiered pricing based on committed resin volume and fleet scale undisclosed
        - Manufactur3D & Carbon announcements (SI001, SI002)
      - - Proprietary Photopolymer Resins
        - Per-liter list price for rigid and elastomeric resins (e.g. EPX, EPU, MPU)
        - Volume discounts for enterprise production partners
        - Material consumption rates and single-vendor premium markups undisclosed
        - Dassault Systèmes & Aprios partner data (SI005)
      - - Smart Part Washer & Accessory Hardware
        - Sale or lease of ancillary post-processing hardware and cassettes
        - Bundled with printer installations or purchased per cell
        - Warranty and replacement cassette recurring costs undisclosed
        - Carbon official hardware catalog (SI001, SI003)
    notes: Pricing exhibits show Carbon commercial monetization model; contractual discounts and realized net prices for high-volume customers are confidential private terms.
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI009
  - id: TI003
    title: Unit economics table
    columns:
      - Unit Metric
      - Disclosed / Proxy Value
      - Confidence
      - Why It Matters for Underwriting
      - Diligence Underwriting Ask
    rows:
      - - Annual Recurring Revenue (ARR)
        - null
        - low
        - Measures core recurring subscription revenue base across printer leases and software
        - Provide trailing 12-month ARR bridge broken down by hardware vs software
      - - Blended Gross Margin (%)
        - null
        - low
        - Determines operating leverage and profitability path between hardware, resin, and services
        - Disclose GAAP gross margin schedule across hardware, resins, and maintenance
      - - Consumable Resin Attach Rate
        - Millions of parts/week (dental), millions/year (footwear)
        - medium
        - Validates razor-and-blade model where installed printers drive high-margin consumable sales
        - Provide liters of resin consumed per active printer per month by customer segment
      - - Payback Period / Printer LTV:CAC
        - null
        - low
        - Evaluates direct sales cycle efficiency and capital return on leased hardware placements
        - Disclose fully loaded sales & marketing CAC and average payback months per printer cohort
    notes: Values marked null represent undisclosed private financial metrics; diligence asks identify required management schedule disclosures under NDA.
    claimRefs:
      - CI008
      - CI010
      - CI013
      - CI014
