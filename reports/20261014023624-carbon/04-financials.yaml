          label: Proprietary Resin Consumption
          description: High-margin consumable photopolymer resin purchases scaled to manufacturing volume
        - id: N5
          label: Post-Processing & Washer Operations
          description: Parts cleaned in Smart Part Washer and thermally baked to achieve isotropic strength
