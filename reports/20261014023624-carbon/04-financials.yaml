          label: Gross Profit & Cash Generation
          description: High-margin consumable attach and recurring printer leases drive operational cash flow
      edges:
        - from: N1
          to: N2
          label: Part qualification leads to printer lease
        - from: N2
          to: N3
          label: Hardware installation activates cloud platform
        - from: N3
          to: N4
          label: Production throughput triggers consumable reorders
        - from: N4
          to: N5
          label: Printed green parts flow to washing and thermal cure
        - from: N5
          to: N6
          label: Scaled part volumes generate recurring gross profit
    approximationNotes: Flow relationships reflect qualitative commercial mechanics; exact unit conversion rates and margin percentages are private undisclosed metrics.
