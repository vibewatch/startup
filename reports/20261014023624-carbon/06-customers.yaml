company:
  name: Carbon
chapter:
  number: 6
  title: Customers
  summary: Carbon has proven commercial production-scale adoption across consumer athletics, cycling, automotive, and medical dental verticals with marquee brand partners including adidas and Ford. However, high customer concentration in footwear lattices and unverified cohort retention metrics obscure platform durability across broader industrial accounts.
sections:
  - id: customer-base-segmentation
    title: Customer Base Segmentation & Multi-Vertical Commercial Footprint
    body: 'Carbon commercializes its Digital Light Synthesis (DLS) additive manufacturing platform across four distinct customer segments: consumer performance products, automotive and industrial manufacturing, medical devices and clinical dental, and contract service bureaus. Enterprise buyers range from brand R&D directors seeking differentiated lattice cushioning to manufacturing engineers attempting to eliminate expensive injection tooling for short bridge production runs. Disclosed corporate references demonstrate that hundreds of global enterprises have engaged with the Carbon platform across prototyping and end-use production. High-profile brand deployments in athletic footwear, cycling saddles, and protective helmets highlight Carbon''s ability to deliver functional elastomeric lattices that cannot be fabricated via conventional manufacturing methods. Meanwhile, industrial equipment manufacturers utilize rigid polyurethane resins such as RPU 70 for functional components like machinery housings and push-in rivets. In the healthcare sector, specialized dental laboratories and medical device companies utilize Carbon hardware and biocompatible photopolymer resins for patient-specific aligner models and custom surgical instrumentation. Despite this multi-vertical reach, customer adoption remains heavily bifurcated between high-volume consumer flagship lines and lower-volume bridge manufacturing applications.'
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU009
      - CU013
    tableRefs:
      - TU001
  - id: adoption-trajectory-named-proof
    title: Adoption Trajectory & Named Enterprise Production Proof
    body: Evaluating Carbon's true commercial traction requires distinguishing early exploratory prototypes from recurring production deployments at scale. Verifiable production proof is strongest in consumer athletic and sporting goods, where partnerships with global brands including adidas, Specialized, and fizik have delivered millions of end-use latticed parts to market. Adidas stands out not merely as Carbon's most visible customer for its Futurecraft 4D midsoles, but also as a direct equity investor participating in Carbon's $60 million growth round in November 2025. In the automotive vertical, Ford Motor Company has deployed Carbon DLS technology for functional service parts and interior components, allowing rapid design iterations without the lead times of hardened tooling. Similarly, office furniture manufacturer Steelcase partnered with service bureau Fast Radius to commercialize a customized high-end office chair, cutting product development cycle time by 90%. Furthermore, athletic protection manufacturer VICIS co-developed impact-absorbing latticed helmet padding that achieved top safety ratings. The installation base is anchored by large contract production bureaus such as Fast Radius, which operates North America's largest public install-base of Carbon equipment, and Agile Manufacturing, which supports batch runs up to 50,000 isotropic units. To bridge the qualification gap between prototyping and continuous factory production, Carbon introduced force feedback technology in M3 and L1 generation printers, dynamically measuring suction forces to stabilize yields and reduce print defects across customer fleets.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU007
      - CU008
      - CU010
      - CU011
      - CU014
    tableRefs:
      - TU002
      - TU003
    figureRefs:
      - FU001
  - id: retention-expansion-concentration
    title: Retention Durability, Partner Network Dynamics & Channel Concentration
    body: Carbon's go-to-market architecture relies heavily on a dual-track model combining direct on-premise hardware subscriptions with an authorized Production Network of contract manufacturing bureaus. Service bureaus like Aprios and Agile Manufacturing act as critical customer acquisition channels, providing accessible entry points for companies that lack the capital or volume to justify dedicated on-site printer leases. Customers utilize cloud tools like Carbon Design Engine to generate conformal lattices directly from CAD geometries, bypassing manual strut modeling and accelerating transition into physical production. However, this partner-mediated model introduces significant procurement friction and channel concentration vulnerabilities. Partner-level bottlenecks and hardware access constraints have historically forced service bureaus like Sculpteo to establish customer waiting lists for Carbon printer time, actively steering impatient accounts toward competing additive technologies such as Polyjet resins. Furthermore, because Carbon's financial model depends on recurring photopolymer resin pull-through alongside hardware subscription fees, the company faces substantial revenue concentration around a handful of marquee consumer accounts like Adidas. If major footwear or cycling programs slow production schedules or renegotiate resin supply terms, overall platform economics face immediate downward pressure.
    claimRefs:
      - CU002
      - CU004
      - CU005
      - CU006
      - CU012
  - id: diligence-verdict-and-evidence-gaps
    title: Customer Diligence Assessment & Strategic Evidence Gaps
    body: From an investment diligence perspective, Carbon has established genuine technical validation and high-volume manufacturing credibility that outclasses most venture-backed additive manufacturing peers. The production durability of its isotropic polymer parts is corroborated by rigorous industrial testing and sustained consumer product lines across multi-year commercial relationships. Nevertheless, critical underwriting gaps remain unresolved in the company's customer disclosure. Public materials do not disclose audited retention metrics, net revenue retention (NRR), gross revenue retention (GRR), or customer cohort churn. It remains impossible to verify from public records how many of the 'hundreds of global organizations' cited in corporate marketing represent active recurring subscription customers versus legacy trial accounts that completed one-off prototyping runs. Additionally, the exact economics of resin attach rates, machine utilization hours, and gross margins per customer tier remain closely held private data. Prospective investors must condition valuation underwriting on direct access to customer cohort schedules, examining whether printer lease renewals and consumable resin orders expand predictably beyond the core athletic footwear and sporting goods anchor accounts.
    claimRefs:
      - CU001
      - CU004
      - CU012
      - CU015
