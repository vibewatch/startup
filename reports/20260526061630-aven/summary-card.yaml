  topStrengths:
    - >-
      Novel product category: first mass-market home-equity Visa card, capturing regulatory arbitrage between HELOCs and
      credit cards
    - >-
      Cost of capital advantage: 7.49–14.99% APR vs. 22–29% for conventional cards creates durable pricing moat for
      creditworthy homeowners
    - >-
      Capital markets sophistication: AAA-rated ABS issuance (Fitch, Dec 2025) enables cheap, scalable funding without
      balance-sheet constraints
    - 'Strong investor quality: Khosla Ventures, General Catalyst, GIC provide both capital and reputational validation'
    - >-
      Lean headcount leverage: ~$200M+ ARR from ~80 employees implies very high revenue per employee, indicating
      software-driven unit economics
  topRisks:
    - >-
      Single-bank dependency: all origination flows through Coastal Community Bank (CCB); loss of this relationship
      would halt card issuance
    - >-
      FCRA class-action exposure: Lasky v. Aven (Dec 2024) and Marino v. Aven (Mar 2025) allege improper credit
      reporting; adverse judgments could require operational changes
    - >-
      Collateral / AVM risk: automated property valuations used for underwriting may understate LTV in a down market,
      increasing credit losses
    - >-
      Interest-rate sensitivity: HELOC product demand is correlated with rate environment; rising rates reduce homeowner
      refinancing incentives and card attractiveness
    - >-
      Key-person concentration: Sadi Khan is the public face and likely the primary technical/product decision-maker;
      succession risk at this stage is material
  unresolvedGaps:
    - Actual gross margin and profitability timeline not publicly disclosed
    - Full extent of AVM accuracy and portfolio loss rates under stress scenarios
    - CCB contract terms, renewal conditions, and exclusivity provisions not public
    - Resolution of FCRA class actions (Lasky, Marino) pending
    - Machine banking roadmap (auto card, mortgage refi) has no published traction metrics
