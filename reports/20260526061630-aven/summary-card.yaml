summary:
  headline: >-
    Aven has created a genuinely differentiated fintech product—the home-equity-backed credit card—with strong early
    traction, but execution risk around the CCB bank dependency, FCRA litigation, and the untested 'machine banking'
    roadmap warrants a careful track rating ahead of any Series F or IPO.
  overallScore: 7.2
  recommendation: track
  confidence: medium
