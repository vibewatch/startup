  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户画像与分层
        blocks:
          - type: paragraph
            body: >-
              Aven 的主要客户，是 FICO 分数 700–730 或更高、家庭收入 $100,000 或以上、至少拥有 20% 房屋净值且
              已有按揭的优质信用美国房主。公司瞄准房产价值足以支撑自动评估的大都市和郊区借款人。截至 2026 年 1 月， Forbes 估计活跃客户达到 75,000 名或以上，高于 2024 年 7 月约 33,000
              名，意味着 18 个月内客户大约 增长 2–3 倍。$4B+ 已发放授信额度意味着平均每名客户授信约 $40,000–$55,000，与中等规模 HELOC 一致。 Aven 覆盖 41 个州；未覆盖的 9
              个州包括 Texas，以及其他 HELOC 或留置权法律更受限制的市场。地域集中 可能偏向房屋净值较高的沿海和 Sun Belt 市场，在这些市场 Aven 的 AVM 模型拥有更密集的房产数据。来自
              评论平台的使用场景分析显示三类主要队列：高利率信用卡债务合并（最大群体）、家装和翻新融资，以及大额 自由裁量消费。循环信用结构意味着客户无需重新申请即可重复使用额度，形成一种结构上高参与度的产品模式， 不同于传统
              HELOC 提款。抵押品支持信贷和 Visa 网络在 8 million 商户的接受度结合，使 Aven 在 HELOC 提供商中位置独特，因为客户可以把房屋净值用于日常消费，而不必依赖电汇或支票。
