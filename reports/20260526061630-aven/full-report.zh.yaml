      - number: '6.3'
        title: 反向信号、法律风险与投诉模式
        blocks:
          - type: paragraph
            body: >-
              两起联邦集体诉讼构成 Aven 最重大的反向客户信号。Lasky v. Aven Financial（2024 年 12 月提交， N.D. Cal.）指称在没有充分同意的情况下进行硬 HELOC
              征信查询。Marino v. Aven Financial（2025 年 3 月提交）围绕未经授权访问信用报告，提出类似的 FCRA Section 1681b 问题。两案均在进行中；如果获得
              集体认证，可能覆盖相当规模的未完成产品开通流程的申请人。BBB 资料显示 A+ 认证，三年内 50+ 起投诉， 主要集中在账单和服务类别。BBB 数据显示，Aven 通常在 14 天内回应。FCRA
              相关法律文件的数量，说明风险 更像预申请授信决策中的系统性流程风险，而不是孤立事件。FindMortgages 评论提到取消自动扣款或访问 PDF 对账单困难。ConsumerAffairs 2025–2026
              年评论把因房产价值争议导致意外授信额度下调列为反复出现的痛点。 法律文件、授信额度下调投诉和 AVM 争议叠加，体现了把循环信贷绑定到波动房地产抵押品上的内在张力。尽管 法律阻力存在，截至 2026
              年中，Trustpilot 和 App Store 评分并未明显下降，说明 FCRA 诉讼尚未影响核心 客户满意度基础。
