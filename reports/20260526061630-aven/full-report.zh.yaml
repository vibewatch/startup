      coverage: partial
      basis: >-
        Comparables selected from StockAnalysis public comp data, PitchBook fintech comp sheet, and Multiples.vc online
        lending dataset; covers most relevant public and private HELOC and consumer lending peers but excludes non-US
        and small-cap fintechs.
    notes: 上市公司倍数截至 2026 年 Q1，来自 StockAnalysis。私有公司估计来自 PitchBook、CBInsights 和新闻报道。 各公司收入 / ARR 定义可能不同。
  - id: TV005
    title: 打破投资逻辑和终止触发因素
    columns:
      - 风险触发因素
      - 阈值 / 可观察事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - FCRA 集体认证
        - 法院认证 Lasky 或 Marino 为集体诉讼
        - 责任敞口 $50–200M；倍数压缩 20–40%
        - 暂停新投资；建模和解情景
      - - CCB 合作终止
        - CCB 退出银行-金融科技项目或面临 FDIC 执法
        - 放款几乎全面停摆；收入面临生存级风险
        - 立即退出，或尽调重新谈判
      - - 关键市场房价回调 >15%
        - Aven 前三大州敞口的 FHFA HPI 跌幅超过 15%
        - 信用额度大范围下调；AVM 准确率失灵；违约上升
        - 对信贷组合做压力测试；评估 CCB 契约影响
      - - ARR 同比增长低于 50%
        - Forbes 或可信来源称 ARR 增速从 3× 趋势放缓
        - 基准情景倍数重估至 6–8× ARR；估值降至约 $1.2–1.6B
        - 重新评估进入价格；建模 FCF 时间线
      - - ABS 市场冻结或 AAA 下调
        - ABS 利差相对基准扩大 >200bps，或评级撤销
        - 资金成本上升；放款经济性恶化
        - 评估仓储授信额度是否充足；建模利润率压缩
    sourceRefs:
      - SV023
      - SV019
      - SV008
      - SV001
    notes: 这些触发因素是投资监控的分析性经验指标。实际投资决策需要最新数据和直接接触公司。
  - id: TV006
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - FCRA 诉讼敞口
        - 集体规模、预期和解区间、法律策略
        - 决定是否做 20–40% 倍数调整
        - 公司法律顾问披露；案件案卷监控
      - - 队列信贷表现
        - 按发放年份和 FICO 分层的批次逾期率
        - 验证核心抵押品逻辑；HELOC 违约损失率
        - 向公司索取信贷表现报告
      - - CCB 合同条款
        - 续约日期、排他条款、收入分成、终止权
        - CCB 依赖是生存级风险；条款决定风险持续时间
        - 公司数据室；直接核查 CCB 关系
      - - ARR 定义和构成
        - 总利息收入 vs. 净利息收入；交换费分成；手续费收入分成
        - 11× 倍数若套在错误收入定义上，会错估公司价值
        - CFO 披露；对照 Forbes ARR 说法
      - - 仓储授信额度
        - 贷款方身份、集中度、契约结构、使用率
        - 不知道集中度，资金风险就会被低估
        - 公司数据室；债务明细表
      - - AVM 方法论和准确率
        - 与实际估值对比的回测准确率；薄市场表现
        - AVM 错误若突破 CLTV 阈值，会造成信用损失
        - 技术深挖；第三方 AVM 审计结果
    sourceRefs:
      - SV023
      - SV001
      - SV008
      - SV019
    notes: 尽调问题只代表从公开来源识别出的信息缺口。所有事项都可通过标准融资轮次阶段数据室获取。
