  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与融资历史
        blocks:
          - type: paragraph
            body: >-
              Aven 最新一轮融资是 2025 年 9 月的 $110M Series E 轮，投后估值 $2.2B，由 Khosla Ventures 领投，General Catalyst 和 GIC 参投。按
              Forbes 估计的 $200M+ ARR 计算，这一估值约为 11 倍 ARR。融资历史显示，Aven 的估值倍数扩张很快：2024 年 7 月的 Series D 轮（$142M，估值
              $1B）在更小收入基数上隐含约 7 倍 ARR。累计融资约 $252M。11 倍 ARR 的隐含倍数位于消费贷款 fintech 的高位区间：SoFi 按收入 5–6 倍交易，Affirm 为 6–8
              倍，LendingClub 为 2.5 倍，Upstart 为 6–8 倍，Pagaya 为 2–2.5 倍。Aven 的溢价倍数来自差异化抵押结构（HELOC 支撑，而非无担保）、更好的信用质量（优质 FICO
              下限），以及可服务市场仍处早期渗透。CCB ABS 在 10 个月内拿到 AAA 评级，为证券化结构提供机构信心，也降低了本会压缩倍数的资金成本风险。PitchBook 的 2026 年 Q1 fintech
              估值指南和 Finrofca 的 fintech 倍数跟踪器确认，Series E 阶段私营 fintech 的中位数估值在 8–12 倍 ARR，Aven
              更接近当前交易条款的中点，并非极端高位。CBInsights 和 Tracxn 均把 Aven 列为截至 2025 年年中的已确认独角兽。
