      - number: '2.3'
        title: 市场动态、增长驱动与约束
        blocks:
          - type: paragraph
            body: >-
              三股结构性力量推动 HELOC 需求到 2026 年加速。第一，按揭利率锁定效应：截至 2023 年底，近 70% 的 美国未偿按揭是在比当时市场利率低 3
              个百分点或更多的利率下发放的，这强烈削弱了套现再融资意愿。 需要流动性的房主因此被推向 HELOC 等第二留置权工具，而不是牺牲低于 3% 的第一按揭。NY Fed Liberty Street
              Economics 博客在 2024 年 8 月记录了这一现象：即便整体按揭量崩塌，HELOC 发放量 仍较 2021 年低点反弹 20%。第二，创纪录的房屋净值水平：总额 $34.5 trillion、可提取
              $11 trillion 的净值池同时支撑需求和信用质量。2025 年 Q1，实际动用的可提取净值仅 0.41%（MeridianLink），说明 潜在需求巨大，而转化率相对很低。第二留置权房屋净值提取在
              2025 年达到 $116 billion，为 2007 年以来 最高，印证了成交量复苏。第三，债务合并需求：MBA 2025 Home Equity Lending Study 发现，2024 年 39% 的
              HELOC 借款人把债务合并列为主要目的，高于 2022 年的 25%。在信用卡余额达到 $1.25 trillion （NY Fed 2026 年 Q1）、平均 APR 超过 20% 的情况下，套利机会很清楚。


              采用率约束是真实存在的，也解释了为什么渗透率仍然低。Federal Reserve 利率政策是首要外部变量： 2026 年 5 月，Fed 连续第三次会议维持基准利率不变（Bankrate 2026 年 5
              月），使 HELOC 利率相对 2020–21 年仍处高位。消费者认知和信任也是约束：MeridianLink 2026 调查发现，仅 10 名房主中有 3 名 正在积极考虑房屋净值产品，且 32% 已获批
              HELOC 借款人从不提款。传统银行处理周期（MBA 显示平均 39 天关闭）和 50% 申请关闭率体现了系统摩擦，也正是 Aven 这类金融科技进入者试图打破的环节。 CFPB Regulation
              Z（TILA Section 1026.40）下的监管复杂度，以及州级按揭牌照要求，为全国扩张设置了 合规门槛。最后，HELOC 违约风险是尾部风险：FDIC 2026 Risk Review
              把房屋净值放贷增长列为观察项， 因为 HELOC 余额正在向历史水平正常化。
