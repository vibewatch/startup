  - id: TM001
    slug: market-definition-table
    title: 市场定义表
    enumerationScope:
      coverage: exhaustive
      basis: >-
        All major US HELOC product types and definitional boundaries, based on MBA 2025 study and regulatory sources
        covering the full US market
    columns:
      - 细分 / 类别
      - 包含支出
      - 排除支出
      - 买方 / 付款方
      - 与 Aven 的相关性
    rows:
      - - HELOC 循环信贷（核心 TAM）
        - 通过 HELOC 工具提取房屋净值；可变利率第二顺位留置权
        - 反向抵押贷款；无担保个人贷款；现金套现再融资
        - 拥有 15-20%+ 净值的美国房主；优质信用（680+ FICO）
        - 核心 TAM；Aven 是该细分中的 HELOC 发放方
      - - HELOC 支撑的卡（Aven 的细分利基）
        - 通过 Visa 卡界面，以类似信用卡的方式提取房屋净值；奖励消费
        - 传统 HELOC 提取（基于 ACH / 支票）；房屋净值贷款
        - Prime+ 房主（700+ FICO）；数字原生；偏好卡界面
        - Aven 自有 SOM；近期最高优先级
      - - 封闭式房屋净值贷款（HEL）
        - 固定利率一次性第二顺位房屋净值贷款；房屋改善
        - 开放式循环信贷；现金套现再融资
        - 需要为明确项目获得固定金额资金的房主
        - 相邻市场；Aven 的 Home Equity Cash 产品在此竞争
      - - 现金套现按揭再融资
        - 按现行利率再融资，通过第一顺位留置权提取房屋净值
        - 第二顺位留置权产品；HELOC；HEL
        - 对利率不敏感的房主，或无法获得 HELOC 的房主
        - 主要竞争替代方案；自 2022 年以来受利率锁定压制
      - - 循环消费信用卡
        - 通用无担保循环信贷；平均 APR >20%
        - 任何以房屋担保的产品；个人贷款
        - 全体美国消费者；人群广泛
        - 重大替代机会；Aven 相对信用卡的关键套利
      - - 金融科技 HELOC 加速市场
        - 使用自动化 AVM / 决策的数字 HELOC 发放
        - 传统银行网点发放；顾问主导产品
        - 35-65 岁、数字活跃的优质房主
        - Aven 与 Figure、Better、SpringEQ 同处该细分
    notes: >-
      市场边界截至运行日期 2026-05-26。HELOC = 房屋净值信贷额度（Home Equity Line of Credit）；HEL = 房屋净值贷款（Home Equity Loan）；AVM =
      自动估值模型（Automated Valuation Model）。
