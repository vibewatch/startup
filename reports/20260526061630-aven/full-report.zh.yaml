            body: >-
              留存记录里最清楚的创始人事实是，Sadi Khan 是 Aven 联合创始人兼 CEO。独立的 2026 年演讲嘉宾 和个人资料页面也提供了最可用的创始人背景细节：Khan 此前曾在 Facebook 和
