        title: 反向记录并不致命，但重要到必须写进概览
        blocks:
          - type: paragraph
            body: >-
              概览里最重要的提醒是，Aven 的增长故事旁边摆着正在进行的法律和客户摩擦信号。2025 年 3 月， Arianna Marino 提起联邦诉讼，指称 Aven 未经同意开设 HELOC
              并触发硬征信查询；法院记录显示， Aven 随后未能强制仲裁，并对该驳回提出上诉。ClassAction.org 对同一案件的报道还补充了一项指控： 奖励链接的「technical
              bug」可能自动接受了一个要约。另有法院记录显示，2023 年 Lasky 就数据泄露 通知提起诉讼，尽管该案后来无损害地自愿撤回。客户反馈渠道同样重要，因为该产品以借款人的房屋作担保，
              运营信任直接受其影响。BBB 2026 年资料显示三年内有 117 起投诉，投诉例子包括疑似欺诈申请和身份 验证失败。Bankrate 和 NerdWallet 都强调了支撑 Aven
              价值主张的核心下行风险：借款比无担保信用卡 便宜，是因为它由房屋担保；因此产品误用、服务失败或承保错误带来的客户后果，可能明显高于普通奖励卡。 这就是这些问题应写在概览里，而不是完全推迟到财务或风险章节的原因。
