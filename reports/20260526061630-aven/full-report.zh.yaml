      - number: '7.3'
        title: 伙伴、运营与执行风险
        blocks:
          - type: paragraph
            body: >-
              Aven 几乎完全依赖 Coastal Community Bank（CCB）取得 FDIC 银行牌照、放款权限和 ABS 结构入口。CCB Card Account Agreement 约束放款合作关系，CCB
              ABS 在 2025 年 12 月获得 AAA 评级，说明市场目前认可这套证券化结构。但如果合作因为监管、竞争或商业原因终止，Aven 现有银行合作模式下的新 HELOC 发放能力基本会停摆。Banking
              Journal 引用的 2026 年 NY Fed 家庭债务报告和 MBA 放款数据确认，HELOC 发放量具有周期性，也带来收入波动风险。HousingWire 对 CEO Sadi Khan
              的报道凸显了关键人物集中风险：Aven 是创始人主导的公司，员工大约 80 人。Moodys 信用风险展望把依赖技术的贷款平台运营集中列为 2026 年系统性关注点。Aven 覆盖 41 个州，AVM
              基础设施需要在每个州持续满足监管要求；州数增加后，合规开销不会线性增长。Mortgage Point 的 2026 年展望指出，住房市场政策变化（FHFA 调整、GSE 改革、FHA HELOC
              项目变化）可能迅速改写 Aven 所在的竞争格局。Aven 的机器银行愿景（Series E 逻辑）也带来执行风险：汽车抵押卡和按揭再融资产品需要新的监管批准、新的合作伙伴关系，以及超过核心 HELOC
              卡的大量工程投入。公司已融资 $252M，盈利跑道有限；在执行压力下能否保持资本效率，是投资人需要盯住的事项。Fannie Mae 预测指出，放款量对利率环境敏感，Aven 的仓储信贷额度和 ABS
              管线必须消化这种需求周期，且不能触发契约违约。
