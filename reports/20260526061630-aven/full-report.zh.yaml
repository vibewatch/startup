      - number: '2.2'
        title: 市场规模：TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >-
              三个互补的规模测算视角框定了 Aven 的可触达机会。第一，房主净值总池：截至 2026 年初，美国房主持有 约 $34.5 trillion 住宅房地产净值（MeridianLink 引用 Federal
              Reserve 数据），相当于每名美国房主 约 $302,000。ICE Mortgage Technology 估计，其中 $11 trillion 是可提取净值——在维持 20% 净值 缓冲 LTV
              的前提下可借出的部分——构成最宽口径的合理 TAM 上限。第二，活跃 HELOC 市场：NY Fed Consumer Credit Panel 数据显示，2026 年 Q1 HELOC 未偿余额为 $446
              billion，同比增加 $44 billion， 比 2022 年低点高出 $129 billion。Cotality/FirstClose 称，2025 年 HELOC 未偿授信额度首次突破 $1
              trillion。2025 年，开放式 HELOC 和封闭式房屋净值贷款合计年发放额估计达到 $311 billion。 第三，金融科技可服务 SAM：Aven 瞄准 FICO 700+ 房主（MBA 显示
              2024 年行业平均发放 FICO 为 771）、 充足净值（发放时平均 CLTV 为 51%），以及愿意在其 41 州覆盖范围内通过 app 数字化申请的用户。 美国约 65.6% 家庭自有住房（约 87
              million 房主家庭）；其中估计 15 到 20 million 符合 Aven 在 活跃州的信用和净值画像，意味着总可触达净值的 SAM 为 $1.5 到 $2.5 trillion（模型推导）。按约
              $100,000 平均授信额度计算，这代表 15 到 25 million 条额度机会。Aven 当前 SOM 是 $4 billion+ 已发放授信额度（2026 年 1 月），相对 $446 billion
              HELOC 未偿余额不足 1% 市场渗透率，说明即便在 保守 SAM 假设下仍有可观空间。MBA 放款机构预期显示，HELOC 未偿债务预计在 2025 年增长 9.8%， 2026 年增长
              9.5%，每年扩大可触达基数。
