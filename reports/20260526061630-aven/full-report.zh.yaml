  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与合规风险
        blocks:
          - type: paragraph
            body: >-
              Aven 是一家非银金融科技公司，依赖 Coastal Community Bank 的 FDIC 牌照和 NMLS 牌照（#462289）发放 HELOC。这种银行合作模式带来两层监管风险：Aven 自己在
              41 个州的 NMLS 牌照（#2042345），以及 CCB 主要监管方对合作项目的监督。FDIC 2026 Risk Review 把消费者放贷合规、AVM 准确性和第三方风险管理列为
              更高监督关注领域——这些都直接指向 Aven 的运营模式。eCFR Title 12 Part 1026（Regulation Z）规管 HELOC 披露要求；Federal Register 2025 年 12
              月的 Reg Z 门槛更新，反映消费信贷监管仍在演进。最尖锐 的法律风险，是两起联邦 FCRA 集体诉讼：Lasky v. Aven（2024 年 12 月）和 Marino v. Aven（2025 年 3
              月）均指称 FCRA Section 1681b 下未经授权的征信查询。如果任一案件获得集体认证，风险敞口可能覆盖所有 在发放流程中被硬拉征信、但未获得充分同意披露的申请人。ClassAction.org 投诉
              PDF（Marin v. Aven）详述 具体指控：Aven 在没有适当许可目的授权的情况下，为开设 HELOC 账户访问信用报告。NMLS consumer access 数据确认 Aven
              的州级牌照足迹，Federal Reserve Consumer Help registry 则提供了接受检查的 银行—金融科技合作监管框架。Aven
              披露页面列出了其同意框架，但同意采集是否充分，是当前诉讼的核心争议。 BBB 投诉数据显示，除集体诉讼外，还有一类贴近 FCRA 的客户不满。剩余监管风险又被 CFPB 对 HELOC 市场
              表现趋势的持续监测放大，尤其是违约率和争议率。
