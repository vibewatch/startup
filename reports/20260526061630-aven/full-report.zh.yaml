            body: >-
              Aven 的护城河建立在三根相互强化的支柱上：（1）产品架构（HELOC-card 融合要求同时具备承保、银行和 发卡能力），（2）数据飞轮（AVM + 支出数据随时间提升承保准确性），以及（3）Haven
