  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品模块与架构
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月，Aven 有四个产品模块：（1）Home Equity Visa Card——旗舰循环 HELOC 支持信用卡， 覆盖 41 个州，授信额度 $5K–$250K，浮动 APR
              7.49–14.99%；（2）Home Equity Cash——固定利率、 全额提款 HELOC（6.99–15.49%，$5K–$400K），面向偏好稳定还款而非循环使用的借款人；（3）Aven
              Advisor——免费的财务规划工具，2024 年 7 月已有 160K+ 会员，跟踪所有账户、监控支出，并作为客户 获取管线；（4）Mortgage Refinancing——早期套现再融资产品（截至 2025
              年 9 月少于 12 笔交易）， 目标 10 天审批。Visa 卡是主要商业和技术创新：它首次把 Visa 信用卡网络架在 HELOC 之上，结合了循环 信用卡访问的便利性和担保型房屋净值债务的低成本。该卡由
              Coastal Community Bank（CCB）在 Visa USA 许可下发行；Aven Financial Technologies Inc. 是技术、承保和服务层。卡产品的循环结构允许持续使用和
              重复利息收入，不像传统一次性 HELOC 提款那样需要重新申请。
