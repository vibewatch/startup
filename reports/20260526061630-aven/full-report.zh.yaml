      - number: '7.2'
        title: 信用、市场与抵押品风险
        blocks:
          - type: paragraph
            body: >-
              Aven 的 HELOC 支持信用卡产品形成一种依赖抵押品的信用模型，贷款表现直接绑定住宅房产价值。FHFA House Price Index 数据显示，区域升值趋势可能反转；基于 AVM
              的评估会在抵押品估值中引入估计误差，BBB 投诉 记录也记录了客户因自动重估后意外降低授信额度而产生的不满。Federal Reserve 核销序列显示，消费信贷核销率 处于周期性水平；HELOC
              特定核销历史上与房产价值调整相关。NY Fed Household Debt 报告显示，截至 2025 年 Q4，美国家庭债务约 $19 trillion，HELOC
              余额升至多年高点——这既反映需求顺风，也增加了全系统 HELOC 集中度。 Moodys 2026 信用风险展望把商业地产调整外溢和利率敏感性列为 2026 年主要信用风险向量。FRED prime rate 和
              Federal Reserve G.19 消费信贷数据确认，Aven 的浮动利率 HELOC 直接绑定基准利率变动：Fed 加息会抬高 消费者 APR，同时可能压低新增发放需求。Aven 的信用质量部分受到
              700–730+ FICO 底线和最高 89% CLTV 保护， 但 AVM 错误和局部房价调整可能刺穿这些缓冲。Chestnut Mortgage 2026 分析认为，薄市场子市场中的 AVM 准确性，是
              HELOC 金融科技公司面临的主要抵押品风险。Fannie Mae 2026 预测预计房价温和升值，但区域差异很大， 增加了 Aven 组合集中于特定都市市场时的非对称风险。
