      - number: '6.2'
        title: 满意度、评分与客户证据
        blocks:
          - type: paragraph
            body: >-
              作为金融科技放款方，Aven 的第三方评论足迹很强。Trustpilot 显示，截至 2026 年中，超过 7,900 条 评论给出 4.9/5 综合评分，主导主题是审批快（常被提到低于 10 分钟）、相对信用卡
              APR 低，以及移动 app 体验清爽。Apple App Store 评分同为 4.9/5；Google Play 显示 4.5+ 星。Bankrate 编辑评测给出 4.4/5 总分，称竞争性 APR 和
              2% 无限返现是差异点。NerdWallet 认为 Aven 在全国范围内提供有竞争力的 HELOC 支持卡利率。CNBC Select 把 Aven 评为高信用分房主的优选之一。The Mortgage
              Reports 突出 10 分钟 数字申请和无结清成本结构是关键客户利益。BestMoney 评论者给 Aven 移动 app 体验的评分显著高于银行发行的 HELOC 产品。Aven
              自己的证言页面展示了具名客户，称相对此前信用卡债务节省 6–8 个百分点利息。LendEdu 指出 2% 返现是相对无奖励传统 HELOC 的差异点。负面信号包括 ConsumerAffairs
              评论指出客服响应时间问题， 以及与房产价值变化绑定的授信额度下调。Figure.com Trustpilot 约 3.5 分，明显低于 Aven 的 4.9，说明 数字 HELOC
              满意度在各金融科技公司中并不一致，也说明 Aven 的申请速度和奖励结构确有差异。
