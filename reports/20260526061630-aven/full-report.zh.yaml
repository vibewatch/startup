              Forbes 估计，截至 2025 年 9 月，Aven 年化收入超过 $200M，员工约 79 名，意味着每员工收入约 $2.5M，在消费者金融科技公司中异常高。进入 Series D（2024
              年中）前，Aven 收入同比增长三倍；进入 Series E（2025 年 9 月）前，客户基数同比增长三倍，显示持续超高速增长。Forbes 称，截至 2025 年 9 月，公司尚未盈利。Aven 已发放超过
              $3B 总授信额度（2025 年 9 月），并为客户节省 $215M+ 利息， 暗示有一笔可观的未偿组合在产生利息收入。若 $3B 组合以 10–11% 平均 APR 全额提款，年化总利息收益 会接近约
              $300–330M，但典型循环 HELOC 使用率只是部分提款。单位经济性没有公开披露；CAC、LTV-to-CAC 比率和单账户贡献利润均为私有数据。首次评级证券化交易后 10 个月内取得 AAA
              投资评级（Series E 中提及）， 意味着底层信用质量强、资金成本更低、资本市场能力成熟。700–730+ 的目标 FICO 和最高 89% CLTV 上限 限制了违约风险。Aven Advisor 到
