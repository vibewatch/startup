  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              Aven 竞争的市场是美国房屋净值信贷额度（HELOC），更具体说，是把 HELOC 授信与卡支付轨道连接起来的 细分市场。HELOC 是以借款人房屋净值作担保的循环、浮动利率授信工具，通常在 10
              年提款期内提取， 再用 10 到 20 年摊还。Aven 的定位卡在两个大市场的交叉点：HELOC 产品市场（2026 年 Q1 未偿余额 $446 billion）和通用循环信用卡市场（Fed G.19 显示
              2026 年 Q1 循环消费信贷余额 $1.33 trillion）。 Aven 以 HELOC 支持的 Visa 卡让房主像用信用卡一样方便地动用房屋净值，同时支付 HELOC 级别利率 （当前约 10–11%
              APR，而全国 HELOC 平均为 7.41%，平均信用卡 APR 超过 20%）。核心市场边界包括 所有拥有足够净值、优质以上信用画像（FICO 700+），并希望为消费、债务合并或家装动用净值的
              美国房主。近期 TAM 不包括反向按揭（特定于老年人群）、无担保个人贷款、封闭式房屋净值贷款（HEL） 和套现再融资（第一留置权替代品）。关键现有替代品在三条线上竞争：传统银行 HELOC 发放（35 天以上
              周期）、套现再融资（牺牲已锁定低利率的第一按揭）和高利率信用卡（有便利性但没有净值收益）。
