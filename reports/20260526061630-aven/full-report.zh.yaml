              作为赞助方。关键风险包括：大型银行可以利用资产负债表优势复制 card-on-HELOC 产品；HELOC 市场 对利率敏感，如果房价下跌会明显放缓；在信用社牌照完全部署前，Aven 依赖 Coastal
              Community Bank 作为 主要发放伙伴，形成监管和运营集中风险。Figure 的 $8.3B 发放量超过 Aven 累计 $4B+ 已发放授信， 且 Figure 的资本市场能力（Figure
              Marketplace）如果二级市场条件改善，可能让它以更低利率压价。 FDIC 2026 监管数据凸显全行业房屋净值信用质量担忧上升（SP026/CP036），可能使银行面临更紧约束； Aven
