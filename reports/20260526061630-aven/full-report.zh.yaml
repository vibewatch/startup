    sections:
      - number: '1.1'
        title: 身份、产品栈与「machine banking」定位
        blocks:
          - type: paragraph
            body: >-
              Aven 现在对外身份已经在公司页面、新闻稿和独立报道中保持一致：它是一家 San Francisco Bay Area 金融科技公司，想让房主把房屋净值转换成成本更低的日常借贷。旗舰主张少见但容易理解。Aven
              销售一张 Home Equity Visa Card，把类似 HELOC 的担保授信、信用卡式便利、2% 无限返现、数字化申请和公证、 余额转移或套现功能放在一起。到 2026
              年，公司不再把自己描述成单一产品试验。公开产品页面和融资 报道显示，产品组合已经扩展到 Home Equity Cash、Rewards Card、Flexible Cash、Aven Advisor，
              以及已经宣布进入按揭再融资。把这些产品串起来的战略叙事，是管理层所说的「machine banking」： 自动化承保、服务和公证，让担保型消费信贷以软件速度交付，而不是沿用传统按揭的时间线。这个定位
              很重要，因为后文关于经济性和竞争的尽调问题，必须把 Aven 看成一个纵向设计的资产支持消费信贷平台， 而不是普通 HELOC 放款方。
