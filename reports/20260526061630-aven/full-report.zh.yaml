      - number: '5.2'
        title: 技术栈与自动化承保
        blocks:
          - type: paragraph
            body: >-
              Aven 的承保全自动化，去掉了让传统 HELOC 耗时 30–45 天的人工评估、公证协调和文件审核步骤。核心承保 管线在 15
              分钟内跑完，包括：（1）来自第三方提供商的自动估值模型（AVM），用于估计房屋价值；（2）征信 拉取，以及基于实时收入验证的债务收入比分析；（3）数字公证——通过摄像头和麦克风进行在线公证（多数州），
              替代线下公证要求；（4）结合房产数据计算 CLTV，以设定授信额度。机器学习模型驱动承保决定、客户风险评分 和持续授信额度管理。移动 app（iOS 和 Android，卖方实体「AVEN FINANCIAL
              TECHNOLOGIES, INC」， 截至 2026 年 4 月版本 1.0.87，38.6MB）提供卡管理、套现发起、余额转移和还款。Aven 已招聘 ML Engineers、Data Scientists
              和 Product Engineers，以迭代承保模型和风险评分。Series E 公告中阐述的 「machine banking」平台概念，描述的是一个终局：自动化、专利机器人和大规模 ML
              处理消费者信贷发放、 服务和资本管理的每一步。收入验证使用银行账户数据访问（类似 Plaid 式聚合），多数情况下无需上传工资单 也能解析收入。Aven 招聘页面上的 GTM Engineer
              角色，显示公司在直接面向消费者获客之外，也投入伙伴渠道 自动化。
