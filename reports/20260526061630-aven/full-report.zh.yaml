        - 临近房贷；高度暴露于房屋净值市场
        - 房贷发放方，不是 HELOC 卡；模式不同
      - - Figure.com（私有）
        - 私有 HELOC 金融科技
        - 估计 $200–300M 收入
        - 估计 $1.5B（2024 年轮次）
        - 估计 5–7×
        - 最接近的直接 HELOC 金融科技同业；产品可比
        - 私有公司；数据较少；增长低于 Aven 隐含水平
      - - Aven（本公司）
        - 私有 HELOC 支持的 Visa 卡
        - 估计 ARR 超 $200M
        - $2.2B（2025 年 9 月）
