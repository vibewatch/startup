      - number: '8.2'
        title: 乐观 / 基准 / 悲观情景与回报分析
        blocks:
          - type: paragraph
            body: >-
              乐观情景假设 Aven 到 2028 年维持每年 2.5–3 倍 ARR 增长，ARR 达到 $500–600M，借 Haven FCU 牌照扩展到全部 50 个州，并跑通按揭再融资和汽车抵押卡产品。若 ARR
              倍数达到 14–16 倍（由产品宽度和盈利拐点支撑），企业价值可达 $7–9B。以 $2.2B 估值进入且稀释很小的投资人，三年内可获得 3–4 倍回报。基准情景假设 ARR 增长 1.5–2 倍，2028
              年达到 $400M ARR，HELOC 卡仍是主产品。按 10–12 倍 ARR 计算，企业价值可达 $4–5B，约为 2025 年进入估值的 2 倍。悲观情景假设 FCRA 集体诉讼获得认证并导致
              $50–150M 和解，CCB 合作重新谈判（成本上升），增长放缓到每年 50%。到 2028 年 ARR 达到 $300M，按 6–7 倍计算，退出价值为 $1.8–2.1B，接近 2025
              年进入价格持平。更负面的情景是 CCB 合作伙伴终止，可能危及公司生存。投资人的核心问题是，FCRA 事项解决前，Aven 的溢价倍数能否守住；历史参照包括 SoFi 在 SPAC 期间的倍数压缩，以及
              LendingClub 上市后的降级重估。Multiples.vc 数据确认，2023–2025 年线上贷款上市可比公司按收入 2–8 倍交易，不过私募市场溢价通常高出 2–3
              倍。回报分析还必须纳入优先权负担：Aven 已融资 $252M，按 $2.2B 估值进入的投资人需要通过完整股权分配瀑布，核实清算优先权和期权池稀释。
            claimRefs: []
          - type: table
            tableRef: TV003
