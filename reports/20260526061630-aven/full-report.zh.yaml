        - 到网点办理；30–45 天审批；线下估值；现场公证；发起费
        - 线上申请 15 分钟；AVM 估值；数字公证；无结算费
        - 节省约 30 天；$0 费用，对比典型 $150–$500 结算成本
        - 仅覆盖 41 个州；要求 20%+ 房屋净值；目标 FICO 700+
      - - 像信用卡一样使用资金
        - HELOC 访问卡（类似借记卡）；不是 Visa 信用卡；无奖励
        - Visa 信用卡；Visa 受理商户均可使用；2% 返现
        - 同一笔债务产生奖励收入；商户受理范围更广
