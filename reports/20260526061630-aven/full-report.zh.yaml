companyProfile:
  summary: >-
    Aven 是一家总部位于 San Francisco 的金融科技公司，为美国房主做出了第一张以房屋净值作担保的信用卡。 公司由 Sadi Khan 和 Bhanu Narasimhan 于 2019
    年创立，借助自研自动估值与承保引擎，全流程在线发放 HELOC 支持的 Visa 卡。持卡人获得循环授信额度，APR 通常为 7.49–14.99%，显著低于传统信用卡利率； 所有消费返现 2%，且不收年费或结清费用。公司与
    Coastal Community Bank（CCB）合作，由后者作为 FDIC 保险的发卡银行，通过 Fitch 评为 AAA 的 ABS 分层证券化贷款，并在「machine banking」愿景下扩展到
    新资产类别（汽车抵押卡、按揭再融资）。截至 2026 年 1 月，Aven 报告持卡人超过 75,000 名，在 41 个州 获批授信额度 $4 billion，估计 ARR 超过 $200 million。
