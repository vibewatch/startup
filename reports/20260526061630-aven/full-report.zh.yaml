      - number: '5.3'
        title: 信任、合规与 IP 差异化
        blocks:
          - type: paragraph
            body: >-
              Aven Financial 在其服务州持有 NMLS 牌照 #2042345（Aven Financial, Inc.）；Coastal Community Bank 作为 FDIC 成员发卡银行持有 NMLS
              #462289。该卡承载所有 Visa 网络安全标准（PCI DSS 合规通过 CCB/Visa 结构隐含实现）。Aven 隐私政策收集与身份绑定的使用数据和标识符；App Store 页面注明「Data
              Used to Track You」包括标识符。IP 差异化来自专利组合（Series E 中称为「patented robotics」）、用 Aven 自身 HELOC 队列数据训练的自研 ML
              承保模型、CCB-Aven 银行即服务关系结构，以及 AAA 评级证券化 记录。2025 年 3 月 FCRA 集体诉讼（Marino v. Aven）指称未经授权访问信用报告并开设 HELOC 账户——这是 对
              Aven 信任姿态不利的合规风险事实。Aven 为 $10K 以下余额推出「foreclosure protection」——一个面向 客户的风险管理功能，使其有别于非按揭金融科技放款方。Aven 路线图（截至
              Series E）包括汽车抵押卡、 面向多资产类别的更广义「machine banking」平台，以及规模化按揭再融资。Haven Federal Credit Union （2025 年 12 月获 NCUA
              授牌）最终将提供存款侧基础设施，增加一层新的合规制度。NMLS 牌照、CCB 牌照 覆盖和 Visa 网络合规叠加在一起，为一家非银金融科技公司形成多层但经外部验证的合规姿态。
