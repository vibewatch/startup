        - 由 FCRA 集体认证或房价回调 >15% 触发
    sourceRefs:
      - SV008
      - SV001
      - SV004
      - SV005
      - SV023
    notes: 情景概率只是分析框架中的定性估计。ARR 和倍数假设基于行业基准，并非公司提供的预测。
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 类型
      - ARR / 收入
      - 估值 / 市值
      - 倍数
      - 相关性
      - 局限
    rows:
      - - SoFi Technologies (SOFI)
        - 上市消费金融科技（银行牌照）
        - 约 $2.9B 收入
        - 约 $14–17B 市值
        - 5–6× 收入
        - 银行牌照；多产品消费借贷；高增长
        - 规模更大；更分散；HELOC 等价产品利润率更低
      - - Affirm Holdings (AFRM)
        - 上市消费金融科技（BNPL / POS）
        - 约 $2.5B 收入
        - 约 $15–20B 市值
        - 6–8× 收入
        - 高增长消费信贷；依赖伙伴的模式
        - BNPL 不是 HELOC；期限更短；无抵押
      - - Upstart Holdings (UPST)
        - 上市 AI 消费借贷
        - 约 $500–700M 收入
        - 约 $3–6B 市值
        - 6–10× 收入
        - AI 承保；利率敏感；可比金融科技倍数
        - 无担保个人贷；信用风险更高
      - - LendingClub (LC)
        - 上市市场借贷平台
        - 约 $800M 收入
        - 约 $2B 市值
        - 2.5× 收入
        - 消费借贷平台；银行牌照；风险已降低的画像
        - 增长更低；更成熟；市场撮合模式
