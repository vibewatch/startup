  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >-
              Aven 通过三条主要流取得收入：未偿 HELOC 余额上的净利息收入、用卡交易费用（套现和余额转移费用）， 以及商户出资的卡交易交换费收入。利息收入是主导驱动，因为 Aven 赚取资金成本（证券化 ABS
              分层，或 Coastal Community Bank 仓储额度）与面向消费者的 7.49%–14.99% APR HELOC 利率之间的利差。套现和 余额转移交易各收取一次性 2.5%
              费用，并加入未偿余额，带来即时收入确认。销售点卡交易交换费（Visa 网络，典型商户费用中约 1–2% 分给发行方）提供较小的经常性收入流。Aven 不收年费、结清费或评估费， 与传统 HELOC
              放款方形成差异，并用自动承保带来的效率收益吸收这些成本。奖励卡（消费 2% 返现、酒店 预订 7%）由资产支持信贷相对无担保循环信贷内在的利差优势资助。奖励计划（2% 返现，由利差资助）是有意
              设计的客户留存和消费激活机制；相对无担保发卡机构，资产支持卡产生的净息差可以吸收奖励成本。这种免费用 获客模式降低了借款人的有效成本，并由 Aven 自动化驱动的发放技术支撑。
