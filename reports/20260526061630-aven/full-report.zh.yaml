      - number: '8.3'
        title: 可比公司、退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Aven 最相关的可比公司横跨两个维度：（1）有 HELOC 或房屋净值敞口的消费 fintech 贷款机构；（2）高速增长的消费 fintech 平台。SoFi
              是最接近的上市参照——一家持有银行牌照的多元化消费 fintech——但由于收入来源更分散，交易倍数较低。Figure.com 仍是最接近的私营 HELOC fintech 同行，2024 年最后一次公开估值约
              $1.5B，这说明 Aven 2025 年的溢价可由增长差异支撑。退出准备度方面，Aven 已具备 2027–2028 年 IPO 窗口所需的财务规模（$200M+ ARR）、监管基础（NMLS 覆盖 41
              个州）和机构投资人背书（GIC、Khosla），前提是利率企稳且 FCRA 事项解决。大型银行、按揭服务商或大型信用卡发卡机构等战略买家，可能会被 Aven 的 AVM
              技术和获客模式吸引。本分析的反向情景是：Lasky v. Aven 集体诉讼若获得认证，将带来实质性倍数压缩风险；如果需要大额和解，潜在影响可能相当于企业价值的 20–40%。BBB
              投诉模式也会给战略买家带来监管风险，因为收购后买家将承接这套合规画像。2026 年 Q1 fintech 倍数（Finrofca 跟踪器）显示，高增长消费 fintech 私营公司的 ARR 倍数在 8–14
              倍区间；考虑 Aven 的增长率、抵押品质量和市场位置，11 倍看起来合理。最终尽调优先级：（1）FCRA 案件状态和和解概率，（2）vintage 队列信用表现，（3）CCB
              合同条款和续约时间线，（4）仓储信贷额度集中度，（5）管理层确认的 ARR 定义（总口径还是净利息收入）。
