summary:
  headline: >-
    Aven 做出了差异化很强的金融科技产品——以房屋净值作抵押的信用卡，早期牵引力也扎实；但 CCB 银行依赖、FCRA 诉讼，以及尚未验证的「machine banking」路线图，都让 Series F 或 IPO
    前更适合谨慎观察。
