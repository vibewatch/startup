  "callouts": [
    {
      "calloutType": "insight",
      "title": "Mortgage lock-in structurally re-routes equity extraction to HELOCs",
      "body": "With nearly 70% of US mortgage balances locked at rates 3+ percentage points below current levels, cash-out refinancing is economically unattractive for most homeowners. This structural dynamic is the single largest demand driver for HELOCs \u2014 and for Aven \u2014 through at least 2027, as rate normalization will be slow and gradual given the distribution of fixed-rate mortgage maturities.",
      "claimRefs": [
        "CM022",
        "CM023"
      ]
    },
    {
      "calloutType": "risk",
      "title": "Only 0.41% of tappable equity was accessed in Q1 2025, reflecting a conversion problem",
      "body": "Despite $11 trillion in tappable equity, draws in Q1 2025 were a tiny fraction of available capacity. The 32% of approved HELOC holders who never touch their funds (MeridianLink) suggests conversion and utilization are binding constraints, not equity availability. Aven's flywheel depends on moving homeowners from approved to active drawer, which is not assured even with a fast approval process.",
      "claimRefs": [
        "CM009",
        "CM010"
      ]
    },
    {
      "calloutType": "strength",
      "title": "Over $1,000 annual interest savings per household vs credit card debt",
      "body": "A homeowner carrying a $10,000 credit card balance at 20% APR ($2,000/year) who transfers to a HELOC at Aven's ~10% APR ($1,000/year) saves approximately $1,000 annually. With average credit card balances exceeding $6,000 per cardholder and many borrowers carrying $20,000 or more, the lifetime value of debt-consolidating HELOC customers is significant \u2014 and the recurring nature of revolving balances suggests re-draw potential.",
      "claimRefs": [
        "CM016",
        "CM019"
      ]
    }
  ],
