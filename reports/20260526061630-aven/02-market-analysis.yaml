      "title": "Market Definition and Boundary",
      "body": "Aven competes in the US home equity line of credit (HELOC) market, specifically in the segment that interfaces HELOC facilities with card-spending rails. A HELOC is a revolving, variable-rate credit facility secured by the borrower's home equity, typically drawn upon during a 10-year draw period and repaid over a 10-to-20-year amortization window. Aven's positioning is at the intersection of two large markets: the HELOC product market (balances outstanding: $446 billion as of Q1 2026) and the general-purpose revolving credit card market ($1.33 trillion in revolving consumer credit outstanding per Fed G.19 Q1 2026). Aven's HELOC-backed Visa card allows homeowners to access their equity with credit-card-style convenience while paying HELOC-level interest rates (currently approximately 10-11% APR, versus the national HELOC average of 7.41% and average credit card APR above 20%). The core market boundary includes all US homeowners with sufficient equity, a prime-plus credit profile (700+ FICO), and the desire to access equity for consumption, debt consolidation, or home improvement. Excluded from the immediate TAM are reverse mortgages (senior population-specific), unsecured personal loans, closed-end home equity loans (HELs), and cash-out refinancings (first-lien substitutes). Key status-quo substitutes compete across three vectors: traditional bank HELOC origination (35-plus-day timelines), cash-out refinancing (sacrifices a locked low-rate first mortgage), and high-rate credit cards (convenience without the equity yield).",
      "tableRefs": [
        "TM001"
      ],
      "figureRefs": []
    },
    {
      "title": "Market Size: TAM, SAM, and SOM",
      "body": "Three complementary sizing lenses frame Aven's addressable opportunity. First, the total homeowner equity pool: US homeowners held approximately $34.5 trillion in residential real estate equity as of early 2026 (MeridianLink, citing Federal Reserve data), equivalent to roughly $302,000 per US homeowner. ICE Mortgage Technology estimates $11 trillion of this equity is tappable \u2014 borrowable while maintaining a 20% equity-cushion LTV \u2014 serving as the broadest plausible TAM ceiling. Second, the active HELOC market: NY Fed Consumer Credit Panel data shows HELOC balances outstanding at $446 billion (Q1 2026), up $44 billion year-over-year and $129 billion above the 2022 trough. HELOC credit limits outstanding crossed $1 trillion for the first time in 2025, per Cotality/FirstClose. Annual originations reached an estimated $311 billion in 2025 across combined open-end HELOCs and closed-end home equity loans. Third, the fintech-eligible SAM: Aven targets homeowners with 700+ FICO scores (average origination FICO in the industry is 771 in 2024 per MBA), sufficient equity (average CLTV at origination is 51%), and digital-native willingness to apply via app in its 41-state footprint. Approximately 65.6% of US households own their home (roughly 87 million homeowner households); of these, an estimated 15 to 20 million meet Aven's credit and equity profile in active states, implying a SAM of $1.5 to $2.5 trillion in aggregate accessible equity (model-derived). At roughly $100,000 average credit line, this represents a 15-to-25-million-line opportunity. Aven's current SOM of $4 billion-plus in issued credit lines (January 2026) against $446 billion outstanding HELOC represents less than 1% market penetration, indicating substantial runway even on conservative SAM assumptions. HELOC debt outstanding is projected to grow 9.8% in 2025 and 9.5% in 2026 per MBA lender expectations, expanding the addressable base annually.",
      "tableRefs": [
        "TM002"
      ],
      "figureRefs": [
        "FM001",
        "FM002"
      ]
    },
    {
      "title": "Market Dynamics, Growth Drivers, and Constraints",
      "body": "Three structural forces drive accelerating HELOC demand through 2026. First, the mortgage rate lock-in effect: as of end-2023, nearly 70% of outstanding US mortgages were originated at rates 3 or more percentage points below prevailing rates, strongly disincentivizing cash-out refinancing. Homeowners seeking liquidity are thus pushed toward second-lien instruments like HELOCs rather than sacrificing sub-3% first mortgages. The NY Fed Liberty Street Economics blog documented this phenomenon in August 2024, showing HELOC originations rebounding 20% from the 2021 trough even as overall mortgage volumes collapsed. Second, record home equity levels: at $34.5 trillion total and $11 trillion tappable, the equity pool underpins both demand and credit quality. In Q1 2025, only 0.41% of tappable equity was actually accessed (MeridianLink), signaling enormous latent demand against relatively low conversion rates. Second-lien home equity withdrawals reached $116 billion in 2025 \u2014 the highest since 2007 \u2014 confirming volume recovery. Third, debt consolidation demand: MBA 2025 Home Equity Lending Study found 39% of HELOC borrowers cited debt consolidation as their primary purpose in 2024, up from 25% in 2022. With credit card balances at $1.25 trillion (NY Fed Q1 2026) and average APRs exceeding 20%, the arbitrage opportunity is clear.\n\nConstraints on adoption are real and explain why penetration remains low. Federal Reserve rate policy is the primary external variable: the Fed held its benchmark rate unchanged for the third consecutive meeting in May 2026 (Bankrate May 2026), keeping HELOC rates elevated relative to 2020-21 levels. Consumer awareness and trust are also constraints: MeridianLink 2026 survey found only 3 in 10 homeowners were actively considering home equity products, and 32% of approved HELOC borrowers never draw on their lines. Traditional bank processing timelines (average 39 days to close per MBA) and 50% application close rates reflect systemic friction that fintech entrants like Aven are attempting to disrupt. Regulatory complexity under CFPB Regulation Z (TILA Section 1026.40) and state-level mortgage licensing requirements create compliance barriers to national expansion. Finally, HELOC delinquency risk is a tail risk: the FDIC 2026 Risk Review identifies home equity lending growth as a watch item as HELOC balances normalize toward historical levels.",
      "tableRefs": [
        "TM004"
      ],
      "figureRefs": [
        "FM004"
      ]
    },
    {
      "title": "Competitive Landscape Overview",
      "body": "The HELOC market is dominated by large depositories but is being disrupted by fintech-native lenders. Among bank lenders, Bank of America led with $10.4 billion in home equity production in 2025 (up from $8.9B in 2024), while Huntington generated $4.2 billion and JPMorgan Chase re-entered the HELOC market in 2025 after a multi-year absence. Among non-bank fintech lenders, Figure Lending claims to be the number one non-bank HELOC lender with $8.3 billion in originations in 2025, while Better originated $0.9 billion. Aven's $4 billion-plus in issued credit lines places it competitively against Better, though below Figure, in the fintech segment. Aven's structural differentiation is its card-interface product: it enables credit-card-style spending from a HELOC facility, which most traditional lenders do not offer in this form. This positions Aven in a distinct micromarket \u2014 HELOC-as-card \u2014 where its primary direct competitors are Figure (which offers a fast digital HELOC) and SpringEQ, rather than the broad bank HELOC market. Key competitive moats in HELOC fintech are: automated valuation technology (AVM used for 47% of HELOC originations in 2024 per MBA), digital onboarding speed (Aven claims 15 minutes vs 39-day bank average), and banking-as-a-service partnerships (Aven uses Coastal Community Bank as its issuing partner).",
      "tableRefs": [
        "TM003"
      ],
      "figureRefs": [
        "FM003"
      ]
    }
