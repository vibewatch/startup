      "id": "capital-scale-and-milestones",
      "title": "Capital formation and scale jumped sharply between Series D and Series E",
      "body": "Aven\u2019s capital story is unusually concentrated in two publicly visible rounds. The July 2024 Series D raised $142 million at a $1 billion valuation and publicly named Khosla Ventures, General Catalyst, Caffeinated Capital, Electric Capital, Founders Fund, and The General Partnership. The September 2025 Series E added $110 million at a $2.2 billion post-money valuation, with Khosla Ventures leading and General Catalyst, Caffeinated Capital, GIC, Electric Capital, and Founders Fund participating. Tracxn\u2019s current company profile aligns with those round sizes and reports $252 million of total disclosed funding, suggesting that the public evidence base is strongest from Series D onward while earlier financing is not well exposed. The operating scale narrative also improved materially between those rounds. Aven said it had issued more than $1.5 billion of credit lines by July 2024, more than $3 billion by September 2025, and more than $4 billion of loans by January 2026. Reported customer signals moved from 33,000 cardholders in July 2024 to tripled customer growth year over year in 2025 and more than 75,000 customers by January 2026. Those claims are sufficient to show real scale, even though exact current customer and employee counts remain imprecise.",
