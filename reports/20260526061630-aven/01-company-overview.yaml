  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Aven entered 2026 as a late-stage private fintech focused on turning home equity into swipeable consumer credit, with a publicly supported valuation step-up from $1.0 billion in July 2024 to $2.2 billion in September 2025. The strongest retained evidence shows a founder-led San Francisco Bay Area company built around home equity-backed card and cash products, more than $3 billion of issued credit lines by September 2025, and a 2026 push toward mortgage refinancing and broader \u201cmachine banking.\u201d The same record also shows unresolved governance and early-funding opacity, plus active legal and customer-complaint overhangs that matter before later chapters reuse Aven\u2019s headline growth claims."
  },
  "sections": [
    {
      "id": "identity-product-and-positioning",
      "title": "Identity, product stack, and \u201cmachine banking\u201d positioning",
      "body": "Aven\u2019s public identity is now consistent across company pages, press releases, and independent coverage: it is a San Francisco Bay Area fintech built to let homeowners convert housing equity into cheaper everyday borrowing. The flagship proposition is unusual but legible. Aven markets a Home Equity Visa Card that combines a HELOC-like secured line with card-like convenience, 2% unlimited cash back, digital application and notarization, and balance-transfer or cash-out functionality. By 2026 the company was no longer describing itself as a one-product experiment. Public product pages and financing coverage show a broader set that includes Home Equity Cash, Rewards Card, Flexible Cash, Aven Advisor, and an announced move into mortgage refinancing. The strategic narrative tying those products together is what management calls \u201cmachine banking\u201d: automating underwriting, servicing, and notarization so secured consumer credit can be delivered with software-like speed rather than legacy mortgage timelines. That positioning matters because later diligence questions on economics and competition depend on treating Aven not as a generic HELOC lender, but as a vertically designed asset-backed consumer-credit platform.",
