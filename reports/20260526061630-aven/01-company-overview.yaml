      "id": "founders-leadership-and-governance",
      "title": "Founder continuity is clear, but full leadership and governance disclosure is still incomplete",
      "body": "The clearest founder fact in the retained record is that Sadi Khan is Aven\u2019s co-founder and CEO. Independent 2026 speaker and profile pages also give the most usable founder-background detail: Khan previously held product leadership roles at Facebook and Microsoft and studied computer engineering at the University of Waterloo. Aven\u2019s July 2024 Series D release broadens the roster, describing the company as founded in 2019 by Sadi Khan, Collin Wikman, and Murtada Shah, all former Facebook and Square executives. That is enough to support a public founders table, but not enough to claim the company has fully transparent governance. Public materials identify advisory-board additions across 2024 and 2025, yet they do not provide the fuller board-rights, voting-control, or committee picture that investors often want from a company already valued above $2 billion. Aven\u2019s licensing page does at least anchor a public San Francisco mailing address and the Coastal Community Bank issuance relationship. The practical overview conclusion is therefore mixed: founder continuity and founder-market fit are well supported, while governance depth and exact decision-right allocation remain only partially visible from public evidence.",
