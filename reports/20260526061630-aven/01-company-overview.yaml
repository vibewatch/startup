    {
      "id": "adverse-signals-and-open-issues",
      "title": "The adverse record is not fatal, but it is material enough to keep in the overview",
      "body": "The most important overview caution is that Aven\u2019s growth story sits alongside ongoing legal and customer-friction signals. In March 2025 Arianna Marino filed a federal complaint alleging Aven opened a HELOC and triggered a hard credit inquiry without consent; court records show Aven later failed to compel arbitration and appealed that denial. ClassAction.org\u2019s report on the same case adds the allegation that a rewards-link \u201ctechnical bug\u201d may have auto-accepted an offer. Separate court records show a 2023 Lasky complaint over a data-breach notice, even though that case was voluntarily dismissed without prejudice. Customer feedback channels also matter because they speak to operational trust in a product secured by a borrower\u2019s home. BBB\u2019s 2026 profile showed 117 complaints over three years and complaint examples that included suspected fraudulent applications and identity-verification failures. Bankrate and NerdWallet both emphasize the core downside that also underpins Aven\u2019s value proposition: the borrowing is cheaper than unsecured cards because it is secured by the home, so product misuse, servicing failures, or underwriting mistakes can carry materially higher customer stakes than a typical rewards card. That is why these issues belong in the overview rather than being deferred entirely to the financial or risk chapters.",
