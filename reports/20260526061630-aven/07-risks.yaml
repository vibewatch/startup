  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Aven's most significant risks are regulatory/legal (two active FCRA class actions and FDIC oversight via Coastal Community Bank), credit/market (AVM accuracy and property value cyclicality tying revolving credit to real estate collateral), partner dependency (near-total reliance on CCB for FDIC charter, funding, and compliance), and financial (warehouse/ABS market access and profitability timeline). Operational risk is concentrated given ~80 employees and a single-product revenue base. Rising interest rates could reduce HELOC demand while simultaneously compressing net interest margin. Mitigations include AAA-rated ABS, Khosla/GIC backing, and Haven FCU diversification. Three thesis-break scenarios: CCB partnership termination, FCRA class certification with punitive exposure, or sustained property value correction exceeding AVM accuracy bounds."
  },
  "sections": [
    {
      "title": "Regulatory, Legal, and Compliance Risk",
      "body": "Aven operates as a non-bank fintech relying on Coastal Community Bank's FDIC charter and NMLS license (#462289) to originate HELOCs. This bank-partnership model creates regulatory risk at two levels: Aven's own NMLS license (#2042345) in 41 states, and CCB's primary regulator oversight of the partnership program. The FDIC's 2026 Risk Review identified consumer lending compliance, AVM accuracy, and third-party risk management as areas of heightened supervisory focus\u2014directly relevant to Aven's operational model. eCFR Title 12 Part 1026 (Regulation Z) governs HELOC disclosure requirements, and the Federal Register's December 2025 Reg Z threshold update reflects ongoing regulatory evolution in consumer credit. The most acute legal risk is the pair of federal FCRA class action lawsuits: Lasky v. Aven (Dec 2024) and Marino v. Aven (Mar 2025) both allege unauthorized credit inquiries under FCRA Section 1681b. If either case is certified as a class action, the exposure could encompass all applicants who received hard credit pulls during the origination process without adequate consent disclosure. The ClassAction.org complaint PDF (Marin v. Aven) details the specific allegations: that Aven accessed credit reports for HELOC account opening without proper permissible-purpose authorization. NMLS consumer access data confirms Aven's state-level licensing footprint, while the Federal Reserve Consumer Help registry provides the oversight framework for bank-fintech partnerships under examination. Aven's disclosures page outlines its consent framework, but the adequacy of consent capture is the central disputed question in active litigation. BBB complaint data indicates a pattern of FCRA-adjacent customer grievances beyond the class actions. The residual regulatory risk is compounded by the CFPB's ongoing monitoring of HELOC market performance trends, particularly delinquency and dispute rates.",
      "tableRefs": [
        "TR001",
        "TR005"
      ],
      "figureRefs": [
        "FR001",
        "FR003"
      ]
    },
    {
      "title": "Credit, Market, and Collateral Risk",
      "body": "Aven's HELOC-backed credit card product creates a collateral-dependent credit model where loan performance is directly tied to residential property values. FHFA House Price Index data shows regional appreciation trends that can reverse; AVM-based appraisals introduce estimation error in collateral valuation, with the BBB complaint record documenting customer grievances related to unexpected credit-line reductions following automated revaluations. The Federal Reserve charge-off series shows consumer credit charge-off rates at cyclical levels; HELOC-specific charge-offs have historically been correlated with property value corrections. The NY Fed Household Debt report as of Q4 2025 shows US household debt at approximately $19 trillion, with HELOC balances rising to multi-year highs\u2014reflecting demand tailwinds but also increasing system-wide HELOC concentration. Moodys 2026 credit risk outlook identifies commercial real estate correction spillovers and rate sensitivity as primary credit risk vectors for 2026. The FRED prime rate and Federal Reserve G.19 consumer credit data confirm that Aven's variable-rate HELOC is directly tied to benchmark rate movements: a Fed rate increase would raise consumer APR while potentially reducing new origination demand. Aven's credit quality is partially protected by a 700\u2013730+ FICO floor and 89% maximum CLTV, but AVM errors and localized property corrections could pierce these buffers. The Chestnut Mortgage 2026 analysis identifies AVM accuracy in thin-market submarkets as the primary collateral risk for HELOC fintechs. The Fannie Mae 2026 forecast projects moderate home price appreciation but with wide regional variance, increasing the asymmetry risk for Aven's portfolio concentrated in specific metro markets.",
      "tableRefs": [
        "TR002"
      ],
      "figureRefs": [
        "FR002"
      ]
    },
    {
      "title": "Partner, Operational, and Execution Risk",
      "body": "Aven is near-totally dependent on Coastal Community Bank (CCB) for FDIC charter, origination authority, and ABS structure access. The CCB Card Account Agreement governs the origination relationship, and the CCB ABS rating of AAA (December 2025) indicates current confidence in the securitization structure. However, the termination of this partnership\u2014for regulatory, competitive, or commercial reasons\u2014would effectively halt Aven's ability to originate new HELOCs in its current bank-partnership model. The Banking Journal's 2026 NY Fed household debt report and MBA origination data confirm the cyclicality of HELOC origination volumes, creating revenue volatility risk. HousingWire's profile of CEO Sadi Khan highlights the key-person concentration risk inherent in a founder-led company with approximately 80 employees. The Moodys credit risk outlook identifies operational concentration in technology-reliant lending platforms as a systemic concern for 2026. The company's 41-state footprint and AVM infrastructure require ongoing regulatory compliance in each state, with compliance overhead scaling non-linearly as the state roster grows. The mortgage point 2026 outlook notes that housing market policy shifts (FHFA changes, GSE reform, FHA HELOC program changes) could rapidly alter the competitive landscape Aven operates in. Aven's machine banking vision (Series E thesis) introduces execution risk: the auto-backed card and mortgage refinance products require new regulatory approvals, new partner relationships, and significant engineering investment beyond the core HELOC card. With $252M raised and limited profitability runway, capital efficiency under execution stress is a watchpoint for investors. The Fannie Mae forecast notes that origination volumes are sensitive to rate environment, creating demand cyclicality that Aven's warehouse credit lines and ABS pipeline must absorb without covenant breach.",
      "tableRefs": [
        "TR003",
        "TR004"
      ],
      "figureRefs": []
    }
  ],
