  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "Aven's core product is the world's first Visa credit card backed by a HELOC, issued through Coastal Community Bank. Its technology stack is built around automated valuation models (AVMs), ML-driven underwriting, digital notarization, and a mobile-first app\u2014enabling a 15-minute online application replacing a multi-week bank process. The company has four product modules (Home Equity Card, Home Equity Cash, Aven Advisor, and Mortgage Refinancing), with the card as the commercial anchor and Advisor as a top-of-funnel tool. Key technology dependencies include third-party AVM providers, the Visa network, and Coastal Community Bank as the FDIC-insured originator. Trust and compliance controls include NMLS licensing (two entities), FCRA compliance under scrutiny (active class action), and Visa security standards."
  },
  "sections": [
    {
      "id": "product-architecture",
      "title": "Product Modules and Architecture",
      "body": "Aven has four product modules as of May 2026: (1) Home Equity Visa Card\u2014the flagship revolving HELOC-backed credit card available in 41 states, with credit lines of $5K\u2013$250K at variable APR 7.49\u201314.99%; (2) Home Equity Cash\u2014a fixed-rate, fully-drawn HELOC (6.99\u201315.49%, $5K\u2013$400K) for borrowers who prefer stable repayment over revolving access; (3) Aven Advisor\u2014a free financial planning tool with 160K+ members (as of Jul 2024) that tracks all accounts, monitors spending, and serves as a customer acquisition pipeline; and (4) Mortgage Refinancing\u2014an early-stage cash-out refi product (fewer than 12 transactions as of Sep 2025) targeting 10-day approval. The Visa card is the primary commercial and technical innovation: it is the first use of a Visa credit card network on top of a HELOC, combining the convenience of revolving credit card access with the low cost of secured home equity debt. The card is issued by Coastal Community Bank (CCB) under a license from Visa USA; Aven Financial Technologies Inc. is the technology, underwriting, and servicing layer. The card product's revolving structure enables ongoing utilization and repeat interest income without requiring reapplication, unlike traditional one-time HELOC draws.",
      "tableRefs": [
        "TE001",
        "TE002"
      ],
      "figureRefs": [
        "FE001"
      ]
    },
    {
      "id": "technology-stack",
      "title": "Technology Stack and Automated Underwriting",
      "body": "Aven's underwriting is fully automated, eliminating the manual appraisal, notary coordination, and document review steps that make traditional HELOCs take 30\u201345 days. The core underwriting pipeline runs in under 15 minutes and includes: (1) Automated Valuation Model (AVM) from third-party providers to estimate home value; (2) Credit pull and debt-to-income analysis against real-time income verification; (3) Digital notarization\u2014online notary sessions via camera and microphone (most states) replacing in-person notary requirements; and (4) CLTV calculation against property data to set the credit line. Machine learning models drive the underwriting decision, customer risk scoring, and ongoing credit-line management. The mobile app (iOS and Android, seller entity 'AVEN FINANCIAL TECHNOLOGIES, INC', version 1.0.87 as of April 2026, 38.6MB) provides card management, cash-out initiation, balance transfers, and payment. Aven has hired ML Engineers, Data Scientists, and Product Engineers to iterate on underwriting models and risk scoring. The 'machine banking' platform concept\u2014articulated in the Series E announcement\u2014describes an end-state where automation, patented robotics, and large-scale ML handle every step of consumer credit origination, servicing, and capital management. Income verification leverages bank-account data access (similar to Plaid-style aggregation), enabling income parsing without pay stub uploads in most cases. The GTM Engineer role on Aven's job board signals investment in partner channel automation alongside direct-to-consumer acquisition.",
      "tableRefs": [
        "TE003"
      ],
      "figureRefs": [
        "FE002",
        "FE003"
      ]
    },
    {
      "id": "trust-compliance",
      "title": "Trust, Compliance, and IP Differentiation",
      "body": "Aven Financial operates under NMLS license #2042345 (Aven Financial, Inc.) in the states it serves; Coastal Community Bank holds NMLS #462289 as the FDIC-member issuing bank. The card carries all Visa network security standards (PCI DSS compliance is implicit through the CCB/Visa structure). Aven's privacy policy collects usage data and identifiers linked to identity; the App Store listing notes 'Data Used to Track You' includes identifiers. IP differentiation rests on the patent portfolio (referenced in Series E as 'patented robotics'), the proprietary ML underwriting models trained on Aven's own HELOC cohort data, the CCB-Aven banking-as-a-service relationship structure, and the AAA-rated securitization track record. The March 2025 FCRA class action (Marino v. Aven) alleges unauthorized credit-report access and HELOC account opening\u2014a compliance risk that is factually adverse to Aven's trust posture. Aven introduced 'foreclosure protection' for balances under $10K\u2014a customer-facing risk-management feature that differentiates it from non-mortgage fintech lenders. Aven's roadmap (as of Series E) includes auto-backed cards, a broader 'machine banking' platform for multiple asset classes, and mortgage refinancing at scale. Haven Federal Credit Union (NCUA-chartered Dec 2025) will eventually provide deposit-side infrastructure, adding a new compliance regime layer. The combination of NMLS licensing, CCB charter coverage, and Visa network compliance creates a multi-layered but externally validated compliance posture for a non-bank fintech.",
      "tableRefs": [
        "TE004",
        "TE005"
      ],
      "figureRefs": [
        "FE004"
      ]
    }
  ],
