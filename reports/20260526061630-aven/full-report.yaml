companyProfile:
  summary: >-
    Aven is a San Francisco-based fintech company that has built the first home-equity-backed credit card for U.S.
    homeowners. Founded in 2019 by Sadi Khan and Bhanu Narasimhan, Aven uses a proprietary automated-valuation and
    underwriting engine to originate HELOC-backed Visa cards entirely online. Cardholders get access to a revolving
    credit line at rates typically 7.49–14.99% APR—well below traditional credit-card rates—with 2% cash-back on all
    purchases and no annual or closing fees. The company partners with Coastal Community Bank (CCB) as its FDIC-insured
    originating bank, securitises its loans via ABS tranches rated AAA by Fitch, and is expanding into new asset classes
    (auto-backed cards, mortgage refinance) under a 'machine banking' vision. As of January 2026 Aven reports more than
    75,000 cardholders and $4 billion in approved credit lines across 41 states, with estimated ARR exceeding $200
    million.
  foundedDate: '2019-01-01'
  founders:
    - name: Sadi Khan
      role: CEO & Co-founder
      background: Former Google engineering manager; led Google Pay and consumer financial-product teams.
      claimRefs:
        - CO002
    - name: Bhanu Narasimhan
      role: Co-founder
      background: Engineering and product background from prior consumer-finance startups.
      claimRefs:
