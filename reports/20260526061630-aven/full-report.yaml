  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Boundary
        blocks:
          - type: paragraph
            body: >-
              Aven competes in the US home equity line of credit (HELOC) market, specifically in the segment that
              interfaces HELOC facilities with card-spending rails. A HELOC is a revolving, variable-rate credit
              facility secured by the borrower's home equity, typically drawn upon during a 10-year draw period and
              repaid over a 10-to-20-year amortization window. Aven's positioning is at the intersection of two large
              markets: the HELOC product market (balances outstanding: $446 billion as of Q1 2026) and the
              general-purpose revolving credit card market ($1.33 trillion in revolving consumer credit outstanding per
              Fed G.19 Q1 2026). Aven's HELOC-backed Visa card allows homeowners to access their equity with
              credit-card-style convenience while paying HELOC-level interest rates (currently approximately 10-11% APR,
              versus the national HELOC average of 7.41% and average credit card APR above 20%). The core market
              boundary includes all US homeowners with sufficient equity, a prime-plus credit profile (700+ FICO), and
              the desire to access equity for consumption, debt consolidation, or home improvement. Excluded from the
              immediate TAM are reverse mortgages (senior population-specific), unsecured personal loans, closed-end
              home equity loans (HELs), and cash-out refinancings (first-lien substitutes). Key status-quo substitutes
              compete across three vectors: traditional bank HELOC origination (35-plus-day timelines), cash-out
              refinancing (sacrifices a locked low-rate first mortgage), and high-rate credit cards (convenience without
              the equity yield).
            claimRefs: []
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM016
              - CM031
