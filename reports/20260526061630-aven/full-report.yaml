      - number: '3.2'
        title: 'Competitor Profiles: Fintech and Non-Bank Peers'
        blocks:
          - type: paragraph
            body: >-
              Figure Lending is the most direct fintech peer, originated $8.3 billion in HELOCs in 2025 and claims the
              top non-bank originator position. Figure uses a proprietary blockchain-based platform (Provenance
              Blockchain), AVM appraisal, and targets a sub-5-day close. Better.com's One Day HELOC launched in 2024 and
              offers a 24-hour credit decision and 7-business-day funding, competing on speed but with smaller scale
              ($0.9B in 2025). Spring EQ offers both variable- and fixed-rate HELOCs through a wholesale/correspondent
              channel, giving it broad broker distribution but less direct consumer brand presence. Achieve Loans
              (formerly FreedomPlus) entered home equity with a lower minimum FICO (600), targeting underserved
              borrowers. Rocket Mortgage offers a fixed-rate Home Equity Loan (not a HELOC) starting at $45,000 with a
              680+ FICO requirement. Discover Home Loans exited the mortgage business entirely in July 2025 following
              its acquisition by Capital One.
