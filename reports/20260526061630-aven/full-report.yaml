      - number: '2.2'
        title: 'Market Size: TAM, SAM, and SOM'
        blocks:
          - type: paragraph
            body: >-
              Three complementary sizing lenses frame Aven's addressable opportunity. First, the total homeowner equity
              pool: US homeowners held approximately $34.5 trillion in residential real estate equity as of early 2026
              (MeridianLink, citing Federal Reserve data), equivalent to roughly $302,000 per US homeowner. ICE Mortgage
              Technology estimates $11 trillion of this equity is tappable — borrowable while maintaining a 20%
              equity-cushion LTV — serving as the broadest plausible TAM ceiling. Second, the active HELOC market: NY
              Fed Consumer Credit Panel data shows HELOC balances outstanding at $446 billion (Q1 2026), up $44 billion
              year-over-year and $129 billion above the 2022 trough. HELOC credit limits outstanding crossed $1 trillion
              for the first time in 2025, per Cotality/FirstClose. Annual originations reached an estimated $311 billion
              in 2025 across combined open-end HELOCs and closed-end home equity loans. Third, the fintech-eligible SAM:
              Aven targets homeowners with 700+ FICO scores (average origination FICO in the industry is 771 in 2024 per
              MBA), sufficient equity (average CLTV at origination is 51%), and digital-native willingness to apply via
              app in its 41-state footprint. Approximately 65.6% of US households own their home (roughly 87 million
              homeowner households); of these, an estimated 15 to 20 million meet Aven's credit and equity profile in
              active states, implying a SAM of $1.5 to $2.5 trillion in aggregate accessible equity (model-derived). At
              roughly $100,000 average credit line, this represents a 15-to-25-million-line opportunity. Aven's current
              SOM of $4 billion-plus in issued credit lines (January 2026) against $446 billion outstanding HELOC
              represents less than 1% market penetration, indicating substantial runway even on conservative SAM
              assumptions. HELOC debt outstanding is projected to grow 9.8% in 2025 and 9.5% in 2026 per MBA lender
              expectations, expanding the addressable base annually.
