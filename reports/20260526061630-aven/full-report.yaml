  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing
        blocks:
          - type: paragraph
            body: >-
              Aven generates revenue through three primary streams: net interest income on outstanding HELOC balances,
              transaction fees on card usage (cash-out and balance-transfer fees), and interchange income from
              merchant-funded card transactions. The interest-income stream is the dominant driver, as Aven earns the
              spread between its cost of capital (securitized ABS tranches or warehouse lines from Coastal Community
              Bank) and the consumer-facing HELOC rate of 7.49%–14.99% APR. Cash-out and balance-transfer transactions
              each carry a one-time 2.5% fee added to the outstanding balance, providing immediate revenue recognition.
              Interchange on point-of-sale card transactions (Visa network, ~1–2% typical merchant fee share to issuer)
              provides a smaller recurring stream. Aven does not charge annual fees, closing fees, or appraisal fees,
              differentiating it from traditional HELOC lenders and absorbing those costs through efficiency gains from
              automated underwriting. The rewards card (2% cashback on purchases, 7% on hotel bookings) is funded by the
              spread advantage inherent in asset-backed credit vs. unsecured revolving credit. The rewards program (2%
              cashback, funded by interest spread) is a deliberate customer-retention and spend-activation mechanism;
              rewards cost is absorbed within the net interest margin that asset-backed cards generate relative to
              unsecured card issuers. This fee-free acquisition model lowers the effective cost to borrowers and is
              enabled by Aven's automation-driven origination technology.
