              the securitization structure, reducing funding cost risk that would otherwise compress multiples.
              PitchBook's Q1 2026 fintech valuation guide and Finrofca's fintech multiples tracker confirm that the
              median private fintech at Series E is trading at 8–12× ARR, placing Aven near the midpoint of current deal
              terms rather than at an extreme. CBInsights and Tracxn both list Aven as a confirmed unicorn as of
