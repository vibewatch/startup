      - number: '8.2'
        title: Bull / Base / Bear Scenarios and Return Analysis
        blocks:
          - type: paragraph
            body: >-
              The bull case assumes Aven sustains 2.5–3× annual ARR growth through 2028, reaching $500–600M ARR, expands
              to all 50 states via the Haven FCU charter, and executes on mortgage refi and auto-backed card products.
              At a 14–16× ARR multiple (justified by product breadth and profitability onset), enterprise value reaches
              $7–9B. An investor at $2.2B with minimal dilution could earn 3–4× in three years. The base case assumes
              1.5–2× ARR growth, reaching $400M ARR by 2028, with the HELOC card as primary product. At 10–12× ARR,
              enterprise value reaches $4–5B—approximately 2× from the 2025 entry price. The bear case assumes FCRA
              class action certification leads to a settlement of $50–150M, CCB partnership is renegotiated (cost
              increase), and growth slows to 50% annual. ARR reaches $300M by 2028 at 6–7× multiple, implying a
              $1.8–2.1B exit near flat to 2025 entry. A further adverse scenario (CCB partner termination) could be
              existential. The key question for investors is whether Aven's premium multiple can be sustained through
              FCRA resolution; historical analogies include SoFi's multiple compression during its SPAC period and
              LendingClub's post-IPO de-rating. Multiples.vc data confirms that online lending public comps traded at
              2–8× revenue during 2023–2025, though private market premiums are typically 2–3× higher. Return analysis
              must also account for preference overhang: with $252M raised, investors entering at $2.2B will need to
              verify liquidation preferences and option pool dilution from a full equity waterfall.
            claimRefs: []
          - type: table
            tableRef: TV003
            claimRefs: []
      - number: '8.3'
        title: Comparable Set, Exit Readiness, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The most relevant comparable set for Aven spans two dimensions: (1) consumer fintech lenders with HELOC or
              home equity exposure and (2) high-growth consumer fintech platforms. SoFi is the closest public analog—a
              diversified consumer fintech that holds a bank charter—but trades at lower multiples due to its
              diversified revenue base. Figure.com remains the closest private HELOC fintech peer, last publicly valued
              around $1.5B in 2024, suggesting Aven's 2025 premium is defensible on growth differential. For exit
              readiness, Aven has the financial scale ($200M+ ARR), regulatory foundation (NMLS 41-state), and
              institutional investor backing (GIC, Khosla) for a 2027–2028 IPO window if interest rates stabilize and
              the FCRA matters resolve. Strategic acquirers—major banks, mortgage servicers, or large credit card
              issuers—could be motivated by Aven's AVM technology and customer acquisition model. The adverse case for
              this analysis: the Lasky v. Aven class action (if certified) represents meaningful multiple compression
              risk, potentially worth 20–40% of enterprise value if a large settlement is required. BBB complaint
              patterns also create regulatory risk for strategic acquirers who would inherit the compliance profile.
              Fintech multiples as of Q1 2026 (Finrofca tracker) show private company ARR multiples in the 8–14× range
              for high-growth consumer fintechs; Aven's 11× appears fair given its growth rate, collateral quality, and
              market position. Final diligence priorities: (1) FCRA case status and settlement probability, (2) vintage
              cohort credit performance, (3) CCB contract terms and renewal timeline, (4) warehouse credit line
              concentrations, and (5) management-confirmed ARR definition (gross vs. net interest income).
            claimRefs: []
