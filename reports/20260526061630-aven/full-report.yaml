  productSummary: >-
    Aven Card: a Visa credit card where the revolving line of credit is secured by the homeowner's equity (HELOC).
    Issued by Coastal Community Bank (NMLS #462289). Rates 7.49–14.99% APR, 2% cashback, 7% hotel cashback, no
    annual/closing fees, 89% max CLTV. Online application resolves in minutes via automated AVM and credit-bureau pulls.
    Secondary product: 'Aven Advisor' personalised rate/refinance recommendations.
  customerFocus: >-
    U.S. homeowners aged 30–55 with FICO scores ≥700 seeking low-rate revolving credit or home-equity monetisation
    without full HELOC complexity.
  businessModel: >-
    Interest income on revolving balances at 7.49–14.99% APR; interchange revenue (2% cashback model funded by
    interchange); origination pipeline monetised via ABS securitisation. Net interest margin is primary revenue driver;
    Aven also earns servicing and securitisation fees.
  stage: Series E (private unicorn)
