      - number: '2.4'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              The HELOC market is dominated by large depositories but is being disrupted by fintech-native lenders.
              Among bank lenders, Bank of America led with $10.4 billion in home equity production in 2025 (up from
              $8.9B in 2024), while Huntington generated $4.2 billion and JPMorgan Chase re-entered the HELOC market in
              2025 after a multi-year absence. Among non-bank fintech lenders, Figure Lending claims to be the number
              one non-bank HELOC lender with $8.3 billion in originations in 2025, while Better originated $0.9 billion.
              Aven's $4 billion-plus in issued credit lines places it competitively against Better, though below Figure,
              in the fintech segment. Aven's structural differentiation is its card-interface product: it enables
              credit-card-style spending from a HELOC facility, which most traditional lenders do not offer in this
              form. This positions Aven in a distinct micromarket — HELOC-as-card — where its primary direct competitors
              are Figure (which offers a fast digital HELOC) and SpringEQ, rather than the broad bank HELOC market. Key
              competitive moats in HELOC fintech are: automated valuation technology (AVM used for 47% of HELOC
              originations in 2024 per MBA), digital onboarding speed (Aven claims 15 minutes vs 39-day bank average),
              and banking-as-a-service partnerships (Aven uses Coastal Community Bank as its issuing partner).
            claimRefs: []
          - type: table
            tableRef: TM003
            claimRefs:
