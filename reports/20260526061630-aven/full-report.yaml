      - number: '5.2'
        title: Technology Stack and Automated Underwriting
        blocks:
          - type: paragraph
            body: >-
              Aven's underwriting is fully automated, eliminating the manual appraisal, notary coordination, and
              document review steps that make traditional HELOCs take 30–45 days. The core underwriting pipeline runs in
              under 15 minutes and includes: (1) Automated Valuation Model (AVM) from third-party providers to estimate
              home value; (2) Credit pull and debt-to-income analysis against real-time income verification; (3) Digital
              notarization—online notary sessions via camera and microphone (most states) replacing in-person notary
              requirements; and (4) CLTV calculation against property data to set the credit line. Machine learning
              models drive the underwriting decision, customer risk scoring, and ongoing credit-line management. The
              mobile app (iOS and Android, seller entity 'AVEN FINANCIAL TECHNOLOGIES, INC', version 1.0.87 as of April
              2026, 38.6MB) provides card management, cash-out initiation, balance transfers, and payment. Aven has
              hired ML Engineers, Data Scientists, and Product Engineers to iterate on underwriting models and risk
              scoring. The 'machine banking' platform concept—articulated in the Series E announcement—describes an
              end-state where automation, patented robotics, and large-scale ML handle every step of consumer credit
              origination, servicing, and capital management. Income verification leverages bank-account data access
              (similar to Plaid-style aggregation), enabling income parsing without pay stub uploads in most cases. The
              GTM Engineer role on Aven's job board signals investment in partner channel automation alongside
              direct-to-consumer acquisition.
