      - number: '3.3'
        title: 'Aven''s Differentiation: HELOC-Card Fusion'
        blocks:
          - type: paragraph
            body: >-
              Aven's core differentiation is the fusion of a home equity line of credit with a Visa credit card and a
              rewards program—an architecture that no traditional bank or pure-play fintech HELOC lender has matched at
              scale. Aven enables daily spending on the HELOC at roughly 10–11% APR versus the 21% industry average for
              unsecured credit cards, representing an ~1,000 basis-point structural rate advantage. The application
              takes under 15 minutes online using automated AVM and no notary requirement in most states. US Bank offers
              a Visa Access Card tied to its HELOC, but requires an existing US Bank personal checking account and is
              unavailable in all 50 states. Canadian bank BMO offers a comparable Homeowner ReadiLine that bundles a
              mortgage with a revolving line accessible via debit, but it is not available to US customers. The
              HELOC-card fusion thus remains a largely unoccupied competitive position in the US market. Aven's
              AVM-based instant appraisal eliminates the need for physical home inspection in most states, reducing
              friction significantly compared to traditional underwriting. The rewards program—up to 2% cashback—is
              economically possible because the HELOC interest income is substantially higher than unsecured-lending
              card programs, providing enough margin to fund rewards while remaining cheaper than any unsecured card for
              the borrower.
            claimRefs: []
      - number: '3.4'
        title: Moat Analysis and Competitive Risks
        blocks:
          - type: paragraph
            body: >-
              Aven's moat rests on three reinforcing pillars: (1) product architecture (HELOC-card fusion requiring
              simultaneous underwriting, banking, and card issuance capabilities), (2) data flywheel (AVM + spending
              data improves underwriting accuracy over time), and (3) the Haven Federal Credit Union charter (approved
              December 2025), which allows Aven to own the deposit relationship rather than depend entirely on Coastal
              Community Bank as sponsor. Key risks include: large banks could replicate the card-on-HELOC product using
              their balance-sheet advantage; the HELOC market is rate-sensitive and slows significantly if home prices
              fall; and Aven's reliance on Coastal Community Bank as primary origination partner prior to full
              deployment of the credit union charter creates regulatory and operational concentration risk. Figure's
              $8.3B origination volume exceeds Aven's cumulative $4B+ issued credit, and Figure's capital markets
              capabilities (Figure Marketplace) could allow it to undercut on rate if secondary-market conditions
              improve. FDIC supervisory data for 2026 highlights rising home equity credit-quality concerns
              industry-wide (SP026/CP036), creating potential for banks to face tighter constraints that Aven—as a
              non-bank—does not face under equivalent direct FDIC oversight.
