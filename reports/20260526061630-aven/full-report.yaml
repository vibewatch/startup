  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Compliance Risk
        blocks:
          - type: paragraph
            body: >-
              Aven operates as a non-bank fintech relying on Coastal Community Bank's FDIC charter and NMLS license
              (#462289) to originate HELOCs. This bank-partnership model creates regulatory risk at two levels: Aven's
              own NMLS license (#2042345) in 41 states, and CCB's primary regulator oversight of the partnership
              program. The FDIC's 2026 Risk Review identified consumer lending compliance, AVM accuracy, and third-party
              risk management as areas of heightened supervisory focus—directly relevant to Aven's operational model.
              eCFR Title 12 Part 1026 (Regulation Z) governs HELOC disclosure requirements, and the Federal Register's
              December 2025 Reg Z threshold update reflects ongoing regulatory evolution in consumer credit. The most
              acute legal risk is the pair of federal FCRA class action lawsuits: Lasky v. Aven (Dec 2024) and Marino v.
              Aven (Mar 2025) both allege unauthorized credit inquiries under FCRA Section 1681b. If either case is
              certified as a class action, the exposure could encompass all applicants who received hard credit pulls
              during the origination process without adequate consent disclosure. The ClassAction.org complaint PDF
              (Marin v. Aven) details the specific allegations: that Aven accessed credit reports for HELOC account
              opening without proper permissible-purpose authorization. NMLS consumer access data confirms Aven's
              state-level licensing footprint, while the Federal Reserve Consumer Help registry provides the oversight
              framework for bank-fintech partnerships under examination. Aven's disclosures page outlines its consent
              framework, but the adequacy of consent capture is the central disputed question in active litigation. BBB
              complaint data indicates a pattern of FCRA-adjacent customer grievances beyond the class actions. The
              residual regulatory risk is compounded by the CFPB's ongoing monitoring of HELOC market performance
              trends, particularly delinquency and dispute rates.
