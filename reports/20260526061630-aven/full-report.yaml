  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Modules and Architecture
        blocks:
          - type: paragraph
            body: >-
              Aven has four product modules as of May 2026: (1) Home Equity Visa Card—the flagship revolving
              HELOC-backed credit card available in 41 states, with credit lines of $5K–$250K at variable APR
              7.49–14.99%; (2) Home Equity Cash—a fixed-rate, fully-drawn HELOC (6.99–15.49%, $5K–$400K) for borrowers
              who prefer stable repayment over revolving access; (3) Aven Advisor—a free financial planning tool with
              160K+ members (as of Jul 2024) that tracks all accounts, monitors spending, and serves as a customer
              acquisition pipeline; and (4) Mortgage Refinancing—an early-stage cash-out refi product (fewer than 12
              transactions as of Sep 2025) targeting 10-day approval. The Visa card is the primary commercial and
              technical innovation: it is the first use of a Visa credit card network on top of a HELOC, combining the
              convenience of revolving credit card access with the low cost of secured home equity debt. The card is
              issued by Coastal Community Bank (CCB) under a license from Visa USA; Aven Financial Technologies Inc. is
              the technology, underwriting, and servicing layer. The card product's revolving structure enables ongoing
              utilization and repeat interest income without requiring reapplication, unlike traditional one-time HELOC
              draws.
