      - number: '1.1'
        title: Identity, product stack, and “machine banking” positioning
        blocks:
          - type: paragraph
            body: >-
              Aven’s public identity is now consistent across company pages, press releases, and independent coverage:
              it is a San Francisco Bay Area fintech built to let homeowners convert housing equity into cheaper
              everyday borrowing. The flagship proposition is unusual but legible. Aven markets a Home Equity Visa Card
              that combines a HELOC-like secured line with card-like convenience, 2% unlimited cash back, digital
              application and notarization, and balance-transfer or cash-out functionality. By 2026 the company was no
              longer describing itself as a one-product experiment. Public product pages and financing coverage show a
              broader set that includes Home Equity Cash, Rewards Card, Flexible Cash, Aven Advisor, and an announced
              move into mortgage refinancing. The strategic narrative tying those products together is what management
              calls “machine banking”: automating underwriting, servicing, and notarization so secured consumer credit
              can be delivered with software-like speed rather than legacy mortgage timelines. That positioning matters
              because later diligence questions on economics and competition depend on treating Aven not as a generic
              HELOC lender, but as a vertically designed asset-backed consumer-credit platform.
