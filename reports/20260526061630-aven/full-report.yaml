        - When does lock-in effect attenuate if rates normalize?
      - - Record tappable home equity ($11T, only 0.41% accessed Q1 2025)
        - Driver
        - Current
        - Latent demand vastly exceeds current penetration; conversion is the binding constraint
        - What friction prevents conversion beyond 0.41%?
      - - Debt consolidation demand (39% of HELOC usage in 2024, up from 25% in 2022)
        - Driver
        - Growing
        - Recurring demand driver; consumer behavior shift toward home-equity-as-debt-tool
        - Is churn elevated after debt payoff? How sticky are consolidated borrowers?
      - - 'Fed rate hold (3rd consecutive May 2026): HELOC rates at 7.41%'
        - Constraint
        - Ongoing through 2026
        - Higher HELOC rates reduce rate arbitrage vs credit cards; slower demand growth
        - What happens to draw volumes in a +200bp rate shock scenario?
      - - Consumer awareness gap (only 3/10 homeowners considering HE products)
        - Constraint
        - Medium-term
        - Limits near-term market penetration; education cost falls on fintech lenders
        - What is Aven's customer acquisition cost and payback period?
      - - 'Traditional bank processing time: avg 39 days vs Aven ~15 minutes'
        - Driver (Aven advantage)
        - Now
        - Clear UX moat; Aven targets conversion above 50% industry benchmark (MBA)
        - How does Aven's close rate compare to the 50% industry benchmark?
      - - 'HELOC delinquency risk: FDIC 2026 Risk Review flags home equity growth'
        - Constraint / Risk
