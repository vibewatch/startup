      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Mortgage lock-in structurally re-routes equity extraction to HELOCs
            body: >-
              With nearly 70% of US mortgage balances locked at rates 3+ percentage points below current levels,
              cash-out refinancing is economically unattractive for most homeowners. This structural dynamic is the
              single largest demand driver for HELOCs — and for Aven — through at least 2027, as rate normalization will
              be slow and gradual given the distribution of fixed-rate mortgage maturities.
            calloutType: insight
            claimRefs:
              - CM022
              - CM023
          - type: callout
            title: Only 0.41% of tappable equity was accessed in Q1 2025, reflecting a conversion problem
            body: >-
              Despite $11 trillion in tappable equity, draws in Q1 2025 were a tiny fraction of available capacity. The
              32% of approved HELOC holders who never touch their funds (MeridianLink) suggests conversion and
              utilization are binding constraints, not equity availability. Aven's flywheel depends on moving homeowners
              from approved to active drawer, which is not assured even with a fast approval process.
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
          - type: callout
            title: Over $1,000 annual interest savings per household vs credit card debt
            body: >-
              A homeowner carrying a $10,000 credit card balance at 20% APR ($2,000/year) who transfers to a HELOC at
              Aven's ~10% APR ($1,000/year) saves approximately $1,000 annually. With average credit card balances
              exceeding $6,000 per cardholder and many borrowers carrying $20,000 or more, the lifetime value of
              debt-consolidating HELOC customers is significant — and the recurring nature of revolving balances
              suggests re-draw potential.
            calloutType: strength
            claimRefs:
              - CM016
              - CM019
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Aven operates at the intersection of home equity lending and consumer credit, a space that spans large
              incumbent banks, fintech HELOC lenders, and adjacent credit-card issuers. The competitive universe has
              three tiers: (1) mega-banks (Bank of America, US Bank, JPMorgan Chase, Wells Fargo) that collectively
              dominate origination volumes through branch distribution and existing banking relationships; (2) fintech
              HELOC lenders (Figure, Better.com, Spring EQ, Achieve) that compete on digital speed and streamlined
              processing; and (3) alternative equity products (Point.com HEI, Hometap) that serve equity-rich but
              cash-flow-constrained homeowners. Aven's unique position is a hybrid of category 2 on the lending side and
              a consumer-spending product (Visa card with rewards) that no direct competitor replicates at scale as of
              May 2026.
