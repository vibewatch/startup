  "sections": [
    {
      "title": "Competitive Landscape Overview",
      "body": "Aven operates at the intersection of home equity lending and consumer credit, a space that spans large incumbent banks, fintech HELOC lenders, and adjacent credit-card issuers. The competitive universe has three tiers: (1) mega-banks (Bank of America, US Bank, JPMorgan Chase, Wells Fargo) that collectively dominate origination volumes through branch distribution and existing banking relationships; (2) fintech HELOC lenders (Figure, Better.com, Spring EQ, Achieve) that compete on digital speed and streamlined processing; and (3) alternative equity products (Point.com HEI, Hometap) that serve equity-rich but cash-flow-constrained homeowners. Aven's unique position is a hybrid of category 2 on the lending side and a consumer-spending product (Visa card with rewards) that no direct competitor replicates at scale as of May 2026.",
      "tableRefs": [
        "TP001"
      ],
      "figureRefs": [
        "FP001"
      ]
    },
    {
      "title": "Competitor Profiles: Fintech and Non-Bank Peers",
      "body": "Figure Lending is the most direct fintech peer, originated $8.3 billion in HELOCs in 2025 and claims the top non-bank originator position. Figure uses a proprietary blockchain-based platform (Provenance Blockchain), AVM appraisal, and targets a sub-5-day close. Better.com's One Day HELOC launched in 2024 and offers a 24-hour credit decision and 7-business-day funding, competing on speed but with smaller scale ($0.9B in 2025). Spring EQ offers both variable- and fixed-rate HELOCs through a wholesale/correspondent channel, giving it broad broker distribution but less direct consumer brand presence. Achieve Loans (formerly FreedomPlus) entered home equity with a lower minimum FICO (600), targeting underserved borrowers. Rocket Mortgage offers a fixed-rate Home Equity Loan (not a HELOC) starting at $45,000 with a 680+ FICO requirement. Discover Home Loans exited the mortgage business entirely in July 2025 following its acquisition by Capital One.",
      "tableRefs": [
        "TP002",
        "TP003"
      ],
      "figureRefs": [
        "FP002"
      ]
    },
    {
      "title": "Aven's Differentiation: HELOC-Card Fusion",
      "body": "Aven's core differentiation is the fusion of a home equity line of credit with a Visa credit card and a rewards program\u2014an architecture that no traditional bank or pure-play fintech HELOC lender has matched at scale. Aven enables daily spending on the HELOC at roughly 10\u201311% APR versus the 21% industry average for unsecured credit cards, representing an ~1,000 basis-point structural rate advantage. The application takes under 15 minutes online using automated AVM and no notary requirement in most states. US Bank offers a Visa Access Card tied to its HELOC, but requires an existing US Bank personal checking account and is unavailable in all 50 states. Canadian bank BMO offers a comparable Homeowner ReadiLine that bundles a mortgage with a revolving line accessible via debit, but it is not available to US customers. The HELOC-card fusion thus remains a largely unoccupied competitive position in the US market. Aven's AVM-based instant appraisal eliminates the need for physical home inspection in most states, reducing friction significantly compared to traditional underwriting. The rewards program\u2014up to 2% cashback\u2014is economically possible because the HELOC interest income is substantially higher than unsecured-lending card programs, providing enough margin to fund rewards while remaining cheaper than any unsecured card for the borrower.",
      "tableRefs": [],
      "figureRefs": []
    },
    {
      "title": "Moat Analysis and Competitive Risks",
      "body": "Aven's moat rests on three reinforcing pillars: (1) product architecture (HELOC-card fusion requiring simultaneous underwriting, banking, and card issuance capabilities), (2) data flywheel (AVM + spending data improves underwriting accuracy over time), and (3) the Haven Federal Credit Union charter (approved December 2025), which allows Aven to own the deposit relationship rather than depend entirely on Coastal Community Bank as sponsor. Key risks include: large banks could replicate the card-on-HELOC product using their balance-sheet advantage; the HELOC market is rate-sensitive and slows significantly if home prices fall; and Aven's reliance on Coastal Community Bank as primary origination partner prior to full deployment of the credit union charter creates regulatory and operational concentration risk. Figure's $8.3B origination volume exceeds Aven's cumulative $4B+ issued credit, and Figure's capital markets capabilities (Figure Marketplace) could allow it to undercut on rate if secondary-market conditions improve. FDIC supervisory data for 2026 highlights rising home equity credit-quality concerns industry-wide (SP026/CP036), creating potential for banks to face tighter constraints that Aven\u2014as a non-bank\u2014does not face under equivalent direct FDIC oversight.",
      "tableRefs": [
        "TP004"
      ],
      "figureRefs": [
        "FP003"
      ]
    }
