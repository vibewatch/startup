  - id: TP002
    title: Capability and diligence matrix
    columns:
      - Buying criterion
      - Bose Quantum
      - Chinese superconducting or academic platforms
      - Global trapped-ion or superconducting platforms
      - Other photonic peers
      - Classical or internal build
    rows:
      - ["Near-room-temperature quantum operation", "Reported advantage of the photonic route", "Generally requires cryogenic operation for superconducting systems", "Modality-dependent; superconducting requires cryogenics", "Photonic route supports near-room-temperature operation", "Not a quantum-system requirement"]
      - ["Specialized optimization deployment", "Reported institutional deliveries and project work", "Commercial cloud access and state platforms reported; workload comparability unknown", "Available platforms, but assigned evidence has no matching deployment comparison", "Product scope reported; matching deployments unknown", "Established substitute; quantum-relative outcome unknown"]
      - ["General-purpose fault-tolerant computing", "Not established in public evidence", "Policy goal and research direction, not demonstrated commercial parity", "Multiple approaches under development; no consensus winner", "Not established in assigned evidence", "Not applicable"]
      - ["Production and hardware scale-up", "Shenzhen factory and chip pilot-line plan reported", "State-guided industrial capacity reported", "Large corporate and venture ecosystems reported", "Scale unknown in assigned evidence", "Existing supply chains, but not comparable quantum hardware"]
      - ["Independent workload benchmark", "Unknown; no retained reproducible comparison", "Selected research benchmarks exist but are not Bose workload comparisons", "Google benchmark cited by USCC is not a Bose comparison", "Unknown in assigned evidence", "Required baseline was not retained"]
      - ["Public price and contract economics", "Unknown", "Unknown", "Unknown", "Unknown", "Buyer-specific internal cost; not retained"]
    notes: >-
      Cells distinguish route-level characteristics from company-level proof. "Unknown" means the
      assigned successful source pool did not support the comparison, not that a capability is absent.
    claimRefs: [CP002, CP005, CP011, CP012, CP013, CP014, CP015]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Alternative or offer
      - Contract model
      - Public price or unit
      - Included capabilities
      - Competitive implication
    rows:
      - [Bose physical system, "Equipment sale and deployment", Unknown, "Specialized photonic computer; implementation scope not fully disclosed", "Creates an installed-base motion but exposes buyers to hardware and support dependency"]
      - [Bose quantum cloud, Subscription reported, Unknown, "Remote compute and developer tooling reported", "Lowers initial access friction; usage-to-revenue economics remain undisclosed"]
      - [Bose task-based bank service, "Customized project or service", Unknown, "Compute interface, optimization-matrix work, data validation, and customized algorithms", "Domain services can differentiate the bundle and raise integration switching costs"]
      - [Named quantum peers, "Hardware, cloud, or full-stack models vary by vendor", Unknown, "Modality- and vendor-specific platform capabilities", "No assigned pricing evidence supports a total-cost comparison"]
      - [Classical HPC or internal team, "Owned infrastructure, cloud consumption, or internal labor", Unknown, "Existing solver stack and workflow control", "Remains the default substitute until quantum outcome and cost advantages are reproducible"]
    notes: >-
      No assigned source discloses list price, realized price, usage unit, discount, term, renewal,
      gross margin, or total implementation cost; all price cells are intentionally marked unknown.
    claimRefs: [CP001, CP006, CP007]
