      Scores are evidence-backed ordinal judgments on a 1–5 scale, not measured market shares,
      performance benchmarks, or equal-interval quantities. Missing disclosure lowers evidence
      visibility and does not prove weak underlying capability.
    claimRefs: [CP002, CP005, CP008, CP009, CP010, CP011, CP012, CP016]
callouts:
  - calloutType: risk
    title: Benchmark risk dominates headline qubit counts
    body: >-
      Qubit totals across photonic, superconducting, trapped-ion, and neutral-atom systems do not
      establish comparable useful performance. Underwriting requires matched workloads, solution
      quality, runtime, uptime, error behavior, and classical baselines.
    claimRefs: [CP012, CP013, CP014]
  - calloutType: recommendation
    title: Diligence the commercial moat through repeat behavior
    body: >-
      Request customer-level renewals, repeat orders, multi-homing, realized pricing, support burden,
      and migration effort before assigning value to distribution or lock-in.
    claimRefs: [CP006, CP007, CP016]
