              - CO008
              - CO009
              - CO010
              - CO012
              - CO015
      - number: '1.2'
        title: Capital and stakeholder structure
        blocks:
          - type: paragraph
            body: >-
              The clearest financing event is the March 2026 Series B: YiCai, Xinhua, The Quantum Insider, and Quantum
              Computing Report each describe CNY1 billion, approximately $145 million. The announced use of proceeds
              emphasizes product research, photonic-chip process improvement, a pilot chip-production line, factory
              expansion, and quantum-plus-AI applications. The investor group is unusually state-linked and
              institution-heavy, including Beijing Financial Holdings Group, ICBC Capital, Shenzhen Investment Holdings,
              and other public or financial sponsors. A July report then described a separate pre-IPO financing worth
              several hundred million yuan, but it relied on a reporting chain through Binance and Jiemian and
              explicitly framed the event as needing confirmation. No retained source discloses post-money valuation,
              security type, liquidation preferences, debt, or secondary-sale terms.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
      - number: '1.3'
        title: Team, production, and deployments
        blocks:
          - type: paragraph
            body: >-
              Public leadership visibility is concentrated on founder-CEO Wen Kai; the assigned evidence does not name a
              chief financial officer, chief operating officer, board chair, or independent directors. Company
              information relayed by The Quantum Insider says research personnel are roughly 70% of the workforce and
              about 65% of employees hold master's or doctoral degrees, but no absolute headcount is disclosed.
              Operational evidence is more concrete: reporting says the Shenzhen factory began production in November
              2025, and the company claims deliveries to the National Supercomputing Center in Chengdu, China Mobile,
              Beijing Electronic Zone High-tech Group, and North China University of Technology. Those named deployments
              show institutional access, not paid-customer economics, renewals, utilization, or production yield.
            claimRefs:
              - CO002
              - CO003
              - CO009
              - CO010
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
