chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating thesis
        blocks:
          - type: paragraph
            body: >-
              Bose Quantum and the English-language QBoson brand refer to the same Beijing photonic-quantum-computing
              company. Independent coverage places its founding in late 2020, while Tracxn lists 2021, so the exact
              legal-incorporation date should not be treated as settled. Tracxn identifies Wen Kai as founder and chief
              executive. The company describes a dual strategy: commercialize specialized photonic systems now while
              pursuing fault-tolerant universal computing over a longer horizon. Its official product page lists 100-,
              550- and 1,000-computational-qubit systems and a 3,000-qubit overclock mode. That creates a coherent
              business identity around room-temperature photonic hardware, cloud access, and applied optimization, but
              the broader universal roadmap remains a company claim rather than independently demonstrated capability.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO008
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
