  - id: FP001
    title: Ordinal positioning map — deployment evidence versus platform breadth
    type: quadrant
    summary: >-
      Analyst scoring places disclosed deployment evidence on the horizontal axis and breadth from specialized to
      full-stack or multi-modality capability on the vertical axis.
    data:
      points:
        - label: Bose Quantum
          x: 4
          'y': 3
          detail: Factory and institutional deliveries reported; specialized photonic focus with broader ambitions.
        - label: Origin Quantum
          x: 3
          'y': 4
          detail: Domestic superconducting platform with substantial capital signal; comparable deployments not retained.
        - label: QuantumCTek
          x: 5
          'y': 3
          detail: Strong deployed communications footprint; computing breadth is adjacent rather than directly comparable.
        - label: Quantinuum
          x: 4
          'y': 5
          detail: Large, well-funded full-stack platform with international distribution.
        - label: Turing Quantum
          x: 2
          'y': 3
          detail: Named photonic peer; assigned evidence lacks scale and deployment metrics.
        - label: Quandela and QuiX
          x: 2
          'y': 3
