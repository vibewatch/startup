  - id: FE001
    title: Evidence-bounded product architecture map
    type: stack
    summary: >-
      Public disclosures describe a workload-to-manufacturing stack, while the developer access surface and independent
      control evidence remain gaps.
    data:
      layers:
        - label: Industry workloads
          detail: Drug, materials, brain-science, power-system, and finance scenarios are reported without measured outcomes.
        - label: Developer and integration surface
          detail: >-
            Public SDK, API, cloud architecture, package, and integration evidence was not found in the assigned
            sources.
        - label: AI-assisted orchestration
          detail: >-
            The next-generation system carries a company-reported 7 by 16 hour stability claim and a plan to integrate
            quantum compute with classical AI.
        - label: Specialized photonic systems
          detail: Reported product scales are 100, 550, and 1,000 qubits for specialized tasks.
        - label: Universal photonic roadmap
          detail: A universal photonic chip announcement supports a separate long-term fault-tolerant track.
        - label: Industrial production
          detail: >-
            The Shenzhen factory covers module development, full-system production, quality control, and testing, with a
            chip pilot line planned.
    approximationNotes: >-
      The layer sequence is an analytical organization of disclosed components, not a company-published systems diagram;
      no performance values are estimated.
    claimRefs:
      - CE001
      - CE003
      - CE007
      - CE009
      - CE010
      - CE015
