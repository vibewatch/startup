      - number: '5.2'
        title: Architecture and industrialization model
        blocks:
          - type: paragraph
            body: >-
              The architecture disclosed publicly combines room-temperature photonic compute, AI-assisted system
              control, full-system assembly, and planned photonic-chip pilot production. Photons are used as qubits,
              reducing the need for the extreme cryogenic environment associated with some competing modalities.
              Xinhua's factory report provides the clearest operating-model detail: module development, full-system
              production and manufacturing, and quality-control testing are separate factory divisions. Later reporting
              says production began in November 2025 and describes a planned chip pilot line. This creates a plausible
              path from component engineering to finished systems, but no public yield, throughput, defect-rate, or
              supplier data validates repeatable manufacturing economics.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE013
              - CE014
