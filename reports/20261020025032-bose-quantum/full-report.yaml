              - CE001
              - CE003
              - CE007
              - CE009
              - CE010
              - CE015
      - number: '5.3'
        title: Deployment evidence and maturity
        blocks:
          - type: paragraph
            body: >-
              Public deployment evidence is stronger than a pure roadmap claim but still short of production-grade
              validation. Yicai reported deliveries to the National Supercomputing Center in Chengdu, China Mobile,
              Beijing Electronic Zone High-tech Group, and North China University of Technology. Reporting on the
              next-generation machine also repeats a company claim of stable operation for 7 by 16 hours under an
              AI-driven control system. Neither metric is accompanied by uptime methodology, workload success criteria,
              error rates, or an independent acceptance test. Sector benchmarks likewise distinguish enterprise
              engagement and proofs of concept from positive-ROI production use, so named delivery should not be treated
              as verified, durable customer value.
            claimRefs:
              - CE003
              - CE004
              - CE011
              - CE012
      - number: '5.4'
        title: Trust, integration, and technical risk
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not disclose a public SDK, API, package registry, repository, cloud-service
              specification, integration guide, status history, security certification, privacy control, or independent
              product benchmark. That absence does not prove these capabilities do not exist; it makes them material
              diligence requests. External sector analysis also warns that rigorous quantum supply-chain assessment
              needs platform-specific bills of materials and validated substitution paths that are not publicly
              available. A separate industry critique identifies lasers, control electronics, and manufacturing
              processes as scaling bottlenecks. Bose Quantum therefore needs to substantiate its own supplier
              concentration, quality system, incident handling, maintainability, and customer support before factory
              scale can be credited as reliable product scale.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Industrial scale is not yet reliability proof
            body: >-
              A factory, named deliveries, and an extended-runtime claim show engineering progress, but public evidence
              still lacks yield, error-rate, uptime, security, integration-cost, and independently measured customer
              outcomes.
            calloutType: risk
            claimRefs:
              - CE003
              - CE004
              - CE008
              - CE013
              - CE014
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and entry points
        blocks:
          - type: paragraph
            body: >-
              Bose Quantum's disclosed user base spans several distinct populations rather than one homogeneous customer
              cohort. Company-provided figures describe more than 68 million cumulative cloud solution calls, coverage
              of more than 900 universities and colleges, and more than 10,000 participating developers, but none of
              those measures identifies paid accounts, unique active users, or a measurement window. Independent
              reporting adds that the company said roughly 39% of users came from biopharmaceuticals, while universities
              made up much of the remainder. Access through China Mobile Cloud, Alibaba Cloud, and Huawei Cloud gives
              developers and institutional researchers a lower-friction route than buying hardware. The resulting
              segmentation is strategically useful but economically ambiguous: developers, universities, research
              collaborators, cloud users, and hardware buyers have different budgets, buying processes, and revenue
              potential.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU006
              - CU007
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU006
              - CU007
              - CU008
              - CU014
      - number: '6.2'
        title: Adoption and expansion path
        blocks:
          - type: paragraph
            body: >-
              The strongest production evidence is institutional rather than broad enterprise adoption. Jiemian reported
              a 2025 deployment at the National Supercomputing Center in Chengdu, while two industry publications
              reported delivered systems to that center, China Mobile, and North China University of Technology. A May
              2026 product event added more than 20 strategic agreements, but agreements are not equivalent to active
              deployments or recurring contracts. Ping An Bank Hangzhou's documented visit is useful buyer-discovery
              evidence for finance, yet the source describes research and application discussions rather than a
              purchased system. The apparent expansion loop therefore runs from cloud experimentation and collaborative
              validation into public-institution deployments, with conversion into durable commercial relationships
              still requiring primary contract evidence.
            claimRefs:
              - CU008
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU006
              - CU011
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU012
              - CU015
      - number: '6.3'
        title: Named proof and outcome quality
        blocks:
          - type: paragraph
            body: >-
              Named evidence is concentrated in supercomputing, telecom, universities, hospitals, and biomedical
              research. The company has described customer-trained QBM-VAE applications across peptide generation,
              small-molecule generation, single-cell clustering, mRNA vaccine design, and protein multi-omics, and has
              listed collaborations with laboratories, universities, and hospitals. Science and Technology Daily
              reported that some problems saw solution time fall by more than 80%, but the report did not provide the
              baseline, problem set, classical comparator, sample size, or customer attribution needed to assess
              repeatability. These references show real access to sophisticated users and application domains, but most
              remain collaboration, deployment, or company-reported outcome proof rather than independently audited
              customer ROI.
            claimRefs:
              - CU004
              - CU005
              - CU011
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU008
              - CU013
              - CU014
      - number: '6.4'
        title: Durability, concentration, and procurement risk
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not establish retention. Jiemian characterized commercial traction as tentative,
              described supercomputing centers as early customers with relatively low commercial risk, and reported that
              revenue was undisclosed; industry sources quoted there said Chinese quantum companies generally remained
              loss-making and dependent on venture funding rather than repeat customers. The broader demand environment
              also warrants caution: Physics World reported that Baidu and Alibaba exited quantum-computing research,
              while an academic review still framed photonic quantum computing within the NISQ-era path toward scalable,
              fault-tolerant systems. Without customer-level revenue, renewal, utilization, and backlog data, investors
              cannot distinguish a diversified recurring base from a small number of government-linked projects,
              cloud-channel trials, and research collaborations.
            claimRefs:
              - CU009
              - CU010
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Usage volume is not retention evidence
            body: >-
              Cumulative calls, universities reached, developers, strategic agreements, and named deployments use
              different denominators. None discloses gross retention, net retention, renewals, paid-customer cohorts, or
              customer revenue concentration.
            calloutType: risk
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
              - CU010
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Evidence-ranked risk view
        blocks:
          - type: paragraph
            body: >-
              The evidence supports ranking execution risk above presently unverified legal risk. Three funding reports
              say the Series B proceeds are intended for a pilot photonic-chip line, expansion of the Shenzhen factory,
              and resolution of technical barriers; that use of proceeds makes repeatable yield, commissioning, and
              reliability the core near-term tests rather than proof that manufacturing is already mature. The reported
              CNY 1 billion ($145 million) round is funding raised, not cash available, and none of the retained sources
              discloses security terms, valuation, burn, runway, gross margin, or working-capital needs. Public
              quantum-market volatility and contested market estimates further argue against treating sector enthusiasm
              as evidence of Bose Quantum's financial resilience.
            claimRefs:
              - CR001
              - CR002
              - CR011
              - CR012
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR006
              - CR009
              - CR011
              - CR013
              - CR016
      - number: '7.2'
        title: Operational and technical execution
        blocks:
          - type: paragraph
            body: >-
              Operational risk is concrete but not yet quantifiable. The company-reported system can operate for 7×16
              hours, while the financing is also described as addressing practical-computing barriers and improving
              hardware reliability; those statements are progress indicators, not an independent availability,
              error-rate, or customer-workload benchmark. QED-C characterizes the broader quantum supply chain as custom
              and fragile, with dependencies on specialized photonics, controls, and other components, and separately
              identifies a shortage of cross-disciplinary talent. A peer-reviewed coherent-Ising-machine paper supports
              the architecture's research basis through numerical results, but it does not validate Bose Quantum's
              current production hardware, factory yield, service levels, or advantage against current classical
              methods.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR007
              - CR008
              - CR010
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR007
              - CR008
              - CR010
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR011
              - CR013
              - CR014
      - number: '7.3'
        title: Regulatory and legal uncertainty
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not substantiate a lawsuit, enforcement action, recall, privacy breach,
              export-control finding, or missing license. It also does not establish that none exists. The official
              policy candidate redirected to a government homepage and yielded no article text, so it cannot verify the
              reported policy language or Bose Quantum's compliance posture. The legal register therefore records
              diligence categories and leaves likelihood unrated where the pool lacks primary records. Priority requests
              are operating and product approvals, export-control screening, photonic-chip IP chain of title,
              freedom-to-operate work, safety and quality certifications, incident logs, and litigation searches in the
              relevant Chinese jurisdictions.
            claimRefs:
              - CR007
              - CR012
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR007
              - CR012
              - CR015
      - number: '7.4'
        title: Mitigations, indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Mitigation maturity should be judged from records rather than roadmap language. Before underwriting,
              obtain monthly pilot-line milestones, first-pass and final yield, component single-source exposure, mean
              time between failure, error-rate distributions, customer acceptance tests, and uptime measured on paid
              workloads. Commercial monitoring should separate named deliveries from renewals and revenue concentration.
              The factory-scaling thesis breaks if the pilot line misses agreed commissioning dates, repeated
              customer-load tests cannot reproduce the claimed operating window, yield fails to improve over two
              consecutive review periods, or a critical component lacks a qualified second source. The financing thesis
              breaks if audited runway is below the next milestone or undisclosed preferences materially impair
              new-money returns.
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR007
              - CR009
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The financing validates ambition, not manufacturing readiness
            body: >-
              The round finances pilot fabrication, factory expansion, and technical bottlenecks. Investment approval
              should therefore depend on yield, reliability, acceptance, and runway evidence rather than the round size
              alone.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and recommendation
        blocks:
          - type: paragraph
            body: >-
              Four independent reports consistently describe a CNY1 billion, approximately USD145 million, Series B
              announced in March or April 2026. The round included state-supported and institutional investors and was
              designated for a photonic chip pilot line, expansion of the Shenzhen factory, technical development, and a
              quantum-plus-AI commercial ecosystem. That is evidence of financing capacity and strategic sponsorship,
              not evidence that the entry price is attractive. None of the retained round reports provides a post-money
              valuation, security type, liquidation preference, ownership purchased, or other terms needed to model
              dilution and proceeds. The appropriate decision is therefore research-more, with high risk and an unknown
              valuation stance; confidence is medium in that process recommendation, not in any enterprise value
              estimate.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV012
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV010
              - CV014
      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is an execution option on specialized photonic quantum systems: reported products
              span 100, 550, and 1,000 qubits; the Shenzhen factory is moving from laboratory work toward standardized
              production; and named institutional deployments provide early proof that systems have left the lab. Xinhua
              also reported more than CNY3.2 billion of Chinese quantum financing in the first quarter of 2026,
              exceeding the whole of 2025, which indicates strong sector capital availability. The anti-thesis is that
              capital intensity, immature industrial economics, and policy-directed funding can outpace independently
              verified commercial demand. Public disclosures do not establish recurring revenue, gross margin, renewal
              behavior, factory yield, or customer concentration, while the USCC warns that opacity and state
              coordination complicate comparisons of Chinese quantum maturity.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV007
              - CV008
              - CV012
              - CV013
      - number: '8.3'
        title: Scenario framework and comparable context
        blocks:
          - type: paragraph
            body: >-
              No defensible numeric valuation range can be produced from the retained evidence because neither Bose
              Quantum's enterprise value nor a normalized operating metric is public. Sector data are useful only as
              directional context. PostQuantum relays a McKinsey estimate of USD12.6 billion invested in quantum during
              2025 and more than USD1 billion of industry revenue, but the same analysis criticizes the precision of
              those aggregates, especially where Chinese funding and mixed quantum-AI programs are opaque. Azure Quantum
              pricing further shows that monetization models vary across per-job minimums, gate-shots, processor hours,
              and monthly subscriptions; those third-party prices are not direct Bose Quantum revenue or valuation
              comparables. Bull, base, and bear cases should therefore be triggered by verified operating milestones
              rather than assigned unsupported probabilities or multiples.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV010
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: Entry discipline, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              An investable entry case requires the term sheet and cap table, audited revenue and margin by hardware,
              cloud, and services, customer-level contract economics, cash burn and runway, factory yield and
              utilization, and evidence that named deployments convert into paid renewals. The minimum decision package
              should also reconcile the CNY and USD round figures, identify preferences and anti-dilution rights, and
              quantify the fully diluted stake offered. Exit readiness is currently unproven: the retained sources show
              capital formation and early deliveries but no IPO schedule, strategic-buyer process, or model-ready cash
              flows. Thesis-break triggers are failed factory scale-up, no recurring paid use behind deployments,
              material preference overhang, or a price that assumes broad commercialization before independent proof.
              Until those items clear, the correct posture is to preserve optionality rather than set a target return or
              hold period.
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: No price, no underwriting
            body: >-
              The reported financing amount establishes capital raised, not enterprise value, cash available, or an
              attractive entry price.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV014
              - CV015
          - type: callout
            title: Do not import sector multiples
            body: >-
              Industry investment and cloud-access prices use different denominators and cannot substitute for Bose
              Quantum revenue, margin, ownership, or preference data.
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV015
