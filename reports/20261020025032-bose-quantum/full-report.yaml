      - number: '4.2'
        title: Cost structure and unit-economics constraints
        blocks:
          - type: paragraph
            body: >-
              The visible cost structure is dominated by an industrialization program: a photonic-chip pilot line,
              expansion of the Shenzhen quantum-computer factory, hardware-reliability work, and AI-assisted control.
              These are manufacturing and engineering commitments, not evidence of gross-margin improvement. Sector
              evidence is cautionary: a 2025 Chinese government report said quantum-computing R&D expenditure exceeded
              total revenue in both 2023 and 2024, while CNAS describes thin demand, high component costs, long lead
              times, and vertical integration as mutually reinforcing barriers. No public input is available for average
              selling price, bill of materials, yield, installation cost, support burden, utilization, renewal, CAC, or
              payback. A defensible unit-economics model is therefore not possible from this source set.
            claimRefs:
              - CI004
              - CI005
              - CI010
              - CI011
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI004
              - CI008
              - CI009
              - CI015
              - CI016
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Three independent reports place the latest Series B at CNY1 billion, or about USD145 million, and
              consistently tie proceeds to chip-production and factory expansion. That is meaningful financing capacity,
              but funding raised is not cash available: the sources provide no closing-date cash balance, tranche
              schedule, debt terms, restricted-use conditions, monthly burn, or runway. AiQicha separately displays
              CNY360 million of registered capital and CNY17.980521 million of paid-in capital; those registry fields
              are legal-capital records, not measures of liquidity or the Series B cash balance. The disclosed use of
              proceeds indicates continuing dependence on capital for production scale-up, while the absence of
              operating cash-flow data prevents an assessment of when another financing event may be needed.
            claimRefs:
              - CI003
              - CI004
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The strongest financial conclusion is that Bose Quantum remains an industrial-scale-up underwriting case
              rather than a measurable growth or margin story. Public evidence shows products, deployments, a factory,
              and a large financing round, but it does not connect those assets to realized pricing, recognized revenue,
              gross profit, cash consumption, or customer repeat behavior. A sector benchmark summarized by PostQuantum
              reports more than USD1 billion of global quantum-company revenue in 2025, yet the same analysis warns that
              market-investment totals are difficult to reconcile and that China data are limited. That benchmark cannot
              be allocated to Bose Quantum. Underwriting should remain conditional on audited financials, contract-level
              revenue evidence, unit-cost and yield data, cash and debt schedules, and a board-approved operating plan
              through the next financing trigger.
            claimRefs:
              - CI002
              - CI009
              - CI010
              - CI011
              - CI012
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding does not answer runway
            body: >-
              The CNY1 billion Series B is reported as financing for chip and factory expansion. Without cash receipts,
              restrictions, burn, debt, and operating forecasts, it cannot be translated into cash available or months
              of runway.
            calloutType: risk
            claimRefs:
              - CI003
              - CI004
              - CI009
              - CI015
          - type: callout
            title: Gate underwriting on primary financial evidence
            body: >-
              Require audited statements, customer contracts, revenue recognition, factory yield and unit cost,
              working-capital schedules, and a cash runway model before assigning revenue quality, margin, or financing
              sufficiency.
            calloutType: recommendation
            claimRefs:
              - CI008
              - CI009
              - CI011
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product lines and customer workflows
        blocks:
          - type: paragraph
            body: >-
              Bose Quantum's disclosed commercial surface is a family of specialized photonic quantum computers at 100,
              550, and 1,000 qubits rather than a proven general-purpose, fault-tolerant platform. Public reporting
              describes these systems as optimization-oriented machines and associates the next-generation system with
              drug development, materials discovery, brain science, power systems, and finance. Those are use-case
              categories, not measured customer outcomes: the reviewed sources provide no comparative runtime,
              solution-quality, cost, or production-utilization data. The announced universal photonic chip and the
              company's dual-track strategy extend the roadmap, but public evidence does not establish that the
              universal product is commercially available.
            claimRefs:
              - CE001
              - CE002
              - CE009
              - CE010
          - type: table
            tableRef: TE001
            claimRefs:
