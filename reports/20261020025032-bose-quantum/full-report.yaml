  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market should be bounded around products that Bose Quantum can sell or make available now:
              specialized photonic quantum computers, task-based cloud access, software development tools, and
              application services for optimization or simulation. Quantum communications, quantum sensing, and broad
              estimates of economic value created by quantum technology are adjacencies rather than company revenue
              pools. The more important substitute is classical high-performance computing and AI. Public deployments
              are explicitly hybrid, while the reviewed market analysis says most commercial work remains experimental
              or hybrid. This makes Bose Quantum an accelerator or specialist-compute supplier inside an existing
              workflow, not a wholesale replacement for classical compute.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing without conflating value, market revenue, and company opportunity
        blocks:
          - type: paragraph
            body: >-
              The available sizing evidence contains several different denominators. McKinsey figures summarized by
              Post-Quantum put 2025 quantum-computing company revenue above $1 billion and project $4.4 billion for
              2028, while a 2035 internal quantum-technology market estimate of $60 billion to $100 billion assigns $43
              billion to $71 billion to quantum computing. Its separate $1.3 trillion to $2.7 trillion estimate is
              economic value, not vendor revenue or Bose Quantum TAM. The same critique notes incomplete China
              investment data, mixed quantum and AI categories, and uncertain assumptions. These figures are useful as
              scenarios, but they cannot be cascaded mechanically into a Bose Quantum SAM or SOM.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to an institution-led adoption path. Supercomputing centers and telecom-cloud
              operators acquire or host systems; researchers, developers, and enterprise innovation teams use them; and
              public, infrastructure, or R&D budgets appear to fund access. The Chengdu deployment combines a 550-qubit
              coherent photonic system with 100P@FP64 classical capacity, while the China Mobile platform exposes
              task-based access and a Python SDK. Pharma and life sciences, finance, logistics, materials, and power
              systems recur as use-case clusters. Bose Quantum also reported large cloud request, university, and
              developer counts, but those activity metrics do not reveal paid customers, contract value, retention, or
              production ROI.
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption is being pulled by large enterprise experimentation budgets, Chinese strategic support, cloud
              distribution, and early institutional deployments. It is constrained by the need to prove advantage
              against improving classical and AI baselines, integrate hybrid workflows, improve reliability, and scale
              specialized chip and system manufacturing. Bose Quantum's 2026 financing was directed toward a chip pilot
              line and factory expansion, which supports supply ambition but also underscores capital intensity. For
              valuation, the decisive evidence is therefore not a broad 2035 forecast; it is pricing, paid deployment
              count, recurring usage, renewal, gross margin, and measured customer ROI. None of those company-specific
              conversion metrics is disclosed in the assigned evidence.
            claimRefs:
              - CM002
              - CM009
              - CM012
              - CM013
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Hybrid deployment is the observable adoption pattern
            body: >-
              The strongest independent deployment evidence combines photonic quantum capacity with classical
              supercomputing rather than replacing the classical stack.
            calloutType: insight
            claimRefs:
              - CM002
              - CM005
          - type: callout
            title: Public activity does not establish a monetizable SOM
            body: >-
              Usage requests, developer counts, and named deployments are useful demand signals, but pricing,
              paid-customer conversion, renewals, and customer ROI remain undisclosed.
            calloutType: risk
            claimRefs:
              - CM011
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: A broad field of modalities, institutions, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Bose Quantum competes first with Chinese quantum-computing vendors and state-linked research platforms,
              not only with other photonic startups. Origin Quantum and USTC-backed systems represent superconducting
              alternatives; Turing Quantum and university photonic programs compete on the optical route; SpinQ,
              QuantumCTek, and telecom-backed platforms bring capital, channels, or adjacent infrastructure.
              Internationally, Quantinuum, IBM, Google, AWS, IonQ, PsiQuantum, Quandela, QuiX, and neutral-atom vendors
              broaden the buyer's option set. Classical high-performance computing and internal optimization teams
              remain the status quo for buyers unwilling to accept hardware immaturity or uncertain quantum advantage.
              Public evidence does not support a single winner: modalities trade room-temperature operation, coherence,
              speed, physical footprint, and scaling complexity against one another.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP005
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.2'
        title: Bose leads with deployability claims, not a public benchmark lead
        blocks:
          - type: paragraph
            body: >-
              Bose's strongest positioning evidence is operational rather than comparative. Reports describe 100-, 550-,
              and 1,000-qubit specialized photonic systems, a Shenzhen production facility, and deliveries to
              institutional users. Photonics can avoid the extreme cryogenic burden of superconducting systems, but the
              broader route can require large optical assemblies and reconfiguration for new calculations. Qubit counts
              across modalities are not comparable measures of useful performance, and no retained source provides a
              reproducible head-to-head benchmark for Bose against classical solvers or named quantum peers. The
              positioning map is therefore an ordinal diligence view of disclosed platform breadth and deployment
              evidence, not a performance ranking or market-share estimate.
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP005
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP016
      - number: '3.3'
        title: Enterprise projects and physical deployments shape commercial competition
        blocks:
          - type: paragraph
            body: >-
              The public record points to three Bose packaging motions: equipment sales, cloud-computing subscriptions,
              and customized task-based access. The China Merchants Bank project reportedly combines true-machine
              compute access with an optimization interface, matrix construction, data validation, and a customized
              algorithm. That bundle can make domain implementation and workflow integration more important than list
              price, while physical deployments add installation and operational dependencies. These features may create
              switching costs, but there is no disclosed evidence on renewal rates, contract duration, realized pricing,
              discounts, multi-homing, or customer migration. Better-capitalized platforms may counter with broader
              developer ecosystems, cloud distribution, and multiple hardware paths.
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP006
              - CP007
      - number: '3.4'
        title: The moat is conditional on repeatable production and verifiable outcomes
        blocks:
          - type: paragraph
            body: >-
              A credible moat could emerge if Bose converts its factory, photonic-chip work, and application services
              into reliable deployments faster than peers. The adverse case is substantial: technical-route selection
              remains unsettled, reported Chinese quantum results are often hard to replicate independently, and
              imported photonic and control components still constrain supply-chain autonomy. State capital can
              accelerate capacity while also favoring adjacent state-linked platforms and procurement channels. Bose is
              therefore exposed to three forms of displacement: another quantum modality can establish superior
              error-corrected performance, photonic peers can commoditize the hardware layer, or classical and hybrid
              solvers can remain sufficient for customer workloads. Durable differentiation requires audited uptime,
              comparable solution quality, repeat orders, and supplier resilience, none of which is publicly quantified.
            claimRefs:
              - CP003
              - CP004
              - CP010
              - CP012
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Benchmark risk dominates headline qubit counts
            body: >-
              Qubit totals across photonic, superconducting, trapped-ion, and neutral-atom systems do not establish
              comparable useful performance. Underwriting requires matched workloads, solution quality, runtime, uptime,
              error behavior, and classical baselines.
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
              - CP014
          - type: callout
            title: Diligence the commercial moat through repeat behavior
            body: >-
              Request customer-level renewals, repeat orders, multi-homing, realized pricing, support burden, and
              migration effort before assigning value to distribution or lock-in.
            calloutType: recommendation
            claimRefs:
              - CP006
              - CP007
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports several possible monetization surfaces, not a disclosed revenue mix. Bose
              Quantum's registered business scope spans software, quantum-computing technical services, cloud-computing
              equipment, instruments, and computer-peripheral manufacturing. Independent reports also describe 100-,
              550-, and 1,000-qubit specialized systems and delivered products to institutional users including the
              Chengdu supercomputing center, China Mobile, Beijing Electronic Zone High-tech Group, and North China
              University of Technology. Those deployments establish commercial activity, but none of the retained
              sources states whether customers bought hardware, paid for cloud access, funded pilots, or entered
              recurring service contracts. Revenue therefore cannot be separated into hardware, software, cloud, or
              services, and reported deployments should not be converted into revenue, ARR, or customer-retention
              estimates.
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI007
              - CI008
