              - CO003
              - CO015
      - number: '1.4'
        title: Milestones and diligence interpretation
        blocks:
          - type: paragraph
            body: >-
              The evidence traces a progression from a 2020/2021 founding window through several financing records,
              factory startup, a next-generation system launch, the CNY1 billion Series B, public developer outreach,
              and a reported pre-IPO round. The sequence is directionally consistent with a company moving from
              prototypes toward scaled manufacturing. It does not establish commercial maturity. The Quantum Insider
              notes that qubit count is only a rough capacity measure and that performance also depends on stability and
              error rates; manufacturing scale remains an industry hurdle. The same caution applies to the company's
              claimed 7-by-16-hour operation and customer deliveries. Exact revenue, margins, burn, runway, valuation,
              factory yield, and contract economics require private diligence before this footprint can be translated
              into enterprise value.
