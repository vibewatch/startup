company:
  name: "Bose Quantum"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    Bose Quantum's reported CNY1 billion (about USD145 million) Series B supplies
    meaningful scale-up capital, but the retained public evidence does not disclose
    the company's post-money valuation, security terms, audited economics, or exit
    timetable. The recommendation is research-more with high risk and an unknown
    valuation stance until price, dilution, commercial quality, and production
    economics can be underwritten.
sections:
  - id: "financing-and-recommendation"
    title: "Financing context and recommendation"
    body: >-
      Four independent reports consistently describe a CNY1 billion, approximately
      USD145 million, Series B announced in March or April 2026. The round included
      state-supported and institutional investors and was designated for a photonic
      chip pilot line, expansion of the Shenzhen factory, technical development,
      and a quantum-plus-AI commercial ecosystem. That is evidence of financing
      capacity and strategic sponsorship, not evidence that the entry price is
      attractive. None of the retained round reports provides a post-money
      valuation, security type, liquidation preference, ownership purchased, or
      other terms needed to model dilution and proceeds. The appropriate decision
      is therefore research-more, with high risk and an unknown valuation stance;
      confidence is medium in that process recommendation, not in any enterprise
      value estimate.
    claimRefs: ["CV001", "CV002", "CV003", "CV004", "CV014", "CV015"]
    tableRefs: ["TV001"]
    figureRefs: ["FV001"]
  - id: "thesis-and-anti-thesis"
    title: "Investment thesis and anti-thesis"
    body: >-
      The investable thesis is an execution option on specialized photonic quantum
      systems: reported products span 100, 550, and 1,000 qubits; the Shenzhen
      factory is moving from laboratory work toward standardized production; and
      named institutional deployments provide early proof that systems have left
      the lab. Xinhua also reported more than CNY3.2 billion of Chinese quantum
      financing in the first quarter of 2026, exceeding the whole of 2025, which
      indicates strong sector capital availability. The anti-thesis is that capital
      intensity, immature industrial economics, and policy-directed funding can
      outpace independently verified commercial demand. Public disclosures do not
      establish recurring revenue, gross margin, renewal behavior, factory yield,
      or customer concentration, while the USCC warns that opacity and state
      coordination complicate comparisons of Chinese quantum maturity.
    claimRefs: ["CV005", "CV006", "CV007", "CV008", "CV012", "CV013", "CV016"]
    tableRefs: ["TV002"]
  - id: "scenarios-and-comparables"
    title: "Scenario framework and comparable context"
    body: >-
      No defensible numeric valuation range can be produced from the retained
      evidence because neither Bose Quantum's enterprise value nor a normalized
      operating metric is public. Sector data are useful only as directional
      context. PostQuantum relays a McKinsey estimate of USD12.6 billion invested in
      quantum during 2025 and more than USD1 billion of industry revenue, but the
      same analysis criticizes the precision of those aggregates, especially where
      Chinese funding and mixed quantum-AI programs are opaque. Azure Quantum
      pricing further shows that monetization models vary across per-job minimums,
      gate-shots, processor hours, and monthly subscriptions; those third-party
      prices are not direct Bose Quantum revenue or valuation comparables. Bull,
      base, and bear cases should therefore be triggered by verified operating
      milestones rather than assigned unsupported probabilities or multiples.
    claimRefs: ["CV009", "CV010", "CV011", "CV015"]
    tableRefs: ["TV003"]
  - id: "entry-discipline-and-exit-readiness"
    title: "Entry discipline, exit readiness, and diligence asks"
    body: >-
      An investable entry case requires the term sheet and cap table, audited
      revenue and margin by hardware, cloud, and services, customer-level contract
      economics, cash burn and runway, factory yield and utilization, and evidence
      that named deployments convert into paid renewals. The minimum decision
      package should also reconcile the CNY and USD round figures, identify
      preferences and anti-dilution rights, and quantify the fully diluted stake
      offered. Exit readiness is currently unproven: the retained sources show
      capital formation and early deliveries but no IPO schedule, strategic-buyer
      process, or model-ready cash flows. Thesis-break triggers are failed factory
      scale-up, no recurring paid use behind deployments, material preference
      overhang, or a price that assumes broad commercialization before independent
      proof. Until those items clear, the correct posture is to preserve optionality
      rather than set a target return or hold period.
    claimRefs: ["CV004", "CV006", "CV007", "CV010", "CV012", "CV013", "CV014", "CV015", "CV016"]
tables:
  - id: "TV001"
    title: "Recommendation summary"
    columns: ["Dimension", "Current reading", "Evidence basis", "Decision implication"]
    rows:
      - ["Recommendation", "Research more", "Round scale and production plan are reported, but underwriting inputs are missing.", "Do not approve an investment on public evidence alone."]
      - ["Confidence", "Medium in the process call", "Multiple reports corroborate the financing; none discloses valuation terms.", "Confidence does not extend to a numeric fair value."]
      - ["Risk rating", "High", "Early industrial scale-up, opaque economics, and difficult independent verification.", "Require milestone-based downside protection."]
      - ["Valuation stance", "Unknown", "No post-money value, ownership purchased, audited revenue, margin, or cash flow.", "Set no entry multiple or price target."]
      - ["Entry discipline", "Term-sheet and operating-data dependent", "CNY1 billion of funding is not cash available after obligations and is not company value.", "Underwrite dilution, preferences, burn, yield, and paid renewals before pricing."]
    notes: "Readings are analyst judgments from the retained public evidence; null valuation inputs are treated as gaps, not estimated values."
    claimRefs: ["CV001", "CV004", "CV012", "CV014", "CV015", "CV016"]
  - id: "TV002"
    title: "Thesis and anti-thesis"
    columns: ["Side", "Argument", "Evidence signal", "What would change the view"]
    rows:
      - ["Thesis", "Fresh financing can fund the chip pilot line and factory expansion.", "CNY1 billion Series B and explicit production uses.", "Verified commissioning, yield, utilization, and unit-cost milestones."]
      - ["Thesis", "Named deliveries indicate initial institutional adoption.", "Reports name supercomputing, telecom, industrial, and university users.", "Paid renewals, contract values, and referenceable production workloads."]
      - ["Anti-thesis", "Sector funding heat may exceed demonstrated commercial maturity.", "Q1 2026 Chinese quantum financing exceeded CNY3.2 billion while experts described commercialization uncertainty.", "Audited revenue growth and margins attributable to repeatable customer demand."]
      - ["Anti-thesis", "State direction and limited data sharing weaken independent comparability.", "USCC describes constrained market-driven innovation and difficult comparative assessment.", "Independent technical benchmarks and customer economics with auditable definitions."]
    notes: "This table separates company-specific reports from sector-level context; sector capital does not establish Bose Quantum's valuation."
    claimRefs: ["CV002", "CV007", "CV008", "CV012", "CV013"]
  - id: "TV003"
    title: "Bull, base, and bear valuation scenarios"
    columns: ["Case", "Assumptions", "Valuation and return logic", "Probability signal", "Downside or upgrade trigger"]
    rows:
      - ["Bull", "Factory expansion produces reliable systems and deployments convert to recurring paid workloads.", "A growth valuation could become supportable only after audited revenue, margin, retention, and cap-table data; no public numeric range is defensible now.", "Positive only if production and customer milestones are independently verified.", "Upgrade on repeat purchases, improving unit economics, and clean preference terms."]
      - ["Base", "Capital supports continued delivery, but commercial quality and production economics remain opaque.", "Value remains indeterminate; negotiate from verified cash needs and ownership rather than sector headline multiples.", "Current public evidence most closely supports this case.", "Hold research-more until term sheet, audited financials, and customer cohorts are available."]
      - ["Bear", "Factory scale-up slips, demand remains pilot-led, or policy-supported capital masks weak market pull.", "Down-round and dilution risk dominate because no revenue floor or liquidation stack is public.", "USCC and sector-methodology caveats are consistent with this risk, not a measured probability.", "Break thesis on failed scale milestones, absent paid renewals, onerous preferences, or price detached from verified economics."]
    notes: "Scenarios are qualitative because retained sources disclose neither a current valuation nor model-ready operating metrics; probability signals are conditions, not numeric probabilities."
    claimRefs: ["CV004", "CV006", "CV007", "CV010", "CV012", "CV013", "CV015", "CV016"]
