        - Global
        - Quantum-computing company revenue above $1B
        - Not disclosed
        - Multiple databases, expert interviews, and proprietary analysis
        - Medium
        - Revenue categories and mixed offerings are not fully defined
      - - McKinsey, summarized by Post-Quantum
        - "2028"
        - Global
        - Quantum-computing company revenue projected at $4.4B
        - Not disclosed
        - Forward market projection
        - Low to medium
        - Forecast is not a Bose Quantum TAM or contracted pipeline
      - - McKinsey, summarized by Post-Quantum
        - "2035"
        - Global
        - Internal quantum-computing market of $43B-$71B
        - Not disclosed
        - Subset of a broader internal quantum-technology market
        - Low to medium
        - Long horizon and uncertain category boundaries
      - - McKinsey, summarized by Post-Quantum
        - "2035"
        - Global
        - Internal quantum-technology market of $60B-$100B
        - Not disclosed
        - Market projection across quantum technologies
        - Low to medium
        - Includes categories beyond Bose Quantum's evidenced offer
      - - McKinsey, summarized by Post-Quantum
        - "2035"
        - Global
        - Economic value of $1.3T-$2.7T
        - Not disclosed
        - Industry value-at-stake scenarios
        - Low
        - Economic impact is not vendor revenue; AI overlap is unresolved
      - - McKinsey, summarized by Post-Quantum
        - "2026 monitor"
        - Surveyed companies
        - 33% spend over $10M annually; 7% spend over $50M
        - Not applicable
        - Analysis of company quantum budgets
        - Medium
        - Sample denominator and Bose Quantum capture are not disclosed
    notes: >-
      Values use different metrics, periods, and denominators and are not
      additive; no CAGR was published in the reviewed source, and China data was
      described as limited.
    claimRefs: [CM006, CM007, CM008, CM009, CM014]
  - id: TM003
    title: Segment and buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Supercomputing centers
        - Infrastructure or center leadership
        - Researchers and application teams
        - Public or institutional infrastructure budget
        - Hybrid classical-quantum task scheduling
        - Compute infrastructure and strategic programs
        - Demonstrated integration and stable operation
      - - Telecom and cloud operators
        - Cloud-platform leadership
        - Enterprise developers and researchers
        - Operator, enterprise, or project budget
        - Task-based hardware access through cloud and SDK
        - Cloud product and industry-solutions teams
        - Broader access without direct hardware ownership
      - - Pharma and life sciences
        - R&D and computational-science leadership
        - Scientists, modelers, and data teams
        - Enterprise R&D budget
        - Molecular and optimization pilots integrated with AI
        - Research, discovery, and innovation functions
        - Reproducible advantage over classical or AI baselines
      - - Finance, logistics, and power
        - Quant, operations, or innovation leadership
        - Analysts, optimizers, and engineering teams
        - Enterprise transformation or R&D budget
        - Specialized optimization inside existing systems
        - Business-unit or central innovation owner
        - Measured ROI on a bounded production problem
      - - Universities and research institutes
        - Faculty, lab, or program leadership
        - Students, researchers, and developers
        - Institutional, grant, or public budget
        - Education, algorithm development, and hardware experiments
        - Academic program and research sponsor
        - Low-friction cloud access and documented tooling
    notes: >-
      Buyer and budget ownership are inferred from public deployment and platform
      evidence; contract values, procurement owners, and paid conversion remain
      undisclosed.
    claimRefs: [CM004, CM005, CM009, CM010, CM011, CM012, CM013]
figures:
  - id: FM001
    title: Six non-additive market-sizing lenses
    type: pyramid
    summary: >-
      Broad economic-value scenarios narrow toward observed market revenue and
      enterprise budget signals, but none establishes Bose Quantum SAM or SOM.
    data:
      items:
        - label: Economic value at stake by 2035
          value: "$1.3T-$2.7T"
          detail: Broad industry impact estimate, not vendor revenue.
        - label: Internal quantum-technology market by 2035
          value: "$60B-$100B"
          detail: Includes quantum categories beyond the company's evidenced offer.
        - label: Quantum-computing share by 2035
          value: "$43B-$71B"
          detail: Long-range market projection with uncertain category boundaries.
        - label: Quantum-computing company revenue by 2028
          value: "$4.4B"
          detail: Forecast, not contracted company pipeline.
        - label: Quantum-computing company revenue in 2025
          value: ">$1B"
          detail: Historical global revenue benchmark with unclear category mix.
        - label: Enterprise annual budget signal
          value: "33% >$10M; 7% >$50M"
          detail: Surveyed-company spending distribution, not Bose Quantum capture.
    approximationNotes: >-
      Layer order shows narrowing analytical scope, not an additive funnel or
      value-proportional scale; values retain their different denominators and
      Post-Quantum's methodological caveats.
    claimRefs: [CM006, CM007, CM008, CM009, CM015]
callouts:
  - calloutType: insight
    title: Hybrid deployment is the observable adoption pattern
    body: >-
      The strongest independent deployment evidence combines photonic quantum
      capacity with classical supercomputing rather than replacing the classical
      stack.
    claimRefs: [CM002, CM005]
  - calloutType: risk
    title: Public activity does not establish a monetizable SOM
    body: >-
      Usage requests, developer counts, and named deployments are useful demand
      signals, but pricing, paid-customer conversion, renewals, and customer ROI
      remain undisclosed.
    claimRefs: [CM011, CM016]
