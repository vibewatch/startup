company:
  name: "Bose Quantum"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Public evidence shows a broad experimentation funnel spanning cloud developers, universities,
    biopharmaceutical users, supercomputing centers, and strategic partners, with several named
    institutional deployments. Commercial durability remains unproven because Bose Quantum does
    not disclose paid-customer counts, renewals, contract values, revenue concentration, or
    comparable outcome baselines.
sections:
  - id: customer-segments-and-entry-points
    title: "Customer segments and entry points"
    body: >-
      Bose Quantum's disclosed user base spans several distinct populations rather than one
      homogeneous customer cohort. Company-provided figures describe more than 68 million
      cumulative cloud solution calls, coverage of more than 900 universities and colleges, and
      more than 10,000 participating developers, but none of those measures identifies paid
      accounts, unique active users, or a measurement window. Independent reporting adds that the
      company said roughly 39% of users came from biopharmaceuticals, while universities made up
      much of the remainder. Access through China Mobile Cloud, Alibaba Cloud, and Huawei Cloud
      gives developers and institutional researchers a lower-friction route than buying hardware.
      The resulting segmentation is strategically useful but economically ambiguous: developers,
      universities, research collaborators, cloud users, and hardware buyers have different
      budgets, buying processes, and revenue potential.
    claimRefs: [CU001, CU002, CU003, CU006, CU007]
    tableRefs: [TU001]
  - id: adoption-and-expansion-path
    title: "Adoption and expansion path"
    body: >-
      The strongest production evidence is institutional rather than broad enterprise adoption.
      Jiemian reported a 2025 deployment at the National Supercomputing Center in Chengdu, while
      two industry publications reported delivered systems to that center, China Mobile, and North
      China University of Technology. A May 2026 product event added more than 20 strategic
      agreements, but agreements are not equivalent to active deployments or recurring contracts.
      Ping An Bank Hangzhou's documented visit is useful buyer-discovery evidence for finance, yet
      the source describes research and application discussions rather than a purchased system.
      The apparent expansion loop therefore runs from cloud experimentation and collaborative
      validation into public-institution deployments, with conversion into durable commercial
      relationships still requiring primary contract evidence.
    claimRefs: [CU008, CU012, CU013, CU014]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-outcomes
    title: "Named proof and outcome quality"
    body: >-
      Named evidence is concentrated in supercomputing, telecom, universities, hospitals, and
      biomedical research. The company has described customer-trained QBM-VAE applications across
      peptide generation, small-molecule generation, single-cell clustering, mRNA vaccine design,
      and protein multi-omics, and has listed collaborations with laboratories, universities, and
      hospitals. Science and Technology Daily reported that some problems saw solution time fall
      by more than 80%, but the report did not provide the baseline, problem set, classical
      comparator, sample size, or customer attribution needed to assess repeatability. These
      references show real access to sophisticated users and application domains, but most remain
      collaboration, deployment, or company-reported outcome proof rather than independently
      audited customer ROI.
    claimRefs: [CU004, CU005, CU011, CU013, CU014]
    tableRefs: [TU003]
  - id: durability-and-concentration-risk
    title: "Durability, concentration, and procurement risk"
    body: >-
      Public evidence does not establish retention. Jiemian characterized commercial traction as
      tentative, described supercomputing centers as early customers with relatively low commercial
      risk, and reported that revenue was undisclosed; industry sources quoted there said Chinese
      quantum companies generally remained loss-making and dependent on venture funding rather
      than repeat customers. The broader demand environment also warrants caution: Physics World
      reported that Baidu and Alibaba exited quantum-computing research, while an academic review
      still framed photonic quantum computing within the NISQ-era path toward scalable,
      fault-tolerant systems. Without customer-level revenue, renewal, utilization, and backlog
      data, investors cannot distinguish a diversified recurring base from a small number of
      government-linked projects, cloud-channel trials, and research collaborations.
    claimRefs: [CU009, CU010, CU015, CU016]
callouts:
  - calloutType: risk
    title: "Usage volume is not retention evidence"
    body: >-
      Cumulative calls, universities reached, developers, strategic agreements, and named
      deployments use different denominators. None discloses gross retention, net retention,
      renewals, paid-customer cohorts, or customer revenue concentration.
    claimRefs: [CU001, CU002, CU003, CU009, CU010, CU012]
