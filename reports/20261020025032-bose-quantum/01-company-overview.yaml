  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "funding"
      missingEvidence: "Exact post-money valuation, security type, liquidation preferences, ownership percentages, debt, and secondary-sale terms."
      whyItMatters: "Headline funding cannot be converted into ownership, dilution, downside protection, or enterprise value without the financing documents."
      diligencePath: "Obtain signed term sheets, stock-purchase documents, the fully diluted cap table, debt schedule, and board approvals."
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO003]
    - type: "private-evidence-only"
      severity: "material"
      topic: "financial-performance"
      missingEvidence: "Audited revenue, gross margin, operating loss, cash flow, cash balance, burn, and runway."
      whyItMatters: "Funding raised is not cash available, and public product milestones do not establish commercial economics."
      diligencePath: "Review audited statements, monthly management accounts, bank statements, revenue recognition policies, and a cash runway bridge."
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO001]
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "leadership"
      missingEvidence: "Complete executive team, board composition, committee structure, leadership changes, succession planning, and founder ownership."
      whyItMatters: "Only the founder-CEO is publicly named, preventing assessment of governance quality and key-person dependence."
      diligencePath: "Request the organization chart, board register, biographies, employment agreements, committee charters, and leadership-change log."
      relatedTableRefs: [TO002]
    - type: "private-evidence-only"
      severity: "material"
      topic: "commercial-scale"
      missingEvidence: "Current headcount, factory yield and capacity, supplier concentration, paid-customer count, contract values, utilization, renewals, and receivables."
      whyItMatters: "Named deployments and workforce percentages lack denominators and do not establish repeatable production or customer economics."
      diligencePath: "Reconcile payroll, factory operating data, bills of materials, supplier contracts, signed customer contracts, invoices, usage logs, and collections."
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO001]
    - type: "conflicting-data"
      severity: "minor"
      topic: "identity"
      missingEvidence: "Corporate registry evidence reconciling the late-2020 and 2021 founding dates."
      whyItMatters: "The discrepancy is not thesis-changing but should be resolved before relying on age-based milestone or financing analysis."
      diligencePath: "Obtain the legal entity's business license, incorporation record, and any predecessor or restructuring documents."
      relatedQuestionRefs: [QO001]
    - type: "enumeration-incomplete"
      severity: "minor"
      topic: "milestones"
      missingEvidence: "A company-verified milestone register with exact dates for product launches, financing closings, laboratory openings, and factory commissioning."
      whyItMatters: "The public timeline contains publication dates, month-only dates, and database entries whose legal close dates may differ."
      diligencePath: "Reconcile board records, press releases, financing closing documents, shipment records, and factory commissioning certificates."
      relatedQuestionRefs: [QO009]
      relatedTableRefs: [TO001]
