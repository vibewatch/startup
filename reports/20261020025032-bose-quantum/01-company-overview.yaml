company:
  name: "Bose Quantum"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Bose Quantum, also branded QBoson, is a Beijing photonic-quantum-computing company that reported a CNY1 billion ($145 million) Series B in March 2026 and a further pre-IPO financing in July. Public evidence supports a meaningful hardware, factory, and deployment footprint, but the founding year conflicts across sources and valuation, financial performance, headcount, governance, and contract economics remain undisclosed."
sections:
  - id: "identity-and-operating-thesis"
    title: "Identity and operating thesis"
    body: >-
      Bose Quantum and the English-language QBoson brand refer to the same Beijing
      photonic-quantum-computing company. Independent coverage places its founding
      in late 2020, while Tracxn lists 2021, so the exact legal-incorporation date
      should not be treated as settled. Tracxn identifies Wen Kai as founder and
      chief executive. The company describes a dual strategy: commercialize
      specialized photonic systems now while pursuing fault-tolerant universal
      computing over a longer horizon. Its official product page lists 100-, 550-
      and 1,000-computational-qubit systems and a 3,000-qubit overclock mode. That
      creates a coherent business identity around room-temperature photonic
      hardware, cloud access, and applied optimization, but the broader universal
      roadmap remains a company claim rather than independently demonstrated
      capability.
    claimRefs: [CO001, CO002, CO004, CO008, CO015]
    tableRefs: [TO001]
  - id: "capital-and-stakeholders"
    title: "Capital and stakeholder structure"
    body: >-
      The clearest financing event is the March 2026 Series B: YiCai, Xinhua, The
      Quantum Insider, and Quantum Computing Report each describe CNY1 billion,
      approximately $145 million. The announced use of proceeds emphasizes product
      research, photonic-chip process improvement, a pilot chip-production line,
      factory expansion, and quantum-plus-AI applications. The investor group is
      unusually state-linked and institution-heavy, including Beijing Financial
      Holdings Group, ICBC Capital, Shenzhen Investment Holdings, and other public
      or financial sponsors. A July report then described a separate pre-IPO
      financing worth several hundred million yuan, but it relied on a reporting
      chain through Binance and Jiemian and explicitly framed the event as needing
      confirmation. No retained source discloses post-money valuation, security
      type, liquidation preferences, debt, or secondary-sale terms.
    claimRefs: [CO005, CO006, CO007, CO012]
    tableRefs: [TO003]
  - id: "team-production-and-deployments"
    title: "Team, production, and deployments"
    body: >-
      Public leadership visibility is concentrated on founder-CEO Wen Kai; the
      assigned evidence does not name a chief financial officer, chief operating
      officer, board chair, or independent directors. Company information relayed
      by The Quantum Insider says research personnel are roughly 70% of the
      workforce and about 65% of employees hold master's or doctoral degrees, but
      no absolute headcount is disclosed. Operational evidence is more concrete:
      reporting says the Shenzhen factory began production in November 2025, and
      the company claims deliveries to the National Supercomputing Center in
      Chengdu, China Mobile, Beijing Electronic Zone High-tech Group, and North
      China University of Technology. Those named deployments show institutional
      access, not paid-customer economics, renewals, utilization, or production
      yield.
    claimRefs: [CO002, CO003, CO009, CO010, CO011]
    tableRefs: [TO002]
  - id: "milestones-and-diligence-interpretation"
    title: "Milestones and diligence interpretation"
    body: >-
      The evidence traces a progression from a 2020/2021 founding window through
      several financing records, factory startup, a next-generation system launch,
      the CNY1 billion Series B, public developer outreach, and a reported pre-IPO
      round. The sequence is directionally consistent with a company moving from
      prototypes toward scaled manufacturing. It does not establish commercial
      maturity. The Quantum Insider notes that qubit count is only a rough capacity
      measure and that performance also depends on stability and error rates;
      manufacturing scale remains an industry hurdle. The same caution applies to
      the company's claimed 7-by-16-hour operation and customer deliveries. Exact
      revenue, margins, burn, runway, valuation, factory yield, and contract
      economics require private diligence before this footprint can be translated
      into enterprise value.
    claimRefs: [CO001, CO005, CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
