evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: >-
      Exact post-money valuation, security type, liquidation preferences, ownership percentages, debt, and
      secondary-sale terms.
    whyItMatters: >-
      Headline funding cannot be converted into ownership, dilution, downside protection, or enterprise value without
      the financing documents.
    diligencePath: >-
      Obtain signed term sheets, stock-purchase documents, the fully diluted cap table, debt schedule, and board
      approvals.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: Audited revenue, gross margin, operating loss, cash flow, cash balance, burn, and runway.
    whyItMatters: Funding raised is not cash available, and public product milestones do not establish commercial economics.
    diligencePath: >-
      Review audited statements, monthly management accounts, bank statements, revenue recognition policies, and a cash
      runway bridge.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: >-
      Complete executive team, board composition, committee structure, leadership changes, succession planning, and
      founder ownership.
    whyItMatters: Only the founder-CEO is publicly named, preventing assessment of governance quality and key-person dependence.
    diligencePath: >-
      Request the organization chart, board register, biographies, employment agreements, committee charters, and
      leadership-change log.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: commercial-scale
    missingEvidence: >-
      Current headcount, factory yield and capacity, supplier concentration, paid-customer count, contract values,
      utilization, renewals, and receivables.
    whyItMatters: >-
      Named deployments and workforce percentages lack denominators and do not establish repeatable production or
      customer economics.
    diligencePath: >-
      Reconcile payroll, factory operating data, bills of materials, supplier contracts, signed customer contracts,
      invoices, usage logs, and collections.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: identity
    missingEvidence: Corporate registry evidence reconciling the late-2020 and 2021 founding dates.
    whyItMatters: >-
      The discrepancy is not thesis-changing but should be resolved before relying on age-based milestone or financing
      analysis.
    diligencePath: Obtain the legal entity's business license, incorporation record, and any predecessor or restructuring documents.
    relatedQuestionRefs:
      - QO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: >-
      A company-verified milestone register with exact dates for product launches, financing closings, laboratory
      openings, and factory commissioning.
    whyItMatters: >-
      The public timeline contains publication dates, month-only dates, and database entries whose legal close dates may
      differ.
    diligencePath: >-
      Reconcile board records, press releases, financing closing documents, shipment records, and factory commissioning
      certificates.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Product pricing, paid deployment count, contract duration, renewal, utilization, and addressable account counts by
      buyer segment.
    whyItMatters: >-
      Without these inputs, broad global forecasts cannot be converted into a defensible Bose Quantum SAM or obtainable
      SOM.
    diligencePath: >-
      Obtain the commercial pipeline and contract cohort, reconcile bookings to recognized revenue, and build bottom-up
      segment sizing from verified prices and eligible accounts.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-conversion
    missingEvidence: >-
      Paid-customer status, recurring revenue, retention, production usage, and measured ROI behind public request,
      university, developer, and deployment counts.
    whyItMatters: >-
      Activity and named deployments may represent trials, research, or subsidized adoption rather than repeatable
      commercial demand.
    diligencePath: >-
      Review customer invoices, renewal cohorts, platform telemetry by paid account, deployment acceptance records, and
      customer ROI studies.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable list and realized prices, usage units, discounts, contract duration, renewal rates, gross margin, and
      full implementation cost for Bose Quantum and named alternatives.
    whyItMatters: >-
      Without normalized commercial terms, differentiation cannot be translated into buyer value, sales efficiency, or
      an underwriting-quality pricing advantage.
    diligencePath: >-
      Obtain redacted contracts, invoices, renewal cohorts, cloud-usage schedules, support statements of work, and
      comparable vendor proposals for the same workload.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: performance-benchmark
    missingEvidence: >-
      Reproducible Bose-versus-classical and Bose-versus-peer results on identical workloads, including solution
      quality, runtime, uptime, errors, energy use, and total cost.
    whyItMatters: >-
      Qubit count and route-level advantages do not establish useful application performance or prove a durable
      technical moat.
    diligencePath: >-
      Commission an independent benchmark with pre-registered workloads and require raw logs, classical baselines,
      hardware configuration, and repeatability statistics.
    relatedQuestionRefs:
      - QP003
      - QP007
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Customer renewal, repeat-order, migration-effort, support-burden, and multi-homing evidence segmented by
      equipment, cloud, and customized service contracts.
    whyItMatters: >-
      Implementation depth can create lock-in, but it can also represent costly services work without recurring economic
      durability.
    diligencePath: >-
      Review customer cohorts and interview procurement, technical, and operations owners at delivered-system and cloud
      accounts.
    relatedQuestionRefs:
