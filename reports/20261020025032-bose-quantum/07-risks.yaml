chapter:
  number: 7
  title: Risks
  summary: >-
    Bose Quantum's strongest evidenced risks are factory ramp, hardware reliability,
    specialist supply-chain exposure, and capital-intensive commercialization. The
    retained public record does not establish legal incidents, audited finances,
    production yield, customer concentration, or independently verified uptime, so
    those items remain diligence gaps rather than inferred violations.
sections:
  - id: ranked-risk-view
    title: Evidence-ranked risk view
    body: >-
      The evidence supports ranking execution risk above presently unverified legal
      risk. Three funding reports say the Series B proceeds are intended for a pilot
      photonic-chip line, expansion of the Shenzhen factory, and resolution of
      technical barriers; that use of proceeds makes repeatable yield, commissioning,
      and reliability the core near-term tests rather than proof that manufacturing
      is already mature. The reported CNY 1 billion ($145 million) round is funding
      raised, not cash available, and none of the retained sources discloses security
      terms, valuation, burn, runway, gross margin, or working-capital needs. Public
      quantum-market volatility and contested market estimates further argue against
      treating sector enthusiasm as evidence of Bose Quantum's financial resilience.
    claimRefs:
      - CR001
      - CR002
      - CR011
      - CR012
      - CR016
    tableRefs:
      - TR003
  - id: operational-technical-execution
    title: Operational and technical execution
    body: >-
      Operational risk is concrete but not yet quantifiable. The company-reported
      system can operate for 7×16 hours, while the financing is also described as
      addressing practical-computing barriers and improving hardware reliability;
      those statements are progress indicators, not an independent availability,
      error-rate, or customer-workload benchmark. QED-C characterizes the broader
      quantum supply chain as custom and fragile, with dependencies on specialized
      photonics, controls, and other components, and separately identifies a shortage
      of cross-disciplinary talent. A peer-reviewed coherent-Ising-machine paper
      supports the architecture's research basis through numerical results, but it
      does not validate Bose Quantum's current production hardware, factory yield,
      service levels, or advantage against current classical methods.
    claimRefs:
      - CR003
      - CR004
      - CR005
      - CR007
      - CR008
      - CR010
      - CR014
    tableRefs:
      - TR002
    figureRefs:
      - FR001
  - id: regulatory-legal-uncertainty
    title: Regulatory and legal uncertainty
    body: >-
      The assigned evidence does not substantiate a lawsuit, enforcement action,
      recall, privacy breach, export-control finding, or missing license. It also does
      not establish that none exists. The official policy candidate redirected to a
      government homepage and yielded no article text, so it cannot verify the
      reported policy language or Bose Quantum's compliance posture. The legal
      register therefore records diligence categories and leaves likelihood unrated
      where the pool lacks primary records. Priority requests are operating and
      product approvals, export-control screening, photonic-chip IP chain of title,
      freedom-to-operate work, safety and quality certifications, incident logs, and
      litigation searches in the relevant Chinese jurisdictions.
    claimRefs:
      - CR007
      - CR012
      - CR015
    tableRefs:
      - TR001
  - id: mitigations-and-kill-criteria
    title: Mitigations, indicators, and thesis-break triggers
    body: >-
      Mitigation maturity should be judged from records rather than roadmap language.
      Before underwriting, obtain monthly pilot-line milestones, first-pass and final
      yield, component single-source exposure, mean time between failure, error-rate
      distributions, customer acceptance tests, and uptime measured on paid workloads.
      Commercial monitoring should separate named deliveries from renewals and revenue
      concentration. The factory-scaling thesis breaks if the pilot line misses agreed
      commissioning dates, repeated customer-load tests cannot reproduce the claimed
      operating window, yield fails to improve over two consecutive review periods,
      or a critical component lacks a qualified second source. The financing thesis
      breaks if audited runway is below the next milestone or undisclosed preferences
      materially impair new-money returns.
    claimRefs:
      - CR002
      - CR004
      - CR006
      - CR007
      - CR009
      - CR013
      - CR014
      - CR016
