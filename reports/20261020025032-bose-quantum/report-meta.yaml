companyProfile:
  summary: >-
    Bose Quantum, also branded QBoson, is a Beijing photonic-quantum-computing company pursuing specialized
    room-temperature systems alongside a longer-term universal-computing roadmap. Public evidence supports a
    multi-system product line, a Shenzhen manufacturing operation, and early institutional deployments, while exact
    incorporation timing, commercial economics, governance depth, and independently benchmarked performance remain
    unresolved.
