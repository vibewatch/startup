        title: 展示项
        blocks:
          - type: callout
            title: 基准风险压过 表面量子比特数量
            body: 光子、超导、离子阱和中性原子系统的量子比特总数，并不能证明有可比的有效性能。投资判断需要匹配的工作负载、解质量、运行时间、正常运行时间、错误表现和经典基线。
            calloutType: risk
            claimRefs:
