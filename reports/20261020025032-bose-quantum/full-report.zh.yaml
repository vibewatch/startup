      - number: '3.2'
        title: Bose 主打可部署性，而非公开基准领先
        blocks:
          - type: paragraph
            body: >-
              Bose 最强的定位证据来自运营，而非横向比较。报道描述了 100、550 和 1,000
              量子比特的专用光子系统、深圳生产设施以及向机构用户交付系统。光子路线可以避开超导系统极端的低温负担，但更广泛的路线可能需要大型光学组件，并为新计算任务重新配置。不同模态的量子比特数量不能直接比较有用性能，现有资料也没有给出
              Bose 与经典求解器或具名量子同行之间可复现的正面对比基准。因此，定位图只是基于已披露平台广度和部署证据的序位式尽调判断，不是性能排名或市场份额估算。
