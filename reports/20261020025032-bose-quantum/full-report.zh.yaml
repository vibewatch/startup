            body: >-
              公开可见的管理层信息集中在创始人兼 CEO Wen Kai；本次证据没有列出 CFO、COO、董事长或独立董事。The Quantum Insider 转述公司信息称，研发人员约占员工总数的 70%，约 65%
              的员工拥有硕士或博士学位，但没有披露绝对员工数。运营证据更具体：报道显示深圳工厂于 2025 年 11 月开始生产，公司还声称已向成都国家超级计算中心、China Mobile、Beijing
              Electronic Zone High-tech Group 和 North China University of Technology
              交付系统。这些具名部署说明其进入了机构场景，但不能证明付费客户经济性、续约、利用率或生产良率。
