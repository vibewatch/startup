        title: 里程碑与尽调解读
        blocks:
          - type: paragraph
            body: >-
              证据勾勒出一条发展轨迹：从 2020/2021 年创立窗口，到多笔融资记录、工厂启动、下一代系统发布、CNY1 billion B 轮、面向开发者的公开推广，以及一笔有报道称已完成的 IPO
              前轮。整体顺序与公司从原型走向规模化制造的方向一致，但不能据此确认商业成熟度。The Quantum Insider
              提醒，量子比特数量只是粗略的容量指标，性能还取决于稳定性和错误率；制造规模化仍是行业难题。公司声称的 7 by 16
              小时运行能力和客户交付也应同样谨慎看待。在这些业务版图转化为企业价值之前，准确收入、利润率、现金消耗、现金跑道、估值、工厂良率及合同经济性都需要通过私有尽调确认。
