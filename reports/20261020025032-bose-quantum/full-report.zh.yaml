  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场应围绕 Bose Quantum
              当前能够销售或提供的产品来界定：专用光子量子计算机、任务型云端访问、软件开发工具，以及用于优化或仿真的应用服务。量子通信、量子传感和量子技术创造的广义经济价值估算属于相邻领域，不应直接视为公司的收入池。更重要的替代方案是经典高性能计算和
              AI。公开部署明确采用混合模式，而审阅的市场分析称，大多数商业工作仍处于试验或混合阶段。因此，Bose Quantum 更像现有工作流中的加速器或专用计算供应商，而不是全面替代经典计算。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 规模估算：不要混淆价值、市场收入与公司机会
        blocks:
          - type: paragraph
            body: >-
              现有规模证据使用了几个不同的分母。Post-Quantum 总结的 McKinsey 数据称，量子计算公司 2025 年收入超过 $1 billion，并预计 2028 年达到 $4.4
              billion；同时，一项针对 2035 年量子技术市场的内部估算为 $60 billion 至 $100 billion，其中量子计算占 $43 billion 至 $71 billion。另一个 $1.3
              trillion 至 $2.7 trillion 的估算指的是经济价值，而不是供应商收入或 Bose Quantum 的 TAM。同一份批评还指出，中国投资数据不完整、量子与 AI
              类别混杂、假设存在不确定性。这些数字可用作情景参考，但不能机械层层外推成 Bose Quantum 的 SAM 或 SOM。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM014
              - CM015
              - CM016
