      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开证据显示其采用路径由机构主导。超级计算中心和电信云运营商采购或托管系统；研究人员、开发者和企业创新团队使用系统；公共、基础设施或研发预算似乎为访问买单。成都部署将一套 550 量子比特相干光子系统与
              100P@FP64 经典算力结合，China Mobile 平台则提供任务型访问和 Python SDK。制药与生命科学、金融、物流、材料和电力系统反复出现为应用场景集群。Bose Quantum
              还报告了较大的云端请求量、大学覆盖数和开发者数量，但这些活跃度指标无法说明付费客户、合同金额、留存或生产 ROI。
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM010
              - CM011
              - CM012
