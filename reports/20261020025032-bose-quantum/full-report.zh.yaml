          detail: 公开报道了具名系统和机构部署。
        - id: contract
          label: 合同与定价
          detail: 单价、目录价、成交价、期限和服务内容均未披露。
        - id: recognized-revenue
          label: 已确认收入
          detail: 收入构成、确认时间、ARR、利用率和续约均未披露。
        - id: gross-profit
          label: 毛利
          detail: 物料清单、良率、安装、支持和保修成本均未披露。
    approximationNotes: 这是受证据约束的链条，不是经过测量的转化漏斗；未披露阶段显示为尽调缺口，而不是估算值。
    claimRefs:
      - CI002
      - CI007
      - CI008
      - CI009
      - CI016
  - id: FE001
    title: 受证据约束的产品架构图
    type: stack
    summary: 公开披露描述了从工作负载到制造的技术栈，但开发者接入面和独立控制证据仍存在缺口。
    data:
      layers:
        - label: 行业工作负载
          detail: 据报道涉及药物、材料、脑科学、电力系统和金融场景，但没有测量结果。
        - label: 开发者与集成接入面
          detail: 在指定来源中未找到公开 SDK、API、云架构、软件包和集成证据。
        - label: AI 辅助编排
          detail: 下一代系统带有公司报告的 7 by 16 小时稳定运行声明，并计划将量子计算与经典 AI 集成。
        - label: 专业光子系统
          detail: 据报道，面向专业任务的产品规模为 100、550 和 1,000 量子比特。
        - label: 通用光子路线图
          detail: 通用光子芯片公告支持另一条长期容错路线。
        - label: 工业化生产
          detail: 深圳工厂覆盖模块开发、整机生产、质量控制和测试，并计划建设芯片试产线。
    approximationNotes: 层级顺序是对已披露组件的分析性组织，不是公司发布的系统图；没有估算任何性能数值。
    claimRefs:
      - CE001
      - CE003
      - CE007
      - CE009
      - CE010
      - CE015
  - id: FU001
    title: 已观察到的客户旅程与未经验证的扩张闭环
    type: journey-map
    summary: 公开证据支持从云端发现到机构部署的路径，但不支持续约环节。
    data:
      items:
        - label: 发现
          detail: 用户通过云渠道、大学和生态合作伙伴接触 Bose Quantum。
          touchpoints:
            - China Mobile Cloud
            - Alibaba Cloud
            - Huawei Cloud
            - 大学
        - label: 试用
          detail: 开发者和研究人员通过云端接入运行优化或量子 AI 工作负载。
          touchpoints:
            - 云解决方案调用
            - 开发者工具
            - 研究工作负载
        - label: 验证
          detail: 生物医学和学术合作方测试特定领域应用。
          touchpoints:
            - 生物制药研究
            - 医院
            - 国家实验室
        - label: 部署
          detail: 选定机构接收或集成专用系统。
          touchpoints:
            - 成都超算中心
            - China Mobile
            - 北方工业大学
        - label: 扩张
          detail: 战略协议和资金可能扩大应用及分销覆盖。
          touchpoints:
            - 20 多项战略协议
            - 联合应用项目
        - label: 续约
          detail: 公开证据未披露续约、扩张收入或客户群留存。
          touchpoints:
            - 合同续约
            - 重复订单
            - 使用量扩张
    approximationNotes: 各阶段概括不同的公开证据面，不代表共享客户群体、测量得出的转化率或已完成的续约周期。
    claimRefs:
      - CU007
      - CU008
      - CU009
      - CU012
      - CU015
  - id: FR001
    title: 风险热力图——影响、可能性与缓释成熟度
    type: matrix
    summary: 按证据加权的经营风险高于未评分的法律类别；由于没有可比的事故率和损失数据，标签均为定性判断。
    data:
      columns:
        - id: likelihood
          label: 可能性
          detail: 基于证据的定性评估
        - id: impact
          label: 影响
          detail: 对工厂规模化论点的潜在影响
        - id: mitigation
          label: 缓释成熟度
          detail: 公开证据显示的成熟度，不是管理层意图
        - id: residual
          label: 剩余严重度
          detail: 公开证据支持的缓释措施实施后的暴露程度
      rows:
        - label: 试产线良率与投产
          note: 资金用途表明仍有工作待完成
          values:
            - value: Medium-high
            - value: High
            - value: Early
            - value: High
        - label: 运行可靠性
          note: 7×16 运行由公司报告，未经独立基准测试
          values:
            - value: Medium
            - value: High
            - value: Demonstration-stage
            - value: Medium-high
        - label: 专业供应链
          note: 行业普遍脆弱；公司供应商图谱不可得
          values:
            - value: Medium
            - value: High
            - value: Unknown
            - value: Medium-high
        - label: 跨学科人才
          note: 行业人才短缺；公司层面的人员配置覆盖不可得
          values:
            - value: Medium
            - value: Medium
            - value: Unknown
            - value: Medium
        - label: 客户集中度
          note: 具名部署缺少收入占比和续约数据
          values:
            - value: Unrated
            - value: High
            - value: Unknown
            - value: Unquantified
        - label: 法律与监管状况
          note: 指定来源池中没有公司层面的第一手法律证据
          values:
            - value: Unrated
            - value: Potentially high
            - value: Unknown
            - value: Unquantified
    approximationNotes: 定性矩阵仅基于保留的公开证据；未评级单元格不得解读为低概率或没有事故。
    claimRefs:
      - CR004
      - CR007
      - CR008
      - CR011
      - CR013
      - CR014
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 据报道的资本和交付证据被缺失的价格与经营证据抵消，因此结论是继续研究。
    data:
      nodes:
        - id: capital
          label: CNY1bn B 轮
          detail: 据报道的融资能力
        - id: production
          label: 试产线与工厂扩建
          detail: 执行计划，不是已实现的经济性
        - id: delivery
          label: 具名机构部署
          detail: 早期采用信号
        - id: economics
          label: 收入、利润率和良率未知
          detail: 经营证据缺口
        - id: terms
          label: 估值和优先权未知
          detail: 入场价格缺口
        - id: decision
          label: 继续研究
          detail: 高风险；估值立场未知
    approximationNotes: 仅表示逻辑顺序；节点顺序不量化概率、价值或转化。
