              四份独立报道一致称，公司在 2026 年 3 月或 4 月宣布完成 CNY1 billion、约 USD145 million 的 B
              轮融资。投资人包括国资支持机构和其他机构投资者，资金指定用于光子芯片试产线、深圳工厂扩建、技术开发及量子加 AI
              商业生态。这证明公司具备融资能力并获得战略支持，但不证明入场价格具有吸引力。现有融资报道均未提供投后估值、证券类型、清算优先权、购买的股权比例或其他用于建模稀释和资金流向的条款。因此，恰当决策是继续研究，风险高且估值立场未知；中等置信度只适用于这一流程建议，而不是任何企业价值估算。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
