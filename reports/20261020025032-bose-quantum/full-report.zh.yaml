          - type: callout
            title: 不要套用行业倍数
            body: 行业投资额和云端访问价格使用不同分母，不能替代 Bose Quantum 的收入、利润率、持股比例或优先权数据。
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
              - CV011
