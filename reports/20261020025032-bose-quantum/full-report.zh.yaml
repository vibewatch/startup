      - number: '3.3'
        title: 企业项目与实体部署塑造商业竞争
        blocks:
          - type: paragraph
            body: >-
              公开记录显示 Bose 有三种产品打包方式：设备销售、云计算订阅和定制化任务型访问。据报道，China Merchants Bank
              项目将真机算力访问与优化界面、矩阵构建、数据验证和定制算法结合起来。这种组合可能使领域实施和工作流集成比标价更重要，而实体部署还会增加安装和运营依赖。这些特征可能带来切换成本，但没有公开证据说明续约率、合同期限、实际定价、折扣、多云使用或客户迁移。资本实力更强的平台可以用更广的开发者生态、云分发和多条硬件路线进行反击。
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP006
              - CP007
      - number: '3.4'
        title: 护城河取决于可重复的生产与可验证的结果
        blocks:
          - type: paragraph
            body: >-
              如果 Bose
              能比同行更快地把工厂、光子芯片研发和应用服务转化为可靠部署，就可能形成可信的护城河。但不利情景也很明显：技术路线仍未定型，中国量子结果往往难以独立复现，进口光子和控制组件仍限制供应链自主性。国资可以加速产能，也可能同时偏向相邻的国资关联平台和采购渠道。因此
              Bose
              面临三类替代风险：另一种量子模态可能实现更优的纠错性能；光子同行可能使硬件层商品化；或者经典与混合求解器对客户工作负载始终够用。持久差异化需要经审计的正常运行时间、可比的解质量、复购订单和供应商韧性，而这些目前都没有公开量化。
            claimRefs:
              - CP003
              - CP004
              - CP010
              - CP012
              - CP014
              - CP015
