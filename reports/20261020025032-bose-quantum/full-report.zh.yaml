      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              可投资论点是押注专用光子量子系统执行力的期权：已报道产品覆盖 100、550 和 1,000 量子比特；深圳工厂正从实验室工作转向标准化生产；具名机构部署也初步证明系统已经走出实验室。Xinhua 还报道，中国
              2026 年第一季度量子融资超过 CNY3.2 billion，超过 2025
              年全年，说明行业资金供给充足。反论点是，资本密集度、尚未成熟的工业经济性和政策导向资金可能跑在经独立验证的商业需求之前。公开披露没有证明经常性收入、毛利率、续约行为、工厂良率或客户集中度；USCC
              同时警告，不透明度和国家协调使中国量子成熟度难以比较。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV007
              - CV008
              - CV012
              - CV013
      - number: '8.3'
        title: 情景框架与可比背景
        blocks:
          - type: paragraph
            body: >-
              基于现有资料无法给出站得住脚的数值估值区间，因为 Bose Quantum 的企业价值和标准化经营指标都未公开。行业数据只能提供方向性背景。PostQuantum 转述 McKinsey 估算称，2025
              年量子领域投资为 USD12.6 billion，行业收入超过 USD1 billion；但同一分析批评这些汇总数字的精确性，尤其是在中国融资和量子加 AI 项目不透明的情况下。Azure Quantum
              的定价还显示，变现模式可按每项任务最低收费、门操作次数、处理器小时和月度订阅计价；这些第三方价格不是 Bose Quantum
              的直接收入或估值可比项。因此，乐观、基准和悲观情景应由已验证的运营里程碑触发，而不是赋予没有依据的概率或倍数。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV010
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: 入场纪律、退出准备度与尽调要求
        blocks:
          - type: paragraph
            body: >-
              可投资的入场案例需要条款清单和股权结构表，按硬件、云和服务拆分的经审计收入与利润率，客户层面的合同经济性，现金消耗和现金跑道，工厂良率和利用率，以及具名部署转化为付费续约的证据。最低决策资料还应对齐 CNY 和
              USD 融资数字，识别优先权和反稀释权利，并量化完全摊薄后的出让股权。退出准备度目前未经证明：现有资料展示了资本形成和早期交付，但没有 IPO
              时间表、战略买方流程或可用于建模的现金流。论点失效触发因素包括工厂扩张失败、部署背后没有经常性付费使用、重大优先权悬置，或价格在独立证明之前就假定公司已广泛商业化。在这些事项解决前，正确做法是保留选择权，而不是设定目标回报或持有期。
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 没有价格，就没有投资判断
            body: 报道中的融资金额证明的是已募集资本，而不是企业价值、可用现金或有吸引力的入场价格。
            calloutType: recommendation
            claimRefs:
