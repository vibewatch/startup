chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营主张
        blocks:
          - type: paragraph
            body: >-
              Bose Quantum 与英文 QBoson 品牌指的是同一家北京光子量子计算公司。独立报道将其创立时间定位在 2020 年末，而 Tracxn 列为 2021
              年，因此确切的法律设立日期不应视为已经确定。Tracxn 将 Wen Kai 列为创始人兼 CEO。公司提出双轨策略：当下商业化专用光子系统，同时在更长周期内推进容错通用计算。其官方产品页列出 100、550 和
              1,000 计算量子比特系统，以及 3,000 量子比特超频模式。这使公司围绕室温光子硬件、云端访问和应用优化形成了相对完整的商业身份；但更宽泛的通用计算路线图仍只是公司主张，尚未得到独立能力验证。
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO008
              - CO015
