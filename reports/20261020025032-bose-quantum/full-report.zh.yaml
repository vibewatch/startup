      - number: '1.2'
        title: 资本与利益相关方结构
        blocks:
          - type: paragraph
            body: >-
              最清晰的融资事件是 2026 年 3 月的 B 轮：YiCai、Xinhua、The Quantum Insider 和 Quantum Computing Report 均称融资额为 CNY1
              billion，约 $145 million。公司宣布资金将主要用于产品研发、光子芯片工艺改进、芯片试产线、工厂扩建及量子加 AI 应用。投资人阵容具有明显的国资关联且机构投资者占比高，包括 Beijing
              Financial Holdings Group、ICBC Capital、Shenzhen Investment Holdings 及其他公共或金融机构。7 月的一篇报道又称公司完成了另一笔数亿元人民币的
              IPO 前融资，但报道链条经由 Binance 和 Jiemian，且明确表示仍需确认。现有资料没有披露投后估值、证券类型、清算优先权、债务或老股转让条款。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO012
