  - id: TV003
    title: 乐观、基准和悲观估值情景
    columns:
      - 情景
      - 假设
      - 估值与回报逻辑
      - 概率信号
      - 下行或升级触发条件
    rows:
      - - 乐观
        - 工厂扩建产出可靠系统，部署转化为持续付费工作负载。
        - 只有在取得经审计收入、利润率、留存和股权结构数据后，增长型估值才可能站得住脚；公开资料不显示任何有依据的数值区间。
        - 只有独立核验生产和客户里程碑后，判断才会转为正面。
        - 若出现重复采购、单位经济性改善和清晰的优先权条款，则上调判断。
      - - 基准
        - 资本支持持续交付，但商业质量和生产经济性仍不透明。
        - 价值仍无法确定；应以核验后的现金需求和持股比例为谈判基础，而不是行业宣传口径倍数。
        - 当前公开证据最接近支持这一情景。
        - 在取得条款清单、经审计财务报表和客户群组数据前，维持“继续研究”判断。
      - - 悲观
        - 工厂扩产延期、需求仍由试点主导，或政策支持的资本掩盖了疲弱的市场拉力。
        - 由于没有公开的收入底线或清算优先级结构，降价轮融资和稀释风险占主导。
        - USCC 和行业方法论的保留意见与这一风险一致，但并非经过测量的概率。
        - 若规模化里程碑失败、没有付费续约、优先权苛刻，或价格脱离经核验的经济性，则投资论点失效。
    notes: 由于保留来源既未披露当前估值，也未披露可直接建模的经营指标，以上情景为定性判断；概率信号是条件，不是数值概率。
    claimRefs:
