              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 采用驱动因素、约束与估值关联
        blocks:
          - type: paragraph
            body: >-
              大型企业试验预算、中国战略支持、云分发和早期机构部署正在推动采用；但公司还必须证明相对不断进步的经典与 AI 基线具备优势，打通混合工作流、提高可靠性，并扩大专用芯片和系统制造。Bose Quantum 2026
              年融资投向芯片试产线和工厂扩建，既支持供给扩张意图，也凸显资本密集度。因此，估值的决定性证据不是宽泛的 2035 年预测，而是定价、付费部署数量、经常性使用、续约、毛利率和可测量的客户
              ROI。本次证据中没有披露这些公司层面的转化指标。
            claimRefs:
              - CM002
              - CM009
              - CM012
              - CM013
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 混合部署是可观察到的采用模式
            body: 最强的独立部署证据是将光子量子算力与经典超级计算结合，而不是取代经典计算栈。
            calloutType: insight
            claimRefs:
              - CM002
              - CM005
          - type: callout
            title: 公开活跃度不足以证明可变现的 SOM
            body: 使用请求、开发者数量和具名部署是有价值的需求信号，但定价、付费客户转化、续约和客户 ROI 仍未披露。
            calloutType: risk
            claimRefs:
              - CM011
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 模态、机构与替代方案构成的宽广赛道
        blocks:
          - type: paragraph
            body: >-
              Bose Quantum 首先面对的是中国量子计算供应商和国资关联的研究平台，而不只是其他光子初创公司。Origin Quantum 和 USTC 支持的系统代表超导替代方案；Turing Quantum
              和大学光子项目在光学路线竞争；SpinQ、QuantumCTek
              以及电信支持的平台则带来资本、渠道或相邻基础设施。国际上，Quantinuum、IBM、Google、AWS、IonQ、PsiQuantum、Quandela、QuiX
              和中性原子供应商扩大了买方的选择。对于不愿接受硬件不成熟或量子优势不确定的买方，经典高性能计算和内部优化团队仍是默认方案。公开证据不支持存在唯一赢家：不同模态需要在室温运行、相干性、速度、物理占地和规模化复杂度之间权衡。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP005
