company:
  name: "Bose Quantum"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    Bose Quantum has raised CNY1 billion for chip-production and factory scale-up,
    but the public record does not disclose revenue, pricing, gross margin, burn,
    cash, or runway. The financing supports an industrialization plan rather than
    a financeable view of revenue quality or capital adequacy.
sections:
  - id: "revenue-model-and-traction"
    title: "Revenue model and public traction"
    body: >-
      Public evidence supports several possible monetization surfaces, not a
      disclosed revenue mix. Bose Quantum's registered business scope spans
      software, quantum-computing technical services, cloud-computing equipment,
      instruments, and computer-peripheral manufacturing. Independent reports
      also describe 100-, 550-, and 1,000-qubit specialized systems and delivered
      products to institutional users including the Chengdu supercomputing center,
      China Mobile, Beijing Electronic Zone High-tech Group, and North China
      University of Technology. Those deployments establish commercial activity,
      but none of the retained sources states whether customers bought hardware,
      paid for cloud access, funded pilots, or entered recurring service contracts.
      Revenue therefore cannot be separated into hardware, software, cloud, or
      services, and reported deployments should not be converted into revenue,
      ARR, or customer-retention estimates.
    claimRefs: [CI001, CI002, CI006, CI007, CI008]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: "cost-structure-and-unit-economics"
    title: "Cost structure and unit-economics constraints"
    body: >-
      The visible cost structure is dominated by an industrialization program:
      a photonic-chip pilot line, expansion of the Shenzhen quantum-computer
      factory, hardware-reliability work, and AI-assisted control. These are
      manufacturing and engineering commitments, not evidence of gross-margin
      improvement. Sector evidence is cautionary: a 2025 Chinese government
      report said quantum-computing R&D expenditure exceeded total revenue in
      both 2023 and 2024, while CNAS describes thin demand, high component costs,
      long lead times, and vertical integration as mutually reinforcing barriers.
      No public input is available for average selling price, bill of materials,
      yield, installation cost, support burden, utilization, renewal, CAC, or
      payback. A defensible unit-economics model is therefore not possible from
      this source set.
    claimRefs: [CI004, CI005, CI010, CI011, CI016]
    tableRefs: [TI003]
  - id: "capital-adequacy"
    title: "Capital adequacy and financing dependency"
    body: >-
      Three independent reports place the latest Series B at CNY1 billion, or
      about USD145 million, and consistently tie proceeds to chip-production and
      factory expansion. That is meaningful financing capacity, but funding
      raised is not cash available: the sources provide no closing-date cash
      balance, tranche schedule, debt terms, restricted-use conditions, monthly
      burn, or runway. AiQicha separately displays CNY360 million of registered
      capital and CNY17.980521 million of paid-in capital; those registry fields
      are legal-capital records, not measures of liquidity or the Series B cash
      balance. The disclosed use of proceeds indicates continuing dependence on
      capital for production scale-up, while the absence of operating cash-flow
      data prevents an assessment of when another financing event may be needed.
    claimRefs: [CI003, CI004, CI013, CI014, CI015]
  - id: "financial-verdict"
    title: "Financial verdict and diligence blockers"
    body: >-
      The strongest financial conclusion is that Bose Quantum remains an
      industrial-scale-up underwriting case rather than a measurable growth or
      margin story. Public evidence shows products, deployments, a factory, and a
      large financing round, but it does not connect those assets to realized
      pricing, recognized revenue, gross profit, cash consumption, or customer
      repeat behavior. A sector benchmark summarized by PostQuantum reports more
      than USD1 billion of global quantum-company revenue in 2025, yet the same
      analysis warns that market-investment totals are difficult to reconcile and
      that China data are limited. That benchmark cannot be allocated to Bose
      Quantum. Underwriting should remain conditional on audited financials,
      contract-level revenue evidence, unit-cost and yield data, cash and debt
      schedules, and a board-approved operating plan through the next financing
      trigger.
    claimRefs: [CI002, CI009, CI010, CI011, CI012, CI015, CI016]
