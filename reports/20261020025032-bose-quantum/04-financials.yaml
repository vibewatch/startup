callouts:
  - calloutType: "risk"
    title: "Funding does not answer runway"
    body: >-
      The CNY1 billion Series B is reported as financing for chip and factory
      expansion. Without cash receipts, restrictions, burn, debt, and operating
      forecasts, it cannot be translated into cash available or months of runway.
    claimRefs: [CI003, CI004, CI009, CI015]
  - calloutType: "recommendation"
    title: "Gate underwriting on primary financial evidence"
    body: >-
      Require audited statements, customer contracts, revenue recognition,
      factory yield and unit cost, working-capital schedules, and a cash runway
      model before assigning revenue quality, margin, or financing sufficiency.
    claimRefs: [CI008, CI009, CI011, CI016]
