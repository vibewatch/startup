      - "Source assessment"
    rows:
      - ["Specialized quantum systems", null, "Neither disclosed", "Hardware price, installation, warranty, support, and acceptance terms are unknown", "No retained source states a price"]
      - ["Quantum cloud or technical service", null, "Neither disclosed", "Usage unit, subscription term, paid-user count, utilization, and renewal are unknown", "Registered scope supports availability, not monetization"]
      - ["Application and algorithm projects", null, "Neither disclosed", "Project fee, services content, duration, and customer co-funding are unknown", "Deployments and use cases do not establish contract value"]
    notes: "Null means the retained prefetched evidence contains no public price or contract value; deployment names and business-scope registrations are not substituted for realized monetization."
    claimRefs: [CI001, CI002, CI008, CI016]
  - id: "TI003"
    title: "Unit economics and capital-adequacy dashboard"
    columns:
      - "Metric"
      - "Public value"
      - "Confidence"
      - "Why it matters"
      - "Diligence ask"
    rows:
      - ["Revenue / ARR", null, "Low", "Defines scale and recurring quality", "Audited revenue bridge by hardware, cloud, software, and services"]
      - ["Gross margin", null, "Low", "Tests whether factory scale can create economic leverage", "Product gross margin, bill of materials, yield, installation, warranty, and support costs"]
      - ["CAC / payback / sales cycle", null, "Low", "Tests GTM efficiency and working-capital burden", "Pipeline conversion, acquisition spend, sales-cycle distribution, receivables, and channel fees"]
      - ["Cash / burn / runway / debt", null, "Low", "Determines financing dependency and downside protection", "Bank statements, monthly burn, debt schedule, restricted cash, and base/downside runway"]
      - ["Latest financing", "CNY1 billion (about USD145 million)", "Medium", "Funds industrialization but does not establish available cash", "Closing documents, tranche receipts, use restrictions, and post-close cash balance"]
    notes: "Null means unavailable in the retained public evidence; the financing figure is third-party reporting of a company announcement and is not converted into cash on hand or runway."
    claimRefs: [CI003, CI004, CI008, CI009, CI015, CI016]
