company:
  name: Bose Quantum
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Bose Quantum has moved beyond a single laboratory prototype into a disclosed
    100-, 550-, and 1,000-qubit specialized photonic-computing product line, a
    Shenzhen manufacturing operation, and early institutional deployments. The
    strongest public evidence supports product breadth and a factory-scaling
    strategy, but not independently benchmarked performance, factory yield,
    developer tooling, or security and quality certifications.
sections:
  - id: product-workflows
    title: Product lines and customer workflows
    body: >-
      Bose Quantum's disclosed commercial surface is a family of specialized
      photonic quantum computers at 100, 550, and 1,000 qubits rather than a
      proven general-purpose, fault-tolerant platform. Public reporting describes
      these systems as optimization-oriented machines and associates the
      next-generation system with drug development, materials discovery, brain
      science, power systems, and finance. Those are use-case categories, not
      measured customer outcomes: the reviewed sources provide no comparative
      runtime, solution-quality, cost, or production-utilization data. The
      announced universal photonic chip and the company's dual-track strategy
      extend the roadmap, but public evidence does not establish that the
      universal product is commercially available.
    claimRefs: [CE001, CE002, CE009, CE010]
    tableRefs: [TE001, TE002]
  - id: architecture-and-production
    title: Architecture and industrialization model
    body: >-
      The architecture disclosed publicly combines room-temperature photonic
      compute, AI-assisted system control, full-system assembly, and planned
      photonic-chip pilot production. Photons are used as qubits, reducing the
      need for the extreme cryogenic environment associated with some competing
      modalities. Xinhua's factory report provides the clearest operating-model
      detail: module development, full-system production and manufacturing, and
      quality-control testing are separate factory divisions. Later reporting
      says production began in November 2025 and describes a planned chip pilot
      line. This creates a plausible path from component engineering to finished
      systems, but no public yield, throughput, defect-rate, or supplier data
      validates repeatable manufacturing economics.
    claimRefs: [CE005, CE006, CE007, CE008, CE013, CE014]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: deployment-and-maturity
    title: Deployment evidence and maturity
    body: >-
      Public deployment evidence is stronger than a pure roadmap claim but still
      short of production-grade validation. Yicai reported deliveries to the
      National Supercomputing Center in Chengdu, China Mobile, Beijing Electronic
      Zone High-tech Group, and North China University of Technology. Reporting
      on the next-generation machine also repeats a company claim of stable
      operation for 7 by 16 hours under an AI-driven control system. Neither
      metric is accompanied by uptime methodology, workload success criteria,
      error rates, or an independent acceptance test. Sector benchmarks likewise
      distinguish enterprise engagement and proofs of concept from positive-ROI
      production use, so named delivery should not be treated as verified,
      durable customer value.
    claimRefs: [CE003, CE004, CE011, CE012]
  - id: controls-and-technical-risk
    title: Trust, integration, and technical risk
    body: >-
      The assigned evidence does not disclose a public SDK, API, package registry,
      repository, cloud-service specification, integration guide, status history,
      security certification, privacy control, or independent product benchmark.
      That absence does not prove these capabilities do not exist; it makes them
      material diligence requests. External sector analysis also warns that
      rigorous quantum supply-chain assessment needs platform-specific bills of
      materials and validated substitution paths that are not publicly
      available. A separate industry critique identifies lasers, control
      electronics, and manufacturing processes as scaling bottlenecks. Bose
      Quantum therefore needs to substantiate its own supplier concentration,
      quality system, incident handling, maintainability, and customer support
      before factory scale can be credited as reliable product scale.
    claimRefs: [CE013, CE014, CE015, CE016]
