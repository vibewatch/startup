callouts:
  - calloutType: risk
    title: Industrial scale is not yet reliability proof
    body: >-
      A factory, named deliveries, and an extended-runtime claim show engineering
      progress, but public evidence still lacks yield, error-rate, uptime,
      security, integration-cost, and independently measured customer outcomes.
    claimRefs: [CE003, CE004, CE008, CE013, CE014, CE016]
