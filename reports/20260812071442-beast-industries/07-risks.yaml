    - Sustained audience decline that weakens cross-sell conversion
    - Lower revenue-growth and moat assumptions across the portfolio
  - - Execution complexity risk
    - Missed profitability, stalled integrations, or expanding org confusion
    - Failure to hit 2026 profit path while adding new products
    - Move view from controlled expansion to overexpansion risk case
  notes: These are the main thesis-break monitors the investment committee should revisit quarterly.
