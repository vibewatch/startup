  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board governance
    missingEvidence: A current board roster, committee structure, and investor-control rights for Beast Industries.
    whyItMatters: Without public governance detail it is hard to evaluate oversight quality, founder checks, or investor influence.
    diligencePath: Request the board deck, governance org chart, and current board observer or committee list directly from management or lead investors.
    relatedQuestionRefs:
    - QO010
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: capital structure
    missingEvidence: Debt facilities, preference stack, liquidation terms, and any secondary-sale history for current shareholders.
    whyItMatters: Late-stage valuation work can swing materially based on senior securities, debt burden, and founder/common dilution.
    diligencePath: Request the latest cap table, financing documents, debt schedule, and any side-letter summary before treating the $5B pricing headline as fully underwritten value.
    relatedQuestionRefs:
    - QO016
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: minor
    topic: audience and employee counts
    missingEvidence: A company-issued metric dictionary defining subscriber, follower, employee, and monthly-view counts across all channels and entities.
    whyItMatters: Public sources use different timing and scope definitions, which can produce drift across KPI tables and later operating analyses.
    diligencePath: Ask management for a current KPI sheet with metric definitions and a single reporting date across all business lines.
    relatedQuestionRefs:
    - QO004
    - QO018
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: segment profitability
    missingEvidence: Segment-level gross margin, operating expense, and cash-flow data for media, Feastables, Lunchly, software, and philanthropy.
    whyItMatters: The company clearly has scale, but without segment economics investors cannot tell which lines truly fund the platform and which remain subsidy-heavy.
    diligencePath: Obtain the monthly or quarterly management P&L by business line, including intercompany allocations and customer-acquisition assumptions.
    relatedQuestionRefs:
    - QO013
    - QO014
