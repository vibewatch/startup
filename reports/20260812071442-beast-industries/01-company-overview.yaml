company:
  name: Beast Industries
chapter:
  number: 1
  title: Company Overview
  summary: 'Beast Industries is Jimmy Donaldson''s North Carolina-based holding company for a creator-led portfolio spanning media, consumer products, software, fintech, and philanthropy. Public reporting now supports a company-scale profile rather than a single-channel influencer brand: the group disclosed a Step acquisition in February 2026, Amazon renewed Beast Games after a 50 million-viewer debut, and multiple high-profile outlets place valuation around $5 billion with 2024 revenue near $473 million. The main diligence constraint is not lack of commercial ambition but lack of traditional disclosure: board structure, cap-table terms, debt, and segment profitability remain largely private.'
sections:
- id: identity-scale
  title: Identity, footprint, and portfolio structure
  body: 'Beast Industries has moved from being shorthand for Jimmy Donaldson''s YouTube operation to being a real holding-company layer over several adjacent businesses. Public sources now consistently describe the group as spanning three broad vectors: media and studio production, consumer products, and software or services. Business Insider''s pitch-deck reporting breaks the stack into media, consumer packaged goods, and software; Forbes and EverythingPR add the current branded portfolio explicitly, including Feastables, Beast Games, Lunchly, Viewstats, MrBeast Studios, Step, and Beast Philanthropy. That matters because the company no longer depends on a single monetization path. Instead, the audience engine drives traffic into physical retail, streaming distribution, paid creator tools, and philanthropic campaigns that reinforce brand affinity.


    The operational center of gravity remains Greenville, North Carolina. Time''s 2026 profile describes a 132-acre corporate campus with studios and challenge sets spread around Greenville, and both the Step press release and NetInfluencer''s coverage of Jeff Housenbold anchor the company in Greenville as the working headquarters. The official Beast Industries website itself is notably sparse and still says ''Launching Soon,'' which is an unusual disclosure posture for a company this visible. As a result, outside analysts must reconstruct the business from press releases, partner announcements, profile pieces, and subsidiary pages rather than from a centralized investor-relations site. That opacity is a recurring diligence theme across the rest of the report.'
