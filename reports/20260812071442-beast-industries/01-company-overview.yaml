- id: capital-metrics
  title: Funding context, scale markers, and supported cover metrics
  body: 'The best public funding and scale anchors come from media reporting rather than company-issued financing memos. Business Insider''s February 2025 deck-based reporting says Beast Industries generated $473 million of revenue in 2024, up from $221 million in 2023, and forecast roughly $899 million for 2025. The same reporting pegs media at $226 million of 2024 revenue, Feastables at $215 million of net revenue, and MrBeast Lab at $65 million of sales in its first six months. Time adds a more operational framing: Beast Industries has lost about $500 million over five years, cut more than $100 million of operating expense in the prior 14 months, and expects to turn a profit for the first time in 2026. Those figures make the topline impressive but also show why outside capital and tighter cost controls matter.


    Valuation evidence clusters around $5 billion rather than any single pristine funding document. Business Insider says Bloomberg reported a $5 billion fundraising process; Time says the company is valued north of $5 billion; and independent profiles such as EverythingPR and Quasa repeat a similar range. CNBC separately reported a $200 million January 2026 investment from Bitmine, which reinforces that outside investors still view Beast Industries as financeable even while its disclosure remains sparse. The company has not filed a public S-1, and public sources do not provide a verified board-approved cap table, debt schedule, or preference stack. For diligence, the right conclusion is that Beast Industries is big enough to warrant institutional pricing, but not yet transparent enough to underwrite like a conventional IPO candidate.'
