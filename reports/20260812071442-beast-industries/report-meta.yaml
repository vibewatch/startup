companyProfile:
  summary: Beast Industries is a Greenville, North Carolina-based private holding company built around Jimmy Donaldson's global creator audience and a fast-expanding portfolio that now includes Feastables snacks, Beast Games and other media properties, Viewstats software, Step fintech, Lunchly food products, and Beast Philanthropy. Public evidence indicates that Feastables is currently the main revenue anchor, while Beast Games, Viewstats, and Step supply the diversification and optionality narrative. The business has reached unusual scale for a creator-led private company, but it still discloses far less than investors would expect from a business already discussing IPO ambitions.
