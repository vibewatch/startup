    - Regulatory scrutiny and partner concentration
  - - Campaign / nonprofit layer
    - Channels audience into charitable outcomes
    - NGO partners, donors, logistics, beneficiary ops
    - Verification and operational-scale risk
  notes: The operating architecture is partly owned and partly outsourced. Beast orchestrates the stack more than it fully owns it.
