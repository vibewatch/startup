  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Viewstats external traction and retention
    missingEvidence: Public pages describe the product but do not disclose paying users, churn, enterprise logos, or retention outcomes.
    whyItMatters: Without real customer proof it is difficult to know whether Viewstats is a durable software business or mainly a packaging of internal know-how.
    diligencePath: Request paid-subscriber cohorts, active teams, retention, case studies, and API usage metrics.
    relatedQuestionRefs:
    - QE002
    - QE007
    - QE024
    relatedTableRefs:
    - TE001
    - TE005
  - type: private-evidence-only
    severity: material
    topic: Unified governance and privacy architecture
    missingEvidence: The public record does not describe a single cross-portfolio system for privacy, data rights, safety review, or shared quality governance.
    whyItMatters: As Beast combines media, fintech, commerce, and philanthropy, cross-surface governance becomes a product and trust issue, not just a policy footnote.
    diligencePath: Request portfolio governance maps covering data flows, review committees, incident response, and shared control owners.
    relatedQuestionRefs:
    - QE014
    - QE023
    - QE011
    relatedTableRefs:
    - TE003
    - TE004
  - type: private-evidence-only
    severity: material
    topic: Step post-acquisition integration plan
    missingEvidence: Public sources confirm the acquisition and feature set but do not explain the technical integration plan, shared roadmap, or compliance operating model after close.
    whyItMatters: Fintech integration is one of the highest-complexity product moves in the Beast portfolio.
    diligencePath: Request integration roadmap, compliance-org chart, vendor map, and product release plan for Step under Beast ownership.
    relatedQuestionRefs:
    - QE003
    - QE015
    - QE017
    relatedTableRefs:
    - TE001
    - TE005
  - type: private-evidence-only
    severity: minor
    topic: Food and production quality metrics
    missingEvidence: Public Feastables and Lunchly pages do not provide recall, complaint, or detailed quality KPIs, and Beast Games public pages do not provide operating-quality KPIs.
    whyItMatters: Physical-goods and production-heavy businesses need quality metrics to complement creator-led growth narratives.
    diligencePath: Request QA scorecards, incident logs, and production safety review metrics by business line.
    relatedQuestionRefs:
    - QE012
    - QE014
    relatedTableRefs:
    - TE004
