  topStrengths:
    - Beast 已经跨过真实经营规模门槛：公开收入锚点显示，2024 年收入 $473M，2025 年预测约 $899M。
    - 公司把全球最大之一的创作者需求引擎，与 CPG、精品媒体、软件和金融科技等实物变现面连在一起。
    - Feastables 看起来是真正的核心业务，不是周边商品副业；与大多数创作者公司相比，估值有了更具体的锚。
    - Beast Games 用 25 天 50M 观众和 Amazon 两季续订，验证了精品流媒体需求。
    - Jeff Housenbold 推动运营搭建，加上 Beast 仍能拿到资本，显示公司正从创始人式混乱转向更制度化的平台。
  topRisks:
    - 公司已按约 $5B 定价，公开披露却仍很薄：没有经审计的公开财务、没有股权结构细节，也没有公开的准备金处理。
    - Step 带来组合内最高严重度的监管和合作伙伴风险，尤其是在参议院审视和 Evolve 相关疑虑之下。
    - Beast Games 诉讼、职场治理历史和其他未决法律事项，可能压缩媒体与平台叙事享有的溢价。
    - Lunchly 和其他消费品新品若出现食品质量波动或品类延展失误，会伤到同一个支撑企业价值的信任引擎。
    - 公司仍高度绑定 Jimmy Donaldson，创始人集中度和受众集中度仍是主要承销风险。
    - 当前估值下，新投资人安全边际有限：基准情景上行不大，悲观情景回撤仍显著。
  unresolvedGaps:
    - 当前股权结构表和优先股堆叠：公开来源没有说明新资金排在哪些权利或优先级之后。
    - 经审计 2025 和 2026 年财务：收入规模可见，但分部利润率、烧钱速度和现金生成仍未披露。
    - Step 治理架构：投资人仍看不到收购后完整合规体系和银行合作伙伴应急方案的公开证据。
    - 诉讼和准备金处理：公开来源没有披露未决事项的保险覆盖、准备金规模或和解敏感性。
    - 去 Jimmy Donaldson 化的可复制性：公开证据尚未证明，Beast 能在创始人中心性显著下降时创造同等价值。
