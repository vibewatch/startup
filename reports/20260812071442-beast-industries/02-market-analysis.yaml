  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: company-specific market share
    missingEvidence: Beast Industries does not publish category revenue splits, retailer sell-through, or share data by market.
    whyItMatters: Without category-level revenue splits it is impossible to translate broad market lenses into a defensible SAM or share-of-market case.
    diligencePath: Request management reporting by business line, retailer sell-through, and geography to convert stitched market context into actual share assumptions.
    relatedQuestionRefs:
    - QM023
    - QM025
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: minor
    topic: creator economy sizing methodology
    missingEvidence: A single apples-to-apples 2026 creator-economy definition showing which subcategories are counted in each research firm's estimate.
    whyItMatters: Different TAM figures include different mixes of platform payouts, brand spend, commerce, and software, which can produce false precision.
    diligencePath: Normalize the published market studies into one scope map before using any single creator-economy figure in an investment memo.
    relatedQuestionRefs:
    - QM006
    - QM024
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: cross-sell conversion data
    missingEvidence: Evidence showing how many Beast audience members convert from content viewers into Feastables buyers, Step users, or Viewstats subscribers.
    whyItMatters: The core market thesis assumes audience flywheel conversion, but the public record does not quantify that conversion at business-line level.
    diligencePath: Ask for cohort-level attribution, referral, or promo-code data showing cross-sell conversion by surface and by region.
    relatedQuestionRefs:
    - QM017
    - QM025
  - type: stale
    severity: minor
    topic: confectionery interpolation
    missingEvidence: A directly published 2026 chocolate-confectionery figure from the same methodology used in the retained report.
    whyItMatters: The current 2026 lens is inferred from a 2022 base and 2030 forecast, which is adequate for orientation but not ideal for precision.
    diligencePath: Replace the inferred midpoint with a current-year confectionery study if one becomes accessible on a public basis.
    relatedQuestionRefs:
    - QM007
    relatedTableRefs:
    - TM002
