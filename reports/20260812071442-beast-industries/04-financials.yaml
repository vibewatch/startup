- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Segment gross margins by media, CPG, platforms, and fintech
    - Without this, investors cannot tell which businesses truly subsidize the others
    - Request management segment P&Ls and margin bridges for 2024, LTM, and forecast 2026
  - - Cash balance, monthly burn, and runway
    - Blocks any real capital-adequacy conclusion
    - Request treasury summary, debt schedule, and base and downside runway cases
  - - Viewstats paid subscriber and churn data
    - Prevents underwriting of the recurring software revenue thesis
    - Request subscriber cohorts, MRR, ARPU, logo list, and net revenue retention
  - - Step monetization and credit or fraud metrics
    - Makes fintech value impossible to price
    - Request actives, spend, balances, interchange, losses, reserves, and bank-partner economics
  - - Retail sell-through and reorder data for Feastables and Lunchly
    - Without repeat behavior the CPG thesis is just launch velocity
    - Request retailer-level sell-through, repeat purchase, ACV, and promo-spend data
  - - Beast Games full P&L including overages
    - Leaves the largest premium-media proof point economically ambiguous
    - Request series-level budget, Amazon payments, prize costs, and residual obligations
  notes: The chapter's biggest conclusion is not that evidence is absent, but that the missing metrics are concentrated exactly where underwriting needs them most.
