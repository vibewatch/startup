tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Media / YouTube
    - Ads + brand integrations + channel monetization
    - Views, sponsorship packages
    - CNBC says each major video can do a couple million in ads and a couple million in brand deals
    - High scale but volatile margin because spend is front-loaded and reinvestment-heavy
    - What percent of media revenue is recurring versus campaign-driven?
  - - Beast Games / premium entertainment
    - Licensing / commissioning from platform buyer
    - Episode / season deal value
    - BI Africa says the original 10-episode deal was valued at $100M; Amazon renewed two more seasons
    - Institutional buyer proof is strong, but economics depend on production cost discipline
    - What was net contribution after production overspend and shared costs?
  - - Feastables
    - Retail snack sell-through
    - Net revenue / retail units
    - BI Africa reports $215M 2024 net revenue; Feastables appears to be the largest commerce engine
    - Likely one of the better gross-profit candidates, but margins are undisclosed
    - What are gross margin, trade spend, and retailer concentration by channel?
  - - Lunchly / consumer products
    - Retail lunch-kit sell-through and adjacent CPG
    - Retail sales
    - BI Africa says Lunchly reached $5M in first 11 weeks on shelves
    - Early revenue proof exists, but repeat purchase and retailer permanence are still unclear
    - What are repeat purchase rates and retailer expansion economics?
  - - Viewstats / platforms
    - Recurring software subscriptions and creator analytics
    - Subscription revenue
    - Public pricing page shows a free tier plus a $249/mo plan; public revenue not disclosed
    - Potentially high-quality recurring revenue, but scale unknown
    - How many paying subscribers, what ARPU, and what churn?
  - - Step / financial services
    - Card, banking, rewards, savings, future financial products
    - Active users / card spend / spread / fees
    - Step brings 7M+ users and a fintech stack, but direct revenue contribution is not disclosed
    - Strategically important but not yet underwritten
    - What monetization currently exists and how much capital does future expansion require?
  notes: Revenue-quality assessment is evidence based rather than audited. Beast looks like a blended media, commerce, software, and fintech portfolio rather than a clean single-segment business.
