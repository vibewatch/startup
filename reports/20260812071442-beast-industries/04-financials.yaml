- id: pricing-unit-economics
  title: Pricing signals and unit-economics proxies
  body: 'Public pricing disclosures are strongest in software and creator sponsorship and weakest in physical goods. CNBC reports that brands pay roughly $2.5 million to $3 million for a MrBeast shout-out in a video, which means a single branded integration can carry the same revenue value as a meaningful slice of a SaaS business''s annual recurring revenue. Business Insider Africa adds that Beast Games'' original 10-episode deal was valued at $100 million, while Viewstats'' site publicly advertises free access and a high-end $249-per-month plan. Step''s public app marketing emphasizes consumer rewards such as up to 10% cashback and 3% on savings, suggesting an acquisition posture built around consumer value rather than explicit monthly subscription fees.


    Even so, unit economics remain mostly implied rather than published. The strongest public evidence says media is expensive, not cheap. Quasa says production costs consume over 90% of the media division''s revenue, and TIME says the company spent two years reusing sets and consolidating software licenses to claw back margin. That implies Beast''s underwritten economics depend on commerce and software carrying more of the profit pool over time. Feastables looks promising because retail snacks can produce repeat purchase and channel leverage, but public gross margins, trade spend, and retailer allowances are not disclosed. Step and Viewstats have potentially better recurring behavior, but neither product publishes the activation, churn, or monetization metrics needed to calculate CAC payback or lifetime value.'
