        title: 具名验证与满意度信号
        blocks:
          - type: paragraph
            body: >-
              具名客户证明也不对称。Amazon 是整个堆栈中最清晰的具名买方。Rockefeller 是公益侧具名机构合作伙伴。零售终端客户证明更多出现在评论页面， 而不是正式客户标识：Target 上的
              Feastables 评论显示已验证买家，其中一些明确描述家庭分享和孩子反复要求购买， 另一些则提到融化或发货变质。OutlierKit 对 Viewstats 扩展的评测显示活跃使用模式和免费转付费路径，
              但也暴露创作者对可靠性以及 Pro 定价陡升的抱怨。换句话说，公开客户证明存在，但分散在买方类型和证据类别之间， 而不是集中在一份干净的企业客户名单里。


              不利证据很重要。Trustpilot 上关于 Viewstats 的反馈包括登录、变慢和宕机投诉。Target 对 Lunchly 的评论文本显示多起与霉变有关的投诉。
              这些不一定推翻增长故事，但确实说明，不能只凭受众规模假设客户耐久性和满意度。Beast 的客户机器很擅长制造认知； 公开证明较弱的是规模化后的稳定性和质量。
