      - number: '1.3'
        title: 融资背景、规模标记与有依据的封面指标
        blocks:
          - type: paragraph
            body: >-
              最佳公开融资和规模锚点来自媒体报道，而不是公司发布的融资备忘录。Business Insider 2025 年 2 月基于融资材料的报道称， Beast Industries 2024 年收入为 $473
              million，高于 2023 年的 $221 million，并预计 2025 年约 $899 million。 该报道还将 2024 年收入中的媒体部分定为 $226 million，Feastables
              净收入 $215 million，MrBeast Lab 上线前六个月销售额 $65 million。TIME 给出更偏运营的框架：Beast Industries 五年亏损约 $500 million，在此前
              14 个月削减超过 $100 million 运营费用，并预计 2026 年首次盈利。这些数字让收入规模显得亮眼，也解释了为什么外部资本和更严格成本控制重要。


              估值证据集中在 $5 billion 附近，而不是来自某一份无瑕融资文件。Business Insider 称 Bloomberg 报道了 $5 billion 融资进程； TIME 称公司估值高于 $5
              billion；EverythingPR 和 Quasa 等独立画像也重复了类似区间。CNBC 另行报道 Bitmine 在 2026 年 1 月投资 $200
              million，强化了一个信号：即便披露稀疏，外部投资者仍认为 Beast Industries 可融资。公司尚未公开提交 S-1，
              公开来源也没有给出经董事会确认的股权表、债务时间表或清算优先权堆栈。尽调结论应该是：Beast Industries 已大到足以获得机构化定价，但透明度还不足以像传统 IPO 候选公司一样做投资判断。
