  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与买方类型
        blocks:
          - type: paragraph
            body: >-
              客户地图是多边的。Beast Games 服务观众，同时 Amazon 是机构买方。Feastables 和 Lunchly 服务家庭、儿童和零售购物者。 Step
              服务青少年、年轻人，有时也服务家庭。Viewstats 服务创作者、团队和研究者。Beast Philanthropy、TeamTrees 和 TeamSeas
              服务捐赠者、志愿者和受益人。这不是普通创业公司那种只有一个清晰 ICP 的客户故事。Beast 实际上在同一广泛受众中， 按不同触点变现并动员不同角色。


              这种细分影响证据质量。平台买方证明很强，因为 Amazon 续订了 Beast Games。Step 的用户规模证明有意义，因为公司和 CNBC 都指向超过 7 million 用户。Beast
              Philanthropy 的受益人证明异常可见，因为网站展示食品、餐食和个人数量。零售证明更碎片化： Feastables 有门店查询和评价证据，Business Insider Africa 报道了
              Lunchly 销售，但公开记录仍缺少按零售商拆分的明细。 创作者软件证明介于两者之间：Viewstats 显然有产品和社群，但其外部付费客户足迹披露不足。
