      - - Beast Industries
        - 一体化创作者控股公司
        - 报道披露估值约 $5B；2024 年收入约 $473M
        - 大众受众、家庭、创作者、平台买家
        - 掌握创作者分发，并覆盖 CPG、流媒体、软件和金融科技触点
        - 多数单一业务线仍要面对更专精的竞争者
      - - Sidemen Holdings
        - 一体化多创作者运营商
        - EPR 引用的年收入规模估计为九位数
        - 英国年轻受众及消费延展
        - 多创作者韧性，叠加餐饮、服饰、酒类、媒体组合
        - 不如 Beast 拥有单一全球旗舰频道
      - - Dude Perfect Holdings
        - 一体化体育喜剧运营商
        - Highmount 增长资本 $100M；报道估值约 $325M
        - 面向家庭的体育受众
        - 最接近的小盘类比：内容、周边商品、现场体验、CPG、总部建设
        - 覆盖面小于 Beast，品类心智也更窄
      - - Prime / Maverick 生态
        - 分布式创作者 CPG / 媒体运营商
        - EPR 和市场评论提到饮料业务曾达到 $1.2B 峰值动销规模，随后收缩
        - 青少年 / 年轻成人饮料买家
        - 创作者带来的货架拉力和高品牌认知
        - 多元化不足，更暴露于单一品类复购风险
      - - Greenlight
        - 青少年银行 / 家庭金融应用
        - 付费套餐每月 $5.99 至 $19.98
        - 为孩子管理家庭资金的父母
        - 细颗粒度控制、家庭捆绑、奖励、投资、身份功能
        - 没有内建创作者分发引擎
      - - Acorns Early
        - 面向儿童的青少年银行 / 投资
        - 月套餐 $8 至 $12；最多 4 名儿童
        - 需要教育 + 监护账户投资的父母
        - 自动化多元投资、教育、更完整的 Acorns 套装
        - 起步价高于 Greenlight，单套餐覆盖儿童数更少
      - - vidIQ
        - 创作者软件 / 分析
        - 免费增值 + 付费 + 企业版
        - 创作者、品牌、代理商、MCN
        - AI 选题、趋势研究、跨渠道企业级定位
        - 依赖在拥挤工具市场里把用户转成订阅
      - - TubeBuddy
        - 创作者工作流 / 分析
        - Pro、Legend、企业版打包
