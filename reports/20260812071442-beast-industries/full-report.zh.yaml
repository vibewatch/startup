          label: 规模验证：2024 年收入 $473M；2025E 约 $899M
          type: input
        - id: business
          label: 混合变现：CPG + 媒体 + 软件 + 金融科技
          type: input
        - id: risk
          label: 当前风险：Step 审查、诉讼、质量波动、创始人依赖
          type: input
        - id: valuation
          label: 当前估值标记：约 $5B / 2025E 收入约 5.6x
          type: process
        - id: upside
