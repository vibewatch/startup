      - number: '4.3'
        title: 成本结构、利润率路径与资本强度
        blocks:
          - type: paragraph
            body: >-
              最佳公开证据指向一家公司：历史上把现金当作增长燃料，而不是要保存的资源。Donaldson 2024 年告诉 CNBC，公司一年进账 $600 million 至 $700
              million，但他把一切都再投入。TIME 在 2026 年把这一点说得更具体：Beast 五年亏损约 $500 million， 随后 14 个月削减超过 $100 million
              运营费用。这些事实符合一种模式：内容业务有意高烧钱，因为制作规格奢华， 也因为管理层把受众主导地位视为总资产。


              各分部资本强度差异很大。媒体在变现前就要付现金，因为布景、奖金、团队、剪辑和推广都先于观众或授权收入发生。CPG 增加库存、 采购和零售营运资本风险，尤其如果 Beast 继续扩张 Feastables 和
              Lunchly。金融科技又通过合规、欺诈控制、合作银行安排， 以及未来产品扩张可能带来的资产负债表或资金需求，增加自己的资本强度。软件在边际上可能是最轻的业务线，但公开证据不足以说明它在组合层面是否有意义。
              因此，利润率论点不是 Beast 已经高效，而是 Housenbold 的成本纪律叠加商业和平台变现，最终可以跑赢媒体引擎刻意设计的高费用底座。
