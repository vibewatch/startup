      - number: '8.2'
        title: 牛市 / 基准 / 熊市情景分析
        blocks:
          - type: paragraph
            body: >-
              情景分析比精确测算更重要，因为开放变量异常关键。牛市情景下，Beast 把 2025 年规模转成真正的创作者集团： Feastables 继续复利增长，Beast Games 成为多季全球化系列 IP，并在
              Amazon 之外保留可选性；Step 去风险后， 变成可信的青少年金融分发界面；软件和品牌服务等新业务线贡献收入，同时不炸开成本结构。沿着这条路径， 2027 年收入有可能达到 $1.3–1.5
              billion，并支撑 5.5–7.0x 收入倍数，对应约 $7.0–9.5 billion 价值。


              基准情景没那么英雄主义。它假设 Beast 到 2027 年收入约 $1.0–1.2 billion，盈利能力改善， 但仍承受私营公司折价，因为 Donaldson
              仍是核心、披露仍有限、受监管扩张只被部分验证。这支撑约 $4.5–6.5 billion 价值。熊市情景假设增长放慢，Step 监管或 Beast Games 诉讼恶化，食品或软件质量问题侵蚀信任。
              在这种结果下，$750–850 million 收入配 3.0–4.0x 倍数，对应约 $2.3–3.4 billion。因此，以 $5 billion 当前价格进入，基础情景上行有限，熊市回撤却很大。
