        - 金融科技价值无法定价
        - 索取活跃用户、消费额、余额、交换费、损失、准备金和银行合作伙伴经济模型
      - - Feastables 和 Lunchly 的零售动销与复购订单数据
        - 没有复购行为，CPG 逻辑就只是上新速度
        - 索取零售商层面的动销、复购、ACV 和促销支出数据
