  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - Step 监管风险
        - 正式监管行动、被迫更换合作伙伴，或产品冻结
        - 任何高于询问层级的执法，或无法干净替换关键合作伙伴
        - 大幅下调金融科技可选性定价，并停止扩张假设
      - - Beast Games 法律 / 安全风险
        - 重大不利裁决、集体诉讼认证推进，或新的严重事件
        - 大额准备金、制作停摆，或反复出现选手安全指控
        - 假设高端媒体经济性走弱，声誉外溢风险上升
      - - 食品质量风险
        - 变质 / 投诉激增、召回，或零售商后撤
        - 主要零售商反复出现公开投诉，或任何重大召回
        - 下调消费品牌耐久性假设，并提高渠道风险溢价
      - - 平台依赖风险
        - 核心受众引擎出现实质流量或互动冲击
        - 持续受众下滑，削弱交叉销售转化
        - 下调组合层面的收入增长和护城河假设
      - - 执行复杂度风险
        - 盈利不达预期、整合停滞，或组织混乱扩大
        - 在增加新产品的同时，无法跑通 2026 年盈利路径
        - 将判断从受控扩张调到过度扩张风险情景
    notes: 这些是投资委员会应每季度重审的核心破局监控项。
    claimRefs:
      - CR018
      - CR022
      - CR027
      - CR031
      - CR035
      - CR038
      - CR041
      - CR042
    layout: wide
  - id: TV001
    title: 建议摘要
    notes: 这个判断明确对价格敏感。Beast 是一家高质量、高风险的私营复合型公司，收入已有实证；但当前 $5B 的公开估值，对新资金来说安全边际有限。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV008
      - CV019
      - CV033
      - CV034
      - CV036
      - CV037
      - CV042
    columns:
      - 维度
      - 评估
    rows:
      - - 总体建议
        - 既有投资者持有 / 跟踪；除非能拿到结构化下行保护，否则当前估值不投新钱
      - - 信心水平
        - 中等——收入规模有支撑，但审计财务、股权结构和准备金处理仍未披露
      - - 风险评级
        - 高——诉讼、Step 监管、食品质量波动、创始人集中度和披露缺口仍在
      - - 估值立场
        - 约 $5B 已接近公允到偏满；基准公允区间约 $4.5B-$6.5B；目前安全边际有限
      - - 进入纪律
        - 优先考虑结构化一级 / 二级敞口，或隐含入场估值 <= $4.0B-$4.5B
      - - 目标退出 / 持有
        - 持有 24-36 个月；等审计盈利实证、Step 风险降低和 IPO 准备度更清晰后重新承销
    layout: standard
  - id: TV002
    title: 投资论点与反论点
    notes: 支持论点的是实际规模、创作者驱动分发和跨组合变现。反论点来自披露缺口、正在发酵的风险，以及当前价格下有限的下行保护。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV016
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
      - CV032
    columns:
      - 维度
      - 论点（牛市）
      - 反论点（熊市）
      - 什么会改变判断
    rows:
      - - 需求引擎
        - MrBeast 仍是全球最强的个人创作者需求引擎，能降低多项业务的启动 CAC
        - 同一引擎也让公司高度集中在创始人身上，容易受品牌冲击
        - 新创作者和新产品能在显著降低 Donaldson 依赖后继续放大的证据
      - - CPG 经济性
        - Feastables 规模已足以支撑企业价值，且有实打实的零售验证和全球扩张潜力
        - 如果 Feastables 放慢，或遭遇质量 / 声誉损伤，企业价值的大块支撑会同时暴露
        - 经审计的毛利率和复购数据，证明 CPG 经济性能持续
      - - 高端媒体
        - Beast Games 的收视和续订证明，Beast 能在 YouTube 之外销售高端内容
        - 高端媒体叙事仍主要靠一个大买家支撑；诉讼或安全问题可能压缩这部分可选性
        - 第二个大买家、更干净的法律画像，以及可复用的节目格式经济性
      - - 软件 / 金融科技可选性
        - Viewstats 和 Step 提供的触点，LTV 或利润率高于单靠零食
        - 两条业务都还早，或受监管约束；Step 尤其如此，一旦治理跟不上，毁掉价值的速度会快过创造价值
        - 干净合规架构的证明，以及核心 CPG 之外有意义的变现
      - - 类别溢价
        - 规模化创作者控股公司稀缺，可相对成熟 CPG 可比公司获得一定溢价
        - 一旦治理、披露或监管匹配度破裂，稀缺性本身守不住价值
        - 可比创作者公司证明能长期放大，且没有严重估值反转
      - - 退出路径
        - 如果 Beast 变得可审计且盈利，后续 IPO 或结构化二级市场可能释放价值
        - 目前未见公开 S-1；股权结构不透明和风险画像让近期 IPO 承销偏弱
        - 公开市场准备度证据、经审计的 2025/2026 报表，以及优先权栈透明度
    layout: wide
  - id: TV003
    title: 牛市 / 基准 / 熊市估值情景
    notes: 这些区间是情景框架，不是精确估值结果。它们把收入规模假设、风险调整后的收入倍数，以及必要时的私营公司折价放在一起看。
    claimRefs:
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
