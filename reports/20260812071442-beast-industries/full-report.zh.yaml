        - 让最大的高端媒体验证点在经济性上仍不清楚
        - 索取剧集层面预算、Amazon 付款、奖金成本和剩余义务
    notes: 本章最大的结论不是证据缺席，而是缺失指标恰好集中在投资判断最需要的位置。
