      - number: '2.2'
        title: 规模测算视角：TAM 很大，直接可触达的 SAM 窄得多
        blocks:
          - type: paragraph
            body: >-
              Beast 的机会有多大，取决于测算哪一层。最宽一层是创作者变现和品牌支出。Goldman 强调，拥有规模、资本、推荐引擎、多种变现工具、 分析能力和电商选项的平台，最有机会形成复利飞轮。Beast
              正好坐在这些条件之上：巨大的受众触达、通过 Viewstats 拥有数据产品、 通过 Feastables 完成零售转化，变现方式也越来越多元。问题是，创作者经济总量仍会夸大 Beast 可直接触达的 SAM，
              因为大量支出属于软件商、创作者工具、市场平台、代理机构和其他创作者。


              更现实的规模堆栈，是把相邻垂直市场分开看。糖果市场大且渠道驱动，这对 Feastables 重要，因为超市准入和高端产品定位比广义社交媒体支出更关键。 青少年银行相对创作者商业规模较小，但战略上有吸引力：2026
              年市场增长快、由智能手机驱动，并重视 Step 已经主打的金融素养功能。 流媒体又是另一回事：家庭视频支出不是 Beast 的收入，但它决定 Amazon 委托高端无脚本节目的预算环境。市场含义是， Beast
              可触达机会不是这些品类的简单相加；真正的机会来自一个大型创作者品牌能否比品类既有者预期更快地把粉丝转化为经常性消费者或合作伙伴支出。
