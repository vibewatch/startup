      - number: '3.4'
        title: 护城河耐久性与不利竞争证据
        blocks:
          - type: paragraph
            body: >-
              不利证据不是说 Beast 没有护城河，而是说护城河有条件。Prime 从峰值收缩表明，创作者驱动消费品不会只因曾经拥有巨大受众就一直是品类领导者。 Barstool
              的往返交易表明，当战略所有权和运营领导层不同步，创作者控股公司的价值会急剧恶化。Greenlight 和 Acorns 显示，
              在产品信任和控制披露上，受监管的家庭金融竞争对手可以压过创作者新进入者。TubeBuddy、vidIQ 和 Social Blade 显示， 创作者软件可以支撑多供应商工作流，从而削弱赢家通吃经济。Hershey
              的投资者姿态也提醒，Beast 的零售成功仍发生在由大得多的既有者主导的货架通道里。


              多头反驳是，Beast 拥有比这些专业玩家更多的变现触点，并能用一个内容引擎不断给下一个品类发布供能。这是真实优势， 尤其如果 Jeff Housenbold 能像 Highmount 在更小规模上资本化
              Dude Perfect 那样，继续把这套堆栈专业化。 但尽调结论很清楚：Beast 的护城河是分发、品牌转化和组合可选性，不是专有技术，不是监管排他性，也不是客户锁定。
              只有当复购、家庭金融信任和软件留存的公开证据持续改善，投资者才应承认其竞争耐久性。
