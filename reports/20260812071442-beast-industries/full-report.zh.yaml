  - id: FV004
    title: 投资 KPI 评分卡 — Beast Industries 2026 年 8 月
    type: kpi
    layout: compact
    summary: IC 式评分显示，Beast 在市场验证和品牌势能上很强，但当前估值下，风险画像、披露质量和估值吸引力较弱。
    claimRefs:
      - CV007
      - CV010
      - CV011
      - CV026
      - CV035
      - CV036
      - CV037
      - CV041
    data:
      items:
        - label: 市场机会 / 分发能力
          value: 8/10 — unmatched creator reach and cross-category launch leverage
        - label: 产品 / 品牌护城河
          value: 7/10 — Feastables and MrBeast brand are real; still highly founder-linked
        - label: 商业模式质量
          value: 6/10 — diversified revenue, but operating complexity is very high
        - label: 财务健康度
          value: 5/10 — strong growth, but cumulative losses and limited public disclosure remain
        - label: 风险画像（越低风险越高）
          value: 4/10 — Step, litigation, and quality-control risks are live
        - label: 估值吸引力
          value: 5/10 — current mark looks fair, not clearly mispriced in investors' favor
        - label: 证据质量
          value: 4/10 — too much still depends on leaks, summaries, and partial public disclosures
        - label: 整体 IC 评分
          value: 5.6/10 — HOLD / TRACK existing; PASS new at current price
