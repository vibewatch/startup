    columns:
      - 情景
      - 收入估计（2027）
      - 收入倍数
      - 隐含股权价值
      - 关键假设
      - 概率信号
      - 主要下行风险
    rows:
      - - 牛市情景
        - $1.3B-$1.5B
        - 5.5x-7.0x
        - $7.0B-$9.5B
        - Feastables 保持超高速增长；Beast Games 干净扩张；Step 去风险；经审计盈利路径浮现
        - 20%——需要多个有利结果同时出现
        - 规模被证明前，监管或法律事件先阻断倍数扩张
      - - 基准情景
        - $1.0B-$1.2B
        - 4.5x-5.5x
        - $4.5B-$6.5B
        - 增长延续，但治理和流动性折价仍在；利润改善，却无法抹平风险溢价
        - 55%——与当前证据最一致
        - 资本被锁在一个公允但不兴奋的私营估值里
      - - 熊市情景
        - $750M-$850M
        - 3.0x-4.0x
        - $2.3B-$3.4B
        - 增长放缓；Step 或诉讼风险升级；质量问题或受众疲劳压缩信心
        - 25%——任何一个头部风险爆发，下行都很真实
        - 当前估值大幅回撤，退出流动性有限
      - - 当前公开估值参照
        - 2025E 收入 $899M
        - 当前约 ~5.6x
        - $5.0B
        - 使用公开的 2025 年收入预测和公开估值参照
        - 参照点，不是情景
        - 显示今天新资金几乎没有估值缓冲
    layout: wide
  - id: TV004
    title: 可比估值表
    notes: 上市公司数据采用 StockAnalysis 截至 2026 年 8 月的市场数据，并以 SEC 10-K 搜索页作为申报锚点。创作者公司参照用于框定类别需求和下行，而不是生成精确倍数。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the most relevant public consumer/media brackets and the clearest creator-company reference
        transactions available in retained public evidence. They do not represent a full public comp universe for
        private creator holding companies, which scarcely exists.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV033
      - CV034
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 与 Beast 的相关性
      - 主要限制
    rows:
      - - Beast Industries（当前参照）
        - 2025E 收入约 $899M
        - 估值约 $5.0B / 收入约 5.6x
        - 直接锚定当前轮次和私营市场定价
        - 收入和估值来自公开报道，而非经审计申报披露
      - - Hershey (HSY)
        - 上市品牌零食 / 巧克力
        - PS 约 3.0 倍；EV/Sales 约 3.4 倍
        - 显示成熟全球零食品牌在没有创作者溢价时的交易位置
        - 增长慢得多，披露好得多，也没有创作者驱动的注意力引擎
      - - Monster Beverage (MNST)
        - 上市高端饮料品牌
        - PS 约 9.7 倍；EV/Sales 约 9.3 倍
        - 如果 Beast 证明增长和利润率可持续，这是高端消费品牌的上沿参照
        - 纯饮料业务，拥有数十年执行历史，治理也更干净
      - - Netflix (NFLX)
        - 上市全球高端媒体平台
        - PS 约 6.4 倍；EV/Sales 约 6.6 倍
        - 对规模化、订阅质量经济性来说，是有用的媒体 / 平台天花板式参照
        - Netflix 的披露、盈利能力和平台深度强得多
      - - Dude Perfect
        - 私营创作者驱动媒体品牌
        - 外部首轮融资 >$100M；2024 年收入估计 >$50M；估值未披露
        - 显示机构愿意资助可信创作者品牌走出 YouTube
        - 规模仍远小于 Beast，也不是已披露估值基准
      - - Barstool / PENN 交易弧线
        - 受监管所有者旗下创作者媒体资产
        - PENN 约花 $550M，后来以 $1 卖回给 Portnoy
        - 可作为创作者媒体在战略 / 监管适配差时价值毁损的下行先例
        - 商业模式和受众不同于 Beast，因此它是警示案例，不是直接可比
    layout: wide
  - id: TV005
    title: 破坏论点与否决触发项
    notes: 这些触发项把运营和监管事件转换成明确的投委会动作。
    claimRefs:
      - CV020
      - CV021
      - CV031
      - CV032
      - CV033
      - CV039
      - CV040
    columns:
      - 触发项
      - 阈值 / 事件
      - 向论点传导
      - 行动含义
    rows:
      - - Step 监管升级
        - 任何高于询问层级的执法、被迫迁移合作伙伴失败，或产品冻结
        - 抹去金融科技可选性，并提高集团化风险折价
        - 将估值重切到熊市区间，并停止承销 Step 上行
      - - Beast Games 法律或安全恶化
        - 重大不利裁决、大额准备金，或新的严重安全指控
        - 削弱高端媒体可选性，并提高声誉外溢
        - 下调媒体倍数，并降低对多元化论点的信心
      - - 食品质量 / 召回事件
        - 重大召回，或与质量问题相关的零售商反复后撤
        - 损伤今天支撑估值的收入引擎
        - 压缩 CPG 假设，并向熊市倍数靠拢
      - - 盈利不达预期
        - 扩大范围的同时，无法达到或清晰推进到首次盈利
        - 提高融资需求，并放大私营公司折价
        - 任何新资金进入前，都要求更低入场价或结构化条款
      - - 创始人或受众恶化
        - 互动持续下滑，或 Donaldson 品牌出现重大受损
        - 削弱整个组合背后的共同需求引擎
        - 视为交叉销售模型破局，并重审整套估值栈
    layout: wide
  - id: TV006
    title: 最终尽调清单
    notes: 这些是在价格不敏感条款下上调建议前，最低限度还需要的尽调要求。
    claimRefs:
      - CV026
      - CV027
      - CV035
      - CV036
      - CV038
      - CV041
      - CV042
    columns:
      - 优先级 / 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - P1 — 股权结构和优先权栈
        - 清算优先权、投资人优先级或二级转让限制没有公开清晰度
        - 价格公允但不便宜时，优先权结构会决定新资金是否真正拥有下行保护
        - 财务 / 法律；索取股权结构表、条款清单摘要和上一轮权利
      - - P1 — 经审计的 2025 和 2026 年财务
        - 收入规模公开，但经审计的分部利润率、现金消耗和准备金处理没有公开
        - 需要知道 Feastables 产生的现金是否真的能供给更广的组合
        - CFO / 审计师；索取审计报表和分部桥接
      - - P1 — Step 合规架构
        - 完整收购后治理、银行合作伙伴备用方案或政策权属都没有公开证明
        - 金融科技是最快毁掉价值的路径，不只是创造价值
        - 合规 / 法律；索取组织图、供应商地图和合作伙伴备用计划
      - - P2 — 诉讼和准备金处理
        - 公开诉讼已经存在，但准备金规模、保险和情景分析没有披露
        - 重大法律悬而未决项可能吃掉当前上行价差的大部分
        - 法律 / 财务；索取逐案准备金和保险清单
      - - P2 — Feastables 复购率和货架经济性
        - 公开收入可见，但复购、毛利率和零售商集中度不可见
        - 核心估值支撑仍来自 Feastables 的耐久性
        - 商业 / 财务；索取队列数据、零售商集中度和利润率包
      - - P3 — 非 Donaldson 可复制性
        - 还没有公开证据显示新创作者或更低创始人中心化的发布也能同样成功
        - 这是为单一明星 IP 支付溢价的主要条件
        - 战略 / 内容；索取孵化结果和创作者梯队评分卡
    layout: wide
