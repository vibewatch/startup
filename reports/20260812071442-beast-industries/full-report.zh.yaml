      - number: '2.3'
        title: 买家、用户和付款方因业务线而异
        blocks:
          - type: paragraph
            body: >-
              买方地图是 Beast Industries 战略上不寻常的原因之一。在 Feastables，最终用户和付款方通常是同一个家庭或冲动消费的顾客， 但零售采购决定上架。在 Beast
              Games，观众是用户，Amazon 是付款方和项目委托预算控制方。在 Viewstats，创作者和团队既是用户也是付款方， 产品更像 SaaS。在
              Step，用户可能是青少年或年轻人，但家长、银行合作伙伴、合规团队和监管者都会影响实际购买和信任决策。 这些差异意味着 Beast 的市场打法不是一个漏斗，而是一组漏斗：顶部共享认知，到了变现时刻又急剧分叉。


              这种分叉影响采用节奏和预算归属。零食购买跟着家庭可选消费预算和零售补货周期走。创作者工具吃的是个人创作者或机构的月度运营预算。
              青少年银行采用取决于智能手机可得性、家长信心和受监管基础设施。高端无脚本发行取决于平台委托和 IP 经济，而不只是受众热情。 共同线索是，Donaldson
              的受众降低认知成本、加快试用，但不会抹掉真正的预算控制方。每条业务线上，Beast 仍必须满足控制分发的门卫：零售商、流媒体买方、应用商店用户、银行伙伴或家长。
