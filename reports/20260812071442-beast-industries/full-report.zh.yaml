            body: >-
              公开定价披露在软件和创作者赞助上最强，在实物商品上最弱。CNBC 报道，品牌为 MrBeast 在视频中口播支付约 $2.5 million 至 $3
              million，这意味着一次品牌植入的收入价值，可能相当于一家 SaaS 公司年度经常性收入中相当可观的一块。Business Insider Africa 补充，Beast Games 最初 10 集协议估值
              $100 million；Viewstats 官网公开宣传免费访问和每月 $249 的高端方案。 Step 的公开应用营销强调最高 10% 返现和 3%
              储蓄收益等消费者奖励，显示其获客姿态围绕消费者价值，而不是明确月订阅费。


              即便如此，单位经济大多仍是暗示，而非公开披露。最强公开证据表明媒体很贵，不便宜。Quasa 称制作成本消耗媒体部门超过 90% 收入， TIME 称公司花了两年复用布景、整合软件许可证来追回利润率。这意味着
              Beast 的可投资经济性取决于商业和软件随着时间推移承担更多利润池。 Feastables 有希望，因为零售零食可以形成复购和渠道杠杆，但公开毛利率、贸易支出和零售商补贴并未披露。Step 和
              Viewstats 可能有更好的经常性行为，但两款产品都没有发布计算 CAC 回收期或生命周期价值所需的激活、流失或变现指标。
