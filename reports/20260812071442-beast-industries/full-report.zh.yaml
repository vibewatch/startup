      - number: '8.4'
        title: 建议、退出路径与尽调条件
        blocks:
          - type: paragraph
            body: >-
              因此，投资建议必须对价格敏感。现有投资者可以合理持有或继续跟踪，因为公司确实证明了规模、融资渠道和战略雄心， 当前估值也没有明显脱离可信基础情景。新资金则不同。在 $5 billion
              名义估值下，基础情景上行不够大， 无法补偿 Step、Beast Games 或食品质量风险可能带来的下行。新投资者要么要求下行保护、清晰的清算优先权和经审计财务可见度， 要么等待隐含入场估值接近
              $4.0–4.5 billion。


              退出准备度也支持耐心。Donaldson 告诉 TIME，他最终盯着 IPO，但尽调中没有公开 S-1，公司今天披露的信息也仍不足以面对公开市场。
              近期最可能的结果，是继续私下复利增长、选择性二级流动性，或在经审计盈利和更强控制到位后再 IPO。正确的投委会姿态是： 内部人持有 /
              跟踪，当前估值下新资金不投；在上调建议前，先列清尽调要求和打破论点的触发条件。
