          - type: paragraph
            body: >-
              合作伙伴与依赖风险偏高，因为 Beast 编排的东西多于真正拥有的东西。公开记录里，Amazon 是唯一被点名的 高端内容买方；一旦委制经济性或平台胃口变化，Beast Games 的扩张路径会立刻放慢。Step
              依赖 Evolve、 Visa、Plaid 以及其他服务提供商，TIME 还称 Beast 已经在为其特许银行关系准备备用方案。零售增长取决于 货架准入、制造能力和补货行为，而这些 Beast
              并未公开控制。YouTube 和其他社交平台仍是几乎所有其他业务的 上游需求引擎。即便公益体系，也要依赖非营利合作伙伴来执行和验证。


              依赖风险又被集中度放大。同一套创始人驱动的受众引擎支撑了几乎每条业务线。这让新品启动经济性更高， 但也意味着声誉冲击会从一个产品或一场争议迅速传到组合里的其他业务。金融科技丑闻、高端内容安全事故，
              或食品质量问题，都可能回流到 Beast 在各处共用的同一个信任池。
