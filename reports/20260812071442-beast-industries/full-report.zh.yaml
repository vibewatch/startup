      - number: '6.2'
        title: 采用轨迹与公开验证
        blocks:
          - type: paragraph
            body: >-
              公开采用信号很大，但异质。Variety 称 Beast Games 在 25 天内触达 50 million 观众，Amazon 又续订两季， 这是受众拉力和买方满意度的强证据。Step 的公开材料和 CNBC
              报道指向 7 million 以上用户，首页称产品面向下一代， 也面向全家资金管理。Beast Philanthropy 发布影响力计数器，显示数千万份餐食和数百万人获得服务。Viewstats 显示一个
              17,000 人以上的创作者 Discord，并明确面向竞争研究和视频包装。Business Insider Africa 还补充了更广的受众背景： 约 3 billion 月观看量和全球触达。


              但这些大多是顶部采用信号，而不是耐久指标。我们没有 GRR、NRR、流失率或同期群复购。我们不知道多少 Feastables 买家会变成复购家庭，多少 Lunchly 购买者试用后会回来，Step
              用户中多少是月活，或 Viewstats 免费用户有多少转付费。 即便最接近留存的强公开证明也是间接的：Target 评论提到复购或孩子反复要求购买，以及 Amazon 决定续订 Beast Games。
              这令人鼓舞，但仍不是投资人需要的同期群视图。
