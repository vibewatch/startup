  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前价格背景与可比区间
        blocks:
          - type: paragraph
            body: >-
              给 Beast 当前价格定框架，最干净的起点是看得见的收入基数。Business Insider Africa 称 Beast 2024 年收入为 $473 million，2025 年预测为 $899
              million。TIME 和其他公开摘要把公司估值放在 $5 billion 以上。 按这组数据，Beast 当前约为 2025 年预测收入的 5.6x。这个倍数高于投资者给 Hershey
              这类成熟包装食品公司的价格， 但低于市场给 Monster Beverage 和 Netflix 等增长更快的高端消费或平台型公司的价格。换句话说，估值已经假设 Beast
              不只是一个糖果品牌，但也不要求投资者相信它会成为下一个全球平台公司，才能证明这个估值合理。


              不过，可比公司集合并不完美。Beast 既不只是 CPG，也不只是媒体。它的增长引擎始于创作者注意力， 再通过零食、高端视频、软件，如今还有金融科技变现。这种混合形态让当前估值从质量上看说得通，
              但仍很难有把握地承保。公开可比公司只能给方向性区间，不能给精确答案。最有用的结论是：如果 Beast 继续复利增长、 治理继续加固，$5 billion 大致落在合理的基础情景附近——但这不是便宜价格。
