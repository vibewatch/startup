  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与分部组合
        blocks:
          - type: paragraph
            body: >-
              Beast Industries 现在至少靠四个实质不同的引擎变现受众。第一是媒体收入：YouTube 广告收入、品牌交易和高端内容授权。 CNBC 引用 Donaldson
              称，每条主要视频可产生几百万美元广告收入，另有几百万美元品牌交易收入；Business Insider Africa 则称，包含 YouTube 和 Beast Games 的媒体分部 2024 年产出 $226
              million。第二是消费品。融资材料报道称，仅 Feastables 2024 年净收入就达 $215 million，Lunchly 和 MrBeast Lab 还贡献额外零售终端销售。第三是软件和平台， 由
              Viewstats 以及更广泛的创作者市场平台抱负支撑。第四是金融服务，Step 收购带来一个产品触点、一批用户和未来银行、经纪业务、 甚至可能偏加密产品的路线图。


              这组组合重要，因为不同业务线的收入质量不一样。媒体仍是触达机器，但它不是最直接的利润来源，因为内容引擎刻意做得很重，且高度再投资。
              消费品看起来是当前最明显的毛利候选，因为它依靠重复零售终端销售放大，而不是一次性赞助。Viewstats 提供经常性软件经济性， 但公开订阅者数据太薄，无法衡量贡献。Step
              有一天可能创造交换费、利差、信贷、订阅或市场平台经济性，但其当前变现公开看仍主要是路线图故事。 基于现有证据，应把 Beast 理解为一个收入规模真实的组合，但贡献利润率不均衡且仍不透明。
