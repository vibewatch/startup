  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前数值 / 状态
      - 质量
      - 尽调问题
    rows:
      - - 媒体 / YouTube
        - 广告 + 品牌植入 + 频道变现
        - 观看量、赞助包
        - CNBC 称，每条大型视频可带来数百万广告收入和数百万品牌合作收入
        - 规模很高，但支出前置且再投入重，利润率波动大
        - 媒体收入中，经常性收入与项目驱动收入各占多少？
      - - Beast Games / 高端娱乐
        - 来自平台买家的授权 / 委制
        - 单集 / 单季交易价值
        - BI Africa 称，最初 10 集交易价值为 $100M；Amazon 又续订两季
        - 机构买家验证很强，但经济性取决于制作成本纪律
        - 扣除制作超支和分摊成本后，净贡献是多少？
      - - Feastables
        - 零食零售动销
        - 净收入 / 零售件数
        - BI Africa 报道 2024 年净收入为 $215M；Feastables 看起来是最大的商业化引擎
        - 可能是毛利潜力较好的业务之一，但利润率未披露
        - 各渠道毛利率、渠道费用和零售商集中度是多少？
      - - Lunchly / 消费品
        - 零售午餐套装动销及相邻 CPG
        - 零售销售额
        - BI Africa 称，Lunchly 上架前 11 周销售额达到 $5M
        - 早期收入验证已经出现，但复购和零售商稳定性仍不清楚
        - 复购率和零售商扩张经济性如何？
      - - Viewstats / 平台
        - 经常性软件订阅和创作者分析
        - 订阅收入
        - 公开定价页显示免费档和 $249/月套餐；公开收入未披露
        - 可能是高质量经常性收入，但规模未知
        - 付费订阅用户有多少、ARPU 多少、流失率多少？
      - - Step / 金融服务
        - 卡、银行、奖励、储蓄、未来金融产品
        - 活跃用户 / 刷卡额 / 利差 / 费用
        - Step 带来 7M+ 用户和金融科技栈，但直接收入贡献未披露
        - 战略重要，但还没有足够数据支撑投资测算
        - 目前有哪些变现，未来扩张需要多少资本？
    notes: 收入质量判断基于证据，而非审计。Beast 更像媒体、商业、软件、金融科技混合组合，而不是单一分部业务。
