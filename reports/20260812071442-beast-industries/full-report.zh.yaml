chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、足迹与组合结构
        blocks:
          - type: paragraph
            body: >-
              Beast Industries 已经不再只是 Jimmy Donaldson 的 YouTube 业务代称，而是在数个相邻业务之上形成了真正的控股公司层。
              公开来源如今普遍将该集团描述为横跨三条宽线：媒体和工作室制作、消费品、软件或服务。Business Insider 基于融资材料的报道把这套堆栈拆成媒体、 包装消费品和软件；Forbes 和
              EverythingPR 则明确补上当前品牌组合，包括 Feastables、Beast Games、Lunchly、Viewstats、 MrBeast Studios、Step 和 Beast
              Philanthropy。这个变化重要，因为公司不再依赖单一变现路径。受众引擎把流量导向实体零售、 流媒体发行、付费创作者工具和公益活动，而公益活动又反过来强化品牌亲和力。


              运营重心仍在 North Carolina 州 Greenville。TIME 2026 年人物报道描述了一个 132 英亩的企业园区，工作室和挑战赛布景分布在 Greenville 周边；Step 新闻稿和
              NetInfluencer 对 Jeff Housenbold 的报道也都把 Greenville 定为实际总部。Beast Industries 官网本身信息异常稀少，仍写着「Launching
              Soon」，对于一家如此可见的公司来说，这种披露姿态并不寻常。因此，外部分析师只能靠新闻稿、 合作伙伴公告、人物报道和子公司页面重建业务，而不是读取一个集中的投资者关系网站。信息不透明会在本报告后续章节反复出现。
