      - number: '6.4'
        title: 扩张循环与集中风险
        blocks:
          - type: paragraph
            body: >-
              集中和扩张风险位于客户论点中心。上行看，一个受众可以扩展到多个触点：观众可以变成买家、用户、捐赠者和参与者。 下行看，若干触点似乎仍集中在一个创始人驱动的流量引擎、一个高端买方或少数合作通道上。Beast
              Games 的 Amazon 集中度很明显。 Step 依赖平台信任和银行通道，体现金融科技集中度。零售集中度不透明，因为公开来源没有列出所有主要账户或补货经济性。 创作者工具集中度也不透明，因为
              Viewstats 不发布客户标识或收入集中度。


              投资结论是，Beast 在多个触点上确有真实客户证明，这很少见，也有价值。但投资者不应把认知度等同于可持续客户价值。
              公开记录证明了触达和转化潜力；它还没有证明客户留存、账户多元化或集中韧性达到后期私营公司应有标准。
