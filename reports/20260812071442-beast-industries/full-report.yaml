    title: Recommendation Logic Chain
    type: flow
    layout: wide
    summary: >-
      Recommendation flows from a combination of real revenue proof, hybrid-business optionality, live risk, and only
      moderate valuation headroom at the current price.
    claimRefs:
      - CV003
      - CV007
      - CV008
      - CV010
      - CV011
      - CV021
      - CV026
      - CV037
      - CV042
    data:
      nodes:
        - id: market
          label: 'Scale proof: $473M 2024 revenue; ~$899M 2025E'
          type: input
        - id: business
          label: 'Hybrid monetization: CPG + media + software + fintech'
          type: input
        - id: risk
          label: 'Live risk: Step scrutiny, litigation, quality variance, founder dependence'
          type: input
        - id: valuation
          label: 'Current mark: ~$5B / ~5.6x 2025E revenue'
          type: process
        - id: upside
          label: Base upside modest; bear drawdown meaningful
          type: process
        - id: recommendation
          label: HOLD / TRACK existing; PASS new at current price
          type: output
      edges:
        - from: market
          to: valuation
          label: supports quality case
        - from: business
          to: valuation
          label: supports some premium
        - from: risk
          to: upside
          label: widens downside
        - from: valuation
          to: upside
          label: limits margin of safety
        - from: upside
          to: recommendation
          label: drives IC stance
