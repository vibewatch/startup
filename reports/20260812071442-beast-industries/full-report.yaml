  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current price context and comparable brackets
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to frame Beast's current price is to start with the revenue base that is actually
              visible. Business Insider Africa says Beast generated $473 million in 2024 revenue and forecast $899
              million in 2025. TIME and other public summaries place the company's valuation north of $5 billion. On
              that math, Beast currently trades at roughly 5.6x 2025 forecast revenue. That is above the multiple
              investors pay for a mature packaged-food company like Hershey, but below what the market pays for
              faster-growing, premium consumer or platform businesses such as Monster Beverage and Netflix. In other
              words, the valuation already assumes Beast is more than a candy brand, but it does not require investors
              to believe it will become the next global platform company to justify the mark.


              That said, the comp set is imperfect. Beast is neither just CPG nor just media. Its growth engine begins
              with creator attention and then monetizes through snacks, premium video, software, and now fintech. That
              hybridity is why the current mark is defensible on quality, yet still hard to underwrite with conviction.
              Public comps provide directional brackets, not a precise answer. The most useful conclusion is that $5
              billion is around a reasonable base-case neighborhood if Beast keeps compounding and hardens
              governance—but it is not a bargain price.
            claimRefs:
