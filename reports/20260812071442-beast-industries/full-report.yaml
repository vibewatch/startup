  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              The legal and regulatory stack is the most acute current risk surface. The Beast Games class-action
              complaint alleges unpaid wages, harassment, false advertising, and unsafe working conditions, and the
              matter directly names Amazon Alternative alongside Beast-related entities. A separate 2026 civil suit
              described by TIME adds to the sense that employment and culture issues did not disappear after the 2024
              Quinn Emanuel review. On the fintech side, the risk is even more structurally serious: Senator Warren's
              2026 letter explicitly questions whether Beast Industries is prepared to operate a teen-focused financial
              platform and highlights prior Step crypto marketing to minors, future crypto ambitions, and Evolve's
              troubled history. The Federal Reserve's 2024 enforcement action against Evolve gives that concern a hard
              regulatory anchor.


              This matters because Beast has crossed from reputational risk into regulated-product risk. A media company
              can survive bad headlines more easily than a youth-finance platform can survive trust, privacy, or
              compliance failures. Step's own privacy policy shows the company handles sensitive data from minors,
              sponsors, identity-verification vendors, Plaid, and investing partners. The combination of minors,
              personal data, bank-partner dependency, and crypto-adjacent scrutiny creates the single most material
              regulatory risk in the Beast portfolio.
