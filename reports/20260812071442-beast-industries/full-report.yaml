  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buyer types
        blocks:
          - type: paragraph
            body: >-
              The customer map is multi-sided. Beast Games serves viewers while Amazon acts as the institutional buyer.
              Feastables and Lunchly serve households, kids, and retail shoppers. Step serves teens, young adults, and
              in some cases families. Viewstats serves creators, teams, and researchers. Beast Philanthropy, TeamTrees,
              and TeamSeas serve donors, volunteers, and beneficiaries. This is not a normal startup customer story with
              one clean ICP. Beast is effectively monetizing and mobilizing the same broad audience in different roles
              depending on the surface.


              That segmentation matters for evidence quality. Platform-buyer proof is strong because Amazon renewed
              Beast Games. User-scale proof is meaningful in Step because the company and CNBC both point to more than 7
              million users. Beneficiary proof is unusually visible in Beast Philanthropy because the site shows food,
              meal, and individual counts. Retail proof is more fragmented: Feastables has store-finder and review
              evidence, and Business Insider Africa reports Lunchly sales, but the public record still lacks a
              retailer-by-retailer breakdown. Creator-software proof sits somewhere in between: Viewstats clearly has a
              product and community, yet its external paying-customer footprint is not well disclosed.
