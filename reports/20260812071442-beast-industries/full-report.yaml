      - number: '2.2'
        title: 'Sizing lenses: big TAMs, much narrower directly reachable SAMs'
        blocks:
          - type: paragraph
            body: >-
              The size of Beast's opportunity depends on which layer is being sized. The broadest layer is creator
              monetization and brand spending. Goldman highlights that platforms with scale, capital, recommendation
              engines, multiple monetization tools, analytics, and e-commerce options have the best chance to create a
              compounding flywheel. Beast happens to sit on top of exactly those enabling conditions: giant audience
              reach, data products through Viewstats, retail conversion through Feastables, and increasingly diversified
              monetization. Yet creator-economy aggregates still overstate Beast's directly reachable SAM because much
              of that spend belongs to software providers, creator tools, marketplaces, agencies, and other creators.


              A more realistic sizing stack uses adjacent verticals as separate market lenses. Confectionery is large
              and channel-driven, which matters for Feastables because supermarket access and premium product
              positioning matter more than broad social-media spend. Youth banking is small relative to creator commerce
              but strategically attractive because the 2026 market is growing fast, is smartphone-enabled, and prizes
              financial-literacy features that Step already markets. Streaming is different again: household spending on
              video is not Beast's revenue, but it is the budget environment into which Amazon commissions premium
              unscripted shows. The market implication is that Beast's reachable opportunity is not a clean sum of these
              categories; it is the overlap created when a large creator brand can convert fandom into recurring
              consumer or partner spend faster than category incumbents expect.
