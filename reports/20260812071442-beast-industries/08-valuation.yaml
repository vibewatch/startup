  - id: CV002
    statement: Business Insider Africa says Beast generated $473 million of revenue in 2024 and forecast roughly $899 million in 2025.
    type: third-party-reported
    topic: revenue base
    sourceRefs:
    - SV002
    - SV003
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV002
  - id: CV003
    statement: Using a ~$5 billion valuation against ~$899 million of 2025 forecast revenue implies a forward revenue multiple of about 5.6x.
    type: estimated
    topic: current multiple
    sourceRefs:
    - SV001
    - SV002
    - SV003
    - SV027
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QV003
  - id: CV004
    statement: Beast's implied multiple sits well above Hershey's roughly 3.0x sales multiple, so the market is already paying for growth and brand leverage beyond mature confectionery norms.
    type: estimated
    topic: public comp comparison
    sourceRefs:
    - SV002
    - SV013
    - SV016
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV004
  - id: CV005
    statement: Beast's current implied multiple remains below Monster Beverage's roughly 9.7x sales multiple, leaving room if Beast proves durable premium-brand economics and governance maturity.
    type: estimated
    topic: public comp comparison
    sourceRefs:
    - SV003
    - SV014
    - SV017
    confidence: medium
    freshness: current
    answersQuestionRefs:
