- id: recommendation-exit
  title: Recommendation, exit path, and diligence conditions
  body: 'Recommendation therefore has to be price-sensitive. Existing investors can reasonably hold or continue tracking the position because the company has genuine proof of scale, financing access, and strategic ambition, and because the current mark is not plainly disconnected from a credible base case. New capital is different. At a $5 billion headline valuation, base-case upside is not large enough to compensate for the downside that Step, Beast Games, or food-quality risk could create. New investors should either demand downside protection, liquidation preference clarity, and audited financial visibility, or wait for an implied entry closer to $4.0–4.5 billion.


    Exit readiness also argues for patience. Donaldson told TIME he is eyeing an IPO eventually, but no public S-1 surfaced in diligence and the company still discloses too little for public markets today. The most plausible near-term outcomes are continued private compounding, selective secondary liquidity, or a later IPO after audited profitability and stronger controls. The right IC posture is HOLD / TRACK for insiders and PASS on new capital at the current mark, with a clear list of diligence asks and thesis-break triggers before upgrading the recommendation.'
