- id: TV002
  title: Investment Thesis and Anti-Thesis
  notes: The thesis is supported by real scale, creator-led distribution, and cross-portfolio monetization. The anti-thesis is supported by disclosure gaps, live risks, and limited downside protection at the current price.
  claimRefs:
