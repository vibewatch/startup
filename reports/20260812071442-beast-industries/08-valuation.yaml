- id: scenario-analysis
  title: Bull / base / bear scenario analysis
  body: 'Scenario analysis matters more than precision because the open variables are unusually important. In the bull case, Beast turns its 2025 scale into a true creator conglomerate: Feastables continues to compound, Beast Games becomes a multi-season global franchise with optionality beyond Amazon, Step is de-risked into a credible youth-finance distribution surface, and new business lines like software and branded services contribute without blowing up the cost structure. Under that path, 2027 revenue could plausibly reach $1.3–1.5 billion and support a 5.5–7.0x revenue multiple, yielding roughly $7.0–9.5 billion of value.


    The base case is less heroic. It assumes Beast gets to around $1.0–1.2 billion in revenue by 2027, improves profitability, but still carries a private-company discount because Donaldson remains central, disclosure stays limited, and regulated expansion remains only partly proven. That supports roughly $4.5–6.5 billion of value. The bear case assumes growth slows, Step regulation or Beast Games litigation worsens, and food or software quality issues chip away at trust. In that outcome, $750–850 million of revenue paired with a 3.0–4.0x multiple yields roughly $2.3–3.4 billion. Current entry at $5 billion therefore offers modest base-case upside but substantial bear-case drawdown.'
