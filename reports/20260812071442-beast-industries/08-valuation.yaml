  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Cap table, preference stack, and transfer terms
    missingEvidence: Public sources do not disclose liquidation preferences, investor seniority, anti-dilution rights, or secondary transfer constraints.
    whyItMatters: At a fair-to-full headline price, structural terms can determine whether new money has any real downside protection or upside participation.
    diligencePath: Request cap table, rights summary, and most recent financing documents before any new-money recommendation.
    relatedQuestionRefs:
    - QV010
    - QV026
    - QV027
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: Audited segment economics and reserve treatment
    missingEvidence: Public reporting gives revenue scale, but not audited segment margins, consolidated cash flow, legal reserves, or quality-remediation costs.
    whyItMatters: Valuation depends on whether Feastables cash generation truly offsets operating complexity and risk across the rest of the portfolio.
    diligencePath: Request audited 2025 and 2026 statements, segment bridge, reserve schedule, and cash-burn / profitability detail.
    relatedQuestionRefs:
    - QV002
    - QV018
    - QV026
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: Step governance and regulated-product architecture
    missingEvidence: Public sources do not show the full post-acquisition compliance org, bank-partner contingency plan, or product approval framework for Step.
    whyItMatters: Step is the most likely business line to create fast multiple compression if controls are weaker than management suggests.
    diligencePath: Request org chart, vendor map, compliance calendar, board oversight materials, and bank-partner contingency documentation.
    relatedQuestionRefs:
    - QV015
    - QV016
    - QV028
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: minor
    topic: Repeatability beyond Jimmy Donaldson
    missingEvidence: Public evidence does not yet show whether Beast can create equivalent value through additional creators, formats, or launches with less founder centrality.
    whyItMatters: A durable premium multiple depends on the business becoming more institutional and less dependent on one person's attention engine.
    diligencePath: Request incubation results, new-creator scorecards, and evidence of successful launches with lower Donaldson dependency.
    relatedQuestionRefs:
    - QV007
    - QV027
    relatedTableRefs:
    - TV002
    - TV006
  - type: public-evidence-limited
    severity: minor
    topic: TV004 comparable set coverage limits
    missingEvidence: There is no robust public universe of truly comparable creator holding companies with audited financials, current market values, and segment disclosures comparable to Beast.
    whyItMatters: TV004 can bracket valuation directionally, but public and private references remain structurally imperfect and should not be mistaken for a precise comp set.
    diligencePath: Supplement public comps with private secondary indications, banker feedback, and cohort economics from direct diligence before treating the table as price-setting evidence.
