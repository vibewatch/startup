  rows:
  - - Beast Industries (current reference)
    - 2025E revenue ~$899M
    - ~$5.0B valuation / ~5.6x revenue
    - Direct anchor for current round and private-market pricing
    - Revenue and valuation come from public reporting rather than audited filing disclosure
  - - Hershey (HSY)
    - Public branded snacks / chocolate
    - PS ~3.0x; EV/Sales ~3.4x
    - Shows where mature global snack brands trade without creator premium
    - Much slower growth, much better disclosure, and no creator-led attention engine
  - - Monster Beverage (MNST)
    - Public premium beverage brand
    - PS ~9.7x; EV/Sales ~9.3x
    - Upper-end premium consumer brand reference if Beast proves durable growth and margins
    - Pure beverage business with decades of execution history and cleaner governance
  - - Netflix (NFLX)
    - Public global premium media platform
    - PS ~6.4x; EV/Sales ~6.6x
    - Useful ceiling-style media/platform reference for scaled subscription-quality economics
    - Netflix has dramatically stronger disclosure, profitability, and platform depth
  - - Dude Perfect
    - Private creator-led media brand
    - '>$100M first outside raise; >$50M estimated 2024 revenue; valuation undisclosed'
    - Shows institutions will fund trusted creator brands expanding beyond YouTube
    - Still far smaller than Beast and not a disclosed valuation benchmark
  - - Barstool / PENN transaction arc
    - Creator-media asset under regulated owner
    - PENN spent about $550M, then sold back to Portnoy for $1
    - Useful downside precedent for creator-media value destruction under poor strategic/regulatory fit
    - Business model and audience are different from Beast, so it is a warning case, not a direct comp
  layout: wide
- id: TV005
  title: Thesis-Break and Kill Triggers
  notes: These triggers translate operating and regulatory events into explicit IC actions.
  claimRefs:
  - CV020
  - CV021
  - CV031
  - CV032
  - CV033
  - CV039
  - CV040
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Step regulatory escalation
    - Any enforcement beyond inquiry level, forced partner migration failure, or product freeze
    - Removes fintech optionality and increases conglomerate-risk discount
    - Recut valuation toward bear range and stop underwriting Step upside
  - - Beast Games legal or safety deterioration
    - Material adverse ruling, large reserve, or new severe safety allegations
    - Weakens premium-media optionality and increases reputational spillover
    - Lower media multiple and reduce confidence in diversification thesis
  - - Food quality / recall event
    - Material recall or repeated retailer pullback tied to quality issues
    - Damages the revenue engine that anchors valuation today
    - Compress CPG assumptions and move closer to bear-case multiple
  - - Profitability miss
    - Failure to reach or clearly progress toward first profit while expanding scope
    - Raises need for more capital and increases private-company discount
    - Require lower entry price or structured terms before any new money
  - - Founder or audience degradation
    - Sustained engagement decline or material Donaldson brand impairment
    - Undercuts the shared demand engine behind the whole portfolio
    - Treat as thesis break for cross-sell model and revisit entire valuation stack
  layout: wide
- id: TV006
  title: Final Diligence Asks
  notes: These are the minimum remaining diligence requests before upgrading the recommendation on price-insensitive terms.
  claimRefs:
  - CV026
  - CV027
  - CV035
  - CV036
  - CV038
  - CV041
  - CV042
  columns:
  - Priority / topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - P1 — Cap table and preference stack
    - No public clarity on liquidation preferences, investor seniority, or secondary transfer constraints
    - At a fair-but-not-cheap price, preference structure can determine whether new capital has any real downside protection
    - Finance / legal; request cap table, term sheet summary, and last-round rights
  - - P1 — Audited 2025 and 2026 financials
    - Revenue scale is public, but audited segment margins, cash burn, and reserve treatment are not
    - Need to know whether Feastables cash generation truly funds the wider portfolio
    - CFO / auditor; request audited statements and segment bridge
  - - P1 — Step compliance architecture
    - No public proof of full post-acquisition governance, bank-partner contingency, or policy ownership
    - Fintech is the fastest way to lose value, not just create it
    - Compliance / legal; request org chart, vendor map, and partner contingency plan
  - - P2 — Litigation and reserve treatment
    - Public suits exist, but reserve sizing, insurance, and scenario analysis do not
    - Material legal overhang can consume much of the current upside spread
    - Legal / finance; request matter-by-matter reserve and insurance schedule
  - - P2 — Feastables repeat-rate and shelf economics
    - Public revenue is visible, but repeat purchase, gross margin, and retailer concentration are not
    - Core valuation support still comes from Feastables durability
    - Commercial / finance; request cohort, retailer concentration, and margin pack
  - - P3 — Non-Donaldson repeatability
    - No public evidence yet shows equal success from new creators or less founder-centric launches
    - This is the main condition for paying a premium over a single-star franchise
    - Strategy / content; request incubation results and creator bench scorecard
  layout: wide
