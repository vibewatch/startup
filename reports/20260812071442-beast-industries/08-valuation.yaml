  claims:
  - id: CV001
    statement: TIME describes Beast Industries as valued north of $5 billion, while other public summaries and private-market trackers also point to a roughly $5 billion mark in 2025-2026.
    type: third-party-reported
    topic: current valuation
    sourceRefs:
    - SV001
    - SV003
    - SV004
    - SV027
    confidence: high
    freshness: current
    answersQuestionRefs:
