evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board governance
    missingEvidence: A current board roster, committee structure, and investor-control rights for Beast Industries.
    whyItMatters: Without public governance detail it is hard to evaluate oversight quality, founder checks, or investor influence.
    diligencePath: >-
      Request the board deck, governance org chart, and current board observer or committee list directly from
      management or lead investors.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capital structure
    missingEvidence: Debt facilities, preference stack, liquidation terms, and any secondary-sale history for current shareholders.
    whyItMatters: >-
      Late-stage valuation work can swing materially based on senior securities, debt burden, and founder/common
      dilution.
    diligencePath: >-
      Request the latest cap table, financing documents, debt schedule, and any side-letter summary before treating the
      $5B pricing headline as fully underwritten value.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: audience and employee counts
    missingEvidence: >-
      A company-issued metric dictionary defining subscriber, follower, employee, and monthly-view counts across all
      channels and entities.
    whyItMatters: >-
      Public sources use different timing and scope definitions, which can produce drift across KPI tables and later
      operating analyses.
    diligencePath: >-
      Ask management for a current KPI sheet with metric definitions and a single reporting date across all business
      lines.
    relatedQuestionRefs:
      - QO004
      - QO018
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: segment profitability
    missingEvidence: >-
      Segment-level gross margin, operating expense, and cash-flow data for media, Feastables, Lunchly, software, and
      philanthropy.
    whyItMatters: >-
      The company clearly has scale, but without segment economics investors cannot tell which lines truly fund the
      platform and which remain subsidy-heavy.
    diligencePath: >-
      Obtain the monthly or quarterly management P&L by business line, including intercompany allocations and
      customer-acquisition assumptions.
    relatedQuestionRefs:
      - QO013
      - QO014
  - type: private-evidence-only
    severity: material
    topic: company-specific market share
    missingEvidence: Beast Industries does not publish category revenue splits, retailer sell-through, or share data by market.
    whyItMatters: >-
      Without category-level revenue splits it is impossible to translate broad market lenses into a defensible SAM or
      share-of-market case.
    diligencePath: >-
      Request management reporting by business line, retailer sell-through, and geography to convert stitched market
      context into actual share assumptions.
    relatedQuestionRefs:
      - QM023
      - QM025
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: creator economy sizing methodology
    missingEvidence: >-
      A single apples-to-apples 2026 creator-economy definition showing which subcategories are counted in each research
      firm's estimate.
    whyItMatters: >-
      Different TAM figures include different mixes of platform payouts, brand spend, commerce, and software, which can
      produce false precision.
    diligencePath: >-
      Normalize the published market studies into one scope map before using any single creator-economy figure in an
      investment memo.
    relatedQuestionRefs:
      - QM006
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: cross-sell conversion data
    missingEvidence: >-
      Evidence showing how many Beast audience members convert from content viewers into Feastables buyers, Step users,
      or Viewstats subscribers.
    whyItMatters: >-
      The core market thesis assumes audience flywheel conversion, but the public record does not quantify that
      conversion at business-line level.
    diligencePath: >-
      Ask for cohort-level attribution, referral, or promo-code data showing cross-sell conversion by surface and by
      region.
    relatedQuestionRefs:
      - QM017
      - QM025
  - type: stale
    severity: minor
    topic: confectionery interpolation
    missingEvidence: A directly published 2026 chocolate-confectionery figure from the same methodology used in the retained report.
    whyItMatters: >-
      The current 2026 lens is inferred from a 2022 base and 2030 forecast, which is adequate for orientation but not
      ideal for precision.
    diligencePath: Replace the inferred midpoint with a current-year confectionery study if one becomes accessible on a public basis.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: Viewstats competitive traction
    missingEvidence: >-
      Public sources do not disclose Viewstats paid subscribers, active teams, retention, or net revenue retention
      versus vidIQ, TubeBuddy, or Social Blade.
    whyItMatters: >-
      Without usage and retention data it is impossible to know whether Viewstats is merely a low-friction add-on or a
      durable recurring competitor in creator tooling.
    diligencePath: Request subscriber counts, cohort retention, enterprise accounts, and creator-logo references for Viewstats.
    relatedQuestionRefs:
      - QP009
      - QP022
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: Step versus youth-finance competitors
    missingEvidence: >-
      Step does not publicly disclose the same plan-by-plan feature, activation, retention, and family-control detail
      that Greenlight and Acorns disclose.
    whyItMatters: >-
      Beast's fintech moat cannot be underwritten without knowing whether free distribution is converting into durable
      primary-account behavior.
    diligencePath: >-
      Request Step DAUs, active cards, deposits, spend, fraud losses, churn, and feature usage versus Greenlight/Acorns
      benchmarks.
