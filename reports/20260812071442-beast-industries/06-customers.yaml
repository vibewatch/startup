- id: named-proof
  title: Named proof and satisfaction signals
  body: 'Named customer proof is also asymmetrical. Amazon is the clearest named buyer in the whole stack. Rockefeller is a named institutional partner on the philanthropy side. Retail end-customer proof appears more in review surfaces than in formal customer logos: Feastables reviews on Target show verified buyers, and some explicitly describe family sharing and repeat requests from children, while other reviews highlight melts or stale shipments. OutlierKit''s review of the Viewstats extension indicates active usage patterns and a free-to-paid conversion path, but it also surfaces creator complaints about reliability and the steep jump to Pro pricing. In other words, public customer proof exists, but it is scattered across buyer types and evidence classes rather than concentrated in one clean enterprise logo roster.


    The adverse evidence is important. Trustpilot feedback on Viewstats includes login, slowdown, and outage complaints. Target review text for Lunchly shows multiple mold-related complaints. These do not necessarily overturn the growth story, but they do show that customer durability and satisfaction cannot be assumed from audience size alone. Beast''s customer machine is excellent at awareness; the weaker public proof is on consistency and quality at scale.'
