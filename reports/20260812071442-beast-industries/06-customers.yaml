  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: True retention and cohort data
    missingEvidence: No retained public source provides repeat-purchase cohorts, MAU retention, GRR, NRR, or renewal-rate cohorts across Beast's customer surfaces.
    whyItMatters: Audience size alone does not prove durable customer value.
    diligencePath: Request cohort retention, repeat purchase, and activity curves by business line.
    relatedQuestionRefs:
    - QU012
    - QU013
    - QU024
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: Retail and account concentration
    missingEvidence: Public sources do not identify which retail accounts or platform buyers drive most revenue, nor how concentrated Viewstats or Step are by customer cohort.
    whyItMatters: High concentration can make a broad consumer narrative much riskier in practice.
    diligencePath: Request retailer mix, platform revenue share, and account concentration by line.
    relatedQuestionRefs:
    - QU018
    - QU019
    - QU020
    - QU023
    relatedTableRefs:
    - TU005
  - type: partial-public-data
    severity: minor
    topic: Named customer proof is partial
    missingEvidence: Public proof is concentrated in Amazon, Rockefeller, and scattered retail review surfaces rather than a full named-customer roster.
    whyItMatters: This chapter can establish real adoption, but not an exhaustive named-customer list across the portfolio.
    diligencePath: Request named-account lists, retailer authorizations, and creator-customer case studies where permissible.
    relatedQuestionRefs:
    - QU014
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: Customer-satisfaction operating metrics
    missingEvidence: Public review surfaces show mixed satisfaction, but there are no official complaint rates, refund rates, spoilage rates, support metrics, or outage metrics.
    whyItMatters: Quality problems can erode retention even when awareness remains strong.
    diligencePath: Request NPS, complaint incidence, refund and spoilage rates, support SLAs, and reliability metrics.
    relatedQuestionRefs:
    - QU021
    - QU022
    relatedTableRefs:
    - TU004
