  - - Retail snack households
    - Household shopper and end-consumer
    - Feastables purchase and repeat snacking
    - Broad retail footprint implied by store finder and reviews
    - Largest current CPG monetization surface
    - No repeat-purchase or retailer concentration data
  - - Lunch-kit families / kids
    - Household shopper and end-consumer
    - Lunchly trial and school-lunch use
    - Early but national retail exposure from deck reporting
    - Cross-brand creator JV and adjacency to Feastables
    - Quality complaints and repeat rate are unclear
  - - Teen / young-adult finance users
    - Teen or young adult user; family influence in some cases
    - Spend, save, build credit, short-term cash access
    - 7M-plus user base claimed
    - Could become high-value recurring financial relationship
    - MAUs, actives, and monetization are undisclosed
  - - Creators / teams
    - Creator or team pays for analytics
    - Competitor research and video optimization
    - Community and extension usage visible
    - Potential recurring software revenue
    - Conversion to paid and logo concentration are unknown
  - - Donors / volunteers / beneficiaries
    - Donor funds, volunteer time, beneficiary outcome
    - Charitable campaigns and direct relief
    - Tens of millions of meals / millions served
    - Builds trust and broadens brand goodwill
    - Donor retention and fundraising concentration not disclosed
  - - Platform buyer
    - Amazon is direct buyer for Beast Games
    - Premium unscripted commissioning
    - Single named major buyer in public record
    - Institutional validation and franchise economics
    - Buyer concentration is high
  notes: Beast has several customer types that are linked by one audience engine but behave differently on value, retention, and channel concentration.
