- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - One audience, many products
    - Founder-led traffic concentration
    - A single trust or distribution shock can transmit across surfaces
    - Request channel-level attribution and scenario analysis by business line
  - - Premium content validation
    - Amazon buyer concentration
    - A single platform has outsize influence on Beast Games economics
    - Request renewal terms and buyer diversification plan
  - - Retail cross-sell into snacks and lunches
    - Retailer concentration and reorder opacity
    - Growth could look broad while being concentrated in a few accounts
    - Request retailer mix, ACV, and reorder data
  - - Step user acquisition via Beast audience
    - Unknown activation and monetization concentration
    - Large sign-up numbers may mask weak monetization or low actives
    - Request cohort activation and monetization by acquisition source
  - - Viewstats creator adoption
    - Free-user concentration and low lock-in
    - Community scale may not translate into durable paid revenue
    - Request logo concentration, paid conversion, and net retention
  notes: Beast's biggest customer upside and biggest customer risk both come from the same audience-conversion flywheel.
