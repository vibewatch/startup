- id: adoption-proof
  title: Adoption trajectory and public proof
  body: 'Public adoption signals are large but heterogeneous. Variety says Beast Games reached 50 million viewers in 25 days and Amazon renewed it for two more seasons, which is strong proof of audience pull and buyer satisfaction. Step''s public materials and CNBC coverage point to a 7 million-plus user base, while the home page says the product is built for the next generation and for whole-family money management. Beast Philanthropy publishes impact counters showing tens of millions of meals and millions of individuals served. Viewstats shows a 17,000-plus creator Discord and a product explicitly aimed at competitor research and video packaging. Business Insider Africa adds broader audience context: around 3 billion monthly views and global reach.


    But most of these are top-line adoption signals rather than durability metrics. We do not have GRR, NRR, churn, or cohort repeat purchase. We do not know how many Feastables buyers become repeat households, how many Lunchly purchasers come back after trial, what percent of Step users are monthly active, or how many Viewstats free users convert to paid. Even the strongest retention-like public proof is indirect: Target reviews that mention repurchase or kids repeatedly asking for the product, and Amazon''s decision to renew Beast Games. That is encouraging, but it is still not an underwriter''s cohort view.'
  claimRefs:
