company:
  name: Greenko Energy
chapter:
  number: 8
  title: Valuation
  summary: >-
    Greenko still screens as a strategically differentiated storage-backed renewable platform, but the
    assigned evidence pool refreshes peer multiples and sector momentum more clearly than it refreshes
    Greenko's own current price, leverage terms, or preference overhang. That makes the defensible call
    price-sensitive and diligence-gated: peer screens show what the market will pay for scaled Indian clean
    power assets, not that Greenko is cheap at today's unknown entry point.
sections:
  - id: public-valuation-frame
    title: Public valuation frame is constructive but indirect
    body: >-
      Public evidence still supports the strategic part of the Greenko thesis. Power Line described a
      9.4 GW operating fleet spread across solar, wind, and hydro, plus a 1,680 MW / 11,000 MWh
      Pinnapuram storage asset that underpins the company's "firm power" positioning rather than a simple
      commodity-generation model. Independent market trackers also show that FY2026 remained a strong
      deployment year for Indian renewables, with roughly 44.6 GW of solar and about 6 GW of wind added
      and CEEW-GFC counting 37 storage tenders, which keeps the addressable market for storage-backed
      platforms credible. The valuation problem is that the refreshed public price markers in this pool are
      peers rather than Greenko itself: Adani Green and NTPC Green provide premium public comp screens,
      but they do not independently prove Greenko's current fair value or financing terms.
    claimRefs: [CV001, CV002, CV004, CV005, CV006, CV007, CV010]
    tableRefs: [TV002]
    figureRefs: [FV001]
  - id: recommendation-and-entry-discipline
    title: Recommendation should stay diligence-gated until price support is refreshed
    body: >-
      The disciplined recommendation is to keep Greenko in a research-more or monitor bucket rather than
      treat it as a clean buy from public evidence alone. The upside case is real: scaled storage-backed
      infrastructure, a favorable Indian build-out cycle, and public peers that still command rich forward
      multiples. The constraint is that this worker pool does not refresh Greenko's own round price,
      cap-table preferences, or refinancing terms, while sector commentary still flags transmission
      readiness and China-linked supply dependence as live execution risks. Even the intended FT adverse
      datapoint did not survive prefetch as article-specific reporting, so the bearish side of the valuation
      debate remains only partially refreshed. That combination argues for price discipline first and
      enthusiasm second.
    claimRefs: [CV006, CV007, CV009, CV010, CV011, CV012]
    tableRefs: [TV001]
  - id: scenarios-and-thesis-breakers
    title: Bull/base/bear cases depend more on proof of execution and pricing than on demand
    body: >-
      The scenario spread is driven less by end-market demand than by whether Greenko can translate its
      storage-heavy strategy into on-schedule commissioning, financeable contracts, and a negotiable entry
      price. The bull case assumes that storage tender growth, peer multiple resilience, and Greenko's own
      pumped-storage pipeline let investors underwrite scarcity value for firm clean power. The base case
      assumes the strategy remains sound but the current public record still supports only a peer-band
      ceiling, not a precise intrinsic value. The bear case appears if project timing slips, refinancing or
      preference terms prove more punitive than expected, or transmission and supply-chain bottlenecks
      compress what public comps are willing to pay. Those are the thesis-break triggers that diligence
      should test before any price is underwritten.
    claimRefs: [CV003, CV004, CV005, CV008, CV009, CV012, CV013]
    tableRefs: [TV003]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Current read
      - Decision implication
    rows:
      - - Recommendation
        - Research more / monitor
        - Do not underwrite a buy until a direct Greenko price marker or negotiated discount is available.
      - - Confidence
        - Medium
        - Greenko-specific pricing evidence is incomplete even though sector and peer evidence is adequate.
      - - Risk rating
        - Medium-high
        - Execution and financing terms matter more than demand in the current setup.
      - - Valuation stance
        - Peer band is a ceiling not proof of cheapness
        - Use Adani Green and NTPC Green screens for discipline rather than automatic look-through valuation.
    notes: Public comps and sector signals are current, but Greenko's direct price and cap-table terms are not refreshed in this pool.
    claimRefs: [CV006, CV007, CV010, CV012]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - "Thesis: storage-backed differentiation"
        - Greenko combines 9.4 GW of operating renewable assets with a large pumped-storage-led strategy that is harder to replicate than plain renewable build-out.
        - Disclose sustained storage monetization and commissioning progress on the pumped-storage pipeline.
      - - "Thesis: market tailwind remains supportive"
        - FY2026 still showed strong Indian renewable additions and 37 storage tenders so demand for dispatchable clean power remains credible.
        - Evidence of slower tender conversion or weaker storage procurement would reduce the upside case.
      - - "Anti-thesis: public pricing support is indirect"
        - Greenko is absent from the refreshed valuation pages in this pool, so the comp screens are only valuation guardrails.
        - A refreshed Greenko round or financing package would materially sharpen the call.
      - - "Anti-thesis: execution bottlenecks can compress valuation"
        - Sector commentary still flags transmission readiness and China-linked dependence as live constraints despite growth.
        - Clean proof on grid access, supply chain security, and commissioning cadence would mitigate this concern.
    notes: Each row is a synthesized judgment backed by the cited claims rather than a single disclosed management metric.
    claimRefs: [CV001, CV002, CV004, CV005, CV009, CV010]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - Storage-backed projects commission on schedule and the market continues paying premium forward multiples for scaled clean-power platforms.
        - Upper end of current listed-peer bands is only defensible if diligence also confirms clean financing and contract quality.
        - Execution slippage or refinancing friction could still interrupt the rerating.
        - On-time storage milestones and better-than-expected financing transparency.
      - - Base
        - Strategy remains differentiated but price discovery on Greenko itself stays incomplete.
        - Treat Adani Green and NTPC Green as ceiling references and require a negotiated discount or milestone-based entry rather than full peer parity.
        - Indirect evidence may overstate what investors will pay for Greenko's own cap structure.
        - Partial transparency on debt and project cadence but no direct round-price refresh.
      - - Bear
        - Transmission or financing bottlenecks cut confidence before Greenko's next price marker is independently refreshed.
        - Stay below listed-peer screens or avoid pricing altogether until adverse execution signals clear.
        - Multiple compression can arrive before storage monetization is proven.
        - Delays or tighter funding terms would confirm the downside case.
    notes: Scenario ranges are expressed as relative peer-band discipline because the assigned pool does not provide a refreshed Greenko valuation anchor.
    claimRefs: [CV004, CV005, CV006, CV007, CV009, CV012, CV013]
