callouts:
  - calloutType: "insight"
    title: "Scale is now tied to storage economics, not just installed megawatts"
    body: >-
      The chapter's strongest evidence is not another generic renewable-capacity brag sheet; it is a storage-backed
      operating model that tries to monetize reliability and downstream green molecules in a market where curtailment,
      storage tendering, and grid integration are becoming defining constraints.
    claimRefs: ["CO005", "CO006", "CO011", "CO012", "CO013"]
  - calloutType: "risk"
    title: "Disclosure quality still trails platform ambition"
    body: >-
      Current project ambition is visible, but the retained refresh pool does not yet provide a current valuation,
      debt stack, board roster, headquarters, revenue base, headcount, or customer-count file that would let later
      chapters reuse those items as hard ground truth without additional sourcing.
    claimRefs: ["CO015", "CO016"]
