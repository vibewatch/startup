company:
  name: "Greenko Energy"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Assigned refresh evidence shows Greenko as a 2004-founded Indian renewable platform with about 9.4 GW of
    operating capacity, an unusually large pumped-storage buildout, and a strategy that is moving from pure generation
    into storage-backed power and green molecules. The strongest current evidence is project- and milestone-heavy;
    current valuation, debt, headquarters, leadership roster, revenue, customer count, and headcount remain unresolved
    because the retained profile-oriented Bloomberg, FT, and Mint links did not preserve usable Greenko-specific text.
sections:
  - id: "identity-and-scale"
    title: "Identity, footprint, and present scale"
    body: >-
      The assigned pool supports Greenko's operating identity much better than its corporate-profile metadata. Power
      Line describes the company as established in 2004 and operating about 9.4 GW of renewable capacity spread across
      more than 130 projects in over a dozen Indian states, with solar, wind, and hydropower all contributing to the
      mix. That scale matters because the broader Indian market is still expanding rapidly: CEEW and JMK both describe
      record FY2026 renewable additions, which frames Greenko as a late-buildout platform operating in a still-growing
      sector rather than a legacy asset owner. What the current pool does not establish is the formal company stage,
      headquarters, or a current public valuation.
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO012", "CO015", "CO016"]
    tableRefs: ["TO001"]
  - id: "strategy-and-transition"
    title: "Storage-led strategy and milestone transition"
    body: >-
      The new evidence is strongest on Greenko's strategic transition. Power Line presents the company as moving beyond
      a generation-led model toward storage-backed system services, anchored by the Pinnapuram integrated renewable
      energy project and a broader pumped-storage pipeline. The article also links Greenko's platform to AM Green's
      downstream green-molecule ambitions, including ammonia exports and industrial decarbonisation projects. This
      matters because CEEW and JMK both show a market where renewable additions are accelerating but storage and grid
      integration remain central constraints; Greenko's pitch is that pumped hydro and integrated supply can turn those
      constraints into an advantage if execution stays on schedule.
    claimRefs: ["CO005", "CO006", "CO007", "CO009", "CO010", "CO011", "CO012", "CO013"]
    tableRefs: ["TO003"]
    figureRefs: ["FO001"]
  - id: "ownership-and-disclosure"
    title: "Ownership signals, leadership coverage, and disclosure gaps"
    body: >-
      The same pool is materially weaker on leadership, governance, and financing transparency than on project
      milestones. The clearest ownership event is AM Green BV's July 2025 purchase of a 17.5 per cent stake from
      ORIX, taking its total Greenko stake to 25 per cent, but the retained evidence does not surface a current board
      roster, founder biographies, headquarters, debt stack, or public revenue and headcount disclosures. Several
      profile-oriented links were retained for refresh evidence, yet Bloomberg, FT, and Mint did not preserve the
      intended Greenko-specific profile or leverage text in the fetched outputs. That makes this chapter usable as a
      ground-truth operating snapshot, but not yet as a fully refreshed governance or valuation file.
    claimRefs: ["CO008", "CO014", "CO015", "CO016"]
    tableRefs: ["TO002"]
