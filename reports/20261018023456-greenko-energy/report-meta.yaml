companyProfile:
  summary: >-
    Greenko is a privately held Indian renewable-energy platform built around wind, solar, hydropower, and
    pumped-storage assets, with an operating model that increasingly emphasizes storage-backed, round-the-clock clean
    power. The company is also associated with the AM Green green-molecule platform, which extends the group into
    industrial decarbonisation and export-oriented clean-fuel projects. The business remains capital intensive and
    execution dependent, but it benefits from scale, grid infrastructure, and deep institutional backing.
  foundedDate: 2004-01-01T00:00:00.000Z
