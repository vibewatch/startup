    through the broader Greenko group.
  customerFocus: Utilities, commercial and industrial buyers, and large energy users needing firm renewable supply
  businessModel: Long-term power sales, storage-backed renewable supply, and project-level infrastructure monetization
  stage: Late-Stage Private
