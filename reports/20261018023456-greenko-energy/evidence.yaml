evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership-governance
    missingEvidence: Current CEO, founder, board, and headquarters disclosure from an official company or filing source.
    whyItMatters: >-
      Without a verified roster, later chapters cannot safely reuse management, governance, or key-person-dependence
      facts.
    diligencePath: >-
      Pull the current leadership, board, and corporate-contact pages from Greenko's official site plus any public
      financing or regulatory disclosures.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: financing-valuation
    missingEvidence: >-
      Current valuation, leverage, debt refinancing terms, and broader funding history from usable capital-markets or
      company-disclosure sources.
    whyItMatters: >-
      Valuation, debt, and financing structure are required cover facts and materially affect risk and recommendation
      work later in the report.
    diligencePath: >-
      Replace the broken profile links with current bond, investor, or financing coverage that preserves the full
      article text.
    relatedQuestionRefs:
      - QO004
      - QO005
      - QO007
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: operating-metrics
    missingEvidence: Current revenue, headcount, customer count, and any run-rate or contracted-revenue disclosure.
    whyItMatters: >-
      The chapter can anchor asset scale today, but it cannot yet anchor business scale or operating efficiency for
      later commercial and valuation analysis.
    diligencePath: >-
      Collect current annual-report, investor, recruitment, or lender materials that explicitly disclose operating
      metrics.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: access-blocked
    severity: material
    topic: profile-link-retrievability
    missingEvidence: Usable Greenko-specific text from the retained Bloomberg, FT, and Mint profile-oriented URLs.
    whyItMatters: >-
      Those links were likely intended to refresh corporate-profile and leverage evidence, but the retained fetches do
      not preserve the relevant company-specific article text.
    diligencePath: >-
      Re-resolve those URLs or replace them with alternative prefetched company-profile and leverage sources that
      preserve full article text.
    relatedQuestionRefs:
      - QO003
      - QO005
      - QO007
  - type: conflicting-data
    severity: material
    topic: greenko-capacity
    missingEvidence: >-
      A dated management or lender-grade reconciliation of Greenko's currently operating renewable capacity and storage
      footprint.
    whyItMatters: Capacity is the denominator for SAM, SOM, market-share, and execution-credibility claims in this chapter.
    diligencePath: >-
      Request the latest portfolio schedule from management or lenders and reconcile it against project-level
      commissioning records.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Public tariff, tenure, and utilization disclosures for Greenko's storage-backed or round-the-clock power
      contracts.
    whyItMatters: >-
      Buyer economics determine whether storage-backed demand is large enough to support valuation multiples beyond
      generic renewable buildout.
    diligencePath: >-
      Request representative PPA summaries, tender award documents, and customer-level tariff disclosures for
      storage-linked contracts.
    relatedQuestionRefs:
      - QM003
      - QM004
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: sam-som
    missingEvidence: >-
      Segment-level revenue or contracted-capacity splits between utility PPAs, storage-backed contracts, and affiliated
      industrial loads.
    whyItMatters: >-
      Without segment mix, the chapter can frame directional market opportunity but cannot publish a clean public SAM or
      SOM.
    diligencePath: Request management reporting by offtaker type, storage attachment, and affiliate versus third-party demand.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM001
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Customer-level tariffs, availability guarantees, escalation clauses, and realized discounts for Greenko, Adani,
      ReNew, and Tata renewable or storage-backed contracts.
    whyItMatters: >-
      Without realized contract economics, the chapter can compare product structure and benchmark tariffs but not prove
      that Greenko earns or sustains superior pricing.
    diligencePath: >-
      Obtain recent PPAs, C&I term sheets, or lender decks that disclose tariff, tenor, and performance obligations for
      Greenko and at least two named peers.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Multi-homing rates, renewal behavior, delivered-cost savings, and customer-level reliability outcomes for
      Greenko's storage-backed contracts versus standard renewable procurement.
    whyItMatters: >-
      Switching cost and lock-in are central to moat durability, yet the current pool shows packaging more clearly than
      realized customer dependence or economic switching friction.
    diligencePath: >-
      Request customer references, contract renewal data, delivered-LCOE comparisons, and account-level reliability
      metrics from Greenko and from one incumbent comparator.
    relatedQuestionRefs:
      - QP003
      - QP006
  - type: access-blocked
    severity: minor
    topic: independent-scrutiny
    missingEvidence: >-
      A usable high-reputation independent article or note that compares Greenko's execution and leverage risk against
      Indian renewable peers.
    whyItMatters: >-
      The assigned FT candidate did not yield company-specific scrutiny, leaving the chapter with thinner top-tier
      independent challenge than ideal for a moat-risk assessment.
    diligencePath: >-
      Refresh the independent-candidate pool or obtain a working FT, Reuters, Bloomberg, or sell-side note focused on
      Greenko relative to named peers.
    relatedQuestionRefs:
      - QP006
      - QP008
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Plant-level PPA tariffs, storage contract payment formulas, merchant spreads, and realized blended pricing by
      revenue channel.
    whyItMatters: >-
      Revenue quality cannot be underwritten from capacity scale alone; tariff and spread realization determine margin
      durability and downside risk.
    diligencePath: >-
      Request the portfolio contract register, recent settlement statements, and management bridge from list or
      benchmark pricing to realized revenue.
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: consolidated-financials
    missingEvidence: >-
      Audited consolidated income statement, cash-flow statement, debt schedule, and receivables ageing for the Greenko
      group.
    whyItMatters: >-
      Fitch and EMIS provide directional but incomplete public evidence, leaving cash conversion, customer
      concentration, and covenant headroom unverified.
    diligencePath: >-
      Obtain the latest audited consolidated accounts, lender presentation, and debt-maturity ladder with covenant
      definitions.
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: commissioning-schedule
    missingEvidence: >-
      Project-by-project commissioning schedule for Teesta, Pinnapuram, Madhya Pradesh, Karnataka, and Rajasthan with
      capex remaining and contracted offtake start dates.
    whyItMatters: >-
      The deleveraging path depends on timing assumptions that are currently only partially visible in Fitch's base
      case.
    diligencePath: >-
      Request the internal project tracker, transmission-readiness milestones, and downside cases for each delayed
      asset.
    relatedTableRefs:
      - TI001
      - TI003
  - type: stale
    severity: minor
    topic: source-durability
    missingEvidence: >-
      Durable, company-specific secondary reporting on financing and sponsor activity that remains recoverable at its
      canonical URL.
    whyItMatters: >-
      Some retained media URLs in the refresh pool now resolve to generic landing pages, which weakens repeatable
      corroboration across refresh cycles.
    diligencePath: >-
      Prefer lender, rating, filing, and company-record URLs over generic news home pages when preserving refresh
      evidence.
  - type: missing-source
    severity: material
    topic: security-and-compliance
    missingEvidence: >-
      Public documentation for security certifications, privacy controls, OT/IT governance, uptime history, incident
      reporting, and integration tooling.
    whyItMatters: >-
      The chapter can describe asset architecture, but it cannot verify whether Greenko operates to bankable security,
      reliability, or compliance standards.
    diligencePath: >-
      Request official trust/security documentation, public certifications, plant availability reports, and any
      customer-facing status or integration documentation.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: operating-performance
    missingEvidence: >-
      Site-level operating metrics such as dispatch success, round-trip efficiency, forced outage rates, reservoir
      cycling, and delivered 24/7 power performance.
    whyItMatters: Product maturity depends on repeatable operating performance, not just asset announcements and nameplate capacity.
    diligencePath: >-
      Obtain commissioning reports, lender technical due-diligence packs, and operating dashboards for Pinnapuram and
      the next storage sites.
    relatedQuestionRefs:
      - QE004
      - QE006
  - type: stale
