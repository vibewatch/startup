company:
  name: Greenko Energy
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence points to Greenko's customer thesis being built around utility-style
    round-the-clock procurement and newer industrial decarbonisation loads rather than
    disclosed recurring SaaS-style account metrics. Named counterparties such as Uniper,
    Coal India, and SECI-linked utility buyers show real commercial pathways, but most
    public proof is pre-production or procurement-stage and the assigned evidence pool
    does not disclose NRR, churn, renewal rates, or top-customer concentration.
sections:
  - id: customer-base-segmentation
    title: Customer base is best understood by offtake model, not by disclosed logo count
    body: >-
      The assigned evidence pool suggests Greenko is moving from a pure renewable generator
      toward a storage-backed energy platform serving several buyer archetypes. Power Line
      describes the company as positioning itself "as a provider of flexible, storage-backed
      energy solutions rather than a pure generator," which aligns with utility procurement,
      industrial decarbonisation loads, and other continuous-power use cases rather than
      retail-style customer acquisition. The clearest public procurement structure comes
      from India's round-the-clock renewable tenders: pv magazine reports that SECI signs
      25-year PPAs and then supplies power to "distribution companies and other electricity
      buyers across India." Sector sources add that Indian renewable demand now spans C&I
      open access, residential rooftop solar, and broader commercial and industrial
      consumption, which means Greenko's addressable customer base is diverse even when its
      own customer disclosures are not.
    claimRefs: [CU001, CU002, CU006, CU007, CU008, CU009, CU012]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: named-counterparties-and-adoption
    title: Named counterparties are visible, but most public proof is pre-production
    body: >-
      Greenko's strongest named customer proof in the assigned pool is concentrated in
      industrial and utility-adjacent counterparties rather than recurring account metrics.
      Power Line reports a long-term offtake agreement with Uniper for up to 500,000 tonnes
      per year of renewable ammonia, a 4.5 GW supply MoU with Coal India for green hydrogen
      and ammonia production, and a proposed 1 GW compute hub meant to run on round-the-clock
      carbon-free power. Those disclosures show commercial relevance and expansion potential,
      but they are not equivalent to already-ramped, diversified revenue cohorts: the Uniper
      volumes begin only once the Kakinada plant ships, the Coal India arrangement is an
      MoU, and the compute-hub load is still planned. The public evidence therefore supports
      real demand pathways and named counterparties, but only limited proof of mature,
      already-recurring customer utilisation.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU013]
    tableRefs: [TU003]
  - id: durability-expansion-and-concentration
    title: Durability and concentration remain the largest unresolved customer questions
    body: >-
      The chapter's main analytical gap is durability rather than raw market demand. JMK
      Research and CEEW-GFC both show strong FY2026 renewable adoption signals, including
      C&I open-access activity, rooftop growth, and a large national construction pipeline,
      while CEEW-GFC also notes a more competitive market with a 35 per cent concentration
      level and a 26 per cent drop in renewable-energy FDI during the first three quarters
      of FY26 versus the prior year. That combination means customer demand appears real,
      but negotiating power and capital availability still matter. Critically, the assigned
      pool does not disclose Greenko-specific NRR, GRR, churn, renewal rates, contract
      backlog conversion, or top-customer revenue share, so concentration risk must be
      treated as unresolved rather than assumed away.
    claimRefs: [CU008, CU009, CU010, CU011, CU014]
    tableRefs: [TU002]
