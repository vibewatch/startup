    claimRefs: [CU001, CU003, CU005, CU006, CU014]
callouts:
  - calloutType: risk
    title: "Durability is the real diligence gap"
    body: >-
      Public sources show credible routes to utility and industrial demand, but they do not
      show whether those routes have already become diversified, recurring customer revenue
      with measurable retention. That leaves customer concentration, renewal quality, and
      contract-to-revenue conversion as core diligence items.
    claimRefs: [CU003, CU006, CU014]
