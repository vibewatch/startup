      - [Pumped-storage long-term contracts, "Long-term storage contracts with buyers are referenced, but payment formula is not public", "Realized pricing unknown because contracts have not fully started", "Transmission delay pushes monetization timing and hides actual capacity-payment economics", "Storage economics are central to the thesis but still largely non-public"]
      - [Short-term bilateral and exchange sales, "Market-linked bilateral or exchange pricing", "Realized spreads undisclosed", "Merchant outcome likely varies with volatility and utilization", "This channel bridges delay risk but adds earnings variability"]
      - [India storage benchmark, INR 1.23 per unit for two-hour BESS in APTRANSCO tender, "External benchmark only; not Greenko realized pricing", "Different technology and tender terms may not translate directly to Greenko PSP economics", "Public market pricing is forming, but company-specific monetization remains unverified"]
    notes: >-
      This table separates public market benchmarks from Greenko-specific pricing, which is mostly
      unavailable in the assigned source pool.
    claimRefs: [CI009, CI010, CI011, CI012]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [EBITDA net interest cover, 0.9x FY26 forecast, medium, "Shows thin debt-service coverage during the commissioning-heavy year", "Provide monthly covenant model and bridge from EBITDA to cash interest"]
      - [EBITDA net interest cover, 1.4x FY27 forecast subject to commissioning, medium, "Improvement exists in the case model but is contingent on project delivery", "Provide downside case for delayed commissioning or weaker utilization"]
      - [EBITDA net leverage, 13.4x FY25 actual, medium, "Confirms leverage remains high entering the current build cycle", "Provide consolidated audited leverage by debt stack and covenant bucket"]
      - [EBITDA net leverage, ">12x FY26 forecast", medium, "Leverage only eases modestly before the planned FY27 step-down", "Provide quarterly deleveraging path and assumptions by project"]
      - [Readily available cash versus current maturities, "USD859m cash vs USD1.3bn maturities at FYE25", medium, "Refinancing and sponsor access matter immediately, not just long term", "Provide debt maturity ladder, hedging, and refinancing status by instrument"]
      - [Annual capex, "~USD1.2bn per year in FY26-FY27", medium, "Explains negative free cash flow and dependence on external funding", "Provide committed capex split by project, spend-to-date, and contingency buffer"]
      - [Greenko Energies Pvt Ltd debt to equity, "84.08% in 2025", medium, "Subsidiary-level balance-sheet intensity remains elevated even as assets scale", "Clarify how subsidiary leverage maps to consolidated restricted-group leverage"]
    notes: >-
      Values mix Fitch group-level forecasts with one EMIS subsidiary snapshot; they are directionally
      useful but not a substitute for audited consolidated management accounts.
    claimRefs: [CI002, CI003, CI004, CI005, CI006]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Greenko's near-term bridge runs from operating renewable assets and delayed storage capacity
      into a mix of contracted and market-linked monetization, then into EBITDA and refinancing.
    data:
      nodes:
        - label: Operating renewable base
          value: 5.5
          unit: GW
          summary: Fitch's operating capacity base across wind, solar, hydro, and other assets.
          note: Existing generation anchors revenue but does not disclose realized tariff quality.
        - label: Storage platform under ramp
          value: 1.68
          unit: GW PSP
          summary: Pinnapuram's first PSP tranche is central to the storage-led model.
          note: Contract start slipped with transmission-line delays.
        - label: Long-term buyer contracts
          summary: Long-term power storage contracts should improve cash-flow predictability.
          note: Public sources do not disclose buyer mix, tenor, or payment formulas.
        - label: Short-term bilateral and exchanges
          value: 1.2
          unit: GW
          summary: Balance storage capacity is being sold through short-term bilateral contracts and exchanges.
          note: This provides bridge monetization but adds market exposure.
        - label: EBITDA generation
          summary: Fitch forecasts 0.9x EBITDA interest cover in FY26 and 1.4x in FY27.
          note: Improvement depends on commissioning and restored output.
        - label: Debt service and refinance
          summary: Fitch cites USD859m cash versus USD1.3bn current maturities at FY25 year-end.
          note: Sponsor support and timely refinancing remain necessary.
      edges:
        - from: Operating renewable base
          to: EBITDA generation
          label: Existing asset cash flow
        - from: Storage platform under ramp
          to: Long-term buyer contracts
          label: Commission on time
        - from: Storage platform under ramp
          to: Short-term bilateral and exchanges
          label: Sell interim capacity
        - from: Long-term buyer contracts
          to: EBITDA generation
          label: Higher-quality contracted revenue
        - from: Short-term bilateral and exchanges
          to: EBITDA generation
          label: Market-linked bridge revenue
        - from: EBITDA generation
          to: Debt service and refinance
          label: Coverage plus refinancing access
    approximationNotes: >-
      Figure shows commercial logic and disclosed scale markers, not a quantified profit bridge; public
      sources do not disclose realized storage pricing or gross-margin conversion.
    claimRefs: [CI005, CI007, CI010, CI011]
callouts:
  - calloutType: risk
    title: Execution slippage is still the central financial risk
    body: >-
      The underwriting hinge is not whether storage demand exists, but whether Greenko commissions
      delayed assets on time, converts interim merchant sales into durable contracts, and refinances
      maturities without eroding economics.
    claimRefs: [CI001, CI003, CI004, CI005, CI011]
  - calloutType: insight
    title: Public evidence is stronger on leverage than on revenue quality
    body: >-
      Fitch, EMIS, and sector handbooks provide enough to frame capex, liquidity, and market context,
      but not enough to verify realized tariffs, counterparty concentration, receivables ageing, or a
      fully consolidated cash-generation bridge.
    claimRefs: [CI006, CI009, CI012, CI013, CI014]
