artifact: financials
slug: greenko-energy
runDate: 2026-10-18
company:
  name: Greenko Energy
chapter:
  number: 4
  title: Financials
  summary: >-
    Greenko's public financial picture is dominated by a large, storage-led buildout that still
    depends on commissioning execution, refinancing, and sponsor support rather than fully visible
    operating cash generation. Fitch's downgrade, high leverage forecasts, and heavy capex guidance
    are more concrete than any public disclosure on realized tariffs, revenue mix, or consolidated
    cash conversion, so underwriting still turns on diligence questions that the public record does
    not answer.
sections:
  - id: revenue-model-and-public-traction
    title: Revenue model and public traction
    body: >-
      Public evidence points to a hybrid revenue model rather than a simple contracted renewable
      utility profile. Fitch says Greenko's operating base remains wind, solar, and hydro, while
      its near-term monetization increasingly depends on pumped-storage capacity and storage-linked
      contracts. The clearest disclosed bridge is that delayed long-term storage contracts have
      forced Greenko to sell 1.2 GW of balance storage capacity through short-term bilateral deals
      and power exchanges, which introduces merchant exposure during commissioning slippage.
      PowerLine's description of Pinnapuram and Greenko's broader storage platform supports the
      strategic logic of this model, but public sources stop short of showing realized tariffs,
      contract tenors, channel mix, or customer concentration. Market handbooks and sector research
      confirm strong Indian storage demand, yet those are demand-side comparables, not proof that
      Greenko already converts its storage footprint into high-quality contracted revenue.
    claimRefs: [CI007, CI009, CI010, CI011, CI012]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: cost-structure-and-capex
    title: Cost structure and capex burden
    body: >-
      The most visible financial fact is capital intensity. Fitch expects around USD 1.2 billion of
      annual capex in FY26 and FY27, largely for pumped-storage construction in Madhya Pradesh and
      Karnataka, while Teesta restoration and transmission delays have already weakened forecast cash
      flow. EMIS's subsidiary-level snapshot also shows a balance sheet that is still expanding
      faster than a mature yield platform would, with 2025 total assets up 55.84% and debt-to-equity
      still elevated. That combination suggests Greenko is still in a build-and-commission phase
      where execution timing, transmission readiness, and funding access matter as much as nominal
      portfolio size. Public disclosures also do not provide enough detail to decompose service
      delivery cost, O&M by asset class, receivables drag, or working-capital absorption by
      counterparty.
    claimRefs: [CI001, CI002, CI004, CI006, CI008]
    tableRefs: [TI003]
  - id: capital-adequacy-and-financing
    title: Capital adequacy and financing dependency
    body: >-
      Greenko's capital adequacy remains a financing story more than a self-funding story. Fitch
      reports USD 859 million of readily available cash at FY25 against USD 1.3 billion of current
      maturities, including USD 826 million of notes due in March 2026, and still expects negative
      free cash flow in the medium term because capex and investments outstrip internal cash
      generation. The rating agency also ties Greenko's funding access directly to GIC's influence
      and says shareholder support backs 25% of under-construction pumped-storage costs. That means
      deleveraging depends on three linked events: timely refinancing, timely commissioning, and the
      continuation of sponsor support. Public evidence therefore supports a view of manageable but
      execution-sensitive liquidity rather than comfortably covered expansion.
    claimRefs: [CI002, CI003, CI004, CI005, CI014]
  - id: financial-verdict-and-diligence-blockers
    title: Financial verdict and diligence blockers
    body: >-
      The financial verdict is directionally constructive on strategic fit but still incomplete for
      underwriting. Sector evidence supports why storage-backed renewable platforms should matter in
      India, and Fitch's case assumes meaningful improvement once key assets are commissioned, but
      the public record is materially thinner on revenue quality than on leverage or capex. There is
      no audited consolidated revenue bridge in the assigned pool, no public breakdown of realized
      tariffs versus list or benchmark pricing, no receivables ageing by DISCOM or industrial buyer,
      and no project-by-project commissioning schedule precise enough to test the deleveraging path.
      Two retained general-news URLs in the refresh pool now resolve only to generic landing pages,
      which also shows how fragile some secondary corroboration can be. Until management provides a
      consolidated model tying capacity additions, tariffs, receivables, debt service, and equity
      commitments together, Greenko remains financeable on sponsor and asset-scale credibility, but
      not yet transparent enough for high-conviction underwriting on public evidence alone.
    claimRefs: [CI009, CI012, CI013, CI014]
