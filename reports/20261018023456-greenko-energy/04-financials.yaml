  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: realized-pricing
      missingEvidence: Plant-level PPA tariffs, storage contract payment formulas, merchant spreads, and realized blended pricing by revenue channel.
      whyItMatters: Revenue quality cannot be underwritten from capacity scale alone; tariff and spread realization determine margin durability and downside risk.
      diligencePath: Request the portfolio contract register, recent settlement statements, and management bridge from list or benchmark pricing to realized revenue.
      relatedTableRefs: [TI001, TI002]
    - type: missing-source
      severity: material
      topic: consolidated-financials
      missingEvidence: Audited consolidated income statement, cash-flow statement, debt schedule, and receivables ageing for the Greenko group.
      whyItMatters: Fitch and EMIS provide directional but incomplete public evidence, leaving cash conversion, customer concentration, and covenant headroom unverified.
      diligencePath: Obtain the latest audited consolidated accounts, lender presentation, and debt-maturity ladder with covenant definitions.
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: commissioning-schedule
      missingEvidence: Project-by-project commissioning schedule for Teesta, Pinnapuram, Madhya Pradesh, Karnataka, and Rajasthan with capex remaining and contracted offtake start dates.
      whyItMatters: The deleveraging path depends on timing assumptions that are currently only partially visible in Fitch's base case.
      diligencePath: Request the internal project tracker, transmission-readiness milestones, and downside cases for each delayed asset.
      relatedTableRefs: [TI001, TI003]
