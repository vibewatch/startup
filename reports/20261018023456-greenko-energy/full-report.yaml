  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Greenko's public customer journey runs from utility procurement into industrial and always-on load expansion, with
      limited disclosed retention proof.
    data:
      items:
        - label: Dispatchable renewable need
          detail: >-
            Indian buyers increasingly need supply that combines renewables with storage rather than standalone
            intermittent generation.
          touchpoints:
            - RTC tender requires energy storage systems
            - Utility buyers can include DISCOMs and other electricity buyers
        - label: Contracting channel
          detail: SECI-like intermediated procurement is a visible route to long-duration offtake.
          touchpoints:
            - 25-year PPAs under RTC procurement
            - Single bids from 100 MW to 500 MW
        - label: Industrial anchor load
          detail: Greenko positions storage-backed power around industrial decarbonisation use cases.
          touchpoints:
            - Green hydrogen and ammonia
            - Green aluminium and green steel
        - label: Named offtake proof
          detail: The clearest disclosed named counterparty is export ammonia buyer Uniper.
          touchpoints:
            - Up to 500,000 tonnes per year
            - First shipment expected as early as 2028
        - label: Always-on adjacent load
          detail: The thesis extends to digital infrastructure with continuous electricity demand.
          touchpoints:
            - 1 GW high-performance compute hub
            - Round-the-clock carbon-free energy
        - label: Expansion loop
          detail: >-
            Expansion depends on converting planned counterparties into operating contracts and then demonstrating
            renewals or repeat procurement.
          touchpoints:
            - Public pool lacks NRR, churn, and renewal data
            - Top-customer share is not disclosed
    claimRefs:
      - CU001
      - CU003
      - CU005
      - CU006
      - CU014
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Execution and financing risks rank highest because milestone delivery, capital support, and market timing all
      matter before Greenko's next wave of assets proves out.
    data:
      columns:
        - label: Likelihood
          note: 1-5 score, where 5 means the issue is already close enough to affect underwriting assumptions.
        - label: Impact
          note: 1-5 score, where 5 means the issue could change valuation or block thesis realization.
        - label: Mitigation maturity
          note: 1-5 score, where 5 means public mitigants are already concrete and visible.
      rows:
        - label: PSP and IRES commissioning pipeline
          note: Large construction and survey backlog remains ahead of monetization.
          values:
            - value: 4
              label: '4'
              tone: risk
              note: Multiple assets are still under construction or investigation.
            - value: 5
              label: '5'
              tone: risk
              note: A delay would hit both growth timing and deleveraging credibility.
            - value: 3
              label: '3'
              tone: medium
              note: Portfolio scale helps, but site-level mitigation evidence is still limited here.
        - label: Sponsor-liquidity and refinancing overhang
          note: Ownership signals and capital intensity keep funding terms important.
          values:
            - value: 3
              label: '3'
              tone: risk
              note: The stake-sale report is contested, so likelihood is meaningful but not proven.
            - value: 4
              label: '4'
              tone: risk
              note: A weak funding window could compress strategic flexibility.
            - value: 3
              label: '3'
              tone: medium
              note: Sovereign and strategic investors are a mitigant, but terms remain undisclosed.
        - label: AM Green downstream commercialization
          note: Industrial offtake and certification create a second execution layer beyond power assets.
          values:
            - value: 3
              label: '3'
              tone: risk
              note: The pathway exists, but commercial realization is still forward-looking.
            - value: 4
              label: '4'
              tone: risk
              note: Delay would weaken the premium narrative attached to the platform model.
            - value: 2
              label: '2'
              tone: medium
              note: Public mitigants stop at headline agreements rather than detailed contract economics.
        - label: Policy and tender-timing dependence
          note: Renewable buildout economics still react to transmission and policy deadlines.
          values:
            - value: 3
              label: '3'
              tone: warning
              note: JMK tied FY2026 acceleration to a specific ISTS-waiver deadline.
            - value: 3
              label: '3'
              tone: medium
              note: Timing sensitivity can alter economics even without a technology failure.
            - value: 2
              label: '2'
              tone: low
              note: Public mitigants are mostly market-wide rather than Greenko-specific.
        - label: Counterparty concentration visibility
          note: The pool lacks direct receivables or top-offtaker disclosure.
          values:
            - value: 3
              label: '3'
              tone: warning
              note: Concentration may be manageable, but public evidence here does not quantify it.
            - value: 4
              label: '4'
              tone: risk
              note: Hidden receivables stress could magnify operational delays into liquidity pressure.
            - value: 1
              label: '1'
              tone: low
              note: Public mitigants are weak because the key data is absent from the assigned pool.
        - label: Competitive capacity race
          note: Peer scaling raises the bar for maintaining a differentiated premium multiple.
          values:
            - value: 4
              label: '4'
              tone: medium
              note: Sector additions and peer commissioning show a very active market.
            - value: 3
              label: '3'
              tone: medium
              note: Competitive pressure is meaningful, though less acute than self-execution risk.
            - value: 2
              label: '2'
              tone: low
              note: Greenko's storage-led strategy remains a mitigant, but market proof is still pending.
    approximationNotes: Heatmap scores are synthesized from the cited claims and are directional rather than a probabilistic forecast.
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR006
      - CR007
      - CR009
      - CR012
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Public evidence supports strategic quality, but missing Greenko-specific price support keeps the recommendation
      diligence-gated.
    data:
      nodes:
        - id: scale-proof
          label: Storage-backed scale
          value: 9.4 GW fleet plus 1,680 MW / 11,000 MWh at Pinnapuram
          detail: Differentiated asset base versus plain-generation peers.
        - id: market-tailwind
          label: Market tailwind
          value: Roughly 44.6 GW solar and about 6 GW wind added in FY2026
          detail: Large-scale Indian renewable build-out remains active.
        - id: peer-ceiling
          label: Public comp ceiling
          value: Adani and NTPC Green both screen at premium forward multiples
          detail: Useful for discipline, not for automatic look-through valuation.
        - id: price-gap
          label: Missing direct price marker
          value: No refreshed Greenko round price, preference stack, or debt-term disclosure in pool
          tone: risk
          detail: Direct valuation support is incomplete.
        - id: execution-risk
          label: Execution bottlenecks
          value: Transmission readiness and China-linked dependence remain sector risks
          tone: risk
          detail: Strong demand does not remove delivery risk.
        - id: recommendation
          label: Recommendation
          value: Research more / monitor; require price discipline before a buy
          tone: neutral
          detail: Positive strategy, but entry should be milestone- and valuation-gated.
    approximationNotes: >-
      Figure is a decision chain rather than a quantified valuation bridge because direct Greenko pricing evidence is
      missing.
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV009
      - CV011
      - CV012
