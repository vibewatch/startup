            title: Market demand is growing faster than financing clarity
            body: >
              India's renewable and storage procurement signals are strong, but Greenko's leverage, refinancing needs,
              and inconsistent public capacity disclosures limit confidence in any precise share-of-market or
              commissioning-speed assumption.
            calloutType: risk
            claimRefs:
