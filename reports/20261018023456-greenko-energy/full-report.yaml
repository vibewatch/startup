  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >
              Greenko's practical market is not "all clean energy" in the abstract; it is the Indian market for
              grid-scale renewable generation plus the smaller but strategically more valuable layer of storage-backed,
              round-the-clock carbon-free power that can serve utilities, grid-balancing tenders, and energy-intensive
              industrial loads. Its adjacent opportunity extends into green-ammonia and other decarbonization hubs only
              to the extent that Greenko's assets supply the power backbone; downstream molecule revenues should not be
              counted as part of the current core SAM. The key substitutes remain conventional utility PPAs without
              storage, competing renewable platforms, merchant or bank-financed storage projects, and status-quo thermal
              supply where buyers prioritize certainty over decarbonization.
            claimRefs:
              - CM001
              - CM007
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
      - number: '2.2'
        title: Evidence-backed sizing lenses
        blocks:
          - type: paragraph
            body: >
              Public evidence supports a broad-to-narrow market stack, but not a precise revenue TAM/SAM/SOM. CEEW says
              India ended FY26 with about 533 GW of installed power capacity after adding 57.5 GW net, while JMK cites
              275 GW of installed renewable capacity and a record 44.6 GW of solar plus 6 GW of wind additions in the
              year. CEEW also reports around 151 GW of renewable capacity under construction and 37 storage tenders in
              FY26, which is enough to show that the addressable market is still expanding beyond pure generation into
              flexibility procurement. That supports a strong demand backdrop for Greenko's storage-heavy positioning,
              while still leaving public SAM and SOM boundaries under-specified.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM012
