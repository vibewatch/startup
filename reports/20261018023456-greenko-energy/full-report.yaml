      - number: '6.2'
        title: Named counterparties are visible, but most public proof is pre-production
        blocks:
          - type: paragraph
            body: >-
              Greenko's strongest named customer proof in the assigned pool is concentrated in industrial and
              utility-adjacent counterparties rather than recurring account metrics. Power Line reports a long-term
              offtake agreement with Uniper for up to 500,000 tonnes per year of renewable ammonia, a 4.5 GW supply MoU
              with Coal India for green hydrogen and ammonia production, and a proposed 1 GW compute hub meant to run on
              round-the-clock carbon-free power. Those disclosures show commercial relevance and expansion potential,
              but they are not equivalent to already-ramped, diversified revenue cohorts: the Uniper volumes begin only
              once the Kakinada plant ships, the Coal India arrangement is an MoU, and the compute-hub load is still
              planned. The public evidence therefore supports real demand pathways and named counterparties, but only
              limited proof of mature, already-recurring customer utilisation.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU006
      - number: '6.3'
        title: Durability and concentration remain the largest unresolved customer questions
        blocks:
          - type: paragraph
            body: >-
              The chapter's main analytical gap is durability rather than raw market demand. JMK Research and CEEW-GFC
              both show strong FY2026 renewable adoption signals, including C&I open-access activity, rooftop growth,
              and a large national construction pipeline, while CEEW-GFC also notes a more competitive market with a 35
              per cent concentration level and a 26 per cent drop in renewable-energy FDI during the first three
              quarters of FY26 versus the prior year. That combination means customer demand appears real, but
              negotiating power and capital availability still matter. Critically, the assigned pool does not disclose
              Greenko-specific NRR, GRR, churn, renewal rates, contract backlog conversion, or top-customer revenue
              share, so concentration risk must be treated as unresolved rather than assumed away.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU006
              - CU008
              - CU009
              - CU010
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Durability is the real diligence gap
            body: >-
              Public sources show credible routes to utility and industrial demand, but they do not show whether those
              routes have already become diversified, recurring customer revenue with measurable retention. That leaves
              customer concentration, renewal quality, and contract-to-revenue conversion as core diligence items.
            calloutType: risk
            claimRefs:
              - CU003
              - CU006
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The highest residual risk is delivery against a multi-asset construction plan that spans large
              pumped-storage plants, integrated renewable-energy sites, and downstream green ammonia commitments. Power
              Line describes both the scale of the flagship Pinnapuram complex and a broader pumped-storage pipeline
              that still has thousands of megawatts under construction or investigation, while JMK and CEEW show that
              India's sector is still moving quickly enough for interconnection, procurement, and policy timing to
              matter. That makes Greenko's main risk less about whether demand for flexible clean power exists and more
              about whether the company can commission on time, keep capex disciplined, and translate storage-backed
              supply into contracted cash flows before financing windows tighten.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR008
              - CR010
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR007
              - CR009
              - CR012
      - number: '7.2'
        title: Regulatory and project-delivery risk
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not prove a current enforcement action against Greenko, but it does show that a
              large share of the next value-creation step depends on assets and contracts whose timing remains
              externally validated only at a high level. Power Line ties Greenko's forward case to pumped-storage
              projects that are under construction or still in survey and investigation, plus a green-ammonia program
              whose first Uniper-linked shipment is only expected from 2028 onward. In parallel, the sector sources show
              a buildout wave in which storage, tendering, grid access, and policy deadlines affect economics, so any
              slippage in approvals, transmission readiness, or industrial-offtake readiness would hit both the
              deleveraging narrative and the premium attached to Greenko's integrated model.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR007
              - CR009
              - CR013
              - CR014
      - number: '7.3'
        title: Financing, counterparties, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Financing and counterparty risk remain material because the public refresh evidence still mixes contested
              ownership signals, rapid competitor scaling, and incomplete recovery of some earlier concentration
              sources. Business Standard reported that GIC explored options for its 50 per cent stake at a valuation
              around $10 billion, but Greenko denied that description, which means investors should treat
              ownership-liquidity narratives as unsettled rather than settled fact. Meanwhile, competitor buildout and
              softer sector FDI create a tougher backdrop for capital-intensive assets. The key kill criteria are
              straightforward: repeated delays on pumped storage and Kakinada milestones, weaker-than-expected sponsor
              support or refinancing transparency, and unresolved evidence on offtake concentration or receivables
              quality.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
              - CR009
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers
            body: >-
              Re-underwrite if major pumped-storage CODs slip repeatedly, if Kakinada/Uniper milestones drift without a
              disclosed commercial fallback, or if sponsor-liquidity actions occur before operating proof narrows
              leverage concerns.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR007
          - type: callout
            title: What would de-risk the case fastest
            body: >-
              A site-by-site commissioning tracker, refinancing terms, receivables ageing by key counterparties, and
              signed economics for anchor industrial offtake would convert today's biggest residual risks from narrative
              questions into measurable execution checkpoints.
            calloutType: insight
            claimRefs:
              - CR006
              - CR007
              - CR009
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Public valuation frame is constructive but indirect
        blocks:
          - type: paragraph
            body: >-
              Public evidence still supports the strategic part of the Greenko thesis. Power Line described a 9.4 GW
              operating fleet spread across solar, wind, and hydro, plus a 1,680 MW / 11,000 MWh Pinnapuram storage
              asset that underpins the company's "firm power" positioning rather than a simple commodity-generation
              model. Independent market trackers also show that FY2026 remained a strong deployment year for Indian
              renewables, with roughly 44.6 GW of solar and about 6 GW of wind added and CEEW-GFC counting 37 storage
              tenders, which keeps the addressable market for storage-backed platforms credible. The valuation problem
              is that the refreshed public price markers in this pool are peers rather than Greenko itself: Adani Green
              and NTPC Green provide premium public comp screens, but they do not independently prove Greenko's current
              fair value or financing terms.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV009
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV009
              - CV011
              - CV012
      - number: '8.2'
        title: Recommendation should stay diligence-gated until price support is refreshed
        blocks:
          - type: paragraph
            body: >-
              The disciplined recommendation is to keep Greenko in a research-more or monitor bucket rather than treat
              it as a clean buy from public evidence alone. The upside case is real: scaled storage-backed
              infrastructure, a favorable Indian build-out cycle, and public peers that still command rich forward
              multiples. The constraint is that this worker pool does not refresh Greenko's own round price, cap-table
              preferences, or refinancing terms, while sector commentary still flags transmission readiness and
              China-linked supply dependence as live execution risks. Even the intended FT adverse datapoint did not
              survive prefetch as article-specific reporting, so the bearish side of the valuation debate remains only
              partially refreshed. That combination argues for price discipline first and enthusiasm second.
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV012
      - number: '8.3'
        title: Bull/base/bear cases depend more on proof of execution and pricing than on demand
        blocks:
          - type: paragraph
            body: >-
              The scenario spread is driven less by end-market demand than by whether Greenko can translate its
              storage-heavy strategy into on-schedule commissioning, financeable contracts, and a negotiable entry
              price. The bull case assumes that storage tender growth, peer multiple resilience, and Greenko's own
              pumped-storage pipeline let investors underwrite scarcity value for firm clean power. The base case
              assumes the strategy remains sound but the current public record still supports only a peer-band ceiling,
              not a precise intrinsic value. The bear case appears if project timing slips, refinancing or preference
              terms prove more punitive than expected, or transmission and supply-chain bottlenecks compress what public
              comps are willing to pay. Those are the thesis-break triggers that diligence should test before any price
              is underwritten.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV012
              - CV013
