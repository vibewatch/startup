      - number: '2.3'
        title: Buyers, budget owners, and adoption path
        blocks:
          - type: paragraph
            body: >
              The most credible buyers in the current evidence are state utilities and renewable procurement agencies
              that need to absorb variable renewable supply, plus large industrial projects that need firm, carbon-free
              electricity rather than intermittent certificates alone. Greenko's strategy is differentiated when the
              workflow starts with a contracted energy need—utility procurement, storage tender, or industrial
              decarbonization load—and then pulls in wind, solar, and pumped hydro as an integrated solution. Adoption
              timing is therefore governed by policy-led bidding, interconnection and transmission readiness, falling
              storage tariffs, and whether large industrial projects such as green-ammonia capacity move from memorandum
              to financed construction.
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
              - CM013
      - number: '2.4'
        title: Constraints, contradictions, and valuation relevance
        blocks:
          - type: paragraph
            body: >
              The same market that looks large on installed-capacity and tender metrics also shows meaningful conversion
              risk. CEEW reports renewable-sector FDI fell 26% in FY26's first three quarters, ET's topic coverage says
              Greenko refinanced near-term dollar bonds with NaBFID funding while Fitch cited project delays, and EMIS
              shows leverage at the operating-company level remains substantial. Public disclosures also disagree on
              Greenko's current operating renewable footprint, with sources citing 7.5 GW, about 9.4 GW, and 10 GW. That
              matters because a valuation case based on market share, storage leadership, or commissioning pace needs a
              reconciled asset denominator and clearer evidence on contracted buyer economics before it can claim more
              than directional advantage.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
