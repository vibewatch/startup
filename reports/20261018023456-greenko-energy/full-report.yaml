        title: Storage-led strategy and milestone transition
        blocks:
          - type: paragraph
            body: >-
              The new evidence is strongest on Greenko's strategic transition. Power Line presents the company as moving
              beyond a generation-led model toward storage-backed system services, anchored by the Pinnapuram integrated
              renewable energy project and a broader pumped-storage pipeline. The article also links Greenko's platform
              to AM Green's downstream green-molecule ambitions, including ammonia exports and industrial
              decarbonisation projects. This matters because CEEW and JMK both show a market where renewable additions
              are accelerating but storage and grid integration remain central constraints; Greenko's pitch is that
              pumped hydro and integrated supply can turn those constraints into an advantage if execution stays on
              schedule.
