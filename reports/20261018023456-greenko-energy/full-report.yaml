        title: Differentiation rests on integrated storage and industrial packaging
        blocks:
          - type: paragraph
            body: >-
              Greenko's strongest source-backed differentiator is system integration, not just installed megawatts.
              Power Line describes a 9.4 GW renewable base, a 3.5 GW solar-and-wind IRES complex at Pinnapuram tied to
              1,680 MW of pumped storage and more than 11,000 MWh of capacity, plus a wider cloud storage strategy. The
