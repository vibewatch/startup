      - number: '3.3'
        title: Packaging is visible, realized pricing is not
        blocks:
          - type: paragraph
            body: >-
              The pool provides enough evidence to compare contract structures, but not enough to underwrite price
              superiority. Greenko's public evidence shows a long-tenor storage-capacity agreement with an industrial
              buyer, and CEEW's handbook supplies a market benchmark in the form of Andhra Pradesh's record-low BESS
              tender tariff. What remains missing are realized tariffs, discounts, availability commitments, and
              delivered-cost savings for Greenko versus the large renewable incumbents. As a result, public pricing
              evidence supports only a cautious conclusion: Greenko can demonstrate differentiated packaging, but not
              yet a proven pricing moat.
