  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What Greenko is delivering
        blocks:
          - type: paragraph
            body: >-
              Public descriptions consistently frame Greenko as a provider of dispatchable clean-power infrastructure
              rather than a simple merchant generator. Caproasia describes the company as operating 11 GW across 20
              Indian states and explicitly says the platform is trying to turn renewable energy from a real-time
              commodity into a "dispatchable and controlled medium" through storage and digitization. Power Line's March
              2026 profile shows how that positioning translates into product surfaces: renewable generation assets,
              grid-evacuation infrastructure, pumped storage, and storage-backed supply for green-molecule and
              industrial-load projects. In customer workflow terms, the value proposition is firm, carbon-free power for
              grids and energy-intensive loads that cannot run on intermittent solar or wind alone.
            claimRefs:
              - CE001
              - CE002
              - CE003
