      - number: '5.2'
        title: Integrated storage architecture
        blocks:
          - type: paragraph
            body: >-
              The clearest architecture proof is Pinnapuram in Andhra Pradesh. Power Line reports that the site combines
              approximately 3.5 GW of solar and wind with a 1,680 MW closed-loop pumped-storage plant offering more than
              11,000 MWh of storage. That matters because the storage block is not a sidecar battery; it is the control
              layer that shifts renewable output into peak-demand windows and supports round-the-clock delivery. The
              same source ties the platform to high-voltage transmission lines and substations, implying that grid
              interconnection and evacuation are core product dependencies. Greenko's stated GKO 3.0 and GKO 4.0 phases
              add the software layer: forecasting, analytics, digital control systems, and a storage-cloud model for
              coordinating pumped-storage assets across states.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE008
              - CE009
