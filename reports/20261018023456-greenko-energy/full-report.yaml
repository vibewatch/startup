      - number: '3.4'
        title: Moat durability is challenged by market crowding and thin disclosure
        blocks:
          - type: paragraph
            body: >-
              The competitive threat is not that Greenko lacks scale; it is that rivals and market infrastructure are
              closing the same reliability gap Greenko uses to differentiate. CEEW reports 151 GW of renewable capacity
              under construction and 37 storage tenders in FY26, while JMK reports September 2026 curtailment still
              affecting 118.6 GW of renewable capacity because of transmission constraints and limited storage. Those
              datapoints support the strategic case for Greenko's storage-heavy model, but they also imply more capital
              is chasing the same problem set. Public private-company data remains fragmented across different Greenko
              legal entities, and the assigned FT fetch produced no company-specific analysis. Switching costs,
              multi-homing behavior, and net delivered economics therefore remain diligence items rather than closed
              conclusions.
            claimRefs:
              - CP011
              - CP012
