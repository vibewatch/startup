  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base is best understood by offtake model, not by disclosed logo count
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence pool suggests Greenko is moving from a pure renewable generator toward a
              storage-backed energy platform serving several buyer archetypes. Power Line describes the company as
              positioning itself "as a provider of flexible, storage-backed energy solutions rather than a pure
              generator," which aligns with utility procurement, industrial decarbonisation loads, and other
              continuous-power use cases rather than retail-style customer acquisition. The clearest public procurement
              structure comes from India's round-the-clock renewable tenders: pv magazine reports that SECI signs
              25-year PPAs and then supplies power to "distribution companies and other electricity buyers across
              India." Sector sources add that Indian renewable demand now spans C&I open access, residential rooftop
              solar, and broader commercial and industrial consumption, which means Greenko's addressable customer base
              is diverse even when its own customer disclosures are not.
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
              - CU008
              - CU009
