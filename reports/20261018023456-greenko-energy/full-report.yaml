  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Peer set extends beyond storage specialists
        blocks:
          - type: paragraph
            body: >-
              The usable peer set in this assigned pool is broader than "other storage players." Tracxn's ranked
              competitor list places Greenko alongside Azure Power, ACME Group, Juniper Green Energy, and Adani Green
              Energy, while the current-news evidence shows very large incumbents such as Adani, ReNew, and Tata Power
              Renewables continuing to add capacity at scale. That means the competitive frame is not a narrow
              technology contest: buyers choosing how to procure decarbonized power can compare Greenko against large
              renewable IPPs, storage-backed platforms, and plain renewable supply that postpones a more bespoke 24/7
              structure until tariffs or reliability needs justify it.
