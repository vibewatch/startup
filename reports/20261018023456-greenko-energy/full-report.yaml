      - number: '4.2'
        title: Cost structure and capex burden
        blocks:
          - type: paragraph
            body: >-
              The most visible financial fact is capital intensity. Fitch expects around USD 1.2 billion of annual capex
              in FY26 and FY27, largely for pumped-storage construction in Madhya Pradesh and Karnataka, while Teesta
              restoration and transmission delays have already weakened forecast cash flow. EMIS's subsidiary-level
              snapshot also shows a balance sheet that is still expanding faster than a mature yield platform would,
              with 2025 total assets up 55.84% and debt-to-equity still elevated. That combination suggests Greenko is
              still in a build-and-commission phase where execution timing, transmission readiness, and funding access
              matter as much as nominal portfolio size. Public disclosures also do not provide enough detail to
              decompose service delivery cost, O&M by asset class, receivables drag, or working-capital absorption by
              counterparty.
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI006
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Greenko's capital adequacy remains a financing story more than a self-funding story. Fitch reports USD 859
              million of readily available cash at FY25 against USD 1.3 billion of current maturities, including USD 826
              million of notes due in March 2026, and still expects negative free cash flow in the medium term because
              capex and investments outstrip internal cash generation. The rating agency also ties Greenko's funding
              access directly to GIC's influence and says shareholder support backs 25% of under-construction
              pumped-storage costs. That means deleveraging depends on three linked events: timely refinancing, timely
              commissioning, and the continuation of sponsor support. Public evidence therefore supports a view of
              manageable but execution-sensitive liquidity rather than comfortably covered expansion.
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
              - CI014
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is directionally constructive on strategic fit but still incomplete for
              underwriting. Sector evidence supports why storage-backed renewable platforms should matter in India, and
              Fitch's case assumes meaningful improvement once key assets are commissioned, but the public record is
              materially thinner on revenue quality than on leverage or capex. There is no audited consolidated revenue
              bridge in the assigned pool, no public breakdown of realized tariffs versus list or benchmark pricing, no
              receivables ageing by DISCOM or industrial buyer, and no project-by-project commissioning schedule precise
              enough to test the deleveraging path. Two retained general-news URLs in the refresh pool now resolve only
              to generic landing pages, which also shows how fragile some secondary corroboration can be. Until
              management provides a consolidated model tying capacity additions, tariffs, receivables, debt service, and
              equity commitments together, Greenko remains financeable on sponsor and asset-scale credibility, but not
              yet transparent enough for high-conviction underwriting on public evidence alone.
            claimRefs:
              - CI009
              - CI012
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Execution slippage is still the central financial risk
            body: >-
              The underwriting hinge is not whether storage demand exists, but whether Greenko commissions delayed
              assets on time, converts interim merchant sales into durable contracts, and refinances maturities without
              eroding economics.
            calloutType: risk
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI011
          - type: callout
            title: Public evidence is stronger on leverage than on revenue quality
            body: >-
              Fitch, EMIS, and sector handbooks provide enough to frame capex, liquidity, and market context, but not
              enough to verify realized tariffs, counterparty concentration, receivables ageing, or a fully consolidated
              cash-generation bridge.
            calloutType: insight
            claimRefs:
              - CI006
              - CI009
              - CI012
              - CI013
