  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Greenko's near-term bridge runs from operating renewable assets and delayed storage capacity into a mix of
      contracted and market-linked monetization, then into EBITDA and refinancing.
    data:
      nodes:
        - label: Operating renewable base
          value: 5.5
          unit: GW
          summary: Fitch's operating capacity base across wind, solar, hydro, and other assets.
          note: Existing generation anchors revenue but does not disclose realized tariff quality.
        - label: Storage platform under ramp
          value: 1.68
          unit: GW PSP
          summary: Pinnapuram's first PSP tranche is central to the storage-led model.
          note: Contract start slipped with transmission-line delays.
        - label: Long-term buyer contracts
          summary: Long-term power storage contracts should improve cash-flow predictability.
          note: Public sources do not disclose buyer mix, tenor, or payment formulas.
        - label: Short-term bilateral and exchanges
          value: 1.2
          unit: GW
          summary: Balance storage capacity is being sold through short-term bilateral contracts and exchanges.
          note: This provides bridge monetization but adds market exposure.
        - label: EBITDA generation
          summary: Fitch forecasts 0.9x EBITDA interest cover in FY26 and 1.4x in FY27.
          note: Improvement depends on commissioning and restored output.
        - label: Debt service and refinance
          summary: Fitch cites USD859m cash versus USD1.3bn current maturities at FY25 year-end.
          note: Sponsor support and timely refinancing remain necessary.
      edges:
        - from: Operating renewable base
          to: EBITDA generation
          label: Existing asset cash flow
        - from: Storage platform under ramp
          to: Long-term buyer contracts
          label: Commission on time
        - from: Storage platform under ramp
          to: Short-term bilateral and exchanges
          label: Sell interim capacity
        - from: Long-term buyer contracts
          to: EBITDA generation
          label: Higher-quality contracted revenue
        - from: Short-term bilateral and exchanges
          to: EBITDA generation
          label: Market-linked bridge revenue
        - from: EBITDA generation
          to: Debt service and refinance
          label: Coverage plus refinancing access
    approximationNotes: >-
      Figure shows commercial logic and disclosed scale markers, not a quantified profit bridge; public sources do not
      disclose realized storage pricing or gross-margin conversion.
    claimRefs:
      - CI005
      - CI007
      - CI010
      - CI011
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Greenko's product stack layers variable generation, evacuation, pumped storage, and industrial-load applications.
    data:
      layers:
        - label: Renewable generation
          detail: Multi-state solar, wind, and hydropower portfolio that creates the primary clean-energy input.
          modules:
            - label: Solar assets
            - label: Wind assets
            - label: Hydropower assets
        - label: Grid and evacuation
          detail: High-voltage transmission lines and substations that move output into the national grid.
          modules:
            - label: HV transmission lines
            - label: Substations
        - label: Storage and flexibility
          detail: Closed-loop pumped storage converts intermittent output into peak-hour and multi-hour supply.
          modules:
            - label: Pinnapuram PSP
            - label: Multi-state PSP pipeline
        - label: Digital orchestration
          detail: Forecasting, analytics, digital control systems, and the storage-cloud concept coordinate the portfolio.
          outputs:
            - label: Dispatch planning
            - label: Asset coordination
        - label: Industrial and export applications
          detail: Storage-backed power is routed into green-molecule and 24/7 industrial-load use cases.
          outputs:
