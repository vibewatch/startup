      - number: '1.1'
        title: Identity, footprint, and present scale
        blocks:
          - type: paragraph
            body: >-
              The assigned pool supports Greenko's operating identity much better than its corporate-profile metadata.
              Power Line describes the company as established in 2004 and operating about 9.4 GW of renewable capacity
              spread across more than 130 projects in over a dozen Indian states, with solar, wind, and hydropower all
              contributing to the mix. That scale matters because the broader Indian market is still expanding rapidly:
              CEEW and JMK both describe record FY2026 renewable additions, which frames Greenko as a late-buildout
              platform operating in a still-growing sector rather than a legacy asset owner. What the current pool does
              not establish is the formal company stage, headquarters, or a current public valuation.
