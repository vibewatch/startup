              - CE008
              - CE009
      - number: '5.3'
        title: Deployment maturity and adjacent product lines
        blocks:
          - type: paragraph
            body: >-
              Greenko appears most mature where it can extend the storage platform into adjacent industrial products.
              Power Line says the company is developing additional integrated renewable energy storage projects in
              Karnataka and Madhya Pradesh, and cites a Central Electricity Authority roadmap showing 3,520 MW of
              pumped-storage capacity under construction plus 11,620 MW under survey and investigation. The same article
              connects that backbone to AM Green's Kakinada green-ammonia complex, where wind, solar, and pumped-storage
              assets are expected to supply round-the-clock carbon-free power. This suggests the most differentiated SKU
              is not a standalone asset but a bundled clean-power-and-flexibility platform for industrial
              decarbonization.
            claimRefs:
              - CE006
              - CE007
              - CE010
      - number: '5.4'
        title: Product risks and control gaps
        blocks:
          - type: paragraph
            body: >-
              The technical upside is clear, but the public diligence package is still incomplete. Octus says Moody's
              expected Greenko's financial metrics to remain negative through March 2026 and specifically highlighted
              timing and scale uncertainty around the Andhra pumped-hydro project and Teesta III. That makes roadmap
              execution, commissioning discipline, and refinancing capacity part of the product risk, not just the
              finance risk. The assigned evidence pool also lacks official public status pages, certification
              disclosures, API or integration documentation, and quantified uptime or round-trip-efficiency disclosures.
              As a result, safety, security, and operational-control claims remain materially under-documented for
              outside investors.
            claimRefs:
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Storage-backed delivery is the real product
            body: >-
              The strongest public differentiation is Greenko's attempt to bundle generation, evacuation, and pumped
              storage into a controllable round-the-clock clean-power platform for grids and industrial users.
            calloutType: strength
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE009
          - type: callout
            title: Execution risk is concentrated in capex-heavy storage assets
            body: >-
              Public reporting ties the revenue ramp to a small set of very large projects, so commissioning delays or
              refinancing stress at Andhra pumped hydro or adjacent assets can impair both growth and perceived product
              maturity.
            calloutType: risk
            claimRefs:
              - CE010
