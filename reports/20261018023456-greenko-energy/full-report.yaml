        title: Ownership signals, leadership coverage, and disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              The same pool is materially weaker on leadership, governance, and financing transparency than on project
              milestones. The clearest ownership event is AM Green BV's July 2025 purchase of a 17.5 per cent stake from
              ORIX, taking its total Greenko stake to 25 per cent, but the retained evidence does not surface a current
              board roster, founder biographies, headquarters, debt stack, or public revenue and headcount disclosures.
              Several profile-oriented links were retained for refresh evidence, yet Bloomberg, FT, and Mint did not
              preserve the intended Greenko-specific profile or leverage text in the fetched outputs. That makes this
              chapter usable as a ground-truth operating snapshot, but not yet as a fully refreshed governance or
