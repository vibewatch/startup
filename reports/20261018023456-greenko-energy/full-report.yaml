  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a hybrid revenue model rather than a simple contracted renewable utility
              profile. Fitch says Greenko's operating base remains wind, solar, and hydro, while its near-term
              monetization increasingly depends on pumped-storage capacity and storage-linked contracts. The clearest
              disclosed bridge is that delayed long-term storage contracts have forced Greenko to sell 1.2 GW of balance
              storage capacity through short-term bilateral deals and power exchanges, which introduces merchant
              exposure during commissioning slippage. PowerLine's description of Pinnapuram and Greenko's broader
              storage platform supports the strategic logic of this model, but public sources stop short of showing
              realized tariffs, contract tenors, channel mix, or customer concentration. Market handbooks and sector
              research confirm strong Indian storage demand, yet those are demand-side comparables, not proof that
              Greenko already converts its storage footprint into high-quality contracted revenue.
            claimRefs:
              - CI007
              - CI009
              - CI010
              - CI011
              - CI012
