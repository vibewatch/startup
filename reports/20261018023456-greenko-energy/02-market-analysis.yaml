          claimRefs: [CM003]
        - label: FY26 wind additions
          value: 6.0
          unit: GW
          note: JMK FY26 wind additions.
          claimRefs: [CM003]
        - label: Greenko PSP under construction
          value: 3.52
          unit: GW
          note: Gandhi Sagar plus Saundatti, per Power Line citing the CEA PSP roadmap.
          claimRefs: [CM008]
    approximationNotes: >
      Ordered broad-to-narrow on a shared GW basis; the layers are separate sizing
      lenses rather than a literal revenue TAM-to-SAM-to-SOM funnel.
    claimRefs: [CM002, CM003, CM004, CM006, CM008]
callouts:
  - calloutType: risk
    title: Market demand is growing faster than financing clarity
    body: >
      India's renewable and storage procurement signals are strong, but Greenko's
      leverage, refinancing needs, and inconsistent public capacity disclosures limit
      confidence in any precise share-of-market or commissioning-speed assumption.
    claimRefs: [CM012, CM013, CM014, CM015]
