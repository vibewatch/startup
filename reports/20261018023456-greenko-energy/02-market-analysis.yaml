    title: Market sizing lens
    type: pyramid
    summary: >
      A broad-to-narrow GW stack shows Greenko's target market is a subset of India's
      larger renewable buildout rather than a standalone, precisely disclosed TAM.
    data:
      nodes:
        - label: India installed power base
          value: 533
          unit: GW
          note: FY26 installed power capacity, per CEEW-GFC.
          claimRefs: [CM002]
        - label: India installed renewable base
