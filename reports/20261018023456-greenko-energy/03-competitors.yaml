      - Limitation / caveat
    rows:
      - [Greenko, Integrated renewable + storage platform, "9.4 GW operating portfolio; pumped-storage pipeline also disclosed", Industrial buyers needing firm clean power and decarbonization projects, Pumped hydro plus storage-backed industrial packaging, Realized pricing and customer concentration not public]
      - [Adani Green Energy, Scaled incumbent renewable IPP, "19.3 GW operating portfolio after adding 5,051 MW in FY26", Utility-scale renewable buyers and grid-scale storage use cases, Largest cited operating base plus Khavda BESS buildout, Price realization and contract structure not disclosed]
      - [ReNew, Large incumbent renewable IPP, ">2 GW added in FY26", Utility-scale renewable offtake, Current capacity additions show continued scale competition, Storage breadth not evidenced in this pool]
      - [Tata Power Renewables, Incumbent utility-backed renewable platform, "1.88 GW added in 9MFY26; 6.3 GW base cited for Jan 2025", Third-party clients and in-house renewable buildout, Utility parent and continued expansion plan, Customer-level product comparison unavailable]
      - [Azure Power, Utility-scale renewable IPP peer, "Included in Tracxn's top-10 list; current scale not established by the pool", Utility-scale renewable customers, Recognized direct peer in ranked list, Assigned pool does not evidence current storage packaging]
      - [ACME Group, Solar developer / adjacent peer, "Included in Tracxn's top-10 list; current scale not established by the pool", Solar and renewable project customers, Relevant adjacent developer in ranked list, Assigned pool does not evidence current storage or 24/7 offer]
    notes: Public evidence mixes platform scale, annual additions, and funding rounds; unsupported current product or pricing fields are left explicit rather than inferred.
    claimRefs: [CP001, CP003, CP005, CP007, CP009, CP010]
  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - Greenko
      - Adani Green
      - Azure Power
      - ACME Group
      - Competitive implication
    rows:
      - [Long-duration storage integration, "Yes: pumped storage plus >11,000 MWh at Pinnapuram", "Partial: 1,376 MWh BESS at Khavda", Unknown, Unknown, Greenko's lead is clearest where multi-hour flexibility matters]
      - [Industrial 24/7 / offtake packaging, "Yes: Serentica 25-year storage-capacity offtake", Unknown, Unknown, Unknown, Greenko has the strongest public industrial-package proof in this pool]
      - [Diversified generation mix, "Solar + wind + hydropower across >130 projects", "Solar + wind + hybrid additions cited", Unknown, Unknown, Greenko and Adani look broader than the smaller peer snapshots available here]
      - [Green molecules / decarbonization adjacency, "Yes: AM Green and storage-backed industrial hub strategy", Unknown, Unknown, Unknown, Adjacency may widen wallet share if execution holds]
    notes: This matrix records only what the assigned prefetched pool evidences; unknown cells are preserved instead of filled with assumed market knowledge.
    claimRefs: [CP001, CP002, CP004, CP008, CP019]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Company or benchmark
      - Observable package
      - Public price signal
      - What remains undisclosed
      - Implication
    rows:
      - [Greenko / Serentica, "25-year standalone energy-storage capacity offtake using 1,500 MWhr cumulative capacity", "No public tariff disclosed", "Delivered price, availability terms, indexation, and discounting", Product packaging is visible but monetization is not]
      - [Adani Green / Khavda, "Scaled renewable buildout plus 1,376 MWh BESS deployment", "No public tariff disclosed", Contract economics and storage monetization pathway, Scale alone does not prove superior pricing]
      - [APTRANSCO FY26 BESS tender, "Two-hour BESS benchmark in Andhra Pradesh", "INR 1.23/unit record-low tariff", Tender assumptions and comparability to corporate offtake structures, Storage competition is tightening around public benchmarks]
      - [Peer-set read-through, "Public coverage centers on capacity, funding, and project announcements", "Only benchmark pricing is visible", "Realized peer-by-peer delivered cost, churn, and margin data", Price moat remains an open diligence item]
    notes: This is a partial pricing table because the assigned pool exposes benchmark tariffs and contract form, but not realized peer pricing or contract economics.
    claimRefs: [CP004, CP012, CP018]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: Evidence-backed ordinal positioning shows Greenko strongest on storage integration, while Adani is the largest scaled incumbent and the rest of the peer set is less evidenced on integrated flexibility in this pool.
    data:
      xAxis:
        label: Relative platform scale (1=smaller cited peer, 5=largest cited peer)
        min: 1
        max: 5
      yAxis:
        label: Storage + solution integration breadth (1=narrower generation focus, 5=integrated storage-backed platform)
        min: 1
        max: 5
      points:
        - label: Greenko
          x: 4
          y: 5
          detail: "9.4 GW renewable base, pumped hydro, industrial offtake proof, and green-molecule adjacency."
        - label: Adani Green
          x: 5
          y: 4
          detail: "19.3 GW operating portfolio and 1,376 MWh BESS show scale plus growing storage depth."
        - label: ReNew
          x: 3.5
          y: 2.5
          detail: ">2 GW added in FY26, but the assigned pool does not evidence equivalent storage-backed product packaging."
        - label: Tata Power Renewables
          x: 3
          y: 2.5
          detail: "1.88 GW added in 9MFY26 and a 6.3 GW renewable base, with limited integration detail in this pool."
        - label: Azure Power
          x: 2.5
          y: 2
          detail: "Recognized direct IPP peer in Tracxn's ranking, but current storage and industrial-package detail is not surfaced here."
        - label: ACME Group
          x: 2.5
          y: 2
          detail: "Adjacent solar developer peer in Tracxn's ranking, with limited public evidence here on storage breadth."
    approximationNotes: Ordinal 1-5 coordinates synthesize source-backed scale and integration evidence; they are comparative scoring aids, not audited market-share or feature-count measurements.
    claimRefs: [CP001, CP002, CP003, CP004, CP007, CP008, CP009, CP010, CP019]
