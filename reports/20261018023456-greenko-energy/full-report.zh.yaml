      - number: '4.2'
        title: 成本结构与资本开支负担
        blocks:
          - type: paragraph
            body: >-
              最明显的财务事实是资本密集度。Fitch 预计 FY26 和 FY27 年均资本开支约为 USD 1.2 billion，主要用于中央邦和卡纳塔克邦的抽水蓄能建设；Teesta
              修复和输电延迟已经削弱预测现金流。EMIS 的子公司级快照还显示，资产负债表扩张速度仍高于成熟收益型平台：2025 年总资产增长 55.84%，债务权益比仍处于高位。这些迹象说明 Greenko
              仍处于建设和投产阶段，执行时点、输电准备度和融资渠道与名义资产规模同样重要。公开披露也没有足够细节拆分服务交付成本、按资产类别划分的 O&M、应收账款拖累，或不同交易对手吸收的营运资金。
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI006
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI003
