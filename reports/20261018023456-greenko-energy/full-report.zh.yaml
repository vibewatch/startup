        title: 展示项
        blocks:
          - type: callout
            title: 规模如今取决于储能经济性，而不只是已安装兆瓦数
            body: 本章最强的证据不是又一份泛泛的可再生能源产能清单，而是一种由储能支撑的运营模式：在弃电、储能招标和电网整合日益成为关键约束的市场中，通过可靠性和下游绿色分子实现变现。
            calloutType: insight
            claimRefs:
