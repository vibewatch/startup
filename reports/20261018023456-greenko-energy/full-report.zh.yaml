        title: 展示项
        blocks:
          - type: callout
            title: 市场需求增长快于融资透明度
            body: |
              印度可再生能源和储能采购信号强劲，但 Greenko 的杠杆、再融资需求和不一致的公开产能披露，削弱了对精确市场份额或投产速度假设的信心。
            calloutType: risk
