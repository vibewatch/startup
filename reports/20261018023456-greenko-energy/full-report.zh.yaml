  - id: TV003
    title: 乐观情景 / 基准情景 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观情景
        - 储能支撑项目按期投运，市场继续为规模化清洁电力平台支付较高的远期估值倍数。
        - 只有尽调同时确认融资清晰、合同质量可靠，当前上市同业区间的上端才站得住。
        - 执行延期或再融资阻力仍可能打断估值重估。
        - 储能里程碑按期完成，融资透明度好于预期。
      - - 基准
        - 战略仍有差异化，但 Greenko 自身的价格发现仍不完整。
        - 将 Adani Green 和 NTPC Green 作为上限参考，要求协商折价或按里程碑入场，而不是与同业完全平价。
        - 间接证据可能高估投资者愿意为 Greenko 自身资本结构支付的价格。
        - 债务和项目节奏部分透明，但没有直接的融资轮价格更新。
      - - 悲观情景
        - 在 Greenko 的下一个价格标记得到独立更新前，输电或融资瓶颈削弱信心。
        - 在不利执行信号消除前，估值保持低于上市同业筛选结果，或完全不进行定价。
        - 储能变现得到证明前，倍数可能先行压缩。
        - 延误或更严格的融资条款将确认下行情景。
    notes: 由于指定资料池未提供更新后的 Greenko 估值锚点，情景区间以相对同业区间纪律表达。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
      - CV012
      - CV013
