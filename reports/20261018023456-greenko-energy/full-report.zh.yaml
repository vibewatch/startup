              - CI005
              - CI006
      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Greenko 的资本充足性更多是融资故事，而不是自我造血故事。Fitch 报告称，FY25 公司有 USD 859 million 可随时动用的现金，对应 USD 1.3 billion
              的流动到期债务，其中包括 2026 年 3 月到期的 USD 826 million 票据；由于资本开支和投资超过内部现金生成，Fitch 仍预计中期自由现金流为负。评级机构还把 Greenko 的融资渠道直接与
              GIC 的影响力联系起来，并称股东支持可覆盖在建抽水蓄能成本的
              25%。因此，去杠杆取决于三个相互关联的事件：及时再融资、及时投产，以及发起人支持能够延续。公开证据支持的结论是：流动性尚可管理，但对执行高度敏感，而不是扩张资金已有充足保障。
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
              - CI014
      - number: '4.4'
        title: 财务判断与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              财务判断对战略匹配度给出积极方向，但投资判断仍不完整。行业证据说明了储能支撑型可再生能源平台为何会在印度变得重要，Fitch
              的案例也假设关键资产投产后会显著改善，但公开记录对收入质量的说明远少于对杠杆或资本开支的说明。当前证据池没有经审计的合并收入桥接，没有公开的实际资费相对目录价或基准价拆分，没有按 DISCOM
              或工业买方划分的应收账款账龄，也没有足够精确、能检验去杠杆路径的逐项目投产计划。刷新证据池中保留的两个综合新闻 URL
              现在只能进入通用落地页，这也说明部分二级佐证十分脆弱。在管理层提供一套把产能新增、资费、应收账款、债务偿付和股权承诺串联起来的合并模型之前，Greenko
              可以凭发起人和资产规模的可信度获得融资，但仅凭公开证据仍不够透明，无法形成高确信度的投资判断。
            claimRefs:
              - CI009
              - CI012
              - CI013
              - CI014
      - number: '4.5'
        title: 展示项
        blocks:
          - type: callout
            title: 执行延期仍是核心财务风险
            body: 投资判断的关键不在于储能需求是否存在，而在于 Greenko 能否按时让延期资产投产、把过渡期商用销售转化为持久合同，并在不损害经济性的情况下为到期债务再融资。
            calloutType: risk
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI011
          - type: callout
            title: 公开证据对杠杆的支持强于对收入质量的支持
            body: Fitch、EMIS 和行业手册足以勾勒资本开支、流动性和市场背景，但不足以核实实际资费、交易对手集中度、应收账款账龄或完整的合并现金生成桥接。
            calloutType: insight
            claimRefs:
              - CI006
