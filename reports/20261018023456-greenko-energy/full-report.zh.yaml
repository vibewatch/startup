  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 同业范围不止储能专业公司
        blocks:
          - type: paragraph
            body: >-
              当前证据池中的可用同业集合，比“其他储能玩家”更广。Tracxn 的竞争者排名将 Greenko 与 Azure Power、ACME Group、Juniper Green Energy 和 Adani
              Green Energy 并列；当前新闻证据则显示，Adani、ReNew 和 Tata Power Renewables
              等大型老牌公司仍在大规模扩张产能。因此，竞争框架并非狭义的技术比拼：采购脱碳电力的买方可以在大型可再生能源 IPP、储能支撑平台，以及暂时推迟定制化 24/7
              方案、直到资费或可靠性需求足够明确的普通可再生能源供应之间做选择。
