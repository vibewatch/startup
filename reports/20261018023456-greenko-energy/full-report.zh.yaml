  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Greenko 提供什么
        blocks:
          - type: paragraph
            body: >-
              公开描述一致将 Greenko 定位为可调度清洁电力基础设施供应商，而不是简单的商用发电商。Caproasia 称，公司在印度 20 个邦运营 11
              GW，并明确表示，平台正通过储能和数字化，把可再生能源从实时商品转变为“可调度、可控制的介质”。Power Line 2026 年 3
              月的公司档案展示了这一定位对应的产品层：可再生能源发电资产、电网送出基础设施、抽水蓄能，以及为绿色分子和工业负荷项目提供的储能支撑型供电。从客户流程看，价值主张是为无法仅靠间歇性太阳能或风能运行的电网和高耗能负荷提供稳定、无碳电力。
            claimRefs:
              - CE001
              - CE002
              - CE003
