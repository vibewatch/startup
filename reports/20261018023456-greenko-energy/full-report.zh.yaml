      - number: '5.3'
        title: 部署成熟度与相邻产品线
        blocks:
          - type: paragraph
            body: >-
              Greenko 在能够把储能平台延伸到相邻工业产品的领域看起来最成熟。Power Line 称，公司正在卡纳塔克邦和中央邦开发更多综合可再生能源储能项目，并引用中央电力管理局路线图称，3,520 MW
              抽水蓄能在建，另有 11,620 MW 处于勘测和调查阶段。同一文章把这条底座与 AM Green 的 Kakinada
              绿色氨综合体连接起来，预计风电、太阳能和抽水蓄能资产将为其提供全天候无碳电力。这说明，最具差异化的 SKU 不是单一资产，而是面向工业脱碳的一体化清洁电力与灵活性平台。
            claimRefs:
              - CE006
              - CE007
              - CE010
      - number: '5.4'
        title: 产品风险与控制缺口
        blocks:
          - type: paragraph
            body: >-
              技术上行空间清晰，但公开尽调材料仍不完整。Octus 称，Moody's 预计 Greenko 的财务指标到 2026 年 3 月仍为负，并特别指出安得拉抽水蓄能项目和 Teesta III
              的时点与规模存在不确定性。因此，路线图执行、投产纪律和再融资能力不只是财务风险，也是产品风险。当前证据池还缺少官方公开状态页、认证披露、API
              或集成文档，以及量化的正常运行时间或往返效率披露。因此，对外部投资者而言，安全性、安保和运营控制方面的主张仍缺乏充分文件支持。
            claimRefs:
              - CE013
      - number: '5.5'
        title: 展示项
        blocks:
