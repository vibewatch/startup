  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开估值框架积极，但仍是间接判断
        blocks:
          - type: paragraph
            body: >-
              公开证据仍支持 Greenko 论点的战略部分。Power Line 描述了一个由太阳能、风能和水电组成的 9.4 GW 运营资产组合，以及支撑公司“稳定电力”定位的 1,680 MW / 11,000 MWh
              Pinnapuram 储能资产，而不是简单的商品发电模式。独立市场跟踪机构还显示，FY2026 仍是印度可再生能源部署强劲的一年：太阳能新增约 44.6 GW，风能新增约 6 GW，CEEW-GFC 统计了 37
              个储能招标项目，这使储能支撑型平台的可寻址市场仍然可信。估值问题在于，当前证据池刷新出的公开价格标记来自同业，而不是 Greenko 本身：Adani Green 和 NTPC Green
              提供了高溢价的公开可比估值筛选，但无法独立证明 Greenko 当前的公允价值或融资条款。
            claimRefs:
              - CV001
