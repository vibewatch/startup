      - number: '1.3'
        title: 所有权信号、领导层覆盖与披露缺口
        blocks:
          - type: paragraph
            body: >-
              相比项目里程碑，当前证据池在领导层、治理和融资透明度上明显薄弱。最清晰的所有权事件是 AM Green BV 于 2025 年 7 月从 ORIX 手中收购 17.5% 股权，使其 Greenko 总持股升至
              25%；但保留的证据没有提供当前董事会名单、创始人简历、总部、债务结构，或公开收入和员工人数披露。若干面向公司档案的链接被保留作为刷新证据，但 Bloomberg、FT 和 Mint 抓取结果没有保留预期中的
              Greenko 专属公司档案或杠杆信息。因此，本章足以作为运营事实快照，但还不能作为完整更新后的治理或估值档案。
