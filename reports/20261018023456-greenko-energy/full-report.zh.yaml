      - number: '2.3'
        title: 买方、预算负责人和采用路径
        blocks:
          - type: paragraph
            body: >
              当前证据中最可信的买方，是需要消化波动性可再生能源供应的邦级公用事业和可再生能源采购机构，以及需要稳定无碳电力、而非仅靠间歇性证书的大型工业项目。当流程从一项签约能源需求开始——公用事业采购、储能招标或工业脱碳负荷——再把风电、太阳能和抽水蓄能整合为解决方案时，Greenko
              的战略差异化最明显。因此，采用时点取决于政策驱动的竞标、并网和输电准备度、不断下降的储能资费，以及绿色氨等大型工业项目能否从谅解备忘录走向融资建设。
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
              - CM013
      - number: '2.4'
        title: 约束、矛盾与估值相关性
        blocks:
          - type: paragraph
            body: >
              同一个按装机容量和招标指标看起来很大的市场，也呈现出明显的转化风险。CEEW 报告称，FY26 前三个季度可再生能源行业 FDI 下降 26%；ET 的专题报道称，Greenko 用 NaBFID
              融资对近期美元债券进行了再融资，而 Fitch 指出了项目延误；EMIS 显示，运营公司层面的杠杆仍然很高。公开披露对 Greenko 当前运营可再生能源规模的说法也不一致，来源分别给出 7.5 GW、约 9.4
              GW 和 10 GW。因此，任何基于市场份额、储能领导地位或投产速度的估值，都必须先统一资产口径，并更清楚地证明签约买方的经济性，才能声称不止是方向性优势。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
