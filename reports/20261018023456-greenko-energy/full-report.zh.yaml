      - number: '3.2'
        title: 差异化建立在储能整合与工业化打包之上
        blocks:
          - type: paragraph
            body: >-
              Greenko 最有来源支撑的差异化在于系统整合，而不只是已安装兆瓦数。Power Line 描述了 9.4 GW 的可再生能源基础、Pinnapuram 3.5 GW 风光 IRES 综合体，以及与 1,680
              MW 抽水蓄能和超过 11,000 MWh 储能容量相连接的方案，并提到更广泛的云储能战略。Business Standard 关于 Serentica 的报道提供了外部验证：这种架构被作为 25
              年期工业承购产品销售，而不只是商用发电。这个优势确实存在，但 Adani 在 Khavda 部署 1,376 MWh BESS，说明储能支撑的可再生能源交付已经成为竞争焦点。
