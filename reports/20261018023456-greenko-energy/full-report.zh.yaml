      - number: '8.2'
        title: 在价格支撑刷新前，建议继续以尽调结果为门槛
        blocks:
          - type: paragraph
            body: >-
              严谨的建议是，把 Greenko
              留在“继续研究”或“观察”范围内，而不是仅凭公开证据把它视为明确买入标的。上行逻辑确实存在：规模化储能支撑基础设施、利好的印度建设周期，以及仍享有高远期倍数的公开同业。限制在于，当前工作池没有刷新 Greenko
              自身的融资轮价格、资本表优先权或再融资条款；行业评论仍把输电准备度和与中国相关的供应依赖视为现实执行风险。即使原本计划采用的 FT
              不利数据点，也没有在预取结果中保留为文章专属报道，因此估值讨论的悲观情景仍只得到部分更新。这种组合意味着，应先强调价格纪律，再谈乐观情景。
            claimRefs:
              - CV006
