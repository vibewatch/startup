      - number: '5.2'
        title: 一体化储能架构
        blocks:
          - type: paragraph
            body: >-
              最清晰的架构证据来自安得拉邦的 Pinnapuram。Power Line 报告称，该项目把约 3.5 GW 风电和太阳能与 1,680 MW 闭环抽水蓄能电站结合起来，提供超过 11,000 MWh
              的储能。这很重要，因为储能区块不是附属电池，而是把可再生能源输出转移到用电高峰时段、支撑全天候供电的控制层。同一来源还将该平台与高压输电线路和变电站联系起来，说明并网和送出是产品的核心依赖。Greenko 宣布的
              GKO 3.0 和 GKO 4.0 阶段则增加了软件层：预测、分析、数字控制系统，以及用于协调跨邦抽水蓄能资产的储能云模式。
