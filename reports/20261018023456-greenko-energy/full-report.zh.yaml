      - number: '3.4'
        title: 市场拥挤和披露薄弱正在挑战护城河持久性
        blocks:
          - type: paragraph
            body: >-
              竞争威胁不在于 Greenko 缺乏规模，而在于竞争者和市场基础设施正在弥合 Greenko 用来差异化的同一可靠性缺口。CEEW 报告 FY26 有 151 GW 可再生能源在建、37 个储能招标项目；JMK
              则报告，2026 年 9 月，受输电约束和储能不足影响，仍有 118.6 GW 可再生能源产能受到弃电影响。这些数据既支持 Greenko
              偏重储能的战略，也意味着更多资本正在争夺同一问题空间。非上市公司的公开数据仍分散在不同 Greenko 法律实体之间，而指定的 FT
              抓取结果没有产出公司专属分析。因此，转换成本、多平台使用行为和净交付经济性仍是待完成的尽调事项，而非已经关闭的结论。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP017
              - CP019
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开经营进展
        blocks:
          - type: paragraph
            body: >-
              公开证据指向混合收入模式，而不是简单的签约型可再生能源公用事业模式。Fitch 称，Greenko
              的运营基础仍是风电、太阳能和水电，但近期变现越来越依赖抽水蓄能容量及储能关联合同。最清晰的披露桥接是：长期储能合同延迟，迫使 Greenko 通过短期双边交易和电力交易所出售 1.2 GW
              的剩余储能容量；项目投产延期期间，这会增加商用市场敞口。PowerLine 对 Pinnapuram 和 Greenko
              更广泛储能平台的描述，支持这一模式的战略逻辑，但公开来源没有展示实际资费、合同期限、渠道组合或客户集中度。市场手册和行业研究确认了印度储能需求强劲，但它们是需求侧可比资料，不是 Greenko
              已经把储能规模转化为高质量签约收入的证明。
            claimRefs:
              - CI007
              - CI009
              - CI010
              - CI011
              - CI012
