      - number: '3.3'
        title: 产品打包清晰可见，但实际定价未知
        blocks:
          - type: paragraph
            body: >-
              证据池足以比较合同结构，但不足以判断价格优势。Greenko 的公开证据显示，公司与工业买方签署了长期储能容量协议；CEEW 手册则以安得拉邦创纪录低位的 BESS 招标资费提供市场基准。仍缺少的信息包括
              Greenko 的实际资费、折扣、可用性承诺，以及相较大型可再生能源巨头的交付成本节省。因此，公开定价证据只能支持谨慎结论：Greenko 能证明产品打包有差异，但尚未证明存在定价护城河。
            claimRefs:
              - CP004
              - CP012
              - CP018
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
