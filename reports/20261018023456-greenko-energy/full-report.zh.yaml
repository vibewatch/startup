      - number: '1.2'
        title: 储能主导的战略与里程碑转型
        blocks:
          - type: paragraph
            body: >-
              新证据最有力地说明了 Greenko 的战略转型。Power Line 将公司描述为：以 Pinnapuram 综合可再生能源项目和更广泛的抽水蓄能项目管线为支点，从发电主导模式走向储能支撑的系统服务。文章还将
              Greenko 平台与 AM Green 的下游绿色分子目标相联系，包括氨出口和工业脱碳项目。CEEW 和 JMK 都显示，市场可再生能源新增装机正在加速，但储能和电网整合仍是核心约束；Greenko
              的论点是，只要项目按期推进，抽水蓄能和一体化供电就能把这些约束转化为优势。
