      - number: '8.3'
        title: 乐观、基准和悲观情景更取决于执行与定价证据，而不是需求
        blocks:
          - type: paragraph
            body: >-
              情景差距与终端市场需求的关系较小，更多取决于 Greenko 能否把偏重储能的战略转化为按期投产、可融资合同和可协商的进入价格。乐观情景假设储能招标增长、同业估值倍数韧性和 Greenko
              自身的抽水蓄能管线，让投资者能够为稳定清洁电力计入稀缺性价值。基准情景假设战略仍然成立，但当前公开记录只能支持同业估值区间上限，不能支持精确内在价值。悲观情景则会在项目时点延误、再融资或优先权条款比预期更苛刻，或输电和供应链瓶颈压低公开同业愿意支付的价格时出现。这些都是尽调应在任何价格判断前检验的论点失效触发器。
