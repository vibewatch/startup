            body: >-
              当前证据池对 Greenko 运营身份的支持，明显强于对其公司档案元数据的支持。Power Line 称，公司成立于 2004 年，在印度十多个邦运营约 9.4 GW 的可再生能源产能，分布于 130
              多个项目，太阳能、风能和水电共同构成其业务组合。这一规模很重要，因为印度整体市场仍在快速扩张：CEEW 和 JMK 都描述了创纪录的 FY2026 可再生能源新增装机，这说明 Greenko
