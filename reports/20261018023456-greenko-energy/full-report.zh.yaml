  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >
              Greenko
              的实际市场并不是抽象意义上的“所有清洁能源”，而是印度的电网级可再生能源发电市场，加上规模较小但战略价值更高的储能支撑型全天候无碳电力，用于服务公用事业、电网平衡招标和高耗能工业负荷。其相邻机会还包括绿色氨及其他脱碳枢纽，但前提是
              Greenko 的资产提供电力底座；下游分子收入不应计入当前核心 SAM。主要替代方案仍是没有储能的传统公用事业
              PPA、其他可再生能源平台、商用或银行融资的储能项目，以及在买方更看重供电确定性而非脱碳时的传统火电。
            claimRefs:
              - CM001
              - CM007
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
      - number: '2.2'
        title: 有证据支撑的市场规模视角
        blocks:
          - type: paragraph
            body: >
              公开证据支持一个由宽到窄的市场层级，但不足以得出精确的收入 TAM/SAM/SOM。CEEW 称，印度在 FY26 末的电力装机约为 533 GW，净增 57.5 GW；JMK 则引用 275 GW
              的可再生能源装机，以及当年创纪录的 44.6 GW 太阳能和 6 GW 风能新增装机。CEEW 还报告，FY26 约有 151 GW 可再生能源在建，并有 37
              个储能招标项目；这足以说明可寻址市场正从单纯发电扩展到灵活性采购。这为 Greenko 偏重储能的定位提供了强劲需求背景，但公开资料仍未明确 SAM 和 SOM 边界。
            claimRefs:
