          detail: Greenko 将储能支撑电力定位于工业脱碳场景。
          touchpoints:
            - 绿色氢和氨
            - 绿色铝和绿色钢
        - label: 已具名的承购证明
          detail: 已披露的最明确具名交易对手，是出口氨的买方 Uniper。
          touchpoints:
            - 每年最多 500,000 吨
            - 首批发货最早预计于 2028 年进行
        - label: 持续供电的相邻负荷
          detail: 这一判断也延伸至持续用电的数字基础设施。
          touchpoints:
            - 1 GW 高性能计算中心
            - 全天候无碳能源
        - label: 扩张循环
          detail: 扩张取决于把计划中的交易对手转化为运营合同，再证明续约或重复采购。
          touchpoints:
            - 公开资料池缺少 NRR、流失和续约数据
            - 最大客户占比未披露
    claimRefs:
      - CU001
      - CU003
      - CU005
      - CU006
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 执行和融资风险排名最高：在 Greenko 下一批资产跑通前，里程碑交付、资本支持和市场时点都很关键。
    data:
      columns:
        - label: 可能性
          note: 1-5 分，5 分表示问题已经近到足以影响投资判断假设。
        - label: 影响
          note: 1-5 分，5 分表示问题可能改变估值或阻碍核心判断落地。
        - label: 缓释措施成熟度
          note: 1-5 分，5 分表示公开可见的缓释措施已经具体可行。
      rows:
        - label: PSP 与 IRES 投运项目储备
          note: 大批在建和勘测项目还没进入变现阶段。
          values:
            - value: 4
              label: '4'
              tone: risk
              note: 多项资产仍在建设或勘测阶段。
            - value: 5
              label: '5'
              tone: risk
              note: 延误会同时打击增长时点和去杠杆可信度。
            - value: 3
              label: '3'
              tone: medium
              note: 资产组合规模有所帮助，但项目层面的缓释证据仍有限。
        - label: 发起人流动性与再融资压力
          note: 所有权信号和资本密集度让融资条款仍是关键。
          values:
            - value: 3
              label: '3'
              tone: risk
              note: 股权出售报道存在争议，因此可能性不低，但尚未证实。
            - value: 4
              label: '4'
              tone: risk
              note: 融资窗口疲弱可能压缩战略灵活性。
            - value: 3
              label: '3'
              tone: medium
              note: 主权和战略投资者构成缓释因素，但条款仍未披露。
        - label: AM Green 下游商业化
          note: 工业承购和认证让电力资产之外又多了一层执行任务。
          values:
            - value: 3
              label: '3'
              tone: risk
              note: 路径已经存在，但商业落地仍属前瞻性判断。
            - value: 4
              label: '4'
              tone: risk
              note: 延误会削弱平台模式所依托的溢价叙事。
            - value: 2
              label: '2'
              tone: medium
              note: 公开缓释措施止步于标题式协议，没有详细合同经济性。
        - label: 对政策与招标时点的依赖
          note: 可再生能源建设的经济性仍会受输电和政策期限左右。
          values:
            - value: 3
              label: '3'
              tone: warning
              note: JMK 将 FY2026 加速与具体的 ISTS 豁免期限挂钩。
            - value: 3
              label: '3'
              tone: medium
              note: 即使没有技术故障，时点敏感性也会改变经济性。
            - value: 2
              label: '2'
              tone: low
              note: 公开缓释措施大多面向全市场，而非 Greenko 特有。
        - label: 交易对手集中度可见性
          note: 资料池没有直接的应收账款或最大承购方披露。
          values:
            - value: 3
              label: '3'
              tone: warning
              note: 集中度或许可控，但公开证据没有量化这一点。
            - value: 4
              label: '4'
              tone: risk
              note: 隐性的应收账款压力可能把运营延误放大为流动性压力。
            - value: 1
              label: '1'
              tone: low
              note: 公开缓释措施较弱，因为关键数据不在指定资料池中。
        - label: 竞争性产能竞赛
          note: 同业扩张抬高了维持差异化溢价倍数的门槛。
          values:
            - value: 4
              label: '4'
              tone: medium
              note: 行业新增产能和同业投运显示市场非常活跃。
            - value: 3
              label: '3'
              tone: medium
              note: 竞争压力不容忽视，但不如自身执行风险尖锐。
            - value: 2
              label: '2'
              tone: low
              note: Greenko 的储能主导战略仍是缓释因素，但市场验证尚未完成。
    approximationNotes: 热力图评分综合了所引证据，体现方向性判断，而不是概率预测。
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR006
      - CR007
      - CR009
      - CR012
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 公开证据支持其战略质量，但缺少 Greenko 特有的价格支撑，推荐仍需通过尽调门槛。
    data:
      nodes:
        - id: scale-proof
          label: 储能支撑的规模
          value: 9.4 GW fleet plus 1,680 MW / 11,000 MWh at Pinnapuram
          detail: 相较于单纯发电同业，资产基础更具差异化。
        - id: market-tailwind
          label: 市场顺风
          value: Roughly 44.6 GW solar and about 6 GW wind added in FY2026
          detail: 印度大规模可再生能源建设仍然活跃。
        - id: peer-ceiling
          label: 公开可比估值天花板
          value: Adani and NTPC Green both screen at premium forward multiples
          detail: 可用于保持纪律，但不能自动外推估值。
        - id: price-gap
          label: 缺少直接价格标记
          value: No refreshed Greenko round price, preference stack, or debt-term disclosure in pool
          tone: risk
          detail: 直接估值支撑并不完整。
        - id: execution-risk
          label: 执行瓶颈
          value: Transmission readiness and China-linked dependence remain sector risks
          tone: risk
          detail: 强劲需求并不能消除交付风险。
        - id: recommendation
          label: 推荐
          value: Research more / monitor; require price discipline before a buy
          tone: neutral
          detail: 战略方向积极，但入场应以里程碑和估值为门槛。
    approximationNotes: 缺少 Greenko 的直接定价证据，因此这张图展示的是决策链，而不是量化估值桥。
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV009
      - CV011
      - CV012
