      - 证据
      - 哪些情况会改变判断
    rows:
      - - 正论：储能支撑的差异化
        - Greenko 将 9.4 GW 的运营中可再生能源资产与抽水蓄能主导的大型战略结合起来，比单纯建设可再生能源更难复制。
        - 披露持续的储能变现和抽水蓄能管线投运进展。
      - - 正论：市场顺风仍在
        - FY2026 印度可再生能源新增仍然强劲，且有 37 个储能招标，因此可调度清洁电力的需求仍可信。
        - 招标转化放缓或储能采购走弱的证据会削弱上行案例。
      - - 反论：公开定价支撑是间接的
        - Greenko 未出现在本资料池更新后的估值页面中，因此可比公司筛选只能作为估值护栏。
        - 更新后的 Greenko 融资轮次或融资方案将显著提高判断清晰度。
      - - 反论：执行瓶颈可能压缩估值
        - 尽管行业在增长，行业评论仍将输电准备度和对中国的关联依赖视为现实约束。
        - 关于并网接入、供应链安全和投运节奏的清晰证明可缓解这一担忧。
    notes: 每一行都是基于所引证据综合得出的判断，而不是单一已披露的管理层指标。
