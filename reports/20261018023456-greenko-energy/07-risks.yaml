company:
  name: Greenko Energy
chapter:
  number: 7
  title: Risks
  summary: >-
    The sharpest underwriteable risks in this pool are execution and financing rather than a
    confirmed live legal event: Greenko is trying to commission and integrate a very large
    pumped-storage and green-molecule pipeline while sponsor-liquidity signals and sector FDI
    softness keep capital-market dependence in view. The main unresolved downside is not that a
    specific litigation or enforcement action is proven here, but that public evidence on
    counterparty concentration, refinancing terms, and some earlier scrutiny sources did not
    refresh cleanly, so residual exposure stays material until management produces direct data.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture
    body: >-
      The highest residual risk is delivery against a multi-asset construction plan that spans
      large pumped-storage plants, integrated renewable-energy sites, and downstream green
      ammonia commitments. Power Line describes both the scale of the flagship Pinnapuram complex
      and a broader pumped-storage pipeline that still has thousands of megawatts under
      construction or investigation, while JMK and CEEW show that India's sector is still moving
      quickly enough for interconnection, procurement, and policy timing to matter. That makes
      Greenko's main risk less about whether demand for flexible clean power exists and more
      about whether the company can commission on time, keep capex disciplined, and translate
      storage-backed supply into contracted cash flows before financing windows tighten.
    claimRefs: [CR004, CR005, CR006, CR008, CR009, CR010, CR011, CR012, CR015]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: regulatory-and-project-delivery
    title: Regulatory and project-delivery risk
    body: >-
      The assigned pool does not prove a current enforcement action against Greenko, but it does
      show that a large share of the next value-creation step depends on assets and contracts
      whose timing remains externally validated only at a high level. Power Line ties Greenko's
      forward case to pumped-storage projects that are under construction or still in survey and
      investigation, plus a green-ammonia program whose first Uniper-linked shipment is only
      expected from 2028 onward. In parallel, the sector sources show a buildout wave in which
      storage, tendering, grid access, and policy deadlines affect economics, so any slippage in
      approvals, transmission readiness, or industrial-offtake readiness would hit both the
      deleveraging narrative and the premium attached to Greenko's integrated model.
    claimRefs: [CR005, CR006, CR007, CR008, CR009, CR010, CR011]
    tableRefs: [TR001]
  - id: financing-counterparties-and-kill-criteria
    title: Financing, counterparties, and kill criteria
    body: >-
      Financing and counterparty risk remain material because the public refresh evidence still
      mixes contested ownership signals, rapid competitor scaling, and incomplete recovery of some
      earlier concentration sources. Business Standard reported that GIC explored options for its
      50 per cent stake at a valuation around $10 billion, but Greenko denied that description,
      which means investors should treat ownership-liquidity narratives as unsettled rather than
      settled fact. Meanwhile, competitor buildout and softer sector FDI create a tougher backdrop
      for capital-intensive assets. The key kill criteria are straightforward: repeated delays on
      pumped storage and Kakinada milestones, weaker-than-expected sponsor support or refinancing
      transparency, and unresolved evidence on offtake concentration or receivables quality.
    claimRefs: [CR001, CR002, CR003, CR009, CR012, CR013, CR014]
    tableRefs: [TR003]
