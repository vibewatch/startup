  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Delayed commissioning or underperformance at Pinnapuram and related storage-backed assets
        - Medium
        - High
        - Medium
        - >-
            Pinnapuram's integrated solar, wind, and 1,680 MW pumped-storage design creates a
            single high-value execution cluster
        - Missing site-level commissioning cadence, capex-to-complete, and early operating metrics
      - - Multi-state pumped-storage pipeline stretches management, contractors, and transmission coordination
        - Medium
        - High
        - Medium
        - >-
            3,520 MW under construction plus 11,620 MW under survey/investigation leaves large
            room for slippage before revenue proof is visible
        - No site-by-site critical path, contractor concentration, or contingency budget disclosed here
      - - Policy-timing risk around grid access and tender economics
        - Medium
        - Medium
        - Low
        - >-
            JMK says the ISTS-waiver deadline accelerated FY2026 execution, so economics can move
            with timing rather than technology alone
        - No project-level disclosure on how much value creation depended on expiring waivers or specific tenders
    notes: >-
      Operational register emphasizes commissioning, integration, and policy-timing risk rather
      than cybersecurity, because the assigned pool did not surface a verified Greenko incident or
      security disclosure.
    claimRefs: [CR004, CR005, CR006, CR008, CR010, CR011]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / ecosystem
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Sponsor-liquidity and capital-raising support
        - GIC, ADIA, ORIX, founders, future investors
        - Equity support and valuation signaling
        - High
        - >-
            Stake-sale or new-funding discussions happen before commissioning proof lands, pushing
            valuation discovery into a weaker market window
        - High
        - Sovereign and strategic backers broaden the investor set
        - >-
            Reporting remains contested by management, so investor alignment and next-round terms
            are still not transparently anchored
      - - Industrial offtake ramp for AM Green projects
        - Uniper and future ammonia buyers
        - Demand proof for downstream green-molecule assets
        - Medium
        - >-
            Kakinada reaches technical completion later than buyer readiness, or buyer demand
            materializes slower than the project-finance case assumes
        - High
        - Long-term offtake announcement provides an anchor customer
        - >-
            Public sources here do not disclose pricing, take-or-pay depth, or fallback merchant
            pathways
      - - Sector financing and competitive execution backdrop
        - Lenders, infrastructure funds, EPC supply chain, peer developers
        - Cost of capital and resource access
        - Medium
        - >-
            Capital or contractor attention shifts toward faster-moving peers while sector FDI
            slows and execution intensity rises
        - Medium
        - Strong overall renewable buildout and storage demand support the category
        - >-
            Greenko still has to compete for capital and execution bandwidth against visibly
            scaling peers such as Adani Green
    notes: >-
      Concentration is assessed qualitatively from public evidence; the pool does not provide
      receivables ageing, customer concentration, or signed offtake economics.
    claimRefs: [CR001, CR002, CR003, CR007, CR009, CR012]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Execution and financing risks rank highest because milestone delivery, capital support, and
      market timing all matter before Greenko's next wave of assets proves out.
    data:
      columns:
        - label: Likelihood
          note: 1-5 score, where 5 means the issue is already close enough to affect underwriting assumptions.
        - label: Impact
          note: 1-5 score, where 5 means the issue could change valuation or block thesis realization.
        - label: Mitigation maturity
          note: 1-5 score, where 5 means public mitigants are already concrete and visible.
      rows:
        - label: PSP and IRES commissioning pipeline
          note: Large construction and survey backlog remains ahead of monetization.
          values:
            - value: 4
              label: "4"
              tone: risk
              note: Multiple assets are still under construction or investigation.
            - value: 5
              label: "5"
              tone: risk
              note: A delay would hit both growth timing and deleveraging credibility.
            - value: 3
              label: "3"
              tone: medium
              note: Portfolio scale helps, but site-level mitigation evidence is still limited here.
        - label: Sponsor-liquidity and refinancing overhang
          note: Ownership signals and capital intensity keep funding terms important.
          values:
            - value: 3
              label: "3"
              tone: risk
              note: The stake-sale report is contested, so likelihood is meaningful but not proven.
            - value: 4
              label: "4"
              tone: risk
              note: A weak funding window could compress strategic flexibility.
            - value: 3
              label: "3"
              tone: medium
              note: Sovereign and strategic investors are a mitigant, but terms remain undisclosed.
        - label: AM Green downstream commercialization
          note: Industrial offtake and certification create a second execution layer beyond power assets.
          values:
            - value: 3
              label: "3"
              tone: risk
              note: The pathway exists, but commercial realization is still forward-looking.
            - value: 4
              label: "4"
              tone: risk
              note: Delay would weaken the premium narrative attached to the platform model.
            - value: 2
              label: "2"
              tone: medium
              note: Public mitigants stop at headline agreements rather than detailed contract economics.
        - label: Policy and tender-timing dependence
          note: Renewable buildout economics still react to transmission and policy deadlines.
          values:
            - value: 3
              label: "3"
              tone: warning
              note: JMK tied FY2026 acceleration to a specific ISTS-waiver deadline.
            - value: 3
              label: "3"
              tone: medium
              note: Timing sensitivity can alter economics even without a technology failure.
            - value: 2
              label: "2"
              tone: low
              note: Public mitigants are mostly market-wide rather than Greenko-specific.
        - label: Counterparty concentration visibility
          note: The pool lacks direct receivables or top-offtaker disclosure.
          values:
            - value: 3
              label: "3"
              tone: warning
              note: Concentration may be manageable, but public evidence here does not quantify it.
            - value: 4
              label: "4"
              tone: risk
              note: Hidden receivables stress could magnify operational delays into liquidity pressure.
            - value: 1
              label: "1"
              tone: low
              note: Public mitigants are weak because the key data is absent from the assigned pool.
        - label: Competitive capacity race
          note: Peer scaling raises the bar for maintaining a differentiated premium multiple.
          values:
            - value: 4
              label: "4"
              tone: medium
              note: Sector additions and peer commissioning show a very active market.
            - value: 3
              label: "3"
              tone: medium
              note: Competitive pressure is meaningful, though less acute than self-execution risk.
            - value: 2
              label: "2"
              tone: low
              note: Greenko's storage-led strategy remains a mitigant, but market proof is still pending.
    approximationNotes: >-
      Heatmap scores are synthesized from the cited claims and are directional rather than a
      probabilistic forecast.
    claimRefs: [CR001, CR003, CR005, CR006, CR007, CR009, CR012]
callouts:
  - calloutType: risk
    title: Thesis-break triggers
    body: >-
      Re-underwrite if major pumped-storage CODs slip repeatedly, if Kakinada/Uniper milestones
      drift without a disclosed commercial fallback, or if sponsor-liquidity actions occur before
      operating proof narrows leverage concerns.
    claimRefs: [CR001, CR003, CR006, CR007]
  - calloutType: insight
    title: What would de-risk the case fastest
    body: >-
      A site-by-site commissioning tracker, refinancing terms, receivables ageing by key
      counterparties, and signed economics for anchor industrial offtake would convert today's
      biggest residual risks from narrative questions into measurable execution checkpoints.
    claimRefs: [CR006, CR007, CR009, CR013, CR014]
