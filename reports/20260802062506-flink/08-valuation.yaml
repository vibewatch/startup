- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Cap table / preferences / debt
    - Preference stack, covenants, maturity, dilution risk
    - Current round band could still overstate common-equity value
    - Management + counsel data room
  - - Retention by channel
    - Owned-app vs partner-acquired repeat behavior
    - Determines LTV quality and customer ownership
    - Growth / data team cohort export
  - - Company-level cash generation
    - Cash flow, burn, working capital, and inventory economics
    - Separates EBITDA rhetoric from real self-funding
    - Finance team monthly cash bridge
  - - Labor/legal exposure
    - Case inventory, reserve needs, works-council posture
    - Can hit cost, reliability, and governance quality simultaneously
    - Legal and HR diligence
  - - City / hub economics
    - Contribution margin by hub and ramp curve for new sites
    - Determines whether selective expansion deserves a better mark
    - Operations diligence
  notes: These asks are the shortest path to moving the recommendation more positive or more negative.
