- id: comparables-and-what-they-do-and-do-not-tell-you
  title: Comparables and what they do and do not tell you
  body: Public comparables can help frame the call, but none are perfect. DoorDash, Delivery Hero, and Just Eat Takeaway are relevant because they show what public markets reward or punish in local commerce and delivery, yet each is far broader than Flink in geography, demand mix, and business model. Getir matters as a negative comparable because it demonstrates how spectacular funding and market presence failed to guarantee durability. Flink’s own recent rounds are therefore still the most informative private marks, especially because they bracket the company after the category reset. The lesson from comps is not that Flink deserves DoorDash-like treatment if it survives, or Getir-like treatment if it stumbles. The lesson is that public markets and late-stage private investors alike now demand disciplined economics, not just speed, coverage, and story quality.
  claimRefs:
  - CV026
  - CV027
  - CV028
  - CV029
  - CV030
  tableRefs:
  - TV004
- id: final-diligence-asks-and-thesis-breaks
  title: Final diligence asks and thesis-breaks
  body: The remaining work is obvious and decisive. Investors need cap-table and debt clarity, cohort retention by acquisition path, proof of company-level cash generation, and concrete evidence that labor/legal risk is trending toward containment rather than periodic flare-up. A new round below the recent band, a deterioration in REWE or JET economics, or a continued stream of service-quality failures without transparent improvement would all be meaningful thesis-breaks. On the positive side, disclosed company-level profitability, better retention data, and evidence that new hubs scale without margin regression would justify a more constructive stance. Until those proofs appear, the best discipline is to resist forcing false precision. Flink has earned attention. It has not yet earned a premium multiple of trust.
  claimRefs:
