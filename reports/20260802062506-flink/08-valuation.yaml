  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - EBITDA durability holds; labor stabilizes; DE/NL density expands without burn regression
    - Supports re-rating above recent band toward premium late-stage growth mark
    - Labor, regulation, and partner economics stay contained
    - Possible but not yet well-evidenced
  - - Base
    - Business remains viable and focused; evidence gaps persist
    - Recent ~$0.9B-$1.0B band remains approximately fair
    - Upside capped by missing FCF and retention proof
    - Most supported by current public evidence
  - - Bear
    - Service, labor, or financing quality deteriorates; next round is defensive
