- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Weak next financing
    - Below current band or heavily punitive structure
    - Undermines repaired-asset thesis
    - Do not increase exposure
  - - Core-market labor/legal escalation
    - Operational disruption or repeated adverse rulings
    - Damages service reliability and cost base
    - Pause underwriting and reassess legal risk
  - - Persistent quality complaints
    - No visible improvement in delivery / billing / refund failure modes
    - Weakens retention and trust case
    - Mark down LTV assumptions
  - - Partner economics worsen
    - REWE or JET terms deteriorate materially
    - Compresses margin or CAC quality
    - Rework base case downward
  - - No path to company-level cash generation
    - Still no credible FCF proof despite further time and capital
    - Invalidates premium-price thesis
    - Maintain only watchlist posture
  notes: These are not small monitoring items; each is a candidate decision-changing event.
