- id: scenario-logic-and-price-discipline
  title: Scenario logic and price discipline
  body: 'The bull/base/bear split should be driven by evidence quality, not by enthusiasm for the category survivor narrative. In the bull case, Flink turns EBITDA-positive momentum into stable city economics, keeps baskets healthy above €45, expands selectively in core markets, and eventually earns a better financing mark. In the base case, the company remains a viable but still scrutinized operator roughly worth what informed investors recently paid. In the bear case, labor or service quality issues remain sticky, capital markets stay skeptical, and the next financing event reveals that recent stability did not translate into a better-quality asset. The most important pricing principle is simple: absent stronger proof on retention and cash flow, the current ~$0.9B-$1.0B range looks more like a ceiling for eager entry than a floor for upside.'
  claimRefs:
