- id: financial-and-model-risk
  title: Financial and model risk has improved but not disappeared
  body: The most optimistic reading of Flink is that it survived where others failed and reached EBITDA-positive conditions in core markets. The skeptical reading is that the model remains fragile even after retrenchment. TechCrunch and Prosus support recent financing continuity, but not a decisive valuation re-rating. Mordor’s estimate of a $1.24 billion German quick-commerce market caps how much room there is for easy domestic scaling, while Strategy& argues many quick-commerce players exited because the model was deeply unprofitable. Even low-reputation sources like IdeaProof point in the same general direction on unit economics. The exits of Getir and Gorillas help Flink competitively, but they also confirm how unforgiving the category has been. Financial risk is therefore lower than at peak chaos, yet still materially above what a clean software or marketplace story would imply.
  claimRefs:
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  - CR028
  - CR029
  tableRefs:
  - TR004
- id: mitigation-maturity-and-kill-triggers
  title: Mitigation maturity is limited and kill triggers are monitorable
  body: The encouraging fact is that Flink is still operating, still funded, and more focused than before. The discouraging fact is that the public evidence set does not show mature, transparent mitigation for its top risks. Labor issues are visible, but no public operating framework demonstrates they are durably contained. Service-quality failures are visible, but there is no public KPI dashboard showing recovery or improvement. Partner concentration is visible, but not the contractual protections around it. Financing risk is lower than in 2022-2023, but not gone. That means investors should think in kill criteria rather than in abstract comfort. Another weakly priced round, a meaningful legal or labor escalation in a core market, persistent complaints without visible improvement, or a deterioration in REWE or JET economics would each be serious thesis-breaking events rather than mere monitoring notes.
