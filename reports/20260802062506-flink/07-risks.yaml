- id: operational-and-quality-risk
  title: Operational and quality risk is visible in customer experience
  body: Flink’s operational risks are already visible to end users. The archived Trustpilot page is not merely negative sentiment; it is a catalog of failure modes including broken checkout, delayed deliveries, missing goods, spoiled products, poor support, and billing frustration. For a company whose promise is rapid, reliable local delivery, that matters disproportionately. When labor-intensive execution slips, it shows up immediately in broken baskets and refund disputes. Taylor Wessing’s description of independent e-bike delivery infrastructure reinforces how exposed Flink remains to field execution. The same system that creates differentiation on speed also concentrates risk into hub performance, inventory accuracy, rider availability, and customer support recovery. Operational risk here is not abstract process risk — it is the daily integrity of the service experience.
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR021
  - CR022
  tableRefs:
  - TR002
  figureRefs:
  - FR002
- id: partner-and-dependency-risk
  title: Partner and dependency risk is real on both supply and demand
  body: 'Flink’s current model depends on several external relationships that can help scale the business but also weaken control. FYB confirms the strategic REWE supply relationship and the Just Eat Takeaway partnership. Those ties may be strengths, yet they also create concentration risk: if REWE terms worsen, Flink could feel pressure in assortment and procurement economics; if Lieferando economics or ranking logic shift, Flink could feel pressure in acquisition and channel margins. Consumer app distribution also depends on Apple and Google, which is a smaller risk but still a dependency. Geographic concentration intensifies all of this because the company now relies on only two operating markets. A narrower company is easier to manage, but it is also more exposed when one critical relationship or one core jurisdiction changes its stance.'
  claimRefs:
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
