- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Labor/legal escalation
    - New core-market court or works-council dispute disrupts operations
    - Operational interruption or pattern of adverse rulings
    - Pause conviction; escalate legal diligence
  - - Service quality deterioration
    - Persistent complaint clusters on late, missing, spoiled, or nonrefunded orders
    - Visible recurrence without compensating KPI improvement
    - Assume weaker retention and higher CAC
  - - Partner concentration
    - JET/Lieferando or REWE economics visibly worsen
    - Loss of channel prominence, higher take rate, or weaker supply terms
    - Rework margin and growth assumptions
  - - Financing fragility
    - Next round priced below current band or with defensive structure
    - Down-round or highly punitive terms
    - Treat equity upside as impaired
  - - Regulatory tightening
    - Dark-store, labor, or consumer-rights rules materially harden in DE/NL
    - New operating constraints or cost burdens
    - Reassess market viability and expansion plan
  notes: These are thesis-break or decision-altering triggers rather than routine dashboard items.
