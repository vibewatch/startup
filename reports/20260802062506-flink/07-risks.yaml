callouts:
- calloutType: risk
  title: Labor is not a side risk — it is a transmission risk
  body: Because Flink’s promise depends on hub and courier execution, labor disputes do not stay in HR. They can turn into delayed orders, poor customer experience, higher cost, legal spend, and eventually weaker financing conditions.
  claimRefs:
  - CR001
  - CR003
  - CR014
  - CR030
  - CR039
- calloutType: risk
  title: Survival reduced some risk while concentrating others
  body: Exits from France and Austria and focus on Germany and the Netherlands made Flink easier to finance and manage, but they also left the business more dependent on a smaller number of markets, partners, and execution nodes.
  claimRefs:
  - CR006
  - CR016
  - CR017
  - CR023
  - CR024
  - CR040
