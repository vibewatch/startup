  - Role
  - Dependency
  - Risk
  rows:
  - - Mobile storefront (iOS / Android)
    - Demand capture, browse, checkout
    - Apple / Google app ecosystems
    - Platform-store policy or ranking dependence
  - - Address / availability logic
    - Matches user to serviceable area
    - Hub map and local catchment data
    - Coverage errors create failed expectation risk
  - - Catalog / pricing / promotions
    - Displays available local inventory
    - Inventory synchronization and merchandising tools
    - Stockout mismatch and promo-margin risk
  - - Dark-store picking operations
    - Turn ordered basket into ready parcel
    - Labor scheduling and local inventory accuracy
    - Picking bottlenecks can destroy speed promise
  - - Courier dispatch and last mile
    - Moves basket to doorstep
    - Employee rider availability and routing
    - Labor disputes or shortages hit reliability
  - - Partner interfaces (REWE / Lieferando / JET)
    - Supply support and external demand
    - Third-party commercial relationships
    - Channel or supplier dependence may compress margins
