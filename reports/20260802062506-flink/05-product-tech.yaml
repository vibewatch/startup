callouts:
- calloutType: strength
  title: The product moat is operationally real
  body: Public evidence strongly supports a real, mature grocery-delivery product built on local hubs, employee couriers, and a sizable curated assortment. The core question is not whether Flink has a product; it is whether its operational product edge remains economically durable.
  claimRefs:
  - CE001
  - CE005
  - CE009
  - CE010
  - CE011
  - CE012
- calloutType: risk
  title: Technical transparency is materially thinner than consumer polish
  body: The public surface shows an actively maintained app and clear consumer workflow, but little in the way of formal technical observability, security documentation, or public developer ecosystem. That makes the service legible as a product while leaving core technical assurances largely private.
  claimRefs:
  - CE023
  - CE024
  - CE025
  - CE026
  - CE034
  - CE035
