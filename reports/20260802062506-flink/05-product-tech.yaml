  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: routing-and-forecasting-stack
    missingEvidence: Publicly verifiable detail on routing logic, demand forecasting, stock-reconciliation systems, and pick-path optimization.
    whyItMatters: Flink’s real technology edge likely sits inside logistics orchestration rather than consumer UI, but that layer is mostly opaque from public evidence.
    diligencePath: Request system architecture, inventory-sync cadence, dispatch SLA metrics, and forecasting accuracy documentation from engineering / operations leadership.
    relatedQuestionRefs:
    - QE004
    - QE024
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: security-and-reliability-controls
    missingEvidence: Status page, security documentation, certifications, incident history, and privacy engineering controls beyond app-store labels.
    whyItMatters: Consumer convenience products still need robust reliability and data-handling controls, especially when location, payment, and behavioral data are collected.
    diligencePath: Request security overview, incident postmortems, data-retention policy, certification status, and app-store release-management process.
    relatedQuestionRefs:
    - QE013
    - QE014
    - QE015
    - QE024
    relatedTableRefs:
    - TE004
    - TE005
  - type: private-evidence-only
    severity: material
    topic: developer-signal-limit
    missingEvidence: Public repo/API/community evidence that would show engineering quality or third-party integration depth.
    whyItMatters: Weak external developer signal is not fatal for a consumer grocery product, but it reduces outside verifiability of technical maturity.
    diligencePath: Request engineering productivity metrics, deployment cadence, integration map, and examples of third-party operational tooling.
    relatedQuestionRefs:
    - QE019
    - QE020
    relatedTableRefs:
