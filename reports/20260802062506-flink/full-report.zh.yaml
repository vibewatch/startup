  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：为什么不能直接说“买”
        blocks:
          - type: paragraph
            body: >-
              公开记录支持谨慎、对价格敏感的立场，而不是自信地“买入”。Flink 确有运营进展： 近期投资人支持、EBITDA 转正表述、广泛城市触达，以及公司在即时零售崩塌后成为德国最后几个严肃幸存者之一的证据。
              但同一组记录仍留下太多未解问题，不足以支撑明显高于近期融资区间的定价。 现金流可持续性、伙伴渠道经济性、劳动稳定化、留存质量，都还缺少证据。 因此，正确建议是把 Flink
              留在可投资池里，但不要把它当成可以用溢价价格高置信度押注的标的。 这是一家公司，值得跟踪或继续研究；它的上行取决于证明幸存已经变成可持续经济性， 而不只是更窄的地理版图和新资本。
            claimRefs:
