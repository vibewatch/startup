      - number: '8.4'
        title: 可比公司能说明什么，不能说明什么
        blocks:
          - type: paragraph
            body: >-
              公开可比公司能帮助框定判断，但没有一个完全合适。DoorDash、Delivery Hero 和 Just Eat Takeaway 有参考价值，
              因为它们说明公开市场会在本地商业和配送上奖励或惩罚什么；但在地理范围、需求组合和商业模式上， 每家公司都比 Flink 宽得多。Getir 是负面可比，因为它证明了惊人的融资和市场存在感并不能保证可持续。
              因此，Flink 自己近期轮次仍是信息量最高的私人市场标尺，尤其这些轮次框住了品类重置后的公司。 可比样本给出的教训不是 Flink 活下来就应得到 DoorDash 式待遇，摔倒就应得到 Getir 式待遇。
              真正的教训是，公开市场和后期私人投资人现在同样要求经济性有纪律，而不只是速度、覆盖和故事质量。
            claimRefs:
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
          - type: table
            tableRef: TV004
            claimRefs:
              - CV019
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
      - number: '8.5'
        title: 最后的尽调问题与推翻假设的信号
        blocks:
          - type: paragraph
            body: >-
              剩下的工作很明确，也有决定性。投资人需要股权结构和债务清晰度、按获客路径拆分的队列留存、 公司层面现金生成证明，以及劳动和法律风险正走向受控而不是周期性爆发的具体证据。 新一轮融资低于近期区间、REWE 或
              JET 经济性恶化，或者服务质量失败持续出现且没有透明改善， 都会是有意义的假设破裂信号。正面看，披露公司层面盈利能力、更好的留存数据，
              以及新网点扩张不带来利润率倒退的证据，都会支持更建设性的立场。在这些证明出现之前， 最好的纪律是拒绝强行制造虚假精确。Flink 已经赢得关注，但还没有赢得信任的溢价倍数。
