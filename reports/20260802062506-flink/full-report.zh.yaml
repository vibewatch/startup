      - number: '2.3'
        title: 买方、用户与付款方细分
        blocks:
          - type: paragraph
            body: >-
              Flink 的买方和付款方通常是同一个人：家庭消费者判断时间、便利或即时需求比跑店更值钱。最强的公开买方准备度信号来自 Eurostat 和 Strategy&，而不是 Flink 本身。Eurostat
              称，2025 年 EU 互联网用户中有 78% 在线购买过商品或服务，25-34 岁和 35-44 岁贡献最多。Strategy& 补充说，18-35 岁年轻消费者为便利付费的意愿高于平均水平，自 2022
              年以来至少部分在线购物的人群明显增长，尽管 46% 仍偏好完全离线。


              这些证据指向一个以密集城市专业人士、职场父母、学生和其他时间紧张家庭为中心的市场，他们的购物模式是增量型，而不是计划型。采用路径是：需求出现，打开
              app，拼出一个小但紧急的篮子，用速度和更少摩擦证明溢价合理。预算所有者是消费者自己的杂货和便利钱包，而不是采购团队。这也意味着，Flink
              的需求可能对通胀、自有品牌降级消费和服务质量感知高度敏感。它是一个高频消费市场，不是合同锁定的 B2B 市场。
