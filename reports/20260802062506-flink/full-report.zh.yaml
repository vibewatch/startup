      - number: '7.2'
        title: 运营与质量风险已经写在客户体验里
        blocks:
          - type: paragraph
            body: >-
              Flink 的运营风险已经被终端用户看见。归档 Trustpilot 页面不只是负面情绪， 而是一份失败模式清单：结账失败、配送延迟、缺货、商品变质、客服差、账单争议。
              对一家承诺本地快速、可靠配送的公司，这些问题权重格外高。劳动密集型执行一旦滑坡， 马上会体现在购物篮出错和退款纠纷上。Taylor Wessing 对独立电动自行车配送基础设施的描述， 进一步说明 Flink
              仍高度暴露在一线执行里。同一套系统用速度做出差异化， 也把风险集中到网点表现、库存准确性、骑手供给和客服补救上。这里的运营风险不是抽象流程风险， 而是服务体验每天能否保持完整。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
