      - number: '8.2'
        title: 正反投资假设
        blocks:
          - type: paragraph
            body: >-
              正向假设很清楚：Flink 熬过了残酷的品类出清，聚焦德国和荷兰，声称 EBITDA 盈利， 也继续获得可信投资人和伙伴支持。如果公司真的在最好市场跑通了密度和客单模型，
              近期估值区间可能合理，最终甚至显得保守。反向假设同样清楚：2026 年融资后公司估值没有明显上修， 客户证明混杂，劳动和法律风险仍在，品类历史里有太多经营者短暂像是修好了， 经济性随后又塌掉。投资人不必否认
              Flink 的进展，也可以保持谨慎。 只要看到最硬的证据——可持续自由现金流、透明留存、被压住的法律风险——仍不在公开记录里，就足够了。
