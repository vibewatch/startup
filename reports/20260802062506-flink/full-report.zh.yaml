      - number: '4.4'
        title: 核心版图里的市场天花板与利润率约束
        blocks:
          - type: paragraph
            body: >-
              Flink 声明的收入雄心足够大，投资人必须把品类需求和利润质量分开看。TNW 报道了 2024 年 $600M 总收入目标；若文中引用的 20% 增长率方向正确，则 2023 年约为 $500M。Mordor
              估算，2026 年整个德国即时零售市场为 $1.24B，这意味着 Flink
              的收入故事不能被读成德国即时零售中的一个窄份额。它依赖德国加荷兰，依赖广泛线上下单行为，也依赖强篮子经济。但荷兰并不是显然容易赚钱的利润池。CBRE 和 USDA
              都把当地杂货结构描述为集中且价格敏感。Eurostat 帮助解释了线上需求为何存在，但数字化准备度本身无法抵消低利润杂货竞争。
            claimRefs:
              - CI011
              - CI012
              - CI022
              - CI023
              - CI029
              - CI030
      - number: '4.5'
        title: 熊市论点为何仍然成立
        blocks:
          - type: paragraph
            body: >-
              即使 Flink 当前动能看起来更好，品类运营历史仍然逆风，因此熊市论点还活着。Strategy& 称，许多即时零售玩家退出，是因为模式高度不盈利。CNBC、Reuters 和 K5 通过 Getir
              撤退和德国整合记录了行业洗牌的剧烈程度。Le Figaro 又补上公司层面的证据：法国业务在清算前仍产生 €37.5M 收入，但需求没有压过通胀、监管和投资人疲劳。IdeaProof
              的单单亏损估算可信度较低，但指向同一方向。Fairwork 2025 年批评引入了另一个财务角度：即使运营指标改善，劳工条件也可能变成利润率或合规问题。因此，最怀疑的读法不是 Flink
              现在正在失败；而是公开证据仍未证明公司拥有耐久的自我造血经济性。
            claimRefs:
              - CI018
              - CI019
              - CI024
              - CI025
              - CI031
              - CI032
