              - CI037
      - number: '4.6'
        title: 剩余尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              公开记录足以勾勒一个转身叙事，但不足以承销下一轮融资或退出。本次审阅没有任何来源披露公司层面自由现金流，也没有来源提供 2024 年 9
              月债务部分的债务契约、到期日或摊销安排。公开来源也没有按订单来源、地域或客户队列拆分收入质量。这使“核心市场 EBITDA
              盈利”和“能自我供血、并可按溢价融资”之间仍有实质缺口。下一个验证性里程碑，应是公司层面盈利能力的硬披露，或一笔定价明显高于 2024-2026 年区间的融资事件。在此之前，Flink
              的财务论点有希望，但风险尚未充分出清。
