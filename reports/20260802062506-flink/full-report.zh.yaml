      - number: '1.4'
        title: 规模、合作伙伴与里程碑记录
        blocks:
          - type: paragraph
            body: >-
              虽然早期每轮条款并非都能独立备案核验，但公开里程碑轨迹相对清楚。Wikipedia、Northzone 和 IdeaProof 都把 Flink 创立时间放在 2020 年末；Taylor Wessing 和
              TechCrunch 显示，2024 年 9 月公司拥有 146-148 个前置仓、80 多座城市和 8,900 名员工；2026 年 3 月 Prosus 支持的材料显示，版图升至约 160 个前置仓、覆盖
              22.5M 人、员工超过 10,000 人。2024 年 9 月的法律和媒体报道还提到，公司计划在随后一年新增 30 个地点，因此 2026 年规模数据更像谨慎扩张，而不是回到补贴驱动的圈地。


              合作伙伴是 Flink 现在扩规模的核心。Taylor Wessing 和 FYB 都称 REWE 自 2021 年起就是商品采购和物流合作伙伴；TechCrunch 则把 Just Eat Takeaway
              描述为与 2024 年再融资绑定的优先分销伙伴。与此同时，K5、CNBC、Reuters 和 Mordor Intelligence 都描述了 Getir 与 Gorillas
              撤出后，德国竞争格局明显整合。关键在于，Flink 当前规模不只是一个绝对数字；它是在许多垂直同行关闭、或撤离德国及周边市场后留下来的规模位置。
