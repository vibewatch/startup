        title: 法律与监管风险仍是核心问题，不是边缘变量
        blocks:
          - type: paragraph
            body: >-
              法律和监管风险对 Flink 投资命题异常核心，因为它们直接打到服务模式，而不只是外围行政成本。 Eurofound 记录了 Freiburg 工人集体、2023 年 10 月职工委员会投票、同期关闭当地运营，
              以及 2024 年 3 月工人以集体解雇为由败诉。Fairwork 2025 年材料又独立批评其公平条件和公平代表。 法国给出更刺眼的警示：Le Figaro 称 Flink
              当地业务在通胀、监管压力和投资人兴趣消退下失败。 合在一起，这些来源说明，劳动法、平台用工政治、市政或监管对模式的态度，都可能实质性改变结果。 这不是法律摩擦安静待在后台、增长照常复利的品类。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
