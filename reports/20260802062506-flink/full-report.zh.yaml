  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 资本历史与估值重置的含义
        blocks:
          - type: paragraph
            body: >-
              Flink 的公开融资历史支持一个简单结论：公司仍能拿到资本，但不再是 2021-2022 年繁荣期的亢奋条款。Tracxn 显示，八轮融资合计 $1.43B；Clay 聚合口径在计入 2024
              年债务部分后，把已披露总资本推到 $1.5B 以上。可是 TechCrunch 和 TNW 将 2024 年 9 月融资估值放在略低于 $1B，Clay 记录 2026 年 3 月约 $900M。对比 Clay
              报告的 2022 年约 $5B 峰值，这是一次严重重置。因此，投资人似乎已从资助泛欧速度扩张，转向资助更窄的运营修复和选择性增长论点。资本仍然可得，但资本价格和拿到资本所需故事都明显变了。
