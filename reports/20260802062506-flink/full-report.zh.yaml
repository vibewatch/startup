      - number: '5.3'
        title: 相比其他杂货模式的差异化
        blocks:
          - type: paragraph
            body: >-
              与邻近杂货模式对比后，Flink 的产品站位更清楚。Knuspr 和 Rohlik 公开强调更宽的 SKU 和周度家庭杂货任务。Picnic
              把自己定位成车轮上的超市，意味着基于路线的重复购物，而不是超快临时补货配送。DashMart 则展示了大型 app 如何用自有库存和宽需求漏斗追逐同一类便利消费时刻。因此，Flink
              并不是试图在每个竞争对手的同一轴线上取胜。客户想要即时性、精选的本地宽度，以及一种更像快速邻里延伸、而不是每周一次超市替代的服务时，它最强。这是一种差异化产品选择，但也意味着产品高度依赖本地运营卓越，而不是软件式锁定。
