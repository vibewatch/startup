      - number: '2.2'
        title: 德国和荷兰的市场规模视角
        blocks:
          - type: paragraph
            body: >-
              德国给出了最干净的公开规模信号，因为 Mordor Intelligence 发布了专门的即时零售预测：2025 年 $1.15B，2026 年 $1.24B，2031 年达到 $1.85B，对应 8.22%
              CAGR。在该市场内，Grocery and Staples 占 2025 年支出的 52.61%，11-30 分钟服务层占 54.45% 份额。这些数字比宽泛的“食品电商”统计更贴合 Flink 现在围绕 30
              分钟配送和杂货型临时补货篮子的定位。


              荷兰需要另一个视角，因为公开数据更常以线上杂货渗透率呈现，而不是纯即时零售。CBRE 估算，2022 年线上杂货市场份额约 7%，并给出 2027 年 9% 到 23% 的情景。USDA
              另行将更宽的荷兰零售食品行业估值为 2024 年 $58B，同时仍指出线上购物和速度配送服务规模很小。Prosus 和 Tech Funding News 再给出跨市场渗透率基准：德国约 3.5%，荷兰
              6.0%，英国约 14%。正确推论不是 Flink 的 TAM 等于全部杂货支出；而是 Flink 两个核心市场渗透率仍低，一个守住密度纪律的运营商仍能在相对早期的采用曲线里继续拿份额。
