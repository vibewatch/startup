      - number: '2.5'
        title: 采用约束与限制市场获取的因素
        blocks:
          - type: paragraph
            body: >-
              支持市场论点的同一批来源，也说明它为何脆弱。Strategy& 明确指出，许多即时零售玩家退出，是因为如果没有转身，模式高度不盈利。CBRE 显示，荷兰线上超市渠道仍在亏损，并称 Picnic 2022
              年亏损几乎翻倍。USDA 强调了通胀期不利于高溢价配送的行为：荷兰消费者会跑多家超市，并转向自有品牌，说明他们在比价，而不是默认选择便利。实体超市销售也继续增长，因此线上杂货尚未“赢下”消费者。


              Flink 还面对结构性信息缺口。本次评估没有任何公开来源拆出城市级份额、订单密度，或分市场 CAC/payback，这意味着公开市场叙事更多是可信的行业逻辑，而不是硬核承销数据。Fairwork 2025
              年德国发现还补上了平台配送业务无法忽视的劳工监管背景。因此最大的市场风险不是品类消失；而是品类增长，但速度低于资本强度、劳工复杂度或在位者竞争压力对有吸引力私募回报的要求。
