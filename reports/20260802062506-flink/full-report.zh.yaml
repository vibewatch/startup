              app 页面只见到 JS-only 形态，也没有找到公开状态页、认证页或正式安全文档。这意味着外部观察者可以验证消费者 app
              存在且仍在维护，但很难直接检查其可靠性、隐私工程、路径规划复杂度或合规姿态。对尽调而言，这一区分很关键：消费者端打磨公开可见；核心技术保证仍大多藏在幕后。
