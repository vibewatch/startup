      - - 投资逻辑：核心市场幸存者，EBITDA 转正势头明确
        - 公司层面持续创造现金的硬证据，会强化该判断
      - - 投资逻辑：合作伙伴网络和仓点密度有战略价值
        - 若证明合作方条款仍然有利，且仓点扩张不拖累利润率，将强化该判断
      - - 反向逻辑：尽管 2026 年有新资本进入，估值仍未重估
        - 若出现定价明显更高的新融资，或披露盈利能力，将削弱该判断
      - - 反向逻辑：劳工、服务和留存证据仍弱
        - 法律风险受控、复购队列透明，会削弱该判断
    notes: 正确估值判断不取决于品类热度，而取决于这张表哪一侧先拿到更强证据。
    claimRefs:
      - CV005
      - CV006
      - CV022
      - CV023
      - CV024
      - CV036
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - EBITDA 韧性守住；劳工稳定；DE/NL 密度扩张且烧钱强度不反弹
        - 支撑估值突破近期区间，向优质后期成长资产定价靠拢
        - 劳工、监管和合作方经济性保持可控
        - 有可能，但证据还不够扎实
      - - 基准
        - 业务仍可存活且聚焦；证据缺口仍在
        - 近期 ~$0.9B-$1.0B 区间大致合理
        - 缺少自由现金流（FCF）和留存证据，上行被封顶
        - 当前公开证据最支持基准情景
      - - 悲观
        - 服务、劳工或融资质量恶化；下一轮采取防御性结构
        - 价值压到近期区间以下，股权上行明显走弱
        - 降估值融资、法律升级或投诉持续成簇
        - 结合品类历史，悲观情景始终可信
    notes: 情景估值逻辑先锚定近期私募估值标记，再看更广泛的公开可比公司情绪。
    claimRefs:
      - CV012
      - CV013
      - CV014
      - CV015
      - CV033
      - CV034
      - CV035
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Flink 2024 年融资轮
        - 私募轮估值标记
        - 略低于 $1B
        - 2026 年前最近的知情价格锚
        - 私募轮治理与优先权细节未公开
      - - Flink 2026 年融资轮
        - 私募轮估值标记
        - Clay 显示 ~$900M；报道叙事区间约 ~$1B
        - EBITDA 转正叙事后最近的价格信号
        - 没有公开的详细条款清单
      - - DoorDash
        - 公开市场本地商业平台
        - 已上市；2026 年仍有季度业绩 IR 披露
        - 显示公开市场如何给配送与本地商业规模定价
        - 规模和业务组合远比 Flink 宽
      - - Delivery Hero
        - 已上市配送老牌平台
        - 已上市；2026 年披露节奏仍活跃
        - 可用于观察公开市场对配送模式的情绪
        - 地域和垂直品类组合更宽
      - - Just Eat Takeaway
        - 已上市配送公司，也是 Flink 合作伙伴
        - 已上市；342k 合作伙伴 / 15 个国家
        - 既是可比对象，也是渠道合作方
        - 市场平台属性更重，不是狭义即时零售
      - - Getir（负面可比）
        - 曾经融资充足的历史同业
        - 已退出欧洲 / 美国
        - 说明即便拿过大额融资，仍可能走向下行路径
        - 与 Flink 当前更窄的版图不完全可比
    notes: 可比公司用于设置护栏，不意味着倍数可以一比一迁移。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-relevant current and historical valuation anchors: Flink’s own round marks, broad
        public delivery comps, and a failed negative peer.
    claimRefs:
