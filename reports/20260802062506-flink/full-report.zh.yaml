      - number: '7.4'
        title: 财务与模式风险有所改善，但没有消失
        blocks:
          - type: paragraph
            body: >-
              最乐观的解读是，Flink 在其他玩家失败的地方活了下来，并在核心市场达到 EBITDA 为正。 怀疑者的解读也很直接：收缩之后，模式仍然脆弱。TechCrunch 和 Prosus 支持近期融资连续性，
              但不能证明估值已经决定性重估。Mordor 对德国即时零售市场 $1.24B 的估算， 限制了国内轻松扩张的空间；Strategy& 则指出，许多即时零售玩家退出，是因为这个模式深度亏损。 即便
              IdeaProof 这类声誉较弱的来源，也在单位经济性上指向同一大方向。Getir 和 Gorillas 退出， 对 Flink 的竞争格局有利，但也证明这个品类一直很残酷。因此，财务风险低于最混乱时期，
              但仍明显高于一个干净的软件或平台故事应有的水平。
            claimRefs:
              - CR023
