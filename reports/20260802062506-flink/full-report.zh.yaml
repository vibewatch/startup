        title: 产品定义与任务
        blocks:
          - type: paragraph
            body: >-
              Flink 的公开产品很容易描述，在客户工作流上也出人意料地具体。iOS 和 Android
              页面都把该服务呈现为一站式线上商店：用户输入地址，浏览杂货选择，挑选商品，结账，然后在几分钟内在家收到购物篮。目录宽度足以支撑反复临时补货——公开文案里出现了新鲜农产品、饮料、厨房常备品、家居日用品和品牌基础品——但任务仍由便利驱动，而不是替代完整超市篮子。因此，产品位于经典餐饮配送
              app 和周度线上杂货商之间。它卖的不只是杂货，而是时间：快速补给、本地发现，以及带有精选但仍足量篮子的到家便利。
