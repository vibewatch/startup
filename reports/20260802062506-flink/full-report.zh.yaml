      - number: '2.4'
        title: 可能放大市场的增长驱动
        blocks:
          - type: paragraph
            body: >-
              四个驱动最突出。第一，当前渗透率低，仍有空间。Prosus 和 Tech Funding News 都强调，与英国基准相比，Flink
              核心市场线上杂货渗透率仍然很小。第二，便利付费意愿真实存在，尤其在年轻用户中：Strategy& 称，受访消费者中几乎一半在按单品计算时愿意为线上下单多付至多 5%，18-35
              岁意愿最强。第三，整合减少了非理性供给。K5、Reuters、CNBC 和 Mordor 都指向 Getir 与 Gorillas
              撤退后，德国市场结构性降拥挤，这应当改善幸存者的密度。第四，战略伙伴可以扩展可触达需求，而不必重跑 2021-2022 年的高速增长剧本。Taylor Wessing、FYB 和 TechCrunch 展示了
              REWE 和 Just Eat Takeaway 如何嵌入这套获客逻辑。


              大型在位者也仍在重塑市场。Strategy& 点名 Amazon Fresh-Rohlik 在德国的合作，把它视为线上杂货栈仍在演进而非消退的新证据。DoorDash、Just Eat Takeaway 和
              Delivery Hero 各自通过投资人材料显示，大型本地商业平台仍在投资更宽的便利层。对 Flink
              而言，增长奖品是真实的，但只有当它的城市级密度、合作伙伴经济和服务可靠性胜过分销能力更广的大平台时，才能把奖品拿到手。
