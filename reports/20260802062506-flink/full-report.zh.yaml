      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
  - id: TV005
    title: 打破投资逻辑与终止触发点表
    columns:
      - 触发点
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 下一轮融资偏弱
        - 低于当前区间，或结构惩罚性很强
        - 削弱「修复资产」投资逻辑
        - 不增加敞口
      - - 核心市场劳工 / 法律升级
        - 运营受扰，或反向裁决反复出现
        - 损害服务可靠性和成本基础
        - 暂停投资测算，重新评估法律风险
      - - 持续质量投诉
        - 配送 / 账单 / 退款失败模式没有明显改善
        - 削弱留存和信任逻辑
        - 下调客户终身价值（LTV）假设
      - - 合作方经济性恶化
        - REWE 或 JET 条款实质恶化
        - 挤压利润率，或拉低获客成本（CAC）质量
        - 下修基准情景
      - - 看不到公司层面创造现金的路径
        - 时间和资本继续投入后，仍没有可信的自由现金流（FCF）证据
        - 否定溢价定价逻辑
        - 仅保持观察名单姿态
    notes: 这些不是小型监控项；每一项都可能改变决策。
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV038
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 股权结构表 / 优先权 / 债务
        - 优先股堆叠、契约、到期日、稀释风险
        - 当前轮次区间仍可能高估普通股价值
        - 管理层 + 律师资料室
      - - 按渠道拆分留存
        - 自有 app 与合作方获客的复购行为
        - 决定客户终身价值（LTV）质量和客户归属
        - 增长 / 数据团队导出队列
      - - 公司层面现金创造
        - 现金流、烧钱速度、营运资本和库存经济性
        - 区分 EBITDA 叙事和真实自我造血
        - 财务团队月度现金桥
      - - 劳工 / 法律敞口
        - 案件清单、准备金需求、劳资委员会姿态
        - 可能同时打击成本、可靠性和治理质量
        - 法务和 HR 尽调
      - - 城市 / 仓点经济性
        - 各仓点贡献利润率和新站点爬坡曲线
        - 决定选择性扩张是否值得更高估值标记
        - 运营尽调
    notes: 这些尽调问题是把建议推向更正面或更负面的最短路径。
    claimRefs:
      - CV002
      - CV011
      - CV024
      - CV036
      - CV037
      - CV040
