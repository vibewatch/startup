      - number: '7.5'
        title: 缓释成熟度有限，否决触发信号可监控
        blocks:
          - type: paragraph
            body: >-
              正面事实是，Flink 仍在运营、仍有资金支持，也比以前更聚焦。负面事实是， 公开证据没有显示它对最重要风险已有成熟、透明的缓释机制。劳动问题可见，
              但没有公开运营框架证明风险已被长期压住。服务质量失败可见，但没有公开 KPI 看板证明恢复或改善。 伙伴集中度可见，但合同保护不可见。融资风险低于 2022-2023 年，但没有消失。
              因此，投资人应围绕否决标准思考，而不是寻找抽象安慰。再次出现定价偏弱的一轮融资、 核心市场发生重大法律或劳动升级、投诉持续且看不到改善，或者 REWE 或 JET 经济性恶化，
              都会是足以打碎投资假设的事件，而不只是监控备注。
