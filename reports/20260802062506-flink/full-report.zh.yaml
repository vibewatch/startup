companyProfile:
  summary: >-
    Flink 于 2020 年底在柏林创立，如今以 Flink SE 运营，是一家即时零售杂货公司。它不依赖第三方超市，而是从本地城市前置仓配送日常家庭用品。退出奥地利和法国后，公司公开运营版图集中在德国和荷兰。Flink
    的变现来自杂货篮子和便利性经济，背后有自有履约层、战略供应与分销合作，以及披露融资已超过 $1.5B 的后期私募资金；同时估值已从繁荣期大幅回调。
