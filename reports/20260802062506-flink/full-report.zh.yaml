  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 投资建议取决于经营进展与耐久性、价格支撑仍缺证明之间的平衡。
    data:
      nodes:
        - id: scale
          label: 真实规模和触达
          type: service
        - id: profit
          label: EBITDA 转正叙事
          type: service
        - id: risks
          label: 劳工 / 服务 / 合作伙伴风险
          type: warning
        - id: gaps
          label: 现金流 / 留存 / 治理缺口
          type: warning
        - id: price
          label: 近期 ~$0.9B-$1.0B 区间
          type: service
        - id: call
          label: 跟踪 / 继续研究
          type: target
      edges:
        - from: scale
          to: profit
          label: 支撑
        - from: profit
          to: price
          label: 可能证明合理
        - from: risks
          to: price
          label: 限制
        - from: gaps
          to: price
          label: 限制
        - from: price
          to: call
          label: 设定纪律
        - from: profit
          to: call
          label: 保持可投
    claimRefs:
      - CV001
      - CV004
      - CV022
      - CV023
      - CV024
      - CV025
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 证明质量只要小幅变化，Flink 就可能从值得跟踪变成风险暴露过高；近期定价已经假设公司取得实质进展。
    data:
      items:
        - label: 熊市情景 — 下一轮偏弱 / 法律拖累 ($B)
          value: 0.6
        - label: 基准情景 — 近期轮次区间中点 ($B)
          value: 0.95
        - label: 牛市情景 — EBITDA 持续为正 + 更强证明 ($B)
          value: 1.3
        - label: 2022 年峰值叙事 ($B)
          value: 5
        - label: 德国 2026 年 q-commerce 市场 ($B)
          value: 1.24
    approximationNotes: 熊市 / 基准 / 牛市柱状值是从公开证据和近期轮次标记推导出的情景锚点，不是正式贴现现金流输出。
    claimRefs:
      - CV004
      - CV019
      - CV020
      - CV031
      - CV033
      - CV034
      - CV035
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公开证据支持当前公允价值落在较窄区间；最终上行 / 下行空间更宽，且高度取决于缺失的尽调项目。
    data:
      items:
        - label: 当前有支撑区间
          low: 900
          high: 1000
          displayValue: $0.9B-$1.0B
          detail: 以 2024-2026 年公开轮次报道为锚。
          tone: neutral
        - label: 保守下行情景
          low: 500
          high: 700
          displayValue: $0.5B-$0.7B
          detail: 前提是劳工、留存或融资质量不及预期。
          tone: warning
        - label: 建设性上行情景
          low: 1200
          high: 1500
          displayValue: $1.2B-$1.5B
          detail: 需要证明盈利可持续，且 cohort 质量更好。
          tone: positive
        - label: 历史峰值背景
          low: 5000
          high: 5000
          displayValue: ~$5.0B
          detail: 只作为此前亢奋估值的背景，不是当前锚点。
          tone: negative
    approximationNotes: 情景区间是基于判断的投资护栏，以公开轮次标记、品类风险和缺失证明折价为锚。
    claimRefs:
      - CV004
      - CV007
      - CV015
      - CV019
      - CV020
      - CV021
      - CV033
      - CV034
      - CV035
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 公开证据对触达和存续最有支撑，对耐久性证明和治理层面的估值支撑最弱。
    data:
      items:
        - label: 市场位置
          value: Leader-ish
          subtext: Survivor in DE/NL q-commerce
          claimRefs:
            - CV005
        - label: 需求证明
          value: Strong
          subtext: 160+ hubs, 22.5M reach, visible customer use
          claimRefs:
            - CV009
        - label: 经济性证明
          value: Partial
          subtext: EBITDA-positive claims, no FCF proof
          claimRefs:
            - CV007
            - CV015
        - label: 护城河质量
          value: Moderate
          subtext: Operational density more than software lock-in
          claimRefs:
            - CV011
        - label: 风险负荷
          value: High
          subtext: Labor, service, partner, financing
          claimRefs:
            - CV003
        - label: 估值支撑
          value: Fair at best
          subtext: Recent band looks like discipline point
          claimRefs:
            - CV004
        - label: 证据质量
          value: Medium
          subtext: Coherent, still missing critical private data
          claimRefs:
            - CV002
        - label: 总体判断
          value: Track
          subtext: Do not chase current band
          claimRefs:
            - CV001
            - CV040
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV007
      - CV009
      - CV011
      - CV040
