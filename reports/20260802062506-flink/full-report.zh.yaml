      - number: '1.2'
        title: 创始人、领导层与治理透明度
        blocks:
          - type: paragraph
            body: >-
              Flink 的创始人记录在公开来源中并不完全干净，但重叠部分仍有方向性价值。Northzone 组合页面列出 Christoph Cordes、Oliver Merkel 和 Julian Dames
              这组三人，作为仍与公司有公开关联的人物；英文和德文 Wikipedia 条目则把创始团队扩展到 Saad Saeed 和 Nikolas Bullwinkel。2026 年 3 月 Prosus 新闻稿明确显示
              Julian Dames 担任 CEO，TechCrunch 在 2024 年 9 月融资轮中仍引用 Oliver Merkel
              的创始人兼董事总经理身份。合在一起，这些来源支持一个判断：即使经历多轮资本重组，Flink 仍受创始团队影响。


              治理透明度明显弱于运营规模披露。CompanyHouse 确认柏林 SE 注册仍有效，并记录 2026 年 7
              月提交过监事会名单文件，但没有直接公开完整董事会构成、独立董事，或当前创始人持股。公开来源也没有披露清算优先权结构，或后期投资人通过轮次条款掌握治理权到什么程度。对尽调而言，这意味着领导连续性能看见，但治理质量还没有像上市公司同业或后期
              VC 支持的软件公司那样被同等披露支撑。
