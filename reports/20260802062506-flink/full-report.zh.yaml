  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 德国即时零售洗牌后的竞争格局
        blocks:
          - type: paragraph
            body: >-
              德国即时零售圈地战崩塌后，Flink 的竞争问题发生了根本变化。最直接的垂直速度同行——Getir 和 Gorillas——在德国已不再像过去那样活跃，K5 也公开把 Flink
              描述为市场上几乎唯一剩下的大型垂直运营商。这不意味着竞争消失了。它意味着竞争从一群 VC 补贴的 10 分钟复制品，转向数量更少、资本更厚的线上杂货、配送平台和超市替代者。


              现在的直接竞争集合分成三类。第一类是 Picnic、Knuspr/Rohlik 等宽口径线上杂货玩家，竞争点是 SKU 宽度、质量和价格。第二类是 DoorDash、Just Eat
              Takeaway、Delivery Hero 等本地商业或配送平台在位者，它们能以巨大规模承接便利需求。第三类是实体超市和便利店这一现状。对投资人来说，关键在于 Flink
              已不需要跑赢每一个垂直速度同行；它现在需要守住一个区别于全篮子线上杂货商和大型多品类配送 app 的位置。
