      - number: '1.5'
        title: 负面事件、劳工摩擦与运营重置
        blocks:
          - type: paragraph
            body: >-
              运营重置是看 Flink 最重要的负面镜头。Le Figaro 2024 年 4 月报道，法国业务雇用 218 人，在此前重组后走向清算，原因包括通胀、监管压力，以及投资人对该品类兴趣下降。英文和德文
              Wikipedia 条目也提到，奥地利是更早退出的市场。结合 2024 年估值下调轮定价和 IdeaProof 对历史单单亏损的批评，可以看出 Flink
              并没有逃过行业根本的单位经济压力；它只是比大多数同行活得更久。


              劳工风险仍然重要。Eurofound 记录了 Freiburg 工人集体、2023 年 10 月职工委员会投票、随后的站点关闭，以及 2024 年 3 月集体解雇诉求在法院败诉。Fairwork 2025
              年德国报告并非灾难性，但结果很混合：Flink 是被评估平台中唯一拿出扣除成本后最低工资证据的平台，但 Fairwork
              仍认为，没有充分证据证明工人免受任务风险伤害，也没有集体代表证据。客户侧同样分裂。Apple app 页面显示应用商店评分强，但 Trustpilot 存档显示评论基础极度负面，集中在延误、缺货、bug
              和糟糕客服。合在一起，公司概览的结论是带伤生存：Flink 看起来是德国剩下最强的垂直即时零售运营商，但这建立在深度地理收缩、估值重置，以及未解的劳工和服务质量风险之上。
