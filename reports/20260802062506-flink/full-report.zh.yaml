      - number: '3.4'
        title: 转换成本、护城河耐久性，以及生存到底证明了什么
        blocks:
          - type: paragraph
            body: >-
              该品类的消费者转换成本很低。安装另一个 app、比价，或回到本地超市都很容易。因此 Flink
              的护城河不能只靠锁定。它必须来自更好的本地密度、更快也更可靠的履约、更聪明的选品，以及可能更好的伙伴经济。这些优势真实存在，但它们是运营优势，不是软件式锁定。Picnic 可以用价值压价。Knuspr 和
              Rohlik 可以用宽度压制。DashMart 和 Lieferando 式平台可以用分销触达压制。


              最乐观的读法是，Flink 挺过了残酷洗牌，仍在德国占据最干净的垂直即时零售位置。最怀疑的读法是，活下来不等于有耐久防御性。Strategy& 和 IdeaProof
              都提醒我们，许多品类失败根在经济性，而不只是竞争拥挤。如果更大平台能通过更宽的 app 卖出类似便利，或者更大篮子的线上杂货商能让周订单足够省心，Flink 的运营边际优势未必能转化为护城河质量的经济性。
