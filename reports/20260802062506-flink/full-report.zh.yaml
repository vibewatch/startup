chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法律形式与运营模式
        blocks:
          - type: paragraph
            body: >-
              Flink 是一家总部位于柏林的即时零售杂货公司，通过本地微型履约前置仓运营，而不是依赖第三方超市。公开法律实体信息显示，当前运营公司为 Flink SE，地址在柏林市中心 Brunnenstraße
              19-21；面向市场的表述也一致把它定义为通过密集城市网络按需配送日常杂货和必需品的公司。2026 年 Prosus 领投融资材料称，公司经过数年市场收缩后聚焦德国和荷兰，拥有 160 个前置仓、每仓约
              3,000 种商品、覆盖超过 22.5M 名消费者，员工超过 10,000 人。


              客户主张也从疫情期“十分钟增长”的叙事，转向更克制的便利性主张。Prosus 和 Tech Funding News 描述其平均客单价超过 €45、配送时间约 30 分钟；Apple 和 Google app
              页面则强调 2,300 多种商品、本地烘焙供给、厨房常备品、饮料和家居日用品。这一定位会影响后续财务分析：Flink
              实际上押注的是高频临时补货场景，而不是完整超市周采购。它的应用商店描述、合作伙伴支持的融资材料和数据服务商摘要，都把公司描绘成物流与库存运营商，而不是轻资产市场经纪商。
