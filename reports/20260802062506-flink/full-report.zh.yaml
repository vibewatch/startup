      - number: '7.3'
        title: 供给端和需求端都有真实的伙伴依赖风险
        blocks:
          - type: paragraph
            body: >-
              Flink 当前模式依赖多组外部关系，这些关系能帮业务放大，也会削弱控制力。FYB 确认了与 REWE 的战略供给关系， 以及与 Just Eat Takeaway
              的合作。这些关系可能是优势，但也带来集中风险：如果 REWE 条款转差， Flink 的品类供给和采购经济性会承压；如果 Lieferando 的经济性或排序逻辑改变， Flink
              的获客和渠道利润率会承压。消费者 App 分发还依赖 Apple 和 Google，风险较小，但仍是依赖。 地理集中度又放大了所有这些问题，因为公司现在只依赖两个运营市场。业务更窄更好管理，
              但一段关键关系或一个核心司法辖区改变态度时，暴露也更高。
