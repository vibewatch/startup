            body: 在公开国家层面盈亏平衡和 2024 年 EBITDA 盈利说法之后，又获得一轮 Prosus 领投新融资，这比普通过桥融资强得多。它说明至少部分高质量投资人相信，修复后的核心市场模式值得投入更多资本。
