      - number: '3.2'
        title: 直接同行画像：速度、宽度与价值
        blocks:
          - type: paragraph
            body: >-
              Picnic 和 Knuspr/Rohlik 是最清晰的直接线上杂货可比对象，因为它们服务相似家庭，却给出明显不同的运营承诺。Picnic
              主打低价和免费配送，背后是电动车定时配送模式，结构上更适合更大、更有计划性的篮子。Knuspr 宣传超过 19,000 种商品和三小时配送，更接近完整线上超市，而不是快速临时补货 app。Rohlik
              集团的话术也明确强化了这一区别：它聚焦的不是小篮子，而是家庭的每日和每周需求。


              Flink 站在更窄的车道里。Tech Funding News 和 app 商店页面描述的公司，围绕 3,000 种商品的本地前置仓和约 30 分钟履约展开。这意味着 Flink
              能在速度上胜过周度杂货竞争者，但可能在 SKU 深度和家庭篮子相关性上输掉。实际含义是，Flink 最好的客户是今天就要解决紧急需求的人；而如果价格、宽度和计划配送比即时性更重要，Picnic、Knuspr 和
              Rohlik 更适合赢下主要周订单。
