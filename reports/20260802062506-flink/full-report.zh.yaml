            title: 劳动不是边缘风险，而是传导风险
            body: Flink 的承诺靠网点和骑手执行兑现，劳动争议不会停留在 HR。它们会传导成订单延迟、客户体验变差、 成本上升、法律支出增加，最终削弱融资条件。
