  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: Flink 最高的剩余风险集中在劳工 / 法律、服务质量、合作伙伴集中度和融资连续性上。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重性
      rows:
        - label: 劳工 / 代表权争议
          values:
            - 高
            - 高
            - 低
            - 高
        - label: 客服 / 配送失误
          values:
            - 高
            - 高
            - 低
            - 高
        - label: REWE / JET 合作伙伴集中度
          values:
            - 中-高
            - 高
            - 低
            - 高
        - label: 融资 / 估值下调风险
          values:
            - 中
            - 高
            - 中-低
            - 中-高
        - label: 核心市场监管收紧
          values:
            - 中
            - 高
            - 低
            - 中-高
        - label: 隐私 / 数据处理审查
          values:
            - 低-中
            - 中
            - 低
            - 中
    claimRefs:
      - CR001
      - CR006
      - CR011
      - CR017
      - CR023
      - CR039
      - CR040
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 大多数重大风险不会停留成孤立问题，而是很快传导到客户信任、利润率和融资。
    data:
      nodes:
        - id: labor
          label: 劳工 / 法律争议
        - id: ops
          label: 运营故障
        - id: partner
          label: 合作伙伴集中度
        - id: reg
          label: 监管收紧
        - id: cust
          label: 客户信任 / 流失
        - id: margin
          label: 利润率压力
        - id: growth
          label: 增长 / 复购使用
        - id: fin
          label: 融资 / 估值
      edges:
        - from: labor
          to: ops
          label: 扰乱服务
        - from: ops
          to: cust
          label: 造成差体验
        - from: cust
          to: growth
          label: 削弱复购
        - from: partner
          to: margin
          label: 改变经济性
        - from: reg
          to: margin
          label: 推高成本 / 约束
        - from: growth
          to: fin
          label: 削弱叙事
        - from: margin
          to: fin
          label: 压缩估值
        - from: cust
          to: fin
          label: 损伤留存逻辑
    claimRefs:
      - CR014
      - CR018
      - CR019
      - CR028
      - CR039
