      - number: '3.3'
        title: 在位平台压力与外部渠道依赖
        blocks:
          - type: paragraph
            body: >-
              最深的竞争风险不是另一个活下来的粉色单车复制品，而是需求漏斗更大、资本更多的宽平台。DoorDash 自称领先的本地商业平台，并称业务覆盖 30 多个国家。Just Eat Takeaway 称，它连接 15
              个国家的消费者和 342,000 个合作伙伴。Delivery Hero 作为上市全球运营商，仍持续发布 2026 年交易更新。这些公司无需复制 Flink 的精确市场姿态，也能争夺同一类便利消费时刻。


              Flink 自己的分销选择让这项风险更尖锐。TechCrunch 和 FYB 将 2024 年再融资与 Just Eat Takeaway 战略关系绑定；Supermarktblog 后来报道称，Flink
              似乎切掉了 Uber Eats 和 Wolt，在外部杂货分销上更专注于 Lieferando。如果准确，这可能简化渠道重心，但也集中依赖。更大的 app 生态可以帮助 Flink 低成本触达用户；它也可以把
              Flink 降格为平台关系里又一个供给层，而最终控制关系的是平台。
