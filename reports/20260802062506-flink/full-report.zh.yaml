      - number: '8.3'
        title: 情景逻辑与价格纪律
        blocks:
          - type: paragraph
            body: >-
              乐观、基准、悲观三种情景，应由证据质量驱动，而不是被品类幸存者叙事带来的兴奋牵着走。 乐观情景下，Flink 把 EBITDA 转正势头变成稳定的城市经济性，让客单价健康地保持在 €45 以上，
              在核心市场选择性扩张，并最终获得更好的融资标记。基准情景下，公司仍是可行但继续被审视的运营商， 价值大致等于知情投资人近期支付的价格。悲观情景下，劳动或服务质量问题长期粘住，
              资本市场继续怀疑，下一次融资事件揭示近期稳定并没有转化为质量更好的资产。 最重要的定价原则很简单：在留存和现金流证明更强之前，当前 ~$0.9B-$1.0B 区间更像急着上车的天花板， 而不是上行空间的地板。
