  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与 Flink 实际销售的东西
        blocks:
          - type: paragraph
            body: >-
              Flink 的市场比“杂货”窄，又比“一个杂货 app”宽。正确边界是即时零售的临时补货任务：消费者出于紧急或便利需求，希望约 30 分钟内拿到日常商品，由本地前置仓履约，而不是跑一趟传统超市。Apple 和
              Google app 页面、Prosus 支持的融资材料，以及 Tech Funding News 都把 Flink
              描述为一个一站式数字商店，覆盖新鲜农产品、饮料、厨房常备品、家居日用品和其他紧急必需品。这种行为更接近替代便利店或超市临时补货，而不是替代一整周的家庭大采购。


              这一区分很重要，因为它改变了哪些支出应被纳入。纳入范围是城市和郊区的便利性杂货需求，时间敏感度足以支撑更贵的最后一公里履约和密集本地库存。排除范围包括大宗仓储式采购、可以等到次日配送的低频厨房常备补给，以及完全不接触杂货库存的餐饮配送。邻近替代者仍重要——本地超市、DoorDash、Just
              Eat Takeaway、Delivery Hero 和线上杂货商都在争夺同一份消费者注意力和钱包——但 Flink 直接可触达的细分市场，是更窄的前置仓、补货型杂货层。
