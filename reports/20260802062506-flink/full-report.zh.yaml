              Flink 在德国已不需要再跑赢多个重补贴的垂直即时零售对手。公开市场评论、K5、Reuters/CNBC 对 Getir 的报道，以及 Mordor 的 GMV
              移除估算，都指向一个拥挤度大幅下降的垂直即时零售市场。这不能证明模式容易，但确实提高了 Flink 把密度转化为更好单位经济、超过 2021-2022 年队列的概率。
