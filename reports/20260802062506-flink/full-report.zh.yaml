      - number: '1.3'
        title: 资本历史、估值重置与投资人基础
        blocks:
          - type: paragraph
            body: >-
              Flink 的公开融资记录显示，公司先经历了高速增长资金充裕期，再进入估值修复，随后选择性重新扩张。Clay 将累计融资标为约 $1.53B；TechCrunch 在 2024 年 9 月融资前也提到，Flink
              已融资超过 $1.5B。最近一轮披露融资是 2026 年 3 月约 $100M，由 Prosus 领投，Btomorrow Ventures 加入，现有股东参与。六个月前，TechCrunch、FYB 和
              Taylor Wessing 均描述了一笔 $150M 融资包：$115M 股权加 $35M 债务，估值略低于 $1B。


              投资人构成的战略意义很强，因为它不只是财务资金。REWE 是长期杂货和物流合作伙伴，Northzone 仍是可见的 VC 支持者，Prosus 在品类整合后重新出手，本身就是信心信号。TechCrunch 还称
              Just Eat Takeaway 在 2024 年融资前后是优先合作伙伴，说明独立即时零售融资收紧后，Flink
              的分销和资本叙事变得更依赖生态。结果是，公司如今的生存和扩张，不再主要系于纯粹闪电扩张，而更系于战略投资人和跨界投资人愿不愿意继续支持一个在两个核心市场更克制的运营模式。
