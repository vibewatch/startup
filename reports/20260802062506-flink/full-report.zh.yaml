              Flink 2026 年融资和 EBITDA 转正说法，比 2024
              年估值下调轮时点明显更好；但投资人仍看不到公开股权结构表、清算优先权结构、创始人持股、市场层面盈利能力和活跃客户披露。来自法国、Freiburg 劳工冲突、Fairwork 和 Trustpilot
              的负面证据说明，公司改善后的规模叙事仍与未解的治理、劳工和服务质量风险并存。
