- id: key-unknowns
  title: What the public record still does not reveal
  body: The public record is informative on category shape but thin on competitive economics. There is no public disclosure of what percentage of Flink orders originate from Lieferando or any other third-party platform, and there is no public competitor-by-competitor retention or churn data proving which brand has the stickiest customer base. That is exactly why competitive diligence cannot stop at surface-level statements like “last operator standing.” Investors still need channel mix, order-frequency cohorts, repeat rates, regional cohort behavior, and economics by acquisition path to tell whether Flink’s current position is strategically privileged or merely the least-bad survivor in a difficult category.
  claimRefs:
  - CP037
  - CP038
  figureRefs: []
