- id: direct-peer-profiles
  title: 'Direct peer profiles: speed, breadth, and value'
  body: >-
    Picnic and Knuspr/Rohlik are the clearest direct online-grocery comparators because they serve similar households with markedly different operating promises. Picnic pushes low prices and free delivery, supported by an electric scheduled-delivery model that is structurally better suited to larger, planned baskets. Knuspr advertises more than 19,000 products and delivery in three hours, making it closer to a full online supermarket than to a rapid top-up app. Rohlik’s group language reinforces that distinction explicitly: its focus is not on small baskets but on the daily and weekly needs of families.


    Flink sits in a narrower lane. Tech Funding News and the app-store listings describe a company centered on 3,000-product local hubs and roughly 30-minute fulfilment. That means Flink can beat weekly-grocery competitors on speed, but it can lose on assortment depth and household basket relevance. The practical implication is that Flink’s best customer is the one solving an urgent need today, while Picnic, Knuspr, and Rohlik are better positioned to win the main weekly order if price, breadth, and planned delivery matter more than immediacy.
