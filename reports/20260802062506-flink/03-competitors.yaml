- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Competitive threat
  - Severity
  - Why it matters
  - Diligence ask
  rows:
  - - Flink is the last dedicated German q-commerce survivor
    - Survival may reflect others’ failure more than Flink’s durable moat
    - High
    - Category attrition is not equivalent to lock-in or superior economics
    - Obtain city-level contribution margins and share gains post-2024 exits
  - - Local-hub speed advantage
    - DashMart and partner platforms can route the same convenience need through broader apps
    - High
    - Demand-funnel scale can offset narrower grocery specialization
    - Quantify share of first orders sourced via partners vs Flink-owned channels
  - - Curated top-up assortment
    - Knuspr and Rohlik offer much broader baskets for weekly family shopping
    - Medium
    - Speed alone may not protect basket share when the mission is a main grocery order
    - Measure overlap between Flink basket composition and weekly-grocery baskets
  - - Value proposition to consumers
    - Picnic’s free-delivery and low-price model can undercut premium convenience
    - High
    - Value pressure is acute if inflation keeps consumers trading down
    - Track price index versus Picnic and local supermarkets
  - - External distribution via Lieferando
    - Single-channel concentration could create dependence
    - High
    - A strong partner can both help acquisition and control the economics of demand
    - Review exclusivity, take rate, and termination provisions
  - - Operational advantage in Germany/NL
    - Public incumbents have more capital and reporting discipline
    - Medium
    - Public-market rivals can fund experimentation longer than a private company can disclose results
    - Benchmark Flink’s unit economics against public-company convenience disclosures
  notes: Risk rows focus on durable competitive threats, not just competitor names. The key distinction is between operating edge and economically defensible moat.
