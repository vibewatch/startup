callouts:
- calloutType: strength
  title: The direct-peer field got weaker before Flink did
  body: Flink’s most bullish competitive fact is not that it became bigger than every public incumbent; it is that the most dangerous dedicated fast-delivery peers in Germany are gone while Flink still retains local-hub density, supply support from REWE, and external reach through Just Eat Takeaway/Lieferando.
  claimRefs:
  - CP003
  - CP004
  - CP020
  - CP021
  - CP031
- calloutType: risk
  title: Broader platforms can still win the occasion without copying Flink’s model
  body: DoorDash, Just Eat Takeaway, and Delivery Hero do not need to rebuild a pink-hub network to threaten Flink. They can redirect convenience demand through larger apps and broader partner ecosystems, while Picnic and Knuspr compete on value and basket breadth. That makes Flink’s moat an execution moat, not a lock-in moat.
  claimRefs:
  - CP013
  - CP015
  - CP016
  - CP024
  - CP025
  - CP026
