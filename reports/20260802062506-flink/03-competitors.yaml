- id: switching-costs-and-moat-durability
  title: Switching costs, moat durability, and what survival actually proves
  body: >-
    Consumer switching costs in this category are low. Installing another app, comparing prices, or defaulting back to the local supermarket is easy. That means Flink’s moat cannot rely on lock-in alone. It has to come from better local density, faster and more reliable fulfilment, smarter assortment curation, and possibly better partner economics. Those are real advantages, but they are operational advantages, not software-style lock-in. Picnic can undercut on value. Knuspr and Rohlik can undercut on breadth. DashMart and Lieferando-style platforms can undercut on distribution reach.


    The strongest bullish read is that Flink survived a brutal shakeout and still holds the cleanest dedicated quick-commerce position in Germany. The strongest skeptical read is that survival is not the same thing as durable defensibility. Strategy& and IdeaProof both remind us that many category failures were rooted in economics, not merely in competitive clutter. If a larger platform can sell similar convenience through a broader app or if a larger-basket online grocer can make the weekly order painless, Flink’s operational edge may not translate into moat-quality economics.
