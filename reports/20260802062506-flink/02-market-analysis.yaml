- id: growth-drivers
  title: Growth drivers that could enlarge the market
  body: >-
    Four drivers stand out. First, low current penetration leaves headroom. Prosus and Tech Funding News both emphasize just how small online-grocery penetration still is in Flink’s core markets versus the UK benchmark. Second, convenience willingness to pay is real, especially among younger users: Strategy& says almost half of surveyed consumers would pay at least up to 5% more on an item basis when ordering online, with 18-35s showing the strongest willingness. Third, consolidation has reduced irrational supply. K5, Reuters, CNBC, and Mordor all point to a structurally less crowded German field after Getir and Gorillas retreated, which should improve density for survivors. Fourth, strategic partners can expand reachable demand without re-running the 2021-2022 hypergrowth playbook. Taylor Wessing, FYB, and TechCrunch show how REWE and Just Eat Takeaway fit into that access logic.


    The market is also still being reworked by larger incumbents. Strategy& calls out the Amazon Fresh-Rohlik cooperation in Germany as fresh evidence that the online-grocery stack is evolving rather than fading. DoorDash, Just Eat Takeaway, and Delivery Hero each show, via their own investor materials, that large local-commerce platforms continue to invest in the broader convenience layer. For Flink, that means the growth prize is real, but it will only be captured if its city-level density, partner economics, and service reliability beat larger platforms with broader distribution power.
