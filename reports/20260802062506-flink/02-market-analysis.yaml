- id: TM001
  title: Market definition table
  columns:
  - Segment / substitute
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Flink
  rows:
  - - Dedicated quick-commerce grocery
    - Urgent top-up baskets of groceries and household essentials fulfilled within ~30 minutes
    - Weekly bulk grocery missions and large scheduled baskets
    - End consumer / household
    - Direct market Flink is explicitly built for
  - - Broader online grocery
    - Scheduled grocery delivery and click-and-collect behavior
    - Restaurant-only delivery and non-food marketplaces
    - End consumer / household
    - Adjacent ceiling; some overlap, but not the same urgency mission
  - - Delivery aggregators with grocery
    - On-demand convenience orders routed through multi-category apps
    - Owned-inventory dark-store economics if no inventory control exists
    - End consumer / household
    - Important substitute because they can intercept the same need state
  - - Physical supermarkets / convenience stores
    - All walk-in local grocery and emergency-item spending
    - Digital-only channels
    - End consumer / household
    - Status-quo substitute that still dominates spend and anchors price expectations
  - - Food e-commerce overall
    - All online food retail including meal delivery and specialty categories
    - Non-food retail
    - End consumer / household
    - Too broad to use as Flink’s true TAM without narrowing to top-up grocery
  notes: This table separates Flink’s true top-up quick-commerce mission from broader food-ecommerce and offline grocery categories that are only partial substitutes.
