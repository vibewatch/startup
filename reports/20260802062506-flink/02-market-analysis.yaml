  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: city-level-SOM
    missingEvidence: City-level Flink market share, order density, and repeat-frequency data across Germany and the Netherlands.
    whyItMatters: Without city-level density, the public market thesis cannot be converted into a reliable Flink-specific SOM or market-share-underwriting model.
    diligencePath: Request city-by-city order density, active users, and market-share estimates from management or internal BI exports.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: cac-payback-and-channel-mix
    missingEvidence: Customer acquisition cost, payback period, and order-channel mix between the Flink app and partner channels.
    whyItMatters: Partner-assisted growth only creates value if channel economics and repeat behavior justify the margin give-up and acquisition cost.
    diligencePath: Request market-level CAC/payback cohorts and partner-channel gross-margin bridge from management.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM004
  - type: missing-source
    severity: minor
    topic: sam-lens limitations
    missingEvidence: A public source that isolates Germany-plus-Netherlands dense-city top-up grocery demand with consistent definitions across both markets.
    whyItMatters: Current public sources describe adjacent layers, but none publishes a clean cross-market narrow SAM perfectly aligned to Flink’s service model.
    diligencePath: Build a bottom-up SAM from hub catchments, population density, order frequency, and category mix once management data is available.
    relatedQuestionRefs:
    - QM021
    relatedTableRefs:
    - TM002
