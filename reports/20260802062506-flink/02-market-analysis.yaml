- id: buyer-user-payer-segmentation
  title: Buyer, user, and payer segmentation
  body: >-
    Flink’s buyer and payer are typically the same person: a household consumer deciding that time, convenience, or immediate need is more valuable than a store trip. The strongest public buyer-readiness signals come from Eurostat and Strategy& rather than from Flink directly. Eurostat says 78% of EU internet users bought goods or services online in 2025, with ages 25-34 and 35-44 contributing most. Strategy& adds that younger 18-35 consumers show above-average willingness to pay for convenience and that the population shopping at least partly online has grown materially since 2022, even though 46% still prefer to remain fully offline.


    That evidence points to a market centered on dense-city professionals, working parents, students, and other time-poor households whose shopping pattern is incremental rather than planned. Their adoption path is: need arises, app is opened, a small but urgent basket is assembled, and the premium is justified by speed and reduced friction. The budget owner is the consumer’s own grocery-and-convenience wallet, not a procurement team. This also means Flink’s demand can be highly sensitive to inflation, private-label trade-down, and quality-of-service perception. It is a high-frequency consumer market, not a contractually locked B2B market.
