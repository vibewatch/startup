- id: sizing-lenses
  title: Market sizing lenses across Germany and the Netherlands
  body: >-
    Germany provides the cleanest public size signal because Mordor Intelligence publishes a dedicated quick-commerce forecast: $1.15 billion in 2025, $1.24 billion in 2026, and $1.85 billion by 2031 at 8.22% CAGR. Within that market, Grocery and Staples represented 52.61% of 2025 spend, and the 11-30-minute service tier accounted for 54.45% of share. Those figures match Flink’s own current positioning around 30-minute delivery and grocery-led top-up baskets better than a broad “food e-commerce” statistic would.


    The Netherlands needs a different lens because public data is more often framed as online-grocery adoption rather than pure quick commerce. CBRE estimated online grocery reached about 7% market share in 2022 and modeled 2027 scenarios ranging from 9% to 23%. USDA separately valued the broader Dutch retail-food sector at $58 billion in 2024 while still noting that online shopping and speed-delivery services remain small. Prosus and Tech Funding News then add the cross-market penetration benchmark: Germany at roughly 3.5%, the Netherlands at 6.0%, and the UK around 14%. The right read-through is not that Flink’s TAM equals all grocery spend; it is that both of Flink’s core markets remain underpenetrated enough that a density-disciplined operator can still grow share inside a relatively early adoption curve.
