figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Flink’s customer journey centers on urgent need, address-qualified availability, rapid order placement, and habit formation through convenience.
  data:
    items:
    - label: 1. Need trigger
      stage: Need trigger
      actor: Urban shopper / household planner
      action: Realizes a missing ingredient, restock need, or late-evening grocery gap
      pain: Local supermarket trip is slow or impossible at that moment
      outcome: Opens Flink or partner surface
    - label: 2. Eligibility check
      stage: Eligibility
      actor: Consumer
      action: Enters address or lands on a serviceable location
      pain: Service unavailable outside covered catchments
      outcome: Coverage confirmed or user drops
    - label: 3. Basket creation
      stage: Order build
      actor: Consumer
      action: Browses staples, fresh items, drinks, and local products; selects payment method
      pain: Price sensitivity and stock availability can still interrupt conversion
      outcome: Order submitted
    - label: 4. Fulfillment
      stage: Fulfillment
      actor: Hub ops + courier
      action: Hub picks and packs order and dispatches rider
      pain: Delay, missing items, and spoiled goods are visible failure modes
      outcome: Delivery arrives or complaint event is created
    - label: 5. Post-order loop
      stage: Repeat / churn
      actor: Consumer
      action: Decides to reorder, complain, or churn after service experience
      pain: Support failures and broken flows reduce trust
      outcome: Repeat use, negative review, or abandonment
  claimRefs:
