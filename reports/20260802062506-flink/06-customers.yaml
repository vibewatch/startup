- id: retention-and-repeat-usage-remain-opaque
  title: Retention and repeat usage remain opaque
  body: Repeat-use logic is understandable from the product, but not measurable from the public record. Speed, late-night availability, and an assortment broad enough for meaningful replenishment all support the intuition that some users come back often. Yet there is no disclosed repeat-order rate, no churn figure, no true retention cohort, and no channel-level cohort behavior separating owned-app users from partner-acquired customers. Public ratings and anecdotes are not the same as retention data. In fact, the contrast between App Store positivity and Trustpilot negativity makes the absence of cohort data even more important, because it leaves investors unable to determine which customer experience is more representative of durable economic value. Public evidence supports use, not durability.
  claimRefs:
  - CU017
  - CU018
  - CU019
  - CU026
  - CU027
  - CU030
  - CU031
  tableRefs:
  - TU004
  figureRefs: []
- id: expansion-and-concentration-risk
  title: Expansion and concentration risk
  body: 'The main customer risks are concentration and channel opacity. Flink’s live customer base is concentrated entirely in Germany and the Netherlands, which simplifies execution but narrows the diversification base. Customer acquisition may also depend partly on partner channels: FYB highlights the Just Eat Takeaway relationship, and the Lieferando chain page confirms a public distribution surface even if the fetch was rate-limited. Meanwhile, the competitive shakeout likely helped customer acquisition by reducing direct rapid-delivery alternatives after Getir’s European retreat. But low switching costs remain a structural problem. Consumers can move among supermarkets, online grocers, and partner platforms easily, and adverse labor or service issues can quickly turn into customer dissatisfaction. That is why customer concentration and satisfaction quality matter more here than logo-like reach alone.'
