company:
  name: Flink
chapter:
  number: 6
  title: Customers
  summary: Flink clearly has real consumer demand and wide urban reach in Germany and the Netherlands, but the public customer record is polarized. Strong app-store signals coexist with severe Trustpilot complaints, and the absence of true retention cohorts leaves customer durability materially under-evidenced.
sections:
- id: who-the-customer-is
  title: Who the customer is and which jobs the service solves
  body: 'Flink’s current customer appears to be a consumer household shopper who is also the buyer and payer. The public app-store surfaces describe a one-stop online grocery shop, not a narrow single-category app, and the workflow is built around speed, convenience, and home delivery. That points to several recurring jobs: urgent top-up shopping, wider household replenishment, and late-evening convenience orders when physical stores are closed or inconvenient. The basket is more meaningful than an impulse snack run alone: the app copy highlights fresh produce, pantry items, cleaning supplies, drinks, and local specialty items, while Tech Funding News reports average basket values above €45. The most visible public cohort, then, is the time-sensitive household willing to trade some cost sensitivity for speed, local assortment, and reduced store friction.'
  claimRefs:
  - CU001
  - CU003
  - CU006
  - CU007
  - CU018
  - CU019
  - CU024
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-proof-and-reach
  title: Adoption proof, reach, and what scale looks like publicly
  body: 'Public evidence strongly supports that Flink is not an early or theoretical product. Prosus and EuropaWire say the company reaches 22.5 million people across Germany and the Netherlands, while TechCrunch reported 146 hubs across 80+ cities in late 2024. By March 2026, Tech Funding News described a 160-hub network with average baskets above €45. Those are imperfect adoption proxies, but they are still useful: they show a production service with substantial physical density and a customer base broad enough to justify a large operating footprint. App-store evidence complements this by proving real end-user engagement at the surface level. What the public record does not reveal is how many of those reachable users become first-time customers, and how many first-time customers become habitual repeat buyers.'
  claimRefs:
  - CU004
  - CU005
  - CU006
  - CU008
  - CU009
  - CU010
  - CU017
  - CU034
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: customer-proof-is-real-but-polarized
  title: Customer proof is real, but the experience is polarized
  body: 'The customer-proof picture is unusually split. On one hand, the iOS app listing shows a strong 4.7/5 rating from 994 ratings and a clean consumer proposition. On the other hand, the archived Trustpilot page rates goflink.com at only 1.3/5 from 857 customers and contains detailed complaints about broken checkout, delayed priority orders, missing or spoiled items, and poor support. These are not abstract criticisms: several complaints quote specific operational failures and billing frustrations such as a Flink Prime free trial rolling into a paid subscription. The practical implication is that Flink clearly has real production use and enough customer volume to generate both healthy app-store visibility and a large negative complaint surface. That makes the public customer record credible, but not uniformly reassuring.'
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
