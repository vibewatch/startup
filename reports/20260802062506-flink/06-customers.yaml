  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-cohorts
    missingEvidence: 30/90/180-day repeat-order cohorts, churn, and order frequency segmented by geography and channel.
    whyItMatters: The public record shows real usage and mixed sentiment, but cannot determine whether Flink retains high-value households or simply reacquires convenience demand.
    diligencePath: Request cohort retention tables for owned-app and partner-acquired customers, plus repeat-order intervals and frequency curves.
    relatedQuestionRefs:
    - QU011
    - QU012
    - QU024
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: channel-mix
    missingEvidence: Share of orders and repeat orders originating from owned app versus Lieferando / other partner surfaces.
    whyItMatters: Partner dependence changes both CAC quality and customer-relationship ownership, which directly affects lifetime value.
    diligencePath: Request first-order and repeat-order source mix by market and month, plus contribution margin by source.
    relatedQuestionRefs:
    - QU014
    - QU016
    - QU023
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: customer-service-quality-by-market
    missingEvidence: Internal complaint-rate, refund-rate, delay-rate, and stockout-rate by city or hub.
    whyItMatters: Public complaints prove problems exist but cannot quantify whether they are outliers or systemic service-quality failures.
    diligencePath: Request customer support KPI dashboard segmented by hub, city, and partner / owned order source.
    relatedQuestionRefs:
    - QU009
    - QU010
    - QU021
    relatedTableRefs:
    - TU006
  - type: missing-source
    severity: minor
    topic: named-customer-proof-table-coverage
    missingEvidence: Additional independently sourced customer-proof surfaces beyond app stores and archived Trustpilot reviews.
    whyItMatters: B2C consumer apps rarely disclose named reference customers, so publicly accessible proof surfaces are narrower and more review-centric than in enterprise software.
    diligencePath: Collect more dated review snapshots, app-store review exports, and partner-channel feedback by geography to deepen TU003 coverage.
    relatedQuestionRefs:
    - QU007
    - QU010
    relatedTableRefs:
    - TU003
