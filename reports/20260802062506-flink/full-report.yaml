              - CR023
              - CR024
              - CR030
              - CR036
      - number: '7.5'
        title: Mitigation maturity is limited and kill triggers are monitorable
        blocks:
          - type: paragraph
            body: >-
              The encouraging fact is that Flink is still operating, still funded, and more focused than before. The
              discouraging fact is that the public evidence set does not show mature, transparent mitigation for its top
              risks. Labor issues are visible, but no public operating framework demonstrates they are durably
              contained. Service-quality failures are visible, but there is no public KPI dashboard showing recovery or
              improvement. Partner concentration is visible, but not the contractual protections around it. Financing
              risk is lower than in 2022-2023, but not gone. That means investors should think in kill criteria rather
              than in abstract comfort. Another weakly priced round, a meaningful legal or labor escalation in a core
              market, persistent complaints without visible improvement, or a deterioration in REWE or JET economics
              would each be serious thesis-breaking events rather than mere monitoring notes.
            claimRefs:
