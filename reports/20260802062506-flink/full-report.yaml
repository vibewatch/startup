      - number: '7.3'
        title: Partner and dependency risk is real on both supply and demand
        blocks:
          - type: paragraph
            body: >-
              Flink’s current model depends on several external relationships that can help scale the business but also
              weaken control. FYB confirms the strategic REWE supply relationship and the Just Eat Takeaway partnership.
              Those ties may be strengths, yet they also create concentration risk: if REWE terms worsen, Flink could
              feel pressure in assortment and procurement economics; if Lieferando economics or ranking logic shift,
              Flink could feel pressure in acquisition and channel margins. Consumer app distribution also depends on
              Apple and Google, which is a smaller risk but still a dependency. Geographic concentration intensifies all
              of this because the company now relies on only two operating markets. A narrower company is easier to
              manage, but it is also more exposed when one critical relationship or one core jurisdiction changes its
              stance.
            claimRefs:
              - CR016
