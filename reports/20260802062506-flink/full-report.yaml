      - number: '6.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Real usage is not in doubt
            body: >-
              App-store ratings, wide hub coverage, and 22.5 million people in range make it clear that Flink serves a
              real customer base at scale in its two core markets.
            calloutType: strength
