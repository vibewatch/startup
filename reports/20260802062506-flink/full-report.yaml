  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Small changes in proof quality can move Flink from watchlist-worthy to overexposed, because recent pricing already
      assumes material progress.
    data:
      items:
        - label: Bear — weak next round / legal drag ($B)
          value: 0.6
        - label: Base — recent round band midpoint ($B)
          value: 0.95
        - label: Bull — durable EBITDA + better proof ($B)
          value: 1.3
        - label: 2022 peak narrative ($B)
          value: 5
        - label: Germany 2026 q-commerce market ($B)
          value: 1.24
    approximationNotes: >-
      Bear/base/bull bars are scenario anchors derived from public evidence and recent round marks, not formal
      discounted cash flow outputs.
    claimRefs:
      - CV004
      - CV019
      - CV020
      - CV031
      - CV033
      - CV034
      - CV035
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Public evidence supports a narrow current fair-value band and a wider eventual upside/downside range that depends
      heavily on missing diligence items.
    data:
      items:
        - label: Current supported band
          low: 900
          high: 1000
          displayValue: $0.9B-$1.0B
          detail: Anchored to 2024-2026 public round reporting.
          tone: neutral
        - label: Conservative downside
          low: 500
          high: 700
          displayValue: $0.5B-$0.7B
          detail: If labor, retention, or financing quality disappoints.
          tone: warning
        - label: Constructive upside
          low: 1200
          high: 1500
          displayValue: $1.2B-$1.5B
          detail: Requires proof of durable profitability and better-quality cohorts.
          tone: positive
        - label: Historical peak context
          low: 5000
          high: 5000
          displayValue: ~$5.0B
          detail: Serves as context for prior exuberance, not a live anchor.
          tone: negative
    approximationNotes: >-
      Scenario ranges are judgment-based investment guardrails anchored to public round marks, category risk, and
      missing-proof penalties.
    claimRefs:
      - CV004
      - CV007
      - CV015
      - CV019
      - CV020
      - CV021
      - CV033
      - CV034
      - CV035
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: >-
      The public evidence set is strongest on reach and survival, and weakest on durability proof and governance-level
      valuation support.
    data:
      items:
        - label: Market position
          value: Leader-ish
          subtext: Survivor in DE/NL q-commerce
          claimRefs:
            - CV005
        - label: Proof of demand
          value: Strong
          subtext: 160+ hubs, 22.5M reach, visible customer use
          claimRefs:
            - CV009
        - label: Economics proof
          value: Partial
          subtext: EBITDA-positive claims, no FCF proof
          claimRefs:
            - CV007
            - CV015
        - label: Moat quality
          value: Moderate
          subtext: Operational density more than software lock-in
          claimRefs:
            - CV011
        - label: Risk load
          value: High
          subtext: Labor, service, partner, financing
          claimRefs:
            - CV003
        - label: Valuation support
          value: Fair at best
          subtext: Recent band looks like discipline point
          claimRefs:
            - CV004
        - label: Evidence quality
          value: Medium
          subtext: Coherent, still missing critical private data
          claimRefs:
            - CV002
        - label: Overall call
          value: Track
          subtext: Do not chase current band
          claimRefs:
            - CV001
            - CV040
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV007
      - CV009
      - CV011
      - CV040
