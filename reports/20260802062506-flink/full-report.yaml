  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Capital history and what the reset means
        blocks:
          - type: paragraph
            body: >-
              Flink’s public financing history supports a simple conclusion: the company retained access to capital, but
              not on the exuberant terms of the 2021-2022 boom. Tracxn shows $1.43 billion raised across eight rounds,
              while Clay’s aggregation pushes disclosed total capital above $1.5 billion once the 2024 debt tranche is
              counted. Yet TechCrunch and TNW place the September 2024 financing at just under a $1 billion valuation,
              and Clay records roughly $900 million for March 2026. Against Clay’s reported 2022 peak of around $5
              billion, that is a severe reset. Investors therefore appear to have moved from funding pan-European speed
              expansion to funding a narrower operating-repair and selective-growth thesis. The capital was still
              available, but the price of it and the story required to earn it both changed materially.
