        title: Exhibits
        blocks:
          - type: callout
            title: Labor is not a side risk — it is a transmission risk
            body: >-
              Because Flink’s promise depends on hub and courier execution, labor disputes do not stay in HR. They can
              turn into delayed orders, poor customer experience, higher cost, legal spend, and eventually weaker
              financing conditions.
