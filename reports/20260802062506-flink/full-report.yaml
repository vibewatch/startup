            body: >-
              Flink’s public product is straightforward to describe and surprisingly specific in its customer workflow.
              The iOS and Android listings both present the service as a one-stop online shop: users enter an address,
              browse a grocery selection, choose items, check out, and receive the basket at home within minutes. The
              catalog is broad enough to support recurring top-up behavior — fresh produce, drinks, pantry items,
              household helpers, and branded staples all appear in the public copy — yet the mission is still
              convenience-led rather than full-basket supermarket replacement. The product therefore sits between a
              classic food-delivery app and a weekly online grocer. What it sells is not just groceries, but time: quick
              replenishment, local discovery, and doorstep convenience with a curated but substantial basket.
