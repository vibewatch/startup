      nodes:
        - id: supply
          label: Supply + assortment
          detail: REWE-supported sourcing plus local product selection
        - id: hubs
          label: 160 local hubs
          detail: Dense urban micro-fulfillment footprint across Germany and the Netherlands
        - id: inventory
          label: Inventory + picker routing
          detail: Precise stock control and smart routing per Tech Funding News
        - id: app
          label: Customer app
          detail: 2,300+ visible items, top-up mission, localized catalog
        - id: courier
          label: Delivery execution
          detail: Approximate 30-minute delivery with average basket above €45
        - id: channel
          label: Partner distribution
          detail: Preferred Just Eat Takeaway channel augments Flink-owned demand
