      - number: '4.6'
        title: Remaining diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The public record is good enough to sketch a turnaround narrative, but not good enough to underwrite the
              next round or an exit. No source reviewed here discloses company-level free cash flow, and none provides
              debt covenants, maturity, or amortization for the September 2024 debt component. Public sources also do
              not break down revenue quality by source of order, geography, or customer cohort. That leaves a material
              gap between “EBITDA profitable in core markets” and “self-funding, financeable at a premium.” The next
              validating milestone would be hard disclosure of company-level profitability or a financing event priced
              materially above the 2024-2026 band. Until then, Flink’s financial case remains promising but not fully
              de-risked.
