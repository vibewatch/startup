      - number: '1.4'
        title: Scale, Partnerships, and the Milestone Record
        blocks:
          - type: paragraph
            body: >-
              The public milestone arc is relatively clear even though not every early round term is independently
              filed. Wikipedia, Northzone, and IdeaProof all place Flink’s founding in late 2020; Taylor Wessing and
              TechCrunch show a September 2024 company with 146-148 hubs, 80-plus cities, and 8,900 employees; and the
              March 2026 Prosus-backed materials show that footprint climbing to about 160 hubs, 22.5 million people
              within reach, and more than 10,000 employees. The September 2024 legal and media coverage also described a
              plan to open 30 additional locations over the following year, so the 2026 scale data is consistent with
              cautious footprint expansion rather than a return to subsidy-led land grabs.


              Partnerships are central to how Flink now scales. Taylor Wessing and FYB both describe REWE as the
              goods-purchasing and logistics partner already in place since 2021, while TechCrunch framed Just Eat
              Takeaway as a preferred distribution partner tied to the 2024 refinancing. In parallel, K5, CNBC, Reuters,
              and Mordor Intelligence all describe a much more consolidated German competitive field after Getir and
              Gorillas withdrew. That matters because Flink’s current scale is not just an absolute number; it is a
              scale position achieved after many dedicated peers either shut down or retreated from Germany and
              neighboring markets.
