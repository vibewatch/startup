      - number: '8.2'
        title: Thesis versus anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is straightforward: Flink survived a brutal category shakeout, focused on Germany and the
              Netherlands, claims EBITDA profitability, and still enjoys backing from credible investors and partners.
              If the company has truly found a density-and-basket model that works in its best markets, the recent
              valuation band may prove reasonable and eventually conservative. The anti-thesis is just as
              straightforward: the company’s valuation did not visibly re-rate upward after the 2026 round,
              customer-proof is mixed, labor/legal risk remains active, and the category’s history is full of operators
              that briefly looked repaired before the economics gave way again. Investors do not need to deny Flink’s
              progress to stay cautious. They only need to notice that the hardest proof — durable free cash flow,
              transparent retention, and contained legal risk — is still absent from the public record.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV015
              - CV016
              - CV017
              - CV018
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV022
              - CV023
              - CV024
              - CV036
      - number: '8.3'
        title: Scenario logic and price discipline
        blocks:
          - type: paragraph
            body: >-
              The bull/base/bear split should be driven by evidence quality, not by enthusiasm for the category survivor
              narrative. In the bull case, Flink turns EBITDA-positive momentum into stable city economics, keeps
              baskets healthy above €45, expands selectively in core markets, and eventually earns a better financing
              mark. In the base case, the company remains a viable but still scrutinized operator roughly worth what
              informed investors recently paid. In the bear case, labor or service quality issues remain sticky, capital
              markets stay skeptical, and the next financing event reveals that recent stability did not translate into
              a better-quality asset. The most important pricing principle is simple: absent stronger proof on retention
              and cash flow, the current ~$0.9B-$1.0B range looks more like a ceiling for eager entry than a floor for
              upside.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV019
              - CV020
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
          - type: table
            tableRef: TV003
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV033
              - CV034
              - CV035
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV004
              - CV019
              - CV020
              - CV031
              - CV033
              - CV034
              - CV035
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV004
              - CV007
              - CV015
              - CV019
              - CV020
              - CV021
              - CV033
              - CV034
              - CV035
      - number: '8.4'
        title: Comparables and what they do and do not tell you
        blocks:
          - type: paragraph
            body: >-
              Public comparables can help frame the call, but none are perfect. DoorDash, Delivery Hero, and Just Eat
              Takeaway are relevant because they show what public markets reward or punish in local commerce and
              delivery, yet each is far broader than Flink in geography, demand mix, and business model. Getir matters
              as a negative comparable because it demonstrates how spectacular funding and market presence failed to
              guarantee durability. Flink’s own recent rounds are therefore still the most informative private marks,
              especially because they bracket the company after the category reset. The lesson from comps is not that
              Flink deserves DoorDash-like treatment if it survives, or Getir-like treatment if it stumbles. The lesson
              is that public markets and late-stage private investors alike now demand disciplined economics, not just
              speed, coverage, and story quality.
            claimRefs:
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
          - type: table
            tableRef: TV004
            claimRefs:
              - CV019
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
      - number: '8.5'
        title: Final diligence asks and thesis-breaks
        blocks:
          - type: paragraph
            body: >-
              The remaining work is obvious and decisive. Investors need cap-table and debt clarity, cohort retention by
              acquisition path, proof of company-level cash generation, and concrete evidence that labor/legal risk is
              trending toward containment rather than periodic flare-up. A new round below the recent band, a
              deterioration in REWE or JET economics, or a continued stream of service-quality failures without
              transparent improvement would all be meaningful thesis-breaks. On the positive side, disclosed
              company-level profitability, better retention data, and evidence that new hubs scale without margin
              regression would justify a more constructive stance. Until those proofs appear, the best discipline is to
              resist forcing false precision. Flink has earned attention. It has not yet earned a premium multiple of
              trust.
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV005
            claimRefs:
              - CV035
              - CV036
              - CV037
              - CV038
          - type: table
            tableRef: TV006
            claimRefs:
              - CV002
              - CV011
              - CV024
              - CV036
              - CV037
              - CV040
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The company can be improving and still not be cheap
            body: >-
              That is the central valuation lesson from Flink. The business may be repaired enough to survive and still
              be too under-evidenced to justify paying above the recent band with conviction.
            calloutType: risk
            claimRefs:
              - CV004
              - CV006
              - CV021
              - CV040
          - type: callout
            title: The survivor thesis is real, just not sufficient
            body: >-
              Flink’s strongest asset is that it lived through a brutal category reset and still retained investor and
              partner support. That earns it a place on the watchlist; it does not automatically earn a premium
              valuation.
            calloutType: strength
            claimRefs:
              - CV005
              - CV011
              - CV025
              - CV039
