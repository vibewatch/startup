      - number: '2.5'
        title: Adoption constraints and what could limit market capture
        blocks:
          - type: paragraph
            body: >-
              The same sources that support the market thesis also show why it is fragile. Strategy& is explicit that
              many quick-commerce players exited because the model was highly unprofitable without a turnaround. CBRE
              shows Dutch online-supermarket channels are still loss-making and says Picnic’s losses nearly doubled in
              2022. USDA highlights inflation-era behavior that works against premium delivery: Dutch consumers visit
              multiple supermarkets and shift toward private labels, which means they are price-comparing rather than
              defaulting to convenience. Physical supermarket sales also continue to grow, so online grocery has not yet
              “won” the consumer.


              Flink also faces structural information gaps. No public source in this review isolates city-level share,
              order density, or CAC/payback by market, which means the public market story is still much more about
              plausible industry logic than hard underwriting data. Fairwork’s Germany 2025 findings add the
              labor-regulation backdrop that platform delivery businesses cannot ignore. The biggest market risk is
              therefore not that the category disappears; it is that the category grows, but slower than capital
              intensity, labor complexity, or incumbent competitive pressure would require for an attractive
              private-market return.
            claimRefs:
              - CM015
              - CM019
              - CM033
              - CM034
              - CM035
              - CM036
              - CM040
              - CM041
              - CM042
