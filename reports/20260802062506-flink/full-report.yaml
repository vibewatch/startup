      - number: '4.5'
        title: What keeps the bear case alive
        blocks:
          - type: paragraph
            body: >-
              The bear case survives because the category’s operating history is still adverse even if Flink’s current
              momentum looks better. Strategy& says many quick-commerce players exited because the model was highly
              unprofitable. CNBC, Reuters, and K5 document the severity of the sector shakeout via Getir’s retreat and
              Germany’s consolidation. Le Figaro adds company-specific evidence: France still generated €37.5 million in
              revenue before liquidation, yet demand did not overcome inflation, regulation, and investor fatigue.
              IdeaProof’s order-loss estimate is low-reputation evidence, but it points in the same direction.
              Fairwork’s 2025 criticism introduces another financial angle: labor conditions can become a margin or
              compliance problem even after operational metrics improve. So the most skeptical reading is not that Flink
              is failing now; it is that public evidence still does not prove durable self-funding economics.
            claimRefs:
