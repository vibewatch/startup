      - number: '7.4'
        title: Financial and model risk has improved but not disappeared
        blocks:
          - type: paragraph
            body: >-
              The most optimistic reading of Flink is that it survived where others failed and reached EBITDA-positive
              conditions in core markets. The skeptical reading is that the model remains fragile even after
              retrenchment. TechCrunch and Prosus support recent financing continuity, but not a decisive valuation
              re-rating. Mordor’s estimate of a $1.24 billion German quick-commerce market caps how much room there is
              for easy domestic scaling, while Strategy& argues many quick-commerce players exited because the model was
              deeply unprofitable. Even low-reputation sources like IdeaProof point in the same general direction on
              unit economics. The exits of Getir and Gorillas help Flink competitively, but they also confirm how
              unforgiving the category has been. Financial risk is therefore lower than at peak chaos, yet still
              materially above what a clean software or marketplace story would imply.
            claimRefs:
              - CR023
              - CR024
              - CR025
              - CR026
              - CR027
              - CR028
              - CR029
          - type: table
            tableRef: TR004
