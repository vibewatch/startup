      - number: '3.3'
        title: Incumbent platform pressure and external channel dependence
        blocks:
          - type: paragraph
            body: >-
              The deepest competitive risk does not come from another surviving pink-bike clone. It comes from broader
              platforms with a larger demand funnel and more capital. DoorDash calls itself a leading local-commerce
              platform and says it operates in more than 30 countries. Just Eat Takeaway says it connects consumers with
              342,000 partners in 15 countries. Delivery Hero continues to publish 2026 trading updates as a listed
              global operator. These companies can compete for the same convenience occasion without needing to copy
              Flink’s exact market posture.


              Flink’s own distribution choices sharpen that risk. TechCrunch and FYB tie the 2024 refinancing to a
              strategic Just Eat Takeaway relationship, while Supermarktblog reported later that Flink appeared to cut
              Uber Eats and Wolt and lean more exclusively into Lieferando for external grocery distribution. If
              accurate, that may simplify channel focus, but it also concentrates dependency. A broader app ecosystem
              can help Flink reach users cheaply; it can also relegate Flink to just another supply layer inside a
              platform relationship the platform ultimately controls.
