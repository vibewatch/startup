  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what Flink is actually selling
        blocks:
          - type: paragraph
            body: >-
              Flink’s market is narrower than “grocery” and broader than “a grocery app.” The correct boundary is the
              quick-commerce top-up mission: urgent or convenience-led purchases of everyday items that a customer wants
              within about 30 minutes, fulfilled from local hubs rather than from a conventional supermarket run. The
              Apple and Google app listings, Prosus-backed funding materials, and Tech Funding News all describe Flink
              as a one-stop digital shop for fresh produce, drinks, pantry staples, household helpers, and other urgent
              essentials. That behavior is closer to replacing a convenience-store or top-up supermarket trip than
              replacing a full weekly family stock-up.


              That distinction matters because it changes what counts as included spend. Included spend is urban and
              suburban convenience grocery demand that is time-sensitive enough to support premium last-mile fulfillment
              and dense local inventory. Excluded spend includes bulk warehouse missions, low-frequency pantry
              replenishment that can wait for next-day delivery, and restaurant delivery that never touches grocery
              inventory. Adjacent substitutes still matter — local supermarkets, DoorDash, Just Eat Takeaway, Delivery
              Hero, and online grocers all compete for the same consumer attention and wallet — but Flink’s direct
              addressable segment is the narrower dark-store, top-up-grocery layer.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM028
              - CM029
