      - number: '6.4'
        title: Retention and repeat usage remain opaque
        blocks:
          - type: paragraph
            body: >-
              Repeat-use logic is understandable from the product, but not measurable from the public record. Speed,
              late-night availability, and an assortment broad enough for meaningful replenishment all support the
              intuition that some users come back often. Yet there is no disclosed repeat-order rate, no churn figure,
              no true retention cohort, and no channel-level cohort behavior separating owned-app users from
              partner-acquired customers. Public ratings and anecdotes are not the same as retention data. In fact, the
              contrast between App Store positivity and Trustpilot negativity makes the absence of cohort data even more
              important, because it leaves investors unable to determine which customer experience is more
              representative of durable economic value. Public evidence supports use, not durability.
            claimRefs:
              - CU017
              - CU018
              - CU019
              - CU026
              - CU027
              - CU030
              - CU031
          - type: table
