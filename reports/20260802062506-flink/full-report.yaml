      - number: '1.5'
        title: Adverse Events, Labor Friction, and Operating Reset
        blocks:
          - type: paragraph
            body: >-
              The operating reset is the most important adverse lens for Flink. Le Figaro reported in April 2024 that
              the French business, employing 218 people, was heading into liquidation after prior restructuring and a
              combination of inflation, regulatory pressure, and investor disinterest in the category. English and
              German Wikipedia entries also reference Austria as an earlier retreat. Those exits, together with the 2024
              down-round pricing and IdeaProof’s critique of historical per-order losses, show that Flink did not escape
              the sector’s fundamental unit-economics stress; it simply survived it better than most peers.


              Labor risk also remains material. Eurofound documented the Freiburg workers’ collective, the October 2023
              works-council vote, the subsequent site shutdown, and the March 2024 court loss for the
              collective-dismissal claim. Fairwork’s 2025 Germany findings were mixed rather than catastrophic: Flink
              was the only platform reviewed to evidence minimum wage after costs, but Fairwork still found no
              sufficient proof of worker protection from task-related risks and no evidence of collective
              representation. Customer surfaces are similarly bifurcated. Apple’s app listing shows strong store
              ratings, but the Trustpilot archive shows a deeply negative review base centered on delays, missing items,
              bugs, and poor support. Taken together, the company-overview verdict is survival with scars: Flink looks
              like the strongest remaining dedicated German quick-commerce operator, but only after a deep geographic
              retreat, a valuation reset, and unresolved labor and service-quality risks.
            claimRefs:
              - CO035
              - CO036
              - CO037
              - CO038
              - CO039
              - CO040
              - CO041
              - CO042
              - CO046
              - CO047
              - CO048
      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Survivor advantage after market consolidation
            body: >-
              Flink no longer needs to outrun multiple heavily subsidized dedicated quick-commerce rivals in Germany.
              Public market commentary, K5, Reuters/CNBC coverage of Getir, and Mordor’s GMV-removal estimate all point
              to a dramatically less crowded dedicated-q-commerce field. That does not prove the model is easy, but it
              does improve Flink’s odds of converting density into better unit economics than the 2021-2022 cohort
              achieved.
            calloutType: strength
            claimRefs:
              - CO022
              - CO024
              - CO043
              - CO044
              - CO045
          - type: callout
            title: Scale recovery is real, but disclosure quality is still late-stage-private and thin
            body: >-
              Flink’s 2026 financing and EBITDA-positive claim look materially better than the 2024 down-round moment,
              yet investors still lack a public cap-table, preference-stack, founder-ownership, market-level
              profitability, and active-customer disclosure. Adverse evidence from France, Freiburg labor conflict,
              Fairwork, and Trustpilot shows that the company’s improved scale story coexists with unresolved
              governance, labor, and service-quality risk.
            calloutType: risk
