      - number: '4.3'
        title: Operating inflection and the core-market focus
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence of financial improvement comes from the transition between the 2024 refinancing and
              the 2026 Prosus-led round. TNW reported country-level EBITDA break-even and a target for overall
              profitability by Q2 2025, while Prosus later said Flink had confirmed EBITDA profitability in 2024. Taylor
              Wessing, TechCrunch, FYB, Prosus, and EuropaWire all align on the broader logic: double down on Germany
              and the Netherlands rather than re-expand indiscriminately. That is consistent with the observed network
              moving from 148+ hubs in over 80 cities by late 2024 to around 160 hubs and 22.5 million people in range
              by March 2026. The signal is not hypergrowth. It is controlled density expansion after retrenchment, which
              is exactly what a repaired financial story would look like if management believes the business works in
              fewer markets before it works everywhere.
