  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape after the German quick-commerce shakeout
        blocks:
          - type: paragraph
            body: >-
              Flink’s competitive problem changed fundamentally once the German quick-commerce land rush collapsed. The
              most relevant dedicated speed peers — Getir and Gorillas — are no longer active in Germany in the way they
              once were, and K5 openly frames Flink as nearly the only large remaining dedicated operator in the market.
              That does not mean competition disappeared. It means the competition shifted away from a crowd of
              venture-subsidized 10-minute copycats toward a smaller number of better-capitalized online-grocery,
              delivery-platform, and supermarket substitutes.


              The direct set now splits into three buckets. First are broad online-grocery players such as Picnic and
              Knuspr/Rohlik that compete on assortment breadth, quality, and price. Second are local-commerce or
              delivery-platform incumbents such as DoorDash, Just Eat Takeaway, and Delivery Hero that can route
              convenience demand at massive scale. Third are the physical supermarket and convenience-store status quo.
              For investors, this matters because Flink no longer needs to outrun every dedicated speed peer; it now
              needs to defend a distinct place between full-basket online grocers and large multi-category delivery
              apps.
            claimRefs:
