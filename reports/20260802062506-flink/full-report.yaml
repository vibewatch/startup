        title: Exhibits
        blocks:
          - type: callout
            title: The category is no longer overcrowded
            body: >-
              Germany’s dedicated quick-commerce field looks more structurally rational than it did in 2021-2022. K5,
              Reuters, CNBC, and Mordor all point to materially reduced overlap after Getir and Gorillas exited, which
              improves Flink’s chance of turning city density into a durable market position.
            calloutType: strength
            claimRefs:
              - CM020
              - CM021
              - CM022
          - type: callout
            title: Underpenetration is promising, but it also proves the market is not yet fully habituated
            body: >-
              Low online-grocery penetration in Germany and the Netherlands is an opportunity only if consumers
              repeatedly choose convenience over store trips often enough to overcome thin unit economics. Strategy&,
              CBRE, USDA, and Fairwork all show reasons that conversion can stall: offline preference, price
              sensitivity, loss-making online channels, and labor/regulatory complexity.
            calloutType: risk
