  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory risk remains core rather than peripheral
        blocks:
          - type: paragraph
            body: >-
              Flink’s legal and regulatory risks are unusually central to the investment case because they directly
              affect the service model, not just the administrative perimeter around it. Eurofound documents the
              Freiburg workers’ collective, the October 2023 works-council vote, the concurrent shutdown of local
              operations, and the March 2024 court loss for workers alleging collective dismissal. Fairwork’s 2025
              materials then add independent criticism of fair conditions and fair representation. France provides an
              even starker warning: Le Figaro says Flink’s local operation failed under inflation, regulatory pressure,
              and investor disinterest. Together these sources show that labor law, platform-work politics, and
              municipal or regulatory treatment of the model can alter outcomes materially. This is not a category where
              legal friction sits quietly in the background while growth compounds undisturbed.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
