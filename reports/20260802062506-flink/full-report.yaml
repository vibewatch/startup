companyProfile:
  summary: >-
    Flink was founded in Berlin at the end of 2020 and now operates as Flink SE, a quick-commerce grocery company
    delivering everyday household items from local urban hubs rather than from third-party supermarkets. The company’s
    public operating footprint is now concentrated in Germany and the Netherlands after exits from Austria and France.
    Flink monetizes through grocery baskets and convenience economics supported by its own fulfillment layer, strategic
    supply and distribution partnerships, and a late-stage private funding base that has exceeded $1.5B in disclosed
    capital while resetting valuation dramatically from boom-era levels.
