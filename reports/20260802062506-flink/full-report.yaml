      - number: '7.2'
        title: Operational and quality risk is visible in customer experience
        blocks:
          - type: paragraph
            body: >-
              Flink’s operational risks are already visible to end users. The archived Trustpilot page is not merely
              negative sentiment; it is a catalog of failure modes including broken checkout, delayed deliveries,
              missing goods, spoiled products, poor support, and billing frustration. For a company whose promise is
              rapid, reliable local delivery, that matters disproportionately. When labor-intensive execution slips, it
              shows up immediately in broken baskets and refund disputes. Taylor Wessing’s description of independent
              e-bike delivery infrastructure reinforces how exposed Flink remains to field execution. The same system
              that creates differentiation on speed also concentrates risk into hub performance, inventory accuracy,
              rider availability, and customer support recovery. Operational risk here is not abstract process risk — it
              is the daily integrity of the service experience.
            claimRefs:
              - CR011
              - CR012
