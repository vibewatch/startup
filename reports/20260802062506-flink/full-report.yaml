              - CU031
      - number: '6.5'
        title: Expansion and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The main customer risks are concentration and channel opacity. Flink’s live customer base is concentrated
              entirely in Germany and the Netherlands, which simplifies execution but narrows the diversification base.
              Customer acquisition may also depend partly on partner channels: FYB highlights the Just Eat Takeaway
              relationship, and the Lieferando chain page confirms a public distribution surface even if the fetch was
              rate-limited. Meanwhile, the competitive shakeout likely helped customer acquisition by reducing direct
              rapid-delivery alternatives after Getir’s European retreat. But low switching costs remain a structural
              problem. Consumers can move among supermarkets, online grocers, and partner platforms easily, and adverse
              labor or service issues can quickly turn into customer dissatisfaction. That is why customer concentration
              and satisfaction quality matter more here than logo-like reach alone.
            claimRefs:
              - CU020
