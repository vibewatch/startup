  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and why it is not a clean yes
        blocks:
          - type: paragraph
            body: >-
              The public record supports a cautious, price-sensitive stance rather than a confident “buy.” Flink has
              real operating progress: recent investor support, EBITDA-positive messaging, broad urban reach, and
              evidence that the company emerged from the quick-commerce collapse as one of the last serious survivors in
              Germany. But the same record still leaves too much unresolved to justify paying meaningfully above the
              recent round band. Cash-flow durability, partner-channel economics, labor stabilization, and retention
              quality are still under-evidenced. The right recommendation is therefore to keep Flink in the investable
              universe, but not to treat it as a high-conviction underwrite at a premium price. This is a
              track-or-research-more company whose upside depends on proving that survival has become durable economics,
              not just narrower geography and fresh capital.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV021
              - CV040
