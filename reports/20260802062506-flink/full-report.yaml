      - number: '4.2'
        title: Revenue model and what the public surface actually shows
        blocks:
          - type: paragraph
            body: >-
              The public revenue model is visible in outline but not in enough detail to underwrite with confidence.
              Flink’s app-store listings show a grocery shopping product with 2,300+ items, multiple payment methods
              including Apple Pay, PayPal, and iDEAL, and long operating hours in Germany and the Netherlands. That
              supports a real transactional revenue engine built on merchandise basket value plus convenience, not just
              a tiny emergency-purchase niche. What the public surface does not show is equally important. It does not
              disclose realized delivery fees by geography, promotional intensity, take-rate mix, or channel-specific
              contribution economics. Investors can therefore infer that Flink monetizes through order economics,
              baskets, and convenience fees, but they cannot quantify how much of gross revenue is quality revenue
              versus heavily promoted gross merchandise passing through a costly last-mile system.
