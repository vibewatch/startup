  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Current cap table, preference stack, liquidation rights, and founder/common ownership after the 2024 and 2026 financings.
    whyItMatters: Late-stage downside protection can dominate common-equity outcomes and can materially alter whether an entry price is investable.
    diligencePath: Request the latest cap-table waterfall, financing documents, and shareholder-rights summary from management or counsel.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: customer-metrics
    missingEvidence: Current active-customer count, monthly order volume, order frequency, cohort retention, and market-by-market usage density.
    whyItMatters: Scale quality matters more than absolute hub count for validating whether EBITDA-positive claims are durable or narrowly optimized.
    diligencePath: Request cohort, active-user, and order-density dashboards segmented by Germany and Netherlands city clusters.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: minor
    topic: governance-detail
    missingEvidence: A full current board and supervisory-board roster with committee structure and director independence detail.
    whyItMatters: Governance quality affects control rights, founder dependence, and how to interpret strategic-partner influence over future exits.
    diligencePath: Obtain current Handelsregister extracts, articles of association, and board materials that show supervisory-board composition.
    relatedQuestionRefs:
    - QO004
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology completeness
    missingEvidence: A fully filed round-by-round and country-by-country chronology with primary documents for every funding round, acquisition, and market exit.
    whyItMatters: The public record captures the broad arc well enough for underwriting context, but not every event has filing-grade dates or exact instrument detail.
    diligencePath: Request a management-approved corporate timeline plus financing closing documents and legal-entity event list to harden the chronology.
    relatedQuestionRefs:
    - QO017
    - QO019
    relatedTableRefs:
    - TO004
