company:
  name: Flink
chapter:
  number: 1
  title: Company Overview
  summary: Flink is the surviving dedicated quick-commerce grocery operator of scale in Germany and the Netherlands, now rebuilt around selective expansion instead of hypergrowth. Public 2024-2026 evidence shows a post-reset company with roughly 160 hubs, more than 10,000 employees, a Prosus-led $100 million round, and claimed EBITDA profitability, but with lingering labor, service-quality, and disclosure gaps.
sections:
- id: identity-and-model
  title: Identity, Legal Form, and Operating Model
  body: >-
    Flink is a Berlin-based quick-commerce grocery company operating through local micro-fulfillment hubs rather than through third-party supermarkets. Public legal-entity surfaces identify the current operating company as Flink SE at Brunnenstraße 19-21 in central Berlin, and market-facing descriptions consistently frame the business as on-demand delivery of everyday groceries and essentials through a dense urban network. The 2026 Prosus-led financing materials describe the company as focused on Germany and the Netherlands after several years of market retrenchment, with 160 hubs, around 3,000 products per hub, reach into more than 22.5 million consumers, and a workforce above 10,000.


    The customer proposition has also shifted away from the pandemic-era ten-minute-growth narrative toward a more disciplined convenience proposition. Prosus and Tech Funding News describe an average basket above €45 and roughly 30-minute delivery, while the Apple and Google app listings emphasize 2,300-plus items, local bakery supply, pantry staples, beverages, and household goods. That positioning matters for later financial analysis: Flink is effectively underwriting frequent top-up shopping missions, not the weekly-stock-up mission of a full supermarket. Its app-store descriptions, partner-backed funding materials, and data-provider summaries all describe the company as a logistics-and-inventory operator rather than a light marketplace broker.
