callouts:
- calloutType: strength
  title: Survivor advantage after market consolidation
  body: Flink no longer needs to outrun multiple heavily subsidized dedicated quick-commerce rivals in Germany. Public market commentary, K5, Reuters/CNBC coverage of Getir, and Mordor’s GMV-removal estimate all point to a dramatically less crowded dedicated-q-commerce field. That does not prove the model is easy, but it does improve Flink’s odds of converting density into better unit economics than the 2021-2022 cohort achieved.
  claimRefs:
  - CO022
  - CO024
  - CO043
  - CO044
  - CO045
- calloutType: risk
  title: Scale recovery is real, but disclosure quality is still late-stage-private and thin
  body: Flink’s 2026 financing and EBITDA-positive claim look materially better than the 2024 down-round moment, yet investors still lack a public cap-table, preference-stack, founder-ownership, market-level profitability, and active-customer disclosure. Adverse evidence from France, Freiburg labor conflict, Fairwork, and Trustpilot shows that the company’s improved scale story coexists with unresolved governance, labor, and service-quality risk.
