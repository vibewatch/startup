callouts:
- calloutType: strength
  title: The strongest positive financial signal is continuity after break-even claims
  body: A fresh Prosus-led round after public country-level break-even and 2024 EBITDA-profitability claims is much stronger than a generic bridge financing. It suggests at least some high-quality investors believe the repaired core-market model deserves more capital.
  claimRefs:
  - CI008
  - CI009
  - CI010
  - CI036
- calloutType: risk
  title: The biggest remaining gap is cash-flow observability
  body: Public sources describe revenue scale, baskets, and financing, but not company-level free cash flow, debt covenants, or order-source economics. That is why the business can look improved and still remain underwritten only conditionally.
  claimRefs:
  - CI015
