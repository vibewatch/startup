companyProfile:
  summary: >-
    Flink was founded in Berlin at the end of 2020 and now operates as Flink SE, a quick-commerce grocery
    company delivering everyday household items from local urban hubs rather than from third-party supermarkets.
    The company’s public operating footprint is now concentrated in Germany and the Netherlands after exits from
    Austria and France. Flink monetizes through grocery baskets and convenience economics supported by its own
    fulfillment layer, strategic supply and distribution partnerships, and a late-stage private funding base that
    has exceeded $1.5B in disclosed capital while resetting valuation dramatically from boom-era levels.
  foundedDate: '2021-01-19'
  founders:
    - name: Julian Dames
      role: Co-founder and CEO
      background: Publicly presented as Flink's CEO in the March 2026 financing materials and part of the founding leadership group.
      claimRefs: [CO016, CO019]
    - name: Oliver Merkel
      role: Co-founder and Managing Director
      background: Publicly quoted as founder and managing director during the September 2024 financing announcement.
      claimRefs: [CO020]
    - name: Christoph Cordes
      role: Co-founder
      background: Listed by Northzone among the public leaders associated with Flink and included in founder-oriented secondary sources.
      claimRefs: [CO017, CO019]
  foundingLocation: Berlin, Germany
  headquarters: Berlin, Germany
  productSummary: >-
    Consumer grocery-delivery service accessed through mobile apps, with around 2,300-3,000 products surfaced
    through local fulfillment hubs and delivered in roughly 30 minutes by employee couriers on e-bikes.
  customerFocus: >-
    Urban consumer households in Germany and the Netherlands using Flink for urgent top-up shopping, broader
    replenishment, and late-evening convenience grocery needs.
  businessModel: >-
    Owned-fulfillment quick-commerce model monetized through grocery basket margin, delivery or convenience
    economics, and partner-supported demand capture rather than a pure third-party marketplace take rate.
  stage: Private, late-stage
  fundingStatus: >-
    Latest public financing was the March 2026 Prosus-led $100M round at roughly a $900M valuation on Clay,
    following the September 2024 $150M equity-and-debt package at a valuation of just under $1B.
  disclosureProfile: private-undisclosed
  claimRefs: [CO002, CO006, CO007, CO008, CO010, CO012, CI002, CI003, CI005]

summary:
  headline: >-
    Track: Flink looks materially healthier than most quick-commerce peers after surviving the category reset and
    claiming EBITDA profitability in core markets, but the current ~$0.9B-$1.0B private band already reflects
    much of that recovery while labor, retention, and cash-flow proof remain incomplete.
  overallScore: 5.8
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: fair
  keyMetrics:
    valuationUsdM: 900
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: 20
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 1530
    customerCount: null
    headcount: 10000
  topStrengths:
    - >-
      Flink appears to be the leading remaining dedicated quick-commerce operator in Germany and the Netherlands
      after the withdrawal or failure of major direct peers.
    - >-
      Public evidence supports real operating scale: 160 hubs, 22.5 million people in range, and average basket
      values above €45.
    - >-
      Recent financing continuity from REWE, Just Eat Takeaway-linked channels, and Prosus suggests the company
      still attracts sophisticated counterparties after the sector reset.
    - >-
      The business is narrower and more disciplined than during the pan-European land-grab period, which may
      improve the odds that core-market density economics are workable.
  topRisks:
    - >-
      Labor, representation, and employment-law risk remain active and can transmit directly into service quality,
      cost structure, and financing confidence.
    - >-
      Customer-proof is polarized: strong app-store signals coexist with severe public complaints around delays,
      missing items, billing issues, and support failures.
    - >-
      The company still lacks public proof of durable company-level free cash flow, retention quality, and debt or
      preference-stack terms.
    - >-
      Strategic dependence on REWE for supply support and JET/Lieferando for distribution leaves part of the
      economics outside Flink's direct control.
    - >-
      The current private-market band looks fair at best; public evidence does not clearly support paying above it
      without stronger profitability and cohort proof.
  unresolvedGaps:
    - Company-level free cash flow, working-capital behavior, and hub-level contribution margins
    - Retention, repeat-order frequency, and channel-level cohort behavior for owned-app versus partner-acquired customers
    - Debt covenants, maturity, dilution, and preference-stack structure across recent rounds
    - Current legal-case inventory, reserve history, and labor-relations mitigation maturity by market
    - Commercial terms and downside protections in REWE supply and JET/Lieferando distribution relationships

