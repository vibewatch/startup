summary:
  headline: >-
    Track: Flink looks materially healthier than most quick-commerce peers after surviving the category reset and
    claiming EBITDA profitability in core markets, but the current ~$0.9B-$1.0B private band already reflects much of
    that recovery while labor, retention, and cash-flow proof remain incomplete.
