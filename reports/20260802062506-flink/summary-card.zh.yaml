summary:
  headline: 观察：Flink 熬过品类重置，并称核心市场实现 EBITDA 盈利，相比多数即时零售同行明显更健康；但当前约 $0.9B-$1.0B 的私募市场区间已经反映了大部分修复，劳工、留存和现金流证据仍未补齐。
