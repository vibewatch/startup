  topStrengths:
    - 主要直接竞争对手退出或倒下后，Flink 似乎已是德国和荷兰仍在运营的专门即时零售平台里领先的一家。
    - 公开证据支撑其真实运营规模：160 个前置仓、覆盖 22.5 million 人，客单价高于 €45。
    - REWE、Just Eat Takeaway 关联渠道和 Prosus 近期继续提供融资，说明行业重置后公司仍能吸引成熟交易对手。
    - 相比泛欧洲抢地盘时期，如今业务更窄、更克制，核心市场密度经济模型跑通的概率可能更高。
  topRisks:
    - 劳工、代表权和雇佣法风险仍在发酵，可能直接传导到服务质量、成本结构和融资信心。
    - 客户证据两极分化：应用商店信号强，但公开投诉里延迟、缺货、账单问题和客服失灵都很严重。
    - 公司仍没有公开证明公司层面的自由现金流可持续，也缺少留存质量、债务和优先股堆叠条款证据。
    - 供应支持依赖 REWE，分销依赖 JET/Lieferando，导致部分经济性不在 Flink 直接掌控之内。
    - 当前私募市场区间至多算合理；若没有更强的盈利和队列证据，公开证据并不明确支持在该区间之上出价。
  unresolvedGaps:
    - 公司层面的自由现金流、营运资本表现和前置仓层面贡献利润率
    - 自有 app 与合作伙伴获客客户的留存、复购频次和渠道层面队列表现
    - 近期融资轮次里的债务约束、到期日、稀释和优先股堆叠结构
    - 当前法律案件清单、准备金历史，以及各市场劳资关系缓释机制成熟度
    - REWE 供应关系和 JET/Lieferando 分销关系中的商业条款与下行保护
