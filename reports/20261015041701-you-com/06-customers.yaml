schemaVersion: report-v2
artifact: customers
slug: you-com
runDate: 2026-10-15
company:
  name: You.com
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports a real enterprise/API buyer base and meaningful usage scale for
    You.com: official materials claim 57% of Fortune 500 usage, Anthropic cites 1 billion
    lifetime queries and 1000% revenue growth, and Sacra estimates 170% NDR and $90M ARR by
    December 2025. The weaker point is durability proof: named public customer references are
    still narrower than the breadth claims, and concentration, contract length, and cohort
    retention remain undisclosed in this source set.
sections:
  - id: buyer-segment-mix
    title: Buyer, user, and channel mix skew toward enterprise builders and knowledge teams
    body: >-
      The customer picture in public sources is now much more enterprise- and developer-led than
      consumer-search-led. Official pages consistently position You.com as infrastructure for
      agents and LLM applications, with Web Search, Contents, Research, and Finance Research APIs
      sold into teams that need live, cited retrieval rather than a static chatbot. The comparison
      page broadens that buyer set into enterprise admins and knowledge teams by emphasizing
      multi-model access, private-data integration, onboarding, and engineering support. The
      result is a customer map with at least four distinct surfaces: self-serve developers using
      usage-priced APIs, enterprise platform owners buying compliance and throughput controls,
      knowledge-worker teams consuming research/agent workflows, and embedded platform partners
      that bring You.com into their own end-user products.
    claimRefs: [CU001, CU002, CU003, CU010, CU011]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Adoption breadth is credible, but most headline proof is company-authored or company-quoted
    body: >-
      The public adoption signals are stronger than in the prior report but remain uneven in
      reference quality. Official marketing now claims 57% of Fortune 500 companies already use
      You.com, while Anthropic's case study says the company has reached 1 billion lifetime queries
      and a 1000% revenue increase. Independent and semi-independent sources add more concrete
      scale markers: Sacra estimates $90M ARR by December 2025, 170% net dollar retention, more
      than 1 billion queries per month, and over 100,000 agents built on the platform during 2025;
      SiliconANGLE quotes the company naming DuckDuckGo, Windsurf, and Harvey as API customers; and
      Business Wire documents a public election-results deployment with TollBit and Decision Desk
      HQ on You.com's Custom AI Agent platform. That is enough to underwrite real production usage,
      but not enough to conclude that the broadest customer-count claims are independently
      corroborated.
    claimRefs: [CU004, CU005, CU007, CU008, CU009, CU011, CU012, CU013]
    tableRefs: [TU002, TU003]
  - id: durability-and-concentration
    title: Expansion motion looks plausible; concentration and renewal quality still require diligence
    body: >-
      The best public evidence for durability is directional rather than decisive. Sacra's 170%
      NDR estimate and its description of a self-serve-to-enterprise upsell ladder fit the product
      architecture and pricing logic on official pages, suggesting a land-and-expand motion once a
      team embeds retrieval or research APIs in production workflows. But the chapter still cannot
      verify gross retention, cohort retention, contract length, top-customer exposure, or how much
      of usage comes from a few large embedded accounts versus a broader long tail. AI Matrix Map's
      note that no eligible recent coverage was found reinforces the same limitation: recent
      independent customer evidence is thinner than the adoption narrative, so concentration and
      reference quality remain material diligence gaps rather than closed questions.
    claimRefs: [CU008, CU009, CU010, CU014]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Self-serve developers
        - "Buyer/payer: engineering or product team lead; user: builders shipping RAG/agent apps"
        - Web Search and Contents APIs for live retrieval and content extraction
        - Free daily Search API quota plus published usage pricing
        - Low-friction entry point that can widen into paid API consumption
        - Public sources do not reveal conversion from free usage to paid accounts
      - - Enterprise platform owners
        - "Buyer/payer: enterprise IT, data, or platform owner; user: internal application teams"
        - Zero-data-retention, DPA-ready, custom-QPS deployments with annual commitments
        - Official pages and Sacra both describe enterprise controls and negotiated contracts
        - Higher-value contracts likely bundle throughput, compliance, and support
        - Contract size, duration, and renewal data are not disclosed
      - - Knowledge-worker teams
        - "Buyer/payer: functional leaders; user: analysts, researchers, marketers, legal teams"
        - Research agents, cited answers, and custom internal AI agents
        - Anthropic and The Innovator both describe research and workflow automation usage
        - Supports expansion into higher-effort research and agent products
        - Public evidence does not separate seat-style usage from API consumption
      - - Embedded platform partners
        - "Buyer/payer: external software/platform partner; user: partner end users"
        - You.com search/research infrastructure inside third-party products
        - SiliconANGLE names DuckDuckGo, Windsurf, and Harvey as API customers
        - Strategic because one integration can drive large query volume
        - Public evidence does not disclose customer concentration or revenue mix by account
    notes: >-
      Segment map synthesizes official positioning and third-party writeups; null financial fields
      reflect undisclosed contract values and account counts rather than zero demand.
    claimRefs: [CU001, CU002, CU003, CU010, CU011, CU013]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Revenue growth
        - 1000% since January
        - Undated case study fetched 2026-10-15
        - Anthropic case study
        - Medium
        - Strong growth signal tied to customer usage and product uptake
        - No starting revenue base or product-line split
      - - Lifetime query volume
        - 1 billion lifetime queries
        - Undated case study fetched 2026-10-15
        - Anthropic case study
        - Medium
        - Confirms meaningful historical platform usage
        - No active-account, paying-customer, or cohort denominator
      - - User outcome
        - 15% productivity increase; nearly 1 day saved per week
        - Undated case study fetched 2026-10-15
        - Anthropic case study
        - Medium
        - Suggests ROI language that can support expansion into knowledge workflows
        - Sample size, methodology, and paid-vs-free mix are undisclosed
      - - ARR estimate
        - $90M ARR in Dec 2025 vs $20M at end-2024
        - 2025-12
        - Sacra estimate
        - Medium
        - Indicates commercial traction after the enterprise/API pivot
        - Estimate, not audited revenue; no segmentation by product or customer class
      - - Net dollar retention estimate
        - 170%
        - 2025
        - Sacra estimate
        - Medium
        - Supports a land-and-expand story after initial deployment
        - No GRR, cohort math, or retention distribution by account size
      - - Queries per month
        - More than 1B per month
        - 2025
        - Sacra; later echoed by SiliconANGLE quote
        - Medium
        - Suggests current production usage at scale
        - Unclear how much comes from a few large integrations versus many accounts
      - - Agents built on platform
        - More than 100,000 agents during 2025
        - 2025
        - Sacra
        - Medium
        - Shows breadth of builder activity on the platform
        - No disclosed unique-organization count or active-agent retention
      - - Enterprise penetration claim
        - 57% of Fortune 500 companies already use You.com
        - 2026 public marketing page
        - You.com comparison page
        - Medium
        - Implies broad enterprise top-of-funnel or deployment reach
        - No definition of "use," paid conversion, or depth of deployment
    notes: >-
      Table mixes official claims, partner proof, and independent estimates; values are preserved
      as published and should not be treated as audited customer-account counts.
    claimRefs: [CU004, CU005, CU006, CU007, CU008, CU009, CU011]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - DuckDuckGo
        - Consumer search / AI interface platform
        - Listed by company leadership as an API customer in monthly-query disclosure
        - Claimed production
        - Appears in the set of companies behind You.com's reported 1B+ monthly query scale
        - Evidence is a third-party article quoting the company, not a customer-authored reference
      - - Windsurf
        - Developer tooling
        - Listed by company leadership as an API customer in monthly-query disclosure
        - Claimed production
        - Supports the thesis that You.com sells infrastructure into developer products
        - No public detail on spend, query share, or contract duration
      - - Harvey
        - Legal AI software
        - Listed by company leadership as an API customer in monthly-query disclosure
        - Claimed production
        - Shows adoption outside generic search into vertical knowledge workflows
        - Still company-reported rather than independently described by the customer
      - - TollBit / Decision Desk HQ Election Agent
        - Media / real-time data ecosystem
        - Election-results agent launched on You.com's Custom AI Agent platform with DDHQ data
        - Public launch / event-specific production proof
        - Demonstrates a real third-party deployment around authoritative real-time data
        - Partner-announced use case, not proof of recurring enterprise spend or renewal
    notes: >-
      This is a sample of public named proofs, not an exhaustive customer list; the table combines
      named accounts and one named deployment because recent independent customer-authored proof is
      limited in the assigned pool.
    enumerationScope:
      coverage: sample
      basis: Public named accounts were limited to assigned prefetched sources spanning official, partner, and independent writeups as of the 2026-10-15 run.
    claimRefs: [CU004, CU011, CU012]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Public evidence points to a self-serve-to-enterprise expansion loop anchored on retrieval APIs, higher-value research workflows, and compliance controls.
    data:
      nodes:
        - label: Self-serve API discovery
          summary: Developers encounter low-friction web and content APIs built for agents and LLM apps.
          touchpoints:
            - Free daily Search API quota
            - Interactive demo and docs
            - Usage-based entry pricing
          claimRefs: [CU001, CU010]
        - label: Production retrieval adoption
          summary: Teams operationalize live search, extraction, and grounded answers inside applications.
          touchpoints:
            - Web Search API
            - Contents API
            - Grounded answer flow
          claimRefs: [CU001, CU002, CU010]
        - label: Research-layer expansion
          summary: Higher-effort research workflows broaden usage once teams need cited synthesis rather than raw retrieval.
          touchpoints:
            - Research API
            - Finance Research API
            - Source-backed report generation
          claimRefs: [CU002, CU010]
        - label: Enterprise hardening
          summary: Security, privacy, and throughput features become the enterprise buyer hooks.
          touchpoints:
            - Zero data retention
            - DPA-ready posture
            - Custom QPS limits
            - Onboarding and engineering support
          claimRefs: [CU002, CU003]
        - label: Internal workflow proliferation
          summary: Custom agents and private-data connections expand usage across departments and use cases.
          touchpoints:
            - Custom AI agents
            - Company data integration
            - Nearly 100,000 internal-use agents
          claimRefs: [CU003, CU013]
        - label: Reference and renewal checkpoint
          summary: Public proof then shifts to broad adoption claims, named accounts, and expansion metrics, with concentration still opaque.
          touchpoints:
            - 57% Fortune 500 claim
            - 170% NDR estimate
            - DuckDuckGo / Windsurf / Harvey references
          claimRefs: [CU004, CU008, CU011]
    claimRefs: [CU001, CU002, CU003, CU004, CU008, CU010, CU011, CU013]
callouts:
  - calloutType: strength
    title: Expansion motion is plausible, but not independently closed
    body: >-
      The product stack and pricing architecture support a credible land-and-expand motion: teams
      can start with low-cost retrieval, then move into cited synthesis, custom agents, enterprise
      controls, and annual contracts. Sacra's 170% NDR estimate fits that story, but the strongest
      renewal evidence is still an external estimate rather than customer-level cohort disclosure.
    claimRefs: [CU002, CU008, CU010]
  - calloutType: risk
    title: Reference quality lags the breadth of the headline adoption claims
    body: >-
      Named public customer proof is materially narrower than the company's broad enterprise-usage
      messaging. Recent independent coverage is thin, most named accounts are surfaced through
      company-authored or company-quoted materials, and concentration and contract-term evidence is
      still absent from the public record in this pool.
    claimRefs: [CU004, CU011, CU012, CU014]
