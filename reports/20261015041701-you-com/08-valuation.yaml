schemaVersion: report-v2
artifact: valuation
slug: you-com
runDate: 2026-10-15
company:
  name: You.com
chapter:
  number: 8
  title: Valuation
  summary: >-
    You.com has enough product and customer proof to merit continued diligence, but the public
    record still underwrites relevance more clearly than durable economics or downside protection.
    With the last visible mark at $1.5 billion and only estimated ARR support, the current stance is
    research-more / high risk / stretched until cap-table, margin, and current-round terms are
    verified.
sections:
  - id: price-sensitive-conclusion
    title: Price-sensitive conclusion
    body: >-
      The public record supports a real company with product breadth, named enterprise usage, and
      recent financing access, but it does not yet support a clean underwrite of the visible price
      context. The September 2025 Series C reset the reference mark to $1.5 billion, while the best
      public revenue anchor remains Sacra's estimate of $90 million ARR in December 2025, which
      implies roughly 16.7x ARR before any adjustment for private-market preferences, secondaries,
      or cash burn. Because those downside terms remain undisclosed and the available 2026
      fundraising signal exposes only marketplace disclaimers rather than company-specific pricing,
      the disciplined call is to keep the name in diligence rather than force a buy recommendation
      on incomplete economics.
    claimRefs: [CV001, CV006, CV009, CV012, CV015, CV016]
    tableRefs: [TV001]
  - id: valuation-anchors-and-evidence-limits
    title: Valuation anchors and evidence limits
    body: >-
      What is visible publicly is directionally constructive: official and third-party coverage
      agree on the $100 million Series C, total disclosed capital is roughly $199 million, official
      channels cite more than 1 billion monthly queries, and current product pages show an enterprise
      API stack rather than a consumer-search story. What remains missing is just as important for
      valuation: ARR and NDR are available only through third-party estimates, published pricing
      says more about list-card monetization than realized gross margin, and the materials reviewed
      here do not expose the current share price, liquidation preference stack, secondary activity,
      or current cash balance. That leaves the evidence strong enough to support relevance, but
      still too incomplete to certify entry terms.
    claimRefs: [CV001, CV002, CV003, CV005, CV006, CV007, CV008, CV012, CV013, CV015]
    tableRefs: [TV002]
  - id: scenario-framing
    title: Scenario framing
    body: >-
      The bull case is that You.com converts real product proof into a durable infrastructure
      franchise: usage expands, retention stays strong, and higher-value research products lift
      revenue faster than input costs. The base case is more modest: the business keeps growing, but
      investors still lack enough public evidence on margin durability, concentration, or preference
      overhang to pay up from today's mark. The bear case is not demand disappearing; it is price
      and cost pressure colliding with opaque terms, so a later round clears at weaker economics or
      with more investor protections than the headline valuation suggests. That asymmetry explains
      why the recommendation stays price-disciplined even though customer relevance looks credible.
      The assigned evidence contains no model-appropriate public-company, private-round, or M&A
      benchmark set beyond You.com's own round and Sacra's company estimate, so these scenarios are
      sensitivities around the known mark rather than comp-derived price targets.
    claimRefs: [CV003, CV004, CV005, CV006, CV008, CV009, CV010, CV013, CV014, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: final-diligence-and-kill-triggers
    title: Final diligence and kill triggers
    body: >-
      The next diligence cycle should focus on the items that most directly change value rather than
      repeat product-market-fit work already visible in public sources. Management needs to prove
      current ARR quality, gross margin after data-acquisition and model-inference costs, customer
      concentration, and the exact mechanics of the active financing path, including price, seniority,
      and any secondary component. Governance review should also quantify Richard Socher's time
      allocation while he leads You.com and separately pursues Recursive AI. A move toward invest
      would require clean evidence that expansion economics outrun content and compute costs and
      that the new money is not hiding punitive preferences. A kill signal would be any combination
      of weakening retention, rising content access friction, a down-round structure, or governance
      drift that keeps the company relevant but makes the current valuation hard to monetize for a
      new investor.
    claimRefs: [CV004, CV007, CV010, CV011, CV012, CV014, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary table
    columns: [Dimension, Current view, Evidence basis, Decision implication]
    rows:
      - [Recommendation, research-more, "Real product and funding proof, but no public underwrite of current round terms.", "Continue diligence; do not underwrite the visible price context yet."]
      - [Confidence, medium, "Round and scale signals are corroborated, while revenue quality and unit economics remain only partially visible.", "Treat present view as evidence-sensitive and reversible with better data."]
      - [Risk rating, high, "Illiquidity, preference opacity, and margin/cost uncertainty outweigh the comfort of a recent unicorn mark.", "Require downside protections or better proof before committing capital."]
      - [Valuation stance, stretched, "The last visible $1.5B mark sits on estimated ARR support and incomplete cap-table disclosure.", "Entry discipline matters more than company-quality scoring."]
    notes: Public evidence supports the directional call, but current share price, preferences, secondaries, and cash balance are not disclosed in the reviewed materials.
    claimRefs: [CV009, CV011, CV012, CV014, CV015, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Vector, Bull case, Anti-thesis, What would change the view]
    rows:
      - ["Enterprise demand", "Named deployments and >1B monthly queries imply real workflow relevance.", "Reference customers do not prove cohort durability or concentration quality.", "Customer cohort data, renewal curves, and account concentration by ARR."]
      - ["Monetization model", "Usage-based search, content, research, and finance APIs create an upsell ladder.", "List pricing does not prove realized gross margin after crawl, inference, and data-licensing costs.", "Gross margin bridge by product family and evidence of positive contribution margins."]
      - ["Growth efficiency", "Estimated $90M ARR and 170% NDR imply strong expansion if accurate.", "Both figures are third-party estimates rather than management-grade public disclosures.", "Board-quality ARR, burn, CAC-payback, and NDR reporting."]
      - ["Entry terms", "Recent financing access suggests investors still want exposure.", "Public materials do not reveal price per share, seniority, or secondary mix, so downside protection is unclear.", "Current term sheet, preference stack, and any side letters or secondary allocations."]
      - ["Leadership focus", "Founder-led technical credibility remains an asset.", "The CEO also leads a separate AI research company, creating a key-person allocation question.", "Board-approved allocation, succession coverage, and related-party governance documentation."]
      - ["Comparable benchmark", "The latest round supplies a real company-specific price anchor.", "No retained public-company, private-round, or M&A set is sufficiently comparable to establish a market multiple.", "A banker-quality comp set normalized for growth, margin, scale, and security terms."]
    notes: The table separates what public evidence supports from the data-room items still needed to convert relevance into an investable entry.
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV008, CV011, CV012, CV013, CV014, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, "Valuation / return logic", Key risks, "Probability signal"]
    rows:
      - [Bull, "Estimated ARR proves conservative, retention remains elite, and enterprise workloads migrate up the pricing stack.", "Above $1.5B only if management-grade ARR, retention, and margin evidence supports a premium infrastructure multiple; no upper bound is supportable publicly.", "Execution complexity, platform bundling, and content access costs still have to stay controlled.", "Requires management-grade evidence that public sources do not yet provide."]
      - [Base, "Demand remains healthy, but margin visibility and cap-table opacity persist through the next financing window.", "At or below the $1.5B anchor, with no uplift underwritten until terms and margins are verified.", "Multiple compression or investor-protective terms can offset operating progress.", "Best fit with the current evidence set."]
      - [Bear, "Content acquisition and inference costs rise faster than pricing, while later financing clears on weaker economics.", "Below the $1.5B anchor; the public record does not support a defensible floor.", "Down-round risk, punitive preferences, and lower liquidity for new entrants.", "Credible if diligence cannot close unit-economics and terms gaps."]
    notes: These scenarios are directional valuation frames, not precise price targets, because public evidence does not disclose cap-table mechanics or audited unit economics.
    claimRefs: [CV001, CV006, CV008, CV009, CV010, CV011, CV012, CV014, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Scale and product proof are real, but the entry call stays constrained by economics and terms opacity.
    data:
      nodes:
        - id: proof
          label: Enterprise relevance proven
          detail: Named customers and more than 1 billion monthly queries show real market pull.
          tone: positive
        - id: monetization
          label: Monetization path exists
          detail: Usage-based API pricing and expansion signals create upside if workloads deepen.
          tone: opportunity
        - id: economics
          label: Economics still estimated
          detail: ARR and NDR are visible only through third-party estimates, while margins remain private.
          tone: warning
        - id: price
          label: Last visible price is rich
          detail: The public anchor is a $1.5B Series C, or about 16.7x estimated ARR.
          tone: warning
        - id: terms
          label: Downside protection unclear
          detail: Current round terms, preference stack, secondaries, and cash balance are not publicly disclosed.
          tone: adverse
        - id: call
          label: Research-more / stretched
          detail: Keep diligence active, but require better economics and terms proof before investing.
          tone: risk
      edges:
        - from: proof
          to: monetization
          label: Product relevance can monetize.
        - from: monetization
          to: economics
          label: But realized efficiency is still unproven.
        - from: economics
          to: price
          label: Limited proof weakens the price anchor.
        - from: price
          to: terms
          label: Rich marks need strong protections.
        - from: terms
          to: call
          label: Missing protections keep the call cautious.
    claimRefs: [CV003, CV009, CV013, CV014, CV016]
callouts:
  - calloutType: recommendation
    title: Current call
    body: Research-more is the disciplined outcome because public evidence validates relevance faster than it validates downside protection.
    claimRefs: [CV014, CV016]
  - calloutType: risk
    title: Decisive blocker
    body: The valuation debate turns less on whether the product matters and more on whether the next investor gets acceptable terms against still-private unit economics.
    claimRefs: [CV011, CV012, CV015]
