chapter:
  number: 3
  title: "Competitors"
  summary: "You.com competes most directly with AI-native search and research API vendors, but the real substitute set is broader: answer engines like Perplexity, internal-search agents like Glean and Moveworks, and raw SERP plus extraction stacks all solve parts of the same job. Public evidence supports You.com's differentiation in the breadth of its retrieval-to-synthesis ladder and enterprise controls, while also showing a crowded category with near-par base search pricing and supplier-side content-access risk."
sections:
  - id: "landscape"
    title: "Landscape: direct APIs, substitutes, and internal-search adjacencies"
    body: >-
      The buyer decision is broader than a single head-to-head against one API vendor. Public evidence shows that You.com now presents itself as infrastructure for developers and enterprises building grounded AI agents, which puts it in direct competition with AI-native search and research APIs, while answer engines, internal-search agents, and raw SERP stacks remain viable substitutes for the same underlying job. Perplexity is the clearest consumer-search substitute, Exa and Brave compete as developer-facing retrieval layers, and SerpAPI-like raw search remains the status-quo build path for teams willing to assemble their own extraction and synthesis stack. Sacra also places ARI against Glean, Guru, and Moveworks for enterprise research workflows, which means internal-knowledge tools are adjacent incumbents whenever the workflow starts with private data rather than the open web.
    claimRefs: [CP001, CP003, CP005, CP006, CP007, CP008, CP011, CP015]
    tableRefs: [TP001]
  - id: "capabilities"
    title: "Capability and positioning"
    body: >-
      The strongest evidence-backed differentiation is not a single benchmark result; it is the shape of the product ladder. Official surfaces and independent roundups consistently describe You.com as spanning raw web search, page extraction, grounded answers, and multi-step research, which reduces the number of vendors a developer needs to combine when moving from basic retrieval to a cited workflow. That breadth is especially relevant against Exa and SerpAPI-style stacks, where buyers often add separate extraction or synthesis components, and against internal-search agents, which Sacra says still need a live-web layer on top of private data. The tradeoff is that some of You.com's public feature claims come from company-controlled sources, so buyers still need their own evaluation workload before treating benchmark leadership as durable proof.
    claimRefs: [CP002, CP004, CP006, CP011, CP012, CP013, CP015]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: "pricing-distribution"
    title: "Pricing, packaging, and distribution leverage"
    body: >-
      Public list pricing makes the category unusually easy to test and unusually hard to defend on sticker price alone. You.com's entry point is free for the first 100 Search API calls per day, then usage-based, which lowers adoption friction for developers and makes the buying conversation quickly shift to architecture, compliance, and depth. Brave's base search pricing is roughly at parity, Exa charges more for search and adds separate contents retrieval, and Perplexity offers both a hosted answer path and a raw Search API. That means You.com's distribution advantage comes less from being cheapest and more from letting a customer stay inside one ladder as needs move from retrieval to synthesis, while enterprise controls such as SDKs, MCP, ZDR, and custom QPS make expansion easier once an account lands.
    claimRefs: [CP002, CP004, CP007, CP008, CP009, CP012, CP013]
    tableRefs: [TP003]
  - id: "durability-risks"
    title: "Durability, switching costs, and displacement risk"
    body: >-
      The moat looks real but not yet impregnable. Sacra's traction indicators suggest You.com has reached meaningful operating scale, which matters because ecosystem usage can compound distribution and give the company more surface area than a point search API. Even so, switching costs appear moderate at entry because buyers can start self-serve on transparent per-call pricing and move across several competing APIs with similar base economics. The more durable edge is in account deepening: once a customer depends on multiple endpoints, enterprise compliance controls, and a live-web layer on top of private data, replacement becomes more painful. The clearest adverse evidence is structural rather than reputational: price clustering compresses differentiation, and tightening publisher controls can degrade the very content access that powers You.com's core value proposition.
    claimRefs: [CP010, CP012, CP013, CP014, CP015]
