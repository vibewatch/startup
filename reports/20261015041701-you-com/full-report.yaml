  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct APIs, substitutes, and internal-search adjacencies'
        blocks:
          - type: paragraph
            body: >-
              The buyer decision is broader than a single head-to-head against one API vendor. Public evidence shows
              that You.com now presents itself as infrastructure for developers and enterprises building grounded AI
              agents, which puts it in direct competition with AI-native search and research APIs, while answer engines,
              internal-search agents, and raw SERP stacks remain viable substitutes for the same underlying job.
              Perplexity is the clearest consumer-search substitute, Exa and Brave compete as developer-facing retrieval
              layers, and SerpAPI-like raw search remains the status-quo build path for teams willing to assemble their
              own extraction and synthesis stack. Sacra also places ARI against Glean, Guru, and Moveworks for
              enterprise research workflows, which means internal-knowledge tools are adjacent incumbents whenever the
              workflow starts with private data rather than the open web.
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
              - CP007
              - CP008
              - CP011
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP011
              - CP015
      - number: '3.2'
        title: Capability and positioning
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence-backed differentiation is not a single benchmark result; it is the shape of the
              product ladder. Official surfaces and independent roundups consistently describe You.com as spanning raw
              web search, page extraction, grounded answers, and multi-step research, which reduces the number of
              vendors a developer needs to combine when moving from basic retrieval to a cited workflow. That breadth is
              especially relevant against Exa and SerpAPI-style stacks, where buyers often add separate extraction or
              synthesis components, and against internal-search agents, which Sacra says still need a live-web layer on
              top of private data. The tradeoff is that some of You.com's public feature claims come from
              company-controlled sources, so buyers still need their own evaluation workload before treating benchmark
              leadership as durable proof.
            claimRefs:
              - CP002
              - CP004
              - CP006
              - CP011
              - CP012
              - CP013
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
