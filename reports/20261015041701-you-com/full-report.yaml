              - CO009
              - CO010
              - CO012
      - number: '1.4'
        title: Milestones, Product Evolution, and Current Watchpoints
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a company that has steadily reframed itself around enterprise-grade retrieval
              and agent tooling. Sacra's early financing chronology places seed and Series A rounds in 2021 and 2022,
              followed by the clearer 2024 Series B and the disputed-but-important 2025 Series C valuation event.
              Product and partnership milestones support the pivot story: November 2024's Election Agent launch
              demonstrated a workflow-specific application built with outside data partners, and August 2025's API-layer
              announcement formalized unified web and news search, an API management console, and benchmark-led claims
              about accuracy, freshness, latency, and cost. The main watchpoint is that public scale and product breadth
              now look more mature than public governance and economics. Until management clarifies board oversight,
              true headcount, and the definitive Series C capitalization package, the company overview supports
              relevance and momentum more confidently than full investability.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO014
              - CO015
