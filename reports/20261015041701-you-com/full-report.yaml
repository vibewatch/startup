              - CP004
              - CP005
              - CP006
              - CP008
              - CP012
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP011
              - CP015
      - number: '3.3'
        title: Pricing, packaging, and distribution leverage
        blocks:
          - type: paragraph
            body: >-
              Public list pricing makes the category unusually easy to test and unusually hard to defend on sticker
              price alone. You.com's entry point is free for the first 100 Search API calls per day, then usage-based,
              which lowers adoption friction for developers and makes the buying conversation quickly shift to
              architecture, compliance, and depth. Brave's base search pricing is roughly at parity, Exa charges more
              for search and adds separate contents retrieval, and Perplexity offers both a hosted answer path and a raw
              Search API. That means You.com's distribution advantage comes less from being cheapest and more from
              letting a customer stay inside one ladder as needs move from retrieval to synthesis, while enterprise
              controls such as SDKs, MCP, ZDR, and custom QPS make expansion easier once an account lands.
            claimRefs:
              - CP002
              - CP004
              - CP007
              - CP008
              - CP009
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP013
      - number: '3.4'
        title: Durability, switching costs, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat looks real but not yet impregnable. Sacra's traction indicators suggest You.com has reached
              meaningful operating scale, which matters because ecosystem usage can compound distribution and give the
              company more surface area than a point search API. Even so, switching costs appear moderate at entry
              because buyers can start self-serve on transparent per-call pricing and move across several competing APIs
              with similar base economics. The more durable edge is in account deepening: once a customer depends on
              multiple endpoints, enterprise compliance controls, and a live-web layer on top of private data,
              replacement becomes more painful. The clearest adverse evidence is structural rather than reputational:
              price clustering compresses differentiation, and tightening publisher controls can degrade the very
              content access that powers You.com's core value proposition.
            claimRefs:
              - CP010
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The integrated API ladder is the cleanest differentiator
            body: >-
              The strongest competitive argument is that buyers can start with cheap retrieval and stay inside the same
              platform as they move toward answer generation and multi-step research.
            calloutType: strength
            claimRefs:
              - CP004
              - CP009
              - CP012
          - type: callout
            title: Crowding limits moat durability
            body: >-
              Public base-search prices cluster tightly across the category, so You.com still has to prove that workflow
              breadth and enterprise controls matter more than modest sticker-price differences.
            calloutType: risk
            claimRefs:
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture and public price ladder
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a revenue model built around web-grounding infrastructure rather than a broad
              seat-based SaaS plan. Official surfaces describe Web Search, Contents, Research, and Finance Research
              APIs, while independent analysis says revenue comes primarily from usage-based APIs and custom enterprise
              deployments. The price ladder is visible at list level: Search begins with a free daily quota and then
              per-call billing, Contents is metered per page, Research scales by effort tier, and Finance Research
              carries a higher price point. That creates a clear expansion path from lightweight retrieval into
              higher-value synthesis, but it still exposes only list pricing rather than realized net pricing by
              customer cohort.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
