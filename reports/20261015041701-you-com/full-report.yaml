          - type: figure
            figureRef: FE001
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
      - number: '5.3'
        title: Differentiation and maturity signals
        blocks:
          - type: paragraph
            body: >-
              Public differentiation rests on three repeated themes: grounded research, model flexibility, and
              private-data integration. Independent sources support the positioning that You.com has shifted from a
              consumer-search story toward AI search infrastructure and enterprise research tooling, and they also point
              to 2026 product movement such as a Frontier-tier update and asynchronous background support for longer
              research tasks. The architecture is therefore broad enough to cover simple search, full-page extraction,
              and multi-step research, but most public proof still comes from product copy, benchmark summaries, and
              editorial profiles rather than hard deployment telemetry or neutral technical case studies.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE005
              - CE007
              - CE011
              - CE013
      - number: '5.4'
        title: Trust controls, implementation risk, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              You.com markets an enterprise-trust layer aggressively: zero data retention, SOC 2 certification, DPA
              readiness, and custom throughput controls all appear on official surfaces and in third-party summaries.
              That matters because the product promise depends on connecting AI systems to current web data and, in some
              cases, private enterprise data. The gap is that public operational evidence is thinner than the control
              claims. Independent profiles still flag API-access, billing, support, or trust concerns, and the assigned
              evidence pool does not provide a public status archive, uptime history, or detailed architecture for
              tenancy isolation, connector behavior, and observability. For diligence, the product looks real and
              commercially legible; the remaining risk is execution proof, not feature enumeration.
            claimRefs:
              - CE007
              - CE011
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Modular retrieval stack is visible in public docs
            body: >-
              The product is not marketed as a single opaque model endpoint: public docs separate search, content
              extraction, cited research, and finance research, which makes the commercial workflow legible to technical
              buyers.
            calloutType: strength
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE006
          - type: callout
            title: Public operational proof still trails feature breadth
            body: >-
              Security and control language is strong, but the assigned evidence pool does not show a public status
              archive, SLA history, or deep technical implementation detail for isolation and observability, so
              deployment risk still has to be diligence-tested directly.
            calloutType: risk
            claimRefs:
              - CE007
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and channel mix skew toward enterprise builders and knowledge teams
        blocks:
          - type: paragraph
            body: >-
              The customer picture in public sources is now much more enterprise- and developer-led than
              consumer-search-led. Official pages consistently position You.com as infrastructure for agents and LLM
              applications, with Web Search, Contents, Research, and Finance Research APIs sold into teams that need
              live, cited retrieval rather than a static chatbot. The comparison page broadens that buyer set into
              enterprise admins and knowledge teams by emphasizing multi-model access, private-data integration,
              onboarding, and engineering support. The result is a customer map with at least four distinct surfaces:
              self-serve developers using usage-priced APIs, enterprise platform owners buying compliance and throughput
              controls, knowledge-worker teams consuming research/agent workflows, and embedded platform partners that
              bring You.com into their own end-user products.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU010
              - CU011
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU010
              - CU011
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU008
              - CU010
              - CU011
              - CU013
      - number: '6.2'
        title: Adoption breadth is credible, but most headline proof is company-authored or company-quoted
        blocks:
          - type: paragraph
            body: >-
              The public adoption signals are stronger than in the prior report but remain uneven in reference quality.
              Official marketing now claims 57% of Fortune 500 companies already use You.com, while Anthropic's case
              study says the company has reached 1 billion lifetime queries and a 1000% revenue increase. Independent
              and semi-independent sources add more concrete scale markers: Sacra estimates $90M ARR by December 2025,
              170% net dollar retention, more than 1 billion queries per month, and over 100,000 agents built on the
              platform during 2025; SiliconANGLE quotes the company naming DuckDuckGo, Windsurf, and Harvey as API
              customers; and Business Wire documents a public election-results deployment with TollBit and Decision Desk
              HQ on You.com's Custom AI Agent platform. That is enough to underwrite real production usage, but not
              enough to conclude that the broadest customer-count claims are independently corroborated.
            claimRefs:
              - CU004
              - CU005
              - CU007
              - CU008
              - CU009
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU011
              - CU012
      - number: '6.3'
        title: Expansion motion looks plausible; concentration and renewal quality still require diligence
        blocks:
          - type: paragraph
            body: >-
              The best public evidence for durability is directional rather than decisive. Sacra's 170% NDR estimate and
              its description of a self-serve-to-enterprise upsell ladder fit the product architecture and pricing logic
              on official pages, suggesting a land-and-expand motion once a team embeds retrieval or research APIs in
              production workflows. But the chapter still cannot verify gross retention, cohort retention, contract
              length, top-customer exposure, or how much of usage comes from a few large embedded accounts versus a
              broader long tail. AI Matrix Map's note that no eligible recent coverage was found reinforces the same
              limitation: recent independent customer evidence is thinner than the adoption narrative, so concentration
              and reference quality remain material diligence gaps rather than closed questions.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Expansion motion is plausible, but not independently closed
            body: >-
              The product stack and pricing architecture support a credible land-and-expand motion: teams can start with
              low-cost retrieval, then move into cited synthesis, custom agents, enterprise controls, and annual
              contracts. Sacra's 170% NDR estimate fits that story, but the strongest renewal evidence is still an
              external estimate rather than customer-level cohort disclosure.
            calloutType: strength
            claimRefs:
              - CU002
              - CU008
              - CU010
          - type: callout
            title: Reference quality lags the breadth of the headline adoption claims
            body: >-
              Named public customer proof is materially narrower than the company's broad enterprise-usage messaging.
              Recent independent coverage is thin, most named accounts are surfaced through company-authored or
              company-quoted materials, and concentration and contract-term evidence is still absent from the public
              record in this pool.
            calloutType: risk
            claimRefs:
              - CU004
              - CU011
              - CU012
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual risk profile
        blocks:
          - type: paragraph
            body: >-
              The risk picture is dominated by three linked exposures. First, product quality and gross margin depend on
              sustained access to fresh, licensable web content; that is a real external dependency, not a cosmetic
              feature, because You.com's own architecture pitch relies on live retrieval, citation systems, and
              multi-model routing rather than a static model alone. Second, independent commentary still frames the
              company as subscale against larger answer-engine and search-API rivals, so execution mistakes would hit a
              business that has less consumer distribution slack than Google, Perplexity, or major cloud-linked
              competitors. Third, governance is more concentrated than a normal Series C software story because Richard
              Socher is publicly tied to both You.com and Recursive AI, which raises distraction and succession risk
              even if the businesses are legally separate.
            claimRefs:
              - CR005
              - CR007
              - CR009
              - CR010
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR007
              - CR010
              - CR012
              - CR014
      - number: '7.2'
        title: Legal, regulatory, and trust exposure
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not identify a disclosed enforcement action or breach, but that evidentiary
              absence is not proof that none exists. The sources do show that You.com is making enterprise-grade trust
              promises while pushing into use cases where accuracy, provenance, and rights clearance matter. Official
              materials promise zero data retention, SOC 2 certification, and DPA readiness, while the TollBit and
              Decision Desk HQ launch demonstrates that differentiated use cases can hinge on direct access to
              authorized third-party data. That combination makes privacy, data-processing, and content-rights
              compliance an operating requirement rather than a marketing extra. If licensing terms tighten or a trust
              claim fails in production, the downside could impair coverage, enterprise sales, and higher-value
              regulated-industry adoption.
            claimRefs:
              - CR004
              - CR006
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR006
              - CR007
      - number: '7.3'
        title: Operating, supplier, and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              Public scale claims amplify the blast radius of any reliability miss. Third-party profiles and September
              2025 funding coverage reported more than 1 billion monthly API queries or calls and roughly 100,000
              enabled agents during 2025; these are dated scale signals, not current audited metrics. Product materials
              emphasize real-time retrieval, source controls, and orchestration across multiple model providers. Those
              strengths also create failure modes: degraded crawling access can reduce answer quality, supplier pricing
              can pressure margins on deep research products, and dependence on external model, data, and distribution
              partners can weaken unit economics if partner terms or strategic alignment change. Cox adds helpful
              capital and potential channel leverage, but that strategic tie also becomes a dependency if expected
              commercial pull-through fails to materialize.
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR008
              - CR011
              - CR012
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR007
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR010
              - CR014
      - number: '7.4'
        title: Investment implication, mitigations, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The chapter supports a high-risk posture because mitigations are visible but not yet enough to fully clear
              underwriting uncertainty. Enterprise trust controls, citation infrastructure, and a strategic Series C are
              real positives, and public evidence suggests the company has meaningful adoption momentum. But the missing
              data still matters: the retained pool does not disclose current cash balance, burn, runway, preference
              terms, or a detailed public incident history. That means the next diligence step is not broad market work;
              it is targeted proof on liquidity, contractual durability, and postmortem discipline. The thesis should
              break quickly if content access degrades, if founder focus is visibly diluted, or if enterprise trust
              claims fail under customer scrutiny.
            claimRefs:
              - CR004
              - CR007
              - CR010
              - CR012
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers
            body: >-
              The fastest thesis breakers are measurable rather than philosophical: a visible decline in source coverage
              or crawl economics, evidence that founder attention has shifted away from core execution, or proof that
              enterprise trust claims fail in production through an incident, audit exception, or customer churn event.
            calloutType: risk
            claimRefs:
              - CR004
              - CR007
              - CR010
          - type: callout
            title: Diligence before underwriting residual risk
            body: >-
              The highest-value next diligence asks are the current cash and burn bridge, supplier and licensing
              concentration by product line, and a real incident-and-postmortem record for uptime, security, and
              compliance. Without those, the company may still be investable, but residual risk remains wider than the
              public growth narrative implies.
            calloutType: recommendation
            claimRefs:
              - CR008
              - CR011
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price-sensitive conclusion
        blocks:
          - type: paragraph
            body: >-
              The public record supports a real company with product breadth, named enterprise usage, and recent
              financing access, but it does not yet support a clean underwrite of the visible price context. The
              September 2025 Series C reset the reference mark to $1.5 billion, while the best public revenue anchor
              remains Sacra's estimate of $90 million ARR in December 2025, which implies roughly 16.7x ARR before any
              adjustment for private-market preferences, secondaries, or cash burn. Because those downside terms remain
              undisclosed and the available 2026 fundraising signal exposes only marketplace disclaimers rather than
              company-specific pricing, the disciplined call is to keep the name in diligence rather than force a buy
              recommendation on incomplete economics.
            claimRefs:
              - CV001
              - CV006
              - CV009
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV009
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Valuation anchors and evidence limits
        blocks:
          - type: paragraph
            body: >-
              What is visible publicly is directionally constructive: official and third-party coverage agree on the
              $100 million Series C, total disclosed capital is roughly $199 million, official channels cite more than 1
              billion monthly queries, and current product pages show an enterprise API stack rather than a
              consumer-search story. What remains missing is just as important for valuation: ARR and NDR are available
              only through third-party estimates, published pricing says more about list-card monetization than realized
              gross margin, and the materials reviewed here do not expose the current share price, liquidation
              preference stack, secondary activity, or current cash balance. That leaves the evidence strong enough to
              support relevance, but still too incomplete to certify entry terms.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: Scenario framing
        blocks:
          - type: paragraph
            body: >-
              The bull case is that You.com converts real product proof into a durable infrastructure franchise: usage
              expands, retention stays strong, and higher-value research products lift revenue faster than input costs.
              The base case is more modest: the business keeps growing, but investors still lack enough public evidence
              on margin durability, concentration, or preference overhang to pay up from today's mark. The bear case is
              not demand disappearing; it is price and cost pressure colliding with opaque terms, so a later round
              clears at weaker economics or with more investor protections than the headline valuation suggests. That
              asymmetry explains why the recommendation stays price-disciplined even though customer relevance looks
              credible. The assigned evidence contains no model-appropriate public-company, private-round, or M&A
              benchmark set beyond You.com's own round and Sacra's company estimate, so these scenarios are
              sensitivities around the known mark rather than comp-derived price targets.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV009
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: Final diligence and kill triggers
        blocks:
          - type: paragraph
            body: >-
              The next diligence cycle should focus on the items that most directly change value rather than repeat
              product-market-fit work already visible in public sources. Management needs to prove current ARR quality,
              gross margin after data-acquisition and model-inference costs, customer concentration, and the exact
              mechanics of the active financing path, including price, seniority, and any secondary component.
              Governance review should also quantify Richard Socher's time allocation while he leads You.com and
              separately pursues Recursive AI. A move toward invest would require clean evidence that expansion
              economics outrun content and compute costs and that the new money is not hiding punitive preferences. A
              kill signal would be any combination of weakening retention, rising content access friction, a down-round
              structure, or governance drift that keeps the company relevant but makes the current valuation hard to
              monetize for a new investor.
            claimRefs:
              - CV004
              - CV007
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Current call
            body: >-
              Research-more is the disciplined outcome because public evidence validates relevance faster than it
              validates downside protection.
            calloutType: recommendation
            claimRefs:
              - CV014
              - CV016
          - type: callout
            title: Decisive blocker
            body: >-
              The valuation debate turns less on whether the product matters and more on whether the next investor gets
              acceptable terms against still-private unit economics.
            calloutType: risk
            claimRefs:
              - CV011
              - CV012
              - CV015
