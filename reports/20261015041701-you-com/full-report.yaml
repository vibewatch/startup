        - The last visible $1.5B mark sits on estimated ARR support and incomplete cap-table disclosure.
        - Entry discipline matters more than company-quality scoring.
    notes: >-
      Public evidence supports the directional call, but current share price, preferences, secondaries, and cash balance
      are not disclosed in the reviewed materials.
    claimRefs:
      - CV009
      - CV011
      - CV012
      - CV014
      - CV015
      - CV016
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Vector
      - Bull case
      - Anti-thesis
      - What would change the view
    rows:
      - - Enterprise demand
        - Named deployments and >1B monthly queries imply real workflow relevance.
        - Reference customers do not prove cohort durability or concentration quality.
        - Customer cohort data, renewal curves, and account concentration by ARR.
      - - Monetization model
        - Usage-based search, content, research, and finance APIs create an upsell ladder.
        - List pricing does not prove realized gross margin after crawl, inference, and data-licensing costs.
        - Gross margin bridge by product family and evidence of positive contribution margins.
      - - Growth efficiency
        - Estimated $90M ARR and 170% NDR imply strong expansion if accurate.
        - Both figures are third-party estimates rather than management-grade public disclosures.
        - Board-quality ARR, burn, CAC-payback, and NDR reporting.
      - - Entry terms
        - Recent financing access suggests investors still want exposure.
        - >-
          Public materials do not reveal price per share, seniority, or secondary mix, so downside protection is
          unclear.
        - Current term sheet, preference stack, and any side letters or secondary allocations.
      - - Leadership focus
        - Founder-led technical credibility remains an asset.
        - The CEO also leads a separate AI research company, creating a key-person allocation question.
        - Board-approved allocation, succession coverage, and related-party governance documentation.
      - - Comparable benchmark
        - The latest round supplies a real company-specific price anchor.
        - >-
          No retained public-company, private-round, or M&A set is sufficiently comparable to establish a market
          multiple.
        - A banker-quality comp set normalized for growth, margin, scale, and security terms.
    notes: >-
      The table separates what public evidence supports from the data-room items still needed to convert relevance into
      an investable entry.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Estimated ARR proves conservative, retention remains elite, and enterprise workloads migrate up the pricing
          stack.
        - >-
          Above $1.5B only if management-grade ARR, retention, and margin evidence supports a premium infrastructure
          multiple; no upper bound is supportable publicly.
        - Execution complexity, platform bundling, and content access costs still have to stay controlled.
        - Requires management-grade evidence that public sources do not yet provide.
      - - Base
        - Demand remains healthy, but margin visibility and cap-table opacity persist through the next financing window.
        - At or below the $1.5B anchor, with no uplift underwritten until terms and margins are verified.
        - Multiple compression or investor-protective terms can offset operating progress.
        - Best fit with the current evidence set.
      - - Bear
        - >-
          Content acquisition and inference costs rise faster than pricing, while later financing clears on weaker
          economics.
        - Below the $1.5B anchor; the public record does not support a defensible floor.
        - Down-round risk, punitive preferences, and lower liquidity for new entrants.
        - Credible if diligence cannot close unit-economics and terms gaps.
    notes: >-
      These scenarios are directional valuation frames, not precise price targets, because public evidence does not
      disclose cap-table mechanics or audited unit economics.
    claimRefs:
      - CV001
      - CV006
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV014
      - CV015
      - CV016
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Public milestones trace You.com's path from 2020 founding into a 2024-2025 enterprise API pivot, with later scale
      ambitions clearer than definitive financing detail.
    data:
      items:
        - label: Company founded
          date: '2020'
          detail: Multiple assigned sources align on Richard Socher and Bryan McCann founding You.com in 2020.
          tone: positive
          claimRefs:
            - CO001
        - label: Seed financing
          date: 2021-11
          detail: Sacra dates the seed round to November 2021 and names Time Ventures as lead.
          tone: positive
          claimRefs:
            - CO007
        - label: Series A financing
          date: 2022-07
          detail: Sacra dates the Series A to July 2022 and names Radical Ventures as lead.
          tone: positive
          claimRefs:
            - CO007
        - label: Series B led by Georgian
          date: 2024-09
          detail: >-
            Sacra and UsagePricing both point to a $50 million Series B led by Georgian, with participation from
            investors including Salesforce Ventures and NVIDIA.
          tone: positive
          claimRefs:
            - CO010
        - label: Election Agent launch
          date: '2024-11-05'
          detail: >-
            You.com and TollBit launched Election Agent with direct access to Decision Desk HQ results, showing a
            workflow-specific partner deployment.
          tone: positive
          claimRefs:
            - CO014
        - label: API-layer formalization
          date: '2025-08-26'
          detail: >-
            You.com announced Unified Web & News Search, an API Management Console, and a benchmarking study to support
            enterprise API positioning.
          tone: positive
          claimRefs:
            - CO015
        - label: Series C at $1.5B (SiliconANGLE)
          date: '2025-09-03'
          detail: SiliconANGLE reported a $150 million financing at a $1.5 billion valuation.
          tone: warning
          claimRefs:
            - CO008
        - label: Series C amount disputed
          date: '2025-09-08'
          detail: >-
            Built In San Francisco and Sacra instead described the Series C as $100 million, leaving the definitive
            round size unresolved in public sources.
          tone: warning
          claimRefs:
            - CO009
        - label: 2026 leadership and scale ambitions
          date: '2026'
          detail: >-
            The about page shows Saahil Jain as CTO in 2026, while SiliconANGLE said the Series C would fund a San
            Francisco office and headcount expansion.
          tone: neutral
          claimRefs:
            - CO005
            - CO016
    approximationNotes: >-
      Timeline dates reproduce source-reported dates or periods. The two September 2025 financing entries are
      intentionally both retained because assigned sources disagree on the Series C amount.
    claimRefs:
      - CO001
      - CO005
      - CO007
      - CO008
      - CO009
      - CO010
      - CO014
      - CO015
      - CO016
