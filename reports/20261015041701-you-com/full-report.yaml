  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a sequence from low-friction retrieval usage into higher-value research products,
      enterprise controls, and deployment services.
    data:
      nodes:
        - id: demand
          label: Developer / enterprise demand
          detail: AI agents, search, and research workflows need current cited web data.
        - id: retrieval
          label: Search and contents usage
          detail: High-frequency retrieval and extraction calls create the entry-level meter.
        - id: synthesis
          label: Research and answer upsell
          detail: Higher-compute cited answers increase revenue per call as workflows deepen.
        - id: vertical
          label: Finance Research premium layer
          detail: Domain-specific financial research sits above general research in the public rate card.
        - id: enterprise
          label: Enterprise expansion
          detail: Zero data retention, DPA readiness, SOC 2, custom QPS, and annual commitments support larger accounts.
        - id: services
          label: Deployment support
          detail: Fixed-fee implementation through Weaver/custom services can accelerate enterprise adoption.
        - id: monetization
          label: Revenue capture and margin tradeoff
          detail: Revenue mix can move up the stack, but costs also rise with crawling, reasoning, and licensed data.
    approximationNotes: null
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
      - CI006
      - CI010
      - CI014
      - CI015
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Publicly documented layers run from developer interfaces through retrieval and cited synthesis to an enterprise
      control plane.
    data:
      layers:
        - label: Client interfaces
          detail: REST APIs, SDKs, and MCP endpoints expose the platform to application builders and agent tooling.
          modules:
            - label: REST endpoints
              note: Web Search, Contents, Answer, Research, Finance Research
            - label: SDK and MCP access
              note: Python, TypeScript, api.you.com MCP, Docs MCP server
        - label: Retrieval layer
          detail: Web Search returns unified web and news results with structured metadata for AI applications.
          outputs:
            - label: snippets
            - label: full-page or highlights extraction
        - label: Content layer
          detail: Contents API fetches known URLs into machine-usable page text without requiring a custom scraper.
          outputs:
            - label: Markdown output
            - label: HTML output
        - label: Synthesis layer
          detail: Research and Finance Research convert retrieved material into source-backed analytical output.
          outputs:
            - label: cited answers
            - label: structured source arrays
        - label: Partner and private-data layer
          detail: >-
            Public positioning repeatedly references combining web retrieval with private company data and external data
            sources.
          outputs:
            - label: private company data context
            - label: partner or vertical data feeds
        - label: Enterprise control plane
          detail: Commercial surfaces emphasize retention, compliance, and throughput controls for enterprise deployment.
          modules:
            - label: Zero Data Retention
            - label: SOC 2 and DPA readiness
            - label: custom QPS limits
    approximationNotes: null
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE007
