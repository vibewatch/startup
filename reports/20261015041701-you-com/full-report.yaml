            tableRef: TO002
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO012
      - number: '1.3'
        title: Funding History, Investors, and Public Scale Markers
        blocks:
          - type: paragraph
            body: >-
              The strongest public capitalization signal is a September 2025 unicorn valuation, but the round-size
              reporting is not clean enough to treat lifetime funding as settled fact. SiliconANGLE wrote that You.com
              announced $150 million at a $1.5 billion valuation, while Built In San Francisco and Sacra instead
              described the same Series C as $100 million, with Sacra placing total funding at $199 million. Earlier
              financing is clearer: Sacra and UsagePricing both point to a $50 million Series B in September 2024 led by
              Georgian with returning participation from investors including Salesforce Ventures and NVIDIA, while Sacra
              also traces seed and Series A leadership back to Time Ventures and Radical Ventures. Commercially,
              official and independent sources converge on meaningful scale signals: 1B+ monthly API calls or queries,
              named enterprise users and partners, and a public pricing ladder that now centers on usage-based
              infrastructure rather than subscription seats. What remains missing are audited revenue, customer
              concentration, current headcount, and cash-runway disclosures.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO013
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
