  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              You.com's public positioning is no longer general-purpose consumer search; it is the web-data and
              cited-research layer for AI agents, LLM applications, and enterprises. The included market is therefore
              the spend on live web retrieval, page extraction, cited synthesis, and domain-specific research outputs
              that help teams ground AI systems in current information. Adjacent but excluded spend includes generic
              model-seat subscriptions, broad enterprise productivity software, and the legacy consumer subscription
              plans that UsagePricing says have largely receded from public pricing. That boundary matters because the
              company is competing for workflow-specific retrieval and research budgets, not for all search or all AI
              software budgets.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM011
      - number: '2.2'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The observable adoption path starts with builders and small teams that can try the APIs on usage pricing,
              then widens into enterprise purchases once compliance, throughput, and verifiability matter. Sacra
              describes a self-serve-to-enterprise motion, while the official product pages show concrete workflows
              spanning support, content, fact checking, research, and competitive monitoring. That mix implies multiple
              budget owners: engineering or platform teams for agent infrastructure, operations or knowledge leaders for
              analyst workflows, and domain leaders when research becomes finance-, legal-, or compliance-specific.
              Security features such as zero data retention, SOC 2, and DPA readiness suggest IT and procurement also
              influence expansion, not just the initial builder.
            claimRefs:
              - CM004
              - CM007
              - CM008
              - CM009
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.3'
        title: Sizing lenses, drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              Public evidence is strongest on observable traction and monetization ladders, not on a full TAM stack.
              Sacra's estimate of $90M ARR, growth from $20M a year earlier, and more than 1B monthly queries indicate a
              real market is already being served, while UsagePricing's price ladder shows how spend can expand from
              commodity search toward higher-value cited research and finance workflows. The main demand drivers are the
              need for fresh, source-backed answers in agentic systems and the appeal of vertical indexes for
              higher-stakes domains. The main constraints are equally important: pricing sensitivity at the edge of
              adoption, content-access fragmentation, and higher data-licensing costs in premium verticals. Because no
              retained third-party source isolates a defensible TAM, SAM, and SOM for this specific category, valuation
              still rests more on execution against these drivers than on a proven market ceiling.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM011
              - CM013
              - CM014
              - CM015
