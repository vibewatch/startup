              - CE002
              - CE005
              - CE009
              - CE012
      - number: '5.2'
        title: Architecture, interfaces, and deployment model
        blocks:
          - type: paragraph
            body: >-
              The public architecture is modular rather than monolithic. The docs split raw retrieval, content
              extraction, cited synthesis, and finance-specific synthesis into separate APIs, with different endpoints
              and usage guidance depending on whether the developer needs search results, full-page content, or a
              source-backed answer. Distribution also spans multiple access modes: REST endpoints, Python and TypeScript
              SDKs, and MCP connectivity for agents and IDE tooling. That combination suggests a product designed to be
              embedded inside other software stacks instead of only consumed through a first-party UI.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE005
