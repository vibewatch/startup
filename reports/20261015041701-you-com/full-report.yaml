chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Platform Positioning
        blocks:
          - type: paragraph
            body: >-
              You.com's current public materials position the company less as a consumer search destination and more as
              infrastructure for enterprise AI builders. The homepage now presents You.com as 'The Real-Time Web Data
              Layer for AI,' while the product and pricing surfaces describe a stack spanning web search, content
              extraction, grounded answers, long-form research, and finance-focused research APIs. Founding references
              across the assigned source set align on a 2020 start by Richard Socher and Bryan McCann, and
              company-issued materials continue to anchor the operating center in Palo Alto even as later reporting says
              expansion capital would support a San Francisco office. The result is a company identity that is coherent
              around real-time retrieval and citation-backed agent workflows, even if its earlier consumer-search
              narrative has not fully disappeared from third-party writeups.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO013
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO009
              - CO011
              - CO016
      - number: '1.2'
        title: Founders, Leadership Bench, and Governance Visibility
        blocks:
          - type: paragraph
            body: >-
              Leadership visibility is stronger than governance visibility in the assigned evidence. You.com's about
              page now names a broad operating bench across product, finance, legal, and search leadership, including
              COO Alex Triplett, CTO Saahil Jain, CPO Saurabh Sharma, President of Search Alper Tekin, VP Finance and
              Operations Jing Lee, and General Counsel and Secretary Kirsten Mellor. Founder influence remains
              concentrated around Richard Socher, whose current public biography also identifies him as CEO and
              co-founder of Recursive while he continues to lead You.com. That combination gives the company unusually
              strong founder-market fit in AI search and NLP, but it also creates clear key-person dependence and makes
              time allocation a live diligence issue. Public sources in the assigned set do not disclose board
              composition, formal control rights, debt facilities, or current cash balance, so governance underwriting
              still depends on private-room materials rather than public disclosures.
            claimRefs:
              - CO005
              - CO006
              - CO012
