      - number: '4.2'
        title: GTM motion and public traction proxies
        blocks:
          - type: paragraph
            body: >-
              The visible go-to-market motion starts with low-friction developer access and expands into enterprise
              controls, custom limits, and services. Official packaging advertises zero data retention, SOC 2, DPA
              readiness, and custom QPS limits, while independent pricing analysis adds $100 in free credit, volume
              discounts, and annual commitments. On traction, Sacra estimates $90 million of ARR in December 2025 versus
              $20 million a year earlier, 170% net dollar retention, and more than 1 billion monthly queries. Those are
              strong commercialization signals, but they remain a mix of list-price inputs, company claims, and
              third-party estimates rather than audited revenue-quality disclosures.
            claimRefs:
              - CI002
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI011
      - number: '4.3'
        title: Cost structure, delivery model, and margin path
        blocks:
          - type: paragraph
            body: >-
              The public cost story is directionally clear even though it is not numerically underwritten. Higher-value
              products should carry better revenue per call, but they also add heavier inference, retrieval, and data
              costs. Sacra explicitly warns that tightening publisher controls can make crawling and content access more
              expensive, while Finance Research and other specialized verticals introduce licensed-data costs and
              validation overhead. Services revenue can help adoption but is unlikely to be software-like: Business
              Wire's Weaver announcement shows a fixed-fee deployment model tied to implementation outcomes, which can
              accelerate enterprise rollout but also implies labor-linked delivery costs alongside pure API gross
              margin.
            claimRefs:
              - CI010
              - CI014
              - CI015
      - number: '4.4'
        title: Capital adequacy and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The latest public financing clearly supports continued investment, but it does not yet let an outside
              investor underwrite runway. Wikipedia and Built In report a September 2025 Series C of $100 million at a
              $1.5 billion valuation, while SiliconANGLE reported the same event as $150 million at the same valuation.
              More importantly, the retained public evidence here does not disclose current cash on hand, burn, runway,
              or debt obligations. That leaves the investment case relying on access to capital and visible commercial
              momentum, not on demonstrated cash adequacy. Management needs to close that gap before a financial
              diligence process can move from narrative plausibility to hard underwriting.
            claimRefs:
              - CI011
              - CI012
              - CI013
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Visible price ladder, invisible realized pricing
            body: >-
              The public rate card is detailed enough to explain how You.com wants customers to expand, but it still
              does not reveal realized pricing, gross margin, or revenue mix by SKU.
            calloutType: insight
            claimRefs:
              - CI004
              - CI005
              - CI006
          - type: callout
            title: Premium products may add cost faster than public revenue evidence proves
            body: >-
              Finance Research and other higher-value products can improve revenue per call, but public evidence also
              points to higher supplier, crawling, and validation costs that may compress the margin path.
            calloutType: risk
            claimRefs:
              - CI014
              - CI015
          - type: callout
            title: Capital adequacy still needs management proof
            body: >-
              Before underwriting the business, request current cash, burn, runway, debt, realized price realization by
              SKU, and software-versus-services mix for any deployment revenue.
            calloutType: recommendation
            claimRefs:
              - CI011
              - CI012
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              The clearest public definition of You.com in 2026 is not a general search destination but a
              developer-facing data layer for AI systems. Official surfaces describe a workflow in which developers
              search the web, extract clean content, and then generate grounded answers for agents and LLMs, while
              independent profiles describe the same stack as combining private company data, real-time retrieval, and
              cited synthesis. That makes the buyer job more specific than "enterprise AI": the product is aimed at
              teams that need current external information, source traceability, and a path from raw retrieval to answer
              generation without building the full pipeline from scratch.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE010
          - type: table
            tableRef: TE001
            claimRefs:
