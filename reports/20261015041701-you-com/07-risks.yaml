callouts:
  - calloutType: risk
    title: Thesis-break triggers
    body: >-
      The fastest thesis breakers are measurable rather than philosophical: a visible decline
      in source coverage or crawl economics, evidence that founder attention has shifted away
      from core execution, or proof that enterprise trust claims fail in production through an
      incident, audit exception, or customer churn event.
    claimRefs: [CR004, CR007, CR010]
  - calloutType: recommendation
    title: Diligence before underwriting residual risk
    body: >-
      The highest-value next diligence asks are the current cash and burn bridge, supplier and
      licensing concentration by product line, and a real incident-and-postmortem record for
      uptime, security, and compliance. Without those, the company may still be investable, but
      residual risk remains wider than the public growth narrative implies.
    claimRefs: [CR008, CR011, CR013]
