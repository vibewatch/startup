callouts:
  - calloutType: "strength"
    title: "The platform story is now coherent and enterprise-facing"
    body: "Across official and independent evidence, You.com has largely completed the narrative shift from consumer AI search to infrastructure for agents and enterprise retrieval. The product stack, usage-based price ladder, and 1B+ monthly query or API scale markers all support that repositioning."
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO011"
      - "CO013"
  - calloutType: "risk"
    title: "Capitalization and governance still need private-room confirmation"
    body: "The latest financing round is directionally positive but not fully clean in public reporting: valuation lines up at $1.5 billion, while round size conflicts between $100 million and $150 million. At the same time, founder concentration is high and public governance disclosure remains thin on board composition, control rights, debt, and cash runway."
    claimRefs:
      - "CO006"
      - "CO008"
      - "CO009"
      - "CO012"
