company:
  name: "You.com"
chapter:
  number: 1
  title: "Company Overview"
  summary: "You.com is a Palo Alto-founded AI search infrastructure company that has pivoted from a consumer search product into a usage-priced web, content, answer, and research API platform for enterprises and developers. Public evidence supports a $1.5 billion September 2025 valuation marker and 1B+ monthly query or API scale, but financing disclosures conflict on whether the Series C was $100 million or $150 million and still leave board composition, current headcount, and audited economics opaque."
sections:
  - id: "identity-and-platform"
    title: "Identity, Headquarters, and Platform Positioning"
    body: "You.com's current public materials position the company less as a consumer search destination and more as infrastructure for enterprise AI builders. The homepage now presents You.com as 'The Real-Time Web Data Layer for AI,' while the product and pricing surfaces describe a stack spanning web search, content extraction, grounded answers, long-form research, and finance-focused research APIs. Founding references across the assigned source set align on a 2020 start by Richard Socher and Bryan McCann, and company-issued materials continue to anchor the operating center in Palo Alto even as later reporting says expansion capital would support a San Francisco office. The result is a company identity that is coherent around real-time retrieval and citation-backed agent workflows, even if its earlier consumer-search narrative has not fully disappeared from third-party writeups."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO013"
      - "CO016"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Founders, Leadership Bench, and Governance Visibility"
    body: "Leadership visibility is stronger than governance visibility in the assigned evidence. You.com's about page now names a broad operating bench across product, finance, legal, and search leadership, including COO Alex Triplett, CTO Saahil Jain, CPO Saurabh Sharma, President of Search Alper Tekin, VP Finance and Operations Jing Lee, and General Counsel and Secretary Kirsten Mellor. Founder influence remains concentrated around Richard Socher, whose current public biography also identifies him as CEO and co-founder of Recursive while he continues to lead You.com. That combination gives the company unusually strong founder-market fit in AI search and NLP, but it also creates clear key-person dependence and makes time allocation a live diligence issue. Public sources in the assigned set do not disclose board composition, formal control rights, debt facilities, or current cash balance, so governance underwriting still depends on private-room materials rather than public disclosures."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO012"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-scale"
    title: "Funding History, Investors, and Public Scale Markers"
    body: "The strongest public capitalization signal is a September 2025 unicorn valuation, but the round-size reporting is not clean enough to treat lifetime funding as settled fact. SiliconANGLE wrote that You.com announced $150 million at a $1.5 billion valuation, while Built In San Francisco and Sacra instead described the same Series C as $100 million, with Sacra placing total funding at $199 million. Earlier financing is clearer: Sacra and UsagePricing both point to a $50 million Series B in September 2024 led by Georgian with returning participation from investors including Salesforce Ventures and NVIDIA, while Sacra also traces seed and Series A leadership back to Time Ventures and Radical Ventures. Commercially, official and independent sources converge on meaningful scale signals: 1B+ monthly API calls or queries, named enterprise users and partners, and a public pricing ladder that now centers on usage-based infrastructure rather than subscription seats. What remains missing are audited revenue, customer concentration, current headcount, and cash-runway disclosures."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO013"
      - "CO016"
    tableRefs:
      - "TO003"
  - id: "milestones-and-watchpoints"
    title: "Milestones, Product Evolution, and Current Watchpoints"
    body: "The milestone record shows a company that has steadily reframed itself around enterprise-grade retrieval and agent tooling. Sacra's early financing chronology places seed and Series A rounds in 2021 and 2022, followed by the clearer 2024 Series B and the disputed-but-important 2025 Series C valuation event. Product and partnership milestones support the pivot story: November 2024's Election Agent launch demonstrated a workflow-specific application built with outside data partners, and August 2025's API-layer announcement formalized unified web and news search, an API management console, and benchmark-led claims about accuracy, freshness, latency, and cost. The main watchpoint is that public scale and product breadth now look more mature than public governance and economics. Until management clarifies board oversight, true headcount, and the definitive Series C capitalization package, the company overview supports relevance and momentum more confidently than full investability."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
