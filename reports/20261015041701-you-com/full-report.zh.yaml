      - number: '2.3'
        title: 市场规模视角、驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              公开证据最能证明可观察的商业进展和变现梯，而不是完整的 TAM 体系。Sacra 估算 ARR 为 $90M，较一年前的 $20M 增长，且每月查询超过 10
              亿次，说明市场已经存在真实需求；UsagePricing 的价格梯则展示了支出如何从商品化搜索扩展到更高价值的带引用研究和金融工作流。主要需求驱动因素是 agent
              系统需要新鲜、有来源支撑的回答，以及垂直索引对高风险领域的吸引力。约束同样关键：采用边缘的价格敏感性、内容访问碎片化，以及高端垂直领域更高的数据许可成本。由于保留的第三方来源没有为这一特定类别拆出可信的
              TAM、SAM 和 SOM，估值仍更多依赖公司围绕这些驱动因素的执行，而不是已证明的市场天花板。
