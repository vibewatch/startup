      - number: '8.3'
        title: 情景框架
        blocks:
          - type: paragraph
            body: >-
              乐观情景是 You.com
              把真实产品证明转化为持久的基础设施特许经营：使用量扩大，留存保持强劲，高价值研究产品带来的收入增长快于投入成本。基准情景更温和：业务继续增长，但投资者仍没有足够公开证据证明利润率持久性、集中度或优先权负担，因而不会在当前估值上方大幅加价。悲观情景不是需求消失，而是价格和成本压力与不透明条款碰撞，使下一轮以更弱经济性完成，或比头条估值暗示的带来更多投资者保护。正是这种不对称，解释了为何即使客户相关性可信，建议仍保持价格纪律。指定证据除
              You.com 自身轮次和 Sacra 的公司估算外，没有适合建模的上市公司、私募轮次或并购可比集合，因此这些情景是围绕已知估值的敏感性，而非由可比公司推导的价格目标。
