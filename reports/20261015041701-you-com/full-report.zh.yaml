  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 规模和产品证明是真实的，但经济性和条款不透明仍限制入场判断。
    data:
      nodes:
        - id: proof
          label: 企业相关性已证实
          detail: 已点名客户和每月超过 1B 次查询，显示真实的市场拉力。
          tone: positive
        - id: monetization
          label: 存在变现路径
          detail: 按使用量计费的 API 定价和扩张信号，在工作负载加深时带来上行空间。
          tone: opportunity
        - id: economics
          label: 经济性仍是估算
          detail: ARR 和 NDR 只能通过第三方估算看见，利润率仍属非公开信息。
          tone: warning
        - id: price
          label: 最近可见价格偏高
          detail: 公开锚点是 $1.5B 的 C 轮，即估算 ARR 的约 16.7 倍。
          tone: warning
        - id: terms
          label: 下行保护不清楚
          detail: 当前轮次条款、优先股堆叠、二级交易和现金余额均未公开披露。
          tone: adverse
        - id: call
          label: research-more / 偏高
          detail: 保持尽调推进，但投资前要求更充分的经济性和条款证明。
          tone: risk
      edges:
        - from: proof
          to: monetization
          label: 产品相关性可以变现。
        - from: monetization
          to: economics
          label: 但实际效率仍未得到证明。
        - from: economics
          to: price
          label: 有限证据削弱价格锚点。
        - from: price
          to: terms
          label: 偏高估值需要有力保护。
        - from: terms
          to: call
          label: 缺少保护使判断保持谨慎。
    claimRefs:
      - CV003
      - CV009
      - CV013
      - CV014
      - CV016
