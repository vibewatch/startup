        title: GTM 路径与公开增长代理指标
        blocks:
          - type: paragraph
            body: >-
              可见的 go-to-market 路径从低门槛开发者接入开始，再扩展到企业控制、自定义限制和服务。官方包装宣传零数据留存、SOC 2、DPA 就绪和自定义 QPS 限制；独立定价分析还提到 $100
              免费额度、批量折扣和年度承诺。就商业进展而言，Sacra 估算 2025 年 12 月 ARR 为 $90 million，而一年前为 $20 million，净美元留存率为 170%，每月查询超过 1B
              次。这些是强烈的商业化信号，但仍混合了标价输入、公司口径和第三方估算，而不是经过审计的收入质量披露。
