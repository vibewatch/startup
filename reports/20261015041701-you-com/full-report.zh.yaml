  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开记录的层级从开发者接口，经检索和带引综合，延伸到企业控制平面。
    data:
      layers:
        - label: 客户端接口
          detail: REST API、SDK 和 MCP 端点把平台开放给应用构建者和代理工具。
          modules:
            - label: REST 端点
              note: Web Search, Contents, Answer, Research, Finance Research
            - label: SDK 和 MCP 访问
              note: Python, TypeScript, api.you.com MCP, Docs MCP server
        - label: 检索层
          detail: Web Search 为 AI 应用返回带结构化元数据的统一网页和新闻结果。
          outputs:
            - label: snippets
            - label: full-page or highlights extraction
        - label: 内容层
          detail: Contents API 把已知 URL 抓取为机器可用的页面文本，无需定制抓取器。
          outputs:
            - label: Markdown output
            - label: HTML output
        - label: 综合层
          detail: Research 和 Finance Research 把检索材料转成有来源支撑的分析输出。
          outputs:
            - label: cited answers
            - label: structured source arrays
        - label: 合作伙伴和私有数据层
          detail: 公开定位反复提到把网页检索与公司私有数据及外部数据源结合起来。
          outputs:
            - label: private company data context
            - label: partner or vertical data feeds
        - label: 企业控制平面
          detail: 商业页面强调企业部署所需的保留、合规和吞吐量控制。
          modules:
            - label: 零数据保留
            - label: SOC 2 和 DPA 准备度
            - label: 自定义 QPS 限制
    approximationNotes: null
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE007
