chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司定位、总部与平台位置
        blocks:
          - type: paragraph
            body: >-
              You.com 当前公开材料已不再把公司定位为消费者搜索入口，而是企业 AI 构建者的基础设施。官网如今将 You.com 介绍为 “面向 AI 的实时 Web
              数据层”，产品和定价页面则展示了一套覆盖网页搜索、内容提取、有依据回答、长篇研究和金融研究 API 的产品栈。指定来源普遍认定 Richard Socher 与 Bryan McCann 于 2020
              年创办公司；即使后续报道称扩张资本将支持其在旧金山设立办公室，公司材料仍把 Palo Alto 作为运营中心。由此形成的公司身份围绕实时检索和有引用支撑的 agent
              工作流，尽管第三方文章中早期消费者搜索叙事尚未完全消失。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO013
              - CO016
