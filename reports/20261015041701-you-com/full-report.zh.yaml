        title: 买家、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              可观察的采用路径从能按使用量计价试用 API 的开发者和小团队开始；当合规、吞吐和可验证性变得重要后，再扩展到企业采购。Sacra
              描述了从自助服务到企业的销售路径，官方产品页面则展示了支持、内容、事实核查、研究和竞品监测等具体工作流。预算方不止一个：工程或平台团队负责 agent
              基础设施，运营或知识负责人负责分析师工作流，研究转向金融、法律或合规领域时则由领域负责人参与。零数据留存、SOC 2 和 DPA 就绪等安全特性表明，IT 与采购也会影响扩张，而不只是最初的开发者。
