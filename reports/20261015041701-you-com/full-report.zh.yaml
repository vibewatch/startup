      - number: '3.2'
        title: 能力与定位
        blocks:
          - type: paragraph
            body: >-
              最有证据支持的差异化并不是某个单一基准结果，而是产品梯的形状。官方页面和独立综述都持续将 You.com
              描述为覆盖原始网页搜索、页面提取、有依据回答和多步骤研究，因此开发者从基础检索走向带引用工作流时，需要拼接的供应商更少。这种广度尤其适用于对比 Exa 和 SerpAPI
              式栈——买家往往还要另加提取或综合组件——以及内部搜索 agent，因为 Sacra 称后者仍需在私有数据之上叠加实时网页层。代价是，You.com
              的部分公开功能口径来自公司控制的来源，因此买家仍需用自己的评估工作负载验证，不能把基准领先当成持久证据。
