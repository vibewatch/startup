  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              You.com 的公开定位已不再是通用消费者搜索，而是面向 AI agent、LLM 应用和企业的网页数据与带引用研究层。因此，纳入市场是实时网页检索、页面提取、带引用综合，以及帮助团队让 AI
              系统基于最新信息运行的领域研究输出所对应的支出。相邻但排除的支出包括通用模型席位订阅、广义企业生产力软件，以及 UsagePricing
              所称已基本退出公开定价的旧版消费者订阅计划。这个边界很重要，因为公司争夺的是特定工作流的检索和研究预算，而不是所有搜索或所有 AI 软件预算。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM011
