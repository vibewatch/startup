      - number: '4.3'
        title: 成本结构、交付模式与利润率路径
        blocks:
          - type: paragraph
            body: >-
              公开成本逻辑方向清晰，但还没有数据支撑的财务判断。高价值产品每次调用的收入应更高，却也会增加推理、检索和数据成本。Sacra 明确警告，出版商收紧控制会抬高爬取与内容访问成本；Finance Research
              等专业垂直产品还会带来许可数据成本和验证开销。服务收入可以帮助采用，但不太可能具备软件收入特征：Business Wire 对 Weaver
              的公告显示，其部署模式按固定费用并与实施结果挂钩，能加快企业上线，却也意味着除纯 API 毛利率外还有与人力相关的交付成本。
            claimRefs:
              - CI010
              - CI014
              - CI015
      - number: '4.4'
        title: 资本充足性与投资判断障碍
        blocks:
          - type: paragraph
            body: >-
              最新公开融资显然支持公司继续投入，但还不足以让外部投资者评估现金跑道。Wikipedia 和 Built In 报道 2025 年 9 月 C 轮为 $100 million、估值 $1.5
              billion；SiliconANGLE 则称同一事件为 $150
              million、估值相同。更重要的是，这里保留的公开证据没有披露当前现金、消耗率、跑道或债务义务。因此，投资逻辑依赖融资渠道和可见的商业势头，而不是已证明的现金充足性。在财务尽调从叙事上的合理性走向硬判断之前，管理层需要补上这一缺口。
            claimRefs:
              - CI011
              - CI012
              - CI013
      - number: '4.5'
        title: 展示项
        blocks:
          - type: callout
            title: 价格梯可见，实际价格不可见
            body: 公开费率表足以解释 You.com 希望客户如何扩张，但仍未披露实际价格、毛利率或按 SKU 划分的收入结构。
            calloutType: insight
            claimRefs:
              - CI004
              - CI005
              - CI006
          - type: callout
            title: 高端产品增加成本的速度可能快于公开收入证据所能证明的速度
            body: Finance Research 和其他高价值产品可以提高每次调用收入，但公开证据也指向更高的供应商、爬取和验证成本，可能挤压利润率路径。
            calloutType: risk
            claimRefs:
              - CI014
              - CI015
          - type: callout
            title: 资本充足性仍需管理层证明
            body: 在判断这项业务之前，应索取当前现金、消耗率、跑道、债务、按 SKU 划分的实际价格实现，以及部署收入中的软件与服务构成。
            calloutType: recommendation
            claimRefs:
              - CI011
              - CI012
              - CI013
