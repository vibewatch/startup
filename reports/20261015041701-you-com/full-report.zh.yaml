      - number: '8.2'
        title: 估值锚点与证据边界
        blocks:
          - type: paragraph
            body: >-
              公开可见信息方向积极：官方和第三方报道都认可 $100 million C 轮，已披露总资本约 $199 million，官方渠道称每月查询超过 1B 次，当前产品页面展示的是企业 API
              栈，而非消费者搜索故事。对估值同样重要的缺失项包括：ARR 和 NDR
              只能从第三方估算获得，公开定价更多说明标价卡变现，而非实际毛利率；本次审阅材料也没有披露当前股价、清算优先股堆叠、二级交易活动或当前现金余额。因此，证据足以支持相关性，但仍不完整，无法确认进入条款。
