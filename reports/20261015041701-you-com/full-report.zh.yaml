figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 公开里程碑勾勒出 You.com 从 2020 年成立到 2024-2025 年转向企业 API 的路径；后续规模化目标比确定的融资细节更清晰。
    data:
      items:
        - label: 公司成立
          date: '2020'
          detail: 多个指定来源都认定 Richard Socher 和 Bryan McCann 于 2020 年创立 You.com。
          tone: positive
          claimRefs:
            - CO001
        - label: 种子轮融资
          date: 2021-11
          detail: Sacra 将种子轮时间定在 2021 年 11 月，并称 Time Ventures 为领投方。
          tone: positive
          claimRefs:
            - CO007
        - label: A 轮融资
          date: 2022-07
          detail: Sacra 将 A 轮时间定在 2022 年 7 月，并称 Radical Ventures 为领投方。
          tone: positive
          claimRefs:
            - CO007
        - label: Georgian 领投 B 轮
          date: 2024-09
          detail: Sacra 和 UsagePricing 都指向 Georgian 领投的 $50 million B 轮，参与者包括 Salesforce Ventures 和 NVIDIA 等投资者。
          tone: positive
          claimRefs:
            - CO010
        - label: Election Agent 发布
          date: '2024-11-05'
          detail: You.com 和 TollBit 推出 Election Agent，可直接访问 Decision Desk HQ 结果，展示了面向特定工作流的合作伙伴部署。
          tone: positive
          claimRefs:
            - CO014
        - label: API 层正式化
          date: '2025-08-26'
          detail: You.com 宣布推出 Unified Web & News Search、API Management Console 和一项基准测试研究，以支撑企业 API 定位。
          tone: positive
