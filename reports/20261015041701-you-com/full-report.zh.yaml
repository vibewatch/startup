      - number: '8.4'
        title: 最终尽调与止损触发器
        blocks:
          - type: paragraph
            body: >-
              下一轮尽调应聚焦最直接改变价值的事项，而不是重复公开来源已经展示的产品市场匹配工作。管理层需要证明当前 ARR
              质量、扣除数据获取和模型推理成本后的毛利率、客户集中度，以及当前融资路径的确切机制，包括价格、优先级和任何二级交易成分。治理审查还应量化 Richard Socher 在领导 You.com 的同时另行推进
              Recursive AI
              所投入的时间。若要转向投资，需要清晰证据证明扩张经济性跑赢内容和算力成本，且新资金没有隐藏惩罚性优先权。若留存走弱、内容访问摩擦上升、出现下行轮结构，或治理漂移使公司仍有相关性却难以让新投资者从当前估值兑现价值，便应构成止损信号。
