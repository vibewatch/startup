      - number: '1.4'
        title: 里程碑、产品演进与当前观察点
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，公司一直在把自身重新定义为企业级检索和 agent 工具。Sacra 的早期融资时间线将种子轮和 A 轮分别放在 2021 年和 2022 年，之后是较明确的 2024 年 B
              轮，以及存在争议但很重要的 2025 年 C 轮估值事件。产品与合作里程碑支持这一转向：2024 年 11 月推出 Election Agent，展示了与外部数据伙伴共建的特定工作流应用；2025 年 8
              月公布的 API 层则正式推出统一网页与新闻搜索、API
              管理控制台，以及围绕准确率、新鲜度、延迟和成本的基准测试声称。主要观察点是，公开规模和产品广度如今比公开治理与经济指标更成熟。在管理层明确董事会监督、真实员工数和最终 C
              轮资本化文件之前，公司概览对相关性与增长势头的支持，会比对完整可投资性的支持更有把握。
