      - number: '1.3'
        title: 融资历史、投资者与公开规模信号
        blocks:
          - type: paragraph
            body: >-
              最强的公开资本化信号是 2025 年 9 月达到独角兽估值，但关于轮次规模的报道并不一致，不能把累计融资额当作已确定事实。SiliconANGLE 写道 You.com 宣布融资 $150 million、估值
              $1.5 billion；Built In San Francisco 和 Sacra 则将同一 C 轮描述为 $100 million，Sacra 给出的累计融资额为 $199
              million。更早的融资相对清楚：Sacra 与 UsagePricing 都指向 2024 年 9 月由 Georgian 领投的 $50 million B 轮，Salesforce Ventures 和
              NVIDIA 等老股东跟投；Sacra 还将种子轮和 A 轮的领投方追溯至 Time Ventures 与 Radical Ventures。商业层面，官方和独立来源都指向有意义的规模信号：每月 1B+ API
              调用或查询、已点名的企业用户与合作伙伴，以及如今以按使用量计价基础设施而非订阅席位为核心的公开价格梯。仍缺少审计收入、客户集中度、当前员工数和现金跑道披露。
