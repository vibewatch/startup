  - id: FI001
    title: 收入模式桥
    type: flow
    summary: 公开证据支持这样一条路径：从低摩擦检索使用，走向更高价值的研究产品、企业控制和部署服务。
    data:
      nodes:
        - id: demand
          label: 开发者 / 企业需求
          detail: AI 代理、搜索和研究工作流需要带有当前信息的网页数据。
        - id: retrieval
          label: 搜索和内容使用
          detail: 高频检索和提取调用构成入门级计费。
        - id: synthesis
          label: 研究和答案增购
          detail: 随着工作流深入，计算量更高的带引答案会提高每次调用收入。
        - id: vertical
          label: Finance Research 高端层
          detail: 在公开价目表中，专业金融研究位于通用研究之上。
        - id: enterprise
          label: 企业扩张
          detail: 零数据保留、DPA 准备度、SOC 2、自定义 QPS 和年度承诺支持更大账户。
        - id: services
          label: 部署支持
          detail: 通过 Weaver / 定制服务提供的固定费用实施，可以加快企业采用。
        - id: monetization
          label: 收入获取与利润率取舍
          detail: 收入组合可以向价值链上游移动，但抓取、推理和许可数据也会推高成本。
    approximationNotes: null
