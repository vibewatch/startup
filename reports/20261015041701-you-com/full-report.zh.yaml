      - number: '3.3'
        title: 定价、包装与分发杠杆
        blocks:
          - type: paragraph
            body: >-
              公开标价让这个品类异常容易试用，也异常难以只靠牌价建立防御。You.com 每天前 100 次 Search API
              调用免费，之后按使用量计价，降低了开发者采用门槛，也让采购讨论很快转向架构、合规和深度。Brave 的基础搜索价格大致持平，Exa 的搜索更贵且另收内容提取费用，Perplexity 同时提供托管回答路径和原始
              Search API。因此，You.com 的分发优势不在于最便宜，而在于客户从检索走向综合时可以留在同一条产品梯内；SDK、MCP、ZDR 和自定义 QPS 等企业控制项，则让客户落地后更容易扩张。
            claimRefs:
              - CP002
              - CP004
              - CP007
              - CP008
              - CP009
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP013
      - number: '3.4'
        title: 持久性、切换成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              护城河看起来真实，但尚未牢不可破。Sacra 的进展指标显示 You.com 已达到有意义的运营规模，这很重要：生态使用可以叠加分发效果，让公司比单点搜索 API
              拥有更大的触达面。即便如此，早期切换成本似乎中等，因为买家可以先用透明的单次调用价格自助开始，再在基础经济性相近的多个竞争 API
              之间切换。更持久的优势来自账户深化：一旦客户依赖多个端点、企业合规控制，以及叠加在私有数据之上的实时网页层，替换就会更痛苦。最清晰的反向证据是结构性的，而非声誉性的：价格聚集压缩了差异化，出版商收紧控制也可能损害支撑
              You.com 核心价值主张的内容访问。
            claimRefs:
              - CP010
              - CP012
              - CP013
              - CP014
              - CP015
