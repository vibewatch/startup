      - number: '1.2'
        title: 创始人、管理层梯队与治理透明度
        blocks:
          - type: paragraph
            body: >-
              在指定证据中，管理层信息比治理信息更透明。You.com 的“关于”页面如今列出产品、财务、法务和搜索等领域的完整运营班底，包括 COO Alex Triplett、CTO Saahil Jain、CPO
              Saurabh Sharma、搜索业务总裁 Alper Tekin、财务与运营副总裁 Jing Lee，以及总法律顾问兼秘书 Kirsten Mellor。创始人影响力仍集中在 Richard Socher
              身上：其当前公开简介也显示他是 Recursive 的 CEO 和联合创始人，同时继续领导 You.com。这种组合带来罕见的 AI 搜索与 NLP
              创始人—市场匹配，但也形成明显的关键人物依赖，使时间分配成为现实的尽调问题。指定来源没有披露董事会构成、正式控制权、债务融资或当前现金余额，因此治理判断仍要依赖私下资料，而非公开披露。
