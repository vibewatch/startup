  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接 API、替代方案与内部搜索相邻市场
        blocks:
          - type: paragraph
            body: >-
              买家的决策并不是在某一家 API 供应商之间做单一正面比较。公开证据显示，You.com 如今把自己定位为开发者和企业构建有依据 AI agent 的基础设施，因此会直接面对原生 AI 搜索与研究
              API；回答引擎、内部搜索 agent 和原始 SERP 栈也仍是同一任务的可行替代方案。Perplexity 是最明显的消费者搜索替代品，Exa 和 Brave 竞争开发者检索层，而 SerpAPI
              一类的原始搜索仍是愿意自行组装提取与综合栈的团队的默认构建路径。Sacra 还将 ARI 与 Glean、Guru 和 Moveworks
              放在企业研究工作流中比较；工作流从私有数据而非开放网页开始时，内部知识工具就是相邻的既有玩家。
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
              - CP007
              - CP008
              - CP011
              - CP015
