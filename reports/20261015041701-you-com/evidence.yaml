evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: series-c
    missingEvidence: >-
      Definitive Series C closing documents or a company-confirmed financing summary resolving whether the round size
      was $100 million or $150 million
    whyItMatters: >-
      Round size changes total capital raised, use-of-proceeds interpretation, and the credibility of the current
      valuation marker
    diligencePath: >-
      Request the board-approved financing summary, cap table update, and signed term sheet or closing memo for the
      September 2025 round
    relatedQuestionRefs:
      - QO003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Audited revenue, gross margin, burn, runway, and revenue mix by API or customer segment
    whyItMatters: >-
      Public sources support product relevance but do not let an investor underwrite durability, cost-to-serve, or
      funding need
    diligencePath: Obtain audited financial statements, board reporting packs, and product-level revenue or gross-margin bridges
    relatedQuestionRefs:
      - QO004
      - QO008
  - type: missing-source
    severity: material
    topic: governance-and-control
    missingEvidence: Current board roster, control rights, investor protections, debt facilities, and current cash balance
    whyItMatters: >-
      Leadership quality is visible, but governance authority and downside protection cannot be assessed from management
      biographies alone
    diligencePath: Request the cap table, board observer list, debt schedule, and latest board minutes or governance deck
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: A full stakeholder map with ownership percentages, board seats, and any secondary transactions
