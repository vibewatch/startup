      - ["Activity lens", "Sacra / 2025", "Global", ">1B queries per month; >100k agents", "Usage volume, not spend", "Shows adoption intensity but does not reveal net revenue by endpoint or customer mix", "Medium"]
      - ["Entry-price lens", "UsagePricing from you.com / 2026", "Global", "Search: free first 100 calls/day then US$5 per 1k calls; Contents: US$1 per 1k pages; Answer: US$5 per 1k calls", "Self-serve list prices", "Published pricing is a willingness-to-try proxy, not realized ASP or contract pricing", "Medium"]
      - ["Premium-workflow lens", "UsagePricing and Sacra / 2025-2026", "Global", "Research: US$12-US$1,200 per 1k calls; Finance Research: US$110-US$500 per 1k calls", "Higher-compute / higher-stakes tiers", "Shows monetization headroom, but public sources do not isolate attach rates or segment demand ceilings", "Medium"]
    notes: >-
      This table uses constrained lenses because retained sources do not provide
      a defensible third-party TAM/SAM/SOM for You.com's reachable market.
    claimRefs: [CM004, CM005, CM006, CM013, CM015]
