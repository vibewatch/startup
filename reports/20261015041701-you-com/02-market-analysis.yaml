      - ["Enterprise knowledge and analyst teams", "Operations, knowledge, or AI transformation lead", "Researchers, analysts, operators", "Knowledge-work automation budget", "Generate cited research that blends internal and external data", "COO, CIO, or knowledge-platform owner", "Need verifiable answers, not just model output"]
      - ["Marketing and competitive-intel teams", "Growth or content lead", "Marketers, strategists, analysts", "Marketing ops budget", "Track rankings, claims, competitors, and web changes faster", "CMO or rev-ops owner", "Need continuous web monitoring and sourced synthesis"]
      - ["Regulated-domain research teams", "Finance, risk, or legal lead", "Finance, compliance, or legal analysts", "Domain-software / risk budget", "Run higher-stakes diligence on finance and other vertical indexes", "CFO, GC, or risk owner", "Need provenance, freshness, and domain-specific data coverage"]
    notes: >-
      Rows reflect publicly visible workflows and inferred budget owners;
      private contract mix and segment-level revenue split remain undisclosed.
    claimRefs: [CM007, CM008, CM009, CM010, CM011, CM012]
figures:
  - id: FM001
    title: Public list-price ladder across reachable You.com workflows
    type: pyramid
    summary: >-
      Because retained evidence does not support a defensible TAM/SAM/SOM
      stack, this figure uses supported list prices to show the monetization
      ladder from base retrieval toward premium research workloads.
    data:
      items:
        - label: Contents API
          value: 1
          unit: USD per 1k pages
          note: Known-URL extraction
        - label: Search API
          value: 5
          unit: USD per 1k calls
          note: After the free first 100 calls/day
        - label: Answer API
          value: 5
          unit: USD per 1k calls
          note: Single-call cited answer
        - label: Research API (lite)
          value: 12
          unit: USD per 1k calls
          note: Entry cited-research tier
        - label: Research API (deep)
          value: 100
          unit: USD per 1k calls
          note: Higher-effort cited synthesis
        - label: Finance Research API (deep)
          value: 110
          unit: USD per 1k calls
          note: Specialized financial research tier
    approximationNotes: >-
      Public sources expose price points but not customer mix or realized ASP,
      so this substitutes for a classic TAM/SAM/SOM chart and should be read as
      a monetization ladder rather than a total market estimate.
    claimRefs: [CM004, CM013, CM015]
