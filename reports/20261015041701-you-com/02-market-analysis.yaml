  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gap
      missingEvidence: Independent market reports or public-company disclosures that isolate TAM, SAM, or SOM for AI search infrastructure, cited research APIs, or adjacent enterprise research software relevant to You.com.
      whyItMatters: Without an externally bounded market estimate, upside still depends on narrative extrapolation from pricing and traction proxies rather than a proven category ceiling.
      diligencePath: Request third-party market studies, pipeline segmentation by buyer category, or board materials that quantify reachable market by workflow and geography.
      relatedQuestionRefs: [QM002, QM008]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Realized ASP, gross margin, endpoint mix, and enterprise contract size by product line.
      whyItMatters: List prices do not reveal whether higher-value research tiers are actually driving durable economics or whether gross margin deteriorates as compute and data costs rise.
      diligencePath: Ask management for cohort data by endpoint, gross margin by product family, and representative enterprise pricing or discount bands.
      relatedQuestionRefs: [QM004, QM006, QM008]
      relatedTableRefs: [TM002]
