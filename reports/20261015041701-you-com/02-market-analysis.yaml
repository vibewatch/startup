      - ["Content extraction APIs", "Per-page spend to fetch and normalize page content from known URLs", "General ETL or web-scraping software bought for non-AI workflows", "Developers, data pipeline owners", "Necessary when a workflow needs full-page context instead of snippets"]
      - ["Cited research synthesis APIs", "Per-call spend for multi-step search, reading, and source-backed answers", "Broad productivity-chat subscriptions without explicit retrieval economics", "Research, ops, analyst, and knowledge teams", "Moves You.com from retrieval utility into workflow-level outcome pricing"]
      - ["Domain-specific research products", "Higher-value budgets for finance and future vertical indexes where freshness and provenance are critical", "All of financial data terminals, legal databases, or healthcare systems end-to-end", "Finance, risk, legal, or regulated-domain teams", "Represents the clearest path to bigger wallets but also the hardest evidence gap"]
    notes: >-
      Boundary is evidence-constrained from retained public product and pricing
      sources; excluded categories are kept separate so broad AI-software spend
      is not miscast as reachable You.com demand.
    claimRefs: [CM001, CM002, CM003, CM010, CM011]
