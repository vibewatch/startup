schemaVersion: report-v2
artifact: financials
slug: you-com
runDate: 2026-10-15
company:
  name: You.com
chapter:
  number: 4
  title: Financials
  summary: >-
    You.com's public financial story is an API-first, usage-priced revenue ladder
    that appears to be scaling quickly, but open-source evidence still supports
    commercial relevance more clearly than durable economics. Estimated ARR,
    retention, and usage signals are encouraging, yet current cash, burn, gross
    margin, realized pricing, and even the exact September 2025 round size remain
    too incomplete for clean underwriting.
sections:
  - id: revenue-architecture
    title: Revenue architecture and public price ladder
    body: >-
      Public evidence points to a revenue model built around web-grounding
      infrastructure rather than a broad seat-based SaaS plan. Official surfaces
      describe Web Search, Contents, Research, and Finance Research APIs, while
      independent analysis says revenue comes primarily from usage-based APIs and
      custom enterprise deployments. The price ladder is visible at list level:
      Search begins with a free daily quota and then per-call billing, Contents
      is metered per page, Research scales by effort tier, and Finance Research
      carries a higher price point. That creates a clear expansion path from
      lightweight retrieval into higher-value synthesis, but it still exposes
      only list pricing rather than realized net pricing by customer cohort.
    claimRefs: [CI001, CI003, CI004, CI005, CI006]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: gtm-and-traction
    title: GTM motion and public traction proxies
    body: >-
      The visible go-to-market motion starts with low-friction developer access
      and expands into enterprise controls, custom limits, and services. Official
      packaging advertises zero data retention, SOC 2, DPA readiness, and custom
      QPS limits, while independent pricing analysis adds $100 in free credit,
      volume discounts, and annual commitments. On traction, Sacra estimates
      $90 million of ARR in December 2025 versus $20 million a year earlier,
      170% net dollar retention, and more than 1 billion monthly queries. Those
      are strong commercialization signals, but they remain a mix of list-price
      inputs, company claims, and third-party estimates rather than audited
      revenue-quality disclosures.
    claimRefs: [CI002, CI006, CI007, CI008, CI009]
    tableRefs: [TI003]
  - id: cost-structure-and-margin-path
    title: Cost structure, delivery model, and margin path
    body: >-
      The public cost story is directionally clear even though it is not
      numerically underwritten. Higher-value products should carry better revenue
      per call, but they also add heavier inference, retrieval, and data costs.
      Sacra explicitly warns that tightening publisher controls can make crawling
      and content access more expensive, while Finance Research and other
      specialized verticals introduce licensed-data costs and validation overhead.
      Services revenue can help adoption but is unlikely to be software-like:
      Business Wire's Weaver announcement shows a fixed-fee deployment model tied
      to implementation outcomes, which can accelerate enterprise rollout but
      also implies labor-linked delivery costs alongside pure API gross margin.
    claimRefs: [CI010, CI014, CI015]
  - id: capital-adequacy-and-blockers
    title: Capital adequacy and underwriting blockers
    body: >-
      The latest public financing clearly supports continued investment, but it
      does not yet let an outside investor underwrite runway. Wikipedia and Built
      In report a September 2025 Series C of $100 million at a $1.5 billion
      valuation, while SiliconANGLE reported the same event as $150 million at
      the same valuation. More importantly, the retained public evidence here
      does not disclose current cash on hand, burn, runway, or debt obligations.
      That leaves the investment case relying on access to capital and visible
      commercial momentum, not on demonstrated cash adequacy. Management needs to
      close that gap before a financial diligence process can move from narrative
      plausibility to hard underwriting.
    claimRefs: [CI011, CI012, CI013]
tables:
