    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - [Web Search API, Usage-based retrieval API, calls, "Free for first 100 calls/day then $5 per 1,000 calls", "Public list price only", "Realized net price, average monthly volume, and customer concentration by segment"]
      - [Contents API, Usage-based extraction API, pages, "$1 per 1,000 pages", "Public list price only", "Share of revenue tied to extraction and live-crawl pass-through economics"]
      - [Research API, Effort-tiered synthesis API, calls, "$12 to $1,200 per 1,000 calls by effort tier", "Public list price only", "Mix by effort tier, gross margin by tier, and attach rate from Search/Contents"]
      - [Finance Research API, Premium domain-specific synthesis API, calls, "$110 to $500 per 1,000 calls", "Public list price only", "Customer mix, supplier/data-license burden, and renewal profile"]
      - [Enterprise platform expansion, Annual commitments plus custom QPS and controls, contract, "Volume discounts and annual commitments available", "Commercial motion visible but economics undisclosed", "Average contract value, term, ramp, and discount policy"]
      - [Implementation services / Weaver, Fixed-fee deployment support, engagement, "Weaver JV positioned as fixed-fee deployment support", "Adjacency visible; scale unclear", "Bookings mix between software and services, staffing model, and contribution margin"]
    notes: >-
      Mixes official product surfaces with independent pricing summaries; values
      are public list-price or status snapshots, not realized revenue.
    claimRefs: [CI001, CI003, CI004, CI005, CI006, CI010]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - [Search API, "Free first 100 calls/day; then $5 / 1,000 calls", List price, "Enterprise discounts and actual blended ARPU undisclosed", "UsagePricing summary of you.com pricing"]
      - [Contents API, "$1 / 1,000 pages", List price, "Actual live-crawl share and pass-through cost unknown", "UsagePricing summary of you.com pricing"]
      - [Research API, "$12 / $50 / $100 / $450 / $1,200 per 1,000 calls by effort", List price, "Tier mix and negotiated enterprise terms undisclosed", "UsagePricing summary of you.com pricing"]
      - [Finance Research API, "$110 / $500 per 1,000 calls", List price, "Supplier-cost burden and realized gross margin undisclosed", "UsagePricing summary of you.com pricing"]
      - [Enterprise expansion, "$100 free credit plus annual commitments and volume discounts", Hybrid self-serve to enterprise, "Discount ladders and minimum commits undisclosed", "UsagePricing plus official enterprise packaging"]
      - [Implementation services, Fixed-fee engagement, Realized pricing not public, "No public data on utilization or delivery margin", "Business Wire Weaver announcement"]
    notes: >-
      Public pricing is mostly list pricing from current developer-facing
      materials or independent summaries of those materials; realized enterprise
      pricing is not disclosed.
    claimRefs: [CI002, CI004, CI005, CI006, CI010]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [ARR estimate, "$90M in December 2025 vs $20M at end-2024", Medium, "Shows commercial scale and growth velocity", "Management revenue bridge by quarter and by SKU"]
      - [Net dollar retention, "170%", Medium, "Suggests expansion once customers deploy successfully", "Cohort definitions, gross retention, and concentration behind the estimate"]
      - [Usage volume, ">1B queries per month in 2025", Medium, "Proxy for demand and infrastructure load", "Paid query mix, customer concentration, and revenue per query"]
      - [Current cash balance, null, Low, "Central to runway and financing dependency", "Latest balance sheet, unrestricted cash, and subsequent financing or debt draws"]
      - [Net burn, null, Low, "Needed to translate fundraising into runway", "Monthly burn, restructuring charges, and capex commitments"]
      - [Gross margin by product line, null, Low, "Determines whether premium research SKUs improve economics", "Gross margin by Search, Contents, Research, Finance Research, and services"]
      - [CAC / payback, null, Low, "Validates whether self-serve-to-enterprise expansion is efficient", "Pipeline conversion, sales cycle, CAC, and payback by segment"]
      - [Services contribution margin, null, Low, "Determines whether deployment support is strategic enablement or margin drag", "Utilization, gross margin, and attach rate for Weaver/custom services"]
    notes: >-
      Populates the few public traction proxies available and leaves missing
      economics as nulls that require management disclosure rather than estimates.
    claimRefs: [CI007, CI008, CI009, CI011]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a sequence from low-friction retrieval usage into
      higher-value research products, enterprise controls, and deployment
      services.
    data:
      nodes:
        - id: demand
          label: Developer / enterprise demand
          detail: AI agents, search, and research workflows need current cited web data.
        - id: retrieval
          label: Search and contents usage
          detail: High-frequency retrieval and extraction calls create the entry-level meter.
        - id: synthesis
          label: Research and answer upsell
          detail: Higher-compute cited answers increase revenue per call as workflows deepen.
        - id: vertical
          label: Finance Research premium layer
          detail: Domain-specific financial research sits above general research in the public rate card.
        - id: enterprise
          label: Enterprise expansion
          detail: Zero data retention, DPA readiness, SOC 2, custom QPS, and annual commitments support larger accounts.
        - id: services
          label: Deployment support
          detail: Fixed-fee implementation through Weaver/custom services can accelerate enterprise adoption.
        - id: monetization
          label: Revenue capture and margin tradeoff
          detail: Revenue mix can move up the stack, but costs also rise with crawling, reasoning, and licensed data.
    approximationNotes: null
    claimRefs: [CI001, CI002, CI003, CI005, CI006, CI010, CI014, CI015]
callouts:
  - calloutType: insight
    title: Visible price ladder, invisible realized pricing
    body: >-
      The public rate card is detailed enough to explain how You.com wants
      customers to expand, but it still does not reveal realized pricing, gross
      margin, or revenue mix by SKU.
    claimRefs: [CI004, CI005, CI006]
  - calloutType: risk
    title: Premium products may add cost faster than public revenue evidence proves
    body: >-
      Finance Research and other higher-value products can improve revenue per
      call, but public evidence also points to higher supplier, crawling, and
      validation costs that may compress the margin path.
    claimRefs: [CI014, CI015]
  - calloutType: recommendation
    title: Capital adequacy still needs management proof
    body: >-
      Before underwriting the business, request current cash, burn, runway, debt,
      realized price realization by SKU, and software-versus-services mix for any
      deployment revenue.
    claimRefs: [CI011, CI012, CI013]
