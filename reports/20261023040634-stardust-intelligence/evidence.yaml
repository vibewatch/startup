evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited revenue, gross margin, cash burn, runway, and unit economics reconciled to the reported financing and
      product milestones.
    whyItMatters: >-
      A valuation above RMB10 billion cannot be assessed against operating performance or financing runway from the
      assigned evidence alone.
    diligencePath: >-
      Obtain audited statements, management accounts, financing documents, bank confirmations, and a cohort-level unit
      economics bridge.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Current board, executives, technical leadership, ownership percentages, and key-person succession coverage.
    whyItMatters: The available source names the founder but does not establish governance capacity or dependence on one executive.
    diligencePath: >-
      Request the current organizational chart, board minutes or register, cap table, employment agreements, and
      succession plan.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: commercialization
    missingEvidence: >-
      Independent reconciliation of signed orders, delivered and accepted units, recognized revenue, and active
      deployments.
    whyItMatters: >-
      Headline thousand-unit delivery and order claims may not equal accepted units, recurring customers, or recognized
      revenue.
    diligencePath: Sample customer contracts, shipment records, acceptance certificates, invoices, deployment logs, and renewal data.
    relatedQuestionRefs:
      - QO004
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: minor
    topic: governance
    missingEvidence: >-
      Independent corporate registry or filing evidence for legal entity identity, headquarters, and financing
      ownership.
    whyItMatters: Newswire descriptions do not establish the legal entity, registered address, or precise investor rights.
    diligencePath: Obtain registry extracts, financing term sheets, shareholder agreements, and official corporate filings.
    relatedQuestionRefs:
      - QO001
      - QO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A bottom-up market model separating target geographies, workflows, robot units, realized prices, service revenue,
      and adoption timing for Stardust.
    whyItMatters: >-
      Headline shipment and output forecasts cannot establish the company's serviceable market or support a valuation
      without a company-specific conversion path.
    diligencePath: >-
      Request management's target-account universe and reconcile it to paid deployments, pricing, service contracts, and
      a three-year unit plan by workflow.
    relatedQuestionRefs:
      - QM006
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: adoption-gap
    missingEvidence: >-
      Cohort-level deployment data showing delivered units, paid status, uptime, human intervention, gross margin after
      service, and repeat orders.
    whyItMatters: >-
      Production, shipment, and order claims do not demonstrate durable customer demand or economic replacement of labor
      and incumbent automation.
    diligencePath: >-
      Obtain anonymized customer cohort schedules and independently verify a sample of sites, invoices, uptime logs, and
      renewal or expansion behavior.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: market-size
    missingEvidence: A harmonized source using one definition for global shipments, Chinese output, installed base, and revenue.
    whyItMatters: >-
      The retained sources cite 15,000 and 18,000 global shipment estimates and also mix production, projected output,
      and price metrics.
    diligencePath: >-
      Ask each market-data publisher for definitions and reconcile the estimates by reporting period, geography, product
      scope, and shipment recognition.
    relatedQuestionRefs:
      - QM002
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable Stardust list and realized enterprise pricing, service fees, uptime commitments, and total cost of
      ownership.
    whyItMatters: >-
      Unitree's visible starting prices may reset buyer expectations, but the chapter cannot determine whether Stardust
      wins on value or margin.
    diligencePath: Obtain signed contract schedules, deployment quotations, service-level terms, and customer payback analyses.
    relatedQuestionRefs:
      - QP005
  - type: private-evidence-only
    severity: material
    topic: moat
    missingEvidence: Independent evidence on delivered units, actuator MTBF, yield, repeat orders, retention, and multi-homing.
    whyItMatters: >-
      A novel actuation architecture and a platform order do not establish durable differentiation without operating and
      retention data.
    diligencePath: Request customer references, field-service logs, production-quality reports, and cohort-level expansion data.
    relatedQuestionRefs:
      - QP006
      - QP007
  - type: missing-source
    severity: material
    topic: trust
    missingEvidence: >-
      Vendor-specific safety certification, incident history, cybersecurity testing, and data-governance controls for
      Stardust and peers.
    whyItMatters: Safety and data trust can determine whether industrial, education, or public-sector buyers permit deployment.
    diligencePath: >-
      Collect conformity assessments, penetration-test summaries, incident registers, and contractual data-processing
      controls.
    relatedQuestionRefs:
      - QP009
  - type: conflicting-data
    severity: minor
    topic: production
    missingEvidence: >-
      Independent reconciliation of company-reported production, shipments, orders, pilots, and sustained commercial
      operation.
    whyItMatters: Headline unit counts are not comparable if some include demonstrations or factory inventory.
    diligencePath: Reconcile serial-numbered deliveries, paid invoices, active-site logs, and customer acceptance records.
    relatedQuestionRefs:
      - QP001
      - QP003
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Audited revenue, gross margin, bill of materials, warranty costs, utilization, and contribution margin by product.
    whyItMatters: Without these inputs, scale claims cannot be translated into profitable or cash-generative growth.
    diligencePath: Request monthly management accounts, SKU-level unit economics, warranty ledger, and customer cohort utilization.
    relatedQuestionRefs:
      - QI003
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Cash bridge, monthly burn, runway, debt and project-finance obligations, committed capex, and next-round trigger.
    whyItMatters: A capital-intensive hardware company can require financing before demand or margins are proven.
    diligencePath: >-
      Obtain current bank statements or board-approved cash schedule, debt documents, capex plan, and financing
      scenarios.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: enumeration-incomplete
    severity: material
    topic: revenue-streams
    missingEvidence: A complete customer and contract-level revenue schedule by SKU, geography, and revenue type.
    whyItMatters: Headline pilots or orders may not represent delivered, paid, recurring, or collectible revenue.
    diligencePath: Reconcile CRM, invoices, delivery records, acceptance certificates, renewals, and receivables aging.
    relatedQuestionRefs:
      - QI001
      - QI005
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: stardust-product
    missingEvidence: >-
      An official Stardust specification sheet and current product documentation covering T1 configuration, target
      users, status, and supported workflows.
    whyItMatters: >-
      The retained evidence identifies the product only through a title and cannot establish what is delivered or to
      whom.
    diligencePath: Obtain a dated technical data room export and reconcile every stated capability to a demonstrable configuration.
    relatedQuestionRefs:
      - QE001
      - QE002
  - type: private-evidence-only
    severity: material
    topic: stardust-architecture
    missingEvidence: >-
      Actuator topology, cable routing, controller architecture, sensor bill of materials, compute stack, software
      interfaces, and test protocols.
    whyItMatters: >-
      The unconventional actuator thesis cannot be underwritten without reliability, calibration, maintenance, and
      safety evidence.
    diligencePath: >-
      Request design reviews, subsystem test reports, failure-mode analysis, MTBF or equivalent field data, and
      service-cost assumptions.
    relatedQuestionRefs:
      - QE003
      - QE004
      - QE005
    relatedTableRefs:
      - TE002
  - type: missing-source
    severity: material
    topic: deployment-reliability
    missingEvidence: >-
      Named deployments, production-versus-pilot status, uptime, task success, acceptance criteria, warranty, and
      support records.
    whyItMatters: Sector shipment and demonstration claims do not establish durable customer value or implementation economics.
    diligencePath: Obtain customer references, deployment logs, acceptance tests, incident reports, and current support SLAs.
    relatedQuestionRefs:
      - QE004
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: safety-security-compliance
    missingEvidence: >-
      Safety case, certifications, cybersecurity assessment, privacy controls, update governance, and compliance
      mapping.
    whyItMatters: Humanoid robots operate near people and combine physical, software, and data risks.
    diligencePath: Commission an independent safety and security review and map controls to applicable standards before deployment.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE002
  - type: missing-source
    severity: blocking
    topic: retention
    missingEvidence: >-
      Audited customer cohorts showing delivered units, active utilization, renewal or repeat-order rates, churn, and
      gross or net retention.
    whyItMatters: Orders and promotional delivery claims cannot establish durable revenue quality or customer satisfaction.
    diligencePath: >-
      Request customer-level cohort data, contracts, acceptance records, utilization logs, renewal history, and two
      independently referenceable end-customer calls.
    relatedQuestionRefs:
      - QU004
      - QU005
      - QU006
  - type: enumeration-incomplete
    severity: material
    topic: named proof
    missingEvidence: >-
      A complete list of named end-customers, deployment locations, production versus pilot status, and measurable
      outcomes.
    whyItMatters: >-
      The current record may overstate breadth by grouping unnamed target segments with one named integration
      counterparty.
    diligencePath: >-
      Obtain a deployment ledger with customer consent, site, unit count, commissioning date, workflow, uptime, and
      outcome metric.
    relatedQuestionRefs:
      - QU002
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: customer concentration
    missingEvidence: Revenue and order concentration by customer, partner, channel, and end-market.
    whyItMatters: A single anchor order or integration partner could make apparent growth fragile.
    diligencePath: Request the top-customer concentration schedule, backlog aging, channel terms, and dependency analysis under NDA.
    relatedQuestionRefs:
      - QU007
  - type: missing-source
    severity: material
    topic: customer economics
    missingEvidence: >-
      Independent before-and-after ROI, total cost of ownership, service cost, and payback evidence for deployed
      Stardust units.
    whyItMatters: A lower list price does not establish positive customer economics or repeatable procurement.
    diligencePath: >-
      Validate site-level labor savings, uptime, maintenance, integration hours, safety incidents, and payback against
      signed customer records.
    relatedQuestionRefs:
      - QU005
      - QU009
      - QU010
  - type: missing-source
    severity: blocking
    topic: cybersecurity
    missingEvidence: >-
