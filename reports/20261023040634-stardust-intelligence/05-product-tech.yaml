    columns: [user job, current workflow, company solution, measurable benefit, limitation]
    rows:
      - [Move or handle materials, "Human or fixed automation in a controlled site", "Humanoid mobility is a possible fit", "Sector evidence points to material handling as an early task", "No Stardust pilot, cycle time, or safety acceptance data"]
      - [Inspect or support production, "Human inspection and task-specific tools", "Embodied robot may add flexible sensing and movement", "Inspection support is identified as an early industrial use case", "No Stardust accuracy, false-positive, or uptime data"]
      - [Simple assembly assistance, "Human labor or dedicated industrial robots", "Humanoid form may access human-designed workspaces", "Potential flexibility where environments are not redesigned", "No Stardust task envelope or repeatability evidence"]
      - [Food preparation or experiments, "Title-level T1 description only", "NetEase title references steak frying and experiments", "Potential demonstration or research use", "Fetched body does not verify deployment, customer, or outcome"]
    notes: "The first three rows are sector use-case benchmarks; the final row is limited to the retained source title and must not be read as verified Stardust deployment."
    claimRefs: [CE001, CE002, CE003, CE012]
