company:
  name: Stardust Intelligence
chapter:
  number: 5
  title: Product & Technology
  summary: Public evidence places Stardust Intelligence in an early humanoid-robot market where cable-driven actuation, safety controls, deployment reliability, and manufacturing repeatability are decisive. The assigned refresh pool does not contain a direct Stardust specification sheet, software repository, certification, or named deployment record, so product maturity is assessed against sector benchmarks and explicitly bounded by those gaps.
sections:
  - id: product-and-workflow
    title: Product definition and operating context
    body: Stardust Intelligence is publicly described in the assigned pool only through a NetEase article title as offering the rope-driven T1 AI robot, including food preparation and experiment-oriented use cases; the fetched page body is not available beyond its title/navigation shell, so those capabilities remain company-specific evidence gaps rather than verified operating claims. Sector evidence indicates that near-term humanoid value is concentrated in controlled automotive and logistics workflows rather than general household autonomy. IDTechEx describes early tasks as material handling, inspection support, intra-factory transport, and simple assembly assistance, with reliability, safety validation, and maintainability prioritized over general-purpose capability. This makes the practical product question less about demonstrations and more about repeatable task execution in a bounded customer workflow. China’s 2026 standards framework also spans complete systems, applications, safety, ethics, data, training, inference, and deployment, raising the diligence bar for any product claiming embodied intelligence. The current record does not establish Stardust’s buyer, production-versus-pilot status, software interface, or measurable customer outcome.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001]
  - id: architecture-and-maturity
    title: Architecture, dependencies, and maturity
    body: >-
      The only detailed mechanical benchmark in the pool is Unitree’s G1 page: a comparable humanoid platform lists 23 degrees of freedom, crossed-roller bearings, internal-rotor permanent-magnet synchronous motors, hollow electrical routing, dual encoders, local air cooling, depth camera plus 3D LiDAR, an eight-core CPU, Wi-Fi 6/Bluetooth 5.2, and about two hours of battery life. These fields illustrate the subsystem stack Stardust must document, but they do not establish that Stardust uses the same design. Independent market analysis identifies battery energy density, thermal management, precision screws and bearings, actuators, tactile sensing, and end-effectors as scaling bottlenecks. The standards source further identifies lifecycle data, model training, inference, deployment, application interfaces, trustworthiness, and evaluation as active standardization areas. Against that benchmark, the rope/cable-driven approach is potentially differentiated, but the assigned evidence contains no verified actuator topology, transmission lifetime, calibration process, software stack, API, sensor suite, MTBF, manufacturing yield, or field-service design for Stardust.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE002]
    figureRefs: [FE001]
  - id: risk-and-diligence
    title: Reliability, safety, and implementation risk
    body: Product risk is elevated because humanoid systems combine high-energy mechanics, batteries, perception, control software, and human proximity. Unitree’s published page warns that the robot has a complex structure and powerful actuation, asks users to maintain a sufficient safety distance, and says some sample functions remain under development and testing; those statements are a useful benchmark for the type of qualification Stardust should publish, not evidence of Stardust’s own safety record. The new Chinese standards framework includes safety and ethics across the lifecycle, while Shenzhen’s insurance initiative shows that embodied-robot risk protection is becoming an infrastructure concern. Sector research says home use remains longer term because safety, affordability, and reliability barriers remain unresolved, and notes battery runtime and component supply-chain limits. The refresh pool contains no Stardust incident history, certification, security assessment, uptime data, deployment acceptance test, warranty terms, or developer signal. Those omissions materially limit underwriting of reliability and implementation cost.
    claimRefs: [CE010, CE011, CE012, CE013]
    tableRefs: [TE003]
