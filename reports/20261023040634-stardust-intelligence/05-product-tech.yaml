      - [Actuation and control, "Generate and coordinate motion", "Motor drivers, cable routing, encoders, control software", "Cable stretch, backlash, calibration drift, and fault containment require test evidence"]
      - [Sensing and perception, "Observe pose, environment, and objects", "Cameras, depth/LiDAR, tactile sensors, compute", "Occlusion, sensor failure, latency, and safe fallback are unverified"]
      - [Embodied AI stack, "Map data and models to actions", "Training data, inference runtime, SDK/API, update process", "Data provenance, model drift, cybersecurity, and reproducibility are open"]
      - [Power and thermal, "Supply energy and manage heat", "Battery, charging, cooling, duty cycle", "Runtime, charging downtime, thermal limits, and battery lifecycle are open"]
      - [Deployment and service, "Install, operate, update, and repair", "Customer workflow, remote support, spares, warranty", "No Stardust deployment, uptime, warranty, or support evidence is retained"]
    notes: "Architecture is a diligence framework grounded in retained sector and comparable-platform evidence; it is not a claim that Stardust uses each listed component."
    claimRefs: [CE005, CE006, CE007, CE008, CE009, CE013]
  - id: TE003
