callouts:
  - calloutType: risk
    title: Product underwriting is evidence-constrained
    body: The assigned refresh evidence supports sector-level architecture and risk benchmarks but does not verify Stardust’s actuator reliability, deployment maturity, software surface, certifications, or security controls.
    claimRefs: [CE001, CE009, CE011, CE013]
  - calloutType: recommendation
    title: Require a reproducible technical data room
    body: Before underwriting product maturity, require a current specification sheet, subsystem architecture, safety case, test results, field logs, deployment references, warranty terms, and developer documentation tied to the rope-driven platform.
    claimRefs: [CE006, CE008, CE010, CE013]
