company:
  name: Stardust Intelligence
chapter:
  number: 3
  title: Competitors
  summary: Stardust competes in a rapidly industrializing humanoid-robotics field where Unitree and AGIBOT lead visible shipment and production signals, while Galbot combines large financing with claimed deployments. Public evidence supports an early cost-and-scale advantage for Chinese peers, but leaves Stardust's relative production, realized pricing, reliability, and customer conversion unverified.
sections:
  - id: landscape
    title: Competitive landscape and scale signals
    body: >-
      The relevant landscape includes direct humanoid peers, vertically integrated incumbents,
      adjacent component and platform providers, and non-humanoid substitutes for structured
      work. Public reporting places Unitree and AGIBOT at the leading edge of Chinese shipment
      and production scale: Omdia estimates cited by CNBC put expected 2025 global shipments at
      15,000 units, with Unitree second to AGIBOT, while TrendForce projects the two companies
      together could represent nearly 80% of Chinese shipments in 2026. Galbot's company-issued
      release claims more than $300 million of new funding, $800 million total funding, a $3
      billion valuation, thousands of industrial orders, and operations in more than 30 cities;
      those claims are useful competitive signals but are not independent verification. Stardust
      therefore enters a field where scale, ecosystem access, and deployment evidence may matter
      as much as mechanical differentiation.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability
    title: Capability, distribution, and trust comparison
    body: >-
      The strongest documented peer advantages are differentiated rather than uniform. Unitree
      has a low-price product ladder and visible capital-market access; AGIBOT has a reported
      10,000-unit production milestone and broad deployment claims; Galbot describes a
      full-stack model, industrial partners, retail, logistics, and hospital use cases. Stardust
      has a distinct rope-driven architecture and a documented three-party development-platform
      order with Baidu Intelligent Cloud and Jishu Iteration, which could support data collection
      and developer distribution. However, the evidence does not establish that this platform
      order equals recurring robot revenue, nor that rope-driven actuation has superior lifetime
      reliability or cost. Security and standards posture is also a buying criterion: Chinese
      humanoid vendors face scrutiny around safety, data, and compliance, while emerging
      standards may reduce interoperability uncertainty without proving any vendor's compliance.
    claimRefs: [CP005, CP006, CP007, CP008]
    tableRefs: [TP002]
  - id: economics
    title: Pricing, switching costs, and moat durability
    body: >-
      Public pricing evidence is concentrated in Unitree rather than Stardust or most peers.
      CNBC reports a $5,900 starting price for Unitree R1 and a $16,000 starting price for G1,
      while contrasting Tesla Optimus at an expected price of at least $20,000. These are list
      or reported starting prices, not realized enterprise contract prices, service costs,
      gross margins, or total cost of ownership. Galbot and AGIBOT emphasize deployment scale
      and partnerships rather than public price cards. Switching costs are likely to arise from
      data pipelines, task models, operator training, safety validation, and component supply,
      but the assigned evidence does not quantify customer lock-in, multi-homing, or partner
      exclusivity. Stardust's Baidu/Jishu platform relationship may lower adoption friction for
      educational and development use, yet customer retention and recurring software economics
      remain open questions.
    claimRefs: [CP009, CP010, CP011]
    tableRefs: [TP003]
  - id: risks
    title: Displacement risk and diligence judgment
    body: >-
      Competitive displacement risk is material because production is scaling faster than
      independently verified end-use demand. Futurism cites warnings that humanoid startups
      face fundamental challenges in inference, dexterity, reliability, and cost, limiting
      initial use cases to structured factories and warehouses; it also reports concerns about
      an investment bubble and similar products crowding out research. Robotics and Automation
      News describes China's 2026 safety-and-ethics standards framework, but also notes that
      tactile sensing remains a bottleneck. This creates a two-sided risk for Stardust: a
      standards-led market can accelerate adoption, while better-funded peers may commoditize
      hardware before Stardust proves a durable actuator, data, or distribution moat. The next
      diligence priority is comparative evidence on delivered units, uptime, service economics,
      and named customer expansion rather than additional valuation headlines.
    claimRefs: [CP012, CP013, CP014]
    callouts: [ ]
