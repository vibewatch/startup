    claimRefs: [CP001, CP002, CP003, CP005, CP009]
callouts:
  - calloutType: insight
    title: Scale is becoming a moat
    body: "Unitree and AGIBOT show the strongest public scale signals, while Galbot pairs financing with claimed multi-industry deployment. Stardust's competitive case must therefore connect its rope-driven design and platform partnership to repeatable delivery and customer expansion."
    claimRefs: [CP001, CP002, CP003, CP005]
  - calloutType: risk
    title: The price benchmark is incomplete
    body: "Unitree's reported starting prices make the market legible, but no assigned source supplies comparable Stardust pricing, service cost, uptime, or enterprise contract economics. A low sticker price cannot by itself establish lower total cost of ownership or a durable moat."
    claimRefs: [CP009, CP010, CP011, CP014]
