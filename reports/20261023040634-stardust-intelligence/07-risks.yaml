callouts:
  - calloutType: risk
    title: Primary thesis-break trigger
    body: >-
      Treat the investment case as broken if Stardust cannot demonstrate independently
      tested robot security and safety, paid repeatable deployments with usable service
      economics, and funded production capacity before a material regulatory or supplier
      constraint arrives.
    claimRefs: [CR005, CR009, CR011]
  - calloutType: assumption
    title: Evidence boundary
    body: >-
      The assigned pool contains sector and policy evidence but no Stardust-specific
      incident, certification, financial, supplier, or customer dataset. Conclusions
      therefore distinguish documented external risk pathways from unresolved company
      exposure.
    claimRefs: [CR003, CR006, CR012]
