  - id: TR001
    title: Regulatory / legal risk register
    columns: [Rule or issue, Jurisdiction, Likelihood, Severity, Mitigation maturity, Residual exposure, Diligence path]
    rows:
      - ["Proposed GUARD Act review and possible FCC Covered List action", "United States", "Medium", "High", "Early policy proposal; no company-specific determination", "High", "Obtain counsel memo on applicability and U.S. market-access scenarios"]
      - ["Foreign-adversary robotics procurement and import restrictions", "United States and allied markets", "Medium", "High", "Legislative and policy scrutiny is active; company posture not disclosed", "High", "Map target-country procurement rules and restricted-customer exposure"]
      - ["Data-governance and connected-robot national-security scrutiny", "Cross-border", "Medium", "High", "Public evidence describes the policy concern but not Stardust controls", "High", "Review data flows, hosting, remote access, update controls, and customer contract commitments"]
    enumerationScope:
      coverage: partial
      basis: "Public legislative and reporting sources covering major foreign-robotics policy pathways available at the 2026-10-23 run date."
    notes: >-
      Sources are public legislative, industry, and reporting materials; likelihood,
      severity, and residual exposure are analyst assessments of the documented risk
      pathways, not findings that Stardust has violated a rule. No enacted Stardust-
      specific restriction was identified in the assigned pool.
    claimRefs: [CR001, CR002, CR003]
  - id: TR002
    title: Operational, quality, and security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Remote compromise or unsafe control of a connected robot", "Medium", "Critical", "Sector example shows the need for security engineering; Stardust controls not disclosed", "High", "Independent penetration test and signed-update evidence"]
      - ["Battery, actuator, or software reliability shortfall in production use", "Medium", "High", "No Stardust MTBF, field-failure, or warranty data in pool", "High", "Obtain reliability distribution, service logs, and safety certification"]
      - ["Incident response or patching failure across deployed units", "Medium", "High", "Public incident and patch commitments not established", "High", "Review runbooks, patch latency, rollback, and offline recovery tests"]
      - ["Manufacturing or quality-control variance during scale-up", "Medium", "High", "Sector capacity expansion is reported but Stardust yield is not", "High", "Audit factory yield, acceptance tests, supplier quality, and recall reserves"]
    notes: >-
      Risk ratings are directional because the assigned sources establish sector
      failure modes but do not disclose Stardust-specific test results, deployed-unit
      counts, or incident records. Absence of a recorded incident is not proof of
      absence.
    claimRefs: [CR004, CR005, CR006, CR010]
  - id: TR003
    title: Partner and dependency risk register
    columns: [Dependency, Counterparty or layer, Role, Concentration signal, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Component supply", "Joint modules, hands, sensors", "Critical upstream hardware", "Industry capacity expansion implies growing component demand; Stardust concentration unknown", "Supplier disruption delays builds or raises cost", "High", "Dual-source qualification and inventory policy", "High"]
      - ["Capital markets", "Venture and public-market financing", "Funds scale-up and working capital", "Sector investment and IPO activity may increase competition for capital", "Down-round or delayed financing interrupts milestones", "High", "Stage-gated plan and minimum cash buffer", "High"]
      - ["Customer conversion", "Industrial and public-sector buyers", "Converts pilots into recurring deployments", "Sector reporting questions whether some deployments are demonstrations or strategic tie-ups", "Paid demand may not repeat", "High", "Require signed paid orders, utilization, renewal, and gross-margin cohorts", "High"]
      - ["Policy access", "Regulators and procurement authorities", "Determines eligible markets and buyers", "Proposed U.S. robotics restrictions could broaden", "Restricted market or customer loss", "High", "Country-by-country compliance and alternate-market plan", "High"]
    notes: >-
      Counterparty names are expressed at dependency-layer level because the assigned
      pool does not identify Stardust suppliers, financiers, or customers. Concentration
      and residual-exposure fields remain unresolved until company diligence is provided.
    claimRefs: [CR007, CR010, CR011, CR012, CR013, CR014, CR015]
