company:
  name: Stardust Intelligence
chapter:
  number: 7
  title: Risks
  summary: Stardust Intelligence faces policy and deployment risk as U.S. lawmakers propose national-security review of foreign-made robots while the broader humanoid sector remains commercially immature. The most material unresolved exposures are regulatory access, cybersecurity and data governance, uncertain demand quality, and the capital and supply-chain burden of scaling a hardware platform.
sections:
  - id: regulatory-and-geopolitical
    title: Regulatory and geopolitical exposure
    body: >-
      The clearest external risk is that foreign-made robotics are becoming a
      national-security policy category. The U.S. GUARD Act proposal would subject
      certain humanoid and quadruped robots, plus their communications systems, to
      national-security review and could place products on the FCC Covered List if
      they are judged an unacceptable risk (SR001, SR002). The proposal is not an
      enacted prohibition, so its direct legal effect on Stardust Intelligence is
      unresolved; however, it signals a pathway by which customer eligibility,
      import, research, and public-sector procurement could tighten. This is a
      jurisdictional and market-access risk rather than evidence that Stardust has
      been accused of wrongdoing. Investors should require an export-control map,
      target-country screening, and a contingency plan for restricted deployments.
    claimRefs: [CR001, CR002, CR003]
    tableRefs: [TR001]
  - id: operational-cyber-and-safety
    title: Cybersecurity, safety, and operational reliability
    body: >-
      Connected humanoids combine physical actuation, sensors, software updates,
      and networked control, so a cyber incident can become a safety, service, and
      liability event. The GUARD Act announcement frames the policy concern as
      sensitive data exposure, persistent access, or remote disruption in connected
      robotics (SR002), while reporting on the sector notes that Unitree researchers
      disclosed a wormable Bluetooth flaw affecting robots and described full-device
      takeover; that example is not evidence of a Stardust vulnerability, but it
      demonstrates the class of failure investors must test (SR005). Public sources
      in this pool do not establish Stardust's penetration-test results, incident
      history, safety certification, mean time between failures, or patch-service
      commitments. Those unknowns leave residual exposure high until independent
      testing, update signing, offline recovery, and field-failure data are supplied.
    claimRefs: [CR004, CR005, CR006]
    tableRefs: [TR002]
  - id: demand-and-commercialization
    title: Demand quality and commercialization risk
    body: >-
      Sector-level commercialization evidence is mixed. A KrASIA account reports
      investors describing embodied intelligence as commercially unclear, says
      many automotive deployments may be strategic tie-ups rather than sales, and
      quotes an investor questioning valuations before product-market fit (SR003).
      By contrast, TrendForce reports rapid Chinese output growth and says Unitree
      and AgiBot could account for nearly 80% of shipments, while CNBC reports
      strong sector investment and planned deployments for other startups (SR006,
      SR009). These are market context, not Stardust customer proof. The risk is
      that headline orders or demonstrations do not convert into paid, repeatable
      production deployments with acceptable service economics. Stardust has not
      publicly disclosed enough independently verified delivered-unit, utilization,
      renewal, gross-margin, or customer-concentration data in this pool to quantify
      that risk.
    claimRefs: [CR007, CR008, CR009]
    tableRefs: [TR003]
  - id: capital-supply-chain-and-kill-criteria
    title: Capital intensity, dependencies, and thesis-break triggers
    body: >-
      Humanoid robotics requires coordinated hardware, software, manufacturing,
      and component supply, making execution sensitive to financing conditions and
      vendor continuity. TrendForce describes planned capacity expansion and
      upstream demand for joint modules, hands, and sensors, while CNBC reports
      that Chinese humanoid startups are rushing toward public markets amid rapidly
      rising sector investment (SR006, SR009). Galbot's own release says its latest
      round exceeded $300 million and assigned the company a $3 billion valuation,
      while SCMP reports that BYD and Xpeng are accelerating humanoid mass-production
      plans (SR007, SR008). Funding raised is not cash available, but these signals
      show intensifying competition for talent, suppliers, and commercialization
      milestones. The pool does not provide Stardust's cash balance, burn, debt,
      component single-source exposure, manufacturing yield, or warranty reserve.
      A thesis should therefore break if the company cannot fund its next production
      milestone, loses a critical supplier without a qualified substitute, or fails
      independent reliability and paid-deployment tests.
    claimRefs: [CR010, CR011, CR012, CR013, CR014, CR015]
    figureRefs: [FR001]
