company:
  name: Stardust Intelligence
chapter:
  number: 2
  title: Market Analysis
  summary: The relevant market is not humanoid robotics in the abstract but deployable embodied-AI systems for defined industrial, logistics, retail, education, and research workflows. Current evidence shows rapid Chinese supply expansion and falling entry prices, while buyer satisfaction, reliability, structured-environment dependence, and policy constraints keep the near-term addressable market narrower than headline shipment or valuation figures imply.
sections:
  - id: market-boundary
    title: Market boundary and buying problem
    body: >-
      Stardust Intelligence participates in the embodied-AI and humanoid-robot market, but the investable opportunity should be bounded around physical systems that combine a robot body, onboard or connected intelligence, and an operating workflow. Included spend is the purchase or lease of the robot, deployment integration, safety and maintenance, teleoperation, model or software support, and training data generated in use. Excluded from the core boundary are general industrial automation that does not need a humanoid form, research demonstrations with no deployment budget, and broad AI software revenue that is not attached to physical operation. The closest substitutes are fixed automation, specialized mobile robots, human labor, and teleoperated equipment. Buyer value is therefore task-specific: a lower-priced body can expand pilots, but it does not by itself prove repeatable utilization, safe operation, or an economic replacement for an existing workflow.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Multiple sizing lenses and commercialization signal
    body: >-
      The evidence supports a layered sizing view rather than a single top-down TAM. A global shipment lens reported approximately 15,000 units expected in 2025, while another market estimate cited roughly 18,000 global shipments for that year; these are forecasts or estimates with different methodologies, not a reconciled installed base. A China production lens is more actionable for Stardust: TrendForce projects Chinese humanoid output growth of up to 94% in 2026 and nearly 80% combined share for Unitree and AgiBot, while the TechTimes account describes AgiBot reaching 10,000 produced units and Unitree reporting 5,500 humanoid units shipped in 2025. A company-level price lens is also visible: the newly reported T1 starting price below RMB90,000 may lower the pilot barrier, but it is not evidence of realized revenue, gross margin, or total serviceable demand. These lenses indicate a fast-forming supply market, not a validated broad market for autonomous general-purpose labor.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyers, adoption drivers, and constraints
    body: >-
      Near-term adoption is most plausible where the buyer can define a repeatable task and tolerate human oversight: factories, logistics sites, retail or hospitality venues, education and research labs, and public-service pilots. The budget owner may be operations, automation engineering, innovation, research, or workforce-training leadership rather than a general IT function. Drivers include labor scarcity, a lower hardware entry price, access to real-world training data, and the possibility of integrating a robot into an existing operating system or channel. Constraints are equally material. A market account cites a Morgan Stanley survey in which only 23% of prospective industrial buyers reported satisfaction with currently available products; Futurism quotes warnings that inference, dexterity, reliability, and cost still confine initial use cases to structured factories and warehouses. Battery endurance of two to three hours, uncertain sustained utilization, cybersecurity or foreign-adversary policy concerns, and the engineering cost of adapting workflows can delay adoption even when a pilot is technically successful. For valuation, the key proof point is not shipment count but paid, repeatable utilization with disclosed deployment economics.
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
    tableRefs: [TM003]
  - id: diligence-gaps
    title: Sizing and adoption gaps
    body: >-
      The retained evidence does not isolate Stardust Intelligence's SAM or SOM by geography, workflow, or paying customer. Reported orders and deployments are largely company or investor communications, and the pool does not provide audited revenue, realized average selling price, service attach rate, utilization, failure rates, or customer retention. The market estimates also mix shipments, production, and projected output, so they cannot be converted into a common revenue pool without a consistent unit, period, geography, and price basis. The next diligence step is to obtain a deployment cohort by use case with delivered units, paid status, uptime, intervention hours, gross margin after service, and repeat-order behavior, then reconcile it to a bottom-up list of target sites and budget owners. Until that evidence exists, the prudent market conclusion is that the category is expanding rapidly but the company-specific serviceable opportunity remains evidence-constrained.
    claimRefs: [CM015, CM016]
callouts:
  - calloutType: insight
    title: Supply growth is ahead of proof of durable demand
    body: Chinese production and financing signals are strong, but the available evidence still describes a market moving from pilots toward commercialization rather than a mature recurring-revenue market.
    claimRefs: [CM005, CM010, CM015]
  - calloutType: risk
    title: Price reduction does not establish adoption economics
    body: A sub-RMB90,000 starting price may widen the pilot funnel, yet utilization, maintenance, safety, and workflow-integration costs determine whether the buyer's total cost is competitive.
    claimRefs: [CM009, CM011, CM012]
