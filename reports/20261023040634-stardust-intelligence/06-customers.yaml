chapter:
  number: 6
  title: Customers
  summary: Stardust presents industrial logistics, manufacturing, commercial services, care, and education as adoption lanes, with a reported thousand-unit-scale order providing the clearest external deployment signal. The evidence is still weighted toward company-linked announcements and industry commentary; named end-customers, delivered units, retention, and independently measured ROI remain unverified.
sections:
  - id: customer-segments
    title: Buyer, user, and payer segments
    body: >-
      The clearest target segment is industrial and logistics operations, where robots can
      move materials, transport turnover boxes, load and unload lines, and recover empty
      containers. A reported order with Xi'an Gong Intelligence describes a two-year,
      staged deployment across industry, manufacturing, warehousing, and logistics, with
      Xi'an Gong providing control-system technology and scenario integration. This is a
      workflow-level signal rather than proof of paid end-customer usage: the public item
      does not disclose price, contract value, delivery schedule by tranche, acceptance
      criteria, or the ultimate operating sites. A separate company-linked product article
      places Stardust in industrial logistics, commercial tourism, eldercare, research, and
      education, while describing T1 as aimed at household, commercial, research,
      entertainment, and industrial settings. Those broader segments should be treated as
      go-to-market targets, not equivalent evidence of mature revenue.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and proof quality
    body: >-
      The strongest observed trajectory is a move from demonstrations toward structured
      industrial workflows, not generalized household adoption. TrendForce reports that
      Chinese vendors are clarifying commercial use cases and scaling output, and says
      automotive manufacturing, consumer electronics, and logistics orders indicate a shift
      from trial adoption toward real demand across the sector. Independent commentary
      nevertheless describes current practical use as concentrated in structured
      manufacturing and logistics, with many systems still scripted or teleoperated and
      with a need to see robots working alongside humans in normal production sites before
      calling them ready for commercial scale-up. Stardust-specific materials claim
      thousand-unit-scale batch delivery and scenario ROI models, but provide no audited
      utilization, uptime, repeat-order, or customer outcome dataset. Therefore the
      adoption signal is promising but should not be converted into a customer count or
      recurring-revenue claim.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
  - id: named-proof
    title: Named proof, durability, and reference quality
    body: >-
      Xi'an Gong Intelligence is the only named Stardust counterparty in the retained
      evidence. The reported arrangement combines Stardust's rope-driven robot and
      embodied-intelligence work with Xi'an Gong's control technology, and describes
      staged deployment into industrial and logistics scenarios. That makes it stronger
      than a logo or generic partnership mention, but the source is a short news item
      repeating a company announcement and does not identify the end-buyers, locations,
      deployed-versus-ordered units, or measured production outcomes. The T1 article
      further claims completed batch deliveries across four broad lanes and repeat purchase
      intent, yet those assertions are promotional and lack customer quotations or
      independently audited records. Retention metrics such as GRR, NRR, churn, renewal
      length, cohort survival, and support burden are not disclosed in the pool.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
  - id: expansion-risk
    title: Expansion path and concentration risk
    body: >-
      A plausible expansion loop is to start with controlled industrial material handling,
      use deployment data to improve the robot and model, then extend into other structured
      commercial or service workflows. The reported order explicitly describes staged,
      multi-scenario deployment and continued data collection, while independent market
      evidence identifies manufacturing, warehousing, and logistics as the earliest
      adoption settings because their layouts and tasks are comparatively repeatable.
      That loop remains a hypothesis until Stardust discloses paid deployment cohorts,
      acceptance and renewal terms, utilization by site, unit economics, and repeat-order
      conversion. Concentration risk is also unresolved: one named integration
      counterparty and undisclosed end-customer identities make it impossible to assess
      whether demand is diversified or dependent on a single channel, partner, or anchor
      order. Procurement friction, safety acceptance, and serviceability may further slow
      expansion.
    claimRefs: [CU013, CU014, CU015, CU016]
    figureRefs: [FU001]
