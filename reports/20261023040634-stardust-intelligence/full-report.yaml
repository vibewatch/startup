chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating model
        blocks:
          - type: paragraph
            body: >-
              Available reporting identifies Stardust Intelligence as Astribot, a Shenzhen-based company founded in
              2022. Its founder and CEO, Lai Jie, is described as having more than 17 years of AI and robotics research
              and design experience, including work at Tencent's Robotics Laboratory and Baidu's Xiaodu Robot team. The
              reported product strategy is vertically integrated: a base model, the Embodied OS, and a rope-driven body
              are developed as one stack. The rope-driven design places motors away from joints and uses tendon-like
              cables, while the DuoCore framework separates fast real-time response from slower planning. These
              descriptions are primarily company or company-linked claims rather than independently audited technical
              results.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO009
              - CO012
      - number: '1.2'
        title: Leadership, financing, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The strongest current evidence concerns financing rather than governance. Two June 2026 reports state that
              the company completed three Series B financings within three months, raising more than RMB1 billion and
              reaching a valuation above RMB10 billion. The reported investors span state-linked funds, listed-company
              strategic investors, financial investors, and continuing shareholders. The same sources say proceeds are
              intended for model iteration, real-world data, and recruiting. No source in the assigned pool supplies a
              board roster, audited cap table, detailed governance structure, or a documented leadership bench beyond
              Lai Jie. Those omissions matter because the reported valuation is material while the available evidence
              does not establish revenue, margins, cash burn, or ownership concentration.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
              - CO008
              - CO016
      - number: '1.3'
        title: Commercial milestones and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              The reported milestone sequence moves from founding to productization, claimed thousand-unit delivery
              activity at the end of 2025, a T-series launch in May 2026, and the June 2026 financing. One report
              describes a thousand-unit industrial and commercial service order with Thundersoft and a proposed
              application innovation center with Jiangdu Economic Development Zone; these are useful commercialization
              signals but do not disclose recognized revenue, delivered units, customer names, renewal rates, or unit
              economics. External sector sources show that humanoid robotics is moving toward production scale while
              also warning about reliability, cost, dexterity, and hype. For Stardust specifically, the assigned pool
              does not provide independent confirmation of its delivery count, manufacturing yield, actuator
              reliability, revenue, or board and executive coverage. Those are material refresh gaps rather than
              assumptions to fill.
            claimRefs:
