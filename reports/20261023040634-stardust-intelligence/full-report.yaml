  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Separate shipment, production-growth, and company-price lenses show category expansion without implying a
      reconciled revenue TAM.
    data:
      nodes:
        - label: Global humanoid shipments estimate
          value: 18000
          unit: units, 2025 estimate
          detail: Merrill Lynch estimate reported by CNBC; Omdia estimate in the same source was 15000 units.
        - label: China humanoid output growth
          value: 94
          unit: percent, 2026 forecast
          detail: TrendForce forecast; output growth is not demand or revenue.
        - label: Unitree and AgiBot combined projected China share
          value: 80
          unit: percent, 2026 forecast
          detail: TrendForce projection; not Stardust share.
        - label: AgiBot reported production milestone
          value: 10000
          unit: units, March 2026
          detail: >-
            Company-reported milestone described by TechTimes; sustained commercial operation was not independently
            verified.
        - label: Stardust T1 reported starting price
          value: 89900
          unit: RMB, June 2026
          detail: Reported starting price; not realized average selling price or total cost of ownership.
        - label: Unitree reported humanoid shipments
          value: 5500
          unit: units, 2025
          detail: Prospectus figure reported by TechTimes; a competitor benchmark, not Stardust output.
