  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Cable-driven full-stack architecture may differentiate T1.", "The Baidu Baike entry describes a cable-driven transmission, Lumo model, Astribot OS, 23 degrees of freedom, and exchangeable compute/end-effectors.", "Independent technical validation, actuator MTBF, yield, and customer uptime."]
      - ["Industrial robotics demand can scale.", "IDTechEx identifies automotive and logistics as likely early scalable markets; TrendForce reports a projected 94% China output increase in 2026.", "Named customers, delivered units, paid deployments, and renewal rates."]
      - ["Sector financing can reset reference marks.", "Galbot's release states a funding round exceeding $300m and a $3bn valuation; CNBC reports private companies lead the space.", "A priced Stardust round with terms, lead investor, and preference schedule."]
      - ["Unit economics may work in structured tasks.", "IDTechEx models roughly six-month payback under high utilization and roughly 15 months under medium utilization.", "Stardust contribution margin, utilization, service burden, and payback by cohort."]
      - ["Valuation downside is material.", "Goldman Sachs makes the upper market case conditional on overcoming multiple hurdles; CNBC describes the current market as only $2bn-$3bn.", "Evidence of repeatable productive hours and a defensible recurring revenue layer."]
    notes: "Rows combine company-specific reported facts with sector-level scenarios; they are not a homogeneous comparable-company analysis."
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011, CV012]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Key trigger]
    rows:
      - ["Bull", "High utilization in structured workflows; reliable actuators; repeat purchases; financing terms are clean.", "RMB15bn could become supportable only if audited growth and margins justify a sector benchmark.", "Low-to-medium", "Independent customer references and cohort economics."]
      - ["Base", "Pilot-to-production conversion is selective; integration and service costs remain material; pricing falls.", "Track and wait for a price reset or verified operating metrics; no target return is supportable now.", "Medium", "Paid deployments with measured productive hours."]
      - ["Bear", "Demonstrations do not scale; utilization is low; warranty, safety, or dilution costs rise.", "Down-round or impaired mark risk; reported valuation is not a downside floor.", "Medium", "Failed pilots, low uptime, or adverse financing terms."]
      - ["Research-more gate", "Audited revenue, gross margin, cash burn, cap table, preferences, delivered units, and customer concentration become available.", "Rebuild a model using business-model-appropriate revenue or contribution metrics.", "Required before buy", "Primary-document diligence package."]
    notes: "These are qualitative probability signals, not probabilities; no precise valuation range is claimed because Stardust revenue, margin, and capitalization inputs are unavailable."
    claimRefs: [CV002, CV003, CV009, CV010, CV013, CV014, CV015]
