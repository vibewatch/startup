company:
  name: Stardust Intelligence
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a large and fast-growing humanoid-robot market, but it does not establish Stardust Intelligence's audited revenue, margins, delivered-unit economics, or a market-clearing price. The evidence therefore supports a research-more / track stance rather than a buy call at the reported RMB15 billion valuation.
sections:
  - id: investment-call
    title: Investment call and valuation discipline
    body: >-
      The investable thesis is that Stardust can convert a differentiated cable-driven
      actuator, a vertically integrated model/OS/body stack, and a timely product launch
      into valuable industrial automation. The anti-thesis is that market growth and peer
      financing marks do not prove Stardust's utilization, reliability, gross margin, or
      cash conversion. IDTechEx forecasts an approximately US$29.5bn market by 2036,
      while Robotics & Automation News, reporting IDTechEx analysis, says average selling
      prices could fall from approximately $114,700 in 2024 to around $37,000 by 2030
      and warns that deployment efficiency and task continuity determine realized
      economics. Goldman Sachs frames a much wider outcome, from at least US$6bn to as
      much as US$154bn by 2035E, explicitly conditional on overcoming design, use-case,
      technology, affordability, and acceptance hurdles. These are market scenarios,
      not Stardust forecasts. The reported RMB15bn mark should therefore be treated as
      an unverified financing reference, not intrinsic value. With no public audited
      revenue, margin, shipment, customer, cap-table, preference, or dilution schedule
      in this pool, the appropriate call is track/research-more; a buy recommendation
      would require false precision.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV012, CV015]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Thesis, anti-thesis, and price-sensitive proof
    body: >-
      The positive case has three evidence-backed legs. First, the market is moving
      toward structured industrial and logistics deployments, where clear task boundaries
      make ROI more testable. Second, peer production and financing activity indicate
      capital-market appetite: TrendForce reports that Unitree and AgiBot could account
      for nearly 80% of Chinese shipments in 2026, while Galbot's company-issued release
      states a $3 billion valuation after a funding round exceeding $300 million. Third,
      the Baidu Baike entry reports T1's 1.55-metre, 66-kilogram body, 23 degrees of
      freedom, a 5-kilogram single-arm payload, and a reported October financing mark of
      RMB15bn. The counterweight is material: those Stardust
      financing and product facts are not independently audited in the retained evidence,
      and the peer evidence is not a comparable valuation set. IDTechEx says favorable
      payback can be about six months only under high-utilization assumptions and about
      15 months under medium utilization; CNBC reports the current market is only $2bn to
      $3bn according to a Barclays researcher and describes commercialization as still
      developing. The price call changes only when Stardust supplies cohort-level
      utilization, realized ASP, service costs, warranty/repair rates, and financing
      terms.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV013]
    tableRefs: [TV002]
  - id: scenarios-and-exit
    title: Scenarios, comparables, and exit readiness
    body: >-
      A scenario framework is more defensible than a point valuation. The bull case
      assumes T1 achieves repeatable structured-workflow deployments, high utilization,
      falling unit cost, and enough reliability to support renewals; the base case assumes
      pilots and selected industrial tasks grow but economics remain customer- and
      integration-specific; the bear case assumes demonstrations do not translate into
      productive hours, hardware-price compression outpaces software or service capture,
      and new capital arrives at a lower mark. The retained comparable signals are
      directional only: Galbot's disclosed $3bn financing valuation, Unitree's reported
      approximately $6.2bn IPO target, and the market-scale forecasts from Goldman Sachs,
      CNBC, TrendForce, and IDTechEx measure different companies, stages, units, and
      denominators. They cannot be applied as a revenue multiple to Stardust. Exit
      readiness is consequently low-to-moderate: a future strategic or public-market
      exit would require audited financials, customer references, delivered rather than
      ordered units, repeatable gross margin, actuator MTBF, safety records, and a clean
      cap table showing liquidation preferences and dilution. Until then, track is
      preferable to underwriting a target return from an unsupported mark.
    claimRefs: [CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV003]
    figureRefs: [FV001]
