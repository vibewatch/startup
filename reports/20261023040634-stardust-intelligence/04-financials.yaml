    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Average selling price, null, low, "Determines hardware revenue per delivered unit", "Invoice-level ASP by SKU, geography, and customer"]
      - [Gross margin, null, low, "Separates scale from economically viable scale", "Audited gross margin bridge including warranty and service"]
      - [CAC and payback, null, low, "Tests whether deployments can scale without disproportionate sales spend", "Sales funnel, CAC by channel, cohort payback"]
      - [Utilization and contribution margin, null, low, "Links customer value to recurring economics", "Paid operating hours, uptime, labor savings, service cost"]
      - [Cash burn and runway, null, low, "Tests financing dependency and next-round risk", "Monthly cash bridge, committed capex, debt, runway"]
    notes: "Nulls mean no assigned public source disclosed a Stardust value; management diligence is required rather than a modeled zero."
    claimRefs: [CI009, CI010, CI012, CI014]

