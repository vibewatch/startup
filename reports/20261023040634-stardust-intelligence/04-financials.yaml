      - [hardware-revenue, recurring-service]
      - [integration-revenue, recurring-service]
      - [recurring-service, gross-profit]
    approximationNotes: "This is a mechanism map, not a quantified forecast; no Stardust revenue or margin values are disclosed in the assigned sources."
    claimRefs: [CI001, CI004, CI009]

callouts:
  - calloutType: risk
    title: Underwriting blocker
    body: Stardust's cash, burn, runway, revenue, margin, and unit economics remain undisclosed in the assigned evidence; valuation cannot be tested without a management financial package.
    claimRefs: [CI012, CI014]
  - calloutType: insight
    title: Scale is not profitability
    body: Competitor scale and pricing signals show a path to commercialization, while independent adverse commentary highlights reliability, cost, and demand-quality risks that can delay profitable deployment.
    claimRefs: [CI005, CI008, CI011]

