        - id: hardware-revenue
          label: "Hardware or lease revenue"
          detail: "Per-unit or contract amount; Stardust value unavailable"
        - id: integration-revenue
          label: "Integration and deployment services"
          detail: "Project revenue and implementation cost; unavailable"
        - id: recurring-service
          label: "Service, maintenance, or software"
          detail: "Recurring revenue and renewal; unavailable"
        - id: gross-profit
          label: "Contribution / gross profit"
          detail: "Depends on BOM, labor, warranty, utilization, and service cost"
