company:
  name: Stardust Intelligence
chapter:
  number: 4
  title: Financials
  summary: Public evidence supports a hardware-led humanoid robotics monetization path, but not Stardust Intelligence's revenue, margin, cash, or unit-economics profile. Sector comparables show that scale and pricing are advancing while reliability, demand quality, and financing assumptions remain material underwriting risks.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Stardust Intelligence's public materials in the assigned evidence pool do not disclose a price list, realized revenue, customer contracts, revenue mix, or accounting policy. The available evidence therefore supports a mechanism-level view rather than a company revenue estimate. Humanoid robotics monetization can begin with hardware sales or pilots, then expand through deployment services, software or model licensing, maintenance, and partnerships; however, the mix for Stardust Intelligence is an open question. Unitree is a useful market reference, not a proxy for Stardust: CNBC reported that Unitree had revenues exceeding 1 billion yuan and had been profitable since 2020, while also reporting a starting price of $5,900 for its R1 and a $16,000 starting price for its G1. Those are list or reported company figures from a different issuer, so they should not be converted into Stardust revenue or gross margin. The underwriting conclusion is that a credible revenue bridge requires delivered units, realized price, deployment revenue, repeat service revenue, and customer-level concentration.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-sales-efficiency
    title: Pricing, GTM, and sales efficiency
    body: >-
      Public sector evidence points to a transition from demonstrations toward structured industrial deployments, but it does not establish Stardust's sales cycle, CAC, payback, discounting, or channel economics. TrendForce reported that Chinese vendors were clarifying commercial use cases and that order-driven manufacturing and dedicated supply arrangements were supporting scale; its report also described Unitree's humanoid revenue as more than 51% of total revenue in 2025 and combined gross margin across its segments at 60%. The figures are sector and competitor evidence, not Stardust disclosures. CNBC's account of Unitree's low-price products suggests a possible hardware-led acquisition and data-collection strategy, while the Futurism analysis warns that reliability, inference, dexterity, and cost constrain early use cases to controlled factories and warehouses. For Stardust, this implies that sales efficiency should be measured by paid deployments that reach productive utilization, not by announcements, pilots, or headline orders.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002]
  - id: cost structure and unit economics
    title: Cost structure and unit economics
    body: >-
      No assigned source provides Stardust's bill of materials, labor content, warranty reserve, gross margin, installation cost, service burden, working capital, capex, or manufacturing yield. These omissions are material because a cable-driven humanoid can have a different actuator, maintenance, and reliability cost curve from a conventional design, yet the available sources do not quantify Stardust's economics. TrendForce reported that component localization and mass-production scale were improving the sector's cost base, while its discussion of capacity expansion and upstream components illustrates the capital commitment required for volume. The Futurism source provides adverse sector context: experts warned that startups remained a long way from generating profits and should pursue early revenue streams with a clear monetization model. Unit-economics underwriting should therefore keep all Stardust values null until source-backed disclosures exist and should request contribution margin by product, deployment labor, spares, warranty claims, utilization, and cash conversion.
    claimRefs: [CI009, CI010, CI011]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and financial verdict
    body: >-
      The assigned pool does not disclose Stardust's cash balance, burn rate, runway, debt, project-finance obligations, financing covenants, or planned use of funds. The prior report context identifies a valuation above RMB10 billion and three Series B rounds, but those facts are not current chapter evidence and are not sufficient to infer cash available or runway. Comparable financing activity demonstrates both access to capital and valuation risk: PR Newswire reported that Galbot completed a funding round exceeding $300 million and reached a $3 billion valuation, while CNBC reported Unitree's proposed valuation could reach $7 billion and that it was unclear how much the IPO would raise. Futurism's adverse evidence cautions that investment enthusiasm may outpace profitability. Stardust should be treated as financing-dependent until management supplies a cash bridge, monthly burn, committed orders, capex schedule, debt terms, and a next-round trigger. The financial verdict is research-more: commercial scale may be plausible, but revenue quality, margin path, and liquidity cannot yet support valuation underwriting.
    claimRefs: [CI012, CI013, CI014]

