companyProfile:
  summary: >-
    Stardust Intelligence, also known through its Astribot brand, is a Shenzhen-based humanoid robotics company founded
    in 2022. Its reported strategy integrates proprietary AI models, the Embodied OS, and a rope-driven humanoid body,
    with public evidence pointing to product launches, strategic partnerships, and rapid financing. The retained
    evidence does not independently verify revenue, margins, delivered units, reliability, or governance depth.
