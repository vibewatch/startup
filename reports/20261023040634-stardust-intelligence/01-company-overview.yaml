company:
  name: Stardust Intelligence
chapter:
  number: 1
  title: Company Overview
  summary: Stardust Intelligence (Astribot) is a Shenzhen-founded humanoid-robotics company built around a rope-driven body, an embodied operating system, and proprietary AI models. Current reporting supports a 2026 financing and valuation milestone, but audited operating metrics, leadership depth, and independent delivery evidence remain limited.
sections:
  - id: identity-and-product
    title: Identity, product, and operating model
    body: >-
      Available reporting identifies Stardust Intelligence as Astribot, a Shenzhen-based company founded in 2022. Its founder and CEO, Lai Jie, is described as having more than 17 years of AI and robotics research and design experience, including work at Tencent's Robotics Laboratory and Baidu's Xiaodu Robot team. The reported product strategy is vertically integrated: a base model, the Embodied OS, and a rope-driven body are developed as one stack. The rope-driven design places motors away from joints and uses tendon-like cables, while the DuoCore framework separates fast real-time response from slower planning. These descriptions are primarily company or company-linked claims rather than independently audited technical results.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-capital
    title: Leadership, financing, and governance visibility
    body: >-
      The strongest current evidence concerns financing rather than governance. Two June 2026 reports state that the company completed three Series B financings within three months, raising more than RMB1 billion and reaching a valuation above RMB10 billion. The reported investors span state-linked funds, listed-company strategic investors, financial investors, and continuing shareholders. The same sources say proceeds are intended for model iteration, real-world data, and recruiting. No source in the assigned pool supplies a board roster, audited cap table, detailed governance structure, or a documented leadership bench beyond Lai Jie. Those omissions matter because the reported valuation is material while the available evidence does not establish revenue, margins, cash burn, or ownership concentration.
    claimRefs: [CO005, CO006, CO007, CO012]
    tableRefs: [TO002, TO003]
  - id: milestones-and-diligence-gaps
    title: Commercial milestones and unresolved diligence
    body: >-
      The reported milestone sequence moves from founding to productization, claimed thousand-unit delivery activity at the end of 2025, a T-series launch in May 2026, and the June 2026 financing. One report describes a thousand-unit industrial and commercial service order with Thundersoft and a proposed application innovation center with Jiangdu Economic Development Zone; these are useful commercialization signals but do not disclose recognized revenue, delivered units, customer names, renewal rates, or unit economics. External sector sources show that humanoid robotics is moving toward production scale while also warning about reliability, cost, dexterity, and hype. For Stardust specifically, the assigned pool does not provide independent confirmation of its delivery count, manufacturing yield, actuator reliability, revenue, or board and executive coverage. Those are material refresh gaps rather than assumptions to fill.
    claimRefs: [CO004, CO008, CO009, CO010, CO011, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Integrated product thesis
    body: The reported model–Embodied OS–rope-driven-body stack gives Stardust a coherent product architecture and a differentiated actuator approach, although performance and reliability remain company-claimed.
    claimRefs: [CO003, CO011]
  - calloutType: risk
    title: Valuation evidence outruns operating disclosure
    body: The reported valuation above RMB10 billion and financing above RMB1 billion are not accompanied in the assigned evidence by audited revenue, margins, cash burn, delivery reconciliation, or independently verified customer traction.
    claimRefs: [CO006, CO012, CO016]
  - calloutType: recommendation
    title: Verify scale before relying on headline milestones
    body: Diligence should reconcile signed orders, delivered and accepted units, recognized revenue, production yield, actuator failure rates, and the current board and executive roster.
    claimRefs: [CO004, CO008, CO012, CO016]
