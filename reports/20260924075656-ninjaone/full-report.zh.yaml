      - number: '1.3'
        title: 融资历史、估值与资本结构
        blocks:
          - type: paragraph
            body: >
              NinjaOne 已完成两轮得到确认的外部股权融资。2020 年 3 月，Summit Partners 领投公司（当时名为 NinjaRMM）的风投轮次。2024 年 11 月，ICONIQ Growth
              领投了 $500M 的 C 轮融资，投后估值达 $5 billion，Snowflake 与 ServiceNow 前 CEO Frank Slootman 作为个人投资者参投。CBInsights
              记录的公开融资总额约为 $761.5M，但除这两笔已证实的注资外，早期轮次的具体构成在公开数据库中未获完整收录。


              $5 billion 估值相当于后期高增长 SaaS 平台常见的一次大幅跃升。在 SEC EDGAR 系统中未检索到 NinjaOne, LLC 或 NinjaRMM 的 Form D
              披露，这可能反映其面向境外投资者的离岸架构、仅作州级申报或公开记录不全——此为悬而未决的尽调缺口。公司未公开披露收入、EBITDA 及毛利率；截至 2026 年 5 月，亦未释放任何明确的 IPO 时间表。


              C 轮资金主要用于产品创新（包括收购 Dropsuite 备份业务）、国际扩张和渠道合作伙伴计划。截至 2026
              年，公开信息显示资本结构似乎只有股权融资，未披露信贷额度或债务工具；但没有查阅公司账目，仍无法确认。
            claimRefs:
              - CO001
              - CO002
