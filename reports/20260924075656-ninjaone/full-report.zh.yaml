      - number: '5.2'
        title: 技术架构与基础设施
        blocks:
          - type: paragraph
            body: >
              NinjaOne 平台采用云原生、多租户 SaaS 架构，完全通过公网交付，不提供本地私有化部署选项。端点 Agent 为轻量级软件进程，支持 Windows（7+）、macOS（10.13+）及主流 Linux
              发行版。Agent 仅通过 443 端口发起单向出站 HTTPS 通信，无需配置入站防火墙规则——这一架构决策极大简化了严苛网络环境下的部署流程，也被客户频频赞誉为兑现“30 天内极速上线”承诺的关键支撑。

              平台坚持 API 优先架构：所有控制台功能均通过文档完备的 REST API 对外开放，便于 MSP 将 NinjaOne 能力嵌入自定义门户、NOC 监控大屏与自动化流水线。官方集成市场提供逾 100
              款开箱即用连接器，覆盖 PSA、安全、计费、身份管理及可观测性等主流类别。其中与 ConnectWise Manage 的集成经双向官方认证并配有完备文档，支持工单与计费数据的双向同步。

              底层基础设施仍有多项关键信息未明：NinjaOne 尚未确认主要云厂商（AWS、Azure 或 GCP）、除欧盟 GDPR
              合规区域外的数据中心分布，以及多租户隔离架构细节。没有本地部署选项，也就难以进入物理隔离网络、强监管金融机构和政府机构。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE002
