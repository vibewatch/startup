chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >
              NinjaOne, LLC 是一家在德克萨斯州注册、总部位于奥斯汀的非上市 IT 管理软件公司。公司 2013 年以 NinjaRMM 之名创立，约在 2022 年更名为
              NinjaOne，借此表明业务已从远程监控与管理（RMM）扩展到更广的平台。产品涵盖 RMM、终端管理、补丁管理、移动设备管理（MDM）、云端与本地备份、远程访问工具及集成式 IT 工单系统，均以云原生 SaaS
              交付，不要求客户部署本地基础设施。


              公司按设备或终端数量收取订阅费，不强制多年合同，也不要求客户采购专业服务。客户既包括为中小企业外包 IT 的托管服务提供商（MSP），也包括自主管理设备群的企业 IT
              部门。平台的主要卖点是整合工具：NinjaOne 称，71% 的客户采用平台时会替换 4 款以上的独立工具。客户通常不到 30 天即可完成部署，操作人员不到 10 天便能熟练使用。


              平台已接入 200+ 款第三方工具，包括安全厂商、PSA 平台和身份提供商，因而可充当中央管理枢纽。内置工单模块让许多小型 MSP 无须另购独立 PSA。截至 2026 年，NinjaOne 支持
              Windows、macOS、Linux、iOS 和 Android 终端。
            claimRefs:
