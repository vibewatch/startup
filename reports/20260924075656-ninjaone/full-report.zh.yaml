      - number: '2.3'
        title: 买方、用户与付费方画像细分
        blocks:
          - type: paragraph
            body: >
              NinjaOne 的买方分为两大主力：托管服务商（MSP）和企业内部 IT 部门。第三类新兴客户是过去依赖零散单点工具的中小企业（SMB）自管 IT 团队。


              MSP 是 NinjaOne 的起步市场，也是现有客户的主体。MSP 既采购也使用 RMM / 终端管理软件；终端客户通过托管服务合同承担最终费用，但技术采购由 MSP 自主决定。RMM 工具从 MSP
              的运营或工具预算中列支：小型 MSP 通常由老板、COO 或首席技术人员拍板，大型 MSP 则交由供应商管理或采购团队负责。MSP 的采购触发点几乎全部来自成本整合（替代 3–5 款分散单点工具）或既有 RMM
              供应商（如 Kaseya 或 ConnectWise）的续约节点。


              企业内部 IT 部门是 NinjaOne 的增量市场。此类客户由 IT 总监或副总裁采购，IT 运维团队使用，CFO 或 CIO 掌握预算。支出通常列入“IT
              运营”或“终端管理”的资本性支出/运营支出科目，往往作为更宏大的终端安全与运维规划的一部分。该客群的采购触发点多为外部合规硬性指标（如 SOC 2、CMMC
              认证、网络安全保单核保问卷）、设备资产管理的痛点爆发，或是对老旧笨重系统的替换。NinjaOne 在此面临的最强企业级对手是捆绑于 M365 套件的 Microsoft
              Intune——后者在以微软为主流的办公环境中近乎“免审默认”的 UEM 工具，迫使 NinjaOne 必须拿出极具说服力的替换理由。


              SMB 自主管理 IT 市场规模较小，但正在增长。随着监管和供应商审计要求下沉，拥有兼职 IT 通才的 10–100 人小企业也越来越需要设备管理工具。NinjaOne
              的定价方式与极速部署优势在此类群体中反响强烈，但相较于偏低的合同客单价，该长尾客群的获客成本往往居高不下。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
