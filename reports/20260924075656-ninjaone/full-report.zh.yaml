      - number: '6.2'
        title: 客户拓展轨迹与业务规模
        blocks:
          - type: paragraph
            body: >
              NinjaOne 客户数从 2020 年 Summit Partners 领投风投轮次时的约 5,000 家，增至 2026 年 4 月的 35,000–40,000 家，六年间扩大约 7 倍，反映 MSP
              市场需求旺盛。公司称 FY2025 营收同比增长约 70%，与客户数快速增长相符。2026 年 4 月，公司宣布与 GTS（Global Technology Solutions）建立渠道合作，预计可在新市场增加
              MSP 合作伙伴。

              NinjaOne Backup 的交叉销售进展突出：截至 2026 年 4 月，Dropsuite 更名后约 10 个月内，已有 15,000+ 家客户采用备份产品，占客户总数约
              37–43%。这一进展显示单一控制台交叉销售有效。若备份渗透率继续升至 60–70%，无需新增获客即可显著提高单客收入。

              受管设备数也是衡量客户使用深度的指标。MSP 客户自身业务扩大后，纳管设备通常也会增加；即使不拓展新客，按设备计费仍可带动 ARR 增长。目前 NinjaOne 尚未公开披露其受管设备总数。
