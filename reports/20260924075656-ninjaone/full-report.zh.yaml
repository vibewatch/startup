      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              NinjaOne 于 2013 年由 Sal Sferlazza、Christopher Matarese 与 Eric Herrera 共同创立。截至 2026 年，Sal Sferlazza
              担任首席执行官（CEO），也是公司新闻稿和渠道合作伙伴公告中的主要发言人。创始团队熟悉 MSP 工具和终端管理，推动公司采用产品驱动增长（PLG），并在竞争激烈的 RMM 市场站稳脚跟。


              CEO 之下的高管团队包括产品管理高级副总裁 Matt Hastings，负责平台路线图和 Dropsuite 备份业务整合；以及全球渠道销售副总裁 Joe Lohmeier，负责 MSP
              与渠道合作伙伴生态。公司未公开 CFO 人选或董事会构成，这与非上市公司的信息披露状况相符。


              公开渠道中未发现 2025 或 2026 年有核心高管离职的记录，但证据范围仅限于行业媒体和渠道合作伙伴公告。作为非上市公司，其董事会治理信息并未公开。对外发声过度集中于 Sferlazza
              一人，构成了关键人依赖风险，在任何交易流程中都需要重点尽调。
            claimRefs:
              - CO001
              - CO002
