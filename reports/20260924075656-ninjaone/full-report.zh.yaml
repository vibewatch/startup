        - SourceForge 评论；可靠性投诉持续存在
        - P2
      - - Dropsuite 整合后的数据丢失
        - 低
        - 高
        - 15K+ 备份客户的数据已在新基础设施上
        - P2
      - - SOC 2 审计失败 / 证书失效
        - 低
        - 高
        - 无公开 SOC 2 报告；公司称符合 SOC 2
        - P2
      - - Android MDM 覆盖缺口
        - 高
        - 中
        - 已确认 Android 管理能力有限
        - P3
  - id: TR003
    title: 合作伙伴 / 依赖风险清单
    type: enumeration
    sectionRef: partner-dependency-risk
    notes: 依赖风险等级按合作关系恶化或终止可能带来的收入影响估算。
    enumerationScope:
      coverage: partial
      basis: >-
        Major technology and channel partner dependencies identified from public integration documentation and press
        releases
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
    columns:
      - 依赖项
      - 类型
      - 集中度
      - 可替代性
      - 风险等级
    rows:
      - - AWS（云基础设施）
        - 基础设施
        - 高 – 主云平台
        - 高 – 多云迁移可行但成本高
        - 中
      - - ConnectWise PSA（集成合作伙伴）
        - 集成
        - 高 – 最大的 MSP PSA
        - 中 – Autotask、HaloPSA 可替代
        - 中
      - - Microsoft（竞争性依赖）
        - 竞争
        - 严重 – Intune 侵蚀
        - 低 – Microsoft 分销能力无法替代
        - 高
      - - GTS 渠道合作
        - 渠道
        - 未知 – 条款未披露
        - 中 – 还有其他渠道选项
        - 中
      - - Autotask / Datto PSA
        - 集成
        - 中
        - 中 – NinjaOne 已集成多个 PSA
        - 低
      - - SentinelOne / 端点安全集成
        - 集成
        - 低
        - 高 – 可选安全厂商很多
        - 低
      - - Dropsuite 旧基础设施
        - 收购
        - 中 – 15K 备份客户
        - 低 – 必须完成迁移
        - 中
  - id: TV001
    title: 建议摘要表
    type: data
    sectionRef: investment-thesis
    notes: 本建议依据截至 2026 年 5 月的分析；所有财务预测均为公开信息推算。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
    columns:
      - 维度
      - 评估
      - 信心
      - 尽调状态
    rows:
      - - 总体建议
        - 有条件看好
        - 中
        - 待审核财务数据和 SOC 2 审阅
      - - 市场机会
        - 规模大且仍在增长（2027 年 TAM 约 $45B）
        - 高
        - 已验证 – 多个市场规模来源
      - - 产品市场匹配
        - 强 – G2 4.7/5，4,295 条评论，98% 满意度
        - 高
        - 已验证 – G2 为独立来源
      - - 客户增长
        - ~35,000+ 客户，收入 YoY ~70%（FY2025）
        - 中
        - 收入未经审计；客户数来自新闻稿
      - - NRR / 留存质量
        - NRR 估计 110–125%；未确认
        - 低
        - 阻断项 – 投资前必须验证
      - - 安全风险
        - RMM 供应链攻击是结构性尾部风险
        - 高
        - 阻断项 – 需要 SOC 2 审计
      - - 入场估值
        - $5B / 未来 ARR 约 10–14x
        - 中
        - 有支撑，但估值已计入持续高增长
      - - 乐观情景回报（3–5 年）
        - 以 $5B 入场，回报 2.5–4.3x
        - 低
        - 需要 ARR CAGR 40%+ 和高溢价 IPO 倍数
      - - 悲观情景风险
        - 若发生泄露或增长崩塌，以 $5B 入场回报低于 1x
        - 中
        - 尾部风险，不是基准情景
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    type: enumeration
    sectionRef: investment-thesis
    notes: 投资逻辑与反向逻辑按研究团队对概率和影响的评估加权。
    enumerationScope:
      coverage: exhaustive
      basis: All material positive and negative investment factors identified across the full 8-chapter analysis
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
    columns:
      - 投资逻辑支柱
      - 强度
      - 反向逻辑顾虑
      - 严重程度
    rows:
      - - MSP 市场结构性顺风（2027 年约 $45B）
        - 强
        - MSP 市场可能逐步向少数玩家集中
        - 中
      - - '品类领导地位：G2 7 个类别 #1'
        - 强
        - G2 刷榜 / 评论操纵风险（概率低）
        - 低
      - - 按设备计费模型自然推高 NRR
        - 强
        - NRR 未验证；若无扩张，可能只有 100–105%
        - 高
      - - FY2025 收入增长 70%（未经审计）
        - 强
        - 未经审计；收入确认做法未知
        - 高
      - - 10 个月内备份附加率约 40%
        - 强
        - 备份是商品化品类；差异化可能消退
        - 中
      - - PSA 集成锁定效应和脚本库护城河
        - 中
        - ConnectWise 可能出于竞争削弱集成 API
        - 中
      - - $5B 估值意味着 10–14x ARR（可辩护）
        - 中
        - $5B 估值给增长放缓留下的安全边际很小
        - 高
      - - 未确认发生入侵（对比 Kaseya 先例）
        - 中
        - RMM 供应链攻击风险是结构性问题，尚未解决
        - 严重
      - - ICONIQ Growth / Summit Partners 利益一致
        - 中
        - 投资人退出压力可能迫使 IPO 时点提前
        - 中
      - - Dropsuite 收购：备份规模化
        - 中
        - 集成风险；备份数据责任已成为实质风险
        - 中
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    type: data
    sectionRef: scenarios
    notes: 所有财务预测均为基于公开数据的估计；NinjaOne 未公开披露 ARR 或前瞻指引。概率权重为分析师的定性判断。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
    columns:
      - 情景
      - 概率
      - FY2027 ARR
      - 退出倍数（EV/ARR）
      - 退出估值
      - 相对 $5B 回报
      - 关键假设
    rows:
      - - 乐观
        - 35%
        - $900M–$1.2B
        - 14–18x
        - $12.6B–$21.6B
        - 2.5–4.3x（25–40% IRR）
        - ARR 增长维持 50–70%；无入侵；取得 FedRAMP
      - - 基准
        - 45%
        - $700M–$800M
        - 10–13x
        - $7.0B–$10.4B
        - 1.4–2.1x（8–16% IRR）
        - ARR 增长 30–40%；安全记录干净；NRR >110%
      - - 悲观
        - 20%
        - $500M–$600M
        - 6–8x
        - $3.0B–$4.8B
        - <1x（资本损失）
        - 增长 <25%；发生入侵事件或被 Microsoft Intune 替代
      - - 加权 EV（混合）
        - 100%
        - ~$750M
        - ~11x
        - ~$8.25B
        - 混合情景回报约 1.65x
        - 三种情景按概率加权
