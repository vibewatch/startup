      - number: '7.3'
        title: 运营稳定性与技术风险
        blocks:
          - type: paragraph
            body: >
              NinjaOne 的云基础设施依托 AWS 等大型云厂商。若 AWS 某一区域宕机（如 2021 年 12 月和 2023 年 9 月发生的故障），该区域客户将无法下发 RMM
              指令、发起远程连接和执行备份任务。NinjaOne
              维护着公开的系统运行状态页（status.ninjaone.com），记录历史可用性；社区论坛讨论显示历史上偶有服务中断被用户提及，但公司并未公开承诺具体的服务级别协议（SLA）赔付标准。

              据 SourceForge 用户反馈，远程访问模块平均每个活跃会话日出现约 1 次异常掉线，反映出核心产品层存在肉眼可见的质量短板。由于远程运维对于 MSP
              开展技术支持（特别是夜间与非工作时间响应）至关重要，这一稳定性缺陷可能侵蚀客户续约率，并在与 Splashtop、TeamViewer 及操作系统内置工具的竞争中处于下风。

              完成对 Dropsuite 的收购（交易金额 $252M；整合于 2025 年 6 月前后基本完成）带来了技术债务清理、冗余工程团队整合以及客户平滑迁移等系列挑战。更名为 NinjaOne Backup
              后，统一平台瞬间承接了 15,000+ 家新增客户，对备份底层架构的运维能力提出了严峻考验。在此背景下，一旦发生备份数据损坏丢失或恢复耗时失控等严重事故，公司将面临极其沉重的客户索赔与商业信誉损失。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR003
