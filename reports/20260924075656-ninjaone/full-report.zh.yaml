  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >
              NinjaOne 的目标市场涉及三个相互重叠、但预算边界不同的类别：(1) 远程监控与管理（RMM）工具，主要供托管服务商（MSP）和 IT 部门监控设备、远程接入并自动修复问题；(2)
              统一终端管理（UEM），这一面向企业的品类将移动设备管理（MDM）、PC 生命周期管理与应用分发整合在统一平台中；(3) 云 SaaS 备份，系通过收购 Dropsuite 切入的赛道（涵盖 Microsoft
              365、Google Workspace 及工作站/NAS 备份）。各门类的买方画像、定价机制与竞争格局均截然不同。


              RMM 市场以 MSP 采购为主：MSP 按固定费用或按设备月付，购买软件来监控和管理终端客户的设备。ServiceNow、Freshservice 等 IT 服务管理（ITSM）平台不在此列——它们负责企业级
              IT 工单流程编排，却不提供 RMM 监控层。终端检测与响应（EDR）和终端保护平台（EPP）虽有功能重叠，也因使用独立的网络安全预算而排除在外。


              UEM 是面向企业的 RMM 对应品类，服务于需要管理 Windows、macOS、iOS、Android 等异构设备群的内部 IT 团队。Microsoft Intune 随 Microsoft 365
              E3/E5 捆绑，在企业市场占据主导。VMware Workspace ONE、Jamf（专注 macOS / iOS）和 Ivanti（原 MobileIron）是主要的付费替代品。NinjaOne 争夺中端
              UEM 客户：他们希望部署比企业套件更简单、价格更低，同时又比轻量 RMM 工具功能更全。云 SaaS 备份（Dropsuite / NinjaOne SaaS
              Backup）则是独立采购，通常由备份管理员或合规官发起，并使用单独预算。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
