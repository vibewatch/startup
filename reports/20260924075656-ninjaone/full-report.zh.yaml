              - CO003
          - type: callout
            title: 收购 Dropsuite 将 TAM 延伸至云备份领域
            body: >
              2025 年 6 月以 $270M 完成对 Dropsuite 的收购，使 NinjaOne 的业务边界跨越终端管理，切入以 Microsoft 365 和 Google Workspace 为主的云 SaaS
              备份赛道，增添了具备强劲独立扩张势头（截至 2026 年 4 月已达 15,000+ 家客户）的经常性收入来源。这是 NinjaOne 的首笔并购，对其规模化整合及变现被购产品的能力是一场关键检验。
            calloutType: insight
            claimRefs:
