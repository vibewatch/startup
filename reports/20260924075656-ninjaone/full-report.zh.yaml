  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品矩阵与模块架构
        blocks:
          - type: paragraph
            body: >
              NinjaOne 是统一 IT 管理平台，覆盖八大核心模块：RMM、补丁管理、远程访问（NinjaRemote）、移动设备管理（MDM）、端点与 SaaS 备份、IT 文档管理和工单系统。所有模块都在同一个
              Web 控制台内使用，公司坚持“统一管理看板”（single-pane-of-glass）理念，无须跨平台登录或切换产品门户。相比单点工具和功能同样广、但操作繁琐的 Kaseya
              等传统捆绑平台，这种整合是重要差异化优势。

              自创立（曾用名 NinjaRMM）以来，公司产品线已大幅拓展。2025 年以 $270M 收购 Dropsuite，补齐了覆盖 Microsoft 365、Google Workspace 及
              Salesforce 的专有云对云备份核心技术。截至 2026 年 4 月，NinjaOne Backup 声称已服务 15,000+ 家客户，表明其向现有约 35,000–40,000
              家客户大盘的交叉销售势头强劲。文档与工单模块于 2022–2024 年陆续推出，并打包内置于相应级别的 RMM 订阅方案中，既拉高了单设备创收价值，也加固了客户切换壁垒。

              核心功能缺口方面：官方承认其 Android MDM 能力弱于 Microsoft Intune，削弱了 NinjaOne 在 Android 设备密集型企业环境中的竞争力。面向网络设备的 SNMP
              进阶网络监控功能，截至 2026 年第二季度仍处于路线图或公测阶段。工单模块仅相当于轻量级 PSA（PSA-lite），无法替代 ConnectWise Manage 或 Autotask。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
