  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              NinjaOne 所处的竞争格局由三类界限鲜明的对手组成。第一类也是最具对抗性的是传统 MSP RMM 巨头：Kaseya（位于德州奥斯汀，非上市公司）、ConnectWise（位于佛罗里达州坦帕，Thoma
              Bravo 旗下）、N-able（位于德州休斯顿，纽交所代码：NABL）以及 Datto RMM（已被 Kaseya 收购）。这些平台与 NinjaOne 争夺同一核心 MSP
              客群；行业媒体与社区反馈的成败单数据显示，它们也是 NinjaOne 最主要的存量客户替换来源。Kaseya 与 ConnectWise
              凭借二十余年积累拥有庞大的装机基础，并通过脚本库、自动化工作流以及与专业服务自动化（PSA）/财务软件的深度绑定，构筑了高昂的迁移壁垒。


              第二类是企业级 UEM 阵营，由 Microsoft Intune（微软）、VMware Workspace ONE（博通旗下）和 Jamf（JAMF Pro，苹果生态专家）主导。其中，微软在 M365
              E3/E5 中向企业客户免加价捆绑 Intune，是制约 NinjaOne 向上突破企业级市场的最大结构性阻力。而 Jamf 则在苹果设备为主的工作环境中把守着防御森严的细分利基，在此场景下 NinjaOne
              的竞争力相对有限。


              第三类是正打破细分市场规则的新兴挑战者：Atera（位于特拉维夫，AI 原生 RMM+PSA，采用按运维工程师计费模式）、Syncro（面向小型 MSP 的集成式 RMM+PSA，已被 Kaseya 收购）以及
              ManageEngine（Zoho 旗下，拥有覆盖全面的 IT 管理套件且在亚洲市场极具价格优势）。这类挑战者主要在小型 MSP 和价格敏感的中小企业层级展开厮杀，尚未直接威胁到 NinjaOne
              盘踞的腰部核心阵地。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
