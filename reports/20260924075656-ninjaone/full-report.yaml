      - number: '6.2'
        title: Adoption Trajectory and Scale
        blocks:
          - type: paragraph
            body: >
              NinjaOne has grown its customer base from approximately 5,000 customers at the time of the 2020 Summit
              Partners venture round to 35,000–40,000 by April 2026 — a roughly 7x increase over six years reflecting
              strong organic demand in the MSP market. The company reported approximately 70% year-over-year revenue
              growth for FY2025, consistent with significant customer count expansion. The channel partnership with GTS
              (Global Technology Solutions) announced April 2026 is expected to add incremental MSP partners in new
              markets.

              The NinjaOne Backup cross-sell trajectory is notable: 15,000+ customers adopted the backup product within
              approximately 10 months of the Dropsuite rebrand (April 2026), representing an attach rate of
              approximately 37–43% of the total customer base. This trajectory demonstrates the effectiveness of the
              single-console cross-sell motion. If the backup attach rate continues growing to 60–70%, it would
              materially expand revenue per customer without requiring new customer acquisition.

              Device count growth is a parallel indicator of adoption depth: each MSP customer adds devices over time as
              their own client base grows, creating device-count ARR expansion without new customer acquisition.
              NinjaOne has not disclosed managed device count publicly.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.3'
        title: Named Customer Proof and Reference Availability
        blocks:
          - type: paragraph
            body: >
              NinjaOne's public customer proof is predominantly aggregate and review-based rather than named enterprise
              references. G2 provides 4,295 user reviews at 4.7/5 with NinjaOne ranked #1 in seven G2 categories
              including RMM, Endpoint Management, and Remote Monitoring and Management. TrustRadius, Capterra, and
              SourceForge provide additional corroborating review coverage. This represents the densest publicly
              available proof of customer satisfaction in the MSP RMM market.

              Named enterprise customer case studies are not prominently published by NinjaOne. This is not unusual for
              a platform sold primarily through the MSP channel, where the MSP relationship is the primary customer and
              MSPs' own clients are rarely named. The absence of published Fortune 500 or large enterprise references
              does create a gap for investors seeking proof of enterprise-grade deployments at scale.

              The GTS partnership (April 2026) and the Dropsuite backup adoption trajectory provide indirect proof of
              adoption scale. Reddit r/msp community threads frequently cite NinjaOne as the platform MSPs are migrating
              to from Kaseya VSA after Kaseya's 2021 ransomware incident and subsequent pricing controversies — this
              community migration signal is a credible organic adoption indicator.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.4'
        title: Retention, Satisfaction, and Net Revenue Retention
        blocks:
          - type: paragraph
            body: >
              NinjaOne claims 98% customer satisfaction for more than five consecutive years. This company-stated metric
              is consistent with G2's 4.7/5 aggregate rating from 4,295 reviewers and high Capterra and TrustRadius
              ratings. The 98% satisfaction claim implies a very low dissatisfaction rate, but the specific methodology
              (survey format, respondent population, and what "satisfaction" measures) has not been disclosed.

              Net revenue retention (NRR) and gross revenue retention (GRR) have not been publicly disclosed. Inferring
              from the per-device subscription model: device count growth within existing MSP customers creates natural
              NRR expansion above 100% even without explicit product upsells. The backup cross-sell at ~40% attach rate
              represents a discrete expansion mechanism. Industry benchmarks for high-quality vertical SaaS in this
              segment typically show NRR of 110–125%, but NinjaOne-specific data is unavailable.

              Remote access reliability issues (cited ~1 disconnect/day by SourceForge) are the primary product-driven
              churn risk. However, the platform stickiness created by the script library, documentation integration, and
              deep PSA connections makes switching costly even for dissatisfied users. No confirmed large-scale customer
              defection events have been publicly reported.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.5'
        title: Expansion and Concentration Risk
        blocks:
          - type: paragraph
            body: >
              NinjaOne's land-and-expand economics are structurally favorable: the per-device subscription model grows
              revenue automatically as MSP clients add devices. The product expansion from RMM to backup, documentation,
              and ticketing provides additional upsell vectors within the same console. The backup attach rate of ~40%
              demonstrates that cross-sell is already working at scale.

              Customer concentration risk is unknown. NinjaOne has not disclosed what percentage of ARR comes from the
              top 10 or top 25 customers. The presence of 35,000+ customers across 140+ countries suggests a granular
              customer base that would limit single-customer concentration, but the distribution between small MSPs
              (50–200 devices) and large MSPs (10,000+ devices) is unknown and large MSPs could represent a
              disproportionate revenue share.

              The GTS channel partnership announced in April 2026 may represent a meaningful channel concentration
              exposure: if GTS becomes a large reseller or customer of NinjaOne, any deterioration in the GTS
              relationship could affect NinjaOne's revenue. Terms of the partnership (exclusivity, revenue commitment,
              duration) have not been disclosed.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Cybersecurity and Platform Security Risk
        blocks:
          - type: paragraph
            body: >
              NinjaOne operates critical infrastructure for 35,000+ organizations: a successful compromise of its
              platform would allow attackers to simultaneously deploy malware, exfiltrate data, or destroy backups
              across all managed endpoints of all customers. The Kaseya VSA ransomware attack (July 2021) demonstrated
              this exact threat vector, delivering REvil ransomware to 1,500+ organizations simultaneously through a
              single RMM vendor vulnerability. CISA has issued multiple advisories (2023, 2024) warning that RMM tools
              are actively exploited by nation-state and criminal threat actors specifically because of their privileged
              endpoint access.

              NinjaOne claims SOC 2 Type II compliance, end-to-end encryption, multi-factor authentication enforcement,
              and role-based access control. However, NinjaOne has not published its SOC 2 audit report or attestation
              letter publicly. Third-party security audit results and penetration test disclosures are not available for
              external review. Given that the platform handles credentials, remote access sessions, and backup data for
              35,000+ customers in 140+ countries, the absence of public security audit disclosure is a material
              diligence gap.

              The 2024 ConnectWise Automate vulnerability (CVE-2024-1709, CVSS 10.0) and 2024 AnyDesk credential theft
              incident illustrate that even well-capitalized RMM and remote access vendors face active exploitation.
              NinjaOne's remote access module, cloud agent infrastructure, and backup data stores represent the three
              highest-value attack targets.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >
              NinjaOne has not achieved FedRAMP authorization, which excludes it from U.S. federal government IT
              procurement and limits state/local government deployment. As government agencies increasingly mandate
              FedRAMP-authorized tools for IT management, NinjaOne's government market opportunity remains effectively
              blocked. FedRAMP authorization typically requires 12–24 months and $2–5M in compliance investment; the
              Dropsuite backup module adds additional scope.

              GDPR compliance for EU-based customer data processing is an ongoing requirement. NinjaOne publishes a GDPR
              data processing addendum but has not disclosed data center locations used for EU data residency. The EU
              Data Act (effective September 2025) and NIS2 Directive (effective October 2024) expand compliance
              obligations for cloud software providers managing critical IT infrastructure in the EU. NinjaOne's EU
              customer base is meaningful given its 140+ country reach; any compliance failure could trigger GDPR fines
              of up to 4% of global annual revenue.

              No material litigation has been publicly reported against NinjaOne. The company is organized as NinjaOne,
              LLC (Austin, TX); no SEC Form D filings were found in the EDGAR database, consistent with a private
              company not seeking SEC exemption under Regulation D. Legal risks include customer indemnification claims
              arising from a platform-mediated breach, IP infringement claims from RMM/backup technology incumbents, and
              employment claims as the company scales from ~1,000 to 3,000+ employees.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.3'
        title: Operational and Technical Risk
        blocks:
          - type: paragraph
            body: >
              NinjaOne's cloud infrastructure is built on major hyperscalers including AWS. A regional AWS outage (as
              occurred in December 2021 and September 2023) would affect NinjaOne's ability to deliver RMM commands,
              remote access sessions, and backup jobs to customers in the affected region. NinjaOne publishes a status
              page (status.ninjaone.com) that provides availability history; a review of community discussions suggests
              occasional outages have been noted but without published uptime SLA guarantees.

              Remote access reliability is cited by SourceForge reviewers as experiencing approximately 1 disconnect per
              day, which is a measurable quality gap in the core product. As remote access becomes increasingly critical
              for MSP service delivery (particularly for after-hours support), this reliability issue could affect
              renewal rates and competitive positioning against Splashtop, TeamViewer, and built-in tools.

              Post-acquisition integration of Dropsuite (acquired for $252M; integration completed approximately June
              2025) introduces technical debt, redundant engineering headcount management, and customer migration
              complexity. The rebrand to NinjaOne Backup added 15,000+ customers to the unified platform, creating new
              backup infrastructure operational responsibilities. Backup data loss incidents or prolonged restoration
              failures in this context would carry significant customer liability.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.4'
        title: Partner and Dependency Risk
        blocks:
          - type: paragraph
            body: >
              NinjaOne's integrations with ConnectWise PSA, Autotask, and HaloPSA are critical to its MSP workflow
              proposition. If ConnectWise or Kaseya acquires a competing RMM platform or develops native RMM
              capabilities, they could create a disadvantage for MSPs using NinjaOne by prioritizing their own product
              integrations. ConnectWise has historically acquired tools adjacent to its PSA (e.g., ConnectWise Automate,
              ConnectWise Control) and could use pricing or integration friction as a competitive lever.

              Microsoft represents the largest long-term dependency risk. Microsoft Intune (part of Microsoft 365
              Business Premium) is increasingly capable for device management, and Microsoft's distribution advantages
              through existing Microsoft 365 enterprise licensing relationships make it a natural incumbent for
              enterprise IT buyers. While Intune is less mature than NinjaOne for MSP workflows, Microsoft's investment
              in the endpoint management space is a multi-year headwind.

              The GTS channel partnership creates incremental channel dependency: if NinjaOne becomes reliant on GTS for
              a significant share of new customer acquisition, GTS's performance or any deterioration in the
              relationship would affect NinjaOne's growth trajectory.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.5'
        title: Financial and Execution Risk
        blocks:
          - type: paragraph
            body: >
              NinjaOne raised $500M in its November 2024 Series C at a $5B valuation. The concurrent $252M Dropsuite
              acquisition consumed approximately half the Series C capital, leaving roughly $250M in net new capital
              (before the $8.5M Dropsuite integration costs). If FY2025 revenue was approximately $400–500M (consistent
              with 70% YoY growth from an inferred FY2024 base), the $5B valuation implies an EV/ARR multiple of
              approximately 10–12x. A deceleration in growth from 70% to 40% YoY would compress the exit multiple
              meaningfully.

              NinjaOne has been private for 13 years (founded 2013); the $5B valuation and ~$761M total raised create
              both exit pressure (IPO or strategic sale required to return capital to investors) and execution risk
              (scaling engineering, sales, and infrastructure for a company targeting $1B+ ARR). Leadership
              concentration in Sal Sferlazza as founder-CEO poses continuity risk; no succession planning or co-CEO
              structure has been disclosed.

              Integrating Dropsuite also places demands on engineering leadership bandwidth, product management, and
              customer success resources. If the Dropsuite backup quality issues emerge post-integration (data loss,
              restore failures), the liability and remediation cost could materially exceed the $252M acquisition price.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >
              The investment thesis for NinjaOne rests on five pillars: (1) a structural tailwind from the global growth
              of the MSP market and the ongoing shift to managed IT services; (2) product-market fit confirmed by 4,295
              G2 reviews at 4.7/5 and a 98% claimed satisfaction rate; (3) a per-device subscription model that
              generates natural ARR expansion within the existing customer base as MSP clients grow; (4) strong
              cross-sell momentum (backup attach rate ~40% within 10 months of launch); and (5) a competitive moat built
              on the MSP workflow depth of the platform, integration lock-in with PSA providers, and community network
              effects (script library, G2 reviews, Reddit r/msp community).

              The anti-thesis rests on four concerns: (1) the $5B private valuation implies limited multiple expansion
              upside — most of the value creation must come from ARR growth, not re-rating; (2) the RMM supply-chain
              security risk is a binary tail risk — a Kaseya-scale breach would be a valuation-destroying event; (3) key
              financial metrics (NRR, GRR, audited revenue, cash position) remain unverified in public sources; and (4)
              Microsoft Intune represents a long-term competitive headwind in the enterprise IT segment that could cap
              NinjaOne's TAM expansion.

              The thesis is conditional: it holds if NinjaOne can (a) sustain 40%+ ARR growth through 2027, (b)
              demonstrate an audited NRR above 110%, (c) show no major security incidents, and (d) achieve a credible
              IPO or strategic exit path at $10–15B+. These are achievable but require verification.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
      - number: '8.2'
        title: Financing Context and Valuation Framework
        blocks:
          - type: paragraph
            body: >
              NinjaOne raised $500M in its Series C (November 2024) at a $5B post-money valuation led by ICONIQ Growth,
              with follow-on participation from Summit Partners. The Dropsuite acquisition (January 2025 announcement,
              $270M final price, June 2025 close) consumed approximately $270M of Series C capital, leaving roughly
              $230M in net new operating capital. Total capital raised to date is approximately $761.5M across six
              rounds.

              Valuation framework: At $5B entry with estimated FY2025 ARR of approximately $450–550M (extrapolating from
              70% YoY growth and ~10–14x Series C multiple), the implied EV/ARR multiple is approximately 9–11x. This is
              at a discount to the 15–20x multiples commanded by the fastest-growing public SaaS companies (ServiceNow,
              Veeva) but above the 4–6x multiples for mature/slower-growing endpoint management peers (N-able,
              SolarWinds).

              Comparable transaction context: Jamf IPO valued at ~$3.5B in 2020 at approximately 18x ARR; N-able
              spin-off from SolarWinds in 2021 at approximately $1.5B (~5x ARR); Barracuda acquisition by KKR at
              approximately $4B (2022). These comparables suggest $5B for a 70%-growing RMM platform is defensible but
              on the high end of the MSP/RMM comp set.

              At IPO (estimated 2027–2028 based on investor return pressure from the November 2024 round), NinjaOne
              would need to show $800M–$1.2B ARR and 30–50% growth to justify a 12–15x IPO multiple that delivers a
              $10–15B valuation and meaningful investor returns.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
      - number: '8.3'
        title: Bull / Base / Bear Case Scenarios
        blocks:
          - type: paragraph
            body: >
              Bull case (35% probability): NinjaOne sustains 50–70% ARR growth through FY2027, driven by
              Kaseya/ConnectWise market share captures, international expansion, backup and documentation module upsell,
              and potential new product launches. FY2027 ARR reaches $900M–$1.2B. IPO in 2027–2028 at 14–18x forward ARR
              yields an exit valuation of $12.6B–$21.6B. From a $5B entry, this represents a 2.5–4.3x return multiple
              (25–40% IRR). Requires: no security breach, successful FedRAMP authorization, continued product
              leadership.

              Base case (45% probability): Growth decelerates to 30–40% YoY as the Kaseya migration tailwind fades and
              Microsoft Intune limits enterprise IT upside. FY2027 ARR reaches $700M–$800M. IPO in 2028–2029 at 10–13x
              forward ARR yields $7B–$10.4B. From $5B entry, this represents a 1.4–2.1x return multiple (8–16% IRR) —
              adequate but not compelling. Requires: clean security record, verified NRR >110%.

              Bear case (20% probability): Growth decelerates below 25% due to security incident, Microsoft Intune
              competitive displacement, or macroeconomic MSP spending reduction. FY2027 ARR reaches $500M–$600M. Exit at
              6–8x ARR (compressed multiple) yields $3B–$4.8B — a loss at $5B entry. Triggering events: platform breach,
              CEO departure, GDPR enforcement, major customer defection wave.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
      - number: '8.4'
        title: Comparable Set and Benchmark Analysis
        blocks:
          - type: paragraph
            body: >
              NinjaOne sits in the MSP/RMM software category with endpoint management and IT operations SaaS
              adjacencies. Public comparables include N-able (NYSE: NBLE, ~$1.5B market cap, ~4x ARR), SolarWinds (NYSE:
              SWI, ~$4.5B market cap, ~5x ARR), and SentinelOne (NYSE: S, ~$10B market cap, ~10x ARR for endpoint
              security). These comps reflect the 2024–2026 valuation compression environment for software companies,
              where only the highest-growth names command premium multiples.

              In the private market, NinjaOne's closest comparable is Cybereason (private, endpoint security, raised at
              ~$3B valuation but subsequently distressed) — though NinjaOne's RMM economics are more durable. Absolute
              Software's acquisition by Crosspoint Capital in 2023 at ~$900M (~6x ARR) and Ivanti's acquisition of
              MobileIron/Pulse/Cherwell (PE-backed, ~$2B implied) provide M&A comparables at lower growth rates.

              The best case comp for NinjaOne's growth profile is Jamf (Apple device management) which IPO'd in 2020 at
              $3.5B and reached $7B market cap at peak; Jamf grew at 25–35% when it went public. NinjaOne's 70% growth
              rate would position it more favorably than Jamf at IPO if sustained, but the MSP RMM TAM is broader and
              NinjaOne's platform breadth is greater.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
      - number: '8.5'
        title: Recommendation and Diligence Action Plan
        blocks:
          - type: paragraph
            body: >
              Recommendation: Conditional Positive — Attractive opportunity with material diligence requirements. Do not
              commit capital until the following blocking items are resolved: (1) audited financial statements for
              FY2024 and FY2025 with verified ARR and NRR; (2) SOC 2 Type II audit report reviewed under NDA with scope
              covering RMM agent, backup infrastructure, and remote access; (3) cyber-liability insurance policy summary
              with per-event and aggregate limits; (4) legal review of the NinjaOne MSA indemnification caps and
              limitation of liability clauses.

              Entry discipline: If diligence satisfies the above, the $5B mark is defensible for a late-stage growth
              round (Series C secondary or co-investment). However, any new primary capital commitment should target a
              $4.5–5.0B cap; above $5B without audited verification of the ARR and NRR profile is not recommended.
              Warrant provisions or ratchet protections for a down-round scenario should be negotiated.

              Thesis-break monitoring: After investment, the following indicators should be monitored monthly: (a)
              platform security incident reports and CVE disclosures; (b) quarterly customer count updates from press
              releases; (c) backup attach rate trajectory; (d) N-able and SolarWinds earnings calls for RMM market
              pricing signals; (e) Microsoft Intune MSP program announcements.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
