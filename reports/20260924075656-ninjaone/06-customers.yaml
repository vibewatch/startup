chapter:
  number: 6
  title: Customers
  summary: 'NinjaOne''s customer base reached approximately 35,000–40,000 organizations across 140+ countries as of April
    2026, with MSPs (managed service providers) comprising the estimated 70–80% majority of the customer base. G2 user reviews
    (4,295 reviews, 4.7/5 rating) and a company-claimed 98% customer satisfaction rate over five years provide strong third-party
    satisfaction signals. Cross-sell momentum is demonstrated by NinjaOne Backup reaching 15,000+ customers (~40% attach rate)
    within 10 months of the Dropsuite rebrand. Key customer-side gaps include: no publicly confirmed NRR, GRR, or cohort retention
    data; no named enterprise referenceable customers disclosed; and no confirmed top-customer revenue concentration metrics.
    The land-and-expand model via device-count growth and backup upsell is structural but unverified at cohort level.

    '
sections:
- id: customer-segmentation
  title: Customer Base Segmentation
  order: 1
  tableRefs:
  - TU001
  figureRefs:
  - FU001
  body: 'NinjaOne''s customer base of approximately 35,000–40,000 organizations as of April 2026 spans 140+ countries. The
    primary buyer segment is managed service providers (MSPs), estimated at 70–80% of the customer base. MSPs use NinjaOne
    to manage third-party client endpoints as a core business tool; this creates a multiplier effect where each MSP customer
    typically represents hundreds to thousands of managed devices. The secondary segment is internal IT departments in mid-market
    and enterprise organizations managing their own device fleets.

    Geographically, NinjaOne''s customer base is heaviest in the United States (reflecting headquarters in Austin, TX and
    the density of the North American MSP market), followed by Europe. The 140+ country footprint reflects the global MSP
    market but also the platform''s cloud-first deployment model, which eliminates geographic infrastructure barriers.

    Vertical segmentation is not publicly disclosed. The RMM buyer universe spans all verticals requiring IT management —
    healthcare, financial services, professional services, retail, and public sector are all represented in the MSP customer
    base. NinjaOne has not disclosed any vertical-specific go-to-market motion or customer concentration by industry.

    '
  claimRefs: &id001
  - CU001
  - CU002
  - CU003
  - CU004
- id: adoption-trajectory
  title: Adoption Trajectory and Scale
  order: 2
  tableRefs:
  - TU002
  figureRefs: []
  body: 'NinjaOne has grown its customer base from approximately 5,000 customers at the time of the 2020 Summit Partners venture
    round to 35,000–40,000 by April 2026 — a roughly 7x increase over six years reflecting strong organic demand in the MSP
    market. The company reported approximately 70% year-over-year revenue growth for FY2025, consistent with significant customer
    count expansion. The channel partnership with GTS (Global Technology Solutions) announced April 2026 is expected to add
    incremental MSP partners in new markets.

    The NinjaOne Backup cross-sell trajectory is notable: 15,000+ customers adopted the backup product within approximately
    10 months of the Dropsuite rebrand (April 2026), representing an attach rate of approximately 37–43% of the total customer
    base. This trajectory demonstrates the effectiveness of the single-console cross-sell motion. If the backup attach rate
    continues growing to 60–70%, it would materially expand revenue per customer without requiring new customer acquisition.

    Device count growth is a parallel indicator of adoption depth: each MSP customer adds devices over time as their own client
    base grows, creating device-count ARR expansion without new customer acquisition. NinjaOne has not disclosed managed device
    count publicly.

    '
  claimRefs: *id001
- id: named-customer-proof
  title: Named Customer Proof and Reference Availability
  order: 3
  tableRefs:
  - TU003
  figureRefs: []
  body: 'NinjaOne''s public customer proof is predominantly aggregate and review-based rather than named enterprise references.
    G2 provides 4,295 user reviews at 4.7/5 with NinjaOne ranked #1 in seven G2 categories including RMM, Endpoint Management,
    and Remote Monitoring and Management. TrustRadius, Capterra, and SourceForge provide additional corroborating review coverage.
    This represents the densest publicly available proof of customer satisfaction in the MSP RMM market.

    Named enterprise customer case studies are not prominently published by NinjaOne. This is not unusual for a platform sold
    primarily through the MSP channel, where the MSP relationship is the primary customer and MSPs'' own clients are rarely
    named. The absence of published Fortune 500 or large enterprise references does create a gap for investors seeking proof
    of enterprise-grade deployments at scale.

    The GTS partnership (April 2026) and the Dropsuite backup adoption trajectory provide indirect proof of adoption scale.
    Reddit r/msp community threads frequently cite NinjaOne as the platform MSPs are migrating to from Kaseya VSA after Kaseya''s
    2021 ransomware incident and subsequent pricing controversies — this community migration signal is a credible organic
    adoption indicator.

    '
  claimRefs: *id001
- id: retention-satisfaction
  title: Retention, Satisfaction, and Net Revenue Retention
  order: 4
  tableRefs: []
  figureRefs: []
  body: 'NinjaOne claims 98% customer satisfaction for more than five consecutive years. This company-stated metric is consistent
    with G2''s 4.7/5 aggregate rating from 4,295 reviewers and high Capterra and TrustRadius ratings. The 98% satisfaction
    claim implies a very low dissatisfaction rate, but the specific methodology (survey format, respondent population, and
    what "satisfaction" measures) has not been disclosed.

    Net revenue retention (NRR) and gross revenue retention (GRR) have not been publicly disclosed. Inferring from the per-device
    subscription model: device count growth within existing MSP customers creates natural NRR expansion above 100% even without
    explicit product upsells. The backup cross-sell at ~40% attach rate represents a discrete expansion mechanism. Industry
    benchmarks for high-quality vertical SaaS in this segment typically show NRR of 110–125%, but NinjaOne-specific data is
    unavailable.

    Remote access reliability issues (cited ~1 disconnect/day by SourceForge) are the primary product-driven churn risk. However,
    the platform stickiness created by the script library, documentation integration, and deep PSA connections makes switching
    costly even for dissatisfied users. No confirmed large-scale customer defection events have been publicly reported.

    '
  claimRefs: *id001
- id: expansion-concentration
  title: Expansion and Concentration Risk
  order: 5
  tableRefs: []
  figureRefs: []
  body: 'NinjaOne''s land-and-expand economics are structurally favorable: the per-device subscription model grows revenue
    automatically as MSP clients add devices. The product expansion from RMM to backup, documentation, and ticketing provides
    additional upsell vectors within the same console. The backup attach rate of ~40% demonstrates that cross-sell is already
    working at scale.

    Customer concentration risk is unknown. NinjaOne has not disclosed what percentage of ARR comes from the top 10 or top
    25 customers. The presence of 35,000+ customers across 140+ countries suggests a granular customer base that would limit
    single-customer concentration, but the distribution between small MSPs (50–200 devices) and large MSPs (10,000+ devices)
    is unknown and large MSPs could represent a disproportionate revenue share.

    The GTS channel partnership announced in April 2026 may represent a meaningful channel concentration exposure: if GTS
    becomes a large reseller or customer of NinjaOne, any deterioration in the GTS relationship could affect NinjaOne''s revenue.
    Terms of the partnership (exclusivity, revenue commitment, duration) have not been disclosed.

    '
  claimRefs: *id001
