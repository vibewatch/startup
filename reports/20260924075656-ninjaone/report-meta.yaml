companyProfile:
  summary: >-
    NinjaOne (formerly NinjaRMM) is a private IT management SaaS company founded in 2013 in Austin, Texas by Sal
    Sferlazza, Christopher Matarese, and Eric Herrera. The company operates a cloud-native RMM and unified IT management
    platform for managed service providers and enterprise IT departments. NinjaOne serves roughly 35,000–40,000
    customers across 140+ countries, with company-attributed revenue growth still running at roughly 70% in FY2025. In
    June 2026, NinjaOne raised more than $400 million at a $12.3 billion valuation. The company also completed the
    Dropsuite acquisition and rebranded it as NinjaOne Backup, which reached 15,000+ customers within 10 months. G2
    ranks NinjaOne #1 in seven categories including RMM and Endpoint Management with a 4.7/5 rating from 4,295 reviews.
  foundedDate: '2013-01-01'
  founders:
    - name: Sal Sferlazza
      role: Co-founder and CEO
      background: Serial entrepreneur and IT industry veteran; leads NinjaOne as CEO since founding
    - name: Christopher Matarese
      role: Co-founder
      background: Technology and product co-founder; part of NinjaOne's founding team in 2013
    - name: Eric Herrera
      role: Co-founder
      background: Engineering and operations co-founder; part of NinjaOne's founding team in 2013
  foundingLocation: Austin, Texas, USA
  headquarters: Austin, Texas, USA
  productSummary: >-
