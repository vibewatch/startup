figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: Terralayr sits between integrated asset ownership and virtual flexibility aggregation, with competitors distributed across project delivery, software optimization, and contracted revenue.
    data:
      points:
        - {label: terralayr, x: 8, y: 8, detail: "RIVE and NPM describe integrated ownership/development plus a virtual flexibility platform", note: "Ordinal coordinates are analyst synthesis from assigned evidence, not market-share measurements"}
        - {label: Kyon Energy, x: 8, y: 4, detail: "Kyon discloses full lifecycle project services and substantial project funnel", note: "Virtual aggregation is not established in the assigned source"}
        - {label: Fluence, x: 7, y: 5, detail: "Fluence markets deployment expertise and software intelligence", note: "Global scale is visible but comparable German owner-operator exposure is unknown"}
        - {label: Return, x: 4, y: 8, detail: "ESS News reports multi-asset aggregation and a 100 MW vFPA", note: "Asset ownership is not established"}
        - {label: Entrix, x: 3, y: 7, detail: "ESS News reports AI-supported optimization for a 5 MW / 25 MWh grid-supportive project", note: "Portfolio scale is unknown"}
        - {label: "Internal build", x: 6, y: 2, detail: "Status quo can retain control over dispatch and economics", note: "Customer-specific capability and cost are unknown"}
      xAxis: "Integrated physical asset ownership and project delivery (ordinal 0-10)"
      yAxis: "Virtual aggregation and contracted flexibility capability (ordinal 0-10)"
    approximationNotes: "Coordinates are evidence-backed ordinal scoring synthesized from the cited source descriptions; they are not independent benchmark scores, market shares, or price comparisons."
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
callouts:
  - calloutType: insight
    title: Differentiation is a systems proposition
    body: Terralayr's most credible distinction is the combination of owned assets, third-party aggregation, and flexible contracting rather than a uniquely documented battery technology.
    claimRefs: [CP003, CP005]
  - calloutType: risk
    title: Bankability can compress the moat
    body: Lender requirements for contracted revenue and the emergence of fixed-price vFPAs and guaranteed tolling create a high bar for proving that Terralayr's platform converts differentiation into durable economics.
    claimRefs: [CP010, CP011, CP013]
