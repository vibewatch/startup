company:
  name: terralayr
chapter:
  number: 1
  title: Company Overview
  summary: Terralayr is a Swiss-registered, Germany-focused battery-storage owner-operator and flexibility platform whose LAYR software virtualizes storage capacity for commercialisation. The January 2026 financing and expanding operating footprint are material positives, but public disclosure still does not establish valuation, revenue, profitability, or complete governance terms.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Terralayr was registered in Zug in December 2022 with a corporate purpose covering renewable-energy infrastructure and short-, medium-, and long-term storage. The company presents itself as a developer, owner, and operator of grid-scale battery systems supported by LAYR, a platform that virtualizes battery assets and provides a route to market for both owned and third-party capacity. This is a hybrid infrastructure-and-software model rather than a pure software subscription: capital is deployed into storage assets, while the platform is intended to monetize flexible capacity through merchant optimisation, tolling, and virtual battery auctions. The company says all assets are run via LAYR, but its public materials do not disclose the split between asset-level and platform economics.
    claimRefs: [CO001, CO002, CO004, CO005, CO006, CO007]
    tableRefs: [TO001]
  - id: leadership-funding-and-governance
    title: Leadership, funding, and governance
    body: >-
      Philipp Man and Ludwig Wurlitzer co-founded Terralayr after Man's energy-trading experience and the pair's earlier watch-trading business. Eurazeo's January 2026 announcement identifies Man as co-founder and CEO and says its ETIF fund led a €192 million equity financing, including an €80 million upsizing option, alongside RIVE Private Investment and existing shareholders. A separate account records a 2024 financing of €62 million equity and €15 million debt. These rounds show access to institutional capital, but they are not a complete capitalisation table and do not disclose post-money valuation, liquidation preferences, revenue, or cash available. The Swiss registry records CHF100,000 paid-in share capital at incorporation, but the retained sources do not provide a complete current board record.
    claimRefs: [CO002, CO003, CO008, CO009, CO012]
    tableRefs: [TO002, TO003]
  - id: scale-milestones-and-open-risks
    title: Scale, milestones, and open risks
    body: >-
      The operating story has moved quickly from early development agreements to live and contracted capacity. TechCrunch reported 7 megawatt-hours on grid, 40 megawatt-hours expected soon, and development agreements for more than 200 German sites totalling over 7 gigawatts in October 2024. By January 2026, Energy-Storage.news reported more than 50 MW live and another 100 MW expected in the very near future, while LAYR was reportedly used on owned and third-party assets. The pipeline remains qualified: Man described the 7 GW position as a five- to ten-year horizon and warned that not every project would proceed. A low-reputation secondary profile reports a seven-year Vattenfall agreement covering 55 MW / 110 MWh, which needs direct verification. External evidence also shows a grid-connection bottleneck: BDEW cited more than 720 GW of pending large-scale battery applications, making connection allocation a material execution dependency.
    claimRefs: [CO006, CO007, CO010, CO011, CO013, CO016]
    figureRefs: [FO001]
  - id: diligence-conclusion
    title: Diligence conclusion
    body: >-
      The strongest evidence supports a well-capitalized, founder-led German storage platform with a differentiated virtualisation proposition and credible utility counterparties. The evidence is weaker on the dimensions that determine investor underwriting: valuation, recurring revenue, margin, asset utilization, cash burn, project-finance obligations, cap-table control, and the completeness of the leadership roster. Public market material supports the strategic need for storage, but it also implies congestion and regulatory competition for grid access. The appropriate current conclusion is therefore research-more: the identity, financing, and operating thesis are sufficiently substantiated to merit continued diligence, while the economics and governance remain too opaque for a price-sensitive investment judgment.
    claimRefs: [CO005, CO008, CO011, CO013, CO014, CO015]
