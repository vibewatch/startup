callouts:
  - calloutType: recommendation
    title: "Current diligence posture: research-more"
    body: The company has enough identity, capital, and operating evidence to justify continued diligence, but not enough public economics or governance disclosure for a valuation-sensitive decision.
    claimRefs: [CO008, CO011, CO013]
  - calloutType: assumption
    title: Do not equate pipeline with installed capacity
    body: Development agreements, ready-to-build projects, live MW, and contracted virtual capacity are different populations and should not be aggregated without project-level reconciliation.
    claimRefs: [CO006, CO010, CO011, CO016]
