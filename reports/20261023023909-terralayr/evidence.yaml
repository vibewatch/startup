evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: valuation-and-cap-table
    missingEvidence: >-
      Post-money valuation, fully diluted cap table, liquidation preferences, option pool, and any secondary
      transactions for the January 2026 round.
    whyItMatters: The financing amount alone cannot support a valuation-sensitive investment judgment or determine investor control.
    diligencePath: >-
      Request the signed term sheet, latest cap table, shareholder agreement, and board-approved financing materials
      under NDA.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-economics
    missingEvidence: >-
      Current revenue, gross margin, utilization, tolling-versus-merchant mix, cash burn, runway, and project-level
      obligations.
    whyItMatters: >-
      The business combines capital-intensive assets with a platform, so aggregate funding and MW do not establish
      recurring economics.
    diligencePath: Obtain monthly management accounts, asset-level operating reports, commercial contracts, and debt schedules.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-founder-table
    missingEvidence: A current complete leadership and board roster with mandates, investor rights, and material recent changes.
    whyItMatters: >-
      The retrieved public sources identify key people but do not establish current governance coverage or key-person
      concentration.
    diligencePath: >-
      Request the current organization chart, board minutes, director register extracts, and executive employment
      roster.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: capacity-reconciliation
    missingEvidence: >-
      A dated asset register reconciling live MW/MWh, under-construction projects, third-party virtual capacity, and
      development pipeline.
    whyItMatters: >-
      Reported 7 MWh, 50 MW-plus, 100 MW expected, 55 MW virtual capacity, and 7 GW pipeline refer to different
      populations and periods.
    diligencePath: >-
      Request a project-by-project schedule with status, ownership, contracted capacity, commissioning date, and source
      contract.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sam-som
    missingEvidence: A Terralayr-specific SAM/SOM model with eligible geography, target segments, pricing, and share assumptions.
    whyItMatters: >-
      The public market forecasts describe different populations and cannot support a company-specific revenue
      opportunity.
    diligencePath: >-
      Request management's bottom-up market model and reconcile it to project pipeline, signed contracts, and customer
      segmentation.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Realized asset and platform economics by project and contract.
    whyItMatters: Capacity growth alone does not show whether the business earns attractive risk-adjusted returns.
    diligencePath: >-
      Obtain monthly project P&Ls, toll pricing, utilization, degradation, availability, counterparty terms, and
      platform take rate.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Comparable realized pricing, take rates, tolling fees, and revenue splits for Terralayr and named alternatives.
    whyItMatters: >-
      Pricing power and unit economics determine whether the platform's differentiated packaging is economically
      durable.
    diligencePath: Obtain executed contract abstracts or a buyer-approved pricing and fee schedule for representative assets.
    relatedQuestionRefs:
      - QP004
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: moat
    missingEvidence: Independent data on dispatch performance, uptime, renewals, churn, and customer concentration.
    whyItMatters: Without operating and retention evidence, switching-cost and moat claims remain hypotheses.
    diligencePath: Request asset-level operating KPIs, customer cohort history, renewal terms, and counterparty concentration.
    relatedQuestionRefs:
      - QP005
      - QP008
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: bankability
    missingEvidence: Terralayr-specific debt terms, contracted-revenue coverage, and credit support for its tolling portfolio.
    whyItMatters: Competitor bankability thresholds may constrain growth or compress returns if Terralayr cannot match them.
    diligencePath: Review project-finance term sheets, contracted MW/MWh coverage, guarantees, and merchant exposure by asset.
    relatedQuestionRefs:
      - QP006
      - QP007
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: private-financials
    missingEvidence: Audited or management revenue, gross margin, cash, burn, runway, utilization and valuation data.
    whyItMatters: Without these inputs, revenue quality, capital adequacy, return potential and valuation cannot be tested.
    diligencePath: Request the latest management accounts, cash forecast, KPI pack, cap table and valuation materials under NDA.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: Instrument-level reconciliation of the earlier €62m equity plus €15m debt report and the later €192m financing.
    whyItMatters: >-
      Funding totals cannot be summed safely without distinguishing equity, debt, project finance, committed and drawn
      amounts.
    diligencePath: Obtain a dated financing chronology, sources-and-uses schedule and debt/project-finance commitment letters.
    relatedQuestionRefs:
      - QI007
  - type: missing-source
    severity: material
    topic: project-economics
    missingEvidence: >-
      Asset-level capex, operating costs, degradation, availability, contracted share and merchant revenue
      sensitivities.
    whyItMatters: >-
      These variables determine gross margin, leverage, cash needs and downside exposure in a capital-intensive
      portfolio.
    diligencePath: >-
      Review the project model for each operating, construction and ready-to-build asset, including independent
      technical and insurance assumptions.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
