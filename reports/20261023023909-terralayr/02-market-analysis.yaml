    claimRefs: [CM005, CM006, CM007, CM008, CM009]
callouts:
  - calloutType: strength
    title: "Structural demand is visible"
    body: "European storage deployment is accelerating, while German market evidence shows active demand for contracted and aggregated flexibility. Terralayr's virtual portfolio is aligned with that buyer need."
    claimRefs: [CM005, CM010, CM011]
  - calloutType: risk
    title: "Market size is not company value"
    body: "The available forecasts do not disclose Terralayr's addressable share, realized pricing, utilization, or margin. A large capacity market should not be converted into a valuation conclusion without those inputs."
    claimRefs: [CM006, CM008, CM018]
