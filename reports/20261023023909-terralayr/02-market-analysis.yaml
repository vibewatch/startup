    columns: [Segment, Buyer, User, Payer / budget owner, Workflow, Adoption trigger]
    rows:
      - [Utility or energy trader, "Origination / trading desk", "Trader and dispatch operator", "Utility operating or procurement budget", "Procure standardized flexibility and optimize across markets", "Need capacity without owning each battery"]
      - [Industrial or renewable offtaker, "Energy procurement / sustainability team", "Portfolio manager", "Energy or infrastructure budget", "Use contracted flexibility for wholesale and reserve needs", "Volatility, balancing need, or decarbonization target"]
      - [Battery asset owner, "Infrastructure owner / developer", "Asset manager and optimizer", "Project or portfolio budget", "Pool excess capacity and monetize it through dispatch", "Need route-to-market, financing, or higher utilization"]
      - [Lender or infrastructure investor, "Credit / investment committee", "Technical and financial diligence teams", "Project-finance or investment allocation", "Underwrite contracted cash flow, availability, and debt service", "Tolling or other bankable revenue support"]
    notes: "Buyer roles are analytical segments inferred from the cited virtual-tolling, project-finance, and portfolio descriptions; public sources do not disclose Terralayr's customer budget allocation."
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
