  - id: TV002
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation or return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          Contracted and operating capacity scales; optimization captures durable spreads; financing terms preserve
          common-equity upside.
        - Potential platform premium over asset-only economics, but no defensible multiple is public.
        - Low-to-medium
        - Capacity or contracted revenue fails to convert into cash generation.
      - - Base
        - >-
          Deployment continues, but merchant revenue varies and German connection or tariff reforms reduce realized
          margins.
        - Research-more; require a risk-adjusted return above the investment hurdle before entry.
        - Medium
        - Unverified unit economics or materially higher capital needs.
      - - Bear
        - Grid restrictions, redispatch, fee reform, construction delays, or refinancing compress project returns.
        - Avoid or defer; enterprise value may not protect common equity after debt and preferences.
        - Medium
        - Down-round, covenant pressure, or preference overhang.
      - - Public boundary
        - 'Fluence snapshot: USD2.16bn EV, USD2.70bn trailing revenue, 0.84% profit margin in December 2024.'
        - Reference only; Fluence scale and business mix are not terralayr comparables.
        - Not a terralayr scenario
