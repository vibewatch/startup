      - number: '1.2'
        title: Leadership, funding, and governance
        blocks:
          - type: paragraph
            body: >-
              Philipp Man and Ludwig Wurlitzer co-founded Terralayr after Man's energy-trading experience and the pair's
              earlier watch-trading business. Eurazeo's January 2026 announcement identifies Man as co-founder and CEO
              and says its ETIF fund led a €192 million equity financing, including an €80 million upsizing option,
              alongside RIVE Private Investment and existing shareholders. A separate account records a 2024 financing
              of €62 million equity and €15 million debt. These rounds show access to institutional capital, but they
              are not a complete capitalisation table and do not disclose post-money valuation, liquidation preferences,
              revenue, or cash available. The Swiss registry records CHF100,000 paid-in share capital at incorporation,
              but the retained sources do not provide a complete current board record.
            claimRefs:
              - CO002
              - CO003
              - CO008
              - CO009
              - CO012
