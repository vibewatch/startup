              - CO004
              - CO006
              - CO008
              - CO009
              - CO010
              - CO011
              - CO016
      - number: '1.4'
        title: Diligence conclusion
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence supports a well-capitalized, founder-led German storage platform with a
              differentiated virtualisation proposition and credible utility counterparties. The evidence is weaker on
              the dimensions that determine investor underwriting: valuation, recurring revenue, margin, asset
              utilization, cash burn, project-finance obligations, cap-table control, and the completeness of the
              leadership roster. Public market material supports the strategic need for storage, but it also implies
              congestion and regulatory competition for grid access. The appropriate current conclusion is therefore
              research-more: the identity, financing, and operating thesis are sufficiently substantiated to merit
              continued diligence, while the economics and governance remain too opaque for a price-sensitive investment
              judgment.
            claimRefs:
              - CO005
              - CO008
              - CO011
