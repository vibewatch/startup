      - number: '1.3'
        title: Scale, milestones, and open risks
        blocks:
          - type: paragraph
            body: >-
              The operating story has moved quickly from early development agreements to live and contracted capacity.
              TechCrunch reported 7 megawatt-hours on grid, 40 megawatt-hours expected soon, and development agreements
              for more than 200 German sites totalling over 7 gigawatts in October 2024. By January 2026,
              Energy-Storage.news reported more than 50 MW live and another 100 MW expected in the very near future,
              while LAYR was reportedly used on owned and third-party assets. The pipeline remains qualified: Man
              described the 7 GW position as a five- to ten-year horizon and warned that not every project would
              proceed. A low-reputation secondary profile reports a seven-year Vattenfall agreement covering 55 MW / 110
              MWh, which needs direct verification. External evidence also shows a grid-connection bottleneck: BDEW
              cited more than 720 GW of pending large-scale battery applications, making connection allocation a
              material execution dependency.
            claimRefs:
              - CO006
              - CO007
              - CO010
              - CO011
              - CO013
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
