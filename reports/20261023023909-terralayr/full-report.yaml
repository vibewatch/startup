chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Terralayr was registered in Zug in December 2022 with a corporate purpose covering renewable-energy
              infrastructure and short-, medium-, and long-term storage. The company presents itself as a developer,
              owner, and operator of grid-scale battery systems supported by LAYR, a platform that virtualizes battery
              assets and provides a route to market for both owned and third-party capacity. This is a hybrid
              infrastructure-and-software model rather than a pure software subscription: capital is deployed into
              storage assets, while the platform is intended to monetize flexible capacity through merchant
              optimisation, tolling, and virtual battery auctions. The company says all assets are run via LAYR, but its
              public materials do not disclose the split between asset-level and platform economics.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO006
              - CO007
