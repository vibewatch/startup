              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU008
              - CU016
              - CU017
              - CU018
      - number: '6.3'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports contractual durability in selected relationships, but not retention metrics. The
              Vattenfall structure has a seven-year term and a stated path from 5 MW to 55 MW, while the customer-facing
              operating surface lists a later 55 MW live portfolio and a separate Stadtwerke Duisburg relationship.
              Those facts suggest expansion can occur inside an existing counterparty relationship, yet they do not
              establish net revenue retention, renewal probability, utilization, or gross margin. The customer base also
              appears concentrated by disclosed proof: Vattenfall is the only counterparty with a quantified live
              virtual portfolio in the current sources, and Stadtwerke Duisburg's prospective portfolio is described at
              more than 100 MW. Modo Energy's market analysis explains why customers may prefer structured tolling or
              partial tolling as German ancillary markets saturate, but it is market evidence rather than
              terralayr-specific retention proof. The material diligence ask is a cohort and contract schedule showing
              counterparty, capacity, term, renewal, revenue share, utilization, and termination rights.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU018
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU009
              - CU010
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Contracted operating proof
            body: >-
              The Vattenfall relationship is a named, seven-year capacity toll with an initial 5 MW tranche, a 55 MW
              target, and eight distributed batteries controlled through LAYR.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU007
          - type: callout
            title: Retention remains unproven
            body: >-
              No assigned source discloses customer count, churn, renewal, NRR, utilization, customer-level revenue, or
              realized outcomes, so expansion signals cannot be converted into retention.
            calloutType: risk
            claimRefs:
              - CU012
              - CU013
          - type: callout
            title: Request contract-level cohort evidence
            body: >-
              Obtain a customer and asset schedule with signed capacity, live status, term, renewal, revenue share,
              utilization, outages, and termination rights by counterparty.
            calloutType: recommendation
            claimRefs:
              - CU012
              - CU013
              - CU018
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked investment risk view
        blocks:
          - type: paragraph
            body: >-
              The leading residual risk is execution against scarce grid capacity rather than a demonstrated
              company-specific legal breach. Independent legal analysis reports roughly 211 GW of transmission-level
              BESS connection requests at Q3 2025 and more than 400 GW across all network levels, while a March 2026
              regulator decision allowed a connection refusal on technical capacity grounds and confirmed that storage
              does not receive KraftNAV treatment. Terralayr's company-reported portfolio of more than 150 MW operating
              or under construction, nearly 200 MW ready to build, and an 8 GW secured pipeline therefore spans very
              different stages of certainty. Historical management commentary that not every contracted development site
              would proceed reinforces the conversion risk. The investment implication is to underwrite operating and
              contracted megawatts separately from pipeline megawatts, with grid reservations, permits, deposits, and
              commissioning evidence as stage gates rather than treating headline capacity as one homogeneous asset
              base.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR011
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR010
              - CR011
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR007
              - CR008
              - CR011
              - CR012
              - CR016
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              German rules create both permissioning upside and economic uncertainty. Current law generally provides a
              20-year network-tariff exemption for BESS commissioned by 4 August 2029, but the regulator has signalled a
              future general tariff framework and White & Case considers early deviation from the exemption plausible.
              Proposed connection allocation also adds material maturity tests, a EUR 50,000 application fee, and a EUR
              1,500 per MW realisation deposit; these proposals were not yet enacted in the reviewed source and should
              not be modelled as settled law. Separately, the 2026 German critical-facilities regime covers the energy
              sector and can impose registration, resilience, management, and incident-reporting duties when thresholds
              are met. Public evidence does not establish whether any Terralayr facility currently qualifies. Diligence
              should obtain a site-by-site legal memo covering connection regime, tariff assumptions, permitting status,
              KRITIS/NIS2 scope, and the owner of each compliance obligation.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR016
      - number: '7.3'
        title: Operating, partner, and financial dependencies
        blocks:
          - type: paragraph
            body: >-
              The RWE agreement provides evidence of a real commercial mitigation: from 2026, RWE is to optimise 50 MW /
              100 MWh for five years, with Terralayr receiving fixed annual remuneration under a multi-asset tolling
              structure. RWE also says distributing service across several systems can improve performance, extend
              service life, and reduce operational risk. Those benefits do not remove counterparty, integration,
              warranty, or availability exposure; the reviewed terms do not disclose pricing, service-level remedies,
              termination rights, or concentration. Capital availability is another partial mitigant, not proof of
              runway: the company announced EUR 192 million of equity including an EUR 80 million upsizing option, and
              independent reporting describes an earlier mix of EUR 62 million equity and EUR 15 million debt. Neither
              amount establishes unrestricted cash, project-level leverage, cash burn, or remaining capital needs.
              Investment underwriting should reconcile corporate cash and committed equity with project debt,
              construction draws, collateral, and contracted revenue.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR012
              - CR013
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR008
              - CR009
              - CR010
              - CR012
              - CR013
              - CR016
      - number: '7.4'
        title: Monitoring indicators and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Monitoring should focus on evidence that changes residual risk, not announcement volume. For each project,
              track connection reservation, permit maturity, construction notice to proceed, battery and inverter
              delivery, energisation, availability, degradation, and liquidated-damages coverage. At portfolio level,
              track operating MW, contracted tolling MW, merchant exposure, counterparty concentration, covenant
              headroom, unrestricted cash, and capital still required to commission the ready-to-build fleet. A thesis
              break would occur if material projects lose grid access, tariff reform renders contracted returns
              uneconomic, a critical cyber or safety event exposes inadequate controls, or financing becomes conditional
              on unsupported pipeline valuations. The present source set cannot quantify those thresholds because it
              lacks asset-level economics, supplier schedules, incident records, certifications, and concentration data.
              These are material diligence gaps, not evidence that incidents or concentration are absent.
            claimRefs:
              - CR002
              - CR004
              - CR007
              - CR011
              - CR012
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Pipeline megawatts are not operating megawatts
            body: >-
              Value the 8 GW company-reported pipeline only after project-level evidence clears land, permitting,
              connection, financing, equipment, and commissioning gates.
            calloutType: risk
            claimRefs:
              - CR011
              - CR014
              - CR015
          - type: callout
            title: Kill criteria for the next diligence round
            body: >-
              Stop or reprice if binding connection evidence fails, tariff stress breaks project returns, unrestricted
              liquidity does not cover committed obligations, or cyber and supplier controls remain untestable for
              operating assets.
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR004
              - CR007
              - CR012
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Evidence base and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Terralayr presents itself as a fully integrated energy-flexibility provider that aggregates and
              virtualizes owned and third-party battery assets through Layr. Its media kit describes auctions,
              structured products, and API-driven transactions, while TechCrunch reports a revenue-share model in which
              terralayr charges battery owners a small percentage of revenues and may share upside when it outperforms a
              competitor. That model gives the company a plausible platform and asset-management pathway, but public
              evidence still does not establish recurring revenue, gross margin, utilization, or the split between owned
              assets and third-party capacity. The financing record is also not internally reconciled: TechCrunch
              reported EUR62 million of equity and EUR15 million of debt, whereas a later third-party profile reports a
              EUR192 million equity financing round. Those figures may describe different periods or instruments, but
              they cannot be treated as one comparable capital total without primary financing documents. Entry should
              therefore be conditioned on a verified cap table, post-money valuation, preference stack, debt covenants,
              and asset-level cash-flow bridge rather than on headline capacity or financing alone.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV009
              - CV014
      - number: '8.2'
        title: Market comparables and scenario framework
        blocks:
          - type: paragraph
            body: >-
              The market backdrop is investable but not a sufficient valuation anchor. Glint Solar reports that two-hour
              German projects generated around EUR259,000 per MW of annual revenue in 2025 with return expectations of
              15% to 18%, while also describing grid-connection applications above 720 GW against 78 GW of confirmed
              commitments. Its 2026 account of flexible connection agreements, possible grid-fee reform, and
              uncompensated redispatch shows why gross market revenue cannot be translated directly into terralayr
              equity value. Wood Mackenzie likewise warns that European BESS revenues remain uncertain and largely
              merchant, and that valuation models can underestimate revenue variance and trading-behavior risk. Fluence
              provides a public-company reference point rather than a direct comparable: the captured December 2024
              snapshot shows USD3.40 billion market capitalization, USD2.16 billion enterprise value, USD2.70 billion
              trailing revenue, 12.64% gross margin, and 0.84% profit margin. Fluence is a larger public system provider
              with different capital intensity and revenue mix, so its EV/sales and margin profile should be used only
              as a boundary reference. The scenario table therefore uses qualitative probability signals and explicit
              diligence triggers rather than invented terralayr multiples.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV009
              - CV014
              - CV015
      - number: '8.3'
        title: Recommendation, downside triggers, and diligence
        blocks:
          - type: paragraph
            body: >-
              The evidence supports research-more rather than buy or sell. The upside case is a scalable flexibility
              layer with development agreements, operational assets, and an investor roster that includes Creandum,
              Earlybird, Picus Capital, Norrsken VC, and RIVE; the anti-thesis is that merchant revenue volatility,
              grid-connection scarcity, changing German planning and tariff rules, construction execution, and opaque
              financing terms could leave equity returns below the required hurdle even if deployment grows. A public
              statement that terralayr had four grid-connected systems, ten under construction, and a 1 GW target within
              36 months is directional evidence of ambition, not proof of funded or profitable deployment. The January
              2026 round's valuation, liquidation preferences, debt/project-finance obligations, and cash remaining
              after commitments are unresolved. A decision can move toward invest only after management supplies a
              reconciled cap table and financing package, audited or management accounts by asset and revenue stream,
              contracted versus merchant capacity, utilization and degradation assumptions, and downside cases for grid
              fees, connection restrictions, and merchant spread compression. The thesis breaks if contracted or
              operating capacity materially misses plan, if a new financing is priced below the prior round, if
              preference claims absorb common-equity upside, or if recurring cash generation cannot fund the platform
              and development pipeline.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV009
              - CV015
      - number: '8.4'
        title: Final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The decisive unknown is not whether the German storage market is large; it is whether terralayr can
              convert capacity access and optimization capability into durable, risk-adjusted equity cash flows. Public
              sources support the existence of a platform proposition, financing activity, and a large development
              pipeline, but they do not establish the denominator needed for a valuation judgment: fully diluted shares,
              post-money price, debt and project-finance recourse, contracted revenue, contribution margin,
              working-capital needs, or cash runway. The next diligence round should reconcile every headline number to
              signed contracts and financial statements, separating owned assets, third-party assets, development
              agreements, and virtual capacity. It should also test whether seven-year offtake arrangements, if
              confirmed, carry fixed economics or merchant exposure, and whether flexible connection and grid-fee
              changes can be passed through to customers. Until that work is complete, the valuation stance remains
              unknown and the recommendation remains research-more.
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV011
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive call
            body: >-
              Research-more is the evidence-consistent recommendation: public sources show a credible platform and
              financing activity, but not the valuation denominator or cash-flow proof required to underwrite
              common-equity returns.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV014
              - CV016
          - type: callout
            title: Financing opacity
            body: >-
              Reported financing totals differ materially across sources and may reflect different periods or
              instruments; treating them as a single capital total would overstate certainty.
            calloutType: risk
            claimRefs:
              - CV003
              - CV014
