      - number: '5.2'
        title: Operating architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              The disclosed operating model is a physical-to-digital control loop: BESS assets are connected and
              dispatched, capacity is virtualized into digital twins, and multiple optimizers can trade the same
              underlying battery in parallel. Terralayr calls this Enhanced Trading of Flexibility and says the model
              allows capacity to move between optimizers without lock-in or switching cost. TechCrunch independently
              described the proposition as aggregating, bundling, and virtualizing grid-scale storage and selling
              capacity over periods from 15 minutes to 15 years, while also reporting that Terralayr does not itself
              trade. These descriptions support the existence of a differentiated commercialization model, not a
              verified software architecture. Public status data showed the production API, physical-assets API,
              virtual-assets API, authentication, sandbox services, and web applications operational on 2026-10-23, but
              uptime history is not a substitute for incident response, resilience testing, or customer-level
              availability guarantees.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
      - number: '5.3'
        title: Differentiation, dependencies, and technical risk
        blocks:
          - type: paragraph
            body: >-
              The strongest differentiation is orchestration and market access: LAYR combines virtualized capacity,
              flexible slicing, multiple optimizers, and offtake structures in one operating surface. The model remains
              dependent on grid connection, battery quality, market and network rules, and the economics of tolling or
              merchant exposure. RÖDL reports almost 10,000 German medium-voltage connection requests in 2024, with
              approximately 3,800 approved, and identifies grid-connection queues, unclear market roles, stricter safety
              and insurability requirements, cell imbalance, and falling revenue potential as project challenges.
              ENTSO-E describes network codes as rules intended to harmonize and integrate the European electricity
              market, including work on cybersecurity and demand-side flexibility. These sources identify external
              dependencies; they do not prove Terralayr has failed any control or safety test. The remaining diligence
              priority is therefore verification: asset commissioning records, dispatch and settlement logs, cyber and
              privacy controls, battery warranties, degradation assumptions, incident history, and evidence that the
              multi-optimizer model performs without conflicting commands or unacceptable availability loss.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE007
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Product maturity verdict
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a live product surface with named user roles, a stated API-mediated workflow,
              production and sandbox endpoints, and an operating model that has attracted a named utility counterparty.
              It does not support a high-confidence conclusion that Terralayr's technology is proprietary, that its
              integrations are broad, or that its reliability, security, safety, and quality controls are independently
              validated. The appropriate product judgment is therefore conditional: the architecture is commercially
              differentiated enough to merit technical diligence, but the public record remains too thin to underwrite
              implementation risk from marketing claims alone. A technical review should prioritize reproducible proof
              over additional positioning material.
            claimRefs:
              - CE004
              - CE008
              - CE009
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Clear commercialization wedge
            body: >-
              LAYR's Virtual Battery and multi-optimizer workflow gives Terralayr a specific route from physical BESS
              capacity to tradable flexibility, rather than merely describing a generic virtual power plant.
            calloutType: strength
            claimRefs:
              - CE002
              - CE006
              - CE007
          - type: callout
            title: Control-plane proof is incomplete
            body: >-
              Public pages describe the workflow but do not disclose the technical controls, service levels, security
              evidence, or asset-level performance data needed to validate safe and reliable dispatch at scale.
            calloutType: risk
            claimRefs:
              - CE005
              - CE009
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              terralayr serves several distinct participants in the German battery-storage value chain rather than one
              homogeneous customer segment. Its own projects supply physical capacity, third-party asset owners
              contribute batteries to the virtual portfolio, utilities and trading desks buy or optimize capacity, and
              municipal utilities can use the platform as an operating and market-access layer. Eurazeo describes
              terralayr as developing, owning, and operating grid-scale systems while providing a route to market for
              its own and third-party assets. The Stadtwerke Duisburg announcement adds a concrete channel use case: a
              plug-and-play platform for a portfolio that may exceed 100 MW, with technical connection, optimization,
              project-development support, and possible co-investment. This is strategically attractive because it lets
              terralayr monetize infrastructure and market access without claiming that every connected asset is a
              retained end customer. Public sources do not disclose customer counts, contract-level revenue, or the
              split between asset owners, offtakers, optimizers, and municipal utilities.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU009
              - CU016
      - number: '6.2'
        title: Named adoption and operating proof
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption evidence is operational, not a customer logo list. Vattenfall's virtual portfolio
              moved into active marketing with an initial 5 MW tranche intended to expand to 55 MW, and both German
              trade publications describe eight geographically distributed batteries being controlled through LAYR. The
              arrangement is a seven-year, fixed-price capacity toll, which is stronger proof than a memorandum or pilot
              announcement because it specifies a term, capacity, and live operating mechanism. Stadtwerke Duisburg is a
              second named relationship, combining energy trading with terralayr's infrastructure and regulation-market
              access for municipal-utility portfolios. terralayr's official insights index also lists a May 2025
              multi-asset capacity tolling deal with RWE, although that index does not establish its production status,
              capacity, or outcome. The customer proof therefore supports live deployment and partner diversity, but not
              broad penetration, repeat purchasing, or independently measured customer outcomes.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
