  topStrengths:
    - Institutional financing and named utility relationships support capital access and commercial credibility.
    - LAYR links physical BESS ownership and operation with a differentiated virtualized flexibility model.
    - Operating, under-construction, and secured development scale provides a material platform for execution.
  topRisks:
    - Grid-connection scarcity and changing German storage regulation can delay projects or compress returns.
    - Revenue, margin, utilization, liquidity, leverage, and valuation are not publicly disclosed.
    - Converting a large development pipeline into operating assets carries substantial financing and execution risk.
  unresolvedGaps:
    - The January 2026 round's post-money valuation, cap table, and liquidation or preference terms are not public.
    - >-
      Terralayr has not publicly disclosed revenue, gross margin, tolled-versus-merchant mix, or asset-level
      utilization.
    - No single public source reconciles lifetime capital raised across equity, debt, and project-level facilities.
    - >-
      Governance transparency remains incomplete because board composition, rights, and investor-control terms are only
      partially disclosed.
