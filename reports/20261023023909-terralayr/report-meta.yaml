  foundingLocation: Zug, Switzerland
  headquarters: Zug, Switzerland / Germany
  productSummary: >-
    Terralayr develops, owns, and operates grid-scale battery energy storage systems and uses the LAYR platform to
    aggregate, virtualize, dispatch, and commercialize flexible capacity.
  customerFocus: >-
    Utilities, power traders, battery owners, asset managers, and industrial or municipal counterparties seeking
    dispatchable storage flexibility.
  businessModel: >-
    Hybrid infrastructure ownership and development plus performance-linked optimization, tolling, flexibility auctions,
    and platform services.
