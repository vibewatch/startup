companyProfile:
  summary: >-
    Terralayr is a Swiss-registered, Germany-focused battery-storage developer, owner-operator, and flexibility
    platform. Its LAYR software virtualizes owned and third-party battery capacity for utilities, traders, asset owners,
    and other offtakers, while the company combines project development, operation, tolling, and merchant optimization.
    Public evidence shows institutional financing, named utility relationships, and meaningful operating and development
    scale, but does not disclose the financial and governance detail needed to underwrite equity value.
