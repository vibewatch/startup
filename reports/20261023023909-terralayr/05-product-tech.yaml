  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow, Terralayr solution, Measurable benefit, Limitation]
    rows:
      - ["Monetize owned BESS capacity", "Contract or select a route to market", "LAYR virtualizes the asset and offers tailored tolling or merchant combinations", "Better control and risk management are company-positioned benefits", "No public realized revenue, utilization, or counterfactual benchmark"]
      - ["Trade flexible power when needed", "Source dispatchable capacity without owning the battery", "Reserve capacity in MW slices through Virtual Battery Auctions and use an API", "Capital and operational access without physical ownership", "No public API specification, latency, or fulfillment rate"]
      - ["Manage multiple optimizers", "Allocate capacity among trading strategies", "Enhanced Trading of Flexibility permits parallel optimizer access and reallocation", "Diversification of merchant performance risk is the stated benefit", "No independently verified optimizer comparison or command-conflict evidence"]
      - ["Operate ancillary services", "Qualify and dispatch assets into FCR and aFRR", "LAYR includes pre-qualification, dispatch control, reporting, and market communication duties", "A single operating surface is the claimed benefit", "Public evidence does not show qualification records or performance by asset"]
      - ["Maintain visibility during volatility", "Monitor physical and commercial performance", "Dashboards, controlling tools, real-time visualization, and automated redundancy are described", "Better transparency and supply stability are claimed", "No public SLA, incident register, or recovery-time evidence"]
    notes: The solution and benefit columns preserve company-described functionality; measurable outcomes are marked as unavailable where no public denominator or independent test was found.
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE007, CE009, CE010]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk or diligence question]
    rows:
      - ["Physical BESS assets", "Store and dispatch electrical energy", "Battery suppliers, landowners, grid connection, and safety approvals", "Verify asset ownership, chemistry, warranty, degradation, fire safety, and commissioning"]
      - ["Telemetry and dispatch control", "Translate market instructions into battery actions", "Asset controls, communications, and market interfaces", "Verify protocols, latency, fail-safe behavior, command arbitration, and manual override"]
      - ["Virtual Battery digital twin", "Represent sliced or aggregated capacity to an offtaker", "Accurate telemetry and availability model", "Verify state-of-charge treatment, aggregation logic, data lineage, and settlement reconciliation"]
      - ["Optimizer and allocation layer", "Permit multiple optimizers to trade the same battery", "Market access and allocation rules", "Verify conflict resolution, priority logic, performance attribution, and switching controls"]
      - ["API, dashboards, and reporting", "Expose capacity and operational state to users", "Authentication, uptime, and data-quality controls", "Verify API schema, authentication model, audit logs, privacy, and customer-level SLA"]
      - ["Market and regulatory interface", "Qualify assets and communicate with power markets", "ENTSO-E and national network codes, grid-connection regime, FCR and aFRR rules", "Verify approvals, market roles, cybersecurity, and change management"]
    notes: This is a disclosed operating-model map, not a claim that each layer is proprietary or independently audited. External sources identify system dependencies and sector risks; company sources describe the intended workflow.
    claimRefs: [CE003, CE004, CE006, CE007, CE011, CE012, CE013, CE014, CE015, CE016]
figures:
  - id: FE001
    title: LAYR product architecture map
    type: stack
    summary: LAYR links physical BESS assets to virtualized capacity, market allocation, and user-facing flexibility services.
    data:
      layers:
        - label: User and market outputs
          detail: Customer-facing access to flexible capacity and operational services
          items:
            - label: Power traders
              detail: Access flexible capacity through Virtual Battery Auctions and API
            - label: Asset owners
              detail: Receive route-to-market and optimizer allocation options
            - label: Utilities and grid counterparties
              detail: Buy or use flexibility products
        - label: Commercialization layer
          detail: Contracting and allocation mechanisms for BESS flexibility
          items:
            - label: Virtual Battery Auctions
              detail: MW slices rented for a day, week, or longer period
            - label: Tolling and merchant combinations
              detail: Flexible offtake structures for capacity
            - label: Enhanced Trading of Flexibility
              detail: Multiple optimizers trade the same battery in parallel
        - label: Digital control layer
          detail: Software and operational services that represent and dispatch capacity
          items:
            - label: Virtual Battery
              detail: Digital twin created by slicing or aggregating physical capacity
            - label: API and dashboards
              detail: Access, visualization, reporting, and controlling tools
            - label: Dispatch and market communication
              detail: Control, ancillary-service pre-qualification, and reporting duties
        - label: Physical and external dependencies
          detail: Physical assets and external rules required for delivery
          items:
            - label: Utility-scale BESS
              detail: Terralayr-developed, owned, or operated battery assets
            - label: Grid connection and battery suppliers
              detail: Physical access, equipment quality, and safety constraints
            - label: Market and network rules
              detail: FCR, aFRR, ENTSO-E, and national connection requirements
        - label: Security and quality controls
          detail: Controls required to protect data, dispatch, and battery operations
          items:
            - label: Authentication and audit logging
              detail: Public implementation evidence not disclosed
        - label: Support and assurance
          detail: Customer support, incident response, and independent assurance
          items:
            - label: SLA and incident reporting
              detail: Public customer-level records not disclosed
    approximationNotes: The stack is an authored synthesis of described modules and dependencies; it does not assert a proprietary software implementation or a universal experience-to-governance direction.
    claimRefs: [CE001, CE002, CE003, CE006, CE007, CE011, CE012]
