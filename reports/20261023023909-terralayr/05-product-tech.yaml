company:
  name: terralayr
chapter:
  number: 5
  title: Product & Technology
  summary: Terralayr combines ownership and operation of utility-scale BESS assets with LAYR, a software platform that virtualizes and commercializes flexible capacity. The product surface is specific and commercially plausible, but public evidence does not establish the underlying control stack, cyber controls, asset-level reliability, or independently verified performance.
sections:
  - id: product-surface
    title: Product surface and buyer workflow
    body: >-
      Terralayr presents two linked products rather than a software-only proposition. It develops, owns, and operates utility-scale battery energy storage systems, while LAYR provides the commercial and operational layer for asset owners, utilities, power traders, and asset managers. The buyer workflow is explicit: asset owners provide physical capacity, LAYR translates it into a Virtual Battery, and offtakers reserve slices through Virtual Battery Auctions or access them through an API. This is a more concrete workflow than generic flexibility marketing because the source describes dispatch control, ancillary-service pre-qualification, reporting, market communication, dashboards, and allocation between optimizers. The public material does not disclose API documentation, supported protocols, latency, SLA terms, or the boundary between Terralayr-operated assets and third-party assets. Those omissions matter because the commercial promise depends on reliable dispatch and accurate settlement across heterogeneous batteries.
    claimRefs: [CE001, CE002, CE003, CE004, CE005]
    tableRefs: [TE001, TE002]
    figureRefs: [FE001]
  - id: operating-architecture
    title: Operating architecture and maturity
    body: >-
      The disclosed operating model is a physical-to-digital control loop: BESS assets are connected and dispatched, capacity is virtualized into digital twins, and multiple optimizers can trade the same underlying battery in parallel. Terralayr calls this Enhanced Trading of Flexibility and says the model allows capacity to move between optimizers without lock-in or switching cost. TechCrunch independently described the proposition as aggregating, bundling, and virtualizing grid-scale storage and selling capacity over periods from 15 minutes to 15 years, while also reporting that Terralayr does not itself trade. These descriptions support the existence of a differentiated commercialization model, not a verified software architecture. Public status data showed the production API, physical-assets API, virtual-assets API, authentication, sandbox services, and web applications operational on 2026-10-23, but uptime history is not a substitute for incident response, resilience testing, or customer-level availability guarantees.
    claimRefs: [CE006, CE007, CE008, CE009, CE010]
  - id: differentiation-and-risk
    title: Differentiation, dependencies, and technical risk
    body: >-
      The strongest differentiation is orchestration and market access: LAYR combines virtualized capacity, flexible slicing, multiple optimizers, and offtake structures in one operating surface. The model remains dependent on grid connection, battery quality, market and network rules, and the economics of tolling or merchant exposure. RÖDL reports almost 10,000 German medium-voltage connection requests in 2024, with approximately 3,800 approved, and identifies grid-connection queues, unclear market roles, stricter safety and insurability requirements, cell imbalance, and falling revenue potential as project challenges. ENTSO-E describes network codes as rules intended to harmonize and integrate the European electricity market, including work on cybersecurity and demand-side flexibility. These sources identify external dependencies; they do not prove Terralayr has failed any control or safety test. The remaining diligence priority is therefore verification: asset commissioning records, dispatch and settlement logs, cyber and privacy controls, battery warranties, degradation assumptions, incident history, and evidence that the multi-optimizer model performs without conflicting commands or unacceptable availability loss.
    claimRefs: [CE011, CE012, CE013, CE014, CE015, CE016]
    tableRefs: [TE003]
  - id: maturity-verdict
    title: Product maturity verdict
    body: >-
      Public evidence supports a live product surface with named user roles, a stated API-mediated workflow, production and sandbox endpoints, and an operating model that has attracted a named utility counterparty. It does not support a high-confidence conclusion that Terralayr's technology is proprietary, that its integrations are broad, or that its reliability, security, safety, and quality controls are independently validated. The appropriate product judgment is therefore conditional: the architecture is commercially differentiated enough to merit technical diligence, but the public record remains too thin to underwrite implementation risk from marketing claims alone. A technical review should prioritize reproducible proof over additional positioning material.
    claimRefs: [CE004, CE008, CE009, CE015, CE016]
callouts:
  - calloutType: strength
    title: Clear commercialization wedge
    body: >-
      LAYR's Virtual Battery and multi-optimizer workflow gives Terralayr a specific route from physical BESS capacity to tradable flexibility, rather than merely describing a generic virtual power plant.
    claimRefs: [CE002, CE006, CE007]
  - calloutType: risk
    title: Control-plane proof is incomplete
    body: >-
      Public pages describe the workflow but do not disclose the technical controls, service levels, security evidence, or asset-level performance data needed to validate safe and reliable dispatch at scale.
    claimRefs: [CE005, CE009, CE016]
