  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: reliability
      missingEvidence: Independent service-level, dispatch-latency, outage, recovery, and settlement-performance records for LAYR and connected assets.
      whyItMatters: The product promise depends on safe and accurate control of flexible capacity, but public uptime indicators do not show customer-level performance or market delivery.
      diligencePath: Request redacted production SLA reports, incident register, recovery tests, dispatch logs, and settlement reconciliations for representative assets.
      relatedQuestionRefs: [QE004, QE007, QE009]
    - type: private-evidence-only
      severity: material
      topic: security
      missingEvidence: Architecture diagrams, penetration-test summaries, security certifications, access-control design, audit logs, and privacy controls.
      whyItMatters: LAYR exposes physical assets and market interfaces, so a cyber or data-control failure could impair dispatch and commercial settlement.
      diligencePath: Request the current security pack, third-party assurance reports, vulnerability-management policy, incident-notification terms, and customer data-processing terms.
      relatedQuestionRefs: [QE007, QE010]
    - type: missing-source
      severity: material
      topic: product-maturity
      missingEvidence: Independent documentation of asset-level integrations, commissioning, optimizer performance, and the boundary between owned and third-party capacity.
      whyItMatters: The public architecture is credible as a description but cannot establish production scale, integration breadth, or proprietary advantage.
      diligencePath: Obtain an asset and integration register, anonymized customer references, qualification records, and comparative optimizer-performance data.
      relatedQuestionRefs: [QE002, QE004, QE008]
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: A public developer or practitioner signal such as API documentation, repository activity, package usage, engineering talks, or integration-community evidence.
      whyItMatters: Public developer evidence would help distinguish a deployable platform from a commercially described operating model.
      diligencePath: Request sandbox/API documentation and inspect authenticated developer materials or practitioner references during technical diligence.
      relatedQuestionRefs: [QE004, QE008]
