      - [Grid or system user, Grid operators and major energy users, "Procure flexible capacity and stability services", "Eurazeo describes these as supported customer groups", "No public procurement volumes or service-level metrics"]
    notes: "Segments synthesize the assigned evidence; scale values are source-described capacity signals, not customer counts or revenue. Null-like gaps indicate metrics not disclosed in the prefetched sources."
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU009, CU016]
