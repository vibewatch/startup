    title: Customer journey from asset onboarding to expansion
    type: journey-map
    summary: LAYR's disclosed customer path runs from distributed asset integration to structured offtake and larger portfolio commercialization.
    data:
      items:
        - label: Asset owner
          title: Asset owner
          touchpoints: ["Owns or develops a BESS", "Needs bankable route to market"]
        - label: Technical onboarding
          title: Technical onboarding
          touchpoints: ["LAYR links to the energy-management system", "Assets are aggregated and virtualized"]
        - label: Portfolio formation
          title: Portfolio formation
          touchpoints: ["Distributed batteries form a virtual portfolio", "Capacity can be sliced across users"]
        - label: Offtake design
          title: Offtake design
          touchpoints: ["Fixed-price tolling or merchant allocation", "Terms can range from 15 minutes to 15 years"]
        - label: Live dispatch
          title: Live dispatch
          touchpoints: ["Trading signals are executed in real time", "Optimizer or offtaker controls the commercial strategy"]
        - label: Expansion
          title: Expansion
          touchpoints: ["Vattenfall path from 5 MW to 55 MW", "Additional municipal-utility portfolios may exceed 100 MW"]
    approximationNotes: "The stages show the disclosed operating sequence; they do not imply conversion rates, customer counts, or value-proportional scale."
    claimRefs: [CU001, CU002, CU008, CU016, CU017, CU018]
callouts:
  - calloutType: strength
    title: Contracted operating proof
    body: The Vattenfall relationship is a named, seven-year capacity toll with an initial 5 MW tranche, a 55 MW target, and eight distributed batteries controlled through LAYR.
    claimRefs: [CU005, CU006, CU007]
  - calloutType: risk
    title: Retention remains unproven
    body: No assigned source discloses customer count, churn, renewal, NRR, utilization, customer-level revenue, or realized outcomes, so expansion signals cannot be converted into retention.
    claimRefs: [CU012, CU013]
  - calloutType: recommendation
    title: Request contract-level cohort evidence
    body: Obtain a customer and asset schedule with signed capacity, live status, term, renewal, revenue share, utilization, outages, and termination rights by counterparty.
    claimRefs: [CU012, CU013, CU018]
