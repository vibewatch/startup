    title: Customer growth and adoption trajectory
    columns: [Metric or event, Value, Date or period, Source, Confidence, Implication, Missing denominator]
    rows:
      - [Vattenfall initial marketed tranche, "5 MW", "2026 launch", "PV Magazine / Solarserver", medium, "Production commercialization began with a defined capacity slice", "No realized revenue or utilization"]
      - [Vattenfall target capacity, "55 MW", "Seven-year tolling term", "PV Magazine / Solarserver", medium, "Existing relationship has an explicit expansion path", "No delivered expansion schedule or renewal terms"]
      - [Vattenfall distributed assets, "8 batteries", "At go-live", "PV Magazine / Solarserver", medium, "LAYR is operating as a multi-asset virtual portfolio", "No availability, dispatch, or SLA history"]
      - [Stadtwerke Duisburg prospective portfolio, ">100 MW", "Partnership announcement", "Unternehmerverband", medium, "Channel relationship could support municipal-utility scale", "Prospective rather than verified live capacity"]
      - [German BESS route-to-market horizon, "15 minutes to 15 years", "As described in interview", "Energy Storage News", medium, "Product can serve different offtake durations", "No mix by term, customer, or revenue"]
    notes: "Values are preserved with their source periods and qualifiers. Contracted capacity, prospective portfolio scale, and product-term range are distinct measures; none is a customer count or retention metric."
    claimRefs: [CU005, CU006, CU007, CU009, CU016]
  - id: TU003
    title: Named customer proof table
    enumerationScope:
      coverage: partial
      basis: "Named counterparties and customer-facing deployment evidence available in prefetched sources through 2026-10-23"
    columns: [Customer or counterparty, Segment, Deployment or use case, Production vs pilot, Outcome or proof, Limitation]
    rows:
      - [Vattenfall, Utility offtaker, "Virtual share of eight distributed batteries through LAYR", production, "Active marketing launched at 5 MW with expansion to 55 MW", "Capacity expansion and economics beyond stated terms are unverified"]
      - [Stadtwerke Duisburg Energiehandel, Municipal utility / trader, "BESS optimization, technical integration, project development, and market access", partnership / operating use described, "Platform intended as plug-and-play infrastructure for a >100 MW prospective portfolio", "The source describes a prospective portfolio, not audited live deployment"]
      - [RWE, Utility / offtaker, "Multi-asset capacity tolling relationship", contract announced; operating status not established, "terralayr's official insights index lists the deal dated 28 May 2025", "The index provides no capacity, production status, or measured outcome"]
    notes: "Coverage is partial: the retained sources identify three named counterparties, but only Vattenfall has quantified live virtual-portfolio evidence; the sources do not provide a complete customer register."
    claimRefs: [CU005, CU006, CU007, CU009, CU010, CU013]
figures:
