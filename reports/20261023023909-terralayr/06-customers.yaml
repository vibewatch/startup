company:
  name: terralayr
chapter:
  number: 6
  title: Customers
  summary: "terralayr has moved beyond a logo-only story: public evidence shows live, named utility relationships and a virtual battery portfolio being marketed in production. The customer model is still early and infrastructure-led, with public proof concentrated in counterparties and contracted capacity rather than disclosed customer counts, retention, or revenue."
sections:
  - id: customer-model
    title: Buyer, user, and payer segmentation
    body: >-
      terralayr serves several distinct participants in the German battery-storage
      value chain rather than one homogeneous customer segment. Its own projects
      supply physical capacity, third-party asset owners contribute batteries to the
      virtual portfolio, utilities and trading desks buy or optimize capacity, and
      municipal utilities can use the platform as an operating and market-access
      layer. Eurazeo describes terralayr as developing, owning, and operating
      grid-scale systems while providing a route to market for its own and
      third-party assets. The Stadtwerke Duisburg announcement adds a concrete
      channel use case: a plug-and-play platform for a portfolio that may exceed
      100 MW, with technical connection, optimization, project-development support,
      and possible co-investment. This is strategically attractive because it lets
      terralayr monetize infrastructure and market access without claiming that
      every connected asset is a retained end customer. Public sources do not
      disclose customer counts, contract-level revenue, or the split between asset
      owners, offtakers, optimizers, and municipal utilities.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Named adoption and operating proof
    body: >-
      The strongest adoption evidence is operational, not a customer logo list.
      Vattenfall's virtual portfolio moved into active marketing with an initial
      5 MW tranche intended to expand to 55 MW, and both German trade publications
      describe eight geographically distributed batteries being controlled through
      LAYR. The arrangement is a seven-year, fixed-price capacity toll, which is
      stronger proof than a memorandum or pilot announcement because it specifies
      a term, capacity, and live operating mechanism. Stadtwerke Duisburg is a
      second named relationship, combining energy trading with terralayr's
      infrastructure and regulation-market access for municipal-utility portfolios.
      terralayr's official insights index also lists a May 2025 multi-asset capacity
      tolling deal with RWE, although that index does not establish its production
      status, capacity, or outcome. The customer proof therefore supports live
      deployment and partner diversity, but not broad penetration, repeat
      purchasing, or independently measured customer outcomes.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU010]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: durability-and-concentration
    title: Durability, expansion, and concentration risk
    body: >-
      Public evidence supports contractual durability in selected relationships,
      but not retention metrics. The Vattenfall structure has a seven-year term
      and a stated path from 5 MW to 55 MW, while the customer-facing operating
      surface lists a later 55 MW live portfolio and a separate Stadtwerke Duisburg
      relationship. Those facts suggest expansion can occur inside an existing
      counterparty relationship, yet they do not establish net revenue retention,
      renewal probability, utilization, or gross margin. The customer base also
      appears concentrated by disclosed proof: Vattenfall is the only counterparty
      with a quantified live virtual portfolio in the current sources, and
      Stadtwerke Duisburg's prospective portfolio is described at more than 100 MW.
      Modo Energy's market analysis explains why customers may prefer structured
      tolling or partial tolling as German ancillary markets saturate, but it is
      market evidence rather than terralayr-specific retention proof. The material
      diligence ask is a cohort and contract schedule showing counterparty,
      capacity, term, renewal, revenue share, utilization, and termination rights.
    claimRefs: [CU011, CU012, CU013, CU018]
    tableRefs: [TU003]
