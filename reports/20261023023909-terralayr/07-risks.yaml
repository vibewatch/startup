schemaVersion: "report-v2"
artifact: risks
slug: terralayr
runDate: 2026-10-23
company:
  name: terralayr
chapter:
  number: 7
  title: Risks
  summary: >-
    Terralayr's highest-evidence risks are grid-connection scarcity, changing network
    economics, and the execution burden of converting a large development pipeline into
    operating assets. Contracted tolling structures and substantial equity backing mitigate
    parts of that exposure, but public evidence does not establish liquidity runway,
    supplier concentration, company-specific cyber controls, or incident history.
sections:
  - id: ranked-risk-view
    title: Ranked investment risk view
    body: >-
      The leading residual risk is execution against scarce grid capacity rather than a
      demonstrated company-specific legal breach. Independent legal analysis reports roughly
      211 GW of transmission-level BESS connection requests at Q3 2025 and more than 400 GW
      across all network levels, while a March 2026 regulator decision allowed a connection
      refusal on technical capacity grounds and confirmed that storage does not receive
      KraftNAV treatment. Terralayr's company-reported portfolio of more than 150 MW operating
      or under construction, nearly 200 MW ready to build, and an 8 GW secured pipeline
      therefore spans very different stages of certainty. Historical management commentary
      that not every contracted development site would proceed reinforces the conversion
      risk. The investment implication is to underwrite operating and contracted megawatts
      separately from pipeline megawatts, with grid reservations, permits, deposits, and
      commissioning evidence as stage gates rather than treating headline capacity as one
      homogeneous asset base.
    claimRefs: [CR001, CR002, CR003, CR011, CR014, CR015]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: regulatory-and-legal
    title: Regulatory and legal exposure
    body: >-
      German rules create both permissioning upside and economic uncertainty. Current law
      generally provides a 20-year network-tariff exemption for BESS commissioned by
      4 August 2029, but the regulator has signalled a future general tariff framework and
      White & Case considers early deviation from the exemption plausible. Proposed
      connection allocation also adds material maturity tests, a EUR 50,000 application fee,
      and a EUR 1,500 per MW realisation deposit; these proposals were not yet enacted in the
      reviewed source and should not be modelled as settled law. Separately, the 2026 German
      critical-facilities regime covers the energy sector and can impose registration,
      resilience, management, and incident-reporting duties when thresholds are met. Public
      evidence does not establish whether any Terralayr facility currently qualifies.
      Diligence should obtain a site-by-site legal memo covering connection regime, tariff
      assumptions, permitting status, KRITIS/NIS2 scope, and the owner of each compliance
      obligation.
    claimRefs: [CR001, CR003, CR004, CR005, CR006, CR007, CR016]
    tableRefs: [TR001]
  - id: operating-and-dependency
    title: Operating, partner, and financial dependencies
    body: >-
      The RWE agreement provides evidence of a real commercial mitigation: from 2026, RWE is
      to optimise 50 MW / 100 MWh for five years, with Terralayr receiving fixed annual
      remuneration under a multi-asset tolling structure. RWE also says distributing service
      across several systems can improve performance, extend service life, and reduce
      operational risk. Those benefits do not remove counterparty, integration, warranty, or
      availability exposure; the reviewed terms do not disclose pricing, service-level
      remedies, termination rights, or concentration. Capital availability is another partial
      mitigant, not proof of runway: the company announced EUR 192 million of equity including
      an EUR 80 million upsizing option, and independent reporting describes an earlier mix
      of EUR 62 million equity and EUR 15 million debt. Neither amount establishes unrestricted
      cash, project-level leverage, cash burn, or remaining capital needs. Investment
      underwriting should reconcile corporate cash and committed equity with project debt,
      construction draws, collateral, and contracted revenue.
    claimRefs: [CR008, CR009, CR010, CR012, CR013, CR016]
    tableRefs: [TR003]
  - id: monitoring-and-kill-criteria
    title: Monitoring indicators and thesis-break triggers
    body: >-
      Monitoring should focus on evidence that changes residual risk, not announcement volume.
      For each project, track connection reservation, permit maturity, construction notice to
      proceed, battery and inverter delivery, energisation, availability, degradation, and
      liquidated-damages coverage. At portfolio level, track operating MW, contracted tolling
      MW, merchant exposure, counterparty concentration, covenant headroom, unrestricted cash,
      and capital still required to commission the ready-to-build fleet. A thesis break would
      occur if material projects lose grid access, tariff reform renders contracted returns
      uneconomic, a critical cyber or safety event exposes inadequate controls, or financing
      becomes conditional on unsupported pipeline valuations. The present source set cannot
      quantify those thresholds because it lacks asset-level economics, supplier schedules,
      incident records, certifications, and concentration data. These are material diligence
      gaps, not evidence that incidents or concentration are absent.
    claimRefs: [CR002, CR004, CR007, CR011, CR012, CR016]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Rule or issue, Jurisdiction, Current evidence, Likelihood, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - [Grid connection treatment, Germany, "March 2026 BNetzA decision excluded BESS from KraftNAV and upheld a technically grounded refusal", High, High, "Secure binding reservations; prioritise mature projects; assess flexible connection terms", "Network constraints can delay or strand otherwise permitted projects", "Obtain every connection offer, study, deposit, queue rank, and withdrawal right"]
      - [Network tariff reform, Germany, "Current 20-year exemption for qualifying commissioning dates faces an indicated future tariff redesign", Medium, High, "Stress-test tariffs and construction-cost subsidies in each project model", "Timing and final tariff design remain unsettled", "Reconcile model assumptions to current BNetzA proceedings and legal advice"]
      - [KRITIS and NIS2 scope, "Germany / EU", "Energy is covered, but company-specific qualification and thresholds are not public", Medium, High, "Document scope assessments, registrations, resilience plan, and 24/7 contact", "Facility designation and implementing thresholds may expand obligations", "Request counsel memo and regulator correspondence for every operating site and platform entity"]
      - [Cybersecurity requirements, Germany, "BNetzA has updated draft requirements for networks and energy plants around ISMS, audits, certification, and continuity", Medium, High, "Map platform and plant controls to applicable catalogues and ISO/IEC 27001", "No public company-specific certification or incident evidence was found in the assigned pool", "Review certifications, penetration tests, incident log, recovery tests, and supplier access controls"]
    notes: >-
      Partial legal-risk enumeration from German regulator and legal commentary reviewed through
      2026-10-23; likelihood and severity are analytical ratings, proposals are not treated as enacted,
      and null company-specific scope evidence is recorded as a gap.
    enumerationScope:
      coverage: partial
      basis: >-
        Material German grid, tariff, critical-infrastructure, and cyber rules identified in the
        assigned source pool; it is not an exhaustive legal opinion or permit review.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR007, CR016]
  - id: TR002
    title: Operational, quality, and security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Evidence, Residual exposure, Unresolved gap]
    rows:
      - [Grid connection delay or refusal, High, High, Developing, "Connection demand greatly exceeds current network assumptions; refusal precedent exists", "Pipeline value depends on site-specific capacity and maturity", "Binding status and queue rank for each project"]
      - [Pipeline conversion shortfall, High, High, Developing, "Company reports 8 GW secured pipeline versus a much smaller operating and construction base", "Land, permits, grid, financing, and equipment must converge", "Stage-by-stage probability, cancellation history, and capital required"]
      - [Multi-asset availability failure, Medium, High, "Contracted / unverified", "RWE describes diversification across systems as an operating-risk mitigant", "Platform integration can create common-mode and dispatch dependencies", "Availability history, SLA remedies, degradation, and warranty coverage"]
      - [Cyber or continuity event, Medium, High, Unverified, "Regulatory requirements emphasize continuous risk analysis, audit, certification, and continuity", "No company-specific control testing or incident record is public in the assigned pool", "Certifications, architecture review, recovery objectives, tests, and incident register"]
    notes: >-
      Ratings are evidence-based analytical judgments, not observed incident frequencies; public-source
      silence is not treated as proof that no incident, defect, or common-mode failure has occurred.
    claimRefs: [CR001, CR002, CR007, CR010, CR011, CR014, CR015, CR016]
  - id: TR003
    title: Partner and dependency risk register
    columns: [Dependency, Counterparty or input, Role, Concentration evidence, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Tolling revenue, RWE, "Optimises 50 MW / 100 MWh for five years from 2026", "Portfolio share and pricing not disclosed", "Termination, underperformance, or counterparty repricing reduces fixed-revenue support", High, "Five-year structure and fixed annual remuneration", "Economics, remedies, and customer concentration remain undisclosed"]
      - [Grid access, "Network operators / TSOs", "Allocate connection capacity and define technical conditions", "Site-level distribution not disclosed", "Connection refusal, delay, or higher deposit strands development spend", High, "Maturity-based project selection and binding reservations", "Scarcity remains external to Terralayr's control"]
      - [Equipment and EPC, "Battery, inverter, integrator, and construction suppliers", "Deliver and warrant operating assets", "Supplier names and shares not disclosed", "Delay, defect, warranty failure, or common technology issue disrupts commissioning", High, "Multi-asset diversification may reduce single-site operating exposure", "No supplier schedule, warranty matrix, or alternate-source evidence"]
      - [Capital, "Equity investors, lenders, and project-finance providers", "Fund development, construction, collateral, and platform scale", "EUR 192m announced equity and earlier equity/debt mix; unrestricted liquidity unknown", "Cost escalation or slower commissioning creates a funding gap", High, "Large announced equity round and institutional investor base", "Cash availability, debt terms, burn, and remaining project capex are not public"]
    notes: >-
      Concentration is marked undisclosed where the assigned sources provide no denominator; announced
      funding is not treated as cash available, and fixed remuneration is not treated as disclosed revenue.
    claimRefs: [CR003, CR008, CR009, CR010, CR012, CR013, CR016]
