    claimRefs: [CR001, CR002, CR004, CR007, CR008, CR011, CR012, CR016]
callouts:
  - calloutType: risk
    title: Pipeline megawatts are not operating megawatts
    body: >-
      Value the 8 GW company-reported pipeline only after project-level evidence clears land,
      permitting, connection, financing, equipment, and commissioning gates.
    claimRefs: [CR011, CR014, CR015]
  - calloutType: recommendation
    title: Kill criteria for the next diligence round
    body: >-
      Stop or reprice if binding connection evidence fails, tariff stress breaks project returns,
      unrestricted liquidity does not cover committed obligations, or cyber and supplier controls
      remain untestable for operating assets.
    claimRefs: [CR001, CR004, CR007, CR012, CR016]
