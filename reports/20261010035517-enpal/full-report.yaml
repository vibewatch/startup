            body: >-
              Enpal delivers its residential clean energy systems through a vertically coordinated, end-to-end
              installation model spanning digital pre-qualification, on-site structural assessments, certified regional
              installation, and post-commissioning maintenance. Following remote roof analysis and technician site
              checks, typical installation lead times from contract execution to live operation average four weeks for
              heat pump replacements and six weeks for rooftop photovoltaic systems. However, operational scaling has
              exposed friction in post-sales service delivery and customer communication. In April 2026, Enpal executed
              a major operational restructuring, eliminating its centralized 97-person photovoltaic customer service
              division without advance notice and shifting toward a decentralized service model. The company staffed
              over 100 dedicated construction and customer advisors designed to provide a single point of contact for
