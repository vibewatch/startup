      - number: '5.2'
        title: Enpal.One+ IoT Energy Management Architecture & Virtual Power Plant Capabilities
        blocks:
          - type: paragraph
            body: >-
              At the center of Enpal's product technology architecture is Enpal.One and its upgraded Enpal.One+
              residential energy management gateway. The system functions as an edge IoT controller connected to solar
              inverters, storage batteries, EV chargers, and heat pumps, continuously monitoring generation, home load
              demand, and grid price signals. Through automated optimization algorithms, Enpal.One orchestrates when to
              consume generated electricity locally, when to store surplus in the residential battery, and when to feed
              power back into the public grid. Enpal markets this capability as a pathway to reduce household
              electricity costs by up to 75 percent, while generating up to 2,000 euros annually through dynamic power
              feed-in remuneration. At aggregate scale, these connected distributed energy resources form a virtual
              power plant capable of offering grid-stabilization and flexibility services to transmission system
              operators during periods of fluctuating renewable generation and dynamic spot market pricing.
