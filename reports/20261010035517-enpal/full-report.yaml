      - number: '6.2'
        title: Adoption Trajectory and Cumulative System Deployments
        blocks:
          - type: paragraph
            body: >-
              From an initial cohort of just 30 installations during its founding year in 2017, Enpal expanded its
              customer footprint to over 10,000 residential lease customers by 2021, and subsequently surpassed 65,000
              photovoltaic installations by 2023. By 2026, the company reported an installed base exceeding 140,000
              households across Germany, establishing leading market share in the domestic residential rooftop solar
              sector. Adoption has broadened from basic photovoltaic arrays to multi-asset electrification bundles, with
              tens of thousands of battery storage units and more than 4,000 heat pump systems deployed. This rapid
              trajectory has been reinforced by national decarbonization policies and elevated retail grid power
              tariffs, though overall volume growth continues to be gated by regional distribution grid operator
              processing capacities.
            claimRefs:
              - CU002
              - CU005
