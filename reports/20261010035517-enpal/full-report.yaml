      - number: '5.4'
        title: Clean-Core ERP Modernization, Analytics Infrastructure & Quality Controls
        blocks:
          - type: paragraph
            body: >-
              To support high-velocity field fulfillment and structured asset-backed financing across more than 30
              operating legal entities, Enpal is undergoing an extensive enterprise systems modernization. The
              engineering organization is transitioning its legacy Microsoft Dynamics 365 Finance and Operations
              deployment into a clean-core ERP architecture supplemented by an AI-native execution layer organized
              around end-to-end process domains like lead-to-order and procure-to-pay. Core enterprise integrations
              connect Dynamics 365 with Salesforce CRM, IoT telemetry streams, Azure cloud infrastructure, and financial
              platforms Kyriba and Aryza. Simultaneously, Enpal replaced a fragmented legacy data warehouse with a
              unified DataOps stack built on Snowflake, dbt Cloud, and Fivetran. This migration reduced analytics
              pipeline processing times from 36 hours down to one hour, cut cloud infrastructure expenditure by 70
              percent, and established centralized data models for 30 data engineers supporting over 1,000 internal
              users. Developer-facing activity includes open-source tooling on GitHub for agentic coding bootstrapping
              and specification-driven development frameworks.
