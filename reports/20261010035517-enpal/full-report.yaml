  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Integrated Residential Electrification Portfolio & Hardware Integration
        blocks:
          - type: paragraph
            body: >-
              Enpal operates a standardized residential decarbonization platform combining rooftop photovoltaic
              hardware, battery storage, electric vehicle wallboxes, smart meters, and residential heat pumps. The core
              solar offering is anchored on high-efficiency 460-watt all-black monocrystalline photovoltaic modules
              paired with hybrid inverters and modular residential battery units. Homeowners can acquire systems via
              upfront direct purchase (typically ranging from 18,000 to 26,000 euros for a standard 10 kWp system) or
              through a long-term subscription-based rental package starting at 98 euros per month with zero upfront
              capital outlay. By packaging hardware with maintenance, insurance, and certified regional technician
              installation, Enpal lowers technical adoption friction for single-family homeowners across Germany and
              Italy. Additionally, Enpal incorporates intelligent smart meters that bypass default active power feed-in
              limitations, allowing homeowners to export surplus solar energy directly onto the wholesale electricity
              market without standard curtailment caps.
            claimRefs:
