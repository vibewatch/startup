      - number: '6.4'
        title: Retention Durability, Cross-Sell Expansion and Grid Bottlenecks
        blocks:
          - type: paragraph
            body: >-
              Customer durability in Enpal's model is anchored in 20-year leasing contracts and real-time smart home
              telemetry through the Enpal.One management platform, which collects continuous data from over 65,000
              connected households via MongoDB Atlas. The platform enables dynamic self-consumption optimization and
              direct power marketing, generating up to €2,000 in annual customer feed-in revenue. However, significant
              structural friction persists: Germany's 800+ local grid distribution operators enforce disparate
              connection rules and non-standardized digital protocols, introducing administrative bottlenecks between
              physical installation and grid feed-in. Furthermore, while Enpal reports strong top-level customer totals,
              audited cohort-level retention, contract default rates, and customer cancellation metrics remain private,
              leaving long-term asset-level credit performance an essential diligence item.
