      - number: '6.3'
        title: Named Customer Proof, Lead Generation and Delivery Operations
        blocks:
          - type: paragraph
            body: >-
              Customer acquisition for complex home energy systems requires substantial educational touchpoints and
              proof of operational reliability. During early expansion phases, Enpal deployed broad native advertorial
              campaigns across open-web publisher networks, achieving a 50% cost-per-acquisition reduction during the
              European energy crisis. In 2026, the company refined its marketing funnel by replacing broadcast media
              with a vetted cohort of approximately 20 creator-customers on Instagram, cutting cost-per-lead in half and
              boosting conversion rates by 23%. On the operational delivery front, Enpal partners with Enterprise
              Mobility to manage its dedicated technician vehicle fleet, achieving over 95% vehicle availability to
              maintain a four-to-six-week installation cadence from contract signing.
            claimRefs:
