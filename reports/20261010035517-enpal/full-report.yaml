      - number: '7.2'
        title: Operational execution, installer safety, and quality control
        blocks:
          - type: paragraph
            body: >-
              Operational execution constitutes a core bottleneck for Enpal as it scales integrated residential bundles
              comprising rooftop photovoltaic modules, battery storage, wallboxes, and heat pumps. Physical installation
              on residential properties entails intrinsic construction hazards, including roof penetration water
              leakage, electrical grid integration instability in older homes, and occupational safety risks for
              mounting crews. Although Enpal operates an internal training academy to standardize craftsmanship and
              conducts regular site quality audits, investigative accounts and employee reviews have alleged intense
              quota pressure, long working hours, and inconsistent adherence to safety standards among regional
              installation teams. International recruitment initiatives attracting electricians from Latin America have
              expanded technical throughput but generated scrutiny over worker dependency structures. Ensuring uniform
              installation safety across decentralized in-house crews and external subcontractors remains crucial to
              preventing warranty liabilities and safeguarding brand equity.
            claimRefs:
