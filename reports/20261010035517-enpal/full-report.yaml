  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Demographics
        blocks:
          - type: paragraph
            body: >-
              Enpal's commercial customer model focuses predominantly on German single-family suburban and rural
              homeowners who face high retail electricity rates and seek energy autonomy. Residential solar packages,
              typically paired with battery storage and smart energy management hardware, represent the core customer
              acquisition engine with capital expenditure commitments ranging from €18,000 to €26,000 or 20-year monthly
              lease arrangements starting at €98. In addition to primary single-family homeowners, Enpal has established
              targeted commercial offerings for small-to-medium enterprises and multi-family landlords seeking tenant
              electricity solutions. The buyer persona is characterized by homeownership, long decision cycles spanning
              roughly one month, and high sensitivity to upfront expenditure, making the zero-upfront financing
              structure Enpal's primary adoption catalyst.
            claimRefs:
              - CU001
              - CU003
              - CU004
          - type: table
