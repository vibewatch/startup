            body: >-
              Enpal operates on an asset-financing engine funded by over €5 billion in cumulative debt commitments
              against roughly €600 million in equity. While this structure enables high-velocity customer acquisition
              with zero upfront fees, it introduces structural vulnerability to interest rate shifts, warehouse
              refinancing conditions, and consumer credit defaults on long-dated 20-year contracts.
