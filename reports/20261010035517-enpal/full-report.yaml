      - number: '7.3'
        title: Supply chain concentration, hardware sourcing, and counterparty dependencies
        blocks:
          - type: paragraph
            body: >-
              Enpal's hardware fulfillment depends heavily on upstream relationships with global hardware manufacturers
              and institutional debt capital providers. The vast majority of its photovoltaic modules originate from
              leading Chinese producers such as LONGi Green Energy, JA Solar, Astronergy, and Trina, exposing Enpal to
              geopolitical tensions, potential European Union trade safeguard investigations, and Xinjiang supply chain
              traceability risks. To mitigate these disruptions, Enpal maintains a 25-person quality assurance hub in
              Shenzhen and initiated procurement diversification through a manufacturing partnership with VSUN Solar in
              Vietnam. In its expanding heat pump segment, Enpal operated with single-source supplier concentration
              during FY24 while onboarding secondary suppliers. On the financing side, Enpal relies on
              multi-billion-euro warehouse credit facilities from syndicates including Barclays, Bank of America, and
              Credit Agricole, requiring continuous covenant compliance to fund customer originations.
