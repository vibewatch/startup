  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory frameworks, labor law compliance, and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Enpal's rapid expansion across Germany has introduced substantial regulatory scrutiny, particularly
              concerning employment law, sales practices, and renewable energy market interventions. Investigative
              reporting by Manager Magazin based on interviews with 21 current and former employees, coupled with
              litigation before the Leipzig Labor Court, brought to light systemic labor non-compliance, including
              failure to pay statutory commission compensation during sick leave and vacation periods. While Enpal has
              defended its practices by citing above-average overall technician compensation and revised its commission
              equalization policies in Berlin after public litigation, labor friction remains an active operational and
              reputational vulnerability. Furthermore, the company's business model is tightly coupled to statutory
              provisions within Germany's Renewable Energy Sources Act (EEG) and Energy Industry Act (EnWG), where
              shifts in grid feed-in remuneration or peak flexibility mandates directly influence consumer adoption
              economics. Complying with the German Supply Chain Act (LkSG) also demands rigorous due diligence over
              upstream manufacturing partners.
            claimRefs:
              - CR001
