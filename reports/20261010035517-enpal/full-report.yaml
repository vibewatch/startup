      - number: '7.4'
        title: Credit portfolio risks, liquidity profile, and residual risk matrix
        blocks:
          - type: paragraph
            body: >-
              From a structural balance sheet perspective, Enpal ring-fences long-term customer credit exposure by
              establishing independent, bankruptcy-remote special purpose vehicles (SPVs) that hold the 20-year solar
              leases and 25-year installment loan assets. This legal segregation protects the operating corporate entity
              from direct consumer default obligations during macroeconomic downturns or localized household
              insolvencies. Interest rate fluctuations are countered by pre-hedging long-term commitments through
              fixed-rate loans and interest rate swaps. In addition, Enpal bolstered its corporate liquidity buffer
              through a 110 million euro Series D funding round in April 2025 led by TPG Rise Climate, maintaining cash
              reserves above 250 million euros. Nevertheless, residual exposure remains elevated in labor compliance,
              international supply chain dynamics, and regulatory tariff adjustments, demanding active mitigation and
              transparent audit validation.
