      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 转向客户倡导营销，压低高客单价获客成本
            body: >-
              销售价值 €20,000 至 €40,000 的住宅家庭电气化系统，需要经历较长的一个月咨询周期，难以依靠冲动购买转化。Enpal 在 2026 年初将营销从广播电视和 YouTube
              活动转向经过筛选的真实客户创作者圈，获客成本下降 50%，说明对于复杂住宅资本开支，真实客户倡导比泛化的认知广告更有效。
