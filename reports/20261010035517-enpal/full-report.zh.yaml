        title: 展示项
        blocks:
          - type: callout
            title: 证券化规模构成结构性壁垒
            body: Enpal 由国际头部银行支持的 €700M ABS 仓储融资提供了成本更低的无追索权债务融资，使其能提供区域工匠安装商无法匹敌的零首付客户方案。
            calloutType: strength
            claimRefs:
