        - 地缘政治冲突、出口禁令或欧盟反倾销关税。
        - 高
        - 深圳 QA 团队；通过越南 VSUN Solar 将采购来源分散 20%。
        - 仍严重依赖亚洲硅材料加工。
      - - 热泵硬件采购
        - 专有 OEM 合作伙伴
        - 单一来源热泵供应商
        - FY24 由单一供应商 100% 供货
        - 供应商交付中断，导致供暖安装暂停。
        - 高
        - 通过 2025 年引入第二家供应商，落实双供应商策略。
        - 在第二家供应商达到供货规模前，短期履约风险仍在。
      - - 资产支持型仓储债务融资
        - Barclays、BofA、Credit Agricole、CPP Investments
        - 仓储融资和定期债务融资
        - 高度依赖债务银团
        - 违反信贷契约，触发债务加速偿还。
        - 关键
        - 持续监测契约、套期保值，并保留股权资本缓冲。
        - 若证券化市场收缩，将面临再融资风险。
      - - 逆变器与电池储能电子设备
        - Huawei、Sungrow
        - 核心储能和转换硬件
        - Tier-1 集中度高
        - 部件缺陷或关键固件漏洞。
        - 中
        - 制造商保修转嫁和实验室测试。
        - 硬件更换人工成本。
    notes: 集中度评估依据 Enpal FY24 对单一来源热泵关系、Tier-1 中国光伏制造合作伙伴和仓储融资银团的披露。
    claimRefs:
