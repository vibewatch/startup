      - number: '8.2'
        title: 当前融资结构、估值标记与稀释背景
        blocks:
          - type: paragraph
            body: >
              Enpal 的融资历程采用双轨策略：以增长股权结合机构债务融资，为住宅硬件铺设提供资金。股权方面，Enpal 于 2021 年完成 Series C，以 $1.1B 估值成为德国首家绿色独角兽，SoftBank
              Vision Fund 2 和 HV Capital 是主要支持者；随后在 2023 年 1 月完成 $230M Series D，由 TPG's Rise Fund 领投，投后估值为 $2.4B。2025 年
              4 月，Enpal 又完成一轮 $110M 增长股权融资（Tracxn 和 Seedtable 口径；Multiples.vc 记录为 $125M），由 TPG 领投、SoftBank
              参与；私募估值追踪平台估计公司估值为 $2.5B，相比 2021 年 7 月 Series C 的 $831M，在四轮定价股权融资中累计增长 3.0x。

              但股权只占 Enpal 总资本版图的一部分。公司搭建了庞大的资产支持债务和仓储融资组合，包括 2024 年 3 月由 Barclays、Bank of America、Credit Agricole CIB 和
              CPP Investments 支持的 $1.19B 常规债务额度，2024 年由 Barclays 和 Citi 支持的 €700M 融资额度，2023 年 6 月的 €462M，以及 2022 年 12 月的
              $910M。平台数据库 BounceWatch 记录的累计融资承诺总额为 $4.39B，而 FundedIQ 按不同追踪批次记录为 $479M；两者差异说明，二级追踪平台是否纳入 SPV
              层面的无追索权债务，会造成显著口径差别。

              这层庞大债务给股东带来明显的优先权悬垂。Enpal 的客户覆盖已超过 140,000 户，2023 年营收超过 €900M，但公开渠道没有二级股份交易、Forge Global 市场定价或经审计的
              2024-2025 年股权瀑布结构，基本面股权投资判断因此更复杂。除非经审计的资产负债表披露或机构级二级流动性窗口予以确认，公开市场投资者都应把 $2.4B 至 $2.5B 的私募估值视为暂定值。
