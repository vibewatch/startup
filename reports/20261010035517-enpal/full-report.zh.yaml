            body: >-
              Enpal 的商业客户模式主要面向德国城市郊区和农村的独栋房主；他们面临较高的零售电价，并希望获得能源自主。住宅太阳能套餐通常搭配电池储能和智能能源管理硬件，是核心获客引擎；资本开支为 €18,000 至
