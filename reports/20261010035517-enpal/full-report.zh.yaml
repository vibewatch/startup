  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管框架、劳动法合规与法律风险
        blocks:
          - type: paragraph
            body: >-
              Enpal 在德国快速扩张，引发了大量监管审查，重点涉及劳动法、销售实践和可再生能源市场干预。Manager Magazin 根据对 21
              名现任和前任员工的访谈开展调查报道，叠加莱比锡劳动法院诉讼，揭示出系统性劳动不合规，包括在病假和休假期间未支付法定佣金补偿。Enpal
              则以技术人员整体薪酬高于平均水平为依据为其做法辩护，并在公开诉讼后修改了柏林的佣金均衡政策；但劳动摩擦仍是活跃的运营和声誉脆弱点。此外，公司商业模式与德国《可再生能源法》（EEG）和《能源行业法》（EnWG）的法定规定紧密相连，电网馈电补偿或峰值灵活性要求变化会直接影响消费者采用经济性。遵守德国《供应链法》（LkSG）也要求对上游制造合作伙伴进行严格尽调。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR012
