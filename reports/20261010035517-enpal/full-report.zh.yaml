      - number: '6.3'
        title: 已命名客户证明、线索生成与交付运营
        blocks:
          - type: paragraph
            body: >-
              复杂家庭能源系统的获客需要大量教育触点和运营可靠性证明。早期扩张阶段，Enpal 在开放网络出版商中投放大规模原生软文广告，在欧洲能源危机期间将获客成本降低 50%。2026 年，公司用约 20 名经过审核的
              Instagram 客户创作者群体替代广播媒体，重新设计营销漏斗，将每条线索成本减半，并将转化率提高 23%。交付运营方面，Enpal 与 Enterprise Mobility
              合作管理专用技术人员车队，车辆可用率超过 95%，从而保持合同签署后 4 至 6 周的安装节奏。
            claimRefs:
