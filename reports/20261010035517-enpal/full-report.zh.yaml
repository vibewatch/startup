      - number: '7.4'
        title: 信贷组合风险、流动性状况与剩余风险矩阵
        blocks:
          - type: paragraph
            body: >-
              从结构性资产负债表角度看，Enpal 通过设立独立、破产隔离的特殊目的载体（SPV），将长期客户信用风险圈在外部；这些载体持有 20 年太阳能租赁和 25
              年分期贷款资产。这一法律隔离让运营实体在宏观经济下行或局部家庭破产期间免于直接承担消费者违约义务。公司通过固定利率贷款和利率互换，提前对冲长期承诺，以抵御利率波动。此外，Enpal 在 2025 年 4 月完成由
              TPG Rise Climate 领投的 110m euros D 轮融资，增强企业流动性缓冲，使现金储备保持在 250m euros
              以上。不过，劳动合规、国际供应链动态和监管关税调整仍带来较高剩余风险，需要积极缓释和透明的审计验证。
