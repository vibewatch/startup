      - number: '7.3'
        title: 供应链集中度、硬件采购与交易对手依赖
        blocks:
          - type: paragraph
            body: >-
              Enpal 的硬件履约高度依赖全球硬件制造商和机构债务资本提供方的上游关系。其绝大多数光伏组件来自 LONGi Green Energy、JA Solar、Astronergy 和 Trina 等中国头部厂商，使
              Enpal 暴露于地缘政治紧张、欧盟潜在贸易保障调查以及新疆供应链可追溯性风险。为缓解这些干扰，Enpal 在深圳设立 25 人质量保证中心，并通过与越南 VSUN Solar
              的制造合作推进采购多元化。在快速扩张的热泵业务中，Enpal FY24 仍依赖单一供应商，同时开始引入第二供应商。在融资端，Enpal 依靠 Barclays、Bank of America 和 Credit
              Agricole 等银团提供的数十亿欧元仓储信贷额度，必须持续满足契约要求才能为客户发放新贷款。
