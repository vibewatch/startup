  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 营收模式与商业收入流
        blocks:
          - type: paragraph
            body: >-
              Enpal 面向住宅房主运营多收入流的清洁能源分销与变现引擎。基础产品是 20
              年订阅套餐：房主无需承担前期硬件和安装资本开支，套餐将高效太阳能组件、储能电池、逆变器、保险和长期维护打包为可预测的月费。随着消费者偏好和欧洲利率环境变化，Enpal
              也推出系统直销，让客户直接买断光伏设备并立即确认收入。近几轮运营中，平台扩展到住宅热泵、智能电表、电动车充电壁挂式设备和自研 Enpal.One+ 能源管理软件。热泵业务迅速扩大，2025
              年约贡献核心营业额的三分之一。软件驱动的直接电力营销则将分散的住宅储能资产聚合成虚拟电厂，既让房主从剩余电力销售中获利，也建立了持续的客户触点，进一步提升家庭变现能力。
            claimRefs:
              - CI001
              - CI004
              - CI007
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
      - number: '4.2'
        title: 定价结构与变现机制
        blocks:
          - type: paragraph
            body: >-
              Enpal 的市场变现依靠透明的入门定价，目标是克服长期碎片化、低信任住宅交易行业中的房主决策惰性。基础屋顶太阳能订阅月费从 98
              欧元起，零首付；价格随电池容量、逆变器规格和家庭能源需求上升。希望直接拥有设备的房主，可以约 18,000 欧元至 26,000 欧元购买标准 10 kWp
              光伏安装，并享受德国住宅太阳能设备的全额增值税豁免。对于热泵改造，Enpal 将硬件标价和交钥匙安装费用与联邦脱碳补贴结合；申请最高 80% 的符合条件州级补助后，系统净价从 7,999 欧元起，也可以选择月费
              67 欧元起的分期融资。双重变现架构让 Enpal 既能通过长期租赁触达受流动性约束的房主，也能通过现金交易服务资金充足的消费者。
            claimRefs:
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI002
            claimRefs:
