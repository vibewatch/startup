            title: 估值纪律要求经审计的盈利证明
            body: >
              Enpal 已在德国住宅清洁能源领域建立无可否认的市场领先地位，也搭建了机构级结构化融资引擎，但后期增长股权投资者仍必须保持估值纪律。2023 年之后缺少经审计的合并财务报表，加上 2025 年 4
              月股权估值依赖二级追踪平台估算，使股东在信贷收紧或监管倒退时面临显著下行风险。在经审计的 EBITDA 盈利能力得到确认前，投资者应维持跟踪立场。
