      - number: '6.4'
        title: 留存持久性、交叉销售扩张与电网瓶颈
        blocks:
          - type: paragraph
            body: >-
              Enpal 的客户持久性建立在 20 年租赁合同和 Enpal.One 管理平台的实时智能家居遥测之上；该平台通过 MongoDB Atlas 持续收集超过 65,000
              户联网家庭的数据。平台支持动态自发自用优化和直接电力营销，每年可为客户创造最多 €2,000 的馈电收入。然而，结构性摩擦仍然明显：德国 800
              多家本地配电网运营商执行不同的接入规则和非标准化数字协议，在实体安装与并网馈电之间形成行政瓶颈。尽管 Enpal 报告了强劲的客户总数，经审计的 cohort
              留存、合同违约率和客户取消指标仍未公开，使长期资产层面的信用表现成为关键尽调事项。
            claimRefs:
