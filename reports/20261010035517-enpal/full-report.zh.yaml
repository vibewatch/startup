  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 一体化住宅电气化产品组合与硬件整合
        blocks:
          - type: paragraph
            body: >-
              Enpal 运营标准化住宅脱碳平台，组合屋顶光伏硬件、电池储能、电动车壁挂式充电器、智能电表和住宅热泵。核心太阳能产品采用高效 460
              瓦全黑单晶光伏组件，搭配混合逆变器和模块化住宅电池。房主可以直接预付购买系统（标准 10 kWp 系统通常为 18,000 至 26,000 欧元），也可以选择月费 98
              欧元起、零前期资本支出的长期订阅租赁套餐。通过将硬件与维护、保险及认证区域技术人员安装打包，Enpal 降低了德国和意大利独栋房主的技术采用摩擦。此外，Enpal
              还接入智能电表，绕过默认的有功电力馈入限制，让房主能把剩余太阳能直接卖到批发电力市场，不受标准限发上限约束。
