      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 混合变现与结构化仓储融资架构
            body: >-
              Enpal 从纯住宅太阳能租赁经纪商转型为一体化家庭脱碳运营商，根本上依托其获取机构资产支持债务仓储的能力。公司通过由 Barclays 和 Bank of America 等一级机构出资的破产隔离 SPV，为
              20 年客户租赁和 25 年分期合同再融资，在保留企业股权用于平台扩张和安装商培训的同时隔离客户信用资产。
            calloutType: insight
            claimRefs:
