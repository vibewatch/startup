figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Enpal 从 2017 年到 2026 年发展的关键公司、运营、融资和监管里程碑。
    data:
      items:
        - date: 2017-01
          label: 在柏林成立
          detail: Mario Kohle、Jochen Ziervogel 和 Viktor Wingert 创立 Enpal GmbH，提供住宅太阳能租赁。
          tone: neutral
        - date: 2018-07
          label: 首轮机构融资
          detail: Enpal 完成首轮创业融资，用于支持初期客户安装和招聘安装人员。
          tone: positive
        - date: 2021-07
          label: Series C 初始交割
          detail: 随着太阳能需求加速，Enpal 完成长股权融资，公司估值达到 $831M。
          tone: positive
        - date: 2021-10
          label: 气候独角兽地位
          detail: SoftBank Vision Fund 2 领投 €150M 的 Series C 扩展轮，公司估值超过 US$1B。
          tone: positive
        - date: 2023-01
          label: Series D 与扩张
          detail: TPG Rise Climate 领投 €215M 融资，公司估值 €2.2B，并计划拓展欧洲市场。
          tone: positive
        - date: 2023-06
          label: 债务融资再融资
          detail: Enpal 从 Phoenix Life、DWS、ING 和 BlackRock 获得 €462M 机构债务再融资。
          tone: neutral
        - date: 2024-03
          label: €1.19B 高级债务融资
          detail: Enpal 与 Barclays、Bank of America、Credit Agricole CIB 和 CPP Investments 合作开展仓储融资。
          tone: neutral
        - date: 2024-12
          label: FY2024 经审计财务数据
          detail: 合并收入达到 €913.4M，累计完成 85,000 次太阳能安装，经营性 EBIT 亏损为 €137.7M。
          tone: negative
        - date: 2025-04
          label: 成长股权融资
          detail: TPG Rise Climate 和 Activate Capital 领投 $110M-$125M 融资，估值标记为 $2.4B-$2.5B。
          tone: neutral
        - date: 2026-10
          label: 客户数超过 140,000
          detail: Enpal 报告称，已安装的客户系统超过 140,000 套，并拓展了热泵和智能能源管理解决方案。
          tone: positive
    approximationNotes: 里程碑日期和详情整理自经核实的新闻稿、公司公告和经审计的年度申报文件。
    claimRefs:
      - CO001
