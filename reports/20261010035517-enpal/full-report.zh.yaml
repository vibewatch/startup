            title: 经审计 FY2024 文件中的 EBIT 亏损与营收收缩
            body: >-
              尽管商业宣传强调客户账户已超过 140,000 个，Enpal B.V. 的 FY2024 经审计财务报表仍显示出明显的运营压力。集团合并营收同比下降 4.9% 至 €913.4M；经营 EBIT 亏损从
              FY2023 的 €1.6M 大幅扩大至 FY2024 的 €137.7M，导致净亏损 €161.2M，资产负债表现金储备也明显减少。
            calloutType: risk
