  - id: FV001
    title: Enpal 投资建议与投资判断逻辑
    type: flow
    summary: |
      将已验证的商业规模与债务融资额度串成一套递进式决策逻辑；在经审计的盈利能力披露到位前，建议持续跟踪。
    data:
      nodes:
        - id: origination-scale
          label: 140k+ 客户与 €900M+ 收入
        - id: debt-engine
          label: $4.3B+ 已承诺结构化债务
        - id: valuation-marks
          label: $2.4B - $2.5B 私募估值
        - id: information-deficit
          label: 经审计 EBITDA 与股权结构表信息缺口
        - id: recommendation-track
          label: 建议：持续跟踪（风险：高）
        - id: thesis-triggers
          label: 尽调：经审计利润率与 ABS 证明
      edges:
        - from: origination-scale
          to: debt-engine
        - from: debt-engine
          to: valuation-marks
        - from: valuation-marks
          to: information-deficit
        - from: information-deficit
          to: recommendation-track
        - from: recommendation-track
          to: thesis-triggers
    approximationNotes: |
      基于公开验证数据点，对投资判断流程和门槛标准的定性呈现。
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV007
      - CV014
      - CV015
