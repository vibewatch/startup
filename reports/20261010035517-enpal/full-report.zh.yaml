            claimRefs:
              - CO001
              - CO005
              - CO010
      - number: '1.3'
        title: 资本化历史、估值标记与债务工具
        blocks:
          - type: paragraph
            body: >-
              Enpal 在 2025 年 4 月完成 $110m 至 $125m 的成长股权融资，投后估值在 $2.4b 至 $2.5b 之间；此前，公司在 2021 年 10 月完成由 SoftBank Vision
              Fund 2 领投的 €150m C 轮融资，并在 2023 年 1 月完成由 TPG Rise Climate 领投、Activate Capital 和 Westly Group 参与的 €215m D
              轮融资，估值达到 €2.2b。Enpal 累计获得超过 $4.4b 的股权和资产支持债务融资，并高度依赖通过破产隔离特殊目的载体安排的非稀释性资产支持仓储信贷，包括 2024 年 3 月由
              Barclays、Bank of America、Credit Agricole 和 CPP Investments 提供的 €1.19b 债务承诺，以及 BlackRock、ING 和 DWS 此前提供的
              €855m 额度。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO015
      - number: '1.4'
        title: 公司里程碑时间线与经审计财务表现
        blocks:
          - type: paragraph
            body: >-
              Enpal 的运营历史始于 2017 年创立，随后快速扩张至数 GW 级住宅部署，并取得多项结构化债务里程碑。截至 2024 年末，累计部署包括 85,000 套太阳能光伏系统（发电容量 830
              MWp）、73,000 套电池储能系统（容量 750 MWh）、40,000 个电动车充电站和 6,000 台热泵；截至 2026 年末，活跃住宅账户已超过 140,000 个。然而，Enpal
              向德国联邦议院游说登记处提交的 FY2024 合并财务报表显示，商业和财务压力正在显现。集团合并营收从 FY2023 的 €960.1M 下降 4.9% 至 FY2024 的 €913.4M；经营 EBIT
              亏损则从 €1.6M 大幅扩大至 €137.7M，最终形成 €161.2M 合并净亏损，资产负债表现金储备降至 €189.5M。从快速抢占市场份额转向实现可持续经营利润率，是 Enpal 中期尽调的核心挑战。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO010
