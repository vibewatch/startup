      - number: '4.4'
        title: 资本充足性、杠杆与尽调结论
        blocks:
          - type: paragraph
            body: >-
              Enpal 的资本结构本质上由资产支持杠杆而非软件式股权利润率决定。为了支持前期设备采购和长期租赁应收款，公司已从 Barclays、Bank of America、Credit
              Agricole、BlackRock 和 Citi 等头部金融机构获得累计超过 5b euros 的结构化债务与仓储承诺，并由约 600m euros 股权资金支持。2025 年 4 月，由 TPG Rise
              Climate 领投的 110m euros 股权融资将现金储备推高至 250m euros 以上，为包括 Enpal.pro B2B 安装商网络在内的新业务线扩张提供运营跑道。不过，对结构化债务工具的高度依赖使
              Enpal 暴露于再融资摩擦、仓储保证金追加和新发放贷款利率被压缩的风险。投资判断 Enpal 的长期企业韧性前，应重点审阅经审计财务披露、贷款契约阈值、预付率，以及融资特殊目的载体内的资产表现数据。
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
      - number: '4.5'
        title: 展示项
        blocks:
          - type: callout
            title: 资本结构脆弱性：资产重模式下的债务依赖
            body: Enpal 依靠资产融资引擎运营，累计债务承诺超过 €5B，而股权约为 €600M。该结构让公司能够以零前期费用高速获客，但也使其容易受到利率变化、仓储再融资条件和 20 年长期合同消费者信用违约的冲击。
            calloutType: risk
            claimRefs:
