              - CI004
              - CI005
      - number: '4.3'
        title: 业务增长、单位经济性与私有指标缺口
        blocks:
          - type: paragraph
            body: >-
              Enpal 的商业轨迹快速扩张，却高度受宏观政策和能源市场周期影响。2023 年营收同比增长 118% 至 905m euros；德国能源危机后的太阳能热潮在基准利率上升、化石燃料价格正常化后冷却，合并营业额在
              2024 年收缩至 860m euros 至 890m euros。2025 年，热泵系统在德国和意大利快速铺开，营收恢复至约 1.1b euros。然而，关键单位经济指标仍未公开：Enpal 没有公布
              CAC、综合销售转化效率，也没有披露 140,000+ 客户群的 cohort 留存率和违约曲线。尽管公司披露 2025 年分部层面经营自由现金流转正，且 2023 年调整后 EBITDA 约为 21m
              euros，独立投资判断仍需要看清客户回本周期，以及扣除持续服务准备金后的终身合同价值。
            claimRefs:
              - CI005
