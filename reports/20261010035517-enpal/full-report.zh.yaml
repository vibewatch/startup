      - number: '8.3'
        title: 情景预测、公开可比公司与尽调要求
        blocks:
          - type: paragraph
            body: >
              为评估潜在股权回报，我们围绕 Enpal 的客户基础和收入轨迹构建了三个多年运营情景。在乐观情景（概率 25%）下，Enpal 成功拓展商业业务和更广泛的欧洲市场，经审计 EBITDA 利润率超过
              10%，并扩大住宅电气化软件变现，按 2.5x 至 3.0x 收入倍数支持 $3.8B 至 $4.5B 的企业估值。在基准情景（概率 50%）下，Enpal
              保持德国屋顶光伏和热泵安装的市场领先地位，收入温和增长至 €1.2B 至 €1.4B，但 EBITDA 接近盈亏平衡并继续依赖 ABS 仓储融资，合理股权估值维持在 $2.4B 至 $2.8B。在悲观情景（概率
              25%）下，欧洲宏观经济停滞、补贴退坡或信贷仓储契约收紧压低安装量，收入倍数压缩至 1.0x 至 1.3x，估值降至 $1.3B 至 $1.7B。

              可比市场分析呈现出截然不同的估值参照。在欧洲私募市场，Sonnen Energy（Tracxn 评分 52/100，已被 Shell/Ancora 收购）、Giga Green（融资 $27.1M）以及
              Co-Power 等早期进入者（种子轮 $7.31M）的资本规模都小得多，因此 Enpal 没有覆盖范围相当的直接私募可比公司。在公开市场，住宅清洁技术可比公司，如美国上市的 Sunrun
              和历史上的欧洲太阳能硬件安装商，在高利率和监管波动环境下交易于 1.0x 至 2.5x 的低迷 EV/Revenue 倍数，与 Enpal 根据历史估值标记隐含的 2.0x 至 2.4x 收入倍数较为接近。

              在投入任何资本之前，潜在投资者必须从五个关键维度开展严格尽调：（1）取得 FY2024 和 FY2025 经审计的合并 IFRS 财务报表，验证毛利率稳定性和 EBITDA 盈利能力；（2）检查
              Barclays、BofA 和 Citi 融资额度下 SPV 债务仓储契约、利率对冲和预付款率触发条件；（3）确认 Series C、Series D 和 2025 年 4
              月优先股的清算优先权、反稀释条款和参与权；（4）评估 20 年安装资产组合中的客户违约率、逾期付款和流失指标；（5）跟踪太阳能上网电价、德国建筑能源效率要求和欧洲电网并网标准的监管政策变化。
            claimRefs:
