      - number: '5.3'
        title: 部署物流、调试周期与服务模式重组
        blocks:
          - type: paragraph
            body: >-
              Enpal 以纵向协调、端到端的安装模式交付住宅清洁能源系统，覆盖数字化预审、现场结构评估、认证区域安装和调试后的维护。从远程屋顶分析和技术人员现场检查开始，合同签署到上线运行的平均安装周期通常为：更换热泵 4
              周、安装屋顶光伏 6 周。不过，运营扩张也暴露出售后服务和客户沟通的摩擦。2026 年 4 月，Enpal 在没有提前通知的情况下取消了集中式、97 人的光伏客户服务部门，并转向分散式服务模式。公司配置了超过
              100 名专职施工和客户顾问，力图在整个安装周期内为房主提供单一联系人，以缓解过去的协调瓶颈和投诉。
            claimRefs:
              - CE002
              - CE005
              - CE011
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE005
              - CE011
