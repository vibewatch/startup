chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、平台架构与商业模式
        blocks:
          - type: paragraph
            body: >-
              Enpal 由 Mario Kohle、Jochen Ziervogel 和 Viktor Wingert 于 2017 年在柏林创立，目标是消除德国住宅采用清洁能源时的前期资本开支门槛。集团由母公司 Enpal
              B.V. 运营，该公司是一家荷兰私人有限责任公司，主要运营总部位于柏林 Koppenstraße；2023 年完成了从 Enpal GmbH 的公司重组。Enpal
              是垂直整合的家庭脱碳运营商，提供屋顶光伏安装、模块化电池储能系统、电动车壁挂式充电器、热泵和自研智能能源管理软件。住宅房主可以选择灵活的融资方式：20 年全服务运营租赁，包含维护和保险；或 25
              年分期购买协议，也可以直接现金购买。依靠自有安装团队、自研软件调度和机构仓储融资，Enpal 已在德国扩大住宅覆盖，并进入相邻欧洲市场。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO010
              - CO011
