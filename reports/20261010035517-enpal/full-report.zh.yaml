      - number: '5.4'
        title: Clean-Core ERP 现代化、分析基础设施与质量控制
        blocks:
          - type: paragraph
            body: >-
              为支持高速度现场履约以及 30 多个运营法人实体的资产支持结构化融资，Enpal 正在大规模现代化企业系统。工程团队正把旧版 Microsoft Dynamics 365 Finance and
              Operations 迁移到 clean-core ERP 架构，并增设围绕端到端流程域组织的 AI 原生执行层，例如从线索到订单、从采购到付款。核心企业集成将 Dynamics 365 与 Salesforce
              CRM、物联网遥测流、Azure 云基础设施以及 Kyriba 和 Aryza 财务平台连接起来。与此同时，Enpal 用基于 Snowflake、dbt Cloud 和 Fivetran 的统一 DataOps
              技术栈替换了碎片化的旧数据仓库。这次迁移将分析流水线处理时间从 36 小时缩短到 1 小时，云基础设施支出减少 70%，并为 30 名数据工程师服务的 1,000
              多名内部用户建立了集中式数据模型。面向开发者的活动还包括 GitHub 上用于 agentic coding 引导和规范驱动开发框架的开源工具。
            claimRefs:
              - CE006
