            tableRef: TO001
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.2'
        title: 高管领导、治理结构与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              Enpal 的高管治理以创始人兼 CEO Mario Kohle 为核心。Kohle 此前联合创办线索生成 marketplace Aroundhome，并负责 Enpal 的公众品牌和监管沟通。联合创始人
              Viktor Wingert 担任 CIO，负责设计公司数十亿欧元规模的仓储融资额度、特殊目的载体证券化及机构资本市场合作。执行董事 Jochen Ziervogel 和 COO Henning Rath
              负责集团履约、安装商物流以及各区域枢纽的运营扩张。公司对 Kohle 的战略愿景和 Wingert 的债务资本获取仍有较强关键人物依赖，不过采购、现场运营和能源交易等专业管理部门已让运营执行日益分散。截至
              2026 年末，Enpal 约有 3,750 至 3,800 名全职员工，覆盖软件工程师、商业销售团队和欧洲运营范围内的自有安装人员。
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO012
