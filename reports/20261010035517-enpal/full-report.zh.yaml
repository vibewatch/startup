      - number: '7.2'
        title: 运营执行、安装人员安全与质量控制
        blocks:
          - type: paragraph
            body: >-
              随着 Enpal 扩大屋顶光伏组件、电池储能、壁挂式充电器和热泵的一体化住宅组合，运营执行成为核心瓶颈。住宅实体安装固有施工危险，包括屋顶穿孔漏水、老旧房屋电网接入不稳定，以及安装人员的职业安全风险。Enpal
              虽设有内部培训学院以统一工艺，并定期开展现场质量审计，但调查报道和员工评价指称，区域安装团队存在强烈配额压力、长工时和安全标准执行不一致等问题。面向拉丁美洲电工的国际招聘计划提高了技术吞吐量，却也引发了对劳动者依赖结构的审查。在分散式自有团队和外部分包商之间确保安装安全一致，对于避免保修责任和保护品牌资产仍然至关重要。
            claimRefs:
              - CR004
              - CR007
              - CR011
              - CR014
              - CR015
