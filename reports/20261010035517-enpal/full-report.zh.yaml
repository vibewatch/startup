      - number: '5.2'
        title: Enpal.One+ 物联网能源管理架构与虚拟电厂能力
        blocks:
          - type: paragraph
            body: >-
              Enpal 产品技术架构的核心是 Enpal.One 及其升级版住宅能源管理网关
              Enpal.One+。该系统充当边缘物联网控制器，连接太阳能逆变器、储能电池、电动车充电器和热泵，持续监测发电量、家庭负载需求和电网价格信号。Enpal.One
              依靠自动优化算法，协调何时在本地消耗发电量、何时将剩余电力存入住宅电池，以及何时把电力回送公共电网。Enpal 将这项能力宣传为最多可降低家庭电费 75%，并通过动态馈电补偿每年创造最多 2,000
              欧元收入。在聚合规模下，这些联网分布式能源资源组成虚拟电厂，可在可再生能源发电波动、现货市场价格动态变化期间，为输电系统运营商提供电网稳定和灵活性服务。
