callouts:
  - calloutType: recommendation
    title: Valuation Discipline Demands Audited Earnings Proof
    body: >
      While Enpal has established undeniable market leadership across Germany's residential clean-energy sector and constructed an institutional-grade structured finance engine, late-stage growth equity investors must exercise valuation discipline. The lack of post-2023 audited consolidated financial statements, combined with reliance on secondary tracker estimates for the April 2025 equity valuation, leaves equity holders exposed to significant downside in the event of credit tightening or regulatory retrenchment. Investors should maintain a Track posture until audited EBITDA profitability is confirmed.
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV014

