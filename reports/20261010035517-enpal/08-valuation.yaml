  - id: scenarios-comparables-diligence
    title: Scenario Projections, Public Comparables, and Diligence Asks
    body: >
      To assess potential equity return outcomes, we evaluate three multi-year operating scenarios anchored on Enpal's customer base and revenue trajectory. Under the Bull Case (25% probability), Enpal successfully diversifies into commercial segments and broader European geographies, achieves audited EBITDA margins above 10%, and expands home electrification software monetization, supporting an enterprise valuation between $3.8B and $4.5B at a 2.5x to 3.0x revenue multiple. Under the Base Case (50% probability), Enpal maintains market leadership in German rooftop solar and heat pump installations, scales revenue moderately toward €1.2B to €1.4B, but operates near breakeven EBITDA with ongoing ABS warehousing reliance, sustaining fair equity valuation between $2.4B and $2.8B. In the Bear Case (25% probability), European macroeconomic stagnation, subsidy rollbacks, or credit warehouse covenant tightening depress install volumes, forcing multiple compression to 1.0x to 1.3x revenue and driving valuation down to $1.3B to $1.7B.

      Comparable market analysis illustrates contrasting valuation paradigms. In private European markets, competitors such as Sonnen Energy (Tracxn score 52/100, acquired by Shell/Ancora), Giga Green ($27.1M raised), and early-stage entrants like Co-Power ($7.31M seed) operate at significantly smaller capital scale, leaving Enpal without direct private peers of equivalent reach. In public markets, residential clean-tech comparables such as US-listed Sunrun and historical European solar hardware installers have traded at depressed revenue multiples between 1.0x and 2.5x EV/Revenue amidst elevated interest rates and regulatory volatility, aligning closely with Enpal's implied 2.0x to 2.4x revenue multiple based on historical marks.

      Prior to any capital commitment, prospective investors must execute rigorous diligence across five critical dimensions: (1) obtain audited consolidated IFRS financial statements for FY2024 and FY2025 to verify gross margin stability and EBITDA profitability; (2) inspect SPV debt warehouse covenants, interest rate hedges, and advance-rate triggers across the Barclays, BofA, and Citi facilities; (3) confirm liquidation preferences, anti-dilution provisions, and participation rights across Series C, Series D, and April 2025 preferred stock; (4) evaluate customer default rates, payment delinquencies, and churn metrics across the 20-year installation portfolio; and (5) monitor regulatory policy shifts regarding solar feed-in tariffs, German building energy efficiency mandates, and European grid-interconnection standards.
