companyProfile:
  summary: >-
    Enpal is a Berlin-founded residential clean-energy platform that combines rooftop solar, battery storage, heat
    pumps, EV wallboxes, and smart-home energy management into long-duration lease and installment offerings for
    homeowners. The company has scaled rapidly across Germany, broadened into adjacent electrification products, and now
    operates with substantial structured financing support, but its public disclosure remains thin relative to its size
    and capital intensity.
