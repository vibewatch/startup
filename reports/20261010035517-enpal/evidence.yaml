evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financing-valuation
    missingEvidence: >-
      Audited cap-table ownership breakdown, liquidation preferences, and exact dilution economics of the April 2025
      growth round.
    whyItMatters: >-
      Without primary cap-table disclosure, post-money valuation marks between $2.4B and $2.5B cannot be verified
      against share count or preference tiers.
    diligencePath: >-
      Request shareholder register or cap-table extract from management or lead sponsor TPG Rise Climate during
      management diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: operational-scale
    missingEvidence: Audited FY2025 consolidated annual financial statements and current 2026 run-rate operating metrics.
    whyItMatters: >-
      Enpal reported €913.4M in FY2024 revenue with €161.2M net loss, but 2025 full-year audited results and 2026
      run-rate disclosures remain undisclosed.
    diligencePath: Obtain Dutch Chamber of Commerce (KVK) or German Bundesanzeiger filings once FY2025 statements are certified.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-governance
    missingEvidence: Comprehensive listing of Enpal B.V. supervisory board members, advisory board representatives, and SPV directors.
    whyItMatters: >-
      Understanding board governance and lender oversight across Enpal's multi-billion euro debt SPV structures is
      critical for assessing corporate control.
    diligencePath: Review Dutch commercial register filings for Enpal B.V. and affiliated financing SPVs.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: market-sizing-divergence
    missingEvidence: >-
      Audited multi-year consensus forecast for German residential solar and heat pump addressable market TAM/SAM in
      Euro volume through 2030.
    whyItMatters: >-
      Without uniform analyst CAGR consensus, addressable runway for Enpal's residential electrification platform beyond
      domestic core penetration cannot be modeled deterministically.
    diligencePath: >-
      Review independent market data from BSW Solar (Bundesverband Solarwirtschaft) and federal network agency
      (Bundesnetzagentur) registration registries.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-cost-benchmarks
    missingEvidence: >-
      Audited gross margin and direct unit installation costs across competitor heat pump and solar portfolios in
      Germany.
    whyItMatters: >-
      Without granular unit economics for regional Handwerk and VC-backed peers, relative operational cost advantages
      cannot be definitively confirmed.
    diligencePath: >-
      Obtain installer association cost benchmarks, wholesale equipment pricing schedules, and private competitor
      financial disclosures.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: private-metric-gaps
    missingEvidence: >-
      Audited cohort-level customer acquisition costs (CAC), sales cycle economics, gross margins by product line, and
      historical contract default and prepayment rates.
    whyItMatters: >-
      Without audited unit-level acquisition and default data, underwriting Enpal's long-term spread between 20-year
      customer lease cash flows and debt service obligations is speculative.
    diligencePath: >-
      Request audited IFRS financial statements for FY2024 and FY2025, alongside SPV asset-level performance reports,
      warehouse borrowing base certificates, and vintage default curves.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: vpp-performance-and-curtailment
    missingEvidence: >-
      Audited telemetry and third-party benchmark data verifying actual realized feed-in yields, dispatch response
      times, and curtailment frequencies for Enpal.One+ in virtual power plant operations.
    whyItMatters: >-
      Direct marketing revenues and the advertised savings of up to 75% depend on real-time grid orchestration that
      cannot be independently confirmed from marketing disclosures alone.
    diligencePath: >-
      Request anonymized high-resolution interval telemetry from Enpal.One+ installations, grid operator dispatch logs,
      and VPP revenue settlement statements.
    relatedQuestionRefs:
      - QE003
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: material
    topic: customer-advisor-service-metrics
    missingEvidence: >-
      Post-restructuring operational KPIs including average ticket resolution time, installation NPS, and dispute rates
      following the dissolution of the 97-person customer service team.
    whyItMatters: >-
      Transitioning to decentralized construction and customer advisors represents an execution risk during seasonal
      installation surges that could affect customer satisfaction and cancellation rates.
    diligencePath: >-
      Review internal Zendesk/Salesforce service-level agreement dashboards, customer escalation registers, and cohort
      retention metrics.
    relatedQuestionRefs:
      - QE005
    relatedTableRefs:
      - TE002
  - type: enumeration-incomplete
    severity: material
    topic: Named customer proof table
    missingEvidence: >-
      Comprehensive customer deployment registry distinguishing active residential lease contracts from cancelled or
      restructured accounts.
    whyItMatters: >-
      Individual marketing case studies provide illustrative evidence of lead conversion but cannot substitute for
      population-wide contract performance records.
    diligencePath: >-
      Request an anonymized cohort registry of residential lease agreements with installation dates and operational
      status.
    relatedTableRefs:
      - TU003
    relatedQuestionRefs:
      - QU005
  - type: private-evidence-only
    severity: material
    topic: Installed base retention and cohort churn
    missingEvidence: >-
      Audited net revenue retention, contract default rates, and customer cancellation cohorts across 20-year lease
      agreements.
    whyItMatters: >-
      Long-term structured financing and asset-backed debt depend on predictable lease collections; undisclosed churn or
      default could impair asset cash flows.
    diligencePath: Obtain ABS asset performance reporting and audited credit loss schedules for the residential lease portfolio.
    relatedQuestionRefs:
      - QU008
  - type: missing-source
    severity: material
    topic: Grid operator connection delays and dispute resolution
    missingEvidence: >-
      Quantitative data on average customer waiting times across the 800+ German distribution system operators and
      unresolved consumer complaint statistics.
    whyItMatters: >-
      Grid connection delays directly defer system activation and customer billing, creating cash flow lag and potential
      customer dissatisfaction.
    diligencePath: Examine Bundesnetzagentur complaints data and distribution system operator registration processing logs.
    relatedQuestionRefs:
      - QU007
  - type: missing-source
    severity: material
    topic: labor-compliance-audit
    missingEvidence: >-
      Independent third-party compliance audit of installer working conditions, overtime compensation records, and works
      council establishment status across German operating hubs.
    whyItMatters: >-
      Enpal's rapid installer scaling relies on operational throughput; unmitigated labor disputes or union-organizing
      friction create direct headline risk, regulatory scrutiny, and technician turnover.
    diligencePath: >-
      Review internal works council agreements, labor inspection reports, and confidential settlement schedules in
      management diligence.
    relatedQuestionRefs:
      - QR004
    relatedTableRefs:
      - TR001
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: Comprehensive non-public litigation docket and consumer protection warning letter inventory.
    whyItMatters: >-
