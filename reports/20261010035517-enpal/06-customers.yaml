callouts:
  - calloutType: "insight"
    title: "Strategic Shift Toward Customer-Advocate Marketing to Compress High-Ticket Acquisition Costs"
    body: "Selling residential home electrification systems valued at €20,000 to €40,000 involves an extensive one-month consultation cycle that resists impulse conversion. Enpal's pivot from broadcast YouTube campaigns to a curated circle of authenticated customer-creators cut lead acquisition costs by 50% in early 2026, demonstrating that authenticated customer advocacy is more effective than generic awareness advertising for complex residential capital expenditures."
    claimRefs:
      - "CU008"
      - "CU009"
  - calloutType: "risk"
    title: "Structural Grid Operator Fragmentation Poses Persistent Customer Onboarding Friction"
    body: "While Enpal has accelerated hardware installation timelines to four to six weeks via specialized fleet logistics, overall customer time-to-power remains vulnerable to external administrative friction. Germany's more than 800 independent distribution grid operators employ disparate, non-standardized connection procedures that create regional backlog risks and customer onboarding friction beyond Enpal's direct operational control."
    claimRefs:
      - "CU006"
      - "CU013"
