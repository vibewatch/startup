  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: A management-grade TAM/SAM/SOM model for the post-Beekeeper and post-Comeen employee-hub category, with
      segment definitions, pricing assumptions, and geography splits.
    whyItMatters: Without a reproducible serviceable-market model, valuation work depends on narrative category creation and
      proxy metrics instead of revenue-linked market math.
    diligencePath: Request board or planning materials that show target segments, average contract values, penetration assumptions,
      and management’s own market model.
    relatedQuestionRefs:
    - QM002
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: buyer-segmentation
    missingEvidence: Public evidence that names the primary budget owner, pricing basis, and contract scope for communications,
      HR, IT, operations, and workplace-service deployments.
    whyItMatters: Buyer and payer ambiguity affects sales-cycle assumptions, competitive set, and which budgets can realistically
      support the broader employee-hub thesis.
    diligencePath: Ask for pricing sheets, sample deal structures, and customer references broken out by department-led use
      case.
    relatedQuestionRefs:
    - QM003
    relatedTableRefs:
    - TM003
  - type: conflicting-data
    severity: material
    topic: scale-claims
    missingEvidence: One reconciled definition for users, employees reached, customers, and active seats across current LumApps
      surfaces.
    whyItMatters: Conflicting footprint figures weaken installed-base sizing and make it harder to benchmark penetration,
      expansion potential, and valuation support.
    diligencePath: Request a current KPI bridge that reconciles marketed users, paid seats, active monthly users, customers,
      and legacy vs. combined-entity figures.
    relatedQuestionRefs:
    - QM008
    relatedTableRefs:
    - TM002
