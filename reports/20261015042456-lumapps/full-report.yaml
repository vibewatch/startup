  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public sources imply a software-led hub model that expands through integrations and AI agents, with margin
      sensitivity to delivery effort.
    data:
      nodes:
        - id: pain
          label: Enterprise employee-fragmentation pain
          detail: Distributed workforces and fragmented tools create demand for one governed employee destination.
        - id: hub
          label: Core employee-hub platform
          detail: LumApps combines communications, knowledge, learning, and business-app access in one product.
        - id: integration
          label: Integration and ecosystem layer
          detail: Microsoft 365, Google Workspace, ServiceNow, Workday, and 50+ connectors widen account scope.
        - id: agents
          label: AI / agent module expansion
          detail: Agent Hub, Learning Agent, and Agent Studio extend monetization beyond the base intranet.
        - id: services
          label: Implementation and bespoke delivery
          detail: Forward-Deployment Engineering implies custom rollout and services exposure around customer-specific agents.
        - id: quality
          label: Revenue quality and margin outcome
          detail: >-
            Software expansion can improve ACV, but margins depend on how much delivery effort sits beside recurring
            software.
      edges:
        - from: pain
          to: hub
          label: creates demand for
        - from: hub
          to: integration
          label: broadens through
        - from: integration
          to: agents
          label: supports expansion into
        - from: agents
          to: services
          label: can require
        - from: services
          to: quality
          label: shapes
    approximationNotes: >-
      This is a qualitative bridge derived from product and launch materials; reviewed public sources do not expose a
      quantified revenue waterfall.
    claimRefs:
      - CI004
      - CI005
      - CI006
      - CI008
      - CI012
      - CI014
      - CI015
      - CI016
