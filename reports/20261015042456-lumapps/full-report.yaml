      - number: '1.3'
        title: Leadership, control, and milestone timeline
        blocks:
          - type: paragraph
            body: >-
              Named current leadership in the retained pool is narrow but still decision-relevant. June 2026 launch
              coverage identifies Sébastien Ricard as CEO, and the September 2025 Agent Hub release quotes Elie Mélois
              as CTO, indicating that the product story is being driven by executive leadership rather than a disclosed
              independent board narrative. The strongest independent financing and control evidence comes from
              Forrester, which says LumApps announced its Beekeeper merger on July 2, 2025, that Bridgepoint had already
              acquired a majority stake in LumApps in 2024, and that the combined company carried a valuation above $1
              billion. What is still missing is equally important: the current pool does not disclose founders, current
              board composition, total capital raised, debt terms, or audited revenue, so governance and capitalization
              diligence remains materially open despite a stronger combined-market story.
