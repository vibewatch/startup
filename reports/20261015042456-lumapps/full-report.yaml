      - number: '4.2'
        title: Enterprise scope is clear, but unit economics are still mostly private
        blocks:
          - type: paragraph
            body: >
              LumApps' public positioning is explicitly enterprise and multi-workforce: the March 2026 blog targets
              desk-based, frontline, and hybrid deployments, and the official launch materials frame AI-agent
              orchestration as a layer spanning HR, IT, operations, and communications. That broad scope can support
              land-and-expand economics, especially if integrations and AI modules deepen account penetration. The
              adverse evidence is that time-to-value and administration burden appear to be genuine buying criteria.
              Simpplr's comparison page cites analyst and customer concern around campaign setup and report
              customization, while LumApps' own materials acknowledge depth, flexibility, and governed rollouts. Those
              signals matter financially because they imply implementation effort and customer-success intensity, yet
              the reviewed sources expose no CAC, payback, NRR, churn, or gross-margin data to test whether expansion
              offsets delivery complexity.
