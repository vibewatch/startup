      - number: '1.2'
        title: Scale signals, workforce coverage, and disclosure limits
        blocks:
          - type: paragraph
            body: >-
              The available scale evidence is directionally positive but not cleanly comparable. The current homepage
              says LumApps is trusted by more than seven million employees, a September 2025 company press release says
              the employee hub was already powering communications and workflows for more than 10 million employees, and
              LeadIQ lists LumApps at more than six million users across 750 clients with 501-1000 employees. The
              Beekeeper integration page adds that LumApps served over 750 clients and Beekeeper over 1,500 clients at
              the time of the merger narrative. These figures likely mix pre- and post-merger periods plus different
              denominators such as employees reached, software users, and customer accounts, so they support enterprise
              scale but do not establish a clean current combined customer count or headcount.
            claimRefs:
              - CO009
