  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model breadth is visible; pricing disclosure is not
        blocks:
          - type: paragraph
            body: >
              The reviewed sources consistently present LumApps as an enterprise employee-hub platform rather than a
              single-purpose intranet: the homepage describes a product that brings communication, automation,
              microlearning, and existing tools together, while the AI platform and launch materials extend that
              footprint into agents, workflows, and cross-system orchestration. That makes a software-subscription core
              plausible, with possible expansion from AI modules, integrations, and workflow use cases, but the sources
              do not establish how those surfaces are priced. The public record provides no LumApps list price,
              disclosed contract unit, renewal mechanics, or visibility into discounting and realized average selling
              prices. Workvivo's public per-user, per-month benchmark shows one packaging convention in the category,
              not LumApps' own monetization.
