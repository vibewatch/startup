        - Track remains appropriate because public evidence supports interest but not price underwriting.
        - Product proof persists while economic-quality disclosure stays incomplete.
        - Another financing event arrives without transparent terms or operating-quality evidence.
      - - Bear
        - >-
          Integration complexity and enterprise AI adoption friction keep ROI below expectations, leaving breadth
          without enough proof of monetization.
        - Without disclosed terms, investors face the risk of paying for narrative rather than validated economics.
        - Adoption metrics or customer outcomes fail to improve despite platform expansion.
        - Management cannot show retention, margin, or milestone progress after expansion investments.
    notes: >-
      The reviewed public record does not support precise valuation ranges, so scenario logic is expressed as
      underwriting conditions and probability signals instead of unsupported multiples.
    claimRefs:
      - CV004
      - CV007
      - CV008
      - CV011
      - CV013
      - CV014
      - CV016
