  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set spans suites, intranet peers, and workflow substitutes
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to a layered competitive set. Company-issued comparison material names
              Microsoft SharePoint, Workvivo, Simpplr, Unily, Confluence, and Staffbase as relevant alternatives, while
              independent coverage broadens the field to Microsoft/Viva, Slack-adjacent employee-experience tooling, and
              Workday-led workforce platforms. That matters because LumApps is not only replacing classic intranets; it
              is also selling against suite-native publishing tools, communications layers, structured knowledge
              systems, and broader employee-experience stacks. The most defensible reading is that buyers evaluate
              LumApps as an employee-hub platform that overlaps several categories at once, which increases TAM but also
              widens the set of incumbents able to respond from existing enterprise relationships.
