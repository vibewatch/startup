  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and deployment segments
        blocks:
          - type: paragraph
            body: >-
              LumApps addresses a multi-stakeholder enterprise buying motion rather than a single departmental use case.
              Its current website explicitly organizes the platform around internal communications, IT and digital
              workplace, HR and people teams, and frontline operations, while product pages describe end users spanning
              headquarters, desk-based, frontline, and distributed employees. The economic buyer is not disclosed in the
              reviewed material, but implementation complexity and integration requirements imply that IT and
              business-function owners both participate in procurement. The customer proposition is strongest where one
              deployment can consolidate communications, knowledge, workflows, learning, and access to existing
              enterprise systems. This creates multiple adoption surfaces, but it also makes success dependent on
              role-specific configuration and integration.
            claimRefs:
              - CU005
              - CU006
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
              - CU004
              - CU005
              - CU006
      - number: '6.2'
        title: Adoption trajectory and scale signals
        blocks:
          - type: paragraph
            body: >-
              Public scale evidence is meaningful but not fully comparable. LumApps' current homepage says the platform
              is trusted by more than seven million employees, while a November 2025 company release said the Employee
              Hub powered communications and workflows for more than ten million employees. A separate current marketing
              page reports more than 500,000 weekly active users and an 87% average frontline adoption rate. These
              figures establish a large deployed footprint, but their denominators, customer coverage, measurement
              windows, and relationship to the post-merger platform are not disclosed. Investors should therefore treat
              them as company-reported indicators rather than a reconciled usage cohort or a retention series.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU007
              - CU009
      - number: '6.3'
        title: Named customer proof and reference quality
        blocks:
          - type: paragraph
            body: >-
              Named-account evidence spans two vintages. A Google Cloud customer story historically described more than
              400 LumApps clients and named John Lewis, The Economist, Just Eat, Schnuck Markets, and Google; it also
              described Airbus-to-Zendesk reach. LumApps' November 2025 Agent Hub release separately named Ascension
              Health, Zapier, and Genuine Parts Company. These references support real enterprise deployment, but most
              reviewed material does not disclose contract value, deployment population, production start date, or
              measured customer outcome. Two current AI-page testimonials are anonymous, which weakens their diligence
              value. The result is credible logo proof but limited account-level evidence about production depth and
              realized economics.
            claimRefs:
              - CU007
              - CU008
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU010
      - number: '6.4'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The strongest durability datapoint is historical: Google Cloud's case study quoted LumApps at a 99%
              renewal rate. No current NRR, GRR, logo churn, cohort retention, contract-length, or expansion-revenue
              series appears in the assigned evidence, so that older figure cannot establish present post-merger
              durability. Expansion is plausible through additional connectors, workflows, role-based agents, and
              bespoke forward-deployed engineering, while LumApps says customer-success support continues beyond launch.
              Independent coverage nevertheless cautions that organization-wide AI adoption remains an execution
              question. Without top-customer revenue shares, channel attribution, and renewal cohorts, investors cannot
              quantify concentration or distinguish product breadth from durable expansion.
            claimRefs:
              - CU009
              - CU013
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU012
              - CU014
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is credible but the public numerators do not reconcile
            body: >-
              More than seven million employees, more than ten million employees, and more than 500,000 weekly active
              users describe different populations and vintages. They should not be combined into a growth or engagement
              rate.
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: callout
            title: Retention and concentration remain underwriting gaps
            body: >-
              A historical 99% renewal claim is directionally positive, but current NRR, GRR, churn, contract length,
              cohort behavior, and top-customer revenue concentration are not disclosed in the assigned evidence.
            calloutType: risk
            claimRefs:
              - CU009
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Residual risk stack
        blocks:
          - type: paragraph
            body: >-
              LumApps is trying to solve a real adoption problem, but the same facts that make the story compelling also
              define the risk stack. The company is positioning Agent Hub as a governed layer across Microsoft 365,
              Google Workspace, ServiceNow, Workday, and other systems just after combining with Beekeeper, while
              independent commentary still frames the market as crowded and custom deployment costs as potentially
              prohibitive. That leaves the investment case most exposed to execution: LumApps has to prove the combined
              platform can unify desk-based and frontline workflows without turning implementation effort, connector
              governance, or services dependence into the main product.
            claimRefs:
              - CR001
              - CR004
              - CR008
              - CR009
              - CR012
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR004
              - CR008
              - CR009
              - CR010
              - CR012
              - CR014
              - CR015
      - number: '7.2'
        title: Regulatory, privacy, and decisioning boundaries
        blocks:
          - type: paragraph
            body: >-
              The legal and trust surface is not centered on a known enforcement action in the assigned pool; it is
              centered on how much underwriting still depends on company assertions. LumApps repeatedly markets
              governed, permission-aware AI and says it can plug into customer knowledge bases while adhering to major
              global regulation standards such as GDPR. That is directionally helpful, but it does not replace current
              post-merger evidence on control scope, audit coverage, connector-level data handling, or approval
              boundaries for sensitive HR and legal workflows. The safest read is that governance is a design goal with
              incomplete public proof, so diligence has to validate the controls before treating them as cleared risk.
            claimRefs:
              - CR002
              - CR003
              - CR010
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR009
              - CR014
      - number: '7.3'
        title: Operational rollout and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              Operationally, LumApps is layering several hard problems on top of one another. It is rolling out Agent
              Hub and broader LumApps AI claims, it is still integrating Beekeeper's frontline feature set into a
              unified employee hub, and it remains tightly linked to hyperscaler ecosystems that are simultaneously
              partners and competitive benchmarks. The company does have plausible mitigants—cross-suite positioning,
              marketplace access, and a governed orchestration narrative—but public evidence still points to migration,
              deployment-cost, and platform-dependence risk remaining meaningfully open rather than already retired.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
              - CR010
              - CR011
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR007
              - CR009
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR010
              - CR011
              - CR013
              - CR014
      - number: '7.4'
        title: Monitoring indicators and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to underwrite LumApps is to turn the unresolved risks into monitored gates. Positive
              evidence would be current trust-pack disclosure, reference customers on the unified post-Beekeeper
              platform, adoption metrics for Agent Hub after general availability, and proof that custom-agent
              deployments do not require an expensive services overlay. The thesis weakens materially if management
              cannot show migration progress, if Microsoft- or Google-centric deals collapse back to native copilots, or
              if public disclosures continue to omit NRR, gross margin, debt terms, and post-merger control scope after
              a full product cycle.
            claimRefs:
              - CR005
              - CR009
              - CR010
              - CR011
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Core thesis-break risk
            body: >-
              The main kill criterion is not whether LumApps can describe an AI employee hub; it is whether the combined
              LumApps-Beekeeper platform can show unified customer adoption without leaning on expensive custom
              engineering or partner ecosystems that can substitute it.
            calloutType: risk
            claimRefs:
              - CR004
              - CR009
              - CR012
              - CR014
              - CR016
          - type: callout
            title: Diligence gate before underwriting
            body: >-
              Treat security, migration, and unit-economics evidence as hard gating items. If management cannot produce
              a current trust pack, post-merger migration dashboard, and basic NRR or margin disclosure, the
              residual-risk profile remains too open for a confident price-sensitive recommendation.
            calloutType: recommendation
            claimRefs:
              - CR002
              - CR010
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The public evidence reviewed for this chapter supports a real product narrative: LumApps markets an AI
              employee hub, has public analyst recognition, and reports large enterprise usage. What it does not support
              is a priced underwriting case. The assigned sources focus on positioning, product launches, and
              acquisition strategy, while leaving current valuation, financing stack, preference overhang, NRR, and
              gross margin undisclosed. That makes a buy call too aggressive at an unknown entry price. The practical
              recommendation is to keep LumApps on the watchlist, require management disclosure before underwriting, and
              treat any near-term investment decision as diligence-led rather than momentum-led.
            claimRefs:
              - CV005
              - CV006
              - CV010
              - CV011
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV010
              - CV011
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV006
              - CV010
              - CV014
              - CV015
      - number: '8.2'
        title: What supports the thesis, and what restrains it
        blocks:
          - type: paragraph
            body: >-
              The upside case starts with credible breadth. LumApps positions itself as a governed AI employee hub
              across communications, workflows, learning, and enterprise search, then extends that pitch into frontline
              and workplace-experience use cases. The April 2026 Comeen transaction broadens the product story toward
              digital plus physical workplace orchestration, while Gartner recognition and disclosed user scale show
              category relevance. The restraint is that these are still mostly product and category signals, not
              economic proof. AI adoption remains difficult across enterprises, and the company still needs to show that
              its broader platform stack converts into durable usage, monetization, and financially attractive expansion
              after integration work is complete.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV010
              - CV012
              - CV014
      - number: '8.3'
        title: Scenario framing without false precision
        blocks:
          - type: paragraph
            body: >-
              Because the assigned public record does not disclose a current price anchor, the most responsible way to
              frame valuation is through underwriting conditions rather than unsupported numeric multiples. The bull,
              base, and bear cases therefore hinge on whether LumApps can convert strategic breadth into measurable
              enterprise adoption, and whether management is willing to provide the margin, retention, and
              transaction-term detail needed to support price. That keeps the scenario table directional but still
              decision-useful: it shows what evidence would justify moving the recommendation up, what would keep it at
              track, and what would push the case toward avoidance.
            claimRefs:
              - CV011
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV011
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Exit readiness cannot be judged from this public record alone because the missing items are exactly the
              ones that determine sponsor-to-sponsor or growth-stage entry discipline: valuation mark, dilution and
              preference terms, recurring revenue quality, and evidence that the AI and workplace-expansion roadmap is
              monetizing. The next diligence pass should force disclosure on those points before debating upside. The
              thesis breaks if LumApps cannot translate its AI and workplace story into adoption metrics, if post-merger
              integration drags through 2026 without clear milestones, or if management continues to ask investors to
              underwrite category leadership without providing economic-quality data to support the price.
            claimRefs:
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Entry discipline
            body: >-
              Treat LumApps as a monitored asset rather than an underwritten buy until management discloses a current
              valuation mark, financing stack, retention, gross margin, and post-Comeen integration milestones.
            calloutType: recommendation
            claimRefs:
              - CV010
              - CV011
              - CV015
