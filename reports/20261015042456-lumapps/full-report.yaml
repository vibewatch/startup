        title: Architecture centers on orchestration, integrations, and guided tasks
        blocks:
          - type: paragraph
            body: |-
              The architecture LumApps exposes publicly is layered rather than novel at
              the model level. Its disclosed AI stack relies on Vertex AI for Google
              Workspace customers and Azure GPT on Microsoft, while the product wraps
              those capabilities in branded search, agents, content generation, and
              workflow execution. Public use cases are concrete enough to suggest more
              than a demo surface: the platform describes IT support, onboarding,
              incident reporting, content lifecycle work, course generation, and
              broadcast design as agent-assisted flows, and the employee-hub page ties
              these actions to micro-apps, forms, approvals, and no-code connectors.
              This is strategically sensible because the product sits where employees
              already start work, but it also means value delivery is highly dependent
              on connector quality, permissioning, and configuration discipline.
