  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary is broader than legacy intranet software
        blocks:
          - type: paragraph
            body: >-
              LumApps is no longer describing its addressable market as a static intranet or communications layer.
              Across current product pages and launch releases, it defines an AI employee hub that combines
              communications, knowledge, workflows, agents, and business-system access in one governed workspace. That
              boundary now explicitly spans desk-based and frontline employees, and recent M&A expands the category into
              workplace services such as room booking, visitor flows, and digital signage. The practical implication is
              that LumApps is chasing a converged employee-experience budget rather than a narrow content-management
              line item, but that broader framing also makes clean TAM/SAM benchmarking harder because multiple adjacent
              software categories are being bundled together.
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM007
              - CM014
      - number: '2.2'
        title: Demand hinges on workflow adoption, not content publishing alone
        blocks:
          - type: paragraph
            body: >-
              The most consistent demand signal in the evidence is workflow fragmentation and weak AI adoption inside
              enterprises. LumApps and coverage of its 2026 launch argue that enterprises have already funded AI
              tooling, but employees still struggle to use it inside daily workflows because interfaces are fragmented
              and answers are not grounded in trusted business context. That positions LumApps against a buyer pain
              point shared by communications, HR, IT, and operations teams: they want one governed layer that can route
              requests, automate tasks, and surface knowledge without forcing employees into separate tools. Public
              sizing therefore works better as a set of adoption and installed-base lenses than as a clean published
              TAM/SAM/SOM stack.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM008
              - CM009
              - CM010
