      - number: '4.3'
        title: Current capital adequacy cannot be underwritten from public sources
        blocks:
          - type: paragraph
            body: >
              Historical fundraising is not equivalent to cash available today, so the relevant underwriting question is
              whether current public evidence establishes forward capital adequacy. It does not. None of the reviewed
              official, competitor, or news surfaces disclose current cash, burn, runway, debt facilities, covenant
              structure, or next-round triggers. At the same time, the launch materials introduce a Forward-Deployment
              Engineering team to support bespoke agents, which implies a non-trivial services or implementation
              component around customer-specific delivery. That may help conversion and expansion, but it also creates a
              margin-path question: without software-versus-services mix, utilization, and implementation duration,
              investors cannot tell whether new AI-module demand improves contribution margins or simply increases
              delivery load.
            claimRefs:
              - CI007
              - CI012
              - CI014
              - CI015
      - number: '4.4'
        title: 'Verdict: credible expansion surface, weak underwriting readiness'
        blocks:
          - type: paragraph
            body: >
              The best-supported financial conclusion is that LumApps has built a broader product surface than a legacy
              intranet vendor: enterprise employee-hub software, ecosystem integrations, workflow automation, and new
              AI-agent modules all create possible expansion vectors. The weakest-supported conclusion is everything an
              investor would use to size the quality and survivability of that revenue: price realization, services
              attach, gross margin, net retention, churn, cash runway, and debt burden all remain undisclosed. The
              unreconciled employee-reach figures across official surfaces add another diligence wrinkle, because even
              the most visible scale proxy lacks a common denominator and vintage. Until management provides a clean
              cash bridge, cohort retention, pricing architecture, and software-versus-services mix, the business is
              analyzable strategically but not underwritable financially.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI012
              - CI014
              - CI015
              - CI016
