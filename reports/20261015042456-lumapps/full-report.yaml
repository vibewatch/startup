chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and current positioning
        blocks:
          - type: paragraph
            body: >-
              LumApps' current official positioning is broader than a legacy intranet vendor. Its homepage calls the
              company "The leading AI Employee Hub" and says the platform connects people, tools, AI agents, and
              knowledge across the employee experience, while adjacent product pages describe a governed hub that
              combines communications, automation, microlearning, workflows, and enterprise search in one interface. The
              retained official product evidence also says LumApps integrates with Microsoft 365, Google Workspace,
              Workday, and ServiceNow, and uses permission-aware information access rather than a generic public AI
              layer. Independent June 2026 coverage reinforces that LumApps is trying to turn AI experimentation into
              workflow-level employee adoption rather than adding another standalone assistant.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO016
