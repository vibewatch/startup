      - number: '3.3'
        title: Moat is credible, but displacement risk remains benchmark-light
        blocks:
          - type: paragraph
            body: >-
              The main competitive risk is not that LumApps lacks a clear positioning story; it is that the strongest
              public evidence remains narrative rather than benchmarked. Gartner review content surfaces product
              complaints around hierarchy, metrics, and secured AI functionality, which are exactly the kinds of issues
              incumbents can target during enterprise bake-offs. Public commercial disclosure is also limited: retained
              LumApps pages route buyers into sales contact rather than posting list pricing, making it difficult to
              compare discounting power or TCO against bundled Microsoft alternatives. As a result, the moat appears to
              come from breadth, frontline reach, and cross-suite neutrality, but its durability versus native-suite
              bundling still needs direct win-loss and migration evidence.
