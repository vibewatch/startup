      - number: '2.3'
        title: Sizing confidence is limited by proxy metrics and conflicting live scale claims
        blocks:
          - type: paragraph
            body: >-
              The main constraint for diligence is not a lack of category ambition; it is the lack of independently
              benchmarked market math and harmonized operating metrics. Company materials present broad AI-spend and
              adoption statistics plus installed-base proxies, but they do not disclose segment-level pricing, budget
              ownership, or a reproducible SAM/SOM methodology for the post-Beekeeper and post-Comeen product boundary.
              Public scale claims also vary across surfaces, with official and third-party pages citing different user
              and customer figures. For valuation work, that means the market story is directionally credible, while the
              conversion from category narrative to serviceable revenue pool still needs management evidence.
            claimRefs:
              - CM008
              - CM012
              - CM013
              - CM014
              - CM015
