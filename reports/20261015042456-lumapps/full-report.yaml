        title: Exhibits
        blocks:
          - type: callout
            title: Category creation by convergence
            body: >-
              LumApps is not just selling a better intranet; it is trying to collapse communications, workflow
              automation, AI agents, frontline operations, and now workplace services into one employee-hub budget
              narrative.
            calloutType: insight
            claimRefs:
