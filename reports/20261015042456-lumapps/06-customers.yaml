    notes: >-
      Segments and use cases are company-described; payer identity, segment
      revenue, contract value, and adoption denominators are not publicly
      disclosed in the assigned evidence.
    claimRefs: [CU004, CU005, CU006]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Reported value
      - Evidence date
      - Source posture
      - Confidence
      - Implication and missing denominator
    rows:
      - ["Employees reached / trusted", "More than 7 million", "Accessed 2026-10-15", "Company claim", Medium, "Large current footprint; customer and active-use denominators absent"]
      - ["Employees powered by Employee Hub", "More than 10 million", "2025-11-25", "Company press release", Medium, "Broader historical claim; definition differs from current homepage wording"]
      - ["Weekly active users", "More than 500,000", "Accessed 2026-10-15", "Company claim", Medium, "Usage signal; total eligible population and time window absent"]
      - ["Average frontline adoption", "87%", "Accessed 2026-10-15", "Company claim", Medium, "Strong reported adoption; cohort, weighting, and measurement method absent"]
      - ["Clients", "More than 400", "Historical case study", "Partner-published customer story", Medium, "Confirms earlier commercial scale; not a current customer count"]
      - ["Renewal rate", "99%", "Historical case study", "Partner-published customer story", Medium, "Durability signal; period, cohort, revenue basis, and current applicability absent"]
    notes: >-
      Values preserve each source's metric name and period. The employee-scale
      figures use different wording and should not be treated as a time series;
      no conversion, growth rate, or current retention rate is derived.
    claimRefs: [CU001, CU002, CU003, CU004, CU007, CU009]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case evidence
      - Production vs. pilot
      - Reported outcome
      - Limitation
    rows:
      - [John Lewis, Enterprise retail, "Named in Google Cloud's LumApps customer story", "Not stated", null, "No deployment date, population, or outcome"]
      - [The Economist, Media enterprise, "Named in Google Cloud's LumApps customer story", "Not stated", null, "No contract scope or outcome"]
      - [Just Eat, Digital marketplace, "Named in Google Cloud's LumApps customer story", "Not stated", null, "Historical reference; current status unknown"]
      - [Schnuck Markets, Frontline retail, "Named in Google Cloud's LumApps customer story", "Not stated", null, "No workforce coverage or adoption metric"]
      - [Ascension Health, Healthcare, "Named as a LumApps customer in the 2025 Agent Hub release", "Not stated", null, "No Agent Hub adoption or outcome disclosed"]
      - [Zapier, Technology, "Named as a LumApps customer in the 2025 Agent Hub release", "Not stated", null, "No deployment depth or commercial value disclosed"]
      - [Genuine Parts Company, Distribution / frontline, "Named as a LumApps customer in the 2025 Agent Hub release", "Not stated", null, "No production date or measured result"]
    notes: >-
      Sample includes named organizations in the assigned Google Cloud partner
      story and LumApps' 2025 release. Null means no measurable customer outcome
      was disclosed in those sources; logo mention does not prove retention.
    enumerationScope:
      coverage: sample
      basis: >-
        Named accounts disclosed in the assigned Google Cloud customer story
        and LumApps November 2025 Agent Hub release.
    claimRefs: [CU008, CU010]
figures:
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      The public evidence supports a multi-stage enterprise journey, while
      current conversion and retention rates remain undisclosed.
    data:
      nodes:
        - id: need
          label: Identify fragmented employee work
          detail: Communications, HR, IT, and operations teams identify disconnected tools and workflows.
          touchpoints: [Communications, Knowledge, Existing applications]
        - id: deploy
          label: Configure and integrate
          detail: LumApps connects enterprise suites and applications; complexity varies with custom and multi-region scope.
          touchpoints: [Microsoft, Google, Workday, ServiceNow]
        - id: reach
          label: Reach desk and frontline users
          detail: Web, mobile, and role-specific experiences extend the hub across workforce segments.
          touchpoints: [HQ, Frontline, Distributed teams]
        - id: adopt
          label: Build recurring use
          detail: Search, communications, self-service, learning, and workflows create daily-use surfaces.
          touchpoints: [Search, Content, Forms, Learning]
        - id: expand
          label: Add workflows and agents
          detail: Connectors, self-service agents, and bespoke engineering broaden use cases after deployment.
          touchpoints: [No-code connectors, Agents, Bespoke workflows]
        - id: renew
          label: Renew and evidence durability
          detail: Historical renewal evidence exists, but current cohort retention and expansion economics are not public.
          touchpoints: [Renewal, NRR diligence, Concentration review]
    approximationNotes: >-
      Stages synthesize company-described deployment and expansion mechanisms;
      no conversion rate, stage duration, or value-proportional relationship is
      implied.
    claimRefs: [CU005, CU012, CU014, CU016]
callouts:
  - calloutType: insight
    title: Scale is credible but the public numerators do not reconcile
    body: >-
      More than seven million employees, more than ten million employees, and
      more than 500,000 weekly active users describe different populations and
      vintages. They should not be combined into a growth or engagement rate.
    claimRefs: [CU001, CU002, CU003]
  - calloutType: risk
    title: Retention and concentration remain underwriting gaps
    body: >-
      A historical 99% renewal claim is directionally positive, but current NRR,
      GRR, churn, contract length, cohort behavior, and top-customer revenue
      concentration are not disclosed in the assigned evidence.
    claimRefs: [CU009, CU015, CU016]
