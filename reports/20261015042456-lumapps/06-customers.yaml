schemaVersion: "report-v2"
artifact: customers
slug: lumapps
runDate: 2026-10-15
company:
  name: LumApps
chapter:
  number: 6
  title: Customers
  summary: >-
    LumApps shows enterprise reach across desk and frontline workforces, with
    company-reported adoption signals of more than seven million employees,
    500,000-plus weekly active users, and 87% average frontline adoption. Named
    accounts and a historical renewal datapoint establish real deployment
    evidence, but current retention, contract, and concentration data remain
    undisclosed.
sections:
  - id: customer-segments
    title: Buyer, user, and deployment segments
    body: >-
      LumApps addresses a multi-stakeholder enterprise buying motion rather than
      a single departmental use case. Its current website explicitly organizes
      the platform around internal communications, IT and digital workplace, HR
      and people teams, and frontline operations, while product pages describe
      end users spanning headquarters, desk-based, frontline, and distributed
      employees. The economic buyer is not disclosed in the reviewed material,
      but implementation complexity and integration requirements imply that IT
      and business-function owners both participate in procurement. The
      customer proposition is strongest where one deployment can consolidate
      communications, knowledge, workflows, learning, and access to existing
      enterprise systems. This creates multiple adoption surfaces, but it also
      makes success dependent on role-specific configuration and integration.
    claimRefs: [CU005, CU006, CU012]
    tableRefs: [TU001]
  - id: adoption-and-scale
    title: Adoption trajectory and scale signals
    body: >-
      Public scale evidence is meaningful but not fully comparable. LumApps'
      current homepage says the platform is trusted by more than seven million
      employees, while a November 2025 company release said the Employee Hub
      powered communications and workflows for more than ten million employees.
      A separate current marketing page reports more than 500,000 weekly active
      users and an 87% average frontline adoption rate. These figures establish
      a large deployed footprint, but their denominators, customer coverage,
      measurement windows, and relationship to the post-merger platform are not
      disclosed. Investors should therefore treat them as company-reported
      indicators rather than a reconciled usage cohort or a retention series.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU002]
  - id: named-customer-proof
    title: Named customer proof and reference quality
    body: >-
      Named-account evidence spans two vintages. A Google Cloud customer story
      historically described more than 400 LumApps clients and named John
      Lewis, The Economist, Just Eat, Schnuck Markets, and Google; it also
      described Airbus-to-Zendesk reach. LumApps' November 2025 Agent Hub
      release separately named Ascension Health, Zapier, and Genuine Parts
      Company. These references support real enterprise deployment, but most
      reviewed material does not disclose contract value, deployment population,
      production start date, or measured customer outcome. Two current AI-page
      testimonials are anonymous, which weakens their diligence value. The
      result is credible logo proof but limited account-level evidence about
      production depth and realized economics.
    claimRefs: [CU007, CU008, CU010, CU011]
    tableRefs: [TU003]
  - id: durability-and-expansion
    title: Durability, expansion, and concentration risk
    body: >-
      The strongest durability datapoint is historical: Google Cloud's case
      study quoted LumApps at a 99% renewal rate. No current NRR, GRR, logo
      churn, cohort retention, contract-length, or expansion-revenue series
      appears in the assigned evidence, so that older figure cannot establish
      present post-merger durability. Expansion is plausible through additional
      connectors, workflows, role-based agents, and bespoke forward-deployed
      engineering, while LumApps says customer-success support continues beyond
      launch. Independent coverage nevertheless cautions that organization-wide
      AI adoption remains an execution question. Without top-customer revenue
      shares, channel attribution, and renewal cohorts, investors cannot
      quantify concentration or distinguish product breadth from durable
      expansion.
    claimRefs: [CU009, CU013, CU014, CU015, CU016]
    figureRefs: [FU001]
