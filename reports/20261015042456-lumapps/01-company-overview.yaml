    claimRefs: [CO013, CO014, CO015]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control / economic importance
      - Diligence ask
    rows:
      - ["Bridgepoint", "Majority owner / PE sponsor", "Independent coverage says Bridgepoint had already acquired a majority stake in LumApps in 2024 and backs the combined company.", "Obtain current cap table, debt facilities, governance rights, and any sponsor exit timeline."]
      - ["Beekeeper", "Merger counterpart", "Adds frontline-worker coverage and was central to the 2025 combination story.", "Validate product integration status, customer migration progress, and realized cross-sell synergies versus merger narrative."]
      - ["Microsoft ecosystem", "Major integration and distribution context", "Official product pages repeatedly position Microsoft 365 and related enterprise workflows as a core part of the product surface.", "Request attach rates, competitive win/loss data versus Microsoft-native alternatives, and enterprise dependency by suite."]
      - ["Google ecosystem", "Major integration and distribution context", "Official materials also position Google Workspace and Vertex AI compatibility as a core part of the platform story.", "Request customer mix by suite, switching friction, and any concentration risk in Google-centric deployments."]
      - ["Enterprise customers", "Revenue base", "Retained evidence supports substantial enterprise reach but not a clean current combined customer denominator.", "Confirm current paying-customer count, top-customer concentration, NRR, and churn."]
      - ["Frontline and distributed employees", "Strategic expansion segment", "Multiple 2025-2026 sources frame frontline coverage as a defining post-merger reason for the employee-hub strategy.", "Verify actual usage, mobile activation, and workflow penetration beyond launch messaging."]
    notes: >-
      Partial stakeholder map focused on control, platform dependencies, and economically important
      constituencies surfaced in the retained pool.
    enumerationScope:
      coverage: partial
      basis: Retained sources emphasize the merger structure, major suite integrations, and core customer/workforce segments rather than a full cap-table or partner roster.
    claimRefs: [CO003, CO006, CO007, CO008, CO009]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      The retained evidence shows a control-and-product arc from Bridgepoint ownership and the
      Beekeeper merger into the 2026 AI employee hub and search-led product narrative.
    data:
      items:
        - date: "2024"
          label: Bridgepoint majority stake in LumApps
          detail: Forrester says Bridgepoint had already acquired a majority stake in LumApps in 2024.
          tone: neutral
          claimRefs: [CO007]
        - date: "2025-07-02"
          label: Beekeeper merger announced
          detail: Forrester says LumApps announced that it would merge with Beekeeper on July 2, 2025.
          tone: neutral
          claimRefs: [CO006]
        - date: "2025-07-03"
          label: Independent valuation marker above $1B
          detail: Forrester says the combined company had a valuation of over $1 billion.
          tone: positive
          claimRefs: [CO008]
        - date: "2025-12"
          label: Learning Agent and Agent Studio early access target
          detail: The Agent Hub release said Learning Agent and Agent Studio would be available for early access to select customers in December 2025.
          tone: neutral
          claimRefs: [CO015]
        - date: "2026-06"
          label: General availability target for the first agent tools
          detail: The same release said General Availability was planned for June 2026.
          tone: neutral
          claimRefs: [CO015]
        - date: "2026-06-25"
          label: LumApps AI launch
          detail: Independent coverage says LumApps launched the AI Employee Hub to bring AI to every employee across businesses and industries.
          tone: positive
          claimRefs: [CO004]
        - date: "2026-06-30"
          label: Launch message syndicated into HR recruiting media
          detail: OnRec repeated the launch framing around desk-based, frontline, and distributed employees.
          tone: neutral
          claimRefs: [CO004, CO014]
        - date: "2026-10-15"
          label: Current product identity remains AI employee hub
          detail: The homepage and product pages still describe LumApps as an AI employee hub with enterprise search, workflows, and governed integrations.
          tone: positive
          claimRefs: [CO001, CO002, CO003, CO012]
    approximationNotes: >-
      Several retained official pages are undated, so the final milestone uses the run access date
      as the current-state snapshot rather than asserting a publication date.
    claimRefs: [CO001, CO002, CO003, CO004, CO006, CO007, CO008, CO015]
callouts:
  - calloutType: risk
    title: Evidence supports scale and control, but not underwriting-grade private-company disclosure
    body: >-
      The retained pool is good enough to establish LumApps' combined post-Beekeeper positioning and
      Bridgepoint-backed control story, but it is still weak on current combined customer count,
      exact headcount, total raised, debt terms, board composition, and audited financials. That
      means the company-overview chapter can anchor identity and milestones, but not a clean
      capitalization or operating baseline for valuation underwriting.
    claimRefs: [CO006, CO007, CO008, CO010, CO011, CO012, CO013]
