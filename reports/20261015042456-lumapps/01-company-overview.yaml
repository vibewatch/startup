      - ["Elie Mélois", "CTO", "The September 2025 Agent Hub release quotes Mélois on unifying agents, systems, and workflows.", "Board seat and founder status are not evidenced in the retained pool.", "Medium-high: the unified platform and agent orchestration roadmap appear tied to CTO execution and platform integration."]
    notes: >-
      Partial enumeration limited to executives explicitly named in retained public evidence;
      founders, current board composition, and any leadership turnover disclosures are absent from
      this pool.
    enumerationScope:
      coverage: partial
