schemaVersion: "report-v2"
artifact: company-overview
slug: lumapps
runDate: 2026-10-15
company:
  name: LumApps
chapter:
  number: 1
  title: Company Overview
  summary: >-
    LumApps now presents itself as an AI employee hub that extends beyond a classic intranet into
    workflows, enterprise search, and AI agents, with repeated emphasis on serving both desk-based
    and frontline workers. The strongest externally supported control facts in the retained pool are
    the July 2025 Beekeeper merger, Bridgepoint's 2024 majority stake, and an over-$1 billion
    combined-company valuation, while current revenue, total raised, cap table detail, and combined
    customer/headcount disclosures remain materially incomplete.
sections:
  - id: identity-and-product
    title: Identity, product scope, and current positioning
    body: >-
      LumApps' current official positioning is broader than a legacy intranet vendor. Its homepage
      calls the company "The leading AI Employee Hub" and says the platform connects people, tools,
      AI agents, and knowledge across the employee experience, while adjacent product pages describe
      a governed hub that combines communications, automation, microlearning, workflows, and
      enterprise search in one interface. The retained official product evidence also says LumApps
      integrates with Microsoft 365, Google Workspace, Workday, and ServiceNow, and uses
      permission-aware information access rather than a generic public AI layer. Independent June
      2026 coverage reinforces that LumApps is trying to turn AI experimentation into workflow-level
      employee adoption rather than adding another standalone assistant.
    claimRefs: [CO001, CO002, CO003, CO004, CO016]
    tableRefs: [TO001]
  - id: scale-footprint-and-coverage
    title: Scale signals, workforce coverage, and disclosure limits
    body: >-
      The available scale evidence is directionally positive but not cleanly comparable. The current
      homepage says LumApps is trusted by more than seven million employees, a September 2025
      company press release says the employee hub was already powering communications and workflows
      for more than 10 million employees, and LeadIQ lists LumApps at more than six million users
      across 750 clients with 501-1000 employees. The Beekeeper integration page adds that LumApps
      served over 750 clients and Beekeeper over 1,500 clients at the time of the merger narrative.
      These figures likely mix pre- and post-merger periods plus different denominators such as
      employees reached, software users, and customer accounts, so they support enterprise scale but
      do not establish a clean current combined customer count or headcount.
    claimRefs: [CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
  - id: leadership-control-and-milestones
    title: Leadership, control, and milestone timeline
    body: >-
      Named current leadership in the retained pool is narrow but still decision-relevant. June 2026
      launch coverage identifies Sébastien Ricard as CEO, and the September 2025 Agent Hub release
      quotes Elie Mélois as CTO, indicating that the product story is being driven by executive
      leadership rather than a disclosed independent board narrative. The strongest independent
      financing and control evidence comes from Forrester, which says LumApps announced its
      Beekeeper merger on July 2, 2025, that Bridgepoint had already acquired a majority stake in
      LumApps in 2024, and that the combined company carried a valuation above $1 billion. What is
      still missing is equally important: the current pool does not disclose founders, current board
      composition, total capital raised, debt terms, or audited revenue, so governance and
      capitalization diligence remains materially open despite a stronger combined-market story.
    claimRefs: [CO005, CO006, CO007, CO008, CO014, CO015]
    tableRefs: [TO002]
    figureRefs: [FO001]
