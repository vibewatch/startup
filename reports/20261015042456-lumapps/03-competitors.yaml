      - ["Microsoft SharePoint / Viva", "Suite-native intranet / digital workplace", "Named by independent and company sources as core incumbent", "Microsoft 365-centric organizations", "Deep document, publishing, and Microsoft workflow fit", "Retained evidence emphasizes desk/hybrid and Microsoft dependence"]
