      - ["Operational trade-off", "Strategic platform with governance overhead", "Configuration and governance burden", "Customization can increase maintenance effort", "Needs companion intranet for broader employee services", "Often needs adjacent tools for services, workflows, or deeper knowledge coverage"]
    notes: "Cells summarize only what the retained sources support; absence of detail should be read as unknown in this chapter's evidence set, not as product absence."
    claimRefs: ["CP001", "CP002", "CP004", "CP009", "CP010", "CP011", "CP012", "CP016"]
  - id: "TP003"
    title: "Pricing / packaging comparison"
    columns:
      - "Solution"
      - "Public price disclosure in retained evidence"
      - "Packaging cue"
      - "Known limitation"
      - "Implication"
    rows:
      - ["LumApps", "No numeric list price shown", "Personalized demo / Microsoft expert contact", "Discounting, seat tiers, and contract terms undisclosed", "Commercial comparison is likely negotiated rather than self-serve"]
      - ["SharePoint / Viva", "Unknown in retained evidence", "Bundle position not evidenced in retained chapter sources", "Cannot isolate incremental intranet cost from broader Microsoft estate", "Bundled budget may still make suite-native competition economically attractive"]
      - ["Unily", "Unknown in retained evidence", "No retained public packaging evidence", "No retained source for list price, services scope, or minimum contract", "Cannot quantify premium vs. LumApps from public evidence here"]
      - ["Simpplr", "Unknown in retained evidence", "No retained public packaging evidence", "No retained source for list price or deployment scope", "Ease-of-use story is public, but commercial comparison remains opaque"]
      - ["Confluence / Staffbase / Workvivo", "Unknown in retained evidence", "Retained sources describe use case more than price", "No retained price books or bundled discount evidence", "Buyer economics remain a diligence item, especially when substitutes are purchased for narrower jobs"]
    notes: "This is a retained-evidence audit rather than a market-wide pricing survey; unsupported cells are intentionally marked unknown instead of estimated."
    claimRefs: ["CP012", "CP013", "CP014"]
