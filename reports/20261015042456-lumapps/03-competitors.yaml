      - ["Simpplr", "Structured intranet", "20% of Gartner reviewers considered it before LumApps", "Teams seeking simplicity and consistency", "Prescriptive setup and easier governance", "Less suited to complex frontline and workflow breadth in retained evidence"]
      - ["Confluence", "Documentation substitute", "Company comparison frames it as a structured knowledge tool", "Technical and product teams", "Structured documentation, taxonomy, version control", "Not a complete employee-facing intranet in retained evidence"]
      - ["Staffbase / Workvivo", "Communications-first alternatives", "Company comparison includes both as viable alternatives", "Comms teams; desk/frontline engagement use cases", "Strong broadcast or social engagement patterns", "Need adjacent systems for broader workflow and service coverage"]
    notes: "Mixes company-issued positioning with independent market-signal evidence; unavailable scale, funding, and pricing fields are left qualitative rather than invented."
