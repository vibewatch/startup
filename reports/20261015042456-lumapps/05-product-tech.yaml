            - label: Knowledge and search
            - label: Directory and employee context
        - label: Workflow execution
          detail: Built-in actions that let employees complete work in the same surface
          modules:
            - label: Micro-apps and forms
            - label: Tasks and approvals
            - label: Onboarding and incident flows
        - label: AI services
          detail: Agent-assisted answers, content work, and orchestration
          modules:
            - label: AI search and summarized answers
            - label: Agent Library and Agent Studio
            - label: Smart Orchestrator and task routing
        - label: Integration fabric
          detail: Cross-suite connections into core workplace systems
          modules:
            - label: Microsoft 365 / Azure
            - label: Google Workspace / Vertex AI
            - label: ServiceNow, Workday, and 50+ connectors
        - label: Governance and trust
          detail: Company-claimed controls for approved content, permissions, and privacy
          outputs:
            - label: Approved destination for agents
            - label: Permission-aware responses
            - label: Security, audit, and GDPR claims
    approximationNotes: >-
      Layering is a public operating-model abstraction from assigned sources, not
      a disclosed internal service diagram.
    claimRefs: [CE001, CE003, CE004, CE007, CE013, CE014]
callouts:
  - calloutType: strength
    title: LumApps is pitching an action layer, not only an intranet
    body: >-
      The strongest product signal is orchestration breadth: communications,
      workflow execution, and AI agents are presented as one governed employee
      hub embedded inside Microsoft and Google environments.
    claimRefs: [CE005, CE007, CE012]
  - calloutType: risk
    title: Public proof still lags the scope of the platform promise
    body: >-
      The product story is broad, but current public evidence does not
      independently verify certification scope, uptime, or the technical
      milestones for fully unifying acquired frontline and workplace modules.
    claimRefs: [CE013, CE014]
