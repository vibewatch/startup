      - number: '3.3'
        title: 护城河可信，但替代风险仍缺少基准
        blocks:
          - type: paragraph
            body: >-
              主要竞争风险不是 LumApps 没有清晰的定位故事，而是最有力的公开证据仍是叙事性证据，缺少基准数据。Gartner 评测内容提出了层级、指标和受保护 AI
              功能方面的产品抱怨，而这些正是现有厂商在企业采购对比中可以攻击的环节。公开商业披露也很有限：LumApps 的页面把买方引向销售联系渠道，并不公布列表价格，因此很难比较其折扣能力或与捆绑式 Microsoft
              替代方案的 TCO。结果是，护城河似乎来自产品广度、一线覆盖和跨套件中立性，但相对于原生套件捆绑的持久性仍需要直接的赢单/输单和迁移证据。
            claimRefs:
              - CP007
              - CP013
              - CP014
      - number: '3.4'
        title: 展品
        blocks:
          - type: callout
            title: 最有证据支持的优势
            body: LumApps 最清晰的公开差异化，出现在企业需要一个同时覆盖 Microsoft 和 Google 环境、又能触达一线员工的统一员工中心层时。
            calloutType: strength
            claimRefs:
              - CP002
              - CP004
              - CP010
              - CP011
              - CP016
          - type: callout
            title: 主要竞争不确定性
            body: 独立留存证据尚未量化 LumApps 相对套件型既有厂商的赢单率、迁移结果或价格性能，因此其护城河能否持久仍只得到部分基准验证。
            calloutType: risk
            claimRefs:
              - CP006
              - CP007
              - CP013
              - CP014
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式广度可见，但定价披露缺失
        blocks:
          - type: paragraph
            body: >
              审阅来源一致将 LumApps 描述为企业员工中心平台，而不是单一用途的内联网：主页介绍的产品把沟通、自动化、微学习和现有工具汇集到一起，AI
              平台和发布材料又把范围延伸到智能体、工作流和跨系统编排。这使软件订阅核心看起来合理，也留下从 AI 模块、集成和工作流场景扩张的可能性，但来源没有说明这些功能如何定价。公开记录没有 LumApps
              的列表价格、合同计量单位、续约机制，也没有折扣和实际平均销售价格的可见性。Workvivo 公开的按用户按月价格，只能说明该品类的一种打包惯例，并不是 LumApps 自身的变现方式。
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI008
              - CI012
