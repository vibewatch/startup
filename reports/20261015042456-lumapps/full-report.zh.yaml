      - - 指定公开资料池中声称存在 AI 数据治理和隐私控制，但未独立界定范围
        - LumApps 表示智能体依赖获批准内容、员工上下文、受治理的知识源以及 感知权限的信息，但当前公开资料池不包含合并后的信任资料包、控制 范围或事件披露材料。
        - 处理员工与工作流数据的全球企业部署
        - 中
        - 高
        - 早期投资判断限于辅助型用例；在批准敏感工作流前，要求提供当前信任材料并审查连接器层面的数据流 。
        - 在产品营销之外证明当前控制范围前，风险维持高位。
        - 要求提供当前 SOC 2 或 ISO 范围、DPA 与子处理方资料包、渗透测试摘要，以及 合并平台的事件历史。
      - - HR 与法律工作流决策可能超出助手式自动化的安全边界
        - JSN Marketing 表示 LumApps AI 不能替代复杂、高风险 HR 或法律决策中的人工判断， 这符合治理边界，而非完全自治。
        - HR、合规与员工关系工作流
        - 中
        - 中
