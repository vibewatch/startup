        title: 不制造虚假精确度的情景框架
        blocks:
          - type: paragraph
            body: >-
              由于指定公开记录没有披露当前价格锚点，最负责任的估值框架应是投资判断条件，而不是没有根据的数字倍数。因此，乐观、基准和悲观情景取决于 LumApps
              能否把战略广度转化为可衡量的企业采用，以及管理层是否愿意提供支持价格判断所需的利润率、留存和交易条款细节。这样，情景表虽保持方向性，仍然有助于决策：它说明什么证据会支持上调建议、什么会让建议维持观察，以及什么会把判断推向回避。
            claimRefs:
              - CV011
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV011
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: 退出准备度、尽调问题与投资逻辑破裂触发条件
        blocks:
          - type: paragraph
            body: >-
              单靠这份公开记录无法判断退出准备度，因为缺失的项目正是决定管理层之间转手或成长阶段入场纪律的因素：估值标记、稀释与优先权条款、经常性收入质量，以及 AI
              和工作场所扩张路线图正在变现的证据。下一轮尽调应先要求披露这些内容，再讨论上行空间。如果 LumApps 无法把 AI 和工作场所故事转化为采用指标，合并后整合拖到 2026
              年仍没有清晰里程碑，或者管理层继续要求投资者在没有经济质量数据支撑价格的情况下押注品类领导地位，投资逻辑就会破裂。
            claimRefs:
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展品
        blocks:
          - type: callout
            title: 入场纪律
            body: 在管理层披露当前估值标记、融资结构、留存、毛利率和合并 Comeen 的整合里程碑之前，把 LumApps 视为需要持续监测的资产，而不是已经完成投资判断的买入标的。
            calloutType: recommendation
            claimRefs:
              - CV010
              - CV011
              - CV015
