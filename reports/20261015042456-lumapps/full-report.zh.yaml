          detail: Agent Hub、Learning Agent 和 Agent Studio 让变现范围超出基础内联网。
        - id: services
          label: 实施与定制交付
          detail: Forward-Deployment Engineering 意味着围绕客户专属 agent 进行定制部署，并带来服务交付敞口。
        - id: quality
          label: 收入质量与利润率结果
          detail: 软件扩张可以提升 ACV，但利润率取决于经常性软件收入之外还需要投入多少交付工作。
      edges:
        - from: pain
          to: hub
          label: 创造需求
        - from: hub
          to: integration
          label: 通过……扩大
        - from: integration
          to: agents
          label: 支持扩展至
        - from: agents
          to: services
          label: 可能需要
        - from: services
          to: quality
          label: 塑造
    approximationNotes: 这是根据产品和发布材料得出的定性桥接图；审阅的公开来源没有披露量化的收入瀑布。
    claimRefs:
      - CI004
      - CI005
      - CI006
      - CI008
      - CI012
      - CI014
      - CI015
      - CI016
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开披露的 LumApps 技术栈从面向员工的界面出发，经由工作流和 AI 编排，延伸至合作伙伴套件集成与治理。
    data:
      layers:
        - label: 体验界面
          detail: 覆盖桌面端、移动端和一线场景的统一品牌员工中心
          items:
            - label: Web 内联网
            - label: 移动应用
            - label: 一线员工与数字标牌访问
        - label: 通信与知识
          detail: 支撑发现的内容、搜索和公司语境
          modules:
            - label: 新闻与通信
            - label: 知识与搜索
            - label: 目录与员工语境
        - label: 工作流执行
          detail: 内置操作，让员工在同一界面完成工作
          modules:
            - label: 微应用与表单
            - label: 任务与审批
            - label: 入职与事件流程
        - label: AI 服务
          detail: 由 agent 辅助回答、内容处理和编排
          modules:
            - label: AI 搜索与摘要式回答
            - label: Agent Library 与 Agent Studio
            - label: Smart Orchestrator 与任务路由
        - label: 集成层
          detail: 连接核心工作场所系统的跨套件连接
          modules:
            - label: Microsoft 365 / Azure
            - label: Google Workspace / Vertex AI
            - label: ServiceNow、Workday 和 50+ 个连接器
        - label: 治理与信任
          detail: 公司自述的内容审批、权限和隐私控制
          outputs:
            - label: Approved destination for agents
            - label: Permission-aware responses
            - label: Security, audit, and GDPR claims
    approximationNotes: 这些层级是根据指定来源抽象出的公开运营模型，不是披露的内部服务图。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE007
      - CE013
      - CE014
  - id: FU001
    title: 客户采用与扩张旅程
    type: journey-map
    summary: 公开证据支持一条多阶段企业旅程，但当前转化率和留存率仍未披露。
    data:
      nodes:
        - id: need
          label: 识别碎片化的员工工作
          detail: 通信、人力资源、IT 和运营团队识别彼此割裂的工具和工作流。
          touchpoints:
            - Communications
            - Knowledge
            - Existing applications
        - id: deploy
          label: 配置与集成
          detail: LumApps 连接企业套件和应用；复杂度随定制程度和多区域范围而变化。
          touchpoints:
            - Microsoft
            - Google
            - Workday
            - ServiceNow
        - id: reach
          label: 触达办公室与一线用户
          detail: Web、移动端和按角色设计的体验让中心覆盖不同员工群体。
          touchpoints:
            - HQ
            - Frontline
            - Distributed teams
        - id: adopt
          label: 建立经常性使用
          detail: 搜索、通信、自助服务、学习和工作流构成日常使用场景。
          touchpoints:
            - Search
            - Content
            - Forms
            - Learning
        - id: expand
          label: 增加工作流与 agent
          detail: 部署后，连接器、自助 agent 和定制工程拓宽使用场景。
          touchpoints:
            - No-code connectors
            - Agents
            - Bespoke workflows
        - id: renew
          label: 续约并验证持久性
          detail: 历史续约证据存在，但当前队列留存和扩张经济指标未公开。
          touchpoints:
            - Renewal
            - NRR diligence
            - Concentration review
    approximationNotes: 这些阶段综合了公司描述的部署和扩张机制；不代表任何转化率、阶段时长或与价值成比例的关系。
    claimRefs:
      - CU005
      - CU012
      - CU014
      - CU016
