      - number: '4.3'
        title: 当前资本充足性无法靠公开来源判断
        blocks:
          - type: paragraph
            body: >
              历史融资不等于今天可用的现金，因此投资判断要问的是当前公开证据是否证明未来资本充足。答案是否定的。审阅的官方、竞争对手和新闻资料均未披露当前现金、烧钱速度、现金跑道、债务额度、契约结构或下一轮融资触发条件。同时，发布材料引入了
              Forward-Deployment Engineering
              团队来支持定制智能体，说明客户定制交付中存在不可忽略的服务或实施成分。这可能帮助转化和扩张，但也带来利润路径问题：没有软件与服务组合、利用率和实施时长，投资者无法判断新增 AI
              模块需求是改善贡献利润，还是只是增加交付负担。
            claimRefs:
              - CI007
              - CI012
              - CI014
              - CI015
      - number: '4.4'
        title: 结论：扩张空间可信，但投资判断准备度弱
        blocks:
          - type: paragraph
            body: >
