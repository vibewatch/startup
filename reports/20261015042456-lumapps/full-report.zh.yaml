      - number: '2.3'
        title: 测算可信度受代理指标和相互冲突的实时规模口径限制
        blocks:
          - type: paragraph
            body: >-
              尽调的主要约束不是品类野心不足，而是缺少独立基准验证的市场测算和统一的运营指标。公司材料给出宽泛的 AI 支出、采用率统计和存量客户代理指标，却没有披露分客群定价、预算归属，也没有为 Beekeeper 和
              Comeen 合并后的产品边界提供可复现的 SAM/SOM
              方法。各方公开宣称的规模也不一致，官方和第三方页面列出的用户数、客户数各不相同。因此，市场故事在方向上可信，但要把品类叙事转化为可服务收入池，仍需要管理层证据。
            claimRefs:
              - CM008
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: 展品
        blocks:
          - type: callout
            title: 融合创造新品类
            body: LumApps 不只是销售更好的内联网；它试图把沟通、工作流自动化、AI 智能体、一线运营和工作场所服务，压缩进一个员工中心预算故事。
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM014
          - type: callout
            title: 估值工作仍需要管理层级别的市场测算证据
            body: 公开材料说明了问题为何存在、品类为何可能扩大，但没有提供可复现的合并后 SAM/SOM 模型或一套统一的规模指标。
            calloutType: risk
            claimRefs:
              - CM008
              - CM012
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合覆盖套件、内联网同业和工作流替代品
        blocks:
          - type: paragraph
            body: >-
              现有证据指向一个分层竞争集合。公司发布的对比材料将 Microsoft SharePoint、Workvivo、Simpplr、Unily、Confluence 和 Staffbase
              列为相关替代品；独立报道则把范围扩展到 Microsoft/Viva、Slack 相邻的员工体验工具以及 Workday 主导的劳动力平台。这一点很重要，因为 LumApps
              不只是在替代传统内联网，也在与套件原生的发布工具、沟通层、结构化知识系统和更广泛的员工体验平台竞争。最稳妥的理解是，买方把 LumApps 当作一个同时重叠多个品类的员工中心平台来评估；这扩大了
              TAM，也增加了能够依靠既有企业关系回应的在位厂商数量。
            claimRefs:
              - CP001
              - CP003
              - CP008
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP006
              - CP008
              - CP012
              - CP015
