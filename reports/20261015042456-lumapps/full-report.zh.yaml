  - id: TV002
    title: 正论 / 反论表
    columns:
      - 立场
      - 有证据支持的论点
      - 什么会改变这一判断
    rows:
      - - 正论
        - LumApps 的 AI 员工中心叙事有可信度，覆盖通信、工作流、搜索，以及 Microsoft、Google 和企业应用之间的集成。
        - 如果能独立证明这些工作流已经变现，判断会更有把握。
      - - 正论
        - 收购 Comeen 让平台从数字工作流延伸到员工工作体验和实体办公服务。
        - 清晰的并购后采用曲线和交叉销售证据，会让这种覆盖面更有价值。
      - - 反论
        - 公开证据仍缺少当前估值、融资条款、NRR 和毛利率；独立报道则凸显企业采用 AI 普遍面临阻力。
        - 管理层披露经济指标和条款，是打破僵局的关键；在此之前，建议仍应保持谨慎。
    notes: 这些论点刻意与可能改变判断的证据配对，避免本表仅凭产品或品类证明就夸大支持力度。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV008
      - CV010
      - CV012
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - Comeen 按计划完成整合，AI agent 从定位走向可量化的工作流采用，管理层披露有吸引力的留存率和利润率指标。
        - 公开证据仍需提供最新估值标记；上行空间取决于已披露的经济指标能否支撑软件溢价定价。
        - 管理层发布经验证的采用率、NRR 和利润率数据。
        - AI 变现延迟，或并购后执行缓慢。
      - - 基准
        - LumApps 保持品类相关性和客户规模，但披露仍有限，市场主要看到的是战略平台叙事。
        - 继续跟踪仍合适，因为公开证据支持关注，但不足以支撑价格判断。
        - 产品证明持续存在，但经济质量披露仍不完整。
        - 又一次融资发生，却没有透明条款或运营质量证据。
      - - 悲观
        - 整合复杂度和企业采用 AI 的阻力使 ROI 低于预期，覆盖面虽广，却没有足够的变现证明。
        - 如果没有披露条款，投资者可能是在为叙事而非经验证的经济指标付费。
        - 尽管平台扩张，采用指标或客户成果仍未改善。
        - 扩张投入后，管理层无法展示留存率、利润率或里程碑进展。
    notes: 审阅过的公开记录不支持精确估值区间，因此情景逻辑用投资判断条件和概率信号表达，而不是未经支持的倍数。
    claimRefs:
      - CV004
      - CV007
      - CV008
      - CV011
      - CV013
      - CV014
      - CV016
