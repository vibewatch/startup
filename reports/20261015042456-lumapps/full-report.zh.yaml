  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 产品证明和战略覆盖面确实存在，但缺少价格支撑，且执行依赖整合，因此建议仍为继续跟踪。
    data:
      nodes:
        - label: 产品证明
          value: 2026 Gartner leader
          note: 品类认可支持相关性，但不支持价格判断。
        - label: 使用规模
          value: 7M+ users, thousands of organizations
          note: 体现分布和采用覆盖面。
        - label: 战略覆盖面
          value: AI hub + frontline + Comeen workplace layer
          note: 扩张扩大了数字和实体工作流上的选择空间。
        - label: 采用阻力
          value: 18% integrated / 32% regular agent use / 72% cite workflow friction
          note: 独立报道提示企业采用 AI 存在执行风险。
        - label: 缺少价格支撑
          value: No public valuation mark, NRR, gross margin, or financing terms
          note: 没有这些输入，价格判断只能是推测。
        - label: 建议
          value: track
          note: 只有管理层提供当前条款和经济质量数据后，才重新评估。
    approximationNotes: 这是一条定性决策链；节点值重复已引用的事实或明确的证据缺口，而不是暗示转化率。
    claimRefs:
      - CV005
      - CV006
      - CV010
      - CV014
      - CV015
