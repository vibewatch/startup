chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、产品范围与当前定位
        blocks:
          - type: paragraph
            body: >-
              LumApps 当前的官方定位已经超出传统内联网厂商。其主页称公司是“领先的 AI 员工中心”，并表示平台连接员工体验中的人员、工具、AI
              智能体和知识；相邻产品页面则将其描述为受治理的中心，把沟通、自动化、微学习、工作流和企业搜索整合到一个界面中。现有官方产品证据还显示，LumApps 可接入 Microsoft 365、Google
              Workspace、Workday 和 ServiceNow，并采用基于权限的信息访问，而不是泛化的公共 AI 层。2026 年 6 月的独立报道进一步表明，LumApps 试图把 AI
              试验转化为工作流级别的员工采用，而不是再添一个独立助手。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
      - number: '1.2'
        title: 规模信号、员工覆盖与披露边界
        blocks:
          - type: paragraph
            body: >-
              现有规模证据总体偏正面，但口径并不能直接比较。官网称 LumApps 获得超过 700 万名员工信任；2025 年 9 月公司新闻稿称，员工中心当时已为超过 10M 名员工提供沟通和工作流支持；LeadIQ
              则列出 LumApps 覆盖 750 家客户、超过 600 万用户，员工规模为 501-1000 人。Beekeeper 的整合页面还称，在合并叙事发布时，LumApps 服务超过 750
              家客户，Beekeeper 超过 1,500 家。上述数字可能混合了合并前后时期，也可能采用员工触达数、软件用户数和客户账户数等不同分母，因此只能说明企业规模，不能据此确认当前合并实体的客户数或员工数。
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.3'
        title: 管理层、控制权与里程碑时间线
        blocks:
          - type: paragraph
            body: >-
              现有资料中点名的管理层范围很窄，但仍与决策有关。2026 年 6 月的发布报道确认 Sébastien Ricard 为 CEO；2025 年 9 月的 Agent Hub 发布则引用 CTO Elie
              Mélois，说明产品叙事由高管推动，而不是由已披露的独立董事会叙事推动。最有力的独立融资与控制权证据来自 Forrester：LumApps 于 2025 年 7 月 2 日宣布与 Beekeeper
              合并，Bridgepoint 已在 2024 年收购 LumApps 的多数股权，合并后公司的估值超过 $1
              billion。同样重要的缺口仍在：现有资料没有披露创始人、当前董事会构成、累计融资、债务条款或经审计收入，因此尽管合并后的市场故事更强，治理和资本结构尽调仍有实质性缺口。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO014
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO013
              - CO014
              - CO015
