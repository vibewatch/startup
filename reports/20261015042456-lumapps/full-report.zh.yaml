  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界已超出传统内联网软件
        blocks:
          - type: paragraph
            body: >-
              LumApps 不再把可服务市场描述为静态内联网或沟通层。当前产品页面和发布材料将其定义为 AI
              员工中心，在一个受治理的工作空间中整合沟通、知识、工作流、智能体和业务系统访问。这个边界如今明确覆盖办公员工和一线员工；近期并购还把品类扩展到预约会议室、访客流程和数字标牌等工作场所服务。实际含义是，LumApps
              争夺的是融合后的员工体验预算，而不是狭窄的内容管理预算；但这种更宽的叙事也让 TAM/SAM 基准比较更难，因为多个相邻软件品类被捆在了一起。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM007
              - CM014
      - number: '2.2'
        title: 需求取决于工作流采用，而不只是内容发布
        blocks:
          - type: paragraph
            body: >-
              证据中最一致的需求信号，是企业内部的工作流割裂和 AI 采用不足。LumApps 及其 2026 年发布报道认为，企业已经为 AI
              工具投入预算，但员工仍难以在日常工作流中使用这些工具，因为界面彼此割裂，答案也没有建立在可信的业务语境上。这让 LumApps 对准了沟通、HR、IT
              和运营团队共同面对的痛点：他们需要一个受治理的统一层来分派请求、自动化任务并调出知识，而不是迫使员工在不同工具之间切换。因而，公开测算更适合采用一组采用率和存量基础视角，而不是把它包装成干净的已发布
              TAM/SAM/SOM 体系。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
