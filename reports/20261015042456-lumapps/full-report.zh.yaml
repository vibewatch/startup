              - CO015
      - number: '1.4'
        title: 展品
        blocks:
          - type: callout
            title: 证据支持规模和控制权，但不足以支撑投资级私营公司披露
            body: >-
              现有证据足以确立 LumApps 合并 Beekeeper 后的定位和 Bridgepoint
              支持的控制权故事，但在当前合并客户数、确切员工数、累计融资、债务条款、董事会构成和经审计财务数据方面仍然薄弱。因此，公司概况章节可以锚定身份和里程碑，却无法为估值判断提供干净的资本结构或运营基线。
