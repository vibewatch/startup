        - 中，因为平台的价值主张是编排工作，而不只是回答问题。
        - 审查敏感 HR 与法律工作流的审批控制、基于角色的限制和可审计性。
      - - 随着 Agent Hub 扩展到第三方系统，连接器泛滥会增加合同与治理复杂度
        - 发布材料将 Agent Hub 定位为覆盖 Microsoft 365、Google Workspace、ServiceNow、Workday 及其他 企业工具，并逐个连接器扩大法律边界。
