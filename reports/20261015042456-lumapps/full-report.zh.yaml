  - id: TR003
    title: 合作伙伴 / 依赖风险登记表
    columns:
      - 依赖项
      - 交易对手 / 界面
      - 作用
      - 集中度信号
      - 失效情景
      - 严重性
      - 缓释措施
      - 剩余暴露
    rows:
      - - 超大规模云厂商生产力生态
        - Microsoft 365 与 Azure GPT；Google Workspace 与 Vertex AI
        - 身份、模型访问、工作流覆盖和日常工作的入口
        - LumApps 明确建立在两套技术栈之上，同时与原生 Copilot 争夺注意力和预算。
        - 原生套件 Copilot 或平台政策变化会压缩 LumApps 的差异化，或削弱其在 战略客户中的 API 杠杆。
        - 高
        - 保持跨套件且不偏向连接器；证明客户运行混合技术栈时的胜果，而不是只证明一种 超大规模云厂商单一生态。
        - 高，因为合作伙伴平台本身也是最可信的替代产品。
      - - Marketplace 与联合销售曝光
        - Microsoft Azure Marketplace 与 AppSource
        - 分发与采购加速
        - LumApps 表示，Marketplace 上线将把曝光扩大到 110 个国家，并让客户可以 使用 Azure 承诺额度采购。
        - 渠道优先级下降或联合销售支持减弱，会拖慢企业获客并降低 微软占比较高客户中的采购杠杆。
        - 中
        - 分散需求生成渠道，并证明 ROI 不依赖联合销售动作或 Marketplace 展位。
        - 中，因为渠道加速有价值，但本身不是持久护城河。
      - - Beekeeper 带来的一线差异化
        - Beekeeper 的排班管理、工资单访问、安全聊天与移动优先一线功能集
        - 相对于桌面中心型内联网厂商的一线切入点
        - Forrester 将这些功能视为合并产品和“桌面 + 一线”论点的核心。
        - 如果整合落后或客户迁移停滞，LumApps 会继承复杂性，却无法完全获取 一线优势。
        - 高
        - 按一线用例安排迁移顺序，并发布带有具名参考客户的统一路线图里程碑。
        - 在合并产品出现共同客户证据前，风险维持高位，不能只看相邻的营销叙事。
    notes: 最大的依赖是战略性的，而非是否可用——LumApps 依赖合作伙伴生态，这些生态 既扩大覆盖，又加剧替代风险。
