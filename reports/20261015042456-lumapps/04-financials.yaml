      - "Diligence ask"
    rows:
      - ["Core employee-hub platform", "Enterprise software spanning communications, knowledge, learning, and access to business applications", "Undisclosed contract unit", "Publicly positioned as the primary product surface", "Medium", "Request current price book, contract metric, ACV bands, and renewal term."]
      - ["AI / agent expansion", "Agent Hub, Learning Agent, and Agent Studio add workflow and automation use cases on top of the hub", "Undisclosed module, add-on, seat, or usage unit", "Historical launch roadmap named Dec. 2025 early access and a Jun. 2026 GA target; current monetization is not disclosed", "Medium", "Request current availability, attach rate, pilot-to-paid conversion, and module-specific pricing."]
      - ["Implementation and bespoke delivery", "Forward-Deployment Engineering supports customer-specific agents and deployment work", "Project / service", "Services component is implied, but revenue mix is undisclosed", "Low", "Request services share of revenue, implementation duration, and utilization."]
      - ["Integration ecosystem", "Microsoft 365, Google Workspace, ServiceNow, Workday, and 50+ connectors broaden the addressable workflow surface", "Undisclosed bundling or connector-access unit", "Official product surface is visible; integration-related revenue and channel economics are not", "Low", "Request connector packaging, partner terms, and integration-driven expansion ARR."]
    notes: "Rows summarize reviewed public evidence. Product surfaces and historical rollout milestones are visible, but recognized revenue mix and realized pricing are not."
    claimRefs: ["CI004", "CI005", "CI006", "CI007", "CI008", "CI015"]
  - id: "TI002"
    title: "Pricing / monetization table"
    columns:
      - "Offer / benchmark"
      - "Price / unit / contract"
      - "List vs. realized pricing"
      - "Discounts / unknowns"
      - "Evidence status"
    rows:
      - ["LumApps core platform", "Not publicly disclosed", "List price not public; realized pricing unknown", "Contract term, seat metric, bundling, and discount ladders are not disclosed", "Reviewed LumApps pages describe the offer but not its commercial terms."]
      - ["LumApps AI / agent modules", "Not publicly disclosed", "Functionality and historical rollout plans are disclosed without realized pricing", "Unknown whether monetized as add-on seats, usage, services, or bundle uplift", "Reviewed launch and platform pages provide no price or contract unit."]
      - ["Implementation / bespoke agents", "No public SOW or deployment price", "No list-versus-realized visibility", "Unknown minimum services package, migration fees, or Forward-Deployment Engineering economics", "Reviewed launch coverage establishes the delivery model, not its pricing."]
      - ["Workvivo benchmark", "Per-user, per-month subscription billed annually", "Pricing mechanic disclosed for the benchmark vendor, not for LumApps", "Exact rate is absent from the reviewed text; a LumApps equivalent is not disclosed", "Competitor benchmark only; it cannot be attributed to LumApps."]
    notes: "This is a pricing-disclosure table, not a market-price table. Null-equivalent entries reflect missing public LumApps monetization detail in the assigned pool."
    claimRefs: ["CI012", "CI013"]
  - id: "TI003"
    title: "Unit economics table"
    columns:
      - "Metric"
      - "Value / status"
      - "Confidence"
      - "Why it matters"
      - "Diligence ask"
    rows:
      - ["Employee reach proxy", "Conflicting public claims: 'more than seven million employees' vs. 'more than 10 million employees'", "Low", "Scale is a top-line traction proxy, but inconsistent denominators weaken comparability", "Request reconciled current definition, date stamp, and paid-versus-reached breakdown."]
      - ["Deployment intensity", "Adverse signal that setup, advanced configuration, and report customization can require added effort", "Medium", "Implementation complexity can lengthen payback and increase services load", "Request average implementation time, customer-success staffing, and time-to-value by segment."]
      - ["Revenue / ARR", null, "Low", "Accounting revenue, recurring revenue, and revenue mix are needed to size commercial traction", "Request audited revenue, ARR definition, growth, and standalone-versus-combined revenue split."]
      - ["Core SaaS economics", null, "Low", "Gross margin, CAC, payback, NRR, and churn determine revenue quality and margin path", "Request cohort retention, logo/gross churn, CAC payback, and gross-margin bridge."]
      - ["Capital adequacy", null, "Low", "Cash, burn, runway, and debt terms determine financing dependency and next-round pressure", "Request current cash balance, monthly burn, runway, debt schedule, and covenant package."]
    notes: "Null values mean the assigned public pool does not expose the metric. The table separates observed public proxies from private underwriting inputs rather than forcing SaaS precision from marketing material."
    claimRefs: ["CI001", "CI002", "CI003", "CI010", "CI011", "CI014", "CI016"]
