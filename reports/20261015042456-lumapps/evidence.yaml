evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      Current board composition, founder identities, and any disclosed governance rights tied to Bridgepoint's majority
      ownership.
    whyItMatters: Governance concentration and succession risk cannot be evaluated from executive product-launch coverage alone.
    diligencePath: >-
      Request the latest board list, observer rights, founder ownership summary, and any sponsor governance documents
      from management.
    relatedQuestionRefs:
      - QO003
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: capitalization
    missingEvidence: >-
      Exact cap table, total capital raised, debt facilities, interest burden, and current equity ownership after the
      Beekeeper transaction.
    whyItMatters: >-
      Private-company control and financing terms materially affect downside risk, sponsor incentives, and valuation
      support.
    diligencePath: >-
      Obtain the latest financing history, debt schedule, and post-merger cap table from management or sponsor
      materials.
    relatedQuestionRefs:
      - QO004
      - QO007
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: >-
      A reconciled current combined customer count, user count, and exact headcount using one denominator and date
      basis.
    whyItMatters: >-
      The retained pool clearly shows enterprise scale, but mixed users-versus-employees and pre-versus-post-merger
      figures are not sufficient for clean benchmarking.
    diligencePath: >-
      Ask for a dated KPI pack covering paying customers, active users, employee reach, and FTE headcount on a single
      reporting date.
    relatedQuestionRefs:
      - QO005
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Current revenue, ARR, gross margin, NRR, and any audited financial statements or management-quality financial
      summaries.
    whyItMatters: >-
      Without operating metrics, the control and product milestones cannot be translated into underwriting-quality
      financial quality or valuation efficiency judgments.
    diligencePath: >-
      Request audited financials or a board-quality operating review with revenue, margin, retention, and cash-flow
      detail.
    relatedQuestionRefs:
      - QO004
      - QO007
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A management-grade TAM/SAM/SOM model for the post-Beekeeper and post-Comeen employee-hub category, with segment
      definitions, pricing assumptions, and geography splits.
    whyItMatters: >-
      Without a reproducible serviceable-market model, valuation work depends on narrative category creation and proxy
      metrics instead of revenue-linked market math.
    diligencePath: >-
      Request board or planning materials that show target segments, average contract values, penetration assumptions,
      and management’s own market model.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-segmentation
    missingEvidence: >-
      Public evidence that names the primary budget owner, pricing basis, and contract scope for communications, HR, IT,
      operations, and workplace-service deployments.
    whyItMatters: >-
      Buyer and payer ambiguity affects sales-cycle assumptions, competitive set, and which budgets can realistically
      support the broader employee-hub thesis.
    diligencePath: Ask for pricing sheets, sample deal structures, and customer references broken out by department-led use case.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: scale-claims
    missingEvidence: >-
      One reconciled definition for users, employees reached, customers, and active seats across current LumApps
      surfaces.
    whyItMatters: >-
      Conflicting footprint figures weaken installed-base sizing and make it harder to benchmark penetration, expansion
      potential, and valuation support.
    diligencePath: >-
      Request a current KPI bridge that reconciles marketed users, paid seats, active monthly users, customers, and
      legacy vs. combined-entity figures.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Current LumApps and competitor price books, discount ranges, minimum seat commitments, and implementation services
      assumptions.
    whyItMatters: >-
      Enterprise intranet decisions often hinge on bundle economics and services burden, and public retained sources do
      not quantify those trade-offs.
    diligencePath: >-
      Request current sales collateral, recent customer proposals, or RFP bid sheets for LumApps, Microsoft/Viva, Unily,
      and Simpplr.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: moat-durability
    missingEvidence: Independent win-loss data, migration case studies, and competitive response pricing in Microsoft-heavy accounts.
    whyItMatters: >-
      Without direct displacement evidence, the chapter can describe positioning but cannot fully underwrite moat
      durability against suite incumbents.
    diligencePath: >-
      Obtain CRM win-loss reports, customer reference calls, and third-party procurement evidence from recent
      competitive evaluations.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, runway, debt facilities, covenant package, and next-round trigger.
    whyItMatters: Without a cash bridge and debt detail, investors cannot judge financing dependency or downside timing.
    diligencePath: >-
      Request the latest board package or treasury bridge covering cash, burn, debt schedule, covenant headroom, and
      planned financing milestones.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Current price book, contract unit, ACV/ARR bands, discount ladders, and renewal mechanics.
    whyItMatters: >-
      Pricing architecture determines revenue quality, expansion logic, and whether services or AI modules are additive
      or bundled.
    diligencePath: >-
      Request current commercial terms, standard MSA/order-form templates, and anonymized recent deal examples by
      segment.
    relatedQuestionRefs:
      - QI002
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, CAC, payback, NRR, logo churn, gross churn, and software-versus-services revenue mix.
    whyItMatters: These metrics determine whether expansion surfaces convert into durable, high-quality recurring economics.
    diligencePath: >-
      Request cohort retention files, gross-margin bridge, sales-efficiency pack, and revenue-mix split for software
      versus services.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: conflicting-data
    severity: material
    topic: employee-scale
    missingEvidence: >-
      A reconciled current definition and date stamp for the platform's employee-reach metric, including whether it
      refers to enabled users, active users, or total workers served.
    whyItMatters: >-
      A top-level traction proxy is currently inconsistent across reviewed official surfaces, weakening financial
      comparability and conversion analysis.
    diligencePath: >-
      Ask management to reconcile the seven-million and ten-million figures and tie them to paid customers, active
      users, and the post-Beekeeper combined entity.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: security-certifications
    missingEvidence: >-
      Independent public artifacts for current SOC 2 Type II or ISO scope, plus status-page or incident-history evidence
      tied to the combined platform.
    whyItMatters: >-
      Enterprise product claims are easier to underwrite when governance and uptime are independently validated rather
      than described only in marketing copy.
    diligencePath: >-
      Request the current trust-center package, certificates or bridge letters, and a 12-month incident/postmortem
      summary.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: platform-unification
    missingEvidence: >-
      Customer-facing milestones and architecture detail for converging legacy Beekeeper frontline capabilities and
      workplace-experience modules into one platform.
    whyItMatters: >-
      Integration complexity can affect roadmap credibility, service quality, and the amount of technical debt hidden
      inside the broader employee-hub story.
    diligencePath: >-
      Request the post-merger platform roadmap, module dependency map, migration cohorts, and support burden by legacy
      product line.
    relatedQuestionRefs:
      - QE007
      - QE008
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Public developer-signal proxies such as repository telemetry, package downloads, API-forum activity, or a clear
      practitioner-community proxy for implementation maturity.
    whyItMatters: >-
      The chapter brief expects some external signal on builder or integration engagement, and the current source pack
      is almost entirely vendor-surface material.
    diligencePath: >-
      Collect GitHub or package metrics where available, or document a closer implementation-community proxy from
      partners and practitioners.
  - type: missing-source
    severity: material
    topic: adoption-outcomes
    missingEvidence: >-
      Independent production metrics for agent usage, workflow completion, ticket deflection, or ROI after the 2025-2026
      product launches.
    whyItMatters: >-
      The main underwriting question is whether LumApps is a sticky operational hub or primarily a broadened messaging
      layer with adjacent AI features.
    diligencePath: Request customer dashboards, reference calls, or case studies with before/after operational metrics by use case.
    relatedQuestionRefs:
      - QE005
      - QE006
  - type: private-evidence-only
    severity: material
