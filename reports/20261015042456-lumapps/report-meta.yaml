  topStrengths:
    - Credible AI employee-hub positioning with broad enterprise integrations.
    - Real merger-backed scale and analyst recognition across desk and frontline use cases.
    - Broad workflow surface that can expand account value if adoption converts.
  topRisks:
    - Integration execution risk across LumApps, Beekeeper, and Agent Hub rollout.
    - Public opacity on NRR, gross margin, debt terms, and post-merger control scope.
    - Partner dependence on Microsoft and Google plus custom deployment burden.
    - Valuation remains stretched against incomplete underwriting evidence.
  unresolvedGaps:
    - >-
      Combined-entity NRR, gross margin, churn, and audited FY2025 revenue; standalone vs. Beekeeper revenue split and
      cross-sell realized synergy.
    - Post-merger cap-table structure, Bridgepoint debt facility terms, interest coverage, and covenant details.
    - >-
      Product integration roadmap: unified platform timeline, engineering allocation, and customer-facing migration
      milestones.
    - Microsoft Viva displacement evidence, customer switch-back cases, and competitive response pricing.
    - >-
      Independent security certifications, SOC 2 Type II scope post-merger, GDPR posture, and any regulatory or legal
      proceedings.
