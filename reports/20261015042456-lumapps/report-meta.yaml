companyProfile:
  summary: >-
    LumApps is a PE-backed private enterprise SaaS company that now positions itself as an AI employee hub, extending a
    governed intranet into communications, automation, microlearning, workflows, AI agents, and enterprise search for
    desk-based and frontline workers. The current public record supports a credible merger-backed scale story through
    the Beekeeper combination and Bridgepoint ownership, but it still leaves core underwriting inputs such as current
    revenue, margin, retention, debt terms, and exact combined customer economics undisclosed.
