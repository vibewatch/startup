          detail: Probability over the next 12-18 months
        - label: Impact
          detail: Effect on underwriting or investment conviction
        - label: Mitigation maturity
          detail: Strength of public mitigations visible in the assigned pool
        - label: Residual exposure
          detail: Severity after current mitigations
      rows:
        - label: Post-merger integration and migration proof
          values: [High, High, Medium, High]
        - label: Custom-agent services burden
          values: [Medium, High, Low, High]
        - label: Partner ecosystem competition
          values: [High, High, Medium, High]
        - label: AI governance and trust-pack disclosure
          values: [Medium, High, Medium, High]
        - label: Enterprise adoption drag
          values: [High, Medium, Medium, Medium]
        - label: Financial KPI opacity
          values: [High, Medium, Low, High]
    approximationNotes: Qualitative scoring synthesizes company, partner, analyst, and independent commentary from the assigned pool rather than a disclosed company risk model.
    claimRefs: [CR002, CR004, CR008, CR009, CR010, CR012, CR014, CR015]
callouts:
  - calloutType: risk
    title: Core thesis-break risk
    body: The main kill criterion is not whether LumApps can describe an AI employee hub; it is whether the combined LumApps-Beekeeper platform can show unified customer adoption without leaning on expensive custom engineering or partner ecosystems that can substitute it.
    claimRefs: [CR004, CR009, CR012, CR014, CR016]
  - calloutType: recommendation
    title: Diligence gate before underwriting
    body: Treat security, migration, and unit-economics evidence as hard gating items. If management cannot produce a current trust pack, post-merger migration dashboard, and basic NRR or margin disclosure, the residual-risk profile remains too open for a confident price-sensitive recommendation.
    claimRefs: [CR002, CR010, CR015, CR016]
