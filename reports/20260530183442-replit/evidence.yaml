evidenceGaps:
  - type: missing-source
    severity: material
    topic: leadership-bench-and-governance
    missingEvidence: >-
      A current board roster, observer list, and investor-rights summary covering who actually controls governance after
      the 2026 financing.
    whyItMatters: >-
      Public sources support funding scale but not control dynamics, liquidation preferences, or who can shape strategic
      decisions.
    diligencePath: Request the board list, investor-rights agreement summary, and an updated cap table from management or counsel.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, gross margin, burn, cash balance, and runway metrics with management or audited support.
    whyItMatters: >-
      Chapter one can anchor valuation and growth signals, but investment judgment still depends on economics that are
      not publicly disclosed in retained sources.
    diligencePath: Request board decks or management financials showing ARR, gross margin, burn, cash, and 12-month operating plan.
    relatedQuestionRefs:
      - QO027
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: headquarters-and-headcount
    missingEvidence: >-
      A primary company statement or legal filing that definitively states current headquarters and exact employee
      count.
    whyItMatters: >-
      Public sources disagree on headquarters, and the visible employee signal is too thin to underwrite current
      organizational scale.
    diligencePath: >-
      Request the current employee count, office footprint, and legal-entity headquarters language used in board and HR
      materials.
    relatedQuestionRefs:
      - QO028
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 public chronology
    missingEvidence: >-
      A fuller internal chronology of launches, outages, governance changes, and large enterprise wins beyond the public
      press trail.
    whyItMatters: >-
      The chapter can build a credible public timeline, but internal sequencing may materially change how execution
      quality and risk are interpreted.
    diligencePath: >-
      Request a management-prepared milestone timeline covering launches, incidents, funding closes, and major customer
      expansions from 2016 onward.
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: A single comparable market definition that cleanly maps Replit to one published TAM, SAM, and SOM framework.
    whyItMatters: >-
      The retained sources measure overlapping but non-identical categories, so valuation work can overstate
      addressability if it picks the broadest figure without boundary logic.
    diligencePath: >-
      Ask management to provide the internal segmentation it uses for AI coding, app-building, self-serve, team, and
      enterprise cohorts, then crosswalk those cohorts to one external market taxonomy.
    relatedQuestionRefs:
      - QM022
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-segmentation
    missingEvidence: >-
      Segment-level conversion, retention, and revenue mix by solo builders, founders or SMBs, cross-functional teams,
      and enterprise accounts.
    whyItMatters: >-
      Public role pages prove demand intent but do not show how much of non-developer usage becomes repeat paid
      consumption or governed enterprise revenue.
    diligencePath: Request cohort data on credit consumption, paid-seat mix, expansion, and churn by user type and deployment stage.
    relatedQuestionRefs:
      - QM023
      - QM025
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: adoption-quality
    missingEvidence: >-
      A recent non-paywalled benchmark separating prototype creation volume from production-standardized AI software
      usage.
    whyItMatters: >-
      High top-of-funnel adoption can mask low conversion into durable, governed workloads, which is the difference
      between experimentation and a defendable enterprise market.
    diligencePath: >-
      Pair management funnel data with customer interviews on how often Replit prototypes move into maintained
      production software.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM004
  - type: stale
    severity: minor
    topic: low-code-adjacency
    missingEvidence: >-
      A current public crosswalk that cleanly separates low-code workflow automation from AI-native code-generation
      platforms in 2026.
    whyItMatters: >-
      Without that crosswalk, low-code adjacency is directionally useful but still too broad to convert into a
      company-specific SAM.
    diligencePath: >-
      Use a fresh analyst brief or customer-budget survey that breaks low-code spend into internal automation,
      citizen-development, and AI-native software-creation buckets.
    relatedQuestionRefs:
      - QM021
      - QM022
    relatedTableRefs:
      - TM001
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-model
    missingEvidence: Realized enterprise pricing, discount bands, and credit-consumption patterns by vendor and customer segment.
    whyItMatters: >-
      List pricing can badly misstate true competitive economics when usage-heavy plans, negotiated minimums, or pooled
      enterprise contracts dominate actual spend.
    diligencePath: >-
      Request management win-loss pricing analyses against GitHub, Cursor, Lovable, Anthropic, and Devin, including
      usage consumption and discounting by segment.
    relatedQuestionRefs:
      - QP027
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Migration, coexistence, and retention data showing whether Replit users stay on-platform as projects mature or
      move to modular incumbent stacks.
    whyItMatters: >-
      Replit’s moat depends on proving that integrated workflow convenience survives the transition from prototype to
      governed production use.
    diligencePath: >-
      Ask for cohort retention by workload stage, GitHub sync or export behavior, and competitive displacement data
      versus Copilot, Cursor, Lovable, and Vercel.
    relatedQuestionRefs:
      - QP028
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: material
    topic: benchmarking
    missingEvidence: >-
      A current independent benchmark comparing production-quality outcomes, security review burden, and
      cost-per-completed-task across major AI coding tools.
    whyItMatters: >-
      Funding and product pages say little about which tool actually performs best on governed enterprise software work
      once verification and rework are counted.
    diligencePath: >-
      Run a common task benchmark across Replit, Cursor, Windsurf, Copilot, Claude Code, Devin, Lovable, and v0 using
      identical tasks, review criteria, and cost accounting.
    relatedQuestionRefs:
      - QP023
      - QP025
    relatedTableRefs:
      - TP002
      - TP004
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-landscape
    missingEvidence: >-
      A clean public source that ranks all private prompt-to-app and coding-agent competitors by enterprise seat count
      or revenue on the same basis.
    whyItMatters: >-
      The competitive field is fragmenting quickly, so today’s product leaders may not match tomorrow’s revenue or
      enterprise-penetration leaders.
    diligencePath: >-
      Track future private-market disclosures and ask management for current win-loss by competitor class rather than
      relying on sporadic funding headlines.
    relatedQuestionRefs:
      - QP026
      - QP028
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-burn
    missingEvidence: Audited or board-approved gross margin, cash balance, monthly burn, and runway by month.
    whyItMatters: >-
      Without these metrics, capital adequacy and unit economics cannot be underwritten beyond funding headlines and one
      external estimate.
    diligencePath: Request monthly management accounts, cash bridge, and margin bridge by product surface for the last 12 months.
    relatedQuestionRefs:
      - QI021
      - QI024
    relatedTableRefs:
      - TI003
      - TI004
  - type: private-evidence-only
