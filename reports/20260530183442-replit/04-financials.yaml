    {
      "id": "pricing-architecture-and-revenue-model",
      "title": "Pricing architecture and revenue model",
      "body": "Replit's monetization model is no longer a simple seat subscription. Official pricing and billing docs show a layered structure: Starter remains free, Core is a low-entry paid plan, Pro is a larger credit-bearing plan, and Enterprise moves into negotiated terms, pooled credits, invoicing, annual commitments, and governance features such as SSO, SCIM, and single-tenant options. Just as importantly, Replit now monetizes more than access to the editor. Official billing pages say monthly credits apply to Agent usage as well as publishing, storage, and database services, and usage-based billing extends to outbound data transfer, compute units, requests, database compute time, and storage. That architecture makes economic sense for an AI-native build platform because some workloads are materially more expensive to serve than others. Replit's own pricing recap says the old flat checkpoint model broke once Agent could work autonomously for much longer sessions and sometimes cost the company more than a fixed fee could recover. The consequence is a financially rational but operationally sensitive model: revenue can scale with customer usage and complexity, but realized pricing becomes harder for customers to predict and harder for outsiders to model from list-price pages alone.",
