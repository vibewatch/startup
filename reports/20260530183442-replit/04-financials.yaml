    "number": 4,
    "title": "Financials and Unit Economics",
    "summary": "Replit now monetizes a hybrid seat-plus-usage stack that ties AI and hosting consumption to credits, checkpoints, and infrastructure billing, which explains both its fast topline acceleration and its pricing friction. Public evidence is strong on list pricing, funding, and growth markers, but weak on realized enterprise pricing, gross margin durability, burn, runway, and sales efficiency, so the financial verdict is commercially promising but still disclosure-limited."
