      "id": "UU001",
      "title": "Segment map and buyer / user / payer structure",
      "body": "Replit's public customer story is no longer limited to individual coders. The retained pricing, Pro, SMB, enterprise, education, and 2026 blog surfaces show a deliberately layered segment map. At the low end, the pricing page still supports an exploration path for hobbyists and trial users. The Pro/Core surface then targets people who build every day and need more compute, private workspaces, collaboration, and predictable support. A separate SMB use-case page speaks directly to business owners and operators who do not have a technical team but still want to build custom CRMs, dashboards, portals, and workflow automation. The enterprise surface broadens the buyer set even further by explicitly targeting sales, marketing, operations, finance, HR, and legal alongside engineering.\n\nThat matters because Replit is effectively selling different things to different actors. In individual and education settings, the user and buyer often collapse into one person: a student, founder, or developer. In SMB settings, the buyer is usually the owner or operator who wants software output without hiring a development team. In enterprise, the end user may be an analyst, PM, operations lead, or engineer, but the payer increasingly looks like an IT, security, or procurement-controlled budget once SSO, SCIM, RBAC, and deployment governance enter the picture. Public education proof is real but lighter than enterprise proof: Replit clearly markets to students, educators, and campus leaders, while the partner page shows government and education tracks but does not supply direct named government customer deployments. Overall, the evidence supports a widening buyer funnel from learners and solo builders to cross-functional enterprise teams.",
