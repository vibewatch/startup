    {
      "id": "UU005",
      "title": "Durability, expansion potential, and concentration gaps",
      "body": "Public evidence supports expansion much better than it supports retention. The combination of case studies, enterprise controls, and partner announcements suggests Replit can land in multiple ways: individual builders, non-technical operators, enterprise champions, education users, and partner-driven go-to-market motions. Once usage becomes embedded in internal dashboards, operational workflows, and governed workspaces, the platform can expand by adding collaborators, published apps, departments, or formal enterprise controls. That is the core customer upside in this chapter.\n\nThe missing half of the diligence picture is durability disclosure. None of the retained primary or reputable third-party sources provide public NRR, GRR, contract lengths, renewal rates, or customer concentration metrics. The public customer proof set is also not revenue weighted; a logo wall, a case study, and a partner press release do not tell investors what share of ARR sits with the top ten accounts or what percentage of enterprise trials actually become durable seat or usage growth. Government/public-sector proof is another gap: Replit clearly wants that lane through partner programming, but direct public-sector customer evidence remains much thinner than enterprise or education evidence. The right diligence interpretation is that Replit's customer adoption narrative is real and unusually broad, but its long-term retention economics and concentration risk still need management-level data rather than public-web inference.",
