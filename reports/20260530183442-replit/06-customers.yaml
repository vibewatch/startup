  "chapter": {
    "number": 6,
    "title": "Customers and Adoption",
    "summary": "Replit now has unusually broad public adoption proof for a developer-tool-origin company: official 2026 posts claim more than 50 million users and usage inside 85% of the Fortune 500, while CNBC says the platform has crossed 500,000 professional business customers. The strongest named proof comes from fresh official stories showing live usage at Leatherman, Plaid, Rokt, Helix Electric, Northern Health, and GenAIPI, plus enterprise references from Visa, Accenture, Google Cloud, and CNBC. The common pattern is fast internal-tool or workflow creation by mixed technical and non-technical teams. The biggest gaps are around retention, concentration, and spend predictability: Replit discloses far more about top-of-funnel adoption than NRR, contract duration, or customer mix, and 2025 adverse reporting shows real billing and reliability friction."
  },
  "sections": [
