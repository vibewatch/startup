    "number": 3,
    "title": "Competitors",
    "summary": "Replit is squeezed from both sides: pro-developer IDE agents such as Cursor, Windsurf, Claude Code, Devin, and GitHub Copilot attack coding depth and enterprise workflow fit, while Lovable, Bolt, and v0 attack prompt-to-app speed for non-engineers. Replit still has one of the broadest browser-native build-to-deploy bundles, but the moat looks more like workflow compression and cross-functional accessibility than hard lock-in, and incumbent distribution plus multi-homing materially limit durability."
  },
  "sections": [
    {
      "id": "landscape-and-segmentation",
      "title": "Landscape: direct peers, incumbents, adjacents, and likely entrants",
      "body": "The competitive set around Replit is no longer one neat list of browser IDEs. The direct peer lane splits into IDE-native coding agents such as Cursor and Windsurf and browser-native app builders such as Lovable, Bolt, and v0. Cursor and Windsurf bias toward professional developers who already live in code editors and want agents, tab completion, code review, and enterprise administration layered into familiar workflows. Lovable, Bolt, and v0 compete more from the opposite direction: they promise that a prompt can turn into a working website or app quickly, with design, publishing, and collaboration close at hand. Replit is unusual because it tries to span both jobs at once. Its retained docs and enterprise pages still describe a browser-native path from prompt to build, publish, and governed sharing, while also targeting product managers, designers, operators, and other nontraditional builders. The incumbent and substitute layer matters just as much. GitHub Copilot, Codespaces, and VS Code together form the strongest status-quo stack for teams that already build around GitHub and cloud infrastructure, while Claude Code and Devin push agentic coding inside existing local or enterprise environments. That means Replit is competing less against one company than against several bundles that solve the same job from different starting points.",
