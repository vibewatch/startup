  topStrengths:
    - >-
      Broad buyer reach with 50M+ users, 85% Fortune 500 reach, and 500K professional business customers in public
      sources.
    - >-
      Browser-native full-stack workflow combines prompt-driven creation, data, hosting, monitoring, and enterprise
      controls in one surface.
    - >-
      Enterprise traction and capital backing are reinforced by named customers and partners including Visa, Accenture,
      and Google Cloud.
  topRisks:
    - >-
      Pricing and billing trust remain fragile after a disclosed overcharge incident and broader backlash to
      effort-based pricing.
    - >-
      AI reliability and safety incidents, including the public database-deletion complaint, show the
      prompt-to-production stack can still fail in costly ways.
    - Private-company opacity on ARR, NRR, burn, margin, and cap-table terms makes the $9B valuation hard to underwrite.
    - >-
      Platform and partner dependencies on Google Cloud, identity providers, and major channels add execution and margin
      risk.
  unresolvedGaps:
    - Current 2026 ARR or revenue, gross margin, burn, runway, and NRR remain undisclosed on the public record.
    - The March 2026 round's cap-table terms, liquidation preferences, and any secondary structure are not public.
    - >-
      Public evidence is broad on adoption but thin on revenue-weighted customer concentration, renewal rates, and
      enterprise contract depth.
    - >-
      Official and media sources disagree on headquarters (San Francisco vs. Foster City), and legal-entity-level
      confirmation was not retained.
