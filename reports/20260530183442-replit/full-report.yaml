  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current Mark and Revenue Anchors
        blocks:
          - type: paragraph
            body: >-
              Replit's current private mark is easy to state and much harder to underwrite. Official and major-news
              sources agree that the company raised a $400 million Series D in March 2026 at a $9 billion valuation,
              just six months after TechCrunch reported a $250 million round at a $3 billion valuation in September
              2025. That 3.0x step-up is extraordinary even by AI-software standards and immediately forces the
              valuation discussion onto revenue anchors rather than headline excitement. The most directly corroborated
              revenue figure in public circulation is the $150 million late-2025 annualized recurring revenue number
              carried by both TechCrunch and CNBC. On that anchor, the current price implies a 60.0x multiple.


              The problem is that not every public revenue number means the same thing. Sacra's 2025 updates estimate
              Replit at roughly $70 million ARR in April, $106 million in mid-2025, and $253 million ARR in October
              2025. Those estimates are useful directional markers, but they are modeled third-party views rather than
              audited company disclosures. If one uses Sacra's October estimate, the current mark drops to about 35.6x
              ARR. If one instead underwrites management's official claim that Replit is on track for $1 billion in
              run-rate revenue by the end of 2026, the same $9 billion valuation falls to only 9.0x forward ARR. The
              core valuation question is therefore not whether Replit is growing fast — it clearly is — but which
              revenue definition an investor is really paying against.
            claimRefs:
              - CV001
