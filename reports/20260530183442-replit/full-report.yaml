      - number: '8.5'
        title: Diligence Gaps and Thesis-Breakers
        blocks:
          - type: paragraph
            body: >-
              The most important adverse evidence is not that Replit lacks demand; it is that the valuation still
              requires faith in opaque variables. Forbes said the company would not comment on current revenue beyond
              the $1 billion year-end target, while public sources still do not show audited 2026 ARR, GAAP revenue,
              cash burn, NRR, or the cap-table waterfall behind the March 2026 round. That matters because
              private-company returns are shaped not only by headline valuation but by preference seniority,
              secondaries, and whether enterprise contracts are sticky or merely experimental.


              The risk side also has real operating evidence behind it. Axios reported that vibe-coding tools including
              Replit can leak sensitive data. The Register and InfoWorld both documented user frustration over pricing
              and cost overruns. None of those items disproves the bull case, but together they show why lofty growth
              assumptions can unravel if trust, predictability, or security lag adoption. Thesis-breakers to monitor are
              straightforward: slower monetization per business customer, repeat pricing or privacy incidents, and proof
              that enterprise breadth is not translating into durable economic depth. Until those questions are closed,
              the valuation deserves caution rather than celebration.
