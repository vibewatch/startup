  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Replit layers a browser-native builder experience over agent orchestration, built-in app services, cloud
      publishing, and external tool connectivity.
    data:
      layers:
        - label: Browser builder surface
          detail: Prompt box, Project Editor, Canvas, Preview, and Publishing pane keep design, code, and launch in one UI.
        - label: Agent orchestration layer
          detail: Plan Mode, Build Mode, task board, background tasks, and agent modes manage execution and review.
        - label: Built-in app services
          detail: >-
            Auth, managed database, App Storage, connectors, and testing tools are provisioned from inside the builder
            flow.
        - label: Runtime and operations layer
          detail: >-
            Snapshot publishing, autoscale or scheduled runtimes, domains, analytics, monitoring, and security workflows
            run after build time.
        - label: External ecosystems
          detail: >-
            Cloud providers, model providers, SaaS connectors, warehouses, MCP clients, and mobile distribution systems
            extend the stack beyond Replit itself.
