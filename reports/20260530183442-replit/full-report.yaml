      - number: '8.4'
        title: Recommendation and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation at the current mark is Track, with medium confidence and a stretched valuation stance.
              Replit has enough genuine proof — 50 million users, 500,000 professional business customers, enterprise
              partnerships across Microsoft, Google Cloud, Accenture, and Visa, and one of the fastest revenue ramps in
              software — that the company cannot be dismissed as pure hype. But the public evidence still does not
              support a clean Buy call at $9 billion because the revenue denominator remains contested, the company is
              still unprofitable, and disclosure on margin quality, retention, and the private cap table is thin.


              Entry discipline should therefore be explicit. A buyer paying today's price is effectively assuming that
              the company grows into a much lower forward multiple quickly, without severe multiple compression and
              without preference or secondary structures destroying downside protection. That is plausible, but it is
              not yet proven. Public evidence does not support underwriting a near-term IPO or a clear >2x return from
              the current mark without some combination of faster ARR realization, better margin disclosure, or a more
              attractive entry price. If pricing moved materially below the current round or if diligence showed cleaner
              unit economics than the public record suggests, the conclusion could improve quickly.
            claimRefs:
