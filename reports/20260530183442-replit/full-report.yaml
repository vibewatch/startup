      - number: '2.2'
        title: 'Multiple sizing lenses: narrow coding spend to broader software-creation adjacency'
        blocks:
          - type: paragraph
            body: >-
              No single market number does justice to Replit. The broadest retained lens comes from Menlo Ventures,
              which says enterprises spent $37 billion on generative AI in 2025 and $19 billion of that on AI
              applications. Inside that applications layer, Menlo’s departmental slice reached $7.3 billion and coding
              accounted for roughly $4.0 billion to $4.2 billion depending on whether one cites the official report or
              No Jitter’s summary. Narrower 2026 category definitions then move in different directions: Gartner pegs
              enterprise AI coding agents at roughly $9.8 billion to $11.0 billion annualized; Mordor puts AI code tools
              at $9.35 billion in 2026; and Business Research Company starts from $7.65 billion in 2025 with a path to
              $22.2 billion by 2030. Adjacent low-code estimates are larger again, with IDC’s LCNCIDT forecast reaching
              $21.0 billion in 2026 and Precedence’s low-code platform estimate at $15.81 billion in 2026. These figures
              are not directly additive or contradictory in a strict accounting sense, because each source uses a
              different category boundary. The right diligence posture is therefore to preserve several lenses: a broad
              AI-applications upper bound, a narrower coding-agent or code-tools band, and a low-code adjacency that
              shows why Replit’s aspirational market can expand beyond traditional developers.
