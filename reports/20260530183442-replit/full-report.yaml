  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and adjacent categories
        blocks:
          - type: paragraph
            body: >-
              The first analytical task is to define Replit’s market before trying to size it. Retained official pages
              show the product is no longer framed as a narrow coding copilot for engineers alone. Replit markets a
              workflow that starts with a prompt or PRD, turns that brief into a working prototype or app, and then
              keeps the user inside the same environment for collaboration, deployment, databases, and privacy controls.
              That means the relevant market boundary includes AI-assisted software creation and application-development
              workflow spend, not just autocomplete inside an IDE. It also means the chapter should distinguish included
              spend from tempting but overstated adjacencies. Included spend covers coding assistants and agents, AI
              app-building platforms, and the workflow budgets directly tied to turning an idea into running software.
              Excluded spend includes infrastructure and model-layer spending, outsourced development services, and
              generic chat interfaces that never become software-delivery workflows. Low-code and intelligent developer
              tech are adjacent because they expand the pool of people willing to build internal tools and lightweight
              apps, but they should not be treated as a one-to-one substitute for Replit’s present category. The real
              status-quo alternative is still internal build plus fragmented tools and handoffs.
