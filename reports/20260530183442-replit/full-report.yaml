      - number: '2.4'
        title: Growth drivers, adoption constraints, and the remaining diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The category is clearly expanding, but the evidence says the strongest drivers and the hardest constraints
              are happening at the same time. On the positive side, enterprise AI adoption is moving from pilots toward
              production. Menlo says 76% of AI use cases are now purchased rather than built internally and that 47% of
              AI deals make it to production, materially better than traditional SaaS. Gartner’s broader forecast also
              shows AI application-development platform spending rising in 2026, while McKinsey argues that
              organizations create more value when they redesign workflows and add governance around AI deployments.
              That combination favors platforms like Replit that bundle creation, iteration, and deployment. The
              constraints are equally important. Developer surveys show high usage but falling trust, and Sonar’s data
              is especially adverse: verification debt, personal-account usage, and low pre-commit checking all raise
              the cost of standardizing AI-generated software in production. Replit’s own pricing page acknowledges that
              Agent output is probabilistic and can make mistakes, which means the trust problem is not just external
              commentary. The core diligence gap is therefore not whether the category exists, but how much of the
              visible experimentation turns into durable paid usage by teams and enterprises. Public sources do not
              reveal Replit’s cohort mix, retention by user type, or the share of non-developer usage that survives past
              prototyping.
