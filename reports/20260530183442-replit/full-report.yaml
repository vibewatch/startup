      - number: '1.3'
        title: Funding history, valuation step-up, and strategic stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Replit’s financing trajectory is one of the strongest public parts of the record. TechCrunch and
              Georgian’s PRNewswire release agree that the company raised a $400 million Series D in March 2026 at a $9
              billion valuation led by Georgian, with a syndicate that included major financial investors plus strategic
              venture arms. That round looks more meaningful when placed against the prior benchmark: six months
              earlier, Replit had raised $250 million at a $3 billion valuation and said it was on track for $150
              million in annualized revenue. CNBC later reported $880 million of total funding and described the company
              as still unprofitable, which is directionally important because it shows the market is paying for growth
              and category position rather than already-proven operating leverage. The stakeholder map also extends
              beyond classic venture capital. Visa invested while already using the product internally, Accenture
              invested and partnered on enterprise delivery, and Google Cloud became Replit’s primary cloud provider
              under a multi-year partnership. Named enterprise customers such as Adobe, Atlassian, Databricks, Okta,
              PayPal, Zillow, and Labcorp add further commercial validation. Together, those relationships suggest
              Replit is building both a capital stack and a distribution stack around enterprise adoption, even though
              the precise control rights, liquidation preferences, and concentration of spend remain undisclosed.
