      - number: '1.2'
        title: Leadership bench, governance signals, and headquarters ambiguity
        blocks:
          - type: paragraph
            body: >-
              Public leadership evidence is unusually concrete at the named-executive level and unusually thin at the
              governance level. Replit’s about page lists Amjad Masad as Founder & CEO, Haya Odeh as Co-Founder, Design,
              Luis Héctor Chávez as CTO, Michele Catasta as President, and Scott Kennedy as VP of Engineering. That
              gives later chapters a usable management roster, but it also highlights key-person concentration around
              Masad and the founding team because public sources do not provide a clean board roster, observer list, or
              current ownership map. Governance disclosure is instead indirect, coming through product controls.
              Official enterprise materials emphasize SSO/SAML, SCIM, permissions, audit logs, approvals, and even
              single-tenant deployment options, which supports the story that Replit is trying to become acceptable
              inside large organizations. The cleanest unresolved issue is physical headquarters. Official and partner
              releases repeatedly describe Replit as headquartered in San Francisco, yet CNBC’s 2026 Disruptor profile
              and Forbes’ company profile list Foster City, California. The right chapter-one treatment is not to guess
              which is legally correct; it is to carry the discrepancy forward as an unresolved diligence item while
              still acknowledging that the company’s center of gravity is the San Francisco Bay Area and that public
              materials do identify a real management bench.
