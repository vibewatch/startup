            - Broad connector story but uneven admin burden by use case
            - Makes internal-tool and data-app builds more credible
            - Important paths still require third-party identity and permission setup
        - label: Mobile output
          values:
            - Medium
            - Browser-to-Expo workflow is documented and current
            - Expands addressable output types beyond web apps
            - Store distribution still depends on external tooling and accounts
