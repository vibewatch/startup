companyProfile:
  summary: >-
    Replit is a 2016-founded private company that positions itself as an agentic software creation platform for building
    applications from natural-language prompts. Its product combines browser-native app creation with integrated auth,
    data, deployment, monitoring, and enterprise controls, and public 2026 materials point to unusually broad adoption
    across developers, operators, founders, students, SMBs, and large enterprises. The company’s March 2026 Series D at
    a $9 billion valuation confirms strong investor support, but the public record still leaves key economics and
    governance details selectively disclosed.
