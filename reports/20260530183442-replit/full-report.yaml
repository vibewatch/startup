        - Named exposure of sensitive customer data from a Replit-built app
        - A credible report linking Replit workflows or defaults to material data exposure
        - Require product-default changes and compliance review before further enterprise underwriting
      - - Vendor or uptime concentration
        - Cluster of outages across cloud, identity, or publishing surfaces
        - Multiple material incidents in a quarter or one multi-hour incident on a strategic dependency
        - Re-rate reliability and support assumptions; ask for incident-response metrics by dependency
