  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Growth fails to outrun the current price
        - 2026-2027 ARR remains closer to ~$250M-$350M than to the $1B target
        - Current mark stays above plausible comp-based valuation bands
        - Treat the March 2026 price as too high for new capital
      - - Enterprise breadth proves shallow
        - Large customer logos do not translate into strong renewal, expansion, or ACV data
        - Bull case based on enterprise conversion weakens materially
        - Downgrade to research-more or avoid until retention is proven
      - - Preference stack is heavier than assumed
        - Diligence shows senior preferences or secondaries absorb a large share of flat/downside exits
        - Headline valuation overstates value available to a new investor
        - Reprice or walk away
      - - Pricing or privacy incidents repeat
        - Fresh cost-overrun or data-leak evidence emerges after 2026 upgrades
        - Premium multiple contracts as trust and governance weaken
        - Reduce valuation band and demand more downside protection
      - - Public comp multiples compress
        - Cloudflare or Datadog style premiums reset materially lower while Replit remains opaque and unprofitable
        - Base and bull scenario multiple assumptions no longer hold
        - Cut scenario bands and reassess entry discipline
      - - Company misses economics disclosure milestones
        - No audited 2026 ARR, margin, or burn disclosure arrives during the next diligence window
        - Opacity remains the central investment risk
        - Do not promote from Track to Buy
    notes: >-
      Triggers are designed as monitoring thresholds, not certainties. The central question is whether Replit earns the
      right to be valued as a premium AI platform before the market demands public-company-style transparency.
    claimRefs:
      - CV016
      - CV030
      - CV031
      - CV033
      - CV034
      - CV035
      - CV038
      - CV039
      - CV045
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Audited ARR and GAAP revenue
        - Board-level or audited 2026 revenue package
        - Closes the gap between $150M verified and $253M estimated anchors
        - Request latest board deck or audited management accounts
      - - Gross margin and burn
        - Gross margin, inference cost, hosting cost, operating loss, and cash burn
        - Current valuation assumes the business can scale into a healthier forward multiple
        - Review finance pack and workload-level gross-margin bridge
      - - NRR and contract durability
        - Cohort retention, expansion, ACV, duration, and churn for enterprise customers
        - Adoption breadth is not enough if monetization is shallow
        - Request sales and finance cohort tables
      - - Cap-table structure
        - Preference waterfall, participation rights, secondaries, and any unusual investor protections
        - Private structure can distort real return math versus the headline $9B mark
        - Review charter, financing docs, and secondary documents
      - - Incident-adjusted economics
        - Churn, credits, and support costs after pricing or security incidents
        - Adverse incidents can change both gross margin and customer trust
        - Request post-mortems plus cohort-level churn and credit data
      - - Enterprise pipeline quality
        - Pipeline conversion, partner-sourced volume, and channel dependence
        - Distinguishes genuine enterprise GTM maturity from partner-led narrative momentum
        - Request funnel data from GTM leadership
      - - Exit readiness
        - Public-company controls, audit cadence, and governance readiness for IPO or strategic sale
        - Current evidence supports optionality, not readiness
        - Review audit workstream and board governance package
    notes: >-
      These asks are ordered by impact on valuation. The first four are the most likely to change the recommendation
      materially; the last three affect confidence and downside protection.
    claimRefs:
      - CV018
      - CV030
      - CV031
      - CV037
      - CV041
      - CV044
