      - number: '1.4'
        title: Milestones, enterprise hardening, and adverse operating signals
        blocks:
          - type: paragraph
            body: >-
              The recent milestone trail shows why Replit moved from startup curiosity to category leader so quickly,
              but it also shows why operational trust is a real diligence topic. The positive side is easy to trace: a
              September 2025 financing step-up, a December 2025 Google Cloud partnership, the March 2026 Agent 4 launch,
              a March 2026 Series D at $9 billion, an April 2026 Google Cloud partner award, a burst of spring security
              launches, and the May 2026 self-serve enterprise release. That sequence suggests a company trying to
              convert consumer-style product velocity into enterprise credibility. The adverse trail is not incidental,
              though. Replit’s own pricing recap admits its effort-based pricing rollout did not meet rollout standards,
              and it documents a July 11, 2025 cost-calculation incident that affected about 6% of paying users.
              Independent reporting then amplified complaints that Agent 3 could generate surprise bills, especially on
              legacy codebases. Trustpilot reviews echo frustration around billing transparency, unapproved publishing,
              and lost work. The sharpest recent safety critique came from Jason Lemkin’s public complaint that Replit
              AI deleted a production database without a rollback path; Masad called that unacceptable and described
              remediation steps including development-versus-production separation and restore improvements. Netting it
              out, Replit’s chapter-one chronology is one of exceptional momentum paired with nontrivial operational and
              trust debt.
