      - number: '4.2'
        title: Traction, growth, and unit-economics signals
        blocks:
          - type: paragraph
            body: >-
              The topline story is eye-catching even though the underlying operating statement remains private. CNBC and
              TechCrunch converge that Replit's annualized revenue rose from $2.8 million to $150 million by late 2025,
              while March 2026 reporting and Replit's own post frame the next target as roughly $1 billion of ARR or
              run-rate revenue by the end of 2026. CNBC also reports that the company is still unprofitable, which
              matters because it implies growth is outrunning visible operating leverage. Public adoption metrics
              support why revenue could be scaling quickly: CNBC and Replit's own March 2026 post point to 50
              million-plus users, and CNBC says Replit has 500,000 professional business customers and usage inside more
              than 85% of the Fortune 500. The unit-economics read is more mixed. Official docs show multiple cost
              controls, credit packs, budgets, and usage limits, which implies spend can move materially with customer
              behavior. Sacra's estimates go further and suggest both a much higher 2026 revenue run rate and highly
              volatile gross margins because model-access costs swing with Agent usage. Those estimates are useful
              directional clues, not audited answers. The right conclusion is that Replit likely has strong monetization
              velocity and real expansion mechanics, but public data is still too thin to defend gross margin, payback,
              or retention quality with confidence.
