  - id: FE004
    title: Product maturity and capability map
    type: matrix
    layout: wide
    summary: >-
      Replit appears strongest where it directly controls the browser workflow and enterprise guardrails, while
      external-provider-heavy paths remain more conditional.
    data:
      columns:
        - Current breadth
        - Operational maturity signal
        - Primary buyer value
        - Public caveat
      rows:
        - label: Core build loop
          values:
            - High
            - Agent 4 plus task docs are detailed and current
            - Fast path from idea to working app
            - Output quality still varies with prompting and review
        - label: Deployment and runtime
          values:
            - High
            - Multiple deployment types plus monitoring and analytics
            - Lets Replit own launch and operations path
            - Public uptime and SLO data are limited
        - label: Security automation
          values:
            - Medium to high
            - Security Agent, Security Center, and Auto-Protect all launched in 2026
            - Pushes remediation closer to build and publish time
            - Independent efficacy evidence remains thin
        - label: Enterprise governance
          values:
            - High
            - Self-serve enterprise onboarding and admin features are productized
            - Shortens procurement and IT setup loops
            - Depth versus mature infra vendors is still hard to benchmark publicly
        - label: Data and connectors
          values:
