chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product model, and visible scale
        blocks:
          - type: paragraph
            body: >-
              Replit now frames itself less as a browser IDE and more as an agentic software-creation platform for
              anyone with an idea. Official materials say the product lets users build applications with natural
              language, then keep moving inside the same environment with authentication, database, hosting, monitoring,
              and third-party integrations already wired in. That positioning matters because the company is explicitly
              targeting nontraditional builders as well as engineers: its own April 2026 messaging says product
              managers, operators, founders, students, and small business owners are shipping production software on the
              platform. The pricing ladder reinforces the go-to-market shape. Starter is free, while Core and Pro are
              annual subscription tiers that bundle monthly credits and parallel-agent capacity, showing that Replit
              monetizes both seats and usage. Scale claims are still mostly company-reported, but they are repeated
              across official and partner materials and partially corroborated by third-party reporting: more than 50
              million users, presence inside 85% of the Fortune 500, and hundreds of thousands of professional business
              customers. That makes chapter one’s central identity clear even before later chapters test retention or
              unit economics: Replit is selling faster software creation, not just cheaper coding tools.
