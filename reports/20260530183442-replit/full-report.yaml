      - number: '3.3'
        title: Distribution power, switching costs, lock-in, and multi-homing
        blocks:
          - type: paragraph
            body: >-
              The biggest structural question is not who has the flashiest agent demo, but who controls distribution and
              where buyers already live. GitHub and Microsoft have the clearest advantage here. Retained official pages
              show Copilot spanning GitHub, IDEs, the terminal, and background agents, while Codespaces turns the same
              stack into secure cloud development environments. JetBrains then adds independent proof that Copilot
              remains the most widely used AI coding tool at work and is especially strong in very large companies. That
              distribution power makes GitHub the hardest incumbent for Replit to displace. Replit’s advantage is lower
              initial friction for cross-functional or browser-first builders, but that same category also shows low
              hard lock-in. v0 explicitly syncs with GitHub and deploys to Vercel, VS Code remains open-source and
              familiar, and Sonar says the average team already juggles four AI coding tools. In other words,
              multi-homing is normal rather than exceptional. Buyers can prototype one way and ship another, or keep
              multiple agents in parallel. Replit therefore benefits from workflow compression and onboarding
              convenience, but it cannot assume that a user who starts inside Replit will stay there once the workload
              becomes security-sensitive, repo-centric, or standardized around incumbent tooling.
            claimRefs:
