      - number: '3.4'
        title: Moat durability, commoditization risk, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence does not say Replit is losing the category today; it says the category is getting
              easier to commoditize and harder to trust. Sonar and Stack Overflow both show a market with high adoption
              but low trust, and Sonar’s finding that teams juggle multiple tools undermines any claim that one vendor
              has already captured durable mindshare. Replit’s own risk is more specific. Its pricing page warns that
              agent behavior is probabilistic, and adverse Trustpilot reviews describe surprise publishing, rapid credit
              burn, and support frustration. Those complaints matter in competitor analysis because trust and spend
              predictability are where GitHub, Microsoft, Vercel, and other better-established enterprise vendors can
              counterattack. There is also specialist pressure from both sides: Lovable, Bolt, and v0 can make
              non-engineer app creation feel simpler, while Cursor, Windsurf, Claude Code, and Devin keep pushing deeper
              engineering automation. Public funding and ARR headlines show how much capital is chasing the same surface
              area. The result is a moat picture that is real but fragile. Replit has breadth and cross-functional
              reach, but its durability depends on proving that its integrated browser workflow remains better enough
              than modular stacks or specialist builders to justify continued usage and governed expansion.
