      - number: '7.4'
        title: Platform dependency, competitive displacement, and governance sequencing keep residual risk high
        blocks:
          - type: paragraph
            body: >-
              Replit is not a standalone stack. Google Cloud publicly says it remains Replit’s primary cloud provider
              and that Replit uses Google infrastructure and models to scale enterprise demand. Microsoft adds a second
              major dependency vector through Azure Marketplace and related services, while status logs show that
              outside providers such as Clerk can degrade the experience directly. Replit’s own partner program is
              expanding further into payments, system integrators, and enterprise channels through Visa, Accenture,
              Slalom, Hexaware, Databricks, Stripe, and others. Strategically that is positive: it improves reach,
              procurement access, and workflow breadth. Risk-wise it means more counterparties can shape Replit’s
              economics, reliability, and buying motion. If cloud costs move, model access changes, marketplace
              incentives weaken, or partner priorities shift, Replit’s margin and rollout profile can change quickly.


              Competition makes that dependency story more dangerous. TechCrunch’s Microsoft coverage and public user
              reviews both show that alternative vibe-coding tools are close enough in buyer perception that
              disappointed users openly compare and switch. That is why governance sequencing matters so much. Replit is
              launching good controls—Security Agent, Auto-Protect, App Monitoring, self-serve enterprise, and broader
              partner support—but the public record still shows those controls appearing alongside scaling adoption,
              rather than after a long period of quietly stable trust. The residual underwriting view should therefore
              be balanced: Replit has credible mitigations and real enterprise momentum, but billing trust, destructive
              autonomy, privacy exposure, and dependency-heavy enterprise execution remain live thesis-break risks until
              the next 12 months show fewer incidents and stronger disclosure quality than the last 12 months did.
