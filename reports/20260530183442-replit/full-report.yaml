      - number: '5.2'
        title: Deployment, runtime, and external tool architecture
        blocks:
          - type: paragraph
            body: >-
              Under the hood, Replit is assembling a fairly opinionated full-stack runtime. Database setup is pushed
              toward managed Postgres with development and production separation, while file-heavy use cases route into
              App Storage backed by Google Cloud Storage. The publishing path is snapshot based and spans static
              hosting, autoscaling app runtimes, always-on reserved VMs, and scheduled jobs. On top of that runtime,
              Replit is productizing external connectivity in three distinct ways: user-level connectors for services
              such as Google Workspace, enterprise warehouse connectors for Databricks and Snowflake, and an MCP server
              that lets outside clients create or update Replit apps programmatically. Those surfaces make Replit more
              than a hosted editor, but they also reveal real dependencies. Mobile output depends on Expo and app-store
              processes, advanced agent builds depend on Anthropic's SDK and third-party SaaS APIs, and enterprise data
              workflows still require admin setup, OAuth, or service-principal plumbing. The platform is integrated, but
              it is not fully self-contained.
