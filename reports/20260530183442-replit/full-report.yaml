    title: Product & Technology
    sections:
      - number: '5.1'
        title: Integrated product surface and builder workflow
        blocks:
          - type: paragraph
            body: >-
              Replit's current product story is much broader than a browser IDE. The retained official product page,
              Agent 4 launch post, Canvas docs, and workflow docs all describe a unified builder loop that starts with a
              prompt, moves through planning and task decomposition, adds design exploration directly on Canvas, wires
              in auth, storage, or integrations, and ends in a published application. That matters because the platform
              is trying to remove the traditional handoff chain between prototyping, coding, design QA, and deployment.
              Canvas keeps visual iteration inside the same project; Plan Mode lets users review architecture and tasks
              before code changes happen; and the task system then turns approved work into background jobs that can run
              in parallel. Replit is also stretching the definition of what can live in one project: web apps, mobile
              experiences, dashboards, slides, documents, and agent workflows all sit under the same product umbrella.
              The practical result is a browser-native workspace whose main differentiation is orchestration and
              integrated tooling, not just code generation alone.
