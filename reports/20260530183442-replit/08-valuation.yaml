  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-preferences
    missingEvidence: Cap-table waterfall, liquidation preferences, participation rights, and any secondary pricing tied to the March 2026 round.
    whyItMatters: A private-company valuation can look fair on headline price but still be unattractive to new investors if senior preferences absorb a large share of downside or flat exits.
    diligencePath: Request the capitalization table, preferred-stock terms, and any secondary or tender documents from the data room; reconcile them against the March 2026 financing documents.
    relatedQuestionRefs:
    - QV019
    - QV029
  - type: missing-source
    severity: material
    topic: audited-2026-financials
    missingEvidence: Audited or board-level 2026 ARR, GAAP revenue, gross margin, operating loss, and cash-burn figures after the Series D.
    whyItMatters: The current mark swings from 60.0x to 9.0x depending on which revenue anchor is used, so updated audited numbers are the single biggest determinant of whether $9B is stretched or fair.
    diligencePath: Request the most recent board deck or audited management accounts and reconcile them to the publicly cited $150M late-2025 figure, the Sacra estimates, and the $1B company target.
    relatedQuestionRefs:
    - QV011
    - QV020
    - QV029
  - type: private-evidence-only
    severity: material
    topic: retention-and-contract-depth
    missingEvidence: Net revenue retention, logo retention, average contract value, and contract duration for enterprise cohorts using Agent and deployment products.
    whyItMatters: High-growth adoption metrics can still fail to justify a premium multiple if enterprise usage is shallow, one-off, or highly promotional rather than recurring and expanding.
    diligencePath: Ask management for cohort tables by segment, enterprise pipeline conversion data, and renewal data for 2025-2026 buyers.
    relatedQuestionRefs:
    - QV021
    - QV029
  - type: conflicting-data
    severity: minor
    topic: revenue-anchor-dispersion
    missingEvidence: A reconciled bridge explaining the gap between the directly reported $150M late-2025 annualized revenue figure and Sacra's higher 2025 ARR estimates.
    whyItMatters: Different definitions of ARR, usage revenue, and annualized run rate can materially change the multiple investors think they are paying.
    diligencePath: Reconcile metric definitions with management and ask whether the company includes usage-based revenue, enterprise commitments, or hosted infrastructure in quoted ARR numbers.
    relatedQuestionRefs:
    - QV005
    - QV006
    - QV007
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: incident-adjusted-unit-economics
    missingEvidence: Post-incident churn, support cost, credit burn, and remediation cost associated with pricing complaints, privacy leaks, and security tooling.
    whyItMatters: Adverse incidents can drag both gross margin and willingness-to-pay, which matters a lot when the company is still unprofitable and valued on forward assumptions.
    diligencePath: Request cohort churn and gross-margin data before and after major pricing or security incidents and review enterprise exception handling or credit policies.
    relatedQuestionRefs:
    - QV017
    - QV020
    - QV029
