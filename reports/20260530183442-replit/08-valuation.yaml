- id: comparables-and-market-sentiment
  title: Comparables and Market Sentiment
  body: 'The private-market comp set shows that investors are still paying meaningful premiums for category leaders in AI coding, but Replit is not obviously cheap even in that context. Cursor''s June 2025 financing at $9.9 billion on more than $500 million ARR implied roughly 19.8x ARR, while CNBC''s November 2025 report put Cursor at $29.3 billion after crossing $1 billion in annualized revenue, or roughly 29.3x. Cognition''s May 2026 financing sat even higher at about 50.8x annualized revenue on the reported $25 billion pre-money valuation and $492 million run-rate. Replit''s current mark therefore sits above Cursor''s disclosed bands on verified trailing numbers and only looks moderate if one treats Sacra''s estimate or management''s $1 billion target as the more relevant denominator.


    Public software comps provide another useful check even though they are not perfect apples-to-apples comparisons. Using CompaniesMarketCap''s May 2026 snapshots, GitLab trades near 5.5x market-cap-to-revenue, Datadog near 24.0x, and Cloudflare near 39.6x; Microsoft, which matters more as a distribution ceiling through GitHub and Copilot than as a direct comp, sits near 10.5x. These are market-cap proxies rather than enterprise-value multiples, and Cloudflare''s network-security mix plus Microsoft''s scale make direct comparison imperfect. Still, the public band is meaningfully below Replit''s 60.0x verified trailing multiple and only partly overlaps with Replit''s 35.6x estimate-based view. That is why the $9 billion price feels momentum-friendly but still valuation-tight.'
