tables:
- id: TV001
  title: Recommendation Summary
  columns:
  - Dimension
  - Assessment
  - Evidence basis
  - Threshold to upgrade
  rows:
  - - Recommendation
    - Track
    - Current $9B mark requires forward execution rather than trailing disclosure
    - Audited 2026 ARR, margin, and cap-table proof support a clear downside-protected entry
  - - Confidence
    - Medium
    - Growth proof is strong; economics and structure disclosure remain thin
    - Board-level financial package and preference waterfall reviewed
  - - Risk rating
    - High
    - Unprofitable, private-company opacity, and adverse pricing/privacy evidence
    - Show stable enterprise monetization and incident-adjusted unit economics
  - - Valuation stance
    - Stretched
    - 60.0x on the best-corroborated late-2025 anchor; 35.6x on Sacra estimate; 9.0x only on the $1B target
    - Forward ARR realization plus better disclosure narrow the gap
  - - Decision implication
    - Do not underwrite today as a simple growth multiple expansion story
    - Return math depends on revenue quality, not just topline excitement
    - Revisit if diligence shows cleaner economics or if entry price resets
  notes: Recommendation is price-sensitive. Assessment distinguishes verified trailing revenue from estimated or aspirational anchors and therefore does not treat the $9B mark as self-validating.
