callouts:
- calloutType: recommendation
  title: Recommendation — Track
  body: Replit has enough product and adoption proof that the company deserves attention, but the $9 billion mark still leans on future execution more than on fully disclosed present economics. Do not treat the current price as obviously fair until audited ARR, gross margin, burn, and cap-table terms close the gap between the 60.0x trailing view and the much cheaper forward case management is selling.
  claimRefs:
  - CV013
  - CV015
  - CV042
  - CV043
  - CV044
- calloutType: risk
  title: Private-company opacity is the main valuation risk
  body: The biggest reason to resist a Buy call is not lack of growth; it is the absence of clear public disclosure on 2026 ARR, NRR, cash burn, and liquidation preferences. At a headline $9 billion mark, those missing details can matter as much as topline momentum.
  claimRefs:
  - CV030
  - CV031
  - CV037
  - CV044
- calloutType: insight
  title: The same price can read as 9x or 60x depending on the denominator
  body: That sensitivity is why the current mark feels stretched rather than outright irrational. If the $1 billion target lands quickly, the round can look disciplined in hindsight; if investors are really paying against the late-2025 verified anchor, the price already assumes years of success.
  claimRefs:
  - CV013
  - CV014
  - CV015
  - CV016
  - CV043
