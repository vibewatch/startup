- id: TV002
  title: Thesis / Anti-Thesis
  columns:
  - Argument
  - Supporting evidence
  - What would change the view
  rows:
  - - Replit has real category momentum
    - 3.0x valuation step-up, 50M users, 500k business customers, 85% of Fortune 500 usage marker
    - Show that breadth converts into sticky net expansion and margin quality
  - - Enterprise GTM is maturing quickly
    - Self-serve enterprise, Azure Marketplace distribution, Google Cloud, Accenture, and Visa partnerships
    - Disclose enterprise renewal, ACV, and usage-to-contract conversion data
  - - The price can work if $1B ARR arrives fast
    - Current mark falls to 9.0x on the company-stated $1B target
    - Verify the target with audited or board-level 2026 financials
  - - Verified trailing evidence still looks expensive
    - Current mark is 60.0x on the best-corroborated $150M annualized revenue figure
    - Demonstrate a materially higher realized ARR base or a better entry price
  - - Third-party estimates help but do not close the case
    - Sacra's $253M October 2025 estimate reduces the multiple to 35.6x, still above most public comp proxies
    - Provide reconciled company definitions for ARR, usage revenue, and run-rate
  - - Opacity and incidents are valuation risks
    - Public sources still lack full cap-table, NRR, cash-burn, and audited 2026 metrics; adverse pricing/privacy evidence exists
    - Provide diligence materials and show incident-related churn or support costs are contained
  notes: The thesis depends on growth converting into durable enterprise economics. The anti-thesis depends on opacity, competition, and the possibility that broad usage has not yet become high-quality recurring revenue.
