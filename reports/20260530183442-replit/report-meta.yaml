companyProfile:
  summary: Replit is a 2016-founded private company that positions itself as an agentic software creation platform for building applications from natural-language prompts. Its product combines browser-native app creation with integrated auth, data, deployment, monitoring, and enterprise controls, and public 2026 materials point to unusually broad adoption across developers, operators, founders, students, SMBs, and large enterprises. The company’s March 2026 Series D at a $9 billion valuation confirms strong investor support, but the public record still leaves key economics and governance details selectively disclosed.
  foundedDate: "2016-01-01"
  founders:
    - name: Amjad Masad
      role: Founder & CEO
      claimRefs: [CO005]
    - name: Haya Odeh
      role: Co-Founder, Design
      claimRefs: [CO006]
  foundingLocation: null
  headquarters: San Francisco, California
  productSummary: Browser-native platform where users describe apps in chat, have them built with AI, and then host, secure, monitor, and deploy them inside the same product surface.
  customerFocus: Developers, founders, students, SMB operators, and cross-functional enterprise teams that want to build internal tools, apps, and workflows faster.
  businessModel: Freemium-to-paid subscriptions across Starter, Core, Pro, and Enterprise, plus usage-based credits and infrastructure billing for Agent work, hosting, storage, databases, and enterprise controls.
  stage: Series D
  fundingStatus: Raised a $400M Series D at a $9B valuation in March 2026; CNBC later reported roughly $880M total funding.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CP001, CO017, CU010, CU011, CO024, CO029, CO030]
summary:
  headline: Replit has real category-leading adoption and enterprise momentum, but the current $9B mark still outruns the quality of public financial disclosure.
