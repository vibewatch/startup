  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Replit is a 2016-founded AI software-creation platform that now markets itself to non-engineers as well as developers, with official and independent sources converging on 50M+ users, strong enterprise penetration, and a March 2026 $400M Series D at a $9B valuation. Public evidence is strong on product momentum, funding, and named leadership, but weaker on governance, exact current economics, and even headquarters because official/partner materials say San Francisco while CNBC and Forbes list Foster City."
  },
  "sections": [
    {
      "id": "identity-product-and-visible-scale",
      "title": "Identity, product model, and visible scale",
      "body": "Replit now frames itself less as a browser IDE and more as an agentic software-creation platform for anyone with an idea. Official materials say the product lets users build applications with natural language, then keep moving inside the same environment with authentication, database, hosting, monitoring, and third-party integrations already wired in. That positioning matters because the company is explicitly targeting nontraditional builders as well as engineers: its own April 2026 messaging says product managers, operators, founders, students, and small business owners are shipping production software on the platform. The pricing ladder reinforces the go-to-market shape. Starter is free, while Core and Pro are annual subscription tiers that bundle monthly credits and parallel-agent capacity, showing that Replit monetizes both seats and usage. Scale claims are still mostly company-reported, but they are repeated across official and partner materials and partially corroborated by third-party reporting: more than 50 million users, presence inside 85% of the Fortune 500, and hundreds of thousands of professional business customers. That makes chapter one’s central identity clear even before later chapters test retention or unit economics: Replit is selling faster software creation, not just cheaper coding tools.",
