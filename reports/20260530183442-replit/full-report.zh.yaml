      - number: '7.3'
        title: 安全、隐私和法律不确定性只有在披露质量改善后才可控
        blocks:
          - type: paragraph
            body: >-
              从公开材料看，Replit 现在对安全的重视程度明显高于许多 vibe-coding 同行。公司的安全页面描述了高管监督、内部零信任设计、GCP 隔离、企业控制、CVE 监控、Security Agent
              审查和只读生产环境排查路径。对企业买家来说，这是正确的缓释方向。更难的问题是，披露深度是否跟得上这些说法。Replit 的隐私政策称公司会收集服务使用信息，并可能用信息改进机器学习系统；条款则说公开应用采用
              MIT 许可，也可能用于改进服务。这些披露自然会引出关于数据范围、IP 立场，以及产品遥测和模型改进之间边界究竟在哪里的法律和采购问题。更广泛上线之前，买家也必须进一步理解 DPA 条款、区域托管和隐私责任。


              监管环境也在收紧。FTC 的 AI 材料强调透明度和问责，EU AI Act 则引入具体透明度规则和更广的 GPAI 义务，并会在 2026 年变得更重要。Replit
              也许能够合规，但本章保留的公开网页材料还无法替代完整的信任中心材料包、正式事故复盘库，或达到法律顾问审阅级别的合规映射。Axios
              关于公开应用暴露的报道说明了问题所在：非技术用户或治理较轻的用户可以快速发布内部工具时，隐私和访问控制错误会迅速放大。因此，本章并不指称存在有来源支持的实时执法案件或诉讼；法律和监管风险在于，合同、隐私、AI
              治理和披露义务都在上升，而 Replit 正在同一时间更深地进入企业生产环境。
