companyProfile:
  summary: >-
    Replit 是一家成立于 2016 年的私营公司，把自己定位为智能体软件创建平台，用户可用自然语言提示构建应用。产品把浏览器原生应用创建与内置身份验证、数据、部署、监控和企业控制结合在一起，公开的 2026
    年材料显示，它在开发者、运营人员、创始人、学生、SMB 和大型企业中都有异常广泛的采用。公司 2026 年 3 月以 $9B 估值完成 Series D，证明投资者支持强劲，但公开记录仍只选择性披露关键经济性和治理细节。
