      - number: '5.3'
        title: 企业控制、安全工具与运营成熟度
        blocks:
          - type: paragraph
            body: >-
              Replit 近期最可信的产品工作，是把大量企业和安全脚手架推入核心工作流。Enterprise 计划和自助式发布把
              SSO、SCIM、RBAC、审计日志、项目群分析和数据仓库连接器直接放进产品，而不是留给售前工程。安全栈也比营销清单更深。Security Agent 被定位为以威胁模型驱动的审查器：分析路由和
              API、验证可利用性，并把修复交回为可审查任务。Security Center 随后展示项目中的 CVE 暴露、批量扫描项目群并导出 SBOM；Auto-Protect 为匹配漏洞准备补丁；App
              Monitoring 则把产品从发布延伸到正常运行时间检测、日志检查和只读生产数据库调查。最强的架构声明仍来自 Replit 自己，但公司显然正试图把构建、部署和安全压成一个运营循环，而不是把安全当作外部事后项。
