  - id: FE004
    title: 产品成熟度与能力图
    type: matrix
    layout: wide
    summary: Replit 在自己直接控制的浏览器工作流和企业护栏上似乎最强；重度依赖外部提供商的路径更受条件约束。
    data:
      columns:
        - 当前覆盖广度
        - 运营成熟度信号
        - 主要买方价值
        - 公开证据限制
      rows:
        - label: 核心构建循环
          values:
            - 高
            - Agent 4 与任务文档详尽且及时更新
            - 从想法到可用应用的快路径
            - 输出质量仍随提示词和评审波动
        - label: 部署与运行时
          values:
            - 高
            - 多种部署类型，配有监控和分析
            - 让 Replit 掌控发布和运营路径
            - 公开可用性和 SLO 数据有限
        - label: 安全自动化
          values:
            - 中高
            - Security Agent、Security Center 和 Auto-Protect 均在 2026 年推出
            - 把修复推近构建和发布时间
            - 独立有效性证据仍薄
        - label: 企业治理
          values:
            - 高
            - 自助式企业入驻和管理员功能已产品化
            - 缩短采购和 IT 设置循环
            - 与成熟基础设施厂商相比，深度仍难从公开信息对标
        - label: 数据与连接器
          values:
            - 中
            - 连接器覆盖面广，但管理负担因用例而不均
            - 提升内部工具和数据应用构建的可信度
            - 关键路径仍需要第三方身份和权限设置
        - label: 移动端输出
          values:
            - 中
            - 浏览器到 Expo 的流程有文档且保持更新
            - 把可交付输出从 Web 应用扩展到更多类型
            - 商店分发仍依赖外部工具和账号
    approximationNotes: 本矩阵是基于公开证据的分析综合，不是供应商撰写的产品评分卡。
