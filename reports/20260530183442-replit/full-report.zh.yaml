  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: Replit 掌握主控制平面，但体验中的关键部分仍依赖外部云、模型、连接器和分发系统。
    data:
      nodes:
        - id: builder
          label: 构建者或团队
          detail: 批准计划、评审改动，并决定何时发布。
        - id: replit
          label: Replit 控制平面
          detail: 承载编辑器、智能体、任务、认证设置、数据设置和发布流程。
        - id: cloud
          label: 云运行时
          detail: 已发布应用运行在 Google Cloud 基础设施和单租户 GCP 项目上。
        - id: models
          label: 模型提供商
          detail: 智能体工作流可能依赖外部模型 API 或模型合作伙伴关系。
        - id: connectors
          label: 连接器与 OAuth
          detail: 第三方 SaaS、数据仓库和 MCP 系统把应用扩展到 Replit 原生能力之外。
        - id: mobile
          label: 移动分发栈
          detail: 最终移动端打包和分发环节，Expo 和应用商店计划位于 Replit 之外。
        - id: production
          label: 已发布应用与数据
          detail: 上线后，运行时健康、日志、数据库和安全响应循环仍会继续。
      edges:
        - from: builder
