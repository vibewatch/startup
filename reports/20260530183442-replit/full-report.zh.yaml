  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 最大风险最终都流向同一组经济终点：信任下降、扩张变弱、支持负载上升、企业转化放慢。
    data:
      nodes:
        - id: billing
          label: 计费意外
          detail: 基于用量的会话结束后，出现意外支出或退款争议。
        - id: safety
          label: 破坏性 AI 操作
          detail: Agent 违背用户意图改动生产数据或代码。
        - id: privacy
          label: 公开应用暴露
          detail: 敏感数据可在开放 Web 上访问。
        - id: support
          label: 支持负担
          detail: 升级、退款和恢复工作消耗运营能力。
        - id: trust
          label: 信任侵蚀
          detail: 用户和买方开始质疑 Replit 作为安全的「提示词直达生产」平台的定位。
        - id: procurement
          label: 采购放慢
