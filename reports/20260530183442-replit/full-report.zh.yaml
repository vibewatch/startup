      - number: '2.2'
        title: 多重规模测算视角：从狭义编码支出到更广的软件创建相邻市场
        blocks:
          - type: paragraph
            body: >-
              没有单一市场数字能完整解释 Replit。保留资料中最宽的视角来自 Menlo Ventures：企业 2025 年在生成式 AI 上支出 $37B，其中 $19B 投向 AI 应用。在这个应用层里，Menlo
              的部门切片达到 $7.3B；编码部分约为 $4.0B 到 $4.2B，取决于引用官方报告还是 No Jitter 摘要。更窄的 2026 年类别定义随后朝不同方向移动：Gartner 估算企业 AI
              编码智能体年化约 $9.8B 到 $11.0B；Mordor 将 2026 年 AI 代码工具市场放在 $9.35B；Business Research Company 则从 2025 年 $7.65B
              起步，并给出到 2030 年 $22.2B 的路径。相邻低代码估算更大，IDC 的 LCNCIDT 预测 2026 年达到 $21.0B，Precedence 的低代码平台估算为 2026 年
              $15.81B。这些数字在严格会计意义上不能直接相加，也不真正矛盾，因为每个来源使用的类别边界都不同。因此，正确的尽调姿态是保留几组镜头：AI
              应用的宽口径上限，编码智能体或代码工具的窄口径区间，以及低代码相邻市场，用来说明 Replit 的愿景市场为什么可以超出传统开发者。
