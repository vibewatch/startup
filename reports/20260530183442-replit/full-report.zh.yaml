      - number: '6.2'
        title: 采用规模与具名客户证明
        blocks:
          - type: paragraph
            body: >-
              Replit 的公开采用证明在拆成三层时最强：平台规模、具名企业引用和详细客户故事。平台规模上，官方 2026 年 3 月和 4 月博客称，超过 50 million 用户在 Replit 上构建，来自 85%
              Fortune 500 的用户活跃在平台上。CNBC 加入更商业化的视角，称 Replit 已超过 500,000
              个专业商业客户。这些数字方向上很有力，因为它们显示公司已经越过爱好者实验，进入严肃的工作场景使用，但当前只有用户数和 Fortune 500 触达数字由 2026 年官方一手文章锚定。


              具名证明好过标识墙，但仍不均衡。Enterprise 页面展示了 Adobe、Atlassian、Google、Microsoft、PayPal、Plaid、Stripe 和 Zillow
              等可识别标识，Accenture 和 CNBC 也都点名了正在用 Replit 构建的企业账户。Visa 2026 年 5 月公告尤其有用，因为它称已有超过 1,000 名 Visa
              员工使用该平台。质量最高的证明来自 Replit 较新的案例研究：Leatherman 从 30 名活跃员工扩展到 147 名，并发布 119+ 个应用；Rokt 让 700+ 员工在一天内构建 135
              个应用；Plaid 用 Replit 构建生产 SLA 仪表盘；Helix Electric 把 12-14 小时的审查任务压缩到 6 分钟；Northern Health 和 GenAIPI
              显示，非技术创始人无需机构预算也能交付有意义的软件。因此，公开证明广泛、当前且跨垂直，尽管按收入加权的客户集中度仍不透明。
