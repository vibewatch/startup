            body: >-
              Replit 当前产品故事远比浏览器 IDE 更宽。保留的官方产品页、Agent 4 发布文章、Canvas 文档和工作流文档都描述了一条统一的构建者循环：从提示词开始，经过规划和任务拆解，在 Canvas
              上直接做设计探索，接入身份验证、存储或集成，最后形成已发布应用。这一点重要，因为平台试图拿掉原型、编码、设计 QA 和部署之间传统的交接链。Canvas 把视觉迭代留在同一项目里；Plan Mode
              让用户在代码变更前审查架构和任务；任务系统再把已批准工作转成可并行运行的后台作业。Replit 也在拉宽一个项目能容纳的定义：Web
              应用、移动体验、仪表盘、幻灯片、文档和智能体工作流都放在同一产品伞下。实际结果是一个浏览器原生工作区，其主要差异化在编排和一体化工具，而不只是代码生成。
