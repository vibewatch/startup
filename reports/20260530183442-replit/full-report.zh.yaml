        - 入门套餐与更高档位当前占比未披露
        - 定价页 + Pro 页面 + Pro 文档
      - - Enterprise
        - 定制
        - 合同 / 年度承诺
        - 定制席位上限、SSO/SAML、SCIM、高级隐私、单租户选项、定制开票、专属支持
        - 没有公开 ACV、最低承诺、实施费或折扣
        - Enterprise 页面 + Enterprise 文档
      - - AI 智能体用量
        - 可变，扣减积分
        - 按工作量计费 / 由提供商费率支撑
        - Agent 成本按检查点显示，并出现在用量仪表盘
        - 客户账单可预测性取决于工作负载和仪表盘滞后
        - AI 计费文档 + 定价回顾
      - - 发布请求和计算
        - 可变，按用量计费
        - 按请求 / 计算单元 / 部署类型
        - 基于请求的部署只在服务流量时计费
        - 工作负载形态强烈影响实际成本
        - 部署定价文档
      - - 出站数据传输
        - 超出额度后可变
        - 仅按出站字节计费
        - 入站免费；Core 和 Pro 获得额度
        - 大型生产应用可能产生超额费用风险
        - 按用量计费文档
      - - 积分包 / 共享用量
        - 可变附加项
