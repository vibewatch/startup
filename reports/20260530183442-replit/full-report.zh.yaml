  - id: TV005
    title: 投资逻辑失效与否决触发表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 增长跑不赢当前价格
        - 2026-2027 年 ARR 仍更接近 ~$250M-$350M，而不是 $1B 目标
        - 当前标记仍高于合理的可比估值区间
        - 将 2026 年 3 月价格视为对新资金过高
      - - 企业客户广度被证明很浅
        - 大客户 logo 无法转化为强续约、扩张或 ACV 数据
        - 基于企业转化的乐观情景明显走弱
        - 降至继续研究或回避，直到留存得到证明
      - - 优先股堆叠重于假设
        - 尽调显示高级优先权或老股交易吃掉持平 / 下行情形下的大部分退出价值
        - 名义估值高估新投资者可获得的价值
        - 重新定价或退出
      - - 定价或隐私事故重复
        - 2026 年升级后出现新的成本超支或数据泄露证据
        - 信任和治理走弱时，溢价倍数会收缩
        - 下调估值区间，并要求更多下行保护
      - - 上市可比倍数压缩
        - Cloudflare 或 Datadog 式溢价大幅下修，而 Replit 仍不透明且未盈利
        - 基准和乐观情景的倍数假设不再成立
        - 下调情景区间，重新评估入场纪律
      - - 公司错过经济性披露里程碑
        - 下一个尽调窗口内没有经审计的 2026 年 ARR、利润率或烧钱披露
        - 不透明仍是核心投资风险
        - 不从观察上调到买入
    notes: 触发因素按监测阈值设计，不是确定性判断。核心问题是，在市场要求上市公司式透明度之前，Replit 能否证明自己配得上高溢价 AI 平台估值。
