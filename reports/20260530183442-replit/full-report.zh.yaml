  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、既有巨头、相邻玩家与可能进入者
        blocks:
          - type: paragraph
            body: >-
              Replit 周围的竞争集合已不再是一张整齐的浏览器 IDE 名单。直接同业分成两条线：Cursor、Windsurf 等 IDE 原生编码智能体，以及 Lovable、Bolt、v0
              等浏览器原生应用构建器。Cursor 和 Windsurf 更偏向已经生活在代码编辑器里的专业开发者，他们想把智能体、Tab 补全、代码审查和企业管理叠进熟悉的工作流。Lovable、Bolt 和 v0
              则更多从相反方向竞争：它们承诺提示词可以快速变成可运行网站或应用，设计、发布和协作也触手可及。Replit
              的特殊之处在于，它试图同时覆盖两种任务。保留文档和企业页面仍描述了一条从提示词到构建、发布和受治理分享的浏览器原生路径，同时也瞄准产品经理、设计师、运营人员和其他非传统构建者。既有巨头和替代层同样重要。GitHub
              Copilot、Codespaces 和 VS Code 共同构成最强的现状栈，适合那些已经围绕 GitHub 和云基础设施构建的团队；Claude Code 和 Devin
              则把智能体编码推进既有本地或企业环境中。因此，Replit 竞争的不是单一公司，而是几组从不同起点解决同一任务的产品组合。
