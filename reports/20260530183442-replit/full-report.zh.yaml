  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与相邻类别
        blocks:
          - type: paragraph
            body: >-
              第一个分析任务，是先定义 Replit 的市场，再谈规模。保留的官方页面显示，产品已不再被框定为只面向工程师的狭义编码副驾。Replit 营销的是一条工作流：从提示词或 PRD
              开始，把需求简述变成可运行原型或应用，然后让用户继续在同一环境里协作、部署、使用数据库和隐私控制。因此，相关市场边界应包括 AI 辅助软件创建和应用开发工作流支出，而不只是 IDE
              里的自动补全。章节也应区分纳入支出和诱人但夸大的相邻项。纳入支出覆盖编码助手与智能体、AI
              应用构建平台，以及把想法变成可运行软件直接相关的工作流预算。排除支出包括基础设施和模型层支出、外包开发服务，以及永远不会变成软件交付工作流的通用聊天界面。低代码和智能开发者技术是相邻类别，因为它们扩大了愿意构建内部工具和轻量应用的人群池，但不应被视为
              Replit 当前类别的一对一替代。真正的现状替代方案仍是内部自建，加上一串碎片化工具和交接。
