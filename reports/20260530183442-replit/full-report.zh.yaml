  - id: FU001
    title: 客户旅程图
    type: flow
    layout: wide
    summary: Replit 通常从一个明确的工作流痛点或实验切入；用户证明提示词驱动构建可以替代手工工作或外包开发后，再扩展为受治理的工作空间。
    data:
      nodes:
        - id: discover
          label: 触发 / 发现
          detail: 学生、创始人、运营人员或团队负责人看到工作流瓶颈，或想快速测试应用想法。
        - id: first-build
          label: 首次提示词驱动构建
          detail: 无需完整工程项目，就能创建看板、门户、原型或内部工具。
        - id: local-proof
          label: 局部价值证明
          detail: 节省时间、避免外包成本或提升工作流可见性后，用户有理由继续迭代。
        - id: team-sharing
          label: 团队共享
          detail: 协作者、浏览者和相邻团队成员开始使用工作空间或已发布应用。
        - id: governance
          label: 受治理推广
          detail: 当使用在组织内扩散后，SSO、SCIM、RBAC、私有部署和采购开始介入。
        - id: expansion
          label: 应用与席位扩张
          detail: 更多内部应用、部门或合作伙伴带动的企业推进，会加深账户价值。
      edges:
