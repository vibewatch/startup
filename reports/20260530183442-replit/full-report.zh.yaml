      - number: '8.4'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              当前估值下的建议是跟踪，置信度中等，估值立场偏紧。Replit 有足够真实的证据——50M 用户、500,000 名专业企业客户、横跨 Microsoft、Google Cloud、Accenture 和
              Visa 的企业伙伴关系，以及软件领域最快的收入爬坡之一——公司不能被视为纯炒作。但公开证据仍不足以支撑在 $9B
              估值上给出明确买入，因为收入分母仍有争议，公司仍未盈利，关于利润率质量、留存和私募股权结构的披露也很薄。


              因此，入场纪律应当明确。按今天价格买入，实际上是在假设公司能迅速长入一个低得多的远期倍数，同时不会遭遇严重倍数压缩，也不会被优先权或二级交易结构破坏下行保护。这并非不可能，但尚未证明。公开证据还不足以支持承销一个近期
              IPO，或在当前估值上形成清晰的 >2x 回报判断；除非 ARR 更快兑现、利润率披露更好，或入场价格更有吸引力。如果价格明显低于当前轮次，或尽调显示单位经济比公开记录所暗示的更干净，结论可以快速改善。
