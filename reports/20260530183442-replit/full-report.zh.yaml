      - number: '5.2'
        title: 部署、运行时与外部工具架构
        blocks:
          - type: paragraph
            body: >-
              底层看，Replit 正在组装一套相当有主张的全栈运行时。数据库设置被推向托管 Postgres，并区分开发和生产；文件较重的用例则进入由 Google Cloud Storage 支撑的 App
              Storage。发布路径基于快照，覆盖静态托管、自动扩缩容应用运行时、常开预留 VM 和定时任务。在这套运行时之上，Replit 以三种不同方式产品化外部连接：面向 Google Workspace
              等服务的用户级连接器、面向 Databricks 和 Snowflake 的企业数据仓库连接器，以及一个 MCP server，让外部客户端可以用程序创建或更新 Replit apps。这些界面让 Replit
              不只是托管编辑器，但也暴露了真实依赖。移动端输出依赖 Expo 和应用商店流程，高级 Agent 构建依赖 Anthropic 的 SDK 和第三方 SaaS API，企业数据工作流仍需要管理员配置、OAuth
              或服务主体管线。平台是一体化的，但不是完全自包含。
