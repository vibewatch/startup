        - 提供托管的结构化数据和文件存储路径
        - Postgres、App Storage 和开发 / 生产隔离均有文档记录
        - 把存储配置放进构建流程和发布路径
        - 未披露公开的吞吐、延迟和恢复 SLO
      - - 发布与运行时
        - 应用所有者
        - 把项目快照变成 Replit 云上的线上应用
        - 支持多种部署类型，以及域名、分析和监控
        - 一个产品同时覆盖构建、托管和运营
        - 没有按部署层级披露的公开正常运行时间或事故历史
      - - 连接器与自动化
