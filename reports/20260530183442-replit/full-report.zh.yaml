      - number: '3.4'
        title: 护城河耐久性、商品化风险与负面证据
        blocks:
          - type: paragraph
            body: >-
              负面证据并不是说 Replit 今天正在输掉类别，而是说这个类别更容易商品化，也更难建立信任。Sonar 和 Stack Overflow 都显示，市场采用率高但信任低；Sonar
              发现团队同时使用多个工具，也削弱了任何“某一家供应商已经拿下持久心智份额”的说法。Replit 自身风险更具体。它的定价页面提示 Agent 行为具有概率性，负面 Trustpilot
              评论则描述了意外发布、积分快速消耗和支持挫败感。这些投诉在竞争分析中重要，因为信任和支出可预测性正是 GitHub、Microsoft、Vercel
              和其他更成熟企业供应商能够反击的地方。两侧还存在专业化压力：Lovable、Bolt 和 v0 能让非工程师应用创建显得更简单，而 Cursor、Windsurf、Claude Code 和 Devin
              持续把工程自动化推得更深。公开融资和 ARR 头条数字显示，多少资本正在追逐同一块表面积。结果是，护城河图景真实但脆弱。Replit
              有广度和跨职能触达，但耐久性取决于证明其一体化浏览器工作流足够优于模块化栈或专业构建器，足以支撑持续使用和受治理扩张。
