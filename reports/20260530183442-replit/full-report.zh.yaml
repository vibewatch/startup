      - number: '8.2'
        title: 可比公司与市场情绪
        blocks:
          - type: paragraph
            body: >-
              私募市场可比组显示，投资人仍愿意为 AI 编程类别龙头支付可观溢价，但即便在这个语境下，Replit 也不明显便宜。Cursor 2025 年 6 月融资时估值 $9.9B，ARR 超过 $500M，对应约
              19.8x ARR；CNBC 2025 年 11 月报道 Cursor 年化收入突破 $1B 后估值 $29.3B，约为 29.3x。Cognition 2026 年 5 月融资的倍数更高，按报道的 $25B
              投前估值和 $492M 收入运行率计算，约为 50.8x 年化收入。因此，按已验证的历史数字看，Replit 当前估值高于 Cursor 已披露区间；只有把 Sacra 估算或管理层 $1B
              目标当成更相关分母时，它才显得适中。


              公开软件可比公司也能提供另一层校验，尽管并非完全可比。按 CompaniesMarketCap 2026 年 5 月快照，GitLab 的市值 / 收入约 5.5x，Datadog 约
              24.0x，Cloudflare 约 39.6x；Microsoft 通过 GitHub 和 Copilot 对分发天花板更重要，而不是直接可比公司，其倍数约
              10.5x。这些是市值代理，而非企业价值倍数；Cloudflare 的网络安全业务组合和 Microsoft 的规模，也让直接比较并不完美。即便如此，公开市场区间仍明显低于 Replit 60.0x
              的已验证历史倍数，只与 Replit 35.6x 的估算口径部分重叠。这就是为什么 $9B 价格顺应动能，但估值仍偏紧。
