  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值与收入锚点
        blocks:
          - type: paragraph
            body: >-
              Replit 当前私募估值一句话说得清，真正要形成投资判断却难得多。官方和主流新闻源均显示，公司在 2026 年 3 月以 $9B 估值完成 $400M Series D
              轮融资；就在六个月前，TechCrunch 还报道其 2025 年 9 月融资 $250M、估值 $3B。即便按 AI 软件标准看，3.0x
              的估值跳升也很惊人，并立即把估值讨论从标题热度拉回收入锚点。公开流传且最直接相互印证的收入数字，是 TechCrunch 和 CNBC 都引用的 2025 年末 $150M ARR。按这个锚点，当前价格对应
              60.0x 倍数。


              问题在于，并不是每个公开收入数字都在说同一件事。Sacra 的 2025 年更新估算 Replit 4 月 ARR 约 $70M，2025 年中为 $106M，2025 年 10 月为 $253M
              ARR。这些估算是有用的方向性标记，但属于第三方模型视角，不是经审计的公司披露。如果采用 Sacra 10 月估算，当前估值降至约 35.6x ARR。如果改用管理层的官方说法，即 Replit 有望在 2026
              年底达到 $1B 收入运行率，同一个 $9B 估值只剩 9.0x 远期 ARR。因此，核心估值问题不是 Replit 是否增长很快——它显然是——而是投资人究竟在按哪一种收入定义付钱。
