  - id: TP004
    title: 护城河耐久度 / 竞争风险清单
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 证据
      - 缓解措施 / 尽调问题
    rows:
      - - 浏览器原生集成工作流
        - GitHub 技术栈或 v0/Vercel 能为许多团队复刻足够多的构建—发布闭环
        - 高
        - GitHub 覆盖 IDE、终端、智能体和 Codespaces；v0 可与 GitHub 同步并部署到 Vercel
        - 让管理层按工作负载提供赢单 / 输单数据：浏览器优先构建者与以代码仓库为中心的工程团队
      - - 非工程师可用性
        - Lovable、Bolt 和 v0 让产品和业务用户更容易从提示词生成应用
        - 高
        - Lovable 和 Bolt 把聊天生成应用放在核心；Replit 还需要证明，在不牺牲控制力的前提下，它足够简单
        - 要求提供 PM、设计、运营和创始人画像的分群转化与留存数据
      - - 企业信任与治理
        - Microsoft/GitHub、Anthropic、Cursor 和 Windsurf 可以用成熟控制和采购熟悉度反击
        - 高
        - 竞品提供 SSO、SCIM、审计日志、RBAC 或类似 FedRAMP 的保证；Replit 仍背着用户信任投诉
        - 将企业安全审查、审计结果和客户推荐与既有替代方案逐项核验
      - - 智能体领先性
        - Cursor、Claude Code、Devin 和 Windsurf 都在推进更深的智能体式工作流
        - 中高
        - 多个竞争对手已开始营销自主后台工作、PR 生成或代码审查智能体
        - 用真实多步骤任务的成功率做基准测试，而不是依赖发布叙事
      - - 定价耐久度
        - 积分、高级请求、tokens 和按量付费可能带来买方疲劳和意外账单
        - 中高
        - Replit、Lovable、v0、GitHub、Windsurf 和 Devin 都暴露出受用量影响的经济模型
        - 要求提供毛利率和消费分群数据，测试用量定价是耐久还是会诱发流失
      - - 锁定 / 多栖使用
        - 代码存放在标准代码仓库，团队可以保留多款工具；Sonar 报告称，平均每个团队使用四款 AI 编程工具
        - 高
        - 多栖使用已成常态，削弱了任何单一助手或构建器的天然锁定
        - 要求提供迁移、导出和共存数据，覆盖同时使用 Replit 与 GitHub、Cursor 或 Vercel 的客户
    notes: 严重性是基于保留的官方、调研、评测和新闻证据做出的分析判断，不是管理层披露的排序。
