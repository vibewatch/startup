      - number: '8.5'
        title: 尽调缺口与打破投资逻辑的因素
        blocks:
          - type: paragraph
            body: >-
              最重要的负面证据并不是 Replit 缺乏需求，而是估值仍要求投资人相信不透明变量。Forbes 称，除 $1B 年末目标外，公司不愿评论当前收入；公开来源仍看不到经审计的 2026 ARR、GAAP
              收入、现金消耗、NRR，或 2026 年 3 月轮次背后的股权结构瀑布。这很重要，因为私营公司回报不仅取决于标题估值，也取决于优先权顺位、二级交易，以及企业合同究竟有粘性还是只是实验性。


              风险侧也有真实运营证据支撑。Axios 报道称，包括 Replit 在内的 vibe-coding 工具可能泄露敏感数据。The Register 和 InfoWorld
              都记录了用户对定价和成本超支的不满。这些证据都不能否定多头案例，但合在一起说明，如果信任、可预测性或安全滞后于采用，高增长假设就可能松动。需要监控的打破投资逻辑因素很直接：每个企业客户变现放慢、定价或隐私事故重复出现，以及企业覆盖广度没有转化为持久经济深度的证据。在这些问题关闭之前，估值应得到谨慎，而不是庆祝。
