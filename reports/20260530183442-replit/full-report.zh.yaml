      - number: '1.3'
        title: 融资历史、估值跃升与战略股东图谱
        blocks:
          - type: paragraph
            body: >-
              Replit 的融资轨迹是公开记录里最强的一块。TechCrunch 和 Georgian 的 PRNewswire 通稿一致显示，公司 2026 年 3 月由 Georgian 领投，以 $9B 估值完成
              $400M Series D，财务投资者和战略风投部门都在投资团中。把这轮融资放在上一个基准旁边看，意义更大：六个月前，Replit 以 $3B 估值融资 $250M，并称公司正朝 $150M
              年化收入推进。CNBC 后来报道累计融资 $880M，并称公司仍未盈利，这一点方向上重要，因为它显示市场付费买的是增长和类别位置，而不是已经证明的经营杠杆。股东图谱也超出经典 VC。Visa
              在内部已经使用产品的同时投资，Accenture 投资并围绕企业交付达成合作，Google Cloud 则在多年合作下成为 Replit
              的主要云提供商。Adobe、Atlassian、Databricks、Okta、PayPal、Zillow 和 Labcorp 等具名企业客户进一步提供商业验证。合在一起，这些关系说明 Replit
              正围绕企业采用搭建资本栈和分发栈，尽管确切控制权、清算优先权和支出集中度仍未披露。
