        - 专业开发者、企业团队、受监管买方
        - 聚焦 IDE，同时具备 SOC 2、渗透测试和 FedRAMP High 可用选项
        - 已保留证据中，直接浏览器原生应用发布的覆盖宽度并不清楚
      - - Lovable
        - 从提示词到应用构建器 / vibe coding 平台
        - 据报 2025 年 12 月 Series B 融资 $330M，估值 $6.6B，ARR >$200M
        - 创始人、产品团队、业务构建者、部门
