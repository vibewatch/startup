      - number: '2.4'
        title: 增长驱动、采用约束与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              这个类别显然在扩张，但证据显示，最强驱动和最难约束正在同时发生。正面看，企业 AI 采用正从试点走向生产。Menlo 称，现在 76% 的 AI 用例是购买而非内部自建，47% 的 AI
              交易进入生产，显著好于传统 SaaS。Gartner 更广的预测也显示，AI 应用开发平台支出将在 2026 年上升；McKinsey 则认为，组织重新设计工作流并围绕 AI
              部署加入治理时，能创造更多价值。这一组合利好 Replit 这类把创建、迭代和部署打包的平台。约束同样重要。开发者调查显示使用率高但信任下降，Sonar 的数据尤其负面：验证债务、个人账户使用和较低的
              pre-commit 检查率，都会提高在生产中标准化 AI 生成软件的成本。Replit 自己的定价页面承认 Agent
              输出具有概率性、可能出错，说明信任问题不只是外部评论。核心尽调缺口因此不是类别是否存在，而是可见实验中有多少会转化为团队和企业的持久付费使用。公开来源没有披露 Replit 的 cohort
              结构、按用户类型的留存，或非开发者使用在原型阶段后留存的比例。
