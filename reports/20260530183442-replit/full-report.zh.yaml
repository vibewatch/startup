  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Replit 在浏览器原生构建体验之上，叠加智能体编排、内置应用服务、云发布和外部工具连接。
    data:
      layers:
        - label: 浏览器构建界面
          detail: 提示词输入框、Project Editor、Canvas、Preview 和发布面板把设计、代码和上线留在同一个 UI。
        - label: 智能体编排层
          detail: Plan Mode、Build Mode、任务板、后台任务和智能体模式负责执行和评审。
        - label: 内置应用服务
          detail: Auth、托管数据库、App Storage、连接器和测试工具都在构建流程内完成配置。
        - label: 运行时与运维层
          detail: 构建完成后，Snapshot 发布、自动扩缩容或定时运行时、域名、分析、监控和安全工作流开始运行。
        - label: 外部生态
          detail: 云厂商、模型提供商、SaaS 连接器、数据仓库、MCP 客户端和移动分发系统，把栈延伸到 Replit 之外。
