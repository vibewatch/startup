      - number: '7.2'
        title: 定价信任和企业采购摩擦可能压住本应强劲的采用
        blocks:
          - type: paragraph
            body: >-
              Replit 的模式风险紧贴它如何把智能能力变现。公司明确表示，AI 使用、发布、数据库和其他服务都会消耗按用量计的积分，并把按工作量计价解释为让用户收费与 Replit
              自身算力成本对齐。这在经济上可以说得通，但也意味着聊天更长、项目更大、工作流更自主时，即便可见代码改动很小，账单也可能更高。官方文档提供消费上限、关停上限、预算和单用户额度，但文档把许多控制描述成客户必须主动配置的设置。法律条款又叠加一层信任挑战：Replit
              条款允许有限的订阅退款，却把按用量收费列为不可退款。产品行为仍在演进时，这种组合在实践中最容易引发争议。


              外部证据表明，问题并非假设。InfoWorld、The Register、Trustpilot
              和一篇语气强硬的开发者文章，都描述了同一类抱怨的不同版本：意外收费、提醒界面薄弱、编辑既有代码成本高，或信任已经破裂后才升级客服支持。Replit 的自助式企业版路径让标准买家无需漫长销售周期就能获得
              SSO、SCIM、池化积分和即时开通，从而降低摩擦。但同一批公开材料也说明，更大承诺、定制条款或特殊采购要求仍需要销售协助。也就是说，Replit
              降低了入门摩擦，却没有彻底消除尽调摩擦。如果买方接受这种模式，商业上行空间很明显；风险在于，计费不透明、退款刚性或信任材料不完整，会把好奇心转化成一次性使用，而不是可持续的企业扩张。
