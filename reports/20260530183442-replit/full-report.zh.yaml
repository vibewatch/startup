  - id: FE002
    title: 客户工作流与运营流程
    type: flow
    layout: wide
    summary: 典型 Replit 工作流从提示词和规划出发，进入并行执行、迭代设计、测试和发布时运维。
    data:
      nodes:
        - id: prompt
          label: 描述想法
          detail: 用户从 Agent、General Agent 或模板驱动项目开始。
        - id: plan
          label: 规划与定范围
          detail: Plan Mode 或任务规划会拆解需求，并定义完成条件。
        - id: parallel
          label: 运行任务
          detail: 后台任务在隔离副本中执行，并受不同套餐的并发限制约束。
        - id: design
          label: 在 Canvas 上迭代 UI
          detail: Builder 对比变体，并把选中的改动写回应用。
        - id: services
          label: 接入服务
          detail: Agent 配置认证、数据、集成或自动化流程。
        - id: test
          label: 预览与测试
          detail: 用户检查应用行为，Agent 模式和测试功能辅助验证工作。
        - id: publish
          label: 发布与运营
          detail: 应用部署到运行时，随后在生产环境中监控和加固。
      edges:
        - from: prompt
          to: plan
          label: 澄清意图
        - from: plan
          to: parallel
          label: 批准任务
        - from: parallel
          to: design
          label: 边执行边迭代
        - from: parallel
          to: services
          label: 配置应用组件
        - from: design
          to: test
          label: 应用选中变体
        - from: services
          to: test
