      - number: '4.4'
        title: 财务结论、负面证据与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Replit 最强的财务论点，是其定价架构终于匹配了所售产品的经济性。一个调用大模型、后台智能体、托管、数据库和企业支持的产品，不应表现得像固定纯席位 SaaS；Replit
              的计费文档明确显示它不是。最强的悲观论点，是同一架构可能先制造信任和实现问题，之后才制造持久利润率。Replit 自己的复盘承认，2025 年 7 月事件中，检查点定价推出影响了约 6%
              付费用户；InfoWorld 和 The Register 都描述了客户对成本超支的失望；存档 Trustpilot
              评论则显示对意外收费、退款摩擦和支出可见性差的投诉。这些信号不能否定商业模式，但说明定价质量仍在建设中。公开可比公司强化了这一点：Dropbox 披露的 10-K
              显示，即使成熟云软件公司也要在毛利以下吸收基础设施、带宽、支持和支付处理成本，而 Replit 在基础云栈之上又叠加了昂贵 AI 推理。因此，本章最终结论是建设性但不完整。Replit
              看起来拥有真实收入引擎、可信融资支持和可随用量扩张的变现设计，但公开证据仍让实际 ACV、毛利率、烧钱速度、现金跑道、CAC、回本周期、NRR 和集中度成为仍需承销的活问题，而不是已关闭的事实。
