      - number: '3.3'
        title: 分发能力、切换成本、锁定效应与多栖使用
        blocks:
          - type: paragraph
            body: >-
              最大的结构性问题不是谁的 Agent 演示最炫，而是谁控制分发、买方已经在哪里工作。GitHub 和 Microsoft 在这里优势最清楚。保留的官方页面显示，Copilot 横跨
              GitHub、IDE、终端和后台智能体，而 Codespaces 把同一栈变成安全的云开发环境。JetBrains 又给出独立证据：Copilot 仍是工作中使用最广的 AI
              编码工具，在超大型公司尤其强。这种分发能力使 GitHub 成为 Replit 最难撼动的既有玩家。Replit 的优势是跨职能或浏览器优先构建者的初始摩擦更低，但同一类别也显示硬锁定不高。v0 明确可与
              GitHub 同步并部署到 Vercel，VS Code 仍然开源且熟悉，Sonar 称平均团队已经同时使用四种 AI
              编码工具。换句话说，多栖使用是常态，不是例外。买方可以用一种方式做原型、用另一种方式上线，或并行保留多个智能体。因此，Replit 受益于工作流压缩和上手便利，但不能假设用户一旦从 Replit
              开始，就会在工作负载变得安全敏感、以代码库为中心或围绕既有工具标准化之后继续留在那里。
