  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 定价架构与收入模式
        blocks:
          - type: paragraph
            body: >-
              Replit 的变现模式已不再是简单的席位订阅。官方定价和计费文档显示了分层结构：Starter 仍免费，Core 是低门槛付费计划，Pro 是更大的积分计划，Enterprise
              则进入谈判条款、共享积分、开票、年度承诺，以及 SSO、SCIM、单租户选项等治理功能。同样重要的是，Replit 现在变现的不只是编辑器访问权。官方计费页面称，月度积分适用于 Agent
              使用，也适用于发布、存储和数据库服务；按用量计费进一步延伸到出站数据传输、算力单元、请求、数据库计算时间和存储。这一架构对 AI 原生构建平台有经济合理性，因为某些工作负载的服务成本显著更高。Replit
              自己的定价复盘称，Agent
              能够自主工作更长会话后，旧的固定检查点模式失效，有时成本超过固定费用可回收范围。结果是一个财务上合理、运营上敏感的模型：收入可以随客户使用和复杂度扩张，但客户更难预测实际价格，外部也更难只靠标价页面建模。
