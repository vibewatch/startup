      - number: '6.5'
        title: 耐久性、扩张潜力与集中度缺口
        blocks:
          - type: paragraph
            body: >-
              公开证据对扩张的支持明显强于对留存的支持。案例研究、企业控制和合作伙伴公告结合起来，说明 Replit
              可以用多种方式落地：个人构建者、非技术运营者、企业倡导者、教育用户和伙伴驱动的市场进入动作。使用一旦嵌入内部仪表盘、运营工作流和受治理工作区，平台就能通过增加协作者、已发布应用、部门或正式企业控制来扩张。这是本章的核心客户上行空间。


              尽调图景缺失的另一半，是耐久性披露。保留的一手或可信第三方来源都没有公开 NRR、GRR、合同期限、续约率或客户集中度指标。公开客户证明集也不是按收入加权的；标识墙、案例研究和合作伙伴新闻稿无法告诉投资者，ARR
              有多大比例集中在前十名账户，或企业试用中有多少比例真正转化为持久席位或用量增长。政府 / 公共部门证明也是另一个缺口：Replit
              显然希望通过伙伴计划进入这条线，但直接公共部门客户证据仍远薄于企业或教育证据。正确的尽调解读是，Replit 的客户采用叙事真实且异常宽广，但长期留存经济性和集中度风险仍需要管理层级数据，而不是公开网络推断。
