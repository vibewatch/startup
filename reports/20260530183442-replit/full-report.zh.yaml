        - 已保留来源中，公开产品线规模未知
        - 希望在现有环境中使用 agent 的开发者和高级技术用户
        - 多端 agent 工作流很强，支持本地机器和面向 PR 的自动化
        - 定位不是浏览器原生全栈应用构建器
      - - Devin / Cognition
        - 自主 AI 软件工程师
