      - number: '1.2'
        title: 领导团队、治理信号与总部歧义
        blocks:
          - type: paragraph
            body: >-
              公开领导层证据在具名高管层面异常具体，在治理层面却异常单薄。Replit 的介绍页面列出 Amjad Masad 为创始人兼 CEO，Haya Odeh 为联合创始人、设计，Luis Héctor Chávez
              为 CTO，Michele Catasta 为总裁，Scott Kennedy 为工程副总裁。这给后续章节提供了可用的管理层名单，但也凸显 Masad
              和创始团队的关键人集中度，因为公开来源没有给出清晰的董事会名单、观察员名单或当前所有权图谱。治理披露转而通过产品控制间接体现。官方企业材料强调
              SSO/SAML、SCIM、权限、审计日志、审批，甚至单租户部署选项，支撑了 Replit 正试图进入大型组织可接受范围的叙事。最清楚的未决问题是实体总部。官方和合作伙伴发布反复称 Replit 总部在 San
              Francisco，但 CNBC 的 2026 Disruptor 简介和 Forbes 公司简介列的是 Foster City,
              California。第一章的正确处理不是猜哪个在法律上正确，而是把这个差异作为未解尽调项继续带下去，同时承认公司的重心在 San Francisco Bay Area，公开材料也确实显示了真实的管理班底。
