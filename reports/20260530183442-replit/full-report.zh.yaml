    rows:
      - - Agent 构建循环
        - 个人构建者或团队
        - 从提示生成应用、重构、调试并执行任务
        - 产品页、Agent 4 发布和任务文档都把它放在核心入口
        - 接入运行时、文件、发布和平台服务，而不只是代码助手
