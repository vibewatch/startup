      - - v0 / Vercel
        - 绑定 Vercel 技术栈的从提示词到 Web 应用构建器
        - 已保留来源中，v0 单独规模未知
        - 前端占比高的团队、设计工程工作流、以 Vercel 为中心的构建者
        - 从提示词生成全栈 Web 应用，支持 GitHub 同步和一键 Vercel 部署
        - 基础设施引力可能有助采用，但相比 Replit 更宽的创作者叙事，它更聚焦 Web 技术栈
      - - 开发栈：GitHub Copilot + Codespaces + VS Code
        - 既有模块化开发者技术栈
        - Microsoft/GitHub 既有分发；已保留来源未披露 Copilot 准确收入
        - 已在 GitHub 和 VS Code 上标准化的工程组织
        - 凭安装基数形成最强分发，云开发环境、策略控制和熟悉代码库也有优势
        - 模块化技术栈很强，但对非工程师、浏览器优先的应用创建不够一体化
      - - Claude Code
