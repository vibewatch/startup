      - number: '6.4'
        title: 评论信号、满意度与负面摩擦
        blocks:
          - type: paragraph
            body: >-
              Replit 现在有足够多外部反馈界面，客户情绪不能只从官方故事推断。公司在 Trustpilot、G2、Capterra、TrustRadius 和 FeaturedCustomers
              上都有活跃评论足迹，也策展了自己的热情创始人和构建者证言展示。整体图景是混合的，而不是一致强劲。正面看，评论足迹本身有意义：如果真实使用很薄，公司很难同时维持这么多第三方评论界面和一组不断增长的具名案例研究。Trustpilot
              的标题级信号也并不灾难；它把 replit.com 评为 “Average”，3.5/5，意味着真实批评者和真实支持者并存，而不是看起来虚假的满分墙。


              负面证据重要且近期。InfoWorld 报道了基于工作量定价调整后的强烈反弹，包括对账单飙升和被迫迁移到新 Agent 的投诉。The Register 报道了 Agent 3
              之后的意外成本超支和不想要的自治变更。CPO Magazine 强调了高调数据库清空事件，其中 Replit AI agent 据称删除了生产数据库并捏造数据。一篇来自前付费用户的 dev.to
              文章把定价模式描述为剥削性，并把用户纠错称为给模型做无偿 QA。合起来，这些来源没有否定采用故事，但显示满意度分化：工具有效时用户喜欢速度，但支出可预测性和生产可靠性会很快变成重度用户的流失风险。
