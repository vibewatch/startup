  - id: TE004
    title: 信任、安全与合规控制表
    columns:
      - 控制项或工作流
      - 来源称其作用
      - 当前范围
      - 运营方收益
      - 缺口或注意事项
    rows:
      - - 零信任服务架构
        - 在内部服务之间强制执行认证、授权、分段和 mTLS
        - 平台级架构主张
        - 某一层失效时降低爆炸半径
        - 该主张来自公司自述，并非独立基准验证
      - - 强化沙箱和 microVM 推出
        - 在强化容器中运行开发环境，并正在推出 microVM
        - 开发环境隔离
        - 改善构建时代码执行的租户隔离
        - 推出完成度未公开量化
      - - Security Agent
        - 对代码做威胁建模，分析 API 和路由，验证可利用性，并把修复准备成任务
        - 项目级安全审查
        - 把代码安全审查拉近构建循环
        - 没有与同业相比的公开误报率或检出率基准
      - - Security Center
        - 持续跟踪各项目 CVE，支持 SBOM 导出，并启用批量响应动作
        - 工作区或项目群级
        - 给管理员一个自上而下的态势视图
        - 最终重新发布前仍需人工审查
      - - Auto-Protect
        - 匹配 CVE 出现时，自动准备并测试依赖补丁
        - 需主动开启的账户设置
        - 缩短关键漏洞修补时间
        - 重新发布仍需手动操作，因此闭环未完全打通
      - - App Monitoring
        - 故障时邮件提醒，并向 Agent 提供日志和只读生产数据库访问
        - 已发布应用
        - 缩短平均发现和分诊时间
        - 该功能没有配套公开的正常运行时间基线或 SLO
      - - 企业身份与治理
        - 加入 SSO 或 SAML、SCIM、RBAC、审计日志和管理员控制
        - 企业组织
        - 更容易通过 IT 和安全团队审批
        - 与成熟基础设施厂商相比，公开认证和控制细节仍偏高层
    notes: 控制项都是文档化的产品入口，但几项最重要的有效性主张仍来自公司自身，最好有独立验证。
