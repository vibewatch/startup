  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 公开单位 / 状态
      - 质量判断
      - 成本驱动 / 风险
      - 尽调问题
    rows:
      - - Starter 漏斗
        - 免费入口把构建者导向后续付费套餐和付费用量
        - 免费；每日 Agent 积分；1 个已发布应用
        - 获客漏斗强，但不是直接收入
        - 免费用户仍会消耗支持和基础设施
        - 按分群和项目成熟度拆分免费转付费率
      - - Core 订阅
        - 面向个人项目和简单应用的低端付费会员
        - Core：按年计费 $20/月，含 $25 月度积分
        - 存在公开定价的经常性基础收入
        - 如果用量超过内含积分，小套餐可能亏损
        - 付费 Core 账户数、混合 ARPU、流失率和升级率
      - - Pro 订阅
        - 面向商业和专业构建的更高价值付费会员
        - Pro：定价页入门套餐 $95/月；文档描述阶梯式月度积分，并可滚存一个月
        - 可见自助变现里最好的升级台阶
        - 重积分套餐会让 Replit 暴露在模型成本波动中
        - 付费 Pro 账户数、按积分档位计算的实际价格和超额用量组合
      - - 超出内含积分的 Agent 用量
        - AI 工作消耗积分，并可能触发额外支出或购买积分包
        - 基于积分和按工作量定价来计量用量
        - 扩张收入可随工作负载强度放大
        - 支出可预测性弱于固定席位 SaaS
        - 来自超额用量或额外积分包的收入占比
      - - 发布与基础设施用量
        - 已发布应用、请求、计算、出站流量、数据库和存储都会消耗积分，并可能产生月度费用
        - 请求、计算单元、数据传输、数据库计算时间和存储均按用量计费
        - 变现与生产应用用量挂钩，不只绑定席位
        - 基础设施毛利率可能随客户工作负载大幅波动
        - 订阅收入与基础设施相关用量收入拆分
      - - Enterprise 合同
        - 议价后的企业套餐打包治理、支持、开票，以及更高席位或用量承诺
        - 定制条款；年度承诺；开票；共享积分
        - 可能是 ACV 最高的收入流，但公开信息不透明
        - 折扣、服务内容和回款条款未知
        - ACV 中位数、期限、最低承诺和续约画像
      - - 嵌入式支付 / 伙伴驱动变现
        - Visa 和伙伴计划未来可能增加交易型或分发驱动的变现
        - 仍处探索阶段，尚未披露为收入线
        - 有意思的上行选项，但不是当前核心收入
        - 转化为重大确认收入可能需要时间
        - 路线图、附加率和支付相关功能的经济模型
    notes: 各行区分变现机制和已实现收入确认。公开证据只显示标价或战略意图时，表中直接写明限制。
