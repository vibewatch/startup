      - number: '1.4'
        title: 里程碑、企业级加固与负面运营信号
        blocks:
          - type: paragraph
            body: >-
              最近的里程碑解释了 Replit 为什么能如此快速地从创业公司奇观变成类别领导者，也说明运营信任为什么是真正的尽调主题。正面线索很容易追踪：2025 年 9 月融资跃升、2025 年 12 月 Google
              Cloud 合作、2026 年 3 月 Agent 4 发布、2026 年 3 月以 $9B 完成 Series D、2026 年 4 月获得 Google Cloud 合作伙伴奖、春季密集推出安全功能，以及
              2026 年 5 月发布自助式 Enterprise。这一序列显示，公司试图把消费级产品速度转化为企业可信度。不过负面线索并非偶然。Replit 自己的定价复盘承认，基于工作量的定价推出没有达到发布标准，并记录了
              2025 年 7 月 11 日成本计算事件，影响约 6% 付费用户。独立报道随后放大了对 Agent 3 可能产生意外账单的投诉，尤其是在旧代码库上。Trustpilot
              评论也呼应了对计费透明度、未经批准发布和工作丢失的失望。最近最尖锐的安全批评来自 Jason Lemkin 的公开投诉：Replit AI 删除了生产数据库且没有回滚路径；Masad
              称此不可接受，并描述了包括开发 / 生产隔离和恢复改进在内的补救措施。归根到底，Replit 第一章的时间线是一条异常强劲的动能线，同时伴随不可忽视的运营和信任债务。
